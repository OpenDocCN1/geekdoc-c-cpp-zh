    # 第 19 章：计算向量之和\n\n## 征服集合：C++ 中的高效向量求和\n计算向量中元素的和是许多 C++ 程序中的基础操作。本指南探索了实现此任务的不同方法，并强调了它们的效率和代码清晰度。\n\
    \n### 朴素的 for 循环：直接的方法\n经典的 `for` 循环遍历向量的每个元素，将其累加到总和。这种方法易于理解和实现，适合初学者。\n\n```cpp\n\
    #include <iostream>\n#include <vector>\n\nint main() {\n    std::vector<int> numbers\
    \ = {1, 2, 3, 4, 5};\n    int sum = 0;\n    for (int element : numbers) {\n  \
    \      sum += element;\n    }\n    std::cout << \"Sum of elements: \" << sum <<\
    \ std::endl;\n    return 0;\n}\n```\n\n**优点：**\n-   易于理解和实现。\n-   适用于教学或小型向量。\n\
    \n**权衡：**\n-   对于大型向量，由于每次迭代都有多次内存访问，效率可能较低。\n-   对于循环内部复杂的计算，代码可能会显得冗长。\n\n###\
    \ std::accumulate 算法：函数式方法\nC++ 标准模板库 (STL) 提供了 `std::accumulate` 算法来实现高效的向量求和。它接受迭代器范围、求和的初始值和一个二元函数（如加法）作为参数。\n\
    \n```cpp\n#include <iostream>\n#include <vector>\n#include <numeric>\n\nint main()\
    \ {\n    std::vector<int> numbers = {1, 2, 3, 4, 5};\n    int sum = std::accumulate(numbers.begin(),\
    \ numbers.end(), 0);\n    std::cout << \"Sum of elements: \" << sum << std::endl;\n\
    \    return 0;\n}\n```\n\n**优点：**\n-   与 `for` 循环相比，代码更简洁且易读。\n-   由于优化的实现，对于大型向量可能更高效。\n\
    \n**权衡：**\n-   需要熟悉 STL 算法。\n-   对求和过程中特定元素的访问或计算的控制较少。\n\n### 使用 += 运算符的范围 for\
    \ 循环：现代方法\nC++11 引入了基于范围的 `for` 循环，它可以遍历元素。这种方法结合了 `for` 循环的易读性和 `+=` 运算符的简洁性。\n\
    \n```cpp\n#include <iostream>\n#include <vector>\n\nint main() {\n    std::vector<int>\
    \ numbers = {1, 2, 3, 4, 5};\n    int sum = 0;\n    for (int element : numbers)\
    \ {\n        sum += element;\n    }\n    std::cout << \"Sum of elements: \" <<\
    \ sum << std::endl;\n    return 0;\n}\n```\n\n**优点：**\n-   代码简洁，与 `for` 循环相似。\n\
    -   由于编译优化，可能更高效。\n\n**权衡：**\n-   对于习惯传统 `for` 循环的程序员可能不太熟悉。\n-   对元素的访问控制有限。\n\
    \n### 选择合适的方法\n最佳方法取决于你的特定需求和编码偏好：\n-   对于教学目的或小型向量，`for` 循环是一个很好的起点。\n-   对于简洁且可能优化的代码，考虑\
    \ `std::accumulate`。\n-   对于更现代且可能高效的方法，使用带有 `+=` 运算符的范围 `for` 循环。\n\n### 不止求和\n\
    这些方法可以适用于更复杂的计算。除了简单的加法，你可以在循环中使用自定义 Lambda 表达式或 `std::accumulate` 算法来执行元素级操作。\n\
    \n### 结论\nC++ 提供了多种计算向量和的方法。通过理解优点、权衡和合适的模式，你可以根据特定需求选择最合适的方法，确保代码高效且易读。\n\n###\
    \ 前行之路\nSTL 算法的世界提供了一个极其广阔的探索领域。深入研究以下高级主题：\n-   变换：探索 `std::transform` 等算法，在求和之前修改元素以进行更复杂的计算。\n\
    -   并行算法：对于巨大的向量，考虑 `std::reduce` 等并行算法，以在多核系统上获得潜在性能提升。\n-   自定义算法：如果你的特定求和逻辑偏离基础操作，可以创建自定义算法以定制功能。\n\
    \n# 使用线程并行求和\n## 释放核心：使用 C++ 线程进行并行向量求和（扩展指南）\n\n"
- fmt: "\nCalculating the sum of a large vector can be a bottleneck in computationally\
    \ intensive applications. This guide explores parallel summation using C++ threads,\
    \ unlocking the power of multi-core processors for faster execution. We'll delve\
    \ into the concepts, patterns, considerations, and trade-offs to empower you to\
    \ write efficient and scalable C++ code.\n\n## The Serial Bottleneck: A Single\
    \ Thread's Limitation\n\nThe traditional `for` loop approach iterates through\
    \ the vector on a single thread. This becomes inefficient for large datasets as\
    \ the CPU can handle multiple tasks concurrently. While the CPU processes instructions\
    \ very quickly, it can only execute one instruction at a time for a single thread.\
    \ In a multi-core processor, other cores remain idle during this serial execution,\
    \ hinderring overall performance.\n\n## Parallel Summation with Threads: Dividing\
    \ and Conquering\n\nThe key to parallel summation lies in dividing the vector\
    \ into smaller chunks and processing them simultaneously on separate threads.\
    \ This approach leverages the capabilities of multi-core processors, allowing\
    \ multiple cores to work on the summation task concurrently. Here's the general\
    \ pattern for parallel vector summation with C++ threads:\n\n1. **Divide the Vector**:\
    \ Split the vector into sub-vectors based on the number of available cores. This\
    \ ensures each thread has a roughly equal amount of work to perform.\n2. **Create\
    \ Threads**: Spawn a thread for each sub-vector. Each thread will be responsible\
    \ for calculating the sum of its assigned elements.\n3. **Partial Sums**: Each\
    \ thread calculates the sum of its assigned sub-vector. This calculation can be\
    \ done using a simple `for` loop or more complex operations within the loop.\n\
    4. **Combine Results**: Combine the partial sums from all threads to obtain the\
    \ final result. This typically involves synchronization mechanisms to ensure thread-safe\
    \ access to a shared variable accumulating the partial sums.\n\n### Common Parallel\
    \ Summation Patterns:\n\n* **Thread-Local Arrays**: Each thread allocates a temporary\
    \ array to store the partial sum for its assigned sub-vector. This approach avoids\
    \ false sharing, a cache invalidation issue that can occur when multiple threads\
    \ access the same memory location frequently.\n* **Atomic Operations**: Use atomic\
    \ operations like `std::atomic<int>` for thread-safe updates to a shared variable\
    \ accumulating the partial sums. Atomic operations guarantee that read and write\
    \ operations to a variable are indivisible, preventing race conditions where multiple\
    \ threads might access and modify the value inconsistently.\n\n### Simplified\
    \ Example: Parallel Vector Summation (C++11 Threads):\n\n```cpp\n#include <iostream>\n\
    #include <vector>\n#include <thread>\n#include <atomic>\n\nint parallel_sum(const\
    \ std::vector<int>& numbers) {\n    int num_threads = std::thread::hardware_concurrency();\n\
    \    std::vector<std::thread> threads(num_threads);\n    std::atomic<int> total_sum(0);\n\
    \n    // Divide the vector into subvectors (assuming uniform size for simplicity)\n\
    \    size_t chunk_size = numbers.size() / num_threads;\n\n    for (size_t i =\
    \ 0; i < num_threads; ++i) {\n        size_t start_index = i * chunk_size;\n \
    \       size_t end_index = (i == num_threads - 1) ? numbers.size() : start_index\
    \ + chunk_size;\n        threads[i] = std::thread([&numbers, start_index, end_index,\
    \ &total_sum] {\n            int partial_sum = 0;\n            for (size_t j =\
    \ start_index; j < end_index; ++j) {\n                partial_sum += numbers[j];\n\
    \            }\n            total_sum += partial_sum;\n        });\n    }\n\n\
    \    // Wait for all threads to finish\n    for (auto& thread : threads) {\n \
    \       thread.join();\n    }\n    return total_sum.load(); // Use load() to retrieve\
    \ final atomic value\n}\n\nint main() {\n    std::vector<int> numbers(100000,\
    \ 1);\n    int sum = parallel_sum(numbers);\n    std::cout << \"Parallel sum:\
    \ \" << sum << std::endl;\n    return 0;\n}\n```\n\n### Benefits of Parallel Summation:\n\
    \n* **Faster Execution**: Utilizes multiple CPU cores, potentially leading to\
    \ significant speedups for large datasets. By distributing the workload across\
    \ multiple threads, the CPU can work on multiple calculations simultaneously,\
    \ significantly reducing the overall execution time.\n* **Improved Scalability**:\
    \ Scales well with increasing CPU cores, allowing for efficient processing of\
    \ even larger workloads. As the number of cores increases, the potential for performance\
    \ gains through parallelization also increases.\n\n## Parallel Summation with\
    \ the STL\n\n### Leveraging the Power of the Crowd: Parallel Vector Summation\
    \ with the STL\n\nCalculating the sum of a large vector is a frequent task in\
    \ C++. While traditional approaches work well for small datasets, they become\
    \ inefficient for massive collections. This guide explores parallel summation\
    \ using the C++ Standard Template Library (STL), enabling you to harness the processing\
    \ power of multi-core processors for significant performance gains. We'll delve\
    \ into patterns, considerations, and trade-offs to empower you with the knowledge\
    \ to write efficient and scalable C++ code.\n\n### The Serial Shortcoming: Bottlenecked\
    \ by a Single Thread\n\nThe classic `for` loop iterates through the vector on\
    \ a single thread, accumulating the sum element by element. This approach becomes\
    \ a bottleneck for large datasets. Modern CPUs have multiple cores capable of\
    \ processing instructions simultaneously. However, a single thread cannot fully\
    \ utilize this parallelism, leading to underutilized resources and slower execution\
    \ times.\n\n### Parallel Summation with the STL: Divide and Conquer with Algorithms\n\
    \nThe STL offers powerful algorithms for parallel processing. Here's how to achieve\
    \ parallel vector summation using the STL:\n\n1. **Divide the Vector**: Similar\
    \ to thread-based parallelism, the vector is divided into sub-vectors (or chunks)\
    \ for processing by parallel algorithms. Built-in functions like `std::distance`\
    \ and arithmetic operators can be used for efficient division.\n2. **Execution\
    \ Policy**: The STL provides execution policies like `std::execution::par` to\
    \ specify parallel execution. This policy instructs the underlying algorithm to\
    \ utilize multiple threads.\n3. **Parallel Summation Algorithm**: Algorithms like\
    \ `std::accumulate` can be used with the parallel execution policy to calculate\
    \ the sum of each sub-vector in parallel.\n4. **Combine Partial Sums**: The partial\
    \ sums calculated for each sub-vector need to be combined to obtain the final\
    \ result. This algorithms offer optimized parallel processing.\n\n### Common Parallel\
    \ Summation Patterns with the STL:\n\n* **std::accumulate with Parallel Execution\
    \ Policy**: This is the most straightforward approach. Wrap the `std::accumulate`\
    \ call with the `std::execution::par` policy to enable parallel summation.\n*\
    \ **Custom Parallel Algorithm with std::transform_reduce**: This pattern offers\
    \ more flexibility by allowing custom logic within the summation process. The\
    \ `std::transform_reduce` algorithm applies a transformation (e.g., identity function\
    \ for summation) to each element and then reduces them using the parallel execution\
    \ policy.\n\n### Simplified Example: Parallel Vector Summation with std::accumulate\
    \ (C++17):\n\n```cpp\n#include <iostream>\n#include <vector>\n#include <numeric>\n\
    #include <execution>\n\nint parallel_sum(const std::vector<int>& numbers) {\n\
    \    size_t num_elements = numbers.size();\n    // Divide the vector into subvectors\
    \ (assuming uniform size for simplicity)\n    size_t chunk_size = std::max<size_t>(1,\
    \ num_elements / std::thread::hardware_concurrency());\n\n    // Parallel summation\
    \ with std::accumulate and parallel execution policy\n    return std::accumulate(numbers.begin(),\
    \ numbers.end(), 0, std::execution::par);\n}\n\nint main() {\n    std::vector<int>\
    \ numbers(100000, 1);\n    int sum = parallel_sum(numbers);\n    std::cout <<\
    \ \"Parallel sum: \" << sum << std::endl;\n    return 0;\n}\n```\n\n### Benefits\
    \ of Parallel Summation with the STL:\n\n* **Convenience**: Leverages existing,\
    \ optimized STL algorithms for parallel processing.\n* **Readability**: Code is\
    \ typically concise and easier to maintain compared to manual thread management.\n"
  raw: 'Calculating the sum of a large vector can be a bottleneck in computationally
    intensive applications. This guide explores parallel summation using C++ threads,
    unlocking the power of multi-core processors for faster execution. We''ll delve
    into the concepts, patterns, considerations, and trade-offs to empower you to
    write efficient and scalable C++ code.


    The Serial Bottleneck: A Single Thread''s Limitation


    The traditional for loop approach iterates through the vector on a single thread.
    This becomes inefficient for large datasets as the CPU can handle multiple tasks
    concurrently. While the CPU processes instructions very quickly, it can only execute
    one instruction at a time for a single thread. In a multi-core processor, other
    cores remain idle during this serial execution, hindering overall performance.


    Parallel Summation with Threads: Dividing and Conquering


    The key to parallel summation lies in dividing the vector into smaller chunks
    and processing them simultaneously on separate threads. This approach leverages
    the capabilities of multi-core processors, allowing multiple cores to work on
    the summation task concurrently. Here''s the general pattern for parallel vector
    summation with C++ threads:


    1. Divide the Vector: Split the vector into sub-vectors based on the number of
    available cores. This ensures each thread has a roughly equal amount of work to
    perform.


    2. Create Threads: Spawn a thread for each sub-vector. Each thread will be responsible
    for calculating the sum of its assigned elements.


    3. Partial Sums: Each thread calculates the sum of its assigned sub-vector. This
    calculation can be done using a simple for loop or more complex operations within
    the loop.


    4. Combine Results: Combine the partial sums from all threads to obtain the final
    result. This typically involves synchronization mechanisms to ensure thread-safe
    access to a shared variable accumulating the partial sums.


    Common Parallel Summation Patterns:


    ● Thread-Local Arrays: Each thread allocates a temporary array to store the partial
    sum for its assigned sub-vector. This approach avoids false sharing, a cache invalidation
    issue that can occur when multiple threads access the same memory location frequently.


    ● Atomic Operations: Use atomic operations like std::atomic<int> for thread-safe
    updates to a shared variable accumulating the partial sums. Atomic operations
    guarantee that read and write operations to a variable are indivisible, preventing
    race conditions where multiple threads might access and modify the value inconsistently.


    Simplified Example: Parallel Vector Summation (C++11 Threads):


    C++


    #include <iostream>


    #include <vector>


    #include <thread>


    #include <atomic>


    int  parallel_sum(const  std::vector<int>& numbers) {


    int num_threads = std::thread::hardware_concurrency();


    std::vector<std::thread> threads(num_threads);


    std::atomic<int> total_sum(0);


    // Divide the vector into subvectors (assuming uniform size for simplicity)


    size_t chunk_size = numbers.size() / num_threads;


    for (size_t i = 0; i < num_threads; ++i) {


    size_t start_index = i * chunk_size;


    size_t end_index = (i == num_threads - 1) ? numbers.size() : start_index + chunk_size;


    threads[i] = std::thread([n numbers, start_index, end_index, &total_sum] {


    int partial_sum = 0;


    for (size_t j = start_index; j < end_index; ++j) {


    partial_sum += numbers[j];


    }


    total_sum += partial_sum;


    });


    }


    // Wait for all threads to finish


    for (auto& thread : threads) {


    thread.join();


    }


    return total_sum.load(); // Use load() to retrieve final atomic value


    }


    int  main() {


    std::vector<int> numbers(100000, 1);


    int sum = parallel_sum(numbers);


    std::cout << "Parallel sum: " << sum << std::endl;


    return  0;


    }


    Benefits of Parallel Summation:


    ● Faster Execution: Utilizes multiple CPU cores, potentially leading to significant
    speedups for large datasets. By distributing the workload across multiple threads,
    the CPU can work on multiple calculations simultaneously, significantly reducing
    the overall execution time.


    ● Improved Scalability: Scales well with increasing CPU cores, allowing for efficient
    processing of even larger workloads. As the number of cores increases, the potential
    for performance gains through parallelization also increases.


    # Parallel Summation with the STL


    Leveraging the Power of the Crowd: Parallel Vector Summation with the STL


    Calculating the sum of a large vector is a frequent task in C++. While traditional
    approaches work well for small datasets, they become inefficient for massive collections.
    This guide explores parallel summation using the C++ Standard Template Library
    (STL), enabling you to harness the processing power of multi-core processors for
    significant performance gains. We''ll delve into patterns, considerations, and
    trade-offs to empower you with the knowledge to write efficient and scalable C++
    code.


    The Serial Shortcoming: Bottlenecked by a Single Thread


    The classic for loop iterates through the vector on a single thread, accumulating
    the sum element by element. This approach becomes a bottleneck for large datasets.
    Modern CPUs have multiple cores capable of processing instructions simultaneously.
    However, a single thread cannot fully utilize this parallelism, leading to underutilized
    resources and slower execution times.


    Parallel Summation with the STL: Divide and Conquer with Algorithms


    The STL offers powerful algorithms for parallel processing. Here''s how to achieve
    parallel vector summation using the STL:


    1. Divide the Vector: Similar to thread-based parallelism, the vector is divided
    into sub-vectors (or chunks) for processing by parallel algorithms. Built-in functions
    like std::distance and arithmetic operators can be used for efficient division.


    2. Execution Policy: The STL provides execution policies like std::execution::par
    to specify parallel execution. This policy instructs the underlying algorithm
    to utilize multiple threads if available.


    3. Parallel Summation Algorithm: Algorithms like std::accumulate can be used with
    the parallel execution policy to calculate the sum of each sub-vector in parallel.
    These algorithms offer optimized implementations for efficient parallel processing.


    4. Combine Partial Sums: The partial sums calculated for each sub-vector need
    to be combined to obtain the final result. This can be achieved using another
    std::accumulate call, but with a sequential execution policy.


    Common Parallel Summation Patterns with the STL:


    ● std::accumulate with Parallel Execution Policy: This is the most straightforward
    approach. Wrap the std::accumulate call with the std::execution::par policy to
    enable parallel summation.


    ● Custom Parallel Algorithm with std::transform_reduce: This pattern offers more
    flexibility by allowing custom logic within the summation process. The std::transform_reduce
    algorithm applies a transformation (e.g., identity function for summation) to
    each element and then reduces them using the parallel execution policy.


    Simplified Example: Parallel Vector Summation with std::accumulate (C++17):


    C++


    #include <iostream>


    #include <vector>


    #include <numeric>


    #include <execution>


    int  parallel_sum(const  std::vector<int>& numbers) {


    size_t num_elements = numbers.size();


    // Divide the vector into subvectors (assuming uniform size for simplicity)


    size_t chunk_size = std::max<size_t>(1, num_elements / std::thread::hardware_concurrency());


    // Parallel summation with std::accumulate and parallel execution policy


    return  std::accumulate(numbers.begin(), numbers.end(), 0,


    std::execution::par);


    }


    int  main() {


    std::vector<int> numbers(100000, 1);


    int sum = parallel_sum(numbers);


    std::cout << "Parallel sum: " << sum << std::endl;


    return  0;


    }


    Benefits of Parallel Summation with the STL:


    ●     Convenience: Leverages existing, optimized STL algorithms for parallel processing.


    ● Readability: Code is typically concise and easier to maintain compared to manual
    thread management.'
