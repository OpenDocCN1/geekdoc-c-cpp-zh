  \ `C++` 的最佳方法。\n\n![](img/privat----RainerGrimm.jpg)\n\nRainer Grimm\n\n# 关于 C++\n\
  \n## 1. 历史背景\n\n`C++20` 是 `C++11` 之后的下一个大型 `C++` 标准。与 `C++11` 一样，`C++20` 改变了我们在现代\
  \ `C++` 中的编程方式。这种变化主要源于语言增加了 `Concepts`、`Modules`、`Ranges` 和 `Coroutines`。为了理解 `C++`\
  \ 演进的这一大步，让我写一些关于 `C++20` 历史背景的内容。\n\n![](img/timeline----TimelineCpp.png)\n\nC++\
  \ 历史\n\n`C++` 有约 40 年的历史了。以下是过去几年变化的简单概述。\n\n### 1.1 C++98\n\n80 年代末，Bjarne Stroustrup\
  \ 和 Margaret A. Ellis 编写了著名的书籍 [Annotated C++ Reference Manual](https://www.stroustrup.com/arm.html)\
  \ (`ARM`)。这本书有两个目的：在存在多种实现的情况下定义 `C++` 的功能，并为第一个 `C++` 标准 `C++98` (`ISO/IEC 14882`)\
  \ 提供基础。`C++98` 的一些核心特性包括：模板、带有容器、算法、字符串和 I/O 流的标准模板库 (`STL`)。\n\n### 1.2 C++03\n\
  \n通过 `C++03` (`14882:2003`)，`C++98` 接受了一次技术修正，其规模小到在上面的时间轴上没有位置。在社区中，包含 `C++98`\
  \ 的 `C++03` 被称为“遗留 C++”（legacy C++）。\n\n### 1.3 TR1\n\n2005 年，发生了一些令人兴奋的事。所谓的技术报告\
  \ 1 (`TR1`) 发布了。`TR1` 是向 `C++11` 乃至向现代 C++ 迈出的一大步。`TR1` (`TR 19768`) 基于 [Boost 项目](https://www.boost.org/)，该项目由\
  \ `C++` 标准委员会的成员创立。`TR1` 包含 13 个库，注定成为 `C++11` 标准的一部分。例如，正则表达式库、随机数库、智能指针和哈希表。只有所谓的特殊数学函数必须等到\
  \ `C++17`。\n\n### 1.4 C++11\n\n我们将 `C++11` 标准称为“现代 C++”。现代 C++ 这个名称也用于 `C++14` 和\
  \ `C++17`。`C++11` 引入了许多从根本上改变我们 `C++` 编程方式的特性。例如，`C++11` 不仅增加了 `TR1` 的内容，还有移动语义、完美转发、变变模板和\
  \ `constexpr`。但并不仅如此。通过 `C++11`，我们首次获得了作为线程基础基础的内存模型，以及线程 API 的标准化。\n\n### 1.5 C++14\n\
  \n`C++14` 是一个较小的 `C++` 标准。它带来了读写锁、泛化 lambda 和扩展的 `constexpr` 函数。\n\n### 1.6 C++17\n\
  \n`C++17` 既不是大标准也不是小的 `C++` 标准。它有两个突出的特性：并行 STL 和标准化的文件系统 API。标准模板库中的约 80 个算法可以并行或向量化执行。与\
  \ `C++11` 一样，boost 库对 `C++17` 有很大影响。Boost 提供了文件系统库和新的数据类型：`std::string_view`、`std::optional`、`std::variant`\
  \ 和 `std::any`。\n\n## 2. 标准化\n\n`C++` 标准化过程是民主的。委员会被称为 `WG21`（工作组 21），于 1990-91\
  \ 年成立。`WG21` 的官员有：\n\n*   召集者 (Convener)：主持 `WG21`，制定会议日程并任命研究小组\n*   项目编辑 (Project\
  \ Editor)：对 `C++` 标准草案应用更改\n*   秘书 (Secretary)：分配 `WG21` 会议纪要\n\n图片显示了委员会的各种小组和研究小组。\n\
  \n![](img/About----wg21-structure-2019-11.png)\n\nC++ 标准化过程中的研究小组\n\n委员会由由若干小组组成的三个阶段流水线组成。`SG`\
  \ 代表研究小组（Study Group）。\n\n### 2.1 阶段 3\n\n用于措辞和更改提案一致性的阶段 3 有两个小组：核心语言小组 (`CWG`)\
  \ 和库语言小组 (`LWG`)。\n\n### 2.2 阶段 2\n\n阶段 2 有两个小组：核心语言小组 (`CWG`) 和库语言小组 (`LWG`)。\n\
  \n\n\n\n\n![](img/timeline----TimelineCpp20BigFour.png)\n\n`四大件`中的每项特性都改变了我们在现代\
  \ C++ 中的编程方式。让我先从概念开始。\n\n### 3.1.1 概念 (Concepts)\n\n使用模板进行泛型编程使得我们能够定义可用于各种类型的函数和类。因此，使用错误的类型实例化模板的情况并不罕见。其结果可能是好几页极其晦涩难懂的错误信息。这个问题在概念处迎来了终结。概念允许你为模板参数编写要求，这些要求将由编译器进行检查，并彻底改变了我们思考和编写泛型代码的方式。原因如下：\n\
  \n*   模板参数的要求变为了其公共接口的一部分。\n*   函数重载或类模板的特化可以基于概念进行。\n*   我们获得了更好的错误信息，因为编译器会检查定义的模板参数要求是否与给定的模板参数相匹配。\n\
  \n此外，这故事还没有结束。\n\n*   你可以使用预定义的概念，也可以定义自己的概念。\n*   `auto` 和概念的使用是统一的。你可以使用概念代替 `auto`。\n\
  \n*   如果函数声明使用了概念，它会自动变变为一个函数模板。因此，编写函数模板就像写函数一样简单。\n\n下面的代码段演示了直观概念 `Integral`\
  \ 的定义和使用：\n\n```cpp\ntemplate <typename T>\nconcept Integral = std::is_integral<T>::value;\n\
  \nIntegral auto gcd(Integral auto a, Integral auto b) {\n    if( b == 0 ) return\
  \ a; \n    else return gcd(b, a % b);\n}\n```\n\n`Integral` 概念的定义与使用\n\n`Integral`\
  \ 概念要求其类型参数 `T` 的 `std::is_integral<T>::value` 为 `true`。`std::is_integral<T>::value`\
  \ 是来自[类型特征库](https://en.cppreference.com/w/cpp/header/type_traits) 的值，用于在编译时检查 `T`\
  \ 是否为整数。如果 `std::is_integral<T>::value` 为于 `true`，则一切正常；否则，你将得到编译时错误。\n\n`gcd` 算法根据[欧几里得](https://en.wikipedia.org/wiki/Euclid)算法确定最大公约数。代码使用了所谓的缩写函数模板语法来定义\
  \ `gcd`。在这里，`gcd` 要求其参数和返回值支持 `Integral` 概念。换句话说，`gcd` 是一种对其参数和返回值提出要求的函数模板。当我去掉这些语法糖时，你可以看到\
  \ `gcd` 的真实本质。\n\n这里是使用 `requires` 子句的语义等效 `gcd` 算法：\n\n```cpp\ntemplate<typename\
  \ T>                               \nrequires Integral<T>\nT gcd(T a, T b) {\n \
  \   if( b == 0 ) return a;\n    else return gcd(b, a % b);\n}\n```\n\n在 `requires`\
  \ 子句中使用 `Integral` 概念\n\n`requires` 子句规定了 `gcd` 类型参数的要求。\n\n### 3.1.2 模块 (Modules)\n\
  \n模块 承诺了许多可能：\n\n*   更快的编译速度\n*   减少对宏的需求\n*   表达代码的逻辑结构\n*   使头文件过时\n*   摆脱丑陋的宏变通方法\n\
  \n这是第一个简单的 `math` 模块：\n\n```cpp\n1 export module math;\n2 \n3 export int add(int\
  \ fir, int sec) {\n4     return fir + sec;\n5 }\n```\n\n`math` 模块\n\n表达式 `export\
  \ module math`（第 1 行）是模块声明。在函数 `add`（第 3 行）之前放置 `export` 则是导出该函数。现在，该模块的消费者可以使用它了。\n\
  \n```cpp\nimport math;\n\nint main() {\n\n   add(2000, 20);\n\n}\n```\n\n使用 `math`\
  \ 模块\n\n表达式 `import math` 导入 `math` 模块并使导出的名称在当前作用域可见。\n\n### 3.1.3 范围库 (Ranges\
  \ Library)\n\nranges 库 支持的算法可以\n\n*   可以直接在容器上操作；你不需要迭代器来指定范围\n*   可以惰性求值\n*   可以组合\n\
  \n简而言之：ranges 库支持函数式模式。\n\n下面的示例演示了使用管道符号进行函数组合。\n\n```cpp\n 1 int main() {\n 2\
  \     std::vector<int> ints{0, 1, 2, 3, 4, 5};\n 3     auto even = [](int i){ return\
  \ i % 2 == 0; };\n 4     auto square = [](int i) { return i * i; };\n 5  \n 6  \
  \   for (int i : ints | std::views::filter(even) | \n 7                        \
  \ std::views::transform(square)) {\n 8         std::cout << i << ' ';          \
  \   // 0 4 16\n 9     }\n10 }\n```\n\n使用管道符号进行函数组合\n\nLambda 表达式 `even`（第 3 行）是一个当参数\
  \ `i` 为偶数时返回 `true` 的 Lambda。Lambda 表达式 `square`（第 4 行）将参数 `i` 映射到它的平方。第 6 行和第 7\
  \ 行演示了函数组合，你需要从左到右读取：`for (int i : ints | std::views::filter(even) | std::views::transform(square))`。\n\
  \n### 3.1.4 协程 (Coroutines)\n\n协程 是可以挂起和恢复的通用函数。C++20 并没有提供具体的协程，相反提供了一个实现它们的框架。\n\
  \n下面的代码段使用生成器创建了一个无限的数据流。`Generator`。\n\n```cpp\n1 Generator<int> getNext(int start\
  \ = 0, int step = 1){\n2     auto value = start;\n3     while (true) {\n4      \
  \   co_yield value;\n5         value += step;\n6     }\n7 }\n8 \n9 int main() {\n\
  10     \n11     std::cout << '\\n';\n12   \n13     std::cout << \"getNext():\";\n\
  14     auto gen1 = getNext();\n15     for (int i = 0; i <= 10; ++i) {\n16      \
  \   gen1.next();             \n17         std::cout << \" \" << gen1.getValue();\n\
  18     }\n19     \n20     std::cout << \"\\n\\n\";\n21     \n22     std::cout <<\
  \ \"getNext(100, -10):\";\n23     auto gen2 = getNext(100, -10);\n24     for (int\
  \ i = 0; i <= 20; ++i) {\n25         gen2.next();             \n26         std::cout\
  \ << \" \" << gen2.getValue();\n27     }\n28     \n29     std::cout << \"\\n\";\n\
  30     \n31 }\n```\n\n无限数据的生成器\n\n`getNext` 函数是一个协程，因为它使用了 `co_yield` 关键字。有一个无限循环在\
  \ `co_yield` 处返回（第 4 行）。调用 `next`（第 16 行和第 25 行）会恢复协程，随后的 `getValue` 获取值。在 `getNext`\
  \ 返回后，协程再次暂停，直到下一次调用 `next`。在这个示例中有一个很大的未知：`getNext` 函数的返回值 `Generator<int>`。这就是复杂性开始的地方，我将在协程章节中进行详细描述。\n\
  \n![无限数据生成器](img/overview----infiniteDataStream.PNG)\n\n### 3.2 核心语言 (Core Language)\n\
  \n![](img/timeline----TimelineCpp20TheCoreLanguage.png)\n\n### 3.2.1 三路比较运算符\n\n\
  **三路比较运算符** `<=>` 或太空运算符根据值 A 和 B 确定 A < B、A == B 或 A > B。\n\n\n\n\n\n通过声明三路比较运算符\
  \ `default`，编译器将尝试为该类生成一组一致的关系运算符。在这种情况下，你将获得所有的六比较运算符：`==`、`!=`、`<`、`<=`、`>` 和\
  \ `>=`。\n\n```cpp\nstruct MyInt {\n  int value;\n  MyInt(int value): value{value}\
  \ { }\n  auto operator<=>(const MyInt&) const = default;\n};\n```\n\n#### 自动生成三路比较运算符\n\
  \n编译器生成的 `operator <=>` 执行字典序比较，从基类开始，按照声明顺序考虑所有的非静态数据成员。这里有一个来自微软博客的相当复杂的示例：[使用“火箭科学”简化你的代码：C++\
  \ 20 的飞船运算符](https://devblogs.microsoft.com/cppblog/simplify-your-code-with-rocket-science-c20s-spaceship-operator/)。\n\
  \n##### 3.2.2 指定初始化\n\n```cpp\nstruct Basics {\n  int i;\n  char c;\n  float f;\n\
  \  double d;\n  auto operator<=>(const Basics&) const = default;\n};\n\nstruct Arrays\
  \ {\n  int ai[1];\n  char ac[2];\n  float af[3];\n  double ad[2][2];\n  auto operator<=>(const\
  \ Arrays&) const = default;\n};\n\nstruct Bases : Basics, Arrays {\n  auto operator<=>(const\
  \ Bases&) const = default;\n};\n\nint main() {\n  constexpr Bases a = { { 0, 'c',\
  \ 1.f, 1. },\n    { { 1 }, { 'a', 'b' }, { 1.f, 2.f, 3.f }, { { 1., 2. }, { 3.,\
  \ 4. } \\\n} } };\n  constexpr Bases b = { { 0, 'c', 1.f, 1. },\n    { { 1 }, {\
  \ 'a', 'b' }, { 1.f, 2.f, 3.f }, { { 1., 2. }, { 3., 4. } \\\n} } };\n  static_assert(a\
  \ == b);\n  static_assert(!(a != b));\n  static_assert(!(a < b));\n  static_assert(a\
  \ <= b);\n  static_assert(!(a > b));\n  static_assert(a >= b);\n}\n```\n\n#####\
  \ 派生类的飞船运算符\n\n我假设这段代码段中最复杂的内容不是飞船运算符，而是使用聚合初始化初始化 `Base`。聚合初始化本质上意味着，如果所有成员都是 `public`，你就可以直接初始化类类型（`class`、`struct`\
  \ 或 `union`）的成员。在这种情况下，你可以像示例那样使用大初始化列表。\n\n在讨论指定初始化{\n\n  std::cout << \"\\n\"\
  ;\n\n  Point2D point2D {1, 2};\n  Point3D point3D {1, 2, 3};\n\n  std::cout << \"\
  point2D: \" << point2D.x << \" \" << point2D.y << \"\\n\";\n  std::cout << \"point3D:\
  \ \" << point3D.x << \" \" \n            << point3D.y << \" \" << point3D.z << \"\
  \\n\";\n\n  std::cout << '\\n';\n\n}\n```\n\n##### 聚合初始化\n\n这是程序的输出：\n\n![聚合初始化](img/overview----aggregateInitialization.png)\n\
  \n##### 聚合初始化\n\n聚合初始化是非常容易的，因为你可以交换构造函数的参数，而你永远不会察觉。显式优于隐式。让我们看看这意味着什么。看看来自 [C99](https://en.wikipedia.org/wiki/C99)（现在已成为\
  \ C++ 标准的一部分）的指定初始化器是如何起作用的。\n\n```cpp\n 1 struct Point2D{\n 2   int x;\n 3   int\
  \ y;\n 4 };\n 5 \n6 class Point3D{\n 7 public:\n 8   int x;\n 9   int y;\n10   int\
  \ z;\n11 };\n12 \n13 int main(){\n14     \n15   Point2D point2D {.x = 1, .y = 2};\n\
  16   // Point2D point2d {.y = 2, .x = 1};         // error\n17   Point3D point3D\
  \ {.x = 1, .y = 2, .z = 2};   \n18   // Point3D point3D {.x = 1, .z = 2}       \
  \   // {1, 0, 2}\n19     \n20 \n21   std::cout << \"point2D: \" << point2D.x <<\
  \ \" \" << point2D.y << \"\\n\";\n22   std::cout << \"point3D: \" << point3D.x <<\
  \ \" \" << point3D.y << \" \" << p\\\n23 oint3D.z \n24             << \"\\n\";\n\
  25 \n26 }\n```\n\n##### 指定初始化\n\n指定初始化的参数。聚合初始化是非常容易的，因为你可以交换构造函数的参数，而你永远不会察觉。显式优于隐式。让我们看看这意味着什么。看看来自\
  \ [C99](https://en.wikipedia.org/wiki/C99)（现在已成为 C++ 标准的一部分）的指定初始化器是如何起作用的。\n\n\
  指定初始化的参数。聚合初始化。泛型构造函数是太容易犯错了。通过在构造函数前面加上 `explicit` 关键字，构造函数就会变成显式的。这意味着隐式转换将不再有效。\n\
  \n##### 3.2.3 `consteval` 和 `constinit`\n\n`consteval` 修饰符是在 C++20 中引入的，它创建一个立即函数。\n\
  \n```cpp\nconsteval int sqr(int n) {\n    return n*n;\n}\n\nconstexpr int r = sqr(100);\
  \ // OK\nint r2 = sqr(100);         // Error\n```\n\n聚合初始化。泛型构造函数是太容易犯错了。通过在构造函数前面加上\
  \ `explicit` 关键字，构造函数就会变成显式的。这意味着隐式转换将不再有效。\n\n##### 3.2.4 模板改进\n\nC++ 为模板编程提供了各种改进。泛型构造函数是一个万能的匹配。\n\
  \n```cpp\nstruct Implicit {\n    template <typename T>\n    Implicit(T t) {\n  \
  \      std::cout << t << '\\n';\n    }\n};\n\nstruct Explicit {\n    template <typename\
  \ T>\n    explicit Explicit(T t) {\n        std::cout << t << '\\n';\n    }\n};\n\
  \nImplicit exp1 = \"implicit\"; // Error\nExplicit exp2{\"explicit\"};\n```\n\n\
  ##### 3.2.5 Lambda 改进\n\nLambda 在 C++20 中有很多改进。它们可以拥有模板参数，可以在未求值的上下文中使用，无状态 lambda\
  \ 也可以默认构造。此外，编译器现在可以检测你何时隐式拷贝 `this` 指针，这意味着 lambda 的行为问题消失了。\n\n如果你想定义一个只接受 `std::vector`\
  \ 的 lambda，模板参数实现了这一点：\n\n```cpp\nauto foo = []<typename T>(std::vector<T> const&\
  \ vec) { \n        // 执行向量特定的操作\n    };\n```\n\n##### 3.2.6 新属性\n\nC++20 有新的属性，包括\
  \ `[[likely]]` 和 `[[unlikely]]`。这两个属性都允许我们为优化器提供提示，指定哪条执行路径更有可能或不太可能。\n\n```cpp\n\
  for(size_t i=0; i < v.size(); ++i){\n    if (v[i] < 0) [[likely]] sum -= sqrt(-v[i]);\n\
  \    else sum += sqrt(v[i]);\n}\n```\n\n\n\n\n\n`std::span` 表示一个可以指向连续序列对象的对象。`std::span`\
  \ 有时也称为视图（view），它永远不是所有者。该视图可以是一个 C 数组、`std::array`、带有大小的指针或一个 `std::vector`。`std::span`\
  \ 的典型实现需要一个指向其第一个元素的指针和一个大小。使用 `std::span` 的主要原因是普通数组在传递给函数时会退化为指针；因此，它的大小会丢失。`std::span`\
  \ 能够自动推导出数组、`std::array` 或 `std::vector` 的大小。如果你使用指针来初始化 `std::span`，则必须构造函数中提供大小。\n\
  \n```cpp\nvoid copy_n(const int* src, int* des, int n){}\n\nvoid copy(std::span<const\
  \ int> src, std::span<int> des){}\n\nint main(){\n\n  int arr1[] = {1, 2, 3};\n\
  \  int arr2[] = {3, 4, 5};\n\n  copy_n(arr1, arr2, 3);        \n  copy(arr1, arr2);\
  \              \n\n}\n```\n\n### 作为函数参数的 `std::span`\n\n与函数 `copy_n` 相比，`copy` 不需要元素。因此，使用\
  \ `std::span<T>` 后，常见的错误源消失了。\n\n### 3.3.2 容器改进\n\nC++20 针对标准模板库的容器有许多改进。首先，`std::vector`\
  \ 和 `std::string` 具有 `constexpr 构造函数`，因此可以在编译时使用。所有标准库容器都支持`一致的容器擦除`（consistent\
  \ container erasure），关联容器支持 `contains` 成员函数。此外，`std::string` 允许`检查前缀或后缀`。\n\n###\
  \ 3.3.3 算术工具\n\n有符号整数和无符号整数之间的比较是导致意外行为（并因此导致 Bug）的细微原因。得益于新的`整数安全比较函数`——`std::cmp_*`，一个微妙的错误源消失了。\n\
  \n```cpp\nint x = -3;\nunsigned int y = 7;\n\nif (x < y) std::cout << \"expected\"\
  ;\nelse std::cout << \"not expected\";                  // not expected\n\nif (std::cmp_less(x,\
  \ y)) std::cout << \"expected\";  // expected\nelse std::cout << \"not expected\"\
  ;\n```\n\n#### 整数的类型比较\n\n此外，C++20 在 `std::numbers` 命名空间包含了`数学常数`，包括 ![e](img/leanpub_equation_0.png)、![π](img/leanpub_equation_1.png)\
  \ 或 ![φ](img/leanpub_equation_2.png)。\n\n新的`位操作`允许访问单个位和位序列，并对其进行重新解释。\n\n```cpp\n\
  std::uint8_t num= 0b10110010;\n\nstd::cout << std::has_single_bit(num) << '\\n';\
  \            // false    \nstd::cout << std::bit_width(unsigned(5)) << '\\n';  \
  \       // 3\nstd::cout << std::bitset<8>(std::rotl(num, 2)) << '\\n';   // 11001010\n\
  std::cout << std::bitset<8>(std::rotr(num, 2)) << '\\n';   // 10101100\n```\n\n\
  #### 访问单个位和位序列\n\n### 3.3.4 日历与时区\n\n来自 C++11 的[chrono library](https://en.cppreference.com/w/cpp/chrono)\
  \ 扩展了`日历和时区`功能。日历由表示年份、月份、星期几以及每月第几个特定工作日的类型组成。这些基本类型可以组合，形成复杂的类型，例如 `year_month`、`year_month_day`、`year_month_day_last`、`year_month_weekday`\
  \ 和 `year_month_weekday_last`。重载了运算符 `/` 以方便地指定时间点。此外，我们还获得了新的字面量：表示天的 `d` 和表示年的\
  \ `y`。\n\n这些时间点可以在不同的时区显示。由于扩展了 chrono 库，以下用例现在变得非常容易实现：\n\n* 以特定格式表示日期\n* 获取月份的最后一天\n\
  * 获取天数\n* 打印当前时间\n\n以下程序展示了不同时区的本地时间：\n\n```cpp\nusing std::chrono;\n\nauto time\
  \ = floor<milliseconds>(system_clock::now());\nauto localTime = zoned_time<milliseconds>(\"\
  Europe/Berlin\");\nauto newYorkTime = zoned_time<milliseconds>(\"America/New_York\"\
  );\nauto tokyoTime = zoned_time<milliseconds>(\"Asia/Tokyo\");\n\nstd::cout << time\
  \ << '\\n';\nstd::cout << localTime << '\\n';\nstd::cout << newYorkTime << '\\n';\n\
  std::cout << tokyoTime << '\\n';\n```\n\n### 3.3.5 格式化库\n\n`新的格式化库`为 `printf` 函数提供了一个安全且可扩展的方案。它旨在补充现有的\
  \ I/O 流，例如用户定义类型的重载插入运算符。`std::format` 使用 Python 的语法进行格式化。以下示例展示了一些用例：\n\n* 格式化并使用位置位置参数\n\
  \n```cpp\nstd::string s = std::format(\"I'd rather {1} than {0}.\", \"right\", \"\
  happy\");\n// s == \"I'd rather happy than right.\"\n```\n\n* 安全地将整数转换为字符串\n\n```cpp\n\
  memory_buffer buf;\nstd::format_to(buf, \"{}\", 42);    // 相当于 itoa(42, 10)\nstd::format_to(buf,\
  \ \"{:x}\", 42);  // 相当于 itoa(42, 16)\n```\n\n### 3.4 并发\n\n![](img/timeline.png)\n\
  \n#### 3.4.1 原子\n\n类模板 `std::atomic_ref` 对引用对象应用原子操作。引用对象的并发读写可以进行，因此不会发生数据竞争。引用对象的寿命必须超过\
  \ `std::atomic_ref` 的寿命。通过 `std::atomic_ref` 访问引用对象的子对象不是线程安全的。\n\n根据 [`std::atomic`](https://en.cppreference.com/w/cpp/atomic/atomic)，`std::atomic_ref`\
  \ 可以特化并支持内置数据类型的特化。\n\n```cpp\nstruct Counter {\n    int a;\n    int b;\n};\n\n\
  Counter counter;\n\nstd::atomic_ref<Counter> cnt(counter);\n```\n\n在 C++20 中，我们获得了两个\
  \ `std::atomic` 的部分特化——原子指针：`std::atomic<std::shared_ptr<T>>` 和 `std::atomic<std::weak_ptr<T>>`。这两个原子指针都保证不仅控制块（如\
  \ [std::shared_ptr](https://en.cppreference.com/w/cpp/memory/shared_ptr) 所示）是线程安全的，关联的对象也是安全的。\n\
  \n`std::atomic` 得到了更多扩展。C++20 提供了原子浮点类型的特化。当你有一个并发递增的浮点类型时，这非常方便。\n\n\n\n\n\n类型\
  \ [`std::atomic_flag`](https://en.cppreference.com/w/cpp/atomic/atomic_flag) 的值是一种原子布尔值。它有“清除（cleared）”和“设置（set）”两种状态。为了简单起见，我将清除状态称为\
  \ `false`，将设置状态称为 `true`。`clear()` 成员函数允许你将它的值设置为 `false`。通过 `test_and_set()` 成员函数，你可以将值设置为\
  \ `true` 并获取旧值。目前没有成员函数可以查询当前值。这在 C++20 中将会发生变化，因为 `std::atomic_flag` 拥有一个 `test()`\
  \ 方法。\n\n此外，`std::atomic_flag` 可以通过成员函数 `notify_one()`、`notify_all()` 和 `wait()`\
  \ 用于线程同步。在 C++20 中，所有 `std::atomic` 和 `std::atomic_ref` 的部分特化和完全特化都支持通知和等待。布尔型、整数、浮点型和指针都提供了特化支持。\n\
  \n### 3.4.2 信号量 (Semaphores)\n\n`信号量 (Semaphores)` 是一种用于控制对共享资源并发访问的同步机制。计数信号量（例如\
  \ C++20 添加的）是一种特殊的信号量，其初始计数器大于零。计数器在构造函数中初始化。获取信号量会减少计数器，释放信号量会增加计数器。如果线程在计数器为零时尝试获取信号量，该线程将阻塞，直到另一个线程通过释放信号量来增加计数器。\n\
  \n### 3.4.3 栅栏与屏障 (Latches and Barriers)\n\n`栅栏和屏障 (Latches and barriers)` 是简单的线程同步机制，允许某些线程阻塞直到计数器变为零。这两种同步线程的机制之间有什么区别呢？你只能使用一次\
  \ `std::latch`，但你可以多次使用 `std::barrier`。`std::latch` 适用于多个线程管理一个任务；而 `std::barrier`\
  \ 适用于多个线程管理重复执行的任务。此外，`std::barrier` 可以在每次迭代中调整计数器。\n\n以下内容基于提议 [N4204](http://www.open-std.org/jtc1/sc22/wg21/docs/papers/2014/n4204.html)\
  \ 中的代码片段。我修复了几处拼写错误并重新格式化了它。\n\n```\n 1 void DoWork(threadpool* pool) {\n 2 \n 3\
  \     std::latch completion_latch(NTASKS);   \n 4     for (int i = 0; i < NTASKS;\
  \ ++i) {\n 5         pool->add_task([&] {         \n 6             // perform work\n\
  \ 7             ...\n 8             completion_latch.count_down();\n 9         });\
  \                          \n10     }\n11     // Block until work is done\n12  \
  \   completion_latch.wait();          \n13 }\n```\n\n#### 使用 `std::latch` 进行线程同步\n\
  \n`std::latch completion_latch` 的计数器设置为 `NTASKS`（第 3 行）。线程池执行 NTASKS 个任务（4-10 行）。在每个任务结束时，计数器减\
  \ 1（第 8 行）。运行 `DoWork` 函数的线程在第 12 行阻塞，直到所有任务完成。\n\n### 3.4.4 协作中断 (Cooperative Interruption)\n\
  \n得益于 `std::stop_token`，`std::jthread` 可以以协作的方式被中断。\n\n```\n 1 int main() {\n 2\
  \     \n 3     std::cout << '\\n';\n 4     \n 5     std::jthread nonInterruptible([]{\
  \ \n 6         int counter{0};\n 7         while (counter < 10){\n 8           \
  \  std::this_thread::sleep_for(0.2s);\n 9             std::cerr << \"nonInterruptible:\
  \ \" << counter << '\\n'; \n10             ++counter;\n11         }\n12     });\n\
  13     \n 14     std::jthread interruptible([](std::stop_token stoken){ \n 15  \
  \       int counter{0};\n16         while (counter < 10){\n17             std::this_thread::sleep_for(0.2s);\n\
  18             if (stoken.stop_requested()) return;\n19             std::cerr <<\
  \ \"interruptible: \" << counter << '\\n'; \n20             ++counter;\n21     \
  \    }\n22     });\n23     \n 24     std::this_thread::sleep_for(1s);\n25     \n\
  \ 26     std::cerr << '\\n';\n27     std::cerr << \"Main thread interrupts both\
  \ jthreads\" << std:: endl;\n28     nonInterruptible.request_stop();\n29     interruptible.request_stop();\n\
  30     \n 31     std::cout << '\\n';\n32     \n33 }\n```\n\n#### 中断 `std::jthread`\n\
  \n`main` 程序启动了两个线程：`nonInterruptible` 和 `interruptible`（第 5 行和 14 行）。只有 `interruptible`\
  \ 线程获得了 `std::stop_token`，它在第 18 行使用它来检查是否被中断。如果发生中断，Lambda 表达式立即返回。调用 `interruptible.request_stop()`\
  \ 会触发线程的取消。调用 `nonInterruptible.request_stop()` 则没有效果。\n\n![线程的协作中断](img/overview----cooperativeInterruption.png)\n\
  \n线程的协作中断\n\n### 3.4.5 `std::jthread`\n\n`std::jthread` 意为连接线程（joining thread）。`std::jthread`\
  \ 扩展了 [`std::thread`](https://en.cppreference.com/w/cpp/thread/thread)，它会自动连接已启动的线程。`std::jthread`\
  \ 还可以被中断。\n\n`std::jthread` 被引入 C++20 标准是因为 `std::thread` 的行为并不直观。`std::jthread`\
  \ 在其析构函数中会在必要时自动连接线程。\n\n\n\n\n\n![](img/timeline----TimelineCpp20TheCoreLanguage.png)\n\
  \n概念（Concepts）是 C++20 影响最大的特征之一。因此，它是介绍 C++20 核心语言特性的理想起点。\n\n## 4.1 概念\n\n![Cippi\
  \ 观察星空](img/Cippi----CippiConcepts.jpg)\n\nCippi 观察星空\n\n为了充分理解概念的影响，我想从关于概念的简短动机开始说。\n\
  \n### 4.1.1 两种错误的方法\n\n在 C++20 之前，我们有两种两种截然对立的方式来思考函数或类：为特定类型定义它们，或者为泛型类型定义它们。在后后一种情况下，我们将其称为函数模板或类模板。这两种方法都有各自对应的问题：\n\
  \n#### 4.1.1.1 过于具体\n\n为每个类型重载函数或重新实现类是一项枯燥的工作。为了避免这种负担，类型转换通常会来救急。但看起来像救星的往往是诅咒。\n\
  \n```cpp\n 1 // tooSpecific.cpp\n 2 \n 3 #include <iostream>\n 4 \n 5 void needInt(int\
  \ i){\n 6     std::cout << \"int: \" << i << '\\n';\n 7 }\n 8 \n 9 int main(){\n\
  10 \t\n11     std::cout << std::boolalpha << '\\n';\n12 \t\n13     double d{1.234};\
  \                             \n14     std::cout << \"double: \" << d << '\\n';\n\
  15     needInt(d);                                             \n16     \n17   \
  \  std::cout << '\\n';\n18     \n19     bool b{true};                          \
  \      \n20     std::cout << \"bool: \" << b << '\\n';\n21     needInt(b);     \
  \                            \n22 \t\n23     std::cout << '\\n';\n24 \t\n25 }\n\
  ```\n\n**隐式转换**\n\n在第一种情况下（第 13 行），我从一个 `double` 开始并以一个 `int` 结束（第 15 行）。在第二种情况下，我从一个\
  \ `bool` 开始（第 19 行），同样以一个 `int` 结束（第 21 行）。\n\n![隐式转换](img/CoreLanguage----tooSpecific.PNG)\n\
  \n**隐式转换**\n\n该程序演示了两种隐式转换。\n\n##### 4.1.1.1.1 窄转换\n\n使用 `double` 调用 `getInt(int\
  \ a)` 会导致窄转换。窄转换是一种转换，其中包含了精度的损失。我假设这并不是你想要的。\n\n##### 4.1.1.1.2 整数提升\n\n但反过来也不更好。使用\
  \ `bool` 调用 `getInt(int a)` 会将 `bool` 提升为 `int`。感到惊讶吗？许多 C++ 开发者不知道在将两个 `bool` 相加时得到的是什么数据类型。\n\
  \n```cpp\ntemplate <typename T>\nauto add(T first, T second){\n    return first\
  \ + second;\n}\n\nint main(){\n    add(true, false);\n}\n```\n\n**两个两个 `bool` 相加**\n\
  \n[C++ Insights](https://cppinsights.io/s/9bd14f99) 可视化了编译器在实例化中转换函数模板后的源代码。\n\n\
  ![`bool` 到 `int` 的提升](img/CoreLanguage----addGeneric.PNG)\n\n**`bool` 到 `int` 的提升**\n\
  \n第 6 - 12 行是该 [C++ Insights](https://cppinsights.io/) 截图中的关键部分。函数模板 `add` 的模板实例化创建了一个返回类型为\
  \ `int` 的完全特化。两个 `bool` 都被隐式提升为 `int`。\n\n**我坚信，我们为了方便而依赖转换的魔力，因为我们不想为每个类型都重载函数或重新实现类。**\n\
  \n让我尝试另一种方法，使用泛型函数。也许这才是我们的救星？\n\n#### 4.1.1.2 过于泛型\n\n对容器排序是一个通用的想法。如果它的元素支持排序，它应该适用于每个容器。在接下来的示例中，我将标准算法\
  \ `std::sort` 应用于标准容器 `std::list`。\n\n```cpp\n// tooGeneric.cpp\n\n#include <algorithm>\n\
  #include <list>\n\nint main(){\n\n    std::list<int> myList{1, 10, 3, 2, 5};\n\n\
  \    std::sort(myList.begin(), myList.end());\n\n}\n```\n\n**对 `std::list` 排序**\n\
  \n![尝试对 `std::list` 排序时的编译器错误](img/CoreLanguage----tooGeneric.png)\n\n**尝试对 `std::list`\
  \ 排序时的编译器错误**\n\n我甚至不想解析这段长信息。出什么问题了？让我们看看示例中使用的 [`std::sort`](https://en.cppreference.com/w/cpp/algorithm/sort)\
  \ 特定重载的签名。\n\n```cpp\ntemplate< class RandomIt >\nconstexpr void sort( RandomIt\
  \ first, RandomIt last );\n```\n\n`std::sort` 使用了奇怪的参数类型，如 `RandomIt`。`RandomIt`\
  \ 代表随机访问迭代器，并为大量的错误信息提供了关键提示。`std::list` 只提供双向迭代器，但 `std::sort` 需要随机访问迭代器。下面的图表显示了为什么\
  \ `std::list` 不支持随机访问迭代器。\n\n![`std::list` 的结构](img/CoreLanguage----list.png)\n\n\
  **`std::list` 的结构**\n\n如果你研究 [概念](https://en.cppreference.com/w/cpp/language/concepts)\
  \ 以及 `std::sort`，你会发现一些令人兴奋的内容：模板参数的约束。\n\n### 4.1.1.3 概念救场\n\n概念为模板施加了约束。`std::sort`\
  \ 有如下重载：\n\n```cpp\ntemplate< class RandomIt >\nconstexpr void sort( RandomIt first,\
  \ RandomIt last );\n```\n\n`std::sort` 使用了奇怪的参数类型 `RandomIt`。`RandomIt` 代表随机访问迭代器，并为大量的错误信息提供了关键提示。`std::list`\
  \ 只提供双向迭代器，但 `std::sort` 需要随机访问迭代器。下面的图表显示了为什么 `std::list` 不支持随机访问迭代器。\n\n具体来说，C++20\
  \ `<iterator>` 中的命名要求是 `random_access_iterator`：\n\n```cpp\ntemplate<class I>\n\
  \    concept random_access_iterator =\n        bidirectional_iterator<I> &&\n  \
  \      derived_from<I, random_iterator_tag> &&\n        totally_ordered<I> &&\n\
  \        sized_sentinel_for<I, I> &&\n        requires(I i, const I j, iter_difference_t<I>\
  \ n) {\n            { i += n } -> same_as<I&>;\n            { j + n } -> same_as<I>;\n\
  \            { n + j } -> same_as<I>;\n            { i -= n } -> same_as<I&>;\n\
  \            { j - n } -> same_as<I>;\n            { j[n] } -> same_as<iter_reference_t<I>>;\n\
  \        };\n```\n\n**`random_access_iterator`**\n\n类型 `I` 满足 `random_access_iterator`\
  \ 概念，如果它满足 `bidirectional_iterator` 以及以下所有要求。例如，`requires` 中的 `{ i += n } -> same_as<I&>`\
  \ 表示对于类型 `I` 的值，`{ i += n }` 是有效表达式并返回 `I&` 类型。为了完成排序的故事，`std::list` 只支持双向迭代器，而不是\
  \ `std::sort` 需要的随机访问迭代器。\n\n现在当你使用一个需要 `random_access_iterator` 的算法，但只提供 `birectional_iterator`\
  \ 时，你会得到一个简洁且易读的错误信息，说明你的迭代器不满足 `random_access_iterator` 概念。\n\n![标准模板库](img/CoreLanguage----stl.png)\n\
  \n**标准模板库**\n\n### 4.1.2 概念的优势\n\n-   模板参数的要求是的一部分。\n-   函数的重载和类模板的特化可以基于概念。\n-\
  \   概念可以用于函数模板、类模板以及类或类模板的泛型成员函数。\n-   你会获得更好的错误信息，因为编译器会将模板参数的要求与给定的模板参数进行比较。\n\
  -   你可以使用预定义的概念，也可以定义自己的。\n\n\n\n\n[content]\n\n*   `auto` 和概念（concepts）的使用被统一了。你可以使用概念来代替\
  \ `auto`。\n*   如果函数声明使用了概念，它会自动变成一个函数模板。因此，编写函数模板变得像编写函数一样简单。\n\n### 4.1.3 漫长的历史\n\
  \n我第一次听到概念是在 2005 年到 2006 年左右。它们让我想起了 Haskell 的类型类（type classes）。Haskell 中的类型类是用于相似类型的接口。这里是\
  \ [Haskell](https://en.wikipedia.org/wiki/Haskell_(programming_language)) 类型类层级结构的一部分。\n\
  \n![Haskell Type Classes Hierarchy](img/CoreLanguage----haskellsTypeclasses.png)\n\
  \nHaskell 类型类层级结构\n\n但 C++ 概念是不同的。以下是几点观察：\n\n*   在 Haskell 中，任何类型都必须是某个类型类的实例。在\
  \ `C++20` 中，一个类型必须满足概念的要求。\n\n*   概念可以用于 C++ 模板的非类型参数。例如，像值 `5` 这样的数字就是非类型参数。例如，当你想要有一个包含\
  \ `5` 个元素的 `std::array<int>` 时，你使用非类型参数 `5`：`std::array<int, 5> myArray`。\n\n* \
  \  概念不会带来运行时开销。\n\n概念最初打算是 `C++11` 的核心特性，但在 2009 年 7 月在法兰克福的一次标准化会议上被删除了。比捷·斯特斯特斯特拉斯（Bjarne\
  \ Stroustrup）的这段话说明了一切：“C++0x 的概念设计演变成了一个复杂性怪兽。”](https://isocpp.org/blog/2013/02/concepts-lite-constraining-templates-with-predicates-andrew-sutton-bjarne-s)。几年后，下一次尝试也没有成功：concepts\
  \ lite 从 `C++17` 标准中被移除。它们最终成为了 `C++20` 的一部分。\n\n### 4.1.4 概念的使用\n\n本质上，使用概念有四种方法。\n\
  \n#### 4.1.4.1 使用概念的四种方法\n\n我在程序 `conceptsIntegralVariations.cpp` 中以所有四种方式应用了定义的概念\
  \ `std::integral`。\n\n```\n 1 // conceptsIntegralVariations.cpp\n 2 \n 3 #include\
  \ <concepts>\n 4 #include <iostream>      \n 5 \n 6 template<typename T>       \
  \                           \n 7 requires std::integral<T>\n 8 auto gcd(T a, T b)\
  \ {\n 9     if( b == 0 ) return a;\n10     else return gcd(b, a % b);\n11 }\n12\
  \ \n13 template<typename T>                                  \n14 auto gcd1(T a,\
  \ T b) requires std::integral<T> {\n15     if( b == 0 ) return a; \n16     else\
  \ return gcd1(b, a % b);\n17 }\n18 \n19 template<std::integral T>              \
  \                    \n20 auto gcd2(T a, T b) {\n21     if( b == 0 ) return a; \n\
  22     else return gcd2(b, a % b);\n23 }\n24 \n25 auto gcd3(std::integral auto a,\
  \ std::integral auto b) { \n26     if( b == 0 ) return a; \n27     else return gcd3(b,\
  \ a % b);\n28 }\n29 \n30 int main(){\n31 \n32     std::cout << '\\n';\n33 \n34 \
  \    std::cout << \"gcd(100, 10)= \"  <<  gcd(100, 10)  << '\\n';\n35     std::cout\
  \ << \"gcd1(100, 10)= \" <<  gcd1(100, 10)  << '\\n';\n36     std::cout << \"gcd2(100,\
  \ 10)= \" <<  gcd2(100, 10)  << '\\n';\n37     std::cout << \"gcd3(100, 10)= \"\
  \ <<  gcd3(100, 10)  << '\\n';\n38 \n39     std::cout << '\\n';\n40 \n41 }\n```\n\
  \n使用概念 `std::integral` 的四种变体\n\n得益于第 3 行的头文件 `<concepts>`，我可以使用概念 `std::integral`。如果\
  \ `T` 是[整数](https://en.cppreference.com/w/cpp/types/is_integral)类型，则满足该概念。函数名 `gcd`\
  \ 代表基于[欧几里德](https://en.wikipedia.org/wiki/Euclid)算法的最大公约数算法。\n\n使用概念的四种方法：\n\n\
  *   Requires 子句（第 6 行）\n*   后续 requires 子句（第 13 行）\n*   约束模板参数（第 19 行）\n*   简写函数模板（第\
  \ 25 行）\n\n为了简单起见，每个函数模板都返回 `auto`。函数模板 `gcd`、`gcd1`、`gcd2` 与函数 `gcd3` 之间存在语义差异。在\
  \ `gcd`、`gcd1` 或 `gcd2` 的情况下，参数 `a` 和 `b` 必须具有相同的类型。\n\n#### 4.1.4.2 Requires 子句\n\
  \n之前的程序 `conceptsIntegralVariations.cpp` 阐明了 `requires` 可以约束模板或函数。`requires` 后面必须跟着一个谓词，如[requires\
  \ 表达式](https://en.cppreference.org/w/cpp/language/requires_expression)。\n\n```\n\
  \ 1 // requiresClause.cpp\n 2 \n 3 #include <iostream>\n 4 \n 5 template <unsigned\
  \ int i>\n 6 requires (i <= 20)\n 7 int sum(int j) {\n 8     return i + j;\n 9 }\n\
  10 \n11 \n12 int main() {\n13 \n14     std::cout << '\\n';\n15 \n16     std::cout\
  \ << \"sum<20>(2000): \" << sum<20>(2000) << '\\n';\n17     // std::cout << \"sum<23>(2000):\
  \ \" << sum<23>(2000) << '\\n';  // ERROR\n18 \n19 \n20     std::cout << '\\n';\n\
  21 }\n```\n\n在 requires 子句中使用编译时谓词\n\n第 6 行使用的编译时谓词阐明了要求应用于非类型 `i`，而不是像通常那样应用于类型。`requires`\
  \ 可以约束模板或函数。\n\n#### 4.1.4.3 概念作为函数的返回类型\n\n这里是概念作为返回类型的函数模板 `gcd` 和函数 `gcd1` 的定义。\n\
  \n```cpp\ntemplate<typename T>                                  \nrequires std::integral<T>\n\
  std::integral auto gcd(T a, T b) {\n    if( b == 0 ) return a;\n    else return\
  \ gcd(b, a % b);\n}\n\nstd::integral auto gcd1(std::integral auto a, std::integral\
  \ auto b) { \n    if( b == 0 ) return a; \n    else return gcd1(b, a % b);\n}\n\
  ```\n\n使用概念作为返回类型\n\n\n\n\n\n```cpp\n 1 // compileTimePredicate.cpp\n 2 \n3 #include\
  \ <compare>\n 4 #include <iostream>\n 5 #include <string>\n 6 #include <vector>\n\
  \ 7 \n8 struct Test{};\n 9 \n10 int main() {\n11 \n12     std::cout << '\\n';\n\
  13 \n14     std::cout << std::boolalpha;\n15 \n16     std::cout << \"std::three_way_comparable<int>:\
  \ \" \n17               << std::three_way_comparable<int> << \"\\n\";\n18 \n19 \
  \    std::cout << \"std::three_way_comparable<double>: \";\n20     if (std::three_way_comparable<double>)\
  \ std::cout << \"True\";\n21     else std::cout << \"False\";\n22 \n23     std::cout\
  \ << \"\\n\\n\";\n24 \n25     static_assert(std::three_way_comparable<std::string>);\n\
  26 \n27     std::cout << \"std::three_way_comparable<Test>: \";\n28     if constexpr(std::three_way_comparable<Test>)\
  \ std::cout << \"True\";\n29     else std::cout << \"False\";\n30 \n31     std::cout\
  \ << '\\n';\n32 \n33     std::cout << \"std::three_way_comparable<std::vector<int>>:\
  \ \";\n34     if constexpr(std::three_way_comparable<std::vector<int>>) std::cout\\\
  \n35  << \"True\";\n36     else std::cout << \"False\";\n37 \n38     std::cout <<\
  \ '\\n';\n39 \n40 }\n```\n\n## 作为编译谓词的概念\n\n在上面的程序中，我使用了概念 `std::three_way_comparable<T>`，它在编译时检查\
  \ `T` 是否支持六种比较运算符。作为一个编译时谓词，`std::three_way_comparable` 可以在运行时（第 16 行和第 20 行）也可以在编译时使用。`static_assert`（第\
  \ 25 行）和 `constexpr if`（第 28 行和第 34 行）是在编译时求值的。\n\n![作为编译谓词的概念](img/CoreLanguage----compileTimePredicate.png)\n\
  \n## 作为编译谓词的概念\n\n在对作为编译谓词的概念进行了简短介绍后，让我继续在本节介绍概念的各种用例。概念的应用并不复杂，我主要使用预定义概念，我将在“预定义概念”章节中详细描述它们。\n\
  \n### 4.1.4.4.2 类模板\n\n类模板 `MyVector` 要求其模板参数 `T` 必须是 `regular`（常规），这意味着 `T` 的行为类似于\
  \ `int`。`regular` 的正式定义在“定义概念”部分节中提供。\n\n```cpp\n 1 // conceptsClassTemplate.cpp\n\
  \ 2 \n3 #include <concepts>\n 4 #include <iostream>     \n 5 \n6 template <std::regular\
  \ T>\n 7 class MyVector{};\n 8 \n9 int main() {\n10 \n11     MyVector<int> myVec1;\n\
  12     MyVector<int&> myVec2;  // 错误，因为引用不是 regular\n13 \n14 }\n```\n\n### 在类定义中使用概念\n\
  \n第 12 行导致了编译错误，因为引用不是 `regular`。这里是 GCC 编译器信息的核心部分：\n\n![引用不是 `regular`](img/CoreLanguage----conceptClassTemplateError.PNG)\n\
  \n引用不是 `regular`\n\n### 4.1.4.4.3 泛型成员函数\n\n在这个示例中，我为 `MyVector` 类添加了一个泛型 `push_back`\
  \ 成员函数。`push_back` 要求其参数是可拷贝的。\n\n```cpp\n 1 // conceptMemberFunction.cpp\n 2 \n\
  3 #include <concepts>\n 4 #include <iostream>     \n 5 \n6 struct NotCopyable {\n\
  \ 7     NotCopyable() = default;\n 8     NotCopyable(const NotCopyable&) = delete;\n\
  \ 9 };\n10 \n11 template <typename T>\n12 struct MyVector{\n13     void push_back(const\
  \ T&) requires std::copyable<T> {}\n14 };\n15 \n16 int main() {\n17 \n18     MyVector<int>\
  \ myVec1;\n19     myVec1.push_back(2020);\n20 \n21     MyVector<NotCopyable> myVec2;\n\
  22     myVec2.push_back(NotCopyable());  // 错误，因为不可拷贝\n23 \n24 }\n```\n\n### 在泛型成员函数中使用概念\n\
  \n编译在第 22 行故意失败。`NotCopyable` 的实例不可拷贝，因为拷贝构造函数被声明为删除（deleted）。\n\n### 4.1.4.4.4\
  \ 变参模板\n\n你可以在变参模板中使用概念。\n\n```cpp\n 1 // allAnyNone.cpp\n 2 \n3 #include <concepts>\n\
  \ 4 #include <iostream>\n 5 \n6 template<std::integral... Args>\n 7 bool all(Args...\
  \ args) { return (... && args); }\n 8 \n9 template<std::integral... Args>\n 10 bool\
  \ any(Args... args) { return (... || args); }\n11 \n12 template<std::integral...\
  \ Args>\n13 bool none(Args... args) { return (... && args); }\n14 \n15 int main(){\n\
  16 \n17     std::cout << std::boolalpha;\n18                \n19     std::cout <<\
  \ \"all(5, true, false): \" << all(5, true, false) << '\\n';\n20 \n21     std::cout\
  \ << \"any(5, true, false): \" << any(5, true, false) << '\\n';\n22 \n23     std::cout\
  \ << \"none(5, true, false): \" << none(5, true, false) << '\\n';\n24     \n25 }\n\
  ```\n\n将概念应用于变参模板\n\n### 4.1.4.4.5 重载\n\n`std::advance` 是一个将迭代器移动 `n` 个元素的算法。根据迭代器的能力可以使用概念。例如，`std::forward_list`\
  \ 只能向前移动，而 `std::list` 支持双向移动，`std::vector` 支持随机访问迭代。\n\n因此，对于 `std::forward_list`\
  \ 或 `std::list`，调用 `std::advance(iter, n)` 必须递增 `n` 次。对于 `std::vector` 提供的 `random_access_iterator`，这种时间复杂度并不成立，`n`可以直接加到迭代器。线性时间复杂度\
  \ $O(n)$ 变成了常数复杂度 $O(1)$。为了区分迭代器类型，可以使用概念。`conceptsOverloadingTemplates.cpp` 程序应该能给你大致的概念。\n\
  \n```cpp\n 1 // conceptsOverloadingTemplates.cpp\n 2 \n3 #include <concepts>\n 4\
  \ #include <iostream>\n 5 #include <forward_list>\n 6 #include <list>\n 7 #include\
  \ <vector>\n 8 \n9 template<std::forward_iterator I>\n10 void advance(I& iter, int\
  \ n){\n11     std::cout << \"forward_iterator\" << '\\n';\n12 }\n13 \n14 template<std::bidirectional_iterator\
  \ I>\n15 void advance(I& iter, int n){\n16     std::cout << \"bidirectional_iterator\"\
  \ << '\\n';\n17 }\n18 \n19 template<std::random_access_iterator I>\n20 void advance(I&\
  \ iter, int n){\n21     std::cout << \"random_access_iterator\" << '\\n';\n22 }\n\
  23 \n24 int main() {\n25 \n26     std::cout << '\\n';\n27 \n28     std::forward_list\
  \ forwList{1, 2, 3};\n29     std::forward_list<int>::iterator itFor = forwList.begin();\n\
  30     advance(itFor, 2);\n31 \n32     std::list li{1, 2, 3};\n33     std::list<int>::iterator\
  \ itBi = li.begin();\n34     advance(itBi, 2);\n35 \n36     std::vector vec{1, 2,\
  \ 3};\n37     std::vector<int>::iterator itRa = vec.begin();\n38     advance(itRa,\
  \ 2);\n39 \n40     std::cout << '\\n';\n41 }\n```\n\n\n\n\n\n`advance` 函数的三种变体在概念\
  \ `std::forward_iterator`（第 9 行）、`std::bidirectional_iterator`（第 14 行）和 `std::random_access_iterator`（第\
  \ 19 行）上进行了重载。编译器会选择最合适的重载。这意味着对于 `std::forward_list`（第 28 行），使用了基于概念 `std::forward_list`\
  \ 的重载；对于 `std::list`（第 32 行），使用了基于概念 `std::bidirectional_iterator` 的重载；而对于 `std::vector`（第\
  \ 36 行），使用了基于概念 `std::random_access_iterator` 的重载。\n\n![在概念上重载函数模板](img/CoreLanguage----conceptsOverloadingFunctionTemplates.png)\n\
  \n## 在概念上重载函数模板\n\n`std::random_access_iterator` 是一个 `std::bidirectional_iterator`，而\
  \ `std::bidirectional_iterator` 也是一个 `std::forward_iterator`。\n\n### 4.1.4.4.6 模板特化\n\
  \n你也可以使用概念来特化模板。\n\n```cpp\n 1 // conceptsSpecialization.cpp\n 2 \n 3 #include <concepts>\n\
  \ 4 #include <iostream>\n 5 \n 6 template <typename T>\n 7 struct Vector {\n 8 \
  \    Vector() {\n 9         std::cout << \"Vector<T>\" << '\\n';\n10     }\n11 };\n\
  12 \n13 template <std::regular Reg>\n14 struct Vector<Reg> {\n15     Vector() {\n\
  16         std::cout << \"Vector<std::regular>\" << '\\n';\n17     }\n18 };\n19\
  \ \n20 int main() {\n21 \n22     std::cout << '\\n';\n23 \n24     Vector<int> myVec1;\n\
  25     Vector<int&> myVec2;\n26 \n27     std::cout << '\\n';\n28 \n29 }\n```\n\n\
  ### 概念上的部分模板特化\n\n在实例化类模板时，编译器会选择特特化的那一个。这意味着对于调用 `Vector<int> myVec`（第 24 行），选择了针对\
  \ `std::regular` 的部分模板特化（第 13 行）。引用 `Vector<int&> myVec2`（第 25 行）并不是 `regular`。因此，选择了主模板（第\
  \ 6 行）。\n\n![概念上的部分模板特化](img/CoreLanguage----conceptsSpecialization.png)\n\n###\
  \ 概念上的部分模板特化\n\n### 4.1.4.4.7 使用多个概念\n\n到目前，概念的使用还很直观，但大多数情况下，会同时使用多个概念。\n\n```cpp\n\
  template<typename Iter, typename Val>\n    requires std::input_iterator<Iter>\n\
  \          && std::equality_comparable<Value_type<Iter>, Val>\nIter find(Iter b,\
  \ Iter e, Val v)\n```\n\n### 使用多个概念\n\n`find` 函数对迭代器 `Iter` 及其与 `Val` 的比较要求满足：\n\
  \n* 迭代器必须是一个输入迭代器；\n* 迭代器的值类型必须与 `Val` 可等等比较。\n\n对迭代器的相同限制也可以表示为受限模板参数。\n\n```cpp\n\
  template<std::input_iterator Iter, typename Val>\n    requires std::equality_comparable<Value_type<Iter>,\
  \ Val>\nIter find(Iter b, Iter e, Val v)\n```\n\n### 使用多个概念\n\n## 4.1.5 受限与未受限占位符\n\
  \n首先，让我告诉你们关于 C++14 中的一种不对称性。\n\n#### 4.1.5.1 C++14 中的大不对称性\n\n我经常在课上进行讨论，方式如下：在\
  \ C++14 中，我们有了泛型 lambda（generic lambdas）。泛型 lambda 是使用 `auto` 代替具体类型的 lambda 表达式。\n\
  \n```cpp\n 1 // genericLambdaTemplate.cpp\n 2 \n 3 #include <iostream>\n 4 #include\
  \ <string>\n 5 \n 6 auto addLambda = [](auto fir, auto sec){ return fir + sec; };\
  \ \n 7 \n 8 template <typename T, typename T2>                            \n 9 auto\
  \ addTemplate(T fir, T2 sec){ return fir + sec; }\n10 \n11 int main(){\n12 \n13\
  \     std::cout << std::boolalpha << '\\n';\n14 \n15     std::cout << addLambda(1,\
  \ 5) << \" \" << addTemplate(1, 5) << '\\n';\n16     std::cout << addLambda(true,\
  \ 5) << \" \" << addTemplate(true, 5) << '\\'\n17 \\n';\n18     std::cout << addLambda(1,\
  \ 5.5) << \" \" << addTemplate(1, 5.5) << '\\n\\\n19 ';\n20     \n21     const std::string\
  \ fir{\"ge\"};\n22     const std::string sec{\"neric\"};\n23     std::cout << addLambda(fir,\
  \ sec) << \" \" << addTemplate(fir, sec) <<\\\n24  '\\n';\n25 \n26     std::cout\
  \ << '\\n';\n27 \n28 }\n```\n\n### 泛型 lambda 与函数模板的比较\n\n泛型 lambda（第 6 行）和函数模板（第\
  \ 8 行）产生相同的结果。\n\n![泛型 lambda 与函数模板的使用](img/CoreLanguage----genericTemplate.png)\n\
  \n### 泛型 lambda 与函数模板的使用\n\n泛型 lambda 引入了定义函数模板的新方式。在课上，我经常被问：我们可以在函数中使用 `auto`\
  \ 来获取函数模板吗？C++14 不行，但 C++20 可以。在 C++20 中，你可以在函数声明中使用未受限占位符（`auto`）或受限占位符（概念）来自动获取函数模板。应用规则尽可能简单：在每个可以使用使用未受限占位符\
  \ `auto` 的地方，你都可以使用概念。我将在简写函数模板的章节中详细介绍。\n\n#### 4.1.5.2 占位符\n\n```cpp\n 1 // placeholders.cpp\n\
  \ 2 \n 3 #include <concepts>\n 4 #include <iostream>\n 5 #include <vector>\n 6 \n\
  \ 7 std::integral auto getIntegral(int val){\n 8     return val;\n 9 }\n10 \n11\
  \ main(){\n12 \n13     std::cout << std::boolalpha << '\\n';\n14 \n15     std::vector<int>\
  \ vec{1, 2, 3, 4, 5};\n16     for (std::integral i: vec) std::cout << i << \" \"\
  ;\n17     std::cout << '\\n';\n18 \n19     std::integral auto b = true;\n20    \
  \ std::cout << '\\n';\n21 \n22     std::integral auto integ = getIntegral(10); \
  \            \n23     std::cout << integ << '\\n';\n24 \n25     auto integ1 = getIntegral(10);\
  \                     \n26     std::cout << integ1 << '\\n';\n27 \n28 }\n\n 使用受限占位符代替未受限占位符\n\
  \n`std::integral` 可以作为返回类型（第 7 行）、范围 for 循环（第 16 行）、变量 `b` 的类型（第 19 行）或 `integ`（第\
  \ 22 行）。为了看到 `auto` 与概念之间的不对称性，第 25 行单独使用了 `auto`。因此，`integ1` 可以接受任何类型。\n\n![受限占位符的使用](img/CoreLanguage----Placeholders.png)\n\
  \n### 受限占位符代替未受限占位符\n\n#### 4.1.5.6 简写函数模板\n\n在 C++20 中，你可以在函数声明中使用未受限占位符（`auto`）或受限占位符（概念），这种函数声明变成了函数模板。\n\
  \n```cpp\n 1 //FunctionTemplates.cpp\n 2 \n 3 #include <concepts>\n 4 #include <iostream>\n\
  \ 5 \n 6 template<typename T>\n 7 requires std::integral<T>\n 8 auto gcd(T a, T\
  \ b){\n 9     if ( b == 0 ) return a;\n10    return gcd(b, a % b);\n11 }\n12 \n\
  13 template<typename T>                                  \n14 requires std::integral<T>\n\
  15 auto gcd1(T a, T b){\n16     if ( b == 0 ) return a;\n17     return gcd1(b, a\
  \ % b);\n18 }\n19 \n20 template<typename T>                                  \n\
  21 requires std::integral<T>\n22 auto gcd2(T a, T b){\n23     if ( b == 0 ) return\
  \ a;\n24     return gcd2(b, a % b);\n25 }\n26 \n27 std::integral auto gcd3(std::integral\
  \ auto a, std::integral auto b){\n28     if ( b == 0 ) return a;\n29     return\
  \ gcd3(b, a % b);\n30 }\n31 \n32 auto gcd4(auto a, auto b){\n33     if ( b == 0\
  \ ) return a;\n34     return gcd4(b, a % b);\n35 }\n36 \n37 int main(){\n38 \n39\
  \     std::cout << '\\n';\n40 \n41     std::cout << \"gcd(100, 10)= \" <<  gcd(100,\
  \ 10) << '\\n';\n42     std::cout << \"gcd1(100, 10)= \" <<  gcd1(100, 10) << '\\\
  n';\n43     std::cout << \"gcd2(100, 10)= \" <<  gcd2(100, 10) << '\\n';\n44   \
  \  std::cout << \"gcd3(100, 10)= \" <<  gcd3(100, 10) << '\\n';\n45     std::cout\
  \ << \"gcd4(100, 10)= \" <<  gcd4(100, 10) << '\\n';\n46 \n47 }\n```\n\n\n\n\n\n\
  函数模板 `gcd` (第 6 行)、`gcd1` (第 13 行) 和 `gcd2` (第 19 行) 的定义是我在使用概念的四种方法节中介绍过的。`gcd`\
  \ 使用了 `requires` 子句，`gcd1` 使用了尾随 `requires` 子句，而 `gcd2` 是一个受限的模板参数。现在来看一些新内容。函数模板\
  \ `gcd3` 将概念 `std::integral` 作为类型参数，因此它变成了一个带有限制类型参数的函数模板。相比之下，`gcd4` 等于对其类型参数没有限制的函数模板。在\
  \ `gcd3` 和 `gcd4` 中用于创建函数模板的语法被称为简写函数模板语法。\n\n![受限 ](img/CoreLanguage----abbreviatedFunctionTemplates.PNG)\n\
  \n## 受限 (Constrained)\n\n*让我通过下面的另一个示例来强调这种对称性。*\n\n通过使用 `auto` 作为类型参数，函数 `add`\
  \ 变成了一个函数模板，并等同于同名的函数模板 `add`。\n\n```\ntemplate<typename T, typename T2>\nauto add(T\
  \ fir, T2 sec) {\n    return fir + sec;\n}\n\nauto add(auto fir, auto sec) {\n \
  \   return fir + sec;\n}\n```\n\n等价函数和函数模板 `add`\n\n因此，由于使用了概念 `std::integral`，函数\
  \ `sub` 等于函数模板 `sub`。\n\n```\ntemplate<std::integral T, std::integral T2>      \
  \                     \nstd::integral auto sub(T fir, T2 sec) {\n    return fir\
  \ - sec;\n}\n\nstd::integral auto sub(std::integral auto fir, std::integral auto\
  \ sec) \\\n{  \n    return fir - sec;\n}\n```\n\n等价函数和函数模板 `sub`\n\n函数和函数模板可以具有任意类型。这意味着两个类型可以不同，但必须是整型的。例如，调用\
  \ `sub(100, 10)` 和 `sub(100, true)` 都是有效的。\n\n简写函数模板语法中仍然缺少一个有趣的特性：你可以对 `auto` 或概念进行重载。\n\
  \n### 4.1.6.1 重载\n\n以下函数 `overload` 分别对 `auto`、概念 `std::integral` 以及类型 `long` 进行了重载。\n\
  \n```cpp\n 1 // conceptsOverloading.cpp\n 2 \n 3 #include <concepts>\n 4 #include\
  \ <iostream>\n 5 \n 6 void overload(auto t){\n 7     std::cout << \"auto : \" <<\
  \ t << '\\n';\n 8 }\n 9 \n10 void overload(std::integral auto t){\n11     std::cout\
  \ << \"Integral : \" << t << '\\n';\n12 }\n13 \n14 void overload(long t){\n15  \
  \   std::cout << \"long : \" << t << '\\n';\n16 }\n17 \n18 int main(){\n19     \n\
  20     std::cout << '\\n';\n21 \n22     overload(3.14);            \n23     overload(2010);\
  \            \n24     overload(2020L);            \n25 \n26     std::cout << '\\\
  n';\n27     \n28 }\n```\n\n简写函数模板与重载\n\n编译器为双浮点数选择了 `auto` 重载（第 6 行），为 `int` 选择了概念\
  \ `std::integral` 重载（第 10 行），并为 `long` 选择了 `long` 重载（第 14 行）。\n\n![简写函数模板与重载](img/CoreLanguage----conceptsOverloading.png)\n\
  \n简写函数模板与重载\n\n### 4.1.7 预定义概念\n\n“不要重复发明轮子”的黄金法则也适用于概念。[C++ 核心准指南](https://isocpp.github.io/CppCoreGuidelines/CppCoreGuidelines)\
  \ 对这一规则非常明确：T.11：尽可能使用标准概念。因此，我想给你们概述一下重要的预定义概念。我刻意忽略了任何特殊或辅助概念。\n\n所有预定义概念都详细列在最新的\
  \ C++20 工作草案 [N4860](https://isocpp.org/files/papers/N4860.pdf) 中，找到所有的概念可能是一个巨大的挑战！大部分概念位于第\
  \ 18 章（概念库）和第 24 章（范围库）。此外，少数概念位于第 17 章（语言支持库）、第 20 章（通用工具库）、第 23 章（迭代器库）和第 26 章（数值库）。C++20\
  \ 草案 N4860 还包含一个所有库概念的索引，并展示了这些概念是如何实现的。\n\n#### 4.1.7.1 语言支持库\n\n本节讨论了一个有趣的概念 `three_way_comparable`。它用于支持三路比较运算符。它在头文件\
  \ `<compare>` 中指定。\n\n更正式地说，让 `a` 和 `b` 为类型 `T` 的值。只有满足以下，这些值是 `three_way_comparable`\
  \ 的：\n\n*   `(a <=> b == 0) == bool`\n*   `(a == b)`\n*   `(a != b)`\n*   `(a <\
  \ b)`\n*   `(a > b)`\n*   `(a <= b)`\n*   `(a >= b)`\n\n#### 4.1.7.2 库\n\n最常用的概念可以在\
  \ `<concepts>` 中找到。\n\n##### 4.1.7.2.1 语言支持库\n\n本节讨论了一个有趣的概念 `three_way_comparable`。它用于支持三路比较运算符。它在头文件\
  \ `<compare>` 中指定。\n\n更正式地说，让 `a` 和 `b` 为类型 `T` 的值。只有满足以下，这些值是 `three_way_comparable`\
  \ 的：\n\n*   `(a <=> b == 0) == bool`\n*   `(a == b)`\n*   `(a != b)`\n*   `(a <\
  \ b)`\n*   `(a > b)`\n*   `(a <= b)`\n*   `(a >= b)`\n\n##### 4.1.7.2.2 对象概念\n\n\
  本节包含了关于类型的 15 个概念。\n\n##### 4.1.7.2.3  {概念}\n\n*   `destructible`\n*   `constructible_from`\n\
  *   `default_initializable`\n*   `move_constructible`\n*   `copy_constructible`\n\
  \n##### 4.1.7.2.4 比较概念\n\n*   `equality_comparable`\n*   `totally_ordered`\n\n可能你在数学学习中了解过它：对于类型\
  \ `T` 的值 `a`、`b` 和 `c`，`T` 满足 `totally_ordered` 当且仅当：\n\n*   `bool(a < b)`、`bool(a\
  \ > b)` 或 `bool(a == b)` 中恰有一个为 `true`\n*   如果 `bool(a < b)` 且 `bool(b < c)`，则 `bool(a\
  \ < c)`\n*   `bool(a > b) == bool(b < a)`\n*   `bool(a <= b) == !bool(b < a)`\n\
  *   `bool(a >= b) == !bool(a < b)`\n\n##### 4.1.7.2.5 对象概念\n\n*   `movable`\n* \
  \  `copyable`\n*   `semiregular`\n*   `regular`\n\n这里是这四个概念的简洁定义：\n\n```cpp\ntemplate<class\
  \ T>\nconcept movable = is_object_v<T> && move_constructible<T> && \n          \
  \        assignable_from<T&, T> && swappable<T>;\n\ntemplate<class T>\nconcept copyable\
  \ = copy_constructible<T> && movable<T> && \n                   assignable_from<T&,\
  \ T&> &&\n                   assignable_from<T&, const T&);\n\ntemplate<class T>\n\
  concept semiregular = copyable<T> && default_initializable<T>;\n\ntemplate<class\
  \ T>\nconcept regular = semiregular<T> && equality_comparable<T>;\n```\n\n我必须补充几句话。`movable`\
  \ 概念对 `T` 要求 `is_object_v<T>` 成立。根据类型特征 `is_object<T>` 的定义，这意味着 `T` 是标量、数组、联合体或类。\n\
  \n\n\n\n\n我在定义概念 章节中实现了 `semiregular` 和 `regular` 概念。通俗地说，`semiregular` 类型的行为类似于\
  \ `int`，而 `regular` 类型的行为类似于 `int` 并且可以使用 `==` 进行比较。\n\n### 4.1.7.2.6 可调用概念\n\n\
  * `invocable`\n* `regular_invocable`: 该类型实现了 `invocable` 且保持等效性，并且不修改函数参数；等效性意味着它在给定相同输入时会产生相同的输出。\n\
  * `predicate`: 如果一个类型实现了 `invocable` 并且返回布尔值，则该类型为谓词。\n\n### 4.1.7.3 通用工具库\n\n标准库中的这一章只包含特殊的内存概念；因此我在这里不再引用它们。\n\
  \n### 4.1.7.4 迭代器库\n\n迭代器库有许多重要的概念。它们定义在 `<iterator>` 头文件中。以下是迭代器分类：\n\n* `input_iterator`\n\
  * `output_iterator`\n* `forward_iterator`\n* `bidirectional_iterator`\n* `random_access_iterator`\n\
  * `contiguous_iterator`\n\n这六类迭代器对应相应的迭代器概念。下表提供了两个有趣的信息。对于三个最显著的迭代器分类，表格显示了它们的属性以及关联的标准库容器。\n\
  \n每个迭代器分类的属性和容器\n\n| 迭代器分类 | 属性 | 容器 |\n| --- | --- | --- |\n| | | |\n| `std::forward_iterator`\
  \ | `++It`, `It++` , `*It` | `unordered_set` |\n| | `It == It2`, `It != It2` | `unordered_map`\
  \ |\n| | | `unordered_multiset` |\n| | | `unordered_multimap` |\n| | | `forward_list`\
  \ |\n| `std::bidirectional_iterator` | `--It`, `It--` | `set` |\n| | | `map` |\n\
  | | | `multiset` |\n| | | `multimap` |\n| | | `list` |\n| `std::random_access_iterator`\
  \ | `It[i]` | `array` |\n| | `It += n`, `It -= n` | `vector` |\n| | `It + n` , `It\
  \ - n` | `deque` |\n| | `n + It` | `string` |\n| | `It - It2` | |\n| | `It < It2`,\
  \ `It <= It2` | |\n| | `It > It2`, `It >= It2` | |\n\n存在以下关系：随机访问迭代器是双向迭代器，双向迭代器是前向迭代器。连续迭代器是随机访问迭代器，并且容器的元素在内存中连续存储。这意味着\
  \ `std::array`、`std::vector` 和 `string` 支持连续迭代器，但 `std::deque` 不。\n\n#### 4.1.7.4.1\
  \ 算法概念\n\n* `mutable`: 可以原地重排元素\n* `mergeable`: 可以合并到一个输出序列\n* `sortable`: 可以对序列排序\n\
  \n### 4.1.7.5 Ranges 库\n\nranges 库包含了 ranges 和视图（views）的关键概念。它们与 迭代器库 中的概念相似，并定义在\
  \ `<ranges>` 头文件中。\n\n#### 4.1.7.5.1 Ranges\n\n* `range`: 指定可以遍历的项组。它提供一个起始迭代器结束哨兵（sentinel）。当然，STL\
  \ 的容器都是 ranges。对于 `std::ranges::range` 的进一步细分：\n\n* `input_range`: 指定迭代器类型满足 `input_iterator`\
  \ 的范围（至少从头到尾迭代一次）\n* `output_range`: 指定迭代器类型满足 `output_iterator` 的范围\n* `forward_range`:\
  \ 指定迭代器类型满足 `forward_iterator` 的范围（可以从头到尾迭代多次）\n* `bidirectional_range`: 指定迭代器类型满足\
  \ `bidirectional_iterator` 的范围（可以向前和向后迭代多次）\n* `random_access_range`: 指定迭代器类型满足\
  \ `random_access_iterator` 的范围（常量时间内跳转）\n* `contiguous_range`: 指定迭代器类型满足 `contiguous_iterator`\
  \ 的范围（元素在内存中连续存储）\n\n标准库的每个容器都支持特定的范围，范围指定了其迭代器的能力。每个范围的属性和容器\n\n| 概念 | 属性 | 容器\
  \ |\n| --- | --- | --- |\n| | | |\n| `std::ranges::input_range` | `++It`, `It++`\
  \ , `*It` | `unordered_set` |\n| | `It == It2`, `It != It2` | `unordered_map` |\n\
  | | | `unordered_multiset` |\n| | | `unordered_multimap` |\n| | | `forward_list`\
  \ |\n| `std::ranges::bidirectional_range` | `--It`, `It--` | `set` |\n| | | `map`\
  \ |\n| | | `multiset` |\n| | | `multimap` |\n| | | `list` |\n| `std::ranges::random_access_range`\
  \ | `It[i]` | `array` |\n| | `It += n`, `It -= n` | `vector` |\n| | `It + n` , `It\
  \ - n` | `deque` |\n| | `n + It` | `string` |\n| | `It - It2` | |\n| | `It < It2`,\
  \ `It <= It2` | |\n| | `It > It2`, `It >= It2` | |\n\n#### 4.1.7.5.2 视图\n\n`std::ranges::view`\
  \ 通常是你应用在范围上并执行某些操作的东西。视图不拥有数据，视图拷贝、移动或赋值的时间是常数。这里有一句来自 Eric Niebler 的 range-v3\
  \ 实现的话，它是 C++20 ranges 的基础：“视图是范围的可组合适配，这种适配在迭代视图时惰性地发生。”\n\n### 4.1.7.6 数值库\n\n\
  数值库提供了定义在 `<random>` 头中的 `uniform_random_bit_generator` 概念。类型为 `G` 的 `uniform_random_bit_generator`\
  \ `g` 必须返回均匀分布的无符号整数。此外，类型为 `G` 的均匀随机位生成器 `g` 需要支持成员函数 `G::min` 和 `G::max`。\n\n\
  #### 4.1.8 定义概念\n\n当你寻找的概念 C++20 预定义概念之一时，你必须定义自己的概念。在本节中，我将定义几个概念，通过使用驼峰命名法（CamelCase）与预定义概念区分开来。因此，我的有符号整数概念命名为\
  \ `SignedIntegral`，而 C++ 标准概念名为 `signed_integral`。\n\n定义概念的语法非常简单：\n\n```\ntemplate\
  \ <template-parameter-list>\nconcept concept-name = constraint-expression;\n```\n\
  \n概念定义\n\n概念定义从 `template` 关键字开始，并有一个模板参数列表。第二行更有趣。它使用 `concept` 关键字，后跟概念名称和约束表达式。\n\
  \n`constraint-expression` 可以是：\n\n* 其他概念或编译时谓词的逻辑组合\n\n    * 逻辑组合可以通过取与 (`&&`）、取或\
  \ (`||`) 或取非 (`!`) 来构建\n\n\n\n\n编译时谓词是可调用对象，它们在编译时返回一个布尔值。\n\n*   一个 `requires`\
  \ 表达式\n    * 简单要求\n    * 类型要求\n    * 复合要求\n    * 嵌套要求\n\n在接下来的两个章节中，我将演示定义概念的不同方法。\n\
  \n#### 4.1.8.1 其他概念与编译时谓词的逻辑组合\n\n你可以使用逻辑与（`&&`）和逻辑或（`||`）运算符来组合概念和编译时谓词。在构建逻辑组合时，可以使用感叹号（`!`）对组件进行取反。得益于\
  \ [type-traits 库](https://en.cppreference.com/w/cpp/header/type_traits) 中许多编译时谓词，你拥有了构建强大概念所需的所有工具。\n\
  \n让我们从 `Integral`、`SignedIntegral` 和 `UnsignedIntegral` 概念开始。\n\n```cpp\n1 template\
  \ <typename T>\n2 concept Integral = std::is_integral<T>::value;\n3 \n4 template\
  \ <typename T>\n5 concept SignedIntegral = Integral<T> && std::is_signed<T>::value;\n\
  6 \n7 template <typename T>\n8 concept UnsignedIntegral = Integral<T> && !SignedIntegral<T>;\n\
  ```\n\n`Integral`、`SignedIntegral` 和 `UnsignedIntegral` 概念\n\n我使用了 type-traits 函数\
  \ [`std::is_integral`](https://en.cppreference.com/w/cpp/types/is_integral) 来定义概念\
  \ `Integral`（第 2 行）。通过函数 `std::is_signed`，我将概念 `Integral` 细化为概念 `SignedIntegral`（第\
  \ 4 行）。最后，通过取反概念 `SignedIntegral` 得到了概念 `UnsignedIntegral`（第 7 行）。\n\n好了，让我们尝试一下。\n\
  \n```cpp\n 1 // SignedUnsignedIntegrals.cpp\n 2 \n3 #include <iostream>\n 4 #include\
  \ <type_traits>\n 5 \n6 template <typename T>\n 7 concept Integral = std::is_integral<T>::value;\n\
  \ 8 \n9 template <typename T>\n10 concept SignedIntegral = Integral<T> && std::is_signed<T>::value;\n\
  \ 11 \n12 template <typename T>\n13 concept UnsignedIntegral = Integral<T> && !SignedIntegral<T>;\n\
  \ 14 \n15 void func(SignedIntegral auto integ) {\n16     std::cout << \"SignedIntegral:\
  \ \" << integ << '\\n';\n17 }\n18 \n19 void func(UnsignedIntegral auto integ) {\n\
  20     std::cout << \"UnsignedIntegral: \" << integ << '\\n';\n21 }\n22 \n23 int\
  \ main() {\n24 \n25     std::cout << '\\n';\n26 \n27     func(-5);\n28     func(5u);\n\
  29 \n30     std::cout << '\\n';\n31 \n32 }\n```\n\n`Integral`、`SignedIntegral` 和\
  \ `UnsignedIntegral` 概念的使用\n\n我使用了简写函数模板语法在概念 `SignedIntegral`（第 15 行）和 `UnsignedIntegral`（第\
  \ 19 行）上重载函数 `func`。编译器选择了预期的重载版本：\n\n![`SignedIntegral` 和 `UnsignedIntegral` 概念的使用](img/CoreLanguage----SignedUnsignedIntegrals.png)\n\
  \n`SignedIntegral` 和 `UnsignedIntegral` 概念的使用\n\n为了完整性，接下来的概念 `Arithmetic` 使用了逻辑或。\n\
  \n```cpp\ntemplate <typename T>\nconcept Arithmetic = std::is_integral<T>::value\
  \ || std::is_floating_point<T>::value;\n```\n\n`Arithmetic` 概念\n\n#### 4.1.8.2 requires\
  \ 表达式\n\n得益于 `requires` 表达式，你可以定义强大的概念。一个 `requires` 表达式具有以下形式：\n\n```cpp\nrequires\
  \ (parameter-list(optional)) {requirement-seq} \n```\n\n`requires` 表达式\n\n*   `parameter-list`:\
  \ 逗号分隔的参数列表，例如函数声明中的参数。\n*   `requirement-seq`: 要求序列，由简单要求、类型要求、复合要求或嵌套要求组成。\n\n\
  ##### 4.1.8.2.1 简单要求\n\n下面的概念 `Addable` 是一个简单要求：\n\n```cpp\ntemplate<typename T>\n\
  concept Addable = requires (T a, T b) {\n    a + b; \n};\n```\n\n`Addable` 概念\n\n\
  `Addable` 概念要求相同类型 `T` 的两个值进行加法 `a + b` 是可能的。\n\n##### 4.1.8.2.2 类型要求\n\n在类型要求中，你必须将关键字\
  \ `typename` 配合类型名使用。\n\n```cpp\ntemplate<typename T> \nconcept TypeRequirement\
  \ = requires {\n    typename T::value_type; \n    typename Other<T>;     \n};\n\
