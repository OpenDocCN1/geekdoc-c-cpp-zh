  ## 5.5 日历与时区\n\n![Cippi 正在研究日历](img/Cippi----CippiColorCalendar.jpg)\n\nCippi 正在研究日历\n\
  \nC++20 为 chrono 库新增了组件：\n\n*   天时间（time of day）自午夜开始的持续时间，分为小时、分钟、秒和分数。\n*   日历（calendar）代表各种日历日期，如年、月、星期或周中的第\
  \ n 天。\n*   时区（time zone）代表特定地理区域的时间。\n\n本质上，时区功能（C++20）基于日历功能（C++20），而日历功能（C++20）基于\
  \ chrono 功能（C++11）。\n\n这并不是全部。C++20 扩展还包含了新的时钟。感谢 C++20 中的格式化库，持续时间可以方便地读取或写入。\n\
  \n### 5.5.1 一天时间\n\n`std::chrono::hh_mm_ss` 是自午夜开始的持续时间，分为小时、分钟、秒和分数。这种类型通常作为格式化工具。首先，下表提供了\
  \ `std::chrono::hh_mm_ss` 实例 `tOfDay` 的简要概述。\n\n| 函数 | 描述 |\n| --- | --- |\n| `tOfDay.hours()`\
  \ | 返回午夜后的时 |\n| `tOfDay.minutes()` | 返回午夜后的分 |\n| `tOfDay.seconds()` | 返回午夜后的秒\
  \ |\n| `tOfDay.subseconds()` | 返回午夜后的分数秒 |\n| `tOfDay.to_duration()` | 返回午夜后的持续时间\
  \ |\n| `std::chrono::make12(hour)` | 将 24 小时格式转换为 12 小时 |\n| `std::chrono::make24(hour)`\
  \ | 将 12 小时格式转换为 24 小时 |\n| `std::chrono::is_am(hour)` | 判断 24 小时格式是否为上午 |\n| `std::chrono::is_pm(hour)`\
  \ | 判断 24 小时格式是否为下午 |\n\n这些函数的使用非常直观。\n\n```cpp\n// timeOfDay.cpp\n2 \n#include\
  \ \"date.h\"\n4 #include <iostream>\n5 \n6 int main() {\n7      using namespace\
  \ date;                               \n8                \n9      using std::chrono_literals;\
  \ \n10 \n11      std::cout << std::boolalpha << '\\n';\n12      auto timeOfDay =\
  \ date::hh_mm_ss(10.5h + 98min + 200s + 0.5s); \n13     \n14      std::cout<< \"\
  timeOfDay: \" << timeOfDay << '\\n'; \n15 \n16      std::cout << '\\n';\n17 \n18\
  \      std::cout << \"timeOfDay.hours(): \" << timeOfDay.hours() << '\\n';  \n19\
  \        \n20      std::cout << \"timeOfDay.minutes(): \" << timeOfDay.minutes()\
  \ << '\\n';\n21     \n22      std::cout << \"timeOfDay.seconds(): \" << timeOfDay.seconds()\
  \ << '\\n';\n23         \n24      std::cout << \"timeOfDay.subseconds(): \" << timeOfDay.subseconds()\
  \ << '\\n';\n25      std::cout << \"timeOfDay.to_duration(): \" << timeOfDay.to_duration()\
  \ << '\\n';\n28 \n29      std::cout << '\\n';\n30 \n31      std::cout << \"date::hh_mm_ss(45700.5s):\
  \ \" << date::hh_mm_ss(45700.5s) << '\\n';\n33 \n34      std::cout << '\\n';\n35\
  \ \n36      std::cout << \"date::is_am(5h): \" << date::is_am(5h) << '\\n';    \
  \  \n37            \n38      std::cout << \"date::is_am(15h): \" << date::is_am(15h)\
  \ << '\\n'; \n39 \n40      std::cout << '\\n';\n41        \n42      std::cout <<\
  \ \"date::make12(5h): \" << date::make12(5h) << '\\n';\n43      std::cout << \"\
  date::make12(15h): \" << date::make12(15h) << '\\n';\n44 \n45 }\n```\n\n一天时间\n\n\
  首先我在第 12 行创建了一个 `std::chrono::hh_mm_ss` 实例：`timeOfDay`。感谢 C++14 的 chrono 字面量，我可以添加几个持续时间来初始化天时间对象。使用\
  \ C++20，你可以可以直接输出 `timeOfDay`（第 14 行）。这就是我必须在第 7 行引入 `date` 命名空间的原因。其余部分易读。第 18-21\
  \ 行显示了午夜后的时、分、秒和分数。第 22 行返回午夜后的秒持续时间。第 26 行更有趣：指定的秒对应第 15 行显示。第 30 和 32 行返回指定的小时是否为上午。第\
