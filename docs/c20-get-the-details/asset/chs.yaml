  \ `prepareJob()`（第 73 行）触发了协程对象的创建，而函数调用 `job.start()` 则触发了它的恢复，并因此完成（第 74 行）。因此，`MySuspendAlways`\
  \ 的成员函数 `await_ready`、`await_suspend` 和 `await_resume` 被执行。当你不恢复 Awaitable（例如，由成员函数\
  \ `final_suspend` 返回的协程对象）时，`await_resume` 函数不会被处理。相比之下，Awaitable 的 `MySuspendNever`\
  \ 函数立即就就绪，因为 `await_ready` 返回 `true`，因此不会发生挂起。\n\n得益于这些注释，你现在应该对 awaiterer 工作流 有了基础的理解。现在，是时候改变它了。\n\
  \n### 7.4.2 自动恢复 Awaiter\n\n在之前的工作流中，我显式地启动了任务。\n\n```\nint main() {\n\n    std::cout\
  \ <<  \"Before job\" << '\\n';\n\n    auto job = prepareJob();\n    job.start();\n\
  \n    std::cout <<  \"After job\" <<  '\\n';\n\n}\n```\n\n#### 显式启动任务\n\n这种显式调用\
  \ `job.start()` 是必要的，因为 Awaitable `MySuspendAlways` 中的 `await_ready` 总是返回 `false`。现在让我们假设\
  \ `await_ready` 可以返回 `true` 或 `false`，且任务没有被显式启动。简要回顾：当 `await_ready` 返回 `true`\
  \ 时，函数 `await_resume` 直接被调用，而不是调用 `await_suspend`。\n\n```cpp\n 1 // startJobWithAutomaticResumption.cpp\n\
