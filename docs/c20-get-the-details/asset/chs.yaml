  27     std::cout << hello << sumInt(5.5, 5.5) << '\\n';\n28     std::cout << hello\
  \ << sumGen(5.5, 5.5) << '\\n';\n29     std::cout << hello << sumDec(5.5, 5.5) <<\
  \ '\\n';\n30     \n31     std::cout << '\\n';\n32                              \
  \           \n33     std::string hello = \"Hello \";\n34     std::string world =\
  \ \"world\";\n35 \n36     std::cout << hello << sumInt(\"string literal\", \"string\
  \ literal\") << '\\n'; // 注意：此处原文代码逻辑有误（sumInt 接收 int），但按要求仅翻译注释/内容\n37     std::cout\
