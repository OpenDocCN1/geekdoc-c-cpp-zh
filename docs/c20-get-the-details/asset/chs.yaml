  \ std::ref(event2));\n 127     auto senderThread2 = std::thread([&event2]{\n 128\
  \       std::this_thread::sleep_for(2s);\n 129       event2.notify();\n 130    \
  \ });\n 131 \n 132     receiverThread2.join();\n 133     senderThread2.join();\n\
  \ 134 \n 135     std::cout << '\\n';\n 136 \n 137 }\n```\n\n# 线程同步\n\n从用户的角度来看，使用协程进行线程同步是非常直观的。让我们来看\
  \ `senderReceiver.cpp` 程序。线程 `senderThread1`（第 119 行）和 `senderThread2`（第 130 行）分别在第\
  \ 119 行和 132 行使用事件发送它们的通知。第 102 到 109 行的 `receiver` 函数是协程，它在线程 `receiverThread1`（第\
  \ 122 行）和 `receiverThread2`（第 135 行）中执行。\n\n\n\n\n\n如果你将无限数据流中的 `Generator` 类与本示例中的\
  \ `Event` 类进行比较，会发现一个细微的区别。在第一的情况下，`Generator` 既是可等待对象（awaitable）也是等待者（awaiter）；在第二的情况下，`Event`\
  \ 使用 `operator co_await` 来返回等待者。这种将关注点分离为可等待对象和等待者的做法改进了代码结构。\n\n输出显示第二个协程的执行大约花费了两秒钟。原因是\
  \ `event1` 在协程挂起之前发送了通知（第 119 行），而 `event2` 在持续 2 秒的时间后才发送其通知（第 132 行）。\n\n现在，我来戴上实现者的帽子。协程的工作流相当难以理解。`Event`\
  \ 类有两个有趣的成员：`suspendedWaiter` 和 `notified`。第 31 行的变量 `suspendedWaiter` 持有信号的等待者，而第\
  \ 32 行的 `notified` 则持有通知的状态。\n\n在我对这两种工作流的解释中，我假设在第一种情况（第一种工作流）下，事件通知发生在协程等待事件之前。对于第二种情况（第二种工作流），我假设情况相反。\n\
  \n让我们先看 `event1` 和第一种工作流。在这里，`event1` 在 `receiverThread1` 启动之前发送了通知。调用 `event1`（第\
  \ 118 行）触发了 `notify` 方法（第 75 到 86 行）。首先设置通知标志，然后通过 `static_cast<Awaiter*>(suspendedWaiter.load())`\
  \ 加载潜在的 `waiter`。在这种情况下，`waiter` 是 `nullptr`，因为它在之前没有被设置。这意味着第 84 行对 `waiter` 的后续\
  \ `resume` 调用没有执行。随后执行的函数 `await_ready`（第 51 - 61 行）首先检查是否存在多个 `waiter`。在这种情况下，我抛出了一个\
  \ `std::runtime` 异常。该方法的关键部分在于返回值。`event.notification` 已经在 `notify` 方法中被设置为 `true`。在这种情况下，`true`\
  \ 意味着协程没有挂起，而是像普通函数一样执行。\n\n在第二种工作流中，`co_await event2` 调用发生在 `event2` 发送通知之前。`co_await\
  \ event2` 触发了 `await_ready` 调用（第 51 行）。与第一种工作流的主要区别是 `event.notified` 为 `false`。这个\
  \ `false` 值导致协程挂起。技术上，执行了方法 `await_suspend`（第 63 - 73 行）。`await_suspend` 获取协程句柄\
  \ `corHandle` 并将其存储在变量 `coroutineHandle`（第 65 行）中以便以后调用。当然，后的调用意味着恢复。其次，`waiter`\
  \ 被存储在变量 `suspendedWaiter` 中。当后的 `event2.notify` 触发通知时，执行 `notify` 方法（第 75 行）。与第一种工作流的区别是条件\
  \ `waiter != nullptr` 结果为 `true`。结果是 `waiter` 使用 `coroutineHandle` 来恢复协程。\n\n###\
  \ 6.2 原子操作\n\n原子操作在 C++20 中引入了几个重要的扩展。可能最重要的是原子引用和原子指针。\n\n### 6.2.1 `std::atomic_ref`\n\
  \n类模板 `std::atomic_ref` 将原子操作应用于被引用的对象。对原子对象的并发读写确保了没有数据竞态。被引用对象的生命周期必须超过 `atomic_ref`\
  \ 的生命周期。当任何 `atomic_ref` 访问一个对象时，对该对象的所有其他访问必须使用 `atomic_ref`。此外，被 `atomic_ref`\
  \ 访问对象的任何子对象不能被另一个 `atomic_ref` 访问。\n\n#### 6.2.1.1 动机\n\n你可能认为在原子变量内部使用引用就能解决问题。遗憾并非如此。在下面的程序中，我有一个类\
  \ `ExpensiveCopy`，它包含一个 `counter`。该 `counter` 被几个线程并发递增。因此，`counter` 必须受到保护。\n\n\
  ```cpp\n// 1 atomicReference.cpp\n#include <atomic>\n#include <iostream>\n#include\
  \ <random>\n#include <thread>\n#include <vector>\n\nstruct ExpensiveCopy {\n   \
  \ int counter{};\n};\n\nint getRandom(int begin, int end) {\n    std::random_device\
  \ seed; // 种子\n    std::mt1937 engine(seed()); // 生成器\n    std::uniform_int_distribution<>\
  \ uniformDist(begin, end);\n    return uniformDist(engine);\n}\n\nvoid count(ExpensiveCopy&\
  \ exp) {\n    std::vector<std::thread> v;\n    std::atomic<int> counter{exp.counter};\n\
  \    for (int n = 0; n < 10; ++n) {\n        v.emplace_back([&counter] {\n     \
  \       auto randomNumber = getRandom(100, 200);\n            for (int i = 0; i\
  \ < randomNumber; ++i) { ++counter; }\n        });\n    }\n    for (auto& t : v)\
  \ t.join();\n}\n\nint main() {\n    std::cout << '\\n';\n    ExpensiveCopy exp;\n\
  \    count(exp);\n    std::cout << \"exp.counter: \" << exp.counter << '\\n';\n\
  }\n```\n\n### 使用原子引用\n\n变量 `exp`（第 42 行）是一个拷贝开销的对象。出于性能考虑，`count` 函数（第 22 行）通过引用接收\
  \ `exp`。`count` 使用 `exp.counter` 初始化 `std::atomic<int>`（第 25 行）。后续代码创建了 10 个线程（第\
  \ 27 行），每个线程执行 Lambda 表达式，它通过引用获取 `counter`。Lambda 表达式获取一个 100 到 200 之间的随机数（第 29\
  \ 行），并按次数增加计数器。`getRandom` 函数（第 13 行）从初始种子开始，并通过随机数生成器[梅森旋转算法](https://en.wikipedia.org/wiki/Mersenne_Twister)\
  \ 创建一个均匀分布的数字。\n\n在最后，`exp.counter`（第 44 行）应该有一个大约 1500 的值，因为十个线程每个递增了 150 次。在 [Wandbox\
  \ 在线编译器](https://wandbox.org/) 上运行该程序得到了一个令人惊讶的结果。\n\n### 原子引用的惊喜\n\n计数器是 0。发生了什么？问题出在第\
  \ 25 行。表达式 `std::atomic<int> counter{exp.counter}` 中的初始化创建了一个拷贝。下面的小程序说明了这个问题。\n\
  \n```cpp\n// 1 atomicRefCopy.cpp\n#include <atomic>\n#include <iostream>\n\nint\
  \ main() {\n    std::cout << '\\n';\n    int val{5};\n    int& ref = val;\n    std::atomic<int>\
  \ atomicRef(ref);\n    ++atomicRef;\n    std::cout << \"ref: \" << ref << '\\n';\n\
  \    std::cout << \"atomicRef.load(): \" << atomicRef.load() << '\\n';\n    std::cout\
  \ << '\\n';\n}\n```\n\n### 拷贝引用\n\n第 13 行的递增操作没有处理 `ref`（第 11 行）。`ref` 的值没有改变。\n\
  \n将 `std::atomic<int>` 替换为 `std::atomic_ref<int>` 解决了这个问题。\n\n\n\n\n\n```cpp\n//\
  \ atomicRef.cpp\n\n#include <atomic>\n#include <iostream>\n#include <random>\n#include\
  \ <thread>\n#include <vector>\n\nstruct ExpensiveToCopy {\n    int counter{};\n\
  };\n\nint getRandom(int begin, int end) {\n\n    std::random_device seed;      \
  \  // 随机\n    std::mt19937 engine(seed());    // 生成器\n    std::uniform_int_distribution<>\
  \ uniformDist(begin, end);\n\n    return uniformDist(engine);\n}\n\nvoid count(ExpensiveToCopy&\
  \ exp) {\n\n    std::vector<std::thread> v;\n    std::atomic_ref<int> counter{exp.counter};\n\
  \n    for (int n = 0; n < 10; ++n) {\n        v.emplace_back([&counter] {\n    \
  \        auto randomNumber = getRandom(100, 200);\n            for (int i = 0; i\
  \ < randomNumber; ++i) { ++counter; }\n        });\n    }\n\n    for (auto& t :\
  \ v) t.join();\n}\n\nint main() {\n\n    std::cout << '\\n';\n\n    ExpensiveToCopy\
  \ exp;\n    count(exp);\n    std::cout << \"exp.counter: \" << exp.counter << '\\\
  n';\n\n    std::cout << '\\n';\n}\n```\n\n### 使用 `std::atomic_ref`\n\n现在，`counter`\
  \ 的值符合预期：\n\n![使用 `std::atomic_ref` 的预期结果](img/Concurrency----atomicRef.png)\n\n\
  使用 `std::atomic_ref` 的预期结果\n\n与 [`std::atomic`](https://en.cppreference.com/w/cpp/atomic/atomic)\
  \ 一样，类型 `std::atomic_ref` 可以特化，并支持对内置数据类型的特化。\n\n### 6.2.1.2 `std::atomic_ref` 的特化\
  \ (C++20)\n\n你可以为用户定义类型特化 `std::atomic_ref`，对指针类型使用部分特化，或者对整数类型或浮点数类型等算术类型使用完全特化。\n\
  \n#### 6.2.1.2.1 主模板\n\n主模板 `std::atomic_ref` 可以用一个 [平凡可拷贝的](https://en.cppreference.com/w/cpp/types/is_trivially_copyable)\
  \ 类型 `T` 实例化。\n\n```cpp\nstruct Counters { \n    int a; \n    int b; \n};\n\nCounter\
  \ counter;\nstd::atomic_ref<Counters> cnt(counter); \n```\n\n#### 6.2.1.2.2 指针类型的部分特化\n\
  \n标准为指针类型提供了部分特化：`std::atomic_ref<T*>`。\n\n#### 6.2.1.2.3 算术类型的特化\n\n标准为整数和浮点类型提供了特化：`std::atomic_ref<arithmetic\
  \ type>`。\n\n- 字符类型：`char`、`char8_t` (C++20)、`char16_t`、`char32_t` 和 `wchar_t`\n\
  - 标准符号整数类型：`signed char`、`short`、`int`、`long` 和 `long long`\n- 标准无符号整数类型：`unsigned\
  \ char`、`unsigned short`、`unsigned int`、`unsigned long` 和 `unsigned long long`\n\
  - 其他整数类型，定义在头文件 [`<cstdint>`](http://en.cppreference.com/w/cpp/header/cstdint)：\n\
  \    - `int8_t`、`int16_t`、`int32_t` 和 `int64_t`（恰为 8、16、32 和 64 位的符号整数）\n    - `uint8_t`、`uint16_t`、`uint32_t`\
  \ 和 `uint64_t`（恰为 8、16、32 和 64 位的无符号整数）\n    - `int_fast8_t`、`int_fast16_t`、`int_fast32_t`\
  \ 和 `int_fast64_t`（至少为 8、16、32 和 64 位的中速度最快的符号整数）\n    - `uint_fast8_t`、`uint_fast16_t`、`uint_fast32_t`\
  \ 和 `uint_fast64_t`（至少为 8、16、32 和 64 位的中速度最快的无符号整数）\n    - `int_least8_t`、`int_least16_t`、`int_least32_t`\
  \ 和 `int_least64_t`（至少为 8、16、32 和 64 位的最小符号整数）\n    - `uint_least8_t`、`uint_least16_t`、`uint_least32_t`\
  \ 和 `uint_least64_t`（至少为 8、16、32 和 64 位的最小无符号整数）\n    - `intmax_t` 和 `uintmax_t`（最大符号和无符号整数）\n\
  \    - `intptr_t` 和 `uintptr_t`（用于存储指针的符号和无符号整数）\n- 标准浮点数类型：`float`、`double` 和 `long\
  \ double`\n\n#### 6.2.1.2.4 所有原子操作\n\n首先，这里是 `atomic_ref` 上所有操作的列表。\n\n所有对 `atomic_ref`\
  \ 的操作\n\n| 函数 | 描述 |\n| :--- | :--- |\n| `is_lock_free` | 检查 `atomic_ref` 对象是否为无锁。\
  \ |\n| `atomic_ref<T>::is_always_free` | 在编译时检查原子类型是否总是无锁的。 |\n| `load` | 原子子地返回引用对象的值。\
  \ |\n| `operator T` | 原子子地返回原子的值。等同于 `load()`。 |\n| `store` | 原子子地将引用对象的值替换为非原子。\
  \ |\n| `exchange` | 原子子地将引用对象的值替换为新值。 |\n| `compare_exchange_strong` | 原子子地比较并最终交换对象的值。\
  \ |\n| `compare_exchange_weak` | 原子子地比较并最终交换对象的值。 |\n| `fetch_add`, `+=` | 原子地上增加（减去）引用对象的值。\
  \ |\n| `fetch_sub`, `-=` | 原子子地从引用对象中增加（减去）值。 |\n\n\n\n\n\n| `notify_all` | yes\
  \ | yes | yes | yes |\n|  |   |   |   |   |\n| `wait` | yes | yes | yes | yes |\n\
  \n## 6.2.2 原子智能指针\n\n一个 `[`std::shared_ptr`](https://en.cppreference.com/w/cpp/memory/shared_ptr)`\
  \ 由一个控制块和其资源组成。控制块是线程安全的，但对资源的访问并不是线程安全的。这意味着修改引用计数是一个原子操作，并且你可以保证资源被恰好删除一次。这些是\
  \ `std::shared_ptr` 为你提供的保证。\n\n关于原子智能指针的提案 [N4162](http://wg21.link/n4162) 直接针对了当前实现中的缺陷。这些缺陷可以归纳为三点：一致性、正确性和性能。\n\
  \n*   **一致性**：`std::shared_ptr` 的原子操作是非原子数据类型中唯一的原子操作。\n*   **正确性**：使用全局原子操作非常容易出错，因为其正确用法取决于开发者的自律。很容易忘记使用原子操作——例如使用\
  \ `ptr = localPtr` 而不是 `std::atomic_store(&ptr, localPtr)`。结果会导致由于数据竞态而引起的未定义行为。如果我们改用原子智能指针，类型系统将不允许这种操作发生。\n\
  *   **性能**：与自由的 `atomic_`* 函数相比，原子智能指针具有巨大优势。原子版本是为特殊用例场景设计的，其内部可以使用 `std::atomic_flag`\
  \ 作为一种廉价的[自旋锁](https://en.wikipedia.org/wiki/Spinlock)。在单线程场景下，将非原子版本的指针函数设计成线程安全是多此一举，并且会带来性能损失。\n\
  \n正确性论点可能是最重要的一个。为什么呢？答案就在提案中。该提案展示了一个线程安全的单链表，支持元素的插入、删除和查找。该单链表是以无锁的方式实现的。\n\n\
  ### 6.2.2.1 线程安全的单链表\n\n![一个线程安全的单链表](img/Concurrency----AtomicSinglyLinkedList.png)\n\
  \n线程安全的单链表\n\n使用 C++11 编译器编译程序所需的所有更改都用红色标记。使用原子智能指针的实现要简单得多，因此不容易出错。C++20 的类型系统不允许在原子智能指针上使用非原子操作。\n\
  \n提案 [N4162](http://wg21.link/n4162) 提出了新类型 `std::atomic_shared_ptr` 和 `std::atomic_weak_ptr`\
  \ 作为原子智能指针。通过在 ISO C++ 标准主线中合并它们，它们成为了 `std::atomic` 的部分模板特化，即 `std::atomic<std::shared_ptr<T>>`\
  \ 和 `std::atomic<std::weak_ptr<T>>`。\n\n以下程序显示了五个线程在没有同步的情况下修改 `std::atomic<std::shared_ptr<std::string>>`。\n\
  \n```\n 1 // atomicSharedPtr.cpp\n 2 \n 3 #include <iostream>\n 4 #include <memory>\n\
  \ 5 #include <atomic>\n 6 #include <string>\n 7 #include <thread>\n 8 \n 9 int main()\
  \ {\n10 \n11     std::cout << '\\n';\n12 \n13     std::atomic<std::shared_ptr<std::string>>\
  \ sharString(\n14         std::make_shared<std::string>(\"Zero\"));\n15     \n16\
  \     std::thread t1([&sharString]{ \n17         sharString.store(std::make_shared<std::string>(*sharString.load\\\
  \n18 () + \"One\")); \n19     });\n20     std::thread t2([&sharString]{ \n21   \
  \      sharString.store(std::make_shared<std::string>(*sharString.load\\\n22 ()\
  \ + \"Two\")); \n23     });\n24     std::thread t3([&sharString]{ \n25         sharString.store(std::make_shared<std::string>(*sharString.load\\\
  \n26 +\" +\"Three\"));\n27     });\n28     std::thread t4([&sharString]{ \n29  \
  \       sharString.store(std::make_shared<std::string>(*sharString.load\\\n30 ()\
  \ +\"Four\")); \n31     });\n32     std::thread t5([&sharString]{ \n33         sharString.store(std::make_shared<std::string>(*sharString.load\\\
  \n34 () +\"Five\")); \n35     });\n36     \n37     t1.join();\n38     t2.join();\n\
  39     t3.join();\n40     t4.join();\n41     t5.join();\n42 \n43     std::cout <<\
  \ *sharString.load() << '\\n';\n44     \n45 }\n```\n\n\n\n\n剩余更强大的原子操作可以通过互斥锁（mutex）提供其功能。这是根据\
  \ C++ 标准的。因此，这些原子操作有一个成员函数 `is_lock_free`，用于检查原子操作内部是否使用了互斥锁。在流行的平台上，我总是得到答案 `false`。但你应该意识到这一点。得益于\
  \ `constexpr` 函数 `atomic<type>::is_always_lock_free`，你可以检查每个原子类型在程序可能运行的所有支持硬件上是否都是无锁的。只有当在所有支持的硬件上均为\
  \ `true` 时，该检查才会返回 `true`。该检查在编译时完成，并从 C++17 起可用。\n\n## 6.2.3.3 线程的一次同步\n\n发送者-接收者工作流对于线程来说非常常见。在这种工作流中，接收者在\
  \ `Future` 继续工作之前会等待发送者的通知。实现这些工作流有多种方法。在 C++11 中，你可以使用条件变量或 `promise/future` 对；在\
  \ C++20 中，你可以使用 `std::atomic_flag`。每种方法都有优缺点。因此，我想对它们进行比较。我假设你不知道条件变量或 promises\
  \ 和 futures 的细节。因此，我提供一个简短的回顾。\n\n### 6.2.3.3.1 条件变量\n\n条件变量可以充当发送者或接收者的角色。作为发送者，它可以通知一个或多个接收者。\n\
  \n```\n 1 // threadSynchronizationConditionVariable.cpp\n 2 \n3 #include <iostream>\n\
  \ 4 #include <condition_variable>\n 5 #include <mutex>\n 6 #include <thread>\n 7\
  \ #include <vector>\n 8 \n9 std::mutex mut;\n10 std::condition_variable condVar;\n\
  11 \n12 std::vector<int> myVec{};\n13 \n14 void prepareWork() {                \
  \                       \n15 \n16     {\n17         std::lock_guard<std::mutex>\
  \ lck(mut);\n18         myVec.insert(myVec.end(), {0, 1, 0, 3});           \n19\
  \     }\n20     std::cout << \"Sender: Data prepared.\" << '\\n';\n21     condVar.notify_one();\n\
  22 }\n23 void completeWork() {                                       \n24 \n25 \
  \    std::cout << \"Waiter: Waiting for data.\" << '\\n';\n26     std::unique_lock<std::mutex>\
  \ lck(mut);\n27     condVar.wait(lck, []{ return myVec.empty(); });\n28     myVec[2]\
  \ = 2;                               \n29     std::cout << \"Waiter: Complete the\
  \ work.\" << '\\n';\n30     for (auto i: myVec) std::cout << i << \" \";\n31   \
  \  std::cout << '\\n';\n32 }\n33 \n34 int main() {\n35 \n36     std::cout << '\\\
  n';\n37 \n38     std::thread t1(prepareWork);\n39     std::thread t2(completeWork);\n\
  40 \n41     t1.join();\n42     t2.join();\n43 \n44     std::cout << '\\n';\n45 }\n\
  ```\n\n使用条件变量进行线程同步\n\n该程序有两个子线程：`t1` 和 `t2`。它们在第 40 和 41 行获取它们的负载 `prepareWork`\
  \ 和 `completeWork`。`prepareWork` 函数（第 14 行）通知工作已准备：`condVar.notify_one()`。在持有锁的情况下，线程\
  \ `t2` 正在等待通知：`condVar.wait(lck, []{ return myVec.empty(); })`。当唤醒时，它会在持有锁的情况下检查谓词。如果谓词不成立，它会重新睡眠。工作流中，发送线程将初始值放入\
  \ `std::vector`（第 18 行），接收线程完成工作（第 29 行）。\n\n![使用条件变量进行线程同步](img/threadSynchronizationVariable.png)\n\
  \n条件变量有很多固有问题。例如，接收者可能在没有通知的情况下被唤醒，或者丢失通知。第一个问题被称为虚假唤醒（spurious wakeup），第二个是丢失等待（lost\
  \ wakeup）。谓词可以防止这些缺陷。当发送者在接收者处于等待状态且未使用谓词的情况下发送通知时，通知可能会丢失。因此，接收者将等待永远不会发生的事情。这就是死锁。当你研究程序的输出时，你会发现如果没有谓词，每次运行会导致死锁。\n\
  \n如果你想知道发送者-接收者工作流的细节以及条件变量的陷阱，请阅读我的文章 [C++ 核心指南：注意条件变量的陷阱](https://www.modernescpp.com/index.php/c-core-guidelines-be-aware-of-the-traps-of-condition-variables)。\n\
  \n让我用 `promise/future` 对来实现相同的工作流。\n\n### 6.2.3.3.2 Futures 和 Promises\n\nPromise\
  \ 可以向其关联的 future 发送值、异常或通知。以下是对应的工作流。\n\n```\n 1 // threadSynchronizationFuture.cpp\n\
  \ 2 \n3 #include <iostream>\n 4 #include <future>\n 5 #include <thread>\n 6 #include\
  \ <vector>\n 7 \n8 std::vector<int> myVec{};\n 9 \n10 void prepareWork(std::promise<void>\
  \ prom) {\n11 \n12     myVec.insert(myVec.end(), {0, 1, 0, 3});\n13     std::cout\
  \ << \"Sender: Data prepared.\" << '\\n';\n14     prom.set_value();\n15 }\n16 \n\
  17 void completeWork(std::future<void> fut){\n18 \n19     std::cout << \"Waiter:\
  \ Waiting for data.\" << '\\n';\n20     fut.wait();\n21     myVec[2] = 2;\n22  \
  \   std::cout << \"Waiter: Complete the work.\" << '\\n';\n23     for (auto i: myVec)\
  \ std::cout << i << \" \";\n24     std::cout << '\\n';\n25 }\n26 \n27 int main()\
  \ {\n28 \n29     std::cout << '\\n';\n30 \n31     std::promise<void> sendNotification;\n\
  32     std::future<void> waitForNotification = sendNotification.get_future();\n\
  33 \n34     std::thread t1(prepareWork, std::move(sendNotification));\n35     std::thread\
  \ t2(completeWork, std::move(waitForNotification));\n36 \n37     t1.join();\n38\
  \     t2.join();\n39 \n40     std::cout << '\\n';\n41 }\n```\n\n使用 promise/future\
  \ 进行线程同步\n\n当你研究这个工作流时，你会发现同步被简化到了它的核心部分：`prom.set_value()`（第 14 行）和 `fut.wait()`（第\
  \ 21 行）。我跳过了这次运行的截图。关于 promises 和 futures 的更多信息，通常被称为[任务](https://www.modernescpp.com/index.php/tasks)。\n\
  \n### 6.2.3.3.3 std::atomic_flag`\n\n现在，我直接从 C++11 跳到 C++20。\n\n```\n 1 // threadSynchronizationAtomicFlag.cpp\n\
  \ 2 \n3 #include <atomic>\n 4 #include <iostream>\n 5 #include <thread>\n 6 #include\
  \ <vector>\n 7 \n8 std::vector<int> myVec{};\n 9 \n10 std::atomic_flag atomicFlag{};\n\
  11 \n12 void prepareWork() {\n13 \n14     myVec.insert(myVec.end(), {0, 1, 0, 3});\n\
  15     std::cout << \"Sender: Data prepared.\" << '\\n';\n16     atomicFlag.test_and_set();\
  \                            \n17     atomicFlag.notify_one();   \n18 }\n19 \n20\
  \ void completeWork() {\n21 \n22     std::cout << \"Waiter: Waiting for data.\"\
  \ << '\\n';\n23     atomicFlag.wait(false);                                \n24\
  \     myVec[2] = 2;\n25     std::cout << \"Waiter: Complete the work.\" << '\\n';\n\
  26     for (auto i: myVec) std::cout << i << \" \";\n27     std::cout << '\\n';\n\
  28 }\n29 \n30 int main() {\n31 \n32     std::cout << '\\n';\n33 \n34     std::thread\
  \ t1(prepareWork);\n35     std::thread t2(completeWork);\n36 \n37     t1.join();\n\
  38     t2.join();\n39 \n40     std::cout << '\\n';\n41 }\n```\n\n使用 std::atomic_flag\
  \ 进行线程同步\n\n准备工作的线程（第 16 行）将 `atomicFlag` 设置为 `true` 并发送通知。完成工作的线程等待通知。只有当 `atomicFlag`\
  \ 等于 `true` 时，它才会被阻塞。\n\n这里是使用微软编译器运行程序的几次结果。\n\n![使用 std::atomic_flag 进行线程同步](img/threadSynchronizationAtomicFlag.png)\n\
  \n\n\n\n\n# 使用 `std::atomic_flag` 进行线程同步\n\n## 6.2.4 `std::atomic` 扩展\n\n在 C++20\
  \ 中，`std::atomic` 就像 `std::atomic_ref`(#chap10.xhtml_ChapterXXXatomic_ref) 一样，[std::atomic](https://en.cppreference.com/w/cpp/atomic/atomic)\
  \ 可以 `float`、`double` 和 `long double` 等浮点类型实例化。此外，`std::atomic_flag` 和 `std::atomic`可以通过成员函数\
  \ `notify_one`、`notify_all` 和 `wait` 用于线程同步。通知和等待功能适用于 `std::atomic` 的所有部分和完全特化（布尔、整数、浮点数和指针）以及\
  \ `std::atomic_ref`。\n\n得益于 `atomic<bool>`，之前的程序 `threadSynchronizationAtomicFlag.cpp`(#chap10.xhtml_textXXXATOMIC_FLAG_INIT)可以直接重新实现。\n\
  \n```\n 1 // threadSynchronizationAtomicBool.cpp\n 2 \n 3 #include <atomic>\n 4\
  \ #include <iostream>\n 5 #include <thread>\n 6 #include <vector>\n 7 \n 8 std::vector<int>\
  \ myVec{};\n 9 \n10 std::atomic<bool> atomicBool{false};\n11 \n12 void prepareWork()\
  \ {\n13 \n14     myVec.insert(myVec.end(), {0, 1, 0, 3});\n15     std::cout << \"\
  Sender: Data prepared.\"  << '\\n';\n16     atomicBool.store(true);\n17     atomicBool.notify_one();\n\
  18 \n19 }\n20 \n21 void completeWork() {\n22 \n23     std::cout << \"Waiter: Waiting\
  \ for data.\" << '\\n';\n24     atomicBool.wait(false);                        \
  \        \n25     myVec[2] = 2;\n26     std::cout << \"Waiter: Complete the work.\"\
  \ << '\\n';\n27     for (auto i: myVec) std::cout << i << \" \";\n28     std::cout\
  \ << '\\n';\n29 \n30 }\n31 \n32 int main() {\n33 \n34     std::cout << '\\n';\n\
  35 \n36     std::thread t1(prepareWork);\n37     std::thread t2(completeWork);\n\
  38 \n39     t1.join();\n40     t2.join();\n41 \n42     std::cout << '\\n';\n43 \
  \  \n44 }\n```\n\n### 使用 `std::atomic<bool>` 进行线程同步\n\n如果 `atomicBool == false`\
  \ 成立，调用 `atomicBool.wait(false)` 将阻塞。因此，调用 `atomicBool.store(true)`（第 16 行）会将 `atomicBool`\
  \ 设置为 `true` 并发送通知。\n\n与之前一样，这里是使用 Microsoft 器的四次运行结果。\n\n![使用 `std::atomic<bool>`\
  \ 进行线程同步](img/Concurrency----threadSynchronizationAtomicBool.png)\n\n### 使用 `std::atomic<bool>`\
  \ 进行线程同步\n\n## 6.3 信号量![Cippi 指挥火车](img/Cippi----CippiColorSemaphore.jpg)\n\nCippi\
  \ 指挥火车\n\n信号量是一种用于控制并发访问共享资源的同步机制。计数信号量是一种特殊的信号量，其计数器大于零。计数器在构造函数中初始化。获取信号量会减少计数器，释放信号量会增加计数器。如果线程在计数器为零时尝试获取信号量，该线程将阻塞，直到另一个线程通过释放信号量增加计数器。\n\
  \n![信号量](img/Concurrency----semaphore.jpg)\n\n信号量\n\n原始上传者为英语维基百科的 AmosWolfe。[从\
  \ en.wikipedia 传输到 Commons., CC BY 2.0,](https://commons.wikimedia.org/w/index.php?curid=1972304)\n\
  \nC++20 支持 `std::binary_semaphore`，它是 `std::counting_semaphore<1>` 的别名。在这种情况下，最大值为\
  \ 1。`std::binary_semaphores` 可用于实现[锁](https://en.cppreference.com/w/cpp/named_req/BasicLockable)。\n\
  \n```\nusing binary_semaphore = std::counting_semaphore<1>;\n```\n\n与 `std::mutex`\
  \ 不同，`std::counting_semaphore` 不绑定到特定线程。这意味着信号量的获取和释放调用可以在不同的线程上发生。下表 own `std::counting_semaphore`\
  \ 的接口。\n\n`std::counting_semaphore` `sem` 的成员函数\n\n| 成员函数 | 说明 |\n| --- | --- |\n\
  |  |   |\n| `sem.max()` (static) | 返回 `counter` 的最大值。 |\n|  |   |\n| `sem.release(upd\
  \ = 1)` | 将 `counter` 增加 `upd`，随后解锁获取信号量 `sem` 的线程。 |\n|  |   |\n| `sem.acquire()`\
  \ | 将 `counter` 减 1 或阻塞直到 `counter` 大于 0。 |\n|  |   |\n| `sem.try_acquire()` | 如果\
  \ `counter` 大于 0，尝试将 `counter` 减 1。 |\n|  |   |\n| `sem.try_acquire_for()` | 如果\
  \ `counter` 大于 0，则在指定的持续时间内尝试将 `counter` 减 1。 |\n|  |   |\n| `sem.try_acquire_until()`\
  \ | 如果 `counter` 大于 0，则在指定的时间点之前尝试将 `counter` 减 1。 |\n\n\n\n\n\n## 2. 锁（latches）和屏障（barriers）支持哪些在\
  \ C++11 和 C++14 中通过 futures、线程或条件变量结合锁无法实现的用例？\n\nLatches 和 barriers 并没有引入新的用例，但它们用起来简单得多。它们的性能也更好，因为它们内部通常使用了无锁`\
  \ | 原子地将计数器减去 `upd`，且阻塞调用者。 |\n| |   |\n| `lat.try_wait()` | 如果 `counter == 0` 则返回\
  \ `true`。 |\n| |   |\n| `lat.wait()` | 如果 `counter == 0` 则立即返回。否则阻塞直到 `counter ==\
  \ 0`。 |\n| |   |\n| `lat.arrive_and_wait(upd = 1)` | 等同于 `count_down(upd); wait();`。\
  \ |\n| |   |\n| `std::latch::max` | 返回实现支持的计数器最大值。 |\n\n`upd` 的默认值为 `1`。当 `upd`\
  \ 大于计数器或为负数时，行为是未定义的。`lat.try_wait()` 调用正如其名称所示，从不进行实际等待。\n\n以下程序 `bossWorkers.cpp`\
  \ 使用两个 `std::latch` 构建了一个老板-工人工作流。我使用 `synchronizedOut` 函数（第 13 行）同步了到 `std::cout`\
  \ 的输出。这种同步使得工作流更易于追踪。\n\n```\n 1 // bossWorkers.cpp\n 2 \n 3 #include <iostream>\n\
  \ 4 #include <mutex>\n 5 #include <latch>\n 6 #include <thread>\n 7 \n 8 std::latch\
  \ workDone(6);\n 9 std::latch goHome(1);\n10 \n11 std::mutex coutMutex;\n 12 \n\
  \ 13 void synchronizedOut(const std::string& s) {\n 14     std::lock_guard<std::mutex>\
  \ lo(coutMutex);\n 15     std::cout << s;\n 16 }\n 17 \n 18 class Worker {\n 19\
  \  public:\n 20      Worker(std::string n): name(n) { }\n 21   \n 22       void\
  \ operator() (){\n 23           // 工作完成时通知老板\n 24           synchronizedOut(name\
  \ + \": \" + \"Work done!\\n\");\n 25           workDone.count_down();\n 26 \n 27\
  \           // 在回家之前等待\n 28           goHome.wait();\n 29           synchronizedOut(name\
  \ + \": \" + \"Good bye!\\n\");\n 30       }\n 31  private:\n 32     std::string\
  \ name;\n 33 };\n 34 \n 35 int main() {\n 36 \n 37     std::cout << '\\n';\n 38\
  \ \n 39     std::cout << \"BOSS: START WORKING! \" << '\\n';\n 40   \n 41     Worker\
  \ herb(\"  Herb\");\n 42     std::thread herbWork(herb);\n 43   \n 44     Worker\
  \ scott(\"    Scott\");\n 45     std::thread scottWork(scott);\n 46   \n 47    \
  \ Worker bjarne(\"      Bjarne\");\n 48     std::thread bjarneWork(bjarne);\n 49\
  \   \n 50     Worker andrei(\"        Andrei\");\n 51     std::thread andreiWork(andrei);\n\
  \ 52   \n 53     Worker andrew(\"          Andrew\");\n 54     std::thread andrewWork(andrew);\n\
  \ 55   \n 56     Worker david(\"            David\");\n 57     std::thread davidWork(david);\n\
  \ 58     \n 59     workDone.wait();\n 61 \n 62     std::cout << '\\n';\n 63 \n 64\
  \     goHome.count_down();\n 65 \n 66     std::cout << \"BOSS: GO HOME!\" << '\\\
  n';\n 67 \n 68     herbWork.join();\n 69     scottWork.join();\n 70     bjarneWork.join();\n\
  \ 71     andreiWork.join();\n 72     andrewWork.join();\n 73     davidWork.join();\n\
  \ 74   \n 75 }\n```\n\n使用两个 `std::latch` 的老板-工人工作流\n\n该工作流的想法非常直观。六个工人 `herb`、`scott`、`bjarne`、`andrei`、`andrew`\
  \ 和 `david`（第 41-57 行）必须完成他们的工作。当每个人完成任务时，都会递减 `std::latch workDone`（第 25 行）。老板（主线程）阻塞在第\
  \ 59 行，直到计数器变为 0。当计数器为 0 时，老板使用 `goHome.count_down()` 通知工人可以回家。\n\n使用两个 `std::latch`\
  \ 的老板-工人工作流\n\n使用 `std::latch` 的老板-工人工作流\n\n当你考虑这个工作流时，可能会发现它不需要老板就能完成。这里是代码：\n\n\
  ```\n 1 // workers.cpp\n 2 \n 3 #include <iostream>\n 4 #include <latch>\n 5 #include\
  \ <mutex>\n 6 #include <thread>\n 7 \n 8 std::latch workDone(6);\n 9 std::mutex\
  \ coutMutex;\n 10 \n11 void synchronizedOut(const std::string& s) {\n 12     std::lock_guard<std::mutex>\
  \ lo(coutMutex);\n 13     std::cout << s;\n 14 }\n 15 \n 16 class Worker {\n 17\
  \  public:\n 18     Worker(std::string n): name(n) { }\n 19   \n 20     void operator()\
  \ {\n 21         synchronizedOut(name + \": \" + \"Work done!\\n\");\n 22      \
  \   workDone.count_down();\n 23     }\n 24  private:\n 25     std::string name;\n\
  \ 26 };\n 27 \n 28 int main() {\n 29 \n 30     std::cout << '\\n';\n 31 \n 32  \
  \   std::cout << \"BOSS: START WORKING! \" << '\\n';\n 33   \n 34     Worker herb(\"\
  \  Herb\");\n 35     std::thread herbWork(herb);\n 36   \n 37     Worker scott(\"\
  \    Scott\");\n 38     std::thread scottWork(scott);\n 39   \n 40     Worker bjarne(\"\
  \      Bjarne\");\n 41     std::thread bjarneWork(bjarne);\n 42   \n 43     Worker\
  \ andrei(\"        Andrei\");\n 44     std::thread andreiWork(andrei);\n 45   \n\
  \ 46     Worker andrew(\"          Andrew\");\n 47     std::thread andrewWork(andrew);\n\
  \ 48   \n 49     Worker david(\"            David\");\n 50     std::thread davidWork(david);\n\
  \ 51     \n 52     workDone.wait();\n 53 \n 54     std::cout << '\\n';\n 55 \n 56\
  \     std::cout << \"BOSS: GO HOME!\" << '\\n';\n 57 \n 58     herbWork.join();\n\
  \ 59     scottWork.join();\n 60     bjarneWork.join();\n 61     andreiWork.join();\n\
  \ 62     andrewWork.join();\n 63     davidWork.join();\n 64 }\n```\n\n使用 `std::latch`\
  \ 的工人工作流\n\n这个简化工作流没有太多需要添加的内容。\n\n### 6.4.2 `std::barrier`\n\n`std::barrier` 与\
  \ `std::latch` 相似。它们有两个区别：首先，你可以多次使用 `std::barrier`；其次，你可以调整后续的计数器。计数器在 `std::barrier`\
  \ 的构造函数中设置。调用 `arrive()`、`arrive_and_wait()` 和 `arrive_and_drop()` 都会递减当前阶段的计数器。此外，`arrive_and_drop()`\
  \ 会递减下一阶段的计数器。当当前阶段结束且计数器变为零时，所谓的完成步骤就会开始。在完成步骤中，会调用一个可调用对象。barrier 通过构造函数获取其可调用对象。\n\
  \n完成步骤执行以下操作：\n\n1. 所有线程被阻塞。\n2. 任意线程被解阻塞并执行可调用对象。\n3. 如果完成步骤完成，所有线程被解阻塞。\n\n`std::barrier`\
  \ `bar` 的成员函数\n\n| 成员函数 | 描述 |\n| --- | --- |\n| |   |\n| `bar.arrive(upd)` | 原子地将计数器减去\
  \ `upd`。 |\n| |   |\n| `bar.wait()` | 在同步点阻塞，直到完成步骤完成。 |\n| |   |\n| `bar.arrive_and_wait()`\
  \ | 等同于 `wait(arrive())`。 |\n| |   |\n| `bar.arrive_and_drop()` | 将当前阶段和后续阶段的计数器各减一。\
  \ |\n\n`bar.arrive_and_drop()` 调用本质上意味着下一阶段的计数器减了一。`fullTimePartTimeWorkers.cpp`\
  \ 程序减半了第二阶段的工人人数。\n\n\n\n\n\n```cpp\n 1 // fullTimePartTimeWorkers.cpp\n 2 \n 3\
  \ #include <iostream>\n 4 #include <barrier>\n 5 #include <mutex>\n 6 #include <string>\n\
  \ 7 #include <thread>\n 8 \n 9 std::barrier workDone(6);\n10 std::mutex coutMutex;\n\
  11 \n12 void synchronizedOut(const std::string& s) {\n13     std::lock_guard<std::mutex>\
  \ lo(coutMutex);\n14     std::cout << s;\n15 }\n16 \n17 class FullTimeWorker {\n\
  18  public:\n19     FullTimeWorker(std::string n): name(n) { }\n20   \n21     void\
  \ operator() () {\n22         synchronizedOut(name + \": \" + \"Morning work done!\\\
  n\");\n23         workDone.arrive_and_wait();  // Wait until morning work is done\n\
  24         synchronizedOut(name + \": \" + \"Afternoon work done!\\n\");\n25   \
  \      workDone.arrive_and_wait();  // Wait until afternoon work is do\\\n26 ne\n\
  27         \n28     }\n29  private:\n30     std::string name;\n31 };\n32 \n33 class\
  \ PartTimeWorker {\n34  public:\n35     PartTimeWorker(std::string n): name(n) {\
  \ }\n36   \n37     void operator() () {\n38         synchronizedOut(name + \": \"\
  \ + \"Morning work done!\\n\");\n39         workDone.arrive_and_drop();  // Wait\
  \ until morning work is done\n40     }\n41  private:\n42     std::string name;\n\
  43 };\n44 \n45 int main() {\n46 \n47     std::cout << '\\n';\n48 \n49     FullTimeWorker\
  \ herb(\"  Herb\");\n50     std::thread herbWork(herb);\n51   \n52     FullTimeWorker\
  \ scott(\"    Scott\");\n53     std::thread scottWork(scott);\n54   \n55     FullTimeWorker\
  \ bjarne(\"      Bjarne\");\n56     std::thread bjarneWork(bjarne);\n57   \n58 \
  \    PartTimeWorker andrei(\"        Andrei\");\n59     std::thread andreiWork(andrei);\n\
  60   \n61     PartTimeWorker andrew(\"          Andrew\");\n62     std::thread andrewWork(andrew);\n\
  63   \n64     PartTimeWorker david(\"            David\");\n65     std::thread davidWork(david);\n\
  66 \n67     herbWork.join();\n68     scottWork.join();\n69     bjarneWork.join();\n\
  70     andreiWork.join();\n71     andrewWork.join();\n72     davidWork.join();\n\
  73   \n74 }\n```\n\n# 全职与兼职工人\n\n此工作流包含两类工人：全职工人（第 17 行）和兼职工人（第 32 行）。兼职工人只在上午工作，而全职工人在上午和下午工作。因此，全职工人会调用两次\
  \ `workDone.arrive_and_wait()`（第 23 行和 25 行）。相反，兼职工人仅调用一次 `workDone.arrive_and_drop()`（第\
  \ 38 行）。该 `workDone.arrive_and_drop()` 调用会导致兼职工人跳过下午的工作。相应地，计数器在第一阶段（上午）的值为 6，在第二阶段（下午）的值为\
  \ 3。\n\n![全职与兼职工人](img/fullTimeTimeWorkers.png)\n\n### 6.5 协作中断\n\n![在停止标志前停止](img/Interruption)\n\
  \n协作中断的额外功能基于 `std::stop_source`、`std::stop_token` 和 `std::stop_callback` 类。`std::jthread`\
  \ 和 `std::condition_variable_any` 支持协作中断。\n\n## 为什么杀死线程不是好主意？\n\n`std::stop_source`、`std::stop_token`\
  \ 和 `std::stop_callback` 类允许线程异步请求停止执行，或询问执行是否收到了停止信号。`std::stop_token` 可以传递给操作，并在之后用于主动轮询令牌以检查停止请求，或通过\
  \ `std::stop_callback` 注册回调函数。停止请求由 `std::stop_source` 发送。此信号会影响所有关联 `std::stop_token`。`std::stop_source`、`std::stop_token`\
  \ 和 `std::stop_callback` 共享关联停止状态的所有权。\n\n### 6.5.1 `std::stop_source`\n\n你可以通过两种方式构造\
  \ `std::stop_source`：\n\n```\nstd::stop_source();\nexplicit std::stop_source(stop_state_t)\
  \ noexcept;\n```\n\n#### `std::stop_source` 的构造函数\n\n默认构造函数（第 1 行）构造一个带有新状态的 `std::stop_source`。带有\
  \ `stop_state_t` 的构造函数（第 2 行）构造一个没有关联状态的空 `std::stop_source`。组件 `std::stop_source\
  \ src` 提供了以下处理停止请求的成员函数。\n\n#### `std::stop_source` 的成员函数\n\n| 成员函数 | 描述 |\n| :---\
  \ | :--- |\n| `get_token()` | 如果 `stop_possible()`，则返回关联的 `stop_token`；否则返回默认构造的\
  \ `stop_token`。 |\n| `stop_possible()` | 如果可以请求 `src`，则返回 `true`。 |\n| `stop_requested()`\
  \ | 如果关联的 `std::stop_source` 调用了 `request_stop()`，则返回 `true`。 |\n| `request_stop()`\
  \ | 如果 `stop_possible()` 且 `!stop_requested()`，则调用停止请求；否则调用无影响。 |\n\n调用 `src.get_token()`\
  \ 返回停止令牌 `stoken`。通过 `stoken` 你可以检查是否发出了停止请求。`stoken` 观察停止源 `src`。此外，关联 `stop_token`\
  \ 的任何注册回调以及等待关联 `stop_token` 的 `std::condition_variable_any` 都会被唤醒。当请求停止时，它无法撤回。`src.request_stop()`\
  \ 成功且 `src` 具有关联状态且之前未被请求过，则返回 `true`。\n\n### 6.5.2 `std::stop_token`\n\n`std::stop_token`\
  \ 本质上是关联停止状态的一个线程安全的“视图”。它通常通过 `src.get_token()` 从 `std::jthread` 或 `std::stop_source`\
  \ 获取。这使得它们与 `std::jthread` 或 `std::stop_source` 共享相同的停止状态。\n\n通过 `std::stop_token`，你可以检查关联的\
  \ `std::stop_source` 是否已请求停止。`std::stop_token` 还可以传递给 `std::stop_callback` 的构造函数，或传递给\
  \ `std::condition_variable_any` 的中断等待函数。\n\n#### `std::stop_token stoken` 的成员函数\n\
  \n| 成员函数 | 描述 |\n| :--- | :--- |\n| `stop_possible()` | 如果 `stoken` 有关联停止状态，则返回\
  \ `true`。 |\n| `stop_requested()` | 如果关联的 `std::stop_source src` 调用了 `request_stop()`，则返回\
  \ `true`；否则返回 `false`。 |\n\n`stoken.stop_possible()` 在停止请求请求时也会返回 `true`。一个没有关联停止状态的默认构造\
  \ `std::stop_token`。\n\n### 6.5.3 `std::stop_callback`\n\n以下示例展示了 `std::stop_callback`\
  \ 的用法。\n\n\n\n\n\n```cpp\n 1 // invokeCallback.cpp\n 2 \n 3 #include <atomic>\n\
  \ 4 #include <chrono>\n 5 #include <iostream>\n 6 #include <thread>\n 7 #include\
  \ <vector>\n 8 \n 9 using namespace std::literals;\n10 \n11 auto func = [](std::stop_token\
  \ stoken) { \n12         std::atomic<int> counter{0};\n13         auto thread_id\
  \ = std::this_thread::get_id();\n14         std::stop_callback callBack(stoken,\
  \ [&counter, thread_id] {\n15             std::cout << \"Thread id: \" << thread_id\
  \ \n16                       << \"; counter: \" << counter << '\\n';\n17       \
  \  });\n18         while (counter < 10) {\n19             std::this_thread::sleep_for(0.2s);\n\
  20             ++counter;\n21         }\n22     };\n23 \n24 int main() {\n25   \
  \  \n26     std::cout << '\\n';\n27 \n28     std::vector<std::jthread> vecThreads(10);\n\
  29     for(auto& thr: vecThreads) thr = std::jthread(func);\n31 \n32     std::this_thread::sleep_for(1s);\n\
  33 \n34     for(auto& thr: vecThreads) thr.request_stop();\n35 \n36     std::cout\
  \ << '\\n';\n37 \n38 }\n```\n\n## 回调的使用\n\n十个线程中的每一个都调用了 Lambda 函数 `func`（第 11-22\
  \ 行）。第 14-17 行的回调显示了线程 ID 和计数器。由于主线程睡眠了 1 秒且子线程也处于睡眠，当回调被调用时，计数器的值为 4。`thr.request_stop()`\
  \ 调用会触发每个线程上的回调。\n\n![回调的使用](img/Concurrency----invokeCallback.png)\n\n## 6.5.3.1\
  \ 合并线程\n\n`std::jthread` 是 `std::thread` 的扩展，具有发送中断信号和自动 `join()` 的额外功能。为了支持这一功能，它拥有一个\
  \ `std::stop_token`。\n\n`std::jthread jthr` 用于处理停止令牌的成员函数\n\n| 成员函数 | 描述 |\n| ---\
  \ | --- |\n| `t.get_stop_source()` | 返回一个与共享停止状态关联的 `std::stop_source` 对象。 |\n|\
  \ `t.get_stop_token()` | 返回一个与共享停止状态关联的 `std::stop_token` 对象。 |\n| `t.request_stop()`\
  \ | 通过共享停止状态请求停止执行。 |\n\n## 6.5.3.2 `condition_variable_any` 的新 `wait` 重载\n\n`std::condition_variable_any`\
  \ 是 [`std::condition_variable`](https://en.cppreference.com/w/cpp/thread/condition_variable)\
  \ 的泛化。`std::condition_variable` 需要 `std::unique_lock<std::mutex>`，但 `std::condition_variable_any`\
  \ 可以作用于任何锁 `lo`，支持 `lo.lock()` 和 `lo.unlock()`。\n\n`std::condition_variable_any`\
  \ 的 `wait`、`wait_for` 和 `wait_until` 的三种变体获得了新的重载。它们接受一个 `std::stop_token`。\n\n\
  ```cpp\n 1 template <class Predicate>\n 2 bool wait(Lock& lock,  \n 3          \
  \ stop_token stoken,\n 4           Predicate pred);\n 5 \n 6 template <class Rep,\
  \ class Period, class Predicate>\n 7 bool wait_for(Lock& lock, \n 8            \
  \   stop_token stoken, \n 9               const chrono::duration<Rep, Period>& rel_time,\
  \ \n10               Predicate pred);\n11                 \n12 template <class Clock,\
  \ class Duration, class Predicate>\n13 bool wait_until(Lock& lock, \n14        \
  \         stop_token stoken,\n15                 const chrono::time_point<Clock,\
  \ Duration>& abs_time, \n16                 Predicate pred);\n```\n\n### 三个新的 wait\
  \ 重载\n\n这些新重载需要一个谓词。提供的版本确保了如果为传递的 `std::stop_token` `stoken` 发送了停止请求，线程会被通知。函数返回一个布尔值，指示谓词是否评估为\
  \ `true`。返回的布尔值与是否请求了停止或触发了超时无关。这三个重载等价于以下表达式：\n\n```cpp\n// 第 1-4 行的 wait\nwhile\
  \ (!stoken.stop_requested()) {\n    if (pred()) return true;\n    wait(lock);\n\
  }\nreturn pred();\n\n// 第 6-10 行的 wait_for\nreturn wait_until(lock, \n         \
  \         std::move(stoken),\n                  chrono::steady_clock::now() + rel_time,\
  \ \n                  std::move(pred)\n                  );\n\n// 第 12-16 行的 wait_until\n\
  while (!stoken.stop_requested()) {\n    if (pred()) return true;\n    if (wait_until(lock,\
  \ timeout) == std::cv_status::timeout) return pred();\n}\nreturn pred();\n```\n\n\
  ### 三个重载的等价表达式\n\n在 wait 调用后，你可以检查是否请求了停止。\n\n```cpp\n// wait 调用后，你可以检查是否请求了停止\n\
  wait(lock);\nif (stoken.stop_requested()) {\n```\n\n### 使用 `wait` 处理中断\n\n以下示例展示了带有停止请求的条件变量。\n\
  \n```cpp\n 1 // conditionVariable.cpp\n 2 \n 3 #include <condition_variable>\n 4\
  \ #include <thread>\n 5 #include <iostream>\n 6 #include <chrono>\n 7 #include <mutex>\n\
  \ 8 #include <thread>\n 9 \n10 using namespace std::literals;\n11 \n12 std::mutex\
  \ mut;\n13 std::condition_variable_any condVar;\n14 \n15 bool dataReady;\n16 \n\
  17 void receiver(std::stop_token stoken) {\n18 \n19     std::cout << \"Waiting\"\
  ;\n20 \n21     std::unique_lock<std::mutex> lck(mut);\n22     bool ret = condVar.wait(lck,\
  \ stoken, []{return dataReady;});\n23     if (ret){\n24         std::cout << \"\
  Notification received\";\n25     }\n26     else{\n27         std::cout << \"Stop\
  \ request\";\n28     }\n29 }\n30 \n31 void sender() {\n32 \n33     std::this_thread::sleep_for(5ms);\n\
  34     {\n35         std::lock_guard<std::mutex> lck(mut);\n36         dataReady\
  \ = true;\n37         std::cout << \"Send notification\";\n38     }\n39     condVar.notify_one();\n\
  40 }\n41 \n42 int main(){\n43 \n44     std::cout << '\\n';\n45 \n46     std::jthread\
  \ t1(receiver);\n47     std::jthread t2(sender);\n48 \n49     t1.request_stop();\n\
  50 \n51     t1.join();\n52     t2.join();\n53 \n54     std::cout << '\\n';\n55 }\n\
  ```\n\n## 使用带有停止请求的条件变量\n\n`receiver` 线程（第 17-29 行）等待 `sender` 线程（第 31-41 行）的通知。主线程在第\
  \ 49 行触发了停止请求。输出显示在通知之前发生了停止请求。\n\n![向条件变量发送停止请求](img/Concurrency----conditionVariable.png)\n\
  \n### 6.6 std::jthread\n\n![jthread](img/jThread.jpg)\n\n### jthread\n\n`std::jthread`\
  \ 代表可连接线程。除了 C++11 的 [`std::thread`](https://en.cppreference.com/w/cpp/thread/thread)\
  \ 之外，`std::jthread` 在析构时会自动合并并且可以被协作中断。\n\n下表提供了 `std::jthread t` 功能的概要。更多详细信息请参考\
  \ [cppreference.com](https://en.cppreference.com/w/cpp/thread/jthread)。\n\n`std::jthread\
  \ t` 的函数\n\n| 方法 | 描述 |\n| --- | --- |\n| `t.join()` | 等待线程 `t` 完成执行。 |\n| `t.detach()`\
  \ | 独立执行已创建的线程 `t`。 |\n| `t.joinable()` | 如果线程 `t` 仍合并则返回 true。 |\n| `t.get_id()`\
  \ 和 `std::this_thread::get_id()` | 返回线程的 ID。 |\n| `std::hardware_concurrency()`\
  \ | 指示可以并发运行的线程数量。 |\n| `std::this_thread::sleep_until(absTime)` | 让线程 `t` 睡眠直到时间点\
  \ `absTime`。 |\n| `std::this_thread::sleep_for(relTime)` | 让线程 `t` 睡眠持续时间 `relTime`。\
  \ |\n| `std::this_thread::yield()` | 允许系统运行另一个线程。 |\n| `t.swap(t2)` 和 `std::swap(t1,\
  \ t2)` | 交换线程。 |\n\n\n\n\n\n| `t.request_stop()` | 通过共享停止状态请求停止执行。 |\n\n## 6.6.1\
  \ 自动合并\n\n这是 `std::thread` 的一个不符合直觉的行为。如果一个 `std::thread` 仍然处于可合并状态（joinable），则会在析构函数中调用\
  \ [`std::terminate`](https://en.cppreference.com/w/cpp/error/terminate)。如果既没有调用\
  \ `thr.join()` 也没有调用 `thr.detach()`，则线程 `thr` 是可合并的。\n\n```cpp\n// threadJoinable.cpp\n\
  \n#include <iostream>\n#include <thread>\n\nint main() {\n\n    std::cout << '\\\
  n';\n    std::cout << std::boolalpha;\n\n    std::thread thr{[]{ std::cout << \"\
  Joinable std::thread\" << '\\n'; }};\n\n    std::cout << \"thr.joinable(): \" <<\
  \ thr.joinable() << '\\n';\n\n    std::cout << '\\n';\n\n}\n```\n\n### 终止一个仍然可合并的\
  \ `std::thread`\n\n执行时，程序终止。\n\n![终止一个可合并的 `std::thread`](img/Concurrency----threadJoinable.png)\n\
  \n### 终止一个可合并的 `std::thread`\n\n两次执行 `std::thread` 都会终止。在第二次运行中，线程 `thr` 有足够的时间显示它的消息：“Joinable\
  \ std::thread”。\n\n在下一个示例中，我使用了当前 C++20 标准中的 `std::jthread`。\n\n```cpp\n// jthreadJoinable.cpp\n\
  \n#include <iostream>\n#include <thread>\n\nint main() {\n\n    std::cout << '\\\
  n';\n    std::cout << std::boolalpha;\n\n    std::jthread thr{[]{ std::cout << \"\
  Joinable std::thread\" << '\\n'; }\\\n};\n\n    std::cout << \"thr.joinable(): \"\
  \ << thr.joinable() << '\\n';\n\n    std::cout << '\\n';\n\n}\n```\n\n### 终止一个仍然可合并的\
  \ `std::jthread`\n\n现在，如果线程 `thr` 仍然是合并的，它会在其析构函数中自动合并。\n\n![使用会自动合并的 `std::jthread`](img/Concurrency----jthreadJoinable.png)\n\
  \n### 使用会自动合并的 `std::jthread`\n\n这是一个 `std::jthread` 析构函数的典型实现。\n\n```cpp\n1 jthread::~jthread()\
  \ {\n2     if(joinable()) {        \n3         request_stop();     \n4         join();\
  \             \n5     }\n6 }\n```\n\n### `std::jthread` 析构函数的典型实现\n\n首先，线程检查是否仍然可合并（第\
  \ 2 行）。如果没有对它调用 `join()` 或 `detach()`，则该线程仍然是合并的。如果线程仍然可合并，它会请求停止执行（第 3 行），之后调用\
  \ `join()`（第 4 行）。`join` 调用会阻塞，直到线程执行完成。\n\n## 6.6.2 `std::jthread` 的协作中断\n\n为了让大家有一个概念，让我展示一个简单的示例。\n\
  \n```cpp\n 1 // interruptJthread.cpp\n 2 \n 3 #include <chrono>\n 4 #include <iostream>\n\
  \ 5 #include <thread>\n 6 \n 7 using namespace::std::literals;\n 8 \n 9 int main()\
  \ {\n10     \n11     std::cout << '\\n';\n12     \n13     std::jthread nonInterruptible([]{\
  \ \n14         int counter{0};\n15         while (counter < 10){\n16           \
  \  std::this_thread::sleep_for(0.2s);\n17             std::cerr << \"nonInterruptible:\
  \ \" << counter << '\\n'; \n18             ++counter;\n19         }\n20     });\n\
  21     \n22     std::jthread interruptible([](std::stop_token stoken){ \n23    \
  \     int counter{0};\n24         while (counter < 10){\n25             std::this_thread::sleep_for(0.2s);\n\
  26             if (stoken.stop_requested()) return;\n27             std::cerr <<\
  \ \"interruptible: \" << counter << '\\n'; \n28             ++counter;\n29     \
  \    }\n30     });\n31     \n32     std::this_thread::sleep_for(1s);333     \n34\
  \     std::cerr << '\\n';\n35     std::cerr << 'Main thread interrupts both jthreads'\
  \ << '\\n';\n36     nonInterruptible.request_stop();\n37     interruptible.request_stop();\n\
  38     \n39     std::cout << '\\n';\n40     \n41 }\n```\n\n### 中断一个不可中断和可中断的 `std::jthread`\n\
  \n在主程序中，我启动了两个线程 `nonInterruptible` 和 `interruptible`（第 13 和第 22 行）。与线程 `nonInterruptible`\
  \ 不同，线程 `interruptible` 获得了一个 `std::stop_token` 并在第 26 行使用它来检查是否被中断：`stoken.stop_requested()`。在收到停止请求的情况下，lambda\
  \ 函数返回，因此线程结束。调用 `interruptible.request_stop()`（第 37 行）触发了停止请求。这对于之前的调用 `nonInterruptible.request_stop()`\
  \ 不成立。该调用没有效果。\n\n![中断一个不可中断和可中断的 `std::jthread`](img/Concurrency----interruptJthread.png)\n\
  \n### 中断一个不可中断和可中断的 `std::jthread`\n\n### 6.7 同步输出\n\n![ippi 在合唱中](img/Cippi.jpg)\n\
  \n### Cippi 在合唱中\n\n如果不同步地写入 `std::cout` 会发生什么？\n\n```cpp\n1 // coutUnsynchronized.cpp\n\
  2 \n3 #include <chrono>\n4 #include <iostream>\n5 #include <thread>\n6 \n7 class\
  \ Worker{\n8 public:\n9   Worker(std::string n):name(n) {};\n10     void operator()\
  \ ()\n11       for (int i = 1; i <= 3) {\n12         // 开始工作\n13         std::this_thread::sleep_for(std::chrono::milliseconds(200));\n\
  14         // 结束工作\n15         std::cout << name << \": \" << \"Work \" << i <<\
  \ \" done !!!\";\n16       }\n17     }\n18 private:\n19   std::string name;\n20\
  \ };\n21 \n23 int main() {\n24 \n25   std::cout << '\\n';\n26   \n27   std::cout\
  \ << \"Boss: Let's start working.\" << \"\\n\\n\";\n28   \n29   std::thread herb=\
  \ std::thread(\"Herb\");\n30   std::thread andrei= std::thread(\"  Andrei\");\n\
  31   std::thread scott= std::thread(\"    Scott\");\n32   std::thread bjarne= std::thread(\"\
  \      Bjarne\");\n33   std::thread bart= std::thread(\"        Bart\");\n34   std::thread\
  \ jenne= std::thread(\"          Jenne\");\n35   \n36   herb.join();\n37   andrei.join();\n\
  38   scott.join();\n39   bjarne.join();\n40   bart.join();\n41   jenne.join();\n\
  42   \n43   std::cout << \"\\n\" << \"Boss: Let's go home.\" << '\\n';\n44   \n\
  45   std::cout << '\\n';\n46 }\n```\n\n### 非同步访问 `std::cout`\n\n老板有六个工人（第 29-34\
  \ 行）。每个工人有三项任务，每项耗时 1/5 秒（第 13 行）。工人完成任务后，向老板大喊（第 15 行）。一旦老板收到所有工人的通知，让他们回家（第 44\
  \ 行）。\n\n这样的工作流真混乱！每个工人都在大喊自己的消息！\n\n![非同步写入 `std::cout`](img/Concurrency----coutUnsynchronized.png)\n\
  \n### 非同步写入 `std::cout`\n\n我们如何解决这个问题？在 C++11 中，答案很直接：使用如 [`lock_guard`](https://en.cppreference.com/w/cpp/thread/lock_guard)\
  \ 的锁来同步对 `std::cout` 的访问。\n\n```cpp\n1 // coutSynchronized.cpp\n2 \n3 #include <chrono>\n\
  4 #include <iostream>\n5 #include <mutex>\n6 #include <thread>\n7 \n8 std::mutex\
  \ coutMutex;\n9 \n10 class Worker{\n11 public:\n12   Worker(std::string n):name(n)\
  \ {};\n13  \n14     void operator() ()\n15       for (int i = 1; i <= 3) { \n16\
  \         // 开始工作\n17         std::this_thread::sleep_for(std::chrono::milliseconds(200));\n\
  18         // 结束工作\n19         std::lock_guard<std::mutex> coutLock(coutMutex);\n\
  20         std::cout << name << \": \" << \"Work \" << i << \" done !!!\\n\";\n\
  21       }\n22     }\n23 private:\n24   std::string name;\n25 };\n26 \n27 \n28 int\
  \ main() {\n29 \n30   std::cout << '\\n';\n31   \n32   std::cout << \"Boss: Let's\
  \ start working.\" << \"\\n\\n\";\n33   \n34   std::thread herb= std::thread(\"\
  Herb\");\n35   std::thread andrei= std::thread(\"  Andrei\");\n36   std::thread\
  \ scott= std::thread(\"    Scott\");\n37   std::thread bjarne= std::thread(\"  \
  \    Bjarne\");\n38   std::thread bart= std::thread(\"        Bart\");\n39   std::thread\
  \ jenne= std::thread(\"          Jenne\");\n40   \n41   herb.join();\n42   andrei.join();\n\
  43   scott.join();\n44   bjarne.join();\n45   bart.join();\n46   jenne.join();\n\
  47   \n48   std::cout << \"\\n\" << \"Boss: Let's go home.\" << '\\n';\n49   \n\
  50   std::cout << '\\n';\n51 \n52 }\n```\n\n### 同步访问 `std::cout`\n\n\n\n\n第 8 行的\
  \ `coutMutex` 保护共享对象 `std::cout`。将 `coutMutex` 放入 `std::lock_guard` 中可以确保 `coutMutex`\
  \ 在 `std::lock_guard` 的构造函数（第 19 行）中锁定，并在析构函数（第 21 行）中解锁。得益于 `coutLock` 保护的 `coutMutex`，混乱变得和谐。\n\
  \n![`std::cout` 的同步访问](img/Concurrency----coutSynchronized.png)\n\n### `std::cout`\
  \ 的同步访问\n\n使用 C++20，向 `std::cout` 写入同步内容是一件轻而易的事。`std::basic_syncbuf` 是 [`std::basic_streambuf`](https://en.cppreference.com/w/cpp/io/basic_streambuf)\
  \ 的包装器。它在自己的缓冲区中累积输出。该包装器在析构时将它的内容设置到被包装的缓冲区。因此，内容将以连续字符序列的形式出现，不会发生字符交织的情况。\n\n\
  得益于 `std::basic_osyncstream`，你可以直接同步地写入 `std::cout`。\n\n你可以创建一个命名的同步输出流。现在，之前的程序\
  \ `coutUnsynchronized.cpp` 被重构为同步写入 `std::cout`。\n\n```cpp\n 1 // synchronizedOutput.cpp\n\
  \ 2 \n 3 #include <chrono>\n 4 #include <iostream>\n 5 #include <syncstream>\n 6\
  \ #include <thread>\n 7 \n 8 class Worker{\n 9 public:\n10   Worker(std::string\
  \ n): name(n) {};\n11     void operator() (){\n12       for (int i = 1; i <= 3;\
  \ ++i) {\n13         // 开始工作\n14         std::this_thread::sleep_for(std::chrono::milliseconds(200));\n\
  15         // 结束工作\n16         std::osyncstream syncStream(std::cout);\n17     \
  \    syncStream << name << \": \" << \"Work \" << i << \" done !!!\" << '\\\\\n\
  18 n';\n19       }   \n20     }\n21 private:\n22   std::string name;\n23 };\n24\
  \ \n25 \n26 int main() {\n27 \n28   std::cout << '\\n';\n29   \n30   std::cout <<\
  \ \"Boss: Let's start working.\\n\\n\";\n31  \n32   std::thread herb= std::thread(Worker(\"\
  Herb\"));\n33   std::thread andrei= std::thread(Worker(\"  Andrei\"));\n34   std::thread\
  \ scott= std::thread(Worker(\"    Scott\"));\n35   std::thread bjarne= std::thread(Worker(\"\
  \      Bjarne\"));\n36   std::thread bart= std::thread(Worker(\"        Bart\"));\n\
  37   std::thread jenne= std::thread(Worker(\"          Jenne\"));\n38   \n39   \n\
  40   herb.join();\n41   andrei.join();\n42   scott.join();\n43   bjarne.join();\n\
  44   bart.join();\n45   jenne.join();\n46   \n47   std::cout << \"\\n\" << \"Boss:\
  \ Let's go.\" << '\\n';\n48   \n49   std::cout << '\\n';\n50 }\n```\n\n#### 使用 `std::basic_osyncstream`\
  \ 对 `std::cout` 进行同步访问\n\n与之前的程序 `coutUnsynchronized.cpp` 唯一的区别是 `std::cout` 被包装在\
  \ `std::osyncstream` 中（第 16 行）。为了使用 `std::osyncstream`，我添加了头文件 `<syncstream>`。当\
  \ `std::osyncstream` 在第 18 行超出作用范围时，字符会被传输并刷新 `std::cout`。值得提到的是，main 函数 函数中的 `std::cout`\
  \ 调用没有引入数据竞态，因此不需要同步。\n\n由于我只使用了一次第 17 行声明的 `syncStream`，使用临时对象可能更好。以下代码段展示了修改后的\
  \ `operator`。\n\n```cpp\nvoid operator() {\n  for (int i = 1; i <= 3; ++i) { \n\
  \    // 开始工作\n    std::this_thread::sleep_for(std::chrono::milliseconds(200));\n\
  \    // 结束工作\n    std::osyncstream(std::cout) << name << \": \" << \"Work \" <<\
  \ i << \" done !!!\" \n                                << '\\n';\n  }\n}\n```\n\n\
  `std::basic_osyncstream syncStream` 提供了两个有趣的函数：\n\n* `syncStream.emit()` 发送所有缓冲区输出并执行所有待处理的刷新。\n\
  * `syncStream.get_wrapped()` 返回指向包装缓冲区的指针。\n\n[cppreference.com](https://en.cppreference.com/w/cpp/io/basic_osyncstream/get_wrapped)\
  \ 展示了如何使用 `get_wrapped` 成员函数对化不同流的输出。\n\n```cpp\n// sequenceOutput.cpp\n\n#include\
  \ <syncstream>\n#include <iostream>\nint main() {\n\n  std::osyncstream bout1(std::cout);\n\
  \  bout1 << \"Hello, \";\n  {\n      std::osyncstream(bout1.get_wrapped()) << \"\
  Goodbye, \" << \"Planet!\"\\ << '\\n';\n  } // 发送临时缓冲区的内容\n\n  bout1 << \"World!\"\
  \ << '\\n';\n\n} // 发送 bout1 的内容\n```\n\n#### 顺序输出\n\n![`std::cout` 的同步访问](img/Concurrency----sequenceOutput.png)\n\
  \n### `std::cout` 的同步访问\n\n## 7. 案例研究\n\n在提供了 C++20 的理论后，我现在将这些理论应用于实践，并为你提供几个案例研究。\n\
  \n当你需要多次同步线程时，可以使用条件变量、`std::atomic_flag`、`std::atomic<bool>` 或信号量。在“线程的快速同步”章节中，我想回答哪种变体是最快的。协程章节介绍了基于\
  \ `co_return`、`co_yield` 和 `co_await` 的协程。我将这些协程作为进一步实验的起点，以加深我们对协程这种挑战性控制流的理解。在“future\
  \ 的变体”章节中，我在 `co_return` 章节实现了一个懒性 future 和一个基于 future 的 future。“线程的修改与泛化”章节改进了来自\
  \ `co_return` 章节的生成器（generator），最后，“job 工作流”章节讨论了从 `co_return` 章节开始的 job 工作流。\n\n\
  ### 7.1 线程的快速同步\n\n![ping-pong](img/CippiSyncThreads.jpg)\n\n当你需要多次同步线程时，可以使用条件变量、`std::atomic_flag`、`std::atomic<bool>`\
  \ 或信号量。在这一节中，我想回答哪种变体是最快的？为了获得可比较的数据，我实现了一个 ping-pong 游戏。一个线程执行 `ping` 函数（简称），另一个线程执行\
  \ `pong` 函数（简称）。ping 线程等待 pong 线程的通知并传回给 线程。游戏在 1,000,000 次变化后停止。我执行了五次游戏以获得性能数据。让我从\
  \ C++11 开始比较。\n\n#### 7.1.1 条件变量\n\n```cpp\n 1 pingConditionVariable.cpp\n 2 \n\
  \ 3 #include <condition_variable>\n 4 #include <iostream>\n 5 #include <atomic>\n\
  \ 6 #include <thread>\n 7 \n 8 bool dataReady{false};\n 9 \n10 std::mutex mutex_;\n\
  11 std::condition_variable condVar1;\n12 std::condition_variable condVar2;\n13 \n\
  14 std::atomic<int> counter{};\n15 constexpr int countlimit = 1'000'000;\n16 \n\
  17 void ping() {\n18 \n19     while(counter <= countlimit) {\n20         {\n21 \
  \            std::unique_lock<std::mutex> lck(mutex_);\n22             condVar1.wait(lck,\
  \ []{return dataReady == false;});\n23             dataReady = true;\n24       \
  \  }\n25         ++counter;\n26         condVar2.notify_one();\n27     }\n28 }\n\
  29 \n30 void pong() {\n31 \n32     while(counter < countlimit) {  \n33         {\n\
  34             std::unique_lock<std::mutex> lck(mutex_);\n35             condVar2.wait(lck,\
  \ []{return dataReady == true;});\n36             dataReady = false;\n37       \
  \  }\n38         condVar1.notify_one();\n39     }\n40 }\n41 \n42 int main(){\n43\
  \ \n44     auto start = std::chrono::system_clock::now();  \n45 \n46     std::thread\
  \ t1(ping);\n47     std::thread t2(pong);\n48 \n49     t1.join();\n50     t2.join();\n\
  51   \n52     std::chrono::duration<double> dur = std::chrono::system_clock::now(\\\
  \n53 ) - start;\n54     std::cout << \"Duration: \" << dur.count() << \" seconds\"\
  \ << '\\n';\n55 }\n```\n\n使用条件变量的多次时间同步\n\n\n\n\n\n我在程序中使用两个条件变量：`condVar1` 和 `condVar2`。ping\
  \ 线程等待 `condVar1` 的通知，并通过 `condVar2` 发送其通知。变量 `dataReady` 用于防止虚假唤醒和丢失唤醒。当 `counter`\
  \ 达到 `countlimit` 时，乒乓球游戏结束。`notify_one` 调用（第 26 行和 38 行）和 `counter` 是线程安全的，因此它们位于临界区之外。\n\
  \n以下是相关数据。\n\n![使用条件变量的多次时间同步](img/CaseStudies----pingPongConditionVariable.png)\n\
  \n使用条件变量的多次时间同步\n\n平均执行时间为 0.52 秒。\n\n将此工作流移植到 C++20 的 `std::atomic_flag` 是简单的。\n\
  \n## 7.1.2 `std::atomic_flag`\n\n这里是使用两个原子标志 以及一个原子标志的相同工作流。\n\n### 7.1.2.1 两个原子标志\n\
  \n在以下程序中，我将对条件变量的等待替换为对原子标志的等待，并将对条件变量的通知替换为设置原子标志后发送通知。\n\n```\n 1 // pingPongAtomicFlags.cpp\n\
  \ 2 \n 3 #include <iostream>\n 4 #include <atomic>\n 5 #include <thread>\n 6 \n\
  \ 7 std::atomic_flag condAtomicFlag1{};\n 8 std::atomic_flag condAtomicFlag2{};\n\
  \ 9 \n10 std::atomic<int> counter{};\n11 constexpr int countlimit = 1'000'000;\n\
  12 \n13 void ping() {\n14     while(counter <= countlimit) {\n15         condAtomicFlag1.wait(false);\n\
  16         condAtomicFlag1.clear();\n17 \n18         ++counter;\n19 \n20       \
  \  condAtomicFlag2.test_and_set();\n21         condAtomicFlag2.notify_one();\n22\
  \     }\n23 }\n24 \n25 void pong() {\n26     while(counter < countlimit) {\n27 \
  \        condAtomicFlag2.wait(false);\n28         condAtomicFlag2.clear();\n29 \n\
  30         condAtomicFlag1.test_and_set();\n31         condAtomicFlag1.notify_one();\n\
  32     }\n33 }\n34 \n35 int main() {\n36 \n37     auto start = std::chrono::system_clock::now();\
  \  \n38 \n39     condAtomicFlag1.test_and_set();\n40     std::thread t1(ping);\n\
  41     std::thread t2(pong);\n42 \n43     t1.join();\n44     t2.join();\n45 \n46\
  \     std::chrono::duration<double> dur = std::chrono::system_clock::now(\\\n47\
  \ ) - start;\n48     std::cout << \"Duration: \" << dur.count() << \" seconds\"\
  \ << '\\n';\n49 \n50 }\n```\n\n使用两个原子标志的多次时间同步\n\n调用 `condAtomicFlag1.wait(false)`（第\
  \ 15 行）如果原子标志的值为 `false` 则阻塞，如果 `condAtomicFlag1` 的值为 `true` 则返回。该布尔值充当一种谓词，因此必须被置回\
  \ `false`（第 15 行）。在向 pong 线程发送通知（第 21 行）之前，`condAtomicFlag1` 被设置为 true（第 20 行）。`condAtomicFlag1`\
  \ 的初始设置（第 39 行）为 `true` 启动了游戏。\n\n得益于 `std::atomic_flag`，游戏结束得更快。\n\n![使用两个原子标志的多次时间同步](img/CaseStudies----pingPongAtomicFlags.png)\n\
  \n使用两个原子标志的多次时间同步\n\n平均而言，游戏需要 0.32 秒。\n\n当你分析程序时，你可能会发现一个原子标志对于该工作流已经足够。\n\n###\
  \ 7.1.2.2 一个原子标志\n\n使用一个原子标志使得工作流更易理解。\n\n```\n 1 // pingPongAtomicFlag.cpp\n 2\
  \ \n 3 #include <iostream>\n 4 #include <atomic>\n 5 #include <thread>\n 6 \n 7\
  \ std::atomic_flag condAtomicFlag{};\n 8 \n 9 std::atomic<int> counter{};\n10 constexpr\
  \ int countlimit = 1'000'000;\n11 \n12 void ping() {\n13     while(counter <= countlimit)\
  \ {\n14         condAtomicFlag.wait(true);\n15         condAtomicFlag.test_and_set();\n\
  16 \n17         ++counter;\n18 \n19         condAtomicFlag.notify_one();\n20   \
  \  }\n21 }\n22 \n23 void pong() {\n24     while(counter < countlimit) {\n25    \
  \     condAtomicFlag.wait(false);\n26         condAtomicFlag.clear();\n27      \
  \   condAtomicFlag.notify_one();\n28     }\n29 }\n30 \n31 int main() {\n32 \n33\
  \     auto start = std::chrono::system_clock::now();  \n34 \n35     condAtomicFlag.test_and_set();\n\
  36     std::thread t1(ping);\n37     std::thread t2(pong);\n38 \n39     t1.join();\n\
  40     t2.join();\n41 \n42     std::chrono::duration<double> dur = std::chrono::system_clock::now(\\\
  \n43 ) - start;\n44     std::cout << \"Duration: \" << dur.count() << \" seconds\"\
  \ << '\\n';\n45 \n46 }\n```\n\n使用一个标志的多次时间同步\n\n在这种情况下，ping 线程在 `true` 上阻塞，而 pong\
  \ 线程在 `false` 上阻塞。从性能角度来看，使用一个或两个标志没有区别。\n\n![使用条件变量的多次时间同步](img/CaseStudies----pingPongConditionVariable.png)\n\
  \n使用一个标志的多次时间同步\n\n平均执行时间为 0.31 秒。\n\n## 7.1.3 `std::atomic<bool>`\n\n以下 C++ 实现基于\
  \ `std::atomic`。\n\n```\n 1 // pingAtomicBool.cpp\n 2 \n 3 #include <iostream>\n\
  \ 4 #include <atomic>\n 5 #include <thread>\n 6 \n 7 std::atomic<bool> atomicBool{};\n\
  \ 8 \n 9 std::atomic<int> counter{};\n10 constexpr int countlimit = 1'000'000;\n\
  11 \n12 void ping() {\n13     while(counter <= countlimit) {\n14         atomicBool.wait(true);\n\
  15         atomicBool.store(true);\n16 \n17         ++counter;\n18 \n19        \
  \ atomicBool.notify_one();\n20     }\n21 }\n22 \n23 void pong() {\n24     while(counter\
  \ < countlimit) {\n25         atomicBool.wait(false);\n26         atomicBool.store(false);\n\
  27         atomicBool.notify_one();\n28     }\n29 }\n30 \n31 int main() {\n32 \n\
  33     std::cout << std::boolalpha << '\\n';\n34 \n35     std::cout << \"atomicBool.is_lock_free():\
  \ \"\n36               << atomicBool.is_lock_free() << '\\n';\n37 \n38     std::cout\
  \ << '\\n';\n39 \n40     auto start = std::chrono::system_clock::now();\n41 \n42\
  \     atomicBool.store(true);\n43     std::thread t1(ping);\n44     std::thread\
  \ t2(pong);\n45 \n46     t1.join();\n47     t2.join();\n48 \n49     std::chrono::duration<double>\
  \ dur = std::chrono::system_clock::now(\\\n50 ) - start;\n51     std::cout << \"\
  Duration: \" << dur.count() << \" seconds\" << '\\n';\n52 \n53 }\n```\n\n使用原子布尔的多次时间同步\n\
  \n`std::atomic<bool>` 内部可以使用互斥锁等锁定机制。我的 Windows 运行时间是无锁的。\n\n![使用两个原子标志的多次时间同步](img/CaseStudies----pingPongAtomicFlags.png)\n\
  \n使用原子布尔的多次时间同步\n\n平均执行时间为 0.38 秒。\n\n## 7.1.4 信号量\n\n信号量 承诺比条件变量更快。让我们看看是否如此。\n\
  \n\n\n\n\n```cpp\n 1 // pingPong 信号量.cpp\n 2\n #include <iostream>\n #include <semaphore>\n\
  \ #include <thread>\n\n std::counting_semaphore<1> signal2Ping(0);\n std::counting_semaphore<1>\
  \ signal2Pong(0);\n\n std::atomic<int> counter{};\n constexpr int countlimit = 1'000'000;\n\
  \n void ping() {\n    while(counter <= countlimit) {\n        signal2Ping.acquire();\n\
  \        ++counter;\n        signal2Pong.release();\n    }\n}\n\nvoid pong() {\n\
  \    while(counter < countlimit) {\n        signal2Pong.acquire();\n        signal2Ping.release();\n\
  \    }\n}\n\nint main() {\n\n    auto start = std::chrono::system_clock::now();\n\
  \n    signal2Ping.release();\n    std::thread t1(ping);\n    std::thread t2(pong);\n\
  \n    t1.join();\n    t2.join();\n\n    std::chrono::duration<double> dur = std::chrono::system_clock::now(\\\
  \n ) - start;\n    std::cout << \"Duration: \" << dur.count() << \" seconds\" <<\
  \ '\\n';\n\n}\n```\n\n\n\n\n\n# 懒性未来的控制流\n\n让我们先学习 promise（承诺）。promise 在开始处（第 44\
  \ 行）和结束处（第 48 行）总是会挂起。此外，成员函数 `get_return_object`（第 36 行）创建了返回给协程调用者 `createFuture`（第\
  \ 58 行）的返回对象。future `MyFuture`更有趣。它拥有一个指向 promise 的句柄 `coro`（第 12 行）。`MyFuture`\
  \ 使用该句柄管理 promise。它恢复 promise（第 24 行），向 promise 索要结果（第 25 行），并销毁它（第 19 行）。协程的恢复是必要的，因为它永远不会自动运行（第\
  \ 44 行）。当客户端调用 `fut.get()`（第 68 行）来请求 future 的结果时，它隐式地恢复了 promise（第 24 行）。\n\n你可以在\
  \ [Compiler Explorer](https://godbolt.org/z/EejWcj) 上尝试该程序。\n\n![A lazy future](img/CaseStudies----lazyFuture.png)\n\
  \n## 懒性未来\n\n如果客户端对 future 的结果不感兴趣会发生什么？让我们尝试一下。\n\n```\nint main() {\n\n    std::cout\
  \ << '\\n';\n\n    auto fut = createFuture();\n    // auto res = fut.get();\n  \
  \  // std::cout << \"res: \" << res << '\\n';\n\n    std::cout << '\\n';\n\n}\n\
  ```\n\n## 客户端没有恢复协程\n\n正如你所猜的那样，promise 从未运行，成员函数 `return_value` 和 `final_suspend`\
  \ 也没有被执行。\n\n![A lazy future that is not started](img/CaseStudies----lazyFutureWithoutGet.png)\n\
  \n### 未启动的懒性未来\n\n让我们进一步改变协程，并在单独线程中运行 promise。\n\n### 7.2.2 在另一个线程上执行\n\n协程在进入协程\
  \ `createFuture`（第 67 行）之前完全挂起，因为成员函数 `initial_suspend` 返回了 `std::suspend_always`（第\
  \ 52 行）。因此，promise 可以在另一个线程上运行。\n\n```cpp\n 1 // lazyFutureOnOtherThread.cpp\n 2\
  \ \n 3 #include <coroutine>\n 4 #include <iostream>\n 5 #include <memory>\n 6 #include\
  \ <thread>\n 7 \n 8 template<typename T>\n 9 struct MyFuture {\n10     struct promise_type;\n\
  11     using handle_type = std::coroutine_handle<promise_type>; \n12     handle_type\
  \ coro;\n13 \n14     MyFuture(handle_type h): coro(h) {}\n15     ~MyFuture() {\n\
  16         if ( coro ) coro.destroy();\n17     }\n18 \n19     T get() {\n20    \
  \     std::cout << \"    MyFuture::get:  \" \n21                   << \"std::this_thread::get_id():\
  \ \" \n22                   << std::this_thread::get_id() << '\\n';\n23        \
  \ \n24         std::thread t([this] { coro.resume(); });\n25         t.join();\n\
  26         return coro.promise().result;\n27     }\n28 \n29     struct promise_type\
  \ {\n30         promise_type(){ \n31             std::cout << \"        promise_type::promise_type:\
  \  \" \n32                       << \"std::this_thread::get_id(): \" \n33      \
  \                 << std::this_thread::get_id() << '\\n';\n34         }\n35    \
  \     ~promise_type(){ \n36             std::cout << \"        promise_type::~promise_type:\
  \  \" \n37                       << \"std::this_thread::get_id(): \" \n38      \
  \                 << std::this_thread::get_id() << '\\n';\n39         }\n40 \n41\
  \         T result;\n42         auto get_return_object() {\n43             return\
  \ MyFuture{handle_type::from_promise(*this)};\n44         }\n45         void return_value(T\
  \ v) {\n46             std::cout << \"        promise_type::return_value:  \" \n\
  47                       << \"std::this_thread::get_id(): \" \n48              \
  \         << std::this_thread::get_id() << '\\n';\n49             std::cout << v\
  \ << std::endl;\n50             result = v;\n51         }\n52         std::suspend_always\
  \ initial_suspend() {\n53             return {};\n54         }\n55         std::suspend_always\
  \ final_suspend() noexcept {\n56             std::cout << \"        promise_type::final_suspend:\
  \  \" \n57                       << \"std::this_thread::get_id(): \" \n58      \
  \                 << std::this_thread::get_id() << '\\n';\n59             return\
  \ {};\n60         }\n61         void unhandled_exception() {\n62             std::exit(1);\n\
  63         }\n64     };\n65 };\n66 \n67 MyFuture<int> createFuture() {\n68     co_return\
  \ 2021;\n69 }\n70 int main() {\n71     std::cout << '\\n';\n72     auto fut = createFuture();\n\
  73     std::cout << '\\n';\n74 }\n```\n\n\n\n\n\n```cpp\n 1 // infiniteDataStreamComments.cpp\n\
  \ 2 \n3 #include <coroutine>\n 4 #include <memory>\n 5 #include <iostream>\n 6 \n\
  7 template<typename T>\n8 struct Generator {\n     \n     struct promise_type;\n\
  \     using handle_type = std::coroutine_handle<promise_type>;\n     \n     Generator(handle_type\
  \ h): coro(h) {\n         std::cout << \"        Generator::Generator\" << '\\n';\n\
  \     }                      \n     handle_type coro;\n     \n     ~Generator()\
  \ {\n         std::cout << \"        Generator::~Generator\" << '\\n';\n       \
  \  if ( coro ) coro.destroy();\n     }\n     Generator(const Generator&) = delete;\n\
  \     Generator& operator = (const Generator&) = delete;\n     Generator(Generator&&\
  \ oth): coro(oth.coro) {\n         oth.coro = nullptr;\n     }\n     Generator&\
  \ operator = (Generator&& oth) {\n         coro = oth.coro;\n         oth.coro =\
  \ nullptr;\n         return *this;\n     }\n     int getNextValue() {\n        \
  \ std::cout << \"        Generator::getNextValue\" << '\\n';\n         coro.resume();\n\
  \         return coro.promise().current_value;\n     }\n     struct promise_type\
  \ {\n         promise_type() {\n             std::cout << \"            promise_type::promise_type\"\
  \ << '\\n';\n         }                              \n         \n         ~promise_type()\
  \ {\n             std::cout << \"            promise_type::~promise_type\" << '\\\
  n';\n         }\n         \n         std::suspend_always initial_suspend() {  \n\
  \             std::cout << \"            promise_type::initial_suspend\" << '\\\
  n';                            \n             return {};\n         }\n         std::suspend_always\
  \ final_suspend() noexcept {\n             std::cout << \"            promise_type::final_suspend\"\
  \ << '\\n';  \n             return {};\n         }\n         auto get_return_object()\
  \ {      \n             std::cout << \"            promise_type::get_return_object\"\
  \ << '\\n';                    \n             return Generator{handle_type::from_promise(*this)};\n\
  \         }\n       \n         std::suspend_always yield_value(int value) {    \n\
  \             std::cout << \"            promise_type::yield_value\" << '\\n'; \
  \                     \n             current_value = value;\n             return\
  \ {};\n         }\n         void return_void() {}\n         void unhandled_exception()\
  \ {\n             std::exit(1);\n         }\n \n         T current_value;\n    \
  \ };\n \n };\n\n Generator<int> getNext(int start = 10, int step = 10) {\n     std::cout\
  \ << \"    getNext: start\" << '\\n';\n     auto value = start;\n     while (true)\
  \ {\n         std::cout << \"    getNext: before co_yield\" << '\\n';\n        \
  \ co_yield value;\n         std::cout << \"    getNext: after co_yield\" << '\\\
  n';\n         value += step;\n     }\n }\n\n int main() {\n   \n     auto gen =\
  \ getNext();\n     for (int i = 0; i <= 2; ++i) {\n         auto val = gen.getNextValue();\n\
  \         std::cout << \"main: \" << val << '\\n';                   \n     }\n\
  \     \n }\n```\n\n# 生成无限数据流的 Generator\n\n在 [Compiler Explorer](https://godbolt.org/z/cTW9Gq)\
  \ 上运行程序可以使控制流透明化。\n\n![生成无限数据流的 Generator](img/CaseStudies----infiniteDataStreamComments.png)\n\
  \n# 生成无限数据流的 Generator\n\n让我们分析控制流。\n\n调用 `getNext()`（第 87 行）触发了 `Generator<int>`\
  \ 的创建。首先创建 `promise_type`（第 38 行），随后的 `get_return_object` 调用（第 54 行）创建生成器（第 56 行）并将其存储在局部变量。当协程第一次挂起时，该调用的结果返回给调用者。初始挂立即发生（第\
  \ 48 行）。由于成员函数调用 `initial_suspend` 返回了一个 Awaitable `std::suspend_always`（第 48 行），控制流继续执行协程\
  \ `getNext`，直到指令 `co_yield value`（第 79 行）。该调用映射到调用 `yield_value(int value)`（第 59\
  \ 行），并准备当前值 `current_value = value`（第 67 行）。\n\n## 7.3.1 协程暂停\n\n成员函数调用 `initial_suspend`\
  \ 返回一个 `std::suspend_always`（第 48 行），控制流继续执行协程 `getNext`，直到指令 `co_yield value`（第\
  \ 79 行）。该调用映射到调用 `yield_value(int value)`（第 59 行），并准备当前值 `current_value = value`（第\
  \ 67 行）。\n\n当协程第一次挂起时，该调用的结果返回给调用者。初始挂起立即发生（第 48 行）。\n\n## 7.3.2 修改\n\n### `std::suspend_always`（第\
  \ 48 行），控制流继续执行协程 `getNext`，直到指令 `co_yield value`（第 79 行）。该调用映射到调用 `yield_value(int\
  \ value)`（第 59 行），并准备当前值 `current_value = value`（第 67 行）。\n\n### `std::suspend_always`（第\
  \ 48 行），控制流继续执行协程 `getNext`，直到指令 `co_yield value`（第 79 行）。该调用映射到调用 `yield_value(int\
