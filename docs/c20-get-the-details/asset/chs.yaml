  线程之间进行同步是非常典型的。一个线程准备一个工作包，另一个线程对其进行等待。[条件变量](https://en.cppreference.com/w/cpp/thread/condition_variable),[promise\
  \ 和 future](https://en.cppreference.com/w/cpp/thread)以及[原子布尔](https://en.cppreference.com/w/cpp/atomic/atomic)都可以用于创建发送者-接收者工作流。得益协程，线程同步变得非常简单，而且没有条件变量固有的风险，例如虚假唤醒和丢失唤醒。\n\
  \n```cpp\n 1 // senderReceiver.cpp\n  2 \n  3 #include <coroutine>\n  4 #include\
