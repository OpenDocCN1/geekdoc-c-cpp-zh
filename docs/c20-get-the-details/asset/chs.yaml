  # define COMPILER_ATTRIBUTE_ENTRY(attr) \\\n  { #attr, COMPILER_ATTRIBUTE_AS_NUMBER(__has_cpp_attribute(attr))\
  \ },\n#else\n# define COMPILER_ATTRIBUTE_ENTRY(attr) { #attr, \"_\" },\n#endif\n\
  \n// 修改这些选项以仅打印必要信息。\nstatic struct PrintOptions {\n    constexpr static bool titles\
