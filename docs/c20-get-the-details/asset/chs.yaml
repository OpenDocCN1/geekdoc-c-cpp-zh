  \ 69 \n 70 }\n```\n\n#### 自动恢复 Awaiter\n\n首先，协程现在命名为 `performJob` 并自动运行。`gen`（第\
  \ 9 行）是一个生成 0 或 1 的随机数生成器。它的任务使用默认随机引擎，并用种子初始化。得益于 `std::bind_front`，我可以将其与 `std::uniform_int_distribution`\
  \ 绑定，得到一个可调用对象，使用它时会给我一个随机数 0 或 1。\n\n在这个示例中，我移除了 C++ 中预定义的 Awaitables。Awaitable\
  \ 的 `MySuspendNever` 函数立即就就绪，因为 `await_ready` 返回 `true`，因此不会发生挂起。当 `await_ready`\
