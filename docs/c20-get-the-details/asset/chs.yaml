  更新你的 C++ 知识，这就是这本正确的书。你将对 C++20 为 C++ 带来的新功能感到惊讶。这本书通过简洁的示例为你提供了清晰的解释。它的结构允许你以后将其作为参考。它可以帮助\n\
  你释放旧语言通往其强大的未来。\" \n```\n\n## 引言\n\n我的书籍 `C++20` 既是教程也是参考书。它教教你 `C++20` 并为你提供这个令人兴奋的新\
  \ C++ 标准的细节。这种兴奋感主要源于 `C++20` 的四大支柱：\n\n* **概念（Concepts）** 改变了我们思考模板以及使用模板进行编程的方式。它们是模板参数的语义分类。它们允许你直接在类型系统中表达你的意图。如果出现问题，编译器会给你一个清晰的错误信息。\n\
  \n* **模块（Modules）** 克服了头文件的限制。它们承诺了许多可能。例如，头文件和源文件的分离将变得像预处理器一样过时。最终，我们获得了更快的编译速度和更容易构建包的方法。\n\
  \n* 新的 **ranges 库（ranges library）** 支持直接在容器上执行算法，使用管道符号组合算法，并在无限数据流上对惰性地应用算法。\n\n\
  * 得益于 **协程（coroutines）**，C++ 中的异步编程变得主流。协程是协作任务、事件循环、无限数据流或流水线的基础。\n\n当然，这故事还没有结束。这里是更多\
  \ C++20 特性：\n\n* 自动生成的比较运算符\n* 日历和时区库\n* 格式化库\n* 连续内存块的视图（Views）\n* 改进的、可中断的线程\n\
  * 原子智能指针\n* 信号量\n* 同步原语，如栅栏（latches）和屏（barriers）\n\n### 约定\n\n这里只有几个约定。\n\n####\
  \ 特殊字体\n\n*斜体 (Italic)*：我使用*斜体*来强调引用。\n\n**粗体 (Bold）**：我使用**粗体**来强调名称。\n\n`等宽字体\
  \ (Monospace）`：我将`等宽字体`用于代码。\n\n#### 特殊框\n\n框包含背景提示、警告和精炼信息。\n\n### 源代码\n\n书中示例是完整的。这意味着，只要你有相应的编译器，就可以运行它们。源代码使用四个空格缩进。出于布局考虑，我有时使用两个空格缩进。\n\
  \n#### 程序的编译\n\n由于 C++20 标准非常新，与 MSVC 不同，GCC 和 Clang 需要你链接 pthread。在使用并发特性时，与 MSVC\
  \ 不同，GCC 和 Clang 要求你使用 `-std=c++20`。\n\n### 你应该如何阅读这本书\n\n如果你不熟悉 C++20，从头开始通过快速概览了解整体。\n\
  \n一旦你了解了整体，就可以继续学习核心语言。每个特性的介绍都是自包含的，但从头到尾读这本书是更好的方法。第一次阅读时，你可以跳过快速概览中未提到的特性。\n\n\
