  \n序数日期\n\n\n\n\n我的第一个例子非常简单。它显示了 UTC 时间和本地时间。\n\n### 5.5.3.1 UTC 时间与本地时间\n\n[UTC\
  \ 时间或称为协调世界时](https://en.wikipedia.org/wiki/Coordinated_Universal_Time) 是全球范围内主要的时间标准。计算机使用\
  \ [Unix 时间](https://en.wikipedia.org/wiki/Unix_time)，它是 UTC 的一个非常接近的近似。Unix 时间自\
  \ Unix 纪元（Unix epoch）以来的秒数。Unix 纪元是 1970 年 1 月 1 日 UTC 00:00:00。\n\n`std::chrono::system_clock::now()`\
  \ 在程序 `localTime.cpp` 中返回 Unix 时间。\n\n```\n 1 // localTime.cpp\n 2 \n 3 #include\
  \ \"date/tz.h\"\n 4 #include <iostream>\n 5 \n 6 int main() {\n 7 \n 8   std::cout\
  \ << '\\n';\n 9 \n10   using namespace date;\n11  \n12   std::cout << \"UTC  time\"\
  \ << '\\n';             \n13   auto utcTime = std::chrono::system_clock::now();\n\
  14   std::cout << \"  \" << utcTime << '\\n';\n15   std::cout << \"  \" << date::floor<std::chrono::seconds>(utcTime)\
  \ << '\\\\\n16 n':\n17 \n18   std::cout << '\\n';\n19     \n20   std::cout << \"\
  Local time\" << '\\n';            \n21   auto localTime = date::make_zoned(date::current_zone(),\
  \ utcTime);\n22   std::cout << \"  \" << localTime << '\\n';\n23   std::cout <<\
  \ \"  \" << date::floor<std::chrono::seconds>(localTime.get_\\\n24 local_time())\
  \ \n25             << '\\n';\n26 \n27   auto offset = localTime.get_info().offset;\
  \        \n28   std::cout << \"  UTC offset: \"  << offset << '\\n';\n29 \n30  \
  \ std::cout << '\\n';\n31 \n32 }\n```\n\n#### 获取 UTC 时间和本地时间\n\n从第 12 行开始的代码块获取当前时间点，将其截断到秒并进行显示。`make_zoned`\
  \ 调用（第 20 行）创建了一个 `std::chrono::zoned_time localTime`。之后，调用 `localTime.get_local_time()`\
  \ 将存储的时间点作为本地时间返回。该时间点也被截断为秒。`localTime`（第 25 行）也可以用于获取有关时区的信息。在这种情况下，我感兴趣的是相对于\
