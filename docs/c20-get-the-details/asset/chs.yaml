  \ 返回 `true` 时，调用了 `await_resume`；当 `await_ready` 返回 `false` 时，协程被挂起。你可以在 [Compiler\
  \ Explorer](https://godbolt.org/z/14) 上尝试该程序。\n\n#### 3 在单独线程上恢复 Awaiter\n\n以下程序基于上一个程序。让我改进所展示的内容，并在线程上恢复\
