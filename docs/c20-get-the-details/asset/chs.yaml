  \ sec; };\n8 auto sumGen = [](auto fir, auto sec) { return fir + sec; };\n9 auto\
  \ sumDec = []<typename T>(T fir, T sec) { return fir + sec; }; \n10 \n11 int main()\
  \ {\n12     \n13     std::cout << '\\n';\n14     \n15     std::string hello = \"\
  Hello \";\n16     std::string world = \"world\";\n17 \n18     std::cout << hello\
  \ << sumInt(2020, 2020) << '\\n';\n19     std::cout << hello << sumGen(2020, 2020)\
