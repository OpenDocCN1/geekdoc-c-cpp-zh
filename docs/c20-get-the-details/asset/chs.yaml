  \n## 6.1.8 `co_await`\n\n`co_await` 最终会导致协程的执行被挂起或恢复。`co_await` 中的表达式 `exp` 必须是一个所谓的可等待（awaitable）表达式，即必须实现一个特定的接口，由\
  \ `await_ready`、`await_suspend` 和 `await_resume` 函数组成。\n\n`co_await` 的典型用例是一个等待事件的服务器。\n\
  \n```cpp\n1 Acceptor acceptor{443};\n2 while (true) {\n3     Socket socket = acceptor.accept();\
  \             // blocking\n4     auto request = socket.read();                 \
  \ // blocking\n5     auto response = handleRequest(request);     \n6     socket.write(response);\
  \                        // blocking  \n7 }\n```\n\n阻塞服务器\n\n服务器非常简单，因为它在同一线程中顺序处理每个请求。服务器监听端口\
  \ 443（第 1 行），接受连接（第 3 行），从客户端读取输入数据（第 4 行），并向客户端写入答案（第 6 行）。第 3、4 和 6 行的调用是阻塞的。\n\
  \n得益于 `co_await`，阻塞调用现在可以被挂起和恢复。\n\n```cpp\n1 Acceptor acceptor{443};\n2 while (true)\
  \ {\n3     Socket socket = co_await acceptor.accept();           \n4     auto request\
  \ = co_await socket.read();              \n5     auto response = handleRequest(request);\
  \     \n6     co_await socket.write(response);                 \n7 } \n```\n\n等待服务器\n\
