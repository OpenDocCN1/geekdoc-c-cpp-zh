  \n一天时间\n\n### 5.5.2 日期\n\nC++20 chrono 扩展的新类型是日期。C++20 支持多种创建日期和与之交互的方法。首先：什么是日期？\n\
  \n*   日期（calendar date）是一个由年、月、日的日期。因此，C++20 有一个特定的数据类型 `std::chrono::year_month_day`。C++20\
  \ 提供的更多。在向你展示各种用例之前，下表应该为你提供日期类型的初步概述。\n\n各种日期类型\n\n| 类型 | 描述 |\n| --- | --- |\n\
