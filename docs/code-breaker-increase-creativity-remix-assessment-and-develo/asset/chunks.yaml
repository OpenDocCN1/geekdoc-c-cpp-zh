    # [http://brianaspinall.com/coding-a-story-probability-quick-write-prompts](http://brianaspinall.com/coding-a-story-probability-quick-write-prompts)


    ![line](Images/line.png)


    We need to think about teaching kids to code in the same way. Sure, the Internet
    of Things means more jobs will require coding. But most students are not going
    to become professional programmers—just as most students do not become professional
    writers. That’s OK. They still should learn to code. They still should learn a
    different way of thinking, communicating their thoughts to others, and learning
    what others think.


    If we want to help children think differently, and maybe better, we need to encourage
    them to have growth mindsets. That means we need to encourage them to adapt to
    change, take risks, and learn from their mistakes without thinking they’re failures
    because they made a mistake. They must to learn to communicate and collaborate.
    They must to learn to face their fears and not get stuck in them. We should also
    remind ourselves that even students who get good grades can get stuck in a mindset
    of fear that resists growth.


    ### Let’s look at two students


    Student A loves school and is good at “playing school.” She participates in class
    discussions and thrives on the challenge of a test. School comes naturally to
    Student A, but she also works at it. In fact, she studies at least three nights
    ahead of every exam and completes her homework as soon as she gets home from school.


    Why? Because Student A is driven by grades, and she wants to be told what to do
    to hit the mark. For her, earning a good grade equals success. Student A knows
    what to do to get the grade, and Student A feels successful.


    Student A doesn’t take risks or think critically, because she has already figured
    out exactly what is required to earn high marks. Veering from that path is unsafe
    and puts her high marks at risk. Staying on that path is the safe choice.


    Student B doesn’t like school and is disengaged. In fact, if Student B could only
    get a B on his report card, it would be a rare cause for celebration. There could
    be many reasons for this. Maybe Student B was never taught how to take a test
    properly, so the test-based system tells Student B that he is dumb. This just
    makes it easier for Student B to check out of school. He doesn’t complete homework,
    but that doesn’t mean he doesn’t think about it. In fact, Student B’s fear of
    failing—and feeling like failure is his only option—often keeps him awake at night.
    Why? Because Student B is also driven by marks, but he doesn’t know how to excel
    to earn those good marks. For Student B, getting a good mark also equals success,
    but he doesn’t know how to do well on tests and exams. He doesn’t think critically
    because he figures Student A has all the answers, and if she already knows the
    answer, his opinion won’t matter. Student B won’t take a risk. It’s unsafe.


    These two students bring home vastly different report cards, but they have one
    thing in common—fear of trying new things and growing.


    We all know several factors contribute to a student becoming Student A or Student
    B—family life, native language, learning disabilities, physical disabilities,
    class size, school culture, and administration, to name a few. And let’s be brutally
    honest: one of the hard truths about teaching is that we see the impact of all
    of these things but cannot always do much about their causes. We can’t go home
    with our students, but we can control our classrooms. We can encourage our students
    to grow. I suggest we begin by changing how we think about control and classroom
    management.


    A classroom isn’t made up of walls and ceilings and desks and curriculum. Classrooms
    are made up of people. We are asked to manage people.


    People make noise. People make mistakes. We need to stop thinking a `controlled`
    classroom is a quiet classroom, and an `uncontrolled` classroom is a loud one.
    The volume in a classroom is not a scale to measure the quality of the teacher
    in it. A loud classroom doesn’t equal a bad teacher; a quiet classroom doesn’t
    equal a good teacher.


    As teachers, we all want students to meet our expectations. We want them to do
    well and push themselves to do better. I also want them to want to do better.
    I want reluctant writers to write, not avoid it because they’re afraid of messing
    up or disappointing me. I want them to write because they know I already believe
    in their ability. They want to make me happy, but not because they’re afraid of
    making me mad. They know that what they write or don’t write won’t change my belief
    in what they can do as students. They’re engaged students.


    ![line](Images/line.png)


