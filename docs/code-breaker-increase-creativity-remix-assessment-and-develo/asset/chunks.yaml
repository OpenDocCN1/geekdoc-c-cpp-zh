    # More from


    ![DBC_logo](Images/dbc-logo.png)


    ![Teach Like a Pirate](Images/dbc_TLAP.jpg)


    ## Teach Like a PIRATE


    ### Increase Student Engagement, Boost Your Creativity, and Transform Your Life
    as an Educator


    #### By Dave Burgess ([@BurgessDave](https://twitter.com/BurgessDave))


    *Teach Like a PIRATE* is the *New York Times* best-selling book that has sparked
    a worldwide educational revolution. It is part inspirational manifesto that ignites
    passion for the profession and part practical road map, filled with dynamic strategies
    to dramatically increase student engagement. Translated into multiple languages,
    its message resonates with educators who want to design outrageously creative
    lessons and transform school into a life-changing experience for students.


    ![Learn Like a Pirate](Images/dbc_LLAP.jpg)


    ## Learn Like a PIRATE


    ### Empower Your Students to Collaborate, Lead, and Succeed


    #### By Paul Solarz ([@PaulSolarz](https://twitter.com/PaulSolarz))


    Today’s job market demands that students be prepared to take responsibility for
    their lives and careers. We do them a disservice if we teach them how to earn
    passing grades without equipping them to take charge of their education. In *Learn
    Like a Pirate*, Paul Solarz explains how to design classroom experiences that
    encourage students to take risks and explore their passions in a stimulating,
    motivating, and supportive environment where improvement, rather than grades,
    is the focus. Discover how student-led classrooms help students thrive and develop
    into self-directed, confident citizens who are capable of making smart, responsible
    decisions, all on their own.


    ![P is for Pirate](Images/dbc_PIFP.jpg)


    ## P is for PIRATE


    ### Inspirational ABC’s for Educators


    #### By Dave and Shelley Burgess ([@Burgess_Shelley](https://twitter.com/Burgess_Shelley))


    Teaching is an adventure that stretches the imagination and calls for creativity
    every day! In *P is for Pirate*, husband and wife team, Dave and Shelley Burgess,
    encourage and inspire educators to make their classrooms fun and exciting places
    to learn. Tapping into years of personal experience and drawing on the insights
    of more than seventy educators, the authors offer a wealth of ideas for making
    learning and teaching more fulfilling than ever before.


    ![Play Like a Pirate](Images/dbc_PLAP.jpg)


    ## Play Like a Pirate


    ### Engage Students with Toys, Games, and Comics


    #### by Quinn Rollins ([@jedikermit](https://twitter.com/jedikermit))


    Yes! School can be simultaneously fun and educational. In *Play Like a Pirate*,
    Quinn Rollins offers practical, engaging strategies and resources that make it
    easy to integrate fun into your curriculum. Regardless of the grade level you
    teach, you’ll find inspiration and ideas that will help you engage your students
    in unforgettable ways.


    ![eXPlore Like a Pirate](Images/dbc_ELAP.jpg)


    ## eXPlore Like a Pirate


    ### Gamification and Game-Inspired Course Design to Engage, Enrich, and Elevate
    Your Learners


    #### By Michael Matera ([@MrMatera](https://twitter.com/MrMatera))


    Are you ready to transform your classroom into an experiential world that flourishes
    on collaboration and creativity? Then set sail with classroom game designer and
    educator, Michael Matera, as he reveals the possibilities and power of game-based
    learning. In e*XPlore Like a Pirate,* Matera serves as your experienced guide
    to help you apply the most motivational techniques of gameplay to your classroom.
    You’ll learn gamification strategies that will work with and enhance (rather than
    replace) your current curriculum and discover how these engaging methods can be
    applied to any grade level or subject.


    ![Pure Genius](Images/dbc_PG.jpg)


    ## Pure Genius


    ### Building a Culture of Innovation and Taking 20% Time to the Next Level


    #### By Don Wettrick ([@DonWettrick](https://twitter.com/DonWettrick))


    For far too long, schools have been bastions of boredom, killers of creativity,
    and way too comfortable with compliance and conformity. In *Pure Genius*, Don
    Wettrick explains how collaboration — with experts, students, and other educators
    — can help you create interesting, and even life-changing, opportunities for learning.
    Wettrick’s book inspires and equips educators with a systematic blueprint for
    teaching innovation in any school.


    ![The Zen Teacher](Images/dbc_TZT.jpg)


    ## The Zen Teacher


    ### Creating FOCUS, SIMPLICITY, and TRANQUILITY in the Classroom


    #### By Dan Tricarico ([@TheZenTeacher](https://twitter.com/TheZenTeacher))


    Teachers have incredible power to influence, even improve, the future. In *The
    Zen Teacher,* educator, blogger, and speaker, Dan Tricarico, provides practical,
    easy-to-use techniques to help teachers be their best — unrushed and fully focused
    — so they can maximize their performance and improve their quality of life. In
    this introductory guide, Dan Tricarico explains what it means to develop a Zen
    practice — something that has nothing to do with religion and everything to do
    with your ability to thrive.


    ![140 Twitter Tips for Educators](Images/dbc_140TT.jpg)


    ## 140 Twitter Tips for Educators


    ### Get Connected, Grow Your Professional Network, and Reinvigorate Your Career


    #### By Brad Currie, Billy Krakower, and Scott Rocco ([@bradmcurrie](https://twitter.com/bradmcurrie),
    [@wkrakower](https://twitter.com/wkrakower), [@ScottRRocco](https://twitter.com/ScottRRocco))


    Whatever questions you have about education or how you can be even better at your
    job, you’ll find ideas, resources, and a vibrant network of professionals ready
    to help you on Twitter. In *140 Twitter Tips for Educators*, Satchat hosts and
    founders of Evolving Educators, Brad Currie, Billy Krakower, and Scott Rocco offer
    step-by-step instructions to help you master the basics of Twitter, build an online
    following, and become a Twitter rock star.


    ![The Innovators Mindset](Images/dbc_TIM.jpg)


    ## The Innovator’s Mindset


    ### Empower Learning, Unleash Talent, and Lead a Culture of Creativity


    #### By George Couros ([@gcouros](https://twitter.com/gcouros))


    The traditional system of education requires students to hold their questions
    and compliantly stick to the scheduled curriculum. But our job as educators is
    to provide new and better opportunities for our students. It’s time to recognize
    that compliance doesn’t foster innovation, encourage critical thinking, or inspire
    creativity — and those are the skills our students need to succeed. In *The Innovator’s
    Mindset*, George Couros encourages teachers and administrators to empower their
    learners to wonder, to explore — and to become forward-thinking leaders.


    ![50 Things You Can Do with Google Classroom](Images/dbc_50TGCU.jpg)


    ## 50 Things You Can Do with Google Classroom


    #### By Alice Keeler and Libbi Miller ([@AliceKeeler](https://twitter.com/AliceKeeler),
    [@MillerLibbi](https://twitter.com/MillerLibbi))

