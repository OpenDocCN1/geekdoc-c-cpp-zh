- fmt: '

    I decided to try coding with my class after one of our P.A. Day Ed Camp–style
    meetings. At this meeting we had students from our school teach us about coding,
    and we discussed the idea of `Hour of Code`. I had no idea what coding really
    was, so I thought I’d better invest some time and learn. We started with `Hopscotch`
    because you are able to use it on a tablet, and it is age appropriate.


    ### What have you noticed as a result?


    The first day we tried `Hopscotch`, I gave the students the opportunity to explore
    and problem solve on their own or with a partner. The second time we used `Hopscotch`,
    some students were already becoming “experts.” I noticed that the students would
    share their learning and collaborate and try to problem solve together. Many students
    put the app on their own devices, and they watched YouTube videos at home and
    at school to help them create new codes.


    ### You had students code applications to draw 3D math shapes. Can you tell me
    about this?


    We started out by creating 2D shapes. We had great discussions about the importance
    of knowing the angle degrees and the number of sides when creating the code. We
    also noticed a pattern that happens when creating some of the shapes, and that
    you can reduce the amount of coding by creating loops. After mastering the 2D
    shapes, I challenged them to try to create 3D shapes. They amazed me, of course.
    They worked together to problem solve and persevere through this challenge. The
    mathematical discussions and collaboration were incredible. Some students even
    thought to bring out a protractor to help with the angles. We noticed that there
    were different ways to create 3D shapes, different codes and strategies. I love
    when they realize that there is more than one way to solve a problem!


    ### Where do you see your students taking this?


    I think the next step will be to try to find other classes through Twitter that
    use `Hopscotch`, so we can share and challenge each other. I was also thinking
    that we could try to use `Hopscotch` to make translations. I would also like to
    get them to use `Scratch` as a next step, where they can learn to make apps. They
    seem to be picking up the concepts so fast. It is very exciting.


    ### Finally, is there any other information you’d like us to know about this project
    and approach to learning?


    I think one of the most important things that I have learned from this experience
    is that using technology with math helps to even out the academic playing field.
    I have 10 students that have `IEPs` (Individual Education Plans) in my classroom,
    and with the use of this technology, you are not able to pick out who needs accommodations
    in math. This coding experience also gives voices to students who previously,
    for one reason or another, did not share their thoughts or opinions. It has empowered
    them. This adventure has been a great learning experience for my students and
    myself. I enjoyed being a student right along with them. For anyone who is thinking
    about trying coding with their students, my advice would be, “Don’t think; just
    do!” Let go of wanting to be in control and embrace the opportunity to be a co-learner.


    Val’s story demonstrates how anyone, at any age, can learn coding. It also brings
    up something we talk about a lot when we talk about twenty-first-century learning—equity
    and student voice. Equity means that everyone gets what they need—not that everyone
    necessarily gets the same thing. That can be a difficult concept for students
    to understand; they often know if they’re different. Val had students who needed
    different supports in math to learn the content. Individualized Education Plans
    can be useful, but the system can sometimes make it hard for all students to feel
    included. Coding allowed all students to participate together. It helped give
    everyone a tool to speak and let their voices be heard.


