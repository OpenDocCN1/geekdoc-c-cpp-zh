    ### Featured Post


    #### Unplugging the Hour of Code Part 1


    ![QR-Unplugging-the-Hour-of-Code-Part-1](Images/QR-Unplugging-the-Hour-of-Code-Part-1.png)


    ###### [http://brianaspinall.com/unplugging-the-hour-of-code](http://brianaspinall.com/unplugging-the-hour-of-code)


    ![line](Images/line.png)


    One of the reasons we’ve convinced ourselves that introducing these technologies
    automatically makes us creative is that we’re thinking about coding in the wrong
    way. We tend to think coding is the same as computer science. It’s not. (Remember
    the degree I have? Trust me, not all my courses were about coding.) Computer science
    is about how things work and how we can make them work better. Coding and hardware
    are ways to do that. Coding is a part of computer science, just as biology is
    one area of study in the natural sciences. We would never say science is only
    biology, so why do we act like computer science is only coding?


    The key to computer science—and as a result, coding—is thinking. People express
    their thoughts in language. So it might help to think about coding as a language.
    Although we have language classes, we use languages in all subjects. We teach
    kids to read so they can learn from others, not so they can become professional
    readers. We teach kids to write so they can communicate, even though we know only
    a few will get jobs as writers.


