- fmt: "\nSomething happens in students when they define themselves as makers and\
    \ inventors and creators. They discover powerful skills—problem solving, critical\
    \ thinking, and imagination—that will help them shape the world’s future … our\
    \ future. In *LAUNCH*, John Spencer and A.J. Juliani provide a process that can\
    \ be incorporated into every class at every grade level ... even if you don’t\
    \ consider yourself a “creative teacher.” And if you dare to innovate and view\
    \ creativity as an essential skill, you will empower your students to change the\
    \ world—starting right now.\n\n## ![TMWGA](Images/dbc_TMWGA.jpg)\n\n# Teaching\
    \ Math with Google Apps\n\n### 50 G Suite Activities \n\n#### By Alice Keeler\
    \ and Diana Herrington ([@AliceKeeler](https://twitter.com/AliceKeeler), [@mathdiana](https://twitter.com/mathdiana))\n\
    \nGoogle Apps give teachers the opportunity to interact with students in a more\
    \ meaningful way than ever before, while G Suite empowers students to be creative,\
    \ critical thinkers who collaborate as they explore and learn. In *Teaching Math\
    \ with Google Apps*, educators Alice Keeler and Diana Herrington demonstrate fifty\
    \ different ways to bring math classes into to the twenty-first century with easy-to-use\
    \ technology.\n\n## ![3D-Dunk-Tank](Images/dbc_Dunk-Tank.jpg)\n\n# Escaping the\
    \ School Leader’s Dunk Tank\n\n### How to Prevail When Others Want to See You\
    \ Drown\n\n#### Rebecca Coda and Rick Jetter ([@RebeccaCoda](https://twitter.com/RebeccaCoda),\
    \ [@RickJetter](https://twitter.com/RickJetter))\n\nNo school leader is immune\
    \ to the dunk tank—the effects of discrimination, bad politics, revenge, or ego-driven\
    \ coworkers. In Escaping the School Leader’s Dunk Tank, Rebecca Coda and Rick\
    \ Jetter share real-life stories and insightful research to equip school leaders\
    \ with the practical knowledge and emotional tools necessary to survive and, better\
    \ yet, avoid getting “dunked.”\n\n## ![StartRightNow](Images/dbc_SRN.png)\n\n\
    # Start. Right. Now.\n\n### Teach and Lead for Excellence\n\n#### Todd Whitaker,\
    \ Jeff Zoul, and Jimmy Casas ([@ToddWhitaker](https://twitter.com/ToddWhitaker),\
    \ [@Jeff_Zoul](https://twitter.com/Jeff_Zoul), [@casas_jimmy](https://twitter.com/casas_jimmy))\n\
    \nIn their work leading up to *Start. Right. Now.* Todd Whitaker, Jeff Zoul, and\
    \ Jimmy Casas studied educators from across the nation and discovered four key\
    \ behaviors of excellence: Excellent leaders and teachers Know the Way, Show the\
    \ Way, Go the Way, and Grow Each Day. If you are ready to take the first step\
    \ toward excellence, this motivating book will put you on the right path.\n\n\
    ## ![LeadLikeaPIRATE](Images/dbc_LdLAP.jpg)\n\n# Lead Like a PIRATE\n\n### Make\
    \ School Amazing for Your Students and Staff\n\n#### Shelley Burgess and Beth\
    \ Houf ([@Burgess_Shelley](https://www.twitter.com/Burgess_Shelley), [@BethHouf](https://twitter.com/BethHouf))\n\
    \nIn *Lead Like a PIRATE*, education leaders Shelley Burgess and Beth Houf map\
    \ out the character traits necessary to captain a school or district. You’ll learn\
    \ where to find the treasure that’s already in your classrooms and schools—and\
    \ how to bring out the very best in your educators. This book will equip and encourage\
    \ you to be relentless in your quest to make school amazing for your students,\
    \ staff, parents, and communities.\n\n## ![Table Talk Math](Images/dbc_TTM.jpg)\n\
    \n# Table Talk Math\n\n### A Practical Guide for Bringing Math into Everyday Conversations\n\
    \n#### By John Stevens ([@Jstevens009](https://twitter.com/Jstevens009))\n\nMaking\
    \ math part of families’ everyday conversations is a powerful way to help children\
    \ and teens learn to love math. In *Table Talk Math*, John Stevens offers parents\
    \ (and teachers!) ideas for initiating authentic, math-based conversations that\
    \ will get kids to notice and be curious about all the numbers, patterns, and\
    \ equations in the world around them.\n\n## ![Shift This!](Images/dbc_ST.jpg)\n\
    \n# Shift This!\n\n### How to Implement Gradual Changes for MASSIVE Impact in\
    \ Your Classroom\n\n#### By Joy Kirr\n\nEstablishing a student-led culture that\
    \ isn’t focused on grades and homework but on individual responsibility and personalized\
    \ learning, may seem like a daunting task — especially if you think you have to\
    \ do it all at once. But significant change is possible, sustainable, and even\
    \ easy when it happens little by little. In *Shift This!* educator and speaker\
    \ Joy Kirr explains how to make gradual shifts — in your thinking, teaching, and\
    \ approach to classroom design — that will have a massive impact in your classroom.\
    \ Make the first shift today!\n\n## ![Unmapped Potential](Images/dbc_UP.jpg)\n\
    \n# Unmapped Potential\n\n### An Educator’s Guide to Lasting Change\n\n#### By\
    \ Julie Hasson and Missy Lennard ([@PPrincipals](https://twitter.com/PPrincipals))\n\
    \nNo matter where you are in your educational career, chances are you have, at\
    \ times, felt overwhelmed and overworked. Maybe you feel that way right now. If\
    \ so, you aren’t alone. But the more important news is that things can get better!\
    \ You simply need the right map to guide you. *Unmapped Potential* offers advice\
    \ and practical strategies to help you becoming the kind of educator — you want\
    \ to be.\n\n## ![Shattering the Teacher Myth](Images/dbc_STM.jpg)\n\n# Shattering\
    \ the Teacher Myth\n\n### 6 Truths That Will Help You THRIVE as an Educator\n\n\
    #### By Aaron Hogan ([@aaron_hogan](https://twitter.com/aaron_hogan))\n\nThe idyllic\
    \ myth of the perfect teacher perpetuates unrealistic expectations and set teachers\
    \ up for failure. Author and educator Aaron Hogan is on a mission to shatter the\
    \ myth of the perfect teacher by equipping educators with strategies that help\
    \ them shift out of survival and THRIVE.\n\n## ![Social LEADia](Images/dbc_SL.jpg)\n\
    \n# Social LEADia\n\n### Moving Students from Digital Citizenship to Digital Leadership\n\
    \n#### By Jennifer Casa-Todd ([@JCasaTodd](https://twitter.com/JCasaTodd))\n\n\
    Equipping students for their future begins by helping them become digital leaders\
    \ now. In our networked society, students need to learn how to leverage social\
    \ media to connect to people, passions, and opportunities to grow and make a difference.\
    \ *Social LEADia* offers insight and engaging stories to help you shift the focus\
    \ at school and at home from digital citizenship to digital leadership.\n\n##\
    \ ![Spark Learning](Images/dbc_SPK.jpg)\n\n# Spark Learning\n\n### 3 Keys to Embracing\
    \ the Power of Student Curiosity\n\n#### By Ramsey Musallam ([@ramusallam](https://twitter.com/amusallam))\n\
    \nInspired by his popular TED Talk “3 Rules to Spark Learning,” this book combines\
    \ brain science research, proven teaching methods, and Ramsey’s personal story\
    \ to empower you to improve your students’ learning experiences by inspiring inquiry\
    \ and harnessing its benefits. If you want to engage students in more interesting\
    \ and effective learning, this is the book for you.\n\n## ![Ditch That Homework](Images/dbc_DTH.jpg)\n\
    \n# Ditch That Homework\n\n### Practical Strategies to Help Make Homework Obsolete\n\
    \n#### By Matt Miller and Alice Keeler([@jmattmiller](https://twitter.com/jmattmiller),\
    \ [@alicekeeler](https://twitter.com/alicekeeler))\n\nIn *Ditch That Homework*,\
    \ Matt Miller and Alice Keeler discuss the pros and cons of homework, why teachers\
    \ assign it, and what life could look like without it. As they evaluate the research\
    \ and share parent and teacher insights, the authors offer a convincing case for\
    \ ditching homework and replacing it with more effective and personalized learning\
    \ methods.\n\n## ![The Four O'Clock Faculty](Images/dbc_4OCF.jpg)\n\n# The Four\
    \ O’Clock Faculty\n\n### A Rogue Guide to Revolutionizing Professional Development\n\
    \n#### By Rich Czyz ([@RACzyz](https://twitter.com/RACzyz))\n"
  raw: 'Something happens in students when they define themselves as makers and inventors
    and creators. They discover powerful skills—problem solving, critical thinking,
    and imagination—that will help them shape the world’s future … our future. In
    *LAUNCH*, John Spencer and A.J. Juliani provide a process that can be incorporated
    into every class at every grade level ... even if you don’t consider yourself
    a “creative teacher.” And if you dare to innovate and view creativity as an essential
    skill, you will empower your students to change the world—starting right now.


    ## ![TMWGA](Images/dbc_TMWGA.jpg)


    ## *Teaching Math with Google Apps*


    ### 50 G Suite Activities 


    #### By Alice Keeler and Diana Herrington ([@AliceKeeler](https://twitter.com/AliceKeeler),
    [@mathdiana](https://twitter.com/mathdiana))


    Google Apps give teachers the opportunity to interact with students in a more
    meaningful way than ever before, while G Suite empowers students to be creative,
    critical thinkers who collaborate as they explore and learn. In *Teaching Math
    with Google Apps*, educators Alice Keeler and Diana Herrington demonstrate fifty different
    ways to bring math classes into to the twenty-first century with easy-to-use technology.


    ## ![3D-Dunk-Tank](Images/dbc_Dunk-Tank.jpg)


    ## *Escaping the School Leader’s Dunk Tank*


    ### *How to Prevail When Others Want to See You Drown*


    #### Rebecca Coda and Rick Jetter ([@RebeccaCoda](https://twitter.com/RebeccaCoda), [@RickJetter](https://twitter.com/RickJetter))


    No school leader is immune to the dunk tank—the effects of discrimination, bad
    politics, revenge, or ego-driven coworkers. In Escaping the School Leader’s Dunk
    Tank, Rebecca Coda and Rick Jetter share real-life stories and insightful research
    to equip school leaders with the practical knowledge and emotional tools necessary
    to survive and, better yet, avoid getting “dunked.”


    ## ![StartRightNow](Images/dbc_SRN.png)


    ## *Start. Right. Now.*


    ### *Teach and Lead for Excellence*


    #### Todd Whitaker, Jeff Zoul, and Jimmy Casas ([@ToddWhitaker](https://twitter.com/ToddWhitaker),
    [@Jeff_Zoul](https://twitter.com/Jeff_Zoul), [@casas_jimmy](https://twitter.com/casas_jimmy))


    In their work leading up to *Start. Right. Now.* Todd Whitaker, Jeff Zoul, and
    Jimmy Casas studied educators from across the nation and discovered four key behaviors
    of excellence: Excellent leaders and teachers *Know the Way, Show the Way, **Go
    the Way, and Grow Each Day*. If you are ready to take the first step toward excellence,
    this motivating book will put you on the right path.


    ## ![LeadLikeaPIRATE](Images/dbc_LdLAP.jpg)


    ## *Lead Like a PIRATE*


    ### *Make School Amazing for Your Students and Staff*


    #### Shelley Burgess and Beth Houf ([@Burgess_Shelley](https://www.twitter.com/Burgess_Shelley), [@BethHouf](https://twitter.com/BethHouf))


    In *Lead Like a PIRATE*, education leaders Shelley Burgess and Beth Houf map out
    the character traits necessary to captain a school or district. You’ll learn where
    to find the treasure that’s already in your classrooms and schools—and how to
    bring out the very best in your educators. This book will equip and encourage
    you to be relentless in your quest to make school amazing for your students, staff,
    parents, and communities.


    ## ![Table Talk Math](Images/dbc_TTM.jpg)


    ## ***Table Talk Math***


    ### *A Practical Guide for Bringing Math into Everyday Conversations*


    #### By John Stevens ([@Jstevens009](https://twitter.com/Jstevens009))


    Making math part of families’ everyday conversations is a powerful way to help
    children and teens learn to love math. In *Table Talk Math*, John Stevens offers
    parents (and teachers!) ideas for initiating authentic, math-based conversations
    that will get kids to notice and be curious about all the numbers, patterns, and
    equations in the world around them.


    ## ![Shift This!](Images/dbc_ST.jpg)


    ## ***Shift This!***


    ### *How to Implement Gradual Changes for MASSIVE Impact in Your Classroom*


    #### By Joy Kirr


    Establishing a student-led culture that isn’t focused on grades and homework but
    on individual responsibility and personalized learning, may seem like a daunting
    task — especially if you think you have to do it all at once. But significant
    change is possible, sustainable, and even easy when it happens little by little.
    In *Shift This!* educator and speaker Joy Kirr explains how to make gradual shifts
    — in your thinking, teaching, and approach to classroom design — that will have
    a massive impact in your classroom. Make the first shift today!


    ## ![Unmapped Potential](Images/dbc_UP.jpg)


    ## ***Unmapped Potential***


    ### *An Educator’s Guide to Lasting Change*


    #### By Julie Hasson and Missy Lennard ([@PPrincipals](https://twitter.com/PPrincipals))


    No matter where you are in your educational career, chances are you have, at times,
    felt overwhelmed and overworked. Maybe you feel that way right now. If so, you
    aren’t alone. But the more important news is that things can get better! You simply
    need the right map to guide you from frustrated to fulfilled. *Unmapped Potential*
    offers advice and practical strategies to help you find your unique path to becoming
    the kind of educator — the kind of person — you want to be.


    ## ![Shattering the Perfect Teacher Myth](Images/dbc_STPTM.jpg)


    ## ***Shattering the Perfect Teacher Myth***


    ### *6 Truths That Will Help You THRIVE as an Educator*


    #### By Aaron Hogan ([@aaron_hogan](https://twitter.com/aaron_hogan))


    The idyllic myth of the perfect teacher perpetuates unrealistic expectations that
    erode self-confidence and set teachers up for failure. Author and educator Aaron
    Hogan is on a mission to shatter the myth of the perfect teacher by equipping
    educators with strategies that help them shift out of survival mode and THRIVE.


    ## ![Social LEADia](Images/dbc_SL.jpg)


    ## ***Social LEADia***


    ### *Moving Students from Digital Citizenship to Digital Leadership*


    #### By Jennifer Casa-Todd ([@JCasaTodd](https://twitter.com/JCasaTodd))


    Equipping students for their future begins by helping them become digital leaders
    now. In our networked society, students need to learn how to leverage social media
    to connect to people, passions, and opportunities to grow and make a difference.
    *Social LEADia* offers insight and engaging stories to help you shift the focus
    at school and at home from digital citizenship to *digital leadership.*


    ## ![Spark Learning](Images/dbc_SPK.jpg)


    ## ***Spark Learning***


    ### *3 Keys to Embracing the Power of Student Curiosity*


    #### By Ramsey Musallam ([@ramusallam](https://twitter.com/ramusallam))


    Inspired by his popular TED Talk “3 Rules to Spark Learning,” this book combines
    brain science research, proven teaching methods, and Ramsey’s personal story to
    empower you to improve your students’ learning experiences by inspiring inquiry
    and harnessing its benefits. If you want to engage students in more interesting
    and effective learning, this is the book for you.


    ## ![Ditch That Homework](Images/dbc_DTH.jpg)


    ## ***Ditch That Homework***


    ### *Practical Strategies to Help Make Homework Obsolete*


    #### By Matt Miller and Alice Keeler([@jmattmiller](https://twitter.com/jmattmiller),
    [@alicekeeler](https://twitter.com/alicekeeler))


    In *Ditch That Homework*, Matt Miller and Alice Keeler discuss the pros and cons
    of homework, why teachers assign it, and what life could look like without it.
    As they evaluate the research and share parent and teacher insights, the authors
    offer a convincing case for ditching homework and replacing it with more effective
    and personalized learning methods.


    ## ![The Four O''Clock Faculty](Images/dbc_4OCF.jpg)


    ## ***The Four O’Clock Faculty***


    ### *A Rogue Guide to Revolutionizing Professional Development*


    #### By Rich Czyz ([@RACzyz](https://twitter.com/RACzyz))'
