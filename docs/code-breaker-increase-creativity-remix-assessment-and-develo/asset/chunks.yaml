  trans: "\n我的目标始终是让他们通过这个过程构建他们自己的概率知识。现实中，这节课把教室变成了一个嘈杂的丛林，纸张在教室里飞舞。学生们假装在意，但并没有投入到活动中。直到一个学生提出编写一个`coin-flipping\
    \ simulator`的想法，我的心态才发生了转变。我把任务交给了他，告诉他如果能办成，他就会成为一个超级明星。\n\n在接下来的几天里，他大部分数学课时间都在忙我们今天所说的“激情项目”。他的父母报告说他在家里也在做这个项目。但直到他和朋友们在当天上课前来到学校展示最终项目时，我才意识到他对这个项目有多投入。他向我保证模拟器可以运行，我问他想用它做什么。\n\
    \n![CB-coin-flipper](img/CB-coin-flipper.png)\n\n“让我们把硬币抛掷百万次吧，”他用一种坏坏的语气说道。\n\
    \n“好，好，”我用同样黑暗的语气回答道，“就这么。”\n\n我把`SMARTBoard`电脑留给了他的模拟器，我们开始观察它的运行。这个故事最显著的地方在于，这些男孩对一项数学作业竟然如此投入。他们一有机会就偷看一眼。他们在休息时间留在教室，甚至在放学后留下来。遗憾的是，他的硬币抛掷器到一天结束时只完成了大约`700,000`次抛掷。但结果在小数点后第九位都是五五开的。我惊讶地看着他们，开始解释`Law\
    \ of Large Numbers`。\n\n我的解释是多的。\n\n“行了行了，我们懂，”他们说着就回家了。\n\n## 代数与我的世界\n我们通常通过站在教室面前并在屏幕上投影图像来教授代数中的增长模式。我们利用图像来帮助讨论方程。\n\
    \n![CB-growing-block-pattern](img/CB-growing-block-pattern.png)\n\n从传统意义上说，我希望学生能用语言解释这种模式是如何增长的。`Figure\
    \ 1`有五个瓷砖。`Figure 2`有九块。`Figure 3`有十三块。使用这些数据，我们可以创建一个代数方程来确定每个图中有多少块瓷砖。\n\n|\
    \ 项数 | 项值 |\n| :--- | :--- |\n| 1 | 5 |\n| 2 | 9 |\n| 3 | 13 |\n\n### 模式规则：4n\
    \ + 1\n问题在于：我旧式的教学法试图强迫学生像我一样看到这种增长模式。事实上，如果他们没有创建这个取值表，我会把他们的作业判为错误。\n\n直到一个学生建议每个图实际上是一个金字塔而不是平面的，我才改变了想法。当我的受到震撼时，你能听到大脑细胞发生移动的声音。然后，那个学生建议他使用`Minecraft`按照他所看到的方式来构建这个增长模式。我立刻感到羞愧。这种模式可以以无限种方式扩展。如果学生的看法和我的不同，那没关系。我觉得，由于没有让学生通过不同的视角向我展示这个概念，我似乎辜负了之前的学生。\n\
    \n![CB-minecraft](img/CB-minecraft.png)\n\n这个概念也帮助我以更深层的方式教授了空间感。我问那个学生中间的立方体是否还是金字塔中的常量，就像在平面图像中那样。我本应该预料到发生什么的。\n\
    \n我立刻冲回家，希望改变第二天的计划。我很快意识到，所有学习者都应该有机会按照自己的意愿设计、构建和扩展增长模式——只要他们能生成取值表和代数方程即可。我们花了大约一周时间设计了`Minecraft`游戏，孩子们在游戏中建造包含不同增长模式的城堡。玩家在进入下一个房间之前必须解决增长模式并找到正确的符号。迷宫般的场景让所有学生都能学习，因为它们自然就是为教学支架和差异化学习而设计的。\n\
    \n## 科学\n故事中真正的老师是我的八级学生。作为一名科学老师，我一直喜欢教授`particle theory`。诚然，我并不总是用最有趣的方式来处理这个话题。我以前让学生记忆这些标准。我确定你们中的某些人可以跟我一起说：\n\
    \n- 粒子之间有间隙。\n- 粒子之间互相吸引。\n- 粒子始终在运动。\n- 粒子在加热时会加速并分散。\n\n这些都是些很常规的内容。但有一天，我见证了一个学生经历了我见过的最完美的“顿悟”时刻。当我们查看教科书时，我提到了那些波浪线，并暗示这意味着运动。我永远不会忘记接下来发生的事情。\n\
    \n“你是说那些粒子在动吗？”后排一个男生大喊道。\n\n这一次，我又感到羞愧。多年来，我一直在误读`particle theory`，因为我假设孩子们知道教科书上的波浪线意味着粒子在运动。并不是的。我再次被提醒，孩子们看待世界的方式往往不同。\n\
    \n我让他编写代码来表示`particle theory`，而不是记忆一个列表。我希望他通过编码过程的结果来学习这个列表。\n\n毕竟，如果他能模拟出受热后加速并分散的运动粒子，我们就大成功了。\n\
    \n我之前提到过`Scratch`如何利用几何原理工作，它如何帮助连接一个学科内的各个侧领域。它对于展示完全不同的学科之间如何相互关联非常有帮助。\n\n\
    考虑这个学生的模拟器。学生通过使用随机坐标在`Cartesian grid`上绘制点来移动粒子（科学）。\n\n这才是跨学科的典范！\n\n## 语言艺术\n\
    条件语句，也称为`Boolean logic`，是计算机科学的基础组成部分。它们也是我们编写过程的重要部分。这里是在小学课堂教授条件语句的一种好方法。\n\n\
    ### 刷牙的“传统”过程\n- 拿上你的牙刷。\n- 拿上牙膏并在刷子上挤上小的一点。\n- 将牙刷倾斜 45 度角反复刷刷，从大磨牙开始。\n- 对所有其他牙齿重复第三步。\n\
    - 打开水龙头。\n- 用杯子接水。\n- 关闭水龙头。\n- 喝水。在口中漱水。\n- 吐掉牙膏。\n- 清洁洗手池\n\n将这个过程取出来并将其拆分为模块。每个模块都是一个独立的小程序，你可以据此对小组进行脚架式教学。这里的目标是全班编写刷牙的算法。每个小组提供一个教学模块。每个模块都依赖于其他模块才能运行。\n\
    \n为了进一步挑战学生并教他们公平性，可以问一个额外的问题：“如果没有牙膏怎么办？”（在某人写出如何刷牙的过程之前，需要很多条件。其中之一就是牙膏。）\n\n\
    ```\nIf (HaveToothpaste) -> BrushTeeth()\n// BrushTeeth 是一个模块\nElse (GetToothpaste)\n\
    // GetToothpaste 是一个模块\n```\n\n这个示例需要两个不同的模块或过程。扩展它们看起来像这样：\n\n```\nGetToothpaste(\n\
    \  if(HaveNeighbors) -> GoToNeighborsHouse()\n  // 另一个模块或过程\n  else(\n    if(HaveVehicle)\
    \ -> DriveToStore()\n    // 另一个模块或过程\n  )\n)\n```\n\n某些模块比其他模块更容易编写。起初用算法思维可能会困难，但做得越多，它就会变得越自然。例如，流行的棋类游戏《富翁》充满了算法。\n\
    \n```monopoly\nif (PassGo) -> Collect $200\nif (InJail)\n  if(RollDoubles) ->\
    \ GetOutOfJail\n  else(StayInJail)\n```\n"
