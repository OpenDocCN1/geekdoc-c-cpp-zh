    ![](img/code-breaker-cover.jpg)


    # 对《破译者》（Code Breaker）的赞誉


    “Brian Aspinall 为编程注入了人性的色彩，帮助读者理解——`它`不仅仅是为电脑极客设计的，还可以以有意义的方式在所有年级中实施，帮助我们以不同的方式看待世界。”


    ** — George Couros，《创新者思维》作者 **


    “Brian Aspinall 通过各种实用的案例，充满激情地为在所有课堂中推广编程和计算思维辩护其必要性。这不仅关乎编写几行代码或放置代码块，更关乎让学生使用
    `Scratch` 和 `Minecraft` 等现代工具，以新颖且有趣的方式思考课程。这本书是写给每一个曾问过‘我为什么要关心编程？’的人的。在读完那个关于‘拉便的宝宝’的故事后，你将明白原因了！”


    ** — Matthew Oldridge，演讲者、作家及数学教育工作者**


    “对于任何希望将编程深度融入课程、而不仅仅局限于[#编程小时](https://twitter.com/hashtag/HourofCode)的人来说，这本书都是必读之作。Brian
    不仅对我们如何在课堂上看待编程提供了独特的视角，还分享了关于如何在学习中创新使用编程的深刻见解，这种创新超越了学术上的成功或帮助学生为‘找工作’做准备。书中巧妙地穿插了富有创意的课程，这是一本将激发并引导任何渴望为课堂学习注入更多创造力的人的书。”


    ** — Michael Cohen，演讲者、创新顾问及《设计驱动教育》（Educated by Design）作者 **


    “Brian Aspinall 创建了一项宝贵的资源，它不仅能帮助教育者加深对计算机编程的理解，还证明了所有教育者如何利用计算思维的概念来塑造他们的教学法和教学实践，从而促进学生的学习。”


    ** — Laura Fleming，图书馆媒体专家，《创造世界》作者 **


    “对于任何想了解更多关于在课堂教学编程的原理以及如何开始的老师来说，这本书是必读的。通过教学计划案示例和他与学生的个人故事，Brian Aspinall 详细解析了如何在数学、几何、代数、科学和语言艺术等许多学科领域中使用编程原则。我特别喜欢他采访其他课堂教师的章节，他们成功地教授了幼儿园年纪的学生编程！多年来，我一直佩服
    Brian 的能力和决心，他能够说服老师们编程在任何课程中的重要性。阅读他的教学历程、那些影响他的人，以及他对今天课堂应 true true，是一是一种享受。”


    ** — Sylvia Duckworth，演讲者、技术教练及《教育者速记》（Sketchnotes for Educators）作者 **


    “当我想到课堂编程时，脑海中浮出的第一个名字就是 Brian Aspinall。这本小书是你可以与他人分享的绝佳工具！技巧、故事以及更多内容让这本书不容错过！”


    ** — Todd Nesloney，获奖教育工作者，《孩子值得》（Kids Deserve It）合著者 **


    “老师们渴望在课堂上开始学习编程，而这是一份完美的快速简易的指南！Aspinall 为我们介绍了创客教育的基础理论，并引导读者学习了有电脑和无电脑的入门编程课程。”


    ** — Colleen Graves，《创客空间项目大书》和《为邪恶天才天才准备的 20 个 Makey-Makey 项目》合著者 **


    “Brian Aspinall 是一位典范的计算机科学老师，也是全球计算机科学界受重视的成员。在编程，尤其是关于编程周围的教学法方面，我一直认为 Brian
    是我的首选专家。Brian 的书《破译者》为任何对教学编程、已经在教编程，或者广义上对教学感兴趣的人提供了一个非常有价值的背景。这本书探讨了更重要的问题‘为什么要编程？’，而不仅仅是作为另一本关于如何编程的书。我承认我不是个老读者，但
    Aspinall 的书读起来非常简单且引人入胜。当你深入 Brian 的教学哲学时，那些引人入胜的部分会完全符合逻辑。在书中，Brian 创造了‘课堂参与度’一词（与课堂管理相比），这种为学生创造真正投入的环境的理念是全书的核心。深入读读，你将窥见
    Aspinall 如何对教学产生兴趣的，以及他在教学和学习方面演进的方法。这本书通过他对话式的语调和幽默的叙述，让读者感觉自己与 Brian 一行在旅程中。我的意思是，这本书是从一个学生对便便的痴迷导致他精通几何和编程的故事开始的。”


    “我已经关注 Brian 有一段时间了，并非常喜欢他的作品。我很高兴能视他为同事、榜样和朋友。Brian 一直平易近人，并愿意就与他的（以及我的）激情相关的讨论进行交流。他的书为他的教学方法以及作为一名优秀教育者的演变提供了完美的概述，这并不意外。这本书充满启发性，就像作者一样。他的热情从纸面上溢出来，当你阅读时，你会感到自己作为老师和学生正在发生转变。Brian
    的编程世界观带我们离开了许多人对编程的分析性的、机器人式的思考，进入了为什么编程和问题解决在教育中如此重要的人性、逻辑层面。赞感谢 Brian 让他通过写作展现了真实的自我。无论你对编程感兴趣，还是仅仅对教学法以及让学生参与学习过程的观点感兴趣，这都是一本必读之作。”


    ** — Steven Isaacs，老师、Minecraft 导师及 Minefaire 制作， **


    # 破译者 (Code Breaker)


    ## 增加创造力，重塑评估，培养一班编程忍者！


    ### Brian Aspinall


