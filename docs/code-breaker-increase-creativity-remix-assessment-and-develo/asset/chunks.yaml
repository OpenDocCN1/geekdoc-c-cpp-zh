    ### *Empower Learning, Unleash Talent, and Lead a Culture of Creativity*


    #### By George Couros ([@gcouros](https://twitter.com/gcouros))


    The traditional system of education requires students to hold their questions
    and compliantly stick to the scheduled curriculum. But our job as educators is
    to provide new and better opportunities for our students. It’s time to recognize
    that compliance doesn’t foster innovation, encourage critical thinking, or inspire
    creativity — and those are the skills our students need to succeed. In *The Innovator’s
    Mindset*, George Couros encourages teachers and administrators to empower their
    learners to wonder, to explore — and to become forward-thinking leaders.


    ## ![50 Things You Can Do with Google Classroom](Images/dbc_50TGCU.jpg)


    ## ***50 Things You Can Do with Google Classroom***


    #### By Alice Keeler and Libbi Miller ([@AliceKeeler](https://twitter.com/AliceKeeler),
    [@MillerLibbi](https://twitter.com/MillerLibbi))'
  toc: []
  trans: '


    Yin, Yue, Judith Olson, Melfried Olson, Hannah Solvin, and Paul R. Brandon. 2015.
    “比较网络化数学课堂中使用形成性评估的两种版本的教师专业发展。” *教育技术研究期刊*, 47 (1): 41–70. 检索自 [`search.proquest.com/docview/1646385125?accountid=15115`](http://search.proquest.com/docview/1646385125?accountid=15115)。


    # 更多内容


    ![DBC 标志](img/dbc-logo.png)


    ![海盗教学](img/dbc_TLAP.jpg)


    ## 像海盗一样教学


    ### 提高学生参与度，激发创造力并改变你的教育工作生活


    #### 作者 Dave Burgess ([@BurgessDave](https://twitter.com/BurgessDave))


    *像海盗一样教学*是一部《纽约时报》畅登畅销书，它引发了一场全球性的教育革命。它既是一份点燃职业激情的启发性宣言，又是一份实用的路线图，充满了能够显著提高学生参与度的动态策略。该书已被翻译成多种语言，其核心理念与那些渴望设计极具创意的课程并将学校转变为改变学生生活的体验的教育工作者产生了共鸣。


    ![像海盗一样学习](img/dbc_LLAP.jpg)


    ## 像海盗一样学习


    ### 赋能学生协作、领导并取得成功


    #### 作者 Paul Solarz ([@PaulSolarz](https://twitter.com/PaulSolarz))


    如今的职场市场要求学生准备好为自己的生活和职业负责。如果我们只教他们如何获得及格分数，而不让他们具备掌握自己教育的能力，那就是对他们不负责。在*像海盗一样学习*中，Paul
    Solarz 解释了如何设计课堂体验，鼓励学生在一个充满刺激、激励和支持的环境中承担风险并探索热情，在这个环境中重点是进步而非成绩。发现学生主导的课堂如何帮助学生茁壮成长，并发展为自主、自信且能够独立做出明智负责决策的公民。


    ![P 代表海盗](img/dbc_PIFP.jpg)


    ## P 代表海盗


    ### 给教育工作者的启发性 ABC


    #### 作者 Dave and Shelley Burgess ([@Burgess_Shelley](https://twitter.com/Burgess_Shelley))


    教学是一场延伸想象力并每天都需要创造力的冒险！在*P 代表海盗*中，夫妻夫妇 Dave 和 Shelley Burgess 鼓励并启发教育工作者让他们的课堂变成有趣且令人兴奋的学习场所。他们通过利用多年的个人经验并吸纳
    70 多位教育工作者的见解，作者提供了丰富的想法，让学习和教学比以往任何时候都更加充实。


    ![像海盗一样游戏](img/dbc_PLAP.jpg)


    ## 像海盗一样游戏


    ### 使用玩具、游戏和漫画吸引学生


    #### 作者 Quinn Rollins ([@jedikermit](https://twitter.com/jedikermit))


    是的！学校可以同时具有趣味性和教育性。在*像海盗一样游戏*中，Quinn Rollins 提供了实用且引人入胜的策略和资源，让你轻松地将趣味融入课程中。无论你教的是哪个年级，你都能找到灵感和创意，帮助你以令人难忘的方式吸引学生。


    ![像海盗一样探索](img/dbc_ELAP.jpg)


    ## 像海盗一样探索


    ### 通过游戏化和游戏灵感课程设计来参与、丰富并提升你的学习者


    #### 作者 Michael Matera ([@MrMatera](https://twitter.com/MrMatera))


    你准备好将你的教室变成一个在协作和创造中蓬勃发展的世界了吗？那么，跟随课堂游戏设计师兼教育家 Michael Matera 一起启航吧，探索基于游戏的学习的可能性和力量。在*像海盗一样探索*中，Matera
    将担任经验丰富的导师，帮助你将游戏中最具激励性的技巧应用到课堂。你将学习与现有课程兼容并增强（而非取代）的游戏化策略，并发现这些迷人的方法如何应用于任何年级或学科。


    ![纯粹天才](img/dbc_PG.jpg)


    ## 纯粹天才


    ### 构建创新文化并将“20%时间计划”推向新高度


    #### 作者 Don Wettrick ([@DonWettrick](https://twitter.com/DonWettrick))


    长期以来，学校一直是无聊的堡垒、创造力的杀手，并且过度习惯于服从和从众。在*纯粹天才*中，Don Wettrick 解释了协作——与专家、学生和其他教育工作者的合作——如何帮助你创造有趣的、甚至是改变生活的学习机会。Wettrick
    的书为教育工作者提供了灵感并配备了一套在任何学校教授创新的系统蓝图。


    ![禅意教师](img/dbc_TZT.jpg)


    ## 禅意教师


    ### 在教室中创造专注、简单与平静


    #### 作者 Dan Tricarico ([@TheZenTeacher](https://twitter.com/TheZenTeacher))


    老师拥有影响甚至改善未来的巨大力量。在*禅意教师*中，教育家、博主和演讲者 Dan Tricarico 提供了实用、易用的技巧，帮助老师处于最佳状态——不匆忙且全神贯注——以便他们最大化表现并提高生活质量。在这个入门指南中，Dan
    Tricarico 解释了什么是禅修——这与宗教无关，与你茁壮成的能力有关。


    ![给教育工作者的 140 个 Twitter 技巧](img/dbc_140TT.jpg)


    ## 给教育工作者的 140 个 Twitter 技巧


    ### 建立联系，扩展你的专业网络并重振你的职业


    #### 作者 Brad Currie, Billy Krakower 和 Scott Rocco ([@bradmcurrie](https://twitter.com/bradmcurrie),
    [@wkrakower](https://twitter.com/wkrakower), [@ScottRRocco](https://twitter.com/ScottRRocco))


    无论你对教育或如何让工作做得更好有任何疑问，你都能在 Twitter 上找到想法、资源以及一个准备好帮助你的活跃专业人士网络。在*给教育工作者的 140 个
    Twitter 技巧*中，Evolving Educators 的主持人持人和创始人 Brad Currie、Billy Krakower 和 Scott
    Rocco 提供了分步说明，帮助你掌握 Twitter 基础，建立在线粉丝并成为 Twitter 巨星。


    ![创新者思维](img/dbc_TIM.jpg)


    ## 创新者思维


    ### 赋能学习，释放人才并领导创意文化


    #### 作者 George Couros ([@gcouros](https://twitter.com/gcouros))


    传统的教育体系要求学生压抑问题并顺从地遵循既定课程。但我们作为教育工作者的工作是为学生提供新的、更好的机会。现在是承认，服从不能培养创新、鼓励批判性思维或激发创造力了——而这些正是学生成功所需的技能。在*创新者思维*中，George
    Couros 鼓励教师和行政人员赋能学习者去好奇、探索并成为前瞻性的领导者。


    ![Google Classroom 可以做的 50 种事](img/dbc_50TGCU.jpg)


    ## Google Classroom 可以做的 50 种事


    #### 作者 Alice Keeler 和 Libbi Miller ([@AliceKeeler](https://twitter.com/AliceKeeler),
    [@MillerLibbi](https://twitter.com/MillerLibbi))


