    例如，我们经常用学生快速记忆事实的能力来衡量知识。在这种观点下，更好的学生是那些能快速检索信息的学生。在这种观点下，一个好的数学学生不仅仅是背了所有乘法表的人。一个好的学生是能够非常、非常快地给出所有正确答案的人。速度是他们脱颖出的关键。


