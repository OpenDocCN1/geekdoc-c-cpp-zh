  trans: '


    在一次类似于 P.A. Day 教育营的会议后，我决定和我的班级一起尝试编程。在这次会议上，我们让学校的学生来教我们如何编程，并讨论了“编程小时”（`Hour
    of Code`）的想法。我完全不知道编程到底是什么，所以我认为最好还是花点时间学习一下。我们从 `Hopscotch` 开始，因为它可以在平板电脑上使用，而且适合该年龄段。


    ### 结果你观察到了什么？


    第一次尝试 `Hopscotch` 时，我给了学生有机会自己或与伙伴一起探索并解决问题。第二次使用 `Hopscotch` 时，有些学生已经变成了“专家”。我注意到学生们会分享他们的学习经验，进行协作，并尝试共同解决问题。许多学生把这个应用安装在自己的设备上，并在家里和学校观看
    YouTube 视频来帮助他们创建新的代码。


    ### 你让学生编写应用程序来绘制 3D 数学形状。能谈谈这吗？


    我们从创建 2D 形状开始。我们对于在创建代码时了解角度度数和边数的重要性进行了非常深入的讨论。我们还注意到在创建某些形状时会出现一种模式，通过创建循环可以减少代码量。在掌握了
    2D 形状后，我挑战他们尝试创建 3D 形状。理当然，他们令我惊叹。他们通合作解决问题，并在这一挑战中坚持不懈。数学讨论和协作是不可思议的。有些学生甚至想到了拿出量角来帮助处理角度。我们发现创建
    3D 形状有不同的方法、不同的代码和策略。我非常喜欢他们意识到解决问题的方法远不止一种时！


    ### 你预见你的学生会将此应用到何种程度？


    我想下一步将是尝试通过 Twitter 寻找其他使用 `Hopscotch` 的班级，这样我们就可以互相分享和挑战。我还在想，我们可以尝试使用 `Hopscotch`
    来制作翻译。我还想让他们在下一步使用 `Scratch`，在那里他们可以学习制作应用。他们掌握概念的速度非常快。这非常令人兴奋。


    ### 最后，关于这个项目和学习方法，还有什么想让我们知道的其他信息吗？


    我认为我从这次经历中中学的最重要的事情之一是：在数学中使用技术可以帮助平衡学术竞争环境。我的教室里有 10 名拥有 `IEPs`（个人化教育计划）的学生，通过使用这种技术，你无法识别出谁在数学方面需要特殊照顾。这种编程体验也为那些以前由于某种原因不分享想法或意见的学生提供了发声的机会。它赋予了他们力量。这次冒险对我学生和我自己来说都是是一次极佳的学习经历。我很享受和他们一起成为学生。对于任何考虑过和学生一起尝试编程的人，我的建议是：“不要想，尽管去做！”放弃控制的欲望，拥抱成为共同学习者的机会。


    Val 的故事证明了任何人、任何年龄的人都可以学习编程。它还提到一个我们在讨论 21 世纪学习时经常谈的话题——公平和学生声音。公平意味着每个人都得到他们需要的——而不是意味着每个人都得到相同的东西。这对于学生来说可能是一个很难理解的概念；他们通常知道自己与别人不同。Val
    的学生在数学上需要不同的支持来学习内容。个人化教育计划可能很有用，但系统有时会让所有学生都难以感到被包容。编程让所有学生共同参与。它帮助每个人都有了说话的工具，让他们的声音被听到。


    ![line](img/line.png)


    ### 特色文章


    #### 使用 Twine 编写非线性故事


    ![QR-Coding-Non-Linear-Stories-with-Twine](img/QR-Coding-Non-Linear-Stories-with-Twine.png)


    ###### [`brianaspinall.com/coding-non-linear-stories-with-twinethreads`](http://brianaspinall.com/coding-non-linear-stories-with-twinethreads)


    ![line](img/line.png)


    ## 五岁孩子的无技术编程


    我不仅从自己的同事那里学习教学。我有幸听取了来自世界各地教育者的见解。


    在上一章节中，我讨论了如何利用编程概念，让学生通过互相“编码”来教他们位置知识。这里有一个教师如何将类似概念应用于教幼儿语言的例子。


    Melissa Dann ([@meld70](https://twitter.com/meld70)) 是澳大利亚墨尔本的一位学备班老师，她已经开始和她五岁的学生一起探索编程概念。她给我发了一封邮件，反思她的教学实践。在得到她的许可后，我将其完整地复制在下面：


    你好，Brian，


    这是关于我的教室里教五岁孩子编程的简要概述。（顺便提醒一下，我们已经在学校待十二周了——太不可议了！）


    **游戏：机器人与程序员**


    孩子们成对工作。一个孩子是机器人，另一个孩子是程序员。


    语言发展是这项活动的重要部分。程序员可以要求机器人行走、转身、跳跃、蹦跳等。程序员不能要求他们的机器人做任何危险的事情。程序员必须说“请”，否则机器人将不会反应。这类似于“西蒙说”（Simon
    Says）游戏，除非命令前面有“西蒙说”，否则孩子们不会做出反应，而说“请”只是良好的礼貌。


    ```

    程序员：走 10 步。

    机器人：你没有说“机器人，请”。

    程序员：请走 10 步。

    机器人：1，2...10。

    程序员：请转一分之一。

    机器人：哪个方向？

    程序员：（使用旋转盘，转旋转盘）那边，右边。（指向右边）

    机器人：请转一圈。

    程序员：请向后走 4 步。

    机器人：1,2,3,4

    程序员：请走 5 加 3 步。

    机器人：那是几步？（程序员和机器人用手指数数，5 加 3。）

    ```


    在第一次玩这个游戏后，很明显我们需要一种方法来决定转身的幅度，例如`¼转`、`½转`。因此我们制作了带有四分之一、二分之一和全圈转的旋转盘，这显示了左和右。这仍然是一个困难的概念，但我正在坚持。我们还在周五开始使用
    `Bee-Bot`，旋转盘非常有帮助，因为每次按下 `Bee-Bot` 上的转向按钮都是四分之一。


    我们还在操场上玩过，这导致了更多位置语言的使用。


    观察孩子对子之间的互动很有趣。就像所有活动一样，有些小组非常专注，有些则不然。有一组非常调皮，直到孩子们交换角色，他们才变得专注得多。其中一个先当程序员的孩子发现当程序员很难，无法思考出要求伙伴做的事情；因此注意力不集中。但当他们交换角色后，他们非常喜欢当机器人。


