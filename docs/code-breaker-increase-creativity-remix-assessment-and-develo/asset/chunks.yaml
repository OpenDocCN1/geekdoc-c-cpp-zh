  raw: "I decided to try coding with my class after one of our P.A. Day Ed Camp–style\
    \ meetings. At this meeting we had students from our school teach us about coding,\
    \ and we discussed the idea of Hour of Code. I had no idea what coding really\
    \ was, so I thought I’d better invest some time and learn. We started with Hopscotch\
    \ because you are able to use it on a tablet, and it is age appropriate.\n\n###\
    \ ***What have you noticed as a result?***\n\nThe first day we tried Hopscotch,\
    \ I gave the students the opportunity to explore and problem solve on their own\
    \ or with a partner. The second time we used Hopscotch, some students were already\
    \ becoming “experts.” I noticed that the students would share their learning and\
    \ collaborate and try to problem solve together. Many students put the app on\
    \ their own devices, and they watched YouTube videos at home and at school to\
    \ help them create new codes.\n\n### ***You had students code applications to\
    \ draw 3D math shapes. Can you tell me about this?***\n\nWe started out by creating\
    \ 2D shapes. We had great discussions about the importance of knowing the angle\
    \ degrees and the number of sides when creating the code. We also noticed a pattern\
    \ that happens when creating some of the shapes, and that you can reduce the amount\
    \ of coding by creating loops. After mastering the 2D shapes, I challenged them\
    \ to try to create 3D shapes. They amazed me, of course. They worked together\
    \ to problem solve and persevere through this challenge. The mathematical discussions\
    \ and collaboration were incredible. Some students even thought to bring out a\
    \ protractor to help with the angles. We noticed that there were different ways\
    \ to create 3D shapes, different codes and strategies. I love when they realize\
    \ that there is more than one way to solve a problem!\n\n### ***Where do you see\
    \ your students taking this?***\n\nI think the next step will be to try to find\
    \ other classes through Twitter that use Hopscotch, so we can share and challenge\
    \ each other. I was also thinking that we could try to use Hopscotch to make translations.\
    \ I would also like to get them to use Scratch as a next step, where they can\
    \ learn to make apps. They seem to be picking up the concepts so fast. It is very\
    \ exciting.\n\n### ***Finally, is there any other information you’d like us to\
    \ know about this project and approach to learning?***\n\nI think one of the most\
    \ important things that I have learned from this experience is that using technology\
    \ with math helps to even out the academic playing field. I have 10 students that\
    \ have IEPs (Individual Education Plans) in my classroom, and with the use of\
    \ this technology, you are not able to pick out who needs accommodations in math.\
    \ This coding experience also gives voices to students who previously, for one\
    \ reason or another, did not share their thoughts or opinions. It has empowered\
    \ them. This adventure has been a great learning experience for my students and\
    \ myself. I enjoyed being a student right along with them. For anyone who is thinking\
    \ about trying coding with their students, my advice would be, “Don’t think; just\
    \ do!” Let go of wanting to be in control and embrace the opportunity to be a\
    \ co-learner.\n\nVal’s story demonstrates how anyone, at any age, can learn coding.\
    \ It also brings up something we talk about a lot when we talk about twenty-first-century\
    \ learning—equity and student voice. Equity means that everyone gets what they\
    \ need—not that everyone necessarily gets the same thing. That can be a difficult\
    \ concept for students to understand; they often know if they’re different. Val\
    \ had students who needed different supports in math to learn the content. Individualized\
    \ Education Plans can be useful, but the system can sometimes make it hard for\
    \ all students to feel included. Coding allowed all students to participate together.\
    \ It helped give everyone a tool to speak and let their voices be heard.\n\n![line](Images/line.png)\n\
    \n### Featured Post\n\n#### Coding Non-Linear Stories with Twine\n\n![QR-Coding-Non-Linear-Stories-with-Twine](Images/QR-Coding-Non-Linear-Stories-with-Twine.png)\n\
    \n###### [http://brianaspinall.com/coding-non-linear-stories-with-twinethreads](http://brianaspinall.com/coding-non-linear-stories-with-twinethreads)\n\
    \n![line](Images/line.png)\n\n## **Five-Year-Olds Coding Without Technology**\n\
    \nI haven’t just learned about teaching from my own colleagues. I have also had\
    \ the privilege to hear from educators around the world.\n\nIn the previous chapter,\
    \ I talked about how you can use coding concepts to teach your students about\
    \ location by having them “code” each other. Here’s an example of how a teacher\
    \ applied a similar concept to teaching young students about language.\n\nMelissa\
    \ Dann ([@meld70](https://twitter.com/meld70)) is a prep teacher in Melbourne,\
    \ Australia, who has begun exploring the concepts of coding with her five-year-old\
    \ students. She sent me an email reflecting on her practice. I’ve copied it in\
    \ full below, with her permission:\n\nHi Brian,\n\nHere is a quick overview of\
    \ what’s been happening in my classroom teaching coding to five-year-olds. (Just\
    \ a reminder that we have been at school for twelve weeks—it’s amazing!)\n\n**Game:\
    \ Robots and Programmers**\n\nChildren work in pairs. One child is the Robot.\
    \ The other is the Programmer.\n\nLanguage development is an important part of\
    \ the activity. Programmers can ask Robots to take steps, turn, jump, hop, etc.\
    \ Programmers cannot ask their Robots to do anything dangerous. Programmers must\
    \ say “please” or the Robot will not respond. This is similar to the game Simon\
    \ Says, where the children don’t respond unless the command is prefaced with “Simon\
    \ says,” and saying “please” is just good manners.\n\nI kept it to a maximum of\
    \ 10 steps as the children were keen to ask their robot to take 100 or even 1,000\
    \ steps. We realized—by counting how many steps it took to cross the room—that\
    \ 10 was about the right amount for the size of our room. Also, I place a big\
    \ emphasis on counting accurately. Some of these children cannot count accurately\
    \ to 20 yet, and if they can, some don’t have 1-to-1 correspondence to 20\\. For\
    \ the children who are very capable, they can ask their robot to move 5 plus 5\
    \ steps, or 2 less than 8 steps, double 2 steps, etc. The children have to be\
    \ able to work the answer out before the Robot can move.\n\n> Programmer: Take\
    \ 10 steps.\n\n> \n\n> Robot: You didn’t say ‘Robot, please.’\n\n> \n\n> Programmer:\
    \ Robot, please take 10 steps.\n\n> \n\n> Robot: 1,2 …10 (counting steps).\n\n\
    > \n\n> Programmer: Robot, please turn a quarter.\n\n> \n\n> Robot: Which way?\n\
    \n> \n\n> Programmer: (Using spinner, turns spinner) That way, right. (pointing\
    \ right)\n\n> \n\n> Programmer: Robot, please turn a whole circle.\n\n> \n\n>\
    \ Programmer: Robot, please take 4 steps backwards.\n\n> \n\n> Robot: 1, 2, 3,\
    \ 4\n\n> \n\n> Programmer: Robot, please take 5 plus 3 steps.\n\n> \n\n> Robot:\
    \ How many is that? (Programmer and Robot count on their fingers, 5 plus 3.)\n\
    \nAfter playing this game the first time, it became apparent that we needed a\
    \ way to decide how far a turn was, eg, ¼ turn, ½ turn. So we made spinners with\
    \ ¼ turn, ½ turn, and full turn and that showed left and right. This is still\
    \ a difficult concept, but I am persevering. We also started using Bee-Bot on\
    \ Friday, and the spinners were helpful as each press of the turn button on the\
    \ Bee-Bot is a quarter turn.\n\nWe have also played outside on the playground,\
    \ and this led to a lot more use of location language.\n\nIt has been interesting\
    \ to watch the dynamics between the pairs of children. As with all activities,\
    \ some groups were very focused, others not so. One group was very silly until\
    \ the children swapped roles, and then they were much more focused. I asked them\
    \ at the end whether it was easier being a Robot or a Programmer. One child, who\
    \ was the Programmer first, had found it very hard to be the Programmer and think\
    \ of things to ask their partner to do; hence the lack of focus. But when they\
    \ swapped roles, they had enjoyed being a Robot."
