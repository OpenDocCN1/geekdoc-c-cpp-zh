    It’s been a great learning experience for me, and I have been thinking about blogging
    it—haven’t done a professional blog before.


    Thanks for your encouragement and support.


    Cheers!


    Melissa’s story is a great example of a teacher using what students use in their
    lives outside of the classroom to teach lessons inside the classroom. As a bonus,
    it can literally get students outside of the classroom—a change I think even we
    teachers appreciate! This activity demonstrates how computer coding is a language
    while also building children’s language skills and honing their ability to work
    well together. I think it could also be adapted to help teach other languages
    such as French or Spanish. This would also make it suitable for older children.


    # Chapter 6


    ## Grit, Perseverance, and Alzheimer’s: Why Coding Matters


    At the beginning of this book, I said a pooping baby showed me the kind of teacher
    I want to be.


    Sometimes, though, being the teacher who encourages students to think critically
    and creatively, and who willingly learns and makes mistakes alongside them, makes
    me want to curl up like a baby and have someone else do the hard work for me.
    It’s exhausting.


    When I need encouragement to continue being a teacher who pushes beyond rote memorization
    and routine assessments, when I need motivation to encourage students to take
    risks, think critically, and solve problems in the middle of challenging situations,
    I turn to Street View in Google Maps and type in a familiar address. I click on
    the slider and watch images pass until it stops on a shot taken in 2009.


    I usually try not to cry as a picture of one of the greatest teachers I’ve ever
    had comes on the screen.


    The man in the picture looks out onto the street as if he were expecting to pose
    for the camera, but I am sure he never expected his image to be captured and archived
    online. In fact, I’m not even sure if he would have been able to describe the
    truck that drove by that day or tell you the number on the old brick farmhouse
    behind him—98.


    But when I see that elderly man in a blue baseball cap, jeans, and a sweater,
    I see a giant of perseverance. That man is my late Poppa, as my brother and I
    called him. For much of my childhood and adolescence, my brother and I would spend
    our March school breaks with our grandparents in Toronto. We’d board the train
    in Windsor, and our grandparents would pick us up at Toronto’s Union Station.
    Poppa was a retired geologist and high school science teacher. He would show us
    rocks and minerals, and we would mix chemicals together. Chemical reactions happened
    right before our eyes. Some would call it a makerspace, or at the very least,
    an extra assignment that reinforced what we were learning in science class. For
    us, it was simply spending time with Poppa.


    Poppa was diagnosed with Alzheimer’s a few years before that Street View photo
    was taken. The diagnosis devastated me. I knew he’d lose his ability to communicate.
    Our science lessons would change.


    As it turned out, he would continue to teach me. I watched him, trying to understand
    the disease wreaking havoc on his mind. It was as if I were at a zoo, studying
    Alzheimer’s.


    ![line](Images/line.png)


    ## Featured Post


    ### Learn to Code Tennis for One


    ![QR-Learn-to-Code-Tennis-For-One](Images/QR-Learn-to-Code-Tennis-For-One.png)


    ###### [http://brianaspinall.com/tennis-for-one](http://brianaspinall.com/tennis-for-one)


    ![line](Images/line.png)


    One day I saw him try to remove the storm windows from the storm porch at the
    front of the house. I emphasize “try”—he’d done this with little effort for more
    than thirty years. This time was different. Because of the disease, he couldn’t
    remember the right tools to use. He struggled with finding the proper screws.
    He didn’t have the right screwdriver or bit, and his mind couldn’t tell him which
    ones he needed.


    I watched him struggle with the task for fifteen minutes. I also saw him persevere
    to solve the problem. As he fumbled with screwdrivers and screws, he was holding
    fast to his mental grit even as Alzheimer’s ravished his brain.


    His life was an example of all the theories we talk about in textbooks and the
    philosophies I want to bring to my teaching: observing problems in the world around
    us and persevering to find solutions to them.


    Regardless of whether he meant to, he was teaching me to never give up, the same
    lesson I hope my students learn through coding.


    When Poppa first removed the storm windows on his home, he never would have imagined
    a picture of him standing in front of those windows would be stored online, or
    that I would still find comfort in it years after his death. But thanks to a few
    coders, it is, and I do. The world has changed radically; we communicate and interact
    with each other in such vastly different ways now. We change technology, and technology
    changes us.


    The need to persevere through life’s difficulties has not changed. It is not going
    to change. The biggest challenges and problems in life that our students will
    face won’t be solved by an app. But the way they learn to think while they use
    emerging technologies can help them find solutions.


    My Poppa reminds me why I love technology and why I want students to create with
    technology. It’s not because of the way it has helped me teach lessons or solve
    household problems. It’s because it’s given me richer ways to interact with people.
    Nothing changes how we think more than the ways we interact with others.


