    ### Featured Post


    #### Coding Fractal Art with Python


    ![QR-Coding-Fractal-Art-With-Python](Images/QR-Coding-Fractal-Art-With-Python.png)


    ###### [http://brianaspinall.com/creating-fractal-art-using-python-ctmindset](http://brianaspinall.com/creating-fractal-art-using-python-ctmindset)


    ![line](Images/line.png)


    For example, we often use a student’s ability to remember facts quickly as a way
    to measure knowledge. In this view, the better students are students who can recall
    information quickly. A good math student, in this view, isn’t just one who has
    memorized all his multiplication tables. A good student is someone who can spout
    all the correct answers really, really fast. Speed is what sets them apart.


    For too long, we’ve made time the constant in schools. We expect students to all
    work on the same timeline. We placed kids in isolated settings, started a countdown,
    and judged them based on their performance in that moment, and quite often, only
    that moment. If students don’t give us the results we want in the time we want,
    we say they’ve failed.


    I admit, I don’t like assigning letter grades to students. I’d remove them from
    elementary grades, if possible. I think assessments and evaluations with rigid
    frameworks and closed-ended questions make it hard to incorporate open-ended computational
    thinking activities into classroom management and teaching practices. We say all
    students can achieve. We say we want them to take risks. But too often, our assessment
    practices don’t reflect those beliefs.


    We tell students about how great inventors tried and failed many times before
    they succeeded, but we don’t always take risks in our teaching. Maybe we need
    to reconsider our fixation with time. Maybe we should teach students to create
    content without the burden of time constraints. This could help create environments
    in which they know they’re free to fail, and it would allow educators to focus
    more on the process of learning and not only on the final product. It might take
    a long time to reach the destination, but the blood, sweat, and tears put into
    the project would be more than worth it.'
