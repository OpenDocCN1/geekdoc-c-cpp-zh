  trans: '

    作者 Rich Czyz 致力于彻底改变所有教育者的专业学习模式。在《四点钟学院》（*The Four O’Clock Faculty*）中，Rich 了让专业发展（PD）变得有意义、高效且最重要的是与个人相关的方法。这本书是一本实用指南，揭示了为什么有些专业发展如此糟糕，以及你可以做什么来改变这种模式，从而改善你自己和你的同事。


    ## ![Culturize](img/dbc_Culturize.jpg)


    ## Culturize


    ### 每个学生。每天。不惜一切代价。


    #### 作者 Jimmy Casas ([@casas_jimmy](https://twitter.com/casas_jimmy))


    在《Culturize》中，作者兼教育领袖 Jimmy Casas 分享了关于培养一个学习者社区的见解，这个社区体现了我们世界迫切需要的人性特质，如善良、诚实和同心。他的故事揭示了在满足并超越
    21 世纪学习学术标准的同时，如何磨炼这些“软技能”。


    # 关于作者


    ![CB-brian-aspinall](img/CB-brian-aspinall.png)


    **Brian Aspinall** 是一位教育者、三届 TEDx 演讲者、编码员和顾问。他曾与政府部门、工会、大学、学区和学校团队以及公司合作过，是数字技能教育领域国际认可的思想领袖。


    作为编程和计算思维教学卓越教学总理奖的获得者，Brian 赋能教育者利用现代教学工具和技术在课堂上取得更多成就。


    他对 STEM 教育的热情、领导力以及提升能力的方法，使他成为全北美备受青睐的演讲者，并荣幸入选加拿大首批 Minecraft、Micro:BiT 和 Makey
    Makey 大使！


    Brian 从 20 世纪 90 年代初就开始开发应用程序，当时他的高中校长付钱让他开发学校的第一个网站。遗憾的是，那个网站和那所高中都不复存在了。


    要了解更多关于 Brian Aspinall 及其作品的信息，请访问：


    [`www.MrAspinall.com`](http://www.MrAspinall.com)


    [`www.BrianAspinall.com`](http://www.BrianAspinall.com)


    或者，直接在推特上关注他：[@mraspinall](https://twitter.com/mraspinall)

    '
