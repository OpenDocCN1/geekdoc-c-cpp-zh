  trans: "\n\n当学生将自己定义为制造者、发明者和创造者时，他们身上会发生变化。他们发现了强大的技能——解决问题的能力、批判性思维和想象力——这些技能将帮助他们塑造世界的未来……我们的未来。在*LAUNCHLAUNCH*一书中，John\
    \ Spencer 和 A.J. Juliani 提供了一种可以融入到每个年级、每个课程的流程……即使你不认为自己是一个“创意型教师”。如果你敢于创新，并将创造力视为一项基本技能，你将赋予学生改变世界的能力——从现在开始。\n\
    \n## ![TMWGA](img/dbc_TMWGA.jpg)\n\n# 使用 Google Apps 教学数学\n\n### 50 个 G Suite\
    \ 活动方案 \n\n#### Alice Keeler 和 Diana Herrington 著 ([@AliceKeeler](https://twitter.com/AliceKeeler),\
    \ [@mathdiana](https://twitter.com/mathdiana))\n\nGoogle Apps 为教师提供了比以往任何时候都更有意义的学生互动的机会，而\
    \ G Suite 则赋予学生成为创造性、批判性思考者的能力，并在探索和学习过程中进行协作。在《使用 Google Apps 教学数学》中，教育工作者 Alice\
    \ Keeler 和 Diana Herrington 展示了五十种不同的方法，利用易用技术将数学课带入 21 世纪。\n\n## ![3D-Dunk-Tank](img/dbc_Dunk-Tank.jpg)\n\
    \n# 逃离校长的水水桶\n\n### 当他人想看你落水时如何胜出\n\n#### Rebecca Coda 和 Rick Jetter 著 ([@RebeccaCoda](https://twitter.com/RebeccaCoda),\
    \ [@RickJetter](https://twitter.com/RickJetter))\n\n没有任何学校领导者能免于水水桶——歧视、糟糕的政治、报复或自我驱动型同事的影响。在《逃离校长的水水桶》中，Rebecca\
    \ Coda 和 Rick Jetter 分享了真实故事和深刻的见解，为学校领导者提供生存所需的实用知识和情感工具，更好的是，避免被“击落”。\n\n##\
    \ ![StartRightNow](img/dbc_SRN.png)\n\n# 现在。就开始。\n\n### 为了追求卓越而教学与领导\n\n#### Todd\
    \ Whitaker, Jeff Zoul 和 Jimmy Casas 著 ([@ToddWhitaker](https://twitter.com/ToddWhitaker),\
    \ [@Jeff_Zoul](https://twitter.com/Jeff_Zoul), [@casas_jimmy](https://twitter.com/casas_jimmy))\n\
    \n在创作《现在。就开始。》之前的工作中，Todd Whitaker、Jeff Zoul 和 Jimmy Casas 研究了全国各地的教育工作者，并发现了卓越的四个关键行为：卓越的领导者和老师知道道路、展示道路、走道路并每天成长。如果你准备好迈向卓越的第一步，这本励人书籍将带你走上正确的道路。\n\
    \n## ![LeadLikeaPIRATE](img/dbc_LdLAP.jpg)\n\n# 像海盗一样领导\n\n### 为你的学生和员工让学校变得惊艳\n\
    \n#### Shelley Burgess 和 Beth Houf 著 ([@Burgess_Shelley](https://www.twitter.com/Burgess_Shelley),\
    \ [@BethHouf](https://twitter.com/BethHouf))\n\n在《像海盗一样领导》中，教育领导者 Shelley Burgess\
    \ 和 Beth Houf 勾勒了领导学校或学区所需的品格特质。你将学如何在教室和学校中发现已存在的宝藏——以及如何挖掘你教育工作者最好的一面。这本书将装备并鼓励你在为学生、员工、家长和社区让学校变得惊艳的道路上坚持不懈。\n\
    \n## ![Table Talk Math](img/dbc_TTM.jpg)\n\n# 餐桌上的数学对话\n\n### 将数学引入日常对话的实用指南\n\
    \n#### John Stevens 著 ([@Jstevens009](https://twitter.com/Jstevens009))\n\n让数学成为家庭日常对话的一部分是帮助孩子和青少年学会热爱数学的有力方法。在《餐桌上的数学对话》中，John\
    \ Stevens 为家长（以及老师！）提供了发起真实的、基于数学的对话的想法，让孩子们注意到并对周围世界所有的数字、模式和方程产生好奇。\n\n## ![Shift\
    \ This!](img/dbc_ST.jpg)\n\n# 转变这个！\n\n### 如何在课堂中实施渐进式变化产生巨大影响\n\n#### Joy Kirr\
    \ 著\n\n建立一种不以成绩和家庭作业为中心，而关注个人责任和个性化学习的学生主导的文化，似乎是一项艰巨的任务——尤其是当你认为必须一次性完成它时。但当变化一点一点发生时，重大的改变是可能的、可持续的，甚至是容易的。在《转变这个！》中，教育工作者兼演讲者\
    \ Joy Kirr 解释了如何进行渐进式的转变——在你的思维、教学和课堂设计方法上——这些转变将对你的课堂产生巨大影响。今天就开始第一次转变吧！\n\n\
    ## ![Unmapped Potential](img/dbc_UP.jpg)\n\n# 未测的潜力\n\n# 教育工作者的持久改变指南\n\n####\
    \ Julie Hasson 和 Missy Lennard 著 ([@PPrincipals](https://twitter.com/PPrincipals))\n\
    \n无论你处于教育生涯的哪个阶段，你很可能曾在一个时候感到力不从心和工作过度。也许你现在就有这种感觉。如果是这样，你并不孤单。但更重要的消息是，情况可以变得更好！你只需要一张正确的地图来引导你。《未测的潜力》提供了建议和实用策略，帮助你成为你想成为的那种教育工作者。\n\
    \n## ![Shattering the Teacher Myth](img/dbc_STM.jpg)\n\n# 打破教师神话\n\n# 帮助作为教育工作者蓬勃发展的\
    \ 6 个真相\n\n#### Aaron Hogan 著 ([@aaron_hogan](https://twitter.com/aaron_hogan))\n\
    \n完美教师的神话延续了不切实际的期望并让老师陷入失败。作者兼教育工作者 Aaron Hogan 致力于打破完美教师的神话，通过赋予教育工作者策略帮助他们走出生存。\n\
    \n## ![Social LEADia](img/dbc_SL.jpg)\n\n# Social LEADia\n\n### 引导学生从数字公民转向数字领导\n\
    \n#### Jennifer Casa-Todd 著 ([@JCasaTodd](https://twitter.com/JCasaTodd))\n\n\
    为学生的未来做好准备从现在开始。在我们的网络社会中，学生需要学习如何利用社交媒体连接人、热情和机会以成长并做出贡献。《Social LEADia》提供了见解和有趣的故事，帮助你将学校和家庭的焦点从数字公民转向数字领导。\n\
    \n## ![Spark Learning](img/dbc_SPK.jpg)\n\n# 激发学习\n\n### 拥抱学生好奇心的三个关键\n\n####\
    \ Ramsey Musallam 著 ([@ramusallam](https://twitter/))\n\n受其受欢迎的 TED 演讲“激发学习的三个规则”启发，这本书结合了大脑科学研究、经典的教学方法和\
    \ Ramsey 的个人故事，赋予你通过激发探索并利用其益处来改进学生的学习体验。如果你想让学生参与更有趣、更有效的学习，这本书适合你。\n\n## ![Ditch\
    \ That Homework](img/dbc_DTH.jpg)\n\n# 丢掉作业\n\n### 帮助让作业过时的实用策略\n\n#### Matt Miller\
    \ 和 Alice Keeler 著 ([@jmattmiller](https://twitter.com/jmattmiller), [@alicekeeler](https://twitter.com/alicekeeler))\n\
    \n在《丢掉作业》中，Matt Miller 和 Alice Keeler 讨论了作业的优缺点、老师为什么布置作业，以及如果没有作业会变成什么样。在评估研究并分享家长和老师见解的同时，作者们为放弃作业并代之以更有效、更个性化的学习方法提供了说服力的论据。\n\
    \n## ![The Four O'Clock Faculty](img/dbc_4OCF.jpg)\n\n# 四点教师\n\n# 变革职业发展的叛逆指南\n\
    \n#### Rich Czyz 著 ([@RACzyz](https://twitter.com/RACzyz))\n\n"
- fmt: '

    Author Rich Czyz is on a mission to revolutionize professional learning for all
    educators. In *The Four O’Clock Faculty*, Rich identifies ways to make PD meaningful,
    efficient, and, above all, personally relevant. This book is a practical guide
    that reveals why some PD is so awful and what you can do to change the model for
    the betterment of you and your colleagues.


    ## ![Culturize](Images/dbc_Culturize.jpg)


    ## Culturize


    ### Every Student. Every Day. Whatever It Takes.


    #### By Jimmy Casas ([@casas_jimmy](https://twitter.com/casas_jimmy))


    In *Culturize*, author and education leader Jimmy Casas shares insights into what
    it takes to cultivate a community of learners who embody the innately human traits
    our world desperately needs, such as kindness, honesty, and compassion. His stories
    reveal how these “soft skills” can be honed while meeting and exceeding academic
    standards of twenty-first-century learning.


    # About the Author


    ![CB-brian-aspinall](Images/CB-brian-aspinall.png)


    **Brian Aspinall** is an educator, three-time TEDx speaker, coder, and consultant.
    Having worked with ministries, unions, universities, district and school teams,
    and corporations, he is an internationally recognized thought leader in digital
    skills education.


    As a recipient of a Prime Minister’s Award for Teaching Excellence in coding and
    computational thinking, Brian empowers educators to achieve more in the classroom
    using modern teaching tools and technology.


    His enthusiasm, leadership, and approach to building capacity within STEM education
    has made him a sought-after speaker throughout North America and has earned him
    the honor of being selected as one of Canada’s first Minecraft, Micro:BiT, and
    Makey Makey ambassadors!


    Brian has been developing apps since the early 1990s, when his high school principal
    paid him to develop the school’s first website. Unfortunately, neither the website
    nor the high school still exists.


    To find out more about Brian Aspinall and his body of work, visit:


    [http://www.MrAspinall.com](http://www.MrAspinall.com)


    [http://www.BrianAspinall.com](http://www.BrianAspinall.com)


    Or, just Tweet him: [@mraspinall](https://twitter.com/mraspinall)

    '
