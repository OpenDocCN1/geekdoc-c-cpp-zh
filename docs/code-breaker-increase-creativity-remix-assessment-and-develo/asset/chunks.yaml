    在教室中引入新技术可能具有挑战性，但如果学生想要为未来做好充分准备，这是必经之路。Alice Keeler 和 Libbi Miller 通过提供对 `Google
    Classroom App` 的全面概述，缩短了学习曲线。`Google Classroom` 作为教育版 Google 应用（GAfE）的一部分，专门设计用于通过简化数字化流程来帮助教师节省时间。《Google
    Classroom 可以完成的 50 件事》一书配有截图，提供了许多创意和分步骤的操作说明，帮助教师实施这一强大的工具。


    ![dbc_50TFGC](img/dbc_50TFGC.jpg)


    # Google Classroom 进阶指南：50 个方法


    ### 以学生为中心的方法


    #### Alice Keeler 和 Libbi Miller ([@alicekeeler](https://twitter.com/alicekeeler),
    [@MillerLibbi](https://twitter.com/MillerLibbi))


    如今的技术使教育者能够摆脱传统的教室——在那种教室里，教师主导，学生独立工作，每个人都在做同样的事情。在《Google Classroom 进阶指南：以学生为中心的方法》中，作者兼教育者
    Alice Keeler 和 Libbi Miller 提供了灵感和资源，帮助你创建一个数字化丰富、参与感强且以学生为中心的环境。他们向你展示了如何利用 `Google
    Classroom` 实现个性化学习的力量。


    ![Master the Media](img/dbc_MTM.jpg)


    # 精通媒体


    ### 传授媒体素养如何拯救我们连接网络的世界


    #### Julie Smith ([@julnilsmith](https://twitter.com/julnilsmith))


    《精通媒体》是为了帮助教师和家长教育下一代而写的，它解释了媒体背后的历史、目的和传递的信息。其目的并不是让孩子们远离电子设备，而是帮助他们做出明智的选择，理解真理与谎言的区别，并辨别感知与现实。批判性思维能带来更明智的决策——这也是为什么媒体素养可以拯救世界的原因。


    ![The Writing on the Classroom Wall](img/dbc_TWOTCW.jpg)


    # 教室墙上的文字


    ### 发表你对教育最热情的信念如何赋能你的学生、推动你的成长并引导终身学习


    #### Steve Wyborney ([@SteveWyborney](https://twitter.com/SteveWyborney))


    在《教室墙上的文字》中，Steve Wyborney 解释了发布和讨论“大思想”（Big Ideas）如何引导更深层次的学习。你将了解到为什么分享你的想法会让它们变得敏锐和精炼。你还会受到鼓励，知道你分享的大思想不必深奥也能对学习产生深远的影响。事实上，Steve
    解释说，你的某些想法掉下墙去也没关系。最重要的是分享它们。


    ![Kids Deserve It](img/dbc_KDI.jpg)


    # 孩子们值得这一切！


    ### 突破边界并挑战传统思维


    #### Todd Nesloney 和 Adam Welcome ([@TechNinjaTodd](https://twitter.com/TechNinjaTodd),
    [@awelcome](https://twitter.com/awelcome))


    在《孩子们值得这一切！》中，Todd 和 Adam 鼓励你放远思考，让学习变得有趣且有意义。他们高科技、高触感且极具参与感的实践将激励你去承担风险、打破现状，并成为学生的捍卫者。顺便说，你可能会重新发现你最初成为教育者的原因。


    ![The Classroom Chef](img/dbc_TCC.jpg)


    # 教室主厨


    ### 精炼你的课程。调味你的课堂。让数学变得意义。


    #### John Stevens 和 Matt Vaudrey ([@Jstevens009](https://twitter.com/Jstevens009),
    [@MrVaudrey](https://twitter.com/MrVaudrey))


    在《教室主厨》中，数学老师和教学教练 John Stevens 和 Matt Vaudrey 分享了他们的秘方、食材和技巧，用于提供吸引学生并帮助他们“理解”数学的课程。你可以直接使用这些想法和方法，或者更好地对其进行调整，创造你自己的诱人教育晚餐。作者分享的信息是，只要有想象力和准备，每位教师都能成为教室主厨。


    ![Ditch That Textbook](img/dbc_DTT.jpg)


    # 抛弃教科书


    ### 释放你的教学并彻底改变你的课堂


    #### Matt Miller ([@jmattmiller](https://twitter.com/jmattmiller))


    教科书是几个世纪以来教育的象征。它们一到达学生的课桌，往往就过时了。“按教科书办事”意味着顺从和缺乏创造力。是时候抛弃那些教科书——以及那些关于学习的教科书假设了！在《抛弃教科书》中，教师兼博主
    Matt Miller 鼓励教育者抛弃毫无意义、平的教学学习实践。他赋予他们在旧有的标准教学方法基础上进行进化和改进。《抛弃教科书》是一个支持系统、工具箱和宣言，帮助教育者释放教学并彻底改变课堂。


    ![dbc_YSR](img/dbc_YSR.jpg)


    # 你的学校很棒……告诉大家吧！


    ### 热情地推销并推广你校园发生的积极事物


    #### Ryan McLane 和 Eric Lowe ([@McLane_Ryan](https://twitter.com/McLane_Ryan),
    [@EricLowe21](https://twitter.com/EricLowe21))


    你的学校每天都在发生很棒的事情。问题是：墙之外没人知道这些事。在《你的学校很棒……告诉大家吧！》中，校长 McLane 和 Eric Lowe 提供了七多个可操作的建议，以及易于遵循的说明和视频教程链接。这份实用指南将使你能够利用社交媒体创建有效且易于管理的沟通策略。学习如何让你的学生和社区保持联系，并对发生的事情感到兴奋。


    ![How Much Water Do Have](img/dbc_HMW.jpg)


    # 我们需要多少水？


    ### 应对任何变化并在变革中生存的五个成功原则


    #### Pete Nunweiler 与 Kris Nunweiler


    在《我们需要多少水？》中，Pete Nunweiler 识别了五个关键要素——信息、计划、动力、支持和领导力——这是任何目标、生活转型或挑战成功的要素。Pete
    将这些元素称为“成功之水”，正如我们喝的水一样，你需要它们才能在今天快速节奏的世界中生存。如果你在工作或家里感到压力、崩溃或不确定，请停下来寻找脱水的迹象。学习如何寻找、获取和使用这些“成功之水”——以便与你的团队和家庭成员分享。


    ![Instant Relevance](img/dbc_IR.jpg)


    # 即时关联


    ### 将今天的经历融入明天的课程


    #### Denis Sheeran ([@MathDenisNJ](https://twitter.com/MathDenisNJ))


    每天，全球的学生都会问一个问题：“我什么时候会在生活中用到这些？”在《即时关联》中，作者兼主题演讲家 Denis Sheeran 使你能够根据对学生重要的经历和事件创建有趣的课程。学习如何帮助你的学生看到现实世界与课堂知识之间有意义的联系——正因为这样，学习才会深入人心。


    ![LAUNCH](img/dbc_LAUNCH.jpg)


    # 启动


    ### 使用设计思维激发创造力并挖掘每个学生的创造潜力


    John Spencer 和 A.J. Juliani ([@spencerideas](https://twitter.com/spencerideas),
    [@ajjuliani](https://twitter.com/ajjuliani))


