    \ had comes on the screen.\n\nThe man in the picture looks out onto the street\
    \ as if he were expecting to pose for the camera, but I am sure he never expected\
    \ his image to be captured and archived online. In fact, I’m not even sure if\
    \ he would have been able to describe the truck that drove by that day or tell\
    \ you the number on the old brick farmhouse behind him—98.\n\nBut when I see that\
    \ elderly man in a blue baseball cap, jeans, and a sweater, I see a giant of perseverance.\
    \ That man is my late Poppa, as my brother and I called him. For much of my childhood\
    \ and adolescence, my brother and I would spend our March school breaks with our\
    \ grandparents in Toronto. We’d board the train in Windsor, and our grandparents\
    \ would pick us up at Toronto’s Union Station. Poppa was a retired geologist and\
    \ high school science teacher. He would show us rocks and minerals, and we would\
    \ mix chemicals together. Chemical reactions happened right before our eyes. Some\
    \ would call it a makerspace, or at the very least, an extra assignment that reinforced\
    \ what we were learning in science class. For us, it was simply spending time\
    \ with Poppa.\n\nPoppa was diagnosed with Alzheimer’s a few years before that\
    \ Street View photo was taken. The diagnosis devastated me. I knew he’d lose his\
    \ ability to communicate. Our science lessons would change.\n\nAs it turned out,\
    \ he would continue to teach me. I watched him, trying to understand the disease\
    \ wreaking havoc on his mind. It was as if I were at a zoo, studying Alzheimer’s.\n\
    \n![line](Images/line.png)\n\n### Featured Post\n\n#### Learn to Code Tennis for\
    \ One\n\n![QR-Learn-to-Code-Tennis-For-One](Images/QR-Learn-to-Code-Tennis-For-One.png)\n\
    \n###### [http://brianaspinall.com/tennis-for-one](http://brianaspinall.com/tennis-for-one)\n\
    \n![line](Images/line.png)\n\nOne day I saw him try to remove the storm windows\
    \ from the storm porch at the front of the house. I emphasize “try”—he’d done\
    \ this with little effort for more than thirty years. This time was different.\
    \ Because of the disease, he couldn’t remember the right tools to use. He struggled\
    \ with finding the proper screws. He didn’t have the right screwdriver or bit,\
    \ and his mind couldn’t tell him which ones he needed.\n\nI watched him struggle\
    \ with the task for fifteen minutes. I also saw him persevere to solve the problem.\
    \ As he fumbled with screwdrivers and screws, he was holding fast to his mental\
    \ grit even as Alzheimer’s ravished his brain.\n\nHis life was an example of all\
    \ the theories we talk about in textbooks and the philosophies I want to bring\
    \ to my teaching: observing problems in the world around us and persevering to\
    \ find solutions to them.\n\nRegardless of whether he meant to, he was teaching\
    \ me to never give up, the same lesson I hope my students learn through coding.\n\
    \nWhen Poppa first removed the storm windows on his home, he never would have\
    \ imagined a picture of him standing in front of those windows would be stored\
    \ online, or that I would still find comfort in it years after his death. But\
    \ thanks to a few coders, it is, and I do. The world has changed radically; we\
    \ communicate and interact with each other in such vastly different ways now.\
    \ We change technology, and technology changes us.\n\nThe need to persevere through\
    \ life’s difficulties has not changed. It is not going to change. The biggest\
    \ challenges and problems in life that our students will face won’t be solved\
    \ by an app. But the way they learn to think while they use emerging technologies\
    \ can help them find solutions.\n\nMy Poppa reminds me why I love technology and\
    \ why I want students to create with technology. It’s not because of the way it\
    \ has helped me teach lessons or solve household problems. It’s because it’s given\
    \ me richer ways to interact with people. Nothing changes how we think more than\
    \ the ways we interact with others.\n\n# TEDx Talks\n\n![QR-TEDx-Talks](Images/QR-TEDx-Talks.png)\n\
    \n#### **[brianaspinall.com/tedx-talks](http://www.brianaspinall.com/tedx-talks)**\n\
