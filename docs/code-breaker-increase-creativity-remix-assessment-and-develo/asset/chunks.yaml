    ![line](img/line.png)


    也许我们需要将`classroom management`（课堂管理）改为`classroom engagement`（课堂参与）。我们老师的目标应该是帮助学生投入学习。这通过通过协作和讨论来实现——即发出噪音。有时这意味着观察学生工作，并对他们正在做的事提问。这意味着让他们向我们展示他们在做什么，而不仅仅由我们告诉他们该做什么。


    学生的参与度很难衡量，尤其是按照目前大多数评估的方式进行时。


