    ![line](Images/line.png)


    Maybe we need to change the phrase `classroom management` to `classroom engagement.`
    Our goal as teachers should be to help students become engaged with learning.
    This comes through collaboration and discussion—making noise. Sometimes it means
    watching students work and asking them questions about what they’re doing. It
    means letting them show us what they’re doing, and not just us telling them what
    to do.


    Student engagement can be hard to measure, especially with the way most assessments
    are done.


    ![line](Images/line.png)


    ### Featured Post


    #### Coding Fractal Art with Python


    ![QR-Coding-Fractal-Art-With-Python](Images/QR-Coding-Fractal-Art-With-Python.png)


    ## [http://brianaspinall.com/creating-fractal-art-using-python-ctmindset](http://brianaspinall.com/creating-fractal-art-using-python-ctmindset)


    ![line](Images/line.png)


    For example, we often use a student’s ability to remember facts quickly as a way
    to measure knowledge. In this view, the better students are students who can recall
    information quickly. A good math student, in this view, isn’t just one who has
    memorized all multiplication tables. A good student is someone who can spout all
    the correct answers really, really fast. Speed is what sets them apart.

