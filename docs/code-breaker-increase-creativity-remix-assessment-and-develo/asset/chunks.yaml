    关于作者


    向出色的 Meagan Gillmore **[致敬](https://twitter.com/hashtag/ShoutOut)**！你拥有一项将人们的思想付诸印刷的独特天赋。我感激不尽。


    # 前言


    还记得我们以前经常去图书馆获取信息吗？在很多方面，我想我们现在仍然这样做。重点是，我们生活在一个获取便捷的时代。基于知识的问题答案存储在数据库中，只需点击按钮即可快速检索。


    过去并非总是这样。我们中的一些人记得互联网之前的世界。我们中的许多人已经忘记了。但即使在信息时代到来，早在 20 世纪 60 年代，教育工作者就开始通过运动活动教授孩子们编程。瑞吉·艾米利亚（Reggio
    Emilia）通过基于游戏的学习启发了数百万人，而我个人的英雄之一西摩尔·帕帕特（Seymour Papert）曾用机器人乌龟教授几何。


    ![CB-Coding-Sketchnote](img/CB-Coding-Sketchnote.jpg)


    我是许多人所说的自学型编程人员。我记得 20 世纪 90 年代初，在观看父亲编写网页软件后，学习 `HTML` 和 `JavaScript` 的美好时光。


    在那个年代的末期，千年虫（Y2K）几乎毁掉了一切。对于安大略省北部的一家大型矿业公司来说，我的叔叔进行了批判性思考，并编写了软件将他们从回到过去。想象一下，一个价值数百万的企业运行在一个人的想法和创意之上，只为了不让跳动的计算机时钟翻回到
    1900 年。在开启新世纪的核心，是一个人、一台机器、一个想法。尽管他并不炫耀这段经历，但这个庞大的组织在那些修正后的代码行上运行非常顺畅。他甚至没有要求升职。


    # 第一章


    ## 臭臭的清晰


    一个正在拉便的宝宝向我展示了我想要的教学方式。


    那是我教 8 级班的第一年，这并不完全是我的理想工作。作为世纪世纪 90 年代的青少年，我喜欢学习基础的 `HTML`，并在加拿大安大略省的温莎大学获得了计算机科学本科学士学位。当我从同样位于温莎大学的师范学院毕业时，我希望在高中教授数学和计算机科学，但像许多新毕业生一样，我抓住了当地任何可用的工作。那不是高中、不是数学或计算机科学，但那是一份工作。


    但我无法戒掉编程的“瘾”。我决定成为老师，部分是因为我在儿童暑期科技营担任导师的经历。我想在学校期间与学生们分享同样的热情，于是我办了一个课后计算机编程俱乐部。学生们学习使用
    `Scratch` 编程，这是由麻省理工学院（MIT）的 Mitch Resnick 开发的程序。今天看来，每个对教孩子编程感兴趣的人都在使用 `Scratch`，但在
    21 世纪 00 年代中期，那是“编程小时”（Hour of Code）等活动发起之前的几年。该软件必须安装在每台电脑上，因为它不像现在这样是基于 Web
    的。我要学习的内容和学生们一样多！我在大学期间用过 `Java`，并教过 `HTML`，但我从未像在 `Scratch` 中那样将代码块连接在一起。我在该程序的经验上可能有所欠缺，但我用热情弥补了这一点。我全身投入教授学生循环和变量，他们很快就学会了。


    许多同事并没有那么兴奋。他们并没有明确阻挠我办俱乐部；他们只是对将计算机编程作为教学工具表示怀疑。


    也许我也有一点点怀疑。我的性格不适合工作单或死记硬背。我在计算机科学课程上表现得很好，部分是因为我从来不需要记忆语法。尽管如此，我知道标准的教学实践倾向于记忆和死记硬背。我也知道，要向某些人展示编程的价值需要创造力。


    我的一个学生 Jaime 在他决定编写他的第一个游戏时，展示了这种至关重要的联系。他将其命名为“拉便的宝宝”。这个游戏涉及一个婴儿在屏幕上移动并不断发射粪便导弹，但它远不止是一个博人取笑的段子：它是我们几何课程的应用。。要让宝宝向左移动，学生必须将
    `X` 变量改为负数。让宝宝向上或向下需要改变 `Y` 变量。在宝宝发射粪便导弹之前，必须先绘制出正确的 `X` 和 `Y` 坐标。在游戏中，我在纸上教导的概念在屏幕上变得生动了——尽管是用粪便的形式！


    ![line](img/line.png)


    ### 特色文章


    #### 喧闹！为原住民编写一个概率游戏


    ![QR-Hubbub!-Coding-a-First-Nations-Game-of-Chance](img/QR-Hubbub%21-Coding-a-First-Nations-Game-of-Chance.png)


    ###### [`brianaspinall.com/hubbub-coding-a-aboriginal-game-of-chance`](http://brianaspinall.com/hubbub-coding-a-aboriginal-game-of-chance)


    ![line](img/line.png)


    最棒的部分是 Jaime 玩得开心，他可能并没有意识到自己正在掌握几何技能并满足了学校的课程预期。但我清楚。我看到了他的作品，看到了我想要成为的那种老师。我想让学生将课程预期视为技能，我希望他们像这个学生制作游戏一样获得这些技能——通过发挥创造力、承担风险、犯错并接受反馈。设计了“拉便的宝宝”的学生看到了世界中的模式，并将所看到的应用于为解决真实问题创造真正的解决方案。


    看着 Jaime 编写他的第一个游戏，让我想起了我 11 年级的媒体研究老师 Boudreau 女士，她曾让我为一个关于流行偶像的演示制作网站，而作业原本要求我做一张海报。那时，我想最大的困难将是说服她一个关于图帕克（Tupac
    Shakur）的网站是适合的。我可能永远无法确切她对我的音乐口味怎么想，但我知道她让我以创意的方式探索我的兴趣这一决定，为我开启了这个学生游戏的道路。因为
    Boudreau 女士答应了我，我知道我不能拒绝 Jaime 和他的“拉便的宝宝”游戏。学习，就像游戏的内容一样，是混乱的！


    ![line](img/line.png)


    ### 特色文章


    #### 使用 Python 掷硬币


    ![QR-Flipping-a-coin-with-python](img/QR-Flipping-a-coin-with-python.png)


    ###### [`brianaspinall.com/coding-probability-simulators-with-python-csforall`](http://brianaspinall.com/coding-probability-simulators-with-python-csforall)


    ![line](img/line.png)


    这个学生是我最大的老师之一。他激励我去学习更多关于计算思维和编程如何在课堂以及跨学科中使用的知识，以及它如何造学生学生终生。


