- fmt: '

    It can be challenging to add new technology to the classroom, but it’s a must
    if students are going to be well-equipped for the future. Alice Keeler and Libbi
    Miller shorten the learning curve by providing a thorough overview of the `Google
    Classroom App`. Part of Google Apps for Education (GAfE), `Google Classroom` was
    specifically designed to help teachers save time by streamlining the process of
    going digital. Complete with screenshots, `50 Things You Can Do with Google Classroom`
    provides ideas and step-by-step instructions to help teachers implement this powerful
    tool.


    ![dbc_50TFGC](Images/dbc_50TFGC.jpg)


    # 50 Things to Go Further with Google Classroom


    ### A Student-Centered Approach


    #### By Alice Keeler and Libbi Miller ([@alicekeeler](https://twitter.com/alicekeeler),
    [@MillerLibbi](https://twitter.com/MillerLibbi))


    Today’s technology empowers educators to move away from the traditional classroom
    where teachers lead and students work independently—each doing the same thing.
    In `50 Things to Go Further with Google Classroom: A Student-Centered Approach`,
    authors and educators Alice Keeler and Libbi Miller offer inspiration and resources
    to help you create a digitally rich, engaging, student-centered environment. They
    show you how to tap into the power of individualized learning that is possible
    with `Google Classroom`.


    ![Master the Media](Images/dbc_MTM.jpg)


    # Master the Media


    ### How Teaching Media Literacy Can Save Our Plugged-in World


    #### By Julie Smith ([@julnilsmith](https://twitter.com/julnilsmith))


    Written to help teachers and parents educate the next generation, `Master the
    Media` explains the history, purpose, and messages behind the media. The point
    isn’t to get kids to unplug; it’s to help them make informed choices, understand
    the difference between truth and lies, and discern perception from reality. Critical
    thinking leads to smarter decisions — and it’s why media literacy can save the
    world.


    ![The Writing on the Classroom Wall](Images/dbc_TWOTCW.jpg)


    # The Writing on the Classroom Wall


    ### How Posting Your Most Passionate Beliefs about Education Can Empower Your
    Students, Propel Your Growth, and Lead to a Lifetime of Learning


    #### Steve Wyborney ([@SteveWyborney](https://twitter.com/SteveWyborney))


    In `The Writing on the Classroom Wall`, Steve Wyborney explains how posting and
    discussing Big Ideas can lead to deeper learning. You’ll learn why sharing your
    ideas will sharpen and refine them. You’ll also be encouraged to know that the
    Big Ideas you share don’t have to be profound to make a profound impact on learning.
    In fact, Steve explains, it’s okay if some of your ideas fall off the wall. What
    matters most is sharing them.


    ![Kids Deserve It](Images/dbc_KDI.jpg)


    # Kids Deserve It!


    ### Pushing Boundaries and Challenging Conventional Thinking


    #### Todd Nesloney and Adam Welcome ([@TechNinjaTodd](https://twitter.com/TechNinjaTodd),
    [@awelcome](https://twitter.com/awelcome))


    In `Kids Deserve It!`, Todd and Adam encourage you to think big and make learning
    fun and meaningful for students. Their high-tech, high-touch, and highly engaging
    practices will inspire you to take risks, shake up the status quo, and be a champion
    for your students. While you’re at it, you just might rediscover why you became
    an educator in the first place.


    ![The Classroom Chef](Images/dbc_TCC.jpg)


    # The Classroom Chef


    ### Sharpen your lessons. Season your classes. Make math meaningful.


    #### By John Stevens and Matt Vaudrey ([@Jstevens009](https://twitter.com/Jstevens009),
    [@MrVaudrey](https://twitter.com/MrVaudrey))


    In `The Classroom Chef`, math teachers and instructional coaches, John Stevens
    and Matt Vaudrey, share their secret recipes, ingredients, and tips for serving
    up lessons that engage students and help them”get”math. You can use these ideas
    and methods as-is, or better yet, tweak them and create your own enticing educational
    meals. The message the authors share is that, with imagination and preparation,
    every teacher can be a Classroom Chef.


    ![Ditch That Textbook](Images/dbc_DTT.jpg)


    # Ditch That Textbook


    ### Free Your Teaching and Revolutionize Your Classroom


    #### By Matt Miller ([@jmattmiller](https://twitter.com/jmattmiller))


    Textbooks are symbols of centuries of old education. They’re often outdated as
    soon as they hit students’ desks. Acting “by the textbook” implies compliance
    and a lack of creativity. It’s time to ditch those textbooks — and those textbook
    assumptions about learning! In `Ditch That Textbook`, teacher and blogger Matt
    Miller encourages educators to throw out meaningless, pedestrian teaching and
    learning practices. He empowers them to evolve and improve on old, standard teaching
    methods. `Ditch That Textbook` is a support system, toolbox, and manifesto to
    help educators free their teaching and revolutionize their classrooms.


    ![dbc_YSR](Images/dbc_YSR.jpg)


    # Your School Rocks…So Tell People!


    ### Passionately Pitch and Promote the Positives Happening on Your Campus


    #### By Ryan McLane and Eric Lowe ([@McLane_Ryan](https://twitter.com/McLane_Ryan),
    [@EricLowe21](https://twitter.com/EricLowe21))


    Great things are happening in your school every day. The problem is: no one beyond
    your walls knows about them. In `Your School Rocks…So Tell People!`, school principals
    McLane and Eric Lowe offer more than seventy actionable tips along with easy-to-follow
    instructions and links to video tutorials. This practical guide will equip you
    to create an effective and manageable communication strategy using social media
    tools. Learn how to keep your students’ families and community connected, informed,
    and excited about what’s going on.


    ![How Much Water Do Have](Images/dbc_HMW.jpg)


    # How Much Water Do We?


    ### 5 Success Principles for Conquering Any Change and Thriving in Times of Change


    #### by Pete Nunweiler with Kris Nunweiler


    In `How Much Water Do We?`, Pete Nunweiler identifies five key elements — information,
    planning, motivation, support, and leadership — that are necessary for the success
    of any goal, life transition, or challenge. Referring to these elements as the
    `5 Waters of Success`, Pete explains that like the water we drink, you need them
    to thrive in today’s rapidly paced world. If you’re feeling stressed out, overwhelmed,
    or uncertain at work or at home, pause and look for the signs of dehydration.
    Learn how to find, acquire, and use the `5 Waters of Success` — so you can share
    them with your team and family members.


    ![Instant Relevance](Images/dbc_IR.jpg)


    # Instant Relevance


    ### Using Today’s Experiences in Tomorrow’s Lessons


    #### By Denis Sheeran ([@MathDenisNJ](https://twitter.com/MathDenisNJ))


    Every day, students in schools around the world ask the question, “When am I ever
    going to use this in real life?” In Instant Relevance, author and keynote speaker
    Denis Sheeran equips you to create engaging lessons from experiences and events
    that matter to your students. Learn how to help your students see meaningful connections
    between the real world and what they learn in the classroom—because that’s when
    learning sticks.


    ![LAUNCH](Images/dbc_LAUNCH.jpg)


    # LAUNCH


    ### Using Design Thinking to Boost Creativity and Bring Out the Maker in Every
    Student


    #### John Spencer and A.J. Juliani ([@spencerideas](https://twitter.com/spencerideas),
    [@ajjuliani](https://twitter.com/ajjuliani))

