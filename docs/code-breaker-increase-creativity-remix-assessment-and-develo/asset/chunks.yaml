    ![](Images/code-breaker-cover.jpg)


    # Praise for *Code Breaker*


    “Brian Aspinall puts a very human face on coding and helps the reader understand-`it`
    is not just for the computer geeks, but can be implemented for all grade levels
    in meaningful ways that help us see our world in a different way.”


    ** — George Couros, author of *The Innovator’s Mindset* **


    “Brian Aspinall passionately makes the case for coding and computational thinking
    in all classrooms using a variety of practical examples. It’s not just about writing
    lines or placing blocks of code, it’s about getting students to think about the
    curriculum in new and interesting ways using modern tools like `Scratch` and `Minecraft`.
    This book is for everyone who has ever asked, ‘Why should I care about coding?’
    By the end of the story of the pooping baby, you will know why!”


    ** — Matthew Oldridge, speaker, writer, and mathematics educator**


    “This book is a must for anyone looking to thoughtfully integrate coding into
    curriculum beyond the [#HourofCode](https://twitter.com/hashtag/HourofCode). Brian
    not only provides a unique outlook on how we should view coding in the classroom,
    but shares tremendous insights into how to innovate the use of coding in learning
    beyond academic success or helping students be prepared to ‘get a job.’ With creative
    lessons masterfully woven throughout the book, this is a read that is set to inspire
    and guide anyone looking to infuse more creativity into classroom learning.”


    ** — Michael Cohen, speaker, innovation consultant, and author of *Educated by
    Design* **


    “Brian Aspinall has created a valuable resource that not only will help educators
    deepen their understanding of computer coding, but one that makes the case for
    how all educators can use the concepts of computational thinking to shape their
    pedagogy and instructional practices to increase student learning.”


    ** — Laura Fleming, library media specialist and author of *Worlds of Making*
    **


    “This book is a must-read for any teacher interested in learning more about the
    rationale for teaching coding in class and how to begin. With sample lesson plans
    and personal stories with his students, Brian Aspinall breaks down how to use
    coding principles in many subject areas, including math, geometry, algebra, science,
    and language arts. I particularly enjoyed the chapter where he interviewed other
    classroom teachers who are teaching coding with success with students as young
    as kindergarten! I have admired Brian for many years for his ability and determination
    to convince teachers about the importance of coding in any curriculum. It was
    a pleasure to read about his journey with teaching, who influenced him along the
    way, and what he believes today’s classroom should look like.”


    ** — Sylvia Duckworth, speaker, tech coach, and author of *Sketchnotes for Educators*
    **


    “When I think of coding in the classroom, one of the first names that comes to
    my mind is Brian Aspinall. This little book is a great tool to have at your disposal
    and to share with others! Tips, stories, and so much more make this book a must-buy!”


    ** — Todd Nesloney, award-winning educator and co-author of the book *Kids Deserve
    It* **


    “Teachers are eager to get started coding in the classroom and this is the perfect
    quick and easy guide! Aspinall walks us through the foundational theory of maker
    education and leads the reader through introductory coding lessons both with and
    without a computer.”


    ** — Colleen Graves, co-author of *The Big Book of Makerspace Projects* and *20
    Makey Makey Projects for the Evil Genius* **


    “Brian Aspinall is an exemplary computer science teacher and valued member of
    the global computer science community. I have always viewed Brian as my go-to
    person when it comes to coding, and, more importantly, the pedagogy around coding.
    Brian’s book, *Code Breaker*, provides an incredibly valuable context for anyone
    interested in teaching coding, already teaching coding, or for that matter, teaching
    in general. The book tackles the more important question of ‘Why coding?’ rather
    than simply serving as another book on how to code. I am admittedly not much of
    a reader but Aspinall’s book is an easy and engaging read. The engaging part makes
    perfect sense as you delve into Brian’s philosophy on teaching. In the book, Brian
    coins the term, ‘classroom engagement’ (compared to classroom management) and
    this notion of creating a truly engaging environment for students is at the heart
    of the book. Dig in and you will get a glimpse at where Aspinall developed an
    interest in teaching as well as his evolved approach to teaching and learning.
    The book provides the reader the feeling of being on the journey with Brian through
    his conversational tone and witty storytelling. I mean, the book starts with the
    story of how one student’s fascination with poop led to his mastery of geometry
    and coding.


    “I have been following Brian for some time and have grown quite fond of his work.
    I am glad to consider him a colleague, role model, and friend. Brian has always
    been accessible and willing to engage in discussions related to his (and my) passion.
    It is no surprise that his book provides a wonderful overview of his approach
    to teaching and his evolution as an amazing educator. The book is inspiring, just
    like the author. His passion comes right off of the pages, and as you read you
    feel yourself transforming as a teacher and a student. Brian’s approach to the
    world of coding takes us away from the analytical, robotic thoughts many have
    about coding and into the human, logical side of why coding and problem solving
    are so important in education. Kudos to Brian for allowing his true self to come
    through his writing. A must-read whether you’re interested in coding or just a
    great outlook on pedagogy and the notion of engaging students in the learning
    process.”


    ** — Steven Isaacs, teacher, Minecraft mentor, and Minefaire producer, **


