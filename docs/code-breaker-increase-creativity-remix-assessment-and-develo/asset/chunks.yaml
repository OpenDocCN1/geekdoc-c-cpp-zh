    我希望这本书能帮助你看到计算思维的理论如何应用到你的课堂，无论你是否像我一样是一个计算机科学极客。我希望你能够思考并反思你自己的教学法，或许也可以对其提出挑战。`Hello
    World` 并不是一本操作手册。你是你，我是我。我不了解你的学生。在我的课堂上有效的方法在你的课堂上可能无效，这没关系。你可能也有一些东西可以教给我。伟大的老师是那些不断学习的人。


    小时候，我的爷爷（Poppa）是我最喜欢的老师之一。他教我如何混合化学品，如何改变变量并观察不同的结果。这种发现发现的方法在许多方面与编程相似：尝试、观察、再次尝试、失败、再次尝试、成功。我希望数学课也能那样。爷爷还是一名地质学家，他教我如何识别旁黄和其他矿物。他这种亲身实践的学习方法至今仍指导着我的发现与教学实践。


    你即将读到的故事基于我观察到、感知以及获得的信息。任何错误都是我个人的。让我们一起开启这段旅程吧。


