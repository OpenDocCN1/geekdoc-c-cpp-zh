    # Chapter 2


    A Wing and a Papert


    Here’s a secret: This book doesn’t belong to me.


    Sure, my name is on it as the author and all of that. But none of what you’re
    about to read is purely original. Like all teachers, I am a student. I have had
    the opportunity to learn about both computer science and teaching (Is it an art?
    A science? Both? Is this debate even helpful?). Before I share more about my personal
    approach to teaching—why I think we should teach students computational thinking,
    the role of technology in the classroom, and all that—I need to explain some of
    the theories that have shaped my understanding of education. Don’t worry—I’ll
    keep this short.


    ![line](Images/line.png)


    ### Featured Post


    #### Coding Rock Paper Scissors


    ![QR-Coding-Rock-Paper-Scissors](Images/QR-Coding-Rock-Paper-Scissors.png)


    ###### [http://brianaspinall.com/coding-rock-paper-scissors-to-teach-probability](http://brianaspinall.com/coding-rock-paper-scissors-to-teach-probability)


    ![line](Images/line.png)


    A major shift in education theory has taken place in the past decade or so. Many
    learning spaces have gone from quiet rows to loud centers. We used to think that
    a well-managed classroom was a quiet classroom. Several people, including myself,
    are questioning this assumption. I do not think these attitudes, and the ways
    of teaching that result, help produce the kind of learners we want our students
    to be: risk takers, collaborators, and critical thinkers. In fact, I think these
    “traditional” (for lack of a better word) teaching methods actually work against
    creating this sort of learner.


    I’m not alone in my beliefs about how education needs to change, and my thoughts
    aren’t new, either. Theorists have been discussing these ideas for decades.


    Consider Jean Piaget, one of the most influential child psychologists of the twentieth
    century and the father of “constructivism.” Many of us had to study his theories
    in our education courses, and for good reason! His theory attempts to describe
    how individuals, especially children, make meaning of the world based on the interactions
    between their experiences of the world and their ideas about the world. Others’
    theories of constructivism examine how an individual’s interactions with society
    influence how they understand the world; this is commonly known as “social constructivism.”
    Piaget was largely focused on the individual and genetic makeup. He wanted to
    know how individuals’ interactions with themselves influenced how they understood
    reality. He was so fascinated by this question that he observed his own children
    to help develop his theories.


    I value many things about Piaget’s theories. He emphasized the role of play in
    education, for example. His ideas about how we respond to knowledge are also quite
    helpful. He talked about the difference between “assimilation” of knowledge and
    “accommodation” of knowledge. When we assimilate knowledge, we incorporate the
    new things we have learned into our current understanding of the world, but we
    don’t change the framework through which we understand the world. Accommodation
    is different. We learn new things, but we change our framework of the world to
    adjust for this new information. Our view of the world constantly changes as a
    result of what we learn, allowing us to use failures as opportunities to learn
    and grow. This can help us take risks and think creatively because we know failure
    will not shatter our perception of the world. I try to encourage my students to
    think this way.


    But I’m not as enthusiastic about some of the other ways Piaget’s theories can
    be applied in the classroom. He spent a lot of time focusing on a child’s individual
    development, even dividing it into separate stages. These stages might help parents
    and teachers better understand how children are progressing and identify where
    they are excelling and where they might need help. We see the influence of this
    belief that children complete certain tasks in stages in many areas of classroom
    design and teaching. For example, we group students by age. We have expectations
    of what they should complete at each age level before they move on to the next.
    In education, we are always preparing for what will happen next.


    Although Piaget’s theory has substance, I can’t help but wonder whether these
    ideas of defined benchmarks set people up for a one-size-fits-all model. If we
    acknowledge kids as individuals, with their own strengths and weaknesses, constructivism
    doesn’t appear to make sense beyond simple age-appropriate benchmarks.


    But I am incredibly grateful to Piaget because his theories were influential to
    Seymour Papert, a man many consider to be the father of modern artificial intelligence.
    His book *Mindstorms*, published in 1980—the year he died—is a treasure of thoughts
    about education and helping students love learning. Papert developed a theory
    called “constructionism,” which asserts that people learn best about the world
    when they are involved in making—constructing—things in the world. To do this,
    children need to have some control over their own learning.


    Papert championed the use of computers and computer technology to teach children.
    He especially saw the value of using these technologies to teach math. For him,
    math was not just a collection of concepts to be memorized. It was more of a place:
    somewhere children could explore and learn to love. He coined the term “Mathland”—a
    place where children see math in their everyday lives. Because children can see
    how math applies to everyday tasks—including, and perhaps especially, activities
    they enjoy—they naturally come to enjoy math. Math is something to explore. Mistakes
    become a learning tool. As children learn to self-correct, they develop new ways
    to solve problems and embrace uncertainty.


