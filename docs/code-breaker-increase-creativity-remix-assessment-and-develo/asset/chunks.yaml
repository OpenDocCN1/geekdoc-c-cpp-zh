    # Chapter 4: A Peak Inside My Classroom


    I’ve used coding activities and the concepts of computational thinking to teach
    a variety of subjects. We use the logic of computational thinking a lot; we just
    don’t realize that is what we’re doing.


    I’ve written some stories about how computational thinking has found its way into
    my lessons. I want to say this happened because of my own knowledge and skill,
    but more often than not, students are the ones who’ve encouraged me to try this.
    Warning: These are not polished lesson plans. I’m not a perfect teacher, and these
    stories reflect that. But I hope they give you some ideas about how you can bring
    these concepts to your class, and how your students might encourage you to take
    these ideas even further.


    ## Math


    Computer science is about learning different languages. This first activity shows
    how to use computer science to teach literacy and numeracy. Remember, coding is
    only a snippet of computer science. I like computer science because it helps students
    practice computational thinking. Computational thinking is about breaking down
    problems and thinking in algorithms, logical reasoning, debugging, analyzing,
    simulating, and problem solving, all of which can be done without technology.


    ### Exponents, Number Patterns, and Coding


    *   Big Ideas: Exponents, Patterns, Base 10, Base 2, Order of Operations

    *   Task: Explain to students that a binary string of eight bits is a byte.

    *   eg, `10111011`—Each digit is a bit; eight bits is a byte (four bits is a nibble)

    *   Computers understand machine language (1s and 0s) and must convert it into
    “human” language.

    *   Show students an example of an ASCII table.


    ![CB-ASCII-table](Images/CB-ASCII-table.jpg)


    #### ASCII Table [http://www.asciichars.com](http://www.asciichars.com)


    *   Provide students with this “code” sheet or one you have created and have them
    “chunk” the bits into strings of eight, one byte, in the boxes underneath.


    ![CB-what-does-this-say](Images/CB-what-does-this-say.jpg)


    Their job is to follow the instructions—your lesson—and convert each eight-digit
    byte into a decimal value. They will look up the decimal value in the ASCII chart
    and find the corresponding alphabet letter. We are solving for a six-letter word
    (*Random*). Yes, it is case-sensitive.


    Once you have the fundamental understanding of how to convert binary to decimal,
    you can create some pretty unique learning opportunities. You could create scavenger
    hunts by hiding binary code around the school or behind QR codes. Maybe you want
    to support narrative writing by incorporating binary “code” into stories for readers
    to crack.


    Learning about exponents can be tricky. This method might offer some opportunities
    to scaffold and differentiate learning. You might wish to provide different students
    with different binary code. What I love most about activities like this is how
    the math is the skill needed to complete something more, something bigger. Simply
    solving a math problem isn’t the point. The math leads to something else.


    ### Using Scratch to Teach Math


    Math textbooks often teach concepts in strands and topics that are isolated from
    each other. Coding tools such as `Scratch` help a math curriculum become “spiral,”
    allowing it to show how different areas of math are connected.


    `Scratch` is ideal for this. Developed based on principles of geometry, it allows
    students to translate *sprites* (the graphical characters they create within the
    program) across a screen, store information in variables, and use number sense
    to make calculations.


    Here are some ways I’ve used `Scratch` and other coding activities to teach different
    math lessons:


    ### Factors


    When I started teaching math, I would often assign students worksheets with a
    large number of questions. That’s what I was taught to do. But I started to notice
    some patterns, and you’ve probably seen this in your classrooms. Some students
    grasp the concepts right away and finish all of their work. Others never finish
    all the questions.


    I saw this happen often when teaching students how to find the factors of a composite
    number. I often gave students questions that started with phrases such as, “List
    the factors of (certain number),” or “What are the factors of (certain number)?”
    These questions were asking students the same thing.


    After reflection, I decided I would rather have them tell me the process for finding
    the factors of a number. After all, if students could explain how to find the
    factors of one number, they could find the factors of any given number.


    ![CB-scratch](Images/CB-scratch.png)


    Here’s the tricky thing: We can easily look up how to find the factors of a number
    online. Once we had written the procedure as a class, I challenged them to plunk
    each line into `Scratch` to see whether we could build an app that can find factors


    This task provides many entry points for students, letting them work at their
    own levels. Differentiated learning is built into its design. Some students made
    an app with only the minimum requirements, but others expanded their scope. One
    student duplicated her code because she wanted her app to find the greatest common
    factor. Her app even told me that 11 is a prime number.


    As an aside, having students write out a problem-solving process or procedure
    can also work well in a language arts class.


    ### Geometry


    Our experience with the factors app motivated me to incorporate computational
    thinking into my geometry units. These activities work especially well with location
    and movement.


    You could create a pseudo code as a class. It might look like this:


    ![CB-geometry-1](Images/CB-geometry1.png)

    ![CB-geometry-2](Images/CB-geometry-2.png)

    ![CB-geometry-3](Images/CB-geometry-3.png)

    ![CB-geometry-4](Images/CB-geometry-4.png)


    After you’ve made the block code language the whole class will use, you can create
    unique tasks using principles of geometry. You can challenge students to “code”
    each other. Pair them up and assign one student to be the robot and one the coder.
    It is the coder’s job to navigate the robot (FriendBot) around an obstacle course
    in the classroom or hallway. Challenge them to code their FriendBots to deliver
    a message to the principal.


    Alternatives to this task might include having students create games using grid
    paper. Allow students opportunities to create something at their level to challenge
    their friends.


    Ultimately, the goal is to view location and movement as an algorithm.


    ### Probability


    I always find it hard to teach experimental and theoretical probability.


    Early in my career, I would distribute coins and ask kids to make a T-chart. We
    would flip the coin once and record results. We’d flip it twice and record results.
    We’d then flip it three times and record results. Nobody would have fifty-fifty
    as a result because we had only flipped three times. I would then ask students
    to flip the coins a dozen or so times and record their results.

