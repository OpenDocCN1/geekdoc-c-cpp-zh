    ## Five-Year-Olds Coding Without Technology


    I haven’t just learned about teaching from my own colleagues. I have also had
    the privilege to hear from educators around the world.


    In the previous chapter, I talked about how you can use coding concepts to teach
    your students about location by having them “code” each other. Here’s an example
    of how a teacher applied a similar concept to teaching young students about language.


    Melissa Dann ([@meld70](https://twitter.com/meld70)) is a prep teacher in Melbourne,
    Australia, who has begun exploring the concepts of coding with her five-year-old
    students. She sent me an email reflecting on her practice. I’ve copied it in full
    below, with her permission:


    Hi Brian,


    Here is a quick overview of what’s been happening in my classroom teaching coding
    to five-year-olds. (Just a reminder that we have been at school for twelve weeks—it’s
    amazing!)


    **Game: Robots and Programmers**


    Children work in pairs. One child is the Robot. The other is the Programmer.


    Language development is an important part of the activity. Programmers can ask
    Robots to take steps, turn, jump, hop, etc. Programmers cannot ask their Robots
    to do anything dangerous. Programmers must say “please” or the Robot will not
    respond. This is similar to the game Simon Says, where the children don’t respond
    unless the command is prefaced with “Simon says,” and saying “please” is just
    good manners.


    ```

    Programmer: Take 10 steps.

    Robot: You didn’t say ‘Robot, please.’

    Programmer: Robot, please take 10 steps.

    Robot: 1,2 …10.

    Programmer: Robot, please turn a quarter.

    Robot: Which way?

    Programmer: (Using spinner, turns spinner) That way, right. (pointing right)

    Programmer: Robot, please turn a whole circle.

    Programmer: Robot, please take 4 steps backwards.

    Robot: 1, 2, 3, 4

    Programmer: Robot, please take 5 plus 3 steps.

    Robot: How many is that? (Programmer and Robot count on their fingers, 5 plus
    3.)

    ```


    After playing this game the first time, it became apparent that we needed a way
    to decide how far a turn was, eg, `¼ turn`, `½ turn`. So we made spinners with
    ¼ turn, ½ turn, and full turn and that showed left and right. This is still a
    difficult concept, but I am persevering. We also started using `Bee-Bot` on Friday,
    and the spinners were helpful as each press of the turn button on the `Bee-Bot`
    is a quarter turn.


    We have also played outside on the playground, and this led to a lot more use
    of location language.


    It has been interesting to watch the dynamics between the pairs of children. As
    with all activities, some groups were very focused, others not so. One group was
    very silly until the children swapped roles, and then they were much more focused.
    One child, who was the Programmer first, had found it very hard to be the Programmer
    and think of things to ask their partner to do; hence the lack of focus. But when
    they swapped roles, they had enjoyed being a Robot.

