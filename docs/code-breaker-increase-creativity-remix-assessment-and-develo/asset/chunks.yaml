    # 第 4 章：一窥我的课堂


    我曾使用编程活动和计算思维的概念来教授各种学科。我们经常使用计算思维的逻辑；我们只是没有意识到自己正在做这一点。


    我写了一些关于计算思维如何进入我的课程的故事。我想说，这些发生是因为我自己的知识和技能，但更多时候，是学生鼓励我尝试这样做。警告：这些并不是完善的教案。我不是一个完美的老师，这些故事反映了这一点。但我希望它们能给你提供一些灵感，关于你如何将这些概念带入课堂，以及你的学生如何鼓励你将这些想法推得远。


    ## 数学


    计算机科学是关于学习不同的语言。第一个活动展示了如何使用计算机科学来教授读写和计算能力。记住，编码只是计算机科学的一个片段。我喜欢计算机科学是因为它可以帮助学生练习计算思维。计算思维关于分解问题并以算法、逻辑推理、调试、分析、模拟和解决问题的方式思考，这一切都可以在没有技术的情况下完成。


    ### 指数、数字模式与编码


    *   核心概念：指数、模式、十进制、二进制、运算顺序

    *   任务：向学生解释一个八位的二进制字符串是一个“字节（byte）”。

    *   例如，`10111011`——每个数字都是一个位（bit）；八位是一个字节（四位是一个半字节/nibble）。

    *   计算机理解机器语言（1 和 0），并必须将其转换为“人类”语言。

    *   向学生展示 ASCII 表格示例。


    ![CB-ASCII-table](img/CB-ASCII-table.jpg)


    #### ASCII 表 [`www.asciichars.com`](http://www.asciichars.com)


    *   为学生提供这张“代码”表或你创建的表格，让他们在下方的框中将位“分块”成八位一组的字符串（即一个字节）。


    ![CB-what-does-this-say](img/CB-what-does-this-say.jpg)


    他们的工作是遵循指令——即你的课程——并将每个八位字节转换为十进制值。他们将在 ASCII 图表中查找十进制值并找到对应的字母字母。我们正在解的是一个六字母的单词（*Random*）。是的，它是区分大小写的。


    一旦你对如何将二进制转换为十进制有了了基础的理解，你就可以创建一些非常独特的学习机会。你可以通过在学校里或 QR 后面隐藏二进制代码来创建寻宝游戏。也许你可能想通过将二进制“代码”融入故事让读者破译，来支持叙事性写作。


    学习指数可能是困难的。这种方法可能提供一些脚手架和差异化学习的机会。你可能希望为不同的学生提供不同的二进制代码。我最喜欢这类活动的一点是，数学是完成更多事情、更伟大事情所需的技能。仅仅解决一道数学题并不是重点。数学通向其他东西。


    ### 使用 Scratch 教授数学


    数学教科书通常以相互孤立的线索和主题教授概念。像 `Scratch` 这样的编程工具可以帮助数学课程变得“螺旋式”，让它展示数学不同领域之间是如何联系的。


    `Scratch` 非常适合用于此。它基于几何原理开发，允许学生在屏幕上移动*角色*（sprites，他们在程序中创建的图形化角色），在变量中存储信息，并使用数感进行计算。


    以下是我用 `Scratch` 和其他编程活动教授不同数学课程的一些方法：


    ### 因数


    当我开始教数学时，我经常会给学生布置包含大量问题的练习题。那是我被教要那样做的。但我开始注意到一些模式，你可能在你的教室里也见过这种情况。有些学生立刻理解概念并完成所有的作业。另一些学生从未做完所有问题。


    在教学生如何找到合数的因数时，我经常看到这种情况。我经常给学生给出以这些短语开头的问题，例如，“列出（某数）的因数”，或“(某数）的因数是什么？”这些问题在问学生相同的问题。


    反思之后，我决定我愿意让他们告诉我寻找一个数字因数的步骤。毕竟，如果学生能够解释如何找到一个数的因数，他们就能找到任何给定数的因数。


    ![CB-scratch](img/CB-scratch.png)


    困难的地方在于：我们可以很容易在网上查到如何找到一个数的因数。一旦我们在全班写好了程序，我挑战他们将每一行代码输入到 `Scratch`，看看我们是否可以构建出一个可以寻找因数的应用程序。


    这项任务为学生提供了许多切入点，让他们按照自己的水平工作。差异化学习被构建在设计中。有些学生制作了符合最低要求的程序，但另一些人扩展了范围。一个学生复制了代码，因为她想让她的程序找到最大公因数。她的程序甚至告诉我
    11 是质数。


    顺便提一下，让学生写出解决问题的过程在语言课上同样有效。


    ### 几何


    我们在因数方面的经验促使我将计算思维引入几何单元。这些活动对于位置和移动特别有效。


    你可以全班创建一个伪代码。它看起来像这样：


    ![CB-geometry-1](img/CB-geometry1.png)

    ![CB-geometry-2](img/CB-geometry-2.png)

    ![CB-geometry-3](img/CB-geometry-3.png)

    ![CB-geometry-4](img/CB-geometry-4.png)


    在制作全班使用的块代码语言之后，你可以利用几何原理创建独特任务。你可以挑战学生互相“编码”。让他们分成小组，指定一个学生作为机器人，作为编码员。编码员的工作是引导机器人（FriendBot）通过教室或走廊里的障碍赛。挑战他们编写让
    FriendBot 向校长传递信息。


    这项任务的替代方案可能包括让学生使用网格纸创建游戏。让学生有机会创建他们水平的内容来挑战朋友。


    最终，目标是将位置和移动视为一种算法。


    ### 概率


    我总是很难教授实验概率和理论概率。


    在职业生涯早期，我会分发硬币并让孩子做一个 T 图表。我们掷一次硬币并记录结果。我们掷两次并记录结果。然后我们掷三次并记录结果。没有人会有百分之五十的结果，因为我们只掷了三次。然后我会要求学生掷硬币几十次并记录他们的结果。


    '
- fmt: "\nMy goal was always to get them to construct their own knowledge of probability\
    \ through this process. In reality, the lesson turned the classroom into a noisy\
    \ jungle with change flying across the room. Students pretended to care but were\
    \ not engaged in the activity. It wasn’t until a student presented the idea of\
    \ coding a `coin-flipping simulator` that my mindset changed. I assigned him the\
    \ task and told him he would be a superstar if he could pull it off.\n\nFor the\
    \ next few days, he spent most of math class working on what today we would call\
    \ his “passion project.” His parents reported that he also worked on it at home.\
    \ But I didn’t realize how engaged he’d become in the project until he and his\
    \ friends showed up at school to present the final project before classes had\
    \ started for the day. He assured me the simulator worked, and I asked him what\
    \ he would like to do with it.\n\n![CB-coin-flipper](Images/CB-coin-flipper.png)\n\
    \n“Let’s flip the coin a million times,” he said with an evil tone.\n\n“Yes, yes,”\
    \ I replied with an equally dark tone. “Let’s do that.”\n\nI dedicated the `SMARTBoard`\
    \ computer to his simulator, and we began to watch it run. What is most significant\
    \ about this story is just how engaged these boys had become with a math assignment.\
    \ They tried to sneak a peek whenever they could. They stayed in at recess and\
    \ even stayed after school. Unfortunately, his coin flipper only made it to roughly\
    \ `700,000` flips by the end of the day. But the results were fifty-fifty to about\
    \ the ninth decimal place. I looked at them in astonishment and began to explain\
    \ the `Law of Large Numbers`.\n\nMy explanation wasn’t needed.\n\n“Yeah, yeah,\
    \ we get it,” they said, and off home they went.\n\n## Algebra and Minecraft\n\
    We often teach growing patterns in algebra by standing in front of a class and\
    \ projecting images onto the screen. We use the images to help discuss equations.\n\
    \n![CB-growing-block-pattern](Images/CB-growing-block-pattern.png)\n\nIn the traditional\
    \ sense, I wanted students to use words to explain how this pattern was growing.\
    \ `Figure 1` has five tiles. `Figure 2` has nine. `Figure 3` has thirteen. Using\
    \ these data, we can create an algebraic equation to determine how many tiles\
    \ will be in each figure.\n\n| Term # | Term Value |\n| :--- | :--- |\n| 1 | 5\
    \ |\n| 2 | 9 |\n| 3 | 13 |\n\n### Pattern Rule: 4n + 1\nHere’s the problem: My\
    \ old-school pedagogy attempted to force students to see this growing pattern\
    \ as I did. In fact, if they didn’t create this table of values, I would have\
    \ marked their work incorrect.\n\nI didn’t change my thinking until a student\
    \ suggested that each figure was actually a pyramid and not flat. You could hear\
    \ the brain matter shift as my mind was blown. The student then suggested he build\
    \ this growing pattern as he saw it, using `Minecraft`. Immediately, I felt ashamed.\
    \ The pattern could be extended in an infinite number of ways. If students saw\
    \ it differently than I did, that was OK. I felt as though I had let previous\
    \ students down by not allowing them to show me this concept through a different\
    \ lens.\n\n![CB-minecraft](Images/CB-minecraft.png)\n\nThis concept also helped\
    \ me teach spatial sense in a much deeper way. I asked the student whether the\
    \ middle cube was still a constant in the pyramid, as it was in the flat image.\
    \ I should have known what was coming.\n\nI immediately raced home, hoping to\
    \ change my plans for the following day. I soon realized that all learners should\
    \ have the opportunity to design, build, and extend growing patterns as they see\
    \ fit—as long as they can generate a table of values and an algebraic equation.\
    \ We spent the next week or so designing `Minecraft` games in which kids built\
    \ castles that contained different growing patterns. Players had to solve the\
    \ growing pattern and find the appropriate sign before heading to the next room.\
    \ The mazelike scenarios allowed all students to learn because they were naturally\
    \ designed for scaffolding and differentiated learning.\n\n## Science\nThe real\
    \ teachers in this story are my Grade 8 students. As a science teacher, I’ve always\
    \ loved teaching the `particle theory`. Granted, I haven’t always approached the\
    \ topic in the most exciting way. I used to make students memorize the criteria.\
    \ I’m sure some of you can say them with me:\n\n- Particles have spaces between\
    \ them.\n- Particles are attracted to each other.\n- Particles are always moving.\n\
    - Particles speed up and spread apart when heated.\n\nIt’s pretty routine stuff.\
    \ But one day, I witnessed a student have the biggest “Aha!” moment I’ve ever\
    \ seen. As we looked over the textbook, I mentioned the squiggly lines and suggested\
    \ that meant movement. I will never forget what happened next.\n\n“You mean those\
    \ particles are moving?” yelled a boy from the back.\n\nYet again, I was ashamed.\
    \ I had been butchering the `particle theory` for years by assuming kids knew\
    \ that squiggly lines in a textbook meant the particles were moving. Nope. Once\
    \ again, I was reminded that kids often see the world differently.\n\nI asked\
    \ him to code the `particle theory` instead of memorize a list of bullet points.\
    \ I wanted him to learn the list as a result of the coding process. \n\nAfter\
    \ all, if he could simulate moving particles that speed up and spread apart with\
    \ heat, we were golden.\n\nI mentioned before how `Scratch` uses principles of\
    \ geometry to work, how it can help connect various strands within one subject.\
    \ It’s also great for showing how completely different subjects relate to one\
    \ another.\n\nConsider this student’s simulator. The student moved particles (science)\
    \ by plotting them on a `Cartesian grid` using random coordinates (geometry).\n\
    \nTalk about cross-curricular!\n\n## Language Arts\nConditional statements, also\
    \ known as `Boolean logic`, are fundamental components to computer science. They’re\
    \ also a big part of how we write procedures. Here is a great way to teach conditional\
    \ statements in primary class.\n\n### “Traditional” Procedure for Brushing Teeth\n\
    - Get your toothbrush.\n- Get the toothpaste and apply a small dab to the brush.\n\
    - Turn your toothbrush to 45-degree angle and brush back and forth, beginning\
    \ with your molars.\n- Repeat the third step for all other teeth.\n- Turn on tap.\n\
    - Fill a cup with water.\n- Turn off tap.\n- Drink water. Swish water around your\
    \ mouth.\n- Spit out toothpaste.\n- Clean sink\n\nTake this procedure and break\
    \ it into modules. Each module is a small procedure on its own, and you can scaffold\
    \ groups of kids accordingly. The goal here is to write the algorithm for brushing\
    \ teeth as a class. Each group provides a module of instruction. Each module depends\
    \ on other modules to make this work.\n\nTo further challenge students and teach\
    \ them about equity, ask an additional question: “What if we don’t have toothpaste?”\
    \ (Quite a few things need to be in place before someone can write a procedure\
    \ about how to brush her teeth. One is, of course, toothpaste.)\n\n```\nIf (HaveToothpaste)\
    \ -> BrushTeeth()\n// BrushTeeth is a module\nElse (GetToothpaste)\n// GetToothpaste\
    \ is a module\n```\n\nThis example requires two different modules or procedures.\
    \ Expanding on them would look something like this:\n\n```\nGetToothpaste(\n \
    \ if(HaveNeighbors) -> GoToNeighborsHouse()\n  // Another module or procedure\n\
    \  else(\n    if(HaveVehicle) -> DriveToStore()\n    // Another module or procedure\n\
    \  )\n)\n```\n\nSome modules are easier to write than others. It can be difficult\
    \ to think in algorithms at first, but it becomes more natural the more you do\
    \ it. For example, the popular board game Monopoly is full of algorithms.\n\n\
    ```monopoly\nif (PassGo) -> Collect $200\nif (InJail)\n  if(RollDoubles) -> GetOutOfJail\n\
    \  else(StayInJail)\n```\n"
