    If you’ve missed me saying this before, let me repeat myself: Computer science
    is not only coding, and coding should not be limited to computer class.


    I recognize that computer class is a separate class in some schools and that some
    of you might only want my advice on teaching coding. So here are some of my thoughts
    on how to teach code. I’ve created a continuum with four phases: `BOSC`.


    ![CB-bosc](Images/CB-bosc.png)


    ### B: Bot coding


    Under Bot coding, teachers and students learn about block code. They run through
    games and tutorials to move objects from one point to another to complete a task.
    Levels are scripted, and there is no open space, just a linked set of block code
    instructions to move a bot. Bot coding is a great place to model math concepts
    such as estimating distance and moving across a grid.


    ### O: Open-space coding


    In this category, coders are familiar with block code and understand how to link
    it. Using tools such as `ScratchJr`, `Hopscotch`, and `Scratch`, coders use block
    code to create games, stories, and simulations. Possibilities are endless, but
    coding modules are limited to the functions within the app itself.


    ### S: Syntax coding


    Like open-space coding, users start with a blank slate and begin to think critically,
    solve problems, and code applications using syntax. Coders at this level are learning
    language. They’re making the language of coding work on their own. This gives
    them many more opportunities to be creative.


    ### C: Collaborative coding


    Coders at this level have a firm understanding of syntax, computational thinking,
    and logical reasoning. They use existing frameworks and `APIs` (Application Program
    Interfaces) to make improvements to existing applications. These coders also make
    use of open sources and build applications. They are, simply, coder ninjas.


    # Chapter 5: How Other Teachers Do It


    I’ve talked a lot about collaboration in this book and how it is important for
    students and teachers to learn from each other. With that in mind, I have included
    a few stories from other teachers about how they are incorporating these concepts
    into their classes. I’ve learned a great deal from these educators, and I hope
    you do as well.


    ## Grade 1 Coding Experts


    Jessica Konecny ([@MrsKonecny](https://twitter.com/MrsKonecny)) teaches Grade
    1 in Chatham, Ontario, Canada. She is always willing to try new things. When she
    started exploring coding with her students, I immediately became interested. I
    teach Grade 8, so I wanted to know what it’s like teaching coding in the primary
    grades. Here’s what Jessica told me in an email interview:


    ### ***What made you decide to try coding with your Grade 1 class?***


    Our school has talked a lot about the benefits of coding, and we had Grade 8 students
    do a workshop to teach us how to use `Minecraft`. I decided to give coding a try
    due to Twitter. There was a week dedicated to [`#HourOfCode](https://twitter.com/hashtag/HourOfCode).


    ![line](Images/line.png)


    ### Featured Post


    #### Unplugging the Hour of Code Part 2


    ![QR-Unplugging-the-Hour-of-Code-Part-2](Images/QR-Unplugging-the-Hour-of-Code-Part-2.png)


    ###### [http://brianaspinall.com/unplugging-the-hour-of-code-part-2](http://brianaspinall.com/unplugging-the-hour-of-code-part-2)


    ![line](Images/line.png)


    ### ***What have you noticed as a result?***


    Students are very engaged in the process of coding. They are more willing to make
    mistakes and debug problems rather than give up. Some of my students that struggle
    with math have been able to demonstrate a strong sense of spatial awareness, which
    is generally a difficult topic. Experts have arisen that the students naturally
    go to for help.


    ### ***You had students code in the physical space using linking cubes. Can you
    tell me about that?***


    While searching [`#HourOfCode](https://twitter.com/hashtag/HourOfCode) on Twitter,
    I saw pictures of another Grade 1 teacher, [@avivaloca](https://twitter.com/avivaloca),
    using the app `Lightbot`. I downloaded it onto my tablet and for that week I put
    it under the `HoverCam`, and we solved levels as a class. We started by having
    one student try at a time, and then we used white dry-erase boards for the whole
    class to code individually before they checked their work. It was a great week!
    The students loved the app, and many put it on their own devices at home. While
    it was successful, I didn’t know how to apply it to the curriculum at that time,
    so we stopped after a week.


    We recently started a geometry unit in math that included `2D` and `3D` shapes,
    as well as spatial awareness with direction. We also started a structure unit
    in Science and discussed how to make a stable structure. That’s when `Lightbot`
    came back in full force! Groups used pictures from each level to make the structures
    out of snap cubes. Then they wrote the code onto sticky notes. Eventually students
    built the `Lightbot` structures, wrote the code, and checked their work individually.
    Now we are finishing making our own stable structures and coding directions to
    light up specific cubes in two different ways. Students demonstrate their knowledge
    at their level, and we cover both math and science.


    ### ***Where do you see your students taking this?***


    With `Lightbot`, we plan to show other classes in the school our work. We have
    also been Tweeting out our progress, which has resulted in new connections and
    great feedback. Our goal is to have a coding night for our parents to see our
    work.


    Our next goal is to use `ScratchJr` to animate our narratives and enhance our
    Social Studies ideas.


    ### ***Finally, is there any other information you’d like us to know about this
    project and approach?***


    I didn’t know anything about coding before I tried this. I used trial and error,
    which was great for my class to experience. Oftentimes, they were teaching me
    a faster or easier way to work the program.

