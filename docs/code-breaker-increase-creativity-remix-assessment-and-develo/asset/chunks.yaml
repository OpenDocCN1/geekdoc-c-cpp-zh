    Papert believed education should be concrete, that students should see how concepts
    in the classroom apply to their lives outside of the classroom. He thought computers
    were a good tool to teach this. He developed `Logo Turtle`, a program in which
    users create line graphics by entering commands. If this sounds similar to `Scratch`,
    a coding program that allows children to make characters by putting blocks of
    text together, don’t be surprised. Papert worked at `MIT—the same place where
    Mitch Resnick developed `Scratch`.


    But Papert was saddened by the use of computer labs—restricting computers, and
    students’ use of those computers, to a specific location. He believed that was
    simply applying old methods of teaching with new technology. He was, in many respects,
    ahead of his time. In later years, he expressed sadness that so many people were
    slow to adopt his ideas or seemed to misunderstand them. But some people did understand
    them.


    One of those is Jeannette Wing, an `MIT` graduate and corporate vice president
    of research at Microsoft. In 2006, she introduced the term `computational thinking`,
    a synergy between the human mind and the power of machines. She noted that the
    widespread use of computers made it necessary for everyone to learn how to think
    in this way. This was similar, she said, to the way the printing press influenced
    education. That technology made it essential that everyone learn to read, write,
    and do basic math. “Computational thinking is a fundamental skill for everyone,”
    she wrote.


    ![line](Images/line.png)


    ### Featured Post


    #### What is Computational Thinking?


    ![QR-What-is-Computational-Thinking](Images/QR-What-is-Computational-Thinking.png)


    ###### [http://brianaspinall.com/what-is-computational-thinking](http://brianaspinall.com/what-is-computational-thinking)


    ![line](Images/line.png)


    But Wing stressed that teaching computational thinking was not the same as teaching
    computer coding. Coding was an application of computational thinking. Humans might
    use computers to express their computational thinking, but, she said, computational
    thinking is not about how computers think—it’s actually about how humans think.


    Wing outlined many characteristics of computational thinking. It is about conceptualizing,
    so it is more than just coding or programming. She said it is a fundamental skill,
    not a rote one. By `fundamental`, she meant a skill that everyone must know to
    function well in society. `Rote` is a way to remember or express that skill. Wing
    wrote that computational thinking is at the heart of engineering and mathematics,
    but she emphasized that all people need to learn to think this way. The ideas,
    she said, are more important than the artifacts or tools—in this case, computers—that
    express them.


    Wing wrote for an academic audience, but she wanted these ideas to grab hold outside
    of academia. She particularly wanted teachers to understand these concepts and
    pass them on to their students.


    As a teacher, I was beginning to see the value of Wing’s ideas before I learned
    about her writing or the work `MIT` had done to teach kids coding using `Scratch`.
    Her work described something I already knew to be real, something I was trying—and
    continue to try—to bring into my own teaching and classrooms.


    # Chapter 3


    ## What It Looks Like to Me


    Now that we’ve covered other people’s teaching philosophies, I want to introduce
    you to mine. Here’s what I believe:


    I believe we need to change the way we think about teaching. But that doesn’t
    mean we need to download every app, participate in every `#edchat`(https://twitter.com/hashtag/edchat),
    and post every class assignment to Instagram. Just because you’ve changed the
    technology you use in your classroom doesn’t mean you’ve changed the way you think
    about your role in the classroom. In fact, the more I think about changing my
    classroom practice, the less I think about technology.


    “But wait!” I can hear you protest. “Brian, didn’t you study computer science?
    Isn’t that what this book is about?” Yes, I studied computer science. Computer
    technology helped motivate me to become a teacher. I was programming before I
    was preparing lessons. Part of the reason I don’t think about technology much
    when I think about changing my classroom perspective is this: I don’t need to.
    Technology is such a regular part of my life, I don’t consciously consider it.
    To borrow an old question: Do fish realize they’re wet? I swim in technology.


    But to answer your second question: This book is not simply about technology.
    This book is about changing how we think about `teaching`, and sometimes that
    means learning about and using new technologies.


    Let me explain what I mean by discussing how we talk about coding. A lot of resources
    are out there to help teachers incorporate coding into their classes and teach
    students how to code. That’s great—in fact, there are some at the end of this
    book! But before you skip to those pages, we need to consider why we’re teaching
    kids to code.


    We contradict ourselves a lot as teachers. We don’t like “industrial education”
    these days. We’d rather group our classrooms into learning centers and clusters
    than have students sit in rows. We’re also moving away from worksheets and rote
    memorization. After all, the logic goes, teaching is partly about preparing students
    for the real world, and that world includes jobs. Many of these industrial teaching
    strategies were created to help students get jobs in factories. Because work has
    changed, we need to change how we teach. We need to prepare students with new
    skills for new jobs.


    We say we should teach students how to code. The Internet is connected to everything—literally,
    as the growing Internet of Things shows. With coding skills, students can get
    good jobs and be competitive in the workforce. Do you see what we’ve done here?
    Essentially, nothing. We still think the end goal of teaching is simply helping
    kids get jobs. Our reason for teaching hasn’t changed, just the materials we use.
    We say we want students to direct their learning, to be creative. And then we
    give them all the same device and tell ourselves that approach, in of itself,
    makes us creative, progressive teachers. How different is this, really, from giving
    all our students the same notebook and pencil?


    ![line](Images/line.png)


