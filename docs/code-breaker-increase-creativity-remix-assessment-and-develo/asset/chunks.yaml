  raw: '[About the Author](../Text/About-the-Author.xhtml)


    ***[#ShoutOut](https://twitter.com/hashtag/ShoutOut) to the wonderful Meagan Gillmore!
    You have a unique gift for bringing people’s ideas to print. I am forever grateful.***


    # Preface


    Remember when we used to go to the library to get information? In many ways, I
    suppose we still do. The point is, we live in an era of access. Answers to knowledge-based
    questions reside in databases and can be quickly retrieved with the touch of a
    button.


    It wasn’t always like this. Some of us remember the pre-Internet world. Many of
    us have forgotten. But even before the information age, as far back as the 1960s,
    educators used coding to teach kids by using kinesthetic activities. Reggio Emilia
    has inspired millions with play-based learning, and one of my personal heroes,
    Seymour Papert, taught geometry using a robotic turtle.


    ![CB-Coding-Sketchnote](Images/CB-Coding-Sketchnote.jpg)


    I’m what many define as a self-taught coder. I have fond memories of learning
    HTML and JavaScript in the early 1990s after watching my dad write web-based software.


    Toward the end of that decade, Y2K nearly brought the house down. Fortunately
    for a large mining company in northern Ontario, my uncle thought critically and
    wrote software to save them from going back in time. Imagine a multi-million-dollar
    business operating on one’s thoughts and ideas so that a ticking computer clock
    doesn’t roll over to 1900\. One man, one machine, one idea at the heart of the
    unearthing of a new century. Although he doesn’t gloat about the experience, this
    massive organization ran smoothly on those corrected lines of codes. He didn’t
    even ask for a promotion.


    # Chapter 1


    **The Clarity of Poop**


    A pooping baby showed me how I wanted to teach.


    It was my first year teaching a Grade 8 class, and it wasn’t exactly my dream
    job. I loved learning basic HTML as a teenager in the 1990s, and I earned an undergraduate
    computer science degree at the University of Windsor in Ontario, Canada. When
    I finished teachers’ college, also at Windsor, I hoped to teach math and computer
    science in high school, but like many new graduates, I latched onto whatever jobs
    were available in my area. It wasn’t high school or math or computer science,
    but it was a job.


    But I couldn’t kick the computer coding bug. I’d decided to become a teacher partly
    because of my experiences as a counselor at a kids’ summer technology camp. I
    wanted to share that same enthusiasm with students during the school year, so
    I started an after-school computer coding club. Students learned to code with
    Scratch, the program developed by MIT’s Mitch Resnick. Today it seems everyone
    who’s interested in teaching kids how to code uses Scratch, but this was the mid-2000s,
    years before initiatives such as Hour of Code. The software had to be installed
    on every computer, because it wasn’t web-based as it is today. And I had as much
    to learn as the students did! I had worked with Java in college and taught HTML,
    but I had never linked blocks of code together as you do in Scratch. What I might
    have lacked in experience with the program, I made up for with enthusiasm. I threw
    myself into teaching students about loops and variables, and they quickly caught
    on.


    Many of my colleagues were not as excited. They didn’t blatantly discourage me
    from pursuing the club; they were just skeptical about using computer coding as
    a teaching tool.


    Maybe I was a little skeptical too. My personality isn’t suited for worksheets
    or rote learning. I did well in my computer science courses, in part because I
    never had to memorize syntax. Still, I knew standard teaching practices favor
    memorization and rote learning. I also knew it would take creativity to show some
    people the value of coding.


    One of my students, Jaime, demonstrated this vital connection when he decided
    to code his first game. He called it “Pooping Baby.” The game involved moving
    an infant across the screen as it shot poop missiles, but it was far more than
    a gag to generate laughs: It was an application of our geometry curriculum. For
    the baby to move to the left, the student had to change the X variables to be
    negative. Moving the baby up and down required changing the Y variables. Before
    the baby could shoot poop missiles, the proper X and Y coordinates had to be plotted.
    Within that game, the concepts I’d been teaching on paper came alive on the screen—albeit
    with poop!


    ![line](Images/line.png)


    ### Featured Post


    #### Hubbub! Coding a First Nations’ Game of Chance


    ![QR-Hubbub!-Coding-a-First-Nations-Game-of-Chance](Images/QR-Hubbub%21-Coding-a-First-Nations-Game-of-Chance.png)


    ###### [http://brianaspinall.com/hubbub-coding-a-aboriginal-game-of-chance](http://brianaspinall.com/hubbub-coding-a-aboriginal-game-of-chance)


    ![line](Images/line.png)


    The best part was that Jaime was having so much fun, he probably didn’t realize
    he was mastering geometry skills and meeting his school’s curriculum expectations.
    But I did. I saw his work, and I saw the kind of teacher I wanted to be. I wanted
    students to see curriculum expectations as skills, and I wanted them to gain those
    skills in the same way this student made his game—by being creative, taking risks,
    making mistakes, and receiving feedback. The student who designed Pooping Baby
    saw patterns in the world and applied what he saw to create real solutions to
    real problems.


    Watching Jaime code his first game reminded me of how my Grade 11 media studies
    teacher, Mrs. Boudreau, let me make a website for a presentation on a pop icon,
    when the assignment originally asked me to make a poster. Back then, I’d thought
    the biggest struggle would be convincing her that a site dedicated to Tupac Shakur
    was appropriate for school. I might never know exactly what she thought about
    my musical tastes, but I know her decision to let me explore my interests in a
    creative way set me on the path that led to this student’s game. Because Mrs.
    Boudreau had said yes to me, I knew I couldn’t say no to Jaime and his Pooping
    Baby game. Learning, like the game’s content, is messy!


    ![line](Images/line.png)


    ### Featured Post


    #### Flipping a Coin with Python


    ![QR-Flipping-a-coin-with-python](Images/QR-Flipping-a-coin-with-python.png)


    ###### [http://brianaspinall.com/coding-probability-simulators-with-python-csforall](http://brianaspinall.com/coding-probability-simulators-with-python-csforall)


    ![line](Images/line.png)


    This student was one of my greatest teachers. He inspired me to learn more about
    how computational thinking and coding can be used in the classroom and across
    subjects and how it can benefit students throughout their lives.


    After watching that student succeed in a virtual context, I wanted to explore
    using the same process in the nonvirtual world. That’s why I’ve written this book—not
    a small feat for a regular blogger who sometimes still struggles with spelling.
    What you are about to read are lessons I’ve learned as I’ve used computational
    thinking in my teaching. We’ll get into some theory along the way, sure. While
    I was bringing coding to my classroom around 2006, Jeannette Wing and her team
    at Microsoft were introducing the world to the concept of computational thinking.
    The way she defines it, computational thinking is the synergy of the human mind
    and the power of machines. Her ideas, and the work of others, such as Mitch Resnick’s
    teacher Seymour Papert, have influenced my own teaching practices. But before
    I learned those theories, I saw how they applied to the classroom. Those classroom
    experiences are what I want to share with you.'
