  mdcn: "\n## 每单位计数\n\n“每单位计数”选项用于计算服从泊松分布计数的样本量，适用于每个单位可以测量多个缺陷的情形。单位可以是区域，计数可以是分数或大数。\n\
    \n尽管在给定大小的区域中观察到的缺陷数通常假定服从泊松分布，但区域和计数需要足够大以支持正态近似。\n\n关注的问题有：\n\n- 缺陷密度是否在规定限值内？\n\
    - 缺陷密度是大于还是小于规定限值？\n\n输入 alpha 和基线每单位计数。然后输入其余字段中的任意两个，即可看到第三个的计算。该检验针对单侧（单尾）变化。以基线每单位计数（每单位缺陷数）为单位输入要检测的差异。计算出的样本量也以这些单位表示。\n\
    \n例如，考虑一个晶圆制造过程，目标为每个晶圆 4 个缺陷，您想要验证新工艺是否达到该目标。\n\n1. 选择 **DOE > 样本量与功效**。\n2.\
    \ 单击**每单位计数**按钮。\n3. 输入 alpha 为 0.1，作为当新工艺与目标一样好时检验失败的概率。\n4. 输入功效为 0.9，即检测到大于\
    \ 2（每个晶圆 6 个缺陷）的变化的概率。在这种情况下，alpha 有时称为*生产者风险*，beta 称为*消费者风险*。\n5. 单击**继续**，查看计算出的样本量\
    \ 8.128（图 14.12）。\n\n如果缺陷总数小于 48（在 8 个晶圆的样本中，每个晶圆 6 个缺陷），则该工艺达到目标。\n\n![](img/a858f3b35ed4923af65c22e8829ee5a8_235_0.png)\n\
    \n## Sigma 质量水平\n\n使用“Sigma 质量水平”功能（通过选择“DOE > 样本量与功效”访问），输入以下三个数量中的任意两个：\n\n\
    - 缺陷数\n- 机会数\n- Sigma 质量水平\n\n当您单击“继续”时，Sigma 质量计算器将使用公式 Sigma 质量水平 = NormalQuantile(1\
    \ - 缺陷数/机会数) + 1.5 计算缺失的数量。\n\n例如，使用“样本量与功效”功能计算 1,000,000 个机会中 50 个缺陷的 Sigma\
    \ 质量水平：\n\n1. 选择 DOE > 样本量与功效。\n2. 单击 Sigma 质量水平按钮。\n3. 输入 50 作为缺陷数，输入 1,000,000\
    \ 作为机会数，如图 14.13 中左侧窗口所示。\n4. 单击“继续”。结果显示（如图 14.13 中右侧窗口所示）Sigma 质量水平为 5.3。\n\n\
    图 14.13 Sigma 质量水平示例 1\n\n![](img/a858f3b35ed4923af65c22e8829ee5a8_236_0.png)\n\
    \n如果您想知道对于 1,000,000 个机会，多少缺陷会将 Sigma 质量水平降低到“六西格玛”，请输入 6 作为 Sigma 质量水平，并将“缺陷数”留空（图\
    \ 14.14 中左侧窗口）。计算（图 14.14 中右侧窗口）显示“缺陷数”不能超过约 3.4。\n\n图 14.14 Sigma 质量水平示例 2\n\n\
    ![](img/a858f3b35ed4923af65c22e8829ee5a8_237_0.png)\n\n## 索引\n\n### 符号\n\n- “F\
