    # Control Charts


    Control charts are a graphical and analytic tool for deciding whether a process
    is in a state of statistical control and for monitoring an in-control process.
    This monitoring process is often called *quality control* or QC.


    ## Introduction


    Control charts have the following characteristics:

    - Each point represents a summary statistic computed from a subgroup sample of
    measurements of a quality characteristic.

    - The vertical axis of a control chart is scaled in the same units as the summary
    statistic.

    - The horizontal axis of a control chart identifies the subgroup samples.

    - The center line on a Shewhart control chart indicates the average (expected)
    value of the summary statistic when the process is in statistical control.

    - The upper and lower control limits, labeled UCL and LCL, give the range of variation
    to be expected in the summary statistic when the process is in statistical control.

    - A point outside the control limits signals the presence of a special cause of
    variation.

    - Graph > Control Chart subcommands create control charts that can be updated
    dynamically as samples are received and recorded or added to the data table.


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_107_0.png)


    The following example uses the Coating.jmp data in the Quality Control sample
    data folder (taken from the ASTM Manual on Presentation of Data and Control Chart
    Analysis). The quality characteristic of interest is the Weight column. A subgroup
    sample of four is chosen. An X̄-chart and an R-chart for the process are shown
    in Figure 7.1.


    To replicate this example,


    Choose the Graph > Control Chart > XBar command.


    Note the selected chart types of XBar and R.


    Specify Weight as the Process variable.


    Since our example has four samples in each subgroup,


    Change the Sample Size Constant from 5 to 4.


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_108_0.png)


    Click OK.


    Sample six indicates that the process is not in statistical control. To check
    the sample values, click the sample six summary point on either control chart.
    The corresponding rows highlight in the data table.


    ## Figure 7.1 Variables Charts for Coating Data


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_109_0.png)


    |  | 19 | 19 | 5 | 20.8 | • |

    |  | 20 | 20 | 5 | 21.6 | 21.6 |

    | x | 21 | 21 | 6 | 22.8 | 22.8 |

    | x | 22 | 22 | 6 | 22.2 | 22.2 |

    | x | 23 | 23 | 6 | 23.2 | 23.2 |

    | x | 24 | 24 | 6 | 23 | 23 |

    |  | 25 | 25 | 7 | 19 | 19 |

    |  | 26 | 26 | 7 | 20.5 | 20.5 |


    You can use Fit Y by X for an alternative visualization of the data. First, change
    the modeling type of Sample to Nominal. Specify the interval variable Weight as
    Y and the nominal variable Sample as X. The box plots in Figure 7.2 show that
    the sixth sample has a small range of high values.


    ## Figure 7.2 Quantiles Option in Fit Y By X Platform


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_109_1.png)


    ## The Control Chart Launch Dialog


    When you select a Control Chart from the Graph > Control Chart menu (Figure 7.3),
    you see a Control Chart Launch dialog similar to the one in Figure 7.4. (The exact
    controls vary depending on the type of chart you choose.) Initially, the dialog
    shows three kinds of information:

    - process information, for measurement variable selection

    - chart type information

    - limits specification.


    Figure 7.3 Control Chart Menu


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_110_0.png)


    Specific information shown for each section varies according to the type of chart
    you request.


    Figure 7.4 Control Chart Launch Dialog


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_110_1.png)


    Through interaction with the Launch dialog, you specify exactly how you want your
    charts created. The following sections describe the panel elements.


    ## Figure 7.5 Variables Charts with Unequal Subgroup Sample Sizes


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_112_0.png)


    ## Phase


    The Phase role enables you to specify a column identifying different phases, or
    sections. A phase is a group of consecutive observations in the data table. For
    example, phases might correspond to time periods during which a new process is
    brought into production and then put through successive changes. Phases generate,
    for each level of the specified Phase variable, a new sigma, set of limits, zones,
    and resulting tests.


    - P, NP, C, and U charts, and Run Charts, have no additional specifications.


    ## Parameters


    You specify computations for control limits by entering a value for k (K Sigma)
    or by entering a probability for α(Alpha). There must be a specification of either
    K Sigma or Alpha. The dialog default for K Sigma is 3.


    ### K Sigma


    allows specification of control limits in terms of a multiple of the sample standard
    error. K Sigma specifies control limits at k sample standard errors above and
    below the expected value, which shows as the center line. To specify k, the number
    of sigmas, click K Sigma and enter a positive k value into the textbox. The usual
    choice for k is three, which is three standard deviations. The examples shown
    in Figure 7.6 compare the X̄-chart for the Coating.jmp data with control lines
    drawn with K Sigma = 3 and K Sigma = 4.


    Figure 7.6 K Sigma =3 (left) and K Sigma=4 (right) Control Limits


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_114_0.png)


    ### Alpha


    specifies control limits (also called probability limits) in terms of the probability
    α that a single subgroup statistic exceeds its control limits, assuming that the
    process is in control. To specify alpha, click the Alpha radio button and enter
    the probability you want. Reasonable choices for α are 0.01 or 0.001


    ## Using Specified Statistics


    If you click the Specify Stats (when available) button on the Control Chart Launch
    dialog, a tab with editable fields is appended to the bottom of the launch dialog.
    This lets you enter historical statistics (statistics obtained from historical
    data) for the process variable. The Control Chart platform uses those entries
    to construct control charts. The example here shows 1 as the standard deviation
    of the process variable and 20 as the mean measurement.


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_115_0.png)


    Note: When the mean is user-specified, it is labeled in the plot as μ0.


    If you check the Capability option on the Control Chart launch dialog (see Figure
    7.4), a dialog appears as the platform is launched asking for specification limits.
    The standard deviation for the control chart selected is sent to the dialog and
    appears as a Specified Sigma value, which is the default option. After entering
    the specification limits and clicking OK, capability output appears in the same
    window next to the control chart.


    ## Tailoring the Horizontal Axis


    When you double-click the x-axis, the X Axis Specification dialog appears for
    you to specify the format, axis values, number of ticks, gridline and reference
    lines to display on the x-axis.


    For example, the Pickles.JMP data lists eight measures a day for three days. In
    this example, by default, the x-axis is labeled at every other tick. Sometimes
    this gives redundant labels, as shown to the left in Figure 7.7. If you specify
    a label at an increment of eight, with seven ticks between them, the x-axis is
    labeled once for each day, as shown in the chart on the right.


    Figure 7.7 Example of Labeled x-Axis Tick Marks


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_115_1.png)


    ## Display Options


    Control Charts have popup menus that affect various parts of the platform:

    - The menu on the top-most title bar affects the whole platform window. Its items
    vary with the type of chart you select.

    - There is a menu of items on the chart type title bar with options that affect
    each chart individually.


    ## Single Chart Options


    The popup menu of chart options appears when you click the icon next to the chart
    name, or right-click the chart space.


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_116_0.png)


    ### Box Plots


    superimposes box plots on the subgroup means plotted in a Mean chart. The box
    plot shows the subgroup maximum, minimum, 75th percentile, 25th percentile, and
    median. Markers for subgroup means show unless you deselect the Show Points option.
    The control limits displayed apply only to the subgroup mean. The Box Plots option
    is available only for X̄-charts. It is most appropriate for larger subgroup sample
    sizes (more than 10 samples in a subgroup).


    ### Needle


    connects plotted points to the center line with a vertical line segment.


    ### Connect Points


    toggles between connecting and not connecting the points.


    ### Show Points


    toggles between showing and not showing the points representing summary statistics.
    Initially, the points show. You can use this option to suppress the markers denoting
    subgroup means when the Box Plots option is in effect.

    '
