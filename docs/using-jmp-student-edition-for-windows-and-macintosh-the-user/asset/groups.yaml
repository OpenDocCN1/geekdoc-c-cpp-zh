    # Stepwise Regression


    Stepwise regression is an approach to selecting a subset of effects for a regression
    model. It is used when there is little theory to guide the selection of terms
    for a model and the modeler, in desperation, wants to use whatever seems to provide
    a good fit.


    The approach is somewhat controversial. The significance levels on the statistics
    for selected models violate the standard statistical assumptions because the model
    has been selected rather than tested within a fixed model. On the positive side,
    the approach has been of practical use for 30 years in helping to trim out models
    to predict many kinds of responses. The book *Subset Selection in Regression*,
    by A. J. Miller (1990), brings statistical sense to model selection statistics.


    This chapter uses the term “significance probability” in a mechanical way to represent
    that the calculation would be valid in a fixed model, recognizing that the true
    significance probability could be nowhere near the reported one.


    # Introduction


    In JMP, stepwise regression is a *personality* of the Model Fitting platform—it
    is one of the selections in the Fitting Personality popup menu on the Model Specification
    dialog (see Figure 5.6 on page 87). The **Stepwise** feature computes estimates
    that are the same as those of other least squares platforms, but it facilitates
    searching and selecting among many models.


    As an example,


    Open the Fitness.jmp data table in the Sample Data folder.


    This data shows results from an aerobic fitness study. Figure 6.1 shows a partial
    listing of the Fitness.jmp data table.


    Aerobic fitness can be evaluated using a special test that measures the oxygen
    uptake of a person running on a treadmill for a prescribed distance. However,
    it would be more economical to find a formula that uses simpler measurements that
    evaluate fitness and predict oxygen uptake. To identify such an equation, measurements
    of age, weight, runtime, and pulse were taken for 31 participants who ran 1.5
    miles.


    To find a good oxygen uptake prediction equation, you need to compare many different
    regression models. The Stepwise platform lets you search through models with combinations
    of effects and choose the model you want.'
