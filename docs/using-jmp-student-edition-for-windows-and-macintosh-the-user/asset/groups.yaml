    \ generated it.\n\nThis script allows you to easily fit a model using the values\
    \ in the design table.\n\nvalues in the Pattern column describe the run each row\
    \ represents\n\nfor continuous factors, a plus sign represents high levels\n\n\
    for continuous factors, a minus sign represents low levels\n\nlevel numbers represent\
    \ values of categorical factors\n\n![](img/a858f3b35ed4923af65c22e8829ee5a8_197_0.png)\n\
    \n## Screening Designs\n\n## Designing Experiments\n\nScreening designs are arguably\
    \ the most popular designs for industrial experimentation. They examine many factors\
    \ to see which have the greatest effect on the results of a process.\n\nCompared\
    \ to other design methods, screening designs require fewer experimental runs,\
    \ which is why they are cheap. Thus, they are attractive because they are a cheap\
    \ and efficient way to begin improving a process.\n\nOften screening designs are\
    \ a prelude to further experiments. It is wise to spend only about a quarter of\
    \ your resource budget on an initial screening experiment. You can then use the\
    \ results to guide further study.\n\nThe efficiency of screening designs depends\
    \ on the critical assumption of effect sparsity. Effect sparsity results because\
    \ real-world processes usually have only a few driving factors; other factors\
    \ are relatively unimportant. To understand the importance of effect sparsity,\
    \ you can contrast screening designs to full factorial designs:\n\n- Full factorial\
    \ designs consist of all combinations of the levels of the factors. The number\
    \ of runs is the product of the factor levels. For example, a factorial experiment\
    \ with a two-level factor, a three-level factor, and a four-level factor has 2\
    \ x 3 x 4 = 24 runs.\n- By contrast, screening designs reduce the number of runs\
    \ by restricting the factors to two (or three) levels and by performing only a\
    \ fraction of the full factorial design.\n\nEach factor in a screening design\
    \ is usually set at two levels to economize on the number of runs needed, and\
    \ response measurements are taken for only a fraction of the possible combinations\
    \ of levels. In the case described above, you can restrict the factors to two\
    \ levels, which yield 2 x 2 x 2 = 8 runs. Further, by doing half of these eight\
    \ combinations you can still assess the separate effects of the three factors.\
    \ So the screening approach reduces the 24-run experiment to four runs.\n\nOf\
    \ course, there is a price for this reduction. This chapter discusses the screening\
    \ approach in detail, showing both pros and cons. It also describes how to use\
    \ JMP’s screening designer, which supplies a list of popular screening designs\
    \ for two or more factors. These factors can be continuous or categorical, with\
    \ two or three levels. The list of screening designs you can use includes designs\
    \ that group the experimental runs into blocks of equal sizes where the size is\
    \ a power of two.\n\n## Introduction\n\nSuppose an engineer wants to investigate\
    \ a process that uses an electron beam welding machine to join two parts. The\
    \ engineer fits the two parts into a welding fixture that holds them snugly together.\
    \ A voltage applied to a beam generator creates a stream of electrons that heats\
    \ the two parts, causing them\n"
