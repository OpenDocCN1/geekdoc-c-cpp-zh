    ## Introduction


    The Bounce Data.jmp sample data file has response surface data inspired by the
    tire tread data described in Derringer and Suich (1980). To see this sample data
    table, open the Sample Data folder that was installed when you installed JMP,
    and select Design Experiment > Bounce Data.jmp.


    The objective of this experiment is to match a standardized target value (450)
    of tennis ball bounciness. The bounciness varies with amounts of Silica, Silane,
    and Sulfur used to manufacture the tennis balls. The experimenter wants to collect
    data over a wide range of values for these variables to see if a response surface
    can find a combination of factors that matches a specified bounce target. To follow
    this example:


    - 1. Select DOE > **Response Surface Design**.

    - 2. Load factors by clicking the red triangle icon on the Response Surface Design
    title bar and selecting **Load Factors**. Navigate to the Sample Data folder that
    was installed when you installed JMP, and select Design Experiment > Bounce Factors.jmp.

    - 3. Load the responses by clicking the red triangle icon on the Response Surface
    Design title bar and selecting **Load Responses**. Navigate to the Sample Data
    folder that was installed when you installed JMP, and select Design Experiment
    > Bounce Response.jmp. Figure 13.1 shows the completed Response panel and Factors
    panel.


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_216_0.png)


    After the response data and factors data are loaded, the Response Surface Design
    Choice dialog lists the designs in Figure 13.2.


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_216_1.png)


    The Box-Behnken design selected for three effects generates the design table of
    15 runs shown in Figure 13.3.


    In real life, you would conduct the experiment and then enter the responses into
    the data table. Let’s pretend this happened and use a finalized data table called
    Bounce Data.jmp.


    1 Open to the Sample Data folder that was installed when you installed JMP, and
    select Design Experiment > Bounce Data.jmp (Figure 13.3).


    ### Figure 13.3 JMP Table for a Three-Factor Box-Behnken Design


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_217_0.png)


    After obtaining the Bounce Data.jmp data table, run a fit model analysis on the
    data. The data table contains a script labeled Model.


    - 2 Right-click Model and select Run Script to start a fit model analysis.

    - 3 Click Run Model.


    The standard Fit Model analysis results appear in tables shown in Figure 13.4,
    with parameter estimates for all response surface and crossed effects in the model.


    The prediction model is highly significant with no evidence of lack of fit. All
    main effect terms are significant as well as the two interaction effects involving
    Sulfur.


    ### Figure 13.4 JMP Statistical Reports for a Response Surface Analysis of Bounce
    Data


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_217_1.png)


    The Response Surface report also has the tables shown in Figure 13.5.


    ### Figure 13.5 Statistical Reports for a Response Surface Analysis


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_218_0.png)


    Provides a summary of the parameter estimates


    Lists the critical values of the surface factors and tells the kind of solution
    (maximum, minimum, or saddlepoint). The solution for this example is a saddlepoint.
    The table also warns that the critical values given by the solution are outside
    the range of data values.


    Shows eigenvalues and eigenvectors of the effects. The eigenvector values show
    that the dominant negative curvature (yielding a maximum) is mostly in the Sulfur
    direction. The dominant positive curvature (yielding a minimum) is mostly in the
    Silica direction.


    ## Creating a Response Surface Design


    Response Surface Methodology (RSM) is an experimental technique invented to find
    the optimal response within specified ranges of the factors. These designs are
    capable of fitting a second-order prediction equation for the response. The quadratic
    terms in these equations model the curvature in the true response function. If
    a maximum or minimum exists inside the factor region, RSM can find it. In industrial
    applications, RSM designs involve a small number of factors. This is because the
    required number of runs increases dramatically with the number of factors. Using
    the response surface designer, you choose to use well-known RSM designs for two
    to eight continuous factors. Some of these designs also allow blocking.


    Response surface designs are useful for modeling and analyzing curved surfaces.


    To start a response surface design, select DOE > Response Surface Design, or click
    the Response Surface Design button on the JMP Starter DOE page. Then, follow the
    steps below:


    - “Entering Responses and Factors,” p. 219

    - “Choosing a Design,” p. 219

    - “Specifying Axial Value (Central Composite Designs Only),” p. 220

    - “Specifying Output Options,” p. 221

    - “Viewing the Design Table,” p. 221

    - “Continuing the Analysis, If Needed,” p. 222

