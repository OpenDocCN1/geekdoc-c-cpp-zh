    \ 2 x 2 x 2 = 8 次运行。此外，通过执行这八种组合中的一半，您仍然可以评估三个因子的单独效应。因此，筛选方法将 24 次运行的实验减少到四次运行。\n\
    \n当然，这种减少是有代价的。本章详细讨论了筛选方法，展示了其利弊。它还描述了如何使用 JMP 的筛选设计器，该设计器提供两种或更多因子的流行筛选设计列表。这些因子可以是连续的或分类的，具有两个或三个水平。您可以使用筛选设计列表包括将实验运行分组为大小相等且大小为\
    \ 2 的幂的块的设计。\n\n## 引言\n\n假设一位工程师想要研究使用电子束焊接机将两个零件焊接在一起的过程。工程师将两个零件装入焊接夹具中，使其紧密贴合。施加到束发生器的电压产生一束电子，使两个零件受热，从而导致它们\n\
    \n"
