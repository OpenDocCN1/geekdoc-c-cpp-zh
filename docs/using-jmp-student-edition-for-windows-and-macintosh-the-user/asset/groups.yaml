  mdcn: '


    - **功效** 功效是得到一个将在统计上被宣布为显著的统计量的概率。功效越大越好，但代价是所需样本量更大。当指定效应量为零时，功效等于 α。如果条件允许，应争取至少
    0.90 或 0.95 的功效。如果一项实验需要相当大的投入，应进行设计规划，使实验设计在存在较大效应时能够检出该效应。

    - **继续** 按输入的值计算。

    - **返回** 返回上一个对话框。

    - **动画脚本** **动画脚本**按钮会运行一个 JSL 脚本，显示一个展示功效或样本量的交互式图形。有关此动画脚本的示例，请参见第 229 页的“单样本的功效与样本量动画”一节。


    ## 单样本均值


    假设有一个单样本，目标是检测差异为 2 的情形，其中误差标准差为 0.9，如图 14.3 左侧对话框所示。要计算样本量为 10 时的功效，请在对话框中将功效留空，然后点击“继续”。图
    14.3 右侧对话框显示计算出的功效为 0.99998，四舍五入为 1。


    **图 14.3** 单样本示例


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_228_0.png)


    要查看功效与样本量关系的图形，请将 **样本量** 和 **功效** 均留空，然后点击 **继续**。


    双击水平轴可获得任意所需的刻度。图 14.4 左侧图形显示了功效从约 0.2 变化到 0.95 的样本量范围。通过改变水平轴的范围来改变曲线的范围。例如，图
    14.4 右侧的图形将水平轴刻度设置为从 1 到 8，得到了一条更典型的功效曲线。


    **图 14.4** 单样本示例图


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_229_0.png)


    当仅指定样本量（图 14.5）且“待检差值”和“功效”为空时，将显示功效随差值变化的图形。


    **图 14.5** 给定样本量下功效随待检差值变化的图形


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_229_1.png)


    ## 单样本的功效与样本量动画


    用于单个均值的“功效和样本量”对话框上的“动画脚本”按钮会显示一个交互式图形，用于说明更改样本量对功效的影响。在图 14.6 所示的示例中，样本量为 10，α
    为 0.05，待检差值设置为 0.4。动画开始显示一条均值位于 0 处的正态曲线（代表估计均值和真实均值），以及另一条均值位于 0.4 处的正态曲线（即待检差值）。犯第二类错误（当存在差异时未能检出差异）的概率在文献中通常用
    β 表示，在该图形中以蓝色阴影显示。


    您可以在曲线上拖动控制柄，查看它们的位置如何影响功效。此外，您还可以点击图形下方显示的样本量和 α 值来更改它们。


    **图 14.6** 用于说明功效的动画脚本示例


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_230_0.png)


    ## 双样本均值


    这些对话框对双样本的处理方式类似；“待检差值”是两个均值之差。假设误差标准差为 0.9（与之前相同），所需检出的差异为 1，样本量为 16。


    将“功效”留空并点击“继续”，可看到功效计算结果为 0.5433，如图 14.7 左侧对话框所示。这比单样本情况低得多，因为每个均值对应的样本量只有一半。比较是在两个随机样本之间进行，而不是一个样本。


    要提高功效，需要更大的样本。要了解需要多大，将“样本量”和“功效”都留空，并查看图 14.7 右侧生成的图形。十字准线工具估计，要获得 0.9 的功效，大约需要样本量
    35。


    **图 14.7** 给定差值下功效随样本量变化的图形


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_231_0.png)


    ## k 样本均值


    **k 样本均值** 情形最多可以考察 10 种均值。下一个示例考虑这样一种情形：4 个水平的均值预期约为 10 到 13，误差标准差为 0.9。当输入样本量
    16 时，功效计算结果为 0.95，如图 14.8 左侧对话框所示。


    如果将“样本量”和“功效”都留空，功效和样本量计算将生成图 14.8 右侧所示的功效曲线。这证实样本量 16 看起来是可接受的。


    请注意，均值差为 2.236，计算方法为各均值与总均值之差的平方和再开平方根。在本例中，它是 \((-1.5)^2 + (-0.5)^2 + (0.5)^2
    + (1.5)^2\) 的平方根，即 5 的平方根。


    **图 14.8** k 均值的预期功效和功效随样本量变化的图形


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_232_0.png)


    ## 单样本方差


    “功效和样本量”对话框中的“单样本方差”选项（图 14.1）用于确定检测方差变化的样本量。此选项的通常目的是计算足够大的样本量，以保证接受错误假设的风险（β）很小。在对话框中，指定基线方差、α
    水平和要检测的变化方向。要指示变化方向，请从“防范变化”菜单中选择“更大”或“更小”。随后计算会显示真实方差是大于还是小于其假设值（以基线方差输入）。例如，某一批硅晶圆的电阻率测量方差声称是
    100 欧姆-厘米，而买方不愿意接受方差大于 55 欧姆-厘米的特定批次货物。


    本章其余部分的示例使用美国国家标准与技术研究院（NIST）在线手册中的工程示例。您可以在 http://www.itl.nist.gov/div898/handbook
    访问 NIST 手册示例。


    与前面的对话框一样，您在其中输入两个项目，“功效和样本量”计算将确定第三个项目。


    假设您想要在基线方差为 100 的情况下检测 55 的增加，α 为 0.05，功效为 0.99。按图 14.9 所示输入这些项目。点击“继续”后，计算结果将显示您需要样本量
    170。


    如果要检测方差变小，请在“待检差值”框中输入负值。


    **注意：** 请记住在“基线方差”框中输入方差，而不是标准差。


    **图 14.9** 比较单方向单样本方差的样本量和功效对话框


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_233_0.png)


    ## 单样本和双样本比例


    用于检验比例的功效和样本量的对话框及计算，与检验样本均值的对话框及计算类似。对话框相同，区别在于您需要输入“基线比例”，并指定单侧或双侧检验。对于单样本情形，“基线比例”是已知基线比例与单个样本比例的平均值。当有两个样本时，您输入的“基线比例”是两个样本比例的平均值。


    比例的抽样分布实际上是二项分布，但确定样本量和检验比例的计算使用正态近似，如对话框中所指示（图 14.10）。


    **图 14.10** 单样本和双样本比例的默认功效和样本对话框


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_234_0.png)


    输入基线和单样本比例的平均值，或双样本比例的平均值。


    输入 1 或 2 以指示检验类型（单侧或双侧）。


    比例检验在生产线上很有用，因为缺陷比例是过程控制监控的一部分。例如，假设生产线经理想要检测缺陷品比例的变化，该变化比已知的约 10% 的缺陷基线高出 6%。除非过程已经恶化到缺陷率大于
    16%（比已知的 10% 缺陷基线高 6%），否则经理不想停止该过程。本示例中的“基线比例”为 0.08，即基线（10%）与高于基线的比例（6%）的平均值。该示例过程使用单侧检验进行监控，α
    为 5%，漏检该幅度变化的失败风险为 10%（即功效为 90%）。


    图 14.11 显示了用于检测观测比例与基线比例之间给定差值的“样本量和功效”对话框中的输入内容，以及计算出的约 77 的样本量。要查看图 14.11 右侧的图形，请将“待检差值”和“样本量”均留空。使用抓手工具（手形）移动
    x 轴，以显示特定的差值范围和样本量范围。


    **图 14.11** 比较一个比例与基线的对话框及样本量图形


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_234_1.png)


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_234_2.png)


