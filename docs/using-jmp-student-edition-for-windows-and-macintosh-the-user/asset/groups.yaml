    Figure 8.8 Autocorrelation and Partial Correlation Plots


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_150_0.png)


    # Number of Forecast Periods


    The Number of Forecast Periods command displays a dialog for you to reset the
    number of periods into the future that the fitted models will forecast. The initial
    value is set in the Time Series Launch dialog. All existing and future forecast
    results will show the new number of periods with this command.


    # Modeling Reports


    The time series modeling commands are used to fit theoretical models to the series
    and use the fitted model to predict (forecast) future values of the series. These
    commands also produce statistics and residuals that allow you to ascertain the
    adequacy of the model you have elected to use. You can select the modeling commands
    repeatedly. Each time you select a model, a report of the results of the fit and
    a forecast is added to the platform results.


    The fit of each model begins with a dialog that lets you specify the details of
    the model being fit as well as how it will be fit. Each general class of models
    has its own dialog, as discussed previously in their respective sections. The
    models are fit by maximizing the likelihood function, using a Kalman filter to
    compute the likelihood function. The ARIMA, seasonal ARIMA, and smoothing models
    begin with the following report tables.'
