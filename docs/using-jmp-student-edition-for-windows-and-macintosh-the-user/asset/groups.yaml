    The completed dialog is shown in Figure 11.1.


    # Figure 11.1  Full-Factorial Example Response and Factors Panels


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_190_0.png)


    +   6. Click **Continue** to see Output Options panel. A full factorial design
    includes runs for all combinations of high and low factors for the five variables,
    giving 32 runs.

    +   7. Click **Make Table**.


    The design data table (Figure 11.3) contains a run for every combination of high
    and low values for the five variables. Since there are five variables, there are
    2⁵ = 32 runs. This covers all combinations of a five factors with two levels each.
    Initially, the table has an empty Y column named Percent Reacted for entering
    response values when the experiment is complete.


    The values in your table may be different from those shown below.


    # Figure 11.2  2⁵ Factorial Reactor Data


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_190_1.png)


    To see the completed experiment and continue following this example, open the
    folder **Sample Data** that was installed when you installed JMP. Within this
    folder, open **Design Experiment > Reactor 32 Runs.jmp**.'
  - '[PAGE 191]


    # Figure 11.3  Reactor 32 Runs.jmp


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_191_0.png)


    Begin the analysis with a quick look at the data before fitting the factorial
    model.


    +   1. Select **Analyze > Distribution**.

    +   2. Highlight **Percent Reacted** and click **Y, Columns**. Then click **OK**.

    +   3. Click the red triangle icon on the Percent Reacted title bar and select
    **Normal Quantile Plot**. The results are shown in Figure 11.4.


    # Figure 11.4  Distribution of Response Variable for Reactor Data


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_191_1.png)


    Start the formal analysis with a stepwise regression. The data table has a script
    stored with it that automatically defines an analysis of the model that includes
    main effects and all two-factor interactions, and brings up the Stepwise control
    panel.


    +   1. Click the red triangle icon next to the Fit Model script and select **Run
    Script**.

    +   2. The probability to enter a factor (Prob to Enter) in the model should be
    0.05.

    +   3. The probability to remove a factor (Prob to Leave) should be 0.1.'
