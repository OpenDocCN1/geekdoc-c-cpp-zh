    # Excluded, Hidden, and Deleted Samples


    The following table summarizes the effects of various conditions on samples and
    subgroups:


    # Table 7.3 Excluded, Hidden, and Deleted Samples


    | | |

    |---|---|

    | Sample is excluded before creating the chart. | Sample is not included in the
    calculation of the limits, but it appears on the graph. |

    | Sample is excluded after creating the chart. | Sample is included in the calculation
    of the limits, and it appears in the graph. Nothing will change on the output
    by excluding a sample with the graph open. |

    | Sample is hidden before creating the chart. | Sample is included in the calculation
    of the limits, but does not appear on the graph. |

    | Sample is hidden after creating the chart. | Sample is included in the calculation
    of the limits, but does not appear on the graph. The sample marker will disappear
    from the graph, the sample label will still appear on the axis, but limits remain
    the same. |

    | Sample is both excluded and hidden before creating the chart. | Sample is not
    included in the calculation of the limits, and it does not appear on the graph.
    |

    | Sample is both excluded and hidden after creating the chart. | Sample is included
    in the calculation of the limits, but does not appear on the graph. The sample
    marker will disappear from the graph, the sample label will still appear on the
    axis, but limits remain the same. |

    | Data set is subsetted with Sample deleted before creating chart. | Sample is
    not included in the calculation of the limits, the axis will not include a value
    for the sample, and the sample marker does not appear on the graph. |

    | Data set is subsetted with Sample deleted after creating chart. | Sample is
    not included in the calculation of the limits, and does not appear on the graph.
    The sample marker will disappear from the graph, the sample label will still be
    removed from the axis, the graph will shift, and the limits will change. |


    Some additional notes:


    +   1. Exclude and Hide operate only on the row state of the first observation
    in the sample. For example, if the second observation in the sample is hidden,
    while the first observation is not hidden, the sample will still appear on the
    chart.

    +   2. An exception to the exclude/hide rule: Tests for Special Causes can flag
    if a sample is excluded, but will not flag if a sample is hidden.


    # Shewhart Control Charts


    Shewhart control charts are broadly classified into control charts for variables
    and control charts for attributes. Moving average charts are special kinds of
    control charts for variables.


    The Control Chart platform in JMP-SE implements a variety of control charts:'
  - '[PAGE 125]


    +   - X̄-, R-, and S-charts,

    +   - Individual and Moving Range charts,

    +   - p-, np-, c-, and u-charts,

    +   - Phase Control Charts for X̄-, r-, IR-, p-, np-, c-, and u- charts


    One feature special to Control Charts, different from other platforms in JMP-SE,
    is that they update dynamically as data is added or changed in the table.


    # Shewhart Control Charts for Variables


    Control charts for variables are classified according to the subgroup summary
    statistic plotted on the chart:


    +   - X̄-charts display subgroup means (averages)

    +   - R-charts display subgroup ranges (maximum – minimum)

    +   - S-charts display subgroup standard deviations.

    +   - Run charts display data as a connected series of points.


    The IR selection gives two additional chart types:


    +   - Individual Measurement charts display individual measurements

    +   - Moving Range charts display moving ranges of two or more successive measurements.


    # XBar-, R-, and S- Charts


    For quality characteristics measured on a continuous scale, a typical analysis
    shows both the process mean and its variability with a mean chart aligned above
    its corresponding R- or S-chart. Or, if you are charting individual measurements,
    the individual measurement chart shows above its corresponding moving range chart.s


    # Example. X̄ - and S-charts with varying subgroup sizes


    This example uses the same data as example 1, Coating.jmp, in the Quality Control
    sample data folder. This time the quality characteristic of interest is the Weight
    2 column. An X̄-chart and an S chart for the process are shown in Figure 7.11.


    To replicate this example,


    +   - Choose the Graph > Control Chart > XBar command.

    +   - Select the chart types of XBar and S.

    +   - Specify Weight 2 as the Process variable.

    +   - Specify the column, Sample as the Sample Label variable.

    +   - The Sample Size option should automatically change to Sample Grouped by
    Sample Label.

    +   - Click OK.'
  - '[PAGE 126]


    # Figure 7.11 X̄ and S charts for Varying Subgroup Sizes


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_126_0.png)


    Weight 2 has several missing values in the data, so you may notice the chart has
    uneven limits. Although, each sample has the same number of observations, samples
    1, 3, 5, and 7 each have a missing value.


    Note: Although they will turn on and appear checked, no zones or tests will appear
