    # Screening Designs


    # Designing Experiments


    Screening designs are arguably the most popular designs for industrial experimentation.
    They examine many factors to see which have the greatest effect on the results
    of a process.


    Compared to other design methods, screening designs require fewer experimental
    runs, which is why they are cheap. Thus, they are attractive because they are
    a cheap and efficient way to begin improving a process.


    Often screening designs are a prelude to further experiments. It is wise to spend
    only about a quarter of your resource budget on an initial screening experiment.
    You can then use the results to guide further study.


    The efficiency of screening designs depends on the critical assumption of effect
    sparsity. Effect sparsity results because real-world processes usually have only
    a few driving factors; other factors are relatively unimportant. To understand
    the importance of effect sparsity, you can contrast screening designs to full
    factorial designs:


    +   - Full factorial designs consist of all combinations of the levels of the
    factors. The number of runs is the product of the factor levels. For example,
    a factorial experiment with a two-level factor, a three-level factor, and a four-level
    factor has 2 x 3 x 4 = 24 runs.

    +   - By contrast, screening designs reduce the number of runs by restricting
    the factors to two (or three) levels and by performing only a fraction of the
    full factorial design.


    Each factor in a screening design is usually set at two levels to economize on
    the number of runs needed, and response measurements are taken for only a fraction
    of the possible combinations of levels. In the case described above, you can restrict
    the factors to two levels, which yield 2 x 2 x 2 = 8 runs. Further, by doing half
    of these eight combinations you can still assess the separate effects of the three
    factors. So the screening approach reduces the 24-run experiment to four runs.


    Of course, there is a price for this reduction. This chapter discusses the screening
    approach in detail, showing both pros and cons. It also describes how to use JMP’s
    screening designer, which supplies a list of popular screening designs for two
    or more factors. These factors can be continuous or categorical, with two or three
    levels. The list of screening designs you can use includes designs that group
    the experimental runs into blocks of equal sizes where the size is a power of
    two.


    # Introduction


    Suppose an engineer wants to investigate a process that uses an electron beam
    welding machine to join two parts. The engineer fits the two parts into a welding
    fixture that holds them snugly together. A voltage applied to a beam generator
    creates a stream of electrons that heats the two parts, causing them'
