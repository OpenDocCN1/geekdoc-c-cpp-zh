    # 控制图


    控制图是一种图形化分析工具，用于判断过程是否处于统计控制状态，并监控受控过程。这种监控过程通常称为*质量控制*或 QC。


    ## 简介


    控制图具有以下特征：

    - 每个点表示根据质量特性的子组样本测量值计算得到的汇总统计量。

    - 控制图的垂直轴以与汇总统计量相同的单位进行刻度。

    - 控制图的水平轴标识子组样本。

    - 休哈特控制图上的中心线表示过程处于统计控制状态时汇总统计量的平均值（期望值）。

    - 标记为 UCL 和 LCL 的上控制限和下控制限给出了过程处于统计控制状态时汇总统计量的预期变异范围。

    - 超出控制限的点表示存在特殊原因导致的变异。

    - “图形 > 控制图”子命令可创建控制图，并可在样本被接收、记录或添加到数据表时动态更新。


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_107_0.png)


    以下示例使用“质量控制”示例数据文件夹中的 Coating.jmp 数据（摘自 ASTM《数据呈现与控制图分析手册》）。所关注的质量特性是 Weight 列。选取了一个包含
    4 个样本的子组。图 7.1 显示了该过程的 X̄ 图和 R 图。


    要复现此示例：


    选择“图形 > 控制图 > XBar”命令。


    注意已选择的 XBar 和 R 图表类型。


    将 Weight 指定为过程变量。


    由于示例中每个子组有 4 个样本，


    将样本大小常数从 5 改为 4。


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_108_0.png)


    单击“确定”。


    样本 6 表明过程未处于统计控制状态。要检查样本值，请在任一控制图上单击样本 6 的汇总点。数据表中相应的行将高亮显示。


    ## 图 7.1 涂层数据的变量控制图


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_109_0.png)


    |  | 19 | 19 | 5 | 20.8 | • |

    |  | 20 | 20 | 5 | 21.6 | 21.6 |

    | x | 21 | 21 | 6 | 22.8 | 22.8 |

    | x | 22 | 22 | 6 | 22.2 | 22.2 |

    | x | 23 | 23 | 6 | 23.2 | 23.2 |

    | x | 24 | 24 | 6 | 23 | 23 |

    |  | 25 | 25 | 7 | 19 | 19 |

    |  | 26 | 26 | 7 | 20.5 | 20.5 |


    您可以使用 Fit Y by X 对数据进行另一种可视化。首先，将 Sample 的建模类型更改为“名义型”。将区间变量 Weight 指定为 Y，将名义变量
    Sample 指定为 X。图 7.2 中的箱线图显示，样本 6 的取值范围较小，数值较高。


    ## 图 7.2 Fit Y By X 平台中的分位数选项


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_109_1.png)


    ## 控制图启动对话框


    当您从“图形 > 控制图”菜单中选择控制图时（图 7.3），会看到类似于图 7.4 的控制图启动对话框。（具体控件因您选择的图表类型而异。）初始时，该对话框显示三类信息：

    - 过程信息，用于选择测量变量

    - 图表类型信息

    - 限值规格


    图 7.3 控制图菜单


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_110_0.png)


    每个部分显示的具体信息根据您请求的图表类型而有所不同。


    图 7.4 控制图启动对话框


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_110_1.png)


    通过与启动对话框交互，您可以准确地指定希望如何创建图表。以下各节介绍面板元素。


    ## 图 7.5 子组样本大小不等的变量控制图


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_112_0.png)


    ## 阶段


    “阶段”角色使您能够指定一个列来标识不同的阶段或区段。阶段是数据表中一组连续的观测。例如，阶段可能对应于一个新过程投入生产并随后经历一系列变更的时间段。对于所指定“阶段”变量的每个水平，阶段都会生成新的
    sigma、一组控制限、区域以及相应的检验。


    - P、NP、C 和 U 图以及运行图没有其他规格设置。


    ## 参数


    您可以通过输入 k（K Sigma）值或输入 α（Alpha）概率来指定控制限的计算方式。必须指定 K Sigma 或 Alpha 中的一项。K Sigma
    的对话框默认值为 3。


    ### K Sigma


    K Sigma 允许以样本标准误差的倍数来指定控制限。K Sigma 将控制限指定在期望值（显示为中心线）上方和下方的 k 个样本标准误差处。要指定 k（sigma
    的数量），请单击 K Sigma，然后在文本框中输入正的 k 值。k 通常取 3，即三个标准差。图 7.6 中的示例比较了 Coating.jmp 数据的
    X̄ 图与使用 K Sigma = 3 和 K Sigma = 4 绘制的控制线。


    图 7.6 K Sigma = 3（左）和 K Sigma = 4（右）的控制限


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_114_0.png)


    ### Alpha


    Alpha 根据单个子组统计量超出其控制限的概率 α 来指定控制限（也称为概率限），假设过程处于受控状态。要指定 alpha，请单击 Alpha 单选按钮，然后输入所需的概率。α
    的合理选择为 0.01 或 0.001。


    ## 使用指定的统计量


    如果单击控制图启动对话框中的“指定统计量 (Specify Stats)”按钮（可用时），启动对话框底部会附加一个带有可编辑字段的选项卡。这使您可以为过程变量输入历史统计量（从历史数据获得的统计量）。控制图平台使用这些输入来构建控制图。此处的示例将过程变量的标准差显示为
    1，测量均值显示为 20。


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_115_0.png)


    注意：当均值由用户指定时，图中会将其标记为 μ0。


    如果在控制图启动对话框中选中“能力 (Capability)”选项（参见图 7.4），则启动平台时会出现一个对话框，要求输入规格限。所选控制图的标准差会传递到该对话框，并显示为“指定
    Sigma”值，这是默认选项。输入规格限并单击“确定”后，能力输出将出现在同一窗口内控制图的旁边。


    ## 定制水平轴


    当您双击 x 轴时，将出现“X 轴规格”对话框，供您指定在 x 轴上显示的格式、轴值、刻度数、网格线和参考线。


    例如，Pickles.JMP 数据列出了三天内每天 8 次的测量值。在此示例中，默认情况下 x 轴每隔一个刻度标注一次。有时这会产生冗余标签，如图 7.7
    左侧所示。如果指定以 8 为增量放置一个标签，且两个标签之间有 7 个刻度，则 x 轴每天标注一次，如右侧图表所示。


    图 7.7 带标签的 x 轴刻度示例


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_115_1.png)


    ## 显示选项


    控制图具有影响平台不同部分的弹出菜单：

    - 最顶部标题栏上的菜单影响整个平台窗口。其菜单项因您选择的图表类型而异。

    - 图表类型标题栏上有一个菜单，其中包含可单独影响每个图表的选项。


    ## 单个图表选项


    当您单击图表名称旁边的图标或右键单击图表区域时，会出现图表选项弹出菜单。


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_116_0.png)


    ### 箱线图


    将箱线图叠加在均值图中绘制的子组均值上。箱线图显示子组最大值、最小值、第 75 百分位数、第 25 百分位数和中位数。除非取消选择“显示点”选项，否则会显示子组均值的标记。所显示的控制限仅适用于子组均值。“箱线图”选项仅适用于
    X̄ 图。它最适用于较大的子组样本量（每个子组超过 10 个样本）。


    ### 针状线


    使用垂直线段将绘制的点连接到中心线。


    ### 连接点


    在连接点与不连接点之间切换。


    ### 显示点


    在显示与不显示表示汇总统计量的点之间切换。初始时会显示这些点。当“箱线图”选项生效时，您可以使用此选项隐藏表示子组均值的标记。


    '
