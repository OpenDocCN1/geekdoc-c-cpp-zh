    - The model is saturated, meaning that the model itself has a degree of freedom
    for each different X value; therefore, there are no degrees of freedom for lack
    of fit.


    The Lack of Fit table shows information about the error terms:


    **Source** lists the three sources of variation called **Lack of Fit**, **Pure
    Error**, and **Total Error**. Note that the pure error DF is pooled from each
    group where there are multiple rows with the same values for each effect.


    The remaining portions of the Lack of Fit table are similar to those of the Analysis
    of Variance Table. The only additional information is the **Max RSq**, the maximum
    *R²* that can be achieved by using only the variables in the model.


    Figure 5.7 Example Leverage Plot from Denim Data


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_92_0.png)


    In addition, there is a special leverage plot titled Whole Model that shows the
    actual values of the response plotted against the predicted values. This Whole
    Model leverage plot dramatizes the test that all the parameters (except intercepts)
    in the model are zero. This illustrates the same test reported in the Analysis
    of Variance report.


    In general, the horizontal line on the plot represents what the values of the
    model would be if the effect was removed from the model. The sloped line represents
    the values of the model with the effect included. Significance of the effect is
    seen by comparing the slope of the sloped line with that of the horizontal one,
    as in Figure 5.9.


    Figure 5.8 General Leverage Plot


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_92_1.png)


    points farther out pull on the line of fit with greater leverage than the points
    near the middle


    Figure 5.9 Significance of Effects


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_92_2.png)


    Significant

    confidence curve crosses horizontal line


    Borderline

    confidence curve asymptotic to horizontal line


    Not Significant

    confidence curve does not cross horizontal line


    confidence curve crosses horizontal line


    confidence curve asymptotic to horizontal line


    confidence curve does not cross horizontal line


    ## Effect Details


    In a Standard Least Squares analysis, the following effect details are available,
    dealing with *least squares means*, designated LS Means by JMP Student Edition.
    More detailed descriptions of each command are available in the online help.


    **Figure 5.10**  Effect Details


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_93_0.png)


    - **LS Means Table** shows predicted values from the specified model across the
    levels of a categorical effect. The other model factors are *controlled*—that
    is, set to neutral values. Least squares means shows which levels produce higher
    or lower responses, holding the other variables in the model constant. Least squares
    means are also called *adjusted means* or *population marginal means*.

    - **LS Means Plot** plots the LSMeans for nominal and ordinal main effects and
    two-way interactions.

    - **LS Means Contrast** displays a dialog for specifying contrasts with respect
    to an effect. (See “Linear Contrasts,” p. 84 for an example of using contrasts.)
    This command is enabled only for categorical effects. To construct a contrast,
    click the + and - buttons beside the levels to be compared. If possible, the dialog
    normalizes after each click to make the sum for a column zero and the absolute
    sum equal to two after each click. It adds to the plus or minus score proportionately.

    - The **LS Means Student’s t** command requests multiple comparison tests.


    ## Exploring the Estimates


    The following commands allow you to further explore the estimated coefficients
    of the model.


    ### Expanded Estimates


    The standard Fit Model output includes a Parameter Estimates Table, as seen in
    Figure 5.11. For continuous effects, the estimates are the (estimated) coefficients
    of each term in the linear model. For nominal effects, the estimates are the coefficients
    of dummy variables whose value is 1 for all levels of the variable except the
    last, which gets the value -1. Ordinal effects show coefficients for dummy variables
    that measure the difference at levels of the variable from the mean of all levels
    of the effect.


    **Figure 5.11**  Parameter Estimates Table


    | Term | Estimate | Std Error | t Ratio | Prob>|t| |

    |---|---|---:|---:|---:|---:|

    | Intercept | 16.964153 | 2.727789 | 6.22 | <.0001* |

    | Method[Alpha Analyze] | -6.132609 | 1.155205 | -5.31 | <.0001* |

    | Method[Caustic Soda] | 4.552406 | 1.146512 | 3.97 | 0.0001* |

    | Size of Load (lbs) | 0.0465825 | 0.014287 | 3.26 | 0.0016* |

    | Sand blasted?[no] | -1.800295 | 0.814471 | -2.21 | 0.0295* |


    The **Expanded Estimates** command shows the same information, but with a coefficient
    for each continuous variable and each level of other variables.

