    The Bounce Data.jmp sample data file has response surface data inspired by the
    tire tread data described in Derringer and Suich (1980). To see this sample data
    table, open the Sample Data folder that was installed when you installed JMP,
    and select Design Experiment > Bounce Data.jmp.


    The objective of this experiment is to match a standardized target value (450)
    of tennis ball bounciness. The bounciness varies with amounts of Silica, Silane,
    and Sulfur used to manufacture the tennis balls. The experimenter wants to collect
    data over a wide range of values for these variables to see if a response surface
    can find a combination of factors that matches a specified bounce target. To follow
    this example:


