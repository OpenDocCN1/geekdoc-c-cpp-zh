    # ## Effect Details


    In a Standard Least Squares analysis, the following effect details are available,
    dealing with *least squares means*, designated LS Means by JMP Student Edition.
    More detailed descriptions of each command are available in the online help.


    **Figure 5.10**  Effect Details


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_93_0.png)


    +   - **LS Means Table** shows predicted values from the specified model across
    the levels of a categorical effect. The other model factors are *controlled*—that
    is, set to neutral values. Least squares means shows which levels produce higher
    or lower responses, holding the other variables in the model constant. Least squares
    means are also called *adjusted means* or *population marginal means*.

    +   - **LS Means Plot** plots the LSMeans for nominal and ordinal main effects
    and two-way interactions.

    +   - **LS Means Contrast** displays a dialog for specifying contrasts with respect
    to an effect. (See “Linear Contrasts,” p. 84 for an example of using contrasts.)
    This command is enabled only for categorical effects. To construct a contrast,
    click the + and - buttons beside the levels to be compared. If possible, the dialog
    normalizes after each click to make the sum for a column zero and the absolute
    sum equal to two after each click. It adds to the plus or minus score proportionately.

    +   - The **LS Means Student’s t** command requests multiple comparison tests.


    # ## Exploring the Estimates


    The following commands allow you to further explore the estimated coefficients
    of the model.


    # ### Expanded Estimates


    The standard Fit Model output includes a Parameter Estimates Table, as seen in
    Figure 5.11. For continuous effects, the estimates are the (estimated) coefficients
    of each term in the linear model. For nominal effects, the estimates are the coefficients
    of dummy variables whose value is 1 for all levels of the variable except the
    last, which gets the value -1. Ordinal effects show coefficients for dummy variables
    that measure the difference at levels of the variable from the mean of all levels
    of the effect.


    **Figure 5.11**  Parameter Estimates Table


    | Term | Estimate | Std Error | t Ratio | Prob>|t| |

    |---|---:|---:|---:|---:|

    | Intercept | 16.964153 | 2.727789 | 6.22 | <.0001* |

    | Method[Alpha Analyze] | -6.132609 | 1.155205 | -5.31 | <.0001* |

    | Method[Caustic Soda] | 4.552406 | 1.146512 | 3.97 | 0.0001* |

    | Size of Load (lbs) | 0.0465825 | 0.014287 | 3.26 | 0.0016* |

    | Sand blasted?[no] | -1.800295 | 0.814471 | -2.21 | 0.0295* |


    The **Expanded Estimates** command shows the same information, but with a coefficient
    for each continuous variable and each level of other variables.'
