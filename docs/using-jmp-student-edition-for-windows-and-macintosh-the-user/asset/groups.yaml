    ## Correlations and Multivariate Techniques


    The Multivariate platform specializes in exploring how many variables relate to
    each other. The platform begins by showing a standard correlation matrix. The
    Multivariate platform popup menu gives the additional correlation options and
    other techniques for looking at multiple variables such as


    - a scatterplot matrix with normal density ellipses

    - inverse, partial, and pairwise correlations

    - a covariance matrix

    - nonparametric measures of association

    - simple statistics (such as mean and standard deviation)


    All plots and the current data table are linked. You can highlight points on any
    scatterplot in the scatterplot matrix, or the outlier distance plot. The points
    are highlighted on all other plots and are selected in the data table.


    ### Introduction


    For a short tour of the Multivariate platform,


    - Open Solubility.jmp from the sample data folder.

    - Select Analyze > Multivariate to bring up the launch dialog.


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_161_0.png)


    When the report appears, you see correlations and a scatterplot matrix.


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_162_0.png)


    From here, you can calculate several different kinds of correlations, including
    nonparametric correlations (see below for instances of each kind).


    Note that the first two variables (1-Octanol and Ether) are correlated with each
    other. In addition, the last four variables are similarly correlated. This suggests
    that the variability in these six variables could be explained in fewer dimensions.
    Principal Components would confirm this.


    Select Principal Components > on Correlations from the platform’s drop-down list.


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_162_1.png)


    The principal components report, shown here, indicates that there are two strong
    directions of variation, corresponding to the eigenvalues of 4.785 and 0.945.
    We can express 95% of the variation of these six dimensions in only two dimensions.


    ### Launch the Platform and Select Options


    When you choose **Analyze > Multivariate**, a standard correlation matrix and
    scatterplot matrix appear first. The platform popup menu shown here lists additional
    correlation options and other techniques for looking at multiple variables. The
    following sections describe the tables and plots offered by the Multivariate platform.


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_163_0.png)


    In most of the following analysis options, a missing value in an observation causes
    the entire observation to be deleted. The exceptions are in **Pairwise Correlations**,
    which exclude rows that are missing on either of the variables under consideration,
    and **Simple Statistics > Univariate**, which calculates its statistics column-by-column,
    without regard to missing values in other columns.


    Many of the following examples use the Solubility.jmp sample data table.


    ### Correlations Multivariate


    The **Correlations Multivariate** option gives the Correlations table, which is
    a matrix of correlation coefficients that summarizes the strength of the linear
    relationships between each pair of response (*Y*) variables. This correlation
    matrix only uses the observations that have nonmissing values for all variables
    in the analysis.


    | Variable | Ether | 1-Octanol | Carbon Tetrachloride | Benzene | Hexane | Chloroform
    |

    |---|---:|---:|---:|---:|---:|---:|

    | Ether | 1.0000 | 0.9343 | 0.5376 | 0.6489 | 0.5494 | 0.5146 |

    | 1-Octanol | 0.9343 | 1.0000 | 0.6151 | 0.7197 | 0.6046 | 0.5976 |

    | Carbon Tetrachloride | 0.5376 | 0.6151 | 1.0000 | 0.9573 | 0.9498 | 0.9210 |

    | Benzene | 0.6489 | 0.7197 | 0.9573 | 1.0000 | 0.9091 | 0.9411 |

    | Hexane | 0.5494 | 0.6046 | 0.9498 | 0.9091 | 1.0000 | 0.8719 |

    | Chloroform | 0.5146 | 0.5976 | 0.9210 | 0.9411 | 0.8719 | 1.0000 |


    ### Inverse Correlations and Partial Correlations


    The inverse correlation matrix (**Inverse Corr** table), shown at the top of the
    next figure, provides useful multivariate information. The diagonal elements of
    the matrix are a function of how closely the variable is a linear function of
    the other variables. In the inverse correlation, the diagonal is 1/(1 − *R*²)
    for the fit of that variable by all the other variables. If the multiple correlation
    is zero, the diagonal inverse is 1.


    ### Scatterplot Matrix


    **Figure 9.1 Example of a Scatterplot Matrix**


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_165_0.png)


    > Two clusters of correlations: The first two variables and the next four.


    The popup menu next to the **Scatterplot Matrix** title bar button lets you tailor
    the matrix with color and density ellipses, and by setting the α-level.


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_165_1.png)


    - **Density Ellipses** toggles the display of the density ellipses on the scatterplots
    constructed by the α level that you choose. By default they are 95% ellipses.

    - **Show Correlations** shows the correlation coefficient in the upper left corner
    of each scatterplot.

    - **Show Histograms** draws histograms in the diagonal of the scatterplot matrix.
    These histograms can be specified as **Horizontal** or **Vertical**. In addition,
    you can toggle the counts that label each bar with the **Show Counts** command.


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_166_0.png)


    Ellipse α lets you select from a submenu of standard α-levels or select the Other
    command and specifically set the α level for the density ellipses.


    Ellipse Color lets you select from a palette of colors to change the color of
    the ellipses.


    You can reorder the scatterplot matrix columns by dragging a diagonal (label)
    cell to another position on the diagonal. For example, if you drag the cell of
    the column labeled 1-octanol diagonally down one cell, the columns reorder as
    shown in Figure 9.2.


    When you look for patterns in the whole scatterplot matrix with reordered columns,
    you clearly see the variables cluster into groups based on their correlations,
    as illustrated previously by the two groups shown in Figure 9.1.


    **Figure 9.2 Reorder Scatterplot Matrix**


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_166_1.png)


    Drag cell diagonally


    ### Covariance Matrix


    The Covariance Matrix command displays the covariance matrix for the analysis.


    ### Pairwise Correlations


    The Pairwise Correlations table lists the Pearson product-moment correlations
