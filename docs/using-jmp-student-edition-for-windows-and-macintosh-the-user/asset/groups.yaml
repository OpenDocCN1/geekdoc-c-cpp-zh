    - *Center points*, for which all the factor values are at the zero (or midrange)
    value.

    - *Axial (or star) points*, for which all but one factor are set at zero (midrange)
    and that one factor is set at outer (axial) values.


    The Box-Behnken design, illustrated in the figure on the right below, is an alternative
    to central composite designs.


    One distinguishing feature of the Box-Behnken design is that there are only three
    levels per factor.


    Another important difference between the two design types is that the Box-Behnken
    design has no points at the vertices of the cube defined by the ranges of the
    factors. This is sometimes useful when it is desirable to avoid these points due
    to engineering considerations. The price of this characteristic is the higher
    uncertainty of prediction near the vertices compared to the central composite
    design.


