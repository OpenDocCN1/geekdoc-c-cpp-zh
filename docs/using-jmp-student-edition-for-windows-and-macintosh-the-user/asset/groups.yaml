    # Getting Started with JMP Student Edition


    Welcome to JMP Student Edition—the version of SAS Institute’s award-winning JMP
    Statistical Discovery software tailor-made for the introductory statistics student.


    JMP Student Edition is easy to learn and easy to use. All of the statistics are
    accessible in a familiar, point-and-click format, and the statistical concepts
    are supported with both graphs and appropriate numerical results. In addition,
    all the data tables, graphs, and charts are dynamically linked together, allowing
    for interactive exploration of patterns and outliers, whenever they present themselves.
    We hope that this visualization makes learning statistics more fun and easier
    than it has ever been before.


    # Prerequisites For This Book


    To use JMP Student Edition, minimal knowledge about computers and statistics is
    necessary. The specific prerequisites are as follows:


    # Computer and Operating System


    In this manual, familiarity with standard computer operations and operating system
    terminology is assumed, especially use of the mouse, standard menus, and commands.
    Knowledge of opening, closing, and saving files should also exist before reading
    this guide. See the reference books for the operating system and computer for
    more information on these topics.


    # Statistics


    Since JMP Student Edition is specially-made for the beginning statistics student,
    it requires no formal statistics knowledge. This book shows how to accomplish
    simple statistical tasks, like those in all introductory statistics texts.


    # Learning JMP Student Edition with its Documentation


    JMP Student Edition includes an extensive online help system. It can be read like
    a book, since it contains a complete table of contents, or it can be used to search
    for a specific topic.


    In addition, JMP Student Edition is equipped with context-sensitive help. To use
    it, select the help tool (see Figure 1.1) and click anywhere inside a data table
    or report. JMP Student Edition opens help specific to the item you clicked.'
  - '[PAGE 12]


    Figure 1.1 The JMP Student Edition Help Tool


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_12_0.png)


    # Conventions Used in This Book


    Throughout this manual, special typefaces are used to designate commands, menu
    items, or other unique features.


    +   - **Menu items**, **buttons**, and **report titles** are usually set by JMP
    Student Edition and are not alterable by the user.

    +   - **Variables** under study are arranged in **columns** in the data spreadsheet,
    so the words **variable** and **column** are often used interchangeably.

    +   - **File names** are opened and saved to disk or network folders.

    +   - *New* or *important words* are emphasized.


    Certain paragraphs are meant to be carried out while reading the text. They are
    designated by a mouse on the left.


    +   - The notation **File > Open** means to select the **Open** command from the
    **File** menu.

    +   - Sections titled “Introduction” provide a hands-on approach to learning the
    basics of JMP Student Edition. Each “Introduction” section explores the Denim.jmp
    sample data set using a specified platform or function. They are separate from
    the rest of the material in the chapter. In fact, all the “Introduction” sections
    could be read from each chapter before reading the rest of the material in the
    book, which is intended primarily as a reference.


    # Starting JMP Student Edition


    JMP Student Edition can be started in two ways:


    +   - Double-click the JMP Student Edition icon

    +   - Double-click a JMP Student Edition data set or script.


    By default, JMP Student Edition begins by opening a special navigation window,
    called the *JMP Starter* (see Figure 1.2). If the JMP Starter is not automatically
    opened,


    Select **View > JMP Starter**.'
  - '[PAGE 13]


    # Getting Started with JMP Student Edition


    # Figure 1.2  The JMP Starter Window


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_13_0.png)


    This window provides quick and easy access to all the menu commands of JMP Student
    Edition. Although these commands are accessible through menus and toolbars, they
    are also presented in the JMP Starter in a logical, organized way. There are nine
    tabs groups that partition the commands based on their function:


    +   - The **File** group contains commands related to opening and closing several
    types of files.

    +   - The **Basic** group contains commands that perform analyses for one-variable
    and two-variable situations.

    +   - The **Model** group contains commands for matched pairs (a special two-variable
    situation) and multivariate models.

    +   - The **Survival** group contains reliability and survival commands.

    +   - The **Graph** group contains commands for charts and 3D graphics.

    +   - The **Measure** group contains tools for capability analysis.

    +   - The **Control** group contains commands for control charts.

    +   - The **DOE** group contains commands for designing an experiment.

    +   - The **Tables** tab contains commands used to manipulate data tables.


    # JMP Student Edition Toolbars


    An alternative way of accessing JMP Student Edition commands is by using toolbars.


    # Windows


    Toolbars that duplicate the JMP Starter’s commands include the File/Edit toolbar
    (Figure 1.3), the Tools toolbar (Figure 1.4), the Analyze toolbar (Figure 1.5),
    the Graph toolbar (Figure 1.6), and the'
  - '[PAGE 14]


    Tables toolbar (Figure 1.7). There is also a Data Files toolbar, used to switch
    between open data tables, as well as user-customizable toolbars. Each of these
    commands is explained fully in later chapters.


    # Figure 1.3 The File/Edit Toolbar


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_14_0.png)


    # Figure 1.4 The Tools Toolbar


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_14_1.png)


    # Figure 1.5 The Analyze Toolbar


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_14_2.png)


    # Figure 1.6 The Graph Toolbar


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_14_3.png)


    # Figure 1.7 The Tables Toolbar


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_14_4.png)


    Some of these toolbars are not displayed by default. To activate toolbars that
    are not showing,


    +   - Select View > Toolbars > Show Toolbars to open the Show Toolbars window
    (Figure 1.8)'
  - '[PAGE 15]


    Toolbars that are checked become visible. Those that are unchecked are hidden.


    Figure 1.8 Show Toolbars Window


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_15_0.png)


    # Macintosh


    On the Macintosh, toolbars are not set in groups, but are all available to be
    added to a single toolbar. To see the definitions of each button on the toolbar,
    or to add and subtract buttons from the toolbar,


    +   - Control-click on the toolbar area of a window.

    +   - From the window that appears, drag buttons onto the toolbar to add them.


    # First Session


    This section is a guide through a few simple steps that demonstrate opening a
    data table, requesting an analysis, and closing a data table.


    +   - To open a data table, select File > Open, select Open Data Table from the
    JMP Starter, or click the Open button on the File/Edit toolbar.


    +   - Select the file Denim.jmp and click Open.


    The data should appear like the listing in Figure 1.9.'
