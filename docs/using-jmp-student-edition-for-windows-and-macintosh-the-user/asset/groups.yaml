    \ 键。\n\n完成添加因子后，单击 Continue。\n\n## 选择输出选项\n\n使用 Output Options 面板指定希望输出数据表的外观：\n\
    \n![](img/a858f3b35ed4923af65c22e8829ee5a8_196_1.png)\n\n- Run Order—可指定在数据表创建时希望运行在数据表中出现的顺序。选项有：\n\
    \  - Keep the Same—输出表中的行（运行）与 Design 面板中的显示方式相同。\n  - Sort Left to Right—输出表中的行（运行）按从左到右排序。\n\
