  - '[PAGE 169]


    # Computations and Statistical Details


    # Pearson Product-Moment Correlation


    The Pearson product-moment correlation coefficient measures the strength of the
    linear relationship between two variables. For response variables X and Y, it
    is denoted as r and computed as


    r = Σ(x - x̄)(y - ȳ) / √[Σ(x - x̄)²] √[Σ(y - ȳ)²]


    If there is an exact linear relationship between two variables, the correlation
    is 1 or −1, depending on whether the variables are positively or negatively related.
    If there is no linear relationship, the correlation tends toward zero.


    # Nonparametric Measures of Association


    For the Spearman, Kendall, or Hoeffding correlations, the data are first ranked.
    Computations are then performed on the ranks of the data values. Average ranks
    are used in case of ties.


    # Spearman''s ρ (rho) Coefficients


    Spearman''s ρ correlation coefficient is computed on the ranks of the data using
    the formula for the Pearson''s correlation previously described.


    # Kendall''s τ_b Coefficients


    Kendall''s τ_b coefficients are based on the number of concordant and discordant
    pairs. A pair of rows for two variables is concordant if they agree in which variable
    is greater. Otherwise they are discordant, or tied.


    The formula


    τ_b = Σ_{i<j} sgn(x_i - x_j) sgn(y_i - y_j) / √[(T0 - T1)(T0 - T2)]


    computes Kendall''s τ_b where


    T0 = (n(n - 1))/2,

    T1 = Σ((t_i)(t_i - 1))/2, and

    T2 = Σ((u_i)(u_i - 1))/2,


    Note that sgn(z) is equal to 1 if z > 0, 0 if z = 0, and −1 if z < 0.


    The t_i (the u_i) are the number of tied x (respectively y) values in the i-th
    group of tied x (respectively y) values, n is the number of observations, and
    Kendall''s τ_b ranges from −1 to 1. If a weight variable is specified, it is ignored.'
  - '[PAGE 170]


    Computations proceed in the following way:


    +   - Observations are ranked in order according to the value of the first variable.

    +   - The observations are then re-ranked according to the values of the second
    variable.

    +   - The number of interchanges of the first variable is used to compute Kendall’s
    τ_b.


    # Hoeffding''s D Statistic


    The formula for Hoeffding''s D (1948) is


    ```

    D = 30( ( (n-2)(n-3)D1 + D2 - 2(n-2)D3 ) / ( n(n-1)(n-2)(n-3)(n-4) ) ) where

    D1 = Si(Qi - 1)(Qi - 2)

    D2 = Si(Ri - 1)(Si - 1)(Si - 2)

    D3 = (Ri - 1)(Si - 2)(Qi - 1)

    ```


    The Ri and Si are ranks of the x and y values, and the Qi (sometimes called bivariate
    ranks) are one plus the number of points that have both x and y values less than
    the ith points. A point that is tied on its x value or y value, but not on both,
    contributes 1/2 to Qi if the other value is less than the corresponding value
    for the ith point. A point tied on both x and y contributes 1/4 to Qi.


    When there are no ties among observations, the D statistic has values between
    −0.5 and 1, with 1 indicating complete dependence. If a weight variable is specified,
    it is ignored.


    # Inverse Correlation Matrix


    The inverse correlation matrix provides useful multivariate information. The diagonal
    elements of the inverse correlation matrix, sometimes called the variance inflation
    factors (VIF), are a function of how closely the variable is a linear function
    of the other variables. Specifically, if the correlation matrix is denoted R and
    the inverse correlation matrix is denoted R⁻¹, the diagonal element is denoted
    rⁱⁱ and is computed as


    ```

    rⁱⁱ = VIFᵢ = 1 / (1 - Rᵢ²)

    ```


    where Rᵢ² is the coefficient of variation from the model regressing the iᵗʰ explanatory
    variable on the other explanatory variables. Thus, a large rⁱⁱ indicates that
    the iᵗʰ variable is highly correlated with any number of the other variables.


    Note that the definition of R² changes for no-intercept models. For no-intercept
    and hidden-intercept models, JMP uses the R² from the uncorrected Sum of Squares,
    i.e. from the zero model, rather than the corrected sum of squares, from the mean
    model.'
