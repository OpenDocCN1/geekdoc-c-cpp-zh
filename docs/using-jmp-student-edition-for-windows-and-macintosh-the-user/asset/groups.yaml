  mdcn: "\n\n# 水平选项\n\n点击图例中的某个值可将其高亮显示。右键单击高亮显示的图例，可显示“颜色”和“标记”调色板的命令，这些命令与图10.10中的叠加图对应命令相同。这些命令仅影响高亮显示的水平及其在数据表中关联的行。\n\
    \n# 平台选项\n\n图表出现后，其下拉菜单包含以下选项。\n\n- **叠加（Overlay）**：当图表有多个Y（统计量）变量时，显示单个叠加图表。每个图表可以有自己的图表类型，并且可以叠加。例如，图10.10所示的图表有两个叠加变量，一个为条形图，一个为针形图。当“叠加”未选中时，平台会为每个图表显示重复的轴标注。\n\
    \n图10.12 不同的图表类型\n\n![](img/a858f3b35ed4923af65c22e8829ee5a8_184_0.png)\n\n- **垂直（Vertical）**：将水平条形图或饼图更改为垂直条形图。\n\
    - **水平（Horizontal）**：将垂直条形图或饼图更改为水平条形图。\n- **饼图（Pie）**：将水平或垂直图表更改为饼图。\n- **Y选项（Y\
    \ Options）**：访问“单图表选项”（第182页）中所述的选项。这些选项影响其图例被高亮显示的变量。\n- **水平选项（Level Options）**：访问“水平选项”（第184页）中所述的颜色、标记和图案调色板选项。这些选项影响高亮显示的条形。\n\
    - **分离轴（Separate Axes）**：当有多个图表时，为每个图表重复显示轴标注。默认情况下，如果图表未叠加，轴标注仅显示在最后显示的图表上。仅当存在多个未叠加的Y变量时，“分离轴”才会在菜单中启用。\n\
    - **脚本（Script）**：包含适用于所有平台的命令子菜单，用于重做分析或将分析的JSL命令保存到窗口或文件。（参见“脚本子菜单”，第66页。）\n\n\
    # 叠加图平台\n\n叠加图平台将数值型Y变量与单个数值型或字符型X变量叠加。可选地，X变量的值按升序排列，并按照该顺序绘制和连接点。\n\n叠加图平台具有通过叠加图标题栏上的弹出菜单图标访问的平台绘图选项。每个Y变量还有一个单图选项菜单，当右键单击图下方的Y变量图例时显示。这些单个图选项与平台级别的**Y选项**子菜单中的选项相同。在平台级别选择其中某个选项时，如果未高亮显示任何图例，则该选项影响报告中的所有图；如果高亮显示了一个或多个图例，则这些选项影响所有高亮显示的图。\n\
    \n## 平台选项\n\n平台选项影响报告窗口中的每个图。\n\n- **叠加（Overlay）**：叠加所有分配了Y角色的列的图。图初始以叠加形式显示，并启用**连接点**选项。当“叠加”选项关闭时，图将分开显示。\n\
    - **分离轴（Separate Axes）**：让X轴刻度值仅打印一次，位于窗口中的最后一个图上。当选中**分离轴**时，其他Y变量的X轴显示刻度标记，但不显示刻度值。\n\
    - **统一Y刻度（Uniform Y Scale）**：使分组图的Y刻度保持一致。\n- **连接缺失值（Connect Through Missing）**：连接图中相邻的点，即使它们之间存在缺失值。\n\
    - **范围图（Range Plot）**：在每个X值处，用一条两端带有短线的线连接最低点和最高点。\n\n  *注：* 下述的**针形**选项与**范围**选项不能同时选择。\n\
    - **Y选项（Y Options）**：从主平台窗口中选择时，其子菜单中的选项适用于报告窗口中的*所有*变量和图。“单图选项”一节（第186页）描述了每个单独变量的Y选项。\n\
    - **取消分组图（Ungroup Plots）**：为分组变量的每个水平创建单独的图表。\n- **排列图（Arrange Plots）**：允许您指定每行中的图数量。\n\
    - **脚本（Script）**：包含适用于所有平台的命令子菜单，用于重做分析或将分析的JSL命令保存到窗口或文件。（参见“脚本子菜单”，第66页。）\n\n\
    ## 单图选项\n\n每个Y变量在图表下方都有标签，显示其名称和符号。可以通过右键单击变量名称调出菜单来修改每个Y变量的图。\n\n- **显示点（Show\
    \ Points）**：交替显示或隐藏点。\n- **连接点（Connect Points）**：一个切换开关，用于用线交替连接点。即使**显示点**未启用，**连接点**也可以被激活，从而为图表显示提供更大的灵活性。\n\
    - **针形（Needle）**：从每个点向X轴绘制一条垂直线。\n- **阶梯（Step）**：通过从每个点向后续点的X值绘制一条水平直线，然后绘制一条垂直直线到达该点，以离散阶梯方式连接点的位置。图10.13展示了不显示点时的**阶梯**效果。\n\
    \n*注：* **连接点**、**针形**和**阶梯**中同一时间只能选择一项。\n\n# 图10.13 叠加阶梯图\n\n![](img/a858f3b35ed4923af65c22e8829ee5a8_186_0.png)\n\
    \n- **函数图（Function Plot）**：将存储在Y列中的公式绘制为平滑曲线。要使用此功能，请在Y列中存储一个作为单个X列函数的公式。例如，下面的列包含一个涉及正弦函数的公式。在叠加图中使用时，该函数将绘制为曲线而不是单个点。\n\
    \n![](img/a858f3b35ed4923af65c22e8829ee5a8_186_1.png)\n\n注：当Y列包含公式时，叠加图通常假定您需要函数图。然而，包含随机数函数的公式更常用于模拟，而模拟中通常不需要函数绘图。因此，当存在随机数函数时，“函数图”选项默认关闭，而对于其他所有函数则默认开启。\n\
    \n- **连接颜色（Connect Color）**：显示标准JMP颜色调色板（参见图10.10），用于为连接点的线指定颜色。\n- **叠加标记（Overlay\
    \ Marker）**：使用标准JMP标记调色板（参见图10.10）为绘制的点分配标记。\n- **叠加标记颜色（Overlay Marker Color）**：允许您选择叠加标记的颜色。\n\
    - **线型（Line Style）**和**线宽（Line Width）**：允许您调整图上所绘制线的外观。\n\n完成的对话框如图11.1所示。\n\n\
    # 图11.1 全因子示例响应和因子面板\n\n![](img/a858f3b35ed4923af65c22e8829ee5a8_190_0.png)\n\n\
    - 6. 点击**继续（Continue）**以查看输出选项面板。全因子设计包括五个变量的高水平和低水平所有组合的试验，共32次试验。\n- 7. 点击**生成表格（Make\
    \ Table）**。\n\n设计数据表（图11.3）包含了五个变量的高水平和低水平每个组合的一次试验。由于有五个变量，因此共有2⁵ = 32次试验。这涵盖了五个因子各两个水平的所有组合。最初，表中有一个名为“Percent\
    \ Reacted”的空Y列，用于在实验完成后输入响应值。\n\n您表中的值可能不同于下方显示的值。\n\n# 图11.2  2⁵ 因子反应器数据\n\n\
    ![](img/a858f3b35ed4923af65c22e8829ee5a8_190_1.png)\n\n要查看完整的实验并继续此示例，请打开安装JMP时安装的**样本数据**文件夹。在该文件夹中，打开**设计实验\
    \ > Reactor 32 Runs.jmp**。\n\n# 图11.3  Reactor 32 Runs.jmp\n\n![](img/a858f3b35ed4923af65c22e8829ee5a8_191_0.png)\n\
    \n在拟合因子模型之前，先快速查看数据来开始分析。\n\n- 1. 选择**分析 > 分布**。\n- 2. 高亮**Percent Reacted**并点击**Y，列**。然后点击**确定**。\n\
    - 3. 点击“Percent Reacted”标题栏上的红色三角形图标，并选择**正态分位数图**。结果如图11.4所示。\n\n# 图11.4 反应器数据响应变量的分布\n\
    \n![](img/a858f3b35ed4923af65c22e8829ee5a8_191_1.png)\n\n使用逐步回归开始正式分析。数据表带有存储的脚本，该脚本自动定义包含主效应和所有双因子交互作用的模型分析，并调出“逐步”控制面板。\n\
    \n- 1. 点击“拟合模型”脚本旁边的红色三角形图标，并选择**运行脚本**。\n- 2. 模型中因子的进入概率（Prob to Enter）应为0.05。\n\
    - 3. 因子的剔除概率（Prob to Leave）应为0.1。\n\n"
