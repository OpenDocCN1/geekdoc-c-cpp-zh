  md: "\n## Counts per Unit\n\nThe Counts per Unit selection calculates sample size\
    \ for the Poisson-distributed counts typical when you can measure more than one\
    \ defect per unit. A unit can be an area and the counts can be fractions or large\
    \ numbers.\n\nAlthough the number of defects observed in an area of a given size\
    \ is often assumed to have a Poisson distribution, the area and count are assumed\
    \ to be large enough to support a normal approximation.\n\nQuestions of interest\
    \ are:\n\n- Is the defect density within prescribed limits?\n- Is the defect density\
    \ greater than or less than a prescribed limit?\n\nEnter alpha and the baseline\
    \ count per unit. Then enter two of the remaining fields to see the calculation\
    \ of the third. The test is for one-sided (one-tailed) change. Enter the Difference\
    \ to Detect in terms of the baseline count per unit (defects per unit). The computed\
    \ sample size is expressed in those units.\n\nAs an example, consider a wafer\
    \ manufacturing process with a target of 4 defects per wafer and you want to verify\
    \ that a new process meets that target.\n\n1. Select **DOE > Sample Size and Power**.\n\
    2. Click the **Counts per Unit** button.\n3. Enter an alpha of 0.1 to be the chance\
    \ of failing the test if the new process is as good as the target.\n4. Enter a\
    \ power of 0.9, which is the chance of detecting a change larger than 2 (6 defects\
    \ per wafer). In this kind of situation, alpha is sometimes called the *producer’s\
    \ risk* and beta is called the *consumer’s risk*.\n5. Click **Continue** to see\
    \ the computed sample size of 8.128 (Figure 14.12).\n\nThe process meets the target\
    \ if there are less than 48 defects (6 defects per wafer in a sample of 8 wafers).\n\
    \n![](img/a858f3b35ed4923af65c22e8829ee5a8_235_0.png)\n\n## Sigma Quality Level\n\
    \nUse the Sigma Quality Level feature, accessed by selecting DOE > Sample Size\
    \ and Power, by entering any two of the following three quantities:\n\n- number\
    \ of defects\n- number of opportunities\n- Sigma quality level\n\nWhen you click\
    \ Continue, the sigma quality calculator computes the missing quantity using the\
    \ formula Sigma Quality Level = NormalQuantile(1 - defects/opportunities) + 1.5.\n\
    \nAs an example, use the Sample Size and Power feature to compute the Sigma quality\
    \ level for 50 defects in 1,000,000 opportunities:\n\n1. Select DOE > Sample Size\
    \ and Power.\n2. Click the Sigma Quality Level button.\n3. Enter 50 for the number\
    \ of defects and 1,000,000 as the number of opportunities, as shown in the window\
    \ to the left in Figure 14.13.\n4. Click Continue. The results, as shown in the\
    \ window on the right in Figure 14.13, are a Sigma quality level of 5.3.\n\nFigure\
    \ 14.13 Sigma Quality Level Example 1\n\n![](img/a858f3b35ed4923af65c22e8829ee5a8_236_0.png)\n\
    \nIf you want to know how many defects reduce the Sigma Quality Level to “six-sigma”\
    \ for 1,000,000 opportunities, enter 6 as the Sigma Quality Level and leave the\
    \ Number of Defects blank (window to the left in Figure 14.14). The computation\
    \ (window to the right in Figure 14.14) shows that the Number of Defects cannot\
    \ be more than approximately 3.4.\n\nFigure 14.14 Sigma Quality Level Example\
    \ 2\n\n![](img/a858f3b35ed4923af65c22e8829ee5a8_237_0.png)\n\n## Index\n\n###\
