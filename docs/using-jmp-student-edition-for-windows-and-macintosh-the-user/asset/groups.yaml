    # The Distribution Platform


    Single-variable statistics are the domain of JMP Student Edition’s Distribution
    platform. It calculates summary statistics, displays graphs, and computes hypothesis
    tests for these variables.


    # Introduction


    Open the data file Denim.jmp.


    For information on opening a file, see “First Session,” p. 15.


    # About the Data


    This file contains information from an experiment with blue jeans, and is referred
    to in each introductory section of this book. When blue jeans are manufactured,
    they usually contain a fair amount of starch, creating stiffness and stability
    in the fabric. However, most people find this stiffness undesirable—in fact, some
    customers say that jeans have a “breaking in” period before they become truly
    comfortable. This breaking in period is, in actuality, the time it takes for some
    of the starch present in the jeans to wear away and wash out.


    In an effort to minimize the amount of time needed to break in a new pair of jeans,
    denim manufacturers subject the fabric to a variety of treatments to remove some
    of the starch. This experiment used three such treatments in differently-sized
    wash loads. The three different treatments, recorded in the Method column, are
    as follows:


    +   - *Alpha Amalyze* is an enzyme added to the wash water that eats the starch.

    +   - *Caustic Soda* is a chemical dissolved in the wash water that chemically
    destroys the starch.

    +   - *Pumice Stone* are a physical abrasive that is added to the wash water that
    literally pounds the starch out. These abrasive pebbles are the source of the
    so-called *stone-washed* jeans.


    In addition, after the initial washing process, some jeans are sand blasted. Whether
    or not the fabric was sand blasted is recorded in the Sand Blasted? column. The
    samples came from several different rolls of fabric, with each roll identified
    in the Lot Number column.


    After treating the jeans, two measurements were taken: one to quantify the starch
    content of the fabric (measuring stiffness, recorded as a percentage of weight)
    and one as a count of destroyed threads (measuring wear-and-tear, recorded in
    the Thread Wear Measured column). The measured thread wear has been converted
    into an ordinal variable in the Thread Wear column by using the Formula Editor.'
