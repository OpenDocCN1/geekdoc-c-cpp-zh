  - '[PAGE 101]


    When the report appears, you are presented with a control panel, used to specify
    how effects should enter or exit the model. In this example, we to add any effects
    that are significant at the 0.25 level or better.


    Leave 0.25 as the Prob to Enter.


    We now have a choice of three stepwise methods: Forward (where effects are added
    as they become significant), Backward (where effects are removed as they become
    noon-significant) or Mixed, a combination of the two detailed below. This example
    uses forward selection, so


    Leave the default Forward selection method.


    We now want to add significant effects. To add the first detected effect,


    Click the Step button.


    After one step, the most significant term Runtime is entered into the model (top
    Current Estimates table in Figure 6.3).


    To automatically add all the detected effects automatically (rather than manually
    with the Step button)


    Click Go to see the stepwise process run to completion.


    The bottom table in Figure 6.3 shows that all the terms have been added except
    RstPulse and Weight which are not significant at the Prob to Enter value of 0.25
    specified in the Stepwise Regression Control Panel.


    # Figure 6.3 Current Estimates Table


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_101_0.png)


    Now that we have selected the effects that contribute to explaining Oxy, we can
    make a model and examine its analysis.


    Click Make Model.


    A Fit Model dialog appears.


    Click Run Model.


    This produces a report identical to those seen in “The Fit Model Platform” chapter.'
  - '[PAGE 102]


    # The Stepwise Window


    When launched, the stepwise platform displays a window that shows three areas:


    +   - The Stepwise Regression Control panel, which is an interactive control panel
    for operating the platform

    +   - The Current Estimates table, which shows the current status of the specified
    model, and provides additional control features

    +   - The Step History table, which lists the steps in the stepwise selection.


    The following sections describe the components of these areas and tell how to
    use them.


    # Stepwise Regression Control Panel


    The Stepwise Regression Control Panel (Control Panel for short), shown next, has
    editable areas, buttons and a popup menu. You use these dialog features to limit
    regressor effect probabilities, determine the method of selecting effects, begin
    or stop the selection process, and create a model.


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_102_0.png)


    You use the Control Panel as follows:


    +   - Prob to Enter is the significance probability that must be attributed to
    a regressor term for it to be considered as a forward step and entered into the
    model. Click the field to enter a value.

    +   - Prob to Leave is the significance probability that must be attributed to
    a regressor term in order for it to be considered as a backward step and removed
    from the model. Click the field to enter a value.

    +   - Direction accesses the popup menu shown here, which lets you choose how
    you want variables to enter the regression equation.


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_102_1.png)


    +   - Forward brings in the regressor that most improves the fit, given that term
    is significant at the level specified by Prob to Enter.'
  - '[PAGE 103]


    +   - **Backward** removes the regressor that affects the fit the least, given
    that term is not significant at the level specified in **Prob to Leave**.

    +   - **Mixed** alternates the forward and backward steps. It includes the most
    significant term that satisfies **Prob to Enter** and removes the least significant
    term satisfying **Prob to Leave**. It continues removing terms until the remaining
    terms are significant and then it changes to the forward direction.


    Buttons on the controls panel let you control the stepwise processing:


    +   - **Go** starts the selection process. The process continues to run in the
    background until the model is finished.

    +   - **Stop** stops the background selection process.

    +   - **Step** stops after each step of the stepwise process

    +   - **Enter All** enters all unlocked terms into the model.

    +   - **Remove All** removes all terms from the model.

    +   - **Make Model** forms a model for the Model Specification Dialog from the
    model currently showing in the Current Estimates table. In cases where there are
    nominal or ordinal terms, **Make Model** can create new data table columns to
    contain terms that are needed for the model.


    # Current Estimates Table


    The Current Estimates table lets you enter, remove, and lock in model effects.
    The platform begins with no terms in the model except for the intercept, as is
    shown here. The intercept is permanently locked into the model.


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_103_0.png)


    You use check boxes to define the stepwise regression process:


    +   - **Lock** locks a term in or out of the model. Lock does not permit a term
    that is checked to be entered or removed from the model. Click an effect''s check
    box to change its lock status.

    +   - **Entered** shows whether a term is currently in the model. You can click
    a term''s check box to manually bring an effect into or out of the model.


    The following quantities update continually during the fitting process and are
    used in determining the final model.


    +   - **Parameter** lists the names of the regressor terms (effects).

    +   - **Estimate** is the current parameter estimate. It is missing (.) if the
    effect is not currently in the model.'
