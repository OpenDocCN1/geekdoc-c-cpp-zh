    # Figure 3.18 Alignment of Comparison Circles


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_63_0.png)


    Compare each pair of group means visually by examining how the comparison circles
    intersect. The outside angle of intersection tells whether group means are significantly
    different (see Figure 3.19). Circles for means that are significantly different
    either do not intersect or barely intersect, so that the outside angle of intersection
    is less than 90°. If the circles intersect by an angle of more than 90°, or if
    they are nested, the means are not significantly different.


    If the intersection angle is close to 90°, it is easy to verify whether the means
    are significantly different by clicking on the comparison circle, thus highlighting
    it. The highlighted circle appears with a thick solid line. Circles representing
    means that are not significantly different from the highlighted circle show with
    thin lines (see Figure 3.20). Circles representing means that are significantly
    different show with a thick gray pattern. To deselect circles, click in the graph
    outside the circles.


    # Figure 3.19 Angles in Comparison Circles


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_63_1.png)'
  - '[PAGE 64]


    # Figure 3.20 Comparison Circles after Clicking


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_64_0.png)


    The Nonparametric submenu allows computation of three nonparametric tests: the
    Wilcoxon, Median, and van der Warden tests. Nonparametric tests are useful to
    test whether group means or medians are located the same across groups. However,
    the usual analysis of variance assumption of normality is not made. Nonparametric
    tests use functions of the response variable ranks, called rank scores.


    +   - Wilcoxon rank scores are the simple ranks of the data. The Wilcoxon test
    is the most powerful rank test for errors with logistic distributions.

    +   - Median rank scores are either 1 or 0 depending on whether a rank is above
    or below the median rank. The Median test is the most powerful rank test for errors
    with doubly exponential distributions.

    +   - Van der Waerden rank scores are the ranks of the data divided by one plus
    the number of observations transformed to a normal score by applying the inverse
    of the normal distribution function. The Van der Waerden test is the most powerful
    rank test for errors with normal distributions.


    The UnEqual Variances command tests for equality of group variances. It uses (and
    reports) four different tests: O''Brien''s test, the Brown-Forsythe test, Levene''s
    test, and Bartlett''s test. When the variances across groups are not equal, the
    usual analysis of variance assumptions are not satisfied, so the standard ANOVA
    F test is not valid. There is a valid variant of the standard ANOVA, called the
    Welch ANOVA, which is displayed.


    Set Alpha Level has a submenu that allows a choice from the most common alpha
    levels, or the specification of any level with the Other selection. Changing the
    alpha level recalculates any confidence limits, adjusts the means diamonds on
    the plot if they are showing, and modifies the upper and lower confidence level
    values in reports.


    Normal Quantile Plot shows overlaid normal quantile plots for each level of the
    X variable. Along with the standard normality-assessing capabilities of the single-variable
    Normal Quantile Plot, this plot shows both the differences in the means (vertical
    position) and the variances (slopes) for each level of the categorical X factor
    (Figure 3.21).'
