    \n## 筛选设计\n\n## 设计实验\n\n筛选设计可以说是工业实验中最流行的设计。它们检查许多因子，以了解哪些因子对过程结果的影响最大。\n\n与其它设计方法相比，筛选设计所需的实验运行次数更少，这就是它们便宜的原因。因此，它们很有吸引力，因为它们是开始改进过程的一种廉价高效的方法。\n\
    \n筛选设计通常是进一步实验的前奏。明智的做法是将资源预算的约四分之一用于初始筛选实验。然后，您可以使用结果来指导进一步的研究。\n\n筛选设计的效率取决于效应稀疏性的关键假设。效应稀疏性之所以存在，是因为现实世界的过程通常只有少数几个驱动因子；其它因子相对不重要。为了理解效应稀疏性的重要性，您可以将筛选设计与全因子设计进行对比：\n\
