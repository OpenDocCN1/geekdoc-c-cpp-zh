    - Number of Center Points—指定在每个连续因子的范围中心放置的额外运行次数。\n- Number of Replicates—指定整个设计（包括中心点）的重复次数。\
    \ 在关联的文本框中输入要重复设计的次数。一次重复会使运行次数翻倍。\n\n## 创建表格\n\n单击 Make Table 时，将出现图 11.15 所示的表格。\n\
    \n图 11.15 全因子设计表\n\n表的名称是生成它的设计类型。\n\n此脚本可让您轻松使用设计表中的值拟合模型。\n\nPattern 列中的值描述了每一行代表的运行\n\
