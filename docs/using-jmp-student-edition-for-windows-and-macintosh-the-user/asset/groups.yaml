    \ example, you may be testing that a certain combination of the factors sums to\
    \ 1. You would enter a 1 beside the “=” in this dialog.\n\n**Add Column** adds\
    \ another column of zeros so that several linear functions of the parameters can\
    \ be jointly tested. Use the **Add Column** button to add as many columns to the\
    \ test as needed.\n\nWhen the test is specified, click **Done** to see the test\
    \ performed. The results are appended to the bottom of the dialog.\n\nWhen the\
    \ custom test is done, the report lists the test name, the function value of the\
    \ parameters tested, the standard error, and other statistics for each test column\
    \ in the dialog. A joint F test for all columns is at the bottom. Sample output\
    \ for a custom test (that the Size of Load coefficient is equal to 1) is shown\
    \ in Figure 5.14.\n\n### Figure 5.14 Custom Test Output\n\n![](img/a858f3b35ed4923af65c22e8829ee5a8_95_0.png)\n\
    \nNote: For tests within a categorical effect, instead of using a Custom test,\
    \ consider using the contrast dialog, which tests hypotheses about the least squares\
    \ means.\n\n## Correlation of Estimates\n\nThe Correlation of Estimates option\
    \ in the Estimates platform menu produces a correlation matrix for all effects\
    \ in a model.\n\n## Row Diagnostics\n\nLeverage Plots (the **Plot Actual by Predicted**\
    \ and **Plot Effect Leverage** commands) are covered previously in this chapter\
    \ under “Leverage Plots,” p. 91.\n\n- **Plot Actual by Predicted** displays the\
    \ observed values by the predicted values of Y. This is the leverage plot for\
    \ the whole model.\n- **Plot Effect Leverage** produces a leverage plot for each\
    \ effect in the model showing the point-by-point composition of the test for that\
    \ effect.\n- **Plot Residual By Predicted** displays the residual values by the\
    \ predicted values of Y. You typically want to see the residual values scattered\
    \ randomly about zero.\n- **Plot Residual By Row** displays the residual value\
    \ by the row number of its observation.\n- **Durbin-Watson Test** displays the\
    \ Durbin-Watson statistic to test whether or not the errors have first-order autocorrelation.\
    \ The autocorrelation of the residuals is also shown. The Durbin-Watson table\
    \ has a popup command that computes and displays the exact probability associated\
    \ with the statistic. This Durbin-Watson table is only appropriate for time series\
    \ data when you suspect that the errors are correlated across time.\n\n## Save\
    \ Commands\n\nThe Save submenu offers the following choices. Each selection generates\
    \ one or more new columns in the current data table titled as shown, where `colname`\
    \ is the name of the response variable:\n\n- **Prediction Formula** creates a\
    \ new column, called `Pred Formula colname`, containing the predicted values computed\
    \ by the specified model. It differs from the Save Predicted Values column in\
    \ that the prediction formula is saved with the new column. This is useful for\
    \ predicting values in new rows or for obtaining a picture of the fitted model.\n\
    \n  Use the Column Info command and click the Edit Formula button to see the prediction\
    \ formula. The prediction formula can require considerable space if the model\
    \ is large. If you do not need the formula with the column of predicted values,\
    \ use the Save Predicted Values option.\n\n- **Predicted Values** creates a new\
    \ column, called `Predicted colname`, that contains the predicted values computed\
    \ by the specified model.\n\n- **Residuals** creates a new column, called `Residual\
    \ colname`, containing the residuals, which are the observed response values minus\
    \ predicted values.\n\n- **Mean Confidence Interval** creates two new columns,\
    \ called `Lower 95% Mean colname` and `Upper 95% Mean colname`. The new columns\
    \ contain the lower and upper 95% confidence limits for the line of fit.\n\n \
    \ Note: If you hold down the Shift key and select Save Mean Confidence Interval,\
    \ you are prompted to enter an α-level for the computations.\n\n- **Individual\
    \ Confidence Interval** creates two new columns, called `Lower 95% Indiv colname`\
    \ and `Upper 95% Indiv colname`. The new columns contain lower and upper 95% confidence\
    \ limits for individual response values.\n\n  Note: If you hold down the Shift\
    \ key and select Save Individual Confidence Interval, you are prompted to enter\
    \ an α-level for the computations.\n\n- **Studentized Residuals** creates a new\
    \ column, called `Studentized Resid colname`. The new column values are the residuals\
    \ divided by their standard error.\n\n- **Std Error of Predicted** creates a new\
    \ column, called `StdErr Pred colname`, containing the standard errors of the\
    \ predicted values.\n\n- **Std Error of Residual** creates a new column, called\
    \ `StdErrResid colname`, containing the standard errors of the residual values.\n\
    \n- **Std Error of Individual** creates a new column, called `StdErr Indiv colname`,\
    \ containing the standard errors of the individual predicted values.\n\n- **Effect\
    \ Leverage Pairs** creates a set of new columns that contain the values for each\
    \ leverage plot. The new columns consist of an *X* and *Y* column for each effect\
    \ in the model. The columns are named as follows. If the response column name\
    \ is R and the effects are X1 and X2, then the new column names are:\n\n  - X\
    \ Leverage of X1 for R\n  - Y Leverage of X1 for R\n  - X Leverage of X2 for R\n\
    \  - Y Leverage of X2 for R.\n\n## Stepwise Regression\n\nStepwise regression\
    \ is an approach to selecting a subset of effects for a regression model. It is\
    \ used when there is little theory to guide the selection of terms for a model\
    \ and the modeler, in desperation, wants to use whatever seems to provide a good\
    \ fit.\n\nThe approach is somewhat controversial. The significance levels on the\
    \ statistics for selected models violate the standard statistical assumptions\
    \ because the model has been selected rather than tested within a fixed model.\
    \ On the positive side, the approach has been of practical use for 30 years in\
    \ helping to trim out models to predict many kinds of responses. The book *Subset\
    \ Selection in Regression*, by A. J. Miller (1990), brings statistical sense to\
    \ model selection statistics.\n\nThis chapter uses the term “significance probability”\
    \ in a mechanical way to represent that the calculation would be valid in a fixed\
    \ model, recognizing that the true significance probability could be nowhere near\
    \ the reported one.\n\n### Introduction\n\nIn JMP, stepwise regression is a *personality*\
    \ of the Model Fitting platform—it is one of the selections in the Fitting Personality\
    \ popup menu on the Model Specification dialog (see Figure 5.6 on page 87). The\
    \ **Stepwise** feature computes estimates that are the same as those of other\
    \ least squares platforms, but it facilitates searching and selecting among many\
    \ models.\n\nAs an example, open the Fitness.jmp data table in the Sample Data\
    \ folder.\n\nThis data shows results from an aerobic fitness study. Figure 6.1\
    \ shows a partial listing of the Fitness.jmp data table.\n\nAerobic fitness can\
    \ be evaluated using a special test that measures the oxygen uptake of a person\
    \ running on a treadmill for a prescribed distance. However, it would be more\
    \ economical to find a formula that uses simpler measurements that evaluate fitness\
    \ and predict oxygen uptake. To identify such an equation, measurements of age,\
    \ weight, runtime, and pulse were taken for 31 participants who ran 1.5 miles.\n\
    \nTo find a good oxygen uptake prediction equation, you need to compare many different\
    \ regression models. The Stepwise platform lets you search through models with\
    \ combinations of effects and choose the model you want.\n"
  mdcn: "\n\n### 图 5.12 扩展估计表\n\n![](img/a858f3b35ed4923af65c22e8829ee5a8_94_0.png)\n\
    \n将扩展估计与此模型的预测公式进行比较，如下所示。\n\n```\n16.9641526057058\n+Match(Method) {\"Alpha Amalyze\"\
    \ => -6.1326090308367, \"Caustic Soda\" => 4.55240663376582, \"Pumice Stone\"\
    \ => 1.58020239707087, else => .}\n+0.0465825281069*Size of Load (lbs)\n+Match(Sand\
    \ blasted?) {\"no\" => -1.8002952999013, \"yes\" => 1.80029529990132, else =>\
    \ .}\n```\n\n## 自定义检验\n\n在入门统计学课程中，原假设通常关于一个变量，经常假设某个参数为零。然而，可以检验比这更复杂的原假设。例如，检验多个参数为零、为一或为其他值是合理的，或者检验某些参数等于其他参数。这些检验在统计学中称为广义线性假设，并使用\
    \ JMP 的 Custom Test 命令进行检验。\n\n要进行自定义假设检验，请从 Estimates 弹出菜单中选择 **Custom Test**，将显示如图\
    \ 5.13 所示的对话框。\n\n### 图 5.13 自定义检验启动\n\n您可以为此检验输入描述性标签——如果您进行多个检验，这很有用。\n\n![](img/a858f3b35ed4923af65c22e8829ee5a8_94_1.png)\n\
    \nCustom Test 标题栏下方的空间是用于输入检验名称的可编辑区域。\n\nParameter 列出模型参数的名称。在参数列表右侧是对应于这些参数的零列。单击这些单元格以输入对应于所需检验的假设参数值。\n\
    \n其中一个参数标记为“=”。在其右侧的编辑框中，输入您要检验对比的值。例如，您可能要检验某些因子组合之和为 1。您将在此对话框中“=”旁边输入 1。\n\n\
    **Add Column** 添加另一列零，以便可以联合检验参数的多个线性函数。使用 **Add Column** 按钮根据需要向检验添加尽可能多的列。\n\
    \n当检验被指定时，单击 **Done** 以查看检验的执行结果。结果将附加到对话框底部。\n\n完成自定义检验后，报告列出检验名称、所检验参数的函数值、标准误差以及对话框中每个检验列的其他统计量。所有列的联合\
    \ F 检验位于底部。对自定义检验（检验负载大小系数是否等于 1）的示例输出显示在图 5.14 中。\n\n### 图 5.14 自定义检验输出\n\n![](img/a858f3b35ed4923af65c22e8829ee5a8_95_0.png)\n\
    \n注意：对于分类效应内的检验，而不是使用 Custom 检验，请考虑使用对比对话框，该对话框检验关于最小二乘均值的假设。\n\n## 估计的相关性\n\n\
    Estimates 平台菜单中的 Correlation of Estimates 选项为模型中的所有效应生成相关矩阵。\n\n## 行诊断\n\n杠杆图（**Plot\
    \ Actual by Predicted** 和 **Plot Effect Leverage** 命令）已在本章“杠杆图”第 91 页中介绍。\n\n\
    - **Plot Actual by Predicted** 显示 Y 的观测值与预测值。这是整个模型的杠杆图。\n- **Plot Effect Leverage**\
    \ 为模型中的每个效应生成杠杆图，显示该效应检验的逐点构成。\n- **Plot Residual By Predicted** 显示 Y 的预测值与残差值。您通常希望看到残差值随机散布在零附近。\n\
    - **Plot Residual By Row** 显示残差值与其观测值的行号。\n- **Durbin-Watson Test** 显示 Durbin-Watson\
    \ 统计量，以检验误差是否具有一阶自相关。残差的自相关也显示出来。Durbin-Watson 表有一个弹出命令，可计算并显示与该统计量相关的精确概率。此 Durbin-Watson\
    \ 表仅适用于时间序列数据，当您怀疑误差随时间相关时。\n\n## 保存命令\n\nSave 子菜单提供以下选项。每个选择在当前数据表中生成一个或多个新列，标题如所示，其中\
    \ `colname` 为响应变量的名称：\n\n- **Prediction Formula** 创建一个名为 `Pred Formula colname`\
    \ 的新列，其中包含由指定模型计算的预测值。它与 Save Predicted Values 列的不同之处在于预测公式随新列一起保存。这对于预测新行中的值或获得拟合模型的图像很有用。\n\
    \n  使用 Column Info 命令并单击 Edit Formula 按钮查看预测公式。如果模型很大，预测公式可能需要相当大的空间。如果您不需要随预测值列一起的公式，请使用\
    \ Save Predicted Values 选项。\n\n- **Predicted Values** 创建一个名为 `Predicted colname`\
    \ 的新列，其中包含由指定模型计算的预测值。\n\n- **Residuals** 创建一个名为 `Residual colname` 的新列，其中包含残差，即观测响应值减去预测值。\n\
    \n- **Mean Confidence Interval** 创建两个新列，名为 `Lower 95% Mean colname` 和 `Upper 95%\
    \ Mean colname`。新列包含拟合线 95% 置信限的下限和上限。\n\n  注意：如果按住 Shift 键并选择 Save Mean Confidence\
    \ Interval，您将被提示输入计算的 α 水平。\n\n- **Individual Confidence Interval** 创建两个新列，名为\
    \ `Lower 95% Indiv colname` 和 `Upper 95% Indiv colname`。新列包含个体响应值 95% 置信限的下限和上限。\n\
    \n  注意：如果按住 Shift 键并选择 Save Individual Confidence Interval，您将被提示输入计算的 α 水平。\n\n\
    - **Studentized Residuals** 创建一个名为 `Studentized Resid colname` 的新列。新列值是残差除以其标准误差。\n\
    \n- **Std Error of Predicted** 创建一个名为 `StdErr Pred colname` 的新列，其中包含预测值的标准误差。\n\
    \n- **Std Error of Residual** 创建一个名为 `StdErrResid colname` 的新列，其中包含残差值的标准误差。\n\
    \n- **Std Error of Individual** 创建一个名为 `StdErr Indiv colname` 的新列，其中包含个体预测值的标准误差。\n\
    \n- **Effect Leverage Pairs** 创建一组新列，其中包含每个杠杆图的值。新列由每个效应的 *X* 和 *Y* 列组成。列命名如下。如果响应列名为\
    \ R，效应为 X1 和 X2，则新列名为：\n\n  - X Leverage of X1 for R\n  - Y Leverage of X1 for\
    \ R\n  - X Leverage of X2 for R\n  - Y Leverage of X2 for R.\n\n## 逐步回归\n\n逐步回归是一种选择回归模型效应子集的方法。当几乎没有理论指导模型项的选择，建模者迫切希望使用任何似乎提供良好拟合的方法时使用。\n\
    \n这种方法存在一定争议。所选模型的统计量的显著性水平违反了标准统计假设，因为模型是被选择而不是在固定模型中检验的。积极的一面是，这种方法在过去 30 年中在帮助修剪用于预测许多类型响应的模型方面具有实用价值。A.\
    \ J. Miller（1990）所著的书籍 *Subset Selection in Regression* 为模型选择统计量带来了统计上的合理性。\n\n\
    本章以机械的方式使用术语“显著性概率”，表示该计算在固定模型中有效，同时认识到真实的显著性概率可能与报告的值相差甚远。\n\n### 简介\n\n在 JMP\
    \ 中，逐步回归是 Model Fitting 平台的一个 *personality*——它是 Model Specification 对话框中 Fitting\
    \ Personality 弹出菜单中的一个选项（参见第 87 页图 5.6）。**Stepwise** 功能计算的估计值与其它最小二乘平台相同，但它便于在许多模型中搜索和选择。\n\
    \n作为示例，打开 Sample Data 文件夹中的 Fitness.jmp 数据表。\n\n此数据显示了一项有氧健身研究的結果。图 6.1 显示了 Fitness.jmp\
    \ 数据表的部分列表。\n\n有氧健身可使用一种特殊测试进行评估，该测试测量人在跑步机上跑规定距离时的氧气摄取量。然而，更经济的方法是找到一个使用更简单测量值来评估健身并预测氧气摄取量的公式。为了确定这样的方程，对\
    \ 31 名跑 1.5 英里的参与者进行了年龄、体重、运行时间和脉搏的测量。\n\n为了找到一个良好的氧气摄取量预测方程，您需要比较许多不同的回归模型。Stepwise\
    \ 平台可让您搜索包含效应组合的模型并选择您想要的模型。\n\n"
