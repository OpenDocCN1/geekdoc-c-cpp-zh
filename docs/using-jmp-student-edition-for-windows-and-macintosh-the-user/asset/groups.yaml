    +   - **Comparison Circles** show comparison circles computed for the multiple
    comparison method selected in the platform menu.

    +   - **Connect Means** connects the group means with a straight line.

    +   - **Mean of Means**

    +   - **X-Axis Proportional** makes spacing on the x-axis proportional to the
    sample size of each level.

    +   - **Points Spread** spreads points over the width of the interval.

    +   - **Points Jittered** adds random horizontal jitter so that points that overlay
    on the same Y value can be seen.


    # Script Submenu


    The Script submenu contains commands related to saving a script to redo an analysis.


    +   - **Redo Analysis** repeats the analysis represented in the report.

    +   - **Save Script to Data Table** generates a script that can redraw the report,
    and attaches it to the data table.

    +   - **Save Script to Report** appends a script to the top of the report.

    +   - **Save Script to Script Window** produces a script that can re-create the
    report in a text window. This script can then be edited or saved to an external
    file.

    +   - **Save Script for All Objects** is useful when several analyses — like those
    from a By group, or from several variables in a single Distribution report— are
    in the same window. The resulting script generates all reports in the window.

    +   - **Data Table Window** brings the data table to the front of the display.


    # Contingency Analysis—The Categorical by Categorical Case


    If both the X and Y variables are categorical, JMP Student Edition produces a
    contingency analysis that initially shows a mosaic plot, contingency table (sometimes
    referred to as a crosstabs table), and a table of chi-square tests.


    Figure 3.22 Contingency Analysis


