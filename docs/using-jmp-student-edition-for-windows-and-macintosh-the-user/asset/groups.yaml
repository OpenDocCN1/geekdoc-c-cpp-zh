    Each smoothing weight can be Bounded, Fixed, or Unconstrained as determined by
    the setting of the popup menu next to the weight''s name.


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_157_0.png)


    The example shown here has the Level weight (α) fixed at a value of 0.3 and the
    Trend weight (γ) bounded by 0 and 1. In this case, the value of the Trend weight
    is allowed to move within the range 0 to 1 while the Level weight is held at 0.3.
    Note that you can specify all the smoothing weights in advance by using these
    custom constraints. In that case, none of the weights would be estimated from
    the data although forecasts and residuals would still be computed. When you click
    Estimate, the results of the fit appear in place of the dialog.


    # Simple Exponential Smoothing


    The model for simple exponential smoothing is $y_t = \mu_t + \alpha_t$.


    The smoothing equation, $L_t = \alpha y_t + (1 - \alpha)L_{t-1}$, is defined in
    terms of a single smoothing weight $\alpha$. This model is equivalent to an ARIMA(0,
    1, 1) model where


    $(1 - B) y_t = (1 - \theta B) \alpha_t$ with $\theta = 1 - \alpha$.


    The moving average form of the model is


    $y_t = a_t + \sum_{i=1}^{\infty} \alpha a_{t-j}$


    # Double (Brown) Exponential Smoothing


    The model for double exponential smoothing is $y_t = \mu_t + \beta_1 t + a_t$.


    The smoothing equations, defined in terms of a single smoothing weight $\alpha$
    are


    $L_t = \alpha y_t + (1 - \alpha)L_{t-1}$ and $T_t = \alpha(L_t - L_{t-1}) + (1
    - \alpha)T_{t-1}$.


    This model is equivalent to an ARIMA(0, 1, 1)(0, 1, 1) model


    $(1 - B)^2 y_t = (1 - \theta B)^2 a_t$ where $\theta_{1,1} = \theta_{2,1}$ with
    $\theta = 1 - \alpha$.


    The moving average form of the model is'
  - '[PAGE 158]


    # Linear (Holt) Exponential Smoothing


    The model for linear exponential smoothing is $y_t = \mu_t + \beta_t t + a_t$.


    The smoothing equations defined in terms of smoothing weights $\alpha$ and $\gamma$
    are


    $L_t = \alpha y_t + (1-\alpha)(L_{t-1}+T_{t-1})$ and $T_t = \gamma(L_t - L_{t-1})
    + (1-\gamma)T_{t-1}$


    This model is equivalent to an ARIMA(0, 2, 2) model where


    $(1-B)^2 y_t = (1-\theta B - \theta_2 B^2)a_t$ with $\theta = 2 - \alpha - \alpha\gamma$
    and $\theta_2 = \alpha - 1$.


    The moving average form of the model is


    $y_t = a_t + \sum_{j=1}^{\infty} (\alpha + j\alpha\gamma)a_{t-j}$


    # Damped-Trend Linear Exponential Smoothing


    The model for damped-trend linear exponential smoothing is $y_t = \mu_t + \beta_t
    t + a_t$.


    The smoothing equations in terms of smoothing weights $\alpha$, $\gamma$, and
    $\varphi$ are


    $L_t = \alpha y_t + (1-\alpha)(L_{t-1} + \varphi T_{t-1})$ and $T_t = \gamma(L_t
    - L_{t-1}) + (1-\gamma)\varphi T_{t-1}$


    This model is equivalent to an ARIMA(1, 1, 2) model where


    $(1-\varphi B)(1-B)y_t = (1-\theta_1 B - \theta_2 B^2)a_t$ with $\theta_1 = 1
    + \varphi - \alpha - \alpha\gamma\varphi$ and $\theta_2 = (\alpha - 1)\varphi$.


    The moving average form of the model is


    $y_t = \alpha_t + \sum_{j=1}^{\infty} \left(\frac{\alpha + \alpha\gamma\varphi(\varphi^{j}
    - 1)}{\varphi - 1}\right) \alpha_{t-j}$


    # Seasonal Exponential Smoothing


    The model for seasonal exponential smoothing is $y_t = \mu_t + s(t) + a_t$.


    The smoothing equations in terms of smoothing weights $\alpha$ and $\delta$ are


    $L_t = \alpha(y_t - S_{t-s}) + (1-\alpha)L_{t-1}$ and $S_t = \delta(y_t - L_{t-s})
