    # Model Comparison Table


    | Model | DF | Variance | AIC | SBC | RSquare | -2LogLH |

    |---|---|---|---|---|---|---|

    | AR(1) | 142 | 1134.3871 | 1014.8601 | 1020.7997 | 0.922 | 1013.5251 |

    | MA(1) | 142 | 4264.6121 | 1205.5533 | 1211.4829 | 0.703 | 1204.2083 |

    | ARMA(1,1) | 141 | 989.13835 | 996.11244 | 1005.0219 | 0.932 | 993.09397 |

    | ARIMA(1,1,1) | 140 | 978.9437 | 987.73389 | 996.62242 | 0.932 | 982.30512 |


    The Model Comparison table summarizes the fit statistics for each model. You can
    use it to compare several models fitted to the same time series. Each row corresponds
    to a different model. The numerical values in the table are drawn from the Model
    Summary table for each fitted model. The Model Comparison table shown above summarizes
    the ARIMA models (1, 0, 0), (0, 0, 1), and (1, 0, 1) respectively.


    # Model Summary Table


    Each model fit generates a Model Summary table, which summarizes the statistics
    of the fit. In the formulae below, n is the number of nonmissing observations
    and k is the number of fitted parameters in the model.


    +   - **DF** is the number of degrees of freedom in the fit, n − k.

    +   - **Sum of Squared Errors** is the sum of the squares of the prediction errors,
    SSE.

    +   - **Variance Estimate** is the unconditional sum of squares (SSE) divided
    by the number of degrees of freedom, SSE / (n − k). This is the sample estimate
    of the variance of the random shocks a_t described in the section “ARIMA Model,”
    p. 154.

    +   - **Standard Deviation** is the square root of the variance estimate. This
    is a sample estimate of the standard deviation of a_t, the random shocks

    +   - **Akaike’s Information Criterion [AIC], Schwartz’s Bayesian Criterion [SBC
    or BIC]** are goodness of fit statistics, detailed in the online help. Smaller
    values of these criteria indicate better fit.

    +   - **RSquare** and **RSquare Adj** are also goodness of fit statistics, where
    values closer to 1 indicate a better fit.

    +   - **−2LogLikelihood** is minus two times the natural log of the likelihood
    function evaluated at the best-fit parameter estimates. Smaller values are better
    fits.

    +   - **Stable** indicates whether the autoregressive operator is stable. That
    is, whether all the roots of φ(z) = 0 lie outside the unit circle.

    +   - **Invertible** indicates whether the moving average operator is invertible.
    That is, whether all the roots of θ(z) = 0 lie outside the unit circle.


    **Note:** The φ and θ operators are defined in the section “ARIMA Model,” p. 154.'
  - '[PAGE 152]


    # Parameter Estimates Table


    | Term | Lag | Estimate | Std Error | t Ratio | Prob>|t| | Constant Estimate |

    |---|---|---|---|---|---|---|

    | AR1 | 1 | -0.4767619 | 0.1152473 | -4.14 | <.0001* | 3.61907311 |

    | MA1 | 1 | -0.864542 | 0.0713742 | -12.11 | <.0001* |  |

    | Intercept | 0 | 2.45068156 | 3.2495581 | 0.75 | 0.4520 |  |


    There is a Parameter Estimates table for each selected fit, which gives the estimates
    for the time series model parameters. Each type of model has its own set of parameters.
    They are described in the sections on specific time series models. The Parameter
    Estimates table has these terms:


    +   - **Term** lists the name of the parameter. These are described below for
    each model type. Some models contain an *intercept* or mean term. In those models,
    the related *constant estimate* is also shown. The definition of the constant
    estimate is given under the description of ARIMA models.


    +   - **Factor** (Seasonal ARIMA only) lists the factor of the model that contains
    the parameter. This is only shown for multiplicative models. In the multiplicative
    seasonal models, Factor 1 is nonseasonal and Factor 2 is seasonal.


    +   - **Lag** lists the degree of the lag or backshift operator that is applied
    to the term to which the parameter is multiplied.


    +   - **Estimate** lists the parameter estimates of the time series model.


    +   - **Std Error** lists the estimates of the standard errors of the parameter
    estimates. They are used in constructing tests and confidence intervals.


    +   - **t Ratio** lists the test statistics for the hypotheses that each parameter
    is zero. It is the ratio of the parameter estimate to its standard error. If the
    hypothesis is true, then this statistic has an approximate Student’s t-distribution.
    Looking for a t-ratio greater than 2 in absolute value is a common rule of thumb
    for judging significance because it approximates the 0.05 significance level.


    +   - **Prob>|t|** lists the observed significance probability calculated from
    each t-ratio. It is the probability of getting, by chance alone, a t-ratio greater
    (in absolute value) than the computed value, given a true hypothesis. Often, a
    value below 0.05 (or sometimes 0.01) is interpreted as evidence that the parameter
    is significantly different from zero.


    The Parameter Estimates table also gives the Constant Estimate, for models that
    contain an intercept or mean term. The definition of the constant estimate is
    given under “ARIMA Model,” p. 154.'
  - '[PAGE 153]


    # Forecast Plot


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_153_0.png)


    Each model has its own Forecast plot. The Forecast plot shows the values that
    the model predicts for the time series. It is divided by a vertical line into
    two regions. To the left of the separating line the one-step-ahead forecasts are
    shown overlaid with the input data points. To the right of the line are the future
    values forecast by the model and the confidence intervals for the forecasts.


    You can control the number of forecast values by changing the setting of the **Forecast
    Periods** box in the platform launch dialog or by selecting **Number of Forecast
    Periods** from the Time Series drop-down menu. The data and confidence intervals
    can be toggled on and off using the **Show Points** and **Show Confidence Interval**
    commands on the model’s popup menu.


    # Residuals


    The graphs under the residuals section of the output show the values of the residuals
    based on the fitted model. These are the actual values minus the one-step-ahead
    predicted values. In addition, the autocorrelation and partial autocorrelation
    of these residuals are shown. These can be used to determine whether the fitted
    model is adequate to describe the data. If it is, the points in the residual plot
    should be normally distributed about the zero line and the autocorrelation and
    partial autocorrelation of the residuals should not have any significant components
    for lags greater than zero.


    # Iteration History


    The model parameter estimation is an iterative procedure by which the log-likelihood
    is maximized by adjusting the estimates of the parameters. The iteration history
    for each model you request shows the value of the likelihood function for each
    iteration. This can be useful for diagnosing problems with the fitting procedure.
    Attempting to fit a model which is poorly suited to the data can result in a large
    number of iterations that fail to converge on an optimum value for the likelihood.'
