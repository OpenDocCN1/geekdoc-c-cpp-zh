    点、2 点和 3 点测量四个桶的酸度。数据表记录了日期、时间和酸度测量值。图 7.13 中的对话框创建了单值测量图和移动极差图，水平轴上带有日期标签。


    ## 图 7.13 单值测量图和移动极差图的启动对话框


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_128_0.png)


    要完成此示例：


    - 选择 **图形 > 控制图 > IR** 命令。

    - 同时选择 **单值测量** 和 **移动极差** 图表类型。

    - 将 **Acid** 指定为 **过程** 变量。

    - 将 **Date** 指定为 **样本标签** 变量。

    - 单击 **确定**。


    图 7.14 中显示的单值测量图和移动极差图监测了所生产的每一桶泡菜的酸度。


