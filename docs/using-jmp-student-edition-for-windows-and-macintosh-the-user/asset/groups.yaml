    # The Time Series Platform


    First, assign columns for analysis with the dialog in Figure 8.1. The selector
    list at the left of the dialog shows all columns in the current table. To cast
    a column into a role, select one or more columns in the column selector list and
    click a role button. Or, drag variables from the column selector list to one of
    the following role boxes:


    +   - **X, Time ID** for the x-axis, one variable used for labeling the time axis

    +   - **Y, Time Series** for the y-axis, one or more time series variables.


    To remove an unwanted variable from an assigned role, select it in the role box
    and click **Remove**. After assigning roles, click **OK** to see the analysis
    for each time series variable versus the time ID.


    You set the number of lags for the autocorrelation and partial autocorrelation
    plots in the **Autocorrelation Lags** box. This is the maximum number of periods
    between points used in the computation of the correlations. It must be more than
    one but less than the number of rows. A commonly used rule of thumb for the maximum
    number of lags is $n/4$, where $n$ is the number of observations. The **Forecast
    Periods** box allows you to set the number of periods into the future that the
    fitted models are forecast. By default, JMP uses 25 lags and 25 forecast periods.


    # The Time Series Graph


    The Time Series platform begins with a plot of each times series by the time ID,
    or row number if no time ID is specified (Figure 8.7). The plot, like others in
    JMP, has features to resize the graph, highlight points with the cursor or brush
    tool, and label points.'
  - '[PAGE 148]


    # Figure 8.7 Time Series Plot of Seriesg (Airline Passenger) Data


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_148_0.png)


    By default, graphs of the autocorrelation and partial autocorrelation (Figure
    8.5) of the time series are also shown, but can be hidden with commands from the
    platform popup menu on the Time Series title bar.


    The platform popup menu, discussed next, also has fitting commands and options
    for displaying additional graphs and statistical tables.


    # Time Series Commands


    The popup menu next to the time series name has the commands shown here.


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_148_1.png)


    The first three items in this menu control the descriptive and diagnostic graphs
    and tables. These are typically used to determine the nature of the model to be
    fitted to the series.


    The ARIMA and Smoothing Model commands are for fitting various models to the data
    and producing forecasts. You can select the model fitting commands repeatedly.
    The result of each new fit is appended to the report. After the first model has
    been fit, a summary of all the models is inserted just above the first model report
    (an example is shown in “Model Comparison Table,” p. 151).


    The following sections describe options and model fits, discuss statistical results,
    and cover additional platform features.'
  - '[PAGE 149]


    # Graph


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_149_0.png)


    The Time Series platform begins by showing a time series plot, like the one shown
    previously in Figure 8.7. The Graph command on the platform popup menu has a submenu
    of controls for the time series plot with the following commands.


    +   - Time Series Graph hides or displays the time series graph.

    +   - Show Points hides or displays the points in the time series graph.

    +   - Connecting Lines hides or displays the lines connecting the points in the
    time series graph.

    +   - Mean Line hides or displays a horizontal line in the time series graph that
    depicts the mean of the time series.


    # Autocorrelation


    The Autocorrelation command alternately hides or displays the autocorrelation
    graph of the sample, often called the sample autocorrelation function. This graph
    describes the correlation between all the pairs of points in the time series with
    a given separation in time or lag. By definition, the first autocorrelation (lag
    0) always has length 1.


    In addition, confidence curves show twice the large-lag standard error (± 2 standard
    errors). The autocorrelation plot for the Seriesg data is shown on the left in
    Figure 8.8. You can examine the autocorrelation and partial autocorrelations plots
    to determine whether the time series is stationary (meaning it has a fixed mean
    and standard deviation over time) and what model might be appropriate to fit the
    time series.


    # Partial Autocorrelation


    The Partial Autocorrelation command alternately hides or displays the graph of
    the sample partial autocorrelations. The plot on the right in Figure 8.8 shows
    the partial autocorrelation function for the Seriesg data. The solid black lines
    represent ± 2 standard errors for approximate 95% confidence limits'
