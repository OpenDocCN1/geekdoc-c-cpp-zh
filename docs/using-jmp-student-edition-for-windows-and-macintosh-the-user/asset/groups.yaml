    # Linear Contrasts


    Another common task is to test that levels within an effect are different from
    each other. This is accomplished by using linear contrasts. For example, to test
    that the Alpha Amalyze wash method is significantly different from the Pumice
    Stone wash method,


    Select LS Means Contrast from the drop-down menu in the title bar of the Method
    variable.


    JMP Student Edition attaches a Contrast Dialog (Figure 5.4) to the report, where
    details of the linear contrast are specified.


    Figure 5.4 Contrast Dialog


