    # Custom Test


    In introductory statistics courses, null hypotheses are often about one variable
    at a time, frequently hypothesizing that a parameter is zero. However, it is possible
    to test far more complicated null hypotheses than this. For example, it is reasonable
    to test that several parameters are zero, one, or another value, or that some
    parameters are equal to others. These tests are known in statistics as a general
    linear hypotheses, and are tested using JMP''s Custom Test command.


    To test a custom hypothesis, select Custom Test from the Estimates popup menu,
    which displays the dialog shown in Figure 5.13.


    # Figure 5.13 Custom Test Launch


    You can enter a descriptive label for this test—useful if you are doing several
    tests


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_94_1.png)


    The space beneath the Custom Test title bar is an editable area for entering a
    test name.'
