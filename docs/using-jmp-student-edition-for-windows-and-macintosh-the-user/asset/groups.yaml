    ## 测试


    显示一个子菜单，可让您选择在测试为阳性时在图表上标记哪些测试。测试仅适用于限界为 3σ 限界的图表。测试 1 至 4 适用于均值、个体和属性图表。测试 5
    至 8 仅适用于均值图表和个体测量图表。如果测试不适用于某个图表，则测试选项为灰色显示。测试适用，但对于由于子组样本量不相等而导致控制限界变化的图表，不会显示测试，直到样本量变得相等为止。这些特殊测试也称为
    Western Electric 规则。有关特殊原因测试的更多信息，请参阅本章稍后第 119 页的“Tests for Special Causes”。


    ## 显示区域


    在显示和不显示用于特殊原因测试的区域线之间切换。区域在此处以 Coating.jmp 示例数据中的重量均值图为例，标记为 A、B 和 C。控制图测试使用区域线作为边界。七条区域线以中心线为中心，每条相隔一个
    sigma。


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_118_0.png)


    ## Westgard 规则


    将在后面的章节中详细介绍。参见“Westgard Rules”第 122 页的文本和图表。


    ## 测试超出限界


    将任何超出限界的点标记为“*”。该测试适用于所有具有限界的图表，无论样本量是否恒定，也无论 k 的大小或限界的宽度。例如，如果您有不相等的样本量，并希望标记
    r 图中超出限界的任何点，则可以使用此命令。


