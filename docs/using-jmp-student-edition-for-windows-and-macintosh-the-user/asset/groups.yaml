    - select the **Polynomial to Degree** command in the **Macros** popup menu.


    ### Scheffe Cubic


    Cubic Models are an advanced topic not usually covered in an advanced course.
    See the JMP help if you are interested in Scheffe cubics.


    ### Fitting Personalities


    The three available personalities for model fitting are available in the Personality
    drop-down list, shown in Figure 5.6.


    **Figure 5.6** Fitting Personalities


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_87_0.png)


    - **Standard Least Squares** models one or more continuous responses in the usual
    way through fitting a linear model by least squares.

    - **Stepwise** regression is an approach to selecting a subset of effects for
    a regression model. The **Stepwise** feature computes estimates that are the same
    as those of the **Standard Least Squares**


    personality, but it facilitates searching and selecting among many models. The
    Stepwise personality allows only one continuous Y.

    Multiple categorical responses call for MANOVA or other advanced methods, only
    available in the professional version of JMP.


    ## Emphasis Choices


    The Emphasis popup menu controls which plots and tables are initially shown in
    the analysis report:


    - **Effect Leverage** initially displays leverage and residual plots for the whole
    model. Select effect details and other statistical reports from the report itself.

    - **Effect Screening** shows whole-model information, followed by a scaled parameter
    report and the Prediction Profiler.

    - **Minimal Report** suppresses all plots. Request plots and reports from the
    report itself.


    ## Run Model


    The Run Model button submits the model to the fitting platform, but does not close
    the dialog window. Use the dialog to make changes to the model for additional
    fits, or make changes to the data and then refit the same model.


    ## Fit Model Report Items


    When a model is fit with the Standard Least Squares or Stepwise personality, several
    reports appear based on the Emphasis selected in the Fit Model dialog. Any report
    that does not appear by default can be requested from the platform menu.


