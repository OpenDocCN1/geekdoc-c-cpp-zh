    在t检验报告的第二行有一句“假设方差不等”。该检验也称为未合并t检验。如果你想要合并版本（假设方差相等），请选择“均值/方差分析/合并t”（Means/Anova/Pooled
    t）命令。


    从报告的下拉菜单中选择“均值/方差分析/合并t”（Means/Anova/Pooled t）命令。


    图形会添加均值菱形和其他文本表格。所有这些内容将在本教程后面的“方差分析（ANOVA）”（第50页）中讨论。这里请注意，未合并t检验的p值列在原始t检验报告中的Prob>|t|旁边。注意，该值与新的方差分析报告中“Prob>F”列中的值相同。本质上，JMP
    Student Edition使用两种不同的方法对同一假设进行了两次检验，两种方法的结果一致（理应如此！）。实际上，t统计量（列在t检验下）的平方等于F统计量（在方差分析表中列为F比率）的值。


