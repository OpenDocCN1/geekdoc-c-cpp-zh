    \ of Center Points—Specifies additional runs placed at the center points.\n- Number\
    \ of Replicates—Specify the number of times to replicate the entire design, including\
    \ centerpoints. Type the number of times you want to replicate the design in the\
    \ associated text box. One replicate doubles the number of runs.\n\n# Viewing\
    \ the Design Table\n\nNow you have a data table that outlines your experiment,\
    \ as described in Figure 13.10.\n\n# Figure 13.10  The Design Data Table\n\n![](img/a858f3b35ed4923af65c22e8829ee5a8_222_0.png)\n\
    \nThe name of the table is the design type that generated it.\n\nThis script allows\
    \ you to easily fit a model using the values in the design table.\n\nThere are\
    \ two center points per replicate.\n\nThe column called Pattern identifies the\
    \ coding of the factors. It shows all the codings with “+” for high, “−” for low\
    \ factor, “a” and “A” for low and high axial values, and “0” for midrange. Pattern\
    \ is suitable to use as a label variable in plots because when you hover over\
    \ a point in a plot of the factors, the pattern value shows the factor coding\
    \ of the point.\n\nRuns are in a random order.\n\nThe Y column is for recording\
    \ experimental results.\n\n# Continuing the Analysis, If Needed\n\nAfter creating\
    \ and viewing the design table, running the experiment, and recording your results\
    \ in the design table’s Y column, run a fit model analysis on the data. The data\
    \ table contains a script labeled **Model**. Right-click it and select **Run Script**\
    \ (Figure 13.11) to fit the model.\n\n# Figure 13.11  Running the Script\n\n![](img/a858f3b35ed4923af65c22e8829ee5a8_222_1.png)\n\
    \nAfter clicking **Run Model** in the dialog, (Figure 13.12), review the analysis.\n\
    \n# Figure 13.12 Fitting the Model\n\n![](img/a858f3b35ed4923af65c22e8829ee5a8_223_0.png)\n\
    \n- **Error Standard Deviation** Error Standard Deviation is the unexplained random\
    \ variation around the means.\n- **Sample Size** Sample size is how many experimental\
    \ units (runs, or samples) are involved in the experiment.\n- **Power** Power\
    \ is the probability of declaring a significant result.\n- **Effect Size** Effect\
    \ size is how different the means are from each other or from the hypothesized\
    \ value.\n\nThe Sample Size and Power command in JMP helps estimate in advance\
    \ either the sample size needed, power expected, or the effect size expected in\
    \ the experimental situation where there is a single mean comparison, a two sample\
    \ comparison, or when comparing k sample means.\n\nWhen you select DOE > Sample\
    \ Size and Power, the panel shown in Figure 14.1 appears with button selections\
    \ for experimental situations. The following sections describe each of these selections\
    \ and explains how to enter estimated parameter values and the desired computation.\n\
    \n# Figure 14.1 Sample Size and Power Choices\n\n![](img/a858f3b35ed4923af65c22e8829ee5a8_226_0.png)\n\
    \n# One-Sample and Two-Sample Means\n\nAfter you click either One Sample Mean,\
    \ or Two Sample Means in the initial Sample Size selection list (Figure 14.1),\
    \ the Power and Sample Size dialog in Figure 14.2 appears and asks for the anticipated\
    \ experimental values. The values you enter depend on your initial choice. As\
    \ an example, consider the two-sample situation.\n\n# Figure 14.2 Initial Power\
    \ and Sample Size Dialogs for Single Mean (left) and Two Means (right)\n\n![](img/a858f3b35ed4923af65c22e8829ee5a8_227_0.png)\n\
    \nThe Two Sample Means choice in the initial Power and Sample Size dialog always\
    \ requires values for Alpha and the error standard deviation (Error Std Dev),\
    \ as shown here, and one or two of the other three values: Difference to detect,\
    \ Sample Size, and Power. The power and sample size platform then calculates the\
    \ missing item. If there are two unspecified fields, the power and sample size\
    \ platform constructs a plot that shows the relationship between those two values:\n\
    \n- power as a function of sample size, given specific effect size\n- power as\
    \ a function of effect size, given a sample size\n- effect size as a function\
    \ of sample size, for a given power.\n\nThe Power and Sample Size dialog asks\
    \ for the values depending the first choice of design:\n\n- Alpha Alpha is the\
    \ significance level, usually 0.05. This implies willingness to accept (if the\
    \ true difference between groups is zero) that 5% (alpha) of the time a significant\
    \ difference will be incorrectly declared.\n- Error Std Deviation Error Std (Standard)\
    \ Deviation is the true residual error. Even though the true error is not known,\
    \ the power calculations are an exercise in probability that calculates what might\
    \ happen if the true values were as specified.\n- Extra Params Extra Params (Parameters)\
    \ is only for multi-factor designs. Leave this field zero in simple cases. In\
    \ a multi-factor balanced design, in addition to fitting the means described in\
    \ the situation, there are other factors with the extra parameters that can be\
    \ specified here. For example, in a three-factor two-level design with all three\
    \ two-factor interactions, the number of extra parameters is five—two parameters\
    \ for the extra main effects, and three parameters for the interactions. In practice,\
    \ it isn’t very important what values you enter here unless the experiment is\
    \ in a range where there is very few degrees of freedom for error.\n- Difference\
    \ to Detect Difference to detect is the smallest detectable difference (how small\
    \ a difference you want to be able to declare statistically significant). For\
    \ single sample problems this is the difference between the hypothesized value\
    \ and the true value.\n- Sample Size Sample size is the total number of observations\
    \ (runs, experimental units, or samples). Sample size is not the number per group,\
    \ but the total over all groups. Computed sample size numbers can have fractional\
    \ values, which you need to adjust to real units. This is usually done by\n"
  mdcn: "\n\n# 输入响应和因子\n\n在响应曲面设计中输入因子的步骤是该设计所特有的。要添加因子，请按照图13.6中的步骤操作。\n\n图13.6 向响应曲面设计输入因子\n\
    \n![](img/a858f3b35ed4923af65c22e8829ee5a8_219_0.png)\n\n点击“继续”进入下一步。\n\n# 选择设计\n\
    \n高亮显示您想使用的响应曲面设计类型，然后点击“继续”。\n\n图13.7 选择设计类型\n\n![](img/a858f3b35ed4923af65c22e8829ee5a8_219_1.png)\n\
    \n响应曲面设计器提供以下设计类型：\n\n# Box-Behnken设计\n\nBox-Behnken设计每个因子仅有三个水平，且在因子范围所定义的立方体顶点处没有试验点。当出于工程考虑需要避免极端点时，这种设计有时很有用。这种特性的代价是，与中心复合设计相比，在顶点附近的预测不确定性更高。\n\
    \n# 中心复合设计\n\n响应曲面设计列表包含两种类型的中心复合设计：*均匀精度*和*正交*。中心复合设计的这些性质与设计中的中心点数量以及轴向值有关：\n\
    \n- 均匀精度意味着选择中心点的数量，使得中心处的预测方差与设计顶点处的预测方差大致相同。\n- 对于正交设计，选择中心点的数量，使得二阶参数估计与其他参数估计的相关性最小。\n\
    \n# 指定轴向值（仅限中心复合设计）\n\n当您选择中心复合设计（CCD-均匀精度）并点击**继续**时，会看到图13.8中的面板。它提供了默认的轴向缩放信息。在文本框中输入1.0，即指示JMP将轴向值置于因子所定义的立方体表面上，这控制了轴向点的外延距离。您可以灵活地输入您想要使用的值。\n\
    \n![](img/a858f3b35ed4923af65c22e8829ee5a8_220_0.png)\n\n**图13.8** 显示和修改中心复合设计\n\
    \n- **可旋转** 使预测方差仅依赖于距设计中心的缩放距离。这会导致轴向点比因子的范围更极端。如果该因子范围无法实际达到，建议您选择“位于表面”或指定您自己的值。\n\
    - **正交** 使效应在分析中正交。这会导致轴向点比表示因子范围的−1或1更极端。如果该因子范围无法实际达到，建议您选择“位于表面”或指定您自己的值。\n\
    - **位于表面** 将轴向点保留在−1和1范围的末端。\n- **用户指定** 使用用户输入的值，该值可以是任何大于零的值。将该值输入到“轴向值”文本框中。\n\
    \n如果您想要内接设计，请点击**内接**旁边的复选框。选中后，JMP会重新缩放整个设计，使轴向点位于范围的低端和高端（轴向点为−1和1，因子点根据该缩放比例缩小）。\n\
    \n# 指定输出选项\n\n使用“输出选项”面板来指定输出数据表的显示方式。当选项设置正确后，点击“生成表”。\n\n图13.9 选择输出选项\n\n![](img/a858f3b35ed4923af65c22e8829ee5a8_221_0.png)\n\
    \n- 运行顺序——允许您指定创建数据表时运行在数据表中出现的顺序。选项有：\n  - 保持不变——输出表中的行（运行）将按照设计面板中的显示顺序出现。\n\
    \  - 从左到右排序——输出表中的行（运行）将按从左到右的顺序排序出现。\n  - 随机化——输出表中的行（运行）将以随机顺序出现。\n  - 从右到左排序——输出表中的行（运行）将按从右到左的顺序排序出现。\n\
    \  - 在区组内随机化——输出表中的行（运行）将在您设置的区组内以随机顺序出现。\n- 中心点数——指定在中心点处额外进行的运行次数。\n- 重复次数——指定重复整个设计的次数，包括中心点。在关联的文本框中输入您想要重复设计的次数。重复一次会使运行次数加倍。\n\
    \n# 查看设计表\n\n现在您有了一个概述实验的数据表，如图13.10所示。\n\n# 图13.10 设计数据表\n\n![](img/a858f3b35ed4923af65c22e8829ee5a8_222_0.png)\n\
    \n表名是生成该表的设计类型。\n\n该脚本允许您使用设计表中的值轻松拟合模型。\n\n每个重复有两个中心点。\n\n名为Pattern的列标识因子的编码。它显示所有编码，其中“+”表示高水平，“−”表示低水平因子，“a”和“A”分别表示低和高轴向值，“0”表示中值。Pattern适合用作绘图中的标签变量，因为当您将鼠标悬停在因子图中的一个点上时，pattern值会显示该点的因子编码。\n\
    \n运行按随机顺序排列。\n\nY列用于记录实验结果。\n\n# 如有需要，继续分析\n\n创建并查看设计表、运行实验并将结果记录在设计表的Y列之后，对数据运行拟合模型分析。数据表包含一个标记为**Model**的脚本。右键点击它并选择**运行脚本**（图13.11）以拟合模型。\n\
    \n# 图13.11 运行脚本\n\n![](img/a858f3b35ed4923af65c22e8829ee5a8_222_1.png)\n\n在对话框中点击**运行模型**后（图13.12），查看分析结果。\n\
    \n# 图13.12 拟合模型\n\n![](img/a858f3b35ed4923af65c22e8829ee5a8_223_0.png)\n\n- **误差标准差**\
    \ 误差标准差是均值周围无法解释的随机变异。\n- **样本量** 样本量是实验中涉及的实验单元（运行或样本）的数量。\n- **功效** 功效是判定结果显著的概率。\n\
    - **效应量** 效应量是各均值之间或均值与假设值之间的差异程度。\n\nJMP中的“样本量和功效”命令有助于预先估计实验所需的样本量、预期功效或效应量，适用于单均值比较、双样本比较或比较k个样本均值的情况。\n\
    \n当您选择DOE > 样本量和功效时，会显示如图14.1所示的面板，其中包含针对实验情况的按钮选项。以下各节描述了这些选项中的每一个，并解释了如何输入估计参数值和所需计算。\n\
    \n# 图14.1 样本量和功效选择\n\n![](img/a858f3b35ed4923af65c22e8829ee5a8_226_0.png)\n\n\
    # 单样本和双样本均值\n\n在初始的“样本量”选择列表（图14.1）中点击“单样本均值”或“双样本均值”后，会出现图14.2中的“功效和样本量”对话框，并要求输入预期的实验值。您输入的值取决于您的初始选择。例如，考虑双样本情况。\n\
    \n# 图14.2 单均值（左）和双均值（右）的初始功效和样本量对话框\n\n![](img/a858f3b35ed4923af65c22e8829ee5a8_227_0.png)\n\
    \n初始“功效和样本量”对话框中的“双样本均值”选项始终要求输入Alpha和误差标准差（误差标准差），如此处所示，以及另外三个值中的一个或两个：待检出的差异、样本量和功效。然后，功效和样本量平台会计算缺失的项。如果有两个未指定的字段，功效和样本量平台会构建一个图，展示这两个值之间的关系：\n\
    \n- 给定特定效应量时，功效作为样本量的函数\n- 给定样本量时，功效作为效应量的函数\n- 给定功效时，效应量作为样本量的函数\n\n“功效和样本量”对话框根据您最初选择的设计来要求输入值：\n\
    \n- Alpha Alpha是显著性水平，通常为0.05。这意味着愿意接受（如果组间真实差异为零）在5%（alpha）的情况下会错误地判定为显著差异。\n\
    - 误差标准差 误差标准差是真实的残差误差。尽管真实误差未知，但功效计算是一种概率练习，计算如果真实值如所指定那样可能会发生什么。\n- 额外参数 额外参数（参数）仅用于多因子设计。在简单情况下将此字段留为零。在多因子平衡设计中，除了拟合所述情况中的均值外，还有其他带有额外参数的因子可以在此处指定。例如，在三因子两水平设计中，包含所有三个两因子交互作用，额外参数的数量为五个——两个用于额外主效应，三个用于交互作用。在实践中，您在此处输入的值并不十分重要，除非实验处于误差自由度非常少的范围内。\n\
    - 待检出的差异 待检出的差异是最小可检出的差异（您希望能够判定为统计显著的最小差异）。对于单样本问题，这是假设值与真实值之间的差异。\n- 样本量 样本量是观测值（运行、实验单元或样本）的总数。样本量不是每组数量，而是所有组的总数。计算出的样本量数字可能带有小数，您需要将其调整为实际单位。这通常通过\n\
    \n"
