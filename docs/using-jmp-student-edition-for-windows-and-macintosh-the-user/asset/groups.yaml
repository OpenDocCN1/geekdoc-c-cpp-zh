    +   Select Fit Line from the Platform popup menu on the title bar above the plot.


    Separate lines for each wash method appear on the plot, as shown in Figure 3.12.


    # Figure 3.12 Group By and Linear Fits


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_54_0.png)


    The statistical question is whether these lines are different enough to warrant
    the extra trouble in reporting all three, instead of the more compact (but possibly
    less accurate) reporting of the single line found previously.


    # Two-Way Contingency Tables


    In the next example, both X and Y are categorical variables. The question is whether
    the method of washing denim has an effect on thread count. The analysis uses contingency
    tables—orderly ways of arranging count data. To generate a contingency table for
    this problem,


    +   Select Analyze > Fit Y by X from the menu bar.


    +   Assign Thread Wear (not Thread Wear Measured) to the Y, Response role.


    +   Assign Method to the X, Factor role.


    +   Click OK.


    Since both variables are categorical, a mosaic plot appears, followed by a contingency
    table. Details of these displays are in the section “Contingency Analysis—The
    Categorical by Categorical Case,” p. 66.


    Note that the mosaic plot is clickable, like all plots in JMP Student Edition.
    For example, to select all rows washed in Alpha Amalyze with a low thread wear,


    +   Click in the lower, red section in the mosaic plot in the bar above Alpha
    Amalyze (see Figure 3.13)'
  - '[PAGE 55]


    # Figure 3.13 Mosaic Plot


    Click in this area to select Alpha Amalyze-washed jeans with low thread wear


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_55_0.png)


    Just below the contingency plot are tests for the independence of the two variables.
    The p-value for this test appears in the column labeled Prob>ChiSq, which in this
    case is the non-significant 0.76. There is not enough evidence to say that these
    two variables are not independent—in other words, there is not enough evidence
    to say that the thread count of denim is affected by wash method.


    # Logistic Regression


    The Logistic platform fits the probabilities for response categories to a continuous
    x predictor. The fitted model estimates probabilities attributed to each x value.
    The logistic platform is the nominal/ordinal by continuous personality of the
    Fit Y by X command. There is a distinction between nominal and ordinal responses
    on this platform:


    +   - Nominal logistic regression estimates a set of curves to partition the attributed
    probability among the responses.

    +   - Ordinal logistic regression models the probability of being less than or
    equal to a given response. This has the effect of estimating a single logistic
    curve, which is shifted horizontally to produce probabilities for the ordered
    categories. This model is less general but more parsimonious, and is recommended
    for ordered responses.


    As an example,


    +   - Select Analyze > Fit Y By X

    +   - Assign Thread Wear as Y, Response and Size of Load (%) as X, Factor.

    +   - Click OK.


    The report that appears shows the probability that the thread wear is low, moderate,
    or severe for each load size.'
