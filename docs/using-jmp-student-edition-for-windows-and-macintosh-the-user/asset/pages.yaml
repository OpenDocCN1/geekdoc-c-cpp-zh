- pgno: 41
  md: '# Figure 2.22 The Capability Analysis Table


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_41_0.png)


    The Capability Analysis table is organized into two parts. The upper part of the
    table shows these quantities:


    +   - The Specification column lists the names of items for which values are shown.
    They are Lower Spec Limit, Upper Spec Limit, and Spec Target.

    +   - The Value column lists the values you specified for each limit and the target

    +   - %Actual is the observed percent of data falling outside the specification
    limits.


    The lower portion of the Capability Analysis table lists five basic process capability
    indexes, their values, and their upper and lower Confidence Intervals. It also
    lists the percent and PPM for areas outside the spec limits. The PPM column (parts
    per million) is the Percent column multiplied by 10,000.


    This Sigma Quality measurement is frequently used in Six Sigma methods, and is
    also referred to as the process sigma.


    Sigma Quality = Normal Quantile( 1 − Expected (# defects) / n ) + 1.5


    For example, if there are 3 defects in n=1,000,000 observations, the formula yields
    6.03, or a 6.03 Sigma process. The above and below columns do not sum to the total
    column because Sigma Quality uses values from the Normal distribution, and is
    therefore not additive.


    Table 2.1 “Capability Index Names and Computations,” p. 41, describes these indices
    and gives computational formulas.


    # Table 2.1 Capability Index Names and Computations


    | Index | Index Name | Computation |

    |---|---|---|

    | CP | process capability ratio, Cₚ | (USL − LSL)/6σ where USL is the upper spec
    limit LSL is the lower spec limit |'
  merge: -1
  img_proc: true
