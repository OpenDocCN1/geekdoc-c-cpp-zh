- pgno: 215
  md: '# Response Surface Designs


    Response surface designs are useful for modeling a curved quadratic surface to
    continuous factors. If a minimum or maximum response exists inside the factor
    region, a response surface model can pinpoint it. Three distinct values for each
    factor are necessary to fit a quadratic function, so the standard two-level designs
    cannot fit curved surfaces.


    The most popular response surface design is the central composite design, illustrated
    in the figure to the left below. It combines a two-level fractional factorial
    and two other kinds of points:


    +   - *Center points*, for which all the factor values are at the zero (or midrange)
    value.

    +   - *Axial (or star) points*, for which all but one factor are set at zero (midrange)
    and that one factor is set at outer (axial) values.


    The Box-Behnken design, illustrated in the figure on the right below, is an alternative
    to central composite designs.


    One distinguishing feature of the Box-Behnken design is that there are only three
    levels per factor.


    Another important difference between the two design types is that the Box-Behnken
    design has no points at the vertices of the cube defined by the ranges of the
    factors. This is sometimes useful when it is desirable to avoid these points due
    to engineering considerations. The price of this characteristic is the higher
    uncertainty of prediction near the vertices compared to the central composite
    design.


    Central Composite Design


    Box-Behnken Design


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_215_0.png)


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_215_1.png)'
  merge: -1
  img_proc: true
- pgno: 216
  md: '# Introduction


    The Bounce Data.jmp sample data file has response surface data inspired by the
    tire tread data described in Derringer and Suich (1980). To see this sample data
    table, open the Sample Data folder that was installed when you installed JMP,
    and select Design Experiment > Bounce Data.jmp.


    The objective of this experiment is to match a standardized target value (450)
    of tennis ball bounciness. The bounciness varies with amounts of Silica, Silane,
    and Sulfur used to manufacture the tennis balls. The experimenter wants to collect
    data over a wide range of values for these variables to see if a response surface
    can find a combination of factors that matches a specified bounce target. To follow
    this example:


    +   1. Select DOE > **Response Surface Design**.

    +   2. Load factors by clicking the red triangle icon on the Response Surface
    Design title bar and selecting **Load Factors**. Navigate to the Sample Data folder
    that was installed when you installed JMP, and select Design Experiment > Bounce
    Factors.jmp.

    +   3. Load the responses by clicking the red triangle icon on the Response Surface
    Design title bar and selecting **Load Responses**. Navigate to the Sample Data
    folder that was installed when you installed JMP, and select Design Experiment
    > Bounce Response.jmp. Figure 13.1 shows the completed Response panel and Factors
    panel.


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_216_0.png)


    After the response data and factors data are loaded, the Response Surface Design
    Choice dialog lists the designs in Figure 13.2.


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_216_1.png)


    The Box-Behnken design selected for three effects generates the design table of
    15 runs shown in Figure 13.3.


    In real life, you would conduct the experiment and then enter the responses into
    the data table. Let’s pretend this happened and use a finalized data table called
    Bounce Data.jmp.'
