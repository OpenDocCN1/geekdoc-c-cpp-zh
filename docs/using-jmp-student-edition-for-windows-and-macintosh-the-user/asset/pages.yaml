- pgno: 110
  md: '# The Control Chart Launch Dialog


    When you select a Control Chart from the Graph > Control Chart menu (Figure 7.3),
    you see a Control Chart Launch dialog similar to the one in Figure 7.4. (The exact
    controls vary depending on the type of chart you choose.) Initially, the dialog
    shows three kinds of information:


    +   - process information, for measurement variable selection

    +   - chart type information

    +   - limits specification.


    Figure 7.3 Control Chart Menu


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_110_0.png)


    Specific information shown for each section varies according to the type of chart
    you request.


    Figure 7.4 Control Chart Launch Dialog


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_110_1.png)


    Through interaction with the Launch dialog, you specify exactly how you want your
    charts created. The following sections describe the panel elements.'
  merge: -1
  img_proc: true
- pgno: 111
