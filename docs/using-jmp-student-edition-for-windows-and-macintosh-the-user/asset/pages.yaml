  md: 'personality, but it facilitates searching and selecting among many models.
    The Stepwise personality allows only one continuous Y.

    Multiple categorical responses call for MANOVA or other advanced methods, only
    available in the professional version of JMP.


    # Emphasis Choices


    The Emphasis popup menu controls which plots and tables are initially shown in
    the analysis report:


    +   - **Effect Leverage** initially displays leverage and residual plots for the
    whole model. Select effect details and other statistical reports from the report
    itself.

    +   - **Effect Screening** shows whole-model information, followed by a scaled
    parameter report and the Prediction Profiler.

    +   - **Minimal Report** suppresses all plots. Request plots and reports from
    the report itself.


    # Run Model


    The Run Model button submits the model to the fitting platform, but does not close
    the dialog window. Use the dialog to make changes to the model for additional
    fits, or make changes to the data and then refit the same model.


    # Fit Model Report Items


    When a model is fit with the Standard Least Squares or Stepwise personality, several
    reports appear based on the Emphasis selected in the Fit Model dialog. Any report
    that does not appear by default can be requested from the platform menu.


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_88_0.png)'
  merge: -1
  img_proc: true
- pgno: 89
  md: '# Regression Reports


    Regression reports give textual information about the fit.


    # The Summary of Fit Table


    The Summary of Fit table appears first and shows the following numeric summaries
    of the response for the multiple regression model:


    **Rsquare** (*R²*) estimates the proportion of the variation in the response around
    the mean that can be attributed to terms in the model, rather than to random error.


    It is also the square of the correlation between the actual and predicted response.
    An *R²* of 1 occurs when there is a perfect fit (the errors are all zero). An
    *R²* of 0 means that the fit predicts the response no better than the overall
    response mean.


    **Rsquare Adj** adjusts *R²* to make it more comparable over models with different
    numbers of parameters. Since adding terms to an existing model always increases
    *R²*, this adjustment compensates for adding terms to a model that already has
    terms in it. It is a ratio of mean squares instead of sums of squares.


    **Root Mean Square Error** estimates the standard deviation of the random error.
    It is the square root of the mean square for error in the corresponding analysis
    of variance table, and it is commonly denoted as *s*.


    The **Mean of Response** is the overall mean of the response values. It is important
    as a base model for prediction because all other models are compared to it. The
    variance measured around this mean is the **Corrected Total (C Total)** mean square
    in the Analysis of Variance table.


    **Observations (or Sum of Weights)** records the number of observations used in
    the fit. If there are no missing values and no excluded rows, this is the same
    as the number of rows in the data table. If there is a column assigned the role
    of weight, this is the sum of that column’s values. Weights are used in weighted
    least squares — an advanced topic.


    # The Analysis of Variance Table


    The Analysis of Variance table shows the basic calculations for a linear model.
    The table compares the model to a model containing only the mean:


    **Source** lists the three sources of variation, called **Model**, **Error**,
    and **C Total**.


    **DF** records an associated degrees of freedom for each source of variation.


    The **C Total** degrees of freedom is for the simple mean model. There is only
    one degree of freedom used (the estimate of the mean parameter) in the calculation
    of variation, so the **C Total DF** is always one less than the number of observations.


    The total degrees of freedom are partitioned into the **Model** and **Error**
    terms:


    +   - The **Model** degrees of freedom is the number of parameters (except for
    the intercept) used to fit the model.

    +   - The **Error DF** is the difference between the **C Total DF** and the **Model
    DF**.


    **Sum of Squares** records an associated sum of squares for each source of variation.
    Each is the sum of squares of the differences between the fitted response and
    the actual response.


    +   - The **Total (C Total) SS** is the sum of squared distances of each response
    from the sample mean.'
  merge: -1
  img_proc: true
- pgno: 90
  md: '+   - The **Error SS** is the sum of squared differences between the fitted
    values and the actual values. This sum of squares corresponds to the unexplained
    error (residual) after fitting the regression model.


    A **Mean Square** is a sum of squares divided by its associated degrees of freedom.
    This computation converts the sum of squares to an average.


    The **F Ratio** is the model mean square divided by the error mean square. It
    tests the hypothesis that all the regression parameters (except the intercept)
    are zero. If there is a significant effect in the model, the F Ratio is higher
    than expected by chance alone.


    **Prob>F** is the probability of obtaining a greater F value by chance alone if
    the specified model fits no better than the overall response mean. Significance
    probabilities of 0.05 or less are often considered evidence that there is at least
    one significant regression factor in the model.


    Note that large values of Model SS and small values of Error SS lead to large
    F ratios and low *p* values—desirable if the goal is to declare that terms in
    the model are significantly different from zero. Most practitioners check this
    F test first and make sure that it is significant before delving further into
    the details of the fit. This significance is also shown graphically by the whole-model
    leverage plot, described in “Leverage Plots,” p. 91.


    # The Lack of Fit Table


    The Lack of Fit table shows a special diagnostic test and appears only when the
    data and the model provide the opportunity. Sometimes, it is possible to estimate
    the error variance independently of whether the right form of the model is the
    one under consideration. This occurs when observations are exact replicates of
    each other in terms of the X variables. The error for these exact replicates is
    called *pure error*. This is the portion of the sample error that cannot be explained
    or predicted no matter which form the model uses for the X variables.


    The difference between the residual error from the model and the pure error is
    called *lack of fit error*. A lack of fit error can be significantly greater than
    pure error if a regressor is in the model with the wrong functional form, or if
    too few interaction effects exist in an analysis of variance model. In these cases,
    consider adding interaction terms, if appropriate, to try to better capture the
    functional form of a regressor.


    There are two common situations where there is no lack of fit test:


    +   - There are no exactly replicated points with respect to the X data, and therefore
    there are no degrees of freedom for pure error.


    +   - The model is saturated, meaning that the model itself has a degree of freedom
    for each different X value; therefore, there are no degrees of freedom for lack
    of fit.


    The Lack of Fit table shows information about the error terms:


    **Source** lists the three sources of variation called **Lack of Fit**, **Pure
    Error**, and **Total Error**. Note that the pure error DF is pooled from each
    group where there are multiple rows with the same values for each effect.


    The remaining portions of the Lack of Fit table are similar to those of the Analysis
    of Variance Table. The only additional information is the **Max RSq**, the maximum
    *R²* that can be achieved by using only the variables in the model.'
  merge: -1
  img_proc: true
