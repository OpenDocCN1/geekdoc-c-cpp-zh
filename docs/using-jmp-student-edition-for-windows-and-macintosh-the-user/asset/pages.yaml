    Select Starch Content (%) from the columns list.


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_57_2.png)


    Click OK to close the Formula Editor and apply the formula.


    Further examples, as well as complete documentation of all the formula editor
    functions, are found in JMP Student Edition’s online help.'
