- pgno: 112
  md: '# Figure 7.5 Variables Charts with Unequal Subgroup Sample Sizes


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_112_0.png)


    # Phase


    The Phase role enables you to specify a column identifying different phases, or
    sections. A phase is a group of consecutive observations in the data table. For
    example, phases might correspond to time periods during which a new process is
    brought into production and then put through successive changes. Phases generate,
    for each level of the specified Phase variable, a new sigma, set of limits, zones,
    and resulting tests.'
  merge: -1
  img_proc: true
- pgno: 113
