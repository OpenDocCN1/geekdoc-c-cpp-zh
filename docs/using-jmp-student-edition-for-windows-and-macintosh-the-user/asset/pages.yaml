- pgno: 226
  md: '+   - **Error Standard Deviation** Error Standard Deviation is the unexplained
    random variation around the means.

    +   - **Sample Size** Sample size is how many experimental units (runs, or samples)
    are involved in the experiment.

    +   - **Power** Power is the probability of declaring a significant result.

    +   - **Effect Size** Effect size is how different the means are from each other
    or from the hypothesized value.


    The Sample Size and Power command in JMP helps estimate in advance either the
    sample size needed, power expected, or the effect size expected in the experimental
    situation where there is a single mean comparison, a two sample comparison, or
    when comparing k sample means.


    When you select DOE > Sample Size and Power, the panel shown in Figure 14.1 appears
    with button selections for experimental situations. The following sections describe
    each of these selections and explains how to enter estimated parameter values
    and the desired computation.


    # Figure 14.1 Sample Size and Power Choices


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_226_0.png)


    # One-Sample and Two-Sample Means


    After you click either One Sample Mean, or Two Sample Means in the initial Sample
    Size selection list (Figure 14.1), the Power and Sample Size dialog in Figure
    14.2 appears and asks for the anticipated experimental values. The values you
    enter depend on your initial choice. As an example, consider the two-sample situation.'
  merge: -1
  img_proc: true
- pgno: 227
  md: '# Figure 14.2 Initial Power and Sample Size Dialogs for Single Mean (left)
    and Two Means (right)


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_227_0.png)


    The Two Sample Means choice in the initial Power and Sample Size dialog always
    requires values for Alpha and the error standard deviation (Error Std Dev), as
    shown here, and one or two of the other three values: Difference to detect, Sample
    Size, and Power. The power and sample size platform then calculates the missing
    item. If there are two unspecified fields, the power and sample size platform
    constructs a plot that shows the relationship between those two values:


    +   - power as a function of sample size, given specific effect size

    +   - power as a function of effect size, given a sample size

    +   - effect size as a function of sample size, for a given power.


    The Power and Sample Size dialog asks for the values depending the first choice
    of design:


    +   - Alpha Alpha is the significance level, usually 0.05. This implies willingness
    to accept (if the true difference between groups is zero) that 5% (alpha) of the
    time a significant difference will be incorrectly declared.

    +   - Error Std Deviation Error Std (Standard) Deviation is the true residual
    error. Even though the true error is not known, the power calculations are an
    exercise in probability that calculates what might happen if the true values were
    as specified.

    +   - Extra Params Extra Params (Parameters) is only for multi-factor designs.
    Leave this field zero in simple cases. In a multi-factor balanced design, in addition
    to fitting the means described in the situation, there are other factors with
    the extra parameters that can be specified here. For example, in a three-factor
    two-level design with all three two-factor interactions, the number of extra parameters
    is five—two parameters for the extra main effects, and three parameters for the
    interactions. In practice, it isn’t very important what values you enter here
    unless the experiment is in a range where there is very few degrees of freedom
    for error.

    +   - Difference to Detect Difference to detect is the smallest detectable difference
    (how small a difference you want to be able to declare statistically significant).
    For single sample problems this is the difference between the hypothesized value
    and the true value.

    +   - Sample Size Sample size is the total number of observations (runs, experimental
    units, or samples). Sample size is not the number per group, but the total over
    all groups. Computed sample size numbers can have fractional values, which you
    need to adjust to real units. This is usually done by'
  merge: -1
  img_proc: true
- pgno: 228
  md: '+   - **Power** Power is the probability of getting a statistic that will be
    declared statistically significant. Bigger power is better, but the cost is higher
    in sample size. Power is equal to alpha when the specified effect size is zero.
    You should go for powers of at least 0.90 or 0.95 if you can afford it. If an
    experiment requires considerable effort, plan so that the experimental design
    has the power to detect a sizable effect, when there is one.

    +   - **Continue** Evaluates at the entered values.

    +   - **Back** Goes back to the previous dialog.

    +   - **Animation Script** The **Animation Script** button runs a JSL script that
    displays an interactive plot showing power or sample size. See the section, “Power
    and Sample Size Animation for a Single Sample,” p. 229, for an illustration of
    this animation script.


    # Single-Sample Mean


    Suppose there is a single sample and the goal is to detect a difference of 2 where
    the error standard deviation is 0.9, as shown in the left-hand dialog in Figure
    14.3. To calculate the power when the sample size is 10, leave Power missing in
    the dialog and click Continue. The dialog on the right in Figure 14.3, shows the
    power is calculated to be 0.99998, rounding to 1.


    **Figure 14.3** A One-Sample Example


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_228_0.png)


    To see a plot of the relationship of power and sample size, leave both **Sample
    Size** and **Power** empty and click **Continue**.


    Double click on the horizontal axis to get any desired scale. The left-hand graph
    in Figure 14.4, shows a range of sample sizes for which the power varies from
    about 0.2 to 0.95. Change the range of the curve by changing the range of the
    horizontal axis. For example, the plot on the right in Figure 14.4, has the horizontal
    axis scaled from 1 to 8, which gives a more typical looking power curve.'
  merge: -1
  img_proc: true
- pgno: 229
  md: '# Figure 14.4 A One-Sample Example Plot


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_229_0.png)


    When only Sample Size is specified (Figure 14.5) and Difference to Detect and
    Power are empty, a plot of power by difference appears.


    # Figure 14.5 Plot of Power by Difference to Detect for a Given Sample Size


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_229_1.png)


    # Power and Sample Size Animation for a Single Sample


    The Animation Script button on the Power and Sample Size dialog for the single
    mean displays an interactive plot that illustrates the effect that changing the
    sample size has on power. In the example shown in Figure 14.6, Sample Size is
    10, Alpha is 0.05, and the Difference to Detect is set to 0.4. The animation begins
    showing a normal curve positioned with mean at zero (representing the estimated
    mean and the true mean), and another with mean at 0.4 (the difference to be detected).
    The probabil-'
  merge: -1
  img_proc: true
- pgno: 230
  md: 'ity of committing a Type II error (not detecting a difference when there is
    a difference), often represented as β in literature, is shaded in blue on this
    plot.


    You can drag the handles over the curves drag to see how their positions affect
    power. Also, you can click on the values for sample size and alpha showing beneath
    the plot to change them.


    # Figure 14.6 Example of Animation Script to Illustrate Power


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_230_0.png)


    # Two-Sample Means


    The dialogs work similarly for two samples; the Difference to Detect is the difference
    between two means. Suppose the error standard deviation is 0.9 (as before), the
    desired detectable difference is 1, and the sample size is 16.


    Leave Power blank and click Continue to see the power calculation, 0.5433, as
    shown in the dialog on the left in Figure 14.7. This is considerably lower than
    in the single sample because each mean has only half the sample size. The comparison
    is between two random samples instead of one.


    To increase the power requires a larger sample. To find out how large, leave both
    Sample Size and Power blank and examine the resulting plot, shown on the right
    in Figure 14.7. The crosshair tool estimates that a sample size of about 35 is
    needed to obtain a power of 0.9.'
  merge: -1
  img_proc: true
- pgno: 231
  md: '# Figure 14.7  Plot of Power by Sample Size to Detect for a Given Difference


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_231_0.png)


    # k-Sample Means


    The **k-Sample Means** situation can examine up to 10 kinds of means. The next
    example considers a situation where 4 levels of means are expected to be about
    10 to 13, and the Error Std Dev is 0.9. When a sample size of 16 is entered the
    power calculation is 0.95, as shown in the dialog on the left in Figure 14.8.


    If both Sample Size and Power are left blank, the power and sample size calculations
    produce the power curve shown on the right in Figure 14.8. This confirms that
    a sample size of 16 looks acceptable.


    Notice that the difference in means is 2.236, calculated as square root of the
    sum of squared deviations from the grand mean. In this case it is the square root
    of \((-1.5)^2 + (-0.5)^2 + (0.5)^2 + (1.5)^2\), which is the square root of 5.'
  merge: -1
  img_proc: true
- pgno: 232
  md: '# Figure 14.8 Prospective Power for k-Means and Plot of Power by Sample Size


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_232_0.png)


    # One-Sample Variance


    The One-Sample Variance choice on the Power and Sample Size dialog (Figure 14.1)
    determines sample size for detection of a change in variance. The usual purpose
    of this option is to compute a large enough sample size to guarantee that the
    risk of accepting a false hypothesis (β) is small. In the dialog, specify a baseline
    variance, alpha level, and direction of change you want to detect. To indicate
    direction of change, select either Larger or Smaller from the Guarding a change
    menu. The computations then show whether the true variance is larger or smaller
    than its hypothesized value, entered as the Baseline Variance. An example is when
    the variance for resistivity measurements on a lot of silicon wafers is claimed
    to be 100 ohm-cm and a buyer is unwilling to accept a shipment if variance is
    greater than 55 ohm-cm for a particular lot.


    The examples throughout the rest of this chapter use engineering examples from
    the online manual of The National Institute of Standards and Technology (NIST).
    You can access the NIST manual examples at http://www.itl.nist.gov/div898/handbook.


    As with previous dialogs, you enter two of the items and the Power and Sample
    Size calculations determines the third.


    Suppose you want to detect an increase of 55 for a baseline variance of 100, with
    an alpha of 0.05 and power of 0.99. Enter these items as shown in Figure 14.9.
    When you click Continue, the computed result shows that you need a sample size
    of 170.'
  merge: -1
  img_proc: true
- pgno: 233
  md: 'If you want to detect a change to a small variance, enter a negative amount
    in the Difference to Detect box.


    **Note:** Remember to enter the variance in the Baseline Variance box, not the
    standard deviation.


    Figure 14.9 Sample Size and Power Dialog To Compare Single-Direction One-Sample
    Variance


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_233_0.png)


    # One-Sample and Two-Sample Proportions


    The dialogs and computations to test power and sample sizes for proportions are
    similar to those for testing sample means. The dialogs are the same except you
    enter Baseline Proportion and also specify either a one-sided or two-sided test.
    For a one-sample situation, the Baseline Proportion is the average of a known
    baseline proportion and the single sample proportion. When there are two samples,
    the Baseline Proportion you enter is the average of the two sample proportions.


    The sampling distribution for proportions is actually binomial, but the computations
    to determine sample size and test proportions use a normal approximation, as indicated
    on the dialogs (Figure 14.10).'
  merge: -1
  img_proc: true
- pgno: 234
  md: '# Figure 14.10 Default Power and Sample Dialog for One-Sample and Two-Sample
    Proportions


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_234_0.png)


    Enter average of baseline and one-sample proportions, or average of two-sample
    proportions.


    Enter 1 or 2 to indicate the type of test (one- or two-sided)


    Testing proportions is useful in production lines, where proportion of defects
    is part of process control monitoring. For example, suppose a line manager wants
    to detect a change in defective units that is 6% above a known baseline of approximately
    10% defective. The manager does not want to stop the process unless it has degenerated
    greater than 16% defects (6% above the 10% known baseline defective). The Baseline
    Proportion in this example is 0.08, which is the average of the baseline (10%)
    and the proportion above the baseline (6%). The example process is monitored with
    a one-sided test at 5% alpha and a 10% risk (90% power) of failing to detect a
    change of that magnitude.


    Figure 14.11 shows the entries in the Sample Size and Power dialog to detect a
    given difference between an observed proportion and a baseline proportion, and
    the computed sample size of approximately 77. To see the plot on the right in
    Figure 14.11, leave both Difference to Detect and Sample Size blank. Use the grabber
    tool (hand) to move the x-axis and show a specific range of differences and sample
    sizes.


    # Figure 14.11 Dialog To Compare One Proportion to a Baseline and Sample Size
    Plot


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_234_1.png)


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_234_2.png)'
  merge: -1
  img_proc: true
- pgno: 235
  md: '# Counts per Unit


    The Counts per Unit selection calculates sample size for the Poisson-distributed
    counts typical when you can measure more than one defect per unit. A unit can
    be an area and the counts can be fractions or large numbers.


    Although the number of defects observed in an area of a given size is often assumed
    to have a Poisson distribution, the area and count are assumed to be large enough
    to support a normal approximation.


    Questions of interest are:


    +   - Is the defect density within prescribed limits?

    +   - Is the defect density greater than or less than a prescribed limit?


    Enter alpha and the baseline count per unit. Then enter two of the remaining fields
    to see the calculation of the third. The test is for one-sided (one-tailed) change.
    Enter the Difference to Detect in terms of the baseline count per unit (defects
    per unit). The computed sample size is expressed in those units.


    As an example, consider a wafer manufacturing process with a target of 4 defects
    per wafer and you want to verify that a new process meets that target.


    +   1. Select **DOE > Sample Size and Power**.

    +   2. Click the **Counts per Unit** button.

    +   3. Enter an alpha of 0.1 to be the chance of failing the test if the new process
    is as good as the target.

    +   4. Enter a power of 0.9, which is the chance of detecting a change larger
    than 2 (6 defects per wafer). In this kind of situation, alpha is sometimes called
    the *producer’s risk* and beta is called the *consumer’s risk*.

    +   5. Click **Continue** to see the computed sample size of 8.128 (Figure 14.12).


    The process meets the target if there are less than 48 defects (6 defects per
    wafer in a sample of 8 wafers).


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_235_0.png)'
  merge: -1
  img_proc: true
- pgno: 236
  md: '# Sigma Quality Level


    Use the Sigma Quality Level feature, accessed by selecting DOE > Sample Size and
    Power, by entering any two of the following three quantities:


    +   - number of defects

    +   - number of opportunities

    +   - Sigma quality level


    When you click Continue, the sigma quality calculator computes the missing quantity
    using the formula Sigma Quality Level = NormalQuantile(1 - defects/opportunities)
    + 1.5.


    As an example, use the Sample Size and Power feature to compute the Sigma quality
    level for 50 defects in 1,000,000 opportunities:


    +   1. Select DOE > Sample Size and Power.

    +   2. Click the Sigma Quality Level button.

    +   3. Enter 50 for the number of defects and 1,000,000 as the number of opportunities,
    as shown in the window to the left in Figure 14.13.

    +   4. Click Continue. The results, as shown in the window on the right in Figure
    14.13, are a Sigma quality level of 5.3.


    Figure 14.13 Sigma Quality Level Example 1


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_236_0.png)


    If you want to know how many defects reduce the Sigma Quality Level to “six-sigma”
    for 1,000,000 opportunities, enter 6 as the Sigma Quality Level and leave the
    Number of Defects blank (window to the left in Figure 14.14). The computation
    (window to the right in Figure 14.14) shows that the Number of Defects cannot
    be more than approximately 3.4.'
  merge: -1
  img_proc: true
