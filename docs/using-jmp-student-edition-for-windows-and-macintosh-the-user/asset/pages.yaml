- pgno: 212
  md: 'The next sections describe some of the parts of the analysis report that appears
    when you click Run Model.


    # Viewing an Actual-by-Predicted Plot


    When the model contains no interactions, an actual-by-predicted plot, shown on
    the left in Figure 12.20, appears at the top of the Fit Model report.


    Figure 12.20 An Actual-by-Predicted Plot


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_212_0.png)


    To show labels in the graph (on the right in Figure 12.20), select all points,
    right-click the graph, and select Row Label. The pattern variable displayed in
    the data table serves as the label for each point.


    In Figure 12.20, the mean line falls inside the bounds of the 95% confidence curves,
    which tells you that the model is not significant. The model p-value, R², and
    RMSE appear below the plot.


    The RMSE is an estimate of the standard deviation of the process noise assuming
    that the unestimated effects are negligible. In this case, the RMSE is 14.199,
    which is much larger than expected. This suggests that effects other than the
    main effects of each factor are important. Because of the confounding between
    two-factor interactions and main effects in this design, it is impossible to determine
    which two-factor interactions are important without performing more experimental
    runs.


    # Viewing a Scaled Estimates Report


    When you fit the model, JMP displays a Scaled Estimates report (Figure 12.21)
    as a part of the Fit Model report. The Scaled Estimates report displays a bar
    chart of the individual effects embedded in a table of parameter estimates. The
    last column of the table has the p-values for each effect. None of the factor
    effects are significant, but the Catalyst effect is large enough to be interesting
    if it is real. At this stage the results are not clear, but this does not mean
    that the experiment has failed. It means that some follow-up runs are necessary.'
  merge: -1
