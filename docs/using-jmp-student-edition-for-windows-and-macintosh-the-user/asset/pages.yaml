    In addition, there is a special leverage plot titled Whole Model that shows the
    actual values of the response plotted against the predicted values. This Whole
    Model leverage plot dramatizes the test that all the parameters (except intercepts)
    in the model are zero. This illustrates the same test reported in the Analysis
    of Variance report.


    In general, the horizontal line on the plot represents what the values of the
