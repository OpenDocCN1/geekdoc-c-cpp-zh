    # Importing Data


    The File > Open command displays a specialized open file dialog used to locate
    a file to open and tell JMP Student Edition the file format of the incoming file.
    The Open command then reads the file into a JMP Student Edition data table.


    JMP Student Edition directly reads JMP data tables, JMP journal files, JMP Script
    files, SAS transport files, text files with any column delimiter, and Excel files,
    and flat-file database files.


    # Windows


    The Files of Type selection filters the list of files displayed in the dialog.
    If applicable, JMP Student Edition gives additional information about the file
    in the File Open dialog. The example in Figure 10.4 shows an Open Data File dialog
    when the Files of Type drop-down list is changed from the default to JMP data
    table. The dialog shows the table notes, if they exist.


    If *.* is chosen from the Files of Type menu, JMP looks at the type of file given
    by the 3-character extension appended to its file name and opens it accordingly.
    This works as long as the file has the structure indicated by its name.'
