- pgno: 79
  md: '# The Fit Model Platform


    General linear models—those that have more complicated forms than can be fit with
    simple linear regression—are fit with the Fit Model platform. Standard least squares
    fitting, including stepwise procedures, are fit using this single platform.


    # Introduction


    After starting JMP Student Edition,


    +   Open the data file Denim.jmp.


    Details about this data are found in “About the Data,” p. 21 in the “The Distribution
    Platform” CHAPTER.


    In this introduction, models are developed to determine which variables (if any)
    are predictors of the starch content of denim, and which are predictors of thread
    wear in denim.


    # Launching the Platform


    +   Select Analyze > Fit Model from the menu bar.


    This brings up the Fit Model dialog, which is illustrated in Figure 5.1.


    To begin with, fit a simple model with only main effects—no interactions, no powers.


    +   In the list of columns, select Starch Content (%) and click the Y button.


    +   To select all the model effects together, click on Method, hold down the Shift
    key, click on Sand Blasted?, then click the Add button.


    +   Click Run Model.


    Unlike the other platform launchers in JMP Student Edition, the Fit Model dialog
    does not go away once the model is run. To see that it is still available,


    +   Click Window in the top menu bar to see a list of open windows.'
  merge: -1
  img_proc: true
- pgno: 80
  md: '# Figure 5.1 The Fit Model Dialog


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_80_0.png)


    # Setting Titles


    This report generated here is used later in this presentation, so it will need
    to be identified among the other windows. To make identification easy, change
    its title to something meaningful as follows.


    Make sure the report window is the front window.


    +   - Select Window > Set Title. (Window > Set Report Title on Macintosh)


    +   - In the resulting dialog box, type “Main Effects Only”.


    Title bars within the reports are also editable.


    +   - Double click on the title bar that says Response Starch Content (%).


    +   - Again type “Main Effects Only” and press Enter.'
  merge: -1
  img_proc: true
- pgno: 81
  md: '![](img/a858f3b35ed4923af65c22e8829ee5a8_81_0.png)


    # Examining Results


    Now, examine these results. There is a lot of information in this report, and
    although only a portion is used in this example, all of it is documented in sections
    that follow. In this initial look at the data, first check if the model as a whole
    is significant. Then, look at the p values associated with each effect, printed
    in several places, including just below each leverage plot. Leverage plots are
    detailed in “Leverage Plots,” p. 91.


    The first leverage plot is for the entire model, and its p value indicates that
    the model is significant. To examine the p values for the individual effects,
    scroll the window until each effect is visible. Scrolling is accomplished using
    scroll bars along the edges of the window, or by using the Scroller tool.


    Figure 5.2 The Scroller Tool


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_81_1.png)


    Scroller Tool


    To scroll using the Scroller tool,


    +   Shift-click the Scroller tool in the Tools toolbar.


    Shift-clicking a tool keeps the tool active for multiple clicks. Without Shift-clicking,
    JMP Student Edition reverts back to the arrow tool after other tools’ first use.


    +   Move the Scroller tool over the results report.'
  merge: -1
  img_proc: true
- pgno: 82
  md: 'Hold the mouse button and move the scroller tool to see the window move.


    Try moving the mouse while releasing the mouse button, repeatedly, in short movements.
    (That is, several short click-and-drags.)


    This illustrates the “inertia” that the scroller tool imparts on reports.


    # Least Squares Means


    Least squares means, called LSMeans by JMP Student Edition, show the values of
    the response (starch content in this case) for levels of a nominal effect. The
    response values are adjusted for the other terms in the model, so that the effect
    of each variable can be examined.


    By default, the LSMeans are displayed in this example model. To see a plot of
    the LSMeans,


    +   Select LSMeans Plot from the drop-down menu on the title bar of an effect.


    Figure 5.3 LS Means Table and Plot


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_82_0.png)


    In this case, the plot suggests that when controlled for the other effects in
    the model, the starch content for Caustic Soda is higher than Pumice Stone, which
    is in turn higher than Alpha Amalyze.


    # Re-running an Analysis


    After moving around the report a bit and observing the p-values for each effect,
    it should be clear that they are all significant at the 0.05 level. However, this
    analysis is fairly primitive, since it does not consider any interactions among
    the variables. Remove the existing effects from the model and re-run the analysis
    with interactions by doing the following.


    +   Click on the Window menu and select the Fit Model dialog.


    There are two ways to remove effects from the model. We want to remove all the
    effects in this case.


    +   Select one of the variables and click the Remove button located above the
    effects list.


    +   Double-click on each of the other variables.


    Now, add in an interaction effect.


    +   Select Method and Size of Load (lbs) in the list of columns and click the
    Cross button.'
  merge: -1
  img_proc: true
- pgno: 83
