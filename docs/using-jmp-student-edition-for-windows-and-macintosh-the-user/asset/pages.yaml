- pgno: 26
  md: 'Scroll down the report to see that this command only added a Normal Quantile
    Plot for one variable in the report. Many times, a command needs to be sent to
    all the variables in the report, yet it is tedious to select the same command
    many times. JMP Student Edition therefore provides a way to “broadcast” a command
    throughout a report, using the Control (Windows) or ⌘ (Macintosh) key.


    Hold down the Control (Windows) or ⌘ (Macintosh) key and again select Normal Quantile
    Plot from the drop-down list next to the variable’s name.


    This time, a Normal Quantile plot is appended to every histogram. This shortcut
    works for most commands in drop-down menus.


    You can also test for Normality by fitting a Normal distribution, then performing
    a goodness-of-fit test.


    Select Fit Distribution > Normal from the platform drop-down list.


    When the report appears, select Goodness of Fit from the fitted distribution report.


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_26_0.png)


    This produces a report showing the parameters of the distribution, along with
    a goodness-of-fit statistic testing the null hypothesis that the distribution
    is, in fact, Normal. Small p-values indicate a non-normal distribution.


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_26_1.png)


    # Testing Probabilities


    Another question that could be asked about this data is whether the three levels
    of Thread Wear occur with equal frequency. To test this assumption, a distribution
    of the Thread Wear variable is necessary.


    Make sure the original Denim data table is the front window. If not, select Window
    > Denim.jmp.'
  merge: -1
  img_proc: true
- pgno: 27
