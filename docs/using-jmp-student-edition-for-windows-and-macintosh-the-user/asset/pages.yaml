    When a new column is created, the default title is highlighted and ready to be
    changed.


    Change the title of the new column to Log Starch.


    Now, add a formula to the column.


    Right-click in the heading of the column Log Starch.


    Select Formula from the menu that appears.


    When the formula editor appears,


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_57_0.png)


    Click on Transcendental from the Functions list, then select Log from the resulting
    menu.


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_57_1.png)


    Note that Log is the natural logarithm (base e). Common (base 10) logs are computed
