- pgno: 182
  md: '# Single-Chart Options


    To apply the following options to individual charts, right-click on a chart legend
    to see the popup menu shown in Figure 10.10. When this menu is accessed through
    a chart legend, the commands apply only to the individual chart. When accessed
    through the platform popup menu, without any legends highlighted, the commands
    apply to all charts.


    Figure 10.10 Chart Options


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_182_0.png)


    +   - **Bar Chart** displays a bar for each level of the chart variables. The
    default chart is a bar chart.

    +   - **Line Chart** replaces a bar chart with a line chart and connects each
    point with a straight line. Choose the **Show Points** option to show or hide
    the points.

    +   - **Needle Chart** replaces each bar with a line drawn from the axis to the
    plotted value.

    +   - **Point Chart** shows only the plot points, without connecting them.

    +   - **Show Points** toggles the point markers on a line or needle chart off
    and on.

    +   - **Connect Points** toggles the line connecting points on and off, leaving
    a point chart.

    +   - **Std Error Bars** overlays needles at plus or minus one standard error
    from the mean.

    +   - **Overlay Color** assigns color to a variable to identify it when overlaid
    with other charts.

    +   - **Overlay Marker** assigns plot points a marker to identify them in overlaid
    charts.

    +   - **Overlay Pattern** assigns bars a fill pattern to identify them in overlaid
    charts.

    +   - **Pen Style** allows the choice of a line style from the palette shown in
    Figure 10.10.'
  merge: -1
  img_proc: true
- pgno: 183
  md: '# Frame Options


    Frame options allow control of the plot frame’s elements as a whole.


    Figure 10.11 Frame Options


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_183_0.png)


    +   - **Background Color** colors the background of the plot with the color chosen
    from the JMP Student Edition color palette.

    +   - **Marker Size** allows selection of the marker from a palette of six point
    sizes that range from dot to very large. The **Preferred Size** is set in the
    **Preferences.** The marker size applies to the plot point and its associated
    rows.

    +   - **Marker Drawing Mode** lets you adjust the way markers are drawn. Fast
    mode is useful for graphs with large number of points, so that they re-draw quickly
    after adjustments. Outlined mode is often used in presentations.

    +   - **Border** lets you turn border lines on or off.

    +   - **Size/Scale** allows changes in axes and plot frames. **X Scale** is only
    active on platforms where the X axis is numeric (the X axis for the Charts platform
    is categorical). **Y Scale** shows the standard axis scale dialog, which can also
    be shown by double-clicking in the Y axis. The axis scale dialog allows the specification
    of the maximum, minimum, increment, and tick marks for the axis, and draws tailored
    reference lines or a grid on the plot. The **Frame Size** command displays a dialog
    to enter the exact pixel size for the plot frame.

    +   - **Add Graphics Script** displays a text entry box to enter JSL commands,
    usually to tailor the graphics output in ways not provided with commands and options.
    See the *JMP Scripting Language Guide* for documentation of JSL commands.

