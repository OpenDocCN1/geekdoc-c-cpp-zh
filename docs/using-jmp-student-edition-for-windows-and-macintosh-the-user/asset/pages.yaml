    Capability launches a capability analysis. Details are found in Figure 2.20 on
    page 39.


    Figure 7.9 Example of Connect thru Missing Option


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_119_1.png)


    Script has a submenu of commands available to all platforms that let you redo
    the analysis or save the JSL commands for the analysis to a window or a file.


    # Tests for Special Causes


    The Tests option in the chart type popup menu displays a submenu for test selection.
    You can select one or more tests for special causes with the options popup menu.
    Nelson (1984) developed the numbering notation used to identify special tests
    on control charts.


    If a selected test is positive, the last point in the test sequence is labeled
    with the test number, where the sequence is the moving set of points evaluated
    for that particular test. When you select several tests for display and more than
    one test signals at a particular point, the label of the numerically lowest test
    specified appears beside the point.'
  merge: -1
  img_proc: true
- pgno: 120
  md: '# Western Electric Rules


    Western Electric rules are implemented in the Tests submenu. Table 7.1 on page
    120 lists and interprets the eight tests, and Figure 7.10 illustrates the tests.
    The following rules apply to each test:


    +   - The area between the upper and lower limits is divided into six zones, each
    with a width of one standard deviation.

    +   - The zones are labeled A, B, C, C, B, A with zones C nearest the center line.

    +   - A point lies in Zone B or beyond if it lies beyond the line separating zones
    C and B. That is, if it is more than one standard deviation from the centerline.

    +   - Any point lying on a line separating two zones lines is considered belonging
    to the outermost zone.


    Note: All Tests and zones require equal sample sizes in the subgroups of nonmissing
    data.


    Tests 1 through 8 apply to Mean (X̄) and individual measurement charts. Tests
    1 through 4 can also apply to p-, np-, c-, and u-charts.


    Tests 1, 2, 5, and 6 apply to the upper and lower halves of the chart separately.
    Tests 3, 4, 7, and 8 apply to the whole chart.


    See Nelson (1984, 1985) for further recommendations on how to use these tests.


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_120_0.png)


    > Nelson (1984, 1985)


    # Table 7.1 Description and Interpretation of Special Causes Tests


    | Test 1 | One point beyond Zone A | detects a shift in the mean, an increase
    in the standard deviation, or a single aberration in the process. For interpreting
    Test 1, the R-chart can be used to rule out increases in variation. |

    | Test 2 | Nine points in a row in a single (upper or lower) side of Zone C or
    beyond | detects a shift in the process mean. |

    | Test 3 | Six points in a row steadily increasing or decreasing | detects a trend
    or drift in the process mean. Small trends will be signaled by this test before
    Test 1. |

    | Test 4 | Fourteen points in a row alternating up and down | detects systematic
    effects such as two alternately used machines, vendors, or operators. |'
  merge: -1
  img_proc: true
- pgno: 121
  md: '# Table 7.1 Description and Interpretation of Special Causes Tests


    | Test | Description | Interpretation |

    |---|---|---|

    | Test 5 | Two out of three points in a row in Zone A or beyond | detects a shift
    in the process average or increase in the standard deviation. Any two out of three
    points provide a positive test. |

    | Test 6 | Four out of five points in Zone B or beyond | detects a shift in the
    process mean. Any four out of five points provide a positive test. |

    | Test 7 | Fifteen points in a row in Zone C, above and below the center line
    | detects stratification of subgroups when the observations in a single subgroup
    come from various sources with different means. |

    | Test 8 | Eight points in a row on both sides of the center line with none in
    Zones C | detects stratification of subgroups when the observations in one subgroup
    come from a single source, but subgroups come from different sources with different
    means. |'
  merge: -1
  img_proc: true
