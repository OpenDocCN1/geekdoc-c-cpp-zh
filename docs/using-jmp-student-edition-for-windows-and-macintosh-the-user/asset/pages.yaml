- pgno: 23
  md: 'Move the mouse vertically to change the position of the bars.


    These histograms are also useful in looking at some relationships among the variables.
    For example,


    Click on the histogram corresponding to Alpha Amalyze in the Method histogram.


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_23_0.png)


    The bar for Alpha Amalyze is highlighted, as are the bars in the other histograms
    for all the data points that have Alpha Amalyze as their method. Notice that the
