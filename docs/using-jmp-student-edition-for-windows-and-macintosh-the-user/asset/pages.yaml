- pgno: 44
  md: 'interest such as an engineering specification. When used in capability assessment,
    Z USL is the distance to the upper specification limit and Z LSL is the distance
    to the lower specification limit.


    Z USL = (USL-Xbar)/sigma = 3 * CPU


    Z LSL = (Xbar-LSL)/sigma = 3 * CPL


    Z Bench = Inverse Cumulative Prob(1 - P(LSL) - P(USL))


    where


    P(LSL) = Prob(X < LSL) = 1 - Cum Prob(Z LSL)


    P(USL) = Prob(X > USL) = 1 - Cum Prob(Z USL)


    **Note:** You can also do a non-normal capability analysis through **Fit Distribution**
    options, described in the next section. After you fit a distribution, you have
    the option to generate quantiles and a target value for the fitted distribution.
    If you give a target value, a capability analysis is automatically generated by
    using the quantile values and target you specified.'
