- pgno: 143
  md: '# Time Series


    The Time Series platform lets you explore, analyze, and forecast univariate time
    series. A time series is a set y₁, y₂, …, yₙ of observations taken over a series
    of equally-spaced time periods. The analysis begins with a plot of the points
    in the time series. In addition, the platform displays graphs of the autocorrelations
    and partial autocorrelations of the series. These indicate how and to what degree
    each point in the series is correlated with earlier values in the series and can
    be used to identify the type of model appropriate for describing and predicting
    (forecasting) the evolution of the time series. The model types include


    +   - **ARIMA**, autoregressive integrated moving-average, often called Box-Jenkins
    models

    +   - **Smoothing Models**, several forms of exponential smoothing and Winter’s
    method.


    **Note:** The Time Series Launch dialog requires that one or more continuous variables
    be assigned as the time series. Optionally, you can specify a time ID variable,
    which is used to label the time axis. If a time ID variable is specified, it must
    be continuous, sorted ascending, evenly spaced, and without missing values.


    # Introduction


    The data for the next examples are in the Series.jmp table found in the Time Series
    sample data folder (Box and Jenkins 1976). The time series variable is Passengers
    and the time ID is Time.


    Select **Analyze > Time Series** to display the Time Series Launch dialog (Figure
    8.1).


    This dialog allows you to specify the number of lags to use in computing the autocorrelations
    and partial autocorrelations. It also lets you specify the number of future periods
    to forecast using each model fitted to the data.


    For this example, assign Passengers as **Y, Time Series** and Time as **X, Time
    ID**.


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_143_0.png)'
  merge: -1
  img_proc: true
- pgno: 144
