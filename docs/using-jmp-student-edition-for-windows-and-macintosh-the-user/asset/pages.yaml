    # Custom Test


    In introductory statistics courses, null hypotheses are often about one variable
    at a time, frequently hypothesizing that a parameter is zero. However, it is possible
    to test far more complicated null hypotheses than this. For example, it is reasonable
    to test that several parameters are zero, one, or another value, or that some
    parameters are equal to others. These tests are known in statistics as a general
    linear hypotheses, and are tested using JMP''s Custom Test command.


    To test a custom hypothesis, select Custom Test from the Estimates popup menu,
    which displays the dialog shown in Figure 5.13.


    # Figure 5.13 Custom Test Launch


    You can enter a descriptive label for this test—useful if you are doing several
    tests


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_94_1.png)


    The space beneath the Custom Test title bar is an editable area for entering a
    test name.'
  merge: -1
  img_proc: true
- pgno: 95
  md: 'Parameter lists the names of the model parameters. To the right of the list
    of parameters are columns of zeros corresponding to these parameters. Click in
    these cells to enter a new hypothesized parameter value corresponding to the desired
    test.


    One of the parameters is labeled “ = ”. In the edit box to its right, enter the
    value that you are testing the contrast against. For example, you may be testing
    that a certain combination of the factors sums to 1. You would enter a 1 beside
    the “ = ” in this dialog.


    Add Column adds another column of zeros so that several linear functions of the
    parameters can be jointly tested. Use the Add Column button to add as many columns
    to the test as needed.


    When the test is specified, click Done to see the test performed. The results
    are appended to the bottom of the dialog.


    When the custom test is done, the report lists the test name, the function value
    of the parameters tested, the standard error, and other statistics for each test
    column in the dialog. A joint F test for all columns is at the bottom. Sample
    output for a custom test (that the Size of Load coefficient is equal to 1) is
    shown in Figure 5.14.


    # Figure 5.14 Custom Test Output


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_95_0.png)


    Note: For tests within a categorical effect, instead of using a Custom test, consider
    using the contrast dialog, which tests hypotheses about the least squares means.


    # Correlation of Estimates


    The Correlation of Estimates option in the Estimates platform menu produces a
    correlation matrix for the all effects in a model.


    # Row Diagnostics


    Leverage Plots (the Plot Actual by Predicted and Plot Effect Leverage commands)
    are covered previously in this chapter under “Leverage Plots,” p. 91.'
  merge: -1
  img_proc: true
- pgno: 96
  md: '+   - **Plot Actual by Predicted** displays the observed values by the predicted
    values of Y. This is the leverage plot for the whole model.

    +   - **Plot Effect Leverage** produces a leverage plot for each effect in the
    model showing the point-by-point composition of the test for that effect.

    +   - **Plot Residual By Predicted** displays the residual values by the predicted
    values of Y. You typically want to see the residual values scattered randomly
    about zero.

    +   - **Plot Residual By Row** displays the residual value by the row number of
    its observation.

    +   - **Durbin-Watson Test** displays the Durbin-Watson statistic to test whether
    or not the errors have first-order autocorrelation. The autocorrelation of the
    residuals is also shown. The Durbin-Watson table has a popup command that computes
    and displays the exact probability associated with the statistic. This Durbin-Watson
    table is only appropriate for time series data when you suspect that the errors
    are correlated across time.


    # Save Commands


    The Save submenu offers the following choices. Each selection generates one or
    more new columns in the current data table titled as shown, where colname is the
    name of the response variable:


    **Prediction Formula** creates a new column, called Pred Formula colname, containing
    the predicted values computed by the specified model. It differs from the Save
    Predicted Values column in that the prediction formula is saved with the new column.
    This is useful for predicting values in new rows or for obtaining a picture of
    the fitted model.


    Use the Column Info command and click the Edit Formula button to see the prediction
    formula. The prediction formula can require considerable space if the model is
    large. If you do not need the formula with the column of predicted values, use
    the Save Predicted Values option.


    **Predicted Values** creates a new column called Predicted colname that contain
    the predicted values computed by the specified model.


    **Residuals** creates a new column called Residual colname containing the residuals,
    which are the observed response values minus predicted values.


    **Mean Confidence Interval** creates two new columns called Lower 95% Mean colname
    and Upper 95% Mean colname. The new columns contain the lower and upper 95% confidence
    limits for the line of fit.


    Note: If you hold down the Shift key and select Save Mean Confidence Interval,
    you are prompted to enter an α-level for the computations.


    **Individual Confidence Interval** creates two new columns called Lower95% Indiv
    colname and Upper95% Indiv colname. The new columns contain lower and upper 95%
    confidence limits for individual response values.


    Note: If you hold down the Shift key and select Save Individual Confidence Interval,
    you are prompted to enter an α-level for the computations.


    **Studentized Residuals** creates a new column called Studentized Resid colname.
    The new column values are the residuals divided by their standard error.


    **Std Error of Predicted** creates a new column, called StdErr Pred colname, containing
    the standard errors of the predicted values.'
  merge: -1
  img_proc: true
- pgno: 97
  md: '# ## Std Error of Residual


    creates a new column called, StdErrResid *colname*, containing the standard errors
