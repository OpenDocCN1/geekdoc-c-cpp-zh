- pgno: 58
  md: '# Scatterplots—The Continuous by Continuous Case


    If both the X and Y variables are continuous, JMP Student Edition produces a bivariate
    analysis that initially shows a scatterplot. There are a number of options once
    the scatterplot appears, all accessed through the popup menu beside the variable
    name in the title bar (Figure 3.14)


    Figure 3.14 Bivariate Popup Menu


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_58_0.png)


    Show Points alternately hides or displays the points in the plot.


    It is often useful to first fit the mean as a reference line for other fits. The
    Fit Mean command adds a horizontal line to the plot at the mean of the response
    variable (Y). As with all the fitting commands in this platform, a legend appears
    below the plot with its own drop-down menu, where additional commands for each
    fit are accessed. The Fit Mean Fit table shows the value of the mean, its standard
    deviation, its standard error, and the sum of squared errors around the mean


    Figure 3.15 Fit Commands


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_58_1.png)


    The Fit Line command adds a straight-line fit to the plot using least squares
    regression. Its drop-down menu (accessed as in Figure 3.15) has commands to save
    predicted values and residuals for the linear fit as new columns in the current
    data table.'
  merge: -1
  img_proc: true
- pgno: 59
  md: '# 3 The Fit Y by X Platform


    Scatterplots—The Continuous by Continuous Case


    If the confidence area around this line (produced through the **Confid Curves
    Fit** command) includes the horizontal line at the response mean, then the slope
    of the line of fit is not significantly different from zero at the 0.05 significance
    level.


    The **Fit Polynomial** command fits a polynomial curve of the degree selected
    from the **Fit Polynomial** submenu. After selecting the polynomial degree, the
    curve is fit to the data points using least squares regression. 95% confidence
    limits are plotted with the **Confid Curves Fit** and **Confid Curves Indiv**
    display options.


    The **Fit Polynomial** option can be selected multiple times with different polynomial
    degrees for comparison. As with the linear fit, options can save predicted values
    and residuals as new columns in the current data table for each polynomial fit.


    Each time a linear or polynomial fit is chosen, three additional tables are appended
    to the report (see Figure 3.16). A Lack of Fit table also appears if there are
    replicates. For details of the lack of fit test, see “The Lack of Fit Table,”
    p. 90 or the online help.


    **Figure 3.16** Linear Fit Text Reports


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_59_0.png)


    # The Summary of Fit Table


    The summary of fit table shows the following information:


    +   - $R^2$ (**RSquare**), a measure of how well the line fits

    +   - The adjusted $R^2$ (**RSquare Adj**), used to compare models with different
    numbers of variables

    +   - The **Root Mean Square Error**, an estimate of the standard deviation of
    the random error

    +   - The mean of the response variable

    +   - The number of observations (or, if weighted variables are involved, the
    sum of the weights).'
  merge: -1
  img_proc: true
- pgno: 60
  md: '# The Lack of Fit Table


    The Lack of Fit table shows a special diagnostic test that appears only when the
    data and the model provide the opportunity. It is a test to see if a different
    form of the model would fit the data better. A significant F statistic in this
    table indicates that a different model should be examined. For details of the
    lack of fit test, see “The Lack of Fit Table,” p. 90 or the online help.


    # Analysis of Variance Table


    This table look similar to the ANOVA tables in most textbooks. However, there
    may be some differences in the terminology for the ANOVA table’s parts. JMP Student
    Edition uses the following:


    +   - **Source** lists the three sources of variation, called **Model**, **Error**,
    and **C Total**. The “C” in **C Total** stands for *corrected*, as in corrected
    for the mean.

    +   - **DF** records the associated degrees of freedom (**DF**) for each source
    of variation

    +   - **Sum of Squares** records an associated sum of squares (SS for short) for
    each source of variation.

    +   - **Mean Square** is a sum of squares divided by its associated degrees of
    freedom.

    +   - **F Ratio** is the model mean square divided by the error mean square. The
    underlying hypothesis of the fit is that all the regression parameters (except
    the intercept) are zero. If a parameter is a significant model effect, the F Ratio
    is usually higher than expected by chance alone.

    +   - **Prob > F** is the observed significance probability (*p*-value) of obtaining
    a greater F value by chance alone if the specified model fits no better than the
    overall response mean.


    # Parameter Estimates Table


    The terms in the Parameter Estimates table for a linear fit (seen previously in
    Figure 3.16) are the intercept and the single X variable.


    The Parameter Estimates table displays the following:


    +   - **Term** lists the name of each parameter in the requested model. The intercept
    is a constant term in all models.

    +   - **Estimate** lists the parameter estimates of the linear model. These estimates
    are the coefficients in the linear model.

    +   - **Std Error** lists the estimates of the standard errors of the parameter
    estimates. They are used in constructing tests and confidence intervals.

    +   - **t Ratio** lists the test statistics for the hypothesis that each parameter
    is zero. It is the ratio of the parameter estimate to its standard error. Looking
    for a t ratio greater than 2 in absolute value is a common rule of thumb for judging
    significance, because it approximates the 0.05 significance level.

    +   - **Prob>|t|** lists the observed significance probability calculated from
    each t ratio. It is the probability of getting, by chance alone, a t ratio greater
    (in absolute value) than the computed value, given a true hypothesis. Often, a
    value below 0.05 is interpreted as evidence that the parameter is significantly
    different from zero.'
  merge: -1
  img_proc: true
- pgno: 61
  md: '# Other Fitting Commands


    The Fit Special command displays a dialog with choices for transformations of
    both the Y and X variables. Transformations include log, square root, square,
    reciprocal, and exponential.


    The fitted line is plotted on the original scale, so it appears as a curve on
    the plot. The regression report is shown with the transformed variables, but an
    extra report shows measures of fit transformed in the original Y scale (if there
    was a Y transformation).


    The Fit Each Value command fits a value to each unique X value. Fitting each value
    is like doing a one-way analysis of variance, but in the continuous by continuous
    bivariate platform. Compare it to other fitted lines to see the concept of lack
    of fit.


    The Density Ellipse command draws an ellipse that contains the specified mass
    of points, determined by the probability chosen from the Density Ellipse submenu.
    The Other selection allows the specification of any probability greater than zero
    and less than or equal to one.


    The density ellipsoid is a good graphical indicator of the correlation between
    two variables. The ellipsoid collapses diagonally as the correlation between the
    two variables approaches either 1 or −1. The ellipsoid is more circular (less
    diagonally oriented) if the two variables are uncorrelated.


    The Density Ellipse table that accompanies each Density Ellipse fit shows the
    correlation coefficient (r) for the X and Y variables and the probability that
    the correlation between the variables is significant.


    The Group By command in the fitting menu displays a dialog, allowing selection
    of a classification (grouping) variable. When a grouping variable is selected,
    the Fit Y by X platform computes a separate analysis for each level of the grouping
    variable, and overlays the regression curves or ellipses on the scatterplot. The
    fit for each level of the grouping variable is identified beneath the scatterplot,
    with individual popup menus to save or remove fitting information.


    The Group By command is checked in the fitting menu when a grouping variable is
    in effect. To change a grouping variable that is already in effect,


    +   1. Select the Group By command to remove (uncheck) the existing variable.

    +   2. Then, select the Group By command again and respond to its dialog as before.


    # One Way ANOVA—The Continuous by Categorical Case


    If the X variable is categorical and the Y variable is continuous, JMP Student
    Edition produces a one way ANOVA, initially displaying a plot that shows a vertical
    distribution of Y points for each X value. There are a number of options once
    this scatterplot appears, all accessed through the popup menu beside the variable
    name in the title bar (Figure 3.17).'
  merge: -1
  img_proc: true
- pgno: 62
  md: '# Figure 3.17 One Way ANOVA Popup Menu


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_62_0.png)


    The Quantiles command displays the Quantiles table, which lists the 0% (minimum),
    10%, 25%, 50% (median), 75%, 90%, and 100% (maximum) quantiles for each group.
    It also activates Box Plots from the Display Options menu.


    The Means/Anova/t test command fits means for each group and performs a one-way
    analysis of variance to test if there are differences among the means. Three tables
    are produced: a summary table, a one-way analysis of variance table, and a table
    that lists group frequencies, means, and standard errors computed with the pooled
    estimate of the error variance. If there are only two groups, a t-test also shows.
    This option automatically activates the Means Diamonds display option. See “Analysis
    of Variance (anova),” p. 50 for a detailed description of means diamonds.


    The Means and Std Dev command fits means for each group, but uses standard deviations
    computed within each group rather than the pooled estimate of the standard deviation
    used to calculate the standard errors of the means. This command also displays
    Means Dots, Error Bars, and Std Dev Lines display options.


    Compare Means has a submenu that provides the following four multiple comparison
    methods for comparing sets of group means. All activate the Comparison Circles
    display option.


    +   - Each Pair, Student''s t displays a table with Student''s t statistics for
    all combinations of group means.

    +   - All Pairs, Tukey HSD displays a table that shows the Tukey-Kramer HSD (honestly
    significant difference) comparisons of group means.

    +   - With Best, Hsu''s MCB displays a table that shows Hsu''s MCB (Multiple Comparison
    with the Best) comparisons of group means to the best (maximum or minimum) group
    mean.

    +   - With Control, Dunnett''s displays a table showing Dunnett''s comparisons
    of group means with a control group.'
  merge: -1
  img_proc: true
- pgno: 63
  md: 'Each multiple comparison test begins with a comparison circles plot, a visual
    representation of group mean comparisons. The plot follows with a table of means
    comparisons. The illustration in Figure 3.18 shows the alignment of comparison
    circles with the confidence intervals of their respective group means.


    # Figure 3.18 Alignment of Comparison Circles


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_63_0.png)


    Compare each pair of group means visually by examining how the comparison circles
    intersect. The outside angle of intersection tells whether group means are significantly
    different (see Figure 3.19). Circles for means that are significantly different
    either do not intersect or barely intersect, so that the outside angle of intersection
    is less than 90°. If the circles intersect by an angle of more than 90°, or if
    they are nested, the means are not significantly different.


    If the intersection angle is close to 90°, it is easy to verify whether the means
    are significantly different by clicking on the comparison circle, thus highlighting
    it. The highlighted circle appears with a thick solid line. Circles representing
    means that are not significantly different from the highlighted circle show with
    thin lines (see Figure 3.20). Circles representing means that are significantly
    different show with a thick gray pattern. To deselect circles, click in the graph
    outside the circles.


    # Figure 3.19 Angles in Comparison Circles


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_63_1.png)'
  merge: -1
  img_proc: true
- pgno: 64
  md: '# Figure 3.20 Comparison Circles after Clicking


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_64_0.png)


    The Nonparametric submenu allows computation of three nonparametric tests: the
    Wilcoxon, Median, and van der Warden tests. Nonparametric tests are useful to
    test whether group means or medians are located the same across groups. However,
    the usual analysis of variance assumption of normality is not made. Nonparametric
    tests use functions of the response variable ranks, called rank scores.


    +   - Wilcoxon rank scores are the simple ranks of the data. The Wilcoxon test
    is the most powerful rank test for errors with logistic distributions.

    +   - Median rank scores are either 1 or 0 depending on whether a rank is above
    or below the median rank. The Median test is the most powerful rank test for errors
    with doubly exponential distributions.

    +   - Van der Waerden rank scores are the ranks of the data divided by one plus
    the number of observations transformed to a normal score by applying the inverse
    of the normal distribution function. The Van der Waerden test is the most powerful
    rank test for errors with normal distributions.


    The UnEqual Variances command tests for equality of group variances. It uses (and
    reports) four different tests: O''Brien''s test, the Brown-Forsythe test, Levene''s
    test, and Bartlett''s test. When the variances across groups are not equal, the
    usual analysis of variance assumptions are not satisfied, so the standard ANOVA
    F test is not valid. There is a valid variant of the standard ANOVA, called the
    Welch ANOVA, which is displayed.


    Set Alpha Level has a submenu that allows a choice from the most common alpha
    levels, or the specification of any level with the Other selection. Changing the
    alpha level recalculates any confidence limits, adjusts the means diamonds on
    the plot if they are showing, and modifies the upper and lower confidence level
    values in reports.


    Normal Quantile Plot shows overlaid normal quantile plots for each level of the
    X variable. Along with the standard normality-assessing capabilities of the single-variable
    Normal Quantile Plot, this plot shows both the differences in the means (vertical
    position) and the variances (slopes) for each level of the categorical X factor
    (Figure 3.21).'
  merge: -1
  img_proc: true
- pgno: 65
  md: '# Figure 3.21 Normal Quantile Plot


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_65_0.png)


    Normal Quantile Plot has these additional options:


    +   - Plot Actual by Quantile generates a quantile plot with the response variable
    on the y-axis and quantiles on the x-axis. The plot shows quantiles computed within
    each level of the categorical X factor.

    +   - Plot Quantile by Actual reverses the x- and y-axes, as shown in Figure 3.21.

    +   - Line of Fit draws the straight diagonal reference lines for each level of
    the X variable.

    +   - Probability Labels shows probabilities on the right axis of the Quantile
    by Actual plot and on the top axis of the Actual by Quantile plot.


    CDF plots the cumulative distribution function for all the groups in the Oneway
    report.


    Save has a submenu of commands to save the following quantities as new columns
    in the current data table:


    +   - Save Centered saves values computed as the response variable minus the mean
    of the response variable within each level of the factor variable.

    +   - Save Standardized saves standardized values of the response variable computed
    within each level of the factor variable. This is the centered response divided
    by the standard deviation within each level.

    +   - Save Normal Quantiles saves normal quantile values computed within each
    level of the categorical factor variable.


    Display Options allows addition or removal of plot elements.


    +   - All Graphs shows or hides all graphs.

    +   - Points shows data points on the scatterplot.

    +   - Box Plots shows outlier box plots for each group.

    +   - Means Diamonds draws Means Diamonds. Complete details of means diamonds
    is found in “Analysis of Variance (anova),” p. 50.

    +   - Mean Lines draws a line at the mean of each group.

    +   - Mean CI Lines draws lines at the upper and lower 95% confidence levels for
    each group.

    +   - Mean Error Bars identifies the mean of each group with a large marker and
    shows error bars one standard error above and below the mean.

    +   - Grand Mean draws the overall mean of the Y variable on the scatterplot.

    +   - Std Dev Lines shows dotted lines one standard deviation above and below
    the mean of each group.'
