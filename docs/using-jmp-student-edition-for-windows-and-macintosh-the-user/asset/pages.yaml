- pgno: 202
  md: '# Entering Responses


    To enter responses, follow the steps in Figure 12.5.


    # Figure 12.5  Entering Responses


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_202_0.png)


    **Tip:** To quickly enter multiple responses, click the **N Responses** button
    and enter the number of responses you want.


    # Specifying Goal Types and Lower and Upper Limits


    When entering responses, you can tell JMP that your goal is to obtain the maximum
    or minimum value possible, to match a specific value, or that there is no goal.


    The following description explains the relationship between the goal type (step
    3 in Figure 12.5) and the lower and upper limits (step 4 in Figure 12.5):


    +   - For responses such as strength or yield, the best value is usually the largest
    possible. A goal of **Maximize** supports this objective.

    +   - The **Minimize** goal supports an objective of having the best objective
    be the smallest value, such as when the response is impurity or defects.

    +   - The **Match Target** goal supports the objective when the best value for
    a response is a specific target value, such as with part dimensions. The default
    target value is assumed to be midway between the lower and upper limits.


    **Note:** If your target range is not symmetric around the target value, you can
    alter the default target after you make a table from the design. In the data table,
    open the response’s Column Info dialog by double-clicking the column name, and
    enter an asymmetric target value.'
  merge: -1
  img_proc: true
- pgno: 203
  md: '# Understanding Importance Weights


    When computing overall desirability, JMP uses the value you enter as the importance
    weight (step 4 in Figure 12.5) as the weight of each response. If there is only
    one response, then specifying importance is unnecessary. With two responses you
    can give greater weight to one response by assigning it a higher importance value.


    # Entering Factors


    After entering responses, enter factors. The Factors panel''s appearance depends
    on the design you select. Entering factors is the same in Screening Design, Space
    Filling Design, Mixture Design, and Response Surface Design. This process is described
    below, in Figure 12.6.


    Figure 12.6 Entering Factors


    To enter factors, type the number of factors and click Add.


    Highlight the factor and click the Remove Selected button to remove a factor in
    the list.


    Double-click to edit the factor name.


    Click to enter factor values. To remove a level, click it, press the delete key
    on your keyboard, then press the Return or Enter key on your keyboard.


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_203_0.png)


    # Types of Factors


    In general, when designing experiments, you can enter different types of factors
    in the model. Below is a description of factor types from which you can choose
    when creating screening designs:


    +   - Continuous  Continuous factors have numeric data types only. In theory,
    you can set a continuous factor to any value between the lower and upper limits
    you supply.

    +   - Categorical  Categorical factors (either numerical or categorical data types)
    have no implied order. If the values are numbers, the order is the numeric magnitude.
    If the values are character, the order is the sorting sequence. The settings of
    a categorical factor are discrete and have no intrinsic order. Examples of categorical
    factors are machine, operator, and gender.


    After your responses and factors are entered, click Continue.


    # Choosing a Design


    The list of screening designs you can use includes designs that group the experimental
    runs into blocks of equal sizes where the size is a power of two. Highlight the
    type of screening design you would like to use and click Continue.'
  merge: -1
  img_proc: true
- pgno: 204
  md: '# Figure 12.7 Choosing a Type of Screening Design


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_204_0.png)


    The screening designer provides the following types of designs:


    # Two-Level Full Factorial


    A full factorial design contains all combinations of the levels of the factors.
    The samples size is the product of the levels of the factors. For two-level designs,
    this is 2^k where k is the number of factors. This can be expensive if the number
    of factors is greater than 3 or 4.


    These designs are orthogonal. This means that the estimates of the effects are
    uncorrelated. If you remove an effect in the analysis, the values of the other
    estimates remain the same. Their p-values change slightly, because the estimate
    of the error variance and the degrees of freedom are different.


    Full factorial designs allow the estimation of interactions of all orders up to
    the number of factors. Most empirical modeling involves first- or second-order
    approximations to the true functional relationship between the factors and the
    responses. The figure to the left in Figure 12.8 is a geometric representation
    of a two-level factorial.


    # Two-Level Fractional Factorial


    A fractional factorial design also has a sample size that is a power of two. If
    k is the number of factors, the number of runs is 2^(k-p) where p < k. The fraction
    of the full factorial is 2^p. Like the full factorial, fractional factorial designs
    are orthogonal.


    The trade-off in screening designs is between the number of runs and the resolution
    of the design. If price is no object, you can run several replicates of all possible
    combinations of m factor levels. This provides a good estimate of everything,
    including interaction effects to the mth degree. But because running experiments
    costs time and money, you typically only run a fraction of all possible levels.
    This causes some of the higher-order effects in a model to become nonestimable.
    An effect is nonestimable when it is confounded with another effect. In fact,
    fractional factorials are designed by deciding in advance which interaction effects
    are confounded with the other interaction effects.


    # Resolution Number: The Degree of Confounding


    In practice, few experimenters worry about interactions higher than two-way interactions.
    These higher-order interactions are assumed to be zero. Experiments can therefore
    be classified by resolution number into three groups:


    +   - Resolution = 3 means that main effects are confounded with one or more two-way
    interactions, which must be assumed to be zero for the main effects to be meaningful.

    +   - Resolution = 4 means that main effects are not confounded with other main
    effects or two-factor interactions. However, two-factor interactions are confounded
    with other two-factor interactions.'
  merge: -1
  img_proc: true
- pgno: 205
  md: '+   - Resolution ≥ 5 means there is no confounding between main effects, between
    two-factor interactions, or between main effects and two-factor interactions.


    All the fractional factorial designs are *minimum aberration* designs. For DOE
    experts, the minimum aberration design of a given resolution minimizes the number
    of words in the defining relation that are of minimum length.


    The figure on the right in Figure 12.8 is geometric representation of a two-level
    fractional factorial design.


    # Figure 12.8 Representation of Full Factorial (Left) and Two-Level Fractional
    Factorial (Right) Designs


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_205_0.png)


    # Plackett-Burman Designs


    Plackett-Burman designs are an alternative to fractional factorials for screening.
    One useful characteristic is that the sample size is a multiple of four rather
    than a power of two. There are no two-level fractional factorial designs with
    sample sizes between 16 and 32 runs. However, there are 20-run, 24-run, and 28-run
    Plackett-Burman designs.


    The main effects are orthogonal and two-factor interactions are only partially
    confounded with main effects. This is different from resolution-three fractional
    factorial where two-factor interactions are indistinguishable from main effects.


    In cases of effect sparsity, a stepwise regression approach can allow for removing
    some insignificant main effects while adding highly significant and only somewhat
    correlated two-factor interactions.


    # Mixed-Level Designs


    If you have qualitative factors with three values, then none of the classical
    designs discussed previously are appropriate. For pure three-level factorials,
    JMP offers fractional factorials. For mixed two-level and three-level designs,
    JMP offers complete factorials and specialized orthogonal-array designs, listed
    below.


    # Table 12.1


    | Design | Two-Level Factors | Three-Level Factors |

    |---|---|---|

    | L18 John | 1 | 7 |

    | L18 Chakravarty | 3 | 6 |

    | L18 Hunter | 8 | 4 |

    | L36 | 11 | 12 |'
  merge: -1
  img_proc: true
- pgno: 206
  md: 'If you have fewer than or equal to the number of factors for a design listed
    in the table, you can use that design by selecting an appropriate subset of columns
    from the original design. Some of these designs are not balanced, even though
    they are all orthogonal.


    # Cotter Designs


    Cotter designs are used when you have very few resources and many factors, and
    you believe there may be interactions. Suppose you believe in effect sparsity—
    that very few effects are truly nonzero. You believe in this so strongly that
    you are willing to bet that if you add up a number of effects, the sum will show
    an effect if it contains an active effect. The danger is that several active effects
    with mixed signs will cancel and still sum to near zero and give a false negative.


    Cotter designs are easy to set up. For k factors, there are 2k + 2 runs. The design
    is similar to the “vary one factor at a time” approach many books call inefficient
    and naive.


    A Cotter design begins with a run having all factors at their high level. Then
    follow k runs each with one factor in turn at its low level, and the others high.
    The next run sets all factors at their low level and sequences through k more
    runs with one factor high and the rest low. This completes the Cotter design,
    subject to randomizing the runs.


    When you use JMP to generate a Cotter design, JMP also includes a set of extra
    columns to use as regressors. These are of the form factorOdd and factorEven where
    factor is a factor name. They are constructed by adding up all the odd and even
    interaction terms for each factor. For example, if you have three factors, A,
    B, and C:


    # Figure 12.9


    AOdd = A + ABC      AEven = AB + AC

    BOdd = B + ABC      BEven = AB + BC

    COdd = C + ABC      CEven = BC + AC


    Because these columns in a Cotter design make an orthogonal transformation, testing
    the parameters on these combinations is equivalent to testing the combinations
    on the original effects. In the example of factors listed above, AOdd estimates
    the sum of odd terms involving A. AEven estimates the sum of the even terms involving
    A, and so forth.


    Because Cotter designs have a false-negative risk, many statisticians discourage
    their use.


    # How to Run a Cotter Design


    By default, JMP does not include a Cotter design in the list of available screening
    designs (Figure 12.7). However, if you would like to make a Cotter design:


    +   1. Immediately after entering responses and factors (and before clicking Continue),
    click the red triangle icon in the Screening Design title bar.

    +   2. Select Supress Cotter Designs.


    Changing the setting via the red triangle menu applies only to the current design.
    To alter the setting for all screening designs:


    +   1. Select File > Preferences.

    +   2. Click the Platform icon.

    +   3. Click DOE to highlight it.

    +   4. Uncheck the box beside Supress Cotter Designs.'
  merge: -1
  img_proc: true
