- pgno: 50
  md: '# Analysis of Variance (ANOVA)


    Is knowledge of the wash method useful in predicting starch content of the denim?
    The statistical test to answer this question is called a *one-way ANOVA*, and
    is produced in the same way as the *t*-test above.


    Select **Means/Anova** from the drop-down menu next to **Oneway Analysis**.


    Note that his command reads **Means/Anova/t test** when the categorical variable
    only has two levels. In all other cases (like this one), the t test is not appropriate,
    so is not available on the menu.


    An ANOVA table appears beneath the plots, and means diamonds appear on the plot.
    A *means diamond* illustrates a sample mean and its 95% confidence interval, as
    shown by the schematic in Figure 3.6. The horizontal line across each diamond
    represents the group mean. The vertical span of each diamond represents the 95%
    confidence interval for each group. *Overlap marks* are drawn above and below
    the group mean. For groups with equal sample sizes, overlapping overlap marks
    indicate that the two group means are not significantly different at the 95% confidence
    level.


    Figure 3.6 Means Diamonds Illustrated


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_50_0.png)


    Examining the ANOVA table shows that Method is a highly significant predictor
    of starch content. In other words, at least one level of the Method variable has
    a significantly higher or lower starch content than the others. The obvious question
    is which levels are different from each other. JMP Student Edition uses comparison
    circles to explore this.


    # Comparison Circles


    To show comparison circles,


    Select **Compare Means > Each Pair, Student''s t**


    Complete details of comparison circles are on page 63. Put simply, they show differences
    among levels of a variable, and are clickable. When a circle is clicked, it turns
    red, levels that are *not* significantly different from it turn red, and levels
    that *are* significantly different from it turn gray. To see this,


    Click on the bottom comparison circle, corresponding to Alpha Amalyz e.'
  merge: -1
  img_proc: true
- pgno: 51
  md: '# Figure 3.7 Starch Content Comparison Circles


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_51_0.png)


    The display changes to the one shown in Figure 3.7. This shows that Alpha Amalyze
    is significantly different from the other two wash methods.


    Click on the other two circles to discover their relationships.


    These comparison circles are based on the confidence interval around the mean,
    which is itself based on the α level. By default, the α-level is 5%. However,
    it can be changed.


    From the popup menu in the Oneway title bar, select Set α Level > .10.


    Notice that the comparison circles change diameter when the α-level changes.


    # Fitting Lines


    The middle plot of the report in Figure 3.2 is of two continuous variables, a
    situation that allows fitting of lines and curves through least-squares regression.


    For example, suppose you want to predict starch content based on the size of the
    wash load. A good guess may simply be the mean starch content from all the data
    points. To see this mean,


    Select Fit Mean from the drop-down list in the title bar of the plot.


    A line representing the mean appears on the plot, and Fit Mean appears in a legend
    below the plot. Notice that Fit Mean below the plot has its own drop-down menu,
    as shown in Figure 3.8.


    # Figure 3.8 Fit Mean Results


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_51_1.png)


    Platform Menu


    Fit Menu'
  merge: -1
  img_proc: true
- pgno: 52
  md: 'A more interesting statistical question is whether a line or a curve is a better
    predictor of starch content than this simple mean. To fit a regression line to
    this data,


    +   Select **Fit Line** from the platform menu in the plot’s title bar.


    A line is superimposed on the graph. This line should be compared with the simple
    mean to see if it is helpful in prediction. To do this comparison, JMP Student
    Edition can draw confidence intervals for the fit around the fitted line. If these
    confidence intervals do not contain the horizontal mean, then the fitted line
    is helpful.


    +   Select **Confid Curves Fit** from the **Linear Fit** menu in the legend below
    the plot.


    As seen in Figure 3.9, the dotted confidence interval around the linear fit does
    not contain the mean. Therefore, the linear fit is statistically significant.
    It is statistically sound to use the fitted line in predictions.


    # Figure 3.9 Fit Line Results


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_52_0.png)


    There is also an option to produce shaded confidence curves, using the **Confid
    Shaded** Fit command.


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_52_1.png)


    The equation of the line, as well as several computed statistics, are found in
    the **Linear Fit** report. Values of the slope and intercept are also printed
    in the **Parameter Estimates** section of the report.


    Aside from the graphical confidence-curve method detailed above, there are numerical
    measures of the significance. One is the *p*-value associated with the slope of
    the line, also found in the Parameter Estimates report. In this case, the *p*-value
    is 0.0045, significant by almost any standard, reinforcing the graphical results
    above.'
  merge: -1
  img_proc: true
