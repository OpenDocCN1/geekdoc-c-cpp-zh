    Since the autocorrelation graph decreases slowly and steadily, but the partial
    autocorrelation graph drops off drastically after lag 1, a reasonable guess for
    a model is an MA(1). To try this model,


    +   - Select **ARIMA** from the platform menu.

    +   - Enter a 1 beside **q, Moving Average Order.**

    +   - Click **Estimate.**


    JMP Student Edition estimates the model and displays a model summary, parameter
    estimates, and a forecast graph. The most important graph, however, is the residuals,
    which is initially closed.'
