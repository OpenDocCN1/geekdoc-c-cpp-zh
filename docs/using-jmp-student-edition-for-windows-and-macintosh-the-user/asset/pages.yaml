- pgno: 45
  md: '# The Fit Y by X Platform


    Any time two variables need to be compared, the Fit Y by X platform is the choice
    to make. This single platform produces one way ANOVA, scatterplots, and contingency
    table analysis—most of the two-variable analyses seen in an introductory statistics
    course.


    # Introduction


    After starting JMP Student Edition,


    +   Open the data file Denim.jmp.


    Details about this data are found in Chapter 2, “The Distribution Platform” in
    the section “About the Data,” p. 21.


    # Launching the Platform


    In this introduction section, the variables are examined in pairs.


    +   Select Analyze > Fit Y By X from the menu bar.


    This brings up the Fit Y By X platform launch dialog as seen in Figure 3.1


    Figure 3.1 Fit Y By X Launch Dialog


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_45_0.png)


    Notice the word “Contextual” in the title bar. It is there because this dialog
    launches other platforms depending on the modeling types (continuous or categorical)
    of the variables in the analysis. More'
  merge: -1
  img_proc: true
- pgno: 46
  md: 'information on modeling types is found in “The Modeling Type of Variables,”
    p. 29. Initially, this example consists of three analyses, with Starch Content
    (%) as the Y variable in all of them. Method, Size of Load (lbs), and Sand Blasted?
    are the X variables. All three analyses are requested at the same time to illustrate
    some of JMP Student Edition’s interactive capabilities. These analyses would be
    equally valid if performed separately.


    +   - Select Starch Content (%) from the list of columns and click the Y, Response
    button.

    +   - To select all three X variables, click on Method, hold down the Shift key,
    then click Sand Blasted?.

    +   Note that these dialog boxes respond to dragging as well as button clicks,
    as in the next step.

    +   - Drag these highlighted variables to the box to the right of the X, Factor
    button.

    +   - Click OK.


    Three plots appear as in Figure 3.2.


    # Figure 3.2 Fit Y by X Results


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_46_0.png)


    On the far left and far right, dot plots of each level of a nominal variable are
    plotted side by side, a situation leading to one-way ANOVAs. In the middle plot,
    JMP Student Edition produces a scatterplot of two continuous variables, a situation
    leading to fitting lines and curves.


    # Computing a t-test


    As a simple example, examine the plot on the far right, relating starch content
    to whether the fabric was sand blasted or not. Is the starch content different
    for the two levels of Sand Blasted? This is a typical situation examined with
    a two-sample t-test. To conduct the t-test,


    +   - Select t test from the drop-down menu in the plot’s title bar.


    The t-test report appears in the outline beneath the plot labeled t test.


    # Figure 3.3 t-test Results


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_46_1.png)


    Some things should be noticed about this report.'
  merge: -1
  img_proc: true
- pgno: 47
  md: '+   There is a statement on the second line of the t-test report that says
    “Assuming unequal variances”. This test is also known as the unpooled t-test.
    If you want the pooled version (where the variances are assumed to be equal),
    select the Means/Anova/Pooled t command.


    Select the Means/Anova/Pooled t command from the report’s drop-down menu.


    +   The plot gets embellished with means diamonds, and other text tables. All
    of these are discussed later in this tutorial in “Analysis of Variance (anova),”
    p. 50. Here, note that the p-value for the unpooled t-test is listed beside Prob>|t|
    in the original t test report. Notice that this is the same value as listed in
    the new Analysis of Variance report in the column labeled Prob>F. In essence,
    JMP Student Edition has tested the same hypothesis twice, with two different methods,
    and both methods agree (as they always should!). In fact, the square of the t
    statistic (listed under t-Test) is equal to the value of the F statistic (listed
    in the ANOVA table as F Ratio).


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_47_0.png)


    From the drop-down menu in the Oneway Analysis title bar, select Means/Anova/t
    test to remove the pooled t report.


    +   This is a two sample t-test, not a matched pairs t-test. If the data from
    the two groups have a natural pairing (for example, the before-and-after measurements
    of a patient taking an experimental medication), use the Matched Pairs platform.
    Details on matched pairs are found in “The Matched Pairs Platform,” p. 71 in the
    “The Matched Pairs Platform” chapter.


    # Pooled t test


    Now, examine the plot on the left side in the report in Figure 3.2, of Starch
    Content (%) vs. Method. Denim washed with Alpha Amalyze appears to have a lower
    starch content than denim washed with'
  merge: -1
  img_proc: true
- pgno: 48
  md: 'Caustic Soda or Pumice Stone. For more specificity, it is helpful to look at
    text reports of these results, examining the mean, median, standard deviation,
    and quantiles for the three levels of the Method variable, which are produced
    as follows.


    From the drop-down menu in the Oneway Analysis title bar, select Quantiles.


    Text reports appear below the plot, and box plots are superimposed on the plot.
    For details on box plots, see the section titled “Quantile Box Plots,” p. 32,
    or the online help.


    From the same drop-down menu, select Means and Std Dev.


    In addition to the new text reports, mean error bars and standard deviation lines
    appear on the plot. Box plots are superimposed on the plot, giving clues to the
    underlying distribution of each level. Details on these additions are found in
    “One Way anova—The Continuous by Categorical Case,” p. 61.


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_48_0.png)


    These additions can also be removed.


    In the same drop-down menu, select Quantiles and Means and Std Dev again.


    # Selecting and Marking Points


    This plot is not only useful for computing results, but also for selecting results
    in other plots.


    Select the Lasso tool from the Tools toolbar, as shown in Figure 3.4.


    Figure 3.4 Lasso Tool


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_48_1.png)


    The Lasso tool is used to draw curves around points. The “captured” points become
    selected.'
  merge: -1
  img_proc: true
- pgno: 49
  md: 'While holding down the mouse button, drag the Lasso tool completely around
    the points for Alpha Amalyze, as shown in Figure 3.5.


    Release the mouse button.


    # Figure 3.5 Selecting Points with the Lasso Tool


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_49_0.png)


    JMP Student Edition briefly flashes how many points are contained in the selection
    region (32 in this case) and selects the points. Notice that these points are
    highlighted in all the plots, and in the data table. The Lasso tool works with
    all plots that show individual points, like scatterplots and leverage plots.


    To make these points distinctive, assign them a unique color and marker.


    With the points selected, right-click inside the plot, select Row Colors from
    the popup menu, and choose a red color from the color palette.


    The Alpha Amalyze points turn red in all the plots.


    Again, right-click inside the plot and select Row Markers. Select the small triangle
    from the markers palette.


    The Alpha Amalyze points change to the triangle in all the plots.


    In fact, there is an easier way to change the colors and markers of points in
    a plot if there is a certain column that divides up the data. For example, suppose
    that plots are needed that clearly distinguish the three levels of the Method
    variable. To mark all the data at once,


    From the Rows menu, select Color or Mark by Column.


    In the resulting dialog box, select Method from the list of variables. Make sure
    that the Set Color by Value, Set Marker by Value, and Make Window with Legend
    checkboxes are checked.


    Unique colors and markers are assigned to each level of the Method variable in
