- pgno: 86
  md: '+   - **Freq**, an optional role that identifies a column whose values designate
    the frequency of rows in the analysis


    # Model Effects


    Effects are added to the model by using the buttons in the **Construct Model Effects**
    section of the dialog.


    To add a simple regressor to the model, select the variable name and click the
    **Add** button.


    To add a crossed effect to a model, select the two variables to be crossed (use
    Control-click or ⌘-click for multiple selections) in the **Select Columns** list
    and click the **Cross** button.


    When levels of an effect (call it B) only occur within a single level of an effect
    (call it A), then B is said to be *nested* within A, and A is called the *outside
    effect*. To add a nested effect,


    +   - Select the outside effects in the column selection list and click **Add**
    or **Cross**.

    +   - When the outside effect appears in the Model Effects list, select it again.

    +   - Select the nested variable in the column selection list and click **Nest**.


    # Macros


    Common models can be generated using the macros drop-down list.


    Figure 5.5 Macros drop-down list


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_86_0.png)


    The following models are available:


    # Full Factorial


    To look at many crossed factors, such as in a factorial design, use **Full Factorial**.
    It creates the set of effects corresponding to all crossings of all variables
    selected in the columns list. For example, with selected variables A, B, and C,
    the **Full Factorial** selection places A, B, C, A*B, A*C, B*C, and A*B*C in the
    Model Effects list.


    # Factorial to Degree


    To create a limited factorial, select **Factorial to Degree** and enter the degree
    of interactions in the **Degree** box. A second degree factorial is a very common
    analysis.'
  merge: -1
  img_proc: true
- pgno: 87
  md: '# ## Factorial Sorted


    The **Factorial Sorted** selection creates the same set of effects as **Full Factorial**,
    but lists them in order of degree. All main effects are listed first, followed
    by all two-way interactions, then all three-way interactions, and so forth.


    # ## Response Surface


    *Response surface models* find the values of the terms that produce a maximum
    or a minimum expected response. This is accomplished by fitting a collection of
    terms in a quadratic model. The critical values for the surface are calculated
    from the parameter estimates and presented with a report on the shape of the surface.


    To specify a Response Surface effect, select the variable name, then select **Response
    Surface Effect** from the **Attributes** menu. Response surface effects appear
    with an ampersand (&) appended to their name.


    # ## Mixture Response Surface


    *Mixture response surface variables* are selected in the same way as Response
    Surface Effect variables. Select **Mixture Response Surface** from the **Attributes**
    menu after selecting a variable name.


    # ## Polynomial to Degree


    *Polynomial effects* are a series of terms that are powers of a single variable.
    To specify a polynomial effect,


    +   - click one or more variables in the column selection list

    +   - enter the degree of the polynomial in the **Degree** box

    +   - select the **Polynomial to Degree** command in the **Macros** popup menu.


    # ## Scheffe Cubic


    Cubic Models are an advanced topic not usually covered in an advanced course.
    See the JMP help if you are interested in Scheffe cubics.


    # ## Fitting Personalities


    The three available personalities for model fitting are available in the Personality
    drop-down list, shown in Figure 5.6.


    **Figure 5.6**  Fitting Personalities


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_87_0.png)


    +   - **Standard Least Squares** models one or more continuous responses in the
    usual way through fitting a linear model by least squares.

    +   - **Stepwise** regression is an approach to selecting a subset of effects
    for a regression model. The **Stepwise** feature computes estimates that are the
    same as those of the **Standard Least Squares**'
  merge: -1
  img_proc: true
