- pgno: 135
  md: '# Cumulative Sum (Cusum) Charts


    Cumulative Sum (Cusum) charts display cumulative sums of subgroup or individual
    measurements from a target value. Cusum charts are graphical and analytical tools
    for deciding whether a process is in a state of statistical control and for detecting
    a shift in the process mean.


    JMP cusum charts can be one-sided, which detect a shift in one direction from
    a specified target mean, or two-sided to detect a shift in either direction. Both
    charts can be specified in terms of geometric parameters (h and k described in
    Figure 7.21); two-sided charts allow specification in terms of error probabilities
    α and β.


    To interpret a two-sided Cusum chart, you compare the points with limits that
    compose a V-mask. A V-mask is formed by plotting V-shaped limits. The origin of
    a V-mask is the most recently plotted point, and the arms extended backward on
    the x-axis, as in Figure 7.21. As data are collected, the cumulative sum sequence
    is updated and the origin is relocated at the newest point.


    Figure 7.21 Illustration of a V-Mask for a Two-Sided Cusum Chart


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_135_0.png)


    Shifts in the process mean are visually easy to detect on a cusum chart because
    they produce a change in the slope of the plotted points. The point where the
    slope changes is the point where the shift occurs. A condition is out-of-control
    if one or more of the points previously plotted crosses the upper or lower arm
    of the V-mask. Points crossing the lower arm signal an increasing process mean,
    and points crossing the upper arm signal a downward shift.


    There are major differences between cusum charts and other control (Shewhart)
    charts:


    +   - A Shewhart control chart plots points based on information from a single
    subgroup sample. In cusum charts, each point is based on information from all
    samples taken up to and including the current subgroup.

    +   - On a Shewhart control chart, horizontal control limits define whether a
    point signals an out-of-control condition. On a cusum chart, the limits can be
    either in the form of a V-mask or a horizontal decision interval.'
  merge: -1
  img_proc: true
- pgno: 136
  md: '+   • The control limits on a Shewhart control chart are commonly specified
    as 3σ limits. On a cusum chart, the limits are determined from average run length,
    from error probabilities, or from an economic design.


    A cusum chart is more efficient for detecting small shifts in the process mean.
    Lucas (1976) comments that a V-mask detects a 1σ shift about four times as fast
    as a Shewhart control chart.


    # Launch Options for Cusum Charts


    When you choose Graph > Control Charts > Cusum, the Control Charts Launch dialog
    appears, including appropriate options and specifications as shown here.


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_136_0.png)


    Note: The following items pertain only to cusum charts:


    # Two Sided


    requests a two-sided cusum scheme when checked. If it is not checked, a one-sided
    scheme is used and no V-mask appears. If an H value is specified, a decision interval
    is displayed.


    # Data Units


    specifies that the cumulative sums be computed without standardizing the subgroup
    means or individual values so that the vertical axis of the cusum chart is scaled
    in the same units as the data.


    Note: Data Units requires that the subgroup sample size be designated as constant.


    # Beta


    specifies the probability of failing to discover that the specified shift occurred.
    Beta is the probability of a Type II error and is available only when you specify
    Alpha.


    # H


    is the vertical distance h between the origin for the V-mask and the upper or
    lower arm of the V-mask for a two-sided scheme. When you click H, the Beta entry
    box is labeled K. You also enter a value for the increase in the lower V-mask
    per unit change on the subgroup axis (See Figure 7.26). For a one-sided scheme,
    H is the decision interval. Choose H as a multiple of the standard error.


    # Specify Stats


    appends the panel shown here to the Control Charts Launch dialog, which lets you
    enter the process variable specifications.'
  merge: -1
  img_proc: true
- pgno: 137
  md: '![](img/a858f3b35ed4923af65c22e8829ee5a8_137_0.png)


    # Target


    is the target mean (goal) for the process or population. The target mean must
    be scaled in the same units as the data.


    # Delta


    specifies the absolute value of the smallest shift to be detected as a multiple
    of the process standard deviation or of the standard error, depending on whether
    the shift is viewed as a shift in the population mean or as a shift in the sampling
    distribution of the subgroup mean, respectively. Delta is an alternative to the
    Shift option (described next). The relationship between Shift and Delta is given
    by


    δ = Δ / (σ / (√n))


    where δ represents Delta, Δ represents the shift, σ represents the process standard
    deviation, and n is the (common) subgroup sample size.


    # Shift


    is the minimum value you want to detect on either side of the target mean. You
    enter the shift value in the same units as the data, and you interpret it as a
    shift in the mean of the sampling distribution of the subgroup mean. You can choose
    either Shift or Delta.


    # Sigma


    specifies a known standard deviation, σ₀, for the process standard deviation,
    σ. By default, the Control Chart platform estimates sigma from the data. You can
    use Sigma instead of the Alpha option on the Control Charts Launch dialog.


    # Head Start


    specifies an initial value for the cumulative sum, S₀, for a one-sided cusum scheme
    (S₀ is usually zero). Enter Head Start as a multiple of standard error.


    # Cusum Chart Options


    Cusum charts have these options (in addition to standard chart options).


    # Show Points


    shows or hides the sample data points.


    # Connect Points


    connects the sample points with a straight line.'
  merge: -1
  img_proc: true
- pgno: 138
  md: '# Mask Color


    displays the JMP color palette for you to select a line color for the V-mask.


    # Connect Color


    displays the JMP color palette for you to select a color for the connect line
    when the **Connect Points** option is in effect.


    # Center Line Color


    displays the JMP color palette for you to select a color for the center line.


    # Show Shift


    shows or hides the shift you entered, or center line.


    # Show V Mask


    shows or hides the V-mask based on the parameters (statistics) specified on the
    Control Charts Launch dialog when Cusum is selected as the Chart Type.


    # Show Parameters


    displays a Parameters table (see Figure 7.26) that summarizes the Cusum charting
    parameters.


    # Show ARL


    displays the average run length (ARL) information.


    # Example 1. Two-Sided Cusum Chart with V-mask


    To see an example of a two-sided cusum chart, open the Oil1 Cusum.jmp file from
    the Quality Control sample data folder. A machine fills 8-ounce cans of two-cycle
    engine oil additive. The filling process is believed to be in statistical control.
    The process is set so that the average weight of a filled can, μ₀, is 8.10 ounces.
    Previous analysis shows that the standard deviation of fill weights, σ₀, is 0.05
    ounces.


    Subgroup samples of four cans are selected and weighed every hour for twelve hours.
    Each observation in the Oil1 Cusum.jmp data table contains one value of weight
    along with its associated value of hour. The observations are sorted so that the
    values of hour are in increasing order. The Control Chart platform assumes that
    the data are sorted in increasing order.


    A two-sided cusum chart is used to detect shifts of at least one standard deviation
    in either direction from the target mean of 8.10 ounces.


    To create a Cusum chart for this example,


    +   - Choose the **Graph > Control Chart > CUSUM** command.

    +   - Click the **Two Sided** check box if it is not already checked.

    +   - Specify weight as the Process variable.

    +   - Specify hour as the Sample Label.

    +   - Click the **H** radio button and enter 2 into the text box.'
  merge: -1
