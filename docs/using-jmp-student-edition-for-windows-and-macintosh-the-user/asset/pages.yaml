- pgno: 158
  md: '# Linear (Holt) Exponential Smoothing


    The model for linear exponential smoothing is $y_t = \mu_t + \beta_t t + a_t$.


    The smoothing equations defined in terms of smoothing weights $\alpha$ and $\gamma$
    are


    $L_t = \alpha y_t + (1-\alpha)(L_{t-1}+T_{t-1})$ and $T_t = \gamma(L_t - L_{t-1})
    + (1-\gamma)T_{t-1}$


    This model is equivalent to an ARIMA(0, 2, 2) model where


    $(1-B)^2 y_t = (1-\theta B - \theta_2 B^2)a_t$ with $\theta = 2 - \alpha - \alpha\gamma$
    and $\theta_2 = \alpha - 1$.


    The moving average form of the model is


    $y_t = a_t + \sum_{j=1}^{\infty} (\alpha + j\alpha\gamma)a_{t-j}$


    # Damped-Trend Linear Exponential Smoothing


    The model for damped-trend linear exponential smoothing is $y_t = \mu_t + \beta_t
    t + a_t$.


    The smoothing equations in terms of smoothing weights $\alpha$, $\gamma$, and
    $\varphi$ are


    $L_t = \alpha y_t + (1-\alpha)(L_{t-1} + \varphi T_{t-1})$ and $T_t = \gamma(L_t
    - L_{t-1}) + (1-\gamma)\varphi T_{t-1}$


    This model is equivalent to an ARIMA(1, 1, 2) model where


    $(1-\varphi B)(1-B)y_t = (1-\theta_1 B - \theta_2 B^2)a_t$ with $\theta_1 = 1
    + \varphi - \alpha - \alpha\gamma\varphi$ and $\theta_2 = (\alpha - 1)\varphi$.


    The moving average form of the model is


    $y_t = \alpha_t + \sum_{j=1}^{\infty} \left(\frac{\alpha + \alpha\gamma\varphi(\varphi^{j}
    - 1)}{\varphi - 1}\right) \alpha_{t-j}$


    # Seasonal Exponential Smoothing


    The model for seasonal exponential smoothing is $y_t = \mu_t + s(t) + a_t$.


    The smoothing equations in terms of smoothing weights $\alpha$ and $\delta$ are


    $L_t = \alpha(y_t - S_{t-s}) + (1-\alpha)L_{t-1}$ and $S_t = \delta(y_t - L_{t-s})
    + (1-\delta)\varphi S_{t-s}$'
  merge: -1
  img_proc: true
