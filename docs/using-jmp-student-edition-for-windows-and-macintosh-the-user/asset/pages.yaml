- pgno: 180
  md: '# Results from Platforms


    The results from JMP Student Edition’s platforms can be cut and pasted into other
    programs using the system’s clipboard, through standard cut and paste facilities.
    To copy results into another program,


    +   - Select the Selection tool ( ).

    +   - Hold down the Shift key and click on each part of the report that needs
    to be copied. Note that axes frequently need to be selected in addition to the
    graphs they accompany.

    +   - Select Edit > Copy.

    +   - In the word processor, select Edit > Paste.


    # The Chart Platform


    The Chart platform computes and plots data and statistics about the data. Unlike
    the statistical platforms in JMP, the Chart platform is not intended as an exploratory
    device. It is used to report the results from other explorations. For that reason,
    the plots in the Chart platform do not “bristle with interactivity” to the degree
    that other platforms do. In essence, what is going to be reported should be known
    before the Chart platform is used.


    To plot descriptions of data, complete the following steps after bringing up the
    Chart launch dialog (Figure 10.7)


    Figure 10.7 Chart Launch Dialog


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_180_0.png)


    +   - Select the data column in the column list.

    +   - Click the Statistics button (revealing the menu shown in Figure 10.8) and
    select the statistic to be charted.

    +   - From the section labeled Options, use the drop-down list to select the orientation
    of the chart (vertical or horizontal) and the type of chart (bar, line, pie, needle,
    or point chart) to be generated.


    Don’t worry too much about getting the orientation and chart type correct initially
    — they can be changed after the chart has been generated.'
  merge: -1
  img_proc: true
