    # Nonparametric Correlations


    When you select Nonparametric Correlations from the platform popup menu, the Nonparametric
    Measures of Association table is shown. The Nonparametric submenu offers these
    three nonparametric measures:


    +   - **Spearman''s Rho** is a correlation coefficient computed on the ranks of
    the data values instead of on the values themselves.

    +   - **Kendall''s Tau** is based on the number of concordant and discordant pairs
    of observations. A pair is concordant if the observation with the larger value
    of X also has the larger value of Y. A pair is discordant if the observation with
    the larger value of X has the smaller value of Y. There is a correction for tied
    pairs (pairs of observations that have equal values of X or equal values of Y).

    +   - **Hoeffding''s D** is a statistical scale that ranges from −0.5 to 1, with
    large positive values indicating dependence. The statistic approximates a weighted
    sum over observations of chi-square statistics for two-by-two classification tables,
    and detects more general departures from independence.


    The Nonparametric Measures of Association report also shows significance probabilities
    for all measures and compares them with a bar chart similar to the one in Figure
    9.3.


    See “Computations and Statistical Details,” p. 169, for computational information.'
