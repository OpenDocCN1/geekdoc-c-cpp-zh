- pgno: 17
  md: '# Figure 1.10 The Distribution Dialog


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_17_0.png)


    Select the variable Starch Content (%), then click the Y, Columns button.


    This step tells JMP Student Edition the variable to analyze. Since Starch Content
    (%) is the only variable of interest, we are finished with this dialog.


    Click OK.


    The report is presented in its default vertical format. However, some people prefer
    a horizontal layout for the Distribution report. To change the layout to horizontal,


    Click on the red triangle next to the word Starch Content (%) in the report (see
    Figure 1.11).


    # Figure 1.11 Red Triangles Reveal Popup Menus


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_17_1.png)


    All of these red triangles reveal popup menus when they are clicked. Watch closely
    for them—they reveal further options and explorations available during the data
    exploration process. The menu next to Starch Content (%) shows the options for
    this single variable, although there are cases (seen later) where the Distribution
    platform operates on several variables. Options available to all the variables
    in the report are in the menu next to the word Distributions.


    Select Display Options > Horizontal Layout to see the report in Figure 1.12.'
