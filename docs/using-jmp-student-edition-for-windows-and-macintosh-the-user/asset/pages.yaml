    The Response Surface designer provides the following types of designs:


    # Box-Behnken Designs


    The Box-Behnken design has only three levels per factor and has no points at the
    vertices of the cube defined by the ranges of the factors. This is sometimes useful
    when it is desirable to avoid extreme'
