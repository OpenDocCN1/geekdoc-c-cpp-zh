- pgno: 147
  md: 'The expected reduction in spikes did not occur, so an MA(1) is not an appropriate
    model. A second model, an MA(2), can be run in the same way.


    +   - Select **ARIMA** from the platform menu.

    +   - Enter a 2 beside **q, Moving Average Order**.

    +   - Click **Estimate**.


    Similar unsatisfactory results appear. However, note that JMP is accumulating
    a list of models, along with appropriate fit statistics, in the **Model Comparison**
    table.


    # Figure 8.6  Model Comparison Table


    | Model | DF | Variance | AIC | SBC | RSquare | -2LogLH |

    |---|---:|---:|---:|---:|---:|---:|

    | MA(1) | 142 | 0.011726 | -638.2299 | -632.2903 | 0.673 | -637.2532 |

    | MA(2) | 141 | 0.0098454 | -662.4197 | -653.5102 | 0.727 | -662.7299 |


    Examine the $R^2$ for the two models in this table. In fact, the MA(2) is a *worse*
    fit than the MA(1). Some reflection is necessary.


    # The Time Series Platform


    First, assign columns for analysis with the dialog in Figure 8.1. The selector
    list at the left of the dialog shows all columns in the current table. To cast
    a column into a role, select one or more columns in the column selector list and
    click a role button. Or, drag variables from the column selector list to one of
    the following role boxes:


    +   - **X, Time ID** for the x-axis, one variable used for labeling the time axis

    +   - **Y, Time Series** for the y-axis, one or more time series variables.


    To remove an unwanted variable from an assigned role, select it in the role box
    and click **Remove**. After assigning roles, click **OK** to see the analysis
    for each time series variable versus the time ID.


    You set the number of lags for the autocorrelation and partial autocorrelation
    plots in the **Autocorrelation Lags** box. This is the maximum number of periods
    between points used in the computation of the correlations. It must be more than
    one but less than the number of rows. A commonly used rule of thumb for the maximum
    number of lags is $n/4$, where $n$ is the number of observations. The **Forecast
    Periods** box allows you to set the number of periods into the future that the
    fitted models are forecast. By default, JMP uses 25 lags and 25 forecast periods.


    # The Time Series Graph


    The Time Series platform begins with a plot of each times series by the time ID,
    or row number if no time ID is specified (Figure 8.7). The plot, like others in
    JMP, has features to resize the graph, highlight points with the cursor or brush
    tool, and label points.'
  merge: -1
  img_proc: true
- pgno: 148
  md: '# Figure 8.7 Time Series Plot of Seriesg (Airline Passenger) Data


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_148_0.png)


    By default, graphs of the autocorrelation and partial autocorrelation (Figure
    8.5) of the time series are also shown, but can be hidden with commands from the
    platform popup menu on the Time Series title bar.


    The platform popup menu, discussed next, also has fitting commands and options
    for displaying additional graphs and statistical tables.


    # Time Series Commands


    The popup menu next to the time series name has the commands shown here.


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_148_1.png)


    The first three items in this menu control the descriptive and diagnostic graphs
    and tables. These are typically used to determine the nature of the model to be
    fitted to the series.


    The ARIMA and Smoothing Model commands are for fitting various models to the data
    and producing forecasts. You can select the model fitting commands repeatedly.
    The result of each new fit is appended to the report. After the first model has
    been fit, a summary of all the models is inserted just above the first model report
    (an example is shown in “Model Comparison Table,” p. 151).


    The following sections describe options and model fits, discuss statistical results,
    and cover additional platform features.'
  merge: -1
  img_proc: true
- pgno: 149
  md: '# Graph


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_149_0.png)


    The Time Series platform begins by showing a time series plot, like the one shown
    previously in Figure 8.7. The Graph command on the platform popup menu has a submenu
    of controls for the time series plot with the following commands.


    +   - Time Series Graph hides or displays the time series graph.

    +   - Show Points hides or displays the points in the time series graph.

    +   - Connecting Lines hides or displays the lines connecting the points in the
    time series graph.

    +   - Mean Line hides or displays a horizontal line in the time series graph that
    depicts the mean of the time series.


    # Autocorrelation


    The Autocorrelation command alternately hides or displays the autocorrelation
    graph of the sample, often called the sample autocorrelation function. This graph
    describes the correlation between all the pairs of points in the time series with
    a given separation in time or lag. By definition, the first autocorrelation (lag
    0) always has length 1.


    In addition, confidence curves show twice the large-lag standard error (± 2 standard
    errors). The autocorrelation plot for the Seriesg data is shown on the left in
    Figure 8.8. You can examine the autocorrelation and partial autocorrelations plots
    to determine whether the time series is stationary (meaning it has a fixed mean
    and standard deviation over time) and what model might be appropriate to fit the
    time series.


    # Partial Autocorrelation


    The Partial Autocorrelation command alternately hides or displays the graph of
    the sample partial autocorrelations. The plot on the right in Figure 8.8 shows
    the partial autocorrelation function for the Seriesg data. The solid black lines
    represent ± 2 standard errors for approximate 95% confidence limits'
  merge: -1
  img_proc: true
- pgno: 150
  md: 'Figure 8.8 Autocorrelation and Partial Correlation Plots


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_150_0.png)


    # Number of Forecast Periods


    The Number of Forecast Periods command displays a dialog for you to reset the
    number of periods into the future that the fitted models will forecast. The initial
    value is set in the Time Series Launch dialog. All existing and future forecast
    results will show the new number of periods with this command.


    # Modeling Reports


    The time series modeling commands are used to fit theoretical models to the series
    and use the fitted model to predict (forecast) future values of the series. These
    commands also produce statistics and residuals that allow you to ascertain the
    adequacy of the model you have elected to use. You can select the modeling commands
    repeatedly. Each time you select a model, a report of the results of the fit and
    a forecast is added to the platform results.


    The fit of each model begins with a dialog that lets you specify the details of
    the model being fit as well as how it will be fit. Each general class of models
    has its own dialog, as discussed previously in their respective sections. The
    models are fit by maximizing the likelihood function, using a Kalman filter to
    compute the likelihood function. The ARIMA, seasonal ARIMA, and smoothing models
    begin with the following report tables.'
  merge: -1
  img_proc: true
- pgno: 151
  md: '# Model Comparison Table


    | Model | DF | Variance | AIC | SBC | RSquare | -2LogLH |

    |---|---|---|---|---|---|---|

    | AR(1) | 142 | 1134.3871 | 1014.8601 | 1020.7997 | 0.922 | 1013.5251 |

    | MA(1) | 142 | 4264.6121 | 1205.5533 | 1211.4829 | 0.703 | 1204.2083 |

    | ARMA(1,1) | 141 | 989.13835 | 996.11244 | 1005.0219 | 0.932 | 993.09397 |

    | ARIMA(1,1,1) | 140 | 978.9437 | 987.73389 | 996.62242 | 0.932 | 982.30512 |


    The Model Comparison table summarizes the fit statistics for each model. You can
    use it to compare several models fitted to the same time series. Each row corresponds
    to a different model. The numerical values in the table are drawn from the Model
    Summary table for each fitted model. The Model Comparison table shown above summarizes
    the ARIMA models (1, 0, 0), (0, 0, 1), and (1, 0, 1) respectively.


    # Model Summary Table


    Each model fit generates a Model Summary table, which summarizes the statistics
    of the fit. In the formulae below, n is the number of nonmissing observations
    and k is the number of fitted parameters in the model.


    +   - **DF** is the number of degrees of freedom in the fit, n − k.

    +   - **Sum of Squared Errors** is the sum of the squares of the prediction errors,
    SSE.

    +   - **Variance Estimate** is the unconditional sum of squares (SSE) divided
    by the number of degrees of freedom, SSE / (n − k). This is the sample estimate
    of the variance of the random shocks a_t described in the section “ARIMA Model,”
    p. 154.

    +   - **Standard Deviation** is the square root of the variance estimate. This
    is a sample estimate of the standard deviation of a_t, the random shocks

    +   - **Akaike’s Information Criterion [AIC], Schwartz’s Bayesian Criterion [SBC
    or BIC]** are goodness of fit statistics, detailed in the online help. Smaller
    values of these criteria indicate better fit.

    +   - **RSquare** and **RSquare Adj** are also goodness of fit statistics, where
    values closer to 1 indicate a better fit.

    +   - **−2LogLikelihood** is minus two times the natural log of the likelihood
    function evaluated at the best-fit parameter estimates. Smaller values are better
    fits.

    +   - **Stable** indicates whether the autoregressive operator is stable. That
    is, whether all the roots of φ(z) = 0 lie outside the unit circle.

    +   - **Invertible** indicates whether the moving average operator is invertible.
    That is, whether all the roots of θ(z) = 0 lie outside the unit circle.


    **Note:** The φ and θ operators are defined in the section “ARIMA Model,” p. 154.'
  merge: -1
  img_proc: true
- pgno: 152
  md: '# Parameter Estimates Table


    | Term | Lag | Estimate | Std Error | t Ratio | Prob>|t| | Constant Estimate |

    |---|---|---|---|---|---|---|

    | AR1 | 1 | -0.4767619 | 0.1152473 | -4.14 | <.0001* | 3.61907311 |

    | MA1 | 1 | -0.864542 | 0.0713742 | -12.11 | <.0001* |  |

    | Intercept | 0 | 2.45068156 | 3.2495581 | 0.75 | 0.4520 |  |


    There is a Parameter Estimates table for each selected fit, which gives the estimates
    for the time series model parameters. Each type of model has its own set of parameters.
    They are described in the sections on specific time series models. The Parameter
    Estimates table has these terms:


    +   - **Term** lists the name of the parameter. These are described below for
    each model type. Some models contain an *intercept* or mean term. In those models,
    the related *constant estimate* is also shown. The definition of the constant
    estimate is given under the description of ARIMA models.


    +   - **Factor** (Seasonal ARIMA only) lists the factor of the model that contains
    the parameter. This is only shown for multiplicative models. In the multiplicative
    seasonal models, Factor 1 is nonseasonal and Factor 2 is seasonal.


    +   - **Lag** lists the degree of the lag or backshift operator that is applied
    to the term to which the parameter is multiplied.


    +   - **Estimate** lists the parameter estimates of the time series model.


    +   - **Std Error** lists the estimates of the standard errors of the parameter
    estimates. They are used in constructing tests and confidence intervals.


    +   - **t Ratio** lists the test statistics for the hypotheses that each parameter
    is zero. It is the ratio of the parameter estimate to its standard error. If the
    hypothesis is true, then this statistic has an approximate Student’s t-distribution.
    Looking for a t-ratio greater than 2 in absolute value is a common rule of thumb
    for judging significance because it approximates the 0.05 significance level.


    +   - **Prob>|t|** lists the observed significance probability calculated from
    each t-ratio. It is the probability of getting, by chance alone, a t-ratio greater
    (in absolute value) than the computed value, given a true hypothesis. Often, a
    value below 0.05 (or sometimes 0.01) is interpreted as evidence that the parameter
    is significantly different from zero.


    The Parameter Estimates table also gives the Constant Estimate, for models that
    contain an intercept or mean term. The definition of the constant estimate is
    given under “ARIMA Model,” p. 154.'
  merge: -1
  img_proc: true
- pgno: 153
  md: '# Forecast Plot


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_153_0.png)


    Each model has its own Forecast plot. The Forecast plot shows the values that
    the model predicts for the time series. It is divided by a vertical line into
    two regions. To the left of the separating line the one-step-ahead forecasts are
    shown overlaid with the input data points. To the right of the line are the future
    values forecast by the model and the confidence intervals for the forecasts.


    You can control the number of forecast values by changing the setting of the **Forecast
    Periods** box in the platform launch dialog or by selecting **Number of Forecast
    Periods** from the Time Series drop-down menu. The data and confidence intervals
    can be toggled on and off using the **Show Points** and **Show Confidence Interval**
    commands on the model’s popup menu.


    # Residuals


    The graphs under the residuals section of the output show the values of the residuals
    based on the fitted model. These are the actual values minus the one-step-ahead
    predicted values. In addition, the autocorrelation and partial autocorrelation
    of these residuals are shown. These can be used to determine whether the fitted
    model is adequate to describe the data. If it is, the points in the residual plot
    should be normally distributed about the zero line and the autocorrelation and
    partial autocorrelation of the residuals should not have any significant components
    for lags greater than zero.


    # Iteration History


    The model parameter estimation is an iterative procedure by which the log-likelihood
    is maximized by adjusting the estimates of the parameters. The iteration history
    for each model you request shows the value of the likelihood function for each
    iteration. This can be useful for diagnosing problems with the fitting procedure.
    Attempting to fit a model which is poorly suited to the data can result in a large
    number of iterations that fail to converge on an optimum value for the likelihood.'
  merge: -1
  img_proc: true
- pgno: 154
  md: '# Model Report Options


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_154_0.png)


    The title bar for each model you request has the popup menu shown to the right,
    with the following options for that model:


    **Show Points** hides or shows the data points in the forecast graph.


    **Show Confidence Interval** hides or shows the confidence intervals in the forecast
    graph.


    **Save Columns** creates a new data table with columns representing the results
    of the model.


    **Residual Statistics** controls which displays of residual statistics are shown
    for the model. These displays are described in the section “Time Series Commands,”
    p. 148; however, they are applied to the residual series (the one-step-ahead model
    predictions minus the input series).


    # ARIMA Model


    An **A**uto**R**egressive **I**ntegrated **M**oving **A**verage (ARIMA) model
    predicts future values of a time series by a linear combination of its past values
    and a series of errors (also known as *random shocks* or *innovations*). The ARIMA
    command performs a maximum likelihood fit of the specified ARIMA model to the
    time series.


    For a response series {y_t}, the general form for the ARIMA model is:


    φ(B)(w_t − μ) = θ(B)a_t


    where

    t is the time index

    B is the backshift operator defined as B y_t = y_{t−1}

    w_t = (1 − B)^d y_t is the response series after differencing

    μ is the intercept or mean term.

    φ(B) and θ(B), respectively, the autoregressive operator and the moving average
    operator and are written

    φ(B) = 1 − φ_1 B − φ_2 B^2 − … − φ_p B^p and θ(B) = 1 − θ_1 B − θ_2 B^2 − … −
    θ_q B^q

    a_t are the sequence of random shocks.


    The a_t are assumed to be independent and normally distributed with mean zero
    and constant variance. The model can be rewritten as φ(B)w_t = δ + θ(B)a_t where
    the constant estimate δ is given by the relation'
  merge: -1
  img_proc: true
- pgno: 155
  md: '$\delta = \phi(B)\mu = \mu - \phi_1\mu - \phi_2\mu - \cdots - \phi_p\mu.$


    The ARIMA command displays the Specify ARIMA Model dialog, which allows you to
    specify the ARIMA model you want to fit. The results appear when you click **Estimate**.


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_155_0.png)


    Use the Specify ARIMA Model dialog for the following three orders that can be
    specified for an ARIMA model:


    +   1. The **Autoregressive Order** is the order ($p$) of the polynomial $\phi(B)$
    operator.

    +   2. The **Differencing Order** is the order ($d$) of the differencing operator.

    +   3. The **Moving Average Order** is the order ($q$) of the differencing operator
    $\theta(B)$.

    +   4. An ARIMA model is commonly denoted ARIMA($p,d,q$). If any of $p$, $d$,
    or $q$ are zero, the corresponding letters are often dropped. For example, if
    $p$ and $d$ are zero, then the model would be denoted MA($q$).


    The **Confidence Intervals** box allows you to set the confidence level between
    0 and 1 for the forecast confidence bands. The **Intercept** check box determines
    whether the intercept term $\mu$ will be part of the model. If the **Constrain
    fit** check box is checked, the fitting procedure will constrain the autoregressive
    parameters to always remain within the stable region and the moving average parameters
    within the invertible region. You might want to uncheck this box if the fitter
    is having difficulty finding the true optimum or if you want to speed up the fit.
    You can check the Model Summary table to see if the resulting fitted model is
    stable and invertible.


    # Smoothing Models


    JMP offers a variety of smoothing techniques.


    Smoothing models represent the evolution of a time series by the model:


    $y_t = \mu_t + \beta_t + s(t) + a_t$  where


    +   - $\mu_t$ is the time-varying mean term,

    +   - $\beta_t$ is the time-varying slope term,

    +   - $s(t)$ is one of the $s$ time-varying seasonal terms,

    +   - $a_t$ are the random shocks.'
  merge: -1
  img_proc: true
- pgno: 156
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 157
  md: 'Each smoothing weight can be Bounded, Fixed, or Unconstrained as determined
    by the setting of the popup menu next to the weight''s name.


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_157_0.png)


    The example shown here has the Level weight (α) fixed at a value of 0.3 and the
    Trend weight (γ) bounded by 0 and 1. In this case, the value of the Trend weight
    is allowed to move within the range 0 to 1 while the Level weight is held at 0.3.
    Note that you can specify all the smoothing weights in advance by using these
    custom constraints. In that case, none of the weights would be estimated from
    the data although forecasts and residuals would still be computed. When you click
    Estimate, the results of the fit appear in place of the dialog.


    # Simple Exponential Smoothing


    The model for simple exponential smoothing is $y_t = \mu_t + \alpha_t$.


    The smoothing equation, $L_t = \alpha y_t + (1 - \alpha)L_{t-1}$, is defined in
    terms of a single smoothing weight $\alpha$. This model is equivalent to an ARIMA(0,
    1, 1) model where


    $(1 - B) y_t = (1 - \theta B) \alpha_t$ with $\theta = 1 - \alpha$.


    The moving average form of the model is


    $y_t = a_t + \sum_{i=1}^{\infty} \alpha a_{t-j}$


    # Double (Brown) Exponential Smoothing


    The model for double exponential smoothing is $y_t = \mu_t + \beta_1 t + a_t$.


    The smoothing equations, defined in terms of a single smoothing weight $\alpha$
    are


    $L_t = \alpha y_t + (1 - \alpha)L_{t-1}$ and $T_t = \alpha(L_t - L_{t-1}) + (1
    - \alpha)T_{t-1}$.


    This model is equivalent to an ARIMA(0, 1, 1)(0, 1, 1) model


    $(1 - B)^2 y_t = (1 - \theta B)^2 a_t$ where $\theta_{1,1} = \theta_{2,1}$ with
    $\theta = 1 - \alpha$.


    The moving average form of the model is'
