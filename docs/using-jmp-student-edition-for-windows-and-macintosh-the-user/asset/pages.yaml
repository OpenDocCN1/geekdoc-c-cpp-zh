- pgno: 114
  md: '+   - P, NP, C, and U charts, and Run Charts, have no additional specifications.


    # Parameters


    You specify computations for control limits by entering a value for k (K Sigma)
    or by entering a probability for α(Alpha). There must be a specification of either
    K Sigma or Alpha. The dialog default for K Sigma is 3.


    # K Sigma


    allows specification of control limits in terms of a multiple of the sample standard
    error. K Sigma specifies control limits at k sample standard errors above and
    below the expected value, which shows as the center line. To specify k, the number
    of sigmas, click K Sigma and enter a positive k value into the textbox. The usual
    choice for k is three, which is three standard deviations. The examples shown
    in Figure 7.6 compare the X̄-chart for the Coating.jmp data with control lines
    drawn with K Sigma = 3 and K Sigma = 4.


    Figure 7.6 K Sigma =3 (left) and K Sigma=4 (right) Control Limits


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_114_0.png)


    # Alpha


    specifies control limits (also called probability limits) in terms of the probability
    α that a single subgroup statistic exceeds its control limits, assuming that the
    process is in control. To specify alpha, click the Alpha radio button and enter
    the probability you want. Reasonable choices for α are 0.01 or 0.001


    # Using Specified Statistics


    If you click the Specify Stats (when available) button on the Control Chart Launch
    dialog, a tab with editable fields is appended to the bottom of the launch dialog.
    This lets you enter historical statistics (statistics obtained from historical
    data) for the process variable. The Control Chart platform uses those entries
    to construct control charts. The example here shows 1 as the standard deviation
    of the process variable and 20 as the mean measurement.'
  merge: -1
  img_proc: true
- pgno: 115
  md: '![](img/a858f3b35ed4923af65c22e8829ee5a8_115_0.png)


    Note: When the mean is user-specified, it is labeled in the plot as μ0.


    If you check the Capability option on the Control Chart launch dialog (see Figure
    7.4), a dialog appears as the platform is launched asking for specification limits.
    The standard deviation for the control chart selected is sent to the dialog and
    appears as a Specified Sigma value, which is the default option. After entering
    the specification limits and clicking OK, capability output appears in the same
    window next to the control chart.


    # Tailoring the Horizontal Axis


    When you double-click the x-axis, the X Axis Specification dialog appears for
    you to specify the format, axis values, number of ticks, gridline and reference
    lines to display on the x-axis.


    For example, the Pickles.JMP data lists eight measures a day for three days. In
    this example, by default, the x-axis is labeled at every other tick. Sometimes
    this gives redundant labels, as shown to the left in Figure 7.7. If you specify
    a label at an increment of eight, with seven ticks between them, the x-axis is
    labeled once for each day, as shown in the chart on the right.


    Figure 7.7 Example of Labeled x-Axis Tick Marks


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_115_1.png)


    # Display Options


    Control Charts have popup menus that affect various parts of the platform:


    +   - The menu on the top-most title bar affects the whole platform window. Its
    items vary with the type of chart you select.


    +   - There is a menu of items on the chart type title bar with options that affect
    each chart individually.'
  merge: -1
  img_proc: true
- pgno: 116
  md: '# Single Chart Options


    The popup menu of chart options appears when you click the icon next to the chart
    name, or right-click the chart space.


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_116_0.png)


    # Box Plots


    superimposes box plots on the subgroup means plotted in a Mean chart. The box
    plot shows the subgroup maximum, minimum, 75th percentile, 25th percentile, and
    median. Markers for subgroup means show unless you deselect the Show Points option.
    The control limits displayed apply only to the subgroup mean. The Box Plots option
    is available only for X̄-charts. It is most appropriate for larger subgroup sample
    sizes (more than 10 samples in a subgroup).


    # Needle


    connects plotted points to the center line with a vertical line segment.


    # Connect Points


    toggles between connecting and not connecting the points.


    # Show Points


    toggles between showing and not showing the points representing summary statistics.
    Initially, the points show. You can use this option to suppress the markers denoting
    subgroup means when the Box Plots option is in effect.'
  merge: -1
  img_proc: true
- pgno: 117
  md: '# Figure 7.8 Box Plot Option and Needle Option for Airport.jmp Data


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_117_0.png)


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_117_1.png)


    # Connect Color


    displays the JMP-SE color palette for you to choose the color of the line segments
    used to connect points.


    # Center Line Color


    displays the JMP-SE color palette for you to choose the color of the line segments
    used to draw the center line.


    # Limits Color


    displays the JMP-SE color palette for you to choose the color of the line segments
    used in the upper and lower limits lines.


    # Line Width


    allows you to pick the width of the control lines. Options are Thin, Medium, or
    Thick.


    # Show Center Line


    initially displays the center line in green. Deselecting Show Center Line removes
    the center line and its legend from the chart.


    # Show Control Limits


    toggles between showing and not showing the chart control limits and their legends.


    # Tests


    shows a submenu that enables you to choose which tests to mark on the chart when
    the test is positive. Tests apply only for charts whose limits are 3σ limits.
    Tests 1 to 4 apply to Mean, Individual and attribute charts. Tests 5 to 8 apply
    to Mean charts and Individual Measurement charts only. If tests do not apply to
    a chart, the Tests option is dimmed. Tests apply, but will not appear for charts
    whose control limits vary due to unequal subgroup sample sizes, until the sample
    sizes become equal. These spe-'
  merge: -1
  img_proc: true
- pgno: 118
  md: 'cial tests are also referred to as the Western Electric rules. For more information
    on special causes tests, see “Tests for Special Causes” on page 119 later in this
    chapter.


    # Show Zones


    toggles between showing and not showing the zone lines with the tests for special
    causes. The zones are labeled A, B, and C as shown here in the Mean plot for weight
    in the Coating.jmp sample data. Control Chart tests use the zone lines as boundaries.
    The seven zone lines are set one sigma apart, centered on the center line.


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_118_0.png)


    # Westgard Rules


    are detailed in a later section. See the text and chart in “Westgard Rules,” p.
    122.


    # Test Beyond Limits


    flags as a “*” any point that is beyond the limits. This test works on all charts
    with limits, regardless of the sample size being constant, and regardless of the
    size of k or the width of the limits. For example, if you had unequal sample sizes,
    and wanted to flag any points beyond the limits of an r-chart, you could use this
    command.


    # OC Curve


    gives Operating Characteristic (OC) curves for specific control charts. OC curves
    are defined in JMP-SE only for X̄-, p-, np-, c-, and u-charts. The curve shows
    how the probability of accepting a lot changes with the quality of the sample.
    When you choose the OC Curve option from the control chart option list, JMP-SE
    opens a new window containing the curve, using all the calculated values directly
    from the active control chart. Alternatively, you can run an OC curve directly
    from the QC tab on the JMP-SE Starter window. Select the chart on which you want
    the curve based, then a dialog prompts you for Target, LCL, UCL, K, Sigma, and
    sample size.


    # Window Options


    The popup menu on the window title bar lists options that affect the report window.
    The example menu shown here appears if you request XBar and R at the same time.
    You can check each chart to show or hide it.'
  merge: -1
  img_proc: true
- pgno: 119
  md: '![](img/a858f3b35ed4923af65c22e8829ee5a8_119_0.png)


    The specific options that are available depend on the type of control chart you
    request. Unavailable options show as grayed menu items.


    The following options show for all control charts except Run charts:


    Show Limits Legend shows or hides the Avg, UCL, and LCL values to the right of
    the chart.


    Connect thru Missing connects points when some samples have missing values. The
    left-hand chart in Figure 7.9 is a control chart with no missing points. The middle
    chart has samples 8, 9, and 10 missing with the points not connected. The right-hand
