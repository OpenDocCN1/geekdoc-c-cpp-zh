- pgno: 220
  md: 'points due to engineering considerations. The price of this characteristic
    is the higher uncertainty of prediction near the vertices compared to the central
    composite design.


    # Central Composite Designs


    The response surface design list contains two types of central composite designs:
    *uniform precision* and *orthogonal*. These properties of central composite designs
    relate to the number of center points in the design and to the axial values:


    +   - Uniform precision means that the number of center points is chosen so that
    the prediction variance at the center is approximately the same as at the design
    vertices.

    +   - For orthogonal designs, the number of center points is chosen so that the
    second order parameter estimates are minimally correlated with the other parameter
    estimates.


    # Specifying Axial Value (Central Composite Designs Only)


    When you select a central composite (CCD-Uniform Precision) design and then click
    **Continue**, you see the panel in Figure 13.8. It supplies default axial scaling
    information. Entering 1.0 in the text box instructs JMP to place the axial value
    on the face of the cube defined by the factors, which controls how far out the
    axial points are. You have the flexibility to enter the values you want to use.


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_220_0.png)


    **Figure 13.8** Display and Modify the Central Composite Design


    +   - **Rotatable** makes the variance of prediction depend only on the scaled
    distance from the center of the design. This causes the axial points to be more
    extreme than the range of the factor. If this factor range cannot be practically
    achieved, it is recommended that you choose On Face or specify your own value.

    +   - **Orthogonal** makes the effects orthogonal in the analysis. This causes
    the axial points to be more extreme than the −1 or 1 representing the range of
    the factor. If this factor range cannot be practically achieved, it is recommended
    that you choose On Face or specify your own value.

    +   - **On Face** leaves the axial points at the end of the −1 and 1 ranges.

    +   - **User Specified** uses the value entered by the user, which can be any
    value greater than zero. Enter that value into the Axial Value text box.


    If you would like to inscribe the design, click the box beside **Inscribe**. When
    checked, JMP re-scales the whole design so that the axial points are at the low
    and high ends of the range (the axials are −1 and 1 and the factorials are shrunken
    based on that scaling).'
  merge: -1
  img_proc: true
- pgno: 221
  md: '# Specifying Output Options


    Use the Output Options panel to specify how you want the output data table to
    appear. When the options are correctly set up, click Make Table.


    Figure 13.9 Select the Output Options


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_221_0.png)


    +   - Run Order—Lets you designate the order you want the runs to appear in the
    data table when it is created. Choices are:

    +     - Keep the Same—the rows (runs) in the output table will appear as they
    do in the Design panel.

    +     - Sort Left to Right—the rows (runs) in the output table will appear sorted
    from left to right.

    +     - Randomize—the rows (runs) in the output table will appear in a random
    order.

    +     - Sort Right to Left—the rows (runs) in the output table will appear sorted
    from right to left.

    +     - Randomize within Blocks—the rows (runs) in the output table will appear
    in random order within the blocks you set up.

    +   - Number of Center Points—Specifies additional runs placed at the center points.

    +   - Number of Replicates—Specify the number of times to replicate the entire
    design, including centerpoints. Type the number of times you want to replicate
    the design in the associated text box. One replicate doubles the number of runs.


    # Viewing the Design Table


    Now you have a data table that outlines your experiment, as described in Figure
    13.10.'
  merge: -1
  img_proc: true
- pgno: 222
  md: '# Figure 13.10  The Design Data Table


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_222_0.png)


    The name of the table is the design type that generated it.


    This script allows you to easily fit a model using the values in the design table.


    There are two center points per replicate.


    The column called Pattern identifies the coding of the factors. It shows all the
    codings with “+” for high, “−” for low factor, “a” and “A” for low and high axial
    values, and “0” for midrange. Pattern is suitable to use as a label variable in
    plots because when you hover over a point in a plot of the factors, the pattern
    value shows the factor coding of the point.


    Runs are in a random order.


    The Y column is for recording experimental results.


    # Continuing the Analysis, If Needed


    After creating and viewing the design table, running the experiment, and recording
    your results in the design table’s Y column, run a fit model analysis on the data.
    The data table contains a script labeled **Model**. Right-click it and select
    **Run Script** (Figure 13.11) to fit the model.


    # Figure 13.11  Running the Script


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_222_1.png)


    After clicking **Run Model** in the dialog, (Figure 13.12), review the analysis.'
  merge: -1
  img_proc: true
