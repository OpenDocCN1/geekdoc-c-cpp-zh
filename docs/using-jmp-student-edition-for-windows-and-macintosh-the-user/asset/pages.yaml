- pgno: 177
  md: '![](img/a858f3b35ed4923af65c22e8829ee5a8_177_0.png)


    # Importing Text Files


    You import text be doing one of three things, depending on the operating system
    you are working with.


    # Windows


    Under Microsoft Windows,


    Choose Text from the **Files of Type** drop-down list to import the data based
    on your current preferences.


    Select the **Data With Preview** checkbox to see a preview of an incoming text
    file.


    You then see the dialog shown in Figure 10.5 for specification of delimiters and
    other import details.


    # Macintosh


    On the Macintosh, select a text file to open. This displays the **Open As** menu
    in the lower part of the dialog. Then choose one of the three text commands:


    +   - **Text** opens the file in a simple text editing window

    +   - **Data (Best Guess)** opens the data in a format that JMP thinks is appropriate
