- pgno: 67
  md: 'The popup menu for contingency analyses contains items to turn parts of the
    report on and off. **Mosaic Plot**, **Contingency Table**, and **Tests** all operate
    as toggles. **Display Options > Horizontal Mosaic** rotates the mosaic plot 90
    degrees. The final item, **Script**, is explained in the section “Script Submenu,”
    p. 66.


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_67_0.png)


    The contingency table itself has a popup menu to turn its cell contents on and
    off.


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_67_1.png)


    +   - **Count** is the cell frequency, margin total frequencies, and grand total
    (total sample size).

    +   - **Total %** is the percentage of cell counts and margin totals to the grand
    total.

    +   - **Row %** is the percentage of each cell count to its row total

    +   - **Col %** is the percentage of each cell count to its column total

    +   - **Expected** is the expected frequency of each cell under the assumption
    of independence. It is computed as the product of the corresponding row total
    and column total, divided by the grand total

    +   - **Deviation** is the observed (actual) cell frequency minus the expected
    cell frequency

    +   - **Cell ChiSq** is the Chi Square values computed for each cell as


    $$\frac{(\mathrm{Observed}-\mathrm{Expected})^2}{\mathrm{Expected}}$$


