    Click in the histogram bars for Caustic Soda and Pumice Stone. Look at the corresponding
    points that are highlighted in the Starch Content (%) histogram.


    It is often useful to have confidence intervals on the means or levels in these
    histograms. To get, for example, a 95% confidence interval on the levels of Method
    and Starch Content (%),'
