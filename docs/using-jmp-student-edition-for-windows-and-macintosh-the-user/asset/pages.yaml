- pgno: 28
  md: 'The results of the test are listed in the column labeled Prob>Chisq. This test
    shows some highly significant results (p<0.001), so it is safe to say that the
    three levels occur with different probabilities.


    # Annotating Results


    If these results are to be cut and pasted into a word processing program (for
    a lab report, or to turn in as a homework assignment), there may be some annotation
    necessary. For example, you may wish to annotate the tested probabilities from
    above to state that the results of the test were significant. To add comments
    to any JMP Student Edition output, use the Annotate tool from the Tools toolbar.


    Figure 2.7 The Annotate Tool


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_28_0.png)


    +   Select the Annotate tool, as shown in Figure 2.7.


    +   Click next to the top “0.3333” in the blank space to the right of the Test
    Probabilities table. The initial click point is used in the Tag Line option below.


    +   Type “These results are highly significant” in the box that appears.


    +   Click somewhere outside the annotation box. The annotation turns yellow.


    +   Right-click in the yellow annotation to bring up a formatting menu, shown
    to the right.


    +   Select Tag Line.


    +   Move the mouse over the lower right corner until the cursor turns into a double
    arrow. Click and drag the corner to resize the annotation.


    +   Click and drag inside the annotation box to reposition it with the tag line
    anchored.


    +   Control-click (Windows) or ⌘-click (Macintosh) and drag to move the annotation
    and tag line together.


    The final annotation is shown in Figure 2.8.


    Figure 2.8 Final Annotation


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_28_1.png)


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_28_2.png)'
  merge: -1
  img_proc: true
- pgno: 29
  md: 'Annotations are not preserved in standard (RTF) cut and paste, but are instead
    combined within their respective reports as a single graphic. To paste a report
    with annotations into another document, choose Edit > Paste Special and choose
    one of the graphic formats.


    # The Modeling Type of Variables


    JMP Student Edition bases its reports on the modeling type of the variables it
    analyzes. Variables can have one of three modeling types:


    +   - Continuous variables are numeric and measured on a continuous scale. For
    example, temperature measurements are often on a continuous scale, limited only
    by the exactness of the measuring instrument. In the example data set Denim.jmp,
    the variable Size of Load is a continuous variable.


    +   - Ordinal variables are measured on a discrete scale. There is an implicit
    order in the measuring scale, although the data are not necessarily numerical.
    For example, the age of people is often recorded on an ordinal scale — seldom
    do people report their age as 24.461 years, yet it is obvious that some ages are
    older than others. In the Denim.jmp data set, Thread Wear, with values “low”,
    “moderate”, and “severe”, is an ordinal variable.


    +   - Nominal variables simply name data. There is no order in the scale. People’s
    names, for example, are represented as a nominal variable in JMP Student Edition.
    Method is a nominal variable in the Denim.jmp data set.


    Ordinal and Nominal variables are often referred to collectively as categorical
    variables.


    The modeling type of a variable determines what analyses JMP Student Edition performs.
    Identical platforms often result in different reports and graphs because the variables
    analyzed were of differing types. The Distribution platform shows exactly this
    behavior. It produces histograms in any case, but appends other graphs based on
    variable types.


    Figure 2.9 Distribution Graphs


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_29_0.png)


    +   - Categorical variables show a histogram.'
  merge: -1
  img_proc: true
- pgno: 30
  md: '+   - Continuous variables have an *outlier box plot*, constructed to show
    possible outliers in continuous variables. Outlier plots are discussed in the
    section “Outlier Box Plot,” p. 31.


    # Continuous Variable Graphs and Reports


    Initially, JMP Student Edition produces graphs and text reports to give information
    from the analysis. The text reports for continuous variables summarize typical
    univariate statistics, such as the mean, standard deviation, confidence interval
    on the mean, number of data points, and quantiles.


    The popup menu for continuous variables (Figure 2.10) shows the options available
    for continuous variables.


    Figure 2.10 Continuous Variable Popup Menu


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_30_0.png)


    # Display Options


    The Display Options menu contains the following items:


    +   - **Quantiles** shows or hides the Quantiles table.

    +   - **Moments** shows or hides the Moments table. This table displays the mean,
    standard deviation, standard error of the mean, upper and lower 95% confidence
    limits for the mean, and data set size.

    +   - **More Moments** adds to the Moments table the variable’s sum, variance,
    skewness, kurtosis, and the coefficient of variation.

    +   - **Horizontal Layout** arranges text reports to the right of their corresponding
    graphs and shows the histogram as a horizontal bar chart. Selecting this option
    again returns the report to a vertical layout.


    # Histogram Options


    The Histogram Options menu contains the following items:


    +   - **Histogram** shows or hides the histogram.'
  merge: -1
  img_proc: true
- pgno: 31
  md: '+   - Std Err Bars draws the standard error bar on each level of the histogram.
    The standard error bar automatically adjusts to reflect the histogram''s bar widths
    and positions when you change them using the hand tool.

    +   - Count Axis adds an axis that shows the frequency of each value represented
    by the histogram bars.

    +   - Prob Axis adds an axis that shows the proportion of each value represented
    by histogram bars.

    +   - The Density Axis is the length of the bars in the histogram.


    Any combination of these axes can be added to categorical or continuous histograms.
    As the length of the bars is changed with the hand tool, the Count and Prob axes
    change, but the Density axis remains constant.


    # Normal Quantile Plots


    The Normal Quantile Plot option adds a graph to the report that is used to visualize
    the extent to which the variable is normally distributed. If a variable is normal,
    the normal quantile plot is approximately a diagonal straight line. This kind
    of plot is sometimes also called a quantile-quantile plot, or q-q plot.


    The Normal Quantile plot also shows confidence bounds. If the data fall within
    these confidence bounds, the data are approximately normal.


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_31_0.png)


    # Outlier Box Plot


    The Outlier Box Plot is a schematic that shows the dispersion of a variable. This
    makes the identification of points with extreme values, sometimes called outliers,
    relatively easy.


    The ends of the box are the 25th and 75th quantiles, also called the quartiles.
    The difference between the quartiles is the interquartile range. Outliers are
    often identified as points that fall above the upper quartile + 1.5×(interquartile
    range) or below the lower quartile − 1.5×(interquartile range).


    The line across the middle of the box identifies the median sample value, and
    the means diamond indicates the sample mean and 95% confidence interval.


    The dashed lines in the outlier box plot are sometimes called whiskers, extending
    from both ends of the box. The whiskers extend to the outermost data point that
    falls within the distances computed for judging outliers.


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_31_1.png)'
  merge: -1
  img_proc: true
- pgno: 32
  md: 'The red bracket along the edge of the box identifies the shortest half, the
    smallest length that contains 50% of the data. This is useful when determining
    the shape of underlying distributions.


    # Quantile Box Plots


    The Quantile Box Plot command shows additional quantiles (sometimes called percentiles)
    on the axis of the histogram. If a distribution is normal, the quantiles are approximately
    equidistant from each other. Like the Normal Quantile Plot, the Quantile Box Plot
    is useful for seeing normality in a graphical way. For example, if the quantile
    marks are grouped closely at one end, but have greater spacing at the other end
    (as in this picture), the distribution is skewed toward the end with more spacing.


    Note that the quantile box plot is not the same as the outlier box plot from page
    31. Quantiles are values that divide a distribution into two groups — where the
    pth quantile is larger than p% of the values. For example, half the data are below
    the 50th percentile (median).


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_32_0.png)


    # Stem and Leaf Plots


    The Stem and Leaf command constructs a plot that is essentially a variation on
    the histogram. It was developed for tallying data in the days when computer printouts
    were neither graphical nor easy to produce. They remain useful because they show
    the actual data at the same time as the shape of the data. Each line of the plot
    has a stem value that is the leading digit of a range of column values. The leaf
    values are made from the remaining digits of the values. The data values can be
    reconstructed by joining the stem and leaf (and multiplying by the scale factor,
    if one exists).


    In the example pictured in Figure 2.11, the third line of the table reveals that
    there are data points with values 40 and 41. Values are reconstructed by using
    the legend at the bottom of the plot.


    Figure 2.11 Stem and Leaf Plot


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_32_1.png)


    Stem and leaf plots have similar interactive capabilities to JMP Student Edition’s
    graphics plots, in that they highlight corresponding data points in the data table
    when they are selected in the plot.'
  merge: -1
  img_proc: true
- pgno: 33
  md: '# CDF Plot


    The CDF Plot command plots a cumulative distribution function step plot using
    the observed data (with weights or frequencies if specified). Consult a statistics
    text for a definition of a density function. A CDF plot (Figure 2.12) estimates
    the area under the density curve up to each data point.


    Figure 2.12 CDF Plot for Size of Load


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_33_0.png)


    # Fit Distribution


    The Fit Distribution menu allows you to fit certain distributions (Normal, Lognormal,
    Weibull) to the data. After fitting, you can select among several options, including
    a Goodness of Fit test.


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_33_1.png)'
  merge: -1
  img_proc: true
- pgno: 34
  md: '# Categorical Variable Graphs and Reports


    The only text report that appears by default in categorical distribution reports
    is a frequencies table (Figure 2.13).


    Figure 2.13 Frequencies Table


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_34_0.png)


    This table lists the levels of a categorical variable, the count (sometimes called
    the frequency) of each level, and the probability associated with each variable.
    This probability is simply the ratio of each level''s count to the total count.


    The standard error of these probabilities (StdErr Prob) and the cumulative probabilities
    (Cum Prob) for the data are also computed, but are not initially shown in the
    results table. To see them,


    +   Right-click on the table to bring up a popup menu (Figure 2.14)


    +   Select Columns to reveal a popup menu of all possible columns for the table.


    Tables that are currently shown have a check mark beside them.


    +   Select the column to be shown or hidden.


    Figure 2.14 Table Popup Menu


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_34_1.png)


    The options listed in the drop-down menu for categorical variables (Figure 2.15)
    work the same as those for continuous variables (see “Continuous Variable Graphs
    and Reports,” p. 30.)


    Figure 2.15 Drop-down Menu for Categorical Variables


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_34_2.png)


    # Statistical Tests


    JMP Student Edition contains numerous statistical tests for single variables,
    including:'
  merge: -1
  img_proc: true
- pgno: 35
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 36
  md: '+   - **Prob>|ChiSq|** is the probability of obtaining a greater absolute Chi
    Square value by chance alone when the sample standard deviation is not different
    from the hypothesized value. This is the *p*-value for observed significance of
    the two-tailed *t*-test.

    +   - **Prob>ChiSq** is the probability of obtaining a Chi Square value greater
    than the computed sample Chi Square by chance alone when the sample standard deviation
    is not the hypothesized value. This is the *p*-value for observed significance
    of a one-tailed *t*-test.

    +   - **Prob<ChiSq** is the probability of obtaining a Chi Square value less than
    the computed sample Chi Square by chance alone when the sample standard deviation
    is not the hypothesized value. This is the *p*-value for observed significance
    of a one-tailed *t*-test.


    # Testing Categorical Probabilities


    The **Test Probabilities** option displays the dialog shown in Figure 2.16, where
    hypothesized probabilities are entered. The Likelihood Ratio and Pearson Chi Square
    tests are calculated for those probabilities.


    Figure 2.16 Test Probabilities


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_36_0.png)


    **Test Probabilities** can scale the hypothesized values so that the probabilities
    sum to one. Therefore, the easiest way to test that all the probabilities are
    equal is to enter a one in each field. To test a subset of the probabilities,
    leave the levels that are not involved blank. JMP Student Edition substitutes
    estimated probabilities for those left blank.


    The radio buttons on the dialog allow a choice between rescaling hypothesized
    values to sum to one or using the entered value without rescaling.


    # Confidence Intervals


    For continuous variables, confidence intervals for a mean are automatically displayed
    in the Moments table (Figure 2.17).'
  merge: -1
  img_proc: true
- pgno: 37
  md: '# Figure 2.17 The Moments Table for Continuous Variables


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_37_0.png)


    To calculate confidence intervals for a specific value of α,


    +   Select Confidence Interval from the popup menu next to the variable name in
    the title bar.


    A dialog box appears that lets you specify which confidence interval to display.


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_37_1.png)


    +   Select the desired level to see, for example, 0.95.


    # Figure 2.18 Confidence Intervals for Continuous Variables


    Confidence Intervals

    Parameter | Estimate | Lower CI | Upper CI | 1-Alpha

    Mean | 25.51663 | 23.58055 | 27.45272 | 0.950

    Std Dev | 9.656888 | 8.468259 | 11.23675


    To obtain the equivalent table for categorical variables, select Confidence Interval
    > 0.95. To obtain a confidence interval alpha that is not listed on the Confidence
    Interval menu, select Confidence Interval > Other and enter the desired level.
    An example is shown in Figure 2.19.


    # Figure 2.19 Confidence Intervals for Categorical Variables


    Confidence Intervals

    Level | Count | Prob | Lower CI | Upper CI | 1-Alpha

    Alpha Amalyze | 32 | 0.32653 | 0.241763 | 0.424385 | 0.950

    Caustic Soda | 33 | 0.33673 | 0.250901 | 0.434885

    Pumice Stone | 33 | 0.33673 | 0.250901 | 0.434885

    Total | 98

    Note: Computed using score confidence intervals.


    # Saving Information


    To save information computed from continuous response variables, use the Save
    menu commands. Each command generates a new column in the current data table named
    by appending the response column name (denoted colname in the following definitions)
    to the saved statistic''s name.


    The Save commands can be used repeatedly. This enables the same statistic to be
    saved multiple times under different circumstances, such as before and after combining
    histogram bars. If the Save com-'
  merge: -1
  img_proc: true
- pgno: 38
  md: 'mand is used multiple times, the column name for the statistic is named colname1,
    colname2, and so forth, to create unique column names.


    The Save menu contains the following commands:


    +   - **Level Numbers** creates a new column, called Level colname. The level
    number of each observation corresponds to the histogram bar that contains the
    observation. The histogram bars are numbered from low to high, beginning with
    1.

    +   - **Level Midpoints** creates a new column, called Midpoint colname. The midpoint
    value for each observation is computed by adding half its level width to its lower
    level bound.

    +   - **Ranks** creates a new column called Ranked colname that contains a ranking
    for each of the corresponding column’s values, starting at 1. If there are duplicates
    in the column, they are assigned consecutive ranks in order of their occurrence
    in the spreadsheet.

    +   - **Ranks averaged** creates a new column, called RankAvgd colname. If a value
    is unique, its averaged rank is the same as the rank. If a value occurs k times,
    its average rank is computed as the sum of its value’s ranks divided by k.

    +   - **Prob Scores** creates a new column, called Prob colname. For N non-missing
    scores, the probability score of a value is computed as the averaged rank of that
    value divided by N+1. This column is similar to the empirical cumulative distribution
    function.

    +   - **Normal Quantiles** creates a new column, called N-Quantile colname. These
    normal scores are Van Der Waerden approximations to the expected order statistics
    for the normal distribution.

    +   - **Standardized** creates a new column, called Std colname. This contains
    the original column’s standardized values (each value in the column has had the
    column mean subtracted, which is then divided by the column standard deviation).


    # Whole-Platform Options


    Each statistical platform has a popup menu in the outermost outline level next
    to the platform name. Options and commands in this menu affect all text reports
    and graphs on the platform.


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_38_0.png)


    The whole-platform options for the Distribution platform include the following:


    +   - **Uniform Scaling** scales all axes with the same minimum, maximum, and
    intervals so that the distributions are easily compared. This option applies to
    reports for all response variables when selected.

    +   - **Stack** lets you orient all the output in the report window as either
    portrait or landscape.

    +   - **Script** lets you rerun or save the JSL script that produced the platform
    results. If the script is saved to a file, you can edit it; if it is saved with
    the current data table, it is available to run the next time you open the table.
    The JSL generated by **Save Script for All Objects** is the same as **Save Script
    to Script Window** if there are no By-Groups. When there are By-Groups the script
    includes JSL Where clauses that identify the By-Group levels.'
  merge: -1
  img_proc: true
- pgno: 39
  md: '# Figure 2.20 The Script Menu


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_39_0.png)


    +   - Data Table Window gives a view of the underlying data table, which is especially
    useful when there are By-Groups.


    # Capability Analysis


    The Capability Analysis option gives a capability analysis for quality control
    applications. The capability study measures the conformance of a process to given
    specification limits. A dialog prompts you for Lower Spec Limit, Upper Spec Limit,
    and Target. You only have to enter one of the three values. Only those fields
    you enter are part of the resulting Capability Analysis table. Optionally, you
    can enter a known value for sigma, the process standard deviation.


    Capability Analyses can calculate capability indices using several different short-term
    estimates for σ. After requesting a Distribution, select Capability Analysis from
    the popup menu on the outline bar for the variable of interest. The Dialog box
    shown in Figure 2.21 appears, allowing specification of long-term or one or more
    short-term sigmas, grouped by a column or a fixed sample size.


    # Figure 2.21 Capability Analysis Dialog Box


    ![](img/a858f3b35ed4923af65c22e8829ee5a8_39_1.png)


    All capability analyses use the same formulas. The difference between the options
    lies in how sigma is computed. These options for sigma can be explained as:


    +   - Long-term uses the overall sigma. This is the option used for Ppk statistics,
    and has sigma computed as'
  merge: -1
  img_proc: true
- pgno: 40
  md: "σ = √[ Σ (from i=1 to n) (x_i - x̄)² / (n - 1) ]\n\n+   - **Specified Sigma**\
    \ allows the user to enter a specific, known sigma used for computing capability\
    \ analyses. Sigma is, obviously, user-specified and is therefore not computed.\
    \ This is the option used for control chart-generated capability analyses, where\
    \ the sigma used in the chart is entered (in the dialog) as the specified sigma.\n\
    \n+   - **Short Term, Grouped by fixed subgroup size** computes σ using the following\
    \ formula. In this case, if r is the number of subgroups and each i-th subgroup\
    \ is defined by the order of the data, sigma is computed as\n+   \n+   σ = √[\
    \ Σ (i=1 to n) (x_ij - x̄_i.)² / (n - r - 1) ]\n\n+   - **Short Term, Grouped\
    \ by Column** brings up a column list dialog from which you choose the grouping\
    \ column. In this case, with r equal to the number of subgroups, sigma is computed\
    \ as\n+   \n+   σ = √[ Σ (i=1 to n) (x_ij - x̄_i.)² / (n - r - 1) ]\n\n(Note that\
    \ this is the same formula for Short Term, Grouped by fixed subgroup size and\
    \ is commonly referred to as the Root Mean Square Error or RMSE.)\n\n**Note:**\
    \ There is a preference for Distribution called **Ppk Capability Labeling** that\
    \ will label the long-term capability output with Ppk labels. This option is found\
    \ using **File > Preferences**.\n\nWhen you click **OK**, the platform appends\
    \ a Capability Analysis table, like the one in Figure 2.22, at the bottom of the\
    \ text reports. You can remove and redo a Capability Analysis as many times as\
    \ you want.\n\nThe specification limits can be stored and automatically retrieved\
    \ as a column property. To do this, choose **Spec Limits** from the **Save** command\
    \ menu. When you save the specification limits, they appear on the histogram when\
    \ opened at a later time."
