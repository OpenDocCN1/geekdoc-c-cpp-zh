- pgno: 71
  md: '# The Matched Pairs Platform


    Some two-variable data have a natural pairing to them. A classic example is a
    before-and-after study of the effect of a medication. Data in this form are handled
    by the Matched Pairs platform.


    # Introduction


    After starting JMP Student Edition,


    Open the data file Denim.jmp.


    Details about this data are found in “About the Data,” p. 21 in the “The Distribution
    Platform” CHAPTER.


    # Preparing the Data


    This example examines the starch content of blue jeans, with one group having
    been sand blasted, and the other not. The examination is of jeans that come from
    the same lot, so they form a paired situation, and call for the Matched Pairs
    platform.


    To use the Matched Pairs platform, the paired data must be in two columns. However,
    in the Denim file, all the starch data is in the single column Starch Content
    (%). Therefore, the column needs to be split into two starch columns, based on
    whether the denim was sand blasted or not. To split the data in this way,


    Select Tables > Split.


    In the dialog that results, select Sand Blasted? from the list of columns and
    click Split By.


    Select Starch Content(%) from the list of columns and click Split Columns.


    Select Lot Number and Method and click Group.


    At this point, the split command is set to make a new data table, having split
    Starch Content (%) into two columns based on the value in the Sand Blasted? column.
    In the forthcoming example analysis, all of the original variables are not used,
    so they do not need to be included in this new table. In fact, no variables other
    than the ones already in the dialog need to be retained. To drop the unnecessary
    variables,


    Select the Drop All radio button at the bottom of the Split dialog.


    In the Output table name box, type “Paired Denim” to name the new data table.


    The dialog should appear like the one in Figure 4.1.'
  merge: -1
  img_proc: true
- pgno: 72
