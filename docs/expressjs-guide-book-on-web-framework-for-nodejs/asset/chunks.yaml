  trans: "\n\n![](img/00001.jpeg)\n\n# Express.js\nNode.js Web 框架指南\n作者：Rick L.\n\
    版权所有 ©2016 Rick L.\n保留所有权利\nCopyright © 2016 by Rick L.\n保留所有权利。未经作者事先书面许可，不得以任何形式或通过任何手段（包括复印、录制或其他电子或机械方法）复制、发行或传输本书物的内容，但批判性评论中的简短引用以及版权法允许的某些非商业用途除外。\n\
    \n## 目录\n- 引言\n\n## 免责声明\n虽然我们已尽力核实书中提供的信息，但作者对书中包含的主题可能出现的错误、遗漏或相反的解释不承担任何责任。书中提供的信息仅供教育和娱乐之用。读者对其自己的行为负责，作者对使用这些信息而导致的任何实际或感知的责任或损害不承担任何责任。\n\
    \n书中使用的商标均未经任何许可，且商标的出版未获得商标所有者的许可或支持。书中的所有商标和品牌仅用于说明目的，归其所有者所有，与本文无关联。\n\n# 引言\n\
    ExpressJS 是 Node 中最实用且有趣的框架之一。它被用于 Web 和移动应用程序的开发。这类应用程序在软件环境中使用最为广泛。这表明你有必要了解如何使用该框架进行开发。该框架拥有众多模块，可用于增强应用程序的视觉效果和体验。\n\
    \n# 第 1 章- ExpressJS 概述\nExpressJS 是一个非常灵活的 Node 框架，为开发者开发 Web 和移动应用程序提供了许多功能。该框架可用于开发\
    \ API。在书中，我们将讨论 ExpressJS 的各种特性。\n\n# 第 2 章- Session（会话）\n若要在 Express 中安装此功能，只需执行以下命令：\n\
    \n```\nnpm install express-session\n```\n\n上述命令将 session 安装到你的系统中。要在你的程序中使用它，你必须使用\
    \ `require` 命令。如下所示：\n\n```javascript\nvar session = require('express-session')\n\
    ```\n\n可以通过给定的 `options` 创建 session 中间件。你应该知道，会话数据不应该保存在 cookie 中，但在这里只存储了 session\
    \ ID。会话数据存储在应用程序的服务器端。然而，`MemoryStore`（默认的服务器端会话存储）并不是为生产环境设计的。在大多数情况下，它会发生内存泄漏，且无法扩展到单个进程之外。它是为了调试目的而开发的。\n\
    \n`express-session` 接受 options 对象中的以下属性：\n\n### Cookie\n这些是会话 ID Cookie 的设置。考虑下例示例：\n\
    \n```javascript\n{ path: '/', httpOnly: true, secure: false, maxAge: null }\n\
    ```\n\n### Genid\n这是一个用于生成新 session ID 的函数。提供的函数应该返回一个将用作 session ID 的字符串。如果在生成\
    \ ID 时需要向 `req` 附加值，则会将 `req` 作为第一个参数传递给函数。该默认值是一个函数，可以使用 `uid2` 来生成 ID。\n\n注意：为了避免会话冲突，请确保生成的\
    \ ID 是唯一的，即它们之间应该是不同的。考虑下例示例，展示了如何实现这一点：\n\n```javascript\napplication.use(session({\n\
    \    genid: function(req) {\n        return genuuid()\n    },\n    secret: ' my\
    \ secret '\n}))\n```\n\n### Name\n这是设置在响应中的 session cookie 的名称。注意，它是从请求中读取的。默认值为\
    \ `connect.sid`。对于那些在相同主机上运行多个应用程序的用户来说，session cookie 必须分开。为了实现这一点，必须在每个应用程序中设置不同的名称。\n\
    \n### Proxy\n当你设置安全 cookie（secure cookies）时，必须信任反向代理。这可以通过标头 `X-Forwarded-Proto`\
    \ 实现。默认值为 `undefined`。其可能的值解释如下：\n1. `true` - 将使用标头 `X-Forwarded-Proto`。\n2. `false`\
    \ - 所有标头将被忽略，只有当存在直接的 `TLS/SSL` 连接时才会考虑连接。\n3. `undefined` - 将使用 Express 自身的 `trust\
    \ proxy` 设置。\n\n### Resave\n强制将 session 保存回会话存储器。无论 session 是否被修改，这都会发生。其必要性取决于你的会话存储。然而，如果客户端发出并行请求，可能会产生竞态条件。\n\
    \n### Rolling\n将在每个响应中强制设置 cookie。过期日期也会重置。默认值为 `false`。\n\n### SaveUninitialized\n\
    通过此设置，未初始化的 session 将保存到会话存储器。未初始化的 session 是一个新的且未以任何方式修改的会话。默认设置为 `true`。然而，此设置已弃用，并预计在未来发生变化。\n\
    \n### Required option\n这是用于对 session ID cookie 进行签名的密钥（secret）。它可以由密钥数组组成，也可以是单个密钥的字符串。如果你提供密钥数组，则只有数组中的第一个元素将用于对\
    \ session ID cookie 进行签名。其余元素将用于对请求中的签名进行验证。\n\n### Store\n这是会话存储器的实例。它的默认值是一个新的\
    \ `MemoryStore` 实例。\n\n考虑下示例：\n\n```javascript\nvar application = express()\n\
    application.set('trust proxy', 1) // 信任第一个代理\napplication.use(session({\n    secret:\
    \ 'my secret',\n    resave: false,\n    saveUninitialized: true,\n    cookie:\
    \ { secure: true }\n}))\n```\n\n我们需要能够在生产环境中使用 cookie，同时允许在开发环境中进行测试。这种设置可以通过\
    \ `NODE_ENV` 启用。考虑下例示例，展示了如何实现这一点：\n\n```javascript\nvar application = express()\n\
    var session = {\n    secret: ' my secret ',\n    cookie: {}\n}\n```\n\n"
- fmt: "\n```javascript\nif (application.get('env') === 'production') {\n  application.set('trust\
    \ proxy', 1) // trusting the first proxy\n  session.cookie.secure = true // serving\
    \ secure cookies\n}\napplication.use(session(session))\n```\n\n default setting\
    \ for `cookie.maxAge` is `null`, and it will never expire, which means that the\
    \ cookie will become a browser-session cookie. The cookie is only removed once\
    \ the user has closed the browser. The session is also removed.\n\n`req.session`\n\
    \nFor session data to be stored and accessed, you should use the property `req.session`,\
    \ and the store initializes this as a JSON. The session objects will then be left\
    \ fine. Consider the example given below, which shows a view counter which is\
    \ specific to a user:\n\n```javascript\napplication.use(session({ secret: ' my\
    \ secret ', cookie: { maxAge: 50000 }}))\n\napplication.use(function(req, res,\
    \ next) {\n  var session = req.session\n  if (session.views) {\n    session.views++\n\
    \    res.setHeader('Content-Type', 'text/html')\n    res.write('<p>views: ' +\
    \ session.views + '</p>')\n    res.write('<p>will expires in: ' + (session.cookie.maxAge\
    \ / 1000) + 's</p>')\n    res.end()\n  } else {\n    session.views = 1\n    res.end('\
    \ This is a demo for sessions. Refresh the page!')\n  }\n})\n```\n\n### Session.regenerate()\n\
    \nThis method is invoked when we want to generate the session. After this, a new\
    \ session instance and SID will be initialized at the `req.session`. This is shown\
    \ below:\n\n```javascript\nreq.session.regenerate(function(error) {\n  // a new\
    \ session should be added here\n})\n```\n\n### Session.destroy()\n\nWith this,\
    \ the session is destroyed, and the `req.session` removed. It will then be regenerated\
    \ in the next request. This is shown below:\n\n```javascript\nreq.session.destroy(function(error)\
    \ {\n  // a session cannot be accessed here.\n})\n```\n\n### Session.reload()\n\
    \nThis is used for reloading the session as shown below:\n\n```javascript\nreq.session.reload(function(error)\
    \ {\n  // the session has been updated\n})\n```\n\n### Session.save()\n\nThis\
    \ is for saving the session as shown below:\n\n```javascript\nreq.session.save(function(error)\
    \ {\n  // session has been saved\n})\n```\n\nConsider the example given below,\
    \ which uses the `express-session` so as to store the page views for the user:\n\
    \n```javascript\nvar express = require('express')\nvar purl = require('parseurl')\n\
    var session = require('express-session')\nvar application = express()\n\napplication.use(session({\n\
    \  secret: ' my secret ',\n  resave: false,\n  saveUninitialized: true\n}))\n\n\
    application.use(function (req, res, next) {\n  var vws = req.session.views\n \
    \ if (!vws) {\n    vws = req.session.views = {}\n  }\n  // getting the url pathname\n\
    \  var pathname = purl(req).pathname\n  // counting the views\n  vws[pathname]\
    \ = (vws[pathname] || 0) + 1\n  next()\n})\n\napplication.get('/foo', function\
    \ (req, res, next) {\n  res.send('you have viewed this page ' + req.session.vws['/test']\
    \ + ' times')\n})\n\napplication.get('/bar', function (req, res, next) {\n  res.send('you\
    \ have viewed this page ' + req.session.vws['/bar'] + ' times')\n})\n```\n\nThat\
    \ is how sessions can be used in ExpressJS.\n\n# Chapter 3- serve-index\n\nThis\
    \ is used for serving pages having listings of a directory to a particular path.\
    \ It can be installed by executing the command given below:\n\n`$ npm install\
    \ serve-index`\n\nThe above command will install the `serve-index` to your computer.\
    \ To use it in your program, it has to be included or called by use of the `require`\
    \ method. This is shown below:\n\n```javascript\nvar svIndex = require('serve-index')\n\
