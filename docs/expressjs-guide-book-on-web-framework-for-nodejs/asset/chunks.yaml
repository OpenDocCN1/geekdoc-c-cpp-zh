    这些模块中的每一个都有自己对应的命令用于安装。要使用任何模块，你都必须从安装它开始。它支持会话（sessions）的使用，这在创建 Web 应用程序时非常有用。它提供了多种可用于开发目的的选项。你应该学习如何使用每个
    `ExpressJS` 模块所提供的不同选项。


    `serve-index` 模块用于向特定路径提供带有目录列表的页面。


    这在开发过程中非常有趣。通过 `cookie-sessions` 模块，可以提供访客会话，使得每个访问者（无论是否经过验证）都拥有自己的会话。这也是 `Express`
    中最好且有趣的特性之一。这个 Node 框架即使对于初学者来说也非常容易学习。这本书将帮助你学习如何使用它。

