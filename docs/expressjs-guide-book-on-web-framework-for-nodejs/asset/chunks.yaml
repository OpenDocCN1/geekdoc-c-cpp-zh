  trans: "\n\n```javascript\nif (application.get('env') === 'production') {\n  application.set('trust\
    \ proxy', 1) // 信任第一个代理\n  session.cookie.secure = true // 开启安全 cookie\n}\napplication.use(session(session))\n\
    ```\n\n `cookie.maxAge` 的默认设置为 `null`，它永远不会过期，这意味着该 cookie 将成为浏览器会话 cookie。只有当用户关闭浏览器后，cookie\
    \ 才会被移除。同时 session 也会被移除。\n\n`req.session`\n\n为了存储和访问 session 数据，你应该使用 `req.session`\
    \ 属性，store 会将其初始化为 JSON。随后 session 对象将保持正常状态。考虑下面给出的示例，它展示了一个特定于用户的访问计数器：\n\n\
    ```javascript\napplication.use(session({ secret: ' my secret ', cookie: { maxAge:\
    \ 50000 }}))\n\napplication.use(function(req, res, next) {\n  var session = req.session\n\
    \  if (session.views) {\n    session.views++\n    res.setHeader('Content-Type',\
    \ 'text/html')\n    res.write('<p>views: ' + session.views + '</p>')\n    res.write('<p>will\
    \ expires in: ' + (session.cookie.maxAge / 1000) + 's</p>')\n    res.end()\n \
    \ } else {\n    session.views = 1\n    res.end(' This is a demo for sessions.\
    \ Refresh the page!')\n  }\n})\n```\n\n### Session.regenerate()\n\n当我们需要生成 session\
    \ 时，会调用此方法。之后，一个新的 session 实例和 SID 将在 `req.session` 中初始化。如下：\n\n```javascript\n\
    req.session.regenerate(function(error) {\n  // 在此处应该添加一个新的 session\n})\n```\n\n\
    ### Session.destroy()\n\n通过此方法，session 将被销毁，`req.session` 也被移除。它将在下一次请求中被重新生成。如下所示：\n\
    \n```javascript\nreq.session.destroy(function(error) {\n  // 在此处无法访问 session。\n\
    })\n```\n\n### Session.reload()\n\n这用于重新加载 session，如下所示：\n\n```javascript\nreq.session.reload(function(error)\
    \ {\n  // session 已经更新\n})\n```\n\n### Session.save()\n\n这用于保存 session，如下所示：\n\
    \n```javascript\nreq.session.save(function(error) {\n  // session 已保存\n})\n```\n\
    \n考虑下面给出的示例，它使用了 `express-session` 来存储用户的页面访问：\n\n```javascript\nvar express =\
    \ require('express')\nvar purl = require('parseurl')\nvar session = require('express-session')\n\
    var application = express()\n\napplication.use(session({\n  secret: ' my secret\
    \ ',\n  resave: false,\n  saveUninitialized: true\n}))\n\napplication.use(function\
    \ (req, res, next) {\n  var vws = req.session.views\n  if (!vws) {\n    vws =\
    \ req.session.views = {}\n  }\n  // 获取 url 路径\n  var pathname = purl(req).pathname\n\
    \  // 计数访问\n  vws[pathname] = (vws[pathname] || 0) + 1\n  next()\n})\n\napplication.get('/foo',\
    \ function (req, res, next) {\n  res.send('you have viewed this page ' + req.session.vws['/test']\
    \ + ' times')\n})\n\napplication.get('/bar', function (req, res, next) {\n  res.send('you\
    \ have viewed this page ' + req.session.vws['/bar'] + ' times')\n})\n```\n\n这就是在\
    \ ExpressJS 中使用 session 的。\n\n# 第 3 章- serve-index\n\n这用于向特定路径提供带有目录列表的页面。可以通过执行以下命令进行安装：\n\
    \n`$ npm install serve-index`\n\n上述命令将 `serve-index` 安装到你的电脑上。要在你的程序中使用它，必须通过\
    \ `require` 方法进行包含或调用。如下所示：\n\n```javascript\nvar svIndex = require('serve-index')\n\
    ```\n\nAPI 将被包含在你的程序中。\n\n### serveIndex(path, options)\n\n这将返回一个中间件，用于提供你给给 `path`\
    \ 目录的索引。这里的路径基于 `req.url` 的值。如果你想更改 URL 基础，请使用 `app.use`。\n\nserve index 的 options\
    \ 对象接受以下属性：\n\n**Filter（过滤器）**\n此过滤器函数应用于文件。其默认值为 `false`。它会为每个文件调用一次，使用的签名是 `filter(filename,\
    \ index, files, dir)`。`filename` 是文件名，`index` 是数组索引，`files` 是文件数组，而 `dir` 是文件所在的绝对路径。\n\
    \n**Hidden（隐藏文件）**\n这用于显示隐藏文件。其默认值为 `false`。\n\n**Icons（图标）**\n这用于显示图标。其默认值为 `false`。\n\
    \n**Stylesheet（样式表）**\n这是一个指向 CSS 样式表的可选路径。其默认值是内置的样式表。\n\n**Template（模板）**\n\
    这是一个指向 HTML 模板的可选路径，用于渲染 HTML 字符串。\n\n**View（视图）**\n这是显示模式。\n\n# 第 4 章- cookie\
    \ Sessions\n\n这是一个用于提供 session 的模块，以便无论访问者是否已验证都拥有一个 session。为了在程序中使用该 API，我们必须使用如下所示的\
    \ `require` 命令：\n\n`var session = require(')`\n\nsession 对象接受以下选项：\n\n**Name（名称）**\n\
    这是 cookie 的名称。其默认值为 `session`。\n\n**Keys（密钥）**\n这是用于签名和验证 cookie 的密钥列表。设置的 cookie\
    \ 总是使用 `keys[0]` 进行签名。其余密钥将用于验证，这将允许进行轮换。\n\n**Secret（密钥）**\n在未提供 `keys` 的情况下，此字符串将作为密钥使用。你还需要知道一些\
    \ cookie 选项。\n\n如果你需要删除特定的 session，请如下操作：\n\n`req.session = null`\n\n考虑下面简单的计数器示例。示例如下：\n\
    \n```javascript\nvar cookieSession = require('cookie-session')\nvar express =\
    \ require('express')\nvar application = express()\n\napplication.set('trust proxy',\
    \ 1) // 信任第一个代理\n\napplication.use(cookieSession({\n  name: 'session',\n  keys:\
    \ ['key1', 'key2']\n}))\n\napplication.use(function (req, res, next) {\n  // 更新访问次数\n\
    \  req.session.views = (req.session.views || 0) + 1\n  // 写入响应\n  res.end(req.session.views\
    \ + ' views')\n})\n\napplication.listen(3000)\n```\n\n考虑下一个给出的示例：\n\n```javascript\n\
    var cookieSession = require('cookie-session')\nvar express = require('express')\n\
    var application = express()\n\napplication.set('trust proxy', 1) // 信任第一个代理\n\n\
    application.use(cookieSession({\n  name: 'session',\n  keys: ['key1', 'key2']\n\
    }))\n\n// 这允许你设置 req.session.maxAge，以便某些 session 拥有与默认不同的值。\n\napplication.use(function\
    \ (req, res, next) {\n  req.sessionOptions.maxAge = req.session.maxAge || req.sessionOptions.maxAge\n\
    })\n\n// ... 此处应该添加逻辑 ...\n```"
- fmt: "\nYou have to note that the entire session object will be encoded and stored\
    \ in a cookie. The maximum cookie size limit on the different browsers can then\
    \ be exceeded. If the session object is large enough and it can exceed the limit\
    \ of the browser when it has been encoded, what will happen in most cases is that\
    \ the browser will refuse or avoid storing the cookie.\n\n# Chapter 5- Morgan\
    \ in ExpressJS\n\nThis is logger middleware for the HTTP request for Node.js.\
    \ To use the API in your program, you have to use the `require` keyword as shown\
    \ below:\n\n```javascript\nvar morgan =  require('morgan')\n```\n\nThe following\
    \ format is used for creating this:\n\n### `morgan(format, options)`\n\nAs shown\
    \ in the above format, we have two parameters or arguments.\n\nThe following properties\
    \ are accepted by Morgan in the `options` object:\n\n#### Immediate\nThe log line\
    \ should be written on request rather than on response. This will mean that the\
    \ requests will always be logged even if the server itself crashes, but it will\
    \ be impossible for us to log the data from the response. \n\n#### Skip\nThis\
    \ is a function used for the determination of whether or not logging was skipped.\
    \ The default value for this is `false`, Consider the example given below, which\
    \ shows how the function can be called:\n\n```javascript\n// EXAMPLE: only the\
    \ log error responses\nmorgan('combined', {\nskip:  function (req, res) { return\
    \ res.statusCode <  400 }\n})\n```\n\n#### Stream\nThis is an output stream which\
    \ is used for writing log lines, and its default value is `process.stdout`.\n\n\
    Consider the example given below, which shows how all the requests can be logged\
    \ in the Apache combined format to the STDOUT. Here is the example:\n\n```javascript\n\
    var express =  require('express')\nvar morgan =  require('morgan')\nvar application\
    \ = express()\n\napplication.use(morgan('combined'))\n\napplication.get('/', function\
    \ (req, res) {\n  res.send('hello, there!')\n})\n```\n\n### vanilla http server\n\
    \nAn example which demonstrates how this can be done is given below:\n\n```javascript\n\
    var fhandler =  require('finalhandler')\nvar http =  require('http')\nvar morgan\
    \ =  require('morgan')\n// creating the \"middleware\"\nvar logger = morgan('combined')\n\
    \nhttp.createServer(function (req, res) {\n  var done = finalhandler(req, res)\n\
    \  logger(req, res, function (error) {\n    if (error) return done(error)\n  \
    \  // responding to the request\n    res.setHeader('content-type', 'text/plain')\n\
    \    res.end('hello, there!')\n  })\n})\n```\n\n#### Writing Logs to a File\n\n\
    Consider the example given below, which shows how the requests can be logged in\
    \ Apache combined format to our file `access.log`:\n\n```javascript\nvar express\
    \ =  require('express')\nvar fs =  require('fs')\nvar morgan =  require('morgan')\n\
    var application = express()\n\n// creating a write stream (in the append mode)\n\
    var aLogStream = fs.createWriteStream(__dirname  + '/access.log', {flags: 'a'})\n\
    \n// setting up the logger\napplication.use(morgan('combined', {stream: aLogStream}))\n\
    application.get('/', function (req, res) {\n  res.send('hello, there!')\n})\n\
    ```\n\n#### log file rotation\n\nIn the example given below, the app will log\
    \ all the requests in the Apache combined format to any of the log files in our\
    \ directory `log/` by use of the `file-stream-rotator` module. The example is\
    \ as follows:\n\n```javascript\nvar FStreamRotator =  require('file-stream-rotator')\n\
    var express =  require('express')\nvar fs =  require('fs')\nvar morgan =  require('morgan')\n\
    var application = express()\nvar lDirectory =  __dirname  + '/log'\n\n// ensuring\
    \ the log directory exists\nfs.existsSync(lDirectory) || fs.mkdirSync(lDirectory)\n\
    \n// creating a rotating write stream\nvar aLogStream = FStreamRotator.getStream({\n\
    \  filename: lDirectory + '/access-%DATE%.log',\n  frequency: 'daily',\n  verbose:\
    \  false\n})\n\n// setting up the logger\napplication.use(morgan('combined', {stream:\
    \ aLogStream}))\napplication.get('/', function (req, res) {\n  res.send('hello,\
    \ there!')\n})\n```\n\n#### Custom token formats\n\nIn the next app, we will use\
    \ the custom token formats. It works by adding an ID to all of the requests, and\
    \ will then display it by use of the `:id` token. Here is the app:\n\n```javascript\n\
    var express =  require('express')\nvar morgan =  require('morgan')\nvar id = \
    \ require('node-uuid')\n\nmorgan.token('id', function getId(req) {\n  return req.id\n\
    })\n\nvar application = express()\napplication.use(assignid)\napp.use(morgan(':id\
    \ :method :url :response-time'))\napp.get('/', function (req, res) {\n  res.send('hello,\
    \ world!')\n})\n\nfunction assignId(req, res, next) {\n  req.id  = uuid.v4()\n\
    \  next()\n}\n```\n\n# Chapter 6- CORS\n\nThis is a Node.js package which provides\
    \ an ExpressJS/Connect middleware which can be used for enabling of the various\
    \ options for CORS.\n\nTo install it via npm command, execute the command given\
    \ below:\n\n```bash\n$ npm install cors\n```\n\nThis can be used as shown below:\n\
    \n```javascript\nvar express =  require('express')\nvar cors =  require('cors')\n\
    var application = express();\n\napplication.use(cors());\napplication.get('/products/:id',\
    \ function(req, res, next){\n  res.json({msg: 'This has CORS enabled for all the\
    \ origins!'});\n});\n```\n\n#### Enable CORS for all the origins\n```javascript\n\
    var express =  require('express')\nvar cors =  require('cors')\nvar application\
    \ = express();\n\napplication.use(cors());\napplication.get('/products/:id', function(req,\
    \ res, next){\n  res.json({msg: 'This has CORS enabled for all the origins!'});\n\
    });\n```\n\n#### Enable CORS for a single route\n```javascript\nvar express =\
    \  require('express')\nvar cors =  require('cors')\nvar application = express();\n\
    \napplication.use(cors());\napplication.get('/products/:id', function(req, res,\
    \ next){\n  res.json({msg: 'This has CORS enabled for all the origins!'});\n});\n\
    ```\n\n#### Configure the CORS\n```javascript\nvar express =  require('express')\n\
    var cors =  require('cors')\nvar application = express();\n\nvar cOptions = {\n\
    \  origin: 'http://sample.com'\n};\n\napplication.get('/products/:id', cors(cOptions),\
    \ function(req, res, next){\n  res.json({msg: 'This has CORS enabled for all the\
    \ origins!'});\n});\n```\n\n#### Configuration of CORS w/ Dynamic Origin\n```javascript\n\
    var express =  require('express')\nvar cors =  require('cors')\nvar application\
    \ = express();\n\nvar whitelist = ['http://sample1.com', 'http://sample2.com'];\n\
    \nvar cOptions = {\n  origin: function(origin, callback){\n    var orIsitelisted\
    \ = whitelist.indexOf(origin) !==  -1;\n    callback(null, orIsitelisted);\n \
    \ }\n};\n\napplication.get('/products/:id', cors(cOptions), function(req, res,\
    \ next){\n  res.json({msg: 'This has CORS enabled for the domain.'});\n});\n```\n\
    \n### How to enable CORS Pre-Flight\n\nCertain requests for CORS are considered\
    \ to be complex, and these need an initial OPTIONS request. A CORS request which\
    \ uses the HTTP verb is considered to be complex compared to the one which uses\
    \ POST/GET/HEAD or the one using custom headers. For pre-fighting to be enabled,\
    \ a new OPTIONS handler has to be added for the route which needs to be supported.\
    \ This is shown below:\n\n```javascript\nvar express =  require('express')\nvar\
    \ cors =  require('cors')\nvar application = express();\n\napplication.options('/products/:id',\
    \ cors()); // enabling a pre-flight request for the DELETE request\napplication.del('/products/:id',\
    \ cors(), function(req, res, next){\n  res.json({msg: 'This has CORS enabled for\
    \ all the origins!'});\n});\n```\n\nPre-flight can also be enabled across the\
    \ board as shown below:\n\n```javascript\napplication.options('*', cors()); //\
    \ including before the other routes\n```\n\n#### Asynchronous configuration of\
    \ CORS\n\n```javascript\nvar express =  require('express')\nvar cors =  require('cors')\n\
    var application = express();\n\nvar whitelist = ['http://sample1.com', 'http://sample2.com'];\n\
    \nvar cOptionsDelegate =  function(req, callback){\n  var cOptions;\n  if(whitelist.indexOf(req.header('Origin'))\
    \ !==  -1){\n    cOptions = { origin:  true }; // reflecting (enabling) the requested\
    \ origin in our CORS response\n  }else{\n    cOptions = { origin:  false }; //\
    \ disabling the CORS for our request\n  }\n}\n```\n"
