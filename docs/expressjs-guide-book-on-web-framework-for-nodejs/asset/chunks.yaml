  trans: "\n\n# [Text body parser](https://github.com/expressjs/body-parser#bodyparsertextoptions)\n\
    \n要安装它，只需执行以下命令：\n\n```bash\nnpm install body-parser\n```\n\n要使用该 API，请通过 `require`\
    \ 命令将其包含在程序中。如下所示：\n\n```javascript\nvar bParser = require('body-parser')\n```\n\
    \n通过 `bParser` 对象，暴露了各种用于创建中间件的工厂。`req.body` 属性将由所有中间件通过解析后的体进行填充，或者将错误解析传递给回调函数。\n\
    \n在 Express 中，可以将一个通用的 JSON 和 URL 编码（URL-encoded）解析器作为顶级中间件添加。通过这种方式，所有请求的体都将被解析。考虑下面提供的简单示例，它展示了如何实现这一点：\n\
    \n```javascript\nvar express = require('express')\nvar bParser = require('body-parser')\n\
    var application = express()\n\n// 解析 application/x-www-form-urlencoded\napplication.use(bParser.urlencoded({\
    \ extended: false }))\n\n// 解析 application/json\napplication.use(bParser.json())\n\
    \napplication.use(function (req, res) {\n  res.setHeader('Content-Type', 'text/plain')\n\
    \  res.write('you posted:\\n')\n  res.end(JSON.stringify(req.body, null, 2))\n\
    })\n```\n\n## express 路由特定\n\n体解析器可以被添加到需要它们的路由中。这在 Express 中是可行的，并且可以轻松完成。这是在\
    \ Express 中使用 `body-parser` 最简单且推荐的方法。考虑下面的示例，它展示了如何实现这一点：\n\n```javascript\n\
    var express = require('express')\nvar bParser = require('body-parser')\nvar application\
    \ = express()\n\n// 创建一个 application/json 解析器\nvar jParser = bodyParser.json()\n\
    \n// 创建一个 application/x-www-form-urlencoded 解析器\nvar urlenParser = bParser.urlencoded({\
    \ extended: false })\n\n// POST /login 将获取 urlencoded 的体\napplication.post('/login',\
    \ urlenParser, function (req, res) {\n  if (!req.body) return res.sendStatus(400)\n\
    \  res.send('welcome, ' + req.body.username)\n})\n\n// POST /api/users 将获取 JSON\
    \ 的体\napplication.post('/api/users', jParser, function (req, res) {\n  if (!req.body)\
    \ return res.sendStatus(400)\n  // 在 req.body 中创建一个用户\n})\n```\n\n### 更改解析器的内容类型\n\
    \n对于所有解析器，都接受一个 `type` 选项，通过该选项，content-type 将是可以更改的，并且这应该是中间件要解析的内容。考虑下面的示例，它展示了如何实现这一点：\n\
    \n```javascript\n// 将各种不同的自定义 JSON 类型解析为 JSON\napplication.use(bodyParser.json({\
    \ type: 'application/*+json' }))\n\n// 将自定义内容解析为 Buffer\napplication.use(bParser.raw({\
    \ type: 'application/vnd.custom-type' }))\n\n// 将 HTML 体解析为字符串\napplication.use(bParser.text({\
    \ type: 'text/html' }))\n```\n\n# 第 12 章- Flash\n\n这是实现 Express 最简单的方式。要安装它，执行以下命令：\n\
    \n```bash\nnpm i flash\n```\n\n考虑下面的示例，它展示了如何实现这一点：\n\n```javascript\napplication.use(session());\
    \ // session 中间件\napplication.use(require('flash')());\napplication.use(function\
    \ (req, res) {\n  // get 消息\n  req.flash('info', 'hello there!');\n  next();\n\
    })\n```\n\n考虑下面的第二个示例：\n\n```javascript\nfor msge in flash\na.alert(class='alert-'\
    \ + msge.type)\np= message.msge\n```\n\n这里是最后的示例：\n\n```javascript\nwhile msge\
    \ = flash.shift() // 当 jade 读取了它们时，消耗这些消息\na.alert(class='alert-' + msge.type)\n\
    p= message.msge\n```\n\n### f 数组\n\nFlash 消息可以如下所示：\n\n```json\n{\n  \"type\"\
    : \"info\",\n  \"message\": \"message\"\n}\n```\n\n# [method-override](https://github.com/expressjs/method-override)\n\
    \n这用于覆盖 HTTP 动词。通过它，可以在客户端不支持的地方使用如 `DELETE` 和 `PUT` 之类的 HTTP 动词。要在系统中安装它，请执行以下命令：\n\
    \n```\nnpm install method-override\n```\n\n要使用此模块，你必须知道在任何需要请求方法的模块之前，必须先使用它。\n\
    \n### 使用 header 进行覆盖\n\n为了将 header 用于覆盖，header 名称 必须作为字符串参数传递给函数 `methodOverride`。为了进行该调用，必须向\
    \ POST 请求发送到带有该 header 作为被覆盖方法的 URL。考虑下面的示例，它展示了如何实现这一点：\n\n```javascript\nvar\
    \ connect = require('connect')\nvar mthdOverride = require('method-override')\n\
    \n// 在我们的请求中使用 X-HTTP-Method-Override header 进行覆盖\napplication.use(mthdOverride('X-HTTP-Method-Override'))\n\
    ```\n\n考虑下面的示例，它展示了如何配合 `XMLHttpRequest` 使用：\n\n```javascript\nvar c = new XMLHttpRequest()\n\
    c.open('POST', '/resource')\nc.setRequestHeader('X-HTTP-Method-Override', 'DELETE')\n\
    c.send()\n```\n\n# 第 13 章- serve-favicon\n\n这是一个用于处理图标的中间件。通过执行以下命令可以安装该模块：\n\n\
    ```bash\nnpm install-favicon\n```\n\n考虑下面的示例，它展示了如何在 Express 中实现这一点：\n\n```javascript\n\
    var express = require('express')\nvar favicon = require('favicon')\nvar application\
    \ = express()\n\napplication.use(favicon('public/public'))\n\napplication.listen(3000)\n\
    ```\n\n在 connect 中，可以如下实现：\n\n```javascript\nvar connect = require('connect')\n\
    var favicon = require('favicon')\nvar application = connect()\n\napplication.use(favicon('public/public'))\n\
    \napplication.listen(3000)\n```\n\n### vanilla http server\n\n这是一个可以在任何地方使用的中间件类型。下面的示例展示了如何配合\
    \ http 使用它：\n\n```javascript\nvar http = require('http')\nvar favicon = require('favicon')\n\
    var finalhandler = require('finalhandler')\n\nvar _favicon = favicon()\n\nvar\
    \ server = http.createServer(function (req, res) {\n  var done = finalhandler(req,\
    \ res)\n\n  _favicon(req, res, function (err) {\n    if (err) return done(err)\n\
    \    // 响应请求\n    res.statusCode = 404\n    res.end('')\n  })\n})\n\nserver.listen(3000)\n\
    ```\n\n# 第 14 章- response-time\n\n这是 node.js 的响应时间 header。它通过创建一个中间件来记录 HTTP 服务器请求的响应时间。在这种情况下，响应时间将是请求进入中间件到头部被写入客户端的时间。\n\
    \n可以通过执行以下命令安装此模块：\n\n```bash\nnpm install response-time\n```\n\n可以通过 `require`\
    \ 关键字将模块包含在程序中，如下：\n\n```javascript\nvar respTime = require('response-time')\n\
    ```\n\n考虑下面的示例，它展示了如何在 Express 和 connect 中使用它：\n\n```javascript\nvar express =\
    \ require('express')\nvar respTime = require('response-time')\nvar application\
    \ = express()\n\napplication.use(respTime())\n\napplication.get('/', function\
    \ (req, res) {\n  res.send('hello, there!')\n})\n```\n\n### 这就是它的用法。\n\n### vanilla\
    \ http server\n\n可以如下方式使用：\n\n```javascript\nvar finalhandler = require('finalhandler')\n\
    var http = require('http')\nvar respTime = require('response-time')\n\nvar _responseTime\
    \ = respTime()\n\nhttp.createServer(function (req, res) {\n  var done = finalhandler(req,\
    \ res)\n\n  _responseTime(req, res, function (err) {\n    if (err) return done(err)\n\
    \    // 响应请求\n    res.setHeader('content-type', 'text/plain')\n    res.end('hello,\
    \ there!')\n  })\n}).listen(3000)\n```\n\n"
- fmt: "\n```javascript\nvar express = require('express')\n\nvar respTime = require('response-time')\n\
    \nvar StatsD = require('node-statsd')\n\nvar application = express()\n\nvar statistics\
    \ = new StatsD()\n\nstatistics.socket.on('error', function (err) {\n  console.error(err.stack)\n\
    })\n\napplication.use(respTime(function (req, res, time) {\n  var stat = (req.method\
    \ + req.url).toLowerCase()\n    .replace(/[:\\.]/g, '')\n    .replace(/\\//g,\
    \ '_')\n  statistics.timing(stat, time)\n}))\n\napplication.get('/', function\
    \ (req, res) {\n  res.send('hello, there!')\n})\n```\n\n# Chapter 15- [express-namespace](https://github.com/expressjs/express-namespace)\n\
    \nWith this, namespaced routing capabilities are added to Express. To install\
    \ it into the system, one can execute the following command:\n\n```bash\n$ npm\
    \ install express-namespace\n```\n\nConsider the example given below, which can\
    \ be used for responding to any of the requests. Here is the example:\n\n```\n\
    GET /forum/12\nGET /forum/12/view\nGET /forum/12/edit\nGET /forum/12/thread/5\n\
    DELETE /forum/12\n```\n\nFor the module to be used, one must use the `app.namespace()`\
    \ and `require('express-namespace')`. The module will then be made available to\
    \ you.\n\nTo use it, we have to pass a callback function, and then perform a routing\
    \ to the method. After each of the callbacks, the invocation will be completed,\
    \ and the namespace will be stored together with its state. This is shown below:\n\
    \n```javascript\napplication.namespace('/forum/:id', function(){\n  application.get('/(view)?',\
    \ function(req, res){\n    res.send('GET forum ' + req.params.id);\n  });\n\n\
    \  application.get('/edit', function(req, res){\n    res.send('GET forum ' + req.params.id\
    \ + ' edit the page');\n  });\n\n  application.namespace('/thread', function(){\n\
    \    application.get('/:tid', function(req, res){\n      res.send('GET forum '\
    \ + req.params.id + ' thread ' + req.params.tid);\n    });\n  });\n\n  application.del('/',\
    \ function(req, res){\n    res.send('DELETE the forum ' + req.params.id);\n  });\n\
    });\n```\n\nThe current namespace can also be accessed via the `app.currentNamespace`.\
    \ You should also know how to run the tests. However, before doing this, make\
    \ sure that you have all of the sub-modules installed into the system. These can\
    \ be installed by executing the following command:\n\n```bash\n$ git submodule\
    \ update–init\n```\n\nThe tests can be run by executing the following command:\n\
    \n```bash\n$ make test\n```\n\nThat is how the module can be used.\n\n# Chapter\
    \ 16- [express-expose](https://github.com/expressjs/express-expose)\n\nThis is\
    \ used for exposing the objects, functions, and raw js to the client side. This\
    \ feature is good for sharing of settings, utils, and the current data for the\
    \ user. The helpers and the local variables are also exposed to the client side.\n\
    \nTo install this module, execute the command given below:\n\n```bash\nnpm install\
    \ -S express-expose\n```\n\nIt can be used as shown below:\n\n```javascript\n\
    var express = require('express');\n\nvar expose = require('express-expose');\n\
    \napplication = expose(application);\n\napplication.expose(...);\n```\n\nThe above\
    \ is how the module can be used in express 4.x. In express 2.x and 3.x, it can\
    \ be done as follows:\n\n```javascript\nvar express = require('express');\n\n\
    var expose = require('express-expose');\n\napplication.expose(...);\n```\n\n###\
    \ How to express the objects\n\nOne way that objects can be exposed to the client\
    \ side is by exposing the properties, and most probably the Express configuration.\
    \ When the `app.expose(object)` is exposed, the properties will be exposed to\
    \ the `application.*`. The example given below shows how this can be done:\n\n\
    ```javascript\napplication.set('views', __dirname + '/views');\napplication.set('\
    \ the view engine ', 'jade');\napplication.set('title', ' Sample ');\napplication.set('default\
    \ language', 'en');\napplication.expose(application.settings);\n```\n\nHelper\
    \ methods can also be exposed by another use case. This can be in the same way\
    \ that you are currently exposing. This is shown below:\n\n```javascript\napplication.expose({\
    \ en: 'English', fr: 'French' }, 'application', 'languages');\n```\n\nYou then\
    \ need to output your default buffer to your template. For jade users, it can\
    \ be done as follows:\n\n```html\nscript!= javascript\n```\n\nFor EJS users, this\
    \ can be done as follows:\n\n```html\n<script><%- javascript %></script>\n```\n\
    \nRaw JavaScript strings can also be exposed as shown below:\n\n```javascript\n\
    application.expose('var some = \"variable\";');\n```\n\n### Exposing Functions\n\
    \nA named function can easily be exposed. You only have to pass it with a default\
    \ name for the buffer to replace it with a template name. An example of this is\
    \ shown below:\n\n```javascript\napplication.expose(function someFunction(){\n\
    \  return 'yes';\n}, 'foot');\n```\n\nThat is how it can be done.\n\n### Self-Calling\
    \ Functions\n\nAn anonymous function can also be passed, and this will execute\
    \ itself so as to create a wrapper function. Consider the example given below,\
    \ which shows how this can be done:\n\n```javascript\napplication.expose(function(){\n\
    \  function notify() {\n    alert('this will be executed finely:D');\n  }\n  notify();\n\
    });\n```\n\nThat is how it can be done.\n\n### Request-Level Exposure\n\nAll the\
    \ above which has been discussed can be applied to the request-level. Consider\
    \ the example given below showing how to do this. Here is the example:\n\n```javascript\n\
    application.get('/', function(req, res){\n  var user = { name: 'john' };\n  application.expose(user);\n\
    \  res.render('index', { layout: false });\n});\n```\n\n# Chapter 17- connect-render\n\
    \nThis is a helper for the template in connect. It can be installed by executing\
    \ the following command:\n\n```bash\n$ render\n```\n\nIt can be used as shown\
    \ below:\n\n```javascript\nvar connect = require('connect');\nvar render = require('connect-render');\n\
    \napplication = connect(\nrender({\n  root: __dirname + '/views',\n  layout: 'layout.html',\n\
    \  cache: true, // must be set `true` on production\n  open: \"<%\",\n  close:\
    \ \"%>\", // the ejs close tag is %>\n  helpers: {\n    config: config,\n    sitename:\
    \ 'NodeBlog Engine',\n    _csrf: function (req, res) {\n      return req.session\
    \ ? req.session._csrf : \"\";\n    }\n  }\n})\n);\n```\n\nAll the above which\
    \ has been discussed can be applied to the request-level. Consider the example\
    \ given below showing how to do this:\n\n```javascript\nres.render('index.html',\
    \ { title: 'Index Page', items: items });\n\n/**\n* rendering middleware for the\
    \ `connect`\n*/\nfunction middleware(options) {}\n```\n\n# Conclusion\n\nIt can\
    \ be said that ExpressJS is a Node framework. It provides developers with a framework\
    \ which they can use to create web and mobile applications. It has numerous features\
    \ which developers can take advantage of so as to create their applications. It\
    \ works by use of its middleware. The framework also provides developers with\
    \ numerous modules which they can use for the development of their applications.\n"
