  trans: "\n\n为了让你捕获来自 `Multer` 的错误，只需手动调用该中间件函数。下例所示：\n\n```javascript\nvar uploadfile\
    \ = multer().single('avatar')\n\napplication.post('/profile', function (req, res)\
    \ {\n  uploadfile(req, res, function (error) {\n    if (error) {\n      // 上传时发生错误\n\
    \      return\n    }\n    // 一正常\n  })\n})\n```\n\n这就是它的使用方法。\n\n# 第 9 章-压缩\n\n\
    这是 Node.js 中提供的一个中间件。它支持以下压缩算法：\n\n*   `deflate`\n*   `gzip`\n\n要在你的系统中安装此中间件，请执行以下命令：\n\
    \n```bash\n$ npm install compression\n```\n\n要在程序中引入此 API，请如下所示使用 `require` 关键字：\n\
    \n```javascript\nvar compression = require('compression')\n```\n\n可以使用不同的选项来返回压缩中间件。\n\
    \n### .filter\n\n这是默认过滤器函数。它用于构建自定义过滤器函数，该函数将作为我们默认函数的扩展。下面的示例展示了如何使用它：\n\n```javascript\n\
    application.use(compression({filter: compress}))\n\nfunction compress(req, res)\
    \ {\n  if (req.headers['x-no-compression']) {\n    // 带有此标头的响应不应被压缩。\n    return\
    \ false\n  }\n  // 回退到标准过滤器函数\n  return compression.filter(req, res)\n}\n```\n\
    \n`red.flush()`\n\n通过此模块，部分压缩的会被刷新到客户端。让我们来看一些示例。\n\n### express/connect\n\n可以通过\
    \ `app.use` 使用此模块，它在 Express 和 connect 中可用。通过中间件的请求始终会被压缩。考虑下面的示例，展示了如何实现：\n\n\
    ```javascript\nvar compression = require('compression')\nvar express = require('express')\n\
    var application = express()\n\n// 压缩所有请求\napplication.use(compression())\n\n//\
    \ 添加所有路由\n```\n\n方法如下。\n\n### 服务器发送事件 (Server-Sent Events)\n\n该模块在服务器端的工作并非开箱即用。为了对内容进行压缩，必须缓冲输出窗口以便获得良好的压缩效果。\n\
    \n为了完成这些操作，我们需要对那些需要将数据写入客户端的情况调用 `red.flush()`。如下所示：\n\n```javascript\nvar compression\
    \ = require('compression')\nvar express = require('express')\nvar application\
    \ = express()\n\n// 压缩响应\napplication.use(compression())\n\n// 服务器发送事件流\napplication.get('/events',\
    \ function (req, res) {\n  res.setHeader('Content-Type', 'text/event-stream')\n\
    \  res.setHeader('Cache-Control', 'no-cache')\n  // 大约每 2 秒发送一次 ping\n  var timer\
    \ = setInterval(function () {\n    res.write('data: ping\\n\\n')\n    // !!! 我们程序中最重要的部分\n\
    \    res.flush()\n  }, 2000)\n  res.on('close', function () {\n    clearInterval(timer)\n\
    \  })\n})\n```\n\n# 第 10 章- csurf\n\n这是一个 CSRF 令牌中间件。它作为保护目的的中间件。要使用它，必须先初始化 cookie-parser\
    \ 或 session 中件。可以通过执行以下命令将其安装到电脑上：\n\n```bash\n$ npm install csurf\n```\n\n在程序中使用该\
    \ API，请如下所示使用 `require` 命令：\n\n```javascript\nvar csurf = require('csurf')\n```\n\
    \n这就是将其包含在程序中的。\n\n该模块的选项接受多个不同的对象，你可以学习如何使用它们。\n\n考虑下面的示例，它展示了服务器端的代码，用于生成 CSRF\
    \ 表单以供回传。示例如下：\n\n```javascript\nvar cParser = require('cookie-parser')\nvar csrf\
    \ = require('csurf')\nvar bParser = require('body-parser')\nvar express = require('express')\n\
    \n// 设置路由中间件\nvar csrfProtection = csrf({ cookie: true })\nvar pForm = bParser.urlencoded({\
    \ extended: false })\n\n// 创建一个 express 应用\nvar application = express()\n\n//\
    \ 解析 cookies\n// 这是必要的因为在 csrfProtection 中 \"cookie\" 为 true\napplication.use(cParser())\n\
    application.get('/form', csrfProtection, function(req, res) {\n  // 将 csrfToken\
    \ 传递给视图\n  res.render('send', { csrfToken: req.csrfToken() })\n})\napplication.post('/process',\
    \ pForm, csrfProtection, function(req, res) {\n  res.send('数据正在处理中')\n})\n```\n\
    \n在你的视图中，`csrfToken` 的值应设置为隐藏输入字段 `_csrf` 的值。如下所示：\n\n```html\n<form action=\"\
    /process\" method=\"POST\">\n  <input type=\"hidden\" name=\"_csrf\" value=\"\
    {{csrfToken}}\">\n  最佳颜色: <input type=\"text\" name=\"bestColor\">\n  <button\
    \ type=\"submit\">提交</button>\n</form>\n```\n\n就是如此简单地完成。\n\n### 忽略路由\n\n对于请求将经过完全身份验证的网站\
    \ API 区域，CSRF 应该被禁用。可以通过 Express 的路由来忽略 CSRF。考虑下面的示例，展示了如何实现：\n\n```javascript\n\
    var cParser = require('cookie-parser')\nvar csrf = require('csurf')\nvar bParser\
    \ = require('body-parser')\nvar express = require('express')\n\n// 设置路由中间件\nvar\
    \ csrfProtection = csrf({ cookie: true })\nvar pForm = bParser.urlencoded({ extended:\
    \ false })\n\n// 创建一个 express 应用\nvar application = express()\n\n// 解析 cookies\n\
    // 这是必要的因为在 csrfProtection 中 \"cookie\" 为 true\napplication.use(cParser())\napplication.get('/form',\
    \ csrfProtection, function(req, res) {\n  // 将 csrfToken 传递给视图\n  res.render('send',\
    \ { csrfToken: req.csrfToken() })\n})\n\n// 在 csrf 之前挂载 api\napplication.use(api)\n\
    \n// 在挂载 \"/api\" 之后添加 csrf\napplication.use(csrfProtection)\n\napplication.get('/form',\
    \ function(req, res) {\n  // 将 csrfToken 传递给视图\n  res.render('send', { csrfToken:\
    \ req.csrfToken() })\n})\n\nfunction createApiRouter() {\n  var router = new express.Router()\n\
    \  router.post('/getProfile', function(req, res) {\n    res.send('没有 csrf 可获取')\n\
    \  })\n  return router\n}\n```\n\n方法如下。\n\n### 自定义错误处理\n\n当 CSRF 验证失败时，会抛出一个 `err.code\
    \ === 'EBADCFTOKEN'` 的错误。也可以用于显示错误消息。考虑下面的示例，展示了如何实现：\n\n```javascript\nvar bParser\
    \ = require('body-parser')\nvar cParser = require('cookie-parser')\nvar csrf =\
    \ require('csurf')\nvar express = require('express')\nvar application = express()\n\
    \napplication.use(bParser.urlencoded({ extended: false }))\napplication.use(cParser())\n\
    application.use(csrf({ cookie: true }))\n\n// 错误处理器\napplication.use(function\
    \ (error, req, res, next) {\n  if (error.code !== 'EBADCFTOKEN') return next(error)\n\
    \  // 在此处处理 CSRF 令牌错误\n  res.status(403)\n  res.send(' 表单已被篡改')\n})\n```\n\n方法如下。\n\
    \n"
- fmt: "\n# [Text body parser](https://github.com/expressjs/body-parser#bodyparsertextoptions)\n\
    \nTo install it, just execute the following command:\n\n```bash\nnpm install body-parser\n\
    ```\n\nTo use the API, include it in your program by use of the `require` command.\
    \ This is shown below:\n\n```javascript\nvar bParser = require('body-parser')\n\
    ```\n\nWith the object `bParser`, various factories are exposed for the purpose\
    \ of creation of middlewares. The property `req.body` will be populated by all\
    \ middlewares by use of the parsed body or an error will be parsed to the callback.\n\
    \nIn Express, a generic JSON and URL-encoded parser can be added as a top-level\
    \ middleware. With this, the bodies of all the incoming requests will be parsed.\
    \ Consider the simple example given below, which shows how this can be done:\n\
    \n```javascript\nvar express = require('express')\nvar bParser = require('body-parser')\n\
    var application = express()\n\n// parsing the application/x-www-form-urlencoded\n\
    application.use(bParser.urlencoded({ extended: false }))\n\n// parsing the application/json\n\
    application.use(bParser.json())\n\napplication.use(function (req, res) {\n  res.setHeader('Content-Type',\
    \ 'text/plain')\n  res.write('you posted:\\n')\n  res.end(JSON.stringify(req.body,\
    \ null, 2))\n})\n```\n\n## express route-specific\n\nBody parsers can be added\
    \ to the routes which need them. This is possible in Express and it can easily\
    \ be done. This is the most easy and recommended way that the `body-parser` can\
    \ be used in Express. Consider the example given below, which shows how this can\
    \ be done:\n\n```javascript\nvar express = require('express')\nvar bParser = require('body-parser')\n\
    var application = express()\n\n// creating an application/json parser\nvar jParser\
    \ = bodyParser.json()\n\n// creating an application/x-www-form-urlencoded parser\n\
    var urlenParser = bParser.urlencoded({ extended: false })\n\n// POST /login which\
    \ will get the urlencoded bodies\napplication.post('/login', urlenParser, function\
    \ (req, res) {\n  if (!req.body) return res.sendStatus(400)\n  res.send('welcome,\
    \ ' + req.body.username)\n})\n\n// POST /api/users will get the JSON bodies\n\
    application.post('/api/users', jParser, function (req, res) {\n  if (!req.body)\
    \ return res.sendStatus(400)\n  // create a user in the req.body\n})\n```\n\n\
    ### Changing the content type for parsers\n\nWith all parsers, a type option is\
    \ accepted and with this, the content-type will be changeable and this should\
    \ be the one to be parsed by the middleware. Consider the example given below,\
    \ which shows how this can be done:\n\n```javascript\n// parsing the various and\
    \ different custom JSON types as a JSON\napplication.use(bodyParser.json({ type:\
    \ 'application/*+json' }))\n\n// parsing a custom thing into the Buffer\napplication.use(bParser.raw({\
    \ type: 'application/vnd.custom-type' }))\n\n// parsing the HTML body into the\
    \ string\napplication.use(bParser.text({ type: 'text/html' }))\n```\n\n# Chapter\
    \ 12- Flash\n\nThis is the simplest manner in which Express can be implemented.\
    \ To install it, execute the following command:\n\n```bash\nnpm i flash\n```\n\
    \nConsider the example given below, which shows how this can be done:\n\n```javascript\n\
    application.use(session()); // the session middleware\napplication.use(require('flash')());\n\
    application.use(function (req, res) {\n  // flashing a message\n  req.flash('info',\
    \ 'hello there!');\n  next();\n})\n```\n\nConsider the second example given below:\n\
    \n```javascript\nfor msge in flash\na.alert(class='alert-' + msge.type)\np= message.msge\n\
    ```\n\nHere is the final example:\n\n```javascript\nwhile msge = flash.shift()\
    \ // consuming the messages as jade has read them\na.alert(class='alert-' + msge.type)\n\
    p= message.msge\n```\n\n### An array of f\n\nLash messages can be as shown below:\n\
    \n```json\n{\n  \"type\": \"info\",\n  \"message\": \"message\"\n}\n```\n\n# [method-override](https://github.com/expressjs/method-override)\n\
    \nThis is used for overriding HTTP verbs. With it, one can use HTTP verbs such\
    \ as `DELETE` and `PUT` in places where they are not supported by the client.\
    \ To install it in your system, execute the following command:\n\n```bash\nnpm\
    \ install method-override\n```\n\nFor this module to be used, you have to know\
    \ that a bit has to be used before any of the modules which are in need of the\
    \ request methods.\n\n### Using the header to override\n\nFor the header to be\
    \ used for overriding, the header name has to be specified as a string argument\
    \ to the function `methodOverride`. For the call to be made, the POST request\
    \ has to be sent to the URL having the header as the overridden method. Consider\
    \ the example given below showing, how this can be done:\n\n```javascript\nvar\
    \ connect = require('connect')\nvar mthdOverride = require('method-override')\n\
    \n// overriding with the X-HTTP-Method-Override header in our request\napplication.use(mthdOverride('X-HTTP-Method-Override'))\n\
    ```\n\nConsider the example given below, which shows how this can be used with\
    \ `XMLHttpRequest`:\n\n```javascript\nvar c = new XMLHttpRequest()\nc.onload =\
    \ onload\nc.open('post', '/resource', true)\nc.setRequestHeader('X-HTTP-Method-Override',\
    \ 'DELETE')\nc.send()\n\nfunction onload() {\n  alert('The response was obtained:\
    \ ')\n}\n```\n\n# Chapter 13- serve-favicon\n\nThis is a middleware used for the\
    \ purpose of favicons. The module can be installed into the system by executing\
    \ the following command:\n\n```bash\nnpm install serve-favicon\n```\n\nConsider\
    \ the example given below, showing how this can be done in express:\n\n```javascript\n\
    var express = require('express')\nvar favicon = require('serve-favicon')\nvar\
    \ application = express()\n\napplication.use(favicon(__dirname + '/public/favicon'))\n\
    \n// Addition of your routes should be done.\napplication.listen(3000)\n```\n\n\
    In connect, this can be done as follows:\n\n```javascript\nvar connect = require('connect')\n\
    var favicon = require('serve-favicon')\nvar application = connect()\n\napplication.use(favicon(__dirname\
    \ + '/public/favicon'))\n\n// Addition of your routes should be done.\napplication.listen(3000)\n\
    ```\n\n### vanilla http server\n\nThis is a type of middleware which can be used\
    \ everywhere. The example given below shows how this can be done with http:\n\n\
    ```javascript\nvar http = require('http')\nvar favicon = require('serve-favicon')\n\
    var fnhandler = require('finalhandler')\n\nvar _favicon = favicon(__dirname +\
    \ '/public/favicon')\n\nvar server = http.createServer(function (req, res) {\n\
    \  var done = fnhandler(req, res)\n\n  _favicon(req, res, function (err) {\n \
    \   if (err) return done(err)\n    // responding to the request\n    res.statusCode\
    \ = 404\n    res.end('')\n  })\n})\n\nserver.listen(3000)\n```\n\n# Chapter 14-\
    \ response-time\n\nThis is the node.js response time header. It works by creating\
    \ a middleware for recording the response time of its requests in the HTTP servers.\
    \ The response time in this case will be the time when the request has entered\
    \ the middleware to the time when the headers have been written to the client.\n\
    \nThis module can be installed by executing the following command:\n\n```bash\n\
    npm install response-time\n```\n\nThe module can be included into the program\
    \ by use of the `require` keyword as shown below:\n\n```javascript\nvar respTime\
    \ = require('response-time')\n```\n\nConsider the example given below, showing\
    \ how this can be used in both the Express and the connect:\n\n```javascript\n\
    var express = require('express')\nvar respTime = require('response-time')\nvar\
    \ application = express()\n\napplication.use(respTime())\n\napplication.get('/',\
    \ function (req, res) {\n  res.send('hello, there!')\n})\n```\n\n### That is how\
    \ it can be used.\n\n### vanilla http server\n\nThis can be used as follows:\n\
    \n```javascript\nvar finalhandler = require('finalhandler')\nvar http = require('http')\n\
    var respTime = require('response-time')\n\nvar _responseTime = respTime()\n\n\
    http.createServer(function (req, res) {\n  var done = fnhandler(req, res)\n\n\
    \  _responseTime(req, res, function (err) {\n    if (err) return done(err)\n \
    \   // responding to the request\n    res.setHeader('content-type', 'text/plain')\n\
    \    res.end('hello, there!')\n  })\n}).listen(3000)\n```\n"
  raw: '*   [Text body parser](https://github.com/expressjs/body-parser#bodyparsertextoptions)


    To install it, just execute the following command:


    $ npm install body-parser


    To use the API, include it in your program by use of the “require” command. This
    is shown below:


    var bParser =  require(''body-parser'')


    With the object “bParser,” various factories are exposed for the purpose of creation
    of middlewares. The property “req.body” will be populated by all middlewares by
    use of the parsed body or an error will be parsed to the callback.


    In Express, a generic JSON and URL-encoded parser can be added as a top-level
    middleware. With this, the bodies of all the incoming requests will be parsed.
    Consider the simple example given below, which shows how this can be done:


    var express =  require(''express'')


    var bParser =  require(''body-parser'')


    var application = express()


    // parsing the application/x-www-form-urlencoded


    application.use(bParser.urlencoded({ extended:  false }))


    // parsing the application/json


    application.use(bParser.json())


    application.use(function (req, res) {


    res.setHeader(''Content-Type'', ''text/plain'')


    res.write(''you posted:\n'')


    res.end(JSON.stringify(req.body, null, 2))


    })


    ### express route-specific


    Body parsers can be added to the routes which need them. This is possible in Express
    and it can easily be done. This is the most easy and recommended way that  the
    body-parser can be used in Express. Consider the example given below, which shows
    how this can be done:


    var express =  require(''express'')


    var bParser =  require(''body-parser'')


    var application = express()


    // creating an application/json parser


    var jParser = bodyParser.json()


    // creating an application/x-www-form-urlencoded parser


    var urlenParser = bParser.urlencoded({ extended:  false })


    // POST /login which will get the urlencoded bodies


    application.post(''/login'', urlenParser, function (req, res) {


    if (!req.body) return res.sendStatus(400)


    res.send(''welcome, '' + req.body.username)


    })


    // POST /api/users will get the JSON bodies


    application.post(''/api/users'', jParser, function (req, res) {


    if (!req.body) return res.sendStatus(400)


    // create a user in the req.body


    })


    Changing the content type for parsers


    With all parsers, a type option is accepted and with this, the content-type will
    be changeable and this should be the one to be parsed by the middleware. Consider
    the example given below, which shows how this can be done:


    // parsing the various and different custom JSON types as a JSON


    application.use(bodyParser.json({ type: ''application/*+json'' }))


    // parsing a custom thing into the Buffer


    application.use(bParser.raw({ type: ''application/vnd.custom-type'' }))


    // parsing the HTML body into the string


    application.use(bParser.text({ type: ''text/html'' }))


    # Chapter 12- Flash


    This is the simplest manner in which Express can be implemented. To install it,
