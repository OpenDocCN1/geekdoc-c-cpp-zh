- fmt: "\nFor you to catch the errors which are originating from the `Multer`, just\
    \ call the middleware function on your own. This is shown in the example given\
    \ below:\n\n```javascript\nvar uploadfile = multer().single('avatar')\n\napplication.post('/profile',\
    \ function (req, res) {\n  uploadfile(req, res, function (error) {\n    if (error)\
    \ {\n      // An error has occurred when uploading\n      return\n    }\n    //\
    \ Everything was okay\n  })\n})\n```\n\nThat is how it can be used.\n\n# Chapter\
    \ 9- Compression\n\nThis is middleware available in Node.js. It supports the following\
    \ compression codes:\n\n*   `deflate`\n*   `gzip`\n\nTo install this middleware\
    \ in your system, execute the following command:\n\n```bash\n$ npm install compression\n\
    ```\n\nTo include this API in your program, use the `require` keyword as shown\
    \ below:\n\n```javascript\nvar compression = require('compression')\n```\n\nThere\
    \ are different options which can be used so as to return the compression middleware.\n\
    \n### .filter\n\nThis is the default filter function. It is used for construction\
    \ of a custom filter function which will be an extension of our default function.\
    \ The example given below shows how this can be used:\n\n```javascript\napplication.use(compression({filter:\
    \ compress}))\n\nfunction compress(req, res) {\n  if (req.headers['x-no-compression'])\
    \ {\n    // responses having this header request should not be compressed.\n \
    \   return false\n  }\n  // fallback to standard filter function\n  return compression.filter(req,\
    \ res)\n}\n```\n\n`red.flush()`\n\nWith this module, the response which has been\
    \ compressed partially is flushed to the client. Let us give examples of these.\n\
    \n### express/connect\n\nThis module can be used by use of the `app.use`, which\
    \ is available in either Express and connect. Requests passed through the middleware\
    \ are always compressed. Consider the example given below which shows how this\
    \ can be done:\n\n```javascript\nvar compression = require('compression')\nvar\
    \ express = require('express')\nvar application = express()\n\n// compressing\
    \ all of the requests\napplication.use(compression())\n\n// adding all the routes\n\
    ```\n\nThat is how it can be done.\n\n### Server-Sent Events\n\nThe working of\
    \ this module with server-side is not done out of the box. For content to be compressed,\
    \ a window for the output has to be buffered up so that we can get a good compression.\n\
    \nTo do all this, we have to call the `red.flush()` for those who need the data\
    \ written so as to make to our client. This is shown below:\n\n```javascript\n\
    var compression = require('compression')\nvar express = require('express')\nvar\
    \ application = express()\n\n// compressing the responses\napplication.use(compression())\n\
    \n// the server-sent event stream\napplication.get('/events', function (req, res)\
    \ {\n  res.setHeader('Content-Type', 'text/event-stream')\n  res.setHeader('Cache-Control',\
    \ 'no-cache')\n  // sending a ping approx after every 2 seconds\n  var timer =\
    \ setInterval(function () {\n    res.write('data: ping\\n\\n')\n    // !!! our\
    \ most important part for the program\n    res.flush()\n  }, 2000)\n  res.on('close',\
    \ function () {\n    clearInterval(timer)\n  })\n})\n```\n\n# Chapter 10- csurf\n\
    \nThis is a token middleware for CSRF. It acts as a middleware for protection\
    \ purposes. For it to be used, one has to begin by initializing a cookie-parser\
    \ or a session middleware. It can be installed into one’s computer by executing\
    \ the following command:\n\n```bash\n$ npm install csurf\n```\n\nTo use the API\
    \ in your program, use the `require` command as shown below:\n\n```javascript\n\
    var csurf = require('csurf')\n```\n\nThat is how it can be included into the program.\n\
    \nThe options for this module take multiple and different objects which you can\
