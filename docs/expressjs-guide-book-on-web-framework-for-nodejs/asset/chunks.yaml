    With Multer, an options object is accepted, in which the most basic one is our
    “dest” property, and it specifies the destination of our uploaded files. If the
    options object is omitted, the files which you upload will be kept in the memory
    other than in the disk.


    To avoid conflicts brought by naming, the Multer will rename the files and this
    is its default setting. The rest of the function can be customized according to
    what you need.


    There exists a variety of options which can be passed to the Multer, so make sure
    that you understand how these can be passed.


    In a normal web application, only the “dest” property might be required, and this
    can be configured as shown below:


