  trans: "\n\n你必须注意，整个话对象（session object）将被编码并存储在 cookie 中。不同浏览器的 cookie 最大大小限制可能会被超过。如果话对象足够大，并在编码后超过了浏览器的限制，在大多数情况下，浏览器将拒绝或避免存储该\
    \ cookie。\n\n# 第 5 章- ExpressJS 中的 Morgan\n\n这是一个用于 Node.js HTTP 请求的日志中间件。要在你的程序中使用该\
    \ API，你需要像下面所示使用 `require` 关键字：\n\n```javascript\nvar morgan =  require('morgan')\n\
    ```\n\n使用以下格式来创建它：\n\n### `morgan(format, options)`\n\n如上述格式所示，我们有两个参数或参数。\n\n\
    Morgan 在 `options` 对象中接受以下属性：\n\n#### Immediate（立即）\n\n日志行应该在请求时写入，而不是在响应时写入。这意味着即使服务器本身崩溃，请求也始终会被记录，但我们无法记录来自响应的数据。\n\
    \n#### Skip（跳过）\n\n这是一个函数，用于确定是否跳过日志记录。默认值为 `false`。请考虑下例示例，它展示了如何调用该函数：\n\n```javascript\n\
    // 示例：仅记录错误响应的日志\nmorgan('combined', {\nskip:  function (req, res) { return res.statusCode\
    \ <  400 }\n})\n```\n\n#### Stream（流）\n\n这是一个用于写入日志行的输出流，其默认值为 `process.stdout`。\n\
    \n考虑下例示例，它展示了如何以 Apache 组合格式将所有请求记录到 STDOUT。示例如下：\n\n```javascript\nvar express\
    \ =  require('express')\nvar morgan =  require('morgan')\nvar application = express()\n\
    \napplication.use(morgan('combined'))\n\napplication.get('/', function (req, res)\
    \ {\n  res.send('hello, there!')\n})\n```\n\n### 原生 http 服务器\n\n下面提供了一个演示如何实现此操作的示例：\n\
    \n```javascript\nvar fhandler =  require('finalhandler')\nvar http =  require('http')\n\
    var morgan =  require('morgan')\n// 创建“中间件”\nvar logger = morgan('combined')\n\
    \nhttp.createServer(function (req, res) {\n  var done = finalhandler(req, res)\n\
    \  logger(req, res, function (error) {\n    if (error) return done(error)\n  \
    \  // 响应请求\n    res.setHeader('content-type', 'text/plain')\n    res.end('hello,\
    \ there!')\n  })\n})\n```\n\n#### 将日志写入文件\n\n考虑下例示例，它展示了如何以 Apache 组合格式将请求记录到我们的文件\
    \ `access.log` 中：\n\n```javascript\nvar express =  require('express')\nvar fs\
    \ =  require('fs')\nvar morgan =  require('morgan')\nvar application = express()\n\
    \n// 创建一个写入流（追加模式）\nvar aLogStream = fs.createWriteStream(__dirname  + '/access.log',\
    \ {flags: 'a'})\n\n// 设置记录器\napplication.use(morgan('combined', {stream: aLogStream}))\n\
    application.get('/', function (req, res) {\n  res.send('hello, there!')\n})\n\
    ```\n\n#### 日志文件轮转\n\n在下例示例中，应用程序将使用 `file-stream-rotator` 模块以 Apache 组合格式将所有请求记录到我们目录\
    \ `log/` 中的任何一个日志文件中。示例所示：\n\n```javascript\nvar FStreamRotator =  require('file-stream-rotator')\n\
    var express =  require('express')\nvar fs =  require('fs')\nvar morgan =  require('morgan')\n\
    var application = express()\nvar lDirectory =  __dirname  + '/log'\n\n// 确保日志目录存在\n\
    fs.existsSync(lDirectory) || fs.mkdirSync(lDirectory)\n\n// 创建轮转写入流\nvar aLogStream\
    \ = FStreamRotator.getStream({\n  filename: lDirectory + '/access-%DATE%.log',\n\
    \  frequency: 'daily',\n  verbose:  false\n})\n\n// 设置记录器\napplication.use(morgan('combined',\
    \ {stream: aLogStream}))\napplication.get('/', function (req, res) {\n  res.send('hello,\
    \ there!')\n})\n```\n\n#### 自定义 token 格式\n\n在下一个应用中，我们将使用自定义 token 格式。它的工作原理为所有请求添加一个\
    \ ID，然后通过 `:id` token 显示它。以下是该应用：\n\n```javascript\nvar express =  require('express')\n\
    var morgan =  require('morgan')\nvar id =  require('node-uuid')\n\nmorgan.token('id',\
    \ function getId(req) {\n  return req.id\n})\n\nvar application = express()\n\
    application.use(assignid)\napp.use(morgan(':id :method :url :response-time'))\n\
    app.get('/', function (req, res) {\n  res.send('hello, world!')\n})\n\nfunction\
    \ assignId(req, res, next) {\n  req.id  = uuid.v4()\n  next()\n}\n```\n\n# 第 6\
    \ 章- CORS\n\n这是一个 Node.js 包，提供了一个 ExpressJS/Connect 中间件，用于启用 CORS 的各种选项。\n\n要通过\
    \ npm 命令安装它，请执行下面的命令：\n\n```bash\n$ npm install cors\n```\n\n可以像下面所示使用：\n\n```javascript\n\
    var express =  require('express')\nvar cors =  require('cors')\nvar application\
    \ = express()\n\napplication.use(cors())\n\napplication.get('/', function (req,\
    \ res) {\n  res.send('hello, world!')\n})\n```\n\n```\n路由\n```\n\n#### 为所有路由启用\
    \ CORS\n```javascript\nvar express =  require('express')\nvar cors =  require('cors')\n\
    var application = express()\n\napplication.use(cors())\n\napplication.get('/',\
    \ function (req, res) {\n  res.send('hello, world!')\n})\n```\n\n#### 为特定路由启用\
    \ CORS\n```javascript\nvar express =  require('express')\nvar cors =  require('cors')\n\
    var application = express()\n\napplication.get('/products/:id', cors(), function\
    \ (req, res) {\n  res.send('hello, world!')\n})\n```\n\n#### 为单条路由启用 CORS\n```javascript\n\
    var express =  require('express')\nvar cors =  require('cors')\nvar application\
    \ = express()\n\napplication.get('/products/:id', cors(), function (req, res)\
    \ {\n  res.send('hello, world!')\n})\n```\n\n#### 配置 CORS\n```javascript\nvar\
    \ express =  require('express')\nvar cors =  require('cors')\nvar application\
    \ = express()\n\nvar cOptions = {\n  origin: 'http://sample.com'\n};\n\napplication.get('/products/:id',\
    \ cors(cOptions), function (req, res) {\n  res.send('hello, world!')\n})\n```\n\
    \n#### 动态源配置 CORS\n```javascript\nvar express =  require('express')\nvar cors\
    \ =  require('cors')\nvar application = express();\n\nvar whitelist = ['http://sample1.com',\
    \ 'http://sample2.com'];\n\nvar cOptions = {\n  origin: function(origin, callback){\n\
    \    var orIsitelisted = whitelist.indexOf(origin) !== -1;\n    callback(null,\
    \ orIsitelisted);\n  }\n};\n\napplication.get('/products/:id', cors(cOptions),\
    \ function (req, res) {\n  res.send('hello, world!')\n})\n```\n\n### 如何启用 CORS\
    \ 预检（Pre-Flight）\n\n某些 CORS 请求被认为是复杂的，这些请求需要初始的 OPTIONS 请求。使用 HTTP 方法的 CORS 请求与使用\
    \ POST/GET/HEAD 或自定义标头的请求相比是复杂的。为了启用预检，必须为需要支持的路由添加新的 OPTIONS 处理器。所示：\n\n```javascript\n\
    var express =  require('express')\nvar cors =  require('cors')\nvar application\
    \ = express();\n\napplication.options('/products/:id', cors()); // 为 DELETE 请求启用预检请求\n\
    application.del('/products/:id', cors(), function(req, res, next){\n  res.send('hello,\
    \ world!')\n});\n```\n\n预检也可以在全局范围内启用，如下所示：\n\n```javascript\napplication.options('*',\
    \ cors()); // 在其他路由之前包含\n```\n\n#### CORS 的异步配置\n\n```javascript\nvar express\
    \ =  require('express')\nvar cors =  require('cors')\nvar application = express();\n\
    \nvar whitelist = ['http://sample1.com', 'http://sample2.com'];\n\nvar cOptionsDelegate\
    \ =  function(req, callback){\n  var cOptions;\n  if(whitelist.indexOf(req.header('Origin'))\
    \ !== -1){\n    cOptions = { origin:  true }; // 在我们的 CORS 响应中反射（启用）请求的源\n  }else{\n\
    \    cOptions = { origin:  false }; // 禁用我们请求的 CORS\n  }\n  callback(null, cOptions);\n\
    }\n\napplication.get('/products/:id', cors(cOptionsDelegate), function (req, res)\
    \ {\n  res.send('hello, world!')\n})\n```\n\n"
- fmt: "\n```javascript\ncallback(null, cOptions); // callback needs two parameters:\
    \ error and the options\n\n};\n\napplication.get('/products/:id', cors(cOptionsDelegate),\
    \ function(req, res, next){\n\n  res.json({msg: 'This has CORS enabled for the\
    \ whitelisted domain.'});\n\n});\n\napplication.listen(80, function(){\n\n  console.log('\
    \ web server  with CORS enabled is listening on port 80');\n\n});\n```\n\nThat\
    \ is how it can be done.\n\n# Chapter 7- Express-Paginate\n\nThis is to be used\
    \ together with the pagination plugins for databases such as the MongoDB.\n\n\
    To install, execute the command given below:\n\n```bash\nnpm install -S express-paginate\n\
    ```\n\nFor it to be used in the program, one has to use the “require” keyword\
    \ so as to include it into the program This is shown below:\n\n```javascript\n\
    var paginate = require('express-paginate');\n```\n\nWith `paginate`, a new instance\
    \ of `express-paginate` will be created. Consider the example given below:\n\n\
    ```javascript\n// # app.js\n\nvar express = require('express');\n\nvar paginate\
    \ = require('express-paginate');\n\nvar application = express();\n\n// keeping\
    \ this before all the routes that will use pagination\n\napplication.use(paginate.middleware(10,\
    \ 50));\n\napplication.get('/users', function(req, res, next) {\n  // we are assuming\
    \ that `Users`was previously defined in our example\n  // as `var Users = database.model('Users')`\
    \ for those using `mongoose`\n  // and that the Mongoose plugin `mongoose-paginate`\
    \ has been added.\n  // to the model for Users via the `User.plugin(require('mongoose-paginate'))`\n\
    \  Users.paginate({}, { page: req.query.page, limit: req.query.limit }, function(error,\
    \ users, pageCount, itemCount) {\n    if (error) return next(error);\n    res.format({\n\
    \      html: function() {\n        res.render('users', {\n          users: users,\n\
    \          pageCount: pageCount,\n          itemCount: itemCount\n        });\n\
    \      },\n      json: function() {\n        // Created by the API response for\
    \ list objects\n        res.json({\n          object: 'list',\n          has_more:\
