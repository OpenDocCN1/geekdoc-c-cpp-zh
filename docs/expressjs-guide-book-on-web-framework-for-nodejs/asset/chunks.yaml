    # [method-override](https://github.com/expressjs/method-override)


    This is used for overriding HTTP verbs. With it, one can use HTTP verbs such as
    “DELETE” and “PUT” in places where they are not supported by the client. To install
    it in your system, execute the following command:


    $ npm install method-override


    For this module to be used, you have to know that a bit has to be used before
    any of the modules which are in need of the request methods.


    Using the header to override


    For the header to be used for overriding, the header name has to be specified
