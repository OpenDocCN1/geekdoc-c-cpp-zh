- "# Express.js：Node.js Web 框架指南\n\n\n\n![](img/00001.jpeg)\n\n\n\n\n# 引言\nExpressJS\
  \ 是 Node 中最实用且有趣的框架之一。它被用于 Web 和移动应用程序的开发。这类应用程序在软件环境中使用最为广泛。这表明你有必要了解如何使用该框架进行开发。该框架拥有众多模块，可用于增强应用程序的视觉效果和体验。\n\
  \n# 第 1 章- ExpressJS 概述\nExpressJS 是一个非常灵活的 Node 框架，为开发者开发 Web 和移动应用程序提供了许多功能。该框架可用于开发\
  \ API。在书中，我们将讨论 ExpressJS 的各种特性。\n\n# 第 2 章- Session（会话）\n若要在 Express 中安装此功能，只需执行以下命令：\n\
  \n```\nnpm install express-session\n```\n\n上述命令将 session 安装到你的系统中。要在你的程序中使用它，你必须使用\
  \ `require` 命令。如下所示：\n\n```javascript\nvar session = require('express-session')\n\
  ```\n\n可以通过给定的 `options` 创建 session 中间件。你应该知道，会话数据不应该保存在 cookie 中，但在这里只存储了 session\
  \ ID。会话数据存储在应用程序的服务器端。然而，`MemoryStore`（默认的服务器端会话存储）并不是为生产环境设计的。在大多数情况下，它会发生内存泄漏，且无法扩展到单个进程之外。它是为了调试目的而开发的。\n\
  \n`express-session` 接受 options 对象中的以下属性：\n\n## Cookie\n这些是会话 ID Cookie 的设置。考虑下例示例：\n\
  \n```javascript\n{ path: '/', httpOnly: true, secure: false, maxAge: null }\n```\n\
  \n## Genid\n这是一个用于生成新 session ID 的函数。提供的函数应该返回一个将用作 session ID 的字符串。如果在生成 ID 时需要向\
  \ `req` 附加值，则会将 `req` 作为第一个参数传递给函数。该默认值是一个函数，可以使用 `uid2` 来生成 ID。\n\n注意：为了避免会话冲突，请确保生成的\
  \ ID 是唯一的，即它们之间应该是不同的。考虑下例示例，展示了如何实现这一点：\n\n```javascript\napplication.use(session({\n\
  \    genid: function(req) {\n        return genuuid()\n    },\n    secret: ' my\
  \ secret '\n}))\n```\n\n## Name\n这是设置在响应中的 session cookie 的名称。注意，它是从请求中读取的。默认值为\
  \ `connect.sid`。对于那些在相同主机上运行多个应用程序的用户来说，session cookie 必须分开。为了实现这一点，必须在每个应用程序中设置不同的名称。\n\
  \n## Proxy\n当你设置安全 cookie（secure cookies）时，必须信任反向代理。这可以通过标头 `X-Forwarded-Proto`\
  \ 实现。默认值为 `undefined`。其可能的值解释如下：\n1. `true` - 将使用标头 `X-Forwarded-Proto`。\n2. `false`\
  \ - 所有标头将被忽略，只有当存在直接的 `TLS/SSL` 连接时才会考虑连接。\n3. `undefined` - 将使用 Express 自身的 `trust\
  \ proxy` 设置。\n\n## Resave\n强制将 session 保存回会话存储器。无论 session 是否被修改，这都会发生。其必要性取决于你的会话存储。然而，如果客户端发出并行请求，可能会产生竞态条件。\n\
  \n## Rolling\n将在每个响应中强制设置 cookie。过期日期也会重置。默认值为 `false`。\n\n## SaveUninitialized\n\
  通过此设置，未初始化的 session 将保存到会话存储器。未初始化的 session 是一个新的且未以任何方式修改的会话。默认设置为 `true`。然而，此设置已弃用，并预计在未来发生变化。\n\
  \n## Required option\n这是用于对 session ID cookie 进行签名的密钥（secret）。它可以由密钥数组组成，也可以是单个密钥的字符串。如果你提供密钥数组，则只有数组中的第一个元素将用于对\
  \ session ID cookie 进行签名。其余元素将用于对请求中的签名进行验证。\n\n## Store\n这是会话存储器的实例。它的默认值是一个新的\
  \ `MemoryStore` 实例。\n\n考虑下示例：\n\n```javascript\nvar application = express()\napplication.set('trust\
  \ proxy', 1) // 信任第一个代理\napplication.use(session({\n    secret: 'my secret',\n \
  \   resave: false,\n    saveUninitialized: true,\n    cookie: { secure: true }\n\
  }))\n```\n\n我们需要能够在生产环境中使用 cookie，同时允许在开发环境中进行测试。这种设置可以通过 `NODE_ENV` 启用。考虑下例示例，展示了如何实现这一点：\n\
  \n```javascript\nvar application = express()\nvar session = {\n    secret: ' my\
  \ secret ',\n    cookie: {}\n}\n```\n\n\n\n\n\n```javascript\nif (application.get('env')\
  \ === 'production') {\n  application.set('trust proxy', 1) // 信任第一个代理\n  session.cookie.secure\
  \ = true // 开启安全 cookie\n}\napplication.use(session(session))\n```\n\n `cookie.maxAge`\
  \ 的默认设置为 `null`，它永远不会过期，这意味着该 cookie 将成为浏览器会话 cookie。只有当用户关闭浏览器后，cookie 才会被移除。同时\
  \ session 也会被移除。\n\n`req.session`\n\n为了存储和访问 session 数据，你应该使用 `req.session` 属性，store\
  \ 会将其初始化为 JSON。随后 session 对象将保持正常状态。考虑下面给出的示例，它展示了一个特定于用户的访问计数器：\n\n```javascript\n\
  application.use(session({ secret: ' my secret ', cookie: { maxAge: 50000 }}))\n\n\
  application.use(function(req, res, next) {\n  var session = req.session\n  if (session.views)\
  \ {\n    session.views++\n    res.setHeader('Content-Type', 'text/html')\n    res.write('<p>views:\
  \ ' + session.views + '</p>')\n    res.write('<p>will expires in: ' + (session.cookie.maxAge\
  \ / 1000) + 's</p>')\n    res.end()\n  } else {\n    session.views = 1\n    res.end('\
  \ This is a demo for sessions. Refresh the page!')\n  }\n})\n```\n\n## Session.regenerate()\n\
  \n当我们需要生成 session 时，会调用此方法。之后，一个新的 session 实例和 SID 将在 `req.session` 中初始化。如下：\n\n\
  ```javascript\nreq.session.regenerate(function(error) {\n  // 在此处应该添加一个新的 session\n\
  })\n```\n\n## Session.destroy()\n\n通过此方法，session 将被销毁，`req.session` 也被移除。它将在下一次请求中被重新生成。如下所示：\n\
  \n```javascript\nreq.session.destroy(function(error) {\n  // 在此处无法访问 session。\n\
  })\n```\n\n## Session.reload()\n\n这用于重新加载 session，如下所示：\n\n```javascript\nreq.session.reload(function(error)\
  \ {\n  // session 已经更新\n})\n```\n\n## Session.save()\n\n这用于保存 session，如下所示：\n\n\
  ```javascript\nreq.session.save(function(error) {\n  // session 已保存\n})\n```\n\n\
  考虑下面给出的示例，它使用了 `express-session` 来存储用户的页面访问：\n\n```javascript\nvar express = require('express')\n\
  var purl = require('parseurl')\nvar session = require('express-session')\nvar application\
  \ = express()\n\napplication.use(session({\n  secret: ' my secret ',\n  resave:\
  \ false,\n  saveUninitialized: true\n}))\n\napplication.use(function (req, res,\
  \ next) {\n  var vws = req.session.views\n  if (!vws) {\n    vws = req.session.views\
  \ = {}\n  }\n  // 获取 url 路径\n  var pathname = purl(req).pathname\n  // 计数访问\n  vws[pathname]\
  \ = (vws[pathname] || 0) + 1\n  next()\n})\n\napplication.get('/foo', function (req,\
  \ res, next) {\n  res.send('you have viewed this page ' + req.session.vws['/test']\
  \ + ' times')\n})\n\napplication.get('/bar', function (req, res, next) {\n  res.send('you\
  \ have viewed this page ' + req.session.vws['/bar'] + ' times')\n})\n```\n\n这就是在\
  \ ExpressJS 中使用 session 的。\n\n# 第 3 章- serve-index\n\n这用于向特定路径提供带有目录列表的页面。可以通过执行以下命令进行安装：\n\
  \n`$ npm install serve-index`\n\n上述命令将 `serve-index` 安装到你的电脑上。要在你的程序中使用它，必须通过 `require`\
  \ 方法进行包含或调用。如下所示：\n\n```javascript\nvar svIndex = require('serve-index')\n```\n\n\
  API 将被包含在你的程序中。\n\n## serveIndex(path, options)\n\n这将返回一个中间件，用于提供你给给 `path` 目录的索引。这里的路径基于\
  \ `req.url` 的值。如果你想更改 URL 基础，请使用 `app.use`。\n\nserve index 的 options 对象接受以下属性：\n\
  \n**Filter（过滤器）**\n此过滤器函数应用于文件。其默认值为 `false`。它会为每个文件调用一次，使用的签名是 `filter(filename,\
  \ index, files, dir)`。`filename` 是文件名，`index` 是数组索引，`files` 是文件数组，而 `dir` 是文件所在的绝对路径。\n\
  \n**Hidden（隐藏文件）**\n这用于显示隐藏文件。其默认值为 `false`。\n\n**Icons（图标）**\n这用于显示图标。其默认值为 `false`。\n\
  \n**Stylesheet（样式表）**\n这是一个指向 CSS 样式表的可选路径。其默认值是内置的样式表。\n\n**Template（模板）**\n这是一个指向\
  \ HTML 模板的可选路径，用于渲染 HTML 字符串。\n\n**View（视图）**\n这是显示模式。\n\n# 第 4 章- cookie Sessions\n\
  \n这是一个用于提供 session 的模块，以便无论访问者是否已验证都拥有一个 session。为了在程序中使用该 API，我们必须使用如下所示的 `require`\
  \ 命令：\n\n`var session = require(')`\n\nsession 对象接受以下选项：\n\n**Name（名称）**\n这是 cookie\
  \ 的名称。其默认值为 `session`。\n\n**Keys（密钥）**\n这是用于签名和验证 cookie 的密钥列表。设置的 cookie 总是使用 `keys[0]`\
  \ 进行签名。其余密钥将用于验证，这将允许进行轮换。\n\n**Secret（密钥）**\n在未提供 `keys` 的情况下，此字符串将作为密钥使用。你还需要知道一些\
  \ cookie 选项。\n\n如果你需要删除特定的 session，请如下操作：\n\n`req.session = null`\n\n考虑下面简单的计数器示例。示例如下：\n\
  \n```javascript\nvar cookieSession = require('cookie-session')\nvar express = require('express')\n\
  var application = express()\n\napplication.set('trust proxy', 1) // 信任第一个代理\n\n\
  application.use(cookieSession({\n  name: 'session',\n  keys: ['key1', 'key2']\n\
  }))\n\napplication.use(function (req, res, next) {\n  // 更新访问次数\n  req.session.views\
  \ = (req.session.views || 0) + 1\n  // 写入响应\n  res.end(req.session.views + ' views')\n\
  })\n\napplication.listen(3000)\n```\n\n考虑下一个给出的示例：\n\n```javascript\nvar cookieSession\
  \ = require('cookie-session')\nvar express = require('express')\nvar application\
  \ = express()\n\napplication.set('trust proxy', 1) // 信任第一个代理\n\napplication.use(cookieSession({\n\
  \  name: 'session',\n  keys: ['key1', 'key2']\n}))\n\n// 这允许你设置 req.session.maxAge，以便某些\
  \ session 拥有与默认不同的值。\n\napplication.use(function (req, res, next) {\n  req.sessionOptions.maxAge\
  \ = req.session.maxAge || req.sessionOptions.maxAge\n})\n\n// ... 此处应该添加逻辑 ...\n\
  ```\n\n\n\n你必须注意，整个话对象（session object）将被编码并存储在 cookie 中。不同浏览器的 cookie 最大大小限制可能会被超过。如果话对象足够大，并在编码后超过了浏览器的限制，在大多数情况下，浏览器将拒绝或避免存储该\
  \ cookie。\n\n# 第 5 章- ExpressJS 中的 Morgan\n\n这是一个用于 Node.js HTTP 请求的日志中间件。要在你的程序中使用该\
  \ API，你需要像下面所示使用 `require` 关键字：\n\n```javascript\nvar morgan =  require('morgan')\n\
  ```\n\n使用以下格式来创建它：\n\n## `morgan(format, options)`\n\n如上述格式所示，我们有两个参数或参数。\n\nMorgan\
  \ 在 `options` 对象中接受以下属性：\n\n### Immediate（立即）\n\n日志行应该在请求时写入，而不是在响应时写入。这意味着即使服务器本身崩溃，请求也始终会被记录，但我们无法记录来自响应的数据。\n\
  \n### Skip（跳过）\n\n这是一个函数，用于确定是否跳过日志记录。默认值为 `false`。请考虑下例示例，它展示了如何调用该函数：\n\n```javascript\n\
  // 示例：仅记录错误响应的日志\nmorgan('combined', {\nskip:  function (req, res) { return res.statusCode\
  \ <  400 }\n})\n```\n\n### Stream（流）\n\n这是一个用于写入日志行的输出流，其默认值为 `process.stdout`。\n\
  \n考虑下例示例，它展示了如何以 Apache 组合格式将所有请求记录到 STDOUT。示例如下：\n\n```javascript\nvar express\
  \ =  require('express')\nvar morgan =  require('morgan')\nvar application = express()\n\
  \napplication.use(morgan('combined'))\n\napplication.get('/', function (req, res)\
  \ {\n  res.send('hello, there!')\n})\n```\n\n## 原生 http 服务器\n\n下面提供了一个演示如何实现此操作的示例：\n\
  \n```javascript\nvar fhandler =  require('finalhandler')\nvar http =  require('http')\n\
  var morgan =  require('morgan')\n// 创建“中间件”\nvar logger = morgan('combined')\n\n\
  http.createServer(function (req, res) {\n  var done = finalhandler(req, res)\n \
  \ logger(req, res, function (error) {\n    if (error) return done(error)\n    //\
  \ 响应请求\n    res.setHeader('content-type', 'text/plain')\n    res.end('hello, there!')\n\
  \  })\n})\n```\n\n### 将日志写入文件\n\n考虑下例示例，它展示了如何以 Apache 组合格式将请求记录到我们的文件 `access.log`\
  \ 中：\n\n```javascript\nvar express =  require('express')\nvar fs =  require('fs')\n\
  var morgan =  require('morgan')\nvar application = express()\n\n// 创建一个写入流（追加模式）\n\
  var aLogStream = fs.createWriteStream(__dirname  + '/access.log', {flags: 'a'})\n\
  \n// 设置记录器\napplication.use(morgan('combined', {stream: aLogStream}))\napplication.get('/',\
  \ function (req, res) {\n  res.send('hello, there!')\n})\n```\n\n### 日志文件轮转\n\n\
  在下例示例中，应用程序将使用 `file-stream-rotator` 模块以 Apache 组合格式将所有请求记录到我们目录 `log/` 中的任何一个日志文件中。示例所示：\n\
  \n```javascript\nvar FStreamRotator =  require('file-stream-rotator')\nvar express\
  \ =  require('express')\nvar fs =  require('fs')\nvar morgan =  require('morgan')\n\
  var application = express()\nvar lDirectory =  __dirname  + '/log'\n\n// 确保日志目录存在\n\
  fs.existsSync(lDirectory) || fs.mkdirSync(lDirectory)\n\n// 创建轮转写入流\nvar aLogStream\
  \ = FStreamRotator.getStream({\n  filename: lDirectory + '/access-%DATE%.log',\n\
  \  frequency: 'daily',\n  verbose:  false\n})\n\n// 设置记录器\napplication.use(morgan('combined',\
  \ {stream: aLogStream}))\napplication.get('/', function (req, res) {\n  res.send('hello,\
  \ there!')\n})\n```\n\n### 自定义 token 格式\n\n在下一个应用中，我们将使用自定义 token 格式。它的工作原理为所有请求添加一个\
  \ ID，然后通过 `:id` token 显示它。以下是该应用：\n\n```javascript\nvar express =  require('express')\n\
  var morgan =  require('morgan')\nvar id =  require('node-uuid')\n\nmorgan.token('id',\
  \ function getId(req) {\n  return req.id\n})\n\nvar application = express()\napplication.use(assignid)\n\
  app.use(morgan(':id :method :url :response-time'))\napp.get('/', function (req,\
  \ res) {\n  res.send('hello, world!')\n})\n\nfunction assignId(req, res, next) {\n\
  \  req.id  = uuid.v4()\n  next()\n}\n```\n\n# 第 6 章- CORS\n\n这是一个 Node.js 包，提供了一个\
  \ ExpressJS/Connect 中间件，用于启用 CORS 的各种选项。\n\n要通过 npm 命令安装它，请执行下面的命令：\n\n```bash\n\
  $ npm install cors\n```\n\n可以像下面所示使用：\n\n```javascript\nvar express =  require('express')\n\
  var cors =  require('cors')\nvar application = express()\n\napplication.use(cors())\n\
  \napplication.get('/', function (req, res) {\n  res.send('hello, world!')\n})\n\
  ```\n\n```\n路由\n```\n\n## 为所有路由启用 CORS\n```javascript\nvar express =  require('express')\n\
  var cors =  require('cors')\nvar application = express()\n\napplication.use(cors())\n\
  \napplication.get('/', function (req, res) {\n  res.send('hello, world!')\n})\n\
  ```\n\n## 为特定路由启用 CORS\n```javascript\nvar express =  require('express')\nvar cors\
  \ =  require('cors')\nvar application = express()\n\napplication.get('/products/:id',\
  \ cors(), function (req, res) {\n  res.send('hello, world!')\n})\n```\n\n## 为单条路由启用\
  \ CORS\n```javascript\nvar express =  require('express')\nvar cors =  require('cors')\n\
  var application = express()\n\napplication.get('/products/:id', cors(), function\
  \ (req, res) {\n  res.send('hello, world!')\n})\n```\n\n## 配置 CORS\n```javascript\n\
  var express =  require('express')\nvar cors =  require('cors')\nvar application\
  \ = express()\n\nvar cOptions = {\n  origin: 'http://sample.com'\n};\n\napplication.get('/products/:id',\
  \ cors(cOptions), function (req, res) {\n  res.send('hello, world!')\n})\n```\n\n\
  ## 动态源配置 CORS\n```javascript\nvar express =  require('express')\nvar cors =  require('cors')\n\
  var application = express();\n\nvar whitelist = ['http://sample1.com', 'http://sample2.com'];\n\
  \nvar cOptions = {\n  origin: function(origin, callback){\n    var orIsitelisted\
  \ = whitelist.indexOf(origin) !== -1;\n    callback(null, orIsitelisted);\n  }\n\
  };\n\napplication.get('/products/:id', cors(cOptions), function (req, res) {\n \
  \ res.send('hello, world!')\n})\n```\n\n## 如何启用 CORS 预检（Pre-Flight）\n\n某些 CORS 请求被认为是复杂的，这些请求需要初始的\
  \ OPTIONS 请求。使用 HTTP 方法的 CORS 请求与使用 POST/GET/HEAD 或自定义标头的请求相比是复杂的。为了启用预检，必须为需要支持的路由添加新的\
  \ OPTIONS 处理器。所示：\n\n```javascript\nvar express =  require('express')\nvar cors\
  \ =  require('cors')\nvar application = express();\n\napplication.options('/products/:id',\
  \ cors()); // 为 DELETE 请求启用预检请求\napplication.del('/products/:id', cors(), function(req,\
  \ res, next){\n  res.send('hello, world!')\n});\n```\n\n预检也可以在全局范围内启用，如下所示：\n\n\
  ```javascript\napplication.options('*', cors()); // 在其他路由之前包含\n```\n\n### CORS 的异步配置\n\
  \n```javascript\nvar express =  require('express')\nvar cors =  require('cors')\n\
  var application = express();\n\nvar whitelist = ['http://sample1.com', 'http://sample2.com'];\n\
  \nvar cOptionsDelegate =  function(req, callback){\n  var cOptions;\n  if(whitelist.indexOf(req.header('Origin'))\
  \ !== -1){\n    cOptions = { origin:  true }; // 在我们的 CORS 响应中反射（启用）请求的源\n  }else{\n\
  \    cOptions = { origin:  false }; // 禁用我们请求的 CORS\n  }\n  callback(null, cOptions);\n\
  }\n\napplication.get('/products/:id', cors(cOptionsDelegate), function (req, res)\
  \ {\n  res.send('hello, world!')\n})\n```\n\n\n\n\n\n```javascript\ncallback(null,\
  \ cOptions); // callback 需要两个参数：错误和选项\n\n};\n\napplication.get('/products/:id',\
  \ cors(cOptionsDelegate), function(req, res, next){\n\n  res.json({msg: '该白名单域名已启用\
  \ CORS。'});\n\n});\n\napplication.listen(80, function(){\n\n  console.log('开启了 CORS\
  \ 的 Web 服务器正在监听端口 80');\n\n});\n```\n\n实现方法如下。\n\n# 第 7 章- Express-Paginate\n\n\
  此模块与 MongoDB 等数据库的分页插件配合使用。\n\n要安装，请执行以下命令：\n\n```bash\nnpm install -S express-paginate\n\
  ```\n\n要在程序中使用它，必须使用“require”关键字将其包含在程序中。如下所示：\n\n```javascript\nvar paginate =\
  \ require('express-paginate');\n```\n\n使用 `paginate` 将创建一个新的 `express-paginate`\
  \ 实例。考虑下面的示例：\n\n```javascript\n// # app.js\n\nvar express = require('express');\n\
  \nvar paginate = require('express-paginate');\n\nvar application = express();\n\n\
  // 保持在所有将使用分页的路由之前\n\napplication.use(paginate.middleware(10, 50));\n\napplication.get('/users',\
  \ function(req, res, next) {\n  // 我们假设 `Users` 在之前的示例中已经定义\n  // 对于使用 `mongoose`\
  \ 的用户，为 `var Users = database.model('Users')`\n  // 并且 Mongoose 插件 `mongoose-paginate`\
  \ 已经通过\n  // 通过 `User.plugin(require('mongoose-paginate'))` 添加到 Users 模型中\n  Users.paginate({},\
  \ { page: req.query.page, limit: req.query.limit }, function(error, users, pageCount,\
  \ itemCount) {\n    if (error) return next(error);\n    res.format({\n      html:\
  \ function() {\n        res.render('users', {\n          users: users,\n       \
  \   pageCount: pageCount,\n          itemCount: itemCount\n        });\n      },\n\
  \      json: function() {\n        // 为列表对象创建 API 响应\n        res.json({\n     \
  \     object: 'list',\n          has_more: paginate.hasNextPages(req)(pageCount),\n\
  \          data: users\n        });\n      }\n    });\n  });\n});\n\napplication.listen(3000);\n\
  ```\n\n应用的第二个代码应该如下：\n\n```jade\n//- users.jade\n\nh1 用户\n\n//- 此处将创建一个按名称排序的链接\n\
  //- 你可能已经注意到我们只需要传递查询字符串参数\n//- 该参数在此处进行修改，而不是修改整个查询字符串\na(href=paginate.href({\
  \ sort: 'name' })) 按名称排序\n\n//- 这将假设你在查询字符串中有 `?age=1` 或 `?age=-1`\n//- 所以这些值会被此反转，你将得到\n\
  //- 相反的排序顺序（即 -1 为倒序，1 为升序）\na(href=paginate.href({ sort: req.query.age === '1'\
  \ ? -1 : 1 })) 按年龄排序\nul\n\neach myuser in users\n  li= myuser.email\n\ninclude\
  \ _paginate\n```\n\n第三段代码应该如下：\n\n```jade\n//- _paginate.jade\n\n// 在此示例中，我们将利用\
  \ Bootstrap 3.x 分页类\nif paginate.hasPreviousPages || paginate.hasNextPages(pageCount)\n\
  \  .navigation.well-sm#pagination\n    ul.pager\n      if paginate.hasPreviousPages\n\
  \        li.previous\n          a(href=paginate.href(true)).prev\n          i.fa.fa-arrow-circle-left\n\
  \          | 上页\n      if paginate.hasNextPages(pageCount)\n        li.next\n  \
  \        a(href=paginate.href()).next\n          | 下页&nbsp;\n          i.fa.fa-arrow-circle-right\n\
  ```\n\n# 第 8 章- Multer\n\n这是 Node.js 中的一个中间件，用于处理“multipart/form-data”。它用于将文件上传到服务器。为了最大化其效率，它构建在“busboy”之上。你必须注意，任何非\
  \ multipart 表单都无法由 Multer 处理。\n\n可以通过执行以下命令进行安装：\n\n```bash\nnpm install --save\
  \ multer\n```\n\n它通过通过向“request”对象添加一个“body”和一个“file/files”对象来工作。在“body”对象中将存储表单字段的值。“file/files”对象将包含已上传服务器的文件。\n\
  \n考虑下面的示例，它展示了如何实现：\n\n```javascript\nvar express = require('express')\nvar multer\
  \ = require('multer')\nvar uploadfile = multer({ dest: 'uploads/' })\nvar application\
  \ = express()\n\napplication.post('/profile', uploadfile.single('avatar'), function\
  \ (req, res, next) {\n  // req.file 是我们的 `avatar` 文件\n  // req.body 用于持有文本字段，如果有的话\n\
  })\n\napplication.post('/photos/upload', uploadfile.array('photos', 12), function\
  \ (req, res, next) {\n  // req.files 是一个包含 `photos` 文件的数组\n  // req.body 将包含文本字段，如果有的话\n\
  })\n\nvar cUpload = uploadfile.fields([{ name: 'avatar' }])\n```\n\n\n\n\n\n为了让你捕获来自\
  \ `Multer` 的错误，只需手动调用该中间件函数。下例所示：\n\n```javascript\nvar uploadfile = multer().single('avatar')\n\
  \napplication.post('/profile', function (req, res) {\n  uploadfile(req, res, function\
  \ (error) {\n    if (error) {\n      // 上传时发生错误\n      return\n    }\n    // 一正常\n\
  \  })\n})\n```\n\n这就是它的使用方法。\n\n# 第 9 章-压缩\n\n这是 Node.js 中提供的一个中间件。它支持以下压缩算法：\n\n\
  *   `deflate`\n*   `gzip`\n\n要在你的系统中安装此中间件，请执行以下命令：\n\n```bash\n$ npm install compression\n\
  ```\n\n要在程序中引入此 API，请如下所示使用 `require` 关键字：\n\n```javascript\nvar compression = require('compression')\n\
  ```\n\n可以使用不同的选项来返回压缩中间件。\n\n## .filter\n\n这是默认过滤器函数。它用于构建自定义过滤器函数，该函数将作为我们默认函数的扩展。下面的示例展示了如何使用它：\n\
  \n```javascript\napplication.use(compression({filter: compress}))\n\nfunction compress(req,\
  \ res) {\n  if (req.headers['x-no-compression']) {\n    // 带有此标头的响应不应被压缩。\n    return\
  \ false\n  }\n  // 回退到标准过滤器函数\n  return compression.filter(req, res)\n}\n```\n\n\
  `red.flush()`\n\n通过此模块，部分压缩的会被刷新到客户端。让我们来看一些示例。\n\n## express/connect\n\n可以通过 `app.use`\
  \ 使用此模块，它在 Express 和 connect 中可用。通过中间件的请求始终会被压缩。考虑下面的示例，展示了如何实现：\n\n```javascript\n\
  var compression = require('compression')\nvar express = require('express')\nvar\
  \ application = express()\n\n// 压缩所有请求\napplication.use(compression())\n\n// 添加所有路由\n\
  ```\n\n方法如下。\n\n## 服务器发送事件 (Server-Sent Events)\n\n该模块在服务器端的工作并非开箱即用。为了对内容进行压缩，必须缓冲输出窗口以便获得良好的压缩效果。\n\
  \n为了完成这些操作，我们需要对那些需要将数据写入客户端的情况调用 `red.flush()`。如下所示：\n\n```javascript\nvar compression\
  \ = require('compression')\nvar express = require('express')\nvar application =\
  \ express()\n\n// 压缩响应\napplication.use(compression())\n\n// 服务器发送事件流\napplication.get('/events',\
  \ function (req, res) {\n  res.setHeader('Content-Type', 'text/event-stream')\n\
  \  res.setHeader('Cache-Control', 'no-cache')\n  // 大约每 2 秒发送一次 ping\n  var timer\
  \ = setInterval(function () {\n    res.write('data: ping\\n\\n')\n    // !!! 我们程序中最重要的部分\n\
  \    res.flush()\n  }, 2000)\n  res.on('close', function () {\n    clearInterval(timer)\n\
  \  })\n})\n```\n\n# 第 10 章- csurf\n\n这是一个 CSRF 令牌中间件。它作为保护目的的中间件。要使用它，必须先初始化 cookie-parser\
  \ 或 session 中件。可以通过执行以下命令将其安装到电脑上：\n\n```bash\n$ npm install csurf\n```\n\n在程序中使用该\
  \ API，请如下所示使用 `require` 命令：\n\n```javascript\nvar csurf = require('csurf')\n```\n\
  \n这就是将其包含在程序中的。\n\n该模块的选项接受多个不同的对象，你可以学习如何使用它们。\n\n考虑下面的示例，它展示了服务器端的代码，用于生成 CSRF\
  \ 表单以供回传。示例如下：\n\n```javascript\nvar cParser = require('cookie-parser')\nvar csrf\
  \ = require('csurf')\nvar bParser = require('body-parser')\nvar express = require('express')\n\
  \n// 设置路由中间件\nvar csrfProtection = csrf({ cookie: true })\nvar pForm = bParser.urlencoded({\
  \ extended: false })\n\n// 创建一个 express 应用\nvar application = express()\n\n// 解析\
  \ cookies\n// 这是必要的因为在 csrfProtection 中 \"cookie\" 为 true\napplication.use(cParser())\n\
  application.get('/form', csrfProtection, function(req, res) {\n  // 将 csrfToken\
  \ 传递给视图\n  res.render('send', { csrfToken: req.csrfToken() })\n})\napplication.post('/process',\
  \ pForm, csrfProtection, function(req, res) {\n  res.send('数据正在处理中')\n})\n```\n\n\
  在你的视图中，`csrfToken` 的值应设置为隐藏输入字段 `_csrf` 的值。如下所示：\n\n```html\n<form action=\"/process\"\
  \ method=\"POST\">\n  <input type=\"hidden\" name=\"_csrf\" value=\"{{csrfToken}}\"\
  >\n  最佳颜色: <input type=\"text\" name=\"bestColor\">\n  <button type=\"submit\">提交</button>\n\
  </form>\n```\n\n就是如此简单地完成。\n\n## 忽略路由\n\n对于请求将经过完全身份验证的网站 API 区域，CSRF 应该被禁用。可以通过\
  \ Express 的路由来忽略 CSRF。考虑下面的示例，展示了如何实现：\n\n```javascript\nvar cParser = require('cookie-parser')\n\
  var csrf = require('csurf')\nvar bParser = require('body-parser')\nvar express =\
  \ require('express')\n\n// 设置路由中间件\nvar csrfProtection = csrf({ cookie: true })\n\
  var pForm = bParser.urlencoded({ extended: false })\n\n// 创建一个 express 应用\nvar application\
  \ = express()\n\n// 解析 cookies\n// 这是必要的因为在 csrfProtection 中 \"cookie\" 为 true\n\
  application.use(cParser())\napplication.get('/form', csrfProtection, function(req,\
  \ res) {\n  // 将 csrfToken 传递给视图\n  res.render('send', { csrfToken: req.csrfToken()\
  \ })\n})\n\n// 在 csrf 之前挂载 api\napplication.use(api)\n\n// 在挂载 \"/api\" 之后添加 csrf\n\
  application.use(csrfProtection)\n\napplication.get('/form', function(req, res) {\n\
  \  // 将 csrfToken 传递给视图\n  res.render('send', { csrfToken: req.csrfToken() })\n\
  })\n\nfunction createApiRouter() {\n  var router = new express.Router()\n  router.post('/getProfile',\
  \ function(req, res) {\n    res.send('没有 csrf 可获取')\n  })\n  return router\n}\n\
  ```\n\n方法如下。\n\n## 自定义错误处理\n\n当 CSRF 验证失败时，会抛出一个 `err.code === 'EBADCFTOKEN'` 的错误。也可以用于显示错误消息。考虑下面的示例，展示了如何实现：\n\
  \n```javascript\nvar bParser = require('body-parser')\nvar cParser = require('cookie-parser')\n\
  var csrf = require('csurf')\nvar express = require('express')\nvar application =\
  \ express()\n\napplication.use(bParser.urlencoded({ extended: false }))\napplication.use(cParser())\n\
  application.use(csrf({ cookie: true }))\n\n// 错误处理器\napplication.use(function (error,\
  \ req, res, next) {\n  if (error.code !== 'EBADCFTOKEN') return next(error)\n  //\
  \ 在此处处理 CSRF 令牌错误\n  res.status(403)\n  res.send(' 表单已被篡改')\n})\n```\n\n方法如下。\n\n\
  \n\n\n\n## [Text body parser](https://github.com/expressjs/body-parser#bodyparsertextoptions)\n\
  \n要安装它，只需执行以下命令：\n\n```bash\nnpm install body-parser\n```\n\n要使用该 API，请通过 `require`\
  \ 命令将其包含在程序中。如下所示：\n\n```javascript\nvar bParser = require('body-parser')\n```\n\
  \n通过 `bParser` 对象，暴露了各种用于创建中间件的工厂。`req.body` 属性将由所有中间件通过解析后的体进行填充，或者将错误解析传递给回调函数。\n\
  \n在 Express 中，可以将一个通用的 JSON 和 URL 编码（URL-encoded）解析器作为顶级中间件添加。通过这种方式，所有请求的体都将被解析。考虑下面提供的简单示例，它展示了如何实现这一点：\n\
  \n```javascript\nvar express = require('express')\nvar bParser = require('body-parser')\n\
  var application = express()\n\n// 解析 application/x-www-form-urlencoded\napplication.use(bParser.urlencoded({\
  \ extended: false }))\n\n// 解析 application/json\napplication.use(bParser.json())\n\
  \napplication.use(function (req, res) {\n  res.setHeader('Content-Type', 'text/plain')\n\
  \  res.write('you posted:\\n')\n  res.end(JSON.stringify(req.body, null, 2))\n})\n\
  ```\n\n## express 路由特定\n\n体解析器可以被添加到需要它们的路由中。这在 Express 中是可行的，并且可以轻松完成。这是在 Express\
  \ 中使用 `body-parser` 最简单且推荐的方法。考虑下面的示例，它展示了如何实现这一点：\n\n```javascript\nvar express\
  \ = require('express')\nvar bParser = require('body-parser')\nvar application =\
  \ express()\n\n// 创建一个 application/json 解析器\nvar jParser = bodyParser.json()\n\n\
  // 创建一个 application/x-www-form-urlencoded 解析器\nvar urlenParser = bParser.urlencoded({\
  \ extended: false })\n\n// POST /login 将获取 urlencoded 的体\napplication.post('/login',\
  \ urlenParser, function (req, res) {\n  if (!req.body) return res.sendStatus(400)\n\
  \  res.send('welcome, ' + req.body.username)\n})\n\n// POST /api/users 将获取 JSON\
  \ 的体\napplication.post('/api/users', jParser, function (req, res) {\n  if (!req.body)\
  \ return res.sendStatus(400)\n  // 在 req.body 中创建一个用户\n})\n```\n\n### 更改解析器的内容类型\n\
  \n对于所有解析器，都接受一个 `type` 选项，通过该选项，content-type 将是可以更改的，并且这应该是中间件要解析的内容。考虑下面的示例，它展示了如何实现这一点：\n\
  \n```javascript\n// 将各种不同的自定义 JSON 类型解析为 JSON\napplication.use(bodyParser.json({\
  \ type: 'application/*+json' }))\n\n// 将自定义内容解析为 Buffer\napplication.use(bParser.raw({\
  \ type: 'application/vnd.custom-type' }))\n\n// 将 HTML 体解析为字符串\napplication.use(bParser.text({\
  \ type: 'text/html' }))\n```\n\n# 第 12 章- Flash\n\n这是实现 Express 最简单的方式。要安装它，执行以下命令：\n\
  \n```bash\nnpm i flash\n```\n\n考虑下面的示例，它展示了如何实现这一点：\n\n```javascript\napplication.use(session());\
  \ // session 中间件\napplication.use(require('flash')());\napplication.use(function\
  \ (req, res) {\n  // get 消息\n  req.flash('info', 'hello there!');\n  next();\n})\n\
  ```\n\n考虑下面的第二个示例：\n\n```javascript\nfor msge in flash\na.alert(class='alert-' +\
  \ msge.type)\np= message.msge\n```\n\n这里是最后的示例：\n\n```javascript\nwhile msge = flash.shift()\
  \ // 当 jade 读取了它们时，消耗这些消息\na.alert(class='alert-' + msge.type)\np= message.msge\n\
  ```\n\n## f 数组\n\nFlash 消息可以如下所示：\n\n```json\n{\n  \"type\": \"info\",\n  \"message\"\
  : \"message\"\n}\n```\n\n## [method-override](https://github.com/expressjs/method-override)\n\
  \n这用于覆盖 HTTP 动词。通过它，可以在客户端不支持的地方使用如 `DELETE` 和 `PUT` 之类的 HTTP 动词。要在系统中安装它，请执行以下命令：\n\
  \n```\nnpm install method-override\n```\n\n要使用此模块，你必须知道在任何需要请求方法的模块之前，必须先使用它。\n\n\
  ### 使用 header 进行覆盖\n\n为了将 header 用于覆盖，header 名称 必须作为字符串参数传递给函数 `methodOverride`。为了进行该调用，必须向\
  \ POST 请求发送到带有该 header 作为被覆盖方法的 URL。考虑下面的示例，它展示了如何实现这一点：\n\n```javascript\nvar connect\
  \ = require('connect')\nvar mthdOverride = require('method-override')\n\n// 在我们的请求中使用\
  \ X-HTTP-Method-Override header 进行覆盖\napplication.use(mthdOverride('X-HTTP-Method-Override'))\n\
  ```\n\n考虑下面的示例，它展示了如何配合 `XMLHttpRequest` 使用：\n\n```javascript\nvar c = new XMLHttpRequest()\n\
  c.open('POST', '/resource')\nc.setRequestHeader('X-HTTP-Method-Override', 'DELETE')\n\
  c.send()\n```\n\n# 第 13 章- serve-favicon\n\n这是一个用于处理图标的中间件。通过执行以下命令可以安装该模块：\n\n\
  ```bash\nnpm install-favicon\n```\n\n考虑下面的示例，它展示了如何在 Express 中实现这一点：\n\n```javascript\n\
  var express = require('express')\nvar favicon = require('favicon')\nvar application\
  \ = express()\n\napplication.use(favicon('public/public'))\n\napplication.listen(3000)\n\
  ```\n\n在 connect 中，可以如下实现：\n\n```javascript\nvar connect = require('connect')\n\
  var favicon = require('favicon')\nvar application = connect()\n\napplication.use(favicon('public/public'))\n\
  \napplication.listen(3000)\n```\n\n## vanilla http server\n\n这是一个可以在任何地方使用的中间件类型。下面的示例展示了如何配合\
  \ http 使用它：\n\n```javascript\nvar http = require('http')\nvar favicon = require('favicon')\n\
  var finalhandler = require('finalhandler')\n\nvar _favicon = favicon()\n\nvar server\
  \ = http.createServer(function (req, res) {\n  var done = finalhandler(req, res)\n\
  \n  _favicon(req, res, function (err) {\n    if (err) return done(err)\n    // 响应请求\n\
  \    res.statusCode = 404\n    res.end('')\n  })\n})\n\nserver.listen(3000)\n```\n\
  \n# 第 14 章- response-time\n\n这是 node.js 的响应时间 header。它通过创建一个中间件来记录 HTTP 服务器请求的响应时间。在这种情况下，响应时间将是请求进入中间件到头部被写入客户端的时间。\n\
  \n可以通过执行以下命令安装此模块：\n\n```bash\nnpm install response-time\n```\n\n可以通过 `require`\
  \ 关键字将模块包含在程序中，如下：\n\n```javascript\nvar respTime = require('response-time')\n```\n\
  \n考虑下面的示例，它展示了如何在 Express 和 connect 中使用它：\n\n```javascript\nvar express = require('express')\n\
  var respTime = require('response-time')\nvar application = express()\n\napplication.use(respTime())\n\
  \napplication.get('/', function (req, res) {\n  res.send('hello, there!')\n})\n\
  ```\n\n## 这就是它的用法。\n\n## vanilla http server\n\n可以如下方式使用：\n\n```javascript\nvar\
  \ finalhandler = require('finalhandler')\nvar http = require('http')\nvar respTime\
  \ = require('response-time')\n\nvar _responseTime = respTime()\n\nhttp.createServer(function\
  \ (req, res) {\n  var done = finalhandler(req, res)\n\n  _responseTime(req, res,\
  \ function (err) {\n    if (err) return done(err)\n    // 响应请求\n    res.setHeader('content-type',\
  \ 'text/plain')\n    res.end('hello, there!')\n  })\n}).listen(3000)\n```\n\n\n\n\
  \n\n```javascript\nvar express = require('express')\n\nvar respTime = require('response-time')\n\
  \nvar StatsD = require('node-statsd')\n\nvar application = express()\n\nvar statistics\
  \ = new StatsD()\n\nstatistics.socket.on('error', function (err) {\n  console.error(err.stack)\n\
  })\n\napplication.use(respTime(function (req, res, time) {\n  var stat = (req.method\
  \ + req.url).toLowerCase()\n    .replace(/[:\\.]/g, '')\n    .replace(/\\//g, '_')\n\
  \  statistics.timing(stat, time)\n}))\n\napplication.get('/', function (req, res)\
  \ {\n  res.send('hello, there!')\n})\n```\n\n# 第 15 章 [express-namespace](https://github.com/expressjs/express-namespace)\n\
  \n通过此模块，Express 引入了命名空间路由功能。要将其安装到系统中，可以执行以下命令：\n\n```bash\n$ npm install express-namespace\n\
  ```\n\n考虑下例示例，它可以用于响应任何请求。以下是示例：\n\n```\nGET /forum/12\nGET /forum/12/view\nGET\
  \ /forum/12/edit\nGET /forum/12/thread/5\nDELETE /forum/12\n```\n\n要使用该模块，必须使用 `app.namespace()`\
  \ 和 `require('express-namespace')`。该模块随后将供你使用。\n\n要使用它，我们必须传递一个回调函数，然后对该方法进行路由。在每个回调函数之后，调用将完成，命名空间将与其状态一起存储。如下所示：\n\
  \n```javascript\napplication.namespace('/forum/:id', function(){\n  application.get('/(view)?',\
  \ function(req, res){\n    res.send('GET forum ' + req.params.id);\n  });\n\n  application.get('/edit',\
  \ function(req, res){\n    res.send('GET forum ' + req.params.id + ' edit the page');\n\
  \  });\n\n  application.namespace('/thread', function(){\n    application.get('/:tid',\
  \ function(req, res){\n      res.send('GET forum ' + req.params.id + ' thread '\
  \ + req.params.tid);\n    });\n  });\n\n  application.del('/', function(req, res){\n\
  \    res.send('DELETE the forum ' + req.params.id);\n  });\n});\n```\n\n当前的命名空间也可以通过\
  \ `app.currentNamespace` 访问。你还应该知道如何运行测试。然而，在此之前，请确保你已将所有子模块安装到系统中。可以通过执行以下命令来安装它们：\n\
  \n```bash\n$ git submodule update–init\n```\n\n可以通过执行以下命令运行测试：\n\n```bash\n$ make\
  \ test\n```\n\n这就是该模块的使用方法。\n\n# 第 16 章 [express-expose](https://github.com/expressjs/express-expose)\n\
  \n此模块用于将对象、函数和原始 JS 暴露给客户端。此功能非常适合共享设置、工具函数以及用户的当前数据。辅助方法和局部变量也会暴露给客户端。\n\n要安装此模块，请执行下述命令：\n\
  \n```bash\nnpm install -S express-expose\n```\n\n它可以像下面所示使用：\n\n```javascript\n\
  var express = require('express');\n\nvar expose = require('express-expose');\n\n\
  application = expose(application);\n\napplication.expose(...);\n```\n\n上述是在 express\
  \ 4.x 中该模块的方法。在 express 2.x 和 3.x 中，可以如下所示操作：\n\n```javascript\nvar express = require('express');\n\
  \nvar expose = require('express-expose');\n\napplication.expose(...);\n```\n\n##\
  \ 如何暴露对象\n\n将对象暴露给客户端的一种方法是暴露属性，很可能还有 Express 的配置。当 `app.expose(object)` 被暴露时，这些属性将暴露到\
  \ `application.*`。下例展示了如何进行操作：\n\n```javascript\napplication.set('views', __dirname\
  \ + '/views');\napplication.set(' the view engine ', 'jade');\napplication.set('title',\
  \ ' Sample ');\napplication.set('default language', 'en');\napplication.expose(application.settings);\n\
  ```\n\n辅助方法也可以通过另一个用例来暴露。这可以与你目前正在暴露的方式相同。如下所示：\n\n```javascript\napplication.expose({\
  \ en: 'English', fr: 'French' }, 'application', 'languages');\n```\n\n然后你只需要将你的默认缓冲区输出到你的模板中。对于\
  \ jade 用户，可以如下所示操作：\n\n```html\nscript!= javascript\n```\n\n对于 EJS 用户，可以如下所示操作：\n\
  \n```html\n<script><%- javascript %></script>\n```\n\n原始 JavaScript 字符串也可以像下面所示暴露：\n\
  \n```javascript\napplication.expose('var some = \"variable\";');\n```\n\n## 暴露函数\n\
  \n命名函数可以很容易地暴露。你只需要带上默认名称传递它，以便缓冲区将其替换为模板名称。示例如下：\n\n```javascript\napplication.expose(function\
  \ someFunction(){\n  return 'yes';\n}, 'foot');\n```\n\n这就是操作方法。\n\n## 自调用函数\n\n\
  也可以传递匿名函数，它将自执行以创建一个封装函数。考虑下例示例，它展示了如何进行操作：\n\n```javascript\napplication.expose(function(){\n\
  \  function notify() {\n    alert('this will be executed finely:D');\n  }\n  notify();\n\
  });\n```\n\n方法如下。\n\n## 请求级暴露\n\n上述内容都可以应用于请求级别。考虑下例示例展示了如何进行此操作。这里是示例：\n\n```javascript\n\
  application.get('/', function(req, res){\n  var user = { name: 'john' };\n  application.expose(user);\n\
  \  res.render('index', { layout: false });\n});\n```\n\n# 第 17 章 connect-render\n\
  \n这是 connect 中模板的辅助函数。可以通过执行以下命令安装：\n\n```bash\n$ render\n```\n\n它可以像下面所示使用：\n\n\
  ```javascript\nvar connect = require('connect');\nvar render = require('connect-render');\n\
  \napplication = connect(\nrender({\n  root: __dirname + '/views',\n  layout: 'layout.html',\n\
  \  cache: true, // 在生产环境中必须设置为 `true`\n  open: \"<%\",\n  close: \"%>\", // ejs\
  \ 的结束标签为 %>\n  helpers: {\n    config: config,\n    sitename: 'NodeBlog Engine',\n\
  \    _csrf: function (req, res) {\n      return req.session ? req.session._csrf\
  \ : \"\";\n    }\n  }\n})\n);\n```\n\n上述内容都可以应用于请求级别。考虑下例示例展示了如何进行此操作：\n\n```javascript\n\
  res.render('index.html', { title: 'Index Page', items: items });\n\n/**\n* `connect`\
  \ 的渲染中间件\n*/\nfunction middleware(options) {}\n```\n\n# 总结\n\n可以说 ExpressJS 是一个\
  \ Node 框架。它为开发者提供了一个可以用来创建 Web 和移动应用程序的框架。它拥有许多功能，开发者可以利用这些功能来创建他们的应用程序。它通过使用中间件工作。\n\
  \n\n\n\n\n这些模块中的每一个都有自己对应的命令用于安装。要使用任何模块，你都必须从安装它开始。它支持会话（sessions）的使用，这在创建 Web\
  \ 应用程序时非常有用。它提供了多种可用于开发目的的选项。你应该学习如何使用每个 `ExpressJS` 模块所提供的不同选项。\n\n`serve-index`\
  \ 模块用于向特定路径提供带有目录列表的页面。\n\n这在开发过程中非常有趣。通过 `cookie-sessions` 模块，可以提供访客会话，使得每个访问者（无论是否经过验证）都拥有自己的会话。这也是\
  \ `Express` 中最好且有趣的特性之一。这个 Node 框架即使对于初学者来说也非常容易学习。这本书将帮助你学习如何使用它。\n"
