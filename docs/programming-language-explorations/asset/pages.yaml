    \ of cows, horses, sheep, and each\nmaking their own type-specific sound. Generally\
    \ the animals were defined with classes, with\na common subclass Animal specifying\
    \ that each animal should have a name and speak\nby returning a message saying\
    \ the animal (noted by its name) its sound. In the\nfollowing script we create\
    \ these classes in Clojure, and, rather than inheriting\na superclass, we define\
    \ a protocol for sound-making that each class will implement.\nUnlike Java, however,\
    \ but like Python, each \"method\" requires an explicit parameter for\nthe receiver.\
    \ Protocols specify only behavior and no state, methods that would ordinarily\n\
    \ a superclass, in Clojure, just functions:\n\n```\n(defprotocol Sounder\n(sound\
