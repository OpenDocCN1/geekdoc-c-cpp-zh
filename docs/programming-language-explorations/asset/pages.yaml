  md: "String and Person respectively, and check the name field for null, and let\
    \ the boss be null if necessary. Expressions such as p.getBoss().getName() may\
    \ fail at run-time. But we'd like the compiler to type check expressions, so we\
    \ bring in Optional<T> from the package java.util. Think of an optional as a wrapper:\
    \ an optional either wraps a person, or is empty (Figure 7.2).\n\n![](img/2cd8452ff5a372a7459559ad1d0834e4_151_0.png)\n\
    \nOptional.of(5)\n\nOptional.empty()\n\nFigure 7.2 Optionals\n\n```\nimport java.util.Optional;\n\
    import java.util.Objects;\n\nclass Person {\n    private String name;\n    private\
    \ Optional<Person> boss;\n\n    Person(String name, Optional<Person> boss) {\n\
    \        this.name = Objects.requireNonNull(name);\n        this.boss = boss;\n\
    \    }\n\n    Person(String name) {\n        this(name, Optional.empty());\n \
    \   }\n\n    Person(String name, Person boss) {\n        this(name, Optional.of(boss));\n\
    \    }\n\n    public String getName() {\n        return name;\n    }\n    public\
    \ Optional<Person> getBoss() {\n        return boss;\n    }\n}\n```\n\nThe field\
    \ and constructor definitions express our intent well: name is required, boss\
    \ is optional. The static factory methods Objects.requireNonNull and Optional.of\
    \ prevent being constructed with null values. The expression p.getBoss().getName()\
    \ fails to compile: you'll have to deal with the no-boss case, but you won't be\
    \ surprised by it. The compiler forces you to deal with it.\n\nThe most common\
    \ usage patterns for optionals are as follows. Let o be an optional, and x its\
    \ wrapped value. Then:\n\n+   - o.isPresent() returns whether or not o wraps a\
    \ value.\n- o.ifPresent(f) invokes f(x) if present and does nothing else."
