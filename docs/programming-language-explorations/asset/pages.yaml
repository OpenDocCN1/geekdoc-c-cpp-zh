    \ of the generic type Tree. We may parameterize structures, classes, enumerations\
    \ and even functions. Here is a generic function:\n\n```\nfunc twice<T>(_ x: T)\
    \ -> [T] {\n    return [x, x]\n}\n```\n\n```\nassert(twice(5) == [5, 5])\nasert(twice(\"\
