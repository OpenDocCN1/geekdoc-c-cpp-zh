  md: 'Elm (currently) has no type classes, but has a few variables that approximate
    a type class facility.


    Tagged unions and record serve as labeled sum and product types, respectively.


    Elm was once a language that facilitated functional reactive programming. It featured
    signals, sequences of values generated over time in response to events, such as
    keyboard or mouse events, or the passage of time. Signals would be mapped, filtered,
    merged, and especially folded. Folding over signals was the manner in which application
    state could be accumulated or stepped forward.


    Modern applications subscribe to event sources. The Elm Architecture ensures that
    subscribed events are turned into customized messages routed to a centralized
    update function to step the state of the application forward.


    To continue your journey Elm beyond the introductory material of this chapter,
    you may wish to find and research the following:


    +   - Features not covered in this chapter. Tasks, commands, JavaScript interoperation,
    caching of effect managers.


    +   - Open source projects using Elm, and contributing to, open source projects
    is an excellent way to improve your proficiency in any language. You may enjoy
    the following projects in Ravich/sketch-nsketch (https://github.com/ravich/sketch-nsketch),
    Giph (https://github.com/mattieu-beteille/giph), Hop (https://github.com/spporto/hop),
    and Elm WebGL (https://github.com/elm-community/elm-webgl).


