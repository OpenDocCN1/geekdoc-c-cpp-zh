  md: "If another thread was able to access and mutate either of these account balances\
    \ during the sequence of transfer instructions, new money could be gained or lost.\
    \ Suppose thread $t_1$ is currently executing this six-statement sequence. Further\
    \ suppose $t_2$, deposits lottery winnings into the savings account between $t_1$'s\
    \ steps 1 and 3. Step 3 (on $t_1$) overwrites the huge deposit. Placing the entire\
    \ transfer in a transaction prevents such situations from happening:\n\n```\n\
    (use 'clojure.test)\n\n(def savings (ref 10000))\n  (def checking (ref 500))\n\
    \n(is (and (= savings 10000) (= @checking 500)))\n\n(dosync\n  (let [amount 100]\n\
    \    (alter savings (- amount)) ; alter savings by subtracting\n    (alter checking\
    \ (+ amount)))) ; alter checking by adding amount\n\n(is (and (= savings 9900)))\n\
    ```\n\nWorks well when you need to access multiple objects in a synchronized fashion;\
    \ the language manages any attempt to alter refs outside of a thread throw an\
    \ exception. For another scenario—safe access to single object in an asynchronous\
    \ fashion—Clojure offers agents.\n\n# 8.7 AGENTS\n\nVars and refs, agents store\
    \ values which you retrieve via deref (or %). To change the value managed by the\
    \ agent, you dispatch an action. An action is simply a function call that, the\
    \ optional validation test passes, produces the new value for the agent. The function\
    \ executes asynchronously on a thread from thread pools managed by Clojure; the\
    \ programmer never starts threads or performs any locking. The threads are non-daemon\
    \ threads, however, so the programmer must explicitly shutdown the agent. The\
    \ following example sends 50,000 actions to a counter agent with a validation\
    \ function ensuring the counter never becomes negative. It prints the value while,\
    \ presumably, the queued actions are still being executed, but after a two-second\
    \ pass the queued actions take more time to execute, the value again. Finally,\
    \ the script shuts down the agent system, terminating any unprocessed actions.\n\
