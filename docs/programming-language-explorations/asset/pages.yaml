  md: '# Programming Language Explorations


    will wait for the function to complete on the remote process, and produce the
    function''s result. The following script creates three new processes, and instructs
    process #4 to factor a large number:


    ```

    ```addprocs(3)

    @assert nprocs() == 4

    ref = remotall(4, 21883298135690819)

    @assert isa(ref, RemoteRef)

    factors = fetch(ref)

    @assert factors == Dict(234711901=>1,9323419=>1)

    ```

    ```


    The @spawn macro is used in place of remotall: it not takes advantage of a clearer
    syntax (since macros take unevaluated expressions as arguments), but it chooses
    a process for you:


    ```

    ```addprocs(3)

    ref = @spawn(21883298135690819)

    factors = fetch(ref)

    @assert factors == Dict(234711901=>1,9323419=>1)

    ```

    ```


    Between the call and fetching the result, the calling process is free to do other
    work. When no intermediate work is waited, the caller can combine the call and
    fetch with remotall_fetch (in place of remotall and fetch) or @fetch (in place
    of @spawn and fetch).


    A common example of parallel programming across multiple cores computes approximation
    of π by generating random points in the square (0,0)...(1,1). Counting the number
    of random points within the inscribed arc (the points (x,y) for $x^2+y^2 < 1$
    in Figure 6.3) divided by the total number of points within the square approximates
    the value $\frac{\pi}{4}$. Let''s generate a million random points in parallel
    on three cores:


    ![](img/2cd8452ff5a372a7459559ad1d0834e4_132_0.png)


    Figure 6.3 Approximation of $\frac{\pi}{4}$


