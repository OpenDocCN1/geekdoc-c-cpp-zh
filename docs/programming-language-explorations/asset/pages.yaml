  md: '# Programming Explorations


    A variable is a name that refers to a value. Do not confuse variables and values:
    variables either for or hold values, they are not themselves values. In some languages,
    a variable is simply a name to a value; in others, a variable is a container into
    which different values can be placed at different times during program execution.
    Variables of the latter kind are properly called assignables. [49] Regardless
    of the kind of variable, please note a value never changes (five is always five),
    but which value is bound to or held by a particular variable.


    An expression is a combination of literals, variables, and operators that is evaluated
    to produce a value. Some expressions require all of their operands to be evaluated;
    some, like the popular && ("and") and || ("or\ do not. An example of expression
    evaluation, as s holds the indexOf(''r'') of the string y, which holds the value
    100, and found the value true, follows:


    +   * 7 * indexOfOf(''r'') + Math.sqrt(y) / 2 <= 0 || !found

    * 7 + 2 * Math.sqrt(y) / 2 <= 0 || !found

    * 14 + Math.sqrt(y) / 2 <= 0 || !found

    * 14 + Math.sqrt(100) / 2 <= 0 || !found

    * 14 + 10 / 2 <= 0 || !found

    * 14 + 5 <= 0 || !found

    * 19 <= 0 || !found

    * false || !found

    * !found

    * !true

    * !false


    A routine is a (generally parameterized) unit of code. Routines can only start
    from the beginning when known as subroutines; those able to resume from where
    they yielded when called are coroutines. Some languages use the term function
    in place of subroutine; others use the term only for subroutines that return values.
    Coroutines interleave execution on a single sequence of instructions, explicitly
    yielding control to each other, while threads and processes run independently,
    preempted by the operating system when their number exceeds the number of available
    hardware execution units. Generally, we speak of threads as sharing memory, while
    processes maintain their own local memory and communicate exclusively via messages.


    A type, determines a collection of values with some prescribed behavior. That
    a value v has type means that all operations may be applied to v: the notion of
    "type" in programming language theory is deep, and has filled entire books, for
    example [97]. Typing is central to the study of languages, as the point of a language''s
    type system is to provide (meaningful) constraints on what we can and cannot say.


    We have an intuitive sense that values belong to—true to the boolean type, 0.3
    to some kind of numeric type, and "Hello" to the string type—but how these types
    vary significantly by language. Some languages use different types for integer
    and non-integer numeric values. Some arrange types into supertype-subtype relationships,
    where a value of a subtype is used wherever a value of a supertype is expected.
    Some languages group all functions into a single type, while others types their
    functions based on the arguments or returned value:'
