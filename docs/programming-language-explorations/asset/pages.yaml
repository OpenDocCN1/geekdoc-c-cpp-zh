    The line processing function shows us a few aspects of Erlang, among them:


    +   - No loops. Erlang does not have for while loops. So process_lines reads a
    single line, if available. If no lines remain to be, otherwise the function processes
    the lines and then calls itself to read the rest of the file.

    - Immutable data. Instead of continually growing a single word dictionary via
    destructive updates, we employ the update_counter function to produce a new dictionary
    like the one but with the value of a single key. The reducer fold we use in Elm,
    provides functional means to count multiple words.

    - Matching. Our script calls get_line to read a file and re to find words in a
    string. What if no lines are found, or if there are matches? Rather than throwing
    exceptions, Erlang returns values to indicate success or failure. If a file has
    been fully read, get_line returns the atom ef; if it reads a line, it simply returns
    that line. If match(when, above, using the options for all matches to be returned
    in a list) finds matches, it returns the atom nonatomic it returns a positive
    result in the tuple {match, matches}. In each case, we handle the variance of
    return values not with an if statement, but by pattern matching on the resulting
    terms.


    Our brief introduction didn''t venture into concurrency, so stayed tuned.


    # 10 THE BASICS


    Erlang data values, or terms, are the following:


    +   - Atoms, which like Ruby symbols and Closure keywords, simply stand for themselves.
    They should appear in single quotes unless beginning with a lowercase letter and
    containing letters, numbers, _, and @ Examples: success, last_name, ''last name''.

    - Integers, as in 8, -172, 16FFFC (hex), #21011 (binary), and 34#D9BW1 (base-34).
    The language allows any base between 2 and 36, inclusive. Erlang does not have
    a character type, so character literals evaluate to code points: $c is just 99,
    and $t (the horizontal tab character) is just 9.

    - Floats, as in 8.83-20, and -3.14. The base syntax (base#value) does not float
    to only integers.

    - Binaries, representing chunks of raw memory.

    - References, (almost) unique values generated at runtime by calling make_ref.
    References support only a single operation: an equality test.

    - Pids, process identifiers.

    - Ports, values used by Erlang to communicate to the outside world.


