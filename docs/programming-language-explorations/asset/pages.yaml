    # 1.2 THE BASICS


    A JavaScript program is made up of scripts and modules, each containing a sequence
    of statements and function declarations. Statements include variable declarations,
    assignments, function calls, conditionals and loops, among others. Values have
    one of 7 types:


    +   - The type containing the value undefined.

    - The type containing the value null.

    - Boolean, containing the two values true and false.

    - Number, the type of all numbers, –98.88, 22.7 × 10¹⁰, Infinity, -Infinity, and
    strangely enough, NaN, the number containing “not a number.”

    - String, the type of characters, but technically the sequence of UTF-16 code
    points. String literals are delimited by either single, double quotes, or backticks,
    with the latter allowed to span lines and contain interpolated expressions.

