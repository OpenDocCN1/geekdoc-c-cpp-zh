    at Netscape Communications Corporation, with the goal of creating an amateur-friendly
    scripting language embedded into a web browser. The syntax of the language was
    strongly influenced by C, with curly braces, assignment statements, and the ubiquitous
    *if*, *while*, and *for* statements. Semantically, JavaScript and C are alike;
    influence here is the lesser-known Scheme. Functions are first-class values: they
    can be assigned to variables, passed to functions, and returned from functions.


    The goal of allowing novice programmers to write small scripts in web markup language
    led to some well-known design choices, array (e.g., [10, 20, 30]) and object (e.g.,
    {x:3, y:5}) literals. Yet the attempt to keep the language simple led to notorious
    features as well. **Weak typing**, where errors of the type are automatically
    coerced to “something that works,” and **automatic semicolon insertion**, where
    the language will figure out where your statements begin and when you are not
    explicit, Douglas Crockford [20] has argued these as one of “Bad Parts” and “Awful
    Parts,” while at the same time praising JavaScript as [having] extraordinarily
    good. In JavaScript there is a beautiful, elegant, highly expressive language
    that is buried under a steaming pile of good intentions and blunders.”[20, p.
    2]


