    # 12.7 SAFETY FEATURES


    In the previous section, we saw ways in which Swift enables us to write extensible
    systems. We now turn to those examples of Swift''s design that help us write correct
    software. A so-called safe language aids the programmer in writing correct code
    by providing many guarantees and as few ambiguities as possible. Swift, for, guarantees
    all variables have a value before use. Only does the one line script


    print(x)

    of to compile (error: use of unresolved identifier ''x'') but the two-line script


    ```

    var x: Int

    print(x)

    ```


    also fails to compile (variable ''x'' used before being initialized). Swift is
    a definitive initialization language; the compiler performs data analysis to make
    sure all paths leading to a variable go through initialization, leaving the value
    of an "uninitialized" variable to "what happens to be in memory"; the behavior,
    however, of such a C program is undefined. Go takes a different approach, default
    implicit initialization, while other languages force the programmer to include
    initializing expressions with every variable declaration. Lua takes the same approach
    as Go, but Swift''s solution realizes that requiring an initial value may be unworthy,
    and defaulting to a zero value (not to mention nil) might not be the most sensible
    choice, nor does it provide any checks against a programmer''s possible unintentional
    of an initializer.


    The convenience of specifying immutability of objects (in addition to reassignment-ment
    let) also limits the chance of some programmer error, as the convenient syntax
    surrounding options—an attack against the Billion Dollar Mistake. Another safety
    feature shared with modern, statically-typed languages (but not C), is the requirement
    that patterns in matching must be exhaustive. If cases are left uncovered (as
    may happen when adding features to code), the compiler will reject the program
    and force you to address the issues.


    Swift also eliminates the surprises that come from modular arithmetic of fixed-size
    integers. In Go, eight-bit integers, have values between -128 and 127. Adding
    to 127 "wraps around" to -128, and adding 100 to 100 to -56. In Swift, however,
    arithmetic overflow crashes the program, hard. If you desire wraparound semantics,
    use the operators &, &- and &:


    ```

    let x: Int = 8

    let y: Int = 100

    assert(x + y == -56) // y would crash

    ```'
