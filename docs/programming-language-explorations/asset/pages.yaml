  md: '# 296 Programming Language Explorations


    # Prolog


    Prolog is the brainchild of a collaboration between Alain Colmerauer and Philippe
    Rousseau of the University of Aix-Marseille and Robert Kowalski of the University
    of Edinburgh in the late 1960s and early 1970s. As one of the first logic programming
    languages, Prolog has been extremely influential in the domains of theorem proving,
    expert systems, and natural language processing. It also greatly influenced the
    development of Erlang.


    +   First appeared 1972

    Designed by Alain Colmerauer

    Recognized for Logic programming, Natural Language Processing

    Notable uses Artificial Intelligence (notably IBM''s Watson), Computational Linguistics

    Tags Declarative, Logic


    A Prolog consists of a list of facts and inference rules. Prolog is generally
    declarative; the engine figures out how complete queries based on the given facts
    and rules. Here''s a simple Prolog "database":


    ```

    plays(kira,waterpolo).

    plays(colette,diving).

    plays(emily,waterpolo).

    plays(olivia,diving).

    plays(michelle,piano).

    club(colette,rosebowl).

    club(kira,rosebowl).

    club(emily,rosebowl).

    ```


    ```

    diver(X) :- plays(X,diving).

    teammate(X,Y) :- plays(X,Z), plays(Y,Z), club(X,C), club(Y,C), X\=Y.

    ```


    We can now run different computations, or queries, this database. For example:


    +   - plays(olivia,S) binds the variable S to the atom diving.

    - plays(P,waterpolo) produces multiple successive bindings for P, for each water
    polo player.

    - diver(colette) produces yes, while; diver(alex) produces no. There may be a
    named Alex, but Prolog cannot prove "I can prove this" and means "I cannot prove
    this".

    - teammate(olivia,colette) produces no. We don''t know Olivia''s club.

    - teammate(X,Y) finds all of teammates. Our first result is X = kira, Y = windy,
    and the second X = emily, Y = kira.

    - plays(X, waterpolo), club(X, rosebowl) binds X successively to each of the known
    Rose Water polo players.


    Prolog searches through the universe of possible facts to find query results,
    back-tracking internally. Occasionally, the programmer needs knowledge of this
    process to apply linguistic devices such as the cut (!) to drastically improve
    efficiency. Exploration of these devices are, beyond the scope of this text.'
