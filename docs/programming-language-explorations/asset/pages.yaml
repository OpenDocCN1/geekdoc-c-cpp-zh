  md: "# 198 Programming Language Explorations\n\n```\n$ erl\n1> X = 10.\n10\n2> X\
    \ = 20.\n** exception error: no match of right hand side value 20\n3> X = 10.\n\
    10\n```\n\nOur first entry matches the unbound variable X to bind, binding X to\
    \ 10. The second attempts to match 10 (the value to which X is already bound)\
    \ with 20, which fails. Our third match succeeds, and it matches with 10.\n\n\
    Pattern matching in Erlang can bind multiple variables at a time:\n\n```\n% First\
    \ line is ignored when running with script\nmain() ->\n S={student, name=\"Alice\"\
    , {scores, [93,100,81,88]}},\n\n% Pattern matching to bind two variables\n{name,\
    \ Name}, {scores, [|Midterm|_]}} = S,\n\n% Asserts\n100 = Midterm,\n\"Alice\"\
    \ = Name.\n```\n\nHere've used the special variable _, which doesn't bind to anything,\
    \ and matches everything. It's the perfect placeholder for positions within a\
    \ pattern that are of no concern at the moment.\n\nMatching occurs not only with\
    \ the match operator (=) but in function definitions and case expressions. These\
    \ structures have multiple clauses, separated by semicolons. Erlang performs the\
    \ matching in the order of the clauses, taking action as soon as it finds a match:\n\
    \n```\n% Pattern matching in function clauses\narea({circle, R}) -> math:pi()\
    \ * R * R;\narea({rectangle, W, L}) -> W * L.\n\n% Pattern matching in case expressions\n\
    roll() ->\ncase {rand:uniform(6), rand:uniform(6)} of\n{D, D} -> \"You rolled\
    \ doubles\", D+D;\n{X1, Y1} -> \"Unrolling roll\", X1+Y1\nend.\n```\n\n```\nmain()\
    \ ->\n 40 = area({rectangle, 8, 5}),\n {_, _} = roll().\n```\n\nWe might need\
    \ to write code for matching which would be inconvenient. Determining whether\
    \ a value is between 2000 and 32000 would appear to need 30,000 clauses. We can't\
