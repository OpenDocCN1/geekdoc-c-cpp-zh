    Notice that we used the value nil in a context where some type of error was expected.
    This is perfectly fine. nil is not just for pointers and maps, as we''ve already
    seen, but also can be used for—and plays the role of the zero value-slice, function,
    interface, and channel values.


    Here''s a final thought for this chapter. Go makes heavy use of favor of (static)
    duck typing, namely allowing types to implement interfaces without mentioning
    the interface name in the type declaration, but simply by virtue of the interface''s
    method, means that every type in Go implements (the empty interface). There is
    no need to implement a cosmic supertype, a type (or class) from which all other
    types derive, as Java''s Object or Ruby''s Basic—is the perfect type for a parameter
    that truly accepts any value at all. You can find many uses of this in the source
    code of the Go Standard Packages. We''ve seen at least one:


    ```

    func Println(interface{}) (n int, err error)

    ```


    And now we easily add Go to the list of languages that can pack a variable number
    of arguments into a single parameter.


    # 11.6 PANICS


    We''ve seen that idiomatic Go makes use of multiple return values for handling
    errors that might occur—opening or reading from files, formatting data, or decoding
    streams. After all, it''s perfectly reasonable that someone may ask for a non-existent
    file to be read, or a malformed byte stream to be decoded. These are not "exceptional
    conditions," so handling them by throwing and catching exceptions is arguably
    misuse of the exception facility. This kind of programming is practically discouraged
    by JavaScript, Java, and similar languages, that even allow try-catch-finally
    blocks in the middle of a function body.


    Go does not have exceptions, but it does have a way to handle truly exceptional
    cases—the ones that shouldn''t happen or the ones you don''t expect to recover
    from. When something exceptional happens, the program—technically, the currently
    executing goroutine—panics. A panic stops the current function, runs any deferred
    operations, then returns. In the caller, the panic is repeated until some deferred
    operation is able to recover, or the entire chain of calls has been "unwound"
    and the program crashes (with a non-zero exit code).


    To see the mechanism in action, we''ve built a little contrived demo in the function
    Example f calls g, which will run its deferred operation but will not recover
    from the panic, so f panics too runs its deferred operation but recovers, and
    returns normally to Example.


    > ⁵The "duck typing" gained popularity in programming languages due to the off-head
    phrase "if it looks like a duck, walks like a duck and quacks like a duck, it''s
    a duck." Rather than declaring that something is a duck (as in the Java-esque
    class implements Duck), a duck-typed language ensures the objects in question
    can do the things they do., implement the corresponding methods. The term "duck
    typing" is not precisely defined, however; you may sometimes hear the argument
    that duck typing applies only to dynamically typed languages. Following this,
    we would describe Go as having "structural typing" or "implicitly implemented
    interfaces." The interface name does not appear.'
