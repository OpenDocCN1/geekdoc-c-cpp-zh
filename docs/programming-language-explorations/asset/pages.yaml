  md: "# Programming Language Explorations\n\nHarper points out correctly, the difference\
    \ between type and class (see Figure 7.1). This is immediately apparent in the\
    \ Java side, with a variable constrained to type Object, which easily holds values\
    \ of String or Integer. On the Ruby side, the same situation occurs, but without\
    \ explicitly attaching a type to x. X does have a (static type) and that type\
    \ is the union of all Ruby classes. It's as if there's a single type, and indeed\
    \ some authors, including Harper, refer to so-called \"dynamically typed languages\"\
    \ as being untyped. [48] With only one static type, we cannot state certain invariants\
    \ in a declarative fashion.\n\n![](img/2cd8452ff5a372a7459559ad1d0834e4_148_0.png)\n\
    \nFigure 7.1 Types and Classes in Java\n\nNote that the static and dynamic typing\
    \ refers to mechanisms rather than languages themselves. Java does most of its\
    \ type checking at compile time, situations do arise where type checking occurs\
    \ at runtime. For instance, (Java) arrays are covariant, assigning an array of\
    \ sheep to an animal array variable is A-OK. But an arbitrary animal array contains\
    \ cows, so the compiler will not stop you from adding a cow to an object attached\
    \ to a variable of type Animal[]. If the associated object is a sheep array, you\
    \ will see a type exception at run time:\n\n```\npublic class CovariantArrayDemo\
    \ {\n    public static void main(String[] args) {\n        Animal[] animals =\
    \ new Sheep[10]; // Covariance, sadly\n        try {\n            animals[0] =\
    \ new Cow(\"Bessie\");\n        } catch (ArrayStoreException e) {\n          \
    \  System.out.println(\"Runtime type checking!\");\n        }\n    }\n}\n```\n\
    \nWhile arrays are covariant, the other collections (lists, sets, maps, etc.)\
    \ are not. In a statically typed language, it makes sense to use parameterized\
    \ types to implement these collections. Java calls these generic types, and these\
    \ are next up on our tour.\n\n# GENERIC\n\nJava tends to favor static typing,\
    \ parameterized types, known as generic types, appear quite often. Lists and sets\
    \ provide a typical illustration:"
