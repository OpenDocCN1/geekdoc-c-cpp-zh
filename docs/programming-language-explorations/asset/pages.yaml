  md: '# 52 Programming Language Explorations


    To attach metavar to a table t, invoke setatable(t,m).The metavar will contain
    zero or more of the fields, which will define how t behaves:


    ```

    __add__sub__mul__div_mod__pow__unm__idiv__band__bor__bxor

    __bnot__shl__shr__concat__len__eq__lt__le__index__newindex

    __call__tostring__metatable__gc

    ```


    When evaluating x.y, Lua checks if it has a metavar m with an ..add entry, and
    so, produces ..add(x,y). If not, y is checked in a similar fashion. The next 18
    properties work in the same way: ..sub is for subtraction, ..unm for unary minus,
    ..concat for ..., ..len for # and so on.


    The index property allows delegation of property lookup: this can be a function
    that returns the value of the property, or handle the missing property. Let''s
    consider our Javascript delegation example from Chapter 1 in Lua:


    ```

    unitCircle = {x = 0, y = 0, radius = 1, color = "black"}

    c = {x = 4, color = "green"}

    setatable(c, {.index = unitCircle})

    assert(c.x == 4 and c.radius == 1)

    ```


    Let''s make a class of "type" of two-dimensional vectors useful in graphics applications.
    For simplicity, we''ll keep the code light and implement only construction, vector
    addition, vector dot product, a magnitude function, and conversion to string.
    Here is one implementation (illustrated in Figure 3.1):


    ```

    Vector = (function (class, name, prototype)

    class.new = function ({i = i, j = j}, meta)

    end


    prototype.magnitude = function (self)

    math.sqrt(self.i * self.i + self.j * self.j)

    end


    meta.index = prototype

    meta..add = function (self, v)

    return class.new(self.i + v.i, self.j + v.j)

    end

    meta..mul = function (self, v)

    return self.i * v.i + self.j * v.j

    end

    meta..tostring = function (self)

    return string.format(''<%g,%%g>'', self.i, self.j)

    end

    return class

    end({}, {}, {}))

    ```


    > Actually, in Lua every value, not just every table, can have a metavar. However,
    setting the metavar for non-tables requires the C API, which is beyond the scope
    of our overview.


    > There are some restrictions here and there for some of the operator stand-ins;
    details are in the Lua Reference Manual.'
