    | Tags | Object-oriented, Expression-oriented, Dynamic |

    | Six words or | “A Programmer’s Best Friend”


    Yukihiro Matsumoto (Matz) designed Ruby in the mid-1990s as a language in which
    one could be productive and have fun programming. Rather than building a language
    with a small, simple core (for Lisp and Smalltalk are), Matz looked to be pragmatic,
    and aimed for human-friendliness: “I want to enhance the *how* part: how we feel
    programming. Ruby’s main difference from other languages design. I enhance the
    feeling, in particular, *how I feel* using Ruby. I didn’t work to make Ruby perfect
    for everyone, because you feel differently from me. No language can be perfect
    for everyone. I tried to make Ruby perfect for everyone, but maybe it’s not for
    perfect. The perfect language for Guido van Rossum is Python.” [122]


    But Ruby does have many, many fans, who find the language beautiful, powerful,
    and expressive. Of the many languages influenced Ruby, two stand out. It’s a language
    like Perl, with operating system interfaces, string processing, regular expressions,
    and syntactic syntactic like flexible quoting syntaxes. Ruby’s other influence
    is Smalltalk. Ruby is object-oriented in the way Smalltalk is object-oriented,
    nearly all computation with message passing. Ruby’s blocks come from Smalltalk,
    too. and the metaprogramming facilities of Ruby are, as in Smalltalk, an area
    in which the language really


    Many programmers today know Ruby from the web frameworks built up, it most notably
    Rails, but also Sinatra, Camping, Rack, Padrino, Pancake, Monk, and others. But
    Ruby is truly a *general-purpose* language, and you’ll see it used in many popular
    applications.


