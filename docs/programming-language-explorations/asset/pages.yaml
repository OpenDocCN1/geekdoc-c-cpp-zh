    )\n(defrecord Cow [name] Sounder\n(sound [this] \"moooo\")\n(defrecord Sheep [name]\
    \ Sounder\n(sound [this] \"baaaa\")\")\"\n```\n\n```\n(defn speak [animal]\n(str\
    \ .name animal) \"says\" (sound animal)))\n```\n\nThe defrecord macro accepts\
    \ a class name, fields that it should implement,\nthe the bodies of any methods\
