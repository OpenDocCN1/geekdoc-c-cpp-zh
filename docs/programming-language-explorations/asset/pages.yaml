    in some cases, must wait for the callee to finish the requested service.


    Syntactic Salt Syntactic forms that tend to make programs verbose, or difficult
    to follow, even though they may have been added to the language with good intentions.


    Syntactic Sugar A syntactic form that improves an equivalent primitive form by
    being more concise, expressive, or elegant.


    Systems Language A programming language used for writing system software.


    Tagged Union A type whose members are tagged with a label indicating the underlying
    type from which they came. Also known as a disjoint union, discriminated union,
    disjoint sum, or discriminated sum.


    Thread A sequential flow of control, generally preemptive and generally able to
    share memory with other threads.


    Trait A set of methods, generally expected to be mixed in a class to enhance its
    behavior or to increase its capabilities.


    Transient The property of any element in a system that is not persisted or serialized.


    Transp A compiler that changes the source code of a program in one language to
    the equivalent source code in another programming language.


    Truthy Treated as in a boolean context (e.g., when evaluating conditions).


    Type A set of values with common behavior enforced by the programming language.


    Type Compatibility The property of a relationship between an expression e and
    type t in which e can be used in any context expecting a value of t.


    Type Inference Automatic detection of the type of an expression.


    Type Variable A variable that ranges over types.


    Union Type A type whose set of values is the union of zero or more other types.


    Value A unit of data.


    Variable 1. An identifier bound to a value. 2. A storage location containing a
    value that can change.


    Volatile A variable that must be made available to multiple threads and thus cannot
    be implemented with multiple divergent copies per-thread.


    Wildcard A character in a pattern that may be replaced.'
