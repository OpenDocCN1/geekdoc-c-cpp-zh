    # 13.5 THE ML FAMILY


    While working on the theorem programming system LCF (short for Logic of Computable
    Functions), Robin Milner and colleagues in the early 1970s created a language
    for writing scripts to create proofs. Since LCF was itself a language for representing
    formulas in an underlying logic, the proof language was called the Meta Language,
    or ML for short. The original ML language evolved into a general-purpose programming
    language. Like Lisp, it featured first-class functions and pattern matching, and
    was expression-oriented and garbage-collected. Unlike Lisp, ML was statically
    typed, and had to implement the Hindley-Milner system and its type inference mechanism.


    A number of ML dialects appeared, with the most popular family branches being
    led by Standard ML and OCaml. Several closely-related languages like Elm, Haskell,
    and F# include the characteristic features of ML mentioned above that we consider
    them, at least for this book, to be part of the (extended) ML family.


    > ³PCRE is an acronym for Perl Compatible Regular Expressions.'
