  md: '# Julia 101


    Here we first define a dictionary for storing the counts for each word. We constrain
    the dictionary that keys are strings, and values must be 64-bit unsigned integers.

    The expression eachline(STDIN) gives us a line-by-line iterator over standard
    input. We lowercase and break each line into contiguous words with lowercase a-z
    (for simplicity) and the apostrophe. For each word, we bound its count in the
    dictionary if it''s there, and make a new entry with count 1 if not. The lookup
    operation in a map-get(counts, word, 0)-features a convenient argument for the
    value to return if the key is not present. Zero is the perfect choice here.


    The collect function turns (unordered) data into an array of key-value pairs,
    which we can sort by key, exactly what our problem specification requires. The
    destructuring iterator and the string interpolation make this whole script very
    sharp and clean.


    # 6.2 THE BASICS


    From our introductory programs, you may have noticed Julia looks a little like
    Lua. Structured statements are keyword-terminated (e.g., while..end, for..end,
    if..elseif..end..end, try..catch..end), indexes start at 1 instead of 0, local
    variables are introduced with the local keyword, and there is no class keyword.
    Julia''s coroutines are similar to Lua''s, but Julia adds some syntactic forms.
    In addition to function..end we have two ways to specify functions:


    ```

    f(x, y) = 2x + y # call-like form on left-hand side

    g = x -> x # arrow notation

    @assert f(2, 9) == 13

    ```


    Functions can have optional and keyword parameters. You can omit the keyword when
    returning the last expression in a function (as in CoffeeScript and Ruby):


    ```

    function f(a, b=1; c=2, d=3)

    [a, b, c, d]

    end

    @assert f(100) == [100, 2, 3]

    @assert f(100, 200) == [100, 200, 3]

    @assert f(100, d=10) == [100, 2, 10]

    @assert f(100, d=40, c=300) == [100, 300, 400]

    ```


    A semicolon separates the positional and keyword parameters, and keyword parameters
    must be given default values (in other words, all keyword parameters are also
    optional). Julia uses three dots (...) for packing and unpacking. Positional parameters
    pack and unpack into iterable collections of values; keyword parameters pack and
    unpack into arrays of (symbol, value) pairs:


    ```

    f(x, y...) = y

    @assert f(1, 2, 3) == (2, 3)

    ```


    ```

    g(x; y...) = y

    @assert g(1, a=2, b=5) == [:(a,2),(:b,5)]

    ```'
