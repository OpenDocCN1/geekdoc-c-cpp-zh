    Aruba\": \"Oranjestad\",\n\"Cura\\u007ao\": \"Willemstad\",\n\"Sint Maarten\"\
    : \"Philipsburg\"\n]\n```\n\n```\nasert(capitals.count == 4)\nasert(capitals.keys.contains(\"\
