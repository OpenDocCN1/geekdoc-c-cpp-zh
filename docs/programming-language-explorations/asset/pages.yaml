    # 6.3.5 Covariance, Contravariance, and Invariance


    We''ve subtype-supertype relationships among simple, nonparameterized types, for
    example Int64 <: Number (i., a 64-bit integer is a number). But what about parameterized,
    union, and types? Can we say anything about their subtype-supertype status based
    on the types of them? For example, how are Set{Int64} and Set{Number} related,
    if at all? First, terminology:


    +   - Set{Int64} <: Set{Number}, sets would be covariant

    - Set{Number} <: Set{Int64}, sets would be contravariant

    - If neither holds, sets would be invariant

    - If both hold, sets would be bivariant


    It turns out in Julia, sets are invariant. Why are they not covariant? If they
    were, we would be able to declare a variable with declared type "set of animals"
    and assign to it a value of "set of dogs". Since a is declared as a set of animals,
    it would appear to add a cat to it. But the underlying value of the variable is
    a set of dogs, which cannot hold a cat. Invariance avoids this pitfalls.


    Tuples, on the other hand, are covariant:


    ```

    t = (3, "hello")

    @assert typeof(t) == Tuple{Int64, ASCIIString}

    @assert isa(t, Tuple{Real, ASCIIString})

    @assert isa(t, Tuple{Integer, AbstractString})

    @assert isa(t, Tuple{Number, Any})

    @assert Tuple{Symbol, Float16, Union{}} <: Tuple{Any, Real, Any}

    ```


    The previous problem with sets does not arise because tuples are immutable.


