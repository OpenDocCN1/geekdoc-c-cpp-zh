    \ than the terminal end of Lua, Ruby, and Julia; avoids the curly-brace style\
    \ debates plaguing JavaScript, and does not impose any particular indentation\
    \ requirements on the programmer, as does Coffee and Python. Clojure (like all\
    \ Lisps) takes the world of nested parentheticals even further—throughout the\
