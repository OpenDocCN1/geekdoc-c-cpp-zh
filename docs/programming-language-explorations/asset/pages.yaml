  md: '# 326 Glossary


    Regex See Regular Expression.

    A pattern that describes sets of strings according to a large number of widely-accepted
    mechanisms, and sometimes with programming-language specific mechanisms.


    Reserved Word A word in the syntax of a programming language that cannot be used
    as an identifier.


    Runtime The period of time in which a program is executed.


    Rvalue A value that can be assigned. So named traditional assignment statements
    are written with the destination storage location on the left (hence the term
    l-value) and the data to be assigned to the right (hence the r-value).


    Scope The region of source code in a binding refers to a given entity.


    Scripting Language 1. A language designed for running jobs, i.e., coordinating
    (or script-ing) the activities of other programs. 2. A language low on “ceremony”
    but rich in expressive features, designed to allow its programmers to be productive.


    Second-class An entity that is not allowed to be represented by a variable in
    an expression.


    Semaphore A variable or object used to permit only a specific number of threads
    to access a shared resource at time.


    Shallow Copy A component-by-component copy of the values of the original object,
    in which references are not followed but are themselves copied.


    Sigil A symbol affixed to a variable name that changes the variable''s scope.


    Signal A value that changes over time but that is processed as a stream.


    Signature A specification of a function, method, or module that is completely
    free of implementation details, providing the minimum amount of information to
    use the object.


    Single Inheritance The restriction of a type or class to have only one supertype
    or superclass.


    Software Transactional Memory A mechanism for controlling updates in a concurrent
    environment in which all updates within a marked transaction either happen (get
    committed) or they are rolled back.


    Splat A term used primarily in CodeScript referring to a function parameter that
    is to be unpacked and expands to a function argument. (See *spread*)


    Spread An operator that expands a single expression into multiple expressions,
    within the context of a collection literal, argument list, or similar construct.


    Stack Storage Location in memory used to store frames.


    Starvation A scenario in which a process or thread cannot proceed because it is
    continually denied requests to resources it requires.


    Static Language A language in which the vast majority of metadata (types of variables,
    which functions are called, etc.) can be inferred by examining source code only
    and not requiring execution to determine.


