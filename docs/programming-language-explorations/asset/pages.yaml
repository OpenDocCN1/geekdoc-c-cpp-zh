  md: "# Programming union Explorations\n\nWhile tagged union (e.g., PrimaryColor\
    \ in the example script), do introduce new, distinct named types, we can only\
    \ name record types via aliasing. In the lingo of programming languages, record\
    \ types live in a structural typing rather than nominative typing. Only the record\
    \ structure—the names and types of its fields—is used to determine its type. We\
    \ can, however, use tagged unions with a single variant to make the distinction.^9\n\
    \n```\ntype Person\n = Person { name : String, id : Int }\ntype Widget\n = Widget\
    \ { name : String, id : Int }\n\np : Person\np = Person { name = \"Alice\", id\
    \ = 239 }\n-- : Widget; w = p would be a syntax error now.\n```\n\nWe can use\
    \ aliasing to describe a record type that need only certain fields:\n\n```\nimport\
    \ ElmTest exposing Positioned a\n\ntype aliases\n  { x : Float, y : Float, z :\
    \ Float }\n\nmove : Positioned a -> Float -> Float -> Positioned a\nmove object\
    \ dx dz =\n  { x = object.x + dx, y = object.y + dy, z = object.z + dz }\n\nmain\
    \ =\n  let\n    robotStart = { name = \"Mari\", x = 3, z = -2 }\n    robotEnd\
    \ = move robotStart 7 -2 9\n    expectedEnd = { name = \"Mari\", x = 10, y = 6,\
    \ z = 7 }\n  in\n    runSuite |\n      defaultTest(expectedEnd `assertEquals`\
    \ robotEnd)\n```\n\nWe just moved a robot. But we can, move anything that has\
    \ x, y, and fields, without the need to include some kind of position field within\
    \ the object, or derive our object from a position object or class.\n\n# 9.6 EFFECTS\n\
    \nOne of the most useful dimensions on which to characterize and compare programming\
    \ languages is the extent to which the language's design, and its culture, encourage,\
    \ discourage, contain, or eliminate side-effects. Roughly, a side effect occurs\
    \ when a function changes a program's state in a way other than producing an return\
    \ value. Side-effects, and side-causes—entities manipulated by a function other\
    \ than its explicit pa-\n\n> ^9This technique also applies when you need to use\
    \ recursive records, you'll have an opportunity to explore the end-of-chapter\
    \ exercises."
