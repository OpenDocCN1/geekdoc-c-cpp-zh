  md: "```\nfunc report(name string, message string) {\n    log.Println(name + \"\
    \ \" + message)\n}\n\nfunc do(name string, message string, maxDelay time.Duration)\
    \ {\n    report(name, message)\n    delay := int(maxDelay) / 2 * rand.Intn(int(maxDelay)\
    \ / 2)\n    time.Sleep(time.Duration(delay))\n}\n```\n\nSince we know the number\
    \ of customers, we would require each customer goroutine to write to a channel\
    \ at the end of its life. The main goroutine could end by receiving the desired\
    \ number of messages from the channel before exiting. Alternatively, we use a\
    \ wait group. A sync.WaitGroup supports three methods: (1) Add(n) to increase\
    \ the group's counter, (2) Done(), decreasing the counter, and (3) Wait(), to\
    \ block until the counter reaches zero. Our main goroutine simply creates each\
    \ of cooks and customers, incrementing the wait count until customer creation.\
    \ The last line of the function just invokes Wait, relying on each customer to\
    \ notify the group by calling Done when it finishes.\n\n```\npackage main\n\n\
    import (\n    \"fmt\"\n    \"sync\"\n)\n\nconst numberOfCooks, numberOfCustomers\
    \ = 3, 15\n\nfunc main() {\n    var waitGroup sync.Group\n    for i := 0; i <\
    \ numberOfCustomers; i++ {\n        waitGroup.Add(1)\n        go customer(fmt.Sprintf(\"\
    customer-%v\", i), &waitGroup)\n    }\n    for i := 0; i < numberOfCooks; i++\
    \ {\n        go cook(fmt.Sprintf(\"cook-%v\", i), &waitGroup)\n    }\n    waitGroup.Wait()\n\
    }\n```\n\nNow we can define the customer goroutine. Each customer is created with\
    \ a name and the wait group to notify when finished. We begin setting up the notification\
    \ as a deferred operation; this common Go idiom of deferred operations for finalization\
    \ and clean up at the beginning of a goroutine is good practice. Deferred operations\
    \ are always executed, even if a function prematurely returns or panics; in our\
    \ case we know customers will always notify the wait group no matter how they\
    \ terminate."
