  md: '# Dynamic Typing


    The state of having types of some expressions not known until run time.


    # Eager Evaluation


    The evaluation of all of a function''s arguments (or an operator''s operand) before
    application of the function (or operator). Also known as *strict evaluation*.


    # Encapsulation


    the bundling of data elements into a single component, often in a way that the
    constituent elements cannot be directly accessed.


    # Encoding 1.


    The representation, in bytes, 2. A specification of certain entities should be
    encoded in bytes.


    # Enumeration


    A complete ordering of a given set of elements. The term may refer to (1) a type
    whose constituent values are listed (*an enumerated type*) or (2) a sequence of
    values emitted by a generator.


    # Event


    An occurrence that can be detected and handled.


    # Exception


    An entity that is *thrown*, or *raised* to abort the normal control flow and transfer
    to the point at which the exception is *caught*.


    # Falsy


    Treated as false in a boolean context (e.g., when evaluating conditions).


    # First-class


    An integer type to be assigned to variables, as parameters, and returned from
    routines.


    # Fixnum


    An integer represented with a fixed, finite, number of bits.


    # Frame


    A structure in the execution model of a program representing a particular activation
    of a routine. A frame records the parameters and local variables of the activation,
    as well as bookkeeping information. Also known as an *activation record*.


    # Function


    A possibly parameterized, and possibly named, callable block of code.


    # Functional Programming


    A programming paradigm in which computation proceeds by evaluating side-effect-free
    expressions, generally involving function calls.


    # Future


    See promise.


    # Garbage Collection


    The reclamation of storage holding objects that are no longer needed.


    # Generic


    To be specified just once and “work about the same way” in many different contexts.


    # Guard


    A boolean expression to allow (when true) or disallow (when false) access to an
    entity.


    # Heap Storage


    The portion of memory in which new objects are allocated (and de-allocated) at
    run time.


    # Higher-Order Function


    A function that takes functions as arguments or returns functions.


    # Homomorphic


    The property of a language in which code is represented as a data structure and
    both have the same syntactic form.


    # Hygienic Macro


    A macro expansion will not capture identifiers.


    # Immutable


    The quality of an entity whose state may not change.'
