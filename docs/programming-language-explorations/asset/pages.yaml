  md: '# APL


    Kenneth Iverson''s work on a mathematical notation to manipulate arrays culminated
    in a 1962 publication at Harvard called A Programming Language. By 1964 by IBM,
    Iverson adapted this notation into a programming language, APL.


    | First appeared 1962 |

    | Designers Kenneth Iverson |

    | Recognized for Arrays, conciseness, symbolic alphabet |

    | Notable uses Finance, Scientific research |

    | Tags Array-based, Dynamic |


    Few languages can match APL for conciseness. APL programs are expressions in which
    operators are (successively) applied to arrays. APL features dozens of operators,
    which often have different meanings when used in a unary (monadic)⁷ versus a (dyadic)
    context. We can get a feel for array processing in the famous expression for producing
    an array of prime numbers less than or equal to R:


    ```

    ~ R ∈ R ○ ×)/R ← 1↓R

    ```


    For concrete, assume R is 8. In APL, all operators associate to the right, so
    if we evaluate i8 which produces [1 2 3 4 5 6 7 8]. We apply the binary (↓) operator
    to remove one element from the front, resulting in [2 3 4 5 6 7 8]. We assign
    this (←) to R. On the left side of the compress operator (/), we have R○× builds
    a two-dimensional array containing the outer product, or multiplication table,
    of R with itself:


    | 4 6 8 10 12 14 16 |

    | 6 9 12 15 18 21 24 |

    | 8 12 16 20 24 28 32 |

    | 10 15 20 25 30 35 40 |

    | 12 18 24 30 36 42 48 |

    | 14 21 28 35 42 49 56 |

    | 16 24 32 40 48 56 64 |


    Next we apply ∈ to R and this table, producing the array containing 1 for each
    element of R present in the table and 0 where not present, resulting in [0 0 1
    0 1 0].⁸ Applying over each element yields [1 1 0 1 0]. Now we apply the compression
    operator which selects those elements of the right operand having a 1 in the left:


    | 1 0 1 0 1 0 |

    | ↓ ↓ ↓ ↓ ↓ |

    | 2 3 4 5 6 7 8 |

    | ↓ ↓ ↓ ↓ |

    | 2 3 5 7 |


    The prime numbers up to 8 are: [2 3 5 7].


    > ⁷Don''t confuse APL''s use of the term monadic with Haskell; the two meanings
    are wholly distinct.

    ⁸Read this result as saying that the values 2..8. only 4, 6, and 8 were found
    in the table.'
