    Befunge programs are written in a two-dimensional grid of instructions. Some instructions
    manipulate the data stack in the usual way (as in Factor), some input and output
    (from/the stack), and some instructions—<, ", and v change the direction in the
    program is read. Even better, or worse, the p instruction: pops from the stack
    three values y, x, and v, then replaces the character at position (x,y) in the
    code grid with v. So the grid contains both instructions and data, allowing you
    to change code on the fly.¹⁰


    Here''s a factorial function in Befunge (can you see the loop?):


    ```

    &:1:v *$._

    _$!:~

    ```


    The full instruction set and semantics for Befunge are available at [17], and
    you''ll be writing an interpreter to be quite possible. Compilers can have been
    written, utilizing some very interesting techniques you wish to look into.


