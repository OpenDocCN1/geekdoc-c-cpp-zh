  md: '# B.3 CHARACTER ENCODING


    A character encoding specifies the representation of code points in 4 bytes. For
    Unicode, the UTF-32 encoding presents the code point directly in 4 bytes. UTF-32
    is a fixed-length encoding every character is represented in the same number of
    bytes. The variable-length encoding UTF-16 encodes the characters U+0000 through
    U+FFFF in two bytes, and U+10000 through UFFFF in four bytes. The length is encoded
    by subtracting 0x10000 from the code point and representing the 20-bit value $x_{19}x_{18}...x_0$
    into a 32-bit word as follows:


    ```

    11011010x_{19}x_{18}x_{17}x_{16}x_{15}x_{14}x_{13}x_{12}x_{11}x_{10}11011011x_9x_8x_7x_6x_5x_4x_3x_2x_0

    ```


    For example, the character U+16F6A AIR TRAMWAY has the UTF-16 encoding 8D33 DEA1.


    Perhaps the most popular encoding scheme is the variable-length UTF-8. We spread
    the code points $x_7...x_1-x_0$ over 1-4 bytes as follows:


    # Code points Encoding


    | | Encoding |

    |---|---|

    | 0...7 | $x_7...x_0$ |

    | 80...7ff | $110x_7...x_0$ |

    | 800...ffff | $1110x_{15}...x_{12} 10x_{11}...x_0$ |

    | 10000...1ffff | $11110x_{19}...x_{16} 10x_{15}...x_{12} 10x_6...x_0$ |


    Many languages with a string width type provide methods to get the number of characters
    and the number of bytes in them. For example, using UTF-8, the string "\u220A
    \u0AC" has a character length of 7 (code points 2200, 78, 2E, 41, 2228, AC, 41),
    but a byte length of 12 (E2 88 70 2E 41 E8 A8 C2 41).


    Character counting varies wildly between languages. Some languages explicitly
    count characters; some understand and count grapheme clusters as a single character.
    Some may even count UTF-16 code units. For example, the Lebanese flag emoji:


    +   - A single cluster, or character,

    - composed of two encoded characters (U+1F1F1 U+1F1E7)

    - encoded in UTF-16 code units, and

    - encoded in 8 bytes in UTF-8.


    JavaScript''s length method on strings counts in UTF-16:


    ```

    // One character that JavaScript counts as 4

    const assert = require(''assert'');

    assert("\u{f1f1}\u{f1e7}".length == 4);

    ```


    Swift, in contrast, does not understand grapheme clusters, and can provide UTF-8
    and UTF-16 views into a string as:


    ```

    // Swift understands grapheme clusters and encodings

    let s = "\u{f1f1}\u{f1e7}"

    assert(s.characters.count == 1)

    assert(s.utf16.count == 4)

    assert(s.utf8.count == 8)

    ```'
