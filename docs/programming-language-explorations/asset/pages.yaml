    # A.3 RATIOS AND DECIMALS


    **Ratio**, also known as **rationals**, avoid roundoff errors from division by
    storing both the numerator and denominator. So rather than being surprised at
    the sum of the floating-point values 0.1 and 0.2, we could instead add the rationals
    one-tenth and one-fifth to receive the three-tenths.


    The Julia language has a special operator (//) to construct rationals:


    ```

    julia> 1/10 + 1/5

    0.3000000000000000

    julia> 1//10 + 1/5

    3/10

    julia> typeof(ans)

    Rational{Int64}

    ```


    Ruby has a **Rational** class; rational numbers can be constructed from strings
    or from a numerator and denominator:


    ```

    >> 0.1+0.2

    => 0.30000000000000004

    >> Rational(''1/10'')+Rational(2,10)

    => (3/10)

    ```'
