    We really can''t go much further into our exploration of Ruby without covering
    the fact that the language is something we call object-oriented, in an essential
    way. It''s time to see what that means.


    # 5.3 OBJECT ORIENTATION


    A programming paradigm is a style of expressing computations. The functional paradigm
    views computation as the composition of functions: the output(s) of one are fed
    into another, and so on. The imperative paradigm views computation as a succession
    of actions, as assignment statements and I/O operations, updating a global state.
    The logic paradigm views computation as the systematic satisfaction of constraints,
    specified by facts and inference rules. Wikipedians have described dozens of additional
    programming paradigms in the Programming language article. [136]


    The popular object-oriented paradigm views computation as passing among objects:
    an object responds to a message (when it can) by executing a method, possibly
    updating the object''s internal state. The key insight of object-oriented is that
    a computer (or a complex system) can be decomposed into smaller computers (objects)
    rather than into the dissimilar and less-powerful data structures and procedures.
    There is a spectrum of opinions on what object oriented, from (1) simply binding
    code inside of data structures, to (2) requiring that objects have completely
    encapsulated (hidden) state, that objects are instances of classes, and that classes
    are grouped in inheritance hierarchies allowing for specialization of method behaviors.
    An excellent overview of objectorientation covering its goals, origins, mechanisms,
    models, and alternatives, is [129].


    Ruby is an object-oriented programming language because it facilitates object-oriented
    programming.


    # 5.3.1 Messaging


    Like Python, all Ruby values are objects (there are no primitives), and with few
    exceptions, computation is carried out exclusively by sending messages to objects.
    Send a message with the expression obj.send(message,args), denoting the message
    with an evaluation to a Ruby symbol. If the message is known for you, you can
    use the shorthand obj.symbol.


    > 1 Alan Kay, who said to have invented the term "object oriented," credits the
    genesis of this idea to his teacher, Bob Talbot, who said "The basic principle
    of recursive design is making the parts as powerful as the whole." [71]


    > 2You can pass a string for the message name if you wish; Ruby will convert the
    string to a symbol for you.'
