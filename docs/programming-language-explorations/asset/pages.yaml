    \ fully collects all heap objects reachable from “active” (global and stack) by\
    \ tracing chains of references) and reclaims all unreachable objects. Collection\
    \ in these systems usually happens on a background thread, to preempt the running\
    \ program at any time.\n\nSwift takes a different approach. Heap-allocated object\
    \ (class instance) is given a reference count, starting at 1 when created. Each\
    \ time a reference to the object is assigned to a new variable, or passed to a\
    \ parameter, the reference count is incremented. The count is decremented when\
    \ one of the referencing variables goes out of scope. When the count reaches zero,\
    \ the deinitializer is invoked and the object is reclaimed. This mechanism, automatic\
    \ reference counting, or ARC, requires no garbage collection thread. Since allocation\
    \ and deallocation occurs at identifiable points in execution, there is no need\
    \ for a preemptive garbage collector. The following brief example shows an object\
    \ being allocated and deallocated at predictable points in a script's:\n\nvar\
