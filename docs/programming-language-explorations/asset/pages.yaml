  md: "# Erlang 201\n\nThe built-in function spawn(module, function, args) creates\
    \ a process to run module: function(args) asynchronously, immediately returning\
    \ the pid of this new process. We pass to each of the prime checking processes,\
    \ at construction, the pid of the printer checker. Each prime checker checks the\
    \ printer number to print prime, and false if composite. We construct the printer\
    \ process with the pid of the main process itself, so the printer can send a message\
    \ to main handling each value. main waits for 999 messages from the printer before\
    \ finishing.\n\nThe prime checkers are interesting in their own right, as we have\
    \ an opportunity to illustrate recursion.\n\n```\n-module(prime_checker).\n-export([is_prime/2]).\n\
    \nis_prime(N, Observer) ->\n  fun Check(D) ->\n    if\n      D * D > N -> % No\
    \ more divisors\n        Observer ! N;\n      N rem D == 0 -> % Composite\n  \
    \      Observer ! false;\n      true -> % Keep looking\n        Check(D+1)\n \
    \   end\n().\n```\n\nThe prime checking function illustrates the typical implementation\
    \ of \"loops\" with tail recursion. Check possible divisors from 2..√N, notifying\
    \ an observing process of our value (if prime) or an indication of non-primeness\
    \ (false). Our printing process repeats integers to standard output, notifying\
    \ its observer whether or not it printed a value.\n\n```\n-module(printer).\n\
    -export([print_server/1]).\n\nprint_server(Observer) ->\n  receive\n    N when\
    \ is_integer(N) ->\n      io:format(\"-p\", [N]);\n      Observer ! true;\n  \
    \  ->\n      Observer ! false\n  end,\nprint_server(Observer).\n```\n\nDon't rely\
    \ on the order in which processes finish: one run of this script began: 23 179\
    \ 181 191 193 197 71 73 21 323 227 229 239 233 241 43 25 261 257 263 269 67 277\
    \ 271 281 283 79 101 103 83 29 307 311 313 317 107 109 33 5 7 13 17 19 113 2 ...\
    \ and other runs were just as scrambled.\n\n> ⁴We're not pretty about which messages\
    \ are being sent; cleaning this code is a good exercise for the reader, as is\
    \ research additional, more idiomatic ways to wait for a group of processes to\
    \ finish!\n\n> ⁵Because the closed-over inner function Check is recursive, we\
    \ had to give it a name."
