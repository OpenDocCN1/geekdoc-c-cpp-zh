  md: '# 300 Programming Language Explorations


    | First appeared 1993

    Designer Urban Müller

    Recognized for Minimalism

    Notable uses Research into small compilers

    Tags Esoteric, Imperative |


    A Brain** program is a sequence of one-character commands operating on a single
    array of bytes (indexed from zero) and two byte streams, standard input and standard
    output. The current memory cell is initially the leftmost. The eight commands
    are:


    +   - Read the byte from stdin into the current cell

    - Write the byte in the current cell to stdout

    - Move the current cell pointer left

    - Move the current cell pointer right

    - Increment the byte in the current cell

    - Decrement the byte in the current cell

    - [ If the byte in the current cell is zero, jump ahead the matching ]

    - If the byte in the current cell is nonzero, jump backwards to just beyond the
    matching ]


    The following program:


    ```

    ++++[++++>++<<-]>>.

    ```


    prints the Hi to standard output. As all cells have an initial value of zero,
    the program first increases the first cell to 7, then the second to 5, then the
    next cells to 2 and 3, with the fourth as our current cell:


    ```

    7 5 2 3

    ```


    We''re inside a doubly-nested "loop" here. Our next instruction says to go back
    two cells and decrement the value. If not yet zero, we continue our inner loop
    of incrementing the third and fourth cells by 2 and 3 respectively. After this
    is done five times, our memory becomes:


    ```

    7 0 10 15

    ```


    We''re back in an "outer loop" now, and we''re supposed to go back one cell to
    the left and decrement..we''re being told to do what we did seven times. This
    takes us to the following state:


    ```

    0 0 70 105

    ```


    We need to move two cells to the right, bump the value by 2 to 72, the code point
    for LATIN CAPITAL LETTER H and print it with the .command. Moving one cell to
    the right we find happily, 105, the code point of LATIN SMALL LETTER I, and we''re
    done.


    You might want to work through the classic Hello program, as found on [132]:


    ```

    ++++++ [>++++>++>>+++<<<]>>+->->->+[]<-]>>.

    ---.++++.+.>>.<,+.+.--------,>>.+..

    ```'
