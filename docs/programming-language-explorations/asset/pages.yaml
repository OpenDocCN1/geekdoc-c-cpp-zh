  md: "# 180 Programming Language Explorations\n\n```\nimport ElmTest exposing (runSuite,\
    \ suite, defaultTest, assertEquals)\nimport Shapes exposing (Shape, Circle, Rectangle),\
    \ area, perimeter)\n\nmain =\nrunSuite <| \"Test shape functions\" area (Circle\
    \ 10)\n  [ defaultTest <| (100*pi) `assertEquals` (Circle 10)\n  , defaultTest\
    \ <| (2*pi) `assertEquals` perimeter (Circle 10)\n  , defaultTest <| 16 `assertEquals`\
    \ area (Rectangle 2 8)\n  , defaultTest <| 20 `assertEquals` perimeter (Rectangle\
    \ 2 8)\n  ]\n```\n\nElm's List and Maybe types are tagged unions, too. Because\
    \ a list is empty, or an element (the head) connected to its (tail), we have two\
    \ list constructors: [] for the empty list and (:) for lists with a head and tail.\
    \ We'll illustrate pattern matching on lists with a simple example:\n\n```\nimport\
    \ ElmTest exposing (suite, defaultTest, runSuite, assertEquals)\n\ndouble : List\
    \ a -> List a\ndouble list =\n  case list of\n    [] -> []\n    x xs -> x :: x\
    \ :: double xs\n\nmain =\nrunSuite <| \"Test the doubler\" `assertEquals` []\n\
    \  [ defaultTest <| [5, 5, 5, 5] `assertEquals` double [5, 5]\n  , defaultTest\
    \ <| [2, 2, 5, 3, 3] `assertEquals` double [2, 5]]\n```\n\nA Maybe wraps a value\
    \ or it doesn't. Maybe is Elm's option type. We first presented option types in\
    \ the Java chapter as alternative to the \"Billion Dollar,\" a.k.a. null references.\
    \ Elm has null references, so you'll see maybe quite often. And dictionary lookup,\
    \ retrieving the head, tail, minimum, and maximum of all employ maybes. The Maybe\
    \ module defines them as a tagged union:\n\n```\ntype Maybe = Just a | Nothing\n\
    ```\n\nWhile you need to wrap, which unwraps a value while yielding if nothing.\
    \ We will likely employ one of the convenience methods from the Maybe module,\
    \ such as:\n\n+   * withDefault we used in the chapter to use a dictionary to\
    \ count words: insert word (withDefault 0 (get words)) + 1 counts\n* map, which\
    \ safely operates on the wrapped value; e.g., map abs (Just -8) == (Just 8) while\
    \ map abs Nothing == Nothing\n* andThen, which performs a maybe-producing-callback\
    \ on the wrapped value only if present, e.g., ([1,2,3,4] | tail) `andThen` tail\
    \ == Just [3,4]. andThen when you need to chain callbacks by a Nothing can be\
    \ produced at any point on the chain."
