  md: "# 134 Programming Language Explorations\n\n+   * o.orElse(y) returns x if present\
    \ and y otherwise.\n* o.filter(p) returns o if present and p(x) true; it returns\
    \ an empty optional.\n* o.map(f) returns f(x) wrapped if, and an empty optional.\n\
    * o.flatMap(f) is similar; we leave this for the exercises.\n\nLet's get feel\
    \ for these methods with a small example:\n\n```\nimport java.util.Optional;\n\
    public class OptionalDemo {\n    public static void main(String[] args) {\n  \
    \      Person alice = new Person(\"Alice\");\n        Person bob = new Person(\"\
    Bob\");\n\n        bob.getBob().isPresent(p -> { assert alice;});\n        alice.getBob().isPresent(p\
    \ -> { assert false;});\n        assert alice.getBob().orElse(bob) == bob;\n \
    \       assert bob.getBob().orElse(alice) == alice;\n\n        Optional<Person>\
    \ b = bob.getBob();\n        assert b.filter(p -> p.getName().startsWith(\"A\"\
    )) == b;\n        assert b.filter(p -> p.getName().startsWith(\"B\")).isPresent();\n\
    \        assert b.map(p -> p.getName()).orElse(\"Alice\").equals(\"Alice\");\n\
    \        assert alice.getBob().map(p -> p.getName()).orElse(\"Alice\").equals(\"\
    Alice\");\n    }\n}\n```\n\nFor reference, the public methods of the class Optional\
    \ (excluding overrides from superclasses) follow this. In a relatively small space,\
    \ we show both upper and lower wildcards, as well as a few functional interfaces¹⁰\n\
    \n```\nstatic <T> Optional empty()\nstatic <T> of(T value)\nstatic <T> ofNullable(T\
    \ value)\nT get()\nboolean isPresent()\nvoid ifPresent(Consumer<? super T> super\
    \ T predicate)\nOptional<T> filter(Predicate<? super T> super T predicate)\nOptional<U>\
    \ map(Function<? super T, ? extends U> mapper)\nOptional<U> flatMap(Function<?\
    \ super T, Optional<? extends U>> mapper)\nT orElse(T other)\nT orElseGet(Supplier<?\
    \ extends T> excSupplier)\n<X extends Throwable> throwIf(X x)\n```\n\nIn this\
    \ section, we've barely scratched the surface of the world of Java generics. We've\
    \ not had space to cover unbounded wildcards, reification, or capture. To continue\
    \ exploring this area of the Java language, see the Generics in the Java Tutorial\
    \ [91] or Angelica Langer's Generics FAQ [74]. And tuned for further discussion\
    \ of generics later in the book we cover with Rust.\n\n¹⁰Briefly, the functional\
    \ interfaces are: Consumer<T>, a function on T returning nothing; Predicate<T>,\
    \ a function from T to bool; Function<T,U>, a function from T to U; and Supplier,\
    \ a function of no arguments returning a T."
