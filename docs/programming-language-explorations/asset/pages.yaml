  md: "# 11.3 POINTERS\n\nGo, unlike the other languages in the book we've seen so\
    \ far, copies arrays and structs when assigning or passing as parameters. Any\
    \ changes made through a parameter will apply to the copy only, and not affect\
    \ the passed argument:\n\n```\npackage main\n\nimport \"fmt\"\n\nfunc useless(a\
    \ [5]int, b struct{x, y int}) {\n    a[0] = 10\n    b.x = 5\n}\n\nfunc ExampleCopies()\
    \ {\n    z := [5]int{0, 0, 0, 0, 0}\n    p := struct{x, y int}{1, 2}\n    useless(z,\
    \ p)\n    fmt.Println(z)\n    // Output: [0 0 0 0 0] {1 2}\n}\n```\n\nCopying\
    \ the entire array or struct can carry a significant performance overhead, compared\
    \ to the assignment and passing of references. While you can pass references in\
    \ Go, just as you create copies in other languages. Our previous languages copied\
    \ and passed references implicitly and required explicit function invocation to\
    \ make copies, Go implicitly makes copies but gives you a way to explicitly make\
    \ references. Go's explicit references are called pointers.\n\nPointer values\
    \ have types. The type of pointers that reference objects of type t is denoted\
    \ \\*. To make a pointer to an object x, write &x; to dereference a pointer p,\
    \ write *p. Figure 11.1 should help to clarify.\n\n| x | p |\n|---|---|\n| type:\
    \ *int | *p | type: int |\n\nFigure 11.1 Pointers in Go\n\nPassing parameters\
    \ as arguments gives us efficiency, but for better or worse allows mutations through\
    \ parameters to affect the corresponding arguments:\n\n```\npackage main\n\nimport\
    \ \"fmt\"\n```"
