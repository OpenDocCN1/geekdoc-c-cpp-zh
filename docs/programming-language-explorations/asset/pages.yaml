  md: '# Swift


    Swift is an innovative, open source language developed by Apple to make software
    safer, faster, and more fun to create.


    | First appeared 2014 |

    | Creator Apple Inc.

    | Notable versions 1.0 (2014) • 2 (2015) • 3 (2016) |

    | Recognized for Being the modern alternative to Objective-C |

    | Notable uses Native applications for macOS, iOS, watchOS, and tvOS |

    | Tags Imperative, Safe |

    | Six words or less The modern language for iOS |


    In the early 2010s, two operating systems dominated the mobile market: Android
    [40] and iOS [3]. While some mobile developers target only a device''s web browser,
    many opt to write *native* applications in a language and environment built to
    talk directly with the operating system. Android devices are generally programmed
    in Java. iOS devices favor Objective-C or the newer Swift.


    Swift is a powerful, general purpose systems language that feels like a scripting
    language. While best known for its support for the Cocoa framework that provides
    services to iOS and its cousins macOS, watchOS, and tvOS, in this chapter we will
    be on Swift the language, not the APIs. Chris Lautner, is famous for originating
    LLVM—a compiler framework used by many modern programming language implementations.


    Swift design exhibits an elegant, consistent implementation of the best modern
    features. We''ll start with our three example scripts and present the basic elements
    of the language. We''ll pay particular attention to the features of Swift that
    make it a safe language, with such guaranteed memory initialization, static typing,
    overflow checking, and excellent syntactic support for options. But our study
    will not be without features. We''ll see **external parameter names**, for one,
    and look at the role of **protocols** and **extensions** in the type system. Finally,
    we''ll encounter **automatic reference counting**, a mechanism for memory management
    unlike the *tracing* garbage collection of the previous languages on our tour.'
