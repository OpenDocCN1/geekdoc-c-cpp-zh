  md: "# 7.6 THREADS\n\nConcurrency activities whose execution spans overlap in time.\
    \ [98] When we design a system to be concurrent, we focus on these independent\
    \ activities and the interactions between them. One classic example is a word\
    \ processor: in a concurrent design, we define separate agents for input device\
    \ listening, spell checking, hyphenation, line justification, page breaking, and\
    \ so on, rather than define a monolithic function that does bits of each activity\
    \ in different regions of the code. Note that while the lifetime of activities\
    \ overlap in time, it is not necessary (for concurrency) that multiple activities\
    \ execute in parallel, i.e., at the same physical instant on separate processors\
    \ or cores.\n\nIn previous chapters, we've encountered concurrency in Lua coroutines\
    \ and remote processes. In this section, we'll cover Java threads. Unlike coroutines,\
    \ which cooperatively take turns one of execution, threads run on their own execution\
    \ lines, possibly in parallel, and may be preempted by a scheduler when no physical\
    \ units exist for each of the available threads.¹¹¹\n\nLet's see an example. We'll\
    \ start 100 t1...t100, each of which will determine whether i is prime, and print\
    \ the value\n\n```\npublic class PrimePrinter {\n    public static void main(String[]\
    \ args) {\n      for (int i = 1; i <= 100; i++) {\n        final int candidate\
    \ = i;\n        new Thread(() -> {\n          for (int divisor = 2; divisor <=\
    \ candidate; divisor++) {\n            if (divisor == candidate) {\n         \
    \     synchronized (System.out) {\n                System.out.print(\" \" + candidate);\n\
    \              }\n            } else if (candidate % divisor == 0) {\n       \
    \       break;\n            }\n          }\n        }).start();\n      }\n   \
    \ }\n}\n```\n\nOur main thread enters a loop creating 100 instances of the class\
    \ java.lang.Thread. We pass an instance of the functional interface Runnable to\
    \ the thread's constructor. Calling start on the thread invokes its runnable on\
    \ a new thread.¹² Because each thread writes to a shared resource in this case\
    \ System.out we use a synchronized statement to ensure only one thread can call\
    \ its methods at a time, preventing multiple threads from interleaving their outputs.\n\
    \n> ¹Whether or not threads are forcibly preempted at any time is up to an implementation.\
    \ A scheduler may jump from an execution unit only at specific points, such as\
    \ when the thread (voluntarily) waits for an event, a resource to become available,\
    \ or a timer to expire.\n²In our example, the runnable is a closure. Java has\
    \ a rule that closed over variables must be final, so we had to introduce a new\
    \ variable, candidate instead of using i directly."
