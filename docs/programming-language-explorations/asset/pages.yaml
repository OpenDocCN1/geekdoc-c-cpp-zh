  md: '# CHAPTER 6


    # Julia


    Julia is a modern language for scientific and technical computing.


    **First appeared** 2012

    **Creator** Jeff Bezanson, Stefan Karpinski, Viral B. Shah, Alan Edelman

    **Notable versions** 0.4 (2015) ● 0.5 (2016)

    **Recognized** for Multi-dispatch, Macros, Multicore support

    **Notable uses** Data Science, Statistics, Numerical Analysis

    **Tags** High-performance, Dynamic, Multi-dispatch

    **Six words or less** A dynamic language for technical computing


    Julia is targeted to high-performance numeric and scientific computing, where
    it competes with Matlab, Python, and Fortran—languages with well-established and
    mature libraries. While relatively new, Julia brings an impressive set of features
    not only of interest to the statistics and data science communities (as of its
    math-friendly syntax, powerful arrays and matrices), but make it an efficient
    and powerful general purpose language. Language theorists will find its metaprogramming
    facilities of particular interest.


    In this chapter, we''ll tour this new language, beginning with our standard introductory
    programs, then dive right into Julia''s type system. We''ll be seeing several
    topics for the first time in book: **abstract types**, which do not allow instances,
    and **parametric types**, in which a type is dependent on values or other types.
    We will see Julia subtyping, with an interesting restriction not shared by Ruby
    or Python. We''ll also use Julia to introduce the type-theoretical concepts of
    sum and product types, covariance, and invariance.


    Next in our tour is **multiple dispatch**. Of the languages we''ve seen so far
    the appropriate method to execute based on the type of a single *receiver* at
