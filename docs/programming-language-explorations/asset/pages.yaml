  md: "Note Cloj's agent-based programming exhibits strong philosophical differences\
    \ from\n'object-oriented' programming. In OOP, we focus on objects with internal\
    \ state and be-\nhavor for that object in particular or objects of a certain type.\
    \ Agents, on the other\nhand, have state but no behavior! Restrictions are placed\
    \ on the functions you can send\nto the agent. The actions are the center of attention.\n\
    \nEmphasizing functions over objects does not mean we can't model iconic object-oriented\n\
    tasks. In the next section we take a look at what Clojure offers.\n\n# 8.8 THE\
