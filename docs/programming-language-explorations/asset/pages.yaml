    rameters [69]—associated with mutable variables, and time sensitive features such
    as user interaction and animation. Languages we think of functional go to great
    lengths to discourage and contain side-effects. Closure allows controlled mutation
    via vars, refs, and agents, and even let us drop into Java. Relations of Elm,
    as Standard ML and OCaml, provide features that wrap mutable variables.


    Some languages, like Haskell, seem contain even I/O effects. Think back to the
    way operations on persistent data structures must mutate a structure but rather
    produce a new structure. If we wrap (snapshots) of our files and variables into
    a "state" object, then a function may also act as an argument and produce a new
    state as a result. In general, input state can also contain event histories as
    key presses, clicks or gestures on an input device, canvas resizing, or the passing
    of time. Older versions of Elm directly supported these history sequences, calling
    them signals. The signal Mouse. position, of type Signal (Int, Int), for example,
    would have a value such as:


    (3,4) (7) (11,4) (13,3) (19,6)


    Signals, all could be mapped (to perform an operation on each event), filtered
    (to ignore events of no concern), merged (to handle events from multiple sources),
    and folded (to accumulate state). To sketch on a canvas in the early days of Elm,
    we would have line segment function following the mouse position¹¹⁰ Dozens of
    other signals like Keyboard.Arrows and Window.Dimensions lived in the standard
    library. Manipulating asynchronous streams with higher-order functions is known
    as functional reactive programming, or FRP.


    Elm has its FRP heritage built and removed from its core libraries


    Effects are managed within programs. A program is a record with four components:


    +   1. init: (model, Cmd msg) is the initial model, or state, of the application,
    together with a command to launch on startup.

    2. view: model -> Html msg produces HTML for a given model. The HTML may generate
    messages of the type msg.

    3. subscriptions: model -> Sub msg, for a given model, a subscription to sources
    that can produce messages (of type msg) that will be routed to the update function.

    4. update: msg -> model -> (model, Cmd msg) produces a model and message, the
    new model (next state) and a command to invoke.


    Elm provides functions for creating subscriptions on windows, keyboards, mice,
    websockets, geolocation changes, timers, and the browser’s rendering refresh cycle.
    You’ll also find functions for generating commands to produce random numbers and
    perform various asynchronous tasks.


    Let''s start with a simple example. We''ll render an image at the current mouse
    position: the JavaScript logo when the mouse button is up and the Elm logo when
    the mouse button is held down. The model is the mouse position together with the
    name of the view


