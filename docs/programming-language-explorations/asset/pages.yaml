  md: "# 11.8 REFLECTION\n\nWe'll finish our tour of Go with a brief look at some\
    \ of its reflective capabilities. Go doesn't have macros like Closure or Julia,\
    \ but it can glean some information about the entities from which it is composed.\
    \ Here, then, are a few highlights, beginning with both the syntax and the type\
    \ of an expression at runtime. You can get this information in string using the\
    \ %T and %#v format specials:\n\n```\npackage main\n\nimport \"fmt\"\n\nfunc Example()\
    \ {\n\tvar c uint8 = 0x22\n\tvalues := []interface{}{c, [3]int{1,2,3}, \"hello\"\
    , '$', 10}\n\tfor _, x := range values {\n\t\tfmt.Printf(\"%#v has type %T\\n\"\
    , x, x)\n\t}\n\t// Output:\n\t// 0x22 has type uint8\n\t// [3]int{1, 2, 3} has\
    \ type [3]int\n\t// \"hello\" has type string\n\t// 36 has type int32\n\t// 10\
    \ has type int\n}\n```\n\nThe package reflect, however, defines the type Type\
    \ to represent the runtime type of a value:\n\n```\npackage main\n\nimport (\n\
