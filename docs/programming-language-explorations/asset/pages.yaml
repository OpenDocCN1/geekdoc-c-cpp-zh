  md: "# 168 Programming Language Explorations\n\nWe'll spend time with advanced types\
    \ such as tagged unions and a particularly interesting record type with some new\
    \ syntax for its associated operations. We'll close with an overview of subscriptions\
    \ and their role in interactive programs.\n\n# 9.1 HELLO ELM\n\nLet's get right\
    \ to the traditional first program:\n\n```\nimport Html exposing (text, ul, li)\n\
    import List exposing (map, concatMap, filterMap, repeat)\n\nmain =\n  [1..40]\
    \ | concatMap (\\c ->n    [1..c-1] | concatMap (\\b ->n      [1..b-1] | filterMap\
    \ (\\a ->\n        if a*b==c then Just (a,b,c) else Nothing)))\n    | map (toString\
    \ >> repeat 1 >> li []))\n  | ul\n```\n\nThere are no for-loops in Elm (nor statements\
    \ that matter), so we generate right-triangles using mapping and filtering. Rather\
    \ than writing to standard output, we build an HTML unordered list to display\
    \ in a web browser.\n\nDespite its size, this little program highlights a few\
    \ areas that benefit from some explanation:\n\n+   - Function application does\
    \ not require parentheses, f x means f(x). Unlike Coffee-Script, Elm's application\
    \ is left-associative, f x y means f(x)(y).\n- x f means f(x). Similarly, x |>\
    \ g | h means h(g(x)).\n- Anonymous functions enable a backpack and a thin row,\
    \ so \\x e denotes the function with parameter x and body e.\n- g f is the function\
    \ that allows q then f, i.e., (g >> f)x means f(g(x)).\n- concatMap maps a list-producing\
    \ function over a list and flattens (concat) the result. This ensures we have\
