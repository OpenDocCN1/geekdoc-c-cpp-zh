    \")\n\tb := reflect.TypeOf(true)\n\tm := reflect.TypeOf(map[string]bool{\"a\"\
    : true, \"b\": false})\n\tfmt.Println(m, reflect.MapOf(s, b))\n\t// Output: true\n\
    }\n```\n\nIn addition, the package contains representations for expression values\
