    \ method, while Circle is a plain function.\n\n# ## JavaScript, CoffeeScript,\
    \ and Lua have primitives and objects, but Python has objects only. There is no\
    \ need for the complex distinction between primitives and objects. All are values.\
    \ Every object has a unique identifier, accessible to the programmer:\n\n```\n\
    a = 5                          # 5 is an object\nb = {'x': 5, 'y': 3}        \
    \   # dicts are objects\nc = \"hello\"                    # strings are objects\n\
    d = c                           # two variables sharing an object\ne = c.lower()\
    \                  # should generate a new object\nf = 8 * [b['y'] - 19]     \
    \     # what happens here?\n```\n\n```\nfor obj in (a, b, b['x'], b['y'], c, d,\
    \ e, f):\n    print(obj)\n```\n\nOne run of this program produced:\n429311472\n\
