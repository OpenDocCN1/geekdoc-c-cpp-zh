    \ in the class definition:\n\n```\nclass Animal:\n    def __init__(self, name):\n\
    \        self.name = name\n    def speak(self):\n        return '{}} {}'.format(self.name,\
    \ self.sound())\n\nclass Cow(Animal):\n    def sound(self):\n        return 'moooo'\n\
    \nclass Sheep(Animal):\n    def sound(self):\n        return 'baaaaaa'\n```"
