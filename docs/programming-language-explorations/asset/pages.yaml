    \ Let's look at the third case close. The macroexpansion\n\n```\n(macroexpand\
    \ (or alpha beta delta))\n```\n\nyields\n\n```\n(let* or_4469_auto_ alpha\n (if\
    \ or_4469_auto__\n  or_4469_auto__\n  (clojure.core/or beta gamma delta)))\n```\n\
    \nSuffixed with a hash character causes the macroexpansion to generate a new symbol\
    \ guaranteed not to conflict with any; this prevents the macro from accidentally\
    \ shadowing an existing binding. Also note the use of *unquote splicing* (-).\
    \ We had simply written -next rather than ~next, our expansion would have ended\
    \ with (clojure.core/or(beta gamma delta)). Splicing helps a great deal in making\
    \ macros easy to read.\n\nMacros are not features, but common in Clojure. A large\
    \ number of definitions in the standard library are macros, including if-not,\
    \ when, delay, and, or, locking ->, defmulti, defmethod, dotimes, doseq and literally\
    \ doesn. You can find the source code for these macros at [57].\n\nMacros provide\
    \ means to transform code prior to execution, they give us the ability to create\
    \ powerful language extensions in a way that is qualitatively different from adding\
    \ functions to a standard library. There are no limits to the macros you can create.\
    \ However, as any high-level language, you will see some forms that are low-level,\
    \ so wired in the inner workings of Clojure itself, that they could not be (possibly\
    \ or conveniently) even written as. There are a few, and here in Clojure as special\
    \ forms. We listed for a reference, of these, in Table 8.1.\n\nClojure, like Lisps,\
    \ uses special forms where other languages use syntactic structures as if and\
    \ while statements, declarations, and all kinds of punctuation. In Clojure, there\
    \ is really no syntax; all is abstract syntax, where function calls, macros, and\
    \ special invocations all look the same. This makes writing a bit less cumbersome\
    \ than say, in Julia, where the programmer must understand the abstract syntax\
    \ tree of the code being generated. It will always, perhaps, a design choice that\
    \ is both popular and very unpopular. But there's something compelling, perhaps\
    \ profound, about this integration of code and data, the homoiconicity, and the\
    \ ease of metaprogramming in the family of Lis Languages. Something worthwhile,\
