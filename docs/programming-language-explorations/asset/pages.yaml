  md: '# 224 Programming Language Explorations


    # 11.4 SLICES


    So we can build a dynamic collection of strings wired together with pointers.
    But what about dynamic arrays? If an array''s length is part of its type (i.e.,
    `[10]int`), how can we write a function that accepts an integer array of any size?
    Go''s notion of the array-of-any-size is a slice. A slice is a range of elements
    from an underlying physical array.


    Figure 11.3 shows an array and slices `s = a[2:8]` and `t = a[6:]`. We form slices
    with the inclusive start index of the array and the exclusive end index. The slices
    contain (1) a pointer to the starting element, (2) the number of elements in the
    slice, `len`, and (3) the capacity of the slice, `cap`, derived from the length
    of the underlying array.


    ![](img/2cd8452ff5a372a7459559ad1d0834e4_242_0.png)


    Figure 11.3 Go Slices


    Because slices contain pointers, they share storage with the underlying array
    and may happen to overlap. In Figure 11.3, `s[4]`, `t[0]` and `a[6]` are aliases
    of each other. And like a pointer, a slice can have the value nil. A nil slice
    has zero length and zero capacity...and is the zero value of slice variables.


    In practice, we generally construct slices via slice literals or the built-in
    function `make`. Evaluating the slice literal `[]int{1, 1, 2, 3, 5, 8, 13}` builds
    a 7-element array and a slice that covers the entire array (a slice of length
    7 and capacity 7). Evaluating `make([]int, 5, 8)` creates an 8-element array and
    a slice of length 5 and capacity 8 overlaying indices 0 through 4 of the array.
    You can also write `make([]T, n)` to make a new slice whose length and capacity
    are `n`. And as you''d probably expect, make will initialize the slice to the
    zero value of T.


    You can add elements to the end of a slice with the built-in function `append`,
    which will continue to use the underlying array if the capacity exists, otherwise
    a new array will be allocated and the elements copied prior to appending. If you''d
    like to copy elements between slices, use the built-in `copy` function.


    This is a lot to take in, we''ll provide an annotated example to clear out this
    section.


    > ⁶The capacity is the length of the underlying array minus the start index of
    the slice plus.


    > ⁷Go shares slice syntax with Python, including the shorthands `a[:n]` for `a[0:n]`
    and `a[:len(a)]`.'
