  md: '# 6.3 TYPES


    Julia''s type system will remind you of Python''s and Ruby''s types are JavaScript''s:
    there''s no distinction between primitive and reference types, types are themselves
    objects (so there''s a type called Type), types are organized into a hierarchy
    (single-inheritance only), there are separate types for integers and floats, and
    you can define your own types. Julia''s basic types go even further, distinguishing
    signed and unsigned integers, providing types for various bit lengths, and providing
    a rational number type.¹


    We show a part of the hierarchy of built-in types in Figure 6.1. Julia adds several
    typing concepts we''ve not yet seen: abstract types², parametric types, and union
    types. These are new and interesting concepts for us, so we will look at each
    in detail.


    | Any | Char |

    |---|---|

    | Real | AbstractString |

    | Integer | DirectIndexString |

    | Bool | ASCIIString |

    | Signed | UTF32String |

    | Int8 | UTF8String |

    | Int16 | UTF16String |

    | Int32 | AbstractArray{T,N} |

    | Int64 | Array{T,N} |

    | Int128 | BitArray{T,N} |

    | Unsigned | SharedArray{T,N} |

    | UInt8 | Range{T} |

    | UInt16 | FloatRange<T:<AbstractFloat> |

    | UInt32 | OrdinalRange<T,S> |

    | UInt64 | StepRange<T,S> |

    | UInt128 | UnitRange<T:<Real> |

    | BigInt | Set{T} |

    | Rational<T:<Integer> | Function |

    | AbstractFloat | Regex |

    | Float | Type{T} |

    | Float32 | DataType |

    | Float64 | TypeConstructor |

    | BigFloat | Union |

    | Irrational(s) | Symbol |

    | Complex{T:<Real} | Void | Expr


    > Figure 6.1 A view of the hierarchy of built-in types


    # 6.3.1 Abstract Types


    Every type is either abstract or concrete. Every value has a single concrete type;
    for example, 2.54 has the type Float64. Let''s explore for a few more:


    +   ¹You can find details of these various numeric types in Appendix A.

    ²Python does “support” the notion of an abstract class through abc library module,
    but Julia offers support for the concept directly in the language itself.'
