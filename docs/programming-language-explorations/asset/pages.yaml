  md: "# Here's word frequency script:\n\nimport Foundation\n\n```\nvar counts = [String:\
    \ Int]()\n\nwhile let line = readLine()?.lowercased() {\n    let range = line.startIndex..<line.endIndex\n\
    \    line.enumeratedSubstrings(in: range, options: .byWords) { word, _, _ in\n\
    \        guard word = word else { return }\n        counts[word] = (counts[word]\
    \ ?? 0) + 1\n    }\n}\n\nfor (word, count) in counts.sorted({$0.0 < $1.0}) {\n\
    \    print(\"\\(word) \\(count)\")\n}\n```\n\nWe begin script by defining an initially\
    \ empty dictionary to store words and their counts. As we've seen in other statically\
    \ typed languages, we must mention the type of the empty dictionary explicitly\
    \ since it can't be inferred.\n\nThe loop that gathers words from standard input\
    \ employs some excellent Swift idioms that almost make us forget using a safety,\
    \ statically-typed language. Swift has optional types, and provides the ? for\
    \ safety dereferencing, and the nil-coalescing operator `??`, which evaluates\
    \ and produces its second operand only if its first operand is nil. We iterate\
    \ through the key-value pairs of the dictionary in order by supplying a comparator\
    \ as a `closure`. Swift uses two different closure syntaxes: `(params in body)`\
    \ and the body-syntax, in which parameters are named $0, $1, and so on. The comparator\
    \ body illustrates element access for a tuple `t`: t.0, t.1, t.2.\n\nTo extract\
    \ words from a line, we use `enumeratedSubstrings` from a string extension in\
    \ the **Framework**. The method takes a range (rather than a string), from an\
    \ enumeration type, and a closure. The function's last argument is a closure,\
    \ Swift lets us write it after the parenthesized arguments—a syntax reminiscent\
    \ of Ruby. The callback to the subscript enumerator returns an optional string,\
    \ which we must unwrap before using. We've used a `guard` statement for this purpose;\
    \ it explains its semantics, and alternatives to it, later in the chapter.\n\n\
    # 12.2 THE BASICS\n\nSwift is a modern language, sporting default parameters,\
    \ parameter packing and unpacking, static typing with inference, first-class functions\
    \ and closures, extensive pattern matching and binding capabilities, option types\
    \ in lieu of null references, and generics. We hit the basics very quickly, introducing\
    \ new features and terms as we come up. We'll learn protocols, extensions, and\
    \ discussions of safety features in future sections.\n\nThe standard library includes\
    \ the signed integer types `Int8`, `Int16`, `Int32`, and `Int`; unsigned integer\
    \ types `UInt8`, `UInt16`, `UInt32`, `UInt64`, and `UInt`; and floating-point\
    \ types `Float` (32-bits) and `Double` (64-bits). The types `Bool`, `Character`,\
    \ and `String` should be familiar, unlike Go, Swift's character and string types\
    \ understand actual characters"
