    In some cases, a single Unicode character exists for an equivalent grapheme cluster.
    For example, the code point U+0065 (LATIN SMALL LETTER E) U+0303 (COMBINING DIAERESIS)
    represents the same text as the single code point U+00EB (LATIN SMALL LETTER E
    WITH DIAERESIS), namely ë. Your favorite programming language may or not be able
    to compute these natively.


    Many languages use functions to produce the character for a given code point and
    the code point of a given character. Characters can usually be specified by code
    point within a string literal; the string, valid in JavaScript, CoffeeScript,
    Ruby, July, Java, Scala, and many other languages, includes a happy character:


    "Have a nice day! \u0236"


    In addition to four-hex-digits-following-\u, you typically use two characters
    following \x, each following \u, and anywhere between one and eight characters
    in \u{...}.


