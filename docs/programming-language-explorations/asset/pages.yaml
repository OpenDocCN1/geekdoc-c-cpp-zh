  md: "# Java 125\n\n| Class Modifier | Description |\n| --- | --- |\n| no modifier\
    \ | accessible only within its package |\n| public | accessible wherever its package\
    \ is |\n| abstract | cannot be instantiated (may have abstract methods) |\n| final\
    \ | cannot be extended (subclassed) |\n| static | specifies a nested top-level\
    \ class (See end-of-chapter exercises) |\n| Member or Constructor Modifier | Description\
    \ |\n| --- | --- |\n| no modifier | accessible only within its package |\n| private\
    \ | accessible only within its class |\n| protected | accessible only within its\
    \ package and subclasses |\n| public | accessible wherever its class is |\n| Field\
    \ Modifier | Description |\n| --- | --- |\n| final | value may not be changed\
    \ once assigned |n| static | only one instance of the field shared by all objects\
    \ of the class |\n| transient | not serialized |\n| volatile | value may change\
    \ asynchronously, so the compiler must avoid certain optimizations |\n| Method\
    \ Modifier | Description |\n| --- | --- |\n| final | may not be overridden |\n\
    | static | method does not apply to a particular instance |\n| abstract | no body;\
    \ to be implemented by a subclass |\n| synchronized | locking the object before\
    \ execution |\n| native | implementation is not written in Java, but rather in\
    \ some platform-dependent way |\n\nTable 7.1 Java Modifiers\n\n```\npublic class\
    \ CircleApp {\n    public static void main(String[] args) {\n        Circle c1\
    \ = new Circle(3, 5, 1);\n        Circle c2 = Circle.create(2, 8, 10);\n     \
    \   assert c1.area() == Math.PI && c2.area() == 100*Math.PI;\n        assert c2.area()\
    \ == 4*Math.PI;\n    }\n}\n```\n\nNote how static methods are called as if they\
    \ were defined in the class Class (of which Circle is an instance), technically,\
    \ this is not the case. Both static methods and instance methods belong to Circle,\
    \ though only instance methods have a receiver.\nLike Julia, Java has both abstract\
    \ and concrete classes. Java allows both abstract and concrete classes to have\
    \ subclasses (unlike Julia, where only abstract types can have subtypes). Our\
    \ recurring animals example illustrates inheritance in Java:"
