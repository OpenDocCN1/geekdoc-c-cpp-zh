  md: "# Python 71\n\nWriting iterables and iterators from scratch can be a bit tedious,\
    \ Python provides generators to simplify the creation of iterable sequences. A\
    \ generator results from calling a function containing a yield statement. Executing\
    \ such a function does not invoke the function's body, but rather returns a generator\
    \ object. Here's a generator that produces powers of two, up to some limit:\n\n\
    ```\ndef powers_of_two(limit):\n    value = 1\n    while value < limit:\n    \
    \    yield value\n        value += value\n\n# Use the generator\nfor i in powers_of_two(70):\n\
    \    print(i)\n\n# Explore the mechanism\ng = powers_of_two(100)\nasert str(type(powers_of_two))\
    \ == \"class 'function'\"\nasert str(type(g)) == \"class 'generator'\"\nasert\
    \ g.__next__() == 1\nasert g.__next__() == 2\nasert next(g) == 4\nasert next(g)\
    \ == 8\n```\n\nCalling a generator creates an object and assigns to it _iter__\
    \ and __next__ methods. It assembles, on the fly, the code to raise StopIteration\
    \ at the proper time.\n\nInterestingly, we can write an iterator that never raises\
    \ a StopIteration exception—in other words, an infinite sequence:\n\n```\ndef\
    \ powers_of_two(limit):\n    value = 1\n    while True:\n        yield value\n\
    \        value += value\n```\n\nIf the iteration scheme is simply sufficient,\
    \ you can create a generator with a generator expression, which looks like a list\
    \ comprehension with parentheses instead of square brackets. Generator expressions\
    \ have the advantage over list comprehensions of not having compute and store\
    \ the entire data in memory.\n\n+   * List comprehension.\n* Computes all of its\
    \ elements first.\n* If large, it's too slow to produce and wastes memory.\n \
    \ bad = [x*x for x in range(10**9)]\n* Generator expression.\n* Produces values\
    \ on demand, during iteration.\n* Computed instantly and consumes almost no memory.\n\
    \  good = (x*x for x in range(10**9))"
