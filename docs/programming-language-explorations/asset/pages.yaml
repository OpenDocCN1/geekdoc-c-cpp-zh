    - If $x$ is a string and $y$ is an unsigned integer, we have repetition, e.g.,
    times("ho",3) -> "hoboho"

    - If $x$ is a vector and $y$ is a number, we have element-wise multiplication,
    e.g., times([1,2,3],3) -> [3,6,9]

    - If $x$ is a number and $y$ is a vector, we also have element-wise multiplication,
    e.g., times(5,[1,2,3]) -> [5,10,15]'
