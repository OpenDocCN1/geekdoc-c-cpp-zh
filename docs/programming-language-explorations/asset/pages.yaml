    |---|---|---|

    | 8 | i8, int8_t, byte | -128...127 |

    | 16 | i16, int16, int16_t, short | -32768...32767 |

    | 32 | i32, int32, int32_t, int | -2147483648...2147483647 |

    | 64 | i64, int64, int64_t, long | -9223372036854775808...9223372036854775807
    |


