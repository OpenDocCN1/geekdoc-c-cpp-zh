  md: '# Introduction 7


    It''s probably good that a language designed expressly for the purpose of formatting
    printed documents might not be good for writing web servers. So is the point of
    arguing whether PostScript is better than Go? The correct retort to “A is better
    than B” is “For what, exactly?”


    In addition to the kinds of problems a language was designed to solve, we need
    to understand how a language solves these problems. We can then classify languages
    in a way that enables us to compare and contrast. Unlike books and company organization
    charts, we can fit programming languages into a neat, hierarchical ontology. It
    isn''t too surprising; in many knowledge disciplines, hierarchies simply don''t
    exist. Clay Shirky makes this point beautifully in his Ontology [109]. When there
    is no hierarchy, we employ tags. Here are a few tags we can use to label languages:


    +   `Declarative` `Applicative` `System` `Visual` `Logic` `Von Neumann` `Object-Oriented`
    `Expression-Oriented` `Persistent` `Concurrent` `Reactive` `Dataflow` `Stack`
    `Free-Form` `Curly Brace` `Visual` `Compiled` `Interpreted` `Very High-Level`
    `System` `Scripting` `Glue` `Intermediate` `Esoteric` `Toy` `Educational` `Domain-specific`


    A given language will generally have a few tags. Java, for example, was introduced
    to the world as simple, object-oriented, familiar, robust, secure, architecture
    neutral, functional, high-performance, interpreted, and dynamic [42]. Scala, is
    both functional and object-oriented. Understanding the various tags, or categories,
    provides contextual information for language evaluation. But on what criteria
    might we evaluate?


    We may, for example, look at technical reasons:


    +   **Readability.** A significant portion of a programmer''s time is spent trying
    to figure out existing code. Code must be understandable enough to be validated,
    fixed, or adapted to new requirements.

    **Writeability.** Sometimes a language makes programming a chore, requiring one
    to fit a solution into the language''s “opinionated” constraints. James Hague
    calls these puzzle languages, “if it takes focused thought to think about that
    solution into working code, go you do one path back up, then again, try something
    completely different—then you are almost certainly using a puzzle language.”

    **Expressiveness.** It''s not lovely when A=C works—when A, B, and C are matrices?
    Or can we avoid writing types because the compiler infers the types for us? Or
    when we have high-level constructs to make concurrent programming safe without
    having to remember to acquire and release locks? Or when we can simply express
    what we want and have the system figure out how to get it for us?

    **Guidance.** It can be frustrating when programmer uses a value of the wrong
    type, or forgets a case in a switch statement, or mis-indents, and the code executes
    with surprising results. Some languages try to make common mistakes impossible.

    **Efficient compilation, efficient execution**, and who wants to sit around waiting
    for code to compile³ or run?


