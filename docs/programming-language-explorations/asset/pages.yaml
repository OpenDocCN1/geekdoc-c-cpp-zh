  md: "```\nif __name__ == '__main__':\n    s = Horse('CJ')\n    assert s.speak()\
    \ == 'CJ says neigh'\n    c = Cow('Bessie')\n    assert c.speak() == 'Bessie says\
    \ moooo'\n    assert Sheep('Little Lamb').speak() == 'Little Lamb says baaaa'\n\
    ```\n\nWe've made Animal superman of its three subclasses Horse, Cow, Sheep. Animal\
    \ is a superman too, namely object, the ultimate superman of all classes in Python.\
    \ Instances of subclasses inherit attributes of their superclass(es), so, for\
    \ example, any instance of Horse we create no but also __init__, and speak attributes.\
    \ We've illustrated this at the bottom of the script, where we create a horse,\
    \ cow, and sheep and have them speak. (We've isolated the test code inside of\
    \ __name__ is set to \"__main__\", which happens to execute only when the script\
    \ is run at the top-level, and not imported into another module. As a matter of\
    \ fact, we will import this method in the next example, so our illustration of\
    \ this common idiom quite timely.)\n\nClasses can have multiple superclasses,\
    \ a condition known as multiple inheritance. Consider:\n\n```\nfrom subprocess\
    \ import call\nfrom animals import Cow\n\n# Disclaimer: This only works on an\
    \ U.S. with a say command.\nclass Vocalizer:\n    def vocalize(self):\n      \
    \  call(f'{self.name + ' says ' + self.sound()}')\nnclass VocalCow(Vocalizer,\
    \ Cow):\n    pass\n\nc = VocalCow('Bessie')\nprint(c.speak())  # speak is inherited\
    \ from Cow\nc.vocalize()  # vocalize is inherited from Vocalizer\n```\n\nNothing\
    \ too surprising here: A VocalCow can both speak and vocalize (see Figure 4.2)\
    \ but what if we called the vocalizer method instead of vocalize? Would VocalCow\
    \ have two speak? Or would one be inherited and not the other? The attempt to\
    \ build the class with two superclasses fails because of the name clash?\n\nThis\
    \ question is entirely about how Python finds attributes of an object that's class\
    \ does not define directly. In the languages we've seen previously, we look up\
    \ along a single prototype chain, but in Python we need to know whether to look\
    \ first in Cow or Vocalizer for attributes not in VocalCow. Python addresses this\
    \ by giving each class a method resolution order, or MRO. In our case, evaluating\
    \ VocalCow.mro() produces:\n\n[VocalCow, Vocalizer, Cow, Animal, object]\n\n>\
    \ 2That we can even ask this question has led some language designers to simply\
    \ avoid multiple inheritance.\n3Think of this as an attribute, rather than \"\
    just\" a method, lookup order."
