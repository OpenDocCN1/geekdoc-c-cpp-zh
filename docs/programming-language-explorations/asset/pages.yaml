  md: "# 192 Programming Language Explorations\n\n# 10.1 HELLO ERLANG\n\nOur traditional\
    \ first program. We've set it up to run as a command line script, admittedly not\
    \ the most common use case for Erlang—telecom and messaging networks don't usually\
    \ write to standard output. Still, the distribution comes with a little utility\
    \ called escript, which runs the second through last lines of a file:\n\n```\n\
    % First line is ignored when running with escript\nmain() ->\n  lists:foreach(fun\
    \ (C) ->\n    lists:foreach(fun (B) ->\n      lists:foreach(fun (A) ->\n     \
    \   if\n          A*A + B*B == C*C -> format(\"-p, -p, \"-n\", [A,B,C]);\n   \
    \       true -> ok\n        end\n      end, seq(i,B)\n    end, seq(i,C)\n  end,\
    \ seq(i,40)).\n```\n\nThis script shouldn't appear too unusual. Requiring a main\
    \ function is not odd (we saw that in Java), nor is the foreach-with-callback\
    \ of nested loops (we saw that in Ruby). We qualify items from external modules\
    \ with a colon: seq and the lists module and format come from the module io. The\
    \ if-expression must produce a value for all possible clauses, though we ignore\
    \ the return of the second clause. Formatting differs with -p formats values in\
    \ their standard form, and -n produces a new line. Commas separate small things\
    \ (e.g., parameters in a function call), semicolons separate medium things (in\
    \ a case expression) and periods end things (such as top-level declarations).\
    \ Interestingly, must begin with a capital letter or underscore; we'll see that\
    \ later.\n\nWe can get a shorter script using list comprehensions, though this\
    \ approach needlessly constructs a list of return values from io:format:\n\n```\n\
    % First line is ignored when running with escript\nmain() ->\n  format(\"-p, -p,\
