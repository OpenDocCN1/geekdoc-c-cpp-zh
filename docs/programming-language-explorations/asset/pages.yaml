  md: 'The implementation of floating point division will execute fast the Elm compiler
    can access lower-level code through its Native.Basics module,but the point is
    that you won''t see operators appearing in the syntax definition for the language;
    they are simply functions.


    A final note on precedence: prefix function application always binds tighter than
    infix application. While very simple, the rule does lead to a few gotchas that
    the programmer coming to Elm from other languages might want to keep in mind:


    ```

    negate 3 ~ parses as (negate 3) ~ 4

    show x * y parses as (show x) * y + z

    ```


    You, of course, perhaps as expected, or may like the use of the application operator
    <| from precedence level 0:


    ```

    negate <| 3 ~ 4 parses as negate(3 ~ 4)

    show <| x * y parses as show(x * y + z)

    ```


    Surprisingly, that covers most of the basics. In the remainder of the chapter
    we will cover two fascinating items that are characteristic of the ML family,
    powerful type inference facility and tagged unions; one characteristic of ML family
    languages, extensible records; and Elm''s approach to interactivity (subscriptions
    and commands).


    # 9.3 TYPE INFERENCE


    Elm performs typing: it checks the types of expressions at compile time and refuses
    to execute programs that may have type errors. It is the second language in this;
    Java was the first.In order to typecheck before execution, the compiler must be
    given information about the intended types of expressions or be smart enough to
    infer them. Java is capable of relatively little type inference, requiring type
    annotations on nearly all variables, method parameters and return values, fields
    in classes and interfaces, etc. Elm infer the type of nearly every expression.
    The three other statically-typed languages⁵ in this book, Go, Swift, and Rust,
    fail somewhere in the middle of the spectrum.


    Elm''s type inference ability, like that of all ML-family languages, has its theoretical
    roots in the Hindley-Milner type system [135, 86, 22]. Elm''s compiler computes
    (or deduces), the least general type of expression not already explicitly annotated.
    Let''s start with a very simple example. Consider the Elm:


    ```

    import String exposing x s =

    repeat (sqrt s)) s

    ```


    ³Needless to say, Elm programs will never touch Native.Basics, or its cousins
    as Native.Utils, Native.String, and Native.Time.


    ⁴Though technically, Java leaves a tiny amount of type checking to runtime in
    cases.


    ⁵Colloquially, we say a language is statically-typed if it performs the majority
    of type checking prior to execution.'
