  md: "# 202 Programming Language Explorations\n\nErlang allows the receive expression\
    \ as follows. It examines the first message in the mailbox (messages are queued\
    \ in the order they arrive), and attempts to match the message against each receive\
    \ pattern, in order. Just as case expressions and functions, receive patterns\
    \ may have guards. If a matching pattern with true guard is found, the corresponding\
    \ body is evaluated to produce the result of the receive expression. If no is\
    \ found, the second message in the mailbox is considered (and so on until the\
    \ entire mailbox). If no message applies, the receive expression blocks until\
    \ a good message arrives—or until a timeout expires, if one provided (which we\
    \ will see soon).\n\nLet's revisit our cooks and customers simulation from the\
    \ Java chapter, with couple modifications for variety. Each customer eats 10 times\
    \ and then leaves. Customers place an order in an order pool; cook fetches from\
    \ the pool. Cook orders and deliver the prepared meals directly to the customer's\
    \ table. If customers do not get timely service, they going and return later,\
    \ where they will find, and cold food.\n\nIn our simulation, the pool is not shared,\
    \ global data structure but is itself a process. A customer places an order by\
    \ sending to the pool message {place, {pid, food}}, where pid is the process id\
    \ of the customer. Processes frequently send their own pid so they can be called\
    \ back. A cook who is ready to work sends to the pool message {ready, pid}; if\
    \ any orders have been placed, the pool sends the cook message {prepare, {customerpid,\
    \ food}}, instructing the cook to prepare a meal for the customer. After preparing\
    \ the meal, the cook messages the customer with {serve, meal}. Figure 10.1 describes\
    \ the scenario in picture form.\n\n![](img/2cd8452ff5a372a7459559ad1d0834e4_220_0.png)\n\
    \nFigure 10.1 Message passing in the Erlang restaurant simulation\n\nOur script\
    \ creates the order pool and passes its pid to each of the customer and cook processes\
    \ upon their creation. After each of the processes are spawned, the script sleeps\
    \ for three minutes, simulating the amount of time the restaurant stays in business.\
    \ Instead of waiting for completion processes from our actors, the simulation\
    \ uses the fact that the main process stays in an script application, the entire\
    \ process lasts forever.\n\n% First line is ignored when running with script\n\
    \n```\nmain() -\n  Orders = spawn(order_pool, run, []),\n  [spawn(cook, run, [Name,\
    \ Orders]) || Name <- [\"Aly\",\"Rob\",\"Chi\"]],\n  [spawn(customer, run, [Name,\
    \ Orders]) || Name <- [\"Xia\",\"Ann\",\"Bo\",\n\"Rai\",\"Ali\",\"Kat\",\"Esche\"\
    ,\"Sen\",\"Ami\",\"Lina\",\"Ara\",\"Zuri\"]]],\n  timer:sleep(18000).\n```\n\n\
    > Clauses works without guards if they have a true guard."
