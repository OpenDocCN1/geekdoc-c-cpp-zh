  md: "# Programming Language Explorations\n\nLet's take a brief look at lower bounded\
    \ wildcards with a trivial example. We can add sheep to sets of sheep, sets of\
    \ animals, or even sets of objects:\n\n```\nimport java.util.Set;\nimport java.util.HashSet;\n\
    \npublic class SheepAdder {\n    public static void main(String[] args) {\n  \
    \      Set<? super Sheep> s1 = new HashSet<Object>();\n        Set<? super Sheep>\
    \ s2 = new HashSet<Animal>();\n        Set<? super Sheep> s3 = new HashSet<Sheep>();\n\
    \        Sheep sheep = new Sheep(\"Rafe\");\n        s1.add(sheep);\n        s2.add(sheep);\n\
    \        s3.add(sheep);\n    }\n}\n```\n\nWildcards cannot be used to instantiate\
    \ objects; however, bounded type parameters exist for this purpose. Bounded type\
    \ parameters can only have upper bounds. We'll illustrate their usage with an\
    \ example:\n\n```\nimport java.util.List;\nimport java.util.Arrays;\n\npublic\
    \ class MinMax<C extends Comparable> {\n    private C min;\n    private C max;\n\
    \    public MinMax(C x, C y) {\n        min = x.compareTo(y) < 0 ? x : y;\n  \
    \      max = x.compareTo(y) > 0 ? x : y;\n    }\n    public C getMin() { return\
    \ min; }\n    public C getMax() { return max; }\n}\n```\n\nNote that we both fields\
    \ hold the type C, restricted to classes implementing interface Comparable. Only\
    \ by using the same type for both fields could we state that both fields have\
    \ the same type. A wildcard cannot express this constraint.\n\nTo round out our\
    \ generics, we will look at options, one approach to mitigating the previously\
    \ mentioned \"billion dollar mistake.\" The mistake, you'll recall, is the inclusion\
    \ of the value null in every reference type. Given a variable of type s, the expression\
    \ s.length() may fail—a NullPointerException, or NPE—whenever s is null. Static\
    \ typing does not help us here: the Java type system has no type of exclusively\
    \ non-null strings. NPEs can happen any time, so the defensive programmer resorts\
    \ to surrounding methods with if-null checks.\n\nWhy do null values exist? Null\
    \ expresses the absence of a value. Considering a person with a required name,\
    \ but optional bonus. We could type the name and body fields as\n\n> Comparable's\
    \ sole method compareTo should be implemented as follows: return a negative integer\
    \ from x.compareTo(y) if x < y, if x = y, and a positive integer if x > y."
