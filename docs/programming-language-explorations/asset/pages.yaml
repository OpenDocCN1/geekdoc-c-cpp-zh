  md: '# CoffeeScript


    CoffeeScript attempts to “expose the good parts of JavaScript in a simple way.”
    [10]


    **First appeared** 2009

    **Creator** Jeremy Ashkenas

    **Notable versions** 1.0 (2010) • 1.10 (2015)

    **Recognized** for Transpiling JavaScript, Expressiveness

    **Notable uses** Web application clients

    **Tags** Functional, Expression-Oriented, Dynamic

    **Six words or less** "It''s Just JavaScript"


    CoffeeScript appeared in late 2009 with the goal of making web application clients
    easier to write. CoffeeScript code is universally translated into JavaScript for
    execution. In fact the **golden rule of CoffeeScript** is “It’s JavaScript.


    CoffeeScript exposes JavaScript’s Good Parts only, and introduces a handful of
    features that were not present in JavaScript when CoffeeScript was first written,
    from destructuring default parameter values, splats, and the `class` syntax for
    creating constructors and prototype properties. It also features a few concepts
    not(!) in JavaScript, including the existential operators, the `do` construct,
    and comprehensions. It is an **expression-oriented language** where JavaScript
    has `while`, `for`, and `if` statements, these constructs are *in* CoffeeScript.


    CoffeeScript, by design, removes a lot of “noise” in JavaScript. It does away
    with curly braces (preferring indentation), parentheses for function calls (though
    you can use them if you like), and allows object literals to forego braces and
    indented lines for each property. Many of the messy parts of JavaScript have no
    translation at all. It wisely throws out JavaScript’s `==` completely: writing
    `=`, and its synonym is `is`, transpiles (translates at the source level) to JavaScript’s
    `==`.


    In this chapter, we will treat CoffeeScript as a language in its own right, but
    because of its golden rule, we''ll make extensive comparisons with the language
    of the previous chapter.'
