  md: '# CHAPTER 10


    # Erlang


    Erlang was designed for building fault-tolerant, long-lived applications that
    handle a large number of concurrent activities, meet real-time constraints, scale
    across large distributed networks, and are able to be modified while running.


    | First appeared 1986

    | Developed at Ericsson

    | Notable versions R15B (2011) • 17.0 (2014) • 19.0 (2016)

    | Recognized for Concurrency support

    | Notable uses Telecom

    | Tags Concurrent, Scalable

    | Six words or less for incredibly high-availability applications


    Organizations and personnel responsible for service availability like to talk
    about nines. "Five nines" mean up and running 99.999% of the time, down only five
    minutes per year. Seven nines mean down three seconds per year (or two minutes
    every seventy years). Can a language help users (developers) achieve high availability?
    Erlang can, and it''s almost entirely functional. Processes are lightweight and
    sharing nothing, communicating only via messages. Processes distribute over machines
    transparently. And if you need to replace or upgrade software, you do it when
    the code is running.


    Like Java, Erlang arrived with its own machine. And just as hundreds of languages
    have been targeted to Java''s JVM, a number of up-and-coming languages (including
    Elixir, Joxa, and LFE) depend on Erlang''s BEAM.


    In this chapter, we explore real "unusual" syntax but this just adds to the reasons
    we''d wish to study it. We will encounter new vocabulary as we learn about atoms,
    references, binaries, and processes, and we''ll see pattern matching in place
    of if statements. Messaging, though, is what makes Erlang Er, and we''ll see a
    number of examples. We''ll learn, too, about the "let it crash" philosophy.


    Erlang is the oldest of the 13 languages on our tour, but new versions arrive
    regularly. We see it used in modern applications like CouchDB, RabbitMQ, WhatsApp,
    and Whisper. If you haven''t yet seen a language like before, chances are you
    will find a great deal you can''t wait to try out.


    191'
