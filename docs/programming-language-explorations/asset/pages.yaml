    \ subtree and a right subtree:\n\n```\nindirect enum Tree<T> {\n    case empty\n\
    \    case node(Tree, T, Tree)\n\n    var size: Int {\n        case .empty: return\
    \ 0\n        case .node(let left, _, let right):\n            return left.size\
    \ + 1 + right.size\n    }\n}\n```\n\nlet t: Tree<Int> = .node(.node(.empty, 3,\
