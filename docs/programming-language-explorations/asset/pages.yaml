    Our examples so far highlighted three interesting aspects of the concurrent Erlang
    philosophy:


    +   - Processes manage state calls by passing persistent data structures to recursive
    invocations of the function receiving receive processes.\n- Process communication
    is data-driven rather than procedure. Our cooks do not, in our example, we call
    a serve method on a customer. Instead, the cook places a message in the customer''s
    mailbox with the "action" as one of the fields in the message. The only verbs
    used in communication are send and receive. Any operations required by the processes
    (such as place, order, and cook) are determined by examining the message internals
    and pattern matching. However, in production-quality applications, you may wish
    to create domain-specific functions in order to keep the processes from knowing
    the details. Doing so allows changes to message formats without breaking the high-level
    interaction between the actors.\n We''ve not used any process pools; we create
    processes as needed and let Erlang worry how many processes are too many processes
    and how they are to be scheduled.


    There''s one more piece of Erlang''s approach to concurrency we''ll cover in our
    brief tour of the language: error handling. A process may (seemingly at any time)
    crash—that is, by generating a runtime error. We don''t want an error to bring
    down the rest of the system, so the programmer should wrap all process bodies
