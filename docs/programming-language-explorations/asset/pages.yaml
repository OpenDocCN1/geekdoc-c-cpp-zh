  md: '# JavaScript 15


    JavaScript is a weakly-typed language, because more often than not, values of
    one type can appear where values of other types are expected. For example:


    +   - In if and while statements expecting a boolean condition, any value can
    appear. 0, null, undefined, false, NaN, and the empty string are false and called
    falsy; all other values are true and called truth.

    - When a string is expected, undefined acts as "undefined", null acts as "null",
    false acts as "false", 3 acts as "3", and so on. To use an object x in a string
    context, JavaScript evaluates x.toString().

    - When a number is expected, undefined acts as NaN, null acts as 0, false as 0,
    and strings act as the number "look like" or NaN. To use an object x in a numeric
    context, JavaScript evaluates x.valueOf().


    Table 1.1 provides concrete examples.


    | Value | as Boolean | as String | as Number |

    |---|---|---||

    | undefined | false | ''undefined'' | NaN |

    | null | false | ''null'' | 0 |

    | false | false | ''false'' | 0 |

    | true | true | ''true'' | 1 |

    | 0 | false | ''0'' | 0 |

    | 858 | true | ''858'' | 858 |

    | NaN | false | ''NaN'' | NaN |

    | ''0'' | true | ''0'' | 0 |

    | ''858'' | true | ''858'' | 858 |

    | '''' | false | '''' | 0 |

    | ''dog'' | true | ''dog'' | NaN |

    | Symbol(dog) | true | ''Symbol(dog)'' | throws TypeError |

    | any object | true | result of x.toString() | result of x.valueOf() |


    Table 1.1 JavaScript Automatic Conversions


    Implicit type conversion, also known as coercion tends to the rule in JavaScript.
    TypeErrors are rare when using a string as a number, null or undefined as an object,
    or trying to call a non-function.


    JavaScript gives us a few options for specifying function values, including the
    arrow (=>), and the function declaration. Functions can be called via the name
    bound to the function in the variable to which was assigned, or even anonymously.
    Functions that accept functions as parameters or return functions are higher-order
    functions. Higher-order functions facilitate a style of coding—functional programming—in
    which function composition replaces assignment statements and explicit loops.
