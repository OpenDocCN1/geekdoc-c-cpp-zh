  md: "# Programming Language Explorations\n\nThere are a few similarities with the\
    \ Lua code (the use of special methods for one), but a few differences. Perhaps\
    \ the most significant is that Python does not require explicit metatypes or prototypes.\
    \ An object's attribute comes from its class and all of the class's ancestors.\
    \ We say Python features classical inheritance, JavaScript, CoffeeScript, and\
    \ Lua feature prototypal inheritance. We encourage you to compare and contrast\
    \ the Python and Lua solutions in detail over as many dimensions as you discover.\n\
    \n# 4.6 ITERATORS AND GENERATORS\n\nAn iterable is an object that produces a sequence\
    \ of values. Tuples, lists, sets, dictionaries, and objects of a few other built-in\
    \ types are iterables. They can be used in for statements and of built-in functions,\
    \ including min, max, sum, any, filter, sorted, and zip.\n\n```\nfor x in (1,2,3):\
    \ print(x)      # elements of a tuple\nfor x in [1,2,3]: print(x)      # elements\
    \ of a list\nfor x in {1,2,3}: print(x)      # elements of a set\nfor c in 'hello':\
    \ print(c)      # characters of a string\n```\n\n```\nfor k in {'x':1, 'y':2,\
    \ 'z':3}:\n    print(k)                      # keys of a dict\n```\n\n```\nwith\
    \ open('colors') as f:\n    for line in f:\n        print(line.strip())      \
    \     # lines of a file\n```\n\nWhen Python needs to iterate an iterable, it allows\
    \ the built-in function to iterate, producing (via a call to the iterable's `__iter__`\
    \ method—remember Table 4.1?) an iterator. The iterator's `__next__` method yields\
    \ the next element of the sequence or raises a StopIteration exception when no\
    \ more elements remain. This means you can write your own iterables:\n\n```\n\
    class OneTwoThree:\n    def __iter__(self):\n        value = 0\n        class\
    \ OneTwoThreeIterator:\n            def __next__(self):\n                nonlocal\
    \ value\n                value += 1\n                if value > 3:\n         \
    \           raise StopIteration()\n                return value\n        return\
    \ OneTwoThreeIterator()\n```\n\n```\nx = OneTwoThree()\nfor i in x:\n    print(i)\
    \                      # prints 1 then 2 then 3\n```"
