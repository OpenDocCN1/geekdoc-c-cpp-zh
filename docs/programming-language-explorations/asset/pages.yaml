    Closely related to the notion of type is of class, which, is a kind of category
    for instantiating objects that have a particular internal structure. Some languages
    have no classes, some confuse the notion of type and state, and take some care
    to distinguish classes from types.


    A statement code performs an action. Common types of statements include (1) declaration
    statements to bring variables into existence, (2) expression statements to evaluate,
    (3) assignment statements, (4) invocation statements to run subroutines or start
    coroutines, (5) conditional statements (if, unless, switch) to execute code under
    certain conditions, including the resumption of one coroutines on the state of
    various guarded expressions, (6) iteration statements (while, for, repeat) to
    execute code repeatedly, and (7) disruptive statements (break, continue, retry,
    throw, return, yield, resume) for changing the "normal" control flow.


    Many languages provide a means for throwing or raising an exception when something
    has gone wrong, and a match to, handle exceptions. Languages without an exception
    facility will often have a means to allow certain operations to return two values,
    indicating success or failure, and for the expected value on success. You may
    encounter option values, where the value is tagged with an indication of it being
    a proper value or an error (or missing) value.


    Modern languages support the notion of programming-in-large via modules or packages,
    which encapsulate related entities of a library or application. The programmer
    may export some of the entities to the rest of the program, leaving the others
    to the module. Languages may import (sometimes called load or require) entities
    from other modules. Often, not always, modules correspond to files.


    There are, course, many language elements that we need to learn. It is especially
    crucial to study concepts and language models that are not "maine". In [123],
    Bret Viktor shows how work in the 1960s and 1970s created programming models that
    manipulate data rather than code, or those that use goals instead of procedures,
    and are represented spatially rather than in text strings. It would be a tragedy,
    if people were to miss these and other ideas, or to master one way of programming
    and forget that they could ever have new ideas about programming models.


