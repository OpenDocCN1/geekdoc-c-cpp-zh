  md: '# CHAPTER 9


    # Elm


    Elm is a functional language ideal for interactive applications.


    | First appeared 2011 |

    | **Creator** Evan Czapliki |

    | **Notable versions** 0.10 (2013) • 0.14 (2014) • 0.17 (2016) |

    | **Recognized** for Interactive functional programming |

    | **Notable uses** User interfaces, Games |

    | **Tags** Functional, Statically-typed, Subscription-oriented |

    | **Six words or less** Functional programming for the web


    Evan Czapliki created Elm in 2011 as a language for building browser-based applications
    in the style of functional reactive programming, or FRP. If CoffeeScript looks
    like Python or Ruby—with dynamic transpile and assigning variables—Elm is part
    of the statically-typed “ML family” of languages, and borrows a little from Haskell.
    Elm will be the only ML we will feature in this book, so take the time to enjoy
    its many features it.


    In this chapter we''ll visit many of the ideas originating in the design and development
    of the ML languages, including type variables and extensive type inference. We''ll
    also encounter pattern matching and destructuring. We will see a bit of Haskell-inspired
    syntax. Haskell programmers may find Elm quite familiar.


    But Elm is not an ML or Haskell-off. It adds many of its own features and fuses
    old and new ideas. While Elm has moved from its FRP roots, it now aims to supersede
    JavaScript for HTML applications on the client side by replacing JavaScript’s
    callback-heavy architecture with a subscription-based approach to interactivity.
    Elm differs from JavaScript by living very far to the “pure” side of the functional
    language spectrum. Data structures are persistent, like of Clojure. You bind variables
    rather than assigning to them.


    We''ll begin our exploration of Elm with our three standard introductory programs,
    running in the browser, where Elm doesn''t usually script standard input and standard
    output. We''ll then look at base language elements including modules, functions,
    and types. We''ll cover Elm’s approach to type inference (borrowed, of course,
    from its ancestors in the ML family).'
