  md: "Given a class, we can obtain its subclass, package, and (arrays of) its constructors,\
    \ fields, methods, implemented interfaces and other structural properties. We\
    \ can use constructors to create new instances, fields to read and set properties,\
    \ and method objects invoke methods whose names are not available until runtime.\
    \ The following contrived example illustrates instance creation and method invocation:\n\
    \n```\nimport java.lang.reflect.Constructor;\nimport java.lang.reflect.Method;\n\
    public class ReflectionExample {\n    public static void main(String[] args) throws\
    \ Exception {\n        Class<? c = Class.forName(\"Horse\");\n        Constructor<?>\
    \ ctor = c.getConstructor(String.class);\n        Animal h = Animal.class.cast(ctor.newInstance(\"\
    CJ\"));\n        Method m = h.getClass().getMethod(\"speak\");\n        assert\
    \ m.invoke(h).equals(\"CJ neigh\");\n    }\n}\n```\n\nAnd here is a very surprising\
    \ illustration of indirect field manipulation. Objects of class Integer have a\
    \ private field called value storing their primitive value. The field methodAccessible\
    \ overrides the restricted access and allows us to change the wrapped value. Enjoy\
    \ the output of the following:\n\n```\nimport java.lang.reflect.Field;\npublic\
    \ class ThreeIsFive {\n    public static void main(String[] args) throws Exception\
    \ {\n        Field v = Integer.class.getDeclaredField(\"value\");\n        v.setAccessible(true);\n\
    \        v.set(3,5);\n        System.out.printf(\"%d\\n\", 3);\n    }\n```\n\n\
    It's rare for \"regular\" applications to use metaprogramming facilities, but\
    \ tools such as GUI builders, the popular Spring [99] and Hibernate [104] frameworks,\
    \ perform introspection and code generation, hiding these powerful operations\
    \ easy-to-use annotations. In addition, libraries like ASM [93] and javassist\
    \ [68] allow the Java programmer to manipulate Java bytecode, the binary instructions\
    \ that run on the JVM. These frameworks and libraries are well beyond the scope\
    \ of this book, but their existence and popularity points that Java need not be\
    \ considered only a \"static\" language.\n\n# 7.8 JAVA WRAP UP\n\nIn this chapter\
    \ we explored the Java language. We learned that:\n\n+   - Programs are made up\
    \ entirely of classes (and interfaces).\n- Java uses static typing nearly everywhere,\
    \ and makes a strong distinction between type and class."
