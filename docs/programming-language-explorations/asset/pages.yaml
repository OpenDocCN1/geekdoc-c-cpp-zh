  md: "# JavaScript 19\n\nsecond? If a system binds the free variables of a passed\
    \ function after passing, we speak of shallow binding; if bound where the function\
    \ is defined, we have deep binding.\n\nWhat does JavaScript Do? When a nested\
    \ function with free variables is sent outside its environment, even by being\
    \ passed or returned from another function, the function carries the bindings\
    \ of those variables from the enclosing environment of its definition with it.\
    \ These bindings \"close over\" the inner function, so the function, together\
    \ with its bindings, is called a lexical closure, or closure for closure.\n\n\
    Closures can be used to make generators. A generator produces a \"next\" value\
    \ each time it is called. A generator for a sequence of squares would produce\
    \ 0 on its first call, 1 on its second, then 4, 9, 16, and so on. A function that\
    \ returns its square is insecure because other parts of the code could change\
    \ the global variable, disrupting future calls to the generator! Fortunately,\
    \ we can use the fact that a function's local variables are completely hidden\
    \ from the outside:\n\n```\nconst nextSquare = () => {\n  let previous = -1;\n\
    \  return () => {\n    previous++;\n    return previous * previous;\n  };\n});\n\
    \nconst assert = require('assert');\nassert(nextSquare() === 0);\nassert(nextSquare()\
    \ === 1);\nassert(nextSquare() === 4);\n```\n\nThe value assigned to nextSquare\
    \ is the result of calling an anonymous function; we call the right-hand side\
    \ of the assignment an immediately invoked function expression, or IIFE. The generator\
    \ returns a closure. The variable that holds the number to be squared is local\
    \ to the enclosing function. The generator (nextSquare) can see this value, but\
    \ no other parts of the code can. The generator is secure.\n\n# 1.4 METHODS\n\n\
    An object can have properties whose values are functions:\n\n```\nconst circle\
