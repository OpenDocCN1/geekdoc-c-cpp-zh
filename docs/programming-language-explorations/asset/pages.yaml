  md: "A Java application finishes when all non-daemon threads have finished; daemon\
    \ threads, therefore, are those threads intended to run indefinitely, performing\
    \ services as needed. Cooks are naturally daemon threads, grabbing orders, cooking,\
    \ and serving customers. As we'll see in a minute, fetching an order and serving\
    \ the customer are synchronous operations; cooks block until an order can be fetched,\
    \ and also block until the customer accepts the payoff of the cooked order.\n\n\
    ```\nclass Cook extends Restaurant.Agent {\n    Cook(String name) {\n        super(name);\n\
    \        this.setDaemon(true);\n    }\n\n    @Override public void run() {\n \
    \       try {\n            while (true) {\n                Order order = Order.begin();\n\
    \                act(\"cooking \" + order, 12000);\n                order.serve();\n\
    \            }\n        } catch (InterruptedException e) {\n            log(\"\
    got fired from the restaurant\");\n        }\n    }\n}\n```\n\nAll blocking operations\
    \ in Java may throw an InterruptedException; this exception must be (1) handled\
    \ in any method that may throw it, or (2) declared to be throwable. In our simulation,\
    \ interrupting a customer terminates (pun intended) the employee (thread).\n\n\
    Customers eat ten meals then go home. The attempt to place an order is time out.\
    \ If the order is placed within 7 seconds, the customer will wait for it to be\
    \ cooked, accept the meal from the chef, then eat. If the order cannot be added\
    \ to the order queue quickly enough, the customer goes shopping and returns later.\
    \ Interrupting a customer causes banishment from the restaurant.\n\n```\nimport\
    \ java.util.concurrent.BlockingQueue;\nimport java.util.concurrent.SynchronousQueue;\n\
    \npublic class Customer extends Restaurant.Agent {\n    private BlockingQueue<Order>\
    \ meal = new SynchronousQueue<>();\n\n    Customer(String name) {\n        super(name);\n\
    \    }\n\n    void serve(Order order) throws InterruptedException {\n        meal.put(order);\n\
    \    }\n}\n```"
