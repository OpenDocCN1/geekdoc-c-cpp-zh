  md: "```\npublic class TwiceApp {\n    private static double twice(Function f, double\
    \ x) {\n        return f.apply(f.apply(x));\n    }\n\n    public static void main(String[]\
    \ args) {\n        assert twice(x->x*2, 10) == 14;\n        assert twice(Math::floor,\
    \ -11.77) == -12;\n    }\n}\n```\n\nWe marked our Function with the @FunctionalInterface\
    \ annotation; though optional, it is good practice. The abstract method within\
    \ the interface defines a function with a single parameter and a double result.\
    \ The expression x->x*2 conforms to this type specification, and makes an acceptable\
    \ first argument to our twice method. The same holds for Math::floor, a function\
    \ object whose evaluation returns the value of the static floor method from the\
    \ class.\n\n# 7.4 STATIC TYPING\n\nJava differs from the languages in the previous\
    \ chapters in catching nearly all type errors prior to execution, statically.\
    \ Multiplying an Animal by a boolean? Java never lets your program run. In contrast,\
    \ Python raises a TypeError at runtime, and JavaScript converts the operands numbers.\
    \ Java's compile-time type checking even for expressions involving variables;\
    \ for example, within the scope of the declaration int x = 3; we can infer the\
    \ expression x + 5 to have type double. In the example from Page 125, the declaration\
    \ Animal s = new Horse(\"CI\") implies the expression s.speak() has type String\
    \ and the expression s itself has type Animal. Java requires type constraints\
    \ on the variables themselves, restricting them to contain only values of a compatible\
    \ type.\n\nWe use the term static typing for pre-execution type checking and dynamic\
    \ typing for runtime type checking. Granted, more formal definitions exist and\
    \ can be found in the literature on types and programming languages, of which\
    \ Pierce [97] is a classic reference. Static fits nicely with Pierce's definition\
    \ of a type system as a \"syntactic method for automatically checking the absence\
    \ of certain erroneous behaviors by classifying program phases through the kinds\
    \ of values used. Tells us what we can or cannot even say. In Java, for example,\
    \ associating the variable a with the type Animal limits us to using the Animal\
    \ operations, even if it holds an object of class Cow with optional operations.\
    \ Robert Harper goes far as to say \"dynamic typing is but a special case of static\
    \ typing\" [48]. Why? Compare these equivalent Java and Ruby:\n\n```\n// Java\n\
    # Ruby\nObject x;\nif (Math.random() < 0.5) {\n    x = \"string\"\nelse\n    x\
    \ = 5\nend\nputs x.class\nSystem.out.println(x.getClass());\n```"
