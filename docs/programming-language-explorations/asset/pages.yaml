  md: "# Programming Language Explorations\n\nto newcomers were completely changed\
    \ without regards to backward compatibility. This made the cost of upgrading existing\
    \ Python 2 code to Python 3 quite significant for some organizations, and at the\
    \ time of this writing, versions of Python are widely used! This chapter, however,\
    \ is all about Python 3. Python 3 is the preferred way to learn Python: if you\
    \ later need drop down to Python 2, you can learn the differences if needed. [19]\n\
    \nOur survey of Python will begin in the usual fashion, with our common three\
    \ introductory scripts. We will continue with a look at Python's system type,\
    \ which differs a great deal from JavaScript's and Lua's (in particular, everything\
    \ is an object, event types!) Python is the first language on our tour with a\
    \ rich system, with types organized into an ontology that supports something called\
    \ multiple inheritance. We'll see how Python's handling of scope also differs\
    \ from previous languages we've seen. We will then take a look at many of the\
    \ languages modern-ish features, including named parameter associations, default\
    \ and keyword arguments, Lua's comprehensions, its mechanism for custom operator\
    \ definition (reminiscent of Lua's metethods), and its support for generators.\
    \ We'll close with a look at Python's decorators.\n\n# 4.1 HELLO PYTHON\n\nLet's\
    \ get started in the usual way:\n\n```\nfor c in range(1, 41):\nfor b in range(1,\
    \ c):\n    if a * b == c * c:\n        print('{}, {}, = {}'.format(a,b,c))\n```\n\
    \nPython, like CoffeeScript, uses indentation to define structure. The range constructor\
    \ builds a range object, inclusive at the bottom and exclusive at the top. Ranges\
    \ produce their values on demand, so there is no need to worry that large lists\
    \ are being created before iteration. String formatting uses curly braces within\
    \ the format string; our empty braces indicate that we want the default formatting\
    \ for our values. Had we wanted to display our values in three aligned columns,\
    \ we could have written: {3d}:{3d}:{3d}.\n\nNow let's write an anagram script\
    \ directly implementing Heap's algorithm. (We'll see how to use a permutation\
    \ generator from the standard library in the chapter.)\n\n```\nimport sys\n\n\
    def generatePermutations(a, n):\n    if n == 0:\n        print(''.join(a))\n \
    \   else:\n        for i in range(n):\n            generatePermutations(a, n-1)\n\
    \            j = i if n % 2 == 0 else i\n            a[j], a[n] = a[n], a[j]\n\
    \            generatePermutations(a, n-1)\n```"
