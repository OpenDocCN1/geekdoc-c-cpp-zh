  md: "filtering the empty words produced by split, we collect and count each word,\
    \ and print a report, automatically sorted thanks to Java's TreeMap.\n\n# 7.2\
    \ THE BASICS\n\nLike JavaScript and Lua, Java's types are subdivided into primitive\
    \ types and reference types. Primitive types include byte, short, int, and long\
    \ types, two's complement integers of 8, 16, 32, and 64 bits; float and double\
    \ types, which contain single- and double-precision IEEE 754 floating-point numbers\
    \ respectively; a char type, the values of which represent UTF-16 code units;\
    \ and a boolean type. Classes and interfaces, with arrays, Java's reference types.\
    \ The value of a reference is either null or a reference to a class or instance.\
    \ Instances are not allowed any. The == operator on references always compares\
    \ whether the references are the same; to compare the values, you must use the\
    \ equals operator, if one is defined:\n\n```\nimport java.time.LocalDate;\npublic\
    \ class EqualsDemo {\n    public static void main(String[] args) {\n        LocalDate\
    \ d1 = LocalDate.of(2020, 2, 29);\n        LocalDate d2 = LocalDate.of(2020, 2,\
    \ 29);\n        assert !(d1 != d2) && d1.equals(d2);\n    }\n}\n```\n\nThe value\
    \ null belongs to no out type\n\nJava has no built-in syntactic support for lists,\
    \ sets, and maps; you will find them via interfaces and classes in standard libraries.\
    \ Interestingly, collections can only hold instances of reference types, so Java\
    \ provides classes for each of the primitive types that wrap the primitive in\
    \ an object. If desired, Java will automatically convert a primitive to (autoboxing)\
    \ an instance of its corresponding wrapper type.\n\nThough Java is mostly strongly-typed,\
    \ it will implicitly perform any type conversion that is considered to be a widening\
    \ conversion. With primitive types, a widening conversion occurs when the target\
    \ type is represented with more bits and a wider range of values (e.g. from 32-bit\
    \ float to 64-bit double). Reference types, a widening conversion occurs when\
    \ the type being converted is a superclass of the original type (e.g. from String\
    \ to Object, the ultimate ancestor of all classes). A narrowing conversion is\
    \ the opposite of a widening conversion, and is never performed implicitly due\
    \ to the chance of precision loss.\n\n> ³Note that a code unit is not the same\
    \ as a code point; in each encoding, code points are mapped to one or more code\
    \ units."
