  md: '# CHAPTER 3


    # Lua


    ![](img/2cd8452ff5a372a7459559ad1d0834e4_63_0.png)


    Lua is a “powerful, fast, lightweight, embeddable scripting language.” [77]


    | First appeared 1993 |

    | Creators Iberto Ieralumsischy, Waldemar Celes, Luiz Henrique de Figueiredo |

    | Notable versions 5.0 (2003) • 5.1 (2006) • 5.2 (2011) • 5.3 (2015) |

    | Recognized for Tables, Interoperability with C |

    | Notable uses World of Warcraft, Angry Birds, Scripting Tags Imperative |

    | Six words or less Lightweight, fast, powerful scripting |


    Lua was born in 1993 at PUC-Rio, Pontifícia Universidade Católica do Rio de Janeiro.
    It has been evolving steadily, but is still quite small (in terms of the number
    of concepts and basic features) with lightweight and fast implementations. Its
    designers created a classic scripting language: typically an application''s logic
    is written in Lua, with portions as time-critical or device-specific code, written
    in the host language.


    The language features a small number of types and operators, a means for defining
    functions, and only one data structure—the table—that double duty representing
    traditional arrays as key-value objects. Lua size should not be confused with
    a lack of power; on the contrary, Lua is extensible. Lua tables can have metatables,
    providing the ability to customize lookup and operators. Lua’s functions are first-class
    objects, providing all the power of functional programming. It can operate with
    other languages, including C, C++, Java, Fortran, Smalltalk, and Erlang.


    In this chapter, we will introduce Lua. Because the language is small, we will
    give pretty good coverage of its basic elements, including a full list of its
    operators and types. We will cover functions and scope in detail. We will then
    see how Lua is to work with only a single data structure, the table. We will explain
    metatables, and how they provide a mechanism for user-defined types nearly identical
    to JavaScript’s prototypes. We will see how Lua allows its operators to take on
    new meanings under programmer control. We will close with Lua’s implementation
    of a popular mechanism for concurrency; coroutines.'
