    # Chapel


    Chapel, developed at Cray Inc. and originating as part of DARPA’s High Productivity
    Computing Systems (HPCS) program, aims to improve the programmability of parallel
    computers. It is strongly influenced by classical languages such as (High-Performance)
    Fortran, C, and C++ with associated libraries, but has the look and feel of modern,
    expressive languages such as Python. An important design goal has to make the
    language expressive without the need to drop into a library. Architecturally,
    writes Brad Chamberlain, Chapel’s principal engineer, “Chapel supports distinct
