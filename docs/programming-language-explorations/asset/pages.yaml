    ARV[0].chars.permutation.each{|s| puts s.join}

    ```


    One line does the all:


    +   1. ARV[0] is the first command line argument, a string.

    2. .chars produces an array containing each character of this string.

    3. .permutation produces an enumerator for all the permutations of this array.
    An enumerator is not an actual array; think of it as an object that is ready to
    produce the next value when it is asked.

    4. The method each causes permutation to be generated one-by-one. As each permutation
    is generated, it is passed to the block where the permuted array is joined up
    into a string and written on a line to standard output.


