  md: "# Erlang 203\n\nNow let's look at the order pool. The pool can accept an order\
    \ from a customer at any time, and \"adds\" the order to the pool. Erlang is a\
    \ functional language, so \"adding\" means recursing with a new pool just like\
    \ the original with the new order appended. The pool will also accept requests\
    \ from cooks to take orders, but only when orders exist, so we use a guard. If\
    \ an order is ready, the pool messages the cook with the food to prepare, \"dequeuing\"\
    \ the oldest order.\n\n```\n-module(order_pool).\n-export([Orders]).\n\nrun(Orders)\
    \ ->\n  receive\n    {place, Order} ->\n      lists:append(Orders, [Order]);\n\
    \    {ready, Cook} when length(Orders) > 0 ->\n      {prepare, had(Orders)},\n\
    \      run(t1(Orders))\n  end.\n```\n\nCooks repeatedly message the order pool\
    \ when ready to cook then wait to be messaged with the order. The cook passes\
    \ its pid via the built-in function self. The cook receives the order as a tuple\
    \ containing the food and the pid of the customer who placed the order. After\
