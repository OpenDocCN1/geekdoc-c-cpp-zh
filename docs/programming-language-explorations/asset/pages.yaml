  md: "```\n@Override public void run() {\n  try {\n    for (int mealsEaten = 0; mealsEaten\
    \ < 10;) {\n      if (Order.place(this, \"pancakes\", 7000)) {\n        Order\
    \ order = meal.take();\n        act(\"eating \" + order, 10000);\n        mealsEaten++;\n\
    \      } else {\n        act(\"can't place order, may return later\", 5000);\n\
    \      }\n    }\n    log(\"going home\");\n  } catch (InterruptedException e)\
    \ {\n    log(\"banished from restaurant\");\n  }\n}\n```\n\nThe handoff of the\
    \ cooked queue between the kitchen and the customer employs a synchronous queue.\
    \ A synchronous queue has no capacity: \"head\" is the object being inserted,\
    \ items are \"removed\" only when an attempt is in progress. The methods put and\
    \ take block indefinitely, a less-than-ideal situation where one party to disappear\
    \ while the other was waiting.\n\nFinally we come to the order class. We maintain\
    \ a single queue to hold all (un)ed) orders. We've made the constructor private\
    \ so that customers may create orders only via the static method take, which may\
    \ time out. and when finished cooking, take credit for the work by updating the\
    \ order object and delivering it to the customer. We've chosen the size of this\
    \ queue to be small, relative to the number of customers, so in running the simulation,\
    \ you'll likely to see customers getting frustrated (threads will time out) and\
    \ leaving the restaurant temporarily.\n\n```\nimport java.util.concurrent.BlockingQueue;\n\
    import java.util.concurrent.ArrayBlockingQueue;\nimport java.util.concurrent.TimeUnit;\n\
    ```\n\n```\npublic class Order {\n  private static BlockingQueue<Order> orders\
    \ =\n    new ArrayBlockingQueue<Order>(5);\n\n  private String content;\n  private\
    \ Customer customer;\n  private Cook cook;\n\n  private Order(Customer customer,\
    \ String content) {\n    this.customer = customer;\n    this.content = content;\n\
    \  }\n}\n```"
