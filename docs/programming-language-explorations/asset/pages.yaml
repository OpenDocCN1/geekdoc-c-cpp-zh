    A system with dependent types computations to be performed within the type checker,
    at compile-time. The programmer can set guarantees that a program, when executed,
    will meet all specifications. In fact, Idris borrows a number of features from
    interactive proof assistants such as Coq and Agda. While Idris can be used for
    proving, its development has focused on general purpose computation, and it is
    actively being developed as such today.


    Syntactically, Idris looks a great deal like Haskell, with some superficial differences
    beyond those forms required to express dependent typing. On the semantic side,
    Idris is, like Haskell, a functional language. However, Idris has additional machinery
    for managing effects, algebraic effects in addition to monads. Idris''s creator,
    Edwin Brady, describes the theory and implementation of algebraic effects, and
    the means by which they solve various shortcomings of Haskell''s monadic approach,
    in [13].


    # 13. CONCURRENCY MATTERS


    Modern languages feature concurrency support, but experienced developers working
    on mission-critical applications require a deep understanding of the fundamental
    principles of concurrent and distributed systems. This knowledge comes not only
    from day-to-day practice but also from early work such as Hoare''s CSP and Milner''s
    CCS, and the experimental and research languages occur (named channels, as adopted
    by Go), SR, and Linda (sounding a unique means of process coordination through
    a “tuple”).


    Naturally, research in concurrent and distributed systems remains extremely active.
    We''ve spent time in previous chapters on a few principles of concurrency (especially
    in our tours of Clojure, Erlang, and Go), and should note that a few languages
    in this chapter (Rust, Ada, Scala, and C# for instance) feature many capabilities
    for concurrent and distributed computing. Still, a few languages created in recent
    years are worth a brief mention.'
