    Clojure in that it expresses objects, but Closure''s generated code looks exactly
    like the code you wrote yourself. Clojure is a homoic language.


    As in Julia, a macro accepts unvaluated expressions, performs some computations,
    and evaluates the result of these computations. Three classic examples can come
    to mind here. The first "evaluates" is an expression written in infix form:


    ```

    ```(defmacro eval-infix [form]

    (list (second form) (first form) (second rest form)))```

    ```


    ```

    ```(use ''clojure.test)

    (is (= (eval-infix (20 * 7)) 140))

    (is (= (macroexpand ''(eval-infix (20 * 7))) (* 20 7))))```

    ```


    Because macro invocations do not evaluate arguments before the call, invoking
    (eval-infix (20 * 7)) passes a 3-element list to the macro. The macro returns
    a three-element list, specifically (* 20), which is immediately evaluated to produce
    140. The macroexpand function will show you the forms produced by the macro without
    evaluation.


    The second popular example, highlights the power of macros to "extend the syntax"
    of the language. We define a new form, called unless:


    ```

    ```(defmacro unless [condition this that]

    (list ''if (not condition) this that))```

    ```


    ```

    ```(use ''clojure.test)

    (is (= (unless (< 1 2) 7) 7))

    (is (= (unless (< 2 1) 10) 10))

    (is (= (macroexpand ''(unless (< 1 2) 10)) (if (not (< 1 2)) 10 7))))```

    ```


    We can write this macro again, using the syntax (:):


    ```

    ```(defmacro unless [condition this that]

    (if (not condition) -this that))```

    ```


    The syntax unless is similar to the regular quote except that (1) symbols inside
    syntax quotes are fully-qualified, e.g. (unless 1 2 3), and (2) we can unquote
    inside quoted forms. Unquoting simple forms tells Clojure to evaluate certain
    forms inside of a quoted form. The use of syntax quoting tends to make more readable
    macros, constructing the resulting forms from patterns rather than from complex
    expressions together lists.


    The third popular example comes from the Clojure core library—the or macro. Cloojure''s
    or evaluates from left-to-right, returning the first value encountered, or where
    no truth operates, returning the last argument or nil if no others. This means
    the expression (or false nil "hello" (/ 1 0)) produces "hello", without evaluating
    the fourth argument.2 Here''s the code:


    > 2Right here we have one of answers to how do we have macros? We can''t easily
    write-circuitor as a function since evaluate their arguments before a call. Granted
    we could explicitly pass in quoted forms and invoke eval, but such a mechanism
    does not integrate nicely with the rest of the language.'
