    }\n```\n\n# 7.7 METAPROGRAMMING\n\nWe'll finish our tour of Java with a brief\
    \ stop at its metaprogramming facilities. We've seen Ruby and Julia metaprogramming\
    \ in the two previous chapters, so the basic ideas by now should be familiar.\
    \ We would like to treat language constructs of our program objects in the program,\
