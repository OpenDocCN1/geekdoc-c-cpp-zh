  md: "+   Concurrent data structures. Java's BlockingQueue and ConcurrentMap implementations\
    \ simplify writing some concurrent applications. For example, use put to block\
    \ until the queue has space before inserting, and offer to attempt an insertion\
    \ either immediately or within a duration (returning true on insertion and false\
    \ if capacity was not available). When removing, take blocks until the queue is\
    \ non-empty, and poll remains to be removed immediately or within a time frame,\
    \ returning when an element was able to be removed.\n\nThe classic examples of\
    \ concurrent programming include Readers and Writers, the Producer-Consumer Bounded\
    \ Buffer, and Dijkstra's Dining Philosophers [59]. We'll break with tradition\
    \ and build a little simulation, with food as in Dijkstra's, but without shared\
    \ utensils.\n\nFifty customers spend their time with three orders. The orders\
    \ are placed in a queue holding five orders at a time. A customer will wait until\
    \ 7 seconds to get an order into the queue, going home for a bit waiting too long.\
    \ The cooks prepare the order then deliver the finished meal to the customer,\
    \ until the customer takes the meal. The simulation runs until each customer has\
    \ eaten 10 meals.\n\nOur simulation provides an abstract base class for all active\
    \ threads with methods to report output: log a message, which logs a message and\
    \ then sleeps for a random number of milliseconds (bounded) to simulate an action\
    \ (such as cooking or eating). The runner's thread—the application's main thread—creates\
    \ 18 new threads to simulate the customers and cooks.\n\n# public class Restaurant\n\
    \n```\npublic class Agent extends Thread {\n    Agent(String name) {\n       \
    \ super(name);\n    }\n    void log(String action) synchronized(System.out) {\n\
    \        System.out.println(getName() + \" \" + action);\n    }\n    void act(String\
    \ action, int time) throws InterruptedException {\n        log(action);\n    \
    \    Thread.sleep((int)(Math.random() * time/2 + time/2));\n    }\n\n    public\
    \ static void main(String[] args) {\n        for (int i = 0; i < 3; i++) {\n \
    \           new Cook(\"Cook-\" + i).start();\n        }\n        for (int i =\
    \ 0; i < 15; i++) {\n            new Customer(\"Customer-\" + i).start();\n  \
    \      }\n    }\n}\n```"
