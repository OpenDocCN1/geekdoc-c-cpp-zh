  md: '# Erlang 207


    +   * Variables must begin with a capital letter, and can be bound to a value
    only once. There is no assignment; variables are bound during matching.


    +   * In addition to expressions using the match operator (*), matching occurs
    in function definitions and case expressions.


    +   * Pattern matches can have guards. The if-expression uses guards alone.


    +   * Concurrent programming in Erlang is built upon lightweight processes that
    share nothing and communicate via message passing. There are no explicit locks.
    Each process has a unique identifier known as its pid. A message can be any Erlang
    term.


    +   * A process sends messages to the mailbox of a receiving process. The receiving
    process consumes messages from its mailbox according to a specified algorithm
    which tries to match messages in the order they were placed in the mailbox. Match
    occurs in the order they appear in the code.


    +   * A process reads messages via a receive expression. If no messages can be
    read, either because the mailbox is empty or no messages match the patterns in
    the receive clause, or if all valid matches are false, the process normally blocks.
    However, the receive may include a timeout in milliseconds, including zero, to
    avoid awaiting indefinitely.


    +   * Processes evaluate the built-in function self to obtain their own pid, which
    they frequently send to the recipient so the recipient can call the process back.


    +   * Communication is asynchronous, but a process can immediately follow a send
    with a receive to simulate a synchronous exchange.


    +   * The Erlang virtual machine, the BEAM, takes care of scheduling.


    +   * Processes can be set up to monitor processes, so that if a process crashes
    (exit with its error), the monitor can clean up and restart it if necessary. Monitoring
    processes keep the regular processes clean and free of extensive error checking
    and recovery, isolating these concerns into the monitors.


    To continue your study of Erlang beyond the introductory material of this chapter,
    you may wish to find and research the following:


    +   * Language features not covered in this chapter. We skipped coverage of most
    of the module attributes, including macros, and very little of the standard library.
    We did not cover bit packing, try expressions, and function specifications, source
    file encodings, and port drivers. We also omitted references, as they have been
    replaced by maps. When dealing concurrency, we only looked at multiprocessing
    on a single machine, leaving you to explore how to create, and communicate with
    other processes.


    +   * Source projects using Erlang. Studying, and contributing to, source projects
    is an excellent way to improve your proficiency in any language. You may enjoy
    the following projects written in Erlang: OTP (https://github.com/erlang/otp),
    RabbitMQ (https://github.com/rabbitmq/rabbitmq-server), Cowboy (https://github.com/ninenebies/cowboy),
    and Disco (https://github.com/discoprocess/disco).


    +   * Reference manuals, tutorials, books and movies. Erlang''s home page is


    > Erlang''s creator Joe Armstrong wrote: "Records are dead—long live maps! [8]'
