    YMM registers are 256-bits wide; ZMM registers are 512-bit wide. Here''s a very
    brief illustration: we''ll add 4-element arrays of floating-point numbers using
    the XMM registers:


    ```

    void add_four_floats(float x[4], float y[4])

    ; x[i] += y[i] for i in range(0..4)

    ```


    ```

    global _add_four_floats

    section .text

    add_four_floats:

    movd xmm0, [rdi]    ; all four values of x

    movd xmm1, [rsi]    ; all four values of y

