  md: "# 174 Programming Language Explorations\n\n| Operator(s) | Prec | Assoc | Description\
    \ |\n|---|---|---|---|\n| << | 9 | R | composition: (f << g)x = f(g(x)) |\n| >>\
    \ | 9 | L | composition: (f >> g)x = g(f(x)) |\n| | | 8 | exponentiation |\n|\
    \ * / // | 7 | | multiply, floor-divide, modulo, remainder |\n| % rem | | | |\n\
    | + | 6 | L | add, subtract |\n| : ++ | 5 | L | cons, append |\n| < <= >= | 4\
    \ | None | less, less or equal, greater, greater or equal, equal |\n| = /= | |\
    \ | not equal |\n| && | 3 | R | (short-circuit) logical and |\n| || | 2 | R |\
    \ (short-circuit) logical or |\n| <| | 0 | R | application: f < x = f(x) |\n|\
    \ |> | 0 | L | application: x > f = f(x) |\n\nBy default, operators you define\
    \ have precedence 9 and left-associative, but you can set these values yourself.\
    \ Here we create two operators that compute `2x + y`, one with high precedence\
    \ (8) and one with low precedence (3). We use this operator in an expression with\
    \ multiplication (precedence level 7) to show there a.\n\n```\nimport ElmTest\
    \ exposing (runSuite, suite, test, assertEqual)\n\n(<-): Int -> Int -> Int\n(<-)\
    \ x y =\n2 * x + y\n\n(*<): Int -> Int -> Int\n(*<) x y =\n2 * x + y\n\ninfix\
    \ 8 <-->\ninix 2 **<\n\nmain =\nrunSuite <| \"Test own operators with `precedence`\"\
    \n  [ test \"high\" < (8 * 3 <-> 5) `assertEqual` 88 -- 8*(2*3+5)\n  , test \"\
    low\" < (8 * 3 << 5) `assertEqual` 53 -- 2*(8+2)+5\n  ]\n```\n\nWe've chosen to\
    \ make our new operators non-associative: to set left or right associativity we\
    \ would use `infix` or `infixr`, respectively.\n\nNote that the standard operators\
    \ (addition, multiplication, less-than, etc.) are not wired to the language but\
    \ are simply defined as plain Elm functions in the standard library. Indeed, examining\
    \ the source code for the Elm compiler we see:\n\n```\n() : Float -> Float ->\
    \ Float\n() =\nNative.Basics.floatDiv\n```\n\ninfix 7 /"
