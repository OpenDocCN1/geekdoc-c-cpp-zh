    Our animal system has three classes and one class-specific method. But we can
    imagine our project with both new kinds of animals—dogs, perhaps—or new kinds
    of functionality, such as producing an emoji character. See Figure 8.5. The **expression
    problem** refers to the situation in some languages extending a system in one
    direction is easy but extending in the other requires touching code. Languages
    with classes clearly have no trouble extending system with new classes; Cloure
    is no exception:


    ```

    ; Add a new class

    (defrecord Dog [name] Sounder

    (sound [this] "woof"))

    ```


    Adding new functionality to existing classes (without modifying the source code
    for existing classes) requires that the language has a mechanism for **type extension**.
    The *extend-type* macro solves the expression in Cloure:


    ```

    ; Add new functionality

    (defprotocol EmojiDescirable [emoji [this]])

    (extend-type Horse EmojiDescirable [emoji] [this] "\u83D\uDC0E")

    (extend-type Sheep EmojiDescirable [emoji] [this] "\u83D\uDC11")

    (extend-type Dog EmojiDescirable [emoji] [this] "\u83D\uDC15")

    ```


