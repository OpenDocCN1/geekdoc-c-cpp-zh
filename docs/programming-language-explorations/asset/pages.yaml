    Hello again! If you''ve made it this far, you''ve been introduced to programming
    language practice through chapter-length overviews and brief glances at dozen
    more. The intent was not to provide a comprehensive tutorial for any of the languages,
    but rather to use the overviews as a vehicle to introduce important concepts of
    programming language design and practice. Our treatment was non-mathematical and
    introductory; for in-depth study and coverage of the theoretical foundations that
    will enable you to design the languages of the future, we recommend the works
    by Turbak [119], Pierce [97], and Harper [49].


    Let''s take a look at where we''ve been and where you can go.


    # 14.1 WHERE WE''VE BEEN BEEN


    The primary takeaway from this book is: The study of multiple languages frees
    us from getting stuck on particular approaches to solving particular problems,
    making us question how things be different, and...better.


