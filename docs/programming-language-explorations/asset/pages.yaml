  md: "Java has a bit in common with the class-based languages we've seen before,\
    \ Python and Ruby, but there are some very strong differences, too. Here are a\
    \ few:\n\n+   - Unlike Python and Ruby, where all references are to objects, Java\
    \ has both reference values and primitive values.\n\n+   - Like C++, and unlike\
    \ Python, a class in Java can have at most one superclass. Java's ultimate superclass,\
    \ which all classes (including arrays) either directly or indirectly inherit from,\
    \ is the class `Object`.\n\n+   - Unlike Python and Ruby, Java allows both methods\
    \ and non-method properties (called *fields*) in Java to be members of a class.\n\
    \n+   - Unlike Python, Java has explicit constructors that are not members of\
    \ the class (and therefore not inherited); Unlike Ruby which hides all of its\
    \ instance variables, Java allows for selective visibility controls. Java's `public`,\
    \ `private`, and `protected` keywords have completely different meanings from\
    \ Ruby's.\n\nEach compilation defines one or more classes or interfaces, as part\
    \ of a `package`. If no package is defined, the classes will land in a `default`\
    \ package.⁴ Classes can contain fields, methods, constructors, static and initializers,\
    \ and other classes. Classes and their contents (other than initializers) are\
    \ `modifiers`. Table 7.1 gives the complete list: the following class maps manages\
    \ to use a few:⁵\n\n```\nclass Circle {\n    private double x;\n    private double\
    \ y;\n    private double r;\n\n    public Circle(double x, double y, double r)\
    \ {\n        this.x = x;\n        this.y = y;\n        this.r = r;\n    }\n\n\
    \    public static Circle create(double x, double y, double r) {\n        return\
    \ new Circle(x, y, r);\n    }\n\n    public double area() {\n        return Math.PI\
    \ * this.r * this.r;\n    }\n\n    public static double area(double r) {\n   \
    \     return Math.PI * r * r;\n    }\n}\n```\n\n⁴Java best practices dictate that\
    \ all code should go in a named package, but examples in this chapter will use\
    \ the default package for brevity.\n\n⁵You will explore initializers and nested\
    \ classes in the end-of-chapter exercises."
