    # Befunge


    While an average programmer can write a Brainf**k compiler without much trouble,
    a compiler for Befunge is, by design, notoriously difficult. In this two-dimensional
    language, self-modifying code happens.


    First appeared 1993

    Designer Chris Pressey

    Notable versions 93 • 98

    Recognized for Being multi-dimensional

    Notable uses Challenge to would be-compiler writers

