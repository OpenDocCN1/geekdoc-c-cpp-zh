    Like Elm in the previous chapters, Erlang emphasizes functional programming over
    object-oriented programming. Lists, tuples, and maps are immutable. Variables
    represent values not by having values assigned to them, but by being bound, and
    only there are no loops; instead, programmers use recursion frequently:


    ```

    factorial(N) -> factorial(N, 1);

    factorial(0, Acc) -> Acc;

    factorial(N, Acc) -> factorial(N-1, Acc*);

    ```


    Erlang is a pure functional language;² it can generate side effects through among
    other things, throwing exceptions. Exceptions cause a process to crash (with an
    error code), which we can catch them if our expression is part of a catch-expression:


    ```

    % First line is ignored when running with script

    main() ->

    10 = (catch 7 + 3);

    {''EXIT'', badarith, _} = (catch 10 * dog);

    {''EXIT'', badarg, _} = (catch dog! 100);

    {''EXIT'', if_clause, _} = (catch false -> ok end);

    {''EXIT'', customerror, _} = (catch error(customerror));

    {''EXIT'', 205} = (catch exit(205));

    205 = (catch throw(205)).

    ```


    If no error occurs, the catch e produces the value of e. Otherwise it produces
    some error-indicating reason for many reasons, including badly operated operands,
    calling a function with the wrong number of arguments, match fails, timeouts,
    and calling the functions error or throw.


