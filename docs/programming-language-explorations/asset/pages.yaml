  md: "But wait! None of the examples in the opening section of this chapter used\
    \ tuples, though they appeared to take \"multiple arguments.\" They looked quite\
    \ different, like the example on the right below:\n\n```\nplus: (Int, Int) ->\
    \ Int\nplus (x, y) =\nx + y\n```\n\n```\nplus: Int -> Int -> Int\nplus x y =\n\
    x + y\n```\n\nThe example on the left returns the sum of its two tuple components,\
    \ but what of the example on the right? What is the type Int -> Int -> Int? The\
    \ function type operator is right-associative, so actually have Int -> (Int ->\
    \ Int). The function accepts an integer and returns a function from integers to\
    \ integers. And it appears to take two parameters, the definition on the right\
    \ simply sugars the \"one parameter\" definition that returns a function:\n\n\
    +   - Desugared definition\nplus: Int -> Int -> Int\nplus x y =\nx + y\n\nThe\
    \ act of rewriting a function of type (a,b)->c into an equivalent of a type a->(b->c)\
    \ is called **currying**; the reverse process is called **uncurrying**. Curried\
    \ functions allow something called **partial application**. For example, although\
    \ we might normally write\n\nplus 3 4\ncan we just easily write\nplus 3\n\nto\
    \ obtain the function that adds three to its argument. We are free to apply this\
    \ function at some later time to essentially one of two integers.\n\nElm provides\
    \ two forms of signing \"arguments\" for curried functions. A function of type\
    \ (b->c) can be written between its two arguments enclosed in brackets. We saw\
    \ this in our previous example with the function `assertEqual`. The expression\
    \ x `assertEqual` y sugars a function defined to appear in the infix position\
    \ can be used as prefix by enclosing in parentheses, for example (+) 5 8 evaluates\
    \ to 13. This feature was not written to make Clojure programmers happy; rather\
    \ it gives us a way to use the function in its own style. Right the functions\
    \ in this example:\n\n```\nimport ElmTest exposing (runSuite, suite, test, assertEquals)\n\
    main = let (input, expected) = ([10, 20, 30], [15, 25, 35]) in\n  runSuite <|\
    \ \"Use + in prefix position\"\n  [ test \"Arrow\" (List.map (x->x+5) input `assertEqual`\
    \ expected)\n  , test \"Prefix\" (List.map (+5) input `assertEqual` expected)\n\
    \    ]\n```\n\nTo define an infix function, supply a function definition with\
    \ in parentheses (as if it a prefix function). But note that using functions as\
    \ infix introduces questions of precedence and associativity. In Elm, precedence\
    \ are integers from 0 (lowest) to 9 (highest), and associativity are left, right,\
    \ or none The common functions from the packages Basics and List (from the Elm\
    \ core library) follow."
