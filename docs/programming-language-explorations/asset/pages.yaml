  md: "# 32 Programming Language Explorations\n\n# 2.1 HELLO COFFECRIPT\n\nWe begin\
    \ with same three introductory programs that began Chapter 1. First up is a script\
    \ to generate integer triangle measurements.\n\n```\nfor c in [1..40]\n  for b\
    \ in [1..c]\n    for a in [1..b]\n      console.log(`${a}, ${b}, ${c}` if a +\
    \ b * b is c * c)\n```\n\nCoffeeScript expresses program structure by indentation\
    \ rather than braces. For its in-loop iterates through the values of any, and\
    \ is equivalent to JavaScript's for-of construct.¹ Two dots give an inclusive\
    \ upper bound; three dots give an exclusive range. String interpolation uses `${...}`\
    \ and works inside strings with double quotes, not single quotes. The if-clause\
    \ may follow an expression to conditionally executed, useful when you want to\
    \ emphasize the action being taken under the condition under it needs to be taken.\n\
    \nLet's translate our command line permutations example from last chapter's JavaScript\
    \ version:²\n\n```\ngeneratePermutations = (a, n) ->\n  if n is 0\n    console.log\
    \ ''\n  else\n    for i in [0..n]\n      generatePermutations(a, n-1)\n      j\
    \ = if n % 2 is 0 then 0 else i\n      [a[j], a[n]] = [a[n], a[j]]\n      generatePermutations(a,\
    \ n-1)\n```\n\n```\nif process.argv.length isnt 3\n  console.error 'Exactly one\
    \ argument is required'\n  process.exit 1\nword = process.argv[2].split(' '),\
    \ word.length-1\ngeneratePermutations(word)\n```\n\nLike JavaScript, CoffeeScript\
    \ functions can be written in two ways. Thin syntax, (params) -> body, is equivalent\
    \ to JavaScript's function (params) { body }, while the fat syntax works just\
    \ like JavaScript's fat body. Both languages have a destructuring assignment that\
    \ simplifies swapping array elements.\n\nIn line with its philosophy of minimal\
    \ syntactic noise, parentheses are optional in function calls, allowing you to\
    \ write f x y for f(x, y) and f y for f(x(y)). Without parentheses, the parser\
    \ will slip as many arguments as it can, meaning that f x, g y, z as f(x, g(y),\
    \ z) rather than f(x, g(y), z).\n\n> ¹In JavaScript for-in will iterate through\
    \ the indexes of an array.\n\n> ²This script is designed to run with Node.js;\
    \ running npm install -g coffee-script will get you a command line interpreter\
    \ and program runner."
