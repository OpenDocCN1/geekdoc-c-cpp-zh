  md: '# Standard ML


    In of 1983, Milner authored A Proposal for Standard ML to advocate for a language
    that would consolidate the strengths of the multiple ML dialects created to that
    time. The new language appeared shortly thereafter.


    ```

    First appeared 1984

    Principal Designers Robin Milner, Mads Tofte, Robert Harper

    Notable versions 90 (1990) • 97 (1997)

    Recognized for Pattern matching, Hindley-Milner typing, sophisticated modules

    Notable uses Theorem proving

    Tags Functional

    ```


    The most notable feature of Standard ML is its module system.


    +   - Structures define collections of types and values (simple, structured, and
    function).

    - Signatures provide interfaces into structures; they are often used to provide
    a restricted view of the structure to clients. Structures can be parameterized.

    - Functors can compute new structures, giving an interesting computational view
    into generic instantiation, among its other capabilities.


    Here''s an example of a signature and a matching structure—perhaps you recognize
    it as a persistent data structure state. We''ll leave functors to your self-study.


    ```

    signature STACK =

    sig

    type ''a stack

    val empty: ''a stack

    val push: ''a * ''a stack -> ''a stack

    val pop: ''a stack -> ''a * ''a stack

    val size: ''a stack -> int;

    end;

    ```


    ```

    structure Stack : STACK =

    struct

    type ''a stack = ''a list

    val empty = nil

    fun push (elem, stack) = elem:stack

    fun pop (first:rest) = (first, rest)

    | _ = raise Domain

    fun size (s) = length; s;

    end;

    ```


    ```

    val s = Stack.empty;

    val s = Stack.push(10, s);

    val s = Stack.push(3, s);

    val s = Stack.push(6, s);

    val s = Stack.push(12, s);

    val (x, s) = Stack.pop(s);

    ```


    ```

    Stack.size(s) = 3 orelse Fail "failure";

    ```'
