  md: '# Lua 55


    +   * Lua has no conditional operator.

    * Lua functions can return zero or more values. There is no tuple type in Lua;
    functions can actually return multiple values.

    * Lua variables have global scope or local scope. Local variables are introduced
    with the keyword local. Their scope begins on the statement after their declaration
    and runs until the end of the block. While this is simple, does it mean the programmer
    must take care in creating recursive functions.

    * Tables are used for both arrays (1-based sequences of numerically indexed values)
    and dictionaries (set of key-value pairs). Both numeric and non-indexed values
    can be mixed in a single table; it is up to the language implementation to keep
    the "array-part" access efficient.

    * Like JavaScript, Lua''s standard library is actually a collection of objects
    (e.g., io, os, math, etc.).

    * A metable can be attached to a table. The metable can customize the manner in
    which fields are read and written, and redefine the meaning of operators. In addition,
    metatables can be used to build the same prototypical inheritance mechanism found
    in JavaScript.

    * Lua directly supports coroutines: calling coroutine.create on an object produces
    a coroutine (of type thread). Coroutines can be yielded and returned, and their
    status can be queried.


    To continue your study of Lua beyond the introductory material of this chapter,
    you may wish to find and research the following:


    +   * Language features not covered in Lua. Chunks, environment variables, garbage
    collection metamethables, weak tables, the auxiliary library, and interoperability
    with C (the API).

    * Open source projects using Lua. Studying, and contributing to, open source projects
    is an excellent way to improve your proficiency in any language. Of the many projects
    using Lua, you may enjoy Luvit (https://github.com/luvit/luvit), CorsixTH (https://github.com/CorsixTH/CorsixTH),
    termtris (https://github.com/terylenorm/termtris), and PacPac (https://github.com/terylenorm/pacpac).
    Reference materials, tutorials, and books. Lua''s home page is http://www.lua.org/.
    The Reference Manual (as of Version 5.3) is freely available at http://www.lua.org/manual/5.3/.
    A good selection of Lua books can be found at http://www.lua.org/docs.html#books
    We recommend the most recent version of Programming in Lua by Lua''s creator,
    Roberto Iusalimchi. You may also like one of the few books covering Lua''s use
    in Game Programming.


    # EXERCISES


    Now it''s your turn. Continue exploring Lua with the activities and research questions
