  md: '# Glossary


    Although this book has taken a language-by-language approach to the study of programming
    languages, the real benefit to the study of languages as a discipline comes from
    learning the concepts that transcend multiple languages. Here is a summary of
    some of the important ones. You won''t find any examples here—just bare-bones
    definitions.


    +   **Abstract Method** A method of an abstract class that has no implementation.


    +   **Activation Record** *See frame.*


    +   **Actor** A concurrent process that communicates by sending and receiving
    messages.


    +   **Agent** An entity that acts on behalf of another entity.


    +   **Alias** One of the names of a multiply-named entity. An entity to which
    multiple names are bound to be *aliased*.


    +   **Annotation** A form of metadata passed to an entity.


    +   **Argument** An expression passed to a (parameterized) entity during a call,
    instantiation, or other invocation.


    +   **Assignable** A mutable storage location. Used in place of the term *variable*
    when emphasizing mutability.


    +   **Assignment** The act of associating a value with a (mutable) variable.


    +   **Asynchronous** A type of invocation in which the caller does not wait for
    the callee to complete.


    +   **Atom** A primitive entity whose value is, essentially, itself. Also known
    as *symbol*.


    +   **Atomic Object** An object that can be operated upon safely in a multithreaded
    environment without locks. The object hold a numeric value on which "compound"
    operations such as compare-and-add can be done atomically.


    +   **Automatic Reference Counting (ARC)** A mechanism in which the compiler inserts
    code to release and retain blocks of memory so the programmer does not have to.


    +   **Binding** An association of a name with an entity.


    +   **Borrow** The *use* of a resource without taking full ownership.


    +   **Callback** A function $f$ passed to a function $g$ and invoked within $g$.


    +   **Character** 1. A named, abstract symbol. 2. The type of characters.


    321'
