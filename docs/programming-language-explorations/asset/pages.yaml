  md: '# JavaScript 27


    JavaScript''s asynchronous callbacks and promises comprise only two ways to manage
    currency, the modeling and coordination of independent and distinct computing
    activities whose execution spans may overlap in time. We will see others throughout
    the book, including coroutines, threads, processes, actors, and functional reactive
    programming.


    # 1.8 JAVASCRIPT WRAP UP


    In this chapter we were introduced to JavaScript. We learned that:


    +   - All web browsers run JavaScript; in addition, engines such as Node.js run
    JavaScript on the command line or server.

    - JavaScript expressions manipulate values of seven types: Undefined, Null, Boolean,
    Number, String, and Object. The first six are primitive; Object is a reference
    type. Arrays and functions are objects. Values of reference types are actually
    points, so assignment of these values creates aliasing, or sharing.

    - JavaScript is weakly-typed, meaning that in situations a value e of type t can
    be used in a context in which a value of type t'' is expected. The runtime will
    find a coercion of e to a roughly-equivalent expression e'' of type t''.

    - Values that coerce to false are false; all other values are considered true.
    The only values in JavaScript are undefined, 0, NaN, the empty string, and the
    empty object.

    - When calling functions, arguments are fully evaluated and then passed by copying
    values. Extra arguments are ignored; extra parameters are assigned undefined,
    or a default value if specified. Parameters and local variables live only during
    the function activity and are invisible to other scopes.

    - When functions with variables are passed into, or copied into, different scopes,
    the free variables refer to the variables in their originally enclosing scopes.
    Functions functions are called closures.

    - JavaScript is statically scoped and uses deep binding. It supports both function-scoped
    (var) and block-scoped (let, const).

    - Object properties are either own or inherited properties. Property lookup traverses
    the prototype chain, if required.

    - The value of an expression is context-dependent. It refers to (1) the global
    object used in a global context, (2) the receiver of a method in a method call,
    provided the method is not defined with the fetch arrow, (3) the newly created
    object when using operator new, or (4) an object designated by the programmer
    in certain methods, such as call, and bind.

    - The keyword class provides for defining a constructor function and methods that
    populate a prototype object.

    - The design of JavaScript facilitates asynchronous, event-driven programming
    with callbacks. The standard library provides promises, which can be used instead
    of callbacks in many situations.


