    \ while the relative difference between $7198.993.003$ and $7198.993.003$ is (probably)\
    \ insignificant, if we are at least measuring weights, distances, or prices.\n\
    \nThe inexactness of floating-point representations often leads to surprising\
    \ results, either because the result is not representable, e.g. $10^{20} + 500\
    \ = 10^{20}$ (representable numbers are spaced by 16384 by magnitudes), but also\
    \ to rounding error: $0.1 + 0.2 = 0.30000000000000004$, because\n\n+   * The closest\
    \ bit to 0.1 is $3bf9999999999999a$\n* The closest bit to 0.2 is $3fc9999999999999a$\n\
