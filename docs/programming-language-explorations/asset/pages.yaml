    The example shows message passing is truly fundamental, and Ruby''s use of the
    class expression, the use of def, and any fancy (but useful!) constructs are more
    or less "just syntax."11 Entire object-oriented languages can be built with hardly
    any syntax at all desired-variables, messages, and parameters should suffice.
    If you find this approach to language design interesting, take a look at Io [24].


    # 5.8 RUBY WRAP UP


    In this chapter we were introduced to a genuine, pragmatic, object-oriented language,
    Ruby. We learned that:


    +   - Ruby was designed for programmers to be productive and have fun.

    - Almost all computation is done via message-passing and an object''s state is
    encapsulated, allowing Ruby to be an object-oriented programming language.

    - All objects in Ruby are instances of some class. Classes can have a single superclass
    and have multiple subclasses. Method dispatch is dynamic.

    - In an object''s class, an object may have a singleton class, in which to store
    object-specific behavior.

    - Methods may be passed blocks in addition to their regular arguments. A method
    executes its block via the yield expression. Blocks provide the foundation for
    functional programming in Ruby.

    - Blocks are closely related to procs. Proc have both lambda and non-lambda forms.

    - While a class can have only oneclass, it may mix in many modules. (A class is
    just a module that can have instances.) This means class inherits from multiple
    ancestors, and a method resolution algorithm has been defined.

    - The most useful standard modules are Enumerable, which provides a means to iterate
    through arrays, hashes, directories, files, and the like, Kernel, which provides
    dozens of methods applicable to any object. Kernel is mixed in Object, which is
    the ancestor of (nearly) every other class.

    - Ruby methods can be public, protected, or private. Private methods (with one
    exception) cannot be called with an explicit receiver, enabling code to read as
    if it has global functions. Access controls can be subverted.


    > 11This isn''t exactly true, because the scoping rules kick in. In environments
    whereas class expressions do not.'
