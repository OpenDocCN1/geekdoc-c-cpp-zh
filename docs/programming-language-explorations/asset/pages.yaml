  md: "# Programming Language Explorations\n\ntheir own memory and cooperate with\
    \ message passing. Processes send messages asynchronously to the mailboxes of)\
    \ other processes; there are no locks. Because processes have no memory, they\
    \ can crash without leaving the system in an inconsistent state; because there\
    \ are no locks, no process can wait indefinitely for a lock to be released by\
    \ a crashed process. Doing so helps the designers of Erlang, and their virtual\
    \ machine, BEAM, implement extremely lightweight processes, easy to start and\
    \ shutdown, enabling tens of thousands of processes—more to run concurrently.\n\
    \nOur first look at concurrent Erlang features two processes. The main process\
    \ spawns a new process immediately waits for a message. The spawned process eventually\
    \ sends the string \"Hello\" to the main process. The built-in spawn() returns\
    \ the process identifier, or pid of the currently executing process. The main\
    \ process captures its pid into a variable, which the spawned process uses to\
    \ send the message:\n\n```\n% First line is ignored when running with script\n\
    main() ->\n    spawn(fun -> ! \"Hello\" end),\n    receive\n        S -> io:format(\"\
    -s-n\", [S])\n    end.\n```\n\nThis script illustrates four basic elements of\
    \ Erlang's process design:\n\n+   - As p spawns q, q runs concurrently with the\
    \ rest of p.\n- When p sends x to q (qx), p drops the message in q's mailbox waiting\
    \ for q to receive it.\n- An Erlang application terminates as soon as the main\
    \ process terminates, even if hundreds of other processes are active; therefore,\
    \ it is quite common to see the main process end with a receive expression waiting\
    \ for some kind of \"done\" signal.\n\nOur next script illustrates this item.\
    \ It starts 1,000 processes—999 to each check whether a specific number in the\
    \ range 2..1000 is prime and one responsible for printing to standard output:\n\
    \n```\n% First line is ignored when running with script\nmain() ->\n    Max =\
    \ 1000,\n    Printer = spawn(printer, print_server, [self()]),\n    lists:foreach(\n\
    \        fun (N) ->\n            spawn(prime_checker, is_prime, [N, Printer]),\n\
    \            lists:seq(2, Max),\n            wait(Max-1)\n        end),\n    wait()\
    \ -> io:format(\"-n-n\");\n    wait(N) -> receive -> wait(N-1) end.\n```\n\n>\
    \ ³Prime finding is a fun exploration of concurrency, but in practice, more appropriate\
    \ sequential solutions exist for this task. This particular solution is especially\
    \ naive and inefficient."
