    We could write a single function that checks the types of arguments in a multi-way
    if-statement, but the clutter of disparate concerns, and the impossibility of
    extensibility without modifying existing source code demands that we write a function
    for each case. We could write four functions with distinct names, as the previous
    languages in this book allow, attach methods directly to an object, or define
    methods in a class, prototype, or module. JavaScript, CoffeeScript, Lua, Python,
    and Ruby, however''t permit all methods to have the same name: times(vec) and
    times(num) (as methods of a class or prototype) require different names or runtime
    type checks.


    Julia can do better than attaching to a single receiver, it takes into account
    the types of all of its arguments. We can write


    ```

    times(x::Number, y::Number) = x * y

    times(T<Number>(x::AbstractArray{T,1}), n::Number) = x * n

    times(T<Number>(n::Number, x::AbstractArray{T,i})) = x * n

    times(s::AbstractArray{n::Unsigned}) = repeat(s, n)

    ```


    ```

    assert times(5, -2.5) == -12.5

    assert times([1, 0, 5 //3]) == [3.0, 15, 2]

    assert times(3, [1. 0, 5]) == [3.0, 15, 0]

    assert times("ho", Uint64(3)) == "hoho"

    ```


    Here times is a generic function with four methods. Considering the types of multiple
    arguments when determining which method to call is known as multiple dispatch.


    The first call in our example dispatches to the first method, because the argument
    types (Int64, Float64) can be passed to the parameter tuple (Number, Number).
    But notice the second of method. It is tempting to define the first parameter
    as an AbstractArray(Number,1), but this will not work! Passing an Array of Float64
    objects to an array of numbers fails because arrays are not covariant on their
    element type. Julia''s parametric methods rescue us here. We introduce a type
    T and the method''s first parameter as an array of elements whose type is Number
    or any descendant type of Number. We will encounter this technique of parameterizing
    methods to get around the invariance of collection types in the next chapter (on
    Java) as well.


    # 6.5 METAPROGRAMMING


    We''ve seen a few introspective cases in previous chapters, such as asking a Python
    or Ruby class for the list of its methods, or asking a JavaScript function for
