  md: '# Preface


    Much has happened since the question “Why would you want more than machine language?”
    was answered.


    +   - 1950s-60s: Several computing professionals, most notably Grace Hopper, John
    McCarthy, and John Backus, create high-level, machine-independent programming
    languages. We have seen Fortran for scientific computing, COBOL for business,
    Algol for computing research, and Lisp for artificial intelligence. In the mid-1960s,
    PL/I and Algol 68 emerge as multi-purpose computing.

    - 1960s-1970s: Industry learns that hard-to-read code prevents prevents many projects
    from achieving success. The structured programming revolution begins. Languages
    providing information hiding, as Modula, CLU, Simula, Mesa, and Euclid attempt
    to address the “software crisis”. Structured and modern features are bolted on
    earlier languages.

    - 1980s: Object-orientation (OO) takes the world. Though begun in the 1960s with
    Simula and refined later, OO—explodes in the 1980s with Classes (then renamed
    C++), Objective-C, Eiffel, and Selff. Earlier languages such as Lisp and Pascal
    gain OO features, becoming Common Lisp and Object Pascal, respectively.

    - 1990s: The World Wide Web expands and Perl become popular. Java, JavaScript,
    and PHP are created with web applications.

    - 2000s: With metrics increasing, interest in dynamic languages such as Ruby takes
    off. Scala shows that static languages can feel dynamic. Clojure arrives as a
    dynamic, modern Lisp, leveraging Java’s virtual machine.

    - 2010s: Old things become new again. Multicore processors and “Big Data” return
    in functional programming. Older languages such as Python and R, and the newer
    Julia, find use in data science. Net-centric computing and performance concerns
    make static typing popular again as Go, Rust, Swift and C++ for native applications.


    Each of the two languages we mentioned, and the thousands we did not, is created
    for some purpose. New creations may address a particular problem, improve upon
    old languages, or help us express solutions in a more efficient manner. Some introduce
    big ideas that use new ways to think about programming. There’s no single best
    language for all possible tasks, so we learn them many.


    This book aims to acquaint you with a number of programming languages in use today.
    For each, we will provide a brief tour of the language’s basic and advanced features
    augmented with dozens of examples. In doing so, we will introduce many fundamental
    concepts translating multiple languages, providing you a foundation for effectively
    using your current favorite languages—and for learning new ones,.'
  merge: -1
