  md: "# 248 Programming Language Explorations\n\ndistinguish the two lists, the external\
    \ name first. When calling a function, you must specify the external name, unless\
    \ it is the special name _:\n\n```\nfunc perimeter(base: Int, height: Int) ->\
    \ Int {\n  return 2 * (base + height)\n}\n```\n\n```\nfunc average(of x: Int,\
    \ and y: Int) -> Double {\n  return Double(x + y) / 2.0\n}\n```\n\n```\nfunc middle(x:\
    \ Int, y: Int) -> Double {\n  return Double(x + y) / 2.0\n}\n```\n\n```\nassert(perimeter(base:\
    \ 4, height: 20) == 48\nassert(average(of: 5, and: 8) == 6.5)\nassert(middle(5,\
    \ 8) == 6.5)\n```\n\nSwift functions are special to cases of closures—code blocks\
    \ that can be assigned, passed as parameters, and invoked. Swift closures (other\
    \ than functions) capture bindings from the context the closure's definition,\
    \ and are lexical closures. Two forms of closure expressions, with type inference,\
    \ implicit return, and shorthand arguments ($0, $1) allow succinct code:\n\n```\n\
    let a = [(3,1), (2,8), (3,20)]\nassert(a.map{x, y in x * y} == [10, 68, 409])\n\
    assert(a.map{$$0 + $1} == [10, 68, 409])\n```\n\nClasses and groups struct (defined\
    \ with var and let), methods (with func), subscripts, and initializers. Properties\
    \ can be stored or computed:\n\n```\nimport Foundation\n\nstruct Circle {\n  var\
    \ radius: 1.0\n  var area: Double {\n    get {return M_PI * radius * radius}\n\
    \    set {radius = sqrt(a/M_PI)}\n  }\n}\n```\n\n```\nvar c = Circle(radius: 10)\n\
    assert(c.radius == 10 && c.area == 100*M_PI) // get property\nc.area = 16*M_PI\
    \ // set property\nassert(c.radius == 4 && c.area == 16*M_PI)\n```\n\nA computed\
    \ property can be read-only by providing only a getter. When only a getter is\
    \ present, you can omit the get keyword, writing for example, var area: Double\
    \ { return M_PI * radius * radius }"
