  md: "# 9.5 RECORDS\n\nJust like unions generalize sum types by labeling variants,\
    \ Elm's records generalize product types (tuples) by labeling components. Let's\
    \ take a look:\n\n```\nimport ElmTest exposing (runSuite, suite, defaultTest,\
    \ assertEqual)\nimport List exposing (map)\n\nboss = {name = \"Alice\", salary\
    \ = 200000 }\nworker = {name = \"Bob\", salary = 50000, supervisor = boss }\n\
    newWorker = {worker | name = \"Carol\"}\n\npayTax : {a | salary} -> Float\npayTax\
    \ {salary} =\n  salary * 0.15\n```\n\n```\nmain =\n  runSuite <| \"Exploring records\"\
    \ | map defaultTest\n    [ \"assertEqual\" .name boss\n    , \"assertEqual\" .worker.supervisor\n\
    \    , 7500.0 \"assertEqual\" payrollTax worker\n    , \"assertEqual\" .newWorker.supervisor\
    \ ]\n```\n\nWe created three: the first of { name : String, salary : number, number\
    \ }, the second with { name : String, salary : number }, and the third with the\
    \ same type as the second. We defined our third record, newWorker, to be just\
    \ like worker except with the \"Carol\" (instead of \"Bob\\). We then defined\
    \ a function to compute a 15% payroll tax, illustrating pattern matching for records.\
    \ Read the type of the function, {a | salary : Float} -> Float as \"a function\
    \ that accepts any record that has a named salary of Float, and produces a Float.\"\
    \ That's pretty flexible. We never introduced types at all, never subclassed employees\
    \ into workers and managers, and yet Elm ensures the entire program is fully-safe.\n\
    \nYou may find Elm's aliases useful in describing records. An alias is not a new\
    \ type, but rather an abbreviation for a type:\n\n```\ntype Person = { name :\
    \ String, id : Int }\ntype Widget = { name : String, id : Int }\n\ntype PrimaryColor\
    \ = Red | Blue | Green\ntype AliasColor = PrimaryColor\n```\n\n```\np : Person\n\
    p = { name = \"Alice\", id = 239 }\nw : Widget\n   = p\ng : PixelColor -- Disappointing\
    \ perhaps, but let green\ng = Green\n```"
