  md: "# Programming Language Explorations\n\n```\ninterface Drawable {\n  void outline(Color\
    \ color);\n  void fill(Color color);\n  default void render(Color outlineColor,\
    \ Color fillColor) {\n    fill(fillColor);\n    outline(outlineColor);\n  }\n\
    }\n```\n\nJava classes extend to at most a single superclass, though it allows\
    \ classes to implement any number of interfaces. Restricting extension to a single\
    \ subclass nicely prevents a class from inheriting two or more same (instance)\
    \ fields with the same name and type, or two or more methods with the same name\
    \ and different signatures—a situation known as multiple inheritance. A wise move,\
    \ perhaps, multiple inheritance leads to questions. Are both fields inherited\
    \ or only the first one? Are both methods inherited? If only one, which one? Is\
    \ there a method resolution order, as we saw in Python?\n\nBut Java allows the\
    \ implementation of multiple interfaces. Does this lead to multiple inheritance\
    \ with all of its requirements for disambiguation? Let's see Given:\n\n```\ninterface\
    \ A {\n  int X = 1; // implicitly public static final\n  default void f() {} //\
    \ implicitly public\n}\n```\n\n```\ninterface B {\n  int X = 2; // implicitly\
    \ public static final\n  default void f() {} // implicitly public\n```\n\nCan\
    \ we define the class\n\n```\nclass C implements A, B {\n```\n\nThe error occurs\
    \ if you attempt to inherit both defaults; were class C to prove its own overridden\
    \ implementation of f(), all would be fine. Now what about the differing definitions\
    \ of (the field) X? No problem with the class C, you may refer to both A.X and\
    \ B.X, but you will get a compile-time error if you fail to qualify X with the\
    \ originating interface name.\n\nJava simply not allow multiple inheritance at\
    \ all.\n\nAn interface with exactly one abstract method is called a functional\
    \ interface. Java provides nice syntactic sugar for instances of classes that\
    \ implement a functional interface: you can define interfaces directly without\
    \ ever specifying the implementing class!\n\n```\n@FunctionalInterface\ninterface\
    \ Function {\n  double apply(double x);\n}\n```"
