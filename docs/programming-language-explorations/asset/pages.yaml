  md: "Keys are generally enclosed in brackets, except when the key is a simple name\
    \ (letters, digits, and underscores, not beginning with a digit). Unspecified\
    \ keys are auto-generated the integers 1, 2, 3, and so on.\n\nKeys are not restricted\
    \ to strings and numbers, but they cannot be nil. Values can't be nil, either\
    \ since nil turns out to be the response to a request for a nonexistent value.\
    \ This treatment of nil is consistent with Lua's evaluation of an undeclared variable\
    \ A table of nil would be indistinguishable from the key being present in the\
    \ table. Therefore, to remove an element from a table, set the value at the desired\
    \ key to nil.\n\n```\ncolors = {'red', 'blue', 'green'}\ndog = {'Lissichka', breed\
    \ = 'G-SHEP', age = 13}\n```\n\n```\n-- Length order counts number of integer\
    \ keys\nasert(#colors) == 3\nnasert(colors[1]) == 'red'\n```\n\n```\n-- Need our\
    \ own function to count all pairs\nfunction number_of_pairs(t)\n    local count\
    \ = 0\n    for _, _ in pairs(t) do count = count + 1\n    return count\nend\n\
    ```\n\n```\n-- Assignment of nil removes a key pair\nasert(number_of_pairs(dog)\
    \ == 3)\ndog.age = nil\nasert(number_of_pairs(dog) == 2)\n```\n\nGlobal variables\
    \ are actually kept in a table called the global environment. This table contains\n\
    \n+   - A string at index _VERSION;\n- Functions, including assert, pairs, pairs,\
    \ print, pcall, tonumber, tostring, require among others; and\n- Tables, including\
    \ coroutine, io, debug, string, utf8, table, math, os, package, among others.\n\
    \nWhen you create your global variables, they are added to this table. Hence,\
    \ Lua's global environment is analogous to JavaScript's global object.\n\n# 3.5\
    \ METATABLES\n\nRecall that in JavaScript and CoffeeScript, every object has a\
    \ prototype (unless explicitly created, by the programmer, without one) to which\
    \ it delegates the search for missing properties. Lua supports delegation, too:\
    \ a table may have a metatable, though metatables do much more than simply extend\
    \ the search for properties!\n\n> ³Yes, they start at 1, not 0."
