    While Milner''s efforts to consolidate the disparate ML dialects into a single
    standard had some success, one family branch—that of INRIA''s CAML—did not join
    the party. CAML soon evolved into OCaml, also known as Objective Caml.


    +   First appeared 1996

    Architect Xavier Leroy

    Notable versions 3.00 (2001) • 3.10 (2008) • 4.03 (2016)

    Recognized for Performance, Expressiveness, Safety

    Notable uses Compilers, Financial Trading

    Tags Functional, Object-oriented


    OCaml and Standard ML are very similar languages, inheriting all of the pattern-matching,
    type inference, and other powerful features of their ancestor, but greatly in
    syntax. OCaml does better support for what we today call object-orientation, and
    has turned out to be better than any “standard” sibling. It notably became a convenient
    language for authoring compilers—both Facebook’s Hack and early versions of Mozilla’s
    Rust were written in OCaml. Modern languages such as Elm, F#, Scala, and Rust
    have listed OCaml as one of their primary influences.


    # Haskell


    Haskell arose from an effort to build an open standard bringing various ideas
    and contributions from twenty or so closely-related functional languages that
    grew up in the 1980s. It has since become the most popular functional language
    used today, with fans both in academia and industry.


    +   First appeared 1990

    Notable versions 1.0 (1990) • 98 (1998) • 2010

    Recognized for Pure functions, non-strict semantics, type classes, monads

    Notable uses Academia, Software validation and verification, Modeling, Compilers

    Tags Non-strict, Lazy, Functional


    Haskell sports its ML-style features such as higher-order functions, static Hindley-Milner
    typing, type patterns, and modules. But Haskell is different in at least three
    ways from its relatives, and, indeed, from every language we have encountered
    so far: Haskell has a non-strict semantics, categorizes types via type classes,
    and meets each of the requirements to be known as a pure functional language.
    We will discuss these language attributes in the remainder of this section.


    A non-strict semantics means that expressions can produce a value even when subexpressions
    have no value. For example, if we define the function as:


    ```

    zero x = 0

    ```


    then the Haskell expression zero (1 “mod” 0) has the value 0, while evaluating
    the expression zero (1 % 0) in Elm, which is strict, produces a division by zero


    > ⁴An expression without value is one whose evaluation would enter an infinite
    loop or fail. In formal semantics, the meaning assigned to a “valueless” expression
    is ⊥, pronounced “bottom.” A semantics is strict if the meaning of f(⊥) is ⊥ for
    all operators, and constructors f.'
