  md: "# 172 Programming Language Explorations\n\n+   - Tuples. The value (7,\"abc\"\
    ) has type (Float, String). Tuple types are Elm’s product type. they can have\
    \ any number of constituent types, including zero.\n\n+   - Records. The value\
    \ { x = 3.5, y = 5.88, color = \"red\" } has type { String; x = Float; y = Float\
    \ }. Note the record type includes the field names; records are essentially tuples\
    \ with labeled components.\n\n+   - Tagged Unions. Unions of a tagged union (sometimes\
    \ a discriminated sum type) can tag together with a value from another type—or\
    \ just a tag. Elm’s unions solve the same problem types solve, and can beautifully\
    \ model enumerations, state machines, and type hierarchies of the popular \"object-oriented\
    \ languages\" as we will see later. The requirement for including tags with values\
    \ allows for more readable and expressive than your basic sum type.\n\n+   - Functions.\
    \ The value { x -> (x,x)} has type Int -> (Int, Int).\n\nDid you expect see lists?\
    \ If you're wondering where the lists and dictionaries went, don't worry—they’ve\
    \ been built with union tuples. Let's move straight to examples, beginning our\
    \ first example also illustrates the use of a type alias. An alias does not create\
    \ a new type; rather, it provides a convenient mechanism for a more complex expression.\n\
    \n```\nimport ElmTest exposing (suite, test, runSuite, assertAreEqual)\n\nf :\
    \ (Int, Int, Int) -> Int\nf (a, _, c) =\n3 * c + a\n\ntype alias Vector = (Float,\
    \ Float)\n\nmagnitude : Vector -> Float\nmagn v =\nlet (x, y) = v in\nsqrt (x\
    \ * x * y)\n\nmain =\nrunSuite <| \"Tuples\"\n  [ test \"Semantics for =\" ((6,8)\
    \ `assertEqual` (7-1,4*2))\n  test \"Pattern match\" (f(1,2,3) `assertEqual` 10)\n\
    \  test \"Destructuring\" (magnitude(3,4) `assertEqual` 5.0)\n  test \"Tuple return\"\
    \ ((x -> (x,x)) `assertEqual` (1,1))]\n```\n\nTuples are accessed via pattern\
    \ matching, which works in both passing the function argument and in let bindings.\
    \ We said the function argument. Like relatives in the ML family, function types\
    \ have the form $T_1 \\to T_2$ for $T_1$ and $T_2$. Instead of thinking about\
    \ \"multiple parameters\" and \"multiple return types,\" about accepting and returning\
    \ values.\n\n> ¹The empty tuple type, (), is commonly called the unit type.\n\
    ²Elm does not have a built-in assertion library, but you can easily install a\
    \ third-party package. We’ve used the ElmTest package. You will need to install\
    \ with a command such as elm-package elm-community/elm-test."
