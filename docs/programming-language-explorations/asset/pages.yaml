    # 0.2 PROGRAMMING LANGUAGE ELEMENTS


    What are some of the principles, or concepts, that transcend multiple languages?
    We''ll answer this throughout the book, but it helps to provide a foundation by
    introducing the basic linguistic elements that underlie these concepts. These
    elements will provide us with the working vocabulary we will need to describe
    programming principles and compare and contrast programming languages in a meaningful
    way.


    A value is a unit of data. We have numeric values (e.g., three, π, ninety-seven
    point eight), values for truth and falsity, character and text values (strings),
    values containing other values (whose internal values may be named or numbered),
    and values that indicate missing or unknown information.


    A literal is a representation of a value. A few follow:


    +   - 95 is a literal for the value ninety-five. Alternate representations for
    this value include 0xF (Ox is a common prefix for hexadecimal numbers), 0b1011111
    (b means binary), and 0.009564 (E means “times-ten-to-the”).

    - true (sometimes True or T) is the literal representing truth; false (or False
    or F) is the literal representing falsity.

    - The quoted characters "Hello, how are you?” is a string literal representing
    a common English phrase.

    - :alice (rendered in languages as just alice) is a kind of literal known as an
    atom, or symbol. Atoms stand only for themselves and nothing else. Unlike strings,
    they are not decomposed into character sequences.

    - [98.6] is a literal for the sequence of values: zero, truth, and ninety-eight
    point six.

    - {latitude: 29.9792, longitude: 31.1344} is a literal representing the location
    of the Great Pyramid of Giza.

    - x = x / 2 is a literal representing a function that halves its argument. Alternate
    forms for this function include {%0 % 2}, #/(x % 2), lambda x: x / 2.

    - null (semetines nil or None) is a literal used to indicate the intentional absence
    of a value.

    - undefined is a literal used to indicate some desired value is unknown or purposely
    being divided. Think of this as “I don''t know “I don''t care,” or “None of your
    business.”'
