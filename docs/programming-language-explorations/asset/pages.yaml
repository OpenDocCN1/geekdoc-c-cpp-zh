    \ of a library, returning explicit error values to clients of the library. [35]\
    \ Such a design leads to a simpler interface between callers and services.\n\n\
    # 11.7 GOROUTINES\n\nThe preceding sections have not covered the best part of\
    \ Go.\n\nGo is a concurrent language. This is a good thing, because the world\
    \ is concurrent, i.e., made of independent, interacting actors. **Concurrent programming**\
    \ is the art of structuring software systems by composing and coordinating these\
    \ independent computations. Concurrency is not the same as parallelism. Parallelism\
    \ is the state of things happening at the same time; concurrency is about managing\
    \ activities that overlap in time, whether or not those activities interleave\
    \ execution on a single processor or run in parallel on distinct processors. [98]"
