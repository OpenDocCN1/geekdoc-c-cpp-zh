    insert : comparable -> v -> Dict comparable v -> Dict v

    member : comparable -> Dict v -> Bool

    get : comparable -> Dict v -> Maybe v

    ```


    Whenever one of the special type variables appears more than once in a type expression,
    all occurrences unify together, so (comparable, comparable) does not unify with
    (Int, String). However, the latter does not unify with (comparable, comparable'')
    since the variables comparable and comparable'' are distinct.


    It is tempting to think of the four type variables as interfaces, this is completely
    wrong. Defining your type and overloading (++) does not make your type appendable,
    nor does overloading any particular set of functions ever make your new type comparable.
    So don''t go looking to place values of your own types in sets or use them as
    dictionary keys.


    However, you can do things in Haskell, another of the ML family of languages.
    Haskell introduced the notion of type classes. Type classes can belong to zero
    or more types. A dozen of these classes exist, including Eq, Enum, Integral, Real,
    Functional, Floating, Read, and Monad. Each class specifies certain operations
    (equality for Eq, comparison for Ord, conversion to strings for Show) and you
    can, when defining your own types, specify which type classes they belong to,
    provided of course, that you provide implementations for the functions required
    by the type class.


    Other ML-family languages take a different approach. Rather than type classes,
    Standard ML and OCaml feature sophisticated module systems, which allow you to
    carry out the same kind of generic programming supported by Haskell''s type classes
    and interfaces. As a young language, Elm may well evolve to gain type classes
    or other features, with academic-sounding names as higher-kinded polymorphism
    [49, Ch. 18] and Rank-N types [52]. You may find Elm''s choice of fixed type variables
    (in lieu of type classes or SML-style modules) limiting, or value its simplicity
    and pragmatism. Either way, the use of type variables and type inference based
    on Hindley-Milner types gives Elm a great deal of expressivity. We now turn to
    two of the language''s powerful mechanisms for defining new types: tagged unions
    and


    > *Technically, Elm provides an infinite number of special type variables; the
    names simply need to start with number, comparable, or appendable. This number
    ''number1, number2, and nopherfile all behave as number.'
