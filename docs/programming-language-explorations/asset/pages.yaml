    # 2.6 EXISTENTIAL OPERATORS


    CoffeeScript, again like JavaScript, uses null for the intentional absence of
    information, and undefined if no information is given. All other values are known
    values, and can act like objects—in fact, accessing properties of null and undefined
    are among the few places a TypeError can occur:


    ```

    assert = require ''assert''

    asert 4.toFixed(2) is ''4.00''

    asert true.toString() is ''true''

    asert ''abcd''.length is 5

    asert [5,3,9,4,6].indexof(3) is 1

    asert assert.throws((--> null.toString()), TypeError)

    asert assert.throws((--> undefined.toString()), TypeError)

    ```


    The postfix operator ? reports whether an expression is known, that is not null
    and not undefined:


    ```

    assert = require ''assert''


    asert 78.8? is true

    asert false? is true

    asert []? is true

    asert undefined? is false

    asert null? is false

    x = 9;

    asert x? is true

    ```


    The question mark combines with several operators to do some slick things. The
    most common use is


