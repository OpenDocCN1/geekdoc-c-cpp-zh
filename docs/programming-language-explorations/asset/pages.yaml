  md: "# 232 Programming Language Explorations\n\n```\nfunc Example() {\n    var numbers\
    \ [100000]int\n    for i := range numbers {\n        numbers[i] = 1\n    }\n \
    \   ch := make(chan int, 2)\n    go sum(numbers[:len(numbers)/2], ch)\n    go\
    \ sum(numbers[len(numbers)/2:], -ch + ch)\n    fmt.Println(// Output: 499950000)\n\
    }\n```\n\nWe've created the channel in this example via make(chan string, 2),\
    \ giving it a capacity of two messages. Channels with capacities are called buffered\
    \ channels: if a channel holds fewer messages than its capacity, sender blocks.\
    \ The type annotation on sum's ch parameter, chan int, indicates the channel will\
    \ not send. (There is, of course, a corresponding annotation for receive-only\
    \ channels: <-chan int).\n\nIn addition to reading a single item from a channel\
    \ using <-, we can iterate over the channel with the range operator, consuming\
    \ messages until the channel is closed. In the following example, a goroutine\
    \ sends 10 messages through a channel, then closes the channel. A loop reads and\
    \ prints each message, then exits cleanly as the channel closed:\n\n```\npackage\
    \ main\n\nimport \"fmt\"\n\nfunc generateMessages(ch chan string, n int) {\n \
    \   for i := 0; i < n; i++ {\n        ch <- \"Hello\"\n    }\n    close(ch)\n\
    }\n\nfunc main() {\n    messages := make(chan string, 5)\n    go generateMessages(messages,\
    \ 100)\n    for message := range messages {\n        fmt.Println(message)\n  \
    \  }\n}\n```\n\nReading from a closed channel does not block a goroutine. To detect\
    \ whether a channel is closed, you can use the two-return-value form of <-; if\
    \ closed the second value will be false, and the first will be the zero value\
    \ of the channel's message type.\n\n```\npackage main\n\nimport \"fmt\"\n```"
