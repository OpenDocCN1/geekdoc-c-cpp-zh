    \ 20, 30]\nvar b = [Int](repeating: 1, count: 4)\na[2] = 40\na.append(50)\na +=\
    \ b\nasert(a.count == 8)\na[1...3] = [0, 2, 4]\na.remove(at: 3)\nasert(a == [10,\
