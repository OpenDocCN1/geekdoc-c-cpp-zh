    Lua (as version 5.3) has 25 operators across 12 precedence levels. From highest
    to lowest precedence, they are:


    | Operator | Associativity | Description |

    | --- | --- | --- |

    | not # | L | exponentiation logical negation, length, numeric negation, bit complement
    |

    | * / % | L | multiplication, division, floor division, modulo |

    | + | L | addition, subtraction |

    | - | R | concatenation |

    | << >> | L | left shift, right shift |

    | & | L | bit and |

    | \| | L | bit xor |

    | <= == | L | bit or |

    | < = > | L | comparison operators |

    | and | L | (short-circuit) return first operand if false, else second |

    | or | L | (short-circuit) return first operand if truth, else second |


    There are a few differences from JavaScript. Lua adds an exponentiation operator,
    a length operator, and uses different operators for string concatenation and negation.
    This means Lua avoids the classic surprise in which "The answer is " + x + y returns
    an "answer" of 22 when x and y have a numeric value. Lua does not have a conditional
    operator (e.g., ?, __), or any assignment operator! Lua in a statement is not
    an assignment. This might be a good thing: Assignment has side-effects, and its
    appearance in the middle of an expression can be confusing (by some) with an unit
    test.


    In an assignment statement such as x, y = 0 we have a name list on the left and
    an expression list on the right. An expression list is not an actual object, nor
    is it tuple. It''s simply a list of expressions that get evaluated and assigned
    to the variables on the left side. "Extra" expressions on the right are ignored;
    extra names on the left become nil. Expression lists also allow in return statements,
    since a function may return multiple values:


    > Floor division applies the floor operator to the quotient: 5 // 2 ==2 5 / 2
    ==2.5.'
