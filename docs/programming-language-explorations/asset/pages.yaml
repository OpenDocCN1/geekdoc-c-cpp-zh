  md: '# 8 Programming Language Explorations


    But we may end up choosing a language for other, “softer,” reasons:


    When you finally go out on a limb and proclaim your love of language A, or that
    your team should use language B for task C, you should be ready with an informed
    rationale, perhaps from the criteria above. If your decision is less than popular,
    you may be challenged with questions as why your preferred language X does not
    have feature Y. The answer may be “because it has feature Z instead.\ For instance:


    +   - The expressive power of dynamic typing, persistent data structures, functions
    as first-class values, higher-order functions, and closures (all topics we’ll
    introduce in the book) saves development time and makes it easier to reason about
    program behavior, but may negatively impact runtime performance.

    - Automatic garbage collection, where unreachable memory is automatically freed
    without direct programmer intervention, may save thousands of hours of programmer
    time, but should not be used in embedded, life-critical, real-time systems. A
    collector might decide to free up space while your code is performing a time-sensitive
    maneuver in a fighter plane or delivering radiation to a patient.


    These tradeoffs, and others like them, tell us why there cannot be a best language
    for all situations. But this makes life better, because we get so many choices.
    The next twelve chapters will take you through twelve modern languages and the
    choices made by their designers. We’ll design tradeoffs and time again. Have fun.'
