  mdcn: "\n## 声明、实现和调用 C# 方法\n\n至此，你需要了解可以对现有方法执行的过程。这些过程包括：\n\n- 声明——在此过程中，你会将方法关联到程序。此过程允许你在程序的任何部分调用该方法。\n\
    - 实现——此过程涉及输入代码以完成某项任务。这里涉及的代码存在于你正在使用的方法内部。\n- 调用——这是调用已声明方法的过程。在此，你将使用方法解决问题或执行操作。\n\
    \n## 方法声明\n\n在 C# 中，你需要在类内部声明方法。此外，不允许“嵌套”方法（即，在一个方法体内编写另一个方法）。最好的例子是 Main()，你已经多次使用过的方法。下面的代码说明了这一点：\n\
    \n```csharp\nclass DeclaringMethods\n{\n    static void Main()\n    {\n      \
    \  System.Console.WriteLine(\"Hi C#!\");\n    }\n}\n```\n\n### 语法\n\n声明方法时，请使用以下语法：\n\
    \n```\nstatic data_type_of_the_result name_of_method (list_of_parameters)\n```\n\
    \n让我们使用 Main() 方法（即 static void Main()）来分析这个语法。Main() 使用“void”作为返回类型，因为它不产生任何结果。“Main”一词作为其名称。另一方面，圆括号充当程序员将提供的参数的容器。\n\
    \n重要提示：编写 C# 程序时必须遵循此语法。不要改变方法各部分的位置。\n\nC# 不要求你在声明中包含参数。这意味着你可以将圆括号留空（例如 Main()）。\n\
    \n### 方法名称\n\n在声明、调用或实现期间，你需要指明方法的名称。以下是命名方法时需要记住的规则：\n\n- 确保首字母大写。\n- 每个单词都以大写字母开头（例如\
    \ SampleMethod、NewMethod、MainLine 等）。\n- 使用动词和名词作为方法名称。\n\n重要提示：上述规则完全是可选的。如果你希望\
    \ C# 代码具有出色的结构和可读性，请遵循这些规则。\n\n## 方法实现\n\n仅声明方法还不够。如果你希望方法在程序中运行，还需要实现方法。程序员在指代方法的实现时使用术语“主体”。\n\
    \n### 主体\n\n你会在花括号内找到方法的主体。该主体由你想执行的命令、表达式和语句组成。因此，主体是任何方法的重要组成部分。\n\n重要提示：请记住，在\
    \ C# 中不能嵌套方法。不要在其他方法内部编写方法。\n\n## 方法调用\n\n基本上，这是运行方法主体内语句的过程。调用方法简单容易：你只需指明其名称，添加一对圆括号，并使用分号结束该行。以下是应使用的语法：\n\
    \n```\nname_of_method();\n```\n\n下面的示例代码将向你展示如何调用方法：\n\n```csharp\nclass Animals\n\
    {\n    static void Main()\n    {\n        Console.WriteLine(\"I love dogs.\");\n\
    \    }\n}\n```\n\n如果你编译并执行该代码，命令提示符将打印以下消息：\n\n*我爱狗。*\n\n### 可以调用方法的位置\n\nC# 允许你在以下区域调用方法：\n\
    \n- 在程序的 main 方法（即 Main()）内部。\n- 在另一个方法内部。\n- 在该方法自身的主体内部。这种技术称为“递归”。\n\n## 结论\n\
