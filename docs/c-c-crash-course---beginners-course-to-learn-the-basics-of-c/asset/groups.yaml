    \ y`）。\n- “<” – 此运算符比较两个操作数的值。如果左操作数的值小于右操作数的值，则会返回“true”（例如 `y < x`）。\n- “>=”\
    \ – 使用此运算符，你可以确定左操作数的值是否大于或等于右操作数的值。\n- “<=” – 如果左操作数的值小于或等于右操作数的值，则此运算符会返回 true。\n\
    - “!=” – 使用此运算符检查两个操作数是否相等。如果值不相等，则会返回 true（例如 `x != y`）。\n\n### 条件运算符\n\nC# 用户将“?”称为条件运算符。基本上，此运算符使用布尔表达式的结果来确定应处理哪个语句。这被称为“三元运算符”，因为它作用于三个操作数。这里，第一个值应为布尔值，而其余值需要属于相同的数据类型（例如字符、字符串、数字等）。\n\
    \n此运算符的语法如下：\n\n```\nfirst_operand ? second_operand : third_operand;\n```\n\n\
    这是其工作原理：如果“first_operand”为 true，程序将处理“second_operand”。如果“first_operand”为 false，则程序将处理“third_operand”。\n\
    \n## 第 4 章：数据类型转换\n\n通常，运算符作用于属于相同类型的参数。然而，C# 语言提供了广泛的数据类型，可用于某些情况。要对属于不同类型的变量执行任何处理，应先转换其中一个变量。在\
    \ C# 中，数据类型转换可以是隐式的或显式的。\n\n每个 C# 表达式都有一个数据类型。此数据类型由表达式内部使用的文字、变量、值和结构得出。基本上，你可能会使用类型与情况不兼容的表达式。当这种情况发生时，你会得到以下结果之一：\n\
    \n- 程序会给出编译时错误。\n- 程序将执行自动转换。这意味着程序将获得正确的表达式类型。\n\n将“s”类型转换为“t”类型允许你在运行程序时将“s”视为“t”。有时，此过程需要程序员验证类型转换。查看下面的示例：\n\
    \n- 将“objects”转换为“strings”需要在程序运行时进行验证。此验证确保你确实想将值用作字符串。\n- 将“string”值转换为“object”值不需要任何验证。那是因为“string”类型是“object”类型的一个分支。你可以将字符串转换为其“父”类，而不会丢失数据或出现任何错误。\n\
    - 在将 int 值转换为 long 值时，你无需执行验证。\n"
