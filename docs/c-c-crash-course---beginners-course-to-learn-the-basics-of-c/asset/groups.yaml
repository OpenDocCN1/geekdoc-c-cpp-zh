    # Chapter 2: The Data Types, Variables, and Literals of C#


    This chapter will focus on the data types and variables used in the C# language.
    By reading this material, you’ll know what these objects are and how you can use
    them in writing your own programs.


    # Variables – An Introduction


    Typical programs utilize different values during their execution. For instance,
    you can develop a program that solves mathematical problems. Obviously, you need
    to enter different values while using this kind of program. Simply put, programmers
    don’t know which values will be entered by the user. Thus, they need to make sure
    that the resulting programs will accept any value that the user may provide.


    When the user gives a value, you may temporarily store it in the machine’s RAM
    (i.e. random access memory). All of the values inside this memory may change.
    Because of this, programmers refer to such values as “variables”.


    # The Data Types'
  - '[PAGE 12]


    A data type is a set (or range) of values that share similar attributes. For example,
    the “byte” data type refers to the values within the “0 to 255” number range.


    # Attributes


    Data types have the following attributes:


    +   - Name (e.g. int, char, bool, etc.)

    +   - Size (e.g. 1 byte)

    +   - Default Value (e.g. 1, 2, 3, etc.)


    # The Different Types of Data in C#


    C# supports the following data types:


    +   - Boolean

    +   - Characters

    +   - Objects

    +   - Floating-Point

    +   - Decimals

    +   - Integers

    +   - Strings


    Since these data types are pre-installed into the C# language, programmers refer
    to them as “primitive types”. Let’s discuss each data type in detail:


    # Boolean


    You need to use “bool” (i.e. a C# keyword) to declare this data type. Boolean
    values can only be “true” or “false”. In the C# programming language, Boolean
    values are automatically set as “false”. Programmers use this data type to store
    the result/s of logical statements.


    # Characters


    This data type can store single characters. You need to use “char” (i.e. another
    C# keyword) to declare this type. Write your “char” values within a pair of apostrophes
    (e.g. “I”).


    # Objects


    Programmers regard objects as the most special type of data in the C# language.
    Basically, objects serves as the parent of other data types within .NET. This
    data type, which requires the “object” keyword during its declaration, may accept
    any value from other data types. You may think of objects as addresses that point
    to certain parts of your computer’s memory.


    # Real Type – Floating Points'
  - '[PAGE 13]


    In the C# language, “real type” refers to the actual numbers you’ve learned in
    mathematics. A floating-point real data type can either be “float” or “double”.


    +   1. Float – Programmers call this subtype “single-precision real integer”.
    The default value of a float number is 0.0F (the “f” at the end is not case-sensitive).
    The letter “f” indicates that the value is a “float”.

    +   2. Double – Programmers use the term “double-precision real integer” when
    referring to this subtype. Its default value is 0.0D (i.e. the letter “d” at the
    end is not case-sensitive.). C# automatically tags real numbers as “double” so
    you don’t really need to add “d” at the end of the value.


    # Real Type – Decimals


    This programming language supports “decimal arithmetic”, a mathematical approach
    that uses decimal values to represent numbers. The main advantage of this approach
    is that it preserves its accuracy regardless of the values it works on.


    C# uses the “decimal” data type to represent this kind of real number. This data
    type is 128 bits long and is accurate up to the 29th decimal value. Because of
    its excellent accuracy, these are used by programmers for financial computations
    (e.g. payments, taxes, interest, etc.).


    # Integers


    This data type consists of 8 subtypes, which are:


    +   SBYTE – An sbyte is a signed integer that is 8 bits long. That means it can
    contain up to 256 values (i.e. 2⁸). Additionally, sbytes can be either negative
    or positive.

    +   BYTE – This subtype contains unsigned integers that are 8 bits long. It is
    almost identical to sbyte. The only difference is that byte can never be negative.

    +   SHORT – These integers are signed and 16-bits long.

    +   USHORT – These are signed integers whose length is 16 bits.

    +   INT – This is probably the most popular data type in C#. Programmers use this
    data type because it is perfectly compatible with 32-bit processors and big enough
    for typical computations. It is a signed integer whose length is 32 bits.

    +   UINT – This 32-bit integer is unsigned. Thus, it can only be positive.

    +   LONG – This integer is 64 bits long. It can be either positive or negative.

    +   ULONG – This is similar to “long” integers. The only difference is that “ulong”
    can only assume positive values.


    # Strings


    A string is a set or sequence of characters. C# requires you to use “string” (i.e.
    a keyword) when declaring values that belong to this data type. You have to write
    each string between a pair of quotation marks. This language allows you to perform
    various operations on'
