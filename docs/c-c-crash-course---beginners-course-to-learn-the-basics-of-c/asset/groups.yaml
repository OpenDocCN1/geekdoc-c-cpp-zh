    \ condition; update_statement)\n{\n    for (initializing_fragment; condition;\
    \ update_statement)\n    {\n        statements\n    }\n}\n```\n\nHere, the program\
    \ runs the initial “for” loop, executes its body, and triggers the nested loop.\
    \ The program will check the second loop’s condition and execute the codes inside\
    \ it until the evaluation becomes false. Then, the program will make the necessary\
    \ adjustments on the loops’ counters. The program will repeat the entire process\
    \ until all of the conditions evaluate to false.\n\n## Chapter 8: The Methods\
    \ of the C# Language\n\nThis chapter will focus on the C# methods. Here, you’ll\
    \ learn how to declare and utilize methods in your own programs. You need to memorize\
    \ the lessons contained in this chapter if you want to be an effective C# programmer\
    \ in just 7 days.\n\n### Methods – The Basics\n\nFor most programmers, methods\
    \ are core aspects of any program. Methods can solve problems, accept user inputs\
    \ (known as parameters), and produce results.\n\nMethods complete their tasks\
    \ by representing the data conversions done by the program. Additionally, methods\
    \ are the areas where the actual processes are completed. This is the main reason\
    \ why C# programmers consider methods as the basic units of any computer program.\n\
    \n### The Benefits Offered by Methods\n\nIn this section, you’ll discover the\
    \ major benefits offered by C# methods. After reading this material, you’ll know\
    \ why you should use these tools in writing your programs.\n\n### Better Structure\
    \ and Code Readability\n\nProgramming experts claim that you should use methods\
    \ while writing computer programs. Methods, even the simplest ones, can improve\
    \ the structure and readability of your C# codes.\n\nHere’s an important fact\
    \ that you need to know: programmers spend 20% of their time on writing and checking\
    \ their computer program. The remaining 80% is spent on maintaining and improving\
    \ the software. Obviously, you’ll have an easy time working on your program if\
    \ your codes are readable and well-structured.\n\n### Prevention of Redundant\
    \ Codes\n\nMethods can help you avoid redundant codes in your programs. Redundant\
    \ or duplicated codes often produce undesirable results in computer applications.\n\
    \n### Better Code Repetition\n\nThis benefit is closely related to the previous\
    \ one. If your program needs to use a certain code fragment multiple times, it’s\
    \ an excellent idea to transfer the said fragment into a C# method. You can invoke\
    \ methods multiple times, which means you can repeat important codes without retyping\
    \ them.\n"
  mdcn: "\n循环的区别在于，前者在循环体运行之后才分析布尔值。因此，即使布尔表达式为 false，你也可以放心，你的代码至少会运行一次。以下是 do-while\
    \ 循环的语法：\n\n```csharp\ndo\n{\n    statements;\n} while (Boolean expression)\n\
    ```\n\ndo-while 循环遵循这样的模式：\n\n![](img/e2e831cc76860601d1e5511399855ee6_43_0.png)\n\
    \n程序会先执行循环体内的所有语句，然后检查条件（即布尔表达式）。如果条件评估为 true，程序将再次执行循环体，并进行“值检查”。这个过程会持续进行，直到条件变为\
    \ false。因此，如果你设置的条件始终评估为 true，你的代码可能会永远运行。\n\n## For 循环\n\n一般来说，for 循环比 do-while\
    \ 循环和 while 循环更复杂。然而，for 循环可以帮助你用更少的 C# 代码完成困难的任务。for 循环的语法如下：\n\n```csharp\n\
    for (initializer; Boolean_expression; update)\n{\n    the_loop’s_body;\n}\n```\n\
    \nfor 循环包含一个初始化器（即计数器的初始值）、一个布尔表达式、一条更新计数器的 C# 语句，以及循环体。\n\n“计数器”（即赋给循环的初始值）是\
    \ for 循环最显著的特征。在大多数情况下，计数器的值会一直增加，直到达到最终值（例如 1 到 10）。此外，程序员通常知道 for 循环将迭代多少次。\n\
    \n你可以在 for 循环中包含一个或多个变量。这些变量可以按降序或升序移动。编写程序时，你可以在单个 for 循环中组合升序和降序变量。此外，升序变量可以从\
    \ 1 到 1024，因为 for 循环支持算术运算（例如加法、乘法等）。\n\n重要提示：for 循环的所有部分都是可选的。你可以在语法中留空来创建无限\
    \ for 循环。示例如下：\n\n```csharp\nfor ( ; ; )\n{\n    // Loop body\n}\n```\n\n现在，你可以准备进一步了解\
    \ for 循环的不同部分了。\n\n### 初始化\n\nfor 循环可以包含一个初始化片段：\n\n```csharp\nfor (double sample\
    \ = 1; ...; ...)\n{\n    // You can use the “sample” variable here.\n}\n// You\
    \ can’t use the variable here.\n```\n\nC# 程序在运行 for 循环之前会执行该片段一次。通常，程序员使用初始化片段来创建计数器（也称为“循环变量”）并为其赋初始值。该计数器在循环体内可用。C#\
    \ 允许你使用单个初始化片段声明多个变量。\n\n### 条件\n\n显然，for 循环需要一个条件表达式。示例如下：\n\n```csharp\nfor\
    \ (double sample = 1; sample < 5; ...)\n{\n    // This is the loop's body.\n}\n\
    ```\n\n计算机在执行循环体之前会评估条件表达式。如果结果为“true”，循环体将运行；否则，程序将跳转到当前循环之后编写的语句。\n\n### 更新语句\n\
    \n这是 for 循环的最后一部分。基本上，更新语句会更新循环的计数器。让我们使用上面给出的代码片段：\n\n```csharp\nfor (double\
    \ sample = 10; sample > 1; sample--)\n{\n    // This is the loop's body.\n}\n\
    ```\n\n程序会在运行循环体后执行此部分。请记住，该语句会更新计数器的值。\n\n### 循环体\n\n这部分包含 C# 语句。它可以使用你在循环初始化片段中声明的变量。请看下面的示例：\n\
    \n```csharp\nfor (double sample = 10; sample > 1; sample--)\n{\n    System.Console.WriteLine(sample);\n\
    }\n```\n\n### continue 运算符\n\n在某些情况下，你需要停止当前迭代，而不结束循环本身。你可以使用名为“continue”的 C#\
    \ 运算符来完成此任务。下面给出的示例将说明该运算符的工作原理：\n\n```csharp\nint n = int.Parse(Console.ReadLine());\n\
    int sum = 0;\nfor (int i = 1; i <= n; i += 2)\n{\n    if (i % 7 == 0)\n    {\n\
    \        continue;\n    }\n    sum += i;\n}\nConsole.WriteLine(\"sum = \" + sum);\n\
    ```\n\n这段代码计算 1 到 n 范围内所有被 7 除后有余数的奇数之和。\n\n### “foreach” 循环\n\n就在最近，C# 引入了“foreach”循环（即扩展的“for”循环）的概念。这种循环概念在其他编程语言中也可用，例如\
    \ C、VB、C++、PHP 等。使用此编程工具，你可以遍历列表、数组或其他值组中的所有元素。“foreach”循环会获取所有现有元素，即使在非索引数据组中也是如此。\n\
    \n编写此类循环时，请使用以下语法：\n\n```csharp\nforeach (type name_of_variable in name_of_group)\n\
    {\n    the_statements;\n}\n```\n\n如你所见，这种循环比典型的“for”循环简单得多。“foreach”循环可以帮助你快速扫描集合中的所有对象。无数程序员在编写代码时使用这种循环也就不足为奇了。\n\
    \n### 嵌套 for 循环\n\nC# 允许你将一个“for”循环放在另一个“for”循环内部。位于代码最内层的循环运行次数最多。而最外层的循环重复次数最少。嵌套\
    \ for 循环时，应使用以下语法：\n\n```csharp\nfor (initializing_fragment; condition; update_statement)\n\
    {\n    for (initializing_fragment; condition; update_statement)\n    {\n     \
    \   statements\n    }\n}\n```\n\n这里，程序运行初始的“for”循环，执行其循环体，并触发嵌套循环。程序将检查第二个循环的条件，并执行其中的代码，直到评估结果为\
    \ false。然后，程序将对循环的计数器进行必要的调整。程序将重复整个过程，直到所有条件的评估结果都为 false。\n\n## 第 8 章：C# 语言的方法\n\
    \n本章将重点讨论 C# 方法。在这里，你将学习如何在自己的程序中声明和使用方法。如果你想在短短 7 天内成为一名高效的 C# 程序员，就需要牢记本章的内容。\n\
    \n### 方法 —— 基础知识\n\n对大多数程序员来说，方法是任何程序的核心部分。方法可以解决问题、接受用户输入（称为参数）并产生结果。\n\n方法通过表示程序完成的数据转换来完成任务。此外，方法还是实际处理过程完成的区域。这就是\
    \ C# 程序员将方法视为任何计算机程序基本单元的主要原因。\n\n### 方法带来的好处\n\n在本节中，你将了解 C# 方法带来的主要好处。阅读完这些内容后，你就会明白为什么在编写程序时应该使用这些工具。\n\
    \n### 更好的结构和代码可读性\n\n编程专家声称，在编写计算机程序时应该使用方法。即使是最简单的方法，也能提高 C# 代码的结构和可读性。\n\n这里有一个你需要了解的重要事实：程序员将\
    \ 20% 的时间花在编写和检查计算机程序上。剩余的 80% 则用于维护和改进软件。显然，如果你的代码可读性强且结构良好，那么你在程序上工作起来就会轻松。\n\
    \n### 防止冗余代码\n\n方法可以帮助你避免程序中的冗余代码。冗余或重复的代码通常会在计算机应用程序中产生不良结果。\n\n### 更好的代码复用\n\
    \n这一好处与上一点密切相关。如果你的程序需要多次使用某个代码片段，那么将该片段转移到 C# 方法中是一个绝佳的主意。你可以多次调用方法，这意味着你无需重新键入即可重复使用重要的代码。\n"
