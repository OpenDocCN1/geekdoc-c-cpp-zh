    Important Note: Lines that begin with two forward slashes (i.e. //) are “comments”.
    In programming, comments are descriptive text added to the code to improve its
    readability. Language compilers ignore these lines. Thus, comments won’t affect
    the functionality of your computer programs.


    # Values and References


    C# programmers divide data types into two categories: value types and reference
    types.


    A value type exists inside the execution stack of a program. Additionally, it
    holds the value stored by the programmer. The Value Type category consists of
    the Booleans, Characters, and Integers. The memory assigned to these data types
    becomes available once the program finishes its code execution. For instance,
    the variables within the Main() method of your program will be emptied once the
    program is closed.


    A reference type, on the other hand, stores an address (i.e. a reference) in the
    program’s stack. This address points to the location of the needed value. Basically,
    a reference type assigns dynamic memory during its declaration. It also frees
    up some memory once the program no longer needs it.


    # The Literals


    Literals are the values specified in a program’s source code. The example given
    below will illustrate this idea:


    ```

    bool isitdelicious = false;

    short income = 22000;

    char firstletter = ‘c’;

    byte ten = 10;

    int prize = 250000;

    ```


    In this example, the literals are false, 22000, ‘c’, 10 and 250000. These are
    values that you’ll add directly to the program’s code.


    # The Different Kinds of Literals


    C# supports the following kinds of literals:


    +   - Real

    +   - Integer

    +   - String'
  - '[PAGE 17]


    +   - Character

    +   - Boolean


    Let’s discuss each of these literals in detail:


    # Real


    A real literal has a sign (i.e. + or -), a suffix, a prefix, and a decimal point.
    You should use this kind of literal for double, float, and decimal values. C#
    allows you to write real literals in their exponent form. Here are the suffixes
    that you can apply on real literals:


    +   - F – This suffix represents float values.

    +   - D – Use this suffix to indicate double values.

    +   - M – This letter indicates decimal values.

    +   - E – Use this letter for exponential values. For instance, “e4” means you
    need to multiply the integer by 10⁴.


    # Integer


    An integer literal consists of a prefix, a suffix, a sign (i.e. + or -), and a
    set of digits. You can use prefixes to add numbers in your code as decimals or
    hexadecimals. Here are the prefixes and suffixes that you can use in C#:


    +   - 0X (e.g. 0XA6F2) – Use this prefix to indicate a hexadecimal value.

    +   - U (e.g. 119U) – This suffix represents unsigned int (uint) or unsigned long
    (ulong) values.

    +   - L (e.g. 360L) – Use this suffix for “long” values.


    Important Note: C# will tag integer literals as “int” if you won’t use any suffix.
    Also, the letters (i.e. L, U and X) are not case-sensitive.


    # String


    Use this literal for string values. Basically, a string literal is a set of characters
    placed within a pair of double quotes (e.g. “sample”).


    Important Note: In the C# language, you may use the “@” symbol to create quoted
    (or verbatim) strings. Programmers use these strings for naming file paths.


    # Character


    A character literal is a single character enclosed by a pair of single quotes
    (e.g. ‘z’) Use character literals to set values that belong to the “char” type.
    Additionally, you may write a character literal as:


    +   - a single character (e.g. ‘X’)

    +   - a code for a special character (e.g. ‘\u0067’)

    +   - an escape code (see below)'
  - '[PAGE 18]


    Escape Codes – These are special character sequences that add characters to your
    source code. In general, the characters involved here cannot be added straight
    to the program’s codes.


    C# prevents you from adding some characters straight to your programs. Some of
    these characters are: tabs, newlines, backslashes, quotation marks, etc. The following
    list will show you the most popular escape codes in C#:


    +   - \ – Newline Character

    +   - \t – Tab Character

    +   - \'' – Single Quotation Mark

    +   - \" – Double Quotation Mark


    # Boolean


    There are only two types of Boolean literals: true and false. You can only assign
    one of these values when working with a “bool” (i.e. Boolean) variable. The code
    snippet given below will show you how to declare a Boolean literal:


    ```

    bool answer = false;

    ```'
