    \        System.Console.WriteLine(--e);\n\n        // This is an example.\n  \
    \  }\n}\n```\n\n编译并执行该代码后，你将在命令提示符上看到以下内容：\n\n![](img/e2e831cc76860601d1e5511399855ee6_21_0.png)\n\
    \n### 二进制运算符\n\n这些运算符作用于二进制数。在 IT 世界中，所有信息都表示为零和一的序列。这意味着如果你想成为一名成功的程序员，就需要掌握二进制运算符。\n\
    \n二进制运算符的工作方式与逻辑运算符完全相同。实际上，你可能会认为二进制运算符和逻辑运算符使用不同的输入但执行相同的过程。逻辑运算符使用布尔值来产生结果。另一方面，二进制运算符作用于以二进制数字表示的数字。以下是使用\
