    The C# language prevents programmers from using operators on strings values. Obviously,
    you can’t perform arithmetic operations on actual words (e.g. fish – dog, power
    * humans, land / people, etc.). However, C# allows you to concatenate (i.e. combine)
    multiple string objects to generate a new one. You can do this by using the “+”
    symbol on your strings. The example given below will illustrate this idea.


    ```

