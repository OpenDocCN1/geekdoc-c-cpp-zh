    \n实际上，你不必直接使用 Console.In。“Console”类提供了两个方法（即 Console.ReadLine 和 Console.Read），它们与\
    \ Console.In 配合工作。你可以使用这些方法从命令提示符读取数据。\n\n### Console.ReadLine 方法\n\n此方法为希望从控制台读取数据的人提供了简单性和便利性。调用此方法时，程序将停止并等待用户输入。然后，用户可以输入一个字符或字符串，并按“Enter”。按下\
    \ Enter 键，用户就通知程序他们已经输入了所需的输入。Console.ReadLine 方法将读取用户的输入，其名称也由此而来。\n\n下面给出的代码展示了\
    \ Console.ReadLine 如何工作：\n\n```csharp\nclass Test\n{\n    static void Main()\n\
    \    {\n        System.Console.WriteLine(\"What is your first name? \");\n   \
    \     string yourfirstName = System.Console.ReadLine();\n\n        System.Console.WriteLine(\"\
    Please enter your last name? \");\n        string yourlastName = System.Console.ReadLine();\n\
    \n        System.Console.WriteLine(\"Hi, {0} {1}!\", yourfirstName, yourlastName);\n\
    \    }\n}\n```\n\n如果你在命令提示符中输入“John”和“Smith”，你将看到以下消息：\n\n![](img/e2e831cc76860601d1e5511399855ee6_29_0.png)\n\
    \n### Console.Read 方法\n\nConsole.Read 和 Console.ReadLine 之间存在显著差异。首先，Console.Read\
    \ 仅读取单个字符，而 Console.ReadLine 读取整个表达式。其次，Console.Read 返回的是代码，而不是所接受的输入。如果你希望将输出用作普通字符，应执行以下操作之一：\n\
    \n- 将输出转换为字符\n- 对结果使用 Convert.ToChar 方法\n\n重要说明：只有当用户按下“Enter”时，Console.Read 才会读取一个字符。当用户按下此键时，程序会将输入传输到标准输入缓冲区，并调用\
    \ Console.Read 方法。请查看下面给出的示例：\n\n```csharp\nclass UsingRead\n{\n    static void\
    \ Main()\n    {\n        int codeRead = 0;\n        do\n        {\n          \
    \  codeRead = Console.Read();\n            if (codeRead != 0)\n            {\n\
    \                Console.Write((char)codeRead);\n            }\n        }\n  \
    \      while (codeRead != 10);\n    }\n}\n```\n\n### 如何读取数字\n\nC# 程序不直接读取数字。它们需要将输入作为字符串接收（即通过\
    \ Console.ReadLine 方法），然后将其转换为数字。将字符串转换为其他数据类型的过程称为解析。C# 语言中的所有基元数据类型都支持此过程。\n\
    \n## 控制台输出\n\n本书的这一部分将重点介绍两个方法：Console.WriteLine 和 Console.Write。这两个方法都可以打印 C#\
    \ 语言中的所有数据类型。这意味着你可以使用它们在用户控制台上显示消息。\n\n以下代码片段将教你这些方法如何工作：\n\n```csharp\nConsole.WriteLine(\"\
    I want to learn the C# programming language.\");\n// This line will print the\
    \ string inside the parentheses.\n\nConsole.WriteLine(100);\n// This line will\
    \ show \"100\" on the user’s command prompt.\n\nConsole.WriteLine(3.14);\n// This\
    \ line will print the double value 3.14 on the user’s console.\n```\n\n你可以使用 Console.WriteLine\
    \ 方法在用户屏幕上显示不同类型的数据。这是因为 Console 类为每种数据类型都有一个内置版本。\n\nConsole.WriteLine 和 Console.Write\
    \ 之间的唯一区别是，前者打印括号内的值并在控制台上添加换行符，而后者仅显示括号内的信息。因此，在代码中使用 Console.WriteLine 就像在显示消息后按下“Enter”键（即光标将移到下一行）。\n\
    \n## 字符串拼接\n\nC# 语言阻止程序员对字符串值使用运算符。显然，你不能对实际单词执行算术运算（例如 fish - dog、power * humans、land\
    \ / people 等）。但是，C# 允许你连接（即组合）多个字符串对象以生成新字符串。你可以通过在字符串上使用“+”符号来实现。下面给出的示例将说明这一概念。\n\
    \n```csharp\nstring gadget = \"smartphone\";\nstring example = \"I use my \" +\
    \ gadget + \" to access \" + \"the internet.\";\nConsole.WriteLine(example);\n\
    ```\n\n如果你执行该代码，控制台将显示：\n\nI use my smartphone to access the internet.\n\n## 第\
    \ 6 章：C# 的条件语句\n\n本章将教你如何在 C# 代码中使用条件语句。基本上，条件语句是一个代码块，允许你根据指定的条件执行各种操作。请仔细阅读本材料，因为它包含有价值的信息，可以帮助你在短短\
    \ 7 天内掌握 C#。\n\n### 运算符\n\n在本节中，你将了解有关 C# 比较运算符的更多信息。这些运算符极其重要：它们可以帮助你为自己的条件语句设置条件。\n\
    \n### 比较运算符\n\nC# 具有不同的运算符，可用于比较相同类型的值。这些运算符是：\n\n- `<`\n- `>`\n- `<=`\n- `>=`\n\
    - `!=`\n- `==`\n\n你可以使用上述运算符来比较 C# 表达式（例如两个整数、两个变量、两个常量等）。使用这些运算符时，结果始终为布尔值。分析以下示例：\n\
    \n```csharp\nint height = 170;\nConsole.WriteLine(height < 180); // This will\
    \ give you \"true\".\n\nstring gender = \"Male\";\nConsole.WriteLine(gender ==\
    \ \"Female\"); // This will give you \"false\".\n\ndouble valueofPi = 3.14;\n\
    Console.WriteLine(valueofPi > 100); // This will give you \"false\".\n```\n\n\
    ### 逻辑运算符\n\nC# 还支持一些逻辑运算符。程序员使用这些运算符来创建布尔（也称为“逻辑”）语句。让我们详细讨论每个逻辑运算符：\n\n### AND\
    \ 和 OR 运算符\n\n你只能在涉及布尔值的表达式上使用逻辑 AND（即 &&）和逻辑 OR（即 ||）运算符。如果两个操作数都为 true，逻辑 AND\
    \ 运算符将返回“true”。例如：\n\n```csharp\nbool sample = (1 < 2) && (10 == 10);\n```\n\n\
    由于 1 小于 2 且 10 等于 10，该表达式将返回 true。由于逻辑 AND 运算符无需执行不必要的分析即可快速给出结果，程序员将其称为“短路运算符”。它首先检查语句的左侧部分。如果求值结果为“false”，操作将立即停止。由于其中一个操作数为\
    \ false，该表达式不可能再为 true。\n\n另一方面，如果至少一个操作数的求值结果为 true，逻辑 OR（即 ||）运算符将返回 true。例如：\n\
    \n```csharp\nbool sample = (1 < 2) || (10 > 100);\n```\n\n此示例将返回 true，因为左侧操作数为\
    \ true。逻辑 OR 运算符也是“短路运算符”，因为它甚至无需检查整个 C# 语句就能给出结果。在当前示例中，逻辑 OR 将不再分析第二个操作数，因为第一个操作数已经为\
    \ true。因此，条件已经满足。\n\n### 异或和求反运算符\n\n异或（即 ^）是一种全回路运算符，因为它在给出结果之前需要检查两个操作数。仅当其中一个操作数的求值结果为\
    \ true 时，它才会返回 true。因此，如果两个操作数都为 true，你将得到 false。请查看以下示例：\n\n```csharp\nbool sample\
    \ = (1 < 2) ^ (2 == 2);\n```\n\n由于这两个表达式都为 true，异或将返回 false。\n\n然而，求反运算符（即 !）只是反转其所附加的布尔值。例如：\n\
    \n```csharp\nbool sample = !(1 < 2);\n```\n\n1 小于 2。但是，由于“!”附加到布尔表达式上，结果将被反转。这意味着该表达式的求值结果为“false”。\n"
