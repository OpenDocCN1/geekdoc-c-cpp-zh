    \n### 使用控制台\n\n有时，控制台是用户-程序交互最重要的工具。例如，在创建简单的计算机程序时，您需要使用控制台。这些程序要求您专注于必须修复的问题。漂亮的\
    \ GUI（即图形用户界面）和有吸引力的输出不会帮助您完成此任务。\n\n您还可以使用控制台在将其添加到复杂程序之前尝试一个小的代码块。由于控制台是一个简单的工具，您可以轻松地隔离代码块，而无需按任何按钮或查看不同的屏幕。控制台只需几秒钟就能为您提供所需的结果。\n\
    \n### 访问控制台\n\n访问控制台的过程取决于您当前使用的操作系统。例如，如果您使用的是 Windows 计算机，则需要执行以下步骤：\n\n- 1.\
    \ 单击“开始”按钮。\n- 2. 单击“程序”并选择“附件”。\n- 3. 单击显示“命令提示符”的选项。\n\n控制台将显示您的主目录，由您的用户名表示。下面示例中的用户名是\
    \ SARAH：\n\n![](img/e2e831cc76860601d1e5511399855ee6_26_0.png)\n\n重要提示：如果您使用的是\
    \ Windows Vista、Windows 7 或 Windows 8，您可以通过搜索“cmd”来启动控制台。\n\n### 有关控制台的附加信息\n\n\
    控制台是一个显示基于文本信息的黑色窗口。它有一个闪烁的光标并显示字符字符串。如您所见，每次输入一个字符时，光标都会移动。\n\nWindows 程序可以是基于桌面的、基于浏览器的、基于互联网的或基于控制台的。基于控制台的程序利用控制台进行输入和输出处理。另一方面，基于桌面的程序依赖其\
    \ GUI 进行用户-程序交互。本书侧重于基于控制台的应用程序，因此您将使用键盘输入数据，并将在命令提示符中看到结果。\n\n某些基于控制台的应用程序要求用户提供文本、数字、字符等。这意味着在使用基于控制台的程序时，您经常会使用键盘。\n\
    \n### 基本命令\n\n在本节中，您将学习使用命令提示符发出的基本命令。如果您想成为一名优秀的 C# 程序员，您应该仔细学习这些材料。\n\n### 控制台命令\n\
    \n- `cd name_of_directory` – 此命令允许您更改活动目录。例如，如果您想进入 C: 内的 Users 文件夹，您需要发出以下命令：`cd\
    \ C:\\Users`\n- `<｜｜begin▁of▁sentence｜｜>#include <stdio.h>` – 使用此命令查看活动目录中的文件。\n\
    - `rmdir name_of_directory` – 此命令允许您删除目录。例如，`rmdir Sample` 删除名为“Sample”的目录。\n\
    - `mkdir name_of_directory` – 使用此命令，您可以在活动目录内创建新目录。例如，如果您当前位于 Users 目录中，`mkdir\
    \ John` 将在“Users”内创建名为“John”的文件夹。\n- `type name_of_file` – 使用此命令查看现有文件的内容。例如，您可以发出\
    \ `type HelloCSharp.cs` 来查看该 .cs 文件的内容。\n\n### 标准 I/O\n\n标准 I/O 系统是为 UNIX 计算机开发的机制。该系统涉及用于接受输入和产生输出的特殊设备。\n\
    \n如果程序正在等待用户执行操作或提供信息，控制台将显示一个光标。这意味着系统处于“等待模式”。\n\n### 输入和输出\n\n操作系统需要为用户-程序交互定义标准\
    \ I/O 机制。启动基于控制台的应用程序时，程序初始化块中的代码需要与操作系统分配的 I/O 机制一起工作。此代码允许用户与所涉及的基于控制台的程序进行交互。\n\
    \n由于此代码，程序可以从“Console.In”（即 C# 的标准输入流）读取用户的输入，将信息发送到“Console.Out”（即 C# 的标准输出流），并通过“Console.Error”（即\
    \ C# 的标准错误消息流）报告问题情况。\n\n重要提示：您将在本书后面学习 C# 流。本章将集中讨论与 C# I/O 机制相关的概念和思想。\n\n###\
    \ I/O 设备\n\n某些程序接受非键盘输入。例如，您可以创建一个从文本文件、条形码阅读器、麦克风和其他数据源获取输入的 C# 程序。A\n"
