    # Chapter 4: Data Type Conversion


    In general, an operator works on arguments that belong to the same type. However,
    the C# language offers a wide range of data types that you can use for certain
    situations. To conduct any process on variables that belong to different types,
    you should convert one of those variables first. In C#, data type conversion can
    be implicit or explicit.


    Each C# expression has a data type. This data type results from the literals,
    variables, values, and structures used inside the expression. Basically, you might
    use an expression whose type is incompatible for the situation. When this happens,
    you’ll get one of these results:


    +   - The program will give you a compile-time error.

    +   - The program will perform an automated conversion. That means the program
    will get the right expression type.


    Converting an “s” type to “t” type allows you to treat “s” as “t” while running
    your program. Sometimes, this process requires the programmer to validate the
    type conversion. Check the examples below:


    +   - Converting “objects” to “strings” will need verification during the program’s
    runtime. This verification ensures that you really want to use the values as strings.

    +   - Converting “string” values to “object” values doesn’t need any validation.
    That’s because the “string” type is a branch of the “object” type. You can convert
    strings to their “parent” class without losing data or getting any error.

    +   - You won’t have to perform verification while converting int values to long
