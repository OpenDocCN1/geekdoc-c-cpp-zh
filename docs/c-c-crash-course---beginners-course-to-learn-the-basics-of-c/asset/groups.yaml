  md: "\nThe “long” data type covers all of the possible values of the “int” type.\
    \ That means the data can be transformed without any error.\n\n- Converting “double”\
    \ values to “long” values involves validation. You might experience loss of data,\
    \ depending on the values you’re working on.\n\nImportant Note: C# has certain\
    \ restrictions when it comes to changing data types. Here are the possible type\
    \ conversions supported by this language:\n\n### Explicit Conversion\n\nUse this\
    \ conversion if there’s a chance of information loss. For instance, you’ll experience\
    \ information loss while converting floating-point values to integer values (i.e.\
    \ the fractional section will disappear). You might also lose some data while\
    \ converting a wide-range type to a narrow-range type (e.g. long-to-int conversion,\
    \ double-to-float conversion, etc.). To complete this process, you need to use\
    \ the “type” operator. Check the examples below:\n\n```csharp\nclass Example\n\
    {\n    static void Main()\n    {\n        double yourDouble = 2.1d;\n        System.Console.WriteLine(yourDouble);\n\
    \n        long yourLong = (long)yourDouble;\n        System.Console.WriteLine(yourLong);\n\
    \n        yourDouble = 2e9d;\n        System.Console.WriteLine(yourDouble);\n\n\
    \        int yourInt = (int)yourDouble;\n        System.Console.WriteLine(yourInt);\n\
    \    }\n}\n```\n\nIf compiled and executed correctly, that program will give you\
    \ these results:\n\n```\n2.1\n2\n2000000000\n2000000000\n```\n\n### Implicit Conversion\n\
    \nYou can only perform this conversion if data loss is impossible. This conversion\
    \ is referred to as implicit because it doesn’t require any operator. The C# compiler\
    \ will perform implicit conversion whenever you assign narrow-range values to\
    \ variables that have a wide-range.\n\n### String Conversion\n\nC# allows you\
    \ to convert any data type to “string”. The compiler will perform this conversion\
    \ process automatically if you will use “+” and at least one non-string argument.\
    \ Here, the non-string argument will become a string and the “+” operator will\
    \ produce a new value.\n\n## Chapter 5: The Console\n\nThis chapter will teach\
