    \ = \"Thank you.\";\n```\n\n### Logical Operators\n\nA logical (also known as\
    \ “Boolean”) operator accepts and returns Boolean values (i.e. true or false).\
    \ Here are the four logical operators of C#:\n\n- “&&” – Programmers refer to\
    \ this operator as “Logical AND”. It will give you “true” if both of the operands\
    \ are true.\n- “^” – This is known as the “Exclusive OR” operator. It will give\
    \ you true if one of the operands is true.\n- “||” – This is the “Logical OR”\
    \ operator. You will get true if at least one of the operands is true.\n- “!”\
    \ – This operator, known as the “Logical Negation” operator, reverses the value\
    \ of an operand.\n\nThe following code will show you how to use these operators:\n\
    \n```\nclass Test\n{\n    static void Main()\n    {\n        bool x = true, y\
    \ = false;\n\n        System.Console.WriteLine(x && y);\n        System.Console.WriteLine(x\
    \ || y);\n        System.Console.WriteLine(!x);\n        System.Console.WriteLine(x\
    \ ^ y);\n\n        // This is an example.\n    }\n}\n```\n\nOnce you have compiled\
    \ and run this code, you will see the following results:\n\n![](img/e2e831cc76860601d1e5511399855ee6_20_0.png)\n\
    \n### Arithmetic Operators\n\nThese operators help you in performing math operations.\
    \ This category consists of the following operators:\n\n- “+” – Use this operator\
    \ to perform addition using two values (e.g. `int x = 1 + 1`)\n- “-” – This operator\
    \ allows you to perform subtraction in your codes. It deducts the value of the\
    \ right operand from that of the left operand (e.g. `int x = 2 - 1`)\n- “*” –\
    \ With this operator, you can multiply the values of two operands (e.g. `int r\
    \ = 6 * 6`)\n- “/” – Use this operator to divide number values in your C# codes.\
    \ Basically, “/” divides the value of the left-hand operand by that of the right-hand\
    \ operand.\n- “++” – This is known as the “increment operator”. It increases the\
    \ value of an operand by one. Unlike the ones discussed above, this operator works\
    \ on a single operand. Also, you may write it before or after the operand. (e.g.\
    \ 99++, 1++, ++5, etc.)\n- “--” – This operator is the exact opposite of the increment\
    \ operator. You can use it to decrease an operand’s value by one. You may write\
    \ it before or after the operand you want to modify.\n\nThe code given below will\
    \ show you how these operators work:\n\n```csharp\nclass Test\n{\n    static void\
    \ Main()\n    {\n        double d = 100, e = 3;\n\n        System.Console.WriteLine(d\
    \ + e);\n        System.Console.WriteLine(d - e);\n        System.Console.WriteLine(d\
    \ / e);\n        System.Console.WriteLine(d * e);\n        System.Console.WriteLine(++d);\n\
    \        System.Console.WriteLine(--e);\n\n        // This is an example.\n  \
    \  }\n}\n```\n\nOnce you compile and execute that code, you’ll see this on your\
    \ command prompt:\n\n![](img/e2e831cc76860601d1e5511399855ee6_21_0.png)\n\n###\
    \ Binary Operators\n\nThese operators work on binary numbers. In the IT world,\
    \ all of the information is expressed as a sequence of zeros and ones. That means\
    \ you need to master binary operators if you want to be a successful programmer.\n\
    \nA binary operator works exactly like a logical one. Actually, you may think\
    \ that binary and logical operators use different inputs but conduct the same\
    \ processes. A logical operator uses Boolean values to produce results. A binary\
    \ operator, on the other hand, works on numbers presented as binary digits. Here\
    \ are the binary operators you’ll encounter while using C#:\n\n- “&” – This is\
    \ called “Binary AND”. It indicates the position/s where both of the operands\
    \ have “1”.\n- “^” – Programmers refer to this operator as “Binary Exclusive OR”.\
    \ It will place “1” in each position where the values are different.\n- “|” –\
    \ This is the “Binary OR” operator. It indicates the position/s where any of the\
    \ operands has “1”.\n- “~” – This acts as the negation operator for binary values.\
    \ Just like “!”, it reverses the current value of a variable.\n- “<<” – This is\
    \ the “Binary Left Shift” operator. It moves the bits of a binary number to the\
    \ left. This movement depends on the value that you’ll assign (e.g. 4 << 1, 4\
    \ << 3, 4 << 2, etc.).\n\n### Comparison Operators\n\nThese operators allow you\
    \ to compare the values inside two operands. Each of these operators gives a Boolean\
    \ value as the final output. Here are the comparison operators of the C# language:\n\
    \n- “==” – This is the Equality operator. It checks whether the two operands are\
    \ equal (e.g. `x == y`)\n- “>” – This operator checks whether the left-hand operand’s\
    \ value is greater than that of the right-hand operand (e.g. `x > y`).\n- “<”\
    \ – This operator compares the values of the two operands. It will give you “true”\
    \ if the left-hand operand’s value is less than that of the right-hand operand\
    \ (e.g. `y < x`).\n- “>=” – With this operator, you can determine whether the\
    \ value of the left-hand operand is greater than or equal to that of the right-hand\
    \ operand.\n- “<=” – This operator will give you true if the value of the left-hand\
    \ operand is less than or equal to that of the right-hand operand.\n- “!=” – Use\
    \ this operator to check the equality of two operands. It will give you true if\
    \ the values are not equal (e.g. `x != y`).\n\n### Conditional Operator\n\nC#\
    \ users refer to “?” as the conditional operator. Basically, this operator uses\
    \ the result of a Boolean expression to determine which statement should be processed.\
    \ This is called “ternary operator” because it works on three operands. Here,\
    \ the first value should be Boolean, while the remaining values need to belong\
    \ to the same data type (e.g. characters, strings, numbers, etc.).\n\nThe syntax\
    \ of this operator is:\n\n```\nfirst_operand ? second_operand : third_operand;\n\
    ```\n\nHere’s how it works: If “first_operand” is true, the program will work\
    \ on “second_operand”. If “first_operand” is false, however, the program will\
    \ work on “third_operand”.\n\n## Chapter 4: Data Type Conversion\n\nIn general,\
    \ an operator works on arguments that belong to the same type. However, the C#\
    \ language offers a wide range of data types that you can use for certain situations.\
    \ To conduct any process on variables that belong to different types, you should\
    \ convert one of those variables first. In C#, data type conversion can be implicit\
    \ or explicit.\n\nEach C# expression has a data type. This data type results from\
    \ the literals, variables, values, and structures used inside the expression.\
    \ Basically, you might use an expression whose type is incompatible for the situation.\
    \ When this happens, you’ll get one of these results:\n\n- The program will give\
    \ you a compile-time error.\n- The program will perform an automated conversion.\
    \ That means the program will get the right expression type.\n\nConverting an\
    \ “s” type to “t” type allows you to treat “s” as “t” while running your program.\
    \ Sometimes, this process requires the programmer to validate the type conversion.\
    \ Check the examples below:\n\n- Converting “objects” to “strings” will need verification\
    \ during the program’s runtime. This verification ensures that you really want\
    \ to use the values as strings.\n- Converting “string” values to “object” values\
    \ doesn’t need any validation. That’s because the “string” type is a branch of\
    \ the “object” type. You can convert strings to their “parent” class without losing\
    \ data or getting any error.\n- You won’t have to perform verification while converting\
    \ int values to long values.\n"
