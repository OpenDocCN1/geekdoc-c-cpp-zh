    \ interactions involve standard output (e.g. screen) and/or standard input (e.g.\
    \ keyboard strokes). When combined, these things are called I/O operations. The\
    \ text within the console provides useful data and is a set of characters from\
    \ a computer program.\n\nThe computer’s OS (i.e. operating system) links I/O devices\
    \ to every console program installed on the computer. Most systems tag screens\
