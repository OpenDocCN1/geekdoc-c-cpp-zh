    \n### 它是如何工作的？\n\n此示例程序包含三个部分：\n\n- 1. 类定义；\n- 2. 方法定义；和\n- 3. 方法的内容。\n\n让我们详细讨论每个部分：\n\
    \n*类定义* – 程序的初始行定义了一个名为 HelloCSharp 的类。最基本的类定义有两个部分：（1）单词“class”和（2）新类的名称。在此示例中，HelloCSharp\
    \ 作为类的名称。您将在一对大括号（即 { }）内找到该类的内容。\n\n*方法定义* – 这部分位于程序的第三行。在这里，您定义了一个名为 Main()\
    \ 的方法。所有 C# 程序都使用 main() 方法作为其起点。以下是您需要使用的语法：\n\n```\nstatic void Main(string[]\
    \ args)\n```\n\n如您所见，Main() 必须是 void 且为 static。参数（即括号内的部分）完全可选。这意味着您可以将 Main()\
    \ 函数简化为：\n\n```\nstatic void Main()\n```\n\n**重要提示：** 如果您错误地输入 Main() 方法，程序将无法运行。\n\
    \n*方法的内容* – 您将在方法名称之后找到任何方法的内容。通常，一对大括号包含这些内容。示例程序的第五行使用一个对象（即 System.Console）和一个方法（即\
    \ WriteLine()）在计算机控制台上显示一条消息。如前所述，消息为“Hello, C#!”\n\n**重要提示：** 在处理 Main() 时，您可以根据自己的喜好排列\
    \ C# 表达式和语句。即使您随机排列这些表达式和/或语句，也不会收到任何错误消息。但是，您的完整程序将根据其在方法体内的位置运行这些条目。\n\n###\
    \ 编写代码时需要记住的规则\n\n### C# – 一个区分大小写的计算机语言\n\n该语言区分大小写。这意味着在输入 C# 代码时，您需要小心字母的大小写。基本上，C#\
    \ 将“power”、“Power”和 POWER 视为三个不同的对象。\n\n**重要提示：** 您需要记住此规则。它适用于任何 C# 程序的所有元素（例如变量、常量、类等）。\n\
    \n### 使用正确的格式\n\n您需要在代码中添加制表符、空格和换行符以提高其可读性。这些字符会被 C# 编译器忽略，为源代码提供了良好的结构。\n\n\
    例如，您可以从 HelloCSharp 代码中删除换行符：\n\n```\nclass HelloCSharp{static void Main(){System.Console.WriteLine(\"\
    Hello C#!\");}}\n```\n\n作为替代方案，您可以从中删除制表符：\n\n```\nclass HelloCSharp\n{\n    static\
    \ void Main()\n    {\n        System.Console.WriteLine(\"Hello C#!\");\n    }\n\
    }\n```\n\n最后两个示例在编译和程序执行方面工作正常。但是，它们难以分析、修改、理解和维护。\n\n**重要提示：** 确保您的所有程序都有格式化的代码。这样，您就可以保证代码的可读性。\n\
    \n### 如何正确格式化代码\n\n以下是格式化代码时需要遵循的规则：\n\n- 您可以在类定义内缩进方法。C# 允许您在格式化源代码时使用任意数量的制表符（即按下键盘\
    \ Tab 键后得到的字符）。\n- 您应在方法自身的定义内缩进方法的内容。\n- 将打开的大括号（即 {}）放在其所属的类或方法正下方。最好让它成为该行唯一的字符。\n\
    - 确保关闭大括号（即 }）与打开大括号垂直对齐。\n- 您的类名应以大写字母开头。\n- 您的变量名应以小写字母开头。\n- 您的方法名应以大写字母开头。\n\
    - 缩进写在另一段代码内部的代码。\n\n### 类名\n\n在 C# 中，每个程序都有一个或多个类定义。程序员通常将每个类定义存储在与类名对应的单独文件中。此外，这些文件的扩展名应为“.cs”。您可以将不同的类编译到单个文件中而不会出现任何技术问题。但是，您在浏览代码时会遇到困难。\n\
    \n### 有关 C# 的更多信息\n\nC# 编程语言先进、现代、多用途且面向对象。它与其他语言如 C、C++ 和 Java 有一些相似之处。主要区别在于\
    \ C# 提供更易于编程和简化的语法。\n\nC# 程序有一个或多个 .cs 文件，其中包含数据类型和类定义。您需要编译这些 .cs 文件以获得可执行代码（即以\
    \ .dll 或 .exe 结尾的文件）。例如，如果您编译 HelloCSharp 程序，您将获得一个名为“HelloCSharp.exe”的可执行文件。\n\
    \n### 创建 C# 程序所需的东西\n\n在使用 C# 编写程序之前，您需要两件重要的事情——文本编辑器（例如 Notepad）和 .NET 框架。文本编辑器将帮助您编写和编辑代码。另一方面，.NET\
    \ 框架将帮助您编译和执行程序。\n\n### 什么是 .NET？\n\n基本上，.NET 是一个为计算机程序的开发和执行而设计的框架。大多数现代 Windows\
    \ 系统都将 .NET 作为内置框架。因此，如果您使用的是微软的现代操作系统，就无需在计算机上安装任何软件。\n\n如果您使用的是旧版 Windows 操作系统，则需要先下载\
    \ .NET 框架。您可以访问此网站并获取最新版本的 .NET。\n"
