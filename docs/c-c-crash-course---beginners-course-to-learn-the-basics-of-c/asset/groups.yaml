  - '[PAGE 34]


    programmers refer to it as a “short-circuit operator”. It checks the left section
    of the statement first. If the evaluation is “false”, the operation will immediately
    stop. The expression can no longer be true since one of the operands is false.


    The logical OR (i.e. ||) operator, on the other hand, will give you true if at
    least one of your operands evaluates to true. For instance:


    ```

    bool sample = (1 < 2) || (10 > 100);

    ```


    This example will give you true since the left-hand operand is true. The logical
    OR operator is also a “short-circuit operator”, since it can give a result even
    without checking the entire C# statement. In the current example, logical OR will
    no longer analyze the second operand since the first one is already true. Thus,
    the condition has already been met.


    # The Exclusive OR and Negation Operators


    The exclusive OR (i.e. ^) is a full-circuit operator since it needs to check both
    operands before giving the result. It will give you true ONLY IF one of the operands
    evaluates to true. Thus, you’ll get false if both of the operands are true. Check
    the following example:


    ```

    bool sample = (1 < 2) ^ (2 == 2);

    ```


    Since the two expressions are true, exclusive OR will give you false.


    The negation operator (i.e. !), however, simply reverses the Boolean value to
    which it is attached. For instance:


    ```

    bool sample = !(1 < 2);

    ```


    One is less than two. However, since “!” is attached to the Boolean expression,
    the result will be reversed. That means this expression evaluates to “false”.'
