- img_proc: true
  md: "This report looks correct, but for it to be of any use, we need each of the\
    \ product types to be a hyperlink to the relevant detail HTML file. Because the\
    \ URL changes for every line, we have to use a COMPUTE block to calculate the\
    \ URL and apply it to each line. Our modified code looks like this:\n\n```\nODS\
    \ HTML PATH=\"c:\\temp\" (URL=NONE) body=\"Contents.html\";nPROC REPORT DATA=eprog.as_products;\n\
    \  COLUMN product_type N\n  DEFINE product_type / 'Product Type';\n  DEFINE n\
    \ / 'Number of Products/';\n  COMPUTE BEFORE;\n    counter = 1;\n  ENDCOMP;\n\
    \  COMPUTE product_type;\n    CALL DEFINE [_col\n      'url',cats('prod',counter,'.html'));\n\
    \    counter=counter+1;\n  ENDCOMP;\nRUN;\nODS HTML CLOSE;\n```\n\nThe first compute\
    \ block, COMPUTE BEFORE, is used simply to set a temporary variable called counter\
    \ to one. This is the number we use in building our report linkages.\n\nThe second\
    \ compute block, COMPUTE PRODUCT_TYPE, is where we set up our linkage.\n\nThe\
    \ DEFINE statement sets properties for each column. The CALL DEFINE statement\
    \ is used to alter column definitions as the program runs. We will see another\
    \ example of this in the next section.\n\nThe CALL DEFINE statement changes the\
    \ following attributes:\n\n+   * The column to change. This can be specified by\
    \ using the name in quotes or by specifying the column number. In this case we\
    \ have used_col, which specifies the column compute block is attached to.\n* The\
    \ attribute to be changed. On this occasion, we are changing the URL attribute.\n\
    * The value to change it to. The value is set by concatenating PROD, the counter,\
    \ and .HTML.\n\nFinally, the counter is incremented for the next time around."
  merge: -1
