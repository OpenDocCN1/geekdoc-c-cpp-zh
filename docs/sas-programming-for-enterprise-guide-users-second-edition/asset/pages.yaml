- img_proc: true
  md: '148 SAS Programming for Enterprise Guide Users, Second Edition


    Figure 7.13 Completely customized report break


    | Name | Age | Height | Weight |

    |---|---|---|--|

    | Alice | 13 | 56.5 | 84 |

    | Barbara | 13 | 65.3 | 98 |

    | Carol | 14 | 62.8 | 102.5 |

    | Jane | 12 | 59.8 | 84.5 |

    | Janet | 15 | 62.5 | 112.5 |

    | Joyce | 11 | 51.3 | 50.5 |

    | Judy | 14 | 64.3 | 90 |

    | Louise | 12 | 56.3 | 77 |

    | Mary | 15 | 66.5 | 112 |


    The 9 female students in the class are aged between 11 and 15 years old. They
    have an average height of 60.6 inches, and an average weight of 90.1 pounds.


    Here is the code that produced this:


    ```

    TITLE ''Listing of Female Students'';

    PROC REPORT DATA=egprog.class now;

    COLUMN name age=minage age=maxage height weight n;

    DEFINE age / MIN NPRINT;

    DEFINE maxage / MAX NPRINT;

    DEFINE height /MEAN;

    DEFINE weight /MEAN;

    DEFINE N / NPRINT;

    WHERE sex = ''F'';

    COMPUTE LINE '''';

    x = CATX('' '',''The '', n, '','' female students in the

    class are aged between '');

    LINE x = $55;

    y = CATX('' '', minage, '' and '', maxage, '' years

    old. They have an average height of '' '');

    ```'
  merge: -1
