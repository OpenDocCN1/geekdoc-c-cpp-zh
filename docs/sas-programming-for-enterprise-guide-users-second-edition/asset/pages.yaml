- img_proc: true
  md: '# 196 SAS Programming for Enterprise Guide Users, Second Edition


    In addition to allowing users to specify the values Male and Female, we can select
    all boxes to allow the users to choose all possible values and missing values.
    If we build a prompt with all possible values selected, then the macro variable
    can have three different values depending on what the user selects.


    +   - _ALL_VALUES_

    - MALE

    - FEMALE


    We can deal with this easily in our WHERE statement by changing it as follows:

    WHERE "&sex" = "&ALL_VALUES" or Sex = "%SUBSTR(&sex,1,1)";


    We also used &sex in our title, but now we would get a title that includes includes
    the text _ALL_VALUES_ if the user selects that option. This is ugly and would
    be unacceptable; we need to find a way of dealing with that.


    The IFC SAS function enables us to produce different output depending on what
    &sex is set to. the value to return if the condition is false, and optionally
    the value to return if the condition results in a missing value. Look it up in
    the SAS Syntax Help or the Advanced Expression Builder for a full description.


    We want to use it as a macro function, so we can use %SYSFUNC to execute. Inserting
    the following in a Title would give us the desired result.


    +   Listing for %sysfunc(&sex=_ALL_VALUES_,All,&sex)) students


    This tests to see whether &sex is set to _ALL_VALUES_. If it is, it returns All;
    otherwise it returns the current contents of &sex.


    Another option we can select when creating a prompt is to allow multiple selections
    from a list.


    In the next section we will create a prompt called Promo based on the promotion
    names in the PROMOTIONS table as shown in Figure 9.1.'
  merge: -1
  pgno: 211
- img_proc: true
  md: '# Chapter 9: Macros: Reusable Programming 197


    # Figure 9.1 A multiple choice prompt


    ![](img/47cb3fb6301eb31415fa0b5e0922f416_212_0.png)'
  merge: -1
