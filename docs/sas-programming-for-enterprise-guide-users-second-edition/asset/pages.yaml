  md: '2 SAS Programming for Enterprise Guide Users, Second Edition


    # # Introduction


    This introductory chapter looks at what SAS is and how SAS Enterprise Guide fits
    into the overall SAS product set. It then explores with a few examples some of
    the effects that can be achieved by adding small amounts of code to SAS Enterprise
    Guide tasks.


    This book assumes a good working knowledge of SAS Enterprise Guide and familiarity
    with basic SAS concepts such as tables, libraries, naming standards, SAS formats,
    and SAS functions. An extremely good introduction to SAS Enterprise Guide is The
    Little SAS Book for Enterprise Guide 4.2 by Susan Slaughter and Lora Delwiche.
    Alternatively, you can use the built-in SAS Enterprise Guide Help Tutorial, SAS
    training, or SAS Enterprise Guide online documentation at support.sas.com/eguide
    to review any areas you are not familiar with.


    This book does not assume any prior knowledge of SAS coding.


    # # A Brief History of SAS


    Let''s look first at what we mean when we talk about SAS.


    # # SAS: A Complete Programming Language


    The name "SAS" is used to refer to SAS the company, the core products offered
    by the company, and the underlying programming language that lets all the SAS
    products do their work.


    The SAS programming language and core products were created at North Carolina
    State University in the early 1970s to help with analyzing agricultural research
    data. In 1976, SAS Institute Inc. was formed to bring the language and products
    to the wider world.


    Computing in the early seventies was very different from the world of computers
    we know today. To get any serious processing power required a mainframe computer,
    a physically large machine requiring strict environmental control and a team of
    operators working in shifts to keep it serviced and running.'
  merge: -1
  pgno: 17
- img_proc: true
  md: '# Chapter 1: Why Do I Need to Write Code?


    There was no spare capacity for the niceties of providing a friendly usable interface
    to

    make the life of computer users easier.


    If you wanted to make a computer do anything,

    you had to learn the commands it understood and a

    programming language to make it work the way

    you wanted.


    4GL? Was there a 5GL?

    Each generation of

    programming languages was

    step further removed from

    zeros and that are all a

    computer understands, and one

    step closer to a human

    viewpoint. Though a fifth

    generation was often heralded, it

    never really arrived, partly

    because Graphical User

    Interfaces (GUI) came along

    instead.


    At least then most programming languages

    were based on something that could be recognized

    as English, making them easier to learn and

    follow. The SAS programming language was a 4th

    Generation Programming Language (4GL), though

    it was another six years before that term was

    first used. A4GL allowed basic results to be

    achieved very easily, also allowed those with

    greater knowledge of the language to make it do

    exactly what they needed.


    Working with these computers was not easy. Punched cards were still in use (in
    fact, the

    SAS language statement CARDS still exists) but terminals were starting to become
    more

    common. These were low-resolution, monochrome, text-only devices that users

    to feed commands and programs into a computer and see the results. If printed
    results

    were needed, the output was black and white monospace text only.


    SAS started the year before the Apple II was launched, the first Macintosh was
    eight

    years in the future. IBM PCs would not be along for five years, and the first
    Microsoft

    Windows operating system was not available until two years after that. A product
    such as

    SAS Enterprise Guide was not even possible back then.


    Between then and now computers and SAS have undergone massive changes.


    +   The power of computers escalated beyond all expectations, massively

    complex programs to run on even a small computer. This allowed SAS to present

    even more challenging statistical techniques through their simplified 4GL.


    +   Manufacturers of serious computers gradually standardized on the UNIX

    operating system. SAS ported its products to there too.'
  merge: -1
  pgno: 18
- img_proc: true
  md: '# 4 SAS Programming for Enterprise Guide Users, Second Edition


    +   The IBM PC and its clones became the main desktop tool, also making Microsoft
    Windows the de facto standard. Again, massive increases in power, along with the
    addition of color screens, pointing devices, and versatile printers, moved the
    user interface and presentation to the forefront. SAS produced tools to keep up
    with these developments—first an interactive workbench for programmers, and then
    SAS Enterprise Guide.


    +   The Wide Web changed the usage of computers back towards a more centralized
    client/server environment, this time with the client available through a standardized
    browser or via a truly machine-independent Java language. Once again, SAS embraced
    the change with its SAS Intelligence Platform.


    SAS started from a strong position with its programming language and has evolved
    as computers evolved. Everything you ever been able to do with SAS can still be
    done via the programming language, but that is a lot to learn and even more to
    master. A new approach was needed.


    # SAS Enterprise Guide: A Graphical User Interface for SAS


    The key problem for a new SAS user before the introduction of SAS Enterprise Guide
    was the time it took to become proficient in using the programming language. A
    few attempts were made to provide a better interface, but they were all a little
    cumbersome and tended to be focused on a specific area of SAS. For example, there
    was (and still is) a very unusual interface to the SAS reporting routines discussed
    in the “One-Stop Reporting” of Chapter 7.


    Some interface improvements, such as that for SAS Enterprise Miner, were much
    more successful, but were still aimed at achieving objectives—data mining in this
    case.


    The key tool in opening the power of SAS to a wider audience of power users is
    SAS Enterprise Guide—currently on release 4.2.


    SAS Enterprise Guide is a Windows tool developed using Microsoft .NET. Although
    the client can run only on Windows, it can still utilize SAS running on any of
    the operating systems it supports. Using .NET as a development tool means that
    SAS Enterprise Guide can be extended to support new tasks, either developed by
    SAS, by third-parties, or by users wanting to tailor SAS Enterprise Guide to their
    own needs.


    > Power Users? SAS Enterprise Guide is a tool for users who understand data structures
    and have the time and skills to develop sophisticated models and reports. More
    recently, SAS also introduced their SAS9 software based on Web technologies and
    targeted towards business users.


    As described earlier, SAS is a comprehensive programming language that can be
    used in a huge number of ways. Although it is true'
  merge: -1
  pgno: 19
- img_proc: true
  md: '# Chapter 1: Why Do I Need to Write Code?


    some of the language capabilities are rooted in the past that you will probably
    never want to use them (look at the EXPLODE procedure mentioned in Appendix B),
    most are still very relevant. SAS Enterprise Guide was designed to give easy access
    to some of the most frequently used options. Fortunately, after you understand
    the way SAS Enterprise Guide works, you can learn some programming techniques
    that make use of this hidden functionality.


    # How Does SAS Enterprise Guide Work?


    SAS Enterprise Guide handles two things for the user:


    # SAS Enterprise Guide Interacts Directly with Microsoft Windows


    SAS Enterprise Guide works directly with Windows to deal with tasks that are purely
    related to Windows, such as using the Windows scheduler and prompting for run-time
    parameters. As a SAS programmer, there is little you can do to interact with activities
    that are specific to Windows. It is possible to develop your own add-ins, but
    that would be a subject for another book and another programming language.


    # SAS Enterprise Guide Interacts with SAS


    In virtually all cases, SAS Enterprise Guide generates SAS code for you, submits
    it to a SAS server for processing, and then updates the SAS Enterprise Guide workspace
    with the results (see Figures 1.1 through 1.4). The SAS server can be SAS software
    running locally on your machine, or SAS software running on another machine that
    you have access to. The other machine can be any platform that SAS supports—most
    likely a Windows or UNIX server, but possibly a mainframe system.'
  merge: -1
  pgno: 20
