- img_proc: true
  md: '# 86 SAS Programming for Enterprise Guide Users, Second Edition


    # Updating


    For a simple manual update, you can use the UPDATE statement to change data in
    place. Once again, the WHERE clause becomes extremely important; without it every
    single row in your database would be updated to the new value.


    ```

    PROC SQL;

    UPDATE EPGROG.ZoneAccess

    SET EndDate = ''01JAN2008''d

    WHERE EmpID = ''E2343'' AND Dept = ''D123'';

    QUIT;

    ```


    Because indexes are updated when an indexed column is changed, the software might
    need to remove the old value from an index and add the new value.


    To update the table based on contributing tables takes a little more work.


    ```

    PROC SQL;

    UPDATE egprog.ZoneAccess

    SET EndDate =

    (SELECT EndDate FROM egprog.EmpDept

    WHERE ZoneAccess.EmpID = EmpDept.EmpID

    AND ZoneAccess.Dept = EmpDept.Dept)

    WHERE ZoneAccess.EmpID IN

    (SELECT EmpID FROM egprog.EmpMaster

    WHERE SecChange = "U")

    QUIT;

    ```


    The first SELECT clause is used to return the value we want to replace EndDate
    with. This clause ensures that the row we are selecting from EmpDept matches the
    ZoneAccess row we are updating using a WHERE clause linking EmpID and EmpDept.


    As with the delete, we need to make sure that the update only happens on the rows
    we want updated. We can use exactly the same approach we used in the delete, using
    a WHERE ... IN clause and generating the list with a SELECT query based on the
    SecChange flag in EmpMaster.


    Be careful with UPDATE syntax. It is an area that different databases implement
    in different ways, many of which just give a compile error in SAS. The method
    previously shown work in most databases and definitely works in SAS.'
