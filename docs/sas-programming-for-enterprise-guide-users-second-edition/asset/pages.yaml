    # # Appendix B


    # ## Selected Additional SAS Procedures


    This appendix gives an alphabetic list of some SAS procedures that do not have
    a SAS Guide task designed to make their use easier. A few might be generated as
    a supporting part of a SAS Enterprise Guide task, but there is no opportunity
    to influence the generated code directly.


    A brief description of each procedure is given. Where appropriate, there are references
    to other sections. If the code is not covered elsewhere, there may also be some
    hints on techniques that might be useful. Each description ends with suggestions
    on where to look for more information.


    Additional help is available in the SAS Enterprise Guide Help System by selecting
    Help->SAS Syntax Help, or online at support.sas.com/documentation. For online
    help on procedures, choose the SAS Procedures link under P, and then locate by
    name.


    If you have other SAS packages installed in addition to Base SAS, then browse
    through the documentation for that package. You never know what you might find.'
  merge: -1
  pgno: 264
- img_proc: true
  md: "# 250 SAS Programming for Enterprise Guide Users, Second Edition\n\n# APPEND\
    \ Procedure\n\n| SAS Package | Base SAS |\n| --- | --- |\n| Description | Although\
    \ SAS Enterprise Guide has an Append task, it uses an SQL set operation to create\
    \ a new table by reading all of the rows from one table and adding all of the\
    \ rows from a second table. Optionally, the new table can overwrite any of the\
    \ existing tables.\n\nThe APPEND procedure operates by adding rows to the end\
    \ of an ending task. This method is significantly more efficient, because the\
    \ data from the first table does not have to be read. SQL can add rows using INSERT\
    \ and SELECT statements, but the APPEND procedure is specifically designed for\
    \ the purpose.|\n\n# Coding Hints\n\nThe following code adds the contents of table2\
    \ to table1.\n\n```\nPROC APPEND BASE=table1 DATA=table2;\nRUN;\n```\n\nIf there\
    \ are differences between the variables in the two data sets, you might need to\
    \ use the FORCE option.\n\n# Additional Help\n\n| Help System | SAS Products $\r\
    ightarrow$ Base SAS $\rightarrow$ Base SAS 9.2 Procedures Guide $\rightarrow$\
    \ Procedures $\rightarrow$ The APPEND Procedure |\n\n# DOCUMENT Procedure\n\n\
    | SAS Package | Base SAS |\n| --- | --- |\n| Description | When you are creating\
    \ output from SAS using ODS, you might not be sure what the final output type\
    \ or types will be. If that is the case, you can use the ODS destination DOCUMENT,\
    \ which is an internal SAS type. From there you can create your output without\
    \ rerunning your SAS code or SAS Enterprise Guide task.\n\n# Coding Hints\n\n\
    See the examples on the Web.\n\n# Additional Help\n\n| Help System | No help available\
    \ in SAS Enterprise Guide. Look up the DOCUMENT procedure on the Web."
  merge: -1
  pgno: 265
- img_proc: true
