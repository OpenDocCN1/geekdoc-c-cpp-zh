    what circumstances you might choose to use them.


    # Adding Code When a Server Is Used for the First Time


    In any SAS Enterprise Guide session you can set some code to run the first time
    you use a server. This could be when you first run a task or some code on that
    server, or when you use the Server List window to view the files or libraries
    on a server.


    To set this code, go to Tools→Connections→SAS Programs and select the Submit SAS
    code when server is connected check box.


    Figure 2.12 To insert code when server is connected


    ![](img/47cb3fb6301eb31415fa0b5e0922f416_45_0.png)


    Then click the Edit button at the end of that line to open an Edit window.'
