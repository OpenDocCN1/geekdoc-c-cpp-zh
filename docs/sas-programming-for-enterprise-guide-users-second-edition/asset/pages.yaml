    # Including Macros


    For macros to be really useful, we need to reuse the macro code whenever we need
    to.


    Let''s take an example such as the code we used in Chapter 7 to create a link
    between an HTML file and a PDF file. The code looked like this:


    ```

    ODS HTML FILE=''c:\temp\myfile.html'';

    ODS PDF FILE=''c:\temp\myfile.pdf'';

    ODS HTML TEXT=''<a href=''c:\temp\myfile.pdf'' target=''_blank'' style=''float:
    right; text-decoration: none; background-color:blue; color: white; padding: 5px;''>Printable
    Version</a>''

    ```


    This was the version that had a button-like look in the HTML.'
  merge: -1
  pgno: 216
- img_proc: true
  md: '# 202 SAS Programming for Enterprise Guide Users, Second Edition


    Looking at this code, we can assume that in reality the only thing that is likely
    to change each time we use it is the name of the files we want to create. That
    makes it an ideal candidate for turning into a macro with parameters. The revised
    code might look like this:


    ```

    %MACRO LINKS(file);

    ODS HTML FILE="file..html"

    ODS PDF FILE="file.pdf"

    ODS HTML=<a href=''file.pdf'' target=none; background-color:blue; style=''float:
    right; text-decoration:none; padding:5px;''>Printable Version/a</a>

    %MEND;

    ```


    Notice that we have changed the quotation marks to double quotation marks that
    SAS will evaluate any macro variables within the strings. Notice also that where
    we used the &FILE variable, we put two dots after it. The dot has a special significance
    as an optional end-of-macro-variable character, in which case it is dropped from
    the output. We need a dot as part of our filename, including a second dot gives
    us what we need.


    If we save that code to a file, we can reuse it whenever we need to produce a
    printable PDF variant on some output.


    Save the file as C:\temp\links.sas or in another suitable location on your hard
    drive.


    Now in place of all that code, we just need to include the following two lines:


    ```

    %INCLUDE c:\temp\links.sas;

    %LINKS (c:\temp\myfile)

    ```


    The %INCLUDE statement includes the file we just created in our task. This statement
    creates the macro. The %LINKS statement then calls the macro.


    This gives us exactly the same output as we saw in Chapter 7, but can be reused
    often as needed. That’s the real power of macros.


    # The Biggest Exploding Pie


    When we discussed the exploding pie chart in Chapter 8, we said that we would
    look at a way to ensure that the biggest pie segment is always exploded. This
    section describes how to automate that process.'
  merge: -1
  pgno: 217
- img_proc: true
  md: '# Chapter 9: Macros: Reusable Programming 203


    We will first need to do a little data preparation. Create a Query Builder task
    based on the AS_PRODUCTS table. We just want to output one row for each PRODUCT_TYPE
    and have another column giving the count of products in that PRODUCT_TYPE.


    The Query Builder task should look like Figure 9.5. The output table that we are
    creating here is called PIE and is in the WORK window.


    # Figure 9.5 Preparing data for an exploding pie segment


    ![](img/47cb3fb6301eb31415fa0b5e0922f416_218_0.png)


    Next create a pie chart based on the PIE table. Assign PRODUCT_TYPE to the Column
    to chart role, and Frequency to the Sum of role. The task window should look like
    Figure 9.6.'
  merge: -1
  pgno: 218
- img_proc: true
  md: '# Figure 9.6 Pie Chart task


    ![](img/47cb3fb6301eb31415fa0b5e0922f416_219_0.png)


    Click Preview code and then Enter User Code. Double-click to insert code at the
    first insertion point and insert the following code:


    ```

    PROC SQL NOPRINT;

    SELECT product_type INTO :explode SEPARATED BY "" ""

    FROM work.pie

    WHERE frequency = (SELECT MAX(frequency) FROM work.pie);

    QUIT;

    %LET explode = "&explode";

    ```


    Let''s look at this code a bit at a time so that we can see what it is doing.
    At the heart of it is the SELECT statement:


    ```

    SELECT product_type FROM work.pie

    WHERE frequency = (SELECT MAX(frequency) FROM work.pie);

    ```'
  merge: -1
  pgno: 219
- img_proc: true
  md: '# Chapter 9: Macros: Reusable Programming


    We ran this by itself, it would give us a list of all the products whose frequency
    is equal to the maximum frequency. There could be more than one. What we have
    done is add a new clause to the SELECT statement so that it looks like this:


    ```

    SELECT product_type INTO :explode SEPARATED BY ""

    FROM work.pie

    WHERE frequency = (SELECT MAX(frequency) FROM work.pie);

    ```


    The INTLO clause is a SAS extension to SQL that creates macro variables for us.
    What we want here is to create a single macro variable that we have called prefixed
    by a colon when defining a macro variable in PROC SQL.


    What goes into this variable is a list of all the products that meet our condition,
    separated by " \ which is the syntax required by the EXPLODE= option we saw in
    Chapter 8. We can specify anything we like as a separator. If we think only a
    single value will be returned, we can omit it completely.


    As it stands, this SQL code would still produce a report, hence the NOPRINT option
    on the PROC SQL statement.


    The final QUIT closes the SQL procedure. We then use a %LET statement to surround
    the string with quotes and also to remove any leading or trailing blanks, something
    %LET does automatically.


    The result of all this is that the macro variable will either be set to a single
    value like this:


    "GAMES"


    or a list of values like this:


    "GAMES" "DATABASE"


    This is exactly the format we need for our EXPLODE= option.


    Click OK on the Insert Code window, and scroll down to just before the end of
    the PIE statements. Double-click and insert the following code:


    ```

    EXPLODE = &explode

    ```


    Now any time we run the process flow from the query onwards, we can be sure the
    largest pie segment or segments will be exploded.'
  merge: -1
  pgno: 220
- img_proc: true
  md: '# Summary


    In this chapter we reviewed using macro variables, and then we showed how to convert
    a simple report program to run as a macro, accepting multiple parameters and creating
    different report outputs depending on the values passed.


    We took a List Data task and converted it to a macro so that we could still design
    our report using the task, but then call it as often as we want.


    Next we reviewed the way SAS Enterprise Guide uses macro variables when using
    prompts and conditional process flows, and saw some techniques to allow us to
    build on that.


    After that, we refined the pie chart we created in Chapter 8 so that it always
    exploded the largest segments.


    We also saw a way of saving macros and including them whenever you need to.


    # Where to Look for More Information


    Although the macro techniques shown in this chapter are what you will use most
    of the time, there is much more to the subject. To get a full overview, go to
    support.sas.com.


    The following SAS Press books also provide more detailed coverage of the subjects
    discussed in this chapter:


    +   * Carpenter''s Complete Guide to the SAS Macro Language, Second Edition by
    Art Carpenter

    * SAS Macro Programming Made Easy, Second Edition by Michele Burley


    # Exercises


    +   1. Convert the pie chart you produced in the previous chapter so that the
    whole task becomes a macro that receives the name of the pie slice to be exploded.


    +   2. Create a Program node and enter the code necessary to call your new macro.'
  merge: -1
