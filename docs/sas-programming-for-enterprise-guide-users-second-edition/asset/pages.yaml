  md: '# New and updated for

    SAS® Enterprise Guide 4.2!


    The full power of SAS Completely reviewed for SAS Enterprise Guide 4.2, this pragmatic,
    example-driven book demonstrates how you can use SAS code to enhance the capabilities
    of SAS Enterprise Guide. Designed to help you gain extra value from the products
    you already have, SAS® Programming for Enterprise Guide® Users, Second Edition,
    contains tips and techniques for a variety of features that cannot be accessed
    directly through the task interfaces. In all cases, author Constable pairs pairs
    with examples that you can test, and includes additional exercises to give you
    more practice. The end result is more efficient and resilient of SAS Enterprise
    Guide in a wide variety of business areas.


    +   SAS® Programming for Enterprise Guide® Users, Second Edition, covers a wide
    range of topics, including:

    * The Output System

    * Advanced formatting

    * Micro variables and macros

    * Advanced reporting using PROC REPORT

    * Highlighting in reports

    * Hyperlinking between reports and graphs

    * Data manipulation using the DATA step

    * Extended graphics


    Neil Constable is a Principal Education Consultant at SAS in the United Kingdom,
    where he has worked since 2002. He applies his extensive knowledge of Base SAS,
    SAS Enterprise Guide, and the SAS business intelligence tools as instructor for
    the curriculum and the business intelligence curriculum, which includes SAS Enterprise
    Guide courses. A frequent presenter at customer group workshops and UK user conferences,
    Neil is an Associate Member of the Institute of IT Trainers.


    By adding small amount of code in keys, SAS Enterprise Guide users can maximize
    the product'' efficiency. Although no programming experience is necessary, you
    should be familiar with the SAS Enterprise Guide interface and tasks. Let Constable''s
    SAS® Programming for Enterprise Guide® Users, Second Edition, help you get the
    most out of SAS Enterprise Guide!


    ![](img/47cb3fb6301eb31415fa0b5e0922f416_311_0.png)


    > Once again Neil Constable demonstrates what is going on behind the scenes of
    the SAS Enterprise Guide platform in easy how-to steps for the reader. This book
    is for anyone who is going to start using or switching to SAS Enterprise Guide.


    Melanie Raslan

    Vice President Marketing Analytics

    Webster Bank N.A.


    > This book provides clear and simple instructions for creating graphs, reports,
    memos, and queries in SAS Enterprise Guide—making it easy in the process... it
    is a useful and invaluable resource for all SAS users.


    Kim Nguyen

    Connecticut Department of Public Health


    ![](img/47cb3fb6301eb31415fa0b5e0922f416_311_1.png)


    SAS is the leader in business analytics software and services, and the largest
    independent vendor in the business intelligence market. Through innovative solutions
    developed within an integrated framework, SAS helps customers at more than 45,000
    sites improve performance and deliver value by making decisions faster. Since
    1976 SAS has been giving customers around the WORLD KNOW


    ![](img/47cb3fb6301eb31415fa0b5e0922f416_311_2.png)'
