  md: 'If you do not want all of the rows from the table copied, use the WHERE statement
    we

    have already seen. What if you do not want all of the columns? Here is how you
    might

    handle that:


    ```

    DATA products;

    SET egprog.as_products(KEEP=description cost price

    product_type);

    RUN;

    ```


    Here we have used a data set (table) option to specify which columns we want to
    keep.

    Data set options appear in parentheses immediately after the data set they apply
    to. This

    lists the columns we need, and these columns will be the only ones read into the

    program. You can use DROP as a data set instead and list the columns you want

    to discard. I intend to use KEEP= because I do not have to look up the table definition

    to see what columns I have available. You can use these options anywhere you refer
    to a\data set. (Do not use commas as separators. You must use blanks.)


    So we have seen that we can use the WHERE statement to get rid of rows and the

    DROP= or KEEP options to get rid of columns. To add a new column, or to change
    the

    of value of an existing column, we type in the expression we use, followed by
    a semicolon.


    ```

    DATA products;

    SET egprog.as_products(KEEP=description cost price

    product_type);

    unit_profit = price - cost;

    RUN;

    ```


    The line unit_profit = price - cost; sets unit_profit equal to the result of

    subtracting the cost from the price. If unit_profit already exists, this code
    overwrites the

    existing value. If unit_profit does not exist, it is created as a new column with
    the type

    determined by the result of the expression—numeric in this case.


    Though this calculation is very simple, the expression that can be used here is
    identical

    to the expressions built with the SAS Enterprise Guide Advanced Expression Builder
    and

    can include column names (variables), constants, arithmetic operators, and SAS
    functions

    in many combinations.


    Having calculated the unit_profit column, we might no longer be interested in
    the cost

    and price. We can control which columns are output by specifying a KEEP= option
    on

    the outgoing table.


    ```

    DATA products (KEEP=description product_type unit_profit);

    SET egprog.as_products(KEEP=description cost price

    product_type);

    unit_profit = price - cost;

    ```


    RUN;'
  merge: -1
