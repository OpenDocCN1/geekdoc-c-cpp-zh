    # # Alternative Output Destinations


    Finally we look at some alternative ODS destinations you might find useful.


    First you might want to redirect the output of a task to a comma-separated value
    (CSV) file. This is a general purpose unformatted way of storing data that many
    third-party applications can use. For example, many relational databases have
    the ability to export or import CSV files.


    The syntax for creating a CSV file is as follows:


    ```

    ODS CSV FILE="myfile.csv";

    ```


    This code writes all your headers, footers, titles, and data to a CSV file. When
    you open the file by double-clicking on it from an Explorer window, the .csv file
    extension ensures that Windows uses a suitable viewer.


    Here is an alternative syntax:


    ```

    ODS CSV FILE="myfile.csv";

    ```'
  merge: -1
