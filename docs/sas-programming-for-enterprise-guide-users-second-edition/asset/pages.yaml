- img_proc: true
  md: "Works of fiction almost never have an index. People rarely always read from\
    \ beginning to end. Nonfiction books almost always have an index. Some computing\
    \ books might have more than one index—one organized by statement and one by topic.\n\
    \nAll of these points apply to an index on a table as well. It requires machine\
    \ resources to create and maintain, and it takes up space. If the table is always\
    \ going to be read from beginning to end, then an index adds no value. Equally,\
    \ if the data is small, there is no real benefit to having an index.\n\nIn this\
    \ section, we look at how to create an index and ensure it is incorporated correctly\
    \ into your process flow. We also look at when SAS uses an index you have created.\
    \ The index creation methods outlined here work only on data in SAS data sets.\
    \ Use the maintenance tools provided by other database vendors to add indexes\
    \ to your databases.\n\n# Index Creation\n\nIn real life, you would never build\
    \ an index on a small table, but as an example we will build one on the BondFilms\
    \ data we used in the previous section. So create a project with that data in.\n\
    \nThen create a new Program node by selecting File→New→Program.\n\nInto that Program\
    \ node type the following:\n\n```\nPROC SQL;\n  CREATE INDEX BondNo\n  ON EGPROG.BondFilms\
    \ (BondNo);\nQUIT;\n```\n\nWhen you run that code, you do not see any output,\
    \ but if you look at the log you see the following note:\n\nNOTE: Simple index\
    \ BondNo has been defined.\n\nIf you are going to rerun this project, it might\
    \ be worth right-clicking on the Program node, selecting Link Code to, and selecting\
    \ the table from the dialog box that is displayed.\n\nIt is also a good idea to\
    \ rename the Program node to something meaningful such as “Index Creation for\
    \ BondFilms.\""
