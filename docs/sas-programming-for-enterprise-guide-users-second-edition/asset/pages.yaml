- img_proc: true
  md: '# Chapter 2: Understanding Coding with SAS Enterprise Guide 17


    # Figure 2.2 Log produced by PROC REPORT


    ![](img/47cb3fb6301eb31415fa0b5e0922f416_32_0.png)


    So, let''s examine the code we have written.


    First, if you look at the code on your screen you will see a number of different
    colors in use. The Program window highlights different parts of your code in different
    ways for ease of understanding.


    The first line of code:


    ```

    * My First SAS Program*/

    ```


    is a comment and has no effect on the way the code works. If you are using the
    default code editor color scheme, it will appear in your Program window in green.
    Comments start with /* and end with */. They can be one line or many lines long.


    Although it is true to say they have no effect on the way the code works, they
    can have a significant effect on the way you and your colleagues work. Use comments
    to give helpful information to someone looking at the code. It might be a fellow
    programmer, but it could also be revisiting a program you have not looked at for
    months or years.'
  merge: -1
  pgno: 32
- img_proc: true
  md: 'Here are some things you might want to think about including in comments:


    +   - your name so that people can contact you to discuss things

    - the date you wrote the program

    - why you wrote it—for example, who uses the output

    - references to any supporting material, such as documents describing business
    rules

    - any coding techniques that might not be obvious from examining the code

    - a change history if you have modified the program


    You can have as many comments as you like, and they can occur anywhere in a program.


    SAS supports another type of comment, which starts with an asterisk and ends with
    a semicolon. Often this method is used to temporarily treat a single statement
    as a comment for diagnostic purposes. We will see some uses for this type of comment
    later in the book.


    All of the other lines entered are SAS statements. There is only one unbreakable
    rule about SAS statements, and that is they must end with a semicolon. It is fairly
    certain that on a number of occasions you will forget to put the semicolon—I still
    do! When you forget it, SAS often treat that as something that looks correct.
    If we submit the following lines of code:


    ```

    PROC REPORT DATA=egprog.class

    RUN;

    ```


    we get output, and the Program node icon in the process flow appears with a red
    cross on showing that there has been a problem. If we open the log, we see that
    the RUN statement is highlighted as an error. What has happened is because there
    is no semicolon at the end of the previous statement, the SAS compiler thinks
    RUN is part of that statement, in which context it is not valid. All of the possible
    options are listed in red, and the very first one is the missing semicolon. It
    happens to us all!


    There are no rules about the layout. SAS statements can be on one line or many.
    But once there can be any, usually a space, between words in a statement, but
    all things are possible, but just remember that someone, once again possibly,
    you might have to try to understand the program at some time in the future. The
    neater you can make your program the easier it will be to read. Try to stick to
    one separator between words and no more than one statement per line. Sometimes
    it is unavoidable for a statement to go over more than one line, but when it is
    necessary, again try to line things up and keep them looking neat and tidy for
    the next person.'
  merge: -1
  pgno: 33
- img_proc: true
  md: '# Chapter 2: Understanding Coding with SAS Enterprise Guide 19


    The last four lines of our program are all statements, but you need to understand
    a few more things before we can move on. The first statement:


    TITLE ''Report of Female Students in Class'';


    is a free standing statement that can be used anywhere in your program. A number
    of these types of statements are available to you. they are usually referred as
    global statements because their effect is global. That is, everything you do after
    the global statement is affected unless you exit or reset SAS Enterprise Guide.
    This particular statement sets a title that appears on all output. Be aware that
    the code generated by SAS Enterprise Guide resets some global statements.


    Again notice the coloring. By default, the word “TITLE” appears in light blue,
    indicating that it is a SAS keyword. The title itself, the part in single quotes,
    appears in purple, indicating that it is a string. Strings can contain any mixture
    of numbers, letters and special characters and are always bounded by either single
    or double quotation marks.


    The next three statements work together as a step to create the report:


    ```

    PROC REPORT DATA=egprog.class;

    WHERE sex=''F'';

    RUN;

    ```


    Notice that the words “PROC REPORT” and “RUN” are all in a darker blue. The blue
    shows that they are SAS keywords, but the darker blue shows they are also step
    boundaries. We will see some other words later in the book that can be step boundaries,
    but in most of the work we will be doing in SAS Enterprise Guide, the boundaries
    will be PROC—short for procedure—followed by the name of the procedure, and RUN.


    Some statements can be used only in an appropriate step, and other statements
    can be used in any step. The WHERE statement used here is an example of a statement
    that can be used in the majority of steps.


    Most statements have options, sometimes only a few, sometimes many. For example,
    the TITLE statement previously showed could be written with no string following
    it, which would cancel the setting of the title. The string is there option on
    the TITLE statement.


    There are some options that can be used on a number of different statements, but
    most are specific to the statement they accompany.


    As we work through this book you will be introduced to many statements, options,
    and steps. Refer back to this section to refresh your memory if you come across
    a term that you are unfamiliar with.'
  merge: -1
