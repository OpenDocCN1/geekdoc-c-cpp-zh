  md: '# Hyperlinks Revisited


    The last task we are going to use PROC REPORT in this section is to produce a
    hyperlinked contents file that we can use to get to the pages we produced earlier
    in this chapter. You might recall that we produced detail reports for our AS_PRODUCTS
    table that were written to files PROD1.HTML, PROD2.HTML, PROD3.HTML, etc.


    The first step in creating the contents file is to use PROC REPORT to give us
    the required list and to add a count of the number of products for each product
    type. Again, try it in a SAS Enterprise Guide Code window.


    ```

    ODS PATH=":\temp" (URL=NONE) BODY="contents.html";nPROC REPORT DATA=egprog.as_products;

    COLUMN product_type;

    DEFINE product_type / GROUP ''Product Type'';

    DEFINE N / ''Number of Products'';

    RUN;

    ODS HTML CLOSE;

    ```


    Do not forget to switch off the default output for SAS Enterprise Guide. The code
    produces the following output. Notice the use of the forward slash in the heading
    for Number of Products. The slash forces a line break in the heading at that point.


    Figure 7.14 Product frequency count


