- img_proc: true
  md: '# 198 SAS Programming for Enterprise Guide Users, Second Edition


    When users choose values now, a series of macro variables will be created as follows:


    +   - Promo will contain the first value chosen.

    - Promo0 will contain the number of values chosen.

    - Promol will also contain the first value chosen.

    - Promo2 will contain the second value chosen.


    This series will continue on up to the number of values chosen.


    On the face of it, this makes it quite hard to deal with multiple-choice parameters.
    Fortunately, SAS Enterprise Guide includes a macro designed to deal with these.
    Specifically what it does is to generate the conditional part of a WHERE statement
    for you. So you can just code your WHERE statement as:


    ```

    WHERE @eg_WhereParam(name, Promo, IN, TYPE=S);

    ```


    The parameters in this example are the name of the column we are checking (name),
    the name of the macro variable (Promo), the comparison type (IN as in "in a list
    of values") and the data type (S for "string" in this case).


    Look at what is generated when using prompted filters in the Query Builder to
    see other examples of this.


    But what if we want to include the list in a title? The easiest way is to use
    the same macro and extract what we want from it. In the previous example, the
    macro generates the following text once some values have been selected:


    ```

    (name IN ( "Get Connected", "Utility March\))

    ```


    To be able to use that in a title, we need to be isolate just the list of values
    and remove the quotation marks around them. We can use the %SCAN function to isolate
    the list by selecting the second part using brackets as the delimiter.


    So the following code:


    ```

    %scan(@eg_WhereParam(name, Promo, IN, TYPE=S),2,())

    ```


    will return:


    ```

    "Get Connected", "Utility March"

    ```'
  merge: -1
