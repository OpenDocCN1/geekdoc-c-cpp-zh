- img_proc: true
  md: '# 154 SAS Programming for Enterprise Guide Users, Second Edition


    # Figure 7.17 Defining the format for wformat


    ![](img/47cb3fb6301eb31415fa0b5e0922f416_169_0.png)


    Run the task to create the format.


    The value returned by this format is used as the background color for our cells,
    so feel free to make it a different color if you want. There are a few named colors
    you can use—RED, GREEN, BLUE, or WHITE, for example. You can also specify a color
    as a mix of red, green, and blue (RGB coding) using #FFFFFF. The first pair of
    Fs are a hexadecimal specifying the amount of red, the next two to the amount
    of green, and the last two of blue.


    Create a List Data task on EGPROGRAM.CLASS. Move all of the columns to the List
