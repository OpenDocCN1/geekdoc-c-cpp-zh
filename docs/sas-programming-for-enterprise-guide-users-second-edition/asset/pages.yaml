    This technique could be used for any settings that you want to be present throughout
    the whole project. Typically, this is likely to be something set using the OPTIONS
    statement, which we will look at in the next chapter.


    If you have multiple servers, you need to be careful that the code you add works
    correctly on all servers.


    # Adding Code before or after a Task or Code


    You can access the SAS Enterprise Guide facility for inserting code before or
