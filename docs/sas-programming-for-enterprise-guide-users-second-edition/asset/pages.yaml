- img_proc: true
  md: '# Chapter 4: Data Manipulation Part 1: Queries 83


    here. If you are altering large amounts of data, it might be easier and quicker
    just to create a new table.


    In every case where a table is being updated by another table, an index on the
    common values will probably improve performance. When you are developing your
    table updates, experiment with and without an index to see which is better.


    We also look in this section at some of the checks you can incorporate to prevent
    some mistakes happening when you are updating your data.


    For the examples in this section, we use three files that you can download as
    detailed in Appendix C. The first is Zone/Access, a security file that is used
    to control access to restricted areas. It contains the employee ID, a department
