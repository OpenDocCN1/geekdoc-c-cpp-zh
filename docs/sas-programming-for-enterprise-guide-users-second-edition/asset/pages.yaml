  md: "# Chapter 4: Data Manipulation Part 1: Queries 87\n\n# Integrity Checks\n\n\
    We have just looked through a number of techniques you can use to update tables\
    \ that already exist. If you are doing this, you must make sure that the updates\
    \ are correct.\n\nOne good technique to use is to ensure that the data is fully\
    \ validated before it is used. An alternative approach is to have your table definitions\
    \ include rules about the data that is allowed in time. The rules you can specify\
    \ include basic rules about the data that can be held and the relationship with\
    \ other tables, as well as rules that stipulate whether a value must be unique\
    \ or whether it can be\n\n> These are all implemented by building integrity constraints\
    \ either when you create the table or by altering the table definition later.\
    \ Remember that any integrity constraints you include are checked every time the\
    \ table is updated, so there is almost certainly a performance overhead. Changed\
    \ your mind? The ALTER command can be used to add or remove columns or modify\
    \ a column definition. Look in Help if you want to use those variations.\n\nThe\
    \ constraint creation methods outlined here only work on data held in SAS data\
    \ sets. Use the maintenance tools provided by other database vendors to add constraints\
    \ to their databases.\n\nIn this example, we assume you have already created a\
    \ table using a Query Builder task, so we use the ALTER command to change the\
    \ table definition. Remember that you can use similar syntax when creating a table\
    \ if you do it it using a Program node.\n\nWorking with our security data, we\
    \ make sure that there is always an end date on our EmpDept table. We can do this\
    \ with the following line of code:\n\n```\nPROC SQL;\n  ALTER TABLE EGPGROP.EmpDept\n\
    \  ADD CONSTRAINT EndDate_NotNull NOT NULL (EndDate);\nQUIT;\n```\n\nWe can see\
    \ the main structure in this example. First, use the ALTER TABLE statement to\
    \ specify the table you want to change, and then the ADD CONSTRAINT clause to\
    \ add a constraint. You can let SAS name the constraint for you, but it is good\
    \ practice to give it a meaningful name yourself. This is called EndDate_NotNull.\
    \ Finally, in our definition we have the type of constraint, NOT NULL in this\
    \ case, and the column we want to apply it to."
  merge: -1
