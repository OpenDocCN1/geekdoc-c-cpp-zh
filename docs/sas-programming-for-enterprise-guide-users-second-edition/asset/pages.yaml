    \ very comprehensive coverage of SQL. The only SAS\nEnterprise Guide task that\
    \ uses the DATA step as its primary tool is the Import Data task.\nOther tasks,\
    \ such as some of the statistical tasks, use the DATA step in a supporting role.\n\
    \nWe have already seen how we can use SQL to do a huge amount of data manipulation.\n\
    We have also seen how SQL grew from relational databases. The DATA step did notncome\
    \ from that background and enables us to do things that are completely alien to\n\
    SQL.\n\nIn this section, we start with a quick introduction to DATA step coding,\
    \ and then we use\nt DATA step to achieve a common task that cannot be done in\
    \ SQL and another that is\nsificantly more efficient than SQL.\n\n# DATA Step\
    \ Basics\n\nCreate a Program node in a SAS Enterprise Guide project and enter\
    \ this code:\n\n```\nDATA products;\n  SET egprog.as_products;\nRUN;\n```\n\n\
    The SET statement names the table you want to read, EGPROG.AS_PRODUCTS in this\n\
    case. The DATA statement names the table you want to create; here we are creating\n\
    PRODUCTS. We have not specified a library, so the data will be created in the\
