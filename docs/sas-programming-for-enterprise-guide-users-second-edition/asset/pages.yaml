    Start a new project and insert those tables into it. (Because you will be updating
    these tables, you might want to make copies of them before you start.)


    # Deleting Rows


    If there are rows you no longer require, delete them using the SQL DELETE statement.
    Remember to include a WHERE clause on a DELETE statement; otherwise, you will
    be waving a tearful farewell to all of your data.


    Let''s say two employees have left suddenly, so we want to manually delete them
    from the security file. In PROC SQL we would issue the following command:


    ```

    PROC SQL;

    DELETE FROM EGPROG.ZoneAccess

    WHERE EmpId IN ("E1003", "E1432");

    QUIT;

    ```


    Now they can try to get in as much as they like. As well as deleting the data,
    this command also updates any relevant indexes linked to it.


    More likely, though, updates as this are going to happen in a more controlled
    way as part of a systematic approach by Human Resources. The EmpMaster file has
    a column called SecChange that indicates what updates to the security file need
    to be made. What you need to do is base your deletions on the settings in that
    column.'
