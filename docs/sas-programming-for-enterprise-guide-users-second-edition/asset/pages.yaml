- img_proc: true
  md: '# # Introduction


    In Chapter 3 we looked at the idea of macro variables, those that SAS sets up
    for you and the ones you can create yourself. Although these variables are very
    powerful, they are only a small part of the SAS macro facility.


    In this chapter we look first at how you can make any program reusable by converting
    it into a SAS macro. We also discuss how you can make your macros more flexible
    by passing parameters to them and by using conditional processing.


    Then we see how you can use macros to apply some of the techniques we have examined
    in this book. We also make a SAS Enterprise Guide task into a macro so that we
    can reuse it.


    Next we look at how SAS Enterprise Guide deals with selection of multiple prompts
    and see some techniques to incorporate into our programs, and also how prompts
    are used by conditional process flow diagrams.


    Finally, we look at a way of getting SAS to create macro variables for us based
    on data values.


    # # What Is a Macro?


    Like a macro variable, all a macro program does is write text into your code.
    With a macro variable, the text is likely to be a few letters or words at most,
    though it can be up to 65,534 characters. With a macro program, the text is likely
    to be entire statements, steps, or a series of steps making a complete program.
    The macro program can actually be a program in its own right, producing different
    results depending on external or internal conditions.


    With both macro variables and macro programs, it is important to ensure that the
    text that is written makes sense in the context in which it is being used—what
    comes out must be valid SAS code.


    # # Converting a Program to a Macro


    We will start with a recap of macro variables and build on it to show how macro
    programs work and why they are useful.'
  merge: -1
  pgno: 205
- img_proc: true
  md: "# Chapter 9: Macros: Reusable Programming 191\n\nCreate a Program node in SAS\
    \ Enterprise Guide and type in the following code:\n\n```\nTITLE \"Listing of\
    \ Students aged 14\";\nPROC REPORT DATA=egprog.class;\n  COLUMNS name sex height\
    \ weight;\nWHERE age = 14;\nRUN;\n```\n\nThe resulting report is unsurprisingly\
    \ changed it so that we saw students of another age, exactly what we wanted to\
    \ change our code in two places—the TITLE statement and the WHERE statement. Forgetting\
    \ either would invalidate the report, because the heading and content would not\
    \ agree. The discrepancy would not be obvious because the age is not listed in\
    \ the report.\n\nIn Chapter 3, we saw how we could use a macro variable to ensure\
    \ that we only had to make one change, so let's do that again. Revise the code\
    \ so that it looks like this:\n\n```\n%LET limit = 14;\nTITLE \"Listing of Students\
    \ aged &limit\";\nPROC REPORT DATA=egprog.class;\n  COLUMNS name sex height weight;\n\
    WHERE age = &limit;\nRUN;\n```\n\nWe have added a %LET statement to set the macro\
    \ variable LIMIT to 14. Then we have replaced the occurrences of 14 in the program\
    \ with &LIMIT, a reference to the macro variable. If we want a different age,\
    \ we just make the change in one place and we know the integrity of our report\
    \ will be preserved. Make sure when you are embedding macro variables in strings\
    \ that we enclose the string in double quotation marks; otherwise SAS will not\
    \ attempt to resolve the string.\n\n# Building Macros\n\nBefore creating a program,\
    \ always make sure that the code you are converting by running it as an ordinary\
    \ program. Problems are far harder to fix if you do not know whether the cause\
    \ is in the macro or the underlying program.\n\nIf we want to run this report\
    \ more than once with different values for &LIMIT, we can convert it to a macro\
    \ program."
  merge: -1
  pgno: 206
- img_proc: true
  md: '# 192 SAS Programming for Enterprise Guide Users, Second Edition


    To convert any working program to a macro requires the addition of one macro statement
    before the code to name the macro, and one macro statement after the code to show
    where it finishes. Add those two lines into your code so that it looks like this:


    ```

    %MACRO myprint;

    TITLE "Listing of Students aged &limit";

    PROC REPORT DATA=egprog.class;

    COLUMNS name sex height weight;

    WHERE age = &limit;

    RUN;

    %MEND;

    ```


    When you run this code you no longer get any output. What happens when you run
    it that you create a macro called MYPRINT. which you can now use anywhere else
    in your SAS session. To execute it, you simply type in the name of the macro preceded
    by a percent sign indicating to SAS that it is a macro instruction. In this instance,
    we also have to make sure the macro variable is correctly set before using the
    macro.


    Open a separate Program node and type in the following lines:


    ```

    %LET limit=14;

    %myprint

    LET limit=13;

    %myprint

    ```


    You now see two sets of output, one listing of 14 year olds and one of 13 year
    olds.


    Notice that there is no semicolon after the macro instruction. What happens is
    that the macro instruction %myprint is replaced by the PROC REPORT code, and that
    has all the semicolons it needs.


    The last change we are going to make to our macro incorporates the setting of
    the variable into the macro by passing it as a parameter. We can pass as many
    parameters to a macro as we like simply by listing them in parentheses on the
    %MACRO statement after the name. Then when we call the macro, we also include
    the value we want in parentheses after the name.


    Amend your macro creation code so that it looks like the following and run it
    to re-create the macro.


    ```

    %MACRO myprint(limit);

    TITLE "Listing of Students aged &limit";

    PROC REPORT DATA=egprog.class;

    COLUMNS name sex height weight;

    WHERE age = &limit;

    RUN;

    %MEND;

    ```'
  merge: -1
  pgno: 207
- img_proc: true
  md: '# Chapter 9: Macros: Reusable Programming


    Now amend the macro so that it includes the passed parameter.


    ```

    @myprint(14)

    @myprint(13)

    ```


    When you run the code, you should see the same results as before, but this time
    the instruction to run it is self-contained.


    Just to round things off, let''s add an additional parameter and some conditional
    logic. Go back to the code where you are creating the macro and update it like
    this:


    ```

    @MACRO myprint(limit, gender);

    @IF &gender &TH LET fullender = Male;

    @ELSE LET fullender = Female;

    TITLE "Listing of &fullender Students Aged &limit"

    PROC REPORT DATA=egpprog.class;

    COLUMNS name sex height weight;

    WHERE age = &limit and sex="&gender"

    RUN;

    %MEND;

    ```


    On the %MACRO statement we have added a second parameter, GENDER, and we have
    included that in the WHERE statement.


    Rather than have "M" or "F" in our title, we have created an additional macro
    variable in lines 2 and 3 called FULLGENDER based on the value of GENDER. Once
    again, we are using IF-THEN/ELSE just as we did in the DATA step and in PROC REPORT.
    The difference here, though, is that they are all prefixed with percent signs,
    making them all macro definition statements.


    Run this program to re-create the macro, and then call it from your other Program
    node.


    ```

    @myprint(14,M)

    @myprint(13,F)

    ```


    You can have as many parameters as you like passed to a macro. In this example,
    we are passing parameters by position, which is the easiest if there are only
    a few parameters. It means that you must pass parameters in the same order that
    they are declared, and you put in two commas to mark the position of missing parameters.


    An alternative approach is to use keyword parameters. The %MACRO statement at
    the beginning of the macro program would then be as follows:


    ```

    @macro myprint(limit=gender);

    ```'
  merge: -1
  pgno: 208
- img_proc: true
  md: 'Here is how it would be called:


    ```

    %myprint (limit=14, gender=M)

    ```


    Using this approach means that you can pass parameters in any order and leave
    out any that you do not need. It has the added advantage that you can set default
    values by including them on the %MACRO statement.


    ```

    %macro myprint (limit=14,gender=M)

    ```


    This macro could be used using the following code:


    ```

    %myprint () /* Uses default of 14 and M */

    %myprint (gender=F) /* Uses default of 14 and passed F */

    %myprint (limit=13) /* Uses default of M and passed 13 */

    %myprint (gender=F, limit=13)

    /* Uses passed values of 13 and F */

    ```


    Within the macro, there is no difference in usage between position and named parameters.


    # Converting a Task to a Macro


    In the previous examples, we used PROC REPORT to produce our output. In fact,
    nothing we were doing required the power of PROC REPORT: the output could all
    be handled by a List Data task. We could create a List Data task to design our
    report, and then convert it to a macro and call it from within a Program node.


    Create a List Data task based on the CLASS data set, using whatever styles, labels,
    totals. and formats you like. Make sure you include a title that uses the macro
    variables we are going to set up. Something like the following would be ideal:


    &fullgender Students Aged &limit


    Now click Preview code and Insert Code to get to the User Code window. At the
    first insertion point, insert the code from the start of our macro.


    ```

    %MACRO myprint (limit=14,gender=M);

    %IF &gender = M THEN LET &fullgender = Male;

    %ELSE LET &fullgender = Female;

    ```


    At an appropriate point in the generated PROC PRINT code, insert the WHERE statement.'
  merge: -1
  pgno: 209
- img_proc: true
