  md: '# Summary


    In this chapter, we discussed the way in which SAS Enterprise Guide uses SQL and
    saw the code it generates for you. We also discovered how to write more complex
    queries and how to speed up access to our data using indexes.


    We then reviewed the DELETE, INSERT, and UPDATE functionality in SQL, and we saw
    the need to build validation into our data to prevent invalid data from being
    written to our tables.


    # Where to Look for More Information


    One of the advantages of SQL is that it is a widely used language and so there
    are many publications on the subject. In addition, a quick search on the Internet
    lists many sites offering free SQL reference or tutorials. You can also find SQL
    discussion groups or newsgroups.


    Regardless of the information source, make sure you focus either on SAS SQL or
    the ANSI standard; a book designed purely for Oracle SQL could be of limited use.
    Some operations that SAS does not support are commits and rollbacks. These are
    vital for operational databases, but an unnecessary overhead for reporting and
    analysis databases such as SAS data sets.


    To find more on the SAS implementation of SQL, go to the SAS Syntax Help and select
    SAS Products→Base SAS→Base SAS 9.2 Procedures Guide→Procedures→The SQL Procedure.


    If the help was not installed as part of your setup, visit the SAS Web site at
    support.sas.com/documentation. From there, look up SQL under the SAS Procedures
    heading.


    Also on support.sas.com, search for SQL and you will find various supporting documents
    you can read for free.


    The following SAS Press books also provide more detailed coverage of many of the
    subjects discussed in this chapter.


    +   * The Complete Guide to SAS Indexes by Michael Raithel


    +   * The Essential PROC SQL Handbook for SAS Users by Katherine Prairie


    +   * PROC SQL: Beyond the Basics Using SAS by Kirk Lafler'
