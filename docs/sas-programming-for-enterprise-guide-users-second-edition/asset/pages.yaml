- img_proc: true
  md: '# 80 SAS Programming for Enterprise Guide Users, Second Edition


    You might want to be able to access your data based on more than one column. In
    that case, you would use a composite index, which is declared in a very similar
    fashion.


    ```

    PROC SQL;

    CREATE INDEX FilmActor

    ON EGPROG.BondFilms(FilmNo, BondNo);

    QUIT;

    ```


    The difference is that multiple columns are listed in the parentheses, and the
    index name cannot be the same as any of the columns.


    If you want to get rid of an index, either because you no longer need it or because
    you need to rebuild it for some reason, use the following variation on the DROP
    statement:


    ```

    PROC SQL;

    DROP INDEX FilmActor FROM EGPROG.BondFilms;

    QUIT;

    ```


    In all cases, if you think there is a possibility that the index might already
    exist, it is a good idea to use a DROP INDEX statement before the CREATE INDEX
    statement, as shown in this example:


    ```

    PROC SQL;

    DROP INDEX FilmActor FROM EGPROG.BondFilms;

    CREATE INDEX FilmActor

    ON EGPROG.BondFilms(FilmNo, BondNo);

    QUIT;

    ```


    Trying to create an index that already exists results in an error, and trying
    to drop an index when the index does not exist results only in a warning.


    Having discovered how to create and remove indexes, you will see in the next section
    when SAS makes use of them.


    # Index Usage


    Think about how you use a book index and you will get some idea of how SAS (or
    any other database system) is likely to use an index. It is either because you
    want to get straight to a specific topic, or because you want to access information
    in a different order.


    First''s look at our old friend the WHERE clause or statement. It does not matter
    whether the WHERE clause is generated by SAS Enterprise Guide or typed in by you;
    if there is an index to speed things up, SAS uses it. The question is when it
    will speed up. Unfortunately, the answer is a largely unhelpful “It depends!”


    ![](img/47cb3fb6301eb31415fa0b5e0922f416_95_0.png)'
