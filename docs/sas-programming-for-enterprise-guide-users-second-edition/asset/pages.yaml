- img_proc: true
  md: '# 56 SAS Programming for Enterprise Guide Users, Second Edition


    The %LET statement is used to create macro variables. The general form of the
    statement is %LET, followed by the name of the macro variable you want to create,
    an equal sign, and the value you want substituted whenever the macro variable
    is referenced.


    You can have as many macro variables as you want. They can either be created using
    the Prompt Manager or by inserting your own %LET statements. Macro variables created
    with %LET cannot be used as prompts for parameters. We will see other examples
    as we progress through the book.


    It is also worth noting that SAS and SAS Enterprise Guide both create macro variables
    for which you are free to use anywhere. You will see some being set above the
    AGE macro variable.


    If you look at the default task footnote setting in the Tasks General section
    of the Options dialog, you will see some of the predefined macro variables in
    use, and also another macro function.


    The default footnote looks something like this:


    > Generated by the SAS System (&SASSERVERNAME, &SYSCPL) on %SYFSUNC(DATE(), EURFDE9.)
    at %SYFSUNC(TIME(), TIMEAMPMS.)


    &SASSERVERNAME is set by SAS Enterprise Guide and gives the name of the server
    on which the generated SAS code will be run.


    &SASSCPL is set by SAS and shows the operating system of the server on which the
    generated SAS code will be run.


    %SYFSUNC is a macro function that enables you to run most SAS functions and format
