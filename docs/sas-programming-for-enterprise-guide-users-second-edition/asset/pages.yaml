    # Extra SAS Graphical Output


    As new versions of SAS come out, new graph types are added to the gallery of available
    graphs. The last major SAS release introduced two new graph types, bar line and
    area bar. When SAS Enterprise Guide 4 was released, a new Bar Line task was added,
    and there is not yet a task for area bar. In this section, we look at what the
    area bar chart is, and see a relatively painless way of producing one.'
