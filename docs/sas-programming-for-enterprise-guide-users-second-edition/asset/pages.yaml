  md: 'PROC FORMAT CNTLIN=bondformat;

    RUN;


    This code reads in the BONDFORMAT table and creates the $BONDFORMAT format from
    it. Add the FMTLIB option if you want to check that it worked.


    Finally, right-click on the table and use the link facility to link the data set
    to the code so that you can easily rerun the whole thing in the future.


    Figure 6.7 Linked process flow creating a format from data


    ![](img/47cb3fb6301eb31415fa0b5e0922f416_137_0.png)


    The $BONDFORMAT format is now an ordinary format and can be used exactly the same
    as the other formats we have looked at in this chapter.


    The three columns we used are the minimum you must specify for this to work. Optionally,
    you can use a series of other columns to allow for the other format facilities
    we have looked at—ranges and multilabel formats, for example. Consult the PROC
    FORMAT documentation for a full list.


    If necessary, you can create a table from a format by using the CNTLOUT option.


    # Creating Informants


    Informants are used to view data held in SAS in a different way. Informants are
    used when you bring data into SAS from a raw data file. In SAS Enterprise Guide,
    you typically specify them as the Source informant when using the Import Data
    task.


    SAS provides a comprehensive list of informants that deal with all of the common,
    and some quite unusual, requirements.


    To define your own informant, you still use the FORMAT procedure, this time with
    an INVALUE statement. The following example translates “Male" to “M" and “Female"
    to “F", regardless of the case of the incoming data.'
  merge: -1
  pgno: 137
- img_proc: true
  md: "```\nPROC FORMAT LIB=work;\nINVALUE $gender (UPCASE)\n  \"MALE\" = \"M\"\n\
    \  \"FEMALE\" = \"F\"\n;\n```\n\nThere is very little difference between this\
    \ statement and the VALUE statement we looked at earlier. Notice the UPCASE option,\
    \ which unfortunately is not available on the VALUE statement. It ensures that\
    \ the incoming data is converted to uppercase before the conversion rules are\
    \ evaluated.\n\n# # Summary\n\nIn this chapter, we saw how SAS Enterprise Guide\
    \ creates formats, and then saw additional formats that can be created with code.\
    \ These included multilabel formats, numeric formats, and date formats.\n\nWe\
    \ also saw how to create formats from a table and build our own informats.\n\n\
    # # Where to Look for More Information\n\nTo find more information on creating\
    \ and using formats, see either the online documentation or the SAS Enterprise\
    \ Guide Help. Appendix A contains directions for accessing both.\n\nIt is also\
    \ worth searching the SAS Customer Support Center Web site at support.sas.com.\
    \ This site includes answers to Frequently Asked Questions and a number of papers\
    \ presented at user group meetings. An unsupported custom task for picture formats\
    \ is available from the Documentation tab at support.sas.com/eguide under the\
    \ “Extending SAS Enterprise Guide with Custom Tasks” link, as is a task for creating\
    \ formats from a data set.\n\nThe following SAS Press book also provides detailed\
    \ coverage of formats:\n\n+   - The Power of PROC FORMAT by Jonas Bilenas."
