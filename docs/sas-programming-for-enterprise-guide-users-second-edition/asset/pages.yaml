    \ actor has been in. Include the actor's name in the title.\n\n# Solution\n\n\
    Complete the following steps:\n\n+   - Select the results from the previous Query\
    \ Builder task.\n- Select Describe->List Data.\n- Move title to the List variables\
    \ role. Move actor to the Group analysis by and Page by roles.\n- Save the task.\n\
    - Right-click the task and select Properties, and then Results. Override the output\
    \ so that no results are produced."
