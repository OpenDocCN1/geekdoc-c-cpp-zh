  md: '# Introduction


    Formats are one of the most deceptively powerful features of SAS.


    The Create Format task in SAS Enterprise Guide focuses on formats that display
    a character string instead of one or more values in the data to be formatted.
    Even something that simple enables improved understanding and grouping of data,
    as well as easy type or value conversion.


    There are other types of formats, though. Try understanding a SAS date without
    a date format, for example. Using the FORMAT procedure, you can create your own
    date, time, or number formats.


    If you read data in external sources, you probably use formats to ensure that
    the data follows certain rules and is correctly converted to SAS data. Again,
    you can create your own informs using the FORMAT procedure.


    Finally, you can even eliminate some simple table joins and avoid creation of
    intermediate tables or views by creating formats from a table.


    This chapter quickly reviews what the Create Format task does and introduces you
    to these new uses of the FORMAT procedure.


    # Basic Formats: The Create Formats Task


    Let’s start by looking at the code the Create Format task generates, and see how
    we can build on that.


    Open a SAS Enterprise Guide project and create a format (Tasks→Data→Create Format)
    in the WORK library. Call it “gender” and use it to translate the letter “M” as
    “Male” and the letter “F” as “Female.” The two screens for the task should look
    something like this:'
  merge: -1
  pgno: 123
- img_proc: true
  md: '# Chapter 6: Seeing Data Differently 109


    # Figure 6.1 Options for the "gender" format


    ![](img/47cb3fb6301eb31415fa0b5e0922f416_124_0.png)


