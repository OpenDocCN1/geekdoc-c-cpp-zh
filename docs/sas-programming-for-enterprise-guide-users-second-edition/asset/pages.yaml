    # Detail Pies


    Another feature available via SAS/GRAPH but not directly through SAS Enterprise
    Guide is a detail pie. This type of graph is probably not quite as useful as other
    pie charts, but can occasionally help to show valuable information. A detail pie
    has each pie segment subdivided by another level. In the following example, we
    have produced a pie chart of our EGPROG:CLASS data with each pie showing the frequency
    of each age. Each age segment is then subdivided by gender.'
