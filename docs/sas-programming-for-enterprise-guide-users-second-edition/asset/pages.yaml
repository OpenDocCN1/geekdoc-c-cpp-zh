    CHECK (SecChange in ("U"

    ```


    This time we have also specified our own message, which is written to the log
    if an attempt is made to write data that violates the constraint.


    The main point of constraints is to ensure that only valid data is on file. When
    you try to apply a constraint, the first thing that happens is a check of the
    existing data. If the existing data fails the constraint, the constraint is not
    applied.


    It is important that the employee identification code on our employee master file
    is unique. This can easily be achieved with a constraint.


    ```

