- img_proc: true
  md: '# Introduction


    Enough theory. In this chapter we introduce some techniques that work on any SAS
    Enterprise Guide task.


    We start by looking at some of the options you can set to alter the way SAS Enterprise
    Guide and your programs work, and then we move to some macro techniques to enhance
    reusability. We next look at the Output Delivery System (ODS)—how SAS Enterprise
    Guide uses it and how it can be enhanced with relatively little effort.


    Again, you need to have access to SAS Enterprise Guide to work through the examples.


    # Getting Ready to Face the World


    Would you like the projects you develop to be usable anywhere in the world? Even
    if your company does not yet have offices in other countries, it could happen.
    Why not get ready for it now?


    A whole series of formats and functions available in SAS Enterprise Guide, prefixed
    with the letters “NL”, are part of the SAS National Language Support system.


    It is possible to use some of the formats in a restrictive way by including country
    details in the name of the format. However, this approach is cumbersome, and converting
    the project for another country could take a huge effort.


    For example, you could format your currency using DOLLAR12.2 or, more properly
    in recent versions of SAS, using NLMNUSD12.2 (NL = National Language, MN = Money,
    L = Local Currency Symbol, USD = United States Dollars). If you wanted to work
    on some data from the British office, or let the British office use your SAS Enterprise
    Guide project, then you would have to go through every currency format and change
    it to NLMNLGBP12.2.


    The good news is that you can create your projects in such a way that you need
    to make only one change for all the currency, dates, and times to be displayed
    in the preferred format of a selected country, and for the correct language to
    be used throughout. You just need to tell SAS Enterprise Guide where you are and
    use the general versions of the National Language formats.'
  merge: -1
  pgno: 53
- img_proc: true
  md: '# Chapter 3: Getting Started 39


    # # We Know Where You Live


    You can let SAS Enterprise Guide or SAS software know which country to use by
    setting a system option using the OPTIONS statement. This is a global statement
    that can be used anywhere, not just within a step. It can be used for far more
    than just setting your location, but many of the things you would normally use
    it for can be set using the SAS Enterprise Guide Options dialog box.


    If you want this setting to be available for all of the code and tasks in all
    of your projects, you could include it as part of the server start-up as described
    in the Chapter 2, but this would not be included if you decided to export the
    code. To overcome this problem, you will insert the statement as custom code.


    To do this, first select **Tools→Options→Tasks→Custom Code**. Select the **Insert
    custom SAS code** before task and query code check box and click **Edit** to open
    the code editor window.


    Type in **OPTIONS LOCALE=''en_US''** and click the **Save** button. You are now
    officially in the United States of America.


    Figure 3.1 Setting your locale for all tasks


    ![](img/47cb3fb6301eb31415fa0b5e0922f416_54_0.png)


    If you want to start working on data in Great Britain, then you just set the locale
    to ''en_GB''. Make sure you insert the same code before Program nodes as well.


    What if you want to set a different location, say France or Venezuela? A full
    list of locale settings is available in the SAS online documentation at support.sas.com.'
  merge: -1
  pgno: 54
