    # Improving Titles


    When you use the task windows to create SAS Enterprise Guide titles and footnotes,
    you usually enter enter text, macro variables, or macro functions. You can enter
    some other things into these windows as long as some options are first.


    If you use TITLE or FOOTNOTE statements in the Enter Code window instead of the
    task window, you also get some positioning and formatting capability. In this
    section, we look at each of these techniques.'
  merge: -1
