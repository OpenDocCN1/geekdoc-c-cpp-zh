  md: '# # Appendix C


    # ## Data Used in This Book


    All of the data used in this book is downloadable from the author page for this
    book at support.sas.com/constable. Download the data into a directory on your
    computer.


    For the examples to work as written, you need to assign the EGPROG library to
    your download directory. This can be done in one of three ways:


    +   - Issue a LIBNAME statement in a Program node. Use the following code, for
    example:

    ```LIBNAME EGPROG ''yourdir'';```


    +   - Use the Assign Project Library task under the Tools menu.

    - Create a library by using the SAS Enterprise Explorer, also under the Tools
    menu.


    The rest of this chapter describes the data used.'
