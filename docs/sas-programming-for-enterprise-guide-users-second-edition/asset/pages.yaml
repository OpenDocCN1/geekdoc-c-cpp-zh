  md: '# Chapter 3: Getting Started 63


    If you ran the task after making these settings, it would not give you any output,
    and you would see a warning triangle on the process flow icon. At some point in
    the log, you would see the following warning message:


    WARNING: No output destinations active.


    Now that we have told SAS Enterprise Guide that we are going to look after things
    ourselves, we need to tell it what we want to do. The main statements that are
    used to control ODS output come in pairs. The first statement says where your
    output will go from that point on, and it looks something like this:


    ```

    ODS HTML FILE="c:\temp\myfile.html";

    ```


    The ODS at the beginning identifies this as an ODS statement. HTML specifies that
    we want our output to be HTML format. Some common values here include PDF, RTF,
    SASREPORT, and CSVALL. Finally, the FILE= option specifies where you want your
    얼마 file written to. Try to make sure that you use the correct file extensions
    on your files. Otherwise SAS Enterprise Guide might have difficulty displaying
    them.


    There are many other options and variations on this statement, which we will see
    as we progress through the book.


    After this statement, all output goes to the identified file in the format requested.
    It keeps going there until the file is closed. It is up to when you close the
    file manually. If you don''t close the file, then SAS Enterprise Guide tends to
    do it automatically at the end of a task anyway.


    To close the file manually, you need another ODS statement like this:


    ```

    ODS HTML CLOSE;

    ```


    Let''s put it into practice. Open up your List Data task and click **Preview Code**
    and then **Insert Code**. Insert the first ODS statement immediately before the
    PROC PRINT statement, and the second one immediately after the matching RUN statement.'
