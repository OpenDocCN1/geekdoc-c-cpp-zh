  md: '# Linking Formats


    An extremely powerful feature of formats is the ability to link formats together.
    Let’s suppose that you want to analyze sales over time. You want to see recent
    activity summarized by month, but need to see older information only by quarter.
    This format would give you what you need:


    ```

    PROC FORMAT LIB-WORK;

    VALUE history

    LOW < ''01JAN2000''d'' = [YYQ6];

    ''01JAN2000''d'' - HIGH = [YYMM7];

    ```


    Before the equal sign we are using the keywords LOW and HIGH, and a SAS date constant
    to break our dates down into those before January 1, 2000, and those that include
    date or later.


    After the equal sign is the name of an existing format enclosed in square brackets.
    So this will apply the YYQ format to the earlier dates and the YYMM format to
    the later ones.


    You can use this technique to call SAS formats or ones you have defined yourself.


    # Using Formats as Look-up Tables


    One last thing to mention formats is that you do not have to type in all the rules
    yourself. If the information is held in a data set, then with a little bit of
    manipulation you can create the format from it.


    Look back at the tables we joined in Chapter 4. If we wanted a list of James Bond
    films with a note of which actor played James Bond, we would have to join the
    tables and report from the new table. Joining small tables like these would be
    practical, but imagine if you were dealing with large tables. Think of the processing
    time, input/output operations, memory, and disc space that would be necessary
    just to get one piece of information from a look-up table.


    If you want only one piece of information, and the number of possible values is
    relatively small, then creating a format from the look-up table and using that
    format in the reporting procedure can be a good alternative.'
  merge: -1
  pgno: 135
- img_proc: true
