    - Double-click just before the PROC PRINT statement and insert the following code:

    ```

    OPTIONS NOBYLY;

    ODS HTML FILE=''C:\temp\bond.html'' NEWFILE=PAGE;

    ```

    - Return to the main task window and select the Titles pane. Override the default
    text and insert text similar to the following:

    List of James Bond Films starring #BYVAL(actor)

    - Run the task.


    # Chapter 8: Graphical Output


    +   1. Develop a three-dimensional pie chart based on the PROMOTIONS table showing
    the number of products in each promotion. Set up a prompt to supply the name of
    a pie segment to explode.


    Solution


    Complete the following steps:


    +   - Add the PROMOTIONS table to your project and select it.

    - From the Graph menu, select Pie Chart and select Simple Pie as the type of pie
    chart.

    - In the Task Roles pane, move Name to the Column to chart role.

    - Select Preview code, and then Insert Code.

    - Double-click just before the semicolon at the end of the PIE3D statement, and
    insert the following code:

    ```

    EXPLODE="&pie"

    ```

    - Return to the main task window and select Properties, and then click the Edit
    button.

    - Go to the Prompt window.

    - Click the Prompt Manager button, and then click Add.

    - Enter a meaningful display name, and a SAS code name of pie.

    - Complete the Data Type and Values tab so that it looks like Figure D.7. You
    can either enter values or load them from the promotions table.'
