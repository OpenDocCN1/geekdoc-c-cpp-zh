- img_proc: true
  md: "# Chapter 3: Getting Started\n\nThis is a global setting, so it means that\
    \ all subsequent projects will not filter out unused variables. This setting could\
    \ reduce efficiency.\n\nIn this example we have used a numeric column to illustrate\
    \ both prompting and the WHERE statement in use. If you are working with a character\
    \ column, things are slightly easier. You do not have to insert a WHERE statement,\
    \ the name of a macro variable can be typed in the edit window when filtering\
    \ a character column.\n\nFor example, if you wanted to subset on the Sex column,\
    \ then you could create a character prompt called SEX with a choice of the values\
    \ M and F, and in the edit window type&SEX as the operand.\n\n**Figure 3.14**\
    \ Using a character prompt in the Edit Data and Filter window\n\n![](img/47cb3fb6301eb31415fa0b5e0922f416_70_0.png)\n\
    \nYou could also switch to the Titles window and include&SEX as part of the title—something\
    \ like **Students WHERE sex = &SEX**. You would still need to edit the task properties\
    \ manually to make SAS Enterprise Guide Guide aware that you were using a prompt.\n\
    \nBefore we leave the subject of macro variables, let's see how they are created.\
    \ Switch to the **Code** tab on the List Data task you just created with a filter\
    \ on sex. You will see a line near the top that looks something like this:\n\n\
    ```\n%%LET SEX = M;\n```\n\nIf you cannot see this line, select **Tools$\rightarrow$Options$\r\
    ightarrow$Tasks General** and make sure the **Display all generated SAS code**\
    \ in task output check box is selected. Then rerun the task."
  merge: -1
