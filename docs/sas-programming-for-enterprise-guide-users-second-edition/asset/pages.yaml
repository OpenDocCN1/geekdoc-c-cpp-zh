- img_proc: true
  md: 'When SAS Enterprise Guide was developed, it was recognized that it would not
    be practical to make everything that SAS can do available through tasks. This
    would have made the SAS Enterprise Guide application extremely large and much
    harder to use. Some decisions were made about what to put in and what to leave
    out. Just to make sure that everything was still possible, the SAS Enterprise
    Guide developers included several ways for people to insert SAS code into their
    work.


    So people were introduced to SAS Enterprise Guide as the easy way into SAS. When
    they found out that they needed to get more out of SAS, they were sent to SAS
    programming courses. What this book seeks to do is introduce the parts of SAS
    code that complement SAS Enterprise Guide, without re-inventing the things that
    SAS Enterprise Guide does well.


    In the rest of this chapter we will look at just a few examples of the ways in
    which you can extend SAS Enterprise Guide by the addition of SAS code. You will
    see many examples as you work through the book.


    # Examples of Enhancing the Generated Code


    As previously mentioned, the tasks in SAS Enterprise Guide generate SAS code.
    The majority of the tasks allow users to insert extra code at predetermined points
    in the generated code, enhancing the functionality of the tasks without affecting
    the user''s ability to manipulate the task through the user interface. We will
    look in detail at the generated code and methods of inserting code in Chapter
    2. Let''s have a quick look now at some of the things you can do by inserting
    code into a task.


    Look at the pie chart in Figure 1.5. Can you see something there that you cannot
    do using the point-and-click Pie Chart task or Pie Chart wizard?'
  merge: -1
  pgno: 23
- img_proc: true
  md: '# Chapter 1: Why Do I Need to Write Code? 9


    Figure 1.5 Pie chart with exploded slice


    ![](img/47cb3fb6301eb31415fa0b5e0922f416_24_0.png)


    > Trivia

    It is thought that Florence Nightingale was the person who first came up with
    the idea of showing proportions as segments of a pie. She used it to illustrate
    mortality rates from poor sanitation during the Crimean war.


    Notice the way that the GAMES slice is exploded out from the rest of the pie.
    This is a great way to emphasize a specific point. The SAS Enterprise Guide task
    does not enable you to do this, but SAS code does it. All it takes is the insertion
    of two words into your task.


    We will look at ways to improve graphical output in Chapter 8, but there are many
    examples throughout the book of other hidden bits of SAS functionality that you
    can use, often with a few words of code inserted.


    # Figure 1.6 List data of students aged 13 or older


    | Name | Sex | Age | Height | Weight |

    |---|---|---|---|--|

    | Alfred | M | 14 | 69.0 | 112.5 |

    | Alice | F | 13 | 56.5 | 84.0 |

    | Barbara | F | 13 | 65.3 | 98.0 |

    | Carol | F | 14 | 62.8 | 102.5 |

    | Henry | M | 14 | 63.5 | 102.5 |

    | Janet | F | 15 | 62.5 | 112.5 |

    | Jeffrey | M | 13 | 62.5 | 84.0 |

    | Judy | F | 14 | 64.3 | 90.0 |'
  merge: -1
  pgno: 24
- img_proc: true
  md: 'The first thing you might notice is that the highlighting on the Weight column
    differs from cell to cell. The color of the background is actually dependent on
    the value in the cell; in this case it is set to have a red background only if
    the weight is greater than 100. This technique of conditional highlighting, sometimes
    known as trafficlighting, can be used to focus people''s attention on certain
    areas that are less likely to overlook important information. This effect is slightly
    more complicated to achieve than the previous one, but still quite straightforward.
    We will see how we can do this in Chapter 7.


    There are two other techniques used in the production of this report that only
    become apparent if you look at the process flow used to create the report.


    # Figure 1.7 Named output in a process flow


    ![](img/47cb3fb6301eb31415fa0b5e0922f416_25_0.png)


    The Create Format task at the start of the process flow is where the rules are
    defined for the conditional highlighting.


    Look back at the report and you will see that it is only for students aged 13
    or over. Look at the process flow and you will see a question mark on the List
    Data icon. The question mark indicates that you will be prompted for information
    at run time. In this case, you will be prompted for the age limit. Edit button
    in the Data section of a task enables you to do some filtering of your data. It
    will not allow you to do complex filtering of the sort that can be done in the
    Query Builder. With a bit of persuasion, it will enable you to prompt for character
    values, but it will not allow you to prompt for numeric values in this example.
    You can get these extra capabilities by adding a single line of code into almost
    any SAS Enterprise Guide task. Although it is not significant on a small data
    set like this, on a large data set the savings from not reading the data twice
    are enormous.


    Finally, look at the name of the HTML document produced. Exporting a document
    in SAS Enterprise Guide enables you to completely overwrite the document each
    time, or create a completely new version each time by adding a date-and-time stamp
    to the name. If you look closely, you will see that the name of this document
    includes only the year and month. Inserting two lines of code increases the flexibility
    you have when naming your output files. With the data extraction, you can use
    this technique in any task that creates a report.'
  merge: -1
  pgno: 25
- img_proc: true
  md: 'Chapter 1: Why Do I Need to Write Code? 11


    We will look in more detail at both of these techniques and many more in Chapter
    3.


    # Examples of Writing Your Own Code


    In the previous section, we looked at a few of the things you can achieve by adding
    small pieces of code to the code that is generated by SAS Enterprise Guide. There
    might be occasions when you need to develop some code of your own in a Program
    node. Chapter 2 we will look at the Program node in general, but again here we
    will just look at a couple of examples of why you might want to do this.


    First look at the summary section of this report.


