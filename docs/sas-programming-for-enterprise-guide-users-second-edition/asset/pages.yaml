  md: "# Appendix D: Solutions to Exercises 269\n\n```\nADD CONSTRAINT valid date\n\
    CHECK (startdate < enddate)\nMESSAGE = 'Start Date must be before End Date';\n\
    DESCRIBE TABLE egprog.empdept;\n```\n\n```\nALTER TABLE egprog.zoneaccess\nDROP\
    \ CONSTRAINT valid_date\nADD CONSTRAINT valid_date\nCHECK (startdate < enddate)\n\
    MESSAGE = 'Start Date must be before End Date';\nDESCRIBE TABLE egprog.empdept;\n\
    QUIT;\n```\n\nThe DESC TABLE statements are there only to enable you to see that\
    \ the constraints have been added. The DROP CONSTRAINT clause ensures that the\
    \ code will work even if the constraint already exists.\n\n# Chapter 5: Data Manipulation\
    \ Part 2: DATA Step and Functions\n\n+   1. We already have a products table AS_PRODUCTS,\
    \ so we do not need to maintain the product names in our promotion table. Equally,\
    \ we should not need to repeat the promotion detail for every product. Use the\
    \ techniques in this chapter to create two tables from AS PROMOTIONS.\n\n+   -\
    \ The first table lists each promotion with details.\n- The second table lists\
    \ promotions and products via a simple table containing the promotion and product\
    \ IDs.\n\n# Solution\n\nIn a Program node, enter statements similar to the following:\n\
    \n```\nDATA promotions\n  (KEEP=promotion promo_name promotion_description\n \
    \ start_date end_date)\n  promotion_product(KEEP=promotion product_code);\nRETAIN\
    \ Promotion;\nSET egprog.as_promotions;\nIF promotion_id NE \"\" THEN DO;\n  promotion=promotion_id;\n\
    \  start_date=DATEPART(start_date);\n  end_date=DATEPART(end_date);\n  OUTPUT\
    \ promotions;\nEND;\nOUTPUT promotion_product;\n```"
