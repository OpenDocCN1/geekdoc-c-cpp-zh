  md: '# Chapter 2: Understanding Coding with SAS Enterprise Guide 25


    edge of the highlighted box, at which point the cursor changes shape to a cross
    without arrows. Click and hold the left mouse button, and then draw a line to
    the task you want to link to. Use linking whenever you add a Program node; it
    clarifies what the process flow is doing with very little effort.


    Finally, in the absence of process flow connections, the position of the program
    within the process flow affects the order in which things runs. Unconnected items
    starting from the top left corner working down towards the bottom right corner.


    In this example, the order is determined purely by position. I have named the
