  md: '# 58 SAS Programming for Enterprise Guide Users, Second Edition


    To extract the first letter we will use the macro function %SUBSTR, so if you
    have used the


    Most macro functions are very closely related to a SAS function, like the SAS
    function SUBSTR, then you already know how to use the macro function. Just to
    recap, the function takes three arguments: the string you want to extract from,
    the position you want to start extracting from, and optionally the number of characters
    you want to extract. If you omit the last argument, then all characters up to
    the end of the string are extracted. So what we need to do is to insert a WHERE
    statement in our code that looks like this:


    ```

    WHERE Sex = "%SUBSTR(&sex, 1, 1)";

    ```


    Insert it at the same place we inserted the WHERE statement in the age example.


    So, we are extracting information from whatever is in &sex, starting from the
    first character and taking one character. In other words, we get the first letter
    only.


    With a slight variation, you could use the normal SAS function here and it would
    give you the same result. The equivalent would be the following:


    ```

    WHERE Sex = SUBSTR("&sex",1, 1)",

    ```


    This would be marginally less efficient, because the SAS function would be executed
    for every row read. The macro function is executed only once, when the code is
    processed before being executed. From then on it is seen as fixed text.


    Before you finish improving your WHERE clause, there is one last change you could
    make to give complete flexibility.


