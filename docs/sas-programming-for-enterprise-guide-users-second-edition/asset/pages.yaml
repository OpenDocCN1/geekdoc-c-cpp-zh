  md: '# Chapter 7: Enhancing Report Output 163


    # Figure 7.27 User code for PDF and HTML destinations


    ![](img/47cb3fb6301eb31415fa0b5e0922f416_178_0.png)


    Free free to add any options you like to the first ODS HTML or ODS PDF statements.


    The third statement is one that we have not seen before. It enables you to write
    free text to any or all of the ODS destinations. Just specify the destination
    in place of the HTML. In this case we are writing the text only to the HTML destination
    and not the PDF destination.


    The text we are writing includes some hardcoded HTML, which looks like this:


    ```

    <a HREF=''c:\temp\myfile.pdf'' TARGET=''_blank''>Printable

    Version</a>

    ```


    The ODS HTML TEXT= statement does not allow for any of the options that are allowed
    on the FOOTNOTE and TITLE statements, so anything we want to do will have to be
    done by coding our own HTML.


    The first part specifies an anchor point, which is what a hyperlink is called
    in HTML. The link is to c:\temp\myfile.pdf. In addition, we have included TARGET=''_blank'',
    which forces the output to open in a new browser window.


    ```

    <a HREF=''c:\temp\myfile.pdf'' TARGET=''_blank''>

    ```


    The person viewing the form will see the words "Printable Version." in the top
    left corner of the HTML.


    The </a> tag ends the definition of the anchor point.


    Click OK on this window, return to the task, and run it. The top of your HTML
    output should look like Figure 7.28.'
