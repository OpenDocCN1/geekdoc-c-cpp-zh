- img_proc: true
  md: "# Formatting Numbers\n\nYou might need to format numbers by inserting special\
    \ characters into them. suppressing leading zeros, multiplying by a factor, or\
    \ filling unused digits. As an example, we might want to hold a 16-digit credit\
    \ card number as a numeric value so that it only takes up 8 bytes of storage,\
    \ but display it in four groups of four as it appears on a credit card. The following\
    \ code would do:\n\n```\nPROC FORMAT LIB=WORK;\n  PICTURE CCFORMAT = \"9999 9999\
    \ 9999 9999\";\nRUN;\n```\n\nThe basic structure is very similar to the procedure\
    \ we saw previously.\nNotice that we are using a PICTURE statement instead of\
    \ a VALUE statement, and that only numeric formats are allowed, so the name never\
    \ starts with a dollar sign.\n\nThe range specification is exactly the same as\
    \ the VALUE statement, except that it allows only numeric values. In this case,\
    \ we use the OTHER keyword as a range, so all values are processed in the same\
    \ way.\n\nThe main difference comes after the equal sign (=). What appears is\
    \ a substitution string. Each numeric value in the string is replaced by a number\
    \ from the incoming data. After the first number is displayed, any non-numeric\
    \ characters in the string are copied to the output unaltered. So if this format\
    \ were applied to the number 1111111111111111, the number would be displayed as\
    \ follows:\n\n```\n1111 1111 1111 1111\n```\n\nExactly we will result.\nA slightly\
    \ more complex example might be to specify an alternative way of showing percentages.\
    \ SAS has two alternative percentage formats. One format displays negative percentages\
    \ surrounded with parentheses (PERCENTwd); the other displays negative percentages\
    \ with a minus sign (PERCENTNwd). If you wanted a slightly different one, one\
    \ in which the percentage was always in parentheses and always had a minus sign\
    \ for negative percentages? The following code would achieve that:\n\n```\nPROC\
    \ FORMAT LIB=WORK;(DEFAULT=9)\n  PICTURE NEGPERC\n    LOW < 0 = \"09.99%%\" PREFIX=\"\
    -\"\n    0 - HIGH = \"09.99%%\" PREFIX=\"\";\nRUN;\n```\n\nNotice that we now\
    \ have a default length after the name. This ensures that the width is large enough\
    \ to accommodate the parentheses, minus and percent signs, two integers, a decimal\
    \ point, and two decimal places."
  merge: -1
  pgno: 129
- img_proc: true
  md: "# Chapter 6: Seeing Data Differently 115\n\nThis time we have used two ranges,\
    \ one to handle formatting of negative numbers and one for non-negative numbers.\n\
    \nThere are also a couple of differences after the equal sign (=). First, we are\
    \ using a mixture of zeros and nines for our substitution string. By using zeros,\
    \ we are saying that we do not want to see any leading zeros before the first\
    \ non-zero character. Next, we have included a percent sign and a close parenthesis\
    \ as part of the string. Finally, we are specifying a prefix of an open parenthesis\
    \ and a minus sign for negative numbers, and an open parenthesis only for positive\
    \ numbers and zero. The characters in the prefix float next to the first non-zero\
    \ digit displayed. Table 6.2 shows some examples of different data values displayed\
    \ with this format.\n\n# Table 6.2 New format in action\n\n| Unformatted | Formatted\
    \ |\n| --- | --- |\n| 10.00 | (10.00%) |\n| -10.00 | (-10.00%) |\n| 1.00 | (1.00%)\
    \ |\n| -1.00 | (-1.00%) |\n| 0.10 | (0.10%) |\n| -0.10 | (-0.10%) |\n| 0.01 |\
    \ (0.01%) |\n| -0.01 | (-0.01%) |\n\nThe built-in SAS percentage formats actually\
    \ work on a decimal value. In addition to adding in the special characters, they\
    \ also multiply the value by 100. If you wanted the format to behave in the same\
    \ way, then there is an option for that, too. The following code gives our created\
    \ example:\n\n```\nPROC FORMAT LIB=FMTLIB;\n  PICTURE NegPerc (DEFAULT=9)\n  \
    \  LOW < 0 = \"09.99%\"\n    (PREFIX=\"-\" MULTIPLIER=10000)\n    0 - HIGH = \"\
    09.99%\"\n    (PREFIX=\"-\" MULTIPLIER=10000);\n```\n\nRUN;"
  merge: -1
  pgno: 130
- img_proc: true
  md: '# 116 SAS Programming for Enterprise Guide Users, Second Edition


    The new MULTIPLIER option solves the problem for us. At first glance, it looks
    as if we are multiplying by far too large a value. In fact, the procedure was
    always doing a multiplication for us that was equal to the number of decimal places.
    Our new multiplier has to incorporate the multiplier for the normal decimal places
    as well as the extra multiplier we need.


    There are many occasions when you want to build your own picture format. This
    example of a PICTURE statement in the SAS Enterprise Guide Help shows a way of
    taking a figure such as $1,600,000 and displaying it as $1.6M.


    ```

    PICTURE million LOW-HIGH=''00.0M''

    PREFIX=''$ MULTIPLIER=.00001);

    ```


    After you have created your format, you can use it in code as shown in various
    examples throughout this book. You can also use it in the SAS Enterprise format
    selection window as long as the format is stored in one of the locations SAS Enterprise
    Guide is aware of.


    # Formatting Dates and Times


    Another use of the PICTURE statement is to allow you to develop your own date,
    time, or datetime formats. The following code would create a format that shows
    7th January 2007 as Day 1 of week 1 in the year 2007.


    ```

    PROC FORMAT LIB=WORK FMTLIB;

    PICTURE = mydate

    OTHER = "Day %w of week %U in the year %Y" (DATATYPE=date);

    RUN;

    ```


    The things to note here are the special directives %w, %U, and %Y in the display
    string. To use these directives, you must specify the DATATYPE=DATE option. TIME
    and DATETIME are also valid settings for the DATATYPE=option.


    The list of available directives is shown in Table 6.3.'
  merge: -1
  pgno: 131
- img_proc: true
  md: '# Chapter 6: Seeing Data Differently 117


    Table 6.3 Date and time format directives

    | | |

    | --- | --- |

    | %a | Locale''s abbreviated weekday name |

    | %A | Locale''s full weekday name |

    | %b | Locale''s abbreviated month name |

    | %B | Locale''s full month name |

    | %d | Day of the month as a decimal number (1–31), with no leading zero |

    | %H | Hour (24-hour clock) as a decimal number (0–23), with no leading zero |

    | %l | Hour (12-hour clock) as a decimal number (1–12), with no leading zero |

    | %j | Day of the year as a decimal number (1–366), with no leading zero |

    | %m | Month as a decimal number (1–12), with no leading zero |

    | %M | Minute as a decimal number (0–59), with no leading zero |

    | %p | Locale''s equivalent of either a.m. or p.m. |

    | %S | Second as a decimal number (0–59), with no leading zero |

    | %U | Week number of the year (Sunday as the first day of the week) as a decimal
    number (0,53), with no leading zero |

    | %w | Weekday as a decimal number (1= Sunday, 7=Saturday) |

    | %y | Year without century as a decimal number (0–99) |

    | %Y | Year with century as a decimal number |


    You will see that quite a few of the options depend on the locale discussed in
    Chapter 3 to ensure that they display things correctly. This is another good reason
    for making sure the locale is set correctly.


    # Multilabel Formats


    Generally you want each data value to be displayed in only one way. There might
    be some circumstances, however, in which you want a value to be counted in several
    ways. For example, you might want to consider a percentage score in bands of ten,
    but not with a'
  merge: -1
  pgno: 132
- img_proc: true
  md: "# 118 SAS Programming for Enterprise Guide Users, Second Edition\n\nFail, Pass,\
    \ or Distinction category. Multilabel formats enable you to accomplish this type\
    \ of classification.\n\nIn this example, we categorize ages from the CLASS data\
    \ set in two different ways—first by a simple range, and by whether the student\
    \ qualifies as a teenager.\n\n```\nPROC FORMAT LIB=WORK;\n  VALUE agegroup (MULTILABEL\
    \ NOTSORTED)\n    11-13 = \"11 to 13 years old\"\n    14-16 = \"14 to 16 years\
    \ old\"\n    11-12 = \"Pre-Teenager\"\n    13-16 = \"Teenager\";\n```\n\nRUN;\n\
    \nWithout the MULTILABEL option, this code would produce an error as a result\
    \ of overlapping ranges. Currently, only the MEANS (Summary Statistics task) and\
    \ TABULATE (Summary Tables task) procedures support multilabel processing. Appendix\
    \ A for information on using multilabel formats in those procedures. If you use\
    \ a multilabel format elsewhere, the formatted value returned is the first value\
    \ in the list. Using the NOTSORTED option ensures that you get the value you want.\
    \ Without this option, the values might be sorted into a different order and you\
    \ would lose control of what appears first.\n\nTo see the sort of output, first\
    \ run the PROC FORMAT code shown previously in a Program node to create the agegroup\
    \ format.\n\nThen create a Summary Statistics task on EGPROC.CLASS. Assign Height\
    \ and Weight to the Analysis variables role, and Age to the Classification variables\
    \ role. Apply the user-defined format agegroup to the Age variable by clicking,\
    \ selecting Properties, and clicking the Change button next to Format. Make sure\
    \ that you select the Allow multi-label formats check box at the right of the\
    \ Summary Statistics window. Figure 6.4 shows the resulting window.\n\nOn the\
    \ Statistics->Basic pane, set Maximum decimal places: to 2 and run the task.\n\
    Figure 6.5 shows the output from this task.\n\nWhen you use multilabel formats,\
    \ the output order is always the order of the formatted values."
  merge: -1
