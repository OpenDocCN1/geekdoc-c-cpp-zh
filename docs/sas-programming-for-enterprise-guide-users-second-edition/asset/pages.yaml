  md: '# Chapter 5: Data Manipulation Part 2: DATA Step and Functions 99


    In the real world, position does sometimes matter. Let''s assume we are casting
    for the school play and we need to find actors to play two female and two male
    giants. A good starting point would be the two tallest boys and the two tallest
    girls. Use the Sort Data as shown in Figure 5.1 to create a new data set called
    SORTEDCLASS, which has the data sorted by sex and by descending height.


    Figure 5.1 Sort Data task for CLASS


    ![](img/47cb3fb6301eb31415fa0b5e0922f416_114_0.png)


    If we look at the data shown in Figure 5.2, we can now see that it is grouped
    by sex, and within grouping the tallest come first. We now want a mechanism to
    automatically pick out the first two entries in each group—the tallest pupils
    of each sex. To achieve that, we need to be able to rank the records in each group
    so that we can isolate the first two, and we need to be able to reset the rank
    at the beginning of a new group.'
