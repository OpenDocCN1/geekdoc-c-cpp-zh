- img_proc: true
  md: '# Chapter 4: Data Manipulation Part 1: Queries 75


    JOIN, or FULL OUTER JOIN. The two methods of doing an inner join arise from the
    different ways that people implemented the standard. SAS accepts either.


    So far we have just looked the SELECT statement and seen the various ways we can
    to extract information from our data sets. One of the most powerful aspects of
    SQL is the ability to embed a SELECT statement as a clause within another statement.
    SAS Enterprise Guide uses SQL to create new tables or views as shown in these
    final examples:


    ```

    PROC SQL;

    CREATE TABLE FullList AS

    SELECT actor, title

    FROM EGPROG.BondActors INNER JOIN EGPROG.BondFilms

    on BondActors.BondNo = BondFilms.BondNo;


    CREATE VIEW FullListView AS

    SELECT actor, title

    FROM EGPROG.BondActors INNER JOIN EGPROG.BondFilms

    on BondActors.BondNo = BondFilms.BondNo;

    QUIT;

    ```


    Notice that after running this code you have a table or a view in your project
    that could be used as the input to any other query or task in SAS Enterprise Guide.
    Also notice you can have more than one SQL statement in PROC SQL step.


    So that''s it—the quickest introduction to SQL. I hope this discussion has given
    you enough knowledge to understand the queries that SAS Enterprise Guide generates
    for you. When you are using the Query Builder task, use the Preview button to
    see what is being generated. You will see the following relationships between
    actions in SAS Enterprise Guide and the generated code:


    +   - The TABLE statement is determined by the name you give your output.

    - The SELECT statement is produced by the columns you list in the Select Data
    pane.

    - Labels, format, and aliases are determined by the properties you set by using
    the Properties button or as part of the Computed Columns wizard.

    - New columns are created in the Computed Columns wizard.

    - Summary actions are assigned from the drop-down list on the Select Data pane
    or by using the Computed Columns wizard.

    - The FROM clause is determined by the table you start from plus tables you add.

    - Whether you get a view, report, or table is determined by selecting Options→Options
    for this Query.'
