- img_proc: true
  md: '# Chapter 3: Getting Started 41


    When using formats be aware that the order of precedence given by ANYDTDTEW.,
    ANYDDTDTMW., and ANYDTTMEW. are affected by the locale setting.


    There are also three National Language functions that you can use: NLDATE, NLDATM,
    and NLITIME. They enable you to generate a formatted string containing elements
    from a SAS date, time, or datetime. These do not currently appear in the SAS Enterprise
    Guide Advanced Expression Builder list or in the SAS Enterprise Guide help, which
    can be typed in hand. See the SAS Help and Documentation for complete information.


    Whenever you are dealing with formats, especially those for currency, remember
    that there might be occasions when you want to use the fixed format variations.
    For example, say you are doing a consolidation exercise bringing in data from
    various overseas operations into a single “book” currency. In that case, you would
    want to hardcode the currency formats with the data so that there is no misunderstanding.


    # A Final Word on Options


    If you want to see all the options that can be set, then insert a Program node
    into your project and type in the following lines:


    ```

    PROC OPTIONS;

    RUN;

    ```


    Run the code using whichever of the methods you prefer from Chapter 2. After the
    code runs, click on the Log tab. There you will see about 500 lines of options,
    starting with the “Portable Options” heading.


    The good news is that you really do not have to think about them. Many of them
    relate to features of SAS that are now superseded and are kept only to preserve
    backwards compatibility. Most of the others are controlled by the SAS Enterprise
    Guide Options dialog box (accessed by selecting Tools→Options) unless you specifically
    override them in your program.


    As we progress through this book, we introduce a few other options that might
    be of interest.


    # Query-Free Filtering


    If you have built a query with a filter in SAS Enterprise Guide, then you have
    already used something very similar to the WHERE statement.'
  merge: -1
