- img_proc: true
  md: '# Introduction


    Now we get down to some specifics, with the first of two chapters looking at manipulating
    information.


    SAS Enterprise Guide has a number of built-in methods of manipulating data. Behind
    the scenes, its primary tool for this task is Structured Query Language (SQL).
    This chapter introduces SQL and its use in SAS Enterprise Guide. It also demonstrates
    some of the advantages to be gained with a little extra SQL knowledge.


    # What Is SQL?


    Structured Query Language (SQL) is a programming language designed to work with
    the new breed of relational databases that emerged during the late 1970s and early
    1980s.


    Over time, relational database management systems (RDBMS) have become so accepted
    as a method of storing information that it is rare these days for primary data
    to be held anywhere else.


    For a database to be considered relational, it should follow thirteen rules that
    were originally proposed by Ted Codd, an IBM employee. For some reason, these
    rules are numbered from zero, and are referred to as "Codd''s Twelve Rules."


    Rule 5, the sixth of the thirteen, refers to the need for a comprehensive data
    sublanguage that must be capable of manipulating both the data itself and the
    structure of the database. That is where SQL comes in.


    > What''s in a Name? SQL originally known as "Structured English Language," giving
    the acronym "Sequel." Despite its renaming, many people still use the old pronunciation.
    Equally, many just call it by the initials S-Q-L. Don''t let anyone pretend to
    be superior to you because they use one form or another. Both are fine!'
  merge: -1
  pgno: 83
- img_proc: true
  md: 'Chapter 4: Data Manipulation Part 1: Queries 69


    SQL is generally seen as so easy to use that now it is even used to get to non-relational
    data. Indeed, the SAS native data storage does not come close to being relational,
    but still SQL can be used very efficiently.


    Though SAS has its own complete set of tools for data manipulation, it has enthusiastically
    embraced SQL as the tool of choice for most of its new GUI clients—including SAS
    Enterprise Guide. SQL is also generated by the SAS data manipulation language
    when a SAS/ACCESS engine is used to work directly from a third-party relational
    database—Oracle or Teradata, for example.


    To ensure that SQL remains independent, it has been adopted by the American National
    Standards Institute (ANSI) and the International Organization for Standardization
    (ISO). Unfortunately, the standard SQL definition does not allow the flexibility
    that many people believe they need, most organizations provide a version of SQL
    they add their extensions to provide extra capabilities. SAS is no exception.


    Whenever you are dealing with information, you need to have two things—the data
    and knowledge of what the data represents. A string of numbers such as 32443.54
    is of no use by itself. Once you know that it represents a monetary value, and
    that the value is the total sales of a particular product in a particular region
    during a particular time period, then it starts to become information. Generally,
    this information about data is known as metadata.


    SQL has two parts, the Data Manipulation Language (DML), which deals with the
    data itself, and the Data Definition Language (DDL), which sets up the metadata.
    In practice, they are often used together—for example, when creating a table (DDL)
    and populating it with information from other tables (DML).


    The SAS implementation of SQL is not complete, and it includes some extensions
    that are specific to SAS. But it is very thorough, and anyone familiar with standard
    SQL will be able to use it with very little training.


    Without additional programming, however, SAS Enterprise Guide does not enable
    you to do everything that SAS SQL does. In the following sections, we examine
    what else can be done with SQL, and the best way to do it in SAS Enterprise Guide.'
  merge: -1
  pgno: 84
- img_proc: true
  md: '70 SAS Programming for Enterprise Guide Users, Second Edition


    # Basic Queries: What SAS Enterprise Guide Does Already


    As an introduction, we start with the basic SQL that SAS Enterprise Guide generates
    for you. Understanding that will enable us to do more with our own SQL. We first
    look at what parts of the standard Query Builder task generate each part of SQL.


    We examine the Delete Data Sets and Formats task and the Append Data task, both
    of which use SQL.


    # The Query Builder Task


    When you are SQL in SAS, the SQL statements are bounded by two SAS statements.
    At the beginning is the PROC SQL statement, and at the end is a QUIT statement.
    It does not matter whether the statements are in uppercase, lowercase, or mixed
    case.


    ```

    PROC SQL;

    ...sql statements...

    ...sql statements...

    ...sql statements...

    QUIT;

    ```


    SAS Enterprise Guide makes sure that a QUIT statement is inserted even if you
    forget, but it is good practice to put it in yourself. Between the two statements
    you can have one or many SQL statements.


    Probably the simplest way to use SQL is writing a simple query using the SELECT
    statement. Create a new Program node in SAS Enterprise Guide and type in the following:


    ```

    PROC SQL;

    SELECT * FROM EGPROGRAM.CLASS;

    QUIT;

    ```


    SELECT is the SQL keyword to use when you want to extract all of data. The asterisk
    is a shorthand way of saying that you want to extract all of the columns. FROM
    precedes a list of table names, and EGPROGRAM:CLASS is the name of the table we
    want to read. So this statement says read all of the columns from EGPROGRAM.CLASS.
    The results are shown as a listing report on your screen.'
  merge: -1
  pgno: 85
- img_proc: true
  md: "# Chapter 4: Data Manipulation Part 1: Queries 71\n\nInstead of the asterisk,\
    \ comma-separated list of columns could have been provided, as follows:\n\n```\n\
    PROC SQL;\n  SELECT sex, name, age\n  FROM EGPROGRAM.CLASS;\n  QUIT;\n```\n\n\
    This example would just return the sex, name, and age columns.\n\nThe part of\
    \ the table name that specifies the library, EGPROGRAM in this case, is not part\
    \ of the SQL standard and as should be regarded as an extension to SQL.\n\nYou\
    \ can create a new column by adding it to the list of selected columns, and you\
    \ can name it by using the AS keyword. The following example creates a new column\
    \ called \"initial\" based on a substring extracted from the name column:\n\n\
    ```\nPROC SQL;\n  SELECT sex, SUBSTR(name,1,1) AS initial\n  FROM EGPROGRAM.CLASS;\n\
    \  QUIT;\n```\n\nThe calculations you use here are exactly the same as those that\
    \ can be generated by the Advanced Expression Builder.\n\nIf you do not want to\
    \ see all of the rows in your table, then use the WHERE clause looked at in Chapter\
    \ 3.\n\n```\nPROC SQL;\n  SELECT sex, SUBSTR(name,1,1) AS initial\n  FROM EGPROGRAM.CLASS\
    \ WHERE age GE 15;\n  QUIT;\n```\n\nThis example would show the sex, initial,\
    \ and age columns for all the students whose age was greater than or equal to\
    \ (GE) 15.\n\nTo make sure your output is sorted into a specific order, use the\
    \ ORDER BY clause as shown in the following example:\n\n```\nPROC SQL;\n  SELECT\
    \ sex, SUBSTR(name,1,1) AS initial, age\n  FROM EGPROGRAM.CLASS WHERE age GE 15\
    \ ORDER BY age;\n  QUIT;\n```"
  merge: -1
  pgno: 86
- img_proc: true
  md: 'If you want to sort by more than one column, list the columns with a comma
    separating each one. If you want any of the columns sorted in descending order,
    then put the keyword DESCENDING after the name of the column.


    ```

    PROC SQL;

    SELECT sex, SUBSTR(name,1,1) AS initial, age

    FROM EGPROG.CLASS

    WHERE age GE 15

    ORDER BY sex, age DESCENDING;

    QUIT;

    ```


    This example would list students sorted by sex, with the oldest in each sex group
    first and the youngest last.


    Don''t forget that at any point you can add extra flexibility by using macro variables!


    In addition to querying your data, SQL supports a number of summarization options.
    The following code results in a list of students with a new column showing the
    average age of all the students:


    ```

    PROC SQL;

    SELECT *, AVG(age) AS AverageAge

    FROM EGPROG.CLASS;

    QUIT;

    ```


    To create the requested output, SQL has to read the data twice, once to obtain
    the average age and again to merge the average age with the other columns. It
    is easy to let SQL handle this for you. However, consider that if you are going
    to use the average age in a number of places, it might be better to save the value
    into a temporary table and link to rather than rereading the data multiple times.
    You will see a message in the log warning that the data has been re-merged.


    The report produced by the preceding code would have an ugly heading and a preponderance
    of decimal places. SAS SQL allows you to improve the look by defining labels and
    formats.


    ```

    PROC SQL;

    SELECT *, AVG(age) AS AverageAge

    LABEL = "Average Age" FORMAT=5.2

    FROM EGPROG.CLASS;

    QUIT;

    ```


    Neither the LABEL nor the FORMAT keywords are part of the SQL standard. They are
    both specific to SAS, but make a world of difference to the look of your output.'
  merge: -1
  pgno: 87
- img_proc: true
  md: '# Chapter 4: Data Manipulation Part 1: Queries 73


    The average on the report is for the whole of the class. If you want is the average
    by sex, then you need to add an additional clause to tell SQL that you want to
    group your summary by sex.


    ```

    PROC SQL;

    SELECT *, AVG(age) AS AverageAge

    LABEL = "Average Age" FORMAT=5.2

    FROM EPGROG.CLASS

    GROUP BY sex;

    QUIT;

    ```


    Now you will have a detail report, but each line has the average for that sex
    on it. You can list as many GROUP BY items as you want by providing them as, a
    comma-separated list.


    If you want to switch to a true summary report, then you need to remove all the
    items that do not belong in the summary report—everything except sex and the average
    age in this case. then you get just one line for each sex, with the average age
    for that.


    ```

    PROC SQL;

    SELECT sex, AVG(age) AS AverageAge

    LABEL = "Average Age" FORMAT=5.2

    FROM EPGROG.CLASS

    GROUP BY sex;

    QUIT;

    ```


    The value for the average age for each sex is a summary value and is not available
    to the WHERE clause for selection. If you want to select output based on summary
    data, then you use exactly the same structure as a WHERE clause, but instead use
    a HAVING clause after the GROUP BY. This next example would display rows only
    where the average age is greater than 13.3, just the boys in this case.


    ```

    PROC SQL;

    SELECT sex, AVG(age) AS AverageAge

    LABEL = "Average Age" FORMAT=5.2

    FROM EPGROG.CLASS

    GROUP BY sex HAVING AverageAge GE 13.3;

    QUIT;

    ```


    One of the common operations performed by the Query Builder is joining tables
    together. Before you can work through the following examples, to make sure that
    you have the sample data loaded, and you need to create a library pointing to
    that data. I have called my library EPGROG. See Appendix C for full details.'
  merge: -1
  pgno: 88
- img_proc: true
  md: '# 74 SAS Programming for Enterprise Guide Users, Second Edition


    If you want data from more than one table to appear in the results of your query,
    then the first thing you need to do is list these tables, separated by commas,
    in the FROM clause.


    ```

    PROC SQL;

    SELECT actor, title

    FROM EGPROG.BondActors, EGPROG.BondFilms;

    QUIT;

    ```


    The results of this code show every actor who played James Bond associated with
    every James Bond film. This type of join is usually referred to as a Cartesian
    join, and is not something you will find a use for very often. To ensure you get
    the correct results, specify the criteria by which the two tables are linked together.
    You can do this by using the WHERE clause we saw previously.


    ```

    PROC SQL;

    SELECT actor, title

    FROM EGPROG.BondActors, EGPROG.BondFilms

    WHERE BondActors.BondNo = BondFilms.BondNo;

    QUIT;

    ```


    Now you should see the actors associated with the films in which they played James
    Bond, and not with the other films. Notice that because the BondNo column exists
    in both tables, you have to explicitly identify which you are referring to by
    listing the table and column, separated by a dot.


    When you are listing tables, you can give each table an alias by following the
    table name with the keyword AS and then the name you want to give it, exactly
    as we did when creating new columns. This technique can save typing if you have
    long names, and it also means that you can link a table to itself, a technique
    that could be useful with hierarchical tables. For example, it might be necessary
    to find the name of an employee''s manager within a personnel data set by linking
    the manager''s ID to an aliased version of the same data set.


    When joining only two tables, SAS Enterprise Guide actually uses a slightly different
    method of joining tables together. It would generate the previous query as follows:


    ```

    PROC SQL;

    SELECT actor, title

    FROM EGPROG.BondActors INNER JOIN EGPROG.BondFilms

    ON BondActors.BondNo = BondFilms.BondNo;

    QUIT;

    ```


    This query achieves exactly the same results as the previous code, but fits in
    better with the other available join types, which can be obtained by right-clicking
    on the linkage and selecting Properties. The available types are INNER JOIN, LEFT
    JOIN, RIGHT'
