  md: '# Chapter 4: Data Manipulation Part 1: Queries 77


    SELECT clauses. The new feature is the OUTER UNION CORR join type. A union join
    is simply one that concatenates one data set with another rather than merging
    them row by.


    The OUTER UNION CORR statement makes sure when column names are the same they
    are correctly aligned regardless of position. If there are differences in the
    columns between the two tables, then the resulting table has all the columns from
    both the tables populated with missing values where appropriate.


    There are other variations on unions that we look at in the “Advanced SQL Queries”
    section in this chapter.


    In the rest of this chapter, we look at some of the other capabilities of SQL,
    why they might be useful, and how you could use them in your SAS Enterprise Guide
    project.


    # Indexes: Creation and Usage


    You are currently reading this book, so there is a good chance that you are already
    familiar with what an index is. Take a moment now to flip to the back of the book
    and look at the index you see. You will see that it is organized in alphabetical
    order by topic, with a list of page numbers showing where you need to go to find
    details about that topic.


    Think for a minute about when it might be good to use the index.


    You probably would not use it when you want to read the book from beginning to
    end, because that would slow you down significantly.


    You definitely would use it when you just want to look up one specific topic—the
    use of PROC REPORT, for example.


    You might not decide to use it if you want to explore a subject such as SQL; that
    is quite a big subject, and it is all organized in one place anyway.


    Now think about the resources used by an index.


    First, it takes up space; the extra pages at the back of this book are there only
    to allow for the index.


    Second, it takes effort to create it, and it will take effort to keep it up-to-date
    when a new version of this book is published. This effort is an inconvenience
    for authors and publishers, and so it increases the cost to you. It is done only
    if there is good reason for it.'
