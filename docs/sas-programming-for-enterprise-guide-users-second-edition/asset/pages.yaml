- img_proc: true
  md: "Now click the Preview Code button and scroll down until you see the code generated\
    \ for the FORMAT procedure. It should look something like this:\n\n```\nPROC FORMAT\n\
    LIB=WORK;\n\n  VALUE $gender\n    \"M\" = \"Male\"\n    \"F\" = \"Female\";\n\n\
    RUN;\n```\n\nYou can easily see the relationship between the task details you\
    \ filled in and the generated code.\n\nOn the PROC FORMAT statement, the LIB=WORK\
    \ option specifies the library where you want to save the format.\n\nFollowing\
    \ that one is statement that defines everything about the format. The keyword\
    \ VALUE dictates the type of format you are creating, in this case a straightforward\
    \ replacement format, the only type the Create Format task supports. We will look\
    \ at the other keywords in the following sections.\n\nNext is the name of the\
    \ format. Notice that a $ symbol now prefixes the name. This symbol is added by\
    \ SAS Enterprise Guide to indicate that this format works on character data. Formats\
    \ for numeric data do not have a $ prefix. Adding the $ prefix for character formats\
    \ is something you will have to remember to do for yourself when writing your\
    \ own formats and procedures and statements.\n\nNext is a series of format rules\
    \ to be applied. Each rule consists of the data value to be replaced, an equal\
    \ sign, and then the character string you want to replace the data value with.\n\
    \nIf you experiment with the options on the Define Formats window, you will see\
    \ there are various ways that you could specify the incoming data values. Table\
    \ 6.1 shows you how these translate into code."
  merge: -1
  pgno: 125
- img_proc: true
  md: '# Table 6.1 Specifying ranges and discrete values in PROC FORMAT


    | | |

    |---|---|

    | "A" | A single discrete character value |

    | "A", "B", "C" | A list of discrete character values |

    | "ABC" – "ABF" | A range of character values including the boundary values |

    | "ABC" <- "ABF" | A range of character values excluding the lower boundary |

    | "ABC" – < "ABF" | A range of character values excluding the upper boundary |

    | "ABC" <- < "ABF" | A range of character values excluding the boundary values
    |

    | "A" - "B", "G" | A combination of range and discrete |

    | 1 | A single discrete numeric value |

    | 1,2,3 | A list of discrete numeric values |

    | 1 – 3 | A range of numeric values including the boundary values |

    | 1 <- 3 | A range of numeric values excluding the lower boundary |

    | 1 - <3 | A range of numeric values excluding the upper boundary |

    | 1 << < 3 | A range of numeric values excluding the boundary values |

    | 1 – 3, 4 | A combination of range and discrete |

    | OTHER | Any value not covered by another rule |

    | MISSING | A missing value |


    When specifying ranges, you can use the two keywords LOW and HIGH. LOW represents
    the smallest possible value greater than a missing value. HIGH represents the
    largest possible value. If you want to use these keywords in the Create Format
    task, select them from the drop-down list. If you type them in, they are treated
    as values, not keywords.


    The replacement character string can be any series of characters up to 32,767
    characters long.


    The only other things you can change with the task are the default width and the
    “fuzz factor” for numeric variables. Again, experiment to see what code is generated.'
  merge: -1
  pgno: 126
- img_proc: true
  md: '# 112 SAS Programming for Enterprise Guide Users, Second Edition


    That is it for the SAS Enterprise Guide Create Format task, but barely the beginning
    for

    t FORMAT procedure. In the following sections, we look at the other things you
    can

    do and some examples of when you might use them.


    # Reviewing Existing Formats


    In any Task window where you are assigning a format to a data value, you can see
    a list

    of the available SAS formats and all of the user-defined formats. Unfortunately,
    when

    looking at the user-defined formats, you get no preview nor any indication of
    what is

    actually in the format.


    If your company documentation does not provide all the information you need, there
    is a

    simple option you can use. To see a full listing of all the formats in the WORK
    library,

    create a Program node and type the following code into it:


    ```

    PROC FORMAT FMTLIB LIB=WORK;

    RUN;

    ```


    Running the code produces a report that looks something like this:


    Figure 6.3 Format definition displayed as a report


    | FORMAT NAME: GENDER | LENGTH: 6 | NUMBER OF VALUES: 2 | |

    | MIN LENGTH: 1 | MAX LENGTH: 40 | DEFAULT LENGTH: 6 | FUZZ: 0 | |

    | START | END | LABEL (VER. V7)|VS | 20AUG2010:12:01:31 | |

    | F | F | Female |

    | M | M | Male | |


    It''s not the prettiest output in the world, but it shows you what you need to
    know.


    If you want to look in a different library, just change the library name on the
    LIB=

    option.


    It might be that there are lots of formats in the library, and you want to see
    only certain

    ones. Then add a SELECT statement to list the ones you want to see. Do not forget
    to add

    the $ sign at the beginning of character formats!'
  merge: -1
