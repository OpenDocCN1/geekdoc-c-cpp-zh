- img_proc: true
  md: '# Chapter 7: Enhancing Report Output


    ```

    LINE y $55;

    z = CATX('' '', put(height.mean,5.1) , '' inches, and

    an average weight of '',

    put(weight.mean,5.1) , '' pounds.'');\nLINE z $55;

    ```


    ```

    ENDCOMP;

    ```


    RUN; Don''t put off by the fact there appears to be a lot of code; you have seen
    most of it before. The new things are the DEFINE statements for minage and maxquare,
    where we have a NOPRINT option. Obviously, this option is to prevent them from
    printing. We still want them defined so that we can use the figures in the description
    at the bottom of the report.


    In the COLUMN statement, there is also an N column. This is not a column in table,
    but a figure maintained by SAS gives us the number of rows in the report. It is
    also marked as NOPRINT.


    At the end of the program is a compute block starting with COMPUTE AFTER. This
    is at the end of the report. Again, COMPUTE BEFORE is allowed, as are compute
    actions before or groups of data.


    The new statement in the compute block is the LINE statement, which writes a line
    of information to the output destination. Using this statement, you can print
    a line of text containing strings and variables, and the variables can be formatted.
    The first use of the LINE statement here is to print a blank line.


    X, Y, and Z are all calculated character strings built exactly as you would in
    the Advanced Expression Builder in the Query Builder task. The CATX function concatenates
    strings, removing leading and trailing blanks from strings, and puts separators
    between each string. In this case, we have specified a separator of a space (''
    '') as the first argument to the function. The PUT function is used for type conversion.
    Here we are converting our mean height and weight to characters using a format
    of 5.1. If you need further help on any of these elements, look in the Help for
    the Advanced Expression Builder or in the online documentation.


    The other LINE statements each write out information lines, specifying a width
    of 55 characters.


    Note that it does not matter where the LINE statements appear in the COMPUTE block.
    They get executed at the end; hence the need to use three separate strings rather
    than one that is overwritten each time.'
