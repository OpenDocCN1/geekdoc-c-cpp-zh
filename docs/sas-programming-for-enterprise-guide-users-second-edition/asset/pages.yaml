- img_proc: true
  md: '# Chapter 9: Macros: Reusable Programming 199


    To get rid of the quotation marks, we can just lie. The fact that the type is
    set to S for "string" generates the quotation marks. If we say it is type N for
    "numeric," in the quotation marks will be omitted. So we could have a title string
    that looks like this:


    +   * List of the following promotions %scan(%_eg_WhereParam(name, Promo, IN,
    TYPE=N),2,())


    Now we can deal with single- and multiple-choice parameters and special values
    in both WHERE statements and titles.


    # Choosing Your Path


    Another area of SAS Enterprise Guide that can make use of prompts and the macro
    variables behind them are the conditions that can be added to the process flow.
    The problem here is that you have to have a prompt associated with the condition.
    You cannot just test an existing macro variable.


    This is not actually a major problem. They may be called prompts, but they do
    not have to prompt.


    The following technique is useful but does not require any coding. When you use
    a Query Builder task, it generates SQL. Whenever SQL is run, it sets a macro variable
    called &SQLLOBS that contains the number of rows retrieved by the query.


    If no rows have been retrieved, you might want to take a different path from the
    one you would take if rows have been retrieved.


    In the condition define a prompt called zero, with a default value of 0, and select
    both Read Only values and Hide from User. Use that prompt to compare to &SQLLOBS,
    and select a path based on the result.


    Figures 9.2, 9.3, and 9.4 show the prompt creation and an example of the condition.'
  merge: -1
