- img_proc: true
  md: '# Directory of Procedures


    This section gives an alphabetical list of SAS procedures, statements, steps that
    are used by one or more SAS Enterprise Guide tasks or wizards. You can find a
    cross-reference in the Task List window of SAS Enterprise Guide by selecting Tasks
    by Name from the drop-down list. The lists in this section are more comprehensive
    and more detailed.


    A brief description of each procedure is given, along with a list of tasks or
    wizards that use the code. Where appropriate, there are references to other sections.
    If the code is not covered elsewhere, there may also be some hints on techniques
    that might be useful.


    SAS is licensed in groups of products known as packages. The Base SAS package
    is required before you can license anything else. Additional packages can be added
    for extra capabilities. If you do not have the underlying SAS package—SAS/GRAPH,
    for example—then you will not be able to use the code in question, nor any task
    that generates code. The following packages are used by SAS Enterprise Guide:


    +   - Base SAS enables everything.

    - SAS/ACCESS enables SAS to directly access data from non-SAS sources.

    - SAS/STAT contains all the most basic procedures.

    - SAS/ETS contains econometric analysis and time series forecasting tools.

    - SAS/GRAPH is used for production of high-quality graphics output.

    - SAS/QC is used for quality control.

    - SAS/OR is used for operational research.


    Each description in the following list ends with suggestions on where to look
    for more information.


    Additional help is available in the SAS Enterprise Guide Help System by selecting
    Help->Syntax Help, or online at support.sas.com/documentation. For online help
    on procedures, choose the SAS Procedures link under P, and locate by name.


    In the case of a procedure that belongs to a particular package, I have referred
    to the appropriate section within the documentation for the package. This documentation
    provides more context for the procedure and also shows other related procedures.


    Individual chapters in this book provide suggestions for books from SAS Press
    that provide more detailed information on specific areas.'
  merge: -1
  pgno: 223
