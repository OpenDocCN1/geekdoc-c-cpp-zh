  md: '# Understanding Generated Code


    In the last section we looked at the basic structure of SAS programs and how they
    can be used in SAS Enterprise Guide. Remember, though, the main purpose of SAS
    Enterprise Guide is to save you writing code.


    Now that you have some understanding of the basics of programming in SAS and in
    SAS Enterprise Guide, we can examine the code that SAS Enterprise Guide generates
    for us.


    To begin, open SAS Enterprise Guide, create a new project, and insert the EGPROG.CLASS
    data set into it. With that the active data source, select the List Data task
    and move all of the columns into the List variables role.


    **Figure 2.10** A basic List Data task


    ![](img/47cb3fb6301eb31415fa0b5e0922f416_41_0.png)


    That is all you need to do to get some output from this task, click the Preview
    code button in the bottom left corner to see the code that is generated.'
  merge: -1
  pgno: 41
- img_proc: true
  md: '# Figure 2.11 Code generated by a basic List Data task


    ![](img/47cb3fb6301eb31415fa0b5e0922f416_42_0.png)


    The first few lines generated are all comments that give information about which
    task

    gener the code and when. If you are using the default color settings, these comments

    all appear in green. You also see a few other comments interspersed throughout
    the code.


    The code itself breaks down into a few blocks. First we have the following line:


    ```

    # _eg_conditional_drops(WORK.SORTTempTableSorted);

    ```


    This is a SAS macro. We can tell that because the first character is a percent
    symbol. This

    macro ensures that the intermediate data storage that the task will use does not
    already

    ist. It does this by calling the %EG_CONDITIONAL_DROPS macro. We will look

    at macros in Chapter 9.'
  merge: -1
  pgno: 42
- img_proc: true
  md: '# 28 SAS Programming for Enterprise Guide Users, Second Edition


    Here is the next block of code:


    ```

    PROC SQL;

    CREATE VIEW WORK.SORTTempTableSorted AS

    SELECT T.Name, T.Sex, T.Age, T.Height, T.Weight

    FROM EGPROG.CLASS as T

    ;

    QUIT;

    ```


    In nearly all circumstances in which SAS Enterprise Guide does any data manipulation,
    it generates Structured Query Language (SQL) statements. We will look at SQL in
    some detail in Chapter 4. When SQL is used in the code, the step boundary is indicated
    by a QUIT statement rather than a RUN statement. So what we are looking at here
    is a program step.


    This piece of SQL creates a view of the data that contains just the required columns
    for output. This behavior can be altered in SAS Enterprise options Tools->Options->Tasks->Tasks
    General. We see how to do this and reasons to do so later in the book.


    Next comes this code:


    ```

    TITLE;

    TITLE1 "Report Listing";nFOOTNOTE;

    FOOTNOTE1 "Generated by the SAS System"

    ```


    These are global statements to ensure that the required title and footnote appear
    on each page. The exact content of the footer depends on your default footnote
    setting from the Options dialog box Tools->Options->Tasks->Tasks General. Next
    comes the actual program step that produces the report:


    ```

    PROC PRINT DATA=WORK.SORTTempTableSorted

    OBS=Row number

    LABEL;

    VAR Name Sex Age Height Weight;

    RUN;

    ```


    We will look at the PRINT procedure in Chapter 7, but for now notice that the
    name of the data being used in the DATA= option is that created in the previous
    SQL step.


    After this, all the remaining code is tidying up for whatever comes next:


    ```

    RUN;

    QUIT;

    @eg_conditional_dropps(WORK.SORTTempTableSorted);

    TITLE; FOOTNOTE;

    ```'
  merge: -1
  pgno: 43
- img_proc: true
  md: '# Chapter 2: Understanding Coding with SAS Enterprise Guide 29


    The RUN; QUIT; line ensures that any code inserted by the user is correctly finished
    off. The % EG CONDITIONAL DROPS macro is used again to delete the intermediate
    view. Finally, the TITLE; FOOTNOTE clears the title and footnote so that they
    do not cause any confusion by appearing on subsequent unrelated reports.


    Feel free to experiment a little by closing the Code Preview window, making some
    changes to the task, and previewing the code again. For example, if you were to
    indicate that you did not want row numbers printed in the options pane, then OBS="Row
    number" would change to NOOBS.


    The biggest change that you would see is if you moved something to the Group analysis
    by role. This would mean that the data would have to be sorted, and you would
    then see either an extra sort step or a change to the SQL to handle the sorting.
    Which one used depends on the Use PROC SQL instead of PROC SORT for sorting in
    tasks setting in the Tasks General area under Tools->Options.


    Try using the Edit button to filter your data. That will add a WHERE clause to
    the first SQL step.


    The basic model of code used in this example is common throughout the SAS Enterprise
    Guide tasks. There will always be one or more steps that do the actual work is
    designed for, surrounded by statements to tidy up and the SQL needed to form the
    main task. Again, try a few to see what you get.


    I have suggested the Code Preview window as a good way of seeing what is generated.
    If you look at the code by using the Code tab or right-clicking on the task and
    selecting Open->Last Submitted Code, or look at the log by using the Log tab or
    choosing Open Log from the right-click menu, then you will see additional code
    lines there. These are used by SAS Enterprise Guide for control purposes.


    # Complementing the Generated Code


    There are four ways that you can enhance the code generated by SAS Enterprise
    Guide:


    +   * Add some code to run when using a server for the first time.

    * Add some code to run before or after a task or Program node.

    * Insert code at predetermined points within a task.

    * Copy the code into a Program window and amend it from there.'
  merge: -1
  pgno: 44
- img_proc: true
  md: '# 30 SAS Programming for Enterprise Guide Users, Second Edition


