    to complete the picture.


    # Summary


    In this chapter we saw some of the techniques that you can use to make the Enterprise
    Guide tasks even more effective.


    We used graphs as linkage points, created exploded pies, make detail pies, and
    saw a whole new graph type. Once again, feel free to explore the SAS Syntax Help
    to see what else you can do and try it out.


    # Where to Look for More Information


    You will find more information on each of the graphs in SAS Enterprise Guide’s
    built-in Help menus. See Appendix A, “Directory of Procedures Supported by SAS
    Enterprise Guide,” in this book for explicit instructions on how to get the relevant
    Help for each graph type.


    Much of the syntax is similar for the different groups of graphs. Look in Appendix
    A to see which graphs use similar procedures.


    There is also an unsupported custom task for bar charts available from the Documentation
    tab at support.sas.com/eguide under the “Extending SAS Enterprise Guide with Custom
    Tasks” link.'
