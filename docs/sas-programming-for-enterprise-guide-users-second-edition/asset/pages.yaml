  md: "# 162 SAS Programming for Enterprise Guide Users, Second Edition\n\nAn alternative\
    \ approach to using a format in PROC REPORT is to use COMPUTE blocks and the CALL\
    \ DEFINE statement. Use the following code:\n\n```\nPROC REPORT DATA=egprog.class;\n\
    COLUMN name sex height weight;\nCOMPUTE WEIGHT;\nIF weight.sum > 100 THEN CALL\
    \ DEFINE\n  (_COL_STYLE\",\"STYLE=(BACKGROUND=RED)\");\nENDCOMP;\nRUN;\n```\n\n\
    The results here are exactly the same as in the previous example, but by using\
    \ a COMPUTE block we get much more flexibility. We could do any of the following:\n\
    \n+   - base outline on compound conditions\n- change the style of a cell based\
    \ on the value of another cell\n- create a new column with a style based on another\
    \ column\n\nNever dismiss PROC REPORT; it really can do all sorts of useful things.\n\
    \n# Varying Output\n\nIn this section, we look at a technique that enables different\
    \ text to be written to different destinations without rerunning the task.\n\n\
    Let's revisit the example of an HTML document with a hyperlink to a PDF document\
    \ that enables properly formatted printing. The HTML document needs to have a\
    \ link that opens the PDF document in another window. We do not want the link\
    \ to be in the PDF document.\n\nAs we did earlier in this chapter, we use EGPROG.CLASS\
    \ as our starting point. Using a SAS Enterprise Guide project with that data set\
    \ available, create a List Data task. Move all the columns to the List variables\
    \ role, and then select Properties and click the Edit button. Under Results switch\
    \ off all the output destinations, because we will specify our own.\n\nNavigate\
    \ to the Insert Code window and insert the code shown in Figure 7.27 immediately\
    \ before the PROC PRINT statement."
