    # ODS: The Output Delivery System


    You are probably not aware of it, but every time you generate reports or graphs
    from

    SAS or from SAS Enterprise Guide, you use the Output Delivery System. As it does
    with

    most features, SAS Enterprise Guide enables you to control what you are doing
    with

    ODS by checking a few boxes. The choices allowed in SAS'' Enterprise Guide barely

    scratch the surface of ODS.


    We introduce ODS in this section and show you some of the basics, but it is a
    subject we

    will return to throughout the rest of this book.


    # What Is ODS All About?


    SAS and SAS Enterprise Guide deal with turning data into information. The information

    might be fairly simple—a listing of sales in the past month, perhaps—or extremely

    complex—a prediction of the likelihood of a credit card applicant defaulting on
    their

    payment, for example.


    Most of what you do in SAS Enterprise Guide is to alter the information that is
    produced.

    Do you want it in a table or graph? What headings do you want? Do you want a

    currency symbol? What forecasting method do you want to use? After deriving the

    information, you could present it to someone orally, in a document, or possibly
    as a hasty

    scribe on a sticky note. It is the information that is important, and the method
    of

    delivery is a separate issue.


    That is the way that SAS views things. The majority of the power of SAS goes into

    gathering and manipulating data to produce the information needed to meet specific

    objectives.'
