- img_proc: true
  md: '126 SAS Programming for Enterprise Guide Users, Second Edition


    # # Introduction


    SAS Enterprise Guide has three major tasks for designing and producing customized
    reports: List Data for detail reports, Summary Tables for summary reports, and
    the List Report Wizard, which can do both. Many other tasks also produce output.
    In this chapter, we look at some general techniques that can be used on all output,
    and then we look at some specific techniques for the List Data task and for summary
    reports, including adding HTML hyperlinks.


    We look at the SAS procedure behind the List Report Wizard. It can not only create
    detail and summary reports but also eliminate the need for a lot of data preparation.
    The wizard does not allow us to add code into the task, so we will look at the
    code separately.


    After that, we look at the idea of trafficlighting, using a system of data-dependent
    colors or pictures to draw attention to data items.


    Finally, we look at varying the output going to different destinations, and we
    introduce some alternative output destinations that might be useful.


    # # More ODS


    In Chapter 3, we had a first look at the way that SAS Enterprise Guide uses ODS,
    and we saw some advantages of overriding that behavior with the addition of a
    couple of lines of code. This section and those that follow present some other
    advantages that can be gained.


    It is possible to access some of the features introduced in this section by using
    the Options dialog box under the Tools menu. However, options that you select
    apply to SAS Enterprise Guide as a whole and would need to be altered manually
    each time you want to do something different. The code methods shown here are
    far more flexible and reliable.


    Although many ODS destinations can be used in SAS, we are going to focus on the
    three main third-party destinations: Hypertext Markup Language (HTML), Rich Text
    Format (RTF), and Portable Document Format (PDF). These three are the most likely
    ways of distributing output from SAS Enterprise Guide, but we will also show a
    way of directing your report output into Microsoft Excel.'
  merge: -1
  pgno: 141
- img_proc: true
  md: '# Chapter 7: Enhancing Report Output 127


    In Chapter 8, "Graphical Output," we will have a look at ODS to create SAS data
    sets. If you would like to find out more about the other destinations, see the
    online documentation listed in Appendix A.


    Let''s start by recapping what we saw in Chapter 3.


    The first step in using ODS output is to switch off the SAS Enterprise Guide output
    by using the task properties or globally by using the Options dialog box. Use
    the Insert Code facility to insert ODS statements on either side of the procedure
    whose output you want to capture. Use ODS HTML FILE=''yourfile.html''; before
    and ODS HTML CLOSE; after get HTML output. Change all occurrences of HTML to RTF
    for RTF output or to PDF for PDF output. (Review the relevant section in Chapter
    3 if you need more detail.)


    Which of the three destinations should you use?


    PDF or RTF are the best formats if you want to print output. RTF opens in a word
    processor, so it is useful if you want to add your own comments to the output
    before printing. PDF is the self-contained of the three; use HTML if you want
    to publishing information to any sort of Web site, or if you want to build a set
    of linked documents for people to navigate through.


    None of these three are SAS standards, and they were all originally designed for
    different purposes. To get the most out of them, you need to build destination-specific
    elements into your work. In the remainder of this section, we will look at extra
    options you can use and use each of the destinations.


    RTF and PDF both have properties in addition to the text and pictures they contain.
    Using ODS, you can insert information into those properties, most usefully a document
    title and information about the author. Most of the items covered in this section,
    the properties can be added to your opening ODS statements. For example:


    ```

    ODS RTF FILE=''yourfile.rtf''

    AUTHOR=''username'' TITLE="yourtitle";

    ```


    ```

    ODS PDF FILE=''yourfile.pdf''

    AUTHOR=''username'' TITLE="yourtitle";

    ```


    You can use the STARTPAGE option in both of these destinations to control how
    pages are created. Here are the possible settings:


    NO The only page breaks are those inserted by the application used for viewing—Microsoft
    Word or Adobe Reader, for example. This setting tends to produce a shorter report
    with multiple outputs on each page if'
  merge: -1
  pgno: 142
- img_proc: true
  md: '# 128 SAS Programming for Enterprise Guide Users, Second Edition


    they can fit. Think about the clarity of the report and the impact of page headers
    and footers if you use this setting.


    YES Page breaks inserted by SAS are honored. Additional page breaks might still
    be inserted by the application for viewing. This is the default setting.


    To create a PDF file in which the only page breaks are those inserted by the Adobe
    Reader, use the following code:


    ```

    ODS PDF FILE=''yourfile.pdf''

    AUTHOR=''username'' TITLE=''yourtitle"

    STARTPAGE=NO;

    ```


    If you want to change the appearance of either of these two destination types,
    use the STYLE=option. The easiest place to find a list of the acceptable styles
    is to look at the drop-down lists in the results section for the destination type
    under Tools->Options. To create an RTF document using BarrettsBlue style, simply
    add that option to your ODS statement like this:


    ```

    ODS RTF FILE=''yourfile.rtf''

    AUTHOR=''username'' TITLE=''yourtitle"

    STYLE=BARRETSBLUE;

    ```


    You can use the STYLE= option on HTML documents as well; we will look at HTML
    style in more detail later.


    The final option that works on both RTF and PDF is a SAS system option rather
    than an ODS option. If you are generating output that would be better suited to
    a page oriented in landscape, set that option before the ODS statement.


    ```

    OPTIONS ORIENTATION=LANDSCAPE;

    ODS RTF FILE=''yourfile.rtf''

    AUTHOR=''username'' TITLE=''yourtitle"

    STYLE=BARRETSBLUE;

    ```


    To change back to portrait, use ORIENTATION=PORTRAIT.


    A feature of Adobe Acrobat is to have a list of bookmarks available to aid navigation.
    There are two PDF-specific ODS options that you can use to control bookmarks.
    Use BOOKMARKGEN=YES to use SAS to generate bookmarks, BOOKMARKGEN=NO prevents
    SAS from generating bookmarks.


    The Adobe Reader has a bookmark pane that you can use to view bookmarks. You can
    control the initial appearance of the bookmark pane by using BOOKMARKLIST=YES
    to make it initially visible, and BOOKMARKLIST=NO for it to be initially hidden.
    So the


    ![](img/47cb3fb6301eb31415fa0b5e0922f416_143_0.png)'
  merge: -1
  pgno: 143
- img_proc: true
  md: '# Chapter 7: Enhancing Report Output


    following statement generates bookmarks and also specifies that the bookmark pane
    is available at startup:


    ```

    ODS PDF

    FILE=''yourfile.pdf''

    BOOKMARKGEN=YES

    BOOKMARKLIST=YES;

    ```


    Let''s move on now to some specific options for HTML output, starting with the
    style of output.


    As mentioned previously, the STYLE= option is valid for HTML output as well as
    PDF and RTF definitions. In HTML, this option embeds all the style definitions
    needed into the HTML file. Ideally, style information should be separated from
    the HTML. Keeping the style information separate means that style information
    needs to be downloaded once, it also means that people with different needs can
    alter the style information appropriately. For example, someone with color blindness
    might want to use different colors; a larger or more distinct font; a blind person
    might be using a screen reader rather than a visual browser.


    To make SAS create a style sheet file, add the STYLESHEET= option. This option
    creates a Cascading Style Sheet (CSS) file based on the named SAS style in addition
    to the HTML file.


    ```

    ODS HTML

    FILE=''yourfile.html''

    STYLE=BARRETSBLUE

    STYLESET=''yourstyle.css'';

    ```


    It is quite likely that all of your HTML output is going to be in the same style,
    in which case there is no real need to create a style sheet every time. A variation
    on the STYLESHEET= option points you to an existing style sheet by its Uniform
    Resource Locator (URL).


    ```

    ODS HTML

    FILE=''yourfile.html''

    STYLESHEET=(URL=''yourstyle.css'');

    ```


    In the previous example, we saw the ODS HTML destination creating two files: the
    HTML file and the CSS file. In fact, the destination can produce far more than
    if you add extra options on the ODS HTML statement. The following table lists
    the options you can use and describes the file that is produced as a result:'
  merge: -1
  pgno: 144
- img_proc: true
  md: '# Table 7.1 HTML file creation options


    | Option | File Created |

    |---|---|

    | FILE= | |\| BODY= | Creates the main HTML output (synonym for FILE=). |

    | STYLE= | Specifies an output Style. |

    | TITLE= | Specifies a title. |

    | STYLESHEET= | Creates a separate Cascading Style Sheet. |

    | CONTENTS= | Creates a collapsible table of contents with links to separate HTML
    files or locations within a single HTML file. |

    | PAGE= | Creates a page listing with links to separate HTML files or links within
    a single HTML file. |

    | FRAME= | Creates an HTML frameset with places for the body, contents, and page
    navigators. |

    | NEWFILE=PROC | Creates a new HTML file for each procedural output section. The
    first file has the name specified in the BODY= option; subsequent files add a
    numeric suffix to the filename with 1. So with BODY="FILE.HTML", files created
    would be FILE.HTML, FILE1.HTML, FILE2.HTML, etc. Alternatively, include a numeric
    suffix as part of the name specified and numbering will start from there. So with
    BODY="FILE1.HTML", files created would be FILE1.HTML, FILE2.HTML, FILE3.HTML,
    etc. |

    | NEWFILE=PAGE | Creates a new HTML file for each page output. File naming is
    as described previously. |

    | NEWFILE=BYGROUP | Creates a new HTML file for each group output. File naming
    is as described previously. |

    | NEWFILE=OUTPUT | Creates a new HTML file for each output object created. File
    naming is as described previously. |

    | NEWFILE=NONE | Puts all output into one file. |'
  merge: -1
  pgno: 145
- img_proc: true
  md: '# Chapter 7: Enhancing Report Output 131


    With all of these different files being created, it can be tedious to specify
    the full pathname for every file. Specifying the pathname for each file also makes
    difficult and has undesirable side effects for hyperlinking. If all your files
    are being written to the same location, use the PATH="your-directory" (URL=NONE)
    option to specify that location and stop full URL paths from being generated.


    Next to any filename, you can add the (TITLE=My Title) suboption, which puts the
    specified text in the title bar of the browser and provides text when people add
    the page to their favorites or bookmarks.


    Let''s try an example. In SAS Enterprise Guide, make sure you have the AS_PRODUCTS
    table in your project, select it, and then create a List Data task. Assign roles
