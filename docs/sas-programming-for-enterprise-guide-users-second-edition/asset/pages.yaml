    Instead of the HBAR3D statement, HBAR, VBAR, or VBAR3D can all be used. In addition
    to the options shown previously, the SUBGROUP= option can be used to put subgroups
    on the bars. The width of the bars defaults to the SUM statistic, but this statistic
    can be changed to a percentage by specifying WSTAT=PERCENTAGE.


    What if you want to use any of the formatting options that are available for the
    other SAS Enterprise Guide graph tasks? The easiest thing to do is to create a
    simple Bar Chart task and generate the chart way you like it. After running, go
    to the Code tab. From there, cut out the statements you need and paste them before
