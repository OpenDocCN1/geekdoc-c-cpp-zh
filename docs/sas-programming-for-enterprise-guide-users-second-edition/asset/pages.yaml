    # Chapter 6: Seeing Data Differently


    +   1. Create a format from the AS_PRODUCTS table so that it can be used anywhere
    a

    product name is needed.


    Solution

    Either by using a Query Builder task or by writing SQL, create a table called

    FORMAT that has the following columns derived from the AS_PRODUCTS table.


    # Table D.1 Columns for product format


    | Column Name | Set to |

    | --- | --- |

    | FMTNAME | "$PRODFORMAT" |

    | START | Product_code |

    | LABEL | Description |


    Then in a Program node, enter statements such as the following:


    ```

    PROC FORMAT CNTLIN=pformat FMTLIB;

    RUN;

    ```


    The FMTLIB option is used only to show that the format is present. Check the log
    to

    sake sure that the procedure ran correctly. If you used a Filter and Query task
    to

    build the data, you might want to link that to your code.


    +   2. Create a numeric format that shows telephone numbers in the format (0)
    111 111

    1111. This format is often used in multinational companies to indicate that the
    zero is

    dropped when calling from abroad.


    Solution

    In a Program node, enter statements such as the following:


    ```

    PROC FORMAT FMTLIB;

    PICTURE phone (DEFAULT=16)

    LOW-HIGH = 9) 999 999 9999 (PREFIX="");

    RUN;

    ```'
  merge: -1
  pgno: 285
- img_proc: true
  md: "# Appendix D: Solutions to Exercises 271\n\nThe following code would produce\
