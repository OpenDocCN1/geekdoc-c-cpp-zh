  md: "# Chapter 7: Enhancing Report Output 155\n\nIf you scroll about halfway down,\
    \ you will see a section that looks like Figure 7.18:\n\n# Figure 7.18 Part of\
    \ the User Code window for the List Data task\n\n```\n<double-click to insert\
    \ code>\nVAR Name Sex Age Height Weight\n<double-click to insert code>\n```\n\n\
    The problem here is that we need to isolate the Weight column from the others\
    \ so that we can apply our formatting. Double-click the insertion point immediately\
    \ before the generated VAR statement and type in the following code:\n\n# Figure\
    \ 7.19 Inserted code for conditional highlighting\n\n```\nVAR name sex age height;\n\
    VAR weight / STYLE[DATA] =\n  [BACKGROUND] = wformat.;\n* This comments out as\
    \ far as the next semicolon\n```\n\nWhat we are doing is splitting the VAR statement\
    \ into two. The first VAR statement lists all the columns except Weight. The second\
    \ VAR statement lists the Weight column and uses an additional option. (Options\
    \ on the VAR statement require a forward slash first.) The option we use is overriding\
    \ the background color for the report data. The value it overrides is with whatever\
    \ is returned by applying the format for each column on the VAR statement, in\
    \ this case Weight. The shape of the brackets is important; only curly brackets\
    \ are allowed. Also note the dot at the end of the format name. This is required\
    \ by SAS to differentiate formats from variables or program elements.\n\nThe significant\
    \ part of the last line is the asterisk. An asterisk tells SAS to treat everything\
    \ from that point to the next semicolon as a comment. It thus forces SAS to treat\
    \ the next code line, the generated VAR statement in the previous figure, as a\
    \ comment. We need to do that because we have supplied our own VAR statements\
    \ to structure the report layout."
