    \ or exclude rows or columns in the tables to be joined.\n\n+   UNION adds all\
    \ unique rows from both queries.\nEXCEPT adds all the unique rows that are in\
    \ the first query but not the second.\nINTERSECT adds all the unique rows that\
    \ are present in both queries.\nOUTER UNION concatenates the queries (used in\
    \ the Append Data task).\n\nThese operators can all be modified with the keyword\
