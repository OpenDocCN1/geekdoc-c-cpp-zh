- img_proc: true
  md: 'You should end up with a process flow that looks like this:


    Figure 4.1 Index creation


    ![](img/47cb3fb6301eb31415fa0b5e0922f416_94_0.png)


    So that is the technique to use. Let''s have a quick look at the code.


    The statement starts with the keywords CREATE INDEX, which tell SAS what it is
    we want to do.


    Next is the name of the index, BondNo in this case. When creating a simple index
    in SAS—i.e., an index on a single column—the name of the index must be the same
    as the name of the column.


    Finally, we have the keyword ON followed by the name of the table and the name
    of the column to be indexed enclosed in parentheses.


    That''s all there is to it! When you run the code, an index is applied to the
    data set. SAS and SAS Enterprise Guide can use this index to speed things up.
    We will look at when indexes are used in the next section, but before we, we look
    at some variations that might be useful.


    If the column you are indexing will have each value only once, then you can declare
    the index to be unique. The index will be created only if the values are unique,
    and you will never be able to add a row that would cause a duplicate to be added.
    To declare the index unique, simply insert the keyword UNIQUE, as shown here:


    ```

    PROC SQL;

    CREATE UNIQUE INDEX FilmNo

    ON EGPROG.BondFilms(FilmNo);


    QUIT;

    ```'
