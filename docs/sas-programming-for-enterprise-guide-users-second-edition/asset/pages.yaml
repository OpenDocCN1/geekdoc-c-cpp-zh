  md: '# Formats and Functions


    With your locale set, the functions and formats listed in the following tables
    give you correctly formatted dates and currencies. Use the format selection screen
    to see a full list of formats and details of the differences between them.


    Table 3.1 National Language formats


    | Type | Formats |

    | --- | --- |

    | Numeric | NLNUMw.d |

    | Currency | NLMNYw.d, NLMNYIw.d |

    | Date | NLDATEw., NLDATEMw., NLDATEWw., NLDATENw |

    | Date Time | NLDATMw., NLDMAPw., NLDATTMw., NLDATEw |

    | Time | NLTIMEPw., NLTIMAPw |

    | Percent | NLPCTw.d, NLPCTIw.d |


    Table 3.2 National Language informs


    | Type | Informants |

    | --- | --- |

    | Numeric | NLNUMw.d |

    | Currency | NLMNYw.d, NLMNYIw.d |

    | Date | NLDATEw. |

    | Date Time | NLDATMw. |

    | Time | NLTIMew., NLTIMAPw. |

    | Percent | NLPCTw.d, NLPCTIw.d |'
  merge: -1
