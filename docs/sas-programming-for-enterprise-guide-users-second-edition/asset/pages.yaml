  md: '# 134 SAS Programming for Enterprise Guide Users, Second Edition


    # Figure 7.6 Framed output


    ![](img/47cb3fb6301eb31415fa0b5e0922f416_149_0.png)


    This process works, but personally I have some issues with it. The table of contents
