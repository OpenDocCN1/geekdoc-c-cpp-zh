- img_proc: true
  md: '# Chapter 6: Seeing Data Differently


    ```

    PROC FORMAT FMTLIB LIB=GENDER;

    SELECT $GENDER;

    RUN;

    ```


    Whenever you refer to a format or informat in code, you must make sure you include
    a dot; otherwise SAS may interpret the name as a variable. The dot can either
    be the last character or a decimal point for numeric formats. The only exception
    to this rule is that you do not include the dot when you are creating or referring
    to the format in the PROC FORMAT step.


    You can also use an EXCLUDE statement to suppress reporting of the formats you
    exclude.


    You might find that you can save a format in a library and not see it when trying
    to set formats. This might be because you saved it on a different server from
    the one you are currently using, or it might be that the library you used is not
    one SAS looks in by default. If you do not specify otherwise, SAS looks in libraries
    called WORK, SASUSER, and LIBRARY. SAS Enterprise Guide also looks in the EGTASK
    library if it exists. To make SAS look in other areas, set the search path using
    the OPTIONS statement.


    ```

    OPTIONS FMTSEARCH=(yourlibrary);

    ```


    This option tells SAS to search library after searching the default libraries.
    Use the following variation to change the order in which the libraries are searched:


    ```

    OPTIONS FMTSEARCH=(yourlibrary, WORK, LIBRARY, EGTASK);

    ```


    This option can either be inserted as a permanent feature as discussed in Chapter
    3, or in a Program node or an individual task. After the statement has executed,
    the additional libraries will be searched until SAS Enterprise Guide is closed.
    Make sure the OPTIONS statement is executed before you try to select a format
    from a library other than the default libraries. If you are using one to submit
    SAS code when a server is connected, the search path is not altered until a connection
    is established. This connection could occur after the first task is executed,
    or you can connect manually by clicking on the server in the Server List window.


    # Creating Picture Formats


    Once again, SAS provides lots of formats to improve the way numeric values are
    displayed—for example, all of the date, time, and currency formats. For any reason
    you want to write your own formats, this section shows you how.'
  merge: -1
