  md: '# Using and Customizing the Program Window


    When you write complete programs using the Program window, you can do a few things
    to make your life easier.


    First remember that the Program window is basically a text editor just like any
    other, so you can do all the usual you would expect. Letters, words, lines, or
    whole sections of code can be selected by dragging the mouse or by using the normal
    keyboard shortcuts. Once selected, sections can be deleted, cut out, copied, or
    dragged to a new location.


    In addition to the usual text editor techniques, a few are specific to this and
    other SAS code editors.


    # Commenting Text


    If you want to surround something in your code with / * / to make it comments,
    then select the text—as many lines as you want—hold down the CTRL key, and press
    the / key. To reverse the effect, hold down the CTRL and SHIFT keys and press
    the / key. This technique can be useful when you are having problems getting a
    program to work. Commenting out a bit at a time can help isolate the problem.


    # Working with Large Programs


    If you are working on a larger program and need to be able to see two parts of
    it at the same time, position your cursor in the Program window and select ProgramSplit.
    Then choose how want to split the window. You can also right-click in the Program
    window and select your split options from there. To remove the split window, go
    back to the Split menu and select None.


    To give a better overview of a large program, click on the minus symbol next to
    the start of a step to collapse the step and show only the first line. Click on
    the plus symbol to expand the step.


    # Matching Brackets


    In some examples we look at later in the book, it is possible to have many pairs
    of brackets in a statement, sometimes pairs of brackets nested within other pairs
    many levels deep. Leaving out one half of a pair of brackets causes your program
    to fail. There is a quick way of finding out what matches and what does not. Position
    the cursor next to a bracket in your code, hold down the CTRL key, and then press
    any of the keys used for bracket symbols—( ), ], {, or }. The cursor jumps to
    the matching bracket if there is one.'
  merge: -1
  pgno: 35
- img_proc: true
  md: '# Chapter 2: Understanding Coding with SAS Enterprise Guide


    # Abbreviations


    By creating abbreviations, you can save yourself significant time in typing. An
    abbreviation enables you to associate a short combination of letters with a longer
    piece of text. Whenever you type the abbreviation in the Program window, a tooltip
    appears with the longer text. You can either ignore it and continue typing, or
    press ENTER or TAB, in which case the longer text replaces the abbreviation.


    For example, you might decide that you will be writing many reports and so you
    want to set up an abbreviation to help you get started each time. With the cursor
    positioned in a Program window, select Program->Add Abbreviation. Then type pr
    as the abbreviation and PROC REPORT DATA= as the text to insert, and select OK.


    # Figure 2.3 Abbreviations can speed up code entry


    ![](img/47cb3fb6301eb31415fa0b5e0922f416_36_0.png)


    If you now type pr in the Program window, you see a tooltip. Press ENTER, and
    you have the start of your procedure. Note that the abbreviation is case sensitive,
    so typing PR does not work.


    # Macros


    If you need to repeatedly insert more than a few words, you can record a macro
    to help. In the Program window, select Program->Editor Macros->Record New, or
    hold down the CTRL key and press, SHIFT and R.


    Then type whatever you want in the Program window. When you have finished, select
    Program->Editor Macros->Stop Recording, or repeat the hotkey combination again.


    A dialog box appears to enable you to name your macro and assign a description
    to it.'
  merge: -1
