    The word DISTINCT can be used instead of UNIQUE with exactly the same results.


    Possibly a better approach here might be to say that the employee identification
    code is the primary key on this table. This approach ensures that it does not
    have a missing value and that it is unique. Other tables can then reference the
    key to ensure that new data fits in with existing data.


    ```

