  md: 'This creates a new Program node in your project with all the generated code
    plus the standard code SAS Enterprise Guide uses in all tasks. If you have inserted
    code via the Options dialog box, then that is also included.


    You want to run the code outside of SAS Enterprise Guide, you need to save it
    externally to the code by right-clicking on the code icon and selecting Save your-node-name
    as.**


    Alternatively, code can be captured from the Code Preview window or the View Last
    Submitted Code window by using Windows cut and paste functionality.


    If you ever want to export the code from a project, that can be done by selecting
    File→Export→Export all code in Project.


    # Summary


    In this chapter we looked at the basic building blocks of a SAS program, statements
    and steps, and the use of the Program node to create your own programs. While
    in the Program node, we saw different ways of using the code editor and the ways
    it can be configured to meet your specific requirements. We also reviewed how
    Program nodes fit in with the rest of your project and how you can alter that
    behavior.


    We then examined the code that SAS Enterprise Guide generates for you. We discussed
    the different ways that code can be enhanced and when you might need to use each
    of the different methods.


    These methods included inserting code before or after every task and inserting
    code at allowed locations within a task.


    # Exercises


    Try looking at the code generated by the tasks you use regularly in light of the
    overview provided by this chapter.'
  merge: -1
