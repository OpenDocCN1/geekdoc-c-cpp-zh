- img_proc: true
  md: '# Do It Once—Use It Often


    One extremely useful feature of SAS Enterprise Guide is the ability to set values
    or prompt for values when running a task, process flow, or project, and to use
    those values during execution. This can all be managed from the Prompt Manager
    window, and you can use the Prompt Manager button, which can be found in the Query
    Builder or in the Properties of a task.


    The mechanism that allows prompts to interact with tasks or code is something
    called a macro variable, part of the SAS macro system.


    In this section we look at how you can use this macro variable feature along with
    the code you write to make everything you do as flexible as possible. We also
    see some of the other things you can do with macro variables and introduce macro
    functions.


    # Using Macro Variables


    Let us first see how SAS Enterprise Guide uses macro variables when it is building
    a query.


    Go back to the query you built at the beginning of the previous section, the one
    that filtered EGPROGRAM CLASS. Add a prompt AGE that prompts the user to choose
    a single value from a list of values containing the numbers 11 to 15. Then modify
    the filter so that it uses the prompt and make sure you deselect both checkboxes
    in the filter.


    # Figure 3.6 Using a prompt in a filter


    ![](img/47cb3fb6301eb31415fa0b5e0922f416_62_0.png)'
  merge: -1
  pgno: 62
- img_proc: true
  md: '# 48 SAS Programming for Enterprise Guide Users, Second Edition


    The SAS code name can be anything you like; in this example, we called it AGE.
    If you preview the generated code now, you see that the WHERE clause has changed
    from:


    ```

    WHERE t1.Age > 13;

    ```


    ```

    WHERE t1.Age > &AGE;

    ```


    The macro variable reference here is&AGE. Whenever you want to refer to a macro
    variable within SAS, you type an ampersand and follow it with the name of the
    variable. The ampersand is necessary to enable SAS to distinguish between ordinary
    variables, text, constants, and macro variables. When SAS encounters a macro variable
    reference, it checks to see whether the variable exists. If it does, SAS replaces
    the variable name with the value it is associated with—13 in this case. If the
    variable does not exist, then the value &AGE is left unaltered.


    Although the prompting feature is specific to SAS Enterprise Guide, macro variables
    are a standard part of the underlying SAS programming language.


    The nice thing about macro variables is that once they are set, they can be used
    and reused anywhere within your program. In our example here, we could attach
    a List Data task to our query to print the results, and it would be an extremely
    good idea to incorporate &AGE within the title so people looking at the results
    would know exactly what they were looking at.'
  merge: -1
  pgno: 63
- img_proc: true
  md: '# Figure 3.7 Using a macro variable in a title


    ![](img/47cb3fb6301eb31415fa0b5e0922f416_64_0.png)


    There are a couple of things to consider when using macro variables like this.


    First, if you hand code a macro variable in a task or a program, then you have
    to tell SAS Enterprise Guide that you have done so. If you don''t, then the macro
    variable will not be available and all you see in the title will be &AGE, the
    name of the macro variable itself.


    Second, in the previous section we looked at using small amounts of code to get
    rid of unnecessary queries.


    By incorporating macro variables into your code, you can overcome both of those
    problems.'
  merge: -1
