  md: 'The Advanced Expression Builder, which is available in the Query Builder task
    when you create computed columns or filters, not only provides a categorized list
    of functions; it also provides a brief description for each function and guidance
    for its syntax and usage. The feature is backed up by the full online Help. These
    functions can be used in the Advanced Expression Builder as well as in code, as
    we saw earlier in this chapter.


    # # Summary


    In this chapter, we took a brief look at the SAS DATA step, the part of SAS most
    like a traditional programming language. SAS Enterprise Guide uses SQL for data
    manipulation, so we focused on a couple of areas that SAS cannot handle.


    In the final section, we quickly reviewed SAS functions and discussed how to find
    information on them in the Advanced Expression Builder.


    # # Where to Look for More Information


    More information on the DATA step can be found in the SAS Syntax Help under SAS
    Products→Base SAS→SAS 9.2 Language Reference Dictionary→Dictionary of Language
    Elements→Statements→DATA Step Statements.


    To see a full list of available functions, select SAS Products→Base SAS→SAS 9.2
    Language Reference Dictionary→Dictionary of Language Elements→Functions and Call
    Routines.


    Many books have been written on the DATA step, and significant classroom and online
    training is available. The following areas might be of interest, depending on
    the problem you are trying to solve:


    +   - reading in character files, using INFILE and INPUT

    - iterative processing, using DO loops and ARRAY'
  merge: -1
  pgno: 120
- img_proc: true
  md: 'The following SAS Press books also provide more detailed coverage of the subjects
    discussed in this chapter:


    +   - The Little SAS Book: A Primer, Fourth Edition by Susan Slaughter and Laura
    Delwiche


    +   - SAS Functions by Example, Second Edition by Ron Cody


    # Exercises


    We already have a products table AS_PRODUCTS, so we do not need to maintain the
    product names in our promotion table. Equally, we should not need to repeat the
    promotion detail for every product. Use the techniques in this chapter to create
    two tables from AS_PROMOTIONS.


    +   - The first table lists each promotion with details.


    +   - The second table links promotions and products via a simple table containing
    the promotion and product IDs.'
  merge: -1
