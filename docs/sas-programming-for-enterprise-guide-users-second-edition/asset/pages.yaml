  md: '# Chapter 3: Getting Started


    Make sure you keep this query because we will need it again before this chapter
    is over. In the toolbar, click Preview, and select the Code tab. You see code
    that looks something like this.


    ```

    PROC SQL;

    CREATE TABLE SASUSER.QUERY_FOR_CLASS_000A AS

    SELECT t1.Name,

    t1.Sex,

    t1.Age,

    t1.Height,

    t1.Weight

    FROM EGPROG.CLASS AS t1

    WHERE t1.Age > 13;

    QUIT;

    ```


    Notice the QUIT clause just before the QUIT statement. The WHERE clause can contain
    a simple condition, as shown previously, or a combination, as in this example.


    ```

    PROC SQL;

    CREATE TABLE SASUSER.QUERY_FOR_CLASS_0009 AS

    SELECT t1.Name,

    t1.Sex,

    t1.Age,

    t1.Height,

    t1.Weight

    FROM EGPROG.CLASS AS t1

    WHERE ( t1.Sex = ''F'' AND t1.Age BETWEEN 12 AND 15

    nt1.Height > 56.5 ) OR ( t1.Sex = ''M'' AND t1.Age BETWEEN

    12 AND 15 AND t1.Height > 59 );

    QUIT;

    ```


    This code was generated by building the combined filter shown in the following
    figure.


    Figure 3.4 A complex filter built with the Filter Combination window


    ![](img/47cb3fb6301eb31415fa0b5e0922f416_58_0.png)'
  merge: -1
  pgno: 58
- img_proc: true
  md: 'Here we have created six filter conditions, grouped them into two groups of
    three, and altered the logical AND operator between the groups to a logical OR.


    The WHERE clause in these examples is part of the Structured Query Language (SQL),
    which we will look at in Chapter 4, but everything that can be used there can
    also be used in the SAS WHERE statement. In fact, you could just cut and paste
    from one to the other; the only editing needed is to remove all instances of the
    CLASS data set name.


    Using the Edit button on the data screen of a task also generates a WHERE clause
    in the initial SQL of a task. Use the Preview code button to see that method in
    action.


    Task filters are much more limited than the query filters. Although you could
    generate the Age > 13 example using a task filter, that method does not support
    any of the following:


    +   - complex grouping of the type shown in the second example above.

    - calculations (for example, COST > PRICE * QUANTITY).

    - use of SAS functions (for example, QTR(ORDER_DATE) = 2).

    - use of macro functions as shown later in this chapter.

    - making a numeric value into a parameter. We will see this example later in this
    chapter.

    - using multiple parameter selections. We will see how to deal with these in Chapter
    9.


    To use any of these techniques, you have to insert a SAS WHERE statement as shown
    in the following example.


    Let''s try it out. Make sure you have the EGPROG.CLASS data set in a project,
    and create a List Data task based on it with all of the columns assigned to the
    List variables role. Don''t make any other changes at the moment, just run the
    task to verify the output.


    Now go back into the task, click the Preview code button, and from there click
    the Insert Code button.'
  merge: -1
  pgno: 59
- img_proc: true
  md: '# Figure 3.5 Code insertion points on the User Code window


    ![](img/47cb3fb6301eb31415fa0b5e0922f416_60_0.png)


    See a list of places you are allowed to insert code. The WHERE statement we are
    using here can be used in pretty much any programming step. Remember that a step
    is a group of statements. In SAS Enterprise Guide, steps nearly always start with
    the word “PROC” and end with the RUN statement. That immediately limits the places
    we can'
  merge: -1
  pgno: 60
- img_proc: true
  md: 'insert our WHERE statement; it must be between PROC PRINT and the next RUN
    statement. Remembering that a statement ends with a semicolon; if you look carefully
    between those boundaries you see that two of the allowed code insertion points
    are within statements. One is within the PROC PRINT statement and one is within
    the VAR statement. The only code you could insert here would be options on those
    statements. Our WHERE statement can be inserted at any of the other points. Look
    at Figure 3.5 to see where you can and cannot insert the statement.


    Double-click on any of the points we have identified as suitable for our WHERE
    statement to open the code editor window, and then enter the following statement:


    ```

    WHERE Age > 13;

    ```


    Click OK on the Enter Code window and again on the User Code window. Before leaving
    the Code Preview window, find the code you just inserted and check that the color
    coding is as expected. Especially for anything in red, which shows that the code
    has been entered incorrectly. Then close the Code Preview window and run the task.
    You will now see only class members added over 13.


    Go back into the task and make any changes you want to in terms of grouping, headings
    and footings, formats, or other options. You can even remove some columns if you
    want. Then run the task just to verify the output. Because of the SAS Enterprise
    Guide generates its code, you cannot remove the Sex column at the moment, but
    we will see a way around that later.


    Now go back into the task code and make the WHERE statement more complex:


    ```

    WHERE (Sex = "F" AND Age BETWEEN 12 AND 15 AND Height > 56.5 )

    OR (Sex = "M" AND Age BETWEEN 12 AND 15 AND Height > 59 );

    ```


    The expression on the WHERE statement can be anything that you can put on a filter
    in a query.


    The advantage of using the WHERE statement is its flexibility and efficiency.
    You are not limited to the filtering allowed in the task, and you do not have
    to separately subset your data in a query. If you subset your data by using a
    query first, then you are creating an extra copy of the data, which takes time
    and disk space. It might not matter on data this small, but if you are working
    on a few million records, the savings could be significant.


    Though we used a List Data task for our example, any task allows the use of the
    WHERE statement. Just make sure you insert it in a step, but not within another
    statement.


    Also, do not forget to insert a Note node to describe what you have done and why.'
  merge: -1
