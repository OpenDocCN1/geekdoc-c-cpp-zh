- img_proc: true
  md: "# 142 SAS Programming for Enterprise Guide Users, Second Edition\n\nLet's start\
    \ to tailor our report with some options that are specific to PROC REPORT.\nFirst,\
    \ we list only the columns we want, in the order we want them displayed, using\
    \ the\nCOLUMN statement.\n\n```\nPROC REPORT DATA=egprog.class;\nCOLUMN sex age\
    \ height weight;\nRUN;\n```\n\nFor each column that we have listed, we can now\
    \ optionally add a DEFINE statement to\ntell PROC REPORT everything about column.\
    \ In this example, we have changed the\nheading of the Sex to \"Gender,\" asked\
    \ for the data to be positioned in the center\nof the available column for Sex\
    \ and Age, and formatted Height and Weight so that\n do not use the decimal places.\n\
    \n```\nPROC REPORT DATA=egprog.class;\nCOLUMN sex age height weight;\nDEFINE sex\
    \ / 'Gender' CENTER;\nDEFINE age / CENTER;\nDEFINE height / FORMAT=3.0;\nDEFINE\
    \ weight / FORMAT=3.0;\n```\n\n```\nRUN;\n```\n\nAll options on the DEFINE statement\
    \ appear after the forward slash. You can mix these\noptions up in any order you\
    \ like, as long they come after the forward slash.\n\nValues in quotes are used\
    \ as column headings.\n\nYou can justify data in columns by using the CENTER,\
    \ LEFT, or RIGHT options.\n\nUse FORMAT= or F= to set a format for display.\n\n\
    If you want your data to come out in a sorted order, you can add an option on\
    \ the\nDEFINE statement too.\n\n```\nPROC REPORT DATA=egprog.class;\nCOLUMN sex\
    \ age height weight;\nDEFINE sex / ORDER 'Gender' CENTER;\nDEFINE age / CENTER;\n\
    DEFINE height / FORMAT=3.0;\nDEFINE weight / FORMAT=3.0;\n```\n\n```\nRUN;\n```\n\
    \nYour output should look similar to Figure 7.10. Notice the way the Sex column\
    \ now\nappears with all the repeated values suppressed. Add the word DESCENDING\
    \ if you\nwant the order reversed.\n\n![](img/47cb3fb6301eb31415fa0b5e0922f416_157_0.png)"
  merge: -1
  pgno: 157
- img_proc: true
  md: "# Figure 7.10 Ordered output from PROC REPORT\n\n| Gender Age Height Weight\
    \ |\n| F | 13 | 57 | 84 |\n| 13 | 65 | 98 |\n| 14 | 63 | 103 |\n| 12 | 60 | 85\
    \ |\n| 15 | 63 | 113 |\n| 11 | 51 | 51 |\n| 14 | 64 | 90 |\n| 12 | 56 | 77 |\n\
    | 15 | 67 | 112 |\n| M | 14 | 69 | 113 |\n| 14 | 64 | 103 |\n| 12 | 57 | 83 |\n\
    | 13 | 63 | 84 |\n\nYou can order by as many columns as you want. The nesting\
    \ is determined by the order in which the columns appear in the COLUMN statement.\n\
    \nWhere REPORT really starts to get interesting is if you want to calculate new\
    \ columns. In every other procedure, you have to do that as a separate data preparation\
    \ function, but not here. Amend your program by adding the extra column, DEFINE\
    \ statement, and compute block as shown in the following code:\n\n```\nPROC REPORT\
    \ DATA=egprog.class;\n  COLUMN sex age height weight hratio;\n  DEFINE sex / ORDER\
    \ 'Gender' CENTER;\n  DEFINE age / CENTER;\n  DEFINE height / FORMAT=3.0;\n  DEFINE\
    \ weight / Format=3.0;\n  DEFINE hratio / COMPUTED 'Ratio' FORMAT=4.2;\n  COMPUTE\
    \ hratio;\n    HRATIO = height.SUM / weight.SUM;\n  ENDCOMP;\n```\n\nRUN;\n\n\
    The main things to notice are that the new column is defined as COMPUTED and as\
    \ such it has a block of code that calculates the value."
