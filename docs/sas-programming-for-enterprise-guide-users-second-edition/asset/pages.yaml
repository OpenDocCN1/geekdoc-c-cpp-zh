    | FINANCIAL | 3 |

    | GAMES | 13 |

    | GRAPHICS | 9 |

    | LANGUAGE | 6 |

    | NETWORK | 3 |

    | PUBLISHING | 4 |

    | SPREADSHEET | 7 |

    | TRAINING | 3 |

    | UTILITY | 9 |'
