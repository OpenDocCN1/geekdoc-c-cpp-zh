- img_proc: true
  md: "It is quite normal to have KEEP options on the incoming and outgoing tables\
    \ if you are doing intermediate calculations. You have to read the data in to\
    \ do the calculations, and discard it when outputting.\n\nThe DATA steps work\
    \ by executing the code once for each row in your incoming data, effectively looping\
    \ every time it hits the RUN statement. The SET statement is the point at which\
    \ the row is read into memory, and unless you specify otherwise, the RUN statement\
    \ is the point at which the new row is created from memory. The other statements\
    \ work on the data while it is in memory.\n\nHere is the SQL equivalent of this\
    \ DATA step code:\n\n```\nPROC SQL;\nCREATE TABLE table products AS\nSELECT description,\
    \ product_type,\n  price - cost AS unit_profit\nFROM egprog.as_products;\nnQUIT;\n\
    ```\n\n# Creating Multiple Tables\n\nOne area in which the DATA step is more efficient\
    \ than SQL is creating multiple tables in one step. Let's look at where we leave\
    \ our program.\n\n```\nDATA PRODUCTS (KEEP=description product_type unit_profit);\n\
    SET egprog.as_products(KEEP=description cost price\n  product_type);\n  unit_profit\
    \ = price - cost;\nRUN;\n```\n\nFirst, can you see that we have not specifically\
    \ told SAS to write anything to our new data set. If there are no instructions\
    \ to the contrary, SAS creates each row at the end of the DATA step, where we\
    \ see the RUN statement. To prevent this behavior, we take control by using our\
    \ OUTPUT statement.\n\n```\nDATA PRODUCTS (KEEP=description product_type unit_profit);\n\
    SET egprog.as_products(KEEP=description cost price\n  product_type);\n  unit_profit\
    \ = price - cost;\nRUN;\n```"
  merge: -1
  pgno: 111
- img_proc: true
  md: '# Chapter 5: Data Manipulation Part 2: DATA Step and Functions 97


    This code does exactly the same as the previous example, but now we explicitly
    say when we want each row to be created.


    We said that the output tables are listed on the DATA statement. If we want to
    create more than one table, we just list them on the DATA statement separated
    by spaces.


    ```

    DATA games storage other;

    SET egpgrog.as_products (KEEP=description cost price

    product_type);

    unit_profit = price - cost;

    OUTPUT;

    ```


    RUN;


    This code would create three tables, but exactly the same rows would go to each
    one. What we really want is to have different rows directed to different tables
    depending on the value of the product_type variable.


    The DATA step steps support conditional processing by using IF-THEN/ELSE statements.
    If a condition is true, THEN execute a statement. If the condition is not true
    (ELSE), execute a different statement, which could be another IF statement if
    needed.


    The expression part of an IF statement is identical to that of the WHERE statement,
    except that it does not allow the following expressions:


    +   * BETWEEN

    * CONTAINS (?)

    * LIKE

    * SOUNDS LIKE (=*)

    * IS NULL

    * IS MISSING


    The lack of these expressions is not a significant limitation, because you can
    do them all by writing the expression differently (using = instead of IS NULL
    on numeric columns, for example), or by using SAS functions (testing the result
    of the INDEX function instead of using CONTAINS).


    Building some conditional processing in and adding table names to our output statements
    takes us almost to where we want to be.'
  merge: -1
  pgno: 112
- img_proc: true
  md: '# SAS Programming for Enterprise Guide Users, Second Edition


    ```

    DATA games storage other;

    SET egprog.as_products(KEEP=description cost price

    product_type);

    unit_profit = price - cost;

    IF product_type = "GAMES" THEN OUTPUT games;

    product_type = "DATABASE" OR

    ELSE IF

    product_type = "SPREADSHEET"

    THEN OUTPUT storage;

    ELSE OUTPUT other;

    ```


    The last step in the process is to decide what columns we want in each of the
    tables we are creating. STORAGE AND OTHER will have identical columns. We do not
    need to have the product_type column on the GAMES table, because its only value
    would always be GAMES. Our final program looks like this:


    ```

    DATA GAMES (KEEP=description unit_profit)

    STORAGE (KEEP=description product_type unit_profit)

    OTHER (KEEP=description product_type unit_profit);

    SET egprog.as_products(KEEP=description cost price

    product_type);

    unit_profit = price - cost;

    IF product_type = "GAMES" THEN output games;

    ELSE IF

    product_type = "DATABASE" OR

    product_type = "SPREADSHEET"

    then output storage;

    ELSE output other;

    ```


    RUN;

    Although this result could be achieved in SQL, it would take three separate statements,
    with each reread some or all of the original table, so it would almost certainly
    be less efficient.


    If not records were being written, then SQL might turn out to be a more efficient
    solution, because the DATA step might end up reading more records than SQL. Once
    again, experimentation is the only way to be sure.


    # When Position Matters


    In a relational database, the position of any item of data in relation to any
    other item of data must have no significance. An item must be clearly identifiable
    by referring to the column and the row that it is in. That is Codd''s Rule 1 (the
    one after Rule 0). As a consequence, SQL has no mechanism for dealing with positional
    data.'
  merge: -1
  pgno: 113
