  md: "# Chapter 5: Data Manipulation Part 2: DATA Step and Functions 103\n\nWe can\
    \ use the DATA step to do this, and we can also convert the Microsoft Excel datetime\
    \ values to date values and make sure we have the right format applied depending\
    \ on our locale. First import the Excel spreadsheet into the EGPROG library using\
    \ the Import Data wizard and call the imported data set AS_PROMOTIONS.\n\nThis\
    \ program then handles the replication for us:\n\n+   1 DATA egprog.promotions\n\
    \   KEEP=id name description start end\n   product_code product_description);\n\
    2 RETAIN id name description start end;\\3 SET egprog.as_promotions;\n4 IF promotion_id\
    \ NE \"\" THEN DO;\n   id = promotion_id;\n   name = promo_name;\n   description\
    \ = promotion_description;\n   start = datepart(start_date);\n   end = datepart(end_date);\n\
    5 END;\n6 FORMAT start NLDATE.;\n7 RUN;\n\n+   The DATA statement names the table\
    \ we want to create and the library we want to create it. The statement also lists\
    \ all of the columns we want to write to the table using the KEEP= option.\n\n\
    +   The RETAIN statement instructs SAS not to reset the values of the listed columns.\
    \ We have listed here the five columns we want to preserve.\n\n+   The SET statement\
    \ identifies the table we are reading in, EGPROG.AS_PROMOTIONS in this instance.\n\
    \n+   Next we have an IF statement that checks to see whether the promotion_id\
    \ is missing or not. If it is not missing, we know we are at the start of a new\
    \ promotion and need to update the values in our five retained columns. Usually\
    \ an IF statement can execute only one statement based on the condition. If you\
    \ want to execute more than one statement, you must group them together using\
    \ a DO/END block. Here we want to run five statements, so we have grouped them.\n\
    \n+   The five statements we are executing each move one of of the new promotion\
    \ details to one of our retained columns. The two dates also use the DATEPART()\
    \ function to extract the date from the datetime in Microsoft Excel.\n\n+   The\
    \ END statement finishes our grouping."
