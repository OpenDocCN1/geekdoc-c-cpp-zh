  md: '# Chapter 4: Data Manipulation Part 1: Queries


    an SQL report to list all the employees, the departments they have access to,
    and the dates during which they have access. Make sure you use labels and formats
    so that the report is readable.


    Solution

    In a Program node, enter statements similar to the following:


    ```

    PROC SQL;

    SELECT empmaster.empid LABEL="Number",

    name LABEL="Name",

    dept LABEL="Department",

    startdate LABEL="Start Date" FORMAT=DDMMYY10,

    enddate LABEL="End Date" FORMAT=DDMMYY10,\nFROM egprog.empmaster, egprog.empdept

    WHERE empmaster.empid = empdept.empid;

    QUIT;

    ```


    Write an SQL update that sets the SecChange flag back to X after the DELETE. UPDATE,
    and INSERT tasks are complete. Use a WHERE clause to make sure you only update
    rows where the SecChange flag is not currently X.


    Solution

    In a Program node, enter statements similar to the following:


    ```

    PROC SQL;

    SELECT * FROM egprog.empmaster;

    UPDATE egprog.empmaster

    SET secchange = "X"

    WHERE secchange NE "X";nSELECT * FROM egprog.empmaster;

    QUIT;

    ```


    The SELECT statements before and after the UPDATE statement are simply allow you
    to verify that the data has been correctly updated.


    Put a constraint on the ZoneAccess and EmpDept tables to ensure that the EndDate
    is greater than the StartDate. Display an informative message if there are any
    violations.


    Solution

    In a Program node, enter statements similar to the following:


    ```

    PROC SQL;

    ALTER TABLE egprog.empdept

    DROP CONSTRAINT valid_date

    ```'
  merge: -1
