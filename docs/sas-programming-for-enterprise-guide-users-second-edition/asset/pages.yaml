  md: '# Chapter 5: Data Manipulation Part 2: DATA Step and Functions 101


    +   The SET statement identifies the table we are reading in, the SORTEDCLASS
    table we created with the Sort data task.


    +   Next we have a BY statement declaring our data is sorted by the listed column.
    Using this statement tells SAS our data is grouped by that value. SAS then automatically
    sets temporary variables for us, allowing us to see when we are at the beginning
    or the end of each listed group. In this case, the variables are called FIRST.Sex
