  md: '# Foreword


    Because SAS has the capability to do so much, it is actually quite hard to limit
    a book

    like this.


    Throughout I have tried to take the view that if something can be done by using
    a SAS

    Enterprise Guide task, then that is the way to do it. I have not tried to show
    alternative

    methods to those in SAS Enterprise Guide unless there is some clear advantage.


    I have also deliberately tried to make this book a syntax reference. Instead,
    I have

    pointed to the available documentation and help.


    The ideas for the techniques and tips in this book have come from many sources.
    Some

    are the result of customer projects I have been involved with. Many are techniques
    I have

    worked out in response to questions I have been asked by students during my courses.
    I have

    few have come about because of my interest in the proper use of the capabilities
    of the

    World Wide Web.


    SAS Enterprise Guide is continually evolving. Future versions will almost certainly

    provide capabilities to do some of the things we now have to do with code. But
    the SAS

    language is also evolving, so we might still need to use code with SAS Enterprise
    Guide

    to access added capabilities. There will always be a need to look beyond SAS Enterprise

    Guide to accomplish everything we need.


    If nothing else, I hope this book will give you the curiosity to find out what
    else can be

    achieved.'
  merge: -1
