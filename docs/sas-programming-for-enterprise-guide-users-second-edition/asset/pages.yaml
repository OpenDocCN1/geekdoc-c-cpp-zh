- img_proc: true
  md: 'If you want to access a fairly small subset of data from a large amount of
    data, SAS will almost certainly use an available index. As the size of the subset
    increases in relation to the size of the data set, then the likelihood of an index
    being used decreases.


    When an index is built, SAS records 21 different pieces of information about the
    data it points to. SAS uses this data to estimate how long it will take to retrieve
    the requested data via index. SAS does the same calculation for any alternative
    indexes that could be used, and for reading the data sequentially. Whichever is
    the best solution is the method that is selected.


    This makes it hard to guess which method SAS will use. Frankly, you can change
    a system option to make SAS tell you what it is doing with indexes.


    ```

    OPTIONS MSGLEVEL=1;

    ```


    The default setting for the MSGLEVEL option is N, which shows notes, but not information
    messages. I setting shows both.


    Again, you might want to set this option as a global change or include it via
    a Program in specific projects. With the option set, you can look in the log whenever
    you run a query and see which indexes are being used, and even the reasons that
    some have been discarded. Here is a simple example:


    ```

    WHERE sex = "M";nINFO: Index Sex selected for WHERE clause optimization.

    ```


    Another instance you might be looking for a specific value is when you are using
    SQL to join two or more tables. In this case, you are typically using a WHERE
    or a JOIN clause to find specific values in the tables linked to.


    The same rules determine whether an index will be used, and you can use the same
    technique to see what is happening.


    Finally, what if you want to access data in a certain order? In the reporting
    tools we will see later, the order in which data is accessed is handled within
    the reporting tool.


    In the tasks that have a GROUP BY function—List Data, for example—it is necessary
    to access rows in a certain order to make the grouping work properly. SAS Enterprise
    Guide handles this by sorting the rows for you unless they are already sorted
    in the correct order. If you want to force SAS Enterprise Guide to use an index
    that you know exists, do not use the GROUP BY role. Instead, insert a BY statement
    in the procedural code for the task.


    ```

    SEX;

    ```'
