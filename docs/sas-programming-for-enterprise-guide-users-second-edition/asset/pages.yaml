- img_proc: true
  md: "# Improving BY Lines\n\nLet's start with a simple listing report based on the\
    \ EGPROG.CLASS table. Put any columns you like in the List variables role, but\
    \ make sure you put Sex in the Group analysis by and Page by roles. After you\
    \ run the task, you should see output like this: \n\nFigure 7.7 Report with BY\
    \ groups\n\n![](img/47cb3fb6301eb31415fa0b5e0922f416_150_0.png)\n\nNotice the\
    \ line below that says \"Sex=M\" on the second page. This is called the BY line\
    \ and it crops out when you use the Group analysis by task role. On the List Data\
    \ task, you can get rid of it by including the same column or columns in the Identifying\
    \ label role, but this role is not available in other tasks. It is an easy way\
    \ to improve the BY line display in all tasks.\n\nThe first thing we need to do\
    \ is prevent SAS from producing a BY line. Reopen your task and click the Preview\
    \ button and then the Insert Code button. Double-click the first available code\
    \ insertion point and type in the following line:"
  merge: -1
  pgno: 150
- img_proc: true
  md: '# 136 SAS Programming for Enterprise Guide Users, Second Edition


    If you rerun the task, you will see that the only thing that has changed is that
    the BY line has gone. This setting remains for the current session, so if you
    think you might want to default BY lines elsewhere, then make sure you reset it
    at the end of the task by inserting the following statement after the procedure
    code:


    ```

    OPTIONS BYLINE;

    ```


    With the default switched off, you can now format the BY line as you want it using
    the Title or Footnote pane in the List Data task. Before you do, if you do not
    already have one, create a simple format to display “F” as “Female” and “M” as
    “Male,” and then use the Properties window in the List Data task to apply that
    format to the Sex column.


    Now go into the Title pane of the List Data task, deselect the Use Default text
    check box, and type in the following text:


