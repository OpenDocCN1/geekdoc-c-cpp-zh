  md: '# 82 SAS Programming for Enterprise Guide Users, Second Edition


    This code tells SAS to group by SEX and assumes that the data can be obtained
    in the correct order. If it cannot get the correct order, you will get an error
    message. The data can be retrieved in the correct order if any of the following
    conditions are met:


    +   - The data is in the correct order already, perhaps after a sort.

    - There is a suitable index.

    - The data is on a third-party database that will automatically return it in the
    correct order. This is true of relational databases accessed via SAS/ACCESS.


    Look at the generated code for your particular task to see where it puts a B statement,
    and insert yours at the same point.


    # Good Index, Bad Index


    Just one final reminder. As you can see, indexes have a lot of advantages, but
    do not forget they take up space and require effort to maintain. It might be better
    to sort your data, especially if you want many reports in the same order. It can
    even be very effective to combine a sort and an index. You can speed up retrieval
    by arranging the data so that all the records of the same value are together,
    with an index pointing to the start of that group.


    However, do not be scared of indexes. They are a rapid way of getting to the data
    you want and probably take less time to build than the time it takes to sort.
    They probably also take up space and resources than maintaining a sorted copy
    of your data.


    Finally, remember that whenever you re-create your data set, you also have to
    re-create your index. If you are just building a temporary index for a specific
    purpose, then drop it as soon as you have finished with it.


    # Updating and Validating Data


    The Query Builder task in SAS Enterprise Guide is a superb way of selecting the
    data you need, joining it together, and using it to create new data sets. However,
    the task does not allow maintenance of data once you have created it.


    In this section, we look at how you can delete rows you no longer require, how
    you can add new rows without recreating the entire table, and how you can change
    the values of data items that are already there. Think before doing this. If you
    are affecting only a few rows in a large table, it is almost certainly worth using
    some of the techniques outlined'
  merge: -1
