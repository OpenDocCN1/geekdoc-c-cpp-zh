  md: '# Chapter 7: Enhancing Report Output


    The named output file was produced by a combination of a WHERE statement and ODS
    statements, both of which we have already seen how to do. The report also has
    the background color cells changing depending on the value in each cell. We will
    see how to do this in the List Data task and we will also see how to do something
    similar in the Summary Tables task and in PROC REPORT. We will then see an alternative
    approach in PROC REPORT that offers the most flexibility.


    To use the technique as shown previously, the first thing you need to do is to
    define a format with a Create format task. Because it is based on numeric data,
    this is a numeric format that we have called wformat. Its only rule is that it
    returns the value Red for all numbers of 100 or more. The set up screens should
    look like Figures 7.16 and 7.17.


    # Figure 7.16 Options for wformat


    ![](img/47cb3fb6301eb31415fa0b5e0922f416_168_0.png)


    You must define a valid format.'
