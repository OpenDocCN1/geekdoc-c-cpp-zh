- img_proc: true
  md: '# 34 SAS Programming for Enterprise Guide Users, Second Edition


    The flexibility gained by being able to insert code at any of those points is
    tremendous. Best of all, by working this way you can still use the task window
    to maintain everything it supports.


    To insert code at any point, double-click in the indicated area. A separate code
    editor window opens.


    # Figure 2.17 Window for entry of user code


    ![](img/47cb3fb6301eb31415fa0b5e0922f416_49_0.png)


    Unfortunately, this window does not use the color coding available in all the
    other editor windows, so it is easier to making typing errors. The color coding
    is available for the inserted code when you return to the Code Preview window.


    When you have finished typing your code, click OK. Continue inserting code at
    other points as needed, and when you are finished, click OK to return to the Code
    Preview window. All of your inserted code is now visible. Close the Code Preview
    window and select Run to test your changes. There are many examples of this technique
    throughout this book, and we step through the process for specific examples.


    If you save a task as a template, then any code that has been inserted is also
    saved.


    Once again, think about people having to maintain this project in the future.
    If you look in either the project tree or process flow, nothing indicates that
    any custom code has been inserted. If you go into the task itself, there is still
    no indication that changes have been made. The only way to see that additions
    have been made is to go back into the Code Preview window and scan the code that
    is—there—not easy and very prone to error.


    It is good practice to visibly document any changes by attaching a note to the
    task. In the process flow or project tree, click on the task you want to document,
    and then select File→New→Note.


    Document what you have done and close the note window. The Note node is now visible
    in the process flow to indicate that there is something to investigate.'
  merge: -1
  pgno: 49
- img_proc: true
  md: '# Chapter 2: Understanding Coding with SAS Enterprise Guide 35


    # Figure 2.18 Task with attached note


    ![](img/47cb3fb6301eb31415fa0b5e0922f416_50_0.png)


    To be even more helpful, try renaming the Note node so that it is less generic—"Inserted
    Code Note," for example. Alternatively, rename the task so that it includes an
    indication that code has been inserted.


    The option of inserting code at predefined points within the generated code is
    the key technique for keeping the ease of use offered by SAS Enterprise Guide
    tasks while accessing the full power of SAS!


    # Using Generated Code as a Template


    There might be occasions when you just want to use the generated code as the basis
    for your own SAS program. These might include the following situations:


    +   * The program will run outside of SAS Enterprise Guide.

    * You want to make extensive changes.

    * You want to tailor a task that has no option to insert code.


    Be aware, though, that once you make a copy of the code, any changes you want
    to have to be at the code level. The original task that generated the code no
    longer has any connection to your code, so changes do not come through to your
    new code.


    The easiest way to get a copy of the code is to open the generated code by right-clicking
    the task in the process flow and selecting Add as Code Template.'
  merge: -1
  pgno: 50
