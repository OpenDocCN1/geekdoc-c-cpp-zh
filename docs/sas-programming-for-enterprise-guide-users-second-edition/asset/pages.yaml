  md: "# 94 SAS Programming for Enterprise Guide Users. Second Edition\n\nmore about\
    \ it. You are unlikely to ever learn or need to know all there is to know\nt DATA\
    \ step.\n\nThe DATA step is used for reading data from text files, manipulating\
