    Fortunately the DATA step is perfect for this sort of thing. The following code
    gives us exactly what we want:


    +   - DATA tallest;

    - RETAIN ranking;

    - SET sortedclass;

    - BY sex;

    - IF first.sex THEN ranking=0;

    - Ranking = Ranking+1;

    - IF ranking LE 2 THEN OUTPUT;

    - RUN;


    You have seen most of these statements before, but we will go through each in
    turn and introduce the new items when we get to them.


    +   - The DATA statement names the table we want to create. In this case we are
    calling TALLEST. We have not specified a library, so it will go in the WORK library.

    - The RETA statement is one we have not seen before. Each time you loop around
    a DATA step, all of the columns coming from the incoming data are overwritten
    by new values, and all columns that are defined in the program are set to missing.
    The RETA statement instructs SAS not to reset the values of the listed columns.
    We need to control when our ranking is initialized, so we tell SAS to retain the
    value.'
