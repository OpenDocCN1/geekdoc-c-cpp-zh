- img_proc: true
  md: '# Chapter 3: Getting Started


    The part of SAS that deals with how that information is presented is the Output
    Delivery System, more usually referred to as ODS.


    Using ODS, you can direct your output to any of a number of different destinations,
    most commonly HTML (Hypertext Markup Language, the language of the World Wide
    Web), Rich Text Format (RTF—used by word processors), Portable Document Format
    (PDF—used by Adobe Readers), comma-separated values (CSV) files, SAS data sets,
    or SAS Report format, an XML file structure that can be displayed by SAS Business
    Intelligence clients as SAS Web Report Studio.


    For each of those destinations, you can supply general styling information, specific
    attributes that each destination supports, and information about the location
    you want things sent to.


    In SAS Enterprise Guide, you interact with ODS by specifying which output type
    you want and which output style. SAS Enterprise Guide currently supports only
    the RTF, HTML, PDF, Text, and SAS Report formats.


    You can specify your global output preferences by selecting Tools→Options→Results
    General and checking the type or types of output you want. Then choose each output
    type in turn to change style and other destination-specific options as needed.


    If you want to change the output for a specific task, then select the Properties
    section and open the Properties dialog box for the task by clicking the Edit button,
    and then choose Results, styles, and behavior check box and choose the output
    type and style you want for the specific task.


    # Making Your Output Go Where You Want


    SAS Enterprise Guide allows work to be exported as part of the process flow. However,
    you can still save it to fixid locations and with only with a fixed name or a
    name with a date-and-time stamp appended. In this section we will see how to take
    complete control of the filename.


    First, we want to take over control of our output, so we need to stop SAS Enterprise
    Guide from trying to generate the output for us.'
