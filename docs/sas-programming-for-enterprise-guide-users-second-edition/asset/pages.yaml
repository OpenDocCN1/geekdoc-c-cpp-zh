  md: '# 14 SAS Programming for Enterprise Guide Users, Second Edition


    # Introduction


    In this chapter we look at the basic structure and building blocks of a SAS program
    and show how to write your own program that fits within a SAS Enterprise Guide
    process flow.


    We then look at the code that SAS Enterprise Guide generates and show how you
    can add to that code without starting from scratch, while still being able to
    work in the user-friendly task interface.


    Throughout the rest of this book it will be useful to have SAS Enterprise Guide
    open while you are reading.


    # The Structure of a SAS Program


    Let''s look first at how you can write your own SAS program in SAS Enterprise
    Guide and exactly what a SAS program consists of.


    # Writing Your Own Code: The Program Node


    The Program node is the method by which SAS programs are used in SAS Enterprise
    Guide. You can add programs written outside of SAS Enterprise Guide to a project
    or write programs directly into a project.


    To help you understand the components of a SAS program, we will write our own
    program directly in SAS Enterprise Guide, run it within SAS Enterprise Guide,
    and examine the output and feedback we get.


    Open SAS Enterprise Guide and start a new project. Create a new Program node by
    selecting File→New→Program or Program→New Program. You can also right-click anywhere
    in the Process Flow window and select New→Program.


    This opens a program editor. If you have done any SAS programming using the traditional
    SAS Display Manager, you will soon see that this window offers the same capabilities
    as the SAS Enhanced Editor.'
  merge: -1
  pgno: 29
- img_proc: true
  md: '# Chapter 2: Understanding Coding with SAS Enterprise Guide


    With your cursor positioned in the Program window, type in the following lines
    of code:


    ```

    /* My First SAS Program*/

    TITLE ''Report of Female Students in Class''

    PROC REPORT DATA=egprog.class;

    WHERE sex=''F'';

    RUN;

    ```


    The following chapters explain in detail what code is doing, but for now we will
    use these lines of code to illustrate all the basics of programming in SAS. Before
    we do that, though, let''s just run the code and see what happens.


    With most things in SAS, there are a number of ways you can run the code. Any
    of the following will work:


    In the Program window:


    +   - Press F3.

    - Press F8.

    - Select Program→Run Program on Local.

    - Press the Run button.

    - Right-click in the window and select Run on Local.


    Or, in the Program window:


    +   - Right-click in the window.

    - Select Run on Local.


    In the Project Designer or Process Flow windows:


    +   - Select the Program node you want to run.

    - Press F3.

    - Press F8.

    - Select Code→Run Program on Local.


    # Data


    All of the data used in this book is available to you by download from the author
    page for this book at support.sas.com/authors. Appendix C for information on the
    data used.


    # Servers


    Servers are where the actual SAS code generated by SAS Enterprise Guide is run.
    They can be on the same machine as SAS Enterprise or on a machine elsewhere that
    you are connected to. The examples in this book assume you are working on a local
    server. If you have a different server, then you will see the name of that server
    in place of “Local.” If you have multiple servers available, then you can choose
    which one to use.'
  merge: -1
