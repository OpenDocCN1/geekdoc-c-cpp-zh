    2. Create a bar chart showing the number of films each Bond actor has appeared
    in, and make each bar link to the detail reports developed in the previous chapter.'
  merge: -1
  pgno: 288
- img_proc: true
  md: "# 274 SAS Programming for Enterprise Guide Users, Second Edition\n\n# Solution\n\
    \nIn a Program node, enter statements such as the following to create the input\
    \ table:\n\n```\nODS OUTPUT SQL_RESULTS=bondgraph;\nPROC SQL NUMBER;\n  SELECT\
    \ actor, count(*) AS number_of_films\n  FROM completebond GROUP BY actor;\n  CREATE\
    \ TABLE bondgraph AS\n  SELECT actor, number_of_films,\n    row\n    CASE WHEN\
    \ 1 THEN 'href=c:\\temp\\bond.html'\n    ELSE CATS('href=c:\\temp\\prod\", -row\
    \ - 1, '.html')\n  END AS bondgraph;\nFROM bondgraph;\nDROP TABLE bondgraph;\n\
    QUIT;\n```\n\nThe COMPLETEBOND table read in the first SELECT clause is the table\
    \ created in Exercise 1 of Chapter 7. The code itself is very similar to that\
    \ used in Chapter 8, where there a full explanation of the code. The href column\
    \ points to the set of files created in Chapter 7, Exercise 2. Don’t forget to\
    \ switch off the default results from your code; otherwise you will see an additional\
    \ report.\n\nNow complete the following steps:\n\n+   Select the BONDGRAPH table\
    \ produced by the preceding code.\nFrom the Graph menu, select Bar Chart and select\
    \ Simple Vertical Bar as the type.\nIn the Task Roles pane, move actor to the\
    \ Column to chart role and number_of_films to the Sum of role.\nSelect Preview\
    \ code, and then Insert Code.\nDouble-click just before the semicolon at the end\
    \ of the VBAR3D statement, and insert the following code:\n\nHTML=href\nReturn\
    \ to the main task window and run the task.\nDouble-click on any bar to link to\
    \ the relevant report for that bar.\n\n# Chapter 9: Macros: Reusable Programming\n\
    \n+   1. Convert the pie chart produced in the previous chapter so that the whole\
    \ task becomes a macro that receives the name of the pie slice to be exploded."
  merge: -1
  pgno: 289
- img_proc: true
  md: "# Appendix D: Solutions to Exercises 275\n\nSolution\nComplete the following\
    \ steps:\n\n+   - Right-click the Pie Chart task created in Exercise 1 of Chapter\
    \ 8, and select\nProperties.\n\n+   - Select Prompts, select the pie parameter,\
    \ and click Remove.\n\n+   - Open the Pie Chart task by double-clicking the icon,\
    \ and then click Preview\ncode and Insert Code.\n\n+   - Double-click on the first\
    \ insertion point and type in the following code:\n  %MACRO mypie(pie);\n\n+ \
    \  - Click OK, and then scroll down to the last insertion point, double-click,\
    \ and type\nin the following code:\n  %MEND;\n\n+   - Return to the main task\
    \ window and run the task to create the macro.\n\n2. Create a Program node and\
    \ enter the code necessary to call your new macro.\n\nSolution\nIn a Program node,\
    \ enter statements such as the following to run the macro:\n\n```\n%mypie(February\
    \ Gamer)\n```\n\nUse whichever segment name you want to explode."
