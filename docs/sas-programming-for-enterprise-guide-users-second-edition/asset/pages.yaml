- img_proc: true
  md: '# 186 SAS Programming for Enterprise Guide Users, Second Edition


    An ordinary bar chart indicates one statistic for each bar by varying the height
    of a vertical bar or the length of a horizontal bar. The area bar chart allows
    the addition of another variable by altering the width of the bars. The following
    example shows the total revenue for each product type on the bar length, and the
    total quantity sold on the bar width.


    Figure 8.16 An area bar graph


    ![](img/47cb3fb6301eb31415fa0b5e0922f416_201_0.png)


    From a quick look at the graph, you can see that the quantities for database products
    are quite small, but that is where the money comes from, closely followed by graphics
    and language products. Although games sell more than anything else, the revenue
    is less than half of database products.


    The syntax to produce this graph is actually quite simple. In this example we
    have used a table called REVENUE , which can be downloaded from the author page
    for this book Go to support.sas.com/author to download the table.


    Create a new Program node and type in the following:


    ```

    PROC GAREABAR DATA=egprog.revenue;

    HBAR3D product_type*quantity / SUMVAR=revenue;

    RUN;

    ```'
  merge: -1
