  md: '# 12 SAS Programming for Enterprise Guide Users, Second Edition


    Figure 1.9 Data being split


    ![](img/47cb3fb6301eb31415fa0b5e0922f416_27_0.png)


    In this example, the CLASS data set is being split into MALES and FEMALES. This
    can be achieved in SAS Enterprise Guide by using two standard Query Builder tasks,
    but again again using a few lines of code—five in this case—saves reading the
    data twice.


    # # Summary


    SAS started life long before the current fashion for Graphical User Interfaces
    and can do far more than is available through the SAS Enterprise Guide task interfaces.


    By understanding the SAS Programming language, SAS Enterprise users can access
    the full power of SAS while still maintaining the ease of use of SAS Enterprise
    Guide.


    Occasionally it might be necessary to develop your own code. Even then, a relatively
    small number of lines can give significant gains in efficiency or in the results
    achieved.'
  merge: -1
