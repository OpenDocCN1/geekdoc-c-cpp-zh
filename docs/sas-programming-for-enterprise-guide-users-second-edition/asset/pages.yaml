- img_proc: true
  md: '# 170 SAS Programming for Enterprise Guide Users, Second Edition


    Although it is easy to create default graphs using SAS, it can become quite complicated
    if you want to alter their appearance in any way, such as by changing their colors
    or axis. Fortunately, SAS Enterprise Guide does all that for you. With a small
    amount of programming, however, you can do even more.


    You need to have SAS/GRAPH installed in addition to SAS Enterprise Guide for the
    following examples to work. If the SAS Enterprise Guide tasks work, then you have
    it installed.


    # SAS Enterprise Guide Graphical Output


    It is actually very easy to create a graph using SAS. Submitting the following
    code in a SAS Enterprise Guide Program node gives you the exceptionally high-quality
    graph shown in Figure 8.1.


    ```

    PROC GCHART DATA=egprog.class;

    VBAR3D Sex;

    RUN;

    QUIT;

    ```


    # Figure 8.1 Default vertical bar chart


    ![](img/47cb3fb6301eb31415fa0b5e0922f416_185_0.png)'
  merge: -1
  pgno: 185
- img_proc: true
  md: '# Chapter 8: Graphical Output 171


    The preceding graph is actually a small program based on Microsoft ActiveX technology.
    Using ActiveX means that you get nice effects like tooltips. If you have never
    had an opportunity to try out an ActiveX graph, then do so now. When you right-click
    the graph, a context-sensitive menu appears that enables you to completely alter
    the graph''s type, appearance, and color scheme. You can also interact with the
    graph by zooming, subsetting, and spinning the graph—a great feature if you are
    working with three dimensions. To use these features you need to have your output
    in HTML, not SAS Report format.


    You can change the output by using the task properties. You can create a Java
    program instead of ActiveX, a much better idea if you are not using Windows or
    Internet Explorer. However, you do get slightly fewer options. You can also change
    to any one of different picture types that do not allow interaction.


    When choosing output, remember that many ActiveX is a high security risk and do
    not accept that sort of output. If in doubt, use a picture format.


    The reason that the output looks so good is that SAS Enterprise Guide has done
    a lot of the work for you. If you do the same thing using the Bar Chart task and
    look at the generated code, you see a lot of extra instructions that control the
    appearance of the axis and the output type. Try it and see.


    In fact, SAS Enterprise Guide does so much for you in creating graphs I recommend
    you always start from a SAS Enterprise Guide task. Get the output as close as
    you can with that, and then make your programming changes.


    The gallery of graph types that SAS Enterprise Guide supports is extensive, so
    it is usually unnecessary to move beyond it. There are a few little tweaks you
    can use to enhance the supported tasks, and there is one useful graph that SAS
    supports that is not yet in SAS Enterprise Guide. We look at that graph later
    in this chapter.


    # Enhancing SAS Enterprise Guide Graphs


    In this section, we look at some effects that you can achieve with the addition
    of small amounts of extra code to the existing tasks. You can also use many of
    the techniques shown in the previous chapters, including ODS and macros.'
  merge: -1
  pgno: 186
- img_proc: true
  md: '# More Linking


    In the previous chapter, we saw ways of generating multiple HTML report files
    and building links to them. Use that project with its generated reports for the
    example in this section.


    What we want to do is add a drill-down capability to a simple bar chart. In other
    words, we want to be able to click a bar and see the detail that constitutes that
    summary.


    In the previous chapter, we produced one report for each product type in our products
    table. They were named PROD1.HTML through PROD10.HTML. What we now want is a graph
    showing the average price so that we can click it and see the detail report. This
    technique works only in HTML.


    The code that needs to be inserted into the graph task is minimal, but it requires
    a bit of data preparation. We will use SQL to prepare the data, because there
    is one column we need cannot be generated through the Query Builder task. You
    might recognize some of it as being very similar to the examples used in the previous
    chapter.


    Let''s build it gradually so that we can see what is going on. First we will use
    some code that gives us the average price per product type.


    ```

    PROC SQL;

    SELECT product_type, MEAN(price) AS Average_price

    FROM EGPROG.as_products GROUP BY product_type;

    QUIT;

    ```


    Put that code in a Program node and see that the output is correct so far.


    We need to have a consecutive number for each row. ANSI standard SQL has no way
    of creating these numbers, but fortunately SAS is more pragmatic and provides
    the NUMBER option shown here on the PROC SQL statement.


    ```

    PROC SQL NUMBER;

    SELECT product_type, MEAN(price) AS Average_price

    FROM egprog.as_products GROUP BY product_type;

    QUIT;

    ```


    This code gives you the output in Figure 8.2.'
  merge: -1
  pgno: 187
- img_proc: true
  md: '# Figure 8.2 Data for linking bar chart


    | Row | PRODUCT_TYPE | Average_price |

    |---|---|--|

    | 1 | DATABASE | 519.65 |

    | 2 | FINANCIAL | 62.63 |

    | 3 | GAMES | 56.83 |

    | 4 | GRAPHICS | 203.5222 |

    | 5 | LANGUAGE | 241.12 |

    | 6 | NETWORK | 271.7733 |

    | 7 | PUBLISHING | 194.8625 |

    | 8 | SPREADSHEET | 150.3357 |

    | 9 | TRAINING | 40.65 |

    | 10 | UTILITY | 92.56111 |


    It would be nice to think that we could insert a CREATE TABLE AS clause, but even
    though the output looks good, SQL actually does not know about the extra column.
    However, SAS knows about it, so we can use an ODS technique to redirect the SQL
    results to a SAS table.


    ```

    ODS OUTPUT SQL RESULTS=Prod1;

    PROC SQL NUMBER;

    SELECT product_type, MEAN (price) AS Average_price

    FROM egprog.as_products GROUP BY product_type;

    QUIT;

    ```


    The ODS OUTPUT statement used to create a table from what would otherwise be display
    output. Everything that is produced as output in SAS has a name. The output from
    SQL is called SQL_RESULTS, and here we send it to a table called PROD1. We do
    not have to close this sort of ODS output because it closes automatically after
    the output is created.


    At this point go to the Properties window, click Edit, and on the Results page,
    override the output so that you do not continue to get the HTML output.'
  merge: -1
  pgno: 188
- img_proc: true
  md: '# 174 SAS Programming for Enterprise Guide Users, Second Edition


    You now have the basis of your data ready. The final step is to add a new column
    that includes a URL pointing to our reports. The completed code now looks like
    this:


    ```

    ODS SQL_RESULTS=Prod1;

    PROC SQL NUMBER;

    SELECT product_type, MEAN(price) AS Average_price

    FROM egprog.products GROUP BY product_type;

    CREATE TABLE Prod2 AS

    SELECT product_type, Average_price,

    CATS("href=c:\temp\prod,row,".html") AS href

    FROM prod1;

    DROP TABLE Prod1;

    QUIT;

    ```


    The new code reads in the table we just created and calculates a new column with
    a value consisting of HREF followed by the report prefix concatenated with the
    row number and a file extension. The column is called href, but it can be called
    anything you like.


    The CREATE statement can be produced using a standard SAS Enterprise Guide Query
    Builder task, because it uses standard SQL.


    Finally, we use the DROP statement to delete the interim PROD table because it
    is no longer needed.


    After we run the previous code, our project has a table in it called PRO2. We
    use this table as the basis of our graph. Click the table, select Graph→Bar Chart,
    and from the Bar Chart task choose a simple vertical bar style.


    In the Tasks pane, move PRODUCT_TYPE to the Columns to chart role and AVERAGE_PRICE
    to the Sum of role.


    Make sure you change the output type to HTML: links do not work in SAS Report
    format unless you export them to another file type.'
  merge: -1
  pgno: 189
