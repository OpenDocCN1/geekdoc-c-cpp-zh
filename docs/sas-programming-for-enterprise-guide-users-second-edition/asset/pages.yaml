  md: '# Table 7.2 BY group options in the TITLE OR FOOTNOTE statements


    | Option | Description |

    | --- | --- |

    | #BYVAL(variable name) | Inserts the current formatted value of the named variable.
    If no format is present, then the raw data value is used. |

    | #BYVAR(variable name) | Inserts the label of the named variable, or the name
    if there is no label. |

    | #BYLINE(variable name) | Inserts the formatted BY line. |


    Obviously, the heading we have is a page heading, so this procedure only makes
    sense if the variables you are using are listed in the Page by role in addition
    to Group analysis by.


    You can use these features without using the NOLINE option, but then you are duplicating
    heading information and wasting valuable screen or page space.


    # Page Numbers


    If you using PDF or RTF output, you can include page numbering. (Because there
    is not really any concept of pages in HTML, there are no page numbering options
    for that destination.)


    To include page numbers, right-click the List Data task you have just created
    and select Properties. In the Results section, override the default output and
    choose PDF as your output type.


    Now go back into your List Data task. In the Enter User Code window where you
    previously inserted the OPTIONS NOBYLINE statement, add the following:


    ```

    ODS ESCAPECHAR="*";

    ```


    The full inserted text should now look like this:


    ```

    OPTIONS NOBYLINE;

    ODS ESCAPECHAR="*";

    ```


    Click the OK and Close buttons to get back to the task, and return to the Titles
    pane. This time you choose the footnotes and override the default text with the
    following:


    Page {thispage} of {lastpage}'
  merge: -1
  pgno: 152
- img_proc: true
  md: 'SAS Programming for Enterprise Guide Users, Second Edition


    Now when you run the task you should see a nicely formatted “Page 1 of 2” at the
    bottom of the page. The main things to remember here are the escape character
    you select must be one that you do not want to use in a title or footnote—we used
    an asterisk here—and you must surround the keywords with curly brackets. The part
    in the curly brackets is passed directly to the output file and interpreted by
    the reader; SAS does nothing with it.


    To get a similar effect in RTF, follow the steps shown previously, but this time
    insert the following in the footnote dialog box:


    ```

    Page *(pageof)

    ```


    The BY line and page numbering options can be used together or separately, in
    either the title or footnote areas.


    # Basic Formatting


    That''s as far as using the Title pane is concerned. You can get very dynamic
    and useful titles by using a combination of text, macros, and the special code
    we have just seen.


    If you look at the generated code, you will see what we type in the window ends
    up as a TITLE or FOOTNOTE statement. You can get some extra benefits by using
    your own TITLE statement.


    In the Insert Code of your List Data task, insert the line of code immediately
    before the PROC PRINT statement:


    ```

    TITLE J=L ‘Confidential’ J=C ‘Listing for BYVAL(sex

    students’ J=R ‘Page *(thispage) of *(lastpage}’;

    ```


    When you run your task, you should see a three-part heading with the word Confidential
    left-justified (J=L), the main heading center-justified (J=C), and the page numbering
    right-justified (J=R). You can use these options in any combination you like.


    # Adding Hyperlinks


    If you use the Web at all, then you use hyperlinks, which are areas of text or
    of a picture that takes you to a new Web page when you click on them. The new
    Web page to which you are linked might be on your own site, or it might be on
    another site.


    We saw some examples of SAS generating hyperlinks when we created a contents page
    from our ODS HTML statement. In this and the following section we will see some
    techniques you can use to add your own links to HTML pages. In the next chapter,
    we'
  merge: -1
  pgno: 153
- img_proc: true
  md: '# Chapter 7: Enhancing Report Output 139


    will also see a method for adding hyperlinks to graphs to produce a simple drill-down
    facility.


    Have you ever tried to print an HTML page? It rarely works well. Words drop off
    the edge of the page, and the pages themselves often break at the wrong place.
    Let''s face it—printing is not what HTML is designed for. HTML uses color; most
    printers are still black and white. The ideal page proportions are different for
    printed and online media. A considerable Web designer, what you need to do is
    provide both alternatives, which is fortunately one of the strengths of SAS Enterprise
    Guide.


    Again we will use EGROG.CLASS as our starting point. Using a SAS Enterprise Guide
    project with that data set available, create a List task. Move all the columns
    to the List variables role, and then go to Properties. Click the Edit button,
    choose Results, and switch off the default output. Navigate to the Insert Code
    window.


    Immediately before the PROC PRINT statement, insert the following lines of code:


    ```

    FOOTNOTE LINK="myp.pdf" "Print Version";nODS HTML PATH="c:\temp" FILE="myhtml.html"
    (URL=NONE) STYLE=barrettblue STYLESHEET="mystyle.css"

    ODS PDF FILE="c:\temp\myp.pdf" BOOKMARKGEN=NO;

    ```


    Notice that we are using the FOOTNOTE statement here with a new option, LINK=.
    This option makes the footnote text into a hyperlink that jumps to the location
    specified in the LINK= option. LINK= can also be used on the TITLE statement.


    It is very important in this example to use the PATH= option on the ODS HTML statement;
    otherwise, all your location links will be hardcoded, making it difficult to move
    files around.


    After the RUN statement, insert the following:


    ```

    ODS HTML CLOSE;

    ODS PDF CLOSE;

    ```


    Run the task, and then open a Web browser and open the file C:\temp\myhtml.html.
    At the bottom of the page you see a hyperlink called "Print Version." When you
    click that, the PDF version opens. The link does not work from within SAS Enterprise
    Guide because SAS Enterprise Guide uses an internal default location and file
    reference.'
  merge: -1
  pgno: 154
- img_proc: true
  md: '# SAS Programming for Enterprise Users, Second Edition


    This is a good start, but there are two problems with what we have produced here.


    First, the link footnote appears on both the HTML and PDF versions. Although it
    does not do any harm to the PDF version (it will just reopen the same document),
    it is not useful. The second problem is that the PDF version opens in the same
    window. It would be far better if we could make it open in a different window.


    What we really need is some way of having a different footnote on the two versions.
    We could create the task with one output type, and then copy and paste and make
    the changes we want. But that would mean that any future changes would have to
    be twice.


    At the end of this chapter, we will look at a way of changing your code so that
    you can develop two types of output from it.


    # One-Stop Reporting


    The List Report Wizard uses the REPORT procedure to produce its output. It does
    not have any way of previewing the code that is generated, nor does it have any
    way of adding to it.


    If you want to understand the generated code, use the Code tab after running a
    report.


    The REPORT procedure can do everything that the List Data task can do and more.
    There is also a large overlap with the Summary Tables task. Summary Tables does
    give easier access to row totals, but again PROC REPORT can do more.


    This section shows how to code your own PROC REPORT program. For most purposes
    it is such a straightforward procedure to use that writing the code is not difficult.


    We see how we can use PROC REPORT to produce and customize a detail report, including
    new columns, summoning the List Report Wizard can''t. We alter the order of the
    report without sorting the data first and add in a fully customized section at
    the end of the report. Then we switch to producing a summary report.


    Finally, we bring everything together and produce a table of contents for the
    reports generated earlier in this section.


    In SAS Enterprise Guide, create a new Program node and type in and run the following
    code:


    ```

    PROC REPORT DATA=egprog.class;

    RUN;

    ```'
  merge: -1
