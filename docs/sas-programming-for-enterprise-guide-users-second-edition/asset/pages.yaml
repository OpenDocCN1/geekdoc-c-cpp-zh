- img_proc: true
  md: '# 144 SAS Programming for Enterprise Guide Users, Second Edition


    The code starts with COMPUTE HWRATIO and ends with ENDCOMP. Between those two
    you can have as many statements as you like, largely following the sort of statements
    we saw in the DATA step in Chapter 5. In this example, we set the value of the
    data equal to height divided by weight.


    There are two main things to remember when using COMPUTE blocks. First, a column
    can access data only from columns listed before it in the COLUMN statement. Second,
    when you refer to numeric data, you must qualify the column name with the statistic
    you want to use, ,SUM in this case. Because this is a detail report, it might
    not seem to make sense to refer to the sum of a single value, but as we will see
    later, we can easily make this into a summary report.


    Let''s look at the numeric columns in more detail. Try running this report in
    a new Program node:


    ```

    PROC REPORT DATA=egprog.class;

    COLUMN age height weight;

    RUN;

    ```


    The output is this summary report:


    Figure 7.11 Fully summarized report


    | Age | Height | Weight |

    | 253 | 1184.4 | 1900.5 |


    All the information in this report is numeric, so the default behavior is to produce
    a fully summarized report showing the sum of the numeric values.


    Again, you can alter this behavior by using the DEFINE statement. Alter the previous
    program to add a DEFINE statement for any of the columns—Age, for example.


    ```

    PROC REPORT DATA=egprog.class;

    COLUMN age height weight;

    DEFINE age / DISPLAY;

    RUN;

    ```


    Using the DISPLAY type on the Age column forces the report to become a detail
    report again, and we see all the lines. If you wanted a summary report but wanted
    to see the mean values rather than the sum, then that is also possible.


    ![](img/47cb3fb6301eb31415fa0b5e0922f416_159_0.png)'
  merge: -1
  pgno: 159
- img_proc: true
  md: '# Chapter 7: Enhancing Report Output 145


    ```

    PROC REPORT DATA=egprog.class;

    COLUMN age height weight;

    DEFINE age / MEAN;

    DEFINE height / MEAN;

    DEFINE weight / MEAN;

    RUN;

    ```


    Allowed statistics on the DEFINE statement include MEAN, MIN, MAX, SUM, STDDEV,
    STDERR. For a full list, see the syntax help or the online documentation.


    If you want to have more than one statistic for a column, then define the column
    as many times as you need, and use aliases for each occurrence after the first.


    ```

    PROC REPORT DATA=egprog.class;

    (''Age'') age age=maxage

    (''Height'') height height=maxheight

    (''Weight'') weight weight=maxweight;

    DEFINE age / MIN ''Minimum'';

    DEFINE maxage / MAX ''Maximum'';

    DEFINE height / MIN ''Minimum'';

    DEFINE maxHeight / MAX ''Maximum'';

    DEFINE weight / MIN ''Minimum'';

    DEFINE maxweight / MAX ''Maximum'';

    ```


    ```

    RUN;

    ```


    Specify the alias with an equal sign after the column name on the COLUMN statement.

    Also notice the COLUMN statement show how group headings are produced by bracketing
    together a group of columns and specifying the first item in the brackets.


    After that slight detour, let''s go back to our original code and add some totals.
    We will use two new statements, RBREAK for report totals and BREAK for group totals.
    Add these statements to your code in this example:


    ```

    PROC REPORT DATA=egprog.class;

    COLUMN sex age height weight hratio;

    DEFINE sex / ORDER DESCENDING ''Gender'' CENTER;

    DEFINE age / DISPLAY CENTER;

    DEFINE height / format=4.0;

    DEFINE weight / FORMAT=4.0;

    DEFINE hratio / COMPUTED ''Ratio'' FORMAT=4.2;

    RBREAK AFTER / SUMMARIZE;

    BREAK AFTER sex / SUMMARIZE;

    COMPUTE hratio;

    hratioio = height.sum / weight.sum;

    ENDCOMP;

    ```


    ```

    RUN;

    ```'
  merge: -1
  pgno: 160
- img_proc: true
  md: "In both cases, specifying AFTER says that the results should be shown at the\
    \ end of either the report or the group. BEFORE is valid as well, and puts the\
    \ summary at the beginning of the report or group. On the BREAK statement, we\
    \ specify the column we are breaking with; we could have many groups in one report.\
    \ There are a few options you the could place after the forward slash, but most\
    \ of them have no effect on the output types we are using. The two options of\
    \ interest are SUMMARIZE, which we used in this example, or PAGE, which causes\
    \ a page break.\n\nNotice that we have increased the width of the format to allow\
    \ for the larger totals, and we have made Age a DISPLAY column because we did\
    \ not want the total age to appear in this example.\n\n```\nPROC REPORT DATA=egpgrog.class;\n\
    \  COLUMN sex age weight hratio;\n  DEFINE sex / GROUP DESCENDING 'Gender' CENTER;\n\
    \  DEFINE age / GROUP CENTER;\n  DEFINE height / FORMAT=4.0;\n  DEFINE weight\
    \ / FORMAT=4.0;\n  DEFINE hratio / COMPUTED 'Ratio' format=4.2;\n  RBREAK AFTER\
    \ / SUMMARIZE;\n  BREAK AFTER sex / SKIP SUMMARIZE;\n    COMPUTE hratio; height.sum\
    \ / weight.sum;\n  ENDCOMP;\nRUN;\n```\n\nThe only changes are on the DEFINE statements\
    \ for Sex and Age, and the report produced now looks like Figure 7.12."
  merge: -1
  pgno: 161
