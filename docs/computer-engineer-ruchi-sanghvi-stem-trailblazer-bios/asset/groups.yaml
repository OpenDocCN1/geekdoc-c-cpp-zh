    # TECH TALK


    > "This year, I made the most unconventional decision of my life. I quit Facebook.
    Everyone thought I was crazy....I was working on these things that were impacting
    millions of users. So why did I leave?... I wasn''t inspired anymore. And I didn''t
    want to live out someone else''s definition of success."


    Ruchi Sanghvi


    As she had done in the past, Sangvi decided to take a big risk. She quit Facebook
    and started a company called Cove with her husband. Cove developed software to
    help improve the way companies and other organizations communicate and work together.


    # DROBOX


    A company called Dropbox liked what Cove was doing. Dropbox offered to buy Cove
    and hire Sanghvi and her husband to work for them. Sanghvi and her husband agreed
    to sell Cove to Dropbox in 2012.'
- md: '

    # JUSTWORKS


    > Sanghvi discusses ideas with team members at the Dropbox offices in 2013


    Dropbox provides cloud storage. This technology allows users to store computer
    files at a remote location. Users can then access and share their files through
    the Internet. Sanghvi became vice president of the company’s operations, and her
    husband became the vice president of engineering. They shared their skills and
    ideas with Dropbox.


    # EXPLORING THE FUTURE


    Sanghvi had been working long hours for many years. In the fall of 2013, she decided
    to take a break. She wanted to figure out what she was passionate about and how
    she could continue to make a difference in the world.


    ![](img/ae9e705c714cd97fa29230fa02d2c484_28_0.png)


    ### IMMIGRATION REFORM

    As an immigrant to the United States, Sangvhi faced many roadblocks. She needed
    special permission from the government to attend college in the United States.
    To stay in the country after graduation, she had to keep a steady job. But finding
    a job can be tricky for immigrants. Many smaller companies don''t want to fill
    out the extra forms needed to hire an immigrant. Sangvhi got lucky with her job
    at Facebook. Now she wants to help other immigrants. In 2013, she asked the US
    Senate to pass new laws that will remove these roadblocks and give US immigrants
    the freedom to find the jobs they want.


    Sanghvi began investing money in other start-ups. These companies are developing
    new technology that excites Sanghvi. One of these start-ups is called Codeacademy.
    This free website teaches people how to write computer code in a fun and engaging
    way.


    Sanghvi has spent her life taking risks and pushing herself try to do new things.
    She has shown what a person can accomplish with courage and hard work. The question
    now is, What will Sanghvi accomplish next?


    # TIMELINE


    ### 1982

    Ruchi Sanghvi is born in Pune, India, on January 20.


    ### 2000

    Ruchi leaves India to study at Carnegie Mellon University in Pittsburgh, Pennsylvania.


    ### 2005

    Sanghvi graduates with a master''s degree in computer engineering. In the fall,
    she lands a job at Facebook.


    ### 2006

    Sanghvi helps launch Facebook News Feed, which attracts many new users to the
    site.


    ### 2007

    Sanghvi leads the development and launch of Facebook Platform, which allows third-party
    developers to create apps for Facebook.


    ### 2008

    Sanghvi leads the development and launch of Facebook Connect, part of Facebook
    Platform.


    ### 2011

    Sanghvi and her husband start their own company, Cove. Sanghvi receives a TechFellow
    Award for her work at Facebook.


    ### 2012

    Sanghvi and her husband sell Cove to Dropbox, and Sanghvi becomes vice president
    of operations.


    ### 2013

