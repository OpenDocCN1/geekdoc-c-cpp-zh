    # Chapter 5


    ![](img/ae9e705c714cd97fa29230fa02d2c484_23_0.png)


    Sanghvi (right) presents an award at the 2013 Crunchies Awards.


    # TAKINGnNEW RISKS


    Sanghvi''s hard work paid off. In 2011, she received a TechFellow Award for her
    outstanding work at Facebook. The award included a $100,000 prize. Sanghvi planned
    to use the money to help other start-up companies.'
  - '[PAGE 24]


    But professional success wasn''t the only thing Sanghvi found at Facebook. She
    also found love with her college friend and coworker, Aditya Agarwal. The two
    had been dating and decided to marry.


    # A START-UP OF HER OWN


    Things were going well for Sanghvi, but she was feeling restless again. She’d
    been passionate about building up Facebook, and it had become the world’s largest
    social networking site. But she wanted to build a company of her own.


    ![](img/ae9e705c714cd97fa29230fa02d2c484_24_0.png)


    > Sanghvi (second from right) receives a TechFellow Award for her work in engineering'
  - '[PAGE 25]


