- - '###'
  - 活动 4 考虑你的家，并写下一个你每天使用的物品，例如电视机（并简要说明你是如何操作该物品的）。
- - '###'
  - 反馈 4
- - '###'
  - 活动 5 考虑在医院工作的人——列出三种你预计会在那里雇佣的常见职业。
- - '###'
  - 反馈 5 根据你对医学专业的了解，你列出了三个非常通用的职业（例如医生、护士、清洁员），你也可能列出了更具体的职业，如放射科医生、外科医生等。
- - '###'
  - 活动 6 就医生写一条你认为对所有医生都真的陈述，并就外科医生写一条对所有医生不一定真的陈述。
- - '###'
  - 反馈 6 你可以陈述为所有医生都具备药物知识，能够诊断医疗状况并开具适当的药物。
- - '###'
  - 活动 7 写一条关于医院经理如何与该医院雇佣的所有医生互动，无论他们是何种类型的医生。
