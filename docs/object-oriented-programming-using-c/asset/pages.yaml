    \ writing documentation. Some of documentation is intended for users and explain\
    \ what a program does and how to use it. Other documentation is intended for programmers\
    \ who need to adapt and modify the program and its functionality will change as\
    \ the needs of an organisation change. These programmers need to know what the\
    \ program does and how it is structured -\n\n+   * what packages it contains\n\
    * classes exist in each of these packages and what these classes do,\n* methods\
    \ exist in each class and for each of these methods\n  - what does the method\
    \ do\n  - what parameters does it require\n  - what, if any, value is returned.\n\
    \nTools can't produce a user guide but they can provide a technical description\
    \ of the program. Tools can analyse files for the programs we write and produce\
    \ documentation, either as a set of web pages (HTML files) or in some other format.\
    \ Technical documentation should contain similar information as you would find\
