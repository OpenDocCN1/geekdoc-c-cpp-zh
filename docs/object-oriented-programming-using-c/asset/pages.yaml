    The C# express edition is free and will be perfectly adequate but will not allow
    you to run the unit tests.

    - Download and unzip the file ''OOP Using C#''... available with this book.

    - Load the MessageManagerSystem.sln file into Visual Studio, view the code and
    run within Visual Studio.


