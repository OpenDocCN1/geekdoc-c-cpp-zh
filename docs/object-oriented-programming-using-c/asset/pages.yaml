  md: "# Object Oriented Programming C#\n\n# Generic Collections and how to Serialize\
    \ them\n\nThe code below shows an example of the creation of a list. In this case\
    \ list of names i.e. Strings.\n\n```\nusing System;\nusing System.Collections.Generic;\n\
    using System.Linq;\nusing System.Text;\n\nnamespace ListOfNames\n{\n    class\
    \ Program\n    {\n        // create names which will store a list of names\n \
    \       private static List<String> names;\n\n        static void Main(string[]\
    \ args)\n        {\n            names = new List<String>(); // Create empty list\n\
    \n            string name;\n            for (int i = 0; i < 3; i++) //Enter three\
    \ names\n            {\n                name = Console.ReadLine(); // Add each\
    \ name onto list\n                names.Add(name);\n            }\n\n        \
    \    foreach (String n in names) // Iterate through list\n            displaying\
    \ each element.\n            {\n                Console.WriteLine(n);\n      \
    \      }\n\n            Console.WriteLine(\"Please enter name to search for\"\
    );\n            String searchname = Console.ReadLine();\n            if (names.Contains(searchname))\
    \ // Demonstrate Contains\n                method works.\n            {\n    \
    \            Console.WriteLine(\"Name found\");\n            }\n            else\n\
    \            {\n                Console.WriteLine(\"Name not found\");\n     \
    \       }\n            Console.ReadLine();\n        }\n    }\n}\n```\n\nThe code\
    \ above is fairly self explanatory however perhaps a few parts are worthy of explanation\
