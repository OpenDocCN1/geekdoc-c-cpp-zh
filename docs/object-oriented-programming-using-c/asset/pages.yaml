    +   - List the nouns and verbs

    - Identify things outside the scope of the system

    - Identify the synonyms

    - Identify the potential c beenasses, attributes and methods

    - Identify any common characteristics


    From reading this description we can see that the first paragraph is purely contextual
    and does not describe anything specifically related to the software required.
