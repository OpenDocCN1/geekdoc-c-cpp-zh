- pgno: 43
  md: '# Object Oriented Programming using C#


    # The Unified Modelling Language (UML)


    An example of aggregation would be between a class Car and a class Tyre


    ![](img/e143b38d00f95425fa4f3efca0527189_43_0.png)


    We think of the tyres as belonging to the car they are, but at the garage they
    may be removed and placed on a rack to be repaired. Their existence isnt dependent
    on the existence of a car with which they are associated. Some designers believe
    that aggregation can be replaced as a simple association as when implementing
    this design in a program makes no difference to the programmer.


    # Composition


    ![](img/e143b38d00f95425fa4f3efca0527189_43_1.png)


    +   - Composition is similar to aggregation but implies a much stronger belonging
    relationship i.e. Object(s) of Class B are ‘part’ of Class A object

    - Again implies imply reference from A to B

    - Much ‘stronger’ than aggregation in this case Class B objects are an integral
    part of Class A and in general objects of Class B never exist other than part
    of Class A, i.e. they have the same ‘lifetime''


    An example of composition would be between Points, Lines and Shapes as elements
    of a Picture. These objects can only exist as part of a picture, and if the picture
    is deleted they are also deleted.


    As well as denoting associations, class diagrams can denote :-


    +   - Inheritance,

    - Interfaces,

    - Keywords and

    - Notes'
