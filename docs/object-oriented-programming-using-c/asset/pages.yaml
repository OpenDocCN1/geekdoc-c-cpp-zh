  md: "# Testing a client\n\nTo test a client can be added we need to\n\n+   1) Set\
    \ up the test by creating a new empty BookOfClients\n2) Create a client and add\
    \ this to the BookOfClients\n3) Check that the client has been added successfully\
    \ by trying to retrieve the client just added (this course should work) and finally\n\
    4) We need to test that the client has retrieved the same attributes as the client\
    \ we added – to ensure it was not corrupted in the process.\n\nFirstly we initialise\
    \ the test by creating a new empty BookOfClients object (BofC) and we clean the\
    \ test by setting this to null at the end. The code for this is below:\n\n```\n\
    [TestInitialize]\npublic void TestInitialize() {\n    BofC = new BankManager.BookOfClients();\n\
    }\n[Cleanup]\npublic void TestCleanup() {\n    BofC = null;\n}\n```\n\nNext we\
    \ create our first test method. This method will work by trying to add a client\
    \ to the empty object BofC. If the system generates an exception then this client\
    \ already exists then we know a fault in our code... under these circumstances\
    \ we are aware that the test has failed. See the test for this...\n\n```\n[TestMethod]\n\
    public void AddClient_TestNewClient_ExceptionShouldNotBeGenerated() {\n    BankManager.Client\
    \ c = new BankManager.Client(\"Simon\", \"Room 1234\", \"x200\", 10);\n    try\
    \ {\n        BofC.AddClient(c, 1);\n    } catch (BankManager.ClientAlreadyExistsException)\
    \ {\n        Assert.Fail(\"ClientAlreadyExists exception should not be thrown\
    \ for new clients\");\n    }\n}\n```\n\nIf the test above passes then we know\
    \ our code has not generated an exception however does not prove that the client\
    \ has been added successfully. We need to create other tests to show that we can\
    \ retrieve the client just added and need a test to show that in adding / retrieving\
    \ the client object the attributes have not been corrupted. Multiple tests are\
    \ required before we have confidence that the method we are testing will actually\
    \ work!"
