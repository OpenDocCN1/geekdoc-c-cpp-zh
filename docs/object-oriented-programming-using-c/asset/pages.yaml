  md: '# Object Oriented Programming C#


    # An Introduction to Object Orientated Programming


    > Feedback 7 You may have considered that a hospital manager could pay all doctors
    (presumably this will be done automatically at the end of month) and could discipline
    any doctor quality of misconduct – course this would be true for other staff as
    well. More specifically a manager could check that a doctor''s medical registration
    is current. This would be something management would need to do for all doctors
    irrespective of what their special is.


    Furthermore if the hospital employed a new specialist doctor (e.g. a Neurologist),
    without knowing anything specific about this specialist, hospital management would
    still know that (a) these staff need to be paid and b) their medical registration
    must be checked. i.e. they are still doctors and need to be treated as such.


    Using the same polymorphism allows computer systems to be extended, with new specialised
    objects being created, while allowing current parts of the system to interact
    with new object without concern for the specific properties of the new objects.


    # 1.5 What Exactly is Object Oriented Programming?


    +   Activity 8 Think of an object you possess. Describe its current state and
    list two three things you can do with object.


    > Feedback 8 You probably thought about an entirely physical object such as a
    watch, a pen, or a car.


    Objects have a status. A watch has a time (represented internally by wheels and
    cogs or in an electronic component). A pen has a certain amount of ink in it and
    has its lid on off. A car has a current speed and a certain amount of fuel inside
    it.


    Specific behaviour can be associated with each object (things that you can do
    with) :- a watch can be checked to find out its time, its time can also be set.
    A pen can be used to write with and a car can be started, driven and stopped.


    You can also think of other non physical things as objects such as a bank account.
    A bank account is not something that can be physically touched but intellectually
    we can consider a bank account to be an object. It also has a current status (the
    amount of money in it) and it has behaviour associated with it (most obviously
    deposit money and withdraw money).


    Object programming it a method of programming that involves the creation of objects
    that model a business problem we are trying to solve (e.g. a bank account, a bank
    customer and a bank manager – could all be objects in a computerised banking system).
    With each object we model the data associated with it (i.e. status at any particular
    point in time) and the behaviour associated with it (what our computer program
    should do that to).


    In creating a object oriented program we define the properties of a class of objects
    (e.g. all bank accounts) and then create individual objects from this class (e.g.
    your bank account).


