    # Dependency


    ![](img/e143b38d00f95425fa4f3efca0527189_40_1.png)


    +   - Dependency is the most unspecific relationship between classes (not strictly
    an ''association'')

    - Class A in some way uses facilities defined by Class B

    - Changes to Class B may affect Class A


    Typical of dependency lines would be where Class A has a method which is passed
    a parameter object of Class B, or uses a local variable of that class, or calls
    ''static'' methods in Class B.


    Example: A Print() may require a printer object as a parameter. Each time the
    Print() method is invoked a different printer object could be passed as a parameter
    and thus the printout will appear in a different place. Thus while the class containing
    the Print() method requires a printer object to work it does not need to be permanently
    associated with one specific printer.


