- pgno: 15
  md: '# Object Oriented Programming using C#


    # An Introduction to Object Orientated Programming


    # Feedback 2


    With an address book we could we want to be able to performing the following actions
    - find details of a friend i.e. their telephone number, add an address to the
    address book and, of course, delete an address.


    We can create a simple software component to store the data in the address book
    (i.e. list of names etc) and the operations, we can do with the address book (i
    add address, find telephone number etc).


    By creating a simple software component to store and manage addresses of friends
    we can reuse this in another software system i.e it could be used by a business
    manager to find and details of customers. It could also become part of a library
    system to be used by a librarian to store and retrieve details of the users of
    the library.


    In this object oriented programming we can create re-usable software components
    (in this case an address book).


    The Object Oriented paradigm builds upon and extends the ideas behind the structured
    programming of the 1970s.


    # 1.3 Why we use the Object Orientation Paradigm?


    While we can focus on our attention on the actual program code we are writing,
    whatever development methodology is adopted, it is not the code of that is generated
    the source of most problems. Problems arise from :-


    +   poor maintainability: the system is hard to understand and revise when, as
    is inevitable, requests for change arise.


    +   Statistics show 70% of the cost of software is not incurred during its initial
    development phase but is incurred during subsequent years as the software is amended
    to meet the ever changing needs of the organisation for which it was developed.
    For this reason it is essential that software engineers do everything to ensure
    that software is easy to maintain the years after its initial creation.


    The Object Oriented programming paradigm aims to solve these problems with the
    help of the analysis and design tasks during the initial development phase (as
    chapter 6 9 -11 for more details on this) and by ensuring software is robust and
    maintainable (which the support Object Orientation and C# provides for creating
    systems that are robust and maintainable).


    # 1.4 Object Oriented Principles


    Abstraction and encapsulation are fundamental principles that underlie the Object
    Oriented approach to software development. Abstraction allows us to consider complex
    ideas while ignoring irrelevant detail that would confuse us. Encapsulation allows
    us to focus on what something does without considering the complexities of how
    it works.'
