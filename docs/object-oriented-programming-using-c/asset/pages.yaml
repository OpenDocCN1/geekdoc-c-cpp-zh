  md: "# Object Oriented Programming C# Generic Collections and how to Serialize them\n\
    \nThe code for the Bank class is given below and this demonstrates how easy it\
    \ is to use the collection class 'List'.\n\n```\nclass Bank\n{\n    private List<Account>\
    \ accounts;\n    public List<Account> Accounts\n    {\n        get return accounts;\n\
    \    }\n\n    public Bank()\n    {\n        accounts = new List<Account>();\n\
    \    }\n\n    public void AddAccount(Account account)\n    {\n        accounts.Add(account);\n\
    \    }\n\n    public Account GetAccount(String name,String dob)\n    {\n     \
    \   Account FoundAccount = null;\n        foreach (Account a in accounts)\n  \
    \      {\n            if (a.Name == name && (a.DateBirth==dob))\n            {\n\
    \                FoundAccount = a;\n            }\n        }\n        return FoundAccount;\n\
    \    }\n}\n```\n\nFirstly the constructor creates a list of accounts. With any\
    \ list this automatically resizes itself, so unlike an array we do not need to\
    \ worry about running out of space.\n\nAlso when elements are removed the remaining\
    \ elements are moved so that the blank spaces are deleted. While this is not hard\
    \ to do with arrays it is a time consuming process that is handled automatically\
    \ for when we use Lists.\n\nAdding an account becomes a trivial task of invoking\
    \ the Add() method.\n\nFinally retrieving an individual account is fairly simple\
    \ to do by iterating through the list until the account we are looking for found.\n\
    \nNote this list manages a collection of complex objects and when any object is\
    \ retrieved from the list the methods associated with that object can be invoked\
    \ on that object.\n\nThis can be demonstrated via the following 'Main' method."
