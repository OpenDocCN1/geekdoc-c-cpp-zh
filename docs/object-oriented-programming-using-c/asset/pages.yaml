  md: "# Object Oriented Programming using C#\n\n# Case Study\n\n```\nnamespace MessageManagerSystem.Clients\n\
    {\n    [Serializable]\n    public class ClientBook\n    {\n        private SortedDictionary<int,\
    \ Client> clients;\n        public SortedDictionary<int, Client> Clients\n   \
    \     {\n            get return clients;\n        }\n\n        public ClientBook()\n\
    \        {\n            clients = new SortedDictionary<int, Client>();\n     \
    \   }\n\n        public ClientBook(SortedDictionary<int, Client> clients)\n  \
    \      {\n            this.clients = clients;\n        }\n\n        public void\
    \ AddClient(int clientID, Client newClient)\n        {\n            try\n    \
    \        {\n                clients.Add(clientID, newClient);\n            }\n\
    \            catch (ArgumentException)\n            {\n                throw new\
    \ ClientAlreadyExistsException(\"ClientBook.AddClient(clientID): a client with\
    \ this ID already exists in system ID:\" + clientID);\n            }\n       \
    \ }\n\n        public Client GetClient(int clientID)\n        {\n            try\n\
    \            {\n                return clients[clientID];\n            }\n   \
    \         catch (KeyNotFoundException)\n            {\n                throw new\
    \ UnknownClientException(\"ClientBook.GetClient(): unknown client ID:\" + clientID);\n\
    \            }\n        }\n    }\n}\n```\n\nThe code above shows the constructors\
    \ to create a ClientBook object which is a sorted dictionary of ClientID, Client\
    \ objects and the other methods required by the ClientBook class. Further discussion\
    \ of this is provided below."
