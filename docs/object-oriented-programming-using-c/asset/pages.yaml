    # 4.8 Summary


    Polymorphism allows us to refer to according to a superclass rather than their
    actual class.


    Polymorphism makes it easy to extend our programs by adding additional classes
    without needing to change other classes.


    We can manipulate objects by invoking operations defined for the superclass without
    worrying about which subclass is involved in any specific case.


    C# ensures that the appropriate method for the actual class of the object is invoked
    at run-time.


    Sometimes we want to employ polymorphism without all the classes concerned having
    to be in an inheritance hierarchy. An interface allows us to provide shared collections
