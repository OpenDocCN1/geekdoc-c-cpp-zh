  md: '# 11.12 Using Test Driven Development and Extending the System


    We now have a working system – though important methods have yet to be created.
    We need a method to increase a client''s credit – this should be placed within
    the Class. We also need a method to delete a client, as this means removing them
    from the client book. This should be placed in the ClientBook class.


    It has been decided to use Test Driven Development to extend the system by providing
    this functionality (as discussed in Chapter 10 Agile Programming).


    In TDD we must :-


    +   1) Write tests

    2) Set up automated unit testing, which fails because the classes haven''t been
    written!

    3) Write the classes so the tests pass


    After creating these methods we must then adapt the interface so that this will
    invoke the methods.


    To do this we will create two fixtures… one to test the ClientBook class and one
    to test the Client class.


    In the Client test fixture we will initialise a test by setting up a specified
    client. We will then create a test to test credit can be added and finally we
    will set the Cleanup() method to remove the client specified.


    ![](img/e143b38d00f95425fa4f3efca0527189_240_0.png)'
