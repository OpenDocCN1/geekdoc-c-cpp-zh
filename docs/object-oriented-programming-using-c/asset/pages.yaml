  md: "# Object Oriented Programming using C#\n\nWhen we call the RecNewIssue() method\
    \ on a DiscMag object the CLR engine automatically selects the overriding version\
    \ - the caller doesn't need to know this, or that it is an overridden method at\
    \ all. When we call the RecNewIssue() method on a Magazine it is the method in\
    \ the superclass that is invoked.\n\n# Implementing DiscMag\n\nTo implement DiscMag\
    \ we must create a subclass of Magazine. No additional instance variables or methods\
    \ are required although it is possible to create some if we have a constructor.\
    \ For DiscMag simply passes ALL parameters directly onto the superclass and a\
    \ version of RecNewIssue() is defined in DiscMag to override the one inherited\
    \ from Magazine (see below).\n\n```\npublic class DiscMag : Magazine {\n    public\
    \ DiscMag(String title, double price, int copies, int orderQty, String curr)\\\
    \        : base(title, price, copies, orderQty, curr);\n\n    public override\
    \ void RecNewIssue(String newIssue) {\n      base.RecNewIssue(newIssue);\n   \
    \   Console.WriteLine(\"Check discs are attached\");\n    }\n}\n```\n\nNote the\
    \ use of base.RecNewIssue() to call a method of the superclass, then re-using\
    \ the existing functionality as part of the replacement, just as we do with constructors.\
    \ It then displays the required message for the user.\n\nOne final change is required.\
    \ Before a method can be overridden permission for this must be granted by the\
    \ author of the superclass. Using the keyword virtual when defining methods basically\
    \ grants permission for them to be overridden.\n\nThus for the code above to work\
    \ the RecNewIssue() method in the magazine must be made virtual. See below...\n\
    \n```\n// in Magazine\npublic virtual void RecNewIssue(String newIssue) {\n  \
    \  Copies = orderQty;\n    currIssue = newIssue;\n}\n```"
