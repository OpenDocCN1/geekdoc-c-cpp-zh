    # 5.3 Summary


    Method overloading is the name given to the concept that several methods may exist
    that essentially perform the same operation and thus have the same name.


    The CLR engine distinguishes these by looking at the parameter list. If two or
    more methods have the same name then their parameter list must be different.


    At run time each method call, which may be ambiguous, is resolved by the CLR engine
    by looking at the parameters passed and matching the data types with the method
    signatures defined in the class.


    By overloading constructors and ordinary methods we are providing extra flexibility
    to the programmers who may use our classes in the future. Even if these are not
    all used initially, providing these can help make the program more flexible to
    meeting changing user requirements.'
