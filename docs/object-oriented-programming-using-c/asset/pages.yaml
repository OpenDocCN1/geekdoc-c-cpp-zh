    - Drive to the car

    - Park the car


    Do your job :-


    +   - Find out what your boss wants you to do

    - Do what the boss wants you to

    - Feedback to the boss on today''s results.


    By structuring our list of instructions and considering the overall structure
    of the day (Get up, go to work, do your job) we can change and improve one of
    the sections without changing the other parts. For example we could improve the
    instructions for your work...


    +   - Listen to the local traffic and weather report

    - Decide whether to go by bus or by car

    - If going by car, get the car and drive to work.

    - Else walk to the bus station and catch the bus


    without worrying about any potential impact this may have on ''getting up'' or
    ''doing your job''. In the same structuring computer programs can make each part
    more understandable and make large programs easier to maintain.


    The Object Oriented paradigms suggest we should model instructions in a computer
    program with the data they manipulate and store these as components. One advantage
    of this is we get reusable components.


