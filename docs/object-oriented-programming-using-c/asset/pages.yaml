- pgno: 147
  md: "# Object Oriented Programming using C#\n\n# Generic Collections and how to\
    \ Serialize them\n\nThis overrides Object.Equals() for the Account class\n\nEven\
    \ though it will always be an Account object passed as a parameter, we have to\
    \ make the parameter an Object type (and then cast it to Account) in order to\
    \ override the Equals() method inherited from Object which has the signature\n\
    \n```\npublic bool Equals(Object obj)\n```\n\n(You can check this in the looking\
    \ for the 'Object' class in the 'System' namespace of the .NET API\n\nIf we give\
    \ this method with an Account type parameter it would not override Object.Equals(Object\
    \ obj). It would in fact overload the method by providing an alternative method.\
    \ As the system is expecting to use a method with a signature of public bool Equals(Object\
    \ obj) it would not use a method with a signature of public bool Equals(Account\
    \ account).\n\nTherefore we need to override public bool Equals(Object obj) and\
    \ cast the parameter to an Account before extracting the name and DOB of account\
    \ holder to compare them with those of the current object.\n\nOne additional complication\
    \ concerns how objects are stored. In this C uses a hash code. Two accounts with\
    \ the same name and DOB should generate the same hash code however currently this\
    \ will not be as the hash code is generated using the object name (e.g. Account1).\
    \ Thus two accounts, Account 1 and Account 2 could still be stored in the set\
    \ even if the name and DOB is the same.\n\nTo overcome this problem we need to\
    \ override the GetHashCode() method so that a hash code is generated using the\
    \ Name and DOB rather than the hash code (just as we needed to override the Equals()\
    \ method).\n\nWe can ensure that the hash code is generated on the name and DOB\
    \ by overriding the GetHashCode() method as shown below...\n\n```\npublic override\
    \ int GetHashCode()\n{\n    return (name + dateOfBirth).GetHashCode();\n}\n```\n\
    \nThe simplest way to redefine GetHashCode() for an object is to join the instance\
    \ values which are to define equality as a single string and then the hashcode\
    \ of that. In this case equality is defined by the name of the account holder\
    \ and DOB which together we assume is unique.\n\nIt looks a little strange, but\
    \ we can use the GetHashCode() method on this String even though we are overriding\
    \ the GetHashCode() method for objects of type Account.\n\nGetHashCode() is guaranteed\
    \ to produce the same hash code for two Strings that are the same. Occasionally\
    \ the same hash code may be produced for different key values, but that is not\
    \ a problem."
