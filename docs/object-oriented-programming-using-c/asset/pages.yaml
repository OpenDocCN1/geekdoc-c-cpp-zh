- pgno: 235
  md: "# Object Oriented Programming using C#\n\nWe tell next the GetClient() method\
    \ to generate an UnknownException if it catches a KeyNotFoundException (as shown\
    \ below) :\n\n```\npublic Client GetClient(int clientID)\n{\n    try\n    {\n\
    \        return clients[clientID];\n    }\n    catch (KeyNotFoundException)\n\
    \    {\n        throw new UnknownClientException(\"ClientBook.GetClient(): unknown\
    \ client ID:\" + clientID);\n    }\n}\n```\n\nUnder the appropriate condition,\
    \ we invoke the constructor of the exception using the keyword 'new' and pass\
    \ a string message required by the constructor. The object returned by the constructor\
    \ is then 'thrown'.\n\nTo be helpful the string specifies the method by which\
    \ this exception was generated from the clientID for which a client was not found.\
    \ The DailyPurge() method should catch this exception and hopefully deal with\
    \ it to prevent a crash situation.\n\nThe final step is to catch and deal with\
    \ UnknownClientException within the DailyPurge() method – as shown in section\
    \ 11.8 (Programming the Message Classes).\n\nIf a client does not exist we could\
    \ remove the message. However in this case we have chosen to be more cautious\
    \ we simply don't know how we have come to have an 'unowned' message.\n\nWe have\
    \ therefore decided that if the message has no recognized client we will not to\
    \ take any action than to report the error. The message will continue to be displayed\
    \ (even without having a client to charge!).\n\nIf an unowned message has expired\
    \ of course still need to remove it from the display set."
