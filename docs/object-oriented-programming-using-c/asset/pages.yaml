- pgno: 25
  md: '# Object Oriented Programming using C#


    # An Introduction to Object Orientated Programming


    # Intermediate Code


    This model is a hybrid between the previous two.


    Compilation takes place to convert the source code into a more efficient intermediate
    representation which can be executed by a ''run-time system'' (again a sort of
    ''virtual machine'') more quickly than direct interpretation of the source code.
    Use of an intermediate code which is executed by run-time software allows the
    compilation process to be independent of the operating system / hardware platform,
    i.e. the same intermediate code should run on different platforms so long as an
    appropriate run-time system is available for each platform.


    This approach is long-established (e.g. in Pascal in the early 1970s) and is how
    Java works. Java is a modern Oriented Language which is an alternative to C# and
    yet shares many similar features from the programmers point of view.


    ![](img/e143b38d00f95425fa4f3efca0527189_25_0.png)


    # Running Java Programs


    To run Java programs we must first generate intermediate code (called bytecode)
    using a compiler available as part of the Java Development Kit (JDK). Thus a Java
    compiler does not create .exe files i.e. code that could run directly on a specific
    machine but instead generates .class files.


    ![](img/e143b38d00f95425fa4f3efca0527189_25_1.png)'
