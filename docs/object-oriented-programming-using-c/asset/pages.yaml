- pgno: 183
  md: "# 9.5 Catching Exceptions\n\nHaving specified to the compiler that method may\
    \ generate an exception we are enabling other programmers to protect against potentially\
    \ critical errors by placing calls to this method in a try / catch block. The\
    \ code in the try block will be terminated if an exception is generated and the\
    \ code in the catch block will be initiated.\n\nThus in the example above the\
    \ AwardLoan() method can decide what to do if no client with the specified ID\
    \ is found......\n\n```\ntry\n{\n    Client c = listOfClients.GetClient(clientID);\n\
    \    c.determineCreditRating();\n\n    // add to award or reject a loan application\
    \ based on this\n    credit rating\n}\ncatch (UnknownClientException uce)\n{\n\
    \    Console.WriteLine(\"INTERNAL ERROR IN BankManager.AwardLoan()\\n\" + \"Exception\
    \ details: \" + uce.Message);\n}\n```\n\nNow, instead of crashing when a client\
    \ with a specified ID is not found, the UnknownClient we deliberately thrown will\
    \ be handled by the CLR engine which will terminate the code in the try block\
    \ and invoke the code in the catch block, which in this case will display a message\
    \ warning the user about the problem.\n\n# 9.6 Summary\n\nExceptions provide a\
    \ mechanism to deal with abnormal situations which occur during program execution.\n\
    \nWhen writing classes and methods, which may become part of a large application,\
    \ we should create sub classes of the class ApplicationException and throw exception\
    \ objects when appropriate.\n\nBy making use of the exception mechanism we are\
    \ protecting against potentially life threatening program failure.\n\nThe exception\
    \ mechanism will allow other programmers who use our methods recognise and deal\
    \ with error situations.\n\nWhen exceptions are generated the code in a catch\
    \ block will be initiated – this could take radical action or terminate the program\
    \ generating an appropriate error message. In either case least the program doesn't\
    \ 'stop'.\n\nAn example of use of exceptions in a fully working system can be\
    \ found in the case study Chapter 11."
