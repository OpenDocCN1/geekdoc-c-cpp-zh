- pgno: 160
  md: '# Object Oriented Programming using C#


    # Generic Collections and how to Serialize them


    An object is shown below :-


    ![](img/e143b38d00f95425fa4f3efca0527189_160_0.png)


    In this graph we can see that a1 refers to objects a2 and object b1. In turn refer
    to other objects. Thus if we were to fully save (or serialise) a1 we would need
    to show the details of this object including details of all the other objects
    this refer to... and all the objects refer to and so on.


    Serialisation will follow these links automatically.


    Notice that c3 and c6 are referred to by two objects. However, the serialization
    mechanism is smart enough to realise the same object is occurring when it encounters
    it the second time and instead of writing out a duplicate it simply writes out
    a reference to the original object. By the same means a \''cycle\'' in the graph
    - i.e. a circle or references returning to the same place, will not cause the
    serialization mechanism to go into an infinite loop!


    This mechanism assumes that classes A, B and C are all serializable. Some classes
    are not. For instance those that rely on reading from a file cannot be serialised
    as the file may not exist when we attempt to deserialize an object of that class.
    In practice most of the classes we create will be serializable.


    To demonstrate the power of the serialization mechanism we will amend the bank
    account system developed in section 7.10 where a dictionary was used to store
    a collection of accounts.


    With one instruction we will store an object of type Bank. In doing so the system
    will also store the collection Accounts and in doing so it will store ALL Account
    objects.


    When we retrieve the Bank object all Account objects will also be retrieved and
    the collection reconstructed.'
