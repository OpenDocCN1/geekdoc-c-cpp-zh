    # Inheritance


    ![](img/e143b38d00f95425fa4f3efca0527189_44_0.png)


    +   - Aside from associations, the other main modelling relationship is inheritance:

    - Class A ‘inherits’ both the interface and implementation of Class B, though
    it may override implementation details and supplement both.


    We will look at inheritance in detail in Chapter 3.


    # Interfaces


    +   - Interfaces are similar to inheritance however with interfaces only the interface
    is inherited. The methods defined by the interface must be implemented in every
    class that implements the interface.

    - Interfaces can be represented using the <<interface>> keyword:


    ![](img/e143b38d00f95425fa4f3efca0527189_44_1.png)


    There is also a shorthand for this


