    # 4.2 Substitutability


    When designing class/type hierarchies, the type mechanism allows us to place a
    subclass object where a superclass is specified. However this has implications
    for the design of subclasses – we need to make sure they are genuinely substitutable
    for the superclass. If a subclass is substitutable then clearly it must implement
    all the methods of the superclass – this is to guarantee as all of the methods
    defined in the superclass are inherited by the subclass. Thus while a subclass
    may have additional methods it must least have all of the methods defined in theclass
    and should therefore be substitutable. What happens if a method is overridden
    in the subclass?


    When overriding methods we must ensure they are still substitutable for the method
    being replaced. Therefore when overriding methods, while it is perfectly acceptable
    to tailor the method to the needs of a subclass she should not be overridden with
    functionality which performs an inherently different operation.


    For example, RecNewIssue() in DiscMag overrides RecNewIssue() from Magazine but
    does the same basic job (“fulfills the contract”) as the inherited version respect
    to updating the number of copies and the current issue. It extends that functionality
    in a way specifically relevant to DiscMags by displaying a reminder to check the
    cover discs, essentially these two methods perform the same operation.


