- pgno: 131
  md: "# Object Oriented Programming C# Generic Collections and how to Serialize them\n\
    \nAssume that we want to invoke an 'AwardMerit()' method on the 'Student' returned\
    \ via the Highest() method. We can do this if we first cast the 'Object' onto\
    \ a 'Student' object. E.g.\n\n```\n(Student)Highest(studentA, studentB).AwardMerit();\n\
    ```\n\nHowever the compiler cannot be certain that the returned object is a 'Student'\
    \ and the compiler cannot detect the potentially critical error that would occur\
    \ if we invoked Highest() on two integers and then tried to cast the returning\
    \ integer onto an object of 'Student'.\n\nThis leads to the idea that we would\
    \ like to be create a method that will take parameters of ANY type and return\
    \ values that are again of ANY type but where we define these types when we invoke\
    \ these methods. Such methods exist and they are called Generic Methods.\n\nGeneric\
    \ methods are methods where the parameter types are not defined until the method\
    \ is invoked. Parameter types are specified each time the method is invoked and\
    \ the compiler can still check the code is valid.\n\nIn other ways a generic method\
    \ uses a – data type that is determined by a parameter.\n\nIn the code below a\
    \ generic method Highest() has been defined as a method that takes two objects\
    \ as parameters of unspecified type -\n\n```\npublic T Highest<T>(T o1, T o2)\n\
    {\n    if (o1.ToString().compareTo(o2.ToString()) > 0)\n        return o1;\n \
    \   else\n        return o2;\n}\n```\n\nWe can use this method and each time we\
    \ invoke it we define the type of object being compared. If two students compared\
    \ the compiler will know that the object returned is also type student and will\
    \ therefore know it is legal to invoke specific methods on this object.\n\nA list\
    \ of generic data types contained between angle brackets that follow the method's\
    \ name is provided. If multiple generic types are used by a method, their names\
    \ are separated by commas.\n\nIn the example above, the identifier T can stand\
    \ for any data type. So, when T is used within the brackets in the method's parameter\
    \ list to describe data, it might be an int, 'Student' or any other data type.\
    \ The only requirement is that the method must work no matter what type of object\
    \ is passed to it. All objects have a ToString() method because every data type\
    \ inherits the ToString() method from the 'Object' class, or contains its overriding\
    \ version."
