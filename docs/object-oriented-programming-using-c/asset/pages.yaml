    # Relationships Between Classes


    We can now start to work out how these classes are related.


    Starting with ClientBook and Client - a : ClientBook will record details of zero
    or more clients.


    The navigability will be from ClientBook to client because the book “knows about”
    its Clients (in implementation terms it will have references to them) but the
    individual clients will have references back to the book.


    The one-to-many relationship suggests that ClientBook will have a Collection (of
    some kind) of Clients. The specification states that each Client will have a unique
    ID thus the collection in fact be a dictionary where each entry is made up of
    a pair of values – in case a clientID (int) and a Client object. As we are likely
    to be retrieving clients by their ID more often than we will be adding and deleting
    the system will be more efficient if we use this sorted dictionary, where clients
    will be stored in order of their ID. With a sorted dictionary adding and deleting
    elements will be slower as the process is more complex but retrieving elements
    will be quicker.


