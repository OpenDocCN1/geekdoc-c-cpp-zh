  md: "# Object Oriented Programming using C#\n\n# Object Roles and the Importance\
    \ of Polymorphism\n\nWe now need to state that both Publication (and all its subclasses)\
    \ and Ticket offer the operations defined by the interface:\n\n```\npublic abstract\
    \ class Publication : ISaleableItem\n{\n    ...class details...\n}\n```\n\n```\n\
    public class Ticket : ISaleableItem\n{\n    ...class details...\n}\n```\n\nIn\
    \ C# the same symbol ' :' is used when we define a subclass that extends a super\
    \ class or when we create a class that implements an interface.\n\nContrast implementing\
    \ an interface with extending a superclass.\n\n+   - When we extend a superclass\
    \ the subclass inherits of both interface and implementation from the superclass.\n\
    \n+   - When we implement an interface we give a guarantee that the operations\
    \ specified by an interface will be provided – this is to allow polymorphic handling\
    \ of all classes which implement a given interface\n\n# The Polymorphic CashTill\n\
    \nThe CashTill already employs polymorphism: the SellItem() method accepts a parameter\
    \ of type Publication which allows any of its subclasses to be passed:\n\n```\n\
    public void SellItem(Publication pPub)\n```\n\nWe now want to broaden this by\
    \ accepting anything which implements the SaleableItem interface:\n\n```\npublic\
    \ void SellItem(ISaleableItem pSI)\n```\n\nWhen the type of a variable or parameter\
    \ is defined as an interface, this works just like a superclass type. Any class\
    \ which implements the interface is acceptable for assignment to the variable/parameter\
    \ because the interface is a **type** and all classes implementing it are subtypes\
    \ of that type."
