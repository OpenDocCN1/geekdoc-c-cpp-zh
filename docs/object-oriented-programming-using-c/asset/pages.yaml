  md: 'On the left above-: it is legal, though bad practice, to have a subclass with
    no constructor because superclass has a parameterless constructor.


    In the centre-: subclass constructor doesn''t call the base constructor then the
    parameterless superclass constructor will be called.


    On the right-: superclass has no parameterless constructor, subclass must have
    a constructor, it must call the super constructor using the keyword base and it
    pass on the required paramter. This is simply because a (super) class with only
    a parameterized constructor can only be initialized by providing the required
    parameter(s).


    # 3.7 Access Control


    To enforce encapsulation we normally make instance variables private and provide
    accessor/mutator methods as necessary (or in C# we use properties).


    The SelfCopy() method of Publication needs to alter the value of the variable
    ''copies'' it can do even if ''copies'' is a private variable. However Book and
    Magazine both need to alter ''copies''.


    There are three ways we can do this in C# ...


    +   1) make ''copies'' protected rather than ''private'' – this makes it visible
    to subclasses, or

    2) create accessor and mutator methods.

    3) create ''properties'' in C#. These are effectively accessor methods but make
    the coding simpler.


    Generally we should keep variables private and create accessors/mutators rather
    than compromise encapsulation, though protected may be useful to allow subclasses
    to use methods (e.g. accessors and mutators) which we would not want generally
    available to other classes. In C# it is simpler and hence normal practise to create
    properties which effectively do the job as accessor methods.


    We will demonstrate the use of accessor methods and properties here.


    Firstly using accessor methods: In the superclass Publication we define ''copies''
    as a variable private but create two methods that can set and access the value
    ''copies''. As these accessor methods are public or protected they can be used
    within a subclass when access to ''copies'' is required.'
