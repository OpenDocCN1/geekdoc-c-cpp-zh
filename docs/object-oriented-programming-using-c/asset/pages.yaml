  md: "Object Oriented Programming using C#\n\nCase Study\n\n# For each message\n\n\
    If the message has expired or if the client has run out of credit then\nSet the\
    \ DaysReaming for that message to zero.\n\nRemove all expired messages.\n\nSee\
    \ code below for this...\n\n```\npublic void DailyPurge(ClientBook clients)\n\
    {\n    Client client;\n\n    // loop through all current messages and decrement\
    \ credit and days\n    foreach (Message m in messages)\n    {\n        m.DecrementDays();\
    \ // deduct 1 from days remaining for message\n        try {\n            // decrease\
    \ client credit for this message\n            client = clients.GetClient(m.ClientID);\n\
    \            client.DecreaseCredit(m.Cost);\n        }\n        catch (UnknownClientException\
    \ uce) {\n            MessageBox.Show(\"INTERNAL ERROR IN MessageSet.\\r\\nDetails:\
    \ \" + uce.Source + \" \" + \\r\\nMessage details \" + uce.Message + \": \\r\\\
    n\");\n        }\n        // loop through all current messages\n        and expire\
    \ those whose client credit <=0\n    foreach (Message m in messages)\n    {\n\
    \        try {\n            client = clients.GetClient(m.ClientID);\n        \
    \    if (client.Credit < 0) {\n                m.DaysRemaining = 0;\n        \
    \    }\n        }\n        catch (UnknownClientException) {\n            // Do\
    \ nothing as unknown clients have been reported to\n            error log already\n\
    \        }\n    }\n    // Remove all expired messages\n    messages.RemoveWhere(ToBeDeleted);\n\
    }\n```\n\n232\n\nDownload free ebooks at bookboom.com"
