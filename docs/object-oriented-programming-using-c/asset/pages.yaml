- pgno: 179
  md: '# Object Oriented Programming using C#


    # Creating And Using Exceptions


    In the situation above we could write code that would catch NullReferenceExceptions
    and decide how our program should respond to. Of course we may not know specifically
    what generated the NullReferenceException so we may know how our program should
    respond but could at least shut down our program in a neat tidy way, explaining
    to the user are we do this because of the error generated. This would be far better
    than allowing our program to crash without explanation.


    In the example above we could be much cleverer still. The GetClient() method could
    be written in such a way that it generates new type of exception ''UnknownClient''
    exception. We could catch this specific exception and knowing exactly what the
    problem we could define a much better response.... In this case we could explain
    that no client exists for the specific ID, we could then ask the user to re-enter
    their client ID and the program could continue.


    # 9.2 Kinds of Exception


    In order to generate meaningful exceptions we need to extend the Exception base
    class built into the .NET framework.


    The Exception class has already been extended to create a SystemException class
    and an ApplicationException class.


    The SystemException class is used to generate exceptions within the .NET framework
    such as NullReferenceException.


    We should use the ApplicationException class when generating exceptions within
    our application such as UnknownClientException.


    Subclasses ofApplicationException are used to catch and deal with potential problems
    when running our applications. To do this we must 1) create appropriate sub classes
    of ApplicationException 2) generate exception objects using a `throw` clause when
    appropriate and 3) deal with these exceptions using a `try/catch` block.


    # 9.3 Extending the ApplicationException Class


    When using our methods we should look for potential failure situations (e.g. value
    that cannot be returned, errors that may occur in calculation etc). When a potential
    error occurs we should generate an ''ApplicationException'' object i.e. of an
    ObjectException class. However it is important to first define a subclass of the
    ApplicationException class i.e. to create a specialised class and throw an of
    this subtype.


    A new exception is just like any new class in this it is a subclass of ApplicationException.


    In the case above an error could occur if no client is found with a specific ID.
    Therefore we could create a new exception called ''UnknownClientException''.


    There are several overloaded constructors for the ApplicationException class.
    One of these requires a String and it uses this to initialize a new instance of
    the ApplicationException class with a specified error message.


    Exception classes have a ''Message'' property we can make use of.'
