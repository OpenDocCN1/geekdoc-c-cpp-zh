    # 6.4 Identifying Things Outside The Scope of The System


    An important part in designing a system is to identify aspects of the problem
    that are not relevant or outside the scope of the system. Parts of the description
    may be purely contextual i.e. for general information purposes and thus not something
    that will directly describe the aspects of the system we are designing. Furthermore
    parts of the description may refer to tasks that are performed by users of the
    system as they are using the system, and thus describe functions that need to
    be implemented within the system, other parts may describe tasks performed by
    users while not using the system and thus not describe functions within the system.


    By identifying things in the description that are not relevant to the system we
    are developing keep the problem as simple as possible.


