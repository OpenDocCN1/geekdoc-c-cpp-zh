    Feedback 11 Defining the most general category of object (we call this a class)
    – something that can be borrowed – we may want to define more specialised sub-classes
    (e.g. books, magazines, audio/visual material). These will share the attributes
    defined the general class but will have specific differences (for example there
    could be a charge for borrowing audio/visual items).


    # 1.6 The Benefits of the Object Oriented Programming Approach


    Whether or not you develop programs in an oriented way, before you write the software
    you must first develop a model of what software must be done and how it should
    work. Object oriented modelling is based on the ideas of abstraction, encapsulation,
    inheritance and polymorphism.


    The general proponents of the object oriented approach claims that this model
    provides:


    +   - better abstractions (modelling information and behaviour together)

    - better maintainability (more comprehensible, less fragile software)

    - better reusability (classes as encapsulated components that can be used in other
    systems)


    We will look at these claims throughout this book and in Chapter 11 we will see
    a case study in detail how object oriented analysis works and how the resultant
    models can be implemented in an object oriented programming language (i.e. C#).


    # 1.7 Software Implementation


    Before a computer can execute useful tasks for us (i.g. check the spelling in
    our documents) software needs to be written and implemented on the machine it
    will run. Software implementation involves the writing of source code and preparation
    for execution of this on a particular machine. Of course the software needs to
    be defined and at some point it needs to be tested. There are many iterative lifecycles
    to support the process of design, implementation and testing involving multiple
    implementation phases. Of particular concern are the long established approaches
    to getting source code to execute on a particular machine...


    +   - compilation into machine-language object code

    - direct execution of source code by ''interpreter'' program

    - compilation into intermediate object code which is interpreted by runtime-system


    Implementing C# programs involves compiling the source code (C#) into machine-language
    object code. This approach has some advantages and disadvantages and it is worth
    comparing these three options in order to appreciate the implications for the
    C# developer.


