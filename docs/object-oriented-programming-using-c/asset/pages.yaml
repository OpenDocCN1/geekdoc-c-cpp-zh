- pgno: 84
  md: '# Object Oriented Programming using C#


    # Object Roles and the Importance of Polymorphism


    If you were asked to give someone a pig you could give them Pinky or any other
    pig.


    If you were asked to give someone a mammal you could give them Pinky, any other
    pig or any other mammal (e.g. any lion, or any mouse, or any cat).


    If you were asked to give an animal you could give them Pinky, any other pig,
    any other mammal, or any other animal (bird, fish, insect etc).


    The idea here is that an object in a classification hierarchy has an ''is '' relationship
    with every class from which it is descended and each classification represents
    a type of animal.


    This is true in object oriented programs as well. Every time we define a class
    we create a new ''type''. Types determine compatibility between variables, parameters
    etc.


    A subclass is a subtype of the superclass type and we can substitute a subtype
    wherever a ''supertype'' is expected. Following this we can substitute objects
    of a subtype wherever objects of a supertype are required (in the example above).


    The class diagram below shows a hierarchical relationship of types of object –
    or classes.


    ![](img/e143b38d00f95425fa4f3efca0527189_84_0.png)


    +   * If we want a ''DiscMag'', it must be an object of class DiscMag.

    * If we want ''Magazine'', it could be an object of class Magazine or an object
    of class DiscMag (as this is a type of magazine).

    * If we want a ''Publication'' it could be a Book, Magazine or DiscMag.


    In other words we can ''substitute'' an object of any subclass where an object
    of a superclass is required. This is NOT true in reverse!'
