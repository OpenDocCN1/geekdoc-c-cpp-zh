  md: '# Object Oriented Programming C#


    # Case Study


    Rory''s Readables is a small shop on the seafront selling a range of convenience
    goods, especially books and magazines aimed at both local and tourist一遍. It has
    recently become a ticket agency for various local entertainment and transport
    providers.


    Rory plans to acquire an LCD message board mounted above the shopfront which can
    showing text messages. Rory intends to use this to advertise his own products
    and offers and also to provide a message display service for fee-paying clients
    (e.g. private sales, lost and found, staff required etc.)


    Each client has a unique ID number and a name, an address, a phone number and
    an amount of credit in ''credit units''. A book of clients is maintained to which
    clients are added and in which we can look up a client by their ID.


    Each message is for a specific client and comprises the text to be displayed and
    the number of days for which it should be displayed. The cost of each message
    is 1 unit per day. No duplicate messages (i.e. the same text for the client) are
    permitted.


    A set of current messages is to be maintained: new messages can be added, the
    message set can be displayed on the board, and at the end of each day a purge
    is performed — each message has its days remaining decremented and its client''s
    credit reduced by the cost of the message, and any messages which have expired
    or whose client are deleted from the message set.


    The software is to be written before the display board is installed - therefore
    the connection to the board should be via a well-defined interface and a dummy
    display board implemented in software for testing purposes.


    Given the description above this chapter describes how this problem may be analysed,
    modelled and a solution programmed — thus demonstrating the techniques discussed
    throughout this book.


