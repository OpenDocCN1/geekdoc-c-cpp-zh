    # Aggregation


    ![](img/e143b38d00f95425fa4f3efca0527189_42_1.png)


    +   - Aggregation denotes a situation where Object(s) of Class B ''belong to''
    Class A

    - Implies reference from A to B

    - While aggregation implies that objects of Class B belong to objects of Class
    A it also implies object of Class B retain an existence independent of Class A.
    Some designers believe there is no real distinction between aggregation and simple
    association


