- pgno: 79
  md: '# Object Oriented Programming using C#


    # Inheritance and Method Overriding


    This mechanism gives us the ability to allow, prevent, the methods we create from
    being overridden in subclasses.


    # Operations


    Formally, ''RecNewIssue()'' is an operation. This operation is implemented by
    two different methods, one in Magazine and the overriding one in DiscMag. This
    distinction is an important part of ''polymorphism'' which we will meet in Chapter
    4.


    # 3.10 The ''Object'' Class


    In C all classes are (direct or indirect) subclasses of a class called ''Object''.
    Object is the ''root'' of the inheritance hierarchy in C#. Thus class exists in
    every C# program ever created.


    If a class is not declared to inherit from another then it implicitly inherits
    from Object.


    ''Object'' defines no instance variables but several methods. Generally these
    methods will be overridden by new classes to make them useful. An example is the
    ToString() method.


    Thus when we define our own classes, by default they are direct subclasses of
    Object.


    If our classes are organised into a hierarchy then the topmost superclass in the
