- pgno: 95
  md: '# 4.5 Interfaces


    There are two aspects to inheritance:


    +   - the subclass inherits the interface (i.e. access to public members) of its
    supersclass – this makes polymorphism possible

    - the subclass inherits the implementation of its superclass (i.e. instance variables
    and method implementations) – this saves us copying the subclass details in the
    subclass definition

    - In C#, use of inheritance, via the ''symbol'', automatically applies both aspects.


    A subclass is a subtype. It''s interface must include all of the interface of
    its superclass, though the implementation of this can be different (though overriding)
    and the interface of the subclass may be more extensive with additional features
    being added.


    However, sometimes we want two classes to share a common interface without putting
    them in an inheritance hierarchy. This might be :-


    +   - they aren''t really related to a true ''is a'' relationship

    - we want a class to have interfaces shared with more than one would-be subclass,
    C# does not allow such ''multiple inheritance''

    - we want to create a ''plug and socket'' arrangement between software components,
    some of which might not even be created at the current time.


    This is like making sure that two cars have controls that work in exactly the
    same way, but leaving it to different engineers to design engines which ''implement''
    the functionality of the car, possibly in quite different ways.


    Be careful of the term ''interface'' – in C programming it has at least three
    meanings:


    +   1) the public members of a class – the meaning used above

    2) the "user interface" of a program, often a "Graphical User Interface" – an
    essentially unrelated meaning

    3) a specific C# construct which we are about to meet


    Recall how the subclasses of Publication provide additional and revised behaviour
    while retaining the set of operations – i.e. the interface – which it defined.'
