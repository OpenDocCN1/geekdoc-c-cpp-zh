- pgno: 26
  md: '# Object Oriented Programming using C#


    A version of the Java Runtime Environment (JRE), which incorporates a Java Virtual
    machine (VM), is required to execute the bytecode and the Java library packages.
    Thus a JRE must be present on any machine which is to run Java programs.


    The Java bytecode is standard and platform independent as JRE''s have been created
    for most computing devices (PCs, laptops, mobile devices, phones, internet devices
    etc) this makes Java programs highly portable and by compiling the code to an
    intermediate language Java strives to attain the fast implementation speeds by
    fully compiled systems. i.e. Once compiled Java code can run on any machine with
    a JRE irrespective of its underlying operating system


    # C# Programs


    As we see in 1.8, C# programs, like Java programs, are also converted into an
    intermediate language but a C# compiler goes further and links with the necessary
    dll files to generate programs that can be directly executed on the target machine.
    C# programs are therefore fully compiled programs i.e. .exe files are generated.
    While these are fast and efficient the source code must be recompiled each time
    we wish to run the program on a machine with a different operating system.


    C# it part of the .NET framework that aims to deliver additional benefits for
    the programmer.


    Some programmers mistakenly believe that C# was written to create programmes for
    the Windows operating system this is not true as we will see when we consider
    the .NET framework.


    # 1.8 Introduction to the .NET Framework


    The .NET framework was designed to make life simpler for programmers by providing
    a common platform that can be used when writing programs in several different
    programming languages (C# and Visual Basic among others).


    The .NET platform provides common features that can be used by programmers of
    all .NET languages. These include :


    +   - a Common Language Runtime (CLR) engine that allows all .NET programs to
    run and use common features based on a Common Language Specification (CLS). The
    CLR also shields the programmer from having to deal with issues that are specific
    to individual operating systems.


    +   - b a comprehensive class library providing a wealth of built-in functionality
    (GUI, File I/O, Database, Threading, Serialization, Security, Web applications,
    Networking etc)


    +   - c a Common Intermediate Language (CIL). All .NET source code is compiled
    into a common intermediate language provides the ability to integrate code within
    any .NET language making use of common exception handling facilities.'
