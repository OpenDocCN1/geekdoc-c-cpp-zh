    Object Oriented Software Analysis and Design


    # 6.10 Refining Our Design using CRC Cards


    Having identified the main classes in our system, the attributes and methods of
    these classes, we could now proceed to refine these designs by defining the data
    types and other small details, document this information on a UML diagram and
    program the system. However in a real world system the problem would be larger
    and less well-defined than the problem we are working on here the analysis and
    refinement of design would therefore be a longer complex process that we can realistically
    simulate.


    As real world problems are more complex our initial designs are unlikely to be
    perfect therefore it makes sense to check our designs and to resolve any potential
    problems before turning these designs into a finished system.


    One method of checking our designs is to document our designs using CRC cards
    and to check if these work by role-playing different scenarios.


    CRC cards are not the only way of doing this and are not part of the UML specification.


