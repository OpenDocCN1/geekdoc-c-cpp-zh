  md: "Object Oriented Programming using C#\n\n# 11.10 Creating and Handling UnknownClientException\n\
    \nThe GetClient() method will generate a KeyError if no client exists with the\
    \ specified ID. If we do not catch and this with our exception our program will\
    \ crash! Furthermore our program will crash as we try to invoke the DecreaseCredit()\
    \ method without having a client object to invoke this method.\n\nTo protect against\
    \ this we need:\n\n+   * Create a new kind of exception (as described in Chapter\
    \ 9) called UnknownClientException\n* tell the ClientBook class to throw this\
    \ exception if a client is not found\n* catch and deal with this exception in\
    \ the DailyPurge() method.\n\nThe first step is simple ....\n\n```\npublic class\
    \ UnknownClientException :ApplicationException\n{\n    public UnknownClientException(String\
    \ message): base(message)\n}\n```\n\n![](img/e143b38d00f95425fa4f3efca0527189_234_0.png)\n\
    \nHere at Ericsson we have a deep rooted belief that the innovations we make on\
    \ a daily basis can have a profound effect on making the world. a better place\
    \ for people, business and society. Join us.\n\nIn Germany we are especially looking\
    \ for graduates as Integration Engineers for\n* Radio Access and IP Networks\n\
    * IMS and IPT\n\nWe are looking forward to getting your application! To apply\
    \ and for all current job openings visit our web page: www.ericsson.com/careers\n\
    \nDownload free ebooks at bookboom.com\n\n235"
