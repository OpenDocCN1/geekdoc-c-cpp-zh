    When writing the GetClient() method the author was fully aware that a client may
    not be found and in this case decided to return a NULL value. However this relies
    on every programmer who ever uses this method to recognise and protect against
    this eventuality.


    If any programmer using this method failed to protect against a NULL return then
    their program could crash – potentially in this case losing the bank sums of money.
    Of course in other applications, such as an aircraft control system, a program
    crash could have life-threatening results.


    A more secure programming method is required to ensure that that a potential crash
    situation is always dealt!


    Such a mechanism exists - it is a mechanism called ‘exceptions’.


    By using this mechanism we can trap any potential errors in our code – preventing
    and managing crash situations.


