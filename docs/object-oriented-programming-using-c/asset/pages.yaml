  md: '# Object Oriented Programming using C#


    # Generic Collections and how to Serialize them


    If you look at the Dictionary class in the System.Collections.Generic namespace
    of the .NET framework you will see a host of other useful methods that have been
    created to manage Dictionaries. These include Clear(), ContainsKey(), ContainsValue()
    and Remove().


    # 7.11 Serializing and De-serializing Collections


    Collections, Lists, Sets and Dictionaries among others, are very powerful flexible
    mechanisms for storing collections of objects.


    They automatically resize themselves and contain methods that save significant
    programming effort when adding retrieving members, removing members, searching
    for members, sorting collections etc.


    They become even more powerful when combined with the serialization / de-serialization
    facilities provided by the .NET framework.


    Using traditional file handling routines textual data can be stored and retrieved
    from files.


    Serialization allows objects to be stored with one single command (once an appropriate
    file has been opened).


    However C# objects frequently contain references to other objects, they create
    what is known formally as a ''graph'' – a network of connections. The serialization
    mechanism follows these references and also serializes the objects referenced...
    and those objects reference... etc.


    ![](img/e143b38d00f95425fa4f3efca0527189_159_0.png)


    Download free ebooks at bookboom.com'
