    \ fact CashTill can sell anything that has these methods, not just Publications.\
    \ To enable this to happen we will define this set of operations as an 'Interface'\
    \ called ISaleableItem (where 'I' is being used to indicate this refers to an\
    \ interface not a class).\n\n```\npublic interface ISaleableItem\n{\n    double\
    \ Price\n    {\n        get;\n    }\n    void SellCopy();\n}\n```\n\nNote that\
    \ the interface defines the signatures of operations without their implementations.\
    \ While this interface defines the need for a get method for 'price' a set method\
    \ is not required and therefore not defined in the interface.\n\nAll the methods\
    \ are implicitly public even if this is not stated, and there can be no instance\
    \ variables, constructors or code to implement the methods.\n\nIn other words,\
    \ an interface defines the availability of specified operations without saying\
    \ anything about their implementation. That is left to classes which implement\
    \ the interface."
