    # 7.4 Lists


    Lists are the most commonly used type of collection – where you might have used
    an array, a List will provide a more convenient method of handling the data.


    Lists are very general-purpose data structures, with each item occupying a specific
    position. They are in many ways arrays, but are more flexible as they are automatically
    resized as data is added. They are also much easier to manipulate than arrays
    as many useful methods have been created to do the bulk of the work for you. Lists
    items in a particular sequence (though not necessarily sorted into any meaningful
    order) and duplicate items are permitted.


    We will look at the List, HashSet and Dictionary classes, discuss what they do
    and show some of the more common useful methods that exist.'
