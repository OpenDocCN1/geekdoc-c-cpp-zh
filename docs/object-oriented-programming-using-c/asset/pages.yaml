  md: '# Object Oriented Programming using C#


    # Inheritance and Method Overriding


    Fred is a felis leo is a felis a cat is a carnivore


    Carnivores eat meat so Fred has the characteristic ''eats meat''.


    Fred is a felis leo is a felis a cat is a carnivore is a mammal is a vertebrate


    Vertebrates have a backbone so Fred has the characteristic ''has a backbone''.


    The ''is '' a relationship links an individual to a hierarchy of characteristics.
    This sort of relationship applies to many real world entities, e. BonusSuperSaver
    is a SavingsAccount is a BankAccount.


    # 3.3 Inheritance


    We specify the general characteristics high up in the hierarchy and more specific
    characteristics lower down. An important principle in OO – we call this generalization
    and specialization.


    All the characteristics from classes above in a class/object in the hierarchy
    are automatically featured in it – we call this inheritance.


    Consider books and magazines - both are specific types of publication.


    We can show classes to represent these in a UML class diagram. In doing so we
    can see some of the instance variables and methods these classes may have.


    | Book | Magazine |

    |---|---|

    | title | title |

    | author | price |

    | price | orderQty |

    | copies | currissue |

    | | copies |

    | | SellCopy() |

    | SellCopy() | AdjustQty() |

    | OrderCopies() | RecNewIssue() |


    Attributes ''title'', ''author'' and ''price'' are obvious. Obvious is ''copies''
    this is how is currently in stock.


    For books, OrderCopies() takes a parameter specifying how many extra copies are
    added to stock.


    For magazines, orderQty is the number of copies received of each new issue and
    currissue is the date/period of the current issue (e.g. "January 2011", "6 Jan",
    "Spring 2011\). When a new issue is issued the old issues are discarded and orderQty
    are placed in stock. Therefore RecNewIssue() sets currissue to the date of new
    issue and restores copies to orderQty. AdjustQty() modifies orderQty to alter
    how many copies of subsequent issues will be stocked.


