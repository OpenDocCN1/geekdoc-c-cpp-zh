    # Tickets


    Now consider the possibility that in addition to books and magazines, we now want
    to sell tickets, e.g. for entertainment events, public transport, etc. "These
    are not like Publications:-


    +   - we don''t have a finite ''stock'' but print them on the till

    - tickets consist simply of a description, price and client (for whom they are
    being sold)

    - these sales are really a service rather than a product


    Tickets seem to have little in common with Publications – they share a small interface
    associated with being sold, but even for the underlying implementation will be
    different because we will not be decrementing them from a current stock.


    For these reasons Ticket and Publication do not seem closely related and thus
    do not want to put them in an inheritance hierarchy. However we do want to make
    them both like CashTill as things to sell and we need a mechanism for doing this.


    Without putting them in an inheritance hierarchy what we want a more general way
    of saying "things this class can be sold" which can be applied to whatever (present
    and future) classes we wish, making the system readily extensible to Tickets and
    anything else.


    While the Ticket class is sufficiently different from a Publication that we do
    not want to put it an inheritance hierarchy it does have some similarities – namely
    it has a SellCopy() method and a property to obtain the price – both of these
    are needed by a CashTill.


    | Ticket |

    | description price client |

    | Price() SellCopy() |


    However the SellCopy() method is very different form the SellCopy() method defined
    in Publication. To sell a publication the stock had to be reduced by 1 – with
