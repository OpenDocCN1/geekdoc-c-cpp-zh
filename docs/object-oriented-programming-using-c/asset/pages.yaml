    # A Note On Naming Conventions


    Some programmers use words beginning in capitals to denote class names and words
    beginning in lowercase to represent attributes or methods (thus ToString() would
    be shown as toString()). This is a common convention when designing and writing
    programs in Java (another common OO language). However it is not a convention
    followed by C# programmers - where method names usually start in Uppercase. Method
    names can be distinguished from class names by the use of (). In this example.


    +   ''Book'' is a class

    ''title'' is an attribute and

    ''SetTitle()'' is a method.


    UML diagrams are not language specific thus this software design, communicated
    via UML diagrams, can be implemented in a range of OO languages.


    Furthermore accessor methods, getters and setters, are not required in C# programmers
    as they are replaced by ''properties''. Properties are in effect hidden accessor
    methods thus the getter and setter methods shown above, GetTitle(), SetTitle()
    etc are not required in a C# program. In C# an attribute would be defined called
    ''title'' and a property would be defined as ''Title''. This would allow us to
    set the ''title'' directly by using the associated property ''Title =......;'',


    The UML diagrams shown in this book will use the naming convention common among
    C# programmers ... for the simple reason that we will be writing sample code in
    C# to demonstrate the OO principles discussed here. Though initially we will show
    conventional assessor methods these will be replaced with properties when coding.


