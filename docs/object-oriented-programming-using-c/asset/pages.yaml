- pgno: 12
  md: '# 1.1 A Brief History of Computing


    Computing is a constantly changing our world and our environment. In the 1960s
    large machines called mainframes were created to manage large volumes of data
    (numbers) efficiently. Bank account and payroll programs changed the way organisations
    worked and made parts of these organisations more efficient. In the 1980s personal
    computers became common and changed the way many individuals worked. People started
    to use their own computers and used many word processors and spreadsheets (to
    write letters and to manage accounts). In the 1990s email became common and the
    wide web was born. These technologies revolutionised communications allowing individuals
    to publish information that could easily accessed on a global scale. The ramifications
    of these new technologies are still not fully understood as society is adapting
    to opportunities of internet commerce, new social networking technologies (twitter,
    facebook, myspace, online gaming cet) and the challenges of internet related credit.


    Just as new technologies are changing our world so are new techniques and ideas
    changing the way we develop computer systems. In the 1950s the use machine code
    (unsophisticated, complex and machine specific) languages were common.


    In the 1960s high level languages, which made programming simpler, became common.
    However these led to the development of large complex programs that were difficult
    to manage and maintain.


    In the 1970s the structured programming paradigm became the accepted standard
    for large complex computer programs. The structured programming paradigm proposed
    methods to logically structure the programs developed into smaller, more manageable
    components. Furthermore methods for analysing data were proposed that allowed
    large databases to be created that were efficient, preventing needless of data
    and protected against the risks associated with data becoming out of sync. However
    significant problems still persisted in a) understanding the systems we need to
    create and b) changing existing software as requirements changed.


    In the 1980s ''modular'' languages, such as Modula-2 and ADA were developed that
    became the precursor to modern Oriented languages.


    In the 1990s the Object Oriented paradigm and component-based software development
    ideas were developed and Object Oriented languages became the norm from 2000 onwards.


    The object oriented paradigm is based on many of the ideas developed over the
    previous 30 years of abstraction, encapsulation, generalisation and polymorphism
    led to the development of software components where the operation of the software
    and the data it operates on are modelled together. Proponents of the Object Oriented
    development paradigm argue that this leads to the development of software components
    that can be re-used in different applications thus saving significant development
    time and cost savings but more importantly better software models to be produced
    that makes systems more maintainable and easier to understand.


    It should perhaps noted that software development ideas are still evolving and
    new agile methods of working are being proposed and tested. Where these will lead
    us in 2020 and beyond remains to be seen.'
