  md: "# Object Oriented Programming using C#\n\n# Case Study\n\n```\nprivate void\
    \ btnFindClient_Click(object sender, EventArgs e)\n{\n    Client client;\n   \
    \ try{\n        InputBox newInput = new InputBox(\"Find Client\", \"Please enter\"\
    );\n        DialogResult dialogResult = newInput.ShowDialog();\n        if (dialogResult\
    \ == DialogResult.OK){\n            int clientID;\n            if (!Int32.TryParse(newInput.Answer,\
    \ out clientID)){\n                MessageBox.Show(\"Invalid client ID, please\
    \ enter integer number.\");\n                return;\n            }\n        \
    \    client = clientBook.GetClient(clientID);\n            MessageBox.Show(client.ToString());\n\
    \        }\n    } catch (UnknownClientException ex){\n        MessageBox.Show(ex.Message);\n\
    \    }\n}\n```\n\nThis action listener performs the following tasks:\n\n+   -\
    \ It opens a dialog box to ask the user for clients. As C# does not have predefined\
    \ methods to create input boxes this uses a form called InputBox that was created\
    \ specifically for this purpose. If cancel input boxes returns an empty string.\n\
    - It checks if OK has been pressed and the ID returned is a valid integer.\n-\
    \ On the client book it invokes the GetClient() method passing the ID as a parameter.\n\
    - Assuming a client object is returned, the ToString() method is invoked to get\
    \ a string representation of the client and this is passed as a parameter to the\
    \ MessageBox.Show() method (which displays the details of the client with that\
    \ ID).\n- If GetClient() fails to find a client with the specified ID it will\
    \ throw an UnknownClientException - this will be caught here and an appropriate\
    \ message will be displayed. This makes use of the Message property of the Exception\
    \ class."
