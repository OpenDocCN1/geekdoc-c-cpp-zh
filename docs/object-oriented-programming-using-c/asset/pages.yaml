- pgno: 57
  md: '# 2.6 UML Sequence Diagrams


    Sequence diagrams are entirely different from class diagrams or object diagrams.
    Class diagrams describe the architecture of a system and object diagrams describe
    the state of a system at one moment in time. However sequence diagrams describe
    how the system works over a period of time. Sequence diagrams are ''dynamic''
    rather than ''static'' representations of the system. They show the sequence of
    method invocations within and between objects over a period of time. They are
    useful for understanding how objects collaborate in a particular scenario.


    See the example below :-


    ![](img/e143b38d00f95425fa4f3efca0527189_57_0.png)


    We have three objects in this scenario. Time runs from top to bottom, and the
    vertical dashed lines (lifelines) indicate the objects'' continued existence through
    time.


    This diagram shows the following actions taking place :-


    +   - Firstly a method call (often referred to in OO terminology as a message)
    to Method0() comes to object1 from somewhere – this could be another class outside
    the diagram.

    - object1 begins executing its Method0() (as indicated by the vertical bar (called
    an activation bar) which starts at this point.

    - object1.Method0() invokes object2.Method1() – the activation bar indicates that
    this executes for a period then returns control to Method0()

    - Subsequently object1.Method0() invokes object2.Method2() passing two parameters

    - Method2() subsequently invokes object3.Method3(). When Method3() ends it passes
    a return value back to Method2()

    - Method2() completes and returns control to object1.Method4()

    - Finally Method0() calls another method of the same method as the object, Method4()'
