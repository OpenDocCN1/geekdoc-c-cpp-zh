  md: '# 7 Generic Collections and how to Serialize them


    Introduction


    This chapter will start by introducing the reader to generic methods it will then
    go on to introduce the reader to an essential part of the .NET framework : the
    classes that implement generic collections. Finally it will introduce the idea
    of serialization and show how different collections can be serialised as this
    is a very common task.


    Objectives


    By the end of this chapter you will be able to....


    +   * Understand the concept of Generic Methods

    * Understand the concepts of Collections and the different types of Collection

    * Understand the concept of Serialization and how to serialise the different collections.


    This chapter consists of twelve sections :-


    +   1) An Introduction to Generic Methods

    2) An Introduction to Collections

    3) Different Types of Collections

    4) Lists

    5) HashSets

    6) Dictionaries

