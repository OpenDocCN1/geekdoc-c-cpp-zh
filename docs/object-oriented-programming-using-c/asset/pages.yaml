  md: "# Simple Association\n\n![](img/e143b38d00f95425fa4f3efca0527189_41_0.png)\n\
    \n+   * In an association Class A 'uses' objects of Class B\n* Typically Class\
    \ A has an attribute of Class B\n* Navigability is from A to B:\n i.e. Class A\
    \ object can access the Class B object(s) with which it is associated. The reverse\
    \ is not true – the Class B object doesn't 'know' about Class A object\n\nA simple\
    \ association typically corresponds to an instance variable in Class A of the\
    \ target class B type.\n\nExample: the Catalogue above needs access to 0 or more\
    \ ItemForSale so items can be added or removed from a Catalogue. An ItemForSale\
    \ does not need to access a Catalogue in order to set its price or perform some\
    \ other method associated with the item itself.\n\n# Bidirectional Association\n\
    \n![](img/e143b38d00f95425fa4f3efca0527189_41_1.png)\n\n+   * Bidirectional Association\
    \ is when Classes A and B have a two-way association\n* Each refers to the other\
    \ class\n* Navigability to A and B to A:\n -A Class A object can access the Class\
    \ B object(s) with which it is associated\n -Object(s) of Class B 'belong' to\
    \ Class A\n -Implies reference from A to B\n -Also, a Class B object can access\
    \ the Class A object(s) with which it is associated\n\nA bidirectional association\
    \ is complicated because each object must have a reference to the other object(s)\
    \ and generally bidirectional associations are much less common than unidirectional\
    \ ones.\n\nAn example of a bidirectional association may be between a 'Degree'\
    \ and 'Student'. ie. given a Degree we may wish to know which Students are studying\
    \ on that Degree. Alternatively starting with a student we may wish to know the\
    \ Degree they are studying."
