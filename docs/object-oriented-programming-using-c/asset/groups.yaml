    \ in poor documentation. On the other hand, if the commenting is done properly\
    \ then the reference documentation is produced for virtually no effort at all.\n\
    \n![](img/e143b38d00f95425fa4f3efca0527189_169_0.png)\n\nXML comments should therefore\
    \ be added at the start of every class using the standard tags <summary> and <remarks>\
    \ to give an overview of the class in the following format.\n\n```\n/// <summary>\n\
    /// Provide a short description of the class and its role here ....\n/// </summary>\n\
    /// <remarks>Author Simon Kendal\n/// Version 1.0 (5th May 2011)</remarks>\n```\n\
    \nSimilar comments should be provided for every method using the // <param name=\"\
    name of parameter\">, and <returns> tags to describe each parameter and describe\
    \ the value returned. The details of each parameter, starting with the name of\
    \ the parameter, should be provided on separate lines as shown below.\n\n```\n\
    /// <summary>\n/// A description of the method\n/// </summary>\n/// <param name=\"\
    name of first parameter\">A description of that parameter </param>\n/// <param\
    \ name=\"name of 2nd parameter\">A description of that parameter </param>\n///\
    \ <returns> A description of the value returned by a method. </returns>\n```\n\
    \n# Activity 1\n\nThe method below takes two integer numbers and adds them together.\
    \ This value is returned by the method. Write an XML comment, using appropriate\
    \ tags, to describe this method.\n\n```csharp\npublic int add(int number1, int\
    \ number2)\n{\n return(number1 + number2);\n}\n```\n\n# Feedback 1\n\n```\n///\
    \ <summary>\n/// This method adds two integers.\n/// </summary>\n/// <param name=\"\
    number1\">The first number.</param>\n/// <param name=\"number2\">The second number.</param>\n\
    /// <returns>The sum of the two numbers.</returns>\n```\n\nAutomatic tools cannot\
    \ analyse comments to determine if these provide an accurate description of the\
    \ methods, however tools can do far more than cut and paste comments to a web\
    \ document. One doing tool is automate method signatures and compare this with\
    \ the tags in the comments to check for logical errors. If a method requires parameters\
    \ but the comment describes two this error will be detected and reported to the\
    \ programmer.\n\n```\n\"Parameter 'name' has no matching param tag in the XML\
    \ comment for 'Name of class here' (but other parameters do)\"\n```\n\nBy analysing\
    \ the code tools can also provide additional information about the class, the\
    \ methods that have been inherited and the methods that have been overridden.\n\
    \nBy using tools reference documentation can be produced for programmers using\
    \ the class(es) concerned, it does not include comments within methods intended\
    \ for programmers editing the source code in maintenance work.\n\nAutomatic documentation\
    \ tools do not exist as standard within either Microsoft Visual Studio or SharpDevelop.\
    \ Both of these IDEs can be integrated with Sandcastle Help Builder this enables\
    \ automatic documentation to be generated. Better still another tool exists GhostDoc\
    \ which further helps by generating the necessary comments.\n\n## 8.5 Sandcastle\
    \ Help Builder\n\nTo be precise Sandcastle Help Builder (SHFB) does not produce\
    \ automatic documentation for your code... but it adds a graphical front end to\
    \ 'Sandcastle.' 'Sandcastle' is difficult to use tool that lacks a GUI, and has\
    \ a complex installation routine but will generate automatic documentation.\n\n\
    Sandcastle Help builder is a GUI that will drive Sandcastle and will automate\
    \ the installation of Sandcastle. Sandcastle Help Builder can be downloaded from\
    \ http://shfb.codlex.com/.\n\nRunning this software will install:\n\n- Sandcastle,\n\
    - updates and additional files\n- compilers for different help formats - only\
    \ Help 1 compiler\n- Sandcastle Help File itself.\n\nWhen running SHFB needs to\
    \ specify an XML file with comments generated from your code and the C# code itself\
    \ i.e. a .sln\n\nTo generate the XML file from Visual Studio select the project\
    \ Properties / Build / XML comments. Note Visual Studio will then complain if\
    \ comments are missing from your code.\n\n## 8.6 GhostDoc\n\nSHFB is very useful\
    \ as it generates automatic documentation for your programs assuming of course\
    \ appropriate XML comments exists in the body of the code. GhostDoc is one piece\
    \ of software that will automatically add XML comments to your C# code. Though\
    \ the comments should be edited to ensure they are meaningful.\n\nGhostDoc can\
    \ be downloaded from http://submain.com/products/ghostdoc.aspx\n\n## 8.6 Adding\
    \ Namespace Comments\n\nOne final complication regarding namespace comments.\n\
    \nA room exists and it is possible to go outside of that room and put a sign on\
    \ the door. A building exists and we can do the same i.e. go outside and put a\
    \ sign on the building while while the Universe exists we cannot go outside and\
    \ put a sign on it ... because outside does not exist!\n\nA similar problem exists\
    \ with namespace comments.\n\n![](img/e143b38d00f95425fa4f3efca0527189_172_0.png)\n"
  mdcn: "\n\n# 使用 C# 进行面向对象编程\n\n对于我们的目的而言，Express 版本唯一缺失的一项是第 10.5 节中解释的单元测试工具。在所有其他方面，它都是一个强大的集成开发环境（IDE），完全支持学习和开发\
    \ C# 程序。\n\nVisual Studio 可以从以下网站下载：http://www.microsoft.com/express/Downloads/\n\
    \n## 8.3 SharpDevelop\n\n另一个强大且免费的开发 C# 程序的工具是 SharpDevelop。它是开源的，因此你可以下载源代码和可执行文件。\n\
    \nSharpDevelop 支持包括 C# 4.0 和 VB.NET 在内的语言。它包含了单元测试功能（通过插件）、强大的代码补全功能以及调试功能。\n\n\
    为了帮助调试，SharpDevelop 包含一个数据可视化器（下方），该可视化器会在单步执行代码时动态更新数据结构表示。\n\n![](img/e143b38d00f95425fa4f3efca0527189_167_0.png)\n\
    \n有关 SharpDevelop 的更多信息或下载，请访问 http://community.sharpdevelop.net/forums/t/12513.aspx。\n\
    \n应该注意的其他免费工具包括 MonoDevelop (monodevelop.com/)，这是一个支持 Linux、Windows 和 OSX 的多平台\
    \ IDE。\n\n## 8.4 自动文档\n\n某些 IDE 中一个特别实用的功能是为创建的程序生成自动文档。多年来，程序员一直深受编写文档这一枯燥且耗时任务的负担。部分文档是为适应和修改程序功能的用户设计的，这些程序员需要知道程序是如何工作的以及它的结构：\n\
    \n- 它包含什么\n- 每个包中的这些类做什么的\n- 每个类中的这些方法做什么\n  - 该方法的作用什么\n  - 它需要什么参数\n  - 返回什么值\n\
    \n工具本身无法生成用户指南，但它们可以为我们编写的程序提供技术描述，并以网页（HTML 文件）或其他格式生成文档。技术文档应该包含你在查看 MSDN .NET\
    \ 库时看到的类似信息。\n\n![](img/e143b38d00f95425fa4f3efca0527189_168_0.png)\n\n该网站提供了索引网页，包含了\
    \ .NET 库的详细信息，包括所有包、类、方法参数和返回值。这些极其有用的信息不是手动生成的，而是使用自动工具生成的。\n\n工具可以为你创建的任何 C#\
    \ 程序生成类似的详细文档，这将帮助未来的程序员并更新你的程序。然而，这依赖于源文件中格式正确（且信息丰富的！）XML 风格注释，例如 @author、@param\
    \ 等标签。\n\n由于这些文档是自动生成的，程序员就免去了枯燥、耗时且出错的任务。此外，文档可以随程序的改变更新。\n\nXML（可扩展标记语言）是一种指定和共享结构化信息的方法。通过向代码添加意义的\
    \ XML 注释，我们可以生成自动文档。对源代码注释的关注会导致糟糕的文档。另一方面，如果注释得当，那么几乎不需要努力就能生成参考文档。\n\n![](img/e143b38d00f95425fa4f3efca0527189_169_0.png)\n\
    \n因此，应该在每个类的开头添加 XML 注释，使用标准的 `<summary>` 和 `<remarks>` 标签以以下格式给出类的概览：\n\n```\n\
    /// <summary>\n/// 此处提供类及其角色的简短描述 ....\n/// </summary>\n/// <remarks>作者 Simon\
    \ Kendal\n/// 版本 1.0 (2011年5月5日)</remarks>\n```\n\n每个方法也应该提供类似的注释，使用 `<param name=\"\
    参数名称\">` 和 `<returns>` 标签来描述每个参数并描述返回的值。每个参数的细节（以参数名称开始）应该如下所示分行提供：\n\n```\n///\
    \ <summary>\n/// 方法的描述\n/// </summary>\n/// <param name=\"第一个参数名称\">该参数的描述 </param>\n\
    /// <param name=\"第二个参数名称\">该参数的描述 </param>\n/// <returns> 方法返回值的描述。 </returns>\n\
    ```\n\n# 活动 1\n\n下面的方法接收两个整数并将它们相加。该值由方法返回。请使用适当的标签编写 XML 注释来描述此方法。\n\n```csharp\n\
    public int add(int number1, int number2)\n{\n return(number1 + number2);\n}\n\
    ```\n\n# 反馈 1\n\n```\n/// <summary>\n/// 此方法将两个整数相加。\n/// </summary>\n/// <param\
    \ name=\"number1\">第一个数字。</param>\n/// <param name=\"number2\">第二个数字。</param>\n\
    /// <returns>两个数字之和。</returns>\n```\n\n自动工具无法分析注释来确定这些注释是否提供了方法的准确描述，然而，工具的功能远比剪贴注释到网页文档要多。一种实现工具是自动化方法签名并与代码中的标签进行比较以检查逻辑错误。如果方法需要参数但注释中没有对应的标签，此错误将被检测并报告给程序员。\n\
    \n```\n“类中没有匹配的 XML 标签（对于该类的参数）”\n```\n\n## 8.5 Sandcastle Help Builder\n\n准确来说，Sandcastle\
    \ Help Builder (SHFB) 不为你的代码生成自动文档……但它为 'Sandcastle' 添加了图形界面。“Sandcastle' 是一个缺乏\
    \ GUI 且安装复杂的工具，但它可以生成自动文档。\n\nSandcastle builder 是一个驱动 Sandcastle 并自动化安装的 GUI。Sandcastle\
    \ Help Builder 可以从 http://shfb.codlex.com/ 下载。\n\n运行此软件将安装：\n\n- Sandcastle\n\
    - 更新和附加文件\n- 各种帮助格式的编译器 - 仅 Help 1 编译器\n- Sandcastle 帮助文件本身\n\n运行 SHFB 时需要指定一个从代码本身生成的\
    \ XML 文件，即 .sln 文件。\n\n在 Visual Studio 中，选择项目 属性 / 生成 / XML 注释来生成 XML 文件。注意，如果代码中缺少注释，Visual\
    \ Studio 将报错。\n\n## 8.6 GhostDoc\n\nSHFB 非常有用，因为它可以在代码正文中存在适当 XML 注释的情况下为程序生成自动文档。GhostDoc\
    \ 是一个可以为你的 C# 代码自动添加 XML 注释的软件。尽管注释需要编辑以确保其意义。\n\n## 8.6 添加命名空间注释\n\n关于命名空间注释的最后一个复杂问题。\n\
    \n一个房间存在，我们可以走到房间外面并在门上挂一个牌子。一个建筑存在，我们可以这样做，即走到建筑外面并在建筑上挂一个牌子；而当宇宙存在，我们无法走到它的外面并在上面挂一个牌子……因为“外面”并不存在！\n\
    \n命名空间注释也存在类似的问题。\n\n"
