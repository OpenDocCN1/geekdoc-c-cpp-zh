    # Object Oriented Programming using C#


    # The Unified Modelling Language (UML)


    As UML is not a methodology it is left to the user to follow whatever they deem
    appropriate in order to generate the designs by the diagrams. UML does not constrain
    it – it merely allows those to be expressed in an easy to use, but precise, graphical
    notation.


    A process will be explained in chapter 6 that will help you to generate good UML
    designs. Developing designs is a skill that takes practise to this end the process
    is repeated in the case study (chapter 11). For now we will just concentrate on
    the UML notation these processes.


    # 2.2 UML Class diagrams


    Classes are the basic components of any object oriented software system and UML
    class diagrams provide an easy way to represent them. As well as showing individual
    classes, in detail, class diagrams show multiple classes and how they are related
    to each other. Thus a class diagram shows the architecture of a system.


    A class consists of -


    +   * a unique name (conventionally starting with an uppercase letter)

    * a list of attributes (int, double, boolean, String etc)

    * a list of methods


    This is shown in a simple box structure...


    | ClassName |

    | attributes |

    | methods() |


    For attributes and methods visibility modifiers are shown (+ for public access,
    – for private access). Attributes are normally kept private and methods are normally
    made public.


    Accessor methods are created to provide access to private attributes when required.
    This public method SetTitle() can be created to change the value of a private
    attribute ''title''.


    Thus a class Book, with String attributes of title and author, and the following
    methods SetTitle(), GetTitle(), SetAuthor(), GetAuthor() and ToString() would
    be shown as ....


