    \ or reject a loan application.\n\nThe BookOfClients class maintains a set of\
    \ account holders...people are added to or they may be created. However the only\
    \ method of interest to us is the GetClient() method. This method requires a string\
    \ parameter (a client ID) and returns a client object (if the client has an account\
    \ at bank) – returns NULL (if the client does not exist).\n\nThe Client class\
    \ has one method of interest DetermineCreditRating(). This method is invoked to\
    \ invoke a clients credit rating – this is used by the BankManager class to decide\
    \ if a loan should be approved or not.\n\nConsidering the scenario above at the\
    \ snippet of code below ...\n\n```\nClient c = listOfClients.GetClient(clientID)\
    \ \nc.DetermineCreditRating();\n```\n\nThis fragment of code would exist in the\
    \ AwardLoan() method. Firstly it would invoke the GetClient() method, passing\
    \ a client ID as a parameter. This method would return the appropriate client\
    \ object (assuming of course that a client with this ID exists) which is stored\
    \ in a local variable 'c'. Having obtained a client the DetermineCreditRating()\
    \ method would be invoked on this client.\n\nAt these two lines of code. Can you\
    \ identify any potential problems with them?\n\n# Feedback 1\n\nIf a client with\
    \ the specified ID exists this code above will work. However if a client does\
    \ not exist with the specified ID GetClient() method would return NULL.\n\nThe\
