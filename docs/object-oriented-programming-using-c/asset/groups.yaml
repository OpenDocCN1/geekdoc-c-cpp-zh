    # 2.4 UML Package Diagrams


    While class diagrams are the most commonly used diagram of those defined in UML
    notation, and we will make significant use of these throughout this book, there
    are other diagrams that denote different types of information. Here we will touch
    upon of these :-


    +   - Package Diagrams

    - Object Diagrams and

    - Sequence Diagrams


    World maps, maps and cities all show spatial information, just on different scales
    and with differing levels of detail. Large OO systems can be made of hundreds,
    or thousands, of classes and thus the class diagram was the only way to represent
    the architecture of a large system it would become overly large and complex. Thus,
    just as we need maps, we need package diagrams to show the general architecture
    of a large system. Even modest systems can be broken down into few basic components
    i.e. packages. We will see an example of packages in use in Chapter 11. For now
    we will just look at the package diagramming notation.


    Packages diagrams allow us to provide a level of organisation and encapsulation
    that of individual classes Packages are implemented in C# by creating subfolders
    and defining a ''namespace''. When writing a large system in C# we use this to
    segment a large system into smaller more manageable sub-systems. We denote these
    sub-systems as packages during the design stage.


    A large C# development should be split into suitable packages at the design stage

    ML provides a ''Package Diagram'' to represent the relationships between classes
    and packages.


    We can depict


    +   - classes within packages

    - nesting of packages

    - dependencies between packages


    In the diagram below we see two packages :- ''monitor systems'' and ''management
    systems'' These depict part of a large system for a multinational corporation
    to manage and maintain their operations including their computer systems and personnel.


