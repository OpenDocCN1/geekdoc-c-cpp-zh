    ## 1 面向对象编程简介


    ## 引言


    本章将讨论不同的编程范式，以及面向对象方法在软件开发和建模中的优势。我们将解释面向对象化所依赖的概念（抽象、封装、继承和多态）。


    ### 目标


    在本章结束时，你将能够：


    - 解释什么是面向对象编程，

    - 描述面向对象编程方法的益处，以及

    - 理解面向对象编程所依赖的抽象、封装、泛化和多态的基本概念。

    - 理解 .NET 框架开发的原因以及通用语言运行时 (CLR) 引擎的作用。


    这些问题都将在本书后面的章节中进行更详细的探讨。


    本章由九部分组成：


    - 1) 计算机简史

    - 2) 不同的编程范式

    - 3) 为什么要使用面向对象范式？

    - 4) 面向对象原则

    - 5) 什么是面向对象编程？

    - 6) 面向对象编程方法的优势。

    - 7) 软件实现

    - 8) .NET 框架简介

    - 9) 总结


    ## 1.1 计算机简史


    计算技术不断改变着我们的世界和环境。20 世纪 60 年代，创建了称为大型机的机器，以便高效地管理大量数据（数字）。银行账户和工资程序改变了组织的工作方式，并使这些组织的部分变得更加高效。20
    世纪 80 年代，个人电脑变得普及，改变了许多人的工作方式。人们开始使用自己的电脑以及许多文字处理器和电子表格（用来写信和管理账户）。20 世纪 90 年代，电子邮件变得普遍，万网诞生。这些技术彻底改变了通信，允许个人发布可以在全球范围内轻松访问的信息。这些新技术的影响仍未被完全理解，因为社会正在适应电子商务的机会、新的社交网络技术（twitter、facebook、myspace、在线游戏等）以及互联网相关信用的挑战。


    正如新技术在改变我们的世界一样，新的技术和思想也在改变我们开发计算机系统的方式。20 世纪 50 年代，机器码（不成熟、复杂且针对特定机器）语言的使用很常见。


    20 世纪 60 年代，使编程变得更简单的高级语言变得常见。然而，这导致了大型复杂程序的开发，这些程序难以管理和维护。


    20 世纪 70 年代，结构化编程范式成为大型复杂计算机程序的接受标准。结构化编程范式提出的方法可以在逻辑上将开发的程序结构为更小、更易管理的组件。此外，还提出了数据分析的方法，允许创建高效的大型数据库，防止数据浪费并防止与数据不同步相关的风险。然而，重大问题仍然存在，即
    a) 理解我们需要创建的系统，以及 b) 随着需求变化更改现有软件。


    20 世纪 80 年代，开发了“模块化”语言，如 Modula-2 和 ADA，它们成为现代面向对象语言的先驱。


    20 世纪 90 年代，面向对象范式和基于组件的软件开发思想被开发，面向对象语言从 2000 年开始成为规范。


    面向对象范式基于过去 30 年中开发的许多思想：抽象、封装、泛化和多态，这些思想导致了软件组件的开发，其中软件的操作及其操作的数据被一起建模。面向对象开发范式的支持者认为，这可以产生可以在不同应用程序中重用的软件组件，从而节省了大量的开发时间和成本，但更重要的是，产生了更好的软件模型，使系统更具维护性且更易理解。


    也许应该指出，软件开发思想仍在演变，新的敏捷工作方法正在被提出和测试。这些方法将带我们走向 2020 年及以后何方仍有待观察。


    ## 使用 C# 的面向对象编程


    ## 1.2 不同的编程范式


    结构化编程范式认为，程序可以在合理的块中开发，使程序更易理解且更易维护。


    ### 活动 1


    假设你每天执行以下活动。请将此列表按合理的顺序排列，然后将列表分成三个相关活动块，并为每个块给出一个标题以总结该块中执行的活动。


    - 起床

    - 吃早餐

    - 停好

    - 穿衣服

    - 把车从车库开出来

    - 开车上班

    - 找出你的老板想让你做什么

    - 向老板反馈今天的结果。

    - 做老板想让你做的事


