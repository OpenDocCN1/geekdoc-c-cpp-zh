    {\n    private MessageManagerSystem.Clients.Client c;\n\n    [TestInitialize]\n\
    \    public void TestInitialize()\n    {\n        c = new BankManager.Client(\"\
    Simon\", 10);\n    }\n\n    [TestCleanup]\n    public void Cleanup()\n    {\n\
    \        c = null;\n    }\n}\n```\n\nIn the initialisation we have created a new\
    \ client with an opening balance of 10.\n\nStrictly speaking we have written the\
    \ Client tests before the BookOfClient tests as we need client objects to test\
    \ the BookOfClients. In VisualStudio it is possible to ensure these tests are\
    \ run first.\n\nBelow is a simple test to test the AddMoney() method...\n\n```csharp\n\
    [TestMethod]\npublic void AddMoney_TestAdd10ToBalance_FinalBalShouldBe20()\n{\n\
    \    c.AddMoney(10);\n    Assert.AreEqual(20, c.Money, \"Balance after adding\
    \ 10 is not as expected. Expected: 20: \"+c.Money);\n}\n```\n\nThe above uses\
    \ the Assert.AreEqual() method. If the first two parameters are equal then our\
    \ code has passed the test. If they are not equal then our code has failed and\
    \ the third parameter is the error message to be displayed. To be as helpful as\
    \ possible the error message specified the balance we expected and the actual\
    \ balance after the AddMoney() method was invoked.\n\nIn all of the tests we have\
    \ written if the test method ends without failing any assertions then the test\
    \ is passed.\n\n## Object Oriented Programming using C#\n## Testing the ToString()\
    \ method\n\nOne way of implicitly testing that ALL the attributes client have\
    \ been stored correctly is to test the ToString() method returns the value expected.\
    \ This is a little tricky because the format of the string must match exactly\
    \ including every space, punctuation symbol, and newline.\n\nThe alternative is\
    \ to test the value of every property.\n\n### Activity 2\nAssuming the ToString()\
    \ method of the Class is defined as below create a test method to test the value\
    \ returned by the ToString() method is as expected.\n\n```csharp\npublic String\
    \ ToString() {\n    return (\"Client name:\" + Name + \"\\nBalance:\" + Balance);\n\
    }\n```\nHint: We have already initialised client tests by creating a client with\
    \ a name \"Simon\" and a balance of 10.\n\nOne solution to this exercise is given\
    \ below.\n\n```csharp\n[TestMethod]\npublic void ToString_TestClientValues() {\n\
    \    Assert.AreEqual(\"Client name: Simon\\nBalance: 10\", c.ToString(),\n\"String\
    \ returned is not as expected. Expected: Client name: Simon\\nBalance: 10 Actual:\
    \ \" + c.ToString());\n}\n```\n\nHere we assume the string returned from c.ToString()\
    \ is equal to the string we are expecting. This is quite tricky because the format\
    \ of the string must match exactly including every space, punctuation symbol,\
    \ and newline.\n\nThis test is of course implicitly testing that ALL the attributes\
    \ have been stored correctly which would be particularly useful if we used to\
    \ check a client has been retrieved from the book of clients correctly.\n\n##\
    \ 10.11 Running Tests\n\nHaving designed a batch of tests these can be run as\
    \ often as required. To do this in Visual Studio we run via the menu.\n\n## Object\
    \ Oriented Programming using C#\n## 10.12 Test Driven Development (TDD)\n\nWhile\
    \ very useful for regression testing Test Driven Development (TDD) is a technique\
    \ mainly associated with 'agile' development processes. The Test Driven Development\
    \ approach is to\n\n- 1) Write the tests (before writing methods).\n- 2) Set up\
    \ automated testing, which fails because the classes haven't been written!\n-\
    \ 3) Write the classes so the tests pass\n\n![](img/e143b38d00f95425fa4f3efca0527189_199_0.png)\n\
    \nDTU, Technical University of Denmark, is ranked as one of the best universities\
    \ in Europe, and offers internationally recognised Master of Science degrees under\
    \ the expert supervision of top international researchers.\n\n## 10.13 TDD Cycles\n\
    \nWhen undertaking driven development the test will initially cause a compilation\
    \ error as the method tested doesn't exist!\n\nCreating a stub method enables\
    \ the test to compile but the test will 'fail' because the actual functionality\
    \ tested has not been implemented.\n\nWe implement the correct functionality of\
    \ the method so that the test succeeds.\n\nFor a complex method we may have several\
    \ cycles: write test, fail, implement functionality, pass, extend test, extend\
    \ functionality, pass... to build up the solution.\n\n## 10.14 Claims for TDD\n\
    \nAmong the advantages claimed for TDD are:\n\n- testing becomes an intrinsic\
    \ part of development rather than an often hurried afterwards.\n- it encourages\
    \ programmers to write simple code directly addressing the requirements\n- a comprehensive\
    \ suite of unit tests is compiled in parallel with the code development\n- a rapid\
    \ cycle of \"write test, write code, run test,\" each for a small developmental\
    \ increment, increases programmer confidence and productivity.\n\nIn conventional\
    \ software lifecycles if a software project is running late financial pressures\
    \ often result in the software being rushed to market not having been fully tested\
    \ and debugged. With Test Driven Development this is not possible as the tests\
    \ are written before the system has been implemented.\n"
