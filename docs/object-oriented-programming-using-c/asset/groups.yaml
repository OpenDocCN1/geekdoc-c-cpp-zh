    \n# 使用 C# 的面向对象编程\n\n这是一种设计判断——为重要实体（客户、消息等）引入类，这些实体拥有属于自己的一组信息和行为，而不会用极其简单的类来使设计过载（例如积分，它将只包含一个\
    \ `int` 实例变量以及一个属性或访问器方法！）。\n\n动词描述了候选方法，我们应该能够识别这些方法所属类。例如：\n\n- 对于“客户”：\n  -\
    \ 减少积分\n- 对于“消息”：\n  - 减少天数\n\n其他描述潜在方法的动词也应该列出：\n\n- 显示\n- 添加（将客户加入簿中）\n- 添加（将消息加入集）\n\
    - 查找（在簿中查找客户）\n- 清除\n- 递减\n- 过期\n- 删除\n\n对于这些每一个方法都应该识别出对应的类。\n\n# 共同特征\n\n我们初步分析的最后一步是识别类的共同特征，并确定这些类应该通过继承层次结构进行链接，还是通过接口链接。\n\
    \n查看提供的候选类列表，我们可以看到两个类具有共同的特征：\n\n- 显示板\n- 虚拟显示板\n\n这意味着这些类应该在系统中通过继承层次结构进行链接，或者通过“一个接口”（参见第\
    \ 4.5 节接口）。在这种情况下，线索就在描述中：“这些将通过‘定义良好的接口’与系统的其他部分‘连接’”。\n\n最终，我们的系统应该在真实的显示板上显示消息，但应该首先在虚拟显示板上进行测试。为了实现这一点，虚拟板必须实现与真实显示板相同的方法。\n\
    \n# 使用 C# 的面向对象编程案例研究\n\n因此，我们应该定义一个 C# “接口”。这两个类之间不存在公共代码——这就是我们为什么不将它们放在继承层次结构中的。然而，虚拟显示板和真实显示板都应该实现通过通用接口定义的方法。当我们的系统运行时，我们可以用实现相同方法的真实板替换虚拟板。由于与虚拟板的连接是通过接口实现的，将虚拟板更改为真实显示板对我们的系统不会产生影响。\n\
    \n最终，我们的系统应该在真实的显示板上显示消息，但应该首先在虚拟显示板上进行测试。为了实现这一点，虚拟板必须实现与真实显示板相同的方法。\n\n（注：由于原文中存在大量重复段落，翻译已根据逻辑流进行了去重处理。）\n\
    \n"
