    ## 6.2 问题


    我们将为之设计解决方案的问题是“为一个组织马拉松赛的体育俱乐部开发一个小型管理系统”。


    为了这次练习，我们假设已经进行了初步需求分析，并通过采访俱乐部经理和将使用系统的员工，生成了文本描述。


    “GetFit”体育俱乐部将在明年春季举办他们的首届国际马拉松赛。一个由世界排名专业人士和慈善募款业余人员（有些穿着奇装异服！）组成的队伍将在风景优美的沿滨
    26.2 英里路线上进行竞争。作为跟踪跑步者并宣布结果和赞助捐赠的软件系统的一部分，需要一个跑步者关键特征的模型（这只是完工系统的一部分）。


    马拉松的每个跑步者都有一个编号。跑步者被描述为例如“跑步者 42”，其中 42 是他们的编号。他们以记录的小时、分钟和秒的时间完成比赛。他们的结果状态可以被检查，并将显示为“未完成”或“已在
    hh:mm:ss 完成”。


    “GetFit”体育俱乐部正在组织他们明年春季的第一场国际马拉松赛。


    结果状态将显示为“未完成”或“已在 hh:mm:ss 完成”。


