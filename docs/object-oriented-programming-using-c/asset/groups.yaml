    our design using CRC cards and elaborate our classes.


    CRC cards (see Chapter 6 section 6.10 and 6.11) allow us to play various scenarios
    to see if our designs feasible before refining these designs and documenting them
    using UML class diagrams.


    The two CRC cards below have been developed to describe the Client and ClientBook
    classes. The panel on the left shows the class responsibilities and the panel
