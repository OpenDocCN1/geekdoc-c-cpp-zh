    \n我们认为轮胎属于它们所在的汽车，但在修理厂时，它们可能会被拆下并放在架子上进行维修。它们的生存性并不依赖于与其关联的汽车的存在。一些设计人员认为，聚合可以被简单关联代替，因为在程序中实现这种设计对程序员员来说没有区别。\n\
    \n## 组合\n\n![](img/e143b38d00f95425fa4f3efca0527189_43_1.png)\n\n- 组合类似于聚合，但它意味着一种更强的归属关系，即：类\
    \ B 对象是类 A 对象的“部分”\n- 同样意味着从 A 到 B 的引用\n- 在这种情况下比聚合要“强”得多，类 B 对象是类 A 不可缺的一部分，且通常类\
    \ B 对象绝不会在类 A 的部分之外存在，即它们具有相同的“生命周期”\n\n组合的一个示例可以是图片（Picture）的元素——点（Points）、线（Lines）和形状（Shapes）之间的关系。这些对象只能作为图片的一部分存在，如果图片被删除，它们也会被删除。\n\
