  - '[PAGE 189]


    Object Oriented Programming C#


    Agile Programming


    # 10.7 Regression Testing


    All large software systems need to be adapted to meeting changing business needs.
    Many large systems have been in use for a decade or more. Over the years the software
    will need to be updated and improved many times to meet the ever changing needs
    of the client. This reason regression testing is required. By running regression
    tests we want to ensure that changes to the code to not ‘break’ existing functionality.
    To do as we write classes we must also write test cases that demonstrate these
    classes work. Thus we follow a process of ...


    +   * Write class

    * Write tests

    * Run tests, debugging as necessary

    * Write more classes

    * ...


    As we decide to change some of the earlier classes (or classes which they depend
    on) due to bugs, changing user requirements, or refactoring, we need to re-run
    all previous tests to check the new code passes the older tests. Without regression
    testing any modification of code is extremely hazardous!


    As we regularly need to re-run sets of tests it is helpful, and hugely timesaving,
    to have automated testing facilities such as those exist within the professional
    edition of Visual Studio.


    # 10.8 Unit Testing in Visual Studio


    Visual Studio includes a widely used unit testing framework. This framework requires
    us to set up the test cases– however once these have been set up a thousand test
    cases can be re-run at the push of a button – and the same set of test cases can
    be re-run every time the program is amended.


    > The system will run the tests and highlight which tests pass and fail.


    Note that tests which have ‘failed’ actually indicate a failure in the program
    being tested.... You could argue that in showing this failure has in fact successful.


    A summary of the process explained here ..


    +   1) Firstly set up a project to store all of the tests for a system

    2) Within this create a test fixture for each of the classes we are testing

    3) Within each test fixture create multiple tests. Several are probably required
    for each method being tested.

    4) Setup the tests i.e. define any initialisation that must be done before the
    tests are run

    5) Teardown the tests i.e. define anything that should be done after the tests
    have been performed.

    6) Run the tests


    A full treatment of this framework and how to use it for unit testing can be found
    at http://msdn.microsoft.com/en-us/library/ms182515%28v=VS.90%29.aspx


