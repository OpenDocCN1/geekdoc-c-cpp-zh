    使用 C# 的面向对象编程


    # 活动 1


    为了清理消息，MessageBook 会遍历其消息列表，减少“拥有”该消息的客户的额度，递减该消息的剩余天数并在适时删除消息。


    查看上面的 CRC 卡，执行以下步骤并识别这些类中可能存在的任何问题：


    对于每条消息


    - 告诉 Message 减少其剩余天数，并

    - 告诉相关的 Client 减少其额度

    - 询问 Message 它的客户 ID

    - 询问 Message 它的成本

    - 询问 ClientBook 具有此 ID 的客户

    - 告诉 Client 根据消息的成本减少其额度


    - 如果客户的额度 <= 0 或消息现在已过期

    则从列表中删除该消息


    # 反馈 1


    当我们尝试查找与消息关联的客户时，一个问题变得显而易见，因为 Message 并不知道客户 ID。


    因此，我们需要将这一责任添加到 Message 类中。


    下面给出了 Message 类的修订后的设计……


    | Message |

    | --- |

    | 获知消息文本 |

    | 获知 clientID |

    | 知道剩余天数 |

    | 减少剩余天数 |

    | 知道是否过期 |

    | 获知成本 |


    通过为每个类和接口绘制 CRC 卡并对一系列场景进行角色扮演，我们已经检查并修订了系统计划——我们现在可以精炼这些计划并使用 UML 图进行记录。


