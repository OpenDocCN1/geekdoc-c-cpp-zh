    \ 15 个单位的信誉。 \n\n单项测试不足以证明 `IncreaseCredit()` 方法将始终正常工作，因此我们可能需要定义额外的测试。\n\n我们还需要创建测试用例来测试\
    \ `ClientBook` 类中的 `DeleteClient()` 方法。由于这是一个独立的类，我们需要创建一个适当命名的新测试固件，并设置一个测试来对其测试。\n\
    \n相关代码显示如下……\n\n```csharp\nnamespace MessageManagerTests\n{\n    [TestClass]\n\
