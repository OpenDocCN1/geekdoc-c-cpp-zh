  - '[PAGE 200]


    Object Oriented Programming using C#


    Agile Programming


    The task of teaching can be used as an analogy. Which of the following is more
    focused and leads to better teaching?


    +   - Teach everyone everything they should know about a subject and then decide
    how to test their knowledge or


    +   - Decide specifically what a student should be capable of doing after you
    have taught them, then decide how to test the student to ensure they are capable
    of performing this task and finally just what you must teach so that they can
    perform this task and pass the test.


    It can be argued that the second approach leads to more focussed. In the same
    way it is argued by some that test development leads to simpler code that focuses
    just on achieving the functionality required.


    # 10.13 TDD Cycles


    When undertaking driven development the test will initially cause a compilation
    error as the method tested doesn''t exist!


    Creating a stub method enables the test to compile but the test will ''fail''
    because the actual functionality tested has not been implemented in the method.


    We implement the correct functionality of the method so that the test succeeds.


    For a complex method we may have several cycles: write test, fail, implement functionality,
    pass, extend test, extend functionality, pass... to build up the solution.


    # 10.14 Claims for TDD


    Among the advantages claimed for TDD are:


    +   - testing becomes an intrinsic part of development rather than an often hurried
    afterwards.


    +   - it encourages programmers to write simple code directly addressing the requirements


    +   - a comprehensive suite of unit tests is compiled in parallel with the code
    development


    +   - a rapid cycle of "write test, write code, run test," each for a small developmental
    increment, increases programmer confidence and productivity.


    In conventional software lifecycles if a software project is running late financial
    pressures often result in the software being rushed to market not having been
    fully tested and debugged. With Test Driven Development this is not possible as
    the tests are written before the system has been implemented.'
