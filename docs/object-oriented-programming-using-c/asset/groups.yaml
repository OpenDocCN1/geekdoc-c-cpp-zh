    # 使用 C# 进行面向对象编程


    下载的 zip 文件中包含了本章讨论的所有类、方法和测试用例。在 Visual Studio 的解决方案资源管理器（Solution Explorer）中，你将看到所有的包和类，并且能够查看带有相关注释的代码（见下文）。


    ![](img/e143b38d00f95425fa4f3efca0527189_252_0.png)


    你无法通过 Visual Studio 查看或运行测试固件（test fixtures）。为了解决这个问题，我们在本章中展示了所有的测试用例。


    该 zip 文件还包含由 Sandcastle 工具生成的自动化文档。要查看文档，请进入“Documentation”文件夹并双击 index.html 页面。这会将文档加载到你的浏览器中。


    如果你安装了 Sandcastle Help File Builder（可从 http://shfb.codeplex.com/ 免费下载），你就可以加载作为消息系统下载部分的
    MessageManagerSystem.shfb 文件。随后，你将能够看到已添加到项目属性的命名空间注释；如果你需要调整合适的路径，可以重新运行该软件并查看为你生成的文档。


    在 bookboom.com 下载免费电子书


    ## 11.6 结论


    面向对象开发范式的基本原则是：


    - 抽象

    - 封装

    - 一般化/特化（继承）

    - 多态


    这些原则贯穿于 C# 语言和 .NET API 中，并为我们自己的软件开发项目提供了框架。


    对于 C# 的面向对象开发，有一套完善的工具和参考支持，其中一些与现代的“敏捷”开发方法相结合。


    在本章中，你将看到面向对象如何通过以下方式支持程序员：


    - 使用抽象和封装使能够关注并编写复杂系统的不同部分，而不必担心“整体”。

    - 使用继承来“提取”公共代码

    - 使用多态使程序更容易更改

    - 使用自动化工具帮助大型软件项目进行文档编制和测试。


    这些原则已通过 C# 进行了示例说明，但相同的原则和优势适用于所有面向对象的编程语言，这里演示的功能在许多现代 IDE 中都是可用的。


    通过阅读本书并完成小型练习，你已经愉快地对这些原则有了某些理解。


    如果你想对 C# 语言进行进一步的解释，强烈推荐以下书籍……


    Andrew Troelsen 著《Pro C# 2010 and the .NET 4 Platform》


    最后，我希望这本书对你有所帮助，并祝愿未来一切顺利。


