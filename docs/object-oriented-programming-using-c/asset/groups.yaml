    # 扩展类


    在处理完 CRC 场景后，我们可以在类之间对实例变量和方法进行初始分配，包括一些必要性已变得明显的访问器（accessors）和修改器（mutators）（见下图）。


    当然，由于我们将使用 C# 编写此系统，我们将用属性（properties）代替访问器和修改器方法，但由于可以使用任何面向对象语言进行编程，我们将让设计显示适当的访问器和修改器方法。


