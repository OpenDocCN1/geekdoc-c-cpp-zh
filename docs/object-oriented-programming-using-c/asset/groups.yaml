    # 10.1 Agile Approaches


    Traditional development approaches emphasize detailed advance planning and a linear
    progression through the software lifecycle Code late


    ''agile'' development approaches emphasize flexible cyclic development with the
    system evolving towards a solution Code early, fix and improve it as you go along.


    This is a very hot topic in Software Engineering circles at the moment, and as
    with all such developments it has its share of zealots and ideologies!


    Is the waterfall cycle model really successful in enabling large, complex projects
    to proceed from start to finish without ever looking back? Advocates of agile
    practices contend that these best fit the reality of software development.


    However agile programming requires tools that will enable software to change and
    evolve. Two specific tools provided by modern IDEs that support agile programming
    are refactoring and testing tools.


    # 10.2 Refactoring


    A key element of ''agile'' approaches is ''refactoring:'' This technique accepts
    that some early design and implementation decisions will turn out to be poor,
    or at least less than ideal.


    Refactoring means changing a system to improve its design and implementation quality
    without altering its functionality (in traditional development such work was termed
    ''preventive maintenance'').


