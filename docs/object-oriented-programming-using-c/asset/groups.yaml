    \ www.ubs.com/graduates 让你的未来成为我们的一部分。\n\n# 使用 C# 进行面向对象编程\n\n案例研究\n\n对于每条消息：如果消息过期或客户余额用尽，则将该消息的剩余天数设置为零。移除所有过期的消息。见下面的代码……\n\
    \n```csharp\nvoid DailyPurge(ClientBook clients)\n{\n    Client client;\n\n  \
