    This is now shown below....


    ![](img/e143b38d00f95425fa4f3efca0527189_101_0.png)


    CashTill is no longer directly dependent on class Publication – instead it is
    dependent on the interface ISaleableItem.


    Note we can start the interface name with an I to indicate that this is an interface
    not a class.


    The relationships from Publication and Ticket to ISaleableItem are like inheritance
    arrows except that the lines are **dotted** – this shows that each class **implements**
    the interface.


    A class in C# may only inherit from one superclass but can implement as many interfaces
    as desirable. The format for this is :-


    ```

    class MyClass : MySuperClass, IMYInterface, IMYSecondInterface

    ```


    # 4.6 Extensibility Again


    Polymorphism allows objects to be handled without regard for their precise class.
    This can assist in making systems extensible without compromising the encapsulation
    of the existing design.


    For example, we could create new classes for products or services and so long
    as they implement the ISaleable interface the CashTill will be able to process
    them **without a single change to its code**!


    An example could be ‘Sweets’. We could define a class named Sweets to represent
    sweets in a jar. We can define the price of the sweets depending on the weight
    and sell the sweets by subtracting this weight from our total stock. This is not
    like selling a Publication, where we always subtract 1 from the stock. Nor is
    this like selling tickets, where we would just print them.


