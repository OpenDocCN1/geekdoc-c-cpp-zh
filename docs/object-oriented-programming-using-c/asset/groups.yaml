  mdcn: "\n\n# 使用 C# 进行面向对象编程\n\n# 对象角色与多态的重要性\n\n接口是一种契约。`SaleableItem` 接口表示：“我承诺至少提供具有以下签名的方法：\n\
    \n```csharp\npublic void SellCopy ();\npublic double Price ();\n```\n\n尽管我可能还会包含其他内容\n\
    \n当类实现一个接口时，它提供了一个保证的共性区域，多态可以可以利用这一共性。\n\n想象一辆汽车和街机里的一个驾驶游戏。它们之间显然没有任何“是一个（is\
    \ a）”的关系——它们是完全不同的东西，一个是交通工具，另一个是街机游戏。但它们都实现了我们可以称之为“方向盘接口”，我们可以用完全相同的方式使用它们，尽管它们的实现方式（汽车中的机械连杆，游戏中的视频电子）非常不同。\n\
    \n![](img/e143b38d00f95425fa4f3efca0527189_99_0.png)\n\n在爱立信（Ericsson），我们深信，我们每天所做的创新可以为人类、企业和社会创造一个更美好的世界产生深远影响。加入我们吧。\n\
    \n在德国，我们特别寻找以下方向的毕业生作为集成工程师：\n\n- 射射接入和 IP 网络\n- IMS 和 IPX\n\n我们期待您的申请！\n如需申请并查看所有当前空缺，请访问我们的网页：www.ericsson.com/careers\n\
    \n# 使用 C# 进行面向对象编程\n\n# 对象角色与多态的重要性\n\n我们现在需要说明，Publication（出版物）（及其所有子类）和 Ticket（门票）都提供了接口定义的操作：\n\
    \n```csharp\npublic abstract class Publication : ISaleableItem\n{\n    ...class\
    \ details...\n}\n```\n\n```csharp\npublic class Ticket : ISaleableItem\n{\n  \
    \  ...class details...\n}\n```\n\n在 C# 中，当我们定义一个扩展父类的子类，或者创建一个实现接口的类时，都使用相同的符号\
    \ `:`。\n\n对比实现接口与扩展父类。\n\n- 当我们扩展一个父类时，子类继承了来自父类的接口和实现。\n- 当我们实现一个接口时，我们保证了接口指定的操作将会提供——这允许对所有实现给定接口的类进行多态化处理。\n\
    \n# 多态收银台\n\nCashTill 已经采用了多态：`SellItem()` 方法接受一个 `Publication` 类型的参数，允许传递它的任何子类：\n\
    \n```csharp\npublic void SellItem(Publication pPub)\n```\n\n我们现在想要扩展此功能，接受任何实现了\
    \ `SaleableItem` 接口的类型：\n\n```csharp\npublic void SellItem(ISaleableItem pSI)\n\
    ```\n\n当变量或参数的类型定义为接口时，它的工作方式就像父类类型一样。任何实现该接口的类都可以赋值给变量/参数，因为接口是一种**类型**，而所有实现它的类都是该类型的子类型。\n\
    \n# 使用 C# 进行面向对象编程\n\n# 对象角色与多态的重要性\n\n现在在下方展示如下……\n\n![](img/e143b38d00f95425fa4f3efca0527189_101_0.png)\n\
    \nCashTill 不再直接依赖于 `Publication` 类——相反，它依赖于接口 `ISaleableItem`。\n\n注意，我们可以用 `I`\
    \ 开头接口名称，以表示这是一个接口而不是类。\n\n从 `Publication` 和 `Ticket` 到 `ISaleableItem` 的关系就像继承箭头，只不过线条是**虚线**——这显示了每个类都**实现**了该接口。\n\
    \nC# 中的类只能继承自一个父类，但可以实现任意数量的接口。其格式为 :-：\n\n```csharp\nclass MyClass : MySuperClass,\
    \ IMYInterface, IMYSecondInterface\n```\n\n# 4.6 再次讨论可扩展性\n\n多态允许在不考虑对象精确类的情况下处理对象。这有助于在不损害现有设计封装性的情况下使系统具有可扩展性。\n\
    \n例如，我们可以为产品或服务创建新类，只要它们实现了 `ISaleable` 接口，`CashTill` 就能能够处理它们，而**无需对其代码进行任何更改！**!\n\
    \n一个例子可以是“糖果（Sweets）”。我们可以定义一个名为 `Sweets` 的类来代表罐装糖果。我们可以根据重量定义糖果的价格，并通过从总库存中减去该重量来出售糖果。这与出售\
    \ `Publication` 不同，我们总是从库存中减去 1。这也不像出售门票，我们只需要打印它们。\n\n从 bookhoon.com 下载免费电子书\n\
    \n# 使用 C# 进行面向对象编程\n\n# 对象角色与多态的重要性\n\n如果我们创建一个实现 `ISaleable` 接口的 `Sweets` 类，我们增强后的多态收银台就可以出售它们，因为它们是可售物品。\n\
    \n在这种情况下，如果没有多态，我们需要为 `CashTill` 添加一个额外的“销售（方法方法来处理 `Tickets`，以及为每种待售的产品类型添加额外的新方法。通过定义\
    \ `ISaleable` 接口，我们可以在不影响 `CashTill` 的情况下引入额外的产品。多态让扩展我们的程序变得简单，这非常重要，因为它节省了精力、时间和金。\n\
    \n接口允许软件组件更灵活、更具扩展地连接在一起，就像日常世界中的许多电缆和插座实现音频、视频、电源和数据连接一样。想象一下可以插在标准插座上的不同电器数量——并想象如果你必须请电工来会有多么不方便。\n\
    \n![](img/e143b38d00f95425fa4f3efca0527189_102_0.png)\n\n# 使用 C# 进行面向对象编程\n\n\
    # 对象角色与多态的重要性\n\n# 活动 5\n\n通过添加一个 `Diesel（柴油）` 类来适配以下内容，使其可以使用。如下所示。\n\n![](img/e143b38d00f95425fa4f3efca0527189_103_0.png)\n\
    \nCashTill 不再直接依赖于 `Publication` 类——相反，它依赖于接口 `ISaleable`。\n\n注意，我们可以用 `I` 开头接口名称，以表示这是一个接口而不是类。\n\
    \n从 `Publication` 和 `Ticket` 到 `ISableable` 的关系就像继承箭头，只不过线条是**虚线**——这显示了每个类都**实现**了该接口。\n\
