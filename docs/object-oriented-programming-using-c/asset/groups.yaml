    我们还不知道 ClientBook 和 MessageSet 需要哪些简单属性，但它们需要与其他类关联，因此我们仍有一些工作要 own——这就是为什么有问号的原因（它们不是
    UML 的正式部分）。


    # 类之间的关系


    我们现在可以开始研究这些类是如何关联的。


    从 ClientBook 和 Client 开始 - 一个：ClientBook 将记录零或多个客户的详细信息。


    导航性是从 ClientBook 指向 client 的，因为簿“知道”它的客户（在实现术中，它将拥有对它们的引用），但单个客户将拥有指向簿的引用。


    一对多的关系表明 ClientBook 将拥有一个（某种类型的）客户集合（Collection）。规定每个 Client 都将有一个唯一的 ID，因此该集合实际上是一个字典，每个条目由一对值组成——即一个
    clientID (int) 和一个 Client 对象。由于我们通过 ID 检索客户的频率可能比添加和删除频率更高，因此如果使用这种排序字典（sorted
    dictionary），系统将更高效，客户将按其 ID 顺序存储。在排序字典中，添加和删除元素会较慢，因为过程更复杂，但检索元素会更快。


