  - '[PAGE 223]


    # Object Oriented Programming using C#


    # Case Study


    Thanks to the operation of polymorphism this change will have no impact at any
    other part of the system!


    Looking at the class diagram we can see that MessageSet keeps and manages a set
    of Messages (DummyBoard keeps a set of messages - once they have been uploaded
    for display). But about what UrgentMessage?


    Urgent messages are just a specific type of message. When the AddMessage() method
    is invoked within MessageSet requires an object of type Message i.e. a message
    to be added - but of the subtype UrgentMessage is still a ''Message'' so the AddMessage()
    method would accept an UrgentMessage object.


    Therefore, without making any changes to all MessageSet, MessageSet can maintain
    a set of all messages to be displayed (both urgent and ordinary)!


    Furthermore when the DailyPurge() method is invoked invokes the GetCost() method
    on a Message object so that the client can be charged for that. At runtime the
    Common Language Runtime (CLR) engine will determine whether the object is of type
    Message or type UrgentMessage and it will invoke the correct version of the GetCost()
    method - remember this is overridden in UrgentMessage. This is polymorphism in
    action!


    MessageSet requires messages, but thanks to the application of polymorphism and
    method overriding, MessageSet will happily deal with any subtype as though it
    were a Message object. If we later to create new message types, such as a Christmas
    or Valentine message, MessageSet would be able to deal with these as well without
    changing a single line of code!


    Thus in this application we are able to extend the system to add the facility
    for urgent messages by adding only one class and making one small change to the
    interface.


    Without the application of polymorphism we would need to have made additional
    changes to other parts of the system - namely MessageSet and DummyBoard.


    Object Orientation has enabled the system to be extended with minimal effort!


    # 11.7 Packaging the Classes


    Large programs should be segmented into packages as this provides an appropriate
    level of encapsulation and access control (as described in Chapter 2).


    The system being used here to demonstrate the theory in this textbook hardly qualifies
    as large – nonetheless it has been decided to package related classes together
    as shown below.'
