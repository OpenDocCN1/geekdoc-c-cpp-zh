    \n## 10.10 Several Test Examples\n\nTo illustrate the testing framework we will\
    \ create several test cases to test the functionality of a BankManagement system\
    \ as represented below :\n\n![](img/e143b38d00f95425fa4f3efca0527189_192_0.png)\n\
    \nIn this system a BankManager class maintains a book of clients (BofC). Client\
    \ objects can be added by the AddClient() method which requires an ID for that\
    \ client and the client object to be added. Clients can be retrieved via the GetClient()\
    \ method which requires a ClientID as a parameter and returns a client object\
    \ (if one exists) or generates an exception (if a client with the specified ID\
    \ does not exist).\n\nThe Client class has a constructor that requires the name\
    \ of the client and the client' balance.\n\nFor simplicity we are assuming each\
    \ client of the bank has only one account (obviously this is not a realistic system)\
    \ and we do not need an account number as each client has a unique ID.\n\nWe will\
    \ specifically test the ability to...\n\n- Add a client to the BookOfClients\n\
    - Trying to lookup a non-existent client\n- Increase a Clients balance by invoking\
    \ the AddMoney() method.\n\nThis is of course only a small fraction of the test\
    \ cases which would be needed to thoroughly demonstrate the operation of all classes\
    \ and all methods within the system.\n\n## Testing a client\n\nTo test a client\
    \ can be added we need to:\n\n- 1) Set up the test by creating a new empty BookOfClients\n\
    - 2) Create a client and add this to the BookOfClients\n- 3) Check that the client\
    \ has been added successfully by trying to retrieve the client just added (this\
    \ course should work) and finally\n- 4) We need to test that the client has retrieved\
    \ the same attributes as the client we added – to ensure it was not corrupted\
    \ in the process.\n\nFirstly we initialise the test by creating a new empty BookOfClients\
    \ object (BofC) and we clean the test by setting this to null at the end. The\
    \ code for this is below:\n\n```csharp\n[TestInitialize]\npublic void TestInitialize()\
    \ {\n    BofC = new BookOfClients();\n}\n\n[TestCleanup]\npublic void TestCleanup()\
    \ {\n    BofC = null;\n}\n```\n\nNext we create our first test. This method will\
    \ work by trying to add a client to the empty BofC. If the system generates an\
    \ exception then we already know a fault in our code. See the test for this:\n\
    \n```csharp\n[TestMethod]\npublic void AddClient_TestNewClient_ExceptionNotBeGenerated()\
    \ {\n    Client c = new Client(\"Simon\", \"Room 1234\", 200, 10);\n    try {\n\
    \        Bof.AddClient(c);\n    } catch (Exception) {\n        Assert.Fail(\"\
    ClientExists exception should not be thrown for new clients\");\n    }\n}\n```\n\
    \nIf the test above passes we know our code has not generated an exception however\
    \ does not prove that the client has been added. We need to create other tests\
    \ to show we can retrieve the client just added and need a test to show that in\
    \ adding the client object the attributes have not been corrupted. Multiple tests\
    \ are required before we have confidence that the method will actually work!\n\
    \nNote the name of the test above indicates the method being tested by a description\
    \ of the test being performed and a description of the expected output. Test names\
    \ like this, long, are important. By reading a long list of test names we can\
    \ work out parts of our system have been tested and which parts have been missed.\n\
    \nIn addition to the tests described we should also try to add a client with the\
    \ same ID twice. Our system should of course not allow this to happen. The test\
    \ succeeds if the code prevents a being added twice.\n\nConversely if the system\
    \ does not generate an exception after adding the same client for the second time\
    \ then the test should indicate that the code has failed. For this test is given\
    \ below:\n\n```csharp\n[TestMethod]\npublic void AddClient_TestExistingClient()\
    \ {\n    Client c = new Client(\"Simon\", \"Room 1234\", 200, 10);\n    try {\n\
    \        Bof.AddClient(c);\n        Bof.AddClient(c);\n        Assert.Fail(\"\
    ClientExists exception should be thrown\\nif client added twice\");\n    } catch\
    \ (ClientExistsException) {\n    }\n}\n```\n\nAn alternative way of writing the\
    \ test above is to indicate that the test expects an exception to be generated\
    \ by the [ExpectedException(...)] attribute. If this exception is generated and\
    \ interrupts the test then the test has passed. See an alternative version of\
    \ the test code below...\n\n```csharp\n[TestMethod]\n[ExpectedException(typeof(ClientExistsException))]\n\
    public void AddClient_TestExistingClient() {\n    Client c = new Client(\"Simon\"\
    , \"Room 1234\", 200, 10);\n    Bof.AddClient(c);\n    Bof.AddClient(c);\n}\n\
    ```\n"
  mdcn: "\n\n# 面向对象编程 C# 敏捷编程\n\n有一种命名规范，可以使测试用例与被测试代码之间的关系变得清晰：\n\n- 1) 用于存储测试的项目根据被测试的系统命名（例如，一个存储银行系统测试的项目可以命名为\
    \ `BankSystemTests`）。\n- 2) 测试固件（Test Fixture）使用被测试类的名称进行命名（例如，假设银行系统中有一个名为 'Client'\
    \ 的类，则测试固件命名为 `TestFixture_ClientTests`）。\n- 3) 测试的命名使用：被测试的方法名+所应用的测试+预期结果（例如，一个名为\
    \ `AddMoney` 的方法可能有一个测试为...`AddMoney_Add5Pounds_BalanceEquals10`）。\n\n在 Visual\
    \ Studio 中，遵循菜单 `测试` -> `新建测试项目` -> `基本`将设置一个能够处理 C# 代码的测试套件。首先，将要求输入测试固件的名称，如果之前没有设置测试项目，则会要求输入名称。每个测试在被添加到测试固件时都需要单独命名。\n\
    \n创建了测试固件后，我们需要设置测试并编写测试本身。作为其中的一部分，我们需要指定被测试代码正确行为。我们使用 `Assert(...)` 方法来实现，这些方法必须为真，测试才能通过。\n\
    \n我们还利用属性（Attributes）为 Visual Studio 提供必要的信息，以便其运行测试……\n\n- `[TestClass]` 属性表示该测试类将确实作为测试固件。因此，此属性必须放在每个测试固件的开头。\n\
    \n```csharp\n[TestClass]\npublic class TestFixture_ClientTests\n{\n```\n\n- `[TestInitialize]`\
    \ 属性声明了一个在每个测试用例执行之前运行的方法。\n- 测试用例是方法，必须跟在 `[TestMethod]` 属性。\n- `[TestCleanup]`\
    \ 属性声明了一个在每个测试用例执行后运行的方法。\n- `[ExpectedException(typeof(...))]` 属性允许我们指定预期代码会生成异常。\n\
    \n我们很快就会看到这些内容的示例。\n\n# 使用 C# 敏捷编程面向对象编程\n\n## 10.9 断言示例\n\n在设置测试用例时，我们进行进行断言。断言是一个语句，如果代码运行正常，则该陈言应为真。断言的示例包括……\n\
    \n- Assert.AreEqual(...)\n- Assert.AreNotEqual(...)\n- Assert.Fail(...)\n- Assert.IsTrue(...)\n\
    - Assert.IsFalse(...)\n\n正如我们在这里看到的，`Assert.AreEqual()` 和 `Assert.Fail()` 对于许多测试目的来说足够了。\n\
    \n`Assert.Fail()` 表示到达这一行意味着测试失败了！虽然我们说测试失败了，但从严格来说这不是真的。失败的不是测试，而是我们的代码失败了。测试成功地发现了我们代码中的错误。\n\
    \n![](img/e143b38d00f95425fa4f3efca0527189_191_0.png)\n\n在爱立信（Ericsson），我们深信，我们每天所做的创新可以为人类、业务和社会创造一个更好的世界产生深远影响。加入我们吧。\n\
    \n在德国，我们特别寻找作为集成工程师的毕业生，负责：\n- 无线接入和 IP 网络\n- IMS 和 IPT\n\n我们期待收到您的申请！欲申请并查看所有当前的招聘职位，请访问我们的网页：www.ericsson.com/careers\n\
    \n## 10.10 若干测试示例\n\n为了说明测试框架，我们将创建几个测试用例来测试如下所示的 `BankManagement` 系统的功能：\n\n\
    ![](img/e143b38d00f95425fa4f3efca0527189_192_0.png)\n\n在该系统中，`BankManager` 类维护了一本客户簿（BofC）。可以通过\
    \ `AddClient()` 方法添加客户对象，该方法需要该客户的 ID 和要添加的客户对象。可以通过 `GetClient()` 方法检索客户，该方法需要\
    \ `ClientID` 作为参数，并返回客户对象（如果存在）或生成异常（如果不存在指定 ID 的客户）。\n\n`Client` 类有一个构造函数，需要客户名称和客户余额。\n\
    \n为了简单起见，我们假设银行的每个客户只有一个账户（这显然不是一个现实的系统），而且我们不需要账号，因为每个客户都有一个唯一的 ID。\n\n我们将专门测试以下能力……\n\
    \n- 向 `BookOfClients` 中添加一个客户 \n- 尝试查找一个不存在的客户\n- 通过调用 `AddMoney()` 方法增加客户的余额。\n\
    \n当然，这只是为了彻底演示系统中所有类和所有方法运行所需的测试用例的一小部分。\n\n## 测试客户\n\n为了测试是否可以添加客户，我们需要：\n\n\
    - 1) 通过创建一个新的空 `BookOfClients` 来设置测试\n- 2) 创建一个客户并将其添加到 `BookOfClients`\n- 3)\
    \ 通过尝试检索刚刚添加的客户来检查客户是否已成功添加（本课程应该可以运行），并且最后\n- 4) 我们需要测试检索到的客户是否与我们添加的客户具有相同的属性——确保确保在过程中没有被损坏。\n\
    \n首先，我们通过创建一个新的空 `BookOfClients` 对象 (BofC) 来初始化测试，并在结束时将其设置为 `null` 以清理测试。代码如下所示：\n\
    \n```csharp\n[TestInitialize]\npublic void TestInitialize() {\n    BofC = new\
    \ BookOfClients();\n}\n\n[TestCleanup]\npublic void TestCleanup() {\n    BofC\
    \ = null;\n}\n```\n\n接下来，我们通过向空的 `BofC` 添加客户来创建我们的第一个测试。如果系统生成了异常，我们就知道代码有问题。查看该测试代码：\n\
    \n```csharp\n[TestMethod]\npublic void AddClient_TestNewClient_ExceptionNotGenerated()\
    \ {\n    Client c = new Client(\"Simon\", \"Room 1234\", 200, 10);\n    try {\n\
    \        Bof.AddClient(c);\n    } catch (Exception) {\n        Assert.Fail(\"\
    新客户不应抛出异常\");\n    }\n}\n```\n\n如果上面的测试通过，我们知道代码没有生成异常，但并没有证明客户已添加。我们需要创建其他测试来显示我们可以检索刚刚添加的客户，并需要一个测试来显示在添加客户时属性没有被损坏。在我们确认该方法实际上可以工作之前，需要多个测试！\n\
    \n注意上面的测试名称通过对执行测试的描述和预期输出描述指示了被测试的方法。这种长测试名称是非常重要的。通过阅读长测试名称列表，我们可以确定系统的哪些部分已经测试，哪些部分被遗漏了。\n\
    \n除了描述的测试之外，还应该尝试两次添加相同 ID 的客户。我们的系统当然不允许这种情况发生。如果代码阻止了两次添加，则测试成功。\n\n相反，如果在第二次添加相同客户时系统没有生成异常，则测试应该指示代码失败。该测试给如下所示：\n\
    \n```csharp\n[TestMethod]\npublic void AddClient_TestExistingClient() {\n    Client\
    \ c = new Client(\"Simon\", \"Room 1234\", 200, 10);\n    try {\n        Bof.AddClient(c);\n\
    \        Bof.AddClient(c);\n        Assert.Fail(\"如果添加两次，应抛出 ClientExists 异常\"\
    );\n    } catch (ClientExistsException) {\n    }\n}\n```\n\n编写上述测试的另一种方法是指定预期由\
    \ `[ExpectedException(...)]` 属性生成的异常。如果生成此异常中断了测试，则测试通过了。查看下方测试代码的另一种版本……\n\n\
    ```csharp\n[TestMethod]\n[ExpectedException(typeof(ClientExistsException))]\n\
    public void AddClient_TestExistingClient() {\n    Client c = new Client(\"Simon\"\
    , \"Room 1234\", 200, 10);\n    Bof.AddClient(c);\n    Bof.AddClient(c);\n}\n\
    ```\n\n"
