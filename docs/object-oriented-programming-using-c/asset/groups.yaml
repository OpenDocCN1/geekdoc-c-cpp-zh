  - '[PAGE 10]


    # Foreword


    This book aims to instill the reader with an understanding of the Object Oriented
    approach to programming and aims to develop some practical skills along the way.
    These practical skills will be developed by small exercises that the reader will
    be invited to undertake and the feedback that will be provided.


    The concepts that will be explained and skills developed are in common among programmers
    using many modern object oriented languages and are thus transferable from one
    language to another. However for practical purposes these concepts are explored
    and demonstrated using the C# (pronounced C sharp) language.


    While the C# programming language is used to highlight and demonstrate the application
    of fundamental object oriented principles and modelling techniques this book is
    not an introduction to C# programming. The reader will be expected to have an
    understanding of basic programming concepts and their implementation in C# (inc.
    the use of loops, selection statements, performing calculations, arrays, data
    types and a basic understanding of file handling.


    This text is designed not as a theoretical textbook but as a learning tool to
    aid in understanding theoretical concepts and learning the practical skills required
    to implement these. To this end each chapter will incorporate small exercises
    with solutions and feedback provided.


    At the end of the book one larger case study will be described – this will be
    used to illustrate the application of the techniques explored in the earlier chapters.
    This case study will culminate in the development of a complete C# program that
    can be downloaded with this book.'
