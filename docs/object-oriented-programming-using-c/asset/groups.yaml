    Test cases follow a similar anatomy, no matter testing framework is used, referred
    to as the arrange-act-assert cycle. Firstly we ''arrange'' the test by setting
    up appropriate data. Then we ''act'' i.e. we run the test. Finally we ''assert''
    what the expected output should be. The computer compares the actual output against
    the expected output. If there is a difference then the test indicates that the
    code is faulty.


    Tools and frameworks are available to automate the unit testing process. Using
    such a tool generally a little more effort than running tests once manually and
    significant benefits arise from the ability to re-run the tests as often as desired
    by pushing a button.


    This is a great aid to the ''regression testing'' which must be undertaken whenever
    previously tested code is modified.


    Regression testing was developed before agile methods were proposed and automated
    unit testing supports. However automated unit testing also supports Test Driven
    Development processes and they play a major role in agile software development
    methods.


    We will explore the Test Driven processes within this chapter before doing so
    we will first explore conventional regression testing and the support offered
    for via the unit testing framework within Visual Studio Professional edition.
    While this support is not available in the Express edition other tools do support
    unit testing..., though the mechanics will be different from those described here
    the principles will be the same.


