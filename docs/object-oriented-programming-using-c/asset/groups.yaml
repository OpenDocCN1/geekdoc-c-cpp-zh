    # Object Oriented Programming using C#


    # The Unified Modelling Language (UML)


    # Package Naming


    By convention, package names are normally in lowercase. We will follow this convention
    as well as it helps to distinguish between packages and classes.


    For individual projects packages could be named according to personal preference,
    e.g.


    +   - mysystem

    - mysystem.interface

    - mysystem.engine

    - mysystem.database


    However, packages are often distributed and to enable these packages need globally
    unique names, thus a naming convention has been adopted based on URLs


    ![](img/e143b38d00f95425fa4f3efca0527189_51_0.png)


    Part based on organisation URL (e.g. www.ebay.co.uk) reversed, though this does
    not specifically imply you can download the code there.


    Part distinguishing the particular project and component or subsystem which this
    package contains.


    Note on a package diagram each element is not separated by a " but by ":".


