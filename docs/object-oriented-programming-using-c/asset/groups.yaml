  - '[PAGE 176]


    # 9 Creating And Using Exceptions


    Introduction


    If the reader has written C# programs that make use of the file handling facilities
    they will have probably written code to catch exceptions i.e. they will have used
    try/catch blocks. This chapter explains the importance of creating your own exceptions
    and shows how to do this by extending the Exception Class and using the “Throw”
    mechanism.


    Objectives


    By the end of this chapter you will be able to....


    +   - Appreciate the importance of exceptions

    - Understand how to create your own exceptions and

    - Understand how to throw these exceptions.


    This chapter consists of six sections :-


    +   1) Understanding the Importance of Exceptions

    2) Kinds of Exception

    3) Extending the ApplicationException Class

    4) Throwing Exceptions

    5) Catching Exceptions

    6) Summary


    # 9.1 Understanding the Importance of Exceptions


    Exception handling is a critical part of writing C# programs. The authors of the
    file handling classes within the C# language knew this and created routines that
    made use of C# exception handling facilities – but are these really important?
    and do these facilities matter to programmers who write their own applications
    using C#?'
  - "[PAGE 177]\n\n# Object Oriented Programming using C#\n\n# Creating And Using\
    \ Exceptions\n\n# Activity 1\n\nImagine part of a banking program made up of three\
    \ classes, and three methods as shown below....\n\nThe system shown above is driven\
    \ by the BankManager class. The AwardLoan() method is invoked, either via the\
    \ interface or from another method. This method is intended to accept or reject\
    \ a loan application.\n\nThe BookOfClients class maintains a set of account holders...people\
    \ are added to or they may be created. However the only method of interest to\
    \ us is the GetClient() method. This method requires a string parameter (a client\
    \ ID) and returns a client object (if the client has an account at bank) – returns\
    \ NULL (if the client does not exist).\n\nThe Client class has one method of interest\
    \ DetermineCreditRating(). This method is invoked to invoke a clients credit rating\
    \ – this is used by the BankManager class to decide if a loan should be approved\
    \ or not.\n\nConsidering the scenario above at the snippet of code below ...\n\
    \n```\nClient c = listOfClients.GetClient(clientID) \nc.DetermineCreditRating();\n\
    ```\n\nThis fragment of code would exist in the AwardLoan() method. Firstly it\
    \ would invoke the GetClient() method, passing a client ID as a parameter. This\
    \ method would return the appropriate client object (assuming of course that a\
    \ client with this ID exists) which is stored in a local variable 'c'. Having\
    \ obtained a client the DetermineCreditRating() method would be invoked on this\
    \ client.\n\nAt these two lines of code. Can you identify any potential problems\
    \ with them?\n\n# Feedback 1\n\nIf a client with the specified ID exists this\
    \ code above will work. However if a client does not exist with the specified\
    \ ID GetClient() method would return NULL.\n\nThe second line of code would cause\
    \ a run error (specifically a NullReferenceException) as it tries to invoke the\
    \ DetermineCreditRating() method on a non existent client and the program would\
    \ crash at this point.\n\n# Activity 2\n\nConsider the following amendment to\
    \ this code and decide if would fix this problem.\n\n```\nClient c = listOfClients.GetClient(pClientID)\
    \ \nIf (c !=NULL) {\n  c.DetermineCreditRating();\n}\n```"
  - '[PAGE 178]


    # Object Oriented Programming using C#


    # Creating And Using Exceptions


    | Feedback 2 |

    | If the code was amended to allow for the possible NULL value returned it would
    work – however this protection is insecure as it relies on the programmer to spot
    this potential critical error. |


    When writing the GetClient() method the author was fully aware that a client may
    not be found and in this case decided to return a NULL value. However this relies
    on every programmer who ever uses this method to recognise and protect against
    this eventuality.


    If any programmer using this method failed to protect against a NULL return then
    their program could crash – potentially in this case losing the bank sums of money.
    Of course in other applications, such as an aircraft control system, a program
    crash could have life-threatening results.


    A more secure programming method is required to ensure that that a potential crash
    situation is always dealt!


    Such a mechanism exists - it is a mechanism called ‘exceptions’.


    By using this mechanism we can trap any potential errors in our code – preventing
    and managing crash situations.


    ![](img/e143b38d00f95425fa4f3efca0527189_178_0.png)'
  - '[PAGE 179]


    # Object Oriented Programming using C#


    # Creating And Using Exceptions


    In the situation above we could write code that would catch NullReferenceExceptions
    and decide how our program should respond to. Of course we may not know specifically
    what generated the NullReferenceException so we may know how our program should
    respond but could at least shut down our program in a neat tidy way, explaining
    to the user are we do this because of the error generated. This would be far better
    than allowing our program to crash without explanation.


    In the example above we could be much cleverer still. The GetClient() method could
    be written in such a way that it generates new type of exception ''UnknownClient''
    exception. We could catch this specific exception and knowing exactly what the
    problem we could define a much better response.... In this case we could explain
    that no client exists for the specific ID, we could then ask the user to re-enter
    their client ID and the program could continue.


    # 9.2 Kinds of Exception


    In order to generate meaningful exceptions we need to extend the Exception base
    class built into the .NET framework.


    The Exception class has already been extended to create a SystemException class
    and an ApplicationException class.


    The SystemException class is used to generate exceptions within the .NET framework
    such as NullReferenceException.


    We should use the ApplicationException class when generating exceptions within
    our application such as UnknownClientException.


    Subclasses ofApplicationException are used to catch and deal with potential problems
    when running our applications. To do this we must 1) create appropriate sub classes
    of ApplicationException 2) generate exception objects using a `throw` clause when
    appropriate and 3) deal with these exceptions using a `try/catch` block.


    # 9.3 Extending the ApplicationException Class


    When using our methods we should look for potential failure situations (e.g. value
    that cannot be returned, errors that may occur in calculation etc). When a potential
    error occurs we should generate an ''ApplicationException'' object i.e. of an
    ObjectException class. However it is important to first define a subclass of the
    ApplicationException class i.e. to create a specialised class and throw an of
    this subtype.


    A new exception is just like any new class in this it is a subclass of ApplicationException.


    In the case above an error could occur if no client is found with a specific ID.
    Therefore we could create a new exception called ''UnknownClientException''.


    There are several overloaded constructors for the ApplicationException class.
    One of these requires a String and it uses this to initialize a new instance of
    the ApplicationException class with a specified error message.


    Exception classes have a ''Message'' property we can make use of.'
