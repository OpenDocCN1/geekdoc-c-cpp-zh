    8) Summary


    # 8.1 Tools for Writing C# Programs


    Whatever method of execution is employed (see 1.7), programmers can work with
    a variety of tools to create source code. It is possible to write C# programs
    using simple discrete tools such as a plain text editor (e.g. Notepad) and a separate
    compiler invoked manually as required. However virtually all programmers would
    use a powerful Integrated Development Environment (IDE) which uses compilers and
    other standard tools behind a seamless interface.


    Even more sophisticated Computer Aided Software Engineering (CASE) tools exist
    which integrate the implementation process with other phases of the software development
    lifecycle. CASE tools could take UML class diagrams, generated as part of the
    software analysis and design phase, and generate classes and method stubs automatically
    saving some of the effort to write the C# code (ie is the implementation phase).


    CASE tools could also help by automating the software testing phase.'
