  - "[PAGE 180]\n\n# Object Oriented Programming using C#\n\nWe could create a subclass\
    \ called UnknownClientException and override this constructor. When we create\
    \ an object of this class we can use this string to give details of the problem\
    \ that caused the exception to be generated. This string will be stored and accessed\
    \ via the Message property.\n\nThe code to create this new class is given below...\n\
    \n```\npublic class UnknownClientException :ApplicationException\n{\n    public\
    \ UnknownClientException(String message)\n        base(message)\n    \n}\n```\n\
    \nIn some respects this looks rather odd. We are creating a subclass of ApplicationException\
    \ but our subclass does not contain any methods - nor does it extend any existing\
    \ methods. Its functionality is identical to the superclass - however it is a\
    \ subtype with a meaningful and descriptive name.\n\nIf subclasses of ApplicationException\
    \ did not exist we would only be able to catch the most general type of exception\
    \ i.e an ApplicationException object. Thus we only be able to write a catch block\
    \ that would catch every single type of exception generated by our system.\n\n\
    Having a subclass instead we have a choice... a) we could define a catch block\
    \ to catch objects of the most general type ‘Exception’ i.e. it would catch ALL\
    \ exceptions or b) we could define a catch block that would catch ALL application\
    \ generated exceptions or c) we can be more specific and catch only UnknownClientExceptions\
    \ and other types of exception.\n\nLooking online at the MSDN library we can see\
    \ that many predefined subclasses of SystemException already exist. There are\
    \ many of these including :-\n\n+   - ArithmeticException\n  - DivideideByZeroException\n\
    \  - OverflowException\n- IOException\n  - DriveNotFoundException\n  - FileLoadException\n\
    \  - FileNotFoundException\n  - PathTooLongException\n\n+   - InvalidCastException\n\
    - InvalidDataException\n- InvalidOperationException"
