  md: "\n# Object Oriented Programming using C#\n\n# Object Roles and the Importance\
    \ of Polymorphism\n\nAn interface is a sort of contract. The SaleableItem interface\
    \ says “I undertake to provide, at least, methods with these signatures:\n\n```csharp\n\
    public void SellCopy ();\npublic double Price ();\n```\n\nthough I might include\
    \ other things as well\n\nWhere than class implements an interface it provides\
    \ a guaranteed area of commonality which polymorphism can exploit.\n\nThink of\
    \ a car and a driving game in an arcade. They certainly are not related by any\
    \ “is a” relationship – they are entirely different kinds of things, a vehicle,\
    \ the other an arcade game. But both implement what we could call a “SteeringWheel\
    \ interface” which we can use in exactly the same way, even though the implementation\
    \ (mechanical linkage in the car, video electronics in the game) are very different.\n\
    \n![](img/e143b38d00f95425fa4f3efca0527189_99_0.png)\n\nHere at Ericsson we have\
    \ a deep-rooted belief that the innovations we make on a daily basis can have\
    \ a profound effect on making the world a better place for people, business and\
    \ society. Join us.\n\nIn Germany we are especially looking for graduates as Integration\
    \ Engineers for:\n\n- Radio Access and IP Networks\n- IMS and IPX\n\nWe are looking\
    \ forward to getting your application!\nTo apply and for all current job openings\
    \ visit our web page: www.ericsson.com/careers\n\n# Object Oriented Programming\
    \ using C#\n\n# Object Roles and the Importance of Polymorphism\n\nWe now need\
    \ to state that both Publication (and all its subclasses) and Ticket offer the\
    \ operations defined by the interface:\n\n```csharp\npublic abstract class Publication\
    \ : ISaleableItem\n{\n    ...class details...\n}\n```\n\n```csharp\npublic class\
    \ Ticket : ISaleableItem\n{\n    ...class details...\n}\n```\n\nIn C# the same\
    \ symbol ':' is used when we define a subclass that extends a superclass or when\
    \ we create a class that implements an interface.\n\nContrast implementing an\
    \ interface with extending a superclass.\n\n- When we extend a superclass the\
    \ subclass inherits of both interface and implementation from the superclass.\n\
    - When we implement an interface we give a guarantee that the operations specified\
    \ by an interface will be provided – this is to allow polymorphic handling of\
    \ all classes which implement a given interface.\n\n# The Polymorphic CashTill\n\
    \nThe CashTill already employs polymorphism: the SellItem() method accepts a parameter\
    \ of type Publication which allows any of its subclasses to be passed:\n\n```csharp\n\
    public void SellItem(Publication pPub)\n```\n\nWe now want to broaden this by\
    \ accepting anything which implements the SaleableItem interface:\n\n```csharp\n\
    public void SellItem(ISaleableItem pSI)\n```\n\nWhen the type of a variable or\
    \ parameter is defined as an interface, this works just like a superclass type.\
    \ Any class which implements the interface is acceptable for assignment to the\
    \ variable/parameter because the interface is a **type** and all classes implementing\
    \ it are subtypes of that type.\n\n# Object Oriented Programming using C#\n\n\
    # Object Roles and the Importance of Polymorphism\n\nThis is now shown below....\n\
    \n![](img/e143b38d00f95425fa4f3efca0527189_101_0.png)\n\nCashTill is no longer\
    \ directly dependent on class Publication – instead it is dependent on the interface\
    \ ISaleableItem.\n\nNote we can start the interface name with an I to indicate\
    \ that this is an interface not a class.\n\nThe relationships from Publication\
    \ and Ticket to ISaleableItem are like inheritance arrows except that the lines\
    \ are **dotted** – this shows that each class **implements** the interface.\n\n\
    A class in C# may only inherit from one superclass but can implement as many interfaces\
    \ as desirable. The format for this is :-\n\n```csharp\nclass MyClass : MySuperClass,\
    \ IMYInterface, IMYSecondInterface\n```\n\n# 4.6 Extensibility Again\n\nPolymorphism\
    \ allows objects to be handled without regard for their precise class. This can\
    \ assist in making systems extensible without compromising the encapsulation of\
    \ the existing design.\n\nFor example, we could create new classes for products\
    \ or services and so long as they implement the ISaleable interface the CashTill\
    \ will be able to process them **without a single change to its code**!\n\nAn\
    \ example could be ‘Sweets’. We could define a class named Sweets to represent\
    \ sweets in a jar. We can define the price of the sweets depending on the weight\
    \ and sell the sweets by subtracting this weight from our total stock. This is\
    \ not like selling a Publication, where we always subtract 1 from the stock. Nor\
    \ is this like selling tickets, where we would just print them.\n\nDownload free\
    \ ebooks from bookhoon.com\n\n# Object Oriented Programming using C#\n\n# Object\
    \ Roles and the Importance of Polymorphism\n\nIf we create a class 'Sweets' that\
    \ implements the ISaleable interface our enhanced polymorphic cash till can sell\
    \ them because it is a saleable item.\n\nIn this case, without polymorphism we\
    \ would need to add an additional 'sale' method to CashTill to handle Tickets,\
    \ Tickets and further new methods for every type of product to be sold. By defining\
    \ the ISaleable interface we can introduce additional products without affecting\
    \ CashTill at all. Polymorphism makes it easy to extend our programs and this\
    \ is very important as it saves effort, time and money.\n\nInterfaces allow software\
