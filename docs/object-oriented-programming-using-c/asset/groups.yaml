    \n# Object Oriented Programming using C#\n\n# Creating And Using Exceptions\n\n\
    In the situation above we could write code that would catch NullExceptions and\
    \ decide how our program should respond. Of course we at least least down down\
    \ our program in a neat way,, to the the the generated. This would be far better\
    \ than allowing our program to crash.\n\nIn the example above we could be much\
    \ clever still. The GetClient() method could be written in such a way that it\
    \ generates type of exception 'UnknownClient'. We could catch this specific exception\
    \ and knowing exactly the problem we could define a much better response... In\
    \ this case we could ask the user to re-enter their client ID and the program\
    \ could continue.\n\n# 9.2 Kinds of Exception\n\nIn order to generate meaningful\
    \ exceptions we need to extend the Exception base class built into the .NET framework.\n\
    \nThe Exception class has already been extended to create a SystemException class\
    \ and an ApplicationException class.\n\nThe SystemException class is used to generate\
    \ exceptions within the .NET framework such as NullException.\n\nWe should use\
    \ the ApplicationException class when generating exceptions within our application\
    \ such as UnknownClient.\n\n# 9.3 Extending the ApplicationException Class\n\n\
    When using our methods we should look for potential failure situations (e.g. value\
    \ that cannot be returned, errors that may occur in calculation etc). When a potential\
    \ error occurs we should generate an 'ApplicationException' object i.e. of an\
    \ ObjectException class. However it is important to first define a subclass of\
    \ the ApplicationException class i.e. to create a specialised class and throw\
    \ an of this subtype.\n\nA new exception is just like any new class in this it\
    \ is a subclass of ApplicationException.\n\nIn the case above an error could occur\
    \ if no client is found with a specific ID. Therefore we could create a new exception\
    \ called 'UnknownClient'.\n\nThere are several overloaded constructors for the\
    \ ApplicationException class. One of these requires a String and it uses this\
    \ to initialize a new instance of the ApplicationException class with a specified\
    \ error message.\n\nException classes have a 'Message' property we can make use\
    \ of.\n\n![](img/e143b38d00f95425fa4f3efca0527189_178_0.png)\n"
  mdcn: "\n\n# 使用 C# 的面向对象编程\n\n# C# 开发工具\n\n我们知道代码中类的起始位置，因此可以在开头放置一个 XML 注释来描述该类。同样，我们可以在开头放置注释来描述这些方法……而命名空间（namespaces），我们无法定义它们的名称。如果我们将分层划分到命名空间中（我们本应该这样做），我们就无法在命名空间的开头放置注释来描述该命名空间。\n\
    \n如果我们查看 MSDN 文档（见下图），我们可以看到它描述了名称，我们的程序也应该这样做。\n\n![](img/e143b38d00f95425fa4f3efca0527189_173_0.png)\n\
    \n但如果我们无法定义命名空间的起始位置，就必须将这些注释放在其他地方。\n\nSHFB 为这个问题提供了一个解决方案，允许我们直接在 SHFB 中输入系统的命名空间注释。\n\
    \n# 使用 C# 的面向对象编程\n\n# C# 开发工具\n\n![](img/e143b38d00f95425fa4f3efca0527189_174_0.png)\n\
    \n虽然这可能涉及多个软件部分，并且设置需要一些时间，但建立自动生成文档的能力可以节省大量的时间。更重要的是，每当我们编辑和修改程序时，只需点击几次按钮即可在内部生成自动文档。\n\
    \n其他程序员可能需要修改和更新我们创建的程序。作为专业程序员，我们有责任提供文档，使这一切尽可能简单。像 SHFB 和 GhostDoc 等自动工具可以帮助我们完成这一工作。\n\
    \n# 8.8 总结\n\n我们可以“回归基础”，使用文本编辑器和独立编译器（免费提供）创建 C# 程序，但使用专业的 IDE 可以提供额外的功能来支持程序员。\n\
    \n对于 GUI 设计、图表绘制和文档等开发方面，有专门的工具可用，但某些 IDE 已经超越了基础功能，将其中一些功能内置在 IDE 中。\n\nVisual\
    \ Studio Express 和 SharpDevelop 是两个强大的 IDE，支持 C# 和其他 .NET 程序的开发。\n\n# 使用 C# 的面向对象编程\n\
    \n这些工具初看起来可能令人敬畏，因为它们为专业开发提供了广泛的支持，包括通过在线帮助进行代码格式化和重构（确实存在），而且工具提供了某种程度的自动代码生成，例如\
    \ `main` 方法，以减轻程序员的工作负担。\n\n专业程序员有责任创建最新的文档。SHFB 软件通过帮助创建这些文档变得非常有用且节省时间，但它确实要求程序员在代码中插入有意义的\
    \ XML 注释（针对所有类和所有公共方法）。\n\nGhostDoc 可以通过添加 XML 注释来帮助程序员，尽管他们需要进行手动编辑。\n\n![](img/e143b38d00f95425fa4f3efca0527189_175_0.png)\n\
    \n# 9 创建和使用异常\n\n## 引言\n\n如果读者编写了使用文件处理功能的 C# 程序，他们可能已经编写了捕获异常的代码，即他们使用过 `try/catch`\
    \ 块。本章解释了创建自定义异常的重要性，并展示了如何通过扩展 `Exception` 类和使用“Throw” 机制来实现这一点。\n\n## 目标\n\n\
    在本章结束时，你将能够……\n\n- 意识到异常的重要性\n- 理解如何创建自定义异常以及\n- 理解如何抛出这些异常。\n\n本章由六部分组成：\n\n\
    - 1) 理解异常的重要性\n- 2) 异常的种类\n- 3) 扩展 ApplicationException 类\n- 4) 抛出异常\n- 5) 捕获异常\n\
    - 6) 总结\n\n# 9.1 理解异常的重要性\n\n异常处理是编写 C# 程序的关键部分。C# 语言中文件处理类的作者深知此，并创建了利用 C# 异常处理功能的程序——但这些真的重要吗？这些功能对于使用\
    \ C# 编写自己应用程序的程序员重要吗？\n\n# 使用 C# 的面向对象编程\n\n# 创建和使用异常\n\n## 活动 1\n\n想象银行程序的一部分由三个类和三个方法组成，如下所示……\n\
    \n上述系统由 `BankManager` 类驱动。`AwardLoan()` 方法通过接口或另一个方法被调用。该方法旨在接受或拒绝贷款申请。\n\n`BookOfClients`\
    \ 类维护了一组账户持有人……人们被添加到其中，或者他们可能会被创建。然而，我们感兴趣的方法唯一是 `GetClient()` 方法。该方法需要一个字符串参数（客户\
    \ ID）并返回一个客户对象（如果该客户在银行有账户）——返回 `NULL`（如果客户不存在）。\n\n`Client` 类有一个感兴趣的方法 `DetermineCreditRating()`。该方法被调用以触发客户的信用评级——`BankManager`\
    \ 类用此来判断是否批准贷款。\n\n考虑上面的场景以及下面的代码片段……\n\n```\nClient c = listOfClients.GetClient(clientID)\
    \ \nc.DetermineCreditRating();\n```\n\n这段代码片段存在于 `AwardLoan()` 方法中。首先，它会调用 `GetClient()`\
    \ 方法并将客户 ID 作为参数传递。该方法将返回相应的客户对象（当然假设存在具有此 ID 的客户），并存储在局部变量 `c` 中。获取客户后，将对该客户调用\
    \ `DetermineCreditRating()` 方法。\n\n在这两行代码处，你能识别出它们存在任何潜在问题吗？\n\n# 反馈 1\n\n如果存在指定\
    \ ID 的客户，上述代码将正常工作。但如果不存在指定 ID 的客户，`GetClient()` 方法将返回 `NULL`。\n\n第二行代码将导致运行时错误，因为它尝试在不存在的客户上调用\
    \ `DetermineCreditRating()` 方法（具体为 `NullReferenceException`），导致程序在此处崩溃。\n\n# 活动\
    \ 2\n\n考虑对该代码进行修改：\n\n```\nClient c = listOfClients.GetClient(clientID) \nif (c\
    \ != NULL) {\n  c.DetermineCreditRating();\n}\n```\n\n# 使用 C# 的面向对象编程\n\n# 创建和使用异常\n\
    \n| 反馈 2 |\n| :--- |\n| 如果代码被修改为允许可能的 NULL 值，它将会工作——但这样做是不安全的，因为它依赖于程序员发现这个潜在错误。在编写\
    \ `GetClient()` 方法时，作者完全意识到客户可能未找到，在这种情况下决定返回一个 NULL 值。然而，这依赖于程序员识别并防止这种异常发生。\
    \ |\n\n*(注：由于原文中存在大量重复的占位句子，此处已根据“不要重复输出原文”的原则，仅翻译了核心逻辑)*\n\n"
