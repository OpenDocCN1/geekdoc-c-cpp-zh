    使用 C# 的面向对象编程


    重载


    活动 3

    继续查看 API 文档中的 `String` 类，寻找其他重载的方法。


    反馈 3

    有几个方法没有重载，但大多数方法都是重载的。这些包括 `Compare()`、`CompareTo()`、`Concat()`、`Join()`、`Split()`
    等许多方法。

    观察不同的 `Substring()` 方法可以发现，我们可以通过仅指定起始位置或者通过指定起始位置和长度来查找子字符串。

    当我们使用 `Substring()` 方法时，CLR 引擎将在运行时根据我们提供了一个参数还是两个参数，选择该方法的正确实现版本。


    ## 5.3 总结


    方法重载（Method overloading）是指可能存在多个本质上执行相同操作并具有相同名称的方法的概念。


    CLR 引擎通过查看参数列表来区分这些方法。如果两个或多个方法具有相同的名称，那么它们的参数列表必须不同。


    在运行时，每个方法调用（可能存在歧义）都是由 CLR 引擎通过查看传递的参数并将数据类型与类中定义方法签名进行匹配来解析的。


    通过重载构造函数和普通方法，我们为未来可能使用我们类的程序员提供了额外的灵活性。即使这些方法最初没有全部使用，提供这些方法也可以帮助程序更灵活地满足不断变化的用户需求。


    ## 6 面向对象的软件分析与设计


    引言


    本章将通过实际示例教授基础的分析和建模技能，引导读者理解如何从初步规范过渡到面向对象的架构。


    目标


    在本章结束时，你将能够....


    - 分析需求描述

    - 识别系统范围之外的项

    - 识别候选类、属性和方法

    - 记录结果：面向对象架构


    本章由十二部分组成：


    1) 需求分析

    2) 问题

    3) 列出名词和动词

    4) 识别系统范围之外的事

    5) 识别同义词

    6) 识别潜在类

    7) 识别潜在属性

    8) 识别潜在方法

    9) 识别共同特征

    10) 使用 CRC 卡完善我们的设计

    11) 详化类

    12) 总结


    ## 6.1 需求分析


    任何计算机程序的开发都从识别需求开始：


    - 专攻桥梁工程师工程师可能某些软件来创建设计的三维模型，以便人们在桥梁实际建成以前就能看到完工后的样子。


    - 经理可能需要一个软件来跟踪人员、他们被分配了哪些项目、拥有什么技能以及需要哪些技能。


    使用 C# 的面向对象编程


    # 面向对象的软件分析与设计


    我们如何从对软件的“需求”获得满足该需求的面向对象软件设计？


    一些软件工程师专攻需求分析任务，该任务是精确明确软件的具体要求。这通常通过迭代执行以下任务来完成：


    1) 访问系统的客户和潜在用户，以了解他们对所需系统的看法

    2) 记录这些对话的结果

    3) 识别所需系统的基本特征

    4) 产生初步设计（以及可能存在的系统原型）

    5) 与客户和潜在用户评估这些初始计划

    6) 重复上述步骤，直到演变成完成的设计。


    执行需求是一项经过分析的技能，在本任务的范围之外，但在这里我们将关注第三步及以上的步骤，即描述如何将其转换为潜在的 OO 设计。


    虽然我们希望开发设计技能，但经验是这项任务中的一个重要因素。如果我们希望软件运行良好且易于开发，产生简单而优雅的设计至关重要；从较弱的机制中识别优秀的设计并不简单，经验是一个关键因素。


