    # Feedback 3


    You presumably tell them the address, give them a basic list of rooms and facilities
    (e.g. number of bedrooms) and tell them how to get in (i.le which key would operate
    the front door and how to switch off the burglar alarm (if you have one).


    You would not tell them irrelevant details (such as the colour of the walls, seats
    etc) as this would overload them with useless information.


    Abstraction allows us to consider the important high level details of your home,
    e.g. the address, without becoming bogged down in detail.


    Activity 4 Consider your home and write down one item, such as a television, that
    you use on a daily basis (and briefly how you operate this item).


    Now how difficult it would be to describe the internal components of this item
    and give full technical details of how it works.


    # Feedback 4


    Describing how to operate a television is much easier than describing its internal
    components and explaining in detail exactly how it works. Most people do not even
    know all the components of the appliances they use or how they work – but this
    does not stop them from using appliances every day.


    You may not know the technical details such as how the lights are wired together
    and how they work internally but you can still switch the lights on and off in
    your home (and in any new building you enter).


    Encapsulation allows us to consider what a light switch does, and how we operate
    it, without needing to worry about the technical detail of how it actually works.


    Two other fundamental principles of Object Orientation are Generalization/specialization
    (which allows us to make use of inheritance) and polymorphism.


    Generalisation allows us to consider general categories of objects which have
    common properties and then define specialised sub classes that inherit the properties
    of the general categories.'
