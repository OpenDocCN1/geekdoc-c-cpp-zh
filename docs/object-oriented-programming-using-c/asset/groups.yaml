    \n## 聚合\n\n![](img/e143b38d00f95425fa4f3efca0527189_42_1.png)\n\n- 聚合表示类 B 对象“属于”类\
    \ A的情况\n- 意味着从 A 到 B 的引用\n- 虽然聚合意味着类 B 对象属于类 A 对象，但它也意味着类 B 对象保留独立于类 A 的存在性。一些设计人员认为，聚合和简单关联之间没有真正的区别\n\
    \n![](img/e143b38d00f95425fa4f3efca0527189_42_2.png)\n\n## 使用 C# 的面向对象编程\n\n##\
