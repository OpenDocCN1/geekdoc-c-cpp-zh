    \ 方法。\n\n我们需要执行的一个用例是测试：当我们尝试检索一个不存在的客户端时，是否会抛出异常。为了测试这一点，我们创建一个新的空 `BookOfClients`\
    \ 并尝试从中检索一个客户端——任何客户端！\n\n在这种情况下，我们希望系统生成一个未知客户端异常（unknown client exception）。由于我们通过创建一个空账本来初始化测试，除非我们先添加它们，否则我们无法检索任何客户端。\n\
    \n### 活动 1\n查看下面的代码，并判断在代码的哪一点我们可以断言测试显示我们的系统已失败（点 A、B、C 或 D）。\n\n```csharp\n\
    [TestMethod]\npublic void GetClient_TestGettingUnknownClient_ShouldGenerateException()\n\
    {\n    // point A\n    try {\n        // point B\n        BofC.GetClient(1);\n\
    \        // point C\n    }\n    catch (BankManager.UnknownClientException)\n{\n\
    \        // point D\n    }\n}\n```\n\n### 反馈 1\n在调用 ... 之前，我们无法确定 `GetClient()`\
    \ 方法是否失败，因此我们不能在此放置 `Assert.Fail`。在点 A 或 B 处失败。\n\n当我们调用此方法时，由于我们的客户端账本是空的，应该生成异常。`try`\
    \ 块应该在此处终止并启动 `catch` 块；如果代码到达点 D，则表示测试成功而非失败。然而，如果代码到达点 C，则表示预期的异常没有生成，因此我们可以在此点断言\
    \ `GetClient()` 方法已失败。\n\n此测试的完整代码如下....\n\n## 使用 C# 的面向对象编程\n## 敏捷编程\n\n```csharp\n\
    [TestMethod]\npublic void GetClient_TestGettingUnknownClient_ShouldGenerateException\
    \ () {\n    try {\n        BofC.GetClient(1);\n        Assert.Fail(\"UnknownClient\
