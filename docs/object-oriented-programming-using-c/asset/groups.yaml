    访问我们的网站 www.dtu.dk


    在 bookmoon.com 下载免费电子书


    ### 反馈 1


    你应该能够组织这些相关活动组，并为每组给出一个总结这些活动的标题。


    起床：


    - 起床

    - 穿衣服

    - 吃早餐


    去上班：


    - 把车从车库开出来

    - 走到车旁

    - 停好车


    工作：


    - 找出你的老板想让你做什么

    - 做老板想让你做的事

    - 向老板反馈今天的结果。


    通过对我们的指令列表进行结构化并考虑天的整体结构（起床、上班、工作），我们可以在不改变其他部分的情况下更改和改进其中一个部分。例如，我们可以改进你工作的指令……


    - 听当地交通和天气预报

    - 决定坐公交车还是开车

    - 如果开车，取车并开车上班

    - 否则步行到公交站并乘坐公交车


    而不必担心这可能对“起床”或“工作”产生任何潜在影响。以这种结构化的方式，计算机程序可以使每个部分更易理解，并让大型程序更易维护。


    面向对象范式建议，我们应该将计算机程序中的指令与其操作的数据进行建模，并将它们存储为组件。此的一个优点是我们获得了可重用的组件。


    ### 活动 2


    想象一个包含你朋友信息的个人地址通讯录


    - 姓名

    - 地址

    - 电话号码


    列出你可以用这个通讯录做的三件事。接下来，识别一个可能出于存储朋友列表以外的目的使用地址通讯录的人。


    在 bookmoon.com 下载免费电子书


    ### 反馈 2


    有了地址通讯录，我们可能想要执行以下操作——查找朋友的详情（即电话号码）、向地址通讯录添加地址，当然，还有删除地址。


    我们可以创建一个简单的软件组件来存储姓名列表以及我们对地址通讯录可以执行的操作（我添加地址、查找电话号码等）。


    通过创建一个用于存储和管理朋友地址的软件组件，我们可以将其重用到另一个软件系统中，即：它可以被业务经理用于查找客户的详情。它也可以成为图书馆系统的一部分，供管理员用于存储和检索用户详情。


    在在这种面向对象编程中，我们可以创建可重用的组件（在此例中为地址通讯录）。


    面向对象范式建立在并扩展了 20 世纪 70 年代结构化编程背后的思想。


    ## 1.3 为什么要使用面向对象范式？


