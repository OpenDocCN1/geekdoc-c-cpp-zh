  mdcn: "\n每当创建一个个人账户时，我们将其添加到账户列表中，并且还允许检索个人账户，以便账户持有人可以向其账户存款。\n\n我们将通过一个 `Main`\
    \ 方法来演示，该方法将运行一个固定程序：a) 添加几个账户，b) 显示这些账户以及 c) 获取账户、向该账户存钱并再次显示账户列表。\n\n我们会在 `Bank`\
    \ 类中一个访问器方法，以便 `Main` 方法可以访问账户列表并显示它们。在 C# 中，我们将使用公共属性来实现它。\n\n`Account` 类的代码所示，不需要解释。\n\
    \n```csharp\nclass Account\n{\n    private String name;\n    public String Name\n\
    \    {\n        get { return name; }\n    }\n\n    private String dateOfBirth;\n\
    \    public String DateOfBirth\n    {\n        get { return dateOfBirth; }\n \
    \   }\n\n    private int balance;\n\n    public Account(String name, String dob)\n\
    \    {\n        this.name = name;\n        this.dateOfBirth = dob;\n        balance\
    \ = 0;\n    }\n\n    public void DepositMoney(int increase)\n    {\n        balance\
    \ = balance + increase;\n    }\n\n    public override String ToString()\n    {\n\
    \        return \"Name: \" + name + \"\\nBalance: \" + balance;\n    }\n}\n```\n\
    \n## 面向对象编程 C# 泛型集合以及如何序列化它们\n\n`Bank` 类的代码如下，展示了使用集合类 ‘List’有多简单。\n\n```csharp\n\
    class Bank\n{\n    private List<Account> accounts;\n    public List<Account> Accounts\n\
    \    {\n        get { return accounts; }\n    }\n\n    public Bank()\n    {\n\
    \        accounts = new List<Account>();\n    }\n\n    public void AddAccount(Account\
    \ account)\n    {\n        accounts.Add(account);\n    }\n\n    public Account\
    \ GetAccount(String name, String dob)\n    {\n        Account FoundAccount = null;\n\
    \        foreach (Account a in accounts)\n        {\n            if (a.Name ==\
    \ name && (a.DateOfBirth == dob))\n            {\n                FoundAccount\
    \ = a;\n            }\n        }\n        return FoundAccount;\n    }\n}\n```\n\
    \n首先，构造函数创建了一个账户列表。对于任何列表，它都会自动调整大小，因此与数组不同，我们不需要担心空间不足。\n\n此外，当元素被移除时，剩余元素会移动，以删除空白区域。虽然在数组中这样做并不困难，但在我们使用\
    \ `Lists` 时，这是一个自动处理的过程。\n\n添加账户变成了一个调用 `Add()` 方法的易易任务。\n\n最后，检索单个个人账户非常简单，只需遍历列表直到找到我们正在寻找的账户即可。\n\
    \n注意，此列表管理一个复杂对象的集合，当从列表中检索出任何对象时，可以在该对象上调用与该对象相关的方法。\n\n可以通过以下 `Main` 方法来演示这一点。\n\
    \n## 使用 C# 的面向对象编程\n\n### 泛型集合以及如何序列化它们\n\n```csharp\nstatic void Main(string[]\
    \ args)\n{\n    Bank b = new Bank();\n    Account a;\n\n    a = new Account(\"\
    Alice\", \"06/12/1963\");\n    b.AddAccount(a);\n    a = new Account(\"Bert\"\
    , \"14/08/1990\");\n    b.AddAccount(a);\n    a = new Account(\"Claire\", \"1/1/2000\"\
    );\n    b.AddAccount(a);\n\n    // 显示账户\n    foreach (Account acc in b.Accounts)\n\
    \    {\n        Console.WriteLine(acc.ToString());\n    }\n\n    Account al =\
    \ b.GetAccount(\"Bert\", \"14/08/1990\");\n    al.DepositMoney(100);\n\n    //\
    \ 再次显示账户\n    foreach (Account acc in b.Accounts)\n    {\n        Console.WriteLine(acc.ToString());\n\
    \    }\n\n    Console.ReadLine();\n}\n```\n\n![](img/e143b38d00f95425fa4f3efca0527189_143_0.png)\n\
    \n你有改变世界的机会\n\n在爱立信（Ericsson），我们深信，我们每天所做的创新可以为为人们、企业和社会创造一个更美好的世界产生深远影响。加入我们吧。\n\
    \n- 在德国，我们特别寻找以下方向的毕业生集成工程师：\n- 无线接入网络和 IP 网络\n- IMS 和 IPT\n\n我们期待收到您的申请！如需申请并查看所有当前职位，请访问我们的网页：www.ericsson.com/careers\n\
    \n使用 C# 的面向对象编程\n\n上述代码执行了以下操作：\n\n- 首先调用 `Bank` 类的构造函数，该构造函数创建一个空的账户列表。\n- 创建了三个账户并将它们添加到\
    \ `Bank` 对象的列表中。\n- 然后显示账户列表。\n- 接着从列表中检索出一个个人银行账户并向该账户存款。\n- 最后再次显示账户列表。\n\n\
    运行此程序的输出所示所示\n\n![](img/e143b38d00f95425fa4f3efca0527189_144_0.png)\n\n## 7.9\
    \ 使用集合（Sets）的示例\n\n在上面的示例中，我们使用列表（list）来存储银行账户集合。这并不是明智的选择，因为它允许创建重复项，如果创建两个相同的账户，银行将会感到非常困惑（当钱存入应该添加的哪个账户时？）。\n\
    \n此外，列表按特定顺序存储对象——在这种情况下，是账户创建的顺序。但这种顺序是无关的，因为它无法帮助找到属于某个人的特定账户。\n\n核心问题仍然是——存储一个银行账户集合。\n\
    \n使用 C# 的面向对象编程\n\n泛型集合以及如何序列化它们\n\n| Bank | Account |\n| :--- | :--- |\n| | 1\
    \ accounts * | - name: String<br>-dateOfBirth:String<br>- balance int |\n| +AddAccount(account\
    \ : Account)<br>+GetAccount(name: String, DOB: String) | + Account(name: String)<br>+DepositMoney(increase\
    \ :int)<br>+ToString():String |\n\n然而，对于这种集合，更好的选择是将账户集合存储为“集合”（set），因为集合不允许创建重复项。\n\
    \n考虑一个银行账户集合：\n\n使用 C# 的面向对象编程\n\n### 泛型集合以及如何序列化它们\n\n在上面的示例中，我们使用列表（list）来存储银行账户集合。这并不是明智的选择，因为它允许创建重复项，如果创建两个相同的账户，银行将会感到非常困惑（当钱存入应该添加的哪个账户时？）。\n\
    \n此外，列表按特定顺序存储对象——在这种情况下，是账户创建的顺序。但这种顺序是无关的，因为它无法帮助找到属于某个人的特定账户。\n\n核心问题仍然是——存储一个银行账户集合。\n\
    \n使用 C# 的面向对象编程\n\n泛型集合以及如何序列化它们\n\n（注：原文后续存在大量重复段落，已按要求去重处理，仅保留核心逻辑与翻译）\n"
