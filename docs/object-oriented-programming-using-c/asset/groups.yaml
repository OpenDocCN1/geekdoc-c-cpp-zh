    - 3) Examples of Refactoring\n- 4) Support for Refactoring\n- 5) Unit Testing\n\
    - 6) Automated Unit Testing\n- 7) Regression Testing\n- 8) Unit Testing in Visual\
    \ Studio\n- 9) Examples of Assertions\n- 10) Several Test Examples\n- 11) Running\
    \ Tests\n- 12) Test Driven Development (TDD)\n- 13) TDD Cycles\n- 14) Claims for\
    \ TDD\n\n## 10.1 Agile Approaches\n\nTraditional development approaches emphasize\
    \ detailed advance planning and a linear progression through the software lifecycle.\
    \ 'Agile' development approaches emphasize flexible cyclic development with the\
    \ system evolving towards a solution code early, fix and improve it as you go\
    \ along.\n\nThis is a very hot topic in Software Engineering circles at the moment,\
    \ and as with all such developments it has its share of zealots and ideologies!\n\
    \nIs the waterfall cycle model really successful in enabling large, complex projects\
    \ to proceed from start to finish without ever looking back? Advocates of agile\
    \ practices contend that these best fit the reality of software development.\n\
    \nHowever agile programming requires tools that will enable software to change\
    \ and evolve. Two specific tools provided by modern IDEs that support agile programming\
    \ are refactoring and testing tools.\n\n## 10.2 Refactoring\n\nA key element of\
    \ 'agile' approaches is 'refactoring:' This technique accepts that some early\
    \ design and implementation decisions will turn out to be poor, or at least less\
    \ than ideal.\n\nRefactoring means changing a system to improve its design and\
    \ implementation quality without altering its functionality (in traditional development\
    \ such work was termed 'preventive maintenance').\n\nAlthough the idea of structurally\
    \ improving existing software is not new, the difference is as follows. In traditional\
    \ development it was seen as a remedial action taken when the software design\
    \ quality had degraded, usually as a result of phases of functional modification\
    \ and extension. In agile methodologies refactoring is regarded as a natural healthy\
    \ part of the development process.\n\n## 10.3 Examples of Refactoring\n\nDuring\
    \ the development process a programmer may realise that a variable within a program\
    \ has been badly named. However changing this is not a trivial task.\n\nChanging\
    \ a local variable will only require changes in one particular method – if a variable\
    \ with the same name exists in a different method this will not require changing.\n\
    \nThus implementing a seemingly trivial change requires an understanding of the\
    \ consequences of that change.\n\nOther complex changes may also be required.\
    \ These include:\n\n- Renaming an identifier everywhere it occurs\n- Moving a\
    \ method from one class to another\n- Splitting code from one method into a separate\
    \ method\n- Changing the parameter list of a method\n- Rearranging the position\
    \ of class members in an inheritance hierarchy\n\n## 10.4 Support for Refactoring\n\
    \nEven the simplest refactoring operation, e.g. renaming a class, method, or variable,\
    \ requires careful analysis to make sure all necessary changes are made consistently.\n\
    \nVisual Studio and many other IDEs provide sophisticated automatic support for\
    \ this activity.\n\nDon't confuse this with a simple text editor find/replace\
    \ – Visual Studio understands the C# syntax and works intelligently. e.g. if you\
    \ have local variables with the same name in two different methods and rename\
    \ one of them, Visual Studio knows that if the other is a different variable and\
    \ does not change it. However if you rename a public instance variable this may\
    \ require changes in other classes and even in other namespaces as methods from\
    \ these classes may access and use this variable.\n\nChanging methods to reorder\
    \ or remove parameters are also refactoring activities. Doing this will require\
    \ changes to be made wherever these methods are called throughout the system.\
    \ Visual Studio will automatically change the method calls as appropriate.\n\n\
    Visual Studio provides automated support for the creation of an Interface. To\
    \ do this it extracts from a class I.e. given a class it define an interface based\
