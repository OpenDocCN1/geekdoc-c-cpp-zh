    # Object Oriented Programming using C#


    # The Unified Modelling Language (UML)


    # Selection and Iteration


    The logic of a scenario often depends on selection (''if'') and iteration (loops).


    There is a notation (''interaction frames'') which allow ifs and loops to be represented
    in sequence diagrams however these tend to make the diagrams cluttered.


    Sequence diagrams are generally best used for illustrating particular cases, with
    the full refinement reserved for the implementation code.


    Fowler ("UML Distilled", 3rd Edn.) gives a brief treatment of these constructs.


    # 2.7 Summary


    UML is not a methodology but a precise diagramming notation.


    Class diagrams and package diagrams are good for describing the architecture of
    a system. Object diagrams describe the data within an allocation at one moment
    in time and sequence diagrams describe how a system works over a period of time.


    UML gives different meaning to different arrows one must be careful to use the
    notation properly as specified.


    With any UML diagram suppression is encouraged – thus the author of a diagram
    can suppress any details they wish in order to convey essential information to
    the reader.


