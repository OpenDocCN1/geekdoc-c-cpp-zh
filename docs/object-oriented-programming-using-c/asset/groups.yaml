    # 2 The Unified Modelling Language (UML)


    Introduction


    This chapter will introduce you to the roles of the Unified Modelling Language
    (UML) and explain the purpose of four of the most common diagrams (class diagrams,
    object diagrams, sequence diagrams and package diagrams). These diagrams are used
    extensively when describing software designs according to the object oriented
    programming approach. Throughout this book particular emphasis will be placed
    on class diagrams as these are the most used part of the UML notation.


    Objectives


    By the end of this chapter you will be able to....


    +   - Explain what UML is and explain the role of four of the most common diagrams,

    - Draw class diagrams, object diagrams, sequence diagrams and package diagrams.


    The material covered in this chapter will be expanded on later chapters of the
    book and the skills developed here will be used in later exercises (particularly
    regarding class diagrams).


    This chapter consists of six sections -


    +   - 1) An introduction to UML

    - 2) UML Class Diagrams

    - 3) UML Syntax

    - 4) UML Package Diagrams

    - 5) UML Object diagrams

    - 6) Sequence Diagrams


    # 2.1 An Introduction to UML


    The Unified Modelling Language, UML, is sometimes described as though it was a
    methodology. It is not!


    A methodology is a system of processes in order to achieve a particular outcome
    e.g. an organised sequence of activities in order to gather user requirements.
    UML does not describe the procedures a programmer should follow – hence it is
    not a methodology. It is, on the other hand, a precise diagram notation that will
    allow program designs to be represented and discussed. As it is graphical in nature
    it becomes easy to visualise, understand and discuss the information presented
    in the diagram. However, as the diagrams represent technical information they
    must be precise and clear – in order for them to work - there is a precise notation
    that must be followed.'
