  - '[PAGE 190]


    # Object Oriented Programming C# Agile Programming


    There is a naming convention that makes it easy to relate the tests to the code
    tested :-


    +   1) The project used to store the stores is named after the system being tested
    (e.g. for example a project storing tests for a bank system could be BankSystemTests)

    2) The test fixture is named using the name of the class being tested (e.g., assuming
    within the bank system there is a class called ''Client'' a test fixture would
    be called TestFixture_ClientTests).

    3) The tests are named using the method name tested the _test being applied the
    expected result (e.g. a method called AddMoney may have a test as...AddMoney_Add5Pounds_BalanceEquals10


    In Visual Studio following the menu Test _New Test _Basic will set up a test suite
    capable of C# code. Firstly the name of the test fixture will be requested and
    if a test project has not previously been set up a name for it will be requested.
    Individual tests each need to be named as they are added to the test fixture.


    Having created a test fixture we need to set up the tests and write the tests
    themselves. As part of this we need to specify the correct behaviour of the code
    being tested. We do this using Assert(...) methods which must be true for the
    test to pass.


    We also make use of attributes to provide essential information to Visual Studio
    so that it can run the tests....


    +   * [TestClass] attribute indicates that the test class will indeed act as a
    test fixture. Thus this attribute must be placed at the start of each test fixture.


    ```

    {TestClass}

    public class TestFixture_ClientTests

    {


    ```


    +   * The [TestInitialize] attribute declares a method that is run before every
    test case is executed.

    * Test cases are methods that must be preceded by the [TestMethod] attribute.

    * The [TestCleanup] attribute declares a method that is run after every test case
    is executed.

    * The [ExpectedException(typeof(...))] attribute allows us to specify that we
    are expecting the code to generate an exception.


    We will see examples of each of these shortly.'
  - '[PAGE 191]


    Object Oriented Programming using C#


    Agile Programming


    # 10.9 Examples of Assertions


    When setting up test cases we make assertions. An assertion is a statement which
    should be true if the code has functioned correctly. Example of assertion include
    ...


    +   - Assert.AreEqual(...)

    - Assert.AreNotEqual(...)

    - Assert.Fail(...)

    - Assert.IsTrue(...)

    - Assert.IsFalse(...)


    Assert.AreEqual() and Assert.Fail() will be adequate for many testing purposes,
    as we will see here.


    Assert.Fail() indicates that having reached this line means the test failed! While
    we say the test has failed this is not strictly true. It is not the test that
    failed but our code that failed. The test successfully found an error in our code.


