    # CashTill class


    Imagine we want to develop a class CashTill which processes a sequence of items
    being sold. Without polymorphism we would need separate methods for each type
    of item:


    +   * SellBook (Book pBook)

    * SellMagazine (Magazine pMagazine)

    * SellDiscMag (DiscMag pDiscMag)


    With polymorphism we need only


    +   * SellItem (Publication pPub)


    Every subclass is ''type-compatible'' with itssuperclass. Therefore any subclass
    object can be passed as a Publication parameter.


    This also has important implications for extensibility of systems. We can later
    introduce further subclasses of Publication and these will be acceptable by the
    SellItem() method of a CashTill object, even through these subtypes were unknown
    when the CashTill was implemented.


    # Polymorphism saves themselves!


    Without polymorphism we would need to check for each item ''p'' so we were calling
    the right method to sell a copy of each subtype


    ```

    if ''p'' is a Book call SellCopy() method for Book

    else if ''p'' is a Magazine call SellCopy() method for Magazine

    else if ''p'' is a DiscMag call SellCopy() method for DiscMag

    ```


    Instead we use C# to look at the object ''p'' at run time, to determine its ''type''
    and its own method for selling itself. Thus we can call:


    ```

    p.SellCopy()

    ```


    and if the object is a Book it will invoke the SellCopy() method for a Book. If
    ''p'' is a Magazine, again at runtime C# will determine this and invoke the SellCopy()
    method for a Magazine.


    Polymorphism often allows us to use conditional ''if'' statements – instead the
    ''decision'' is made implicitly according to which type of subclass object is
    actually present.


    # Implementing CashTill


    The code below shows how CashTill can be implemented to make use of Polymorphism.'
