    \ and placed on a rack to be repaired. Their existence isn't dependent on the\
    \ existence of a car with which they are associated. Some designers believe that\
    \ aggregation can be replaced as a simple association as when implementing this\
    \ design in a program makes no difference to the programmer.\n\n## Composition\n\
    \n![](img/e143b38d00f95425fa4f3efca0527189_43_1.png)\n\n- Composition is similar\
    \ to aggregation but implies a much stronger belonging relationship i.e. Object(s)\
    \ of Class B are ‘part’ of Class A object\n- Again implies reference from A to\
    \ B\n- Much ‘stronger’ than aggregation in this case Class B objects are an integral\
    \ part of Class A and in general objects of Class B never exist other than part\
    \ of Class A, i.e. they have the same ‘lifetime'\n\nAn example of composition\
    \ would be between Points, Lines and Shapes as elements of a Picture. These objects\
    \ can only exist as part of a picture, and if the picture is deleted they are\
    \ also deleted.\n\nAs well as denoting associations, class diagrams can denote\
    \ :-\n\n- Inheritance,\n- Interfaces,\n- Keywords and\n- Notes\n\nObject Oriented\
    \ Programming using C#\n\nThe Unified Modelling Language (UML)\n\n## Inheritance\n\
    \n![](img/e143b38d00f95425fa4f3efca0527189_44_0.png)\n\n- Aside from associations,\
    \ the other main modelling relationship is inheritance:\n- Class A ‘inherits’\
    \ both the interface and implementation of Class B, though it may override implementation\
    \ details and supplement both.\n\nWe will look at inheritance in detail in Chapter\
    \ 3.\n\n## Interfaces\n\n- Interfaces are similar to inheritance however with\
    \ interfaces only the interface is inherited. The methods defined by the interface\
    \ must be implemented in every class that implements the interface.\n- Interfaces\
    \ can be represented using the <<interface>> keyword:\n\n![](img/e143b38d00f95425fa4f3efca0527189_44_1.png)\n\
    \nThere is also a shorthand for this\n\n![](img/e143b38d00f95425fa4f3efca0527189_44_2.png)\n\
    \nIn both cases these examples denote that the SaleableItem interface is required\
    \ by CashTill and implemented by Publication.\n\nNB the dotted-line version of\
    \ the inheritance line/arrow which shows that Publication ‘implements’ or ‘realizes’\
    \ the SaleableItem interface.\n\n## Object Oriented Programming using C#\n\n##\
    \ The Unified Modelling Language (UML)\n\nThe “ball and socket” notation is new\
    \ in UML 2 – it is a good visual way of representing how interfaces connect classes\
    \ together.\n\nWe will look at the application of interfaces in more detail in\
    \ Chapter 4.\n\n## Keywords\n\nUML defines keywords to refine the meaning of the\
    \ graphical symbols We have seen <<interface>> and we will also use <<abstract>>\
    \ but there are more.\n\nAn abstract class may be denoted by italics rather than\
    \ the <<abstract>> keyword.\n\nA customer can have any number of bank accounts,\
    \ and a bank account can be held by one person or two people (“joint account”).\
    \ We suppressed the navigability of this relationship, perhaps because we have\
    \ not yet decided this issue.\n\n(The text regarding \"months of full-time\" and\
    \ \"london.edu\" appears to be corrupted/noise in the source OCR and has been\
    \ cleaned to maintain logical flow).\n\nObject Oriented Programming using C#\n\
    \nThe Unified Modelling Language (UML)\n\n## Notes\n\n![](img/e143b38d00f95425fa4f3efca0527189_46_0.png)\n\
    \nFinally we can add notes to comment on a diagram. This gives us a 'catch-all'\
    \ facility for adding information\n\n## Activity 4\n\nFrom your own experience,\
    \ try to develop a model which illustrates the following elements:\n\n- simple\
    \ association\n- bidirectional association\n- aggregation (tricky!)\n- composition\n\
    - multiplicity\n- generalization (inheritance)\n- interfaces\n- notes\n\nTo help\
    \ you get started some small examples are below:-\n"
