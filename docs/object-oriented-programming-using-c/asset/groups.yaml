    \n# 使用 C# 进行面向对象编程\n\n需要一个构造函数来分配一个新的 `Messages()`（存储的消息集合）。需要以下方法：\n\n```csharp\n\
    void AddMessage(Message msgToAdd)\nvoid display(DisplayBoardControl db)\n\nvoid\
