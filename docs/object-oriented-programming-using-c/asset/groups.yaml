    \ B 对象并“不知道”类 A 对象\n\n简单关联通常对应于类 A 中一个类型为目标类 B 的实例变量。\n\n示例：上面的 `Catalogue`（目录）需要访问\
    \ 0 个或多个 `ItemForSale`（待售商品），以便从目录中添加或删除商品。而 `ItemForSale` 不需要访问 `Catalogue` 即可设置其价格或执行与商品本身相关的其他方法。\n\
    \n## 双向关联\n\n![](img/e143b38d00f95425fa4f3efca0527189_41_1.png)\n\n- 双向关联是指类 A\
    \ 和 B 之间存在双向关联\n- 每一个类都引用另一个类\n- 导航性到 A 和 B 到 A：\n  - 类 A 对象可以访问与其关联的类 B 对象\n\
    \  - 类 B 对象“属于”类 A\n  - 意味着从 A 到 B 的引用\n  - 同样，类 B 对象也可以访问与其关联的类 A 对象\n\n双向关联是复杂的，因为每个对象都必须有指向另一个对象的引用，且双向关联通常比单向关联少得多。\n\
    \n双向关联的一个示例可以是“学位（Degree）”和“学生（Student）”之间。即：给定一个学位，我们可能想知道哪些学生正在读该学位。或者，从学生开始，我们可能想知道他们正在读的学位。\n\
