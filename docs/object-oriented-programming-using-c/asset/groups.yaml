    - 注释（Notes）\n\n使用 C# 的面向对象编程\n\n统一建模语言 (UML)\n\n## 继承\n\n![](img/e143b38d00f95425fa4f3efca0527189_44_0.png)\n\
    \n- 除了关联外，另一种主要的建模关系是继承：\n- 类 A “继承”了类 B 的接口和实现，尽管它可能会覆盖实现细节并补充这两者。\n\n我们将在第 3\
    \ 章中详细介绍继承。\n\n## 接口\n\n- 接口类似于继承，但使用接口时只继承接口部分。接口定义的方法必须在实现接口的每个类中被实现。\n- 接口可以使用\
