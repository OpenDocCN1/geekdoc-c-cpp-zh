    Object Oriented Programming using C#


    # 10.12 Test Driven Development (TDD)


    While very useful for regression testing automated unit testing also supports
    Test Driven Development (TDD) which is a technique mainly associated with ''agile''
    development processes. This has become a hot topic in software engineering


    The Test Driven Development approach is to


    +   1) Write the tests (before writing the methods being tested).

    2) Set up automated unit testing, which fails because the classes haven''t yet
    been written!

    3) Write the classes and methods so the tests pass


    This reversal seems strange at first, but many eminent contributors to software
    engineering debates believe it is a powerful ''paradigm shift''


    ![](img/e143b38d00f95425fa4f3efca0527189_199_0.png)


