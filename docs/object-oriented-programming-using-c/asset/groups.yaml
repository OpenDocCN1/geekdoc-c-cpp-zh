    # Object Oriented Programming using C#


    For our purposes there is only thing missing from the Express edition is the unit
    testing tools explained in section 10.5 and using 11.12. In all other respects
    it is a very powerful IDE and fully supports a student wanting to learn and develop
    C# programs.


    Visual Studio Express can be downloaded from the following website http://www.microsoft.com/express/Downloads/


    # 8.3 SharpDevelop


    Another very powerful and free tool that can be used to develop C# programs is
    SharpDevelop (or #develop). It is open-source so you can download both the sourcecode
    and executable executables.


    SharpDevelop includes support for .NET languages including C# 4.0 and VB.NET 10.
    It includes unit testing facilities (via optional plug ins), code completion facilities
    and powerful debugging facilities.


    To help debugging, SharpDevelop includes an Object graph visualiser (below). This
    visualiser displays a representation of your data structures that is dynamically
    updated when stepping through your code.


    ![](img/e143b38d00f95425fa4f3efca0527189_167_0.png)


    For more information on SharpDevelop or to download it go to http://community.sharpdevelop.net/forums/t/12513.aspx.


    It should be noted that other free tools include MonoDevelop (monodevelop.com/)
    an IDE which offers multiplatform support including Linux, Windows and Mac OSX.'
