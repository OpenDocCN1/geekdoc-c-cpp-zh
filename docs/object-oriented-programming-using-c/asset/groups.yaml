  - "[PAGE 148]\n\n# Object Oriented Programming using C#\n\nBy overriding Equals()\
    \ and GetHashCode() methods C# will prevent objects with duplicate data (in this\
    \ case duplicate name and dates of birth) from being added to the set.\n\nThe\
    \ full code for the class Account is given below.\n\n```\nclass Account\n{\n \
    \   private String name;\n    public String Name\n    {\n        get { return\
    \ name; }\n    }\n    private String dateOfBirth;\n    public String DateOfBirth\n\
    \    {\n        get { return dateOfBirth; }\n    }\n    private int balance;\n\
    \    public Account(String name, String dob)\n    {\n        this.name = name;\n\
    \        this.dateOfBirth = dob;\n        balance = 0;\n    }\n    public void\
    \ DepositMoney(int increase)\n    {\n        balance = balance + increase;\n \
    \   }\n    public override String ToString()\n    {\n        return \"Name: \"\
    \ + name + \"\\nBalance: \" + balance;\n    }\n    public override bool Equals(object\
    \ obj)\n    {\n        Account a = (Account)obj;\n        return (name==a.Name\
    \ && (dateOfBirth==a.DateOfBirth));\n    }\n    public override int GetHashCode()\n\
    \    {\n        return (name + dateOfBirth).GetHashCode();\n    }\n}\n```\n\n\
    The code above is identical to the previous version of the Account class (when\
    \ we used lists) except for the addition of the overridden methods Equals() and\
    \ GetHashCode(). When storing any object in a set we must override both of these\
    \ methods to prevent duplicates being stored."
