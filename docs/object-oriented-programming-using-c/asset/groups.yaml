  - '[PAGE 253]


    # 11.6 Conclusions


    The fundamental principles of the Object Orientated development paradigm are


    +   * abstraction

    * encapsulation

    * generalization/specialization (inheritance)

    * polymorphism


    These principles are ubiquitous throughout the C# language and the .NET APIs as
    well as providing a framework for our own software development projects.


    A well-established range of tools and reference support is available for OO development
    in C#, some of it allied to modern ''agile'' development approaches.


    Throughout this chapter you will happily seen how Object Orientation supports
    the programmer by :-


    +   * using abstraction and encapsulation enables us to focus on and program different
    parts of a complex system without worrying about ''the whole''.

    * using inheritance to ''factor out'' common code

    * using polymorphism to make programs easier to change

    * using automatic tools to help document and test large software projects.


    These principles have been exemplified using C# but the same principles and benefits
    apply to all OO programming languages and the facilities demonstrated here are
    available in many modern IDEs.


    Through reading this book, and doing the small exercises, you will happily have
    gained some understanding of these principles.


    If you want a further explanation of the C# language the following book is highly
    recommended...


    Pro C# 2010 and the .NET 4 Platform by Andrew Troelsen


    Finally I hope you have found this book helpful and I wish you all the best for
    the future.'
