    \ an output file is created\n- A binary formatter is created as this is used by\
    \ the serialization process.\n- With one the collection 'b' is serialized and\
    \ in doing so all account objects inside this collection are serialized (see code\
    \ below).\n\n```csharp\nbFormatter.Serialize(outFile, b);\n```\n\n- In order to\
    \ prove this has worked a new, empty Bank object is created 'b2'.\n- The de-serialization\
    \ process is invoked and the output cast into a Bank type. The results are then\
    \ stored in the object 'b2' (see code below).\n\n```csharp\nb2 = (Bank)bFormatter.Deserialize(inFile);\n\
    ```\n\nFinally the contents of 'b2' are displayed to show they are consistent\
    \ with the data originally created.\n\n![](img/e143b38d00f95425fa4f3efca0527189_163_0.png)\n\
    \nThe results of running this program are shown below.\n\n![](img/e143b38d00f95425fa4f3efca0527189_164_0.png)\n\
    \n## 7.12 Summary\n\nThe .NET Collections classes provide ready-made methods for\
    \ storing collections of objects. These almost completely make the use of arrays\
    \ redundant!\n\nThere are 'untyped' collections and 'typed' collections. Typed\
    \ collections, or generic collections, were developed upon the idea of generic\
    \ methods and generic classes. The use of generic collections are much more useful\
    \ than untyped collections and we have not shown the untyped collections here.\n\
    \nCollection classes include List, HashSet and Dictionary. Each of these define\
    \ appropriate methods, many of which are common across all of the collections.\n\
    \nSpecial attention is required when defining objects to be stored in Sets (or\
    \ as keys in Dictionaries) to define the meaning of ‘duplicate’. For we need to\
    \ override the Equals() and GetHashCode() methods inherited from Object.\n\nSerialization\
    \ is a very powerful mechanism that allows the contents of a collection and all\
    \ related objects to be stored with one simple command.\n\nA further example of\
    \ the use of collections will be provided in Chapter 11, a larger case study at\
    \ the end of this book. This will demonstrate the use of lists, sets and dictionaries\
    \ for a small but more realistic example application. The code for this will be\
    \ available to download and inspect if required.\n\n## 8 C# Development Tools\n\
    \n### Introduction\n\nThis chapter will introduce the reader to several development\
    \ tools that support the development of large scale C# systems. We will also consider\
    \ the importance of documentation and show tools can be used to generate documentation\
    \ for systems you create (almost automatically).\n\n### Objectives\n\nBy the end\
    \ of this chapter you will be able to....\n\n- Find details of several professional\
    \ and free interactive development environments\n- Understand the importance of\
    \ the software documentation tools and the value of embedding XML comments within\
    \ your code.\n- Write XML comments and generate automatic documentation for your\
    \ programs.\n\nThis chapter consists of eight sections :-\n\n- 1) Tools for Writing\
    \ C# Programs....\n- 2) Microsoft Visual Studio\n- 3) SharpDev\n- 4) Automatic\
    \ Documentation\n- 5) Sandcastle Help File Builder\n- 6) GhostDoc\n- 7) Adding\
    \ Namespace Comments\n- 8) Summary\n\n## 8.1 Tools for Writing C# Programs\n\n\
    Whatever method of execution is employed (see 1.7), programmers can work with\
    \ a variety of tools to create source code. It is possible to write C# programs\
    \ using simple discrete tools such as a plain text editor (e.g. Notepad) and a\
    \ separate compiler invoked manually as required. However virtually all programmers\
    \ would use a powerful Integrated Development Environment (IDE) which uses compilers\
    \ and other standard tools behind a seamless interface.\n\nEven more sophisticated\
    \ Computer Aided Software Engineering (CASE) tools exist which integrate the implementation\
    \ process with other phases of the software development lifecycle. CASE tools\
    \ could take UML class diagrams, generated as part of the software analysis and\
    \ design phase, and generate classes and method stubs automatically saving some\
    \ of the effort to write the C# code (ie is the implementation phase).\n\nCASE\
    \ tools could also help by automating the software testing phase.\n\nOvertime,\
    \ as more powerful tools are created, IDEs have begun to incorporate some of the\
    \ features previously found only in CASE tools i.e. they do much more programs\
    \ to be written, edited and compiled. One such tool is Microsoft Visual Studio.\n\
    \n## 8.2 Microsoft Visual Studio\n\nMoving to an 'industrial strength' IDE is\
    \ an important stepping stone in your progress as a software developer, riding\
    \ a bicycle without stabilisers for the first time. With some practice you will\
    \ soon find it lots of helpful and time-saving facilities that you will not want\
    \ to work without.\n\nMicrosoft Visual Studio is a powerful IDE platform that\
    \ supports the development of .NET programs written in a range of languages not\
    \ just C#.\n\nDetails of this can be found via http://www.microsoft.com/visualstudio/\n\
    \nVisual Studio comes in many varieties but perhaps the two most common varieties\
    \ are Visual Studio Professional edition and Visual Studio Express edition. The\
    \ professional used to create all of the code in this book and for the case study\
    \ application developed in Chapter 11. However the express edition is free and\
    \ still contains all of the features required to create and run the applications\
    \ in the book.\n\n![](img/e143b38d00f95425fa4f3efca0527189_166_0.png)\n"
  mdcn: "\n\n## 使用 C# 进行面向对象编程\n\n## 泛型集合以及如何对其序列化\n\n为了实现这一点，不需要对 `Account` 类或 `Bank`\
    \ 类进行任何更改，但我们告诉编译器这些类是可以被序列化的。\n\n为此，我们在每个类的前面放置 `serializable` 关键字，如下所示....\n\
    \n```csharp\n[Serializable]\nclass Account\n{\n    // 省略类体中的代码\n}\n[Serializable]\n\
    class Bank\n{\n    // 省略类体中的代码\n}\n```\n\n在我们将用于调用序列化/反序列化过程并测试结果的 `Main` 方法中，我们需要添加额外的\
    \ `using` 语句，因为我们用到了 .NET 框架的其他部分（见下文）。\n\n```csharp\nusing System.Runtime.Serialization.Formatters.Binary;\n\
    using System.Runtime.Serialization;\nusing System.IO;\n```\n\n下面提供了一个可以演示此运行效果的完整\
    \ `Main` 方法。大部分内容是自言自明的，或者包含了我们已经熟悉的代码。与序列化/反序列化相关的新部分将在之后进行解释。\n\n```csharp\n\
    static void Main(string[] args)\n{\n    Bank b = new Bank();\n    Account a;\n\
    \    int an = // 账号;\n\n    a = new Account(\"Bert\", \"06/12/1963\");\n    b.AddAccount(1,\
    \ a);\n    a = new Account(\"Alice\", \"14/08/1990\");\n    b.AddAccount(2, a);\n\
    \    a = new Account(\"Claire\", \"1/1/2000\");\n    b.AddAccount(3, a);\n\n \
    \   Console.WriteLine(\"Stored data:\");\n    foreach (KeyValuePair<int, Account>\
    \ kvp in b.Accounts)\n    {\n        int an = kvp.Key;\n        Account a = kvp.Value;\n\
    \        Console.WriteLine(\"Account number: \" + an + \"\\naccount details: \"\
    \ + a.ToString());\n    }\n\n    FileStream outputFile = new FileStream(\"AccountData\"\
    , FileMode.Create, FileAccess.Write);\n    BinaryFormatter bformatter = new BinaryFormatter();\n\
    \    bformatter.Serialize(outputFile, b);\n    outputFile.Close();\n    outputFile.Dispose();\n\
    \n    Bank b2 = new Bank();\n    FileStream inFile = new FileStream(\"AccountData\"\
    , FileMode.Open, FileAccess.Read);\n    b2 = (Bank)bformatter.Deserialize(inFile);\n\
    \    inFile.Close();\n    inFile.Dispose();\n\n    Console.WriteLine(\"Retrieved\
    \ data:\");\n    foreach (KeyValuePair<int, Account> kvp in b2.Accounts)\n   \
    \ {\n        int an = kvp.Key;\n        Account a = kvp.Value;\n        Console.WriteLine(\"\
    Account number: \" + an + \"\\naccount details: \" + a.ToString());\n    }\n\n\
    \    Console.ReadLine();\n}\n```\n\n上述代码执行了以下步骤：\n\n- 首先，创建了几个银行账户，将其添加到集合中并显示集合。\n\
    - 接下来创建了一个输出文件。\n- 创建了一个二进制格式化器（binary formatter），因为它会被序列化过程使用。\n- 对集合 'b' 进行序列化，在此过程中，集合内部所有的账户对象都被序列化了（见下文代码）。\n\
    \n```csharp\nbFormatter.Serialize(outFile, b);\n```\n\n- 为了证明此操作成功，创建了一个新的空的 `Bank`\
    \ 对象 'b2'。\n- 调用反序列化过程，并将输出强制转换为 `Bank` 类型。结果随后存储在对象 'b2' 中（见下文代码）。\n\n```csharp\n\
    b2 = (Bank)bFormatter.Deserialize(inFile);\n```\n\n最后，显示 'b2' 的内容，以证明它们与最初创建的数据一致。\n\
    \n![](img/e143b38d00f95425fa4f3efca0527189_163_0.png)\n\n运行此程序的运行如下所示。\n\n![](img/e143b38d00f95425fa4f3efca0527189_164_0.png)\n\
    \n## 7.12 总结\n\n.NET 集合类为存储对象集合提供了现成方法。这几乎完全让数组的使用变得多余了！\n\n存在“无类型”集合和“有类型”集合。有类型集合（或称泛型集合）是基于泛型方法和泛型类的概念开发出来的。泛型集合的使用比无类型集合有用得多，我们在这里没有展示无类型集合。\n\
    \n集合类包括 `List`、`HashSet` 和 `Dictionary`。这些每个类都定义了适当的方法，其中许多方法在所有集合中通用的。\n\n在定义要存储在集合（Sets）或作为字典键（Dictionaries\
    \ keys）的对象时，需要特别注意定义“重复”的含义。因为我们需要重写继承自 `Object` 的 `Equals()` 和 `GetHashCode()`\
    \ 方法。\n\n序列化是非常强大的机制，允许通过一个简单的命令存储集合的内容及其所有相关对象。\n\n在第 11 章将提供另一个使用集合的示例，那是本书末尾的一个较大的案例研究。这将展示如何将列表、集合和字典用于一个较小但更真实的示例应用程序。如果需要，可以下载并检查该部分的代码。\n\
    \n## 8 C# 开发工具\n\n### 介绍\n\n本章将向读者介绍几种支持支持大规模 C# 系统开发的开发工具。我们还将考虑文档的重要性，并展示如何使用工具为你创建的系统生成文档（几乎是全自动的）。\n\
    \n### 目标\n\n在本章结束时，你将能够....\n\n- 找到几个专业且免费的交互式开发环境的详情\n- 理解软件文档工具的重要性以及在代码中嵌入\
    \ XML 注释的价值\n- 编写 XML 注释并为程序生成生成文档\n\n本章由八部分组成：\n\n- 1) 编写 C# 程序的工具....\n- 2)\
    \ Microsoft Visual Studio\n- 3) SharpDev\n- 4) 自动文档\n- 5) Sandcastle Help File\
    \ Builder\n- 6) GhostDoc\n- 7) 添加命名空间注释\n- 8) 总结\n\n## 8.1 编写 C# 程序的工具\n\n无论采用何种执行方法（见\
    \ 1.7），程序员都可以使用各种工具创建源代码。可以使用简单的离散工具（例如 记事本）以及根据需要手动调用的编译器来编写 C# 程序。然而，几乎所有的程序员都会使用强大的集成开发环境（IDE），它在无缝界面背后使用了编译器和其他标准工具。\n\
    \n还存在更复杂的计算机辅助软件工程（CASE）工具，它们将实现过程与其他软件开发生命期的其他阶段集成。CASE 工具可以获取软件分析和设计阶段生成的 UML\
    \ 类图，并自动生成类和方法存根，从而减少编写 C# 代码（即实现阶段）的工作量。\n\nCASE 工具还可以通过自动化软件测试阶段来帮助。\n\n随着时间的推移，由于更强大的工具出现，IDE\
    \ 开始整合以前仅在 CASE 工具中的功能，即它们可以完成更多程序的编写、编辑和编译。其中一种工具就是 Microsoft Visual Studio。\n\
    \n## 8.2 Microsoft Visual Studio\n\n转向“工业级”IDE 是你作为软件开发者进步中的重要里程碑，就像第一次尝试骑没有辅助轮的自行车一样。通过练习，你很快就会发现有很多非常有帮助且节省时间的功能，让你离不开。\n\
    \nMicrosoft Visual Studio 是一个强大的 IDE 平台，支持使用多种语言编写 .NET 程序，而不只是 C#。\n\n可以通过 http://www.microsoft.com/visualstudio\
    \ 获取这些详情。\n\nVisual Studio 有许多版本，但最常见的两个版本可能是 Visual Studio 专业版和 Visual Studio\
    \ Express 版。专业版用于创建书中的所有代码以及第 11 章开发的案例研究应用程序。然而，Express 版是免费的，并且包含了创建和运行书中应用程序所需的所有功能。\n\
    \n![](img/e143b38d00f95425fa4f3efca0527189_166_0.png)\n\n"
