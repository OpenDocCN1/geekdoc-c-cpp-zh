    {\n    [Serializable]\n    public class ClientBook\n    {\n        private SortedDictionary<int,\
    \ Client> clients;\n        public SortedDictionary<int, Client> Clients\n   \
    \     {\n            get return clients;\n        }\n\n        public ClientBook()\n\
    \        {\n            clients = new SortedDictionary<int, Client>();\n     \
    \   }\n\n        public ClientBook(SortedDictionary<int, Client> clients)\n  \
    \      {\n            this.clients = clients;\n        }\n\n        public void\
    \ AddClient(int clientID, Client newClient)\n        {\n            try\n    \
    \        {\n                clients.Add(clientID, newClient);\n            }\n\
    \            catch (ArgumentException)\n            {\n                throw new\
    \ ClientAlreadyExistsException(\"ClientBook.AddClient(clientID): a client with\
    \ this ID already exists in system ID:\" + clientID);\n            }\n       \
    \ }\n\n        public Client GetClient(int clientID)\n        {\n            try\n\
    \            {\n                return clients[clientID];\n            }\n   \
    \         catch (KeyNotFoundException)\n            {\n                throw new\
    \ UnknownClientException(\"ClientBook.GetClient(): unknown client ID:\" + clientID);\n\
    \            }\n        }\n    }\n}\n```\n\n上面的代码展示了创建 `ClientBook` 对象的构造函数，该对象是一个包含\
    \ ClientID 和 Client 对象的排序字典，以及 `ClientBook` 类所需的其他方法。下面将对此进行进一步讨论。\n\n# 使用 C#\
    \ 进行面向对象编程\n\n# 11.10 创建和处理 UnknownClientException\n\n如果不存在指定 ID 的客户端，`GetClient()`\
    \ 方法将产生一个 `KeyError`。如果我们不捕获此异常，我们的程序将会崩溃！此外，当我们尝试在没有客户端对象的情况下调用 `DecreaseCredit()`\
    \ 方法时，程序也会崩溃。\n\n为了防止这种情况，我们需要：\n\n- 创建一种新种的异常（如第 9 章描述的那样），命名为 `UnknownClientException`。\n\
    - 告诉 `ClientBook` 类在未找到客户端时抛出此异常。\n- 在 `DailyPurge()` 方法中捕获并处理此异常。\n\n第一步非常简单……\n\
    \n```csharp\npublic class UnknownClientException : ApplicationException\n{\n \
    \   public UnknownClientException(String message): base(message)\n}\n```\n\n![](img/e143b38d00f95425fa4f3efca0527189_234_0.png)\n\
    \n在爱立信，我们深信我们每天做的创新可以对改变世界产生深远影响，为人类、业务和社会创造一个更美好的地方。加入我们吧。\n\n在德国，我们特别在寻找以下方向的毕业生作为集成工程师：\n\
    - 无线接入和 IP 网络\n- IMS 和 IPT\n\n我们期待您的申请！欲申请并查看所有空空职位，请访问我们的网页：www.ericsson.com/careers\n\
    \n在 bookboom.com 免费下载电子书。\n\n# 使用 C# 进行面向对象编程\n\n接下来我们让 `GetClient()` 方法在捕获到 `KeyNotFoundException`\
    \ 时（如下文所示）生成一个 `UnknownException`：\n\n```csharp\npublic Client GetClient(int clientID)\n\
    {\n    try\n    {\n        return clients[clientID];\n    }\n    catch (KeyNotFoundException)\n\
    \    {\n        throw new UnknownClientException(\"ClientBook.GetClient(): unknown\
    \ client ID:\" + clientID);\n    }\n}\n```\n\n在适当条件下，我们使用关键字 `new` 来调用异常的构造函数，并传递构造函数所需的字符串消息。构造函数返回的对象随后被“抛出”。\n\
    \n为了方便起见，该字符串指定了从未找到客户端的 `clientID` 生成此异常的方法。`DailyPurge()` 方法应该捕获此异常并尽可能处理它，以防止崩溃的发生。\n\
    \n最后一步是在 `DailyPurge()` 方法中捕获并处理 `UnknownClientException` —— 如第 11.8 节（消息类）所示。\n\
    \n如果不存在客户端，我们不会采取任何操作，而是报告错误。消息将继续显示（即使没有客户端）。\n\n在这种情况下，我们决定如果一个未知的消息已过期，我们仍然需要从显示中移除它。\n\
    \n# 使用 C# 进行面向对象编程\n\n# 11.11 接口编程\n\n我们仍然需要检查“驱动”系统的主窗口。\n\n它执行以下功能：\n\n- 它拥有客户端簿和消息集的持久化引用。\n\
    - 它设置用于存储 `ClientBook` 和消息集的文件。\n- 它定义了系统启动时发生的情况。\n- 它定义了系统关闭时发生的情况。\n- 它在用户向系统添加新消息或客户端时调用\
    \ `Message`、`UrgentMessage` 和 `Client` 类的构造函数。\n- 它在显示板上显示消息。\n- 它在用户每天结束时请求调用\
    \ `DailyPurge()` 方法。\n\n![](img/e143b38d00f95425fa4f3efca0527189_236_0.png)\n\n\
