    \ of unspecified visibility, has unspecified multiplicity.\n\nOperations also\
    \ have a precise syntax and should be shown as:\nvisibility name (par1 : type1,\
    \ par2: type2): returntype\n\nwhere each parameter is shown (in parenthesis) and\
    \ then the return type is specified.\n\nAn example would be\n\n+ + AddName(newName\
    \ : String): boolean\n\nThis denotes a public method 'AddName' which takes one\
    \ parameter 'newName' of type String and returns a boolean value.\n\n## Activity\
    \ 2\n\nDraw a diagram to represent a class called 'BankAccount' with a private\
    \ attribute balance (this being a single integer) and a public method DepositMoney()\
    \ which takes an integer parameter, 'deposit' and returns a boolean value. Fully\
    \ specify all of this information on a UML class diagram.\n\n## Denoting Relationships\n\
    \nAs well as denoting individual classes, class diagrams denote relationships\
    \ between classes. One such relationship is called 'Association'. We will learn\
    \ a lot more about associations in Chapter 6 where we look at how to model an\
    \ oriented system. Here we are just learning UML notation, attributes will be\
    \ defined. These could be primitive types (int, etc.) however attributes can also\
    \ be complex objects defined by other classes.\n\nFeedback 2\n\n| BankAccount\
    \ |\n| :--- |\n| - balance :int[1] |\n| + DepositMoney(deposit :int) : boolean\
    \ |\n\nThe figure above shows a class 'OneClass' that has an attribute 'value'.\
    \ This value is not a primitive data type but an object defined by 'OtherClass'.\
    \ We could denote exactly the same information by the diagram below.\n\n| OneClass\
    \ |\n| :--- |\n| value : OtherClass |\n\nWe use an association when we want to\
    \ give two related classes, their relationship, prominence on a class diagram\
    \ – 'source' points to the 'target' class. Strictly we could use association when\
    \ a class defines a String instance – but we would not do this because the String\
    \ is part of the platform and 'taken for granted' like an attribute of a primitive\
    \ type. This would generally be true of all classes unless we are drawing the\
    \ diagram specifically to explain some aspect of the class for the benefit of\
    \ someone unfamiliar with its purpose and functionality. Additionally we can show\
    \ multiplicity at both ends of an association:\n\n![](img/e143b38d00f95425fa4f3efca0527189_38_0.png)\n\
    \nThis implies that 'OneClass' maintains a collection of objects of type 'OtherClass'.\
    \ Collections are an important part that we will look at in Chapter 7.\n\n| Activity\
    \ 3\n\nDraw a diagram to represent a class 'Catalogue' and a class 'ItemForSale'\
    \ as defined below - ItemForSale has an attribute 'name' of type String and an\
    \ attribute 'price' of type int. It also has a method SetPrice() which takes an\
    \ integer parameter 'newPrice'. 'Catalogue' has an attribute 'listOfItems' i.e.\
    \ the items currently held in the catalogue. As zero or more items can be stored\
    \ in the catalogue 'listOfItems' will need to be an array or collection. 'Catalogue'\
    \ also has one method AddItem() which takes an 'item' as a parameter (of type\
    \ ItemForSale) and adds this item to the 'listOfItems'. Draw this on a class diagram\
    \ showing appropriate visibility modifiers for attributes and methods.\n\nFeedback\
    \ 3\n\n| Catalogue | ItemForSale |\n| :--- | :--- |\n| 1..* | - name:String |\n\
    | + AddItem(item :ItemForSale) | + SetPrice(newPrice :int) |\n\nNote: According\
    \ to the naming convention followed here, all class names begin in uppercase,\
    \ attribute names begin in lowercase, method names begin in uppercase to distinguish\
    \ them from class names. Also note that the ItemForSale describes a single item\
    \ (not multiple items). 'listItems' maintains a list of zero or more individual\
    \ objects.\n\n## Types of Association\n\nThere are various types of association\
    \ denoted by different arrows:-\n\n- Dependency.\n\n![](img/e143b38d00f95425fa4f3efca0527189_39_0.png)\n\
    \n![](img/e143b38d00f95425fa4f3efca0527189_40_0.png)\n\n- Dependency\n- Simple\
    \ association (navigable from A to B)\n- Bidirectional association\n- Aggregation\n\
    - Composition\n\n## Dependency\n\n![](img/e143b38d00f95425fa4f3efca0527189_40_1.png)\n\
    \n- Dependency is the most unspecific relationship between classes (not strictly\
    \ an 'association')\n- Class A in some way uses facilities defined by Class B\n\
    - Changes to Class B may affect Class A\n\nTypical of dependency lines would be\
    \ where Class A has a method which is passed a parameter object of Class B, or\
    \ uses a local variable of that class, or calls 'static' methods in Class B.\n\
    \nExample: A Print() may require a printer object as a parameter. Each time the\
    \ Print() method is invoked, a different printer object could be passed as a parameter\
    \ and thus the printout will appear in a different place. Thus while the class\
    \ containing the Print() method requires a printer object to work it does not\
    \ need to be permanently associated with one specific printer.\n"
  mdcn: "\n\n# 使用 C# 进行面向对象编程\n\n# 统一建模语言 (UML)\n\n## 活动 1\n\n绘制一个图表示名为 'BankAccount'\
    \ 的类，它具有属性 balance（类型为 int）以及方法 `DepositMoney()`、`WithdrawMoney()` 和 `DisplayBalance()`。请显示合适的可见性修饰符。\n\
    \n反馈 1\n\n| BankAccount |\n| :--- |\n| - balance :int |\n| + DepositMoney() |\n\
    | + WithdrawMoney() |\n| + DisplayBalance() |\n\n上面的图表显示了这些信息\n\nUML 允许我们在图中忽略不希望突出显示的任何信息——这使我们能够忽略无关的细节，并将读者的注意力集中在我们想要关注的信息上。因此，以下都是有效的类图……\n\
    \n![](img/e143b38d00f95425fa4f3efca0527189_33_0.png)\n\n首先，在不显示访问修饰符的情况下……\n\n\
    | BankAccount |\n| :--- |\n| balance int |\n| DepositMoney() |\n| WithdrawMoney()\
    \ |\n| DisplayBalance() |\n\n其次，在显示访问修饰符但不显示数据类型的情况下……\n\n| BankAccount |\n| :---\
    \ |\n| balance |\n| DepositMoney() |\n| WithdrawMoney() |\n| DisplayBalance()\
    \ |\n\n最后，在不显示属性和方法的情况下……\n\n| BankAccount |\n| :--- |\n\n即：有一个名为 'BankAccount'\
    \ 的类，但它的细节没有显示。\n\n当然，几乎所有的 C# 程序都由许多类组成，类与类之间相互关联——某些类将使用其他类。这些关系通过箭头表示。不同类型的箭头表示不同的关系（包括继承和聚合关系）。\n\
    \n此外，类图还使用了关键字、备注和注释。\n\n正如我们在接下来的示例中看到的，类图可以显示以下信息：\n\n- 类\n  - 属性\n  - 操作\n\
    \  - 可见性\n- 关系\n  - 可导航性\n  - 多重性\n  - 依赖\n  - 聚合\n  - 组合\n- 一般化 / 特殊化\n  - 继承\n\
    \  - 接口\n- 关键字\n- 备注和注释\n\n## 2.3 UML 语法\n\n由于 UML 图传达的是精确的信息，因此应该遵循精确的语法。\n\n\
    属性应显示为：*可见性 名称：类型 多重性*\n\n其中可见性是以下之一：\n\n- + public 公\n- - private 私有\n- # protected\
    \ 保护\n- ~ package 包\n\n多重性是以下之一：\n\n- n 恰好 n\n- * 零或多个\n- m..n 在 m 到 n 之间\n\n\
    以下是使用 UML 正确指定的属性示例：\n\n- - custRef : int [1]\n\n私有属性 custRef 是一个单一 int 值，这通常显示为\
    \ - **custRef : int**。但在没有显示多重性的情况下，我们无法安全地假设作者想要表达多重性为一。\n\n- # itemCodes : String\
    \ [1..]\n\n受保护属性 `itemCodes` 是一个或多个 String 值。\n\n- # validCard : boolean\n\n属性\
    \ `validCard` 的可见性未指定，多重性也未指定。\n\n操作也有精确的语法，并应显示为：\n可见性 名称 (参数1 : 类型1, 参数2: 类型2):\
    \ 返回类型\n\n其中每个参数都用（括号）显示，然后指定返回类型。\n\n例如\n\n+ + AddName(newName : String): boolean\n\
    \n这表示一个公共方法 'AddName'，它接受一个类型为 String 的参数 'newName' 并返回一个布尔值。\n\n## 活动 2\n\n绘制一个图表示名为\
    \ 'BankAccount' 的类，它有一个私有属性 balance（这是一个单一整数）和一个公共方法 `DepositMoney()`，该方法接受一个整数参数\
    \ 'deposit' 并返回一个布尔值。在 UML 类图中完整指定所有这些信息。\n\n## 表示关系\n\n类图在表示单个类的同时，还表示类之间的关系。其中一种关系被称为“关联\
    \ (Association)”。我们将在第 6 章学习更多关于关联的内容。\n\n反馈 2\n\n| BankAccount |\n| :--- |\n\
    | - balance :int |\n| + DepositMoney(deposit : int): boolean |\n\n上面的图显示了 `OneClass`\
    \ 拥有属性 `value`。\n\n| OneClass |\n| :--- |\n| value |\n\n使用关联当 `source` 指向 `target`\
    \ 类时，为了解释某个类的一个方面，功能性：\n\n![](img/e143b38d00f95425fa4f3efca0527189_38_0.png)\n\
    \n这暗示 `OneClass` 维护一个类型为 `OtherClass` 的集合。我们将在第 7 章查看集合。\n\n活动 3\n\n绘制一个图表示 'Catalogue'\
    \ 类和如下所示的 ItemForSale 类——ItemSale 有一个类型为 String 的属性 `name` 和一个类型为 int 的属性 `price`。它还有一个方法\
    \ `SetPrice()` 接受一个整数参数 `newPrice`。'Catalogue' 有一个属性 `listOfItems`，即当前目录中的项。由于零或多个项可以存储在目录中，`listOfItems`\
    \ 需要是一个数组或集合。'Catalogue' 还有一个方法 `AddItem()`，接受一个参数（类型为 ItemSale）。在类图中显示属性和方法的适当可见性修饰。\n\
    \n反馈 3\n\n| Catalogue | ItemForSale |\n| :--- | :--- |\n| 1..* | - name:String\
    \ |\n| + AddItem(item :ItemSale) | + SetPrice(newPrice :int) |\n\n注意：按照这里的命名规范，所有类名大写开头，属性名小写开头，方法名大写开头以区别于类名。此外注意\
    \ ItemForSale 描述的是单个项目（而不是多个）。'listItems' 维护零或多个独立对象。\n\n## 关联类型\n\n有由不同箭头表示的不同关联类型：\n\
    \n- 依赖 (Dependency)。\n\n![](img/e143b38d00f95425fa4f3efca0527189_39_0.png)\n\n\
    ![](img/e143b38d00f95425fa4f3efca0527189_40_0.png)\n\n- 依赖\n- 简单关联（从 A 到 B 可导航）\n\
    - 双向关联\n- 聚合\n- 组合\n\n## 依赖\n\n![](img/e143b38d00f95425fa4f3efca0527189_40_1.png)\n\
    \n- 依赖是类之间最不具体的关系（不是严格的“关联”）\n- 类 A 以某种方式使用类 B 定义的功能\n- 对类 B 的更改可能会类 A\n\n依赖线的典型情况是：类\
    \ A 有一个方法接受类 B 的对象参数，或者使用该类的局部变量，或者调用了类 B 的“静态”方法。\n\n例如：`Print()` 可能需要一个打印机对象作为参数。每次调用\
    \ `Print()` 方法时，都可以传递一个不同的打印机对象作为参数，因此打印结果将出现在不同的位置因此因此虽然包含 `Print()` 方法的类需要打印机对象才能工作，但它不需要与特定的打印机永久关联。\n\
    \n"
