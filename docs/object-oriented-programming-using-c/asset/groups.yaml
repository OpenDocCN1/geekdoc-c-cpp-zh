    # Object Oriented Programming using C#


    # Creating And Using Exceptions


    Thus we could


    +   a) write a catch block that would react to ALL of these exceptions by catching
    a SystemException, or we could

    b) write a catch block that would catch any type of input \n output exceptions,
    IOExceptions, and ignore all

    c) we could be even more specific and catch only FileNotFoundExceptions.


    Catching specific exceptions allows us to take specific remedial action e.g. given
    a FileNotFoundException we could explain to the user of a program that the file
    was missing and allow them to specify an alternative file.


    Catching general exceptions allows us to ensure no potential fatal error cause
    our program to crash though we may not be able to take very useful remedial action
    e.g. given any Exception we could close our program down but without knowing what
    caused the exception we could not take specific remedial.


    In exactly the same way we can define subclasses of ApplicationException and catch
    these exceptions as and when appropriate.


    # 9.4 Throwing Exceptions


    Having defined our exception classes we must then ensure our methods generate,
    or throw, these exceptions when appropriate. For example we would use GetClient()
    to throw an UnknownClientException when a client cannot be found with the specified
    ID.


