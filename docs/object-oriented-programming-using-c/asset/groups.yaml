    \           return (\"****\" + MessageText + \"\\*\\*\");\n        }\n    }\n\
    }\n```\n\n`Cost` 属性和 `ToString()` 方法被重写了，因为紧急消息的成本更高且显示内容有所不同。要重写 `Cost` 属性，必须在\
    \ `Message` 类中将其标记为 `virtual`。\n\n`MessageSet` 类与 `Message` 是一对多的关系。这意味着不允许出现重复的消息（至少对于同一个客户而言），因此集合应该是\
