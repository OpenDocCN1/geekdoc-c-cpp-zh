    +   1) For this we use a Set. Members can be added and removed as required and
    the members are in no particular order.

    2) For this we use a List – this would record the items bought in the order in
    which they were purchased. Importantly as lists allows duplicate items we could
    buy two identical toys (perhaps for birthday presents for two different children).

    3) We would not have two identical Bank accounts so a Set seems appropriate however
    as each is identified by a unique account number a Dictionary would be the most
    appropriate choice.'
