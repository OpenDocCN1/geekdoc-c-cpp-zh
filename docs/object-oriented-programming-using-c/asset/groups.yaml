    ## 使用 C# 进行面向对象编程：对象角色与多态性的性


    如果 `pIS` 是 `Publication` 的任何子类（例如书籍、杂志或光片），`pIS IS Publication` 将为真。如果我们愿意，可以很容易地测试更具体的子类型，即
    `pIS is Book`。


    注意，我们通过检查子类型来损害了多态性，同时也损害了系统的可扩展性——实现 `SaleableItem` 接口的新类（例如 `Sweets`）可能也需要向此语句中添加新的子句，因此更改会波及到整个系统，导致维护成本变得更高且更容易出错。


    我们不应该这样做，而应该尝试将不同的行为封装到子类本身中。例如，我们在 `SaleableItem` 接口中定义一个 `DescribeSelf()` 方法，然后在每个实现
    `SaleableItem` 接口的类中都必须实现该方法。每个子类都将显示一条提供所售物品类型的消息。这样，`CashTill` 中的上述语句就可以被 `pIS.DescribeSelf()`
    替换。因此，当我们向系统添加新类时，就不需要修改 `CashTill` 了。


    ## 4.8 总结


    - 多态允许我们根据父类而不是实际类来引用对象。

    - 多态使我们能够通过添加额外的类来轻松扩展程序，而无需更改其他类。

    - 我们可以通过调用为父类定义的操作来操作对象，而不必担心任何特定情况下涉及哪一个子类。

    - C# 确保在运行时调用对象实际类的适当方法。

    - 有时，我们希望使用多态性，但并不要求所有相关的类都处于继承层次结构中。在这种情况下，接口允许我们提供共享的操作集合。这样做时没有继承的实现——每个类都必须实现接口定义的**所有**（ALL）操作。

    - 任意数量的类可以实现特定的接口。

    - C# 中的类只能自一个父类，但可以实现多个接口。


    ## 5 方法重载


    ### 引言


    本章将向读者介绍方法重载的概念。


    ### 目标


    在本章结束时，你将能够……


    - 理解“重载”的概念

    - 领会方法重载提供的灵活性

    - 在在线 API 文档中识别重载方法


    本章由以下三个部分组成：


    1) 重载

    2) 增加灵活性的重载

    3) 总结


    ## 5.1 重载


    在历史上，计算机程序中的方法名称必须是唯一的。因此，编译器只需通过查看名称即可识别正在调用的是哪个方法。


    然而，通常需要多个方法来执行非常相似的功能，例如，一个方法可能可以将整数相加，而另一个方法可能需要相加两个浮点数。如果你必须给这两个方法起唯一的名称，你会给其中一个命名为
    ''Add()'' 吗？


    为了给每个方法命名，名称需要更长且更具体。因此我们可以将一个方法命名为 `AddInt(int)`，另一个为 `AddFloat(float)`，但这可能会导致名称泛滥，每个名称都在描述不同的方法，而它们本质上执行的是相同的操作（即相加数字）。


    为了在 C# 中解决这个问题，你不需要为每个方法都命名——因此，上述两个方法都可以命名为 `Add()`。然而，如果方法名称不是唯一的，C# 必须有其他方式在运行时决定调用哪种方法。即，当调用
    `Add(number1,number2)` 时，机器必须决定使用两个方法中的哪一个。它通过查看参数列表来实现这一点。


    虽然两个方法可能有相同的名称，但仍然可以通过查看参数列表来区分：


    - Add(int number1, int number2)

    - Add(float number1, int number2)


    ## 使用 C# 进行面向对象编程


    ## 重载


    这在运行时通过查看方法调用和传递的实际参数来解决。如果传递两个整数，则调用第一个方法。如果传递的是两个浮点数，则使用第二个方法。


    重载是指多个方法可能共享相同名称的事实。由于方法名称不再唯一地标识方法，因此它被“重载”了。


    ## 5.2 增加灵活性的重载


    拥有几个本质上执行相同操作但带有不同参数列表的方法，可以增强系统的灵活性和健壮性。


    想象一个大学管理系统。可能需要一个方法来录取、注册新学生。此类方法可能具有如下签名……


    ```

    EnrollStudent(String name, String address, String coursecode)

    ```


    如果一个学生刚到达这个城市，还没有安排好住在哪里，大学想拒绝录取该学生？他们可以这样做，但允许这样的学生入学（并将地址设置为“未知”）是否会更好呢？


    ![](img/e143b38d00f95425fa4f3efca0527189_108_0.png)


    ## 使用 C# 进行面向对象编程


    为了允许这种操作，`EnrollStudent()` 方法可以被重载，并提供另一种方法如下……


    ```

    EnrollStudent(String name, String coursecode)

    ```


    在运行时，调用的方法取决于所提供的参数列表。因此，调用


    ```

    EnrollStudent("Fred", "123 Abbey Gardens", "G700")

    ```


    将使用第一个方法。


    ## 活动 1


    想象一个 `WithdrawCash()` 方法可以作为银行系统的一部分。该方法可以接受两个参数：账户标识（String）和用户所需的现金金额（int）。因此，完整的方法签名将为


    ```

    WithdrawCash(String accountID, int amount).

    ```


    识别另一个带有不同参数列表的 `WithdrawCash()` 方法变体。


    ## 反馈 1


    另一种用于取现的替代方法可以是 `WithdrawCash(String accountID)`，其中没有指定金额，默认取现 £100。这些方法本质上执行相同的操作，但通过通过重载此方法，我们使系统变得更加灵活——用户现在有了选择，他们可以指定金额。


    构造函数也可以像普通方法一样被重载。


