    # Object Oriented Programming using C#


    # The Unified Modelling Language (UML)


    ![](img/e143b38d00f95425fa4f3efca0527189_42_0.png)


    As many students study the same Degree at the same time, but students usually
    only one Degree there is still a one to many relationship here (of course we could
    model a situation where we record degrees being studied and previous degrees passed
    – in this case, as a student may have passed more than one degree, we would have
    a many to many relationship).


    # Aggregation


    ![](img/e143b38d00f95425fa4f3efca0527189_42_1.png)


    +   - Aggregation denotes a situation where Object(s) of Class B ''belong to''
    Class A

    - Implies reference from A to B

    - While aggregation implies that objects of Class B belong to objects of Class
    A it also implies object of Class B retain an existence independent of Class A.
    Some designers believe there is no real distinction between aggregation and simple
    association


    ![](img/e143b38d00f95425fa4f3efca0527189_42_2.png)'
  - '[PAGE 43]


    # Object Oriented Programming using C#


    # The Unified Modelling Language (UML)


    An example of aggregation would be between a class Car and a class Tyre


    ![](img/e143b38d00f95425fa4f3efca0527189_43_0.png)


    We think of the tyres as belonging to the car they are, but at the garage they
    may be removed and placed on a rack to be repaired. Their existence isnt dependent
    on the existence of a car with which they are associated. Some designers believe
    that aggregation can be replaced as a simple association as when implementing
    this design in a program makes no difference to the programmer.


    # Composition


    ![](img/e143b38d00f95425fa4f3efca0527189_43_1.png)


    +   - Composition is similar to aggregation but implies a much stronger belonging
    relationship i.e. Object(s) of Class B are ‘part’ of Class A object

    - Again implies imply reference from A to B

    - Much ‘stronger’ than aggregation in this case Class B objects are an integral
    part of Class A and in general objects of Class B never exist other than part
    of Class A, i.e. they have the same ‘lifetime''


    An example of composition would be between Points, Lines and Shapes as elements
    of a Picture. These objects can only exist as part of a picture, and if the picture
    is deleted they are also deleted.


    As well as denoting associations, class diagrams can denote :-


    +   - Inheritance,

    - Interfaces,

    - Keywords and

    - Notes'
  - '[PAGE 44]


    Object Oriented Programming using C#


    The Unified Modelling Language (UML)


    # Inheritance


    ![](img/e143b38d00f95425fa4f3efca0527189_44_0.png)


    +   - Aside from associations, the other main modelling relationship is inheritance:

    - Class A ‘inherits’ both the interface and implementation of Class B, though
    it may override implementation details and supplement both.


    We will look at inheritance in detail in Chapter 3.


    # Interfaces


    +   - Interfaces are similar to inheritance however with interfaces only the interface
    is inherited. The methods defined by the interface must be implemented in every
    class that implements the interface.

    - Interfaces can be represented using the <<interface>> keyword:


    ![](img/e143b38d00f95425fa4f3efca0527189_44_1.png)


    There is also a shorthand for this


    ![](img/e143b38d00f95425fa4f3efca0527189_44_2.png)


    In both cases these examples denote that the SaleableItem interface is required
    by CashTill and implemented by Publication.


    NB the dotted-line version of the inheritance line/arrow which shows that Publication
    ‘implements’ or ‘realizes’ the SaleableItem interface.'
