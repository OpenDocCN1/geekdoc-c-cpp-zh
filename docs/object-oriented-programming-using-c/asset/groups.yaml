  - '[PAGE 192]


    # 10.10 Several Test Examples


    To illustrate the testing framework we will create several test cases to test
    the functionality of a BankManagment system as represented below :


    ![](img/e143b38d00f95425fa4f3efca0527189_192_0.png)


    In this system a BankManager class maintains a book of clients (BofC). Client
    objects can be added by the AddClient() method which requires an ID for that client
    and the client object to be added. Clients can be retrieved via the GetClient()
    method which requires a ClientID as a parameter and returns a client object (if
    one exists) or generates an exception (if a client with the specified ID does
    not exist).


    The Client class has a constructor that requires the name of the client and the
    clients balance.


    For simplicity we are assuming each client of the bank has only one account (obviously
    this is not a realistic system) and we do not need an account number as each client
    has a unique ID.


    We will specifically test the ability to...


    +   * Add a client to the BookOfClients

    * Trying to lookup a non-existent client

    * Increase a Clients balance by invoking the AddMoney() method.


    This is of course only a small fraction of the test cases which would be needed
    to thoroughly demonstrate the operation of all classes and all methods within
    the system.'
  - "[PAGE 193]\n\n# Testing a client\n\nTo test a client can be added we need to\n\
    \n+   1) Set up the test by creating a new empty BookOfClients\n2) Create a client\
    \ and add this to the BookOfClients\n3) Check that the client has been added successfully\
    \ by trying to retrieve the client just added (this course should work) and finally\n\
    4) We need to test that the client has retrieved the same attributes as the client\
    \ we added – to ensure it was not corrupted in the process.\n\nFirstly we initialise\
    \ the test by creating a new empty BookOfClients object (BofC) and we clean the\
    \ test by setting this to null at the end. The code for this is below:\n\n```\n\
    [TestInitialize]\npublic void TestInitialize() {\n    BofC = new BankManager.BookOfClients();\n\
    }\n[Cleanup]\npublic void TestCleanup() {\n    BofC = null;\n}\n```\n\nNext we\
    \ create our first test method. This method will work by trying to add a client\
    \ to the empty object BofC. If the system generates an exception then this client\
    \ already exists then we know a fault in our code... under these circumstances\
    \ we are aware that the test has failed. See the test for this...\n\n```\n[TestMethod]\n\
    public void AddClient_TestNewClient_ExceptionShouldNotBeGenerated() {\n    BankManager.Client\
    \ c = new BankManager.Client(\"Simon\", \"Room 1234\", \"x200\", 10);\n    try\
    \ {\n        BofC.AddClient(c, 1);\n    } catch (BankManager.ClientAlreadyExistsException)\
    \ {\n        Assert.Fail(\"ClientAlreadyExists exception should not be thrown\
    \ for new clients\");\n    }\n}\n```\n\nIf the test above passes then we know\
    \ our code has not generated an exception however does not prove that the client\
    \ has been added successfully. We need to create other tests to show that we can\
    \ retrieve the client just added and need a test to show that in adding / retrieving\
    \ the client object the attributes have not been corrupted. Multiple tests are\
    \ required before we have confidence that the method we are testing will actually\
    \ work!"
  - "[PAGE 194]\n\n# Object Oriented Programming using C#\n\nNote the name of the\
    \ test above indicates the name of the method being tested by a short description\
    \ of the test being performed and a description of the expected output. Test names\
    \ like this, long, are important. By reading a long list of test names we can\
    \ work out parts of our system have been adequately tested and which parts have\
    \ been missed.\n\nIn addition to the tests described we should also try to add\
    \ a client with the same ID twice. Our system should of course not allow this\
    \ to happen. The test succeeds if the code prevents a client being added twice.\n\
    \nConversely if the system does not generate an exception after adding the same\
    \ client for the second time then the test should indicate that the code has failed.\
    \ For this test is given below...\n\n```\n[TestMethod]\npublic void AddClient_TestAddExistingClient()\n\
    {\n    BankManager.Client c = new BankManager.Client(\"Simon\", \"Room\n1234\"\
    , \"x200\", 10);\n    try\n    {\n        Bof.AddClient(1, c);\n        Bof.AddClient(1,\
    \ c);\n        Assert.Fail(\"ClientAlreadyExists exception should be thrown\\\
    n        if client added twice\");\n    }\n    catch (BankManager.ClientAlreadyExistsException)\n\
    \    {\n    }\n}\n```\n\nAn alternative way of writing the test above is to indicate\
    \ that the test expects an exception to be generated by the [ExpectedException(...)]\
    \ attribute. If this exception is generated and interrupts the test then the test\
    \ has passed. See an alternative version of the test code below...\n\n```\n[TestMethod]\n\
    [ExpectedException(typeof(BankManager.ClientAlreadyExistsException))]\npublic\
    \ void AddClient_TestAddExistingClient()\n{\n    BankManager.Client c = new BankManager.Client(\"\
    Simon\", \"Room\n1234\", \"x200\", 10);\n    Bof.AddClient(1, c);\n    Bof.AddClient(1,\
    \ c);\n    Assert.Fail(\"ClientAlreadyExists exception should be thrown\\n   \
    \     client added twice\");\n}\n```"
