    # The Unified Modelling Language (UML)


    The “ball and socket” notation is new in UML 2 – it is a good visual way of representing
    how interfaces connect classes together.


    We will look at the application of interfaces in more detail in Chapter 4.


    # Keywords


    UML defines keywords to refine the meaning of the graphical symbols We have seen
    <<interface>> and we will also make use of <<abstract>> but there are many more.


    An abstract class may alternatively be denoted by showing its name in *ics* though
