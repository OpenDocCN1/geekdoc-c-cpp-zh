    # Object Oriented Programming using C#


    # An Introduction to Object Oriented Programming


    C# programs are thus partly compiled into a common intermediate language. This
    is then linked with a CLR engine to give a .exe file.


    Taken all together the .NET framework does not mean that all of the .NET languages
    are identical but they do have access to an identical library of methods that
    can be used by all .NET Languages. Thus learning to programme .NET language makes
    it easier to learn and program another .NET language.


    .NET programs can only run where a CLR engine has been created for the underlying
    operating system. Windows Vista and Windows 7 comes with a CLR engine and can
    therefore run .NET programs but older versions of windows may need a CLR engine
    installed before .NET programs can be run.


    To enable .NET programs to be independent Microsoft published an open source specification
    for a CLR engine (called a Virtual Execution System) which included the definition
    of the C# language and a Common Language Infrastructure (CLI).


    By using these definitions CLR engines have been created for other operating systems
    (e.g. Mac OS and Linux) and by using these .NET programs can run on different
    platforms... not just Microsoft Windows. However before programs can run on different
    platforms they need to be compiled for each platform .NET programs, including
    C# programs, are not as portable as Java programs.


    While CLRs are perhaps not as widely available as JREs they exist for other platforms.
    One example of an open source is Mono (www.mono-project.com). Mono is an open
    source, cross-platform, implementation of C# and the CLR that is compatible with
    Microsoft. One part of the Mono project is MonoTouch. MonoTouch allows you to
    create C# and .NET apps for iPhone and iPod Touch, while taking advantage of iOS
    APIs.


    As well as compiling our C# programs it is possible to create a software installation
    routine that will download via the web a .NET runtime and automatically install
    this along with our software (assuming a .NET environment is not already installed).


    We will write and running code in C# throughout this book and in doing so we will
    be making use of a compiler, the Common Language Runtime (CLR) engine and some
    of the more common class libraries. However the prime aim of this book is to teach
    generic Oriented programming and modelling principles that are common across a
    range of OO languages - not just .NET languages.


    While we will illustrate OO in this book with C# we will not concern ourselves
    with the intricacies of how the CLR engine works, details regarding how .NET programs
