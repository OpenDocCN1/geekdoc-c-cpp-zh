  - "[PAGE 182]\n\n# Object Oriented Programming C#\n\nTo do this we must create an\
    \ object of UnknownClientException using the keyword new. When doing so we can\
    \ pass an error message as a parameter to the constructor of the exception as\
    \ shown in the code below.\n\n```\nnew UnknownClientException(\"ClientBook.GetClient():\
    \ unknown client ID:\" + clientID);\n```\n\nThe code above generates an instance\
    \ of the UnknownClientException class and provides the constructor with a String\
    \ message. This message specifies the name of the Class / Method where the exception\
    \ was generated from and provides some additional information that can inform\
    \ the user about the circumstances that caused the error e.g. the clients IDs.\n\
    \nHaving generated an exception object we use the keyword 'throw' to throw this\
    \ exception at the appropriate point within the body of the method.\n\n```\npublic\
    \ Client GetClient(int clientID)\n{\n\n    code missing\n\n    throw new UnknownClientException(\"\
    ClientBook.GetClient(): unknown client ID:\" + clientID);\n}\n```\n\nIn the example\
    \ above if a client is found the method will return the client object (this code\
    \ is not shown). However if a client has not been found the constructor for UnknownClientException\
    \ is invoked, using 'new'. This constructor requires a String parameter – and\
    \ the string we are passing here is an error message that is trying to be informative\
    \ and helpful. The message is specifying -\n\n+   * the class which generated\
    \ the exception (i.e. ClientBook),\n* the method within this class explains what\
    \ (i.e. GetClient()),\n* some text which caused the exception and\n* the value\
    \ of the parameter for which a client could not be found.\n\nBy defining an UnkownClientException\
    \ we are enabling methods calling this to catch a deal with potentially serious\
    \ errors."
  - "[PAGE 183]\n\n# 9.5 Catching Exceptions\n\nHaving specified to the compiler that\
    \ method may generate an exception we are enabling other programmers to protect\
    \ against potentially critical errors by placing calls to this method in a try\
    \ / catch block. The code in the try block will be terminated if an exception\
    \ is generated and the code in the catch block will be initiated.\n\nThus in the\
    \ example above the AwardLoan() method can decide what to do if no client with\
    \ the specified ID is found......\n\n```\ntry\n{\n    Client c = listOfClients.GetClient(clientID);\n\
