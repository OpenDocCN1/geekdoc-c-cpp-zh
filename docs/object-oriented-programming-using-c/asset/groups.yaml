    # 10.15 总结


    “敏捷”开发方法强调灵活的循环开发，使系统向解决方案演进。


    重构工具有助于敏捷开发方法。


    无论采用何种风格的开发过程，单元测试都是软件工程实践中重要的一部分。


    自动化单元测试框架允许在系统开发进行的过程中定期重复执行单元测试。


    测试驱动开发（TDD）反转了代码创建和测试创建的正常顺序，并在“敏捷”方法中起着主要作用。


    ![](img/e143b38d00f95425fa4f3efca0527189_201_0.png)


    # 11 案例研究


    本章将汇集之前章节的内容，通过一个示例案例研究，展示这些核心概念在实践中是如何运作的。


    ## 目标


    在本章结束时，你将看到：


    - 如何将问题描述转换为 UML 模型（如第 6 章所示）

    - 若干 UML 图图的示例（如第 2 章所示）

    - 继承和方法重写的用例（如第 3 章所示）

    - 多态的示例，并了解它如何简单地实现扩展（如第 4 章所示）

    - 如何有效使用泛型集合的示例，特别是将看到使用集合（set）和字典（dictionary）的示例（如第 7 章所示）

    - 使用序列化过程在在文件中存储这些集合的示例（如第 7 章所示）

    - 异常和异常处理的示例（第 9 章）

    - 自动化单元测试的示例（第 10 章）。

    - 最后你将看到自动文档工具的使用（如第 8 章所示）。


    本章全程描述的完整应用程序可以作为压缩文件免费下载。该文件可以解压并将项目加载到 Visual Studio 2010 中。


    Visual Studio 2010 快速版可以在 www.microsoft.com/express/Downloads 免费下载，但它不包含对单元测试的支持。


    用于描述系统的自动创建文档以一组网页的形式提供，因此可以使用任何网络浏览器查看。


    使用 C# 的面向对象编程


    案例研究


    本章由 16 部分组成：


    1) 问题

    2) 初步分析

    3) 进一步分析

    4) 使用 UML 记录设计

    5) 接口原型设计

    6) 为适应不断的需求而修改设计

    7) 类打包

    8) 消息类的编程

    9) 客户端类的编程

    10) 创建和处理 UnknownClientException

    11) 主类的编程

    12) 接口的编程

    13) 使用测试开发和扩展系统

    14) 生成文档

    15) 完成的系统

    16) 运行系统

    17) 结论


    ## 11.1 问题


    用户需求分析对于软件工程社区来说是一个具有重要意义的话题，完全超出本文的范围。本章的目的不是展示如何获取需求，而是展示在收集需求后，如何使用面向对象（OO）原则对问题陈述进行建模并转换为完整的运行系统。


    我们将设计解决方案的问题是：“为一家小型海滨零售商的滚动显示屏开发一个消息管理系统。”


    为了练习的目的，我们假设已经通过访谈店主和使用系统的员工完成了初步需求分析，并据此生成了以下文本描述：


    面向对象编程 C#


    # 案例研究


    Rory''s Readables 是位于海滨边的一家小店，销售各种便利商品，特别是针对当地居民和游客的书籍和杂志。它最近成为各种当地娱乐和交通提供商的票务代理。


    Rory 计划在店面上方安装一个可以显示文本消息的 LCD 消息板。Rory 意图用此推销他自己的产品和优惠，并为付费客户提供消息显示服务（例如：私人销售、失物招领、招聘人员等）。


    每个客户都有唯一的 ID 编号、名称、地址、电话号码和金额为“信用单位”的额度。维护一个客户簿，在其中添加客户，我们可以根据其 ID 查找客户。


    每条消息都针对特定的客户，包括要显示的文本和应该显示的天数。每条消息的成本为每天 1 个单位。不允许出现重复消息（即同一客户的相同文本）。


    需要维护一个当前消息集：可以添加新消息，可以在显示板上显示消息集，并且在每天结束时执行清理——每条消息的剩余天数减 1，其客户的额度扣除消息成本，并将任何过期或其客户被删除的消息从消息集中删除。


    软件应在显示板安装之前编写——因此，与显示板的连接应通过定义良好的接口以及一个为了测试目的在软件中实现的虚拟显示板来实现。


    根据上述描述，本章描述了如何对该问题进行分析、建模并编写解决方案——从而展示了书中讨论的技术。


    ## 11.2 初步分析


    为了对这些需求进行初步分析（如第 6 章所示），我们必须……


    - 列出名词和动词

    - 识别系统范围之外的事物

    - 识别同义词

    - 识别潜在的类、属性和方法

    - 识别任何共同特征


    通过阅读这些，我们可以看到第一段纯属背景，没有描述任何与软件相关的内容。


    ### 列表


    从剩下的段落中，我们可以列出以下名词或名词短语：


    - LCD 消息板

    - 店面

    - 滚动文本

    - 消息

    - 客户

    - ID 编号

    - 名称

    - 地址

    - 电话号码

    - 额度

    - 信用单位

    - 消息

    - 客户簿

    - ID

    - 文本

    - 天数

    - 消息成本（单位）

    - 当前消息集

    - 消息集

    - 显示板

    - 剩余天数

    - 客户额度

    - 消息成本

    - 软件

    - 连接

    - 接口

    - 虚拟显示板


    ### 动词列表


    以及以下动词：


    - 获取

    - 安装

    - 显示

    - 广告

    - 赋予（唯一的 ID）

    - 显示

    - 添加（客户）

    - 查找

    - 允许

    - （重复——不允许！）

    - 清理

    - 减少

    - 减少额度

    - 过期

    - 删除

    - 编写（软件）

    - 安装

    - 实现

    - 测试


    面向对象编程 C#


    # 系统范围


    通过识别系统之外的事物，我们可以简化问题……


    * 名词：

    - 店面

    - 软件

    * 动词：

    - 获取、安装（显示板）

    - 广告

    - 赋予（唯一的 ID）

    - 编写、安装、实现、测试（软件）


    店面不是系统的一部分，获取和安装显示板也不是系统的一部分，ID 由店主分配——而不是系统，而编写/安装软件是程序员的工作——它本身不是系统的一部分。


