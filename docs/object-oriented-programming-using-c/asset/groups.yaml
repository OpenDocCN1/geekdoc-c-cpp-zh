    \ InputBox 的表单。如果取消操作，输入框将返回一个空字符串。\n- 它检查是否点击了 OK 以及返回的 ID 是否为有效整数。\n- 在客户簿（client\
    \ book）上，通过传递 ID 参数调用 `GetClient()` 方法。\n- 假设返回了一个客户对象，调用 `ToString()` 方法获取客户的字符串表示，并将其作为参数传递给\
    \ `MessageBox.Show()` 方法（该方法显示该 ID 客户的详情）。\n- 如果 `GetClient()` 未能找到指定 ID 的客户，将抛出\
    \ `UnknownClientException` - 该异常将在此处被捕获并显示适当的消息。这使用了 `Exception` 类的 `Message`\
    \ 属性。\n\n## 11.12 使用测试驱动开发扩展系统\n\n我们现在有了一个可以运行的系统——尽管重要的方法尚未创建。我们需要一个增加客户信誉额度的方法——这应该被放置在类中。我们还需要一个删除客户的方法，这意味着将从客户簿中移除他们。这应该放置在\
