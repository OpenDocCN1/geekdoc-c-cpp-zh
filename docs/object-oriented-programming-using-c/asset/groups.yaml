  - '[PAGE 169]


    # Object Oriented Programming using C#


    This website provides, as a set of indexed web pages, essential details of the
    .NET libraries including all packages, classes, methods and method parameters
    and return values. This extremely useful information was not generated by hand
    but using the automatic tools.


    Tools can produce similar detailed documentation for any C# program you create
    and this would help future programmers and update your programs. However this
    relies on properly formatted (and informative!) XML-style comments in source files,
    including tags such as @author, @param etc.


    Because this documentation is generated automatically, at the push of a button,
    it saves programmers from a tedious, time consuming and error prone task. Furthermore
    the documentation can be updated whenever a program is changed.


    XML (Extensible Markup Language) is a way of specifying and sharing structured
    information.


    By adding meaningful XML comments to the code we write can produce automatic documentation
    for us. Poor attention to commenting of source code will result in poor documentation.
    On the other hand, if the commenting is done properly then the reference documentation
    is produced for virtually no effort at all.


    ![](img/e143b38d00f95425fa4f3efca0527189_169_0.png)'
  - "[PAGE 170]\n\n# Object Oriented Programming using C#\n\nXML comments should therefore\
    \ be added at the start of every class using the standard tags <summary> and <remarks>\
    \ to give an overview of the class in the following format.\n\n```\n/// <summary>\n\
    /// Provide a short description of the lass and its role here ....\n/// </summary>\n\
    /// <remarks>Author Simon Kendal\n/// Version 1.0 (5th May 2011)</remarks>\n```\n\
    \nSimilar comments should be provided for every method using the // <param name=\"\
    name of parameter\">, and/// <returns> tags to describe each parameter and describe\
    \ the value returned. The details of each parameter, starting with the name of\
    \ the parameter, should be provided on separate lines as shown below.\n\n```\n\
    /// <summary>\n/// A description of the method\n/// </summary>\n/// <param name=\"\
    name of first parameter\">A description of that parameter </param>\n/// <param\
    \ name=\"name of 2nd parameter\">A description of that parameter </param>\n///\
    \ <returns> A description of the value returned by a method. /// </returns>\n\
    ```\n\n# Activity 1\n\nThe method below takes two integer numbers and adds them\
    \ together. This value is returned by the method. Write an XML comment, using\
    \ appropriate tags, to describe this method.\n\npublic int add(int number1, int\
    \ number2)\n{\n return(number1 + number2);\n}\n\n# Feedback 1\n\n```\n/// <summary>\n\
    /// This method adds two integers.\n/// </summary>\n/// <param name=\"number1\"\
    >The first number.</param>\n/// <param name=\"number2\">The second number.</param>\n\
    /// <returns>The sum of the two numbers.</</returns>\n```"
  - '[PAGE 171]


    # Object Oriented Programming using C#


    Automatic tools cannot analyse comments to determine if these provide an accurate
    description of the methods, however tools can do far more than cut and paste comments
    to a web document. One doing tool is automate method signatures and compare this
    with the tags in the comments to check for logical errors. If a method requires


    parameters but the comment describes two this error will be detected and reported
    to the programmer.


    ```

    "Parameter ''name'' has no matching param tag in the XML comment for ''Name of
    class here'' (but other parameters do)\"

    ```


    By analysing the code tools can also provide additional information about the
    class, the methods that have been inherited and the methods that have been overridden.


    By using tools reference documentation can be produced for programmers using the
    class(es) concerned, it does not include comments within methods intended for
    programmers editing the source code in maintenance work.


    Automatic documentation tools do not exist as standard within either Microsoft
    Visual Studio or SharpDevelop. Both of these IDEs can be integrated with Sandcastle
    Help Builder... this enables automatic documentation to be generated. Better still
    another tool exists GhostDoc which further helps by generating the necessary XML
    comments.


    # 8.5 Sandcastle Help File Builder


    To be precise Sandcastle Help File Builder (SHFB) does not produce automatic documentation
    for your code... but it adds a graphical front end to ''Sandcastle.'' ''Sandcastle''
    is difficult to use tool that lacks a GUI, and has a complex installation routine
    but will generate automatic documentation.


    Sandcastle Help builder is a GUI that will drive Sandcastle and will automate
    the installation of Sandcastle. Sandcastle Help File Builder can be downloaded
    from http://shfb.codeplex.com/.


    Running this software will install


    +   - Sandcastle,

    - updates patches and additional files

    - compilers for different help file formats - only Help 1 HTML compiler

    - Sandcastle Help File itself.


    When running SHFB needs to specify an XML file with comments generated from your
    code and the C# code itself i.e. a .sln


    To generate the XML file from Visual Studio select the project Properties / Build
    / XML comments. Note Visual Studio will then complain if comments are missing
    from your code.'
  - '[PAGE 172]


    # 8.6 GhostDoc


    SHFB is very useful as it generates automatic documentation for your programs
    assuming of course appropriate XML comments exists in the body of the code.


    GhostDoc is one piece of software that will automatically add XML comments to
    your C# code. Though the comments should be edited to ensure they are meaningful.


    GhostDoc can be downloaded from http://submain.com/products/ghostdoc.aspx


    # 8.6 Adding Namespace Comments


    One final complication regarding namespace comments.


    A room exists and it is possible to go outside of that room and put a sign on
    the door. A building exists and we can do the same i.e. go outside and put a sign
    on the building while while the Universe exists we cannot go outside and put a
    sign on it ... because outside does not exist!


    A similar problem exists with namespace comments.


    ![](img/e143b38d00f95425fa4f3efca0527189_172_0.png)'
