  mdcn: "\n\n# 使用 C# 泛型集合进行面向对象编程及其序列化方法\n\n在这些情况下，CLR 引擎分别将 `int`、`double` 和 `Student`\
    \ 对象视为可用的最通用类型“对象（Object）”。它随后会将此对象转换为字符串并进行字符串比较。\n\n然而，在许多情况下，创建接收 `Object`\
    \ 类型作为参数的方法是有缺陷的，或者至少局限性非常大。\n\n在这些方法内部，我们不知道实际传递作为参数的是什么类型的对象，因此在上面的示例中，我们不知道实际返回的是什么类型的对象。当传递两个\
    \ `Student` 对象时，返回的对象是一个 `student`，但除非先将返回的对象强制转换为 `Student` 类型，否则我们无法在该对象上调用\
    \ `Student` 特有的方法。\n\n![](img/e143b38d00f95425fa4f3efca0527189_130_0.png)\n\n\
    # 面向对象编程 C# 泛型集合及其序列化方法\n\n假设我们要对通过 `Highest()` 方法返回的 `Student` 调用 `AwardMerit()`\
    \ 方法。如果我们先将 `Object` 强制转换为 `Student` 对象，就可以这样做。例如：\n\n```\n(Student)Highest(studentA,\
    \ studentB).AwardMerit();\n```\n\n然而，编译器无法确定返回的对象是 `Student`，且编译器无法检测到潜在的关键错误——如果我们对两个整数调用\
    \ `Highest()`，然后尝试将返回的整数强制转换为 `Student` 对象，就会发生错误。\n\n这引出了一个想法：我们希望创建一个方法，它可以接收**任意**类型的参数并返回同样**任意**类型的值，但在我们调用这些方法时定义这些类型。这种方法是存在的，被称为泛型方法（Generic\
    \ Methods）。\n\n泛型方法是在在调用方法时才定义定义参数类型的方法。参数类型在每次调用方法时进行指定，编译器仍然可以检查代码是否有效。\n\n\
    在其他方面，泛型方法使用了一个由参数确定的数据类型。\n\n在下面的代码中，定义了一个泛型方法 `Highest()`，它接受两个未指定类型的对象作为参数——\n\
    \n```\npublic T Highest<T>(T o1, T o2)\n{\n    if (o1.ToString().compareTo(o2.ToString())\
    \ > 0)\n        return o1;\n    else\n        return o2;\n}\n```\n\n我们可以使用此方法，并在每次调用它时定义正在比较的对象的类型。如果比较两个\
    \ `students`，编译器将知道返回的对象也是 `student` 类型，因此知道在该对象上调用特定方法是合法的。\n\n在方法名称后的角括号 `<\
    \ >` 中提供了一个泛型数据类型列表。如果一个方法使用了多个泛型类型，它们的名称将用逗号分隔。\n\n在上面的示例中，标识符 `T` 可以代表任何数据类型。因此，当\
    \ `T` 在方法参数列表的括号内用于描述数据时，它可以是 `int`、`'Student'` 或任何其他数据类型。唯一的要求是该方法无论传递什么种类型的对象都必须有效。所有对象都有\
    \ `ToString()` 方法，因为每个数据类型都继承了 `Object` 类的 `ToString()` 方法，或者包含了其重写版本。\n\n# 面向对象编程\
    \ C#\n\n在下面的用例中指定了一个泛型数据类型。它用于定义两个参数和返回值的类型。\n\n泛型方法的泛型数据类型标识符可以是任何合 C# 标识符，但按照惯例，通常使用大写字母。“T”用于“类型（type）”。\n\
    \n当定义泛型方法时（即处理任何数据类型的方法），其类型是在使用该方法时指定的。因此，在下面的代码中，`Highest()` 是一个泛型方法，编译器可以看到传递了\
    \ `' `'Student'` 对象作为参数，因此返回的对象也必须是 `'Student'` 类型。\n\n```\nStudent s1 = new Student(\"\
    Student A\");\nStudent s2 = new Student(\"Student B\");\nStudent highestStudent\
    \ = Highest(s1, s2);\n```\n\n由于返回的对象类型为 `'Student'`，将其存储在类型为 `Student` 的变量中必须是安全的，并且在返回的对象上调用\
    \ `Student` 方法必须是安全的。\n\n因此，泛型方法可以处理任何数据类型，但编译器仍然可以检查类型错误（因为类型在每次调用方法时都是指定的）。\n\
    \n已经基于与泛型方法相同的机制创建了泛型类，这些类特别有用。\n\n在下面的用例中指定了一个泛型数据类型。它用于定义两个参数和返回值的类型。\n\n泛型方法的泛型数据类型标识符可以是任何合\
    \ C# 标识符，但按照惯例，通常使用大写字母。“T”用于“类型（type）”。\n\n当定义泛型方法时（即处理任何数据类型的方法），其类型是在使用该方法时指定的。因此，在下面的代码中，`Highest()`\
    \ 是一个泛型方法，编译器可以看到传递了 `'Student'` 对象作为参数，因此返回的对象也必须是 `'Student'` 类型。\n\n```\nStudent\
    \ s1 = new Student(\"Student A\");\nStudent s2 = new Student(\"Student B\");\n\
    Student highestStudent = Highest(s1, s2);\n```\n\n返回的对象类型为 `'Student'`，将其存储在类型为\
    \ `Student` 的变量中必须是安全的，并且在返回的对象上调用 `Student` 方法必须是安全的。泛型方法可以处理任何数据类型，但编译器仍然可以检查类型错误（因为类型在每次调用方法时都是指定的）。\n\
