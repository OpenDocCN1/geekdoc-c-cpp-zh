    # Conditions


    A condition may influence the firing of a transition. Such a transition is known
    as a guarded transition (see Figure D.15). It fires when its event occurs, but
    only if the guard condition is true. A guard condition on a transition is shown
    in brackets following the event name.


    ![](img/de72044e5491d3e39cd5d97015354b1a_457_0.png)


    # Activity


    An activity is an operation that executes over a period of time. An activity may
    continue to execute as long as an object remains in a particular state. Activities
    may run continuously or terminate on their own after an interval of time. The
    notation for specifying that an activity executes as long as the state remains:
    *do: A* within the state box.


    # Actions


    An action is an instantaneous occurrence that occurs when an event occurs. An
    action on a transition is denoted by a slash (/) and its name, following the name
    of the event that causes it. Figure D.16 shows activities and actions.


    ![](img/de72044e5491d3e39cd5d97015354b1a_457_1.png)


    # Relation of object and dynamic models


    The dynamic model specifies the sequences in which operations of an object can
    be called. States represent the attribute and link values for the object that
    may exist concurrently. Events are nothing but operations on the object.


    # Functional Model


    The functional model depicts the transformations of input values into output values.
    The order in which the transformation takes place is not modeled here. Transformations
    are depicted using data flow diagrams. The functional model consists of multiple
    data flow diagrams.'
