  md: "Now, let us call the function as:\n\nnext_day(date);\n\nThe values of 'date[0]',\
    \ 'date[1]', and 'date[2]' will be correctly set to 1, 3, and 1999, respectively.\
    \ Although this method seems to work, it certainly appears uncanny. After all\
    \ any integer value can be passed to the function, even if it does not necessarily\
    \ represent a date. There is no data type of date itself. Moreover, solution of\
    \ arrays will not work if the variables are not of the same type. The solution\
    \ to this problem is to create a data type called itself using structures\n\n\
    ```\nstruct date\n{\n    int d, m, y;\n}\n```\n\nNow, the next_day() function\
    \ will accept the address of a variable of the structure as a parameter. Accordingly,\
    \ its prototype will be as follows:\n\n```\nvoid next_day(struct date *);\n```\n\
    \nLet us call it as shown in Listing 1.2.\n\n# Listing 1.2 The need for structures\n\
    \n```\nstruct date d1;\nd1.d=28;\nd1.m=2;\nd1.y=1999;\nnext_day(&d1);\n```\n\n\
    'd1.d', 'd1.m', and 'd1.y' will be correctly set to 1, 3, and 1999, respectively.\
    \ Since the function takes the address of an entire structure variable as a parameter\
    \ at a time, there is no chance of variables of the different groups being sent\
    \ to the function.\n\nStructure is a programming construct in C that allows us\
    \ to put together variables that should be together.\n\nLibrary programmers use\
