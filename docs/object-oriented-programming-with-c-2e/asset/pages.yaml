  md: "# Introduction to C++\n\nEspecially, you must remember that the expression\
    \ on the left of the assignment operator must be capable of being evaluated at\
    \ a valid address at which data can be written.\n\nNow, let us study reference\
    \ variables. A reference variable is nothing but a reference for an existing variable.\
    \ It shares the memory location with an existing variable. The syntax for declaring\
    \ a reference variable is as follows:\n\n```\n<data-type> & <ref-var-name>=<existing-var-name>;\n\
    ```\n\nFor example, if 'x' is an integer-type variable and we want to declare\
    \ iRef as a reference to it the statement is as follows:\n\n```\nint &iRef=x;\n\
    ```\n\niRef is a reference to 'x'. This means that iRef and 'x' have separate\
    \ entries in the OS, their addresses are actually the same!\\ Thus, a change in\
    \ the value of 'x' will naturally reflect in iRef and vice versa.\n\nListing 1.16\
    \ Reference variables\n\n```\n/*Beginning of reference01.cpp*/\n#include<iostream.h>\n\
