    conversions. New style casts for implementing type conversions are explained.
    This chapter ends with a treatment of run time type information (RTTI).


    Chapter 9 explains and illustrates the most important data structures—linked lists
    and trees. It includes full-fledged programs that can be used to create various
    data structures.


    Chapter 10 contains a detailed description of templates. The importance of function
    templates and class templates and their utilization in code reuse is explained.
    This chapter also provides an overview of the Standard Template Library (STL)
    of C++.


    Chapter 11 explains the concept of exception handling. It begins with a section
    on conventional methods and their drawbacks. This is followed by an explanation
    of the catch-throw mechanism provided by C++ and its superiority over the conventional
    methods.


    The appendices in the book include a case study, comparison of C++ with C, comparison
    of C++ with Java, an overview of object-oriented analysis and design, and self
    tests.


