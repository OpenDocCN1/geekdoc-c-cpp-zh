    \ class whose objects will behave like pointers to the class String. See Listing\
    \ 8.59.\n\n# Listing 8.59 A class of smart pointers\n\n```\n/*Beginning of StrPtr.h*/\n\
    #include \"String.h\"\nclass StrPtr\n{\n    String * p;\npublic:\n    StrPtr(String&);\
