    protected:\int y;

    public:

    int z;

    }

    /*End of A.h*/

    ```


    ```

    /*Beginning of B.h*/

    #include"A.h"

    class B : public A

    {

    public:

    void xyz();

    }

    /*End of B.h*/

    ```


