    The definition of the String :: add() function can be the same as the operator-overloading
    function to overload the addition operator (+).


    However, operator overloading becomes mandatory under the following circumstances:


    +   * Objects of the class acquire resources dynamically during run time and no
    two objects share the same copy of the resource.

    * Objects of the class acquire some resources dynamically during run time and
    no two objects should share even different copies of the resource.

    * Objects need to be passed as parameters in function templates and the operators
    used on template class objects should work in the same way as objects.

    * The default action of the memory management operators (new and delete) are unsuitable
    for the class designed.

    * Change in the implementation of the class forces an undesirable change in its
    interface turn necessitating the rewriting and recompiling of the application
    programs.

    * Overloading provides better readability of code. Although this is a somewhat
    weak reason, it, nevertheless, is a factor that can be considered.


    o2 = ++o1;

    isuch more readable than say a statement such as


    ```

    o2 = o1.pre_fix_increment();

    ```


    Let us understand these circumstances by one one. For understanding the first
    case, let us reconsider the class String. Let us try to visualize what happens
    at the end of the block code in Listing 8.5.


    | Listing 8.5 Undesirable default action of the assignment operator |


    ```

    String s1("abc"), s2;

    s2 = s1;

    ```


    As a result of the second statement in Listing 8.5, the scenario shown in Figure
    8.1 emerges.


