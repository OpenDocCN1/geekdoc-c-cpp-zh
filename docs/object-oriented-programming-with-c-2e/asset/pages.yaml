  md: '# 7.3.2 Input/Output of Character Data


    There is no difference between text mode I/O and binary mode I/O with respect
    to charetype variables. In both modes, the value of the character-type data is
    copied from the memory into the output file as it is and copied from the input
    file into the memory as it is.


    If a function that outputs in binary mode is called to output the value of a character
    variable, it will copy its value into the output file without transforming its
    representation in any way. A function that outputs in text mode will output the
    value of a character-type variable in the same way.


    # 7.3.3 Input/Output of Numeric Data


    A standard library function that outputs numeric data in text mode will reckon
    the data, which is in base 2 in the memory, needs to be output in base 10 (text)
    format. It will therefore read the value of the source variable from memory, *transform*
    the representation of the data from the existing base 2 to base 10 and only copy
    it to the output file.


    Whereas a standard library function outputs numeric data in binary mode will reckon
    the data, which is in base 2 in the memory, needs to be output in base 2 (binary)
    format itself. It will therefore read the value of the source variable from memory,
    *not transform* the data from the existing base 2 to base 10 and simply copy it
    to the output file.


    Further, a standard library function that inputs numeric data in text mode will
    reckon the data, which is to be input, in base 10 (text) format. It will therefore
    read the value from the input file, *transform* the representation of the data
    from the existing base 10 to base 2 and only copy it to the target variable in
    memory.


    Whereas a standard library function that inputs numeric data in binary mode will
    reckon the data, which is to be read, already in base 2 (binary) format. It will
    therefore read the value from the memory, *not transform* the data in any way
    and simply copy it to the target variable in memory.


    # Significance of the difference between binary mode and text mode I/O for numeric
    data


    Suppose the value of an integer-type variable is ''65''. The value ''65'' is stored,
    in the memory block of four bytes occupied by the variable, in binary mode.


    The foregoing data will copy four bytes with the *same* bit setting in the output
    file, if it is copied by an output function that outputs binary mode.


    If this function is used to output to the monitor, instead of a disk file, the
    value ''A'' by three blank spaces will be displayed. This is the lowest of the
    variable ''65'', which is the ASCII equivalent of ''A'' and the rest of the three
    bytes have all their bits set to zero. The monitor displays the ASCII equivalent
    of each value in byte in the output stream is supplied to it. But we will see
    ''65'' and not ''A'' by three blank spaces on the monitor.


    However, if the value is copied by an output function in text mode, this data
    will copy two bytes with a different bit setting in the output file. The first
    byte will have bits set to represent the character ''6'' (The ASCII equivalent
    of ''6'') will be stored in base 2 format). While the second byte will have its
    bits set to represent the character ''5'' (The ASCII equivalent of ''5'') will
    be stored in base 2 format. This is because the output function, since it works
    in text mode, has transformed the representation of the data from base 2 to base
    10.'
