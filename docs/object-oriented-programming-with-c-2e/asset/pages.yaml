  md: "# Constructors and Destructors\n\nConsider the statement that declares an object\
    \ of a class A in Listing 4.1.\n\n+   **Listing 4.1** Constructor gets called\
    \ automatically for each object when it is created\n\n```\n/*Beginning of AMain.cpp*/\n\
    #include\"A.h\"\nvoid main() {\n    A A1;           //object declared constructor\
    \ called\n}\n/*End of AMain.cpp*/\n```\n\nThe statement in the function main()\
    \ in Listing 4.1 is transformed into the following statements.\n\n```\nA A1; \
    \          //memory allocated for the object (4 bytes)\nA1.A(); //constructor\
    \ called implicitly by compiler\n```\n\nThe second statement above is then transformed\
    \ to\n\n```\nA(&A1); //see Chapter 2\n```\n\nSimilarly, the constructor is called\
    \ for each object that is created dynamically on the heap by the new operator.\n\
    \n```\nA * ATr;\nAPtr = new A; //constructor called implicitly by compiler\n```\n\
    \nThe second statement above is transformed into the following two statements.\n\
    \n```\nAPtr = new A; //memory allocated\nAPtr->A(); //constructor called implicitly\
    \ by compiler\n```\n\nThe second statement above is then transformed into\n\n\
    ```\nA(APtr); //see Chapter 2\n```\n\nThe following explanations make one thing\
