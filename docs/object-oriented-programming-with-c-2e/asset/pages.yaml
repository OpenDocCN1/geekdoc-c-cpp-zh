    # 8.1.2 Compiler Interpretation of Operator-overloading Functions\n\nIt is important\
    \ to understand how the compiler interprets operator-overloading functions.\n\
    The statement\n\n```\ns3 = s1 + s2;  //s1, s2 and s3 are objects of the class\n\
    //String\n```\n\nis interpreted as\n\n```\ns3 = s1.operator + (s2);\n```\n\nIf\
    \ the operator-overloading function has been declared as a member function, then\
    \ this interpretation is satisfied. Otherwise, the statement is interpreted as\n\
    \n```\ns3 = operator + (s1, s2);\n```\n\nIf the operator-overloading function\
    \ has been declared as a friend function, then this interpretation is satisfied.\
    \ Otherwise, the compiler reports an error to the given that operator has not\
    \ been overloaded for the class. It is interesting to note that the compiler does\
    \ not say that invalid operators have been passed to the operator!\n\nSo, we have\
    \ seen that the operators have been overloaded within the classes using member\
    \ functions or friend functions. These functions are compiled and stored in the\
    \ library.\n\nWe have also seen that the overloaded functions have been used in\
    \ the applications using their usual syntax. As described in this, the compiler\
    \ first converts the statement where the overloaded operators are used. However,\
    \ we must note that the operator-overloading functions can also be called directly\
    \ from the application programs (way the compiler perfectly interprets it). Operator-overloading\
    \ functions can be called directly as follows:\n\n```\ns3 = s1.operator + (s2);\
    \  //in case of member function\n```\n\nor\n\n```\ns3 = operator + (s1, s2); \
