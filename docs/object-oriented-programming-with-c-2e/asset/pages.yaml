    Definitions of the classes and associations modeled earlier are completed in the
    object design phase. Algorithms to be used in the operations are also finalized.


    # **Overview of Object Design**


    The list of objects found during analysis is revised with an intention to minimize
    execution time and memory.

    The `object model` describes the classes of objects in the system, including their
    attributes and the operations they support.

    The functional model describes the operations that the system must implement.
    During design we must decide how each operation is implemented.

    The dynamic model describes how the system responds to external events. The control
    structure for a program is primarily derived from the dynamic model.

    Actions and activities of the dynamic model and the processes of the functional
    model are converted to operations.

    While designing classes we decide when to use values of fundamental types for
    data members and when to use another object. Classes can contain objects of other
    classes, but eventually everything must be implemented in built-primitive data
    types.


    # **D.6 Implementation**


    Writing code is an extension of the design process. Writing code should be straightforward,
    almost mechanical, because all the difficult decisions already have been made
    during design. The code should be a simple translation of the design code written
    in a particular programming language.

    Classes are declared first. Attributes and operations mentioned in the object
    diagram are declared as private, protected, or public members.

    We have already studied how a class can be defined in C++, how members can be
    declared in these classes, how objects of these classes can be declared and how
    member functions can be called with respect to the declared objects. We also studied
    how inheritance can be implemented in C++. Now is the time to carry out these
    activities with respect to the object design just created.

    There are two general approaches for implementing associations—buried pointers
    and distinct associations.

    A binary is frequently implemented as a buried pointer in each of the objects
    that point at the related object or the set of related objects of the associated
    class. Updating one pointer in the implementation of an association implies that
    the other pointer must be updated as well to keep the implementation consistency.

    Association can also be implemented as an associative container class (maps and
    sets).'
