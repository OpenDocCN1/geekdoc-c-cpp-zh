  md: "# Listing 8.12 Declaring member function to overload the increment operator\n\
    \n```\n/*Beginning of Distance.h*/\nclass Distance\n{\n  public:\n    /*\n   \
    \   rest of the class Distance\n    /\n    Distance operator ++ ();\n};\\n/*End\
    \ of Distance.h*/\n/*Beginning of Distance.cpp*/\n#include \"Distance.h\"\nDistance\
    \ Distance :: operator ++ ()\n{\n  return Distance(+iFeet, fInches);\n}\n/*\n\
    \  definitions of the rest of the functions of class\nDistance\n*/\n/*End of Distance.h*/\n\
    ```\n\nThe operator-overloading function should be public because it will mostly\
    \ be called from within functions that are not members of the class Distance.\
    \ It should not be a constant member function because it will modify the value\
    \ of at least one of the data members (iFeet) of the calling object. Although\
    \ the definition of the operator-overloading function appears cryptic, it is in\
    \ fact very simple (and economical). First, the increment operator works (it is\
    \ in prefix notation). Thus, the iFeet data member of the calling object gets\
    \ incremented. The explicit call to the constructor creates a nameless object\
    \ of the class Distance by passing the incremented value of iFeet and the unaltered\
    \ value of fInches as parameters. Thus, the operator-overloading function returns\
    \ the nameless object constructed. If the call to the operator-loading function\
    \ is on the right-hand side of the assignment operator, the values of the returned\
    \ object will expected be copied to the object on the left. Thus, our purpose\
    \ is served.\n\nHowever, we would like a different effect to be produced if we\
    \ write the statement\n\n```\nd2 = d1++;\n```\n\nIn this case, we would like the\
    \ initial value of 'd1' to get copied to 'd2' and thereafter, the value of iFeet\
    \ data member of 'd1' to get incremented. However, if the compiler interprets\
    \ both statements\n\n```\nd2 = ++d1;\n```\n\nand\n\n```\nd2 = d1++;\n```\n\nin\
    \ identical ways, then we will have no way of writing the two different functions.\
    \ Fortunately, this is not so. While the compiler interprets the statement\n\n\
    ```\nd2 = ++d1;\n```\n\nas\n\n```\nd2 = d1.operator ++ ();\n```"
