    It is expected that a class will get derived from class A. The derived class may
    override the show() function of class A. The overriding function will add the
    extra code that is relevant to the derived class. To complete the picture, in
    this way, the base class function will call back the overriden function A::show(),
    which will get successively refined by the overriding functions of the derived
    classes.


    However, as Listing 6.4 shows, the address of a derived class is so far ineffective.
    It is desirable that the address of an object of the derived class be passed to
    the X::abc() function, then the B::show() function should be called (see Listing
    6.4). If this happens, the same X::abc() function will prove useful irrespective
    of the type of object being passed to it. Unfortunately, an extension of the class
    hierarchy has so far remained


    We must realize that derived classes such as class B may be defined after many
    functions such as X::abc() have been defined.

    Moreover, the function X::abc() should work well whether the address of an object
    of the base class A is passed as a parameter to it or the address of an object
    of any of the derived classes is passed.


    In the present situation, it appears necessary to redefine the X::abc() function
    corresponding to each derived class of A. That is, X::abc(A *) should be copied
    and redefined with a pointer of the derived class as a argument. For example,
    X::abc(A *), X::abc(B *), this is certainly impossible because the definition
    of the abc() will be inaccessible to the programmer who is defining the derived
