  md: '# Preface to the Second Edition


    The object-oriented programming system OOPS enables a programmer to model real-world
    objects. It allows the programmer to add characteristics like data security, data
    encapsulation, etc.


    In the procedure-oriented programming system, procedures are dissociated from
    data and are not part of it. Instead, they receive structure variables, or their
    addresses, and work upon them. This code design is centered around procedures.
    While this may seem obvious, this programming pattern has its drawbacks, a major
    one being that the data is not secure. It can be manipulated by any procedure.


    It is the lack of data security of the procedure-oriented programming system led
    to OOPS, in which, with the help of a new programming construct and new keywords,
    associated functions of the data structure can be given exclusive rights to work
    upon variables.


    There is another characteristic of real-world objects—a guaranteed initialization
    of data. Programming languages that implement OOPS enable library programmers
    to incorporate this characteristic of real-world objects into structure variables.
    Library programmers can ensure a guaranteed initialization of data members to
    the desired values. For this, application programmers do not need to write code
    explicitly.


    OOPS further supports the following concepts:


    +   * **Inheritance** This feature allows a class to inherit the data and function
    members of an existing class.


    +   * **Data abstraction** Data abstraction is a virtue by which an object hides
    its internal operations from the rest of the program.


    +   * **Modularity** This feature supports dividing a program into small segments
    and implement those segments using different functions.


    +   * **Polymorphism** Through polymorphism, functions with different set of formal
    arguments can have the same name.


    The first edition had covered the fundamentals of the object oriented programming
    system in depth. These explanations in the first edition held true for any programming
    language that supports OOPS. This second edition enhances coverage, as listed
    below.


    # New to this Edition


    +   * New chapter on data structures containing new and original algorithms, especially
    elegant and simple recursive algorithm for inserting nodes into trees. The explanations
    are elaborate and full of diagrams.


    +   * New sections on explicit constructors, command line arguments, and re-throwing
    exceptions.'
