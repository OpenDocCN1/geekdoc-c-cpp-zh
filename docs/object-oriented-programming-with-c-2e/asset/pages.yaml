  md: 'Overall development time is not always less in OOAD as compared to the conventional
    methodology. The benefit is that the resulting model is better suited for future
    use. Downstream errors and maintenance efforts also get reduced.


    # D.2 Object-Oriented Model


    An object-oriented model consists of the following three kinds of models:


    +   - Object model

    - Dynamic model

    - Functional model


    The object model describes the objects in the system and the relationships amongst
    objects. It consists of object diagrams.

    The dynamic model describes how objects in the system interact with each other.
    It consists of state diagrams. A state diagram depicts states and transitions
    between states that are caused by events.

