  md: "# 120 Object-Oriented Programming with C++\n\nDefining the member functions\
    \ of classes A and B is left as an exercise.\nThis highly simplified example (Listing\
    \ 5.1) effectively illustrates the basic mechanisms of inheritance. An object\
    \ of class B (the derived class) contains two integers (one from class B and the\
    \ other from class A). Therefore, its size will be 8. Also, with respect to an\
    \ object of class B, we can call member functions of class B as well as those\
    \ of class A.\n\nAn object of the derived class will contain the data members\
    \ of the base class as well as the data members of the derived class. Thus, the\
    \ size of an object of the derived class will be equal to the sum of the sizes\
    \ of the data members of the base class plus the sum of the data members of the\
    \ derived class.\n\nInheritance implements an 'is-a' relationship. A derived class\
    \ is a type of base class just like an aircraft (derived class) is a type of vehicle\
    \ (base class). Contrast this to composition that implements a 'has-a' relationship.\
    \ A manager may contain an object of another class or a pointer to a data structure\
    \ that contains a set of objects of another. Such a class is known as a container\
    \ class. For example, an aircraft has one engine or an array of engines.\n\nAnother\
    \ example can be that of a manager class and employee class. A manager (i.e.,\
    \ an object of the class manager) is an employee (i.e., an object of the class\
    \ employee). Nevertheless, it has some features that are not possessed by all\
    \ employees. For example, it may have a pointer to an array of employees that\
    \ report to him. Derived class is also a (as shown in the following lines of code).\n\
    \n```\nclass employee\n{\n    String name;\n    double basic;\n    Date doj;\n\
    \    /*\n    rest of the class employee\n    */\n};\nclass manager : public employee\
    \ //manager is an employee\n{\n    employee * list;\n    /*\n    rest of the class\
    \ manager\n    */\n}\n```\n\nA derived class contains additional data and members\
    \ and is thus a specialization of its base class. Therefore, the process of inheritance\
    \ is also known as specialization.\n\n# 5.1.2 Benefits of Inheritance\n\nThis\
    \ process of adding only the additional data members in the derived class has\
    \ implications. The base class can have a generic common definition. The data\
    \ and functions that are common to more than one class can be put together in\
    \ the base class. While only the special ones can be put in each of the derived\
    \ classes. Thus, inheritance is another feature of C++ that enables code reuseability.\n\
    \n# 5.1.3 Inheritance in Actual Practice\n\nIn actual, the library programmer\
    \ defines a certain class and its member functions. Another interested programmer,\
    \ in order to create his/her application, then inherits from it"
