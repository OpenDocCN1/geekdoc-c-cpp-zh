  md: '# Preface to the Second Edition


    +   - Expanded glossary.

    - Accompanying CD contains all the program codes given in the text.


    # Key Features


    +   - Simple and concise language explains the understanding of complex concepts
    that made C++ powerful but enigmatic.

    - Plenty of solved examples with complete program listings and test cases to reinforce
    learning.

    - Review questions and program exercises at the end of each chapter to provide
    additional practice.

    - Self-tests at the end of the book to prepare the students for examinations.


    # Organization of the Book


    A brief knowledge of C language is a prerequisite for this book. The readers need
    to know how programs are written in C, data types, decision-making and looping
    constructs, operators, functions, header files, pointers, and structures.


    Chapter 1 contains an explanation of the procedure-oriented programming system,
    the role played by structures in its system, its drawbacks and how these led to
    the creation of OOPs. The meaning of modelling real-world objects by the object-oriented
    programming system has been clearly explained. The chapter explains a study of
    the non-object features of C++.


    Chapter 2 is devoted to the study of objects and classes. It gives a thorough
    explanation of the class construct of C++. Superiority of the class construct
    of C++ over the structure construct of C language is explained. A description
    of the various types and features of functions and member data is included. Other
    concepts like namespaces, arrays of objects, arrays in objects, and nested classes.


    Chapter 3 deals with dynamic memory management. It explains the use of the new
    and the delete operators. It also explains the method of specifying our new handler
    for handling out-of-memory conditions.


    Chapter 4 explains constructors and destructors. It discusses their importance,
    their features, and the method of defining them.


    Chapter 5 is devoted to inheritance. Concepts like base class, derived class,
    base class pointer, and derived class pointer are covered. The protected keyword
    and the implications of deriving by different access specifiers are explained.
    This chapter describes various types of inheritance.


    Chapter 6 gives a detailed explanation of one of the most striking features of
    C++—dynamic polymorphism. This chapter describes the virtual functions and how
    it enables C++ programmers to extend class libraries. The importance of pure virtual
    and clone functions is also explained.


    Chapter 7 describes the standard C++ library for handling streams. It explains
    the two types of input and output—text mode and binary mode. Input and output
    from disk files are explained. The chapter also describes the use of error-handling
    routines of the C++ stream library and manipulators.


    Chapter 8 is devoted to operator overloading, type conversion, new styles, and
    RTTI. This chapter explains the various intricacies and the proper use of operator
    overloading. This chapter also explains how a C++ programmer can implement conventional
    style type'
