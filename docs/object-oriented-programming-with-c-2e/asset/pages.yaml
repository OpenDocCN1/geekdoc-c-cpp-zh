  md: '# Object-Oriented Programming with C++


    Programs having inline functions to run faster than equivalent programs with non-inline
    functions. A function is declared inline either by defining it inside a class
    or by declaring it outside with the keyword inline. This feature should be used
    sparingly. Otherwise, the increased size of the executable can slow it down.


    Required member functions can be declared as constant functions to prevent an
    inadvertent change in the data members. A function can be declared as a constant
    by suffix its prototype in the header of the class by the keyword const.


    A mutable data member is never constant. It is modified inline constant function.
    A friend non-function that has right to access private data members of the class
    of which it is a friend does not really negate the philosophy of OOPS. A friend
    function still needs to be declared inside the class of which it is a friend.
    The advantage of friend function is that it is not called with respect to object.


    A global non-function can be declared as a friend to a class. Member function
    of one class can be declared as a friend of another. A class or a function is
    declared to a desired class by prototyping it in the class and prefixing the prototype
    with the keyword friend.


    Only one copy of a static data member exists for the entire class. This is in
    contrast to non-static members that exist in each object. Static data members
    are used to keep data that relates to the entire set of objects that exist at
    any point during the program''s execution. A data member declared as a static
    member is a class by prefixing its declaration by the keyword static.


    Static member functions can access static data members only. They can be called
    without declaring any objects. A member function is declared as static member
    of a class by prefixing its declaration in the class by the keyword static.


    Objects can appear as local variables inside functions. They can be passed by
    value or by reference to functions. Finally, they can be returned by value or
    by reference from functions.


    Arrays of class can be created. Arrays inside classes also. One class can be defined
    inside another class. A class that is known as a nested class. The class that
    contains the nested class is known as the enclosing class. Nested classes can
    be defined in the private, protected, or public portions of the enclosing class.


    Namespaces enable the C++ programmer to prevent pollution of the global namespace.
    They help prevent name clashes.


    # Key Terms


    +   - class

    - private access specifier

    - public access specifier

    - objects

    - scope resolution operator

    - this pointer

    - data abstraction

    - arrow operator

    - overloaded member functions

    - default values for formal arguments of functions

    - inline member functions

    - constant member functions

    - mutable data members

    - friend non-member functions

    - friend classes

    - friend member functions

    - friends as bridges

    - static data member

    - static member functions

    - nested classes


    # Exercises


    +   1. How does the class construct enable data security?

    2. What is the use of the scope resolution operator?

    3. What is this pointer? Where and why does the compiler insert it implicitly?

    4. What is abstraction? How is it implemented in C++?

    5. Which operator is used to access a class member with respect to a pointer?'
