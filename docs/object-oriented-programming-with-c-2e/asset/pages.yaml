    \nmatching char * type. The one and only catch block that follows the try block\
    \ is of char * type. Therefore, the statements enclosed within it are executed.\
    \ Figure 11.1 illustrates this.\n\nIn the introduction of this chapter, we had\
    \ realized that an ideal solution to the problem of handling runtime errors should\
    \ enable the library to sense and dispatch errors and the application to trap\
    \ the dispatched error and take appropriate action. The exception-handling mechanism\
    \ of C++ meets this requirement perfectly.\n\nIn order to appreciate the superiority\
    \ of exception handling over the C-style solutions, we should follow the following\
    \ things in mind:\n\n+   * It is necessary to catch an exception if it is thrown.\n\
    * When an exception is thrown, the stack is unwound.\n\n# 11.3.1 It is Necessary\
    \ to Catch Exceptions\n\nThe program terminates immediately if an exception thrown\
    \ by a called function is not caught by the calling function. (A point to be borne\
    \ in mind is that it is illegal to have a try block without a catch block.) The\
