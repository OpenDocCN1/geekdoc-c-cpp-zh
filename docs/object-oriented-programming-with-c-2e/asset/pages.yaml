  md: "We can specify our own handler function also! We can specify that the new operator,\
    \ upon encountering an out-of-memory condition, calls a function of our choice.\
    \ We can do this by calling the `set_new_handler()` function and passing the name\
    \ of the desired function as a parameter to it. The prototype of the `set_new_handler()`\
    \ function clarifies this. The prototype is in the new.h header file.\n\n```\n\
    new_handler set_new_handler(new_handler);\n```\n\nObviously, `new_handler` is\
    \ a data type. It is a pointer type. The first argument of `set_new_handler()`\
    \ is a function pointer. If we pass the name of our desired function as a parameter\
    \ to the `set_new_handler()`, all out-of-memory conditions cause the new operator\
    \ to call it. Our desired function becomes the new handler. Moreover, with the\
    \ `set_new_handler()` function called, it returns a pointer to the previous new\
    \ handler.\n\nAn illustrative example follows in Listing 3.10.\n\n# Listing 3.10\
    \ Specifying a new handler function\n\n```\n/*Beginning of newHandler.cpp*/\n\
    #define BIG_NUMBER 9999999\n#include<new.h> //for set_new_handler() function\n\
    void myHandler()\n{\n    /*\n    code to handle out-of-memory condition\n    */\n\
    }\nvoid main()\n{\n    new_handler oldHandler = set_new_handler(myHandler);\n\
    \    //set the function myFunction\nint * p = new int[BIG_NUMBER]; //probably\
    \ cause out-of-\n    //memory condition\n}\n/*End of newhandler.cpp*/\n```\n\n\
    If the OS is unable to allocate the requested amount of memory, which is quite\
    \ likely in Listing 3.10, the new operator fails. The new handler function gets\
    \ called. The call to `set_new_handler()`, just prior to the call to the new operator,\
    \ has already set the myFunction as the new handler. Therefore, the function gets\
    \ called.\n\nAn important characteristic of the new operator is that when its\
    \ request for memory fails, it calls the new handler repeatedly until its is satisfied.\
    \ This helps in meaningfully defining the new handler function (Listing 3.11).\n\
    \nWe can make the new handler function log an error message and then call the\
    \ abort() function.\n\n# Listing 3.11 Defining the new handler function\n\n```\n\
    void myNewHandler()\n{\n    //statement to log a suitable error message\nabort();\n\
    }\n```"
