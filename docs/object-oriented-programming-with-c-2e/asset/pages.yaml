    \ 8.70.\n\n+   Listing 8.70 The static_cast operator\n\n```\n/*Beginning of typeid.cpp*/\n\
    #include<iostream>\n#include<typeinfo.h>\nvoid main() {\n    char c;\n    int\
    \ i;\n    float f;\n    double d;\n    cout<<typeid(c).name()<<endl;\n    cout<<typeid(i).name()<<endl;\n\
    \    cout<<typeid(f).name()<<endl;\n    cout<<typeid(d).name()<<endl;\n    if(typeid(i)is\
    \ of the same type as 1.1) {\n        cout<<\"i is of the same type as 1.1\";\n\
    \    } else {\n        cout<<\"i is not of the same type as 1.1\";\n    }\n}\n\
    /*End of typeid.cpp*/\n```\n\n# Output\n\nB::setx() called\n1\nB::setx() called\n\
    2\n\nThe first conversion by the static_cast operator in Listing 8.70 is correct.\
    \ ‘BPtr’ (of type ‘B*) points at ‘B1’ (of type B).\nHowever, the second conversion\
    \ by the static_cast operator is incorrect. ‘BPtr’ (of type ‘B*)’ points at ‘C1’\
    \ (of type C). Since ‘BPtr’ is of type ‘B*’, the member functions of class B alone\
    \ be called with respect to it.\nIt is interesting to note what happens when ‘BPtr’\
    \ points at ‘C1’ and the B::setx() function is called for it. The statement\n\n\
    xB::setx() function simply stores the value ‘2’ in the first four bytes of the\
    \ object which ‘BPtr’ points to. This is because ‘B::x’ is an integer-value and\
    \ is the only data member of class B. These four bytes are overwritten by ‘C1’!\
    \ Therefore, the output of the last statement in Listing 8.70 is ‘2’. The error-prone\
    \ nature of the static_cast operator is evident from this.\n\nHowever, this does\
    \ not mean that the old style cast (‘B*)’ is as good as the static_cast operator.\
    \ The static_cast operator is still a better choice because it can be easily located\
    \ in"
