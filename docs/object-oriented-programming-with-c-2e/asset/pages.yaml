    \ &, const A &);\n//prototype\n\nA operator + (const B & bb, const A & aa)   \
    \ //definition\n{\n    //function body\n}\n```\n\nIt is interesting to note that\
    \ the compiler throws an ambiguity error if both member function and friend function\
    \ are used to overload an operator. This is because both of them will satisfy\
    \ calls to the overloaded operator. The compiler will certainly be in no position\
    \ to decide which function such call is to be resolved.\n\n# 8.1.3 Overview of\
    \ Overloading Unary and Binary Operators\n\nMember functions that overload unary\
    \ operators take no operands. This is because apart from the calling object, no\
    \ other parameter is passed to the operator and the calling object is passed as\
    \ an implicit parameter to the object. Friend functions that overload unary operators\
    \ will naturally take one parameter since the calling object will be passed as\
    \ an explicit parameter to it.\n\nSimilarly, member functions that overload binary\
    \ operators take one parameter. This is because apart from the calling object,\
    \ another value will be passed to the operator as an operand (binary operators\
    \ take two operands). The calling object itself will be passed to the function\
    \ as an implicit parameter. Again, friend functions that overload binary operators\
    \ will take one more operand, which is, two. We can well explain this.\n\n# 8.1.4\
    \ Operator Overloading\n\nLet us now out the need to overload operators. After\
