    Let now see how operators are actually overloaded.\n\n# 8.2 Overloading Operators\n\
    \n# 8.2.1 Overloading Increment and Decrement Operators (Prefix and Postfix)\n\
    \nLet us recollect the class Distance. We can overload the increment operator\
    \ for objects of the class. What would we like such a function to do? If 'd1'\
    \ and 'd2' are objects of the class Distance, then the following statement\n\n\
    ```\nd2 = ++d1;\n```\n\nis interpreted by the compiler\n\n```\nd2 = d1.operator\
    \ ++ ();\n```\n\nLet us signify that this operator-overloading function should\
    \ first increment 'iFeet' portion of 'd1'. It would leave the fenches portion\
    \ of 'd1' unaltered. Then it would return the result object. With these guidelines\
    \ in mind, the prototype and definition of the operator-overloading function will\
    \ be as shown in Listing 8.12."
