  md: "# Templates 383\n\nA complete study of all of these templates is beyond the\
    \ scope of this book. However, we will study the more important class templates\
    \ in the next section. The commonly used member functions and the associated global\
    \ functions are explained with the help of examples.\n\n# 10.4.1 list Class\n\n\
    The list class is used to create sequential containers. Elements of the list are\
    \ single objects. Objects of the list are declared as follows:\n\n```\nlist<char>\
    \ cl;      //creating a list of characters\nlist<float> fl;     //creating a list\
    \ of floats\nlist<int> li;        //creating a list of integers\n```\n\nFor using\
    \ the list template, the header file list needs to be included in the source code.\n\
    \n```\n#include<list>\n```\n\nThe elements of a list occupy a non-contiguous memory.\
    \ They are doubly linked through a pair of pointers. One of the pointers points\
    \ at the next element and the other points at the previous element of the list.\
    \ This allows both forward and backward traversal.\n\nThe number of elements list\
    \ object can be specified at the time of declaration.\n\n```\nlist<int> ilist(3);\
    \      //list of integers with three initial\n                             //elements.\n\
    ```\n\nA default value can be specified for these elements.\n\n```\nlist<int>\
    \ ilist(3, -1);   //list of integers with three\n                            \
    \ //initial elements having -1.\n```\n\nA list can be created from an existing\
    \ array. We can do this by passing a pointer that points at the first element\
    \ of the array and a second pointer that points 1 the last element of the array\
    \ to be copied.\n\n```\nint iarr[6] = {0,1,2,3,4,5};   //array with six elements\n\
    list<int> ilist(iarr, iarr+6); //list also has six\n                         \
    \    //elements with the same\n                             //values\n```\n\n\
    Us have a look at the important member functions of this class.\n\n# The list<>::push_front()\
    \ Function\n\nThis function is used to insert elements at the beginning of the\
