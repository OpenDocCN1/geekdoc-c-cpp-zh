  md: "# Dynamic Memory Management\n\nany use to the program, memory allocated to\
    \ it cannot be released immediately. The memory will continue to be held up until\
    \ the end of the block in which the variable was created.\n\nDynamic memory management\
    \ is a feature provided and supported in C and C++. Just like in static memory\
    \ allocation and deallocation, in dynamic memory allocation and deallocation,\
    \ memory gets allocated and deallocated during run time only. However, the decisions\
    \ to do so can be taken dynamically in response to the requirements arising during\
    \ run time.\n\nIf the program is running and the user needs to feed in more data,\
    \ a memory block sufficient to hold the additional amount of data is immediately\
    \ allocated. For this code, utilizing the relevant functions and operators provided\
    \ by C and C++ has to be explicitly written in the source code. Again, once a\
    \ certain block of memory is no longer required, it can be immediately returned\
    \ to the OS. For any code, utilizing the relevant functions and operators provided\
    \ by C and C++ has to be explicitly written in the source code. The OS can then\
    \ allocate the allocated memory block if it needs.\n\n# 3.2 Dynamic Memory Allocation\n\
    \nDynamic memory allocation is achieved in C through the malloc(), calloc(), and\
    \ realloc() functions. In C++, it is achieved through the new operator. An illustrative\
    \ example (Listing 3.1) and its explanation follow.\n\n+   Listing 3.1 Using the\
    \ new operator for dynamic memory allocation\n\n```\n/Beginning of dynamic.cpp*/n#include<iostream.h>\n\
    void main()\n{\n    int * iPtr;\n    iPtr=new int;\n    *iPtr=10;\n    cout<<iPtr<<endl;\n\
    }\n/End of dynamic.cpp*/\n```\n\nOutput\n10\n\nThe new word is a keyword in C++.\
    \ It is an operator. It takes a predefined data type as an operand (int in Listing\
    \ 3.1). It then allocates memory to hold one value of data type that is passed\
    \ as a parameter to it in the heap (four bytes in Listing 3.1). Finally, it returns\
    \ the address of the allocated block. This address need not be explicitly cast\
    \ since the new operator returns the address with the correct cast (int * in this\
    \ case). This address can then be stored in a pointer of an appropriate type (iPtr\
    \ in this call). The allocated block of memory can then be accessed through the\
    \ pointer. See Figure 3.1(a)."
