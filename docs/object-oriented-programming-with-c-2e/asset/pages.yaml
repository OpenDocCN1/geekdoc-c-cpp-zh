  md: '# 194 Object-Oriented Programming with C++


    The constructor of the class ifstream and its overridden version of the open()
    function take ios:: as the default value for the second parameter. Therefore,
    the file is opened for reading only.


    These constants can be meaningfully combined together to further influence the
    manner in which the file is opened. Using the bitwise OR operator does this.


    ```

    ofstream file;

    ofile.open("first.dat", ios::app | ios::nocreate);

    ```


    In this example, the file would be opened for appending. But if the file does
    not exist already, the operation would fail. The method for detecting such failures
    is discussed in one of the later sections of this chapter.


    The difference between ios::app and ios::ate is discussed in the section seekp()


    # 7.7.2 close Function


    A currently open file may need to be closed within a program. This arises when
    we want to write into a file that we have already opened for reading and vice
    versa. An open file can be closed by calling the close() function with respect
    to the object that has been used to open it.


    The close() function has been defined in the istream class as well as the ostream
    class. The following code snippet shows how the close() function is used.


    ```

    ofstream file;

    ofile.open("first.dat");


    ofile.close();

    ```


    # 7.8 Files as Objects of the fstream Class


    The overloaded version of the open() function for the class fstream does not take
    a default value for the second parameter. We have to specify explicitly whether
    we want to open the file for writing or reading. We can also specify if we want
    to open the file for both reading and writing.


    ```

    fstream ifile;

    io.open("first.dat", ios::in | ios::out);

    ```


    In this example, the file will be opened for both reading and writing.


    # 7.9 File Pointers


    File pointers are created and maintained for open files during run time. There
    are two file pointers, the put pointer and the get pointer. The put pointer points
    at that byte of the open file where the next write operation will be conducted.
    The get pointer points at that byte of the open file where the next read operation
    will be conducted.'
