  md: 'Objects of classes can be passed to the function swap. The compiler will generate
    an actual definition by replacing each occurrence of T by the name of the corresponding
    class. See Listing 10.7.


    # Listing 10.7 Calling the template for the function swap by passing objects of
    the class Distance


    Output


    Before swapping

    d1=''1''-''1.1''

    d2=''2''-''2.2''


    After swapping

    d1=''2''-''2.2''

    d2=''1''-''1.1''


    We must note the amount of effort saved in code development. Only one definition
    suffices for all possible types! Templates are a very handy tool provided by C++
    for implementing code reliability.


    Further, the compiler generates an actual function from a template only for a
    given data type. For example, if the function swap is called by passing integers
    for the first time, the compiler will generate a function definition from its
    template. Subsequent calls with the same data type will not generate the definition.
    This is for the simple reason that the compiler first looks for an exact match
    to resolve a call before looking for a template (the next paragraph explains this
    with the help of an example). If it finds an exact match, it does not look for
    a template. Since the first function itself calls the function definition, subsequent
    calls do not do so.


    Evidently, the definition of the function must appear in the header file. Otherwise,
    the compiler would not be able to generate the correct definition while compiling
    a user program in which the template has been called.


    The library programmer may need to put the definition of the function template
    in a library while keeping the prototype in the header file. There is a keyword
    export that is supposed to fulfill this need. However, not all compilers support
    this keyword.'
