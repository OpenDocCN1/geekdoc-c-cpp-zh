  md: '# Introduction to C++


    Default values must be specified in function prototypes alone. They should not
    be specified in the function definitions.


    While compiling a function call, the compiler will definitely have its prototype.
    It might be in the same file, or it will be in a different file or library. Thus,
    to ensure a successful compilation of the function calls where values for arguments
    having default values have not been passed, the compiler must be aware of those
    default values. Hence, default values must be specified in the function prototype.


    You must also remember that the function prototypes are placed in header files.
    These are included in both the library files that contain the function''s definition
    and the client program files that contain calls to the functions. While compiling
    the library file that contains the function definition, the compiler will obviously
    read the prototype before it reads the function definition. Suppose the function
    also contains default values for the arguments. Even if the same default values
    are supplied the compiler will think that you are trying to supply two different
    values for the same argument. This is obviously unacceptable because the default
    value can only be one in number. Thus, default values must be specified in the
    function prototypes and should not be specified again


    If default values are specified for the arguments of a function, the function
    behaves like an overloaded function, and therefore, should be overloaded with;
    otherwise ambiguity errors might be caused. For example, if you prototype a function
    as follows:


    ```

    int add(int,int=0);

    add(int,int);

    ```


    This can confuse the compiler. If only two integers are passed as parameters to
    the function call, both prototypes will match. The compiler will not be able to
    decide which definition the function call has resolved. This will lead to an ambiguity
    error.

    Default values can be given to arguments of any data type as follows:


    ```

    double hra(double,double=0.3);

    void print(char*''a'');

    ```


    # 1.11 Inline Functions


    Inline functions are used to increase the speed of execution of the executable
    files. C++ inserts calls to the normal functions and the inline functions in different
    ways in an executable.


    The executable program that is created after compiling the source code and linking
    them consists of a set of machine instructions. When a program is started, the
    operating system loads these instructions into the computer''s memory. Each instruction
    has a particular memory address. The computer goes through these instructions
    by one. If there are any instructions to branch out or loop, the control skips
    over instructions and jumps backward or forward as needed. When a program reaches
    the function call instruction, it stores the memory address of the instruction
    immediately following the function call. It then jumps to the beginning of the
    function, whose address it finds in the function instruction itself, executes
    the function code, and jumps back to the instruction it had saved earlier.


    Obviously, an overhead is involved in


    +   making the control jump back and forth'
