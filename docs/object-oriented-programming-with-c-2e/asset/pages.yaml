  md: "```\n/*/\nvoid abc() {\n  int * iPtr;\n  IPtr = new int;\n  /*/\n  rest of\
    \ the abc() function\n  */\n}\n/*End memleak.cpp*/\n```\n\nThe following statement\
    \ executes from within the abc() function which is called from the main() function.\n\
    \n**Statement:** iPtr = new int;\n\nAs a result, the following scenario emerges.\n\
    \n![](img/de72044e5491d3e39cd5d97015354b1a_98_0.png)\n\nThe new operator allocates\
    \ memory in the heap to hold one integer type value. Suppose the block from the\
    \ byte with address 5975 gets allocated. The new operator returns the base address\
    \ of the block 5972. With this value gets stored in iPtr. After abc() finishes\
    \ execution, memory for iPtr is itself deallocated. But the memory in the heap\
    \ area remains locked up as an orphan (unreferenced) locked up block of memory.\n\
    \n![](img/de72044e5491d3e39cd5d97015354b1a_98_1.png)\n\n**Figure 3.3** Memory\
    \ leak\n\nAs it can be seen from Figure 3.3, after the abc() function terminates,\
    \ four bytes of memory are lost. Since they have not been returned to the OS,\
    \ they remain locked up. This is known as a memory leak. If more memory is required,\
    \ the OS will not allocate this block of memory. Moreover, this block of memory\
    \ cannot be accessed since the only pointer (iPtr) that was pointing at it has\
    \ itself been removed from the stack.\n\nThis block of memory is no longer of\
    \ any use and can be returned to the OS. A dynamically allocated block of memory\
    \ can be deallocated by passing the pointer pointing to an operand of the delete\
    \ operator. For example, the following statement should be inserted before the\
    \ end of the abc() function in Listing 3.5.\n\n```\ndelete iPtr;\n```"
