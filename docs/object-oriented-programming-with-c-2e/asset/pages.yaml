    open files for reading through the constructor of class ifstream. If the file
    being opened does not exist, a run-time error is produced. The technique of handling
    errors is explained in Section 7.8.


    # 7.4 Text Versus Binary Files


    Now let us talk about text files and binary files.

    In text files, binary data (numeric data that is stored in base 2 in memory) is
    stored in base 10 format. In binary files, the same binary data is stored in the
    same format (base 2).


    Before proceeding further, let us clear that the files by themselves are neither
    text files nor binary files. It is the mode in which the data is written into
    that defines the nature of the files.


    As we have already learned, when the value of a numeric variable (an integer)
    is output in binary mode, it occupies the same number of bytes in the output file
    as it does in the'
