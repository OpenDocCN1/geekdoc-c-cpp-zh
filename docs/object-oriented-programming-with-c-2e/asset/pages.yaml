  md: 'As a result of the second statement in the dynamically allocated memory block.
    The default action of the assignment operator simply copies the value of the pointer
    embedded in ''s1'' into the pointer embedded in ''s2''.


    The problems that arose of such a situation have been discussed in Chapter 4.
    We will notice that the same undesirable arose due to the initial absence of a
    suitable constructor in the class String. This had prompted us to define a copy
    constructor for the class String. The same factors that a suitable copy to overload
    the assignment operator are defined for the class String. Instead of the default
    action of the assignment operator, execution of this function will take place
    when statements such as the second one in Listing 8.5 are executed.


    For understanding the second circumstance where operator overloading is mandatory,
    let us imagine that there is a class whose objects do not share even copies of
    dynamically allocated resources. This means that statements such as the following
    should not compile at.


    ```

    o1 = o2; //o1, o2 are objects of the said class

    ```


    Here is the solution simple. We just define the function to overload the assignment
    operator in the private section of the class. Any use of the assignment operator
    within a non-member function will launch a call to this operator-overloading function.
    The function is private, such a call will throw a compile-time error. Despite,
    the use of the assignment operator will be prevented. However, what would happen
    if we inadvertently use the assignment operator within a member function or friend
    function? The private nature of the function will not be enough to prevent such
    by defining the function to overload the assignment operator. This trick will
    make the linker throw an error.


    To understand the third circumstance where operator overloading is mandatory,
    we require the knowledge of function templates, which are discussed in the next
    chapter.


    Now, let us understand the fourth circumstance. The new operator does a number
    of things by default, some all of which might be undesirable for the class being
    designed.


    By default, the new operator throws an exception if it fails to allocate the amount
    of memory requested (exceptions are dealt with in the later chapters). However,
    this default action of the new operator may be unsuitable for the class being
    designed. In response to this outmemory condition, the class designer might need
    to call one of the member functions of the class. Only overloading the new operator
    can fulfill this.


    Also by default, the new operator not only allocates the amount of memory requested,
    it also stores the amount of memory allocated in the memory itself. This enables
    the delete (if it is called) to find out the size of the memory allocated so that
    it can deallocate the same amount of memory (Chapter 3). However, in memory applications,
    if the class designer knows that the same amount of memory will be allocated when
    the new operator is called, he/she can prevent this wastage of memory. Again,
    only overloading the new operator can do this.


    Further, by default, the new operator simply allocates memory for the object type
    is passed as an operand. However, the class designer would not want that ever
    one object. He/she may want that an object be created only when the new operator
    is called for the first time. Subsequent calls to the new operator should not
    create more objects. Instead, subsequent calls should merely return the address
    of the object that was created in response to the first call to the new operator.'
