  md: "# Exception Handling 399\n\nThe throw keyword is used to throw an exception.\
    \ It is followed by a value, such as character string or an object, indicating\
    \ the nature of the exception. The library notifies the user program by the error\
    \ by throwing an exception.\n\nThe catch keyword is used to catch an exception.\
    \ A catch-handler block begins with the keyword catch followed, by a type declaration\
    \ indicating the type of exception it catches. That, in turn, is followed by a\
    \ brace block of code indicating the actions to take. The catch keyword, along\
    \ with the exception types, is the point to which control should jump when an\
    \ exception is thrown.\n\nA try block encloses the block of code that is likely\
    \ to throw an exception. Such a code generally consists of calls to library functions\
    \ that are designed to throw errors in the manner described herein. One or more\
    \ blocks follow the try block. The ‘try’ block is indicated by the keyword try\
    \ followed by a brace—enclosed block of code indicating the code within which\
    \ exception will be caught.\n\nThe try block looks like this:\n\n```\ntry // start\
    \ of block\n{\n  z=hmean(x,y);\n} // end of try block\n```\n\nIf any statement\
    \ in the try block causes an exception, the catch block catches this block after\
    \ will handle the exception.\n\nExceptions are caught as follows:\n\n```\nif(a==b)\n\
    \  throw \"hmean(\\) arguments : a = -b not allowed\";\n```\n\nIn this case, the\
    \ throw exception is the string hmean() arguments : a = -b not allowed. The throw\
    \ statement resembles the return statement because it terminates function execution.\
    \ However, instead of merely returning to the calling program, a throw causes\
    \ the control back up the sequence of current functions until it finds the try\
    \ block. In this case, the throws pass control back to main(). There, the program\
    \ looks for an exception handler (following the try block) that catches the type\
    \ of exception.\n\n```\ncatch (char *) // start of exception handler\n  cout<<\"\
    \\n\";n  cout<<\"Enter a new pair of numbers : \";\n  continue;\n end of handler\n\
    ```\n\nThe catch keyword identifies the handler and the char * means that this\
    \ handler catches a string-type exception. The thrown exception is assigned to\
    \ ‘s’. Since the exception matches this handler, the program executes the code\
    \ within the block.\n\nIf a program completes executing statements in a try block\
    \ without any exception thrown, it skips the catch block or blocks after the try\
    \ block and goes to the first statement following the handlers.\n\nLet us follow\
    \ the flow of control when values '10' and ‘-10’ are passed to hmean(). If the\
    \ test succeeds and the exception of (char * type) is thrown. the hmean() function\
    \ terminates. The control goes back to the point where the hmean() function was\
    \ called and determines whether the call was embedded within a try block or not.\
    \ It finds that the hmean() function was called from the main() function and that\
    \ the call was embedded within a try block. The control searches for a catch block\
    \ that follows the try block and is of the\n\n![](img/de72044e5491d3e39cd5d97015354b1a_412_0.png)"
