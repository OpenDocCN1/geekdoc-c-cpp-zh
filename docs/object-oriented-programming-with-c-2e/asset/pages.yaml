  md: "# Operator Overloading, Type Conversion, New Style Casts, RTTI\n\nThe function\
    \ has been designed to return by reference to prevent chaining operation from\
    \ becoming inefficient, that is, to ensure an efficient execution of statements\
    \ such as the following ones.\n\n```\nString s1, s2, s3;\ns3 = s2 = s1;\n```\n\
    \nThis statement is interpreted as\n\n```\ns3.operator = (s2.operator = (s1));\n\
    ```\n\nSuppose the assignment statement is written as\n\n```\ns2 = s2 = s1;\n\
    ```\n\nNotice the self-assignment embedded in the preceding statement. First,\
    \ 's2' is equated with 's1'. Then is returned by value and not by reference. In\
    \ this case, the value of 's2' is created in the stack. Although the copy has\
    \ a separate copy of the same value as 's2', its address is nevertheless different\
    \ from that of 's2'. Therefore, when the assignment operator executes for the\
    \ second time, the reference variable 'ss' refers to itself. Consequently, the\
    \ test for self-assignment fails and again the unnecessary deallocation and reallocation\
    \ occurs.\n\nThere is another circumstance when the library programmer might to\
    \ overload the assignment operator. The library programmer may not have two objects\
    \ to share different copies of the same data. In the previous example, where the\
    \ assignment operator has been overloaded for the class String, objects are able\
    \ to physically separate and different copies of the same string value. To satisfy\
    \ the new requirement described earlier, the assignment operator should be defined\
    \ as a private member function (Listing 8.32).\n\n# Listing 8.32 Overloading the\
    \ assignment operator through a private member function\n\n```\nclass A\n{\npublic:\n\
    \    operator = (const A&);\n    /\n    rest of the class A\n    */\n};\n```\n\
    \nNow, if the client programs call the assignment operator indirectly (object1\
    \ = object2) or directly (object1.operator=(object2)), the compiler raises an\
    \ error and the assignment of one object to another is prevented. What will happen\
    \ if one of the member functions or friend functions of class A calls the assignment\
    \ operator? The compiler will certainly not complain and our safeguard will fail.\
    \ For this, the library programmer can simply define the assignment operator.\
    \ Now, if one of the member functions or friend functions of class A calls the\
    \ assignment operator, the compiler does not complain, but the linker certainly\
    \ does!\n\nLet us understand another interesting thing about the assignment operator.\
    \ For this, we should remember that a derived object can be assigned to a base\
    \ class object. However, the reverse is not true. See Listing 8.33. The reason\
    \ is obvious. Suppose A is the base class and B is its derived class."
