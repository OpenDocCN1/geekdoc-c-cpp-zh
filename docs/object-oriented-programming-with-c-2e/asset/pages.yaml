    zero-fill shift operator. The normal right shift operator (>>) fills the bits
    on the left with the first bit as it shifts the bits to the right. In contrast,
    the zero-fill shift operator (>>>), fills the bits on the left with zeros as it
    shifts the bits to the right. This operator can be used as follows:


    ```

    x=x>>>; // shifts bits x to the right by one place

    //and move zero from the left

    ```


    There is also a complimentary zero-fill right shift assignment operator (>>>).
    The foregoing statement can be rewritten as


