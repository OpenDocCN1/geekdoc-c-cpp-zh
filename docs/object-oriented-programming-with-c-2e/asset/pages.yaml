    class A\n{\n    int x;\n    public:\n        friend void abc(A&); //prototype\
    \ of the friend function\n};\nvoid abc(A& Aobj) //definition of the friend function\n\
    {\n    Aobj.x++; //accessing private members of the object\n}\nvoid main()\n{\n\
    \    A A1;\n    abc(A1);\n}/*End of friend.cpp*/\n```\n\nA few points about the\
    \ friend functions that we must keep in mind are as follows:\n\n+   * friend keyword\
    \ should appear in the prototype only and not in the definition.\n* Since it is\
    \ a non-member function of the class of which it is a friend, it can be prototyped\
    \ in either the private or the public section of the class.\n* A friend function\
    \ takes one extra parameter as compared to a member function thatnperforms the\
    \ same task. This is because it cannot be called with respect to any object.\n\
    Instead, the object itself appears as an explicit parameter in the function call.\n\
    * We need not and should not use the resolution operator while defining a friend\n\
    function.\n\nThere are situations where a function needs to access the private\
    \ data members of\nt class cannot be called with respect to any object of the\
    \ class. In such situations,\nfunction must be declared as a friend. We will encounter\
    \ such a situation in Chapter 8.\nFriend functions do not contradict the principles\
    \ ofOOOPS. Since it is necessary to prototype\nt friend function inside the class\
    \ itself, the list of functions that can access the private\nmembers of a class's\
    \ object remains well defined and restricted. The benefits provided by\ndata hiding\
    \ not compromised by friend functions.\n\n# Friend classes\n\nA class can be a\
    \ friend of another class. Member functions of a friend class can access private\n\
    data members of objects of the class of which it is a friend. If class B is to\
    \ be made a friendnA class, then the statement\n\n+   * friend class B;\n\nshould\
    \ be written within the definition of class A. Listing 2.23 illustrates this."
