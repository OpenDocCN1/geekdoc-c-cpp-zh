  md: "# 5\n\n# Inheritance\n\nThis chapter discusses inheritance. Inheritance is\
    \ one of the most important and useful features of the object-oriented programming\
    \ system.\n\nThe chapter begins with an overview of inheritance. Basic concepts\
    \ such as base class and derived class are discussed. The effects, advantages,\
    \ and important points of inheritance are also discussed.\n\nThe middle portion\
    \ of the chapter deals with the implications of making a base class pointer point\
    \ at an object of the derived class and vice versa. Thereafter, the concept of\
    \ function overriding is discussed. This is followed by a section on base class\
    \ initialization in which the method of initializing base members via constructors\
    \ of the derived class is discussed.\n\nThe protected keyword is an important\
    \ concept in C++. The protected keyword, along with the public and private keywords,\
    \ completes the triad of access specifiers provided by C++. A separate section\
    \ of this chapter elucidates the keyword and the effect of its use in inheritance.\n\
    \nClasses are derived by base, public, private, or protected keywords. The effect\
    \ caused by each of these is different. The current chapter compares this difference\
    \ in a systematic manner.\n\nInheritance can be of various types based on the\
    \ number of classes derived from a single base class and the number of base classes\
    \ for a single derived class. All of these types are dealt with in the ultimate\
    \ section of the chapter.\n\nThe chapter ends with a section on the order of invocation\
    \ of constructors and destructors.\n\n# 5.1 Introduction\n\nInheritance is a very\
    \ useful feature of OOPS that is supported by C++. A class may be defined in such\
    \ a way that it automatically includes member data and member functions of an\
    \ existing class. Additionally, member data and member functions may be defined\
    \ in the new class also. This is called inheritance.\n\nThe existing class whose\
    \ features are being inherited is known as the base class or parent class or super\
    \ class. The new class that is defined by inheriting from the existing class is\
    \ known as its derived class or child class or sub-class. The syntax for derivation\
    \ is as follows.\n\n```\nclass <name of derived class> : <access specifier> <name\
    \ of base class>\n{\n  /*\n    definition of derived class\n  */\n```"
