    The new style casts are safe to use and can be located in source codes by using
    the search facility of the editor where the source code has been opened. The latter
    is especially useful in large source codes.

    There are four new style cast operators.


    If the dynamic_cast operator is used with references, it throws an exception of
    Bad_cast where it would otherwise have returned NULL pointers.

    While the dynamic_cast operator carries out a run-time check to ensure a valid
    conversion, the static_cast operator does no such check.

    The reinterpret_cast operator allows us to cast one type to another.


    +   * dynamic_cast

    * static_cast

    * reinterpret_cast

    * const_cast


    Each of the new style cast converts the object that is passed to as an operand
    in its own way and returns the converted object. The general syntax of these is:

    New styles provide a better choice than the old C-style casts. Visibility of the
    new style is considerably greater than the old style cast, which makes tracking
    down a rough old style cast easier.


    ```

    operator <type>(whose value type is be converted)

    ```


    The dynamic_cast operator is used to determine whether a base class pointer points
    to an object of the base class or one of the derived classes at run time. It is
    also used to determine whether a base class reference to an object of the base
    class or an object of the derived classes at run.

    The const_cast operator serves the same purpose as the const_cast keyword. The
    const_cast operator is used to cast the const of a pointer.

    Apart from the dynamic_cast operator, C++ provides the typeid operator for implementing
    reflection (typeid is a keyword in C++). The typeid operator returns a value of
    the passed value as a reference to an object of class type_info. The class type_info
    is defined in the header file typeinfo.h.


    In the general sense, if type is a derived class type and the value is converted
    to address of object of the same derived class, the dynamic_cast operator returns
    a pointer to the object. Else, it returns NULL. For the dynamic_cast operator
    to operate, the base class must be polymorphic in nature, it should have at least
    one virtual function.

    The dynamic_cast operator enables us to access those features of the derived class
    that are not present in the base class.


    Two objects of the class type_info can be compared using the equality operator.
    The name of the value passed to the typeid operator can also be determined by
    using the typeid::name().

    Class objects, pointers to class objects, or references to class objects can be
    passed to the typeid operator. However, for the typeid operator to work correctly,
    the class whose object, pointer, or reference is passed should be polymorphic
    in nature.


