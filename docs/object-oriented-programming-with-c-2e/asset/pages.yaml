  md: '# 446 Object-Oriented Programming with C++


    # D.3 Analysis


    Now we know the three models that constitute an object-oriented model. This section
    will teach us how we can create a model from the requirement document. The last
    section will teach us how to implement the model.


    # Overview of Analysis


    Requests generated by users, developers, and managers are first collected and
    consolidated. A problem statement is created from this consolidated list. Models
    are built by analyzing the problem statement and by taking inputs from users,
    from domain experts, and from the developer’s knowledge of the real world.


    Large models are built up iteratively. A small model to achieve only the core
    requirement is built first. Once the model has been perfected, it is expanded
    to add all ancillary functionalities.


    # Object Modelling


    The steps for object modelling are as follows:


    +   1. Identify classes

    2. Identify associations and aggregations

    3. Add attributes to classes and associations

    4. Combine classes using inheritance

    5. Add operations to classes after constructing the dynamic and functional models


    Classes often appear as nouns in the problem statement.

    Associations often appear as verbs or verb phrases.

    Attributes often appear as nouns followed by possessive phrases.

    Identify classes that share common features and designate them as base classes.
    Look for nouns that appear with different adjectives. The common noun usually
    be modeled as a base class whereas each of the nouns with an adjective can be
    modeled as its derived class.


    # Dynamic Modelling


    Briefly, the first step in dynamic modelling is to identify events. Events appear
    as external stimuli and responses. The next step is to summarize permissible event
    sequences for each object with a separate state diagram.


    We can start creating scenarios of typical expectations. All common interactions
    get depicted by scenarios. The next step is to create event trees for each of
    these scenarios. Scan the counts in the event tree to identify events that occur
    on each object.


    States that an object obtains can be identified from the interval between all
    pairs of events that occur it one after the other. These events and states are
    organized in a state diagram. The resulting set of state diagrams constitutes
    the dynamic model.


    This process can be repeated incrementally for special interactions such as omitted
    inputs, violation of domain constraints, etc. Finally scenarios for error cases
    are prepared. These scenarios are also merged into the state diagram by attaching
    the new event sequence to the existing state as an alternative path.'
  merge: -1
