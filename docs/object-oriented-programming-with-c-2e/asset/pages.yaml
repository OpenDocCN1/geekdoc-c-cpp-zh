    \ only one VTBL). The size of the object does not vary. The size of the classes\
    \ with virtual functions increases by four bytes due to the presence of the additional\
    \ pointer (VPTR).\n\nWe might wonder as to why C++ supports two types of binding—static\
    \ and dynamic. Why does it not support dynamic binding? In other words, why does\
    \ it declare all virtual functions by default? The reason is that virtual functions\
    \ entail a run-time cost in the form of shape that is wasted for creating the\
