  md: '# Object-Oriented Programming Systems


    In OOPS, we try to model real-world objects. But, what are real-world objects?
    Most real-world objects have internal parts and interfaces that enable us to operate
    them. These interfaces perfectly manipulate the internal parts of the objects.
    They also have the exclusive rights to do so.


    Let us understand this concept with the help of an example. Take the case of a
    simple LCD projector (a real-world object). It has a fan and a lamp. There are
    two switches—one to operate the fan and the other to operate the lamp. However,
    the operation of these switches is necessarily governed by rules. If the switch
    is on, the fan will automatically switch itself on. Otherwise, the projector will
    get damaged. For the same reason, the lamp will automatically switch off if the
    fan is switched off. In order to create these conditions, the switches are linked
    with each other. The interface to the LCD projector is perfect. Further, this
    interface has the exclusive rights to operate the fan and lamp.


    In fact, is a common characteristic of all real-world objects. If a perfect interface
    is required to work on an object, it will also have exclusive rights to do so.


    Coming to C++ programming, we notice a resemblance with the observed behaviour
    of the LCD projector and the desired behaviour of data structure variables. In
    OOPS, with the help of a new programming construct and new keywords, associated
    functions of the data structure can be given exclusive rights to work upon its
    variables. In other words, all pieces of code can be prevented from accessing
    the data members of the variables of this structure.


    Compilers that implement OOPS ensure data security by diligently enforcing this
    prohibition. By throwing compile-time errors against pieces of code that violate
    the prohibition, if enforced, will structure variables behave like real-world
    objects. Associated functions that are defined to perfectly manipulate variables
    can be given exclusive rights to do so.


    There is still another characteristic of real-world objects—a guaranteed initialization
    of data. After all, when you connect the LCD projector to the mains, it does not
    start up in an invalid state (fan off and lamp off). By default, both the lamp
    and the fan are off or on. Users of the LCD projector do not need to do this.
    The same characteristic is found in all real-world objects.


    Programming languages that implement OOPS enable library programs to incorporate
    this characteristic of real-world objects into structure variables. Library programmers
    can ensure a guaranteed initialization of data members of structure variables
    to the desired values. For this, programmers do not need to write code explicitly.


    Two features are incidental to OOPS. They are:


    +   - Inheritance


    +   - Polymorphism


    Inheritance allows one to inherit the characteristics of structures, a variable
    of the new structure will contain data members mentioned in the new structure''s
    definition. However, because of inheritance, it will also contain data members
    in the existing structure''s definition from which the new structure has inherited


    Further, associated functions of the new structure can work upon a variable of
    the new structure. For this, the address/name of a variable of the new structure
    is passed to the associated functions of the new structure. Again, as a result
    of inheritance, the existing structure from which the new structure has inherited
    will also be able to work upon'
