  md: "# 4.2 Destructors\n\nThe destructor gets called for each object that is about\
    \ to go out of scope. It appears as a member function of class whether we define\
    \ it or not. It has the same name as that of the class prefixed with a tilde sign.\
    \ It does not take parameters. It does not return anything (not void). The prototype\
    \ of a destructor is\n\n```\n~ <class name>();\n```\n\nThe need for a function\
    \ that guarantees deinitialization of member data of a class and frees up resources\
    \ acquired by the object during its lifetime will be explained soon. Destructors\
    \ fulfill this.\n\nThe compiler embeds a call to the destructor for every object\
    \ when it is destroyed. We have one more look at the main() function of Listing\
    \ 4.1.\n\n```\nvoid main()\n{\n    A1;\n} // AI goes out of scope here\n```\n\n\
    AI goes out of scope just before the main() function terminates. At this point,\
    \ the compiler embeds a call to the destructor for the object which is forbidden.\
    \ The above statement is then transformed into\n\n```\nA1~A1(); // destructor\
    \ called not legal C++ code\n```\n\nAn explicit call to the destructor for an\
    \ existing object is forbidden. The above statement is then transformed\n\n```\n\
    ~A(&A1); //see chapter 2\n```\n\nThe destructor will also be called for an object\
    \ that has been dynamically created in the heap after the delete operator is applied\
    \ on the pointer pointing it.\n\n```\nA * APtr;\nAPtr = new A;\n.\n.\ndelete APtr;\
    \ //object created constructor called\n//object destroyed destructor called\n\
    ```\n\nThe last statement is transformed into\n\n```\nAPtr->~APtr(); //destructor\
    \ called for *APtr\ndelete APtr; //memory for *APtr released\n```\n\nFirst, the\
    \ destructor is called for the object that is going out of scope. Thereafter,\
    \ the memory occupied by the object itself is deallocated. The second statement\
    \ above is transformed into\n\n```\n~A(APtr); //see the section on 'this' pointer\
    \ in Chapter 2\n```\n\nUnlike the name, the destructor does not 'destroy' or deallocate\
    \ memory that object occupies. It is merely a member function that is called for\
    \ each object before the object goes out of scope (destroyed).\n\nAs can be observed,\
    \ the compiler embeds a call to the destructor for every every object that is\
    \ going out of scope. But we did not prototype and define the destructor inside\
    \ the class. Then how was the call to the destructor resolved? The compiler prototypes\
    \ and defines the destructor for us. But what statements the definition of such\
    \ a destructor have? The answer is 'nothing'. An example of a compiler-defined\
    \ destructor follows."
