  md: "# 2.2.5 Mutable Data Members\n\nA mutable data member is never constant. It\
    \ can be modified inside constant functions also. Prefixing the declaration of\
    \ a data member with the keyword mutable makes it mutable. Listing 2.21 illustrates\
    \ this.\n\n| Listing 2.21 Mutable data members |\n\n```\n/*Beginning of mutable.h*/\n\
    class A {\n    int x;                  //non-mutable data member\n    mutable\
    \ int y;         //mutable data member\npublic:\n    void abc() const        //a/\
    \ constant member function\n        x++;                   //ERROR: cannot modify\
    \ a non-constant data\n                             //member in a constant member\
    \ function\n        y++;                   //OK: can modify a mutable data member\
    \ in a\n                             //constant member function\n\n    void def()\
    \              //a/ non-constant member function\n        x++;               \
    \    //OK: can modify a non-constant data member\n                           \
    \  //in a non-constant member function\n        y++;                   //OK: can\
    \ modify a mutable data member in a\n                             //non-constant\
    \ member function\n    };\n};/*End of mutable.h*/\n```\n\nWe frequently need a\
    \ data member that can be modified even for constant objects. Suppose, there is\
    \ a member function that saves the data of the invoking object in a disk file.\
    \ Obviously, this function should be declared as constant to prevent an inadvertent\
    \ change to the members of the invoking object. If we need to maintain a flag\
    \ inside each object that tells us whether the object has already been saved or\
    \ not, such a flag should be modified within the above constant function. Therefore,\
    \ this data member should be declared a mutable data member.\n\n# 2.2.6 Friends\n\
    \nA class can have global non-member functions and member functions of other classes\
    \ as friends. Such functions can directly access the private data members of objects\
    \ of the class.\n\n# Friend non-member functions\n\nA friend function is a non-member\
    \ function that has special rights to access private data members of any object\
