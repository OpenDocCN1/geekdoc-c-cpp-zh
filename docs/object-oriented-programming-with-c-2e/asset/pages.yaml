  md: "# Object-Oriented Programming with C++\n\nIt is sometimes necessary to override\
    \ the function template by an actual function. In order to understand this, let\
    \ us consider the template for a function to return the larger of the arguments\
    \ that are passed to it (Listing 10.8).\n\n# Listing 10.8 Template for the larger\
    \ function\n\n```\ntemplate <class T>\nlarger(const T& a, const T& b)\n{\n   \
    \ return a>b? a:b;\n}\n```\n\nThis function works correctly if various ordinary\
    \ data types such as int and float are passed to it. However, it does not work\
    \ correctly if strings are passed to it. See Listing 10.9.\n\n# Listing 10.9 Calling\
    \ the larger function by passing strings\n\n```\nchar * s1=\"abcd\",  s2=\"efgh\"\
    ;           //compiler generates larger(const\nchar * s3=larger(s1,s2);      \
    \  //char &, const char *); and\n                             //resolves the call\n\
    ```\n\nWe notice that, during execution, the larger(char *, char*) function in\
    \ Listing 10.9 compares only the addresses of the two strings and not their contents!\
    \ This is certainly not wanted. For this special case, we would like a special\
    \ version of the function larger for the character strings to execute. It is precisely\
    \ a special version of the function larger that we would define along with the\
    \ template. Listing 10.10.\n\n# Listing 10.10 Overriding the template for the\
    \ function larger\n\n```\nchar * larger(char * a, char * b)\n{\n    return strcmp(a,b)\
    \ > 0 ? a : b;\n}\n```\n\nNow, if the larger is called by passing two strings,\
    \ the function in Listing 10.9 will be called while the template will be ignored.\
    \ Function templates can be overloaded. Listing 10.11.\n\n# Listing 10.11 Overloading\
    \ a function template\n\n```\n#include<iostream.h>\ntemplate <class T>\nvoid display(const\
    \ T& a)\n{\n    cout << a << endl;\n}\n\ntemplate <class T>\nvoid display(const\
    \ T& a, const int n) //overloaded version\n//of display()\n```"
