  md: "The size of the array to be created is passed as a parameter to the new operator.\
    \ But while deallocating the memory allocated for the array, the size is not passed\
    \ (the square brackets are empty). How does the compiler know how much memory\
    \ is to be deallocated? The answer is that when the new operator executes to allocate\
    \ a block of array, the OS stores the size passed. Figure 3.4 shows the size of\
    \ the memory block, which is captured during run time, prefixed to the memory\
    \ block itself. When the delete operator is followed by the empty pair of square\
    \ brackets, the compiler uses the size stored and deallocates the entire block\
    \ correctly.\n\n![](img/de72044e5491d3e39cd5d97015354b1a_101_0.png)\n\nFigure\
    \ 3.4 Size of the allocated memory is prefixed to the memory block\n\nBlocks of\
    \ memory containing arrays of other types can also be deallocated similarly. For\
    \ example, see Listing 3.9.\n\n+   Listing 3.9 Deallocating memory that was allocated\
    \ for an array of objects\n```cpp\nDistance * dptr;               //creates an\
    \ array of 5 objects\ndptr = new Distance[5];       //the class Distance\n\n...\n\
    delete[] dptr;               //de-allocates the memory\n                     \
    \        //allocated for the entire array\n``````\n\n# 3.4 set_new_handler() Function\n\
    \nWe know that the new operator attempts to capture more chunks of memory from\
    \ the heap during run time. But happens if no more memory is available to satisfy\
    \ this attempt? We get an out-of-memory condition.\n\nThe new operator, when faced\
    \ with an out-of-memory condition, calls a global function and then throws an\
    \ exception of type bad_alloc (the chapter on exception handling with the mechanism\
    \ of throwing and catching exceptions). This global function is known as the new\
    \ handler function."
