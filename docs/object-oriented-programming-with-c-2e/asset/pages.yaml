  md: '# Templates 387


    The vector class has two functions that enable us to find the capacity and the
    size of the vector. These are vector::size() and vector::capacity().


    Insertion and deletion from an intermediate position in a vector is inefficient
    because for such operations all elements starting from the insertion point need
    to be pushed up or down as the case may be.


    On the other hand, random access to a particular element is efficient. For traversing
    the element that has our desired value, only the internal iterator has to be incremented
    since the elements are in contiguous blocks of memory.


    # 10.4.3 pair Class


    Objects of the pair class represent a pair of values that may or may not be of
    the same type.


    ```

    pair<string, int> player("Kasparov",1795);

    ```


    The object player in this statement represent the number of games in our database
    that have been played by the player with name "Kasparov" (the string class is
    discussed later in this chapter). Obviously, we would like to create more variables
    of the same type later in program. Using the keyword typedef allows us to do so.


    ```

    typedef<string, int> Player;

    Player Kasparov("Kasparov",1795);

    Player Fischer("Fischer",2162);

    Player Karpov("Karpov",1525);

    ```


    For using the pair class, the header file utility needs to be included in the
    source code.


    ```

    #include<utility>

    ```


    The elements of the objects of the pair class can be accessed as first and second.
    For example, the member operator can be used as follows:


    ```

    cout<<"Number of games of "<<kasparov.second;

    <<" are "<<kasparov.second;

    ```


