  md: "Operator Overloading, Type Conversion, New Style Casts, and RTTI\n\n# 8.4.2\
    \ static_cast Operator\n\nThe difference between the static_cast operator and\
    \ the dynamic_cast operator is that while the dynamic_cast operator carries out\
