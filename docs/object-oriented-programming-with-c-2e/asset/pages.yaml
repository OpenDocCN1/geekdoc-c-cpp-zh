    occur during one particular execution of a system. Event traces are created for
    each scenario. For this, the sender and the receiver objects of each event are
    identified. This event trace shows each of these objects as a vertical line. Each
    event is depicted as a horizontal arrow from the sender to the receiver object.
    See Figure D.13.'
