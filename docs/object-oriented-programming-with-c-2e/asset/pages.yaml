  md: "# 10\n\n# Templates\n\nThis chapter explains the concept of generic programming\
    \ using templates. Function templates along with their use and benefits are included.\
    \ Class templates, their use, and benefits are also included.\n\nThe Standard\
    \ Template Library provides a number of useful class templates that can be used\
    \ to meet various common programming needs. Important class templates of this\
    \ library are also described in this chapter.\n\n# 10.1 Introduction\n\nWe frequently\
    \ come across functions that work in exactly the same way for different data types.\
    \ Each of these functions has been designed to handle a specific data type. For\
    \ different types of variables, only the keyword used to declare the variables\
    \ upon which they changes. The algorithm that these functions implement remains\
    \ the same and therefore the structure of the function remains the same. One function\
    \ that immediately comes to mind is the one used to swap two values (Listing 10.1).\n\
    \n| Listing 10.1 A function to swap two integers |\n\n```\nvoid swap(int &a, int\
    \ &b)\n{\n    int temp;\n    temp=a;\n    a=b;\n    b=temp;\n}\n```\n\nThe preceding\
    \ swap function swaps the values of two integers. A swap function that two floats\
    \ will have the definition shown in Listing 10.2.\n\n| Listing 10.2 A function\
    \ to swap two float-type numbers |\n\n```\nvoid swap(float &a, float &b)\n{\n\
    \    float temp;\n    temp=a;\n    a=b;\n    b=temp;\n}\n```"
  merge: -1
  pgno: 385
- img_proc: true
  md: "We can notice that the two swap functions are alike except for the data type\
    \ of the\nvariables upon whom they work. It would be reasonable to expect that\
    \ the C++ language\nprovides us with a facility to write a common function that\
    \ is independent of a data type but\nwhich embodies the common algorithm and that\
    \ the C++ language on its own creates the\nactual function and when the need arises.\
    \ Having code at a common place has obvious\nadvantages, namely ease in code development\
    \ and ease in code maintenance.\n\nThis facility is provided in the form of templates.\
    \ The programmer can create a template\nwith some or all variables therein having\
    \ unspecified data types. Whenever the template is\ninvoked by passing arguments\
    \ of a certain type, the C++ language on its one replaces the\nunspecified type\
    \ with the type of the arguments passed. Such templates can be created for\nindividual\
    \ functions as entire classes.\n\n# 10.2 Function Templates\n\nThe syntax for\
    \ creating a template for a generic function is given in Listing 10.3.\n\n+  \
    \ Listing 10.3 Syntax for a function template\n\n```\ntemplate <class T, ...>\n\
    return_type function_name(T arg1, _)\n{\n    //statements\n}\n```\n\nThe template\
    \ definition begins with the template keyword. This is followed by a list of\n\
    gener types in angular brackets. Each generic type is prefixed with the class\
    \ keyword\nand, if the template function works on more than one generic type,\
    \ commas separate them.\nThereafter, the template function is defined just like\
    \ an ordinary function. The return type\ncomes first. It is followed by the name\
    \ of the function, which in turn is followed by a pair\nof parentheses enclosing\
    \ the list of formal arguments the function takes. However, there\nshould be at\
    \ least one formal argument of each of the generic types mentioned within\nanangular\
    \ brackets.\n\nFor example, the template for the function swap can be given in\
    \ Listing 10.4.\n\n+   Listing 10.4 Template for the function swap\n\n```\n/*Beginning\
    \ of swap.h*/\ntemplateplate <class T>\nvoid swap(T &a, T &b)\n{\n    T temp;\n\
    \    temp=a;\n    a=b;\n    b=temp;\n}\n/*End of swap.h*/\n```\n\nNow, suppose\
    \ the function swap is called by passing two integers. The compiler generates\n\
    an actual definition for the function by replacing each occurrence of T by the\
    \ keyword int.\nSee Listing 10.5."
