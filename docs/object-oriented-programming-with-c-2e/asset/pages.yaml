    \ Therefore, a call to a constructor is not embedded for it.\n\nNow we come to\
    \ a crucial question. Why should we define our own copy constructor? After all,\
    \ the default copy constructor (which is provided free of cost by the compiler)\
    \ does pretty decent job. First, recollect the conditions we decided to implement\
    \ for all objects of the class String. Suppose an object of the class String is\
    \ created and at the same time equated to another object of the class. For example,\n\
    \n```\nString s1(\"abc\\ //copy constructor is called for s2 and s1\nString s2=s1;\
    \ //is passed as a parameter to it\n```\n\nSince we have not defined the copy\
    \ constructor for the class String, the compiler has done it for us. What does\
    \ this default copy constructor do in the above case? It simply copies the values\
    \ of 's1' to 's2'! Then the value of 's2.cstr' becomes equal to 's1.cstr'. Both\
    \ pointers point to the same place! This is a violation of our conditions. The\
    \ behaviour of the default copy constructor is undesirable in this case. To overcome\
    \ this problem of the default copy constructor, we must define our own copy constructor.\n\
    \nFrom within the copy constructor of the class String, a separate memory must\
    \ be first allocated dynamically in the heap. This memory must be equal in length\
    \ to that of the string at which the pointer of the object passed as a parameter\
    \ ('s1' in this case) points. The pointer of the invoking object ('s2' in this\
    \ case) must then be made to point to this newly allocated memory. The value of\
    \ 'len' of the invoking object should also be set appropriately. However, if the\
    \ pointer in the object passed as a parameter is NULL, the value of the pointer\
    \ and 'len' of the invoking object must be set to NULL and zero.\n\nAccordingly,\
    \ the prototype and the definition of the copy constructor of the class String\
    \ appear as shown in Listing 4.11.\n\nListing 4.11 A user-defined copy constructor\n\
    \n```\n/*Beginning of String.h*/\n#include<iostream>\nclass String\n{\n    char\
    \ * cStr;\n    long unsigned len;\n\npublic:\n    String(const String&); //our\
    \ own copy constructor\n    /*\n    rest of the class String\n    */\n    explicit\
