  md: '# Appendix B


    # Comparison of C++ with C


    C++ is an extension of C language. It is a proper superset of C language. This
    means that a C++ compiler can compile programs written in C language. But, the
    reverse is not true. A C++ compiler can understand all of the keywords that a
    C compiler can understand. Again, the reverse is not true. Making constructs,
    looping structures, functions etc. are written in exactly the same way in C++
    as they are in C language. Apart from the keywords that implement these common
    programming constructs, C++ provides a number of additional keywords and language
    constructs that enable it to implement the object-oriented paradigm.


    Differences between C++ and C can be divided into two categories:


    +   * Non-object-oriented features provided in C++ that are absent in C language.

    * Object-oriented features provided in C++ to make it comply with the requirements
    of the Object-Oriented Programming System.


    # Non-object-oriented Features Provided in C++ that are Absent in C Language


    Enumerated data types

    An enumerated type in C is internally treated as an integer. In C++, it is treated
    as a separate type in its own right. Direct conversion from an integer to the
    enumerated type is therefore prohibited.


