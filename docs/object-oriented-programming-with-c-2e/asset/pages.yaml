    The set of data members of the derived class is, or reckoned to be, a proper superset
    of the set of data members of its base class. In this mind, in Listing 8.33, ''B1''
    will have its own copies of not only data members that ''A1'' has but some extra
    data members of its own. If the second assignment in Listing 8.33 works, then
    the data members of ''B1'' that are common in name with those of ''A1'' will get
    initialized. However, the data members that are exclusively in ''B1'' will remain
    unchanged and may no longer match with the rest of the data members of ''B1''.
    Keeping this in mind, the compiler prevents the second assignment.


