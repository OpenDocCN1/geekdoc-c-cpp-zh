    # 1.5 Console Input/Output in C++\n\nThis section discusses input and output in\
    \ C++.\n\n# 1.5.1 Console Output\n\nThe output functions in C language, such as\
    \ printf(), can be included in C++ programs because they are anyway defined in\
    \ the standard library. However, there are some more ways of outputting to the\
    \ console in C++. Let us consider an example (see Listing 1.7).\n\n> Listing 1.7\
    \ Outputting in C++\n\n```\n/*Beginning of cout.cpp*/\n#include <iostream.h>\n\
    void main()\n{\n    int x;\n    x=10;\n    cout<<x; //outputting to the console\n\
    }\n/*End of cout.cpp*/\n```\n\n# Output\n\n10\n\nThe third statement in the main()\
    \ function (Listing 1.7) needs to be understood. cout (pronounce see-out) is actually\
    \ an object of the class ostream_withassignment (you can think of it as a variable\
    \ of the structure ostream_withassignment). It stands as an alias for the console\
    \ output device, that is, the monitor (hence the name).\n\nThe << symbol, the\
    \ left shift operator, has its definition extended in C++. In the context, it\
    \ operates as the insertion operator. It is a binary operator. It takes two operands.\
    \ The operand on its left must be a value of some fundamental data type. The value\
    \ on the right side of the insertion operator is 'inserted' (hence the name) into\
    \ the stream headed towards the device associated with the object on the left.\
    \ Consequently, the value of 'x' is displayed on the monitor.\n\nThe file istream.h\
    \ needs to be included in the source code to ensure successful compilation because\
    \ the object cout and the insertion operator have been declared in that file."
