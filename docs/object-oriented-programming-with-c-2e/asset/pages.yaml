  md: '# Exception Handling 415


    In order to overcome this problem, classes whose objects function like pointers
    should be devised. Obviously, such objects will have pointers embedded in memory.
    Memory will be allocated dynamically for these pointers during the lifetime of
    the objects. This memory will be deallocated through the destructor. Thus, when
    the object is destroyed, the memory locked up and referenced by the embedded pointer
    will be destroyed.


    # Summary


    Statements to detect conditions that prohibit further execution of the library
    function and should be placed within the library function itself. Statements to
    take appropriate action when such conditions are detected and should be placed
    in the functions that call these library functions.


    append the try block with a series of catch blocks, one for each of the exceptions
    expected to be thrown.


    Since the number of fundamental data types is limited, it is better to throw objects
    of exception classes created specifically for the purpose. These objects can be
    initialized with appropriate information before being thrown by the library functions.
    This information can be accessed within the corresponding catch block of the application
    program.


    Exception handling enables the library function to notify the invalid conditions
    to the user using the throw statement. The program terminates prematurely if the
    application ignores such notifications. Application program can catch notifications
    in a try block and take appropriate action in a catch block.


    Uncaught exceptions can be caught by the catch(...) Exceptions can be re-thrown.
    During unwinding of the stack, memory occupied by the objects themselves is destroyed.
    However, the memory acquired dynamically by the pointers embedded in these objects
    remains locked up. This is a limitation of exception handling.


