    \nThe C++ inline function provides a solution to this problem. An inline function\
    \ whose compiled code is 'in line' with the rest of the program. That is, the\
    \ compiler replaces the function call with the corresponding function code. With\
    \ inline code, the program does not have to jump to another location to execute\
    \ the code and jump back. Inline functions, thus, run a little faster than regular\
    \ functions.\n\nHowever, there is a trade-off between memory and speed. If an\
