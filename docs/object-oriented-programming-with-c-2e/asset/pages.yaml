  md: '# # Appendix D


    # ## Object-Oriented Analysis and Design


    # ### D.1 Introduction


    This appendix gives a brief but comprehensive overview of Object-Oriented Analysis
    and Design (OOAD). OOAD is a design methodology. It is used to model solutions
    of software engineering problems. Models can be translated into actual code written
    in object-oriented languages.


    # ### Why Build Models?


    Software engineering problems are usually quite complex. Different aspects of
    the solution need to be modeled using standard notations. After these models have
    been verified for correctness, they are implemented in actual code.

    Models serve several purposes. Some of them are as follows:


    +   - The solution can be tested for correctness and completeness before actually
    building it.

    - Models help the developers in communicating clearly and precisely with customers
    and also among themselves. This ensures that all parties are in sync with each
    other.

    - Models help developers in visualizing the solution clearly.

    - Complexity of the problem gets reduced since the entire system can be broken
    down into successively smaller portions.


    # ### Overview of OOAD


    *What is OOAD?*


    +   OOAD has the following stages:

    1. Analysis: In this phase, a model of the solution is built. The analysis model
    contains classes with their members, their relationships, etc. The analysis model
    shows what the desired solution must do, not how it will be done. It does not
    contain any implementation details.

    2. System design: In this phase, the analysis is divided into manageable sub-systems.
    Relationships amongst these sub-systems are also modeled. A strategy of attacking
    the problem is formulated. Performance optimization is also finalized.

    3. Object design: In this phase, implementation details are added to the model
    built during the analysis phase.

    4. Implementation: The object model thus created is finally translated into a
    particular programming language.'
