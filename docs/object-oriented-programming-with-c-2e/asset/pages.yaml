    Address of x=0x21873163\n\n# 1.7 Reference Variables in C++\n\nFirst, let us understand\
    \ the basics. How does the operating system (OS) display the value of variables?\
    \ How are assignment operations such as 'x=y' executed during run? A detailed\
    \ answer to these questions is beyond the scope of this book. A brief study is,\
    \ nevertheless, possible and necessary for a good understanding of reference variables.\
    \ What follows is a simplified and tailored explanation.\n\nThe OS maintains the\
    \ addresses of each variable as it allocates memory for them during run time.\
    \ In order to access the value of a variable, the OS first finds the address of\
    \ the variable and then transfers control to the byte address that matches of\
    \ the variable.\n\nSuppose the following statement is executed ('x' and 'y' are\
    \ integer type variables).\n\nx=y;\n\n+   The steps are followed:\n1. The OS finds\
    \ the address of 'y'.\n2. The OS transfers control to the byte whose whose address\
    \ matches this address.\n3. The OS reads the value from the block of four bytes\
    \ that starts with this byte (most C++ compilers use integer-type variables to\
    \ occupy four bytes during run time and will accept this value for our purpose).\n\
    4. The OS pushes the real value into a temporary stack.\n5. The OS finds the address\
    \ of 'x'.\n6. The OS transfers control to the byte address matches this address.\n\
    7. The OS copies the value from the stack, where it had put earlier, into the\
    \ block of four bytes that starts with the byte address it has found above ('x').\n\
    Notice that addresses of the variables on the left as well as the right of the\
    \ assignment operator are defined. However, the value of the right-hand operand\
    \ is also determined. The expression on the right must be capable of being evaluated\
    \ to a value. This is an important point and must be borne in mind. It will enable\
    \ us to understand a number of concepts later."
