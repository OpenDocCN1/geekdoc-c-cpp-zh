  md: "# Object-Oriented Programming with C++\n\nIn the procedure-oriented programming\
    \ system, procedures are dissociated from data and are not part of it. Instead,\
    \ they receive structure variables or their addresses and work upon them. The\
    \ code design is centered around procedures. While this may sound obvious, the\
    \ programming pattern has its drawbacks.\n\nThe drawback with this programming\
    \ pattern is that the data is not secure. It can be manipulated by any procedure.\
    \ Associated functions that were designed by the library programmer do not have\
    \ the exclusive rights to work upon the data. They are not part of the structure\
    \ definition itself. Let us see why this is a problem.\n\nSuppose the library\
    \ programmer has defined a structure and its associated functions as described\
    \ above. Further, in order to perform his/her creation, he/she has rigorously\
    \ tested the associated functions by calling them from small applications. Despite\
    \ his/her efforts, he/she cannot ensure that an application that uses the structure\
    \ will be bug free. The application program might modify variables, not by the\
    \ associated function itself she has created, but by some code inadvertently implement\
    \ the procedure-oriented programming system not prevent unauthorized functions\
    \ from accessing/manipulating variables.\n\nNow, let us look at the situation\
    \ from the programmer's point of view. Considering an application of 25,000 lines\
    \ (quite common in the real world), in which variables of this structure have\
    \ been used extensively. During testing, it is found that the date being represented\
    \ by one of these variables may be 29th February 1999! The faulty piece of code\
    \ that is causing this can be anywhere in the program. Therefore, debugging will\
    \ involve a visual inspection of the entire code (of 25000 lines!) and will be\
    \ limited to the associated functions only.\n\nThe situation becomes especially\
    \ grave if the execution of the code that is likely to corrupt the data is conditional.\
    \ For example:\n\n```\nif(<some condition>)\\  d.m++; // d is a variable of date\
    \ structure... d.m may\n  become 13!\n```\n\nThe condition under which the bug-infected\
    \ code may not arise during testing. While distributing his/her application, the\
    \ application programmer cannot be sure that it will work successfully. Moreover,\
    \ every new piece of code that accesses structure variables will have to be visually\
    \ inspected and tested to ensure that it does not corrupt the members of the structure.\
    \ After all, compilers that implement procedure-oriented programming systems do\
    \ not prevent unauthorized functions from accessing/manipulating structure variables.\n\
    \nLet us think of a compiler that enables the library programmer to assign rights\
    \ to the associated functions for accessing the data members of the corresponding\
    \ structure. After this, our problem is solved. If a function is not one of the\
    \ intended functions accesses the data members of a structure variable, a compile-time\
    \ error will occur. To ensure a successful compile of his/her application, the\
    \ application programmer will be forced to remove those statements that access\
    \ data members of structure variables. Thus, the application that arises out of\
    \ a successful compile will be one of a piece of code that is free of any unauthorized\
    \ access to the data members of structure variables used therein. If a run-time\
    \ error occurs, attention can be focused on the associated library functions.\n\
    \nIt is the lack of data security of procedure-oriented programming systems that\
    \ led to object-oriented programming systems (OOPS). This new system of programming\
    \ is the subject of our next discussion."
  merge: -1
