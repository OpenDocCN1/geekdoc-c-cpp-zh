  md: "# Listing 6.8 Generic function to compute summation of series\n\n```\n// generic\
    \ sum function\nlong int genSum(unsigned int a, unsigned int b,\n      long int\
    \ (*p)())\n{\n  int i;\n  long sum;\n  for(sum=0,i=a;i<b;i++)\n    sum+=(*p)(i);\n\
    \  return sum;\n}\n```\n\nNext, we can call the function by passing the function\
    \ whose returned values to be summed up as the last parameter to this generic\
    \ function. The following lines of code demonstrate this:\n\n```\nxgenSum(1,5,\
    \ factorial);\ngenSum(3,8, cube);\n```\n\nNow, any kind of summation can be carried\
    \ out by this single generic function, provided the function whose returned values\
    \ are being summed returns a long int or a value of compatible type. A very important\
    \ point to be noted is the generic sum function is capable of similarly summing\
    \ the returned values from a function that may be created well into the future!\
    \ The function call:\n\n```\n(*p)(i),\n```\n\nexhibits polymorphic behaviour,\
    \ because while compiling it, it is not known which function will actually be\
