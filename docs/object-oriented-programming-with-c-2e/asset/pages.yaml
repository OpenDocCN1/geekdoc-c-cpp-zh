  md: "# Object-Oriented Programming with C++\n\nThe abort() function simply terminates\
    \ the program. We can also throw an exception from the new handler function. The\
    \ chapter on exception handling explains the syntax of throwing exceptions and\
    \ its superiority over calling the abort().\n\nAnother case of action is to replace\
    \ the new handler function by another one. For this, we can call the set_new_handler()\
    \ function from the existing new handler function and pass the name of the new\
    \ handler as a parameter to it. Of course, such a call should be preceded by the\
    \ code that attempts to resolve the out-of-memory condition first. The new handler\
    \ should be replaced only if this attempt fails. See Listing 3.12.\n\n# Listing\
    \ 3.12 Replacing the new handler function\n\n```\n#include<new.h>\nvoid myNewHandler()\
    \ {\n    //make an attempt to resolve the out-of-memory\n    //condition\n   \
    \ if(above_attempt_fails)\n        set_new_handler(anotherHandler);\n}\n```\n\n\
    An interesting way of defining the new handler is to allocate buffer memory and\
    \ free it by part by part as the needs arise.\n\n# Summary\n\nMemory is allocated\
    \ for program variables during run only. In static allocation, the amount of memory\
    \ to be decided during compile time itself. The instance at which statically allocated\
    \ variable would get created during the program's execution is also decided during\
    \ the program's compilation.\n\nMemory for an array can be allocated using the\
    \ new operator. The syntax for this is follows:\n\nOn the other hand, the amount\
    \ of memory to be decided during run time in case of dynamic memory allocation.\
    \ Moreover, memory can be allocated in response to conditions that arise during\
    \ run time.\n\n```\n<pointer> = new <data_type>[number_of_elements];\n```\n\n\
    Again, dynamically allocated memory can be dynamically allocated to respond to\
    \ conditions that arise run time. Dynamically allocated memory must be deleted,\
    \ and returned to the Operating System. Otherwise, memory leak would occur.\n\n\
    C++ provides the new operator for allocating memory dynamically. The syntax of\
    \ the new operator for allocating memory for a single block\n\nC++ provides the\
    \ delete operator for deallocating dynamically memory. The syntax of the delete\
    \ operator for deallocating memory earlier allocated for a single block\n\n```\n\
    <pointer> = new <data_type>;\n```\n\n```\ndelete <pointer>;\n```\n\nThe new operator\
    \ allocates enough memory in the heap area to accommodate one variable of the\
    \ data type that is passed as its right-hand-side pointer. Further, it returns\
    \ the address of the first byte of this allocated block of memory that can be\
    \ stored in the pointer on the left-hand-side of the assignment operator as shown\
    \ in the above.\n\nThe delete operator deallocates the memory in the heap area\
    \ that the pointer is passed as its right-hand-side points at.\n\nMemory allocated\
    \ for an array can also be deallocated by using the delete operator. The syntax\
    \ for it is follows:\n\n```\ndelete [] <pointer>;\n```"
