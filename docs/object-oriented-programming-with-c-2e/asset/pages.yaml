    \nchar\nint\nfloat\ndouble\ni is not of the same type as 1.1\n\nClass objects,\
    \ pointers to class objects, or references to class objects can also be passed\
    \ to the typeid operator. However, for the typeid operator to work correctly,\
    \ the class whose object, pointer, or reference is passed to it should be polymorphic\
    \ in nature. Otherwise, either of the following will happen depending upon the\
    \ compiler and its settings:\n\n+   * The compiler would issue a compile-time\
    \ warning against the statement in which the typeid operator has been called.\
    \ The OS would throw a run-time error.\n* If a dereferenced base class pointer\
    \ that points at a derived object is passed as a parameter to the typeid operator,\
    \ the typeid operator would not be able to determine the type of the object pointed\
    \ at by the pointer. It would instead return the base class type as the type of\
    \ the object pointed at by the base class pointer, which of course is undesirable."
