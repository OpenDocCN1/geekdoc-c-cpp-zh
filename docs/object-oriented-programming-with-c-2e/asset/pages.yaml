  md: '# 9.5.2 Binary Search Trees


    A binary search tree is a special form of binary tree. In a binary search tree,
    for any given node, the value contained in its left child is less than the value
    contained in the node and the value contained in the node is less than the value
    contained in its right child. For example, the tree shown in Figure 9.61 is a
    binary search tree.


    ![](img/de72044e5491d3e39cd5d97015354b1a_360_0.png)


    Figure 9.61 A binary search tree


    But the binary tree shown in Figure 9.62 is not a binary search tree. This is
    because 81 is larger than 49 and cannot be the value of the left child of the
    node that has 49.


    ![](img/de72044e5491d3e39cd5d97015354b1a_360_1.png)


