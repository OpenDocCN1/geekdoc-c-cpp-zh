  md: '# Object-Oriented Programming with C++


    Suppose,

    d=1;

    m=1;

    y=2002; //1st January, 2002


    Now, if we write

    next_day(&,&&,&y);


    ‘d’ will become 2, ‘m’ will remain 1, and ‘y’ will remain 2002.


    But if

    d=28;

    m=2;

    y=1999; //28th February, 1999


    and we call the function as

    next_day(&,&&,y);


    ‘d’ will become 1, ‘m’ will become 3, and ‘y’ will remain 1999.

    Again, if


    d=31;

    m=12;

    y=1999; //31st December, 1999


    and we call the function as

    next_day(&,&&,y);


    ‘d’ will become 1, ‘m’ will become 1, and ‘y’ will become 2000.

    As you can see, ‘d’, ‘m’, and ‘y’ actually belong to the same group. But there
    is no language construct that actually

    of one may change the value of the other two. There places them in the same group.,
    members of the wrong group may be accidentally sent

    to the function (Listing 1.1)!


    | Listing 1.1 Problem in passing of programmatically independent but logically

    dependent variable |

    | d=28; y1=1999; | //28th February, 1999 |

    | d=19; m=2; y2=1999; | //19th March, 1999 |

    | next_day(&d,&m1,&y1); | //OK |

    | next_day(&d,&m2,&y2); | //What? Incorrect set passed! |


    As be observed in Listing 1.1, there is nothing in the language itself that prevents
    the

    set of variables from being sent to the function. Moreover, integer-type variables
    that

    are not meant to represent dates might also be to the function!

    Let us try to solve the problem. Suppose the next_day() function accepts an array

    as a parameter. Its prototype will


    ```

    void next_day(int *);

    ```


    Let us declare as an array of three integers.

    int date[3];

    date[0]=28;

    date[1]=2;

    date[2]=1999; //28th February, 1999'
