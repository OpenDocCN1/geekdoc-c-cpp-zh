  md: "# 2.1.7 Data Abstraction\n\nThe class construct provides facilities to implement\
    \ data abstraction. Data abstraction is an important concept and should be understood\
    \ properly. Let us take the example of the LCD projector which has data (light\
    \ and fan) as well as member functions (switches that operate the light and fan).\
    \ This real-world object hides its internal operations from the outside world.\
    \ It, thus, obviates the need for the user to know the possible pitfalls that\
    \ may be encountered during operation. During operation, the LCD projector never\
    \ reaches an invalid state. Moreover, the LCD projector does not start in an invalid\
    \ state.\n\nData abstraction is a virtue by which an object hides its internal\
    \ operations from the rest of the program. It makes it unnecessary for the client\
    \ programs to know how the data is internally arranged in the object. Thus, it\
    \ obviates the need for the client programs to write precautionary code when creating\
    \ and while using objects.\n\nNow, in order to understand this concept, let us\
    \ take an example in C++. The library programmer, who has designed the Distance\
    \ class, wants to ensure that the finches of an object of the class should never\
    \ exceed 12. If a value larger than 12 is specified by an application programmer\
    \ calling the Distance::setFinches(), the logic incorporated within the definition\
    \ of the function should automatically increment the value of iFeet and decrement\
    \ the value of finches by suitable amount. A modified definition of Distance::setFinches()\
    \ is as follows:\n\n```\nvoid Distance::setFinches(float y) {\n  finches=y;\n\
    \  if(finches>=12) {\n    iFeet+=finches/12;\n    finches-=((int)finches/12)*12;\n\
    \  }\n}\n```\n\nHere, notice that an application programmer not need send values\
    \ less than 12 when calling the Distance::setFinches(). The default logic within\
    \ the Distance::setFinches() does the necessary adjustments. This is an example\
    \ of data abstraction.\n\nThe above restriction may not appear mandatory. However\
    \ very we will see create classes where similar restrictions will be absolutely\
    \ necessary (and also complicated).\n\nSimilarly, the definition of the Distance::add()\
    \ function should also be modified as follows by the library programmer. Here,\
    \ it can be assumed that the value of finches of neither invoking object nor the\
    \ object appearing ('dd') can be greater than 12.\n\n```\nDistance::add(Distance\
    \ dd) {\n  Distance temp;\n  temp.iFeet=iFeet+dd.iFeet;\n  temp.setFinches(finches+dd.finches);\n\
    \  return temp;\n}\n```\n\nNow, if we write the statements shown in Listing 2.10"
