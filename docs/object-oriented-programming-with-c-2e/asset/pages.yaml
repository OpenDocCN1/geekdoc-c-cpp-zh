  md: '# Preface to the First Edition


    C++ made its advent in the early 1980s and enabled programmers to write their
    programs the object-oriented way. For this reason, the language quickly gained
    popularity and became a programming language of choice. Despite the development
    of a number of competing object-oriented languages including Java, C++ has successfully
    maintained its position of popularity.


    C++ starts where C stops. C++ is a superset of C. All the language features of
    C language appear in C++ with little or no modification. Over and above such features,
    C++ provides a number of extra features, which provide the language its object-oriented
    character.


    # About the Book


    The continued popularity of C++ has led to considerable literature. Inumerable
    books, journals, magazines, and articles have been written on C++. So, why not
    another book about C++?

    The aim of this book is to thoroughly explain all aspects of the language constructs
    provided by C++, doing full justice to the commonly explained topics of C++, the
    book does not neglect the advanced and new concepts of C++ that are not widely
    taught.

    This book is a paper-backed instruction guide for Object-Oriented Programming
    and C++.

    The purpose of this book is two-fold:


    +   * To clarify the fundamentals of the Object-Oriented Programming System

    * To provide an in-depth treatment of each feature and language construct of C++


    This book emphasizes the Object-Oriented Programming System—its benefits and its
    superiority over the conventional Procedure-Oriented Programming System.

    This book starts directly with C++ since the common features of C and C++ are
    anyway covered in books C. Each feature of C++ is covered from the practical point
    of view. Instead of brief introductions, this book gives an in-depth explanation
    of the rationale and proper use of each object-oriented feature of C++.

    To help the readers assimilate the large volume of knowledge contained in this
    book, an adequate number of example programs, well-designed diagrams, and analogies
    with the real world have been given. Some example programs given in this book
    are abstract in nature to help readers focus on the concept discussed.'
