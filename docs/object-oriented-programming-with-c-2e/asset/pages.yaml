    object at the time of creation. It is used to guarantee the initialization of
    data members of the object. (see also Initialization of Data)


    Call by Reference The formal argument of the called function is of reference type.
    (see also reference variables)


    Copy Constructor A constructor that is created whenever an object is created and
    simultaneously equated to another existing object. It is called with respect to
    the object that is getting the existing object is passed as a parameter to it.


    Call by Value The formal argument of the called function is of non-reference type.
    (see also reference variables)


    Data Member A member variable that would contain the values of class objects.
    Each object of the class has its own copy of the data member.


    catch The keyword used to catch a thrown exception. (see also exception handling,
    try, throw)


    Child A class that inherits from another class. (see also inheritance)


    Data Security An object-oriented feature that refers to preventing unauthorized
    functions from accessing data.


    Class A language construct provided by C++ that enables the implementation of
    oriented concepts like data security, guaranteed initialization of data, data
    abstraction, hiding, etc. A class has member functions and member data.


