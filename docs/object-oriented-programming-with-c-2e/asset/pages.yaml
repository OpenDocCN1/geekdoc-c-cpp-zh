  md: 'a tree? There are three ways of doing it—pre-order, in-order, and post-order.
    Keep in mind

    that we stop as soon as we encounter an empty tree.


    The sequence of steps for traversing a non-empty tree in pre-order is as follows:


    +   1. Visit the root.

    2. Visit the left sub-tree in pre-order.

    3. Visit the right sub-tree in pre-order.


    The sequence of steps for traversing a non-empty tree in in-order is as follows:


    +   1. Visit the root.

    2. Visit the right sub-tree in in-order.


    The sequence of steps for traversing a non-empty tree in post-order is as follows:


    +   1. Visit the left sub-tree in post-order.

    2. Visit the right sub-tree in post-order.


    Let us look at some examples now. Consider the tree shown in Figure 9.60, we

    have seen earlier also.


    ![](img/de72044e5491d3e39cd5d97015354b1a_359_0.png)


    **Figure 9.60** A binary tree


    Let us see in the sequence which we the nodes when we follow each of the traversal

    methods. Let us start with pre-order traversal.


    In pre-order, we visit the first root. Hence we get ‘A’. Then we visit the left-

    tree of ‘A’ in pre-order (visiting the right sub-tree of ‘A’ is pending at this
    time). We visit the

    first root, we get ‘B’. Then we visit the left sub-tree of ‘B’ in pre-order (visiting

    right sub-tree of ‘B’ is pending at this time). We visit the first root. Hence
    we get ‘D’. Then,

    time, we visit the left sub-tree of ‘D’ in pre-order (visiting the right sub-tree
    of ‘D’ is pending in

    time, which was pending. There is no left sub-tree for ‘D’, hence we go one step
    back. We visit

    right sub-tree of ‘B’ in pre-order, which was pending. If you continue you get
    ‘E’, ‘G’, ‘C’, ‘F’, ‘H’.


    To conclude, the result of a pre-order traversal of the above tree will be ‘ABDEGFHI’.

    Similarly, the result of an in-order traversal will be ‘DBGEACHFI’. And the result
    of a

    post-order traversal will be ‘DGEBHIFCA’.'
