    \n# 8.1.1 Overloading Operators—The Syntax\n\nOperators are overloaded by writing\
    \ operator-overloading functions. These functions are either member functions\
    \ or friend functions of class whose objects are operands of the overloaded operator.\
    \ Operator overloading functions are very similar to the member functions and\
    \ friend functions we have been reading all along. The only peculiar about them\
    \ is their name. The names of operator-overloading functions are composed of the\
    \ keyword operator followed by the symbol of the operator being overloaded.\n\n\
    The syntax for member functions a given operator is as follows:\n\n```\nclass\
    \ <class_name>\n{\n    <return_type> operator <op> (<arg_list>); //prototype\n\
    };\n<return_type> <class_name> :: operator <op> (<arg_list>)\n{\n    //function\
    \ body\n}\n```\n\nMember functions that overload operators can be private, protected,\
    \ or public. The prototype of the operator-overloading function specifies a return\
    \ type (as do the normal member functions). The keyword operator follows the return\
    \ type. In turn is followed by the symbol of the operator being overloaded. Finally,\
    \ a pair of parentheses containing the formal arguments is specified (as do the\
    \ normal member functions).\n\nThe syntax for a friend function that overloads\
    \ a given operator is as follows:\n\n```\nclass <class_name>\n{\n    friend <return_type>\
