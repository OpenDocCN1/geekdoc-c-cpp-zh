    \ template arguments enclosed in angular brackets. Each type template argument\
    \ is preceded by the keyword class; each non-type template argument is preceded\
    \ by its type. Thereafter, the function is defined using the usual syntax except\
    \ for one important difference. The class name before the scope resolution operator\
    \ is followed by the names of all template arguments enclosed in angular brackets.\n\
    Objects of this template class can be declared as:\n\n```\nX<int> objj;\n```\n\
