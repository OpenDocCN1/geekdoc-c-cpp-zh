    \ is a void pointer. If the value of ‘vPtr’ is\nto be assigned to ‘cPtr’, it needs\
    \ to be typecast first.\n\n```\ncPtr=(char *)vPtr;\n```\n\nHowever, the preceding\
    \ statement can be rewritten as\n\n```\ncPtr=reinterpret_cast *(vPtr);\n```\n\n\
    The compiler generates errors or warnings if casts are absent from conversion\
    \ statements\nwhere a value of one is being converted to an incompatible type.\
    \ These errors and\nwarnings can be switched off by inserting cast operators.\
    \ Inserting a cast operator is a way\nof expressing our awareness and acceptance\
    \ of the potential consequences to the compiler\n the reader.\n\nAs in case of\
    \ static_cast, the reinterpret_cast operator seems to be an unnecessary\nsubstitute\
    \ of the old style cast. Again, in the case of static_cast, the visibility of\
    \ the\nnew style is considerably greater than the old style cast, which makes\
    \ tracking down a\nrouge old style cast much easier.\n\n# 8.4.4 const_cast Operator\n\
    \nThe const_cast operator serves the same purpose as the mutable keyword that\
    \ has been\nexplained in Chapter 2. The const_cast operator is used to cast away\
    \ the constness of a\npointer.\n\nWe may recall the following listing on mutable\
    \ data members from Chapter 2 (Listing\n2.21).\n\n```\n/*Beginning of mutable.h*/\n\
    class A {\n    int x;\n    mutable int y; //non-mutable data member\n        \
    \           //mutable data member\n    public:\n    void abc(const) const //a\
    \ constant member function\n    {\n        x++; // //ERROR: cannot modify a non-mutable\
    \ data member\n               //member in a constant member function\n       \
    \        //OK: can modify a mutable data member in a\n               //constant\
    \ member function\n        y++;\n    }\n    void def() //a non-constant member\
    \ function\n    {\n        x++; // //OK: can modify a non-mutable data member\n\
    \             //in a non-constant member function\n        y++; // //OK: can modify\
    \ a mutable data member in a\n             //non-constant member function\n  \
    \  }\n```"
