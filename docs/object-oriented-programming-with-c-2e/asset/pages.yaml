  md: '# #9 Data Structures


    This data structures are very useful in the world of programming. They are nothing
    special ways in which various pieces of data are arranged and related to each
    other during run time. We are already familiar with one data structure—arrays.
    However, arrays have various limitations.


    You can create data structures like lists, trees, etc. Lists are a superior substitute
    for arrays. Data structures are used to solve a number of programming problems.
    They can be created using various programming languages, including C++. This chapter
    explains the most important data structures—linked lists and trees. It also includes
    full fledged programs that can be used to create various data structures.


    # ## 9.1 Introduction


    As mentioned in the overview, data structures are special ways in which pieces
    of data are arranged and related to each other during run-time. These pieces of
    data can be integers, character strings, strings, etc. Each piece of data is embedded
    in a node that the piece of data itself along with one or more pointers that either
    point at other similar nodes or have null values.


    We will soon learn to create such nodes ourselves. Let us first look at the following
    figure that clearly illustrates such nodes. Each node contains an integer and
    a pointer. The value of the integer in the first node is 10, but the value of
    the integer in the second node is 20. The pointer in the first node points to
    the second node. Let us assume the address of the second node is 1296. Therefore,
    the value of the pointer in the first node will be 1296. The pointer in the second
    node is NULL value. This means that the pointer in the second node is not pointing
    at any other node. This also means that the second node is the last node in the
    list (Figure 9.1).


    ![](img/de72044e5491d3e39cd5d97015354b1a_296_0.png)


    **Figure 9.1** Nodes of a data structure


    We are already familiar with one data structure—arrays. However, arrays have the
    limitation that their size cannot be modified during run time. Whatever size the
    programmer specifies for the array while writing the program remains fixed during
    run time. But, during time,'
