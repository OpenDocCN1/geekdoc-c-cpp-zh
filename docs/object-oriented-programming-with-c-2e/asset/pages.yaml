  md: "# Operator Overloading, Type Conversion, New Style Casts, and RTTI\n\n```\n\
    class A {};\nclass B : public A {}; //no virtual function\nB B1;\nA * ATr=&B1;\n\
    cout<<typeid(APtr).name<<endl; //prints: class A\n```\n\nHad the base class A\
    \ in the preceding code contained at least one virtual function, the last statement\
    \ would have class B as desired.\nGiven that class A has a virtual function, what\
    \ would the following tests evaluate to?\n\n```\ntypeid(APtr) == typeid(A\\*)\
    \ //comparing pointers\ntypeid(*APtr) == typeid(A) //comparing objects pointed\n\
    //at\n```\n\nThe first of these expressions would return true while the second\
    \ one would return false. In the first case, the types of, and not the types of\
    \ the objects being pointed at, are compared. Since ‘APtr’ is of type ‘A*', the\
    \ first statement returns true. In the second case, the types of the objects being\
    \ pointed at, and not the pointers, are compared. Since '*APtr is of type B, the\
    \ second statement returns false.\n\n# Summary\n\nIn C++, the library programmer\
    \ can provide operators with additional capabilities to operate upon objects of\
    \ his/her class. This is known as operator overloading.\n\nOperators can be overloaded\
    \ by functions whose names composed of the keyword operator and the symbol of\
    \ the operator being overloaded. These functions may be member functions or friend\
    \ functions. Friend functions are used when the objects of the class for which\
    \ the operator is overloaded invariably appear on the right-hand side of the operator.\n\
    \n+   * Neutralize the effect of the functions that are generated by default (the\
    \ 'assignment' operator).\n* To make the operation of the operators more efficient\
    \ (the new and delete operators).\n* To provide capabilities to the class so that\
    \ its objects can be used in predefined templates.\n\nThe rules for operator overloading\
    \ are as follows:\n* New operators cannot be created.\n* Meaning of existing operators\
    \ cannot be changed.\n* The following cannot be overloaded:\n* basic type to class\
    \ type (by using a constructor),\n* class type to basic type (by using a conversion\
    \ operator), and\n* class type to class type (by using either a constructor or\
    \ a type conversion).\n\nThe C++ language provides a new set of operators for\
    \ typecasting. These operators can be used instead of the highly error-prone method\
    \ of typecasting provided by the C language.\n\n+   (member selection)\n* (member\
    \ selection through pointer to member)\n?: (conditional operator)\nsizeof (finding\
