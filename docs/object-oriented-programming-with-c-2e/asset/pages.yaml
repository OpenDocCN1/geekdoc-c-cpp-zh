  md: '# Object-Oriented Programming with C++


    is of two types—static and dynamic. (see also Static Binding, Static Polymorphism,
    Early Binding, Dynamic Binding, Dynamic Polymorphism, Late Binding)


    Stacks are very similar to linked lists.

    However, in a stack, we can add a node to the beginning. Moreover, in a stack,
    we can delete a node from the beginning.


    **Private Class Members** members of a class that have been declared under the
    private section of a class. Private class members can be accessed by member functions
    of the same class.


    static_cast Operator The difference between the static operator and the dynamic
    cast operator is that the dynamic cast operator carries out a run-time check to
    ensure a valid conversion, the static cast operator carries out no check.


    **Procedure-Oriented Programming** In this system, code is divided into procedures.
    Data and procedures that work upon the data are not bound together.


    **Static Binding** (see early binding)

    **Static Data Member** Static data members hold global data that is common to
    all objects of the class. Static data members are members of the class and not
    any object of the class, they are not contained inside any object.


    **Protected Class Members** members of a class that have been declared under the
    protected section of a class. Protected class members can be accessed by member
    functions of the class and those of the derived class.


    **Static Function Member** Static member functions are not called with an existing
    object. This function''s purpose is to allocate and/or modify data members of
    the class.


    **Public Class Members** Function and members of a class that have been declared
    under the public section of a class. Public class members can be accessed by not
    only the member functions of the class and those of the derived class. They can
    be accessed by global non-member functions.


    **Memory Allocation** In this method of memory allocation, the amount of memory
    and the time at which it would get during run-time are both decided during compile
    time.


    **Pure Virtual Functions** A special type of virtual function whose declaration
    is followed by “=”. Presence of a pure virtual function makes the class an abstract
    base. A derived class must not override the virtual functions of the base class.
    (see abstract base class, virtual functions)


    **Static Deallocation** In this method of memory allocation, the amount of memory
    to be deallocated and the time at which it would get deallocated during run-time
    are both decided during compile time.


    **Queues** are very similar to linked lists. However, in a queue, we can add a
    node to the end. Moreover, in a queue, we can delete a node from the beginning.


    **Static Polymorphism** (see early binding)

    Structure a language in C that enables the programmer to put together data that
    influence others'' values and should before put together. C does not allow the
    programmer to define member functions inside structures. This lacks of data security.


    **Reference Variables** A reference is a reference to another variable. It does
    not occupy its own memory. It shares the memory with the variable of which it
    is a reference.


    **Subclass** (see child class, derived class, inheritance)


    **reinterpret_cast** A new operator that allows the conversion of one type to
    another.


    **SuperClass** (see parent class, base class, inheritance)

    this pointer A constant pointer that gets to each member function as a leading
    formal argument. It points at the object for which the function is called.


    **Scope Resolution Operator** An operator that enables the C++ programmer to define
    a member function outside the class.'
