  md: '# Object-Oriented Programming with C++


    # Summary


    Streams are nothing but a flow of data to from program variables. Input stream
    is the flow of data from a file on the permanent storage medium to program variables.
    The keyboard is also treated as source of input stream. Output stream is the flow
    of data to a file on the permanent storage medium from program variables. The
    monitor is also treated as target for output streams.


    C provides us with a hierarchy of classes to implement various aspects of stream
    handling. The class ios is the base class in this hierarchy.


    The class ostream is derived from the class ios and handles the general operator
    (<<) is defined and overloaded in the class ostream to handle output streams from
    program to variables.


    The class ostream_withassign is derived from the class ofstream. cout is an object
    of the class ostream. cout stands for console output. As mentioned earlier, C++
    treats all peripheral devices as files. The monitor is a file (for output). cout
    represents the monitor.


    The class istream is derived from class ios and handles the general input streams.
    The extraction operator (>>) is defined and overloaded in the class stream to
    handle input streams from program variables.


    The class istream_withassign is derived from the class cin. cin is an object of
    the class istream_withassign. cin stands for console input. C++ treats all peripheral
    devices. It treats the keyboard as a file (for input). The object cin represents
    the keyboard.


    The class ios is derived by multiple inheritance from the classes istream and
    ostream. It has the functionality to handle both input and output streams. The
    class ostream is derived from the class stream. It has the functionality to handle
    output streams to disks. The class ofstream is derived from the class istream.
    It has the functionality to handle both input and output streams from and disk
    files.


    In text mode, numeric data that exists in base 2 format in the memory variables,
    is first converted to base 10 before being output. In binary mode, no such conversion
    occurs.


    In text mode input, numeric data that is being input into a memory variable is
    reckoned to be in base 10 format. Otherwise, it is first converted into base 2
    format and then stored in the target variable.


    The insertion operator is used to output in text mode. The put() function is used
    to output a single character at a time. The get() function is used to data in
    text mode to output a single character at a time.


    The write() function is used to output in binary mode. The read() function is
    used to output in binary mode.


    Apart from the constructors of the library classes, the open() function can be
    used to open files. The first parameter that the constructor and the open() function
    is the name of the file. The second parameter specifies the object. Destruction
    of stream classes closes the files associated with any. The close() can be used
    to explicitly close files.


    Files can be managed by the seek() and seek() functions. Their current positions
    are determined by the tell() and tell() functions. An intermediate record can
    be directly accessed using the seek() or seekg() function to make the file pointer
    jump to a specific byte in the file. It is used by member functions for outputting
    and inputting data of complex classes.


    Every class of istream, ostream or a class that is derived from one of these classes
    contains three flags that indicate state of the next in the associated file. These
    flags are:


    +   - eofbit becomes true if there is end of input

    (eof()) returns the state of the eofbit flag.


    +   - failbit becomes true if the read/write error occurs

    (fail()) returns the state of the failbit flag.


    +   - badbit becomes true if the file being read is corrupt during recovery (the
    bad()) function returns the state of the badbit flag.


    The clear() function is used to clear the bits C++ provides several pre-defined
    manipulators. The programmer can use his own application-specific manipulators.'
