    A2.h\"\nvoid main() \n{\n    A Objj; //ERROR: Ambiguity error due to multiple\n\
    \    //definitions of A\n}\n/*End of multiDef01.cpp*/\n```\n\nThe scenario in\
    \ Listing 2.43 is quite likely in large programs. The global visibility of the\
    \ definition of class A makes the inclusion of the two headers mutually exclusive.\
    \ Consequently, this also makes use of the two definitions of class A mutually\
    \ exclusive.\n\nHow can this problem be overcome? How can we ensure that an application\
    \ is able to use both definitions of class A simultaneously? Enclosing the definitions\
    \ of the class in separate namespaces overcomes this problem.\n\n```\n/*Beginning\
    \ of A1.h*/\nnamespace A1\n{\n    class A\n    {\n    };\n}//end of a namespace\
    \ A1 //beginning of a namespace A\n/*Beginning of A2.h*/\nnamespace A2\n{\n  \
    \  class A\n    {\n    };\n}//end of a namespace A2 //beginning of a namespace\
    \ A\n```\n\nNow, the two definitions of class are enveloped in two different namespaces.\
    \ The corresponding namespace, followed by the scope resolution operator, must\
    \ be prefixed by the name of the class referring to it anywhere in the source\
    \ code. Thus, the ambiguity encountered in the above listing can be overcome.\
    \ A revised definition of the main() function from Listing 2.43 follows (Listing\
    \ 2.44)\n\n# Listing 2.44 Enclosing classes in namespaces prevents pollution of\
    \ the global namespace\n\n```\n/*Beginning of multiDef02.cpp*/\n#include \"A1.h\"\
    \n#include \"A2.h\"\nvoid main() \n{\n    A1::A Obj1; //OK: Obj1 is an object\
