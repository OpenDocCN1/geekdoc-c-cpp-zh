  md: "# Object-Oriented Programming with C++\n\nvalue would have to be maintained\
    \ for this data in all objects. This is very difficult. Thus, this data cannot\
    \ be stored in a member variable of class Account.\nat the same time, this data\
    \ should not be stored in a global variable. Then the data is liable to be changed\
    \ by even non-member functions. It will also potentially lead to name conflicts.\
    \ However, this means that it should be stored in a member variable of class Account!\n\
    \nHow can this conflict be resolved? Storing the data in a static variable of\
    \ the class resolves this conflict. Static data members are members of the class\
    \ and not of any object of the class, that is, they are not contained inside any\
    \ object.\n\nWe prefix the declaration of a variable within the class definition\
    \ with the keyword static to make it a data member of the class. See Listing 2.30.\n\
    \n# Listing 2.30 Declaring a static data member\n\n```\n/Beginning of Account.h*/\n\
    class Account\n{\n    static float interest_rate; // a static data member\n  \
    \  rest of the class Account\n};\n/End of Account.h*/\n```\n\nA statement declaring\
    \ a static data member inside a class will obviously not cause any memory to get\
    \ allocated for it. Moreover, memory for a static member will not get allocated\
    \ when objects of the class are declared. Because a static data member is not\
    \ member of any object. Therefore, we must not forget to write the statement to\
    \ define (allocate memory) for a static variable. Explicitly defining a static\
    \ data member outside the class is necessary. Otherwise, the linker produces an\
    \ error. The following statement allocates memory for interest_rate member of\
    \ class Account.\n\n```\nfloat Account::interest_rate;\n```\n\nThe above statement\
    \ initializes interest_rate to zero. If some other value (say 4.5) is desired,\
    \ the statement should be rewritten as follows.\n\n```\nfloat Account::interest_rate=4.5;\n\
    ```\n\nStatic data members should be defined in the implementation files only.\
    \ The header file is included in both the implementation file and the driver program.\
    \ If the static data member's definition would be in two files—the library file\
    \ created from the implementation file and the object file created from the driver\
    \ program. But in order to get the executable, the linker will have to link these\
    \ files. Upon finding two definitions of the static data member, the linker would\
    \ throw an error.\n\nMaking static members private prevents any from non-member\
    \ functions as only member functions can change the values of static data members.\
    \ Static data members does not increase the size of objects of the class. Static\
    \ data members are not contained within objects. There is only one copy of the\
    \ static data member in the memory. Let us try the following program (Listing\
    \ 2.31) to find out."
