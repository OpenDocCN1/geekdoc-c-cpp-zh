  md: '# Summary


    C++ allows a class to be defined in such a way that it automatically includes
    member data and member functions of an existing class. As usual, it allows additional
    member data and member functions to be defined in the new class. This is also
    called inheritance.


    specifier retains the access level of base members. Deriving from the protected
    access specifier reduces the access level of public base class members to protected
    while the access level of protected and private base members remains unchanged.
    Deriving by the private access specifier reduces the access level of public and
    protected base class members to private while access level of public base class
    members remains unchanged. The default access specifier for inheritance is ''private''.


    The existing class whose features are inherited is known as the base class or
    parent or super class. The new class is defined by inheriting from the base class
    is known as the derived class or child class.


    In inheritance, a class derives from more than one class. Multiple inheritance
    leads to a number of ambiguities. Ambiguity arises if or more of the base classes
    have a member of the same name. Ambiguity can also arise if two or more classes
    inherit from a common base class. This is known as diamond-shaped inheritance.
    These ambiguities are resolved by the following:


    Objects of the derived class contain data members of the base class. Objects of
    the base class can call member functions of the derived class as well as those
    of the base class.


    By allowing only the common data and common member functions in the base class,
    inheritance enables readability and code maintenance. Inheritance implements an
    ''is-a'' relationship whereas containment implements a ''has-a'' relationship.
    Friendship is not inherited.


    +   * Using the resolution operator and passing the name of the actual class to
    call the function in the intermediate base class

    * Overriding the function of the ultimate base class in the intermediate base
    class

    * Deriving the base classes by using the virtual keyword


    A base pointer can point at an object of the derived class. A derived class pointer
    cannot point at an object of the base class.


    When a class inherits from a derived class, it is known as multi-level inheritance.
    In hierarchical inheritance, a single class serves as a base for the derived class(s).
    Hybrid inheritance is a mixture of the above kinds of inheritance.


    Member functions of the base class can be overridden in the derived class. Defining
    a member function in the derived class in such a manner that its name and signature
    match those of a base class function is known as overriding.


    +   Constructors are invoked in the following order:

    * Virtual base constructors in the order of inheritance

    * Non virtual base constructors in the order of inheritance

    * Member objects'' constructors in the order of declaration

    * Derived class constructor


    Base classes can be initialized with values that are passed to the constructor
    of the derived class. These values can be passed to the base class constructor.


    ''Protected'' members are inaccessible to non-member functions. But they are accessible
    to the member functions of their own class and member functions of the derived
    classes.


    Classes are derived by the public, protected, and private keywords. Deriving by
    the public access


    Destructors are invoked in the reverse order.


    # Key Terms


    function members of base class and objects of the derived class


    base class, parent class, super class


    keeping common features in base class for code reusability


    derived class, child class, subclass


    data members of base class and objects of the derived class


    base class and derived pointers


    initance'
