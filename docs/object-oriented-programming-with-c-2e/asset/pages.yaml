    \ Type template arguments are those that represent a data type. An actual built-in\
    \ or user-defined type replaces them when an object is declared. Each type template\
    \ argument is preceded by the keyword class. Non-type template arguments are variables\
    \ of built-in or user-defined type. Actual constant values are passed for these\
    \ non-type template arguments. The data type precedes each non-type template argument.\
    \ Thereafter, the class is defined using the usual syntax. Member functions of\
