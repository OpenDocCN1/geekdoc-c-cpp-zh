    \ function of a class template\n\n```\ntemplate<class T>\nvoid X<T>::f1(const\
    \ T &p)\n/*\ndefinition of the function\n*/\n```\n\nMember functions of a template\
    \ class are defined in the same way as the template class itself. The definition\
