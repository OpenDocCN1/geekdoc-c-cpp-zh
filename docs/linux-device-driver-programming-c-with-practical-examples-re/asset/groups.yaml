    \ 和 `my_device_write` 函数使用 `file->f_flags & O_NONBLOCK` 检查文件描述符是否处于非阻塞模式。\n- 如果启用了非阻塞模式，当读取数据不可用或设备无法接受写入数据时，函数会返回\
    \ `-EAGAIN`。\n- 否则，函数会使用 `wait_for_data` 和 `wait_for_space` 等待数据或空间变得可用（通常涉及等待队列）。\n\
    \n## 处理部分 I/O\n\n处理部分 I/O 操作非常重要，即实际读取或写入的字节数少于请求的数量。这可能是由于缓冲区限制或设备限制等各种原因造成的。驱动程序应返回实际传输的字节数并相应地更新文件位置。\n\
    \n## 轮询 I/O 就绪状态\n\n为了在非阻塞模式下高效确定何时可以进行 I/O 操作，驱动程序可以使用 `poll` 系统调用。`poll` 函数允许进程监控多个文件描述符的就绪状态。驱动程序的\
    \ `poll` 函数应指示哪些事件（读、写等）可用。\n\n## 异步通知\n\n对于更复杂的场景，可以使用 `fasync` 进行异步通知。驱动程序注册一个回调函数，在事件发生时被调用。这种方法在某些情况下比轮询更高效。\n\
    \n## 非阻塞 I/O 的注意事项\n\n- **性能：** 非阻塞 I/O 可以通过防止进程阻塞并允许更好的资源利用来提高性能。\n- 复杂性：实现非阻塞\
    \ I/O 需要仔细的错误处理和状态管理。\n- 数据完整性：通过正确处理部分 I/O 操作来确保数据完整性。\n- 上下文切换：非阻塞 I/O 中可能发生频繁的上下文切换，这在某些情况下可能会影响性能。\n\
    \n- 使用适当的锁定机制来保护共享数据结构。\n- 对于高性能应用，请考虑使用异步 I/O（aio）。\n- 优化数据传输路径以最小化开销。\n- 在不同条件下彻底测试你的驱动程序以识别潜在问题。\n\
    \n非阻塞 I/O 是构建响应迅速且高效的 Linux 设备驱动程序的强大技术。通过仔细考虑权衡并实现适当的错误处理，你可以创建在不阻塞系统的情况下有效处理\
    \ I/O 操作的驱动程序。\n\n## Linux 设备驱动编程中的异步 I/O\n\n异步 I/O（AIO）是一种范式，其中 I/O 操作在不阻塞调用进程的情况下启动。这使得进程可以在\
    \ I/O 操作进行的同时继续执行。在 Linux 设备驱动中，AIO 对于处理高性能和并发 I/O 工作负载至关重要。\n\nLinux 内核提供了一组异步\
    \ I/O 函数，用于异步执行读、写和其他 I/O 操作。使用 AIO 的基本步骤包括：\n\n1. **准备 AIO 上下文：** 这涉及创建 aio_context\
    \ 结构并对其进行初始化。\n2. **提交 I/O 请求：** 创建 aiocb 结构来表示每个 I/O 请求，并使用 io_submit 函数提交它们。\n\
    3. **等待完成：** 使用 io_getevents 函数等待 I/O 完成事件。\n4. **处理完成事件：** 处理已完成的 I/O 请求并释放资源。\n\
    \n## 设备驱动中的 AIO\n\n要在设备驱动中支持 AIO，你需要实现处理异步 I/O 请求所需的函数和数据结构。以下是涉及步骤的基本概述：\n\n\
    - **创建 AIO 上下文：**\n\n```\nC\n\nstruct aio_context ctx = aio_context_alloc(MAX_NR_EVENTS);\
    \ if (!ctx)\n    return -ENOMEM;\n```\n\n- **处理异步读请求：**\n\n![](img/ac3ad875fcf65d3ecc3d8ea995c85f9e_154_0.png)\n\
    \n- 处理异步写请求：\n\n```\nC\n\nstatic int my_device_aio_write(struct kiocb *iocb) {\n\
    \    struct aio_context *ctx = iocb->private;\n    struct my_device *dev = iocb->private;\n\
    \n    // Prepare aiocb for write operation\n    // ...\n\n    int ret = io_submit(ctx,\
    \ 1, &iocb);\n    if (ret != 1) {\n        // Handle error\n    }\n\n    return\
    \ 0; // Async operation started\n}\n```\n\n- 处理完成事件：\n\n```\nC\n\nstatic void\
    \ my_device_aio_completion(struct aio_context *ctx, struct io_event *events, long\
    \ count) {\n    for (int i = 0; i < count; i++) {\n        struct kiocb *iocb\
    \ = events[i].obj;\n        struct my_device *dev = iocb->private;\n\n       \
    \ // Process completed I/O request\n        // ...\n\n        kfree(iocb);\n \
    \   }\n```\n\n关键点\n\n- AIO 上下文：aio_context 结构管理异步 I/O 操作。\n\n"
