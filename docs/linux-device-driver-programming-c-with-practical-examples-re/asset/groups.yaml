    \nkdb 直接在目标机器上提供更有限但通常足够的调试体验。\n\n**访问 kdb：** 通常，你需要触发内核崩溃或使用特定的组合键进入 kdb。具体方法取决于你的系统配置。\n\
    \n### 基本命令：\n\n```\npc # 打印程序计数器\nbacktrace # 打印调用栈\nexamine /x $sp # 检查栈指针处的内存\n\
    ```\n\n## 高级调试技术\n\n- **核心转储：** 生成核心转储用于事后分析。\n- **监视点：** 在内存位置设置断点。\n- **单步执行：**\
