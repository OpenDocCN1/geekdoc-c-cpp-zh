    \ result;\n}\n```\n\n### 并发与同步\n\n自旋锁和互斥锁：对短暂的非阻塞任务使用自旋锁，对较长的阻塞操作使用互斥锁。确保正确加锁以防止竞争条件。\n\
    \n```cpp\nstatic DEFINE_SPINLOCK(my_lock);\nstatic void my_function() {\n    spin_lock(&my_lock);\n\
