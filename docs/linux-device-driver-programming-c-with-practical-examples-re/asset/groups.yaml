  mdcn: "\n\n- **性能分析与基准测试**：使用 perf 等工具来识别性能瓶颈。\n- **实时测试**：在真实环境条件下进行彻底测试。\n- **硬件支持**：确保硬件能力与实时要求相匹配。\n\
