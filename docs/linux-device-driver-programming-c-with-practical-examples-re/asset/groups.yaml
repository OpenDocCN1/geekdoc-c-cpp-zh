    # Module Structure


    A basic kernel module consists of three essential functions:


    +   - **module_init()**: This function is called when the module is loaded into
    the kernel. It performs initialization tasks, such as registering device drivers,
    allocating resources, and setting up data structures.

    +   - **module_exit()**: This function is called when the module is unloaded from
    the kernel. It performs cleanup tasks, such as unregistering device drivers, releasing
    resources, and freeing memory.

    +   - **module_license()**: This macro specifies the license under which the module
    is distributed.


    # Module Loading and Unloading


    To load and unload a kernel module, you typically use the following commands:


    +   - **insmod**: Loads a module into the kernel.

    +   - **rmmod**: Unloads a module from the kernel.


    # Example:


    ```

    Bash

    # Load the module

    sudo insmod my_module.ko


    # Unload the module

    sudo rmmod my_module

    ```


