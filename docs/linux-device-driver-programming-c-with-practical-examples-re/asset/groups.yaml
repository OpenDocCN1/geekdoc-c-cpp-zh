    \ 程序代码、数据、栈和堆。\n- **Process Control Block (PCB):** 包含进程相关信息，如进程状态、寄存器、内存管理信息和调度信息。\n\
    - **Process States:** 运行、就绪、等待、新建和终止。\n\n### Process Creation and Termination\n\
    \n新进程使用 `fork()` 系统调用创建。这会复制父进程，包括其内存空间。然后子进程可以修改其副本。\n\n"
