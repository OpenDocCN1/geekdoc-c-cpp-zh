    # PM Runtime: Fine-Grained Power Management


    While the core power management framework handles system-wide suspend/resume,
    PM Runtime provides a more granular approach for managing device power states
    based on their usage patterns. This is especially useful for devices that are
    frequently accessed but have periods of inactivity.


