  md: "# Chapter 13\n\n# Kernel Debugging with Printk\n\n# Understanding Printk\n\n\
    Printk is the primary debugging tool for kernel developers. It's akin to printf\
    \ in user space, but with some key differences tailored for the kernel environment.\
    \ Printk messages are typically directed to the kernel log, accessible through\
    \ dmesg.\n\n```\nBasic Printk Usage\nC++\n#include <linux/kernel.h>\n\nvoid my_function(int\
    \ arg) {\n    printk(KERN_INFO \"My function called with arg: %d\\n\", arg);\n\
    }\n```\n\n+   - KERN_INFO is a log level. There are several others like KERN_ERR\
    \ (error), KERN_WARNING, KERN_DEBUG, etc.\n+   - The format string and arguments\
    \ work similarly to printf.\n+   - \\n is used for newline.\n\n# Log Levels\n\n\
    Printk messages are categorised by log levels. The kernel only prints messages\
    \ at or above the configured log level."
  merge: -1
  img_proc: true
