    \ process.\n+   2. **PM domain suspend:** Devices within a PM domain are suspended\
    \ in a coordinated manner.\n+   3. **Device suspend:** Individual device drivers\
    \ implement their suspend logic.\n\nThe resume process follows the reverse order."
