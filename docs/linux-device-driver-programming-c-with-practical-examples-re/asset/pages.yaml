- pgno: 333
  md: "```\nstruct device_driver {\n // ... various fields ...\n int (*probe)(struct\
    \ device *); // Probe function\n int (*remove)(struct device *); // Remove function\n\
    };\n```\n\n# Memory Management\n\n+   • struct page: Represents a page of physical\
    \ memory.\n+   • struct kmem_cache: Represents a slab allocator for objects.\n\
    \n# Process Management\n\n+   • struct task_struct: Represents a process or thread.\n\
    \nDevice drivers typically interact with these structures through file operations.\
    \ When a user application opens a device file, the kernel creates a struct file\
    \ object and calls the open() function in the device's struct file_operations.\
    \ The open() function can access the device-specific data through the struct inode\
    \ associated with the file."
