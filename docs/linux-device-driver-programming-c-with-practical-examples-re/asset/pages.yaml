    \ is about to enter a low-power state. The driver should save device state, disable\
    \ interrupts, and put the device into a low-power state.\n+   - **resume:** This\
    \ function is called when the device is resuming from a low-power state. The driver\
    \ should restore device state, enable interrupts, and bring the device back to\
    \ full operation.\n\n![](img/ac3ad875fcf65d3ecc3d8ea995c85f9e_268_0.png)\n\n#\
