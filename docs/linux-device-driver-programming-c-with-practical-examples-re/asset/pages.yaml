    +   - Identify performance bottlenecks: Use perf to find performance-critical
    sections.

    +   - Analyze function execution: Use Ftrace to understand the call graph and
    function arguments.

    +   - Correlate events: Combine trace and profile data to identify the root cause
    of performance issues.


