    \ example of a NOOP elevator:\n\n```\nC\nstruct noop_data {\n    struct list_head\
    \ queue;\n};\n\nstatic void noop_add_request(struct request_queue *q, struct request\
    \ *rq) {\n    struct noop_data *nd = q->elevator->elevator_data;\n    list_add_tail(&rq->queuelist,\
    \ &nd->queue);\n}\n\nstatic struct request *noop_fetch_request(struct request_queue\
    \ *q) {\n    struct noop_data *nd = q->elevator->elevator_data;\n    struct request\
