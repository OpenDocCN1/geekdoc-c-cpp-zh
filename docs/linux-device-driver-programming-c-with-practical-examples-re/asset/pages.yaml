- pgno: 145
  md: "```\nC\nstatic unsigned int my_device_poll(struct file *file, poll_table *wait)\
    \ {\n    unsigned int mask = 0;\n\n    /* Check device state to determine available\
    \ events */\n    if (device_has_data_to_read()) {\n        mask |= POLLIN | POLLRDNORM;\n\
    \    }\n    if (device_can_accept_write()) {\n        mask |= POLLOUT | POLLWRNORM;\n\
    \    }\n\n    /* Add the current process to the wait queue */\n    poll_wait(file,\
    \ &my_device_wait_queue, wait);\n\n    return mask;\n}\n```\n\nIn this example,\
    \ my_device_wait_queue is a wait queue associated with the device. The poll_wait\
    \ function adds the current process to the wait queue and returns the mask of\
    \ available events.\n\n# Fasync\n\nThe fasync mechanism is used to asynchronously\
    \ notify user-space processes about events on a file descriptor. The driver registers\
    \ a callback function to be invoked when an event occurs.\n\n# Implementation\n\
