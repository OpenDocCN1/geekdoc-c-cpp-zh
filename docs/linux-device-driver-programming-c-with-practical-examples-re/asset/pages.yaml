    # 2. Network Namespace


    A network namespace isolates network resources for a specific process or group
    of processes. Each namespace has its own network stack, routing tables, and network
    interfaces.


    ```

    C++

    #include <linux/net.h>

    #include <linux/nsproxy.h>


    struct net_namespace ns;

    unshare(CLONE_NEWNET);

    ns = current->nsproxy->net_ns;

    // Create network interfaces, routing tables, etc. within the namespace

    ```


    # 3. Virtual Devices


    Virtual devices can be created to represent specific network functions, such as
    bridges, tunnels, or firewalls.


    ```

    C++

    #include <linux/if_bridge.h>


    struct net_device br;

    br = br_add("br0");

    // Add interfaces to the bridge

    ```


