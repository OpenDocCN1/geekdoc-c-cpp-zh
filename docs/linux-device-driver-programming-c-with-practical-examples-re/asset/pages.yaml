  md: '+   - **Suspend State:** The device is in a deeper low-power state, requiring
    more time to resume.


    # PM Runtime API


    Device drivers can utilise the following PM Runtime API functions:


    ```

    C


    int pm_runtime_enable(struct device *dev);


    void pm_runtime_disable(struct device *dev);


    int pm_runtime_put_autosuspend(struct device *dev);


    int pm_runtime_get_sync(struct device *dev);

    ```


    +   - **pm_runtime_enable:** Enables PM Runtime for the device.

    +   - **pm_runtime_disable:** Disables PM Runtime for the device.

    +   - **pm_runtime_put_autosuspend:** Indicates that the device is no longer needed
    and can be put into an idle state.

    +   - **pm_runtime_get_sync:** Indicates that the device is needed and should
    be brought back to the active state.


    # Usage Example


    C


    ```

    #include <linux/pm_runtime.h>


    static int my_device_probe(struct platform_device pdev) // device initialization


    pm_runtime_enable(&pdev->dev);


    return 0;

    ```'
