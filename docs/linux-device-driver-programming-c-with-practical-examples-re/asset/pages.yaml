    # Logical Volume Management (LVM)


    LVM is a storage management technology that allows you to group and manage multiple
    physical disks or partitions as a single logical volume. This provides flexibility
    in resizing, creating, and managing storage resources without affecting the underlying
    file systems.


    # Key Components:


    +   - **Physical Volume (PV):** A physical disk or partition used as part of an
    LVM setup.

    +   - **Volume Group (VG):** A collection of physical volumes managed as a single
    unit.

    +   - **Logical Volume (LV):** A portion of a volume group formatted with a file
    system.


    **Implementation in Linux:** Linux provides LVM support through the lvm command-line
    tools.


    # Example:


    Bash


    ```

    # Create a physical volume

    pvcreate /dev/sda

    ```


    ```

    # Create a volume group

    vgcreate myvg /dev/sda

    ```


    ```

    # Create a logical volume

    lvcreate -L 10G -n mylv myvg

    ```


