  md: 'A VNIC is a virtual representation of a physical network interface card (NIC).
    It provides a network connection for a virtual machine. The host operating system
    manages the VNIC and maps it to the underlying physical network.


    # Virtual Switch


    A virtual switch is a software component that manages network traffic within a
    virtual environment. It acts as a central point for connecting virtual machines
    to each other and to the physical network.


    # Types of Virtual Networking


    +   - **Full Virtualization:** Each VM has its own virtual NIC and the virtual
    switch handles packet forwarding between VMs.

    +   - **Paravirtualization:** The VM hypervisor provides a virtualized network
    interface to the guest OS, optimizing performance.

    +   - **Container Networking:** Uses the host kernel''s networking stack, sharing
    network namespaces between containers.


    # Implementing Virtual Networking in Linux


    Linux provides several mechanisms for implementing virtual networking: 1. Virtual
    Ethernet (veth) Pairs


    A veth pair consists of two virtual network interfaces. Packets sent on one interface
    appear on the other. This is commonly used for connecting VMs to a virtual switch.


    ```

    C++

    #include <linux/if_ether.h>

    #include <linux/if_vlan.h>

    #include <linux/netdevice.h>

    #include <linux/netlink.h>


    struct net_device v1, v2;

    veth_init(v1);

    veth_init(v2);

    veth_pair(v1, v2);

    ```'
