    # Block Device Driver API Overview


    A block device driver in Linux provides an interface between the kernel and a
    block storage device (like a hard disk). It handles requests for reading and writing
    data to the device. The core API involves: 1. Registering the Block Device:


    +   - `register_blkdev(major, name)`: Registers a new block device with the specified
    major number and name.

    +   - `unregister_blkdev(major)`: Unregisters a previously registered block device.


    # 2. Creating a Generic Disk:


    +   - `alloc_disk()`: Allocates a generic disk structure.

    +   - `add_disk(disk)`: Adds the generic disk to the system.

    +   - `del_gendisk(disk)`: Removes the generic disk from the system.


    # 3. Defining Request Handlers:


    +   - `request_fn`: The core function for handling block I/O requests.

    +   - `blk_queue_make_request`: Associates the request handler with the block
    device.'
