    Before diving into potential C++ solutions, it''s essential to understand how
    similar functionality is achieved in C.


    1. **Macros:** Macros are the most common way to achieve generic code in C. However,
    they lack type safety and can be error-prone.


    ```

    C

    #define ARRAY_SIZE(arr) (sizeof(arr) / sizeof(arr[0]))

    ```'
