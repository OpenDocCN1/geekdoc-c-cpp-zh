    \ First-Come-First-Served (FCFS): Processes are executed in the order they arrive.\n\
    \n+   - Shortest Job First (SJF): The process with the shortest estimated burst\
    \ time is executed next.\n+   - Priority Scheduling: Processes are assigned priorities,\
    \ and the highest priority process is executed.\n+   - Round Robin: Each process\
    \ is given a time quantum, and if it doesn't finish within that time, it's preempted\
    \ and added to the end of the ready queue.\n+   - Multilevel Queue Scheduling:\
    \ Processes are divided into multiple queues based on their characteristics, and\
    \ each queue has its own scheduling algorithm.\n+   - Multilevel Feedback Queue\
    \ Scheduling: Processes can move between queues based on their behavior."
