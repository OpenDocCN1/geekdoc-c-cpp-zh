    +   1. **Interrupt Generation:** A device asserts an interrupt signal.

    +   2. **Interrupt Controller:** The interrupt controller translates hardware
    interrupts into software interrupts.

    +   3. **Interrupt Delivery:** The CPU suspends its current task and transfers
    control to an interrupt handler.'
