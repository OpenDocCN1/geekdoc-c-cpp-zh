  \ 联系 Wiley 产品技术支持。\n\n# 第一部分：入门\n\n## 本部分内容\n\n# 第 1 章：介绍 Xcode 4\n### 第 2 章：获取并安装\
  \ Xcode\n# 第 3 章：从模板构建应用程序\n# 第 4 章：导航 Xcode 界面\n# 第 5 章：处理文件、框架和类\n# 第 6 章：使用文档\n\
  ### 第 7 章：开始使用 Interface Builder\n### 第 8 章：使用 Interface Builder 创建更高级的效果\n\n# 第\
  \ 1 章：介绍 Xcode 4\n\n## 本章内容\n- 理解 Mac 开发工具的历史\n- 开发 Xcode\n- 迁移到 Xcode 4\n- 比较 iOS\
  \ 和 OS X 开发\n\nXcode 是 Apple 的免费开发者工具套件；它用于为 iOS 移动设备和 Mac OS X 创建应用程序。图 1.1 所示的\
  \ Xcode 4 是最新版本，是一个带有许多新功能的激进更新。\n\n开发者工具是复杂的，Xcode 一直试图向初级开发者隐藏大部分复杂性。你可以以一种非常简单的“点击即构建”的方式使用\
  \ Xcode，但这种简单性具有误导性。许多开发者从未探索 Xcode 的更高级功能，也从未发现如何利用它们来节省时间、解决问题或通过原创且创新的功能扩展他们的项目。\n\
  \nXcode 还包含了数量意想不到的丰富的辅助应用程序和开发者工具。关于 Xcode 中每个元素的完整指南需要一整架书。本书专注于初级和中级水平的功能，但也为高级开发者提供了提示和指引。\n\
  \n### 图 1.1\nXcode 4 的简化界面隐藏了熟悉的旧功能和一些意料之外的新功能。\n\n![9781118007594-fg0101.tif](img/9781118007594-fg0101_fmt.jpeg)\n\
  \n### 理解 Mac 开发工具的历史\n在 OS X 出现之前，Apple 的 IDE（集成开发环境）是 MPW（Macintosh Programmer's\
  \ Workshop）。如图 1.2 所示，MPW 至今可用，它曾与名为 CodeWarrior 的商业产品竞争。CodeWarrior 和 MPW 都是昂贵的，许多潜在的开发者因此望而却步。\n\
  \n回顾早期 IDE\nCodeWarrior 基于 Metrowks C 编译器和环境。它缓解了从 68k 处理器到 PowerPC 的过渡，并帮助了 PowerPC\
  \ Mac 的成功。作为一种 IDE，CodeWarrior 为 PowerPC 架构提供了完全支持；MPW 花了更长时间。CodeWarrior 的编译速度比\
  \ MPW 快，生成的二进制文件也高效。\n\n### 图 1.2\nMPW IDE 在 Apple 的 FTP 站点可用，旧 Mac 用户下载并使用。\n\n\
  ![9781118007594-fg0102.tif](img/9781118007594-fg0102_fmt.jpeg)\n\n![mac_note.eps](img/mac_note_fmt.jpeg)\n\
  **注意**\n早期版本的 MPW 以其错误信息闻名，包括“我们已经做过这个函数”、“这个数组没有大小，这太糟糕了”以及“别怪我多心，但在这种注释里发现 /*'\
  \ 会让我怀疑”。后来的 Apple IDE 回到了更传统的信息。\n\n### 开发 Xcode\n随着向 OS X 的迁移，Apple 决定保留开发环境。名为\
  \ Project Builder 的 IDE 是作为 NeXTStep 项目开发的。每个 OS X 版本都附带了一个免费的 Project Builder。2003\
  \ 年秋季，发布了一个更新并增强的版本并命名为 Xcode 1.0。\n\nXcode 随着 OS X 的每一个大版本进行更新。Xcode 2.0 随 OS X\
  \ 10.4 “Tiger” 发布。它包含了改进的文档、对 Java 更好的支持以及 Quartz Composer 可视化编程工具（在附录 A 中有详细介绍）。\n\
  \nXcode 3 随 OS 10.5 “Leopard” 发布，并引入了改进的调试工具。Xcode 3.1 增加了对早期 iOS 版本的支持。\n\n\n\n\
  \n\nXcode 3.2 如图 1.3 所示，随 OS X 10.6 “雪豹”一同发布。在此版本发布之前，Apple 为 iOS 和 OS X 开发提供了独立的\
  \ Xcode 构建版本。从 3.2 版本开始，Xcode 变成了一个可以针对两个平台的统一开发环境。这扩大了开发者群体，但也让 Xcode 变得更难下载。Mac\
  \ 版本约为 800MB，而合并版本通常在 3GB 左右。\n\n图 1.3\n\nXcode 3 IDE 虽然效率很高，但受限于明显的 UI 效率低下问题，例如对同时编辑多个文件的支持较差。\n\
  \n![9781118007594-fg0103.tif](img/9781118007594-fg0103_fmt.jpeg)\n\n![mac_caution.eps](img/mac_caution_fmt.jpeg)\
  \ 注意强大的 Java 支持是早期 Xcode 版本的特性，但在最近的发布中这一功能被降低了。Apple 已将 Xcode 转向支持 C 家族开发，包括 C、Objective-C、C++\
  \ 和 Objective-C++。这些现在是 iOS 和 OS X 开发的官方支持语言。\n\n## Xcode 的替代方案\n\nXcode 针对 Objective-C\
  \ 和 Cocoa 项目的可视化开发进行了优化。实践中，这意味着 Cocoa 和 Cocoa Touch 库以及文档被紧密集成到 Xcode 中。Xcode 4\
  \ 已转向改进对 C++ 的支持，但在混合 Objective-C、Objective-C++ 和 C++ 代码方面仍然存在限制；Apple 自己的库和示例源代码是传统\
  \ C 和 Objective-C 的结合。C++ 和 Objective-C++ 并不被广泛使用。\n\n如果你习惯在不同的环境中进行开发，可能会觉得 Xcode\
  \ 的工作方式不符合你的需求。如果你计划使用 Apple 官方 UI 元素创建窗口应用程序，那么在 Xcode 中构建 Objective-C 和 Cocoa\
  \ 代码可能是你最高效的选择。如果你倾向于创建带有命令行或 X11 特性的 UNIX 应用程序，可能更喜欢替代方案。尽管 OS X 是基于 Darwin/POSIX\
  \ 而不是 Linux，但创建一个可以使用平台特定功能扩展的跨平台应用程序核心是相对的。\n\n你可以在 Terminal 命令行中通过你自己的 make 文件（构建管理和配置文件）来使用\
  \ Xcode。如果你在其他平台上习惯了 GCC 和 GDB，你可以直接从命令行运行它们，绕过 Xcode 的大部分功能。\n\nJava 和 C/C++ 开发者可能更喜欢来自\
  \ [www.eclipse.org](http://www.eclipse.org) 的免费 Eclipse IDE。Eclipse 可以扩展 C/C++ IDE。它不支持\
  \ Cocoa，但支持 Java 和混合开发。\n\n对于多平台支持，Mono 仍然是一个热门选择。Mono 编译 C# 而不是 Objective-C 或 C++，但旨在支持跨平台输出，在\
  \ Windows、OS X、iPhone、Android 和 Linux 平台上运行相似的代码。Mono 还支持 ASP.NET Web 项目。\n\nMonoMac\
  \ 和 MonoTouch 版本包含了对关键 OS X 和 iOS API 的绑定。也有 Android 版本。主 IDE 称为 MonoDevelop，可以在\
  \ [monodevelop.com](http://monodevelop.com) 获取。尽管 Mono 有明显的优势，但 Apple 对这个竞争平台的支持并不稳定可靠。有时，Apple\
  \ 禁止在 App Store 中发布使用 C、Objective-C 和 C++ 以外语言开发的应用程序。但某些 MonoTouch 应用已获得准许销售。对于来自\
  \ C# 和 Windows 背景且不想学习完全新语言的开发者来说，Mono 可能是一个更好的选择。\n\n在 iPhone 上，Flash 开发者可以使用 Adobe\
  \ 的 Packager for iPhone 将 Flash 项目封装为 iPhone 应用程序。Packager 最初包含在 Adobe CS5 的各个版本中，当\
  \ Apple 将 iPhone 限制为原生 Objective-C 和 C++ 代码时，它被撤销了。Apple 随后在 2010 年晚些时候取消了限制，在写作时，Packager\
  \ 作为 Adobe Labs 网站 [labs.adobe.com](http://labs.adobe.com) 的免费测试项目提供。未来的正式版本可能会有自己的\
  \ URL 和产品页面。\n\niPhone 游戏开发者可能还想考虑 Ansca 的 Corona，这是一个适用于 iOS 和 Android 的简化脚本开发环境，可在\
  \ [anscamobile.com/corona](http://anscamobile.com/corona) 获取。Corona 目前每年费用 349 美元，但声称开发速度比使用\
  \ Xcode 和原生 Objective-C 更快。\n\n## 理解 Xcode 4 的关键特性\n\n对于开始使用 Xcode 的开发者，Xcode 4\
  \ 包含了以下功能：\n\n![bl.eps](img/bl_fmt.jpeg) 项目导航器，列出并分组相关的项目文件。\n\n![bl.eps](img/bl_fmt.jpeg)\
  \ 适用于 OS X 和 iOS 项目的文件和项目模板。\n\n![bl.eps](img/bl_fmt.jpeg) 代码编辑器，包括静态代码检查、代码补全以及动态提示和技巧。\n\
  \n![bl.eps](img/bl_fmt.jpeg) 一个名为 Interface Builder 的视觉 UI 设计工具（也称为 IB），它可以创建视觉界面原型，也可以用于管理和预加载其他应用程序对象。\n\
  \n![bl.eps](img/bl_fmt.jpeg) 用于类管理以及 Apple Core Data 数据库框架的进一步集成的编辑器。\n\n![bl.eps](img/bl_fmt.jpeg)\
  \ 支持表达式和条件断点的调试器。\n\n![bl.eps](img/bl_fmt.jpeg) 支持直接访问各种在线代码库的支持。\n\n![bl.eps](img/bl_fmt.jpeg)\
  \ 一个极简但实用的 iPhone 模拟器，可以在 Mac 上运行 iOS 应用程序。\n\n![bl.eps](img/bl_fmt.jpeg) Instruments\
  \ 工具集——可以分析性能、监控内存分配并报告代码运行时的其他关键特性。\n\n![bl.eps](img/bl_fmt.jpeg) 同时支持可视化开发和底层命令行编译。\n\
  \n![bl.eps](img/bl_fmt.jpeg) 一系列强大的辅助应用程序，它们随 Xcode 安装但可以根据需要独立运行。工具包括用于构建可安装 OS\
  \ X 应用程序的封装器、硬件监控和测试、动画设计工具、构建商业 JavaScript 组件的工具等等\n\n![mac_crossref.eps](img/mac_crossref_fmt.jpeg)\
  \ 交叉引用\n\n辅助工具和应用程序列表请参见录 A。\n\nXcode 不支持或包含以下：\n\n![bl.eps](img/bl_fmt.jpeg) 图形、声音、字体、3D\
  \ 对象或其他类型的编辑器：必须使用外部编辑器。\n\n![bl.eps](img/bl_fmt.jpeg) C、C++ 和 Objective-C 以外语言的内置支持：你可以扩展\
  \ Xcode 以支持其他语言，但 Xcode 针对 C 家族开发进行了优化。（不包括 C#。）\n\n![bl.eps](img/bl_fmt.jpeg) 其他操作系统的开发工具：OS\
  \ X 与 BSD UNIX 相似，允许部分代码共享。但 Xcode 不能用于开发 Windows、Android 或 Linux 应用程序，也不能用于 Perl\
  \ 和 PHP 等 Web 语言。\n\n![bl.eps](img/bl_fmt.jpeg) iOS 的无限制开发：iOS 硬件应用程序必须经过签名并链接到限期证书。在实践中，这意味着即使你使用\
  \ Xcode、拥有 iPhone 并且是注册开发者，你的应用程序在限期证书过期后也将停止。\n\n![bl.eps](img/bl_fmt.jpeg) 在非\
  \ Apple 平台上开发：目前，Xcode 需要运行最新版本 OS X 的 Mac。\n\n![mac_note.eps](img/mac_note_fmt.jpeg)\
  \ 注意\n\n经常有关于 Xcode 和微软 Visual Studio 系列开发工具合并或至少建立关系的传闻。允许 Windows 开发者访问 iOS 和\
  \ App Store 具有明显的商业利益，但 Apple 的文化倾向于封闭和专有。正式的联系是可能的，但在写作时看起来非常不可能。\n\n\n\n\nXcode\
  \ 4 标志着一项重大变化，因为它的目标不再是生成代码，而是简化开发者体验。许多开发者任务是重复性的工作，由于历史原因，这些工作已嵌入到开发过程中。开发者工具通常假设了一种溯到半个多世纪前计算机出现最早日期的工作流和心态。\n\
  \nXcode 4 的设计者已经开始重新思考这些假设，添加了可以精简和简化工作流的功能。其中一些功能专门针对 `Cocoa` 和 `Objective-C` 开发，而另一些则是代码管理和调试方面更通用的改进。编译器技术也得到了提高，Xcode\
  \ 4 正在向最新、最快的编译器工具迈进。\n\n![mac_crossref.eps](img/mac_crossref_fmt.jpeg) 交叉引用\n\n\
  有关 Xcode 4 中可用编译技术的详情，请参附录 C。\n\n与 Xcode 3 相比，Xcode 4 完全重新设计了界面并提供了一系列额外功能：\n\n\
  - ![bl.eps](img/bl_fmt.jpeg) 单窗口中的统一界面\n- ![bl.eps](img/bl_fmt.jpeg) 针对所有主代码和数据文件类型的集成编辑器\n\
  - ![bl.eps](img/bl_fmt.jpeg) 集成了 Xcode 可视 UI 设计工具 `Interface Builder`\n- ![bl.eps](img/bl_fmt.jpeg)\
  \ 文件间更简单、更快速导航\n- ![bl.eps](img/bl_fmt.jpeg) 集成版本控制、仓库访问和代码库的代码管理，以简化代码片段的重用\n-\
  \ ![bl.eps](img/bl_fmt.jpeg) 改进了调试和代码测试，提供了更信息丰富的错误消息、静态代码测试、支持多个日志文件，以及更好的 `Code\
  \ Completion`（原 `Code Sense`）提示\n- ![bl.eps](img/bl_fmt.jpeg) 新型代码分析功能，可提供关于基础编码错误的提示\n\
  - ![bl.eps](img/bl_fmt.jpeg) 改进并简化的代码和符号搜索\n- ![bl.eps](img/bl_fmt.jpeg) 简化构建目标和产品的管理\n\
  - ![bl.eps](img/bl_fmt.jpeg) 支持 `Schemes`，对项目的构建方式提供精细控制，并为不同的应用程序支持不同的构建选项（例如：测试、调试、分发打包等）\n\
  - ![bl.eps](img/bl_fmt.jpeg) 支持 `Workspaces`，方便管理和处理多个相关项目\n- ![bl.eps](img/bl_fmt.jpeg)\
  \ 与 `Xcode 3.x` 项目文件的向后兼容\n- ![bl.eps](img/bl_fmt.jpeg) 改进的编译器技术\n- ![bl.eps](img/bl_fmt.jpeg)\
  \ 其他各种节省时间的功能，例如构建前的自动提示保存文件\n\n## 从 Xcode 3 迁移到 Xcode 4 编辑器\n\n编辑器的新功能在第 3 章中有详细描述，但本章为已经熟悉\
  \ `Xcode 3` 的缺乏耐心的开发者提供了一个简单的引导。概要来说，几乎所有熟悉的功能都保留了，并且有一些新成员。但 UI 经过了重新，功能可能位于陌生的位置。\n\
  \n![mac_note.eps](img/mac_note_fmt.jpeg) 注意\n\nXcode 4 与 `Xcode 3` 向后兼容。你可以加载 `Xcode\
  \ 3.x` 项目并再次保存，`Xcode 3` 应该能够打开它们。自然地，你无法在 `Xcode 3` 中打开 `Xcode 4` 项目。\n\n在 `Xcode\
  \ 3` 中，浮动窗口不受控制地泛增，导致难以操作。Xcode 4 将每个功能汇到一个具有多个工作区域和面板的单个窗口中。活动区域可以根据需要显示、隐藏、分割或调整大小。每个\
  \ Xcode 功能，包括 `Interface Builder` (`IB`) 和调试器，都可以出现在此窗口中。当你不使用某些功能时，可以隐藏它们。隐藏和显示功能会产生少量的开销，但比混乱的窗口堆要高效且高产得多。你还可以创建自己的工作空间来保存和恢复完整的窗口布局。\n\
  \n![mac_tip.eps](img/mac_tip_fmt.jpeg) 提示\n\n与 Xcode 3 相比，Xcode 4 在更大的显示器上变得更高效。`Xcode\
  \ 3` 经常浪费屏幕空间；例如，代码窗口的右侧通常是空的。有了 `Xcode 4`，你可以同时在平铺面板中打开控制台/调试器、编辑器、文件列表和 `IB`。有了大显示器，这些面板变得足够大，无需滚动、调整大小或切换即可真正有用。\n\
  \n在窗口顶部，工具栏区域包含一个新的显示项目状态的摘要面板。这提供了进度更新。\n\n## 使用标签页\n\nXcode 4 引入了标签页——方便处理多个项目。标签保存了光标位置，因此可以使用它们在文件的不同部分之间切换。\n\
  \n![978118007594-fg014.tif](img/978118007594-fg014.jpeg)\n\n## 使用多窗口\n\n并不是每个都都单窗口开发感兴趣。幸运的是，你可以在单独窗口中打开多个窗口。一个核心目标是灵活性；你可以按照自己的意愿安排工作空间。如图\
  \ 1.5 所示，你可以通过双击文件来浮动单个文件。\n\n## 选择和导航文件\n\nXcode 3 包含一对文件和符号导航菜单。Xcode 4 扩展了这一理念，显示了一个从项目文件生成层级结构的导航栏，列出了文件和符号。如图\
  \ 1.6 所示，你可以立即选择任何文件。\n\n![978118007594-fg016.tif](img/978118007594-fg016.jpeg)\n\
  \n导航栏极大地加快了访问项目中任何文件的速度，因为它在一个单一的菜单树中呈现所有内容。\n\n在导航栏左侧，一个单独菜单显示与当前选中文件较松的文件和项目。\n\
  \n\n\n\n![9781118007594-fg0107.tif](img/9781118007594-fg0107_fmt.jpeg)\n\n## 使用助手\
  \ (Assistant)\n\nXcode 3 包含一个对偶文件选择器，可以在类头文件与其相应的实现文件之间切换编辑器窗口。Xcode 4 引入了助手（Assistant），它设计用于与新的垂直拆分双面板视图配合工作。当你选择一个文件进行编辑时，助手会对有用的对偶文件做出智能推断并自动显示，如图\
  \ 1.8 所示。默认情况下，这意味着选择头文件会在第二个窗格中显示实现文件，反之亦然。\n\n图 1.8\n\n选择助手选项的按钮位于右上角的分组中，外看起来像一个灯泡。它将编辑器分为两个窗格，并在每次选择文件时自动显示对应的偶文件。\n\
  \n![9781118007594-fg0108.tif](img/9781118007594-fg0108_fmt.jpeg)\n\n通过垂直拆分视图和助手，你不再需要手动在对偶文件之间切换，也不需要使用\
  \ Xcode 3 中提供的效率较低的水平拆分视图。此功能是 Xcode 4 中最实用的节省时间的功能之一。你也可以通过新的右键右键菜单手动选择对偶文件或其他文件，如图\
  \ 1.9 所示。\n\n图 1.9\n\n你可以更改助手的行为，以选择特定类型的对偶文件，这可以包括对象的父类以及其头文件和包含文件（includes）。对于那些可能不知道\
  \ Cocoa 和其他 OS X 头文件在 Xcode 中可用并作为参考的新手来说，这非常有用。\n\n![9781118007594-fg0109.tif](img/9781118007594-fg0109_fmt.jpeg)\n\
  \n# 使用 Interface Builder (界面 Builder)\n\nIB 现在内置在 Xcode 4 中。它与 Xcode 同时启动，你只需选择一个\
  \ nib 文件即可对其进行编辑。Xcode 3 中的 IB 具有与主编辑器同样糟糕的窗口管理。IB 的窗口经常会无故地隐藏在其他窗口后面。\n\n在 Xcode\
  \ 4 中，你可以使用标签、导航栏和其他新的编辑器功能更高效地处理多个文件。链接和符号编辑也得到了大幅简化。你可以直接从 IB 中的控件或对象将链接拖动到代码窗口，如图\
  \ 1.10 所示。Xcode 会在头文件和实现文件中都为你插入适当的代码。它还会自动合成输出（outlet）变量。关于在 outlet、动作（actions）和\
  \ IB 对象之间创建链接的详细示例，请参见第 7 章和第 8 章。\n\n图 1.10\n\n在 Xcode 4 中自动创建 outlet 代码。这是一个非常强大的节省时间的功能。\n\
  \n![9781118007594-fg0110.tif](img/9781118007594-fg0110_fmt.jpeg)\n\n# 探索代码和文件管理\n\
  \nXcode 4 在左侧和右侧包含两个新窗格，可以使用工具栏右上的一对按钮根据需要显示或隐藏。如图 1.11 所示，左侧窗格称为导航窗格（navigation\
  \ pane），包含了 Xcode 3 中“组与文件”（Groups & Files）窗格的简化但熟悉的版本。该窗格还包括符号列表、搜索选项和日志列表。\n\n\
  Xcode 3 中的“获取信息”（Get Info）功能被 Xcode 4 中的信息视图（info view）所取代。如图 1.11 所示，你可以在右侧窗格（称为工具窗格，utilities\
  \ pane）中显示文件名、类型和位置。该窗格汇总了以前出现在各种浮动窗口中的杂杂信息。例如，IB 的检查器（inspector）面板会出现在这里。它还显示构建目标和本地化信息。当你选择一个文件时，此窗格的内容会自动更新。相比\
  \ Xcode 3 的 Get Info 弹出菜单，节省了时间，后者以一种较不便于访问的方式呈现这些信息。\n\n图 1.11\n\nXcode 4 中新的左右窗格显示了辅助信息，并管理编辑时可能不需要的可选功能。\n\
  \n![9781118007594-fg0111.tif](img/9781118007594-fg0111_fmt.jpeg)\n\n图 1.11 也显示了工具窗格。它包含一个新的“库”（Library）子窗格，可以显示文件模板、标准代码片段、包含\
  \ UI 和数据类的标准系统对象，以及项目媒体文件。\n\n库中的代码片段（Code Snippet）功能如图 1.12 所示。在项目之间复用相同的代码通常很有用，而代码片段让这变得简单。要将代码添加到项目中，只需从库中将其拖动并掉到编辑器窗口中。你也可以在拖动之前通过选择它查看每个片段的预览。默认情况下，此窗格包含少量精选片段，但你可以通过添加自己的片段来无限扩展它。更多细节，请参见第\
  \ 9 章。\n\n图 1.12\n\n新的代码片段功能使得复用代码变得简单，并是对 Xcode 3 Code Sense 宏的部分替代。\n\n![9781118007594-fg0112.tif](img/9781118007594-fg0112_fmt.jpeg)\n\
  \n## 探索调试器\n\n如图 1.13 所示，调试器现在出现在编辑器底部的新窗格中。要显示它，选择查看>显示调试器。控制台输出和调试输出都出现在此区域。你可以点击编辑器左侧的槽来设置断点。\n\
  \n图 1.13\n\n调试区域不再出现在独立的窗口中，尽管为了方便起见你可能会这样做。在较小的显示器上，调试区域可能会显得拥挤。\n\n![9781118007594-fg0113.tif](img/9781118007594-fg0113_fmt.jpeg)\n\
  \n## 比较 iOS 和 OS X 开发\n\nXcode 同时支持 OS X 和 iOS 开发，并用于开发两个 App Store 应用，但平台之间存在显著差异。\n\
  \n## OS X 开发\n\n在 Xcode 4 中开发 OS X 是免费的。对于开发、测试或发布没有限制。你可以在自己 Mac 上的调试环境中创建应用程序，并将其封装为可以运行、从网站出售或准备网络分发的应用程序。你还可以为\
  \ App Store 创建 Mac 应用——但这只是开发选项之一，并非义务。图 1.14 显示了一个使用模板作为起点的简单 OSX 。\n\n![mac_note.eps](img/mac_note.jpeg)\n\
  \n注意：Xcode 不包含网络部署功能。但它确实创建了可以交付网络部署工具的二进制文件。\n\n早期版本的 Xcode 支持通用二进制开发，这向下兼容 PowerPC\
  \ 硬件。尽管 OS X 10.6 Snow Leopard 是第一个仅限 Intel 的 OS X 版本，但 Xcode 支持 Mac 开发的通用二进制，并仍可开发\
  \ PowerPC 目标。它继续支持 AltiVec 硬件加速。PowerPC 应用的应用市场很小，但 PowerPC 应用在特殊媒体和科学计算领域仍意义。\n\
  \n## iOS 开发\n\niOS 开发比 OS X 开发更复杂。开发由配置（provisioning）控制，这是一种 Apple 生成的安全控制，内置在 Xcode\
  \ 中并管理对硬件测试和 App Store 分发的访问。\n\niPhone、iPod touch 和 iPad 平台都使用 iOS，但这些平台差异巨大，并且并不总是运行相同版本的\
  \ iOS。即使它们运行相同版本，并不是所有的硬件功能和 UI 选项在设备上都可用。\n\n\n\n\n在极端情况下，需要条件代码来检查 App 运行在什么设备上，以及它支持哪个版本的\
  \ iOS。可能需要根据此选择代码路径，并在运行时进行手动检查。\n\nApple 不太会在未来的 Xcode 版本中简化这一过程。更有可能的是 iOS 设备范围将不断扩大，应用程序需要管理日益增多的屏幕尺寸、硬件功能和操作系统。\n\
  \n图 1.15 所示的 Xcode 模拟器（Xcode Simulator）包含了独立的 iPhone 和 iPad 测试选项，但它仅适用于不使用任何 iOS\
  \ 硬件功能（如 GPS 和加速度计）的应用。除了最简单的商业应用外，所有的应用都应该在真实的硬件上进行测试。\n\n配置（provisioning）和多平台支持的额外要求让\
  \ iOS 开发变得具有挑战性和复杂性。进一步的复杂性在于还需要制作高质量的支持图形和屏幕设计，以在 App Store 中产生最大的购买影响力。\n\n迄为止，Apple\
  \ 的 iOS Beta 测试周期比 OS X 更激进，通常在最新版本发布后几乎就能获得新的 iOS Beta 预览版。Beta 开发需要为每个测试设备都配备一个并行的\
  \ Xcode 版本和 Beta 固件。它可能还需要更新版本的 iTunes 和 OS X。\n\n因此，尽管 iPhone 和 iPad 比 Mac 简单，且应用代码可以非常简单，你仍应该为项目留出额外时间，以支持所有可能的目标、版本和安全选项。\n\
  \nXcode 支持这些额外可能性，但它并没有简化它们。开发和测试一个通用的 iOS 应用——一个可以在 iPhone、iPod 和 iPad 上运行的单一应用——仍然是一个挑战。\n\
  \n### 图 1.15\n\n创建一个非常简单的 iOS 应用，并在模拟器中测试它。模拟器最好被视为一个教育环境而非生产环境。它对于具有简单文本和图形的应用是足够的的，但它并没有完全实现\
  \ iOS 设备中的 GPS、加速度计、陀螺仪或其他硬件选项。\n\n![9781118007594-fg0115.tif](img/9781118007594-fg0115_fmt.jpeg)\n\
  \n### OS X 和 iOS 跨平台开发\n\n理论上，你可以在平台之间迁移项目。在实践中，OS X 上的 Cocoa 和 iOS 上的 Cocoa Touch\
  \ 差异巨大，以至于对非复杂的应用程序进行双平台开发既具有挑战性，是不现实的。\n\n目前，iOS 和 OS X 应用程序拥有不同的市场和部分不同的分发模型。尽管少数应用同时出现在两个平台上——社交网络工具和游戏是最受欢迎的选择——但\
  \ Xcode 在简化多平台项目开发方面作用甚微。\n\n开发工作流几乎完全不同。这两个平台具有以下特征：\n\n![bl.eps](img/bl_fmt.jpeg)\
  \ 独立的用于 UI 设计和数据管理的类集合：OS X 中许多更具创意和复杂的类在 iOS 中要么不存在，要么只被部分实现。\n\n![bl.eps](img/bl_fmt.jpeg)\
  \ 独立的测试和调试环境：iOS 应用程序可以在模拟器中或在硬件设备上运行。OS X 应用程序在调试沙箱中运行。\n\n![bl.eps](img/bl_fmt.jpeg)\
  \ 不同的核心编程模型：iOS 支持具有有限多任务处理的任务切换，并且对设备文件系统的访问有限。OS X 支持更广泛的多任务处理选项，对文件的访问限制较少。\n\
  \n![bl.eps](img/bl_fmt.jpeg) 独立的文档套件：iOS 和 OS X 拥有独立的文档集合和不同的源码示例。\n\n![bl.eps](img/bl_fmt.jpeg)\
  \ 不同的加速图形框架：OS X 实现了完整的 OpenGL，iOS 则实现了更简单的 OpenGL ES 框架。\n\n![bl.eps](img/bl_fmt.jpeg)\
  \ 针对不同的骨架启动应用草图的不同项目模板：iOS 包含一组用于简单 UI 驱动的手机应用的草图。OS X 包含了一组更复杂的模板，支持插件、屏幕保护程序和其他库的开发。\n\
  \n![bl.eps](img/bl_fmt.jpeg) 一部分不同的支持测试工具集：虽然存在有限的重叠，但某些工具对于每个平台仍然是唯一的。\n\nApple\
  \ 的模型-视图-控制器（MVC）设计模式意味着应用程序应该将 UI 设计、UI 管理代码和底层数据集合分开。OS X 包含了控制器类，这使得管理数据和创建与之配合的\
  \ UI 变得更容易。这些类中的大部分在 iOS 中是不存在的。这使得在尝试双平台开发时，有效地使用 MVC 变得困难。\n\n如果你计划进行跨平台开发，尝试将底层数据模型封装在它自己的类集合中。你可能可以在不进行重大更改的情况下重用这些类。将\
  \ UI 和 UI 管理代码放在其他地方。\n\n通常情况下，结合 iOS 和 OS X 仍然可行但很困难。将 `Xcode 4` 视为两个具有共同界面的独立开发环境，比将其视为一个旨在为任何平台生成代码的单一统一环境更现实。\n\
  \n## 总结\n\n本章解释了以前的 Mac 开发工具如何引出 Xcode，列出了 `Xcode 4` 的主要设计目标，并总结了 `Xcode 4` 与 `Xcode\
  \ 3` 之间的主要区别。它详细介绍了一些实际差异，并查看了一些新功能。最后，它探讨了 iOS 和 OS X 开发之间的根本区别，并简要讨论了这些差异如何影响开发工作流。\n\
  \n# 第 2 章：获取和安装 Xcode\n\n## 本章内容\n- 选择适用于 Mac 并注册开发\n- 开始使用 Xcode\n\nXcode 是免费的，并运行在任何\
  \ Intel Mac 上。然而，业余开发者和专业人士有不同的硬件和软件需求。为最大生产力优化的系统可能与用于实验或业余编码的系统大不相同。\n\n## 选择\
  \ Xcode 的 Mac\n\n如果你有一台 Intel Mac，你就可以在上面运行 Xcode。但理解高效流畅的工作环境与缓慢非正式的环境之间的区别是有用的。\n\
  \n## 选择处理器\n\n惊讶的是，处理器对生产力的影响没有其他因素大。更快的处理器可以加快编译时间，但除非你正在处理成百上千个源文件的工业项目，否则你会发现在高速多核\
  \ Mac Pro 上运行 Xcode 没有明显的益处。\n\nXcode 增量编译，这意味着编辑后只有更新的文件及其依赖项会被重新编译。与 `Xcode 3`\
  \ 相比，`Xcode 4` 改进的编译器进一步缩短了编译时间。iPhone 项目编译速度较快，即使在图 2.1 所示的 Mac mini 上也是如此。\n\n\
  然而，Xcode 其他功能在更快的 Mac 上会明显更快。Xcode 4 在你编辑时后台执行更多工作。它会在你输入时检查代码错误，并还可以显示实时帮助。你的 Mac\
  \ 越快，特别是磁盘系统越快，这些功能的运行速度就越快。在缓慢的 Mac 上检查一个文件的错误可能需要几秒钟，因此在更快的 Mac 上工作有明显的优势。\n\n\
  ### 2.1\n\n你不需要最新、最快、最大的 Mac 来使用 Xcode。你可以在 MacBook 或 Mac mini 上创建专业的 iPhone 应用。\n\
  \n![9781118007594-fg0201.tif](img/9781118007594-fg0201_fmt.jpeg)\n\n## 选择内存\n\n\n\
  \nXcode 4 内存的使用比 Xcode 3 更高效。即使在进行较大的构建任务时，对于一台专门用于开发的 Mac 来说，2GB 内存不太可能让你感到限制。如果你既创作艺术品又编写代码，你可能会在使用\
  \ Xcode 的同时运行 Adobe Creative Suite（创意套件）中的某些应用程序。在 Bridge 中预览图形、在 Photoshop 和 Illustrator\
  \ 中编辑它们，并将它们导入 Xcode 项目，是一项标准工作流。创意套件和 Xcode 可以在 2GB 内存下协同工作，但为了防止磁盘抖动（disk thrashing）和延迟，4GB\
  \ 是一个更现实的最低配置。\n\n## 选择显示器\n\n显示器（或多台显示器阵列）对整体生产力的影响可能是最大的。你花在重新排列屏幕内容上的时间越少，编写代码的速度就越快。虽然你可以在分辨率为\
  \ 1024x768 的显示器上成功开发项目，但至少 1680x1050 分辨率的显示效率要高得多。在这一分辨率下，你可以一眼看到整个 Xcode 4 工作空间，并按照它的设计初衷使用它。更大的显示器甚至更易于操作，而双显示器系统提供了显著的提速，因为你可以同时处理多个项目或多个文件。\n\
  \n在你掌握了 iOS、Xcode 和 OS X 的要点之后，你将花费大量时间查看各种框架中的类引用，并浏览留言板寻找代码示例和开发者技巧。查看引用的最有效方法是为最有用的类引用创建一组书签，并在网页浏览器的标签页中同时查看。这样你就可以根据需要在它们之间快速切换。\n\
  \n![mac_tip.eps](img/mac_tip_fmt.jpeg) 提示\n\n你可以使用 `Spaces`（调度空间）创建一个用于 Xcode 及其辅助窗口的开发者\
  \ `Space`。像 Mail（邮件）这样的日常应用可以放在不同的 `Space` 中，以减少干扰。\n\n`Exposé`（调度中心）可以是另一个节省时间的工具。当你同时打开多个\
  \ Xcode 窗口时，`Exposé` 是在它们之间切换最简单的方法。你可以在系统偏中设置 `Exposé` 和 `Spaces`。\n\n最豪华且高效的开发环境是至少有两个显示器用于编写代码，并至少有一个额外的显示器用于在线浏览。额外的显示器可能位于另一台机器上，但使用配备三或四台显示器的\
  \ Mac 会更高效；直接从文档或其他在线源复制并粘贴代码到你的项目中通常非常有用。\n\n## 磁盘存储操作\n\n磁盘空间和磁盘特性对 Xcode 性能有很大影响。理想情况下，你应该将\
  \ Xcode 安装在 Mac 的主硬盘上，留出至少 20GB 空间用于完整安装两个独立版本（活动版和测试版），并包含所有文档和你自己的项目代码。\n\n虽然从安装选项中无法立即看出，但\
  \ Xcode 可以安装并运行在外部驱动器。然而，OS X 对外部 USB 驱动器的支持并不稳定，且外部驱动器的速度可能比内部磁盘慢。你应该使用一个名为 `SpindownHD`\
  \ 的工具，它位于名为 `CHUD`（计算机硬件理解开发者工具）的集中，用于控制磁盘的空闲和睡眠模式。`SpindownHD` 并不是完美的解决方案，但你可以用它来延长停止旋转的时间。没有它，Xcode\
  \ 在访问休眠状态的磁盘或 Mac 从休眠后唤醒时有时会崩溃。`CHUD` 和 `Spindown` 随 Xcode 一起安装。你可以在 `<Macintosh\
  \ Hard Disk>/Developer/Applications/CHUD/Hardware/Tools` 中找到 `Spindown`。\n\n![mac_caution.eps](img/mac_caution_fmt.jpeg)\
  \ 警告\n\n磁盘停止的问题使得在 `Finder` 窗口中保留文件夹和应用程序快捷方式变得困难，那里对你最有用。例如，如果你将 Xcode 拖到 `Places`（位置）以便快速运行，而安装它的磁盘进入了休眠或睡眠状态，该链接可能会消失。如果你有足够的可用空间，安装在主硬盘可以避免此问题。\n\
  \n\n\n虽然 Xcode 看起来是独立的，但在实践中，你可能会将其与其他软件配合使用。例如，如果你选择在线查看文档，那么你选择的网络浏览器将成为一个显著的限制因素。Safari\
  \ 和 Google Chrome 的表现尚可，但 Firefox 3.x 以内存泄漏和死机而闻名，并且以 100% 的处理器占用率运行 Flash 和 Java\
  \ 插件。这两者都可能让 Xcode 运行得极其缓慢。在极端情况下，编辑代码时会有明显的延迟，甚至无法进行。这在 Firefox 的未来版本中可能会改变，但目前不推荐使用\
  \ Firefox 3.x。有争议的是，Chrome 提供了最好的整体浏览体验。它支持 Flash 和广告拦截，加载页面快速，并且可以处理许多打开标签页——当你可能同时打开许多类代码引用时，这是一个非常有用的功能。\n\
  \nXcode 通常需要最新版本的 OS X。如果你是 Mac 开发者计划的成员，这包含在计划费用中。小版本升级是免费的，但 iPhone 开发者在重大更新发布时可能需要购买。\n\
  \n可以根据需要添加其他工具。除非你外包图形设计，你需要一套编辑套件来创建启动图形、图标、按钮和其他图像，如图 2.2 所示。这是 iOS 项目的硬性需求（因为图形设计极其重要），对于\
  \ OS X 开发来说也是非常有用的额外补充。Adobe 的 Creative Suite 是事实标准，但它很贵。免费或廉价的替代方案包括用于 OS X 的 Gimp\
  \ ([www.gimp.org/macintosh](http://www.gimp.org/macintosh)) 和 Pixelmator ([www.pixelmator.com](http://www.pixelmator.com))。\n\
  \n开发者可以使用少量的辅助应用程序。Xcode 3 支持各种插件，但这些插件不再与 Xcode 4 兼容。Mac App Store 包含了一些已更新的其它应用。例如，Accessorizer\
  \ ([www.kevincallahan.org](http://www.kevincallahan.org)) 添加了模板化的 setter 和 getter\
  \ 代码。随着 Xcode 4 的成熟，App Store 中可能会出现更多应用。\n\n### 图 2.2\n\n虽然 Adobe Photoshop 没有直接集成到\
  \ Xcode 中，但它作为外部图形编辑器工作得良好。\n\n![9781118007594-fg0202.tif](img/9781118007594-fg0202_fmt.jpeg)\n\
  \n![mac_crossref.eps](img/mac_crossref_fmt.jpeg) 交叉引用\n\n有关为各种文件类型选择编辑器和辅助应用的更多信息，请参阅第\
  \ 8 章。\n\n## 注册开发\n\nXcode 3 是免费的。它位于每台 Mac 的 OS X 安装磁盘的“可选安装”文件夹中。你也可以通过免费注册开发者来下载最新版本。\n\
  \nApple 为 Xcode 4 修改了这一政策。你可以从 Mac App Store 购买 4.99 美元的 Xcode 4，而无需注册开发者，如图 2.3\
  \ 所示。这允许你尝试 Xcode 4。它并不允许你创建可以在商店中出售的应用，但目前你可以使用此选项创建可以从你自己的网站出售的 Mac 应用。\n\n你也可以注册成为开发者。这让你获得一份“免费”的\
  \ Xcode 4，并让你能够访问创建可出售应用并将其上传到商店所需的额外功能。\n\n### 图 2.3\n\n你可以从 Mac App Store 购买 Xcode\
  \ 4。\n\n![9781118007594-fg0203.tif](img/9781118007594-fg0203_fmt.jpeg)\n\n### 注册成为开发者\n\
  \n要注册成为开发者，请访问 Apple 开发者首页，目前地址为 [developer.apple.com](http://developer.apple.com)，如图\
  \ 2.4 所示。该页面的设计经常变化，但最近的设计包含了针对各种开发者计划的注册链接选择。\n\n### 图 2.4\n\n在 Apple 开发者门户开始注册流程。此图片显示了页面底部，列出了计划列表。选择链接将带你每个计划的注册页面。\n\
  \n![9781118007594-fg0204.tif](img/9781118007594-fg0204_fmt.jpeg)\n\n## 选择计划\n\n\
  表 2.1 列出了当前的开发者计划。\n\n注册过程非常简单。你必须为免费计划提供电子邮件地址，对于付费计划，必须提供包括地址和联系电话在内的个人详情。如果你还没有\
  \ Apple ID，则需要创建一个。如果你已经有了个人使用的 Apple ID，那么如果你已经注册了公司，创建一个独立的公司 ID 是很有用的；这可以简化税收和会计工作。\n\
  \n![/Table 2.1](img/9781118007594-tb0201.jpg)\n\n### iOS 开发者计划\n\niOS 开发者计划（门户如图\
  \ 2.5 所示）的主要优势是能够访问 App Store 零售计划，以及在真实硬件上测试应用的能力。测试需要在开发者网站的特殊区域生成并安装证书和配置文件——这些文件允许你开发和测试应用，但不允许你自由复制它们。这是一个复杂的过程，将在第\
  \ 11 章中描述。\n\n![mac_caution.eps](img/mac_caution_fmt.jpeg) 注意\n\n请记住，虽然 iOS 程序看起来很便宜，但你至少需要一台\
  \ iPod 来测试应用。将 iPhone 加入收藏可能会使总成本超过 1000 美元。公司注册需要公司证明。如果没有公司，部分收益将被扣留直到税务机关收到文件。\n\
  \n### 图 2.5\n\n公司加入开发者计划可能需要三周。个人注册有时会在 24 小时内处理，但可能需要几周。\n\n![9781118007594-fg0205.tif](img/9781118007594-fg0205_fmt.jpeg)\n\
  \n加入 iOS 开发者计划还可能访问 Apple 的 附加服务，包括 iAD 网络、GameCenter 网络、内购方案和推送通知服务。要使用这些服务，你需要在注册后单独启用它们。你可能还需要授权或签署进一步法律合同。\n\
  \n### Mac 开发者计划\n\n图 2.6 所示的 Mac 开发者计划让开发者访问 App Store，并在 OS X 版本发布之前进行安装和开发。OS\
  \ X 的发展比 iOS 慢，但会定期发布更新。这些更新可能并不完全稳定，因此在独立的开发机器上安装它们是一个好主意——尽管这很贵。由于可以通过网站独立出售 Mac\
  \ 应用而无需使用 App Store，而且任何人都可以以低廉的价格购买并安装 Xcode，注册正式 Mac 开发者的动力并不完全有吸引力。先购买 Xcode\
  \ 4 进行尝试是值得的，等开发出应用程序后再注册正式开发者。\n\n### 图 2.6\n\n为加入 Mac 开发者计划的人提供的工具和开发者资源与 iOS\
  \ 开发者使用的几乎相同，区别在于 Mac 开发者可以获得 OS X 的测试版本。\n\n![9781118007594-fg0206.tif](img/9781118007594-fg0206_fmt.jpeg)\n\
  \n![mac_note.eps](img/mac_note_fmt.jpeg) Note\n\n\n\n\n\n拥有一个同时适用于 OS X 和 iOS 开发的程序将非常有用。遗憾的是，Apple\
  \ 并没有提供这样的程序。在实践中，任何一个程序都能让你访问完整版本的 `Xcode`，其中包含 iOS 和 OS X 开发工具以及支持文档。这些程序的区别在于对各自平台测试版本的访问权限，以及对两个\
  \ App Store 的访问权限。\n\n## 访问开发者资源\n\n开发者资源包括在线参考库、精开发者视频以及开发者论坛。\n\n### 使用在线文档和参考资料\n\
  \niOS 和 OS X 参考库（包括第 6 章中描述的文档）是免费提供的，不需要注册。URL 会经常更改，但目前你可以在 `http://developer.apple.com/library/ios/navigation/`\
  \ 找到 iOS 库，在 `http://developer.apple.com/library/mac/navigation/` 找到 OS X 库。如果这些\
  \ URL 不再行之有效，请搜索“OS X Reference Library”和“iOS Reference Library”。\n\n### 查看开发者视频\n\
  \n开发者视频（如图 2.7 所示的示例）包括主题演讲和背景介绍，通常取自 Apple 的 `WWDC`（全球开发者大会）系列。过去，Apple 曾收取 500\
  \ 美元的视频访问费用。现在，任何注册了付费计划的人都可以通过 `iTunes` 获取这些视频。每年 `WWDC` 的主题演讲保持免费，且任何人都可以下载。\n\
  \n一些开发者发现，视频中的实操示例比文档中略显混乱的解释能更成功地介绍关键技术和至关重要的开发技巧。\n\nMac 和 iOS 开发者计划允许访问不同的视频合集。只有\
  \ Mac 开发者有权访问 Mac 开发基金视频。同样，只有 iOS 开发者被允许下载 iOS 开发视频。\n\n![mac_caution.eps](img/mac_caution_fmt.jpeg)\
  \ 注意\n\n视频大小可达 400MB，整个视频集大约有 10GB。你可以在线观看，但如果你使用的是低速或中等速度的宽带，下载它们可能是你的最佳选择。从 `iTunes`\
  \ 10.1 版本开始，不支持批量下载。你可以标记任意数量的视频进行下载，但 `iTunes` 在完成两次下载后会取消标记。剩余的视频必须手动重新选择。\n\n\
  图 2.7\n\n如果你从 `iTunes` 下载开发者视频，可以将其它们备份到其他位置并在其他播放器中播放，这些播放器可能在其他机器上。\n\n![9781118007594-fg0207.tif](img/9781118007594-fg0207_fmt.jpeg)\n\
  \n### 使用 Apple 开发者讨论论坛\n\nApple 开发者论坛可能是最有用的开发者资源。替代性的开发者论坛（如 `stackoverflow` (`www.stackoverflow.com`)）已经建立了更庞大的问答集，讨论也更深入。它们还被\
  \ Google 索引，简化了主题和关键词的搜索。\n\n官方开发者论坛的主要优势是 Apple 员工有时会阅读并评论。否则，你通常可以从其他地方获得更详细、更有帮助的评论，来自那些可能已经解决过问题并发布了完整解决方案代码的开发者。\n\
  \n## 寻求技术支持\n\niOS 和 OS X 开发者计划每年为开发者提供最多两次代码级支持服务。你可以利用这些机会与 Apple 技术支持工程师讨论你的代码。工程师们无法立即理解一个庞大的项目，因此技术支持服务最好用于那些神秘但局部的、难以通过常规调试解决且超出其他开发者洞察的问题。\n\
  \niOS 和 OS X 的许多内部功能并没有文档，且代码并不总是按照你预期的方式工作。例如，UI 代码可能会在管理过渡时创建额外的辅助视图，或者 UI 对象可能具有无法从外部访问的复杂功能。Apple\
  \ 工程师比外部开发者更容易了解这些特性。但 Apple 不保证工程师会解决问题，只保证他们会查看。认为该服务很有用的开发者可以花 99 美元额外购买两次，或花\
  \ 249 美元购买五次。\n\n![mac_caution.eps](img/mac_caution_fmt.jpeg) 注意\n\n仅支持 iOS 和 OS\
  \ X 的公开非测试版本。你将无法就测试版本中的错误或功能提问。\n\n## 开始 Xcode\n\n当你加入一个计划时，你将被允许访问如图 2.8 所示的页面。设计可能不同，但该页面包含最新\
  \ `SDK`（软件开发包）的下载链接。\n\n`Xcode` 封装为标准的 Mac `.dmg` 文件，通常在 2GB 到 3GB 之间。每次更新时你都必须下载完整的\
  \ `SDK`；没有增量安装或升级选项。\n\n一个完整的升级周期可能需要额外的下载。新版本的 `iTunes` 通常在 `Xcode` 更新的同时发布。OS\
  \ X 也可能经历增量更新。\n\niOS 开发者需要更新他们所有设备中的固件——至少是所有需要运行当前版本 iOS 的设备。文档可能需要单独下载。\n\n![mac_tip.eps](img/mac_tip_fmt.jpeg)\
  \ 提示\n\n如果你有一个备用的旧设备，在上面保留一个旧版本的 iOS 并用于兼容性测试会很有用。相反，如果你只有一个像 `iPhone` 这样的设备，你可能不愿意将其升级到测试固件进行测试。旧\
  \ App 通常可以在较新的固件上运行。然而，为新测试固件开发的 App 无法在运行旧版本 iOS 的设备上运行。\n\nMac 开发者的体验更为直接。OS X\
  \ 的更新频率较低，且通常不需要额外的下载。单个 OS X 测试版每月发布一次，但下载量比完整测试版小得多。版本之间的差异（例如 OS X 10.7.1 和 10.7.2）通常很小，以你可以在不保持最新的情况下开发。\n\
  \n图 2.8\n\n在此示例中，下载链接出现在左下角。\n\n![9781118007594-fg0208.tif](img/9781118007594-fg0208_fmt.jpeg)\n\
  \n![mac_caution.eps](img/mac_caution_fmt.jpeg) 注意\n\n如果你受限于拨号上网，`Xcode` 对你可能不是实行的解决方案。最好的办法是找一个有快速宽带的人下载更新并刻录到\
  \ DVD 或拷贝到优盘。遗憾的是，`Xcode` 文档与 `SDK` 深度集成，因此这只是部分解决方案。\n\n### 安装 Xcode\n\n下载后，双击\
  \ `.dmg` 文件以常规方式挂载。打开的挂载镜像如图 2.9 所示。双击 `.mpkg` 文件启动安装。如果包含了 PDF 文件，它列出了最新的发布说明。\n\
  \n图 2.9\n\n`Xcode` `dmg` 包完全符合常规。你可以挂载它并按常规运行安装程序。\n\n![9781118007594-fg0209.eps](img/9781118007594-fg0209_fmt.jpeg)\n\
  \n图 2.10\n\n安装程序似乎没有给你提供目标选择。如果你想安装到不同的驱动器怎么办？\n\n![9781118007594-fg0210.eps](img/9781118007594-fg0210_fmt.jpeg)\n\
  \n\n\n\n\n## 安装\n\n如果你点击“继续”，然后点击“位置”选项卡下的文件夹，你可以选择“其他”作为安装位置。这将打开一个下拉对话框，允许你选择\
  \ Mac 上任何位置的驱动器和文件夹，如图 2.11 所示。如果你需要，你也可以创建一个新文件夹。按照传统做法，Xcode 安装在名为 `/Developer`\
  \ 的根目录级文件夹中。\n\n图 2.11\n\n一个隐藏选项允许你选择“其他”，然后选择或创建你自己的目标文件夹。\n\n![9781118007594-fg0211.eps](img/9781118007594-fg0211_fmt.jpeg)\n\
  \n安装到不同的文件夹或磁盘会导致拆分安装。大约 900MB 的核心功能（包括某些系统工具）始终安装在主系统磁盘的 `/Developer` 目录。Xcode\
  \ 的其余部分可以安装在你指定的任何文件夹中。\n\n通常，你会在主安装对话框中看到一个可选功能列表。UNIX 开发工具对于那些想要在 Terminal 中通过命令行访问独立编译器工具集的开发者来说是有用的。如果你对\
  \ UNIX 开发不感兴趣，可以留空此选项不安装。\n\n过去，文档是随 Xcode 一起下载并安装的。现在它在你运行 Xcode 后会单独下载。你可以忽略内部文档并仅使用\
  \ Apple 的网络文档，但如果可能，使用两者都有充分理由。关于安装和使用文档的更多细节，请参阅第 6 章。\n\n根据 iOS 或 OS X 的当前版本，你可能会在此处列出多个\
  \ SDK。在 Xcode 中，SDK 是代码库的集合，用于为特定版本的 OS X 或 iOS 构建代码。例如，Xcode 使用两个不同的 iOS SDK 库来为模拟器和硬件设备构建应用。\n\
  \n在 Xcode 4 中，Apple 通常会将给定平台的所有旧版本封装成一个单一的组合 SDK。你不再需要选择安装哪些版本，所有支持的旧版本都将可用。这可能会在未来的更新中发生变化。\n\
  \n![mac_crossref.eps](img/mac_crossref_fmt.jpeg) 交叉引用\n\n关于创建可以在旧版本 iOS 和 OS X 上运行的应用程序的信息，请参阅第\
  \ 10 章。\n\n选择目标文件夹后，其余安装过程将是自动的。取决于你的 Mac 及其硬盘的速度，安装 Xcode 可能需要半小时到两小时。你可以让 Mac\
  \ 闲置，也可以继续处理其他事情。如果你必须安装 Xcode、更新 iTunes 并更改一个或多个设备中的固件，整个过程可能需要半天时间。如果你还需要更新 OS\
  \ X，时间会更长。\n\n![mac_caution.eps](img/mac_caution_fmt.jpeg) 注意\n\n在安装新版本之前，请关闭 Xcode\
  \ 和 iTunes。如果 Xcode 或 iTunes 正在运行，安装程序将暂停。\n\n## 创建和组织项目文件夹\n\n安装 Xcode 后，你可以为项目创建支持文件夹。**不要将你的项目保存在\
  \ `/Developer` 文件夹内部**。这至关重要。当你更新 Xcode 时，`/Developer` 中的内容可能会在不通知的情况下被覆盖。由于类似原因，不要在\
  \ `/Developer` 中安装额外的辅助程序。\n\n如果你已将 Xcode 安装在单独的分区，你可以在分区的其他地方保留项目文件夹。项目文件夹的切位置或名称是任意的，但选择一个距离\
  \ `/Developer` 仅需几次点击的位置是有用的。\n\n图 2.12 显示了 Xcode 及相关项目文件夹的一种可能的文件夹工作空间。拥有一个用于快速尝试和实验的草稿文件夹（scratch\
  \ folder）和一个用于商业项目的生产文件夹（production folder）是有用的。你可能还想为 Apple 示例代码、模板示例、下载的代码、共享或协作项目等设置进一步的独立文件夹。尝试保持主生产文件夹专门用于生产代码，包括你自己的应用程序以及你创建的任何衍生框架（frameworks）。这里显示的\
  \ `/Provisioning` 文件夹存储了 iOS 开发中使用的证书和下载的描述文件（provisioning profiles）。将这些内容存储在单独的文件夹是一个良好的习惯，以便更容易找到并避免误放。\n\
  \n![mac_tip.eps](img/mac_tip_fmt.jpeg) 提示\n\n在项目文件夹前加加号 (+)，可以使它们按字母顺序排列，且与工具和支持文件夹的顺序分开。\n\
  \n图 2.12\n\n这里显示了一种可能的 `/Developer` 文件夹布局。`+Projects` 存放测试和实验，`+Store` 存放用于 App\
  \ Store 项目的代码。\n\n![9781118007594-fg0212.eps](img/9781118007594-fg0212_fmt.jpeg)\n\
  \n图 2.13 显示了一种可能的项目文件夹结构。你经常在项目之间复用图形和字体，将它们保持在一个单一共享文件夹中是有帮助的。同样，即使某些项目被遗弃了，将它们放在“坟墓文件夹”（graveyard\
  \ folder）中也是用的，以防你以后需要再次引用。\n\n图 2.13\n\n这是一种可能的项目文件夹布局。在开始编码之前，你可能想花些时间组织你的项目工作空间。你的理想布局可能看起来非常不同，但对你来说运行良好很重要。\n\
  \n![9781118007594-fg0213.eps](img/9781118007594-fg0213_fmt.jpeg)\n\n## 使用多个版本的 Xcode\n\
  \nSDK 会定期更新，你通常需要安装并提供多个版本供使用。例如，你可能同时拥有：\n\n![bl.eps](img/bl_fmt.jpeg) 一个生产版本的\
  \ Xcode\n\n![bl.eps](img/bl_fmt.jpeg) 一个测试版本的 iOS\n\nApple 并不强制你安装测试 SDK，但在最新版本发布后立即提供新应用在商业上是有用的，以便留审核时间。\n\
  \nXcode 是模块化的，与多个版本协作并不困难。核心工具的变化非常缓慢。最大的变化发生在 SDK 文件夹及其头文件中。\n\n在实践中，这意味着可以在不同的文件夹中安装多个版本。使用\
  \ `/Developer` 文件夹存放生产版本。其他文件夹名称是任意的。理论上你应该在安装测试版后重新安装生产版本的 Xcode，但在实践中，安装顺序很少影响。\n\
  \n一个注意事项是，当你双击项目时 Xcode 总是运行最新安装的版本。手动启动生产版本的 Xcode 并选择项目进行编辑通常更容易。Xcode 维护着最近文件列表，因此这通常不是什么困难。\n\
  \n### 卸载 Xcode\n\n理论上，你应该使用 Apple 指定的脚本卸载 Xcode。打开 Terminal，输入以下命令：\n\n```bash\n\
  sudo /Developer/Library/uninstall-devtools --mode=all\n```\n\n这将移除大部分 Xcode 文件和\
  \ `/Developer` 文件夹。如果你将 Xcode 安装在不同的文件夹，可以在相应的 `/Library` 文件夹中找到脚本。\n\n![mac_caution.eps](img/mac_caution_fmt.jpeg)\
  \ 注意\n\n此操作无法撤销，文件不会移动到垃圾箱。一旦 Xcode 被移除，它就消失了，`/Developer` 中的所有内容也会随之消失。\n\n在实践中，你通常可以直接将\
  \ `/Developer/Applications` 文件夹拖到垃圾箱，然后在当前版本的残骸上安装新版本的 Xcode。这种方法并非万无一失；它有时会导致框架重复或位置错乱，但它是偷懒、快速且简单的的。如果你没有自定义过\
  \ `/Developer` 的其他内容，可以将整个文件夹拖到垃圾箱。\n\n总结\n\n\n\n\n\n本章探讨了你在高效使用 Xcode 时应该考虑的硬件选项，并介绍了适用于\
  \ iOS 和 OS X 的各种 Apple 开发者计划。它解释了如何注册成为开发者、如何下载 Xcode，以及如何在标准位置创建默认安装，或在指定的文件夹或磁盘分区创建自定义安装。\n\
  \n它还研究了同时具有生产系统和 Beta 版本的开发系统的多版本安装，并解释了如果你不再需要 Xcode，该如何将其从系统中删除。\n\n# 第 3 章：从模板构建应用程序\n\
  \n## 本章主要内容\n- 使用 OS X 应用程序模板\n- 使用 iOS 应用程序模板\n- 自定义标准模板\n\n在 Xcode 中手动组装应用程序的各个组件并不是一个简单的过程。从现成的模板开始并根据需要进行扩展会更快、更方便。\n\
  \nXcode 包含了适用于不同类型 iOS 和 OS X 应用程序的模板，包括为 OS X 开发者提供的插件和其他特殊项目。从模板开始是很容易的。所有模板都包含一个核心代码的精简骨架，并保证能够成功编译和运行。\n\
  \n通过向 Xcode 集合中添加你自己的模板，你可以提高开发效率。标准模板非常简单且局限。某些模板包含了你可能不需要的功能，而大多数则遗漏了可以简化开发的有用功能。\n\
  \n你可以使用模板系统创建包含任意数量代码的复杂骨架应用。例如，你可以为 iOS 创建一个游戏模板，其中包含一个用于图形管理、碰撞检测和用户输入的自定义框架。该模板可以作为一系列游戏项目的起点重复使用。\n\
  \n### 从模板开始\n\n你有两种方式访问 Xcode 的模板界面。图 3.1 显示了 Xcode 的启动窗口。默认情况下，此窗口会在启动 Xcode 时出现。要显示模板，请从左侧列表中选择\
