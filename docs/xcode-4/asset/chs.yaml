  \ Hummel\n\n序言\n\n\n\n\n\n在使用 `Xcode 3` 几年后，我对 `Xcode 4` 的第一印象是复杂的。起初，我认为这种重新设计是不必要地刻僵化且具有限制性的。我怀念\
  \ `Interface Builder` 的悬浮窗口和对象调板，并且无法为编辑器中强制的三分窗格布局找到一个令人信服的理由。\n\n随着时间的推移，我意识到我的第一印象是错误的。面向开发者的软件工具和面向用户的软件工具一样，应该努力让生活变得更容易。在\
  \ `Xcode 3` 底层运行的古老 `GCC` 编译器工具链开发于命令行是唯一可用 UI 的时代。尽管一些开发者仍然热爱命令行，但它是一个不容错的环境，会惩罚简单的错误。它可以非常强大，但它非常死板，而且完全不透明。\n\
  \n许多开发环境（包括 `Xcode 3`）都采取了这种方法，但将其应用于视觉环境中。一个好工具的标准在于它能够预判你的需求，以至于它本身消失了，为你的想象力留下一清晰的画布。\n\
  \n`Xcode 4` 的设计者在这一点迈出了一步，他们思考如何简化或消除过去必要的某些繁琐且重复的工作。`Xcode 4` 并没有完全实现这一目标——一些很有前景的早期想法在最终发布中被删除——但许多功能比\
  \ `Xcode 3` 中的对应功能更简单、响应更迅速。因此，开发过程变得更快、更简单、更高效。\n\n本书的首要目标是向习惯于旧工作方式的用户介绍新功能，并让新用户熟悉\
  \ `Xcode` 的核心功能。新手应该从书的开头开始并按顺序阅读。前几个章节的顺序设计旨在作为 `Xcode` 开发的一本实用的入门指南，而不仅仅是功能和变化的列表。\n\
  \n第二个目标是更详细地介绍一些更复杂的功能。许多新手以一种非常简单的“点点点”方式使用 `Xcode`，错过了隐藏在表面之下的力量和灵活性。不明显的功能很容易被跳过，但探索它们可以为测试、调试、项目管理和构建控制开启新的可能性。某些工具（如\
  \ `Instruments`）还有自己的更深层次隐藏级，这需要另一一本像本书一样大的书才能充分探索。\n\n由于空间有限，本书没有对每个功能都挖掘到最深处。但新的\
  \ `Xcode 4` 用户和丰富的 `Xcode 3` 用户应该在这里找到创作灵感，并获得大量的技巧和方法，这些方法可以帮助他们从基础开发的要点迈向管理化测试和构建设计的更深层次可能性。\n\
  \n每位作者都努力让自己的书籍尽可能有用。欢迎在 `xcodedr@zettaboom.com` 提交意见和反馈。\n\n# 致谢\n\n尽管书籍出版已变得数字化，但书籍编写并没有如此。一本书仍然是团队合作的成果。\n\
  \n感谢策划编辑 Aaron Black 在 `Xcode 4` 仅仅是 Apple 眼中一闪微光时建议了这个项目；感谢项目编辑 Martin V. Minner\
  \ 持续的支持和极大的耐心。也诚挚地感谢 `Wiley` 团队的其他成员，他们背后的辛勤工作。\n\nAlexa、Rachel、Hilary、Michael 以及\
  \ Eurotribe（无与伦比）都提供了支持、娱乐和偶尔的建议，其中一些建议非常有帮助。\n\n软件开发已成为一项社区活动，特别感谢网络上无数的博主、实验者、开发者和问题解决者，他们的慷慨和创造力以许多方式实现了许多可能。\n\
  \n最后，一如既往地爱 Team HGA。没有你们，我写不成这本书。\n\n# 引言\n\n本书介绍如何使用 `Xcode 4` 开发工具链开发 iOS 和 Mac\
  \ 项目。如果你有 `Cocoa` 或 `Cocoa Touch` 的经验并且过去用过 `Xcode 3`，或者你使用过其他开发环境并好奇如何高效地使用 `Xcode\
  \ 4`，你会发现这本书很有用。\n\n这不是一本关于语言或框架的书，唯一的松散前提是具备一些 C 家族语言的基础经验。然而，这并不是一本关于理论的书。如果你自己下载并安装\
  \ `Xcode 4`，完成示例并在阅读时进行实验，你将从中获益最多。\n\n如果你是 Apple 开发的新手，你可能还想阅读 `Objective-C`、`iOS`\
  \ 和 `Cocoa Developer Reference`系列书籍。文中提到了一些框架功能，但你不需要熟悉它们就能成功使用本书，尽管你需要熟悉它们，才能开发出可以在\
  \ App Store 销售的 iOS 和 Mac 应用。\n\n`第 1 章` 简要回顾了之前的 Mac 开发工具，并引入了 `Xcode 3` 和 `Xcode\
  \ 4` 之间的一些核心差异。它介绍了 `Xcode` UI 的基本元素，并解释了如何创建 iOS 和 OS X 项目。\n\n`第 2 章` 解释了如何选择\
  \ Mac 进行开发、如何注册付费开发者，以及如何安装和自定义 `Xcode`。这是 `Xcode` 开发中的一个特性，虽然安装过程简单，但它有容易被忽略的隐藏选项。此外，安装单一版本的\
  \ `Xcode` 与在多个平台使用多个版本来开发生产项目（同时实验测试版 OS 代码）之间存在着重要的区别。\n\n`第 3 章` 引入了 `Xcode` 模板。它演示了你如何使用模板开始应用开发，同时也探索了适用于\
  \ iOS 和 OS X 项目的某些更专门的模板，并解释了在哪里找到这些模板以便你对其进行简单修改。\n\n`第 4 章` 更详细地查看了新的编辑器功能，包括在一个面板中收集项目信息的新导航器。本章探索了许多新的导航功能和支持工具，并介绍了增强型编辑器的节省时间的功能。\n\
  \n`第 5 章` 解释了如何组织和管理文件及项目。它检查了项目导航器中的组（Groups），演示了如何从项目中添加和删除文件，并解释了 `Xcode 3` 管理支持框架的工具已移动到\
  \ `Xcode 4` 的构建设置中。\n\n`第 6 章` 是 Xcode 内置 Apple 文档指南。Apple 以特定的方式构建了文档，如果你理解这在实践中的意义，你将进展得更快更轻松。理解和使用文档并在\
  \ Xcode 中搜索是关键技能。即使你已经在其他环境中拥有经验也不要跳过这一章。\n\n`第 7 章` 介绍了 `Interface Builder` 的核心功能，并解释了你如何使用\
  \ `IB` 构建完整的应用程序，因为 `IB` 不仅仅用于界面。它解释了 `File's Owner` 和 `First Responder` 对象的作用，并构建了一个响应点击的简单\
  \ iOS 应用。\n\n`第 8 章` 深入探索 `IB`。它向你展示如何管理媒体和其他资源以及如何控制 OS 兼容性。它解释了如何对项目进行本地化以支持外国语言。\n\
  \n`第 9 章` 仔细观察了 Xcode 中新的节省时间的功能，包括结构管理工具，这些工具可以帮助你将代码段移动到合适的位置、智能管理缩进以及添加或删除注释块。本章还介绍了代码补全，并解释了如何用你最常用的代码块自定义代码片段和代码补全宏。\n\
  \n\n\n\n\n# 第 10 章介绍了 Xcode Organizer，这是一个多功能工具，用于管理辅助文件和其他不属于代码编辑器的项目信息。它引入了设备配置（provisioning）和配置文件（profiles），并解释了如何管理你的测试设备。\n\
  \n# 第 11 章全面详细地介绍了 Xcode 配置过程，这对于 iOS 和 OS X 项目的设备测试、Beta 分发以及 App Store 分发都是必要的。它将带你逐步完成配置过程，并解释配置的原理，以便你理解证书（certificates）、身份（identities）和配置文件的作用以及它们为什么是必须的。\n\
  \n# 第 12 章介绍了 Xcode 构建系统。它介绍了项目和目标构建设置，并解释了它们之间的关系。它还详细查看了构建设置管理，解释了你如何使用构建配置（build\
  \ configurations）和新的方案（schemes）功能为更复杂的项目创建灵活的多多目标构建。\n\n# 第 13 章深入研究构建系统。它介绍了一系列常见且实用的构建自定义功能，带你逐步完成\
  \ iOS App Store、iOS Ad Hoc 和 OS X App Store 构建所需的不同构建过程。它还解释了如何使用 Xcode 将项目提交到 App\
  \ Store。最后，它介绍了构建系统的内部原理，并解释了你如何使用构建阶段（build phases）和构建规则中的自定义脚本来满足几乎任何构建的构建需求。\n\
  \n# 第 14 章探索了新的版本控制功能。它介绍了在 Xcode 中管理项目版本的不同方式，并说明了它们的优缺点。最后以使用 Xcode 与 GitHub 协作在线代码仓库的实用示例结束，并解释了如何将\
  \ GitHub 用于个人和小组项目。\n\n# 第 15 章介绍了 Xcode 调试器。它探索了查看和使用控制台的不同方法，并演示了如何添加、删除和管理断点；查看变量并在它们变化时监控它们。它还引入了用于低级控制的命令行调试。\n\
  \n# 第 16 章探索了 Instruments 并演示了你如何使用它们对代码的任何方面进行分析，包括内存使用、性能以及对周围系统的影响。它包含一个分析示例，演示了如何使用\
  \ Instruments 检查内存泄漏。\n\n# 第 17 章介绍了单元测试（Unit Test）功能，并解释了如何使用它们在代码中创建和检查自动化测试用例，帮助你确保在修改现有代码时，它仍能按预期运行。\n\
  \n# 附录 A 列出了 Xcode 工具链中包含的许多额外工具和程序，包括 Quartz Composer 和 Dashcode 等强大的辅助编辑器。\n\n\
  # 附录 B 介绍了 plist 编辑并探索了新的 Core Data 编辑器。\n\n# 附录 C 解释了旧 GCC 和新 LLVM 编译器技术之间的差异，两者都包含在\
  \ Xcode 中。\n\n代码以`等宽字体显示.`。你输入的项目以粗体显示。\n\n项目和示例是在不同版本的 Xcode 4 上开发的，从第一个开发者版本到最后的\
  \ GM seed 版本，运行于 OS X 10.6.6。目前的图形和功能可能与书中的插图和功能描述略有不同。\n\n支持代码可以在书籍网站 [www.wiley.com/go/xcode4devref](http://www.wiley.com/go/xcode4devref)\
