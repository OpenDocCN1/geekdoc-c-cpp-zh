  \n### 使用 Quartz Composer\n\n### 使用其他编辑器\n\n本附录总结了工具和实用程序。`Dashcode`、`Quartz Composer`\
  \ 和 `Instruments` 随 `Xcode` 捆绑。每个工具的完整用户指南将使这本书的增加一倍，因此本附录总结了每个工具的主要功能。\n\n![mac_tip.eps](img/mac_tip_fmt.jpeg)\
