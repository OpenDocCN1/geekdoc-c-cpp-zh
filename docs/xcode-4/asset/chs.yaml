  \n### 查看设备控制台\n\n图 10.12 显示的 Console 页面是 Console 应用程序的简化版本。它收集并显示通用系统日志。\n\n![mac_caution.eps](img/mac_caution_fmt.jpeg)\
  \ 注意\n\n此控制台不同第 15 章描述的调试控制台。控制台显示单个应用的消息。设备控制台显示所有应用以及 iOS 的消息。\n\n控制台日志通常没有太多感兴趣的内容。大部分与硬件有关，包含了关于\
  \ WiFi、电池、USB 和睡眠事件的信息。如果你正在开发硬件配件，或者正在测试带有`NSLog`调的应用，可能会发现这些细节很有用。但除了好奇之外，对设备日志中未详细涵盖的内容帮助不大。\n\
  \n**图 10.12**\n\n这是 iOS 日文件的副本\n\n![9781118007594-fg1012.tif](img/9781118007594-fg1012_fmt.jpeg)\n\
  \n### 使用设备日志和截图\n\n这些功能与主库窗口中的设备日志和截图相同，仅有本章之前描述的细微区别。\n\n## 处理项目和归档\n\nOrganizer\
  \ 的项目和存档功能包含了 Xcode 中其他地方不可用的项目管理和存档功能。\n\n## 管理项目\n\n图 10.13 显示的 Projects 窗口是最近打开的项目列表，带有许多额外功能，包括快管理和清理。此功能是一个实用的补充，可以节省你的时间和磁盘空间。\n\
  \n**图 10.13**\n\n在 Project 页面中，左侧的列表与 Xcode 菜单中的最近文件列表相似，但更长。\n\n![9781118007594-fg1013.tif](img/9781118007594-fg1013_fmt.jpeg)\n\
  \n例如，在 Xcode 中打开旧项目通常很有用。主最近文件列表包含 20 个项目。Projects 页面上的列表无限增长，因此当你不想在 Finder 中查找旧文件时，它是一个实用的快捷方式。\n\
  \n\n\n\n\n![bl.eps](img/bl_fmt.jpeg) 派生数据（Derived Data）：当你构建项目时，Xcode 会创建一组临时文件，这些文件被称为派生数据，并且会占用大量的磁盘空间。每个项目对应的派生数据字段右侧的灰色箭头可以打开\
  \ Xcode 的临时文件文件夹并高亮该项目。\n\n![mac_tip.eps](img/mac_tip_fmt.jpeg) 提示\n\n你通常不需要查看构建文件夹内部。你确实需要知道在哪里找到构建好的应用程序，但你可以通过点击符号导航器（Symbol\
  \ Navigator）中 Products 组下的文件，并使用 `Show in Finder…` 选项来显示它。\n\n![bl.eps](img/bl_fmt.jpeg)\
  \ 清理派生数据：临时构建文件占用了不必要的空间。当你完成一个项目时，可以使用 `Delete` 选项来删除它们。这不等同于 Xcode 主菜单中的 `Product⇒Clean`\
  \ 选项。`Clean` 会移除与构建相关的文件，而 `Delete` 会移除 Xcode 创建的所有其他支持文件，包括日志和索引。\n\n![bl.eps](img/bl_fmt.jpeg)\
  \ 快照管理：项目快照（如果有）列在主区域的下部。你可以通过主区域左下角的 `Restore Snapshot` 按钮将项目恢复到快照（较旧的状态）。你也可以删除不需要的快照以节省磁盘空间。你在此无法创建快照。\n\
  \n![mac_note.eps](img/mac_note_fmt.jpeg) 注意\n\nXcode 3 在项目文件夹中创建派生数据（包括构建文件）。Xcode\
  \ 4 则在独立的文件夹中创建派生数据。在从磁盘上删除项目之前，请使用 `Organizer` 中的 `Delete` 选项删除这些数据——否则它们永远不会被移除。请注意，你可以点击派生数据路径旁边的箭头在\
  \ Finder 中打开相关文件夹。\n\n![mac_crossref.eps](img/mac_crossref_fmt.jpeg) 交叉引用\n\n关于创建和比较快照的信息，请参见第\
  \ 14 章。\n\n# 创建归档 (Creating Archives)\n\n尽管名称如此，但图 10.14 所示的归档功能与保留源代码旧副本意义上的存档或备份没有关系。在\
  \ Xcode 中，归档是一个经过打包、配置并经过代码签名的应用程序构建，它可以发送给 Beta 测试人员或上传到 App Store。\n\n要创建归档，请使用\
  \ Xcode 主菜单中的 `Product⇒Archive` 选项。创建归档会将应用添加到此页面左侧出现的列表中。你可以根据需要频繁地构建归档。每次构建都会在主区域下半部分的列表中添加一个新条目。\n\
  \n左上角的按钮实现了三个与归档的功能：\n\n![bl.eps](img/bl_fmt.jpeg) 验证（Validate）：这会对归档进行基本检查，以确认其是否适用于\
  \ App Store，并验证内容是否已正确签名。\n\n![bl.eps](img/bl_fmt.jpeg) 共享（Share）：使用此选项创建一个 Ad Hoc\
  \ 构建，该构建可以在线共享或作为电子邮件附件发送。\n\n![bl.eps](img/bl_fmt.jpeg) 提交（Submit）：这会将应用程序上传到 App\
  \ Store。在 App Store 接受上传之前，你需要准备好带有支持性图片和文本的营销描述。\n\n![mac_crossref.eps](img/mac_crossref_fmt.jpeg)\
  \ 交叉引用\n\n关于这些功能的更多信息，请参见第 12 章和第 13 章。\n\n## 图 10.14\n与备份无关的归档页\n![9781118007594-fg1014.tif](img/9781118007594-fg1014_fmt.jpeg)\n\
  \n## 总结\n\n本章介绍了 Organizer（Organizer），并描述了书中其他地方未涵盖的功能。它解释了如何添加和管理测试硬件设备，以及如何从活动设备接收调试和支持信息。它概述了实现自动设备配置的关键功能，并解释了如何在\
  \ Mac 之间拷贝证书和配置文件。它还详细探讨了设备日志等复杂功能。\n\n最后，它介绍了项目页和归档页，探索了如何管理项目及其关联的支持文件和快照，并解释了如何使用归档功能对部署和测试的应用程序进行验证和共享。\n\
  \n# 第 11 章：证书与配置\n\n## 理解配置（Provisioning）\n- 为 iOS 开发创建并安装证书/标识\n- 为 iOS 设备配置\n\
  - 为 OS X 开发配置\n\n开发过程的某些需要对 Apple 服务进行安全访问，因此 Xcode 包含了管理这些服务的内置功能。这种安全管理被称为配置（provisioning）。Xcode\
  \ 4 简化了配置过程，但它仍然是一个复杂的过程。创建允许 App Store 开发的初始文件、证书、设置和权限可能需要几小时到一天的时间。一旦运行正常，你可以至少忘记三个月的配置，因为系统不需要进一步关注。在那之后，某些权限必须定期更新。但更新过程比初始设置要简单且快捷得多。\n\
  \n## 理解配置\n\n配置是一组允许你执行三件事的权限。当配置工作正常时，你可以执行以下操作：\n\n- 在 iOS 硬件上测试应用：这需要每个测试设备对应\
  \ `Developer Certificate`（开发者证书）和一个 `Development Provisioning Profile`（开发配置文件）。\n\
  - 将应用上传到 App Store：这需要 `Distribution Certificate`（发布证书）和 `Distribution Provisioning\
  \ Profile`（发布配置文件）。\n- 通过电子邮件或网站下载将应用分发给 Beta 测试人员：这同时需要 `Distribution Certificate`\
  \ 和 `Ad Hoc Provisioning Profile`（Ad Hoc 配置文件）。\n\n如果配置未正确安装或权限过期，可能会发生以下情况：\n\n\
  - Xcode 无法构建应用。\n- Xcode 不允许你在设备上安装应用。\n- 如果应用已安装，它将无法运行。\n- 权限过期后，现有的测试应用停止工作。\n\
  - 测试人员的 iOS 设备无法运行你的测试版本。\n\n每个配置文件和证书都是一个文件。概述上，配置包含两个部分：\n\n- 开发者详情：这些文件被称为证书或标识。它们与你\
  \ Mac `keychain` 中的标识匹配，允许 Xcode 确认你所声称的身份，并且你拥有在设备上测试应用或将其上传到 App Store 的权限。\n\
  - 设备详情：这些文件被称为配置文件。它们允许设备运行特定开发者的测试应用。\n\n证书和配置文件都是嵌入数字密钥的文件。如果这些文件以标准方式创建和安装，配置过程将简单得多。遗憾的是，事实并非如此。证书安装在\
  \ `login keychain` 中。配置文件在 Xcode 中管理。两者都在 `Provisioning Portal` 上创建，但需要不同且无关的用户输入。\n\
  \n你可以通过两种方式处理配置过程：\n\n- 手动：Apple 开发者网站包含一个名为 `iOS Provisioning Portal` 的配置管理区域，如图\
  \ 11.1 所示。创建配置文件需要向门户上传信息（例如唯一用户密钥和各种设备标识码）。门户生成所需的文件。然后你可以从门户下载它们并根据需要安装到 Xcode\
  \ 或 `keychain` 中。\n- 自动：设备配置在 Xcode 4 中已自动化。个人设置仍然是手动的，但管理测试设备的部分已经简化。它可以像点一下一样简单。\n\
  \n\n\n\n本章将详细介绍手动配置（manual provisioning），以便你完成初始设置过程，并理解相关的要求和选项。自动化配置将在章节末尾处介绍。\n\
  \n你可以在无需配置的情况下为 iOS 模拟器和 OS X 开发应用。你也可以（目前）独立于 App Store 销售 OS X 应用。但如果你不设置配置，你将无法在自己的\
  \ iOS 硬件设备上测试 App。\n\n请注意，即使有了配置，权限也是有限制的。权限过期后，为硬件测试构建的 App 将停止工作。只有通过有效的开发者订阅，你才能续期这些权限。这意味着，除非你是注册开发者，否则你创建的任何\
  \ App 在一段时间后都会停止工作。要无限期使用自己的 App，你必须将它们上传到 App Store 并通过审核，给自己发放免费礼品券，然后用礼券“购买”该\
  \ App。\n\n![mac_crossref.eps](img/mac_crossref_fmt.jpeg) 交叉引用\n\n本章解释了如何生成、下载和安装配置过程中使用的文件。在使用这些文件分发项目之前，你需要对项目的构建设置进行一些更改，该过程将在第\
  \ 12 章中详细描述。在完成该章节之前，不要尝试将你的项目提交到 App Store。\n\n### 图 11.1\niOS 配置门户概览\n\n![9781118007594-fg1101.tif](img/9781118007594-fg1101_fmt.jpeg)\n\
  \n### 介绍配置要求\n\n在开始配置之前，你需要三项物品：\n\n![bl.eps](img/bl_fmt.jpeg) 数字身份：这是一个在你的 Mac\
  \ 上生成并上传到配置门户的数字密钥文件。\n\n![bl.eps](img/bl_fmt.jpeg) 一个或多个设备唯一标识符 (UDID)：这些是唯一定义\
  \ iOS 设备的十六进制代码。你可以从 beta 测试人员处获取它们（正如本章后文所述，他们可以在 iTunes 中读取这些）。Xcode 也可以显示你本地测试设备的\
  \ `UDID`。\n\n![bl.eps](img/bl_fmt.jpeg) 应用 ID：`App ID` 是一个任意字符串。你可以在多个应用中使用相同的字符串，并可以使用通用的星号作为通配符。然而，Apple\
  \ 服务（如推送通知和应用内购买）要求应用具有唯一的 ID。\n\n### 避免配置方面的混淆\n\n混淆的一个来源是 Apple 不精确的术语。你会看到证书被称为身份（identities），目前并不清楚它们之间以及与配置文件（provisioning\
  \ profiles）之间有什么区别。\n\n为了简单起见，将证书和身份视为可以交换即可。技术上存在细微差异，但在实践中你可以忽略它们。它们都与你的个人身份相关。\n\
  \n#### 配置文件管理设备和应用身份\n\n核心原理是代码签名。当你构建项目时，Xcode 会包含一个数字签名文件。iOS 硬件和 App Store 都会检查该签名有效。\n\
  \n你可能认为这意味着 Xcode 将公钥附加到你的构建中，但该过程要复杂得多，涉及到你的密钥、Apple 主密钥、软件权限、硬件访问权限以及特定应用的权限的交互，这些包含在不同的文件中。\n\
  \n你首先生成一个包含公钥和私钥元素的数字密钥。使用公钥创建开发和发布证书，这些证书包含了你的密钥并增加了另一层权限。然后，你将开发和发布证书安装到你的 `keychain`\
  \ 中。这也会将其安装到 Xcode 中。\n\nXcode 使用这两个生成的证书作为签名身份。这是因为团队开发可以支持多个用于测试的独立身份（每个开发者一个），但分发时仅支持单一身份。\n\
  \n团队管理为代码签名增加了额外的复杂性。Apple 的团队管理功能允许首席开发者控制哪些团队成员允许在硬件上进行测试。他们还将分发权限限制为团队负责人（也称为团队代理/agent）。\n\
  \n如果你是独立开发者，团队管理功能是无关的，因为你既是负责人、代理，又是贡献开发者。遗憾的是，没有办法绕过这些额外功能。因此，对于独立开发者来说，配置过程包含了无法忽略的巨大额外开销。\n\
  \n要下载开发和发布配置文件，你需要上传你的唯一数字密钥作为证书签名请求 (`CSR`) 的一部分。然后配置门户会要求经理（或你）接受或拒绝请求。\n\n如果请求被接受，门户将生成请求的证书，你可以下载并安装它。如果请求被拒绝，则什么都不会发生。\n\
  \n默认情况下，调试构建已配置好包含开发配置文件。发布构建则不包含，在将 App 上传 App Store 之前，你必须修改 Xcode 构建设置以包含你的发布配置文件。\n\
  \n![mac_caution.eps](img/mac_caution_fmt.jpeg) 注意\n\n这两个配置文件是互斥的。你可以使用其中一个对构建进行签名，但不能同时使用。这意味着你不能在自己的硬件设备或模拟器上运行最终的分发构建。Xcode\
  \ 的设置故意让这种操作变得不可能。这意味着对于 App Store 应用的加载没有最终的预检测试。你必须调试并测试你的 App，创建一个 App Store\
  \ 构建版本，并希望它能运行——因为你无法通过运行它来确保万无。\n\n另一个混淆来源是额外的证书，被称为 `WWDR`（全球开发者关系）中间证书证书。你必须下载并安装此证书，以确保你的开发证书和发布证书是有效的。这不是一个困难的步骤，但它又增加了一个可能的错误来源。\n\
  \n证书只是过程的一部分。你还必须创建配置文件来管理设备和应用权限。开发配置文件启用硬件测试。当 Xcode 拥有有效的开发证书和有效的设备配置文件时，你就可以在设备上运行和调试代码。\n\
  \n发布配置文件用于控制分发渠道的访问。App Store 发布配置文件允许你将应用上传到商店。\n\nAd Hoc 发布配置文件允许跳过 App Store\
  \ 进行 beta 分发，允许测试人员将你的 beta 构建加载到他们的设备中。\n\n所有的配置文件都锁定到特定的设备。你在创建配置文件时指定了支持的设备。如果设备没有与构建中嵌入细节匹配的配置文件，应用无法运行。\n\
  \n配置文件也锁定到特定的应用（通过 `App ID`）。你指定一个唯一的应用名称——这是访问 Apple 服务的强制要求。如果你不需要这些特殊服务，可以使用包含通配符字符的通用应用名称来定义一个系列应用。\n\
  \n### 创建和安装用户证书\n\n处理配置过程的最简单方法是将其分解为若干步骤。现在先忽略设备。从创建你的开发和发布证书开始，按照以下顺序操作：\n\n1.\
  \ 在你的 Mac 上创建一个 CSR。\n\n\n\n2. 将 `CSR` 上传到配置门户网站（Provisioning Portal）以请求开发证书。\n\
  3. 批准请求。下载开发证书。\n4. 下载 `WWDR` 证书，该证书随开发证书自动生成。\n5. 再次将 `CSR` 上传到配置门户网站以请求发布证书。\n\
  6. 批准请求。下载发布证书。\n7. 将所有三个证书添加到您的钥匙串（keychain）中。\n\n此步骤会自动在 `Xcode` 中安装证书。\n\n图 11.2\
  \ 以图形式总结了这些步骤。\n\n图 11.2\n\n如何生成并安装开发及发布描述\n\n![9781118007594-fg1102.eps](img/9781118007594-fg1102_fmt.jpeg)\n\
  \n## 创建 CSR\n\n`CSR` 是一个数字密钥（一组数字），用于将你标识为唯一的个人。从技术上讲，它使用公钥和私钥的组合来安全地识别。公钥包含在 iOS\
  \ 配置文件（Provisioning Profile）生成的证书中。私钥存储在您的 Mac 钥匙串中。`Xcode` 结合这两个密钥来确认您的身份。\n\n\
  ![mac_caution.eps](img/mac_caution_fmt.jpeg) 注意\n\n该系统并不像看起来那样安全。如果您的 Mac 被盗，且您的主系统密码容易破解，那么存储的密钥和网页密码可能包含足够的信息，让熟练的第三方在网上冒充您的身份。虽然密钥系统旨在防止\
  \ App 盗版，但从应用程序中剥离密钥并将其非法分发给对 iOS 设备进行了越狱（即绕过了安全限制）的用户相对容易。相比之下，将密钥系统视为 `Xcode`\
  \ 的访问工具比视为反盗版或反身份盗窃措施更为符合现实。\n\n要创建 `CSR`，请使用 Mac 的“钥匙串访问”（Keychain Access）应用程序。您可以在\
  \ `/Application/Utilities` 中找到它。选择`钥匙串访问`⇒`证书助理`⇒`向证书机构请求证书`。\n\n输入您注册开发者时使用的用户名和电子邮件地址。留空\
  \ `CA`（证书机构）电子邮件字段。选择标记为“保存到磁盘”（Saved to disk）和“让我指定密钥对信息”（Let me specify key pair\
  \ information）的选项，如图 11.3 所示。\n\n图 11.3\n\n要创建 `CSR`，输入您的姓名和电子邮件地址并选择 `CSR` 。\n\n\
  ![9781118007594-fg1103.eps](img/9781118007594-fg1103_fmt.jpeg)\n\n![mac_tip.eps](img/mac_tip_fmt.jpeg)\
  \ 提示\n\n在开始之前，为配置过程中使用的文件创建一个文件夹或子文件夹，以便您知道它们在哪里。`CSR` 文件的默认保存位置是桌面，这可能并不理想。\n\n\
  ![mac_caution.eps](img/mac_caution_fmt.jpeg) 注意\n\n您必须保留在此处输入的详细记录；如果您移动到另一台 Mac，这些信息至关重要。\n\
  \n在下一页中选择文件名和保存路径，以便文件保存到您新的 `Provisioning`（配置）文件夹中。将`密钥大小`（Key Size）设置为 2048 位，并将`算法`（Algorithm）设置为\
  \ `RSA`，如图 11.4 所示。当`钥匙串访问`创建证书时，它会提供在 `Finder` 中查看其位置的选项。默认情况下，文件名为 `CertificateSigningRequest.certSigningRequest`。您需要知道此文件的位置以便进行流程的后续部分，即将\
  \ `CSR` 上传到 iOS 配置文件。\n\n图 11.4\n\n要创建 `CSR`，设置`密钥大小`和`算法`。\n\n![9781118007594-fg1104.eps](img/9781118007594-fg1104_fmt.jpeg)\n\
  \n## 将 CSR 上传到配置门户\n\n现在您有了一个标识您的公钥文件，必须将其上传到配置门户。当您使用门户网站生成证书时，密钥会被嵌入其中，`Xcode`\
  \ 使用它来确认您的构建、测试和发布权限。\n\n![mac_note.eps](img/mac_note_fmt.jpeg) 注意\n\n上一步创建的 `CSR`\
  \ 文件仅用于上传。虽然文件中的密钥被 `Xcode` 引用，但文件本身不是。当您需要从头重新配置时（证书有效期为一年），保留该文件的副本会有用，这样您就可以跳过初始密钥生成步骤。\n\
  \n要将 `CSR` 文件转换为开发或发布证书，请遵循以下步骤：\n\n1. 在门户网站上，选择`证书`（Certificates），然后选择开发（Development）或发布（Distribution）。\n\
  2. 点击`请求证书`Request Certificate）按钮。\n3. 上传您的 `CSR` 文件。\n4. 批准请求。\n\n忽略自动生成的电子邮件。\n\
  5. 下载证书。\n\n您必须对两个证书（开发和发布）重复此序列。作为一个独立步骤，您还必须下载 `WWDR` 证书。\n6. 登录您的 iOS 开发者账户并打开\
  \ iOS 配置文件。从左侧列选择`证书`，并在标签页中选择`开发`。点击页面右侧的`请求证书`按钮。\n\n 第一次执行此操作时，页面应类似于图 11.5 所示。\n\
  \n图 11.5\n\n准备上传 CSR 并生成开发证书\n\n![9781118007594-fg1105.tif](img/9781118007594-fg1105_fmt.jpeg)\n\
  \n![mac_caution.eps](img/mac_caution_fmt.jpeg) 注意\n\n此页面仅在您没有有效开发证书时可见。如果您已经有一个证书，则无法请求另一个。\n\
  7. 选择左下角的`选择文件`Choose File 按钮，导航到第 6 步创建的 `CSR` 文件。点击`提交`确认文件上传。\n\n门户网站会自动生成一封邮件通知您\
  \ `CSR`。如果您是独立开发者，请忽略该邮件；您已处于门户网站中批准 `CSR` 的正确部分。\n\n页面现在看起来应该像图 11.6 所示。页面底部的`团队签名请求`（Team\
  \ Signing Requests）区域列出了您的 `CSR`，页面底部的两个按钮允许您批准或拒绝。\n\n8. 在`签名请求`标签页下选择选框，然后点击`批准已中的`。\n\
  \n图 11.6\n\n批准 CSR\n\n![9781118007594-fg1106.eps](img/9781118007594-fg1106_fmt.jpeg)\n\
  \n![mac_caution.eps](img/mac_caution_fmt.jpeg) 注意\n\n传统的门户网站在此处似乎存在问题。此前，门户似乎忽略了请求，尽管您刷新页面后会发现证书已生成。在写作期间，门户要求您选择一个签名请求，尽管您已经选择了一个。在使用门户网站时请记住这一点。\n\
  \n创建并下载开发证书\n\n当您刷新页面时，您会看到一个新证书，有两个新按钮名为`下载`和`撤销`。\n\n`撤销`会取消证书的有效。`下载`将证书复制到您的\
  \ Mac，如图 11.7 所示。文件名为 `developer_identity.cer`。如果您使用的是 Safari，文件将出现在下载文件夹中。\n\n\
  接下来，从开发证书下的链接下载 Apple `WWDR` 证书。可选，您可以将证书从默认下载文件夹移动到配置文件夹。\n\n图 11.7\n\n下载开发证书\n\
  \n![9781118007594-fg1107.eps](img/9781118007594-fg1107_fmt.jpeg)\n\n发布发布\n\n在同一页面上点击`发布`标签页，并重复此过程。点击`请求证书`按钮并上传您的证书。\n\
  \n您可能会对图 11.8 所示的`待签发`（Pending Issuance）消息感到困惑。如果您是独立开发者，此页面上没有批准/拒绝选项。那么如何进入下载界面？答案很简单，但不直观：您刷新页面。您会看到像之前一样的`下载`和`撤销`选项，并以同样的方式下载发布证书。文件名为\
  \ `distribution_identity.cer`。\n\n图 11.8\n\n\n\n\n\n# 处理“待签发”（Pending issuance）\n\
  \n![9781118007594-fg1108.tif](img/9781118007594-fg1108_fmt.jpeg)\n\n![mac_note.eps](img/mac_note_fmt.jpeg)\
  \ 注意\n\n如果你以公司的身份注册了开发者计划，则分发证书标签上标记的是您的公司名称而非您的个人姓名。但它仍然基于您的个人公钥。\n\n## 安装证书\n\n\
  要安装每个证书，请在 `Finder`（访达）中导航到它并双击。对所有三个证书重复此操作。双击证书会启动 `Keychain Assistant`（钥匙串访问程序）并确认证书已添加到你的\
  \ `login Keychain`（登录钥匙串）。在安装证书后，你应该能在 `Keychain` 中看到所有三个证书，如图 11.9 所示。\n\n如果你点击开发者或分发证书，你会发现它们包含了你的私钥。如果你点击\
  \ `Keys`（密钥）类别，你会发现密钥已安装在其中。\n\n安装后，你可以修改 `Xcode` 构建设置，为 `Ad Hoc` 和 `App Store`\
  \ 分发创建发布构建，如第 12 节所述。但你无法为特定的 iOS 设备创建测试构建。要完成此过程，你必须至少创建一个设备描述文件（provisioning profile）。\n\
  \n图 11.9\n\n三个证书都安装在你的钥匙串中。`Xcode` 会自动从钥匙串中读取它们。\n\n![9781118007594-fg1109.tif](img/9781118007594-fg1109_fmt.jpeg)\n\
  \n![mac_note.eps](img/mac_note_fmt.jpeg) 注意\n\n`Certificates` 包含许多其他证书。这些证书与配置无关；它们管理通用的在线安全。你可以通过选择\
  \ `My Certificates`（我的证书）类别来过滤列表以显示自己的密钥。过滤后的列表不包含 `WWDR` 证书。\n\n![mac_note.eps](img/mac_note_fmt.jpeg)\
  \ 注意\n\n默认情况下，证书有效期为一年。过期时，你必须重复密钥生成和安装过程。如果你保留了原始的 `CSR` 文件，可以重用它，这是一个好主意，因为如果你生成了新密钥，你的密钥列表会变得不必要的混乱。\n\
  \n## 手动配置设备\n\n除了证书生成外，`Provisioning Portal`（配置门户）还管理你的测试设备并创建可下载的描述文件。对于硬件测试，描述文件是安全链的最后阶段。当你在设备上安装描述文件时，`iOS`\
  \ 会检查设备是否已注册测试、你是否有权限在上面安装和运行测试构建，以及描述文件是否支持特定的 `App ID`。在 `iOS` 允许测试构建在设备上运行之前，所有这些条件必须成立。\n\
  \n图 11.10 总结了设备配置过程。这里详细描述了这些步骤。\n\n图 11.10\n\n生成并使用设备描述文件以允许在特定设备上测试\n\n![9781118007594-fg1110.eps](img/9781118007594-fg1110_fmt.jpeg)\n\
  \n要生成设备描述文件，请遵循以下步骤：\n\n1. 创建一个 `app id`。\n   每个 `App ID` 都嵌入在每个描述文件中，所以你必须从这里开始。\n\
  2. 将至少一个 `UDID` 上传到 `Provisioning Portal`，并使用它创建一个 `Device Provisioning Profile`（设备描述文件）。\n\
  3. 在 `Xcode` 中安装设备配置文件。\n   你现在可以创建一个调试构建并将构建安装到你选择的设备上进行实时测试。\n4. 可选：上传更多 `UDIDs`\
  \ 并更新 `Device Provisioning Profile` 以为你的给定 `App ID` 支持这些设备。在 `Xcode` 中重新安装更新后的配置文件。\n\
  \   你现在可以在这些其他设备上创建并运行测试构建。\n5. 可选：创建一个 `Ad Hoc Distribution Profile`（Ad Hoc 分发配置文件）。\n\
  \   你可以从上传的设备列表中选择部分或全部支持的设备。\n6. 使用 `Organizer` 中的 `Build Archive`（存档）功能和 `Share`（共享）功能为\
  \ Beta 测试人员创建 App。\n   （此选项在第 12 和第 13 节中有详细描述。）\n\n步骤 2 到 4 对于本地测试设备现在是半自动的。但如果你为\
  \ Beta 测试人员创建 ad hoc 构建，你必须理解如何获取他们的 `UDIDs`、在 `Portal` 上管理它们，并创建一个包含它们的描述文件。\n\n\
  ## 创建 App ID\n\n`App ID` 不仅仅是一个字符串；它标记了 App 的包（bundle）并控制对各种特殊服务的访问。唯一 ID 定义了单个\
  \ App。包含通配符的 ID 定义了一套 App。\n\n![bl.eps](img/bl_fmt.jpeg) 唯一 ID 可以进行配置，以让 App 访问\
  \ Apple 的实时服务：应用内购买、推送通知和游戏中心。\n\n![bl.eps](img/bl_fmt.jpeg) 唯一 ID 也可以链接到特定的硬件配件。\n\
  \n![bl.eps](img/bl_fmt.jpeg) `iOS` 设备中的 `Keychain` 访问让所有具有共享通配符 ID 的 App 具有相同的访问权限，这样它们就可以共享密码和其他安全存储的数据。\n\
  \n![bl.eps](img/bl_fmt.jpeg) 如果你不需要支持特殊功能或共享安全，可以使用通配符 ID 以于方便。你可以对你的所有 App 使用相同的\
  \ ID。\n\n![mac_note.eps](img/mac_note_fmt.jpeg) 注意\n\n不要使用通配符 ID，除非你的 App 访问 `Keychain`，如果你创建了具有相同通配符\
  \ ID 的 App，密码将共享。\n\n过程听起来比实际要复杂。在之前的 `Xcode` 版本中，你必须手动创建。在后续版本中，它是自动的。\n\n### 创建\
  \ suite ID\n\n1. 在 `Portal` 上选择 `App IDs`。\n2. 点击顶部的 `New App ID` 按钮。\n3. 输入 `description`（描述）。\n\
  4. 从菜单中选择 10 位 suite ID。将其设置为 `New`。\n5. `Bundle Identifier (App ID Suffix)`：你可以输入\
  \ `*` 或 `domainname.*`。\n6. 完成后点击 `Submit`。\n\nPortal 会立即创建你的 ID 并返回页面。新 ID 出现在页面底部。这\
  \ 10 位字符串定义了前缀。\n\n![mac_note.eps](img/mac_note_fmt.jpeg) 注意\n\n没有任何方法可以删除 App ID。一旦你创建一个，它将留在你的账户中。所以，创建\
  \ ID 时不要太随意，因为你无法清理 ID 列表。\n\n图 11.11\n\nPortal 的 App ID 设置：通配符/suite ID\n\n![9781118007594-fg1111.tif](img/9781118007594-fg1111_fmt.jpeg)\n\
  \n### 创建唯一 ID\n\n只要你理解前面描述的安全限制，你可以使用 suite ID 进行常规 App 开发。如果你不需要唯一 App ID 的功能，请跳过本节其余部分，直接进入设备配置。\n\
  \n要创建一个支持应用内购买和其他特殊服务的单个 ID，请重复该过程，但有些小不同：\n\n1. 再次点击 `New App ID` 按钮。\n2. 输入另一个\
  \ `description`。\n3. 从菜单中选择 10 位 suite ID。\n4. 在 `Bundle Identifier` 框中输入一个唯一的 App\
  \ 名称，，如图 11.12 所示。\n   不要输入通配符；名称必须唯一。\n5. 点击 `Submit`，你会看到新 ID 已再次添加到列表中。\n\n图\
  \ 11.12\n\nPortal 的 App ID 设置：唯一 ID\n\n\n\n\n\n![9781118007594-fg1112.tif](img/9781118007594-fg1112_fmt.jpeg)\n\
  \n![mac_tip.eps](img/mac_tip_fmt.jpeg) 提示\n\n如果你只需要单个的 `App ID`，为什么不直接跳到这一步并立即输入反向域名字符串作为后缀呢？因为有时你会发现自己需要一个相关的\
  \ `suite ID`。你无法从单个的 `ID` 创建一个 `suite ID`，但你可以从一个 `suite ID` 创建一个单个的 `ID`。如果你确定需要一个唯一的\
  \ `ID`，请跳过第一步，直接输入反向域名字符串。\n\n## 启用其他功能\n\n当你创建了 `wildcard/suite ID` 和单个的 `app ID`\
  \ 后，`App IDs` 页面底部的列表应该类似于图 11.13 所示。你可以看到 `wildcard/suite ID` 的额外功能被标记为不可用。由于这个\
  \ `ID` 是通用的，它们被永久禁用了。如果你的应用不需要这些功能，可以跳过本部分的剩余内容。\n\n然而，对于单个 `ID`，它们是启用的。如果你想使用应用内或\
  \ `game center`，你不需要做更多事情——除了编写代码。\n\n但是，如果你想让你的应用支持 `push notification`，你需要进行进一步的初始化，因为\
  \ `Configurable for Development` 和 `Configurable for Production` 选项需要两个额外的证书。\n\n\
  图 11.13\n\n## 在 Portal 上查看单个 ID 和 wildcard/suite ID\n\n![9781118007594-fg1113.tif](img/9781118007594-fg1113_fmt.jpeg)\n\
  \n要创建它们，请遵循以下步骤：\n\n1. 选择 `ID` 右侧的 `Configure` 按钮。\n2. 你会看到图 11.14 所示的页面。\n3. 点击其中一个证书旁边的\
  \ `Configure` 按钮。\n\n系统会要求提供一个 `CSR` 文件；你可以使用之前步骤中的同一个。（你记得保存它了吧？）\n4. 当 `Portal`\
  \ 创建证书时，下载它。\n5. 对另一个证书重复此操作。\n\n不要将这些证书添加到你的 `keychain` 中；它们应该安装在你的 `push notification\
  \ server` 上。\n\n![mac_note.eps](img/mac_note_fmt.jpeg) 注意\n\n设置服务器超出了本书的范围，但图中所示的\
  \ `Portal` 页面包含了相关文档的链接。\n\n图 11.14\n\n创建推送通知服务器证书\n\n![9781118007594-fg1114.tif](img/9781118007594-fg1114_fmt.jpeg)\n\
  \n## 手动注册设备\n\n现在你已经有了 `App ID`，可以开始添加测试设备。portal 支持手动设备管理。你必须理解此选项以创建有效的 beta 构建。对于本地设备测试，`Xcode`\
  \ 包含一个半自动化的选项可以简化配置。你仍然需要注册你的设备，但这是一个快速的过程：\n\n1. 找到 `Device ID/UDID`。\n2. 拖动选择并将其复制到剪贴板。\n\
  3. 将 `UDID` 添加到 `Portal` 上的设备列表中。\n\n### 在 Xcode 中查找设备 ID\n\n使用新的自动配置功能，你通常不需要手动管理本地设备。但为了完整性，细节在此处：\n\
  \n1. 要在 `Xcode` 中查找 `UDID`，将你的设备连接到 `Mac` 并启动 `Xcode`。\n2. 在主 `Xcode` 菜单中选择 `Window⇒Organizer`\
  \ 打开 `Organizer` 窗口。\n3. 选择 `Devices` 选项卡，并在左侧 `Devices` 列表中点击带有绿色 LED 的 `Device`。\n\
  \n你会看到图 11.15 所示的屏幕。标记为 `Identifier` 的字段就是 `UDID`。\n4. 从此字段拖动选择并复制 `UDID` 到你的剪贴板。\n\
  \n图 11.15\n\n在 `Xcode` 的 `Organizer` 中查找 `UDID` 很容易，因为 `ID` 被高亮了。\n\n![9781118007594-fg1115.tif](img/9781118007594-fg1115_fmt.jpeg)\n\
  \n### 在 iTunes 中查找设备 ID\n\n你的 beta 测试人员通常没有安装 `Xcode`。要从你的 beta 测试人员那里获取 `UDID`，请让他们连接测试设备并启动\
  \ `iTunes`。在左侧的 `Devices` 列表中选择设备将显示图 11.16 所示的内容。要显示 `UDID`，请让他们点击 `Serial Number`\
  \ 字段。然后他们可以拖动选择并复制 `UDID`，将其粘贴到电子邮件中。\n\n图 11.16\n\n在 iTunes 中查找 `UDID`\n\n![9781118007594-fg1116.tif](img/9781118007594-fg1116_fmt.jpeg)\n\
  \n### 向 Portal 中添加单个 UDID\n\n当你有一个 `UDID` 时，登录 `Portal` 并选择 `Devices` 选项卡。点击顶部的\
  \ `Add Devices` 按钮。输入任意设备名称——仅供参考——并将 `UDID` 粘贴到 `Device ID` 字段，如图 11.17 所示。点击 `Submit`。该设备已注册并添加到设备列表中。现在你可以在创建配置时包含它。\n\
  \n![mac_tip.eps](img/mac_tip_fmt.jpeg) 提示\n\n如果你是团队工作，手动添加设备可能会很麻烦。使用 `Portal` 来简化流程。\n\
  \n图 11.17\n\n![9781118007594-fg1117.tif](img/9781118007594-fg1117_fmt.jpeg)\n\n\
  ## 创建配置\n\n在你拥有开发证书、`App ID` 和至少一个注册设备后，就可以创建一个允许在设备进行测试构建的 `Provisioning Profile`。\n\
  \n1. 在 `Portal` 上，选择左侧的 `Provisioning`。\n2. 选择 `Development` 和 `New Profile`，完成图\
  \ 11.18 所示选项：\n   - `Profile Name`: 任意名称。建议使用当前日期，以便查看配置有多久了。\n   - `Certificates`:\
  \ 选择允许使用配置创建测试构建的开发者。\n   - `App ID`: 选择用于配置的 `App ID`。建议使用 suite/wildcard ID 进行测试。\n\
  \   - `Devices`: 此字段显示注册设备的复选框。选择一个或多个设备。注意，配置仅对你选择的设备有效；未选择和未注册的设备无法使用。\n3. 使用\
  \ `Download` 按钮下载配置。\n\n你也可以 `Edit` 按钮进行修改，但如果你这样做，必须重新下载配置并安装到 `Xcode` 中。\n\n图\
  \ 11.18\n\n![9781118007594-fg1118.tif](img/9781118007594-fg1118_fmt.jpeg)\n\n###\
  \ 下载配置\n\n当你点击 `Submit` 时，`Portal` 生成文件并列出它，如图 11.19 所示。\n\n图 11.19\n\n![9781118007594-fg1119.tif](img/9781118007594-fg1119_fmt.jpeg)\n\
  \n### 在 Xcode 中安装配置\n\n要在 `Xcode` 中安装配置，请在 `Finder` 中找到它，打开 `Organizer` 中的 `Devices`\
  \ 页面，并将配置拖到左上列表中的 `Provisioning Profiles` 项目上，如图 11.20 所示。该文件具有你给它的第一个名称以及 `.mobileprovision`\
  \ 扩展名。\n\n你也可以通过将其丢到 dock 上的 `Xcode` 或 `iTunes` 图标来安装配置。\n\n\n\n\n\n当你第一次创建测试构建时，`Xcode`\
  \ 会要求你允许访问钥匙串（keychain）。选择 `Always Allow`（始终允许）选项并等待。最初，构建会被复制到设备的闪存内存中。从那里开始，它会自动启动并加载到\
  \ RAM 中，就像标准的应用程序启动一样。这可能需要一分钟左右。最后，应用程序就会运行。随后的构建启动速度会更快。\n\n图 11.20\n\n在 Xcode\
  \ 中安装配置文件\n\n![9781118007594-fg1120.tif](img/9781118007594-fg1120_fmt.jpeg)\n\n\
  ![mac_note.eps](img/mac_note_fmt.jpeg) 注意\n\n请注意配置文件存在两个地方：`Xcode` 中和设备上。在将应用程序复制到设备之前，`Xcode`\
  \ 会检查配置文件是否已安装。如果没有安装，它将自动安装。完成第一次测试构建后，打开设备上的 `Settings`（设置）应用，选择 `General`（通用）和\
  \ `Profile`（描述）。你可以在这里查看配置文件，并将其删除——但如果你删除了，`Xcode` 在你创建新的测试构建时会再次安装。\n\n![mac_caution.eps](img/mac_caution_fmt.jpeg)\
  \ 警告\n\n在测试构建之前解锁你的手机。如果手机锁定状态，`Xcode` 将无法自动解锁也无法安装你的测试构建。\n\n### 创建分发配置文件\n\n创建分发的步骤与开发配置所需的步骤类似。在\
  \ `Portal`（开发者网站）上，从左侧列表选择 `Provisioning`（配置）项目和 `Distribution`（分发）标签页。你会看到图 11.21\
  \ 所示的屏幕。它与开发配置屏幕相似，但选项略有不同：\n\n![bl.eps](img/bl_fmt.jpeg) 分发方法：最终 App Store 分发配置文件选择\
  \ `App Store`，为 Beta 分发配置文件选择 `Ad Hoc`。这两个选项是互斥的。\n\n![bl.eps](img/bl_fmt.jpeg)\
  \ 分发证书：这已为你预设，包含你的分发身份标识。\n\n![bl.eps](img/bl_fmt.jpeg) App ID：这与开发配置的 `App ID`\
  \ 选项相同。\n\n![bl.eps](img/bl_fmt.jpeg) 设备：对于 `App Store` 分发显示为灰色，因为配置文件未绑定特定设备。对于\
  \ `Ad Hoc` 分发，你可以从列表中选择设备。排除的设备无法运行 Beta 构建。\n\n图 11.21\n\n创建分发构建\n\n![9781118007594-fg1121.tif](img/9781118007594-fg1121_fmt.jpeg)\n\
  \n当你点击 `Submit`（提交）按钮时，`Portal` 会创建一个配置文件并显示 `Download`（下载）按钮。下载配置文件，并将其从 `Finder`\
  \ 拖到 `Xcode Organizer` 中的 `Distribution Profiles` 项目中。这将使其安装在 `Xcode` 中。现在你可以创建分发构建了。\n\
  \n![mac_tip.eps](img/mac_tip_fmt.jpeg) 提示\n\n`Portal` 左侧列表中的最后一项被称为 `Distribution`（分发）。它似乎可能包含管理分发所需的资源，但实际上并没有。它实际上只是一组名称没有帮助的文档链接。你可以将其作为快速帮助参考，但它对于认证或配置没有实际功能。\n\
  \n![mac_crossref.eps](img/mac_crossref_fmt.jpeg) 交叉引用\n\n在 `Xcode` 中创建分发构建还需要做更多工作，因为除非你告诉它，否则\
  \ `Release` 构建方案不会使用分发配置文件。详情请参阅第 12 章。\n\n### 自动配置\n\n如果整个配置过程能够自动化，将节省大量时间。遗憾的是，并非如此。创建\
  \ `CSR` 以及生成和安装开发、分发和 `WWDR` 证书是一个手动过程。\n\n#### 创建自动设备配置文件\n\n但 `Xcode` 现在包含一个自动设备配置功能，它可以执行以下操作：\n\
  \n![bl.eps](img/bl_fmt.jpeg) 在 `Portal` 上的设备列表中添加设备\n\n![bl.eps](img/bl_fmt.jpeg)\
  \ 为测试创建通配符 `App ID`\n\n![bl.eps](img/bl_fmt.jpeg) 生成开发配置文件\n\n![bl.eps](img/bl_fmt.jpeg)\
  \ 将其下载到 `Xcode` 并安装在新设备上\n\n![bl.eps](img/bl_fmt.jpeg) 下载并安装现有的开发者和分发证书\n\n了解自动配置的局限性很重要。它不会执行以下操作：\n\
  \n![bl.eps](img/bl_fmt.jpeg) 生成公私钥和本地身份标识\n\n![bl.eps](img/bl_fmt.jpeg) 生成并安装新的开发者和分发证书\n\
  \n![bl.eps](img/bl_fmt.jpeg) 下载并安装 `WWDR` 证书\n\n![bl.eps](img/bl_fmt.jpeg) 生成或安装\
  \ `App Store` 分发配置文件\n\n![bl.eps](img/bl_fmt.jpeg) 生成或安装 `Ad Hoc` 分发配置文件\n\n要使用自动配置，请遵循以下步骤：\n\
  \n1. 连接设备。\n2. 打开 `Organizer` 中的 `Devices` 页面，等待设备被识别。\n3. 选择设备。\n4. 点击底部的 `Add\
  \ to Portal`（添加到 Portal）按钮。\n\n系统会提示输入 `Apple ID` 和密码，如图 11.22 所示。其余部分是自动的。完成后，你会看到开发配置文件已安装在\
  \ `Xcode` 和设备上。现在你可以创建分发构建。\n\n图 11.22\n\n自动配置\n\n![9781118007594-fg1122.tif](img/9781118007594-fg1122_fmt.jpeg)\n\
  \n![mac_caution.eps](img/mac_caution_fmt.jpeg) 警告\n\n自动配置生成一个通配符 ID，因此你需要手动执行此。\n\
  \n#### 刷新配置文件\n\n设备配置文件三个月后过期。你可以随时通过选择 `Devices` 标签页、顶部的 `Provisioning` 并点击窗口底部的\
  \ `Refresh`（刷新）按钮来创建新配置文件，如图 11.23 所示。你需要输入你的 `Apple ID` 和密码。\n\n这将带有当前日期的刷新配置文件，如图\
  \ 11.23 所示。\n\n图 11.23\n\n使用刷新功能创建配置文件\n\n![9781118007594-fg1123.tif](img/9781118007594-fg1123_fmt.jpeg)\n\
  \n#### 在 Mac 之间迁移\n\n另一种“自动”配置方法是使用 `Xcode` 中新的配置文件导入/导出功能。它的工作正如你预期，它将你的配置信息保存到一个受保护的文件，你可以将其导入另一台\
  \ Mac 的 `Xcode`。\n\n要完成操作，请遵循以下步骤：\n\n1. 在 `Organizer` 左上角选择 `Devices` 和 `Developer\
  \ Profile`，点击 `Export`（导出）按钮。\n2. 输入文件名并两次输入相同的密码，如图 11.24 所示。\n\n`Xcode` 请求访问你的钥匙串并将所有的身份标识、证书和配置文件封装成一个\
  \ `.developerprofile` 扩展的文件。你可以使用相应的 `Import` 按钮和密码在另一台 Mac 上导入它们。\n\n图 11.24\n\n\
  拷贝完整的开发者配置文件\n\n![9781118007594-fg1124.tif](img/9781118007594-fg1124_fmt.jpeg)\n\
  \n在本文编写时，`Xcode 4` 未能复制 `WWDR` 证书。这可能是一个错误，也可能是故意的。如果你使用此功能，请记住你可能需要手动在另一台 Mac 上安装\
  \ `WWDR`。\n\n### OS X 分发配置\n\n到目前为止，本章讨论了 iOS 配置。2010 年，Apple 发布了 Mac App Store\
  \ 并为 Mac 开发者创建了配置方案，该方案比 iOS 的方案要简单得多。\n\n\n\n\n\n在项目完成并准备好提交到 Mac App Store 之前，你不需要配置（provisioning）。如果你是独立分发项目——例如，通过销售或在网站上免费提供——你也不需要配置。配置仅对于\
  \ App Store 提交至关重要。\n\n对于 Mac 开发者，在线的 `Developer Certificate Utility`（开发者证书工具）等同于\
  \ iOS 的 `Provisioning Portal`（配置门户）。它没有团队开发功能，也没有独立的设备配置选项：OS X 项目运行在开发用的 Mac 上。然而，开发者仍然必须先使用\
  \ `Keychain Assistant`（钥匙串辅助）创建一个 `CSR` 文件。为 iOS 项目创建过 `CSR` 的开发者可以使用同一个文件进行 Mac\
  \ 分发。\n\n`Developer Certificate Utility` 显示为 Mac 开发者中心主页 `Mac Developer Program`\
  \ 标题右侧的链接，如如图 11.25 所示。\n\n图 11.25\n\n这就是 `Developer Certificate Utility`；与所有 Apple\
  \ 在线内容一样，该功能的位置和设计可能会随时更改。\n\n![9781118007594-fg1125.tif](img/9781118007594-fg1125_fmt.jpeg)\n\
  \n### 理解 OS X 配置\n\nOS X 配置包含五个组成部分：\n\n![bl.eps](img/bl_fmt.jpeg) 带有开发者公钥的 `CSR`。\n\
  \n![bl.eps](img/bl_fmt.jpeg) 一个或多个唯一的 `App IDs`：推荐使用反向域名格式。\n\n![bl.eps](img/bl_fmt.jpeg)\
  \ 标准的 `Apple WWDR certificate`：这与用于 iOS 开发的证书相同。如果你已经有一个副本，无需再次安装。\n\n![bl.eps](img/bl_fmt.jpeg)\
  \ `Mac App Software Certificate`（Mac App 软件证书）：它用于签名你的应用程序包。\n\n![bl.eps](img/bl_fmt.jpeg)\
  \ `Mac Installer Package Certificate`（Mac 安装包证书）：这是用于安装程序的独立签名文件，它将包封装成一个可以通过 App\
  \ Store 销售的可安装产品。\n\n不支持通配符/套件 `App IDs`，因此你必须为每个项目创建一个唯一的 `App ID` 和两个证书。\n\n###\
  \ 实践中的配置\n\n图 11.26 显示了 `Developer Certificate Utility`。首次配置 OS X 项目时，请遵循以下步骤：\n\
  \n1. 如果你还没有 `CSR` 文件，请按照本章前面的说明创建它。\n2. 使用 `Developer Certificate Utility` 创建一个唯一的\
  \ `App ID`。\n\n图 11.26\n\n`Developer Certificate Utility` 比 iOS 的同类工具简单得多。\n\n![9781118007594-fg1126.tif](img/9781118007594-fg1126_fmt.jpeg)\n\
  \n3. 使用 `Developer Certificate Utility` 创建 `App Software` 证书。此步使用你的 `CSR` 文件。下载证书，但先不要安装，即使\
  \ `Utility` 提示你这样做。\n4. 创建 `Installer Package`（安装包）证书。此步使用 `App ID`。下载证书，但不要安装。\n\
  5. 如果你还没有额外的 `WWDR certificate`，请下载它。\n6. 在你的钥匙串中安装这些证书。\n\n现在你可以使用这些证书创建一个带有安装包的发行版本，并将安装包上传到\
  \ App Store。证书的有效期为一年，或直到你的开发者订阅过期，以较者为准。它们没有绑定到特定的 `App ID`，因此你可以对所有项目使用相同的证书。\n\
  \n### 创建 App ID\n\n若要创建 `App ID`，请遵循以下步骤：\n\n1. 选择 `Create Mac App ID` 链接，并填写两个字段，如图\
  \ 11.27 所示。\n2. 名称可以是任意字符串。\n3. 为主 `App ID` 使用反向域名方案，例如 `com.yourdomainnamegoeshere.yourappname`。\n\
  \n![mac_note.eps](img/mac_note_fmt.jpeg) 注意\n\n你的 `App ID` 在 App Store 上必须是唯一的。虽然\
  \ `App IDs` 并不强制要求使用反向域名方案，但它是确保你的 `ID` 唯一的最佳方法。其他开发者可能会意外使用你所选的应用名称，但如果你以你的域名作为前缀，就能保证唯一性。\n\
  4. 点击右下角的 `Confirm` 按钮。系统要求你确认提交。当你点击 `Submit` 时，`App ID` 将被添加到 `Utility` 中。\n\n\
  ![mac_tip.eps](img/mac_tip_fmt.jpeg) 提示\n\n你可以使用 `View Mac App ID` 链接查看你的 `App IDs`\
  \ 列表。该列表包含 `Remove` 功能。要删除 `ID`，勾选 `ID` 旁的复选框并点击页面右下角的 `Remove` 按钮。\n\n图 11.27\n\
  \n创建 Mac App ID\n\n![9781118007594-fg1127.tif](img/9781118007594-fg1127_fmt.jpeg)\n\
  \n### 创建发行证书\n\n若要创建证书对，在 `Developer Certificate Utility` 页面选择 `Create Certificates`\
  \ 链接。你会看到如图 11.28 所示的页面。保持两个复选框不变；你通常需要创建两个证书。\n\n图 11.28\n\n选择证书类型\n\n![9781118007594-fg1128.tif](img/9781118007594-fg1128_fmt.jpeg)\n\
  \n\n\n\n[content]\n但 Xcode 的一个关键特性是构建过程几乎是无限自定义的。你不需要将构建过程视为一个接收源文件并将其转换为 App 的黑盒，而是可以将构建过程拆分为多个步骤，更改每个步骤的设置和输出，甚至添加完全新的步骤——例如，创建使用其他语言编写代码的混合项目。\n\
  \n你还可以以各种方式组合项目和文件，创建共享相关代码的混合构建；例如，你可以同时开发一个框架和一个用于测试或使用该框架的项目。\n\n在 Xcode 3 中，这种混合构建很难管理。在\
  \ Xcode 4 中，通过新的工作空间（workspace）系统，简化了项目之间的代码共享，使得能够同时处理多个相关项目变得容易。本章概述了 Xcode 4\
  \ 构建系统的关键特性，并引入了控制构建过程的编辑器和选项。\n\n第 13 章介绍了一些构建自定义的实用示例，并探索了更高级的构建控制选项。\n\n# 开始使用\
  \ Xcode 构建系统\n\n尽管你可以通过简单的一键方式使用构建系统，但其底层技术既强大又复杂。默认的一键选项刻意隐藏了这种复杂性，但在你开始自定义构建之前，你必须熟悉它的关键元素。\n\
  \n图 12.1 首次展示了 Xcode 如何组织构建。\n\n这些是关键元素：\n\n![bl.eps](img/bl_fmt.jpeg) **项目（Projects）**：项目是源文件的集合，你可以使用本书之前介绍的编辑工具对其进行选择和更改。\n\
  \n![bl.eps](img/bl_fmt.jpeg) **工作空间（Workspaces）**：工作空间是一个或多个项目的容器。之前的 Xcode 版本是基于项目的。然而，开发者经常需要以更开放的方式处理源文件。在多个相关项目中使用来自同一代码库的文件组合并不罕见。工作空间使得这种操作变得简单。工作空间中的所有项目共享同一个构建空间，你可以使用\
  \ Xcode 的构建功能来定义如何组合源文件。你还可能通过单次构建操作构建多个项目。\n\n![bl.eps](img/bl_fmt.jpeg) **目标（Targets）**：目标是构建项目项目的文件的配方，它定义了产物——例如\
  \ App 或框架。默认情况下，一个项目包含单个目标。你可以根据需要添加更多目标。注意，目标不必是一个完成的 App。你还可以创建以其他方式处理代码的目标——例如，运行一组可选的测试宏以检查重要功能是否正常工作。\n\
  \n![bl.eps](img/bl_fmt.jpeg) **产品（Products）**：产品是目标创建的文件集合：App、框架、测试构建等。\n\n图 12.1\n\
  \nXcode 构建系统的组件\n\n![9781118007594-fg1201.eps](img/9781118007594-fg1201_fmt.jpeg)\n\
  \n![bl.eps](img/bl_fmt.jpeg) **构建操作（Build actions）**：共有六种标准操作，如如图所示。构建操作选择一个或多个目标，构建它们，然后通过进一步的\
  \ Xcode 功能运行它们。例如，`Run`（运行）操作将代码加载到运行时环境中并启动调试器，而 `Analyze`（分析）操作将代码通过分析器以检查基本错误。\n\
  \n![bl.eps](img/bl_fmt.jpeg) **方案管理器/编辑器（Scheme manager/editor）**：工作空间可以有一个或多个方案（schemes），这些在方案管理器/编辑器中定义。你可以使用方案来自定义构建操作；例如，一个方案中的\
  \ `Run` 操作构建一个目标，而在另一个方案中，它构建工作空间中的所有目标。\n\n![bl.eps](img/bl_fmt.jpeg) **脚本（Scripts）**：你可以设置构建操作来运行操作前和操作后的脚本，这些脚本可以播放声音、发送电子邮件、打开警告框、复制文件等。\n\
  \n![bl.eps](img/bl_fmt.jpeg) **设置和配置（Settings and configurations）**：虽然图中没有显示，但设置和配置定义了编译、链接和打包的低级选项。它们将在本章稍后部分进行详细介绍。\n\
  \n尽管 Xcode 4 包含了新的简化构建管理功能，但参与构建的各个元素之间的关系并不特别直观。在这些关系变得清晰之前，你可能需要多次阅读本章。\n\n![mac_note.eps](img/mac_note_fmt.jpeg)\
  \ **注意（NOTE）**\n\n创建一个简单的 App Store 构建版本不需要详细了解该过程，但某些元素会以意料之外的方式相互作用。如果你对构建系统有良好的理解，你会发现工作起来更高效。\n\
  \n# 创建和组织工作空间\n\n当你创建一个新项目时，系统会自动创建一个工作空间来容纳它。对于简单的 App 项目，你可以忽略工作空间，只需将每个新项目保存为独立单元。对于包含多个项目的复杂应用程序，你可以使用工作空间将相关项目分组。\n\
  \n使用工作空间最简单的方法是创建一个空工作空间然后向其中添加项目。要创建一个空白工作空间，从 Xcode 主菜单选择 `File⇒New⇒New Workspace`。然后你可以通过在项目导航器（Project\
  \ navigator）底部的空白区域右键点击并选择 `New Project…` 来添加项目。\n\n你添加现有项目。选择 `Add Files…`，导航到现有项目的\
  \ `.xcodeproj` 文件并选择它。\n\n![mac_caution.eps](img/mac_caution_fmt.jpeg) **警告（CAUTION）**\n\
  \n这对简单的共享开发很有用，但此选项不支持版本控制，请谨慎使用。有关更高级的版本控制，请参阅第 14 章。\n\n工作空间在项目导航器中充当组。当你第一次保存新项目时，可以使用对话框底部的组弹出窗口来控制将其添加到哪个组。默认是工作空间，如图\
  \ 12.2 所示。工作空间中的项目可以保存到任何路径；不必保存到同一个文件夹。\n\n图 12.2\n\n选择工作空间中的项目组时，默认选择通常是。\n\n\
  ![9781118007594-fg1202.eps](img/9781118007594-fg1202_fmt)\n\n![mac_note.eps](img/mac_note_fmt.jpeg)\
  \ **注意（NOTE）**\n\n你可以嵌套项目并将项目放在另一个项目的组。。通常不是很有用的做法；每个项目都有自己的组会更容易处理。\n\n# 处理项目和目标\n\
  \n工作空间是一个容器，没有构建设置或选项。它本质上是一个持有其他项目的组。项目和目标拥有构建选项——数百个。Xcode 包含一个独立的构建编辑器来管理它们，如图\
  \ 12.3 所示。要打开此编辑器，选择项目导航器左上角的项目名称。选项列表出现在右侧，如图所示。\n\n![mac_tip.eps](img/mac_tip_fmt.jpeg)\
  \ **提示（TIP）**\n\n点击项目名称以显示构建编辑器可能并不直观。花几分钟将这个步骤固定在脑海中，有助于你以后记住它。\n\n构建编辑器非常复杂。在选项左侧的凹槽区域有两个项目：`PROJECT`\
  \ 和 `TARGETS` 标题。正如你预期的，项目图标显示整个项目的选项，而每个目标图标显示每个目标的选项。选择一个目标，你将在窗口顶部看到更长的标签页选项列表，如图\
  \ 12.4 所示。\n\n图 12.3\n\n导航到构建编辑器。默认显示项目设置。\n\n![9781118007594-fg1203.eps](img/9781118007594-fg1203_fmt)\n\
  [/content]\n\n\n\n默认情况下，每个项目都有一个目标（target）。如果你需要以两种或更多方式处理项目文件，可以为项目定义多个目标——正如你在第\
  \ 17 章中看到的，在该章中你将处理包含两个目标的项目：一个创建一个标准构建版本，另一个创建一个用于实现自动代码测试的特殊构建版本。对于标准的简单 App 项目，你可以保持默认的单一目标。\n\
  \n### 图 12.4\n导航到目标构建设置。顶部的标签包含了一些未包含在项目设置中的额外项目。\n\n![9781118007594-fg1204.tif](img/9781118007594-fg1204_fmt.jpeg)\n\
  \n### 理解设置和选项\n关于项目和目标，有五个关键点需要记住：\n\n![bl.eps](img/bl_fmt.jpeg) 项目和目标可以有独立的构建选项。\n\
  \n![bl.eps](img/bl_fmt.jpeg) 构建选项（Build options）不等同于构建设置（Build settings）。\n\n![bl.eps](img/bl_fmt.jpeg)\
  \ 构建选项包含了制作目标所需的信息，包括选定的资源文件、支持的方位、版本号、属性列表（property lists）等。它们也包含了构建设置。\n\n![bl.eps](img/bl_fmt.jpeg)\
  \ 构建设置是低级编译器、链接器和打包器开关的列表。\n\n![bl.eps](img/bl_fmt.jpeg) 目标选项会覆盖项目选项。\n\nXcode 使用优先级层次结构来计算在构建目标时使用哪些设置和选项。本章稍后会有更多相关信息。\n\
  \n![mac_note.eps](img/mac_note_fmt.jpeg) 注意\n\n在 Xcode 的早期版本中，你还可以定义一个可执行文件——产品运行的上下文。在\
  \ Xcode 4 中，此选项已扩展并内置到新的“方案”（schemes）功能中，该功能将在本章稍后描述。\n\n### 理解项目选项\n如果你选择项目图标，将看到两个标签：\n\
  \n![bl.eps](img/bl_fmt.jpeg) Info（信息）：这包括最小支持 OS 版本、配置列表（选定的构建设置预设）以及针对特定语言进行本地化的文件摘要。在实践中，本地化（Localizations）选项对于多语言支持至关重要，配置（Configurations）选项对\
  \ App Store 构建自定义很有用，而 SDK/Deployment/OS 选项通常会被目标覆盖。\n\n![bl.eps](img/bl_fmt.jpeg)\
  \ Build settings（构建设置）：这是一个长列表，包含数百个编译器、链接器和部署选项，这些选项适用于整个项目。它们可以被每个目标的等效设置所覆盖。\n\
  \n### 理解目标选项\n如果你选择目标图标，或者在项目有多个目标时选择其中一个，你会看到五个带有不同选项的标签。注意，目标选项是独立的。如果你的项目有多个目标，每个目标都有不同的选项。你看到的标签如下：\n\
  \n![bl.eps](img/bl_fmt.jpeg) Summary（摘要）：包括基础构建信息，如 App 版本号、最小 OS、默认 nib 等。你必须自定义这些设置以创建一个有效的\
  \ App Store 构建版本。这些选项在附录 B 中有更详细描述。\n\n![bl.eps](img/bl_fmt.jpeg) Info（信息）：这是一个控制\
  \ App 启动的类文本选项列表。同样，你必须为 App Store 构建自定义这些设置。注意此列表是一个 `plist`——一个 XML 属性列表。编辑技术和内容在附录\
  \ B 中描述。\n\n![bl.eps](img/bl_fmt.jpeg) Build Settings（构建设置）：乍一看，这个列表与项目构建设置完全相同：它是另一个编译器、链接器和部署选项列表。这两个列表非常相似，但存在一些细微差异。记住，这些目标构建设置会覆盖项目构建设置。\n\
  \n![bl.eps](img/bl_fmt.jpeg) Build Phases（构建阶段）：此标签的内容控制被处理的文件及其处理顺序。每个阶段定义了包含在构建序列中的文件和框架。在这里你还可以设置依赖项，以便在某些相关文件被修改时强制重新构建目标。对于简单的\
  \ App，你可以忽略此页面上的大部分功能，但有一个例外：将标准框架包含在项目中的选项。\n\n![bl.eps](img/bl_fmt.jpeg) Build\
  \ Rules（构建规则）：规则定义了每类型文件的处理方式。具体来说，你可以为列表中的每个现有文件类型定义或创建自定义脚本，并添加自己的新文件类型以及自定义处理选项。这些高级选项对于简单\
  \ App 不需要，但在更复杂的项目中会变得有用。\n\n![mac_crossref.eps](img/mac_crossref_fmt.jpeg) 交叉引用\n\
  \n构建设置在本章中介绍。构建阶段和规则在第 13 章中有更详细的描述。\n\n### 探索构建设置\n正如本章前面提到的，构建设置包含了编译器、链接器和打包器的选项。当你构建项目时，Xcode\
  \ 将这些设置转换为命令行开关并将它们包含在编译器脚本中。完整的设置列表非常长，看起来可能令人生生畏。但在实践中，在典型项目中，你可以保持大多数设置不变。\n\n\
  要操作构建设置，请在构建选项窗口中选择 `Build Settings` 标签。设置显示在编辑器中，有四个按钮控制 UI 的布局。前两个按钮控制哪些设置可见，后两个按钮控制它们的显示方式。设置以列表或表格形式出现，并带有分组标题。这些设置有：\n\
  \n![bl.eps](img/bl_fmt.jpeg) Basic（基础）：这种布局列出了设置的一个小子集，如图 12.5 所示。它不是最用的，但包含了一些重要的设置。\n\
  \n### 图 12.5\n在基础设置中，两个最重要的选项是 `Compiler Version` 和 `Targeted Device Family`。\n\n\
  ![9781118007594-fg1205.tif](img/9781118007594-fg1205_fmt.jpeg)\n\n![bl.eps](img/bl_fmt.jpeg)\
  \ All（全部）：这种布局列出了所有设置，如图 12.6 所示。\n\n![bl.eps](img/bl_fmt.jpeg) Combined（组合）：多个值的开关以嵌入菜单的形式。你可以点击设置选择不同的值。\n\
  \n![bl.eps](img/bl_fmt.jpeg) Levels（层次）：这种视图展示了设置如何通过多个层进行级联，如图 12.7 所示。该功能将在下方解释。\n\
  \n### 图 12.6\n完整的设置通过 `All` 按钮显示。\n\n![9781118007594-fg1206.tif](img/9781118007594-fg1206_fmt.jpeg)\n\
  \n![mac_tip.eps](img/mac_tip_fmt.jpeg) 注意\n可以使用分组标题中的折叠/展开三角形来隐藏不常用的设置，以简化显示。\n\n\
  ![mac_tip.eps](img/mac_tip_fmt.jpeg) 注意\n如果你在工具面板中打开快速帮助并选择一个构建设置，你会看到关于该设置及其等效命令行开关的简短有用描述。对于更高级的自定义，官方文档提供了稍微详细（尽管并不多）的描述，其中包含某些设置相互作用的额外信息。可以在组织程序的文档中搜索\
  \ `Build Setting Reference`。\n\n### 图 12.7\n新的 `Levels` 视图在一个窗口内显示了多个构建设置。\n\n![9781118007594-fg1207.tif](img/9781118007594-fg1207_fmt.jpeg)\n\
  \n### 理解层次视图\n层次视图在查看目标设置时有四列，在查看项目设置时有三列。视图的工作方式并不直观，但在理解了它是如何组织的后，其设计就会变得清晰。\n\
  \n这里有两个关键点。第一是 Xcode 构建设置通过多个默认层进行级联。每一层都会覆盖上层。当 Xcode 创建构建时，它使用此表来查找优先级最高的设置并将其应用于构建中。\n\
  \n优先级顺序从右向左。存在这些列：\n\n\n\n\n![bl.eps](img/bl_fmt.jpeg) OS 默认：当其他行为空时应用的这些标准默认开关。\n\
  \n![bl.eps](img/bl_fmt.jpeg) 项目设置：此列表显示项目构建设置。这与你通过选择 `Build Settings` 选项卡下的 `PROJECT`\
  \ 图标和 `All/Combined` 按钮所看到的列表相同。这些设置会覆盖 OS 默认值。如果一个项目有多个目标，这些设置将适用于所有目标。\n\n![bl.eps](img/bl_fmt.jpeg)\
  \ 目标设置：此列表显示当前所选目标的构建设置。这与你通过选择 `All/Combined` 按钮看到的列表相同。这些设置会覆盖项目设置和 OS 默认值。如果你的项目有多个目标，此列中的设置适用于当前选中的目标。其他目标可以有不同的设置。\n\
  \n![bl.eps](img/bl_fmt.jpeg) 已解析（Resolved）：这些是应用于构建的最终计算设置。由于它们是从其他列计算出的，因此你无法编辑它们。\n\
  \n图 12.8 展示了每个层级如何覆盖下一层。优先级较高的层级会覆盖列表靠下的层级。\n\n第二个关键点是，Xcode 仅存储创建无歧解析所需的最高层级设置。\n\
  \n如果你滚动查看表格，你会发现许多设置被留给了系统默认值。项目或目标列都没有条目。因为它们是空的，所以解析值与默认值相同。\n\n这看起来可能像是一个微不足道的点，但实际上它至关重要。当你编辑目标或项目设置时，你不仅在修改它的值，还向设置表里添加了一个新条目。\n\
  \n为什么这很重要？考虑以下操作序列：\n\n1. 你编辑了一个项目设置。\n2. 该设置具有最高优先级，因此它适用于所有目标。你可以反复更改它，它始终会生效。\n\
  3. 稍后，你决定为其中一个目标编辑该设置。\n4. 新的目标设置将如你预期的那样生效。\n5. 你再次更改了项目设置。\n6. 因为现在存在目标设置，新的项目设置将不再应用于该目标。目标设置将继续覆盖它。\n\
  \n一只要你在目标层级更改了设置，你就锁定了未来对该设置的所有项目层级更改。\n\n这几乎是直观的——但并非完全如此。如果你完全在 `Combined View`\
  \ 中工作，可能很难理解正在发生什么，因为有时你所做的更改如你预期的那样生效，有时又不会。\n\n`Combined View` 没有阐明目标设置和项目设置之间的优先级差异。它也没有让人明确看出，如果没有定义目标设置，项目设置可能会（令人困惑地）看起来覆盖了目标设置。\n\
  \n图 12.8\n\n构建设置按层级排列。图表显示了高优先级层级如何覆盖低层级。\n\n![9781118007594-fg1208.eps](img/9781118007594-fg1208_fmt.jpeg)\n\
  \n![mac_note.eps](img/mac_note_fmt.jpeg) 注意\n\n使用命令行工具的高级开发者可以手动覆盖所有设置。这是一项特殊且高级的技术，为了完整性被包含在图中。它不支持直接从\
  \ Xcode 中进行。\n\n`Levels` 视图有一些特殊之处：\n\n![bl.eps](img/bl_fmt.jpeg) 中间的两个列没有标签。它们包含了项目名称和图标，但没有文字指示你正在编辑项目和目标设置。\n\
  \n![bl.eps](img/bl_fmt.jpeg) 你无法编辑 OS 默认值或 `Resolved` 列。\n\n![bl.eps](img/bl_fmt.jpeg)\
  \ 项目和目标显示的设置之间存在细微差异。\n\n![bl.eps](img/bl_fmt.jpeg) 目标和项目构建设置都包含一个 `Levels` 视图。然而，项目设置中的版本不包含目标设置列。\n\
  \n作为一个简单的操作规则，如果你正在开发一个带有单一目标的应用程序，忽略项目设置并完全在目标层级工作会更容易。使用 `Target Levels` 视图来编辑并确认你想要更改的设置。完全忽略项目列。\n\
  \n如果你的项目有多个目标，创建项目层级设置是标准做法。但要注意前面描述的目标层级锁定。一旦你添加了目标层级设置，就没有办法删除它。如果你尝试应用项目层级的更改，它们总是会被覆盖。\n\
  \n另请注意，项目和目标列中的空行并不是真的空的。如果你选择它们，你会发现可以编辑它们。\n\n![mac_crossref.eps](img/mac_crossref_fmt.jpeg)\
  \ 交叉引用\n\n第 13 章有关于构建设置更高级的指南。\n\n## 使用 Scheme 和构建配置（Build Configurations）\n\n开发者经常需要为不同的目的自定义构建；例如，用于调试的测试构建可能与最终的\
  \ App Store 构建具有不同的构建设置。Xcode 通过两种方式处理此问题。\n\n`Build configurations`（构建配置）允许你针对特定目的（调试、发布等）更改构建设置子集。理论上，每个构建设置在每个配置下都可以有一个不同的值。默认情况下，大多数设置取单个值；只有少数初始化时带有多个值。\n\
  \n`Schemes`（方案）为你提供了更广泛的控制。方案的关键特性是，它们定义了构建操作，允许你为不同的目的构建项目：测试、代码分析等。方案包含了构建配置，但增加了其他构建选项。\n\
  \n### 开始使用构建配置\n\n切换配置是一种一次性更改一组设置的快速方法，如图 12.9 所示。当你选择一个配置时，Xcode 会自动选择相应的值并应用。单值设置保持不变。\n\
  \n在实践中，这意味着你可以快速自定义配置以创建特定目的构建——调试、本地测试、App Store 发布、Ad Hoc 发布等——而无需创建独立的构建设置列表。\n\
  \n方便的是，配置包含了创建调试和发布构建所需的设置。不方便的是，这些设置散落在所有构建设置的全列表中。\n\n![mac_note.eps](img/mac_note_fmt.jpeg)\
  \ 注意\n\n为什么不为配置复制每个构建设置？实际原因是设置编辑器可以为不同的配置显示多个值。但为所有可能的配置复制每个设置会导致编辑器变得臃肿且难以操作。在实践中，大多数设置不需要修改，因此大多数复制都是多的。\n\
  \n图 12.9\n\n大多数构建设置具有单个值。包含在配置文件中的设置可以取并显示多个值。解析值取决于哪个配置处于激活状态。默认情况下，每个新项目创建两个配置：Debug\
  \ 和 Release。你可以通过复制这两个或两者创建自己的配置，并给你的新配置一个不同的名称。然后你可以修改它的设置并将其保存到项目中。\n\n要创建一个具有多个值的设置，选择它并点击最左侧的展开三角形。该设置将展开显示配置列表。现在你可以为每个配置设置不同的值。\n\
  \n设置编辑器对多值有特殊处理。它以 `<Multiple` `Values>` 标签显示它们，配置设置以行的形式出现在下方。图 12.10 通过 iOS 项目的一个关键配置设置示例——`Code\
  \ Signing Identity`（代码签名标识）说明了这一点。\n\n\n\n\n配置是针对项目特定的。配置名称和设置是项目的一部分。如需更高级的配置自定义，请参阅第\
  \ 13 章。\n\n### 图 12.10\n查看代码签名标识（Code Signing Identity）设置的多个配置值\n![9781118007594-fg1210.tif](img/9781118007594-fg1210_fmt.jpeg)\n\
  \n表 12.1 列出了所有默认具有多个值的设置。在实践中，你可以忽略大部分设置，因为核心区别可以总结如下：\n\n![bl.eps](img/bl_fmt.jpeg)\
  \ **调试（Debug）**：此配置包含调试符号——这是一个附加的字符串和内存地址列表，用于在调试器中显示人类可读的信息。在 iOS 上，此配置使用开发者身份（Developer\
  \ Identity）对代码签名，以便在实体硬件上进行测试。\n\n![bl.eps](img/bl_fmt.jpeg) **发布（Release）**：你可以将此配置作为适用于分发的的基础——例如，Ad\
  \ Hoc beta 测试或上传到 App Store。但通常需要对其进行修改以实现这一点。此配置不包含调试符号。在 OS X 上，此配置创建的应用可以通过双击运行的\
  \ App，但它不包含 App Store 分发信息，也没有封装在安装程序包中。在 iOS 上，如果没有进一步的自定义，此配置是没用的。它无法创建一个可以上传到\
  \ App Store 或通过电子邮件发送给 beta 测试者的构建版本。\n\n![/Table 1201](img/9781118007594-tb1201.jpg)\n\
  \n## 理解方案（Schemes）\n\n方案获取了各种构建选项和配置设置，并在其周围封装了额外功能。\n\n默认情况下，当你构建项目时，Xcode 会创建一个包含调试符号的测试构建版本。它会自动启动调试器并将其附加到活跃的运行时。\n\
  \n在 Xcode 中，此序列是六种标准构建操作之一——即以各种方式构建和处理目标的选项。这些是标准操作：\n\n![bl.eps](img/bl_fmt.jpeg)\
  \ **构建（Build）**：构建一个或多个目标——换句话说，创建它们的产物，但不会启动、处理或以任何其他方式使用它们。此操作是主操作。它是至关重要的第一步，并由所有其他操作自动执行。你也可以通过\
  \ Xcode 主菜单中的 `Project⇒Build` 选项手动运行它。\n\n![bl.eps](img/bl_fmt.jpeg) **运行（Run）**：在调试器中构建并运行\
  \ App。这是默认操作，当你点击 Xcode 主工具栏上的巨大运行 按钮时触发。\n\n![bl.eps](img/bl_fmt.jpeg) **测试（Test）**：构建并运行第\
  \ 17 章中描述的单元测试功能。如果项目不包含单元测试目标，此操作将什么都不做。\n\n![bl.eps](img/bl_fmt.jpeg) **性能分析（Profile）**：构建、启动第\
  \ 16 章描述的 Instruments 性能分析和测试应用程序，并将 App 加载其中。\n\n![bl.eps](img/bl_fmt.jpeg) **分析（Analyze）**：构建并运行第\
  \ 15 章描述的代码分析器。虽然代码分析可能不需要完整的构建，但 Xcode 仍会运行 Build 操作。\n\n![bl.eps](img/bl_fmt.jpeg)\
  \ **归档（Archive）**：构建并打包准备好分发的 App，将其添加到组织器（Organizer）中的归档列表中（第 10 章引入）。此选项仅通过 Product\
  \ 菜单访问，不包含在工具栏弹出窗口中。\n\n开始使用方案的简单方法是点击并按住 Xcode 工具栏左角的构建 Build 按钮。你在弹出列表中看到四个操作，如图\
  \ 12.11 所示。你可以从 Xcode 主菜单中“产品（Product）”页头标题下方的完整操作列表中进行选择。\n\n你可以在不更改它们的情况下使用这些构建操作，你也可以对它们进行自定义。至少，你应该熟悉这些操作选项，因为它们与\
  \ Xcode 主菜单、构建配置和构建设置的交互方式并非显而易见。\n\n![mac_note.eps](img/mac_note_fmt.jpeg) **注意**\n\
  \n你无法轻松地创建自己的自定义构建操作。标准操作是硬编码在 Xcode 中的，你无法直接扩展或修改此列表。专家开发者可以创建自己的自定义构建脚本并从命令行运行它们，但这将使他们离开\
  \ Xcode 环境。\n\n### 图 12.11\n从工具栏选择构建操作\n![9781118007594-fg1211.tif](img/9781118007594-fg1211_fmt.jpeg)\n\
  \n## 编辑方案\n\n方案定义了如何自定义每个构建操作，以定义在每个操作之前、期间和之后发生了什么。你还可以设置每个操作来构建一组目标。\n\n方案使用 Xcode\
  \ 的方案编辑器/管理器进行管理，它有用于编辑方案和管理方案的独立对话框。你可以使用它创建新方案、编辑现有方案或管理方案集合。简单项目通常需要单个方案，因此编辑选项是最实用的。\n\
  \n你可以通过两种方式访问编辑器/管理器：\n\n![bl.eps](img/bl_fmt.jpeg) Xcode 主 Product 菜单页头在列表底部包含三个方案选项。\n\
  \n![bl.eps](img/bl_fmt.jpeg) 相同的选项出现在 Xcode 主工具栏中目标（平台）下拉菜单底部，如图 12.12 所示。\n\n###\
  \ 图 12.12\n显示方案编辑器的简单方法\n![9781118007594-fg1212.tif](img/9781118007594-fg1212_fmt.jpeg)\n\
  \n编辑器如图 12.13 所示。它是一个简单的对话框，隐藏了一些非常强大的功能。五个标准构建操作显示在左侧，带有一个特殊的 Build 选项（该选项稍后详细介绍）。\n\
  \n你可以在编辑器中执行以下操作：\n\n![bl.eps](img/bl_fmt.jpeg) 点击三角形展开显示前操作脚本、操作选项和后操作脚本。\n\n![bl.eps](img/bl_fmt.jpeg)\
  \ 在右侧的 Info 标签页下更改。\n\n![bl.eps](img/bl_fmt.jpeg) 对于选定的操作，你可以设置额外的选项，包括命令行参数。\n\n\
  ![bl.eps](img/bl_fmt.jpeg) 仅对于 Run 操作，你还可以启用底层的诊断和日志功能。\n\n![bl.eps](img/bl_fmt.jpeg)\
  \ 仅对于 Build 操作，你可以包含其他目标并选择要构建的目标。\n\n![bl.eps](img/bl_fmt.jpeg) 点击 Manage Schemes\
  \ 按钮打开方案管理器。\n\n### 图 12.13\n使用方案编辑器\n![9781118007594-fg1213.tif](img/9781118007594-fg1213_fmt.jpeg)\n\
  \n每个操作都有你可以修改的选项，尽管它们之间存在重叠。这些选项控制构建之后、运行之前和期间以及运行之后。默认情况下，操作之前或之后都不会发生什么，但你可以通过为每个构建操作添加自定义脚本来实现。选项还控制其他设置，包括操作使用的构建配置。\n\
  \n#### 选择构建配置\n此适用于适用于操作。使用下拉菜单选择项目的构建配置之一。如果你创建了自定义构建配置，它会自动出现在列表中。\n\n#### 添加前操作和后操作脚本\n\
  每个构建操作都有六阶段。前三个阶段运行默认构建操作。后三个阶段定义了 Xcode 对构建输出做什么。\n\n1. 如果定义，Xcode 为构建运行一个或多个前操作脚本。\n\
  2. 项目运行默认构建操作：编译、链接、复制并其他处理文件以创建一个或多个目标。\n3. 如果定义，Xcode 为构建运行一个或多个后操作脚本。\n4. 主操作运行一个或多个可选的前操作脚本。\n\
  5. 主操作执行其任务——一个或多个构建文件被加载到调试器、分析器、性能分析、测试等。\n6. 主操作运行一个或多个可选的后操作脚本。\n\n\n\n你可以使用前操作（pre-action）和后操作（post-action）脚本进行设置和清理、消息传递以及触发其他任意事件。脚本可以是\
  \ shell 脚本或 AppleScript 代码。你也可以选择一个发送电子邮件消息的预写脚本。\n\n以下是脚本的一些可能应用场景：\n\n![bl.eps](img/bl_fmt.jpeg)\
  \ 在自动化测试或调试运行结束时播放声音\n\n![bl.eps](img/bl_fmt.jpeg) 将测试或调试期间生成的文件复制到另一台 Mac、上传到服务器或通过电子邮件发送\n\
  \n![bl.eps](img/bl_fmt.jpeg) 启动另一个使用测试运行结果的应用程序\n\n![bl.eps](img/bl_fmt.jpeg) 使用语音合成器报告运行的测试结果\n\
  \n![bl.eps](img/bl_fmt.jpeg) 将其他某些窗口置于桌面的顶\n\n如果你会编写 AppleScript，那么脚本是自动化测试和测试报告的一个极其强大的功能。\n\
  \n![mac_note.eps](img/mac_note_fmt.jpeg) 注意\n\n关于 AppleScript 开发的信息，请参阅配套的《AppleScript\
  \ Developer Reference》章节。\n\n![mac_caution.eps](img/mac_caution_fmt.jpeg) 注意\n\n\
  注意，脚本不应用于基本的构建控制。如果你需要设置构建开关、控制项目包含哪些文件或定义如何处理这些文件，请使用第 13 节描述的“构建阶段”（Build Phases）功能。脚本的设计是为了控制构建之后发生的情况，而不是构建期间发生的情况。\n\
  \n要添加前操作或后操作脚本，请选择一个操作，点击它的展开三角形显示三个可选阶段，然后选择 `Pre-actions`（前操作）或 `Post-actions`（后操作）选项。默认情况下，你会看到一条消息显示未定义操作。点击面板左下角的\
  \ `+`（加）图标，选择 `New Run Script Action`（新建脚本操作）或 `New Send Email Action`（新建电子邮件操作）选项，如图\
  \ 12.14 所示。\n\n对于脚本操作，你可以输入脚本或将现有脚本拖放到脚本面板中。图中的示例代码会播放一种系统声音之一。你可以添加多个独立的脚本。\n\n\
  对于电子邮件操作，请填写电子邮件字段。脚本运行时，会自动发送电子邮件消息。\n\n要删除操作，点击脚本子面板左上角的关闭框，或者通过点击标题栏选择该操作。点击面板左下角的\
  \ `-`（减）图标即可删除它。\n\n图 12.14\n\n添加几个前操作脚本\n\n![9781118007594-fg1214.tif](img/9781118007594-fg1214_fmt.jpeg)\n\
  \n![mac_note.eps](img/mac_note_fmt.jpeg) 注意\n\n为了澄清术语，脚本操作是可选的，可以在五种标准构建操作之前和之后运行，这些操作是固定的。\n\
  \n### 设置参数和环境变量\n\n`Run`（运行）、`Test`（测试）和 `Profile`（分析）操作包含一个 `Arguments`参数）对话框。你可以使用它指定通过标准\
  \ C 语言 `argc/argv` 占位符传递给启动应用程序的参数和环境变量。你的应用程序如何处理这些变量由你决定。点击 `Arguments` 对话框面板中的\
  \ `+`（加）和 `-`（减）图标来添加和删除项目。\n\n![mac_caution.eps](img/mac_caution_fmt.jpeg) 注意\n\
  \n这些不是构建标记或开关。它们被传递给你的应用程序，而不是编译器/链接器。\n\n### 选择调试器\n\n对于 OS X 项目，你可以在此处覆盖在构建配置中选择的调试器。在本文编写时，对于\
  \ iOS 项目，此处显示的唯一调试器选项是 `GDB`。\n\n### 设置 Run 操作选项\n\n`Run` 操作具有一些独特功能。你可以使用 `Executable`\
  \ 选择运行哪个文件。默认情况下，此菜单选择构建创建的 app，但对于更复杂的项目（例如在包装器/主应用程序中测试插件），你可以指定其他文件。\n\n你还可以选择自定义的工作目录。这可以轻松找到应用程序生成并保存到本地文件空间的文件，这对于\
  \ iOS 项目 特别有用。\n\n对于 `Run` 和 `Profile` 过程，你可以使用 `UI Resolution`（UI 分辨率）选项缩放显示。\n\
  \n![mac_caution.eps](img/mac_caution_fmt.jpeg) 注意\n\n此功能仅适用于 OS X 项目。在本文编写时，UI 元素并不总是能够保持一致的缩放。\n\
  \n在 `Arguments` 对话框中，你可以添加一个带有进一步调试符号的可选模块列表。这是一项专门的功能，用于包含可能未构建到你的项目中的模块符号。\n\n\
  `Diagnostics` 对话框启用了特殊的低级诊断选项。你可以控制内存管理、启用各种事件和异常的日志，并允许你的应用程序向调试器发送消息。表 12.2 列出了这些选项。\n\
  \n![/Table 12.2a](img/9781118007594-tb1202a.jpg)\n\n![/Table 12.2b](img/9781118007594-tb1202b.jpg)\n\
  \n### 设置 Profile 操作选项\n\n`Profile` 操作选项与 `Run` 选项非常相似。事实上，在 `Arguments` 列表中，你可以勾选\
  \ `Use Run action's options` 复选框。这里的显著功能是 `Instrument` 选项。它可以让你自动启动。\n\n![mac_crossref.eps](img/crossref_fmt.jpeg)\
  \ 引用\n\n关于分析工具的更多信息，请参见第 16 节。\n\n### 设置 Archive 选项\n\nApp Store 和 Ad Hoc 分发将在后面详细介绍。但作为预览，你通常编辑\
  \ Release 配置。否则，Archive 操作默认使用 Release 配置。\n\n### 使用 Build 操作\n\n`Build` 操作被留在最后，是因为它有一些特殊的功能和独特的编辑页面。\n\
  \n#### 选择常用脚本\n\n你可以按照通常的方法添加前操作和后操作脚本。由于 `Build` 是主操作并包含在其他操作中，在此处添加的任何脚本都会由所有操作运行。\n\
  \n#### 为每个操作选择目标\n\n该编辑器还定义了哪些目标。该编辑器的设计并不直观，因此值得花时间仔细理解。\n\n如图 12.15 所示，目标在左侧垂直列表，标准构建操作在顶部水平。当你勾选某个操作下的框时，它告诉\
  \ Xcode 在运行该操作时构建该目标。\n\n图 12.15\n\n每个操作构建的目标\n\n![9781118007594-fg1215.tif](img/9781118007594-fg1215_fmt.jpeg)\n\
  \n例如，根据中的设置，运行 `Profile` 只构建 `MyMacProject`。运行 `Test` 或 `Archive` 只构建 `AnotherTarget`。运行\
  \ `Analyze` 则构建两者。\n\n当你勾选 `Parallelize Build`（并行构建）框时，Xcode 会并行构建独立目标。这在单机上通常不会节省时间。但如果你有多台\
  \ Mac，你可以跨网络拆分构建过程，这可以节省时间，特别是对于复杂的项目。\n\n`Find Implicit Dependencies` 让 Xcode 自动查找并构建依赖目标。\n\
  \n#### 添加目标\n\n在选择目标之前，你必须先添加它。遗憾的是，在 Xcode 中创建新目标时，它不会自动出现在此页面上。你必须手动添加它，才能强制构建操作构建它。\n\
  \n要添加目标，请使用本章之前介绍的主要构建选项页面。然后你可以通过点击左下角的 `+`（加）图标并从列表中选择新目标，将其添加到此页面，如图 12.16 所示。\n\
  \n\n\n[content]\n\n![9781118007594-fg1216.tif](img/9781118007594-fg1216_fmt.jpeg)\n\
  \n注意，如果你的工作区（workspace）包含多个项目，你可以从工作区中的任何项目中选择一个目标。这是创建复杂多目标构建的最简单方法。\n\n![mac_caution.eps](img/mac_caution_fmt.jpeg)\
  \ 注意\n\n你无法在此处的项目中创建新目标；你只能添加在 Xcode 其他地方已创建的目标。\n\n### 了解隐藏的副作用\n\n当只有一个目标时，启用或禁用某些操作会在\
  \ Xcode 的其他地方产生一些不可预测的影响。对于单个目标，你完全无法禁用 `Run`（运行）和 `Profile`（分析）操作。如果你禁用了 `Test`（测试）和\
  \ `Archive`（归档），Xcode 主菜单中相应的选项将变为灰色，因此你无法选择它们。如果你禁用了 `Analyze`（分析），相应的菜单项不会变灰。\n\
  \n你仍然可以通过之前显示的弹出菜单（参见图 12.11）选择这些操作，但如果你这样做，会收到一条错误消息，提示该操作已被禁用。\n\n由于这些副作用都不太符合逻辑，所以当你的项目只有一个目标时，忽略这一页会更容易。默认设置会启用所有操作。\n\
  \n### 管理方案（schemes）、构建操作和目标（targets）\n\n默认情况下，每个项目都有一个方案。但每当你创建一个新目标时，Xcode 4 都会为它自动创建一个新方案。\n\
  \n这种安排中存在几乎无限制的混淆可能，因为 UI 并没有明确区分方案和目标之间的区别。事实上，新方案和新目标具有相同的名称。\n\n为了理清这种关系，请记住以下几：\n\
  \n![bl.eps](img/bl_fmt.jpeg) 方案菜单选择的是方案，而不是目标。\n\n![bl.eps](img/bl_fmt.jpeg) 在 Xcode\
  \ 4 中，你从不直接构建目标。相反，你运行的是一个标准的构建操作。\n\n![bl.eps](img/bl_fmt.jpeg) 该操作定义了哪些目标被构建。\n\
  \n![bl.eps](img/bl_fmt.jpeg) 一个方案可以为每个操作定义多个不同的目标。\n\n![bl.eps](img/bl_fmt.jpeg)\
  \ 在方案构建多个目标之前，你必须手动将每个目标添加到方案中。\n\n图 12.17 阐明了方案的结构。`Build`（构建）操作是核心，因为其他每个操作都会运行它，并且它选择了每个操作要构建哪些目标。\n\
  \n当你创建一个新目标且 Xcode 为其自动创建一个方案时，它会启用该目标的所有构建操作。这可能符合也不符合你的需求，取决于你如何组织项目。例如，如果你正在创建一个框架并围绕它构建一个测试项目，你更有可能同时构建这两者。\n\
  \n图 12.17\n\n方案的结构。`Build` 操作实际上是其他操作的子程序。它也可以被独立运行。\n\n![9781118007594-fg1217.eps](img/9781118007594-fg1217_fmt.jpeg)\n\
  \n通常，为了避免可能的混淆，关闭自动创建并手动管理方案是有用的。你可以根据需要手动创建方案，或者如果你有多个目标并为每个目标一个方案，可以点击 `Autocreate\
  \ Schemes Now`（立即自动创建方案）按钮。\n\n为特定的构建和测试事件创建并重命名方案也有帮助——例如，“Build All”（构建所有）。按照你的目标为方案命名可能会分散你的注意力，除非在那些相对少见的情况下，你拥有一个包含多个独立目标的项目，并想要单独构建它们。\n\
  \n关键点不在于使用方案有正确和错误的方法，而在于你必须理解目标、方案和自动创建之间的关系，才能有效地处理多个目标。\n\n图 12.18 显示了 Manage\
  \ Schemes（管理方案）对话框。要禁用自动创建，请确保左上角的 `Autocreate schemes`（自动创建方案）框未勾选。要手动创建一个新方案，选择左下角的\
  \ `+`（加号）图标。你可以选择创建新方案或复制现有方案。`-`（减号）图标删除方案。你可以使用齿轮（操作）图标导入和导出方案以便在其他项目中复用。\n\n\
  最后一个选项是容器（container）列，它定义了方案存储在项目还是工作区。将方案存储在项目中的优势是，当你选择容器列右侧的 `Shared`（共享）选项时，使用该项目的人都可以使用该方案。\n\
  \n![mac_caution.eps](img/mac_caution_fmt.jpeg) 注意\n\n共享方案意味着其他人可以在未经许可许可删除或修改它。\n\
  \n图 12.18\n\n### 管理多个方案\n\n![9781118007594-fg1218.tif](img/9781118007594-fg1218_fmt.jpeg)\n\
  \n![mac_note.eps](img/mac_note_fmt.jpeg) 注意\n\n注意，方案菜单为每个方案显示多个目的地（destinations）。目的地是一个平台——或者从技术角度说，是一个\
  \ SDK。例如，一个 iOS 方案可以选择 iOS 设备、iPhone 模拟器或 iPad 模拟器作为目的地。目的地并不是存储或选择在方案中的，你会发现每个方案都提供了相同的平台选择。通常，你选择一个方案，然后选择一个\
  \ SDK，最后选择一个构建操作来构建。\n\n## 总结\n\n第 12 章介绍了构建系统。它概述了工作区、项目、目标、构建操作和方案之间的关系。它介绍了构建选项和构建设置，并说明了这些设置的优先级以及你如何修改它们。接下来，它解释了构建配置（configurations）如何定义项目范围的容器。最后，它研究了构建方案，探讨了如何使用方案和构建操作处理不同的目标组，并解释了这些操作如何以各种方式处理产品（调试等）。\n\
  \n# 第 13 章：针对发布和高级开发自定义构建\n\n本章内容\n\n常见自定义\n\n为 iOS 应用创建 App Store 和 Ad Hoc 构建\n\
  \n为 Mac 应用创建 App Store 构建\n\n高级构建技术\n\n第 12 章介绍了构建系统。本章介绍了一些实用的自定义示例，解释了如何创建和发布\
  \ App Store 和 Ad Hoc 构建，并介绍了与构建阶段（phases）和规则（rules）相关的高级自定义技术——这些是构建序列中定义如何处理单个文件的步骤。\n\
  \n### 常见自定义\n\n基础构建自定义非常常见。在开发应用时，你会发现自己通常需要执行相同的自定义。本节包含了一些实用的自定义。这并不是一份清单，但它包含了开发者经常需要执行但在官方文档中没有强调的任务。随着经验的增加，你可能会用自己的标准自定义来扩展这个列表。\n\
  \n所有这些操作都需要修改第 12 章介绍的项目和/或目标的构建选项和构建设置。它们并不修改构建规则，构建规则将在本章稍后介绍。\n\nOS X 和 iOS 项目在低级编译器设置上略有不同，在各自的\
  \ Info 标签下有明显的特定特定选项，但设置的组织方式是相同的并出现在相同的编辑器中。本节中的大多数自定义适用于两个平台。\n\n\n\n\n\ndebug/test\
  \ 构建是 `Xcode` 中的默认设置。因此，对于 iOS 模拟器测试和 OS X 测试，你不需要进行任何自定义。可选的是，你可以使用 Xcode 主工具栏左上角的弹出菜单选择运行时平台，并根据需要自定义其他构建设置。但默认设置应该能够创建一个可以调试并启动的构建版本。\n\
  \n## 选择基础 SDK (Base SDK)\n\n基础 SDK（Base SDK）是用于为特定版本的 iOS 或 OS X 生成 App 所使用的库和头文件版本。每当任何一个操作系统发布新版本时，Apple\
  \ 都会为开发者生成一个带有更新 SDK 的新版本 `Xcode`。\n\n早期的 `Xcode 3` 并没有智能地处理这一点。当你加载一个旧项目或从网站下载一个项目时，`Xcode`\
  \ 通常会显示一条毫无帮助的“SDK missing”（SDK 缺失）错误信息。由于 `Xcode` 找不到原始 SDK，在你手动选择更新后的 SDK 之前，项目将无法构建。\n\
  \n在 `Xcode 4` 中，项目构建设置包含了新的自动化的“Latest iOS”和“Latest Mac OS X”选项，如图 13.1 所示。如果你使用此设置保存项目并将其加载到稍后版本的\
  \ `Xcode` 中，它们应该会自动选择最新的 SDK，即使该 SDK 与原始项目使用的 SDK 不同。\n\n请注意，用旧版本 `Xcode` 保存的项目在重新加载时仍会显示此错误。（当你尝试加载从开发者博客下载的示例项目时，这是一个常见错误。）\n\
  \n要解决这个问题，请在加载项目后，在构建设置中手动选择最新的 SDK。\n\n![mac_note.eps](img/mac_note_fmt.jpeg) 注意事项\n\
  \n你可能希望在最终发布构建中更改此设置，后文会详细描述。\n\n图 13.1\n\n选择“Latest OS”选项以确保项目始终使用当前的 SDK 加载\n\n\
  ![9781118007594-fg1301.tif](img/9781118007594-fg1301_fmt.jpeg)\n\n## 设置最低支持的操作系统版本\n\
  \n随着 iOS 和 OS X 的每个新版本的发布，都会添加新的函数、类和方法，旧的元素会被移除。并不是所有用户都会升级到每个操作系统的最新版本，特别是那些运行\
  \ OS X 的用户，他们必须为升级付费。旧设备的 iOS 用户通常被限制在旧版本的操作系统上。\n\n创建既兼容旧版本操作系统、又可以在新版本操作系统上运行的产品通常是很有用的。最低支持的操作系统版本被称为“部署目标”（Deployment\
  \ Target）。如果用户尝试在旧版本的操作系统上运行该产品，加载器会显示错误信息。\n\n## 理解 SDK 和部署目标\n\n`Xcode` 新手经常会对基础\
  \ SDK、部署目标与模拟器中显示的 OS 版本之间的关系感到困惑。理解需要理解的关键点是：SDK 定义了出现在产品中的符号和库。部署目标仅仅是加载器用于检查\
  \ OS 兼容性的一个数字。\n\n![mac_caution.eps](img/mac_caution_fmt.jpeg) 警告\n\n不要将部署目标与项目使用的构建目标（targets）混淆。部署目标是一个操作系统版本。构建目标是创建产品的进程和文件规范。为了清晰起见，部署目标本可以标记为“部署操作系统”，但遗憾的是，它没有那样命名。\n\
  \n任何版本的 `Xcode` 提供的 SDK 都包含对旧版本操作系统的支持，直到某个任意限制。例如，iOS 4.3 SDK 可以构建在 iPhone OS 3.0\
  \ 及更高版本上运行的项目，但不能用于 iPhone OS 2.x 和 1.x。\n\n选择 SDK 和部署目标经常重复的规则是：你应该始终选择“Latest\
  \ OS SDK”（如前所述）和最古老的受支持部署目标。在实践中，beta 开发增加了这些要求的复杂性。这里有一个更全面的指南：\n\n![bl.eps](img/bl_fmt.jpeg)\
  \ 为所有开发构建选择 Latest OS SDK。使用 beta SDK 时，你可以使用此选项来实验新功能。\n\n![bl.eps](img/bl_fmt.jpeg)\
  \ 如果你安装了 beta SDK，请选择操作系统的当前发布版本（即当前 beta 版本之前的版本）作为 App Store 发布构建的 Base SDK。\n\
  \n![bl.eps](img/bl_fmt.jpeg) 并不是所有的 beta SDK 都包含之前的一个版本。如果你安装了 beta SDK 并发现缺少当前的公共\
  \ OS SDK，那么对于发布构建，你必须使用或重新安装一个独立的旧版本 `Xcode` 副本。\n\n![bl.eps](img/bl_fmt.jpeg) 在\
  \ beta 版本的操作系统 SDK 升级到最终的 GM（黄金版）种子且 Apple 确认该种子适用于生产代码之前，不要尝试用 beta 版本的操作系统创建最终的生产构建。这通常发生在公开发布之前。\n\
  \n![bl.eps](img/bl_fmt.jpeg) 只有当你的测试人员可以访问其设备对应的等 beta 版本操作系统时，你才能将 beta SDK 用于\
  \ Ad Hoc 测试构建。如果他们没有（通常如此），请选择之前的公共 SDK 作为活动 SDK。你可以给他们访问权限，但需要一些准备工作。详情请参阅本章稍后的“创建\
  \ App Store 和 Ad Hoc 构建”部分。\n\n![bl.eps](img/bl_fmt.jpeg) 模拟器支持多个旧版本的操作系统。你可以使用此选项对代码进行部分向后兼容测试。\n\
  \n![bl.eps](img/bl_fmt.jpeg) 如果你有真设备，也可以在真设备上测试兼容性。如果需要，可以使用 `Xcode's Organizer`\
  \ 将较新的设备降级到旧版本的操作系统。（不要在设备上这样做。）\n\n![bl.eps](img/bl_fmt.jpeg) 将部署目标尽可能设置得低，这为用户提供了最好的使用机会。\n\
  \n支持多个版本的操作系统并非易事，完全测试也很困难。真正的测试是在多个设备上运行代码（每个设备版本不同），或者在单个设备上多次测试并更新安装的操作系统直到测试过每个版本。\n\
  \n![mac_note.eps](img/mac_note_fmt.jpeg) 注意事项\n\n这可能是大量的工作。通常的做法是在支持的最旧和最新的操作系统上测试代码，通过检查确保代码可能在中间版本上运行，并希望没有意外。\n\
  \n图 13.2\n\nSDK 和部署选择的最通用视图。代码必须包含测试以检查用户设备上可能不可用的依赖 OS 的功能。缺失的功能必须通过替代方案和回退机制来实现。\n\
  \n![9781118007594-fg1302.eps](img/9781118007594-fg1302_fmt.jpeg)\n\n多 OS 支持常用的实用技术包括以下：\n\
  \n- 使用 `respondsToSelector:` 方法的变体检查方法是否可用\n- 使用 `NSClassFromString` 检查类是否被支持\n\
  - 从 `UIDevice` 读取支持的系统版本\n- 使用条件编译元素手动选择依赖 OS 代码（此选项通常用于在编译期间检查平台——例如 OS X、iOS 模拟器或\
  \ iOS 设备。不要用它来管理 OS 版本。）\n\n![mac_tip.eps](img/mac_tip.jpeg) 提示\n\n\n\n\n\n如需查看支持多个操作系统的代码示例，请在文档中搜索\
  \ `Using SDK-Based Development`。本章节稍后将介绍更多关于条件编译的知识。\n\n## 设置部署目标\n\n你可以通过三种方式设置部署目标：\n\
  \n1. 在 `Project⇒Info` 标签页中，通过 `Deployment Target` 菜单选择操作系统，如图 13.3 所示。\n2. 在 `Target⇒Summary`\
  \ 标签页中，通过 `Deployment Target` 菜单选择操作系统。\n3. 在项目或目标的构建设置表中选择 `Deployment Target`\
  \ 项。\n\n图 13.3：选择部署目标。此功能出现在三个地方，但对于单目标应用，在这里设置是最简单的方法。\n\n这些选项看起来是可互换的，但它们有细微的区别。第一个选项创建一个项目构建设置。第二个选项创建一个目标构建设置。最后一个选项则可以创建项目或目标设置。\n\
  \n项目设置与目标设置之间的差异以及它们之间的相互作用在第 12 章中介绍过。如果你还不熟悉它们，请在继续之前阅读该章节——这些差异至关重要。\n\n对于单目标的\
  \ iOS 和 OS X 应用，为了简单明了，请使用目标摘要设置。对于具有多个目标的更复杂项目，由你根据项目的背景情况选择最合适的选项。\n\n## 设置基础\
  \ SDK (Base SDK)\n\n设置 `Base SDK` 只有一种方法——它包含在构建设置列表中，如图 13.4 所示。当你加载一个用旧版本 `Xcode`\
  \ 创建的项目并看到“missing Base SDK”错误时，打开构建设置，通过为你的项目和平台选择正确的“Latest OS”选项来修复它，如图所示。\n\n\
  新项目默认应该始终正确选择 `Base SDK`。\n\n图 13.4：使用构建设置设置 Base SDK。\n\n**注意**\n\n请注意，`Xcode`\
  \ 允许你为 OS X 项目选择 iOS SDK，反之亦然。这永远不是一个明智之举。有时你加载一个旧的 Mac 项目时，`Xcode` 会认为它是一个 iOS\
  \ 项目——反之亦然。因此，你可能需要手动纠正。同样注意，你还可以为 `Release`、`Debug` 和自定义配置设置不同的 SDK。极少数情况下，你可能会发现这种实际需求，但这不是一个广泛使用的功能。\n\
  \n## 在构建中包含框架或库\n\n此主题在第 5 章中介绍过，但在这里进行了扩展。要添加框架或库，请遵循以下步骤：\n\n1. 导航到 `Build Phases`\
  \ 标签页。\n2. 打开 `Link Binary With Libraries` 项，如图 13.5 所示。\n3. 点击该项左下角的 `+`（加）按钮。\n\
  4. 从菜单中选择框架或库。\n5. 框架被添加到 `Project navigator` 中。为了保持项目整洁，将其拖入 `Frameworks` 组。\n\n\
  注意，框架列表是按平台过滤的，因此你不能向 OS X 项目添加 iOS 框架（反之亦然）。\n\n你可以通过在列表中上下拖动框架来重新编译顺序，尽管这通常不是必要的。你还可以通过选择\
  \ `Add Other` 选项并导航到框架文件来添加外部非 Apple 框架。使用此选项添加其他开发者创建的框架或库。\n\n从技术上讲，你链接的是一个框架。有两个选项：`Required`（强制）和\
  \ `Optional`（可选）。\n\n`Required` 库必须存在于目标平台上，并在启动时与应用程序或产品的其余一起加载。如果不存在，应用程序将拒绝加载。\n\
  \n`Optional` 库仅在运行时被引用时才会加载。这可以节省内存并创建一个更小的初始产品。但如果库可用，应用程序将停滞或崩溃。你可以使用上一节中引入的技术——对类和方法的测试、条件编译等——来创建能够健壮处理可选库的代码。\n\
  \n通常，你使用此处讨论的框架构建选项来添加带有头文件的预编译二进制文件。但如果你有框架的源代码，可以使用 `Project navigator` 中的 `Add\
  \ Files` 选项将文件添加到项目源中。第三方框架通常以源代码的形式提供，你可以将其添加到项目中的，这比尝试将代码构建并导入作为独立库可能是一个更简单的选项。\n\
  \n如果已完成的项目中不再使用某些框架，请务必始终将它们移除。例如，你可能会添加一个音频或图形框架之一来进行实验，然后决定另一个框架是更好的解决方案，但将两个都留在了构建中。虽然这一点是显而易见的，但它很容易被忽视。\n\
  \n**注意**\n\n如果你习惯了 Xcode 3 中的框架管理，请注意该功能在 Xcode 4 中的处理方式非常不同。链接的框架列表仍然出现在 `Project\
  \ navigator` 中，但不再提供右键点击 `Add Framework` 选项。\n\n**提示**\n\n使用不同的技术添加 Apple 框架可能会更简单快捷。打开\
  \ `Frameworks` 组，右键点击任何现有框架，并选择 `Show in Finder` 查看 Apple 框架的默认列表。每个框架都在一个文件夹中。要添加框架，从\
  \ `Finder` 拖动它的文件夹并掉到 `Frameworks` 组。取消勾选 `Copy items` 选项。点击 Finish。该框架被添加到你的项目中，它也会出现在\
  \ `Link Binary with Libraries` 中。（不要忘记添加 `#import` 指令以包含头文件！）\n\n## 选择编译器\n\n并不容易看出\
  \ `Xcode 4` 包含了两个用于 C 系语言的编译器：旧的 `GCC`（GNU 集合）和较新的 `LLVM`（低级虚拟机）编译器。每个编译器都有一个调试器。\n\
  \n这些编译器之间在速度、可靠性和调试器集成方面存在显著差异。`LLVM` 编译器比 `GCC` 更高效、更快速。相应的调试器与源代码的结合更紧密，并且能产生更信息丰富的错误消息。但\
  \ `GCC` 对其他语言有更好的可选支持，有时对于跨平台项目来说可能是更好的选择。\n\n要选择编译器，请从项目构建设置中的 `Compiler Version`\
  \ 菜单中选择三个选项之一。你的选项有：\n\n* `GCC 4.2`：使用标准的 `GCC` 编译器。\n* `LLVM GCC 4.2`：这是一个混合选项，使用旧的\
  \ `GCC` 前端/解析器和新的 `LLVM` 编译器。它提供了更快的编译速度，特别是对于较大的项目。\n* `LLVM Compiler 2.0`：这是一个实验性的选项。它选择了新的\
  \ `Clang` 前端/解析器和 `LLVM` 编译器。如果你习惯了 `GCC`，你会发现选择此选项产生了新的、陌生的但更全面更有用的错误和警告。\n\n\n\
  \n\n\n当一个项目有不同的目标时，可以为每个目标选择不同的编译器。虽然 Xcode 允许你这样做，但这并不是一个常见的需求。请注意，当你切换编译器时，`Build\
  \ Settings`（构建设置）选项卡下显示的一些开关和选项也会发生变化。由于你通常不需要对默认设置进行微调，你可以忽略这些设置，但值得注意的是，LLVM 的选项选择稍微少一些。\n\
  \n![mac_crossref.eps](img/mac_crossref_fmt.jpeg) 交叉引用\n\n关于编译技术的更多信息，请参阅附录 C。\n\n\
  ## 控制警告\n\n你可以使用完整构建设置列表底部的 `Warnings`（警告）部分来启用和禁用特定的警告信息，如图 13.6 所示。\n\n主开关名称为\
  \ `Inhibit All Warnings`（抑制所有警告）。当启用此项时，编译器将忽略其他警告开关并无例外地抑制所有警告。这是一个危险的选项。\n\n其他大多数选项在不同程度上都是自证其明的。例如，未使用的变量和未使用的值默认会产生警告。未使用的函数则不会。值得探索该列表，以微调选项以匹配你的编程风格。\n\
  \n图 13.6\n\n### 选择警告信息\n\n![9781118007594-fg1306.tif](img/9781118007594-fg1306_fmt.jpeg)\n\
  \n### 禁用 iOS PNG 压缩\n\n默认情况下，当你向项目中包含 PNG（便式网络图形）图像文件时，构建过程会将这些文件通过 PNG 压缩阶段。\n\n\
  遗憾的是，Xcode 的 PNG 压缩并不高效，并且可能会添加意外的透明度伪影。你可以通过 Adobe Photoshop 或 Fireworks 等编辑器手动压缩文件来减小文件大小。然后你可以告诉\
  \ Xcode 禁用其压缩并原样使用这些文件。（如果不这样做，你可能会发现它会让预压缩的文件变得更大。）\n\n压缩设置标记为 `Compress PNG Files`（压缩\
  \ PNG 文件）。你可以在 `Target Build Settings` 中 `Packaging`（打包）标题的顶部找到它。\n\n## 在发布前更改应用名称\n\
  \n更改应用程序的最终生产标题通常很有用，以便自定义出现在 iOS App 图标下方或 OS X Dock 栏上方的名称字符串。\n\n没有简单的方法可以更改项目的文件名或整个项目名称。但你不需要这样做，因为你可以使用\
  \ `Build Settings` 中的 `Product Name`（产品名称）设置独立设置名称。你可以在 `Packaging` 头部下方的中间找到它。\n\
  \n默认值是一个名为 `$(TARGET_NAME)` 的宏。你可能认为这意味着目标名称是从 Target 名称复制的。这在某种程度上是正确的。但直接编辑名称更为简单，如图\
  \ 13.7 所示。你可以对产品名称双击两次进行就地编辑。或者你也可以双击显示图中所示的浮动编辑框。\n\n图 13.7\n\n编辑产品名称。此设置将更改出现在\
  \ Dock 栏和 Springboard 中应用下方/上方的显示名称。\n\n![9781118007594-fg1307.tif](img/9781118007594-fg1307_fmt.jpeg)\n\
  \n![mac_tip.eps](img/mac_tip_fmt.jpeg) 提示\n\n保持 iOS 应用名称简短是一个好主意，因为 Springboard\
  \ 会用省略号（…）截断较长的名称。十个字符是一个现实的极大值，但你偶尔可以挤进 11 个字符。你可以在模拟器中测试截断情况。\n\n如果你想编辑目标名称并强制产品名称遵循它怎么办？你可以通过双击设置左侧侧边栏区域图标旁边的名称来编辑目标名称。如果你将产品名称设为默认宏，它应该随之变动。\n\
  \n遗憾的是，它并非如此。产品名称字段仅在项目加载时才会复制到目标名称。因此，要刷新名称，你必须关闭项目并重新加载。\n\n这是一个明显的 bug。它在未来的版本中可能会修复，也可能不会。\n\
  \n## 创建 App Store 和 Ad Hoc 构建\n\n现在你已经熟悉了构建系统和构建自定义，可以开始为 App Store 创建构建版本了。\n\n\
  Xcode 4 包含了一个简化的构建和打包过程，这使得将应用程序提交到 App Store 以及创建和分发测试的 beta 版本变得更容易。该过程比 Xcode\
  \ 3 时要简单，但仍需要一些组装工作。\n\n第一次提交应用程序时，请留出一两天时间来处理每个阶段。提交过程并不简单。随着经验的增加它会变得更容易，但保证首次上传成功的最佳方法是仔细且有条地处理各个阶段。\n\
  \n![mac_caution.eps](img/mac_caution_fmt.jpeg) 注意\n\n在创建 App Store 或 Ad Hoc 之前，你必须完成第\
  \ 11 章引入的配置流程。如果你还没有这样做，请现在就做；这是本节的决条件。\n\n![mac_caution.eps](img/mac_caution_fmt.jpeg)\
  \ 注意\n\n在开始上传付费应用程序之前，你必须向 iTunes Connect 提供你的银行账户和税务详情。在提交应用程序之前，尽早完成此过程。国际税法不在本书的涵盖范围内，但请注意你可能需要为某些地区提供额外的文件；否则，收入将在源地缴税，尽管可能追回扣税。\n\
  \n### 为 App Store 构建并打包 iOS 项目\n\n调试和测试应用程序只是 App Store 的第一阶段。要销售它，必须对其打包并上传，这需要大量工作。\n\
  \n打包和上传过程分为六步：\n\n1. 开始准备营销和支持材料。从技术上讲这不是构建过程的一部分，但你必须在最终构建之前完成它。\n2. 创建一个新的 Release\
  \ 配置。\n3. 在新配置中自定义构建选项。\n4. 构建项目。\n5. 将营销材料上传到 iTunes Connect，并创建应用程序记录。\n6. 验证项目存档以检查基本错误，并将其提交到\
  \ iTunes Connect。\n\n### 准备营销和支持材料\n\n你需要准备：\n\n![bl.eps](img/bl_fmt.jpeg) 标准素材：列表请参见表\
  \ 13.1。准备素材不是一项简单的工作；即使你有良好的设计技巧且没有尝试复杂的设计，创建每个文件也需要半天到一天——专业开发者通常会将这项工作外包给图形设计师。（列表包含了必要的素材。你的项目可能还会使用图标、精灵等单独的素材文件，但如果已经完成，应该已经包含了。）\n\
  \n![bl.eps](img/bl_fmt.jpeg) SKU 号（你选择的任意产品代码）：每个应用程序必须有一个唯一的 SKU。\n\n![bl.eps](img/bl_fmt.jpeg)\
  \ 营销文本：最多可以包含 4000 字的精彩文字，用于说服 iTunes 客户他们需要你的应用程序。\n\n![bl.eps](img/bl_fmt.jpeg)\
  \ 搜索关键词列表，最多 100 个字符：当用户搜索这些词之一时，你的应用程序会出现在结果中。\n\n![mac_tip.eps](img/mac_tip_fmt.jpeg)\
  \ 提示\n\n如果你想不出一个看起来足够专业的 SKU，可以使用你的名字或公司名称缩写作为前缀，后面跟反转的日期。\n\n\n\n\n\n虽然这个列表看起来很长，但许多图像是可选的，因此你可以选择更精简的内容。对于\
  \ iPad，有两个默认图像而不是一个：`Default-Portrait.png` 和 `Default-Landscape.png`。可选地，你可以添加更多默认图像以适应\
  \ `LandscapeLeft`、`LandscapeRight` 和 `PortraitUpsideDown` 范围：`Default-LandscapeLeft.png`\
  \ 等。默认屏幕大小为 1024 x 768，当状态栏可见时，你可能需要从一个边缘删除 20 像素。\n\n除了截图外，所有文件都应添加到 `Project`\
  \ 导航器中的应用程序中。为了方便，请将它们添加到 `Resources` 组。\n\n![mac_caution.eps](img/mac_caution_fmt.jpeg)\
  \ 注意\n\n如果在验证过程中遇到 `Xcode 4` 无法识别 PNG 文件的问题（见本节后文），尝试使用 `Generic RGB` 颜色配置保存。默认是\
  \ `sRGB`，`Xcode 4` 有时不接受此配置的文件。\n\n# 创建新的构建配置\n\nApp Store 发布版本的构建设置通常使用默认 `Release`\
  \ 构建配置的修改版本。你可以通过两种方式创建它：\n\n![bl.eps](img/bl_fmt.jpeg) 原地修改现有的 `Release` 配置。\n\n\
  ![bl.eps](img/bl_fmt.jpeg) 创建一个副本，并将其用于最终构建。\n\n原地编辑的优点是需要进行的工作较少。你可以编辑现有的 `Release`\
  \ 配置设置，然后就可以构建了。\n\n创建副本的优点是，如果你创建了更多配置——例如用于 beta 分发——可以使用默认的 `Release` 配置作为标准的起始点。你还可以将配置与项目一起保存，并给它一个有用的名称。当你准备好发布项目的更新版本时，可以原样重用自定义的\
  \ App Store 配置。\n\n此示例演示了如何使用单独的文件。按照以下步骤操作：\n\n1. 选择 `Project` 和 `Info` 选项卡。\n\
  2. 如果 `Configurations` 标题未打开，点击显示三角形打开它。\n3. 点击子窗格底部的 `+`（加号）图标。\n4. 从浮动菜单中选择 `Duplicate\
  \ “Release” Configuration` 选项，如图 13.8 所示。\n\n这将创建一个名为 `Release copy` 的新配置。\n\n5.\
  \ 双击名称，并输入修改后的名称，例如 `App Store`。\n\n# 自定义构建设置和选项\n\n准备构建是一个两个阶段的过程。你可以按任何顺序执行这些步骤：\n\
  \n![bl.eps](img/bl_fmt.jpeg) 自定义构建设置。\n\n![bl.eps](img/bl_fmt.jpeg) 自定义其他构建选项。\n\
  \n图 13.8\n\n通过复制默认的 `Release` 配置为 App Store 构建创建新配置\n\n![9781118007594-fg1308.tif](img/9781118007594-fg1308_fmt.jpeg)\n\
  \n## 自定义构建设置\n\n选择应用目标（target），选择 `Build Settings` 选项卡，选择 `Combined` 视图，并按照以下列表操作。\n\
  \n大多数项目项特定于配置，因此如果某个设置显示 `<multiple values>`，点击其显示三角形并更改 `App Store` 配置旁边的值。\n\n\
  ![bl.eps](img/bl_fmt.jpeg) `Base SDK`：这在开发期间应设置为最新的公共 OS 版本。尽管如此，仍要双击检查。\n\n![bl.eps](img/bl_fmt.jpeg)\
  \ `Validate Built Product`：选择 `Yes`。\n\n![bl.eps](img/bl_fmt.jpeg) `Code Signing\
  \ Identity`：选择一个有效的分发配置文件。你可以使用 `Automatic Profile Selector` 标题下的默认 `iPhone Distribution`，如图\
  \ 13.9 所示。但要非常小心：如果你有多个分发配置，它可能会选择错误的一个或默认为最后使用的。双击检查它是否真的选择了正确的配置，，通常是你命名为 `Distribution`\
  \ 的那一个。\n\n![bl.eps](img/bl_fmt.jpeg) `Strip Debug Symbols During Copy`：选择 `Yes`。\n\
  \n![bl.eps](img/bl_fmt.jpeg) `Targeted Device Family`：选择你的应用支持的设备。\n\n![bl.eps](img/bl_fmt.jpeg)\
  \ `iOS Deployment Target`：将其设置为你的应用支持的最旧 iOS 版本，如本章之前讨论的那样。\n\n![bl.eps](img/bl_fmt.jpeg)\
  \ `Product name`：将其设置为最终的生产名称字符串，如前所述。\n\n图 13.9\n\n为新的 App Store 配置在构建设置中选择分发配置\n\
  \n![9781118007594-fg1309.tif](img/9781118007594-fg1309_fmt.jpeg)\n\n![mac_note.eps](img/mac_note_fmt.jpeg)\
  \ 注意\n\n你也可以在 `Levels` 视图中进行这些更改。`Combined` 视图更简单且不杂乱，特别是较小的显示器上。\n\n## 自定义其他构建选项\n\
  \n自定义其他选项是一个两个步骤的过程。选择 `Summary` 选项卡并进行以下更改：\n\n![bl.eps](img/bl_fmt.jpeg) `Version`：将其设置为应用的当前版本号。\n\
  \n![bl.eps](img/bl_fmt.jpeg) `Devices`：忽略此项。\n\n![bl.eps](img/bl_fmt.jpeg) `Main\
  \ Interface`：它从 `Targeted Device Family` 获取。\n\n![bl.eps](img/bl_fmt.jpeg) `Supported\
  \ Orientations`：这些定义了允许启动的方向。在开发期间需要设置这些。\n\n![bl.eps](img/bl_fmt.jpeg) `App icons`：右击每个图标，如图\
  \ 13.10 所示，表 13.1。\n\n![bl.eps](img/bl_fmt.jpeg) `Launch Images`：如果你的应用是通用的或仅限 iPad，按相同的方式添加图像。\n\
  \n![bl.eps](img/bl_fmt.jpeg) `Other Images`：如果你在开发期间定义了应用图标和启动图像，则不需要再次定义它们。\n\n\
  ![bl.eps](img/bl_fmt.jpeg) `Custom iOS Properties`：通常保持不变；Summary 设置会更改它们，且默认设置是正确的。\n\
  \n有时你可能想要添加特殊功能。表 13.2 列出了最有用的键的短列表。有关如何添加、编辑和选择这些功能的更多信息，请参阅附录 B。\n\n![/Table 13.2](img/9781118007594-tb1302.jpg)\n\
  \n# 构建项目\n\n你已经（但还不完全）准备好构建项目了。在 Xcode 3 中，你以通常的方式构建项目，在 Finder 中手动归档，并手动将其上传到 iTunes\
  \ Connect。\n\n在 Xcode 4 中，`Archive` 构建操作以及验证/提交功能自动化了这个过程。你可以从 Xcode 完成所有操作，无需在\
  \ Finder 中查找应用程序包或使用外部上传器。\n\n默认情况下，`Archive` 使用 `Release` 配置。你需要在构建之前更改它。按照以下步骤操作：\n\
  \n![mac_caution.eps](img/mac_caution_fmt.jpeg) 注意\n\n如果你忘记这一步，产品将被分配开发证书。可能会发生其他非常糟糕的事情，而且你的存档是无效的。\n\
  \n1. 从 Xcode 主菜单选择 `Product⇒Edit Scheme`。\n2. 选择左列中的 `Archive` 操作。\n3. 从 `Build\
  \ Configuration` 菜单中选择 `App Store` 配置，如图 13.11 所示。\n4. 勾选 `Reveal Archive in Organizer`\
  \ 选项。\n5. 从对话框顶部的菜单选择 `iOS Device` 作为 `Destination`。\n6. 确保 `Breakpoints` 按钮未取消选择。\n\
  \n图 13.11\n\n\n\n\n\n确保在构建归档/上传时，你新的 App Store 配置设置已生效。\n\n![9781118007594-fg1311.tif](img/9781118007594-fg1311_fmt.jpeg)\n\
  \n### 7. 从 Xcode 主菜单选择 Product（产品）⇒Archive（归档）。\n\n这将运行 `Archive` 操作从头构建你的应用，这可能需要一些时间。\n\
  \n最后，会出现来自 `Organizer` 的 `Archives` 窗口，如图 13.12 所示。但你现在还没有提交应用程序；首先，你必须在 iTunes\
  \ Connect 上填写“文工作”，以便 App Store 为你的应用做好准备。\n\n#### 图 13.12\n\n`Organizer` 中出现的 `Archive`\
  \ 是一个封装好的应用，可以提交到 App Store，但只有在你填写了某些在线“文工作”之后就可以。\n\n![9781118007594-fg1312.tif](img/9781118007594-fg1312_fmt.jpeg)\n\
  \n### 上传营销和支持材料\n\niTunes Connect 的工作方式几乎与你预期的完全相反。不是先上传二进制文件然后为其添加营销文本和图像，而是先上传营销材料来创建一个应用程序记录。然后你上传归档的应用。它将成为与记录关联的二进制文件。\n\
  \n![mac_note.eps](img/mac_note_fmt.jpeg) 注意\n\niTunes Connect 的工作方式看起来可能违背直觉，但它有其目的。如果你的二进制文件被拒绝，应用程序记录仍然保留，当你重新提交时无需重新输入它。同样，当你将应用升级到新版本时，你可以重用第一次提交应用时输入的详细信息。\n\
  \n按照以下步骤上传你的应用：\n\n1. 登录 iOS 开发者网站（Portal），从屏幕右上角的列表中选择 `iTunes Connect`。（你也可以直接通过\
  \ [itunesconnect.apple.com](http://itunesconnect.apple.com) 访问 `iTunes Connect`）。\n\
  2. 选择 `Manage Your Apps`（管理你的应用）。\n3. 点击左上角的 `Add New App`（添加新应用）。\n4. 逐步完成“文工作”，第一页如图\
  \ 13.13 所示，通过填写字段、上传素材、回答有关加密技术和年龄分级的问题，以及复制粘贴你的营销文本。大部分选项都是直观的。最可能引起困惑来源是 `Bundle\
  \ ID` 选项。\n5. 选择嵌入你的发布描述（distribution profile）中的 ID。如果你只有一个 `App ID`，请使用它。如果你有多个\
  \ `IDs`，请选择你在创建证书时使用的最后一个。\n\n如果你遵循了第 11 章中的所有步骤，你应该已经有一个应用程序记录。\n\n#### 图 13.13\n\
  \n这是“文工作”的第一页。注意 `Bundle ID` 菜单。\n\n![9781118007594-fg1313.tif](img/9781118007594-fg1313_fmt.jpeg)\n\
  \n![mac_crossref.eps](img/mac_crossref_fmt.jpeg) 交叉引用\n\n参见第 11 章以关于 `App IDs` 的提示。\n\
  \n![mac_note.eps](img/mac_note_fmt.jpeg) 注意\n\n你可以重复此过程在单次会话中创建多个应用记录。事实上，你可以创建任意数量的记录。在每个应用上传二进制文件并且记录和二进制文件通过审核之前，它们在\
  \ App Store 上是不可见的。\n\n### 将应用提交到 iTunes Connect\n\n最终，你的应用程序记录就完成了。在写本文时，最后的屏幕提示你使用一个名为\
  \ `Application Loader` 的应用程序来提交二进制文件。无论 Apple 未来是否删除此屏幕，你都可以忽略它，因为 `Xcode 4` 包含了了自己的上传和封装工具。\n\
  \n提交是另一个两个阶段的过程。第一步是应用验证；它是可选的但建议进行。第二步是提交/上传。\n\n#### 验证应用\n\n验证过程的内部细节是秘密的，但我们知道它会检查基本错误，包括缺少素材、无效的包和束设置以及错误的配置（provisioning）。成功的验证并不保证你的应用将获得销售许可，但它会标记出那些会导致\
  \ Apple 拒绝它的最明显的错误。\n\n在 `Organizer` 中，选择你的归档（如果尚未选中），并点击窗口右上角的 `Validate`（验证）按钮。你会被要求使用开发者名称和密码登录。接下来，你将看到图\
  \ 13.14 所示的对话框。\n\n`Application` 菜单显示任何你尚未用二进制文件完成的应用程序记录。通常，这里只有一个项目——你创建的最后一个记录。\n\
  \n`Identity` 菜单应该与你在构建应用之前在构建设置中选择的发布身份匹配，如本节较早所述。\n\n#### 图 13.14\n\n在上传前验证应用\n\
  \n![9781118007594-fg1314.tif](img/9781118007594-fg1314_fmt.jpeg)\n\n![mac_tip.eps](img/mac_tip_fmt.jpeg)\
  \ 提示\n\n该菜单与构建设置中选择身份时使用的菜单相同。确保你在两个地方都选择了同一个项目。\n\n点击 `Next`（下一步）。`Xcode` 封装应用并运行验证。如果验证失败，它会列出错误，如图\
  \ 13.15 所示。\n\n#### 图 13.15\n\n验证框列出一个或多个问题\n\n![9781118007594-fg1315.tif](img/9781118007594-fg1315_fmt.jpeg)\n\
  \n要修复验证错误，请遵循以下步骤：\n\n1. 删除归档，除非你想保留它。\n2. 修复缺失的项目。\n3. 从主菜单选择 `Product⇒Archive`\
  \ 创建另一个归档。\n4. 验证新的归档。\n\n#### 图 13.16\n\n验证成功意味着你可以准备好提交应用\n\n![9781118007594-fg1316.tif](img/9781118007594-fg1316_fmt.jpeg)\n\
  \n![mac_caution.eps](img/mac_caution.jpeg) 注意\n\n验证过程并不完全稳健，有时应用会无故失败。当 iTunes Connect\
  \ 出问题时，你会看到晦涩的错误信息，例如“无法提取数据”。明显的应用问题通常会被准确标记。如果你在提交后发现二进制文件有问题，选择应用，选择二进制详情，并点击右上角的\
  \ `Reject This Binary`（拒绝此二进制文件）按钮。然后你就可以重复提交过程。\n\n### 提交应用\n\n要提交应用，点击 Organizer\
  \ 右上角的 `Submit`（提交）按钮。提交过程与验证非常相似；你会被要求登录，然后应用应用。不是验证通过，而是包被上传，如图 13.17 所示。\n\n\
  #### 图 13.17\n\n成功的提交\n\n![9781118007594-fg1317.tif](img/9781118007594-fg1317_fmt.jpeg)\n\
  \n事实上，提交包含了另一次验证。但在提交之前单独验证会更快。\n\n提交后，应用会被加入审核队列。iTunes connect 显示状态消息——`Waiting\
  \ For Review`（等待审核）和 `In Review`（审核中），让你知道应用在审核流程中的位置。审核完成后，你会收到一封通知接受或拒绝的电子邮件。\n\
  \n#### 提交后删除或隐藏应用\n\n如果你在提交后发现二进制文件有问题，选择该应用，选择二进制详情，并点击右上角的 `Reject This Binary`按钮。然后你可以使用新的二进制文件重复提交过程。注意，在二进制文件等待审核时，无法删除应用程序提交记录。\n\
  \n\n\n\n\n如果你想在 App 被接受销售后删除它，这是一个复杂的流程。通常将 App 从销售下架比完全删除它更容易、更快速。选择该 App，点击 `Rights\
  \ and Pricing`（权限与定价），选择 `Specific Stores`（特定商店）链接，并点击 Rights and Territories（权限地区）列表右上角的\
  \ `Deselect All`（取消选择）按钮。这将它的提交记录保留在 iTunes Connect 中，以便你日后用新版本进行更新，但会对 iTunes 上的买家隐藏。\n\
  \n# 创建并分发 iOS Ad Hoc 构建\n\n可以与 Beta 测试人员共享的 Ad Hoc 构建过程与 App Store 构建类似。但它们存在一些差异。在创建\
  \ Ad Hoc 构建之前，你必须创建一个合适的发布配置。\n\n## 创建并安装 Ad Hoc 描述文件\n\n有关配置（provisioning）的更多细节，请参阅第\
  \ 11 章。图 13.18 显示了 Ad Hoc 配置的设置。记住你必须执行以下操作：\n\n图 13.18：创建 Ad Hoc 配置\n![9781118007594-fg1318.tif](img/9781118007594-fg1318_fmt.jpeg)\n\
  \n1. 从每个用户处获取每个支持设备的 UDID，并将其添加到你的设备列表中。\n2. 在列表中选择测试人员将使用的设备。用户只能在列表中的设备上运行 App。\n\
  3. 为配置选择一个有效的 App ID 或创建一个新的，并记录下来以备后用。\n4. 从 Finder 中拖拽新配置并将其掉到 Organizer（组织器）中\
  \ Devices 窗口左上角的 `Provisioning Profiles`（描述文件）项目上进行安装。\n\n新配置将具有 `.mobileprovision`\
  \ 文件扩展名。\n\n![mac_tip.eps](img/mac_tip_fmt.jpeg) 提示\n\n创建新配置后，不要忘记刷新门户网站上的页面以将其状态从\
  \ Pending（等待中）更新为 Active（激活）。\n\n## 创建 Ad Hoc 构建\n\n一旦拥有 Ad Hoc 配置，请使用以下步骤构建你的 Beta\
  \ 版 App：\n\n1. 基于默认的 `Release` 配置创建一个构建配置，并给它起一个新名称，例如 `Ad Hoc`。\n2. 在构建设置中使用新的\
  \ Ad Hoc 发布配置签名 App。如果你使用配置自动选择器，请记住双检查工作是否正常，以及你正在使用 `Ad Hoc` 配置签名构建。根据需要修改其他构建设置。\n\
  3. 在 `Archive Build Action`（存档操作）中选择 `Ad Hoc Release` 配置。\n4. 在平台弹出菜单中选择 `iOS Device`\
  \ ，并通过 `Product⇒Archive`（产品⇒存档）构建存档。\n5. 在 Organizer 中，使用 `Share`（共享）按钮创建一个带有 `.ipa`\
  \ 后缀的可共享 App 包。从 `Identity` 菜单中选择 `Ad Hoc` 配置，并将打包的 App 保存到方便的位置。\n6. 将文件电子邮件给测试人员，或将其上传到网站并向他们发送下载链接。\n\
  7. 测试人员使用 iTunes 安装并运行 App。\n8. 如果 App 是针对操作系统的 Beta 版本，测试人员在测试 App 之前能够在他们的设备上安装该版本。\n\
  \n### 使用 iTunes 安装 Ad Hoc App\n\n要安装 App，测试人员打开 iTunes 并将文件拖到左上角的 `Library`（库），如图\
  \ 13.19 所示。通过 `Sync Apps`（同步 App）选项同步设备——测试人员可能需要手动在 App 列表中勾选 App——即可安装 App 并自动安装嵌入的发布配置。\n\
  \n图 13.19：使用 iTunes 安装 Ad Hoc App\n![9781118007594-fg1319.tif](img/9781118007594-fg1319_fmt.jpeg)\n\
  \n![mac_note.eps](img/mac_note_fmt.jpeg) 备注\n\n在 Xcode 的早期版本中，除非项目使用 `Entitlements.plist`\
  \ 文件构建，并且向测试人员随 App 一起描述文件，否则 Ad Hoc 发布将无法工作。这些步骤不再是必要的，因为打包过程嵌入了有效的配置，并且权限（entitlements）会自动管理。\n\
  \n![mac_note.eps](img/mac_note_fmt.jpeg) 备注\n\n如果你为 iOS 或 OS X 的 Beta 版本开发 App，没有法律途径向未注册的开发者测试人员提供\
  \ OS 更新的 Beta 副本。网上讨论了非法方法，但它们超出了本书的讨论范围。\n\n# 使用空中下载 (OTA) 分发\n\n在 Xcode 3 中，企业级开发者可以选择创建一个包，用户通过点击\
  \ Safari 中的网页链接即可直接在设备上下载并安装。这被称为空中下载 (OTA) 分发，它为测试人员提供了更流畅的体验。\n\nOTA 分发使用了 Safari\
  \ 内置的功能（仅限 Safari），该功能允许浏览器验证描述文件并在任何运行 iOS 4.0 及更高版本的 iOS 设备上安装 App。\n\n尽管它是作为一种企业工具引入的，但所有开发者都可以使用此功能，但创建\
  \ OTA App 的支持文件的打包过程相当复杂。除了 `ipa` 文件外，链接还需要一些基础 HTML 和一个包含 App 详情的辅助 `plist` 清单文件。创建\
  \ HTML 很容易的，但创建清单 `plist` 则更具挑战性。\n\nXcode 4 不支持标准开发者使用此功能，但有各种商业变通方案。例如，`diawi`（[www.diawi.com](http://www.diawi.com)）是一个允许开发者将构建版本上传到其网站并发送链接给测试人员的广告支持。[TestFlight](http://testflight.com)（如图\
  \ 13.20 所示）是类似的替代方案。这些选项让 OTA 分发变得像拖拽一样简单。\n\n图 13.20：TestFlight：创建 OTA 的一种方式\n\
  ![9781118007594-fg1320.tif](img/9781118007594-fg1320_fmt.jpeg)\n\n不想将文件委托给第三方的开发者可以使用\
  \ BetaBuilder（[www.diawi.com/category/ios-abuilder/](http://www.diawi.com/category/ios-abuilder/)）从自己的服务器创建自定义\
  \ HTML 和清单文件。BetaBuilder 加载 `ipa` 文件并生成与特定下载 URL 关联。然后你可以将文件上传到服务器并将 URL 发给测试人员。\n\
  \n注意，尽管官方 OTA 不需要注册设备，但标准开发者必须注册设备并将其加入 Ad Hoc 配置。\n\n![mac_caution.eps](img/mac_caution_fmt.jpeg)\
  \ 警告\n\n非企业 OTA 不官方支持。该技术被借用于非企业用途，Apple 可能会撤回它。\n\n# 创建 Mac App Store 提交\n\nMac\
  \ 提交与 iOS 提交类似，但更为简单。在 iTunes Connect 上创建 App 记录，填写信息以创建一个二进制槽。然后你自定义 App 的设置，将其构建为存档，打包并上传二进制文件。\n\
  \n目前没有设备注册或支持限制设备的 Ad Hoc 分发。（未来可能会变化。）\n\n## 查找 iTunes Connect\n\n在写作期间，Mac Dev\
  \ Center 首页没有直接指向 iTunes Connect 的链接。要打开 iTunes Connect，选择首页右上角的 `Get Your Mac Apps\
  \ Ready for the Mac App Store` 链接，然后点击 `Set up Your iTunes Connect Account` 段落底部的\
  \ `Log in to iTunes Connect` 链接，如图 13.21 所示。\n\n## 创建营销和支持材料\n\nMac 提交的信息与 iOS 提交非常相似。宣传截图的分辨率必须为\
  \ 1280 x 800 或 1440 x 900，格式为 RGB 色空间的 `.jpeg`、`.jpg`、`.tiff` 或 `.png`，分辨率为 72dpi\
  \ 或更高。实际上这意味着你可以运行 App，将 Mac 的显示分辨率设置为所需的尺寸，并使用 `/Applications/Utilities` 中的 `Grab`\
  \ 实用程序将画面捕捉为 `.tiff` 文件。\n\n\n\n\n插图不必是未经编辑的屏幕截图。你也可以创建自定义的宣传图，为你的应用添加说明或突出显示重要功能。这在准则的边缘，但如果插图不过于生硬且具有推销色彩，它很有可能被接受。\n\
  \n图 13.21\n\nMac Dev Center 首页没有直接指向 iTune Connect 的链接；你必须通过这个中间页面。\n\n![9781118007594-fg1321.tif](img/9781118007594-fg1321_fmt.jpeg)\n\
  \n## 创建 App ID 和管理证书\n\nOS X 应用不支持通配符/套件 ID，因此你必须按照第 11 章描述的步骤为每个应用创建一个新的 ID。\n\n\
  App ID 并没有内置在 Mac App 软件证书或 Mac 安装包证书中，因此你可以为每个应用重用相同的证书。\n\n![mac_note.eps](img/mac_note_fmt.jpeg)\
  \ 注意事项\n\n当用户从商店购买应用时，iTunes 会生成一个收据文件将其锁定到一台特定的 Mac 上。你的应用可以验证此收据以防止盗版。这需要额外的代码；它不是自动的。验证不是构建过程的一部分，但在开发期间添加并测试它是个好主意。有关详情和示例代码，请参阅文档中的“验证\
  \ App Store 收据”。\n\n## 为 App Store 定制构建\n\n你必须执行以下操作：\n\n![bl.eps](img/bl_fmt.jpeg)\
  \ 定制构建设置。\n\n![bl.eps](img/bl_fmt.jpeg) 修改构建选项：摘要（Summary）和信息（Info）。\n\n但你不需要执行这些：\n\
  \n![bl.eps](img/bl_fmt.jpeg) 创建新的配置。默认的 Release 配置可以直接使用。\n\n![bl.eps](img/bl_fmt.jpeg)\
  \ 编辑默认方案（Scheme）。在 Archive 动作的默认设置中无需选择更新后的配置。\n\n### 定制构建设置\n\n点击项目导航器顶部的项目，选择目标，点击\
  \ Build Settings 选项卡打开设置编辑器。这些是关键设置：\n\n![bl.eps](img/bl_fmt.jpeg) Architectures：将其设置为\
  \ Standard (32/64-bit Intel) 以保持向后兼容。对于仅支持 64 位的应用（包括运行在 OS X 10.7 Lion 下的应用），将其设置为\
  \ 64-bit Intel。\n\n![bl.eps](img/bl_fmt.jpeg) Debug Information Format：检查此处是否设置为\
  \ DWARF with dSym File。\n\n![bl.eps](img/bl_fmt.jpeg) Code Signing Identity：将其设置为以\
  \ 3rd Party Mac Developer Application 开头的身份，如图 13.22 所示。\n\n图 13.22\n\n为 Mac 应用设置代码签名身份\n\
  \n![9781118007594-fg1322.tif](img/9781118007594-fg1322_fmt.jpeg)\n\n![bl.eps](img/bl_fmt.jpeg)\
  \ Product Name：可选，你可以更改它来设置最终的名称。\n\n![bl.eps](img/bl_fmt.jpeg) Deployment Target：设置前文描述的\
  \ OS X 最低版本。\n\n![mac_note.eps](img/mac_note_fmt.jpeg) 注意事项\n\n设置代码签名身份后，你可以继续像往一样在你的\
  \ Mac 上测试和运行项目。与 iOS 代码签名不同，Mac 代码签名不会阻止这一点。收据检查可能会使此变得复杂，因此在最终生产构建之前禁用收据检查代码。\n\
  \n## 创建应用图标文件\n\nMac 应用使用带有 `.icns` 扩展的特殊多图标文件，该文件存储了多个分辨率的图标。创建此文件只有一种方法：使用 Xcode\
  \ 4 提供的 Icon Composer 工具。你可以在 `<Xcode 4 安装目录>/Applications/Utilities` 中找到它。\n\n\
  图标设计有两种选择：\n\n![bl.eps](img/bl_fmt.jpeg) 在图像编辑器中创建一个 512 x 512 的文件，并允许 Icon Composer\
  \ 为你创建其他分辨率。\n\n![bl.eps](img/bl_fmt.jpeg) 为其他分辨率创建单独的文件。\n\n所需的辨率是 512 x 512、256\
  \ x 256、128 x 128、32 x 32 和 16 x 16。缩放单个文件通常会产生较差的结果，但取决于图标的设计，这可能并不重要。\n\n一个节省时间的选项是创建两个分辨率：512\
  \ x 512 和 32 x 32。使用 Icon Composer 从大文件创建 256 x 256 和 128 x 128 分辨率，从小文件创建 16 x\
  \ 16 分辨率。为了获得最佳效果，请独立创建小文件。例如，如果图标包含文本，在较小文件中使用较小的字体号重新输入文本。\n\n将源文件保存为 PNG。启动 Icon\
  \ Composer，将文件从 Finder 拖入 Icon Composer UI 中的方框中，如图 13.23 所示。当每个方框都填满时，以 `.icns`\
  \ 扩展保存文件。\n\n图 13.23\n\n使用 Icon Composer 创建图标文件\n\n![9781118007594-fg1323.tif](img/9781118007594-fg1323_fmt.jpeg)\n\
  \n## 修改构建选项\n\n在图 13.24 所示的摘要（Summary）页面上，你需要执行以下操作：\n\n![bl.eps](img/bl_fmt.jpeg)\
  \ 设置 Bundle Identifier：这必须与你为项目创建的 App ID ——参见注意事项。）\n\n![bl.eps](img/bl_fmt.jpeg)\
  \ 添加版权声明：在 Key 列表中右键点击，选择 Add Row，并选择 Copyright（可读）。点击右侧的 Value 字段并输入版权文本。\n\n![mac_caution.eps](img/mac_caution_fmt.jpeg)\
  \ 注意事项\n\n在编写期间，Xcode 4 默认在目标 Info 页面使用正向域名——换句话说你的域名显示为 `yourdomain.com`。反向域名 `com.yourdomain`\
  \ 被认为是标准的，因此你可以通过两种方式管理它。一种方法创建一个逻辑上错误的 App ID；另一种是手动编辑它。如果你保持 `PRODUCT_NAME` 宏不变，Xcode\
  \ 4 会成功将你的产品名称添加到包中。你可以在目标页面的 Identifier 框中预览名称。关键点是 Bundle Identifier 必须与你为项目创建的\
  \ App ID ——尽管如果你使用的是通配符/套件 ID，产品名称本身无关。\n\n图 13.24\n\n在 Info plist 中添加版权声明\n\n![9781118007594-fg1324.tif](img/9781118007594-fg1324_fmt.jpeg)\n\
  \n## 构建、测试和验证应用\n\n按照以下步骤构建、测试并验证应用：\n\n1. 选择 `Product⇒Archive` 构建应用并打开 Organizer。\n\
  \n你可以使用 `Validate` 按钮进行基础验证，就像 iOS 应用那样。你还必须运行单独检查以确保应用从 App Store 下载后可以正确安装。\n\n\
  2. 点击右上角的 `Share` 按钮，保持 Contents 的默认设置不变——例如 Mac OS X App Store Package (.pkg)，如图\
  \ 13.26 所示。\n\n3. 将文件保存到可以从命令行轻松访问的位置，例如你的根用户目录。\n\n4. 打开 Terminal，输入以下代码段：\n\n\
  ```\nsudo installer -pkg <path-to-package> -target /\n```\n\n\n\n这以 App Store 模式运行标准的\
  \ OS X 安装程序，这会强制它检查签名和权限。（如果你直接双击应用包，它将在不进行这些检查的情况下安装。）该应用应该安装在你的 `/Applications`\
  \ 文件夹中，你可以像平时运行它。\n\n5. 如果验证和安装程序测试工作正常，点击 `Submit` 按钮提交应用。\n\n6. 登录，选择一个应用记录，并选择一个签名身份，与\
  \ iOS 应用的操作相同。\n\n图 13.26\n\n使用兼容商店的手动安装检查安装\n\n![9781118007594-fg1326.tif](img/9781118007594-fg1326_fmt.jpeg)\n\
  \n# 使用高级构建技术\n\n到目前为止，构建过程一直被视为一个“黑盒”，在用标准的构建设置列表初始化后执行工作。对于简单的应用程序来说这足够了，但对于更复杂的项目，拆解构建过程并进行进一步的定制可能是非常有用的。\n\
  \n## 理解构建过程\n\n简而言，构建过程分为四个阶段：\n\n1. 预处理器\n2. 编译器\n3. 链接器\n4. 文件复制器和处理器\n\n预处理器创建原始源文件的工作副本，展开\
  \ `#include` 指令以包含原始头文件，展开宏（低级可重用代码段和定义），并实现条件编译。条件编译使用诸如 `#if` 和 `#ifdef` 等指令来测试编译器和系统设置，并根据这些值选择代码。\n\
  \n在内部，预处理器的复杂程度比这个简单描述的要得多，但完整的介绍超出了本书的范围。关键的实践要点是，你可以使用预处理器指令根据各种系统、平台和构建设置自动包含或排除代码。\n\
  \n编译器将预处理器生成的文件转换为机器码。`LLVM` 和 `GCC` 编译器以不同的方式实现此点，但最终结果是相同的——一个具有 `.o`（对象）扩展名的文件。使用其他语言源码的项目可以调用外部编译器生成兼容的二进制文件。\n\
  \n项目中的每个源文件都会创建一个单独的对象文件。链接器将它们全部合并为一个可执行的二进制文件，解析符号引用到二进制文件中的特定位置，并检查所有引用都存在且正确。例如，如果你的代码调用了一个框架，链接器会检查是否包含了该框架。如果它找不到该框架或其中的特定符号，它就无法完成任务导致构建失败。\n\
  \n文件复制器处理支持文件。根据设定的规则，不同类型的文件以不同的方式处理。例如，`nib` 文件被压缩，图像文件可能会被压缩，`plists` 使用各自独立的处理器进行处理，等等。所有处理过的文件都会复制到目标的产文件夹中。某些可能会交给链接器，因此处理文件的节点可能会有所不同。\n\
  \n`Xcode` 构建系统在一个可自定义的构建管理器内部实现了这一方案。每个阶段都会运行多个 shell 脚本。你可以将自己的脚本添加到默认构建序列中。可能，你甚至可以用自己编写的替代方案替换默认脚本，尽管这不是一项简单的工作。\n\
  \n在实践中，`Xcode` 通过两个元素的组合管理构建过程：\n\n![bl.eps](img/bl_fmt.jpeg) 构建阶段选择并处理给定类型的文件。你也可以添加运行任意脚本的阶段。构建阶段定义了何时处理文件以及何时发生其他脚本化构建事件。\n\
  \n![bl.eps](img/bl_fmt.jpeg) 构建规则定义了控制特定扩展名文件发生什么情况的脚本。它们定义了如何处理文件。\n\n要完全自定义构建，你必须知道如何执行以下操作：\n\
  \n![bl.eps](img/bl_fmt.jpeg) 在代码中访问标准构建设置和环境变量，以便你可以添加条件编译功能。\n\n![bl.eps](img/bl_fmt.jpeg)\
  \ 创建你自己的用于条件编译的自定义构建设置。\n\n![bl.eps](img/bl_fmt.jpeg) 创建并管理构建阶段。\n\n![bl.eps](img/bl_fmt.jpeg)\
  \ 创建并管理构建规则。\n\n# 引入条件编译\n\n条件编译是一个自动化过程，字面意思是从你的源文件中包含和排除代码行。你通过在代码周围包裹预处理器指令来创建条件代码，这些指令看起来类似于传统的\
  \ C 代码，但以 `#` 字符为前缀。\n\n表 13.3 列出了标准的条件和无条件指令。\n\n![/Table 1303](img/9781118007594-tb1303.jpg)\n\
  \n## 使用条件编译\n\n理论上讲，条件编译非常简单。一个典型的示例所示：\n\n```\n#ifdef <some token>\n…要包含的代码…\n\
  #endif\n```\n\ntoken 是所有可用设置、宏、环境变量以及用户定义标志和值的通用统称名称。条件编译的挑战在于找到哪些 token 是可用的。\n\
  \n编译器包含了一系列由语言、平台、编译器和构建定义的设置。某些 token 被定义为宏并使用特殊格式：它们的名称以双下划线开头，并可能以另一个双下划线结尾。用户可以定义自己的自定义\
  \ token 作为绝对值、对其他设置的引用或两个或多个设置的逻辑组合。\n\n![mac_caution.eps](img/mac_caution_fmt.jpeg)\
  \ 注意\n\n注意，你不能在 `#if` 指令中比较字符串，但你可以将 token 与数值进行比较。你还可以检查特定 token 是否已定义。\n\n表 13.4\
  \ 列出了部分有用的宏和平台设置。\n\n![/Table 1304](img/9781118007594-tb1304.jpg)\n\n为这些 token 有一个单一来源将很有用，但它们分散在许多不同的地方。对于特定编译器的\
  \ token，请在网上搜索“GCC preprocessor macros”和“LLVM preprocessor macros”。对于某些 Apple 特有的\
  \ token，请在 Finder 中搜索文件 `TargetConditionals.h`。\n\n## 创建自定义 token\n\n创建你自己的 token\
  \ 通常很有用——例如，你可以添加一个只在选择自定义配置时定义的 token。\n\n注意，给你的 token 起一个自定义前缀是个好主意；你的首字母是一个流行的选择。开发者经常在代码中添加\
  \ token。如果代码是共享的，在多个位置定义 `DEBUG` 和 `IPHONE` 等简单名称会导致冲突。\n\n1. 打开至少有一个自定义配置的项目。打开目标构建设置，滚动到语言设置下的\
  \ `Other C Flags` 条目，如图 13.27 所示。\n\n2. 点击条目显示不同的配置选项。\n\n3. 点击自定义配置名称，点击右侧出现的小\
  \ `+` 图标。\n\n这向构建设置添加了一个新 token。\n\n4. 从左侧的浮动菜单选择 `Any Architecture | Any SDK`，并在右侧的值字段中输入\
  \ `-DMY_TOKEN` 以定义 token 的名称和值。\n\n如果你选择了特定的 SDK 或架构，则 token 只在对应 SDK 激活时定义。\n\n\
  图 13.27\n\n添加自定义 token。在此示例中，只有当 My Debug 配置激活时，`MY_TOKEN` 才被定义。\n\n![9781118007594-fg1327.tif](img/9781118007594-fg1327_fmt.jpeg)\n\
  \n5. 如果需要添加更多 token，重复此过程。\n\n你可以通过添加 `=`（等号）以及值来为 token 定义值。使你的条目“标记化”的关键元素是 `-D`\
  \ 前缀。\n\n你也可以在项目的 `-Prefix.pch` 文件中直接 `#define` token。它们对项目的每个文件有效，并且会覆盖现有的定义。\n\
  \n\n\n\n用于 `Release` 配置的预定义标记 `NS_BLOCK_ASSERTIONS=1` 是一个带有值的标记的示例。如果你想使用 `#ifdef`，只需定义该标记而不给其赋值即可。只有当你想要检查数值值或使用字符串时，才使用更通用的\
  \ `<tokenname>=<value>`。\n\n![mac_tip.eps](img/mac_tip_fmt.jpeg) 提示\n\n如果你在项目的 `-Prefix.pch`\
  \ 文件中添加 `#define NSLog`，那么代码中所有的 `NSLog` 实例都会被剥离。这是一种在不再需要日志消息时将其消除消除的快捷方法。\n\n\
  在你正确定义了 `MY_TOKEN` 后，你可以使用此条件指令在标记有效时包含某些内容：\n\n```objectivec\n#ifdef MY_TOKEN\n\
  <…如果定义了 MY_TOKEN 则包含代码…>\n#endif \n```\n\n![mac_note.eps](img/mac_note_fmt.jpeg)\
  \ 注意\n\n你也可以向 `Preprocessing`（预处理）部分添加标记。以相同的方式添加，但不要在它们前加缀 `-D`。\n\n## 将构建设置转换为标记\n\
  \n你可以通过将任何构建设置封装在美元符号 `$` 以及方括号或大括号中来将其转换为标记。例如，要将 `SDKROOT` 构建设置的值读取到你自定义的 `SDK_ROOT`\
  \ 标记中，请使用以下：\n\n```bash\nSDK_ROOT = $(SDKROOT)\n```\n\n你会发现 Xcode 会立即替换真实值，因此，例如你可能会看到：\n\
  \n```bash\nSDK_ROOT = iphoneos\n```\n\n遗憾的是，你对这个值做不了什么，因为值没有被视为 C 字符串。如果你在任何地方使用\
  \ `SDK_ROOT`，`iphoneos` 都会被预处理器替换。编译器随后会寻找名为 `iphoneos` 的符号，但找不到它，因为它不是一个真正的符号。\n\
  \n然而，你可以使用这种技术将数值型构建设置读取到你的代码中。但请（再次）记住，这些值仅在编译时有效。\n\n条件编译对于依赖于语言、平台和目标的编译非常有用，但使用编译时构建设置来选择运行时代码显得有些诡异。一个更有用的替代方案是在构建阶段（Build\
  \ Phases）中创建脚本和构建规则，以定义构建内部如何进行。\n\n![mac_tip.eps](img/mac_tip_fmt.jpeg) 提示\n\n\
  要找到任何构建设置的名称，在 `Build Settings` 编辑器中选择它，从 Xcode 主菜单选择 `Edit⇒Copy`，然后将字符串粘贴到 `TextEdit`\
  \ 中。你可以同时选择多个设置，只要它们不占用多个配置值。要查看构建设置的完整列表，请参阅文档中的 `Xcode Build Setting Reference`。\n\
  \n## 理解构建阶段和构建规则\n\n值得重复的是，Xcode 仅仅是一组命令行脚本的 UI。构建编辑器中的 `Build Phase`（构建阶段）和 `Build\
  \ Rules`（构建规则）选项卡定义了运行哪些脚本以及它们做了什么。\n\n你可以通过选择 `Log navigator`（日志导航器）、选择一个完成的构建，并在窗口顶部工具栏中选择\
  \ `All`（全部）和 `All Messages`（所有消息）来查看构建详情——在命令行给出的命令以及它们生成的输出。图 13.28 显示的默认视图按照给出的顺序显示命令。如你所见，实践中的序列并不像之前提供的\
  \ `preprocess⇒compile⇒link⇒copy` 模板那样整洁。\n\n如果你在列表的任何地方右键点击并选择 `Expand All Transcripts`（展开所有记录），你就能看到每个阶段的脚本。长长的路径、步骤和编译器开关列表很难阅读。在理论上，你可以复制并在\
  \ `Terminal` 中运行每个步骤来创建一个完整的构建。在实践中，你做不到，因为每个新项目都使用随机的文件路径作为构建目录，它位于项目的派生数据（derived\
  \ data）文件夹中。你可以在 `Organizer` 的 `Projects` 页面找到该文件夹的位置。\n\n## 使用构建阶段\n\n当你第一次遇到构建阶段系统时可能看起来复杂，但实际上操作起来异常地简单。要查看构建阶段编辑器，选择目标构建设置并点击\
  \ `Build Phases` 选项卡，如图 13.29 所示。\n\n你可以执行以下操作：\n\n![bl.eps](img/bl_fmt.jpeg) 管理目标依赖项。（使用此选项控制目标编译的顺序，以便目标按正确的顺序进行构建。）\n\
  \n![bl.eps](img/bl_fmt.jpeg) 向编译源列表添加更多文件。\n\n![bl.eps](img/bl_fmt.jpeg) 向 `Link\
  \ Binary With Libraries`（链接二进制文件与库）列表添加更多库和框架。\n\n![bl.eps](img/bl_fmt.jpeg) 将资源文件拷贝到产品包。\n\
  \n![bl.eps](img/bl_fmt.jpeg) 添加自定义构建以执行以下操作之一：将文件拷贝到产品、将头文件拷贝到产品或运行任意脚本。\n\n图 13.28\n\
  \n在日志导航器中列出构建期间发生的情况\n\n![9781118007594-fg1328.tif](img/9781118007594-fg1328_fmt.jpeg)\n\
  \n构建阶段在处理多个目标时最有用。例如，如果你的项目有两个目标（例如一个 app 和一个框架），你通常会将框架添加到 app 的 `Target Dependencies`（目标依赖）中，并将它创建的库添加到\
  \ app 的 `Link Binary with Libraries` 列表中，如图 13.29 所示。根据目标的细节，将其添加可以确保框架包含在完成的 app\
  \ 中。\n\n图 13.29\n\n探索构建阶段\n\n![9781118007594-fg1329.tif](img/9781118007594-fg1329_fmt.jpeg)\n\
  \n## 开始脚本和宏\n\n你可以使用 `Run Script`（运行脚本）选项添加自定义处理。脚本可以使用任何从命令行工作的语言编写，包括 `AppleScript`、`Perl`、`Python`、`Ruby`\
  \ 和 `shell`。\n\n构建设置宏允许你访问构建设置。脚本可以遍历源目录中的每个文件，或者选择特定扩展名的文件。由于脚本可以访问环境变量，其潜力几乎无限。例如，你可以实现远程备份。要删除脚本或构建阶段，点击顶部的取消图标。你可以通过拖动它们调整构建阶段的运行顺序。`Target\
  \ Dependencies` 是固定的，但其他任何阶段都可以移动。\n\n图 13.30\n\n创建一个构建阶段从一个空自定义脚本开始。注意输入和输出目录是从构建设置获取并填充的。\n\
  \n![9781118007594-fg1330.tif](img/9781118007594-fg1330_fmt.jpeg)\n\n![mac_caution.eps](img/mac_caution_fmt.jpeg)\
  \ 注意\n\n重新排列构建阶段可能会产生荒谬的结果；例如，将编译阶段放在链接阶段之后很少用。\n\n## 创建构建阶段简单示例\n\n将额外的资源（如字体文件）拷贝到包中通常很有用。OS\
  \ X 和 iOS 都可以从应用程序包访问字体。你可以使用此功能确保你选择的字体对 app 可用。\n\n虽然可以使用 Xcode 中标准的 `Add Files…`\
  \ 选项添加字体，但自定义构建阶段让你能够控制应用包的文件夹结构。你可以使用构建阶段将 Mac 上任何位置的项目拷贝到 app 内部的文件夹。\n\n图 13.31\
  \ 显示了 `Copy Files` 构建阶段的一个示例。图中所示的设置会在 app 包的 `/Resources` 文件夹内创建一个 `/fonts` 文件夹，并从共享项目艺术目录将字体文件拷贝到那里。`Destination`\
  \ 弹出菜单提供了更多其他强大的选择，包括绝对路径选项，可以将资源安装到 Mac 上的任何磁盘位置。\n\n图 13.31\n\n使用 Copy Files 构建阶段将字体资源添加到项目中。\n\
  \n\n\n\n\n![9781118007594-fg1331.tif](img/9781118007594-fg1331_fmt.jpeg)\n\n图 13.32\
  \ 显示了结果——`fonts` 文件夹已添加到包（bundle）中。你现在可以在项目的 `Info plist` 中添加一个名为 `Application fonts\
  \ resource path` (`ATSApplicationFontsPath`) 的键，并添加标准代码以通常的方式加载和使用该字体。OS X 会像对待包含在\
  \ Mac 标准 `/fonts` 文件夹中的字体对待它，但大多数用户无法访问，也无法轻易复制。\n\n图 13.32\n添加到包中的 `/fonts` 文件夹，其中包含复制的字体\n\
  \n![9781118007594-fg1332.eps](img/9781118007594-fg1332_fmt.jpeg)\n\n### 创建构建规则\n\
  \n要查看默认构建规则，请选择一个目标（target）并点击右上角的 `Build Rules` 标签页。图 13.33 中所示列表对每个目标都是相同的。它包含文件类型列表，以及可以处理这些文件的命令名称。这些命令位于\
  \ Xcode 构建系统的最底层；它们是以后各种方式复制、编译和处理文件的工具，分散在 `/Developer` 目录下的各个 `/usr/bin` 目录中。\n\
  \n图 13.33\n默认构建规则\n\n![9781118007594-fg1333.tif](img/9781118007594-fg1333_fmt.jpeg)\n\
  \n你可以通过点击 `Copy to Target` 按钮来自定义现有的规则。这将打开图 13.34 所示的窗格。使用 `Process` 菜单选择文件类型。你可以从标准类型列表中进行选择，也可以选择名称与以下匹配的\
  \ `Source` 文件：并在右侧的框中输入扩展名。每条标准规则默认对应一种类型。如果你选择了自定义脚本，默认的脚本存根（script stub）包含一个相关的构建设置，该设置指向存放关联文件的目录。你可以根据需要修改脚本中修改这些默认选项的任何一个。\n\
  \n使用 `Using` 框选择处理操作。你可以从另一个标准选项列表中进行选择，或选择 `Custom script` 选项来创建你自己的脚本处理器。脚本编辑器与构建阶段（build\
  \ phases）的编辑器相同，并且可以使用 shell 支持的相同语言选择。\n\n注意，构建规则是针对目标的。\n\n![mac_note.eps](img/mac_note_fmt.jpeg)\
  \ 注意\n\n你可能不熟悉菜单中的某些文件类型和进程。许多是高度专业化的，你不太可能会使用它们。\n\n图 13.34\n构建规则使用与构建阶段相同的脚本选项。（你可以在这里尽情发挥你的创意。）\n\
  \n![9781118007594-fg1334.tif](img/9781118007594-fg1334_fmt.jpeg)\n\n![mac_tip.eps](img/mac_tip_fmt.jpeg)\
  \ 提示\n\n可以通过使用 Xcode 偏好设置中的 `Distributed Builds` 功能加速具有许多文件和目标的复杂构建，该功能将构建过程分布到多台\
  \ Mac 上。在每台 Mac 上安装 Xcode，打开偏好设置，选择 `Distributed Builds`、`Authenticate` 并勾选两个复框。对其他\
  \ Mac 重复此操作并选择 `Refresh`。启动 Xcode 并在其他 Mac 上重复该过程。`Distributed Builds` 对话框会自动找到其他\
  \ Mac 并分构建到它们。\n\n## 总结\n\n本章探讨了实用的构建自定义。它从一个常用的简单自定义任务列表开始，这些任务通过修改构建设置来控制构建过程的某些小部分。\n\
  \n接下来，它系统地介绍了创建用于 App Store 和 Ad Hoc Beta 测试的发行构建所需的步骤。\n\n最后，它引入了构建系统的底层功能，并勾勒了如何使用构建阶段和构建规则来创建支持多个目标、依赖项和非标准文件类型的复杂全自定义构建。\n\
  \n# 第 14 章：使用版本控制\n\n## 本章内容\n\n- 引入源码控制管理 (SCM)\n- 使用手动版本控制\n- 使用快照 (snapshots)\n\
  - 引入带有 Git 的 SCM\n- 在 Xcode 中本地使用 Git\n- 配合 GitHub 使用 Xcode\n\n开发过程并不总是一帆风顺的，有时需要放弃不起作用的代码并将项目恢复到之前的状态。比较旧版本和新版本以及使用管理跨团队开发的工具也很有用。\n\
  \n以这些方式管理代码被称为版本控制或源码控制管理 (SCM)。Xcode 内置了若干种版本控制工具。它们不是强制性的，所以你可以忽略它们，但不建议这样做。至少，你可以在\
  \ Finder 中手动管理版本。但你也可以使用 Xcode 4 新引入的更强大的工具。\n\n### 使用手动版本控制\n\n管理版本最简单的方法是在 Finder\
  \ 中双隆并重命名项目文件夹，如图 14.1 所示。每个文件夹都应该包含具有一致功能 set 的稳定或接近稳定的代码。代码应该能够顺利地编译。\n\n在开始添加新版本之前，创建一个副本。如果明显下一个版本必须被放弃，你可以通过给文件夹一个唯一的名称——也许包含“abandoned”（已弃用）一词——来标记它，并从新副本重新开始。\n\
  \n图 14.1\n手动版本控制\n\n![9781118007594-fg1332.eps](img/9781118007594-fg1332_fmt.jpeg)\n\
  手动版本控制简单易用，但有局限性。\n\n手动版本控制非常适用于简单的、自包含的项目，如应用。它不推荐用于复杂的项目，如框架。而且永远不用于协作开发。\n\n\
  手动版本控制的优点包括：\n\n![bl.eps](img/bl_fmt.jpeg) 简单且无麻烦的管理：每个版本都是分开且清晰标记的。如果你需要回溯，可以这样做。\n\
  \n![bl.eps](img/bl_fmt.jpeg) 于备份：你可以手动将文件夹备份到服务器。\n\n![bl.eps](img/bl_fmt.jpeg)\
  \ 健壮性：结合备份，即使磁盘崩溃，你的工作丢失概率也较低。项目文件是独立的且易于访问。\n\n缺点包括：\n\n![bl.eps](img/bl_fmt.jpeg)\
  \ 缺少更改日志：你可以使用 `diff` 系列命令行工具手动比较文件。但你只能在 Terminal 中操作，而不是 Xcode 中。\n\n![bl.eps](img/bl_fmt.jpeg)\
  \ 不支持固定位置：如果文件从另一个项目访问，你必须保持目录名不变，这种方案是不可行的。\n\n![bl.eps](img/bl_fmt.jpeg) 缺乏简单的回滚：你无法查看编辑记录，无法比较文件的不同版本或无法将其恢复到之前的状态。\n\
  \n![bl.eps](img/bl_fmt.jpeg) 不支持协作开发：虽然可以使用非正式方案签出代码进行编辑，但没有简单的方法将团队创建的更改合并到一个代码库。\n\
  \n尽管手动版本控制非常原始，但如果你是 Xcode 开发新手，且暂时不想学习像 Git（下文介绍）这样的专业解决方案，它可能是值得考虑的。对于简单项目，这是一个实用的解决方案，不会在你尝试掌握\
  \ Xcode 和 Cocoa 的其他内容时让你分心。\n\n### 使用快照\n\n快照是一种简单的半自动源码控制解决方案。你可以随时通过 Xcode 主菜单中的\
  \ `File⇒Create Snapshot` 对项目创建快照。快照记录了项目文件的状态，快照列在 Organizer 中。你可以通过恢复快照将项目恢复到之前的状态。\n\
  \n例如，按照以下步骤创建一个新的 OS X Cocoa 应用：\n\n1. 将你的新 OS X Cocoa 应用保存为 `SnapshotExample`。\n\
  \n2. 使用 `Create Snapshot` 选项保存初始状态的快照。\n\n图 14.2\n\n3. 你可以为每个快照提供标题和可选的描述。\n\n\n\
  \n\n\n![mac_note.eps](img/mac_note_fmt.jpeg) 注意\n\n在实际项目中，你通常不需要保存应用程序的初始默认状态，因为你可以随时作为新项目来重新创建默认状态。但偶尔，当你进行实验时，将初始状态作为起点会很有用。\n\
  \n### 4. 添加一些代码。\n对于初始演示，可以简单到只有单行注释。\n\n### 5. 创建另一个快照，并赋予它不同的标题和描述。\n\n### 6.\
  \ 打开组织器（Organizer）窗口。\n你通过选择 Xcode 窗口右上角的文件柜图标来打开组织器窗口。\n\n图 14.2\n创建一个带有名称和描述的新快照\n\
  \n![9781118007594-fg1402.tif](img/9781118007594-fg1402_fmt.jpeg)\n\n### 7. 选择窗口顶部的\
  \ Projects 图标。\n你应该能看到与图 14.3 显示类似的界面。新的 `SnapshotExample` 项目出现在左侧列表的顶部。窗口底部面板中会显示项目的快照列表。\n\
  \n快照列表可能会变得杂乱，因此你可以通过选择窗口右下角的删除快照图标来删除单个快照。你也可以通过选择快照并使用“恢复快照”选项将项目恢复到早前的状态。你会看到一个预览窗口（如图\
  \ 14.4 所示），它会高亮所选快照与上一个快照之间的差异。\n\n![mac_caution.eps](img/mac_caution_fmt.jpeg)\
  \ 注意\n\n已删除的快照没有撤销选项；它们一旦删除就彻底消失了。请注意，更改是增量的。预览窗口不会显示项目第一个版本与快照之间的差异。相反，它显示的是当前快照与上一个快照之间的差异。\n\
  \n图 14.3\n查看项目的快照\n\n![9781118007594-fg1403.tif](img/9781118007594-fg1403_fmt.jpeg)\n\
  \n![mac_tip.eps](img/mac_tip_fmt.jpeg) 提示\n\nXcode 可以在每次批量编辑（如重构操作或查找并替换）之前自动创建快照。选择\
  \ `File⇒Project Settings` 或 `File⇒Workspace settings` 打开偏好设置对话框，点击 Snapshots 选项卡，并勾选\
  \ `在批量编辑操作前创建项目快照` 框。你也可以为快照定义自定义位置。注意，此功能默认开启。\n\n你可能期望快照会将项目恢复到早前的状态，但它并没有这样做。相反，会弹出一个恢复对话框，要求你指定磁盘上的一个文件夹。项目的旧状态会被写入该文件夹。要重新加载状态，请关闭当前项目并从你指定的文件夹重新加载旧版本。这种单独的保存要求使得快照选项变得很笨拙。它实现了最小的版本控制，但并不优雅或精细。\n\
  \n图 14.4\n查看恢复选项\n\n![9781118007594-fg1404.tif](img/9781118007594-fg1404_fmt.jpeg)\n\
  \n## 使用版本控制\n\nXcode 支持两种版本控制系统——Subversion 和 Git——它们可以跟踪文件的更改，并支持协作开发。版本控制为 Xcode\
  \ 添加了以下功能：\n\n![bl.eps](img/bl_fmt.jpeg) 开放开发：你可以允许其他开发者与你一起工作项目。\n\n![bl.eps](img/bl_fmt.jpeg)\
  \ 编辑日志：你可以看到文件随时间演变的过程，以及代码是如何添加、更改或删除的。\n\n![bl.eps](img/bl_fmt.jpeg) 更改控制：你可以接受或丢弃你或其他开发者所做的更改。\n\
  \n![bl.eps](img/bl_fmt.jpeg) 责任溯日志（Blame logging）：更改标记了制作这些更改的开发者 ID。\n\n![bl.eps](img/bl_fmt.jpeg)\
  \ 项目分支：你可以创建并行分支以支持不同功能的独立开发，或者拆分项目允许分支向不同的方向开发。\n\n![bl.eps](img/bl_fmt.jpeg) 远程服务器备份：基于服务器的版本控制将代码存储在远程服务器上，因此你不太会在意外中丢失它。\n\
  \nSubversion 和 Git 之间存在显著差异。虽然 Xcode 支持 Subversion，但 Git 的集成更紧密。你可以直接从 Xcode 界面创建并管理支持\
  \ Git 的项目，而无需使用命令行。某些高级 Git 特性仅在命令行可用，但即使没有它们也可以成功使用 Git。\n\n相比之下，你必须使用命令行访问来为项目设置\
  \ Subversion。设置完成后，许多基本功能在 UI 中也可用。Subversion 需要外部服务器。Git 可以在本地使用，也可以支持基于服务器的开发。\n\
  \n![mac_caution.eps](img/mac_caution_fmt.jpeg) 注意\n\nGit 和 Subversion 是随 Xcode 安装的命令行工具的一部分。要使用它们，请在安装\
  \ Xcode 时勾选 System Tools 框。如果没有这样做，它们将无法使用。\n\n## 理解 Git\n\n版本控制工具通过仓库（repository\
  \ 或 repo）工作——这是一种用于管理项目文件的配置数据库。专业版本控制的一个主要优势是，仓库的内容可以保存在单台 Mac 上，也可以在服务器上在线共享。你可以通过克隆（clone）仓库来将其复制到多台\
  \ Mac 上。使用 `GitHub` 等在线存储可以让你“免费”备份，并支持协作开发。\n\n仓库可以存储增量更改或完整文件。Subversion 存储增量更改。Git\
  \ 存储完整文件；事实上，它始终与项目的完整版本一起工作这使得它比 Subversion 更健壮，但代价是额外的磁盘空间和下载/上传时间。因为代码文件通常很小，这种时间代价通常并不显著。因为\
  \ Git 不需要合并和更新文件，它的响应更敏捷。\n\n要使用 Git，你需要在本地使用 Xcode 创建仓库，或在远程服务器上手动创建，然后按照通常的方式添加和编辑文件。在每次重大编辑后，都要\
  \ `commit` 更改。这将创建一个项目的完整快照，并将任何修改或添加文件的副本添加到仓库。\n\n提交不必按线性顺序进行。你可以创建一个新分支来实验代码或独立地开发某些功能。分支可以独立开发，也可以相互合并。\n\
  \n如果你在本地使用 Git，版本控制是自动的。Git 跟踪你的提交，你可以使用名为 `Version Editor` 的 Xcode 新功能来查看和比较项目开发过程中每个文件的更改。\n\
  \n![mac_caution.eps](img/mac_caution_fmt.jpeg) 注意\n\n当你提交更改时，你正在同时更新多个文件。没有自动的方法可以将单个文件恢复到早前的状态，而不改变在同一时间提交的其他文件。但是，你可以使用简单的手动复制/粘贴，从\
  \ Version Editor 将文件的旧版本复制到主代码编辑器中，然后创建一个该文件旧内容的新提交。\n\n如果你使用远程服务器，过程将变得更加复杂。要远程使用\
  \ Git，协作者需要提供名称、电子邮箱地址和用于安全的公钥。如果你正在管理一个 Git 项目，你可以审查并接受或拒绝其他开发者提供的提交。\n\n\n\n\n\
  当你处理在线仓库工作时，你可以克隆（clone）一个项目——将当前版本从服务器复制到你的 Mac——以对其进行独立开发，然后执行推送（push）将你的更改合并回源码。首席开发人员可以审核这些更改并接受或删除它们。当你进行协作时，Git\
  \ 和 Xcode 会在所有提交中包含作者信息，这使得很容易查看是谁负责这些更改。你还可以更新项目，以用最新更改刷新你正在编辑的版本，而无需创建新副本。\n\n\
  ![mac_note.eps](img/mac_note_fmt.jpeg) 注意\n\nGit 是一个具有许多功能和选项的复杂系统，但它的文档非常详尽。本章介绍了\
  \ Xcode 中的 Git，但它并不是关于与 GitHub 协作开发的完整 Git 入门指南。要查看完整文档，请参阅 [progit.org/book](http://progit.org/book)\
  \ 提供的免费《ProGit》书籍、[gitref.org](http://gitref.org) 上的官方命令摘要以及 [help.github.com](http://help.github.com)\
  \ 的 GitHub 帮助。\n\n# 在本地使用 Git\n\n你可以在本地使用 Git 进行简单的项目版本控制。简单的版本控制不需要远程服务器、高级的 Git\
  \ 技能或命令行管理，并且它使用了 Xcode 内置的 GUI 功能。此示例演示了如何创建本地仓库，以及如何使用版本编辑器（Version Editor）审核项目文件中文件的更改。此示例项目中的编辑是微不足道的，但它们足以说明你可以在工作时使用版本编辑器来管理代码。\n\
  \n![mac_caution.eps](img/mac_caution_fmt.jpeg) 警告\n\nXcode 的 Git 实现省略了许多在使用命令行或与现有的流行的\
  \ Mac Git 工具（如 `GitX` (gitx.frim.nl)）工作时使用的功能和概念。例如，Xcode 不支持显式文件暂存（staging）。如果你在其他场景下用过命令行\
  \ Git，你会发现 Xcode 的实现更简单、功能更弱，但对于基础版本控制（SCM）来说仍然足够。\n\n# 创建支持 Git 的项目\n\nGit 支持是可选的，适用于\
  \ OS X 和 iOS 项目。使用 Xcode 主菜单中的 `File⇒New Project` 选项来创建一个新项目（此示例使用一个名为 `LocalGit`\
  \ 的 OS X 项目），并勾选源控制（Source Control）复选框，如图 14.5 所示。\n\n图 14.5\n\n创建一个支持 Git 的项目\n\
  \n![9781118007594-fg1405.tif](img/9781118007594-fg1405_fmt.jpeg)\n\nXcode 以通常的方式创建项目。如果你在磁盘上打开项目文件夹，你会看到标准的文件集合。然而，如果你打开组织管理器（Organizer）并选择“仓库（Repositories）”选项卡，你会发现已经为该项目创建了一个仓库，如图\
  \ 14.6 所示。无论你是在本地还是在线工作，此仓库视图都会列出由 Git 管理的所有仓库每当你创建一个支持 Git 的新项目时，列表就会添加一个新仓库。\n\
  \n注意项目已经包含了以下内容：\n\n![bl.eps](img/bl_fmt.jpeg) 项目名称：这在创建项目时定义。\n\n![bl.eps](img/bl_fmt.jpeg)\
  \ 仓库类型：这可以是 Git 或 Subversion。\n\n![bl.eps](img/bl_fmt.jpeg) 位置：对于本地项目，这是磁盘上包含源码的文件夹。对于远程项目，这是一个链接到远程服务器仓库的特殊\
  \ URL。\n\n![bl.eps](img/bl_fmt.jpeg) 初始提交：项目的第一次提交会自动创建，并包含初始默认文件。你可以使用展开三角形来查看文件列表。\n\
  \n![bl.eps](img/bl_fmt.jpeg) 时间戳：记录了每次提交的时间日期。\n\n![bl.eps](img/bl_fmt.jpeg) 哈希值（hash）：图中的\
  \ `faa5b77c734f` 标签是一个生成的随机数，用于为提交提供唯一标识符。每个新提交都有新的哈希值。如果你完全在 Xcode 中工作，可以忽略哈希标签。如果你在命令行操作，可以使用这些标签在想要修改、克隆、删除某个提交等时指定该提交。\n\
  \n图 14.6\n\n在组织管理器中查看项目仓库\n\n![9781118007594-fg1406.tif](img/9781118007594-fg1406_fmt.jpeg)\n\
  \n在仓库内部，你还会看到另外两个项目：\n\n![bl.eps](img/bl_fmt.jpeg) 分支（Branches）项目：最初，它显示一个名为 Master\
  \ 的单项。如果你创建了更多分支，它们会出现在这里。\n\n![bl.eps](img/bl_fmt.jpeg) `<ProjectName>` 文件夹：这显示项目在磁盘上的当前状态。当你项目中添加文件时，它们会出现在此文件夹中。在提交项目之前，它们不会出现在根目录。\n\
  \n# 编辑支持 Git 的项目\n\nGit 支持是透明的，因此当 Git 激活时，你可以按照通常的方式开发项目。\n\n尝试此示例：\n\n1. 在项目导航器（Project\
  \ Navigator）中右键点击 `<ProjectName>` 组并选择“新建文件（New File）”，为项目添加额外的 Objective-C 类。\n\
  2. 创建 `NSObject` 的新子类并以默认名称 `MyClass` 保存它。\n3. 对 `AppDelegate.m` 文件进行微小但明显的更改。\n\
  \n\n\n你可以通过左下角的图标隐藏历史列表，也可以通过拖动顶部的栏来更改其高度。如果你在提交（commit）后进行了更改，可以使用此页面左下角的 `Commit`\
  \ 按钮创建一个新提交。你也可以打开本地项目，并从顶部的列表中选择文件，以查看它们最后一次添加或修改的提交。\n\n`Organizer` 中的此页面旨在让你对项目中的文件和提交有一个整体的了解。它不是一个编辑器，也没有链接到编辑器。\n\
  \n这可能是不符合直觉的。你可能认为可以在这里管理更改——但实际上你做不到。要比较版本并检查提交时间线，请使用 `Version Editor`。它是 `Xcode`\
  \ 编辑器的一项功能。\n\n### 图 14.9\n在多次提交后在 `Organizer` 中查看历史列表\n\n![9781118007594-fg1409.tif](img/9781118007594-fg1409_fmt.jpeg)\n\
  \n### 在 `Version Editor` 中使用比较视图\n默认情况下，图 14.10 所示的 `Version Editor`为给定文件提供双分比较窗口。要加载编辑器，请选择图中右上角的图标。\n\
  \n你可以在任何一个窗口中查看文件在任何提交时的状态。左视图和右视图之间没有隐含的“之前”或“之后”之分。这两个选择是独立的。如果它们不同，编辑器会高亮显示差异。\n\
  \n### 图 14.10\n加载 `Version Editor` 以比较版本\n\n![9781118007594-fg1410.tif](img/9781118007594-fg1410_fmt.jpeg)\n\
  \n查看提交有多种方法。如果你点击窗口底部的跳转栏，你会看到一个弹出菜单，其中列出了按时间顺序顺序排列的提交列表，如图 14.11 所示。\n\n重要的是，最近的编辑位于列表顶端，而最早的初始提交位于底部。\n\
  \n修订版本的命名法并不直观，因此在下对其进行了解释：\n\n- ![bl.eps](img/bl_fmt.jpeg) 未保存的修订（Unsaved revision）：此版本已过编辑，但尚未保存。\n\
  - ![bl.eps](img/bl_fmt.jpeg) 本地修订（Local revision）：该版本已编辑并保存，但尚未提交。\n- ![bl.eps](img/bl_fmt.jpeg)\
  \ `<带有时间戳、名称和哈希的条>`：这些版本已经提交。值得重复的是，最新版本位于列表顶部，并标记为 (`BASE`, `HEAD`)。最早的初始提交位于列表底部。\n\
  \n### 图 14.11\n从跳转栏菜单中选择提交\n\n![9781118007594-fg1411.tif](img/9781118007594-fg1411_fmt.jpeg)\n\
  \n选择任何提交都会将文件的相应状态加载到查看窗口中。左、右窗口使用相同的系统，因此你可以在任何一个窗口中查看任何提交。要查看不同文件的提交，请按照通常的方法在\
  \ `Project Navigator` 中选择它。\n\n除了列表，你还可以显示时间线——类似于 `Time Machine` 的时间线——在两个视图之间列出提交列表。点击两个跳转栏之间凹槽中的时钟/弯箭头图标。你会看到图\
  \ 14.12 所示的显示。时间线上的每个“按钮”都表示一个提交。旧版本出现在列表顶部，因此初始提交始终是顶部的第一个。列表顶部的空提交槽显示为较深灰色。\n\n\
  按钮是动画的，并在鼠标悬停时时会展开。虽然你可以点击按钮来选择提交，但并不总是清楚你的选择将出现在哪个窗口中。要在特定窗口中选择提交，请点击按钮右侧或左侧的间隙。该窗口的三角形指示器将移动到你选择的提交，并加载显示文件的相应版本。列表底部的基础版本是最后一次提交。本地版本是编辑后的最后一个版本，与跳转栏菜单中的“本地修订”相同。\n\
  \n![mac_caution.eps](img/mac_caution_fmt.jpeg) 注意\n\n可以说，时间线列表是倒置的。初始提交是顶部的项目，而最近的编辑出现在时间线的底部。无论哪种方向对你来说更合理，重要点是：跳转栏菜单中的提交列表顺序与时间线的顺序相反。\n\
  \n### 图 14.12\n使用新的时间线功能选择版本\n\n![9781118007594-fg1412.tif](img/9781118007594-fg1412_fmt.jpeg)\n\
  \n![mac_caution.eps](img/mac_caution_fmt.jpeg) 注意\n\n版本比较仅用于显示；当你在 `Version Editor`\
  \ 中查看版本时，主编辑器中的文件不会发生变化。没有单点击即可将项目回滚到以前提交的选项。你可以从命令行使用 `git revert` 命令手动回滚到较早的提交，但在\
  \ `Xcode` 中回滚单个文件只能从 `Version editor` 复制版本并粘贴。\n\n\n\n\n1. 在项目 `App Delegate` 中添加几行注释或代码。\n\
  2. 在 `Organizer` 中打开 `Repositories` 页面。\n3. 选择 `Branches`。\n4. 点击右下角的 `Add` 按钮。\n\
  你将看到图 14.15 所示的对话框。\n\n图 14.15\n创建新分支\n![9781118007594-fg1415.tif](img/9781118007594-fg1415_fmt.jpeg)\n\
  \n5. 为你的分支输入名称。不允许包含空格。\n6. 勾选 `Automatically switch to this branch`（自动切换到此分支）。\n\
  7. 选择 `Create`（创建）。\n这将向列表中添加新分支。\n8. 将更改提交到新分支。\n9. 在 `Organizer` 中，点击右上角的 `Branches`\
  \ 文件夹。\n看到新分支已添加到列表中。如果你编辑代码，只会影响当前分支。旧的 `Master` 分支不会改变。\n10. 要要在分支之间切换，选择 `Branches`\
  \ 下的项目文件夹，并点击右下角的 `Switch Branch` 图标。\n将弹出一个带有分支菜单的对话框，如图 14.16 所示。当你在这里选择一个分支时，该分支的代码将出现在\
  \ `Xcode` 的主编辑器中。\n\n图 14.16\n虽然从这个对话框中并不明显，但选择分支会将它的文件加载到主编辑器。\n![9781118007594-fg1416.tif](img/9781118007594-fg1416_fmt.jpeg)\n\
  ![mac_caution.eps](img/mac_caution_fmt.jpeg) 注意\n注意，在 `Branches` 文件夹中选择分支不会将它们加载到编辑器。你必须点击\
  \ `Switch Branches` 图标来切换分支。\n\n### 合并分支\n\n要合并分支，首先使用 `Organizer` 切换到你想要作为合并目标的分支。这通常是（但并不总是）原始的\
  \ `Master` 分支。\n\n接下来，选择一个分支作为合并源。选择 `File`（文件）⇒`Source Control`（源代码控制）⇒`Merge`（合并），并在对话框的菜单中选择一个分支。该分支的代码将合并到目标分支。\n\
  \n合并后，该分支保持不变——更改仅发生在目标分支中。\n\n`Xcode` 会显示 `Version Editor`（版本编辑器），如图 14.17 所示。右侧显示合并代码的预览。\n\
  \n图 14.17\n虽然从这个对话框中并不明显，但选择分支会将它的文件加载到主编辑器。\n![9781118007594-fg1417.tif](img/9781118007594-fg1417_fmt.jpeg)\n\
  \n文件中每个差异都会高亮显示。行间区域（gutter area）包含一个切换图标。你可以使用窗口底部的切换按钮来选择差异。切换默认开启的，但你可以关闭它们以排除某项更改。你还可以使用切换来解决冲突。\n\
  \n注意，你不能通过直接在行间中点击来切换开关。你只能通过点击窗口底部的按钮栏来更改其状态。\n\n![mac_caution.eps](img/mac_caution_fmt.jpeg)\
  \ 注意\n在编写时，合并功能尚未正常工作，但可能很快修复。作为变通方案，你可以使用 `Git` 的命令行合并选项。详情请参阅 `Git` 手册。本章末尾列有一个链接。\n\
  \n### 使用 Xcode 配合 GitHub\n\n虽然可以为 `Git` 创建自定义远程服务器，但图 14.18 所示的 [github.org](http://github.org)\
  \ GitHub 网站已成为使用 `Git` 的团队和个人开发者的流行选择。理论上，本地和远程开发之间的差异应该是细微的，因为 `Git` 处理这两种情况的方式是类似的。在实践中，创建新项目时，远程开发需要大量的额外努力。\n\
  \n图 14.18\n初识 [github.org](http://github.org)\n![9781118007594-fg1418.tif](img/9781118007594-fg1418_fmt.jpeg)\n\
  \n`GitHub` 是可选的。如果你是独立开发，可以在本地开发而完全不使用 `GitHub`。但对于团队开发，它是一个简单且易于实现的解决方案。`GitHub`\
  \ 的功能包括以下内容：\n\n![bl.eps](img/bl_fmt.jpeg) 免费公共协作开发：默认情况下，`GitHub` 项目是开放公开的，因此任何人都可以下载你的代码并添加他们自己的提交。这对开源项目是一件好事，但对于专有开发没有帮助。\n\
  \n![bl.eps](img/bl_fmt.jpeg) 私有团队开发的月付计划：`GitHub` 上的隐私功能（包括向公众隐藏项目并仅向选定的开发者开放）费用从\
  \ 7 美元到 200 美元，取决于仓库和开发者的数量。免费账户限制为 300MB 磁盘空间。付费账户提供更多。\n\n![bl.eps](img/bl_fmt.jpeg)\
  \ 易于在线访问：你可以在任何有连接的地方交换提交和更新。你也可以离线工作，并在重新连接时上传更改。\n\n![bl.eps](img/bl_fmt.jpeg)\
  \ 易于下载：你的项目可以自动打包成单个压缩包，非常方便。\n\n![bl.eps](img/bl_fmt.jpeg) 免费公共协作开发：默认情况下，`GitHub`\
  \ 项目是开放公开的，因此任何人都可以下载你的代码并添加他们自己的提交。这对开源项目是一件好事，但对于专有开发没有帮助。\n\n![bl.eps](img/bl_fmt.jpeg)\
  \ 私有团队开发的月付计划：`GitHub` 上的隐私功能（包括向公众隐藏项目并仅向选定的开发者开放）费用从 7 美元到 200 美元，取决于仓库和开发者的数量。免费账户限制为\
  \ 300MB 磁盘空间。付费账户提供更多。\n\n![bl.eps](img/bl_fmt.jpeg) 易于在线访问：你可以在任何有连接的地方交换提交和更新。你也可以离线工作，并在重新连接时上传更改。\n\
  \n![bl.eps](img/bl_fmt.jpeg) 易于下载：你的项目可以自动打包成单个压缩包，非常方便。\n\n![bl.eps](img/bl_fmt.jpeg)\
  \ 免费公共协作开发：默认情况下，`GitHub` 项目是开放公开的，因此任何人都可以下载你的代码并添加他们自己的提交。这对开源项目是一件好事，但对于专有开发没有帮助。\n\
  \n![bl.eps](img/bl_fmt.jpeg) 私有团队开发的月付计划：`GitHub` 上的隐私功能（包括向公众隐藏项目并仅向选定的开发者开放）费用从\
  \ 7 美元到 200 美元，取决于仓库和开发者的数量。免费账户限制为 300MB 磁盘空间。付费账户提供更多。\n\n![bl.eps](img/bl_fmt.jpeg)\
  \ 易于在线访问：你可以在任何有连接的地方交换提交和更新。你也可以离线工作，并在重新连接时上传更改。\n\n![bl.eps](img/bl_fmt.jpeg)\
  \ 易于下载：你的项目可以自动打包成单个压缩包，非常方便。\n\n### 创建 GitHub 账户\n\n创建一个 GitHub 账户非常简单。GitHub 要求提供用户名、电子邮件地址和密码。这些是过程的重要组成部分。可选，你可以为账户添加联系信息和其他个人信息，但这些对于基础仓库管理并非必须。\n\
  \n![mac_tip.eps](img/mac_tip_fmt.jpeg) 提示\n如果你有 gravatar 或 WordPress 的账户，可以使用现有登录信息。GitHub\
  \ 与使用 Automattic 服务共享登录信息。详情请参阅 [automattic.com](http://automattic.com)。\n\n###\
  \ 创建公钥\n\n`Git` 通过 `ssh`（安全 Shell）与 GitHub 通信，这是一种设备间数据传输的安全底层协议。在使用 `ssh` 之前，你需要定义并上传一个签名\
  \ Mac 与 GitHub 服务器通信的密钥，以便 GitHub 验证你的身份。创建密钥的过程有点复杂，但只需操作一次。按照以下步骤：\n\n1. 打开终端。\n\
  2. 输入 `cd ~/.ssh`。\n3. 如果没有该文件或目录，跳到步骤 5。\n4. 如果目录存在，你可能可以使用 `cp` 命令将其备份到另一个目录。备份完成后，删除该目录。\n\
  5. 输入 `ssh-keygen -t rsa -C \"youremail@address.com\"`。电子邮件必须与你作为 GitHub 登录的邮箱匹配。\n\
  6. 在询问保存到默认位置的文件名时按回车。\n7. 为密钥设置良好的密码，并输入两次。\n\n`ssh-keygen` 工具创建一个密钥并保存到两个文件中：`id_rsa`（你不与任何人共享的私钥）和\
  \ `id_rsa.pub`（你需要复制到 GitHub 的公钥文件）。\n\n8. 输入 `cat ~/.ssh/id_rsa.pub | pbcopy`。\n\
  将密钥的公部分复制到剪贴板。\n9. 打开浏览器并登录 GitHub。\n\n\n\n\n10. 点击账户设置（Account Settings）。\n\n11.\
  \ 从左侧菜单中选择 SSH 公钥（SSH Public Keys）。\n\n12. 选择添加另一个公钥（Add another public key），并将密钥粘贴到\
  \ Key 框中，如图 14.19 所示。\n\n13. 点击添加密钥（Add key）。\n\n密钥已安装。\n\n![mac_note.eps](img/mac_note_fmt.jpeg)\
  \ 注意\n\n你以后可以使用编辑选项更改密钥。这通常不是一个好主意，除非你从头开始生成密钥过程。如果你 Mac 上的密钥与 GitHub 使用的密钥不匹配，你将无法访问你的源代码。\n\
  \n## 设置 Git 用户名和邮箱\n\n除了密钥之外，Git 和 GitHub 还需要用户名和邮箱。这些信息是不加密的。虽然你可以为每个仓库设置不同的联系名称和邮箱，但为所有仓库全局设置这些信息要简单得多。你只需要进行一次设置。\n\
  \n图 14.19\n\n### 定义你的公钥\n\n![9781118007594-fg1419.tif](img/9781118007594-fg1419_fmt.jpeg)\n\
  \n在终端（Terminal）中输入以下内容：\n\n```bash\ngit config --global user.name \"<你的名字>\"\n```\n\
  \n```bash\ngit config --global user.email <你的邮箱>\n```\n\n## 在 GitHub 上创建远程仓库\n\n\
  创建远程仓库是一个非常简单的过程；按照以下步骤操作：\n\n1. 登录 GitHub。\n2. 选择仪表板（Dashboard）。\n3. 从左侧列表选择创建仓库（Create\
  \ a Repository），如图 14.20 所示。\n4. 输入名称。\n\n出于显而易见的原因，使用项目名称是一个好主。当你点击创建仓库（Create\
  \ Repository）按钮时，GitHub 会将仓库添加到你的账户中。\n\n5. 点击你的账户名称查看仓库列表。\n\n![mac_note.eps](img/mac_note_fmt.jpeg)\
  \ 注意\n\n如果能通过一个命令通过复制 Mac 上现有的 Git 仓库创建一个新的 GitHub 仓库，将非常方便。遗憾的是，你做不到。你必须先在 GitHub\
  \ 上创建一个新仓库，然后手动将文件复制过去。GitHub 的名称必须与你的本地仓库名称匹配。\n\n图 14.20\n\n创建一个新的在线仓库\n\n## 将本地\
  \ Git 仓库复制到 GitHub\n\n拥有在线仓库后，你可以告诉 Git 将项目文件复制到那里。Xcode 4 将将包含此操作的 UI 支持。在编写本文时，从命令行执行此操作更为简单。\n\
  \n在终端中，`cd` 到带有原始源码的项目目录。例如，如果目录是 `/MyProjectsX4/LocalGit`，输入：\n\n```bash\ncd /MyProjects/X4/LocalGit\n\
  ```\n\n接下来，告诉 Git 你将使用该远程仓库。在单行输入：\n\n```bash\ngit remote add <RepositoryName> git@github.com:<YourGitHubUserName>/<RepositoryName>.git\n\
  ```\n\n要复制文件，输入：\n\n```bash\ngit push <RepositoryName> --all\n```\n\n`--all` 选项会复制所有分支，包括\
  \ master 分支。图 14.21 显示了结果。分支列在左侧的 `SwitchBranches` 选项下，活动分支的提交出现在主菜单下方的列表中。你可以选择左上角的\
  \ Source（源）菜单项，并深入源代码查看。\n\n图 14.21\n\n复制后检查在线仓库。为了清晰起见，此项目又添加了几个提交。\n\n\n\n\n它探索了\
  \ Xcode 内置的新型 Git 特性，介绍了 Git 版本控制实用程序以及新的版本编辑器（Version Editor）工具。最后，它演示了如何将本地 Git\
  \ 功能与流行的 GitHub 网站集成，以进行团队开发和远程备份。\n\n# 第三部分：创建快速且可靠的代码\n\n## 本部分内容\n\n- 第 15 章：代码分析与调试入门\n\
  - 第 16 章：使用 Instruments 进行代码测试\n- 第 17 章：创建单元测试\n\n## 第 15 章：代码分析与调试入门\n\n## 本章内容\n\
  - 使用控制台\n- 使用断点\n- 使用变量视图（Variables View）\n- 使用断点操作（breakpoint actions）\n- 配合命令行调试工作\n\
  \nXcode 工具链包含了一套强大的代码分析、代码纠正和调试工具。其中某些工具运行在 Xcode 主编辑器之外，并将在后续章节中介绍。本章讨论了 Xcode\
  \ 自身内置的功能：代码分析器、提示与问题（tips and issues）、调试区域，以及项目导航器（Project Navigator）中专门用于调试的其他其他选项。\n\
  \n通过这些功能，你可以执行以下任务：\n\n- ![bl.eps](img/bl_fmt.jpeg) 在输入代码时检查代码问题\n- ![bl.eps](img/bl_fmt.jpeg)\
  \ 查看可以帮助你修复问题的提示\n- ![bl.eps](img/bl_fmt.jpeg) 分析代码以揭示更复杂的问题\n- ![bl.eps](img/bl_fmt.jpeg)\
  \ 在应用程序运行时向名为控制台（console）的窗口记录消息——通常用于提供实时诊断信息\n- ![bl.eps](img/bl_fmt.jpeg) 查看之前运行的控制台输出\n\
  - ![bl.eps](img/bl_fmt.jpeg) 使用一个或多个断点在代码的任何位置暂停执行\n- ![bl.eps](img/bl_fmt.jpeg)\
  \ 添加条件断点，当指定条件为真时暂停代码\n- ![bl.eps](img/bl_fmt.jpeg) 逐行或逐方法步进代码\n- ![bl.eps](img/bl_fmt.jpeg)\
  \ 在断点处查看对象属性并列出其内容\n- ![bl.eps](img/bl_fmt.jpeg) 监控活动线程的状态\n- ![bl.eps](img/bl_fmt.jpeg)\
  \ 在断点处触发外部事件，包括声音或脚本\n\nXcode 调试工具是一个名为 `GDB`（GNU Project Debugger）的开源命令行调试器的窗口化前端。`GDB`\
  \ 增加了额外的低级选项，例如内存的直接十六进制转储（hex dumps）、对象列表以及数百种其他功能。你可以通过在 `Console` 窗口输入命令来访问这些功能。`GDB`\
  \ 是一个巨大且复杂的工具，这些高级功能是可选的。没有它们你也可以工作得高效高效，但了解它们的存在是有用的。\n\n![mac_note.eps](img/mac_note_fmt.jpeg)\
  \ **注意**\n`GDB` 和调试器支持非常高级的选项（例如远程调试），这些超出了本书的范围。关于调试器功能的权威指南是文档中的《Xcode Debugging\
  \ Guide》。你可以在网上找到最新版本。由于 URL 会经常变化，请搜索其名称。\n\n![mac_note.eps](img/mac_note_fmt.jpeg)\
  \ **注意**\n\nXcode 的未来版本将默认使用另一种名为 `LLDB`（Low Level Debugger）的替代低级调试器。你可以在 Xcode\
  \ 项目的构建设置中手动选择 `LLDB`。`LLDB` 比 `GDB` 快一些，但目前没有其他明显的区别。最终 `LLDB` 将扩展以允许高级的脚本化调试。由于它仍处于开发阶段，此处不再进行进一步讨论。\n\
  \n### 检查与分析代码\n\n在输入代码时就写正确代码比以后再它要高效得多。为了帮助你实现这一目标，Xcode 4 会在你编辑时检查代码并报告问题。\n\n\
  ### 在输入代码时检查\n\n此功能是自动开启的。一旦你开始打字，它就会工作。可疑的代码会被下划线或标记一个小箭头，代码左侧的行槽（gutter）会出现警告或错误图标。如果你打开\
  \ `Issue navigator`（问题导航器），你可以看到每个问题的详细描述，如图 15.1 所示。\n\n![mac_note.eps](img/mac_note_fmt.jpeg)\
  \ **注意**\n问题检查器与构建期间使用的代码解析器相同。它标记相同的错误并生成相同的错误信息，但它在后台运行并在你编辑时解析代码。\n\n问题检查器相当智能，但可能会缓慢。几秒钟的延迟并不起见，在较大的文件中延迟可能会达到\
  \ 10 秒或更多。它不理解部分编辑，因此它报告的错误可能仅仅是因为你还没有输入完完整的一行代码而存在。\n\n你的 Mac 速度越快，就越能依赖于此功能。遗憾的是，在较慢的硬件上，它的用处较小。由于延迟，在你修复问题后，问题仍可能继续被标记。在极端情况下，你可能会浪费时间尝试修复正确的代码，因为解析器正在追赶你最近的编辑。Xcode\
  \ 也可能因为延迟而漏掉错误。\n\n这是一个强大的功能，但你应该谨慎地对待它。不要假设它是无无不击的——它并非如此。\n\n图 15.1\nXcode 在这一行代码中标记了两个错误——一个缺失的分隔符和一个拼写错误的类名。\n\
  \n![9781118007594-fg1501.tif](img/9781118007594-fg1501.tif)\n\n![mac_caution.eps](img/mac_caution_fmt.jpeg)\
  \ **警告**\n在你调用一个方法但在定义它之前，Xcode 会显示警告。\n\n### 使用 Fix-It 提示\n\n如果你点击行槽中的问题标记，Xcode\
  \ 可能会建议一个可能的修复，如图 15.2 所示。要接受修复，请双击建议。Fix-It 功能能够捕捉明显的错误，但它并不是一个完整的专家系统。例如，它对类初始化中常用的\
  \ `self = [super init]`赋值感到困惑。它认为错误的条件并给出相应的修复。\n\n丰富的开发者会很容易区分有帮助和误导性的 Fix-It 建议。新手应该意识到，此功能并不是编写良好代码的替代品，而且它的建议可能无法修复代码。它是修复各种问题的理想工具，但并不是一个全面的教学或训练工具。\n\
  \n图 15.2\n使用 Fix-It 功能\n\n![9781118007594-fg1502.tif](img/9781118007594-fg1502.tif)\n\
  \n![mac_note.eps](img/mac_note_fmt.jpeg) **注意**\n如果 Xcode 无法建议 Fix-It 提示，它会显示简短的问题摘要。Fix-It\
  \ 提示仅适用于所有问题的子集。如果 Xcode 没有提供，请不要感到意外。\n\n### 使用静态代码分析器\n\nXcode 4 包含一个静态代码分析器，旨在标记更深层次的问题，例如代码逻辑和内存管理错误。它对于后者特别有用，并且非常擅长发现并高亮可能泄漏的代码。\n\
  \n要分析代码，从 Xcode 主菜单中选择 `Product⇒Analyze`。Xcode 会构建项目并添加一次额外的分析过程。问题将在代码和 `Issues\
  \ navigator` 中以蓝色高亮显示，如图 15.3 所示。这种高亮足够复杂，可以显示执行逻辑和变量依赖链。\n\n图 15.3\n问题以蓝色高亮显示。\n\
  \n![9781118007594-fg1503.tif](img/9781118007594-fg1503.tif)\n\n![mac_note.eps](img/mac_note_fmt.jpeg)\
  \ **注意**\n分析器显示可能的问题。它没有为这些问题提供修复建议——但问题描述通常足够详细，足以提示需要修复的地方。\n\n\n\n\n\n# 开始调试\n\
  \n问题导航器（Issues navigator）和静态分析器（Static Analyzer）有助于发现基本的语法错误和简单的逻辑错误。但 bug 通常更为复杂，并且只有在运行代码时才会出现。Xcode\
  \ 4 调试器包含一组工具，用于在代码运行时进行检查。\n\n调试器出现在自己的区域中，默认是隐藏的。要显示它，请点击 Xcode 窗口左上角三个图标中间的一个。你也可以在\
  \ Xcode 主菜单中选择 `View⇒Show Debug Area`（视图⇒显示调试区域）。调试区域出现在屏幕底部，代码编辑器下方。三个活跃窗格：\n\n\
  ![bl.eps](img/bl_fmt.jpeg) 迷你工具栏：这些按钮用于断点。你可以使用它们在暂停后进行单步执行或重启执行。\n\n![bl.eps](img/bl_fmt.jpeg)\
  \ 左侧窗格中名为 `Variables View`（变量视图）的分级对象查看器：该查看器以树的形式显示对象，可以展开以显示其内容。与工具栏一样，此窗格用于配合断点工作时检查对象并查看其内容。\n\
  \n![bl.eps](img/bl_fmt.jpeg) 右侧窗格中的控制台窗口：控制台显示来自应用程序和操作系统的消息。\n\n你可以通过控制台上方的三个按钮选择显示这两个窗格之一或两者。你也可以通过点击并拖动工具栏下方的线条来调整整个区域的大小——默认情况下该区域通常太小——并通过点击并拖动左右窗格之间的分割点来移动分割位置。\n\
  \n![mac_tip.eps](img/mac_tip_fmt.jpeg) 提示\n\n在 Xcode 3 中，调试器出现在一个独立的浮动窗口。你可以通过打开新标签页、显示并调整调试区域直到其填满编辑器窗口，然后将其拆离来模拟这种效果。在运行调试器的同时让代码可见是有用的。但分屏式设计可能会让人感觉很别扭，特别是在较小的显示器上。\n\
  \n可选，你可以显示左侧的导航器区域（Navigator area）。图 15.4 显示了在断点处显示的典型组合视图，包括 `Debug Navigator`（调试导航器）、显示断点位置的代码编辑器，以及屏幕底部的两个调试区域窗格。\n\
  \n![mac_tip.eps](img/mac_tip_fmt.jpeg) 提示\n\n如果你需要全屏运行应用程序，可以通过选择 `Product⇒Window\
  \ Behavior⇒Xcode in Front` 将一个较小版本的调试器窗口放在其前面。当 Xcode 命中断点时，该窗口会扩大以显示更大版本的调试器窗口。\n\
  \n图 15.4\n\n调试区域左侧的 `Debug Navigator` 是可选的。你可以隐藏它以最大化代码视图。\n\n![9781118007594-fg1504.tif](img/9781118007594-fg1504_fmt.jpeg)\n\
  \n# 使用控制台\n\n控制台是一个文本输出终端，等同于 UNIX 的 `stdout`（标准输出文件），它通常被路由到显示器而不是写入磁盘。它显示四种消息：\n\
  \n![bl.eps](img/bl_fmt.jpeg) 系统生成的消息：控制台消息包括自动生成的的时间戳和其他辅助信息。\n\n![bl.eps](img/bl_fmt.jpeg)\
  \ 使用代码中的 `NSLog` 或 `printf` 语句创建的自定义消息：使用自定义消息来检查程序流、转储对象属性信息并监控变量值。\n\n![bl.eps](img/bl_fmt.jpeg)\
  \ 系统生成的警告：这些非常罕见。极少数 `Cocoa` 类会生成文本来报告错误或警告。Beta 版操作系统比正式版更容易生成警告。\n\n![bl.eps](img/bl_fmt.jpeg)\
  \ 崩溃转储（Crash dumps）：这些也被称为回溯（backtraces）和栈转储（stack dumps），它们列出了导致崩溃的消息和事件。\n\n你可以通过控制台左上角的输出选择菜单选择部分或全部消息。以下是你的选项：\n\
  \n![bl.eps](img/bl_fmt.jpeg) 所有输出（All Output）：显示所有消息\n\n![bl.eps](img/bl_fmt.jpeg)\
  \ 调试器输出（Debugger Output）：显示系统消息、崩溃报告和错误消息\n\n![bl.eps](img/bl_fmt.jpeg) 目标输出（Target\
  \ Output）：显示来自应用程序的消息\n\n你还可以使用 `Clear`（清除）按钮清除控制台的所有输出。\n\n## 创建自定义消息\n\n你可以在代码的任何地方包含对\
  \ `printf` 的调用向控制台写入消息。例如，\n\n```\nprintf(“This is a message”);\n```向控制台写入 `This`\
  \ `is` `a` `message`。支持所有的标准 `printf` 格式化功能。\n\n如果你编写 Objective-C 而不是 C 或 C++，`NSLog`\
  \ 函数会更全面。它包含了额外的格式化和输出选项，这些选项在 `printf` 中不可用，代价是语法稍显笨拙。例如，要写入文本字符串，必须用 Objective-C\
  \ 的 `@` “对象化”特征为其加前缀：\n\n```objc\nNSLog(@”This is a message”);\n```\n\n`NSLog` 支持标准的\
  \ `printf` 格式化功能，并增加了一个新功能——`%@` ，用于显示对象的信息。表 15.1 总结了最有用的选项。\n\n![/Table 15.1](img/9781118007594-tb1501.jpg)\n\
  \n例如，显示整数的值使用：\n\n```objc\nNSLog(@”Int value is: %i”, someInt);\n```\n\n`NSLog`\
  \ 支持标准的 `printf` 格式化功能，并增加了一个新功能——`%@` ，用于显示对象的信息。表 15.1 总结了最有用的选项。\n\n```objc\n\
  NSLog(@%@”, someObject);\n```\n\n注意第一个 `@` 是格式化前缀，第二个 `@` 选择对象。使用自定义消息\n\n你可以使用这种技术来记录事件——例如，通过写入消息来确认方法何时被调用。你还可以使用消息来列出变量和值、显示循环计数等。\n\
  \n与断点不同，消息不会中断执行。当你想要检查事件序列时，它们通常更快且提供的信息更多，但它们没有提供探索内存或检查条件执行的选项。\n\n![mac_caution.eps](img/mac_caution_fmt.jpeg)\
  \ 注意\n\n在循环中使用消息要小心。没有什么能阻止你在每次循环重复时都写一条消息，但这可能会产生成百上千条消息。有选择地使用消息是良好的习惯。不要忘记你可以用自定义代码包围日志消息以创建条件日志。例如，你可能只记录循环的第十或第一百。\n\
  \n![mac_caution.eps](img/mac_caution_fmt.jpeg) 注意\n\n`NSLog` 是很慢的，你绝对希望在生产代码中包含它。你可以手动注释掉所有的\
  \ `NSLog` 语句，但更容易的方法是在项目的 .pch 文件中包含一行带有 `#define NSLog` 的代码。这会重新定义 `NSLog` 为空功能并将其从项目中消除。如果你需要继续调试，可以注释掉这一行重新启用日志。\n\
  \n\n\n\n\n当应用程序崩溃时，控制台会自动出现并显示一系列诊断消息，这些消息可以帮助你发现崩溃的原因。\n\n你的项目经常会无意中崩溃。但作为一个演示\
  \ Xcode 如何处理崩溃事件的练习，你可以故意制造一个崩溃。将以下代码行添加到 iOS 项目的 `app delegate` 的 `application`\
  \ `didFinishLaunchingWithOptions:` 方法中，例如第 7 章中的 IB 项目：\n\n```\n[window thisWillCrash];\n\
  ```\n\n由于 `window` 对象没有名为 `thisWillCrash` 的方法，因此当程序尝试执行这行代码时，它就会崩溃。\n\n图 15.6 显示了结果。如果它还没有可见，`Debug\
  \ Navigator`（调试导航器）会自动出现在左上角。导致崩溃的消息会用黑色高亮显示。与崩溃相关的内部消息（Internal messages）以较浅的灰色显示。\n\
  \n图 15.6\n显示崩溃事件\n\n![9781118007594-fg1506.tif](img/9781118007594-fg1506_fmt.jpeg)\n\
  \n你可以立即看到崩溃发生在 `IBAppDelegate` 对象的 `application` `didFinishLaunchingWithOptions:`\
  \ 方法中。在较大的项目中，这提供了足够的信息来找到包含 bug 的文件。\n\n顶部面板显示了崩溃点附近代码的反汇编。这通常用不大。iOS 应用程序会捕获崩溃事件，这段代码通常是\
  \ iOS 崩溃处理程序的一部分。由于它是用汇编语言编写且属于 iOS 内部代码，你通常可以忽略它。如果崩溃是以一种不受控的方式发生的，并且你精通汇编语言，你可能能够从此列表中提取出有用信息。但使用\
  \ Xcode 的其他调试工具通常更简单、效率更高。\n\n底部面板显示了回溯（backtrace）/堆栈转储（stack dump）。这是 `Debug Navigator`\
  \ 中所示消息列表的更详细版本。\n\n图 15.7 显示了一个更清晰的视图，隐藏了 `Debug Navigator` 以展开底部面板并使回溯更易于阅读。控制台列出了崩溃原因：`“unrecognized\
  \ selector sent to instance 0x4d278f0”`。这告诉你该地址的对象接收到了一个它无法执行的方法调用。\n\n![mac_note.eps](img/mac_note_fmt.jpeg)\
  \ 注意\n\nOS X 应用程序崩溃时并不总是显示回溯。回溯的可用性似乎是随机的，部分取决于崩溃原因，部分取决于操作系统的版本。当没有回溯时，控制台会显示一个简单的错误描述，而不包含其他信息。还要注意，与\
  \ iOS 应用程序不同，“未识别的选择器”（unrecognized selector）异常不会导致 Mac 应用程序崩溃。\n\n图 15.7\n更清晰的崩溃视图，隐藏了\
  \ `Debug Navigator`\n\n![9781118007594-fg1507.tif](img/9781118007594-fg1507_fmt.jpeg)\n\
  \n下一行包含了补充信息。在本例中，包含了导致崩溃的对象和方法。这里显示的额外信息取决于崩溃的类型以及相关的对象。\n\n回溯是导致崩溃的消息和事件按时间顺序列表，最近的事件位于顶部。最后几条消息通常是操作系统内部的。要找到你代码中导致问题的事件，请向下查看第二列直到找到你的应用程序名称。右侧的事件触发了崩溃。之前的事件可能对此产生了影响。\n\
  \n该列表通常充满了“噪声”：关于内部操作系统对象和消息提供了大量细节，这些细节可能在文档中并没有描述。通常情况下，你可以忽略大部分噪声，专注于你代码中产生问题的事件。当你修复代码中的\
  \ bug 时，你通常会发现周围的操作系统功能运行正常。\n\n![mac_caution.eps](img/mac_caution_fmt.jpeg) 警告\n\
  \n崩溃转储（Crash dumps）并不总是这么简单。如果你的应用程序出现严重的内存错误，它可能会停止而不显示任何崩溃信息。你通常可以依靠回溯来获取有用的提示。但有时你什么也得不到，寻找问题的唯一方法是使用断点（breakpoints）。极少数情况下，你可能会遇到无法修复的操作系统内部崩溃。这在测试版操作系统最为明显，但在生产环境代码中也会发生——尽管极其罕见。当操作系统对象崩溃时，可能是因为你初始化不当。但有时操作系统本身存在\
  \ bug，你必须通过其他方式解决问题。\n\n## 查看多个日志\n\n你可以使用图 15.8 所示的 `Log Navigator`（日志导航器）来比较不同运行的控制台输出。每次构建和调试运行都会向左侧列表添加一个新条目。点击\
  \ `Build` 条目显示构建信息，包括错误和警告。点击 `Debug` 条目显示该运行的控制台输出。\n\n图 15.8\n在 `Log Navigator`\
  \ 中查看日志列表：`Debug` 日志显示控制台输出。`Build` 日志显示构建结果。\n\n![9781118007594-fg1508.tif](img/9781118007594-fg1508_fmt.jpeg)\n\
  \n例如，之前添加的日志已被修改，最近的 `Debug` 条目显示修改后的文本。虽然图中没有说明，但点击早之前的 `Debug` 条目显示本章之前示例的原始控制台输出。\n\
  \n会话不会随项目一起保存，当关闭项目时条目列表及其内容会被清除。\n\n![mac_tip.eps](img/mac_tip_fmt.jpeg) 提示\n\n\
  你可以拖选 `Console` 内容并使用 Xcode `File⇒Save As` 选项将其写入文件。\n\n## 使用断点\n\n断点是代码中有意的暂停。当\
  \ Xcode 遇到断点时，它会停止并进入特殊模式。你可以通过这种模式查看内存、列出对象并逐行执行代码。\n\n断点调试非常强大，但过度依赖它会降低速度。为了提高效率，请选择性地使用断点调试，不要认为它是所有问题的解决方案。例如，如果你在\
  \ iOS 应用中没有正确管理内存，内存错误可能会发生在代码的任何地方。单步调试可以告诉你对象或属性为空，但无法告诉你哪行代码释放了它。\n\n### 使用简单断点\n\
  \n为了探索断点，创建一个简单的应用程序作为测试。在 Xcode 中使用 `File⇒New` 创建一个新的 OS X Application 并命名为 `BreakpointTest`。在\
  \ `App Delegate` 的 `applicationdidFinishLaunching:` 方法末尾添加一个计数循环：\n\n```\nfor (int\
  \ i = 0 ; i<10; i++) {\n    NSLog(@\"Count: %i\", i);\n}\n```\n\n该代码从 0 计数到 9，并将每次递增记录到控制台。打开并调整控制台窗口，然后构建运行应用程序。结果所示。\n\
  \n当你运行代码时，计数几乎瞬间完成。有了断点，你可以手动单步循环并检查每次发生了什么。\n\n图 15.9\n向控制台记录简单的计数器\n\n![9781118007594-fg1510.tif](img/9781118007594-fg1510_fmt.jpeg)\n\
  \n插入断点\n\n要插入断点，点击 `for…` 行左侧的行槽区域，如图 15.10 所示。行槽中会出现一个箭头指示。注意，Xcode 左上角工具栏中停止图标右侧的调试模式按钮被选中并高亮。这告诉你\
  \ Xcode 正在运行调试模式，且断点处于激活状态。\n\n图 15.10\n插入断点\n\n\n\n\n\n![9781118007594-fg1510.tif](img/9781118007594-fg1510_fmt.jpeg)\n\
  \n再次构建并运行应用程序。这次运行会在断点处自动暂停，显示如图 15.11 所示。代码编辑器中高亮了断点，调试导航器（Debug Navigator）出现在左侧，变量视图（Variables\
  \ View）出现在屏幕底部。现在，你可以使用稍后会详细描述的变量视图来检查对象，或者继续手动步执行代码。\n\n## 在断点处继续\n\n当 Xcode 在断点处暂停时，你可以使用工具栏来控制执行如何继续。这些按钮具有以下功能：\n\
  \n![bl.eps](img/bl_fmt.jpeg) **显示/隐藏调试区域**：点击此显示或隐藏屏幕底部的调试区域。此选项等同于 Xcode 右上角工具栏中的显示按钮。\n\
  \n![bl.eps](img/bl_fmt.jpeg) **继续 (Continue)**：点击此从暂停的地方继续运行应用程序。它将继续运行，直到终止或遇到另一个断点。\n\
  \n![bl.eps](img/bl_fmt.jpeg) **逐行跳 (Step Over)**：执行当前行并停止在下一行。这等同于其他调试器中的单步选项。\n\
  \n![bl.eps](img/bl_fmt.jpeg) **逐入 (Step Into)**：进入一个方法或函数。默认情况下，Xcode 会运行一个方法或函数而不进入其内部；你可以看到结果，但无法逐行查看其内部代码。当你想要检查方法或函数内部发生了什么时，使用此选项。\n\
  \n![bl.eps](img/bl_fmt.jpeg) **逐出 (Step Out)**：跳出当前方法或函数——换句话说，它运行到结束或返回——然后进入调用它的函数或方法。如果没有调用函数或方法，此选项将跳到\
  \ OS 内部的汇编列表。\n\n图 15.11\n在断点处检查应用程序的状态\n\n![9781118007594-fg1511.tif](img/9781118007594-fg1511_fmt.jpeg)\n\
  \n在此示例中，使用“逐行跳”按钮手动继续计数。你看到代码在 `for…` 循环的第一行和第二行之间循环。`i` 循环计数器的值随着每次重复而增加。\n\n当最后一次重复时\
  \ `i` 为 9 时，最后一次“逐行跳”将你带到方法的末尾。如果你再次点击“逐行跳”，你将看到 Objective-C 运行时方法分发代码的汇编列表。这是 OS\
  \ 内部代码。尽管你可以继续逐语句执行它，但这通常不是有用的操作。\n\n## 启用和禁用断点\n\n你可以通过点击断点侧的槽箭头来禁用单个断点，箭头会变成半透明。禁用的断点保留在原地，但会被\
  \ Xcode 忽略。（它还会保留其设置，下文所述。）\n\n你还可以点击 Xcode 左上角的调试箭头来禁用所有断点。这将全局关闭调试模式。与之前一样，所有断点保留在内存中，并作为项目的一部分保存。但当全局禁用调试模式时，Xcode\
  \ 会忽略它们。\n\n![mac_tip.eps](img/mac_tip_fmt.jpeg) **提示**\n你可以点击任何断点并拖动它来移动位置。\n\n\
  ## 使用变量视图\n\n图 15.12 显示了扩展到全屏尺寸的变量视图。视图显示了应用程序中的对象列表，每个对象旁边都有展开三角形。点击三角形可以显示对象的内容，包括命名属性。在相关情况下，属性可能会关联内存地址或字面量值。当前对象——触发断点的对象——被标记为\
  \ `self`。\n\n标准系统对象（如 app delegate、窗口和视图）具有复杂的层次结构。在图中，你可以看到 app delegate 的 `window`\
  \ 对象包含很长的属性列表。该列表中的许多项本身就是对象，并且具有你可以探索的进一步的子属性。\n\n由于视图未经过过滤，因此要找到有用的细节可能很困难。通常情况下，除非你有充分的理由去检查它们，否则可以忽略内部属性和对象。在这个示例中，`window`\
  \ 的所有属性都是无关紧的。但在更复杂的项目中，你可能想要检查 `_delegate`、`_initialFirstResponder` 或 `_frame`\
  \ 属性，以查看 `window` 是否正确初始化。\n\n![mac_tip.eps](img/mac_tip_fmt.jpeg) **提示**\n你还可以通过将鼠标光标悬停在对象上来查看其内容和结构。会出现一个黄色框，带有展开三角形，可以通过它们深层查看对象层次结构。这是一个非常有用的调试工具。\n\
  \n图 15.12\n使用变量视图探索对象的内容\n\n![9781118007594-fg1512.tif](img/9781118007594-fg1512_fmt.jpeg)\n\
  \n![mac_note.eps](img/mac_note_fmt.jpeg) **注意**\n系统对象的实例变量通常以下划线字符为缀。它们可能没有列在文档中。检查它们可以让你对系统对象是如何组织的以及它们如何相互运作产生有用的见解。\n\
  \n此示例中有用的细节是 `i = (int) 3`。你看到值初始化为 0。图 15.13 显示了值是如何更新的。图 15.13\n结合变量视图信息的典型调试会\n\
  \n![9781118007594-fg1513.tif](img/9781118007594-fg1513_fmt.jpeg)\n\n![mac_tip.eps](img/mac_tip_fmt.jpeg)\
  \ **提示**\n你不需要使用右键菜单来显示值，只需双击即可。\n\n## 处理值\n\n变量视图不仅仅是被动的显示。右键点击变量可以显示图 15.14 所示的菜单。你可以使用这里的选项手动启用和禁用格式化并输入信息。例如，如图所示“编辑值”，并在\
  \ `i` 旁框中输入 0。这重置了计数器。现在你可以从头重新计数。\n\n图 15.14\n在断点后使用右键菜单编辑值\n\n![9781118007594-fg1514.tif](img/9781118007594-fg1514_fmt.jpeg)\n\
  \n## 使用表达式\n\n你可以使用表达式向变量视图添加自定义项。表达式是对对象、属性或变量的自定义列表。你可以使用表达式从对象中提取属性和值，而无需深入层次结构来查找它们。表达式可以包含标准的\
  \ C、C++ 和 Objective-C 代码，但不需要分号终止符。表达式必须带有类型转换以定义类型。\n\n图 15.15 显示了一个示例表达式。在变量视图的任意位置右键点击，选择“添加表达式”，输入以下字符串并点击保存。\n\
  \n```\n(NSString *) [window description]\n```\n\n你在视图中看到一个新的条目，它显示了在 `window` 对象上运行\
  \ `description` 方法的结果。将 `window` 替换为 `aNotification`，即可看到关于应用程序完成启动序列时发布的初始通知的信息。\n\
  \n图 15.15\n创建自定义表达式以显示感兴趣的值\n\n表达式具有挑战性但也非常强大。显示特定值或属性所需的语法可能会变得复杂，你通常需要不断尝试才能找到正确答案。但如果你能精通表达式，就可以显著提高调试效率。你就可以一眼查看最重要的属性和变量，而无需打开其他对象来显示它们。\n\
  \n\n\n\n\n![9781118007594-fg1515.tif](img/9781118007594-fg1515_fmt.jpeg)\n\n# 使用数据格式化器\n\
  \nVariables View（变量视图）中出现的每一个项目都经过了格式化，格式信息由数据格式化器设置。所有标准数据类型都有预定义的格式化器。在实践中，这些定义定义了可能不需要的额外细节。在右键上下文菜单中取消勾选`Enable\
  \ Data Formatters`（启用数据格式化）可以隐藏这些细节，留下更简短的关键信息摘要。\n\n你也可以为某些数据类型自定义格式。使用`Edit Summary\
  \ Format`（编辑摘要格式）选项会显示一个对话框，其中有一个可编辑的字段用于定义格式。格式化器类似于表达式，但语法更复杂、更通用。格式化器包含在大括号之间，通常包含一个类型转换。它还可能包含一个或多个宏占位符来表示输入数据，以及一个选择四个显示选项之一的格式引用。表\
  \ 15.2 总结了关键选项。\n\n![/Table 15.2](img/9781118007594-tb1502.jpg)\n\n例如，此行代码在选定的变量上运行标准的\
  \ Objective-C `sel_getName` 函数，并将描述输出为摘要字符串：\n\n```\n{(char *) sel_getName($VAR)}:s\n\
  ```\n\n数据格式化器可以创建一些非常复杂的效果。你几乎完全自由地选择和组合应用程序中任何对象的数据，并按你意的方式显示。然而，编程成本可能是巨大的。自定义数据格式化器最好留给更复杂的项目，那里\
  \ Xcode 其他功能无法以有用的方式显示数据。\n\n![mac_tip.eps](img/mac_tip_fmt.jpeg) Tip\n\n你可以定义自己的自定义数据格式化器并将其导入\
  \ Xcode。该过程中等复杂，但你只需要操作一次。之后你可以在任何项目中重用这些格式化器。详情请参阅文档中`Xcode Debugging Guide`的`Viewing\
  \ Variables and Memory`（查看变量和内存）章节。\n\n# 添加观察点\n\n观察点（Watchpoint）与断点（Breakpoint）松地相关，但它是在变量被修改时触发的。使用右键上下文菜单中的`Watch\
  \ Address of…`选项来创建观察点，如图 15.16 所示。无法使用代码编辑器添加观察点。\n\n当观察点被触发时，Xcode 会向控制台记录一条消息，并在代码编辑器中高亮修改该变量的代码行。消息列出了变量在观察点触发前后的值。\n\
  \n![mac_caution.eps](img/mac_caution_fmt.jpeg) CAUTION\n\n无法手动删除观察点。当执行流超出所观察变量的作用范围时，观察点会自动删除。这种行为很奇怪且并不完全有帮助；无论好坏，观察点与断点仅是松地相关。在内部，它们会修改栈。这意味着如果你为局部栈上变量设置了观察点，系统调用可能会崩溃，因为此操作修改了栈。\n\
  \n图 15.16\n\n创建和使用观察点\n\n![9781118007594-fg1516.tif](img/9781118007594-fg1516_fmt.jpeg)\n\
  \n# 查看和编辑内存\n\n你可以使用菜单中的`View Memory of…`选项显示十六进制内存转储，如图 15.17 所示。转储显示在编辑器区域，并以选定变量的地址开头。你可以重新排列显示以显示不同的字节分组和转储长度。十六进制转储在处理文本或字节级缓冲区时非常有用。但除非你可以在脑中读取原始十六进制并将其转换为代码，否则其他应用程序的应用是受限的。\n\
  \n显示器包含一个编辑器，你可以手动编辑、插入或删除单个字节。这是一个强大但危险的低级功能。如果不加区分使用，它可能会破坏构建，但在测试时微调字节级特征有时是有用的。\n\
  \n图 15.17\n\n在内存中查看和编辑原始十六进制\n\n![9781118007594-fg1517.tif](img/9781118007594-fg1517_fmt.jpeg)\n\
  \n# 使用高级断点功能\n\n断点包含一系列可选的高级功能。你可以使用这些功能创建条件断点（断点会被选择性触发），以及触发动作（外部事件）。\n\n## 编辑断点\n\
  \n要访问更高级的功能，右键点击断点显示右键上下文菜单。可用选项有：\n\n- ![bl.eps](img/bl_fmt.jpeg) `Edit Breakpoint`（编辑断点）：显示本章稍后描述的对话框。\n\
  - ![bl.eps](img/bl_fmt.jpeg) `Disable Breakpoint`（禁用断点）：这等同于之前描述的点击断点来禁用。\n- ![bl.eps](img/bl_fmt.jpeg)\
  \ `Delete Breakpoint`（删除断点）：移除断点及其所有现有设置。\n- ![bl.eps](img/bl_fmt.jpeg) `Reveal\
  \ in Breakpoint Navigator`（在断点导航器中显示）：打开断点导航器并高亮断点。\n\n## 创建条件断点\n\n你可以通过两种方式创建条件断点。按照以下步骤执行第一个选项：\n\
  \n1. 删除循环初始化点的原始断点。\n2. 在带有 `NSLog` 语句的行添加新断点。\n3. 右键点击断点，选择`Edit Breakpoint`。\n\
  4. 将 `Ignore` 值设置为 `5`，如图 15.18 所示。\n5. 编译并运行应用程序。\n\n断点在循环运行五次时被忽略，直到第六次触发。该选项对于预先知道循环或方法执行次数的场景非常理想。\n\
  \n图 15.18\n\n创建延迟断点\n\n![9781118007594-fg1518.tif](img/9781118007594-fg1518_fmt.jpeg)\n\
  \n你可以通过将忽略计数重置为零并在`Condition`框中输入 `i == 5` 来创建类似的结果。在这个简单的示例中，这产生了相同的结果。但`Condition`框要灵活得多。你可以引用范围内的任何变量并使用任何有效代码作为条件。\n\
  \n例如，如果你将 `i == 5` 替换为 `aNotification`，只要 `aNotification` 不为零断点就会触发。在这个示例中，条件始终成立。在更复杂的应用程序中，`aNotification`\
  \ 可能遵循某些功能或事件。你可以使用此功能为调试添加智能，创建引用远程对象的条件。\n\n## 在断点处触发动作\n\n`Actions` 功能是调试器中强大的选项之一。你可以利用它在断点触发几乎任何事件。例如，你可以：\n\
  \n- ![bl.eps](img/bl_fmt.jpeg) 运行 AppleScript\n- ![bl.eps](img/bl_fmt.jpeg) 向调试器发送文本命令\n\
  - ![bl.eps](img/bl_fmt.jpeg) 向控制台记录消息或朗读\n- ![bl.eps](img/bl_fmt.jpeg) 运行 UNIX shell\
  \ 命令\n- ![bl.eps](img/bl_fmt.jpeg) 播放声音\n\n你可以无限限制组合动作，通过 `+/-` 按钮添加和删除。你还可以同时运行多个脚本，或在运行\
  \ shell 命令的同时运行脚本。\n\n例如，从 Action 菜单中选择`AppleScript`选项并输入以下内容：\n\n```\ndisplay dialog\
  \ \"Breakpoint %B, Count: %H\"\n```\n\n勾选`Automatically continue after evaluating\
  \ actions`。选择 Done，然后编译并运行应用程序。\n\n![mac_note.eps](img/mac_note_fmt.jpeg) NOTE\n\
  \n`%B` 列出断点位置，通常是方法名和行号。`%H` 列出断点被触发的次数。\n\n你不会看到图 15.19 显示的警框，因为你的应用程序拥有焦点。这是动作系统的一个缺点；除非你能强制获取焦点或动作不需要焦点，否则某些功能无法工作。\n\
  \n\n\n\n对于这个简单的示例，通过点击 Xcode 窗口中的任何地方来手动强制聚焦，从而将警框置于顶层。点击 OK 或取消，观察计数递增。通过更复杂的脚本，你可以从脚本代码中强制聚焦，并创建一个延迟循环，在继续执行之前短暂显示一下警框。\n\
  \n“操作”（Actions）几乎是无限可定制的。它们的限制仅取决于你的想象力和脚本技巧。一个关键点是，你不必将它们用于手动调试。你可以使用操作创建复杂的自动化测试工具，这些工具可以响应外部事件、记录代码路径并将变量值记录到文件中。你可以远程运行测试，通过电子邮件发送结果或将其上传到\
  \ Web 服务器。这些高级选项是专门化的，详细描述它们超出了本书的范围。但重要的是要理解，在包含操作之后，你的调试选项将变得更加开放且富有创意。\n\n图 15.19\n\
  使用简单脚本创建自定义断点警框\n![9781118007594-fg1519.tif](img/9781118007594-fg1519_fmt.jpeg)\n\
  \n### 使用断点导航器\n图 15.20 显示的断点导航器（Breakpoint Navigator）显示项目中所有断点的列表。你可以使用此列表来简化断点管理。你可以在单个窗口中启用、禁用和删除断点，无需查找并编辑相应的文件。右键菜单中的选项与单个断点的选项相似，但额外增加了一些：\n\
  \n![bl.eps](img/bl_fmt.jpeg) **移动断点到 (Move Breakpoints To):** 使用此项对断点进行分组。你可以通过一次菜单选择启用或禁用组中的每个断点。共有三组：Project、User\
  \ 和 `<project name>`。默认情况下，所有断点都在 `<project name>` 组中。目前没有创建更多自定义组的方法。但你可以通过 command-click\
  \ 任意数量的断点来创建一个手动多选。\n\n![bl.eps](img/bl_fmt.jpeg) **共享断点 (Share Breakpoints):**\
  \ 使用此选项将断点导出到文件，以便与其他开发者共享。\n\n图 15.20\n使用断点导航器\n![9781118007594-fg1520.tif](img/9781118007594-fg1520_fmt.jpeg)\n\
  \n### 调试多线程\n当应用程序具有多个并行线程时，调试变得更加复杂。断点挂起单个线程的执行，但其他线程继续运行。挂起它们是有用的，这样在你逐步执行应用程序时，其他事件就不会产生干扰。图\
  \ 15.21 展示了调试导航器的线程显示。要挂起一个线程，右键点击它并从菜单中选择 `Suspend Thread` 。\n\n![mac_caution.eps](img/mac_caution_fmt.jpeg)\
  \ **注意 (CAUTION)**\n显示底部的几个线程通常是系统线程。Xcode 允许挂起系统线程，但除非你有停止 OS 线程的充分理由，否则最好让它们保持运行。\n\
  \n图 15.21\n在调试导航器中挂起线程\n![9781118007594-fg1521.tif](img/9781118007594-fg1521_fmt.jpeg)\n\
  \n### 使用命令行调试\n控制台窗口底部的 `(gdb)` 文本是一个命令行提示符。你可以向 GDB 调试器输入文本命令，以显示标准调试工具无法访问的细节。\n\
  \nGDB 命令的完整列表包含数百条目，不太可能任何 Xcode 用户能记住所有命令。许多命令是 GDB 起源留下的遗留功能。尽管这些命令很有趣，但如果你在使用如\
  \ Objective-C 这样的高级语言，它们并不是必不可少的。其他命令可以提供有用的见解。表 15.3 显示了一小部分选择。\n\n图 15.22 显示了\
  \ GDB 命令行控制的示例。`help` 命令列出主要的命令组，`backtrace` 命令显示堆栈转储。注意，标准断点支持 GDB 命令。你可以输入命令作为断点操作，GBD\
  \ 将输出打印到控制台。使用此功能可以在不使用 `NSLog` 的情况下打印对象的额外信息，或修改测试条件。例如，一个断点可以自动设置或删除另一个断点。\n\n\
  ![/Table 15.3](img/9781118007594-tb1503.jpg)\n\n图 15.22\n使用 GBD 命令行\n![9781118007594-fg1522.tif](img/9781118007594-fg1522_fmt.jpeg)\n\
  \n![mac_tip.eps](img/mac_tip_fmt.jpeg) **提示 (TIP)**\n你可以使用向上和向下箭头滚动查看输入命令列表。例如，要在不重新输入的情况下重复命令，请先按向上箭头，然后按\
  \ Return 键。\n\n## 总结\n本章介绍了 Xcode 的调试区域。它探讨了控制台的功能，引入了变量视图（Variables View），并解释了如何使用它来修改和跟踪变量、查看其内容以及列出和编辑内存。\n\
  \n它讨论了 Xcode 简单的断点功能；演示了如何创建、编辑和删除断点；并解释了如何逐行执行代码，监控变量和结果。\n\n它还介绍了更多的断点功能，包括条件断点和操作。最后，它列出了调试环境中可用的一些命令行选项，并解释了如何探索其余内容。\n\
  \n## 第 16 章：使用 Instruments 测试代码\n## 本章内容\n* 开始使用 Instruments\n* 探索 Instruments 界面\n\
  * 对运行中的应用程序进行分析\n* 比较运行结果\n* 创建自定义模板和工具\n\n\n\nInstruments 运行在一个独立的窗口中，如图 16.1 所示。你可以通过两种方式启动它：\n\
  \n![bl.eps](img/bl_fmt.jpeg) 在 Xcode 主菜单中选择 Product⇒Profile 来构建项目并将其加载到 Instruments\
  \ 中。默认情况下，Instruments 会自动附加（设置为进行性能分析）当前项目。被监控的应用程序称为目标（target）。\n\n![bl.eps](img/bl_fmt.jpeg)\
  \ 从 Finder 或 Dock 独立启动 Instruments。Instruments 位于 Xcode 的主目录 `/Developer/Applications`\
  \ 下。当你手动启动 Instruments 时，你必须手动将其附加到某个目标。通常，目标是你的项目，但你也可以监控任何运行中的进程（具有某些局限性在本章稍后部分描述）。\n\
  \n图 16.1\n\nInstruments 的初始视图，显示了可用工具中的其中一个\n\n![9781118007594-fg1601.tif](img/9781118007594-fg1601_fmt.jpeg)\n\
  \n# 了解 Instruments\n\nInstruments 是一个用于系统事件和统计的多轨道录制机，类似于音乐或视频录制器。\n\n每个工具（instrument）将一种类型的数据——对象分配、处理器负载、用户事件等——记录在独立的轨道（或数据轨道）上。当你开始运行测试时，\
  \ Instruments 会初始化每个轨道，并开始用从目标收集的统计数据来填充它。Instruments 会记住每次测试运行的结果，你可以在 Instruments\
  \ 暂停时查看每次录制的内容。\n\n许多工具都包含过滤器，你可以使用它们来包含或排除某些事件子类型。例如，在监控对象和内存分配时，你可以排除所有底层的 `malloc`\
  \ 事件，以简化显示并更容易监控你感兴趣的对象级事件。\n\n除了时间线视图（time line view）外，大多数工具会在收集数据时显示各种统计数据。统计数据可能会以表格、图表、列表或其他摘要的形式。\n\
  \n![mac_note.eps](img/mac_note_fmt.jpeg) **注意**\n\nInstruments 非常庞大且复杂，几乎与 Xcode\
  \ 一样复杂。对每个元素的详细拆解将填满这本书。大多数功能可以通过合理的推测和实验来理解。本章没有列出所有功能，但它概述了你如何开始使用 Instruments，以便你能够自行探索并开始使用你可能认为最有用的工具。\n\
  \n# 探索 Instruments UI\n\n图 16.2 显示了 Instruments UI 更为典型的工作视图，这次显示的是 Allocations（分配）工具，它监控内存中的对象。该设计遵循标准的\
  \ OS X 指南，左上有一个选择区域，中间是活动区域，右侧是一个可以显示辅助信息的视图。活动区域分为顶部的时间线视图和底部的详情面板（detail pane）。窗口顶部的工具栏控制主应用程序功能。\n\
  \n选择区域称为工具面板（instruments pane），它包含跟踪（trace）中使用的所有工具的列表。每个工具都有一个展开三角形，用于显示之前运行的结果，以及一个信息图标，该图标可以显示用于精调录制的额外选项。\n\
  \n时间线视图称为轨道面板（track pane）。你可以使用工具面板底部的滑块来扩展轨道面板的比例尺。\n\n详情面板占据了显示器的底部。它包括一个左侧的区域区域，可以精调和过滤显示的信息，以及底部中间的显示面板，用于显示已选的信息。\n\
  \n右侧的扩展详情面板显示了可选的进一步细节，用于支持详情面板中的信息。在图中，扩展详情面板显示了堆栈跟踪（stack trace）。\n\n图 16.2\n\n\
  更详细查看 Allocations 工具\n\n![9781118007594-fg1602.tif](img/9781118007594-fg1602_fmt.jpeg)\n\
  \n你可以看到显示中存在大量的细节。Allocations 工具（参考图 16.2）字面上列列出了内存中的每一个对象。你可以监控特定类实例的创建和销毁，并为每个创建事件查看堆栈跟踪。你还可以获取有关创建和销毁对象的更通用统计数据、应用程序的总内存占用等。并不是所有工具都显示如此详细的细节；其他工具则是对不复杂的应用程序状态的简单摘要。\n\
  \n![mac_caution.eps](img/mac_caution_fmt.jpeg) **警告**\n\n某些功能在底层运行，因此你需要对 Cocoa\
  \ 和 OS X/iOS 内部原理有基本的了解，才能从某些工具中获得最大的收益。你可以在没有这些知识的情况下使用 Instruments，但你会错过那些更强大、更高效的功能。\n\
  \n![mac_note.eps](img/mac_note_fmt.jpeg) **注意**\n\n由于某些工具在操作系统运行时实际上字面上修改了内核，因此在授予底层访问权限之前，系统可能会要求你输入\
  \ OS X 用户名和密码。内核的变化是透明且暂时的。\n\n# 介绍工具栏\n\n工具栏包含最重要的控件，除非你使用右上角的按钮隐藏它，否则它是可见的。工具栏中的功能将在后续章节描述。\n\
  \n## 录制、暂停和循环控制\n\n巨大的 Record（录制）按钮开始并结束录制。在录制期间，标签会从 Record 变为 Stop（停止）。如果你正在录制管理\
  \ UI 事件的工具，标签将变为 Drive（驱动/）和 Record。\n\n![mac_caution.eps](img/mac_caution_fmt.jpeg)\
  \ **警告**\n\n当你对应用程序进行性能分析时，首先要为运行选择一个或多个工具，在本章稍后部分描述。然后 Instruments 在加载工具时会暂停，最终开始自动录制。如果你在对项目进行性能分析，在没有任何操作发生时点击\
  \ Record 按钮，Instruments 在准备就绪后开始录制。如果你在对其他现有进程进行性能分析，你需要手动启动录制。\n\nPause（暂停）按钮暂停录制。主时间指示器中显示的计时器停止，Instruments\
  \ 停止收集数据。事实上，计时器继续运行，再次点击暂停按钮，你会发现录制中出现了一个间隙，如图 16.3 所示。这不是一个核心功能，通常你可以忽略它。但有时你可能希望在不录制结果的情况下与应用程序交互。\n\
  \n图 16.3\n\n使用暂停按钮创建录制创建间隙\n\nLoop（循环）按钮在播放一次轨道和重复之间切换。你可以将此功能用于 UI 事件录制以创建多次测试运行。\n\
  \n## 菜单\n\n使用目标弹出窗口选择要录制的进程或进程。当你从 Xcode 分析项目时，项目在这里被预选。但你可以通过将其附加 Instruments 来分析任何运行中的进程，如图\
  \ 16.4 所示。\n\n手动附加比项目分析更有限制。例如，iTunes、Front Row、DVD 器和 QuickTime 等系统应用程序被故意从 Instruments\
  \ 中屏蔽，你无法从中收集数据。某些工具依赖于调试符号表。大多数应用程序不包含这些符号，因此你无法在底层对它们进行性能分析或测试。\n\n图 16.4\n\n\
  当你附加到进程时，弹出窗口显示所有运行的进程，包括你不想分析的进程。\n\n![9781118007594-fg1604.tif](img/9781118007594-fg1604_fmt.jpeg)\n\
  \n就像 Instruments 中的许多功能一样，目标菜单具有深层含义，你可以做出非常具体的选择。图 16.5 显示了目标菜单中的“编辑活动目标”（Edit\
  \ Active Target）子选项。你可以为目标定义环境变量，添加新的变量和启动参数，并选择应用程序可能的控制台之一。\n\n图 16.5\n\n处理目标设置\n\
  \n\n\n\n![9781118007594-fg1605.tif](img/9781118007594-fg1605_fmt.jpeg)\n\n![mac_tip.eps](img/mac_tip_fmt.jpeg)\
  \ 提示\n\n`Agents`（代理）和 `Daemons`（守护进程）视图非常有用，因为它们在一个单一且易访问的位置收集了每个系统项的默认 `plists`。要查看默认值，从列表中选择一个\
  \ `daemon` 或 `agent`，并点击对话框右下角的眼睛图标。你将看到 `plist` 的文本 XML 导出，其中包含字典中的键（keys）和值（values）。编辑\
  \ `plist`，请双击它。`Xcode` 将打开一个新的 `plist` 编辑器窗口。关于编辑 `plists` 的更多信息，请参附录 B。\n\n## 检查范围\n\
  \n使用三个检查范围按钮来设置显示的开始时间和终点时间。要设置开始时间，将时间线（后文将描述）中的位置光标拖到你选择的起始点，并点击最左侧的范围按钮。要设置结束时间，对最右侧的按钮重复此操作。要清除范围，点击中间按钮。\n\
  \n检查范围不会影响时间线。它不会缩放以填充屏幕，也不会修改位置光标。然而，它有时会影响在 `Instruments` 其他地方选择和显示的统计数据。\n\n\
  ## 时间/运行控制\n\n这显示了录制中经过的时间。你可以使用时间显示下方的箭头选择不同的运行记录。数字右侧的 `clock/run` 图标可以在当前录制位置和当前光标时间之间切换显示。\n\
  \n## 视图选择器\n\n三个视图按钮用于显示和隐藏各种可能的面板。你可以查看尽可能详细的信息，也可以隐藏除时间线显示以外的所有内容，如图 16.6 所示。通常情况下，运行\
  \ `Instruments` 时会显示左侧和下方的面板。\n\n图 16.6\n\n使用视图选择器隐藏除跟踪轨道（track lanes）以外的所有信息。这并不经常有用，但有时你可能希望最大化可见轨道数量，以简化多次比较。\n\
  \n![9781118007594-fg1606.tif](img/9781118007594-fg1606_fmt.jpeg)\n\n## 库按钮\n\n此按钮切换工具库的显示——这是一个列出所有可用工具的浮动窗口，如图\
  \ 16.7 所示。你可以使用窗口左下角的齿轮图标显示带有各种显示选项的菜单。窗口顶部的 `Library` 菜单显示工具组列表。你可以使用库创建创建自己的工具集，并将它们保存为模板——即用于分析相关应用程序元素的工具集。\n\
  \n图 16.7\n\n使用 `Library`s 视图选项在较小的显示器上节省空间。大图标细节非常精细，但在较小的显示器上会浪费空间。\n\n![9781118007594-fg1607.eps](img/9781118007594-fg1607_fmt.jpeg)\n\
  \n![mac_note.eps](img/mac_note_fmt.jpeg) 注意\n\n仅显示与当前项目平台匹配的工具；换句话说，OS X 项目只显示 Mac\
  \ 兼容工具，iOS 项目只显示 iOS 兼容工具。每个平台支持的工具之间存在显著差异。\n\n## 搜索字段\n\n你可以使用搜索字段为详情面板中的信息添加另一组过滤器。搜索操作取决于工具产生的数据，因此搜索是依赖上下文的。\n\
  \n图 16.8 显示了你如何过滤 `allocations`（内存分配）工具的输出，仅显示 `CFArray` 项。在你自己的项目中，你可以使用此功能监控你自己的自定义对象，同时隐藏所有其他活动。搜索字段很容易被忽略，但它是将海量数据过滤为少数精确针对的有用统计数据的一种非常强有的方法。\n\
  \n图 16.8\n\n使用搜索字段过滤 `allocations` 工具的输出，将数百项内容减少到仅两项。\n\n![9781118007594-fg1608.tif](img/9781118007594-fg1608_fmt.jpeg)\n\
  \n# 开始使用 Instruments\n\n`Instruments` 有一些特殊之处，熟悉它们最简单的方法是尝试一个实用的性能分析项目——一个监控 iOS\
  \ 应用中内存事件的项。\n\n iOS 中的内存管理可能具有挑战性，`Instruments` 包含了可以监控内存并报告崩溃的工具。虽然 `Instruments`\
  \ 有许多可能的应用，但内存分析是最实用的之一。如果你为 iOS 开发，`Instruments` 可以为你节省时间，并帮助你创建健壮且不内存内存的 App。\n\
  \n## 创建一个泄漏测试 App\n\n为了在实践中演示这一点，你需要创建一个故意内存泄漏的 App。`Instruments` 会监控泄漏，这样你就可以看到分配和泄漏是如何被图表化并汇总为统计数据的。遵循以下步骤：\n\
  \n1. 在 `Xcode` 中通过 `File⇒New Project` 创建一个新的基于窗口的 iOS 项目。不要包含单元测试或 Core Data。\n\
  2. 将项目保存为 `MemoryLeak`。\n3. 修改 `MemoryLeakAppDelegate.m` 的开头使其与以下列表匹配：\n\n```objectivec\n\
  @implementation MemoryLeakAppDelegate\n@synthesize window;\n- (BOOL)application:(UIApplication\
  \ *)application didFinishLaunchingWithOptions:(NSDictionary *)launchOptions\n{\n\
  [self.window makeAndVisible];\nNSTimer *theTimer = [NSTimer scheduledTimerWithInterval:1.0\n\
  target:self\nselector:@selector(timerDo)\nuserInfo:nil\nrepeats:YES];\nreturn YES;\n\
  }\n- (void)timerDo {\nNSObject *theLeak = [[NSObject alloc] init];\n}\n```\n\n这段代码创建一个每秒执行一次的定时器。`Instruments`\
  \ 会监控泄漏，这样你就可以看到分配和泄漏是如何被图表化并汇总为统计数据的。当 `theLeak` 被覆盖时，内存就会丢失。\n\n如果你构建并运行项目，如图\
  \ 16.9 所示，它看起来正常工作。`Instruments` 没有任何 UI 元素什么都没做。但如果你运行足够的时间，它最终会引起内存错误。由于内存泄漏，App\
  \ 不会崩溃，但由于 `theLeak` 是一个小对象，很难从可能的崩溃事件中区分出来，除非直接监控内存。\n\n图 16.9\n\n从 `Simulator`\
  \ 或编辑器中的构建信息无法判断该 App 正在内存泄漏。\n\n![9781118007594-fg1609.tif](img/9781118007594-fg1609_fmt.jpeg)\n\
  \n## 使用 Instruments 分析 App\n\n将项目加载到 Instruments 中被称为性能分析（Profiling）。对于 OS X 和 iOS\
  \ 项目，过程是相同的。最简单的版本包含以下步骤：\n\n1. 确保项目构建没有错误。\n2. 在主 `Xcode` 菜单中选择 `Product⇒Profile`\
  \ 选项。\n3. 等待 `Xcode` 创建特殊的分析构建。在该步骤结束时，你会看到熟悉的构建成功。\n4. 再次等待 `Xcode` 自动加载并启动 `Instruments`。性能分析时不需要手动启动\
  \ `Instruments`。\n5. 选择跟踪模板。模板包含具有预设设置的工具，用于收集并显示特定问题或运行时值。\n6. 等待 `Instruments`\
  \ 初始化。\n7. 如果被要求，可以使用标准的 OS X 用户密码进行身份验证。并非所有工具都需要此步骤。\n8. 再次等待 `Instruments` 完成初始化。这可能需要几秒钟。在初始化完成之前，`Instruments`\
  \ 无反应，Mac 可能会变慢。\n9. 使用你选择的工具开始监控 App。时间线开始滚动显示图形，详情面板显示动态统计数据。根据工具，你可以修改显示以缩放、选择或隐藏某些统计数据、显示更多详细信息等。\n\
  10. 运行结束后，点击左上角的停止按钮。你现在可以滚动查看时间线。\n\n\n\n\n这个过程看起来简单，但存在一些隐藏的复杂性。并不是所有模板在所有平台上都可用。当\
  \ `Instruments` 启动时，它会为 OS X、`iOS Simulator` 和 iOS 硬件项目提供略有不同的选择。\n\n还要注意启动延迟是变化的且不一致的。当你第一次加载\
  \ `Instruments` 时，可能需要等待长一分钟时间线才会显示有用信息。iOS 项目通常比 OS X 项目耗时长，因为 `Simulator` 或设备加载并运行\
  \ App 需要一段时间时间。`Instruments` 在此延迟的基础上还需要额外的初始化时间。通常，启动不是一个瞬间完成的过程，在启动后有一个模糊的时期，此时可能不清楚所有内容是否都运行正常。（通常是运行的。）\n\
  \n![mac_tip.eps](img/mac_tip_fmt.jpeg) 提示\n\n你可以通过在主 `Instruments` 菜单中选择 `File⇒Record\
  \ Options` 来延迟记录和时间线更新。选项对话框包含一个启动延迟选项、一个时间限制选项以及一个延迟显示复选框，后者会在运行结束前禁用数据处理和显示，从而最大限度地减少实时处理开销。延迟时间可以用秒、毫秒、微秒或纳秒来设置。（你通常不会用到最后一种选项。）\n\
  \n![mac_caution.eps](img/mac_caution_fmt.jpeg) 警告\n\n在 `Xcode` 的第一个版本中，如果你选择 `Product⇒Profile`，`Instruments`\
  \ 有时无法自动附加到 `iOS Simulator`。如果发生这种情况，请手动附加。\n\n请注意，尽管你可以手动沿时间线图滚动，但 `Instruments`\
  \ 并不一定记录每个点上收集的统计数据。通常，统计数据将保持在运行结束时的数值。虽然手动重放统计数据很有用，但 `Instruments` 不支持此功能。\n\n\
  ### 选择跟踪模板\n\n为了在实践中探索这一过程，请在 `Xcode` 中选择 `Project⇒Profile` 菜单选项创建一个 Profile 构建并启动\
  \ `Instruments`。\n\n图 16.10 显示了 Trace 模板选择对话框。由于该项目正在 `iOS Simulator` 中运行，`Instruments`\
  \ 已经预选择了相关的 `iOS Simulator Instruments`。左上角的 `All` 选项显示所有可用模板。你可以通过选择 `Memory`、`CPU`\
  \ 和 `File System` 组来对其进行过滤。\n\n图 16.10\n\n#### 从标准列表中选择模板\n\n![9781118007594-fg1610.tif](img/9781118007594-fg1610_fmt.jpeg)\n\
  \n对于此示例，选择 `Leaks` 模板。点击 `Profile`。等待 `Instruments` 启动并初始化。最后，你会看到图 16.11 所示的。`Leaks`\
  \ 模板包含两个工具：`Allocations` 和 `Leaks`。\n\n图 16.11\n\n#### 初看 Leaks 模板\n\n![9781118007594-fg1611.tif](img/9781118007594-fg1611_fmt.jpeg)\n\
  \n### 理解时间线\n\n在显示定期更新后，你可以开始检查输出，查看它如何提供对 App 行为的见解。\n\n有两个活动区域。时间线区域显示了 App 启动时的初始分配事件，以及\
  \ `Leaks` 通道中稳定增加的系列事件。统计数据显示了一个更全面——也更难理解的信息列表，稍后将进行详细描述。\n\n`Leaks` 图提供了 App 正在泄漏的清晰指示。但请注意，图表并不完全镜像了泄漏活动。你可能预期泄漏计数会稳定增长，但默认情况下，图表每\
  \ 10 秒采样一次，因此泄漏时间线显示的是摘要视图。\n\n![mac_tip.eps](img/mac_tip_fmt.jpeg) 提示\n\n事实上，你可以更改采样时间以强制图表更频繁地更新。对于较小的\
  \ App，代价是微小的性能影响。选择 `Leaks` 工具，并更改 `Instruments` 列表中 `Sampling Options` 配置中框中的值。默认的初始\
  \ 10 秒对许多应用程序来说太长了。随着 App 使用更多内存，性能影响会变得更加明显，因此请谨慎使用此功能。\n\n通常，时间线最适合用于对 App 活动进行快速、概括性的概述。它不是一个精确的诊断工具，但它确实为你提供了足够的信息来检查是否有必要进行详细的调查。\n\
  \n#### 开始使用统计数据\n\n详情面板中的统计数据是高效使用 `Instruments` 的关键。时间线提供概览，而统计数据提供了极其详细的信息。\n\n\
  乍看之下，`Allocations` 统计数据可能看起来复杂，但显示仅是你的 App 创建的所有对象的列表，并带有相关的实例计数，该工具从字面上正在监控并计算内存中的每一个对象。\n\
  \n列表顶部的组合 `All Allocations` 摘要统计了对象的总数并列出了使用的总内存。你可以点击每个列标题（`Category`、`Live Bytes`、`#\
  \ Living` 等）以各种方式对列表排序并突出数据的某些方面。\n\n![mac_note.eps](img/mac_note_fmt.jpeg) 注意\n\
  \n如果你看不到图 16.11 所示的显示，请在时间线面板的左侧选择 `Allocations` 工具，并使用时间线下的菜单选择 `Statistics and\
  \ Object Summary`。\n\n![mac_note.eps](img/mac_note_fmt.jpeg) 注意\n\n`Allocations`\
  \ 显示所有对象和所有底层内存分配。列表中的许多对象没有文档说明，因为它们是系统内部的，并在底层被创建和释放。通常情况下，当你创建一个标准的 `Cocoa` 对象时，分配代码会运行若干次底层分配。`Allocations`\
  \ 将它们分开列出。\n\n随着 App 的运行，你会看到 `# Living` 和 `# Overall` 计数每秒都在增加。`# Living` 列计算已分配并活跃的对象。`#\
  \ Overall` 列是运行总数。由于我们的内存泄漏 App 没有释放任何对象，这两个数字是相同的。在实际项目中，这两个数字会立即分叉。\n\n![mac_caution.eps](img/mac_caution_fmt.jpeg)\
  \ 警告\n\n有时你会发现 Apple 自己的 iOS 和 OS X 对象正在内存内存。当发生这种情况时，`Instruments` 会清晰地显示出来。但不要忘记，在应用程序中，对象是有层级结构的而不是线性列表，且\
  \ OS 对象可能会在 `malloc` 级别泄漏内存。如果你的代码在内存分配增加时什么都没做，你可能正在处理一个真正的系统 Bug。你可能无法看到哪个对象引起的问题，因为\
  \ `Allocations` 将问题报告为底层泄漏。\n\n### 监控特定对象\n\n未过滤的对象列表包含了系统后台创建的对象。你通常不需要监控这些对象，因此\
  \ `instruments` 包含一套强大的选择选项，可以帮你专注于某些对象同时隐藏其他对象。\n\n使用这些选项显示具有特定的对象。在功能上，各种过滤器是重叠的，通常有多种方法从列表中挑选出单个对象。由你选择适合自己的方法。\n\
  \n#### 通过类别列表选择对象\n\n点击 `Category` 列标题按字母顺序排序对象列表。向下滚动找到 `NSObject` 条目，如图 16.12\
  \ 所示。如果你在 App 运行时监控此条目，你会发现它的 `# Living` 和 `# Overall` 都在稳定增加。\n\n![9781118007594-fg1612.tif](img/9781118007594-fg1612_fmt.jpeg)\n\
  \n使用 Category 列按字母顺序列出对象\n\n\n\n图 16.13 显示了另一种解决方案。在 Instruments 窗口右上角的搜索字段中输入一个或多个类名，选择放大镜图标，并选择\
  \ `Matches Any`（匹配任意项）。主列表将经过过滤，显示你输入的对象名称。当你想要监控少数相关对象时，请使用这种方法。\n\n### 图 16.13\n\
  使用搜索字段选择对象\n\n![9781118007594-fg1613.tif](img/9781118007594-fg1613_fmt.jpeg)\n\n\
  ![mac_caution.eps](img/mac_caution_fmt.jpeg) 注意\n\n内部系统对象名称与官方文档记录的对象名称之间可能存在差异。在图\
  \ 16.13 中，你可以看到搜索 `NSArray` 会显示两个在内部实现了 `NSArray` 的相关内部系统对象。这些对象在文档中并未被提及，但理想情况下，你对\
  \ `Cocoa` 应有足够的了解，以便从搜索上下文中理解它们的作用。这仅适用于你监控 `Cocoa` 和其他系统对象时。你自定义的对象应该具有唯一且无歧的可搜索名称。\n\
  \n### 列出对象分配事件\n\n当你选择一个对象时，可以点击其右侧出现的详细箭头以显示分配事件列表，如图 16.14 所示。该列表包含了每次分配的地址、时间戳和上下文。\n\
  \n你可以从此列表中看到 app 正在生成多个 `NSObject` 分配。由于它们都是活跃的，因此 app 并没有释放它们。其中大多数是在 app delegate\
  \ 的 `timerDo` 方法中创建的。\n\n### 图 16.14\n列出单个类的对象，并附带相关的分配时间、地址，以及发生分配的应用程序/库和方法。\n\
  \n![9781118007594-fg1614.tif](img/9781118007594-fg1614_fmt.jpeg)\n\n在实际项目中，这类信息可以为你提供有用的调试提示，但还有更详细的信息。如果你选择分配事件旁边的详细三角形，就会看到图\
  \ 16.15 所示的显示。这里的关键列是 `RefCt`，它是对象的引用计数。\n\nAllocations 仪器中的对象视图是获取可靠引用计数的唯一方法。方便的是，你可以同时查看多个对象的计数。这对于存在内存问题的项目来说是救命稻草，因为它提供了\
  \ app 内存事件的“X 光检查”。你可以在 app 运行时与其交互，并监控一个对象以检查它是否被正确分配和释放。\n\n![mac_caution.eps](img/mac_caution_fmt.jpeg)\
  \ 注意\n\n不要忘记 `Cocoa` 可能不会在接收 `release` 或 `autorelease` 消息后立即释放对象。根据上下文，某些其他对象可能正在保留你的目标对象。或者只是\
  \ `Cocoa` 需要一点时间来运行 `release` 或 `autorelease` 代码。然而，只要 `Cocoa` 处理一个对象，你用 Instruments\
  \ 监控它。\n\n### 图 16.15\n查看单个对象分配以查看引用计数\n\n![9781118007594-fg1615.tif](img/9781118007594-fg1615_fmt.jpeg)\n\
  \n### 查看分配事件堆栈跟踪\n\n另一个强大的选项可以提供关于创建对象的事件精确信息。选择一个分配事件，点击工具栏中的扩展详细图标——即标记为 `View`\
  \ 的三个图标右侧的那个。\n\n你应该看到图 16.16 所示的显示。堆栈跟踪列出了发生分配之前的事件。你可以在跟踪中显示更多信息；例如，你可以按名称列出 `Cocoa`\
  \ 和 `OS` 库，用不同的图标高亮用户事件和系统事件，并显示指向你源代码的文件链接。\n\n后者是一个极其实用的选项，但因为隐藏得非常深，所以很容易被忽略。使用菜单（参考图\
  \ 16.16）启用所有显示选项。滚动到第 5 项——列出你代码中分配事件的项，该项标记有带有头肩部的用户图标。双击图标左侧的文件链接。\n\n### 图 16.16\n\
  查看分配堆栈跟踪\n\n![9781118007594-fg1616.tif](img/9781118007594-fg1616_fmt.jpeg)\n\n###\
  \ 从堆栈跟踪查看代码\n\nInstruments 加载源代码并高亮与事件相关的行，如图 16.17 所示。你可以立即看到对象是在哪里分配的。\n\n对于一个仍然活跃的对象——引用计数大于\
  \ 0 且未从内存中释放的对象——图 16.15 中的引用计数显示显示了最近的内存管理事件。你可以使用图 16.17 中的源代码链接功能找到与该事件相关的代码。\n\
  \n![mac_note.eps](img/mac_note_fmt.jpeg) 注意\n\n你可以使用此功能来监控系统对象。但如果你尝试跳转到源代码，你会看到一段简短的汇编列表，因为你显然无法查看或更改原始系统文件。\n\
  \n### 图 16.17\n回到源代码\n\n![9781118007594-fg1617.tif](img/9781118007594-fg1617_fmt.jpeg)\
  \ \n\n### 使用 Leaks 仪器\n\n如图 16.18 所示的 `Leaks` 仪器是 `Allocations` 的一个版本，专门用于显示泄漏。你可以使用\
  \ `Allocations` 或 `Leaks` 来查找泄漏代码。\n\n为了说明这一点，下一个示例使用了坏代码故意创建一个僵尸，并演示 Instruments\
  \ 如何捕获它。\n\n```objc\n#import “ZombiesAppDelegate.h”\n\n@implementation ZombiesAppDelegate\n\
  \nNSObject *theZombie;\n\n@synthesize window;\n\n- (BOOL)application:(UIApplication\
  \ *)application didFinishLaunching:(NSDictionary *)launchOptions\n{\n    [self.window\
  \ makeKeyAndVisible];\n    NSTimer *theTimer =\n    [NSTimer scheduledTimerWithInterval:1.0\n\
  \    target:self\n    selector:@selector(timerDo)\n    userInfo:nil\n    repeats:YES];\n\
  \    theZombie = [[NSObject alloc] init];\n    [theZombie release];\n    return\
  \ YES;\n}\n\n- (void)timerDo {\n    NSLog (@”Tick”);\n    [theZombie release];\n\
  }\n```\n\n### 图 16.18\n使用 Leaks 查看泄漏事件\n\n![9781118007594-fg1618.tif](img/9781118007594-fg1618_fmt.jpeg)\n\
  \n### 管理僵尸\n\n遗憾的是，没有办法查看已释放的对象；它们消失后不再出现在任何统计数据中。当你释放一个事件并向它发送消息时，它就会变成僵尸——一个试图吃掉你的\
  \ Mac 或 iPhone 大脑的不死对象。由于手动内存管理非常复杂，Instruments 包含了一个特殊的监控工具帮助在僵尸扩散之前捕获它们。\n\n###\
  \ 图 16.19\n在这份无用的崩溃报告中，Xcode 没有提供关于崩溃原因的任何信息\n\n![9781118007594-fg1619.tif](img/9781118007594-fg1619_fmt.jpeg)\n\
  \n![mac_note.eps](img/mac_note_fmt.jpeg) 注意\n\n如果你有一定的 iOS 经验，知道没有堆栈跟踪或控制台报告通常意味着内存错误。但这里没有任何可以告诉你错误的位置。\n\
  \n要使用僵尸功能，请遵循以下步骤：\n\n1. 在 Xcode 主菜单中选择 `Product⇒Profile`。\n2. 选择 `Zombies` 仪器，如图\
  \ 16.20 所示。\n\n![mac_caution.eps](img/mac_caution_fmt.jpeg) 注意\n\n\n\n\n在 iOS 中，`Zombies`\
  \ 实例仅在 `Simulator`（模拟器）可用。它没有包含在 iOS 设备的模板中。\n\n3. 等待 `Instruments` 加载并开始录制。\n4.\
  \ 在 get 提示时进行身份验证。\n\n测试应用几乎立即崩溃，`Instruments` 可能需要一段时间才能跟上。如果在此期间你看到旋转的彩色球，请不要担心；`Instruments`\
  \ 正在工作以显示有用的内容。\n\n图 16.20\n选择 Zombies 实例\n\n![9781118007594-fg1620.tif](img/9781118007594-fg1620_fmt.jpeg)\n\
  \n最终，你会看到图 16.21 所示的显示。僵尸事件在时间轴的顶部标记有一个小红旗，并弹出一个浮动对话框，其中包含了僵尸事件的简要摘要。详情面板显示了对象的历史以及该对象的引用计数历史。在这个示例中，引用计数历史非常简单：对象被创建、释放，然后再次释放。在实际项目中，这段历史可能会更长且更复杂。\n\
  \n如果你打开扩展详情面板，可以查看每个事件的堆栈跟踪，如图所示。注意，历史表中的 `Responsible Library` 和 `Responsible Caller`\
  \ 字段是空的，且堆栈跟踪不包含源代码链接。如果这些信息可用的话将很有用，但遗憾的是，它们在对象释放时会消失，而僵尸显示并不包含这些信息。相反，你必须根据给出的提示进行回溯。例如，你可能需要在代码中搜索\
  \ `NSObject` 释放事件，并使用断点监控每个事件。\n\n通常只有一个僵尸事件，因为应用在遇到一个僵尸事件后就会立即崩溃。在特殊情况下，可能会有多个，此时\
  \ `Zombies` 实例会在时间轴上显示多个红旗。你可以通过点击它们来查看每个事件的内容，并在完成后使用 `Done` 按钮隐藏弹出对话框。\n\n图 16.21\n\
  捕获僵尸\n\n![9781118007594-fg1621.tif](img/9781118007594-fg1621_fmt.jpeg)\n\n### 探索详情面板\n\
  \n当你完成对僵尸的探索后，请注意 `Allocations` 实例可以在详情面板中显示更多信息。详情面板的默认视图被称为 `Statistics` 。但面板可以通过其他方式显示分配数据。你可以使用详情面板上方的菜单选择稍后描述的其他选项，如图\
  \ 16.22 所示。以下是可用选项：\n\n![bl.eps](img/bl_fmt.jpeg) **Call Trees（调用树）**：这显示了嵌套函数和方法调用的完整列表。将它结合稍后描述的\
  \ `Mark Heap` 功能使用，以显示活动方法的调用上下文。你也可以查看整个应用程序的完整调用树。这让你对应用中的事件有一个非常详细的视图，但因为它过于详细，往往很少派用场。\n\
  \n![bl.eps](img/bl_fmt.jpeg) **Object List（对象列表）**：这是一个简单的对象线性列表，可以按内存地址、类别（例如名称）、创建时间、大小、库和调用上下文进行排序。它与之前介绍的对象列表相同。\n\
  \n![bl.eps](img/bl_fmt.jpeg) **Heapshots（堆快照）**：这会创建堆（总内存）使用的简单摘要快照。点击左侧的 `Mark\
  \ Heap` 按钮来测量堆。`Heap Growth` 列显示了当前与之前堆大小之间的差异。\n\n![bl.eps](img/bl_fmt.jpeg) **Console（控制台）**：显示控制台窗口以监控文本输出。你可以选择应用程序控制台或主系统控制台。\n\
  \n图 16.22\n在详情面板中选择其他类型的显示\n\n![9781118007594-fg1622.tif](img/9781118007594-fg1622_fmt.jpeg)\n\
  \n### 修改实例设置\n\n当你加载模板时，其中包含的实例将用默认设置初始化。你可以在运行之前或之后，通过点击实例右侧的小信息 (i) 图标来显示 `Inspector`\
  \ 对话框并修改这些设置，如图 16.23 所示。每个实例显示一组不同的选项。某些选项对许多实例均可用。\n\n设置检查器很容易被忽略，但它包含了强大的功能。一些常见设置包括：\n\
  \n![bl.eps](img/bl_fmt.jpeg) **Target（目标）**：默认情况下，它匹配 `Instruments` 监控的进程或线程。某些实例允许你通过此菜单选择不同的进程或线程，以便对多个应用程序进行同步监控。\n\
  \n![bl.eps](img/bl_fmt.jpeg) **Launch Configuration（启动配置）**：这些是实例的通用设置。\n\n![bl.eps](img/bl_fmt.jpeg)\
  \ **Track Display - Zoom（跟踪显示 - 放）**：`Zoom` 选项更改时间轴的高度。你可以使用它来强调来自一个实例的数据，或突出显示显示较低比例的活动。\n\
  \n![bl.eps](img/bl_fmt.jpeg) **Track Display - Style and Type（跟踪显示 - 样式和类型）**：`Style`\
  \ 和 `Type` 选项可以显示数据的累积或活动摘要视图。`Overlay` 类型在单张图表上显示不同的运行情况，而 `Stacked`（堆叠）类型显示相同比例的序列。\n\
  \n图 16.23\n使用检查器更改实例设置\n\n![9781118007594-fg1623.tif](img/9781118007594-fg1623_fmt.jpeg)\n\
  \n对于 `Allocations` 实例，其余设置是独特的。`Launch Configuration` 选项包含一组复选框。大部分都是一目了明的。例如，`Record\
  \ counts`（记录引用计数）选项正如你所预期；如果你取消勾选，实例就不会记录引用计数。\n\n![mac_tip.eps](img/mac_tip.jpeg)\
  \ 注意 `Enable Zombie`（启用僵尸检测）开启了之前介绍的僵尸监控。并没有独立的 `Zombies` 实例；僵尸检测内置在 `Allocations`\
  \ 实例中，你可以在这里启用或禁用。如果你创建了自己的模板，记住这一点；否则你会寻找 `Zombies` 实例并疑惑为什么没有。\n\n`Recorded Types`（记录类型）选项对详情面板中的对象列表进行简单但有效的过滤。标记为\
  \ `Malloc` 的事件通常是底层系统事件，它们会弄乱显示，因此通常忽略它们。`CF`（Core Foundation）对象稍微复杂，但仍然处于较低水平。`NS`\
  \ 对象是 Cocoa 对象。\n\n![mac_caution.eps](img/mac_caution.jpeg) 你的自定义对象是 Cocoa 对象。如果你不记录\
  \ `NS` 对象，`Instruments` 会忽略它们，尽管它们的名称可能不是以 `NS` 开头的。但在 iOS 上，以 `UI` 开头的对象不会被忽略。此外，你可以设置\
  \ `Recorded Types` 选项过滤所有内容。这样做你会看到带有警告信息的空白时间轴。\n\n如果你点击检查器右下角的 `Configure` 按钮，它会旋转显示图\
  \ 16.24 所示的视图。默认情况下，此对话框重复了一个视图的记录/忽略选项，但你可以使用表格下的添加/删除图标添加自己的前缀字符串进行自定义过滤。大多数实例包含\
  \ `Configure` 选项，但与主设置一样，每个实例在翻转视图上显示一组不同的功能。\n\n图 16.24\n检查器的另一侧。并非所有实例都实现了此翻转视图功能。每个实例显示不同的选项。\n\
  \n![9781118007594-fg1624.tif](img/9781118007594-fg1624_fmt.jpeg)\n\n### 比较不同的运行\n\
  \n要监控新的运行，点击 `Record` 按钮停止当前运行，然后再次点击它开始录制。默认情况下，你会在时间轴上看到一组新的轨道，主计时器下方的描述字符串将变为“Run\
  \ N of N”，其中 N 是运行总次数。\n\n\n\n\n\n要比较不同的运行记录，请点击仪器左侧的展开三角形。时间轴在不同的轨道上显示每次运行的情况，如图\
  \ 16.25 所示。在时间轴上选择每次运行记录，会在详细视图中显示其最终统计数据。你也可以通过点击时间计数器中“Run N of N”文本两侧的前进/后退箭头来选择运行记录。\n\
  \n图 16.25\n比较不同的运行记录\n\n![9781118007594-fg1625.tif](img/9781118007594-fg1625_fmt.jpeg)\n\
  \n![mac_caution.eps](img/mac_caution_fmt.jpeg) 注意\n\n虽然此示例中的每个运行记录都是相同的，因为它们都使用了相同的\
  \ zombies 测试程序，但你可以从图中看到时间差异可能会有多大。Instruments 与其他应用程序共享 Mac 资源，包括 `Xcode` 和 `Simulator`。启动应用程序并开始记录事件所需的时间可能会变化巨大。通常情况下，你不能依赖性能分析来进行交互式的时间关键型监控，至少在每次运行的前几分钟内是这样。\n\
  \n### 保存和加载运行记录\n\n要保存运行记录，请从 `Instruments` 菜单选择 `File`⇒Save As`。当前运行将保存为 `.trace`\
  \ 文件，包含所有当前设置和数据。你可以通过 `File`⇒Open` 重新加载。加载后，你可以记录后续的运行。它们将以通常的方式添加到数据中。原始运行记录不会被删除或修改。然后你可以用新名称重新保存新文件，或覆盖原始文件。\n\
  \n### 使用 Instruments 和模板\n\n你可以使用模板来开始使用 Instruments。但为了使用你自己的喜好仪器组合来自定义测试，你必须理解仪器、文档和模板之间的区别。\n\
  \n## 理解模板\n\n标准模板包含三个元素：\n\n![bl.eps](img/bl_fmt.jpeg) 一个或多个仪器\n![bl.eps](img/bl_fmt.jpeg)\
  \ 每个仪器的默认设置\n![bl.eps](img/bl_fmt.jpeg) 启动时显示在标准模板列表中的精美图形\n\n默认模板旨在创建一组标准且实用的分析配置。但你可以创建自定义模板，并拥有你自己的喜好仪器选择和设置。当你保存模板时，它会被添加到用户库。保存模板时，你可以选择其中一个标准图标。\n\
  \n## 创建模板\n\n要创建新模板，请在 `Instruments` 中选择 `File`⇒New` 并选择 `Blank` 模板。点击 `Library`\
  \ 按钮，从列表中将一个或多个仪器拖放到 `Instruments` 窗口左侧的 `Instruments` 列中，如图 16.26 所示。\n\n检查每个仪器，并将设置更改为实用的默认值。你可以在模板中添加具有不同设置的多个同一仪器副本。例如，你可能会添加两个\
  \ `CPU Monitor` 仪器的副本，并使用 `Configure` 选项在时间轴上显示两个不同的统计数据，例如 `PhysicalMemoryUsed`\
  \ 和 `PhysicalMemoryFree`。\n\n![mac_caution.eps](img/mac_caution_fmt.jpeg) 注意\n\n\
  确保你只选择了与目标平台的仪器。\n\n图 16.26\n创建自定义模板\n\n![9781118007594-fg1626.tif](img/9781118007594-fg1626_fmt.jpeg)\n\
  \n如果你想在每个轨道中监控不同的线程和进程，请将工具栏中的 `Target` 菜单设置为 `Instrument Specific`。然后你可以在模板加载时为每个仪器选择目标。\n\
  \n最后，使用主 `Instruments` 菜单中的 `File`⇒Save as Template` 选项保存新模板。点击 `Icon` 框右下角的三角形来选择一个标准图标。为模板起一个令人难忘的名字。\n\
  \n如图 16.27 所示，当你创建一个新的 `Instruments` 文档时，保存的模板将出现在模板列表的 `User` 部分。若要从列表中删除自定义模板，请在\
  \ `Finder` 中导航到模板描述所示所示路径，并手动删除文件。\n\n![mac_tip.eps](img/mac_tip_fmt.jpeg) 提示\n\n\
  `Library` 窗口包含列表中每个仪器的简要描述。你可以在文档的 `Tools & Languages⇒Performance Analysis Tools⇒Instruments\
  \ User Guide⇒Built-in Instruments` 下找到每个仪器的更多信息，以及关于参数和设置的额外细节。\n\n图 16.27\n加载自定义模板\n\
  \n![9781118007594-fg1627.tif](img/9781118007594-fg1627_fmt.jpeg)\n\n## 创建自定义仪器\n\
  \n你可以创建自定义仪器来监控标准库中未包含的 OS 功能和其他事件。Instruments 使用了一种名为 `DTrace` 的技术，下文对其进行了概述。但你可以在不理解\
  \ `DTrace` 的情况下创建简单的自定义事件监控器。\n\n选择 `Instrument`⇒Build New Instrument` 显示自定义仪器的对话框，如图\
  \ 16.28 所示。如果你理解 `DTrace` 和 `D` 脚本语言，你可以在 `DATA`、`BEGIN` 和 `END` 字段中填充自定义代码。\n\n\
  对于简单的事件监控器，你可以在探针字段（probe fields）中输入库和函数名，并在 `Record the following data:` 框中选择一个或多个参数进行监控。关于创建自定义仪器的更详细入门指南超出本书的范围。在\
  \ `Tools & Languages⇒Performance Analysis Tools⇒Instruments User Guide` 中有概述。\n\n\
  图 16.28\n自定义仪器对话框\n\n![9781118007594-fg1625.tif](img/9781118007594-fg1625_fmt.jpeg)\n\
  \n#### DTrace 和 Instruments\n\n内部，Instruments 基于一种名为 `DTrace` 的技术。`DTrace` 最初由太阳公司（现\
  \ Oracle）开发，用于调试 Solaris 中的内核和应用程序问题，现已根据通用开发发行许可证（CDDL）发布并移植到各种 Unix 系统。\n\n内部，`DTrace`\
  \ 使用一些提供者（providers），这些补丁到内核的关键部分。例如，一个名为 `objc` 的提供者报告用户空间中 Objective-C 对象的信息。`syscall`\
  \ 报告系统调用`fbt`（函数边界跟踪）报告内核函数。每个提供者由一个或多个探针（probes）进行监控。\n\n你可以在 `Terminal` 中通过 `dtrace`\
  \ 命令从命令行访问 `DTrace`。例如，以下命令列出活动探针列表：\n\n```bash\nsudo dtrace -l\n```\n\nInstruments\
  \ 的工作原理是对每个探针添加自定义操作，该操作在探针“触发”时运行——也就是说，当某些相关事件触发它时。你可以编写自己的操作，但你需要对每个探针及其选项有一定的了解。\n\
  \n关于使用 `DTrace` 创建自定义仪器的详细指南超出本书范围。在 `Tools & Languages⇒Performance Analysis Tools⇒Instruments\
  \ User Guide` 中包含基础概述。\n\n\n\n\n\n向应用程序发送一系列测试事件以检查 UI 的各种可能的错误和失败状态通常很有。Instruments\
  \ 包含自动化脚本播放器（Automation script player），它可以从文件中读取一组自动化和测试事件，并将它们作为操作发送给 iOS 应用。\n\
  \n测试脚本使用 JavaScript 编写，并使用 `UIAutomation` 类。`UIKit` 对象有一组关联的 `UIAutomation` 对象，这些对象可以接收自动化事件。你可以在\
  \ Xcode 文档中的 UI Automation Reference Collection 中找到对象的完整列表。\n\n测试脚本可以非常简单，也可以极其复杂。如何测试你的\
  \ UI 取决于你。以下示例非常简单，但它说明了测试过程，并可以扩展以创建更复杂的测试套件。\n\n将测试留到开发周期的末尾很有诱惑力，但在开发的同时编写测试脚本可能会更有效率。测试会增加一些开销，但如果你将自动化测试与第\
  \ 17 节描述的单元测试相结合，就可以创建一个实用的测试套件，运行项目的关键功能，并帮助确保功能不会因更新和错误修复而损坏。\n\n![mac_tip.eps](img/mac_tip_fmt.jpeg)\
  \ 提示\n\n大多数 UI 对象都是 `UIAElement` 的子类。`UIAElement` 的文档列出了你在测试对象时可以向其发送的消息。当你开始使用\
  \ `UIAutomation` 时，这是一个很好的起点。（如果你查看对象子类本身，将发现没什么感兴趣的内容。）\n\n![mac_note.eps](img/mac_note_fmt.jpeg)\
  \ 注意\n\nAutomation 工具仅在 iOS 上可用。对于 OS X，Instruments 包含一个简单的 UI 录制器，可以捕获并重放用户操作。\n\
  \n### 设置对象以支持自动化\n\nUI 自动化系统不使用 outlet（输出）或 link（链接）。对象通过两种方式引用：\n\n![bl.eps](img/bl_fmt.jpeg)\
  \ 可以通过应用程序的视图树访问。使用正确的代码，视图会“直接正常工作”。\n\n![bl.eps](img/bl_fmt.jpeg) UI 元素必须在 IB\
  \ 中修改。\n\n要将对象包含在测试中，在 IB 中选择并按此处列出以及图 16.29 右侧所示的方式进行修改：\n\n![bl.eps](img/bl_fmt.jpeg)\
  \ 确保勾选了 Accessibility（辅助功能）框。（对于许多对象，Accessibility 是默认开启的。）\n\n![bl.eps](img/bl_fmt.jpeg)\
  \ 在对象的 Label 字段中赋予其一个唯一名称。\n\n该图显示了一个带有单个文本字段的简单示例。真实的 UI 可能有更长的 UI 元素列表，你必须对所有元素重复这两个步骤。\n\
  \n图 16.29\n设置支持测试自动化的 UI 对象\n\n![9781118007594-fg1629.tif](img/9781118007594-fg1629_fmt.jpeg)\n\
  \n![mac_caution.eps](img/mac_caution_fmt.jpeg) 注意\n\n不要为容器视图启用辅助功能。如果你这样做，自动化将找不到它们内部的\
  \ UI 元素。\n\n### 创建测试脚本\n\n在 Xcode 3 中，你可以在启动 Automation 工具之前加载脚本。Xcode 4 可能在未来的某个时间恢复这种方法，但在本书编写脚本时，脚本是以一种不那么优雅且不直观的方式管理的。\n\
  \n创建测试脚本最简单的方法是使用 TextEdit 等编辑器创建一个 `.js` 扩展名的空文件。你可以将文件保存在任何地方。项目目录是一个好位置，因为这保证了你以后能找到它。可选地，你可以在文件中包含一些测试代码，但你稍后会在\
  \ Instruments 中编辑此文件，所以在在此操作之前保持文件为空是方便的。\n\n![mac_note.eps](img/mac_note_fmt.jpeg)\
  \ 注意\n\n尽管 Automation 文件可以加载到 Instruments 并保存在项目目录，但它们并不是项目代码库的一部分。你无法用主 Xcode 编辑器编辑它们，也没有理由将它们添加到构建。\n\
  \n## 启动 Automation 工具\n\n选择 Product⇒Profile 并选择 Automation 工具，如图 16.30 所示。\n\n图\
  \ 16.30\n选择 Automation 工具\n\n![9781118007594-fg1630.eps](img/9781118007594-fg1630_fmt.jpeg)\n\
  \n在编写本书时，这会启动工具并立即开始录制——什么都没有。没有选择脚本，所以 Automation 只是在时间线上填充了一个空白矩形。\n\n点击 Stop\
  \ 按钮停止运行。等待 Instruments 重置，然后从菜单选择 Choose Script 选项，如图 16.31 所示。再次点击 Choose Script\
  \ 并在文件选择器中导航到你的脚本文件以加载它。\n\n![mac_note.eps](img/mac_note_fmt.jpeg) 注意\n\n第一次选择 Choose\
  \ Script 菜单时，有一个项目——Choose Script 选项。每当你加载脚本时，它都会添加到此菜单列表中，所以你不需要再次导航到它。\n\n图 16.31\n\
  加载自动化脚本\n\n![9781118007594-fg1631.tif](img/9781118007594-fg1631_fmt.jpeg)\n\n##\
  \ 编辑自动化脚本\n\n选择 Product⇒Profile 并选择 Automation 工具，如图 16.30 所示。\n\n图 16.32\n编辑自动化脚本\n\
  \n![9781118007594-fg1632.tif](img/9781118007594-fg1632_fmt.jpeg)\n\n## 开始自动化脚本\n\
  \n自动化脚本与访问网页的文档对象模型（DOM）有关。与 Objective-C 一，它使用对象和访问器，但语法略有不同。你不需要在代码中创建类，因为它们已经存在。\n\
  \n### 初始化脚本\n\n脚本通常从以下模板代码开始：\n\n```javascript\nvar target = UIATarget.localTarget();\n\
  var thisApp = target.frontMostApp();\nvar thisWindow = thisApp.mainWindow();\n```\n\
  \n你可以可以使用 `UIAElements` 文档中列出的类型来返回数组。例如：\n\n```javascript\nvar textfields = thisWindow.textFields();\n\
  ```\n\n返回文本字段数组。你可以通过在 IB 中设置的访问文本字段：\n\n```javascript\ntextfields[\"aNameSetIB\"\
  ]\n```\n\n或者通过数字索引：\n\n```javascript\ntextfields[0]\n```\n\n`length` 函数返回数组中的数量。\n\
  \n### 生成输入事件\n\n你可以通过访问值属性为 UI 事件设置值。例如\n\n```javascript\ntextFields[\"username\"\
  ].setValue(\"Mr Anonymous\");\n```\n\n你还可以使用 `tap()` 函数自动化按钮点击。例如：\n\n```javascript\n\
  myButtons[\"okButton\"].tap();\n```\n\n相同代码的扩展版本可以点击键盘上的按钮。例如：\n\n```javascript\n\
  app.keyboard().elements()[\"go\"].tap();\n```\n\n###如果应用程序需要在事件后等待，使用\n\n```javascript\n\
  target.delay(timeInSeconds);\n```\n\n### 输出日志\n\n为了记录事件和值，调用 `UIALogger`，它会在时间线下的脚本日志窗口显示消息。`UIALogger`\
  \ 有不同的消息级别，强制消息以不同的颜色显示。例如：\n\n```javascript\nUIALogger.logFail(\"Something bad\
  \ happened.\");\n```\n\n### 创建测试脚本\n\n测试通常遵循以下步骤：\n\n1. 为某些 UI 元素预设值。\n2. 执行操作，有时使用按钮点击。\n\
  3. 在需要时暂停。\n4. 读取返回值并为通过/失败条件或常规报告生成消息。\n\n当然，你可以根据测试结果在测试序列中包含不同的路径。\n\n\n\n\n\
  图 16.33 显示了一个运行非常简单测试的简单示例。在这个示例中，代码不太可能会失败，因为文本字段的数量是固定的。但在更复杂的测试中，报告 UI 中的项目数量很有用。例如，你可以在从远程源加载数据后，报告表格视图中单元格的数量。\n\
  \n### 图 16.33\n非常简单测试脚本的输出\n\n![9781118007594-fg1633.tif](img/9781118007594-fg1633_fmt.jpeg)\n\
  \n![mac_caution.eps](img/mac_caution_fmt.jpeg) 注意\n\n脚本可能是不可预测的，某些功能可能不会按预期工作。在开始创建自己的脚本之前，查看其他开发者创建的许多在线脚本示例是一个好主意。在编写本文时，脚本仍然存在一些\
  \ Bug。\n\n## 总结\n\n本章介绍了 `Instruments`，并解释了如何使用它们来辅助调试、测试和性能分析。章节首先演示了在对简单的测试应用进行性能分析时如何启动\
  \ `Instruments`，并概述了关键的 UI 特性。\n\n接下来，详细探讨了 `Allocations` 和 `Leaks` 实例，探索了如何使用它们监控和调试活动应用程序中的内存问题，并解释了如何查找可能导致内存问题的代码行。\n\
  \n它介绍了 `Zombies` 模板，解释了它如何与 `Allocations` 实例相关，并展示了如何管理实例设置和显示选项。\n\n它演示了如何为自己的项目创建和使用自定义模板，并简要提到了为高级低级监控和调试创建自定义实例。\n\
  \n最后，它介绍了 `Automation` 实例，并解释了如何使用它为 UI 创建自动化的测试序列。\n\n## 第 17 章：创建单元测试\n\n## 本章内容\n\
  - 引入单元测试\n- 理解 `Xcode` 中的单元测试\n- 创建用于单元测试的项目\n- 创建测试用例\n- 运行测试\n\n单元测试是一种强大的软件工程技术，`Xcode`\
  \ 支持这种技术。本章概述了该技术，以便你理解单元测试背后的理论，并解释了如何在实践中使用单元测试。\n\n## 引入单元测试\n\n你可以通过许多方式测试软件，软件工程已经演变出正式的流程，可以简化设计并提高项目效率。\n\
  \n软件可能通过五种方式失败：\n\n1. ![bl.eps](img/bl_fmt.jpeg) 用户界面的概念模型是误导性的、错误的或不一致的。如果典型用户对软件产生了错误的假设，开发者对用户如何思考以及他们期望软件如何工作做出了错误的假设。这种级别的失败可能不是致命的，但它们会让用户感到沮丧并浪费他们的时间。\n\
  2. ![bl.eps](img/bl_fmt.jpeg) UI 是脆弱的。常见且不可避免的用户错误——例如文本中的空格、空条目、拼写错误或无效字符，或无意的鼠标点击——会导致应用程序失败。\n\
  3. ![bl.eps](img/bl_fmt.jpeg) UI 或底层模型是不安全的。故意的黑客尝试可能会以不受控的方式将应用程序的内部功能暴露给外部。\n\
  4. ![bl.eps](img/bl_fmt.jpeg) 底层逻辑存在缺陷。代码可能包含对接口、契约和处理要求的错误假设。\n5. ![bl.eps](img/bl_fmt.jpeg)\
  \ 底层逻辑是脆弱的。内存或文件错误、API 不一致和 Bug，以及其他由方法驱动的问题会导致崩溃或其他问题。失败可能是复杂且累积的；一个功能一直正常工作直到问题发生，然后某个依赖功能在之后的某个点似乎失败了。这些依赖关系可能显而易见。\n\
  \n![mac_note.eps](img/mac_note_fmt.jpeg) 注意\n\n在软件工程中，契约是两个元素之间显式定义的接口。这两个元素设计以某种方式交换信息，契约定义了交换的细节——特别是数据格式、时时间和交换顺序。\n\
  \n单元测试的设计是为了帮助解决其中的一些问题，但它不是所有问题的解决方案。从哲学上说，单元测试更接近方法和函数测试，而不是序列测试。要成功使用单元测试，代码应该具有明确定义的接口和可预测的输出。\n\
  \n单元测试的一个优势是，如果一个 Bug 容易重现，就很容易测试。创建一个测试可以确保未来的 Bug 修复不会重新引入问题。单元测试有助于减少这些回归错误的发生。\n\
  \n另一个优势是，通过细小的修改，测试代码可以作为文档中的示例代码，说明功能是如何设计工作的。\n\n你还可以将单元测试作为设计辅助。如果你边写边测试，就可以可以在实现它们之前捕获逻辑上的不一致和过度复杂的契约。可能，你可以使用测试代码来勾勒功能应该如何工作，然后再实现该功能的代码。\n\
  \n尽管有这些优点，单元测试仍然存在争议。目前有一种共识，即单元测试在具有良好定义的 `API` 的协作项目中最有效。单人程序员比小组开发者更有可能对项目有整体把握，因此对元素进行客观测试有时更多是分散而不是收益。随着交互变得越来越由\
  \ GUI 驱动且开放，单元测试代码可能会变得非常大，甚至与主应用程序的大小相当，投入的时间和精力的回报变得越来越小。\n\n对于所有应用程序，单元测试与密集的\
  \ Beta 测试和正式的 Bug 跟踪相结合最为有效。最稳健的生产方案结合了 Beta 测试、单元测试和积极的防御性编程，后者预判并绕过了可能的输入错误。\n\
  \n## 理解 Xcode 中的单元测试\n\n概述，你可以通过单元测试执行以下操作：\n\n- ![bl.eps](img/bl_fmt.jpeg) 将方法或函数的返回值与预期值比较\n\
  - ![bl.eps](img/bl_fmt.jpeg) 检查对象是否被正确创建和初始化\n- ![bl.eps](img/bl_fmt.jpeg) 确认错误条件会抛出异常\n\
  - ![bl.eps](img/bl_fmt.jpeg) 重复任意次数\n- ![bl.eps](img/bl_fmt.jpeg) 创建按顺序运行各种测试序列\n\
  - ![bl.eps](img/bl_fmt.jpeg) 根据之前的结果选择测试\n\n当你创建一个新的 iOS 或 OS X 项目时，可以选择添加单元测试功能。`Xcode`\
  \ 会自动添加这些功能（事实上，它添加了一个实现单元测试的独立目标）并初始化它们。然而，初始化并不完全，在添加测试代码之前需要额外的工作。这些工作在官方文档中没有描述，但列如下。\n\
  \n详细来说，单元测试包包含：\n\n- ![bl.eps](img/bl_fmt.jpeg) 一个名为 `SenTest` 的框架：该框架管理测试并创建报告。你必须为要测试的功能添加自定义代码。\n\
  - ![bl.eps](img/bl_fmt.jpeg) 一组测试宏：这些宏用于检查可能的错误并在构建期间报告它们。\n- ![bl.eps](img/bl_fmt.jpeg)\
  \ 一个独立的测试包：要运行你的测试，请构建该包。错误将在构建期间报告。\n- ![bl.eps](img/bl_fmt.jpeg) 一个测试类，它是包的一部分：你在该类中添加自定义测试代码并包含宏来检查错误条件并报告它们。这些自定义代码在构建期间自动运行。类中的每个测试方法被称为测试用例。\n\
  - ![bl.eps](img/bl_fmt.jpeg) 一个单元测试应用程序：该程序在后台自动运行，由脚本触发，并执行单元测试过程所需的大量工作。你不需要手动运行它。\n\
  \n\n\n\n如果你是单元测试的新手，你可能会发现这个过程是有背直觉的。你可能认为单元测试是一个运行时过程，就像调试一样，但事实并非如此。事实上，你通过以特殊方式构建项目来运行单元测试。构建过程会运行你的测试代码，错误会出现在构建日志中。它们不会像运行时错误那样记录在控制台中。\n\
  \n你必须理解，测试构建与标准的发布/调试构建是相互独立的。可能会出现这种情况：发布/调试构建在没有任何错误的情况下完成，但尽管测试构建报告了多个漏洞。\n\n\
  标准构建报告基本的编译和链接错误。你的测试构建则添加了对逻辑一致性、可预测输出和其他错误情况的进一步检查。定义这些检查、添加自定义测试代码来实现它们，以及定义报告这些错误的错误消息格式和内容，都由你决定。\n\
  \n测试框架提供了构建测试的工具，但它不会推荐特定的测试，不包含任何默认测试，也不会建议实用的测试策略。在你添加测试用例代码之前，测试构建什么都不做。因此，哪些功能应该被测试、应该如何测试，以及测试过程应该有多复杂和详尽，也取决于你的决定。\n\
  \n![mac_caution.eps](img/mac_caution_fmt.jpeg) 注意\n\n如果你的测试代码包含逻辑错误，测试过程本身就会失败。保持测试尽可能简单，并从已已的简单测试构建更复杂的测试。这不能保证你的测试是有效的，但与一个难以理解的复杂复杂的测试系统相比，它更有可能有用且易于管理。\n\
  \n![mac_note.eps](img/mac_note_fmt.jpeg) 注意\n\n测试框架在代码中被称为 `SenTest`。你可能会在 Apple\
  \ 文档中看到它被描述为 `OCUnit`。从技术上讲，`OCUnit` 是 `SenTest` 的 Objective-C 版本。在实践中，这两个名称是可以互换。\n\
  \n## 创建简单的单元测试项目\n\n要创建一个包含单元测试的项目，请按照以下步骤操作：\n\n1. 使用 `File⇒New Project` 创建新项目。在保存项目之前勾选单元测试选项。这将创建一个带有额外测试构建功能的标准项目，其中包含一个构建包和一个测试类。\n\
  \n2. 开发你的项目，按照通常的方式修改标准项目类并添加新类。\n\n3. 对于你想要测试的每个功能，在测试类文件中添加测试用例代码。\n\n4 初始化 Xcode\
  \ 的设置，以确保测试代码按预期方式运行。\n\n5. 可选，你可以使用标准调试工具来验证测试代码。\n\n6. 每当你需要测试项目时，选择测试构建并进行构建。如果测试构建失败，请修正项目代码中的漏洞。\n\
  \n7. 当项目完成后，按照通常的方式构建发布版本。由于测试代码存在于单独包中，它不会被链接到标准的发布构建中。\n\n由于单元测试是开放式的，本章其余部分描述的示例说明了如何为单个微小的类创建一个单一简单测试用例；它是数学框架中一个非常基础的数学操作。虽然框架和测试代码很简单，但你可以轻松地扩展这个示例以满足真实项目的需求。\n\
  \n![mac_note.eps](img/mac_note_fmt.jpeg) 注意\n\n此示例说明了如何为 iOS 项目创建单元测试。iOS 和 OS X\
  \ 项目的单元测试过程足够相似，可以被认为是相同的。\n\n![mac_note.eps](img/mac_note_fmt.jpeg) 注意\n\n如果你的项目使用\
  \ Core Data，你可以按照通常的方式包含它。Core Data 特性与单元测试功能是无关的。你可以向项目中添加其中一个、都不加或两者都有。\n\n##\
  \ 创建支持单元测试的新项目\n\n对于 Xcode 和 iOS 项目，单元测试选项以复选框的形式出现，如图 17.1 所示。对于此示例，创建一个新的基于导航的项目并勾选该框。将项目保存为\
  \ `UnitTest`。\n\n![mac_caution.eps](img/mac_caution_fmt.jpeg) 注意\n\n虽然你可以向现有项目添加单元测试，这不是一个简单的过程。在创建新项目时包含单元测试会更有效。如果你不使用测试功能，它们不会阻碍你，但当你需要它们时，它们已经准备就绪。\n\
  \n图 17.1\n\n创建一个支持单元测试的新项目\n\n![9781118007594-fg1701.tif](img/9781118007594-fg1701_fmt.jpeg)\n\
  \nXcode 自动为项目添加单元测试功能，如图 17.2 所示。你将发现一个后缀为 `Tests.octest` 的新产品包、一个带有 Tests 后缀的新目标，以及一个名为\
  \ `Tests` 的带有标准头文件和实现文件的新类。\n\n图 17.2\n\n探索新的测试功能\n\n![9781118007594-fg1702.tif](img/9781118007594-fg1702_fmt.jpeg)\n\
  \n尽管这些功能包含在项目中，但测试尚未启用。要启用它，选择 `Tests` 目标并查看 Build Settings（构建设置）。滚动到 Unit Testing\
  \ 开关，确保 `Test After Build` 被设置为 Yes，如图 17.3 所示。\n\n![mac_caution.eps](img/mac_caution_fmt.jpeg)\
  \ 注意\n\n确保你为测试目标启用了测试，而不是主构建。可选，向上滚动到 Linking 开关。在较早版本的 Xcode 中，你必须手动设置此开关，但现在没有必要了。\n\
  \n图 17.3\n\n启用测试。如果此开关设置为 No，则测试被禁用。\n\n![9781118007594-fg1703.tif](img/9781118007594-fg1703_fmt.jpeg)\n\
  \n\n\n\n\n如果你是 Objective-C 和 Cocoa 的新手，对于一个简单的操作来说，这些代码可能看起来非常多。事实上，这些代码的大部分是为了创建一个新类，并定义其中一种可能的自定义初始化方法。虽然这是一种冗长的惯用法，但它是\
  \ Objective-C 和 Cocoa 类的标准写法。在一个真实的数学框架中，该类会扩展许多属性以及其他初始化和处理方法。\n\n## 创建测试用例\n\n\
  现在项目已经包含了可以测试的内容，你可以添加测试代码来测试它了。测试被定义为 `<ProjectName>Tests` 类中的独立方法。每个方法的名称必须以 `test`\
  \ 开。任何任何其他字符串开头的方法将被忽略。\n\n每个方法被称为一个测试用例。正如之前解释的，你需要创建测试代码，以最符合逻辑且全面的方式测试目标类的功能。在实践中，这需要三个步骤：\n\
  \n1. 定义测试的输入以及它们应该产生的结果。\n2. 在 `Tests` 类头文件中添加一个测试用例方法。根据你的测试代码，你可能需要将输入和预期结果定义为常量。\n\
  3. 在 `Tests` 实现文件中实现测试方法。使用下述的断言宏来执行测试并报告错误。\n4. 可选：在测试周围添加设置（setup）和拆卸（tear-down）代码。\n\
  \n`Tests` 实现文件包含了预定义的 `setUp` 和 `tearDown` 方法来存放这些可选代码。你可以在这些方法中创建和释放测试对象，也可以直接在每个测试用例中构建\
  \ `alloc` 和 `release` 调用。解决方案取决于测试需求。\n\n## 定义测试输入和结果\n\n图 17.6 显示了测试类的头。你可以看到两个预定义的输入\
  \ `kA` 和 `kB`，以及名为 `kExpectedSum` 的预定义预期和。`testMathMachineSum` 方法运行比较它们的测试。代码如下：\n\
  \n```objc\n#import <SenTestingKit/SenTestingKit.h>\n\n#define kA 1\n#define kB 1\n\
  #define kExpectedSum 2\n\n@interface UnitTestTests : SenTestCase {\n    @private\n\
  }\n\n-(void) testMathMachineSum;\n@end\n```\n\n增加了 `#define` 语句和 `testMathMachineSum`\
  \ 方法。文件的其他部分是由项目创建的。注意，该方法不接受参数，且在 `#define` 指令后没有分号。\n\n这个例子是非常微不足道的。在更真实的测试用例中，预期结果与输入之间的关系可能不那么明显。它可能依赖于一系列对象分配和其他复杂操作。你完全可以在\
  \ `setUp` 方法中预定义一个包含序列输入事件的数组，并在测试代码实现中遍历该数组。输入和预期结果可能会从远程服务器下载为文件，并由开发团队的其他成员创建。\n\
  \n图 17.6：定义测试输入、预期值和测试方法\n\n![9781118007594-fg1706.tif](img/9781118007594-fg1706_fmt.jpeg)\n\
  \n关键点不在于测试简单，而在于测试输入与预期输出之间的关系是定义良好且可预测的。测试的目的是确认这种关系是可靠的，并且被测试的代码根据需要重建这种关系。\n\n\
  测试代码本身可以任意组合任何标准的 Cocoa/Cocoa Touch 以及 OS X/iOS 特性。你甚至可以使用已知的独立代码动态生成输入和结果。\n\n\
  ## 创建测试代码\n\n默认情况下，测试实现文件包含一个单一的 `testExample` 方法，它打印“Unit tests are not implemented\
  \ yet...”的消息。要创建一个测试，请删除此方法并添加图 17.7 所示以及列出的代码。该代码创建了 `MathMachine` 类的实例，并使用 `initWithSum:`\
  \ 方法对其初始化。它运行一个断言宏来检查预期和与方法返回的和是否相等。最后，它释放该实例。两个 `%i` 参数是宏的一部分。第一个显示预期值，第二个显示测试方法返回的值。\n\
  \n![mac_note.eps](img/mac_note_fmt.jpeg) 注意\n\n`alloc` 和 `release` 代码可以放入 `setUp`\
  \ 和 `tearDown` 方法中。这个例子是刻意自包含的。\n\n```objc\n@implementation UnitTestTests\n\n- (void)setUp\
  \ {\n    [super setUp];\n}\n\n- (void)tearDown {\n    [super tearDown];\n}\n\n-(void)\
  \ testMathMachineSum {\n    MathMachine *testMachine = [[MathMachine alloc] initWithSum:kA];\n\
  \    STAssert(testMachine.sum == kExpectedSum, @\"Sum incorrect. Expected %i, got\
  \ %i\", kExpectedSum, testMachine.sum);\n    [testMachine release];\n}\n\n@end\n\
  ```\n\n图 17.7：实现方法\n\n## 理解 STAssert\n\n关键点不在于测试简单，而在于测试输入与预期输出之间的关系是定义良好且可预测的。测试的目的是确认这种关系是可靠的，并且被测试的代码根据需要重建这种关系。\n\
  \n测试代码本身可以任意组合任何标准的 Cocoa/Cocoa Touch 以及 OS X/iOS 特性。你甚至可以使用已知的独立代码动态生成输入和结果。\n\n\
  \n\n\n当你保存代码时，测试几乎已经准备好运行了。但 `Xcode` 在成功运行测试构建之前，还需要最后一个步骤。\n\n默认情况下，被测试的类不会包含在测试程序包（test\
  \ bundle）中。如果你尝试运行测试构建，`Xcode` 将找不到它们的头文件或代码。\n\n要解决这个问题，请选择 `UnitTestTests` 目标（target），如图\
  \ 17.8 所示。选择 `Build Phases` 标签，并打开 `Compile Sources` 格。点击 `+` 三角形添加新源，并选择 `MathMachine.m`\
  \ 文件，如图所示。这将源文件添加到构建中，并确保测试框架能够看到你正在测试的类。\n\n当你测试多个类时，你必须将它们都添加进来。只有当 UI 管理类（如视图控制器）被被测试的类引用时，才需要添加它们。\n\
  \n图 17.8\n将待测试代码添加到测试构建\n\n![9781118007594-fg1708.tif](img/9781118007594-fg1708_fmt.jpeg)\n\
  \n可选的是，如果你安装了多个版本的 `Xcode`，你可以运行特定版本的 `OCUnit` 测试包，如图 17.9 所示。该包作为脚本运行。默认选择标准的系统脚本，它应该适用于大多数项目。图中所示的修改后的默认设置选择了最新版本。如果\
  \ `Xcode` 找不到标准脚本，你可能也需要执行操作，因此了解此选项的存在是有价值的。\n\n图 17.9\n使用 `Build Phases` 中的 `Run\
  \ Script` 选项选择测试脚本。你通常不需要这样做，但了解如何更改此选项是值得的，以防你想自定义该过程。\n\n![9781118007594-fg1709.tif](img/9781118007594-fg1709_fmt.jpeg)\n\
  \n你现在可以运行你的第一个测试构建了。从 `Xcode` 主菜单中选择 `Product⇒Test`，如图 17.10 所示。`Xcode` 会在两个目标上运行测试脚本。你应该看到\
  \ `Build Succeeded` 消息。项目通过了构建测试，没有任何错误。\n\n图 17.10\n选择测试构建。初始构建应该是成功的。\n\n![9781118007594-fg1710.tif](img/9781118007594-fg1710_fmt.jpeg)\n\
  \n要查看构建失败时发生了什么，打开 `MathMachine.m` 文件并将\n\n```\nself.sumAB = inA + inB;\n```\n\n\
  更改为\n\n```\nself.sumAB = inA - inB;\n```\n\n显然，这不能正确地两个两个数字。再次构建测试，你应该能看到图 17.11\
  \ 所示的输出。加法操作的测试用例报告总和错误。错误消息使用了你在测试代码中添加的文本和参数。\n\n图 17.11\n这次测试失败了。单元测试代码生成了一条错误消息，告诉你哪个测试引发了错误。\n\
  \n![9781118007594-fg1711.tif](img/9781118007594-fg1711_fmt.jpeg)\n\n再次注意，测试不像普通的构建或调试会。错误出现在测试用例代码中，而不是被测试的类中。事实上，它（带有某种冗余）出现在定义错误的代码下方。它在\
  \ `Issue Navigator`（问题导航器）中被报告为测试程序包的问题，而不是主目标。\n\n这并不意外，但与标准的 `Xcode` 构建相比，是不寻常的，在使用\
  \ `SenTest` 测试框架时，记住这些差异是有价值的。\n\n![mac_tip.eps](img/mac_tip_fmt.jpeg) 提示\n\n`SenTest/OCUnit`\
  \ 是 Objective-C 测试的理想选择，但也有其他替代方案。对于 C++，值得探索来自 [code.google.com/p/googletest/](http://code.google.com/p/googletest/)\
  \ 的替代框架 `googletest`。该框架集成到 `Xcode` 中并不易事，但它为专家开发者提供了更丰富的功能集和更广泛的社区支持。\n\n![mac_tip.eps](img/mac_tip_fmt.jpeg)\
  \ 提示\n\n不要忘记你可以使用 `Instruments` 中的 UI 自动化功能来测试 UI。`UI Automation` 是一个不同的系统，但两个测试系统可以很好地工作。你可以使用单元测试来检查基础代码逻辑，然后运行\
  \ UI 以确保它正确地管理用户事件。\n\n## 总结\n\n本章介绍了 `SenTest/OCUnit` 单元测试框架。它解释了单元测试背后的一些理论，并演示了如何为单元测试准备项目以及如何设置\
  \ `Xcode` 使单元测试功能能够正常工作。\n\n它通过一个简单的测试用例说明了测试过程的核心功能，并总结了用于创建测试代码的关键 `STAssert`\
  \ 宏。\n\n最后，它展示了如何运行测试代码以及如何查找和解释它生成的消息。\n\n# 第四部分：附录\n\n## 本部分\n\n- 附录 A：使用 Xcode\
  \ 的工具和实用程序\n- 附录 B：使用其他编辑器\n- 附录 C：理解编译器技术\n\n# 附录 A：使用 Xcode 的工具和实用程序\n\n## 本附录\n\
