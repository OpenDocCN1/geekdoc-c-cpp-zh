  \n![9781118007594-fg0307.eps](img/9781118007594-fg0307_fmt.jpeg)\n\n符号链接系统可能看起来违反直觉，但它使得在不复制文件的情况下将文件添加到项目中成为可能。例如，你可以在磁盘上的文件夹中创建一个库或框架，并将其作为符号链接的集合导入到各个项目中，这些链接访问原始源文件夹中的原始文件。同样，你可以将图像文件或字体放在单个文件夹中，并通过链接将其导入到多个项目，而无需创建多个副本。\n\
