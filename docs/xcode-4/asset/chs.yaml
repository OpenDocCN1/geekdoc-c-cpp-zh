  \ PDF 手册。\n\n![bl.eps](img/bl_fmt.jpeg) `RLanguageModel` 为合成器支持自定义语言模型。\n\n# 命令行工具介绍\n\
  \n`Xcode` 的功能在命令行层面都有重复。如果你倾向于使用管道、进程和原始文本工作，可以使用任何 BSD（伯克利软件发行）发行版的标准工具。`Xcode`\
  \ 添加了一些其他特定的 OS X 工具。这些工具可以比较和处理文本文件；根据 Python、Perl、Ruby 或 Java 代码控制事件；提供内存使用和 Mac\
  \ 硬件的底层信息。\n\n工具的完整列表很长。许多非常专业化，有些已经过时。由于大多数有用功能在 `Xcode` 中也可用，因此详细描述超出了本书的范围。然而，硬件开发人员应该查看\
  \ Apple 工具文档（位于本附录之前列出的 URL），因为某些内核和 I/O 级工具只能通过命令行访问。\n\n![mac_note.eps](img/mac_note_fmt.jpeg)\
  \ 注意\n\n与本附录中提到的其他工具和实用程序不同，命令行工具默认不安装。安装 `Xcode` 时，勾选“UNIX 开发”复选框即可。\n\n\n\n\n\n\
  # 本附录\n\n- 理解 plist\n- 编辑 plist\n- 编辑 Core Data 模型文件\n- 使用外部编辑器\n\nXcode 包含了许多其他内置编辑器，并支持指向外部编辑器的链接。\n\
  \n## 编辑 plist\n\nPlist（或属性列表）定义了应用程序设置。当你创建一个新的 iOS 或 OS X 应用时，Xcode 会自动创建一个名为 `info.plist`\
  \ 的文件，并以应用名称名前缀——例如 `myApp-info.plist`。\n\n该文件包含了重要的应用设置——启动时加载的 nib 文件名、应用程序图标、版本号等，这些内容将在附录的后后部分进行讨论。你也可以根据自己的需求创建独立的自定义\
  \ plist 供自己使用——例如，用于定义应用程序偏好。\n\nPlist 的编辑比看起来要复杂。Xcode 4 有许多不显而易见的功能，如果你知道这些功能的存在并理解如何使用它们，它们可以简化编辑过程。\n\
  \n## 理解 plist\n\n在内部，`plist` 是以 `.plist` 扩展名保存的 XML 文件。内容是一个标准的 Cocoa `NSDictionary`。它包含一个命名键对象的层级结构，这些对象要么存储单个值，要么持有一个带有内容的数组或字典对象。\n\
  \n如果你是 iOS 和 OS X 的新手，可以将键/值对想象为一个包含两个组件的实体：一个键，这是一个名称字符串；一个值，可以是一个简单或复杂的对象。\n\n\
  简单值是以下内容之一：字符串、数字、日期、布尔值和通用数据字段。\n\n容器对象是数组或字典。\n\n数组以严格的顺序顺序存储值，可以通过数值索引或枚举索引进行访问。数组项通常带有数字显示，例如\
  \ Item 0、Item 1 等。不允许不连续的编号。\n\n字典的格式更自由，被用作一种更通用但速度较慢的键/值容器。\n\n容器对象可以嵌套。数组中的一个项可以是字符串、布尔值和另一个数组。这第二个数组可以包含一个日期和一个字典。该字典可能包含一个或多个后续集合，依此类推，从而创建一个层级数据结构。\n\
  \nPlist 通常用于应用程序启动设置和用户偏好的初始化。尽管它们可以变得任意复杂，但它们并不是为通用数据存储而设计的。某些 plist 具有特定键和内容格式的标准。当你在\
  \ Xcode 中编辑这些内容时，你只能从固定的选项集中添加键。键值的格式是预设的。\n\n其他 plist 是可选的且自由的。设计它们的格式和内容完全取决于你。\n\
  \n掌握 plist 编辑需要一些时间，因此在专业工作中使用它之前，对其进行实验是一个良好的习惯。\n\n### 开始编辑 plist\n\n虽然 Xcode\
  \ 包含一个通用的 plist 编辑器，但它还包含了简化某些类型 plist 编辑的功能。\n\n有四种选项：\n\n- ![bl.eps](img/bl_fmt.jpeg)\
  \ 要编辑项目包中包含的任何 plist，请在 Xcode 中选择它，如图 B.1 所示。这会将文件加载到 Xcode 的 plist 编辑器窗口中。\n- ![bl.eps](img/bl_fmt.jpeg)\
  \ 为了简便访问主应用程序设置 plist——即 `info.plist` 文件，你可以使用项目构建设置中内置的两个编辑器。这些编辑器仅可用于修改这一个文件。\n\
  - ![bl.eps](img/bl_fmt.jpeg) 要编辑另一个 plist——例如，用于定义其他应用程序偏好的标准 OS X plist 之一——请在\
  \ Finder 中双击它。安装 Xcode 之后，它将成为所有 plist 的默认编辑器。会出现一个浮动的编辑器窗口，如图 B.2 所示。该编辑器与 Xcode\
  \ 中的 plist 编辑器完全相同。如果 plist 是 Xcode 项目的一部分，则不会加载该项目。\n- ![bl.eps](img/bl_fmt.jpeg)\
  \ 你可以在 TextEdit 中作为原始文本编辑 plist，如图 B.3 所示。在 Finder 中右键点击 plist，选择“打开方式”⇒其他...，并在应用程序窗口中选择\
  \ `TextEdit.app`。\n\n![mac_caution.eps](img/mac_caution_fmt.jpeg) 注意\n\n在 Xcode\
  \ 中，你不需要手动保存 plist 文件。如果你在多个 Xcode 编辑器中编辑同一个文件，你会发现任何编辑器中的任何更改都会立即同步到每个编辑器中。文件会在构建或退出项目时自动保存，就像源代码文件一样。这仅适用于\
  \ Xcode。在 `TextEdit` 中进行的编辑必须以通常的方式保存。同时在 Xcode 和 `TextEdit` 中打开同一个文件是一个好主意。\n\n\
  图 B.1\n\n在 Xcode 中编辑项目 plist 是处理 plist 的简单方法。\n\n![9781118007594-fgb201.tif](img/9781118007594-fgb201_fmt.jpeg)\n\
  \n图 B.2\n\n将 plist 作为独立文件加载到 Xcode 编辑器将启动 Xcode（如果它尚未运行）。如果 plist 是项目包的一部分，则不会加载项目的其余部分。\n\
