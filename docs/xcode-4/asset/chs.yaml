  \ iOS 模板可以创建单元测试，这种功能在第 17 章有讨论。\n\n![mac_note.eps](img/mac_note_fmt.jpeg) 注意\n\n\
  取消勾选 `Include Unit Tests`（包含单元测试）选项。这会为你的代码添加功能，在第 17 章有讨论。\n\n### 图 3.4\n大多数 iOS\
