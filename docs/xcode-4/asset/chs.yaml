  \ 总结\n\n本附介绍了 plist 以及四种不同的编辑方法。解释了项目的 `info.plist` 文件在 Xcode 设置中如何被特殊处理。还演示了如何使用\
  \ Xcode 主 plist 编辑器编辑其他 plist 文件。接下来，概述了 Core Data 的核心功能，并解释了如何使用 Xcode 新的 Core\
  \ Data 模型编辑器。最后，以关于使用外部编辑器其他类型的简要说明结束。\n\n## 附录 C：理解编译器技术\n\n## 本节内容\n\n### 介绍 GCC\n\
  \n### 迁移到 LLVM\n\nXcode 3 和 Xcode 4 之间最大的变化之一几乎是完全不可见的。Xcode 4 开始从 GCC（GNU 编译器）前端和代码生成器转向名为\
  \ LLVM（低级虚拟机）的新编译器技术。这一小变化对 Xcode 的未来具有巨大影响，并影响了 Xcode 4 中某些新功能的设计。\n\n图 C.1 显示了编译器的两个主要组件。解析器/前端读取给定语言的源码并转换为中间指令列表。这被称为中间形式（IF）代码。IF\
  \ 代码使用一组简化的虚拟指令，以与机器和语言无关的方式表示源码中的基本操作和变量。IF 代码还包含一个流图，用于优化指令的处理顺序。\n\n代码生成器模块将\
  \ IF 代码转换为特定机器的二进制文件。它执行利用特定目标处理器特性的进一步优化——例如管理寄存器——以创建尽可能高效的二进制文件。大多数编译器（包括 Xcode）创建带有\
  \ .o（对象文件）扩展名的二进制文件。\n\n\n\n\n\n# 引言\n\n链接器（图中未显示）负责解析跨不同目标文件的变量引用，并将它们收集成一个单一的可执行二进制文件。例如，如果你在某个文件中定义了一个名为\
  \ `myNumber` 的变量，链接器会修复 `myNumber` 在二进制文件中的位置，并确保项目中的任何地方引用都能访问该位置。\n\n代码解析和代码生成技术仍在研究和开发中。链接器技术在很大程度上已经解决，并且通常“开箱即用”。\n\
  \n![mac_note.eps](img/mac_note_fmt.jpeg) 注意\n\n一个包含编辑器、一个或多个语言前端、代码生成器和调试器的完整编译器工具集有时被称为工具链。\n\
  \n图 C.1\n\n揭示编译器。IF 代码使用了一种简化的虚拟指令集，该指令未在任何特定的 CPU 上实现。\n\n![9981118007594-fgb301.eps](img/9781118007594-fgb301_fmt.jpeg)\n\
  \n# 介绍 GCC\n\n早版本的 Xcode 在解析器和代码生成器上都使用 `GCC` 模块。图 C.2 显示的 `GCC` 是由自由软件基金（FSF）管理的内核项目。`GCC`\
  \ 的“自由”体现在任何人都可以自由地进行修改和开发；它的“免费”还体现在它不需要任何费用。\n\n图 C.2\n\n[gcc.gnu.org](http://gcc.gnu.org)\
  \ 的 `GCC` 网站包含了有关更新、语言支持和使命声明的信息。\n\n![9781118007594-fgb302.tif](img/9781118007594-fgb302_fmt.jpeg)\n\
  \n最初，Xcode 被设计为围绕 `GCC` 构建的运行时封装和代码编辑器。当用户点击“运行”图标时，Xcode 在后台运行 `GCC`，收集其警告和错误信息，并将它们显示在\
  \ Xcode 的“构建结果”（Build Results）窗口中。你可以直接用文本编辑器编辑 Xcode 文件，并在“终端”（Terminal）命令行中直接运行\
  \ `GCC`。但大多数开发者发现使用基于窗口的编辑环境更方便、更高效，因为它提供了代码补全和错误标记等额外功能。\n\nXcode 的调试器是 `GCC` 调试工具\
  \ `GDB` 的封装。Xcode 将消息和用户操作转换为发送给 `GDB` 的文本命令，并将 `GDB` 的响应转换为窗口输出。\n\n`GCC` 的优势拥有成熟的代码库以及对\
  \ C 家族之外语言的广泛支持。虽然 Xcode 不直接支持 ADA 和 `Fortran` 等语言，但你可以为 Xcode 添加插件，使其能够使用 Xcode\
  \ 的编辑器编写 C 及其后代语言以外语言的代码。尽管这是一个少数人的需求，但 `Fortran` 等语言仍用于科学计算。\n\n然而，随着时间的推移，`GCC`\
  \ 已经变成了一个遗留项目（legacy project）。开发由志愿者运行。某些功能和 Xcode 插件已成为被弃软件（abandonware），不再与当前版本的\
  \ Xcode 兼容。例如，图 C.3 显示了 `GCC` `Fortran` 插件的当前状态。\n\n图 C.3\n\n许多许多志愿者开发者运行的项目一样，在项目成功完成后，人们维护\
  \ `GCC` 插件的兴趣就会减弱。\n\n![9781118007594-fgb303.tif](img/9781118007594-fgb303_fmt.jpeg)\n\
  \n`GCC` 还有其他缺点。代码库的部分可以追溯到 20 世纪 80 年代，而 21 世纪第二个十年的编译器技术先进得多。简单来说，`GCC` 是低效且过时的。它编译代码速度慢，生成的代码也慢。\n\
  \n`GCC 4.0` 现在被认为是遗留编译器，不再在 Xcode 中支持。`GCC 4.2` 仍然可用以向下兼容。`GCC 4.5` 是 `GCC` 的最新版本，但它将在未来的\
  \ Xcode 版本不再支持。\n\n# 转向 LLVM\n\n`LLVM` 的项目网站如图 C.4 所示，这是一个更新的编译器工具集，它利用最新的编译器研究来加速编译时间并创建更快的二进制文件。`LLVM`\
  \ 起于伊利诺大学厄巴纳香槟分校 Vikram Adve 和 Chris Lattner 领导的一项研究项目。2005 年，Apple 聘用了 Lattner\
  \ 并建立了一个团队，为 Xcode 以及 Apple 的内部研发开发 `LLVM`。\n\n图 C.4\n\n当前的 Xcode 版本仍为了向下兼容支持 `GCC`。未来的版本将完全转向\
  \ `LLVM`。\n\n![9781118007594-fgb304.tif](img/9781118007594-fgb304_fmt.jpeg)\n\n\
  与 `GCC` 一样，`LLVM` 的源代码是开放，并且是一个协作开发项目。但与 `GCC` 不同，`LLVM` 根据 BSD（伯克利软件发行版）版本的许可发布，该许可允许专利使用。\n\
  \n尽管名字如此，`LLVM` 并不试图实现虚拟机——一个完整的抽象模型计算机。相反，它利用最新的学术研究来创建快速、高效且高度优化的代码。`LLVM` 代码生成模块与\
  \ `GCC` 生成的 IF 代码兼容。这使得将 `GCC` 作为熟悉的前端同时使用 `LLVM` 输出最终代码成为可能。\n\n# 介绍 Clang\n\n\
  `Clang` 是一个 C 家族前端，与 `LLVM` 配对并与其紧密集成。`Clang` 解析 Objective-C 代码的速度比 `GCC` 快得多——在某些测试中快了三倍。它还包含额外的功能，这些功能开始影响\
  \ Xcode 中对 C++ 和 Objective-C 的编辑和调试。\n\n`Clang` 的一个优势是模块化。`Clang` 更先进并且可以交互式运行。它还包含一个可以突出\
  \ bug 的静态分析工具。这两个功能都提高了 `LLDB`（底层调试器）的性能和用性，`LLDB` 作为 `GDB` 的高级替代方案包含在 `LLVM` 中。`Clang`\
  \ 开发为可以单独或一起使用的库和模块系列。`LLDB` 包含了解析器的关键功能，允许你在调试语句中包含复杂表达式或生成复杂表达式。像 `LLVM` 一样，`Clang`\
  \ 是一个开放协作项目。网站如图 5 所示。\n\n这些是 `Clang` 的其他优点：\n\n![bl.eps](img/bl_fmt.jpeg) 非常快速且内存高效的代码解析：这使得大型项目在基础硬件上更具可行性。\n\
  \n![bl.eps](img/bl_fmt.jpeg) 改进的感知消息和错误修复：与 `GCC` 相比，`Clang` 尝试猜测开发者意图并自动修复代码。\n\
  \n![bl.eps](img/bl_fmt.jpeg) 带错误查找的代码分析：例如，`Clang` 可以报告 iPhone 代码中的内存错误。\n\n![bl.eps](img/bl_fmt.jpeg)\
  \ 对 C、Objective-C、C++ 和 Objective-C++ 的统一支持：`Clang` 为所有 C 系语言提供了单一解析器，使得在项目中混合代码变得更容易。它还旨在支持所有变体，包括方言和特殊功能。\n\
  \n![bl.eps](img/bl_fmt.jpeg) 交互式调试：`LLDB` 包含了解析器的功能，允许你包含复杂表达式。\n\n图 C.5\n\n[clang.llvm.org](http://clang.llvm.org)\
  \ 的 `Clang` 网站介绍了 `Clang` 的关键功能并宣传其优势。\n\n![9781118007594-fgb305.tif](img/9781118007594-fgb305_fmt.jpeg)\n\
  \n# 选择编译器\n\nXcode 4 默认使用名为 `LLVM GCC 4.2` 的混合编译器。它使用 `LLVM` 优化器和代码生成器配合 `GCC 4.2`\
  \ 前端。虽然这不是最快或最高效的选项，但它是最可靠的。\n\n`LLVM Compiler 2.0` 选择 `LLVM` 代码生成器和 `Clang` 前端。目前，这仍然是一个实验性选项。`Clang`\
  \ 仍在开发中，不支持 `GCC` 的全部扩展和其他特殊功能。这在大多数 iPhone 项目中不太可能引起问题，但偶尔可能对 OS X 开发者产生影响。\n\n\
  \n\n\n\n![mac_note.eps](img/mac_note_fmt.jpeg) 注意\n\n要查看当前的不兼容列表，请参阅 [clang.llvm.org/docs/UsersManual.htm](http://clang.llvm.org/docs/UsersManual.htm)\
  \ Clang 用户手册底部的 `C Language Features` 部分。\n\n要手动选择编译器，请选择左侧窗格中的 `Project Navigator`，并点击窗格左角的\
  \ `Project` 项目，如图 C.6 所示。接下来，选择 `Build Settings` 并找到 `Compiler Version`。点击箭头显示包含编译器列表的弹出菜单。\n\
  \n图 C.6\n\n在选择编译器时，请记住 `LLVM GC 4.2` 默认仍然是目前的最佳选择，但你可以尝试 `LLVM 2.0` 看看是否可以缩短构建时间和提高执行速度。\n\
  \n![9781118007594-fgb306.tif](img/9781118007594-fgb306_fmt.jpeg)\n\n![mac_note.eps](img/mac_note_fmt.jpeg)\
  \ 注意\n\n如果你的项目有多个目标，可以为每个目标选择不同的编译器。这通常没有用处。你极可能会遇到需要从 `LLVM` 降级到 `GCC` 的编译器错误——但这种情况发生的频率极低，你不太可能遇到这个问题。\n\
  \n当你选择一个编译器时，其下方的项目将更新为特定编译器的选项。如果你在 `Build Settings` 标签下方的行中选择 `Basic`，可以查看最关键的编译器选项。对于\
  \ iPhone 开发，通常可以保持这些设置不变。对于 OS X 开发，选择 `All` 查看所有编译器设置，然后向下滚动，如图 C.7 所示。\n\n尽管列表看起来长得令人生畏，但只有少数设置可能需要修改，如表\
  \ C.1 所示。第 12 章和第 13 章介绍了项目和目标的关键构建设置。但你可能也想自定义编译器设置，例如通过修改 `Warnings` 来控制显示哪些警告。移除某些警告是危险的，选择\
  \ `Inhibit All Warnings` 选项确实非常危险。但许多警告取决于个人喜好，你可以使用此章节显示默认禁用的警告，并禁用对你可能没用的警告。\n\
  \n图 C.7\n\n选择 `All` 查看完整的编译器选项列表。每个编译器显示的列表都不同，但大多数设置可以保持不变。\n\n![9781118007594-fgb307.tif](img/9781118007594-fgb307_fmt.jpeg)\n\
  \n![/Table C.1](img/9781118007594-tbbappc1.jpg)\n\n## 总结\n\n本附录介绍了编译器技术的本质功能，并列出了\
  \ Xcode 4 中新的编译器选择。它探索了新技术的特性，解释了如何更改默认编译器，并列出了在为 OS X 开发时需要考虑的最重要设置。\n\n"
