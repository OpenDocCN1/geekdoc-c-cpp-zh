  \n你有三个应用管理选项：\n\n![bl.eps](img/bl_fmt.jpeg) `Download`（下载）：这会将应用支持目录——`/Documents`、`/Library`和`/tmp`中的文件复制到你\
  \ Mac 磁盘上的某个位置。你可以使用此选项进行调试，检查文件是否被正确创建和删除，并检索应用生成的有用数据。\n\n![bl.eps](img/bl_fmt.jpeg)\
  \ `Add`（添加）：这会复制并安装预编译的应用。`Xcode`可以在构建后自动安装应用，因此在测试期间不需要使用此选项。但你可以用它安装其他开发者创建用于测试的应用文件，只要他们提供了兼容的配置描述文件。你也可以使用此选项在删除后重新安装预构建的应用，而无需重新构建。\n\
