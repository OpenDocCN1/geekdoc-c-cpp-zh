  \ Fetch Request:` 这定义了一个获取请求，用于从匹配所选实体类型且匹配可选属性条件列表的记录中读取数据。图 B.15 显示了一个示例。\n\n\
  ![bl.eps](img/bl_fmt.jpeg) `Create NSManagedObject subclass:` 使用此选项创建一个或多个实体的自定义版本，带有额外的代码功能。默认情况下，每个实体都是\
  \ `NSManagedObject` 的实例。此类为实体提供了基本的读取、搜索和写入选项。如果你的实体需要执行更多操作——例如，每当访问数据时它可能需要与应用程序的其他部分交互——则此选项会为子类创建代码文件。\n\
