  \ `Next`（下一步），使用面板底部三分处的 `Device Family`（设备族）下拉菜单选择目标设备，如图 3.4 所示。\n\n在 `Product\
  \ Name`（产品名称）框中为 `App` 输入名称。该名称被用作项目主源文件的前缀，并定义了应用安装到 Springboard（主屏幕）时显示的名称。这被称为产品名称。你稍可以使用第\
  \ 12 章和第 13 章中描述的构建设置来更改它。你也可以重命名文件，但这是一个更复杂的过程，通常没有帮助或必要。\n\n![mac_caution.eps](img/mac_caution_fmt.jpeg)\
