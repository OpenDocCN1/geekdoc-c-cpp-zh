  \nXcode 左侧带有类文件夹图标的窗格被称为 `Project navigator`（项目导航器）。它显示的并不是标准的目录列出列表。\n\n在 `Xcode\
  \ 3` 的较早版本中，此窗格中列出的项目类似于网页链接；它们看起来像目录和文件夹列表，但实际上是指向磁盘上项目的松散符号链接。这些链接非常松散，你可以在重命名它们而不会更改磁盘上的文件。\n\
  \n这造成了几乎无尽的困惑，特别是当链接失效时——这种情况经常发生。因此在 `Xcode 3` 的后续版本中，这种关系被简化了。如果你重命名此窗格中的一个项目，磁盘上的项目也会被重命名。如果你删除一个项目，可以选择将其移动到垃圾桶，或从项目中删除但保留磁盘上的文件。`Xcode\
  \ 4` 使用相同的系统。\n\n类文件夹的图标仍然完全是抽象的。包含它们是为了帮助你在 `Project navigator` 中将相关文件组合在一起，但它们在磁盘上并不。\n\
