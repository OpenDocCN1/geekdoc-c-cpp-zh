  \n### 开始使用 Quartz Composer\n\n图 A.3 所示的 Quartz Composer 是一个复杂的工具，可以创建静态图像过滤器和复杂的动画（包括屏幕保护程序）。正如其名，它使用了\
  \ OS X 内置的 Quartz 图像生成和处理库，但你不需要了解任何 Quartz 即可成功使用 Composer。\n\n图 A.3\n\n一个简单的 Quartz\
  \ Composer 项目就可以创建复杂的动画效果。\n\n![9781118007594-fgb103.tif](img/9781118007594-fgb103_fmt.jpeg)\n\
  \nComposer 是视频和图像过滤领域的音乐合成器。开发者将对象库（称为补丁 patches）中的组合连接在一起，这些组合用于创建并变换图形、视频以及相关的参数信息。\n\
  \n组合（Composition）是一组具有定义连接的对象。连接通过虚拟补丁线视觉化地连接了补丁的输入和输出参数，这些参数显示为每个可见对象上的终端。要建立连接，请从一个对象的输出终端拖一根线到另一个对象的输入终端。\n\
  \n该库功能非常丰富，拥有数百个补丁。某些补丁执行简单的操作，如基础算术或对动画参数的简单随时间控制。另一些则处于中间层。例如，音频分器补丁（audio splitter）将音频流分成一组频率过滤的桶（bins），可以用于构建音频可视化器。还有少数补丁可以创建非常复杂的效果，你可以将其放入自己的组合中。\n\
  \n补丁系统包含宏功能，可以隐藏组合的内部复杂性，并将其作为名为 clip（片段）的新补丁重复使用。Clip 可以几乎无限地嵌套。\n\nQuartz Composer\
  \ 包含一组应用程序模板，列于表 A.1 中。大多数模板都包含你可以修改和扩展的示例组合。\n\n![/Table A.1](img/9781118007594-tbbappa1.jpg)\n\
  \n![mac_caution.eps](img/mac_caution_fmt.jpeg) 注意\n\n保存到 `/Library/Screen Savers`\
  \ 或 `/Library/Compositions` 的组合将供其他应用程序使用。在 Quartz Composer 内部向这些文件夹保存文件之前，你可能需要修改文件权限。此外，请注意\
  \ iTunes 与 Quartz Composer 可视化器补丁之间的链接只有在 iTunes 中选择一个现有的可视化器后才会开始正常工作。如果你不选择现有的可视化器并在\
  \ iTunes 中运行它，可视化器模板似乎不起作用。\n\n### 在 Xcode 中使用 Quartz Composer\n\n在底层，Quartz Composer\
  \ 创建 Quartz 库调用，这些调用随后被编译为在 Mac 显上运行的 OpenGL 指令。Composer 比 Quartz 或 OpenGL 都容易用得多。作为一个具有即时反馈的视觉化开发工具，它比其他工具更高效、更有创意。\n\
  \n你可以视觉化地为 Quartz Composer 开发，也可以访问与两个 Quartz Composer 播放对象密切相关的代码级：`QCView` 和 `QCRenderer`。在\
  \ Mac 上，Xcode 包含一个 Quartz Composer 插件应用程序模板。你可以用它来创建自己的补丁。你还可以从 IB 库中向自己的应用程序添加一组\
  \ Quartz Composer 对象，如图 A.4 所示。该列表包含一个可以将组合中的参数连接到自定义代码的补丁控制器、一个播放视图、一个参数视图和一个组合选择器。\n\
  \n图 A.4\n\n使用 IB 为标准 Mac 应用程序模板添加 `QCView` 对象。\n\n![9781118007594-fgb104.tif](img/9781118007594-fgb104_fmt.jpeg)\n\
  \nQuartz Composer 非常强大，只需很小的努力就能创建复杂且丰富的视频效果。遗憾的是，它的文档匮乏，且对 API 和视觉编辑器的支持极乎其微。然而，如果你对视觉效果感兴趣，坚持查阅文档是值得的，目前地址为\
  \ `developer.apple.com/graphicsimaging/quartzcomposer`。在网上其他地方搜索第三方示例也是值得的。虽然并不多，但存在的那些可以帮助补充官方文档中缺失的某些背景细节。\n\
  \n![mac_note.eps](img/mac_note_fmt.jpeg) 提示\n\n目前，Quartz Composer 仅适用于 OS X。它不支持\
  \ iOS。\n\n## 与其他工具一起工作\n\n其余工具是实用程序和附加品的杂锦。其中没有哪个是必不可少的。某些非常有用，但另一些似乎是因为历史原因而留在那。\n\
  \n### 介绍音频工具\n\n`/Developer/Applications/Audio` 文件夹包含两个工具：`HALLab` 和 `AULab`。`HALLab`（硬件抽象层实验室），如图\
  \ A.5 所示，显示有关音频硬件和驱动程序的信息。你可以用它测试音频驱动程序并报告默认系统驱动的状态。\n\n`AULab`（音频单元实验室）是音频单元的宿主应用程序。如果你没有\
  \ Logic 这样的独立序列器应用程序，可以使用 `AULab` 来托管和测试 AU 插件。\n\n图 A.5\n\n`HALLab` 界面简单，但你可以用它检查音频驱动程序及其相关硬件的操作。\n\
  \n![9781118007594-fgb105.eps](img/9781118007594-fgb105_fmt.jpeg)\n\n### 介绍图形工具\n\
  \n图形工具包括三组应用程序：Quartz 和 Quartz Composer 支持、OpenGL 支持以及通用图形。\n\n#### 通用图形工具\n\n有两个通用图形工具。`Pixie`\
  \ 是一个浮动窗口。窗口下的内容可以放大 1 倍到 12 倍，具体取决于 `Pixie` 的设置。你可以锁定水平或垂直移动。`Pixie` 对于通用窗口放大非常有用，并包含一个可以将放大后的图像保存到磁盘的功能。\n\
  \nCore Image Fun House（图 A.6 所示）是一个过滤器预览工具。你可以对一组图像测试标准过滤器的效果。你还可以堆叠过滤器创建组合效果，并使用此工具测试自定义过滤器。\n\
  \n图 A.6\n\n在标准图像上使用几个 Core Image 过滤器的结果\n\n![9781118007594-fgb106.eps](img/9781118007594.jpeg)\n\
  \n#### Quartz 图形工具\n\n两个 Quartz 图形工具是 Quartz Composer Visualizer 和 Quartz Debug。\n\
  \nQuartz Visualizer 是 Quartz Composer 内置 Viewer 工具的高版本，具有改进的网络支持。你可以用它测试本地组合并远程运行。\n\
  \nQuartz Debug 是一个报告和控制工具，监控帧率和 CPU 负载。你可以用它启用或禁用少数硬件加速选项。\n\n#### OpenGL 图形工具\n\
  \nOpenGL Driver Monitor（图 A.7 所示）显示了关于 OpenGL 事件极其全面的列表。要使用它，点击窗口右下角的 Parameters\
  \ 按钮，从滑动列表中选择一个或多个驱动器参数。结果报告了整个 OpenGL 子系统的状态。\n\n图 A.7\n\n使用 OpenGL Driver Monitor\
  \ 跟踪系统范围内的 OpenGL 事件和参数\n\n![9781118007594-fgb107.eps](img/9781118007594-fgb107.jpeg)\n\
  \nOpenGL Profiler 工具是应用程序对应的工具。你可以将其附加到任何应用程序，并用它监控一些与图形相关的信息。初始设置可能有点复杂，你可能需要注销\
  \ Mac 并重新登录此工具才能正常工作。\n\nOpenGL Shader Builder 是着色器代码开发和测试的环境。它为着色器测试提供了一个通用的运行环境，并带有用于开发的简单编辑器。虽然你可以直接在\
  \ Xcode 中开发着色器代码，但 OpenGL Shader Builder 包含了简单但实用的测试形状，具有基础纹理加载和选择功能。\n\n\n\n\n\n\
  ### 性能工具介绍\n\n有两个性能工具。`Quartz Debug` 工具是 `/Graphics` 文件夹下 `Quartz Debug` 工具的直接别名。\n\
  \n`Spin Control` 用于报告显示“旋转彩彩球”的挂起事件。要使用 `Spin Control`，请启动它并保持运行。当应用程序挂起时检查它。`Spin\
