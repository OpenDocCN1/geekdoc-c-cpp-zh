  \n## 理解应用程序设置\n\n当你的应用程序启动时，执行的操作之一就是加载这个 `info.plist` 文件。它从文件中读取键和值以查找应用程序设置。键按五个标题分组：\n\
  \n- 启动服务：这些键定义了底层的特定特定选项。\n- OS X：这些杂项键适用于 OS X 应用。\n- UIKit：这些杂项键适用于 iOS 应用。\n\
  - Core Foundation：这些适用于一个或两个平台的键定义了应用程序的维护和设置功能。\n- Cocoa：这些键定义了 Cocoa 初始化选项和支持功能。\n\
  \n应用程序编辑器\n\n`info.plist` 编辑器包含了编辑默认键以及添加可选新键的功能。\n\n\n\n\n\n![bl.eps](img/bl_fmt.jpeg)\
  \ 你可以在项目导航器（Project Navigator）中选择它，并使用标准的 plist 编辑器进行编辑，该编辑器将在本文稍后介绍。\n\n![bl.eps](img/bl_fmt.jpeg)\
  \ 在项目构建设置中，你可以使用简化的 Summary 编辑器来显示和更改选的重要设置，如图 B.4 所示。\n\n![bl.eps](img/bl_fmt.jpeg)\
  \ 同样在项目构建设置中，你可以使用更全面的 Info 编辑器，如图 B.5 所示。该编辑器与标准的 Xcode plist 编辑器类似，但它添加了一些额外功能。\n\
  \n要使用构建设置中的编辑器，请选择项目导航器左角的项目名称，选择 `TARGETS` 下对应的项目，并在构建设置窗口顶部选择 Summary 或 Info 标签页。\n\
  \n![mac_caution.eps](img/mac_caution_fmt.jpeg) 注意\n\n重要的是，要理解这些编辑选项编辑的是同一个文件。\n\n\
  ### 图 B.4\n\n当你查看 Summary 设置时，没有任何迹象表明当你更改这些设置时，正在编辑 `info.plist` 文件，但你确实在编辑——是立即且永久地编辑。\n\
  \n![9781118007594-fgb204.tif](img/9781118007594-fgb204_fmt.jpeg)\n\n### 图 B.5\n\n\
  更全面的 Info 编辑器与标准的 Xcode plist 编辑器类似，但它增加了字段用于设置可选的文档类型和 UTI（统一类型标识符）以及 URL scheme\
  \ 键。iOS 和 OS X 版本的文件内容略有不同，但它们具有明显的相似性，并可以用相同的方式进行编辑。\n\n![9781118007594-fgb205.tif](img/9781118007594-fgb205_fmt.jpeg)\n\
  \n### 使用 Summary 编辑器更改设置\n\nSummary 设置编辑器是按钮、菜单和文本字段的集合，用于定义 App Store 接受所需的所需的键键值。为了简单起见，此编辑器隐藏了文件中的许多键。要查看并编辑这些键，请使用其他编辑器之一。\n\
  \n虽然设置的含义可能显而易见，但 UI 特性是 Mac 标准的，且足够简单，自其解释即可。更改任何设置都会立即更新应用中 `info.plist` 文件的对应值。设置列于表\
  \ B.1。\n\n![/Table B.1](img/9781118007594-tbbappb1.jpg)\n\n### 使用 Build Info 编辑器更改设置\n\
  \n与 Summary 编辑器列出项目 `info.plist` 文件中选中的高亮项不同，Build Info 编辑器列出了整个文件中每一个键和值。它与本文稍后介绍的标准\
  \ plist 编辑器非常相似，但包含了四个额外选项：Document Types（文档类型）、Exported UTIs（导出的 UTI）、Imported\
  \ UTIs（导入的 UTI）和 URL Types（URL 类型）。OS X 版本增加了一个名为 Services（服务）的额外选项。这些选项为 plist\
  \ 添加了标准键，用于定义应用程序可选的文档类型、URL scheme 和服务支持。\n\n### 添加可选键\n\n要添加可选键，请按照以下步骤操作：\n\n\
  1. 右键点击现有的行。只要它不是多值类型，你可以选择任何行；例如，`Type` 字段不是 `Array` 或 `Dictionary`。\n2. 从浮动菜单中选择\
  \ `Add Row`（添加行）。\n3. 从浮列表中选择一个键，如图 B.6 所示。\n4. 点击 `Value`（值）字段以编辑该键。\n\n值的编辑取决于值的类型，将在本文稍后的通用\
  \ plist 编辑器描述中进行说明。\n\n### 图 B.6\n\n在 `info.plist` 文件中添加一个可选键\n\n![9781118007594-fgb206.tif](img/9781118007594-fgb206_fmt.jpeg)\n\
  \n要删除键，请选择该行并点击 `Type` 字段左侧的 `-`（减号）图标。\n\n键编辑有几个注意事项。某些键仅在一个平台上有效；例如，为 OS X 应用指定\
  \ `Application requires iPhone environment` 键是没有意义的。但 iOS 和 OS X 项目的键列表是相同的，没有任何机制阻止你向项目设置中添加无效的键。结果是不可预测的；操作系统可能会忽略该键，也可能导致你的应用程序崩溃。\n\
  \n不要假设这些键的作用如宣传的那样，因为某些键并非如此。例如在 iOS 4.2 中，你可以为 iOS 应用设置 `Status bar is initially\
  \ hidden` 键，但除非你在应用的 `applicationDidFinishLaunching:` 方法中添加额外的支持代码，否则状态栏在启动后仍然可见。通常情况下，显式初始化代码比启动键更可靠。对键进行实验以确保它能正常工作是一个良好的做法。\n\
  \n最后，请务必阅读《信息属性列表键参考》（Information Property List Key Reference）。该参考资料被埋在 docsets\
  \ 中，除非你知道它的存在，否则很难找到。没有它，你将不知道哪些键是可用的以及它们的作用是什么，启动选项和设置将保持难以解释且神秘。\n\n### 添加对文档、URL\
  \ scheme 和服务的支持\n\n除了通用启动选项外，丰富的 iOS 和 OS X 开发者和程序员可以添加更多可选键，以定义应用如何使用文件类型、URL scheme\
  \ 和服务。\n\n在 iOS 和 OS X 中，URL scheme 是一种连接文件类型、URL scheme 和服务的系统。在 iOS 和 OS X 中，URL\
  \ scheme 是一种连接文件类型、URL scheme 和服务的系统。在 iOS 和 OS X 中，URL scheme 是一种连接文件类型、URL scheme\
  \ 和服务的系统。在 iOS 和 OS X 中，URL scheme 是一种连接文件类型、URL scheme 和服务的系统。\n\n![mac_caution.eps](img/mac_caution_fmt.jpeg)\
  \ 注意：参见服务实施指南。这些可选键出现在 Info 编辑器中。\n\n### 创建 plist\n\n应用的 `info.plist` 文件会自动为你创建且其键是固定的，但你可以根据需要添加更多的\
  \ plist。方法如下：\n\n1. 右键点击 `Supporting Files` 组，选择 `New File`（新建文件）。\n2. 对于 iOS 和\
  \ OS X，选择 `Resource` 然后是 `PropertyList`。\n3. 选择 `Next`，使用有用的名称保存文件。\n\n### 使用通用\
  \ Xcode plist 编辑器\n\n主 Xcode plist 编辑器与构建设置中的 Info 编辑器类似。事实上，`info.plist` 只是许多默认\
  \ plist 文件类型之一。在 Summary 和 Info 编辑器中，plist 文件类型是固定的。在通用编辑器器中，你可以选择另一种 plist 类型。\n\
  \n要选择文件类型，在编辑区域任意位置右键点击，选择 `Property List Type`（属性列表类型），如图 B.7 所示。从子菜单选择一个选项。\n\n\
  ### 图 B.7\n\n当你设置 plist 类型时，这不会修改文件类型；它是在编辑时显示的不同默认键集之间切换。\n\n\n\n\n\n![9781118007594-fgb207.tif](img/9781118007594-fgb207_fmt.jpeg)\n\
  \n![mac_note.eps](img/mac_note_fmt.jpeg) 笔记\n\n这些选项并非所有都有完善的文档。要了解每个文件类型的作用，最简单的方法是选择它，选择一个或多个默认键，然后在文档中搜索它们。大多数选项都是面向中级到专家级开发者的。\n\
  \n设置类型后，你可以通过以下方式编辑列表：\n\n![bl.eps](img/bl_fmt.jpeg) 添加新键：右键点击现有的单值键，并选择 `Add Row`（添加行）。你可以从默认列表中选择键名，或者编辑默认的\
  \ `New Item`（新建项目）名称。\n\n![bl.eps](img/bl_fmt.jpeg) 更改或选择键类型：右键点击该键，从 `Value Type`（值类型）子选项中选择一种类型。\n\
  \n![bl.eps](img/bl_fmt.jpeg) 删除键：选择该键，使用右键菜单中的 `Cut`（剪切）选项或按 `Delete`键。\n\n![bl.eps](img/bl_fmt.jpeg)\
  \ 查看原始键名：对于与 Cocoa 以及其他操作系统常量和参数相关的键，可以通过右键点击并选择 `Show Raw Keys/Values`（显示原始键/值）来查看键名。这将键显示为名称——例如\
  \ `CFBundleIconFile`——而不是文本描述。这在文档中查找键名时非常有用。\n\n![bl.eps](img/bl_fmt.jpeg) 编辑值：值的编辑取决于键的类型。详情请参见表\
  \ B.2。\n\n请注意，如果你正在创建一个完全自定义的 plist，那么数组或字典是否是存储数据的最佳容器由你决定。如果你正在编辑任何标准预定义键列表，则类型由标准值定义，且无法编辑。\n\
  \n![mac_caution.eps](img/mac_caution_fmt.jpeg) 注意\n\n请注意，如果列表中没有单值键，当你尝试添加新键时，你会在其中一个多值项中获得一个新的键/值对。解决方法是制作该多值项的副本并根据需要进行编辑，而不是尝试从头开始添加。\n\
  \n![/Table B.2](img/9781118007594-tbbappb2.jpg)\n\n# 编辑 Core Data 文件\n\n除了更新的 plist\
  \ 编辑器外，Xcode 4 还包含一个修订的 Core Data 文件编辑器。Core Data 是 iOS 和 OS X 均包含的一个可选数据管理框架。尽管\
  \ Core Data 中使用的概念非常简单，但用于描述它们的英文单词很复杂，API 的元素也比实际需要的更复杂。这使得 Core Data 看起来比实际上更令人畏畏。\n\
  \n### 理解 Core Data\n\nCore Data 有三个主要元素，由三个可选元素支持：\n\n![bl.eps](img/bl_fmt.jpeg)\
  \ 管理对象上下文（managed object context）：这是“对象的容器”的复杂说法。\n\n![bl.eps](img/bl_fmt.jpeg)\
  \ 一个或多个实体（entity）：实体是数据的对象。\n\n![bl.eps](img/bl_fmt.jpeg) 每个实体中的一个或多个属性（attribute）：属性是一个键/值对。键是名称字符串，值是一组标准支持类型中的一种：各种长度的整数、小数、浮点数、双精度浮点数、字符串、布尔值等。\n\
  \n![bl.eps](img/bl_fmt.jpeg) 可选，实体可以拥有关系（relationship）：关系引用另一个实体中的另一个实体。引用可以是双向的。它们可以是一对一（直接链接实体），也可以是一对多（具有多个交叉链接）。Core\
  \ Data 对一对多关系的支持是有限的。\n\n![bl.eps](img/bl_fmt.jpeg) 可选，实体可以包含一个或多个预定义的抓取请求（fetch\
  \ request）：抓取请求是一个返回对象或可选对象属性的操作，例如最高值或最低值。\n\n![bl.eps](img/bl_fmt.jpeg) 可选，每个抓取请求可以包含一个或多个谓词（predicate）：这些是特定的搜索过滤器。\n\
  \n尽管 Core Data 不是完整的关系型数据库，但它通常被用于通用数据管理。典型应用程序包括媒体收藏和联系人数据库。例如，为了管理一个库，你可能会创建一个\
  \ `Book` 实体并添加属性来存储标题、出版年份、作者等。然后，你可以调用标准的 Core Data 代码为库中的每本书添加一个 `Book` 实体的实例，调用其他代码列出所有特定作者的书，依此类推。\n\
  \n实体、属性、关系和其他细节定义在带有 `.xcadatamodel` 扩展的数据模型文件中。\n\n当你创建一个新项目时，可以通过勾选 `Use Core\
  \ Data` 选项包含 Core Data，如图 B.8 所示。该选项生成一个空白的数据模型文件，你可以用自己的实体设计对其扩展。\n\n数据模型仅带有支持代码即可变为“活跃”。Core\
  \ Data 模板包含了最小的设置和销毁代码，但必须添加更多代码来访问和修改数据。\n\n![mac_note.eps](img/mac_note_fmt.jpeg)\
  \ 笔记\n\n本节是对 Core Data 模型编辑器的简要实践介绍，但不是 Core Data 开发的完整指南。有关实用 Core Data 编程的介绍和更多信息，请参见\
  \ Core Data 参考。\n\n图 B.8\n\n为 OS X 创建 Core Data 项目\n\n![mac_note.eps](img/mac_note_fmt.jpeg)\
  \ 笔记\n\n![9781118007594-fgb208.tif](img/9781118007594-fgb208_fmt.jpeg)\n\n## 介绍数据模型\n\
  \n文件选择有些反直觉。当你选择一个数据模型文件时，会出现数据模型编辑器，如图 B.9 所示。默认是空的。\n\n![mac_caution.eps](img/mac_caution_fmt.jpeg)\
  \ 注意\n\n编辑器的一个关键功能是右下角的 `Editor Style` 选项。可以使用此功能在表格视图和图形视图之间切换。当文件为空时，图形视图显示一个带有网格背景的空白区域。\n\
  \n表格视图用于快速概述文件中的实体。图形视图显示实体和关系。当数据模型非常复杂时，表格视图更容易操作。图形视图更适合实体较少的简单模型，并为实体关系提供了更直观的视觉引导。\n\
  \n图 B.9\n\n空模型的表格初视图\n\n![9781118007594-fgb209.tif](img/9781118007594-fgb209_fmt.jpeg)\n\
  \n图 B.10\n\n图形编辑器初视图\n\n![9781118007594-fgb210.tif](img/9781118007594-fgb210_fmt.jpeg)\n\
  \n### 创建简单的数据模型\n\n作为一个非常简单的数据示例，你将添加几个实体以及若干属性，并在它们之间创建关系。\n\n要创建实体，请遵循以下步骤：\n\n\
  1. 在表格编辑器中，点击窗口左下角的 `Add Entity` 按钮，如图 B.11 所示。\n\n左上角的实体列表中会出现一个新实体。\n\n2. 给实体命名，例如\
  \ `Entity1`。\n\n![mac_note.eps](img/mac_note_fmt.jpeg) 笔记\n\n一旦你创建一个实体，Configurations\
