  \ 交叉引用\n\n有关编辑的更多信息，请参见第 4 章。有关 UI 设计的介绍，请参阅第 7 章。\n\n## 深入了解应用程序\n\n大多数应用程序都是使用\
  \ `Cocoa` 构建的。你可以从窗口应用程序开始，也可以选择包含一个或多个支持视图的复杂模板。Cocoa 和 Touch 模板始终包含：\n\n![bl.eps](img/bl_fmt.jpeg)\
  \ 定义应用程序基本元素的类实现文件：对于应用程序，元素始终包含一个接收操作系统消息的应用程序代理——例如，在应用程序加载完成时发送一个，在准备退出时发送另一个，依此类推。根据模板，默认类可能还包含一个接收用户操作的\
  \ UI 控制器。\n\n![bl.eps](img/bl_fmt.jpeg) 支持实现文件的类头文件包含了每个平台的关键框架。对于具有多个类的模板，头文件会被正确导入。\n\
  \n![bl.eps](img/bl_fmt.jpeg) 一个或多个扩展为 .xib 的 nib 文件：nib 文件是 OS X 和 iOS 的资源文件，定义了窗口的基本属性，可选的\
  \ UI 视图。这些文件具有双重目的。它们定义了应用程序的外观。你可以编辑它们来添加图像、按钮、滑块和其他控件。OS X 应用程序在其 nib 文件中包含菜单树。在内部，nib\
  \ 文件被视为程序运行时要加载和初始化的对象的通用清单。这是 Cocoa 开发的秘密之一，你可以在 nib 文件中添加任何对象或类。\n\n![mac_crossref.eps](img/mac_crossref_fmt.jpeg)\
  \ 交叉引用\n\n有关创建、编辑和使用 nib 文件的更多信息，请参阅第 7 和 8 章。\n\n![bl.eps](img/bl_fmt.jpeg) nib\
  \ 文件与类文件之间的链接：在 Apple 开发中，只有在定义了链接后，代码才能控制和响应 UI 对象。它们出现在两个地方：nib 文件中，以及类头文件和实现代码中的特殊指令。\n\
  \n![bl.eps](img/bl_fmt.jpeg) 带有关键应用程序框架 #import 指令的前缀头：构建应用程序时，添加到此文件中的头只会预编译一次。\n\
  \n![bl.eps](img/bl_fmt.jpeg) 包含应用程序设置字典的 plist（属性列表）文件：你可以编辑此字典以实现应用程序的标准用户偏好。详细信息请参见附录\
  \ B。\n\n\n\n\n\n![bl.eps](img/bl_fmt.jpeg) 一个英文本地化文件夹。它包含一个用于本地化应用程序的 strings 文件，使其在支持英语之外还支持其他语言：strings\
  \ 文件包含字符串对。其中一个字符串被用作应用程序中的键（key），另一个字符串定义了在该键被使用时显示的文本。你支持的每种语言都有自己的 strings 文件，每个键对应有不同的输出字符串。模板中仅包含英文本地化。\n\
  \n![bl.eps](img/bl_fmt.jpeg) 一个 `main.m` 文件：这是一段简短的样板启动代码，用于加载应用程序并为其创建一个内存池。你通常可以忽略这个文件。\n\
  \n![mac_note.eps](img/mac_note_fmt.jpeg) 注意\n\nOS X 项目还可以通过绑定（bindings）将代码链接到 UI\
  \ 上——即属性与 UI 元素之间的间接链接。标准的 OS X 模板不包含任何绑定；如果你想使用它们，必须自己添加。iOS 中不提供绑定功能。\n\n### 使用\
  \ OS X 模板\n\n尽管只有三个 OS X 模板，但所有模板都包含了额外的选项。\n\n### 使用 Cocoa 模板\n\nCocoa 模板包含了前面列出的要素。两个选项如图\
  \ 3.9 所示。\n\n你可以创建一个基于文档的应用程序（Document-Based Application），它是为多文档应用程序设计的。每个文档都会加载并创建同一个\
  \ nib 文件的实例。该模板使用 Cocoa 的 `NSDocument` 类来实现文档功能。它包含了额外的设置和销毁功能，这些功能在单窗口应用程序中是需要的，但它并不是一个完整的基于文档的应用程序的完全实现。你需要添加文件保存/加载功能、最近文件支持以及撤销（undo）代码。\n\
  \n使用 Core Data 选项会创建一个支持 Core Data 存储的应用程序。代码实现了数据的自动归档和加载，但没有实现特定的编辑功能。它也没有定义数据模型。有关\
  \ Core Data 的简单介绍，请参见附录 B。\n\n图 3.9\n\n选择一个 Cocoa 模板，并设置这两个选项。灰色的 Spotlight Importer\
  \ 选项不可用，你可以忽略它。\n\n![9781118007594-fg0309.eps](img/9781118007594-fg0309_fmt.jpeg)\n\
  \n![mac_note.eps](img/mac_note_fmt.jpeg) 注意\n\nCore Data 不是完全的关系型数据库。它的功能更为有限，但它仍然是管理包含多个属性对象的有用方法。\n\
  \n#### 使用 Cocoa-AppleScript 模板\n\n图 3.10 所示的 Cocoa-AppleScript 模板创建一个极简的 AppleScript\
  \ 应用程序。它实际上是标准 Cocoa 模板的极大精简版本，用 AppleScript 而非 Objective-C 重编写的。这里只出现了两个方法：`applicationWillFinishLaunching`\
  \ 和 `applicationShouldTerminate`。真实的应用程序可能需要更多的设置，因此此模板是替换为你自己设计的更高级模板的理想候选者。\n\n\
  ### 理解 Apple 开发中的视图（Views）\n\n“视图（view）”一词在 Apple 开发中有多种含义。它可以指一个完整的 UI 设计，定义了 UI\
  \ 中的所有元素：按钮、图像和其他特性。但它也可以指该配置中的单个 UI 元素。例如，一个按钮可能包含一个定义文本的文本视图（text view）。标签（label）可以被称为标签视图（label\
  \ view）。以此此类推。这似乎并不一致，但通常情况下如果一个对象在屏幕上可见，它就可以被称为视图。单个 UI 项目也可以被称为控件（controls）。\n\
  \n毫无疑问，术语可以更简单更清晰，特别是对于初学者来说。当你观察 Cocoa 和 Cocoa Touch 中使用的类时，理解起来会变得更容易。`UIView`\
  \ 和 `NSView` 是屏幕内容的通用容器。控件通常是这些顶层元素的子类。从代码层面理解类关系比从顶层设计层面理解要容易得多。\n\nApple 对一种被称为模型-视图-控制器（MVC）的设计模式带有某种传教士色彩。这旨在将屏幕内容与底层数据模型分离，通过控制器对象来桥接两者，控制器可以将底层数据从\
  \ UI 中抽象出来。如果做得当，MVC 可以创建高效且易于维护的应用程序，因为 UI 只需要加载和显示底层数据的一个小子集，而无需创建单独的工作副本。\n\n\
  但可能会产生困惑，因为某些作为控制器的类也实现了完整的视图。例如，iOS 有一个名为 `UIImagePickerController` 的类，它不仅访问 iPhone\
  \ 的照片库并控制相机，还为这两者显示了自己的完整 UI。从技术上讲，这仍然符合模式——控制器抽象数据并管理 UI——但它模糊了开发者对控制器类可能功能的预期。\n\
  \n最好不要纠结于这些显而易见的不一致性。MVC 是一种影响，而非宗教，只要你理解如何使用这些类以及视图的大致含义，你就拥有了成功处理视图所需的所有信息。\n\n\
  在 iOS 中，导航通过视图切换来管理。通常，一个顶层窗口对象与导航控制器或视图控制器关联。当用户请求新页面时，控制器加载下一个视图并显示它。通常，它会在视图不再可见后删除之前的视图以节省内存——这个过程被称为懒加载（lazy\
  \ loading）。\n\n实用的 UI 设计是对象和控件布局以及视图切换代码的结合。通常，你会创建视图和视图控制器的子类来运行你自己的 UI 特定代码，并在\
  \ Interface Builder (IB) 中设计视图布局。但你也可以在代码中添加和删除对象，某些开发者完全不使用 IB。\n\nOS X 设计更为简单，因为视图是静态的。它们会随用户操作而改变，但视图切换是一个可选的改进，而非核心功能。\n\
  \n![mac_tip.eps](img/mac_tip_fmt.jpeg) 提示\n\n有关开发 AppleScript 的指南，请参见 Wiley 系列。\n\
  \n图 3.10\n\nCocoa-AppleScript 模板创建一个简单的 AppleScript 应用程序，它会启动但无所作为。\n\n![9781118007594-fg0310.eps](img/9781118007594-fg0310.jpeg)\n\
  \n## 使用命令行模板\n\n在 Cocoa 应用程序中，`main.c` 加载并运行应用程序，你可以忽略它。在命令行应用程序中，`main.c` 就是应用程序。正如预期的那样，命令行模板创建一个从命令行运行的\
  \ C 或 C++ 文件。参数通过通常的方式传递给 `argc` 和 `argv[]`。构建后，工具会在 Console 窗口中运行，该将在第 4 章介绍。你也可以从\
  \ Terminal 运行该工具。\n\n如图 3.11 所示，你可以为工具选择六种模板。这听起来并不灵活。不同变链接到命名的 OS X 库。实际上，它们的区别在于文件顶部的\
  \ `#include` 指令。例如，如果你选择了 Core Foundation 选项，模板代码如下：\n\n```cpp\n#include <CoreFoundation/CoreFoundation.h>\n\
  \nint main (int argc, const char * argv[]) {\n  // 在此处插入代码...\n  CFShow(CFSTR(\"\
  Hello, World!\\n\"));\n  return 0;\n}\n```\n\n图 3.11\n\n创建一个命令行工具，一种不使用 GUI（图形用户界面）的文本应用程序。菜单只是预选了\
  \ `#include` 指令中不同的头文件。\n\n![9781118007594-fg0311.eps](img/9781118007594-fg0311_fmt.jpeg)\n\
  \n\n\n\n\n默认的 iOS 模板包含了各种可能的 iOS UI 配置的简单示例。请理解，这些大纲只是一个起点，而不是 UI 设计的权威指南。真实的 iOS\
  \ 应用与这些模板很少有共同之处。随着你经验的增加，模板的局限性会变得越来越明显且限制性更大，你几乎会想要修改它们或创建你自己的新模板。\n\n![mac_tip.eps](img/mac_tip_fmt.jpeg)\
  \ 提示\n\n你会发现依次构建并运行每个模板是非常有用的。务必将每个模板的版本保存到特殊的模板文件夹中，这样你以后就可以再次探索每个模板，而无需重新创建它们。\n\
  \n## 使用基于导航的模板 (Navigation-based template)\n\n图 3.12 所示的基于导航的模板包含一个显示 `UITableView`\
  \ 类单个实例的窗口。iOS 不支持下拉菜单。相反，你通过将一个导航控制器对象与一个或多个此类表格视图结合，构建类似菜单的导航树。选择单元格（表格中的一个项目）类似于选择菜单项目。你的代码可以通过显示树中的下一个表格来做出响应，也可以执行某些其他操作。\n\
  \n图 3.12\n\n运行基于导航的模板。导航控制器在 UI 顶部创建灰色条条，表格视图在其下方生成表格单元格。你需要添加代码来设置标题、填充单元格内容，并在用户点击单元格时做出响应。\n\
  \n![9781118007594-fg0312.eps](img/9781118007594-fg0312_fmt.jpeg)\n\n导航由 `UINavigationController`\
  \ 实例管理，它处理在树中的移动并显示标题以及后退/前进按钮。作为顶层项目，导航控制器包含在主窗口 nib 中。虽然从代码并不完全明显，但你通常会修改此模板中的代码，以便在用户点击单元格时加载另一个表格视图。\n\
  \n基于导航的模板仅适用于 iPhone。对于 iPad 项目，请使用基于分屏视图（SplitView-based）的模板——它具有相似的功能，但支持 iPad\
  \ 更复杂的导航选项。\n\n## 使用 OpenGL ES 模板\n\n图 3.13 所示的 OpenGL ES 模板包含了使用 OpenGL ES 图形子系统的应用程序的初始化和销毁。OpenGL\
  \ ES 用于游戏和复杂的自定义 UI。它是一个专门的高性能图形环境，除非你需要创建复杂的 3D 或 2D 动画，否则可以忽略它。\n\n图形被封装在一个名为\
  \ `EAGLView` 的类中，它选择并运行两个渲染类之一——`ESRenderer1` 和 `ESRenderer2`，它们分别支持 OpenGL ES 1.5\
  \ 和 OpenGL ES 2.2 代码。\n\n图 3.13\n\nOpenGL ES 模板的代码演示了一个移动的阴影正方形。实现此动画需要大量的初始化和销毁代码。\n\
  \n![9781118007594-fg0313.eps](img/9781118007594-fg0313_fmt.jpeg)\n\n旧款 iPhone 型——2.x、3G\
  \ 和 iPod Touch 第二代仅支持 OpenGL ES 1.5 代码。在实践中，你将后兼容代码添加到 `ESRenderer1.m`，将当前代码添加到\
  \ `ESRenderer2.m`。或者，你可以注释掉渲染器选择并强制你的项目运行旧代码，该旧代码在所有硬件上都支持，但缺乏 OpenGL ES 2.2 规范中的一些强大功能。\n\
  \n两个渲染器文件中的默认代码绘制了一个彩色正方形，并维护了一个动画计数器。包装视图包含一个动画计时器，反复调用每个渲染器。你的渲染代码负责在每个动画帧计算更新后的视图。\n\
  \n## 使用基于分屏视图的模板 (SplitView-based template)\n\n图 3.14 所示的基于分屏视图的模板是基于导航模板的 iPad\
  \ 对应。iPad 更大的屏幕使得在分屏视图查看菜单项目列表成为可能，分屏视图旁边是一个详情视图，可以显示每个项目或整个应用程序的相关信息。导航代码与基于导航模板中使用的类似。当\
  \ iPad 处于垂直方向或竖屏模式时，当用户点击左角的导航按钮时，分屏视图会浮在详情视图上方，并在用户点击其外部时消失。当 iPad 处于水平景观模式时，分屏视图始终显示在左侧。\n\
  \n![mac_tip.eps](img/mac_tip_fmt.jpeg) 提示\n\n你可以通过选择硬件（Hardware）⇒向右旋转（Rotate Right）或向左旋转（Rotate\
  \ Left）在模拟器中旋转。你也可以通过选择窗口（Window）⇒缩放 50% 或 100% 来缩放 iPad 模拟器。100% 的视图需要宽度或高度至少 1200\
  \ 像素的显示器。\n\n## 使用标签栏应用程序模板 (Tab Bar Application template)\n\n图 3.15 所示的标签栏应用程序模板可以创建\
  \ iPhone 或 iPad 应用。你可以使用模板描述上方选项栏中的菜单选择硬件目标。用户点击标签栏上的按钮来选择不同的视图。\n\n图 3.14\n\n此插图展示了使用基于分屏视图模板在竖屏模式下缩放\
  \ 50% 的 iPad 模拟器窗口。\n\n![9781118007594-fg0314.eps](img/9781118007594-fg0314_fmt.jpeg)\n\
  \n图 3.15\n\n标签栏应用程序模板显示并切换视图，使用 `UITabBarController` 类管理，使用 `UITabBar` 类显示按钮。\n\n\
  ![9781118007594-fg0315.eps](img/9781118007594-fg0315_fmt.jpeg)\n\n这是最令人困惑的模板之一，因为代码似乎没有做任何事情。事实上，标签栏会自动管理视图。模板包含了两个控制器及其关联的\
  \ nib 文件。你可以使用 Interface Builder 通过向 `MainWindow.xib` 中的标签栏添加控制器来添加更多视图——页面。本章没有空间包含此过程的完整步骤指南，但一旦你在接下来的章节中探索了\
  \ IB，你就可以返回此模板，并在 `MainWindow.xib` 中复制控制器、创建新的控制器类并将其分配给这些视图。\n\n## 使用工具应用程序模板 (Utility\
  \ Application template)\n\n图 3.16 所示的工具应用程序模板创建一个在右下角有一个按钮的 iPhone 应用程序。点击按钮会显示一个带有导航栏和完成（Done）按钮的翻转视图。视图具有独立的控制器。翻转视图通常用于设置和其他不需要永久可见的应用程序功能。此模板没有\
  \ iPad 选项。\n\n图 3.16\n\n将工具应用程序模板视为一个设计示例，而非实际的应用程序起点。许多应用使用主视图/翻转视图的设计范式，但通常以更简单、灵活的方式实现。\n\
  \n![9781118007594-fg0316.eps](img/9781118007594-fg0316_fmt.jpeg)\n\n虽然你可以原样使用此模板，但它包含一些非必要的功能。翻转侧的导航栏浪费了空间。注意它仅仅是一个导航栏——按钮的容器，而不是导航控制器。通常，你会用屏幕底部的单一返回按钮替换栏和该按钮，可能带有自定义图形。\n\
  \n提示\n\n对于 Cocoa 专家来说，由完成按钮触发的翻转代码使用了对父视图的协议方法调用。在翻转视图中使用简单的 `dismissModalView:animated:`\
  \ 调用来替换它同样有效。你可以使用 `self` 作为模式视图参数。该调用会自动找到父视图，因此你不需要指定它。\n\n\n\n\n\n你可以使用此模板创建一个基于视图的\
  \ iPad 或 iPhone 应用程序，如图 3.17 所示。大多数大多数使用的标准原生模板。它包含一个窗口（window）、一个视图控制器（view controller）和一个视图（view）。视图控制器已经经过了子类化，因此你可以立即向其添加代码。视图没有子类化，因此你无法向其添加代码。但通常，只有当你计划为动画或特殊图形添加自定义绘制代码时才需要对其进行子类化。否则，请使用视图控制器管理用户交互并控制更新。向视图控制器的\
  \ nib 中添加项以布局你的界面。\n\n注意，此模板生成的是 iPad 或 iPhone 应用程序。如果你想创建一个通用的 iPhone 和 iPad 应用程序，请使用\
  \ `Window-based template`（基于窗口的模板）。\n\n作为一个简单的快捷方法，所有 iPhone 应用程序都可以使用内置的仿真模式在 iPad\
  \ 上自动运行，该模式会在半大小子窗口中显示它们。子窗口可以放大以填充屏幕，但这并没有增加分辨率——它只是让 iPhone 应用看起来很大，但很模糊。\n\n\
  iPhone 没有 iPad 模拟器；iPad 应用程序完全不会在 iPhone 上运行。\n\n### 使用基于窗口的应用程序模板\n\n基于窗口的应用程序模板是一个极简模板，只包含一个带有单个标签（label）的窗口，如图\
  \ 3.18 所示。这是唯一包含完整通用选项的 iOS 模板，可以创建一个同时在 iPhone 和 iPad 上运行的单一应用。\n\n图 3.17\n\n`View-Based\
  \ Application template`（基于视图的应用程序模板）是应用设计最有用的起点。\n\n![9781118007594-fg0317.eps](img/9781118007594-fg0317_fmt.jpeg)\n\
  \n事实上，此模板创建了两个独立的应用、两个独立的 nib 和两个 app delegate。iOS 应用程序加载器会在运行时自动为每个平台选择合适的 nib。\n\
  \n模板没有创建任何视图控制器。因此，要创建一个真正的通用应用，你通常需要添加两个独立的视图控制器，每个控制器都有一个定义独特 UI 的 nib，可能还有一些共享的数据类。你必须在\
  \ IB 中在每个视图控制器及其窗口之间建立连接。\n\n### 引入框架和库模板\n\niOS 仅支持静态库。你不能在 iOS 项目中创建或添加框架（framework）。如图\
  \ 3.19 所示，OS X 的限制较少。你可以创建一个 Cocoa 框架、一个 Cocoa 库、一个 BSD C 库或一个标准模板库 (STL) C++ 项目插件。`Bundle`\
  \ 选项将一组 Objective-C 文件组合成一种格式，该格式可用于创建 Ruby 等语言的扩展。它可以引用 Cocoa 或 Core Foundation\
  \ (Carbon) 框架。\n\n图 3.18\n\n尽管基于窗口的模板包含了通用选项，但在实践中，它简单地创建了两个带有支持代码类的类的独立 nib。平台之间存在某些重叠，但从此模板创建双平台应用需要大量的时间、思考和精力。\n\
  \n![9781118007594-fg0318.eps](img/9781118007594-fg0318_fmt.jpeg)\n\n图 3.19\n\n你可以使用\
  \ OS X 模板中的 `Framework & Library` 选项为你的项目创建一系列支持框架和库——并可能为其他开发者的项目创建。\n\n![9781118007594-fg0319.eps](img/9781118007594-fg0319_fmt.jpeg)\n\
  \n![mac_note.eps](img/mac_note_fmt.jpeg) 注意\n\n库通常只是带有源文件的代码集合。框架通常构建单个二进制文件，并为\
  \ `#import` 指令提供头文件列表。框架可以包含媒体内容、属性列表和其他信息，以及代码。框架的文件夹结构是固定的。理论上，框架包含了完整的类体系，带有隐含的用法模式和关系，而库更有可能包含孤立的离散组件。在实践中，这种区别有时并不那么明确。\n\
  \n### 引入插件（Plug-in）模板\n\n插件模板是专门的，插件设计的细节超出了本书的范围。\n\n概要而言，`Application Plug-in\
  \ templates`（应用程序插件模板）旨在为现有的 Apple 应用程序添加自定义功能，例如通讯录、Automator 等。这些应用程序按照标准接口设计，插件模板生成与其特定需求匹配的代码和资源文件。经验丰富的开发者可以使用它们为这些应用程序添加新功能。例如，你可以使用\
  \ Interface Builder 插件来定义你自己的 UI 对象集合，并将其添加到 IB 已经内置的标准列表中。\n\n`System plug-ins`（系统插件）更低级，可以与多个应用程序协作。例如，`Quick\
  \ Look Plug-in`（快速查看插件）可以实现你应用程序中使用的自定义数据类型的预览。某些插件模板的复杂度较低。`IOKit driver plug-in`（IOKit\
  \ 驱动插件）创建一个完整的空白 C++ 文件并将其与 `Kernel` 框架链接。如果你是 Apple 开发的新手，可以忽略这些高级的选项。\n\n![mac_note.eps](img/mac_note_fmt.jpeg)\
  \ 注意\n\n插件模板仅支持 Apple 标准 API。如果你想为其他应用程序开发插件，例如 Adobe Photoshop 8BX 插件或 VST（虚拟工作室技术）音乐合成器或声音处理器，你通常需要下载合适的\
  \ SDK 或框架并手动将其添加到 Xcode。\n\n## 修改标准模板\n\n重要的一点是，没有任何模板是完美的。模板包含了最少的功能，旨在消除重复的设置工作。它们不是教程，也绝对不是最佳实践的示例。\n\
  \n这些类中的许多实用方法在模板中是缺失的，你应该审阅第 6 章描述的类文档以了解更多关于它们的信息。通常，你的应用程序依赖于标准模板中没有出现的方法。最高效的模板可能是你自己创建的那些。自定义模板创建是一个高级主题，将在第\
  \ 12 章中介绍。但编辑现有模板相对容易，并且可以为你节省时间。\n\n查找模板文件\n\n目前，你可以在 `/Library/Xcode/Templates`\
  \ 找到 iOS 模板文件。\n\nOS X 模板位于 `/Library/Xcode/Templates`。\n\n对于两个平台，应用程序模板都在 `/Application`\
  \ 中，其他的在同名的文件夹中。\n\n![mac_caution.eps](img/mac_caution_fmt.jpeg) 注意\n\n如果你正在使用多个版本的\
  \ Xcode 进行开发，默认情况下它们从这些目录加载模板——通常如此。这些位置在未来的 Xcode 版本中可能会在不通知的情况下更改。\n\n图 3.20 显示了模板文件结构以及文件列表。每个模板的内容都是标准的\
  \ Xcode 项目。你可以双击 `.xcodeproj` 文件在 Xcode 中打开项目。\n\n图 3.20\n\n定位 iOS 模板文件\n\n![9781118007594-fg0320.eps](img/9781118007594-fg0320_fmt.jpeg)\n\
  \n注意，某些模板有多个版本；例如，Cocoa Application 模板实际上是一组带有可选 Core Data、Document 和 Spotlight\
  \ 功能的六个不同模板。你可以忽略从未使用的模板。但要理解，如果你更改了一个模板，其他模板不会自动更新。要创建一个完整的修改后模板集，你必须对计划使用的每个模板添加更改。\n\
  \n\n\n\n\n# 自定义模板文件\n\n当 Xcode 使用这些文件来构建模板时，带有下划线的文件名会被解释为宏，并替换为你所选择的“另存为”名称。但如果你直接打开项目（如图\
  \ 3.21 所示），你可以像编辑标准项目一样编辑这些文件。你也可以编译并运行它们。这意味着你可以像对待标准项目一样修改任何模板，并以通常的方式保存它。下次你再次使用该模板时，它将加载你所有的更改。\n\
  \n### 图 3.21\n修改 OS X 模板。这个微小的更改增加了一个注释，但你可以完全自由地更改模板中的每个文件以满足你的需求。\n\n![9781118007594-fg0321.eps](img/9781118007594-fg0321_fmt.jpeg)\n\
  \n由于模板具有局限性，因此强烈建议进行自定义定制。在完成前几个项目后，你可以检查代码，查看哪些功能被经常复用，并将它们添加到相应的模板中。\n\n![mac_caution.eps](img/mac_caution_fmt.jpeg)\
  \ 注意\n\n每当你更新 Xcode 时，标准模板目录都会被覆盖。无论你使用的是编辑过的模板还是一组自定义模板，都必须在 `/Developer` 目录之外的文件夹中保留副本，并在每次更新后手动将它们拷贝回去。如果不这样做，你的编辑将会丢失。（在理论上，你应该能够将自定义模板保留在\
  \ `~/Library/Application Support/Developer/Shared/Xcode/Project Templates` 中，但此功能在\
  \ Xcode 4 的第一个版本中并没有生效。）\n\n## 总结\n本章查看了 Xcode 模板，并引入了基于模板的简单构建序列。它研究了不同类型模板的功能，并详细探讨了适用于\
  \ iOS 和 OS X 的应用模板。它还解释了如何通过修改模板来改进它们，并为进一步开发创建有用且功能全的起点。\n\n# 第 4 章：导航 Xcode 界面\n\
  \n## 本章内容\n- 使用导航区域\n- 使用工具区域\n- 在编辑器区域进行工作\n- 开始代码编辑\n- 介绍构建设置\n\n早早版本的 Xcode 大量使用了浮动窗口。Xcode\
  \ 4 将所有功能整合到一个单一窗口中，该窗口被划分为多个工作区域。你可以根据工作需要选择隐藏或显示不同的功能。了解哪些功能可用是最大化生产力的关键之一。\n\n\
  ## 理解新界面\n图 4.1 显示了新界面的一种视图。从左到右，UI 被分为导航、编辑器和工具区域。这反映了 Apple 的官方 UI 指南；所有 Apple\
  \ 应用都遵循类似的布局。然而，不要太字面地理解区域名称是种好主意。\n\n例如，导航区域包含了与代码导航关系非常的调试功能。对左侧区域更准确的描述可能是“查找与构建”。它不仅列出了文件和对象，还报告构建问题、支持搜索，并简化了错误检查和调试。\n\
  \n![mac_note.eps](img/mac_note_fmt.jpeg) 注意\n\nXcode 包含独立的控制台和调试器，将在第 15 章中详细描述。\n\
  \n右侧区域通常用作代码和对象库，但它包含了额外的功能，可以显示有关所选项目的关键信息，例如文件路径和其他杂设置。该区域还包含内置的帮助功能。\n\n编辑器区域更加聚焦，几乎专门用于编辑。但你也可以用它来定义关键的项目全局构建设置并向项目添加框架。例如，在\
  \ iPhone 开发期间，你可以使用该区域为应用选择应用图标和启动图像。\n\n编辑器区域始终可见，但你可以隐藏和显示导航区域和工具区域。点击 Xcode 4\
  \ 窗口右上角的按钮，如图 4.2 所示。每个按钮在你点击时时都会切换状态，隐藏或显示其对应的区域。\n\n### 图 4.1\n再次查看 Xcode 界面及其三分式拆分。\n\
  \n![9781118007594-fg0401.tif](img/9781118007594-fg0401_fmt.jpeg)\n\n### 图 4.2\n\
  导航器和工具区域的显示/隐藏按钮\n\n![9781118007594-fg0402.tif](img/9781118007594-fg0402_fmt.jpeg)\n\
  \n## 使用导航区域\n导航区域的左上方有一个包含七个图标的工具栏，如图 4.3 所示。选择图标会更改工具栏下方面板中出现的内容。\n\n### 图 4.3\n\
  导航区域的选择图标\n\n![9781118007594-fg0403.tif](img/9781118007594-fg0403_fmt.jpeg)\n\n\
  从左到右，这些图标选择以下工具栏：\n1. 项目导航器 (Project Navigator)\n2. 符号导航器 (Symbol Navigator)\n3.\
  \ 搜索导航器 (Search Navigator)\n4. 问题导航器 (Issue Navigator)\n5. 调试导航器 (Debug Navigator)\n\
  6. 断点导航器 (Breakpoint Navigator)\n7. 日志导航器 (Log Navigator)\n\n![mac_caution.eps](img/mac_caution_fmt.jpeg)\
  \ 注意\n\n除极少数例外，这些图标上的图像可能最好被描述为“抽象的”；它们并不是其所选功能的良好指南。学习它们作用的最佳方法是对它们进行实验。\n\n###\
  \ 项目导航器\n如果你有 Xcode 的经验，你会认出这是旧的 Groups & Files 面板。它列出了项目使用的文件和资源。当你选择一个可以编辑的文件时，它的内容会自动加载到编辑器区域。\n\
  \n文件列表看起来像 Finder 目录，但这是误导。这里显示的“文件夹”是组（groups），它们在磁盘上并不存在。如果 Xcode 无法编辑它（例如它是图像或字体），编辑器区域将显示预览。\n\
  \n项目的默认组包括类 (Class)、其他源 (Other Sources)、资源 (Resources) 和框架 (Frameworks)，但你可以创建自己的组并使用任何你系统来组织文件。\n\
  \n要添加组，在导航区域点击右键，从出现的菜单中选择 `New Group`，如图 4.4 所示。你还可以通过拖动到不同位置来重新排列组和文件的顺序。\n\n\
  ### 图 4.4\n当你创建一个组时，它总是添加到组树的最高层。\n\n![9781118007594-fg0404.tif](img/9781118007594-fg0404_fmt.jpeg)\n\
  \n早期版本的 Xcode 在 Groups & Files 显示的文件名与磁盘上的文件之间保持着远程联系。文件名类似于书签、别名或符号链接。在 Groups\
  \ & Files 面板中重命名文件不会修改磁盘上文件的名称。当你从项目中删除一个文件时，它仍然留在磁盘上。新手通常认为这很困惑。\n\n在 Xcode 的后期版本以及\
  \ Xcode 4 中，文件和链接之间的联系更强、更直观。当你在此导航器中重命名文件时，磁盘上的名称会为你更新。但至关重要的是理解，这里显示的文件名仍然是真实文件的符号链接。导航器显示项目的文件。它并不显示项目目录中的文件和文件夹。如果你用\
  \ Finder 打开项目目录，你会看到不同的文件结构。这使得导航器能够显示磁盘上任何位置的项目文件。要删除文件，你可以使用图 4.4 所示的右键菜单、`Backspace`\
  \ 键或 `Delete` 键。删除文件会显示图 4.5 所示的对话框。\n\n### 图 4.5\n在删除文件时，你可以将其留在磁盘上或将其移到回收篓。将文件留在磁盘上对于你想要保留旧版本或将其移动到另一个项目可能很有用。\n\
  \n\n\n\n\n![9781118007594-fg0405.tif](img/9781118007594-fg0405_fmt.jpeg)\n\n![mac_tip.eps](img/mac_tip_fmt.jpeg)\
  \ 提示\n\n当在选择文件时“实用工具”区域可见，你可以查看文件的磁盘路径。真实项目可能会从许多不同的目录收集文件，因此这是一个非常有用的记忆辅助工具。你也可以可以使用此功能查找框架头文件。\n\
  \n# 符号导航器 (The Symbol Navigator)\n\n图 4.6 左侧显示的符号导航器执行两项任务。你可以使用它来浏览项目中的符号——类、方法和其他代码特征。从此导航器中出现的列表中选择符号，可以定位并将相应的代码加载到编辑器中。你还可以用它来列出并访问\
  \ OS X 的内部功能，并查看相关的头文件。\n\n图 4.6\n\n在符号导航器中选择符号将在编辑器窗口中显示它并将其高亮。\n\n![9781118007594-fg0406.tif](img/9781118007594-fg0406_fmt.jpeg)\n\
  \n## 选择符号视图 (Selecting symbol views)\n\n此导航器顶部的工具栏是理解并有效使用它的关键。它有四个按钮：All（全部）、System（系统）、Members（成员）和\
  \ Flat（扁）。你可以使用这些按钮过滤符号列表，只显示你代码中的符号。你也可以选择查看项目包含的每个框架中的所有符号。以下是这些按钮的功能：\n\n![bl.eps](img/bl_fmt.jpeg)\
  \ All 在两种视图之间切换。当取消选中 All 时，只列出类。当选中时，会显示所有其他实体：类、协议、函数、结构体、联合体、枚举、类型和全局变量。显示会显示项目（工作区）中的项目以及关联链接框架中的项目的备用计数。\n\
  \n![bl.eps](img/bl_fmt.jpeg) System 隐藏和显示系统符号。取消选中时，只列出项目中的符号。当选中时，将显示所有链接框架中的完整符号。这可能是一个非常长的列表。\n\
  \n![bl.eps](img/bl_fmt.jpeg) Members 隐藏和显示内部符号。取消选中时，只列出类。当选中时，可以通过展开三角形打开类以显示方法、函数和其他所有代码特征。\n\
  \n![bl.eps](img/bl_fmt.jpeg) Flat 控制符号是否组织成层级结构。当选中时，符号按字母顺序列出。取消选中时，会显示类关系。例如，当选中\
  \ Flat 时，`NSObject` 按照严格的字母顺序出现在类列表中间附近。当取消选中 Flat，`NSObject` 出现在列表顶部，因为它是一个根 Cocoa\
  \ 类，并包含整个子类层次结构。\n\n## 使用符号视图 (Using the symbol views)\n\n你可以以各种方式使用符号列表。以下是三条建议，但也存在其他应用：\n\
  \n![bl.eps](img/bl_fmt.jpeg) 要在自己的代码中查找特定方法或代码特征，请选择 All 和 Members 并取消选中 System\
  \ 和 Flat。你会看到代码中类的列表。点击每个类旁边的展开三角形将显示该类的方法和其他特征列表。\n\n![bl.eps](img/bl_fmt.jpeg)\
  \ 若要记住 Cocoa 类的方法列表，请选择所有四个按钮并向下滚动列表以找到该类。选择它以查看其接口中的方法和其他特征列表。这直观地向你展示了 Cocoa 源代码中的原始头文件，如图\
  \ 4.7 所示。从头文件中拷贝方法签名到你的代码中，或回顾方法列表以提醒自己该类支持的功能。\n\n图 4.7\n\n使用 Cocoa 头文件来提醒类特征并检查或复制方法签名。它也是探索“我从未见过那个类；它是做什么的？”的很有用起点。\n\
  \n![9781118007594-fg0407.tif](img/9781118007594-fg0407_fmt.jpeg)\n\n![bl.eps](img/bl_fmt.jpeg)\
  \ 要从按字母排序的列表中选择类进行编辑，请取消选中所有按钮。可选使用 Flat 显示并展开层级结构。你会看到项目类的列表，而没有项目导航器中出现的任何组或任何支持文件。\n\
  \n![mac_caution.eps](img/mac_caution_fmt.jpeg) 注意\n\n对于简单的项目，使用第 1 章中引入的导航栏导航到特定的类和方法通常更简单更快速。当类列表非常长且你的显示器足够显示完整列表而无需滚动时，符号导航可能会更快。\n\
  \n## 搜索导航器 (The Search Navigator)\n\n搜索导航器是一个简单的字符串搜索工具。要使用它，在搜索字段中输入完整或部分的搜索字符串，如图\
  \ 4.8 所示。你可以仅搜索项目文件，或者搜索链接框架头文件的完整列表。你还可以选择匹配符号名称开头或符号名称内部任何位置的字符串匹配。\n\n图 4.8\n\
  \n准备在项目中搜索匹配字符串\n\n![9781118007594-fg0408.tif](img/9781118007594-fg0408_fmt.jpeg)\n\
  \n如图 4.9 所示，搜索缺乏上下文。它只是扫描注释、头文件和实现文件。如果你不仔细指定搜索字符串，结果可能会按文件错乱。\n\n```\n#import\n\
  ```\n\n图 4.9\n\n因为搜索缺乏感知。\n\n![9781118007594-fg0409.tif](img/9781118007594-fg0409_fmt.jpeg)\n\
  \n搜索区域左侧是 Find/Replace（查找/替换）切换。当你想要在文中替换目标字符串时选择 Replace。Replace All 按钮很危险。但 Preview\
  \ 选项可以显示类似于图 4.10 中的列表。列表中间的区域显示启用或禁用命中的开关。\n\n![mac_tip.eps](img/mac_tip_fmt.jpeg)\
  \ 提示\n\n如果你点击放大镜图标，可以看到控制大小写匹配并可以使用正则表达式的进一步搜索选项。\n\n图 4.10\n\n使用选择性替换，你可以切换每个开关以启用或禁用命中。\n\
  \n![9781118007594-fg0410.tif](img/9781118007594-fg0410_fmt.jpeg)\n\n# 问题导航器和日志导航器\
  \ (The Issue Navigator and the Log Navigator)\n\n图 4.11 显示的问题导航器列出了致命错误和警告消息。选择问题将在编辑器窗口中显示它，并带有相邻的高亮。图标也会出现在代码编辑器左侧的行边中。构建后，你可以使用此导航器直接跳转到问题代码；如果有问题，即使导航器面板关闭，此导航器也会出现。（这并不是总是想要的行为，但目前没有办法禁用它。）尽管这似乎是一个简单的功能，但存在隐藏的复杂性。首先，gcc\
  \ 和 llvm 编译器产生不同的错误消息。如果你用过之前的 Xcode 版本，习惯了 gcc 的特性和局限。llvm 编译器对错误报告采用了不同的方法，你会看到陌生的错误消息，有时位于不的位置。\n\
  \n图 4.11\n\n点击列表中的任何警告或错误将在编辑器中显示相关代码。\n\n![9781118007594-fg0411.tif](img/9781118007594-fg0411_fmt.jpeg)\n\
  \n![mac_crossref.eps](img/mac_crossref_fmt.jpeg) 交叉引用\n\n有关选择和使用不同编译器的更多信息，请参见附录\
  \ C 以及第 12 章和第 13 章。\n\n\n\n\n其次，如果你是开发新新手，理解这一点非常重要：错误并不总是出现在代码的正确行。例如，如果你删除了或注释掉了方法定义中的右合大括号\
  \ `}`，你会在文件的其余部分产生级联错误，但缺失的括号并不会被正确标记。某些错误需要经验和猜测。代码中的问题往往会在同一位置产生多个错误。\n\n最后，有许多不同的可能的警告消息，你可以选择想要查看的内容。在项目导航器（Project\
  \ Navigator）中，选择该项目，然后选择构建设置（Build Settings）。在其下方选择“全选”（Select All），并向下滚动显示警告（Warnings）面板，如图\
  \ 4.12 所示。这些选项中的许多都假设你具有中级或专家级经验，除非你了解它们的用途，否则最好保持原样。随着经验的增加，你可以开始使用此功能来选择你想查看的警告。\n\
  \n**图 4.12**\n\n你可以启用或禁用编译器生成的每个警告消息。你也可以禁用所有警告，但这通常不是一个好的做法。\n\n![9781118007594-fg0412.tif](img/9781118007594-fg0412_fmt.jpeg)\n\
  \n图 4.13 所示的日志导航器（Log Navigator）是显示构建问题的另一种方式。它类似于 Xcode 3 中的构建结果窗口，不同之处是它可以显示项目的构建结果列表。你可以参考之前的构建来比较错误。双击编辑器窗口中的问题将带你跳转到导致该问题的代码。\n\
  \n**图 4.13**\n\n问题导航器（Issues Navigator）显示当前构建的问题，而日志导航器也会显示之前构建的问题。\n\n![9781118007594-fg0413.tif](img/9781118007594-fg0413_fmt.jpeg)\n\
  \n这里的问题列表可以为你提供比问题导航器中更多的信息。要查看每个消息的完整未截断的视图，请点击每个消息字符串右侧的 `more` 链接。你也可以选择消息/错误计数旁出现的图标来查看原始编译器输出，如图\
  \ 4.14 所示。这通常不是必要的，但在检查磁盘上的文件路径和库位置时可能会很有帮助。\n\n**图 4.14**\n\n查看原始编译器输出\n\n![9781118007594-fg0414.tif](img/9781118007594-fg0414_fmt.jpeg)\n\
  \n## 断点导航器和调试导航器\n\n你可以在主代码编辑器中添加调试断点——这是一种功能可以在特定代码行处停止代码执行，以便进行测试和审查。断点保留在代码中，但只有在启用断点模式时才会激活。点击任何代码行左侧的断点行槽（gutter）。当断点激活状态时，会出现一个蓝色箭头。要禁用断点，再次点击该箭头。\n\
  \n图 4.15 所示的断点导航器列出了项目中的所有断点。你可以通过点击左侧的列表跳转到任何断点。你还可以设置条件断点，它们只会在重复特定次数后被触发。断点是强大的调试辅助工具，具有许多功能和选项。详情，请参阅第\
  \ 15 章。\n\n![mac_note.eps](img/mac_note_fmt.jpeg) 注意\n\n当你添加断点时，Xcode 会自动切换到断点模式。你可以通过选择活动方案选择器右侧的箭头图标手动切换断点模式。\n\
  \n**图 4.15**\n\n设置和列出断点\n\n![9781118007594-fg0415.tif](img/9781118007594-fg0415_fmt.jpeg)\n\
  \n图 4.16 所示的调试导航器在断点触发后列出活动线程。屏幕底部会自动出现一个独立的调试区域，并显示相关的值和对象。有关使用断点进行调试的详细示例，请参阅第\
  \ 15 章。\n\n## 从菜单和快捷键加载导航器\n\n你可以通过 Xcode 的菜单树或快捷键访问所有导航器。导航器列在 `View⇒Navigators`（视图⇒导航器）下。使用键盘选择它们，使用\
  \ `⌘+1-7`。`⌘+0` 显示/隐藏导航器区域。\n\n**图 4.16**\n\n在调试模式下使用调试导航器查看断点和线程信息\n\n![9781118007594-fg0416.tif](img/9781118007594-fg0416_fmt.jpeg)\n\
  \n## 使用工具区域\n\nUI 右侧的工具区域有两个子面板。顶部子面板显示文件信息和快速帮助。底部子面板是代码和对象库。你可以通过向下拖动分割线来隐藏底部子面板，直到其顶部工具栏上的四个图标可见。\n\
  \n### 显示文件信息\n\n当查看代码文件时，顶部子面板显示两个图标。左侧的图标显示文件信息，如图 4.17 所示。要重命名文件，请在文件名（File Name）文本字段中输入新名称。要更改文件类型，请从文件类型（File\
  \ Type）菜单中选择新类型。\n\n![mac_note.eps](img/mac_note_fmt.jpeg) 注意\n\nNib 文件被视为特殊情况。当泛选择一个\
  \ nib 时，顶部面板会显示支持非英语语言的更多集合。详情，请参阅第 7 和第 8 章。\n\n**图 4.17**\n\n此选项显示文件路径\n\n![9781118007594-fg017.tif](img/9781118007594-fg017_fmt.jpeg)\n\
  \nLocation 菜单设置文件路径。相对于组（Relative to Group）选项非常有用。它创建一个相对于项目的路径。如果你不小心使用绝对路径移动文件，Xcode\
  \ 将无法再次找到它。点击该区域右侧的小文件夹图标来选择目录。\n\n![mac_tip.eps](img/mac_tip_fmt.jpeg) 提示\n\n你可以使用完整路径（Full\
  \ Path）旁边的箭头在 Finder 中显示文件。\n\n这里的列表可以为你提供比问题导航器中更多的信息：\n\n![bl.eps](img/bl_fmt.jpeg)\
  \ 本地化（Localization）显示语言支持。某些文件可以本地化，或以不同的语言版本创建。详情，请参阅第 8 章。\n\n![bl.eps](img/bl_fmt.jpeg)\
  \ 目标成员（Target Membership）设置文件的构建目标。简单项目有一个构建目标，你可以忽略此选项。对于更复杂的项目，请参阅第 12 章。\n\n\
  ![bl.eps](img/bl_fmt.jpeg) 文字设置（Text Settings）定义文件的文本编码。默认是 UTF-8（Unicode 格式 - 8\
  \ 位），它支持非英语字符。默认情况下，Xcode 使用空格缩进。如果你需要制表符缩进，请通过缩进方式（Indent Using）选择该选项。你还可以设置每次缩进的空格数。\n\
