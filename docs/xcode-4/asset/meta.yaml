- - '#'
  - 第 11 章：全面详细地介绍了 Xcode 配置过程，这对于 iOS 和 OS X 项目的设备测试、Beta 分发以及 App Store 分发都是必要的。它将带你逐步完成配置过程，并解释配置的原理，以便你理解证书（certificates）、身份（identities）和配置文件的作用以及它们为什么是必须的。
- - '#'
  - 第 12 章：介绍了 Xcode 构建系统。它介绍了项目和目标构建设置，并解释了它们之间的关系。它还详细查看了构建设置管理，解释了你如何使用构建配置（build
    configurations）和新的方案（schemes）功能为更复杂的项目创建灵活的多多目标构建。
- - '#'
  - 第 13 章：深入研究构建系统。它介绍了一系列常见且实用的构建自定义功能，带你逐步完成 iOS App Store、iOS Ad Hoc 和 OS X App
    Store 构建所需的不同构建过程。它还解释了如何使用 Xcode 将项目提交到 App Store。最后，它介绍了构建系统的内部原理，并解释了你如何使用构建阶段（build
    phases）和构建规则中的自定义脚本来满足几乎任何构建的构建需求。
- - '#'
  - 第 14 章：探索了新的版本控制功能。它介绍了在 Xcode 中管理项目版本的不同方式，并说明了它们的优缺点。最后以使用 Xcode 与 GitHub 协作在线代码仓库的实用示例结束，并解释了如何将
    GitHub 用于个人和小组项目。
- - '#'
  - 第 15 章：介绍了 Xcode 调试器。它探索了查看和使用控制台的不同方法，并演示了如何添加、删除和管理断点；查看变量并在它们变化时监控它们。它还引入了用于低级控制的命令行调试。
- - '#'
  - 第 16 章：探索了 Instruments 并演示了你如何使用它们对代码的任何方面进行分析，包括内存使用、性能以及对周围系统的影响。它包含一个分析示例，演示了如何使用
    Instruments 检查内存泄漏。
- - '#'
  - 第 17 章：介绍了单元测试（Unit Test）功能，并解释了如何使用它们在代码中创建和检查自动化测试用例，帮助你确保在修改现有代码时，它仍能按预期运行。
