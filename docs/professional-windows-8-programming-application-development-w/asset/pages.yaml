  md: 'This allows Windows Store apps running on a tablet to inform the user about
    what kinds of permissions the app need to run. If you''ve used any Android or
    iOS-based device, now you''ve seen the permission request screen pop up before
    an application performs an action. Most App Stores also list the required permissions
    and capabilities on the application download page so that users can make an informed
    decision as to whether they purchase or download the app. Windows 8 is no different
    in that and your app needs to follow the same rules. Although a "Hello Windows"
    app realistically doesn''t need many device features, pretend it needs at least
