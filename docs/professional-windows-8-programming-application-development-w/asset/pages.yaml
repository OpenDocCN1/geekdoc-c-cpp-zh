  md: '# 1


    # A Glimpse into the Future


    WHAT''S IN THIS CHAPTER?


    +   - Understanding the Windows 8 difference

    - Navigating in Windows 8

    - How to develop a Windows Store App

    - Building a Hello Windows App

    - What type of Windows Store App is best for you?


    WROX.COM CODE DOWNLOADS FOR THIS CHAPTER


    You can find the wrox.com code downloads for this chapter in code file 205709
    C01.zip at http://www.wrox.com/remitle.cgi?isbn=1118205707 on the Download tab.


    # THE GAME CHANGER


    In a developer''s life, you have a handful of moments in which a new "game-changing"
    technology actually lives up to the hype. This could be new hardware or software,
    but it is especially game-changing when it''s for new operating systems. A new
    OS is just a more reliable working version of the one that came before with several
    new visual upgrades. It is rare that an OS release changes the game so much that
    developers must reboot their knowledge and think about apps in a "different" way.
    This happened with the original release of Windows, which MS developed a graphical
    user interface with a windowed environment. It happened again with Windows 95
    with the introduction of the 32-bit operating system and with Internet Explorer
    that hosted new computing features, including better support for window gaming
    through DirectX and more memory, larger hard drives, and more powerful programs
    overall.'
  merge: -1
  pgno: 34
- img_proc: true
  md: '# CHAPTER 1 A GLIMPSE INTO THE FUTURE


    With the pending release of Windows 8, developers are on the forefront of yet
    another major evolution in programming and user interface design. Instead of creating
    applications that appear only to a PC, you now have the option to create apps
    that run on a myriad of devices, including PCs, cell phones, TVs, and Windows
    8 and WinRT help you get there in ways that were previously impossible. The new
    convergence of devices and programming support from Microsoft for Windows 8 provides
    opportunities for developers to create innovative solutions, which includes new,
    improved user interfaces that target multiple devices while using similar or,
    in many cases, the same underlying code base.


    # WHAT MAKES WINDOWS 8 DIFFERENT?


    Although Windows 8 concepts are now rapidly applied throughout the Microsoft ecosystem,
    they''ve actually been around for some time. More than likely, if you were a first-generation
    Zone software owner, you noticed how drastically the user interface was for both
    the Zone hardware and the software. In Figure 1-1 you can quickly see the difference
    between a standard Windows application and the Zone software that first to start
    the Windows 8 design principles are now showcased in Windows Phone and ultimately
    across the entire Windows product line with the release of Windows 8.


    ![](img/2cea804c0281668ba7d119c3e0ce780e_35_0.png)


    FIGURE 1-1'
  merge: -1
