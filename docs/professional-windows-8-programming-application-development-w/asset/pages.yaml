  md: '# CHAPTER 2 WHAT IS XAML?


    If you build and run the application, you should see that the correct scrollbars
    appear. Mouse wheel support is working again allowing you to easily scroll to
    see the Button controls.


    In addition, the ScrollViewer has features that enable you to handle pan and zoom
    effects that give you more options for displaying content to the user. The pan
    and zoom effects of the Scrollviewer are covered in the next chapter when you
    learn more about semantic zoom and how it is useful to support it for content
    in Windows Store applications.


    # Action Controls


    After you master how to incorporate the various layouts in XAML, you should move
    to some of the controls that your users can interact with, such as the Button,
    TextBox, TextBoxBox, and Because Windows Store applications should have a consistent
    user experience, all the controls you need are available in WinRT. If you come
    from a WinForms or an ASP.NET background, you are already familiar with the concept
    of a code page. The code behind page is where you put event handlers for the interactive
    controls and put the logic required to manage those controls.


    In XAML you have the same concept of a code behind file to place your control
    event handling code. In Chapter 8, "Geolocation," you can see new way to handle
    control events that was made possible with Silverlight development and has become
    an integral part of coming Windows Store apps as well called Model-View-View-Model
    (MVVM). This program is only available to use interface languages that support
    the concept of Data Binding, which you can see in the next chapter. MVVM development
    has become popular because it separates your interface from actual business logic
    even provides you with a way to automatically update and refresh the user interface
    without writing traditional handlers. For now, we''ll look at the default behavior
    of interacting with XAML controls using the code behind page and see what types
    of interactive controls are available from WinRT.


    # TextBox


    The TextBox is the most basic control available in XAML. It has one purpose, which
    is to display text on the screen. It is the XAML equivalent of a plain <div> tag
    or Label in ASP.NET. Although most XAML controls use the Content property to determine
    what appears, the TextBox uses a Text property instead because the only output
    for control is text. Here is the XAML code for declaring a basic TextBox:


    ```

    <TextBox Text="This is some text" />

    ```


    # TextBox


    The TextBox is a data input control that enables you to capture input from the
    user. Like the TextBox this control uses the Text property of the Content property
    to display the entered text. The Text property is read/write, but you often capture
    input in this control and use it elsewhere. Here is the XAML code to create a
    basic TextBox control:


    ```

    <TextBox Text="" />

    ```


    www.it-ebooks.info'
