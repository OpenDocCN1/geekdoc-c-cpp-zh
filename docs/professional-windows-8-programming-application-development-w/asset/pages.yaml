    # Getting Ready for MVVM


    Before modifying any of the user interface XAML, you must first make a decision
    about how you architect your app. One method used throughout most of the book
    is to add XAML controls and corresponding event handlers in the code-behind files
    — perhaps segregating required business logic into a separate class. For the most
    part, this results in manipulation of controls and calls into the business logic
    layer directly from the code behind. Although there is nothing fundamentally wrong
    with this approach, in this chapter, you should go the MVVM route that you saw
    in Chapter 10, "Windows Store Architecture."


    MVVM provides a great separation of concerns and ensures that business logic stays
    out of your user interface. It also relies on data binding to update the user
    interface in real time without needing any complex code in the code behind. What
    is great about this approach is that the states of various controls are tied via
    data binding in the ViewModel instead of needing to write a ton of boilerplate
    control management over code-behind files. For example, rather than trying to
    ensure several controls are visible or hidden based on business logic and hoping
    you remember them all, binding the Visibility property to a ViewModel means that
    the controls take care of that decision.


    Chapter 10 shows that most of what you need to implement in MVVM already exists
    in WinRT. All Button controls support commanding, so you can easily bind commands
    to properties in the ViewModel. You can also use Data templates, you can easily
    create a reusable template for the GridView and ListView that display images and
    properties from the ViewModel as required. The WindowsStore app should use MVVM
    as the design pattern for the application business logic rather than strictly
    the code behind. however, that because you use MVVM does not mean you cannot use
    any code behind. Actually, code behind isn''t necessarily a bad thing if you use
    it to manipulate in the user interface that you simply can''t accomplish with
    strict data binding.


    Although a deal of MVVM functionality is built into WinRT, some-to-nice features
    of MVVM are still missing. Chapter 10 introduces you to the free NuGet package
    MVVLight. This package includes several libraries that assist you with MVVM development
    from commanding to messaging, both of which you can easily use in this demo app.


    Because you use MVVM for this app, you obviously need a ViewModel for binding.
    If you install the NuGet package for Visual Studio, you can see that new files
    have been added to the project in a new ViewModel folder in Solution Explorer.
    You should see MainViewModel and ViewLocator. When you use MVVM, it is entirely
    legal to create a global instance of your MainViewModel class and start binding
    to it. However, that does not provide a friendly way to access the view from multiple
    XAML files. The ViewLocator takes care of this problem by providing a static global
    instance of a locator class whose sole responsibility is returning the currently
    active view instance. Listing 12-1 shows that the only logic here is to return
    a single instance of the MainViewModel class or instantiate one if it does not
    already exist.'
