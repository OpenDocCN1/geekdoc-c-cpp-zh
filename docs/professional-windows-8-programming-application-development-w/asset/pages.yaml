  md: "# Creating Sample Data\n\nYou have all the required XAML pages created, and\
    \ you also have a view model ready to store application logic and properties.\
    \ Now you need to start creating the actual user interface. When users fire up\
    \ the WbookStore app, the first thing they want to see is a grouped list of books.\
    \ In a real-world, you would most likely connect to an external data store through\
    \ a web service and download the required data. In this sample app, you create\
    \ a local data set of several books and categories. For the home page, you show\
    \ books from the following categories: Most Recently Added, C#, ASP.NET, and SQL\
    \ Server.\n\n# Adding a Corresponding Class\n\nEach displayed book needs a corresponding\
    \ class, so add that first:\n\n+   1. Right-click the project node.\n2. Add a\
    \ new folder called Data.\n3. Add a new class to this folder called WroxBook.\n\
    4. Update the WbookStore.cs file to look like Listing 12-3.\n\nLISTING 12-3: WroxBook.cs\n\
    \n```\nusing System;\nusing Windows.UI.Xaml.Media;\n\nnamespace WbookStore.Data\n\
    {\n    public class WroxBook\n    {\n        public string Title { get; set; }\n\
    \        public string Author { get; set; }\n        public string Subject { get;\
    \ set; }\n        public string Type { get; set; }\n        public string Overview\
    \ { get; set; }\n\n        public ImageSource Thumbnail { get; set; }\n      \
    \  public Uri PurchaseLink { get; set; }\n    }\n}\n```\n\nLooking at the code\
    \ you can see that each book is represented by several properties. The Title/Author/Subject\
    \ properties are straightforward. The rest of the properties need a little explanation:\
    \ \n\n+   * Type: Determines what group the book belongs to.\n* Overview: Displays\
    \ additional information about the book — perhaps a table of contents or even\
    \ an excerpt. For this sample app, all the books simply use basic lorem ipsum\
    \ text as filler."
