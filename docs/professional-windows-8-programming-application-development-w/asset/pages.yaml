  md: "# Related Wrox Books\n\nProfessional C# 2012 and .NET 4.5\nISBN: 978-1-118-31442-5\n\
    After a quick refresher on C# the author dream team moves to provide you with\
    \ ndetails of language and framework features including LINQ, LINQ to SQL, LINQ\
    \ to XML,\nWCF, WPF, Workflow, and Generics. Coverage also spans ASP.NET programming\
    \ with C#,\nworking in Visual Studio 2012 with C#, and more.\n\n![](img/2cea804c0281668ba7d119c3e0ce780e_507_0.png)\n\
    \nBeginning Microsoft Visual C# Programming 2012\nISBN: 978-1-118-31441-8\nUsing\
    \ this book, you will first cover the fundamentals as variables, flow control,\n\
    and object-oriented programming and gradually build your skills for web and Windows\n\
    programming, Windows forms, and data access. Step-by-step directions walk you\
    \ through\nprojects and invite you to \"Try it Out,\" at every stage. By the end,\
    \ you'll be able to write\n programming code following the steps you've learned\
    \ in this thorough, practical\nbook. If you've always wanted to master Visual\
    \ C# programming, this book is the perfect\neone-stop resource.\n\n![](img/2cea804c0281668ba7d119c3e0ce780e_507_1.png)\n\
    \nIvor Horton's Beginning Visual C++ 2012\nISBN: 978-1-118-36808-4\nOffering a\
    \ comprehensive introduction to both the standard C++ language and to Visual\n\
    C++, Ivor Horton offers step-by-step programming exercises, examples, and solutions\
    \ to\nguide novice programmers through the ins and outs of C++ development.\n\n\
    ![](img/2cea804c0281668ba7d119c3e0ce780e_507_2.png)\n\nProfessional Visual Studio\
    \ 2012\nISBN: 978-1-118-33770-7\nThis book is what you need to get up and running\
