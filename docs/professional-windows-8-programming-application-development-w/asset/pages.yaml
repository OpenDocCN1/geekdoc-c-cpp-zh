    \ }\n    }\n}\n```\n\n# USING MVVM FRAMEWORKS\n\nSeveral frameworks provide implementations\
    \ of the MVVM design pattern with varying degrees of scope. One of the smaller,\
    \ yet powerful frameworks is MVVM Light. You can add it to a project using NuGet\
    \ in Visual Studio, as shown in Figure 10-1.\n\n# Understanding MVVM Light\n\n\
    MVVM Light has been around for a while and is fully supported in Windows 8. It\
    \ provides several common MVVM foundational classes such as:\n\n+   - ViewBase:\
    \ A solid base class for implementing ViewModels.\n\n+   - RelayCommand: This\
    \ is a simple implementation of ICommand and can optionally include a typed parameter."
