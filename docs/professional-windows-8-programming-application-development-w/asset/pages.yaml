  md: '# Testing with Windows App Certification Kit


    Before submitting your app to the store, you should test it with the Windows App
    Certification Kit. The tool automatically tests your app and detects problems
    before the app is submitted to the store.


    Windows App Certification Kit tests your app thoroughly, by actually launching,
    measuring the responsiveness, and testing for crashes and hangs. It also tests
    for compliance of the app manifest, security, APIs, performance, configuration,
    and meta-data compliance, and other parameters. The kit contains dozens of tests.
    Most of the conditions evaluate to Pass or Fail, but they may also include warnings.
    Figure 11-11 shows the Windows App Certification kit selection


    This may save you a lot of time and detect common problems and issues. Your app
    will be validated and tested in the store as well. It is recommended to use Windows
    App Certification Kit for pre-store testing to identify and fix problems before
    submitting to the store.


    ![](img/2cea804c0281668ba7d119c3e0ce780e_414_0.png)


    At the end of the test, Windows App Certification Kit generates an HTML and XML
    report. Windows App Certification Kit may be launched from an elevated command
    prompt as follows:


    ```

    PS > appcert.exe test -apptype windowstoreapp -packagefilename [package full name]
    -reportoutputpath [report file name]

    ```


    # Understanding Windows Store Certification Requirements


    To certification, your app must pass automated tests and content compliance. You
    can test for automated compliance with the Windows App Certification Kit. Content
    compliance takes longer than the automated testing phase because it actually requires
    an engineer to look at your app. Microsoft wants good quality apps for the customers
    of the Windows Store.


    I recommend using Windows App Certification Kit before every application deployment,
    and reviewing the most current requirements page available on the Microsoft site.
    Windows Store apps are available to millions and potentially billions of users,
    and therefore you must comply with the certification requirements and policies
    for the store apps.'
