  md: "# Temporary Application Data\n\nYou use temporary application data to store\
    \ files that may be deleted when they are not in use. Windows automatically deletes\
    \ temporary files, by considering disk space and other factors. You access temporary\
    \ data through the ApplicationData.TemporaryFolder or by using the ms-appdata://temp/\
    \ protocol. For example, in JavaScript you can access temporary data as follows:\n\
    \n```\n<img src=\"ms-appdata://temp/image.png\" alt=\"\" />\n```\n\nFrom code,\
    \ you can access the TemporaryFolder and work with the temporary files just like\
    \ other\n\n```\nvar TemporaryFolder = ApplicationData.Current.TemporaryFolder;\n\
