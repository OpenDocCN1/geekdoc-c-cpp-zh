  md: '# Using MVVM Frameworks


    +   - SimpleIoC: An easy-to-use IoC container.


    +   - MessageBase: Use this to send loosely coupled messages with optional content.
    You can use subclasses, such as NotificationMessage, DialogMessage, and PropertyChangedMessage,
    for common behaviors.


    ![](img/2cea804c0281668ba7d119c3e0ce780e_366_0.png)


    Because MVVM Light has an implementation of ViewModelBase, you can remove the
    one in your project, and the ViewModel classes in the project will need using
    a statement with the GalaSoft.MVVMLight namespace. In addition, you can make the
    MarkFavorite property in GroupedItemsViewModel use MVVM Light''s RelayCommand,
    rather than the ICommand interface. The class implements Command and calls the
    Action (or Action<T>) if a command parameter is passed in its constructor when
    the Execute method is invoked on the interface. Optionally, a Func<T, bool> can
    be passed to the constructor as is called when CanExecute is invoked on the interface.
    This results in the creation of fewer classes and makes the implementation to
    the class side more readable. An example of this is in Listing 18.


