  md: 'Note that the assumption from the previous section is that you didn''t include
    any ads in your app. You also didn''t have any in-app purchases in your first
    version. In terms of the Windows Store, you could have either a free app or a
    paid app (potentially with a trial offer).


    # TABLE 11-4: Sample App Price Sensitivity with No Ads


    | APP PRICE | DOWNLOADS |

    |--- | --- |

    | $999.99 | 0 |

    | $499.00 | 0 |

    | $199.00 | 0 |

    | $19.00 | 0 |

    | $7.99 | 1 |

    | $4.99 | 10 |

    | $1.99 | 100 |

    | $1.49 | 1,000 |

    | 0 | 10,000 |


    > NOTE This is some sample data; it does not represent the actual pricing of any
    app in the store but is given to illustrate how pricing affects the number of
    downloads.


    What you did is estimating elasticity of demand (E.d), or how responsive the number
    of downloads demanded is to changes in price. For the following equation, Q is
    the number of downloads, and P is the price:


    $E_d = \frac{\Delta Q}{\Delta P}$


    In economics, the results received in the example are called elastic demand: that,
    as the price of the app grows, demand in the Color shopping goes to zero quickly,
    with the best results anywhere in the range between $0 and $4.99 — the sweet spot
    for your app''s price.


    # Ad-Supported App Revenue


    In a second version of this example, you might decide to include Microsoft AdControl
    from the Advertising SDK to take advantage of two observations from the first
    version: you had a large number of downloads in the free tier of this app, and
    you want to make some money from your free version. Table 11-5 shows how revenue
    and downloads increase as your app price decreases.'
