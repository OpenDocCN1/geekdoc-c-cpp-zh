    \ to your developer account, and open the Packaging step in your application submission\
    \ process. Simply drag your package on the dialog to begin the upload. Your package\
    \ will be uploaded and analyzed by the Windows Store.\n\n# Submitting the App\
    \ for Certification\n\nFinally, you need to submit your app to begin the certification\
    \ process in the Windows Store dashboard, by clicking Submit button in Windows\
    \ Store. This is the final step that completes your application submission. Now\
    \ it's time to stretch and relax!\n\nWindows Store takes your app through a number\
    \ of internal tests: security, technical compliance, content compliance, signing\
    \ and release. Each of these steps is important to ensure your app is delivered\
    \ to the users, that the app does not contain security violations or glaring technical\
    \ problems, and is compliant with Windows Store content policy.\n\nYour app will\
    \ either pass or fail certification. If it passes, congratulations! Your users\
    \ will be able to see your app in all its glory. Otherwise, you can check the\
    \ reported issue, fix it and submit it again.\n\n# Packaging Apps Using a Command\
    \ Line\n\nMost developers use Visual Studio to package apps. In some scenarios,\
    \ scripting or automation, you may need scripting tools and a command prompt.\
    \ You can use Packager, CertMgr, and SignTool for scripted and automated tasks,\
    \ and automate your packaging with PowerShell scripts. The following shows the\
    \ command line scripting tools available to you for deployment and packaging:\n\
    \n+   App package (MakeApp.exe): This creates packages and extracts files from\
    \ an app to disk:\n\n```\nMakeApp pack /d input_dir /p filepath.app\n```\n\n+\
    \   CertMgr: This is a certificate, certificate trust lists, and certificate revocation\
    \ list management tool:\n\n```\nCertMgr [-add|-del][-put] [Options] -s [-r RegistryLocation\
    \ ] SourceName -s [-r RegistryLocation ] [DestinationName]\n```"
