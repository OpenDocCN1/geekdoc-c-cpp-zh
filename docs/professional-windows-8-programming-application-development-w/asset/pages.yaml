    # WORKING WITH THE APP BAR


    In traditional windows applications, the best way to present menu options for
    your users was to make a use of a standard control. For more than 20 years, users
    have become accustomed to a File/Edit/and menu at the top of the screen, giving
    them there to perform actions in an application. In Windows 8, however, that has
    changed. Because the primary goal of a Windows Store Application is to reduce
    application components and focus more on the actual content of the application,
    you must think differently when creating menu options for your users. Instead
    of building a menu with hundreds of different options (many of which won''t ever
    get used) you can focus on what operations are essential for your app.


    You should think about what kind of actions users want to perform with the data
    or that presented to them. Because Windows 8 discourages the use of a full-blown
    menu, you still need some way to give users the option to take action with the
    data or content. The answer is the Application Bar. If you have navigated around
    the new Start in Windows 8, you''ve already seen the Application Bar in action.
    Anytime you right-click or swipe from the bottom of a tablet, you are presented
    with the Application Bar and a nearly ordered set of the most important actions
    you can take with the data or content of the app. For example, when the default
    Weather app presents you with a way to set your location for weather updates,
    as shown in Figure 4-1. As you can see, the App Bar appears at the top and bottom
    of the screen for this application.


    ![](img/2cea804c0281668ba7d119c3e0ce780e_155_0.png)


    FIGURE 4-1


    In Windows Store Apps the rule of thumb is to make use of the top Application
    Bar for navigation styles, such as switching to between different areas of the
    app. You can reserve the bottom bar for command type actions that create, edit,
    sort, filter or refresh the current view of the data or'
