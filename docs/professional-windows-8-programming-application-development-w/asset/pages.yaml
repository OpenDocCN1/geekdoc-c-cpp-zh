    listing. You''ll also see how to perform advanced packaging tasks, using the command
    line to package your apps. For the line of business (LOB) and enterprise apps,
    you''ll learn how to use the tools provided to package and deploy your apps in
    the enterprise.


    You will learn to test your app for before deployment using Windows Apps Certification
    Kit.


    When Visual Studio 2012 creates your project for the first time, it generates
    a manifest file Package.appxmanifest and adds it to your project. You will need
    to update this manifest file, making sure that'
