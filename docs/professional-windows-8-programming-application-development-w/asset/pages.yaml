  md: "```\n<GridView x:Name=\"MainGridView\" HorizontalAlignment=\"Left\" Margin=\"\
    45,70,0,0\"\nGrid.Row=\"1\" VerticalAlignment=\"Top\"\nMinWidth=\"200\"\nMinHeight=\"\
    200\"\nItemTemplate={StaticResource BookTemplate} ItemsPanel={StaticResource GridViewItemsPanel}\n\
    BorderBrush=\"White\" BorderThickness=\"2\"\nScrollViewer.VerticalScrollBarVisibility=\"\
    Auto\"\nScrollViewer.HorizontalScrollBarVisibility=\"Auto\" SelectionMode=\"Single\"\
    \nWidth=\"800\"\nSelectionChanged=\"MainGridView_SelectionChanged\" />\n```\n\n\
    Again, use an ItemTemplate so that Wx object presents the thumbnail, title, and\
    \ author information. In addition to the ItemTemplate, the ItemsPanel property\
    \ is also set to a StaticResource. The ItemsPanel property enables you to override\
    \ the actual content that hosts the GridView items. In this example, you can display\
    \ the items in a table-like presentation containing no more than two rows. By\
    \ default, the GridView does not actually create a table-like presentation, but\
    \ by overriding the ItemsPanel property, you can easily get the layout you want.\
    \ In the following code, an ItemsPanelTemplate holds a WrapGrid control\n\n```\n\
    <ItemsPanelTemplate x:Key=\"GridViewItemsPanel\">\n<WrapGrid MaximumRowsColumns=\"\
    2\" />\n</ItemsPanelTemplate>\n```\n\nSimilar to a DataTemplate, the ItemsPanelTemplate\
    \ is another type of XAML template that you can use to manage the container of\
    \ any data control that displays collections of objects or content. In this case\
    \ the MaximumRowsColumns property ensures that only two book items display in\
    \ any column of the GridView. The WrapGrid works by hosting child elements in\
    \ a way that they are positioned within the edge of the parent control. If items\
    \ do not fit the available space, they are positioned to the next column or row\
    \ depending on the value you use for the MaximumRowsColumns property.\n\nThe code\
    \ for loading the GridView works just like the ListView where the ItemsSource\
    \ property is set to a collection of WxBook items such as in the following code:\n\
    \n```\nMainGridView.ItemsSource = Books;\n```\n\nAs was the case with the ListView,\
    \ the GridView control can handle either single or multiple selection. In the\
    \ SelectionChanged event this, the SelectionMode of the GridView is set to Single,\
    \ and the user interface is updated to display the selected book information.\n\
    \n```\nprivate void MainGridView_SelectionChanged(object sender,\nSelectionChangedEventArgs\
    \ e)\n{\n    SelectedItem.Text = String.Format(\"Selected Book: {0}\",\n    ((WxBook)e.AddedItems[0]).Title);\n\
    }\n```"
