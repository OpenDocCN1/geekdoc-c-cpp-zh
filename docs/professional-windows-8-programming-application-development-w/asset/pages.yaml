    # WHAT IS GEOLOCATION?


    In the last few years, some of the most popular and impactful apps on mobile platforms
    have implemented location awareness. These apps have subsequently provided their
    users with abilities to determine the exact location of the user — or more accurately
    the device — on the Earth.


    Foursquare, as an example, enables users to share their location with others via
    Facebook, Twitter, and other social networks. Using Foursquare, users can determine
    what is nearby to see or do, abilities that would not be possible without location
    awareness.


    Geolocation is the identification of the real-world geographic location of an
    object. Although it is often considered merely the positioning of an object, the
    greater emphasis is on determining a meaningful location such as a street address.


    The Windows Store has numerous apps that use location awareness, and you can explore
    some of the scenarios in which developers have used geolocation by searching the
    store for geolocation using the Windows 8 search charm.'
