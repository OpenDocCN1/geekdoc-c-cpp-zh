    \ you understand all the GroupedList properties are responsible for. Note the\
    \ following about this code:\n\n+   - To see two properties called Group and Description.\
    \ The idea is that when you bind to the CollectionSource, Group property displays\
    \ the group heading that you can specify in the CollectionSource binding statement.\
    \ The Description property is used when a user drills down into a particular group\
    \ and the GroupDetailPage displays, along with the collection of WroxBook items,\
    \ when that page loads.\n\n+   - The two properties are both ObservableCollection<WroxBook>\
    \ types. The first property is the BookList. It is responsible for holding the\
    \ entire list of books that belong to the group. The FilteredBookList holds a\
    \ filtered version of the original BookList. Having these two properties alone\
    \ is binding the CollectionSource to the FilteredBookList at all times that you\
    \ can easily code to sort and filter the books in the collection without modifying\
    \ or risking the loss of the originally loaded collection of book objects for\
    \ the group. This will make more sense in a little bit when you are actually using\
    \ the CollectionSource to the ViewModel class."
