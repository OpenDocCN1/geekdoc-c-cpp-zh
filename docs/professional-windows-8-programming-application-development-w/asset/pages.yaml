  md: 'Note the use of the ObservableCollection as opposed to the generic List that
    you have been using. Unlike the List class, the ObservableCollection class implements
    the INotifyPropertyChanged interface, which has the built in capacity to inform
    the ListView when items are added or removed from the collection. By using the
    ObservableCollection here to hold the Wbook items, you can add or remove another
    book from the ListView automatically updates to reflect the changes without you
    having to write the code.


    # GridView


    Perhaps the most powerful data control in Windows 8 (and one you will use often)
    is the GridView. The GridView works similar to the ListView in that it helps you
    display a collection of content or groups depending on the configuration you use.
    The GridView is designed to make up more screen real estate. Instead of a vertical
    format, the GridView typically displays items horizontally and in groups depending
    on the configuration. Like the ListView, the GridView supports data binding and
    the use of DataTemplate definitions for each item that displays in the control.


    In its simple form, you can use a GridView control just like a ListView but with
    a horizontal display of items. In Figure 3-8 you see a GridView showing a display
    of book items but in a horizontal layout featuring two book items for each row
    in the grid.


    ![](img/2cea804c0281668ba7d119c3e0ce780e_139_0.png)


    FIGURE 3-8


    Just as with the ListView when you make a selection, you can get a check mark
    and style applied to the selected item. The XAML required for this particular
    GridView is shown in the following code and looks remarkably similar to what was
    used for the ListView.'
  merge: -1
