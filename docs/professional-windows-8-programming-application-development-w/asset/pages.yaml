  md: "# Adding Product Exppiration\n\nSome products may be a one-time purchase, for\
    \ example levels in your game or themes of your app. These are durable products,\
    \ or durables. You can design products to expire after a period of time in a model\
    \ similar to subscriptions. These consumable products may include gold or chips\
    \ for your games or an expiring subscription to access some content.\n\nThe Windows\
    \ Store enables you to decide which products you need in your app and offers choices\
    \ to support both: lifetime or durable products as well as consumable products.\
    \ The previous sections discussed in in-app purchase model for a one-time purchase.\
    \ You can also make a consumable product by simply specifying an expiration date\
    \ in the Windows Store and your proxy file for testing purposes.\n\nTo add an\
    \ expiration date to a product in your proxy file, simply add the ExpirationDate\
    \ element to the listing, so:\n\n```\n<Product productId=\"\n  <IsActive>true</IsActive>\n\
    \  <ExpirationDate>2023-01-01T00:00:00.00Z</ExpirationDate>\n</Product>\n```\n\
    \nProduct expiration adds you yet another dimension to your business model. Now\
    \ you can design apps where users can use a feature for a certain period of time\
    \ before the feature expires.\n\n# Adding Advertisements\n\nAlthough ads may require\
    \ a separate chapter to cover, they are also inseparable from monetization strategies;\
    \ for that, ads are included in the example in this section.\n\nIn your Windows\
    \ Store app, you can choose between Microsoft Advertising and third-party ads.\
    \ Microsoft Advertising SDK, which comes with Windows 8 and Windows Phone, provides\
    \ a quick way to add ads to your app. Advantages of using Microsoft ads are great\
    \ integration of the SDK with Visual Studio, but if you have an established relationship\
    \ with a third party provider, you can use it.\n\nWhile it's in trial mode, Microsoft\
    \ Ads can help you monetize your app, which helps you reach a wider audience by\
    \ enabling trials — and you still get paid for your app.\n\n# Placing Ads\n\n\
    You can place ads on the application canvas. Ads in Advertising SDK come in different\
    \ sizes, and you can choose the best size for different pages of your app: 728x90\
    \ (great for top or bottom placement), 500x130, 300x250, 292x60, 250x250 (great\
    \ for Grid control), 250x125, 160x600 (skyscraper). Bigger ads, such as 728x90,\
    \ generally attract more publishers and may have higher revenue.\n\n> WARNING\
    \ You must understand Windows Store policies for ads. For example, you cannot\
    \ place ads on tiles, notifications, or swipe-from-edge surfaces, such as Settings\
    \ or AppBar. You must have additional content besides ads, and your ads must not\
    \ execute any code."
