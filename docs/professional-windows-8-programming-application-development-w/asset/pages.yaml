  md: "# Controls for Windows 8\n\n# Layout Controls\n\nOne of the most important\
    \ concepts in user interface is layout. If you create an app using HTML or CSS,\
    \ you may start by adding <div> tags on your page and then add content to those\
    \ tags. After you set the structure of your page, you go to a CSS style file and\
    \ define attributes that better position elements on the page as well as set margins,\
    \ padding, background images, and so on. When writing a Windows Store app, you\
    \ don't have to worry about making your pages work across multiple browsers but\
    \ it can still be tricky to get things positioned correctly, even using the latest\
    \ HTML 5 techniques. In contrast, XAML provides several layout controls that make\
    \ positioning content and aligning controls a breeze. When you create a page for\
    \ your Windows Store app, XAML offers a Grid, StackPanel, and Canvas for handling\
    \ layout. Now take a look at how to use all three of them.\n\n# Grid\n\nThe Grid\
    \ control offers a flexible table-like approach to layout. A Grid control has\
    \ both a rows and columns that you can use to create all sorts of arrangements.\
    \ In the simplest form a Grid control in XAML looks like the following:\n\n```\n\
    <Grid x:Name=\"MainGrid\">\n</Grid>\n```\n\nBecause the Grid works similarly to\
    \ a table, you can add rows and columns by simply adding RowDefinition and ColumnDefinition\
    \ objects to the XAML code like the following:\n\n```\n<Grid>\n  <Grid.RowDefinitions>\n\
    \    <RowDefinition />\n    <RowDefinition />\n  </Grid.RowDefinitions>\n  <Grid.ColumnDefinitions>\n\
    \    <ColumnDefinition />\n    <ColumnDefinition />\n    <ColumnDefinition />\n\
    \    <ColumnDefinition />\n  </Grid.ColumnDefinitions>\n</Grid>\n```\n\nIn this\
    \ case a Grid with two rows and four columns is created. Notice how you can add\
    \ RowDefinition and ColumnDefinition objects to the Grid by making use of the\
    \ RowDefinitions and ColumnDefinitions collections, respectively. Also notice\
    \ that the way you access collections is actually using Grid.RowDefinitions property\
    \ an attached property, which is an important concept to understand because it's\
    \ used throughout XAML development. The way you work with a parent control, in\
    \ this case the Grid, may have a collection object defined for use. In other words\
    \ if you use this in C# code, you might see something like the following:\n\n\
    ```\nGrid.RowDefinitions = new List<RowDefinition>();\n```\n\nwww.it-ebooks.info"
  merge: -1
  pgno: 88
- img_proc: true
  md: "That is a standard way to access the property of the Grid; however, to access\
    \ that property in XAML, you need to declare it as attached so that it effectively\
    \ becomes a static property in the markup that you can instantiate and add new\
    \ objects, as the RowDefinition and ColumnDefinition. The Grid also makes use\
    \ of attached properties to allow the controls added to the Grid to determine\
    \ which row and column they should sit in. Basically, you can think of attached\
    \ properties as the parent object that you need to make available to children\
    \ for direct manipulation. For example, if you add a Button control to the Grid\
    \ and wanted it to be in the second row and second column, your XAML markup would\
    \ use the Row and Column attributes of the Grid from the Button control.\n\n```\n\
    <Grid>\n  <Grid.RowDefinitions>\n    <RowDefinition />\n    <RowDefinition />\n\
    \  </Grid.RowDefinitions>\n  <Grid.ColumnDefinitions>\n    <ColumnDefinition />\n\
    \    <ColumnDefinition />\n    <ColumnDefinition />\n  </Grid.ColumnDefinitions>\n\
    \  <Button Name=\"MainButton\" Grid.Row=\"1\" Grid.Column=\"1\" />\n</Grid>\n\
    ```\n\nEven though the Button does not actually contain a property called Row\
    \ or Column (because the Grid control marks those as attached properties), they\
    \ are made accessible to all child controls sitting in the Grid so that in this\
    \ case the Button can be placed precisely in the Grid where you want it.\n\nNow\
    \ that you can see how to add controls to the Grid as well how to add rows and\
    \ columns in the Grid, how about sizing? You need to understand the overall general\
    \ concept of sizing in XAML. Unlike traditional HTML-based pages, the Grid gives\
    \ you several options for sizing rows and columns that enable complex fluid layouts,\
    \ which in HTML/CSS would require complicated DIV tags and positioning code.\n\
    \nThe Grid control offers three ways to manage the height and width of a row and\
    \ column.\n\n+   - You can directly set the height and width using a pixel-based\
    \ format such as the following. This results in a Grid with one row 100 pixels\
    \ high, regardless of the content displayed, and a column 200 pixels wide.\n\n\
    ```\n<Grid>\n  <Grid.RowDefinitions>\n    <RowDefinition Height=\"100\" />\n \
    \ </Grid.RowDefinitions>\n  <Grid.ColumnDefinitions>\n    <ColumnDefinition Width=\"\
    200\" />\n  </Grid.ColumnDefinitions>\n</Grid>\n```"
  merge: -1
  pgno: 89
- img_proc: true
  md: "You can use the Auto sizing mode. Setting the Height or Width to Auto can give\
    \ exactly enough space to display the Grid control setting the Width and Height\
    \ internally to give exactly enough space for the content placed in it. This method\
    \ is the easiest to work with because it takes the guess out of determining the\
    \ exact pixels required to have enough room for the Grid control.\n\nThe Grid\
    \ control also provides you with the ability to use Star sizing. This sizing concept\
    \ gives the Grid the ability to create fluid layouts with. The benefit of Star\
    \ sizing is that the row and column has a value of * for its Height, or Width\
    \ uses all the remaining available space to place its content. For example, you\
    \ want a Grid with a header row that has a fixed height of 100 pixels, but then\
    \ you will all the rest of your content take up the remainder of the page. In\
    \ that case, you might end up with the following XAML:\n\n```\n<Grid>\n  <RowDefinitions>\n\
    \    <RowDefinition Height=\"100\" />\n    <RowDefinition Height=\"*\" />\n  </RowDefinitions>\n\
    </Grid>\n```\n\nThe sizing concept becomes truly powerful if you need a complex\
    \ layout. Now you want a header row, and then another that is exactly twice the\
    \ height of the first content. You would need to create the following XAML:\n\n\
    ```\n<Grid Margin=\"0\" Grid.Row=\"1\">\n  <RowDefinitions>\n    <RowDefinition\
    \ Height=\"100\" />\n    <RowDefinition Height=\"*\" />\n    <RowDefinition Height=\"\
    *\" />\n  </RowDefinitions>\n  <Rectangle Fill=\"#FF4F4F4\" Margin=\"0\" Grid.Row=\"\
    1\" Stroke=\"Black\" />\n  <Rectangle Fill=\"#FF4F4F4\" Margin=\"0\" Grid.Row=\"\
    2\" Stroke=\"Black\" />\n  <TextBlock HorizontalAlignment=\"Center\" Margin=\"\
    0\" Grid.Row=\"1\"\n    Text=\"#FF000000\" FontSize=\"20\">\n    <!-- This text\
    \ resides in a 1 sized row -->\n  </TextBlock>\n  <TextBlock HorizontalAlignment=\"\
    Center\" Margin=\"0\" Grid.Row=\"2\"\n    FontSize=\"20\">\n    <!-- This text\
    \ resides in a 2 sized row -->\n    Text=\"#FF000000\" /\n  </TextBlock>\n</Grid>\n\
    ```\n\nLooking at the XAML, you can see that the height of the Grid is twice the\
    \ size of the middle row, which makes it easy to create fluid-like Grid layouts.\
    \ You can apply the same concept to columns as well.\n\nThe Grid is likely the\
    \ most commonly used layout in your apps. The primary of Windows 8-based apps\
    \ is to get to the user; flexible Grid-based layouts are often the preferred way\
    \ to do that, so you must master some of these keys for XAML Grid controls. The\
    \ following is an example to help you get a feel for the Visual Studio 2012 designer,\
    \ how to work with the Grid, and how to place controls:\n\n+   1 Open Visual Studio\
    \ 2012 and create a new Windows Store application called Grid in C# using the\
    \ blank application template."
