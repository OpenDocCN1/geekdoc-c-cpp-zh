  md: '![](img/2cea804c0281668ba7d119c3e0ce780e_177_0.png)


    **FIGURE 4-7**


    When considering how to use the Live Tiles feature, consider what kind of information
    the user would want to see without actually entering the app. Think of a Live
    Tile as a snapshot of the application state. If you have the type of application
    that monitors something in the background, it should also update the state of
    the Tile, so the user can view new information. The default weather app installed
    with Windows 8 is a great example of this. As the weather changes the Live Tile
    for the app updates to reflect these changes, and the user can quickly see the
    current/forecasted weather on the Start Screen without entering the app.


    Implementing Live Tiles is not unlike seeming Toast notifications in the app.
    The way Live Tiles works is basically the same in that you choose from a set of
    available tile templates and then send customized XML data to the WinRT object
    responsible for updating your applications.


    # # Available Live Templates


    As you can imagine, many different templates are available to you. Some are text-based,
    and others include the ability to add images. One important thing to remember,
    is that no matter what you choose, your tile customization starts with a background
    image and color, both of which you choose using the project properties in Visual
    Studio. The templates simply provide a layer of images and text that overlay the
    background image of your tile when necessary, and it is important to spend some
    time designing the background of the static display for your tile.


    Again Microsoft provides plenty of guidance around this topic. To get the most-to-date
    information about what templates and styles are available for your Live Tiles,
    visit:

    `http://msdn.microsoft.com/en-us/library/windows/apps/hh761491.aspx.`'
  merge: -1
  pgno: 177
- img_proc: true
  md: 'The following sections present all available Tile templates with sample XML
    (from the time of writing).


    # # Live Tiles Example


    By now you are probably anxious to start creating your Live Tiles, and there''s
    no better way to jump in and create a sample project that creates a custom tile
    for your app and sends notifications to the tile, so it can update on the Start
    screen. To start, follow these steps:


    +   1. Create a new project in Visual Studio 2012 using the BlankApp template.


    +   2. For this project, use one of the wide tile templates to ensure your tile
    isn''t ignored. Start Start by giving the wide version of the tile to a background
    image other than the default. Wide versions of tiles are 310x150, the first thing
    you should do is add an image of that size to the Assets folder of the project.


    +   3. Open the Package-manifest file, and scroll to the Tile section. Here, you
    can set the Logo, Wide logo, and Small versions of your tile. For this example
    set the Wide logo to the image you added in the Assets folder, as shown in Figure
    4-8.


    ![](img/2cea804c0281668ba7d119c3e0ce780e_178_0.png)


    +   4. Depending on the image you choose, you may also want to set the Background
    color to match the overall tile if you have any transparency in your image.


    +   5. Now you are ready for some code; you will be surprised at how little code
