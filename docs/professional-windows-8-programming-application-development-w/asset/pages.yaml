    With Windows Store apps, you have the potential to create global apps, and with
    the Share Contract, you no longer need to write custom code for specific social
    networks. Although Facebook and Twitter are the most prevalent social networks
    in the United States today, different social networks are more prevalent in other
    countries. Without the Share Contract app, developers would need to write custom
    code so users could share to a variety of social networks and have a great global
    experience. With the Share Contract, the concept of sharing has been elevated
    from Windows Store apps to the Windows operating system. Using the Share charm,
    users have a consistent experience whereby they elect the information they want
    to share as well as the apps with they want to share that information


