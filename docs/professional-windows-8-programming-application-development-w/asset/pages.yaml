    >\n        <DiscreteObjectKeyFrame KeyTime=\"0\" />\n        Value=\"Collapsed\"\
    //>\n      </ObjectAnimationUsingKeyFrames>\n    </Storyboard>\n  </VisualState>\n\
    </VisualStateGroup>\n<VisualStateManager.VisualStateGroups>\n</Grid>\n<common:LayoutAwarePage\n\
