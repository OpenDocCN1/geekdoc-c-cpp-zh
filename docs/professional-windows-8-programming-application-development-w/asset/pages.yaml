  md: '# Proximity Overview


    Proximity classes are defined in the Windows.Networking.Proximity namespace. You
    can use proximity classes to communicate with peer apps in the range of three
    to four centimeters. You can exchange a small amount of data between closely located
    devices during a tap gesture with a ProximityDevice object or establish a long-term
    connection with a PeerFinder class.


    These operations are enabled only when your app runs in the foreground. When you
    use PeerFinder on one device, and the device is tapped, the device proximity raises
    the Activated event in the peer app running in the foreground, or notifies the
    user to activate the app if it''s not running.


    Table 6-5 shows proximity classes you can use in Windows Stores:


    > NOTE You must enable Proximity capability in the manifest to use proximity in
    your apps.


    TABLE 6-5: Proximity Classes


    | CLASS | DESCRIPTION |

    | --- | --- |

    | ProximityDevice | With this class, you can subscribe or publish messages on
    proximity devices. This class has two events: DeviceArrived and DeviceDeparted.
    You can use them to track proximity devices. PublishMessage and SubscribeMessage
    methods (including binary and URI-specific methods). You can also publish or subscribe
    for messages. |

    | PeerFinder | Discovers another instance of your app on another device and creates
    a socket connection between devices. |


    > INSTALLING NEAR FIELD SIMULATOR DRIVER


    If your device does not support near field communications (NFC) and Wi-Fi Direct,
    you can use the NetNfpProvider driver provided by Microsoft to simulate near field
    capabilities. Only use the following procedure if your device does not support
    NFC. You can check Windows Device Manager if it has any devices listed in the
    Proximity Categories, or run the proximity examples to check if it''s supported.
    Build and install the driver:


    +   1. Locate the latest version of Windows Device Driver Kit (WDK) on the Microsoft
    website. At the time of this writing the latest version is WDK 8.0 available at
    the following location: http://msdn.microsoft.com/en-us/windows/hardware/gg487463


    +   2. Download and install the kit, following the instructions. After installing
    the WDK, install co-installers when prompted.'
