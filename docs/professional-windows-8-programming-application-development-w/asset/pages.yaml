  md: "```\nasync private void GeolocationStatusChanged\n(Geolocation sender, StatusChangedEventArgs\
    \ e)\n{\n    await Dispatcher.RunAsync(CoreDispatcherPriority.Normal, () => \n\
    \    {\n        this.GeolocationStatusTextBlock.Text = e.Status.ToString();\n\
    \    });\n}\n```\n\n```\nasync private void GeolocationPositionChanged\n(Geolocation\
    \ sender, PositionChangedEventArgs e)\n{\n    await Dispatcher.RunAsync(CoreDispatcherPriority.Normal,\
    \ () => \n    {\n        this.GeolocationPositionTextBlock.Text = string.Format(\"\
    {0}, {1}\",\n        e.Position.Coordinate.Longitude.ToString(),\n        e.Position.Coordinate.Latitude.ToString());\n\
    \    });\n}\n```\n\nYou might wonder why you are using the CoreDispatcher in the\
    \ event handlers for the PositionChanged and StatusChanged events. You use the\
    \ CoreDispatcher because the asynchronous events do not operate on the UI thread,\
    \ and only the UI thread can update the status controls.\n\nThe GeolocationStatusChanged\
    \ event handler receives the current status of the Geolocation as a PositionStatus\
    \ enumeration contained the StatusChangedEventArgs class. The Text property of\
    \ the GeolocationStatusTextBlock is set to the status received within the StatusChangedEventArgs\
    \ instance.\n\nThe GeolocationPositionChanged event handler is where the application\
    \ location-area, and it does this through the PositionChangedEventArgs class which\
    \ provides you the current position as an instance of the Geoposition class. As\
    \ you'll see in Figure 8-4, the Geoposition class defines two properties: one\
    \ that provides you with the Geocoordinate representing the current position upon\
    \ the Earth, and the other representing the CivicAddress with the current position.\n\
    \n# Understanding the CivicAddress Class\n\nYou may recognize the CivicAddress\
    \ class if you've written location-area applications on Windows Phone. Compared\
    \ to its counterpart on Windows Phone, the Windows Runtime is a version and it\
    \ is much leaner. In Windows 8, the CivicAddress associated with a Geoposition\
    \ is populated by a specialized device driver that must be present on the user-party\
    \ PC. The specialized device driver provides the CivicAddress information from\
    \ a third-party provider based on the latitude and longitude that the Geolocation\
    \ determines.\n\n> NOTE The Windows recommended that developers requiring accurate\
    \ civic address information should instead use an appropriate Web API to determine\
    \ the corresponding civic address for a given latitude and longitude."
