  md: '# Promoting Your App


    Promoting your app helps your app''s visibility and discovery beyond the Windows
    Store. Bing search can help users find your app if you have a website supporting
    your app, even if it''s a one-page site. Referencing your site from your app''s
    Windows Store page, as well as including correct links, and especially links that
    follow the Windows Store protocol in your app helps users navigate the Web and
    discover your application.


    By adding Windows Store protocols to your web page, you can provide a seamless
    connection for your Windows 8 users to the apps in the Windows Store. When browsers
    use Internet Explorer 10 on Windows 8, Windows Store protocol informs you there''s
    an app available for the page they''re viewing.


    For users who use Windows 8 and IE10, you can add Windows Store protocols to your
    web pages by using this URL format: ms-windows-store:DPPTPN=. You can always identify
    these users by the user agent string of their browsers: Windows NT 6.2.


    You can enable direct linking from your web page to your Windows Store app by
    adding meta tags to the <head> section of your pages:


    ```

    <meta name="msApplication-ID" content="MyApp.App/"

    <meta name="msApplication-PackageFamilyName" content="MyApp_h94ms93aeemt/">

    ```


    You can get msApplication-ID and msApplication-PackageFamilyName from the Visual
    Studio by opening your package.appmanifest file in the Visual Studio and navigating
    to the Packaging tags. These tags are called PackageName and PackageFamilyName.


    You can use msApplication-ID and msApplication-PackageFamilyName meta tags to
    provide a Get App for This Site button for your Windows 8 users.


    # SELLING YOUR APPS


    The Windows Store provides many ways for you to get paid for your apps. Your revenue
    starts at 70 percent for new apps and to 80 percent after your app makes $25,000.
    With other application stores, this model makes a big difference after your app
    begins to scale: In most other stores if your app makes $1M, you take home $700K,
    in the Windows Store, your revenue will be $97.5K + $700K — almost 13 percent,
    Given that the size of the market is 700+ million Windows users, this can make
    a significant difference to your business grows. Table 11-1 shows the advantage
    of using the Windows Store for each platform.


    > NOTE You can make a decision on whether your app listing performs well by checking
    the Conversion report. (From your Windows Store developer account, select Adoption:
    Conversion). This report shows how often users looked at your app listing and
    how often it was downloaded and purchased.'
