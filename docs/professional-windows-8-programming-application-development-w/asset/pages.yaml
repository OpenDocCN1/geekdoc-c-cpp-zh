  md: "# StackPanel\n\nIn addition to the Grid control, you can also use a StackPanel\
    \ control to help with the placement and layout of other controls. The StackPanel\
    \ essentially is a container that \"stacks\" vertically or horizontally. There\
    \ are no columns or rows to deal with in this control. The StackPanel is simple\
    \ when you add it to the page, you can set the Orientation property to either\
    \ Vertical or Horizontal, and controls added to the StackPanel are automatically\
    \ laid out accordingly.\n\nBecause the StackPanel simply places controls next\
    \ to each other, you normally must make adjustments to the Margin properties of\
    \ the StackPanel controls to create some space between controls.\n\nDeclaring\
    \ a StackPanel in XAML looks like the following:\n\n```\n<StackPanel Orientation=\"\
    Horizontal\">\n  <Button Margin=\"5\" Content=\"Inside StackPanel\" />\n  <Button\
    \ Margin=\"5\" Content=\"Inside StackPanel\" />\n</StackPanel>\n```\n\nBy default,\
    \ the StackPanel can place objects in the vertical Orientation. So the only time\
    \ you need to set this value is if you use Horizontal. As with the Grid control,\
    \ you can now create a sample project that uses the StackPanel following these\
    \ steps:\n\n+   1. Create a new blank metro project called StackPanel.\n\n+  \
    \ 2. Use the Visual Studio 2012 Designer to re-create the user interface, as shown\
    \ in Figure 2-8. To this end:\n\n![](img/2cea804c0281668ba7d119c3e0ce780e_94_0.png)\n\
    \nFIGURE 2-8\n\n+   A. Drag a StackPanel control from the Toolbox to the main\
    \ Grid control and set its Height/Width to Auto and clear out any existing Margin\
    \ properties."
