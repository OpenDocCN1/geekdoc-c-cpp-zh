    Control styles are basically a collection of properties like CSS attributes that
    reside in the Resources section of the file you are working with or the App.xml
    file. Style definitions can also be located in a separate resource file called
    a ResourceDictionary. You can include them in the App by adding a line in the
    App.xml file. This behavior is similar to how style sheets are included in the
    Head area of the HTML document. As far as where to place styles, that depends
    on a few things:


    +   If you need only the styles for controls on a page, you can simply add them
    to that page between the following Resource tags:


    ```

    <Resources>


    <!-- TODO: Delete this line if the key AppName is declared in App.xaml -->

    </Resources>

    ```


    +   If you need to reuse the style information across multiple pages or if you
    want to apply to all instances of a given XAML control type, you will need to
    include it in App.xaml or a ResourceDictionary file


    For the following example, assume that you need these styles for this particular
    page of the App. In this case you can add the style information to the Page.Resources
    section. In doing so, you will use the code in Listing 3-1.


