    The Style tag in XAML sets the declaration of a new set of styles to apply to
    a particular control or controls. By adding the x:Name attribute you create a
    named style. That means the style applies only to the controls you use that specific
    style. This was done in the previous example by setting the Style property of
    the TextBox or TextBox with the following code:


    ```

    Style="[StaticResource BasicTextBoxStyle]"

    ```


    The StaticResource syntax is telling the system to look for a Style declared named
    "BasicTextBoxStyle" and apply it to this control. The system searches the Page.Resources
    for the Page currently resides in and the App.xaml and any embedded Dictionary
    files.


    > NOTE In addition to the x:Name attribute, the TargetType attribute is also set
    to the type of control the Style should be applied to. In example, these were
    set to TextBox and TextBox, but you can also create styles for any other standard
    XAML controls, as Button, Grid, and StackPanel. When setting the TargetType to
    a particular type of XAML control, remember to include only property settings
    for properties that actually exist for that control. For example if you were to
    have a TargetType of Button and attempt to add a setting for the Text property,
    your app would crash if you run it because the Button control uses the Content
    property instead of Text to what displays.


    You can use the TargetType attribute to apply a style to all instances of a particular
    control. For example, if you want all TextBox controls to the previous style applied,
    you can rewrite the style using the x:Name attribute like this:


    ```

    <Style TargetType="TextBox">

    <Setter Property="HorizontalAlignment" Value="Left"/>

    <Setter Property="VerticalAlignment" Value="Top"/>

    <Setter Property="TextWrapping" Value="Wrap"/>

    <Setter Property="Width" Value="200"/>

    </Style>

    ```


    Now, remove the Style assignment from the TextBox controls in your XAML code,
    and the Style will automatically apply. If for some reason you want one TextBox
    to stand out, you can add another named Style and add the Style assignment to
    that instance of the control, and the Style would apply alone. When using class-based
    styles versus debased styles, this works almost the same as CSS does. In XAML,
    the main difference is that you don''t need to add anything to the instances of
    the controls if you want unnamed Style definitions to apply to those controls.'
