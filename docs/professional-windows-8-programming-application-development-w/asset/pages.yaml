  md: "# Controls for Windows 8 | 75\n\n```\nAdvancedComboSelectedValue.Text =\nString.Format(\"\
    Selection: {0} Author - {1}\", selected.Title,\nselected.Author);\n    else\n\
    \    AdvancedComboSelectedValue.Text = \"\";\n```\n\n# RadioButton\n\nThe RadioButton\
    \ control is similar to the ComboBox control in that it provides the user with\
    \ a set of choices/options. Unlike the ComboBox control, which displays only the\
    \ selected option, a set of RadioButton controls usually present all available\
    \ options on the screen at the same time. The following code shows the basic XAML\
    \ required to add a RadioButton to your user interface.\n\nLike most controls,\
    \ the Content property determines what text to display along with the actual RadioButton\
    \ control. The RadioButton also provides an IsChecked property to set up the default\
    \ selection state. Although it is perfectly valid to select only one choice with\
    \ a RadioButton, it is useful when you have a group of them. The most common scenario\
    \ for a group of RadioButtons is to provide a list of options to the user but\
    \ allow only for one selection at a time. This means if the user selects another\
    \ RadioButton control, whatever is currently selected becomes deselected. This\
    \ is fully supported by the XAML RadioButton and is done by using the GroupName\
    \ property. In the following example, three controls are added to the user interface,\
    \ and by setting the GroupName property to the same value, only one option is\
    \ chosen across all three RadioButtons.\n\n```\n<RadioButton Content=\"1\" GroupName=\"\
    Options\" IsChecked=\"True\"/\n<RadioButton Content=\"2\" GroupName=\"Options\"\
    />\n<RadioButton Content=\"3\" GroupName=\"Options\"/>\n```\n\n# Slider\n\nThe\
    \ Slider control is a useful control in your user interface when you want to increment/decrement\
    \ a particular value. When declaring a Slider control you want to set the Minimum\
    \ and Maximum properties to make sense for your scenario. By default, these are\
    \ 0 and 100, respectively. The following XAML shows a basic Slider control that\
    \ uses a range of 0 to 500.\n\n```\n<Slider x:Name=\"MainSlider\" Minimum=\"0\"\
    \ Maximum=\"500\" />\n```\n\nTo capture the value that users select when they\
    \ move the slider, you can implement an event handler for the ValueChanged event.\
    \ In the following code the Value property determines what position the Slider\
    \ stops at; by default, the Value property is a double type, you can simply cast\
    \ it to an int if you require measurements precise.\n\n```\nprivate void MainSlider_ValueChanged(object\
    \ sender,\nRangeBaseValueChangedEventArgs e)\n{\n    MainSlider.Text = String.Format(\"\
    Slider Value: {0}\", (int)MainSlider.Value);\n}\n```\n\nwww.it-ebooks.info"
