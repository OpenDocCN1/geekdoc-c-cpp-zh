  md: "# Messaging in MVVM Light\n\nOne issue with apps with models and ViewModels\
    \ is the tight coupling of events and bindings used to notify property changes\
    \ and invoke actions. To help loosen this coupling, you can use a lightweight\
    \ messaging service to send messages to other classes that have no knowledge or\
    \ reference to the class that sent the message. In the example, an artist is marked\
    \ as a favorite in its ViewModel. If you want to allow only one artist to be the\
    \ favorite at any time without messaging, you must handle the PropertyChanged\
    \ event on each instance, which requires wiring each one you create to an event\
    \ handler circular references. However, using messaging, you can broadcast a message\
    \ that can be handled anywhere in the app. In Listing 10-19, Broadcast a PropertyChangedMessage\
    \ that GroupViewModel can remove any existing favorites.\n\n+   LISTING 10-19:\
    \ ItemViewModel\n\n```\nusing ArtistBrowser;\nusing GalaSoft.MvmLight;\nusing\
    \ System;\nusing System.Collections.Generic;\nusing System.Linq;\nusing System.Text;\n\
    using System.Threading.Tasks;\nusing Windows.UI.Xaml.Media;\nusing Windows.UI.Xaml.Imaging;\n\
    \nnamespace ArtistBrowser\n{\n    public class ItemViewModel : ViewModelBase\n\
    \    {\n        private readonly Item _item;\n\n        public ItemViewModel(Item\
    \ item, GroupViewModel group)\n        {\n            _item = item;\n        \
    \    Group = group;\n            _title = _item.Title;\n        }\n\n        private\
    \ bool _isFavorite;\n        public bool IsFavorite\n        {\n            get\
    \ { return _isFavorite; }\n            set\n            {\n                Broadcast(_isFavorite,\
    \ value, \"IsFavorite\");\n                Set(\"IsFavorite\", ref _isFavorite,\
    \ value);\n                Set(\"Title\", ref _title, _isFavorite ? _item.Title\
    \ + \" (favorite)\" : _item.Title);\n            }\n        }\n\n        private\
    \ string _title;\n```"
