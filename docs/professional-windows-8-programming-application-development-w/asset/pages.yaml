  md: "# 118 | CHAPTER 3 ENHANCING YOUR APPS WITH CONTROL STYLES, DATA BINDING, AND\
    \ SEMANTIC ZOOM\n\nIn the previous examples to handle data binding you set up\
    \ the Image and TextBlock controls to bind to properties of a WBook object. With\
    \ custom controls, you want things more flexible, and you don't want to tie anything\
    \ to one particular object type. Instead you want properties that support data\
    \ binding from any valid object, not just a WBook type. You can do this by providing\
    \ data specific properties in your custom control. In the previous code the Image\
    \ and TextBlock controls were set to use TemplateBinding, and instead of the WBook\
    \ properties that were used, new properties were created that can actually be\
    \ part of the BookDetails class. The following syntax basically means that when\
    \ this control is used, you take the value of the BookTitle property for the BookDetails\
    \ class and use that for the property of the TextBlock being displayed.\n\n```\n\
    <TextBlock TextWrapping=\"Wrap\" Style={StaticResource BookTitleStyle}\"\nText={TemplateBinding\
    \ BookTitle}/>\n```\n\nTo support your binding you need some properties in the\
    \ BookDetails custom control that matches the binding sequence. Because these\
    \ properties need support data binding, however, you must use a special syntax\
    \ when declaring them. Instead of a traditional property, you must add a Dependency\
    \ Property for the BookTitle, BookAuthor, and ThumbnailImage used in the default\
    \ style. Listing 3-11 shows the code for the BookDetails class along with the\
    \ various Dependency Property declarations required to support data binding.\n\
    \n+   LISTING 3-11: Chapter 3\\CustomControls\\BookDetails.cs\n\n```\nusing Windows.UI.Xaml;\n\
    using Windows.UI.Xaml.Controls;\nusing Windows.UI.Xaml.Media;\n\n// The Templated\
    \ Control template is documented at\nhttp://go.microsoft.com/f/ink/?LinkId=234235\n\
    \nnamespace\n    public sealed class BookDetails : Control\n    {\n        public\
    \ BookDetails()\n        {\n            this.DefaultStyleKey = typeof(BookDetails);\n\
    \        }\n\n        public ImageSource ThumbnailImage\n        {\n         \
    \   get { return (ImageSource)GetValue(ThumbnailImageProperty); }\n          \
    \  set { Set(ThumbnailImageProperty, value); }\n        }\n\n        public static\
    \ readonly DependencyProperty ThumbnailImageProperty =\n            DependencyProperty.Register(\"\
    ThumbnailImage\",\n            typeof(ImageSource), typeof(BookDetails), new PropertyMetadata(null));\n\
    ```\n\nwww.it-ebooks.info"
  merge: -1
  pgno: 151
- img_proc: true
  md: "# Summary 119\n\n```\npublic string BookTitle\n{\n    get { return (string)GetValue(BookTitleProperty);\
    \ }\n    set { setValue(BookTitleProperty, value); }\n}\n```\n\n```\npublic static\
    \ readonly DependencyProperty BookTitleProperty = \ndependencyProperty.Register(\"\
    BookTitle\",\ntypeof(string), typeof(BookDetails), new PropertyMetadata(**));\n\
    ```\n\n```\npublic string BookAuthor\n{\n    get { return (string)GetValue(BookAuthorProperty);\
    \ }\n    set { setValue(BookAuthorProperty, value); }\n}\n```\n\n```\npublic static\
    \ readonly DependencyProperty BookAuthorProperty = \ndependencyProperty.Register(\"\
    BookAuthor\",\ntypeof(string), typeof(BookDetails), new PropertyMetadata(**));\n\
    ```\n\nAs you can see, for each property that you want to make available for data\
    \ binding in the default Style, you must add a DependencyProperty line that essentially\
    \ ties that property to the data binding mechanisms in Windows 8.\n\nAt this point\
    \ you have a new custom control that has properties you can set in XAML and that\
    \ supports data binding. This enables you to make use of the control with the\
    \ following XAML code.\n\n```\n<local:BookDetails x:Name=\"ThumbnailImage\" Image=\"\
    Assets/silverlight.jpg\" BookAuthor=\"Nick Lecresinski\" BookTitle=\"Silverlight\
    \ 4 Design Solution\" />\n```\n\nAlternatively you can use data binding with these\
    \ new properties and let the code to bind to an instance of a WroxBook object:\n\
    \n```\n<local:BookDetails x:Name=\"BookDetails\" ThumbnailImage={Binding Thumbnail}\"\
    \ BookAuthor={Binding Author}\" BookTitle={Binding Title}\\ />\n```\n\nThe more\
    \ complex the XAML code you try to reuse throughout your app, the better the candidate\
    \ it is to create a custom XAML control around it.\n\n# SUMMARY\n\nThis chapter\
    \ expanded on your already growing knowledge of the XAML user interface for Windows\
    \ 8. By now you should have a good grasp of important XAML concepts such as control\
    \ styling, data binding, and creating custom controls. In addition, you were introduced\
    \ to new Windows 8 data controls, such as the ListView and GridView, and how to\
    \ use them\n\nwww.it-ebooks.info"
  merge: -1
