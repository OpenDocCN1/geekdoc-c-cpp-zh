    \        {\n            new PropertyChangedEventArgs(String.Empty);\n        }\n\
    \    });\n}}\n```\n\n# Summary: The Economics of Monetizing Your App\n\nTo estimate\
    \ how to sell your apps, you can use a model from economics called price optimization,\
    \ because the goal is to maximize return on sales. For example, as a developer,\
    \ you may want to sell your app at the highest price, so you set the price to\
    \ the maximum allowed in Windows Store: $999.99. You want to collect the full\
    \ price for the download. But not surprisingly, there's little demand for your\
    \ app at such a price. So when you decide to lower the price and set it to $499.\
    \ Unfortunately, this price doesn't trigger any demand. So, how should we price\
    \ our app?\n\n# App Revenue with No Ad Support\n\nNow you're curious; you pull\
    \ out Excel and decide to create a table to track your customer's demand by placing\
    \ the price in the first column and the number of actual downloads in another\
    \ column — Table 11-4 for an example."
