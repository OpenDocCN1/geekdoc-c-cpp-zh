  md: '# USING CUSTOM CONTROLS


    Now that you are a master at data binding and how to use the various data controls
    to display collections of content and data, you have one remaining helpful topic
    in this chapter for creating large Windows applications. You may have noticed
    that in all the previous examples, you copied XAML code to display various properties
    of a Wbook object. These parts included an Image control along with a custom TextBox.
    In all cases, these were declared using a Template. However, if you wanted to
    reuse this XAML in multiple applications or even to add additional business logic
    surrounding this visualization of a book, you need to copy/paste that logic into
    each code behind where you need to reuse. In addition to the standard XAML controls
    at your disposal for Windows 8, you can also create custom controls that fully
    support data binding and additional business logic.


    Continuing with the previous example to display information about a particular
    Wbook object, the following example shows how to convert SemanticZoom enabled
