  md: '# Opening a Developer Account


    The first step in the checklist is to open a developer account. If you do not
    have one already, you need a Windows Live ID. After you decide on which Live ID
    you want to register, click the link in the Visual Studio Store menu. You are
    redirected to the Windows Store Developer Center. The current home page for the
    Developer Center is shown in 12-18.


    ![](img/2cea804c0281668ba7d119c3e0ce780e_476_0.png)


    FIGURE 12-18


    You are asked a series of questions along with verification details to complete
    your registration. You are also charged $99 to enroll in the program. Even if
    you currently have a valid enrollment in the Windows Phone Developer Center, you
    still need to pay an additional $99 to register to the dashboard where you move
    onto the next step in the process.


    # Reserving an App Name


    This is the second step in the Visual Studio Store menu, and when you type in
    a name for your app and click the Reserve App Name button, you''re redirected
    to the Windows Store Developer center page where you can start filling out some
    basic details about your app. Figure 12-19 shows the name reservation process.'
  merge: -1
  pgno: 476
- img_proc: true
  md: '# 444 | CHAPTER 12 PUTTING IT ALL TOGETHER: BUILDING A WINDOWS STORE APPLICATION


    ![](img/2cea804c0281668ba7d119c3e0ce780e_477_0.png)


    FIGURE 12-19


    Even if you have not completed your app, you should reserve an app name sooner
    than later. After you reserve the app name in the Windows Store, you have up to
    one year to actually deploy the code before the reservation is lost.


    # Acquiring a Developer License


    ![](img/2cea804c0281668ba7d119c3e0ce780e_477_1.png)


    The next step in the menu is to acquire a developer license. When you created
    the project using the Blank app template, more than likely you were asked to retrieve
    a valid Windows developer license. However, for some reason your license is expired,
    you can still click this menu, and be presented with the option to renew your
    license, as shown in Figure 12-20. If you do not need to renew your license, you
    can skip this step.


    # Editing the App Manifest


    Next on the agenda is to edit the application manifest. If you haven''t already
    specified the various Capabilities and Declarations required by your app, this
    is the time to create a deployment package. For the WroxStore app, you''ve built
    up the manifest as you worked through the development, so no additional step is
    required here. Even so, going through this step in the process at gives you another
    chance to review the manifest and make any last changes before you move on.


    FIGURE 12-20


    www.it-ebooks.info'
  merge: -1
  pgno: 477
- img_proc: true
  md: '# Associating the App with the Store


    The next step in the process and the fifth item on the Store submenu is to associate
    your app with the Windows Store developer account you registered. If you simply
    use this Visual Studio option, you are presented with a screen asking you to sign
    in to your Windows Store account. Then Visual Studio syncs required information,
    such as Package Display Name, Package Name, Publisher ID, and Publisher Name,
    to your app’s Windows Store entry. This step is required and can be done online
    by visiting the Dashboard entry for your app in the Windows Store Developer Center.
    Figure 12-21 shows the login screen that you select this menu option.


    ![](img/2cea804c0281668ba7d119c3e0ce780e_478_0.png)


    FIGURE 12-21


    # Capturing Screenshots


    After setting up your app in the store, you must capture screenshots that show
    off your app to potential buyers. This menu option in Visual Studio simply fires
    up a copy of the Simulator and runs your app in the debugger. While the app runs,
    you are instructed to make use of the Capture Screen button in the Simulator to
    extract high-quality images that you can upload to the Windows Store entry for
    your app. After you capture as many images as you think need, you can head over
    to your app on the Windows Store Developer Center dashboard and upload the screenshots
    that they are available to your prospective buyers.'
  merge: -1
  pgno: 478
- img_proc: true
  md: '# Creating App Packages


    There are only two simple steps left before your app is ready for final configuration
    in the Windows Store. First, you must build and create the deployment package
    for your app. If you select the Create App Packages menu option in Visual Studio,
    you are presented with the screen in Figure 12-22.


    ![](img/2cea804c0281668ba7d119c3e0ce780e_479_0.png)


    FIGURE 12-22


    Sign in using your Windows Store Live ID, and follow all the on-screen prompts.
    The Windows Store wizard downloads the necessary information from the Windows
    Store that is required in your application package. After this step is fully complete,
    you can move on to the final step in the process.


    # Uploading App Packages


    Now you have your application package built and configured. The only thing left
    to do is to upload it to the Windows Store and sit back and wait for the money
    to rolling in. Select the Upload App Packages menu option in Visual Studio, and
    you are redirected to the Windows Developer Center Dashboard. From there, you
    can select your package and upload it to the Store. Simply follow all the onscreen
    prompts that you see to complete the process. Once the package is updated you
    then need to wait for the Microsoft application application certification process
    to complete. This requires'
  merge: -1
  pgno: 479
- img_proc: true
  md: 'simply allows Microsoft to scan your app for any potentially malicious code
    or other techniques

    dat don''t follow Windows 8 development guidelines.


    # Concluding Remarks on the Store Checklist


    Although this was a quick primer on the deployment process, you can always refer
    to Chapter 11 for

    more detailed information on any of these steps, including the application certification
    process.

    of the best ways to understand the application deployment process, however, is
    to create a

    new Windows Store app and walk through the entire process to finish. After you
    complete one

    submission you''ll have a good handle on it and can see just easy the process
    is.


    # SUMMARY


    This chapter covered a lot of information and summarized many of the topics presented
    throughout this

    book. Although this sample app may not reflect what you do in the real world to
    create a Windows

    Store app, it demonstrates the process you should use when you develop your Windows
    Store

    apps. If you''ve gotten this far, you should have a solid understanding of all
    the critical Windows 8

    development skills including the following:


    +   - Creating content-driven user interfaces using XAML

    - Making use of the XAML and Windows 8 user interface controls

    - Properly using Data Binding and MVVM patterns to reduce code

    - Interacting with the Windows 8 ecosystem through Contracts

    - Enriching your apps by using hardware features as sensors and geolocation

    - Solidly understanding the application life cycle and how it differs from traditional
    Windows

    Desktop application development

    - Using WinRT for File operations, Network Access, and Cloud Storage through the

    SkyDrive API

    - Understanding all the various monetization options for Windows Store apps and
    how to

    properly configure your application for deployment in the Windows Store


    Hopefully you have extracted all the information you need to start writing rich,
    content-driven

    Windows Store apps that can not only enrich users of Windows 8 devices but also
    make you some

    money in the process. Remember, for the latest information on Windows 8 development
    and API

    changes, visit http://msdn.microsoft.com.'
