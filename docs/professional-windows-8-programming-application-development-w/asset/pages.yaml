  md: "```\nAccounts.Add(new Person { FirstName = \"Test\", LastName = \"User 4\"\
    , Email = \"TestUser4@testuser.com\" });\n\nAccountList.Items.Source = Accounts;\n\
    ```\n\nThe TextBox controls sit in a Grid control when you make a selection, you\
    \ can simply set the DataContext to the Person object, and binding the TextBox\
    \ controls with the appropriate properties of the Person object. The following\
    \ code shows the SelectionChanged event handler for the ComboBox when this takes\
    \ place:\n\n```\nprivate void AccountList_SelectionChanged(object sender,\n  \
    \  SelectionChangedEventArgs e)\n{\n    Grid.DataContext = (e.AddedItems[0] as\
    \ Person);\n```\n\nYou might wonder why sometimes you use the DataContext and\
    \ other times you use the ItemsSource. In a way, the ItemsSource of certain controls\
    \ is equivalent to the Text property of the TextBox control. It's basically the\
    \ property responsible to hold the collection of data that you're binding. You\
    \ can still set the DataContext at the Page level to the collection of Person\
    \ objects and set the ComboBox to make use of it. In that, simply use the ItemsSource\
    \ property to bind to the current DataContext using the following syntax:\n\n\
    ```\n<ComboBox Name=\"AccountList\" SelectionChanged=\"AccountList_SelectionChanged\"\
    \nHorizontalAlignment=\"Left\" Margin=\"73,49,0,0\"\nGrid.Row=\"1\"\nVerticalAlignment=\"\
    Top\" MinWidth=\"200\" DisplayMemberPath=\"FullName\"\nItemsSource=\"Binding\"\
    \ />\n```\n\nHaving the ItemsSource property to just \"Binding\" tells you to\
    \ control whether the inherited DataContext is to collection. Of course, the DataContext\
    \ is set to an actual collection of objects. If some reason the DataContext is\
    \ an instance of a business object and the collection you need to display in the\
    \ ComboBox is a public property of that, simply change the binding syntax to look\
    \ for the particular property that represents the collection. The following line\
    \ of code makes the ComboBox Items property bind to a property of the DataContext\
    \ called Accounts.\n\n```\n<ComboBox Name=\"AccountList\" SelectionChanged=\"\
    AccountList_SelectionChanged\"\nHorizontalAlignment=\"Left\" Margin=\"73,49,0,0\"\
    \ Grid.Row=\"1\"\nVerticalAlignment=\"Top\" MinWidth=\"200\" DisplayMemberPath=\"\
    FullName\"\nItemsSource=\"Binding\" />\n```\n\n# ListBox\n\nAnother Windows 8\
    \ control you can use to present a list of content or data is the ListBox control.\
    \ It is similar to the ComboBox in many ways, and you can think of it as a ComboBox\
    \ control with all its options visible the same time. Figure 3-6 shows the same\
    \ data entry form as Figure 3-5, but it makes use of a ListBox control instead\
    \ of ComboBox control."
