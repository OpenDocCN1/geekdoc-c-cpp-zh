  md: '# Referencing Styles Across an App


    In your app, you may need to create many different styles for your controls, and
    in doing so you most likely need to reference them across your app and not just
    a single page. You have several options for:


    +   * Using the App.xml file: Adding the wanted styles to the App.xml file, by
    default, have them available across your app.

    * Add the styles to a custom ResourceDictionary. This is sometimes one of the
    better ways to reference styles. This type of file is designed to hold style information.
    You can easily it to provide global access to the resources you stored in. In
    addition to control styles, it is also common to put string resources for globalization
    in ResourceDictionary. This makes it easy to swap one language for another while
    the app runs or if you simply need to support different environments.


    Using the previous example, make these styles to the application by adding them
    to a ResourceDictionary. To create a new ResourceDictionary, follow these steps:


    +   1. Right-click the Project node in Solution Explorer, and select Add New File.

    2. When the dialog appears, choose the ResourceDictionary option, as shown in
    Figure 3-2, and give your ResourceDictionary a name.


    ![](img/2cea804c0281668ba7d119c3e0ce780e_119_0.png)


    FIGURE 3-2'
