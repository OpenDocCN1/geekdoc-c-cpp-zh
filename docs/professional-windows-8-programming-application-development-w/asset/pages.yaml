- img_proc: true
  md: 'You can add support for accessibility (high contrast) or localized images that
    match different languages by structuring the images in folders, as shown in Figure
    5-3. The BackgroundColor attribute can either be an RGB value in hexadecimal preceded
    by a # or a supported, named color.


    ![](img/2cea804c0281668ba7d119c3e0ce780e_187_0.png)


    FIGURE 5-3


    # # Extending the Splash Screen


    When the splash screen displays, the app should quickly register any event handlers
    and load custom UI elements and assets it. This should happen as quickly as possible.
    If you require potentially long-running methods, such as reading large amounts
    of data from a disk or retrieving data from a network, you should perform them
    after activation. In cases activation requires such methods, you should extend
    the splash screen with a page that imitates the Windows splash screen, as shown
    in Figure 5-4. This creates a seamless transition when the app takes control.'
