  md: "In addition to the Name attribute, XAML controls also provide various Brush\
    \ objects that you can manipulate to change the foreground and background colors\
    \ of the control. Using a Button control you can add options for the Foreground\
    \ and Background brush directly in XAML as follows:\n\n```\n<Button Content=\"\
    Button\" Foreground=\"#FFCC0620\" Background=\"#FF191818/\">\n```\n\nThe Brush\
    \ colors are typically defined using an ARGB format, which is of hexadecimal values\
    \ similar to how HTML color codes are often defined. The Foreground and Background\
    \ properties of controls are not restricted to simple colors. Both properties\
    \ are actually instances of a Brush object that XAML creates in the background.\
    \ By using a color, you can create a SolidColorBrush. In addition, there are Brush\
    \ objects that handle gradients and images. These additional Brush objects are\
    \ defined as child properties in XAML code. For example, a simple gradient brush\
    \ could be applied to the Button control using the following:\n\n```\n<Button\
    \ Content=\"Button\">\n  <LinearGradientBrush Endpoint=\"0.5,1\" StartPoint=\"\
    0.5,0\">\n    <GradientStop Color=\"Black\"/>\n    <GradientStop Color=\"White\"\
    \ Offset=\"1\"/>\n  </LinearGradientBrush>\n</Button>\n```\n\nYou can also use\
    \ several different attributes to modify how the control appears overall in the\
    \ layout of the page. These include Visibility, Margin, Padding, HorizontalContentAlignment,\
    \ VerticalAlignment, HorizontalAlignment, VerticalAlignment, Height, and Width.\
    \ All again these attributes are simply added to the control declaration. For\
    \ example, the following code declares the same Button control again, but this\
    \ time adds some additional padding, as well as a specific Height and Width and\
    \ Margin:\n\n```\n<Button Content=\"Button\" HorizontalAlignment=\"Left\" Margin=\"\
    5,5,10,10\" Height=\"20\" Width=\"100\"\n```\n\nThe Height and Width attributes\
    \ are self-explanatory, but the Margin property works differently than it does\
    \ for CSS margins (if you are familiar with them). The XAML Margin starts with\
    \ the Top margin and works clockwise, so you can use Top, Right, Bottom, and Left.\
    \ Like a typical CSS control, you can also set Margin=\"5\" to make all the controls\
    \ margin equal to 5. Or you can set two of the settings to align its counterparts.\
    \ The HorizontalContentAlignment to affect the alignment of the text located inside\
    \ the Button control. By default it is centered, but this code changes it to be\
    \ left-aligned. When working with XAML controls, you can use the HorizontalAlignment\
    \ and VerticalAlignment to align the control to its container, where the HorizontalContentAlignment\
    \ and VerticalAlignment attributes always affect the actual content inside the\
    \ control.\n\nAnother important property and concept of XAML controls is the Content\
