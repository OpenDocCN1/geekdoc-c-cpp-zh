    # APPLICATION BARS, NOTIFICATIONS, SPLASH SCREENS, AND LIVE TILES


    You are now an expert at using XAML to create Windows 8 user interfaces. You have
    mastered the important techniques of data binding. Your user interfaces now use
    of proven Windows 8 styles. What else is left to complete the user interface in
    a Windows Store Application?


    In this chapter you become familiar with several important user interface topics
    that provide a complete Windows Store App experience to your users. Next is a
    discussion about the Windows Store Application Bar and how it replaces the traditional
    menu system that may be used from past WPF/WinForms or Silverlight development.
    Notifications are another great new addition to Windows 8, and this gives you
    an easy way to post style notifications in the background while your app runs.
    Of course, no Windows Store Application would be complete without a customized
    splash screen, and this chapter shows you how to do just that. Finally, another
    component to Windows Store Apps is the Live Tiles. If you want your app to stand
    out among the-to-be


