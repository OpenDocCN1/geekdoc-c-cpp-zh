  md: '# CHAPTER 3 ENHANCING YOUR APPS WITH CONTROL STYLES, DATA BINDING, AND SEMANTIC
    ZOOM


    chapter takes all these basics a few steps further and introduces you to some
    additional features of XAML that help you to reduce the amount of code you write
    and provide more powerful user interfaces for your Windows Store apps.


    In this chapter you will see how to customize the standard controls using style.
    It introduces you to the topic of data binding, which enables you to create user
    interfaces that are dynamic and data centric with minimal amounts of code. After
    you have a good handle on data binding concepts, you will create custom controls
    that you can use in addition to the standard Windows 8 controls. Knowing how to
    build custom controls allows you to easily reuse user interface elements and support
    custom binding to the control properties applicable.


    After you have a good handle on control styling, data binding, and consuming,
    you will see how to make use of the new controls in Windows 8. The ListView and
    GridView were designed for data presentation using powerful data binding to make
    it easy for you, the developer, to present lists of data and information to your
    users. You will also see how to use SemanticZoom features to your GridView that
    helps your users an easy way to navigate through large lists of data.


    # STYLING CONTROLS


    When you start to create user interfaces for Windows 8, you usually place a layout
    control, such as a Grid or StackPanel, onto the design area and add basic controls
    to the screen. You may have a TextBox to display some text or a TextBox to collect
    some user input. You may have noticed after dropping the controls onto the design
    area they default to a certain look and feel. In the previous chapter, you used
    the Properties pane in Visual Studio 2012 to adjust various properties, such as
    the Font, FontSize, Margin, and so on. Doing this for controls in a simple demo
    application is not ideal and time-consuming. Trying to do this for complex user
    interfaces with different pages becomes a tedious task.


    If you have any kind of web development background, you surely are familiar with
    Cascading Style Sheets (CSS) and their ability to apply styles to controls and
    elements on a particular web page. The beauty of CSS is that you can create a
    set of attributes and apply them to all HTML elements on a page with a given selector,
    such as a class or id. XAML provides a similar concept with control styles. Control
    styles similar to CSS in that you can create a style and apply it to a particular
    XAML control instance, or you can create it in a way that is generic to all instances
    of a XAML control. This section examines a basic example of control styling.


    # Understanding Basic Styling


    Figure 3-1 shows a simple user interface consisting of a couple of TextBox and
    TextBox controls. Both the TextBox controls must have the same width and the FontSize
    of the TextBox controls have been adjusted higher.


