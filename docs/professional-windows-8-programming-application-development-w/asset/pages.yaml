  md: '# 9 Application Contracts and Extensions


    # ### WHAT''S IN THIS CHAPTER?


    +   - Understanding application contracts

    - How to use the File Picker, Cached File Updater, Play To, Search Contract and
    Settings Contracts

    - How to use the Account Picker Provider, AutoPlay, Background Tasks, Camera Settings,
    Contact Picker, File Activation, Game Explorer, Print Task Activation and SSL/Certificates
    Extensions


    # ### WROX.COM CODE DOWNLOAD FOR THIS CHAPTER


    You can find the wrox.com code downloads for this chapter in code file 20579 C09.zip
    at www.wrox.com/remitle.cgi?isbn=1118205707 on the Download Code tab. The code
    for this chapter is contained within a single Visual Studio 2012 solution with
    eight sample projects.


    # ### APP CONTRACTS AND EXTENSIONS


    Windows Store apps use contracts and extensions to declare interactions that are
    supported with Windows and other Windows Store apps. You can think of an Application
    Contract as an agreement between one or more Windows Store apps. It defines requirements
    that each app must satisfy for to participate in the given interaction. An Extension
    is an agreement between an app and the Windows operating system. Using extensions,
    developers can extend the capabilities of Windows features primarily within their
    own Windows Store apps and potentially within other Windows Store apps.'
