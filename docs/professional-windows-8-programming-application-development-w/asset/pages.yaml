  md: '# Controls for Windows 8


    6. By default if you build and run the app in the Simulator, you see that only
    a vertical scrollbar, and you can''t do any horizontal scrolling to reach the
    buttons that are off the screen. This isn''t particularly useful for your app,
    so you need to set the ScrollViewer properties to enable horizontal scrolling
    and not vertical. To do this, go to the Properties pane and search for the property
    called VerticalScrollBarVisibility.


    7. When that property displays, set it to Disabled. This eliminates the vertical
    scrollbar that appears when the application launches you don''t need.


    8. Search for the HorizontalScrollBarVisibility property and set that to Visible.
    This value ensures that the correct scrollbar appears on the screen.


    9. Build and run the app. You should see a horizontal scrollbar, and the vertical
    scrollbar should no longer be visible.


    10. The scrollbar allows you to scroll to see the remaining hidden buttons; however
    it does not work if you simply try to scroll using the mouse wheel. This behavior
    occurs although the correct scrollbar displays, the correct scrolling mode has
    not yet set. ScrollViewer requires that you set both the visibility of the appropriate
    scrollbar and the appropriate mode. You can set the scrolling mode using the HorizontalScrollMode
    and VerticalMode properties. In this particular case you want to enable the horizontal
    mode and disable the vertical mode.


