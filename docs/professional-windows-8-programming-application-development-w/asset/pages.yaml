    # Supporting a Snapped View


    Elier, there was a reference to all Windows Store apps being required to support
    a snapped view. This is covered in greater detail in the next chapter but for
    now:


    +   1. Build and run the app.


    +   2. Drag from the top of the screen, and pull the tap to the left or right
    side; then let go of the mouse or your finger. The app snaps into place and a
    new user interface displays. Figure 1-19 shows what the snapped version of the
    Grid Application looks like alongside the default Windows 8 Weather app.


