  md: "# 114 | CHAPTER 3 ENHANCING YOUR APPS WITH CONTROL STYLES, DATA BINDING, AND\
    \ SEMANTIC ZOOM\n\n```\nItemsPanel=\"(StaticResource GridItemsPanel)\nBorderBrush=\"\
    White\" BorderThickness=\"2\"\nScrollView.VerticalScrollBar=\"Auto\"\nScrollView.HorizontalVisibility=\"\
    Auto\" SelectionMode=\"Single\"\nMaxWidth=\"1000\"\nSelectionChanged=\"SelectionChanged\"\
    \nItemsSource=\"(Binding Source=(StaticResource BookCollection))\">\n  <GridView.Group>\n\
    \    <GroupStyle>\n      <GroupStyle.HeaderTemplate>\n        <DataTemplate>\n\
    \          <TextBlock Text='{Binding Subject}'\nForeground=\"White\" FontSize=\"\
    25\" Margin=\"5\" />\n        </DataTemplate>\n      </GroupStyle.HeaderTemplate>\n\
    \    </GroupStyle>\n    <ItemsPanel>\n      <VariableSizedWrapGrid orientation=\"\
    Vertical\"\n      Height=\"400\" />\n    </ItemsPanel>\n  </GroupStyle.Panel>\n\
    </GridView.Group>\n</GridView>\n</SemanticZoom.ZoomedInView>\n```\n\nYou should\
    \ already be familiar with the zoomed version of the GridView, so take a further\
    \ look at the ZoomedOutView. The ZoomedOutView still contains a GridView, but\
    \ instead of the standard ItemTemplate it provides a White border thumbnail, and\
    \ author information, you use a DataTemplate ZoomedOutBookTemplate. The following\
    \ code shows the updated template.\n\n```\n<DataTemplate x:Key=\"ZoomedOutBookTemplate\"\
    >\n  <Border BorderBrush=\"White\" BorderThickness=\"2\" Margin=\"10\" Padding=\"\
    10\">\n    <TextBlock Text=\"{Binding Subject}\" FontFamily=\"Segoe UI Light\"\
    \ FontSize=\"25\" Foreground=\"White\" />\n  </Border>\n</DataTemplate>\n```\n\
    \nThis DataTemplate provides a White border TextBlock control that is bound to\
    \ the Group.Subject. The way that this works is for each group in the CollectionViewSource\
    \ instance, there is a Group property. From this property you need to bind whatever\
    \ property represents your Key, which is the Subject.\n\n> NOTE In the GroupedBook\
    \ class that you saw previously, there were two properties: one for Subject and\
    \ one for Books, which is the actual collection of WroxBook objects. If for some\
    \ reason you were to use a class containing music information, you may end up\
    \ grouping by a property Genre, in which case you would set the binding to Group.Genre.\n\
    \nwww.it-ebooks.info"
