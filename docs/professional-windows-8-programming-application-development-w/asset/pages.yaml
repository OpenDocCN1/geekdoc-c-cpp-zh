  md: '# DATA BINDING


    When using XAML controls, another important concept in your Windows Store app
    user interface is Data Binding. In the previous chapter you saw how to build a
    basic data entry form. When the user enters data you would write some code in
    the code to extract the data from the controls and ultimately store it in a database
    somewhere. Then when it''s time to load that data back to the user interface,
    you would go through the tedious process to gain access to an instance of each
    control and appropriate property to the value of the data loading. Naturally this
    process becomes more complex when you start using data entry forms.


    # Understanding Basic Data Entry


    Figure 3-3 shows a basic data entry form consisting of a first name, a last name,
    and an email field. Now assume you want to populate it with data from a Person
    class loaded from a database somewhere. Listing 3-5 shows the code for the Person
    class.


    ![](img/2cea804c0281668ba7d119c3e0ce780e_124_0.png)


    FIGURE 3-3'
