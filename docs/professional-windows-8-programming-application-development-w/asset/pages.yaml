    body {\n}\n@media screen and (-ms-view-state: fullscreen-landscape) {\n}\n@media\
    \ screen and (-ms-view-state: filled) {\n}\n@media screen and (-ms-view-state:\
    \ snapped) {\n}\n@media screen and (-ms-view-state: fullscreen-portrait) {\n}\n\
    .centered {\n  text-align: center;\n}\n```\n\nIf you run and the app at this point,\
