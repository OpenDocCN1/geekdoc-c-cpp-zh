    # ADDING NOTIFICATIONS


    A great feature that''s been incorporated into many web applications (and some
    newer thicker client apps) is Toast notifications, which provide important information,
    typically in a small rectangular box at the corner of the screen. The notifications
    have some kind of limit and fade away if the user ignores them. As a developer
    these notifications give you a way to communicate an important message to the
    user. Toast notifications are far better than slamming a pop-up window in front
    of a busy user.


    With Silverlight and WPF, you could use some techniques to get something similar
    to a Toast notification — but nothing. The good news is Windows 8 provides notification
    capabilities in WinRT, which you can easily use of in your apps. If you''ve plugged
    in a USB device while working on desktop running another Windows Store App, you''ve
    most likely seen a Windows 8 notification already.


    By default, notifications appear in the top-right corner of the primary display
    and, depending on how you configure them, also play a short. With WinRT, you can
    create and configure custom notification messages. Users can disable notifications
    at the OS level thus you''re not guaranteed to always be able to send them. You''re
    not restricted to sending notifications from your installed Windows Store App
    either. With the new Windows Push Notification Service, you can remotely send
    notifications from a cloud-based service.


    In Windows 8, the majority of the toasts are standard duration toasts. These messages
    should actually display only when you need to convoy an important message to the
    user. Standard toast messages display for 7 seconds; during that time the user
    can touch/click the message, and your app is brought to the forefront for user
    interaction. Standard Toast messages also play a brief audio sound as well. The
    long duration toast message gives you the ability to display a toast notification
    for 25 seconds. You may want to use this kind of notification only in limited
    scenarios in which you must get the attention of the user and get back into your
    app.


    # Understanding Templates


    All messages that you create and in your app are done by creating a simple XML
    message. The XML message has several properties that you can override to customize
    the message. Windows 8 provides many different toast templates that you can choose
    from. Some of these templates display basic text, whereas others display an image
    with text. For an-to-date list of available toast templates, visit http://msdn.microsoft.com/en-us/library/windows/apps/hh761494.aspx.
    Following is a list of the available templates at the time of this writing.'
