  md: '# Pictures Library


    Gives apps access to picture files that are stored in the Pictures Library on
    the file system.


    # Private Networks (Client & Server)


    Sends/receives data through private/home network firewall configurations.


    # Proximity


    Sends/receives information to other devices within a close proximity of the originating
    device.


    # Removable Storage


    Gives application and programmatic access to any connected external hard drives.


    # Shared User Certificates


    Uses software/hardware certificates that may exist on alternative devices such
    as smartcards.


    # Videos Library


    Gives apps access to video files that are indexed and stored in the Videos Library
    on the file system.


    # Webcam


    Makes use of built-in webcam device.


    > NOTE By default, every Windows Store app has the Internet capability set to
    true, for this app you don''t need to change any of the default settings.


