  md: '# 11


    # Windows Store and Monetization


    WHAT''S IN THIS CHAPTER?


    +   * Windows Store for developers

    * How to sell and promote apps in the Windows Store

    * Developing trial, in-app purchase and ad-supported apps

    * Application packaging and deployment

    * Windows Application Certification Kit

    * Deploying enterprise (LOB) apps

    * Understanding the Windows Store policies

    * Example: Color Shopping app


    WROX.COM CODE DOWNLOADS FOR THIS CHAPTER


    You can find the code downloads for this chapter in the code file 205709 C11.zip
    at www.wrox.com/remitle.cgi?isbn=1118205707 on the Download Code tab. To illustrate
    Windows Store monetization methods, in-app purchase, advertisements and trial
    conversions, I included a Color Shopping app example:


    +   * ColorShoppingAppCs.zip


    # WINDOWS STORE OVERVIEW


    The Windows Store opens a new global market on the largest software platform in
    the world. It''s unmatched in terms of opportunity, scale, and global reach. There''re
    billions of Windows users in the world, and as an app publisher, you can now show
    your craft and sell and distribute your products.'
  merge: -1
  pgno: 372
- img_proc: true
  md: 'Planning ahead is always a good idea, and understanding how the Windows Store
    can help you build your app to maximize its reach and potential, which this chapter
    is so important.


    If you plan to sell your app, which is what most developers want, Windows Store
    offers flexible business models and pricing tiers. With the Windows Store you
    can choose between free, paid, in-app purchase, third-party, ad-supported and
    multiple combinations to sell your apps, which this chapter discuss in detail.


    If you develop for an enterprise, a public organization, or a government organization,
    and plan to distribute your apps, this chapter shows you application deployment
    options for your organization.


    The Windows Store supports transparent terms and fair business, and enables developers
    to continue price and revenue.


    # A LITTLE BACKGROUND


    One of the first apps in the Windows Store involves a lot of responsibility. As
    a publisher of Card Games Chest, one of the first apps released with the Windows
    Store preview, the author would like to thank all the reviewers, testers, and
    contributors, who relentlessly played the games, and provided suggestions, ideas,
    and motivation. You can download this app from the Games section of the Store,
    or from the Card Games category.


    I learned a lot from this experience, and in this chapter I am happy to share
    information with you. Many tips in the chapter came with the real-life experience
    of publishing this and other apps in the Windows Store, going through the app
    certification process, and making the app successful.


    I would also like to thank Microsoft for this opportunity and once-in-a-lifetime
    experience to bring the app with preview versions of the Windows Store and for
    helping me with the design guidance.


    > NOTE You can use the Color Shopping app, which is referenced to illustrate application
    packaging, monetization, and other store decisions.


    # HOW CONSUMERS SEE YOUR APP


    From the customer point of view, the Windows Store is another app, deeply integrated
    with Windows 8, presented by the Store tile on your Start screen. Customers can
    also access the Windows Store from the browser (see Figure 11-1).'
