  md: '# ScrollView


    The final layout control to cover is the ScrollViewer, which is self-explanatory;
    it acts as a container for any content that may overflow the part of the screen.
    If an overflow occurs a scrollbar is added to the user interface, and the user
    can scroll content contained in the ScrollViewer into position.


    The ScrollViewer can handle scrolling content vertically or horizontally depending
    on your preferences. This control comes in when you add large amounts of content
    to your application; depending on the device you use, you may add your content
    between the opening and closing of the ScrollViewer tag with one key difference.
    With the Canvas, StackPanel, and Grid, you can add any number of controls as without
    issue. For the ScrollViewer, however, you can add only one control as a child.
    If you want to scroll multiple controls hosting content, the main child of the
    ScrollViewer must be one of the other layout controls, such as a Canvas, StackPanel,
    or Grid. That child control can host as many controls as desired.


    To get a feel for how to work with the ScrollBar, let''s work through another
    example:


    +   1. Create ScrollBar in Visual Studio 2012 called ScrollBar.

    2. In the MainPage.xaml file drag and drop a ScrollViewer control from the Toolbox
    onto the main Grid in the designer.

    3. As you have before the ScrollViewer to take up all available space in the parent
    Grid control, and then add a StackPanel to the ScrollViewer.

    4. The StackPanel holds a collection of button controls so that you can create
    a need for horizontal scrolling. Change the Orientation of the StackPanel to Horizontal
    and then simply copy and paste buttons until they start to appear off the screen.

    5. So that things look cleaner, you can also add a Top, Left, and Right Margin
    value of 50. When everything is complete you should have something similar to
    Figure 2-10.


    ![](img/2cea804c0281668ba7d119c3e0ce780e_97_0.png)


    FIGURE 2-10'
