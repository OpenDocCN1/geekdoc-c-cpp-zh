  md: "The GroupedList class is implementing the INotifyPropertyChanged interface.\
    \ You need to implement this interface for the FilteredBookList property to work\
    \ properly. Although the ObservableCollection<T> class notifies the user if there\
    \ are changes to the underlying collection, it won't notify if the ObservableCollection\
    \ is swapped for something else. For filtering and sorting you replace the entire\
    \ ObservableCollection<T> with a new version sorted or filtered, and you want\
    \ the user interface to refresh accordingly. Implementing INotifyPropertyChanged\
    \ and calling the internal RaisePropertyChanged method ensures the user interface\
    \ reflects the filtering/sorting.\n\n# Building Default Data\n\nSo you have now\
