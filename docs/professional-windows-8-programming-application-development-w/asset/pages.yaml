  md: '+   Grid app: Creates a grid-based user interface for your app where content
    is grouped in a grid. You can access detailed information and perform additional
    actions by having the user interact with the groups.


    +   Split app: Provides a different take on the grid-based application. This type
    of application has a split view of both the grid content and the detail at the
    same time.


    Before doing any Windows Store app development, the thing you need to decide is
    the type of application plan to build and which of the previous templates to use
    for your starting point. The following sections take an in-depth look at the Grid
    and Split templates and how they might best serve particular types of Windows
    Store apps.


    # Grid Applications


    The goal of the grid application template is to give you an easy way to present
    collections of information that the user navigates within a group. For example,
    if your app intends to present something like a music collection, you might use
    this template to show particular genres, followed by artists that fall into that
    genre. This template also enables the user to touch or click on a particular genre
    or artist and view additional information without navigating back to the starting
    point. Now Modify the project that this template creates to just that: Create
    a new C#/XAML Windows Store project in Visual Studio called ArtistBower, and select
    the Grid App template.


    After the project is created, you will have several new files added to the Solution
    Explorer. Table 1-6 shows these at a high level.


    | FILE | TASK |

    |---|---|

    | GroupItemsPage.xaml | The start page for the app, shows a scrolling list of
    groups along with group items. |

    | GroupDetailPage.xaml | If the user clicks a group header from the Start page,
    the app navigates to this page, which displays all the items from the group. |

    | ItemDetailPage.xaml | This page is responsible for showing detailed information
    for an item that the user selected on the group on the previous screen. |

    | DataModel\SampleDataSource.cs | Contains classes that hold the sample data.
    In this file, there are classes for Items, Groups, and the overall Group collection.
    There is also a class that populates the default data with sample information.
    Data binding is used extensively in the app, and the classes in this file are
    the main objects being bound to. |'
