    # GETTING STARTED WITH DATA, FILES, AND NETWORKING


    As devices become more diverse in features, added sensors, storage, and networking
    capabilities, apps go beyond simply storing data in files. Windows 8 adds a wealth
    of APIs, enabling apps to do tasks they couldn''t do before.


    In this chapter, you will explore new and familiar tasks for handling application
    data, access permissions, and networking. You will learn where you can store data
    (depending on various factors) and how to access various libraries on the user
    device, such as music, videos, documents, removable storage, and networks. In
    order to keep user experience fast and fluid, without locking the user interface
    while lengthy file and networking tasks are performed, developers are encouraged
    to use the asynchronous programming discipline in this chapter.


    This chapter also shows you how to transfer and download data and files, use WebSockets,
    UDP and TCP connections, serialize and deserialize data, and connect to network
    services and storage.


    # HANDLING APPLICATION DATA AND FILES


    Windows Store apps can access the install folder, app data locations, the Downloads
    folder, additional locations, such as the Documents library, Music Library, Pictures
    Library, Videos, home-group libraries, removable devices, and media servers supporting
    Digital Living Network Alliance (DLNA) protocol.


    While some file folder locations do not require any special access declarations,
    other locations may need access declaration in an application''s manifest. Pictures,
    music, and videos locations, for example, need be declared in the manifest. These
    declarations and file access permissions are discussed in the following sections.


    # Getting Started with the Data Samples App


    To work with the Data Samples app, you need Windows 8 with Visual Studio 2012.
    The app is a collection of examples that illustrates application data, file access,
    networking, and other material from this chapter. Later in this chapter, a standalone
    Leaderboard example is introduced. Figure 6-1 shows the main screen of the Data
    Samples app.'
