    # USING THE 3-D COMPASS


    A compass is a navigational device designed to measure directional headings. You
    can use the compass sensor in your apps to detect directional headings and there
    are numerous scenarios where this would prove useful such as navigational apps.
    In the Windows Sensor Platform, the compass sensor is synthesized using sensor
    fusion.


    # Using the Compass Class


    The Compass class provides a single ReadingEvent event that occurs each time the
    3-D compass has new readings for the headings using magnetic north and true north.


    Figure 7-3 shows that the CompassReadingChangedEventArgs class contains a single
    property of type CompassReading. The CompassReading class provides properties
    for both the magnetic north and true north along with the Timestamp property recording
    the time at which the compass reported the reading. To use the Compass class,
    follow these steps:'
