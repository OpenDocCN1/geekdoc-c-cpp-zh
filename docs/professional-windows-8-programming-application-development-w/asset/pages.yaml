  md: "# Finishing the XAML Behind\n\nThe XAML is set, and the view model is ready.\
    \ All that is left is to handle any messages coming from the view model and ensure\
    \ that the default CollectionViewSource is canceled. You must do all this from\
    \ the code behind. Open the GroupedBooks.xaml.cs file and replace its contents\
    \ with the code in Listing 12-8:\n\nLISTING 12-8: GroupedBooks.xaml.cs\n\n```\n\
    using GalaSoft.MvmLight.Messaging;\nusing Windows.UI.Xaml;\nusing Windows.UI.Xaml.Navigation;\n\
    using WroxListBoxStore.Common;\nusing WroxListBoxStore.Messages;\n\n// The Grouped\
    \ Items Page template is documented at\nhttp://go.microsoft.com/fwlink/?LinkId=234231\n\
    namespace WroxListBoxStore\n{\n    /// <summary>\n    /// A page that displays\
    \ a grouped collection of items.\n    /// </summary>\n    public partial class\
    \ GroupedBooks : LayoutAwarePage\n    {\n        private bool _initialLoad = true;\n\
    \n        public GroupedBooks()\n        {\n            this.InitializeComponent();\n\
    \        }\n\n        protected override void OnNavigatedTo(EventArgs e)\n   \
    \     {\n            base.OnNavigatedTo(e);\n\n            Messenger.Default.Register<BookSelectedMessage>(this,\n\
    \                HandleBookSelected);\n            Messenger.Default.Register<GroupSelectedMessage>(this,\n\
    \                HandleGroupSelected);\n        }\n\n        protected override\
    \ void OnNavigatedFrom(EventArgs e)\n        {\n            base.OnNavigatedFrom(e);\n\
    \n            Messenger.Default.Unregister<BookSelectedMessage>(this);\n     \
    \       Messenger.Default.Unregister<GroupSelectedMessage>(this);\n        }\n\
    \n```\n\ncontinues"
