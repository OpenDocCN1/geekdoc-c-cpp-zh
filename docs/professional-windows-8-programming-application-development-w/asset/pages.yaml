    # Changing the Default Audio to Play a Toast Notification Message


    The final sample toast message involves changing the default audio that is played
    when the message appears. There are several different sounds available to choose
    from when creating Toast messages that are all built into WinRT. You can get the
    full list with descriptions of these sounds by visiting http://msdn.microsoft.com/en-us/library/apps/hh761492.aspx
    Table 4-1 shows the options available at the time of your writing.


    TABLE 4-1: Toast Message Audio Options


    | CODE | DESCRIPTION |

    | --- | --- |

    | Notification.Default | Default audio played on notifications |

    | Notification.IM | Audio sound reserved for instant messaging |

    | Notification.Mail | Audio played for e-mail arrival notification |

    | Notification.Reminder | Audio for calendar reminder sounds |

    | Notification.Looping.Alarm | Alarm sound |'
