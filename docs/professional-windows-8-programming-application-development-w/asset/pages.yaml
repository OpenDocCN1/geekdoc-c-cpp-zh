  md: '# Using Background Tasks


    Background tasks are designed for real-time apps, such as e-mail, VOIP, or social
    media clients. Using background tasks, an app receives a limited amount of the
    system resources to enable an amount of work to occur that requires no interaction
    with the user.


    Windows Store apps register a background task using the BackgroundBuilder class
    defined in the Windows.ApplicationModel namespace. You define Background tasks
    in a type that implements the IBackgroundTask interface and you can host in the
    app itself, in an in-process server DLL, or in a host-executable provided by Windows.


    When you create a background task, you must determine when the task will trigger.
    You can then allocate system resources to run the task. Table 9-1 details the
    trigger types that you can use to trigger background tasks to run.


    TABLE 9-1: Background Task Events


    | BACKGROUND TASK TYPE | TRIGGER EVENT | WHEN THE BACKGROUND TASK IS TRIGGERED
    |

    |---|---|--|

    | ControlChannelTrigger | ControlChannelTrigger | On incoming messages on the
    control channel |

    | MaintenanceTrigger | MaintenanceTrigger | When it''s time for maintenance background
    tasks |

    | PushNotificationTrigger | PushNotificationTrigger | A raw notification arrives
    on the WNS channel |

    | SystemEventTrigger | InternetAvailable | The Internet becomes available |

    | SystemEventTrigger | LockScreenApplicationAdded | An app is added to the lock
    screen |

    | SystemEventTrigger | LockScreenApplicationRemoved | An app is removed from the
    lock screen |

    | SystemEventTrigger | ControlChannelReset | A network channel is reset |

    | SystemEventTrigger | NetworkStateChange | A network change such as a change
    in cost or connectivity occurs |

    | SystemEventTrigger | OnlineIdConnectedStateChange | Online ID associated with
    the account changes |

    | SystemEventTrigger | ServicingComplete | The system has finished updating an
    application |

    | SystemEventTrigger | SessionConnected | The session is connected. |'
