  md: "# CHAPTER 3 ENHANCING YOUR APPS WITH CONTROL STYLES, DATA BINDING, AND SEMANTIC\
    \ ZOOM\n\n```\npublic sealed partial class Home : BasicDataBinding.Common.LayoutAwarePage\n\
    {\n    public Home()\n    {\n        this.InitializeComponent();\n    }\n\n  \
    \  protected override void OnNavigatedTo(EventArgs e)\n    {\n        base.OnNavigatedTo(e);\n\
    \        LoadAccount();\n    }\n\n    private void LoadAccount()\n    {\n    \
    \    this.DataContext = new Person { FirstName = \"Nick\", LastName = \"Lrecenski\"\
    , Email = \"testuser@testuser.com\" };\n    }\n}\n```\n\n![](img/2cea804c0281668ba7d119c3e0ce780e_129_0.png)\n\
    \nData binding almost seems too easy in some ways. You don't have any additional\
    \ code in the code behind to set properties on each individual control. Instead\
    \ you simply have one line of code to the DataContext, and data binding takes\
    \ care of the rest.\n\n# Updating Data with Two-Way Data Binding\n\nThis simple\
    \ example handles loading data into the user interface, but how can data binding\
    \ help retrieve your new data from the user interface as easily? All it takes\
    \ to collect the data in the form is a simple change to the TextBox. In the following\
    \ TextBox declarations in the XAML code have been modified to support Two-way\
    \ data binding."
