  md: "Now that you have a class that has the grouped books, you need a collection\
    \ object that can hold a list of these groupings. Windows 8 provides a new class\
    \ called CollectionCollectionView that provides built-in support for sorting,\
    \ filtering, and grouping and is the perfect candidate for the data that you are\
    \ using the GridView binding operation.\n\nThe following code adds a CollectionCollectionView\
    \ instance to the page that is responsible to hold the list of grouped books:\n\
    \n```\nprivate CollectionCollectionView BookCollection {\n    ISSourceGrouped\
    \ is = true, ItemPath = new PropertyPath(\"Books\");\n}\n```\n\nIn this code,\
    \ the ISSourceGrouped property is set to true. The Collection class uses a Source\
    \ to hold the list of items you have in the collection. Because the class supports\
    \ sorting, filtering, and grouping, it's not required that you place items in\
    \ a grouped format. If it are, you need to tell the CollectionSource that the\
    \ items with you are populating books. In addition, the ItemPath property is set\
    \ to look for the property in your object books. This declaration of the CollectionSource\
    \ expects that all items in your collection will have a collection of books called\
    \ \"Books\" and the string property of \"Subject\".\n\nBecause you tell the CollectionSource\
    \ class that its Source property will be set to a collection of items that are\
    \ already grouped, you need to take care of the grouping next by utilizing a simple\
    \ Linq statement to populate the Source property of the CollectionSource. In the\
    \ following code, the current List<Book> called AllBooks is grouped according\
    \ to using the GroupBy statement in Linq:\n\n```\nprotected override void OnNavigatedTo(EventArgs\
    \ e)\n{\n    base.OnNavigatedTo(e);\n\n    SetupListBox();\n\n    var groupedBooks\
    \ = AllBooks.GroupBy(x => x.Subject).Select(x => new\n    GroupedBooks { Subject\
    \ = x.Key, Books = x.ToList() });\n\n    BookCollection.Source = groupedBooks.ToList();\n\
    \    MainGridView.ItemsSource = BookCollection.View;\n}\n```\n\nIn the last line\
    \ of this code, the ItemsSource property of the GridView is set to the View property\
    \ of the CollectionSource. The CollectionSource also provides different views\
    \ into the current data without needing to change the user interface. By setting\
    \ the ItemsSource property to the view, you can be sure that the GridView always\
    \ controls the current view of the data that is sorted, filtered, or grouped.\n\
    \nThe last thing you need to do is tell the GridView you want support grouping\
    \ so that each item is positioned in the appropriate group with a header displaying\
    \ the Subject property of the book. The CollectionCollectionView object has everything\
    \ ready to go and are arranged in the correct groups, but you must now use the\
    \ XAML code for the GridView to take advantage of it. In the following code you\
    \ can see that the own property of the GridView sets up a column header for each\
    \ group of books."
