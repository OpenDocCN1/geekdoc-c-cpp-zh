    | Documents | This capability is to Store policy: See "More information" for details.
    This provides the capability to read, write and delete documents in the Documents
    Library that are defined using the File Type Associations declaration. The app
    can access these documents on HomeGroup. | | |

    | Enterprise Authentication | | |

    | Internet (Client & Server) | | |

    | Microphone | | |

    | Music Library | | |

    | Photos Library | | |

    | Phone Networks (Client & Server) | | |

    | Removable Storage | | |

    | Shared User Certificates | | |

    | Video Library | | |

    | Webcam | | |


    Depending on what features your app implements, you have various device capabilities
    for which you potentially need to request permission. Table 1-4 gives a brief
    description of what these capabilities provide for your app.


    # TABLE 1-4: Device Capabilities


    | CAPABILITY | DESCRIPTION/FEATURE |

    |---|---|

    | Documents Library | Add/edit/create/delete documents in the Documents Library
    on the file system |

    | Enterprise Authentication | Performs domain credential authentication typically
    on a corporate LAN network |

    | Internet (Client & Server) | Downloads and uploads information to/from the Internet
    via Wi-Fi or cellular data connections |

    | Internet (Client) | Downloads information from the Internet via Wi-Fi or cellular
    data connections |

    | Location | Acquires location information through Wi-Fi/Cell Triangulation or
    GPS |

    | Microphone | Makes use of the built-in microphone where available |

    | Music Library | Gives apps access to music files that are indexed and stored
    in the Music Library on the file system |


    www.it-ebooks.info'
