  md: '# USING THE CACHED FILE UPDATER CONTRACT


    Windows Apps that use the File Picker Contract can also utilize the Cached File
    Updater Contract to enable real-time synchronization if the files are stored in
    a cloud-based repository, such as Microsoft SkyDrive. The official SkyDrive app
    on Windows 8 uses this contract so that files either picked from, or saved to,
    SkyDrive can seamlessly update or refresh. The SkyDrive Photos app you explored
    in the section "Selecting Files from Windows Store Apps" were to implement the
    Cached File Updater Contract, you could open photos from SkyDrive, edit them in
    an image editing app, and accurately replicate to the originals in the SkyDrive
    album.


    > NOTE The Cached File Updater Contract is designed for apps that provide storage,
    typically cloud-based, from which users access or save files. It is likely that
    your app will not require you to implement this contract; although, if it is necessary,
    you can use the following Quickstart from http://microsoft.com/en-us/library/windows/apps/hh46192.aspx.


    # USING THE PLAY TO CONTRACT


    Windows Store apps enable users to play video, photos, or to listen on DNLA-certified
    devices, such as their television, Blu-ray player, or touchscreen computer monitor.
    In the following example you explore how to play video to an appropriate device.


    # Introducing the PlayToManager Class


    Implementing the Play To Contract requires that you use the PlayToManager class
    in the Windows.Media namespace and establish an event handler for the SourceRequested
    event. The SourceRequested event occurs when a user requests media to stream to
    an appropriate device.


    ```

    PlayToManager manager = new PlayToManager();

    manager.SourceRequested += this.PlayToManager_SourceRequested;

    manager.SourceSelected += this.PlayToManager_SourceSelected;

    ```


    Another event that the PlayToManager class provides is the SourceSelected event,
    occurs when an appropriate source element is selected. Using an event handler
    for this event, an app can discover the name of the selected device and its capabilities,
    such as whether it can play video or display images.


    In the following markup, a MediaElement is declared that an MP4 format video.


    ```

    <Grid Background="StaticResource ApplicationPageBackgroundThemeBrush">

    <MediaElement Name="MediaElement"

    AutoPlay="True"

    IsLooping="True"

    Source="Media/iStock_0000206354877BigWeb.mp4"/>

    ```


    ```

    <Grid Name="DeviceInformationGrid" Background="Black"

    Width="300" Height="100">

    ```'
