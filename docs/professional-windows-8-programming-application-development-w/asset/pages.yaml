  md: "# CHAPTER 3 ENHANCING YOUR APPS WITH CONTROL STYLES, DATA BINDING, AND SEMANTIC\
    \ ZOOM\n\n![](img/2cea804c0281668ba7d119c3e0ce780e_135_0.png)\n\nFIGURE 3-6\n\n\
    The XAML code required to use the ListBox is similar to the ComboBox example.\
    \ The code shows the declaration for the ListBox control, which again uses the\
    \ DisplayMemberPath property to determine which property of the Person object\
    \ displays to the user. The ItemsSource is also set to the Accounts property of\
    \ the current DataContext containing the actual collection of Person objects.\n\
    \n```\n<ListBox Name=\"AccountList\" SelectionChanged=\"AccountList_SelectionChanged\"\
    \nItemsSource={Binding Accounts} DisplayMemberPath=\"FullName\"\nHorizontalAlignment=\"\
    Left\" Margin=\"48,31,0,0\" VerticalAlignment=\"Top\"\nWidth=\"200\" Height=\"\
    200\">\n```\n\nAfter you select the ListBox control, you handle it the same way\
    \ as with the ComboBox. The following code shows the SelectionChanged event extracting\
    \ the selected Person object and setting the DataContext of the data entry to\
    \ Person instance:\n\n```\nprivate void AccountList_SelectionChanged(object sender,\n\
    {\n    SelectionGrid.DataContext = (e.AddedItems[0] as Person);\n}\n```\n\n# ListView\n\
    \nThe ComboBox and ListBox are solid controls for presenting your users with a\
    \ list of choices in the user interface. For most applications, you want more\
    \ flexibility in presenting content and collections of business objects. This\
    \ is where the ListView and GridView come in handy. The ListView offers you a\
    \ way to present customized views of data in a traditional vertical orientation.\
    \ Figure 3-7 shows a collection of books and thumbnails in a ListView control,\
    \ complete with selection handling.\n\nit-ebooks.info"
