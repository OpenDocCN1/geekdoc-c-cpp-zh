  md: '# Button


    The Button control (that you have already seen in this chapter) enables the user
    to click or touch to perform an action. When declaring an instance of a Button
    control in XAML, you can use the Content property to determine what text appears
    in the Button. The following code defines a basic XAML Button control:


    ```

    <Button x:Name="StandardButton" Content="Create Message" />

    ```


    The main purpose to use a Button control is usually to perform some kind of user
    interface action. Specifically, you can handle the Click event of the Button control
    and perform some logic in the code handler. To see all the user interface events
    available for the Button and other controls, click the Lightning Bolt icon in
    the Properties pane of Visual Studio, as shown in Figure 2-11.


    After you ring the list of events, you can find the Click event and double-click-to-generate
    an event handler in the code or type in the name of the method that you want to
    use the handler. You can use a Button event to manipulate another area of the
    user interface.


    Now we''ll look at another simple example of:


    +   1. In Visual Studio create a new project ActionControls and add a new page
    Controls.xaml using the Basic Page template. After doing this you will see a warning
    that several necessary files will be automatically added to the project. Go ahead
    and allow as these files are required to provide things like basic page navigation
    that you will be using in this example. This page can host basic page for all
    the controls you use throughout the rest of the chapter. Don''t forget to set
    this page to load on startup in the App.xaml.cs by using the Loaded event handler.

    2. So that you have a layout, add a StackPanel control to the main row of the
    Grid that exists on the page.

    3. Set the Orientation to Horizontal and then drag the controls into the StackPanel
    in the correct order: TextBox, Button, and TextBox.

    4. After the controls have been dropped, look at the XAML view of the code to
    make sure it looks like the following code:


    ```

    <StackPanel Margin="0,20,0,0" Orientation="Horizontal"

    VerticalAlignment="Top" Grid.Row="1">

    n<TextBox HorizontalAlignment="Center" TextWrapping="Wrap"

    Text="Enter your name:"

    VerticalAlignment="Center" FontSize="20"

    Margin="20,0,0,0"/>

    <TextBox x:Name="PullName" HorizontalAlignment="Center"

    TextWrapping="Wrap" VerticalAlignment="Center"

    Width="200" Margin="20,0,0,0"/>

    </StackPanel>

    ```


    ![](img/2cea804c0281668ba7d119c3e0ce780e_100_0.png)


    FIGURE 2-11


    www.it-books.info'
