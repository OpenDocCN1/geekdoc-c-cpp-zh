  md: '# HELLO WINDOWS 8


    Regardless of language, traditionally when you write a development book, you introduce
    a new topic with a Hello World application. Not wanting to upset the status quo,
    you do the same here. At this point, you have some basic knowledge about Windows
    8, and Visual Studio 2012, so now is a great time to get your feet wet developing
    your Windows Store app. Because you can write a Windows Store app in the language
    of your choice, start by picking a language in which you''re most comfortable
    working.


    > NOTE This book includes C#, C+, and JavaScript examples whenever possible. As
    always, the full code for all the apps and examples is available from http://www.wrox.com
    for all three languages.


    # Selecting a Language and Default Folders


    To start, follow these steps:


    +   1. Fire up Visual Studio, and select File New Project. This launches the Project
    Template dialog.

    2. For the language of your choice, find the Windows Store app templates. Select
    Blank App and click OK to continue.

    3. In Figure 10, you can see the full list of all available Windows Store app
    templates. Give your project a name, as Hello Windows 8, and click OK. Visual
    Studio creates a new project with all the required files for a basic Windows full-screen
    app. With the C# version in the Solution Explorer, you can see several directories
    and files. Table 1-3 covers which task each file is responsible for at high level.


    TABLE 1-3: Default Project Files


    | FILE | TASK |

    | MainPage.xaml | The initial page that loads in your application. You must create
    your user interface with this file. |

    | MainPage.xaml.cs | The code-behind for the default page. In this file, you can
    add code to handle control events or page navigation events. |

    | App.xaml | Contains a globally available ResourceDictionary. To style user interfaces,
    you must declare styles in this file, which are automatically available to any
    page in your application. |

    | App.xaml.cs | This code-behind file contains handlers for important application
    events such as launched, suspended, and others. This file is also where you set
    MainPage.xaml as the first page to load upon application startup. To change page
