  md: "# Using the Future Access List\n\nA future access list is different from the\
    \ MRU list that it has more capacity (up to 1000 entries), and you must manage\
    \ it from your code; that is, take care of removing entries when they are no longer\
    \ needed.\n\nThe following example is similar to the GetRecentlyUsedAsync previously\
    \ shown, but after retrieving the item from the list, it automatically removes\
