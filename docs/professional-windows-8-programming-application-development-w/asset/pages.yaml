  md: '# SUMMARY


    With this chapter complete, if you have never seen or heard of XAML, you should
    have a good idea of how to start using XAML to create powerful Windows 8 user
    interfaces. If you''ve used XAML in the past, you will get a quick refresh in
    some of the basics. This chapter displayed some of the basic WinRT controls you
    can create in XAML as well as the event handling mechanism to manipulate and control
    interfaces.


    In addition to understanding the various basic controls you can use in your interfaces,
    you should also have a good understanding of the layout controls such as the Grid,
    StackPanel, and Canvas. Understanding the Grid control is critical to creating
    user interfaces going forward in this book. You should know how to add rows and
    columns to the Grid and how to properly size them depending on the controls that
    the Grid contains. You saw how the Grid control supports Auto, Pixel, and Star
    basing algorithms that give you plenty of flexibility to create fluid tables as
    layouts. You also saw that when you need to create a layout that makes use of
    an absolute positioning mechanism the Canvas control is much better suited than
    the Grid.


    The next chapter and the remainder of the book will require you to understand
    the basics of XAML, control event handling, and the various layout controls. You
    will see more powerful controls available in WinRT and Windows Store apps, and
    you''ll be introduced to the concept of Data Binding, which can help you to cut
    back further on the amount of code required in the code behind. You will see how
    to use several of the Windows 8 data controls to help you present content to your
    users from various data sources.


    If you feel confident in your XAML abilities at this point, charge ahead; if you
    don''t hesitate to refer to some of the samples in this chapter to get a solid
    feel for how to utilize things, such as the Button, TextBlock, Grid, StackPanel,
    and TextBox controls. This will form a basis for the interfaces you will create
    going forward.'
