    events. |

    | ItemsPage.xaml | The user interface for the Start page that shows a collection
    of groups. |

    | ItemsPage.xaml.cs | The code behind to add control handlers or handle page navigation
    events. |

    | Package.appmanifest | The application settings file. |'
