    \ private set; }\npublic string ImagePath { get; private set; }\n\n```\n\n# USING\
    \ COMMANDS TO HANDLE INPUT\n\nCommands are a means to pass input from the View\
    \ to the ViewModel. The View interprets the device input as a semantic action\
    \ and executes the appropriate command in the ViewModel using binding. These commands\
    \ are an implementation of the ICommand interface, which at its core, has an action\
    \ it must perform and optionally specifies if the command can be executed given\
    \ its current state.\n\nCommands help separate the object that interprets the\
    \ semantics of an action from the Execute method. The implementation of the Execute\
    \ method enables the result of the action. This enables several objects to use\
    \ the same command logic and enables the command to be built and unit tested.\
    \ A good example of reusing the command logic editing operations, such as Cut,\
    \ Copy, and Paste. Usually, multiple users, such as a menu item, a button, or\
    \ a keyboard shortcut, perform these operations. With commands, each user action\
    \ can bind to the same logic.\n\nCommands also can indicate whether an action\
    \ is available given the current state. You do this by implementing the CanExecute\
    \ method. As the example in the previous paragraph, a cut operation is only available\
    \ when selected. In turn, the UI element can use the result of the method to determine\
    \ if the element should be enabled or disabled. The controls that support commanding\
    \ already support this behavior. Listing 10-15 creates a simple command, which\
    \ makes an artist as a favorite.\n\n> When the result of CanExecute changes, be\
    \ sure to raise the PropertyChanged event with the name of the property for the\
    \ command so the UI will reflect the new state."
