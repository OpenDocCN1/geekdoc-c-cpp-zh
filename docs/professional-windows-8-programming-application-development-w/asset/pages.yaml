    Wrap\"\nText=\"First Name:\" VerticalAlignment=\"Center\" FontSize=\"14\"/>\n\
    <TextBlock Margin=\"0,22,10,22\" Text=\"{Binding FirstName, Mode=TwoWay}\nTextWrapping=\"\
    Wrap\" VerticalAlignment=\"Center\" Grid.Column=\"1\"\nFontSize=\"14\" TextAlignment=\"\
    Center\" Height=\"32\"/>\n<TextBlock HorizontalAlignment=\"Right\" Margin=\"0,20,20,19\"\
    \ Grid.Row=\"1\"\nText=\"Last Name:\" VerticalAlignment=\"Center\" FontSize=\"\
    14\"/>\n<TextBlock Margin=\"0,12,10,22\" Text=\"{Binding LastName, Mode=TwoWay}\n\
    TextWrapping=\"Wrap\" VerticalAlignment=\"Center\" Grid.Column=\"1\"\nFontSize=\"\
    14\" TextAlignment=\"Center\" Height=\"32\"/>\n<TextBlock HorizontalAlignment=\"\
    Right\" Margin=\"0,20,20,19\" Grid.Row=\"2\"\nText=\"Email\" VerticalAlignment=\"\
    Center\"\nFontSize=\"14\"/>\n<TextBlock Margin=\"0,12,10,22\" Text=\"{Binding\
    \ Email, Mode=TwoWay}\nTextWrapping=\"Wrap\" VerticalAlignment=\"Center\" Grid.Column=\"\
    1\"\n=\"14\" TextAlignment=\"Center\" Height=\"32\"/>\n\nWith the simple addition\
    \ of Mode=TwoWay, you have now told the user interface to take any input fields\
    \ and set the property on the Person instance behind. This means that when you\
    \ use the app and make changes, the instance of the Person object you used to\
    \ load the interface automatically reflects the changes. Instead of replacing\
    \ every TextBlock to evaluate the value and create another Person object, you\
    \ can simply use the current DataContext to get an updated version of the Person\
    \ object that reflects any changes. Listing 3-8 shows an updated code-behind file\
    \ containing a Button click handler that handles the current DataContext back\
    \ to a Person object and reads the values of the FirstName, LastName, and Email\
    \ properties, which have automatically updated to reflect any user changes.\n\n\
    # LISTING 3-8: C# TwoWayBinding|Home.xaml.cs\n\n```\nusing TwoWayBinding.Common;\n\
    using TwoWayBinding.Data;\nusing Windows.UI.Xaml;\nusing Windows.UI.Navigation;\n\
    \nnamespace TwoWayBinding\n{\n    /// <summary>\n    /// A basic page that provides\
    \ characteristics common to most applications.\n    /// </summary>\n    public\
    \ sealed partial class Home : LayoutAwarePage\n{\n        public Home()\n    \
    \    {\n            this.InitializeComponent();\n        }\n\n        protected\
    \ override void OnNavigatedTo(NavigationEventArgs e)\n        {\n            base.OnNavigatedTo(e);\n\
    \        }\n    }\n```\n\nwww.it-ebooks.info"
