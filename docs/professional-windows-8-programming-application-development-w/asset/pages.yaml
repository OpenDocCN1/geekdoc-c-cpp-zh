    <TextBox Margin=\"0,22,10,14\" Text=\"Binding FirstName\"\nTextWrapping=\"Wrap\"\
    \ VerticalAlignment=\"Center\" Grid.Column=\"1\"\nFontSize=\"14\"\nTextAlignment=\"\
    Center\" Height=\"32\"/>\n```\n\nNow that TextBox is assigned a property of the\
    \ Person object, you must assign an Person object instance to the user interface\
    \ for the binding to take place. In XAML, every control has a property called\
    \ the DataContext, which can take on any valid object, and all children of the\
    \ control that have an assigned DataContext automatically inherit the data from\
    \ DataContext property. This means you have choices as how to make your binding\
    \ work.\n\nIn the example, the TextBox controls are all sitting in a Grid control,\
    \ so you could set the DataContext of the Grid as an instance of your Person object,\
    \ and all the data binding would work just. It's easy, although you could even\
    \ set the DataContext on each individual TextBox to control of groups binding\
    \ to properties of the same object, although it wouldn't save you much code. Typically,\
    \ if you group the DataContext of the container that holds them. In this case,\
    \ you can go all the way to the top-level control of the Page. This example works\
    \ just fine. In Listing 3-7, you can see that when a user navigates to a page,\
    \ a Load method is called, and the DataContext property of the current Page is\
    \ set to an instance of a Person object. Now when you run the app, you see actual\
    \ data in the TextBox controls, as shown in Figure 3-4.\n\n# LISTING 3-7: Chapter\
    \ 3DataBindingInHome.xaml\n\n```\nusing BasicDataBinding.Data;\nusing Windows.UI.Xaml.Navigation;\n\
    \n// The Basic Page item is documented\nhttp://go.microsoft.com/fwlink/?LinkId=234237\n\
