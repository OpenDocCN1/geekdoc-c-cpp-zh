    # PROVIDING A WISH LIST FEATURE WITH SKYDRIVE


    The goal of this feature is to allow users to create a wish list that is saved
    across all the devices they may have owning the WoxBookStore app installed. In
    this type of the app, you simply allow users to add/remove simple books from the
    wish list. Ultimately you have endless possibilities for implementing such a feature,
    but in this example, you simply add/remove the selected book to a plain text file.
    Because you want this file to be accessible across multiple devices, you can easily
    accomplish this using Microsoft SkyDrive. The available SkyDrive API makes it
    simple for you to upload/download files to the cloud and access them via the SkyDrive
    Windows Store app or browser. SkyDrive is not .NET product by either means The
    SkyDrive API is a REST-based web service that you can access through Java/JavaScript/Objective/CNET
    or any programming language that can make a simple REST-based call. The SkyDrive
    API is based on end users having a Live ID with which they use to log in to SkyDrive.
    For the WoxBookStore app, you use the credentials of the Windows 8 user.


    # Making Files Available Locally


    In addition to using SkyDrive to sync the wish list across multiple devices in
    the cloud, you also want to make the file available locally. For this app, you
    store the wish list in the Documents Library.


    The workflow follows:


    www.it-ebook.info'
