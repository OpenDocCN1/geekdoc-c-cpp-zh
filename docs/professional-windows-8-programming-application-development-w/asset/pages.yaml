  md: 'operating systems work. As a Windows 8 developer, you need to know how to get
    around Windows 8 and how it affects the applications you create and deploy. This
    section covers some of these navigational changes.


    # The Login Screen


    The first thing you notice is that the standard login screen is different from
    previous versions of Windows. The new startup screen offers to enable you to see
    information before logging in. The number of icons and type of information change
    depending on which applications are currently running (if they support this feature).
    For example, if you have the default Mail application running and then lock the
    computer, you can see a Mail icon along with the number of currently unread emails.
    This new feature is not restricted to default Windows Store applications; you
    can also integrate your applications with the startup screen so that a meaningful
    icon reflects data from your app.


    # The Start Screen


    You can quickly see that gestures play a big role in Windows 8 whether you use
    them on a tablet or a PC. To actually get the initial screen and move to the login
    screen, simply click anywhere on the screen. Once you are logged in with the new
    Start screen. You can notice that:


    +   The new Start screen is essentially a full-blown replacement for the traditional
    Windows Start menu.


    +   Tiles applications, which are written using WinRT and Windows 8, as well as
    traditional Windows 7 or earlier-based desktop applications.


    +   Windows Store applications are presented as live tiles that can change dynamically.


    +   Desktop applications are small static tiles with the name of the applications
    and an icon to represent them.


    +   Any installed desktop or Windows 8-based application has an icon added to
    the Start screen.


    This means that when you develop apps for Windows 8, you must carefully consider
    how your app appears on this screen. You must ensure that you use a solid-looking
    icon and live tiles to give the information about the app. In traditional Windows
    development, you simply ensured your application appeared on the Start menu—and
    if you packaged your application correctly, it most likely not a problem. You
    certainly didn''t spend a time worrying about how your application looked on the
    Start menu. With Windows 8 you need to pay attention to these details because
    you want your application to stand out on this screen.


    Users can easily customize the Start menu by dragging and dropping tiles into
    the various groups. The user can also remove tiles by right-clicking a tile to
    select it, and then choosing Unpin from the new App Bar appears at the bottom
    of the screen. Figure 1-4 shows the App Bar along with some options for managing
    the selected tiles.'
