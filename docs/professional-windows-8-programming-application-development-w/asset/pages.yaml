  md: "The rest of this chapter explores each the sensors beginning with the Accelerometer\
    \ class.\n\n# USING THE 3-D ACCELEROMETER\n\nAn accelerometer is a device to measure\
    \ acceleration forces. Windows automatically uses the accelerometer to adjust\
    \ the screen orientation as the user rotates the device.\n\nAs mentioned previously,\
    \ the Windows Certification Program requires an accelerometer, and that accelerometer\
    \ provides measurements of acceleration forces across three axes, and the data\
    \ rate of the accelerometer be >= 50 Hz.\n\nAs you can see the diagram shown in\
    \ Figure 7-2, the Accelerometer class provides two events anyway your app respond\
    \ to changes in acceleration forces.\n\nReadingChanged occurs each time the accelerometer\
    \ has a new reading containing values for g-force acceleration along the x, y,\
    \ and z axes. Shaken occurs each time the PC has shaken. To see this in action,\
    \ follow the steps:\n\n+   1. Open Visual Studio 2012, and create a new project\
    \ using the Blank App (XAML) project template.\n\n+   2. Open the MainPage.xaml\
    \ file, and edit the TextBlock as defined in the code that follows to the Grid\
    \ element within the page.\n\n```\n<Grid Background=\"StaticResource ApplicationPageBackgroundThemeBrush\"\
    >\n<TextBlock x:Name=\"AccelerometerReadingTextBlock\"\n=\"48\"\nVerticalAlignment=\"\
    Center\"\nHorizontalAlignment=\"Center\"/>\n</Grid>\n```\n\n+   3. With the page\
    \ defined in XAML, turn attention to the code in the MainPage .xaml.cs file. Start\
    \ by adding the using directive for the Windows.Devices.Sensors namespace and\
    \ add a field to the class type Accelerometer naming the field accelerometer.\n\
    \n```\npublic sealed partial class MainPage : Page\n{\n    private Accelerometer\
    \ accelerometer;\n}\n\n```\n\n+   4. Initialize the accelerometer in the class\
    \ constructor and ensure that an instance of the Accelerometer is returned. If\
    \ the PC upon which you test this code doesn't have an integrated accelerometer\
    \ and appropriate device drivers installed, GetDefault, of course, returns null.\
    \ If the GetDefault method returns null, at least you have an excellent excuse\
    \ for a new tablet or convertible PC with Windows 8 Pro or Windows RT!"
