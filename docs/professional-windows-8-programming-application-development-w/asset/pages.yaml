  md: "Listing 10-3 shows a simple locator, where a single ViewModel is exposed as\
    \ a singleton using the following helper class.\n\n> NOTE A singleton is a class\
    \ that enables only a single instance to be created. This instance is returned\
    \ when subsequent requests for the class occur.\n\n# LISTING 10-3: Singleton.cs\n\
    \n```\nusing System;\nusing System.Collections.Generic;\nusing System.Linq;\n\
    using System.Text;\nusing System.Threading.Tasks;\n\nnamespace ArtistBrowser.Common\n\
    {\n    public sealed class Singleton<T> where T : new()\n    {\n        private\
    \ Singleton()\n        {\n        }\n        public static T Instance\n      \
    \  {\n            get\n            {\n                return LazyInitializer.Instance;\n\
    \            }\n        }\n        private class LazyInitializer\n        {\n\
    \            static LazyInitializer()\n            {\n            }\n        \
    \    internal static readonly T Instance = new T();\n    }\n}\n```\n\n# REFACTORING\
    \ THE ARTIST BROWSER\n\nChapter 1, “A Glimpse into the Future,” built a small\
    \ app that shows musicians grouped by genres using a Visual Studio template. Although\
    \ the template has some aspects of MVVM, this chapter refactors it using additional\
    \ techniques. We will use a locator to bind the main page's ViewModel, change\
    \ the bindings to the ViewModels, and clean up the models."
