    # XAML BASICS


    Controls in XAML have several common concepts and properties across most of them.
    For, just like the ID tag in HTML elements or ASP.NET server controls, XAML provides
    a way to reference control using the syntax x:Name. If you were to have a control
    responsible for displaying a phone number, you could use syntax similar to the
    following:


    ```

    <TextBlock x:Name="PhoneNumber" />

    ```


    The Name attribute is available for all XAML controls but not required. If you
    do not need to access the control from code, as is common with controls that are
    only responsible for layout, you can simply omit the Name from the control declaration.


