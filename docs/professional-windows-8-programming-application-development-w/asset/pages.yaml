  md: 'with string data, you can actually extract the instance of the object that
    you selected and access any of the properties you require. Now look at some XAML
    code for a ComboBox that uses data binding instead of hard-coded ComboBox controls.
    Figure 3-5 shows a basic data entry form along with a ComboBox control for selecting
    an Account object.


    ![](img/2cea804c0281668ba7d119c3e0ce780e_132_0.png)


    FIGURE 3-5


    The purpose of this user interface is to allow the user to select a Person object
    from the ComboBox and populate the data entry form to the right. Using Two-way
    data binding forces any changes made to the fields in the Text controls to propagate
    to the selected instance. The following code shows the XAML required for this
    data entry form:


    ```

    <ComboBox xName="AccountList" SelectionChanged="AccountList_SelectionChanged"
    HorizontalAlignment="Left" Margin="73,49,0,0"

    Grid.Row="1"

    VerticalAlignment="Top" MinWidth="200" DisplayMemberPath="FullName" />

    <Grid xName="SelectionGrid" HorizontalAlignment="Left" Margin="332,49,0,0"

    Grid.Row="1" VerticalAlignment="Top">

    <TextBlock HorizontalAlignment="Left" Margin="10,10,0,0"

    Wrapping="Wrap" Text="First Name: VerticalAlignment="Top"

    FontSize="19"/>

    <TextBlock HorizontalAlignment="Left" Margin="10,121,0,0"

    Wrapping="Wrap" Text="Email: VerticalAlignment="Top"

    FontSize="16"/>

    <TextBlock HorizontalAlignment="Left" Margin="10,66,0,0"

    Wrapping="Wrap" Text="Last Name: VerticalAlignment="Top"

    FontSize="16"/>

    <TextBlock Text={Binding FirstName, Mode=TwoWay}

    HorizontalAlignment="Left" Margin="166,10,0,0" TextWrapping="Wrap"

    VerticalAlignment="Top"/>/>

    ```'
