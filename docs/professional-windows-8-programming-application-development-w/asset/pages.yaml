  md: "# PointingDataContext to the MainViewModel\n\nBecause you have set a ViewLocator\
    \ instance in App.xaml, you must ensure that the DataContext for the entire page\
    \ points to your MainViewModel. You do this at the top of the page with the following\
    \ code:\n\n```\n<local:LayoutPage\n x:Name=\"WroxBookStore.GroupedBooks\"\nxmlns=\"\
    http://schemas.microsoft.com/winfx/2006/xaml\"\nxmlns:local=\"http://schemas.microsoft.com/winfx/2006/xaml\"\
    \nxmlns:common=\"using:WroxBookStore.Common\"\nxmlns:d=\"http://schemas.microsoft.com/expression/markup-compatibility/2006\"\
    \nxmlns:i=\"http://schemas.microsoft.com/expression/2010/interactivity\"\nxmlns:mvm=\"\
    using:GalaSoft.Mvvm\"\n mc:Ignorable=\"d\" Binding=Main, Source={StaticResource\
    \ Locator}>\n```\n\nNote that the Binding is set to Main, which you will see in\
    \ the ViewLocator.cs file, and the Source is just Locator, which is the key that\
    \ was used in the name of the view returned. Also, the Source is used in the App.xaml.\
    \ At this point you can bind any property or command that exists in the MainViewModel\
    \ class.\n\n# Setting Up the CollectionViewSource\n\nThe next thing to take on\
    \ is setting up the CollectionViewSource defined in the page. You want to ensure\
    \ that it uses your GroupedCollectionView property and that for each object in\
    \ that property, individual book list is extracted from the BookList property.\
    \ The following code in Page.Resources takes care of this:\n\n```\n<CollectionViewSource\n\
    \ Source=\"{Binding GroupedCollectionView}\"\n ItemsPath=\"BookList\"\n IsSourceGroup=\"\
    true\" />\n```\n\n# Setting the Page Attributes\n\nAfter setting the CollectionViewSource\
    \ you can turn your attention to a simple fix, which sets the name you want displayed\
    \ at the top of the page. Because the title is bound to a StaticResource called\
    \ AppName, you can change that String to \"Wrox Book Store\" in the following\
    \ code:\n\n```\n<x:String x:Key=\"AppName\">Wrox Book Browser</x:String>\n```\n\
    \nThe GridView and ListView require a few modifications. By default, they set\
    \ to use an ItemTemplate and ListViewTemplate that looks for properties, which\
    \ in your case do not exist in the Wrox Book class. To get this to work, you can\
    \ swap these properties for relevant to your app. For example, in the GridView.GroupStyle,\
    \ the code for the HeaderTemplate has a StackPanel with two TextBlock controls.\
    \ The first control is set to display the group name, and in this case the bound\
    \ Grouped class has a Group property containing that information. The following\
    \ code ensures the binding is correct for this custom."
  merge: -1
  pgno: 437
- img_proc: true
  md: "# Creating the Home Page | 405\n\n```\n<StackPanel Orientation=\"Horizontal\"\
    >\n  <TextBlock Text=\"Binding Group\" Margin=\"3,-7,10,10\"\n    Style=\"StaticResource\
    \ GroupHeaderTextStyle\" />\n  <TextBlock Text=\"StaticResource ChevronGlyph\"\
    \ FontFamily=\"Segoe UI Symbol\"\n    Margin=\"0,-7,0,10\" Style=\"StaticResource\
    \ GroupHeaderTextStyle\" />\n</StackPanel>\n```\n\nAlso the Group.HeaderTemplate\
    \ has a declaration for a Button control that's bound to a command called SelectGroupCommand.\
    \ Notice, however that every Binding syntax points out both the MainViewModel\
    \ and the Locator as the Source. This is required because the Grid has its ItemProperty\
    \ bound to the CollectionSource. When binding is complete, the individual headers\
    \ no longer have access to the MainViewModel instance — only the actual grouped\
    \ objects. Luckily, MVVM and data binding is flexible; at any time, you can set\
    \ the DataContext of an individual control to something else and overrides the\
    \ current value. You can even do down to the property. In this example, you still\
    \ want the ButtonContext bound to the CollectionSource, but you want the command\
    \ bound to something else. The following code takes care of this using:\n\n```\n\
    <Button Command=\"Binding Main.SelectGroupCommand,\nSource={StaticResource Locator}\"\
    \nCommandParameter=\"Binding AutomationProperties.Name=Group Title\"\nStyle=\"\
    StaticResource PrimaryButtonStyle}\" />\n```\n\nAt this point, there is no SelectGroup\
    \ command in the MainViewModel class which is fine, as you are in a see of this\
    \ command is to let you know you have selected a specific group to drill down\
    \ into. Then you can send a message to the user interface that it should navigate\
    \ to the GroupDetailPage.\n\nAnother important detail to notice that the Grid\
    \ is bound to a property on the MainViewModel class called SelectedBook. This\
    \ is important for a few reasons:\n\n+   - You need a variable that can hold onto\
    \ the selected object.\n- You need to know when a user has actually selected a\
    \ book so that you can redirect to the BookDetailPage.\n\nBecause there is no\
    \ command on the GridView, you can't simply bind to a command in the MainViewModel\
    \ class like you did with the Button. You must add your logic in the setter of\
    \ the SelectedBook property. The other alternative is to add this logic to the\
    \ code behind, but because you use MVVM, the binding to selection is perfectly\
    \ valid.\n\nIn addition to setting the SelectedItem property, you may also have\
    \ noticed that the Loaded event is set to an event handler in the code. By default,\
    \ when you bind to a CollectionItemsSource as the page loads, the first item in\
    \ it is automatically selected. The only time you can order this initial selection\
    \ is when the user is presented with a list of grouped books without a selection\
    \ made. Another reason to prevent this behavior is if you allow the default selection,\
    \ the SelectedItem property is set, and your setter logic in the MainViewModel\
    \ fires the app to redirect to the BookDetailPage before the user even has a chance\
    \ to select a selection, and you certainly don't want that happen.\n\nwww-e-books.info"
  merge: -1
  pgno: 438
- img_proc: true
  md: "# Modifying the Default ItemTemplate\n\nThe last thing you need to do in XAML\
    \ is to modify the default ItemTemplate used. Because you use WroxBook objects,\
    \ the default template won't work for you. As you can see, the ItemTemplate property\
    \ of the GridView is set to Standard20x20x50ItemTemplate. You can find this by\
    \ searching DefaultStyles.xaml file. After you, replace the code for the template\
    \ to the following:\n\n```\n<DataTemplate x:Key\">\n  <Grid HorizontalAlignment=\"\
    Left\" Width=\"250\" Height=\"250\">\n    <Border Backgrounds=\"StaticResource\
    \ ThemeBrush\">\n      <ListViewItemPlaceholder BackgroundThemeBrush>\n      \
    \  <Image Source=\"{Binding Thumbnail}\" Stretch=\"UniformToFill\"/>\n      </ListViewItemPlaceholder>\n\
    \      <StackPanel VerticalAlignment=\"Bottom\" Background=\"StaticResource ThemeBrush\"\
    >\n        <TextBlock Text=\"{Binding Title}\" Foreground=\"StaticResource TitleTextStyle\"\
    \ Style=\"StaticResource TitleTextStyle\" Height=\"60\" Margin=\"15,0,15,10\"\
    />\n        <TextBlock Text=\"{Binding Author}\" Foreground=\"StaticResource SecondaryThemeBrush\"\
    \ Style=\"StaticResource CaptionTextStyle\" Wrapping=\"NoWrap\" Margin=\"15,0,15,10\"\
    />\n      </StackPanel>\n    </Border>\n  </Grid>\n</DataTemplate>\n```\n\nNothing\
    \ is complicated here— just ensuring that the Image control is bound to the Thumbnail\
    \ property and the Title and Author properties are used instead of the defaults.\n\
    \n# Updating the ViewModel\n\nNow that the XAML for the home page is complete,\
    \ you must make some additions to the view model. Looking at the XAML, you know\
    \ some properties to handle the selected group and selected book. You also need\
    \ a command that selects the group and some setter logic that helps navigate to\
    \ the page when a user selects a book. First take the book to far. Open the MainViewModel.cs\
    \ file and add the following code:\n\n```\nusing GalaSoft.Mvvm.Messaging;\n\n\
    private GroupedBookList _selectedGroup = null;\npublic GroupedBookList SelectedGroup\n\
    {\n    get { return _selectedGroup; }\n    set\n    {\n        _selectedGroup\
    \ = value;\n        RaisePropertyChanged(\"SelectedGroup\");\n    }\n}\n\nprivate\
    \ WroxBook _selectedBook = null;\npublic WroxBook SelectedBook\n```"
