    # DESIGNING THE WX BOOKSTORE APP


    Before starting any Windows 8 project, it is best you determine what you want
    to

    accomplish. So far in this book, you have been introduced to many new concepts
    and techniques

    that are different from traditional Windows desktop application. That said, you
    need

    to think a bit outside the box with apps for Windows 8; because some of the things
    you are used

    to be doing in the desktop world might not be the best for full-immersion Windows
    Store apps

    that can potentially be deployed to both PCs and tablets. In many cases you also
    want to factor in a

    Windows Phone version of your user interface so you can run your app on all the
    available

    platforms. The first thing to remember is that the app needs to focus on content
    over everything

    else. Don''t worry about toolbars, menus, or any other chrome when creating the
    initial design. If

    y find a large number of commands to manage the content displayed, you probably

    not have a great candidate for a Windows Store app. In this chapter, you build
    a book browsing

    app that can:


    +   * Display the most recently available books

    * Display all programming books according to various categories

    * Provide users with the ability to filter/search for specific books

    * Get additional information about a particular book

    * Allow users to purchase the book directly from the Wrox website via a link in
    the app

    * Save a wish list of books and access that from any Windows 8 device


    # Displaying Wrox Press Books


