    # App Summary


    You know how the trial conversion and purchasing experience works in the app,
    and you can now dive into the implementation. You can look at three scenarios:
    supporting trials, in-app purchases, and ads.


    # Supporting Trials


    When you publish your app in the Windows Store, you can specify if your app supports
    trials. In your app you want to detect whether your app is in trial mode to lock
    or unlock features, or to detect any license changes for time-limited trial.


    You can show license information to the user, when the user invokes the Settings
    charm, for example in a License or About floats, somewhere on the application
    canvas. You can also enable or disable some functionality in your app depending
    on the state of the license.


    Throughout this chapter conversion and purchasing the app are synonymous events.
    When the app is purchased, its application license IsTrial property is set to
    false.


    > NOTE Typical trial conversion rate is 10 percent but may vary depending on the
    nature and quality of your app.


    # Initializing Your App


    In your App.xml.cs you need to add a call to load trial license information and
    an event handler to support the settings to display your license information.
    A good place to add this to event handler is the OnLaunched event.


    You keep your product and licensing data in the application-level properties AppLicenseData
    and ProductLicenseData. In the example you refer to these properties when you
    implement your trial conversion and in-app purchase experience, as shown in Listing
    11-1 for App.xml.cs file.'
