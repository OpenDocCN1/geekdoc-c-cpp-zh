    After the default code generated from the Visual Studio template is to change
    what you want, it''s not quite what you need. The previous code makes a few important
    modifications. First, just as you did with the home page of the app, you set up
    the ancestor Context of the page to the MainViewModel. You declared an instance
    of AppBar along with a few commands. In the following code, two Button controls
    in the AppBar handle filtering and sorting the lists that display as part of the
    selected group.


    ```

    <Page.BottomAppBar>

    <AppBar>

    <Grid>

    <GridColumnDefinitions>

    <ColumnDefinition Width="*" />

    <ColumnDefinition Width="*" />

    </GridColumnDefinitions>

    <StackPanel Orientation="Horizontal" Grid.Column="1"

    Alignment="Right">

    <Button x:Name="FilterBooks" Style="{StaticResource

    FilterAppBarButtonStyle" Command="{Binding FilterListCommand}"/>

    <Button x:Name="SortBooks" Margin="20,0,0,0"

    Command="{Binding SortListCommand}"/>

    </StackPanel>

    </Grid>

    </AppBar>

    </Page.BottomAppBar>

    ```


    In both cases you bind the command to a RelayCommand that needs to be implemented
    in the MainViewModel. Next, you need to slightly modify the CollectionSource so
    that it points to the list of books belonging to the SelectedGroup property of
    the view model. The following code care of this:


    ```

    <Page.Resources>

    <!-- Collection of items displayed by this page -->

    <CollectionSource

    xName="ItemsSource"

    Source="{Binding SelectedGroup.FilteredListBox}" />

