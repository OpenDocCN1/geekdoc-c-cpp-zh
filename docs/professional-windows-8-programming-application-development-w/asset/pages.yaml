  md: '# Application Life Cycle


    Another thing about Windows 8 is how the life cycle of applications differs from
    traditional desktop applications. For example, in a traditional desktop app, you
    Minimize, Maximize, and Close icons at the top-right corner of the window. With
    Windows Store apps you won''t have those options. As you will learn later in the
    book in Chapter 5, "Application Life Cycle," Windows Store apps follow a life
    cycle similar to apps on the Windows Phone platform. They don''t typically close
    but are suspended until you need them again. If, however, you want to close an
    application, you have several options:


    +   > You can bring up the Task Manager and simply kill the application. This
    is the same as you would in any previous version of Windows (see Figure 1-7).


    +   > If all else fails, on a PC, you always have the Alt+F4 keyboard shortcut.
    This forces the currently open Windows Store app to close. On a PC, keyboard shortcuts
    are the easiest way to access features developed in Windows 8. Although all the
    gestures developed with Windows 8 touch interfaces in, they all have equivalent
    mouse operations, but the keyboard is the fastest way for Windows 8 to access
    features.


    ![](img/2cea804c0281668ba7d119c3e0ce780e_40_0.png)


    FIGURE 1-7


    # Accessing Desktop Mode


    While developing apps and using Visual Studio, you''re primarily in desktop mode.
    You need to become familiar with several mouse gestures to navigate the desktop
    mode quickly and efficiently. In desktop mode, moving the mouse to the corners
    of the screen brings you various Windows 8 feature allowing you to:


    +   > View currently running Windows Store applications: In desktop mode traditional
    Windows applications that are currently running in the taskbar as they have with
    previous versions of Windows. However, Windows Store apps do not appear here.
    To view and switch between available Windows Store apps, you can move the mouse
    to the top left of any connected display to see the next app that you can run.'
