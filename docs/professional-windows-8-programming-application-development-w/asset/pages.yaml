    \  }\n});\n);\n```\n\n# # In-App Purchases\n\nThe in-app purchase model offers\
    \ the most flexibility for developers. With trials users can either choose the\
    \ app or keep it as a trial. With in-app purchases you can offer products or features\
    \ from your app. Before you implement an in-app purchase, think about your business\
    \ model:\n\n+   - **Individual features**: Are there any features you want to\
    \ sell separately in your app?\n- **Product expiration**: Will your products be\
    \ a one-time purchase, or do you want them to expire so users can renew?\n- **Think\
    \ about the competition**: Do they offer the same free features of charge?\n\n\
    From the API perspective, the in-app purchase model adds another tier for the\
    \ store associated with your app: Products. You can add as many products as you\
    \ want to any of your apps; after you add them to the production store, you cannot\
    \ delete them, so it's a good idea to play with the CurrentAppSimulator and XML\
    \ licenses.\n\n# # Product Data Model\n\nJust like we with the license data model,\
