  md: 'Investing how your app looks in the Store and search results is important:
    The app background


    With contracts and charms, Windows 8 offers a unique opportunity to you as, doesn''t
    exist on other platforms. Investing in adding contracts to your app helps your
    discoverability and user experience.


    # Making the First Good Impression


    Before users install your app, they look at your app''s listing. This first impression
    is often based on your app''s listing page, which includes screenshots, app description,
    a logo, and reviews. The following are things you can do to optimize your first
    impression:


    +   Naming your app is a key decision every developer makes. The Windows Store
    enables to reserve a 256-character name of your app as the first step in the submission
    process. You can also reserve names in other languages in addition to your primary
    app name. Tip: be creative; make your app stand out


    +   Consider the Store that displays your app in the listing page and search results.
    These are important to the discoverability of your app. Tip: minimize graphical
    detail; the size of this image is small (50x50 pixels at 100 percent resolution)
    and seeing detailed graphics and text may be hard.


    +   At least one screenshot is required. Your app can have up to eight. Each screenshot
    must be .png file 136x768 pixels in landscape or portrait. Tip: Use screenshots
    to highlight the most important features of your app. The first screenshot makes
    the best impression, it''s important to follow Windows Store policies regarding
    screenshots. They must be actual screenshots of the running app, without major
    enhancements.


    +   Promotional images are used when your app is featured in the Windows Store.
    These come in several sizes, and you must include them if you want your app to
    be considered for feature promotions. Tip: while promotional images are optional,
    recommend submitting them to be considered for promotional featuring in large
    sizes (414x180, 414x468, 558x756, 846x468 pixels). Spend some time on them, or
    hire a graphics to create an attractive promotion.


    +   Consider your use of Logo, Small Logo, and Splash Screen: These are important
    when your app is installed and launched.


    +   A description of your app is located right next to your app''s description
    in the detailed store listing. The current limit is 10,000 characters, the first
    paragraph of the description is what people coming to your app store page will
    read first. Try to capture their attention.


    +   Features of your app are placed in a separate description section of your
    Windows Store app listing. You can list up to 20 features in 200 characters or
    less.'
