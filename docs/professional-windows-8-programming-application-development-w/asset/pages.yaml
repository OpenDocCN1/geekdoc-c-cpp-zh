    \ same as in those environments with different controls.\n\n# CheckBox\n\nAnother\
    \ user interface that you will not make use of is the CheckBox. The CheckBox control\
    \ (like Button) has a Content property that you can use to describe it. By default\
    \ the CheckBox supports your typical checked and unchecked states. You can also\
    \ set the CheckBox, however, to behave in three states: Checked, Unchecked, and\
    \ Indeterminate. This is sometimes useful when you want to force the user to make\
    \ a selection instead of defaulting to unchecked. Declaring a CheckBox that uses\
    \ all three states looks like the following XAML code:\n\n```\n<CheckBox x:Name=\"\
    MainCheck\" Content=\"Checkbox\"\nChecked=\"MainCheck_Checked\"\nUnchecked=\"\
    MainCheck_Unchecked\" IsThreeState=\"True\"/>\n```\n\nIn this detail, notice that\
    \ you have set the IsThreeState attribute to allow for all three states to be\
    \ checked. You also declare three event handlers to handle all three state changes.\
    \ The CheckBox fires Checked, Unchecked, and Indeterminate events depending on\
    \ the state of the control. The following code shows how three event handlers\
    \ updating a TextBlock control with the result of:\n\n```\nprivate void MainCheck_Checked(object\
    \ sender, EventArgs e)\n{\n    CheckState.Text = \"Checkbox State: Checked\";\n\
    ```\n\nwww.it-ebooks.info"
