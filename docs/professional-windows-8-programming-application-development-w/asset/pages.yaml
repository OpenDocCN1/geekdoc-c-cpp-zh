  md: '# Lock Screen


    Apps that provide social media, communication, scheduling, and so likely should
    support the lock screen and add background tasks to provide updates if users aren''t
    actively using their device. Presumably, when you pin an app to the lock screen,
    they feel it is important to them to stay up to date. To be notified if an app
    is pinned or unpinned from the lock screen, register for LockScreenAdded or LockScreenRemoved
    triggers provided by SystemTrigger. An can also programmatically add itself to
    the lock screen by RequestAccessAsync in the BackgroundExecutionManager class.


    Specific types of triggers are restricted only to apps on the lock screen. If
    an app is not on the lock screen and a restricted trigger is used, the background
    task will not trigger. Table 5-6 shows the triggers that require the app to be
    on the lock screen.


    TABLE 5-6: Trigger Types


    | TRIGGER TYPE | LOCK SCREEN REQUIRED |

    |--- |--- |

    | TimeTrigger | Yes |

    | PushNotificationTrigger | Yes |

    | ControlChannelTrigger | Yes |

    | SystemTrigger | No |

    | MaintenanceTrigger | No |


    # Progress Reporting


    When the app is running in the foreground at a background task triggers, it may
    optionally report progress to the app, which can be to display the UI or a progress
    bar while the task runs.


    When the Run method is called, it is given an IBackgroundTaskInstance that can
    communicate to the foreground app by setting the Progress property, as shown in
    Listing 5-9. To receive the progress updates, the app must register the Progress
    event, as shown in Listing 5-10. This listing registers the Completed event, which
    enables the app to refresh the UI when the task finishes.


