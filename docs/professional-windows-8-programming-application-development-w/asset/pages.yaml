  md: '# # Debugging


    Visual Studio provides a way to trigger background tasks. Just put a breakpoint
    in the Run method and trigger the background task using the suspend drop-down
    menu on the Debug Location toolbar, as shown in Figure 5-9. It shows the names
    of the background tasks that can be triggered by Visual Studio.


    ![](img/2cea804c0281668ba7d119c3e0ce780e_211_0.png)


    FIGURE 5-9


    If the background task does not activate properly a set up manifest, correctly
    registered code, and meeting the lock screen requirements, you can enable debug
    tracing to allow further debugging. To enable debug tracing, use the following
    steps:


    +   1. In event viewer, navigate to Application and Services Logs Microsoft BackgroundTaskInfrastructure.


    +   2. On the actions pane, select View Show Analytic and Debug Logs.


    +   3. Select the Diagnostic log and click Enable Log.


    +   4. Try to activate the background tasks again and review the logs for detailed
    error information, as shown in Figure 5-10.'
