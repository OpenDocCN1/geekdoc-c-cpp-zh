  md: "# Working with Local Files\n\nYou can use local files when you need to save\
    \ large amounts of data, binary data, or data with a more complex data structure.\
    \ You can simply use `ApplicationData.Current.LocalFolder` as the location to\
    \ local files, and use `FileIO` methods to write and read files.\n\nRemember that\
    \ your files may grow large and many API methods have been rewritten to support\
    \ asynchronous model, you may need to use `async` and `await` keywords for your\
    \ C# code, or `promises` in JavaScript to keep your user experience fast and fluid.\
    \ Most file-related operations are explicitly asynchronous.\n\nYou use format-specific\
    \ ways of writing and reading methods to write text, bytes, and buffer data. In\
    \ the snippet `WriteTextAsync` shows how to write current data and time as a text:\n\
    \n```\nvar localFolder = ApplicationData.Current.LocalFolder;\nStorageFile sample\
    \ = await localFolder.CreateFileAsync(\"file.txt\",\nCreationCollisionOption.OpenExists);\n\
    await FileIO.WriteTextAsync(sample, String.Format(\"{{0}\",DateTime.Now));\n```\n\
    \nTo read a local file, use `FileIO.ReadTextAsync` for text files or methods that\
    \ can read binary files. The snippet that shows how to read a file from the `LocalFolder`:\n\
    \n```\nvar localFolder = ApplicationData.Current.LocalFolder;\n\nstring result\
    \ = null;\n\ntry{\n    StorageFile file = await localFolder.GetFileAsync(\"file.txt\"\
    );\n    result = await FileIO.ReadTextAsync(file);\n} catch (FileNotFoundException)\n\
    {\n    // handle errors\n}\n```\n\n# Roaming Settings and Application Data\n\n\
    You may have several devices running Windows. Actually, when you buy a new device,\
    \ and as soon as you log onto the new device with your Microsoft account, you\
    \ will see that apps use roaming data automatically applied your favorite themes,\
    \ colors, and wanted settings in the apps. It works like magic!\n\nThis happens\
    \ because of Windows' roaming store: Roaming provides a great user experience\
    \ when users have more than one device. So as a change is made to the roaming\
    \ store, Windows does all the heavy lifting to synchronize data between devices.\n\
    \nFortunately, using a roaming store is also easy from the developer's perspective,\
    \ and almost no different than using local settings and data! Most importantly,\
    \ you need to observe these simple considerations when using a roaming store from\
    \ your app:"
  merge: -1
  pgno: 223
- img_proc: true
  md: "+   - Do roam settings, customization data, and small data sets. This may include\
    \ user preferences and settings.\n\n+   - Do roam application state, navigation,\
    \ and properties. These help users begin a task on one device and continue on\
    \ another. This may include user navigation stack, bookmarks in a book reader\
    \ app, and so on.\n\n+   - Do not roam data that changes frequently or may cause\
    \ synchronization conflicts. It is recommended to roam only slowly changing data.\
    \ You can always use dedicated data stores in the cloud for rapidly changing data.\n\
    \n> NOTE Instead of using a roaming data store for large sets of data, use dedicated\
    \ cloud services, as Windows SkyDrive to exchange large amounts of data. The Leaderboard\
    \ example at the end of this chapter for online storage on Azure. A roaming store\
    \ is intended for light-weight settings and small objects. You can always check\
    \ the roaming storage quota by inspecting ApplicationData.RoamingStorageQuota.\n\
    \nRemember that apps can benefit from roaming if the user signed in with the Microsoft\
    \ account and the device is triggered by them. Roaming is not first; before deciding\
    \ on roaming data, Windows considers multiple factors, including RoamingStorageQuota.\
    \ Also, opened files cannot be ro, and it's a good idea to close files that you\
    \ no longer need.\n\nWhen roaming changes can you handle the DataChanged event?\n\
    \n```\nApplicationData.CurrentDataChanged += Application_DataChanged;\n```\n\n\
    Because data may change on a different thread, use the Dispatcher object to notify\
    \ the user or the user interface of changes in the data. The snippet that follows\
    \ a Dispatcher in the event handler for DataChanged event:\n\n```\nasync void\
    \ Application_DataChanged(ApplicationDataChanged sender, object objects)\n{\n\
    \    // Use Dispatcher, this may happen on a different thread\n    await this.Dispatcher.RunAsync(CoreDispatcherPriority.Normal,\
    \ () => {\n        DisplayResult(\"Data has changed!\", null);\n    });\n}\n```\n\
    \n# Setting High Priority for Roaming Data\n\nAs before, you use roaming for slowly\
    \ changing data sets. You can recommend Windows to faster roaming for small sets\
    \ of data by incrementing a HighPriority counter. Although there is no guarantee\
    \ that this data will be available immediately, it still increases the likelihood\
    \ of faster data transition to other devices. The snippet that follows how to\
    \ use HighPriority counter:\n\n```\nint counter = Convert.ToInt32(roamingSettings.Values[\"\
    HighPriority\"]);\\nroamingSettings.Values[\"HighPriority\"] = counter + 1;\n\
    ```"
