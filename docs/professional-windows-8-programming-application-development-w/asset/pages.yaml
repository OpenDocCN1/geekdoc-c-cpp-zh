    font. All XAML controls have similar properties that you can adjust to affect
    elements to all controls, such as alignments, fonts, size, and so on. You can
    see more in Chapter 2, "What is XAML," which covers XAML and the available controls.


    # Setting App Capabilities


    The last thing you must do before running the application is ensure you set up
    any device capabilities that your app requires. In Windows Store, apps don''t
    have the abilities you''ve taken for granted with other forms of Windows Development.
    For example, you can simply make API calls to download information from the Internet
    without first declaring that your app requires this functionality.'
