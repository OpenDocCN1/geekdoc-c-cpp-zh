  md: '# 7


    # Sensors


    WHAT''S IN THIS CHAPTER?


    +   - Introducing the Windows Sensor Platform

    - Implementing the 3-D accelerometer

    - Implementing the 3-D compass

    - Implementing the 3-D gyroscope

    - Implementing the 3-D inclinometer

    - Implementing the ambient light sensor

    - Implementing the orientation sensors


    WROX.COM CODE DOWNLOAD FOR THIS CHAPTER


    You can find the wrox.com code downloads for this chapter in code file 205709
    C07.zip at www.wrox.com/remtile.cgi7ibnn=978118205709. The code for this chapter
    is conveniently contained within a single Visual Studio 2012 solution with seven
    sample projects.


    Our devices change every year, adding new capabilities, becoming thinner, lighter,
    and are also becoming "smarter" with sensors. There are thousands of practical
    scenarios, as well as real-life experiences, how sensors impact computing experiences
    every day. This chapter navigates the developer through a wealth of new APIs and
    features available within Windows 8 that enable your apps to become "smarter"
    with sensors.


    # SENSORS WINDOW PLATFORM


    As humans, we are equipped with biological sensors needed to perceive changes
    in the real world. The devices mankind has developed are just starting to catch
    up with biological sensors. In the last few years, the industry has experienced
    an enormous growth in sensor'
  merge: -1
  pgno: 262
- img_proc: true
  md: 'technology, giving devices the ability to sense touch, orientation, position
    changes and proximity, with more sensors being developed every day!


    With the Windows Sensor Platform your apps are able to become “smarter”, reacting
    to changes in acceleration, orientation, and ambient light levels. Given the vast
    range of devices upon which your apps will run the sensor platform abstractions
    for the various sensors.


    # Hardware for the Sensor Platform


    When designing the Windows Runtime, the architects and developers at Microsoft
    built a run-time as re-imagined with the Windows 8 operating system. As with the
    core operating system, the run-time embraced several disruptions, or strategic
    inflection points.


    +   - The expanded hardware ecosystem: Windows 8 Pros run on Intel x86 and x64
    processors, with the Intel Core i3, Core i5, and Core i7 processors. However,
    Windows RT devices, as Microsoft Surface, ARM-based processors from manufacturers,
    such as NVIDIA, Qualcomm, and Texas Instruments.


    +   - Windows 8 Pro and Windows RT-based devices also embrace System-on-a-Chip
    (SoC) architectures. SoC architectures have numerous benefits to hardware designers
    that ultimately provide more responsive experiences to users and increased battery
    life.


    +   - Windows embeds mobility like never before. Mobile systems are increasingly
    providing sensors that enable exciting new scenarios for application developers.


    # Windows Sensor Platform Overview


    With Windows 8 Pro and Windows RT, the Windows Sensor Platform provides developers
    with access to multiple sensors, through a unified set of APIs. Within this chapter
    you will learn how to use Windows Sensors APIs and the sensor types, shown in
    Table 7-1, for the Windows.Devices.Sensors namespace:


    Table 7-1: Some Classes from the Windows.Devices.Sensors Namespace


    | CLASS | DESCRIPTION |

    |---|---|n| Accelerometer | 3-D accelerometer sensor |

    | Compass | 3-D compass sensor |

    | Gyrometer | 3-D gyroscope sensor |

    | Inclinometer | 3-D inclinometer sensor |

    | LightSensor | 3-D ambient-light sensor |

    | OrientationSensor | Represents an orientation sensor |

    | SimpleOrientationSensor | Represents a simple orientation sensor |'
