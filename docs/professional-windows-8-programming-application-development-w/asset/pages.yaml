  md: "# 4. Add a RelayCommand for when group is selected. All you need to do is send\
    \ a message to\nt user interface so that the proper navigation can take place.\
    \ Add the following code\n\n```\nprivate RelayCommand<GroupedBookList> _selectGroupCommand\
    \ = null;\npublic RelayCommand<GroupedBookList> SelectGroupCommand\n{\n    get\n\
    \    {\n        if (_selectGroupCommand == null)\n            _selectGroupCommand\
    \ = new\n        RelayCommand<GroupedBookList>(SelectGroup);\n\n        return\
    \ _selectGroupCommand;\n    }\n}\n```\n\n```\nprivate void selectGroup(GroupedBookList\
    \ group)\n{\n    SelectedGroup = group;\n    Messenger.Default.Send<GroupSelected>(new\n\
    GroupSelected(_selectedGroup));\n```\n\n# 5. You need another class to handle\
    \ this, so add a new class to the Messages\nfolder GroupSelectedMessage. Replace\
