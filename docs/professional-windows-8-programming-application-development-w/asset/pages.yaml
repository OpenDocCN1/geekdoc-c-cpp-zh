    # USING THE BING MAPS SDK


    When you have your latitude and Long, or more accurately that of the device, you
    can now use the Bing Maps SDK for Windows 8 to give users a map showing their
    current location. This section explores some of the features of the Bing Maps
    SDK that you can use in your Windows 8 Store apps.


    # Referencing the Bing Maps SDK


    When building Windows Store apps that will use the Bing Maps SDK, you may add
    references to the following Windows extensions:


    +   - Bing Maps for C#, C++, and Visual Basic

    - Microsoft Windows C++ Runtime Package


    > NOTE you can install the Bing Maps SDK for Windows Store apps from Visual Studio
    2012 Extensions and Updates available in Visual Studio from the Tools menu. You
    can also find the Bing Maps SDK for Windows Store apps online by searching the
    Visual Studio Gallery: http://visualstudiogallery.msdn.com/


    To reference the Bing Maps SDK, follow these steps:


    +   1. Open another instance of Visual Studio 2012.

    2. Create a new Windows 8-style application using the Blank App (XAML) template,
    and name the project BingMapsLocation. Notice the small warning symbols on the
