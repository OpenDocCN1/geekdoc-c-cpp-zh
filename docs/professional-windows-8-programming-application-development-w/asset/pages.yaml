    | Assets\StoreLogo.png | This is the icon that represents your app in the Windows
    App Store. To change this, you replace it with a 50 x 50 .png image. |

    | Common\StandardStyles.xaml | This file is similar to App.xml in that it contains
    control styles for the application. This resource dictionary contains a default
    set of tested and proven styles that you should use throughout your application.
    Normally, you dont need to modify these styles but it is recommended to inherit
    from them using the XAML Based syntax (see in Chapter 3, "Enhancing Your Apps
    with Controls, Data Binding, and SemanticZoom”). Now, remember that if you use
    text or other controls in your app, you should check this file for an available
    standard to use instead. Windows Store apps should have a common look and feel,
    where possible, make use of the standard styles to keep the user interface consistent
    with other Windows Store apps. |

    | Package\appmanifest | This file contains all the settings and App Store information
    for your app. Here, you can change the name of your app, the set logo, supported
    orientations, and define what capabilities your app requires. Double-clicking
    this file opens the applications property configuration window and is the preferred
    way to make modifications to this file. |


    If you have done WPF or Silver development in the past, the files in Table 1-3
