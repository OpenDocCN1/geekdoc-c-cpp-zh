  md: '# CHAPTER 2 WHAT IS XAML?


    The Slider control also includes several properties that can alter the appearance
    of the control. For example, if you use the Slider to show marks as the user interacts
    with the control, set the TickFrequency property to a value other than zero. You
    can also control where the tick marks appear with the TickPlacement property.
    Values for this include Inline, TopLeft, BottomRight, and Outside.


    # Image


    You can use the Image control to display images in your app. These can reside
    internally in your application or also display from external resources. The Image
    control uses its Source property to determine what to display. The following XAML
    code displays the cover art for this book using not:


    ```

    <Image Source="Assets/book.png" Stretch="None"/>

    ```


    The Source property in this case holds for a file named book.png in the Assets
    folder of your project. The Stretch property offers several possible values including
    None, Fill, Uniform, and UniformToFill. If you want to simply display the image
    at its default size, use the Stretch option of None. If, however, you have a larger
    container, you can use the Stretch property to one of the alternative fill options,
    and the image will stretch to the remaining space in the container. The Image
    control can also display an external resource by simply setting the Source property
    to a valid URL as shows the following:


    ```

    <Image Source="http://media.wiley.com/product_data/coverImage/82/111801262/111801262.jpg"
    Stretch="None"/>

    ```


    # MediaElement


    In addition to the Image control, the MediaElement control provides you with a
    quick and easy way to add multimedia to your app. This powerful control can play
    all sorts of media ranging from assets in your project to external resources on
    the Web. When using the MediaElement control the Source property is where the
    magic happens. You can set the source to an internal asset using the drop-down
    box or type a URL to use. The following code shows a MediaElement that links to
    an exciting Channel 9 video.


    ```

    <MediaElement Margin="20,0,0,0" Source="http://media.ch9.sm/bf13/ff35aadd-534b-42d0-94cd-7cf2bf13/TWC9July13202.wmv"
    Volume="0.05/"/>

    ```


    The Source points to the URL of the resource you want to include. In addition
    to the Source attribute, the Volume property is set to 0.05 to slightly decrease
    the default volume that the clip is played. If you build and run the code using
    this MediaElement, you can see that the video clip starts as soon as it is available.
    This may be the behavior you want, but you can change it by setting the AutoPlay
    property to true or false depending on when you want the media to start playing.


    Referring to the figure, although the video clip is visible and playing, there
    are not any actual playback controls available. The MediaElement is a powerful
    video player control but does not


