  md: '# INTRODUCTION


    IT SEEMS LIKE YESTERDAY that Microsoft announced at its first annual BUILD conference
    the upcoming game-changing operating system: Windows 8. In the Microsoft world
    for the first time, Windows 8 was to provide an operating system that could create
    an ecosystem of apps that ran among phones, desktop computers, and tablets. Developers
    would be closer to writing an app for one device, with few-to-no modifications,
    having it run on all devices. Now that Windows 8 is finally here, it''s time for
    you, the developer, to get on board and understand some of the changes involved
    in creating Windows-based apps. Professional Windows 8 Programming is designed
    as your guide to all the changes and to get you on the fast track of developing
    your apps for the new Windows Store.


    In this book, you will learn about all the new development features of Windows
    8 and how to use them in apps for both the PC and tablet. You will see how to
    use XAML and C# to create a new style of app that emphasizes content rather than
    chrome. Windows Store apps are different from traditional Windows apps because
    they run full screen and without all the traditional menu systems that have historically
    taken up valuable real estate. In addition to a new style of app that the new
    WinRT development platform, Windows 8 gives you easy access to various hardware
    features such as sensors and geolocation. This book walks you through making use
    of these new features in your own apps.


    Finally, you should be aware that Windows 8 brings massive change in the area
    of app distribution. With the release of Windows 8, developers can now access
    an online app store where they can easily distribute and sell apps to the massive
    Windows 8 audience. Step by step, this book shows you how to leverage Visual Studio
    2012 to prepare your apps for deployment in the Windows Store. The new Windows
    Store gives you a great way to generate revenue as well as free distribution for
    your apps.


    It is an exciting time to be a Microsoft developer, and now that Windows 8 is
    out in the world, you''ll see a massive increase in the demand for quality, content-rich
    apps in the Windows Store. These apps must target the PC and tablet, as well as
    the soon-to-released Windows Phone 8. Professional Windows 8 Programming will
    guide you through all this, ensuring that you have the knowledge and tools necessary
    to create these in-demand apps.


    # WHO THIS BOOK IS FOR


    This book is designed for the professional-level developer who has previous experience
    writing applications for both Windows and the web. It assumes a familiarity with
    the following technologies:


    +   - Visual Studio

    - .NET Runtime'
  merge: -1
  pgno: 26
- img_proc: true
  md: '# INTRODUCTION


    +   - C#

    - XAML

    - WPF


    Although this book provides some introductory coverage of XAML and how it pertains
    to creating interfaces for Windows Store apps, it isn''t a primer on all the detailed
    aspects of XAML. If you have done any Silverlight or WPF development in the past,
    you should be fine.


    This book also assumes not that you are familiar with C#, but also that you are
    proficient in it. It discusses several new features to the language added in the
    .NET 4.5 run time and WinRT, but does not introduce text explaining the fundamental
    concepts of programming in C#.


    If you have been reading the various blogs and information technology websites,
    you probably know that Windows 8 enables you to create apps using the language
    of your choice, including HTML/CSS/JavaScript. All this is true — you can create
    Windows 8 solutions using all your favorite technologies. However, this book does
    not delve into this method of development, but focuses specifically on creating
    Windows Store apps with XAML and C# as your primary programming language. The
    book has basic introductory information about how to use HTML/CSS/JavaScript to
    write Windows Store apps, but it does not go into detail.


    # WHAT THIS BOOK COVERS


    This book covers how to write content-driven Windows Store apps using XAML and
    C#. You will see how to make use of the new improvements to Visual Studio 2012,
    including several new templates that help you jump-start your Windows Store app
    development. The following is an overview of the chapters and content associated
    with them:


    +   - Chapter 1: "A Glimpse into the Future" — Provides a brief overview of Windows
    8 history. You are introduced to Visual Studio 2012 and how to create your Windows
    Store app.

    - Chapter 2: "What Is XAML?" — Offers a introduction to the XAML user interface
    and how to use Visual Studio 2012 to design your apps.

    - Chapter 3: "Enhancing Your Apps with Control Styles, Data Binding, and Semantic
    Zoom" — With a solid XAML foundation, you can now become familiar with some of
    the advanced XAML topics.

    - Chapter 4: "Windows 8 User Interface Touches" — Introduces you to many of the
    new XAML controls available in WinRT and Windows 8.

    - Chapter 5: "Application Life Cycle" — Windows Store apps have different life
    cycle compared to traditional Windows applications. This chapter shows how to
    handle the required events for your app is suspended and activated as opposed
    to simply shutting down a standard desktop app.'
  merge: -1
  pgno: 27
- img_proc: true
  md: '# INTRODUCTION


    +   > Chapter 6: “Handling Data, Files, and Networking” — Become familiar with
    the changes to File IO, Data Access, and networking in the WinRT runtime.


    +   > Chapter 7: “Sensors” — Learn how to access and make use of the various sensor
    hardware included on Windows 8 tablet devices.


    +   > Chapter 8: “Geolocation” — Provides an introduction to Windows 8 support
    for geolocation services and how to best integrate this in your app.


    +   > Chapter 9: “Application Contracts and Extensions” — Windows 8 introduces
    a new concept contracts. These enable your app to become part of a shared ecosystem
    in which your app can be made accessible to other apps installed on the system.
    This chapter walks you through the process to open your app up to further use
    by alternatives.


    +   > Chapter 10: “Windows Store Application Architecture” — Learn how to best
    organize the code structure a Windows Store app. You also learn how to use the
    MVVM pattern that reduces code and complexity in your apps.


    +   > Chapter 11: “Store and Monetization” — After you start finding out how to
    potentially start making money with them. This chapter introduces you to the new
    Windows Store concept and provides guidance on the supported monetization strategies
    the store can offer.


    +   > Chapter 12: “Putting It All Together: Building a Windows Store Application”
    — After you understand all the core Windows 8 development concepts, you create
    a full-blown Windows Store app from start to finish. This chapter walks you through
    the design and implementation of a fullyfledged Windows Store app and shows you
    how to incorporate features of the cloud with SkyDrive support.


    # WHAT YOU NEED TO USE THIS BOOK


