  md: "# CHAPTER 3 ENHANCING YOUR APPS WITH CONTROL STYLES, DATA BINDING, AND SEMANTIC\
    \ ZOOM\n\n```\nWidth=\"246\"/\n<TextBox Text=\"Binding LastName, Mode=TwoWay\"\
    \nHorizontalAlignment=\"Left\" Margin=\"166,66,0,0\" TextWrapping=\"Wrap\"\nVerticalAlignment=\"\
    Top\"\nWidth=\"246\"/>\n<TextBox Text=\"Binding Email, Mode=TwoWay\"\nHorizontalAlignment=\"\
    Left\" Margin=\"166,121,0,0\" TextWrapping=\"Wrap\"\nVerticalAlignment=\"Top\"\
    \nWidth=\"246\"/>\n</Grid>\n```\n\nAs you can see, TextControl uses Two-way binding\
    \ to handle the appropriate properties of the Person object. Notice that in the\
    \ ComboBox declaration there is an attribute called DisplayMemberPath that sets\
    \ to \"FullName\". When binding a collection of Person objects to the ComboBox\
    \ control, you need to tell which property of the Person object it should use\
    \ to display the selectable text. The FullName property of the Person object,\
    \ as shown in Listing 3-9, simply concatenates the FirstName and LastName properties\
    \ of a particular Person instance.\n\n> LISTING 3-9: Chapter 3DataBindingControlsDataPerson.cs\n\
    \n```\nusing System;\n\nnamespace DataBindingControls.Data\n{\n    public class\
    \ Person\n    {\n        public string FirstName { get; set; }\n        public\
    \ string LastName { get; set; }\n        public string Email { get; set; }\n \
    \       public string FullName { get { return String.Format(\"{0} {1}\", FirstName,\
    \ LastName); }}\n    }\n```\n\nIn the previous example, you set the DataContext\
    \ of the object which you wanted to perform data binding. Although the DataContext\
    \ property is still a valid way to assign objects for data binding against controls\
    \ such as the ComboBox, ListBox, ListView, and GridView, Windows 8 also offers\
    \ a property called ItemsSource that is typically used to assign a particular\
    \ collection of data for binding. In the following code, the ItemsSource property\
    \ of the ComboBox is set to a collection of Person objects, and when the program\
    \ runs, all the binding takes place.\n\n```\nAccounts = new List<Person>();\n\n\
    Accounts.Add(new Person { FirstName = \"Test\", LastName = \"User 1\", Email =\
    \ \"Test1@testuser.com\" });\nAccounts.Add(new Person { FirstName = \"Test\",\
    \ LastName = \"User 2\", Email = \"Test2@testuser.com\" });\nAccounts.Add(new\
    \ Person { FirstName = \"Test\", LastName = \"User 3\", Email = \"Test3@testuser.com\"\
    \ });\n```\n\nwww.it-ebooks.info"
