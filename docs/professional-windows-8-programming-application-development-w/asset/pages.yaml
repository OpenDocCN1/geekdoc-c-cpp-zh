  md: "Another thing to notice the ListView XAML is that the SelectionMode property\
    \ is set to Single. This means a user can select only one item in the list at\
    \ any given time. You could also set this value to Multiple; in that case the\
    \ AddedItems collection you've using in the SelectedChanged event would contain\
    \ all the selected Wroxbook instances.\n\nTo populate the ListView control, you\
