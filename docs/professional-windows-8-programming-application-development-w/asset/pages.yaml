  md: "```\nLoadAccount();\n\nprivate void LoadAccount() {\n    this.DataContext =\
    \ new Person();\n}\n\nprivate void Submit_Click(object sender, RoutedEventArgs\
    \ e) {\n    Person person = this.DataContext as Person;\n\n    string first =\
    \ person.FirstName;\n    string last = person.LastName;\n    string email = person.Email;\n\
    }\n}\n```\n\n# Data Binding Summary\n\nConceptually data binding is a simple thing.\
    \ You give it the ability to auto refresh the user interface when controls on\
    \ the user interface are made by updating the DataContext. When you use Two-Way\
    \ data binding, binding also gives you an easy way to track changes to the object.\
    \ With that said, you may wonder what to do if you want to display or manipulate\
    \ collections of various business objects. Data binding comes handy here as well—the\
    \ entire concept becomes more powerful when you look at it with the controls available\
    \ in Windows 8. Several controls in the Windows 8 API have been built from the\
    \ ground up with data binding. When combined with data binding, these controls\
    \ enable you to manage collections of data with.\n\n# WINDOWS 8 DATA BINDING CONTROLS\n\
    \nAlthough you can apply the concept of data binding to any Windows 8 XAML control,\
    \ several controls were designed to work particularly when you want to manage\
    \ and manipulate collections of data. These controls include the ComboBox, ListBox,\
    \ ListView, and GridView. Now take a look at how to use each of these using data\
    \ binding.\n\n# ComboBox\n\nIn the previous chapter, you saw how to use the ComboBox\
    \ by hardcoding some individualboBoxItem objects. You also learned to capture\
    \ the selected item using the SelectionChanged event handler. In particular, you\
    \ were limited in what kind of data could display in the ComboBox control. You\
    \ were allowed to use only string data, and when a SelectionChanged event was\
    \ handled, you extracted the selected string through the use of the Content property\
    \ of the selected comboBoxItem. But with data binding, you are free to use a collection\
    \ of just any object type to populate the ComboBox control. When a ComboBox selection\
    \ is made, instead of working only"
