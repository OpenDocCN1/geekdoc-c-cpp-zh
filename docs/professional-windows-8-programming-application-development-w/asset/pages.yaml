  md: '# App Overview


    Because your app is not deployed to the store, when you run it in Visual Studio,
    it initializes with a proxy license file, instead of the actual license that comes
    with the Windows Store. You can check how initialization works in detail in the
    next few sections. Initialization is important because it enables you to create
    and load data models and present your products in the shopping app.


    The application object also includes the code to initialize the Settings page,
    which you can use to purchase the license for the app and convert it from a trial
    to a paid app.


    After the application object and data models are initialized, the app loads GroupedItemsPage,
    which shows a grid bound to CatalogDataModel. This model loads product ids that
    matches in the proxy license file, product descriptions, colors, and other information.


    > Restarting the app in Visual Studio reloads the license proxy. Any purchases
    you make while the app is running in debug mode are only valid until the app is
    terminated.


    # Trial Conversion Experience


    You need to convert from a trial by purchasing a license to your app. Open the
    Settings cham by swiping from the right, or pointing your mouse to the bottom-right
    corner, and select the Settings cham, click License menu item.


    Click the button with the price of the app. A debug dialog opens, asking you to
    simulate the response for the Color Shopping app. Click OK. This concludes the
    trial conversion. Your app is now purchased.


    Color Shopping app allows users purchase product colors: "Green", "Pink", "Tomato"
    and others. When the user starts the app, the "Tomato" product is hidden, and
    on top of it we show the ad. When the trial is unlocked, all shows products without
    ads.


    > It''s a good practice to disable ads after the app is purchased. Advertisements
    disappear from the main page of the app after you complete the trial conversion,
    and you can now see the "Tomato" product.


    # In-App Purchasing Experience


    After you convert from a trial to a paid version, you can purchase products by
    following these steps:


    +   1. Clicking "Pink" product, which takes you to the product details.


    +   2. Click the button that shows the product, and a dialog asking you to simulate
    purchasing. (Remember, your app is not in the store, so it uses CurrentAppSimulator
    instead of real-store transactions).'
