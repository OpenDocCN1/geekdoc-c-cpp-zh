- img_proc: true
  md: '# # Understanding Windows 8: The Zune Concept


    Although the Zune hardware did not catch on the mass markets with the success
    that the iPod from Apple did, the software internally left a lasting mark at Microsoft.
    The Zune software did well place emphasis on application content rather than chrome.
    The Zune software had hundreds of menu options and toolbars throughout the app.
    You also didn''t see multiple windows that could drag across the screen. Instead
    you had album artwork, song titles, metadata about the music, and controls specific
    to the actual function you were using. The software was easy to use, and many
    of the more complex functions were handled with a simple right-click context menu
    and a modal dialog, as shown in Figure 1-2, so users could get back to where they
    started.


    ![](img/2cea804c0281668ba7d119c3e0ce780e_36_0.png)


    Figure 1-2


    Compared to a traditional Windows application, this was definitely a different
    way to do things. With the iPod crowd and the iPhone on its, Microsoft looked
    for a way to get into the emerging mobile market and to differentiate itself from
    both Android and iOS competition. Making small changes to the existing Windows
    mobile platform, Microsoft looked to find the Zune software for its design principles
    to achieve its goals in the mobile space. The Zune software team essentially created
    a new way to look at the user interface and the design behind it: Windows 8.


    To stand out from the crowd, Microsoft used the Windows 8 design concepts in its
    upcoming release of the new Windows Phone 7. However, this platform was not just
    a direct copy of Zune; Microsoft took the Windows 8 design concept even further
    creating an entirely new way to develop applications focused on content over chrome.'
  merge: -1
  pgno: 36
- img_proc: true
  md: '# CHAPTER 1 A GLIMPSE INTO THE FUTURE


    Microsoft invested research time and money into gestures that gave the best overall
    experience on a mobile device, and it determined how to use gestures the user
    interface for phone apps. This led to groundbreaking controls and concepts. An
    example is the panorama control that shows a horizontally scrolling user interface,
    giving users a basic preview of content when they scroll.


    # Windows Phone 7 Carry-overs


    Windows Phone 7 introduced several new user interfaces that have carried over
    into Windows 8. Live tiles are an example of this and is now an integral part
    of the newly enhanced Start screen in Windows 8. Live tiles gives several customizable
    tiles that continuously update with the latest information for the application
    they represent. This could be an e-mail application that always displays the latest
    count of unread e-mail messages or the latest tweet from a preferred Twitter user.
    Microsoft offers many different possibilities for these tiles gives guidance on
    how your application should attempt to use tiles, a topic covered in Chapter 4,
    "Windows 8 User Interfaces." Figure 1-3 shows the new Windows 8 start screen and
    several tiles, which continuously update with information downloaded in the background
    through various web services.


    ![](img/2cea804c0281668ba7d119c3e0ce780e_37_0.png)


    FIGURE 1-3


    # GETTING AROUND IN WINDOWS 8


    Typically, it''s simple to get up to speed on new versions of Windows. Most of
    the familiar operating system tools and interactions don''t change. However, because
    Windows 8 is geared to a wide range of devices, Microsoft made significant changes
    to the wide user interface and navigation'
  merge: -1
