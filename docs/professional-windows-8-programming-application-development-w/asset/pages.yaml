  md: "# Windows Sensor Platform | 23\n\nWindows expanded some of the requirements\
    \ for hardware manufacturers. The Windows Certification Program (previously known\
    \ as the Windows Logo Program) requires hardware manufacturers provide an integrated\
    \ 3-D accelerometer, 3-D gyroscope, and 3-D magnetometer in all tablet and convertible-tablet\
    \ form factors. If the system is equipped with mobile broadband, an integrated\
    \ GPS receiver is also required.\n\nWindows provides the Hardware Certification\
    \ Kit and tools to support hardware and sensor development. The kit provides development\
    \ and debugging tools for developers and testers.\n\nWhen you look at the variety\
    \ of sensors and devices the Windows Sensor Platform supports, you will notice\
    \ similarities in the way device works with them. Many types are instantiated\
    \ early, and have similar data structures, making it easier to develop for multiple\
    \ sensors. The Windows Sensor Platform also employs a technique called sensor\
    \ fusion: the process of using data from multiple sensors to enhance existing\
    \ data, or to synthesize new sensor types from raw sensor data. Figure 7-1 shows\
    \ that the accelerometer, gyroscope, and magnetometer provide data that synthesizes\
    \ virtual compass, inclinometer, and device-orientation sensors.\n\n![](img/2cea804c0281668ba7d119c3e0ce780e_264_0.png)\n\
    \nFIGURE 7-1\n\nGiven that the Windows Certification Program does not require\
    \ all sensors on all form factors, you must ensure that your application can account\
    \ for the presence, absence, of given sensors. It is for this reason that the\
    \ types in the Windows.Devices.Sensors namespace representing sensors do not provideless\
    \ constructors. They instead provide a GetDefault method that returns the default\
    \ sensor instance if sensor has been integrated into the computer by the manufacturer;\
    \ otherwise, it returns null. You could therefore write the following statements\
    \ to get the default Accelerometer and then determine if the GetDefault method\
    \ returned null before using it.\n\n```\nAccelerometer accelerometer = Accelerometer.GetDefault();\n\
    {\n    ...\n}else\n{\n    ...\n}\n```\n\nwww-it-ebooks.info"
