    the available groups and books. Now you need to work on some these secondary pages.
    In this section, you start with the group drill down. This is a simple page, and
    the purpose is actually to allow a user to see only books that belong to a specific
    group. In addition, after this page loads, you should plan to use sort and filter
    the results by using commands available in the AppBar for this page.


