    \ or the static Messenger.Default.\n\n# SUMMARY\n\nThis chapter shows how to enhance\
    \ an app with a more robust and maintainable architecture. At a glance, this architecture\
    \ may appear to take more effort to implement, but it actually requires less effort.\
