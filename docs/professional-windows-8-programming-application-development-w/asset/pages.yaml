  md: '# ListView Sample


    ![](img/2cea804c0281668ba7d119c3e0ce780e_136_0.png)


    Selected Book: ASPNet 4 in C# and VB


    +   ComboBox

    ListBox

    ListView

    GridView

    Grouped GridView

    Zoom GridView


    FIGURE 3-7


    As you can see, the presentation of the items in a ListView is much richer than
    in the ComboBox or ListBox. When you make selections, you see a check mark in
    the upper-right corner, and the entire selection changes how to be selected. This
    is all built into the standard ListView and does not require you to write additional
    code.


    The presentation of each book item shown in the ListView has several pieces to
    it. Both the ListView and GridView controls enable you to completely customize
    the look of each item in the list. By using a custom called Data templates. In
    example, you want to display a thumbnail, a title, and author information for
    each book in the list. To make a DataTemplate work, create the user interface
    which you want in the collection as well as binding information for the various
    properties of the object. Then in the ListView control, you use the SetItemTemplate
    property to use the DataTemplate DataTemplate declarations are treated as resources
    and should reside either in App.xaml or in your page. Resources section of the
    file containing the ListView you plan to use it for. For this, a DataTemplate
    that displays the thumbnail, the title, and author information would look like
    the following:


    ```

    <DataTemplate Key="BookTemplate">

    <Grid Margin="10">

    <StackPanel Orientation="Horizontal">

    <Image Source="Binding Thumbnail}" Height="60" Width="60" Margin="0,0,10,0"/>

    <StackPanel Margin="0,0,0,0" Orientation="Vertical">

    <TextBlock TextWrapping="Wrap" Style="{StaticResource BookTitleStyle}" Text="Binding
    Title}" />

    <TextBlock TextWrapping="Wrap" Style="{StaticResource BookAuthorStyle}" Text="Binding
    Author}" />

    </StackPanel>

    </StackPanel>

    </Grid>

    </DataTemplate>

    ```'
