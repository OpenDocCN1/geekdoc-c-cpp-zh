    # A QUICK XAML HISTORY LESSON


    XAML pronounced (ZAMEL) at its core is a markup language similar to XML to design
    user interfaces. It was started in Windows Presentation Foundation (WPF) development.
    For years Windows applications were designed with a basic form and some code each
    form to handle basic control interactions. The resulting user interfaces were
    not slick and locked looking overall, having a myriad of controls and generating
    a good deal of confusion about what practices developers designed the user interface
    for a Windows application.


    When Vista came out with the new Aero desktop, it introduced new features that
    could be leveraged for much richer user interfaces in Windows applications. Microsoft
    went back to the drawing board and created XAML, which not only provided more
    powerful and better designed interfaces, but also simplified the overall control
    set that was available to developers. Using just a handful of controls and concepts
    you could develop rich user interfaces learning APIs, such as DirectX, which were
    traditionally used for writing Windows game software. When WPF was unleashed,
    it was not a far jump for Microsoft to take a look at how web development was
    done. Microsoft-based web development was performed using ASP.NET and Web Forms,
    which were basically a web-based version of the Win Forms technology that developers
    had at their disposal for full-blown client apps.


    Microsoft soon created a plug-in Silverlight, which made full use of XAML. Developers
    could create user interfaces and access some of the powerful APIs in the .NET
    framework that were traditionally only available for client software. Silverlight
    supporting a large chunk of the features included in the .NET framework as well
    as running in the context of the web browser, XAML quickly became a popular choice
    for replacing ASP.NET line-of-business apps. There was no doubt that performance
    and ease of user interface creation combined with a simple deployment strategy
    would quickly rocket Silverlight to the top of preferred development technologies.


    XAML-based solutions solved one problem that haunted Microsoft web developers
    for years: to make a user interface look consistent across multiple browsers and
    browser versions. HTML and CSS had their strengths but each browser handled things
    — such as layout and positioning — slightly different, this often resulted in
    web developers coding completely different versions of sites depending on the
    browser. Silverlight and XAML eliminated by running as a'
