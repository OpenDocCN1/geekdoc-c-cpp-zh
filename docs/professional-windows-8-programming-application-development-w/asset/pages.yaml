  md: '# Summary | 179


    ![](img/2cea804c0281668ba7d119c3e0ce780e_212_0.png)


    FIGURE 5-10


    # # Deadlock


    Yup, the dreaded deadlock. It can actually really its ugly head with background
    tasks tasks. How? Well, because background tasks are actually loaded in-process
    with the app if it is already running and because suspended apps have the UI thread
    blocked, when a background task is triggered in this scenario, it cannot access
    any object owned by the UI thread or it results in a deadlock. To prevent this
    deadlock, background tasks should not share data between the app and the background
    task. An alternative approach is to use persistent storage to share the data.


    # # SUMMARY


    This chapter discussed what transpires from an app launch to its untimely termination
    and how an app can be refreshed, even when it isn''t running. First impressions
    say a lot, and the first thing a user sees is the screen splash, so it needs to
    shine and move content as fast as possible. Make the transition to the app content
    smoothly, and add subtle animations where needed to give a natural feel to what
    happens. Refer to existing apps to get a feel for what might work for your apps.


    Ultimately, the goal is to keep your apps in the foreground as much as possible
    for the hundreds of millions of Windows users out there. Using the techniques
    in this chapter will help your apps become fast and fluid when transitioning between
    life-cycle states, stay current and alive when the app isn''t in the foreground,
    and gracefully recover from errors that return visits to your apps, creating an
    excitement that your app "just works." When users receive that impression, they’ll
    encourage people to try your apps, which can extend your market reach.


    www.it-ebooks.info'
