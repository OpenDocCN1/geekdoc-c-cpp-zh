  md: "# CHAPTER 2 WHAT IS XAML?\n\nIn addition to linking to internal pages in your\
    \ application you can also use the HyperlinkButton to load content from an external\
    \ resource. If you see the properties available for the HyperlinkButton you see\
    \ one called NavigateUri. In Silverlight-based applications, simply setting this\
    \ property to a URL was what required to redirect to an external page. Because\
    \ Silverlight applications were always running in the context of a browser, this\
    \ worked fine. In a Windows Store app, however, you are not running in a browser\
    \ but in the context of a full-blown thick client app. Setting a URL in this property\
    \ will not get you what you want. Instead you should handle the event\n\nThe Launcher\
    \ you want to work with this case is the default system Launcher, which provides\
    \ a method called LauncherUriAsync. You can use this method to redirect the user\
    \ to any external URL resource. It does so by launching an instance of the web\
    \ browser and loading the specified page. By following this code, this method\
    \ enables the user to http://www.wiley.com via the default browser.\n\n```\nprivate\
    \ void Outerlink_Click(object sender, RoutedEventArgs e) {\n    LaunchBrowser();\n\
    }\n\nasync void LaunchBrowser() {\n    var success = await Windows.System.Launcher.LaunchUriAsync(new\
    \ Uri(\"http://www.wiley.com\"));\n}\n```\n\nYou may wonder about the syntax used\
    \ in this example. Because the LaunchUriAsync method is asynchronous in nature,\
    \ you will need to use the await keyword and encapsulate the Launcher call in\
    \ a method marked async. The await keyword enables you to make an asynchronous\
    \ call but treat it in a synchronous way. Instead of implementing complex asynchronous\
    \ callback methods that are fired when the operation is complete, the await keyword\
    \ forces the system to perform the asynchronous method and wait for its completion\
    \ before moving on the code. The other major benefit is, aside from code that\
    \ is much easier to read and follow, that the user interface can accept user input\
    \ because no actual blocking method call takes place. The await internally creates\
    \ all the code needed for the standard asynchronous callback mechanism and returns\
    \ the result of the method in a synchronous manner.\n\n# ComboBox\n\nThe ComboBox\
    \ control provides you with an easy way to give your users a choice of options\
    \ to select from. Almost all environments provide some form of this control, whether\
    \ it is a <select> tag in HTML or the DropList control in ASP.NET. Like other\
    \ implementations the ComboBox consists of the Control with a collection of item\
    \ controls or in this case ComboBox objects. Use the following XAML code to declare\
    \ an instance of a ComboBox that contains several options:\n\nwww-it-ebooks.info"
  merge: -1
  pgno: 105
- img_proc: true
  md: "```\n<ComboBox x:Name=\"MainCombo\">\n  <ComboBoxItem Content=\"ASP.NET\"/>\n\
    \  <ComboBoxItem Content=\"WPF\"/>\n  <ComboBoxItem Content=\"Silverlight\"/>\n\
    \  <ComboBoxItem Content=\"WinForms\"/>\n  <ComboBoxItem Content=\"WinRT\"/>\n\
    \  <ComboBoxItem Content=\"Select\" IsSelected=\"True\"/>\n</ComboBox>\n```\n\n\
    Notice how the ComboBox objects use the Content property to determine what displays\
    \ upon. To determine which item is selected by default, you can set the IsSelected\
    \ property for the appropriate ComboBoxItem. Now if you want to be notified when\
    \ a selection has been made and to perform logic when happens, you can hook up\
    \ an event handler for the SelectionChanged event. This handler provides you with\
    \ an AddedItems collection that you can use to extract the ComboBoxItem. The following\
    \ code shows how you can update the interface with the ComboBox option:\n\n```\n\
    private void BasicCombo_SelectionChanged(object sender,\nSelectionChangedEventArgs\
    \ e)\n{\n  ComboBox selectedItem = e.AddedItems[0] as ComboBox;\n\n  if (selected\
    \ != null && SelectedComboItem != null)\n    SelectedItemItem.Text = String.Format(\"\
    Selected Item: {0}\",\n    selected.Content);\n}\n```\n\nWhen a user makes a selection\
    \ in the ComboBox control, the selected item that is extracted is of type object.\
    \ This is slightly different from how ComboBox style controls are done in ASP.NET\
    \ and WinForms. In this case you are statically declaring the content as ComboBoxItems,\
    \ you can safely cast the selection to type and use more the Content property\
    \ to display the selected string. However, the ComboBox is more flexible than\
    \ that. The reason the AddedItems collection returns object is because it enables\
    \ the collection of items to be any kind of class. This means you can set the\
    \ list of ComboBoxItems to your own business objects and configure the ComboBox\
    \ to display a property of that for the text to show. Now look at a simple example.\
    \ You say you have a class Book with several properties such as ID, Author, and\
    \ Title. You will probably end up with the following code:\n\n```\npublic class\
    \ Book\n{\n  public int ID { get; set; }\n  public string Author { get; set; }\n\
    \  public string Title { get; set; }\n}\n```\n\nNow that you use the ComboBox\
    \ control to present to the user a list of Books, but you want the text displayed\
    \ to the user be the title of the book. You would follow these steps:\n\n+   1.\
    \ You need a collection of Book items, which can be built with the following code\
    \ steps in the constructor of the page."
