  md: "# Grouped GridLayout\n\nIn addition to simply presenting a collection of content\
    \ and data in a horizontal display, the GridLayout also supports grouping collection\
    \ items and presenting the information in a grouped display. Grouping is handled\
    \ by using most of a few additional GridLayout properties as well as a different\
    \ type of collection object.\n\nBefore getting the GridLayout ready for grouping,\
    \ you will first need to change the way you set up the collection of data you\
    \ want to use. Like most of the examples in this chapter, you will have a collection\
    \ of items using a generic List<T> or ObservableCollection<T>. When you want to\
    \ group for data in the GridLayout, you will need to set up your collections differently.\
    \ Now walk through what it takes to get this example working with a collection\
    \ of WBook objects grouped by subject or programming language.\n\nFirst, you may\
    \ need a List<T> to hold all your objects as you normally would.\n\n```\nprivate\
    \ List<WroxBook> AllBooks = new List<WroxBook>();\n```\n\nThis code could come\
    \ from a database or a web service, but for this example just hardcode book objects\
    \ when the page loads.\n\n```\nprotected override void OnNavigatedTo(NavigationEventArgs\
    \ e)\n{\n    base.OnNavigatedTo(e);\n\n    SetupList();\n}\n\nprivate void SetupList()\n\
    {\n    AllBooks.Add(new WroxBook\n    {\n        Subject = \"ASP.NET\",\n    \
    \    Title = \"Professional ASP.NET MVC 4\",\n        Author = \"Jon Galloway\"\
    ,\n        Thumbnail = new Bitmap(new Uri(\"ms-app://Assets/aspnet4.jpg\", UriKind.RelativeOrAbsolute))\n\
    \    });\n\n    AllBooks.Add(new WroxBook\n    {\n        Subject = \"ASP.NET\"\
    ,\n        Title = \"Beginning ASPNET Web Pages with WebMatrix\",\n        Author\
    \ = \"Mike Briend, Iman Spaanjaars\",\n        Thumbnail = new Bitmap(new Uri(\"\
    ms-app://Assets/beginaspnetmatrix.jpg\", UriKind.RelativeOrAbsolute))\n    });\n\
    \n    AllBooks.Add(new WroxBook\n    {\n        Subject = \"ASP.NET\",\n     \
    \   Title = \"Professional Asp.net Design Patterns\",\n        Author = \"Scott\
    \ Millett\",\n    });\n```"
