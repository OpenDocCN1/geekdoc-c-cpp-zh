  md: 'In this chapter, you explore each of the Application Contracts and extensions
    to gain an appreciation of how apps you write can benefit from them. Although
    you''ll gain an appreciation for each of the contracts and extensions, this chapter
    is intended to provide you with an overview of them and not provide an exhaustive
    description of each.


    Windows 8 provides support for the following Application Contracts:


    +   * File Picker

    * Cached File Updater

    * Play To

    * Search

    * Settings

    * Share


    Windows 8 provides support for the following extensions:


    +   * Account Picture Provider

    * AutoPlay

    * Background Tasks

    * Camera Settings

    * Contact Picker

    * File Activation

    * Game Explorer

    * Print Task Settings

    * Protocol Activation

    * SSL/Certificates


