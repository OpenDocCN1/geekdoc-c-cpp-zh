    \n# Calculating True North Headings\n\nAs a practical example of using the 3-D\
    \ Compass API, this section considers a task solved by pilots every day. Pilots\
    \ use sectional charts to navigate in the United States. These charts show isogonic\
    \ lines for every degree of magnetic variation. An isogonic line is a line drawn\
    \ through points of equal variation.\n\nFigure 7-4 shows an isogonic line for\
    \ 15° E from the San Francisco chart. If you want to calculate the true north\
    \ heading given a magnetic heading of 241°, you would subtract the 15° magnetic\
    \ variance giving you the true north heading of 226°.\n\n![](img/2cea804c0281668ba7d119c3e0ce780e_269_0.png)\n\
