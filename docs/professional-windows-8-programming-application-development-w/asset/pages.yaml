  md: 'Hopefully, you have a good understanding of how to set up Live Tiles and Tile
    notifications for your app. You learn much more about this topic, including how
    to use Push Notifications from a web server to update your Tile, in Chapter 12.


    # SPLASH SCREEN


    The final topic to cover in this chapter is a simple but important one — how to
    create a custom splash screen for your app. When an application starts in Windows
    8, your splash screen displays until the app is fully loaded. Figure 4-11 shows
    what your users are presented with default.


    ![](img/2cea804c0281668ba7d119c3e0ce780e_182_0.png)


    FIGURE 4-11


    Yeah, it''s ugly and not impressive — definitely not something that can help promote
    your brand. Before telling your potential users that you have no design skills
    whatsoever, you should count on replacing that. Luckily for Windows Store Apps,
    there is no special code or wizardry needed to show your custom splash screen.
    All you need to do is simply replace the one sitting in the Assets folder of your
    project. In that folder you can see the following files:


    +   - Logo.png

    - SmallLogo.png

    - SplashScreen.png

    - StoreLogo.png


    Take a guess as to which file you need to replace! The only thing you must worry
    about is that it conforms to the Windows 8 splash screen specifications. This
    means that the image you replace it with must be 620x330 in size. When replaced
    you start your app, you should see your custom splash screen. Figure 4-12 shows
    a custom Wrox splash screen that clearly looks better than the default.'
  merge: -1
  pgno: 182
- img_proc: true
  md: '![](img/2cea804c0281668ba7d119c3e0ce780e_183_0.png)


    FIGURE 4-12


    # SUMMARY


    In this chapter you learned important concepts about Windows Store App development.
    You saw how to make best use of the new AppBar and how it replaces the traditional
    menu system you may find in legacy Windows apps. In the sample app you created,
    you added an AppBar to both the top and bottom of the screen. Per Windows 8 guidance
    you learned that the tap bar is the best place to put important action commands,
    where the tap bar is reserved for navigation controls if necessary.


    In addition to the AppBar feature, you also saw how to create notifications that
    can display information when your app runs in the background. You should use notifications
    only to display important information, such as in response to the toast when your
    users will likely touch/click the notification message and brought back into your
    app. You don''t want them to do unless there is a good reason for doing so.


    Next, you learned how to make use of Live Tiles for your app, which give you a
    great way to interact with your users from the Windows 8 Start Screen. They also
    give you a way to differentiate your app from others that provide only static
    tiles with no dynamic update capabilities.


    Finally, you saw how easy it is to replace the default splash screen when your
    Windows Store App launches. Although it may seem like a trivial component of your
    app, you must take care in designing the screen because it is always the first
    thing your users see when the app launches — first impressions of apps count for
    a lot these days.'
