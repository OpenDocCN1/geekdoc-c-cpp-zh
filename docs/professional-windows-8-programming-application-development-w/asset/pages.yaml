  md: '# ABOUT THE AUTHORS


    NICK LECRENSKI is a developer with over 10 years of experience in a wide range
    of Microsoft technologies including Silverlight, XAML, C#, VB.NET, ASP.NET, C++,
    Java, HTML, MVVM, SQL Server, and more. He has a BS in Computer Science and has
    worked in various fields from biometrics to financial services. He is also the
    founder and lead developer of MyFitnessJournal.com, an online fitness tracking
    site that utilizes the latest web development technologies including ASP.NET MVC
    and JQuery.


    DOUG HOLLAND is an architect with Microsoft''s Developer & Platform Evangelism
    team. He works with Microsoft''s strategic IS partners to help them bring new
    and exciting experiences to consumers on Windows 8 and Windows Phone 8. Before
    joining Microsoft DPE, he was awarded both the Microsoft MVP (Visual C#) and Intel
    Black Developer awards and holds an M.Sc. in Software Engineering from Oxford
    University.


    ALLEN SANDERS is an architect at Teksouth Corporation and co-owner of LiquidKey,
    LLC. He provides expertise on the UX (user experience) to the database for LOB
    (line of business), Windows 8, and Windows Phone solutions.


    KEVIN ASHLEY (@kashleyweit) is an architect evangelist at Microsoft, author of
    top Windows 8 and Windows Phone apps (http://appgames.com), code junkie and a
    part-time ski instructor. Prior to Microsoft, Kevin founded a successful cloud-based
    business intelligence startup and worked in finance. In his role as a senior software
    developer and architect, Kevin developed grid data, warehousing and real-time
    trading solutions for Fortune 500 companies and hedge funds worldwide US, UK,
    Europe and Asia. Kevin has degrees in Mathematics, Computer Science and has an
    MBA in Finance. He enjoys writing about software and technology on his blog: http://kevinashley.com.'
