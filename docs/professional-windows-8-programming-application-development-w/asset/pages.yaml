  md: 'SignTool: This digitally signs files and verifies signatures:


    ```

    signtool [Command] [Options] [FileName ...]

    ```


    To package apps you can use PowerShell or Developer Command Prompt for a Visual
    Studio command line. If you have a script that copies files into a build directory,
    make sure you copy all resources, assets, and graphics into the package directory.
    Then execute the following command:


    ```

    MakeAppx pack /d input_dir /p MyPackage.app

    ```


    You can also use a mapping file that lists resources and assets outside of the
    package directory. To use a mapping file, you need to include a /f switch and
    include the path to the mapping file.

    You also need to sign your package with your certificate and the SignTool:


    ```

    SignTool sign /a /v hashAlgorithm /c certTemplateName filepath.app

    ```


    # Packaging Enterprise Line-of-Business (LOB) Apps


    There''s often a need in businesses for line-of-business (LOB) apps that are usually
    deployed by IT departments using PCs. These apps may be sideloaded by a local
    IT department.


    Sideloading is the process of adding apps that bypass the Windows Store. You can
    add apps to a Windows image with Windows PowerShell or the Deployment Image Servicing
    (DISM) platform. All Windows apps distributed by local IT departments using this
    method must be signed with a certificate from a trusted root certificate.


    You can only use Dism.exe and PowerShell scripts to install WinRT apps; you cannot
    use them to install traditional desktop applications. The following shows tools
    for packaging, deployment, and LOB apps:


    +   - Add Apps (Add-AppxPackage): PowerShell cmdlet: A line-of-business (LOB)
    app installation:


    ```

    Add-AppxPackage C:\Appx.app

    ```


    +   - List Apps (Get-AppxPackage): PowerShell cmdlet. Lists LOB Apps per user
    account:


    ```

    Get-AppxPackage -AllUsers

    ```


    +   - Remove Apps (Remove-AppxPackage); PowerShell cmdlet. Removes LOB app:


    ```

    Remove-AppxPackage Packagel

    ```


    +   - Dism.exe: This is a Deployment Image Servicing platform for packaging LOB
    apps in Windows image.'
  merge: -1
