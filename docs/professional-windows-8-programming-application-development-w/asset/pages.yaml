  md: "```\n{\n  get { return _selectedBook; }\n  set {\n    _selectedBook = value;\n\
    \    Messenger.Default.SendMessage(new BookSelectedMessage(_selectedBook));\n\
    \  }\n}\n```\n\nAs you can see, when a book is selected you need to use the user\
    \ interface know to navigate to the BookDetailPage. Chapter 10 shows how MVMLight\
    \ provides a great mechanism to communicate from the view model to the code by\
    \ making use of messages. Obviously you need to implement MVMLight because you\
    \ can only the main Frame object used for navigation from the code below tricks\
    \ available to make the view model aware of the Frame and let the view model handle\
    \ the navigation, but that breaks one of the principals of MVMLight, which is\
    \ to keep view-specific logic out of the view model. In this case, navigating\
    \ from page to page is view-specific and should stay in the code behind.\n\nIn\
    \ the following code, you create a BookSelectedMessage and send that to whatever\
    \ code-behind pages to be registered for the message. Because this is not the\
    \ only message passing around your app, you should create a folder to hold the\
    \ message classes:\n\n+   1. Right-click the project node.\n\n+   2. Add a new\
    \ folder called Messages.\n\n+   3. Add a new class called BookSelectedMessage\
    \ and replace its contents with the code in Listing 12-6.\n\n# LISTING 12-6: BookSelectedMessage.cs\n\
    \n```\nusing System;\nusing System.Collections.Generic;\nusing System.Linq;\n\
    using System.Text;\nusing System.Threading.Tasks;\nusing WroxBookStore.Data;\n\
    \nnamespace WroxBookStore\n{\n    public class BookSelectedMessage\n    {\n  \
    \      public WroxBookSelected { get; set; }\n\n        public BookSelectedMessage(WroxBookSelected\
    \ selected)\n        {\n            Selected = selected;\n        }\n    }\n}\n\
    ```"
