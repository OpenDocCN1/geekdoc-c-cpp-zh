  md: "# USING SEMANTICZOOM\n\nThe GridView gives you a powerful way to display a\
    \ collection of business objects and content. In addition to grouping items by\
    \ a particular category, Windows 8 makes it even easier for your users to find\
    \ what they are looking for when they are presented with a large number of items\
    \ in your GridView. SemanticZoom, which supports the pinch gesture and control/mouse\
    \ wheel, enables to effectively zoom in or out of your GridView collection so\
    \ that users can easily jump around content that has been grouped.\n\nIn the previous\
    \ example, you show that the CollectionViewSource enables you to easily display\
    \ the list of WrootBook objects in a grouped scenario with headers for each programming\
    \ subject. If you have only a few subjects, this setup works fine. However, if\
    \ you have a large amount of subjects (as you will in many real-world applications),\
    \ your users potentially scroll a long time to reach the end of the list. To help\
    \ users quickly jump around the various subjects, you can make a small amount\
    \ of XAML code to create a zoomed out version of the GridView that shows only\
    \ the subject headers. When users turn out or click a subject, they are automatically\
    \ taken to the books under the selected subject.\n\nTo get this working, simply\
    \ wrap your GridView inside the new SemanticZoom control. SemanticZoom control\
    \ works by giving you ZoomedOut and ZoomedIn properties that you can include the\
    \ appropriate value of your data collection. ZoomedInView has the same XAML code\
    \ you use for the GridView that supports grouping. However, the ZoomedOut shows\
    \ only the actual subject headers that exist for each group. In views of the GridView\
    \ control making use of the SemanticZoom control both zoomed out and zoomed to\
    \ hold.\n\n```\n<SemanticZoom x:Name=\"SemanticZoomControl\" HorizontalAlignment=\"\
    Left\" Margin=\"45,70,0,1\" VerticalAlignment=\"Top\">\n  <SemanticZoom.ZoomedOutView>\n\
    \    <GridView x:Name=\"ZoomedOutGridView\" MinWidth=\"200\" ItemTemplate={StaticResource\
    \ ZoomedOutTemplate}\n    BorderBrush=\"White\" BorderThickness=\"2\">\n    <ScrollView\
    \ VerticalVisibility.HorizontalVisibility=\"Auto\" SelectionMode=\"Single\" MaxWidth=\"\
    1000\" SelectionChanged=\"GridView_SelectionChanged\">\n      <ItemsPanel.ItemsPanel>\n\
    \        <StackPanel Orientation=\"Horizontal\" VerticalAlignment=\"Center\" />\n\
    \      </ItemsPanel.ItemsPanel>\n    </ItemsPanelTemplate>\n  </ItemTemplate>\n\
    \    </GridView>\n  </SemanticZoom.ZoomedOutView>\n  <SemanticZoom.ZoomedInView>\n\
    \    <GridView x:Name=\"ZoomedInGridView\" HorizontalAlignment=\"Left\" Margin=\"\
    45,70,0,1\" VerticalAlignment=\"Top\" MinWidth=\"200\" ItemTemplate={StaticResource\
    \ BookTemplate}\">\n    </GridView>\n  </SemanticZoom.ZoomedInView>\n</SemanticZoom>\n\
    ```"
  merge: -1
  pgno: 146
