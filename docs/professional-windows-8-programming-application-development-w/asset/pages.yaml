  md: 'content. Of course, the best way to gain an understanding of how to use the
    Application Bar is to just dive right in and add it to your own application.


    You can create a sample project that makes use of both Application Bar scenarios.


    # Creating the Top App Bar Navigation


    For this app enable users to view three categories of Wrox Press books. After
    users navigate to a particular category, they can perform actions such as sorting
    and filtering the list of books. In the end, you should have something similar
    to Figure 4-2. To create this app, follow these steps:


    ![](img/2cea804c0281668ba7d119c3e0ce780e_156_0.png)


    FIGURE 4-2


    +   1. Create a new blank Windows Store project called AppBar in Visual Studio
    2012.


    +   2. Add new pages to the project using the BlankPage item template. Call them
    Home.xaml, AspBooks.xml, SqlServer.xml, and CSharp.xml, respectively.


    +   3. With the new pages added, you need to set up the main screen, which includes
    the top and bottom Application Bars.


    > NOTE The AppBar is an object that resides in every Page object in Windows 8.
    Every page can essentially have its own AppBar implementation. However, because
    the top bar is supposed to assist with navigating through an application, it''s
    best to implement it on the main page of your app and add an additional Frame
    to hold the rest of your applications pages. It might sound a little complex,
    but it''s not too difficult. This setup works a lot like Master Pages in ASP.NET
    world.'
