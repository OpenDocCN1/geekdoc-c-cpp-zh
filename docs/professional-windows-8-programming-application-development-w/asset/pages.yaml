- img_proc: true
  md: 'LocalSettings is an object of ApplicationDataContainer type, representing the
    local data store. Settings can be accessed by a key. If the setting doesn''t exist,
    it''s created dynamically by the dictionary. This approach simplifies the code
    and error handling.


    # Simple Settings


    The following code snippet creates a Hello World setting and assigns a string
    to it. You can then retrieve the string from the Values collection and remove
    the setting from collection using the Remove method. This snippet shows basic
    settings usage:


    ```

    var localSettings = ApplicationData.Current.LocalSettings;


    // Save local setting

    localSettings.Values["HelloWorld"] = "Hello World";

    // Retrieve local setting

    var value = localSettings.Values["HelloWorld"];


    // Remove local setting

    localSettings.Values.Remove("HelloWorld");

    ```


    # Composite Settings


    If you need more complex data that can be updated atomically, you can create composite
    settings. Composite settings are an instance of the ApplicationDataCompositeValue
    class. You can store settings in local or roaming data stores. The snippet that
    shows how to use composite settings:


    +   - Settings


    ```

    var localSettings = ApplicationData.Current.LocalSettings;

    ApplicationDataCompositeValue composite = new ApplicationDataCompositeValue();

    composite["MyIntegerValue"] = 1;

    composite["MyStringValue"] = "String";

    localSettings.Values["MyCompositeSetting"] = composite;

    ```


    # Working with Containers


    Sometimes you may need to organize your settings hierarchically, similar to folders
    in the filesystem. Windows Storage provides the CreateContainer method to create
    settings in containers. The enumeration value ApplicationDataCreateDisposition.Always
    is provided as an argument to the method to indicate whether to create it if it
    doesn''t exist. The snippet shows how to use a container:


    ```

    var localSettings = ApplicationData.Current.LocalSettings;


    // Create a container

    var container = localSettings.CreateContainer("MyContainer",

    ApplicationDataCreateDisposition.Always);


    // Assign value

    container.Values["MyContainer"] = "Hello World";

    ```'
  merge: -1
