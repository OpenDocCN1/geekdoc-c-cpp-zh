  md: "# Canvas\n\nSo, both of the main layout controls in XAML that you have seen\
    \ use a form of relative positioning. This type of positioning enables table-like\
    \ layouts that properly adjust based on screen size without you needing to add\
    \ any additional work. However, sometimes you might find a particular need to\
    \ use an approach closer to absolute positioning of your controls. In case, you\
    \ want to drag and drop a control and have it there regardless of what happens\
    \ to the screen size or other objects around it. For example, you may be creating\
    \ a painting program and need to allow a specific drawing of objects on the screen.\
    \ Obviously, a Grid or StackPanel cannot provide you with the capabilities you\
    \ want.\n\nFor these absolute positioning type scenarios, use the Canvas control,\
    \ which is a simple control that works like a paint canvas. Instead of relying\
    \ on the Margin and various alignment properties of the controls that are dropped\
    \ on it, the Canvas uses Top and Left to determine where the objects should display\
    \ on the screen. In 2-9 you will see that TextBlock controls have been dropped\
    \ onto a Canvas control. The Top and Left properties position the objects exactly\
    \ where you want on the screen.\n\n![](img/2cea804c0281668ba7d119c3e0ce780e_96_0.png)\n\
    \n**Figure 2-9** The following code shows the required XAML for this layout. You\
    \ can use the attached properties Canvas.Top and Canvas.Left to actually position\
    \ the objects inside the Canvas.\n\n```\n<Canvas Grid.Row=\"1\">\n  <Button Content=\"\
    Positioned Button\" Canvas.Left=\"1165\" Canvas.Top=\"478\"/>\n  <TextBlock Canvas.Left=\"\
    154\" Text=\"Positioned Text\" Canvas.Top=\"142\" FontSize=\"24\"/>\n  <TextBlock\
    \ Canvas.Left=\"425\" Text=\"Positioned Text\" Canvas.Top=\"116\" FontSize=\"\
    24\"/>\n  <TextBlock Canvas.Left=\"317\" Text=\"Positioned Text\" Canvas.Top=\"\
    458\" FontSize=\"24\"/>\n</Canvas>\n```\n\nAnother possible use for the Canvas\
    \ is if you want to create a simple game for Windows 8. The Canvas control gives\
    \ you an area to place shapes and images, and because of the attached Left and\
    \ Top properties, it gives you any way to move them in code."
