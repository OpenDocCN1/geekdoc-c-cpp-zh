  md: '# UNDERSTANDING MVVM


    Model-View-ViewModel (MVVM) is a design pattern primarily used with XAML-based
    applications, such as Windows Presentation Foundation (WPF), Silverlight, and
    Windows Phone. It has strong similarities with Model-View-Controller (MVC) and
    Model-View-Presenter (MVP), but it''s designed specifically for XAML applications.
    It consists of three elements:


    +   - Model: This is the representation of persistent or external data and is
    usually entities, as a row in database apps or a deserialized JSON object from
    the web.

    - View: This is the user interface presented to the user.

    - ViewModel: This is the model for the view, an abstraction of the view, which
    provides a view-oriented representation of the model. It becomes the link between
    the view and the model and provides conversion from model content for the view
    to consume. It is exposed as properties and commands from the view model, which
    the binder uses in the framework.


    It starts with the View. When it loads a reference to its associated ViewModel
    using a locator described in the following section or an existing instance of
    ViewModel passed to it. View binds to properties and actions (commands) that the
    ViewModel provides. These bindings enable the creator of the View to focus on
    the user experience (UX) rather than the code behind. This enables UX and graphics
    designers to help build the user interface along with the developer while the
    developers work on the guts of the app.


    The big player out of the three is ViewModel, which can have one or more classes
    for each View. The binder (BindingMarkupExtension) is the glue that connects the
    View to the Model. The View has a reference to the ViewModel, the ViewModel has
    no reference or information about the View. This enables multiple Views to share
    the same ViewModel and enables to easily test the ViewModel because it has no
    dependency on the UI. This decoupling of the UI from the logic is one of the main
    benefits of MVVM.


    ViewModels generally share a common base class that provides an implementation
    of INotifyPropertyChanged along with additional helper methods. Listing 10-1 shows
    a simple ViewModelBase class that Views can implement. It provides methods setting
    the value of a backing field and raising the PropertyChanged event.


    # LISTING 10-1: ViewModelBase.cs


    ```

    using System;

    using System.Collections.Generic;

    using System.ComponentModel;

    using System.Linq;

    using System.Runtime.CompilerServices;

    using System.Text;

    using System.Threading.Tasks;


    namespace ArtistBrowser.ViewModels

    ```'
