    # Opening Developer Account


    Before you submit apps to the Windows Store, you need to register a developer
    account. This account and publisher name will be used in your project''s manifest
    when you associate your app with the app created in the Windows Store.


    # Reserving App Name


    Even though the Windows Store enables long names, up to 256 characters, it''s
    recommended to use shorter names for your apps. There are several reasons for
    this: It''s harder to read a long name, especially when it displays in a space-constrained
    search listing.


    For example, the Windows Store limits its catalog search list to 15-wide characters
    displayed, the app listing limits to 23-wide characters in full screen and full
    mode, but when users view it in snapped mode, it''s 17-wide characters.


    Tile size also limits what can display, and knowing these constraints may help
    you achieve a better reach for your apps.


    You can reserve app names in other languages; then when you publish a localized
    version, you can use that name.'
