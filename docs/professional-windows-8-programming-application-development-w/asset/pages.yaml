  md: 'For example, when flying in the eastern United States, the isogenic line would
    need to be 15°W, and the true north heading would need to be calculated by adding
    the magnetic variance. If you fly a heading of 241° magnetic, the resulting true
    north heading would be 256°.


    It is obviously clear for pilots to know when to add or subtract the magnetic
    variance; therefore, during flight student pilots would thank the mnemonic "East
    is least and West is best." Using the mnemonic to remember that if the isogenic
    is 15°E you would subtract the magnetic variance, and if it is 15°W you would
    add the magnetic variance.


