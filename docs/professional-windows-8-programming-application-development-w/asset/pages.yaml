  md: '# Windows Store Economics


    TABLE 11-1: Windows Store Business Advantages

    | | WINDOWS | IOS | ANDROID |

    | Your revenue share $1,000,000 | $779.5K | $700K | 700K |


    Compared with other platforms, the bigger size of the Windows market and its lower
    commission above $25K in revenues means that the Microsoft Store enables you to
    reach your economic target much faster. Windows Store is designed for scale: if
    your app makes more than $25K in revenues, you''ll be taking a significantly larger
    percentage of revenues than that of the competing stores—80 percent of 70 percent.


    The Windows Store enables you to use any of the following monetization models,
    including third-party commerce:


    +   - One-time purchase: With the one-time purchase model, your customer is charged
    only once, either full price ahead, or with a limited time or a featured trial.

    - Multiple purchases over time: You can set a time limit on any of the products
    the customer buys within your app, for example renting a video over time. Alternatively,
    you can have purchases that never expire.

    - Ad Supported model: You can have a trial version of your app supported by ads,
    and after the user buys your app, the ads are disabled. The ad supported model
    may be based on the Microsoft Advertising SDK or on your own ad system.


    +   - Existing commerce: Alternatively, you can use your existing commerce, taking
    advantage of existing relationships, subscription systems and purchases.


    > Trials make a difference. From lessons I learned with my apps for Windows Phone,
    trials significantly drive downloads and revenue. My average conversion rate is
    10 percent. With trials, you may get a significant increase in the number of downloads
    and revenue. The actual results vary for your app.


    # Windows Store API Overview


    All types you need to interact with the Windows Store are defined in the ApplicationModel.Store
    namespace. This namespace also includes a simulator object, CurrentAppSimulator,
    which enables you to develop your apps without adding real products or interacting
    with the actual store.'
