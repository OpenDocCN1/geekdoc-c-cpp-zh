  md: '# TestingWebSockets


    WebSocket protocol (RFC 6455) is layered over TCP and provides a mechanism for
    two-way communication between the client and the server. The protocol implements
    an HTTP handshake, which makes it suitable for web servers and browser clients
    such as Windows Store apps. Unlike the full HTTP, WebSocket is intended mostly
    for server/application communication.


    Windows 8 provides two types of WebSockets. The main distinction is that one type
    of socket supports large binary-only messages (StreamWebSocket), and another supports
    UTF-8 and binary messages of smaller size (MessageWebSocket), as Table 6-4 illustrates.


    Table 6-4: WebSockets


    | CLASS | DESCRIPTION |

    | --- | --- |

    | MessageWebSocket | These regular-sized messages enable acknowledgments that
    the message was received. They resemble UDP sockets (UTF8 and binary). |

    | StreamWebSocket | Binary only. These work for large messages, such as media,
    including partial messages. They resemble TCP sockets.


    Figure 6-5 shows the WebSockets sample app connecting to the echo WebSocket server.


    ![](img/2cea804c0281668ba7d119c3e0ce780e_238_0.png)


    Figure 6-5


    To test WebSocket, you can use the ws://echo.websocket.org echo service or the
    sample WebSocketServer included with the project. The WebSocketServer project
    implements a small echo service as an HTTP handler. The server checks whether
    the incoming request is a WebSocket request and processes it by echoing the message
    that was sent to the client.


    To start this example, in Visual Studio open the Data Samples solution.'
