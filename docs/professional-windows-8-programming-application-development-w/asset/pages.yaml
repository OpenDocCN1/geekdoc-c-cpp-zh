  md: '# Selling Your Apps


    > NOTE CurrentApp won''t work in your code until you submit the app to the store.
    You need to use CurrentAppSimulator to develop and test your licensing. After
    you finish development and testing, but before you submit your app to the store,
    you need to replace CurrentAppSimulator with CurrentApp, or your app will fail
    certification. When using the CurrentAppSimulator, the initial licensing is described
    in the XML file you can load with the ReloadSimulatorAsync method.


    If you don''t want to manually search and replace CurrentAppSimulator with the
    CurrentApp, you can always use conditional directives, as if #if ! #else #endif.
    For example:


    ```

    #if !RELEASE

    using CurrentAppStore = Windows.ApplicationModel.Store.CurrentAppSimulator;

    #else

    using CurrentAppStore = Windows.ApplicationModel.Store.CurrentApp;

    #endif

    ```


    Table 11-2 shows classes in the Windows Store API.


    | FILE | TASK |

    | --- | --- |

    | CurrentApp | Gets license and listing information for the current app and in-app
    purchases. |

    | CurrentAppSimulator | Provides simulated, development, and testing tests for
    the Windows Store. This includes loading licenses from XML files. |

    | License Information | Provides access to the app''s license. |

    | ListingInformation | Provides access to listing information in the store. |

    | ProductLicense | In-app offer license. |

    | ProductListing | In-app offer listing information. |


    # Getting Started with the Color Shopping App


    The Color Shopping app demonstrates how to use Windows Store API to unlock trials,
    handle in-app purchases and test the app by using a Windows Store proxy. It also
    introduces a handy licensing data model you can reuse in your apps.


    To begin with the Color Shopping app, you need Windows 8 with Visual Studio 2012.
    The app illustrates some of the important and advanced concepts of building apps
    for the Windows Store API. Figure 11-3 shows a screenshot of the Color Shopping
    app.'
