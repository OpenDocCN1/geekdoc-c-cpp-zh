  md: "# Your Pricing App\n\nRemember when you initialized your app license in the\
    \ Code Shopping example, your app was in trial mode? If you give any app price,\
    \ except Free in Selling Details, you can enable Trial mode in your app. There\
    \ are several options for trial: with expiration in 1, 7, 15, 30 days and a never-expiring\
    \ trial.\n\nBecause your proxy license file has the same schema as the license\
    \ object in the Windows Store, and IsTrial elements are what you have effectively\
    \ set in the Windows Store. Take a look at the InAppPurchaseLicense.xml and Triallicense.xml\
    \ included in your application example for a simulation of options in the Windows\
    \ Store.\n\n```\n<?xml version=\"1.0\" encoding=\"utf-16\" ?>\n<CurrentApp>\n\
    \  <ListingInformation>\n    <App>\n      <Id>a8695030-29b8-45c4-8a55-a16471bb104</Id>\n\
    \      <LinkUri>http://apps.microsoft.com/app/a8695030-29b8-45c4-8a55-a16471bb104</LinkUri>\n\
    \      <CurrentMarket>en-US</CurrentMarket>\n      <AgeRating>3</AgeRating>\n\
    \      <MarketData lang=\"en-us\">\n        <NameCatalog>Catalog Shopping</NameCatalog>\n\
    \        <Description>Catalog Shopping Sample App</Description>\n        <Price>4.99</Price>\n\
    \        <CurrencySymbol>$</CurrencySymbol>\n      </MarketData>\n    </App>\n\
    \  </ListingInformation>\n  <LicenseInformation>\n    <App>\n      <IsActive>true</IsActive>\n\
    \      <IsTrial>false</IsTrial>\n    </App>\n  </LicenseInformation>\n</CurrentApp>\n\
    ```\n\n# Creating Screenshots and Promotional Images\n\nThe importance of screenshots\
    \ and promotional images was previously discussed: Remember that the goal is to\
    \ make your app look good. Windows apps run at different resolutions. If you have\
    \ the store logo, splash screen, and wide and band logo are required at 100 percent\
    \ resolution. Optionally, you can provide images at different resolution factors:\
    \ 80 percent, 100 percent, 140 percent and 180 percent. This is called scaling\
    \ to pixel density.\n\nFor example, a square logo is 150x150 pixels. This is a\
    \ 100-percent resolution. Optionally, you can provide the logo at 80 percent:\
    \ 120x120, and 140 percent: 210x210, and 180 percent: 270x270.\n\nThere’s a naming\
    \ convention for scaled images: You can either add a suffix to the image, for\
    \ example, logo.scale-140.png, or use a folder convention and place scaled images\
    \ in a folder, like so: \\\\scale-140\\logo.png."
