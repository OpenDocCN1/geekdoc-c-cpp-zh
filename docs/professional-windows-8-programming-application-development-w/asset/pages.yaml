    # # Understanding Windows.Storage API


    Windows provides a new .Storage namespace, which contains types for storage and
    data-related operations and accessing data. You use this API any time you want
    to write or read application settings, store data in files, or access content
    from user libraries. For example, use this API for documents, music, pictures,
    videos, managing cached data, and downloads.


    Table 6-2 shows most classes you''ll use from the .Storage namespace as part of
    this chapter.


    # TABLE 6-2: Windows.Storage API


    | CLASS | DESCRIPTION |

    |---|---|

    | ApplicationData | Application data access is used throughout most examples in
    the chapter for local, roaming, and temporary data access. |

    | ApplicationDataCompositeValue | Provides access to related app settings handled
    atomically. See the examples that follow for composite containers. |

    | ApplicationDataContainer | Represents a container of app data. |'
