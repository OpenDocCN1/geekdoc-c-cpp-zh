  md: '# Debugging File Picker Activation


    As developers, we often need to debug our apps to isolate and resolve issues with
    the code we''ve written. When Windows Store apps are activated using File Picker
    Activation (as well as other methods of activation explored in this chapter) you
    must indicate to Visual Studio instead of launching the app it should debug code
    when it starts. To do so, follow these simple steps:


    +   1. Open the Debug tab in the properties Window for the SkyDrive Photos app.


    +   2. Select the "Do not launch, but debug code when it starts" check box under
    the Start Action heading in 9-5. Using this option, Visual Studio allows you to
    place, and subsequently, breakpoints in the overridden OnFilePickerActivated method.


    ![](img/2cea804c0281668ba7d119c3e0ce780e_308_0.png)


    Figure 9-5


    +   3. With Visual Studio configured to debug file picker activation, open the
    PhotoChooser app, and click one of the two buttons to select a single photo or
    multiple photos.


    +   4. Select the SkyDrive Photos app as the location from which you want to select
    the photos. Any breakpoints in the SkyDrive Photos app will be hit.


    > NOTE You can insert breakpoints in Visual Studio by placing the cursor on the
    given line of code and pressing F9. Pressing F9 again removes the breakpoint.
    Breakpoints can be disabled by pressing Ctrl+F9.


    +   5. With the option "Do not launch, but debug code when it starts" selected
    within the project properties, you can now start debugging by pressing F5. The
    app does not launch; but rather the debugger prepares to debug the app when it
    is activated.'
