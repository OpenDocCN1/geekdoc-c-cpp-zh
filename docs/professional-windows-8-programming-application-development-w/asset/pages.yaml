  md: "provide a user interface to easily control the media. It does however offer\
    \ methods that can easily create your own playback functionality. The following\
    \ code shows out XAML that adds several playback buttons to the user interface\
    \ to control the MediaElement playback. Button control uses an event handler to\
    \ handle the appropriate method for the MediaElement for each required playback.\n\
    \n```\n<MediaElement x:Name=\"MediaMain\" Source=\"http://media.ch9.ms/ch9/bf13/ff35a0ad-53ab-4332-9420-cc7ff2d4bfb13/TWC69July132012_Source.wmv\"\
    \nWidth=\"0.05\" AutoPlay=\"False\" VerticalAlignment=\"Left\"\nMargin=\"0,0,0,0\"\
    >\n<Button x:Name=\"Play\" Content=\"Play\" VerticalAlignment=\"Top\"\nMargin=\"\
    0,0,0,0\" Width=\"120\" Click=\"Play Click\"\n<Button x:Name=\"Stop\" Content=\"\
    Stop\" VerticalAlignment=\"Top\"\nMargin=\"0,0,0,0\" Width=\"120\" Click=\"Stop\
    \ Click\"\n<Button x:Name=\"Rewind\" Content=\"Rewind\"\nVerticalAlignment=\"\
    Top\" Margin=\"0,0,0,10\" Width=\"120\" Click=\"Rewind Click\"\n<Button x:Name=\"\
    FastForward\" Content=\"Fast Forward\"\nVerticalAlignment=\"Top\" Margin=\"0,0,0,10\"\
    \ Click=\"FastForward Click\"\n</StackPanel>\n```\n\nNow that you have some buttons\
    \ created to trigger the appropriate event handlers, you need code to implement\
    \ each of these actions on the MediaElement. The following code for the Fast Forward\
    \ and Rewind operations, you need code for each of these methods. First check\
    \ the CanSeek property before attempting to move the current Position of the media\
    \ because all media files support seeking operations.\n\n```\nprivate void Play_Click(object\
    \ sender, RoutedEventArgs e)\n{\n    MainMedia.Play();\n}\n\nprivate void Stop_Click(object\
    \ sender, RoutedEventArgs e)\n{\n    MainMedia.Stop();\n}\n\nprivate void Rewind_Click(object\
    \ sender, RoutedEventArgs e)\n{\n    if (MainMedia.CanSeek)\n    MainMedia.Position\
    \ = MainMedia.Position.Subtract(new TimeSpan(0, 0, 10));\n}\n\nprivate void FastForward_Click(object\
    \ sender, RoutedEventArgs e)\n{\n    if (MainMedia.CanSeek)\n    MainMedia.Position\
    \ = MainMedia.Position.Add(new TimeSpan(0, 0, 10));\n}\n```"
