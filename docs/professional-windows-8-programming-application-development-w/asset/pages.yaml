    +   In the SortBooks_Click event handler, the first thing you do is create an
    instance of the Popup. Then you add a UICommand objects to the Commands collection
    of the menu. All the UICommand does is provide you with a way to run code when
    the option is touched/clicked by the user.


    +   Each command uses a lambda expression to run the appropriate event handling
    code, which in this case adds a filtered or sorted view of the Books collection
    to the FilteredBooks collection to the GridView. After the commands are set up,
    you will need to actually display the menu.


    In Windows 8 the menu cannot interfere with anything else going on in the app,
    so it must be displayed asynchronously. By calling the ShowForSelectionAsync method
    — as shown in the following code — with the await key, you can ensure that this
    operation happens asynchronously:


    ```

    await sortMenu.ShowForSelectionAsync(GetMenuRectangle((FrameworkElement)sender));

    ```


    The only catch is that you must pass in the rectangle of the Button that the menu
    should be displayed above. The GetMenuRectangle is a helper method that simply
    extracts the bounding Rectangle of the Button that was clicked so that it can
    be used to track where the menu should display.


