  md: "3. After you click the Add button, a new folder appears in the project called\
    \ Themes. In this folder you can find a file called Generic.xml. This is where\
    \ you place the default XAML for the control you want to create. Because you want\
    \ to re-create the item display from the previous examples, just copy and paste\
    \ the XAML code from the DataTemplate into this folder with a couple of small\
    \ tweaks.\n\nListing-31 shows the updated Generic.xml file that holds the XAML\
    \ code to display the thumbnail, the title, and other.\n\n> Note Instead of using\
    \ a DataTemplate, this time you actually create a Style and set the Target to\
    \ BookDetails, which is the type of your custom control.\n\n```\n<ResourceDictionary\n\
    xmlns=\"http://schemas.microsoft.com/winfx/2006/xaml/presentation\"\nxmlns:x=\"\
    http://schemas.microsoft.com/winfx/2006/xaml\"\nxmlns:local=\"local:CustomControls\"\
    >\n\n<Style Key=\"BookTitle\" TargetType=\"TextBlock\">\n  <Setter Property=\"\
    FontFamily\" Value=\"Segoe UI\"/>\n  <Setter Property=\"FontSize\" Value=\"18\"\
    />\n</Style>\n\n<Style Key=\"AuthorStyle\" TargetType=\"TextBlock\">\n  <Setter\
    \ Property=\"FontFamily\" Value=\"Segoe UI\"/>\n  <Setter Property=\"FontSize\"\
    \ Value=\"14\"/>\n</Style>\n\n<Style TargetType=\"local:BookDetails\">\n  <Setter\
    \ Property=\"Template\">\n    <Setter Value=\"\n      <ControlTemplate TargetType=\"\
    local:BookDetails\">\n        <Grid Margin=\"10\">\n          <StackPanel Orientation=\"\
    Horizontal\">\n            <Image Source=\"{TemplateBinding ThumbnailImage}\"\
    \ Height=\"60\" Width=\"60\" Margin=\"0,0,10,0\"/>\n            <StackPanel Margin=\"\
    0,0,0,0\">\n              <TextBlock Style=\"{StaticResource BookTitle}\" Text=\"\
    {TemplateBinding BookTitle}\" />\n              <TextBlock TextWrapping=\"Wrap\"\
    \ Style=\"{StaticResource AuthorStyle}\" Text=\"{TemplateBinding BookAuthor}\"\
    \ />\n            </StackPanel>\n          </StackPanel>\n        </Grid>\n  \
    \    </ControlTemplate>\n    \"/>\n  </Setter>\n</Style>\n</ResourceDictionary>\n\
    ```"
