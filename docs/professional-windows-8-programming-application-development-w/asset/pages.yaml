    You can register a Windows Store app to be the default handler for a given URI
    scheme name. When registered as the default handler for a URI scheme, your app
    activates every time that type of URI launches. As an example of where protocol
    activation could be useful, consider the use of the Share Contract. In Figure
    9-21, the app enables users to share maps using the Share Contract. The Maps app
    enables recipients of the e-mail to open the map in the browser if they use Windows
