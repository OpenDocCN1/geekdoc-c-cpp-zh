  md: "# CHAPTER 12 PUTTING IT ALL TOGETHER: BUILDING A WINDOWS STORE APPLICATION\n\
    \nLISTING 12-8 (continued)\n\n```\nprivate void HandleBookSelected(BookSelectedMessage\
    \ message) {\n    if (_initialLoad == false && message.Selected != null) {\n \
    \       this.Frame.Navigate(typeof(BookDetailPage));\n    } else {\n        _initialLoad\
    \ = false;\n    }\n}\nprivate void HandleGroupSelected(GroupSelectedMessage message)\
    \ {\n    this.Frame.Navigate(typeof(GroupDetailPage));\n}\nprivate void MainGridView_Loaded(object\
    \ sender, RoutedEventArgs e) {\n    MainGridView.SelectedIndex = -1;\n}\nprivate\
    \ void MainListView_Loaded(object sender, RoutedEventArgs e) {\n    MainListView.SelectedIndex\
    \ = -1;\n}\n```\n\nThere are a few key points to take away from this:\n\n+   -\
    \ The MainGrid_Loaded and MainList_Loaded event handlers are used to set the SelectedIndex\
    \ to -1, which cancels initial selection that the CollectionViewSet creates, which\
    \ does cause a problem. Setting that index effectively frees a SelectedItem change,\
    \ which in turn causes navigation to take place — which is not good. The previous\
    \ code uses a variable that tracks whether this is the first time the SelectedItem\
    \ is set and, if so, it ignores because it is -1 or not. Otherwise, the HandleBookSelected\
    \ method performs the navigation to the BookDetailPage.\n- The other important\
    \ code which would be familiar is when a user navigates to this page, you need\
    \ to register for any new messages — in this case BookSelectedMessage and GroupSelectedMessage.\
    \ The GroupSelectedMessage is handled by the HandleGroupSelected method and simply\
    \ navigates to the GroupDetailPage.\n- When the user navigates away from this\
    \ page, you must unregister for any messages; otherwise, you run the risk of handling\
    \ duplicate messages the next time the page loads.\n\nIf you now build and run\
    \ the app in the Simulator, you should see groups of books loaded, as shown in\
    \ Figure 12-4."
