    # A Basic Example


    Creating Toast messages for your app basically involves replacing the src value
    of the image tag and inserting a message in the text. You can do this using the
    standard XML management classes of WinRT. This section shows how to build a basic
    toast notification from scratch. All you do here is add a few Controls that when
    pressed show a few different style toast notifications. One becomes basic, a Basic
    with a thumbnail image, and the last allows the default toast sound plays.


    # Creating A Basic Toast Notification


    To create toast, just follow these steps:


    +   1. Create a new project in Studio 2012 using the BlankApp project template,
    and call it Notifications.

    2. With the project opened the MainPage.xaml file, and replace the contents with
    the XAML shown in 4-9.


    # LISTING 4-9: MainPage.xaml


    ```

    <Page

    :Class="Notifications.MainPage"

    xmlns="http://schemas.microsoft.com/winx/2006/xaml/presentation"

    xmlns:x="http://schemas.microsoft.com/winx/2006/xaml"

    xmlns:local="using:Notifications"

    xmlns:d="http://schemas.microsoft.com/expression/blend/2008"

    xmlns:mc="http://schemas.microsoft.com/markup-formats/markup-compatibility"

    mc:Ignorable="d"


    <Grid Background="StaticResource ApplicationPageBackgroundThumb">

    <StackPanel Margin="0" VerticalAlignment="Center">

    <Orientation="Horizontal" HorizontalAlignment="Center">

    <Button Content="Show Toast Notification" Margin="0,0,20,0" VerticalAlignment="Center"

    Click="ShowToast_Click"/>

    <Button Content="Show Toast With Image" Margin="0" VerticalAlignment="Center"

    Click="ShowToastImage_Click"/>

    <Button Content="Show Toast With Alternate Sound"

    </Orientation>

    <HorizontalAlignment="Center" Margin="0,0,0,0" VerticalAlignment="Center"

    Click="ShowToastSound_Click" />

    </StackPanel>

    </Grid>

    </Page>

    ```


