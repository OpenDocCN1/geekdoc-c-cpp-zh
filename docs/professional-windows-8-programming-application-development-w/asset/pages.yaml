    using System.Text;\nusing System.Threading.Tasks;\nusing WboxStore.Data;\n\nnamespace\
    \ WboxStore.Messages\n{\n    public class GroupSelectedMessage\n    {\n      \
    \  public GroupedBookList Selected { get; set; }\n\n        public GroupSelectedMessage(GroupedBookList\
    \ selected)\n        {\n            Selected = selected;\n        }\n    }\n```"
