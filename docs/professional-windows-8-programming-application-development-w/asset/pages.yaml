  md: 'When this occurs or the stop responding, Windows 8 asks the user for consent
    to send a problem report, which is visible in the Windows Dev Center under the
    Quality page, so such issues can be evaluated and fixed.


    # App Removal


    When an app is uninstalled by the user, the app is removed along with all its
    local data. This does not remove any files created by the app in other locations
    such as Documents, Pictures, or SkyDrive.


    # BACKGROUND OPERATIONS


    As mentioned earlier, when apps suspend, they can no longer execute code. However,
    there are a few special cases in which an app can continue to run in the background.
    Each of these have been lifted directly from the Windows Phone. The four basic
    background tasks follow:


    +   * Playing audio

    * Transferring files

    * Updating data via push notifications

    * Sharing data with other apps


    These background tasks are given a limited amount of system resources; therefore,
    they should not perform intensive or long-running tasks. Each app is given a quota
    of up to one second of CPU time every hours unless the app is on lock. These apps
    are given up to two seconds of CPU every 15 minutes. Any used time does not accumulate
    across intervals. If the app is in the foreground while the background task is
    triggered, it has no quota applied. Network resources are constrained based on
    the amount of energy used by the network interface unless the device is on AC
    power.


    > NOTE CPU is the amount of actual time the CPU is used by the app rather than
    clock time. For example, if the background task waits for a response a remote
    server, it does not use the CPU, so the time spent waiting for the response isn''t
    counted against the CPU quota.


    Background tasks should not rely on user interaction and shouldn''t display any
    UI other than toast notifications, tiles, or badges. A background task has one
    external trigger that indicates the task should run, and optional conditions,
    which must be true for the task to run when triggered. To add a background task
    to a project, follow these steps:


    +   * Add a new Windows Runtime Component to the solution.

    * Add a reference to this project in the main app project.

    * Add the background task declaration to the main app project, and allow the supported
    tasks used by the app, as shown in Figure 5-8.

    * Create a new sealed class for the task, and implement IBackgroundTask, as shown
    in Listing 5-7.'
