  md: "By default none of the toast templates contain an <audio> tag, so if you accessing\
    \ and altering the previous <text> and <image> tags, you won't have much luck.\
    \ It is, however, included in the official toast message schema, to support it\
    \ in this example, you simply add the new node to the <toast> tag. To do so, follow\
    \ these steps:\n\n+   1. Modify the ShowToastSound_Click event handler to match\
    \ the following code, and notice the syntax used to point to the wanted Windows\
    \ 8 audio file.\n\n```\nprivate void ShowToastSound_Click(object sender, RoutedEventArgs\
    \ e)\n{\n    ToastNotificationManager.GetTemplate(ToastTemplateType.ToastText01);\n\
    \    IXmlNode mainNode = template.SelectSingleNode(\"/toast\");\n    XmlElement\
    \ sound = template.CreateElement(\"audio\");\n\n    sound.setAttribute(\"src\"\
    , \"ms-winsoundevent:Notification.Reminder\");\n    mainNode.AppendChild(sound);\n\
    \n    ToastNotification toast = new ToastNotification(template);\n    ToastNotificationManager.CreateToastNotifier().Show(toast);\n\
    }\n```\n\n+   2. Build and run the app on the PC.\n\n+   3. Click the third toast\
    \ button; you will see the toast message and a slightly different audio sound\
    \ being played.\n\nThe support for toast notifications built into Windows 8 and\
    \ the development methods available in WinRT make it simple to provide important\
    \ notifications to your users, even when your app is not currently at the forefront\
    \ of the user. Again, ensure that only important information is used for this\
    \ feature because you don't want to annoy users or distract them from working\
    \ on what they are currently involved in.\n\n# CREATING LIVE TILES\n\nIn previous\
    \ versions of Windows, when an application was installed a custom icon was placed\
    \ in the Start Menu or the Desktop that when clicked, started your app. For the\
    \ most part little time was spent designing this because it didn't serve any function\
    \ other to provide users with a way to run the app. In Windows 8, however, this\
    \ is no longer the case. Windows Store Apps are not installed just with a plain,\
    \ ordinary icon but rather use a concept called Live Tiles. Although you can make\
    \ these static images showing your company or app logo, you can also use them\
    \ to provide the user with real-time information from your app. Dynamic types\
    \ of tiles are called Live Tiles, and when implemented, they can make your app\
    \ stand out from other apps. Of course, by now you are familiar with Tiles because\
    \ you're confronted with them as soon as the operating system starts. Figure 4-7\
    \ shows the all-important Start Screen (when filled with properly implemented\
    \ Live Tiles) can serve as a dashboard, allowing the user to see what's going\
    \ on the various apps installed."
