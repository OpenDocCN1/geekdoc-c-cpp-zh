  md: "Note the use of the BookTitleStyle and BookAuthorStyle to handle the formatting\
    \ of the TextBlock controls. Those styles are declared in the same as DataTemplate\
    \ using the following code:\n\n```\n<Style x:Key=\"BookTitleStyle\" TargetType=\"\
    TextBlock\">\n  <Setter Property=\"FontFamily\" Value=\"Segoe UI Light\"/>\n \
    \ <Setter Property=\"FontSize\" Value=\"18\"/>\n</Style>\n```\n\n```\n<Style x:Key=\"\
    BookAuthorStyle\" TargetType=\"TextBlock\">\n  <Setter Property=\"FontFamily\"\
    \ Value=\"Segoe UI Light\"/>\n  <Setter Property=\"FontSize\" Value=\"14\"/>\n\
    </Style>\n```\n\nIn this example, it's easy to just include this XAML in the Page.Resources\
    \ level. As you can see, an Image control is bound to the Thumbnail property of\
    \ the book object. The TextBlock also use data binding to display the Title and\
    \ Author accordingly.\n\nOne thing to think about is that in Chapter 2 (\"What\
    \ Is XAML?\") when you were introduced to the Image control, you simply set the\
    \ Source property to the property of the image file you wanted to use. When using\
    \ it in a data binding scenario (like this example), you can't bind a string path\
    \ to the file you want to use. Instead you need to bind to a property that returns\
    \ the type ImageSource for the property to display. List 3-10 shows the WrowBook\
    \ class with the Thumbnail property returns an ImageSource type.\n\n**LISTING\
    \ 3-10: Chapter 3DataBindingControls!DataListBox.cs**\n\n```\nusing Windows.UI.Xaml.Media;\n\
    \nnamespace DataBindingControls\n{\n    public class WrowBook\n{\n        public\
    \ string Title { get; set; }\n        public string Author { get; set; }\n   \
    \     public string Subject { get; set; }\n        public ImageSource Thumbnail\
    \ { get; set; }\n    }\n}\n```\n\nNow that you have an appropriate DataTemplate\
    \ for each item in the ListView, you can add some XAML for the ListView. In the\
    \ following code note how the ItemTemplate property is assigned to the DataTemplate\
    \ created previously.\n\n```\n<ListView x:Name=\"ListView\" Margin=\"20,20,0,0\"\
    \ Grid.Row=\"1\"\nVerticalAlignment=\"Top\" MaxWidth=\"400\" HorizontalAlignment=\"\
    Left\"\nItemTemplate={StaticResource BookTemplate}\"\nScrollView.VerticalScrollVisibility=\"\
    Auto\"\nBorderBrush=\"White\"\nBorderThickness=\"0\"\nScrollView.HorizontalScrollVisibility=\"\
    Disabled\" SelectionMode=\"Single\"\nSelectionChanged=\"MainListView_SelectionChanged\"\
    />\n```"
