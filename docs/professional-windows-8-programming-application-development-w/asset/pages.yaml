  md: '# 5


    # Application Life Cycle


    WHAT''S IN THIS CHAPTER?


    +   - Understanding and handling the Windows 8 life cycle


    +   - Implementing understand background operations


    WROX.COM CODE DOWNLOADS FOR THIS CHAPTER


    You can find wrox.com code downloads for this chapter at www.wrox.com/remtitle.cgi?isbn=1118205707
    on the Download Code tab, in the zip file 205709 C05.zip.


    # APPLICATIONS REBORN


    Microsoft says that Windows 8 is an OS of no compromise. This vision has even
    led it to rethink how the OS manages applications, resulting in a new way to hook
    into Windows, which provides a standard interface so that Windows can understand
    the needs of your applications rather than just let them run. This reimagining
    of how the OS interacts with applications significantly enhances the user experience
    for the applications and the device running them.


    # WHAT IS THE WINDOWS 8 LIFE CYCLE?


    In traditional desktop applications, the life cycle of an application is cut and
    dry. An application starts via a shortcut and runs until the user closes it or
    initiates a shutdown. While it is running, it has unregulated access to the processor,
    disk, and network resources. This model has worked great well since the dawn of
    PCs, but in the realm of mobile devices, this life cycle breaks down mainly because
    of battery life and heat concerns. Mobile operating systems, such as Windows Phone,
    limit when and how apps have access to system resources.'
  merge: -1
  pgno: 184
- img_proc: true
  md: 'Windows 8 borrows this life-cycle model because of the increased mobility of
    PCs such as laptops, ultrabooks, and tablets.


    Much like Windows Phone apps, Windows Store apps suspend when they are no longer
    used, yet remain in memory. Keeping them in memory ensures a seamless transition
    when they are reactivated without compromising battery life. However, if the PC
    runs low on memory? Luckily, Windows 8 takes care of this to free up memory when
    necessary. You can also close apps by terminating apps if you no longer need them:


    +   - Using a gesture with touch or a mouse: Swipe or drag, respectively, from
    the top of the screen to the bottom. When using a mouse, the cursor changes to
    a hand at the top of the screen indicating that you can drag the app. In both
    cases, the application is visibly picked up and moves along the gesture.


    +   - A keyboard shortcut: Keeping in tradition with Windows compatibility, Alt+F4
    still closes Windows Store apps when a keyboard is available.


    +   - Task Manager: Over the years, many users used this method and it continues
    to be useful for closing applications. Although there are several existing ways
    to open Task Manager, a new one has been added to Windows 8; Win+X is a quick
    way to open Task Manager along with many handy administration tools.


    > NOTE To comply with Store certification, your apps cannot include any UI elements
    that the class app.


    Figure 5-1 shows the new life cycle. The states an app can be in are the ApplicationExecutionState
    enumeration.


    ![](img/2cea804c0281668ba7d119c3e0ce780e_185_0.png)


    FIGURE 5-1


    # App Launch


    When an app first launches, Windows 8 displays a splash screen which ensures a
    fast and fluid transition while Windows loads the app. Windows dismisses it after
    the app is ready for interaction. The screen clearly shows which app is loading
    and showcases the app''s branding. To customize the splash screen, create a transparent'
  merge: -1
  pgno: 185
- img_proc: true
  md: 'PNG and choose a background color that clearly identifies your app. These are
    set in the package.appxmanifest on the SplashScreen element:


    ![](img/2cea804c0281668ba7d119c3e0ce780e_186_0.png)


    FIGURE 5-2


    ```

    <SplashScreen Image="Assets\SplashScreen.png" BackgroundColor="#000000" />

    ```


    > WARNING Although JPEG images are also supported, it is highly recommended that
    you use a transparent PNG instead, so the background color and image blend together
    smoothly. JPEG images may introduce artifacts and color variations.


    The Image attribute is a relative to a file or a resource reference to an image,
    which must be the required dimensions. When using the Visual Studio project templates,
    a default image is included under Assets\SplashScreen.png. To support additional
    scales for high DPI displays, you must include additional files decorated with
    scale identifiers as part of their names. The specific sizes for primary and the
    various splash screen images are shown in Table 5-1.


    # TABLE 5-1: SplashScreen Sizes


    | SCALE | SIZE | FILENAME |

    | --- | --- | --- |

    | Default | 620 x 300 | SplashScreen.png |

    | 100% | 620 x 300 | SplashScreen.scale-100.png |

    | 140% | 868 x 420 | SplashScreen.scale-140.png |

    | 180% | 1116 x 540 | SplashScreen.scale-180.png |'
  merge: -1
