    }\n}\n```\n\n# LOCATING VIEWMODELS\n\nA ViewModelLocator provides the concrete\
    \ instance of a given ViewModel and is roughly based off the service locator pattern,\
    \ which provides an abstract way of obtaining a service. ViewModelLocator can\
    \ be as simple as a class, as shown in Listing 10-2, which has properties for\
    \ all the ViewModels that need to be accessible, or it can be a more flexible\
    \ approach using an inversion of control (IoC) container that dynamically loads\
    \ the ViewModels.\n\n> NOTE IoC is a design pattern where an object is requested\
    \ from a container at runtime. The container returns a concrete type that is not\
    \ known at compile time. It decouples the implementation from the caller.\n\n\
    ```\nusing ArtistBrowser.Common;\nusing System;\nusing System.Collections.Generic;\n\
    using System.Linq;\nusing System.Text;\nusing System.Threading.Tasks;\n\nnamespace\
    \ ArtistBrowser.ViewModels\n{\n    public sealed class ViewModelLocator\n    {\n\
    \        public ViewModelLocator()\n        {\n        }\n\n        public GroupedItemsViewModel\
    \ GroupedItems\n        {\n            return Singleton<GroupedItemsViewModel>.Instance;\n\
    \        }\n    }\n}\n```"
