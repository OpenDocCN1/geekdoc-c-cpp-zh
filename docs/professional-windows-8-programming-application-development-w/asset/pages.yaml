    }\n\nvoid OnResuming(object sender, object e)\n{\n}\n\n```\n\n# # App Close\n\n\
    When an app is closed, it is suspended, and then terminated. The app is given\
    \ the opportunity to save application and user data by handling the Suspending\
    \ event. However, this should be done quickly because Windows 8 allows only approximately\
    \ 10 seconds to process this event. The next time the app launches, the Activated\
    \ event enables the app to determine how it was last terminated using PreviousExecutionState.\
    \ This is one of the values shown in Table 5-3.\n\nPERSISTING STATE\nIt is recommended\
    \ to save state locally when an app is suspending so that it is fast enough to\
    \ complete in the allotted time. The following list shows the app behavior given\
    \ the previous execution state:\n* CloseByUser: A new session opens. Occurs when\
    \ the app is closed by a user.\n* NotRunning: A new session opens. Occurs when\
    \ the app hasn't run in the current session or unexpectedly terminates.\n* Terminated:\
    \ The app loads the previous state. Occurs when Windows 8 closes the app due to\
    \ resource constraints or shutdown.\n\n# # App Crash\n\nIn the rare event that\
    \ an app crashes, the app should simply return to the Start screen rather than\
    \ provide any additional UI during the crash experience. This provides a common\
    \ behavior across all apps and prevents delaying the user with annoying warnings\
    \ or notifications. Because the app is no longer visible, the user knows that\
    \ something went awry."
