    \ shows how you can use the Geolocator class to determine the latitude and longitude\
    \ of the user (or rather the device) upon the Earth.\n\nYou might be asking: What\
    \ about devices without a GPS sensor? Can those devices determine their location?\
    \ The Geolocator class certainly uses a GPS sensor, if one is present, to determine\
    \ the location of the PC on the Earth; although, the Geolocator can use the network\
    \ information to determine your location.\n\n> Latitude and longitude are angles\
    \ that uniquely define points on a sphere such as the planet Earth. Together,\
    \ the angles define a coordinate system that can precisely identify geographic\
    \ positions.\n\n# Using the Geolocator Class\n\nIn this section, you will Visual\
