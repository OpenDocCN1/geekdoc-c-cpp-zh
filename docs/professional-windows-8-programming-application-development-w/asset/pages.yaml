  md: "# Selling Your Apps | 359\n\n```\n/// <param name=\"sender\">/>\n/// <param\
    \ name=\"e\">/>\nprivate async void purchase_Click(object sender, RoutedEventArgs\
    \ args)\n{\n  try {\n    // purchase the app\n    await CurrentAppSimulator.RequestPurchaseAsync(false);\n\
    \  } catch (Exception)\n{\n    // handle this exception if something goes wrong\n\
    \    // with the purchase\n  }\n}\n```\n\nThe purchase_Click event handler calls\
    \ the CurrentAppSimulator RequestPurchaseAsync method, which provides you with\
    \ an option to choose whether you want to simulate the app or return any of the\
    \ error codes back to the app. When you deploy your app, you'll need to replace\
    \ this with a call to CurrentApp. Figure 11-5 shows a dialog that simulates the\
    \ purchase.\n\nWhen license changes, for it expires, or the app gets, the store\
    \ calls the LicenseChanged event handler defined in your license data model:\n\
    \n```\npublic App LicenseChangedDataModel()\n{\n  if (CurrentAppSimulator.LicenseInformation.IsTrial)\n\
    \  {\n    CurrentAppSimulator.LicenseInformation.LicenseChanged += OnLicenseChanged;\n\
