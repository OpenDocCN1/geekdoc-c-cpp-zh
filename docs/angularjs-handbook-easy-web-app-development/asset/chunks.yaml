    In our directive element, we will leave the part which is to be transcluded. This
    is shown below:


    <foobar>


    <h2>{{c.getTitle()}}</h2>


    <p>{{mainC.getText()}}</p>


    </foobar>


    Consider the next example.


    We have a “<ul>” element for listing some data. This is shown below:


    <div>


    <h1>Foobars</h1>


    <ul>


    <li ng-repeat="foo in c.bars">


    <img ng-src="foo.imageUrl"/>


    {{file.text}}


    </li>


    </ul>


    </div>


    We need to perform the listing into its own component. A directive and a template
    file should be created for the component. This should be called in the directive
    as shown below:


    components/foobar_list/


    *   foobar_list_directive.js


    *   foobar_list.html


    The directive will create an inherited scope, and then reference the template
    which has been created. This is shown below:


    module.directive(''foobarList'', function() {


    return {


         scope: true,


         templateUrl: ''list.html''


    };


    });


    The template will be populated by copying the HTML file which has been populated
    from our original template. This is shown below:


    <ul>


    <li ng-repeat="foo in c.bars">


    <img ng-src="foo.imageUrl"/>


    {{file.text}}


    </li>


    </ul>


    A new instance of this component can then be used in the original template. It
    will replace the markup which has been created. This is shown below:


    <div>


    <h1>Foobars</h1>


    <ul>


    <li ng-repeat="foo in c.bars">


    <img ng-src="foo.imageUrl"/>


    {{file.text}}


    </li>


    </ul>


    <foobar-list></foobar-list>


    </div>


    An example can also be created which makes use of transclusion. An example of
    this is given below:


    <div>


    <h1>Foobars</h1>


    <ul>


    <li ng-repeat="foo in c.bars">


    <h3>


    {{mainC.itemHeader}}


    </h3>


    <img ng-src="foo.imageUrl"/>


    {{file.text}}


    </li>


    </ul>


    </div>


    The “<ul>” element from our previous example has some content coming from the
    outside, and transclusion can be used for the purpose of both of these. In the
    above example, we have used an item header which has been provided by “mainC”


    When the listing is extracted into its own component, a directive and a template
    should then be created for that file. This is shown below:


    components/foobar_list/


    *   bar_list_directive.js


    *   bar_list.html


    The directive will create an inherited scope, and the newly created template file
    will then be referenced. Transclusion will also be enabled.


    The code for the file “bar_list_directive.js” should be as follows:


    module.directive(''foobarList'', function() {


    return {


         transclude: true,


         scope: true,


         templateUrl: ''bar_list.html''


    };


    });


    The population of the template will be done by copying the HTML which has been
    extracted from our original template. The part for the item header will be replaced
    with an “ng-transclude” element.


    The code for “bar_list.htm” should be as follows:


    <ul>


    <li ng-repeat="foo in c.bars">


    <ng-transclude></ng-transclude>


    <img ng-src="foo.imageUrl"/>


    {{file.text}}


    </li>


    </ul>


    A new instance of this component can then be used in our new template. It will
    replace the markup which has been extracted, but an item header will be left in
    place and then transclusion will be done to each item. This is shown below:


    <div>


    <h1>My Foobars</h1>


    <ul>


    <li ng-repeat="foo in c.bars">


    <h3>


    {{mainC.itemHeader}}


    </h3>


    <img ng-src="foo.imageUrl"/>


                                                                          {{file.text}}             
                 


    </li>


    </ul>


    <foobar-list>


    <h3>


    {{mainC.itemHeader}}


    </h3>


    </foobar-list>


    </div>


    We  now have a component template. Two external references can be seen in it,
    and these reference the controller “mainC.” Note that this is not the controller
    for the component, but it is just another controller which has been defined on
    the upper or higher level of our hierarchy. This is shown below:


    <div ng-show="mainC.isFooBarVisible()">


    <p>


    {{c.getText(mainC.getLanguage())}}


    </p>


    </div>


    The external references should be removed one by one, and the code should be kept
    working all the time.


    The expression “mainC.isFooBarVisible()” has to be chosen first. It refers to
    calling a method which is located on the parent controller, and we have used the
    result to control whether or not the element is visible. For the external reference
    to be replaced, a binding to the component directive has to be introduced named
    “visible.”


    The code for the “bar_diretive.js” should be as follows:


    module.directive(''foobar'', function() {


    return {


    scope: true,


    controller: ''FoobarCtrl'',


    controllerAs: ''c'',


    bindToController: {


    visible: ''=''


    },


    templateUrl: ''bar.html''


    };


    });


    The above code shows that the component has an input named “visible,” and the
    user should supply the component to it. You should also have noticed that we have
    introduced “bindToController,” but the attribute “scope: true” has been kept unchanged.
    However, it isn’t an isolated scope directive. The reason we do not want to isolate
    it is that there are other external references inside it, and we don’t need to
    break these references. In Angular 1.4, it is possible for one to combine the
    “scope: true” and the “bindToController” so as to introduce binding to scopes
    which are not isolated.


    For the “visible” binding which is new, we have to plug in a value wherever the
    component “foobar” is to be used. We have the capability of accessing the “mainC,”
    and the template originally contained in the template can be used. This is shown
    below:


    <foobar


    visible="mainC.isFooBarVisible()">


    </foobar>


    The scope binding can now be referred to inside the component, and the dependency
    will be broken to the external world. This is shown below for the “bar.html”:


    <div ng-show="c.visible">


    <p>


    {{c.getText(mainC.getLanguage())}}


    </p>


    </div>


    Another binding to the definition for the directive named “language” can now be
    introduced. This is shown below:


    module.directive(''foobar'', function() {


    return {


    scope: true,


    controller: ''FoobarCtrl'',


    controllerAs: ''c'',


    bindToController: {


    visible: ''='',


    language: ''=''


    },


    templateUrl: ''bar.html''


    };


    });


    A value for it should then be plugged in where the component is being used. This
    is shown below:


    <foobar


    visible="mainC.isFooBarVisible()"


    language="mainC.getLanguage()">


    </foobar>


    The binding should also be done inside the component template. This is shown below:


    <div ng-show="c.visible">


    <p>{{c.getText(c.language)}}</p>


    </div>


    Our template will then be free of the external references. All of the data which
    is needed will be specified explicitly at the interface boundary.


    An Example of the “$watch” Expression'
