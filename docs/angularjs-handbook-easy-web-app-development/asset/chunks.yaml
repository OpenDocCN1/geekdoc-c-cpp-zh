  trans: "\n\n```json\n{\n  \"angular-mocks\": \"1.4.x\",\n  \"jquery\": \"~2.1.1\"\
    ,\n  \"bootstrap\": \"~3.1.1\",\n  \"angular-route\": \"1.4.x\",\n  \"angular-resource\"\
    : \"1.4.x\",\n  \"angular-animate\": \"1.4.x\"\n}\n```\n\n上一步中安装的所有元素都应该是兼容的，否则将会出现问题。已经指示\
    \ bower 安装了 jQuery。然而，这不能称它为 Angular 库，但它是一个标准的 jQuery 库。\n\n执行以下命令指示 bower 下载并安装依赖项：\n\
    \n```\nnpm install\n```\n\n请注意，如果在您上次执行上述命令之后发布了新版本的 Angular，可能会出现不兼容的情况。要解决这个问题，您只需要在再次执行上述命令之前删除\
    \ `app/bower_components` 文件夹即可。\n\n## 模板 (The Template)\n\n我们必须对 HTML 模板进行一些更改，以便链接定义动画的资源文件以及\
    \ `angular-animate.js` 文件。动画模块（即 `ngAnimate`）定义在该文件中，它包含了负责让应用程序感知动画效果的代码。\n\n\
    必须对该文件进行以下更改：\n\n```html\n<!--此用于 CSS 过渡和/或关键帧动画 -->\n<link rel=\"stylesheet\"\
    \ href=\"css/animations.css\">\n\n<!--- jQuery 将用于 JavaScript 动画（这应该包含在 angular.js\
    \ 之前） -->\n<script src=\"bower_components/jquery/dist/jquery.js\"></script>\n\n\
    <!---这是在 AngularJS 中启用动画支持所需的模块 -->\n<script src=\"bower_components/angular-animate/angular-animate.js\"\
    ></script>\n\n<!-此用于 JavaScript 动画 -->\n<script src=\"js/animations.js\"></script>\n\
    ```\n\n对于使用 Angular 1.4 版本的用户，请确保您正在使用 jQuery 2.1 及以上版本。任何低于此的版本都将与 Angular 1.4\
    \ 不兼容。这意味着动画将无法检测到，或者可能会以不符合预期的方式运行。\n\n动画可以在 CSS 代码 (`animations.css`) 中或在 JavaScript\
    \ 代码 (`animations.js`) 中实现。我们需要首先创建一个新模块，该模块将像我们在 `ngResource` 中做的那样，将 `ngAnimate`\
    \ 模块作为依赖项。\n\n`animations.js` 文件应如下：\n\n```javascript\nangular.module('myAnimations',\
    \ ['ngAnimate']);\n  // ...\n// 此模块稍后用于定义动画\n  // ...\n```\n\n然后将该模块附加到应用程序模块上。如下所示：\n\
    \n```javascript\nangular.module('myApp', [\n  'ngRoute',\n  'myAnimations',\n\
    \  'myControllers',\n  'myFilters',\n  'myServices',\n]);\n```\n\n此时，我们的模块就会被识别了。\n\
    \n## 使用 CSS 过渡动画的 ng-Repeat 动画\n\n应该将 CSS 动画添加到包含我们设备的网页中的 `ngRepeat` 指令中。我们应该首先为被重复的元素添加一个额外的\
    \ CSS 类，以便它可以与 CSS 动画代码挂钩。如下所示：\n\n```html\n<!-- 更改重复器的 HTML 以包含一个新的 CSS 类\n \
    \    我们稍后将将其用于动画： -->\n<ul class=\"phones\">\n  <li ng-repeat=\"device in phones\
    \ | filter:query | orderBy:orderProp\" class=\"thumbnail device-listing\">\n \
    \   <a href=\"#/phones/{{device.id}}\" class=\"thumb\"><img ng-src=\"{{device.imageUrl}}\"\
    ></a>\n    <a href=\"#/phones/{{device.id}}\">{{device.name}}</a>\n    <p>{{device.snippet}}</p>\n\
    \  </li>\n</ul>\n```\n\n注意 CSS 类是如何添加的。这在 HTML 文件中是必要的，这样动画才能正常工作。动画的 CSS 代码应如下：\n\
    \n```css\n.device-listing.ng-enter,\n.device-listing.leave,\n.device-listing.move\
    \ {\n  -webkit-transition: 0.5s all;\n  -moz-transition: 0.5s all;\n  -o-transition:\
    \ 0.5s all;\n  transition: 0.5s all;\n}\n.device-listing.ng-enter,\n.device-listing.move\
    \ {\n  opacity: 0;\n  height: 0;\n}\n.device-listing.ng-move-active,\n.device-listing.ng-enter.enter-active\
    \ {\n  opacity: 1;\n  height: 20px;\n}\n.device-listing.leave {\n  opacity: 1;\n\
    \  overflow: hidden;\n}\n.device-listing.leave.leave-active {\n  opacity: 0;\n\
    \  height: 0;\n  padding-top: 0;\n  padding-bottom: 0;\n}\n```\n\n`device-listing`\
    \ 的 CSS 类已与项目在插入和从列表中移除时会发生的动画钩子结合。`ng-enter` 将在新设备添加到列表并显示在页面之后应用到该元素上。`ng-move`\
    \ 将元素在列表中移动后应用。`ng-leave` 将在元素从列表中移除后应用。\n\n## ngView 的动画\n\n我们现在需要为 `ngView`\
    \ 中路由更改之间的过渡添加动画。必须像我们在之前的示例中做的那样，在 HTML 中添加一个新的 CSS 类。除了添加到 `ngRepeat` 元素中，我们还将其添加到\
    \ `ngView` 中。这意味着 HTML 代码需要进行一些更改。这意味着视图之间的动画将更具可性。`index.html` 文件应如下：\n\n```html\n\
    <div class=\"view-container\">\n  <div ng-view class=\"view-frame\"></div>\n</div>\n\
    ```\n\n使用了 `view-container` CSS 类将 `ng-view` 指令嵌套在父元素内部。该类将添加 `position: relative`\
    \ 样式，以便在过渡进行动画时，`ng-view` 指令的位置相对于父元素。过渡的 CSS 应该添加到 `animation.css` 文件中。如下所示：\n\
    \n```css\n.view-container {\n  position: relative;\n}\n.view-frame.ng-enter, \n\
    view-frame.ng-leave {\n  background: white;\n  position: absolute;\n  top: 0;\n\
    \  left: 0;\n  right: 0;\n}\n.view-frame.ng-enter {\n  -webkit-animation: 0.5s\
    \ fade-in;\n  -moz-animation: 0.5s fade-in;\n  -o-animation: 0.5s fade-in;\n \
    \ animation: 0.5s fade-in;\n  z-index: 100;\n}\n.view-frame.ng-leave {\n  -webkit-animation:\
    \ 0.5s fade-out;\n  -moz-animation: 0.5s fade-out;\n  -o-animation: 0.5s fade-out;\n\
    \  animation: 0.5s fade-out;\n  z-index: 99;\n}\n@keyframes fade-in {\n  from\
    \ { opacity: 0; }\n  to { opacity: 1; }\n}\n@-moz-keyframes fade-in {\n  from\
    \ { opacity: 0; }\n  to { opacity: 1; }\n}\n@-webkit-keyframes fade-in {\n  from\
    \ { opacity: 0; }\n  to { opacity: 1; }\n}\n@keyframes fade-out {\n  from { opacity:\
    \ 1; }\n  to { opacity: 0; }\n}\n@-moz-keyframes fade-out {\n  from { opacity:\
    \ 1; }\n  to { opacity: 0; }\n}\n@-webkit-keyframes fade-out {\n  from { opacity:\
    \ 1; }\n  to { opacity: 0; }\n}\n```\n\n/* 不要忘记厂商前缀 */\n## 使用 JavaScript 的 ngClass\
    \ 动画\n\n我们需要为我们的应用程序添加另一个动画。在 `device-list.html` 页面将观察到一个漂亮的缩略图。一旦点击缩略图，图像就会更改。必须更改\
    \ CSS 类以确保图像显示是准确的。如下所示：\n\n```css\n.phone-images {\n  background-color: white;\n\
    \  width: 450px;\n  height: 450px;\n  overflow: hidden;\n  position: relative;\n\
    \  float: left;\n}\n\n...\n\nimg.device {\n  float: left;\n  margin-right: 3em;\n\
    \  margin-bottom: 2em;\n  background-color: white;\n  padding: 2em;\n  height:\
    \ 400px;\n  width: 400px;\n  display: none;\n}\n\nimg.device:first-child {\n \
    \ display: block;\n}\n```\n\n你认为我们将创建一个启用 CSS 的动画。然而，我们可以通过使用 JavaScript 的 `animation()`\
    \ 模块来实现。如下文示例所示：\n\n"
- fmt: "\n```javascript\nvar myAnimations = angular.module('myAnimations', ['ngAnimate']);\n\
    \nmyAnimations.animation('.device', function() {\n  var animUp = function(element,\
    \ cName, done) {\n    if(cName != 'active') {\n      return;\n    }\n    element.css({\n\
    \      position: 'absolute',\n      top: 500,\n      left: 0,\n      display:\
    \ 'block'\n    });\n    jQuery(element).animate({\n      top: 0\n    }, done);\n\
    \    return function(cancel) {\n      if(cancel) {\n        element.stop();\n\
    \      }\n    };\n  }\n  var animDown = function(element, cName, done) {\n   \
    \ if(cName != 'active') {\n      return;\n    }\n    element.css({\n      position:\
    \ 'absolute',\n      left: 0,\n      top: 0\n    });\n    jQuery(element).animate({\n\
    \      top: -500\n    }, done);\n    return function(cancel) {\n      if(cancel)\
    \ {\n        element.stop();\n      }\n    };\n  }\n  return {\n    addClass:\
    \ animUp,\n    removeClass: animDown\n  };\n});\n```\n\nAs you have noticed, the\
    \ animation has been implemented by use of `jQuery`. With both Angular and JavaScript,\
    \ we do not require the `jQuery` so as to perform the animation. Writing your\
    \ own animation library in JavaScript will be difficult.\n\n# Chapter 6- `$watch()`,\
    \ `$digest()`, and `$apply()`\n\nThese methods are widely used in AngularJS. You\
    \ should learn how to use these in Angular.\n\nAfter the creation of data binding\
    \ somewhere in one’s view to a variable on the object “`$scope,” a “watch” will\
    \ be internally created by the Angular. With the watch, it will mean that it will\
    \ watch what is contained in the “$$scope” object. This will be an indication\
    \ that the framework will be watching the variable. To create watches, we use\
    \ the function `$scope.$watch()`.\n\nIn most cases, the functions `$scope.$digest()`\
    \ and `$scope.$watch()` can be called on your behalf, but in some other cases,\
    \ you might have to call them yourself. This is why you should know and understand\
    \ how these work.\n\nThe function `$scope.$apply` is used for execution of a particular\
    \ code, and then the function `$scope.$digest()` is called after that. This will\
    \ have all of the watches checked and all of the corresponding functions for the\
    \ watch listener called. The function `$apply()` is good when it comes to integration\
    \ of the AngularJS code with any other code.\n\n## `$watch()`\n\nThe function\
    \ `$scope.watch()` is used for creation of a watch of a particular variable. Once\
    \ a watch has been registered, two parameters have to be passed to the `$watch()`\
    \ function. These two parameters include the following:\n\n* A value function\n\
    * A listener function\n\nConsider the example given below showing how this can\
    \ be done:\n\n```javascript\n$scope.$watch(function() {},\n      function() {}\n\
    );\n```\n\nThe first function represents the value function, while the second\
    \ function represents the listener function. With the value function, the value\
    \ which is being watched will be returned. It is then the work of the AngularJS\
    \ to check the value which has been returned against the one that was returned\
    \ by the watch function last time. AngularJS has changed the way in which checking\
    \ of whether a value was returned can be done. An example of this is shown below:\n\
    \n```javascript\n$scope.$watch(function(scope) { return scope.data.myVariable\
    \ },\n      function() {}\n);\n```\n\nWith the above function, the value `scope.data.myVariable`\
    \ will be returned by the value function. In case the value for this variable\
    \ is changed, then a different value will have to be returned. The listener function\
    \ will then be called by the AngularJS.\n\nIf the value has been changed, the\
    \ listener function will try to do whatever that it can do. By use of this value,\
    \ the value function will be in a position to access the `$scope` together with\
    \ its variables. The global variables can also be watched by the value function\
    \ in case it is needed, but most often, the variable `$scope` will be watched.\n\
    \nIf the value is changed, the listener function can do whatever that it needs\
