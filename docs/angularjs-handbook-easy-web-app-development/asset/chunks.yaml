  trans: "\n\n随后应在文件中创建一个用于简单表格的重复器。可以通过以下方式实现：\n\n```html\n<table>\n  <tr><th>行号\
    \ (the row number)</th></tr>\n  <tr ng-repeat=\"j in [0, 1, 2, 3, 4, 5, 6, 7]\"\
    ><<td>{{j}}</td></tr>\n</table>_table>\n```\n\n然后应将列表修改为以下内容：\n\n```html\n<table>\n\
    \  <tr><th>行号 (the row number)</th></tr>\n  <tr ng-repeat=\"j in [0, 1, 2, 3,\
    \ 4, 5, 6, 7]\"><<td>{{j+1}}</td></tr>\n</table_table>\n```\n\n`ng-repeat` 可用于创建具有其他规格的另一个表格。这在\
    \ `AngularJS` 中也非常强大。到此时，你将拥有一个动态运行的应用程序，并且它拥有模型（model）、视图（view）和控制器（controller），分别位于不同的位置。\n\
    \n# 第 3 章 - XHRs\n\n你不总是要在应用程序中处理小规模且硬编码的数据。我们应该能够通过使用名为 `$http` 的预构建服务从我们的 `AngularJS`\
    \ 服务器获取大型数据集。\n\n我们将有一个文件 `app/phones/devices.json`，其中包含了我们拥有的手机列表。这些将以 JSON 格式存储。该文件的一个示例如下：\n\
    \n```json\n[\n{\n  \"age\": 15,\n  \"id\": \"motorola \",\n  \"name\": \"Motorola\
    \ DEFY\\u2122 with MOTOBLUR\\u2122\",\n  \"snippet\": \"Do you enjoy using Motorola\
    \ devices and phones?\"\n...\n},\n...\n]\n```\n\n## 控制器 (Controller)\n\n`Angular`\
    \ 的 `$http` 服务将在控制器用于向 Web 服务器发送 HTTP 请求，以便从 `app/phones/devices.json` 获取数据。这是处理此类问题或与\
    \ Web 应用相关操作的方法之一。在 `AngularJS` 中，这些服务会被注入到需要的地方。\n\n控制器的代码如下所示：\n\n```javascript\n\
    var myApp = angular.module('myApp', []);\nmyApp.controller('PnListCtrl', function\
    \ ($scope, $http) {\n  $http.get('phones/devices.json').success(function(data)\
    \ {\n    $scope.phones = data;\n  });\n  $scope.orderProp = 'age';\n});\n```\n\
    \n若要在 `Angular` 中使用服务，必须将所需的依赖项名称定义为控制器构造函数的参数。如下：\n\n```javascript\nmyApp.controller('PnListCtrl',\
    \ function ($scope, $http) {...}\n```\n\n`AngularJS` 中的依赖构造函数将在启动后为我们的控制器提供服务。服务可能具有任何间接依赖的创建过程也会被处理。考虑下面的示例，它展示了如何实现：\n\
    \n```javascript\nvar myApp = angular.module('myApp', []);\nmyApp.controller('PnListCtrl',\
    \ ['$scope', '$http',\nfunction ($scope, $http) {\n  $http.get('phones/devices.json').success(function(data)\
    \ {\n    $scope.phones = data;\n  });\n  $scope.orderProp = 'age';\n}]);\n```\n\
    \n测试可以如下方式进行：\n\n```javascript\ndescribe('myApp controllers', function() {\ndescribe('PnListCtrl',\
    \ function(){\n  var scope, ctrl, $httpBackend;\n  // 在测试之前加载我们的模块定义。\n  beforeEach(module('myApp'));\n\
    \  // 注入器在这里会忽略前导和尾的下划线（即 _$httpBackend_）。\n  // 这允许我们注入服务，同时也将其附加到变量上，\n  //\
    \ 变量名与服务相同，以避免名称冲突。\n  beforeEach(inject(function(_$httpBackend_, $rootScope,\
    \ $controller) {\n    $httpBackend = _$httpBackend_;\n    $httpBackend.expectGET('phones/devices.json').\n\
    \    respond([{name: 'Motorola'}, {name: 'Motorola Phone'}]);\n    scope = $rootScope.$new();\n\
    \    ctrl = $controller('PnListCtrl', {$scope: scope});\n  }));\n```\n\n注意上述测试用例中的两个辅助函数。它们可以用于配置和访问注入器。\n\
    \n考虑下面的代码：\n\n```javascript\nit('你应该创建一个 \"phones\" 模型，包含 2 个从 xhr 获取的手机', function()\
    \ {\n  expect(scope.phones).toBeUndefined();\n  $httpBackend.flush();\n  expect(scope.phones).toEqual([{name:\
    \ 'Motorola'},\n  {name: 'Motorola Phone'}]);\n});\n```\n\n我们希望在接收到响应之前，对 scope\
    \ 上不存在的模型进行验证。在调用函数 `$httpBackend.flush()` 后，请求队列将刷新到浏览器。由服务 `$http` 返回的 promise\
    \ 将用我们的解析响应被解析。我们将进行断言，然后验证模型是否属于 scope。然后我们可以验证 `orderProp` 是否已正确设置。如下所示：\n\n\
    ```javascript\nit('默认值应该被设置', function() {\n  expect(scope.orderProp).toBe('age');\n\
    });\n```\n\n在 `Angular` 中，观察到以下内容：\n`<pre>{{phones | orderProp}}</pre>`\n\n输出应该是：\n\
    `$scope.devices = data.splice(0, 5);`\n\n# 第 4 章 - 链接与图片 (Images)\n\n你应该知道如何为设备添加图片。注意在\
    \ JSON 文件中 URL 是可用的。考虑以下代码：\n\n```json\n{\n  \"id\": \"motorola \",\n  \"imageUrl\"\
    : \"img/phones/motorola.jpg\",\n  \"name\": \"Motorola \"\n}\n```\n\n模板应该是：\n\n\
    ```html\n<ul class=\"phones\">\n  <li ng-repeat=\"device in phones | query | orderProp\"\
    \ class=\"thumbnail\">\n    <a href=\"#phones/{{device.id}}\" class=\"thumb\"\
    ><img ng-src=\"{{device.imageUrl}}\"></a>\n    <a href=\"#phones/{{device.id}}\"\
    >{{device.name}}</a>\n    <p>{{device.snippet}}</p>\n  </li>\n</ul>\n```\n\n链接的测试可以如下实现：\n\
    \n```javascript\nit('渲染特定的链接', function() {\n  var myquery = element(by.model('query'));\n\
    \  myquery.sendKeys('nexus');\n  element.all(by.css('.phones a')).first().click();\n\
    \  browser.getLocationAbsUrl().then(function(url) {\n    expect(url).toBe('/phones/motorola');\n\
    \  });\n\n# 第 5 章 - 使用动画\n\n有时你可能需要通过添加动画来增强应用程序。这可以通过 CSS 和 JavaScript 实现。为了在整个应用程序中启用动画，我们必须使用\
    \ `ngAnimate` 模块。常用的 `ng` 指令用于触发我们正在接入的动画钩子。这应该是自动完成的。一旦找到动画，它将在该时间发布的标准 DOM 元素之间执行。`ngRepeat`\
    \ 和 `ngClass` 可以用于此，只需向它们添加或删除元素即可。\n\n我们现在需要安装应用程序客户端使用的依赖项。Bower 可用于此目的。我们需要更新配置文件\
    \ `bower.json` 以包含新的依赖项。\n"
- fmt: "\n```json\n{\n  \"angular-mocks\": \"1.4.x\",\n  \"jquery\": \"~2.1.1\",\n\
    \  \"bootstrap\": \"~3.1.1\",\n  \"angular-route\": \"1.4.x\",\n  \"angular-resource\"\
    : \"1.4.x\",\n  \"angular-animate\": \"1.4.x\"\n}\n```\n\nAll the elements installed\
    \ in the above step should be compatible, otherwise, there will be trouble. The\
    \ bower has also been instructed to install the jQuery. However, this cannot be\
    \ said to be an Angular library, but it is a standard jQuery library.\n\nInstruct\
    \ the bower to download and install the dependencies by executing the following\
    \ command:\n\n```\nnpm install\n```\n\nNote that incompatibility might occur in\
    \ case there is a new version of Angular which has been released after the last\
    \ time you executed the above command. To solve this problem, you just have to\
    \ delete the folder for `app/bower_components` before having to execute the above\
    \ command.\n\n## The Template\n\nWe have to make some changes to the HTML template\
    \ so as to link the asset files defining our animations and the file `angular-animate.js`.\
    \ The module for animation, that is `ngAnimate`, is defined in this file, and\
    \ this has the code which is responsible for making the application sense the\
    \ animation effect.\n\nThe following changes have to be made to the file:\n\n\
    ```html\n<!--this is for the CSS Transitions and/or the Keyframe Animations -->\n\
    <link rel=\"stylesheet\" href=\"css/animations.css\">\n\n<!---the jQuery will\
    \ be used for JavaScript animations (this should included before angular.js) -->\n\
    <script src=\"bower_components/jquery/dist/jquery.js\"></script>\n\n<!---this\
    \ is the required module for enabling animation support in the AngularJS -->\n\
    <script src=\"bower_components/angular-animate/angular-animate.js\"></script>\n\
    \n<!-this is for JavaScript Animations -->\n<script src=\"js/animations.js\"></script>\n\
    ```\n\nFor those who are using Angular version 1.4, make sure that you are using\
    \ jQuery 2.1 and above. Any version below this will not be compatible with Angular\
    \ 1.4. This will mean that the animation will not be detected, or it may work\
    \ in a manner which is not expected.\n\nThe animations can be implemented in either\
    \ the CSS code (`animations.css`) or in the JavaScript code (`animations.js`).\
    \ We need to begin by creating a new module which will use the `ngAnimate` module\
    \ as a dependency in the same way we did it in the `ngResource`.\n\nThe `animations.js`\
    \ file should be as follows:\n\n```javascript\nangular.module('myAnimations',\
    \ ['ngAnimate']);\n  // ...\n// this module will be used for definition of the\
    \ animations later\n  // ...\n```\n\nThe module should then be attached to the\
    \ application module. This is shown below:\n\n```javascript\nangular.module('myApp',\
    \ [\n  'ngRoute',\n  'myAnimations',\n  'myControllers',\n  'myFilters',\n  'myServices',\n\
    ]);\n```\n\nAt this moment, our module will be aware.\n\n## Animation of ng-Repeat\
    \ with the CSS Transition Animations\n\nThe CSS animations should be added to\
    \ the `ngRepeat` directive which is present in the web page with our devices.\
    \ We should begin by adding an extra CSS class to the element which has been repeated\
    \ so that it can be hooked with the CSS animation code. This is shown below:\n\
    \n```html\n<!-- Let us change the repeater HTML so as to include a new CSS class\n\
    \     That we will use later for the animations: -->\n<ul class=\"phones\">\n\
    \  <li ng-repeat=\"device in phones | filter:query | orderBy:orderProp\" class=\"\
    thumbnail device-listing\">\n    <a href=\"#/phones/{{device.id}}\" class=\"thumb\"\
    ><img ng-src=\"{{device.imageUrl}}\"></a>\n    <a href=\"#/phones/{{device.id}}\"\
    >{{device.name}}</a>\n    <p>{{device.snippet}}</p>\n  </li>\n</ul>\n```\n\nNote\
    \ how the CSS class has been added. This is needed in the HTML file so that the\
    \ animation may work. The CSS code for animation should be as follows:\n\n```css\n\
    .device-listing.ng-enter,\n.device-listing.leave,\n.device-listing.move {\n  -webkit-transition:\
    \ 0.5s all;\n  -moz-transition: 0.5s all;\n  -o-transition: 0.5s all;\n  transition:\
    \ 0.5s all;\n}\n.device-listing.ng-enter,\n.device-listing.move {\n  opacity:\
    \ 0;\n  height: 0;\n}\n.device-listing.ng-move-active,\n.device-listing.ng-enter.enter-active\
    \ {\n  opacity: 1;\n  height: 20px;\n}\n.device-listing.leave {\n  opacity: 1;\n\
    \  overflow: hidden;\n}\n.device-listing.leave.leave-active {\n  opacity: 0;\n\
    \  height: 0;\n  padding-top: 0;\n  padding-bottom: 0;\n}\n```\n\nThe CSS class\
    \ for `device-listing` has been combined with the animation hooks which will occur\
    \ when items have been inserted into then removed from the list. The `ng-enter`\
    \ will be applied to the element after a new device has been added to the list\
    \ and displayed on the page. The `ng-move` will be applied after elements have\
