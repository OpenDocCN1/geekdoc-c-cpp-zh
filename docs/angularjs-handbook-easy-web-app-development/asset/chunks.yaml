    "jquery": "~2.1.1",


    "bootstrap": "~3.1.1",


    "angular-route": "1.4.x",


    "angular-resource": "1.4.x",


    "angular-animate": "1.4.x"


    }


    }


    All the elements installed in the above step should be compatible, otherwise,
    there will be trouble. The bower has also been instructed to install the jQuery.
    However, this cannot be said to be an Angular library, but it is a standard jQuery
    library.


    Instruct the bower to download and install the dependencies by executing the following
    command:


    npm install


    Note that incompatibility might occur in case there is a new version of Angular
    which has been released after the last time you executed the above command. To
    solve this problem, you just have to delete the folder for “app/bower_components”
    before having to execute the above command.


    The Template


    We have to make some changes to the HTML template so as to link the asset files
    defining our animations and the file “angular-animate.js.” The module for animation,
    that is, “ngAnimate,” is defined in this file, and this has the code which is
    responsible for making the application sense the animation effect.


    The following changes have to be made to the file:


    ...


    <!—this is for the CSS Transitions and/or the Keyframe Animations -->


    <link rel="stylesheet" href="css/animations.css">


    ...


    <!—the jQuery will be used for JavaScript animations (this should included before
    angular.js) -->


    <script src="bower_components/jquery/dist/jquery.js"></script>


    ...


    <!—this is the required module for enabling animation support in the AngularJS
    -->


    <script src="bower_components/angular-animate/angular-animate.js"></script>


    <!—this is for JavaScript Animations -->


    <script src="js/animations.js"></script>


    ...


    For those who are using Angular version 1.4, make sure that you are using jQuery
    2.1 and above. Any version below this will not be compatible with Angular 1.4\.
    This will mean that the animation will not be detected, or it may work in a manner
    which is not expected.


    The animations can be implemented in either the CSS code (“animations.css”)  or
    in the JavaScript code (“animations.js”). We need to begin by creating a new module
    which will use the “ngAnimate” module as a dependency in the same way we did it
    in the “ngResource.”


    The “animations.js” file should be as follows:


    angular.module(''myAnimations'', [''ngAnimate'']);


       // ...


    // this module will be used for definition of the animations later


       // ...


    The module should then be attached to the application module. This is shown below:


    // ...


    angular.module(''myApp'', [


    ''ngRoute'',


    ''myAnimations'',


    ''myControllers'',


    ''myFilters'',


    ''myServices'',


    ]);


    // ...


    At this moment, our module will be aware.


    Animation of “ngRepeat” with the CSS Transition Animations


    The CSS animations should be added to the “ngRepeat” directive which is present
    in the web page with our devices. We should begin by adding an extra CSS class
    to the element which has been repeated so that it can be hooked with the CSS animation
    code. This is shown below:


    <!--


    Let us change the repeater HTML so as to include a new CSS class


    That we will use later for the animations:


    -->


    <ul class="phones">


    <li ng-repeat="device in phones | filter:query | orderBy:orderProp"


    class="thumbnail device-listing">


    <a href="#/phones/{{device.id}}" class="thumb"><img ng-src="{{device.imageUrl}}"></a>


    <a href="#/phones/{{device.id}}">{{device.name}}</a>


    <p>{{device.snippet}}</p>


    </li>


    </ul>


    Note how the CSS class has been added. This is needed in the HTML file so that
    the animation may work.


    The CSS code for animation should be as follows:


    .device-listing.ng-enter,


    .device-listing.ng-leave,


    .device-listing.ng-move {


        -webkit-transition: 0.5s linear all;


        -moz-transition: 0.5s linear all;


        -o-transition: 0.5s linear all;


        transition: 0.5s linear all;


    }


    .device-listing.ng-enter,


    .device-listing.ng-move {


       opacity: 0;


       height: 0;


       overflow: hidden;


    }


    .device-listing.ng-move.ng-move-active,


    .device-listing.ng-enter.ng-enter-active {


        opacity: 1;


        height: 120px;


    }


    .device-listing.ng-leave {


        opacity: 1;


        overflow: hidden;


    }


    .device-listing.ng-leave.ng-leave-active {


        opacity: 0;


        height: 0;


        padding-top: 0;


        padding-bottom: 0;


    }


    The CSS class for “device-listing” has been combined together with the animation
    hooks which will occur when the items have been inserted into and then removed
    from the list.


    The class “ng-enter” will be applied to the element after a new device has been
    added to the list and then displayed on the page. The class “ng-move” will be
    applied after the elements have been moved around the list. The class “ng-leave”
    will be applied once the elements have been removed from the list.


    Animation of “ngView”


    We now need to add an animation for transitions between our route changes in the
    “ngView.” A new CSS class has to be added to the HTML as we did in our previous
    example. Other than adding it to the “ng-Repeat” element, we will add it to the
    “ngView.” This means that the HTML code has to be changed a bit. This will mean
    that the animation will be more controlled between the changes in the view.


    The “index.html” file should be as follows:


    <div class="view-container">


        <div ng-view class="view-frame"></div>


    </div>


    The “view-container” CSS class has been used to nest the “ng-view” directive inside
    the parent element. The class will add the style “position: relative” so that
    the positioning of the directive “ng-view” is relative to the parent as the transitions
    are animated.


    The CSS for the transition should be added to the file “animation.css.” This is
    shown below:


    .view-container {


        position: relative;


    }


    .view-frame.ng-enter, .view-frame.ng-leave {


        background: white;


        position: absolute;


        top: 0;


        left: 0;


                                                                          right: 0;             
                 


                                                                                       
    }                           


    .view-frame.ng-enter {


         -webkit-animation: 0.5s fade-in;


         -moz-animation: 0.5s fade-in;


        -o-animation: 0.5s fade-in;


        animation: 0.5s fade-in;


        z-index: 100;


    }


    .view-frame.ng-leave {


         -webkit-animation: 0.5s fade-out;


          -moz-animation: 0.5s fade-out;


          -o-animation: 0.5s fade-out;


           animation: 0.5s fade-out;


           z-index:99;


    }


    @keyframes fade-in {


           from { opacity: 0; }


            to { opacity: 1; }


    }


    @-moz-keyframes fade-in {


            from { opacity: 0; }


            to { opacity: 1; }


    }


    @-webkit-keyframes fade-in {


         from { opacity: 0; }


          to { opacity: 1; }


    }


    @keyframes fade-out {


          from { opacity: 1; }


          to { opacity: 0; }


    }


    @-moz-keyframes fade-out {


           from { opacity: 1; }


           to { opacity: 0; }


    }


    @-webkit-keyframes fade-out {


           from { opacity: 1; }


           to { opacity: 0; }


    }


    /* the vendor-prefixes should not be forgotten */


    Animation of the “ngClass” with Javascript


    We need to add another animation to our application. A nice thumbnail will be
    observed in the “device-list.html” page. Once the thumbnail has been clicked,
    the image will change. The CSS class has to be changed so that we can ensure that
    the displaying of the images is accurate. This is shown below:


    .phone-images {


        background-color: white;


        width: 450px;


        height: 450px;


        overflow: hidden;


        position: relative;


        float: left;


    }


    ...


    img.device {


         float: left;


         margin-right: 3em;


         margin-bottom: 2em;


         background-color: white;


         padding: 2em;


         height: 400px;


         width: 400px;


        display: none;


    }


    img.device:first-child {


         display: block;


    }


    You are thinking that we will create an animation which is CSS enabled. However,
    we can do this by use of the “animation()” module of JavaScript. This is shown
    in the example given below:'
