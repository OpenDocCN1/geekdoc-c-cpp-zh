    \ purposes only and are the owned by the owners themselves, not affiliated with\
    \ this document.\n\n# Chapter 1- Overview of AngularJS\nThis framework works by\
    \ performing an extension of what is provided in HTML. If HTML had been created\
    \ for the purpose of the development of web-apps, then it would have been the\
    \ angularJS. HTML is the best when it comes to declaration of static documents.\
    \ However, it is not good for the declaration of dynamic views in our web applications.\
    \ With Angular, the HTML vocabulary used in your application can be greatly extended.\
    \ After doing that, you will get an environment which is easy to read, expressive,\
    \ and faster to perform your development.\n\nIn this book, we will explore the\
    \ various features of AngularJS which you as a developer can take advantage of\
    \ so as to improve the look and feel of your application.\n\n# Chapter 2- AngularJS\
    \ and HTML\nAs you are aware, AngularJS is used to extend the features of HTML.\
    \ Most of you are aware of how the standard HTML can be used. However, AngularJS\
    \ is used to extend the features of this. In this chapter, we want to create an\
    \ HTML page, and then turn the code written in HTML into a template which will\
    \ be used by the AngularJS so as to display the same data dynamically. Only basic\
    \ information will be added to the HTML page.\n\n# Here is the first code for\
    \ the web page:\n```html\n<ul>\n  <li>\n    <span> Motorola </span>\n    <p>\n\
    \      I really like Motorola phones.\n    </p>\n  </li>\n  <li>\n    <span>Nokia\
    \ are the best in Wi-Fi connection</span>\n    <p>\n      I really like to make\
    \ use of devices.\n    </p>\n  </li>\n</ul>\n```\n\n# You can continue with the\
    \ addition of static HTML to the above file. An example of this is given below:\n\
    ```html\n<p> The number of available phones is: 2</p>\n```\n\n# In the example,\
    \ we have just used the static HTML so as to render the content of the web page\
    \ which we have just created. With AngularJS, the same content can be rendered\
    \ dynamically.\n\n# Our aim is to make the page we have created dynamic. A test\
    \ case should also be implemented so that the controller that we create is tested.\
    \ In AngularJS, the MV model (Model-View-Controller) is used for the purpose of\
    \ organizing the structure of the application. With this, the code is decoupled,\
    \ and the concept of separation of concerns is implemented. The model, view, and\
    \ the controller will be added in this app. What happens in Angular is that the\
    \ model is projected into a template via the view. This is an indication that\
    \ in case something is changed, all of the binding points will also be updated\
    \ so that the view is updated. The view is constructed from the model in Angular.\n\
    \n# Consider the example given below:\n```html\n<html ng-app=\"myApp\">\n<head>\n\
    ...\n<script src=\"myapps/angular/angular.js\"></script>\n<script src=\"js/controllers.js\"\
    ></script>\n</head>\n<body ng-controller=\"PhoneListCtrl\">\n  <ul>\n    <li ng-repeat=\"\
    model in phones\">\n      <span>{{model.name}}</span>\n      <p>{{model.snippet}}</p>\n\
    \    </li>\n  </ul>\n</body>\n</html>\n```\n\n# What you have done is that the\
    \ `ng-repeat` directive has been replaced by the hard coded `phones` list in the\
    \ controller. This is shown below:\n```javascript\nvar myApp = angular.module('myApp',\
    \ []);\nmyApp.controller('PhoneListCtrl', function ($scope) {\n  $scope.phones\
    \ = [\n    {name: 'Motorola', snippet: 'I really like Motorola phones.'},\n  \
    \  {name: 'Nokia are the best in Wi-Fi connection', snippet: 'I really like to\
    \ make use of devices.'}\n  ];\n});\n```\n\n## Tests\nIn AngularJS, the controller\
    \ and the view are separated. With this, the code becomes testable even during\
    \ the time of development. In case the controller is available in the global space,\
    \ we can mock the `scope` object. This is shown in the example:\n```javascript\n\
    describe('PnListCtrl', function(){\n  it(' a \"phones\" model with 2 phones, function()\
    \ {\n    var scope = {},\n    ctrl = new PnListCtrl(scope);\n    expect(scope.phones.length).toBe(2);\n\
    \  });\n});\n```\n\nThe non-global controllers should then be created. No one\
    \ will want to have their controller function to be in their global namespace.\
    \ Instead, most people will want it to be registered via the anonymous function\
    \ of the module we have just created.\n\nIn this case, we will be proved by the\
    \ service `$controller` from AngularJS. This will be tasked with retrieving the\
    \ controller by its name. Consider the example given below, which shows how this\
    \ can be done:\n```javascript\ndescribe('PnListCtrl', function(){\n  beforeEach(module('pncatApp'));\n\
    \  it('you should create \"phones\" model with the 2 phones', inject(function($controller)\
    \ {\n    var scope = {},\n    ctrl = $controller('PnListCtrl', {$scope:scope});\n\
    \    expect(scope.phones.length).toBe(2);\n  }));\n});\n```\n\nWhat we have done\
    \ is that we have instructed the Angular to load each module before any of the\
    \ tests is done. The service `$controller` should then be injected into our service.\
    \ The service has also been used for creation of a new `PnListCtrl.` The instance\
    \ is then used for the purpose of verification.\n\n## Experiments\nAnother binding\
    \ can be added to the file. This is shown below:\n```html\n<p>The available number\
    \ of phones: {{phones.length}}</p>\n```\n\nA new model property can be created\
    \ in the controller and then bound from the template. An example of this is shown\
    \ below:\n```javascript\n$scope.name = \"John\";\n```\n\nThe new binding can be\
    \ added to the file as follows:\n```html\n<p>Hi, {{name}}!</p>\n```\n\nYou can\
    \ now refresh your browser and then observe what happens.\n"
