  trans: "\n\n```javascript\nvar myAnimations = angular.module('myAnimations', ['ngAnimate']);\n\
    \nmyAnimations.animation('.device', function() {\n  var animUp = function(element,\
    \ cName, done) {\n    if(cName != 'active') {\n      return;\n    }\n    element.css({\n\
    \      position: 'absolute',\n      top: 500,\n      left: 0,\n      display:\
    \ 'block'\n    });\n    jQuery(element).animate({\n      top: 0\n    }, done);\n\
    \    return function(cancel) {\n      if(cancel) {\n        element.stop();\n\
    \      }\n    };\n  }\n  var animDown = function(element, cName, done) {\n   \
    \ if(cName != 'active') {\n      return;\n    }\n    element.css({\n      position:\
    \ 'absolute',\n      left: 0,\n      top: 0\n    });\n    jQuery(element).animate({\n\
    \      top: -500\n    }, done);\n    return function(cancel) {\n      if(cancel)\
    \ {\n        element.stop();\n      }\n    };\n  }\n  return {\n    addClass:\
    \ animUp,\n    removeClass: animDown\n  };\n});\n```\n\n正如你所注意到的，动画是通过使用 `jQuery`\
    \ 实现的。通过 Angular 和 JavaScript，我们不需要使用 `jQuery` 来执行动画。在 JavaScript 中编写自己的动画库是非常的。\n\
    \n# 第 6 章- `$watch()`, `$digest()` 和 `$apply()`\n\n这些方法在 AngularJS 中被广泛使用。你应该学习如何在\
    \ Angular 中使用它们。\n\n在视图的某处对对象“$scope”上的变量创建了数据绑定后，Angular 内部会创建一个“监听（watch）”。通过这个监听器，意味着它将监控“$$scope”对象中的内容。这表明框架正在监控该变量。要创建监听器，我们使用\
    \ `$scope.$watch()` 函数。\n\n在大多数情况下，`$scope.$digest()` 和 `$scope.$watch()` 函数会替你调用，但在其他情况下，你可能需要手动调用它们。这就是为什么你应该知道并理解它们是如何工作的。\n\
    \n`$scope.$apply` 函数用于执行特定的代码，并在之后调用 `$scope.$digest()` 函数。这将检查所有的监听器，并调用所有对应的监听器回调函数。`apply()`\
    \ 函数在将 AngularJS 代码与任何其他代码集成时非常有用。\n\n## `$watch()`\n\n`$scope.watch()` 函数用于创建特定变量的监听器。一旦注册了监听器，必须向\
    \ `$watch()` 函数传递两个参数。这两个参数包括：\n\n*   一个值函数（value function）\n*   一个监听函数（listener\
    \ function）\n\n考虑下面的示例，展示如何实现：\n\n```javascript\n$scope.$watch(function() {},\n\
    \      function() {}\n);\n```\n\n第一个函数代表值函数，而第二个函数代表监听函数。通过值函数将返回被监控的值。随后，由 AngularJS\
    \ 来将返回的值与上一次监听函数返回的值进行比较。AngularJS 改变了检查是否返回了值的方法。下例所示：\n\n```javascript\n$scope.$watch(function(scope)\
    \ { return scope.data.myVariable },\n      function() {}\n);\n```\n\n使用上述函数，值函数将返回\
    \ `scope.data.myVariable` 的值。如果该变量的值发生了变化，则必须返回一个不同的值。随后 AngularJS 将调用监听函数。\n\n\
    如果值发生了变化，监听函数将尝试尽其所能的操作。通过使用此值，值函数可以访问 `$scope` 及其变量。在需要时，值函数也可以监控全局变量，但大多数情况下监控的是\
    \ `$scope` 变量。\n\n如果值发生了变化，监听函数可以执行任何它需要的操作。对于某些人来说，他们可能需要更改变量的内容，而另一些人可能需要更改\
    \ HTML 元素的内容。考虑下面的示例：\n\n```javascript\n$scope.$watch(function(scope) { return\
    \ scope.data.myVariable },\nfunction(nValue, oValue) {\n    document.getElementById(\"\
    \").innerHTML =\n      \"\" + newValue + \"\";\n}\n);\n```\n\n上面的示例将把 HTML 元素的\
    \ `innerHTML` 设置为变量的新值，并且这被嵌入在“b”元素中以使内容加粗。\n\n## `$digest()`\n\n`$scope.$digest()`\
    \ 函数将遍历“$scope”对象和子“$scope”对象中的所有监听器。当 `$digest()` 函数遍历完监听器后，框架会更新数据绑定。\n\n##\
    \ `$apply()`\n\n`$scope.$apply` 函数用于执行特定的代码，并在之后调用 `$scope.$digest()` 函数。这将检查所有的监听器。我们为应用程序创建了两个按钮。第一个按钮绑定了一个类型为\
    \ `ng-click` 的监听器。点击此按钮将调用该函数。\n\n考虑下面的示例：\n\n```html\n<div ng-controller=\"appController\"\
    >\n  {{data.time}}\n  <br/>\n  <button ng-click=\"updateTime()\">update time -\
    \ ng-click</button>\n  <button id=\"upTime\">change time</button>\n</div\n```\n\
    \n```javascript\nvar module = angular.module(\"myapplication\", []);\n\nvar appController\
    \ = module.controller(\"appController\", function($scope) {\n  $scope.data = {\
    \ time: new Date() };\n\n  $scope.updateTime = function() {\n    $scope.data.time\
    \ = new Date();\n  }\n\n  document.getElementById(\"upTime\")\n  .addEventListener('click',\
    \ function() {\n    console.log(\"change time clicked\");\n    $scope.data.time\
    \ = new Date();\n    $scope.$digest();\n  });\n});\n```\n\n"
- fmt: "\nInstead of doing the above, that is, calling the `$digest()` function inside\
    \ the event listener, the `apply()` function can also be used as shown below:\n\
    \n```javascript\ndocument.getElementById(\"upTimeButton\")\n  .addEventListener('click',\
    \ function() {\n    $scope.$apply(function() {\n      console.log(\"change time\
    \ clicked\");\n      $scope.data.time = new Date();\n    });\n  });\n```\n\nThe\
    \ function `$scope.$apply()` has been called from within the event listener for\
    \ the button, and the update of the variable `$scope.data.time` has been passed\
    \ as a parameter to the function `$apply()`. Once all of the function `$apply()`\
    \ has finished, AngularJS will call the function `$digest()` internally so that\
    \ all of the data bindings are updated.\n\n# Chapter 7- The Hierarchy of \"$scope\"\
    \n\nThe object `$scope` for AngularJS, which is used by views, is organized into\
    \ an an hierarchy. We begin with the root scope, which is then made up of one\
    \ or more children. Each of the available views is made up of its own scope, which\
    \ is just the child of the root scope. This means that whatever variable that\
    \ the view controller has set on the variable `$scope` will be invisible to the\
    \ controllers.\n\nConsider the AngularJS code given below as an example:\n\n```html\n\
    <!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<script src=\"https://ajax.googleapis.com/ajax/libs/angularjs/1.2.5/angular.min.js\"\
    ></script>\n</head>\n<body ng-app=\"myapplication\">\n  <div ng-controller=\"\
    appController1\">\n    {{data.theVariable}}\n  </div>\n  <div ng-controller=\"\
    appController2\">\n    {{data.theVariable}}\n  </div>\n  <script>\n    var module\
    \ = angular.module(\"myapplication\", []);\n    var appController1 = module.controller(\"\
    appController1\", function($scope) {\n      $scope.data = { theVariable : \"first\
    \ value\"};\n    });\n    var appController2 = module.controller(\"appController2\"\
    , function($scope) {\n      $scope.data = { theVariable : \"second value\"};\n\
    \    });\n  </script>\n</body>\n</html>\n```\n\nIn the above example, we have\
    \ used two views, and each of the views has its own controller. Each controller\
    \ will set the `data.theVariable` variable to a different value.\n\nOnce the program\
    \ has been executed, you will get the following hierarchy:\n\n- Root `$scope`\n\
    - `$scope` for appController 1\n- `$scope` for appController 2\n\nAs shown above,\
    \ the two views have used different scope objects. With the example, two different\
    \ values will also be written for the `{{data.theVar}}` data bindings inside our\
    \ two views. Different values will also be set for the variable `data.theVariable`\
    \ in the `$scope` object.\n\n# Chapter 8- Refactoring AngularJS Apps\n\nDirectives\
    \ which are component-based are increasingly becoming popular in AngularJS. The\
    \ reason for this is the ease of use associated with components. However, most\
    \ apps for Angular which are in use today are not based on components.\n\nFor\
    \ Angular2 users, components can be used as follows:\n\n```html\n<confirmation\n\
    \    [message]=\"'Start firing?'\"\n    (ok)=\"startFiring()\">\n</confirmation>\n\
    ```\n\nAs shown in the above example, a component is just an element in HTML,\
    \ and it matches a component name which has been defined somewhere else. Each\
    \ component has its inputs and outputs, and these are supplied as properties to\
    \ the element.\n\nThe above component can also be defined as shown:\n\n```typescript\n\
    @Component({\n  selector: 'confirmation',\n  properties: ['message'],\n  events:\
    \ ['ok']\n})\n@View({\n  template: `\n    <div>\n      {{message}}\n      <button\
    \ (click)=\"ok()\">OK</button>\n    </div>\n  `\n})\nclass Confirmation {\n  okEvents\
    \ = new EventEmitter();\n  ok() {\n    this.okEvents.next();\n  }\n}\n```\n\n\
    An interface boundary is used for specification of inputs and outputs which the\
    \ component can work with. The UI template has been used for definition of interface\
    \ for our users. The component logic has been used behind the UI template to define\
    \ the behavior of the component and what it does when the user is interacting\
    \ with it. The definition of a component as a directive can be done as shown:\n\
    \n```typescript\n@Component({\n  selector: 'confirmation',\n  properties: ['message'],\n\
    \  events: ['ok']\n})\n@View({\n  template: `\n    <div>\n      {{message}}\n\
    \      <button (click)=\"ok()\">OK</button>\n    </div>\n  `\n})\nclass Confirmation\
    \ {\n  okEvents = new EventEmitter();\n  ok() {\n    this.okEvents.next();\n \
    \ }\n}\n```\n\nThe above code is completely different from what we had. Refactoring\
    \ can easily be done or used in AngularJS. We want to give an example of how this\
    \ can be done:\n\nConsider the code given below for the file `index.html`:\n\n\
    ```html\n<div ng-include=\"'bar.html'\"></div>\n```\n\nFor the above to be replaced,\
    \ we will have to create a directive for `bar`. This will use the inherited scope\
    \ and the template `bar.html`. The code for `bar_directive.js` should be as follows:\n\
    \n```javascript\nmodule.directive('bar', function() {\n  return {\n    scope:\
    \ true,\n    templateUrl: 'bar.html'\n  };\n});\n```\n\nFor this to work effectively,\
    \ both the directive and the template have to be co-located and their names should\
    \ also match. This is shown below:\n\n`components/foobar/`\n- `bar_directive.js`\n\
    - `bar.html`\n\nThe original `ng-include` should then be replaced with the new\
    \ directive. This is shown below:\n\n```html\n<div ng-include=\"'footbar.html'\"\
    ></div>\n<footbar></footbar>\n```\n\nAfter the addition of the above component\
    \ directive, that is, `footbar`, the template itself will look as shown below:\n\
    \n```html\n<div ng-controller=\"FoobarCtrl as c\">\n  <p>{{c.getText()}}</p>\n\
    </div>\n```\n\nWe then want to move and then rename the file which has the FootCtrl\
    \ so that it becomes co-located with our component directive. This is shown below:\n\
    \n`components/foobar/`\n- `bar_directive.js`\n- `bar_controller.js`\n- `bar.html`\n\
    \nThe controller should then be used in the directive, and then the same `ctrl`\
    \ alias that our `ng-controller` will be used. The file `bar_directive.js` should\
    \ be as follows:\n\n```javascript\nmodule.directive('foobar', function() {\n \
    \ return {\n    scope: true,\n    controller: 'FoobarCtrl',\n    controllerAs:\
    \ 'ctrl',\n    templateUrl: 'bar.html'\n  };\n});\n```\n\nThe wrapper `ng-controller`\
    \ can now be removed from the template. This is shown below:\n\n```html\n<div\
    \ ng-controller=\"FooBarCtrl as c\">\n  <p>{{c.getText()}}</p>\n</div>\n```\n\n\
    One can also choose to keep this element for the purpose of styling, and then\
    \ the attribute `ng-controller` is removed. Consider the example given below:\n\
    \n```html\n<div ng-controller=\"FoobarCtrl as c\" class=\"foo-bar\">\n  <p>{{c.getText()}}</p>\n\
    </div>\n```\n\nIn the above example representing a template, we have an `ng-controller`.\
    \ It has been used to instantiate a `FoobarCtrl` and then alias it as `c`. We\
    \ now need to create a new directive. This should then create an inherited scope,\
    \ and then use the `FoobarCtrl` and then alias it as `c`. This is shown below:\n\
    \n```javascript\nmodule.directive('bar', function() {\n  return {\n    scope:\
    \ true,\n    controller: 'FoobarCtrl',\n    controllerAs: 'c'\n  };\n});\n```\n\
    \nOur new directive and the controller in existence will be moved to the same\
    \ location. The two should also have the same prefix. This is shown below:\n\n\
    `components/foobar/`\n- `bar_directive.js`\n- `bar_controller.js`\n\nFinally,\
    \ in the original template, the `ng-controller` can be replaced with an instance\
    \ of the component `foobar`. This is shown below:\n\n```html\n<div ng-controller=\"\
    FoobarCtrl as c\" class=\"foo-bar\">\n  <footobar class=\"foo-bar\">\n    <p>{{c.getText()}}</p>\n\
    \  </footobar>\n</div>\n```\n\nThis is what we have for now:\n\n```html\n<div\
    \ ng-controller=\"FoobarCtrl as c\" class=\"foo-bar\">\n  <footobar class=\"foo-bar\"\
    >\n    <p>{{c.getText()}}</p>\n  </footobar>\n</div>\n```\n\nA template file should\
    \ then be created for the component directive. This is shown below:\n\n`components/foobar/`\n\
    - `bar_directive.js`\n- `bar_controller.js`\n- `bar.html`\n\nThe new template\
    \ should then be referenced from the directive. This can be done as follows:\n\
    \n```javascript\nmodule.directive('foobar', function() {\n  return {\n    scope:\
    \ true,\n    controller: 'FoobarCtrl',\n    controllerAs: 'c',\n    templateUrl:\
    \ 'bar.html'\n  };\n});\n```\n\nWe will then use what was contained in the directive\
    \ element so as to populate the new template. This is shown below:\n\n```html\n\
    <p>{{c.getText()}}p>\n```\n"
