    \ }\n  to { opacity: 1; }\n}\n@-moz-keyframes fade-in {\n  from { opacity: 0;\
    \ }\n  to { opacity: 1; }\n}\n@-webkit-keyframes fade-in {\n  from { opacity:\
    \ 0; }\n  to { opacity: 1; }\n}\n@keyframes fade-out {\n  from { opacity: 1; }\n\
    \  to { opacity: 0; }\n}\n@-moz-keyframes fade-out {\n  from { opacity: 1; }\n\
    \  to { opacity: 0; }\n}\n@-webkit-keyframes fade-out {\n  from { opacity: 1;\
    \ }\n  to { opacity: 0; }\n}\n```\n\n/* the vendor-prefixes should not be forgotten\
