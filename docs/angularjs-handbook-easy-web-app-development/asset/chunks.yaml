  trans: "\n指令元素本身将变为空。`index.html` 文件将如下所示：\n\n```html\n<foobar>\n<p>{{c.getText()}}</p>\n\
    </foobar>\n```\n\n当 `ng-controller` 被替换为指令后，原始模板将剩下以下内容：\n\n```html\n<foobar>\n\
    <h2>{{c.getTitle()}}</h2>\n<p>{{mainC.getText()}}</p>\n</foobar>\n```\n\n转体（Transclusion）可以被用于同时支持这两种情况。我们将开始为我们的组件指令创建一个模板文件。如下所示：\n\
    \n`components/foobar/`\n*   `bar_directive.js`\n*   `bar_controller.js`\n*   `bar.html`\n\
    \n然后我们可以在我们的指令中引用新模板。同时，也将启用转体，如下所示：\n\n```javascript\nmodule.directive('foobar',\
    \ function() {\n  return {\n    transclude: true,\n    scope: true,\n    controller:\
    \ 'FoobarCtrl',\n    controllerAs: 'c',\n    templateUrl: 'bar.html'\n  };\n});\n\
    ```\n\n模板文件的填充将通过使用原始模板中需要放入组件内部的部分来实现。对于另一部分，将添加 `ng-transclude` 指令。`bar.html`\
    \ 文件应该包含以下代码：\n\n```html\n<h2>{{c.getTitle()}}</h2>\n<p ng-transclude></p>\n```\n\
    \n在我们的指令元素中，我们将保留需要被转体的部分。如下所示：\n\n```html\n<foobar>\n<h2>{{c.getTitle()}}</h2>\n\
    <p>{{mainC.getText()}}</p>\n</foobar>\n```\n\n考虑下一个示例。\n\n我们有一个用于列出某些数据的 `<ul>`\
    \ 元素。如下所示：\n\n```html\n<div>\n  <h1>Foobars</h1>\n  <ul>\n    <li ng-repeat=\"\
    foo in c.bars\">\n      <img ng-src=\"foo.imageUrl\"/>\n      {{file.text}}\n\
    \    </li>\n  </ul>\n</div>\n```\n\n我们需要将该列表提取到它自己的组件中。应该为该组件创建一个指令和一个模板文件。在指令中应这样调用它，如下所示：\n\
    \n`components/foobar_list/`\n*   `foobar_list_directive.js`\n*   `foobar_list.html`\n\
    \n指令将创建一个继承作用域，然后引用已创建的模板。如下所示：\n\n```javascript\nmodule.directive('foobarList',\
    \ function() {\n  return {\n    scope: true,\n    templateUrl: 'list.html'\n \
    \ };\n});\n```\n\n模板的填充将通过复制从我们原始模板中填充的 HTML 文件来实现。如下所示：\n\n```html\n<ul>\n  <li\
    \ ng-repeat=\"foo in c.bars\">\n    <img ng-src=\"foo.imageUrl\"/>\n    {{file.text}}\n\
    \  </li>\n</ul>\n```\n\n随后可以在原始模板中使用该组件的新实例。它将替换掉已创建的标记。如下所示：\n\n```html\n<div>\n\
    \  <h1>Foobars</h1>\n  <ul>\n    <li ng-repeat=\"foo in c.bars\">\n      <img\
    \ ng-src=\"foo.imageUrl\"/>\n      {{file.text}}\n    </li>\n  </ul>\n  <foobar-list></foobar-list>\n\
    </div>\n```\n\n也可以创建一个利用转体的示例。下给出了该示例：\n\n```html\n<div>\n  <h1>Foobars</h1>\n\
    \  <ul>\n    <li ng-repeat=\"foo in c.bars\">\n      <h3>\n        {{mainC.itemHeader}}\n\
    \      </h3>\n      <img ng-src=\"foo.imageUrl\"/>\n      {{file.text}}\n    </li>\n\
    \  </ul>\n</div>\n```\n\n我们上一个示例中的 `<ul>` 元素包含来自外部的内容，转体可以被用于这两种目的。在上面的示例中，我们使用了由\
    \ `mainC` 提供的项目头部。\n\n当列表提取到它自己的组件时，应该为该文件创建一个指令和一个模板。如下所示：\n\n`components/foobar_list/`\n\
    *   `bar_list_directive.js`\n*   `bar_list.html`\n\n指令将创建一个继承作用域，然后引用新创建的模板文件。也将启用转体。\n\
    \n`bar_list_directive.js` 文件的代码如下：\n\n```javascript\nmodule.directive('foobarList',\
    \ function() {\n  return {\n    transclude: true,\n    scope: true,\n    templateUrl:\
    \ 'bar_list.html'\n  };\n});\n```\n\n模板的填充将通过复制从我们原始模板中提取的 HTML 来。项目头部的部分将被 `ng-transclude`\
    \ 元素替换。\n\n`bar_list.htm` 的代码如下：\n\n```html\n<ul>\n  <li ng-repeat=\"foo in c.bars\"\
    >\n    <ng-transclude></ng-transclude>\n    <img ng-src=\"foo.imageUrl\"/>\n \
    \   {{file.text}}\n  </li>\n</ul>\n```\n\n随后可以在我们的新模板中使用该组件的新实例。它将替换掉已提取的标记，但会留下项目头部。如下所示：\n\
    \n```html\n<div>\n  <h1>Foobars</h1>\n  <ul>\n    <li ng-repeat=\"foo in c.bars\"\
    >\n      <img ng-src=\"foo.imageUrl\"/>\n      {{file.text}}\n    </li>\n  </ul>\n\
    </div>\n```\n"
- fmt: "\nExternal references cannot only be found in the component template. In the\
    \ component controller, one may also have the expressions `\"$watch,\"`, `\"$watchCollection,\"\
    ` or `\"$watchGroup.\"` The link functions can also be used if available. Consider\
    \ the example given below, which shows how this can be replaced with a bound input:\n\
    \n```javascript\nfunction FoobarCtrl($scope) {\n  var c = this;\n  $scope.$watch('mainC.foo',\
    \ function(nFoo) {\n    if (nFoo.active) {\n      ctrl.actFoo = nFoo;\n    } else\
    \ {\n      c.actFoo = null;\n    }\n  });\n}\n```\n\nOur watch expression has\
    \ referenced the `\"foo\"` attribute of the `\"mainC.\"`. A bound input should\
    \ be used instead of this. Consider the code which is given below:\n\n```javascript\n\
    module.directive('foobar', function() {\n  return {\n    scope: true,\n    controller:\
    \ 'FoobarCtrl',\n    controllerAs: 'c',\n    bindToController: {\n      foo: '='\n\
    \    },\n    templateUrl: 'bar.html'\n  };\n});\n```\n\nOnce the component is\
    \ being used, the actual value should be plugged in. This is shown below:\n\n\
    ```html\n<foobar foo=\"mainC.foo\">\n</foobar>\n```\n\nInside the watch expression\
    \ for the controller, the bound input can then be used. This is shown below:\n\
    \n```javascript\nfunction FoobarCtrl($scope) {\n  var c = this;\n  $scope.$watch('c.foo',\
    \ function(nFoo) {\n    if (nFoo.active) {\n      ctrl.actFoo = nFoo;\n    } else\
    \ {\n      ctrl.actFoo = null;\n    }\n  });\n}\n```\n\nAn external reference\
    \ may not be used in certain situations. We want to create a code for the controller\
    \ which will reference a code which will just reference a scope attribute which\
    \ is inherited just in plain JavaScript. Here is the code for the example:\n\n\
    ```javascript\nfunction FoobarCtrl($scope) {\n  var c = this;\n  c.getActiveFoo\
    \ = function() {\n    if ($scope.mainC.foo.active) {\n      return $scope.mainC.foo;\n\
    \    } else {\n      return null;\n    }\n  };\n}\n```\n\nThe above example is\
    \ just similar to the previous one, with the only exception being that a bound\
    \ input will be needed. This is shown below:\n\n```javascript\nmodule.directive('foobar',\
    \ function() {\n  return {\n    scope: true,\n    controller: 'FoobarCtrl',\n\
    \    controllerAs: 'c',\n    bindToController: {\n      foo: '='\n    },\n   \
    \ templateUrl: 'bar.html'\n  };\n});\n```\n\nThe `foo` value will be provided\
    \ during the use of the component. This is shown below:\n\n```html\n<foobar foo=\"\
    mainC.foo\">\n</foobar>\n```\n\nOur controller code will then be in a position\
    \ to use the bound input. This is shown below:\n\n```javascript\nfunction FoobarCtrl($scope)\
    \ {\n  var c = this;\n  ctrl.getActiveFoo = function() {\n    if (c.foo.active)\
    \ {\n      return c.foo;\n    } else {\n      return null;\n    }\n  };\n}\n```\n\
    \n## Event handler and Bound output\n\nAll of the external components used in\
    \ components are not logical inputs. Others act as logical outputs. Consider the\
    \ example given below:\n\n```html\n<div ng-show=\"c.visible\">\n  <p>{{c.getText(c.language)}}</p>\n\
    \  <button ng-click=\"mainC.deleteFoobar()\">\n    Delete\n  </button>\n</div>\n\
    ```\n\nIn the above example, and inside our component template, we have the `\"\
    ng-click\"` directive. This has been used to invoke a method on a `\"mainC\"`\
    \ reference which has been inherited. That is what we have done.\n\nFor the dependency\
    \ to be broken, an expression binding named `\"onDelete\"` has to be introduced\
    \ on the definition of the directive. This is shown below:\n\n```javascript\n\
    module.directive('foobar', function() {\n  return {\n    scope: true,\n    controller:\
    \ 'FoobarCtrl',\n    controllerAs: 'c',\n    bindToController: {\n      visible:\
    \ '=',\n      language: '=',\n      onDelete: '&'\n    },\n    templateUrl: 'bar.html'\n\
    \  };\n});\n```\n\nFor the inputs and outputs to be distinguished in AngularJS,\
    \ the syntax `[]` is used for the input and the syntax `()` used for the output.\
    \ However, in the earlier versions of AngularJS, such as `1.x`, there was no mechanism\
    \ as to how these can be distinguished. This is why most people prefer to use\
    \ the prefix `\"on\"` for outputs.\n\nOnce the component has been used, an expression\
    \ for the new binding will then be plugged in. The user of the component will\
    \ then decide on what the delete means to him or her. In our case, we have used\
    \ it so as to invoke the function `\"deleteFoobar\"` of our main controller. This\
    \ is shown below:\n\n```html\n<foobar\n  visible=\"mainC.isFooBarVisible()\"\n\
    \  language=\"mainC.getLanguage()\"\n  onDelete=\"mainC.deleteFoobar()\">\n</foobar>\n\
    ```\n\nThe expression binding will then be invoked from inside the component template.\
    \ This is shown below:\n\n```html\n<div ng-show=\"c.visible\">\n  <p>{{c.getText(c.language)}}</p>\n\
    \  <button ng-click=\"c.onDelete()\">\n    Delete\n  </button>\n</div>\n```\n\n\
    Consider the sample code given below:\n\n```javascript\nfunction FoobarCtrl($scope)\
    \ {\n  var c = this;\n  c.onFooClick = function() {\n    mainC.setActiveFoo(c.foo);\n\
    \  };\n}\n```\n\nIn the above example, we have used a controller function which\
    \ will call a function in the parent scope. The external function call must not\
    \ be an event handler in a particular template. It can be contained in a controller.\
    \ This is what we did with.\n\nWhat we should do to the directive is that we add\
    \ expression binding:\n\n```javascript\nmodule.directive('foobar', function()\
    \ {\n  return {\n    scope: true,\n    controller: 'FoobarCtrl',\n    controllerAs:\
    \ 'c',\n    bindToController: {\n      onDelete: '&'\n    },\n    templateUrl:\
    \ 'bar.html'\n  };\n});\n```\n\nOnce the component has been used, an expression\
    \ for the new binding will then be plugged in. This is shown below:\n\n```html\n\
    <foobar\n  visible=\"mainC.isFooBarVisible()\"\n  language=\"mainC.getLanguage()\"\
    \n  onDelete=\"mainC.deleteFoobar()\">\n</foobar>\n```\n\nThe expression binding\
    \ will then be invoked from inside the component template. This is shown below:\n\
    \n```html\n<div ng-show=\"c.visible\">\n  <p>{{c.getText(c.language)}}</p>\n \
    \ <button ng-click=\"c.onDelete()\">\n    Delete\n  </button>\n</div>\n```\n\n\
    Consider the sample code given below:\n\n```javascript\nfunction FoobarCtrl($scope)\
    \ {\n  var c = this;\n  c.onFooClick = function() {\n    mainC.setActiveFoo(c.foo);\n\
    \  };\n}\n```\n\n## Conclusion\n\nIt can be concluded that AngularJS is a very\
    \ useful framework for the development of web applications. The usefulness of\
    \ AngularJS is seen on what it does to HTML. Generally, it was developed for the\
    \ purpose of extending what is contained in HTML. Note that HTML was not developed\
    \ for the purpose of web-apps.\n\nHowever, AngularJS comes in to fill this gap.\n"
