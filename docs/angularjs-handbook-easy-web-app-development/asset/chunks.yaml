  trans: "\n外部引用不仅可以在组件模板中找到。在组件控制器中，可能还会包含表达式 `\"$watch,\"`、`\"$watchCollection,\"\
    ` 或 `\"$watchGroup.\"`。如果可用，也可以使用链接函数。考虑下面的示例，它展示了如何将其替换为绑定的输入：\n\n```javascript\n\
    function FoobarCtrl($scope) {\n  var c = this;\n  $scope.$watch('mainC.foo', function(nFoo)\
    \ {\n    if (nFoo.active) {\n      ctrl.actFoo = nFoo;\n    } else {\n      c.actFoo\
    \ = null;\n    }\n  });\n}\n```\n\n我们的监听表达式引用了 `\"mainC.\"` 的 `\"foo\"` 属性。应该使用绑定的输入代替它。考虑下面的代码：\n\
    \n```javascript\nmodule.directive('foobar', function() {\n  return {\n    scope:\
    \ true,\n    controller: 'FoobarCtrl',\n    controllerAs: 'c',\n    bindToController:\
    \ {\n      foo: '='\n    },\n    templateUrl: 'bar.html'\n  };\n});\n```\n\n一旦组件被使用，就应该接入实际值。如下所示：\n\
    \n```html\n<foobar foo=\"mainC.foo\">\n</foobar>\n```\n\n在控制器的监听表达式内部，就可以使用绑定的输入了。如下所示：\n\
    \n```javascript\nfunction FoobarCtrl($scope) {\n  var c = this;\n  $scope.$watch('c.foo',\
    \ function(nFoo) {\n    if (nFoo.active) {\n      ctrl.actFoo = nFoo;\n    } else\
    \ {\n      c.actFoo = null;\n    }\n  });\n}\n```\n\n在某些情况下，不能使用外部引用。我们想为控制器创建代码，该代码将引用一段仅在纯\
    \ JavaScript 中继承的作用域属性的代码。这里是该示例的代码：\n\n```javascript\nfunction FoobarCtrl($scope)\
    \ {\n  var c = this;\n  c.getActiveFoo = function() {\n    if ($scope.mainC.foo.active)\
    \ {\n      return $scope.mainC.foo;\n    } else {\n      return null;\n    }\n\
    \  };\n}\n```\n\n上面的示例与上一个相似，唯一的区别是需要一个绑定的输入。如下所示：\n\n```javascript\nmodule.directive('foobar',\
    \ function() {\n  return {\n    scope: true,\n    controller: 'FoobarCtrl',\n\
    \    controllerAs: 'c',\n    bindToController: {\n      foo: '='\n    },\n   \
    \ templateUrl: 'bar.html'\n  };\n});\n```\n\n`foo` 值将在使用组件时被提供。如下所示：\n\n```html\n\
    <foobar foo=\"mainC.foo\">\n</foobar>\n```\n\n我们的控制器代码随后将能够使用绑定的输入。如下所示：\n\n```javascript\n\
    function FoobarCtrl($scope) {\n  var c = this;\n  ctrl.getActiveFoo = function()\
    \ {\n    if (c.foo.active) {\n      return c.foo;\n    } else {\n      return\
    \ null;\n    }\n  };\n}\n```\n\n## 事件处理器和绑定输出\n\n组件中使用的所有外部组件并非逻辑输入。其他的则作为逻辑输出。考虑下面的示例：\n\
    \n```html\n<div ng-show=\"c.visible\">\n  <p>{{c.getText(c.language)}}</p>\n \
    \ <button ng-click=\"mainC.deleteFoobar()\">\n    Delete\n  </button>\n</div\n\
    ```\n\n在上面的示例中，在我们的组件模板内部，我们有 `\"ng-click\"` 指令。它被用于调用已继承的 `\"mainC\"` 引用上的方法。这就是我们所做的。\n\
    \n为了打破依赖，必须在指令的定义上引入一个名为 `\"onDelete\"` 的表达式绑定。如下所示：\n\n```javascript\nmodule.directive('foobar',\
    \ function() {\n  return {\n    scope: true,\n    controller: 'FoobarCtrl',\n\
    \    controllerAs: 'c',\n    bindToController: {\n      visible: '=',\n      language:\
    \ '=',\n      onDelete: '&'\n    },\n    templateUrl: 'bar.html'\n  };\n});\n\
    ```\n\n在 AngularJS 中，为了区分输入和输出，`[]` 语法用于输入，`()` 语法用于输出。然而，在 AngularJS 的早期版本（如\
    \ `1.x`）中，没有区分这些者的机制。这就是为什么大多数人倾向于为输出使用 `\"on\"` 前缀。\n\n一旦组件被使用，就会为新绑定接入表达式。组件的用户将决定删除对他/她意味着什么。在我们的案例中，我们使用它是调用主控制器的\
    \ `\"deleteFoobar\"` 函数。如下所示：\n\n```html\n<foobar\n  visible=\"mainC.isFooBarVisible()\"\
    \n  language=\"mainC.getLanguage()\"\n  onDelete=\"mainC.deleteFoobar()\">\n</foobar>\n\
    ```\n\n该表达式绑定将从组件模板内部被调用。如下所示：\n\n```html\n<div ng-show=\"c.visible\">\n  <p>{{c.getText(c.language)}}</p>\n\
    \  <button ng-click=\"c.onDelete()\">\n    Delete\n  </button>\n</div\n```\n\n\
    考虑下面的示例代码：\n\n```javascript\nfunction FoobarCtrl($scope) {\n  var c = this;\n\
    \  c.onFooClick = function() {\n    mainC.setActiveFoo(c.foo);\n  \n```\n\n在上面的示例中，我们使用了一个调用父作用域函数的控制器函数。外部函数调用不是特定模板中的事件处理器。它可以包含在控制器中。这就是我们所做的。\n\
    \n我们需要对指令做的是添加表达式绑定：\n\n```javascript\nmodule.directive('foobar', function() {\n\
    \  return {\n    scope: true,\n    controller: 'FoobarCtrl',\n    controllerAs:\
    \ 'c',\n    bindToController: {\n      onDelete: '&'\n    },\n    templateUrl:\
    \ 'bar.html'\n  };\n});\n```\n\n一旦组件被使用，就会为新绑定接入表达式。如下所示：\n\n```html\n<foobar\n\
    \  visible=\"mainC.isFooBarVisible()\"\n  language=\"mainC.getLanguage()\"\n \
    \ onDelete=\"mainC.deleteFoobar()\">\n</foobar>\n```\n\n该表达式绑定将从组件模板内部被调用。如下所示：\n\
    \n```html\n<div ng-show=\"c.visible\">\n  <p>{{c.getText(c.language)}}</p>\n \
    \ <button ng-click=\"c.onDelete()\">\n    Delete\n  </button>\n</div\n```\n\n\
    ## 结论\n\n可以得出结论，AngularJS 是开发 Web 应用程序非常有用的框架。AngularJS 的用用体现在它对 HTML 所所的作用。通常，它是为了扩展\
    \ HTML 中包含的内容而开发的。注意，HTML 并不是为了 Web 应用程序而开发的。\n\n然而，AngularJS 的出现填补了这一空白。\n\n"
