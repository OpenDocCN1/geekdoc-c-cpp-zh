  trans: "\n\n与其执行上述操作（即在事件监听器内部调用 `$digest()` 函数），也可以像下面所示使用 `apply()` 函数：\n\n```javascript\n\
    document.getElementById(\"upTimeButton\")\n  .addEventListener('click', function()\
    \ {\n    $scope.$apply(function() {\n      console.log(\"change time clicked\"\
    );\n      $scope.data.time = new Date();\n    });\n  });\n```\n\n函数 `$scope.$apply()`\
    \ 在按钮的事件监听器内部被调用，变量 `$scope.data.time` 的更新已作为参数传递给 `$apply()` 函数。一旦 `$apply()`\
    \ 函数执行完毕，AngularJS 将在内部调用 `$digest()` 函数，以便对所有数据绑定进行更新。\n\n# 第 7 章 - \"$scope\"\
    \ 的层级结构\n\n视图使用的 AngularJS `$scope` 对象被组织成一个层级结构。我们从根作用域（root scope）开始，它由一个或多个子作用域组成。每个可用视图由自己的作用域组成，该作用域只是根作用域的子级。这意味着视图控制器在\
    \ `$scope` 上设置的变量对其他控制器都是不可见的。\n\n考虑下面提供的 AngularJS 代码作为示例：\n\n```html\n<!DOCTYPE\
    \ html>\n<html lang=\"en\">\n<head>\n<script src=\"https://ajax.googleapis.com/ajax/libs/angularjs/1.2.5/angular.min.js\"\
    ></script>\n</head>\n<body ng-app=\"myapplication\">\n  <div ng-controller=\"\
    appController1\">\n    {{data.theVariable}}\n  </div>\n  <div ng-controller=\"\
    appController2\">\n    {{data.theVariable}}\n  </div>\n  <script>\n    var module\
    \ = angular.module(\"myapplication\", []);\n    var appController1 = module.controller(\"\
    appController1\", function($scope) {\n      $scope.data = { theVariable : \"first\
    \ value\"};\n    });\n    var appController2 = module.controller(\"appController2\"\
    , function($scope) {\n      $scope.data = { theVariable : \"second value\"};\n\
    \    });\n  </script>\n</body>\n</html>\n```\n\n在上面的示例中，我们使用了两个视图，每个视图都有自己的控制器。每个控制器都会将\
    \ `data.theVariable` 变量设置为不同的值。\n\n一旦程序执行，你将获得以下层级结构：\n\n- 根 `$scope`\n- appController\
    \ 1 的 `$scope`\n- appController 2 的 `$scope`\n\n如所示，两个视图使用了不同的作用域对象。通过此示例，我们的两个视图内部的\
    \ `{{data.theVar}}` 数据绑定也将写入两个不同的值。`$scope` 对象中的变量 `data.theVariable` 也会被设置为不同的值。\n\
    \n# 第 8 章- 重构 AngularJS 应用\n\n基于组件的指令（Directives）在 AngularJS 中变得越来越流行。这是因为组件带来了易用性。然而，目前使用的大多数\
    \ Angular 应用并不是基于组件的。\n\n对于 Angular2 用户，可以按照以下方式使用组件：\n\n```html\n<confirmation\n\
    \    [message]=\"'Start firing?'\"\n    (ok)=\"startFiring()\">\n</confirmation>\n\
    ```\n\n如上面的示例所示，组件只是 HTML 中的一个元素，它匹配在其他处定义的组件名称。每个组件都有自己的输入和输出，这些是作为属性提供给元素的。\n\
    \n上面的组件也可以如下所示定义：\n\n```typescript\n@Component({\n  selector: 'confirmation',\n\
    \  properties: ['message'],\n  events: ['ok']\n})\n@View({\n  template: `\n  \
    \  <div>\n      {{message}}\n      <button (click)=\"ok()\">OK</button>\n    </div>\n\
    \  `\n})\nclass Confirmation {\n  okEvents = new EventEmitter();\n  ok() {\n \
    \   this.okEvents.next();\n  }\n}\n```\n\n使用接口边界来规范组件可以处理的输入和输出。UI 模板被用于为用户定义接口。组件逻辑隐藏在\
    \ UI 模板之后，用于定义组件的行为以及当用户与其交互时的操作。将组件定义为指令可以如下所示：\n\n```typescript\n@Component({\n\
    \  selector: 'confirmation',\n  properties: ['message'],\n  events: ['ok']\n})\n\
    @View({\n  template: `\n    <div>\n      {{message}}\n      <button (click)=\"\
    ok()\">OK</button>\n    </div>\n  `\n})\nclass Confirmation {\n  okEvents = new\
    \ EventEmitter();\n  ok() {\n    this.okEvents.next();\n  }\n}\n```\n\n上面的代码与我们之前的完全不同。在\
    \ AngularJS 中可以很容易地完成或使用使用重构。我们想提供一个关于如何操作的示例：\n\n考虑下面文件 `index.html` 的代码：\n\n\
    ```html\n<div ng-include=\"'bar.html'\"></div>\n```\n\n为了替换上述内容，我们必须为 `bar` 创建一个指令。这将使用继承的作用域和\
    \ ` `bar.html` 模板。`bar_directive.js` 的代码如下：\n\n```javascript\nmodule.directive('bar',\
    \ function() {\n  return {\n    scope: true,\n    templateUrl: 'bar.html'\n  };\n\
    });\n```\n\n为了让其有效工作，指令和模板必须位于同一位置，并且它们的名称也应该匹配。如下所示：\n\n`components/foobar/`\n\
    - `bar_directive.js`\n- `bar.html`\n\n原始的 `ng-include` 应该被新指令替换。如下所示：\n\n```html\n\
    <div ng-include=\"'footbar.html'\"></div>\n<footbar></footbar>\n```\n\n在添加上述组件指令（即\
    \ `footbar`）之后，模板本身将如下所示：\n\n```html\n<div ng-controller=\"FoobarCtrl as c\">\n\
    \  <p>{{c.getText()}}</p>\n</div>\n```\n\n我们接着想要移动并重命名包含 FootCtrl 的文件，使其与我们的组件指令位于同一位置。如下所示：\n\
    \n`components/foobar/`\n- `bar_directive.js`\n- `bar_controller.js`\n- `bar.html`\n\
    \n然后应该在指令中使用控制器，并使用与我们的 `ng-controller` 相同的 `ctrl` 别名。文件 `bar_directive.js` 如下：\n\
    \n```javascript\nmodule.directive('bar', function() {\n  return {\n    scope:\
    \ true,\n    controller: 'FoobarCtrl',\n    controllerAs: 'c',\n    templateUrl:\
    \ 'bar.html'\n  };\n});\n```\n\n现在可以从模板中移除 `ng-controller`。如下所示：\n\n```html\n\
    <div ng-controller=\"FoobarCtrl as c\">\n  <p>{{c.getText()}}</p>\n</div>\n```\n\
    \n我们也可以选择保留此元素用于样式设置。考虑以下示例：\n\n```html\n<div ng-controller=\"FoobarCtrl as c\"\
    >\n  <p>{{c.getText()}}</p>\n</div>\n```\n\n在上述表示模板的示例中，我们有一个 `ng-controller`。我们需要创建一个新的指令。这应该创建一个继承的作用域，并使用\
    \ `FoobarCtrl` 然后将其别命名为 `c`。如下所示：\n\n```javascript\nmodule.directive('bar', function()\
    \ {\n  return {\n    scope: true,\n    controller: 'FoobarCtrl',\n    controllerAs:\
    \ 'c'\n  };\n});\n```\n\n我们的新指令和控制器将移动到相同的位置。它们应该具有相同的前缀。如下所示：\n\n`components/foobar/`\n\
    - `bar_directive.js`\n- `bar_controller.js`\n\n最后，在原始模板中，可以将 `ng-controller` 替换为组件\
    \ `footobar` 的实例。如下所示：\n\n```html\n<div ng-controller=\"FoobarCtrl as c\" class=\"\
    foo-bar\">\n  <footbar class=\"foo-bar\">\n    <p>{{c.getText()}}</p>\n  </footbar>\n\
    </div>\n```\n\n这是我们现在拥：\n\n```html\n<div ng-controller=\"FoobarCtrl as c\" class=\"\
    foo-bar\">\n  <footbar class=\"foo-bar\">\n    <p>{{c.getText()}}</p>\n  </footbar>\n\
    </div>\n```\n\n应该应该为组件指令创建一个模板文件。如下所示：\n\n`components/foobar/`\n- `bar_directive.js`\n\
    - `bar_controller.js`\n- `bar.html`\n\n新模板应该从指令中引用。可以如下所示操作：\n\n```javascript\n\
    module.directive('footobar', function() {\n  return {\n    scope: true,\n    controller:\
    \ 'FoobarCtrl',\n    controllerAs: 'c',\n    templateUrl: 'bar.html'\n  };\n});\n\
    ```\n\n我们将使用指令元素中包含的内容来填充新模板。如下所示：\n\n```html\n<p>{{c.getText()}}</p>\n```\n\n"
- fmt: "\nThe directive element will itself become empty. The `index.html` file will\
    \ then be as follows:\n\n```html\n<foobar>\n<p>{{c.getText()}}</p>\n</foobar>\n\
    ```\n\nAfter the `ng-controller` has been replaced with the directive, the original\
    \ template will be left with the following:\n\n```html\n<foobar>\n<h2>{{c.getTitle()}}</h2>\n\
    <p>{{mainC.getText()}}</p>\n</foobar>\n```\n\nTransclusion can be used for the\
    \ purpose of supporting both of the cases. We will begin by creating a template\
    \ file for our component directive. This is shown below:\n\n`components/foobar/`\n\
    *   `bar_directive.js`\n*   `bar_controller.js`\n*   `bar.html`\n\nThe new template\
    \ can then be referenced from our directive. At the same time, transclusion will\
    \ also be enabled, as shown below:\n\n```javascript\nmodule.directive('foobar',\
    \ function() {\n  return {\n    transclude: true,\n    scope: true,\n    controller:\
    \ 'FoobarCtrl',\n    controllerAs: 'c',\n    templateUrl: 'bar.html'\n  };\n});\n\
    ```\n\nThe population of the template file will be done by use of a part of the\
    \ original template which is needed to be put inside the component. The directive\
    \ `ng-transclude` will be added for the other part. The `bar.html` file should\
    \ have the following code:\n\n```html\n<h2>{{c.getTitle()}}</h2>\n<p ng-transclude></p>\n\
    ```\n\nIn our directive element, we will leave the part which is to be transcluded.\
    \ This is shown below:\n\n```html\n<foobar>\n<h2>{{c.getTitle()}}</h2>\n<p>{{mainC.getText()}}</p>\n\
    </foobar>\n```\n\nConsider the next example.\n\nWe have a `<ul>` element for listing\
    \ some data. This is shown below:\n\n```html\n<div>\n  <h1>Foobars</h1>\n  <ul>\n\
    \    <li ng-repeat=\"foo in c.bars\">\n      <img ng-src=\"foo.imageUrl\"/>\n\
    \      {{file.text}}\n    </li>\n  </ul>\n</div>\n```\n\nWe need to perform the\
    \ listing into its own component. A directive and a template file should be created\
    \ for the component. This should be called in the directive as shown below:\n\n\
    `components/foobar_list/`\n*   `foobar_list_directive.js`\n*   `foobar_list.html`\n\
    \nThe directive will create an inherited scope, and then reference the template\
    \ which has been created. This is shown below:\n\n```javascript\nmodule.directive('foobarList',\
    \ function() {\n  return {\n    scope: true,\n    templateUrl: 'list.html'\n \
    \ };\n});\n```\n\nThe template will be populated by copying the HTML file which\
    \ has been populated from our original template. This is shown below:\n\n```html\n\
    <ul>\n  <li ng-repeat=\"foo in c.bars\">\n    <img ng-src=\"foo.imageUrl\"/>\n\
    \    {{file.text}}\n  </li>\n</ul>\n```\n\nA new instance of this component can\
    \ then be used in the original template. It will replace the markup which has\
    \ been created. This is shown below:\n\n```html\n<div>\n  <h1>Foobars</h1>\n \
    \ <ul>\n    <li ng-repeat=\"foo in c.bars\">\n      <img ng-src=\"foo.imageUrl\"\
    />\n      {{file.text}}\n    </li>\n  </ul>\n  <foobar-list></foobar-list>\n</div>\n\
    ```\n\nAn example can also be created which makes use of transclusion. An example\
    \ of this is given below:\n\n```html\n<div>\n  <h1>Foobars</h1>\n  <ul>\n    <li\
    \ ng-repeat=\"foo in c.bars\">\n      <h3>\n        {{mainC.itemHeader}}\n   \
    \   </h3>\n      <img ng-src=\"foo.imageUrl\"/>\n      {{file.text}}\n    </li>\n\
    \  </ul>\n</div>\n```\n\nThe `<ul>` element from our previous example has some\
    \ content coming from the outside, and transclusion can be used for the purpose\
    \ of both of these. In the above example, we have used an item header which has\
    \ been provided by `mainC`.\n\nWhen the listing is extracted into its own component,\
    \ a directive and a template should then be created for that file. This is shown\
    \ below:\n\n`components/foobar_list/`\n*   `bar_list_directive.js`\n*   `bar_list.html`\n\
    \nThe directive will create an inherited scope, and the newly created template\
    \ file will then be referenced. Transclusion will also be enabled.\n\nThe code\
    \ for the file `bar_list_directive.js` should be as follows:\n\n```javascript\n\
    module.directive('foobarList', function() {\n  return {\n    transclude: true,\n\
    \    scope: true,\n    templateUrl: 'bar_list.html'\n  };\n});\n```\n\nThe population\
    \ of the template will be done by copying the HTML which has been extracted from\
    \ our original template. The part for the item header will be replaced with an\
    \ `ng-transclude` element.\n\nThe code for `bar_list.htm` should be as follows:\n\
    \n```html\n<ul>\n  <li ng-repeat=\"foo in c.bars\">\n    <ng-transclude></ng-transclude>\n\
    \    <img ng-src=\"foo.imageUrl\"/>\n    {{file.text}}\n  </li>\n</ul>\n```\n\n\
    A new instance of this component can then be used in our new template. It will\
    \ replace the markup which has been extracted, but an item header will be left.\
    \ This is shown below:\n\n```html\n<div>\n  <h1>Foobars</h1>\n  <ul>\n    <li\
    \ ng-repeat=\"foo in c.bars\">\n      <img ng-src=\"foo.imageUrl\"/>\n      {{file.text}}\n\
    \    </li>\n  </ul>\n</div>\n```\n\n(Note: The remaining text follows the same\
    \ pattern of wrapping variables and code in backticks as per the provided rules.)\
    \ \n"
