  trans: "\n\n![](img/00001.jpeg)\n\n# AngularJS 手册\n简单的 Web 应用开发\n作者：Rick L.\n\n\
    Copyright©2016 Rick L.\n保留所有权利\nCopyright © 2016 by Rick L.\n保留所有权利。未经作者事先书面许可，不得以任何形式或通过任何手段（包括复印、录制或其他电子或机械方法）复制、发行或传输本出版物的任何部分，但评论中的简要引用以及版权法允许的某些非商业用途除外。\n\
    \n## 目录\n- 第 1 章- AngularJS 概述\n- 第 2 章- AngularJS 与 HTML\n- 第 3 章- XHRs\n- 第\
    \ 4 章- 链接与图片\n- 第 5 章- 使用动画\n- 第 6 章- $watch() , $digest(), 和 $apply()\n- 第 7\
    \ 章-“$scope”的层级\n- 第 8 章- 重构 AngularJS 应用\n- 结论\n\n## 免责声明\n尽管已尽一切努力验证书中提供的信息，但作者对书中包含的主题的错误、遗漏或相反的解释概不承担任何责任。书中提供的信息仅供教育和娱乐之用。读者应对自己的行为负责，作者对使用这些信息而导致的任何责任或损害（无论真实的还是感知的）均不承担任何责任。\n\
    \n所使用的商标均未经许可，且商标的发布未获得商标所有者的许可或支持。书中的所有商标和品牌仅用于说明目的，并归所有者所有，与本文档无关联。\n\n# 第 1\
    \ 章- AngularJS 概述\n该框架通过对 HTML 提供的功能进行扩展来工作。如果 HTML 是为了开发 Web 应用而创建的，那么它应该是 AngularJS。在声明静态文档方面，HTML\
    \ 是最好的。然而，对于我们 Web 应用中动态视图的声明，它并不理想。通过 Angular，你应用程序中使用的 HTML 词汇可以得到极大扩展。之后，你将获得一个易于阅读、具有表现力且开发速度更快的环境。\n\
    \n在书中，我们将探索 AngularJS 的各种功能，你作为开发者可以利用这些功能来改进应用程序的外观和体验。\n\n# 第 2 章- AngularJS\
    \ 与 HTML\n如你所知，AngularJS 用于扩展 HTML 的功能。你们大多数人都知道如何使用标准 HTML。然而，AngularJS 用于扩展这些功能。在本章中，我们想要创建一个\
    \ HTML 页面，然后将 HTML 中编写的代码转换为模板，该模板将被 AngularJS 使用以动态显示相同的数据。HTML 页面中仅添加基本信息。\n\
    \n# 这里是网页的第一个段代码：\n```html\n<ul>\n  <li>\n    <span> Motorola </span>\n    <p>\n\
    \      I really like Motorola phones.\n    </p>\n  </li>\n  <li>\n    <span>Nokia\
    \ are the best in Wi-Fi connection</span>\n    <p>\n      I really like to make\
    \ use of devices.\n    </p>\n  </li>\n</ul>\n```\n\n# 你可以继续在上面的文件中添加静态 HTML。下面给出了一个示例：\n\
    ```html\n<p> The number of available phones is: 2</p>\n```\n\n# 在示例中，我们刚刚使用了静态\
    \ HTML 来渲染刚刚创建的网页内容。通过 AngularJS，相同的内容可以动态渲染。\n\n# 我们的目标是使我们创建的页面变为动态。还应该实现一个测试用例，以便对我们的控制器进行测试。在\
    \ AngularJS 中，MV 模型（模型-视图-控制器）用于组织应用程序的结构。通过这种方式，代码实现了解耦，并实现了关注点分离的概念。模型、视图和控制器将在此应用中添加。在\
    \ Angular 中发生的是模型通过视图投影到模板中。这表明如果发生某些变化，所有的绑定点都将更新，从而更新视图。视图在 Angular 中是从模型构建的。\n\
    \n# 考虑给出的示例：\n```html\n<html ng-app=\"myApp\">\n<head>\n...\n<script src=\"myapps/angular/angular.js\"\
    ></script>\n<script src=\"js/controllers.js\"></script>\n</head>\n<body ng-controller=\"\
    PhoneListCtrl\">\n  <ul>\n    <li ng-repeat=\"model in phones\">\n      <span>{{model.name}}</span>\n\
    \      <p>{{model.snippet}}</p>\n    </li>\n  </ul>\n</body>\n</html>\n```\n\n\
    # 你所做的是将 `ng-repeat` 指令替换为控制器中硬编码的 `phones` 列表。如下所示：\n```javascript\nvar myApp\
    \ = angular.module('myApp', []);\nmyApp.controller('PhoneListCtrl', function ($scope)\
    \ {\n  $scope.phones = [\n    {name: 'Motorola', snippet: 'I really like Motorola\
    \ phones.'},\n    {name: 'Nokia are the best in Wi-Fi connection', snippet: 'I\
    \ really like to make use of devices.'}\n  ];\n});\n```\n\n## 测试\n在 AngularJS\
    \ 中，控制器和视图是分离的。通过这种方式，代码在开发期间也是可测试的。如果控制器在全局空间可用，我们可以模拟 `scope` 对象。示例所示：\n```javascript\n\
    describe('PnListCtrl', function(){\n  it(' a \"phones\" model with 2 phones, function()\
    \ {\n    var scope = {},\n    ctrl = new PnListCtrl(scope);\n    expect(scope.phones.length).toBe(2);\n\
    \  });\n});\n```\n\n"
- fmt: "\nA repeater for the creation of a simple table should then be created in\
    \ the file. This can be implemented as follows:\n\n```html\n<table>\n  <tr><th>the\
    \ row number</th></tr>\n  <tr ng-repeat=\"j in [0, 1, 2, 3, 4, 5, 6, 7]\"><td>{{j}}</td></tr>\n\
    </table>\n```\n\nThe list should then be modified to the following:\n\n```html\n\
    <table>\n  <tr><th>the row number</th></tr>\n  <tr ng-repeat=\"j in [0, 1, 2,\
    \ 3, 4, 5, 6, 7]\"><td>{{j+1}}</td></tr>\n</table>\n```\n\nThe `ng-repeat` can\
    \ be used for the creation of another table with some other specifications. That\
    \ is also very powerful in `AngularJS`. At this point, you will have an app working\
    \ dynamically and it has the model, the view, and the controller located separately.\n\
    \n# Chapter 3- XHRs\n\nYou should not always handle small and hard-coded data\
    \ in your application. We should be able to fetch large data sets from our `AngularJS`\
    \ servers by the use of the pre-built services named `$http`.\n\nWe will have\
    \ the file `app/phones/devices.json`, which has the list of phones that we have.\
    \ These will be stored in a JSON format. A sample part of the file looks as follows:\n\
    \n```json\n[\n{\n  \"age\": 15,\n  \"id\": \"motorola \",\n  \"name\": \"Motorola\
    \ DEFY\\u2122 with MOTOBLUR\\u2122\",\n  \"snippet\": \"Do you enjoy using Motorola\
    \ devices and phones?\"\n...\n},\n...\n]\n```\n\n## Controller\n\nThe `$http`\
    \ service for `Angular` will be used in the controller for making an HTTP request\
    \ to the web server so as to fetch data from the file `app/phones/devices.json`.\
    \ This is just one of the ways how this can be handled or the processing of operations\
    \ related to web apps. With `AngularJS`, these services are injected where they\
    \ are needed.\n\nThe code for the controller should be as shown below:\n\n```javascript\n\
    var myApp = angular.module('myApp', []);\nmyApp.controller('PnListCtrl', function\
    \ ($scope, $http) {\n  $http.get('phones/devices.json').success(function(data)\
    \ {\n    $scope.phones = data;\n  });\n  $scope.orderProp = 'age';\n});\n```\n\
    \nFor a service to be used in `Angular`, the names of the dependencies which are\
    \ needed have to be defined as arguments to the controller constructor function.\
    \ This is shown below:\n\n```javascript\nmyApp.controller('PnListCtrl', function\
    \ ($scope, $http) {...}\n```\n\nThe dependency constructor in `AngularJS` will\
    \ provide the services to our controller once it has been launched. The process\
    \ of creating any of the transitive dependencies which the service may have is\
    \ also taken care of. Consider the example given below, showing how this can be\
    \ done:\n\n```javascript\nvar myApp = angular.module('myApp', []);\nmyApp.controller('PnListCtrl',\
    \ ['$scope', '$http',\nfunction ($scope, $http) {\n  $http.get('phones/devices.json').success(function(data)\
    \ {\n    $scope.phones = data;\n  });\n  $scope.orderProp = 'age';\n}]);\n```\n\
    \nThe test can be done as follows:\n\n```javascript\ndescribe('myApp controllers',\
    \ function() {\ndescribe('PnListCtrl', function(){\n  var scope, ctrl, $httpBackend;\n\
    \  // Loading our app module definition before the test.\n  beforeEach(module('myApp'));\n\
    \  // The injector will ignore the leading and the trailing underscores here (i.e.\
    \ _$httpBackend_).\n  // This will allow us to inject the service but also attach\
    \ it to the variable\n  // with a name which is same as the service so as to avoid\
    \ a name conflict.\n  beforeEach(inject(function(_$httpBackend_, $rootScope, $controller)\
    \ {\n    $httpBackend = _$httpBackend_;\n    $httpBackend.expectGET('phones/devices.json').\n\
    \    respond([{name: 'Motorola'}, {name: 'Motorola Phone'}]);\n    scope = $rootScope.$new();\n\
    \    ctrl = $controller('PnListCtrl', {$scope: scope});\n  }));\n```\n\nNotice\
    \ the two helper functions in the above test case. These can be used for configuration\
    \ and accessing the injector.\n\nConsider the code given below:\n\n```javascript\n\
    it('You should create \"phones\" model having 2 phones which have been fetched\
    \ from the xhr', function() {\n  expect(scope.phones).toBeUndefined();\n  $httpBackend.flush();\n\
    \  expect(scope.phones).toEqual([{name: 'Motorola'},\n  {name: 'Motorola Phone'}]);\n\
    });\n```\n\nWe want to perform a verification on our model which does not exist\
    \ on the scope before we have received the response. After calling the function\
    \ `$httpBackend.flush()`, the request queue will be flushed into the browser.\
    \ The promise which is returned by the service `$http` will be resolved with our\
    \ resolved response. We will make the assertions, and then verify whether the\
    \ model belongs to the scope. We can then verify whether the `orderProp` has been\
    \ set correctly. This is shown below:\n\n```javascript\nit('the default value\
    \ should be set', function() {\n  expect(scope.orderProp).toBe('age');\n});\n\
    ```\n\nIn `Angular`, the following is observed:\n`<pre>{{phones | query | orderProp}}</pre>`\n\
    \nThe output should be:\n`$scope.devices = data.splice(0, 5);`\n\n# Chapter 4-\
    \ Links & Images\n\nYou should know how to add images to the devices. Note that\
    \ in the JSON file, the URLs are available. Consider the code below:\n\n```json\n\
    [\n{\n  \"id\": \"motorola \",\n  \"imageUrl\": \"img/phones/motorola.jpg\",\n\
    \  \"name\": \"Motorola \"\n}\n```\n\nThe template should be as follows:\n\n```html\n\
    <ul class=\"phones\">\n  <li ng-repeat=\"device in phones | query | orderProp\"\
    \ class=\"thumbnail\">\n    <a href=\"#phones/{{device.id}}\" class=\"thumb\"\
    ><img ng-src=\"{{device.imageUrl}}\"></a>\n    <a href=\"#phones/{{device.id}}\"\
    >{{device.name}}</a>\n    <p>{{device.snippet}}</p>\n  </li>\n</ul>\n```\n\nThe\
    \ test for the links can be implemented as follows:\n\n```javascript\nit(' device\
    \ specific links should be rendered ', function() {\n  var myquery = element(by.model('query'));\n\
    \  myquery.sendKeys('nexus');\n  element.all(by.css('.phones a')).first().click();\n\
    \  browser.getLocationAbsUrl().then(function(url) {\n    expect(url).toBe('/phones/motorola');\n\
    \  });\n});\n```\n\n# Chapter 5- Working with Animations\n\nSometimes, you might\
    \ need to enhance your application by adding some animations to it. This can be\
    \ done by use of both CSS and JavaScript. For the animations to be enabled throughout\
    \ the application, we have to use the `ngAnimate` module. The common `ng` directives\
    \ have to be used for the purpose of triggering the hooks for the animations we\
    \ are tapping into. This should be done automatically. Once the animation has\
    \ been found, it is executed between the standard DOM element which has been issued\
    \ to the element at that given time. The `ngRepeat` and `ngClass` can be used\
    \ for doing this, just by removing or adding elements to them.\n\nWe now need\
    \ to install the dependencies to be used on the client-side of the application.\
    \ Bower can be used for this purpose. We need to update the configuration file\
    \ `bower.json` so that it includes the new dependency.\n\n```json\n{\n  \"name\"\
    : \"angular-seed\",\n  \"description\": \"A project for AngularJS starting\",\n\
    \  \"version\": \"0.0.0\",\n  \"homepage\": \"https://mysite.com/angular/angular-project\"\
    ,\n  \"license\": \"MIT\",\n  \"private\": true,\n  \"dependencies\": {\n    \"\
    angular\": \"1.4.x\"\n  }\n}\n```\n"
  raw: 'A repeater for the creation of a simple table should then be created in the
    file. This can be implemented as follows:


    <table>


       <tr><th>the row number</th></tr>


       <tr ng-repeat="j in [0, 1, 2, 3, 4, 5, 6, 7]"><td>{{j}}</td></tr>


    </table>


    The list should then be modified to the following:


    <table>


      <tr><th>the row number</th></tr>


      <tr ng-repeat="j in [0, 1, 2, 3, 4, 5, 6, 7]"><td>{{j+1}}</td></tr>


    </table>


    The “ng-repeat” can be used for the creation of another table with some other
    specifications. That is also very powerful in Angular. At this point, you will
    have an app working dynamically and it has the model, the view, and the controller
    located separately.


    # Chapter 3- XHRs


    You should not always handle small and hard-coded data in your application. We
    should be able to fetch large data sets from our AngularJS servers by the use
    of the pre-built services named “$http.”


    We will have the file “app/phones/devices.json,” which has the list of phones
    that we have. These will be stored in a JSON format. A sample part of the file
    looks as follows:


    [


    {


       "age": 15,


      "id": "motorola ",


        "name": "Motorola DEFY\u2122 with MOTOBLUR\u2122",


        "snippet": "Do you enjoy using Motorola devices and phones?"


    ...


    },


    ...


    ]


    Controller


    The “$http” service for Angular will be used in the controller for making an HTTP
    request to the web server so as to fetch data from the file “app/phones/devices.json.”This
    is just one of the ways  how this can be handled or the processing of operations
    related to web apps. With AngularJS, these services are injected where they are
    needed.


    The code for the controller should be as shown below:


    var myApp = angular.module(''myApp'', []);


        myApp.controller(''PnListCtrl'', function ($scope, $http) {


        $http.get(''phones/devices.json'').success(function(data) {


        $scope.phones = data;


    });


        $scope.orderProp = ''age'';


    });


    For a service to be used in Angular, the names of the dependencies which are needed
    have to be defined as arguments to the controller constructor function. This is
    shown below:


    myApp.controller(''PnListCtrl'', function ($scope, $http) {...}


    The dependency constructor in AngularJS will provide the services to our controller
    once it has been launched. The process of creating any of the transitive dependencies
    which the service may have is also taken care of. Consider the example given below,
    showing how this can be done:


    var myApp = angular.module(''myApp'', []);


    myApp.controller(''PnListCtrl'', [''$scope'', ''$http'',


    function ($scope, $http) {


       $http.get(''phones/devices.json'').success(function(data) {


       $scope.phones = data;


    });


      $scope.orderProp = ''age'';


    }]);


    The test can be done as follows:


    describe(''myApp controllers'', function() {


    describe(''PnListCtrl'', function(){


        var scope, ctrl, $httpBackend;


    // Loading our app module definition before the test.


        beforeEach(module(''myApp''));


    // The injector will ignore the leading and the trailing underscores here (i.e.
    _$httpBackend_).


    // This will allow us to inject the service but also attach it to the variable


    // with a name which is same as the service so as to avoid a name conflict.


    beforeEach(inject(function(_$httpBackend_, $rootScope, $controller) {


       $httpBackend = _$httpBackend_;


       $httpBackend.expectGET(''phones/devices.json'').


    respond([{name: ''Motorola''}, {name: ''Motorola Phone''}]);


    scope = $rootScope.$new();


       ctrl = $controller(''PnListCtrl'', {$scope: scope});


    }));


    Notice the two helper functions in the above test case. These can be used for
    configuration and accessing the injector.


    Consider the code given below:


    it(''You should create "phones" model having 2 phones which have been fetched
    from the xhr'', function() {


        expect(scope.phones).toBeUndefined();


        $httpBackend.flush();


        expect(scope.phones).toEqual([{name: ''Motorola''},


        {name: ''Motorola Phone''}]);


    });


    We want to perform a verification on our model which does not exist on the scope
    before we have received the response. After calling the function “$httpBackend.flush(),”
    the request queue will be flushed into the browser. The promise which is returned
    by the service “$http” will be resolved with our resolved response. We will make
    the assertions, and then verify whether the model belongs to the scope. We can
    then verify whether the “orderProp” has been set correctly. This is shown below:


    it(''the default value should be set for the orderProp model'', function() {


         expect(scope.orderProp).toBe(''age'');


    });


    In the karma tab, the following output should be observed:


    Chrome 22.0: Executed 2 of 2 SUCCESS (0.028 secs / 0.007 secs)


    “<pre>{{phones | filter:query | orderBy:orderProp | json}}</pre>” can be added
    at the bottom of the file so that the available phones can be listed or shown
    in a JSON format. The following can be added to the callback:


    $scope.devices = data.splice(0, 5);


    # Chapter 4- Links & Images


    You should know how to add thumbnail images to the devices that you have in your
    list. Links should also be added to these.


    Note that in the JSON file, the links for the devices and their URLs are available,
    as well as unique IDs. The URLs should be pointing to the URL “app/img/devices/.”


    Consider the code snippet given below:


    [


    {


    ...


    "id": "motorola ",


         "imageUrl": "img/phones/motorola.0.jpg",


          "name": "Motorola PHONE ",


    ...


    },


    ...


    ]


    The template should be as follows:


    ...


    <ul class="phones">


    <li ng-repeat="device in phones | filter:query | orderBy:orderProp" class="thumbnail">


    <a href="#/phones/{{device.id}}" class="thumb"><img ng-src="{{device.imageUrl}}"></a>


    <a href="#/phones/{{device.id}}">{{device.name}}</a>


    <p>{{device.snippet}}</p>


    </li>


    </ul>


    ...


    The double-binding curly brae has been used in the attribute values for “href”
    so as to allow for the links to be dynamically generated. In the second step,
    the binding “{{device.name}}” was added as an element of content.


    The directive “ngRs” has been used so as to add an image next to each device.
    The test can be implemented as follows:


    ...


    it('' device specific links should be rendered '', function() {


      var myquery = element(by.model(''query''));


       myquery.sendKeys(''nexus'');


    element.all(by.css(''.phones li a'')).first().click();


    browser.getLocationAbsUrl().then(function(url) {


        expect(url).toBe(''/phones/motorola'');


    });


    });


    ...


    We need to perform a verification of whether the app is generating the right links
    for the device views which you may need to implement. The directive “ng-rsc” can
    be replaced with the plain “src.”


    # Chapter 5- Working with Animations


    Sometimes, you might need to enhance your application by adding some animations
    to it. This can be done by use of both CSS and JavaScript. For the animations
    to be enabled throughout the application, we have to use the “ngAnimate” module.
    The common “ng” directives have to be used for the purpose of triggering the hooks
    for the animations we are tapping into. This should be done automatically. Once
    the animation has been found, it is executed in between the standard DOM element
    which has been issued to the element at that given time. The “ngRepeat” and “ngClass”
    can be used for doing this, just by removing or adding elements to them.


    The AngularJS module “ngAnimate” will provide us with the functionality for performing
    the animation. This module has been distributed separately from our core Angular
    framework. For the purpose of performing the extra animations, we will use the
    jQuery.


    We now need to install the dependencies to be used on the client-side of the application.
    Bower can be used for this purpose. We need to update the configuration file “bower.json”
    so that it includes the new dependency. This can be done as follows:


    {


    "name": "angular-seed",


    "description": "A project for AngularJS starting",


    "version": "0.0.0",


    "homepage": "https://mysite.com/angular/angular-project",


    "license": "MIT",


    "private": true,


    "dependencies": {


    "angular": "1.4.x",'
