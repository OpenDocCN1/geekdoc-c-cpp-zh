  md: 'But while our Caesar cipher here can encrypt messages that will keep them secret
    from people who have to figure it out with pencil and paper, it won''t keep it
    secret from people who know how to get computers to process information for them.
    (Our brute force mode proves this.) And there are other cryptographic ciphers
    that are so advanced that nobody knows how to decrypt the secret messages they
    make. (Except for the people with the key of course!)


