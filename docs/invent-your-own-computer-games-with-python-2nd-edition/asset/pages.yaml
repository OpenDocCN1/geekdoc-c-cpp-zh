    # Variables Store References to Objects


    You should know that variables never hold objects (including lists and dictionaries),
    they only hold references to objects. This is the same way that variables never
    hold but only references to objects. The difference between holding the object
    and holding a reference is that if you copy the variable to a second variable,
    any changes made to one of the variables will also change the object in the other
    variable. This is because both variables hold references to the same object because
    only a copy of the reference was made, not a copy of the object.


    Here is an example with lists (just like in the Hangman chapter). Type the following
    into the interactive shell:


    ```

    >>> x = [''a'', ''b'', ''c'']

    >>> y = x

    >>> x[2] = ''Hello!''

    >>> print(y)

    [''a'', ''b'', ''Hello!'']

    ```


    Notice that changing the x list has also changed the y list, because they contain
    references to the same list. y made a copy of the reference in x, not a copy of
    the list.


    The same applies to objects. Consider the following code:


    ```

    >>> import pygame

    >>> pygame.init()

    >>> windowSurface = pygame.display.set_mode((500, 500), 0, 32)

    >>> secondSurface = windowSurface

    ```


    windowSurface and secondSurface contain references to the same Surface object.
    Any changes made to windowSurface will change the same object that secondSurface
    references. The same is true that any changes to windowSurface will change windowSurface.


