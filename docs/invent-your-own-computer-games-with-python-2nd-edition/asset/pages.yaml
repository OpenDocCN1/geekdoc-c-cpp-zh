  md: 'If the letter is in the secret word, we need to check if the player has guessed
    all the letters, which would mean they''ve won the game. But, if the letter is
    not in the secret word, another body part is added to the hanging man.


    We can add boxes for those cases too. We don''t need an arrow from the "Letter
    is in secret word" box to the "Player has run out of body parts and loses", because
    it''s impossible to lose as long as you are only guessing correct letters. Also,
    it''s impossible to win as long as you are guessing only incorrect letters, so
    we don''t need to draw that arrow either. Our flow chart now looks like Figure
    8-5.


    ![](img/ff193558436cdb1cf549a01786d6ac4e_109_0.png)


    Figure 8-5: After the branch, the steps continue on their separate paths.'
