    Notice that there is something different with this for loop. If you look carefully
    at line 116, we are not iterating over foods but actually over foods[:]. Just
    as foods[:2] would return a copy of the list from the start and up to (but not
    including) the item at index 2, and just as foods[3:] would return a copy of the
    list with the items from index 3 to the end of the list, foods[:] will give you
    a copy of the list with the items from the start to the end. Basically, foods[:]
    creates a new list with a copy of all the items in foods. (This is a shorter way
    to copy a list than our getBoardCopy() function in the Tic Toe game.)


    Why would we not iterate over the copy instead of the list itself? It is because
    we cannot add or remove items from a list while we are iterating over it. Python
    can lose track of what the next value of food variable would be if the size of
    the foods is always changing. How difficult would it be for you to count the number
    of jelly beans in a jar while someone was adding or removing jelly beans. But
    if we iterate over a copy of the list (and the copy never changes), then adding
    or removing items from the original list won''t be a problem.


