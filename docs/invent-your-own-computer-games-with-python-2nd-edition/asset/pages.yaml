  md: "what this code means, you should learn about multi-line strings and lists:\n\
    \n# Multi-line Strings\n\nOrdinarily you write strings in your source code, the\
    \ string has to be on one line. However, if you use three-quotes instead of one\
    \ single-quote to begin and end the string, the string can be over several lines:\n\
    \n```\n>>> fizz = '''Dear Alice,\nI will return home at the end of the month.\
    \ I will\nsee you then.\nYour friend,\nBob'''\n>>> print fizz\nDear Alice,\nI\
    \ will return home at the end of the month. I will\nsee you then.\nYour friend,\n\
    Bob\n>>>\n```\n\nIf we didn't have multi-line strings, we would have to use the\
