    # # Who is this for?


    Programming isn''t hard. But it is hard to find learning materials that teach
    you to interesting things with programming. Other computer books go over many
    topics that most novice coders don''t. This book will teach you how to program
    your own computer games. You will learn a useful skill and have fun games to show
    for it!


    This book is for:


    +   - beginners who want to teach themselves computer programming, even if they
    have no previous experience programming.

    - Kids and teenagers who want to learn computer programming by creating games.
    Kids as young as 9 or 10 years old should be able to follow along.

    - Adults and teachers who wish to teach others programming.

    - Anyone, young or old, who wants to learn how to program by learning a professional
    programming language.'
