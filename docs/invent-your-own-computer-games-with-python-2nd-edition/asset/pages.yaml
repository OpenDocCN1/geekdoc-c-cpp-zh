    # Summary: What Exactly is Programming?


    If someone asked you, "Exactly is programming anyway?" what could you say to them?
    Programming is just the action of writing code for programs, that is, creating
    programs that can be executed by a computer.


    "But what is a program?" When you see using a computer program (for example, playing
    our Guess The Number game), all you see is some text appearing on the screen.
    The program decides what to show on the screen (which is called the **output**),
    based on its instructions (that is, the program) and on the text that the player
    typed on the keyboard (which is called the **input**). The program has very specific
    instructions on what to show the user. A **program** is just a collection of instructions.


    "What kind of instructions?" There are only a few different kind of instructions,
    really.


    Expressions, which are made up of values connected by operators. Expressions are
    all evaluated to a single value, like 2 + 2 evaluates to 4 or ''Hello'' + '' ''
    + ''World'' evaluates to ''Hello World''. Functions are also part of expressions
    because they evaluate to a single value, and this value can be connected by operators
    to other values. When expressions are next to the **if** and **while** keywords,
    we also call them conditions.


    Assignment statements, which simply store values in variables so we can remember
    the values later in our program.


    **if, while and break** are flow control statements because they decide which'
