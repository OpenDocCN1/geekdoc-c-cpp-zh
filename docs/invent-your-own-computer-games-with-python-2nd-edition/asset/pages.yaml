    Figure 15-6: The board after white''s second move.


    As you can see, each player can quickly grab a majority of the tiles on the board
    in just one or two moves. Players must make a move that captures at least one
    tile. The game ends when a player either cannot make a move, or the board is completely
    full. The player with the most tiles of their color wins.


    The basic strategy of Reversi is to look at which move would turn over the most
    tiles. But you should also consider taking a move that will not let your opponent
    recapture many tiles after your move. Placing a tile on the sides or, even better,
    the corners is good because there is less chance that those tiles will end up
    between your opponent''s tiles. The AI we make for this game will simply look
    for any corner moves they can take. If there are no corner moves available, then
    the computer will select the move that claims the most.


    You can learn more about Reversi from Wikipedia: http://en.wikipedia.org/wiki/Reversi


