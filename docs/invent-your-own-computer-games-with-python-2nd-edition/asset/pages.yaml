    # # Variable Names


    The computer doesn''t care what you name your variables, but you should. Giving
    variables names that reflect what type of data they contain makes it easier to
    understand what a program does. Instead of name, we could have called this variable
    abrahamLincoln or nAME. The computer will run the same (as long as you consistently
    use abrahamLincoln or nAME).


    Variable names (as with everything else in Python) are case-sensitive. **Case-sensitive
    means the same variable name in a different case is considered to be an entirely
    separate variable name.** So spam, SPAM, Spam, and SPAM are considered to be four
    different variables in Python. They each can contain their own values.


    It''s a bad idea to have differently-coded variables in your program. If you stored
