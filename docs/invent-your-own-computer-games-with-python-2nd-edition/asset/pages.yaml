  md: "# Break Points\n\nStepping through the code one line at a time might be too\
    \ slow. Often you will want the program to run at normal speed until it reaches\
    \ a certain line. You can do this with break points. A break point is set on a\
    \ line when you want the debugger to take control once execution reaches that\
    \ line. So if you think there is a problem with your code on, say, line 17, set\
    \ a break point on line 17 and when execution reaches that line, the debugger\
    \ will stop execution. Then you can step through a few lines to see what is happening.\
