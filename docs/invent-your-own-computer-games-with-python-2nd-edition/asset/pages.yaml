    # Learning New Things by Running Simulation Experiments


    This chapter didn''t cover a game, but it modeled various strategies for Reversi.
    If we thought that taking sides in Reversi was a good idea, we would have to spend
    days, even carefully playing games of Reversi by hand and writing down the results.
    But if we know how to program a computer to play Reversi, then we can have the
    computer play Reversi using these strategies for us. If you think about it, you
    will realize that the computer is executing millions of lines of your program
    in seconds! Your experiments with the simulation of Reversi can help you learn
    more about playing Reversi in real life.


    In fact, this chapter would make a good science fair project. Your problem can
