  md: "pygame.mixer module is responsible for playing short sound effects during the\
    \ game. The pygame.mixer.music module is used for playing background music.\n\n\
    We will call the pygame.mixer.Sound() constructor function to create a pygame.mixer.Sound\
    \ object (which we will simply call a Sound object). This object has a play()\
    \ method that will be called when we play the sound effect.\n\nOn line 39 we load\
    \ the background music by calling pygame.mixer.music.load(). We will start playing\
    \ the music immediately by calling pygame.mixer.music.play(). The first parameter\
    \ tells Pygame how many times to play the background music. If you pass 5 will\
    \ will cause Pygame to play the background music 6 times over. If you pass -1\
    \ for the first parameter, the background music will repeat forever.\n\nThe second\
    \ parameter to pygame.mixer.music.play() tells at what point in the sound file\
    \ to start playing. Passing 0.0 will play the music starting from the very beginning.\
    \ If you pass 2.5 for the second parameter, this will cause the background music\
    \ to start playing two and half seconds after the start of the music.\n\nFinally,\
    \ we have a simple boolean variable musicPlaying that will tell us our program\
    \ if it should play the background music and sound effects or not. It is nice\
    \ to give the player the option to run the program without the sound playing.\n\
    \n# Toggling the Sound On and Off\n\n```\nif event.key == ord('m'):\n    if musicPlaying:\n\
    \        pygame.mixer.music.stop()\n    else:\n        pygame.mixer.music.play(-1,\
    \ 0.0)\n    musicPlaying = not musicPlaying\n```\n\nWe will check if the user\
    \ has pressed the M key. The key will turn the background music on or off. If\
    \ musicPlaying is set to True, then that means the background music is currently\
    \ playing and we should stop the music by calling pygame.mixer.music.stop(). If\
    \ musicPlaying is set to False, then that means the background music is not currently\
    \ playing and should be started by calling pygame.mixer.music.play(). The parameters\
    \ are the same as we passed on line 40.\n\nFinally, no matter what, we want to\
    \ toggle the value in musicPlaying. Toggling a boolean value means we set it to\
    \ the opposite of its current value. The line musicPlaying = not musicPlaying\
    \ will set the variable to False if it is currently True or True if it is currently\
    \ False. Think of toggling as what happens when you flip a light on or off."
