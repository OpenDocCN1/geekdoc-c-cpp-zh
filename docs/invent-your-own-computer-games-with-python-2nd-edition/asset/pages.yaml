  md: '# Review of the Basic Pygame Data Types


    Let''s review some of the data types used in the Pygame library:


    +   - pygame.Rect - Rect objects represent a rectangular space''s location and
    size. The location can be determined by the Rect object''s toleft attribute (or
    topright, bottomleft, and bottomRight attributes). These corner attributes are
    a tuple of integers for the X and Y coordinates. The size can be determined by
    the width and height attributes, which are integers of how many pixels long or
    high the rectangle area is. Rect objects have a colliderect() method to check
    if they are intersecting with another Rect object.

    - pygame.Surface - Surface objects are areas of colored pixels. Surface objects
    represent a rectangular space, while Rect objects only represent a blit() method
    that is used to draw the image on one Surface onto another Surface. The Surface
    returned by the pygame.display.set_mode() function is special because anything
    drawn on that Surface will be displayed on the user''s screen.

    - Remember that Surface has things drawn on them, but we cannot see this because
    it is only in the computer''s memory. We can only see a Surface object when it
    is "blitted" (at, drawn) on screen. This is just the same as it is with any other
    piece of data. If you think about it, you cannot see the string that is stored
    in a variable printed to the screen.

    - pygame.Event - The Event type in the pygame.event generates Event objects whenever
    the user provides keyboard, mouse, or another kind of input. The pygame.event.get()
    function returns a list of Event objects. You can check what type of Event object
    is by checking its attribute. QUIT, KEYDOWN, and MOUSEBUTTONUP are examples of
    some event types.

    - pygame.Font.Font - The pygame.font module represents the data type used for
    text in Pygame. You can create a Font object by calling the pygame.font.SysFont()
    constructor. The arguments are a string of the font name and an integer of the
    font size, however it is common to pass None for the font name and get the default
    system font. For example, the common call to create a Font object is pygame.font.SysFont(None,
    48).

    - pygame.time.Clock - The Clock in the pygame.time module are very helpful for
    keeping our games from running as fast as possible. (This is often too fast for
    the player to keep up with the computer, and makes the games not fun.) The Clock
    object has a tick() method, which passes how many frames per second (fps) we want
    the game to run at. The higher the fps, the faster the game runs. Normally we
    use 400 fps. Notice that the pygame.time module is a different module than the
    time module which contains the sleep() function.


