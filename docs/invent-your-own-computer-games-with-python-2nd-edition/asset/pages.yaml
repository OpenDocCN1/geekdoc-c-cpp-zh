    # # Summary: Review of our Sonar Game


    Remember how our Tic Tac game numbered the spaces on the Tic Tac Toe board 1 through
    9? This sort of coordinate system might have been okay for a board with less than
    ten spaces. The Sonar board has nine hundred spaces! The Cartesian coordinate
    system we learned in the last chapter really makes all these spaces manageable,
    especially when our game needs to find the distance between two points on the
    board.


