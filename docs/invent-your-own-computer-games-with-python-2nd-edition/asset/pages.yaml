    with their large piles of treasure. Some dragons are friendly, and share their
    treasure with you. Other dragons are greedy and hungry, and will eat anyone who
    enters their cave. The player is in front of two caves, one with a friendly dragon
    and the other with a hungry dragon. The player is given a choice between the two.


