  md: '# Branching from a Flowchart Box


    There are two possibilities: the letter will either be in the word or it won''t
    be. This means we need to add two new boxes to our flowchart. From the "Ask player
    to guess a letter" box, we can only move to the "Letter is in secret word" or
    the "Letter is not in secret word" box. This will create a branch (that is, a
    split) in the flowchart, as show in Figure 8-4:


    ![](img/ff193558436cdb1cf549a01786d6ac4e_108_0.png)'
