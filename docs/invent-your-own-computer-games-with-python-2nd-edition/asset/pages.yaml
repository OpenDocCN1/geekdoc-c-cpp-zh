    # Trick 3: The Commutative Property of Addition


    A third trick is to remember that when you add two numbers like 6 and 4, it doesn''t
    matter what order they are in. (This is called the commutative property of addition.)
    That means 6 + 4 and 4 + 6 both equal the same value, 10. If you can count the
    boxes in the figure below, you can see that it doesn''t matter what order you
    have the numbers for addition.


    | 6 + 4 | 4 + 6 |

    |---||

    | 10 | 10 |


    Figure 12-10: Trick 3 - The commutative property of addition.


    Say you are adding a negative number and a positive number, like -6 + 8. Because
    you are adding numbers, you can swap the order of the numbers without changing
    the answer. - 6 + 8 is the same as 8 + -6. When you look at 8 + -6, you see the
    minus sign can eat the plus sign to its left, and the problem becomes 8 - 6 =
    2. This means that -6 + 8 is also 2! We''ve rearranged the problem to have the
    same answer, but made it easier for us to solve without using a calculator or
    the computer.


    205'
