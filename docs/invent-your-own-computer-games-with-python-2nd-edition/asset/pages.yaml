  md: "![](img/ff193558436cdb1cf549a01786d6ac4e_14_0.png)\n\n# # Chapter 1\n Installing\
    \ Python\n\n# ## Topics Covered In This Chapter:\n\n+   - Downloading and installing\
    \ the Python interpreter.\n- Using IDLE's interactive shell to run instructions.\n\
    - How to use this book.\n- The book's website at http://inventwithpython.com\n\
    \nHello! This is a book that will teach you how to program by showing you how\
    \ to create computer games. Once you learn how the games in this book work, you'll\
    \ be able to create your own games. All you'll need is a computer, some software\
    \ to give you the Python Interpreter, and this software is free and you can download\
    \ it from the Internet.\n\nWhen I was a kid, I found a book like this that taught\
    \ me how to write my first programs and games. It was fun and even. Now as an\
    \ adult, I still have fun programming computers, and I get paid for it. But even\
    \ if you don't become a computer programmer when you grow up, programming is a\
    \ useful and fun skill to have.\n\nComputers are very useful machines. The good\
    \ news is that learning to program a computer is easy. If you can read this book,\
    \ you can program a computer. A computer **program** is just a bunch of instructions\
    \ by a computer, like a storyline is just a whole bunch of sentences read by the\
    \ reader.\n\nThese instructions are the turn-by-turn instructions you might get\
    \ for walking to a friend's house. (Turn left at the walk, walk two blocks, keeping\
    \ walking until you find the first blue house on the right.) The computer follows\
    \ each instruction that you give it in the order that you give it. (And very video\
    \ games are themselves nothing but computer programs."
