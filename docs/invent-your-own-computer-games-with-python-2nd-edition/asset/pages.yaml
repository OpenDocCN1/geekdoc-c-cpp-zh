  md: 'This program has two functions: TrueFizz() and FalseFizz(). TrueFizz() will
    display a message and return the value True, while FalseFizz() will display a
    message and return the value False. This will help determine when these functions
    are being called, or when these functions are skipped by short-circuiting.


    # The first if Statement (Cats and Dogs)


    The first statement on line 9 in our small program will evaluate TrueFizz(). We
    know this happens because Cats is printed to the screen (on line A in the output).
    The entire expression could be True if the expression is to the right of the keyword
    True. The call TrueFizz(''Dogs'') one line 9 is evaluated, Dogs is printed to
    the screen (on line B in the output) and True is returned. On line 9, if the statement''s
    condition evaluates to False or True, which in evaluates to True. Step 1 is then
    printed to the screen. No short-circuiting took place for this expression''s evaluation.


    # The Second if Statement (Hello and Goodbye)


    The second statement on line 12 has short-circuiting. This is because we call
    TrueFizz(''Hello'') on line 12, it returns Hello (on line D in the output) and
    returns True. Because it doesn''t matter what is on the right side of the keyword,
    the Python interpreter doesn''t call TrueFizz(''Goodbye''). You can tell it is
    not called because Goodbye is not printed to the screen. If the statement''s condition
    is True, so Step 2 is printed to the screen on line E.


    # The Third if Statement (Spam and Cheese)


    The third if statement on line 15 does not have short-circuiting. The call to
    TrueFizz(''Spam'') returns True, but we do not know if the entire condition is
    True or False because of the and operator. So Python will call TrueFizz(''Cheese''),
    which prints Cheese and returns True. If the statement''s condition evaluates
    to True and True, which in turn evaluates to True. Because the condition is True,
    Step 3 is printed to the screen on line H.


    # The Fourth if Statement (Red and Blue)


    The fourth statement on line 18 has short-circuiting. The FalseFizz(''Red'') calls
    Red on line I in the output and returns False. Because the left side of the keyword
    is False, it does not matter if the right side is True or False, the condition
    will evaluate to False anyway. So TrueFizz(''Blue'') is not called and Blue does
    not appear on the screen. If the statement''s condition evaluated to False, Step
    4 is also not printed to the screen.


    Short-circuiting can happen for any expression that includes the Boolean operators
    and or. It is important to remember that this can; otherwise you might find that
    some function calls in the expression are never called and you will not understand
    why.'
