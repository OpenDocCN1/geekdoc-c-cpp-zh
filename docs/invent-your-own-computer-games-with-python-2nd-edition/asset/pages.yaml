    # Image and Sound Files


    Sprites are stored in image files on your computer. There are several different
    image formats that Pygame can use. You can tell what format an image file uses
    by looking at the end of the file. For example, the happy.png is in the PNG format.
    The image formats Pygame supports include BMP, PNG, JPG (and JPEG), and GIF.


    You can download images from your web browser. On most browsers, you just have
    to right-click on the image in the web page and select Save from the menu that
    appears. Remember where the hard drive you saved the image file. You can also
    create your own images with a drawing program like MS Paint or Tux Paint.


    The sound formats that Pygame supports are MID, WAV, and MP3. You can download
    sound effects from the Internet just like image files, as long as the sound effects
    are in one of these three formats. If you have a microphone, you can also record
    sounds with your computer and use them in your games.


