    # # Appendix A Differences Between Python 2 and 3


    Most of the programs in this book make use of the newer version 3 of Python. The
    Pygame make use of Python 2 because the Pygame library is not yet compatible with
    Python 3. Python 3 corrects many of the faults with version 2 of the langage;
    however, these changes can also make it impossible to run Python 3 programs with
    the Python 2 interpreter, and vice versa.


    There are only a few changes between the two versions, and this appendix will
    go through the ones relevant to this book. Learning Python 2 and 3 is fairly simple.
    All of the modules imported by the programs in this book (except for the Pygame
    module) are part of the standard library and work with both Python 2 and Python
    3.


    In short, use Python 3 unless you need to use a library that is not yet compatible
    with version 3. Learning Python 2 and 3 is easy because there are only a few changes
    between them.


