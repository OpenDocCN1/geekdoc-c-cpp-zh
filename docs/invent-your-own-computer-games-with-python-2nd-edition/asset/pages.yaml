    braces [ ]. We use curly braces to type out a dictionary value in Python. The
    values in between them are key-value pairs. The keys are the ones on the left
    of the colon and the values are on the right of the colon. You can access the
    values (which are like items in lists) in the dictionary using the key (which
    are like indexes in lists). Try typing into the shell stuff[''hello''] and stuff[''chat'']
    and stuff[''goodbye'']:'
