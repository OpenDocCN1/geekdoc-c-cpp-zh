    # Percentages


    Percentages are a portion of a total amount, and range from 0% to 100%. If you
    had 100% of a pie, you would have the entire pie. If you had of a pie, you wouldn''t
    have any pie at all. 50% of the pie would be half of the pie. A pie is a common
    image to use for percentages. In fact, there is a kind of charted pie chart which
    shows much of the full to a certain portion. Here is a pie chart with 10%, 15%,
    25%, and 50 portions below. Notice that 10% + 15% + 25% + 50 adds up to 100.


    ![](img/ff193558436cdb1cf549a01786d6ac4e_309_0.png)


    Figure 16-1: A pie chart with 10%, 15%, 25%, and 50 portions.


    We can calculate the percentage with division. To get a percentage, divide the
    part you have by the total, and then multiply by one hundred. For example, if
    X win 50 out of 100 games, you would calculate the expression 50 / 100, which
    would evaluate to 0.5. We multiply this by 100 to get a percentage (in case, 50%).
    Notice that if X win 100 out of 200 games, you could calculate the percentage
    with 100 / 200, which would also evaluate to 0.5. When we multiply 0.5 by 100
    to get the percentage, we get 50%. Winning 100 out of 200 is the same percentage
    (which is the same portion) as winning 50 out of 100 games.


    # Division Evaluates to Floating Point


    It is important to remember that when you use / division operator, the expression
    will always evaluate to the floating point. For example, the expression 10 / 2
    will evaluate to the floating point value 5.0 and not to the integer 5.


    This is important to remember, adding an integer to a floating point value with
    the + addition operator will also evaluate to a floating point value. For example,
    3 + 4.0 will evaluate to the floating point value 7.0 and not to the integer 7.


    296'
