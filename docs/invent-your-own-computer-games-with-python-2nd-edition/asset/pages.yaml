  md: 'carefully thought about what exactly the program is doing. There are three
    types of bugs

    that can happen with your program:


    +   * Syntax Errors are a type of bug that comes from types in your program. When
    the

    Python interpreter sees a syntax error, it is because your code is not written
    in proper

    Python language. A Python program with a single syntax error will not run.

    * Runtime Errors are bugs that happen when the program is running (that is,

    executing). The program will work up until it reaches the line of code with the
    error,\and then the program terminates with an error message (this is called crashing).

    The Python interpreter will display something called "traceback" and show the
    line

    where the problem happens.

    * Semantic Errors are the trickiest bugs to fix. This bug does not crash the program,

    and the program appears to work. However, it is not doing what the programmer

    intended to do. For example, if the programmer the variable

    total to be the sum of values in a, b, and c writes total =

    + b * , then the value in total will be wrong. This won''t cause the program to

    crash immediately, but may or not use some other code to crash later

    because of the unexpected value in total.


    Finding bugs in our program can be hard, if you even notice them at all! When
    running

    your program, you may discover that functions are not called when they are

    posed to be, or may be called too many times. You may code the condition for a

    while loop wrong, so that it loops the wrong number of times. (A loop in your

    that never exits is a kind of bug is called an infinite loop. In order to stop
    this program,

    you press Ctrl-C in the interactive shell.) Any of these things could mistakenly
    happen

    in your code if you are not saved!


    It is hard to figure out how your code could be producing a bug because all the
    lines

    of code executed very quickly and the variables change so often.

    debuffer is a program that lets you step through your code one line at a time
    (in the

    order that Python executes them), and shows what values are stored in all of the
    variables.

    A debugger lets you look at each line of code affects your program. This can be
    very

    helpful to figure out exactly the program is doing.


    A video tutorial on using the debugger that comes with IDLE can be found on this
    book''s

    website at http://inventwithpython.com/videos/


