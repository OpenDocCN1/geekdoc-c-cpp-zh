    On line 20, we will use a new function in the pygame.transform module. The pygame.transform.scale()
    function can shrink or enlarge a sprite. The first argument is a pygame.Surface
    object with the image drawn on it. The second argument is a tuple for the new
    width and height of the image in the first. The pygame.transform.scale() returns
    a pygame.Surface object with the image drawn at a new size. We will store the
    original image in the playerImage variable but the stretched image in the playerStretchedImage
    variable.


