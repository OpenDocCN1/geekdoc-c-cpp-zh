    # Hello World by Pygame


    We are going to create a new "Hello World!" program, just like you created at
    the beginning of the book. This time, we will use Pygame to make "Hello world!"
    appear in a **graphical user interface** (GUI, which is pronounced "goey") window.
    A graphical user interface gives you to draw color, shapes, and images can be
    drawn on your program, as well as accepting mouse input (and not just keyboard
    input). The basic shapes that we draw on the screen are called **drawing primitives**.
    GUI windows are used instead of the text window (also called **console window**
    or a **terminal window**) that we used for all our previous games.


    Pygame does not work with the interactive shell because it runs on a loop (we
    will describe game loops later). Because of this, you can only write Pygame programs
    and cannot send commands to Pygame at one time through the interactive shell.


    Pygame programs also do not use the `input()` function. There is no text input
    and output. Instead, the program displays output in window by drawing graphics
    and text to the window. Pygame''s program input comes from the keyboard and the
    mouse things called events, which we will go over in the next chapter. However,
    if our program has bugs that Python can display an error message, the error message
    will show up in the console window.


    You can also use `print()` function to display text in the console window, however
    in Pygame the `print()` function is only used for temporarily printing messages
    to help you find bugs in your program. It can be useful to print out the value
    of variables while your program is running so that you can make sure it is working
