- img_proc: true
  md: '# 8 - Flow Charts


    We are forgetting something else, as well. What if the player guesses a letter
    that they''ve guessed before? Rather than have them win or lose in this case,
    we''ll allow them to guess a different letter instead, as shown in Figure 8-8.


    ![](img/ff193558436cdb1cf549a01786d6ac4e_112_0.png)


    Figure 8-8: Adding a step in case the player guesses a letter they already guessed.


    # Offering Feedback to the Player


    We also need some way to show the player how they''re doing. In order to do this,
    we''ll show them the hangman board, as well as the secret word (with blanks for
    the letters they''ve guessed yet). These visuals will let them see close they
    are to winning or losing the game.


    We''ll need to update this information every time the player guesses a letter.
    We can add a "Show the board and blanks to the player," box to the flow chart
    between the "Come up with a secret word" box and the "Ask player to guess a letter"
    box, as shown in Figure 8-9. This box will remind us that we need to show the
    player an updated hangman board so they can see which letters they have guessed
    correctly and which letters are not in the secret word.'
