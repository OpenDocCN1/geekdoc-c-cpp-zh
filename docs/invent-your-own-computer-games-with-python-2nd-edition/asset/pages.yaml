    # The Difference Between Dictionaries and Lists


    Dictionaries are different from lists because they are unordered. The first item
    in a list named listStuff would be listStuff[0]. But there is no "first" item
    in a dictionary, because dictionaries do not have any sort of. Try typing this
    into the shell:


    ```

    >>> favorites1 = {''fruit'':''apples'',

    ''animal'':''cats'', ''number'':42}

    >>> favorites2 = {''animal'':''cats'', ''number'':42,

    ''fruit'':''apples''}

    >>> favorites1 == favorites2

    True

    ```'
