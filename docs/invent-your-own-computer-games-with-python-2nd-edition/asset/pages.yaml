    # Designing the Program


    Dragon Realm was a pretty simple game. The other games in this book will be a
    bit more complicated. It sometimes helps to write everything you want your game
    or program to do before you start writing code. This is called "designing the
    program."


    For example, it might help to draw a flow chart. A flow chart is a picture that
    shows every possible action that can happen in our game, and in what order. Normally
    we would remember to write code before writing our program, so that we remember
    to write code for each thing that happens in the game. Figure 6-2 is a flow chart
    for Dragon Realm.


    ![](img/ff193558436cdb1cf549a01786d6ac4e_88_0.png)


