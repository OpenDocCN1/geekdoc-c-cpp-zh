    To make this change, we will introduce a new data type called dictionary. A dictionary
    is a collection of other values like a list, but instead of accessing the items
    in the dictionary with an integer index, you can access them with an index of
    any data type (but most often strings).


    Try typing the following into the shell:


    ```

