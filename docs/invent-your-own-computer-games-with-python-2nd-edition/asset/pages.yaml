    values (the value in the variable guessesTaken, and the integer value 6) connected
    by an operator (the < sign, the "less than" sign). The < sign is called a comparison
    operator.


    The comparison operator is used to compare two values and evaluate to a True or
    False Boolean value. A list of all the comparison operators is in Table 4-1.'
