  md: '# Designing a Program with a Flowchart


    This game is a bit more complicated than the ones we''ve seen so far, let''s take
    a moment to think how it''s put together. First we''ll create a flow chart (like
    the one at the end of the Dragon Realm chapter) to help us visualize what this
    program will do. A flow chart is a diagram that shows a series of steps as number
    of boxes connected with arrows. Each box represents a step, and the arrows show
    how one step leads to other steps. You can trace through the flow chart by putting
    your finger on the "Start" box of the flow chart and following the arrows to other
    boxes until you get to the "End" box. You can only move from one box to another
    in the direction of the arrow. You can never go backwards (unless there is a second
    arrow going back, like the "Player already guessed this letter" box below.) Here
    is the complete flow chart for the Hangman game (Figure 8-1).


    ![](img/ff193558436cdb1cf549a01786d6ac4e_105_0.png)


    Of course, we don''t have to make a flow chart. We could just start writing code.
    But often, once we start programming, we will think of things that need to be
    added or changed


    92'
  merge: -1
  pgno: 105
- img_proc: true
  md: 'that we hadn''t considered before. We may end up having to change or delete
    a lot of code that we had already written, which would be a waste of effort. To
    avoid this, it''s always best to think carefully, and plan how the program will
    work before we start writing it.


    The following flow chart is provided as an example of what flow charts look like
    and how to make them. For now, since you''re just using the source code from this
    book, you don''t need to draw a flow chart before writing code. The program is
    already written, so you don''t have to plan anything out. But when you make your
    own games, a flow chart can be very handy.


    # Creating the Flow Chart


    Keep in mind, your flow charts don''t always have to look exactly like this one.
    As long as you understand the flow chart you made, it will be helpful when you
    start coding. We''ll begin with a flow chart that only has a “Start” and an “End”
    box, as shown in Figure 8-2:


    ![](img/ff193558436cdb1cf549a01786d6ac4e_106_0.png)


    Figure 8-2: Begin your flow chart with a Start and End box.'
