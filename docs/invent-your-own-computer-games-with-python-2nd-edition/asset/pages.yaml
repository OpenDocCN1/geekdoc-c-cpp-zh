    # The Boolean Data Type


    The Boolean data type has only two values: True or False. These values are casesensitive
    and they are not string values; in other words, you do not put a '' quote character
    around them. We will use Boolean values with comparison operators to form conditions.
    (See below.)


    # Comparison Operators


    In line 12 of our program, the line of code containing the while statement:


    ```

