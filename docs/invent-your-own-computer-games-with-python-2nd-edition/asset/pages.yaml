    line 4. The debugger skipped line 3 because it is a blank line. Note that you
    can only step forward with the debugger, you cannot go backwards.


    Click the Step button three times. This will execute the def statements to define
    the functions. The debugger skips over the def-blocks of these functions because
    we are only defining the functions, not calling them. As you define these, they
    will appear in the Global area of the Debug Control.


    The text next to names in the Global area will look something like "<checkCave
    at 0x01285B00>". The module names also have confusing text next to them, such
    as "module/random" from ''C:\Python25\lib\random.pyc''. This is only useful to
    advanced Python programmers, and you don''t need to know what this means to debug
    your programs. Seeing that functions and modules are in the Global area will tell
    you if the function has been defined or the module has been imported. You can
    also ignore the __builtins__, __doc__, and __name__ lines in the Global area.


    The debugger will now (after clicking Step four times) at line 35, the playAgain
    = ''yes'' line. When you click Step to execute this line, the playAgain variable
    will be created and show up in the Global area. Next to it will be the value stored
