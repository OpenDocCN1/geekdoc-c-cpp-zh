  md: '# def Statements


    The def statement isn''t a call to a function named displayIntro(). Instead, the
    def statement means we are creating, or **defining**, a new function that we can
    call later in our program. After we define this function, we can call it the same
    way we call other functions. When we call this function, the code inside the def-block
    will be executed.


    We also define variables when we create them with an assignment statement. The
    code `spam = 42` defines the variable `spam`.


    Remember, the def statement doesn''t execute the code right now, it only defines
    what code is executed when we call the `displayIntro()` function later in the
    program. When the program''s execution reaches a `def` statement, it skips down
    to the end of the def-block. we will jump back to the top of the def-block when
    the `displayIntro()` function is called. So we call this function when we want
    to display the "You are on a planet full of dreams..." to introduction.


    When we call `displayIntro()`, the program''s execution jumps to the start of
    the function on line 5. When the function block ends, the program''s execution
    returns to the line that called the function.


    We will explain all the programs that this function will use before we explain
    the main part of the program. It may be a bit confusing to learn the program out
    of the order that it executes. But just keep in mind when we define the functions
    they just silently sit around waiting to be called into action.


