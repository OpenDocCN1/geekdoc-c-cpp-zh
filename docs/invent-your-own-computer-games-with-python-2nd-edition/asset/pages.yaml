  md: '# # Guessing Again


    This flow chart might look like it is finished, but there''s something we''re
    forgetting: the player doesn''t guess a letter just once. They have to keep guessing
    letters over and over until they win or lose. We need to draw two new arrows as
    the flow chart shows this, as shown in Figure 8-7.


    ![](img/ff193558436cdb1cf549a01786d6ac4e_111_0.png)


    Figure 8-7: The game does not always end after a guess. The new arrows (outlined)
    show that the player can guess again.'
