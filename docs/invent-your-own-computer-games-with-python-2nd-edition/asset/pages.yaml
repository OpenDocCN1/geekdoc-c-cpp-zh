    run setup.py from IDLE by pressing the F5 key or selecting Run Module from the
    Run menu. You must use the Windows command line.


    To start the Windows command line, click on the Start button in the bottom corner
    and select "Run". In the windows that opens, type "cmd" and click OK.


    A black window with text should appear. Type "cd c:\Python26" (or the folder you
    have saved your programs to) to change folders to the folder containing your Python'
