    The abs () function can be used to return the absolute value of an integer. The
    abs () function is a built-in function, so you do not need to import any modules
    to use it. Pass it an integer or float value and it will return the absolute value:


    ```

    >>> abs (-5)

    5

    >>> abs (42)

    42

    >>> abs (-10.5)

    10.5

    ```


    # Coordinate System of a Computer Monitor


    It is common that computer monitors use a coordinate system that has the origin
    (0, 0) at the top left of the screen, which increases down and to the right. There
    are no negative coordinates. This is because text is printed at the top left,
    and is printed to the right and downwards. Most graphics use this coordinate system,
    and we use it in our games. It is common to assume that monitors can display 80
    text characters per row and 25 text characters per column (look Figure 12-2).
    This used to be the maximum screen size that monitors could support. While today''s
    monitors can usually display much more text, we will not assume that the user''s
    screen is bigger than 80 by 25.


