  md: '# # Negative Numbers


    Another concept that Cartesian coordinates use negative numbers. Negative numbers
    are numbers that are smaller than zero. We must put a sign in front of a number
    to show that it is a negative. -1 is smaller than 0. And -2 is smaller than -1.
    If you think of regular numbers (called positive numbers) starting from 1 and
    increasing, you can think of negative numbers starting from -1 and decreasing.
    0 is not positive or negative. In your picture, you can see the positive numbers
    increasing to the right and the negative numbers decreasing to the left:


    ![](img/ff193558436cdb1cf549a01786d6ac4e_215_0.png)


    Figure 12-2: The chessboard but with numeric coordinates for both rows and columns.


    ![](img/ff193558436cdb1cf549a01786d6ac4e_215_1.png)


    Figure 12-3: A number line.


    The number line is really useful for doing subtraction and addition with negative
    numbers. The expression 4 + 3 can be thought of as the white knight starting at
    position 4 and moving 3 spaces over to the right (addition means increasing, which
    is in the right direction).


    ![](img/ff193558436cdb1cf549a01786d6ac4e_215_2.png)


    Figure 12-4: Moving the white knight to the right to the coordinate.


    As you can see, the white knight ends up at position 7. This makes sense, because
    4 + 3 is 7.


    Subtraction can be done by moving the white knight to the left. Subtraction means
    decreasing, which is in the left direction. 4 - 6 would be the white knight starting
    at position 4 and moving 6 spaces to the left:'
