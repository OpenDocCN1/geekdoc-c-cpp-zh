    # # Modifying the Dodger Game


    It''s for our graphical game. You may find that the game is too easy or too hard.
    The game is very easy to modify because we took the time to use constant variables
    instead of typing in the values directly. Now all we need to change the game modify
    the value set in the constant variables.


    For example, if you want the game to run slower in general, change the FPS variable
    on line 8 to a smaller value such as 20. This will make the baddies and the player''s
    character slower since the game loop will only execute 20 times a second instead
    of 40.


    If you just to slow down the baddies and not the player, then change BADDIMAXSPEED
    to a smaller value such as 4. This will make all the baddies move between 1 (the
    value BADADDMINSPEED) and 4 pixels per iteration through the game loop instead
    of 1 and 8.


    If you want the game to have fewer larger baddies instead of many baddies, then
    increase NEWBADDIERATE to 12, BADDIEMINSIZE to 40, and BADDIMAXSIZE to 80. Now
    the baddies are being added every 12 iterations through the game loop instead
    of 6 iterations, there will be half as many baddies as before. To keep the game
    interesting, the baddies are not much larger than before.


    While the basic game remains the same, you can modify any of the constant variables
    to drastically affect the behavior of the game. Keep trying out new values for
    the constant variables until you find a set of values like the best.


