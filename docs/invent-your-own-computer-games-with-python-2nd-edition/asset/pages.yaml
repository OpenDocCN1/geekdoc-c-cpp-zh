  md: '# 1 - Installing Python


    then, look for the file called Python 3.1 Windows Installer (Windows binary --
    not include source) and click on its link to download Python for Windows.


    ![](img/ff193558436cdb1cf549a01786d6ac4e_16_0.png)


    Figure 1-1: Click the Windows installer link to download Python for Windows from
    http://www.python.org


    Double-click on the python-3.1.msi file you''ve downloaded to start the Python
    installer. If it doesn''t start, try right-clicking the file and choosing Installing.
    Once the installer starts, click the Next and accept the choices in the installer
    as you go (no need to make any changes). When the install is finished, click Finish.


    **Important Note!** Be sure to install Python 3, and not Python 2. The programs
    in your book use Python 3, and you''ll get errors if you try to run them with
    Python 2.


    The installation for Mac OS is similar. Instead of downloading the .msi file from
    the Python website, download the dmg Mac Installer Disk Image instead. The link
    to this file will look something like "Mac installer disk image (3.1.1)" on the
    "Download Software" web page.


    If your operating system is Ubuntu, you can install Python by opening a terminal
    (click on Applications > Accessories > Terminal) and executing sudo apt-get install
    python3 then pressing Enter. You will need to enter the root password to install
    Python, so ask the person who owns the computer to type this password.


    There may be a newer version of Python available than 3.1. If so, then just download
    the latest version. The game programs in this book will work the same. If you
    have any problems, you can always Google for "installing Python on <your operating
    system''s name>". Python is a very popular language, so you should have no difficulty
    finding help.


    A video tutorial of how to install Python is available from this book''s website
    at http://inventwithpython.com/videos/'
  merge: -1
  pgno: 16
- img_proc: true
  md: '# Starting Python


    If your operating system is Windows XP, you should be able to run Python by choosing
    Start > Programs > Python 3.1 > IDLE (Python GUI). When it''s running it should
    look something like Figure 1-2.(But different operating systems will look slightly
    different.)


    ![](img/ff193558436cdb1cf549a01786d6ac4e_17_0.png)


    IDLE stands for Interactive DeLopment Environment. The development environment
    is software that makes it easy to write Python programs. We will be using IDLE
    to type our programs and run them.


    The window that appears when you first run IDLE is the interactive shell. A shell
    is a program that lets you type instructions into the computer. Python lets you
    type Python instructions, the shell sends these instructions to software called
    the Python interpreter to perform. We can type Python instructions into the shell
    and, because the shell is interactive, the computer will read our instructions
    and respond in some way. (Ideally in a way that we expect but will depend on whether
    we write the correct instructions.)


    # How to Use This Book


    There are a few things you should understand about this book before you started.
    "Invent with Python" is different from other programming books because it focuses
    on the complete source code for different games. Instead of teaching you programming
    concepts and leaving it to you to figure out how to make fun games with these
    concepts, this book shows you games and explains how they are put together.'
  merge: -1
  pgno: 17
- img_proc: true
  md: '# The Featured Programs


    Most chapters begin with a sample run of the featured program. This sample run
    shows you what the program''s output looks like, with what the user types in immediately
    as **bold** print. This will give you an idea of what the complete game will look
    like when you have entered the code and run it.


    Some chapters also show the complete source code of the game, but remember: you
    don''t have to enter every line of code right now. Instead, you can read the chapter
    first to understand what each line of code does and then entering it later.


    You can also download the source code file from this book''s website. Go to the
    URL http://inventwithpython.com/source and follow the instructions to download
    the source code file.


    # Line Numbers and Spaces


    When entering the source code yourself, do **not** type the line numbers that
    appear at the beginning of each line. For example, if you see this in the book:


    ```

    9. number   = random.randint(1, 20)

    ```


    You do not need to type the "9." on the left side, or the space that immediately
    follows it. Just type it like this:


    ```

    number   = random.randint(1, 20)

    ```


    Those line numbers are only used so that this book can refer to specific lines
    in the code. They are not a part of the actual program.


    Aside from the line numbers, be sure to enter the code exactly as it appears.
    Notice that some of the lines don''t begin at the leftmost edge of the page, but
    are indented by four or eight spaces. Be sure to put in the correct number of
    spaces at the start of each line. (Since each character in IDLE is the same width,
    you can count the number of spaces by counting the number of characters above
    or below the line you''re looking at.)


    For example, you can see that the second line is indented by four spaces because
    the four characters "while" on the line above are the indented space. The third
    line is indented by another four spaces (the four characters, "if n" are above
    the third line''s indented space):'
  merge: -1
