    # ## Moving and Bouncing the Blocks


    Each block will move in one of four diagonal directions: down and left, down and
    right, and up and right. When the block hits the side of the window, we want it
    to "bounce" off the walls and move in a new diagonal direction. The blocks will
    bounce as shown in this picture:


    The new direction that a block moves after it depends on two things: which direction
    it was moving before the bounce and which wall it bounced off. There are total
    of eight possible ways a block can bounce: two ways for each of the four walls.
    For example, if a block is moving down and right, and then bounces off the bottom
    edge of the window, we want the block''s new direction to be up and right.


