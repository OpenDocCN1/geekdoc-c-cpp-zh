    algorithm. |

    | getSideBestMove() | Take a side if there is one available. If not, use the regular
    getComputerMove() algorithm (side spaces are chosen before corners). |

    | getWorstMove() | Take the space that will result in the fewest tiles being flipped.
    |

    | getCornerWorstMove() | Take a corner space, available. If not, use the getWorstMove()
    algorithm. |


