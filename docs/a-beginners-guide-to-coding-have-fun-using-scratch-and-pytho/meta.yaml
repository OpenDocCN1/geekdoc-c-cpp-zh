    </html>

    ```


    # Web development


    +   2. Save your page as ''index.html'' – don''t forget the html ending! Have
    a look in the folder where you have made, and double-click on your file to open
    it in a web browser. It should look something like this:


    Web developers make web pages that work in a web browser. Many web developers
    build web pages in a language called JavaScript. You can also build basic web
    pages by coding in a language called HTML. HTML stands for Hypertext Markup Language.
    It''s not a programming language, because you can''t actually write programs with
    it. Instead, your web browser turns HTML into normal words and pictures that you
    can understand.


    ![](img/0ef4c508568feec5ab50e93dadefb3a1_61_0.png)


    To make a web page, you are going to need a text editor. If you are using Windows
    then you could use Notepad. On a Mac, you could use TextEdit. There are other
    text editors that are even better though, you might want to search for Sublime
    Text or Atom or download either of those. Remember to always ask an adult before
    downloading new programmes onto your computer; this helps to keep your computer
    healthy!


    +   3. There are lots of tags that you can try. Try adding these lines between
    your ''<body>'' and ''</body>'' tags:


    ```html

    <em>learning how to code.</em>

    <a href="https://www.codeacademy.com/">And here is a good site to learn from.</a>

    ```


    +   4. Save your web page and then have another look at in your browser.


    If you want to learn more about coding HTML there will help you out.


