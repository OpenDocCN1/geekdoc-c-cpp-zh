    # # What is coding?


    # What are computers?


    Computers are all around us. There are probably lots of computers in your house,
    you might not realise how many! Do you or your family have a laptop? Of course,
    that is a computer. But what about a mobile phone? Did you know that a mobile
    is a computer too? There''s a computer in your television, your microwave and
    your car. Sometimes we use computers that are hundreds, or thousands, of miles
    away. When you use the Internet, the computer (called a server) that stores the
    web page you are looking at could be in a completely different country to you.


    Computers are machines that can work out the answers to very maths problems. For
    instance, computers can add and subtract numbers, or they can tell whether two
    numbers are the same or not. They can do maths very quickly. If you tried to count
    to a million, it would probably take you over a week. A computer can count to
    a million in less than a second.


    Being able to do maths quickly is impressive but the thing that makes computers
    really special is that they can follow instructions. These instructions are called
    programs. Computers can follow these instructions and do extremely clever things,
    like moving monsters around the screen in a computer game, or flying a real aeroplane
    to take you on holiday.


    Without programs, a computer is completely useless. What actually makes computers
    so special is the programs that are written for them.


    ![](img/0ef4c508568feec5ab50e93dadefb3a1_6_0.png)


    > Programs

    Collections of instructions that a computer follows to perform a task'
