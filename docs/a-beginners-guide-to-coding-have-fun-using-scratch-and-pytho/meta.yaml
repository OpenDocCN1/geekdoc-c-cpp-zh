    \n## 增加游戏难度\n\n如果游戏随着玩变得变得就太好了。我们可以使用“传感器”中的计时器来实现这一点。\n\n- 1. 在你的箭头角色上添加此脚本，它将启动计时器并让游戏每玩一分钟就更复杂：\n\
