  md: "# # Are you ready for Python?\n\nPython is a programming language, just like\
    \ Scratch, but instead of moving and joining blocks, you write your code using\
    \ text.\n\nWhen you write code in Python it looks like this:\n```python\ndef sayHello():\n\
    \    print('Hello')\n```\n\nsayHello()\n\nPython was created by a man named Guido\
    \ van Rossum. It is a little harder to use than Scratch, but it is a very powerful\
    \ language. Well-known companies like Google and Apple use Python to write some\
    \ of their software.\n\nYou are going to learn how to use the version of Python\
    \ which is called Python 3. Start off by asking an adult to help you install Python\
    \ 3 on your computer visiting https://www.python.org/downloads\n\n# Software\n\
    \nPrograms or collections of programs that run on your computer. Your web browser\
    \ is a type of software, as is IDLE. which you'll be using in this chapter.\n\n\
    There you should find a link to download and install Python 3. Once you have installed\
    \ Python you should find a new program called IDLE on your computer. You can write\
    \ Python code with lots of different programs, but as a beginner, it is easiest\
    \ to use IDLE.\n\n> A quick note on deleting\nOnce you have pressed 'enter', you\
    \ can't delete the commands you have written.\nDon't worry if you make a mistake\
    \ - you can just type your code again correctly.\n\n![](img/0ef4c508568feec5ab50e93dadefb3a1_41_0.png)"
