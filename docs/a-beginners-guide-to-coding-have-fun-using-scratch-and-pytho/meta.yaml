  md: '# Turtles all the way


    # Some turtlely awesome commands


    +   1. Open IDLE.

    2. We''re going to play around with a part of Python called ''turtle''. This is
    a module used for drawing with Python.


    Module

    Code that has been written by other people, that you can use in your own programs.
    Programmers don''t like re-writing code that already exists, so they use modules
    to help speed things up.


    +   3. In the shell type the following command and press ''enter''. Don''t worry
    if nothing happens.


    > from turtle import *


    ```

    3.4.3 (default, Jul 2015, 01:28:31)

    [GCC 4.2.1, Compatible Apple LLVM 6.1.0 (clang-6 2.0.53)] on darwin

    type "help" , "credits" or "license" for

    more information.

    >>> from turtle import *

    >>> shape("turtle")

    >>>

    ```


    +   4. Remember that syntax is important. Make sure you type everything as shown.
    The ''*'' character is normally found by using ''shift'' and ''B''.


    +   5. We''re going to give our turtle a shape.

    Type into the shell.


    shape("turtle")


    +   6. A new screen will appear, with a picture of a turtle in the middle. It
    is best to arrange your screens side by side, like this:


