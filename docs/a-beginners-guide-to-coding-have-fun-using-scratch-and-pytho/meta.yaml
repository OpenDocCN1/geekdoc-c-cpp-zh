    # Painting pictures in SCRATCH


    Can you guess how this picture was made?


    ![](img/0ef4c508568feec5ab50e93dadefb3a1_19_0.png)


    It was created using a computer and some clever mathematics! It is called a fractal
    and if you look online you will find lots of examples of them. Fractals are amazing
    pictures created using repeating patterns.


    In this project you are going to use Scratch to create some pictures of your own.


    # Basic drawing


    +   1. First, you should create a new Scratch project and delete the cat sprite,
    like you did in the last project.

    2. Next, choose a new sprite from the library. This time, choose an arrow, as
    it makes it easy to see which way it is pointing.


