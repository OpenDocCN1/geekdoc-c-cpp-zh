    Experimenting with different values for the variables will give you some cool
    patterns. Before you click on the Put Scratch into turbo mode to switch things
    up a little. Hold down the ''shift'' key on your keyboard and click the to start
    turbo mode.


    # A note on coordinates in Scratch


    The position of a sprite on the Stage is represented in Scratch with two numbers,
    x and y.


    The x number sets the side to side position of the sprite.


    The y number sets the up and down position of the sprite.


    x:0 y:0 is the middle of the screen.


    If we increase the value of x, then the sprite moves right.


    If we decrease the value of x, then the sprite moves left.


    If we increase the value of y, then the sprite moves up.


    If we decrease the value of y, then the sprite moves down.


    +   4. Grab the flower block and place it somewhere in the Script Area. If you
    change the first number it will increase the number of petals. The second number
    will increase the size of the petals. Click on it to draw the flower.


