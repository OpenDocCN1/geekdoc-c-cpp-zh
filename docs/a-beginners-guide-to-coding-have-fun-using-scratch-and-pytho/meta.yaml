- img_proc: true
  md: '10. We need to change the value of `playerName` because at the moment it is
    set to ''O'', which is not your name!


    11. Click on the `Sensing` menu and drag the `answer` block into the `set playerName
    to 0` block, so it replaces the O.


    15. Change the first part of the block so that it says "It''s lovely to meet you".
    Make sure you leave an extra space at the end of the sentence, so that the last
    word won''t merge with the start of your name.


    16. Now click on `Data` and drag the variable `playerName` into the second part
    of the join block.


    ![](img/0ef4c508568feec5ab50e93dadefb3a1_16_0.png)


    12. Your name has now been saved by the program, and the sprite can use your name.


    ![](img/0ef4c508568feec5ab50e93dadefb3a1_16_1.png)


    13. Click on `Looks` and then drag the `say Hello for 2 secs` block onto the bottom
    of your custom block.


    14. Click on `Operators`, and drag the `join hello world` block into your custom
    block, so that it replaces the word ''Hello''.


    17. Left-click on your finished custom block to see it working... your sprite
    should ask your name, and when you reply, it should say "It''s lovely to meet
