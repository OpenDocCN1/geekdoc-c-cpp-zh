- md: "\n# Dance hero\n\nIn this chapter you're going to make your very dance game,\
    \ using images of yourself as the dancer!\n\n## Getting the images\n\n- 1. Ask\
    \ an adult to help you with this bit. You need to use a digital camera, a phone,\
    \ a tablet or even your webcam to take photos of yourself. Make sure you are in\
    \ a brightly lit room, and try to take pictures of yourself against a plain coloured\
    \ wall or door.\n2. You will need five photos: one standing normally and four\
    \ in a variety of dancing positions.\n3. Transfer the photos to your computer\
    \ and then rename each of them so that they are called 'Start', 'Right', 'Left',\
    \ 'Up' and 'Down'. If you don't have access to a camera, or don't want to upload\
    \ your images, you can use any of the dance sprites that are already available\
    \ in Scratch.\n\n![](img/0ef4c508568feec5ab50e93dadefb3a1_32_0.png)\n\n- 4. We\
    \ need to remove the background from the photo. Use the Eraser tool to select\
    \ the 'Erase' tool, and then carefully remove the background from the picture.\n\
    5. If you make a mistake you can undo the last action using the back icon and\
    \ you can zoom in and out using the zoom controls. You should finish with an image\
    \ that looks something like\n\n## Adding the images to Scratch\n\n- 1. Start a\
    \ new Scratch project and delete the cat sprite. In the Sprites Pane click on\
    \ the icon and choose the photo you called 'Start' from your computer.\n2. Click\
    \ on the 'Costumes' tab and you should see the image.\n\n![](img/0ef4c508568feec5ab50e93dadefb3a1_32_1.png)\n\
    \n### New costume:\n\n5. Now, staying in the 'Costumes' tab, click on the effects\
    \ button to upload a second costume. Choose the 'Right' photo next.\n6. Again,\
    \ remove the background, and then upload the next costume. Keep going until you\
    \ have uploaded all the photos, and all the costumes are listed on the left.\n\
    \n| Costume | Size |\n| :--- | :--- |\n| 1. Start | 89x273 |\n| 2. Right | 89x275\
    \ |\n| 3. Left | 78x285 |\n| 4. Up | 91x343 |\n| 5. Down | 91x210 |\n\n## Adding\
    \ some tunes\n\n- 1. You can use music from the 'Sounds' library, record some\
    \ from your computer's microphone or upload some music from your computer.\n-\
    \ 2. Click on the 'Sounds' tab.\n- 3. Now choose one of the icons, and either\
    \ pick a music loop, record some music or upload a file from your computer.\n\
    - 4. We're going to need 5 pieces of music for this project.\n\n## New sound:\n\
    \n- 1. My Music (03:10.01)\n- 2. dance space (00:04.00)\n- 3. dance slow mo (00:20.21)\n\
    - 4. techno2 (00:14.83)\n- 5. techno (00:07.96)\n\n![](img/0ef4c508568feec5ab50e93dadefb3a1_33_0.png)\n\
    \n## Making the music play\n\n## Setting the stage\n\n- 1. We're going to want\
    \ to change the track that's being played. So we need to make a variable that\
    \ will store the track numbers.\n- 1. We want a disco style backdrop for our game!\n\
    - 2. Click on the 'Scripts' tab and then click Data\n- 3. Click on Make a Variable\
    \ and call the variable Track\n- 4. Now we'll build our script to start the music\
    \ playing. Have a go at building the script below. You can find the play sound\
    \ My Music in the Sound menu.\n- 2. Over in the 'Stage' section, choose a new\
    \ backdrop by clicking on the icon.\n- 3. Choose any one of the 'Music and Dance'\
    \ backdrops that you like.\n- 4. Position your dancer within the Stage, and use\
    \ the icons to resize the sprite if you need to.\n- 5. Click on the flag and make\
    \ sure that the music plays. Make sure to check that your volume is turned up,\
    \ if you can't hear anything.\n\n![](img/0ef4c508568feec5ab50e93dadefb3a1_34_0.png)\n\
    ![](img/0ef4c508568feec5ab50e93dadefb3a1_34_1.png)\n\n## Making the sprite\n\n\
    5. All the scripts you've made for your dancer so far should look like this:\n\
    \n![](img/0ef4c508568feec5ab50e93dadefb3a1_35_0.png)\n\n- 1. Make sure you have\
    \ clicked back on your 'Start' sprite.\n- 2. Now modify the 'Start' script to\
    \ set the starting costume.\n- 3. You'll work out the next part in time!\n\n```\n\
    when clicked\nswitch costume to Start\nset Track to 1\nforever\nplay sound Track\
    \ until done\n```\n```\nwhen down key pressed\nswitch costume to Down\nforever\n\
    play sound Track until done\n```\n```\nwhen up key pressed\nswitch costume to\
    \ Up\n```\n```\nwhen right key pressed\nswitch costume to Right\n```\n```\nwhen\
    \ left key pressed\nswitch costume to Left\n```\n\nWe need four small scripts\
    \ to make the sprite change costume when the player presses the keys.\n\n- b.\
    \ Click on the sprite then use the arrow keys to make your sprite dance to the\
    \ music.\n\n![](img/0ef4c508568feec5ab50e93dadefb3a1_35_1.png)\n\n- 4. Add the\
    \ scripts below:\n\n```\nwhen down key pressed\nswitch costume to Down\n```\n\
    ```\nwhen right key pressed\nswitch costume to Right\n```\n```\nwhen up key pressed\n\
    switch costume to Up\n```\n```\nwhen left key pressed\nswitch costume to Left\n\
    ```\n\n## Making the game\n\nNow we have a dancing sprite, we can start to make\
    \ the game. First we'll need an arrow sprite:\n\n- 1. Click on the icon in the\
    \ 'Sprites' panel.\n- 2. Find the arrow sprite.\n- 3. Now we are going to add\
    \ a few scripts to the arrow sprite.\n- 4. In our game, the player will have 5\
    \ lives and the speed of the game will start at 1 and then increase. Your computer\
    \ will need a few variables in your program to store that data.\n- 5. First we\
    \ need to set the starting position of sprite and then hide it:\n\n![](img/0ef4c508568feec5ab50e93dadefb3a1_36_2.png)\n\
    ![](img/0ef4c508568feec5ab50e93dadefb3a1_36_3.png)\n\n- 6. Next we need to randomly\
    \ change the arrow's costume, and make a clone of it.\n\n![](img/0ef4c508568feec5ab50e93dadefb3a1_36_0.png)\n\
    - 7. When the clone is created, we need it to become visible and then start to\
    \ move across the screen.\n\n![](img/0ef4c508568feec5ab50e93dadefb3a1_36_1.png)\n\
    \n- 8. Click on the icon and make sure that the arrows are moving across the screen.\n\
    - 9. Let's make the arrows change colour when they get below the dancer. We can\
    \ make the arrows change their colour effect when their position is between -30\
    \ and 30.\n\n```\nwhen flag clicked\nforever\n  move 3 steps\n  if x position\
    \ < -30 or x position > 30 then\n    change colour effect by 15\n```\n\n- 10.\
    \ Click on the icon and make sure that the arrows change colour.\n- 11. Now for\
    \ the player's controls. We want the player to have to press the correct key on\
    \ their keyboard when the arrow changes colour – their timing will have to be\
    \ pretty good! First create this script, which detects the key being pressed,\
    \ and checks whether the arrow's costume is the one pointing towards the right.\n\
    \n```\nwhen right arrow pressed and costume # = 1 then\n  delete this clone\n\
    ```\n- 12. We can copy this script another three times, by shift-clicking on it\
    \ and choosing 'duplicate'.\n\n```\nwhen duplicate pressed and costume # = 1 then\n\
    \  delete\n  add comment\n  help\n```\n\n- 13. Now join scripts together and change\
    \ the keys and costume values for all three duplicates, so that it looks like\
    \ this:\n\n![](img/0ef4c508568feec5ab50e93dadefb3a1_38_0.png)\n- 14. We've finished\
    \ building the key detection script now, so add it into the clone's script:\n\n\
    ![](img/0ef4c508568feec5ab50e93dadefb3a1_38_1.png)\n- 15. Click on the flag and\
    \ make sure that the arrows get deleted when you press the keys at the right time.\n\
    \n## Making the game more difficult\n\nIt would be nice if the game became more\
    \ difficult as it was played. We can use the timer from Sensing to do this.\n\n\
    - 1. On your arrow sprite, add this in script, which will start a timer and make\
    \ the game trickier every minute that it is played:\n2. Click on the flag to see\
    \ if the arrows get faster after a minute.\n3. If a minute is too long to wait,\
    \ you can change the timer to 15 seconds:\n\n![](img/0ef4c508568feec5ab50e93dadefb3a1_38_2.png)\n\
    \n## Changing the music\n\nLet's change the music when the game speeds up!\n\n\
    - 1. On the arrow sprite, grab a `broadcast message` block from `Events`\n2. Now\
    \ create a new message: `broadcast Change Track` and place it in the script after\
    \ the speed has been changed.\n- 3. Now you need to click on your sprite.\n\n\
    ![](img/0ef4c508568feec5ab50e93dadefb3a1_39_0.png)\n\n- 4. To change the music\
    \ track, add in this new script:\n\n```\nwhen I receive Change Track\nchange Track\
    \ by 1\nstop all sounds\n```\n\n![](img/0ef4c508568feec5ab50e93dadefb3a1_39_1.png)\n\
    - 5. Click on the icon and make sure that the music changes when the arrows speed\
    \ up.\n\n## Game over\n\n- 1. Finally, we want the game to end if the player makes\
    \ too many mistakes.\n2. Click back on the icon and create this script to detect\
    \ if a clone is touching the edge of the screen.\n\n```\nif touching edge then\n\
    change lives by -1\nreset timer\ndelete this clone\n```\n"
  mdcn: "\n\n# 舞动英雄\n\n在本章节中，你将制作属于自己的舞蹈游戏，并使用自己的照片作为舞者！\n\n## 获取图片\n\n- 1. 请一位大人帮助你完成这一部分。你需要使用数码相机、手机、平板电脑甚至摄像头来拍摄自己的照片。确保你在光线充足的房间里，并尝试对着单色墙或门拍摄自己的照片。\n\
    2. 你需要五张照片：一张正常站立的照片和四张不同舞蹈姿势的照片。\n3. 将照片传输到电脑，然后将它们分别重命名为‘Start’（开始）、‘Right’（右）、‘Left’（左）、‘Up’（上）和下。如果你没有相机，或者不想上传自己的图片，可以使用\
    \ Scratch 中现有的任何舞蹈角色。\n\n![](img/0ef4c508568feec5ab50e93dadefb3a1_32_0.png)\n\n\
    - 4. 我们需要移除照片中的背景。使用橡皮擦工具选择“擦除”工具，然后仔细地删除图片中的背景。\n5. 如果你操作失误了，可以使用返回图标撤销上一步操作，并可以使用缩放控制进行放大或缩小。你最后的图片应该像这样\n\
    \n## 将图片添加到 Scratch\n\n- 1. 开启一个新的 Scratch 项目并删除小猫角色。在“角色”面板中点击图标，从你的电脑中选择你命名为‘Start’的照片。\n\
