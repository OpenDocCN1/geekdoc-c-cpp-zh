  md: '# A note on shortcuts


    It''s easier to use shortcut keys than always using the menus in files.

    To save a file on Windows just hold down the ''ctrl'' key and press the ''s''
    key once.

    To save a file on a Mac just hold down the ''cmd'' key and press the ''s'' key
    once.

    To run a file on Windows you can press ''FS'' key at the top of the keyboard.

    On a Mac you can press ''FS'' as well, but you may need to

    hold the ''Fn'' key at the same time.


