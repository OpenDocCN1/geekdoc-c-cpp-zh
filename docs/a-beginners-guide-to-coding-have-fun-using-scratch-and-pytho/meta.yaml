  md: '# White hat hackers Hackers who use their skills to protect people


    # AAA Games


    AAA Games are made by large companies. These are the games that you see advertised
    on TV and that often sell millions of copies. AAA Games are made by huge teams
    of people. There are programmers to write the code, artists to make the 3D characters
    and scenery, writers to create the stories, musicians to compose the music, designers
    to design the levels, and then other huge teams in charge of advertising and selling
    the game.


    money to find zero-day exploits. There are even competitions for white hat hackers,
    with thousands of pounds in prize money for the ones who find the most zero-day
    exploits. White hat hackers are like the superheroes of the hacking world!


    # Indie and AAA games programmers


    Many people first start learning to code because they want to make computer games.
    Maybe that''s why you are reading this book right now. If you become a developer,
    you might want to make either Indie Games or AAA Games.


    Programmers that work for AAA games companies will often be in charge of one very
    small element of a game. They might be experts in creating realistic world, or
    creating the rules that decide how the non-player characters act, or even something
    specific as to make flags flutter in the wind


    # Indie Games


    # What is Free and Open Source Software?


    Indie games developers work on their own, or with a few friends, to create their
    games. They do all the themselves, from writing the code for the game, to creating
    the graphics, and telling the story. Indie developers do not work for any single
    company, so they are free to make whatever games they like for consoles, tablets,
    phones or PCs.


    If you become a programmer you will be able to work on Free and Open Source Software
    (FOSS). These programs are written by coders either on their own or with the help
    of lots of other coders. Free Open Source Software is free for people to use,
    copy and share. Best of all, you are also allowed to have a look through the code
    and to make improvements to it.


    Some Indie games become extremely popular and can make the developers a lot of
    money. Sometimes the developers will give away games for free, because they care
    more about the art of making games. Indie developers might also sell just a few
    games to their fans. Perhaps the most famous Indie game of all time is Minecraft.


    FOSS is really important. Most of the websites you visit on the Internet is sitting
    on servers that run on GNU/Linux.


    Free and Open Source Software (FOSS) Computer programs that you are allowed to
    look at, change and use share


