    ![](img/0ef4c508568feec5ab50e93dadefb3a1_26_1.png)

    -   7. 我们应该选择哪个键？按下后会发生什么？让我们从“上”箭头键开始。每当按下“上”箭头键时，让飞船的 y 位置增加十。


