  md: '# Saving your turtle


    +   1. We have been writing all our commands in the shell until now. This is easy
    to do, but it means we lose all the fun pictures we have made when we close IDLE.


    +   2. We can save our code, if we stop writing in the shell and use files instead.


    +   3. In IDLE click on ''File'' and then ''New File''.


    ```

    File Edit Debug

    New File ⌘N

    Open... ⌘O

    Open Module...

    Recent Files ▶

    Class Browser ⌘B

    Path Browser

    Close ⌘W

    Save ⌘S

    Save As... ↑S

    Save Copy As... ⌥

    Print Window ⌘P

    ```


    +   4. Another window should open. Here you can write all your code. We can start
    in the same way we did before:

    ```python

    from turtle import *

    shape("turtle")

    ```


    +   5. Nothing happens when you press ''enter'' on your keyboard this time. This
    is because we aren''t in the shell. We need to choose ''save'' and ''Run'' to
    see the file working.


