    # # Talk to the animals


    Now it''s time to get started - let''s see if you can code a game that lets the
    player talk to an animal character.


    # Sprites


    +   - Programmers call the pictures used in computer programs ''sprites''.


    ![](img/0ef4c508568feec5ab50e93dadefb3a1_13_0.png)


    ![](img/0ef4c508568feec5ab50e93dadefb3a1_13_1.png)


    +   2. In the Sprites Pane, you will see a cat sprite.


    +   3. Delete this sprite by right-clicking on it and then clicking on ''delete''.


    +   4. Click on in the Sprites Pane to see all the amazing sprites you can use
    in Scratch.


    +   5. Here is the starfish, but you can choose any sprite you like - how about
