  md: '# # Talking


    +   1. Now we will make the sprite talk using something called a custom block.


    +   2. Click on the `More Blocks` menu in the Block Palette (make sure you are
    in the Scripts tab).


    +   3. Now click on `Make a Block`.


    ![](img/0ef4c508568feec5ab50e93dadefb3a1_14_0.png)


    +   4. We can call the new block ‘sayHello’, by typing this into the purple box.


    +   5. Then click on `OK`.


    +   6. Let''s add some code to our custom block!


    +   7. Click on the `Looks` menu.


    +   8. We want to drag the `say Hello for 2 secs` from the Block Palette and connect
    it to the `say sprite` line that will appear between the two blocks, drag the
    new block over this and they join together, like a jigsaw!


    Custom block

    A Scratch block that does a specific task


    ![](img/0ef4c508568feec5ab50e93dadefb3a1_14_1.png)


    +   9. Now, if you click on the script, the sprite should say “Hello!”


    ```

    define sayHello

    say Hello for 2 secs

    ```


    ![](img/0ef4c508568feec5ab50e93dadefb3a1_14_2.png)


    ![](img/0ef4c508568feec5ab50e93dadefb3a1_14_3.png)


    ![](img/0ef4c508568feec5ab50e93dadefb3a1_14_4.png)


    Script

    Small section of code, which can be as short as a few lines or long as hundreds
    of lines. In Scratch, a script is a collection of blocks that you have joined
    together.


    ![](img/0ef4c508568feec5ab50e93dadefb3a1_14_5.png)


    ![](img/0ef4c508568feec5ab50e93dadefb3a1_14_6.png)'
  merge: -1
