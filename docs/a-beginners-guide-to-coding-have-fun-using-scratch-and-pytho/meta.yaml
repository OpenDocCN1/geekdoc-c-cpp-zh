    - 10. You can now press the flag and have a go at controlling the spaceship!\n\
    \n![](img/0ef4c508568feec5ab50e93dadefb3a1_26_6.png)\n\n## Endless robots\n\n\
    Now we have our spaceship working, let's make some robots to throw at it.\n\n\
