  md: '# Running it all together


    +   1. Now that we have two custom blocks we can join them so that they run, one
    after the other, without having to click on them every time.


    +   2. From Events drag the when block onto the Script Area.


    +   3. From More Blocks you can now attach your two custom blocks to the bottom
    of it.


    +   4. Now click the at the top of the stage to see your program working.


    +   5. Well done: you''ve created your first computer program! You''re well on
    your way to being an awesome coder.


    ![](img/0ef4c508568feec5ab50e93dadefb3a1_17_0.png)


