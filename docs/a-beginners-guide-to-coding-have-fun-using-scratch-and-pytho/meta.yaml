    # GNU/Linux Free and Open Source system used on many computers around the world


    This is a FOSS group of operating systems and it is improving every day by thousands
    of programmers from all over the world. Do you or somebody in your family use
    an Android phone? That phone will be running lots of FOSS. Do you use Firefox
    as your web browser? This is also based on FOSS.


    Lots of people help to make FOSS. Some people do it for fun, others do it because
    they want to help the programming community, and others do it as their job.


    # A secret key


    Encryption is a way of changing information so that nobody else can read it unless
    they have the secret key.


    Imagine you wanted to send a message:

    **“Meet me at the park at three.”**


    but you didn''t want anyone else to be able to read it.


    > Encryption Disguising data so that it is impossible to read without knowing
    how it has been disguised


    You could use a simple method of encryption to disguise your message. For instance
    you could use a key of 5 and then move each letter of your message forward 5 letters
    in the alphabet, as shown here:


    abcdefghijklmnopqrstuvwxyz

    fghijkluvwxyzabcdefc

    So:

    “Meet me at the park at three”

    would become:

    “Rljyj rj fy ym ufw fy ymjjj”


    If your friend knows the key is 5 then they could easily **decrypt your message**
    to read its real meaning!


    Encryption used today is much more complicated than this method, which was originally
    used by Julius Caesar, the Roman Emperor, to send messages to his generals.


    > Decrypt Make encrypted data readable


    This method, called the **Caesar cipher**, would be easy to decrypt, by trying
    all twenty six keys, and seeing which key made sense of the message.


    Programmers now create methods of encrypting information that are so complicated,
    it is impossible to crack them without the key. This is really important, especially
    when you are using the Internet. When you send messages back and forth on the
    Internet, it is really easy for another person (maybe a black hat) to see your
    message. This could mean that someone could see what you were doing when you were
    typing in your password, doing some shopping or using your bank. To stop other
    people being able to read the messages your computer sends out over the Internet,
    the information is fully encrypted.


