    # ## What are strings?


    In programming, the word string is short for "string of characters". Characters
    are all the letters and symbols you can see on your keyboard (a-z, 0-9) plus others
    that you don''t see like ❤️ or 😊 So a string is just one or more characters put
    together. In Python, strings are always surrounded with double or single quotation
    marks. You can use them, but keep them the same on each line of code, like this:


    “Hello World!”


    ‘I love Python’


