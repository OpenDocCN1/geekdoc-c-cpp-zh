    Class Browser ⌘B

    Path Browser

    Close ⌘W

    Save ⌘S

    Save As... ↑S

    Save Copy As... ⌥

    Print Window ⌘P

    Run Options Window

    Python Shell

    Check Module ⌥X

    Run Module F5

    ```


    +   7. The first time you save, you will need to name the file. Call it ''poly.py''.'
