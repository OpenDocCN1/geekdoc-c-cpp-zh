  md: "# # What is coding?\n\nWhen a programmer writes a computer program, they can't\
    \ use any of the languages that people normally use to speak to each other. For\
    \ instance, you can't simply say to a computer \"count to one thousand\". Instead,\
    \ you have to use a special language called a programming language. There are\
    \ hundreds of different languages that you can write programs in.\n\nOnce you\
    \ have finished writing a computer program it needs to be translated into '1s\
    \ and Os. This is called **compiling** or **interpreting**, and allows the computer\
    \ to read the instructions. It doesn't matter which programming language you use,\
    \ it always ends up being translated into '1s and Os by the computer.\n\nIf we\
    \ wanted a computer to count to one thousand later in Scratch, a programming language\
    \ you will soon be we would write:\n\nCompiling\nConverting a program into a language\
    \ that it can run\n\n```\nwhen clicked\nset i to 0\nrepeat 1000 until\nchange\
    \ i by 1\nsay 1\n```\n\nInterpreting\nWhen a program is run by a computer, one\
    \ line at a time\n\nIn Python, a language which you will learn later on in this\
    \ book, we might indent write:\n\n```\nfor i in range(1001):\n    print(i)\n```\n\
    \nIn another language called JavaScript we would write:\n\n```\nfor(i=0; i<1001;\
    \ i++)\n    console.log(i);\n```\n\nThe words and symbols used in programming\
    \ languages are called **code**. So we often call computer programs **coding**.\n\
    \n> Code\nInstructions written in a programming language that a computer can follow\n\
    \n> Coding\nWriting code for a computer\n\n![](img/0ef4c508568feec5ab50e93dadefb3a1_7_0.png)\n\
    \n![](img/0ef4c508568feec5ab50e93dadefb3a1_7_1.png)"
