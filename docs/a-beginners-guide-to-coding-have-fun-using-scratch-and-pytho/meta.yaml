    \ SPA\n13579108642\n\nScratch is developed by the Lifelong Kindergarten Group\
    \ at the MIT Media Lab.\nSee http://scratch.mit.edu. The SCRATCH name and logos\n\
    trade marks owned by the Scratch Team.\nFor terms of use see: https://scratch.mit.edu/terms_of_use/\n\
    \n# Contents\n\n- A guide to this book 4\n- What is coding 5\n- Getting ready\
    \ to Scratch 8\n- Talk to the animals 12\n- Painting pictures in Scratch 18\n\
    - The clones attack 24\n- Dance hero 31\n- Are you ready for Python? 40\n- Turtles\
    \ all the way 42\n- Loopy shapes 45\n- Fun with strings 52\n- Programming in the\
    \ real world 57\n- Find out more 61\n\n## A guide to this book\n\n## What will\
    \ I learn?\n\nIn the next few chapters you will learn how to use two different\
    \ programming languages. The first language is called **Scratch** and the second\
    \ is called **Python**. You will be able to complete exciting projects in each\
    \ of the languages, with plenty of help to guide you as you learn to **program**.\n\
    \n- Scratch Programming language created for children that uses blocks of code\
    \ which can be connected together to make programs\n- Python Programming language\
    \ based on typing text which is designed to be simple to learn and use\n\n![](img/0ef4c508568feec5ab50e93dadefb3a1_5_0.png)\n\
    \nIt is very important to check with an adult before downloading anything onto\
    \ your computer. This helps to keep you safe on the internet, and will also keep\
    \ your computer healthy!\n\nProgram Design and write code\n\n## How to use the\
    \ tutorials\n\nLearning to code is all about practising and experimenting. Follow\
    \ each of the tutorials carefully, and make sure you read the instructions as\
    \ well as looking at the picture guides.\n\nMost importantly, once you have finished\
    \ a tutorial, play around with your code. Try changing and adding extra bits,\
    \ and don't worry if you break your code! All the best **programmers** in the\
    \ world make mistakes, but fixing those mistakes (called **debugging**) is the\
    \ best way to learn.\n\nThere's even a famous quote about coding and making mistakes,\
    \ by Mark Zuckerberg – the man who created Facebook.\n\n**Programmer** Person\
    \ who designs and writes code\n\n> \"Move fast and break things. Unless you are\
    \ breaking things, you are not moving fast enough.\"\n\n**Debugging** Testing\
    \ code to find and fix mistakes\n\n## What is coding?\n\n### What are computers?\n\
    \nComputers are all around us. There are probably lots of computers in your house,\
    \ you might not realise how many! Do you or your family have a laptop? Of course,\
    \ that is a computer. But what about a mobile phone? Did you know that a mobile\
    \ is a computer too? There's a computer in your television, your microwave and\
    \ your car. Sometimes we use computers that are hundreds, or thousands, of miles\
    \ away. When you use the Internet, the computer (called a server) that stores\
    \ the web page you are looking at could be in a completely different country to\
    \ you.\n\nComputers are machines that can work out the answers to very maths problems.\
    \ For instance, computers can add and subtract numbers, or they can tell whether\
    \ two numbers are the same or not. They can do maths very quickly. If you tried\
    \ to count to a million, it would probably take you over a week. A computer can\
    \ count to a million in less than a second.\n\nBeing able to do maths quickly\
    \ is impressive but the thing that makes computers really special is that they\
    \ can follow instructions. These instructions are called programs. Computers can\
    \ follow these instructions and do extremely clever things, like moving monsters\
    \ around the screen in a computer game, or flying a real aeroplane to take you\
    \ on holiday.\n\nWithout programs, a computer is completely useless. What actually\
    \ makes computers so special is the programs that are written for them.\n\n![](img/0ef4c508568feec5ab50e93dadefb3a1_6_0.png)\n\
    \n> Programs\nCollections of instructions that a computer follows to perform a\
    \ task\n\n### What is coding?\n\nWhen a programmer writes a program, they can't\
    \ use any of the languages that people use to speak to each other. For instance,\
    \ you can't simply say to computer \"count one thousand\". Instead, you have to\
    \ use a special language. There are hundreds of different languages you can write.\n\
    \nOnce you have finished writing a program, it needs to be translated into 1s\
    \ and Os. This is called **compiling** or **interpreting**. If we wanted a computer\
    \ to count one thousand in Scratch, we would write:\n\n```\nwhen clicked\nset\
    \ i to 0\nrepeat 1000\nchange i by 1\n```\n\nWhen a program is run by a computer,\
    \ one line at a time. In Python, a language which you will learn on, we might\
    \ write:\n\n```python\nfor i in range(1001):\n    print(i)\n```\n\nIn another\
    \ language called JavaScript we would write:\n\n```javascript\nfor(i=0; i<1001;\
    \ i++)\n    console.log(i);\n```\n\nThe words and symbols used in programming\
    \ languages are called **code**. So we often call computer programs **coding**.\n\
    \n> Code\nInstructions written in a programming language that a computer can follow\n\
    \n> Coding\nWriting code for a computer\n\n![](img/0ef4c508568feec5ab50e93dadefb3a1_7_0.png)\n\
    \n![](img/0ef4c508568feec5ab50e93dadefb3a1_7_1.png)\n\n## What is syntax?\n\n\
    Syntax is the rules of a language. Look at these two sentences:\n\n- *I am an\
    \ awesome coder.*\n- *coder am I awesome.*\n\nThe first sentence makes sense,\
    \ because it follows the syntax (or rules) of the English language. The second\
    \ sentence doesn't follow the rules and doesn't make sense. You could probably\
    \ work out what the sentence means, even though the words are in the wrong order,\
    \ because you are an intelligent person. But computers aren't intelligent in the\
    \ same way as you! They can't work out what you mean when you write code that\
    \ isn't.\n\nIf you don't follow the rules of the programming language, the computer\
    \ will not try to compile or interpret the instructions; instead it will just\
    \ tell that you've made a mistake. This is called a syntax error.\n\n> Syntax\
    \ error\nMistake in a computer program caused by the rules of the programming\
    \ language\n\n![](img/0ef4c508568feec5ab50e93dadefb3a1_8_0.png)\n\n## Why is coding\
    \ important?\n\nThere are computers everywhere and they are doing many important\
    \ jobs every day. We use computers to learn, to work, to play, to talk, to travel...\
    \ and every time we use a computer, it works by running code that was written\
    \ by a programmer. Without coders, computers wouldn't work and the world would\
    \ be a very different place!\n"
  mdcn: "\n\n# MARC SCOTT\n\n# 插画 Mick Marston\n\n# 编程入门指南\n\n玩转 Scratch 和 Python\
    \ 的乐趣\n\nJ 005. 1\n\n布鲁姆斯伯出版社\n\n# MARC SCOTT\n\n# 编程入门指南\n\n插画 MICK MARSTON\n\
