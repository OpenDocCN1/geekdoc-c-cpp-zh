    # Find out more


    # Snap!


    If you liked Scratch then you''ll love Snap! it is another programming language
    that is very similar to Scratch. You can have a look at Snap! by going to http://snap.berkeley.edu/
    in a web browser. Snap is a little more complicated than Scratch, but it is also
    more powerful — you can do more things with it.


    ```

    Snap! Programming language similar Scratch

    ```


    # The Raspberry Pi


    This isn''t a pudding — the tiny computer that can help you learn to code. There
    are hundreds of resources online to teach you how to code on the Raspberry Pi
    and http://www.raspberrypi.org is a good place to start. The Raspberry Pi has
    input and output pins which allow you to connect all types of devices and electronic
    components. This means you can write code to do anything from a few lights, to
    controlling a robot on the Internet.


    # Touch Develop


    If you want to write code on a tablet or phone and build apps that will run on
    mobile devices, then you should have a look at Touch Develop. You can have a play
    with Touch Develop by creating an account at https://www.touchdevelop.com/app/.
    Touch Develop has two modes — a Scratch-like mode that lets you drag and drop
    blocks, and a mode that lets you write scripts like you do in Python.


    ```

    Touch Develop Programming language similar to Scratch which is designed to be
    used on smartphones and tablets

    ```


    # Codecademy


    Codecademy at https://www.codacademyemy.com is a website that can help you learn
    to code. There are lots of things to learn about this website: you can learn more
    HTML and JavaScript if you want to learn about web development. You could also
    improve your Python skills or learn a new programming language like Ruby.


    ![](img/0ef4c508568feec5ab50e93dadefb3a1_62_0.png)


