    # What is syntax?


    Syntax is the rules of a language. Look at these two sentences:


    +   * I am an awesome coder.*


    +   *coder am an I awesome.*


    The first sentence makes sense, because it follows the syntax (or rules) of the
    English language. The second sentence doesn''t follow the rules and doesn''t make
    sense. You could probably work out what the sentence means, even though the words
    are in the wrong order, because you are an intelligent person. But computers aren''t
    intelligent in the same way as you! They can''t work out what you mean when you
    write code that isn''t correct.


    If you don''t follow the rules of the programming language, the computer will
    not try to compile or interpret the instructions; instead it will just tell that
    you''ve made a mistake. This is called a syntax error.


    > Syntax error

    Mist in a computer program caused by the rules of the programming language


    ![](img/0ef4c508568feec5ab50e93dadefb3a1_8_0.png)


    # Why is coding important?


    There are computers everywhere and they are doing many important jobs every day.
    We use computers to learn, to work, to play, to talk, to travel... and every time
    we use a computer, it works by running code that was written by a programmer.
    Without coders, computers wouldn''t work and the world would be a very different
    place!'
- md: '

    ## Getting ready to SCRATCH


    Scratch is a programming language that was designed to teach coding. You''ll get
    the hang of it in no time, and then you can use it to create it to create games,
    interactive stories and animations.


    Before you start using Scratch, you''re going to need to create an account, and
    if you are under 13 years old, you will need to talk to an adult and use their
    email address.


    ## Setting up a Scratch account


    1. Open a web browser on your computer.

    2. You need to go to www.scratch.mit.edu

    3. You should see a Join Scratch button that you can click on.

    4. Next you will need to choose a username and a password. Make sure you do not
    use your real name. Click Next when you are done.


    ![](img/0ef4c508568feec5ab50e93dadefb3a1_9_0.png)


    ## Names on the Internet


    The Internet is a great place to meet and talk to new people, but you don''t know
    who you are talking to, and whether you can trust them. You should always pick
    usernames that are different from your real name. Choose a favourite game or cartoon
    character, or even a pet''s name.


    ## Passwords


    Passwords make sure nobody can use your account and pretend to be you. You should
    choose a password that nobody would be able to guess. It is a good idea to use
    a passphrase like: ILoveEatingHats or MyFishNeverSleeps


    > Passphrase: Group of words that is easy to remember but hard for someone else
    to guess


    ![](img/0ef4c508568feec5ab50e93dadefb3a1_9_1.png)


    ## Join Scratch


    Your responses to these questions will be kept private.

    Why do we ask for this?


    | Birth Month and Year | January | 2008 |

    | :--- | :--- | :--- |

    | Gender | Male | Female |

    | Country | United Kingdom | |


    ![](img/0ef4c508568feec5ab50e93dadefb3a1_10_0.png)


    5. Now you need to add in your age, gender and location before clicking on Scratch.


    ![](img/0ef4c508568feec5ab50e93dadefb3a1_10_1.png)


    6. For the next part you will need a helpful adult. Ask them to fill in your email
    address in the spaces provided. They can check their email later to confirm their
    address.


    7. If you see a screen like this one, then it means you have been registered with
    the Scratch website, and you''re ready to start coding!


    ## Join Scratch


    Welcome to Scratch, awesome-coder-!

    You''re now logged in! You can start exploring and creating projects.

    If you want to share and comment, simply click the link in the email we sent you.

    Wrong email? Change your email address in Account Settings.

    Having problems? Please give us feedback


    ![](img/0ef4c508568feec5ab50e93dadefb3a1_10_2.png)


    8. Click on the Ok Let Go! button, to begin exploring Scratch.


    ![](img/0ef4c508568feec5ab50e93dadefb3a1_10_3.png)


    ## Getting around


    1. To understand the projects in this book, you are going to need to know a little
    about the Scratch Graphical User Interface (GUI).

    2. On the main page, click on Create

    3. You should see a screen like the one on the next page.


    ### Graphical User Interface

    The (GUI) Screen lets you click buttons, or choose items from a menu, usually
    using your mouse, trackpad or touch screen.


    The Stage

    is where you can see your project running.


    The Sprites Pane

    is where you can keep all the images you will use in the project.


    The Toolbar is where you can choose options like saving your project or creating
    a new one.


    ## Toolbar


    ![](img/0ef4c508568feec5ab50e93dadefb3a1_11_0.png)


    ## Stage


    ![](img/0ef4c508568feec5ab50e93dadefb3a1_11_1.png)


    ## Sprites Pane


    ![](img/0ef4c508568feec5ab50e93dadefb3a1_11_2.png)


    ### The Script Area

    The Script Area is where you will place all your code for the project.


    ### Block Palette

    The Block Palette is where you will find all the code you need to create your
    projects. These have different colours depending on what they do (for example,
    the pink blocks control sound). Little about Scratch let''s start on the next
    chapter, and code your first project!


    ## Talk to the animals

    Now it''s time to get started - let''s see if you can code a game that lets the
    player talk to an animal character.


    ## Sprites

    - Programmers call the pictures used in programs ''sprites''.

    1. In the Sprites Pane, you will see a cat sprite.

    2. Delete this sprite by right-clicking on it and then clicking ''delete''.

    3. Click on Sprites Pane to see all the amazing sprites you can use in Scratch.

    4. Here is a starfish, but you can choose any sprite - how about a dragon, a dinosaur,
    or a baby elephant?


    ![](img/0ef4c508568feec5ab50e93dadefb3a1_13_0.png)

    ![](img/0ef4c508568feec5ab50e93dadefb3a1_13_1.png)

    ![](img/0ef4c508568feec5ab50e93dadefb3a1_13_2.png)


    ## Talking

    1. Now we will make the sprite talk using something called custom block.

    2. Click on the `More Blocks` menu in the Block Palette (make sure you are in
    Scripts tab).

    3. Now click on `Make a Block`.

    4. We can call the new block ‘sayHello’, by typing this into the box.

    5. Then click on `OK`.

    6. Let''s add some code to our custom block!

    7. Click on the `Looks` menu.

    8. We want to drag the `say Hello for 2 secs` from the Block Palette and connect
    it to the `say sprite` line that will appear between the two blocks, drag the
    new block over and they join together, like a jigsaw!


    ### Custom block

    A Scratch block that does a specific task.


    9. Now, if you click on the script, the sprite should say “Hello!”

    ```

    define sayHello

    say Hello for 2 secs

    ```

    ![](img/0ef4c508568feec5ab50e93dadefb3a1_14_0.png)

    ![](img/0ef4c508568feec5ab50e93dadefb3a1_14_1.png)

    ![](img/0ef4c508568feec5ab50e93dadefb3a1_14_2.png)

    ![](img/0ef4c508568feec5ab50e93dadefb3a1_14_3.png)


    ### Script

    Small section of code, which can be as short as a few lines or long as hundreds
    of lines. In Scratch, a script is a collection of blocks that you have joined
    together.


    ![](img/0ef4c508568feec5ab50e93dadefb3a1_14_4.png)

    ![](img/0ef4c508568feec5ab50e93dadefb3a1_14_5.png)


    ## Asking questions

    1. Our sprite is talking to us, but wouldn''t it be cool if we could talk back
    to it?

    2. Make a new custom block just like you did before, but call it `askName`.

    3. Click on the `Sensing` menu and drag the block `What''s your name?` and `and`
    onto your custom block.

    4. Test your new block by clicking on it.

    5. Type your name into the box at the bottom and press ''enter'' on your keyboard.

    6. Although you gave the program name, you didn''t tell the program to remember
    it. For the program to remember your name, we can use a variable. Variables allow
    programs to store bits of data like names or numbers.

    7. In the `Data` menu click `Make Variable`.

    8. We will call the variable `playerName`.

    9. Now there will be some new blocks to choose from the Block Palette. We want
    the `set playerName to` block. Drag it to the bottom of your custom block.


    ![](img/0ef4c508568feec5ab50e93dadefb3a1_15_0.png)

    ![](img/0ef4c508568feec5ab50e93dadefb3a1_15_1.png)

    ![](img/0ef4c508568feec5ab50e93dadefb3a1_15_2.png)

    ![](img/0ef4c508568feec5ab50e93dadefb3a1_15_3.png)


    10. We need to change the value of `playerName` because at the moment it is set
    to ''O'', which is not your name!

    11. Click on the `Sensing` menu and drag the `answer` block into the `set playerName
    to` block, so it replaces the O.

    15. Change the first part of the block so it says "It''s lovely to meet you".
    Make sure you leave an extra space at the end of the sentence, so that the last
    word won''t merge with the start of your name.

    16. Now click on `Data` and drag the variable `playerName` into the second part
    of the join block.


    ![](img/0ef4c508568feec5ab50e93dadefb3a1_16_0.png)

    ![](img/0ef4c508568feec5ab50e93dadefb3a1_16_1.png)


    12. Your name has now been saved by the program, and the sprite can use your name.

    13. Click on `Looks` and then drag the `say Hello for 2 secs` block onto the bottom
    of your custom block.

    14. Click on `Operators`, and drag the `join hello world` block into your custom
    block, so that it replaces the word ''Hello''.

    17. Left-click on your finished custom block to see it working... your sprite
    should ask your name, and when you reply, it should say "It''s lovely to meet
    you [name]". What a polite sprite!


    ![](img/0ef4c508568feec5ab50e93dadefb3a1_16_2.png)

    ![](img/0ef4c508568feec5ab50e93dadefb3a1_16_3.png)

