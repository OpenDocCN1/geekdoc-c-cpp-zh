    # Programming in the real world


    # What are hackers?


    You''ve probably heard the word hackers before, but very few people understand
    what it really means. People think of hackers as nasty programmers who use their
    coding skills to break the law, steal people''s information, or sometimes even
    their money. This is because we see these stories in the newspapers or on the
    television, about criminals that have hacked into people''s computers.


    Black hat hackers hackers who use their skills to commit crimes


    Malware Computer programs that do bad things to computers


    ![](img/0ef4c508568feec5ab50e93dadefb3a1_58_0.png)


    There are two main ways that a black hat hacker can access other people''s computers.
    Sometimes people have simple passwords that are easy to guess, or they are tricked
    into telling the black hat what their password is. Another way of accessing somebody''s
    computer is what is known as a zero-day exploit. A zero-day exploit is a mistake
    that a programmer has made in their code, and because they didn''t know about
    the mistake, theyve had zero days to fix it. Until the code is fixed, a zero-day
    exploit can be used by a hacker to cause havoc.


    # Hackers Experts at using a computer


    ![](img/0ef4c508568feec5ab50e93dadefb3a1_58_1.png)


    Many programmers proudly call themselves hackers. They don''t do anything illegal
    with computers, they just write code that is clever or unusual things.


    Other programmers are interested in writing code to break into computers or to
    take advantage of mistakes in other people''s programs so that they can take control
    of a computer.


    ![](img/0ef4c508568feec5ab50e93dadefb3a1_58_2.png)


    > Zero-day exploit Mistake in some software that the creator doesn''t know about
    and had zero days to fix


    These hackers fall into two different groups:


    # Black hat hackers


    # White hat hackers


    Black hat hackers use their skills to break the law. Sometimes they write programs
    to take control of other people''s computers or steal information from computers.
    Sometimes they write programs called malware that can stop your computer from
    working, or make it behave in strange ways like opening websites that you didn''t
    ask to be opened.


    White hat hackers have the same skills as black hat hackers but they don''t break
    the law. Instead, when white hat hackers find zero-day exploits, they tell the
    programmers who made the software, so that they can fix the mistakes in their
    code. This stops black hat hackers using the zero-day exploit in the future.


    Most companies will pay white hat hackers lots of'
- md: "\n## White hat hackers\nHackers who use their skills to protect people\n\n\
    ## AAA Games\n\nAAA Games are made by large companies. These are the games that\
    \ you see advertised on TV and that often sell millions of copies. AAA Games are\
    \ made by huge teams of people. There are programmers to write the code, artists\
    \ to make the 3D characters and scenery, writers to create the stories, musicians\
    \ to compose the music, designers to design the levels, and then other huge teams\
    \ in charge of advertising and selling the game.\n\n...money to find zero-day\
    \ exploits. There are even competitions for white hat hackers, with thousands\
    \ of pounds in prize money for the ones who find the most zero-day exploits. White\
    \ hat hackers are like the superheroes of the hacking world!\n\n## Indie and AAA\
    \ games programmers\n\nMany people first start learning to code because they want\
    \ to make computer games. Maybe that's why you are reading this book right now.\
    \ If you become a developer, you might want to make either Indie Games or AAA\
    \ Games.\n\nProgrammers that work for AAA games companies will often be in charge\
    \ of one very small element of a game. They might be experts in creating realistic\
    \ world, or creating the rules that decide how the non-player characters act,\
    \ or even something specific as to make flags flutter in the wind.\n\n## Indie\
    \ Games\n\nIndie games developers work on their own, or with a few friends, to\
    \ create their games. They do all the the themselves, from writing the code for\
    \ the game, to creating the graphics, and telling the story. Indie developers\
    \ do not work for any single company, so they are free to make whatever games\
    \ they like for consoles, tablets, phones or PCs.\n\nIf you become a programmer\
    \ you will be able to work on Free and Open Source Software (FOSS). These programs\
    \ are written by coders either on their own or with the help of lots of other\
    \ coders. Free Open Source Software is free for people to use, copy and share.\
    \ Best of all, you are also allowed to have a look through the code and to make\
    \ improvements to it.\n\nSome Indie games become extremely popular and can make\
    \ the developers a lot of money. Sometimes the developers will give away games\
    \ for free, because they care more about the art of making games. Indie developers\
    \ might also sell just a few games to their fans. Perhaps the most famous Indie\
    \ game of all time is Minecraft.\n\nFOSS is really important. Most of the websites\
    \ you visit on the Internet is sitting on servers that run on GNU/Linux.\n\nFree\
    \ and Open Source Software (FOSS) Computer programs that you are allowed to look\
    \ at, change and use share.\n\n## GNU/Linux\nFree and Open Source system used\
    \ on many computers around the world.\n\nThis is a FOSS group of operating systems\
    \ and it is improving every day by thousands of programmers from all over the\
    \ world. Do you or somebody in your family use an Android phone? That phone will\
    \ be running lots of FOSS. Do you use Firefox as your web browser? This is also\
    \ based on FOSS.\n\nLots of people help to make FOSS. Some people do it for fun,\
    \ others do it because they want to help the programming community, and others\
    \ do it as their job.\n\n## A secret key\n\nEncryption is a way of changing information\
    \ so that nobody else can read it unless they have the secret key.\n\nImagine\
    \ you wanted to send a message:\n**“Meet me at the park at three.”**\n\nbut you\
    \ didn't want anyone else to be able to read it.\n\n> Encryption: Disguising data\
    \ so that it is impossible to read without knowing how it has been disguised.\n\
    \nYou could use a simple method of encryption to disguise your message. For instance\
    \ you could use a key of 5 and then move each letter of your message forward 5\
    \ letters in the alphabet, as shown here:\n\nabcdefghijklmnopqrstuvwxyz\nfghijkluvwxyzabcdefc\n\
    \nSo:\n“Meet me at the park at three”\nwould become:\n“Rljyj rj fy ym ufw fy ymjjj”\n\
    \nIf your friend knows the key is 5 then they could easily **decrypt your message**\
    \ to read its real meaning!\n\nEncryption used today is much more complicated\
    \ than this method, which was originally used by Julius Caesar, the Roman Emperor,\
    \ to send messages to his generals.\n\n> Decrypt: Make encrypted data readable.\n\
    \nThis method, called the **Caesar cipher**, would be easy to decrypt, by trying\
    \ all twenty six keys, and seeing which key made sense of the message.\n\nProgrammers\
    \ now create methods of encrypting information that are so complicated, it is\
    \ impossible to crack them without the key. This is really important, especially\
    \ when you are using the Internet. When you send messages back and forth on the\
    \ Internet, it is really easy for another person (maybe a black hat) to see your\
    \ message. This could mean that someone could see what you were doing when you\
    \ were typing in your password, doing some shopping or using your bank. To stop\
    \ other people being able to read the messages your computer sends out over the\
    \ Internet, the information is fully encrypted.\n\n## Caesar Cipher\nWay of encrypting\
    \ words by replacing the letters with other letters.\n\nYou'll know if you are\
    \ using encryption on the Internet, because the bar at the top of your web browser\
    \ will say https:// instead of http://. You might also see a little padlock symbol\
    \ like this, which tells you that you are using encryption: \U0001F512 https:\n\
    \n- 1. Open up your text editor\n- 2. Type the following:\n```html\n<html>\n<body>\n\
    \  <p>This is a test.</p>\n</body>\n</html>\n```\n- 3. Save the file as index.html\n\
    - 4. Open the file in your browser.\n\n## What is Free and Open Source Software?\n\
    (Note: The text provided for this section seems to repeat or overlap in the OCR\
    \ source, following the structure established above.)\n"
  mdcn: "\n\n## 白帽黑客\n利用自己的技能保护他人的黑客\n\n## AAA Games\n\nAAA 游戏由大型公司制作。这些游戏是你在电视广告上看到的，并且通常售出数百万份。AAA\
    \ 游戏由庞大的团队制作。他们有程序员编写代码，艺术家制作 3D 角色和场景，剧作家创作故事，音乐家创作音乐，设计师设计关卡，以及其他负责游戏广告和销售的庞大团队。\n\
    \n……资金用于寻找零日漏洞。甚至为白帽黑客举办了竞赛，发现最多零日漏洞的人将获得数千英镑的奖金。白帽黑客就像是黑客世界的超级英雄！\n\n## 独立游戏与\
    \ AAA 程序员\n\n许多人开始学习编程是因为他们想制作电脑游戏。也许这就是你现在正在读这本书的原因。如果你成为一名开发者，你可能想制作独立游戏或 AAA\
    \ 游戏。\n\n在 AAA 公司工作的程序员通常负责游戏中的一个非常微小的元素。他们可能是创建真实世界的专家，或者是决定非玩家角色行为规则的制定者，甚至是实现让旗帜在风中飘扬的特定效果。\n\
    \n## 独立游戏\n\n独立游戏开发者通常独立工作，或与几个朋友一起创作他们的游戏。他们完成所有工作，从编写游戏代码、创建图形到讲述故事。独立开发者不为任何单一公司工作，因此他们可以自由地为主机、平板电脑、手机或\
    \ PC 制作任何他们喜欢的游戏。\n\n如果你成为一名程序员，你将能够从事自由开源软件（FOSS）。这些程序由程序员独立编写或在许多其他程序员的帮助下编写。自由开源软件供人们使用、复制和分享。最棒的是，你被允许查看代码并进行改进。\n\
    \n一些独立游戏变得非常受欢迎，并能为开发者带来大量资金。有时开发者会免费提供游戏，因为他们更注重制作游戏的艺术。独立开发者可能只会向他们的粉丝出售几款游戏。也许史上最著名的独立游戏是《我的世界》（Minecraft）。\n\
    \nFOSS 真的非常重要。你在网上访问的大多数网站都运行在运行 GNU/Linux 服务器上。\n\n自由开源软件（FOSS）：允许人们查看、更改和使用共享的计算机程序。\n\
    \n## GNU/Linux\n世界上许多计算机上使用的自由开源系统。\n\n这是一个 FOSS 操作系统组，每天都有全球成千上万的程序员对其进行改进。你或你的家人使用\
    \ Android 手机吗？那部手机运行着许多 FOSS。你使用 Firefox 作为网络浏览器吗？这也是基于 FOSS 的。\n\n许多人帮助制作 FOSS。有些人是因为兴趣，另一些人是因为想帮助编程社区，而还有人将其作为他们的工作。\n\
    \n## 秘密密钥\n\n加密是改变信息的方法，除非他们拥有秘密密钥，否则其他人无法读取它。\n\n想象你想发送一条消息：\n**“下午三点在公园见我。”**\n\
    \n但你不想让其他人看到它。\n\n> 加密：伪装数据，使其在不知道如何被伪装的情况下无法读取。\n\n你可以使用一种简单的加密方法来伪装你的消息。例如，你可以使用\
    \ 5 作为密钥，然后将消息中的每个字母在字母表中向前移动 5 个字母，如下所示：\n\nabcdefghijklmnopqrstuvwxyz\nfghijkluvwxyzabcdefc\n\
    \n所以：\n“Meet me at the park at three”\n将变成：\n“Rljyj rj fy ym ufw fy ymjjj”\n\n\
    如果你的朋友知道密钥是 5，他们就可以轻松地**解密你的消息**并读取真实含义！\n\n今天使用的加密比这种方法要复杂得多，这种方法最初被罗马皇帝凯撒用于向他的将军发送消息。\n\
    \n> 解密：使加密数据变得可读。\n\n这种被称为**凯撒密码**（Caesar cipher）的方法很容易解密，只需尝试所有二十六个密钥，并查看哪个密钥让消息变得合理。\n\
    \n程序员现在创建的信息加密方法非常复杂，在没有密钥的情况下是不可能破解的。这非常重要，尤其是当你使用互联网时。当你在互联网上来回发送消息时，其他人（可能是黑帽）看到你的消息非常容易。这意味着有人可能会看到你在输入密码、购物或使用银行账户时所做。为了防止他人读取你的计算机通过互联网发出的消息，这些信息经过了完全加密。\n\
    \n## 凯撒密码\n通过将字母替换为其他字母来加密单词的方法。\n\n你会知道自己是否在互联网上使用加密，因为你网络浏览器顶部的栏会显示 https://\
    \ 而不是 http://。你可能还会看到像这样的一个小锁头符号，它告诉你你正在使用加密：\U0001F512 https:\n\n- 1. 打开你的文本编辑器\n\
    - 2. 输入以下内容：\n```html\n<html>\n<body>\n  <p>This is a test.</p>\n</body>\n</html>\n\
    ```\n- 3. 将文件保存为 index.html\n- 4. 在浏览器中打开该文件。\n\n## 什么是自由开源软件？\n（注：此部分提供的文本似乎在\
    \ OCR 来源中重复或重叠，遵循了上述建立的结构。）\n\n"
