    # Saving your turtle


    +   1. We have been writing all our commands in the shell until now. This is easy
    to do, but it means we lose all the fun pictures we have made when we close IDLE.


    +   2. We can save our code, if we stop writing in the shell and use files instead.


    +   3. In IDLE click on ''File'' and then ''New File''.


    ```

    File Edit Debug

