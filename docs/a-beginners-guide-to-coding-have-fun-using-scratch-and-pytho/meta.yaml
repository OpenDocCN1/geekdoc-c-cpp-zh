  md: '# # A guide to this book


    # ## What will I learn?


    In the next few chapters you will learn how to use two different programming languages.
    The first language is called **Scratch** and the second is called **Python**.
    You will be able to complete exciting projects in each of the languages, with
    plenty of help to guide you as you learn to **program**.


    Scratch Programming language created for children that uses blocks of code which
    can be connected together to make programs


    Python Programming language based on typing text which is designed to be simple
    to learn and use


    ![](img/0ef4c508568feec5ab50e93dadefb3a1_5_0.png)


    It is very important to check with an adult before downloading anything onto your
    computer. This helps to keep you safe on the internet, and will also keep your
    computer healthy!


    Program Design and write code


    # ## How to use the tutorials


    Learning to code is all about practising and experimenting. Follow each of the
    tutorials carefully, and make sure you read the instructions as well as looking
    at the picture guides.


    Most importantly, once you have finished a tutorial, play around with your code.
    Try changing and adding extra bits, and don''t worry if you break your code! All
    the best **programmers** in the world make mistakes, but fixing those mistakes
    (called **debugging**) is the best way to learn.


    There''s even famous quote about coding and making mistakes, by Mark Zuckerberg
    – the man who created Facebook.


    **Programmer** Person who designs and writes code


    > "Move fast and break things. Unless you are breaking things, you are not moving
    fast enough."


    **Debugging** Testing code to find and fix mistakes'
  merge: -1
  pgno: 5
- img_proc: true
  md: '# # What is coding?


    # What are computers?


    Computers are all around us. There are probably lots of computers in your house,
    you might not realise how many! Do you or your family have a laptop? Of course,
    that is a computer. But what about a mobile phone? Did you know that a mobile
    is a computer too? There''s a computer in your television, your microwave and
    your car. Sometimes we use computers that are hundreds, or thousands, of miles
    away. When you use the Internet, the computer (called a server) that stores the
    web page you are looking at could be in a completely different country to you.


    Computers are machines that can work out the answers to very maths problems. For
    instance, computers can add and subtract numbers, or they can tell whether two
    numbers are the same or not. They can do maths very quickly. If you tried to count
    to a million, it would probably take you over a week. A computer can count to
    a million in less than a second.


    Being able to do maths quickly is impressive but the thing that makes computers
    really special is that they can follow instructions. These instructions are called
    programs. Computers can follow these instructions and do extremely clever things,
    like moving monsters around the screen in a computer game, or flying a real aeroplane
    to take you on holiday.


    Without programs, a computer is completely useless. What actually makes computers
    so special is the programs that are written for them.


    ![](img/0ef4c508568feec5ab50e93dadefb3a1_6_0.png)


    > Programs

    Collections of instructions that a computer follows to perform a task'
  merge: -1
  pgno: 6
