- md: "\n## Running it all together\n\n- 1. Now that we have two custom blocks we\
    \ can join them so that they run, one after the other, without having to click\
    \ on them every time.\n- 2. From Events drag the when block onto the Script Area.\n\
    - 3. From More Blocks you can now attach your two custom blocks to the bottom\
    \ of it.\n- 4. Now click the flag at the top of the stage to see your program\
    \ working.\n- 5. Well done: you've created your first computer program! You're\
    \ well on your way to being an awesome coder.\n\n![](img/0ef4c508568feec5ab50e93dadefb3a1_17_0.png)\n\
    \n## Talking back\n\n- 1. We can make the sprite different things when it is given\
    \ different answers.\n- 2. Create a new custom block and call it askAge\n- 3.\
    \ Now use the block, but change it so that it asks, \"How are you?”\n- 4. Next\
    \ we need a new variable called playerAge. As we did before, click on Make a Variable\
    \ in Data and type in \"playerAge\". Then add the set variable in block to your\
    \ script. If you get mixed up with the different variable names, you can choose\
    \ the correct one by clicking the little black arrow. Next drag into the block.\
    \ It should look like this when you are ready:\n- 5. We are now going to make\
    \ the sprite different things, depending on the player's age. To do this we need\
    \ this block: You can find it in the Control menu of the Block Palette. Drag it\
    \ to the bottom of your custom block.\n\n![](img/0ef4c508568feec5ab50e93dadefb3a1_17_1.png)\n\
    - 6. In the Operators section of the Block Palette find the < and place it into\
    \ the block:\n  if <playerAge < 10> then then it must be less than, and we can\
    \ add a different response.\n\n![](img/0ef4c508568feec5ab50e93dadefb3a1_18_0.png)\n\
    - 7. Think of an age you want your sprite to be. We can add this into the block\
    \ with the playerAge , as well using a say Hello! for 2 secs block. See if you\
    \ can use these blocks to make this finished script:\n\n![](img/0ef4c508568feec5ab50e93dadefb3a1_18_1.png)\n\
    - 10. Finish off by adding your block (from More Blocks ) to the bottom of the\
    \ block:\n\n![](img/0ef4c508568feec5ab50e93dadefb3a1_18_2.png)\n![](img/0ef4c508568feec5ab50e93dadefb3a1_18_3.png)\n\
    - 8. We can finish this off using another block: Drag to the bottom of your custom\
    \ block, so it sits inside the 'else' you used before.\n\n![](img/0ef4c508568feec5ab50e93dadefb3a1_18_4.png)\n\
    - 11. Run your program by clicking on the flag and have a short conversation with\
    \ your animal sprite!\n\n## Can you take a challenge?\n\n- Try and create a new\
    \ custom block to ask another question, for example:\nWhat's your favourite food?\n\
    - You could make your sprite give different responses depending on the player's\
    \ answer.\n- See if you can add in a second sprite that could join in the conversation.\n\
    \n![](img/0ef4c508568feec5ab50e93dadefb3a1_18_5.png)\n- 9. We can use the block\
    \ to see if the playerAge is greater than the age you chose, and to make the sprite\
    \ say something. If the age is not equal to or not greater than the number you\
    \ chose.\n\n## Painting pictures in SCRATCH\n\nCan you guess how this picture\
    \ was made?\n\n![](img/0ef4c508568feec5ab50e93dadefb3a1_19_0.png)\n\nIt was created\
    \ using a computer and some clever mathematics! It is called a fractal and if\
    \ you look online you will find lots of examples of them. Fractals are amazing\
    \ pictures created using repeating patterns.\n\nIn this project you are going\
    \ to use Scratch to create some pictures of your own.\n\n## Basic drawing\n\n\
    - 1. First, you should create a new Scratch project and delete the cat sprite,\
    \ like you did in the last project.\n- 2. Next, choose a new sprite from the library.\
    \ This time, choose an arrow, as it makes it easy to see which way it is pointing.\n\
    \n![](img/0ef4c508568feec5ab50e93dadefb3a1_19_1.png)\n- 3. Now you need to make\
    \ a custom block (remember, we can find this in More Blocks). Call it drawLine\n\
    - 4. In the Block Palette click on Pen\n- 5. Select pen block from the Block Palette\
    \ and drag it onto the Script Area, then add it to the bottom of custom block.\n\
    - 6. We need to move the sprite so that we can draw a line. From move 10 steps\
    \ block onto the Script Area and connect it to the bottom of pen. Change 10 to\
    \ 100. Then add pen to the end.\n- 7. Your block should look like this:\n- 8.\
    \ Now, when you click the custom block, you should see the arrow move and leave\
    \ a line behind.\n- 9. We need to clear the Stage and put the arrow back to the\
    \ middle. Create a new custom block and call it reset\n- 10. To the bottom of\
    \ the block, add go to x y from Motion section of the Block Palette, and then\
    \ clear from Pen. When you click your new reset block, it should clear the screen\
    \ and reset the arrow to the middle.\n- 11. Script Area should now look like this:\n\
    - 12. Each time you click the block, the line will vanish and the arrow will go\
    \ back to the middle. Every time you click on the block, a new line will be drawn.\n\
    \n![](img/0ef4c508568feec5ab50e93dadefb3a1_20_0.png)\n\n## Drawing shapes\n\n\
    - 1. Lines on their own aren't very exciting, but they can be used to make lots\
    \ of other shapes if we use an algorithm.\n- 2. Create a new custom block called\
    \ `drawShape`\n- 3. To draw a square we need to draw a line 4 times, and turn\
    \ ninety degrees after each line has been drawn. Try and build this script:\n\
    ```\ndefine drawShape\ndrawLine\nturn 90 degrees\ndrawLine\nturn 90 degrees\n\
    drawLine\nturn 90 degrees\ndrawLine\nturn 90 degrees\n```\n```\ndefine drawShape\n\
    repeat 4\ndrawLine\nturn 90 degrees\n```\n- 4. Click on the block you will see\
    \ a square has been drawn on the stage.\n- 5. If we want to draw a different shape,\
    \ like an octagon, it would take a lot of clicking and dragging to build up script.\n\
    - 6. We can use a loop to make our job a little easier. Click on `Control` in\
    \ the Block Palette and find the repeat block.\n- 7. Anything placed inside this\
    \ block will happen 10 times. That's too much for us, so change the 10 to a 4.\
    \ Then you need to change your `drawShape` custom block so that it looks like\
    \ this:\n- Algorithm: Set of simple steps to solve a problem. The problem could\
    \ be crossing a road safely, in which case the algorithm would look like this:\n\
    1. Look left\n2. Look right.\n3. Look left again.\n4. If there are no cars coming.\n\
    5. Cross the road.\n- 8. Click your block and your square will be drawn.\n\n![](img/0ef4c508568feec5ab50e93dadefb3a1_21_0.png)\n\
    ![](img/0ef4c508568feec5ab50e93dadefb3a1_21_1.png)\n![](img/0ef4c508568feec5ab50e93dadefb3a1_21_2.png)\n\
    \n## More complicated shapes\n\nWouldn't it be better if we could draw more than\
    \ just a square with the `drawShape` custom block? Well with `input` we can!\n\
    \n- 1. Hold down the 'shift' key on your keyboard and click on your `drawShape`\
    \ block and a menu will pop up.\n- 2. Choose 'edit':\n\n![](img/0ef4c508568feec5ab50e93dadefb3a1_22_0.png)\n\
    - 3. Click on the little arrow next to the word 'Options' and a menu will appear.\
    \ Choose 'Add number input':\n- 4. Type in the word 'sides' in the space next\
    \ to drawShape.\n- 5. Your custom block will now look like this:\n\n![](img/0ef4c508568feec5ab50e93dadefb3a1_22_1.png)\n\
    - 6. You can also use the `sides` variable in the rest of the script. Drag `sides`\
    \ so that it replaces the number 4.\n\n![](img/0ef4c508568feec5ab50e93dadefb3a1_22_2.png)\n\
    - 7. Now we need to change the number of degrees for the sprite turns. We turned\
    \ by 90 degrees for a square, because each corner in a square has a 90 degree\
    \ angle. We can work this out: there are 360 degrees in a whole turn. When we\
    \ divide 360 by 4 (because there are 4 corners, and so square), we get 90. This\
    \ time we are going to use Operators to work out the degrees our sprite must turn\
    \ to draw a different shape.\n\n## More complicated shapes\n\nHow about something\
    \ a more complicated? Let's draw a flower. You're not going to get as much help\
    \ finding the blocks in this one, as you should be turning into an expert by now!\n\
    \n- 1. First we'll need to draw a petal. Use what you have learned to create the\
    \ custom block shown here:\n- 2. Now grab the petal from Blocks and place it in\
    \ the Script Area. You can change the number to set the size of the petal and\
    \ then click it to draw. Just click on:\n- 3. If you want to clear the screen.\
    \ Clicking on your block won't work now, because you need to tell it how many\
    \ sides to draw. More Blocks drag into the Script Area.\n- 4. Change the 1 to\
    \ a 6 and then click. See what happens and then try some other numbers.\n- 8.\
    \ Alter your custom block so it looks like this:\n\n![](img/0ef4c508568feec5ab50e93dadefb3a1_23_0.png)\n\
    ![](img/0ef4c508568feec5ab50e93dadefb3a1_23_1.png)\n![](img/0ef4c508568feec5ab50e93dadefb3a1_23_2.png)\n\
    ![](img/0ef4c508568feec5ab50e93dadefb3a1_23_3.png)\n\nIf you want to clear the\
    \ screen.\n"
  mdcn: "\n\n## 将它们整合运行起来\n\n- 1. 现在我们有两个自定义模块了，我们可以将它们连接起来，让它们按顺序运行，而无需每次都点击它们。\n\
    - 2. 从“事件”（Events）面板将 `when` 模块拖动到“脚本区域”（Script Area）。\n- 3. 从“更多积木”（More Blocks）中，你现在可以将你的两个自定义模块附加到它的底部。\n\
    - 4. 现在点击舞台上顶部的旗帜图标，查看你的程序运行情况。\n- 5. 干得好：你创建了你的第一个计算机程序！你已经在成为一名优秀程序员的道路上了。\n\
    \n![](img/0ef4c508568feec5ab50e93dadefb3a1_17_0.png)\n\n## 互动对话\n\n- 1. 我们可以让角色在收到不同答案时表现出不同的状态。\n\
    - 2. 创建一个新的自定义模块，并将其命名为 `askAge`。\n- 3. 现在使用该模块，但修改它让它询问：“你好吗？”\n- 4. 接下来我们需要一个名为\
    \ `playerAge` 的新变量。像之前做的那样，在“数据”（Data）中点击“建立变量”并输入“playerAge”。然后将“设置变量”积木添加到你的脚本中。如果你混淆了不同的变量名，可以通过点击小黑箭头来选择正确的那个。接着将其拖入模块中。当你准备好时，它看起来应该是这样的：\n\
    - 5. 我们现在将根据玩家的年龄让角色表现得不同。为了做到这一点，我们需要这个模块：你可以在积木面板的“控制”（Control）菜单中找到它。将其拖到你自定义模块的底部。\n\
    \n![](img/0ef4c508568feec5ab50e93dadefb3a1_17_1.png)\n- 6. 在积木面板的“运算符”（Operators）部分找到\
    \ `<`，并将其放入模块中：\n  `if <playerAge < 10> then`，这表示小于，我们可以添加不同的响应。\n\n![](img/0ef4c508568feec5ab50e93dadefb3a1_18_0.png)\n\
    - 7. 想一个你想让角色处于的年龄。我们可以通过 `playerAge` 积木将其添加到模块中，并使用 `say Hello! for 2 secs` 模块。看看你是否能使用这些积木完成这个脚本：\n\
    \n![](img/0ef4c508568feec5ab50e93dadefb3a1_18_1.png)\n- 10. 最后通过将你的模块（来自“更多积木”）添加到该模块的底部来完成：\n\
    \n![](img/0ef4c508568feec5ab50e93dadefb3a1_18_2.png)\n![](img/0ef4c508568feec5ab50e93dadefb3a1_18_3.png)\n\
    - 8. 我们可以使用另一个积木来完成它：将其拖到你自定义模块的底部，使其位于你之前使用的 `else` 分支内。\n\n![](img/0ef4c508568feec5ab50e93dadefb3a1_18_4.png)\n\
    - 11. 点击旗帜运行你的程序，与你的动物角色进行简短对话吧！\n\n## 你能接受挑战吗？\n\n- 尝试创建一个新的自定义模块来询问另一个问题，例如：\n\
    你最喜欢的食物是什么？\n- 你可以让你角色根据玩家的回答给出不同的响应。\n- 看看你是否可以添加第二个角色来加入对话。\n\n![](img/0ef4c508568feec5ab50e93dadefb3a1_18_5.png)\n\
    - 9. 我们可以使用该积木查看 `playerAge` 是否大于你选择的年龄，并让角色说些什么。如果年龄不等于或不大于你选择的数字。\n\n## 在 SCRATCH\
    \ 中画画\n\n你能猜到这张图是怎么做出来的的吗？\n\n![](img/0ef4c508568feec5ab50e93dadefb3a1_19_0.png)\n\
    \n它是利用计算机和一些巧妙的数学创建的！它被称为分形（fractal），如果你在网上搜索，你会发现很多它的例子。分形是使用重复图案创建的惊人图片。\n\n\
    在这个项目中，你将使用 Scratch 创建一些你自己的画。\n\n## 基础绘画\n\n- 1. 首先，你应该创建一个新的 Scratch 项目并删除猫角色，就像你在上一个项目中做的那样。\n\
    - 2. 接下来，从库中选择新角色。这次选择一个箭头，因为它很容易看清它的指向方向。\n\n![](img/0ef4c508568feec5ab50e93dadefb3a1_19_1.png)\n\
    - 3. 现在你需要创建一个自定义模块（记得，我们可以在“更多积木”中找到它）。将其命名为 `drawLine`。\n- 4. 在积木面板中点击“画笔”（Pen）。\n\
    - 5. 从积木面板选择画笔积木并将其拖到脚本区域，然后将其添加到自定义模块的底部。\n- 6. 我们需要移动角色以便画一条线。将 `move 10 steps`\
    \ 积木拖到脚本区域并将其连接到画笔积木的底部。将 10 改为 100。然后在最后添加画笔。\n- 7. 你的模块看起来应该是这样的：\n- 8. 现在，当你点击积木时，你应该看到箭头移动并留下一条线。\n\
    - 9. 我们需要清除（clear）并将箭头移回中间。创建一个新的自定义模块并命名为 `reset`。\n- 10. 在模块底部添加“运动”（Motion）面板中的\
    \ `go to x y`，然后添加 `clear`。当你点击这个 reset 模块时，它应该清除屏幕并将箭头重置到中间。\n- 11. 脚本区域现在应该是：\n\
    - 12. 每当你点击积木，线条就会消失，箭头会回到中间。每当你点击积木，都会画出新的线。\n\n![](img/0ef4c508568feec5ab50e93dadefb3a1_20_0.png)\n\
    \n## 画形状\n\n- 1. 线本身并不有趣，如果我们使用算法，就可以用来画许多其他形状。\n- 2. 创建一个名为 `drawShape` 的自定义模块。\n\
    - 3. 为了画正方形，我们需要画 4 次线，并在每条线后旋转 90 度。尝试构建这个脚本：\n```\ndefine drawShape\ndrawLine\n\
    turn 90 degrees\ndrawLine\nturn 90 degrees\ndrawLine\nturn 90 degrees\ndrawLine\n\
    turn 90 degrees\n```\n```\ndefine drawShape\nrepeat 4\ndrawLine\nturn 90 degrees\n\
    ```\n- 4. 点击积木，你会看到舞台上画了一个正方形。\n- 5. 如果我们画不同的形状，比如八边形，就需要大量的点击和拖拽。\n- 6. 我们可以使用循环来让工作变得更容易。点击积木面板中的“控制”（Control）找到\
    \ `repeat` 模块。\n- 7. 放在这个积木中的任何内容都会执行 10 次。这对我们来说太多了，所以将 10 改为 4。然后修改你的 `drawShape`\
    \ 模块使其看起来像这样：\n- 算法：解决问题的简单步骤。这个问题可能是安全地过马路，在这种情况下算法如下：\n1. 向左看。\n2. 向右看。\n3.\
    \ 再次向左看。\n4. 如果没有车来。\n5. 过马路。\n- 8. 点击你的积木，正方形就会被画出来。\n\n![](img/0ef4c508568feec5ab50e93dadefb3a1_21_0.png)\n\
    ![](img/0ef4c508568feec5ab50e93dadefb3a1_21_1.png)\n![](img/0ef4c508568feec5ab50e93dadefb3a1_21_2.png)\n\
    \n## 更复杂的形状\n\n如果我们可以用 `drawShape` 自定义模块画不仅仅正方形，不是更好吗？有了“输入”（input），我们可以做到！\n\n\
    - 1. 按住键盘上的 'shift' 键并点击你的 `drawShape` 模块，弹出一个菜单。\n- 2. 选择“编辑”（edit）：\n\n![](img/0ef4c508568feec5ab50e93dadefb3a1_22_0.png)\n\
    - 3. 点击“选项”（Options）旁的小箭头，会出现菜单。选择“添加数字输入”（Add number input）：\n- 4. 在 `drawShape`\
    \ 旁边的空间输入单词 \"sides\"。\n- 5. 你的自定义模块现在看起来像这样：\n\n![](img/0ef4c508568feec5ab50e93dadefb3a1_22_1.png)\n\
    - 6. 你也可以在脚本的其他部分使用 `sides` 变量。将 `sides` 替换数字 4。\n\n![](img/0ef4c508568feec5ab50e93dadefb3a1_22_2.png)\n\
    - 7. 现在我们需要更改角色旋转的角度。我们画正方形时旋转了 90 度，是因为正方形的每个角都是 90 度。我们可以这样计算：一整圈是 360 度。当我们用\
    \ 360 除以 4（因为有 4 个角，所以是正方形），得到 90。这次我们将使用“运算符”（Operators）来计算角色必须旋转的角度以画出不同的形状。\n\
    \n## 更复杂的形状\n\n再复杂一点的怎么样？让我们画一朵花。在这个项目中你不会得到太多寻找积木的帮助，因为到那时你应该已经成为一名专家了！\n\n-\
    \ 1. 首先我们需要画一个花瓣。使用你所学到的知识创建这里所示自定义模块：\n- 2. 现在从积木中获取花瓣（petal）并将其放在脚本区域。你可以更改数字来设置花瓣的大小，然后点击它进行绘制。只需点击：\n\
    - 3. 如果你想清除屏幕。现在点击你的模块将不起作用，因为你需要告诉它要画几条边。将“更多积木”拖入脚本区域。\n- 4. 将 1 改为 6 然后点击。看看发生了什么，然后尝试其他数字。\n\
    - 8. 修改你的自定义模块使其看起来像这样：\n\n![](img/0ef4c508568feec5ab50e93dadefb3a1_23_0.png)\n\
    ![](img/0ef4c508568feec5ab50e93dadefb3a1_23_1.png)\n![](img/0ef4c508568feec5ab50e93dadefb3a1_23_2.png)\n\
    ![](img/0ef4c508568feec5ab50e93dadefb3a1_23_3.png)\n\nIf you want to clear the\
    \ screen.\n\n"
