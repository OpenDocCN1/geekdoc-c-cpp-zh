  - '[PAGE 47]


    # A note on shortcuts


    It''s easier to use shortcut keys than always using the menus in files.

    To save a file on Windows just hold down the ''ctrl'' key and press the ''s''
    key once.

    To save a file on a Mac just hold down the ''cmd'' key and press the ''s'' key
    once.

    To run a file on Windows you can press ''FS'' key at the top of the keyboard.

    On a Mac you can press ''FS'' as well, but you may need to

    hold the ''Fn'' key at the same time.


    +   8. Now let''s try something fancy! Add in some more lines, so your code looks
    like this:


    ```

    from turtle import *

    shape("turtle")

    for move in range(6):

    fd(50)

    lt(360/6)

    ```


    +   9. Save your code and run it.


    +   10. Do you see a hexagon being drawn? If not, check your code and try again.


    +   11. You''ve just made your first loop in Python. The word ''for'' for the
    loop. The phrase ''in range (b)'' makes the loop repeat six times.


    Loop Instructions that are followed more than once. It''s easier to writing out
    your code lots of times. You can use a ''for'' loop to repeat some code a certain
    number of times or a ''while'' loop to keep repeating the code until something
    happens, such as changing to a variable number.


    +   12. Let''s try a different shape. Change your code so it looks like this:


    ```

    from turtle import *

    shape("turtle")

    for move in range(5):

    fd(50)

    lt(360/5)

    ```


    > A note on colons and spaces

    The line of code that starts a loop must always end with a colon '':''


    All of the lines underneath it will start with 4 spaces. IDLE puts these in for
    you, but if you delete them you can put them back.


    When you have finished writing the loop, remember to stop using 4 spaces at the
    start of the lines.


    +   13. Can you see how the numbers in the code change the number of sides of
    the shape? An octagon has 8 sides. Try changing the numbers in your code to make
    an octagon.


