    7. Now we need to change the number of degrees for the sprite turns. We turned
    by 90 degrees for a square, because each corner in a square has a 90 degree angle.
    We can work this out: there are 360 degrees in a whole turn. When we divide 360
    by 4 (because there are 4 corners, and so 4 angles, in square), we get 90. This
    time we are going to use / Operators to work out the degrees our sprite must turn
    to draw a different shape.


