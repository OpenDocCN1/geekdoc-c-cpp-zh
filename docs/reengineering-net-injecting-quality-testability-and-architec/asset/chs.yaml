  \ }\n}\n```\n\n* * *\n\n这个单元测试看起来要复杂得多，但这具有欺骗性。让我们逐部分地来看它。\n\n\n\n\n第一个更改是在 `ClassInitialize`\
  \ 方法中用于创建并运行一个 `BootStrapper`。现在，为了正确设置 `ServiceLocator` 并注册系统中的所有服务，这是必须的。这里需要注意的是，通过运行\
  \ `BootStrapper`，测试将尽可能地模拟生产环境的的设置。如果业务逻辑在处理过程中使用了任何其他服务，它们在运行 `BootStrapper` 时就已经被注册了。这意味着，每当向应用程序中引入新服务时，我们都不需要访问每个测试并添加相应的服务注册；它们会自动包含在\
  \ `BootStrapper` 中。\n\n由于 `BootStrapper` 注册所有实时服务的方式就像应用程序正在真实运行，而不是在测试下运行，因此我们必须在依赖注入容器中替换其中一些服务，以防止它们干扰测试。`DialogService`\
  \ 就是必须替换的服务之一，以确保它不会在屏幕上显示需要用户响应的消息。为了实现这一点，我们创建了 `IDialogService` 的 mock（模拟对象），并如\
  \ `Setup` 方法所示，将其注册到我们的依赖注入容器中。\n\n### Note\n\n请注意，在 Unity 中重新注册服务会替换之前的注册。如果你使用不同的依赖注入容器，应该验证它的行为是否相似，或者更新代码以用\
  \ mock 替换真实的 `DialogService`。\n\n现在我们准备好重新检查每个测试并添加必要的断言逻辑了。由于我们使用 MOQ，我们可以通过 `Verify`\
  \ 调用来验证服务上的特定方法是否被调用，这是之前每个测试的最后一行。这确保了在正确的日期范围内，`Show` 方法从未被调用；或者在日期不正确时，恰好被调用了一次。\n\
  \n如果你仔细检查代码，可能会发现，在 `TestInitialize` 方法而不是 `ClassInitialize` 中创建 mock 似乎是浪费资源。在\
  \ `ClassInitialize` 中为所有测试只创建一次 mock 似乎可以满足每个测试的需求。事实确实如此；然而，它引入了一个难以发现的细微缺陷。MOQ\
  \ 没有提供用于重置每个方法调用次数计数器的方法，因此每次对 `Times.Never()` 的测试都会检查该方法自 mock 创建以来是否曾被调用过。根据测试运行的顺序，这些断言可能会成功也可能失败，取决于另一个测试是否改变了该方法被调用的次数。通过在\
  \ `TestInitialize` 而不是 `ClassInitialize` 方法中创建 `Mock`，为每个测试都会创建一个新的 mock，这样我们就不会陷入这种问题中。\n\
  \n### 针对 DialogService 的重构\n\n我们选择 `DialogService` 作为第一个实现的服务有两个原因。首先，这种重构没有引入任何逻辑变化。只要你的遗留应用程序仍在显示信息消息，你就可以用该服务替换该调用，而无需进行其他更改。如果你的遗留应用程序在消息显示周围封装了某些业务逻辑，你可以通过添加额外方法将相同的逻辑移动到\
  \ `DialogService` 中。核心点是，引入 `DialogService` 对业务逻辑的影响微乎其微或没有影响。\n\n优先引入此服务的第二个原因是，我们需要重构的地方很容易识别。通常只需简单地在代码中搜索\
  \ `MessageBox.Show,`，你就能找到大多数需要实现 `DialogService` 的地方。在某些系统中，已经有一个实现与 `DialogService`\
  \ 相同理念的工具类，它提供了一个调用者可以使用的显示消息的方法。如果是这样，这些方法在遗留代码中也容易识别和定位。\n\n如果你确实遇到了一个提供与 `DialogService`\
  \ 相同服务的工具类，可能会想将这个现有的类注册到你的依赖注入容器并用它替换。只要该工具类遵循服务规则，就地转换应该节省一些时间。然而，这些工具类通常具有广泛的职责，并不符合我们对服务的定义。\n\
  \n其他可能阻止现有类转换为服务的因素是静态属性。静态属性无法被 Moq 模拟，因此，为包含这些属性的类创建服务意义不大。此外，现有类不太可能位于正确的项目中。保持项目结构的整洁至关重要，特别是对于大型项目，因此将一个类留在错误的地方可能会在以后引起引用问题。如果你决定就地转换一个类而不是用新的\
  \ `DialogService` 替换，请记住这一点。\n\n尽管这种重构在技术上没有挑战性，但它通常非常耗时。获取此任务时间估计的良好方法是进行文本搜索 `MessageBox.Show`（或相应的工具方法），并为每处出现分配大约\
  \ 10 分钟。对于一个看似简单的搜索和替换来说，这可能看起来过头了，但由于这是我们在整个系统中使用的第一个服务，你可能需要添加项目引用来使用 Interfaces\
  \ 和 Infrastructure 项目。你还需要留出时间测试更改，尽管对于如此小型的重构，测试工作量不应该很大。\n\n### Note\n\n技术上简单但耗时的重构工作，是初级开发者或正在熟悉代码的新开发者执行绝佳任务。\n\
  \n### 添加单元测试\n\n通过重构添加对 `DialogService` 的调用可以解耦某些遗留方法，足以为它们创建单元测试。现在是开始创建单元测试类并为添加了\
  \ `DialogService` 用的更新方法添加测试的好机会了。现在这样做可能会产生许多新的测试项目和测试类，创建这些基础设施可能是耗时的。如果你选择这种方案（我们非常建议你这样做），请务必增加你的时间估计。\n\
  \n在重构以使用此服务时，你会遇到使用不同签名的 `MessageBox.Show` 调用。目前，最简单的方法是将不同的签名直接添加到你的 `DialogService`\
  \ 中，并保留遗留代码的基本逻辑。同时重构代码以使用现有的 `DialogService` 方法签名很有诱惑力；但这通常是一场徒劳的战斗。你可能会在整个项目中多次进行相同的重构，花费宝贵的时间却收益极小。\n\
  \n针对 `DialogService` 的重构通常是一个两个阶段的任务。首先，通过将遗留代码中的签名复制到你的服务中来进行重构。这可能会创建许多几乎相同的不同签名。当完全完成并提交代码后，使用你的重构工具统计对话框服务每个签名的使用次数。如果某些签名只有几次引用，你可以通过重构这些签名来简化服务。\n\
  \n#### 使用 LogWriterService\n\n除了 `DialogService` 之外，`LogWriterService` 也是最早引入的服务之一。该服务负责写入你想要维护的任何日志文件。你可以添加逻辑来判断日志情况（在调试代码还是生产代码中），并写入平面文件、数据库表或你选择的任何地方。这个基础组件通常在调用\
  \ `DialogService` 之前使用，用于记录错误以及你即将通知用户这一事实。该服务对于调试仅在现场发生的问题至关重要。\n\n\n\n使用 `LogWriterService`\
  \ 而不是直接写入日志文件，可以将写入日志的代码集中化，从而更容易向日志写入器添加功能，并允许在测试时用一个“什么都不做”的日志写入器进行替换。通过将测试中的\
  \ `LogWriterService` 替换为 `ILogWriterService` 的模拟对象（mock），后者只需丢弃写入日志的尝试，这样单元测试就不会对本地驱动器产生影响。\n\
  \n实现 `LogWriterService` 与实现 `DialogService` 的模式类似；尽管在遗留系统中，你也会发现一个专门写入日志的独立类。如果该类运行良好且不需要更改（即它具有单一职责，且没有与其他类发生紧密耦合），你就可以为它提取一个接口，将其注册到你的依赖注入容器中，并像以前一样使用它（在将其移动到正确的项目之后）。这些遗留的日志写入类有时是静态的，或者具有静态变量。通过将它们作为单例注册到\
  \ Unity 中，就不需要将它们设为静态，因此应该移除这些修饰符。\n\n如果还没有日志写入类，你可以使用 Listing 11.7 中的那个，它利用某些 .NET\
  \ 函数通过为每条日志消息添加堆栈帧（stack frame）来使日志更有意义。这是一个写入文本文件的简单记录器，但你可以按照选择的任何方式对其进行增强。\n\n\
  #### Listing 11.7. 示例错误记录器\n\n点击此处查看代码图像\n\n***\n\n```csharp\nusing System;\nusing\
  \ System.Diagnostics;\nusing System.IO;\nusing System.Windows.Forms;\nusing Microsoft.Practices.Prism.Logging;\n\
  \nnamespace CodeSamples.Ch11_RefactorToBasicServices.Listing07\n{\n  /// <summary>\n\
  \  /// Logger 实现。\n  /// 此类应该放在 Services 项目中。\n  /// </summary>\n  public class\
  \ Logger : ILogger\n  {\n    private string _logFilePath;\n    /// <summary>\n \
  \   /// 构造函数 - 将日志文件的位置初始化\n    /// 与应用程序运行相同的文件夹。\n    /// </summary>\n    public\
  \ Logger()\n    {\n      _logFilePath = Path.GetDirectoryName(Application.ExecutablePath)\n\
  \          + \"\\\\MyLogFile.log\";\n    }\n    /// <summary>\n    /// 向日志文件记录消息。\n\
  \    /// </summary>\n    public void Log(string format, params object[] arg)\n \
  \   {\n      Log(String.Format(format, arg));\n    }\n    /// <summary>\n    ///\
  \ 向日志文件记录消息。\n    /// </summary>\n    public void Log(string pMessage)\n    {\n\
  \      writeLogInfo(pMessage, Category.Info, Priority.None);\n    }\n    /// <summary>\n\
  \    /// 向日志文件记录异常。\n    /// </summary>\n    public void Log(Exception pException)\n\
  \    {\n      if (pException == null) return;\n      writeLogInfo(pException.ToString(),\
  \ Category.Exception, Priority.High);\n    }\n    /// <summary>\n    /// 向日志文件记录消息。\n\
  \    /// </summary>\n    public void Log(string pMessage, Category pCategory, Priority\
  \ pPriority)\n    {\n      writeLogInfo(pMessage, pCategory, pPriority);\n    }\n\
  \    /// <summary>\n    /// 将日志消息写入日志文件。\n    /// </summary>\n    internal void\
  \ writeLogInfo(string pMessage, Category pCategory,\n      Priority pPriority)\n\
  \    {\n      if (string.IsNullOrEmpty(pMessage))\n        pMessage = \"Empty message\
  \ received in LogWriterService\";\n      //为了对于 10,000 次测试调用，添加堆栈帧\n      // 为 exe\
  \ 增加了 0.5 秒，因此每次获取堆栈\n      // 帧对性能的影响微乎其微。\n      var callingStackFrame = new StackFrame(1);\
  \  // 1 代表我们的调用者\n      string msg = String.Format(\"{0} - {1} - {2}\",\n      pMessage,\
  \ pCategory, Priority);\n      using (var file = new StreamWriter(_logFilePath))\n\
  \      {\n        file.WriteLine(callingStackFrame + Environment.NewLine + msg);\n\
  \        file.Close();\n      }\n    }\n  /// <summary>\n  /// 此接口应该放在项目中。\n  ///\
  \ </summary>\n  public interface ILogger\n  {\n    void Log(string msg);\n    void\
  \ Log(Exception exc);\n    void Log(string format, params object[] arg);\n    void\
  \ Log(string pMessage, Category pCategory, Priority pPriority);\n  }\n}\n```\n\n\
  ***\n\n#### 为 LogWriterService 进行重构\n\n重构以使用 `LogWriterService` 与我们对 `DialogService`\
  \ 使用的重构类似。如果存在现有的日志写入器，我们对适当的方法进行文本搜索，并像处理 Dialog Service 那样进行替换。然而，对于日志写入器，代码也可能直接写入日志文件。这些情况更难找到，可能需要你将文件名作为字符串进行搜索。\n\
  \n在接下来的示例中，你将看到遗留软件写入日志的两种可能版本。一个使用专门的写入器服务，另一个直接写入文件。这两种都可以重构为使用按需属性或用点解析的日志写入器。你可以看到每个重构方法的两个版本，见\
  \ Listing 11.8。\n\n#### Listing 11.8. LogWriterService 示例\n\n点击此处查看代码图像\n\n***\n\
  \n```csharp\nusing CodeSamples.Ch10_EstablishFoundation.Listing04;\nnamespace CodeSamples.Ch11_RefactorToBasicServices.Listing08\n\
  {\n  public class LegacyCodeSample\n  {\n    /// <summary>\n    /// 使用专用写入类写入日志文件的\n\
  \    /// 遗留方法。\n    /// </summary>\n    public void LogWriterCallUsingWriterClass()\n\
  \    {\n      LegacyLogWriter.Log(\"log message\");\n    }\n    /// <summary>\n\
  \    /// 直接访问文件写入日志的\n    /// 遗留方法。\n    /// </summary>\n    public void LogWriterWritingDirectlyToFile()\n\
  \    {\n      using (var file = new System.IO.StreamWriter(\"c:\\\\test.txt\"))\n\
  \      {\n        file.WriteLine(\"log message\");\n        file.Close();\n    \
  \  }\n    }\n  }\n  public static class LegacyLogWriter\n  {\n    private static\
  \ string _logFileName = \"c:\\\\test.txt\";\n    public static void Log(string msg)\n\
  \    {\n      using (var file = new System.IO.StreamWriter(_logFileName))\n    \
  \  {\n        file.WriteLine(msg);\n        file.Close();\n      }\n    }\n  }\n\
  }\n```\n\n***\n\nListing 11.9 显示了通过 `ServiceLocator` 重构的相同遗留代码。在示例中，我们将遗留日志写入器重构为服务以保留当前功能。\n\
  \n#### Listing 11.9. 为 ServiceLocator 重构的遗留日志写入器\n\n点击此处查看代码图像\n\n***\n\n```csharp\n\
  using CodeSamples.Ch10_EstablishFoundation.Listing04;\nnamespace CodeSamples.Ch11_RefactorToBasicServices.Listing09\n\
  {\n  public class LegacyCodeSample\n  {\n    /// <summary>\n    /// 使用专用写入类写入日志文件的\n\
  \    /// 遗留方法。\n    /// </summary>\n    public void LogWriterCallUsingWriterClass()\n\
  \    {\n      ServiceLocator.Resolve<ILogWriter>().Log(\"log message\");\n    }\n\
  \    /// <summary>\n    /// 直接访问文件写入日志的\n    /// 遗留方法。\n    /// </summary>\n   \
  \ public void LogWriterWritingDirectlyToFile()\n    {\n      ServiceLocator.Resolve<ILogWriter>().Log(\"\
  log message\");\n    }\n  }\n  public interface ILogacyWriter\n  {\n    void Log(string\
  \ msg);\n  }\n  public class LegacyLogWriter : ILogacyWriter\n  {\n    private string\
  \ _logFileName = \"c:\\\\test.txt\";\n    public void Log(string msg)\n    {\n \
  \     using (var file = new System.IO.StreamWriter(_logFileName))\n      {\n   \
  \     file.WriteLine(msg);\n        file.Close();\n      }\n    }\n  }\n}\n```\n\
  \n\n\n请注意，如果你通过将现有的日志器转换为服务来使用它，很容易不小心继续使用具体类而不是转换为服务。你可以使用的一个技巧来检测在重构过程中可能漏掉的任何方法调用，就是在接口和类中略微更改日志记录方法的名称。在将所有方法调用都转换为新名称之前，项目将无法编译。当应用程序再次编译后，你可以使用重构工具，只需几次击键，即可将该方法重命名为原始名称。\n\
  \n例如，如果旧版方法名称为 `LogMessage`，请将其更改为 `LogMessageNew`（不要允许 Visual Studio 传播该更改）并创建一个接口。这会破坏对旧日志方法的任何调用，并强制你将这些调用更新为服务调用。在解决方案再次编译后，使用重构工具将接口中的方法名改回\
  \ `LogMessage`，这次允许 Visual Studio 在整个应用程序中传播该更改。\n\n## Note\n\n有时候，“不该测试什么”与“应该测试什么”一样。例如，当我们为日志器本身编写测试时，我们测试是为了确保消息确实写入磁盘。这包含在集成测试中。然而，在测试使用日志器的代码时，只需测试以确保日志器被调用过即可。不要尝试测试写入磁盘的消息。只要你能证明日志器接收了\
  \ `Log` 方法调用，你就可以放心地认为消息已妥善记录。\n\n#### 跟踪会话信息\n\n尽管我们极力避免提供全局会话信息，但有时这是不可避免的。有些值是我们在整个应用程序中都需要访问的。这在重构现有应用程序时尤为如此，因为旧的设计大量使用了全局变量。我们无法一次性更改这种设计，因此在短期内，我们需要将全局变量移动到与我们的面向服务的架构（SOA）更兼容的地方。这就是\
  \ `SessionInformationService` 派上用场。该服务可以遵循我们为架构规定的规则，同时允许代码的所有部分访问这些变量。它还将将全局变量集中在一个地方，使得最终移除\
  \ `SessionInformationService` 变得更容易。\n\n当旧系统使用这些全局变量时，它们通常被标记为 `static`。在移动到会话信息服务时，可以并且应该移除此注解。静态变量和会对现代应用程序产生许多问题，应该被避免（唯一的例外是\
  \ `ServiceLocator`，它必须是一个静态类）。\n\n请记住，我们并不主倡全局信息存储的有效性。在重构过程中，在重构工作期间，创建此类服务通常是必要的，以解耦某些组件。如果你正确设计了重构后的应用程序，该类会在重构的前半部分随着你将旧全局变量移动服务而增大，然后随着结构的改进和全局变量的不再需要，它会再次缩小。理想情况下，在重构完成且所有全局变量都移动到其他地方后，将删除该类。\n\
  \n### 用于会话信息的重构\n\n幸运的是，实现会话信息服务相对容易。我们将其命名为 `ApplicationSession`。这个类是一个服务，通常提供很少的功能；它只是不同组件访问的全局数据的存放地。它通常只有一系列各种类型的属性，内部没有逻辑。\n\
  \n实现此服务没有更简单的了。只需创建一个带有适当参数的类，附加相应的接口，并将其作为单例注册到你的依赖注入容器中。然后，它可以在任何需要的地方解析，并在适当的时候更新值。\n\
  \n## Note\n\n会话信息服务的一个潜在问题是应用程序如何处理登录和注销逻辑。如果应用程序在用户注销时关闭，该服务应该运行良好。如果你允许一个用户注销而另一个用户登录而不关闭应用程序，则必须用新副本刷新你的会话信息服务。我们的\
  \ `ApplicationSession` 看起来 Listing 11.10。\n\n## Listing 11.10. 一个 ApplicationSession\
  \ 服务\n\n点击此处查看代码图像\n\n```csharp\nusing System;\n\nusing CodeSamples.Ch10_EstablishFoundation.Listing04;\n\
  \nnamespace CodeSamples.Ch11_RefactorToBasicServices.Listing10\n{\n  public class\
  \ BusinessLogic\n  {\n    public void SampleCallToApplicationSession()\n    {\n\
  \      var svc = ServiceLocator.Resolve<IApplicationSession>();\n      var usrName\
  \ = svc.UserName;\n    }\n  }\n  /// <summary>\n  /// 此类包含应用程序会话\n  /// 信息，这些信息可能\n\
  \  /// 在整个应用程序中使用。\n  /// </summary>\n  public class ApplicationSession : IApplicationSession\n\
  \  {\n    /// <summary>\n    /// 持有当前登录用户的用户名。\n    /// </summary>\n    public string\
  \ UserName { get; internal set; }\n    /// <summary>\n    /// 持有当前登录客户的 ID。\n  \
  \  /// </summary>\n    public Guid CurrentCustomerId { get; internal set; }\n  \
  \  public ApplicationSession()\n    {\n      // 这里是填充数据的地方，可能\n      // 来自数据库或其他持久化存储。\n\
  \      UserName = \"CurrentUser\";\n      CurrentCustomerId = Guid.NewGuid();\n\
  \    }\n  }\n\n  public interface IApplicationSession\n  {\n    string UserName\
  \ { get; }\n    Guid CurrentCustomerId { get; }\n  }\n}\n```\n\n这只是一个示例；你的实现将大不相同，并且可能包含更多信息。根据需要随时更改此类。\n\
  \n实现此服务最简单的方法是首先在你的代码中找到你需要删除的全局变量。将该变量复制到服务的属性中，并将其添加到接口中。现在删除原始旧变量并尝试编译。你应该能够通过将旧引用替换为对新服务的调用来修复任何编译错误。\n\
  \n### 以 SOA 的方式访问资源\n\n应用程序资源一直很难处理。管理良好的 UI 所需图像和文本是一项耗时且没有回报的工作。此外，如果应用程序中有许多图像，它们会减慢构建速度并使整体变得难以管理。更糟糕的是，.NET\
  \ 的 `ResourceManager` 很难以解耦的方式使用。重构旧应用程序的资源可能特别困难，因为当旧应用程序最初设计时，很少有接受的资源访问方法。因此，这种功能的实现有很多种。\n\
  \n这是一个 SOA 可以帮助的问题。一旦 `ServiceLocator` 安装到你的应用程序中，解析资源图像或文本或其他任何内容都可以变得像获取服务引用并请求项一样简单。\n\
  \n资源提供者是一个接收字符串、图标、图片和其他所需的应用程序资源的服务。它从本地存储中检索这些资源并返回给调用者，调用者无需担心它们的来源。这与内置的 `ResourceManager`\
  \ 不同，由调用者告诉去哪里寻找资源。\n\n\n\n请查看列表 11.11 中 `ResourceProvider` 的代码。这是对内置 `ResourceManager`\
  \ 的简单封装，但它在几个方面增强了 `ResourceManager`。\n\n### 列表 11.11.Resource Provider 的代码\n\n\
  点击此处查看代码图片\n\n```csharp\nusing System;\nusing System.Drawing;\nusing System.Reflection;\n\
  using System.Resources;\nusing CodeSamples.Ch10_EstablishFoundation.Listing04;\n\
  \nnamespace CodeSamples.Ch11_RefactorToBasicServices.Listing11\n{\n  public class\
  \ ResourceProvider : IResourceProvider\n  {\n    internal Assembly _currAssembly;\n\
  \    /// <summary>\n    /// 如果未找到请求的字符串，则返回的值。\n    /// </summary>\n    public string\
  \ MissingStringValue { get; set; }\n    /// <summary>\n    /// 如果未找到请求的图标，则返回的值。\n\
  \    /// </summary>\n    public Icon MissingIconValue { get; set; }\n    /// <summary>\n\
  \    /// 如果未找到请求的图像，则返回的值。\n    /// </summary>\n    public Image MissingImageValue\
  \ { get; set; }\n    internal ResourceManager ResourceMgr\n    {\n      get\n  \
  \    {\n        return _resourceMgr ??\n          (_resourceMgr = new ResourceManager(\n\
  \          \"Resources.Resource1\", _currAssembly));\n      }\n    }\n    internal\
  \ ResourceManager _resourceMgr;\n    public ResourceProvider()\n    {\n      _currAssembly\
  \ = Assembly.GetExecutingAssembly();\n    }\n    /// <summary>\n    /// 返回由给定名称标识的资源。如果未找到资源，\n\
  \    /// 它将尝试返回某些有用的内容。\n    /// </summary>\n    public T GetResource<T>(string\
  \ pName) where T : class\n    {\n      var obj = ResourceMgr.GetObject(pName) as\
  \ T;\n      if (obj != null) return obj;\n      return HandleObjectNotFoundError<T>(pName);\n\
  \    }\n    private T HandleObjectNotFoundError<T>(string pName) where T : class\n\
  \    {\n      if (typeof(T) == typeof(string))\n      {\n        if (MissingStringValue\
  \ == null)\n          throw new ArgumentOutOfRangeException(\n            \"String\
  \ resource not found \" + pName);\n        return MissingStringValue as T;\n   \
  \   }\n      if (typeof(T) == typeof(Icon))\n      {\n        if (MissingIconValue\
  \ == null)\n          throw new ArgumentOutOfRangeException(\n            \"Icon\
  \ resource not found \" + pName);\n        return MissingIconValue as T;\n     \
  \ }\n      if (typeof(T) == typeof(Image))\n      {\n        if (MissingImageValue\
  \ == null)\n          throw new ArgumentOutOfRangeException(\n            \"Image\
  \ resource not found \" + pName);\n        return MissingImageValue as T;\n    \
  \  }\n      throw new ArgumentException(\"Unsupported object type \" + typeof(T));\n\
  \    }\n  public interface IResourceProvider\n  {\n    T GetResource<T>(string pName)\
  \ where T : class;\n    string MissingStringValue { get; set; }\n    Icon MissingIconValue\
  \ { get; set; }\n    Image MissingImageValue { get; set; }\n  }\n  public class\
  \ ResourceProviderExample\n  {\n    public ResourceProviderExample()\n    {\n  \
  \    var svc = ServiceLocator.Resolve<IResourceProvider>();\n      svc.MissingStringValue\
  \ = \"missing string value\";\n    }\n    public string GetStringExample()\n   \
  \ {\n      var svc = ServiceLocator.Resolve<IResourceProvider>();\n      return\
  \ svc.GetResource<string>(\"String resource\");\n    }\n  }\n}\n```\n\n让我们开始查看代码顶部的三个属性。这三个属性包含了当请求的资源不存在时，服务应该返回的值。添加这些属性允许调用代码假设始终会返回某些有效内容。这对于需要图像来增强外观的应用程序非常有用，但你不希望应用程序因为某些原因图像不存在而抛出异常。你只需为\
  \ `MissingImageValue` 属性添加一个值，如果请求的内容不存在，该值将返回给调用者。\n\n接下来让我们看看按需属性 `ResourceMgr`。它打开当前程序集并创建一个\
  \ `ResourceManager` 来执行检索资源的实际工作。为了简单起见，我们假设所有资源都包含在当前项目中，但如有需要可以很容易更改。\n\n**注意**：构建必须处理多种语言应用程序的人会注意到，这种\
  \ `ResourceProvider` 的实现并没有正确处理该情况。然而，针对多种语言进行增强并不困难，这留给读者作为练习。\n\n`GetResource`\
  \ 方法是魔法发生的地方。它调用嵌入资源以获取所请求的资源。然后我们将返回的对象强制转换为相应的类型并返回它。我们将此方法设计为泛型，以省去调用者尝试将对象转换为正确类型的麻烦。\n\
  \n如果返回的对象为 `null`，我们通过检查请求的类型对象来处理错误，以查看是否应该返回默认值。如果没有指定默认值，则会抛出异常。\n\n在列表 11.11\
  \ 中显示的最后一个类中，我们看到了如何使用我们的新资源提供者的示例。如果我们想指定在资源缺失时返回的值，只需像构造函数中那样解析提供者即可。解析资源是一个简单的方法调用，用于指定资源的类型和名称。现在此资源提供者可以被模拟（mock）以返回任何值（即使是“缺失”值），并对你的调用代码进行适当测试，以确保它能够正确处理这些值。\n\
  \n### 为 ResourceProvider 进行重构\n\n`ResourceProvider` 背后的概念与其他任何服务都相同。它通过允许访问标准字符串和图像为应用程序的其他部分提供服务，并且它不受应用程序状态的影响，因此无论调用者何时请求特定资源，始终会返回相同的资源。然而，这里的细节上是不同的。此服务通常放在一个独立的项目中，而\
  \ `ResourceProvider` 的接口仍然像其他接口一样存在于 `Interfaces` 项目中。\n\n将此服务放在独立项目中的出于几个原因。包含大量图像的项目构建可能需要很长时间。但在成熟的系统中，它们很少更改，因此花费时间构建它们可能是没必要的。当请求标准生成时，Visual\
  \ Studio 足够智能，只会构建已更改的项目，但有时需要进行全量重新生成。这在大型系统或成员较多的项目中尤为真实，因为快速变化速度会导致 Visual Studio\
  \ 不同步。。通过将资源项目单独分离，在大型项目中，你可以仅在需要时创建一个仅包含这一个项目的解决方案。主解决方案不包含该项目的源代码，只包含指向 DLL 的链接。这虽然在处理资源时引入了记忆加载不同解决方案的额外开销，但对于改进构建速度和\
  \ IDE 的响应速度来说，这种代价通常是值得的。\n\n当你需要为不同的客户显著定制应用程序时，单独的项目也是有优势的。你可以创建两个名为 `ResourcesClient1`\
  \ 和 `ResourcesClient2` 的项目，它们共享 `ResourceProvider` 代码。只需在正确的资源项目中替换必要的图像和文本，然后在分发应用程序时发送正确的\
  \ DLL，就可以让这种多客户目标变得简单得多。\n\n\n\n\n要实现 `ResourceProvider`，请扫描您的遗留代码以寻找标识资源的字符串，例如\
  \ `.ico`、`.bmp` 等。您应该找到尝试从磁盘文件读取指定资源的代码，可能还有处理资源不存在的代码。所有这些代码都可以通过对 `ResourceProvider`\
  \ 的简单调用来替换。\n\n我们为提供程序添加了一些错误处理功能，以尽可能减少资源缺失的影响。调用者可以设置一个值作为资源缺失时的默认值。通过这种方法，如果资源缺失，应用程序至少可以继续运行，尽管它显示的可能是“建设中”的图像而不是正确的图像。\n\
  \n#### 使用消息聚合器 (Message Aggregator)\n\n我们在这里所做工作的核心点之一是让应用程序中的类集成更加松散。为了实现这一点，我们希望限制任何类对另一个类的硬引用。然而，这一目标并不会减少不同类之间通信的需求。这就是消息聚合器（也称为\
  \ `EventAggregator`）大显用场的地方。消息聚合器提供了一种发布和订阅机制，允许两个类在没有相互引用的情况下进行通信。其中一个类充当发布者，而一个或多个其他类充当订阅者。这两个类约定一个用于通信的消息类型，然后消息聚合器从发布者接收此消息类型并将其传递给订阅者，而任何一个类对对方一无不知。\n\
  \n这种描述让消息聚合器听起来像普通的事件，事实上它确实如此。如果需要，可以使用消息代替事件，但消息提供的间接性在错误的情况下可能会成为阻碍。作为一个一般原则，如果一个类已经对另一个类有直接引用，则使用事件进行通信。如果没有直接引用，则使用消息传递。\n\
  \n### 为 MessageAggregator 进行重构\n\n由于我们的工作基于 Prism，因此 Prism 为我们提供了一个 `EventAggregator`，包含了我们所需的所有功能，如\
  \ Listing 11.12 所示。我们的消息聚合器是 `EventAggregator` 的子类，但没有添加额外的功能。我们这样做是为了以防以后需要向其添加功能。通过将我们自己的类添加到层级结构中，我们可以更轻松地控制聚合器如何增长和变化以满足我们的需求。\n\
  \n使用消息聚合器远比创建一个它要容易得多。Listing 11.12 展示了如何创建和使用 `MessageAggregator`。\n\nListing 11.12.\
  \ MessageAggregator 示例\n\n点击此处查看代码图像\n\n***\n\n```csharp\nusing System;\n\nusing\
  \ CodeSamples.Ch10_EstablishFoundation.Listing04;\n\nusing Microsoft.Practices.Prism.Events;\n\
  \nnamespace CodeSamples.Ch11_RefactorToBasicServices.Listing12\n{\n  public interface\
  \ IMessageAggregator : IEventAggregator\n  {\n  }\n\n  /// <summary>\n  /// 为应用程序提供消息服务。\n\
  \  /// </summary>\n  public class MessageAggregator : EventAggregator, IMessageAggregator\n\
  \  {\n    // 这是 Prism EventAggregator 的扩展点。它允许\n    // 我们在必要时以后增强 EventAggregator，而\
  \    // 无需更改任何调用代码。\n  }\n\n  /// <summary>\n  /// 承载状态消息负载的 DTO 类。\n  /// </summary>\n\
  \  public class StatusMessageDto\n  {\n    public StatusMessageDto(string pMsg)\n\
  \    {\n      Message = pMsg;\n    }\n    //在此处放置任何必要的相关信息。\n    public string Message\
  \ { get; set; }\n  }\n\n  /// <summary>\n  /// 组织系统所有消息的容器类。\n  /// </summary>\n\
  \  public class MessageEvents\n  {\n    /// <summary>\n    /// 当调用者想要设置应用状态时使用此消息。\n\
  \    /// </summary>\n    public class StatusMessage : CompositePresentationEvent<StatusMessageDto>\n\
  \    {\n    }\n  }\n\n  public class MessageAggregatorExample\n  {\n    /// <summary>\n\
  \    /// 向所有订阅者发布消息。\n    /// </summary>\n    public void PublishMessage()\n   \
  \ {\n      var msgAgg = ServiceLocator.Resolve<IMessageAggregator>();\n      var\
  \ msg = msgAgg.GetEvent<StatusMessage>();\n      var dto = new StatusMessageDto(\"\
  Hello\");\n      msg.Publish(dto);\n    }\n\n    /// <summary>\n    /// 监听具有特定消息类型的发布。\n\
  \    /// </summary>\n    public void SimpleSubscription()\n    {\n      var msgAgg\
  \ = ServiceLocator.Resolve<IMessageAggregator>();\n      var msg = msgAgg.GetEvent<StatusMessage>();\n\
  \      var subscriptionToken = msg.Subscribe(SetApplicationStatus);\n    }\n\n \
  \   /// <summary>\n    /// 监听具有特定消息类型的发布\n    /// 并过滤出以 \"Hello\" 开头的消息。\n    ///\
  \ </summary>\n    public void FilteredSubscription()\n    {\n      var msgAgg =\
  \ ServiceLocator.Resolve<IMessageAggregator>();\n      var msg = msgAgg.GetEvent<StatusMessage>();\n\
  \      msg.Subscribe(pParam => pParam.Message.StartsWith(\"Hello\"));\n    }\n\n\
  \    /// <summary>\n    /// 处理消息。\n    /// </summary>\n    public void SetApplicationStatus(StatusMessageDto\
  \ pStatusMessage)\n    {\n      Console.WriteLine(pStatusMessage.Message);\n   \
  \ }\n  }\n}\n```\n\n\n\n\n现在我们已经有了消息类型，可以开始编写发布和订阅逻辑的核心编码工作了。示例中的第一个方法展示了如何使用 `MessageAggregator`\
  \ 发布消息。我们像往常一样解析服务的引用，然后使用该引用获取我们想要发送的特定消息的引用。这个引用就是我们将消息发布给所有订阅者的工具。如果你多次发布相同的消息，可以在所有的\
  \ `Publish` 调用中使用同一个消息对象。\n\n现在我们已经将消息发布给所有订阅者，但请注意，我们并不知道是否真的订阅者在后台监听。此 `Publish`\
  \ 方法不会向发布者提供任何反馈。这是设计如此的。发布者不应该知道，也不应该关心是否存在任何订阅者。他们只需要发布必要的信息并继续处理即可。\n\n现在让我们来看如何订阅消息。`SimpleSubscription`\
  \ 方法展示了如何使用 `MessageAggregator` 订阅消息。注意，这只需要执行一次，该订阅将一直持续到订阅者超出作用范围且垃圾回收器清理内存。`Subscribe`\
  \ 方法返回一个订阅令牌，在需要时可以使用它来取消订阅消息。\n\n订阅过程与发布过程类似，我们通过 `ServiceLocator` 获取聚合器的引用，然后获取我们感兴趣的消息。使用该消息，我们订阅并让所有消息发送到我们选择的方法（在本示例中为\
  \ `SetApplicationStatus`）。注意，传递给 `SetApplicationStatus` 的参数是我们创建的 DTO，而不是消息对象本身。\n\
  \n`FilteredSubscription` 方法展示了另一种订阅签名，值得注意，因为它提供了更大的灵活性。这个示例更复杂，但你可能比简单版本更频繁地使用它。第一个参数是接收到消息时调用的方法。第二个参数允许你选择在哪个线程上处理订阅。选项如下：\n\
  \n• `PublisherThread`：在发布者的线程上接收事件。这是默认设置。\n• `BackgroundThread`：在 .NET Framework\
  \ 线程池线程上异步接收事件。\n• `UIThread`：在用户界面线程上接收事件。\n\n第三个参数是强引用标志，指示聚合器应该对订阅持有弱引用还是强引用。默认情况下，聚合器持有订阅的弱引用，这意味着如果订阅所在的模块超出了作用范围并被垃圾回收，该订阅就会被移除。取决于你如何组织应用程序中的模块，这可能会导致许多头疼问题，因为订阅看起来有时有效，有时又无效。具体来说，它在调试模式下是有效的，因为\
  \ Visual Studio 本身保留了模块的引用，使其留在内存中。然而，在调试器之外运行时，订阅似乎不起作用。\n\n将此标志设置为 true 会强制消息聚合器对消息处理器持有强引用。然而，这可能导致内存泄漏，因为消息处理器所在的模块永远无法被垃圾回收，因此在使用此标志时要小心。\n\
  \n最后一个参数是过滤器，它在调用你的处理方法之前在聚合器中应用。应该使用此过滤器，而不是在消息处理器中设置过滤器，因为将过滤器添加到订阅会导致其在聚合器中运行，而不是在消息处理器中运行。这可以帮助加速消息处理，因为聚合器不需要将消息发送给处理器（这处理可能是跨线程的）。跨线程进行消息封化是一个开销很大的过程，应该尽可能避免。\n\
  \n#### 转换静态类\n\n在引入上述服务之后，在项目的此阶段还有另一个必要步骤。我们需要将任何静态类转换为服务，以便它们被正确地使用和测试。\n\n在与遗留系统一起工作时，你可能会遇到许多标记为\
  \ `static` 的类和方法。在依赖注入之前，静态类是应用程序创建单例的一种可接受且简单的方法。然而，静态类和方法在现代架构中带来了棘手的问题。\n\n在使用依赖注入容器使用静态类的主要问题是，你无法在静态类上定义接口。事实上，无法在\
  \ DI 容器中注册静态类。因此，对静态类的任何调用都是紧耦合的。幸运的是，静态类只是创建单例的一种语法方式，而我们知道如何使用 DI 容器来实现。\n\n**注意**\n\
  \n关于我们必须重构所有静态类这一表述的一个显著例外是包含扩展方法的类。这些类应该保持为静态的。\n\n#### 重构静态类\n\n查看 列表 11.13 中静态类在重构为服务前后的示例。\n\
  \n列表 11.13. 重构静态类\n\n点击此处查看代码图像\n\n```cs\nusing CodeSamples.Ch10_EstablishFoundation.Listing04;\n\
  \nnamespace CodeSamples.Ch11_RefactorToBasicServices.Listing13\n{\n  /// <summary>\n\
  \  /// 转换为服务之前的静态类。\n  /// </summary>\n  public static class StaticServiceClass\n\
  \  {\n    private static int _variable;\n    public static void StaticMethodCall()\n\
  \    {\n      _variable++;\n    }\n  }\n  /// <summary>\n  /// 转换为服务之后的静态类。\n  ///\
  \ </summary>\n  public class NonServiceClass : INonStaticService\n  {\n    private\
  \ int _variable;\n    public void StaticMethodCall()\n    {\n      _variable++;\n\
  \    }\n  }\n  public interface INonStaticService\n  {\n    void StaticMethodCall();\n\
  \  }\n  public class ClassThatCallsStatic\n  {\n    public void MethodCallingStatic()\n\
  \    {\n      // 这是调用方法的旧方式。\n      StaticServiceClass.StaticMethodCall();\n   \
  \   // 将上述行替换为等效的非静态调用。\n      var svc = ServiceLocator.Resolve<INonStaticService>();\n\
  \      svc.StaticMethodCall();\n    }\n  }\n}\n```\n\n重构静态为单例从从类、变量和所有方法中删除 `Static`\
  \ 关键字开始。然后我们添加一个暴露公共方法的接口。\n\n注意，逻辑仍然有效，因为 `_variable` 是类全局变量，而我们现在处理的是类的实例而不是静态类。\n\
  \n在 DI 容器中将此新服务和接口注册为单例后，当你构建应用程序时，会在所有作为静态使用服务的地方发现错误。如 11.13 中的最后一个方法调用所示，将这些静态调用替换为\
  \ `ServiceLocator` 调用。\n\n在整个系统中进行这种简单的替换完成了静态类到非静态单例的转换。\n\n#### 总结\n\n在本章中，我们查看了如何向\
  \ SOA 重构应用程序。我们移除或替换了许多导致应用程序紧耦合的常见编码概念，使得我们的应用程序更容易更新和测试。通过改变与用户交互、记录错误以及跟踪全局信息的方式，我们已经开始拆分应用程序的组件使其更具活性。\n\
  \n在下一章中，我们将处理重构遗留系统时更具挑战的问题。\n\n\n\n从遗留系统向新架构进行重构时，流程中的某些部分需要更多的时间和规划。本章将回顾这些部分。这些任务中的每一项都需要投入大量的精力完成，根据应用程序的大小，有时可能跨越几天甚至几周。\n\
  \n大多数重构可以在系统发布期间安全地进行。换句话说，如果要在发布应用程序的时间点引入了这些更改之一，它并不会阻碍发布。这些更改不会产生负面影响。当某个任务非常复杂或涉及广泛，必须一次性完成时，我们会特别指出。\n\
  \n我们讨论的第一点是存储库模式（Repository Pattern）。\n\n## 使用存储库模式\n\n存储库模式提供数据访问层，可以保护你的业务逻辑免于理解数据层的必要性。它基本上是一个执行整个应用程序所需数据交互的服务。使用存储库模式，数据访问可以被局部化，这样表结构、存储过程或任何其他细节对于需要使用这些数据的代码来说都是隐藏的。这是一个重要的实现服务，因为可以将很大比例的测试从集成测试转为单元测试。\n\
  \n我们知道，将功能封装在服务中是我们的测试和模拟（mocking）策略的关键部分。通过将所有数据访问调用封装在存储库中，我们创建了一个服务，通过检索和保存所有数据来为我们处理所有的数据库访问。一旦我们在服务中拥有此功能，就可以在单元测试中对其进行模拟，欺骗被测系统使其认为收到了我们想要测试的任何数据集。\n\
  \n让我们从列出遗留软件访问数据的典型方式开始示例（参见列表 12.1）。许多遗留应用程序使用 ADO 进行数据访问，因此我们假设是从那里开始的。\n\n###\
  \ 列表 12.1. 使用遗留软件访问数据\n\n点击此处查看代码图片\n\n```csharp\nusing ADODB;\n\nnamespace CodeSamples.Ch12_RefactorToAdvancedServices.Listing01\n\
  {\n  public class SecurityService\n  {\n    public bool ValidateUserPassword(int\
  \ userId, string password)\n    {\n      var conn = new Connection();\n      conn.ConnectionString\
  \ = \"connection string\";\n      conn.Open();\n      var qryString = \"select *\
  \ from User where id = \" + userId;\n      var rs = new Recordset();\n      rs.CursorLocation\
  \ = CursorLocationEnum.adUseClient;\n      rs.CursorType = CursorTypeEnum.adOpenForwardOnly;\n\
  \      rs.LockType = LockTypeEnum.adLockOptimistic;\n      rs.Open(conn, qryString);\n\
  \      rs.ActiveConnection = null;\n      //如果被锁定，失败\n      if (rs.Fields[\"isLockedOut\"\
  ].Value == \"1\") return false;\n      //如果密码匹配，成功\n      var validPW = (password\
  \ == rs.Fields[\"password\"].Value) ;\n      //如果上次登录成功，则不需要更新\n      var numBadLogins\
  \ = int.Parse(rs.Fields[\"numBadLogins\"].Value);\n      var isLockedOut = int.Parse(rs.Fields[\"\
  isLockedOut\"].Value);\n      if (validPW && numBadLogins == 0 && isLockedOut !=\
  \ 1) return true;\n      //在尝试 3 次后锁定用户\n      var updString = \"update User set\
  \ \";\n      if (validPW)\n      {\n        updString += \" numBadLogins = 0, isLockedOut\
  \ = 0\";\n      }\n      else\n      {\n        updString += \" numBadLogins = numBadLogins\
  \ + 1\";\n        if (numBadLogins >= 3)\n          updString += \" , isLockedOut\
  \ = 1\";\n      }\n      updString += \" where id = \" + userId;\n      var cmd\
  \ = new Command();\n      cmd.CommandType = CommandTypeEnum.adCmdText;\n      cmd.CommandText\
  \ = updString;\n      cmd.ActiveConnection = conn;\n      object recordsAffected;\n\
  \      cmd.Execute(out recordsAffected, null);\n      return validPW;\n    }\n \
  \ }\n}\n```\n\n在这个示例中，我们有一个需要验证密码的 `SecurityService`。我们的业务逻辑之一是，当用户输入密码错误三次后，我们将锁定用户，因此代码必须检索错误尝试次数并检查它。该方法中还包含了维护\
  \ `isLockedOut` 标记、错误尝试次数等的业务逻辑。\n\n当我们的业务逻辑与数据库访问混合在一起时，在没有设置好有适当测试集的活动数据库的情况下，无法测试此代码。我们必须使用设置了三种用户类型的集成测试：\n\
  1. 一个有效用户（未锁定，0 次尝试）\n2. 一个被锁定的用户\n3. 一个有两次错误尝试但未锁定的用户\n\n维护这些数据是非常耗时的，而且它们很容易被更改，导致测试失败。注意，测试的一部分应该确保\
  \ `numBadLogins` 字段和 `isLockedOut` 字段在数据库中更新，因此即使是我们的集成测试也会更改数据，导致第二次运行失败。因此，我们的测试部分需要将所有数据重新放回。这种测试结构如此复杂且脆弱，开发团队会因为其不可用而迅速将其放弃。\n\
  \n在存储库模式中，我们将所有数据访问代码移动到可以通过 `ServiceLocator` 解析的服务中。列表 12.2 展示了使用存储库进行数据访问的示例。在这个示例中，我们将数据库访问从\
  \ `ValidatePassword` 方法中移出，这样 `ValidatePassword` 方法中只剩下关于数据如何检索的代码。所有的数据库相关的细节都封装在存储库中。\n\
  \n### 列表 12.2. 使用存储库重构的遗留代码\n\n点击此处查看代码图片\n\n```csharp\nusing ADODB;\nusing CodeSamples.Ch10_Foundation.Listing04;\n\
  namespace CodeSamples.Ch12_RefactorToAdvancedServices.Listing02\n{\n  public class\
  \ SecurityService\n  {\n    public bool ValidateUserPassword(int userId, string\
  \ password)\n    {\n      var repo = ServiceLocator.Resolve<IRepository>();\n  \
  \    var rs = repo.UserData(userId);\n      //如果被锁定，失败\n      if (rs.Fields[\"isLockedOut\"\
  ].Value == \"1\") return false;\n      //如果密码匹配，成功\n      var validPW = (password\
  \ == rs.Fields[\"password\"].Value);\n      //如果上次登录成功，则不需要更新\n      var numBadLogins\
  \ = int.Parse(rs.Fields[\"numBadLogins\"].Value);\n      var isLockedOut = int.Parse(rs.Fields[\"\
  isLockedOut\"].Value);\n      if (validPW && numBadLogins == 0 && isLockedOut !=\
  \ 1) return true;\n      //在尝试 3 次后锁定用户\n      if (validPW)\n      {\n        rs.Fields[\"\
  numBadLogins\"].Value = 0;\n        rs.Fields[\"isLockedOut\"].Value = 0;\n    \
  \  }\n      else\n      {\n        rs.Fields[\"numBadLogins\"].Value = numBadLogins\
  \ + 1;\n        if (numBadLogins >= 3)\n          rs.Fields[\"isLockedOut\"].Value\
  \ = 1;\n      }\n      repo.SaveUserData(rs);\n      return validPW;\n    }\n  }\n\
  \n  public interface IRepository\n  {\n    Recordset GetUserData(int userId);\n\
  \    void SaveUserData(Recordset userData);\n  }\n\n  public class Repository :\
  \ IRepository\n  {\n    public Recordset GetUserData(int userId)\n    {\n      var\
  \ conn = new Connection();\n      conn.ConnectionString = \"connection string\"\
  ;\n      conn.Open();\n      var qryString = \"select * from User where id = \"\
  \ + userId;\n      var rs = new Recordset();\n      rs.CursorLocation = CursorLocationEnum.adUseClient;\n\
  \      rs.CursorType = CursorTypeEnum.adOpenForwardOnly;\n      rs.LockType = LockTypeEnum.adLockOptimistic;\n\
  \      rs.Open(conn, qryString);\n      rs.ActiveConnection = null;\n      return\
  \ rs;\n    }\n\n    public void SaveUserData(Recordset userData)\n    {\n      var\
  \ updString = \"update User set \";\n    }\n  }\n}\n```\n\n\n\n```cs\nupdString\
  \ += \" numBadLogins = \" + userData.Fields[1].Value;\nupdString += \" ,isLockedOut\
  \ = \" + userData.Fields[2].Value;\nupdString += \" where id = \" + userData.Fields[3].Value;\n\
  var conn = new Connection();\nconn.ConnectionString = \"connection string\";\nconn.Open();\n\
  var cmd = new Command();\ncmd.CommandType = CommandTypeEnum.adCmdText;\ncmd.CommandText\
  \ = updString;\ncmd.ActiveConnection = conn;\nobject recordsAffected;\ncmd.Execute(out\
  \ recordsAffected, null);\n}\n}\n```\n\n通过存储库（repository），旧代码请求它需要的数据，而由存储库（而不是类本身）构建查询并在数据库上执行。存储库随后返回适当的数据，由\
  \ `SecurityService` 对这些数据进行操作。这种策略将数据库访问逻辑与业务逻辑分离，解决了数据库与我们的 `SecurityService` 之间的紧耦合。它对应用程序逻辑流的影响很小，因此很容易实现。\n\
  \n有了存储库后，测试业务逻辑变得容易得多了。通过模拟（mocking）存储库，我们可以安排向业务逻辑返回任何数据集，如列表 12.3 所示。\n\n列表 12.3.\
  \ 重构为使用存储库的旧代码测试\n\n点击此处查看代码图像\n\n```cs\nusing ADODB;\nusing CodeSamples.Ch10_EstablishFoundation.Listing04;\n\
