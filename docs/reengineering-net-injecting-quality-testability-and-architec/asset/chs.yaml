  图 3.7. 成功运行单元测试\n\n#### 检测异常\n\n在编写测试时，务必包含对无效值的测试。例如，如果我们向方法传递一个负数作为利率会怎样？这种情况是不应该被允许的条件，因此我们应该抛出一个异常。通常情况下，如果业务逻辑中抛出异常，我们希望将其视为失败，在这种情况下，它应该导致测试通过。为了做到这一点，我们使用\
  \ `ExpectedException` 属性。更新业务逻辑使其像列表 3.8 所示。\n\n\n\n\n此测试运行结果如图 3.8 所示。\n\n![Image](img/00015.jpeg)\n\
  \n图 3.8\\. 现在所有四项测试均已通过。\n\n## 理解 Assert 的威力\n\n单元测试的力量源于 `Assert` 关键字。除了简单的真或假值外，还有许多内容可以进行断言。我们可以测试两个项的相等性、它们是否为\
  \ `null` 以及许多其他内容，如图 3.9 所示。当然，`Assert.IsTrue` 是强大的，因为我们可以编写任何需要的代码来测试一个值并查看该值是否正确。\n\
  \n![Image](img/00016.jpeg)\n\n图 3.9\\. Assert 的多种选项。\n\n## 比较单元测试与集成测试\n\n在目前为止的讨论中，我们查看了单元测试，但还有另一种测试被称为集成测试。单元测试可以粗略地定义为不使用任何外部资源（如硬盘、数据库或网络）的测试。它所需的资源是完全自给自足的。换句话说，执行测试时不需要访问内存以外的任何内容，这使得单元测试运行速度很快。单元测试还应该是可重复的，这意味着我们可以多次运行相同的测试并始终获得相同的结果。如果一个测试依赖外部条件才能通过，而我们无法控制该外部条件，那么它就不是单元测试。\n\
  \n另一方面，集成测试使用数据库或网络服务等外部资源。这些测试通常比单元测试大，因为涉及的环节更多。例如，集成测试可以确保某个方法能够从数据库读取几行，通过更新代表数据行的类中的数据来对其进行处理，然后将这些行保存回数据库。相反，单元测试假设数据库的读写工作正常，它只测试给定数据是否已正确更新。\n\
  \n集成测试是完整测试策略的重要部分，但我们将其分开处理，因为它们通常比单元测试消耗更多资源。由于使用了外部资源，集成测试通常运行时间也长得多。一个项目的单元测试应该在一两分钟内完成，但看到运行一小时或更长时间的集成测试套件并不罕见。集成测试可以比单元测试更彻底，但时间投入太大，通常无法像我们运行单元测试那样在提交代码（check-in）之前运行集成测试。因此，集成测试通常安排为每天运行一两次。\n\
  \n## 使用 InternalsVisibleTo 特性\n\n困扰单元测试编写的一个问题是向测试项目添加适当的引用，以便访问我们想要测试的方法。编写单元测试的目的是执行代码并确保其运行正常。然而，在设计良好的类中，有几个方法应该是类私有的（private），以确保它们无法被外部代码访问。这产生了一个问题，因为这也限制了测试访问该方法的能力。\n\
  \n解决方案是将我们测试的所有方法设为公共（public），但这会导致以后在不当使用内部方法时出现问题，使类变得不稳定。想象一个新入职的开发者并不知道某个方法是为了测试而设为公共的，他可能会认为所有公共方法都是可用的，然后使用该方法，从而在代码中引入严重的缺陷。\n\
  \n另一种解决方案是始终将测试类放在与运行代码相同的项目中。如果我们这样做并将方法设置为 `Internal`，那么我们就解决了这个问题；但现在，测试代码被编译到与运行代码相同的\
  \ DLL 中，导致文件膨肿。\n\n.NET 框架通过 `InternalsVisibleTo` 项目特性解决了这一问题。通过在 `AssemblyInfo.cs`\
  \ 文件中添加此特性，我们可以仅向解决方案中的特定项目暴露内部属性或方法。这使得测试类能够访问任何必要的方法，同时仍保持业务逻辑的良好的封装性。\n\n图 3.10\
  \ 显示了可以在哪里找到 `AssemblyInfo.cs` 文件。\n\n![Image](img/00017.jpeg)\n\n图 3.10\\. AssemblyInfo.cs\
  \ 文件位置\n\n列表 3.10 显示了 `InternalsVisibleTo` 特性的外观。请查看列表的最后一行作为示例。\n\n列表 3.10\\. InternalsVisibleTo\
  \ 示例\n\n点击此处查看代码图片\n\n* * *\n\n```csharp\nusing System.Reflection;\n\nusing System.Runtime.CompilerServices;\n\
  using System.Runtime.InteropServices;\n\n// 程序集的常规信息通过以下\n// 特性集控制。更改这些特性值以修改\n\
  // 与程序相关的信息。\n[assembly: AssemblyTitle(\"CodeSamples\")]\n[assembly: AssemblyDescription(\"\
  \")]\n[assembly: AssemblyConfiguration(\"\")]\n[assembly: AssemblyCompany(\"Reengineering\
  \ .NET\")]\n[assembly: AssemblyProduct(\"CodeSamples\")]\n[assembly: AssemblyCopyright(\"\
  Copyright © Brad Irby\")]\n[assembly: AssemblyTrademark(\"\")]\n[assembly: AssemblyCulture(\"\
  \")]\n// 将 ComVisible 设置为 false 使用此程序集中的类型\n// 对 COM 组件可见。如果你需要从 COM\n// 访问此程序集中的类型，请将该类型上的\n\
  // 特性设置为 true。\n[assembly: ComVisible(false)]\n// 以下 GUID 是此项目\n// 暴露给 COM 的 ID。\n\
  [assembly: Guid(\"693b33bf-7738-42b0-b743-ed05a82d8e\")]\n// 程序集版本信息由四个值组成：\n//\
  \ 主版本\n// 小版本\n// 生成号\n// 修订号\n// 你可以指定所有值，也可以如下所示\n// 默认生成号和修订号：\n[assembly: AssemblyVersion(\"\
  1.0.*\")]\n[assembly: AssemblyFileVersion(\"1.0.0\")]\n[assembly: InternalsVisibleTo(\"\
  CodeSampleTests\")]\n```\n\n* * *\n\n字符串是你想要授予访问的项目名称（即测试项目）。此行应被添加到包含待测逻辑的运行代码项目的\
  \ `AssemblyInfo.cs` 文件中。列表 3.11 显示了一个标记为 `Internal` 以允许测试访问的私有方法示例。\n\n```csharp\n\
  namespace CodeSamples.Ch03_UnitTesting.Listing11\n{\n    public class SampleInternalMethod\n\
  \    {\n        /// <summary>\n        /// 内部设置示例方法\n        /// </summary>\n  \
  \      internal void InternalMethod(string pMessage)\n        {\n            //代码在这里\n\
  \        }\n    }\n}\n```\n\n* * *\n\n## 理解测试驱动开发\n\n我们对单元测试的讨论如果不涉及测试驱动开发（TDD）运动将是不完整的。TDD\
  \ 最近变得流行，作为一种在编写生产代码之前先编写单元测试来构建高质量软件的方法。极端的 TDD 实践者在编写单行业务逻辑之前就会编写第一个测试，在这种情况下由于应用程序无法构建，测试将“失败”。\n\
  \n\n\n\n\n这种方法在构建新代码时具有优势，但在重构现有系统时，TDD（测试驱动开发）是一种很难实现的方法。因为我们是在现有的代码库的基础上尝试用新架构对其增强，因此在编写代码之前编写测试是不可能的。此外，由于大多数需要重构的系统都处于紧密耦合的状态，为这些代码添加单元测试是困难甚至是不可能的。出于这些原因，我们对测试并不采用\
  \ TDD 方法。\n\n### 了解更多单元测试的知识\n\n本章对单元测试进行了简要介绍，旨在提供足够的背景，以便任何不熟悉这一流程的人都能继续阅读并理解所讨论的内容。市上有许多书籍在更详细地解释这一主题方面做得非常出色。例如，Jeff\
  \ Levinson 编写的 *Software Testing with Visual Studio 2010* 是关注 .NET 示例的极佳选择。此外，Roy\
  \ Osherove 的 *The Art of Unit Testing* 非常详尽。如果你是单元测试的初学者，花时间阅读其中一本书是非常值得的。\n\n####\
  \ 总结\n\n本章介绍了自动化方式确保应用程序质量的方法。通过创建单元测试，我们能够编写测试代码的代码，从而带来质量的巨大改进，因为我们可以证明代码运行如其所示。单元测试还使我们能够更频繁地彻底测试代码，因为这些测试现在只需按下按钮即可运行。\n\
  \n本章讨论了如何创建你的第一批单元测试、如何组织测试以正确执行你的应用程序，以及如何检测代码响应错误条件时可能生成的异常。我们讨论了集成测试和单元测试之间的重要区别，以及这种差异对开发者和构建大师（build\
  \ master）意味着什么。最后，我们介绍了一些 Visual Studio 特有的单元测试功能，这些功能可以让你的测试工作变得简单得多。\n\n在下一章关于依赖倒转原则的章节中，我们将开始深入研究创建服务和其他对象的自动化方法，以便调用者不受创建这些服务的具体细节的影响。\n\
  \n## 4. 理解依赖倒转原则\n\n在本章中，我们讨论了贯穿全书所的架构的基石——依赖倒转原则（也称为控制反转，或 `IoC`）。应用这一原则是打破应用程序紧密耦合、使其更容易增强和测试的第一步。\n\
  \n依赖倒转的目标是打破软件中导致代码僵化和脆弱的紧密耦合。在讨论依赖倒转原则如何帮助我们消除应用程序中的紧密耦合之前，让我们先讨论什么是紧密耦合，以及它为什么会让应用程序变得脆弱。\n\
  \n### 理解紧密耦合\n\n应用程序中的类可以分为大类：高级组件和低级组件。低级组件执行系统工作，例如更新数据库、验证用户输入的信息以及从配置文件读取内容。低级组件是系统的“打工人”，它们了解应用程序所工作领域的详尽细节。\n\
  \n高级组件侧重于对低级组件以及可能的其他高级组件的管理。高级组件倾向于更加抽象，并且对领域的了解较少。在追踪应用程序的逻辑流时，你首先遇到的是高级组件，它们创建并管理着使应用程序运行所需的其他组件。\n\
  \n在遗留应用程序中，你会遇到两种情况之一。最常见的情况是，你发现高级组件和低级组件组合在同一个类中。将这些组件组合显然会导致紧密耦合，因为没有方法将它们相互分离。\n\
  \n你还会发现高级组件创建低级组件来协助执行某些功能。由于由于，高级组件必然了解低级组件及其能够做什么。换句话说，高级组件依赖于低级组件。这种依赖关系被称为 `tight\
  \ coupling`。\n\n紧密耦合使得应用程序难以管理和更新。假设你有一个名为 `SalesRegistrationService` 的高级类，用于注册销售员完成的销售。为了完成工作，`SalesRegistrationService`\
  \ 必须利用位于名为 `SecurityService` 和 `Repository` 的低级类中的功能。`SalesRegistrationService`\
  \ 创建 `SecurityService` 和 `Repository` 的实例，并调用适当的方法来实现目标。`SecurityService` 也会创建一个\
  \ `Repository` 实例以从数据库中检索必要信息。列表 4.1 显示了一个示例。\n\n列表 4.1. 紧密耦合的 SalesRegistrationService\n\
