  \ 显示了一个名为 `SampleViewModel` 的额外类。该类为视图按需要与用户交互的每个信息提供了一个属性。为了创建和使用视图，我们创建了这个视图类并填充了适当的数据。虽然很难看出视图所需的数据，但添加额外信息的重构变得简单了。如果我们决定视图需要更多信息，这种模式避免了编辑每个创建处的构造函数行的需要。然而，我们仍然必须访问使用视图的地方用适当的数据填充视图模型，因此这种结构并没有为我们带来太大帮助。\n\
  \n解决此问题的常见实现是将视图模型的填充推到视图模型本身中，这样调用者只需要创建视图模型，而不需要知道内部包含什么。考虑列表 2.3 中的实现。\n\n列表\
  \ 2.3. 使用 Repository 的视图模型\n\n点击此处查看代码图像\n\n```csharp\nusing System.Collections.Generic;\n\
  \nnamespace CodeSamples.Ch02_ApplicationArchitecture.Listing03\n{\n  public class\
  \ SampleView\n  {\n    private SampleViewModel _viewModel;\n    public SampleView(SampleViewModel\
  \ viewModel)\n    {\n      _viewModel = viewModel;\n    }\n    public void Show()\n\
  \    {\n      //show the view\n    }\n  }\n  public class SampleViewController\n\
  \  {\n    public SampleViewController()\n    {\n      var repo = new Repository();\n\
  \      var vm = new SampleViewModel(repo);\n      var view = new SampleView(vm);\n\
  \      view.Show();\n    }\n  }\n  public class SampleViewModel\n  {\n    public\
  \ User User { get; set; }\n    public ICollection<UserRole> AvailableRoles { get;\
  \ set; }\n    public int RequiredPasswordChars { get; set; }\n    public SampleViewModel(Repository\
  \ repo)\n    {\n      this.User = repo.GetUserInfo();\n      this.AvailableRoles\
  \ = repo.GetUserRoles();\n      this.RequiredPasswordChars = repo.GetPasswordChars();\n\
  \    }\n  }\n  public class Repository\n  {\n    public User GetUserInfo()\n   \
  \ {\n      //get user info from DB\n      return new User();\n    }\n    public\
  \ List<UserRole> GetUserRoles()\n    {\n      //get user roles from DB\n      return\
  \ new List<UserRole>();\n    }\n    public int GetPasswordChars()\n    {\n     \
  \ //get required length from dB\n      return 6;\n    }\n  }\n  public class User\n\
  \  {\n    //user info goes here\n  }\n  public class UserRole\n  {\n    //security\
  \ role info goes here\n  }\n}\n```\n\n在此代码示例中，我们在创建视图模型时将 `Repository` 传递给它。这使我们能够集中处理适当填充视图模型所需的代码，并使控制器免于需要知道视图模型需要哪些参数。然而，请注意视图模型属性都是公共的，因此如果在特殊情况下控制器希望替换视图模型中的默认值，这是可以做到的。当在\
  \ MVC 或 MVP 模式中使用视图模型时，这就是应该使用的视图模型。\n\n\n\n\n\n这三种模式的另一个出发点是处理 UI 事件的方式。例如，考虑一个按钮点击操作。在严格的\
  \ MVC 中，视图的后置代码文件中`no`（没有）UI 事件逻辑；`all`（所有的）处理过程都在控制器中完成的。这意味着视图必须将按钮点击事件以及任何其他\
  \ UI 事件暴露给控制器进行处理。控制器必须为它认为重要的每个事件附加一个处理程序，并相应地处理该事件。\n\n在 MVP 中，视图的后置代码在将 UI 事件传递给控制器进行处理之前会对其进行预处理。如果一个请求完全与\
  \ UI 关且不涉及业务逻辑，视图可以处理该请求并返回，而无需涉及演示器（Presenter）。\n\n在 MVVM 中，由于基于 XAML 的应用程序能够绑定到视图模型提供的命令，这个问题再次被绕开了。\n\
  \n让我们来看一个 MVC 和 MVP 区别的示例。假设你的应用程序正在运行，显示一个数据网格。用户想要查看其中一行的详情，因此他点击“显示详情”（Show Details）按钮来打开一个包含更详细数据的对话框。在我们的\
  \ UI 中，也可以通过右键点击上下文菜单来显示详情。列表 2.4 显示了 MVC 版本的示例。\n\n### 列表 2.4. 向控制器暴露事件的 MVC 视图\n\
  \n点击此处查看代码图像\n\n```csharp\nusing System;\nusing System.Windows.Forms;\n\nnamespace\
  \ CodeSamples.Ch02_ApplicationArchitecture.Listing04\n{\n  public class SampleForm\
