  \    {\n      _form.Maximize();\n    }\n    void _form_ContextMenuItemClicked(object\
  \ sender, EventArgs e)\n    {\n      _form.ShowDetailsForm();\n    }\n    void _form_ShowDetailsButtonClicked(object\
