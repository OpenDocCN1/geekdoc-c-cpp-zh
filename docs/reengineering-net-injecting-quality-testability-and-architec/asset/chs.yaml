  \ CreateRepository()\n    {\n      return new Repository();\n    }\n  }\n}\n```\n\
  \n***\n\n#### 引入接口\n\n到目前为止，代码已经有了很大改进。从每个类都需要知道如何创建服务的紧耦合结构，转变为知识委托给中心类的结构。然而，`SalesRegistrationService`\
  \ 与 `SecurityService` 以及 `Repository` 之间仍然是紧耦合的。为了实现这一点，我们需要为类引入接口。`interface` 是实现类必须遵循的方法和属性列表，就像一个约定。`interface`\
  \ 描述了类可以做什么，而具体的逻辑由类来实现。这样做的好处是多个类可以实现同一个 `interface`，使得类可以切换。\n\n***\n\n### 注意事项\n\
  \n如果你对接口及其工作原理不熟悉，请现在复习。接口对于我们使用的架构至关重要，因此你应该熟悉它们。你可以在任何 C# 编程书中找到接口的复习（Anders Helsberg\
  \ 写的《The C# Programming Language》是一个很好的选择），或者在 MSDN 上：[`msdn.microsoft.com/en-us/library/ms17356.aspx`](https://msdn.microsoft.com/en-us/library/ms17356.aspx)。\n\
  \n***\n\n如 Listing 4.6 所示，我们有一个 `AlternateSecurityService` 类，它通过保留列出权限的本地文件来存储权限，但具有相同的方法和属性。\n\
  \nListing 4.6. 使用 SecurityService 的替代方案\n\n点击此处查看代码图像\n\n***\n\n```csharp\nusing\
  \ System;\n\nnamespace CodeSamples.Ch04_DependencyInjectionPrinciple.Listing06\n\
  {\n  public class AlternateSecurityService\n  {\n    private string _filename;\n\
  \    public AlternateSecurityService(string pFilename)\n    {\n      _filename =\
  \ pFilename;\n    }\n    public bool CanUserSellProduct(string username, Guid productId)\n\
  \    {\n      // 使用本地文件判断用户是否有权限。\n      return true;\n    }\n  }\n}\n```\n\n\n\n\
  \n从理论上讲，提供者与其他提供者之间是可以替换的，因为它们执行的是相同的工作，只是方式不同。然而，如果我们使用这个提供者，将会得到构建错误，因为我们无法将 `AlternateSecurityService`\
  \ 赋值给 `SalesRegistrationService` 。要使用 `AlternateSecurityService`，我们必须修改 `SalesRegistrationService`\
  \ 中的代码来使用它。这是紧耦合的另一个例子。\n\n现在，让我们为安全服务和存储库引入接口，如列表 4.7 所示。\n\n#### 列表 4.7. 为服务引入接口\n\
  \n点击此处查看代码\n\n* * *\n\n```cs\nusing System;\n\nnamespace CodeSamples.Ch04_DependencyInjectionPrinciple.Listing07\n\
  \n{\n  public interface ISecurityService\n  {\n    bool CanUserSellProduct(string\
  \ username, Guid productId);\n  }\n  public interface IRepository\n  {\n    bool\
  \ RemoveFromInventory(Guid productId, int quantity);\n    void FinalizeSale(string\
  \ salesPersonName, Guid productId, int quantity);\n    bool IsUserActive(string\
  \ username);\n    bool DoesUserHavePermission(string username, Guid productId);\n\
  \  }\n}\n```\n\n* * *\n\n我们的接口非常简单，并且两个安全服务都实现了 `ISecurityService`。如果我们正确设计了其余代码，这两个对象是可以相互替换的。让我们重构工厂，使其看起来像列表\
  \ 4.8 所示。\n\n#### 列表 4.8. 重构对象工厂以返回接口\n\n点击此处查看代码\n\n* * *\n\n```cs\n/// <summary>\n\
  \  /// 创建服务的抽象工厂类\n  /// </summary>\n  public static class ObjectFactory\n{\n  ///\
  \ <summary>\n  /// 此属性将在应用程序启动时\n  /// 或在知道要使用哪个 URL 的用户登录时设置。\n  /// </summary>\n\
  \  public static string SecurityURL { get; set; }\n  // *** 此方法现在返回一个接口。\n  public\
  \ static ISecurityService CreateSecurityService()\n  {\n    return new SecurityService(SecurityURL);\n\
  \  }\n  // *** 此方法现在返回一个接口。\n  public static IRepository CreateRepository()\n  {\n\
  \    return new Repository();\n  }\n}\n```\n\n* * *\n\n注意，工厂现在返回的是接口，而不是具体对象。通过返回接口，工厂使得\
  \ `SecurityService` 失去了与 `Repository` 的紧耦合，并且 `SalesRegistrationService` 不再与 `SecurityService`\
  \ 紧耦合。现在，它们都为所需的服务使用接口，但不知道（也不在乎）哪个具体对象执行了这些职责。\n\n有了这种结构，我们可以通过重构对象工厂来交换 `SecurityService`\
  \ 并改用 `AlternateSecurityService`。不需要重新构建其他代码。\n\n* * *\n\n##### 注意\n\n提取接口是重构遗留系统时的常见任务。在\
  \ Visual Studio 2012 中，通过右键点击类名并选择 `Refactor > Extract Interface` 可以轻松实现这一点。\n\n\
  * * *\n\n#### 创建单元测试\n\n我们通过使用工厂和接口来重构类以实现松耦合。架构开始看起来与最终目标相似，但我们还没有完成，因为当前的结构对单元测试的支持并不理想。\n\
  \n让我们为 `SalesRegistrationService` 创建一些单元测试。在这个类中有很多我们需要验证的内容，但让我们先测试安全性。我们需要测试当销售人员是三种可能性之一会发生什么：\n\
  \n* `SuperSalesPerson`（可以销售任何东西）\n* `NormalSalesPerson`（有权限销售该产品）\n* `NormalSalesPerson`（没有权限销售该产品）\n\
  \n目前的逻辑是 `SalesRegistrationService` 调用 `SecurityService` 来检查权限。`SecurityService`\
  \ 调用 `Repository` 从数据库获取用户的访问权限。这意味着我们需要一个完全配置的数据库来测试该方法。我们必须配置此数据库，为我们要使用的各种测试用户账户设置相应的权限，并维护此数据库以确保测试不会中断。这一要求使得单元测试变得脆弱，因为在数据库中进行一个看似无关的更改都会破坏此项测试。\n\
  \n在上一节中，我们重构了代码，使得任何类只要实现了正确的接口，就可以被用作 `SecurityService`。使用此接口，我们可以创建一些特殊的测试安全服务，返回我们想要的值。例如，我们可以创建一个返回我们想要值的\
  \ `TestSecurityService`。\n\n\n\n在所有示例中，我们使用一个名为 `Unity` 的 IoC 容器。该容器是由 Microsoft\
  \ Patterns and Practices 组发布的 Prism 程序包的一部分。你可以从 [`unity.codeplex.com/`](http://unity.codeplex.com/)\
  \ 下载代码和库。\n\n网上还有其他免费提供的容器，它们也非常好用。如果你有喜欢的容器，它在你的重构项目中也同样好用，尽管书中的某些示例可能需要更新以适应你所容器的语法。\n\
  \nListing 4.10 显示了我们如何设置容器。\n\n### 列表 4.10. 使用 Unity 注册类\n\n点击此处查看代码图像\n\n```csharp\n\
  using Microsoft.Practices.Unity;\n\nnamespace CodeSamples.Ch04_DependencyInjectionPrinciple.Listing10\n\
  {\n  /// <summary>\n  /// 执行实际工作的类的接口。\n  /// </summary>\n  public interface IExampleClass\n\
  \  {\n    void DoWork();\n  }\n\n  /// <summary>\n  /// 工作类的具具体实现。\n  /// </summary>\n\
  \  public class ExampleClass : IExampleClass\n  {\n    public void DoWork()\n  \
  \  {\n      //在此处执行工作。\n    }\n  }\n\n  public class IoCContainerExample\n  {\n\
  \    public void ExampleUsage()\n    {\n      // 创建容器以便我们可以注册我们的类。\n      var container\
  \ = new UnityContainer();\n      // 这是我们向容器注册类的方式。\n      // 这告诉容器，当调用者请求\n    \
  \  // 一个 IExampleClass 时，容器应该创建并返回\n      // 一个 ExampleClass。\n      container.RegisterType<IExampleClass,\
  \ ExampleClass>();\n      // 这是我们获取 ExampleClass 实例的方法。\n      // 我们请求一个 IExampleClass\
  \ 实例，\n      // 容器会创建并返回一个实现了\n      // IExampleClass 接口的 ExampleClass。\n      var\
  \ instance = container.Resolve<IExampleClass>();\n    }\n  }\n}\n```\n\n在这个示例中，我们有了具体的类以及相关的接口。在\
  \ `ExampleUsage` 方法中，我们创建了用于注册类型的容器。接下来，我们将接口和具体类注册在一起，表示当调用者请求 `IExampleClass`\
  \ 时，容器应该创建并返回一个 `ExampleClass`。此注册的一个要求是第二个类必须可以转换为第一个类的类型。换句话说，如果 `ExampleClass`\
  \ 没有实现 `IExampleClass` 接口，那么此 `RegisterType` 语句将无法通过编译。最后，在示例中，我们可以通过解析接口向容器请求一个\
  \ `ExampleClass` 实例。此语句告诉容器创建一个 `ExampleClass` 并将其返回给调用者。然后我们就可以将该类用于任何目的。\n\n所以，让我们这个示例并让它变得复杂一点。假设\
  \ `ExampleClass` 对 `DependencyClass` 有依赖，如 Listing 4.11 所示。\n\n### 列表 4.11. 使用另一个类的示例类\n\
  \n点击此处查看代码图像\n\n```csharp\nusing Microsoft.Practices.Unity;\n\nnamespace CodeSamples.Ch04_DependencyInjectionPrinciple.Listing11\n\
  {\n  /// <summary>\n  /// 执行实际工作的类的接口。\n  /// </summary>\n  public interface IExampleClass\n\
  \  {\n    void DoWork();\n  }\n\n  /// <summary>\n  /// 工作类的具具体实现。\n  /// </summary>\n\
  \  public class ExampleClass : IExampleClass\n  {\n    public void DoWork()\n  \
  \  {\n      // 使用另一个类执行工作。\n      var dependencyClass = new DependencyClass();\n\
  \      dependencyClass.DoDependencyWork();\n    }\n  }\n\n  public interface IDependencyClass\n\
  \  {\n    void DoDependencyWork();\n  }\n\n  public class DependencyClass : IDependencyClass\n\
  \  {\n    public void DoDependencyWork()\n    {\n      //执行工作\n    }\n  }\n\n  public\
  \ class IoCContainerExample\n  {\n    public void ExampleUsage()\n    {\n      var\
  \ container = new UnityContainer();\n      container.RegisterType<IExampleClass,\
  \ ExampleClass>();\n      var instance = container.Resolve<IExampleClass>();\n \
  \   }\n  }\n}\n```\n\n在这种结构下，`ExampleClass` 与 `DependencyClass` 是紧耦合的，因为我们必须在 `DoWork`\
  \ 方法中“new 出它”。然而，正如示例所示，容器可以作为工厂并创建对象，这样我们就不会有这种耦合。问题在于如何将容器引入 `ExampleClass` 以供其使用。这就是我们创建\
  \ `ServiceLocator` 的地方。\n\n#### 服务定位器 (Service Locator)\n\n记住，当我们创建工厂时，将其设为静态的（static）以便更容易使用。如果我们把静态工厂的想法与容器通过引用构建对象的能力相结合，我们就有了一个\
  \ `ServiceLocator`。`ServiceLocator` 是一个使用 IoC 容器来注册和解析对象实例的工厂。如果我们实现一个基础的 `ServiceLocator`\
  \ 并重构示例以使用它，它看起来会像 Listing 4.12。\n\n**注意**：你可能会认为可以暴露 IoC 容器的静态变量而不是使用 `ServiceLocator`，但使用\
  \ `ServiceLocator` 是更好的做法。\n\n### 列表 4.12. 简单的服务定位器\n\n点击此处查看代码图像\n\n```csharp\n\
  using Microsoft.Practices.Unity;\n\nnamespace CodeSamples.Ch04_DependencyInjectionPrinciple.Listing12\n\
  {\n  /// <summary>\n  /// 执行实际工作的类的接口。\n  /// </summary>\n  public interface IExampleClass\n\
  \  {\n    void DoWork();\n  }\n\n  /// <summary>\n  /// 工作类的具具体实现。\n  /// </summary>\n\
  \  public class ExampleClass : IExampleClass\n  {\n    public void DoWork()\n  \
  \  {\n      // 我们现在使用 ServiceLocator 来解析依赖。\n      var dependencyClass = ServiceLocator.Resolve<IDependencyClass>();\n\
  \      dependencyClass.DoDependencyWork();\n    }\n  }\n\n  public interface IDependencyClass\n\
  \  {\n    void DoDependencyWork();\n  }\n\n  public class DependencyClass : IDependencyClass\n\
  \  {\n    public void DoDependencyWork()\n    {\n      //执行工作\n    }\n  }\n\n  public\
  \ class IoCContainerExample\n  {\n    public void ExampleUsage()\n    {\n      //\
  \ 我们现在使用 ServiceLocator 来获取\n      // 示例类。\n      var instance = ServiceLocator.Resolve<IExampleClass>();\n\
  \    }\n  }\n\n  public static class ServiceLocator\n  {\n    private static UnityContainer\
  \ _container;\n\n    static ServiceLocator()\n    {\n      // 创建我们的容器。\n      _container\
  \ = new UnityContainer();\n      // 设置所有类注册，以便稍后在\n      // 代码中解析。\n      _container.RegisterType<IExampleClass,\
  \ ExampleClass>();\n      _container.RegisterType<IDependencyClass, DependencyClass>();\n\
  \    }\n\n    public static TProxyType Resolve<TProxyType>()\n    {\n      return\
  \ _container.Resolve<TProxyType>();\n    }\n  }\n}\n```\n\n\n\n既然我们已经部署了 `ServiceLocator`，让我们回到带有\
  \ `SecurityService` 和 `Repository` 的原始示例，看看新结构是否能够处理更接近真实世界的情况。使用这些类，代码现在看起来类似于\
  \ 列表 4.13。\n\n### 列表 4.13. Service Locator 示例\n\n点击此处查看代码图片\n\n* * *\n\n```csharp\n\
  using System;\n\nusing Microsoft.Practices.Unity;\n\nnamespace CodeSamples.Ch04_DependencyInjectionPrinciple.Listing13\n\
  \n{\n  /// <summary>\n  /// 主驱动程序标示例。\n  /// </summary>\n  public class Program\n\
  \  {\n    public Program()\n    {\n      var salesRegSvc = ServiceLocator.Resolve<ISaleRegistrationService>();\n\
  \      salesRegSvc.CompleteSale(\"username\", Guid.NewGuid(), 4);\n    }\n  }\n\
  \  public interface ISaleRegistrationService\n  {\n    /// <summary>\n    /// 当销售员完成销售时调用的方法。\n\
  \    /// </summary>\n    string CompleteSale(string salespersonUserName, Guid productId,\
  \ int quantity);\n  }\n  /// <summary>\n  /// 注册产品销售的服务。\n  /// </summary>\n  public\
  \ class SaleRegistrationService : ISaleRegistrationService\n  {\n    /// <summary>\n\
  \    /// 当销售员完成销售时调用的方法。\n    /// </summary>\n    public string CompleteSale(string\
  \ salespersonUserName, Guid productId, int quantity)\n    {\n      // 限制某些产品的销售。\n\
  \      // 确保该销售员允许销售此产品。\n      var security = ServiceLocator.Resolve<ISecurityService>();\n\
  \      if (!security.CanUserSellProduct(salespersonUserName, productId))\n     \
  \   return \"Error - No permission to sell this product\";\n      // 确保库存中有足够的产品。\n\
  \      var repo = ServiceLocator.Resolve<IRepository>();\n      var canRemoveFromInventory\
  \ = repo.RemoveFromInventory(productId, quantity);\n      if (!canRemoveFromInventory)\n\
  \        return \"Error - not enough of that product in inventory\";\n      repo.FinalizeSale(salespersonUserName,\
  \ productId, quantity);\n      return \"success\";\n    }\n  }\n  public interface\
  \ ISecurityService\n  {\n    bool CanUserSellProduct(string username, Guid productId);\n\
  \  }\n  /// <summary>\n  /// 提供所有安全访问的类。\n  /// </summary>\n  public class SecurityService\
  \ : ISecurityService\n  {\n    private string _federatedSecurityURL;\n    public\
  \ SecurityService(string federatedSecurityURL)\n    {\n      _federatedSecurityURL\
  \ = federatedSecurityURL;\n    }\n    /// <summary>\n    /// 判断给定的用户名是否有权限访问\n \
  \   /// 请求的对象。\n    /// </summary>\n    public bool CanUserSellProduct(string username,\
  \ Guid productId)\n    {\n      // 超用户可以做任何事。\n      if (username == \"SuperSalesPerson\"\
  ) return true;\n      var permissionsString = GetUserPermissionsFromURL(_federatedSecurityURL);\n\
  \      if (permissionsString.Contains(\"Inactive\")) return false;\n      var repo\
  \ = ServiceLocator.Resolve<IRepository>();\n      return repo.DoesUserPermission(username,\
  \ productId);\n    }\n    /// <summary>\n    /// 从外部站点检索权限字符串。\n    /// </summary>\n\
  \    private string GetUserPermissionsFromURL(string URL)\n    {\n      // 使用联合安全机制获取权限字符串。\n\
  \      return \"permissions here\";\n    }\n  }\n  public interface IRepository\n\
  \  {\n    bool RemoveFromInventory(Guid productId, int quantity);\n    void FinalizeSale(string\
  \ salesPersonName, Guid productId, int quantity);\n    bool IsUserActive(string\
  \ username);\n    bool DoesUserPermission(string username, Guid productId);\n  }\n\
  \  /// <summary>\n  /// 控制与数据库所有交互的存储库类。\n  /// </summary>\n  public class Repository\
  \ : IRepository\n  {\n    public bool RemoveFromInventory(Guid productId, int quantity)\n\
  \    {\n      // 查询数据库以查看是否有足够的库存\n      // 用于此交易。\n      return true;\n    }\n\
  \    public void FinalizeSale(string salesPersonName, Guid productId, int quantity)\n\
  \    {\n      // 通过将信息保存到数据库来完成销售，\n      // 销售了什么产品以及数量。\n    }\n    public bool\
  \ IsUserActive(string username)\n    {\n      // 查询数据库以查看该用户是否处于状态。\n      return\
  \ true;\n    }\n    public bool DoesUserPermission(string username, Guid productId)\n\
  \    {\n      // 查询数据库以查看该用户是否有\n      // 足够的权限。\n      return true;\n    }\n  }\n\
  \  public static class ServiceLocator\n  {\n    private static UnityContainer _container;\n\
  \    static ServiceLocator()\n    {\n      // 创建我们的容器\n      _container = new UnityContainer();\n\
  \      // 设置类注册，以便稍后在代码中对它们进行解析。\n      _container.RegisterType<IRepository, Repository>();\n\
  \      _container.RegisterType<ISecurityService, SecurityService>();\n      _container.RegisterType<ISaleRegistrationService,\
  \ SaleRegistrationService>();\n    }\n    public static TProxyType Resolve<TProxyType>()\n\
  \    {\n      return _container.Resolve<TProxyType>();\n    }\n  }\n}\n```\n\n*\
  \ * *\n\n我们的 `SecurityService` 重构为使用 `ServiceLocator`，因此它对 `Repository` 类没有引用。即使\
  \ `SalesRegistrationService` 也重构为使用 `ServiceLocator`，它对其他具体类也没有引用。\n\n现在代码可以编译，但存在一个运行时错误。当\
  \ `Unity` 容器尝试创建 `SecurityService` 时，它发现构造函数上有一个字符串参数。容器不知道如何解析此字符串，因此创建将失败。\n\n\
  这种情况在类需要执行某些设置时经常发生。不过，容器足够灵活，可以使用 `RegisterInstance` 方法处理这种情况。考虑对 `ServiceLocator`\
  \ 构造函数的调整，如 列表 4.14 所示。\n\n### 列表 4.14. 在 Unity 中使用 RegisterInstance\n\n点击此处查看代码图片\n\
  \n* * *\n\n```csharp\npublic static class ServiceLocator\n{\n  private static UnityContainer\
  \ _container;\n  static ServiceLocator()\n  {\n    // 创建我们的容器\n    _container =\
  \ new UnityContainer();\n    _container.RegisterType<IRepository, Repository>();\n\
  \    // 如果类需要设置逻辑，可以先创建并\n    // 将实例注册到容器。\n    var securitySvc = new SecurityService(\"\
  security URL goes here\");\n    _container.RegisterInstance<ISecurityService>(securitySvc);\n\
  \  }\n  public static TProxyType Resolve<TProxyType>()\n  {\n    return _container.Resolve<TProxyType>();\n\
  \  }\n}\n```\n\n* * *\n\n在此段代码中，我们手动创建了一个新的 `SecurityService` 并执行任何必要的设置。然后，我们将该类的特定实例通过\
  \ `RegisterInstance` 方法注册。现在，任何请求 `ISecurityService` 的代码都会获得我们刚刚设置好的同一个 `SecurityService`\
  \ 实例。只要通过 `ServiceLocator` 解析，`RegisterInstance` 就会使该类成为*单例*。换句话说如果所有的 `SecurityService`\
  \ 实例都是通过 `ServiceLocator` 创建的，那么该类就是单例。然而，代码仍然可以手动“new” 出一个 `SecurityService`。\n\
  \n\n\n\n如果你不熟悉单例模式，请现在重新复习一下内容。我们在结构中频繁地使用单例。Web 上上有许多页面对此有极佳的描述，包括维基百科 ([`en.wikipedia.org/wiki/Singleton_pattern`](http://en.wikipedia.org/wiki/Singleton_pattern))\
  \ 和 MSDN ([`msdn.microsoft.com/en-us/library/ff650316.aspx`](http://msdn.microsoft.com/en-us/library/ff650316.aspx))。但请记住，这些示例并没有使用依赖注入，因此它们使用静态类来实现单例。依赖注入容器使我们能够使用单例模式，而无需承担添加静态类的代价。\n\
  \n谈到单例，如果 `Repository` 也是一个单例就很好。没有必要创建该服务的多个版本，因为它不携带任何状态。对注册进行细小的重构就可以让 `Repository`\
  \ 成为单例，如代码列表 4.15 所示。\n\n### 代码列表 4.15. 注册一个单例\n\n点击此处查看代码图片\n\n```csharp\npublic\
  \ static class ServiceLocator\n{\n  private static UnityContainer _container;\n\n\
  \  static ServiceLocator()\n    {\n      _container = new UnityContainer();\n  \
  \    //通过在 RegisterType 调用中添加参数，\n      //我们让 Repository 变成了单例。\n      _container.RegisterType<IRepository,\
  \ Repository>(\n        new ContainerControlledLifetimeManager());\n      // 如果类需要初始化逻辑，可以创建它并\n\
  \      // 将实例注册到容器中。\n      var securitySvc = new SecurityService(\"security URL\
  \ goes here\");\n      _container.RegisterInstance<ISecurityService>(securitySvc);\n\
  \    }\n  public static TProxyType Resolve<TProxyType>()\n    {\n      return _container.Resolve<TProxyType>();\n\
  \    }\n}\n```\n\n通过向 `RegisterType` 方法添加上述参数，我们将 `Repository` 转换为单例。首次调用 `ServiceLocator`\
  \ 来解析 `IRepository` 时，会导致 `Repository` 被创建。所有后续对 `Resolve` 的调用都会返回首次调用创建的 `Repository`。这就是单例的定义。\n\
  \n### 按需服务属性\n\n本书中经常讨论的使用 `ServiceLocator` 的快捷方法是 `OnDemand` 服务属性。这是一种自动解析类的方便方法，而无需担心创建是如何发生的。代码列表\
  \ 4.16 展示了这方面的一个示例。\n\n### 代码列表 4.16. OnDemand 服务属性\n\n点击此处查看代码图片\n\n```csharp\n\
  /// <summary>\n/// 注册产品销售的服务。\n/// </summary>\npublic class SaleRegistrationService\n\
  {\n  protected ISecurityService SecuritySvc\n    {\n      get\n      {\n       \
  \ return _securitySvc ?? (_securitySvc =\n          ServiceLocator.Resolve<ISecurityService>());\n\
  \      }\n    }\n  private ISecurityService _securitySvc;\n  /// <summary>\n///\
  \ 当销售人员完成销售时调用的方法。\n/// </summary>\n  public string CompleteSale(string salespersonUserName,\
  \ Guid productId,\n    int quantity)\n    {\n      // 某些产品的销售受限。\n      // 确保此销售人员允许销售此产品。\n\
  \      if (!SecuritySvc.CanUserSellProduct(salespersonUserName, productId))\n  \
  \      return \"Error - 无权限销售此产品\";\n      // 确保手头足够的产品。\n      var repo = ServiceLocator.Resolve<IRepository>();\n\
  \      var canRemoveFromInventory = repo.RemoveFromInventory(productId, quantity);\n\
  \      if (!canRemoveFromInventory)\n        return \"Error - 库存中产品不足\";\n     \
  \ repo.FinalizeSale(salespersonUserName, productId, quantity);\n      return \"\
  success\";\n    }\n}\n```\n\n如果你查看 `SecuritySvc` 属性的定义，你会看到访问器（getter）检查 `_securitySvc`\
  \ 变量是否已初始化，如果是，则返回该值。如果 `_securitySvc` 变量为 null，则通过 `ServiceLocator` 解析一个新的 `ISecurityService`\
  \ 实例并返回该值。因此，如果你在类中使用 `SecuritySvc` 属性，就可以保证有一个可用的 `SecurityService` 在等待。你不需要在代码中编写操作来解析此服务；只需使用此属性即可。\n\
  \n这种结构这种优点是，如果没有使用服务，就不会创建对该服务的引用。在创建对象时使用 `ServiceLocator` 来解析所有依赖是很常见的。如果这些依赖之一仅在单个方法中使用且该方法从未被调用，那么这就是对资源的浪费。通过使用\
  \ `OnDemand` 服务属性，你只在需要时才创建必要的服务。\n\n这些属性在资源利用上非常方便，且易于使用，以至于我们经常将它们放在父类中供所有子类使用。如果某个类永远不需要某个服务，它就永远不会创建一个，从而浪费了资源。如果同一个子类需要重构以使用新服务，那么该\
  \ `OnDemand` 属性是可以备用的。代码列表 4.17 展示了这方面的示例。\n\n### 代码列表 4.17. 基类中的 OnDemand 服务属性\n\
  \n点击此处查看代码图片\n\n```csharp\npublic class BaseClass\n{\n  protected ISecurityService\
  \ SecuritySvc\n    {\n      get\n      {\n        return _securitySvc ?? (_securitySvc\
  \ =\n          ServiceLocator.Resolve<ISecurityService>());\n      }\n    }\n  private\
  \ ISecurityService _securitySvc;\n  protected IRepository RepositorySvc\n    {\n\
  \      get\n      {\n        return _repositorySvc ?? (_repositorySvc =\n      \
  \    ServiceLocator.Resolve<IRepository>());\n      }\n    }\n  private IRepository\
  \ _repositorySvc;\n}\n/// <summary>\n/// 注册产品销售的服务。\n/// </summary>\npublic class\
  \ SaleRegistrationService : BaseClass\n{\n  /// <summary>\n/// 当销售人员完成销售时调用的方法。\n\
  /// </summary>\n  public string CompleteSale(string salespersonUserName, Guid productId,\n\
  \    int quantity)\n    {\n      // 某些产品的销售受限。\n      // 确保此销售人员允许销售此产品。\n     \
  \ if (!SecuritySvc.CanUserSellProduct(salespersonUserName, productId))\n       \
  \ return \"Error - 无权限销售此产品\";\n      // 确保手头足够的产品。\n      var canRemoveFromInventory\
  \ = RepositorySvc\n.RemoveFromInventory(productId, quantity);\n      if (!canRemoveFromInventory)\n\
  \        return \"Error - 库存中产品不足\";\n      RepositorySvc.FinalizeSale(salespersonUserName,\
  \ productId, quantity);\n      return \"success\";\n    }\n}\n```\n\n在这个示例中，我们不需要为服务声明局部变量；只需使用在基类中定义的属性。这使得在引用服务时开发速度更快，因为你不需要担心调用\
  \ `ServiceLocator` 来初始化属性。\n\n### 注意\n\n使用这种代码结构并不是重构应用程序的要求。它非常方便使用，因为它简化了解析服务的流程，而且当团队学习新技术时，尽可能简化通常是件好主意。\n\
  \n### 单元测试优势\n\n使用服务定位时也有优势。这个话题非常重要，以至于我们专门用了第 3 章 “单元测试”和第 5 章 “在单元测试中使用测试双重对象”来讨论它，但让我们现在来看一个例子。\n\
  \n\n\n\n\n在生产代码中，我们注册各种服务及其接口——例如 `SecurityService`。需要使用 `SecurityService` 的代码通过\
  \ `ServiceLocator` 解析接口，而不知道返回的是哪一个具体类。换句话说，`ServiceLocator` 返回了一个真实的 `SecurityService`，而调用代码并不知道这一点。调用代码只知道它接收到了一个实现了\
  \ `ISecurityService` 接口的对象的引用。\n\n现在想象一下在单元测试中，我们将容器中的该 `SecurityService` 替换为一个同样实现了\
  \ `ISecurityService` 接口的 `TestSecurityService`。调用代码完全感知不到这种区别，并像往常一样 `TestSecurityService`。通过这种方法，我们可以让\
  \ `TestSecurityService` 返回我们想要的任何值，甚至抛出异常，并测试调用代码如何处理不同的场景。`ServiceLocation` 可以开启一个全新的测试可能性世界。我们将在第\
  \ 5 章中详细讨论这个话题。\n\n## 最后的调整\n\n通过 `ServiceLocator`，我们已经几乎奠定了架构的基石。现在，我们只需要调用 `ServiceLocator`\
  \ 的 `Resolve` 方法，就可以在任何需要的地方创建几乎任何需要的类。唯一的要求是该类必须实现一个接口，我们可以通过该接口来解析该类的实例，并且可以消除应用程序中对该类的所有紧耦合。\n\
  \n谈到日常使用时，之前的 `ServiceLocator` 还需要一些增强来满足我们的需求。在实际代码中，`Setup` 方法通常会被移动到名为 `BootStrapper`\
  \ 的独立类中。`BootStrapper` 根据需要配置容器，为 `ServiceLocator` 提供访问支持做准备。\n\n`ServiceLocator`\
  \ 还需要一点小的增强以使其用起来更方便。列表 4.18 显示了 `ServiceLocator` 的生产版本。\n\n列表 4.18. 运行中的 Service\
  \ Locator 和示例 Bootstrapper\n\n点击此处查看代码图片\n\n* * *\n\n```csharp\nusing System;\n\n\
  using Microsoft.Practices.Unity;\n\nnamespace CodeSamples.Ch04_DependencyInjectionPrinciple.Listing18\n\
  \n{\n  /// <summary>\n  /// 为需要访问这些服务的客户端代码提供定位器服务。\n  /// </summary>\n  public\
  \ class ServiceLocator\n  {\n    /// <summary>\n    /// Unity Container 可以解析所需的项。\n\
  \    /// 这在 Bootstrapper 中设置。\n    /// </summary>\n    /// <remarks>\n    /// 将\
  \ getter 设置为私有，以免其他人尝试用它\n    /// 注册东西。强制他们使用 Resolve 方法进行解析。\n    /// Getter 是内部的，以便让测试代码访问。\n\
  \    /// </remarks>\n    public static IUnityContainer Container { internal get;\
  \ set; }\n    /// <summary>\n    /// 创建并返回注册到 T 的类实例。\n    /// </summary>\n    public\
  \ static T Resolve<T>()\n    {\n      return Container.Resolve<T>();\n    }\n  \
  \  /// <summary>\n    /// 创建并返回注册到 T 且使用给定名称注册的类实例。\n    /// </summary>\n    public\
  \ static T Resolve<T>(string pName)\n    {\n      return Container.Resolve<T>(pName);\n\
  \    }\n    /// <summary>\n    /// 创建并返回注册到 T 的类实例。\n    /// </summary>\n    public\
  \ static object Resolve(Type T)\n    {\n      return Container.Resolve(T);\n   \
  \ }\n    /// <summary>\n    /// 将给定对象注册到代理对象 T。\n    /// </summary>\n    public\
  \ static void RegisterInstance<T>(T pObject)\n    {\n      Container.RegisterInstance<T>(pObject);\n\
  \    }\n    /// <summary>\n    /// 将给定对象注册到代理对象 T，并使用给定的发生名称对其进行标记。\n    /// </summary>\n\
  \    public static void RegisterInstance<T>(\n      string pOccurranceName, T pObject)\n\
  \    {\n      Container.RegisterInstance<T>(pOccurranceName, pObject);\n    }\n\
  \    /// <summary>\n    /// 注册给定的代理类型以创建并返回给定类型的类。\n    /// </summary>\n    public\
  \ static void RegisterType<T, U>() where U : T\n    {\n      Container.RegisterType<T,\
  \ U>();\n    }\n    /// <summary>\n    /// 注册给定的代理类型以创建并返回给定类型的类。\n    /// 此实例以便调用者可以访问此特定的实例。\n\
  \    /// </summary>\n    public static void RegisterType<T, U>(\n      string pName)\n\
  \    where U : T\n    {\n      Container.RegisterType<T, U>(pName);\n    }\n  }\n\
  \n  public class BootStrapper\n  {\n    /// <summary>\n    /// 这是入口点，\n    /// 由基类调用。\n\
  \    /// </summary>\n    public BootStrapper()\n    {\n      ServiceLocator.Container\
  \ = new UnityContainer();\n      RegisterControls();\n      RegisterServices();\n\
  \    }\n    /// <summary>\n    /// 注册所有服务。\n    /// </summary>\n    protected void\
  \ RegisterServices()\n    {\n      ServiceLocator.RegisterType<IRository, Repository>(\n\
  \      new ContainerLifetimeManager());\n    }\n    /// <summary>\n    /// 注册控件。\n\
  \    /// </summary>\n    protected void RegisterControls()\n    {\n    }\n  }\n\n\
  \  public interface IRepository\n  {\n    void DoSomething();\n  }\n\n  public class\
  \ Repository : IRepository\n  {\n    public void DoSomething()\n    {\n    }\n \
  \ }\n}\n```\n\n* * *\n\n## 依赖注入\n\n尽管我们没有在重构项目中使用它，但本章如果没有对依赖注入的讨论是不完整的。依赖注入是实现依赖倒置另一种方法。服务定位和依赖注入相似，因为它们都使用\
  \ IoC 容器来创建并返回注册的对象。这两种方法在向调用者交付新对象方面不同。\n\n在服务定位中，我们有一个静态类来访问 IoC 容器，以便应用程序中的任何过程都可以解析它们需要的对象。依赖注入从另一个角度解决这个问题，并通过构造函数参数将依赖注入到对象中。\n\
  \n让我们来看一个可以转换为依赖注入的紧耦合代码示例，如列表 4.19 所示。\n\n列表 4.19 紧耦合代码\n\n点击此处查看代码图片\n\n```csharp\n\
  namespace CodeSamples.Ch04_DependencyInjectionPrinciple.Listing19\n{\n  public class\
  \ Program\n  {\n    public Program()\n    {\n      var parent = new ParentClass();\n\
  \      parent.DoSomething();\n    }\n  }\n\n  public interface IParentClass\n  {\n\
  \    void DoSomething();\n  }\n\n  public class ParentClass:IParentClass\n  {\n\
  \    public void DoSomething()\n    {\n      var dep = new DependencyClass();\n\
  \      dep.DoSomethingElse();\n    }\n  }\n\n  public interface IDependencyClass\n\
  \  {\n    void DoSomethingElse();\n  }\n\n  public class DependencyClass : IDependencyClass\n\
  \  {\n  }\n}\n```\n\n\n\n\n\n```csharp\n    public void DoSomethingElse()\n    {\n\
  \      //执行实际工作\n    }\n  }\n```\n\n这是问题的起点——一个紧密耦合的应用程序，它包含了执行必要工作所需的若干层服务。在这个示例中，依赖关系是在\
  \ `ParentClass` 内部通过“new 化” `DependencyClass` 创建的，从而导致了紧密耦合。依赖注入的工作原理是在构造函数行将依赖项注入到父类中。使用\
  \ `Unity`，依赖注入看起来将类似于列表 4.20。\n\n#### 列表 4.20. 依赖注入示例\n\n点击此处查看代码图像\n\n```csharp\n\
  using Microsoft.Practices.Unity;\n\nnamespace CodeSamples.Ch04_DependencyInjectionPrinciple.Listing20\n\
  {\n  public class Program\n  {\n    public Program()\n    {\n      var container\
  \ = new UnityContainer();\n      container.RegisterType<IParentClass, ParentClass>();\n\
  \      container.RegisterType<IDependencyClass, DependencyClass>();\n      var parent\
  \ = container.Resolve<IParentClass>();\n      parent.DoSomething();\n    }\n  }\n\
  \  public interface IParentClass\n  {\n    void DoSomething();\n  }\n  public class\
  \ ParentClass : IParentClass\n  {\n    private IDependencyClass _dependency;\n \
  \   public ParentClass(IDependencyClass dependencyClass)\n    {\n      _dependency\
  \ = dependencyClass;\n    }\n    public void DoSomething()\n    {\n      _dependency.DoSomethingElse();\n\
  \    }\n  }\n  public interface IDependencyClass\n  {\n    void DoSomethingElse();\n\
  \  }\n  public class DependencyClass : IDependencyClass\n  {\n    public void DoSomethingElse()\n\
  \    {\n      //执行实际工作\n    }\n  }\n}\n```\n\n检查 `ParentClass` 的构造函数行。在这一构造函数行上，注意类的依赖项是被传入的，而不是在类内部解析的。构造函数随后保存了传递给它的服务，以便以后使用。注意构造函数行指定了它们所需的对象的接口，而不是具体类的名称。\n\
  \n让我们检查 `Program` 类的代码，看看对象创建是如何工作的。在注册了所有类之后，我们使用 IoC 容器来解析 `ParentClass` 的实例。Unity\
  \ 扫描类的构造函数行，以查看创建该类需要哪些参数，在此处遇到了 `IDependencyClass` 引用。Unity 然后遍历其注册信息，尝试寻找此接口的条目。如果没有找到，`Unity`\
  \ 将抛出异常。\n\n当 `Unity` 找到此接口的注册时，它会通过再次检查构造函数行并解析任何依赖项来创建注册的对象。此过程将持续进行，直到请求的主类、所有依赖项以及它们的所有依赖项都已解析完毕。此递归树的深度仅限于本地机器的资源。\n\
  \n在依赖注入中，通过将新服务放在构造函数行，可以轻松地将其添加到类。假设 `DependencyClass` 和 `ParentClass` 都需要访问存储库来完成它们的工作。我们将此接口添加到构造函数行中，如列表\
  \ 4.21 所示。\n\n#### 列表 4.21. 三级依赖注入\n\n点击此处查看代码图像\n\n```csharp\nusing Microsoft.Practices.Unity;\n\
  \nnamespace CodeSamples.Ch04_DependencyInjectionPrinciple.Listing21\n{\n  public\
  \ class Program\n  {\n    public Program()\n    {\n      var container = new UnityContainer();\n\
  \      container.RegisterType<IParentClass, ParentClass>();\n      container.RegisterType<IDependencyClass,\
  \ DependencyClass>();\n      container.RegisterType<IRepository, Repository>();\n\
  \      var parent = container.Resolve<IParentClass>();\n      parent.DoSomething();\n\
  \    }\n  }\n  public interface IParentClass\n  {\n    void DoSomething();\n  }\n\
  \  public class ParentClass : IParentClass\n  {\n    private IDependencyClass _dependency;\n\
  \    private IRepository _repo;\n    public ParentClass(IDependencyClass dependencyClass,\
  \ IRepository repo)\n    {\n      _dependency = dependencyClass;\n      _repo =\
  \ repo;\n    }\n    public void DoSomething()\n    {\n      _dependency.DoSomethingElse();\n\
  \      var data = _repo.GetData();\n    }\n  }\n  public interface IDependencyClass\n\
  \  {\n    void DoSomethingElse();\n  }\n  public class DependencyClass : IDependencyClass\n\
  \  {\n    private IRepository _repo;\n    public DependencyClass(IRepository repo)\n\
  \    {\n      _repo = repo;\n    }\n    public void DoSomethingElse()\n    {\n \
  \     //执行实际工作\n      var data = _repo.GetData();\n    }\n  }\n  public interface\
  \ IRepository\n  {\n    string GetData();\n  }\n  public class Repository : IRepository\n\
  \  {\n    public string GetData()\n    {\n      return \"data\";\n    }\n  }\n}\n\
  ```\n\n如果你查看之前列表之间的区别，你会发现唯一的实际变化是在构造函数行中添加 `IRepository` 参数，然后使用该注入的服务。我们不需要在存储库上引入任何紧密耦合。\n\
  \n### 为什么在重构时服务定位更好？\n\n当从开始构建应用程序时，服务定位和依赖注入都是很好的模式。如果你在创建每个类时考虑到注入依赖项，依赖注入工作得非常好。如果你倾向于使用常用的服务定位器，该模式同样有效。\n\
  \n然而，如果你对现有的应用程序进行工程改造，你无法控制已经构建的类。类创建层次结构可能很深，因此要通过容器创建对象，必须一次性注册应用程序中所有的类。注册所有类意味着你为它们都添加了接口，并将使用实例的代码改为使用接口。\n\
  \n让我们来看一个例子。假设我们正在重构在本章开头描述的原始紧密耦合的应用程序。列表 4.22 提供了参考代码。\n\n#### 列表 4.22. 紧密耦合代码\n\
  \n点击此处查看代码图像\n\n```csharp\nusing System;\n\nnamespace CodeSamples.Ch04_DependencyInjectionPrinciple.Listing22\n\
  {\n  /// <summary>\n  /// 主驱动程序的示例。\n  /// </summary>\n  public class Program\n\
  \  {\n    public Program()\n    {\n      var salesRegSvc = new SaleRegistrationService();\n\
  \      salesRegSvc.CompleteSale(\"username\", Guid.NewGuid(), 4);\n    }\n  }\n\
  \  /// <summary>\n  /// 注册产品销售的服务。\n  /// </summary>\n  public class SaleRegistrationService\n\
  \  {\n    /// <summary>\n    /// 当销售人员进行销售时调的方法。\n    /// </summary>\n    public\
  \ string CompleteSale(string salespersonUserName, Guid productId, int quantity)\n\
  \    {\n      //某些产品的销售受限。\n      // 确保此销售人员允许销售此产品。\n      var security = new SecurityService();\n\
  \      if (!security.CanUserSellProduct(salespersonUserName, productId))\n     \
  \   return \"错误 - 无权限销售此产品\";\n      // 确保有足够的库存。\n      var repo = new Repository();\n\
  \    }\n  }\n}\n```\n\n\n\n\n\n```cs\nvar canRemoveFromInventory = repo.RemoveFromInventory(productId,\
  \ quantity);\n\nif (!canRemoveFromInventory)\n  return \"Error - not enough of that\
  \ product in inventory\";\n\nrepo.FinalizeSale(salespersonUserName, productId, quantity);\n\
  \nreturn \"success\";\n\n}\n\n}\n\n/// <summary>\n/// 提供对所有安全访问权限的类。\n/// </summary>\n\
  public class SecurityService\n{\n  /// <summary>\n  /// 决定给定的用户名是否有权访问\n  /// 请求的对象。\n\
  \  /// </summary>\n  public bool CanUserSellProduct(string username, Guid productId)\n\
  \  {\n    //超级用户可以做任何事。\n    if (username == \"SuperSalesPerson\") return true;\n\
  \    var repo = new Repository();\n    if (!repo.IsUserActive(username)) return\
  \ false;\n    return (repo.DoesUserHavePermission(username, productId));\n  }\n\
  }\n\n/// <summary>\n/// 控制与数据库所有交互的存储类。\n/// </summary>\npublic class Repository\n\
  {\n  public bool RemoveFromInventory(Guid productId, int quantity)\n  {\n    //\
  \ 查询数据库以查看是否有足够的库存\n    // 供本次交易。\n    return true;\n  }\n\n  public void FinalizeSale(string\
  \ salesPersonName, Guid productId, int quantity)\n  {\n    // 通过将信息保存到数据库来完成销售，\n\
  \    // 谁卖了产品以及卖数量。\n  }\n\n  public bool IsUserActive(string username)\n  {\n \
  \   // 查询数据库以查看此用户是否活跃。\n    return true;\n  }\n\n  public bool DoesUserHavePermission(string\
  \ username, Guid productId)\n  {\n    // 查询数据库以查看此用户是否有\n    // 足够的权限。\n    return\
  \ true;\n  }\n}\n```\n\n要通过依赖注入解析 `Repository`，我们必须：\n\n- 为 `Repository` 创建一个接口，以便将其添加到\
  \ `SecurityService` 和 `SaleRegistrationService` 的构造函数行中。\n- 为 `SecurityService`\
  \ 创建一个接口，以便它可以被 `SaleRegistrationService` 解析。\n- 为 `SaleRegistrationService` 创建一个接口，以便它可以被程序解析。\n\
  - 在容器中注册所有的类和接口。\n- 重构 `SalesRegistrationService` 和 `SecurityService`，使其在构造函数行注入依赖项。\n\
  - 将 `SecurityService`转换为使用接口 `IRepository` 而不是具体类 `Repository`。\n- 将 `SaleRegistrationService`\
  \ 转换为使用 `IRepository`。\n- 更新应用程序的其他部分，以适应必须更改为接受依赖注入的构造函数。\n\n– 修改构造函数意味着另一个类 `ClassX`（它使用了\
  \ `SecurityService` 并且以前可以轻松创建它）现在也必须创建一个 `Repository` 并传递给 `SecurityService`。记住，`ClassX`\
  \ 尚未转换为使用 IoC 容器，因此我们可以也将其进行转换（这会重新开始整个过程），或者手动创建 `Repository`。\n\n你可以看到，尝试让现有应用程序适配依赖注入是一条漫长而艰辛的道路，往往以“全有或全无”的努力告终。对于你希望在升级过程中持续可用的应用程序一次性进行所有这些更改是不明智的。\n\
  \n现在让我们看看如何使用服务位置模式（service location）而不是依赖注入来转换此应用程序：\n\n**1.** 从简单的 `Repository`\
  \ 开始，因为它是层次结构中较低层之一，且它没有构造函数参数。为该类创建一个接口。注意，我们不需要一次性转换所有类，只需要创建一个接口。\n\n**2.** 将\
  \ `SecurityService` 转换为使用接口 `IRepository` 而不是具体类 `Repository`。\n\n**3.** 将 `SaleRegistrationService`\
  \ 转换为使用 `IRepository`。\n\n**4.** 更新应用程序的其他部分，以适应必须更改为接受依赖注入的构造函数。\n\n\n\n\n\n# 测试双检（Test\
  \ Doubles）是如何工作的？\n\n测试双检的工作原理是将真实的类替换为伪类，该伪类可以在运行时而非设计时创建。通过使用这个伪类，我们可以更改其行为，以执行测试所需的任何操作或返回我们需要的任何值。通过这种方式，我们可以模拟业务逻辑中发生的许多不同情况，而无需费力去设置实际环境。\n\
  \n## 注意\n\n测试双检的一个要求是使用接口。虽然可以为没有接口的类创建测试双检，但这会严重限制双检和测试的能力。在本书中，接口还有许多其他用处，因此需要学到的教训是为你所有的服务以及许多其他类都加上接口。\n\
  \n## 测试双检需要满足什么条件？\n\n双检用武的一个极佳例子是实现存储库（Repository）。我们在上一章中讨论了存储库，并在第 12 章“服务的高级重构”中详细讨论了\
  \ `Repository 模式`。`Repository 模式` 被频繁使用，因为它消除了与特定数据库的紧耦合，使得开发更加容易，并便于更换后端数据存储器。\n\
  \n列表 5.1 中的代码是 `Repository 模式` 的典型示例。我们的业务逻辑使用存储库从数据库中检索用户，对其进行修改，然后将其保存回数据库。\n\n\
  列表 5.1. 存储库示例\n\n点击此处查看代码图片\n\n```cs\nusing System;\n\nusing System.Data.SqlClient;\n\
  \nusing Microsoft.Practices.Unity;\n\nnamespace CodeSamples.Ch05_ClassMocking.Listing01\n\
  \n{\n\n  public class MockingExample\n  {\n\n    public void UpdateUserData()\n\
  \    {\n      var repo = ServiceLocator.Resolve<IRepository>();\n      var user\
  \ = repo.GetUserData(1);\n      user.Name = \"New Name\";\n      repo.SaveUserData(user);\n\
  \    }\n  }\n  public class User\n  {\n    public int Id { get; internal set; }\n\
  \    public string Name { get; set; }\n  }\n  public interface IRepository\n  {\n\
  \    User GetUserData(int pUserId);\n    void SaveUserData(User pUser);\n  }\n \
  \ public class Repository : IRepository\n  {\n    private string _connectionString\
  \ = \"connStringGoesHere\";\n    public User GetUserData(int pUserId)\n    {\n \
  \     var qryString = \"select * from User where id = @id\";\n      var conn = new\
  \ SqlConnection(_connectionString);\n      var cmd = new SqlCommand(qryString, conn);\n\
  \      cmd.Parameters.AddWithValue(\"@id\", pUserId);\n      try\n      {\n    \
  \    conn.Open();\n        var reader = cmd.ExecuteReader();\n        reader.Read();\n\
  \        var usr = new User\n        {\n          Id = (int)reader[0],\n       \
  \   Name = reader[1].ToString()\n        };\n        reader.Close();\n        return\
  \ usr;\n      }\n      catch (Exception)\n      {\n        //do something with the\
  \ exception\n      }\n      return null;\n    }\n    public void SaveUserData(User\
  \ pUser)\n    {\n      var qryString = \"Update user set name = @username where\
  \ id = @id\";\n      var conn = new SqlConnection(_connectionString);\n      var\
  \ cmd = new SqlCommand(qryString, conn);\n      cmd.Parameters.AddWithValue(\"@id\"\
  , pUser.Id);\n      cmd.Parameters.AddWithValue(\"@username\", pUser.Name);\n  \
  \    try\n      {\n        conn.Open();\n        cmd.ExecuteNonQuery();\n      }\n\
  \      catch (Exception)\n      {\n        //do something with the exception\n \
  \     }\n    }\n  }\n  public static class ServiceLocator\n  {\n    private static\
  \ UnityContainer _container;\n    static ServiceLocator()\n    {\n      _container\
  \ = new UnityContainer();\n      _container.RegisterInstance<UnityContainer>(_container);\n\
  \      _container.RegisterType<IRepository, Repository>();\n    }\n    public static\
  \ TProxyType Resolve<TProxyType>()\n    {\n      return _container.Resolve<TProxyType>();\n\
  \    }\n  }\n```\n\n如果我们想为 `UpdateUserData` 方法编写单元测试，它看起来像列表 5.2。\n\n## 列表 5.2.\
  \ 示例单元测试\n\n点击此处查看代码图片\n\n```cs\n[TestClass]\npublic class MockingExampleTest\n\
  {\n  [TestMethod]\n  public void UpdateUserData_WhenCalled_SetsNewName()\n  {\n\
  \    var mockExample = new MockingExample();\n    mockExample.UpdateUserData();\n\
  \    var repo = ServiceLocator.Resolve<IRepository>();\n    var user = repo.GetUserData(1);\n\
  \    Assert.AreEqual(\"New Name\", user.Name);\n  }\n}\n```\n\n在这个测试中需要注意的重要点是，用户信息来自数据库并被保存回数据库。即使是测试也必须访问数据库以断言是否进行了正确的更改。当访问活动数据库时，它会将单元测试转变为集成测试，并引入许多依赖关系，更不用说执行时间了。这个简单的测试现在会让测试变得脆弱。\n\
  \n#### 创建存桩（Stub）\n\n为了打破对数据库的依赖，我们为存储库编写测试双检。这种特定类型的双检被称为 `stub`。列表 5.3 展示了一个存桩的示例以及如何使用它。\n\
  \n## 注意\n\n测试双检的一个要求是使用接口。虽然可以为没有接口的类创建测试双检，但这会严重限制双检和测试的能力。在本书中，接口还有许多其他用处，因此需要学到的教训是为你所有的服务以及许多其他类都加上接口。\n\
  \n列表 5.3. 存储库存桩\n\n点击此处查看代码图片\n\n```cs\nusing System;\n\nusing System.Data.SqlClient;\n\
  \nusing Microsoft.Practices.Unity;\n\nusing Microsoft.VisualStudio.TestTesting;\n\
  \nnamespace CodeSamples.Ch05_ClassMocking.Listing03\n\n{\n\n  public class MockingExample\n\
  \  {\n    public void UpdateUserData()\n    {\n      var repo = ServiceLocator.Resolve<IRepository>();\n\
  \      var user = repo.GetUserData(1);\n      user.Name = \"New Name\";\n      repo.SaveUserData(user);\n\
  \    }\n  }\n  public class User\n  {\n    public int Id { get; internal set; }\n\
  \    public string Name { get; set; }\n    public DateTime LastUpdateDate { get;\
  \ set; }\n    public DateTime CreateDate { get; set; }\n    public User()\n    {\n\
  \      CreateDate = DateTime.Now;\n      LastUpdateDate = DateTime.Now;\n    }\n\
  \  }\n  public interface IRepository\n  {\n    User GetUserData(int pUserId);\n\
  \    void SaveUserData(User pUser);\n  }\n  public class Repository : IRepository\n\
  \  {\n    private string _connectionString = \"connStringGoesHere\";\n    public\
  \ User GetUserData(int pUserId)\n    {\n      // 存桩实现：不访问数据库\n      return new User\n\
  \      {\n        Id = pUserId,\n        Name = \"Stub Name\",\n        CreateDate\
  \ = DateTime.Now,\n        LastUpdateDate = DateTime.Now\n      };\n    }\n    public\
  \ void SaveUserData(User pUser)\n    {\n      // 存桩实现：不访问数据库\n      Console.WriteLine($\"\
  Saving user: {pUser.Name}\");\n    }\n  }\n  public static class ServiceLocator\n\
  \  {\n    private static UnityContainer _container;\n    static ServiceLocator()\n\
  \    {\n      _container = new UnityContainer();\n      _container.RegisterInstance<UnityContainer>(_container);\n\
  \      // 在测试中，这里注册存桩而不是真实的 Repository\n      _container.RegisterType<IRepository,\
  \ Repository>(); \n    }\n    public static TProxyType Resolve<TProxyType>()\n \
  \   {\n      return _container.Resolve<TProxyType>();\n    }\n  }\n}\n```\n\n\n\n\
  \n\n```csharp\ncmd.Parameters.AddWithValue(\"@LastUpdateDate\", pUser.LastUpdateDate);\n\
  \ntry\n{\n    conn.Open();\n    cmd.ExecuteNonQuery();\n}\ncatch (Exception)\n{\n\
  \    //do something with the exception\n}\n```\n\npublic class RepositoryStub :\
  \ IRepository\n{\n    public User StubUser{get;set;}\n    public User GetUserData(int\
  \ pUserId)\n    {\n        //替换代码以从数据库读取\n        //并直接返回一个新的 User 对象。\n       \
  \ if (StubUser == null)\n        {\n            StubUser = new User();\n       \
  \     StubUser.Id = 1;\n            StubUser.Name = \"Brad Irby\";\n        }\n\
  \        return StubUser;\n    }\n    public void SaveUserData(User pUser)\n   \
  \ {\n        // 在此存根中什么都不做\n    }\n}\n\npublic static class ServiceLocator\n{\n\
  \    private static UnityContainer _container;\n    static ServiceLocator()\n  \
  \  {\n        _container = new UnityContainer();\n        _container.RegisterInstance<IUnityContainer>(_container);\n\
  \        _container.RegisterType<IRepository, Repository>();\n    }\n    public\
  \ static TProxyType Resolve<TProxyType>()\n    {\n        return _container.Resolve<TProxyType>();\n\
  \    }\n}\n\n[TestClass]\npublic class MockingExampleTestClass\n{\n    [TestMethod]\n\
  \    public void UpdateUserData_WhenCalled_SetsNewName()\n    {\n        //Arrange\n\
  \        var container = ServiceLocator.Resolve<IUnityContainer>();\n        var\
  \ stubRepo = new RepositoryStub();\n        container.RegisterInstance<IRepository>(stubRepo);\n\
  \        var mockExample = new MockingExample();\n        //Act\n        mockExample.UpdateUserData();\n\
  \        //Assert\n        var repo = ServiceLocator.Resolve<IRepository>();\n \
  \       var user = repo.GetUserData(1);\n        Assert.AreEqual(\"New Name\", user.Name);\n\
  \    }\n}\n```\n\n\n\n\n\n```csharp\n_container.RegisterInstance<IUnityContainer>(_container);\n\
  \n_container.RegisterType<IRepository, Repository>();\n\n}\n\npublic static TProxyType\
  \ Resolve<TProxyType>()\n{\n    return _container.Resolve<TProxyType>();\n}\n\n\
  }\n\n[TestClass]\npublic class MockingExampleTestClass\n{\n    [TestMethod]\n  \
  \  public void UpdateUserData_WhenCalled_SetsNewName()\n    {\n        //Arrange\
  \ - section 1\n        var mockRepo = new Mock<IRepository>();\n        var container\
  \ = ServiceLocator.Resolve<IUnityContainer>();\n        container.RegisterInstance<IRepository>(mockRepo.Object);\n\
  \        //Arrange - section 2\n        var user = new User { Id = 1, Name = \"\
  ReplaceMe\" };\n        mockRepo.Setup(mr => mr.GetUserData(1)).Returns(user);\n\
  \        //Act\n        var mockExample = new MockingExample();\n        mockExample.UpdateUserData();\n\
  \        //Assert\n        Assert.AreEqual(\"New Name\", user.Name);\n    }\n}\n\
  ```\n\n***\n\n在此列表中，你应该注意到 `RepositoryStub` 类已经消失了。我们不再需要那个硬编码的类，因为我们将使用 mock 库（mocking\
  \ library）在运行时创建一个 mock 类。\n\n让我们详细查看一下测试。`Arrange - section 1` 区域的第一行使用 mock 库创建了一个类型为\
  \ `IRepository` 的新 mock 类。这一行代码创建了一个新类，它可以 mock 给定接口上的任何方法或属性。我们将在接下来的几段话中深入探讨如何使用这个\
  \ mock 类，但现在让我们先关注 mock 类的一个的一个属性。该 mock 对象有一个名为 `Object` 的属性，它返回一个实现了 `IRepository`\
  \ 接口的类。这个新对象可以替代应用程序中任何位置的 `IRepository` 类。\n\n默认情况下，这个新类什么都不做；它拥有一个 `GetUserData`\
  \ 方法和一个 `SaveUserData` 方法，但这两个方法中都没有代码，因此如果它们被调用，`GetUserData` 将返回 `null`，而 `SaveUserData`\
  \ 则什么都不做。稍后，我们将自定义这两个方法以实现我们所需的功能。\n\n`Arrange - section 2` 区域是用来设置 mock 以满足当前测试需求的地方。我们首先创建一个新的\
  \ `User` 对象用于测试，并根据需要初始化这些值。然后，我们告诉 mock 存储库：每当应用程序中任何地方的逻辑调用参数为 `1` 的 `GetUserData`\
  \ 方法时，它应该返回我们手动创建的那个用户。我们可以使用这种设置方法来更改接口上提供的任何方法的逻辑。\n\n最后，在 `Act` 中，我们创建了被测试类的实例，并像以前一样调用了\
  \ `UpdateUserData` 方法。我们使用 `Assert` 验证名称已正确更改，测试也就完成了。\n\n通过使用 mock，我们可以替换应用程序中的关键服务，并以最少的精力或自定义代码使它们变得可测试。\n\
  \n#### 第二个 Mock 示例\n\n作为第二个示例，让我们继续处理存储库（repository），但现在让我们测试新更新的 `User` 对象是否真的保存回了数据库中。（在列表\
  \ 5.5 中，所有类都是相同的，为了简洁起见，我们只显示新的测试。）\n\n列表 5.5. 额外的存储库测试\n\n点击此处查看代码图像\n\n***\n\n\
  ```csharp\n    [TestMethod]\n    public void UpdateUserData_WhenCalled_SavesNewDataToDB()\n\
  \    {\n        //Arrange - section 1\n        var mockRepo = new Mock<IRepository>();\n\
  \        var container = ServiceLocator.Resolve<IUnityContainer>();\n        container.RegisterInstance<IRepository>(mockRepo.Object);\n\
  \        //Arrange - section 2\n        var user = new User { Id = 1, Name = \"\
  ReplaceMe\" };\n        mockRepo.Setup(mr => mr.GetUserData(1)).Returns(user);\n\
  \        //Act\n        var mockExample = new MockingExample();\n        mockExample.UpdateUserData();\n\
  \        //Assert\n        mockRepo.Verify(mr => mr.SaveUserData(user), Times.Once());\n\
  \    }\n```\n\n***\n\n除了末部分外，几乎整个测试都是相同的。`Assert` 调用被替换为 mock 存储库上的方法调用。该方法调用断言\
  \ `SaveUserData` 恰好使用参数 `user` 被调用了一次。如果该方法没有被调用或被调用超过一次，此 `Verify` 调用将导致测试失败。此外，如果调用\
  \ `SaveUserData` 方法时使用的是我们创建的用户之外的任何参数，测试也会失败。\n\n该测试的一个方面是，我们假设 `SaveUserData`\
  \ 方法工作正常。我们没有测试数据库以确保数据已到达，只测试该方法是否被调用。测试 `SaveUserData` 是否真的更新了数据库是不合适的。该测试应该放在集成测试（integration\
  \ test）中。\n\n#### 第三个 Mock 示例\n\nMoq 库提供了许多选项，可以让你的测试更具通用性。在上一个示例中，测试寻找 `UpdateUserData`\
  \ 的特定参数。如果我们需要某种通用的东西，我们可以 `Verify` `UpdateUserData` 方法是被带有任何 `User` 参数调用的，而不仅仅是我们创建的那个一个（参见列表\
  \ 5.6）。\n\n列表 5.6. 使用泛参数\n\n点击此处查看代码图像\n\n\n\n\n尽管 `Moq` 模拟框架提供了许多强大的功能，但它也有一些无法实现的功能。`Moq`\
  \ 无法对静态方法和类进行模拟，这也是我们 Try 避免创建静态类的原因之一。然而，当使用内置的 .NET 工具或外部库时，我们无法选择是否将这些类创建为静态。为了解决这个问题，微软发布了一个名为\
  \ `Shims` 的模拟框架，它可以模拟静态类、静态方法、系统类等许多其他内容。\n\n***\n\n### 注意\n`Shims` 是 Fakes 框架的一部分，从\
  \ Visual Studio 2012 开始可用。还有一个名为 `Moles` 和 `Pex` 的类似框架可以为 Visual Studio 2010 下载。\n\
  \n***\n\n要为静态类创建 Mock（微软将这些称为 `Shims`），我们必须先进行一些设置。在这个示例中，我们为位于 `System` 程序集中的 `DateTime`\
  \ 静态类创建一个 `Shim`。打开你的 Visual Studio 测试项目中的 References（引用）文件夹，并右键点击 `System` 程序集。选择\
  \ `Add Moles Assembly`（参见图 5.1）。\n\n![Image](img/00018.jpeg)\n\n图 5.1。 选择 Add Moles\
  \ Assembly 选项\n\n点击此选项会在项目中添加一个名为 `Fakes` 的新文件夹，并在其中包含几个新文件。它还添加了两个新的库引用：`System.4.0.0.0.Fakes`\
  \ 和 `MsCorlib.4.0.0.0.Fakes`。这两个新库使得 Fakes 框架中的 `Shims` 能够运行。\n\n要使用我们新的 `Shims`，我们必须创建一个\
  \ `ShimsContext` 类。该类管理 `Shim` 的生命周期，确保它不会留在内存中。如果我们不限制 `Shim` 的寿命，它将替换我们所有测试中的\
  \ `DateTime` 类。\n\n让我们看看如何使用这个新的 Shim。在之前的示例中，我们使用了一个必须保存到数据库的 `User` 对象。在创建新 `User`\
  \ 对象时，其 `CreateDate` 属性应该被设置为 `DateTime.Now`，但这很难测试，因为 `DateTime.Now` 的值可能会在属性赋值的时间和断言值的时间之间发生变化。参见列表\
  \ 5.7。\n\n列表 5.7。 一个检查 CreateDate 的缺陷测试\n\n点击此处查看代码图像\n\n***\n\n```csharp\n[TestMethod]\n\
  public void Constructor_WhenCreated_SetsCreateDate()\n{\n    // 如果系统时钟在对象创建后发生了变化\n\
  \    // 则此测试可能会失败\n    var usr = new User();\n    Assert.AreEqual(DateTime.Now,\
  \ usr.CreateDate);\n}\n```\n\n***\n\n然而，使用 `Shims`，我们可以重新定义 `DateTime.Now` 方法的返回值，并强制\
  \ `User` 类在创建时其 `CreateDate` 属性带有特定值。参见列表 5.8。\n\n列表 5.8。 使用 Shim 测试 CreateDate\n\
  \n点击此处查看代码图像\n\n***\n\n```csharp\n[TestMethod]\npublic void Constructor_WhenCreated_SetsCreateDate()\n\
  {\n    // 必须创建一个 ShimsContext 才能运行\n    using (ShimsContext.Create())\n    {\n \
  \       // 重新定义 DateTime.Now 返回 1970 年 7 月 29 日\n        var expectedDate = new\
  \ DateTime(1970, 7, 29);\n        ShimDateTime.NowGet = () => expectedDate;\n  \
  \      // 此测试不再可能失败\n        var usr = new User();\n        Assert.AreEqual(expectedDate,\
  \ usr.CreateDate);\n    }\n}\n```\n\n***\n\n在这个测试中，我们重新定义了 `DateTime.Now` 属性 Getter\
  \ 的返回值，尽管它是基类上的静态方法。通过这种方法，我们可以将内置的 .NET 方法替换为我们自己的版本，创建任何我们需要的测试场景。\n\n### 更多关于测试替身（Test\
  \ Doubles）的信息\n\n使用测试替身是重构项目中的关键工具，我们这里没有足够的空间来详细介绍这个丰富的测试工具。我建议你花些时间学习 `Moq`。\n\
  \n#### 总结\n使用测试替身是重构项目中的关键工具，我们这里没有足够的空间来详细介绍这个丰富的测试工具。我建议你花些时间学习 `Moq`。\n\n在本章中，我们讨论了如何通过引入测试大幅提高质量。测试替身、模拟（mocking）和桩（stubs）都是可以实现功能的强大工具。\n\
  \n# 第二部分：重构\n\n## 6. 初始审查\n\n计划如何重构系统的第一步是理解当前系统的状态。在急于开始工作或由于客户要求尽快开始更改的压力下，很容易跳过这一步。然而，这样做可能会阻碍你在整个项目中做出决策的能力。\n\
  \n在开始项目之前，对代码有一个感性是非常重要的，因为你必须在整个过程中做出许多决定。除非你有宽裕的截止日期或较小的代码库，否则没有时间充分研究每个决定，因此你必须依靠你的直觉。\n\
  \n在进行初始审查时，最好的起点是系统的最基本单元。在 C 中，这是 `Main` 方法。在 C# 中，这是 `Program` 类。其他语言也有类似的入口点。寻找主入口并从那里开始跟踪代码。\n\
  \n#### 分析代码\n\n本节为你提供了几个在此阶段需要回答的问题。列出想法列表，然后扫描代码以查看它们是如何实现的。注意它们是否在范围内都以相同的方式实现，还是每个想法在每情况下都以独特的方式实现。标准化是快速且顺利重构项目的关键组件，因此如果同一个想法以不同的方式实现，这意味着你应该增加时间估计。\n\
  \n例如，要寻找的主要内容之一是如何实现数据访问的。在代码中随机打开五个不同的数据输入表，并带着这些访问问题扫描代码。没有必要为每个问题构建完整的方法调用列表或堆栈跟踪。然而，创建一个参与每个过程的类列表，对于以后尝试估算给定的重构任务的影响非常有帮助。这对于规模较大的系统（超过\
  \ 50 个 Visual Studio 项目）特别是如此，因为很容易忘记涉及了哪些类。\n\n通过回答这些问题，你可以在问题发生之前更好地预测重构问题。这些只是启动过程的示例问题。当你调查这些问题时，应该记录你注意到的并在项目期间记住的其他问题。\n\
  \n#### 基础架构\n\n问自己以下问题：\n\n\n\n\n- 新的业务流程是如何启动的？是否存在一个中心节点来处理启动新流程的请求？如果存在处理这些操作的中心节点，将使应用程序的重构变得容易。类似的流程启动逻辑分散在整个应用程序中，将使架构的中心化变得困难。\n\
  - 每个业务流程是否都有与之关联的 UI，或者流程是否可以完全在后台启动并执行？完全在后台运行的进程是多线程启动方案的候选对象。如果你发现某个进程没有关联的 UI，请额外注意该进程是否会以异步方式启动。如果是的话，这些方法的重构可能需要更长时间。\n\
  - 是否有可以启动业务流程的外部链接，它是如何运作的？允许外部进程在遗留系统中启动活动将使得追踪完成某项操作所需的系列活动变得困难。\n- 是否有进程需要感知系统中的其他进程？例如，是否需要锁定某些数据，以便每次只有一个人可以进行编辑。理想情况下，这些限制可以在重构过程中被移除。\n\
  - 数据输入表单是如何创建和显示的？它们是如何被销毁的？创建和销毁数据输入表单应该在中心位置进行。如果不是，重构为中心进程可能会非常耗时。这些活动分散在遗留代码中也会导致难以确定以通用方式启动进程的模式。\n\
  - 如果发生了本地代码未处理的错误，它会发生什么？错误是如何被处理并显示给用户的？记录错误以便以后分析是重要的，如果错误在许多不同的地方被处理，将使这项任务变得困难。\n\
  - 如果遗留语言支持泛型类（generic classes），有多少个，它们是做什么的？泛型是一个强大的工具，但有点抽象。如果使用了它们，检查它们的使用是否恰当，可以洞察到原始架构师的整体水平。\n\
  \n## 代码结构\n\n问问自己以下问题：\n- 对象模型中是否存在大量的继承？对象模型中广泛的继承会使低层级对象变得脆弱，因为父类中某个看似微不足道的更改可能会影响低层级类。\n\
  - 表单的继承树有多高？数据对象的树有多高？表单的继承特别棘手，因为 `Visual Studio` 中的视图设计器可能难以在设计模式下渲染视图。通常，只有一两层继承的表单就会导致视图设计器失败。\n\
  - 是否存在递归，递归是否有必要？递归方法难以调试且难以有效使用。如果有很多递归，请在项目时间表中增加额外时间。\n- 有多少个静态类？静态类很难重构为我们的目标架构，因此遗留系统中有很多静态类是说明需要延长时间的指标。\n\
  \n## 数据库访问\n\n问问自己以下问题：\n- 每个数据输入表单是否以其自己的方式获取数据，还是存在某种模式？\n- 数据库连接在哪里管理？它们是共享的吗？\n\
  - 新数据库行是如何创建的？创建新的数据库记录通常是一个问题。特别棘手的用例是用户创建了一个新行然后取消了创建。理解目前是如何实现的，对于理解应用程序中的通用数据流至关重要。\n\
  - 数据验证在哪里进行？是在每个 UI 表单中还是中心化的？通常数据验证是零散且手动的。了解目前在何处进行数据验证有助于制定重构为更易管理的中心化验证引擎的计划。\n\
  - 数据验证是否使用了特定的模式（如 `Microsoft Validation Application Block`）、第三方库，还是自建的？\n\n## 数据结构\n\
  \n问问自己以下问题：\n- 数据本身在数据库或平文件中的结构是否得当？\n- 如果数据结构不有效，是要求在重构期间更改结构，还是应该留到第一版本之后？你针对这个问题所做出的决定会影响你的大部分项目计划。最好的做法是在开始重构之前做出决定。\n\
  - 是否每个行都有单一主键，还是键是由多个字段组成的？复合键使得重构结构变得困难，并是说明需要向计划增加时间的信号。\n- 是否可以以通用方式处理这些实体？如果是这样，这个过程会变得复杂；它是如何处理的？在遗留代码中，这种做法是更容易消除紧密耦合。\n\
  - 是否可以更改组件的主键？如果是这样，这个过程会变得复杂；它是如何处理的？如果存在这种情况，最好在重构过程中将其移除。\n- 遗留代码是否使用了对象关系映射\
  \ (`ORM`)？使用 `ORM` 是更容易消除紧密耦合的良好信号。\n- 如果系统没有使用 `ORM`，是否存在数据模型？是否存在一个让业务实体继承的基类，该基类包含哪些属性和方法？拥有一个让业务实体继承的基类可以让以通用方式管理这些实体变得容易得多。\n\
  \n## 外部接口\n\n问问自己以下问题：\n- 代码是否向其他系统导入或导出数据？\n- 外部数据是否有数据验证？这种数据验证在哪里发生？\n- 外部接口是实时的还是批处理的？\n\
  - 外部系统位于何处（Web、本地网络还是本地）？\n- 如果目标是针对 Web 进行重构，代码在哪里假设资源在本地网络？这很难发现，但这些假设通常发生在数据访问期间。\n\
  \n## 应用程序控件与表单控件\n\n问问自己以下问题：\n- 是否工具栏按钮、菜单项等控件适用于整个系统，而其他控件特定的当前的活动表单。\n- 这两种思想是分开的，还是重叠的？\n\
  - 处理应用程序级过程（如 `文件 > 打开`）的代码是在中心位置还是在单个表单中？\n\n#### 分析通用代码结构\n\n通常，任何代码库都可以分为大类：核心代码（或中心架构）和支持代码。核心代码是系统的主要驱动器，通常控制如何处理用户请求、如何显示新窗口并在请求时提供数据。设计良好的核心代码往往从系统的许多地方调用，并应该以通的方式处理。核心代码不应该感知系统的状态，并且可以在不知道当前状态的情况下履行职责。\n\
  \n在遗留系统中，你很少发现核心与支持代码之间有良好的分离。核心操作与 UI 及其他组件混在一起，以至于将它们分开非常困难。这种自由结构难以处理，因为在开始重构核心代码之前，需要对核心代码的所有实现方式进行大量的研究。\n\
  \n例如，创建和显示新窗口是一个应该在核心中实现的函数。核心进程通过某种 UI 组件（菜单项、按钮等）接收特定窗口的请求。核心创建该窗口并将其显示给用户，而无需知道窗口的用途或原因。核心不需要理解请求该窗口，只需要知道某个进程需要它。这是理想的情况，但在需要重构的系统中很少发现。\n\
  \n\n\n\n大多数系统都有一个主窗口，为所有操作提供“主页”。这是一个单一窗口，承载了主工具栏、菜单以及显示的任何其他数据输入表。这被称为 `shell`（外壳）。通常，在\
  \ `shell` 中，你会发现用于创建和显示其他窗口以执行特定任务的代码。打开这些二级窗口的代码，查看它们是否反过来创建并显示了更多窗口，或者它们是否会以某种方式向\
  \ `shell`（或其他组件）发送请求进行处理。\n\n### 注意\n请记住，在这一阶段，我们试图对系统有一个大致的印象。我们需要了解我们正在处理的是什么类型的代码库，而不需要在分析上花费过宝贵的时间。由于需要，我们必须在不完全检查所有组件的情况下对代码质量做出某些判断。做出这种直觉判断往往违背工程师的本性，但在开始处理一个陌代码库时，这是在所必须的。（这是重工程项目中最令人沮丧的部分之一。）\n\
  \n最好的办法是为这一步设定一个时间盒（time-box，即限制花费的小时数）。一个合理的时间盒是一到三天，取决于系统的大小。对于一个包含约 150 个项目和\
  \ 200 万行代码的大型解决方案，可能需要三天；请与已经熟悉系统的首席开发人员合作。\n\n如果二级窗口层级的代码会创建并显示更多窗口，这表明你以后在提取架构模式时会遇到困难（因此应该增加你的时间估算）。创建良好的核心代码需要原始设计者的规划和勤奋。如果你发现核心代码仅集中在少数类中，说明该系统在最初实现时经过了良好的规划。将核心分散分散许多不同的区域是完成特定任务的简单方法，但它会产生结构性问题，因此这表明系统的架构设计得不好。\n\
  \n在一个核心代码分散在不同模块中的系统上工作，会影响你的重工程，因为它让你难以识别出创建和显示窗口的整体模式。识别出这种模式是必要的，因为当重工程完成后，我们应该有一组小小的中心类，负责创建所有窗口、正确设置这些窗口并将它们显示给用户。如果这些中心代码散落在整个应用程序中，那么集中逻辑的路径将变得更长、更困难。\n\
  \n#### 管理语言迁移\n从一种语言重工程到另一种语言是一项艰巨的任务。如果旧代码不属于 `.NET` 家族，可能需要重写而不是重工程应用程序。为了做出这一决定，请查看旧代码语言，并看是否可以调用\
  \ `.NET` 的方法。在重工程过程中，我们尝试每次只更改一个部分，以便系统在整个项目中持续运行。为了做到这一点，我们必须始终在旧系统和新代码之间保持连接，这通常通过对\
  \ `DLLs` 调用方法来实现。大多数语言都提供了定义调用 `DLL` 入口点的方法。如果没有，要么是不可，要么是这样做太麻烦，你必须在 `.NET` 中重写应用程序。\n\
  \n请注意，在不同的 `.NET` 语言之间进行方法调用不需要特殊的努力。例如，从 `VB.NET` 调用 `C#` 方法与调用另一个 `VB.NET` 函数或子程序没有区别。`VB.NET`\
  \ 代码以正常方式创建给定的类并调用该方法。\n\n### 注意\n通过重工程努力从一种开发范式转移到完全不同的方法是困难的。例如，试图通过重工程现有代码从函数式编程方法转向面向对象是徒劳的。你必须将旧代码作为功能规范，并从头开始编写代码。遗憾的是，有时“你无法从这里到达那里”。\n\
  \n删除 死代码\n从旧系统中删除死代码可以限制必须检查和转换的代码，从而简化重工程过程。如果旧系统使用的是 `.NET` 语言（如 `C#` 或 `VB.NET`），可以在重工程开始时集中精力删除，也可以在整个重工程过程中遇到死代码时删除。`Visual\
  \ Studio` 中的死代码检测工具使得这种识别和删除过程变得简单。\n\n当从非 `.NET` 语言（如 `VB6`）迁移到 `C#` 或 `VB.NET`\
  \ 时，删除任何死代码都更加困难。取决于旧系统的开发环境，识别死代码可能是一项艰巨的任务，但尽可能识别它们是值得的。死代码不仅在转换过程中浪费我们的时间，还可能通过暗示某些功能存在但实际上未被使用而掩盖系统的结构。\n\
  \n在搜索和删除这些死代码时，最好在已经建立起整洁构建和测试过程的旧环境中进行。在从旧语言重工程的过程中尝试识别死代码有产生许多问题的风险。\n\n#### 使用全局变量\n\
  从旧语言转换时需要特别注意的一个特定点是全局变量。在 `COBOL` 是主导语言的时代，几乎所有地方都使用全局变量是很的。全局变量是绕过阻止模块共享信息的架构问题的简单方法，但它们让系统变得难以理解，因为它们为所有使用该数据的组件引入了紧耦合。当变量可以从代码的任何部分更新时，在调试时也很追踪逻辑流。拥有大量的全局变量会让你的重工程项目花费比需要更长。\n\
  \n如果可以替换全局变量，最好这样做，但这不是强制要求的。一种可以帮助转换得更快的简单重构是：重构单个方法调用，将全局变量传入。换句话说，忽略方法可以访问全局变量的事实，并将其传递给方法，以便该方法可以将其视为局部。这在稍后使用自动化转换工具和创建单元测试时非常有帮助。\n\
  \n例如，查看 `Listing 6.1` 中的代码。\n\n```csharp\nnamespace CodeSamples.Ch06_InitialSolution.Listing01\n\
  {\n    public static class GlobalVarExample\n    {\n        //假设此变量在旧应用程序\n    \
  \    // 某处被声明为全局变量。\n        public static string GlobalVar = \"value goes here\"\
  ;\n    }\n\n    public class BusinessLogic\n    {\n        public void DoWork()\n\
  \        {\n            //调用一个需要全局变量才能运行的方法。\n            DoWorkNeedingGlobalVar();\n\
  \        }\n\n        public void DoWorkNeedingGlobalVar()\n        {\n        \
  \    //使用全局变量来做一些工作。\n            var x = GlobalVarExample.GlobalVar + \"!\";\n\
  \        }\n    }\n}\n```\n\n现在考虑 `Listing 6.2` 中稍稍重构的代码。\n\n\n\n\n\n## 列表 6.2.\
  \ 使用局部变量的重构代码\n\n点击此处查看代码\n\n```csharp\nnamespace CodeSamples.Ch06_InitialSolutionReview.Listing02\n\
  {\n  public static class GlobalVarExample\n  {\n    //假设此变量在遗留应用程序的某处\n    //被声明为全局变量。\n\
  \    public static string GlobalVar = \"value goes here\";\n  }\n  public class\
  \ BusinessLogic\n  {\n    public void DoWork()\n    {\n      //调用一个需要全局变量才能运行的方法。\n\
  \      DoWorkNeedingGlobalVar(GlobalVarExample.GlobalVar);\n    }\n    public void\
  \ DoWorkNeedingGlobalVar(string globalVar)\n    {\n      // 使用全局变量执行某些工作。\n    \
  \  var x = globalVar + \"!\";\n    }\n  }\n}\n```\n\n在此示例中，我们将全局变量传递给方法，而不是使用全局版本。请注意，这种重构的结果在功能上与之前的版本相同，因此仅需进行粗略测试。然而，这种小小的重构使得方法更容易迁移到你的目标语言，而且更容易进行单元测试，因为我们不需要访问全局变量。\n\
  \n对于会修改全局变量的方法，重构的复杂性取决于遗留语言。通常，对于修改全局变量的方法，直接处理该变量比对其重构更简单。但是，如果你的情况需要通过重构来传递全局变量，在\
  \ C# 中有一种实现方法，这种技术也可能适用于你的遗留系统。如 列表 6.3 所示，你可以在方法调用中使用 `out` 参数将修改后的值传回给调用者。\n\n\
  ### 列表 6.3. 使用 `out` 参数重构的更新全局变量\n\n点击此处查看代码\n\n```csharp\nnamespace CodeSamples.Ch06_InitialSolutionReview.Listing03\n\
  {\n  public static class GlobalVarExample\n  {\n    //假设此变量在遗留应用程序的某处\n    //被声明为全局变量。\n\
  \    public static string GlobalVar = \"value goes here\";\n  }\n  public class\
  \ BusinessLogic\n  {\n    public void DoWork()\n    {\n      //调用一个需要全局变量才能运行的方法。\n\
  \      DoWorkNeedingGlobalVar(GlobalVarExample.GlobalVar,\n      out GlobalVarExample.GlobalVar);\n\
  \    }\n    public void DoWorkNeedingGlobalVar(string globalVar,\n      out string\
  \ updatedGlobalVar)\n    {\n      // 使用全局变量执行某些工作。\n      updatedGlobalVar = globalVar\
  \ + \"!\";\n    }\n  }\n}\n```\n\n如果被迫重构方法以更新传入的变量，我们可以通过两次传递它来实现。理想情况下，我们只需简单地将\
  \ `globalVar` 参数标记为 `out` 参数，但在其初始化之前尝试使用 `out` 参数会导致编译错误。为了规避这个问题，我们两次传入全局变量：一次在方法体内部使用，另一次作为传递新值的通道。在之前的代码中，请注意\
  \ `GlobalVarExample.GlobalVar` 在 `DoWorkNeedingGlobalVar` 方法中同时被用作输入参数。\n\n这种 C#\
  \ 解决方案远非理想，应该尽快移除，但如果你必须重构一个方法以传递可编辑的全局变量，这种方法可以完成任务。\n\n即使你没有现代的重构工具，执行这些重构也相当容易。只需通过添加额外的参数更改方法签名并编译代码。通过在所有构建失败的函数调用处添加此全局变量，可以轻松修复编译问题。\n\
  \n### 代码转换：并非全有或无\n\n在进行初始方案审查时，请记住，重构项目并不需要转换所有的遗留代码。对于部分代码，一种可能的选择是将其留在遗留语言中，并从重构的代码中调用这些例程。\n\
  \n代码可能存在某些复杂且难以重现的部分。如果这些部分也不太可能改变，那么你应该考虑将其留在遗留语言中，并使用 .NET 对其进行封装。封装效果良好的特定实例是当你有一个不太可能改变的\
  \ ActiveX 控件时。先对其进行封装，稍后再处理转换问题。但请记住，这可能会影响应用程序的安装。组件编写时语言的辅助运行时必须安装在机器上。这不是一个不可逾越的问题，但它确实让安装过程变得更加复杂。\n\
  \n### 使用自动化代码转换工具\n\n在考虑将遗留代码转换为现代基础设施的时间表时，计划使用自动化代码转换工具是很有吸引力的。市场上有多种工具（包括免费和付费）声称能够从一种语言转换为另一种语言，且之后仅需少量清理。实际上，这取决于你从哪种语言转换。\n\
  \n许多重构项目从 VB6 开始。它曾是一种非常流行的语言，用于生成高质量的业务系统，因此这种类型的转换工作很常见。遗憾的是，从 VB6 转换为 .NET 是一个困难的过程。因为\
  \ VB6 不是面向对象的，设计系统时使用的基本范式不同。将过程化代码转换为面向对象的代码非常耗时，因为你必须重新检查系统运行的基本原理，以挑选出合适的对象及其行为。这不是自动化工具可以胜的任务。\n\
  \n然而，自动化工具在 VB6 重构项目中仍有一用武之地。在 VB6 中实现的大部分业务逻辑不会改变，因此实现这些逻辑的具体方法可以引入新代码库，作为新代码的起点。例如，列表\
  \ 6.2 中用于演示重构全局变量的代码示例是语言转换器的良好候选对象，因为该函数是完全自包含的。\n\n\n\n\n\n如果你想尝试使用代码转换器来提升项目进度，首先请将旧留系统的源语言升级到最新版本。例如，如果从\
  \ VB6 转换为 VB.NET，请先确保你拥有最新版本的 `Visual Studio 6`。在线翻译工具假设你正在使用源语言的最新版本，如果事实如此，它们可能会产生不准确的翻译。试图通过跳过这一步来节省时间或金钱，可能会导致之后在修复转换后的代码时付出更大的代价。\n\
  \n在你确定代码已经是最新版本之后，下一步是对旧代码进行一些基础清理。让旧代码尽可能易于被自动翻译器处理。如果你在同一行上声明了多个变量，请将它们拆分成不同的行。此外，将任何动态类型变量改为强类型声明。这在迁移到\
  \ `C#` 时尤为重要，因为 `C#` 中的变量是强类型的（如果将旧变量改为强类型困难或不方便，你可以在 `C#` 中使用 `dynamic` 关键字来复制源语言中的弱类型变量）。如果使用\
  \ VB，请在旧代码中设置 `option explicit` 选项并确保它可以通过编译。\n\n在更新编译器并对旧留系统完成小型重构后，在新语言中创建相应的类，并翻译\
  \ `VB6` 中实现给定逻辑段所需的每个方法。逐个将这些方法通过转换器并清理代码。请注意，尽管这听起来很简单，但清理生成的代码工作量有时如此巨大，以至于变得不切。我建议对大约十个不同的方法尝试这个过程，看看它对你的情况是否有帮助。如果没有，你可能被迫重写这些方法。\n\
  \n***\n\n### Note\n\n如果你正从 VB6 迁移到 .NET，Dennis Hayes 在 *.NET Developer’s Journal*\
  \ 中写了一篇非常好的文章，位于 [`tinyurl.com/7xttoqj`](http://tinyurl.com/7xttoqj)。\n\n***\n\n\
  ### 使用数据访问技术\n\n数据访问技术在过去几年发生了巨大的变化。持久化数据的可能性比以往任何时候都要多，而且这些数据可以使用不同的方式处理。理解旧留应用程序如何存储数据对于重构工作至关重要，因为这种数据访问方法在过程中可能会发生显著变化。\n\
  \n需要完成两个主要任务：\n\n-   检测数据模型\n-   检测数据访问模式\n\n#### 检测数据模型\n\n`data model`（或业务模型，或简单称为模型）是封装了应用程序逻辑的业务实体集合。`business\
  \ entity`是一个类，其属性反映了存储在数据库（或正在使用的任何数据持久化技术）中的信息。\n\n例如，假设你的应用程序有一个“人”的概念，并且需要跟踪这个人的数据。你可能在旧代码的某处有一个类，看起来与\
  \ Listing 6.4 所示类似。\n\nListing 6.4. 示例业务实体\n\n点击此处代码图像\n\n***\n\n```csharp\nnamespace\
  \ CodeSamples.Ch06_InitialSolutionReview.Listing03\n{\n  public class Person\n \
  \ {\n    public string Id { get; set; }\n    public string Name { get; set; }\n\
  \    public string Address1 { get; set; }\n    public string Address2 { get; set;\
  \ }\n    public string City { get; set; }\n    public string State { get; set; }\n\
  \    public string Zip { get; set; }\n  }\n}\n```\n\n***\n\n这个 `Person` 类是一个业务实体（我们称之为实体）。通常，每个实体都有属性，反映了保存它们的的数据库表中的列或字段。如果你的旧留应用程序使用扁文件进行数据存储，则实体类包含了存储在文件中所有的属性。\n\
  \n当数据从磁盘读取时（无论是从扁文件还是数据库），会创建这些实体类并根据这些数据进行填充。你可能会看到与 Listing 6.5 所示相似的代码。\n\nListing\
  \ 6.5. 填充业务实体的代码\n\n点击此处代码图像\n\n***\n\n```csharp\nusing System;\nusing ADODB;\n\
  namespace CodeSamples.Ch06_InitialSolutionReview.Listing05\n{\n  public class Person\n\
  \  {\n    public string Id { get; set; }\n    public string Name { get; set; }\n\
  \    public string ManagerName { get; set; }\n  }\n  public class Repository\n \
  \ {\n    public Person LoadFromDatabase(string personId, ADODB.Connection conn)\n\
  \    {\n      var cmd = new ADODB.Command();\n      cmd.ActiveConnection = conn;\n\
  \      cmd.CommandType = CommandType.adText;\n      cmd.CommandText = \"SELECT Id,\
  \ Name, ManagerName FROM Person WHERE Id = \" + personId;\n      object rs = cmd.Execute(out\
  \ dummy);\n      if (!rs.EOF)\n      {\n        var person = new Person();\n   \
  \     person.Id = rs.Fields[\"Id\"].ToString();\n        person.Name = rs.Fields[\"\
  Name\"].ToString();\n        person.ManagerName = rs.Fields[\"ManagerName\"].ToString();\n\
  \        rs.Close();\n        return person;\n      }\n      rs.Close();\n     \
  \ return null;\n    }\n  }\n}\n```\n\n***\n\n这段代码从数据库中提取原始数据并将其复制到类中供系统使用。如果你看到类似这里的代码，说明存在数据模型。这是一个很好的信号，意味着你可以根据需要更方便地更改数据库。直接修改\
  \ ADO 的应用程序要困难维护和处理得多。\n\n#### 检测数据访问模式\n\n书中稍晚部分详细讨论的模式之一被称为存储库模式（Repository pattern）。这是一种安全、可扩展且方便访问数据的方法。你应该查看是否已经在使用存储库。请注意，如果你在上一步中没有找到数据模型，那么很可能也没有存储库。\n\
  \n要确定你的应用程序是否使用了存储库，请扫描解决方案寻找从磁盘读取数据的方法。这些可以是数据库读取，也可以是扁文件读取，但数据需要通过某种方式从长期存储传输到应用程序中。\n\
  \n\n\n\n如果遗留应用没有存储库（repository），最好将其重构为使用 `Repository Pattern`（存储库模式）进行数据存储。这使得在目标语言中的重构过程变得更加简单。然而，这种重构并非易事，因此通常会将其留到新语言的主要重构工作中进行。根据你应用程序的规模，如果你估计重构现有应用以使用存储库所需的时间少于总重工程时间的\
  \ 1%，那么你应该在旧代码中进行此项工作。否则，请计划对转换后的代码进行重工程。\n\n#### 总结\n\n本章带你熟悉了审查需要进行重工程的解决方案的必要步骤。我们讨论了如何分析解决方案的基础架构、代码和数据结构、外部接口以及应用程序控制。我们介绍了在重工程过程中如何处理全局变量问题的技术，同时为删除这些变量做计划。最后，我们介绍了关于如何识别不同类型的数据访问模型的相关技术，以及如何将它们转换为更符合我们面向服务架构（`SOA`）的内容。\n\
  \n在下一章节中，我们将继续进行规划过程，通过分析遗留应用并尝试对不同的转换过程进行时间估算。\n\n## 7. 项目规划\n\n管理重工程项目与管理其他类型的开发项目略有不同。重工程项目结合了从零构建和增强现有系统中最困难的部分，因为架构师不仅必须管理目标结构，还必须确保实现该架构所需的所需的更改不会破坏当前应用程序。\n\
  \n在本章中，我们将讨论管理常规开发项目与管理重工程项目之间的差异。\n\n#### 管理预期\n\n规划和管理重工程项目，最重要的方面是管理管理层和客户的预期。习惯于从零构建应用程序的经理，或习惯于向现有系统添加功能的经理，会期望某种功能开发的特定速度，而这种速度在重工程项目中是不可能的。这是因为重工程人员需要引入底层架构元素，而这些元素对于不开发系统的人来说是不可见的。由于用户看不到这些增强，因此很难向管理层展示已取得的进展。\n\
  \n例如，添加一个依赖注入容器（dependency injection container）并不是用户经常请求的功能，但它确实让系统变得更容易维护，并在后期增强了系统，同时也为更高质量铺平了道路。这是系统结构上的巨大改进，但用户社区或管理层并没有看到这种改进的证据。期望看到应用程序变化的经理可能会对这种表象上的进展缺失而感到担忧。\n\
  \n解决这一潜在陷阱的唯一方法是从一开始就设定真实的预期，告知管理层负责重工程架构的团队部分正在取得重大进展，尽管这些进展可能是不可见的。他们的工作以后将以更快的功能周转和更高质量的形式获得回报。未能设定这些预期可能会导致管理层对“缺乏进展”感到沮丧并扼杀项目。\n\
  \n### 组建重工程团队\n\n在规划团队配置时，考虑由两个独立的团队在同一个项目上协作会很好。最初，有一个团队只负责重工程工作，而团队的其他部分继续按正常方式构建功能。随着时间的推移，这两个团队慢慢开始分担责任，因为重工程部分的团队回归功能开发，而功能部分的团队也开始重工程现有代码。在项目中期，团队将合并为一个团队，每个人都参与功能开发和剩余遗留代码的重工程。\n\
  \n最初，团队的重工程部分由架构师和一名高级开发人员组成，因为重工程工作的早期不需要许多开发人员。事实上，增加更多人员可能会使工作变得复杂。\n\n让我们逐章检查我们项目的规划和人员配置需求。\n\
  \n#### 识别开发工具和构建过程\n\n在执任何对遗留系统进行任何更改之前，应该建立支持开发过程的基础设施。这包括在尚不存在的情况下引入版本控制系统、缺陷跟踪应用程序、持续集成构建服务器以及面向开发人员的各种工具。这些工具是任何项目（而不仅仅是重工程项目）设计良好的开发过程的一部分，因此它们应该在重工程正式开始之前引入。\n\
  \n识别要使用的工具并进行安装不需要一个大型团队，但尽可能从许多团队成员那里征求意见是明智的，以鼓励他们对所选技术的采纳。选择工具的团队应努力尽可能少地改变当前的工作流程。这使得团队更容易适应，并减少了拒绝任何新工具的风险。\n\
  \n这些工具的安装和配置的技术挑战是微乎其道的，实际的实施任务只需要几天时间。识别使用哪种工具可能是一个更困难的决定，通常需要几周时间。然而，这些早期更改中最耗时且困难的部分可能是让团队改变其流程。\n\
  \n每个团队，无论大小，都按照自己的节奏和工作模式执行或为此挣扎。在引入新工具时，需要考虑这些模式并将其整合到团队中。如果这些流程引入得不当，且对其益处的解释不足，就会存在新流程和工具被团队拒绝的明显危险。\n\
  \n除了让团队接受新流程的困难外，引入本节建议的某个或所有项目也可能花费团队大量时间将其整合到正常的开发常规中。在此过程中会出现失误和被遗忘的流程，因此项目经理或架构师必须耐心，让团队适应新想法。\n\
  \n#### 引入版本控制\n\n首次向团队引入版本控制，虽然在技术上是一项微不足道的任务，但由于为了有效使用版本控制而必须采用迥然不同的工作流程，它往往会变成一项艰巨的任务。这是功能良好的团队工作流的基础部分，任何没有使用版本控制的团队可能还没有建立适当的流程，因此强制执行它所需的更改是困难的。\n\
  \n例如，我们有一位客户，其开发人员使用 `RemoteDesktop` 控制运行 Web 应用程序的服务器，并在需要上需要更新实时代码。开发人员必须同时处理同一个代码文件，在此过程中偶尔会覆盖对方的工作。这可能被视为在团队环境中工作的缺点，每个人必须接受有时会丢失工作的事。\n\
  \n\n\n\n我们建议对代码使用中央版本控制服务器，以便每位开发人员都能在自己的机器上工作，从而避免更改冲突。这一建议遭到了阻力，因为它要求每位开发人员都在本地机器上加载数据库，这会导致后续对数据库结构的更新变得更加困难。此外，对于禁止访问服务器上的运行代码的想法也遭到了阻力，因为“我们该如何调试应用程序呢？”\n\
  \n我们通过分阶段引入的方法，使团队采纳了使用版本控制的实践。我们首先保留了现有的工作流程（所有人直接更新服务器），但从服务器将更改提交到版本控制中。这为团队提供了版本控制功能，使得开发者可以在需要时检索之前的代码版本，但并不会干扰他们当前的工作流。\n\
  \n我们让一位有影响力的开发者将代码检出到他的本地桌面并在那里进行开发，然后按照正常流程将代码提交到版本控制中。他很快发现了不再与其他开发者竞争源文件的优势，并且能够更快速地完成开发任务。随后，他向团队传了版本控制流程如何让他的工作变得更轻松，其他成员也就更愿意接受新的工作流了。\n\
  \n如果你的团队还没有建立版本控制，你可能需要花费大量时间在系统重工程的技术部分开始之前修复工作流。不要低估这项任务所需的时间和精力。\n\n## 引入缺陷跟踪\n\
  \n引入缺陷跟踪系统通常非常容易，因为开发团队可能已经在以某种手动方式跟踪他们的缺陷了。将数据输入系统所需的额外工作流步骤通常不会影响整体流程或生产力。\n\n\
  源于对引入缺陷跟踪的阻力可能来自团队成员，他们假设自己会根据归因于自己的缺陷数量来被衡量。他们将缺陷跟踪视为管理层衡量每个独立开发人员质量的方式，以及利用这些信息进行纪律措施的。\n\
  \n虽然缺陷跟踪系统收集的数据确实可以用于此类目的，但这样做对士气是有害的。这可能会导致大量的精力浪费在试图决定谁应对某个特定缺陷负责，这也会使成员产生防御心理。\n\
  \n在引入缺陷跟踪系统时，要竭尽全力地让团队知道，统计数据将仅用于衡量`团队`性能，而不是`个人`性能，而且这些衡量结果将用于帮助团队表现得更好，而不是为了惩罚任何人。这一信息必须由团队负责人和高层频繁且公开地重复，以建立团队的信心。\n\
  \n## 安装和使用持续集成 (CI) 服务器\n\n持续集成服务器（`CI server`）是一种软件，每当有新代码提交时它会自动构建应用程序。`CI server`\
  \ 接收到开发者已提交新代码的通知，然后拉取最新的代码集并尝试进行构建。如果应用程序构建失败，将向整个团队发送一条错误消息，指示哪次提交破坏了构建。\n\n如果构建成功，`CI\
  \ server` 然后将运行与代码相关的所有单元测试。如果任何测试失败，构建被认为已损坏，此时会再次向所有团队成员发送电子邮件，列出导致构建损坏的提交者的人员姓名。运行这些测试是成熟构建过程的关键部分。\n\
  \n技术熟练开发团队很少会抵制安装和使用 `CI server`。`CI servers` 可以改变团队运作方式，因为引入破坏性更改（breaking change）变得比以前更加明显且公开了。因此，技能较低且责任心不强的开发者对这种改变的抵制力最大。\n\
  \n引入 `CI server` 最困难的部分是让团队将构建失败视为一个高优先级的问题。在刚引入 `CI server` 时，团队忽略失败的构建是很常见的现象。团队负责人应该以作表率，亲自走动并跟进提交破坏性更改的团队成员，以确保其被及时修复。\n\
  \n协助采纳的另一种方法是在冲刺（sprint）期间开始构建失败的数量，并在冲刺评审会议上检查这个数字。最好是以团队为单位进行统计，而不是按个人。只有当团队持续忽略构建失败时，才按个人进行跟踪。\n\
  \n引入 `CI server` 的结果之一是给产生更高质量的代码施加了压力。当在团队中破坏构建变得不可接受时，那些在提交前未运行测试（导致破坏构建）的开发者将被鼓励采用新实践。\n\
  \n关于 `CI servers` 和构建过程的更多信息，Martin Fowler 在这里有一篇很好的文章：http://martinfowler.com/articles/continuousIntegration\n\
  \n## 清理旧方案\n\n旧方案的清理应该在版本控制系统建立后进行（如果尚未建立版本控制，那是首要任务），但可以与 8 章中的“开发工具和构建过程”任务并行进行。清理工作可以涉及整个开发团队或一部分，取决于项目进度。让整个团队参与旧方案的清理通常是引入重工程想法的好方法，并向开发团队展示改进正在发生。\n\
  \n旧方案清理阶段的计划应由团队负责人制定，但由所有成员执行。在开始修改旧代码之前，团队负责人应该向现有开发者普及所采取的清理操作类型。由于这些开发者在重工程期间仍在旧系统中构建功能，缺乏教育会导致无休止的清理循环。\n\
  \n分阶段的方法通常是有效的，即向开发团队展示一些新实践，然后进行清理工作。完成后，再展示并开展另一项。记住，这里的目标不仅是清理旧方案，还要教开发团队如何编写更好的代码。\n\
  \n### 建立基础\n\n基础的建立由架构师和高级开发完成，而其他成员负责清理旧系统。引入依赖注入容器、服务定位器和其他基础设施元素在将它们整合到代码中之前，不会影响旧系统，因此将它们放入解决方案不会产生任何潜在问题或缺陷。这些初始元素涉及的文件和类很少，因此让许多开发者参与其中可能会适得其反。\n\
  \n如果你使用书中推荐的所有工具和版本，无论应用程序规模如何，实现基础工作应该花费不到一周的时间。\n\n\n\n\n\n这一阶段是团队培训最的时期。应该确保所有团队成员都理解新模式并接受变更的必要性。如果项目在没有经过适当培训的情况下进展得过快，团队成员会对新模式感到困惑和无所措，从而无法充分贡献。这可能导致团队中的某些成员拒绝新模式并继续按照旧模式进行开发，使重构工作变得更加困难和耗时。\n\
  \n## 重构以使用基础服务\n\n重构以使用基础服务在技术上并不困难，但可能会花费大量时间。它需要审查现有的遗留代码，并实现使应用程序更易使用和更新的新模式。\n\
  \n由于此阶段涉及对遗留代码首次更新，架构师应紧密参与代码更改。核心团队应仅由几位经验丰富的开发者组成，除架构师外可能还有两三个人。这使得架构师能够确保团队成员恰当地地实现新功能。同时也让架构师和团队有机会对可能需要的模式进行任何更改。这些最初的团队成员将成为其他开发人员的布道者和导师，因此他们需要理解新技术的优势。\n\
  \n这一阶段也是开发团队其他成员被引入重构过程的阶段。核心团队接手每个服务，并重构部分现有遗留代码以使用它。在核心团队重构了新服务的五六种实现，并为了适应特定情况做了任何必要的更改后，其余的重构工作应交给团队的其余成员，并提供关于如何实现新模式的特定说明。由于这可能是团队首次接触依赖注入和服务位置定位，开发者可能需要帮助来学习如何应用这些模式。\n\
  \n这一阶段的重点是让整个团队不断更新引入的新技术和模式。今天用一种方式做某事，明天又用另一种方式，且不预警告正在实施更改，这对开发者来说可能是一种令人沮丧的经历。这种不确定性会引发对新模式的不信任，并使引入必要的变更变得困难得多。\n\
  \n单元测试可能在此阶段首次引入，这可能会导致很多困惑。如果这是你的团队第一次看到单元测试，请预留足够的时间让团队成员理解如何构建这些测试以及它们对应用程序产生的影响。对单元测试不熟悉的开发者通常需要架构师投入更多关注，以确保他们以正确的方式创建必要的测试。模拟（Mocks）让这变得更加困难，因为它们不是一个容易理解的概念，而且从开始就需要它们来正确测试某些类。\n\
  \n引入单元测试还为代码提交时的构建失败创建了新的方式。这可能是一个巨大挫败感的主要来源，因为对该流程不熟悉的开发者只想“把代码提交进去”，但必须先修复所有损坏的单元测试。一个常见的争论围绕在谁“真正”负责单元测试并确保其正常运行上。如果开发者在最近引入单元测试的区域没有做任何更改，而某些看似无关的测试崩溃了，该开发者可能会拒绝承担做出必要更改的责任。团队负责人需要强调，无论单元测试失败的原因是什么，任何提交必须通过所有测试。\n\
  \n在引入单元测试时，也需要管理管理层的预期。虽然单元测试可以极大提高代码质量和后续系统变更的速度，但编写这些测试需要时间。有单元测试的情况下，新代码的开发比没有测试时要慢，特别是在首次引入测试所需的各种框架时。此外，为现有代码添加测试覆盖在管理层看来可能像是在浪费时间，因为这些工作没有产生任何额外的功能。\n\
  \n在与管理层讨论这些话题时，一个很好的衡量标准是：QA 团队对于单元测试覆盖的代码与无覆盖的代码相比捕获了多少缺陷，以及捕获这些缺陷需要多少 QA 时间。你会发现，尽管开发时间增加了，但\
  \ QA 时间应该减少。更重要的是，开发时间只在编写测试时增加一次，而 QA 时间在后续每次产品发布都会减少。此外，对于具有单元测试覆盖的代码，QA 捕获的缺陷数量应该大幅下降。\n\
  \n## 重构以使用高级服务\n\n到这一阶段，整个开发团队都应该参与到重构过程中。特殊的重构团队应该与普通团队合并，这样开发任务不再被认为属于某一个或另一个团队。\n\
  \n这一阶段对团队来说可能是痛苦的，因为这里引入了比前一阶段更抽象、更难理解的服务。这些服务使得应用程序看起来比以前更复杂，那些看不见长期收益的人会产生抵触。应该留心向团队教授新结构的优势，并尽可能获得团队的共识。\n\
  \n可以首先引入仓库和数据验证，让团队习惯通过依赖注入和服务定位器使用重要服务。区域（Region）管理器是一个更难引入的话题。要让整个团队理解区域的概念通常非常困难，更不用说接受它了。\n\
  \n## 向利益相关者报告进度\n\n通常，选择重构而不是重写是因为应用程序需要在持续发布新功能的同时，更新为更好的结构。这是一个合理的预期，如果项目要成功，可以使用书中的方法来实现，但必须适当管理客户和管理层的预期。\n\
  \n从头到尾，一个不包含功能增强的重构项目（即停止发布类似于重写）花费的时间和资源比重写少。然而，重构的一个主要优势是在可以在重构阶段继续发布新功能的能力。将重构工作与持续的功能增强相结合，可能会导致重构端到端的时间比重写更长。这可能是高层管理焦虑的来源。通常，在完成\
  \ 50% 的进度点之后，你会开始听到关于项目耗时太长、只完成了一半，以及如果我们从头重写，现在早就该完了的评论。\n\n\n\n\n尽管重构使得持续交付成为可能，但功能交付的速度会放缓。需要管理客户的预期，不要让他们期望功能引入的速度能保持正常水平。通常，每个版本中新功能数量的减少可以通过营销和销售部门在与客户沟通时进行管理。然而，一个聪明的项目经理或架构师会投入精力与客户部门保持联系，查看他们是否收到了任何负面反馈，以及是否在私下向客户承诺了某些特定功能。无论重构项目的进展多么顺利，重要客户的严厉投诉都可能导致整个项目偏离轨道。\n\
  \n## 管理沟通与培训\n\n沟通和培训是任何重构项目的重要组成部分。重构引入了范围广泛的代码更改和新的开发实践；如果团队不适应这些构建软件的新方法，这些努力将会失败。\n\
  \n培训的频率和深度取决于团队的态度以及他们是否接受新方向。对于一个渴望采用新方法的团队，每周一次或每两周一次的会议来审查即将发生的变更可能足够了，因为团队成员会努力学习并采用新流程。然而，一个不情愿的团队可能需要更频繁的会议以及对每位开发人员的个人关注，以确保他理解并采用新流程。此外，两类团队都需要频繁进行代码审查，以确保尽早发现并纠正对新模式的不当使用。\n\
  \n架构师不应低估使重构项目成功所需的时间和精力。小组培训和一对一会话对于管理重构项目至关重要。\n\n#### 总结\n\n重构项目比构建新系统的项目更复杂。如果开发流程的基础（版本控制、缺陷跟踪、CI\
  \ 服务器、单元测试等）尚未就绪，就必须投入时间和精力在这些工作上，尽管这些工作改进了环境，但并没有为产品添加任何新功能。所需的大部分工作对用户是不可见的，因此对于那些不熟悉流程的人来说，看起来似乎缺乏进展。可能需要广泛的培训和行为改进，以培训团队掌握正确的程序，而对流程不熟悉的管理层则可能会产生不现实的预期。\n\
  \n所有这些潜在的陷阱都可以通过适当的规划和预期管理来避免。\n\n## 8. 识别开发工具和构建过程\n\n重构遗留应用程序是一个困难的过程。然而，通过正确的工具，大部分工作可以实现自动化，使任务变得更容易、更快且更愉快。本章将讨论有助于帮助你的重构项目成功的工具和流程。\n\
  \n#### 使用版本控制\n\n版本控制是任何软件开发项目（无论是否为重构项目）都必须具备的工具。版本控制是一种通过版本号保存应用程序代码的方法，这样任何文件的任何版本都可以被检索到。在开始编辑代码之前，拥有一个版本控制系统是至关重要的，这样如果你做了导致任何故障的更改，你都可以随时回滚到之前的版本。版本控制对于重构项目是不可或缺的，因为某些重构工作可能会出错。使用版本控制系统使你能够在不担心丢失更改或引入缺陷的情况下进行实验。这个工具对于单个开发者来说很重要，但如果你有一个团队在同一个代码库上工作，那么它就更为重要，因为它提供了一个所有代码都可以自动合并的单一区域，这样你就不会丢失任何工作。\n\
  \n市场上有多许多版本控制系统，所有主要的系统在保存代码版本方面都做得很好。有些在大型团队中表现更好，另一些在分布式团队或开源项目上表现出色，还有一些则侧重于速度和易用性。选择哪一个完全取决于你，但拥有一个是至关重要的。本章稍后在评估托管服务的章节中列出的三个系统已经在实际项目中使用过，因此我们可以看到每个系统的优缺点。每一个都是极佳的选择，但根据你的情况，一个可能比另一个更合适。\n\
  \n#### 版本控制的类型\n\n有两种主要的版本控制系统可用：集中式和分布式。在集中式系统中，某处有一台中央机器负责保留代码的副本、处理更新请求、处理提交请求并保留历史。项目的当前版本和历史仅存储在该服务器上，任何想要获取代码副本或对其进行更改的人都必须在该服务器上拥有适当的权限。\n\
  \n另一方面，分布式版本控制（DSC）系统更加灵活。在 DSC 系统中，代码分布在项目的所有开发者之间。每个开发者都拥有仓库的完整副本，包括历史和文件。更改在开发者的本地代码副本上进行，然后（如果需要）与中心点合并。技术上并没有要求必须持有所有代码和历史的中央服务器，但这个中心服务器通常是为了让工作流更简单。\n\
  \n集中式和分布式系统的一个显著区别是代码历史所在的位置。在集中方案中，有一个主服务器持有所有代码和历史。要查看某个文件的历史，用户必须请求服务器显示历史；从用户本地工作站的信息无法确定。在分布式系统中，项目参与者拥有包括历史在内的仓库完整副本。如果\
  \ DSC 系统的用户离线并请求应用程序的完整历史，可以立即交付。\n\n在分布式系统中，为了拥有代码的单一权威来源，开发团队同意将单一源作为主分支。该分支要求提交者具有适当的权限，以便只有授权人员才能提交更改。在开发期间，更改被创建并提交到每个开发者的本地仓库副本中。当开发者对更改满意时，他一次性将增量更改提交到中心仓库。\n\
  \n通过示例，过程会变得更加清晰。在以下描述中，我们假设开发者具有执行我们描述的操作的适当权限。在分布式和集中式系统中，都可以锁定代码以便只有授权人员可以访问。\n\
  \n#### 流程示例：使用分布式系统\n\n假设你刚刚加入一个使用分布式系统的开发团队。团队负责人告诉你好代码主分支的统一资源标识符（URI），你将其拉取到本地机器上。\n\
  \n当你被分配一个要实现的功能，你决定最好分成五个不同的步骤进行。当你对代码进行更改时，仅将每个步骤提交到你自己的本地仓库。团队中的其他人无法看到你的更改。如果你想让别人对你进行代码审查，你可以告诉他们这些更改在你本地机器上的位置，以便他们拉取你仓库的副本。\n\
  \n\n\n\n\n由于你只对本地仓库进行更改，因此提交带有构建错误的代码不会影响团队的其他成员。此外，单元测试由你根据自己的决定何时运行（而不是在集中式构建服务器上运行），因此测试失败不会影响他人。请注意，你必须定期根据他人提交到主分支的更改来刷新你的本地仓库。如果你不进行刷新，在尝试将更改提交回主分支时，将会遇到合并冲突。从主分支刷新后，你的代码中出现的任何冲突都由你负责解决。\n\
  \n## 注意\n\n合并冲突是指两个开发人员更改了同一个代码文件，且这些更改相互冲突。稍后提到的所有版本控制系统都具有合并功能，如果更改是兼容的，它们可以合并两个编辑过的文件。例如，如果一个开发者在文件顶部添加了一个方法，而另一个开发者在底部编辑了一个方法，那么这些更改是可以合并的。然而，如果这两名开发者更改了同一行代码，合并工具将不知道选择哪一个版本，并生成合并冲突。冲突发生的概率会随着提交之间间隔时间的增加而增加，因此分布式系统可能会导致问题。\n\
  \n在对本地仓库进行大量更改和提交后，你认为你的功能已经可以给他人使用了，因此你将本地仓库与位于团队约定 URI 的主分支进行合并。如果你没有权限与主分支合并（开源软件中通常是如此），你可以向管理员发送电子邮件并提供你本地仓库的\
  \ URI，以便管理员审核你的更改并将其合并到主分支。在你的更改合并到主分支后，你刷新本地副本并开始开发下一个功能。请注意，在这种工作流中，整个功能是一次性进入主分支的，而不是在开发过程中逐个进入。\n\
  \n#### 第二个流程示例：使用分布式系统\n\n分布式系统存在另一种可能的流程，这在集中式系统中是不存在的。任何开发人员都可以决定是否想要启动并发布自己的“主（main）”分支。在这种情况下，开发者从集中式系统获取代码副本进行工作。这个副本变成了主分支。在开发新功能之前，他从本地的\
  \ `Main` 分支创建一个新的 `MyFeature` 分支，这样两者都位于同一台本地机器上。\n\n完成新功能的开发后，该开发者将更改合并到他的个人主分支，然后通过向感兴趣的相关发送电子邮件并告诉他们他个人主分支存放的位置来发布该分支。该开发者还可以搜索他人发布的补丁，并选择性地将这些补丁合并到他的主分支。此功能允许单个开发人员同时处理多个功能，而不会导致一个功能干扰另一个功能。\n\
  \n#### 第三个流程示例：使用集中式系统\n\n现在让我们看看使用集中式系统的流程。当你刚加入小组时，你会获得一个中央仓库的 URI。使用该 URI，将代码副本拉取到你的本地机器。\n\
  \n如之前，将你的功能拆分为五个不同的步骤。在处理每一步时，你将更改保存到本地机器。然而，当每一步完成后，你会将代码检回到中央服务器。这意味着如果另一个开发者刷新了他的代码，他将获得你的更改。因此，在提交代码到版本控制系统之前，你需要确保你的代码可以构建并通过所有单元测试。\n\
  \n在提交第一步的代码后，继续开发你的功能，并在每一步之后提交代码。在提交最后一步的代码后，你的功能已完全实现，你可以转向下一个功能。\n\n在这一开发过程中，像使用分布式系统时一样，继续从主分支刷新你的本地代码副本是明智的。这有助于避免合并冲突，并在发生冲突时限制必要的重做工作量。\n\
  \n## 理解集中式系统和分布式系统的优缺点\n\n集中式和分布式系统运行良好，并都能通过检索代码以前版本的能力确保你的代码安全。它们各有优劣。\n\n####\
  \ 消费他人的共享代码\n\n相比集中式系统，分布式系统更容易共享代码更新。分布式系统的用户可以将他人的特定补丁合并到自己的代码版本中，对本地版本进行自定义。\n\
  \n这种过程在集中式系统中可行，但更困难。基于集中式系统自定义应用程序需要更多的人工操作，因为他人发布的单个补丁必须手动应用到本地代码中。在应用并提交到主分支后，它与导入的代码之间没有联系。如果你导入到代码中的功能进行了更新，你必须手动应用这些更新。\n\
  \n如果你想消费他人的代码并保持这些代码最新，请选择分布式系统。如果你想消费他人的代码但希望保持其静态（在你测试并运行正常之后，你不关心后续的更新），请选择集中式系统。\n\
  \n#### 与他人共享代码并审查更改\n\n如果你构建了想要与他人共享的代码，主要的决策点是你想要从那些外部开发人员那里获得多少投入。信任未知的开发人员直接更新你的代码可能会导致大量回销更改的工作。在这种情况下，实施初步审查结构来评估更改的质量是明智的。这在分布式系统中要容易得多。\n\
  \n如果你将成为系统的主要看门员，并且对他人的提交不感兴趣，无论是分布式系统还是集中式系统运行良好。\n\n如果你担心他人获取代码并创建他们自己的主分支，集中式系统无法阻止这一点，但它确实使其变得困难。完全防止这种事的唯一方法是从根本上不共享代码。\n\
  \n#### 代码备份\n\n分布式系统鼓励在本地系统中累积更改的代码，直到功能完全准备好合并到主分支。集中式系统在整个开发周期内将这些更改收集在一个地方。\n\
  \n如果你网络上的本地机器没有频繁备份，并且你担心硬件故障导致工作丢失，请使用集中式系统，对仓库的提交存储在服务器上（我们假设服务器有更严格的备份流程）。如果这对你来说不是问题，无论是分布式系统还是集中式系统都可以。\n\
  \n#### 管理提交频率\n\n无论使用哪种类型的系统，频繁提交代码都是良好的做法。每次提交代码时，你都保存了一个还原点，这样如果你的下次开发工作由于某种原因出错，你不需要尝试手动撤销更改。你可以轻松地恢复到上一个保存点并重新尝试。例如，在构建功能时，当我们每完成一个想要保留的重大步骤时，我们都会提交代码。这导致每天大约五次或更多。\n\
  \n\n\n\n使用集中式系统强制要求提交（check-ins）处于能够构建并通过单元测试的状态。这并不是技术上的限制，而是由团队执行的。如果一次提交无法构建，而另一位开发者刷新了他的代码，那么第二位开发者也会面临构建失败，并且必须浪费时间去弄清楚原因。在分布式系统中，情况并非如此，因为可以将小型提交提交到本地仓库中，而这不会影响团队。\n\
  \n分布式系统在不需要要求提交必须构建或通过单元测试方面，可以提供轻微的时间和代码安全方面的优势。\n\n## 管理合并冲突\n\n在“提交频率”这一硬币的另一面是合并冲突问题。从刷新主分支到提交新代码之间经过的时间越长，发生合并冲突的概率越大。解决合并冲突需要消耗大量的时间和精力，因此应该尽可能避免。\n\
  \n那些反对提交的代码必须通过单元测试的开发者，往往倾向于长时间不从主分支刷新自己的代码。这会导致大量的合并冲突，且非常耗费时间。\n\n如果你的团队由于长时间未从主分支刷新代码而导致产生大量的合并冲突，使用集中式系统可能会有所帮助。\n\
  \n#### 管理控制\n\n贯穿之前几个主题的一个共同点是控制。你想要对你的源代码和开发团队拥有多少控制权？分布式系统提供了一个松散控制的环境，个人的开发习惯和纪律对整体流程的影响更大。集中式系统对代码和开发者施加更多控制，以实施你希望团队遵循的流程。这两种方法都是有效的，并且彼此具有对方的优势。\n\
  \n## 关于优缺点的结语\n\n因此，每种类型的版本控制系统都有其优缺点。你选择的类型在很大程度上取决于团队动态、你正在构建的软件类型（开源或商业）以及你想要对代码行使的控制程度。\n\
  \n## 评估托管服务\n\n下一节列出的所有版本控制选项都可以作为本地安装或托管服务提供。这里显而易见的权衡是便利性与安全性。如果你担心有人可能尝试窃取你的源代码，或者你不信任托管服务能够妥善地备份其数据，你可以在自己的防火墙内安装版本控制服务器。这为防止代码被窃或由于硬件故障导致的代码丢失提供了额外保护（假设你的内部网络管理员正在良好地管理服务器）。如果你没有这些顾虑，有很多非常好的托管服务，可以在几分钟内让你的源代码仓库运行起来，对于小型项目，这通常是免费的。\n\
  \n在众多可能的托管服务中做出决定时，请确保提供商有足够的带宽来支持你、你的团队以及它的其他客户。带宽不足会导致你的代码更新变慢，并增加自动化构建服务器构建代码的时间。由于自动化构建服务器可以配置在构建之前拉取所有代码，因此拥有响应快速的托管服务至关重要。\n\
  \n还要询问托管服务多久备份一次其服务器上的数据。他们应该至少每天备份一次代码仓库，最好每小时一次。有些服务会提供向你发送包含所有历史的仓库备份，如果你想在本地保留一份的话。\n\
  \n## 使用 Apache Subversion (SVN)\n\nApache Subversion（或 `SVN`）是一种常见的系统，适用于大小团队，且表现良好，并在支持分布式团队方面表现出色。它易于使用，并且与\
  \ Visual Studio 集成得很好。`SVN` 是一个集中式系统，因此必须托管在贵公司内部或托管站点。Subversion 的代码是开源的，因此可以轻松地安装在自己的数据中心内。\n\
  \nSubversion 服务器是由命令行驱动的，但有一个名为 `TortoiseSVN` 的图形化界面，它集成得非常好，以至于几乎无法区分。如果你选择为仓库使用\
  \ `SVN`，`TortoiseSVN` 是必不可少的。它集成到 Windows 资源管理器中，在屏幕上显示哪些文件夹由 `SVN` 管理。当文件夹内的文件发生变化时，这些指示器会改变，让你知道有更新等待提交。\n\
  \n使用 `TortoiseSVN` 可以很容易地更新本地代码副本并提交更改。只需在代码所在的文件夹中点击右键，即可获得基本的 `TortoiseSVN` 菜单。可以使用免费下载的实用程序\
  \ `AnkhSVN` 将 `SVN` 集成到 Visual Studio 解决方案资源管理器中。\n\n## 使用 Microsoft Team Foundation\
  \ Server (TFS)\n\nMicrosoft Team Foundation Server (`TFS`) 是微软发布的一种集中源码控制系统，因此它与\
  \ Visual Studio 深度集成。`TFS` 和 `SVN` 在维护更新文件列表方面采取不同的方法。`SVN`并不尝试控制你在编码期间如何编辑文件。当需要提交更改时，`SVN`\
  \ 会扫描文件夹并寻找不同的文件。相反，`TFS` 会监控你在 Visual Studio 内部编辑话期间的所有操作，并跟踪你编辑的文件。当你接触每个文件时，`TFS`\
  \ 就会自动在服务器上将文件标记为“使用中”。\n\n这种方法让任何人都能看到其他人是否正在编辑某个文件，这有助于避免合并问题。经理也可以看到人们正在处理哪些文件。\n\
  \n实时文件跟踪还使得锁定功能变得更加主动。`SVN` 具有锁定功能，允许开发者锁定某个文件，从而防止其他人提交该文件，但不能阻止他们编辑它。在 `SVN` 中锁定文件可能会导致问题，因为需要更改锁定文件的开发者可能不知道锁定状态，可以对其进行更改但无法提交。而\
  \ `TFS` 则从源头上阻止第二个开发者编辑它。\n\n`TFS` 中一个实用的功能是“搁存（shelf）”。在编辑代码时，你可以将其搁存在 `TFS` 中，这本质上是将其提交到一个临时区域。这确保了代码在服务器上是，但还没有合并到主分支。开发者还可以将这些搁存集共享给其他人，这在一个开发者需要向另一个人交接功能时非常有用。第一个开发者可以将所有代码放入搁存并共享给后者，后者可以完成并提交。\n\
  \n`TFS` 的另一个重要功能是内置的缺陷跟踪。`TFS` 拥有内置数据库，可以跟踪内部 QA 或其他人报告的缺陷。这些缺陷随后可以分配给开发者进行修复。当修复准备好提交时，代码集可以与缺陷直接关联。`TFS`\
  \ 对其他任务也有类似的跟踪，例如功能开发或文档创建，这些任务可以分配给相应人员。`TFS` 还支持计算代码更改率，这是一种通过提交更改的数量计算的代码库质量衡量标准。随着功能集接近发布，提交到版本控制的更改将会减少。\n\
  \n`TFS` 的优势在中等规模团队（5-20 人）中变得更加重要，在更大的团队中更为如此。换句话之，随着解决方案的增长，项目和团队的管理变得更加复杂，而 `TFS`\
  \ 比其他产品提供了更多的团队管理功能。\n\n## 使用 Git\n\n`Git` 是一个流行的分布式系统。Linus Torvalds 在 BitKeeper（曾托管\
  \ Linux 内核）被改为付费服务时创建了它。\n\n\n\n\n与其他分布式源码控制系统一样，它也非常适合探索性开发，即在你想要跟踪已做过的工作但又不想将其提交到主分支时。它允许你向本地机器进行提交，稍后将其合并到主分支。\n\
  \n`Git` 的一个特别具有吸引力的功能是可以通过电子邮件发送更改。如果你是一个开源项目的管理员，并且收到了许多关于应用程序新增的建议，你可能希望在将它们合并到主分支之前对其进行审核。通过\
  \ `Git`，为项目贡献代码的开发者可以通过 `Git` 生成一封邮件，其中编码了所有相关的更改。管理员可以使用 `Git` 导入这封邮件，并将所有更改应用到本地仓库。审核后，这些更改可以被拒绝或合并到主分支。\n\
  \n对于习惯于使用 `CVS` 源码控制客户端的贡献者，`Git` 提供了一个接口，使其与这些客户端集成，因此开发人员无需学习新的流程。\n\n### 管理功能和缺陷\n\
  \n管理功能和缺陷的系统也是任何开发项目的关键工具。无论项目有多小或多简单，都会出现缺陷，而在没有帮助的情况下，很难追踪这些缺陷。市场上有很多免费和付费的系统，其范围从基础适用到极度自定义。拥有缺陷追踪系统是无价的，因为你在重构现有系统时会遇到许多问题，并且无法在发现问题时立即处理它们。你必须有一个地方可以记录下你看到的问题，稍后再回来修复它们。\n\
  \n市场上有这么多缺陷追踪系统，很难在这里推荐其中某一个。然而，需要向不同的供应商提出某些特定问题，以确保它们满足你开发流程的需求。\n\n#### 管理自定义工作流\n\
  \n更高级的缺陷追踪系统允许能够适应你团队的自定义工作流。例如，一个小团队可能完全不需要工作流；`QA` 和开发人员都可以将缺陷的状态设置为他们认为合适的任何值。较大的公司可能希望确保\
  \ `QA` 是唯一可以将缺陷标记为“已关闭”（Closed）的部门，因此他们希望执行这种工作流。大型公司可能希望强制缺陷首先路由到开发部门，然后是 `QA`，然后是文档部门，最后关闭。\n\
  \n这些以及许多其他选项都是某些缺陷追踪系统可以支持的工作流。在选择使用的系统时，请确保它能够适应你现在的工作流以及你未来可能采用的工作流。\n\n#### 管理敏捷开发\n\
  \n不同的开发公司使用不同的程序来构建软件。有些是敏捷的，有些是瀑布型的，还有一些是混合型的。只要它们支持业务需求，它们都是有效的。然而，在缺陷追踪方面，它们的工作方式不同。\n\
  \n如果你是一家敏捷开发公司，缺陷追踪系统也应该作为产品待办列表（product backlog）。将这两个工具结合起来可以使开发过程的管理变得方便且透明。开发人员在寻找更多工作时只有一个单一来源可以去。在选择缺陷追踪系统时，确保它能够以你的团队喜欢的方式处理待办列表。\n\
  \n#### 管理报告\n\n如果你打算将你的缺陷追踪系统作为进度报告的来源，请确保报告功能符合你的需求。许多缺陷追踪系统的报告功能很匮乏，假设你会以交互的方式使用所有功能。如果报告无法满足你的需求，如果存储信息的数据库是可用的，你可能创建自己的报告。\n\
  \n### 使用持续集成 (CI) 构建服务器\n\n持续集成（CI）服务器是开发基础设施的关键组成部分，因为它强制执行你应用于团队和项目的规则。CI 服务器的目的是在每次提交新代码时构建你的应用程序并运行单元测试。服务器可以监控源码仓库，当它感应到有新的提交提交时，它会自动拉取新代码并对系统进行完整构建。如果构建失败，它会向所有团队成员发送电子邮件，告知构建问题是什么以及是谁提交了导致构建失败的代码。\n\
  \n如果你还设置了 CI 服务器来运行单元测试（你应该这样做），它会在构建成功后立即运行所有单元测试。如果其中任一个测试失败，则会向所有团队成员发送类似的电子邮件。对于即时构建，通常通常不包含集成测试，因为它们往往需要花费很长时间，但如果你有一个小项目，也可以包含集成测试。通常，夜间构建也会通过构建和单元测试过程，但它还会运行集成测试。\n\
  \n如果你使用 `TFS`，构建服务器与你的源码控制集成，因此设置 CI 服务器功能是一件简单的事。`TFS` 已经可以感应到新代码的提交并自动启动构建和单元测试。如果使用\
  \ `SVN` 或 `Git`，你可能需要设置 CI 服务器定期轮询这些仓库，以检查是否有更改提交。无论哪种方式，构建应该自动启动并在发生故障时向整个团队发送电子邮件。\n\
  \n### 使用 Visual Studio 2010 开发工具\n\n`Visual Studio 2010` 是一个开放生态系统，第三方公司很容易为其构建扩展。在许多可能性中做出决定很大程度上取决于个人偏好，但任何代码增强工具都应该能够完成某些功能。\n\
  \n#### Visual Studio 中的重构工具\n\n重工程应用程序等同于重构现有代码和编写新代码。因此，拥有良好的工具来帮助重构非常重要。`Visual\
  \ Studio` 开箱即带了许多实用的工具。\n\n##### 变量和方法重命名工具\n\n在你重构系统时，你会更改变量和方法的名称，使其更具可读性并更好地描述它们的用途。手动进行这些更改可能是一个枯燥且容易出错的过程。`Visual\
  \ Studio` 内置了变量和方法重命名功能，可以使这些工作变得简单得多。\n\n`Visual Studio` 还可以自动重新排序或删除方法签名中的参数，更改返回类型以及方法参数的顺序。\n\
  \n##### 副本定位工具\n\n`Visual Studio 2012` 的新功能是“在解决方案中查找匹配副本”（Find Matching Clones\
  \ in Solution）。通过选择代码块，你可以在整个解决方案中搜索相似的代码块，并将逻辑合并到一个方法中。此功能可以帮助发现遗留代码中的模式。\n\n#####\
  \ 方法提取工具\n\n接口的概念在许多遗留语言中甚至不存在，但它在现代架构中起着关键作用，因此能够从现有类中自动创建接口的能力是非常实用的。这在项目生命周期内可以节省数小时或数天的开发时间。\n\
  \n同样重要的是将一个大方法拆分为多个较小的部分。这被称为方法提取，在调整现有代码以适应单元测试时经常这样做。方法提取工具应该获取一组高亮代码并将其移动到一个方法中，同时用相应的方法调用替换该代码。必要的参数会被添加到方法签名中，以满足任何数据需求。\n\
  \n\n\n\n\n第三方工具提供的一种相关重构功能可以将方法移动到父类或后代类。你经常会发现代码在特定类的许多后代中是重复的，并希望将方法移动到父类以提高其可访问性。相反，如果基类包含一个仅适用于某个后代类的方法，只需点击几次即可将这些方法向下移动到后代类。\n\
  \n### 查找所有引用工具\n\n增强型 `查找` 功能是日常工作中使用频率最高的项目之一。Visual Studio 提供了`查找引用` 函数，可以向你显示使用特定符号的所有地方。此功能是无价的，因为你不断地探索事物在何时以及如何被使用。在着手对其进行某种更改之前，它可以告诉你某个特定的\
  \ `variable` 或 `method` 被使用的频率。\n\n### 代码片段工具\n\n代码片段（Code snippets）是 Visual Studio\
  \ 的一项优秀工具，允许开发者保存频繁使用的代码段（`snippets`），并在需要时重新应用它们。这些 `snippets` 以模式的形式保存，因此 `variable-names`\
  \ 和其他随每次实现而变化代码部分可以轻松更新。Visual Studio 已经预定义了许多 `snippets`，开发者也可以定义自己的。\n\n项目负责人使开发过程更容易的一种方法是添加项目特定的\
  \ `snippets`，让所有开发者都能访问。因为 Visual Studio 在启动时会搜索特定位置以寻找 `snippets`，因此每个开发者都可以引用一个网络位置供\
  \ Visual Studio 搜索。此常用文件夹中的任何 `snippets` 都会自动添加到开发者的片段库中。项目负责人可以添加新的 `snippets`\
  \ 并轻松地将其分发给整个团队。\n\n### 第三方重构工具\n\n虽然 Visual Studio 已经拥有许多你需要的重构工具，但某些插件工具仍有一之地，这些工具可以将基础重构功能提升到另一个水平。市面上已经存在良好的商业软件包和一些开源版本。\n\
  \n### 代码导航工具\n\n在代码中寻找路径可能是一项耗时的任务，特别是当面对特别大的解决方案时。在所有文件之间导航可以是开发者工具箱中的一项关键工具。Visual\
  \ Studio 标准配置了一些导航工具，第三方工具可以扩展这些功能。\n\nVisual Studio 标准配置了 `F12` 键，它允许用户转到特定 `variable`\
  \ 或 `method` 的声明处。然而，如果你正在编写的代码使用的是 `interface` 而不是 `concrete class`，那么导航到 `interface`\
  \ 就没有意义。插件工具提供了一种导航到实现给定 `interface method` 的 `concrete class` 的方法，以便你可以看到正在执行的代码。\n\
  \n对于大型系统，很难记住某些 `classes` 位于哪个项目。导航工具可以通过维护解决方案中所有文件的列表来帮助解决这种情况，无论它们被包含在哪个项目中。你只需输入文件名即可打开它。`class\
  \ names` 也可以被缓存，如果你倾向于在单个文件中保留多个一个 `class`，你就可以轻松地导航到合适的地方。\n\n### 编辑工具\n\n重新排列代码以提高其可读性是重构项目中的主要活动。增强的编辑工具可以让此任务变得更加简单和快速。提供的一些高级功能如下：\n\
  \n- 在文件内向上或向下移动方法：通过轻松地将具有关联行为的方法组合，代码变得更容易维护。某些工具还可以自动将 `method` 移动到特定的代码区域。\n\
  - 模式完成：输入 `key word` 的前几个字符，它就可以展开为完整内容。\n\n#### 总结\n\n合适的工具可以产生巨大的差异。源码控制、持续集成和缺陷管理是该拼图的重要部分。当开发过程得到适当工具的支持时，团队工作速度会更快，数据丢失的风险也更小。\n\
  \n## 9. 清理遗留解决方案\n\n本章讨论了可以在不更改任何业务逻辑的情况下对遗留应用程序进行的清理任务。通过在开始重构工作之前清理遗留应用程序，正确的项目结构还可以帮助避免\
  \ `circular references`。\n\n#### 注意\n\n对于此清理过程，我们假设项目在 Visual Studio 2008 或更高版本下运行。如果项目仍在使用\
  \ Visual Studio 6，则这些许多技术必须等待迁移后才能使用。\n\n#### 组织文件系统\n\n解决方案底层的文件结构通常被忽略并让其毫无无章地增长。只要\
  \ Visual Studio 解决方案文件对它所需的文件有正确的引用，底层的文件结构在技术上就是不重要的。然而，你有时需要在该结构中查找文件，因此，一个良好的结构会非常方便。一个可预测的结构也让项目中的新开发者更容易熟悉环境。\n\
  \n在代码文件夹根目录下，一个必不可少的文件夹是 `Libraries` 文件夹。该文件夹应该包含构建应用程序所需的所有 `outside DLLs`。我们所说的“outside\
  \ DLLs”是指任何未在构建过程中编译的内容。在将这些 `DLLs` 收集在一个处后，项目应该引用此文件夹中的它们。\n\n例如，我们使用的任何工具的 `DLLs`（如\
  \ `open source libraries`、`IoC container` 以及其他一切）都应该放在此文件夹中。如果你在该文件夹中有许多 `DLLs`，创建子文件夹来进一步组织它可能有意义，但理想情况下，所有文件都处于扁平结构中，这样在库升级时可以轻松地查找和替换。`System\
  \ DLLs` 应该留在 `GAC` 中；不要尝试将它们移动到 `Libraries` 文件夹。\n\n通过将 `Libraries` 文件夹添加到源代码文件结构的根目录，你还可以将这些\
  \ `DLLs` 提交到源码控制中以安全。除了将文件存放在安全的地方外，这还有几个优势：\n\n- 它允许构建服务器拉取所有代码并进行构建，而无需在服务器本身上安装所需的\
  \ `DLLs`。这有时意味着可以节省商业库的额外许可费用（显然，你必须检查你库的许可要求，以确保这在你的情况下是真实的）。\n\n\n\n\n\n-   将\
  \ DLL 包含在源码控制中，可以确保检出以前版本的代码时，也能检出构建该代码时使用的正确 DLL。想象一下你发布了应用程序的新版本，随后升级了本地桌面上的 UI\
  \ 工具。如果你以后需要回溯从源码控制中拉取旧版本的代码，你希望确保正确的 UI 工具版本能随源代码一起被检出。如果 DLL 不在源码控制中，你必须卸载当前版本的\
  \ UI 工具，重新安装旧版本，进行必要的修复，卸载旧版本，最后重新安装新版本。这种策略同样适用于任何必要的 COM 库的 DLL。\n\n-   使用 `Libraries`\
  \ 文件夹还能确保你避免两个不同项目引用同一 DLL 的不同版本的问题。一个导致大量调试时间浪费的常见错误是：某位开发者在自己的机器上更新了库，而团队的其他成员没有进行更新。如果项目在\
  \ `GAC` 中引用了此更新后的库，那么解决方案可以在某位开发者的机器上构建，但在另一台机器上无法构建。将所有 DLL 放在一个地方将迫使升级了库的人也提交更新后的\
  \ DLL，从而确保所有开发者都使用相同的库。\n\n强制执行这种结构有时很困难。如果你在系统中安装了 `ReSharper`，它有一个方便的功能，可以在你编辑代码时自动为你添加必要的项目引用。然而，此功能会首先检查\
  \ `GAC` 中的 DLL，如果找到，`ReSharper` 就会添加 `GAC` 中 DLL 的引用（而不是你的 `Libraries` 文件夹中）。此外，如果你使用设计器创建数据输入界面，并添加了需要引用新\
  \ DLL 的新组件，该引用将指向 `GAC` 中的版本。这可能会导致前述的构建服务器上出现问题。\n\n我对比剩余文件结构的个人偏好是保持其扁平化。尝试在磁盘子文件夹中对项目分组会导致需要文件时难以查找。在\
  \ `Visual Studio` 中创建新项目时，默认文件夹名称是项目名称，这应该能够唯一标识该文件夹。这个默认是一个很好的选择。\n\n#### 项目结构化\n\
  \n创建一个易于管理的代码库，很大程度上取决于解决方案本身的结构。当你对它进行重构以消除紧密耦合并引入新架构时，项目引用变得至关重要。如果解决方案组织不当，很容易陷入需要循环引用的境地，而\
  \ `Visual Studio` 是允许的。循环引用是指 `Project A` 需要引用 `Project B`，而 `Project B` 也需要引用 `Project\
  \ A`。这可能会让你面临一个必须重构解决方案中类和项目的令人不愿的问题。\n\n随着解决方案规模的扩大，循环引用的可能性（以及解决方案结构的重要性）也会随之增加。对于小型解决方案，易用性应该是首要考虑，因为重构解决方案并不困难或耗费时间。然而，对于大型企业级应用程序，对项目的引用可能分布在整个解决方案中，导致将一个类从一个项目移动到另一个项目变成一个困难且易出错的过程。此外，大型解决方案通常需要大型团队，在解决方案中移动文件和项目可能会给团队其他成员带来暂时的混乱。因为小型解决方案最终可能会变成大型解决方案，所以从开始就好好设计解决方案是值得的。\n\
  \n请记住，以下结构并非万能灵药。在 `.NET` 中加载程序集是一个耗时的过程，因此（假设每个项目都有自己的命名空间），拥有过多的项目会增加应用程序的启动时间。我们无法针对你的具体情况给出建议，但我们描述了一个通用的大型解决方案（100\
  \ 个项目以上）的结构，并由你判断哪些项目可以合并以尽量缩短启动时间。\n\n#### 处理项目分类\n\n重构项目的一个主要目标是在处理过程中保持应用程序的功能性。这意味着我们不能无区别地删除不符合我们标准的代码。由于这种方法，我们要处理的项目分为两个大类：\n\
  \n-   **旧模式项目（Old pattern projects）**：这些是你尝试脱离的原始项目。它们通常设计得不合理，并且具有与解决方案中其他项目绑定得过紧的引用。这些项目太难以尝试与新模式项目合并，因此它们应该保留在不同的区域，直到以后可以进行迁移。\n\
  \n-   **新模式项目（New pattern projects）**：这些是你正在创建或尝试将代码移入的项目。它们只包含对其他新模式项目的允许引用，并且只包含正确拆分到不同类中的代码。新模式项目有两种类型：\n\
  \n    -   **特定新模式项目（Specific new pattern projects）**：这些类应该只持有于该应用程序的代码（不能用于另一个不相关的应用程序）。\n\
  \n    -   **共享新模式项目（Shared new pattern projects）**：包含可以在你打算实现的所有不同模块甚至其他应用程序之间共享的代码。这些项目可以是与应用程序无关的（对其使用的应用程序领域一无所知的通用项目），也可以是特定应用程序的。在任何情况下，它们都应该与特定项目分开存放，以保持正确的引用层次结构。\n\
  \n这些项目类别通常可以使用不同的命名约定来分离。例如，如果你在一家名为 `Acme Software` 的公司工作，你可以保留旧模式项目的当前命名约定（或使用\
  \ `Acme.MyProjectName.Legacy`），并将新模式项目命名为 `Acme.MyProjectName`，共享新模式项目命名为 `Acme.Shared.MyProjectName`。\n\
  \n#### 理解项目类型\n\n你在解决方案中创建了许多类型的项目。它们具有不同的属性，因此将它们拆分为单独类型非常重要。如果不注意这些属性，可能会导致项目引用使得解决方案脆弱、容易产生循环引用，并且通常难以处理。\n\
  \n* *\n\n#### 注意\n\n在本章中，我们偶尔会引用“死胡同项目（dead-end projects）”。该术语指的是仅引用外部 DLL 而不引用同一解决方案中其他项目的项目。识别死胡同项目很重要，因为任何其他项目都可以引用它们，而不必担心循环引用。\n\
  \n* *\n\n#### 与应用程序无关的项目（Application-Agnostic Projects）\n\n这些项目对你的特定应用程序一无所知。它们可以轻松地提取并放置到另一个应用程序中，无需更改代码。此类项目的典型项目是对象管理器（`ToolbarManager`、`RegionManager`、`ConnectionStringProvider`、`MessageAggregator`\
  \ 等）。这类类通常存在于名为 `SystemServices` 的单一项目中，但如果符合你的需求，也没有理由不拆分这些类。\n\n此类项目不应引用你解决方案中的任何其他项目。引用外部库是可以接受的，只要这些库可以在需要时移植到其他应用程序中。可能的引用是\
  \ IoC 容器或第三方日志系统。\n\n\n\n\n\n这些项目也不应该包含任何 UI 或数据访问逻辑。与应用程序无关（Application-agnostic）的项目在\
  \ WPF 应用程序、WinForms 应用程序、ASP MVC 甚至控制台应用程序和服务中都应该是通用的。包含不必要的 UI 引用会使应用程序的多目标构建变得更加困难。\n\
  \n#### 通用 UI 项目\n\n将 UI 相关的项目与应用程序的其他部分分开是最好的。目前有许多不同类型的 UI 目标（HTML、Silverlight、WPF、WinForms、Metro、Console\
  \ 等），如果你对 `MVC`、`MVP` 或 `MVVM` 的实现非常严谨，那么 UI 项目就可以独立于后端业务逻辑进行更换或升级。如果将包含 UI 逻辑的代码放在包含业务逻辑的项目中，将使该项目的重用变得更加困难。\n\
  \n这种结构也为多目标构建打开了大门，即同一个业务逻辑有多种类型的前端。虽然这在理论上可行，但这一目标很难实现。如果你想同时为同一个业务逻辑拥有多个前端，必须经过仔细计划。\n\
  \n#### 与模型无关的项目\n\n与模型无关（Model-agnostic）的项目是指那些了解其所属特定应用程序，但没有数据模型引用的项目。这是一个重要的区别，因为某些服务可能在业务的其它地方被重用，特别是在共享某些功能但又不共享业务模型的应用程序中。\n\
  \n在现实世界，这样的项目寥寥无几。特定于应用程序（而非通用的）代码在完全不知道数据模型的情况下，能够对系统做出重大贡献是非常罕见的。然而，我们确实遇到过这类服务，将代码放在单独的项目中以便与其他相关的解决方案重用是非常方便的。\n\
  \n#### 与模型相关的项目\n\n这些项目包含了特定于你特定应用程序的代码。这些项目可以引用的其他项目类型没有限制，因为除了它们所属的应用程序（或相同领域内具有相同数据模型的内容）之外，它们在任何其他情况下都难以或无法使用。这类项目构成了你解决方案的大部分。\n\
  \n#### 重构项目建议\n\n关于解决方案的项目组织，出现了两种截然不同的模式，它们根据所使用的体系结构模式进行划分。对于 `MVVM` 项目，特定模块的所有文件都放在同一个项目中。这意味着模块特定的服务、常量、`DTOs`、视图、视图模型以及除基础架构之外的所有其他内容都放在一起。这种结构将代码保持在单个\
  \ `DLL` 中，并在需要模块本身时进行加载。这可以略微缩短应用程序的加载时间，但会将延迟转移到第一次使用模块时。\n\n另一种结构以不同的方式切分解决方案，通常在运行\
  \ `MVP` 或 `MVC` 时实现。这种解决方案结构将服务分组在一个项目中，视图放在另一个项目中，控制器和演示器放在另一个项目中，依此类推。这种结构导致几乎所有的\
  \ `DLLs` 都在应用程序启动时加载，但第一次使用某功能时不会产生延迟。\n\n这两种结构都是有效的，你的选择不会影响重构的工作。第一种方法（用于 `MVVM`\
  \ 架构）很难用通用的方式描述。要对此提供建议，我们必须了解你正在构建的应用程序的功能以及模块是如何定义的。此外，遗留应用程序的结构通常更类似于 `MVC` 项目结构而非\
  \ `MVVM`。因此，我们在这里分析第二种结构。\n\n接下来的章节描述了无论当前的业务问题类型如何，解决方案中通常都会创建的项目。\n\n#### 常量\n\
  \n最容易创建和填充的新模式项目是常量项目。常量项目将系统中定义的所有常量和枚举都放在在一个方便的地方。有时，遗留系统已经有了这个项目，可以直接来用。\n\n\
  常量项目的一个关键因素是它保持为一个“死胡同项目”（dead-end project）。使用常量项目不会产生循环引用的危险，因为常量在重构后的系统中随处使用。\n\
  \n在 Visual Studio 中使用 `Constants` 项目重构遗留系统是非常简单的。扫描 `const` 或 `enum` 关键字是填充此项目的一个良好方法。一旦找到，`ReSharper`\
  \ 有两个重构工具可以极大地帮助更新你的解决方案。如果给定的 `enum` 嵌入在与另一个类的同一个文件中，`Move to Another File` 命令会将\
  \ `enum` 代码从文件中剪切出来并创建一个与 `enum` 同名的新文件，然后将代码粘贴进去。新文件被添加到原文件所在的同一个项目。随后，`ReSharper`\
  \ 有一个 `Move` 重构方法可以尝试将新文件移动到常量项目。通过这两种重构方法的共同作用，填充你的 `Constants` 项目非常容易。\n\n由于这种类型的更改不涉及业务逻辑，因此这是一个非常交给初级开发者或刚开始学习编程的人的好项目。如果移动操作正确，解决方案就能编译。如果操作不正确，解决方案将无法编译。\n\
  \n#### 数据传输对象 (DTO) 项目\n\n该项目包含仅作为数据传输对象（`DTOs`）的类。`DTO` 是一个除了数据存储和检索外几乎或完全没有逻辑的类。`DTO`\
  \ 的常见用途是当特定方法需要大量参数，导致在方法签名中指定所有参数变得非常臃肿时。相反，你可以创建一个包含所有参数的 `DTO` 并将其传递给该方法。另一个例子是某些数据只有作为一个集合时才有意义，并且需要在应用程序中传递。那么\
  \ `DTO` 就可以轻松地实现这一目的。调用者必须创建 `DTO`，用适当的数据填充它，然后将其传递给相应的方法。\n\n#### 注意\n\n虽然 `DTO`\
  \ 通常没有逻辑，但对于复杂的 `DTOs`，我们有时会添加一个方法：`Validate` 方法。由于 `DTOs` 通常是与其调用的方法分开创建的，很容易忘记指定特定操作所需的信息。`Validate`\
  \ 方法检查 `DTO` 中的数据，以确保有足够的数据执行必要的操作。接收 `DTO` 作为参数的代码随后只需调用 `Verify` 方法，如果指定的信息不足，则抛出异常。这使得验证逻辑集中在一起，而不需要在使用\
  \ `DTO` 的所有地方重复编写。\n\n我们放入 DTO 项目的另一种类类型是 `EventArgs` 派生类。创建 `EventArgs` 类的派生类以指定发送到事件中的数据是常见的做法。观察\
  \ `EventArg` 的属性与 `DTO` 相似，因为它几乎没有逻辑，主要用于传输数据。`EventArgs` 可能会遇到 `DTOs` 相同的引用问题，因此使用相同的技术来解决。\n\
  \n我们将 `DTOs` 保持在单独的项目中，因为它们通常被系统中的许多不同类使用。每个使用 `DTOs` 的类都对 DTO 项目有引用，因此我们必须对允许的引用保持严谨，以避免循环引用。DTO\
  \ 项目应该是一个死胡同项目。\n\n\n\n\n\n在现实世界中，要让 DTO 项目保持为一个单向依赖（dead-end）项目是非常困难的。DTO 通常需要携带\
  \ Model 对象或应用程序更深处的其他类类型。为了解决这个问题，我们创建的 DTO 往往是泛型的。通过这种方法，DTO 可以包含适当类型的信息，而无需了解这些信息具体是什么（因此不需要对模型的引用）。\n\
  \n另一个选项是使用动态对象（dynamic object）。这种类型的 DTO 可以携带任何类型的数据，而无需担心因项目引用而导致循环引用（不过，动态对象仅在\
  \ .NET 4 中可用）。\n\n列表 9.1 显示了一个可以携带任何数据模型实体的泛型 DTO 示例。\n\n列表 9.1。泛型 DTO 示例\n\n点击此处查看代码图片\n\
  \n```csharp\nnamespace CodeSamples.Ch09_LegacySolutionCleanup.Listing01\n{\n  ///\
  \ <summary>\n  /// 此 DTO 可以携带任何类型的数据，而\n  /// 不需要必要的项目引用。\n  /// </summary>\n  public\
  \ class SelectedEntityDto<T>\n  {\n    public T Entity { get; set; }\n  }\n}\n```\n\
  \n### 接口 (Interfaces)\n\nInterfaces 项目是应用程序的枢纽。当使用 `ServiceLocator` 解析必要的服务时，业务逻辑需要提供一个代表其所需服务的接口名称；因此，解决方案中的几乎每个项目都需要对\
  \ Interfaces 项目的引用。MVC 和 MVP 中的视图也通过 Interfaces 项目暴露其功能。\n\n该项目的内容从 `Interfaces`\
  \ 这个名称来看应该是显而易见的。由于该项目非常重要，必须非常小心地限制允许的引用。理想情况下，Interfaces 项目是一个单向依赖项目，但这很少能够实现。记住，接口也可以是泛型的，因此之前为\
  \ DTO 使用的泛型示例也可以适用于接口。\n\n如果你仍然认为有必要在 Interfaces 项目中包含特定业务引用，最好的办法是创建一个共享的 `Interfaces`\
  \ 项目（并将其作为单向依赖项目进行维护），以及另一个引用了业务逻辑的 `Interfaces` 项目。只要可能，将新接口放入共享版本中，以保持低循环引用的概率。\n\
  \n### 服务 (Services)\n\nServices 项目是服务类所在的地方。在一个设计良好的系统中，有很多许多型服务；每个服务执行特定的职责，因此\
  \ Services 项目中的类数量可能会变得非常大。这不是技术问题，而是一个组织问题。由于有如此多的类，使用项目内部的文件夹来组织它们通常非常方便。注意，这些服务中的每一个都应该与\
  \ Interfaces 项目中的接口关联。\n\nProviders（提供者）只是提供对某些资源访问的服务，通常是定位并返回它们，但不对其进行更改。例如，开发过程中一个经常的痛点是开发者需要的连接字符串数量。团队中的每位开发者通常都有自己的数据库副本，因此在进行数据更改时，不会阻塞其他团队成员的工作。这些连接字符串很难管理，因为它们对每个开发者都是唯一的。为了解决这个问题，我们使用\
  \ `ConnectionStringProvider`，它具有根据运行应用程序的开发者查找适当连接字符串的逻辑。该服务不具备修改数据的逻辑，只负责选择哪种连接字符串并返回它。\n\
  \n经常使用的第二类型服务是 Manager（管理器）。Manager 服务的职责是跟踪系统正常运行所需的其他对象。一个例子是 `RegionManager`，它跟踪应用程序中所有可用的区域。该服务不创建或销毁区域；它只是跟踪那些注册给它的区域。\n\
  \n另一个管理器的例子是 `CacheManager`。在复杂的系统中，通常需要对数据实体进行多个不同的缓存。`CacheManager` 维护这些不同的数据缓存，在应用程序的生命周期内根据需要创建、管理和销毁它们。`CacheManager`\
  \ 不使用缓存，也不更改缓存中的任何数据；它只管理缓存。\n\n对于“所有服务都应该在 Services 项目中”这一通用说法，有一个显著的例外：模型或实体服务（model\
  \ or entity services）。这些模型实体执行常用业务逻辑所需的服务。这些服务引起了一个问题，因为 Services 项目不可避免地需要 Model\
  \ 项目的引用。如果模型实体需要服务，而这些服务存在于 Services 项目中，就会产生循环引用。为了解决这个棘手的问题，我们有时必须引入 `Entity Services\
  \ Proxy`（实体服务代理）项目。这种类型的项目可能复杂且晦涩，因此应尽可能避免。然而，在必须适应既定结构的重构项目中，这往往难以避免。\n\n### 领域模型项目\
  \ (Domain Model Projects)\n\nDomain Model 项目（或 Data Model，或直接称为 Model）是持有所有业务实体类的项目。这些类通常每个代表数据库中的一张表（尽管这不是硬性规定）。Model\
  \ 项目应该是一个单向依赖项目，因为许多其他项目都引用了它。取决于你使用的数据访问技术（`Entity Framework`、`Linq to SQL`、`NHibernate`、`IdeaBlade`\
  \ 等），该项目可以包含不同的类，但它始终包含表示项目操作的数据的类。\n\n关于模型的一个重要点是，它不应该与特定的数据库紧耦合。换句话说，设计良好的模型可以容易地用于\
  \ Microsoft SQL Server、Oracle 或 MySQL。然而，模型项目确实与所选的 ORM 耦合。根据选择 `Entity Framework`、`NHibernate`、`Linq\
  \ to SQL`、`IdeaBlade` 或任何其他 ORM 工具，模型具有不同的代码和属性。如果你希望将一个 ORM 替换为另一个，数据模型项目就是操作的地方。\n\
  \n### 仓库项目 (Repository Projects)\n\nRepository 项目是数据仓库所在的地方。仓库模式在第 12 章 中更详细的介绍，“高级重构为服务](#part0020.html_ch12)”，但通常，仓库是代表系统其他部分与数据库交互的服务。所有数据查询都应该来自此服务。\n\
  \n与 Data Model 项目相反，Repository 项目可以与特定的数据库实例紧耦合。从 MS SQL Server 获取一组数据所需的查询可能与从\
  \ MS Access 甚至平面文件获取数据的查询不同。这些差异是在仓库中实现的。然而，使用的 ORM 不应该紧耦合。无论使用 `Entity Framework`\
  \ 还是 `NHibernate`，从 Repository 项目返回的数据模型对象应该是相同的。\n\n\n\n\n\n#### 控制器、视图模型和演示器\n\
  \n如果你使用 `MVC` 模式，你将有一个名为 `Controllers` 的项目。如果你使用 `MVVM` 模式，该项目也可以命名为 `ViewModels`；如果你使用\
  \ `MVP` 模式，则命名为 `Presenters`。无论你如何称呼它，该项目都包含了控制应用程序大部分业务逻辑的类。\n\n#### 重构解决方案的结构\n\
  \n本节讨论了对解决方案进行更改的建议，以使其更具活性，同时又不改变业务逻辑。我们尝试在这些逻辑被单元测试覆盖之前避免更改它们，因此，区分影响逻辑的和不影响逻辑的更改非常重要。这里讨论的更改可以在没有测试覆盖的情况下安全进行。\n\
  \n按照给出的顺序进行这些更改很方便，但并非强制要求。我建议不要并行进行这些更改，因为它们会影响整个项目，通常还会影响解决方案本身。多个人同时进行这些更改可能会在提交时导致大量的重复工作。如果可能，最好在团队其他成员未在开发项目的非工作时间进行这些更改。\n\
  \n> **注意**：给大型团队中架构师的建议：过度沟通好于沟通不足。本节描述的更改可能会剧烈改变内容的位置和结构。以前允许的引用将变得无效。不了解你所做更改的开发者，当发现昨天使用的方法在今天不再有效时，会很快感到沮丧。在此过程中直到项目结构稳定之前，请与团队频繁举行架构会议，以让他们了解正在进行的更改。\n\
  \n#### 移除不必要的 Using 子句\n\n`Using` 子句经常被开发者忽略，因为它们显然没有害处。未使用的 `Using` 子句不会导致应用程序崩溃，但缺少\
  \ `Using` 子句会导致崩溃，因此许多人认为将它们留在原处“以防万一”会更好。这是一个错误。\n\n项目所需的引用是由包含文件中的 `Using` 子句决定的。如果一个类有一个\
  \ `Using` 子句，无论其是否必要，项目都必须对适当的 `DLL` 拥有引用。因此，特别是在重新工程化应用程序时，移除不必要的 `Using` 子句非常重要，这样就只需要必要的引用。\n\
  \n尽管 `Visual Studio` 可以很轻松地识别文件中不必要的 `Using` 子句，但遗憾的是，识别项目中不必要的项目引用要困难得多。没有迹象表明某个引用是不必要的且可以删除的。识别不必要引用的唯一方法是删除一个并尝试构建。在启动一个新的重新工程化项目时，这种繁琐的过程是很有建议的，因为可以清除潜在问题。有了不必要的引用，`Visual\
  \ Studio` 可能会报告不必要的循环引用。\n\n#### 分离单元测试和集成测试\n\n如果你足够幸运，重新工程化的应用程序中拥有现有的单元测试，那么你必须确定这些测试的质量。许多新接触单元测试的开发者会将单元测试与集成测试混淆，导致运行运行数小时的“单元测试”。\n\
  \n单元测试不与任何外部服务交互。换句话说，它们不会以任何方式访问数据库，也不会访问网络服务或内存之外的任何内容。这种限制使得单元测试运行非常快，通常在毫秒级完成。整套单元测试应该在一分钟到两分钟内运行完毕。由于它们非常快，开发者应该在任何代码提交之前运行所有的单元测试。\n\
  \n相反，集成测试允许与外部服务交互。由于这种交互，集成测试通常很慢。`Repository` 测试是集成测试的典型示例，一个具有完全覆盖的正常大小仓库运行可能超过一小时。因此，这些测试通常只在晚上运行。\n\
  \n应该花时间将单元测试和集成测试划分为单独的项目，以便它们可以通过测试运行器单独运行。通过将它们划分为单独的项目，它们很容易被识别，且单元测试很容易运行。通过将它们划分为单独的项目，它们很容易被识别，且单元测试很容易运行。\
  \ (注：原文此处句式重复，译文已按要求保留或对应翻译)\n\n\n\n\n\n前一节描述的更改不会影响业务逻辑。这些更改在没有单元测试的情况下也可以安全地进行，因为所做的唯一更改仅针对\
  \ `Using` 子句。在本节中，我们将讨论一些会影响业务逻辑的更改，因此这些更改只有在有适当单元测试的情况下才能进行。\n\n在此时，必须做出一个关于风险/回报的决策。在创建单元测试以验证现有逻辑时，你可能会在旧代码中发现缺陷，并且必须决定是否修复该缺陷。当你发现缺陷并尝试修复它时，很容易分心，因为这将导致整个测试周期，并可能为了修复随之出现的其他问题而导致下游的更改。然而，对于任何尽职的开发者来说，发现缺陷并将其留在代码中是一次不愉快的体验。\n\
  \n如果你认为修复缺陷不值得增加 QA（质量保证）时间带来的代价，请创建单元测试来验证现有的错误逻辑，以确保我们在这里所做的更改不会破坏该逻辑。在测试中记录该缺陷，以及一旦你达到可以安全进行逻辑更改的阶段，测试应如何修改。添加一个日后可以找到的预测字符串将便于后续修复工作。此外，请在你的缺陷跟踪系统中添加该缺陷，并将其设置为在稍后处理。\n\
  \n如果你决定修复该缺陷，请注意这项工作可能会影响你的时间表。\n\n#### 将初始化逻辑移动到构造函数中\n\n这种更改并非必须，但可以节省以后调试的时间并减少代码膨胀。你可能会发现如列表\
  \ 9.2 所示，变量初始化代码位于变量声明处。\n\n列表 9.2. 在构造函数外部设置逻辑\n\n点击此处查看代码图像\n\n```sharp\nusing\
  \ System;\n\nnamespace CodeSamples.Ch09_LegacySolutionCleanup.Listing02\n{\n  public\
  \ class FormController\n  {\n    Uri myUri = new Uri(\"invalid string\");\n\n  \
  \  public FormController()\n    {\n      //Controller logic goes here.\n    }\n\
  \  }\n}\n```\n\n这个问题，因为这段代码在构造函数的第一行之前就会运行。因此，如果你在构造函数的第一行设置了断点，应用程序在到达断点之前就会失败。如果你在构造函数的第一行设置了断点，可能会因为这种错误而浪费几个小时。当没有遇到断点时，你可能会认为该类与错误无关。\n\
  \n这种编码方式的另一个问题是它隐藏了变量初始化。如果你有一个拥有大量属性的类（如 View Models 可能具有许多属性），那么在声明中初始化的变量在滚动出屏幕时很容易被忽略。\n\
  \n避免在构造函数外初始化变量的第三个原因是避免代码膨胀和可能出现的变量重复初始化。当初始化器被放在构造函数外部时，编译器在后台会将这些代码复制到每个构造函数中执行，导致你的代码变得臃肿。此外，如果你有一个一个构造函数调用另一个构造函数的结构，编译器执行的额外工作会导致同一个变量被初始化两次。\n\
  \n这里的解决方案很简单；将初始化代码移动到构造函数中，如列表 9.3 所示。\n\n列表 9.3. 将初始化代码移动到构造函数\n\n点击此处查看代码图像\n\
  \n```sharp\nusing System;\n\nnamespace CodeSamples.Ch09_LegacySolutionCleanup.Listing03\n\
  {\n  public class FormController\n  {\n    Uri myUri ;\n\n    public FormController()\n\
  \    {\n      myUri = new Uri(\"invalid string\");\n      //Controller logic goes\
  \ here.\n    }\n  }\n}\n```\n\n通过这种结构，很容易找到初始化代码，并且异常会从相应的类抛出。\n\n### 使用守卫语句（Guards）替换嵌套的\
  \ `If`语句\n\n在旧代码中，你经常看到带有许多嵌套 `If` 语句的方法，在执行操作之前检查各种参数。对于当时编写代码的开发者来说，这些逻辑可能是完全合理的，但对于事后加入并试图破译其意图的人来说，这很难理解。\n\
  \n这些嵌套的 `If` 语句可以用返回适当值的守卫语句替换。这在不改变逻辑的情况下可以大大提高代码的可读性。添加守卫语句还可以降低方法的圈复杂度，复杂度是衡量代码复杂程度的指标。\n\
  \n列表 9.4 显示了一个带有许多嵌套 `If` 语句的复杂方法版本。\n\n列表 9.4. 复杂的嵌套 IF 语句\n\n点击此处查看代码图像\n\n```sharp\n\
  namespace CodeSamples.Ch09_LegacySolutionCleanup.Listing04\n{\n  public class OrderEntry\n\
  \  {\n    public OrderLineItem CreateOrderLineItem(InventoryItem pItem, Customer\
  \ pCustomer, int pQuantity, float pPrice)\n    {\n      OrderLineItem result = null;\n\
  \      if (pItem != null)\n      {\n        if (pCustomer != null)\n        {\n\
  \          if (pQuantity > 0)\n          {\n            if (!pItem.Discontinued)\n\
  \            {\n              if (pPrice > 0)\n              {\n               \
  \ if (!pItem.Discontinued)\n                {\n                  result = new OrderLineItem(pItem,\
  \ pQuantity, pPrice);\n                }\n              }\n              else\n\
  \              {\n                if (pCustomer.AllowFreeSamples)\n            \
  \    {\n                  if (pItem.FreeSamplesAllowed)\n                  {\n \
  \                   result = new OrderLineItem(pItem, pQuantity, pPrice);\n    \
  \              }\n                }\n              }\n            }\n          }\n\
  \        }\n      }\n      return result;\n    }\n  }\n  public class InventoryItem\n\
  \  {\n    public bool Discontinued { get; set; }\n    public bool FreeSamplesAllowed\
  \ { get; set; }\n  }\n  public class OrderLineItem\n  {\n    public OrderLineItem(InventoryItem\
  \ item, int quanty, float price)\n    {\n    }\n  }\n  public class Customer\n \
  \ {\n    public bool AllowFreeSamples { get; set; }\n  }\n}\n```\n\n在这段代码中，很难跟踪逻辑流，因为条件树太深了。破解它的唯一方法是使用\
  \ Visual Studio 的括号匹配功能，将光标放在左括号或右括号上并寻找它的配对。\n\n现在让我们看看列表 9.5 所示等等代码。\n\n列表 9.5.\
  \ 使用守卫语句的简化 IF 语句\n\n点击此处查看代码图像\n\n```sharp\nusing System;\n\nnamespace CodeSamples.Ch09_LegacySolutionCleanup.Listing05\n\
  {\n  public class FormController\n  {\n    public OrderLineItem CreateOrderLineItem(InventoryItem\
  \ pItem, Customer pCustomer, int pQuantity, float pPrice)\n    {\n      if (pItem\
  \ == null) throw new ArgumentException(\"Item is null\");\n      if (pCustomer ==\
  \ null) throw new ArgumentException(\"Customer is null\");\n      if (pItem.Discontinued)\n\
  \        throw new ArgumentException(\"Item Discontinued\");\n      if (pQuantity\
  \ < 0) throw new ArgumentException(\"Invalid Quantity\");\n      if (pQuantity ==\
  \ 0 && !FreeSampleAllowed(pCustomer, pItem))\n        throw new ArgumentException(\"\
  Free Samples Not Allowed on this item\");\n      return new OrderLineItem(pItem,\
  \ pQuantity, pPrice);\n    }\n    internal bool FreeSampleAllowed(Customer pCustomer,\
  \ InventoryItem pItem)\n    {\n      return pCustomer.AllowFreeSamples && pItem.FreeSamplesAllowed;\n\
