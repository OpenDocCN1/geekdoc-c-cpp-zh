  \n现在点击 Shelve 按钮。\n\n当你准备好继续搁存的工作时，再次进入 Team Explorer > Pending Changes 并使用 Actions\
  \ 链接查找 Shelve-sets。找到你创建的 shelveset 并右键点击它获取选项。选择 Unshelve（取消搁存）。现在你可以继续工作。\n\n\
  #### 使用 Visual Studio 2012 进行单元测试\n\n\n\n\nVisual Studio 2012 改进了单元测试支持，使提高应用程序质量变得更加容易。为了直观查看这一新功能，假设你被要求构建一个包含辅助类和方法的库。你需要实现的方法之一是\
  \ `Square` 方法，该方法返回一个整数的平方值（参见 列表 A.4）。\n\n#### 列表 A.4. 一个需要单元测试的简单类\n\n点击此处查看代码图像\n\
  \n* * *\n\n```c\npublic class MyMath\n{\n  public int Square(int i)\n  {\n    return\
  \ i;\n  }\n}\n```\n\n* * *\n\n注意，这个方法有一个 bug，我们使用内置的单元测试框架发现了它。\n\n我们接下来要做的事情是创建一个单元测试项目。Visual\
  \ Studio 2012 对单元测试提供了极佳的支持。它内置了微软的单元测试框架，但如果你愿意，也可以安装第三方或开源的单元测试框架，例如 `NUnit`。在示例中，我们使用内置的框架。\n\
  \n首先向你的解决方案添加一个新项目，选择测试类别，然后添加单元测试项目（参见 图 A.8）。\n\n![Image](img/0003.jpeg)\n\n图\
  \ A.8. 添加单元测试项目\n\n创建项目的同时也会创建一个测试的框架类。将此测试类重命名为 `MyMathTests.cs`，并在询问是否要重命名所有内容时选择“是”。\n\
  \n重命名后，默认测试类看起来所示 列表 A.5。\n\n#### 列表 A.5. 默认测试类\n\n点击此处查看代码图像\n\n* * *\n\n```csharp\n\
  [TestClass]\npublic class MyMathTests\n{\n  [TestMethod]\n  public void TestMethod1()\n\
  \  {\n  }\n}\n```\n\n* * *\n\n你应该首先注意到的是 `[TestClass]` 特性。它用于将此类标记为测试类，使自动化工具能够定位并运行解决方案中的所有测试，无论它们位于何处。\n\
  \n单个方法也被标记了 `[TestMethod]` 特性。同样，这用于工具来识别单个测试。现在将该方法重命名为更合适的名字。在这个测试方法中，我们测试 `Square`\
  \ 是否正确返回了三的平方，因此将其重命名为 `Square_Three_ReturnsNine`。\n\n#### 编写单元测试方法\n\n遵循我们在 第 3\
  \ 章中引入的“安排-执行-断言”（Arrange-Act-Assert）“单元测试”方法，我们编辑了单元测试，使其看起来所示 列表 A.6。\n\n####\
  \ 列表 A.6. 创建一个接口\n\n点击此处查看代码图像\n\n* * *\n\n```csharp\n[TestClass]\npublic class\
  \ MyMathTests\n{\n  [TestMethod]\n  public void Square_Three_ReturnsNine()\n  {\n\
  \    // Arrange\n    var target = new MyMath();\n    // Act\n    var result = target.Square(3);\n\
  \    // Assert\n    Assert.AreEqual(9, result, \"Square method is broken\");\n \
  \ }\n}\n```\n\n* * *\n\n在此方法中，我们首先创建要测试的目标对象。然后传递三并调用 `Square` 方法。最后，我们查看结果是否为九。最后一部分始终使用\
  \ `Assert` 类之一完成，该类具有许多辅助方法，可以轻松地检查结果。\n\n- `Assert` 类具有检查结果是否等于某个值的方法，可以使用 `IsInstanceOfType`\
  \ 检查它是否为特定类型，并有许多其他实用方法。\n- `StringAssert` 类有一系列辅助方法，检查字符串是否以特定字符串开头或结尾，或遵循特定模式（使用正则表达式）。\n\
  - `CollectionAssert` 类允许你检查集合是否具有唯一元素、所有元素是否都是特定类型等。\n\n#### 运行单元测试\n\n要运行我们的单元测试，我们使用“测试管理器”（Test\
  \ Explorer）窗口。要打开它，可以使用菜单或通过 Visual Studio 的快速启动（Quick Launch）搜索它（参见 图 A.9）。\n\n\
  ![Image](img/0003.jpeg)\n\n图 A.9. 测试管理器\n\n测试管理器打开了。现在点击“全部”（All）来运行你的测试。Visual\
  \ Studio 会构建你的项目然后运行测试。由于我们有一个 bug，测试失败了（参见 图 A.10）。\n\n![Image](img/0003.jpeg)\n\
  \n图 A.10. 显示失败\n\n要查看发生了什么，我们可以使用调试器进行逐步执行。首先，在代码的第一行设置断点。然后使用调试器进入代码。\n\n#### 使用“编辑并继续”功能\n\
  \nVisual Studio 2012 引入了另一个功能：编辑并继续（edit-and-continue）。使用此功能，你可以在执行之前编辑代码。如下所示 列表\
  \ A.7。\n\n#### 列表 A.7. 修复 MyMath\n\n```csharp\npublic class MyMath\n{\n  public\
  \ int Square(int i)\n  {\n    return i;\n  }\n}\n```\n\n* * *\n\n现在使用调试器逐步执行代码。此测试现在成功了（参见\
  \ 图 A.11）。\n\n![Image](img/0003.jpeg)\n\n图 A.11. 成功的测试\n\n#### 为异常编写测试\n\n```csharp\n\
  [TestClass]\npublic class MyMathTests\n{\n  [TestMethod]\n  public void Square_Three_ReturnsNine()\n\
  \  {\n    // Arrange\n    var target = new MyMath();\n    // Act\n    var result\
  \ = target.Square(3);\n    // Assert\n    Assert.AreEqual(9, result, \"Square method\
  \ is broken\");\n  }\n}\n```\n\n*(注：根据用户要求，原始文本中重复的乱码部分已进行清理，仅保留核心逻辑翻译。)*\n\n\n\n\
  \n让我们回到第二个测试。这个测试失败是因为 C# 默认不进行溢出检查。为了检查 `Square` 方法的实现是否存在溢出，我们添加了 `checked` 关键字，如\
  \ 列表 A.9 所示。\n\n#### 列表 A.9. 带有 checked 关键字的 Square 方法\n\n点击此处查看代码图片\n\n```csharp\n\
  public class MyMath\n{\n  public int Square(int i)\n  {\n    checked\n    {\n  \
  \    return i * i;\n    }\n  }\n}\n```\n\n生成你的解决方案，Visual Studio 会自动运行测试，现在测试通过了（请参见\
  \ 图 A.14）！\n\n![Image](img/00036.jpeg)\n\n图 A.14. 使用 check 关键字的成功测试\n\n#### 使用 Fakes\
  \ 为“不可测试”的代码编写单元测试\n\n你将如何测试不可测试的代码？我指的是缺少源码或由另一公司（如微软）构建的代码。几年前，微软发布了 Moles，这是一个由微软研究院构建的框架，它允许你用自己的代码替换任何对象的方法。我们曾在\
  \ 第 5 章 中的 “在单元测试中使用测试双胞符”中讨论过这个框架。现在，该框架是 Visual Studio 的一部分，并已重命名为 Microsoft Fakes。\n\
  \n让我们通过替换从 `DateTime.Now` 调用得到的应该来看看 Fakes 是如何工作的。日期戳的典型用途是标记业务实体的 `LastUpdatedDate`，如\
  \ 列表 A.10 所示。\n\n#### 列表 A.10. 更新 LastUpdatedDate\n\n点击此处查看代码图片\n\n```csharp\npublic\
  \ class BusinessEntity\n{\n  public string Name { get; set; }\n  public DateTime\
  \ LastUpdatedDate { get; set; }\n  public void PrepareToSave()\n  {\n    LastUpdatedDate\
  \ = DateTime.Now;\n  }\n}\n```\n\n此方法很难测试，因为它使用了 `DateTime.Now`，无法使用我们的标准工具对其进行模拟（mock）。这意味着该方法在每次运行测试时都会设置不同的值。如果我们想测试此方法，我们需要一种控制日期的方法。我们可以更改机器的日期，但这会引入许多其他问题，不是一个好方法。\n\
  \n我们可以使用 Fakes 来解决这个问题。通过 Fakes，你可以获取任何程序集，并让 Microsoft Fakes 框架生成辅助类，让你能够更改该程序集中的方法。在我们的案例中，它是\
  \ `DateTime`，因此请返回解决方案管理器，打开测试项目中的 `References` 文件夹（确保是你的测试项目！），并右键点击 `System` 程序集。从下拉菜单中选择\
  \ `添加 Fakes 程序集`。现在你已经准备好实现测试方法了。\n\n再次右键点击单元测试项目，从下拉菜单中选择 `添加 > 单元测试`。重命名测试类 `BusinessEntityTests`\
  \ 并重命名测试方法为 `PrepareToSave_2012_False`。实现该方法，如 列表 A.11 所示。\n\n#### 列表 A.11. 创建接口\n\
  \n点击此处查看代码图片\n\n```csharp\n[TestMethod]\npublic void PrepareToSave_2012_False()\n\
  {\n  using (ShimsContext.Create())\n  {\n    var dt = DateTime.Parse(\"1/1/2012\"\
  );\n    ShimDateTime.NowGet = () => dt;\n    var ent = new BusinessEntity();\n \
  \   ent.PrepareToSave();\n    Assert.AreEqual(dt, ent.LastUpdatedDate);\n  }\n}\n\
  ```\n\n在测试方法中，首先创建一个 `ShimsContext`，它使得 Fakes 能够替换伪程序集中的任何方法。接下来，使用 `ShimDateTime`\
  \ 类替换来自 `DateTime` 的 `Now` 方法。`ShimDateTime` 类为 `DateTime` 类中的每个方法都有一个属性，该属性可以设置为委托以替换其实现。属性具有\
  \ getter（访问器）和/或 setter（设置器），因此使用 `NowGet` 属性来替换 `DateTime` 的 getter 方法，以返回一个 2012\
  \ 年的日期。\n\n这里的 `getter` 和 `setter` 是很棘手的。它们是描述方法类型的形容词。它们应该加引号吗？\n\n如果你在 2020 年执行此方法，测试仍然会认为它现在是\
  \ 2012 年。接下来，检查业务实体是否分配了正确的 `LastUpdatedDate`。测试应该会成功。请参见 图 A.15。\n\n![Image](img/00037.jpeg)\n\
  \n图 A.15. 使用 Microsoft Fakes\n\n因此，通过 Microsoft Fakes，你可以替换任何类的任何方法，这使其成为测试的理想选择。\n\
  \n#### 使用代码指标查找难以维护的代码\n\nVisual Studio 自带了一系列检查问题的工具。其中一种报告是代码指标（Code Metrics）。要启动代码分析，打开解决方案并选择\
  \ `分析 > 运行代码分析`。Visual Studio 会稍后生成报告（请参见 图 A.16）。\n\n![Image](img/00037.jpeg)\n\
  \n图 A.16. 代码指标结果\n\n此报告显示了几个指示代码可维护性的列：\n\n- **可维护性**：这指示代码的可维护性。最高分（100）意味着代码简单且易于维护。低于\
  \ 60 分通常意味着代码难以维护。\n- **圈复杂度**：这是代码中可能的路径数。单个 `if-else` 会导致复杂度为 2。越低越好。\n- **继承深度**：该类派自多少个类？超过三个会增加类的复杂性。\n\
  - **类耦合**：使用了多少种类型？类使用的类型越多，修改越困难。\n- **行数**：此方法或类中有多少行？\n\n#### 查找代码重复\n\n在旧系统中，一种代码重用技术是复制粘贴。这些重复的代码部分很难可靠地测试你的应用程序，因为某些规则可能在多处实现。Visual\
  \ Studio 2012 通过其“分析解决方案重复”选项轻松地发现了这些重复。它寻找相同或相似的代码片段。要启动重复检测工具，选择 Visual Studio\
  \ 中的“分析”菜单并选择“分析解决方案重复”（请参见 图 A.17）。\n\n![Image](img/00039.jpeg)\n\n图 A.17. 运行重复检测工具\n\
  \n针对我们的示例运行重复检测工具返回精确匹配、强匹配和中等匹配（请参见 图 A.18）。\n\n![Image](img/00040.jpeg)\n\n图 A.18.\
  \ 识别的代码重复\n\n为了确定这些代码片段有多相似，Visual Studio 2012 有一个比较两个文件的工具。选择被识别为重复的两个文件并右键点击获取比较菜单（请参见\
  \ 图 A.19）。\n\n![Image](img/00041.jpeg)\n\n图 A.19. 启动代码重复比较\n\n选择此菜单选项将启动重复比较工具，它向你显示两个代码示例之间的差异（请参见\
  \ 图 A.20）。注意，它只显示识别为重复的代码行，而不是整个文件。\n\n![Image](img/00042.jpeg)\n\n图 A.20. 比较重复代码\n\
