  \ DLL 进行重新编译（并可能重新发布给最终用户）。\n\n应用每个演示模式都支持的视图通用策略，我们将创建一个新类，其中包含视图需要的数据。这种结构所示列表\
  \ 2.2。\n\n列表 2.2. 带有视图模型的 SampleView 接口\n\n点击此处查看代码图像\n\n```csharp\nusing System.Collections.Generic;\n\
