  \n## 关于作者\n\n`Bradley Irby` 是一位出色的软件架构师和 CTO。在他 25 年的的职业生涯中，他监督了高度定制的内部和面向客户应用程序的开发，包括一个用于管理美国银行收回房产的物业管理系统、一个面向高净值人群的商业会计系统、加利福尼亚州圣马特奥县的房产税预测系统，以及\
  \ Chevy 餐厅的分布式报告系统。他的其他工作还包括通用电气、Kashi、富国银行、HP 和 Adidas 的项目，以及 OpenTable 和 Prosper.com\
  \ 等许多中企业和初创公司的项目。\n\nBradley 专注于软件重构和软件迁移，为现有的旧系统注入质量和稳定性。Bradley 已将许多应用程序从 `VB6`、`ASP\
  \ Classic` 和早期 `.NET` 版本转换为具有当前架构和最新质量方法的更现代应用程序。他最近的项目包括重构一个拥有两百万行的 `.NET` 应用程序以使用现代架构和单元测试，导致缺陷数量几乎为零。他擅长在不关闭应用程序或停止功能开发的情况下更新应用程序。使用\
