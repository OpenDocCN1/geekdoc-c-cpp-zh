  \ currentUser)\n    {\n        _user = currentUser;\n        //Bind the user data\
  \ to the necessary controls.\n    }\n}\n\npublic class DataEntryViewController :\
  \ IDataEntryViewController\n{\n    public IDataEntryView View { get; internal set;\
  \ }\n    private User _currentUser;\n    public DataEntryViewController()\n    {\n\
  \        View = ServiceLocator.Resolve<IDataEntryView>();\n        {.View.SaveRequested\
  \ += View_SaveRequested;\n    }\n    void View_SaveRequested(object sender, EventArgs\
  \ e)\n    {\n        if (string.IsNullOrEmpty(_currentUser.Name))\n        {\n \
  \           var dlgSvc = ServiceLocator.Resolve<IDialogService>();\n           \
  \ dlgSvc.Show(\"You cannot leave name blank\");\n            return;\n        }\n\
  \        var repository = ServiceLocator.Resolve<IRepository>();\n        repository.SaveUser(_currentUser);\n\
  \    }\n    public void LoadUserData(int userId)\n    {\n        var repository\
  \ = ServiceLocator.Resolve<IRepository>();\n        _currentUser = repository.GetUser(userId);\n\
  \    }\n    public void Show()\n    {\n        View.Show();\n    }\n}\n```\n\n这段代码示例是向将所有业务逻辑从表单中出的又一大步。在这段代码中，我们在表单和接口中引入了一个名为\
  \ `SaveRequested` 的新事件。当点击表单上的保存按钮时，`DataEntryForm` 不再自己处理保存逻辑，而是将请求传递给控制器，由控制器调用存储库上的\
  \ `save` 方法。通过这种操作，我们将所有数据验证从视图中移除并移动到控制器中，以便进行测试。\n\n这种结构的另一个优势是便于更新 UI。如果我们决定引入另一种保存数据的方式（例如，菜单选项和按钮），我们只需要为菜单选项添加一个触发\
  \ `SaveRequested` 事件的点击处理程序即可。控制器中的逻辑无需任何更改。\n\n在这段代码中，我们还引入了这样一个想法：控制器通过存储库从数据库查询用户数据，而不是由表单进行。表单被赋予了一个用于\
  \ `User` 对象，但它并不关心数据的来源，这完全消除了表单与存储库交互的需求。\n\n通过这种方式，我们继续将业务逻辑从表单中移出。\n\n#### 总结\n\
  这段代码示例是向将所有业务逻辑从表单中出的又一大步。在这段代码中，我们在表单和接口中引入了一个名为 `SaveRequested` 的新事件。当点击表单上的保存按钮时，`DataEntryForm`\
  \ 不再自己处理保存逻辑，而是将请求传递给控制器，由控制器调用存储库上的 `save` 方法。通过这种操作，我们将所有数据验证从视图中移除并移动到控制器中，以便进行测试。\n\
  \n这种结构的另一个优势是便于更新 UI。如果我们决定引入另一种保存数据的方式（例如，菜单选项和按钮），我们只需要为菜单选项添加一个触发 `SaveRequested`\
  \ 事件的点击处理程序即可。控制器中的逻辑无需任何更改。\n\n在这段代码中，我们还引入了这样一个想法：控制器通过存储库从数据库查询用户数据，而不是由表单进行。表单被赋予了一个用于\
  \ `User` 对象，但它并不关心数据的来源，这完全消除了表单与存储库交互的需求。\n\n通过这种方式，我们继续将业务逻辑从表单中移出。\n\n### 注意\n\
  \n所有代码更改已保存到工作区，并可以使用“待处理更改”（Pending Changes）窗口查看待处理的内容。\n\n### 附录：使用 Visual Studio\
  \ 管理项目\n创建解决方案时应该做的第一件事将其添加到源代码控制。在 Visual Studio 中，可以通过选择解决方案、右键点击它并选择“将解决方案添加到源代码控制”（Add\
  \ Solution to Source Control）轻松完成。“将解决方案添加到源代码控制”对话框会提示你识别想要映射解决方案的位置。在你的团队下方选择正确的位置，然后点击确定。\n\
  \n你在上一步中选择的位置称为 `workspace`，Visual Studio 会保持其中的文件与源代码控制服务器同步。对于在多台机器上开发的人员，支持多个工作区。所有代码更改都保存到本地机器上的工作区，并可以使用“待处理更改”窗口查看待处理的内容。要查看“待处理更改”窗口，请到“视图”菜单并选择“团队资源管理器”（Team\
  \ Explorer）。\n\n\n\n\n\n在代码更改的标准过程中，多个开发人员可以编辑同一个文件而互不干扰。当两名开发人员对同一个文件进行了更改（各自在他们自己的机器上）时，第一位开发者按正常提交。然而，第二位开发者会收到警告，提示他（或她）需要合并第一位开发者的更改。在大多数情况下，更改位于文件的不同部分，因此它们不会冲突，系统可以自动合并这些更改。在发生冲突的情况下，你必须手动解决冲突。Visual\
  \ Studio 2012 内置了一个合并冲突工具，当冲突发生时它会自动启动。让我们来看看这个过程。\n\n使用两台不同的机器，在每台机器上打开同一个源文件，并对同一行代码进行修改。例如，如果你编辑了\
  \ `Program` 类，可以在第一台机器上将该类修改为类似于列表 A.1，在第二台机器上修改为列表 A.2。\n\n列表 A.1. 合并冲突演示——编辑 1\n\
  \n点击此处查看代码图像\n\n```csharp\nclass Program\n{\n  static void Welcome()\n  {\n    Console.WriteLine(\"\
  Hello!\");\n  }\n  static void Main(string[] args)\n  {\n    Welcome();\n  }\n}\n\
  ```\n\n列表 A.2. 合并冲突演示——编辑 2\n\n点击此处查看代码图像\n\n```csharp\nclass Program\n{\n  static\
  \ void Main(string[] args)\n  {\n    Console.WriteLine(\"Press any key to quit\"\
  );\n    Console.ReadKey();\n  }\n}\n```\n\n注意 使用 Visual Studio 2012 为解决方案创建新的工作区非常简单。打开\
  \ Team Explorer 并点击 Source Control Explorer 链接。找到你想要处理的解决方案（你之前提交的那个），并双击 `.sln`\
  \ 文件。如果服务器和你的机器之间没有映射，Source Control 会询问你想要将代码放在何处。从现在起，当你提交时，Visual Studio 会将此本地文件夹同步到服务器。\n\
  \n完成上述两个更改后（但尚未提交任何内容），在其中一台机器上打开 Team Explorer 窗口，点击 Pending Changes 链接，输入注释并按下\
  \ Checkin 按钮。提交应该会成功，因为这是该文件首次发送到服务器的更改。\n\n回到另一台机器并提交这些更改。Visual Studio 返回一个错误，显示存在冲突的更改（参见图\
  \ A.4）。\n\n![Image](img/00026.jpeg)\n\n图 A.4. 提交冲突对话框\n\n打开冲突冲突窗口，你可以在此处修复问题。通过点击以下按钮之一，你有四个选项可选：\n\
  \n- **自动合并 (Auto Merge)**：当 Visual Studio 发现没有重叠更改时，此按钮可用。你点击它，所有更改将合并在一起。\n- **在合并工具中合并更改\
  \ (Merge changes in Merge Tool)**：当存在重叠更改时，你需要使用合并工具（不同语言工具可能不同）来手动合并更改。\n- **采用服务器版本\
  \ (Take Server Version)**：在这种情况下，你的更改将被丢弃。\n- **采用本地版本 (Take Local Version)**：丢弃他人进行所有更改。\n\
  \n最简单的选择是选择“在合并工具中合并更改”选项，但由于我们对同一个文件进行了冲突更改，此选项被禁用了。点击“在合并工具中合并更改”（参见图 A.5）将打开内置的合并工具。\n\
  \n![Image](img/00027.jpeg)\n\n图 A.5. 点击在合并工具中合并更改\n\n你可以看到，一个更改（`Welcome` 方法）已经合并，因为它与另一个更改没有冲突。`Main`\
  \ 方法的主体我们需要通过勾选复框选择想要保留的部分来手动处理。我们可以保留任何一个选项，或者都保留。在这种情况下，我们两个都要，因此请按照我们希望代码出现的顺序勾选复框（参见图\
  \ A.6）。\n\n![Image](img/00028.jpeg)\n\n图 A.6. 合并更改窗口\n\n保存你的更改并关闭合并窗口。成功合并这些更改后，你可以尝试再次提交。\n\
  \n当你回到另一台机器时，注意你的合并结果尚未可见。那是因为你需要手动获取最新版本。在右键点击 `Program.cs` 文件时，从下拉菜单选择 Get Latest\
  \ Version（获取最新版本），文件的本地版本将被服务器上的合并版本所替换。\n\n### 在隔离状态下进行更改\n\n有时在重构解决方案时，你需要完成许多可能会干扰其他开发人员的工作。例如，只要你的更改尚未完成，你的代码可能无法编译。然而，如果开发机器崩溃，将这些更改仅留在桌面上是有风险的。在这种情况下，使用多台开发机器也是一个问题，因为很难在机器之间共享代码。这就是\
  \ Visual Studio 的搁存（Shelf）功能可以帮助的地方。\n\nShelf 是源代码控制服务器上的一个地方，与主代码行分离，因此不会影响其他开发人员。它允许你保存更改、将其传输到其他机器，甚至与其他开发人员共享，但代码始终与主代码行隔离。当你对更改满意时（这可能需要几天时间），将这些更改提交到主代码行，以便团队其他成员可以使用。\n\
  \n假设你被叫去处理代码中另一个状态糟糕的问题（即它无法编译）。你需要处理新问题，但你不想丢失已经所做的更改。你只需将此代码存放在 Shelf 上，然后还原工作区中的所有代码，回到团队其他成员正在工作的当前代码版本。修复紧迫的问题并提交代码。然后，当你准备返回此未完成的工作时，可以从\
  \ Shelf 恢复你的本地工作区，你将回到上次离开的地方，并在合并冲突并添加另一个方法之后，如列表 A.3 所示。\n\n列表 A.3. 可以搁存的损坏代码\n\
  \n点击此处查看代码图像\n\n```csharp\nclass Program\n{\n  static void Welcome()\n  {\n    Console.WriteLine(\"\
  Hello!\");\n  }\n  static void NewFeature()\n  {\n    for( int i =\n  }\n  static\
  \ void Main(string[] args)\n  {\n    Welcome();\n    Console.WriteLine(\"Press any\
