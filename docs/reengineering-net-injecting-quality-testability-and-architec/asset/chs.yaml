  \ set; }\n  }\n}\n```\n\n\n\n\n```csharp\npublic bool FreeSamplesAllowed { get;\
  \ set; }\n\n}\n\npublic class OrderLineItem\n{\n    public OrderLineItem(InventoryItem\
  \ item, int quanty, float price)\n    {\n    }\n}\n\npublic class Customer\n{\n\
  \    public bool AllowFreeSamples { get; set; }\n}\n```\n\n这段代码对于新来的人来说更容易理解。守卫语句（guard\
  \ statements）消除了无效数据进入方法的可能性，因此剩余代码可以假设所有参数都是有效的。它们还能更轻松地向新开发者展示已经考虑过的可能错误情况。\n\n\
  某些开发者倾向于将守卫语句放在同一行，如列表 9.6\n\n```csharp\nusing System;\n\nnamespace CodeSamples.Ch09_LegacySolutionCleanup.Listing06\n\
  {\n  public class FormController\n  {\n        public OrderLineItem CreateInventoryLineItem(InventoryItem\
  \ pItem, Customer pCustomer, int pQuantity, float pPrice)\n        {\n         \
  \   if (pItem == null || pCustomer == null || pItem.Discontinued || (pQuantity <=\
  \ 0 && !FreeSampleAllowed(pCustomer, pItem)))\n                throw new ArgumentException(\"\
  Invalid Arguments\");\n            return new OrderLineItem(pItem, pQuantity, pPrice);\n\
  \        }\n\n        internal bool FreeSampleAllowed(Customer pCustomer, InventoryItem\
  \ pItem)\n        {\n            return pCustomer.AllowFreeSamples && pItem.FreeSamplesAllowed;\n\
  \        }\n  }\n\n  public class InventoryItem\n  {\n        public bool Discontinued\
  \ { get; set; }\n        public bool FreeSamplesAllowed { get; set; }\n  }\n\n \
  \ public class OrderLineItem\n  {\n        public OrderLineItem(InventoryItem item,\
  \ int quanty, float price)\n        {\n        }\n  }\n\n  public class Customer\n\
  \  {\n        public bool AllowFreeSamples { get; set; }\n  }\n}\n```\n\n尽管这两个重构后的\
  \ `If` 语句示例实现了防止坏输入输入的相同目标，但第二个示例提供的关于输入被拒绝的原因的信息要少得多。通过将条件放在同一个 `If` 语句中，无法提供关于违反了哪一个条件的详细信息，只能让用户去猜测他们需要修正哪些输入。\n\
  \n这种结构也更难调试，因为 Visual Studio 调试器将整个 `If` 条件视为单个语句，这使得开发者更难确定失败的原因。\n\n在重构这样的 `If`\
  \ 语句之前，最好先创建单元测试，以准确反映重构之前 `If` 语句的结果。这可以确保重构后的方法产生的结果与原始版本完全相同。在重构过程中，我们很容易在无意中对\
  \ `If` 语句的逻辑进行细微更改，而直到缺陷出现时才察觉。\n\n### 移除对实体类构造函数的访问\n\n在使用存储库模式（Repository pattern）时，将任何实体对象的创建限制在存储库中是一个好主意。只有仓库应该能够“实例化（new-up）”新实体，所有其他需要创建实体的类都应该调用仓库来执行此操作。\n\
  \n在日常开发中，这种做法很难执行。如果实体类的构造函数是公共的，开发者往往会走捷径，在业务逻辑中创建他们需要的内容，导致难以发现的缺陷。\n\n解决此问题的方法是将实体的构造函数设置为内部（internal），并使用\
  \ `InternalsVisibleTo` 属性仅赋予仓库对这些构造函数的访问权限。这样做迫使任何使用存储库的业务逻辑通过仓库创建实体，因为任何尝试“实例化”实体的行为都无法通过编译。\n\
  \n这种重构是一个好主意，但在遗留系统中通常难以实现。创建新实体的地方往往随着时间的推移而泛滥，通过重构来限制创建位置是一项耗时且容易出错的任务。试图用存储库调用来替代实体创建是困难的。\n\
  \n#### 总结\n\n清理遗留方案是重工程中的重要一步。适当的项目结构起着重要作用，特别是在大型系统中，因此投入精力构建良好的结构是值得的。通过组织项目，可以切断许多错误的引用。\n\
  \n## 10. 建立基础\n\n现在，我们已经为重工程工作安排好了遗留系统，是时候开始为所有工作奠定基础了。本章的工作在短期内影响不大，因为我们想要引入架构并让它能够编译。本节的工作可以在其他团队成员继续添加功能的同时进行。\n\
  \n我们通过引入 `Bootstrapper`、一个新外壳以及至关重要的 `ServiceLocator` 开始这一过程。当这些就绪后，我们可以创建第一个测试项目来对它们进行测试。\n\
  \n#### 添加新项目\n\n此时，我们创建了第一个新项目：基础设施项目（Infrastructure）、控制器（Controllers）、视图（Views）和接口（Interfaces）。基础设施项目持有我们的\
  \ `ServiceLocator` 以及我们在过程中创建的其他服务。我们还增强了现有的外壳项目，它包含 `Bootstrapper` 和核心程序。\n\nInfrastructure、Interfaces、Controllers\
  \ 和 Views 项目应该创建为类库项目，而现有的外壳应该是 Windows Forms 或 Windows Presentation Foundation\
  \ (WPF) 。\n\n### 使用 Prism、Unity 和 Enterprise Library 版本\n\n在继续之前，我们需要指定将使用的 Prism\
  \ 版本以及你如何获得相同版本。我们使用 `4.1.0.0`、`2.1.505.0`、`4.2.0.0` 和 `5.0.414.0`。使用这些库的正确版本很重要，因为接口与其低版本相比发生了细微变化。\n\
