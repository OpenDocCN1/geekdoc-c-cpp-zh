  #### 总结\n\n\n\n\n\n索引\n\n## 前言\n\n### 什么是软件重构？\n\n任何从业经验超过几年的开发者都面临过增强一个难以维护的应用程序的任务。导航代码结构很困难，确定从何处开始追踪缺陷很困难，进行更改也很困难。对于这些应用程序来说，一切都是困难的。功能增强和\
  \ Bug 修复可能是耗时、高风险且昂昂的。\n\n对于这些遗留应用程序，一种方案是让它们离线一年或更长时间以从头重写。然而，这些应用程序对业务运营至关重要，因此无法长时间停止功能开发。因此，遗留系统的工作仍在继续，通过打补丁和进行修复来尝试通过下一个发布周期。\n\
  \n帮助这些遗留系统的还有另一种方法——软件重构。\n\n### 什么是旧软件？\n\n软件应用程序在构建完成后，会立即开始老化。软件工程是一门年轻的领域，每天都会产生构建应用程序的新方法。随着新工具引入行业，如果当前的应用程序不进行改造以使用这些工具，它们将变得越来越难以维护。\n\
  \n#### 软件老化的原因\n\n软件变老有很多原因。最明显的是当今世界技术进步速度快得惊人。几年前才开发的新的软件技术已经被认为是过时且难以维护的。\n\n\
  职业变频繁已成为常态，这也会加剧代码的退化。当原始开发者收拾行李离开其他公司时，许多代码的原始意图就被遗忘了，留下的开发者只能尽可能收拾残局并尽力地拼凑出解决方案。\n\
  \n通过不断将系统重构为现代技术，对原始架构师的依赖就不再是致命的。新开发者可以轻松地适应系统架构，因为它是更新的，而且在网上可以找到大量关于它的丰富信息。\n\
  \n#### 警告信号\n\n某些迹象可以告诉我们何时何时需要重构点。\n\n#### 开发者对功能请求的抵制\n\n如果开发者抵抗管理或用户增强应用程序的努力，可能是因为系统太难以操作了。随着时间的推移，软件可能会变得脆弱，导致任何功能开发都变得困难且令人沮丧。\n\
  \n#### 发布后立即大量的 Bug 修复工作\n\n如果开发团队在软件新发布后立即淹没在缺陷通知中，表明缺乏现代质量工具。重构过程的一部分包括引入这些自动化质量工具，这样缺陷率应该显著降低。\n\
  \n#### 持续的质量问题\n\n旧软件往往可以通过其包含的缺陷数量以及修复这些缺陷所需的精力来显示其年龄。软件越老、越脆弱，在不破坏其他东西的情况下修复问题就越困难。如果你发现每修复一个缺陷就会出现两个缺陷，这就是应用程序需要重构的信号。\n\
  \n遗留应用程序特别容易出现质量问题，因为它们无法支持 `Unit Testing`（单元测试）和 `System Mocking`（系统模拟）等新的质量保证方法。在没有这些工具的情况下，对系统进行更改可能会在看似与所做更改完全相关的区域产生缺陷。\n\
  \n### 软件重构的目标和优势\n\n软件重构的目标是通过注入现代架构和软件开发技术，增量地改进现有系统，同时继续通过新功能增强系统，且永远不需要让系统离线。这意味着我们可以对一个现有系统进行缓慢改进，直到它提升到现代软件开发标准，而不需要进行大规模的、集中的重写工作。在整个重构项目期间，系统都准备好进行生产发布。换句话说，我们可以在维修飞机的同时保持它在空中。\n\
  \n#### 注入现代架构\n\n软件系统的架构决定了许多必要细节是如何构建的。尝试使用最新方法为旧系统构建新的数据输入表单，就像尝试在双翼机上安装喷气发动机。你可能会让它飞起来，但机架支撑不了多久。\n\
  \n大多数经理在听到系统架构必须更新时的第一反应是假设应用程序必须从头重写。这并不一定如此。只要按照正确的顺序并使用正确的步骤引入新部分，就可以增量地使架构更新。\n\
  \n注入新架构并不一定需要一个团队投入巨大努力。这里描述的方法可以由一个小团队（甚至是一个架构师）缓慢引入，无论整个开发团队的规模如何或代码行数有多少。每一步都是一个独立的元素，可以在可以在不影响应用程序其他部分的情况下引入。注入新架构和质量衡量不需要大量的预算或专门的团队。\n\
  \n#### 在从不离线的情况下添加新功能\n\n书中的步骤设计为不会干扰可能同时进行的其他开发。这些结构的引入方式使得它们在添加期间不会产生负面影响，但当完成后，只需几行代码即可开启。这使得产品经理能够继续接受新功能请求并将新版本推向生产环境，而在后台，这些新版本中的每一个都比上一个版本好一点再好一点。\n\
  \n任何由单个开发者花费超过一天的增强都设计为分步发布，以便应用程序可以继续工作，部分功能已转换为新结构，而部分功能仍在使用旧结构。\n\n随着应用程序的每个部分转换为新设计，它将变得更具测试性，应用程序的缺陷率应该大幅下降。\n\
  \n#### 与敏捷方法良好相处\n\n许多开发工作场所已采用某种敏捷开发策略。对于那些不熟悉这种方法的人来说，敏捷的一个基本原则是短期的开发努力（以天或周为单位，称为\
  \ `Sprint`），在结束时，应用程序处于潜在的可发布状态。\n\n保持应用程序处于潜在的可发布正是重构的核心。所做的每项更改都应该是完整且自包含的，这样当代码提交时，系统仍然运行良好，但运行方式略好一些，且质量更高。这就是书中的步骤设计方式。每一步都可以在一个\
  \ `Sprint` 内完成，通常在一天内完成。少数需要更多时间的重构工作被设计为即使实施了一半，也不会对系统产生影响。系统继续运行，只是某些功能按旧方式运行，另一些按新方式运行。\n\
  \n#### 降低风险\n\n在多年使用软件系统后，业务用户会形成一套使用它来完成工作的模式。从头重写系统可能会丢失这些未记录的流程，迫使用户适应新系统调整工作流。\n\
  \n\n\n\n重构维护了这些作为公司正常运作部分的、未记录的业务流程。通过缓慢地向现有系统注入新架构，这些流程得以保持不受干扰。如果引入某些新架构在某种程度上扰乱了正常的业务流，将获得立即反馈，因为应用程序可以像往常按照快速进度推送到生产环境。\n\
  \n## 降低成本\n\n从头重写一个系统意味着所有的业务逻辑也必须从头重新开发。旧系统通常投入了大量的时间和知识，这些投入在字面上被抛弃了，并在重写时必须重新创建。\n\
  \n重构节省了这些巨大的投入并重用了现有的业务逻辑代码，节省了大量的时间和金。重构项目可以跳过的任务数量是巨大的。必须创建的需求文档更少，因为现有系统已经体现了需求。这可以节省业务分析师研究和记录所有用户需求方面的数周或几个月的时间。实现这些需求的业务逻辑也已经完成，因此可以节省更多成本。\n\
  \n1990 年，W. M. Ulrich 在 `American Programmer` 10 月刊上写了一篇文章，在文中描述了一个估计从头重写需要 5000\
  \ 万美元的商业系统。同一个项目通过重构以总计 1200 万美元的成功实现。重构的成本可以远低于新开发。\n\n## 这本书是给谁看的？\n\n本书旨在帮助任何维护这些系统运行的人员。对于技术经理和产品经理，它描述了提高系统可靠性所需的流程——使其运行更快、更容易维护，且缺陷更少。对于架构师和开发人员，它包含了对新架构可能选择的详细描述，以及实现关键部分所需的代码。它包含了关于如何通过添加现代架构和自动化测试方法来逐步改进应用程序结构和质量的详细建议。遵循书中概述的步骤可以提高应用程序的质量，并更容易更快速地添加新功能。\n\
  \n重构现有系统比从头构建等等系统更简单、更便宜、风险更低。如果你遵循书中概述的建议，你将能够提高开发速度和最终质量，同时“让飞机保持飞行”。\n\n我希望你发现这本书是一本极好的资源和节省时间的工具。\n\
