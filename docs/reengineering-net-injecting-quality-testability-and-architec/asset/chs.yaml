  \ `.NET` 用户组，并是全美范围内技术软件主题的频繁演讲者。他拥有北卡罗来纳大学的计算机科学学士学位和加州大学伯克利分校的工商管理硕士（MBA）学位。\n\
  \n# 第一部分：目标架构\n\n## 1. 实现面向服务的架构\n\n在我们开始查看代码以及它需要如何更改之前，我们需要讨论一下我们正尝试迁移的整体架构。理解我们要去哪里将使我们在在此过程中更容易做出正确的决策。\n\
  \n我们将实现一种面向服务的架构 (SOA)。这种设计从高层面上描述了我们的软件架构，解释了大型部分应该如何交互，以至于应用程序不会变得紧耦合。这种方法贯穿整本书，因此理解此处的原则对你项目的成功至关重要。\n\
  \n`SOA` 是一种设计应用程序使其可扩展且易于维护的方法。`SOA` 原则由 Thomas Erl 在 2005 年正式形成（[`soaprinciples.com/`](http://soaprinciples.com/)）并并在近年来一直是一个流行的设计选择。发表的原则适用于大型系统，这些系统可以运行在任何可以通过网络访问的硬件上。在完整的描述中，这些服务可以是应用程序内部或外部的，甚至由开发团队之外的人管理，因此服务发现和组件的描述是\
  \ Thomas Erl `SOA` 描述的重要组成部分。如果你设计了一个可以被外部实体的服务，例如网站的 `API` 或供其他开发人员使用的第三方库，这些是极佳的待遵循准则。\n\
  \n对于本书来说，我们只使用了 Erl 卓越著作中介绍的部分原则。我们假设所有服务都是应用程序内部，并且你对所构建的服务了如指，因此接口定义在构建时都是知的。换句话说，我们假设在构建代码时你对使用的所有服务都有完全的理解和控制。不需要构建代码使其能够动态适应不断变化的外部服务。这一假设并不意味着我们不能将构建的服务提供给外部实体；在书中，我们不需要花费额外的精力向外部世界宣传该服务，也不需要费力创建一个外部可用的功能定义。如果必要设计并构建一个外部可用的服务（例如网站的公共\
  \ `API`），额外的 `Erl` 原则可以轻松适用于这些实例。\n\n#### 面向服务的架构概述\n\n\n\n\n\nSOA（面向服务的架构）涉及一组被称为服务的类，这些类为应用程序提供各种功能。它们是我们应用程序大部分部分的构建构建块，因此被频繁使用。服务之间互不关联，可以作为单独的部分运行，也可以协同工作。创建独立的服务可以提高应用程序的可维护性，因为每个服务都可以增强甚至替换，而不影响系统的其他部分。这种模块化还促进了部分之间的解耦，允许组件有更好的复用。（我们将在本章后面的部分讨论什么是解耦。）\n\
  \n通常情况下，有两种服务需要构建。\n\n-   **应用无关服务（Application agnostic services）**：无关服务是指那些在不了解其所属应用程序任何信息的情况下就能提供的服务。它们不包含特定于应用程序的业务规则，没有特定于业务的数据操作，也不包含需要此类知识的外部代码引用。\n\
  \n-   应用无关服务的一个示例是将日志消息写入文本文件的类。这种类可以被任何类型的应用程序使用，无论该应用的业务目的是什么。记录器类或服务所需的方法和属性在不同应用程序之间可能不会改变，因此日志记录器是应用无关的。\n\
  \n-   另一个示例是与 Facebook 交互的类。这种类可以以通的方式构建，以便在其他应用程序中无需任何更改即可复用。任何特定于应用程序的数据可以在需要时传递\
  \ Facebook 服务。\n\n-   应用无关服务也可以是类的集合，例如用户管理系统。同一个用户和安全信息在不同应用程序之间以相同的方式使用是很常见的，例如维护用户名、密码以及登录用户被授予的任何安全角色。如果这种逻辑足够通用，可以在不同的应用程序之间使用，那么它就是应用无关的。\n\
  \n-   **应用特定服务（Application specific services）**：这些服务需要了解它们工作所在的特定问题领域。通常，这意味着它们处理特定于应用程序的数据，或者它们实施了不适用于通用业务应用程序的业务规则。这些服务可能也可以在同一公司的其他地方使用，但在不同的环境中可能没有用处。\n\
  \n-   应用特定服务的一个示例是执行特定业务规则的类。假设你正在构建一个销售管理系统，任何超过 100,000 美元的潜在销售必须经过销售经理的批准。此规则特定于它所属的应用程序，因此执行此规则的任何类都是应用特定的。\n\
  \n在构建服务时，我们将尽可能使它们具有应用无关性，以提高它们的移植性。我们还将把这两种服务保持在不同的项目中，以进一步实现它们的复用。应用无关服务并不常见，但在遇到它们时会很有用，因此在与它们一起工作时，我们需要额外注意，不要用特定的业务逻辑污染这些服务。\n\
  \nSOA 中的服务可以使用以下章节中的基本原则进行描述。\n\n### 理解标准化的服务合约\n\n每个服务都必须有一个发布且标准化的服务合约，调用者可以依赖它。服务合约仅仅是一个类，描述了该类为调用者提供的属性和方法。在我们的应用程序中，我们使用接口来实现服务合约。接口在\
  \ C# 或 VB.NET 中可用（事实上，几乎所有语言都支持接口），因此这不会限制你在项目中所使用的语言。\n\n服务合约是 SOA 的一个基本方面，因为允许调用代码使用服务提供的功能，而无需直接引用执行逻辑的实际类。这被称为松耦合，我们将在下一节中详细讨论它。\n\
  \n***\n\n**注意**\n\n在第 4 章 的“理解依赖反转原则”中，你将学习如何在没有直接引用的情况下创建和使用服务。这是我们所使用的架构的关键部分。\n\
  \n***\n\n#### 接口\n\n接口仅描述实现类提供的方法、属性或事件的签名。接口不提供实现这些功能的任何逻辑（事实上，内部编写了逻辑的接口是无法编译的）。\n\
  \n### 创建接口\n\n如列表 1.1 所示，创建接口的语法与创建类的语法略有不同。\n\n列表 1.1. `创建`接口\n\n点击此处查看代码图像\n\n\
  ***\n\n```csharp\n  /// <summary>\n  /// 接口仅描述类为供使用而暴露的属性\n  /// 方法和事件。\n  /// 接口中不允许实现这些功能的\n\
  \  /// 逻辑。\n  /// </summary>\n  public interface IExample\n  {\n    /// <summary>\n\
  \    /// 实现类必须提供的\n    /// 字符串属性的示例。\n    /// </summary>\n    string StringProperty\
  \ { get; set; }\n    /// <summary>\n    /// 只读属性的示例。\n    /// </summary>\n    string\
  \ ReadOnlyStringProperty { get; }\n    /// <summary>\n    /// 接受两个参数的方法的示例。\n  \
  \  /// </summary>\n    int OperateTwoNumbers(int pNum1, int pNum2);\n  }\n```\n\n\
  ***\n\n在这个示例中，接口描述了两个属性和一个方法，任何想要实现的类都必须提供这些。根据定义，接口中描述的任何项目都是可用的，因此接口名称以大写字母“I”开头，后跟实现类的名称。\n\
  \n### 实现接口\n\n接口本身几乎用，因为它不能包含逻辑。我们需要构建一个实现这些项的类，如列表 1.2 所示。\n\n列表 1.2. 实现接口\n\n\
  点击此处查看代码图像\n\n***\n\n```csharp\n  /// <summary>\n  /// 实现类必须提供接口描述的\n  /// 项，否则项目将无法构建。\n\
  \  /// 实现类可以添加任何认为合适的\n  /// 功能。\n  /// </summary>\n  public class Example : IExample\n\
  \  {\n    /// <summary>\n    /// 实现接口描述的 StringProperty。\n    /// </summary>\n \
  \   public string StringProperty { get; set; }\n    /// <summary>\n    /// ReadOnlyStringProperty\
  \ 不能有公共设置器，\n    /// 但可以有私有、保护或内部设置器。\n    /// </summary>\n    public string ReadOnlyStringProperty\
  \ { get; internal set; }\n    /// <summary>\n    /// 实现类必须提供接口的方法签名，\n    /// 即使方法中没有添加逻辑，它仍然可以编译。\n\
  \    /// </summary>\n    public int OperateTwoNumbers(int pNum1, int pNum2)\n  \
  \  {\n      return pNum1 + pNum2;\n    }\n    /// <summary>\n    /// 允许对实现类进行任何进一步自定义。\n\
  \    /// </summary>\n    public bool MethodNotInTheInterface()\n    {\n      return\
  \ true;\n    }\n  }\n```\n\n***\n\n\n\n\n\n此类实现了 Listing 1.2 中的接口，正如你在包含类定义的行中所看到的。对于一个类要实现一个接口，它必须提供该接口中描述的所有项。如果实现类没有实现接口中定义的内容，程序将无法编译。另一方面，该类可以根据需要实现任意额外的属性，而不会影响接口。这允许你添加任何必要的额外代码，以使类能够执行它承诺的职责。\n\
  \n实现接口的类必须满足的唯一要求是实现接口描述的所有项的签名。由于接口没有指定方法的实现方式，因此只要方法存在，我们就不需要提供任何逻辑。\n\n在 Listing\
  \ 1.3 所示的示例中，我们决定对于我们的用途，`OperationOnTwoNumbers` 方法不需要实现，因此我们简单地抛出一个 `NotImplementedException`。如果你认为实现类不需要定义某个方法，那么抛出此异常比将其留空要好。通过抛出异常，我们可以确保在意外调用该方法时会遇到该错误。如果我们把实现留空，该方法可能会在不知情的情况下被调用并导致难以发现的缺陷。\n\
  \nListing 1.3. 一个显示方法不需要实现逻辑的示例\n\n点击此处查看代码图像\n\n```csharp\n/// <summary>\n    ///\
  \ 实现接口中描述的方法不需要\n    /// 添加恰当的逻辑，只需提供\n    /// 方法签名。\n    /// </summary>\n    public\
  \ int OperateOnTwoNumbers(int pNum1, int pNum2)\n    {\n      throw new NotImplementedException(\"\
  OperateOnTwoNumbers\");\n    }\n```\n\n### 使用接口\n\n现在我们已经定义了接口和实现类，让我们来看看如何在业务逻辑中使用该接口。Listing\
  \ 1.4 中的示例展示了实现某些业务逻辑的类是如何使用接口和实现类的。（目前，我们只是简单地使用 `new` 关键字创建 `Example` 类。很快，我们将探索创建这些类的更好方法，称为服务定位（Service\
  \ Location）。）\n\nListing 1.4. 使用接口\n\n点击此处查看代码图像\n\n```csharp\n /// <summary>\n\
  \  /// 这是一个使用我们刚刚创建的\n  /// 接口的类。\n  /// </summary>\n  public class BusinessLogic\n\
  \  {\n    public int UseInterfaceImplementation()\n    {\n      //尽管我们正在创建一个真实的\
  \ Example 类，\n      //但将其赋值给 IExample 变量。\n      IExample sampleClass = new Example();\n\
  \      // 我们可以使用反映接口的变量，\n      // 就像它是真实的类一样。\n      return sampleClass.OperateOnTwoNumbers(1,\
  \ 2);\n    }\n  }\n```\n\n这里需要注意的重要点是，尽管我们创建了具体类 `Example`，但我们的变量定义为接口而不是类。这意味着从该变量可以使用的唯一方法和属性是接口中的。如\
  \ Figure 1.1 所示，`MethodNotInTheInterface` 方法是不可用的。\n\n![图像](img/00004.jpeg)\n\n\
  图 1.1. 接口中未定义的方法不可。\n\n接口的一个强大且至关重要的方面是，多个类可以同时实现同一个接口。除了 Listing 1.2 中的类外，我们还可以在同一个项目中声明后续类。如\
  \ Listing 1.5 所示，只要它们具有满足接口的正确签名，接口中项的实现可以与第一个类的实现完全不同。\n\nListing 1.5. 接口的第二种实现\n\
  \n点击此处查看代码图像\n\n```csharp\n /// <summary>\n  /// 这是 IExample 接口的第二个实现。\n  /// 它与另一个实现没有关系，并且可以\n\
  \  /// 实现完全不同的逻辑。\n  /// </summary>\n  public class AlternateExample : IExample\n\
  \  {\n    /// <summary>\n  /// String 属性与之前的相同。\n    /// </summary>\n    public\
  \ string StringProperty { get; set; }\n    /// <summary>\n    /// ReadOnlyProperty\
  \ 将始终返回\n    /// 给定的值。\n    /// </summary>\n    public string ReadOnlyProperty\n\
  \    {\n      get { return \"I'm Alternate\"; }\n    }\n    /// <summary>\n  ///\
  \ 此方法以不同的方式处理两个\n    /// 输入，返回一个与之前的实现\n    /// 完全不同的结果。\n    /// </summary>\n \
  \   public int OperateOnTwoNumbers(int pNum1, int pNum2)\n    {\n      return pNum1\
  \ * pNum2;\n    }\n  }\n```\n\n这些是使用接口的重要特性。我们为什么需要在服务中具备这些方面的原因将在后面的章节中详细解释。由于服务有了接口，你的代码将变得更加灵活且更容易使用。\n\
  \n### 耦合\n\n耦合指的是两段代码之间的关系。类可以是紧耦合或松耦合的，这取决于一个类对另一个类的了解程度。一个类对另一个类的了解越多，它们就越紧耦合。“亲密了解”意味着什么？考虑\
  \ Listing 1.6 中的示例。\n\nListing 1.6. 紧耦合类的示例\n\n点击此处查看代码图像\n\n```csharp\n /// <summary>\n\
  \  /// 此类将从数据库检索字符串\n  /// 并显示在屏幕上。\n  /// </summary>\n  public class ShowInfo\n\
  \  {\n    /// <summary>\n    /// 主驱动\n    /// </summary>\n    public void GetAndShowData(int\
  \ recordId)\n    {\n      ADODB.Recordset data = GetData();\n      DisplayForm frm\
  \ = GetForm();\n      ShowDataInForm(frm, data);\n    }\n    /// <summary>\n  ///\
  \ 打开 SQL Server 的 ADO 连接，\n    /// 获取数据并返回。\n    /// </summary>\n    public ADODB.Recordset\
  \ GetData()\n    {\n      var connection = new ADODB.Connection();\n      connection.ConnectionString\
  \ = \"my connection string\";\n      connection.Open();\n      var rs = new ADODB.Recordset();\n\
  \      //以下查询是针对 SQL Server 的\n      //它在 Oracle 上无法正常执行。\n      rs.Open(\"Microsoft\
  \ SQL Specific Query\", connection);\n      rs.ActiveConnection = null;\n      return\
  \ rs;\n    }\n    /// <summary>\n  /// 获取用于我们显示的正确表单\n    /// </summary>\n    private\
  \ DisplayForm GetForm()\n    {\n      return new DisplayForm();\n    }\n    ///\
  \ <summary>\n  /// 在给定的表单向用户显示信息。\n    /// </summary>\n    public void ShowDataInForm(DisplayForm\
  \ frm, ADODB.Recordset data)\n    {\n      frm.UserInfo = data;\n      frm.Show();\n\
  \    }\n  }\n\n  /// <summary>\n  /// 向用户显示信息的表单。\n  /// </summary>\n  public class\
  \ DisplayForm : Form\n  {\n    private readonly Label _userFirstNameLbl;\n    private\
  \ readonly Label _userLastNameLbl;\n    private ADODB.Recordset _userInfo;\n   \
  \ /// <summary>\n  /// 创建数据显示表单的构造函数。\n    /// </summary>\n    public DisplayForm()\n\
  \    {\n      _userFirstNameLbl = new Label();\n      Controls.Add(_userFirstNameLbl);\n\
  \      _userLastNameLbl = new Label();\n      Controls.Add(_userLastNameLbl);\n\
  \    }\n  }\n```\n\n\n\n\n```csharp\n/// 将数据分配到相应标签的属性。\n/// </summary>\npublic\
  \ ADODB.Recordset UserInfo\n{\n    get { return _userInfo; }\n    set\n    {\n \
  \       _userInfo = value;\n        _userFirstNameLbl.Text = _userInfo.Fields[0].ToString();\n\
  \        _userLastNameLbl.Text = _userInfo.Fields[0].ToString();\n    }\n}\n```\n\
  \n* * *\n\n在这个示例中，`ShowDatabaseInfo` 类与许多事物都是紧耦合的。首先，让我们检查与 `DisplayForm` 的紧耦合情况。在代码中直接创建对象会产生紧耦合，因为它对该特定类产生了依赖。假设我们声明了另一个显示表单，如\
  \ 列表 1.7 所示。\n\n列表 1.7. DisplayForm 的子类\n\n点击此处查看代码图像\n\n* * *\n\n```csharp\npublic\
  \ class DisplayFormDescendant : DisplayForm\n{\n    //empty class\n}\n```\n\n* *\
  \ *\n\n我们的 `DisplayFormDescendant` 没有给 `DisplayForm` 添加任何内容。它的行为与 `DisplayForm`\
  \ 完全相同，在理论上，它是完美的替换。然而，再次查看我们的 `ShowDatabaseInfo` 类，如果 `GetForm` 方法尝试创建并返回 `DisplayFormDescendant`\
  \ 而不是 `DisplayForm`，解决方案将无法编译。为了实现这种替换，我们必须将所有出现 `DisplayForm` 的地方更改为 `DisplayFormDescendant`。这被称为对\
  \ `DisplayForm` 的依赖，它使得代码变得脆弱（brittle）。\n\n此示例中另一个紧耦合的例子是与数据访问技术 Active Data Objects\
  \ (ADO)。如果引入了另一种数据访问技术（例如 `EntityFramework`）并且我们想要迁移到它，由于对 ADO 相关类的各种各种依赖，我们将不得不重构整个应用程序。这种对\
  \ ADO 的紧耦合使得应用程序变得脆弱，因为对某一个部分的任何尝试都会导致其他地方不相关的更改。\n\n示例中一个更微妙的依赖是针对 Microsoft SQL\
  \ Server 的。由于我们的数据查询包含了 Microsoft SQL Server 特有的细节，因此无法迁移到 Oracle。如果应用程序需要同时支持 Microsoft\
  \ 和 Oracle，我们将不得不维护两段完全不同的代码。这就是脆弱的代码。\n\n在接下来的章节中，你将学习如何将这种紧耦合的脆弱代码转换为更易更新的内容。接口（Interfaces）是这一转换的关键部分。\n\
  \n#### 理解服务抽象\n\n服务抽象指的是类的内部工作机制对外部操作的隐藏程度。我们应该尽可能将许多服务属性和方法设置为 `private`，以防止外部调用者操作服务中非预期用途的内容。通过隐藏这些信息，我们强制应用程序更加松耦合。\n\
  \n回到 列表 1.6 中的示例，考虑 `ShowDatabaseInfo` 类和 `DisplayForm` 类之间交互的方式。`ShowDatabaseInfo`\
  \ 直接向表单暴露的标签赋值值。\n\n列表 1.8. 直接向标签赋值值\n\n点击此处查看代码图像\n\n* * *\n\n```csharp\n/// <summary>\n\
  /// 在指定的表单中向用户显示信息。\n/// </summary>\npublic void ShowDataInForm(DisplayForm frm,\
  \ ADODB.Recordset data)\n{\n    frm.UserFirstNameLbl.Text = data.Fields[0].ToString();\n\
  \    frm.UserLastNameLbl.Text = data.Fields[0].ToString();\n    frm.Show();\n}\n\
  ```\n\n* * *\n\n想象你想要更改表单以使用不同类型的控件来显示信息，例如列表框。这种对表单的更改不会影响 `ShowDatabaseInfo` 类中的逻辑，但由于表单缺乏抽象，将需要对该类中进行代码更改。\n\
  \n引入一种让这两个类在没有这种紧耦合的情况下交互的方法，意味着我们必须为表单创建一个抽象，以便它可以根据需要进行更改，而无需对使用它的类进行相应的更改。这种服务抽象的思想使类能够根据需要演进。检查实现相同目的的抽象代码。\n\
  \n列表 1.9. 紧耦合类的抽象版本\n\n点击此处查看代码图像\n\n* * *\n\n```csharp\n/// <summary>\n/// 此类将从数据库检索字符串并\n\
