  \ goes here.\n    }\n  }\n}\n```\n\n这是任何数据输入表单的简化版本。我们有一个 `ShellForm`，它包含一个按钮，可以在屏幕上显示\
  \ `DataEntryForm`。该 `DataEntryForm` 被赋予了一些数据以便用户显示并编辑。用户根据情况编辑这些数据，并按下“保存”按钮表示编辑完成；数据随后会被存回数据库。这种基本工作流在不同的类中显示，并使用了仓库进行数据存储。\n\
  \n注意，在 `saveBtn_Click` 方法中，我们有一些业务逻辑来确保用户名不能为空。当我们将其转换为控制器时，这些业务逻辑必须被维护。本节的目标是尽可能从\
  \ `DataEntryForm` 中提取功能并放入控制器中，而不丢失任何功能。我们的第一步是引入控制器。\n\n#### 准备视图\n\n第一步是准备好供 `ServiceLocator`\
  \ 解析的视图。在列表 13.2 中，我们创建了 `IDataEntryView` 接口并让 `DataEntryForm` 类实现该接口。我们更新了 `ShowRequested`\
  \ 方法，使用 `ServiceLocator` 和接口来创建视图。\n\n列表 13.2 重构旧版表单以添加 IDataEntry 接口\n点击此处查看代码图片\n\
  \n```cs\nprivate void ShowViewRequested(object sender, System.EventArgs e)\n{\n\
  \  var frm = ServiceLocator.Resolve<IDataEntryView>();\n  frm.LoadUserData(1);\n\
  \  frm.Show();\n}\n```\n\n```cs\npublic interface IDataEntryView\n{\n  void LoadUserData(int\
  \ userId);\n  void Show();\n}\n\npublic class DataEntryView : Form, IDataEntryView\n\
  {\n  private TextBox _userName;\n  private User _user;\n  private Button _saveBtn;\n\
  }\n```\n\n为了实现此操作，我们只需要添加一个接口并让视图实现该接口。这允许我们将接口和表单的注册项添加到 `Bootrapper` 中，这样表单就可以被\
  \ `ServiceLocator` 解析。在列表 13.2 中，你还可以看到 Shell 表单现在通过 `ServiceLocator` 解析 `DataEntryForm`，而不是使用\
  \ `new` 关键字。\n\n#### 引入控制器\n\n下一步是为视图引入一个控制器。为了做到这一点，我们创建控制器类，并添加足够的逻辑使其解析并显示 `DataEntryForm`。列表\
  \ 13.3 显示了我们为实现这一点所做的更改。注意 `ShowRequested` 方法再次发生了变化；这次它变变为通过 `ServiceLocator` 解析控制器，而不是解析视图。\n\
  \n列表 13.3 引入控制器\n点击此处查看代码图片\n\n```cs\nprivate void ShowViewRequested(object sender,\
  \ System.EventArgs e)\n{\n  var controller = ServiceLocator.Resolve<IDataEntryFormController>();\n\
  \  controller.LoadUserData(1);\n  controller.Show();\n}\n```\n\n```cs\npublic interface\
  \ IDataEntryViewController\n{\n  void LoadUserData(int userId);\n  void Show();\n\
  }\n\npublic class DataEntryViewController : IDataEntryViewController\n{\n  public\
