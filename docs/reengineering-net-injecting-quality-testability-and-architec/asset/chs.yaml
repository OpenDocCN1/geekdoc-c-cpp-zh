  \ DLL 引用的构建错误，而该引用明明存在，请检查引用 DLL 的路径。这些库有时会被其他程序注册到 GAC（全局程序缓存集），而 Visual Studio\
  \ 默认在该位置引用它们。还请检查引用中的版本号，以确保它是正确的。\n\n***\n\n#### 适配外壳（Shell）\n\n你需要适配的第一的是旧应用程序运行的外壳。外壳是包含组成应用程序的其他窗口和控件的应用程序窗口。业务应用程序的外壳设计通常类似于\
  \ Microsoft Outlook。也就是说，顶部有菜单和功能区（ribbon）或工具栏，左侧有导航应用程序的方法，右侧有工作区。由于无法确定你的外壳应该什么样，我们假设\
  \ Outlook 的设计就是你的设计方式。图 10.3 显示了我们的外壳设计样式。如果你的外壳看起来不像这里所示的，不要担心。这里描述的所有技巧仍然适用。\n\
  \n![Image](img/00021.jpeg)\n\n图 10.3. 目标外壳设计\n\n你当前的旧外壳可能已经在后台代码（code behind）中包含了业务逻辑，我们将将其保留。在整个项目过程中，我们将这些代码重构到控制器（controller）中，但现在由于我们一次性引入了太多内容，最好让后台代码现状。\n\
  \n***\n\n### 注意\n\n在接下来的讨论中，我们使用两个术语（View 视图和 Form 表单）来表示显示在屏幕上的窗口。`form` 是可以在应用程序中独立显示的完整窗口。`view`\
  \ 是 UI 元素的集合，必须显示在 `form` 或另一个 `view` 内部。将 `view` 视为面板及其所有内容，而 `form` 继承自 `System.Windows.Form`\
  \ 是最好的想法。\n\n***\n\n#### 创建 IBaseView\n\n在这一步中，我们通过创建一个它们继承的基接口，为其余视图奠定基础。在 Interfaces\
  \ 项目中，创建 Listing 10.1 中描述的接口。\n\n代码列表 10.1. 为视图提供基础\n\n点击此处查看代码图像\n\n***\n\n```csharp\n\
  namespace CodeSamples.Ch10_EstablishFoundation.Listing01\n\n{\n  /// <summary>\n\
  \  /// 每个视图的基本组件\n  /// </summary>\n  public interface IBaseView\n  {\n    /// <summary>\n\
  \    /// 此方法激活给定的视图\n    /// 显示。\n    /// </summary>\n    void SetActive();\n\n\
  \    /// <summary>\n    /// 使此视图注册以供\n    /// 来的激活\n    /// </summary>\n    void\
  \ InActivate();\n  }\n}\n```\n\n***\n\n`IBaseView` 是视图实现的接口（见下一节）。`IBaseView` 上的两个方法是\
  \ `SetActive` 和 `InActivate`。\n\n#### 适配外壳\n\n通过编辑当前的 `ShellForm`，我们引入了 `IShellForm`\
  \ 接口并实现了两个所需的方法。现在，这些方法可以是空的。\n\n第一步，我们简单地引入了一个标记接口（marker interface），我们可以将其注册到\
  \ `ServiceLocator` 中，以便在需要时解析出外壳。该接口稍后会扩展到更多内容，但目前它包含了我们需要的一切。\n\n#### 添加外壳控制器\n\
  \n我们希望将控制器连接到视图，以便将业务逻辑迁移到那里，因此在 Controllers 和 Interfaces 项目中创建 Listing 10.3 接口和类。\n\
  \n代码列表 10.3. 创建 Shell 表单控制器和接口\n\n点击此处查看代码图像\n\n***\n\n```csharp\nusing CodeSamples.Ch10_EstablishFoundation.Listing02;\n\
  \nusing CodeSamples.Ch10_EstablishFoundation.Listing04;\n```\n\n\n\n\n\n```csharp\n\
  namespace CodeSamples.Ch10_EstablishFoundation.Listing03\n{\n  /// <summary>\n \
  \ /// 此接口应该在 Interfaced 项目中创建\n  /// </summary>\n  public interface IShellFormController\n\
  \  {\n    IShellForm View { get; }\n  }\n\n  /// <summary>\n  /// 此类应该在 Controllers\
  \ 项目中创建\n  /// </summary>\n  public class ShellFormController : IShellFormController\n\
  \  {\n    public IShellForm View { get; internal set; }\n    public ShellFormController()\n\
  \    {\n      View = ServiceLocator.Resolve<IShellForm>();\n    }\n  }\n}\n```\n\
  \n`ShellFormController` 中唯一的功能是通过 `ServiceLocator` 解析我们的 `ShellForm` 的代码。最终，shell\
  \ 后台代码（codebehind）中的所有代码将移动到控制器中以提高可测试性，但在第一步中，我们只是引入控制器架构。\n\n### 创建服务定位器\n\n`ServiceLocator`\
  \ 是我们在重构应用程序中添加的下一个类。它是整个应用程序使用的的核心组件，因此我们在 Infrastructure 项目中创建它，以便所有其他项目都可以引用它。如之前所述，`ServiceLocator`\
  \ 是我们少数允许作为静态类的类之一。\n\n我们的 `ServiceLocator` 看起来类似于 Listing 10.4。\n\nListing 10.4.\
  \ 实现服务定位器\n\n点击此处查看代码图像\n\n```csharp\nusing System;\nusing Microsoft.Practices.Unity;\n\
  namespace CodeSamples.Ch10_EstablishFoundation.Listing03\n{\n  /// <summary>\n \
  \ ///为需要访问这些服务的客户端代码\n  /// 提供定位服务。\n  /// </summary>\n  public class ServiceLocator\n\
  \  {\n    /// <summary>\n    /// 可以解析所需项的 Unity 容器。\n    /// 这在 Bootstrapper 中设置。\n\
  \    /// </summary>\n    /// <remarks>\n    /// 将 getter 设置为私有，以免其他人尝试用它\n    ///\
  \ 注册东西。强制他们使用 Resolve\n    /// 方法进行解析。\n    /// Getter 是内部的，以便让测试代码访问。\n    ///\
  \ </remarks>\n    public static IUnityContainer Container { internal get; set; }\n\
  \n    /// <summary>\n    /// 创建并返回注册到 T 的类实例。\n    /// </summary>\n    public static\
  \ T Resolve<T>()\n    {\n      return Container.Resolve<T>();\n    }\n\n    ///\
  \ <summary>\n    /// 创建并返回注册到 T 的类实例，\n    /// 该类使用给定的名称进行了注册。\n    /// </summary>\n\
  \    public static T Resolve<T>(string pName)\n    {\n      return Container.Resolve<T>(pName);\n\
  \    }\n\n    /// <summary>\n    /// 创建并返回注册到 T 的类实例。\n    /// </summary>\n    public\
  \ static object Resolve(Type T)\n    {\n      return Container.Resolve(T);\n   \
  \ }\n\n    /// <summary>\n    /// 将给定的对象与代理对象 T 注册。\n    /// </summary>\n    public\
  \ static void RegisterInstance<T>(T pObject)\n    {\n      Container.RegisterInstance<T>(pObject);\n\
  \    }\n\n    /// <summary>\n    /// 将给定的对象与代理对象 T 注册，\n    /// 并用给定的发生名称对其进行标记。\n\
  \    /// </summary>\n    public static void RegisterInstance<T>(string pOccranceName,\
  \ T pObject)\n    {\n      Container.RegisterInstance<T>(pOccranceName, pObject);\n\
  \    }\n\n    /// <summary>\n    /// 注册给定的代理类型，以创建并返回\n    /// 给定的类。\n    /// </summary>\n\
  \    public static void RegisterType<T, U>() where U : T\n    {\n      Container.RegisterType<T,\
  \ U>();\n    }\n\n    /// <summary>\n    /// 注册给定的代理类型，以创建并返回\n    /// 给定的类。为此实例命名，以便\n\
  \    /// 调用者可以访问它。\n    /// </summary>\n    public static void RegisterType<T, U>(LifetimeManager\
  \ pLifetimeManager) where U : T\n    {\n      Container.RegisterType<T, U>(pLifetimeManager);\n\
  \    }\n  }\n}\n```\n\n这与之前讨论的 `ServiceLocator` 相同，所以不应该有任何意外。注意，没有注册服务或接口的代码。该逻辑放置在我们创建的\
  \ `Bootstrapper` 中。\n\n#### 设置 BootStrapper\n\n`Bootstrapper` 是我们用于启动应用程序中必要进程的类。它是我们所有后续工作的入口点，因此它显然是一个关键组件。根据你所使用的框架，有不同类型的\
  \ Bootstrapper 可以实现。例如，CaliburnMicro 有一个，Prism 有另一个，以此此类推。尽管如此，所有的 Bootstrappers\
  \ 都基于相同的原理：初始化应用程序并显示 shell。\n\n**注意**\n\n在接后的 Bootstrapper 示例中，显示了让 Bootstrapper\
  \ 显示所需的精裸代码。在后面的章节中，我们向这些 Bootstrappers 中添加了许多新的服务和接口注册。如果你想查看完整的 Bootstrapper 像什么，请参考书中提供的\
  \ TargetArchitecture 解决方案。\n\n#### 创建 Winforms BootStrapper\n\nBootstrapper 应该放置在包含应用程序\
  \ shell 的项目中。这种结构使我们能够根据想要使用的 shell 更改 Bootstrapper，这为拥有截然不同的 shell 可能，这些 shell\
  \ 使用领域模型和仓库，但与其他应用程序共享基本服务。\n\n由于我们使用 `Unity` 进行依赖注入，我们让 Bootstrapper 继承自位于 `Microsoft.Practices.Prism.UnityExtensions`\
  \ 命名空间的 `UnityBootstrapper`。这为我们提供了许多功能，包括创建 `Unity` 容器，如 Listing 10.5 所示。\n\nListing\
  \ 10.5. Winforms 应用程序的 Bootstrapper 实现\n\n点击此处查看代码图像\n\n```csharp\nusing System.Windows;\n\
  using CodeSamples.Ch10_EstablishFoundation.Listing02;\nusing CodeSamples.Ch10_EstablishFoundation.Listing03;\n\
  using CodeSamples.Ch10_EstablishFoundation.Listing04;\nusing Microsoft.Practices.Prism.UnityExtensions;\n\
  using Microsoft.Practices.Unity;\nnamespace CodeSamples.Ch10_EstablishFoundation.Listing05\n\
  {\n  /// <summary>\n  /// 此类将在 Shell 项目中创建。\n  /// </summary>\n  public class BootstrapperWinforms\
  \ : UnityBootstrapper\n  {\n    /// <summary>\n    /// 这是我们自定义 bootstrapper 的入口点，\n\
  \    /// 由基类调用。\n    /// </summary>\n    protected override void ConfigureContainer()\n\
  \    {\n      base.ConfigureContainer();\n      ServiceLocator.Container = Container;\n\
  \      RegisterControlsAndControllers(Container);\n      RegisterServices(Container);\n\
  \    }\n\n    /// <summary>\n    /// 为应用程序注册所有服务。\n    /// </summary>\n    protected\
  \ void RegisterServices(IUnityContainer container)\n    {\n      // 服务注册将放在这里。\n\
  \    }\n\n    /// <summary>\n    /// 注册视图和控制器。\n    /// </summary>\n    protected\
  \ void RegisterControlsAndControllers(IUnityContainer container)\n    {\n      //\
  \ 我们的 shell 也应该是单例。\n      container.RegisterType<IShellForm, ShellForm>(new ContainerControlledLifetimeManager());\n\
  \      container.RegisterType<IShellFormController, ShellFormController>(new ContainerControlledLifetimeManager());\n\
  \    }\n\n    /// <summary>\n    /// 返回 shell 的控制器以便 Program.cs\n    /// 运行应用程序\
  \ shell。这是 Winforms 特有的，\n    /// 应该在 WPF 版本中进行替换。\n    /// </summary>\n    public\
  \ IShellFormController ShellController\n    {\n    }\n  }\n}\n```\n\n\n\n\n```csharp\n\
  \      get\n      {\n        var x = Container.Resolve<IShellFormController>();\n\
  \        return x;\n      }\n    }\n    /// <summary>\n    /// 这是 UnityBootstrapper\
  \ 的要求，因为\n    /// 它是基于 WPF 构建的。对于 Winforms\n    /// 来说没有意义，所以我们直接返回 null。\n    ///\
  \ </summary>\n    protected override DependencyObject CreateShell()\n    {\n   \
  \   return null;\n    }\n}\n}\n```\n\n我们的 Bootstrapper 在 `ConfigureContainer` 方法中获取控制权，该方法由\
  \ `UnityBoostrapper` 基类在创建时调用。`Bootstrapper` 的第一个动作是使用在基类 `UnityBootstrapper` 中创建的\
  \ `Unity` 容器初始化 `ServiceLocator`。然后，我们使用服务、视图和控制器初始化容器。为了清晰起见，我们将服务的注册和控制器的注册拆分到了不同的方法中。\n\
  \n当我们注册每个类时，必须决定是否希望该类表现为单例（singleton）。对于大多数服务，我们希望它们是单例，以节省内存并减少垃圾回收器的处理时间。我们只需通过在注册调用中添加\
  \ `ContainerControlledLifetimeManager` 即可将普通服务转换为单例，如 `RegisterControlsAndControllers`\
  \ 方法中的 `RegisterType` 方法调用所示。然而，如果你决定将服务设为单例，请记住单例必须是无状态的。服务内部不应保存任何影响从一次调用到下一次调用结果的变量。\n\
  \n另一方面，大多数控制器和视图不是单例，因为我们希望同时创建多个，所以它们在注册时没有带这个参数。唯一的例外是 shell 视图和控制器，因为我们希望一次只有一个处于激活状态。（如果你熟悉单例模式或或如何使用\
  \ Unity 将服务注册为单例，请参见第 4 章，“理解依赖倒转原则”）\n\n在基础 `Bootstrapper` 中，我们只注册了 shell 表单和控制器，但最终这里会有更多的注册。每个表单都有与其关联的接口，该接口已注册到容器中。\n\
  \n在 `ShellController` 属性中，我们通过容器解析 `ShellFormController`，因此如果该类在其他地方被引用，将始终返回同一个控制器。注意，控制器被注册为单例。这强制执行了应用程序只能有一个\
  \ shell 的规则。对于其他视图，如果应用程序允许同时存在多个，则视图和控制器被注册为非单例。\n\n在 `CreateShell` 方法中，我们简单地返回\
  \ `null`。`Bootstrapper` 的创建是考虑了 WPF 的，我们将其适配以用于 Winforms。此基类 `Bootstrapper` 有一个名为\
  \ `CreateShell` 的抽象属性，用于创建 WPF shell。在我们的案例中，我们通过控制器创建 shell，因此没有必要的。\n\n### 更新\
  \ Winforms 程序类\n\n到目前为止，我们没有更改旧系统的运行方式，只是引入了一些新的（且很少使用的）类。现在我们更新 `Program` 类，以便开始配合\
  \ `Bootstrapper` 使用我们的工作。注意，业务逻辑并没有改变。当我们完成对 `Program` 文件的修改后，旧应用程序的功能将与之前完全相同，只是关键功能被委托给了现在可以完全测试的类。\n\
  \n列表 10.6 显示了应用程序 `Program` 类的 `Main` 方法。这里应该是创建和初始化 `Bootstrapper` 的地方，以便它在应用程序生命周的最早阶段可用。\n\
  \n列表 10.6 带有 Bootstrapper 化的 Main 程序类\n\n点击此处查看代码图片\n\n```csharp\nusing System;\n\
  \nusing System.Windows.Forms;\nusing CodeSamples.Ch10_EstablishFoundation.Listing05;\n\
  namespace CodeSamples.Ch10_EstablishFoundation.Listing06\n{\n  /// <summary>\n \
  \ /// 此类已经存在于 Shell 项目中。\n  /// </summary>\n  static class Program\n  {\n    ///\
  \ <summary>\n    /// 应用程序的入口点。\n    /// </summary>\n    [STAThread]\n    static\
  \ void Main()\n    {\n      BootStrapperWinforms bootStrapper = null;\n      try\n\
  \      {\n        Application.EnableStyles();\n        Application.SetCompatibleRenderingDefault(false);\n\
  \        bootStrapper = new BootStrapperWinforms();\n        bootStrapper.Run();\n\
  \      }\n      catch (Exception ex)\n      {\n        MessageBox.Show(\"应用程序启动期间发生错误。应用程序现在将退出。错误详情：n\
  \ \" + ex);\n        return;\n      }\n      try\n      {\n        // 强制转换是必要的，以便将\
  \ Shell\n        // 视为应用其余接口。\n        var shellController = bootStrapper.ShellController;\n\
  \        var mainShellForm = shellController.View as Form;\n        Application.Run(mainShellForm);\n\
  \      }\n      catch (Exception exc)\n      {\n        //这里是我们处理应用程序其他部分\n    \
  \    // 未处理异常的地方。\n      }\n    }\n  }\n}\n```\n\n我们通过通过添加对 `Bootstrapper` 的调用开始修改\
  \ `Program` 类。由于 `BootStrapper` 是我们初始化应用程序所有内容的方式，为了初始化应用程序所需的所有内容，我们创建 Bootstrapper\
  \ 并调用 `Run` 方法。如果在第一个 `Try..Catch` 块中遇到错误，源于基础架构，因此可能无法恢复。显示消息并退出。稍后可以增强此 catch\
  \ 块以记录错误。\n\n在第二个 `Try..Catch` 块中，我们通过 Bootstrapper 解析 shell 的控制器。该控制器通过 `View`\
  \ 属性暴露 `IShellView`。Winforms 不理解此接口，因此我们必须视图转换为 `form` 以作为 `Application.Run` 的参数。运行此视图将该窗口变为应用程序的主\
  \ shell。\n\n在此部分的 `Catch` 块中，我们处理应用程序其他部分未处理的异常。换句话说，这是异常冒泡到顶端时的“最后手段”错误处理块。最终，我们将引入错误日志服务添加到此\
  \ catch 块中以记录任何意外错误。\n\n### 创建 WPF 和 Bootstrapper\n\n在 WPF 中，我们初始化应用程序和运行 shell\
  \ 的方式不同。`IBaseView` 和 `IShellView` 是相同的，`ServiceLocator` 也是如此。`ShellViewController`\
  \ 已重命名为 `ShellViewModel` 并稍有修改，让我们先检查它。\n\n列表 10.7 显示了实现 WPF 版本 Shell Form `ViewModel`\
  \ 和接口的核心代码。\n\n列表 10.7. WPF 类\n\n点击此处查看代码图片\n\n```csharp\nusing CodeSamples.Ch10_EstablishFoundation.Listing02;\n\
  using CodeSamples.Ch10_EstablishFoundation.Listing04;\nnamespace CodeSamples.Ch10_EstablishFoundation.Listing07\n\
  {\n  public interface IShellFormViewModel\n  {\n    IShellForm View { get; }\n \
  \   void Activate();\n  }\n  public class ShellFormViewModel : IShellFormViewModel\n\
  \  {\n    public IShellForm View { get; internal set; }\n    public ShellFormViewModel()\n\
  \    {\n      View = ServiceLocator.Resolve<IShellForm>();\n    }\n    public void\
  \ Activate()\n    {\n      //子视图必须在这里解析，而不是在\n      //构造函数中\n    }\n  }\n}\n```\n\
  \n\n\n\n```csharp\n//让 view 有时间注册其区域。\n\n  }\n\n}\n}\n```\n\n\n\n\n\nListing 10.10\
  \ 显示了一个由两个不同的服务实现的接口示例。在运行时，我们可以检查客户是否购买了货币转换功能，并在适当的情况下注册功能完整的服务。如果客户没有购买此功能，我们则注册一个无所事事的占位服务（dummy\
  \ service）。通过这种方法，代码的其他部分永远不需要考虑客户是否拥有适当许可证。它只需使用已注册的货币转换器即可。\n\n### Listing 10.10.\
  \ 实现占位服务和真实服务\n\n点击此处查看代码图像\n\n* * *\n\n```csharp\nusing System;\n\nusing System.Collections.Generic;\n\
  \n//此示例展示了我们如何拥有两个不同的服务\n//它们都实现相同的接口，然后在运行时\n//决定注册哪个服务供使用。\n\nnamespace CodeSamples.Ch10_EstablishFoundation.Listing10\n\
  {\n  public enum Currency\n  {\n    Dollar,\n    Euro,\n    Yen\n  }\n\n  public\
  \ interface ICurrencyConverter\n  {\n    decimal Convert(Currency destinationCurrency,\
  \ decimal sourceAmt);\n  }\n\n  /// <summary>\n  /// 一个非常简单的货币转换器，仅供\n  /// 购买它的客户使用。\n\
  \  /// </summary>\n  public class CurrencyConverter : ICurrencyConverter\n  {\n\
  \    private Dictionary<Currency, decimal> _conversionRates;\n    public CurrencyConverter()\n\
  \    {\n      _conversionRates = new Dictionary<Currency, decimal>();\n      //添加代码填充\
  \ _conversionRates 字典\n    }\n\n    public decimal Convert(Currency destinationCurrency,\
  \ decimal sourceAmt)\n    {\n      var conversionFactor = _conversionRates[destinationCurrency];\n\
  \      return conversionFactor * sourceAmt;\n    }\n  }\n\n  /// <summary>\n  ///\
  \ 占位货币转换器，提供给\n  /// 未购买全功能转换器的客户。\n  /// </summary>\n  public class CurrencyConverterDummy\
  \ : ICurrencyConverter\n  {\n    public decimal Convert(Currency destinationCurrency,\
  \ decimal sourceAmt)\n    {\n      if (destinationCurrency != Currency.Dollar)\n\
  \        throw new ArgumentException(\"Please purchase currency module\");\n   \
  \   return sourceAmt;\n    }\n  }\n}\n```\n\n* * *\n\n在这个示例中，我们的客户必须购买额外的货币转换器模块才能将货币转换为目标货币。在代码中随处放置\
  \ `If` 语句来检查是否注册了货币转换器是太繁琐了，因此，我们的业务逻辑始终假设有一个可用的货币转换器并恰当地使用它。然后我们注册一个无所事事的占位货币转换器，这样那些没有购买该模块的客户就不会获得额外功能。使用\
  \ XML 文件实现这种策略是困难的，因为我们无法添加必要的逻辑来检查是否购买了货币模块。\n\n在我们讨论客户以及他们如何使用系统时，让我们来看看那些对你的应用程序“自认为最明智”的客户问题。在\
  \ XML 文件中注册服务可能会让客户产生一种想法：他可能想要移除或替换某个注册，将其替换为他认为更好的配置。这种经历需要大量的调试时间，并且最终需要实地访问，以确定用于移除“不必要”注册的配置文件被修改了。\n\
  \n在 XML 文件中注册项目有一个优势，那就是消除了 Shell 项目与支持项目之间必要的紧密耦合。如果 Bootstrapper（引导程序）存在于 Shell\
  \ 项目中且注册是在代码中完成的，那么 shell 必须对支持类有硬引用。使用 XML 注册策略可以移除这些引用，创建一个更松耦合的 Shell 项目。\n\n\
  你使用哪种方法取决于你的选择，尽管混合模式是首选。在代码中注册必要的服务，然后读取 XML 文件（如果存在）以根据需要替换任何这些注册。这允许配置文件使用自定义版本来覆盖任何默认服务，并在必要时添加新服务，同时仍保证每个类至少有一个默认版本是可用的。\n\
  \n#### 总结\n\n在本章中，我们讨论了引入应用程序基础的这一关键步骤。我们在这里讨论的项目概述了我们在整个项目中所处随用内容的核心内容，并决定了我们的应用程序如何运行和增长的许多方面。现在我们已经完成了这一工作，可以继续分离应用程序的各个部分，使其更加松耦合且易于处理。\n\
  \n## 11. 针对服务的基础重构\n\n在项目的这一阶段，我们开始更改现有代码以使用我们已经安装的基础设施。到目前为止，我们对遗留系统的逻辑只做了极少的改动。我们引入了新的架构元素，但除了启动过程和\
  \ Shell 之外，我们还没有在任何地方开始使用它们。本章将讨论开始将新架构集成到现有遗留系统所需的首次更改。\n\n本章中建议的重构应该按顺序进行，因为它们按影响从最小到最大的顺序列出。从影响最小且最可预测的服务开始是重要的，因为在引入第一个服务时，必须进行结构性更改。必须添加项目引用以访问\
  \ `ServiceLocator`、接口和其他项目。你还希望在基类中创建适当的按需服务解析属性，以便后类不再需要再次声明这些属性。首先实现一个较高级的服务不仅需要将此基础设施添加到遗留项目中，可能还需要重构包围在被替换的方法调用周围的业务逻辑。最好的方法是在过程的每一步中尽可能尽可能少的更改，因此我们从需要逻辑更改最少的服务开始。\n\
  \n#### 使用 DialogService\n\n添加到应用程序的第一个服务是 `DialogService`。该服务的唯一职责是向用户显示消息并可能获取回复并返回给调用者。该服务并不感知消息的内容或回复的重要性。它只是接收一个消息参数，根据调用者发送的参数创建相应的对话框，显示消息并返回回复。它没有内部状态，任何组件都可以随时调用它，而无需担心系统中可能发生的其他事情。\n\
  \n`DialogService` 是一个很好的早期添加服务，因为它专注于明确且易于创建。它也是任何应用程序单元测试策略的关键部分。重构以使用 `DialogService`\
  \ 通常是一项轻松的工作，而且应该调用服务的地方也很容易找到。\n\n第一步是编写 `DialogService`。这个服务最初是简单的，但可以轻松扩展以满足额外需求。将\
  \ Listing 11.1 中的类添加到你的服务项目，并将接口添加到接口项目。\n\n### Listing 11.1. 示例 DialogService\n\
  \n点击此处查看代码图像\n\n* * *\n\n```csharp\nusing System.Windows.Forms;\n\nnamespace CodeSamples.Ch11_RefactorToBasicServices.Listing01\n\
  {\n  /// <summary>\n  /// 对话服务将向用户显示消息\n  /// 并根据调用者的请求接受适当的回复。\n  /// </summary>\n\
  }\n```\n\n\n\n\n\n```csharp\n/// </summary>\npublic class DialogService : IDialogService\n\
  {\n    /// <summary>\n    /// 在对话框中向用户显示指定的消息，\n    /// 仅包含 OK 按钮。\n    /// </summary>\n\
  \    public void Show(string pUserMessage)\n    {\n        MessageBox.Show(pUserMessage);\n\
  \    }\n    /// <summary>\n    /// 使用指定的窗口标题和按钮向用户显示消息。\n    /// </summary>\n  \
  \  public DialogResult Show(string pUserMessage, string pCaption,\n      MessageBoxButtons\
  \ pMessageBoxButtons)\n    {\n        return MessageBox.Show(pUserMessage, pCaption,\
  \ pMessageBoxButtons);\n    }\n}\n\npublic interface IDialogService\n{\n    void\
  \ Show(string pUserMessage);\n    DialogResult Show(string pUserMessage, string\
  \ pCaption,\n      MessageBoxButtons pMessageBoxButtons);\n}\n```\n\n如列表所示，`DialogService`\
  \ 非常简单。它接受调用者传递的字符串并在对话框中显示该字符串，用户需要点击 OK 按钮。另一个重载方法提供了更多的控制，但意图是相同的。\n\n现在我们已经有了对话服务，可以重构旧代码来使用它了。列表\
  \ 11.2 显示了实现 `DialogService` 之前的旧代码示例。\n\n列表 11.2. 重构为 DialogService 之前的旧方法\n\n\
  点击此处查看代码图片\n\n```csharp\nusing System;\nusing System.Windows.Forms;\nnamespace CodeSamples.Ch11_RefactorToBasicServices.Listing02\n\
  {\n    public class BusinessLogicClass\n    {\n        /// <summary>\n        ///\
  \ 一个可以重构为使用对话服务的方法的示例。\n        /// </summary>\n        public bool ValidateDateRange(DateTime\
  \ pStartDate, DateTime pEndDate)\n        {\n            if (pEndDate < pStartDate)\n\
  \            {\n                MessageBox.Show(\"End Date must be after Start Date\"\
  );\n                return false;\n            }\n            return true;\n   \
  \     }\n    }\n}\n```\n\n要重构这段代码，我们首先必须通过 `BootStrapper` 将新的 `DialogService` 注册到\
  \ `ServiceLocator`。完成后，我们只需使用 `ServiceLocator` 解析单例 `IDialogService` 的引用。使用该引用，我们调用\
  \ `Show` 方法，任务就完成了。列表 11.3 显示了使用 `DialogService` 重新工程后的代码。\n\n列表 11.3. 重构为 DialogService\
  \ 之后的旧方法\n\n点击此处查看代码图片\n\n```csharp\nusing System;\nusing CodeSamples.Ch10_EstablishFoundation.Listing04;\n\
  using CodeSamples.Ch11_RefactorToBasicServices.Listing01;\nnamespace CodeSamples.Ch11_RefactorToBasicServices.Listing03\n\
  {\n    public class BusinessLogicClass\n    {\n        /// <summary>\n        ///\
  \ 一个可以重构为使用对话服务的方法的示例。\n        /// </summary>\n        public bool ValidateDateRange(DateTime\
  \ pStartDate, DateTime pEndDate)\n        {\n            if (pEndDate < pStartDate)\n\
  \            {\n                var dialogSvc = ServiceLocator.Resolve<IDialogService>();\n\
  \                dialogSvc.Show(\"End Date must be after Start Date\");\n      \
  \          return false;\n            }\n            return true;\n        }\n \
  \   }\n}\n```\n\n在这段代码中，我们删除了对 `MessageBox` 的调用，将其替换为对 `DialogService` 的调用。由于我们在上一章中引入了\
  \ `ServiceLocator`，因此在这里很容易使用它来解析我们需要的服务。\n\n列表 11.3 代码的一种稍微不同的替代方案是使用按需服务属性（on-demand\
  \ service property）。逻辑完全相同；但对话服务的解析被交到了一个缓存服务指针的属性中。这种用法非常方便，因为你可以随心所欲使用该属性，而无需担心它是否已初始化。它还能让代码运行更快，因为你不需要在第二次时解析引用。无论是否使用这个便利功能都不会影响我们在此推荐的过程，请实现最符合你逻辑的方法。列表\
  \ 11.4 显示了我们将旧系统重构为使用 `DialogService` 后的方法。顶部使用按需服务属性来解析我们服务的引用。\n\n列表 11.4. 使用按需属性重构为\
  \ DialogService 之后的旧方法\n\n点击此处查看代码图片\n\n```csharp\nusing System;\nusing CodeSamples.Ch10_EstablishFoundation.Listing04;\n\
  using CodeSamples.Ch11_RefactorToBasicServices.Listing01;\nnamespace CodeSamples.11_RefactorToBasicServices.Listing04\n\
  {\n    public class BusinessLogicClass\n    {\n        private IDialogService DialogSvc\n\
  \        {\n            get\n            {\n                return _dialogSvc ??\
  \ (_dialogSvc = ServiceLocator.Resolve<IDialogService>());\n            }\n    \
  \    }\n        private IDialogService _dialogSvc;\n        /// <summary>\n    \
  \    /// 一个可以重构为使用对话服务的方法的示例。\n        /// </summary>\n        public bool ValidateDateRange(DateTime\
  \ pStartDate, DateTime pEndDate)\n        {\n            if (pEndDate < pStartDate)\n\
  \            {\n                DialogSvc.Show(\"End Date must be after Start Date\"\
  );\n                return false;\n            }\n            return true;\n   \
  \     }\n    }\n}\n```\n\n如所示，此更改对应用程序的逻辑没有影响。消息的显示方式与之前一样，逻辑继续按原有路线运行。唯一的区别是将显示消息的责任交给了我们的服务。然而，在项目层面，为了实现这一行代码可能必须进行许多更改。需要对\
  \ `Infrastructure` 项目的引用才能访问 `ServiceLocator`。我们还必须引用 `Interfaces` 项目以获取 `IDialogService`\
  \ 接口。这两个项目特意维护为不引用系统的任何其他项目，以减少循环引用的概率。这就是为什么我们先做简单的服务。\n\n### 注意\n`DialogService`\
  \ 是一个应该注册为单例（Singleton）的服务良好示例。该类可以从任何地方调用，并且没有状态。将其注册为单例可以节省资源并提高运行速度。以下是使用 `ContainerControlledLifetimeManager`\
  \ 将服务注册为单例的示例：\n\n```csharp\ncontainer.RegisterType<IDialogService, DialogService>(\n\
  \  new ContainerControlledLifetimeManager());\n```\n\n#### 单元测试\n既然代码的影响如此小，你可能会疑惑为什么在\
  \ `MessageBox` 已经可靠地满足需求的情况下，还需要 `DialogService`。我们使用 `DialogService` 而不是 `MessageBox`\
  \ 是为了让代码具有可测试性。\n\n假设你有某些代码检查特定的错误条件并在发现该条件时向用户显示消息。当你为这段代码创建单元测试时，成功的测试会在屏幕上显示消息，这需要有人点击\
  \ OK 按钮。在单元测试期间在屏幕上显示消息会极大降低测试的效率，因为自动化构建服务器会在有人点击按钮之前停止测试套件的执行。我们可以使用条件编译指令（#if\
  \ 语句）包裹对 `MessageBox` 的调用，但通过这种方法，我们永远无法确定在生产环境中运行的代码是否经过了充分测试。我们也无法测试消息是否真的显示了。\n\
  \n\n\n\n\n## 引言\n\n这就是 `DialogService` 发挥用场的地方。通过创建一个由服务定位器（service locator）解析的服务并使用该服务显示任何消息，你就可以让实时代码显示相应的错误信息，同时让单元测试仍能正确运行。你可能会发现旧代码通过使用条件编译解决了这个问题。如果是这样，则应该删除这些代码并替换为服务解析。\n\
  \n通过我们重构的应用程序，我们可以使用 `DialogService` 的模拟（mock）来解决测试问题。通过在容器中注册 `DialogService` 的模拟对象而不是真实服务，就不需要特殊的代码或编译器指令来指示你是否正在运行\
  \ Debug 模式。我们的模拟对象是由实时代码解析的，而不是真实的 `DialogService`，而且我们的模拟 `DialogService` 仅注册它已经在实时代码的屏幕上显示了消息这一事实。\n\
  \n参考列表 11.4 中的旧代码示例，你原始的单元测试看起来像列表 11.5（也就是说，这些是我们重构之前对旧代码的测试）。\n\n### 列表 11.5.\
  \ 重构为带有 OnDemand 属性的 DialogService 的旧方法\n\n点击此处查看代码图像\n\n```csharp\nusing System;\n\
  \nusing System.Windows.Forms;\n\nusing Microsoft.VisualStudio.TestTools.UnitTesting;\n\
  \nnamespace CodeSamples.Ch11_RefactorToBasicServices.Listing05\n{\n  public class\
  \ BusinessLogicClass\n  {\n    /// <summary>\n    /// 可以重构为使用\n    /// 对话服务的的方法示例。\n\
  \    /// </summary>\n    public bool ValidateDateRange(DateTime pStartDate, DateTime\
  \ pEndDate)\n    {\n      if (pEndDate < pStartDate)\n      {\n          MessageBox.Show(\"\
  End Date must be after Start Date\");\n          return false;\n      }\n      return\
  \ true;\n    }\n  }\n  [TestClass]\n  public class MockingExampleTestClass\n  {\n\
  \    static BusinessLogicClass _bizLogic;\n    [ClassInitialize]\n    public static\
  \ void ClassInitialize(TestContext context)\n    {\n      _bizLogic = new BusinessLogicClass();\n\
  \    }\n    [TestMethod]\n    public void ValidateDateRange_ValidDates_NoMessage()\n\
  \    {\n      var startDt = new DateTime(2000, 1, 1);\n      var endDt = new DateTime(2000,\
  \ 1, 2);\n      var result = _bizLogic.ValidateDateRange(startDt, endDt);\n    \
  \  // 如果方法返回给我们，\n      // 我们可以假设没有显示消息。\n      Assert.IsTrue(result);\n    }\n\
  \    [TestMethod]\n    public void ValidateDateRange_SameDates_NoMessage()\n   \
  \ {\n      var startDt = new DateTime(2000, 1, 2);\n      var result = _bizLogic.ValidateDateRange(startDt,\
  \ endDt);\n      // 如果方法返回给我们，\n      // 我们可以假设没有显示消息。\n      Assert.IsTrue(result);\n\
  \    }\n    [TestMethod]\n    public void ValidateDateRange_InvalidDates_ShowsMessage()\n\
  \    {\n      var startDt = new DateTime(2000, 1, 2);\n      var endDt = new DateTime(2000,\
  \ 1, 1);\n      // 这将在屏幕上显示一个对话框。\n      var result = _bizLogic.ValidateDateRange(startDt,\
  \ endDt);\n      Assert.IsFalse(result);\n    }\n  }\n}\n```\n\n如果你逐步执行最后一个无效日期的测试，你会看到测试在屏幕上显示了一个对话框，你必须按下\
  \ OK 按钮才能继续。没有自动化的方法点击该按钮，所以如果你想让整个测试套件在自动化服务器上运行，必须移除该测试。在此示例中使用 `MessageBox` 会导致该方法无法测试。\n\
  \n现在参考列表 1.4 中相同方法的重构版本。如果你在这些代码上运行相同的测试，它们仍然会在屏幕上显示消息。我们需要做的是引入 `DialogService`，它不显示消息。我们通过创建模拟对象并将其注册到我们的依赖注入中来实现，这替换了当前的注册。单元测试更改为类似于列表\
  \ 1.6 的样子。\n\n### 列表 1.6. 改为使用模拟服务的单元测试\n\n点击此处查看代码图像\n\n```csharp\nusing System;\n\
  \nusing System.Windows.Forms;\nusing CodeSamples.Ch10_Foundation.Listing04;\nusing\
