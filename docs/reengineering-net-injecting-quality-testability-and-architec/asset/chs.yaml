  \n#### 实现抽象工厂\n\n解决这种困境的方法是实现抽象工厂模式。`Factory`（工厂）是一个其唯一职责是在请求时创建其他东西。创建工厂类并没有消除示例中创建支持对象的需求，但它至少将代码集中，使得只需要在一个地方进行维护。如果任何内容的构造函数发生变化，我们只需要在一个地方更新代码。\n\
  \n我们创建的工厂所示 Listing 4.4。\n\nListing 4.4. 抽象工厂示例\n\n* * *\n\n```csharp\n  /// <summary>\n\
  \  /// 创建服务的抽象工厂类。\n  /// </summary>\n  public static class ObjectFactory\n  {\n\
  \    /// <summary>\n    /// 此属性将在应用程序启动或用户登录时，在知道要使用什么 URL 时设置。\n    /// </summary>\n\
  \    public static string SecurityURL { get; set; }\n    public static SecurityService\
  \ CreateSecurityService()\n    {\n      return new SecurityService(SecurityURL);\n\
  \    }\n    public static Repository CreateRepository()\n    {\n      return new\
  \ Repository();\n    }\n  }\n```\n\n\n\n\n\n在这段代码中，我们创建了 `ObjectFactory` 类，它可以根据请求创建\
  \ `SecurityService` 或 `Repository`。这是朝着正确方向的一步，因为它让我们能够从 `SaleRegistrationService`\
  \ 中移除安全 URL 字符串。该字符串仅在创建 `PermissionProvider` 时需要，而现在工厂负责了这一工作，我们就不再需要它了。从 `SaleRegistrationService`\
  \ 中移除它简化了构造函数和逻辑。\n\n请注意，我们将工厂设为了静态类。这是必要的，这样我们可以在应用程序启动时在某处设置 `SecurityURL`，以便在任何需要的地方供使用。另一种替代方案是要求每个需要\
  \ `SaleRegistrationService` 或 `SecurityService` 的类都知道此 URL 的正确值，这违背了工厂的初衷。由于工厂在整个系统中都被使用，因此将其设为静态类也使其便于访问和使用。\n\
  \n***\n\n### 注意事项\n\n在应用程序中创建静态类有很多问题，因此创建静态类通常不是一个好主意。我们在这里这样做仅作为通向目标架构的过渡步骤。\n\
