  \ UI 方法（例如热键），则需要更新视图以暴露此额外的处理程序，并需要更新控制器以处理该事件。另外请注意，用户最大化窗口的请求被发送到控制器，然后由控制器调用表单上的正确方法。\n\
  \n现在考虑等效示例，但采用 MVP 配置，如列表 2.5 所示。\n\n### 列表 2.5. 向演示器暴露事件的 MVP 视图\n\n点击此处查看代码图像\n\
  \n```csharp\nusing System;\nusing System.Windows.Forms;\n\nnamespace CodeSamples.Ch02_ApplicationArchitecture.Listing05\n\
  {\n  public class SampleForm : Form\n  {\n    private DataGrid Grid;\n    private\
  \ Button showDetailsBtn;\n    private Button maximizeWindowBtn;\n    private ContextMenu\
  \ mnu;\n    public event EventHandler ViewDetailsRequested;\n    public event EventHandler\
  \ MaximizeWindowButtonClicked;\n    public SampleForm()\n    {\n      Grid = new\
  \ DataGrid();\n      showDetailsBtn = new Button();\n      maximizeWindowBtn = new\
  \ Button();\n      mnu = new ContextMenu();\n      showDetailsBtn.Click += showDetailsBtn_Click;\n\
  \      maximizeWindowBtn.Click += maximizeWindowBtn_Click;\n      var mnuItem =\
  \ mnu.MenuItems.Add(\"Details\");\n      mnuItem.Click += mnuItem_Click;\n    }\n\
  \    void maximizeWindowBtn_Click(object sender, EventArgs e)\n    {\n      //maximize\
  \ window\n    }\n    void mnuItem_Click(object sender, EventArgs e)\n    {\n   \
  \   if (ViewDetailsRequested != null)\n        ViewDetailsRequested(this, e);\n\
  \    }\n    void showDetailsBtn_Click(object sender, EventArgs e)\n    {\n     \
  \ if (ViewDetailsRequested != null)\n        ViewDetailsRequested(this, e);\n  \
  \  }\n  }\n  public class SampleFormPresenter\n  {\n    private SampleForm _form;\n\
  \    public SampleFormPresenter()\n    {\n      _form = new SampleForm();\n    \
  \  _form.ViewDetailsRequested += _form_ShowDetailsButtonClicked;\n    }\n    void\
  \ _form_ShowDetailsButtonClicked(object sender, EventArgs e)\n    {\n      ShowDetailsForm();\n\
  \    }\n    private void ShowDetailsForm()\n    {\n    }\n  }\n}\n```\n\n这个 MVP\
  \ 示例在视图中实现了一个事件过滤过程，以抽象化请求请求的各种方式。并不是由演示器为按钮和上下文菜单事件添加处理程序，而是由视图的后置代码完成这些工作。视图还定义了一个名为\
  \ `ViewDetailsRequested` 的新事件。视图中的每个事件处理程序随后都会触发同一个 `ViewDetailsRequested` 事件，演示器为此事件创建一个处理程序。视图将单独的\
  \ UI 请求过滤成供演示器处理的通用操作事件。\n\n\n\n\n\n**b.** MVP：视图接收事件，并响应生成一个不同的事件供演示器（Presenter）消费。该事件嵌入了当前的行信息以及演示器所需的任何其他相关信息。\n\
  \n**c.** MVVM：基于 XAML 的应用程序中提供的高级绑定意味着按钮会自动绑定到视图模型中的按钮点击命令上。同样的高级绑定还允许我们将视图模型属性绑定到数据网格上，使得视图模型拥有一个指向当前活动行的指针。\n\
  \n**3.** 使用当前行信息，控制器（Controller）、演示器或视图模型向数据模型请求额外数据。\n\n**4.** 模型（即模型中的仓库）接收数据请求并向数据库发出查询。\n\
  \n**5.** 原始数据库数据被返回给模型，由模型进行任何必要的预处理，通过将值复制到适当的实体属性中将原始数据转换为实体数据类。如果你使用如 `Entity\
  \ Framework` 或 `NHibernate` 等对象关系映射工具，则由 ORM 自动完成这一步骤。\n\n**6.** 业务实体从模型返回到控制器、演示器或视图模型。\n\
  \n**7.** 控制器、演示器或视图模型可以执行 `Show Details` 请求所需的任何后续处理。例如，如果你的应用程序显示财务数据，它可能会获取一个\
  \ `StockPriceService` 实例，并请求用户感兴趣的股票当前价格，然后更新实体类。\n\n**8.** 为了显示带有详细股票数据的对话框，控制器、演示器或视图模型创建另一个控制器（或演示器或视图模型），我们称之为\
  \ `DialogController`，给它适当的显示信息，然后调用 `DialogController` 上的 `ShowDialog` 方法。\n\n**9.**\
  \ `DialogController` 创建适当视图，创建绑定到视图上适当文本框的数据，并将视图显示给用户。\n\n这是所有过程中最简单的之一。控制器、演示器或视图模型可能会变得非常复杂，并执行用户希望的任何职责。然而，应该始终保持基本的的分工原则。\n\
  \n- 视图仅包含 UI 逻辑，不包含业务规则或其他逻辑。\n- 模型（数据模型，而非视图模型）仅包含数据访问、实体类生成逻辑和数据验证。\n- 控制器、演示器或视图模型拥有执行用户请求的特定操作所需的逻辑。\n\
  \n#### 你应该选择哪种模式？\n\n这三种模式都是良好的设计，因此你为重构项目选择哪种取决于目标 UI。如果你想构建一个基于浏览器的 Web 应用程序，MVC\
  \ 是最佳选择模式。`ASP.NET MVC` 围绕 MVC 架构设计，使得新开发和重构变得更加简单快速。\n\n如果你想重构一个 Winforms 应用程序，MVP\
  \ 是最佳选择，因为它通过合并事件处理简化了测试。由于 MVP 将绑定逻辑放在演示器中，它也允许进行更多测试，因为视图中的模型绑定逻辑（实际上是任何逻辑）是不可测试的。\n\
  \n最后，如果你想重构为 WPF 或 Silverlight，MVVM 是最佳选择，因为它利用了 WPF 命令绑定等特性的优势，极大地增强了应用程序的可测试性。\n\
  \n#### 总结\n\n在本章中，我们讨论了你目标架构的不同选项。虽然本书没有对不同的架构进行细致的区分，但我们根据你预想的显示目标（Web、WPF 或 Winforms）讨论了哪些架构对你的项目更合适。然而，我们发现这三种基本架构都具有相同的核心思想，即将业务逻辑、显示逻辑和数据模型分离。保持这三部分相互分离是创建一个能够适应现实世界不断变化的应用程序的关键。\n\
  \n在下一章中，我们将讨论如何通过创建单元测试来利用这些部分分离的优势。\n\n## 3. 单元测试\n\n我们讨论的架构模式的首要目标是将我们的应用程序拆分成更小的部分，并减少它们之间的相互引用，以降低耦合。这是一个优势，因为如果必须更新的硬引用较少，类类的演进就会变得容易得多。它还引入了更多自动化测试（或单元测试）的机会。\n\
  \n`Unit testing` 是自动化实现开发部门许多质量保证功能的一种方法。单元测试的目标是将类与应用程序的其他部分隔离开，以便通过代码对它们的方法进行测试。我们编写特殊的测试方法来运行被测系统并确保它执行了正确的逻辑。\n\
  \n单元测试是重构过程中至关重要的部分。如果你的团队还没有安装单元测试框架，现在是获取一个时机了。\n\n在本章中，我们简述了单元测试是什么以及如何实现它们的要点。有很多专门编写单元测试的好书；如果你是该领域的新手，请读一读（或多本）。我们将以必要的深度来讨论该话题，以提供一个连贯的叙述。尽管你在这里学习了如何创建单元测试的各种知识，但建议你将技能提升到更高水平。\n\
  \n#### 单元测试示例\n\n假设你正在编写一个方法，该方法需要计算在给定利率下支付抵押贷款费用。调用者可以指定贷款初始金额、还款年限以及利率。你的工作是编写一个方法，能够为任何给贷款配置计算借款人需要支付的款项。\n\
  \n写完这个方法后，你如何测试它？你可以创建一个数据输入屏幕，让用户能够输入各种值，然后手动输入测试数据，以涵盖你已知应该创建哪些款项的许多不同值。这种方法是浪费的，因为你必须构建一个随后会被丢弃的数据输入屏幕，并且需要有人在每次发布之前手动测试方法的结果，以确保没有引入破坏计算的更改。\n\
  \n现在想象编写代码来为我们测试方法。我们可以编写与 `Listing 3.1` 中的伪代码类似的代码。\n\n```\nmthlyPmt1 = CalcLoanPayment(Principal\
  \ =1000, Interest=5%, NumMonths=360)\nCheckForProperPayments(lst1)\n\nmthlyPmt2\
  \ = CalcLoanPayment (Principal =1000, Interest=10%, NumMonths=360)\nCheckForProperPayments(lst2)\n\
  \nmthlyPmt3 = CalcLoanPayment (Principal =1000, Interest=10%, NumMonths=240)\nCheckForProperPayments(lst3)\n\
  \n...以及更多测试放在这里\n```\n\n如果我们编写代码来执行之前所示的测试，那么我们就可以随时运行这些测试代码，并确保方法仍然正常工作。我们甚至可以实现在每次代码提交时自动运行测试。这几乎可以保证该方法在我们想要支持的所有场景下都是正确的，并且它永远不会损坏。\n\
  \n#### 创建单元测试\n\n在展示单元测试的真实示例之前，我们需要查看如何创建单元测试项目。我们将使用 Visual Studio 内置的单元测试项目，因为它是一个与\
  \ IDE 集成良好的强大产品。\n\n> **注意**：我们使用的是 Microsoft 单元测试框架，但有很多优秀的框架可用。我们在这里回顾的理念适用于任何这些框架。\n\
  \n\n\n\n\nMicrosoft 单元测试框架有一个特殊的项目类型来存放单元测试，因此我们必须执行的第一件事是添加新项目。在解决方案资源管理器中右键点击解决方案，选择\
  \ `Add > New Project`（添加 > 新项目）。选择测试项目类型并为其指定一个合适的名称，然后按 `OK`。我们为解决方案中的每个标准项目都使用独立的测试项目。因此，如图\
  \ 3.1 所示，我们将测试项目命名为与标准项目相同的名称并在末尾附加 `UnitTests`。\n\n![Image](img/00008.jpeg)\n\n\
