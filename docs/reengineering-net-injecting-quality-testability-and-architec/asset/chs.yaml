  \n  public class User\n  {\n    public int Id { get; set; }\n    public string Username\
  \ { get; set; }\n    public string Name { get; set; }\n  }\n\n  public interface\
  \ IRepository\n  {\n    User GetUser(int id);\n    void SaveUser(User u);\n  }\n\
  \n  public interface IDialogService\n  {\n    void Show(string msg);\n  }\n\n  public\
