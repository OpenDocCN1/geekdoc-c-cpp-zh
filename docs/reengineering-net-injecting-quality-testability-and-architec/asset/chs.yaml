  \ void Show()\n  {\n    View.Show();\n  }\n}\n```\n\n\n\n\n\n```csharp\npublic class\
  \ DataEntryView : Form, IDataEntryView\n{\n    private TextBox _userName;\n    private\
  \ User _user;\n    private Button _saveBtn;\n    protected virtual void OnSaveRequested(object\
  \ sender, EventArgs e)\n    {\n        var handler = SaveRequested;\n        if\
  \ (handler != null) handler(this, e);\n    }\n    public event EventHandler<EventArgs>\
  \ SaveRequested;\n    public DataEntryView()\n    {\n        _saveBtn = new Button();\n\
