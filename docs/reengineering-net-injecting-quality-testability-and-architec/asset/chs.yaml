  \ 类。我们将 `SalesReceipt` 类设为 `public`。我们还移除了曾经需要的用于记住所有购买记录的私有购买列表。\n\n通过引入收据的公开化概念，我们将记忆状态的负担转移给了外部调用者，使得\
  \ `SalesClerkWithNoState` 符合了无状态的要求。手里拿着收据，我们现在可以自由地访问任何想要退货的销售收员，这使得交易的完成变得更加容易，服务也更加实用。\n\
  \n我们努力让服务尽可能无状态化，但很多时候，在服务中维护某些状态是必要的。维护多少状态取决于服务的目的。\n\n### 示例示例\n\n利用所有这些原则，让我们来看一个真实世界的例子。列表\
  \ 1.13 中的代码是用于 `DialogService` 的。这是一个用于在对话框中向用户显示信息消息的服务。\n\n列表 1.13. 示例服务实现\n\n\
  点击此处查看代码图像\n\n* * *\n\n```csharp\n  /// <summary>\n  /// 向用户显示消息的服务接口。\n  /// </summary>\n\
  \  public interface IDialogService\n  {\n    /// <summary>\n    /// 在对话框中向用户显示给消息，\n\
  \    /// 仅有一个 OK 按钮。\n    /// </summary>\n    void Show(string pUserMessage);\n\
  \    /// <summary>\n    /// 使用指定的窗口标题和按钮向用户显示消息。\n    /// </summary>\n    DialogResult\
  \ Show(string pUserMessage, string pCaption,\n      MessageBoxButtons pMessageBoxButtons);\n\
  \  }\n  /// <summary>\n  /// 对话服务将向用户显示消息，\n  /// 并根据调用者的要求接受相应的响应。\n  /// </summary>\n\
  \  public class DialogService : IDialogService\n  {\n    /// <summary>\n    ///\
  \ 在对话框中向用户显示给消息，\n    /// 仅有一个 OK 按钮。\n    /// </summary>\n    public void Show(string\
  \ pUserMessage)\n    {\n      MessageBox.Show(pUserMessage);\n    }\n    /// <summary>\n\
  \    /// 使用指定的窗口标题和按钮向用户显示消息。\n    /// </summary>\n    public DialogResult Show(string\
  \ pUserMessage, string pCaption,\n      MessageBoxButtons pMessageBoxButtons)\n\
  \    {\n      MessageBox.Show(pUserMessage);\n    }\n  }\n```\n\n\n\n\n- **模型（Model）**：这是数据模型，通常由数据库以及与数据库的任何直接交互表示。这包括用于从数据库中提取数据的查询、表示每个表中每一行的类（实体类），以及确保数据库中的数据与业务规则一致的实体类验证逻辑。验证逻辑确保数据在存储到数据库之前符合业务规则。\n\
  \n在任何给定的应用程序中，通常只有一个数据模型，尽管在极少数情况下，可能存在多个模型。例如，如果你想从另一个不同的应用程序访问数据，且该模型必须独立地更改，那么可能需要两个数据模型。如果应用程序同时需要来自\
  \ MS SQL Server 和 Oracle 的数据，拥有两个模型也可能更加方便。\n\n- **视图（View）**：这是在屏幕上显示数据供用户使用的代码。它包括创建窗口和添加显示数据所需控件的代码。视图中*不包含*的一个重要部分是数据操纵和业务逻辑。更改数据的责任在于第三部分，即控制器（Controller）、呈现器（Presenter）或视图模型（View\
  \ Model）。\n\n- **控制器 / 呈现器 / 视图模型（Controller / presenter / view model）**：这三种模式的差异之处在于这第三部分。根据你选择哪种模式，你可能只有一个控制器、一个呈现器或一个视图模型。虽然这三种模式中这些部分的通用目标是相同的，但具体细节和实现细节存在差异。\n\
  \n通常情况下，每个视图都关联着一个控制器、呈现器或视图模型。这部分负责将模型和视图胶合在一起，并协调两者之间的交互。在这里，我们放置了决定数据库中哪些行需要检索的业务逻辑，以及查询这些行的代码（使用模型）以及将这些数据传递给视图以供用户显示的代码。这部分使用了我们之前描述的服务来实现某些通用业务逻辑，而特定于所请求操作的特定逻辑也包含在此处。\n\
  \n***\n\n### 注意\n\n尽管你可以使用数据库、平面文件或几乎任何其他方式作为模型的数据存储，但我们假设你正在使用数据库以便于讨论。实现其他类型的数据存储不会影响讨论内容。\n\
  \n***\n\n#### MVP、MVC 和 MVVM 之间的差异\n\n从高角度来看，这三种模式是相似的。它们力于将用户界面（UI）逻辑与业务逻辑及数据层分离。模式之间的差异相对较小，但意义重大。\n\
  \n本节所描述的许多差异的主要驱动因素是可测试性。任何应用程序架构的目标都是让代码尽可能可测试的。在任何应用程序中，UI（Winforms、Windows Presentation\
  \ Foundation [WPF] 或 Silverlight，或 ASP）都是臭名的难以测试。测试 UI 类意味着 UI 必须被实例化，这会导致自动化测试运行器出现许多问题。因此，我们试图将大部分逻辑从视图中移出并到其他类中。\n\
  \n***\n\n### 注意\n\n当我们讨论 MVP 时，我们特指讨论 Martin Fowler 的模型-视图-呈现器模式中的“被动视图（Passive\
  \ View）”版本。MVP 有两个版本，区别在于访问数据模型的方式。\n\n- 被动视图（Passive View）：[`martinfowler.com/eaaDev/PassiveScreen.html`](http://martinfowler.com/eaaDev/PassiveScreen.html)\n\
  - 监督呈现器（Supervising Presenter）：[`martinfowler.com/eaaDev/SupervisingPresenter.html`](http://martinfowler.com/eaaDev/SupervisingPresenter.html)\n\
  \n***\n\n## 模型访问\n\n这三种模式之间的差异之一是对数据模型的访问。在 MVC 中，视图和控制器都拥有模型的引用，如图 2.1 所示。这种结构使得构建视图变得更容易，因为视图可以直接绑定到数据模型的属性。然而，这意味着视图在当前应用程序之外难以重用，因为它们绑定到了特定的数据模型，而该模型可能在另一个应用程序中使用。它也意味着绑定逻辑无法被测试，因为它位于视图中。\n\
  \n![Image](img/00005.jpeg)\n\n图 2.1. 模型-视图-控制器\n\nMVP 不允许从视图到模型的这种引用，因此呈现器必须承担将数据模型绑定到输入控件的，如图\
  \ 2.2 所示。这增强了可测试性，因为更多的代码位于呈现器而不是视图中；然而，在无法直接访问 UI 控件的情况下实现绑定逻辑可能是挑战性的。\n\n![Image](img/00006.jpeg)\n\
  \n图 2.2. 模型-视图-呈现器（被动视图）\n\nMVVM 有一个视图模型的概念，它是一个专门为该视图持有数据和逻辑的类。它类似于控制器或呈现器，因为它拥有控制视图的逻辑，并且该逻辑是可测试的。然而，由于\
  \ WPF 中的绑定功能，视图是否应该访问模型的问题在这一模式中被回避了。MVVM 用于基于 XAML 的应用程序，它提供了一种新的数据绑定方式，不需要对包含数据的对象的直接引用。通过这种新的绑定方法，我们可以轻松地避免向视图中添加任何模型引用。图\
  \ 2.3 显示了 MVVM 模式中的关系。\n\n![Image](img/00007.jpeg)\n\n图 2.3. 模型-视图-ViewModel\n\n\
  ### 视图模型\n\n只有 MVVM 模式提到了视图模型的存在，因此它看起来是唯一使用它的模式，但事实并非如此。一种趋势是在 MVC 和 MVP 中也使用视图模型，只是术语解释不同。\n\
  \n在讨论视图模型的差异之前，让我们讨论一个贯穿所有模式的共同点。无论是在 MVC、MVP 还是 MVVM 中，视图模型始终作为显示数据的容器。为了说明这一概念，假设你有一个管理用户和权限的视图。列表\
  \ 2.1 展示了视图、控制器以及创建视图并在屏幕上显示所需的逻辑。\n\n***\n\n### 注意\n\n在示例中，我们使用名为 `Repository`\
  \ 的类。我们在第 12 章中详细讨论仓库，“高级重构为服务](#part020.html_ch12)”，但现在请将仓库视为负责与数据库所有交互的类。系统中包含查询的唯一类应该是仓库。\n\
  \n***\n\n### 列表 2.1. 示例视图接口\n\n点击查看图像\n\n***\n\n```csharp\nusing System.Collections.Generic;\n\
