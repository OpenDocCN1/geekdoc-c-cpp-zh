  ### 数据库上下文与 Entity Framework (Database Context and Entity Framework)\n\n这是 Entity\
  \ Framework 中用于查询数据库的数据库上下文的典型声明。我们声明了一个继承自 `DbContext` 的类（它来自 `EntityFramework`\
  \ DLL），并列出了模型中包含的实体。注意，我们假设你使用的是 EF Code First，这意味着你手动创建实体类，然后将它们包含在 `DbContext`\
  \ 中。这样做仅仅是为了清晰，而不是因为这种方法比在 EF 中生成模型的其他方法更优。重要的是模型存在。\n\n假设我们有一项任务，向刚加入我们网站的用户发送电子邮件优惠券。在我们的旧系统中，该上下文是以如\
  \ 列表 12.5 所示的方式使用的。\n\n列表 12.5. 向新用户发送优惠券的旧代码\n\n点击此处查看代码图像\n\n***\n\n```csharp\n\
  using System;\nusing System.Linq;\nusing CodeSamples.Ch12_RefactorToAdvancedServices.Listing04;\n\
  namespace CodeSamples.Ch12_RefactorToAdvancedServices.Listing05\n{\n  public class\
  \ CouponDistributor\n  {\n    private ReengineeringEntities _context;\n    public\
  \ CouponDistributor()\n    {\n      _context = new ReengineeringEntities();\n  \
  \  }\n    public void SendCouponToNewUsers(string pFirstName)\n    {\n      var\
  \ people = (from p in _context.People\n                    where p.DateJoined ==\
  \ DateTime.Today\n                    && p.MembershipCancelled == false\n      \
  \              select p);\n      foreach (var person in people)\n      {\n     \
  \   EmailCoupon(person);\n      }\n    }\n    public void EmailCoupon(Person pPerson)\n\
  \    {\n      //此处编写发送优惠券的代码\n    }\n  }\n}\n```\n\n***\n\n有几点需要注意。我们的数据库上下文是在使用它的类内部创建的。获取所有新加入成员的查询是在需要数据的方法中构建的，然后对结果集进行操作。这是一种糟糕的设计，因为在不连接到带有测试数据的数据库的情况下，我们无法测试\
  \ `SendCouponToNewUsers` 方法。\n\n要重构此类，你首先需要创建仓库服务（repository service），并添加适当的代码来连接数据库。列表\
  \ 12.6 展示了一个使用 Entity Framework 访问数据库的仓库示例。\n\n列表 12.6. 使用领域模型创建仓库\n\n点击此处查看代码图像\n\
  \n***\n\n```csharp\nusing System;\nusing System.Linq;\nusing CodeSamples.Ch12_RefactorToAdvancedServices.Listing04;\n\
  namespace CodeSamples.Ch12_RefactorToAdvancedServices.Listing06\n{\n  public class\
  \ Repository : IRepository\n  {\n    private ReengineeringEntities _context;\n \
  \   public Repository()\n    {\n      _context = new ReengineeringEntities();\n\
  \    }\n    public IQueryable<Person> GetRecentlyJoinedUsers()\n    {\n      var\
  \ people = (from p in _context.People\n                    where p.DateJoined ==\
  \ DateTime.Today\n                    && p.MembershipCancelled == false\n      \
  \              select p);\n      return people;\n    }\n  }\n  public interface\
  \ IRepository\n  {\n    IQueryable<Person> GetRecentlyJoinedUsers();\n  }\n}\n```\n\
  \n***\n\n在仓库中，我们创建了一个检索最近加入用户的方法。在仓库中而不是业务逻辑中执行这样做，可以将查询逻辑隐藏在仓库内部，因此单个业务逻辑不需要知道如何进行查询。这是一个真正的优势，因为调用代码很容易忘记检查\
  \ `MembershipCancelled` 标志，并向今天注册但立即取消会员的成员发放优惠券。\n\n你可能会注意到，我们没有使用 `ServiceLocator`\
  \ 来创建数据库上下文。这是因为我们不希望系统的其他部分直接使用上下文。通过在上下文前面放置接口并将其添加到 `ServiceLocator`，我们允许应用程序的其他部分跳过仓库直接使用上下文。\n\
  \n现在我们可以重构原始代码以使用此仓库进行数据访问，如 列表 12.7 所示。\n\n列表 12.7. 使用仓库重构的优惠券发放器\n\n点击此处查看代码图像\n\
  \n***\n\n```csharp\nusing CodeSamples.Ch10_EstablishFoundation.Listing04;\nusing\
  \ CodeSamples.Ch12_RefactorToAdvancedServices.Listing04;\nusing CodeSamples.Ch12_RefactorToAdvancedServices.Listing06;\n\
  namespace CodeSamples.Ch12_RefactorToAdvancedServices.Listing07\n{\n  public class\
  \ CouponDistributor\n  {\n    public void SendCouponToNewUsers(string pFirstName)\n\
  \    {\n      var repo = ServiceLocator.Resolve<IRepository>();\n      var people\
  \ = repo.GetRecentlyJoinedUsers();\n      foreach (var person in people)\n     \
  \ {\n        EmailCoupon(person);\n      }\n    }\n    public void EmailCoupon(Person\
  \ pPerson)\n    {\n      //此处编写发送优惠券的代码\n    }\n  }\n}\n```\n\n***\n\n注意数据库上下文现在消失了；我们不再需要它，因为可以使用仓库来满足数据需求。\n\
  \n通过此最后的更改，我们完成了该类向仓库的转换。你可以看到我们对业务逻辑的修改非常小。我们仍然处理同一组类，并对这些实体执行相同的命令。唯一改变的是这些查询执行的位置。然而，这种变化为单元测试开启了许多新可能，因为我们现在可以模拟仓库返回任何想要的数据集。\n\
  \n#### 将方法重构为仓库\n\n对于每个重构为仓库的方法，过程都很简单且易于手动测试。将整个应用程序转换为使用仓库通常是一项需要几天或几周的大型工作。好消息是，如果在重构期间遇到了发布日期，可以在仓库只完成一半的情况下发布产品。如果操作得当，重构为仓库完全不会改变业务逻辑。\n\
  \n在转换过程中，随着仓库的提取，某些方法成为了单元测试的候选。立即引入这些单元测试是很好的做法，以便尽早利用它们提供的额外质量保证。这增加了已经很长的仓库转换时间，但是值得的。\n\
  \n重构为仓库的另一种方法不是一次性将整个应用程序转换为使用仓库，而是当类需要其他工作时按需进行重构。从技术上说，这种方法与集中的转换工作同样有效，但在实践中，这样做意味着由于功能或缺陷更改请求的时间压力，仓库的转换往往会被忽视。例如，如果有人正在修复一个尚未转换为使用仓库的类的缺陷，通常会推迟转换，因为缺陷太重要，不能被仓库转换所耽误。\n\
  \n\n\n\n\n对于那些正在处理没有领域模型的旧系统的人来说，下一步是随着你选择的 ORM 工具一起引入领域模型。使用领域模型和 ORM 有许多优势，但这项工作应该仔细计划。在将旧系统迁移到现代技术时，尝试重构为领域模型是一项困难且耗时的任务。它会影响应用程序的大部分，需要对业务逻辑进行大量的重构以使用新的实体。\n\
  \n以下是该过程的简要描述，假设你已经按照之前迁移到了存储库模式（repository pattern）。拥有一个使用 `ADO` 的存储库会让转换为领域模型的过程变得更容易。\n\
  \n### 1. 通过从数据库生成或手动编写为 ORM 创建模型项目和实体类。\n\n鉴于市场上有很多高质量的 ORM 产品（其中一些是免费的），选择“自研”\
  \ ORM 并不是明智的决定。实现 ORM 需要进行大量移动数据的繁琐工作，而且这些代码的维护既耗时又容易出错。\n\n### 2. 选择单个存储库方法转换为新的领域模型，并更改方法的返回类型以返回正确的领域实体。同时更改存储库方法内部的逻辑以正确查询数据库。\n\
  \n### 3. 修复因返回类型更改为领域实体导致的构建错误。这涉及编辑大量代码，在你的实体中设置值而不是在 `Recordset` 中设置值。这部分将花费大部分时间并产生最多的缺陷。\n\
  \n### 4. 确保任何时候保存 `ADO` 数据时，都会调用存储库的 `Save` 方法。这是一个关键点，通常在此类转换期间会导致问题。在通过 `ADO`\
  \ 保存数据的同时，忘记通过存储库保存已更改的数据，可能会导致数据库中出现错误数据，并浪费大量的调试时间。\n\n这一步存在几个潜在问题，在后文中会列出。\n\n\
  ### 5. 彻底测试！\n\n### 6. 选择另一个方法进行转换并继续。\n\n在此过程中可能会发生很多问题，这些问题并不容易处理。例如，在 `ADO` 中，查询可以在单个\
  \ `ADO` 查询中返回多个数据集。这在任何 ORM 中都是可能的。如果旧代码依赖 `ADO` 的此功能，则必须采取适当措施修复代码以改为多次查询。\n\n\
  另一个可能的问题出现在保存阶段。ORM 通常包含一个已数据的缓存，并一次性全部保存。除非你创建了不同的缓存，否则对数据的所有更改都将一次保存。使用 `ADO`\
  \ 时，更改是逐表保存的，从而留下了业务逻辑决定不保存特定数据的可能性。如果旧应用程序中存在保存某些数据而不保存其他数据的逻辑，则必须将其移除以兼容 ORM。\n\
  \n通过 `ADO` 保存部分数据而通过 `ORM` 保存部分数据的另一个问题涉及数据库中的数据关系和外键。假设表 `A` 和 `B` 之间存在主从关系，且 `B`\
  \ 和 `C` 之间有另一个类似的关系。在转换任何在表 `B` 中创建行的存储库方法时，如果尚未获得适当的主行，可能会导致外键冲突。\n\n如果旧代码使用了任何\
  \ `ADO` 事件，这些事件也必须删除，因为这些事件在 ORM 中通常没有对应物。`DataTable`、`DataRow` 或 `DataColumn` 类型上的任何事件可能都需要删除，并将相应的逻辑放在系统的其他地方。\n\
  \n总结，尽管 ORM 和领域模型为你的应用程序带来了许多优势，但从 `ADO` 转换为领域模型是一项巨大的工程。书中无法就这种努力是否值得给出通用建议。你必须根据自己的情况进行权衡，以确定是否有价值。书中描述的所有过程仍然适用于基于\
  \ `ADO` 的存储库。\n\n### 在领域模型中添加数据验证\n\n数据验证是一种确保在代码尝试执行存储数据的查询之前，存储到数据库中的数据是有效的方法。编译器确保属性和方法中的数据类型是正确的，但需要数据验证来确保这些值遵循业务规则。例如，数据验证可以确保合同的开始日期在结束日期之前。\n\
  \n对于此讨论，我们假设你的应用程序已经有了领域模型和存储库。如果你使用 `ADO` 并决定不转换为领域模型，则需要为每个数据行编写自定义方法来验证 `ADO`\
  \ 数据表。这是一个手动过程，且取决于你的具体实现，因此我们在这里不介绍该方法。\n\n验证是一个非常常见的问题，微软发布了一种标准的方法，称为 `Microsoft\
  \ Validation Block`。这是以标准方式为领域模型添加验证的极佳方法。首先让我们看看示例 12.8 所示的一个数据实体以及验证是如何实现的。\n\n\
  示例 12.8. 带有验证逻辑的示例领域模型\n\n点击此处查看代码图像\n\n```\nusing System;\n\nusing Microsoft.Practices.EnterpriseLibrary.Validation;\n\
  \nusing Microsoft.Practices.EnterpriseLibrary.Validation.Validators;\n\nnamespace\
  \ CodeSamples.Ch12_RefactorToAdvancedServices.Listing08\n{\n  [HasSelfValidation]\n\
  \  public class Person : BaseEntity\n  {\n    public int Id { get; set; }\n    public\
  \ string FirstName { get; set; }\n    public string LastName { get; set; }\n   \
  \ public DateTime BirthDate { get; set; }\n    public string Email { get; set; }\n\
  \    public int Age\n    {\n      get\n      {\n        DateTime now = DateTime.Today;\n\
  \        int age = now.Year - BirthDate.Year;\n        if (BirthDate > now.AddYears(-age))\
  \ age--;\n        return age;\n      }\n    }\n    public DateTime DateJoined {\
  \ get; set; }\n    public bool MembershipCancelled { get; set; }\n\n    [SelfValidation]\n\
  \    public void Validation_LastName_IsNotNull(ValidationResults results)\n    {\n\
  \      if (string.IsNullOrEmpty(LastName))\n      {\n        results.AddResult(CreateValidationResult(\"\
  Lastname cannot be null.\"));\n      }\n    }\n\n    private ValidationResult CreateValidationResult(string\
  \ errMsg)\n    {\n      var v = new ValidationResult(errMsg, this, Id.ToString(),\
  \ \"Person\", null);\n      return v;\n    }\n  }\n\n  public abstract class BaseEntity\n\
  \  {\n    public DateTime CreatedDate { get; set; }\n    public DateTime UpdatedDate\
  \ { get; set; }\n  }\n}\n```\n\n\n\n\n```csharp\nusing System.Collections;\nusing\
  \ System.Collections.Generic;\nusing System.Data;\nusing System.Linq;\nusing CodeSamples.Ch10_EstablishFoundation.Listing04;\n\
  using CodeSamples.Ch12_RefactorToAdvancedServices.Listing04;\nusing Microsoft.Practices.EnterpriseLibrary.Validation;\n\
  \nnamespace CodeSamples.Ch12_RefactorToAdvancedServices.Listing09\n{\n  public class\
  \ Repository : IRepository\n  {\n    private ReengineeringEntities _context;\n \
  \   private IValidationService ValidationSvc\n    {\n      get\n      {\n      \
  \  return _validationSvc ??\n          (_validationSvc = ServiceLocator.Resolve<IValidationService>());\n\
  \      }\n    }\n    private IValidationService _validationSvc;\n    public Repository()\n\
  \    {\n      _context = new ReengineeringEntities();\n    }\n    /// <summary>\n\
  \    /// 验证所有编辑过的项，然后保存\n    /// 所有待更改到数据库\n    /// </summary>\n    public ValidationResults\
  \ SaveChanges()\n    {\n      try\n      {\n        // 验证数据，如果无效则退出\n        var\
  \ results = Validate();\n        if (!results.IsValid) return results;\n       \
  \ // 保存更改到 DB\n        _context.SaveChanges();\n        return results;\n      }\n\
  \      catch (Exception e)\n      {\n        // 添加处理数据保存错误的逻辑\n        throw;\n\
  \      }\n    }\n    /// <summary>\n    /// 验证此 Repository 中所有更改的实体\n    /// </summary>\n\
  \    public ValidationResults Validate()\n    {\n      var entities = GetUpdatedItems();\n\
  \      return ValidationSvc.Validate(entities);\n    }\n    /// <summary>\n    ///\
  \ 返回所有更新实体的列表\n    /// </summary>\n    internal List<BaseEntity> GetUpdatedItems()\n\
  \    {\n      var allEntities = _context.ChangeTracker.Entries()\n        .Where(e\
  \ => e.State == EntityState.Added\n          || e.State == EntityState.Modified)\n\
  \        .Select(e => e.Entity)\n        .OfType<BaseEntity>().ToList();\n     \
  \ return allEntities;\n    }\n  }\n  public class ValidationService : IValidationService\n\
  \  {\n    public ValidationResults Validate(ICollection objectsToValidate)\n   \
  \ {\n      var validationResults = new ValidationResults();\n      foreach (var\
  \ obj in objectsToValidate)\n      {\n        var validator = ValidationFactory.CreateValidator(obj.GetType());\n\
  \        validationResults.AddAllResults(validator.Validate(obj));\n      }\n  \
  \    return validationResults;\n    }\n  }\n}\n```\n\n当你想要跟踪对象时，需要决定是使用弱引用（weak\
  \ reference）还是强引用（strong reference）。对对象的强引用是人们在考虑引用时通常会想到的。它防止垃圾回收器释放分配给对象的内存，因此如果对象管理器是唯一持有该对象引用的地方（即我们的应用程序中没有其他部分需要它），它将保留在内存中。弱引用则允许垃圾回收器释放对象的内存，因此如果对象管理器是唯一持有其引用的地方，它就会被释放。请注意，对象管理器并不“需要”它所管理的任何对象。它只是在为我们跟踪它们。如果某个对象由于垃圾回收而被移除，它不应该影响对象管理器。\n\
  \n### 使用验证的重工程领域模型\n\n当你想要跟踪对象时，需要决定是使用弱引用还是强引用。对对象的强引用是人们在考虑引用时通常会想到的。它防止垃圾回收器释放分配给对象的内存，因此如果对象管理器是唯一持有该对象引用的地方（即我们的应用程序中没有其他部分需要它），它将保留在内存中。弱引用则允许垃圾回收器释放对象的内存，因此如果对象管理器是唯一持有其引用的地方，它就会被释放。请注意，对象管理器并不“需要”它所管理的任何对象。它只是在为我们跟踪它们。如果某个对象由于垃圾回收而被移除，它不应该影响对象管理器。\n\
  \n### 使用泛型对象管理器\n\n跟踪对象是 DI 容器擅长的工作，但某些容器（例如 Unity）不允许注册某些类型。这可能导致对象在整个应用程序生命周期内一直存在。作为使用\
  \ DI 容器管理有限生命周期的替代方案，我们可以使用泛型对象管理器，它可以实现相同的目的但更加灵活。\n\n我们的对象管理器支持两种类型的引用：弱引用和强引用。对对象的强引用是人们在考虑引用时通常会想到的。它防止垃圾回收器释放分配给对象的内存，因此如果对象管理器是唯一持有该对象引用的地方，它仍然保留在内存中。弱引用则允许垃圾回收器释放对象的内存，因此如果对象管理器是唯一持有其引用的地方，它就会被释放。请注意，对象管理器并不“需要”它所管理的任何对象。它只是在为我们跟踪它们。如果某个对象由于垃圾回收而被移除，它不应该影响对象管理器。\n\
  \n让我们从观察对象管理器使用的组件部分开始讨论。我们需要通过定义一个小类来仅持有我们想要跟踪的对象的引用，加上少量的额外信息，从而对对象进行解除。这是数据传输对象（DTO）的完美应用场景。\n\
  \n根据你想要对对象使用弱引用还是强引用，你需要创建 `WeakReferenceDto` 或 `StrongReferenceDto`。做出这个决定取决于对对象预期周期的简单分析。使用强引用的对象管理器示例是对象缓存。如果某个对象的创建成本很高，但经常需要且持续时间很短，那么该对象应该保留在缓存中，以便系统可以重用已创建的对象。在这种情况下，当前没有任何业务逻辑代码需要的对象不应该被垃圾回收，因为我们可能需要再次提供一个新的。这是强引用对象管理器的完美用例。\n\
  \n列表 12.10 显示了弱引用和强引用对象的代码。为了让我们的对象管理器能够相同地处理它们，我们还为它们引入了一个接口。\n\n\n\n\n# 列表 12.10.\
  \ 弱引用 DTO 和 强引用 DTO\n\n点击此处查看代码图片\n\n```csharp\nusing System;\n\nnamespace CodeSamples.Ch12_RefactorToAdvancedServices.Listing10\n\
  {\n  public interface IObjectManagerReference<T> where T : class\n  {\n    T Object\
  \ { get; }\n    bool IsAlive { get; }\n    string Name { get; }\n  }\n  public class\
  \ StrongReferenceDto<T>\n      : IObjectManagerReference<T> where T : class\n  {\n\
  \    public virtual T Object { get; internal set; }\n    public virtual bool IsAlive\
  \ { get { return true; } }\n    public string Name { get; internal set; }\n    public\
  \ StrongReferenceDto(T pObject, string pName)\n    {\n      if (pObject == null)\
  \ throw new ArgumentNullException(\"pObject\");\n      Object = pObject;\n     \
  \ Name = pName;\n    }\n  }\n\n  public class WeakReferenceDto<T> :\n      IObjectManagerReference<T>\
  \ where T : class\n  {\n    private WeakReference _reference;\n    public string\
  \ Name { get; internal set; }\n    public T Object\n    {\n      get { return _reference.Target\
  \ as T; }\n      internal set { _reference = new WeakReference(value); }\n    }\n\
  \    public bool IsAlive\n    {\n      get { return _reference.IsAlive; }\n    }\n\
  \    public WeakReferenceDto(T pObject, string pName)\n    {\n      if (pObject\
  \ == null) throw new ArgumentNullException(\"pObject\");\n      Object = pObject;\n\
  \      Name = pName;\n    }\n  }\n}\n```\n\n该接口暴露了三个属性，其中第一个是我们跟踪的对象。由于这是一个泛型接口，我们可以在\
  \ DTO 中维护类型安全，并方便地使用该属性。\n\n`IsAlive` 属性是一个标志，指示所引的对象是否仍然存活。对于弱引用，如果垃圾回收器在我们不知情的情况下释放了我们引用的对象，它将返回\
  \ `false`；如果对象仍可用，则返回 `true`。对于强引用，它始终返回 `true`。\n\n最后，`name` 属性是对象的唯一名称。你使用此名称作为字典的键，因此它在所有受管理的对象中必须是唯一的。\n\
  \n在 `StrongReferenceDto` 类中，我们以一种直简单的方式实现了接口中的项。我们还可以添加一个接受所有可能参数的构造函数，以便我们能够轻松地创建\
  \ DTO。\n\n`WeakReferenceDto` 也实现了接口，但为属性添加了不同的逻辑。`WeakReference` 是一个特殊的类，允许垃圾回收器释放所引用的项。因此，在将对象分配给\
  \ `Object` 属性时，我们为该对象创建一个 `WeakReference`。同样，在引用 `Object` 属性时，我们必须返回弱引用的 `Target`，而不是弱引用本身。\n\
  \n`WeakReference` 还包含一个名为 `IsAlive` 的属性，我们在被请求时必须返回它。\n\n一旦我们的组件对象就绪，就可以关注对象管理器本身了。请参见\
  \ 列表 12.11。\n\n# 列表 12.11. 通用对象管理器的实现\n\n点击此处查看代码图片\n\n```csharp\nusing System;\n\
  using System.Collections.Generic;\nusing System.Linq;\nusing CodeSamples.Ch12_RefactorToAdvancedServices.Listing10;\n\
  \nnamespace CodeSamples.Ch12_RefactorToAdvancedServices.Listing11\n{\n  public interface\
  \ IObjectManager<T> where T : class\n  {\n    T Register(T newObject, string objectName);\n\
  \    T Get(string pObjectName, bool pIncludeInactive = true);\n    T Register(IObjectManagerReference<T>\
  \ pObjectReference);\n    bool Remove(string pObjectName);\n    /// <summary>\n\
  \    /// 管理所有注册的对象，并可选地允许在适当时对其进行收集。\n    /// </summary>\n    /// <remarks>\n  \
  \  /// 这里有一个微小的内存泄漏，因为用于跟踪弱引用项的字典在项被清理时没有被清理。\n    /// 可以扩展以添加一个 Cleanup 方法来释放未使用的\
  \ DTO，但将其留作供你练习。\n    /// </remarks>\n    public class ObjectManager<T> : IObjectManager<T>\
  \ where T : class\n    {\n      /// <summary>\n      /// 指示调用者是想使用强引用还是弱引用\n   \
  \   /// </summary>\n      internal bool _useReference;\n      /// <summary>\n  \
  \    /// 管理的项\n      /// </summary>\n      internal Dictionary<string, IObjectReference<T>>\
  \ _items;\n      /// <summary>\n      /// 构造函数\n      /// </summary>\n      public\
  \ ObjectManager(bool pStrongReference = true)\n      {\n        _useReference =\
  \ pStrongReference;\n        _items = new Dictionary<string, IObjectReference<T>>();\n\
  \      }\n      /// <summary>\n      /// 在管理器中注册新项并返回注册的项（以启用流式接口）\n      /// </summary>\n\
  \      public T Register(T pNewObject, string pObjectName)\n      {\n        if\
  \ (_useReference)\n          return Register(new StrongReferenceDto<T>(pNewObject,\
  \ pObjectName));\n        return Register(new WeakReferenceDto<T>(pNewObject, pObjectName));\n\
  \      }\n      /// <summary>\n      /// 在管理器中注册新项并返回注册的项（以启用流式接口）\n      /// </summary>\n\
  \      public T Register(IObjectManagerReference<T> pObjectReference)\n      {\n\
  \        if (pObjectReference.Object == null)\n          throw new ArgumentNullException(\"\
  pNewObject\");\n        if (string.IsNullOrEmpty(pObjectReference.Name))\n     \
  \     throw new ArgumentNullException(\"pObjectName\");\n        if (_items.ContainsKey(pObjectReference.Name))\n\
  \          throw new ArgumentException(pObjectReference.Name + \" key 已存在.\");\n\
  \        _items.Add(pObjectReference.Name, pObjectReference);\n        return pObjectReference.Object;\n\
  \      }\n      /// <summary>\n      /// 向调用者返回命名项\n      /// </summary>\n     \
  \ public T Get(string pObjectName, bool pIncludeInactive = true)\n      {\n    \
  \    if (pIncludeInactive)\n          return (from x in _items\n              where\
  \ (x.Key.Equals(pObjectName))\n              select x.Value.Object).FirstOrDefault();\n\
  \        return (from x in _items\n              where (x.Value.IsAlive && x.Key.Equals(pObjectName))\n\
  \              select x.Value.Object).FirstOrDefault();\n      }\n      /// <summary>\n\
  \      /// 从管理器中移除对象的首次出现\n      /// </summary>\n      /// <returns>\n      ///\
  \ 如果成功移除项，返回 true；否则返回 false。\n      /// </returns>\n      public bool Remove(string\
  \ pObjectName)\n      {\n        //必须是有效的名称\n        if (string.IsNullOrEmpty(pObjectName))\n\
  \          throw new ArgumentNullException(\"pObjectName\");\n        //如果找不到该名称，则对象不在列表中\n\
  \        if (!_items.ContainsKey(pObjectName)) return true;\n        return _items.Remove(pObjectName);\n\
  \      }\n    }\n  }\n}\n```\n\n\n\n\n第二个重载签名接收调用者提供的 `IObjectManagerReference<T>`，允许调用者决定每个对象应该使用弱引用还是强引用。该方法是执行验证传入引用并将其添加到内部字典的实际工作的方法。为了实现流式接口，我们返回了传入的对象。\n\
  \n在注册一个对象之后，我们稍后可以使用 `Get` 方法再次检索它。该方法中的逻辑应该是清晰的。它简单地使用字典查找对象名称，并返回由该名称注册的对象。包含非活动项的标志仅在管理器使用弱引用时有效。当使用强引用时，引用始终处于激活，因此该方法返回相同的结果集。如果对弱引用的\
  \ `includeInactive` 标志设置为 `true` 且对象已被垃圾回收，则会向调用者返回 `null`。\n\n如之前讨论过的，对象管理器优于 DI（依赖注入）容器的优势在于它具有从管理中移除对象的能力。`Remove`\
  \ 方法接受对象名称并从字典中移除该对象。对于强引用，这使得垃圾回收器能够回收内存；对于弱引用，它可以用于清理不再需要的旧引用列表。\n\n### 使用命令分发器服务简化复杂代码\n\
  \n另一个用于重构的服务是命令分发器（command dispatcher），它根源于策略软件模式。这种服务可以帮助将大型 `IF..Then..Else` 块转换为更易处理的内容。\n\
  \n关于该服务有一个警告：初级开发者很难理解它的工作原理。当它就到位后，添加额外功能是很容易的，但架构师应该花时间确保团队成员理解该服务、它的用途以及它是如何工作的。\n\
  \n基本思想是有一组名为 `Commands` 的类，每个类都是自包含的并能够执行特定功能。这些命令与命令分发器服务一起注册，并带有一个该命令能够处理的特定条件。在运行时，业务逻辑提交描述某些特定条件的参数（这些条件在设计时可能是不可预测的），由分发器决定执行哪一个或多个命令。\n\
  \n这的一个例子可能是解释应用程序的命令行参数。许多遗留应用程序都支持命令行参数，并提供了一种执行各种任务的方法，而无需运行应用程序整个 UI 的开销。\n\n\
  通常，命令行由命令和针对这些命令的可选数据元素组成。命令通常由斜杠 `/` 或连字符 `-` 分隔，以指示它们的关键字状态。一个很好的例子是你在任何命令行外壳中使用的\
  \ `DIR` 命令。使用命令行请求帮助是查找所有支持的命令行参数的方便方法。只需输入 `dir /?` 并按回车，如图 12.1\n\n图 12.1 `DIR`\
  \ 命令的结果，显示命令行帮助\n\n对于我们的命令分发器，可以将此处列出的每个参数等同于一个命令。我们在设计时不知道用户将选择这些选项中的哪一个，因此我们必须准备以任何顺序处理其中任何一个，包括跟在某些选项后面的选项参数。\n\
  \n为了实现我们自己的命令行解释器，代码必须解析命令行以寻找这些斜杠或连字符，将命令行拆分为各个部分，并顺序处理每个部分。当你为这些关键字引入可选参数或当命令有特定顺序时，过程就会变得复杂。使用标准工具实现此逻辑会导致产生巨大的\
  \ `If..Then..Else` 结构，在其中你需要测试每个关键字并进行相应的处理。如果只只支持几个关键字，这种结构可能足够了，但随着关键字数量的增加，复杂性也会随之增加；因此，需要更强大的解决方案。用命令分发器替换\
  \ `If..Then..Else` 结构可以使出一个更易理解且易于管理的解析器。\n\n首先，我们查看命令的设计，然后检查分发器服务。列表 12.12 显示了我们的命令是如何结构的。\n\
  \n列表 12.12. 命令分发器的示例命令\n\n点击此处查看代码图像\n\n```sharp\nusing System;\n\nnamespace CodeSamples.Ch12_RefactorToAdvancedServices.Listing12\n\
  {\n  /// <summary>\n  /// 通过 CommandDispatcher 执行的命令的基类。\n  /// </summary>\n  public\
  \ abstract class BaseDispatchedCommand<T> : IDispatchedCommand<T>\n  {\n    public\
  \ BaseDispatchedCommand(T pCommandKey)\n    {\n      CommandKey = pCommandKey;\n\
  \    }\n    /// <summary>\n    /// 确定此命令是否可以执行。假设\n    /// 它是始终可用的。\n    /// </summary>\n\
  \    public virtual bool CanExecute(object parameter)\n    {\n      return true;\n\
  \    }\n    /// <summary>\n    /// 使用给定的参数执行此命令。\n    /// </summary>\n    public\
  \ abstract void Execute(object parameter);\n    /// <summary>\n    /// 通知订阅者 CanExecute\
  \ 发生了变化。\n    /// </summary>\n    public event EventHandler CanChanged;\n    ///\
  \ <summary>\n    /// 用于查找此命令的键。\n    /// </summary>\n    public T CommandKey { get;\
  \ internal set; }\n    /// <summary>\n    /// 此命令已执行的次数。\n    /// </summary>\n \
  \   public int ExecuteCount { get; set; }\n  }\n\n  internal class Cmd1Command :\
  \ BaseDispatchedCommand<string>\n  {\n    // 给基类传递调用此命令的字符串。\n    public Cmd1Command()\
  \ : base(\"/cmd1\") { }\n    public override void Execute(object parameter)\n  \
  \  {\n      // 执行某些操作。\n    }\n  }\n\n  public interface IDispatchedCommand<T>\n\
  \  {\n    T CommandKey { get; }\n    bool CanExecute(object parameter);\n    void\
  \ Execute(object parameter);\n    event EventHandler CanChanged;\n    int ExecuteCount\
  \ { get; set; }\n  }\n}\n```\n\n现在让我们查看列表 12.13 中显示的分发器代码。\n\n\n\n\n\n#  12.13.\
  \ 命令分发器服务的实现\n\n点击此处查看代码图片\n\n* *\n\n```csharp\nusing System;\n\nusing System.Collections.Generic;\n\
  namespace CodeSamples.Ch12_RefactorToAdvancedServices.Listing13\n{\n  public interface\
  \ ICommandDispatcherService<T>\n  {\n    void ExecuteCommand(T pCommandLine, object\
  \ pParameter);\n    void AddCommand(IDispatchedCommand<T> pCommand);\n    IDispatchedCommand<T>\
  \ KeyNotFoundCommand { get; set; }\n    void ClearCommands();\n  }\n  public class\
  \ CommandDispatcherService<T> : ICommandDispatcherService<T>\n  {\n    /// <summary>\n\
  \    /// 可执行的命令列表。\n    /// </summary>\n    internal Dictionary<T, IDispatchedCommand<T>>\
  \ _executableCommands;\n    /// <summary>\n    /// 如果未找到指定的键，则执行该命令。如果此值为空，\n  \
  \  /// 将抛出 ArgumentException。\n    /// </summary>\n    public IDispatchedCommand<T>\
  \ KeyNotFoundCommand { get; set; }\n    public CommandDispatcherService()\n    {\n\
  \      _executableCommands = new Dictionary<T, IDispatchedCommand<T>>();\n    }\n\
  \    /// <summary>\n    /// 将给定的命令添加到可用命令列表中\n    /// </summary>\n    public void\
  \ AddCommand(IDispatchedCommand<T> pCommand)\n    {\n      if (pCommand == null)\
  \ throw new ArgumentNullException(\"Command\");\n      _executableCommands.Add(pCommand.CommandKey,\
  \ pCommand);\n    }\n    /// <summary>\n    /// 执行与给定键相关的命令。\n    /// </summary>\n\
  \    public void ExecuteCommand(T pCommandKey, object pParameter)\n    {\n     \
  \ if (pCommandKey == null) throw new ArgumentNullException(\"CommandKey\");\n  \
  \    var command = GetCommand(pCommandKey);\n      command.Execute(pParameter);\n\
  \      command.ExecuteCount++;\n    }\n    private IDispatchedCommand<T> GetCommand(T\
  \ pCommandKey)\n    {\n      if (_executableCommands.ContainsKey(pCommandKey))\n\
  \        return _executableCommands[pCommandKey];\n      if (KeyNotFoundCommand\
  \ != null) return KeyNotFoundCommand;\n      throw new ArgumentOutOfRangeException(pCommandKey.ToString());\n\
  \    }\n    /// <summary>\n    /// 清空列表中的所有命令。\n    /// </summary>\n    public void\
  \ ClearCommands()\n    {\n      _executableCommands.Clear();\n    }\n  }\n  public\
  \ interface IDispatchedCommand<T>\n  {\n    T CommandKey { get; }\n    bool CanExecute(Object\
  \ parameter);\n    void Execute(Object parameter);\n    event EventHandler CanExecuteChanged;\n\
  \    int ExecuteCount { get; set; }\n  }\n}\n```\n\n* * *\n\n如果你查看 `ICommandDispatcherService`\
  \ 接口，请注意列出的几项。我们看到了属性 `KeyNotFoundCommand`，它允许调用者在提交给分发器的键在字典中未找到时，指定一个执行的特定命令进行执行。这通常被用于处理没有自身关联命令的意外键。意外键通常会被记录到日志，然后被忽略。\n\
  \n除了 `KeyNotFoundCommand` 属性外，我们只看到了三个方法：一个允许向分发器添加命令，一个用于执行给定的命令键，以及一个用于清除列表。这为调用代码提供了一个简单的接口，并隐藏了服务内部逻辑的复杂性。\n\
  \n在使用分发器服务时，我们首先实例化该服务，向其添加命令，然后使用传入的参数调用 `ExecuteCommand`。要将命令添加到分发器，`AddCommand`\
  \ 方法接收一个 `IDispatchedCommand` 并将其添加到内部命令字典中。注意，如果命令键已存在，`dictionary` 将抛出异常，因此我们不需要添加逻辑来确保键的唯一性。\n\
  \n在命令输入到分发器后，调用代码可以使用传入的键和任何类型的参数来调用 `ExecuteCommand` 方法。分发器在内部 `dictionary` 中查找键以找到合适的命令，执行该命令，然后增加该命令的计数器。\n\
  \n让我们看看命令分发器的一个具体实现，以更好地了解它是如何使用的。`[Listing 12.4]`(#part020.html_ch2list4) 显示了一个处理几个命令行参数的命令行解释器。命令集可以很容易扩展，以处理任何额外的命令行参数。\n\
  \n#  12.14. 命令行解释器的实现\n\n点击此处查看代码图片\n\n* *\n\n```csharp\nusing System;\nusing System.Collections.Generic;\n\
  using CodeSamples.Ch10_Foundation.Listing4;\nusing CodeSamples.Ch12_RefactorToAdvancedServices.Listing12;\n\
  namespace CodeSamples.Ch12_RefactorToAdvancedServices.Listing4\n{\n  /// <summary>\n\
  \  /// 此类将接收命令行，将其解析为\n  ///各个部分，然后处理每个命令。\n  /// </summary>\n  public class CommandLineInterpreter\n\
  \  {\n    /// <summary>\n    /// 我们将用于执行命令的 CommandDispatcher\n    /// </summary>\n\
  \    internal ICommandDispatcherService<string> _dispatcher;\n    /// <summary>\n\
  \    /// 构造函数将填充命令列表。\n    /// </summary>\n    public CommandLineInterpreter()\n\
  \    {{\n      _dispatcher = ServiceLocator.Resolve<ICommandDispatcherService<string>>();\n\
  \      _dispatcher.KeyNotFoundCommand = new MissingKeyCommand();\n      _dispatcher.AddCommand(new\
  \ Cmd1Command());\n      //添加更多命令\n    }\n    /// <summary>\n    /// 此方法执行单个命令。\n\
  \    /// </summary>\n    /// <param name=\"pCommandLine\">要执行的命令</param>\n    public\
  \ void Execute(string pCommandLine)\n    {\n      if (string.IsNullOrEmpty(pCommandLine))\
  \ return;\n      pCommandLine = pCommandLine.Trim();\n      var commandQueue = ParseCommandLineIntoCommands(pCommandLine);\n\
  \      while (commandQueue.Count > 0)\n      {\n        var cmd = commandQueue.Dequeue();\n\
  \        _dispatcher.ExecuteCommand(cmd, commandQueue);\n      }\n    }\n    ///\
  \ <summary>\n    /// 通过空格分割解析各个命令。如果需要\n    /// 对引号字符串和嵌入空格的支持，\n    /// 则必须添加此类逻辑。\n\
  \    /// </summary>\n    internal Queue<string> ParseCommandLineIntoCommands(string\
  \ pCommandLine)\n    {\n      var commands = pCommandLine.Split(' ');\n      var\
  \ result = new Queue<string>();\n      foreach (var cmd in commands)\n        result.Enqueue(cmd);\n\
  \      return result;\n    }\n    /// <summary>\n    /// 执行重要操作的命令。\n    /// </summary>\n\
  \    internal class Cmd1Command : BaseDispatchedCommand<string>\n    {\n      //给出调用此命令的字符串。\n\
  \      public Cmd1Command() : base(\"/cmd1\") { }\n      public override void Execute(object\
  \ parameter)\n      {\n        //执行操作。\n      }\n    }\n    /// <summary>\n    ///\
  \ 当从命令行传入的命令未找到时执行的命令。\n    /// 此命令可以什么都不做、记录错误，或进行任何其他适当的操作。\n    /// </summary>\n\
  \    internal class MissingKeyCommand : BaseDispatchedCommand<string>\n    {\n \
  \     public MissingKeyCommand() : base(Guid.NewGuid().ToString()) { }\n      public\
  \ override void Execute(object parameter)\n      {\n        //在此处进行错误处理。\n     \
  \ }\n    }\n  }\n}\n```\n\n\n\n\n第一点需要，`CommandLineInterpreter` 包装了分发器（dispatcher），而不是继承自分发器。这样做是为了隐藏那些不适合命令行解释器的分发器方法。外部调用者通常不需要操作命令分发器，但如果你的场景确实有需要，那么在命令行解释器中添加适当的方法是非常简单的，只需将请求传递给底层的分发器即可。\n\
  \n### 注意\n\n在我们的示例中，命令是 `CommandLineInterpreter` 内部的，但并非必须如此。使用命令分发模式（Command Dispatcher\
  \ Pattern），系统中的类数量可能会大幅增加，而将命令设为内部是控制这种复杂性的一种方法。某些质量测量工具不会单独列出内部类；它们被计为包含类的一部分。将命令类设为内部类可以减少这些工具产生的噪声。根而言之，它们是内部还是外部并不影响它们的工作方式，因此请选择最符合你逻辑的方案。\n\
  \n在 `CommandLineInterpreter` 的构造函数中，我们根据系统准备好处理的命令来初始化分发器。我们还设置了当给定的命令行参数未知时执行的默认命令。这个\
  \ `MissingKeyCommand` 非常强大，允许你记录信息、抛出异常、什么都不做或采取任何其他合理的行动。在执行未知命令后，处理将继续。\n\n当调用\
  \ `CommandLineInterpreter` 上的 `Execute` 方法时，它接收一个命令行文本作为参数。该文本通过单词之间的空格被解析成一个传入的令牌（tokens）队列。在此时，我们还不知道这些令牌是命令还是参数，尽管我们假设队列中的第一个项是命令。我们还做了一个简单的假设，即没有包含空格的字符串。添加对这种支持相对简单。\n\
  \n我们使用队列来包含传入的命令，而不是仅仅使用 `List<string>`，以确保保持原始顺序，并允许任何命令在适当的情况下更改顺序。例如，想象有一个条件命令\
  \ `/if`，它检查一个变量并仅在值值为真时才执行后续逻辑。处理 `/if` 的命令可以评估给定的变量，如果为假，则不断从队列中取出命令，直到遇到 `/endif`\
  \ 命令为止。随后处理就可以像往常一样进行。\n\n队列还允许我们为命令行参数添加参数支持。假设某个命令需要一个参数，例如根据某个字段对输出进行排序。命令行看起来类似于\
  \ `/o`，分发器执行的后续命令是 `SortColumnName`。在该命令的执行代码中，我们可以简单地从队列中取出下一项以获取 `SortColumnName`\
  \ 参数，然后处理继续像往常一样进行。\n\n队列创建后，解释器通过遍历所有队列中的命令并对每个命令调用分发器来处理该队列。\n\n### 为 CommandLineInterpreter\
  \ 重构\n\n为了重构现有系统以使用新的 `CommandLineInterpreter`，我们必须知道将支持哪些命令。然后，为这些命令中的每一个创建一个新的\
  \ `BaseDispatchedCommand` 后生类，并在 `Execute` 方法中添加适当的逻辑。将命令创建为独立的类是为每个命令添加适当单元测试的绝佳机会。\n\
  \n在我们创建了支持的命令行命令后，只需使用来自命令行的字符串调用 `CommandLineInterpreter.Execute` 调用。某些语言将命令行提供为字符串数组；我们的解释器可以很容易更新，以接受这作为\
  \ `Execute` 方法参数的另一个选项。\n\n由于命令行通常只在应用程序首次运行时才被解释，因此找到新解释器应该所在的位置并不困难。只需确保 `BootStrapper`\
  \ 在我们解释命令行之前运行，以便服务可以被注册。此外，命令可能会使用某些假设已经注册的服务。\n\n#### 总结\n\n在本章中，我们分析了遗留应用程序中通常常见的更高级的服务以及如何将它们转换为面向服务的架构（SOA）。我们处理了转换现有仓库（repository）以及重构以开始使用仓库的困难任务。这些更改很难实现并可能产生深远的影响，但它们让你的应用程序变得更容易使用和增强。我们还研究了一些在管理现代系统所需的大量对象时有用的新结构。\n\
  \n在下一章中，我们将迈出最后一步，将其重构为 MVC/MVP/MVVM 模式。\n\n## 13. 重构为控制器\n\n重构之旅的最后一步是对我们应用程序中那些埋藏了业务逻辑的表单进行重构，将其转换为控制器-视图对或\
  \ ViewModel-视图对。过程类似，因此我们假设你正在重构为使用模型-视图-控制器（Model-View-Controller）架构，并将一切统称为控制器。\n\
  \n### 注意\n\n我们假设 MVC 而不是 MVVM，是为了避免随 MVVM 和基于 WPF 的应用程序的绑定过程。基于 WPF 的应用程序中的绑定引擎非常强大，并隐藏了连接视图和视图模型所需的许多管道工作（plumbing）。在日常开发中，这是一种优势，但在尝试演示如何重构为控制器或视图模型时，我们需要看到这些代码是如何运作的。因此，我们宁愿展示在需要时如何构建管道，并让那些使用\
  \ WPF 应用程序的人忽略这些代码，而不是展示 MVVM 方法并让 MVC 的支持者自己去想如何实现。\n\n严格来说，接下来的代码是模型-视图-演示器（MVP）模式，而不是\
  \ MVC。然而，MVP 只是视图对模型一无知的 MVC，这使得 MVP 成为 MVC 的特殊类型。我们在本章中使用 MVC 术语是因为这里描述的技术适用于 MVC\
  \ 或 MVP。\n\n### 使用遗留方法创建表单\n\n到此时，我们已经创建了许多服务，封装了我们所需的许多架构和业务逻辑。然而，我们在表单和视图中仍有一些绑定的业务逻辑，需要将其提取出来以便进行测试。只要这些逻辑仍然埋在表单文件中，我们就无法绝对确定应用程序已经过完全测试。\n\
  \n\n\n\n```cs\nnamespace CodeSamples.Ch13_RefactorToViewModel.Listing01\n{\n  public\
