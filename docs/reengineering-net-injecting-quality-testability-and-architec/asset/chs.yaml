  \ `Bin` 文件夹中找到 `Microsoft.Practices.Unity.dll` 文件来确保你拥有正确的版本，并查看其属性（鼠标用户右键点击 `Properties`；键盘用户请按\
  \ `Alt+Enter`）。点击 `Details`（详细信息）选项卡查看版本号。图 10.1 显示了你在查看文件属性时应该看到的对话框。\n\n![Image](img/00019.jpeg)\n\
