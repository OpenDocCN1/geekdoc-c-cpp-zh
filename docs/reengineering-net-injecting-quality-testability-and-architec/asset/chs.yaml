  \      _mockDialogSvc.Verify(mds =>\n        mds.Show(It.IsAny<string>()), Times.Once());\n\
  \    }\n  }\n}\n\n  /// <summary>\n  /// 读者应该移除这个 BootStrapper 并替换为用于\n  /// 设置应用程序的正常类。\n\
