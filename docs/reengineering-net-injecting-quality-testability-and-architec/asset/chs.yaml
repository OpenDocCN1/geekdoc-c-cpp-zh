  \n这三个类都是紧耦合的。`SalesRegistrationService` 与 `SecurityService` 紧耦合，而 `SecurityService`\
  \ 又与 `Repository` 紧耦合。我们从不同类之间的实例化方式中可以看出这一点。当 `SalesRegistrationService` 需要 `SecurityService`\
  \ 时，它必须通过调用“new”直接创建 `SecurityService`。如果 `SecurityService` 位于不同的命名空间（namespace），这将导致在\
  \ `SalesRegistrationService` 中使用 `Using` 语句来包含该命名空间，这正是紧耦合。`SalesRegistrationService`\
  \ 与 `Repository` 之间、以及 `SecurityService` 与 `Repository` 之间也是同样的例子。\n\n为了演示紧耦合如何使维护变得更加困难，假设我们在应用程序中实现了联邦身份验证（federated\
  \ security），使得权限信息来自某处的网络服务。然而，每个使用应用程序的客户网络服务的 URL 都是不同的，因此我们应该在 `SecurityService`\
  \ 的构造函数行中传入网络服务的 URL。现在 `SecurityService` 看起来所示 Listing 4.2。\n\nListing 4.2. 使用\
  \ SecurityService 使用联邦身份验证\n\n点击此处查看代码图像\n\n* * *\n\n```csharp\n  /// <summary>\n\
