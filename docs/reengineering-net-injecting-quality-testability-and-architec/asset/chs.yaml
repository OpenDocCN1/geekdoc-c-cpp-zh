  #### 编写测试\n\n让我们来看一个待测试类的示例，以及我们为它构建的单元测试。列表 3.4 中显示的方法延续了之前的示例，在该示例中我们计算贷款的每月还款额。\n\
  \n列表 3.4\\. 待测试的方法\n\n点击此处查看代码图像\n\n```assembly\nusing System;\n\nnamespace CodeSamples.Ch03_UnitTesting.Listing4\n\
  {\n  public class FinancialFunctions\n  {\n    /// <summary>\n    /// P = (Pv*R)\
  \ / [1 - (1 + R)^(-n)]\n    /// where\n    ///      Pv  = Present Value (起始\n  \
  \  ///            价值或贷款金额)\n    ///      APR = Annual Percentage Rate (年化利率)\n \
  \   ///          (一年时间范围)\n    ///      R   = Periodic Interest Rate 周期性利率 =\n \
  \   ///          APR/ 每年利率周期次数\n    ///      P   = Monthly Payment (每月还款额)\n   \
  \ ///      n   = 总时间范围内的利率周期\n    ///          次数（即：每年利率周期\n    ///          次数\
  \ * 年数）\n    /// </summary>\n    /// <param name=\"pLoanAmount\">贷款原始金额</param>\n\
  \    /// <param name=\"pYearlyInterestRate\">年利率</param>\n    /// <param name=\"\
  pNumMonthlyPayments\">每月还款次数</param>\n    public double CalcLoanPayment(double pLoanAmount,\
  \ double pYearlyInterestRate, int pNumMonthlyPayments)\n    {\n      var mthlyInterestRate\
  \ = pYearlyInterestRate / 12;\n      var numerator = pLoanAmount * mthlyInterestRate;\n\
  \      var denominator = (1 - Math.Pow(1 + mthlyInterestRate, pNumMonthlyPayments));\n\
  \      var mthlyPayment = Math.Round(numerator / denominator, 2);\n      return\
  \ mthlyPayment;\n    }\n  }\n}\n```\n\n我们想要创建一些测试来确保此方法在它支持的所有情况下都能正常工作。首先，我们编写一个应该不会产生错误的场景的测试。为了检查结果，我们可以使用网络上的许多抵押贷款计算器之一。使用这些工具之一，我们发现\
  \ 1000 美元贷款、利率为 10%、期限为 30 年的每月还款额应为 8.78 美元。在列表 3.5 中，我们编写了测试传入这些值，并 `Assert` 断言返回值是有效的。\n\
  \n列表 3.5\\. 示例单元测试\n\n点击此处查看代码图像\n\n```assembly\nusing CodeSamples.Ch03_UnitTesting.Listing4;\n\
  using Microsoft.VisualStudio.TestTools.UnitTesting;\n\nnamespace CodeSamples.Ch03_UnitTesting.Listing5\n\
  {\n  [TestClass]\n  public class FinancialFunctionsUnitTest\n  {\n    [TestMethod]\n\
  \    public void CalcLoanPayment_Loan1000Int10Pmt360_ReturnsProperPayment()\n  \
  \  {\n      // Arrange 准备\n      var ex = new FinancialFunctions();\n      // Act\
  \ 执行\n      var pmt = ex.CalcLoanPayment(1000, 10, 360);\n      // Assert 断言\n \
  \     Assert.AreEqual(8.78, pmt);\n    }\n  }\n}\n```\n\n让我们逐行分析这个测试。首先注意到的是类上的\
  \ `TestClass` 属性。这是为了告诉单元测试框架该类是一个测试类。每个单元测试框架的属性不同，但它们都需要类似的标记标记测试类。在测试方法上，也有标记标记方法的属性，这被称为\
  \ `TestMethod`。\n\n类本身的名称在技术上是不重要的，因此我们通常将其命名为与测试类相同的名称，并在末尾附加 `UnitTest`。方法名在技术上也不重要，因为它不会被任何代码调用。我们命名单元测试方法的标准是以被测试的方法开始，添加测试的特定条件，最后添加预期的结果。在这种情况下，我们测试\
  \ `CalcLoanPayment` 方法在 1000 美元贷款金额、10% 年利率和 360 次每月还款的情况下，是否返回正确的还款额，因此我们得到了如下名称。该名称应该足够描述，以便当你看到测试运行时其旁边有红色的“失败”指示时，你会知道是哪个场景失败了。\n\
  \n点击此处查看代码图像\n\nCalcLoanPayment_Loan1000Int10Pmt360_ReturnsProperPayment\n\n测试方法的体非常简单。我们创建要测试的类的实例，然后使用相应的参数调用待测试的方法。此方法中我们之前没过的唯一代码是\
  \ `Assert` 行。`Assert` 关键字是确保我们测试的方法正常工作的地方。\n\n这种测试结构被称为“准备-执行-断言”（Arrange-Act-Assert）。测试的第一步是准备类以反映我们想要测试的情况。然后我们对待测试的类执行操作以执行我们想要测试的代码。最后，我们断言返回值（或所执行的操作）符合我们的测试。当我们运行此测试时，可以看到我们的方法返回了错误的值，如图\
  \ 3.5 所示。我们发现了我们的第一个 Bug！图 3.5 在错误消息中显示了预期值和实际返回的值。\n\n\n\n\n通过检查代码，我们可以看到传入的利率是\
  \ 0 到 100 之间的数字，而我们的代码期望的是 0 到 1 之间的数字。我们可以根据认为哪部分出错了，来修改测试用例或修改我们的代码。由于人们通常将年利率称为\
  \ 10% 而不是 0.1，因此我们允许用户传入 0 到 100 之间的数字，使得年利率为 10 是合法的。这意味着我们必须更新业务逻辑以适应这一点，如列表 3.6\
  \ 所示。\n\n### 列表 3.6. 固定单位的测试对象\n\n点击此处查看代码图像\n\n```csharp\nusing System;\n\nnamespace\
  \ CodeSamples.Ch03_UnitTesting.Listing6\n{\n  public class FinancialFunctions\n\
  \  {\n    /// <summary>\n    /// P = (Pv*R) / [1 - (1 + R)^(-n)]\n    /// where\n\
  \    ///     Pv  = Present Value (beginning\n    ///             value or amount\
  \ of loan)\n    ///     APR = Annual Percentage Rate\n    ///             (one year\
  \ time period)\n    ///     R   = Periodic Interest Rate =\n    ///            \
  \ APR/ # of interest periods per year\n    ///     P   = Monthly Payment\n    ///\
  \     n   = # of interest periods for overall\n    ///             time period (i.e.,\
  \ interest\n    ///             periods per year * number of years)\n    /// </summary>\n\
  \    /// <param name=\"pLoanAmount\">Original amount of the loan</param>\n    ///\
  \ <param name=\"pYearlyInterestRate\">Yearly interest rate</param>\n    /// <param\
  \ name=\"pNumMonthlyPayments\">Num of mthly payments</param>\n    public double\
  \ CalcLoanPayment(double pLoanAmount, double pYearlyInterestRate, int pNumMonthlyPayments)\n\
  \    {\n      //Change the divisor for the yearly interest rate\n      var mthlyInterestRate\
  \ = pYearlyInterestRate / 1200;\n      var numerator = pLoanAmount * mthlyInterestRate;\n\
  \      var denominator = (1 - Math.Pow(1 + mthlyInterestRate, -pNumMonthlyPayments));\n\
  \      var mthlyPayment = Math.Round(numerator / denominator, 2);\n      return\
  \ mthlyPayment;\n    }\n  }\n}\n```\n\n再次运行测试证明代码现在可以正常工作，如图 3.6 所示。\n\n![Image](img/00013.jpeg)\n\
  图 3.6. 待测试系统\n\n如列表 3.7 所示，我们现在可以添加更多方法来测试不同的场景并确保返回值是有效的。\n\n### 列表 3.7. 附加单元测试\n\
