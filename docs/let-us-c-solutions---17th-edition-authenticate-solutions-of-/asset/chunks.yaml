    # [CHAPTER ZERO](#toc.xhtml_c00)


    # [Before We Begin](#toc.xhtml_c00)


    To understand C language and gain confidence in working with it you would be required
    to type programs in this book and then instruct the machine to execute them. To
    type any program you need another program called Editor. Once the program has
    been typed it needs to be converted to machine language (0s and 1s) before the
    machine can execute it. To carry out this conversion we need another program called
    Compiler. Compiler vendors provide an Integrated Development Environment (IDE)
    which consists of an Editor as well as the Compiler. These IDEs are discussed
    in this appendix.


    # IDEs


    There are several such IDEs available, each targeted towards different processor
    and operating system combinations. Given below is a brief description of the popular
    IDEs along with the links from where they can be downloaded.


    # Turbo C/C++ under Windows


    If you wish to use Turbo C/C++ it is available at:


    [https://www.developerinsider.in/download-turbo-c-for-windows-7-8-8-1-and-windows-10-32-64-bit-full-screen/](https://www.developerinsider.in/download-turbo-c-for-windows-7-8-8-1-and-windows-10-32-64-bit-full-screen/)


    It is very easy to install and it works for Windows 7, 8, 8.1 and Windows 10 (32
    bit or 64 bit) with full/window screen mode.


    # NetBeans under Windows


    NetBeans is not a compiler. It is merely an IDE. It''s Windows version can be
    downloaded from


    [http://www.netbeans.org](http://www.netbeans.org)


    For developing C programs using NetBeans under Windows, you would also have to
    install Cygwin software. Cygwin comes with GCC compiler. It is available at


    [https://www.cygwin.com/](https://www.cygwin.com/)


    There are nice tutorials available at the following links should you face any
    difficulty in setting up Cygwin and NetBeans:


    [https://netbeans.org/community/releases/80/cpp-setup-instructions.html](https://netbeans.org/community/releases/80/cpp-setup-instructions.html)


    [https://www.wikihow.com/Run-C/C%2B%2B-Program-in-Netbeans-on-Windows](https://www.wikihow.com/Run-C/C%2B%2B-Program-in-Netbeans-on-Windows)


    # NetBeans under Linux


    If you propose to use NetBeans under Linux you won''t need Cygwin as with most
    Linux installations (like say, Ubuntu) GCC compiler comes preinstalled. So you
    need to just download and install NetBeans for Linux environment.


    # Visual Studio under Windows


    If you wish to use VisualStudio Express it is available at [https://www.visualstudio.com/vs/express/](https://www.visualstudio.com/vs/express/)


    You are free to use any of the IDEs mentioned above for compiling programs in
    this book. If you wish to know my personal choice, I would prefer NetBeans + Cygwin
    or Visual Studio Express Edition. All the IDEs are easy to use and are available
    free of cost.


