    ## 编译与执行步骤


    ### IDE

    有多种 IDE 可用，针对不同的操作系统组合。以下是常用工具的简要描述。


    ### Windows 下的 C/C++

    如果你想使用 `Turbo C`，可以在：`https://www.developerinsider.in/download-turbo-c-for-windows-7-8-1-and-windows-10-32-bit-full-screen/`


    ### Windows 下的 NetBeans

    NetBeans 不是编译器，它仅仅是一个 IDE。Windows 版本可以从 http://www.netbeans.org 下载。Windows 下使用
    NetBeans 开发 `C` 程序，你还需要安装 `Cygwin` 软件。`Cygwin` 带有 `GCC` 编译器。它可以在 https://www.cygwin.com/
    获取。


    如果你在设置 `Cygwin` 和 `NetBeans` 时遇到任何困难，可以在以下链接找到很好的教程：

    `https://netbeans.org/community/releases/80/cpp-setup-instructions.html`


    `https://www.wikihow.com/Run-C/C%2B%2B-Program-in-Netbeans-on-Windows`


    ### Linux 下的 NetBeans

    如果你计划在 Linux 下使用 NetBeans，你不需要 Cygwin，因为大多数 Linux 安装（例如 Ubuntu）都预装了 `GCC` 编译器。你只需要下载并安装
    Linux 版的 NetBeans。


    ### Windows 下的 Visual Studio

    如果你想使用 `VisualStudio Express`，可以在 https://www.visualstudio.com/vs/express/ 获取。


    你可以使用上述任何 IDE 来编译书中的程序。如果你想知道我的个人选择，我更倾向于使用 `NetBeans` + `Cygwin` 或 `Visual Studio
    快捷版`。


