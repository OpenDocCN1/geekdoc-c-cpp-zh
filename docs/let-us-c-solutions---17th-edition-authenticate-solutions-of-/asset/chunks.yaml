    \ `AA0` 到 `FF9`。零件的其他特征是制造年份、`material` 和 `quantity`。\n\n1. 规定一个结构体来存储对应零件的信息。\n\
    2. 编写一个程序，获取序列号在 `BB1` 和 `CC6` 之间的零件信息。\n\n#### 程序：\n```c\n/* 创建存储发动机数据的结构体 */\n\
    #include <stdio.h>\nstruct automobile\n{\n    int s_no;\n    int year_o_manu;\n\
    \    char material[20];\n    int quantity;\n};\nstruct automobile part[2];\nvoid\
    \ retrieve();\nvoid display();\nvoid set_auto_data();\nint main()\n{\n    int\
    \ i;\n    /* 设置记录的值*/\n    set_auto_data();\n    /* 显示所有记录*/\n    display();\n\
    \    /* 获取 BB1 到 CC6 之间的零件信息*/\n    retrieve();\n    return 0;\n}\nvoid retrieve()\n\
    {\n    int i, j = 0;\n    printf (“\\nBB1 到 CC6 之间的零件列表:\");\n    for (i = 0;\
    \ i < 2; i++)\n    {\n        if (part[i].s_no >= 0xBB1 && part[i].s_no <= 0xCC6)\n\
    \        {\n            j = 1;\n            printf (“\\n\\t 零件编号 = %d\\n”, i);\n\
    \            printf (“\\t\\t 序列号 = %d\\n”, part[i].s_no);\n            printf\
    \ (“\\t\\t 制造年份 = %d\\n”, part[i].year_o_manu);\n            printf (“\\t\\t 材料\
    \ = %s\\n”, part[i].material);\n            printf (“\\t\\t 数量 = %d\\n”, part[i].quantity);\n\
    \        }\n    }\n    if (j == 0)\n        printf (“\\n 没有找到符合条件的零件\\n”);\n}\n\
    void display()\n{\n    int i;\n    for (i = 0; i < 2; i++)\n    {\n        printf\
    \ (“\\n\\n\\t 零件编号 = %d\\n”, i);\n        printf (“\\t 序列号 = %d\\n”, part[i].s_no);\n\
    \        printf (“\\t 制造年份 = %d\\n”, part[i].year_o_manu);\n        printf (“\\\
    t 材料 = %s\\n”, part[i].material);\n        printf (“\\t 数量 = %d\\n”, part[i].quantity);\n\
    \    }\n}\nvoid set_auto_data()\n{\n    int i;\n    for (i = 0; i < 2; i++)\n\
    \    {\n        /* 设置记录*/\n        printf (“\\nEnter 零件序列号:”);\n        scanf\
    \ (“%d”, &part[i].s_no);\n        printf (“nEnter 制造年份:”);\n        scanf (“%d”,\
    \ &part[i].year_o_manu);\n        printf (“nEnter 材料:”);\n        scanf (“%s”,\
    \ part[i].material);\n        printf (“nEnter 数量:”);\n        scanf (“%d”, &part[i].quantity);\n\
    \    }\n}\n```\n\n### (d)\n记录包含了运动员的姓名、年龄、比赛次数以及他在每场比赛中获得的平均分。创建一个结构体来持有这些记录，并编写一个程序读取这些记录并按平均分升序排列。使用\
    \ `sort()` 标准函数。\n\n#### 程序：\n```c\n/* 创建结构体，排序并显示 */\n#include <stdio.h>\n#include\
    \ <stdlib.h>\n\nstruct cricketer\n{\n    char name[20];\n    int age;\n    int\
    \ matches;\n    float average;\n};\n\nstruct cricketer players[3];\n\nint compare(const\
    \ void *, const void *);\nvoid sort_players();\nvoid display();\nvoid set_data();\n\
    \nint main()\n{\n    /* 设置记录的值 */\n    set_data();\n    /* 显示输入的数据 */\n    printf\
    \ (“\\n 已输入的数据:\\n”);\n    display();\n    /* 按平均分排序数组 */\n    sort_players();\n\
    \    printf (“\\n 按平均分排序后的数据:\\n”);\n    display();\n    return 0;\n}\n\n/* 用于排序结构体数组函数\
    \ */\nvoid sort_players()\n{\n    qsort(players, 3, sizeof(players[0]), compare);\n\
    }\n\n/* 比较函数 */\nint compare(const void *a, const void *b)\n{\n    return ((struct\
    \ cricketer *)a)->average - ((struct cricketer *)b)->average;\n}\n\n/* 显示结构体中的所有条目\
    \ */\nvoid display()\n{\n    int i;\n    for (i = 0; i < 3; i++)\n    {\n    \
    \    printf (“\\n\\n\\t 姓名: %s”, players[i].name);\n        printf (“\\n\\t 年龄:\
    \ %d”, players[i].age);\n        printf (“\\n\\t 比赛次数: %d”, players[i].matches);\n\
    \        printf (“\\n\\t 平均分: %.2f”, players[i].average);\n    }\n}\n\n/* 设置结构体的值\
    \ */\nvoid set_data()\n{\n    int i;\n    for (i = 0; i < 3; i++)\n    {\n   \
    \     printf (“\\nEnter 运动员姓名:”);\n        scanf (“%s”, players[i].name);\n  \
    \      printf (“nEnter 年龄:”);\n        scanf (“%d”, &players[i].age);\n      \
    \  printf (“nEnter 比赛次数:”);\n        scanf (“%d”, &players[i].matches);\n    \
    \    printf (“nEnter 平均分:”);\n        scanf (“%f”, &players[i].average);\n   \
    \ }\n}\n```\n\n"
