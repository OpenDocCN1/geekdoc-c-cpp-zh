    指针包含地址。任何地址都是 4 字节长。所以无论持有谁的地址，指针都是 4 字节长。\n(4) 结构体有时会有空隙？为什么存在？如何避免？\n在许多操作系统中，将实体放在\
    \ 4 的倍数地址上更容易访问。因此在内存中创建结构体变量时，每个结构元素都被放在 4 的倍数地址上。这导致了内存空隙的产生。可以使用 `#pragma pack`\
    \ 预处理器指令避免。\n(5) 递归调用应该始终受 `if`。为什么？请举例说明。\n如果递归调用不受 `if` 控制，函数将陷入死循环。\n```c\n\
    void fun()\n{\n    static int count = 0;\n    count++;\n    if (count <= 5)\n\
    \    {\n        printf (“%d\\n”, count);\n        fun();\n    }\n    else\n  \
    \      return;\n}\n```\n\n### [D] 尝试回答以下问题：[20 分，每题 5 分]\n(1) 定义一个接收 4 个整数并返回这些整数之和、积和平均值的函数。\n\
    ```c\n#include <stdio.h>\nvoid calc (int *, int *, float *);\nint main()\n{\n\
    \    int sum, prod;\n    float avg;\n    calc (&sum, &prod, &avg);\n    printf\
    \ (“%d %d %f\\n”, sum, prod, avg);\n    return 0;\n}\nvoid calc (int *sum, int\
    \ *prod, float *avg)\n{\n    int n1, n2, n3, n4;\n    printf (“\\n Enter four\
    \ numbers :”);\n    scanf (“%d%d%d%d”, &n1, &n2, &n3, &n4);\n    *sum = n1 + n2\
    \ + n3 + n4;\n    *prod = n1 * n2 * n3 * n4;\n    *avg = *sum / 4.0f;\n}\n```\n\
    \n(2) 写一个递归函数，打印它从 `main()` 调用时接收到的数字的质因数。\n```c\n#include <stdio.h>\nvoid factor\
    \ (int);\nint main()\n{\n    int num;\n    printf (“nEnter a number:”);\n    scanf\
    \ (“%d”, &num);\n    printf (“\\nPrime Factors are:”);\n    factor (num);\n  \
    \  return 0;\n}\nvoid factor (int n)\n{\n    static int i = 2;\n    if (i <= n)\n\
    \    {\n        if (n % i == 0)\n        {\n            printf (“%d”, i);\n  \
    \          n = n / i;\n        }\n        else\n            i++;\n        factor\
    \ (n);\n    }\n    return;\n}\n```\n\n"
