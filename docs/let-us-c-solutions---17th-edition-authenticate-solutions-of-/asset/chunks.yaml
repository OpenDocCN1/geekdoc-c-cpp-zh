    # Introduction

    The first requests for a book like ‘Let Us C Solutions’ started coming when the
    third edition of Let Us C was released. I answered them by writing this book.
    Since then I have met so many readers who said that every new edition of Let Us
    C should be accompanied with two books—a new edition of ‘Let Us C Solutions’ and
    a new edition of ‘Let Us C Workbook’. I decided to accede to this request and
    from fifth edition onwards started releasing all these three books simultaneously.


    The success of last 13 editions of this book has validated my belief that if you
    have a book which lets a reader cross-check the solutions/programs that he creates,
    then it boosts his confidence and improves the overall language learning process.


    Through all the editions of this book one person who never got tired of helping
    me was Manish Jain of BPB. No matter what request I made, he always acceded to
    it.


