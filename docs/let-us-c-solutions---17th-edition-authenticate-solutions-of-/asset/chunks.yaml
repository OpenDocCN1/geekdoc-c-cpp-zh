    The compilation and execution process with each of the IDEs mentioned in the previous
    section are a bit different. So for your benefit I am giving below these steps
    for each IDE.


    # Compilation and Execution using Turbo C++


    Carry out the following steps to compile and execute programs using Turbo C++:


    (a) Start NetBeans from `Start | All Programs | Turbo C++`.


    (b) Click ‘Start Turbo C++`’ from the dialog that appears.


    (c) Select `File | New` from menu.


    (d) Type the program.


    (e) Save the program using `F2` under a proper name (say `Program1.c`).


    (f) Use `Ctrl + F9` to compile and execute the program.


    (g) Use `Alt + F5` to view the output.


    # Compilation and Execution using NetBeans


    Carry out the following steps to compile and execute programs using NetBeans:


    (a) Start NetBeans from `Start | All Programs | NetBeans`.


    (b) Select `File | New Project…` from the `File` menu. Select Project Category
    as `C/C++` and Project Type as `C/C++ Application` from the dialog that pops up.
    Click `Next` button.


    (c) Type a suitable project name (say `Program1`) in Project Name TextBox. Click
    `Finish`.


    (d) Type the program.


    (e) Save the program using `Ctrl + S`.


    (f) Use `F6` to compile and execute the program.


    # Compilation and Execution using Visual Studio Express


    Carry out the following steps to compile and execute programs using Visual Studio
    Express:


    (a) Start Visual Studio Express from `Start | All Programs | Microsoft Visual
    C++ Express`.


    (b) Select `File | New Project…` from the `File` menu. Select Project Type as
    `C/C++ | Win32 Console Application` from the dialog that pops up. Type a suitable
    project name (say `Program1`) in Name TextBox. Click `OK` and `Finish`.


    (c) Type the program.


    (d) Save the program using `Ctrl+S`.


    (e) Use `Ctrl+F5` to compile and execute the program.


    When you use Visual Studio to create a `Win32 Console Application` for the above
    program the wizard would insert the following code by default:


    ```

    #include “stdafx.h”

    int _tmain (int argc, _TCHAR* argv[])

    {

    return 0;

    }

    ```


    You can delete this code and type your program in its place. If you now compile
    the program using `Ctrl+F5` you would get the following error:


    Fatal error C1010:


    unexpected end of file while looking for precompiled header. Did you forget to
    add ‘#include “stdafx.h”’ to your source?


    If you add `#include “stdafx.h"` at the top of your program then it would compile
    and run successfully. However, including this file makes the program Visual Studio-centric
    and would not get compiled with other compilers. This is not good, as the program
    no longer remains portable. To eliminate this error, you need to make a setting
    in Visual Studio. To make this setting carry out the following steps:


    (a) Go to ‘Solution Explorer’.


    (b) Right click on the project name and select `Properties` from the menu that
    pops up. On doing so, a dialog box called `Property Pages` would appear.


    (c) From the left pane of this dialog first select `Configuration Properties`
    followed by `C/C++`.


    (d) Select `Precompiled Headers`.


    (e) From the right pane of the dialog click on `Create/Use Precompiled Header`.
    On doing so in the value for this option a triangle would appear.


    (f) Click on this triangle and a drop-down list box would appear.


    (g) From the list box select `Not using Precompiled Header`.


    (h) Click on `OK` button to make the setting effective.


    In addition to this, you need to make one more setting. By default Visual Studio
    believes that your program is a C++ program and not a C program. So by making
    a setting you need to tell it that your program is a C program and not a C++ program.
    Carry out the following steps to make this setting:


    (a) Go to `Solution Explorer` window.


    (b) Right click on the project name and select `Properties` from the menu that
    pops up. On doing so, a `Property Pages` dialog box would appear.


    (c) From the left pane of this dialog box first select `Configuration Properties`
    followed by `C/C++`.


    (d) In `C/C++` options select `Advanced`.


    (e) Change the `Compile As` option to `Compile as C code (/TC)`.


    Once this setting is made you can now compile the program using `Ctrl+F5`. This
    time no error would be flagged, and the program would compile and execute successfully.


    # Compilation and Execution at Linux Command-line


    C programs can be compiled and executed even at command-line, i.e. without using
    any IDE. Many programmers prefer this mode. In such cases we need to use an editor
    to type the program and a compiler to compile it. For example, if you wish to
    compile and execute programs at Linux command prompt, then you may use an editor
    like `vi` or `Vim` and a compiler like `GCC`. In such as case you need to follow
    the following steps to compile and execute your program.


    (a) Type the program and save it under a suitable name, `hello.c`.


    (b) At the command prompt switch to the directory containing `hello.c` using the
    `cd` command.


    (c) Compile the program using `GCC` compiler as shown below.


    ```

    $ gcc hello.c

    ```


    (d) On successful compilation, `GCC` produces a file named `a.out`. This file
    contains the machine language code of the program which can now be executed.


    (e) Execute the program using the following command:


    ```

    $ ./a.out

    ```


