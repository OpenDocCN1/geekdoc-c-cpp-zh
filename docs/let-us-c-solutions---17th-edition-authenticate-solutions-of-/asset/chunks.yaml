    (b) Write macro definitions for the following:


    1\. To find arithmetic mean of two numbers.


    2\. To find absolute value of a number.


    3\. To convert an uppercase alphabet to lowercase.


    4\. To obtain the bigger of two numbers.


    *Program:*


    `#include <stdio.h>`


    `/* Macros Defined Below */`


    `#define MEAN(x,y) ((x + y) / 2)`


    `#define ABS(x) (x < 0 ?` `x * - 1 : x)`


    `#define TOLOWER(x) (x + 32)`


    `#define BIG(x,y,z) (x > y && x > z ?` `x : y > x && y > z ?` `y : z)`


    `int main()`


    `{`


    `char ch;`


    `int d, a, b, c;`


    `printf (“\nEnter any two numbers:”);`


    `scanf (“%d %d”, &a, &b);`


    `d = MEAN (a, b); /* Macro substitution */`


    `printf (“Mean is %d\n”, d);`


    `printf (“\nEnter any number:”); scanf (“%d”, &a);`


    `d = ABS (a);`


    `printf (“Absolute value is %d\n”, d);`


    `fflush (stdin);`


    `printf (“\nEnter any upper case character:”);`


    `scanf (“%c”, &ch);`


    `ch = TOLOWER (ch);`


    `printf (“Lower case character is %c\n”, ch);`


    `printf (“\nEnter any three numbers:”);`


    `scanf (“%d %d %d”, &a, &b, &c);`


    `d = BIG (a, b, c);`


    `printf (“Big number is: %d\n”, d);`


    `return 0;`


    `}`


    (c) Write macro definitions with arguments for calculation of Simple Interest
    and Amount. Store these macro definitions in a file called “interest.h”. Include
    this file in your program, and use the macro definitions for calculating simple
    interest and amount.


    *Program:*


    `/* interest.h */`


    `/* Storing the macro definitions of Simple Interest and Amount in the “interest.h”
    header file */`


    `#define SI(p, n, r) (p * n * r / 100)`


    `#define AMT(p, SI) (p + SI)`


    `/* Main Program to calculate simple interest and amount by including “interest.h”
    header file*/`


    `#include <stdio.h>`


    `#include “interest.h”`


    `int main()`


    `{`


    `int p, n;`


    `float si, amt, r;`


    `printf (“\nEnter Principal, no.` `of years and rate of interest:”);`


    `scanf (“%d %d %f”, &p, &n, &r);`


    `si = SI (p, n, r);`


    `amt = AMT (si, p);`


    `printf (“Simple interest is: %f\nAmount is: %f\n”, si, amt);`


    `return 0;`


    `}`


