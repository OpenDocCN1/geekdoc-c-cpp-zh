    ## [A] Point out the errors, if any, in the following C statements:


    (a) `x = (y + 3);` No error.

    (b) `cir = 2 * 3.1415 * r;` No error.

    (c) `char = ‘3’;` Error. Keyword cannot be used as a variable name.

    (d) `4 / 3 * 3.14 * r * r = vol_of_sphere;` Error. On the left-hand side of `=`
    there can only be a variable.

    (e) `volume = a³;` Error. `a³` is not a valid statement. Instead we can use `a
    * a`.

    (f) `area = 1 / 2 * base * height;` No error.

    (g) `si = p * r / 100;` No error.

    (h) `area of circle = 3.14 * r * r;` Error. `area of circle` is an invalid variable
    name.

    (i) `peri_of_tri = a + b + c;` No error.

    (j) `slope = (y2 - y1) ÷ (x2 - x1);` Error. `÷` is an invalid operator.

    (k) `3 = b = 4 = a;` Error. A variable name must be present on the left hand side
    of `=` operator.

    (l) `count = count + 1;` No error.

    (m) `char ch = ‘25 Apr 12’;` Error. Multiple characters cannot be stored in a
    `char` variable.


    ## [B] Evaluate the following expressions and show their hierarchy.


