    ## Compilation and Execution Steps


    ### IDEs

    There are several IDEs available, each targeted different processor and operating
    system combinations. Given below is a brief description of the popular ones.


    ### Turbo C/C++ under Windows

    If you wish to use `Turbo C` it is available at: `https://www.developerinsider.in/download-turbo-c-for-windows-7-8-1-and-windows-10-32-bit-full-screen/`


    ### NetBeans under Windows

    NetBeans is not a compiler. It is merely an IDE. It''s Windows version can be
    downloaded from `http://www.netbeans.org`. For developing `C` programs using `NetBeans`
    under Windows, you would also have to install `Cygwin` software. `Cygwin` comes
    with `GCC` compiler. It is available at `https://www.cygwin.com/`.


    There are nice tutorials available at the following links should you face any
    difficulty in setting up `Cygwin` and `NetBeans`:

    `https://netbeans.org/community/releases/80/cpp-setup-instructions.html`


    `https://www.wikihow.com/Run-C/C%2B%2B-Program-in-Netbeans-on-Windows`


    ### NetBeans under Linux

    If you propose to use `NetBeans` under Linux you won''t need `Cygwin` as with
    most Linux installations (like say, Ubuntu) `GCC` compiler comes preinstalled.
    So you need to just download and install `NetBeans` for Linux environment.


    ### Visual Studio under Windows

    If you wish to use `VisualStudio Express` it is available at `https://www.visualstudio.com/vs/express/`


    You are free to use any of the IDEs mentioned above for compiling programs in
    this book. If you wish to know my personal choice, I would prefer `NetBeans` +
    `Cygwin` or `Visual Studio Express Edition`.

