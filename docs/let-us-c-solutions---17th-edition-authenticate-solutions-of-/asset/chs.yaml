  \n(1) **偏移加密 (Offset cipher)**：在偏移加密中，源文件的每个字符都与一个固定值进行偏移，然后写入目标文件。例如，如果从源文件中读取的字符是‘A’，则通过偏移‘A’一个固定值（例如\
  \ 128）将其转换为新字符，然后将新字符写入目标文件。\n\n*程序：*\n\n```c\n/* 使用偏移加密加密/解密文件 */\n#include <stdio.h>\n\
