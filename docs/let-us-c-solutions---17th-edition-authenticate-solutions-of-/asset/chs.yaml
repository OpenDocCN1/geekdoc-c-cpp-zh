- "# Let Us C 解决方案 - 第17版：Let US C 练习认证答案（英文版）\n\n\n\n![](img/cover.jpg)\n\n![image](img/cover.jpg)\n\
  \n\n![](img/logo.jpg)\n\n[www.bpbonline.com](http://www.bpbonline.com)\n\n\n\n\n\
  \n\n\n\n\n\n\n\n# 献给\n*Nalinee and Prabhakar Kanetkar*\n\n# 关于作者\n通过他的 C、C++、数据结构、VC++、.NET、嵌入式系统等书籍和在线\
  \ Quest 视频课程，Yashavant Kanetkar 在过去的二十五载里创造、塑造并培养了数十万 IT 人才。Yashavant 的书籍和在线课程为在印度及海外培养顶尖\
  \ IT 人才做出了巨大贡献。\n\nYashavant 的书籍在全球范围内认可，数百万学生/专业人士从中受益。他的书已被翻译成印地语、古吉拉特语、日语、韩语和中文。他的许多书籍在印度、美国、日本、新加坡、韩国和中国出版。\n\
  \nYashavant 是 IT 领域备受青爱的演讲者，曾在 TedEx、IITs、NITs、IIITs 和全球软件公司举办过研讨会/工作坊。\n\nYashavant\
  \ 因其在创业、专业和学术方面的卓越表现荣获 IIT Kanpur 颁发的“杰出校友奖”。该奖项授予 IIT Kanpur 在过去 50 年中对其专业领域和社会进步做出重大贡献的前\
  \ 50 名校友。\n\n为了感谢他对印度 IT 教育做出的巨大贡献，他连续五年获得微软颁发的“最佳 .NET 技术贡献者”和“最有价值专业人士”奖。\n\n\
  Yashavant 拥有 VJTI Mumbai 的工程学士学位和 IIT Kanpur 的硕士学位。他目前的任职包括 KICIT Pvt. Ltd. 的董事。可以通过\
  \ kanetkar@kicit.com 或通过 [`www.kicit.com`](http://www.kicit.com/) 与他联系。\n\n# 引言\n\
  当《Let Us C》第三版发布时，人们开始提出像《Let Us C 题解》这样的请求。我通过编写这本书来回答这些请求。从那时起，我遇到了许多读者，他们说每一个新版本的《Let\
  \ Us C》都应该配有两本书——一本新版的《Let Us C 题解》和一本新版的《Let Us C 练习册》。我决定接受这一请求，并从第五版开始同时发行这三本书。\n\
  \n这本书过去 13 版本的成功，验证了我的信念：如果你有一本书可以让读者交叉检查他们创建的解决方案/程序，那么就能增强他们的信心并改进整体的语言学习过程。\n\
  \n在本书的所有版本中，有一个来自 BPB 的 Manish Jain 一直不倦地帮助我。无论我提出什么请求，他总是会满足。\n\nAmol Tambat, Ajay\
  \ Daga, Prachi Garaye, Amit Mendhe, Vikrant Sahoo, Shoeb Parvez, Monali.\n\n第一次提出像《Let\
  \ Us C 题解》这样的书是在《Let Us C》第三版发布时。我通过编写这本书来回答这些请求。从那时起，我遇到了许多读者，他们说每一个新版本的《Let Us\
  \ C》都应该配有两本书——一本新版的《Let Us C 题解》和一本新版的《Let Us C 练习册》。我决定接受这一请求，并从第五版开始同时发行这三本书。\n\
  \n这本书过去 13 版本的成功，验证了我的信念：如果你有一本书可以让读者交叉检查他们创建的解决方案/程序，那么就能增强他们的信心并改进整体的语言学习过程。\n\
  \n在本书的所有版本中，有一个来自 BPB 的 Manish Jain 一直不倦地帮助我。无论我提出什么请求，他总是会满足。\n\n## 编译与执行步骤\n\n\
  ### IDE\n有多种 IDE 可用，针对不同的操作系统组合。以下是常用工具的简要描述。\n\n### Windows 下的 C/C++\n如果你想使用 `Turbo\
  \ C`，可以在：`https://www.developerinsider.in/download-turbo-c-for-windows-7-8-1-and-windows-10-32-bit-full-screen/`\n\
  \n### Windows 下的 NetBeans\nNetBeans 不是编译器，它仅仅是一个 IDE。Windows 版本可以从 http://www.netbeans.org\
  \ 下载。Windows 下使用 NetBeans 开发 `C` 程序，你还需要安装 `Cygwin` 软件。`Cygwin` 带有 `GCC` 编译器。它可以在\
  \ https://www.cygwin.com/ 获取。\n\n如果你在设置 `Cygwin` 和 `NetBeans` 时遇到任何困难，可以在以下链接找到很好的教程：\n\
  `https://netbeans.org/community/releases/80/cpp-setup-instructions.html`\n\n`https://www.wikihow.com/Run-C/C%2B%2B-Program-in-Netbeans-on-Windows`\n\
  \n### Linux 下的 NetBeans\n如果你计划在 Linux 下使用 NetBeans，你不需要 Cygwin，因为大多数 Linux 安装（例如\
  \ Ubuntu）都预装了 `GCC` 编译器。你只需要下载并安装 Linux 版的 NetBeans。\n\n### Windows 下的 Visual Studio\n\
  如果你想使用 `VisualStudio Express`，可以在 https://www.visualstudio.com/vs/express/ 获取。\n\
  \n你可以使用上述任何 IDE 来编译书中的程序。如果你想知道我的个人选择，我更倾向于使用 `NetBeans` + `Cygwin` 或 `Visual Studio\
  \ 快捷版`。\n\n\n\n\n上一节中提到的每个 IDE 的编译和执行过程略有不同。为了方便起见，我在下方列出了每个 IDE 的具体操作步骤。\n\n# 使用\
  \ Turbo C++ 进行编译和执行\n\n按照以下步骤使用 Turbo C++ 编译并执行程序：\n\n(a) 从 `Start | All Programs\
  \ | Turbo C++` 启动 NetBeans。\n\n(b) 在弹出的对话框中点击‘Start Turbo C++’。\n\n(c) 从菜单选择 `File\
  \ | New`。\n\n(d) 输入程序。\n\n(e) 使用 `F2` 以合适的名称（例如 `Program1.c`）保存程序。\n\n(f) 使用 `Ctrl\
  \ + F9` 编译并执行程序。\n\n(g) 使用 `Alt + F5` 查看输出。\n\n# 使用 NetBeans 进行编译和执行\n\n按照以下步骤使用\
  \ NetBeans 编译并执行程序：\n\n(a) 从 `Start | All Programs | NetBeans` 启动 NetBeans。\n\n\
  (b) 从 `File` 菜单中选择 `File | New Project…`。在弹出的对话框中，将项目类别（Project Category）选择为 `C/C++`，项目类型（Project\
  \ Type）选择为 `C/C++ Application`。点击 `Next` 按钮。\n\n(c) 在 Project Name（项目名称）文本框中输入合适的项目名称（例如\
  \ `Program1`）。点击 `Finish`。\n\n(d) 输入程序。\n\n(e) 使用 `Ctrl + S` 保存程序。\n\n(f) 使用 `F6`\
  \ 编译并执行程序。\n\n# 使用 Visual Studio Express 进行编译和执行\n\n按照以下步骤使用 Visual Studio Express\
  \ 编译并执行程序：\n\n(a) 从 `Start | All Programs | Microsoft Visual C++ Express` 启动 Visual\
  \ Studio Express。\n\n(b) 从 `File` 菜单选择 `File | New Project…`。在弹出的对话框中，将项目类型选择为 `C/C++\
  \ | Win32 Console Application`。在 Name（名称）文本框中输入合适的项目名称（例如 `Program1`）。点击 `OK` 和\
  \ `Finish`。\n\n(c) 输入程序。\n\n(d) 使用 `Ctrl+S` 保存程序。\n\n(e) 使用 `Ctrl+F5` 编译并执行程序。\n\
  \n当你使用 Visual Studio 为上述程序创建一个 `Win32 Console Application` 时，向导默认会插入以下代码：\n\n```\n\
  #include “stdafx.h”\nint _tmain (int argc, _TCHAR* argv[])\n{\nreturn 0;\n}\n```\n\
  \n你可以删除这段代码并在其位置输入你的程序。如果你现在使用 `Ctrl+F5` 编译程序，将得到以下错误：\n\nFatal error C1010:\n\n\
  unexpected end of file while looking for precompiled header. 在寻找预编译头文件时文件意外结束。你是否忘记在源文件中添加‘#include\
  \ “stdafx.h”’？\n\n如果你在程序的顶部添加 `#include “stdafx.h\"`，则程序就能成功编译并运行。然而，包含此文件会使程序以\
  \ Visual Studio 为中心，且无法与其他编译器一起编译。这并不好，因为程序不再具有可移植性。要消除此错误，你需要在 Visual Studio 中进行设置。要执行此设置，请按照以下步骤操作：\n\
  \n(a) 转到‘Solution Explorer’解决方案解决方案管理器）。\n\n(b) 右键点击项目名称，从弹出的菜单中选择 `Properties`（属性）。这样做会出现一个名为\
  \ `Property Pages`（属性页）的对话框。\n\n(c) 从此对话框的左侧面板首先选择 `Configuration Properties`（配置属性），然后选择\
  \ `C/C++`。\n\n(d) 选择 `Precompiled Headers`（预编译头）。\n\n(e) 从对话框右侧面板点击 `Create/Use\
  \ Precompiled Header`（创建/使用预编译头）。这样做后，该选项的值处会出现一个三角形。\n\n(f) 点击此三角形将出现一个下拉列表框。\n\
  \n(g) 从列表框选择 `Not using Precompiled Header`（不使用预编译头）。\n\n(h) 点击 `OK` 按钮使设置生效。\n\n\
