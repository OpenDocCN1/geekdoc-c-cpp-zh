  /* 根据公式计算面积的函数 */\nfloat triarea (float a, float b, float c)\n{\n    float s, m,\
  \ x;\n    s = (a + b + c) / 2;\n    m = s * (s - a) * (s - b) * (s - c);\n    x\
  \ = sqrt (m);\n    return (x);\n}\n```\n\n(d) 编写一个根据欧几里得算法计算最大公约数的，以 `J = 1980`，`K\
  \ = 1617` 为例：\n\n1980 / 1617 = 1    1980 - 1 * 1617 = 363\n1617 / 363 = 4    1617\
  \ - 4 * 363 = 165\n363 / 165 = 2    363 - 2 * 165 = 33\n5 / 33 = 5    165 - 5 *\
  \ 33 = 0\n\n因此，最大公约数是 33。\n\n*程序：*\n\n```c\n/* 计算最大公约数 - 欧几里得算法 */\n#include <stdio.h>\n\
  int fun (int, int);\nint main()\n{\n    int j, k, z;\n    printf (\"nEnter numbers:\"\
  );\n    scanf(\"%d%d\", &j, &k);\n    z = fun (j, k);\n    printf (\"GCD of two\
  \ numbers is %d\\n\", z);\n    return 0;\n}\n/* 计算最大公约数的函数 */\nint fun (int j, int\
  \ k)\n{\n    int r = 1, m = 0, t;\n    if (k > j) /* 交换 */\n    {\n        t = j;\n\
  \        j = k;\n        k = t;\n    }\n    else\n    {\n        if (j == k)\n \
  \           return j;\n    }\n    while (1)\n    {\n        r = j / k;\n       \
  \ m = j - (r * k);\n        if (!(j % k)) /* j 是 k 的倍数 */\n            n = k;\n\
  \        if (m == 0)\n            break;\n        k = m;\n        n = m;\n    }\n\
  \    return n;\n}\n```\n\n# 第十章\n\n## 递归\n\n### [A] 以下程序的输出将是：\n\n(a)\n```c\n#include\
