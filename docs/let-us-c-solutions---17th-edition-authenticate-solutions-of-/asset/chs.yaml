  \ 2);\n    d = sqrt (m);\n    return d;\n}\n/* 获取三角形顶点 */\nfloat triarea (float\
  \ a, float b, float c)\n{\n    float s, m, x;\n    s = (a + b + c) / 2;\n    m =\
  \ s * (s - a) * (s - b) * (s - c);\n    x = sqrt (m);\n    return x;\n}\n```\n\n\
