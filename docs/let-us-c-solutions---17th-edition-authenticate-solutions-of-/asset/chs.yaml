  \n(h) 给定数组 `p[5]`，编写一个函数将其循环移动两个位置。因此，如果原始数组为 `{15, 30, 28, 19, 61}`，那么移动后将变为 `{28,\
  \ 19, 61, 15, 30}`。调用此函数用于 `4 x 5` 矩阵并将其左移。\n\n*程序：*\n\n```c\n/* 数组元素的循环旋转及其在矩阵中的用法\
  \ */\n#include <stdio.h>\nvoid swap (int *);\nint main()\n{\n    int p[4][5];\n\
  \    int i, j;\n    /* 为矩阵输入数据 */\n    for (i = 0; i <= 3; i++)\n    {\n       \
  \ printf (“输入第 %d 行元素:\\n”, i);\n        for (j = 0; j <= 4; j++)\n            scanf\
  \ (“%d”, &p[i][j]);\n    }\n    /* 打印输入的矩阵 */\n    printf (“\\n 输入的矩阵为：”);\n   \
  \ for (i = 0; i <= 3; i++)\n    {\n        printf (“第 %d 行元素:”, i);\n        for\
  \ (j = 0; j <= 4; j++)\n            printf (“\\t”, p[i][j]);\n    }\n    printf\
  \ (“\\n”);\n    /* 调用函数左移行 */\n    swap (p); /* 传递数组的地址 */\n    /* 打印左移后的矩阵 */\n\
  \    printf (“\\n 左移后的矩阵：”);\n    for (i = 0; i <= 3; i++)\n    {\n        printf\
  \ (“第 %d 行元素:”, i);\n        for (j = 0; j <= 4; j++)\n            printf (“\\t”,\
  \ p[i][j]);\n    }\n    return 0;\n}\n/* 左移行的函数 */\nvoid swap (int *p)\n{\n    int\
  \ k, i, t, j;\n    /* 需要左移的 4 行 */\n    for (k = 0; k <= 3; k++) /* 移动两次 */\n  \
  \  {\n        for (i = 0; i <= 1; i++)\n        {\n            t = *(p + k * 5);\n\
  \            for (j = 0; j <= 3; j++)\n            {\n                *(p + k *\
  \ 5 + j) = *(p + k * 5 + j + 1);\n                *(p + k * 5 + j + 1) = t;\n  \
  \          }\n            *(p + k * 5 + 4) = t;\n        }\n    }\n}\n```\n\n# 第十五章\n\
