  \ (ch, ft);\n    }\n```\n\n(2) **替换加密 (Substitution cipher)**：源文件的每个字符都被一个预定义的字符替换，并将该字符写入目标文件。例如，如果从源文件中读取字符‘A’，我们决定将每个‘A’替换为‘!’，则在目标文件中写入‘!’。同样地，每个‘B’被替换为‘5’等等。\n\
