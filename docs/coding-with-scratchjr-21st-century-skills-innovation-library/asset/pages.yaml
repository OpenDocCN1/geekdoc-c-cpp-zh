    ScratchJr comes with many characters you can choose from.'
  merge: -1
  pgno: 11
- img_proc: true
  md: '# Characters


    A character is anything in your project that moves, speaks, or changes somehow.
    Characters can be people and animals. A character might also be a rock or a cupcake.
    It can be an object another character picks up. Even a star twinkling in the sky
    can be a character in your project.'
  merge: -1
  pgno: 12
- img_proc: true
  md: '![](img/36e194ea6fa5b0114022609c91b4e6f8_13_0.png)


    There is a background for any project you can think of in ScratchJr.'
  merge: -1
  pgno: 13
- img_proc: true
  md: '# Backgrounds


    Where does your story take place? There are lots of backgrounds to choose from.
    Don’t worry if they aren’t the right color. Every background can be changed to
    fit your ideas. Just tap on the paintbrush when you pick a background. Then use
    the drawing tools to make it just right.


    # Think About It!


    You can use up to four backgrounds per project. Can you think of a story to tell
    that takes place in more than one setting?'
  merge: -1
