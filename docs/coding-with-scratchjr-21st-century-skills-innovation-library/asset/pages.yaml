- img_proc: true
  md: '# Control Blocks


    Orange code blocks are called control blocks. Orange blocks are in charge! Do
    you want Scratch Cat to spin around five times? Use the orange “Repeat” block.
    Do you want an elephant to lose a race? Use the orange “Set Speed” block to make
    him move slowly.'
  merge: -1
