  md: '# Who Can Write Computer Programs?


    Our world is full of computers. Computers are in phones, watches, and even cars!
    Every computer works by following **programs**. Have you ever thought about creating
    your own computer programs? You could make a computer do whatever you want. One
    great way to get started is to use something called ScratchJr.'
  merge: -1
