  md: '# Color-Coded Code Blocks


    How do you know which code blocks to use? Blocks are color coded to help you remember
    what they do.


    +   - Yellow blocks begin a program.

    - Red blocks end it.

    - Blue blocks move characters around the screen.

    - Purple blocks change the characters’ looks.

    - Green blocks let you add sounds.'
  merge: -1
