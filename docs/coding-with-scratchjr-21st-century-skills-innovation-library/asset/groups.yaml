    # Glossary


    code blocks (KODE BLOKS) the smallest pieces of a ScratchJr program, each containing
    a single instruction


    gallery (GAL-ur-ee) a picture list of all the characters or backgrounds available
    to use in ScratchJr


    instructions (in-STRUK-shuhnz) directions on how to do something


    programming language (PROH-gram-ing LANG-wij) a set of words, symbols, and rules
    used to write instructions for a computer


    programs (PROH-gramz) instructions that tell a computer how to complete a task


    symbols (SIM-buhlz) designs or objects that stand for something else


    # Find Out More


    **Book**

    Bers, Marina Umaschi, and Mitchel Resnick. *The Official ScratchJr Book: Help
    Your Kids Learn to Code!* San Francisco: No Starch Press, 2016.


