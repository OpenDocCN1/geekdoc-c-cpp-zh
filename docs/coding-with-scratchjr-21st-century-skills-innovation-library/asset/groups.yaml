    ScratchJr is easy to use. It is also a lot of fun!


    # Who Can Write Computer Programs?


    Our world is full of computers. Computers are in phones, watches, and even cars!
    Every computer works by following **programs**. Have you ever thought about creating
    your own computer programs? You could make a computer do whatever you want. One
    great way to get started is to use something called ScratchJr.


    # ScratchJr


    Cat


    Elephant


    Giraffe


    Monkey


    ![](img/36e194ea6fa5b0114022609c91b4e6f8_7_0.png)

    ![](img/36e194ea6fa5b0114022609c91b4e6f8_7_1.png)

    ![](img/36e194ea6fa5b0114022609c91b4e6f8_7_2.png)


    You can create programs in ScratchJr by dragging colorful blocks around on the
    touch screen of a tablet computer.


    # What Is ScratchJr?


    ScratchJr is a programming language made just for kids. It works on iPads and
    other tablet computers. With ScratchJr, you can create stories and games for your
    friends to play. You will also learn how to think like a computer programmer!


    # What Is a Programming Language?


    A programming language is a set of words, symbols, and rules. It is used to write
    instructions for a computer. There are a lot of programming languages. ScratchJr
    is just one of them!


    ![](img/36e194ea6fa5b0114022609c91b4e6f8_9_0.png)


    # 1 | Undo


    Reverses the most recent change.


    - About ScratchJr

    - Interface Guide

    - Paint Editor Guide

    - Blocks Guide


    You can change the way characters look in your ScratchJr projects.


    # How Does ScratchJr Work?


    A ScratchJr project is made up of three parts. These are characters, backgrounds,
    and **code blocks**. Characters are the things in your project that move and talk.
    Backgrounds are the pictures that set the scene for a story. Code blocks tell
    your characters and backgrounds what to do.


    ![](img/36e194ea6fa5b0114022609c91b4e6f8_11_0.png)


    ScratchJr comes with many characters.


    # Characters


    A character is anything in your project that moves, speaks, or changes. Characters
    can be people, animals, or objects. Even a star in the sky.


    ![](img/36e194ea6fa5b0114022609c91b4e6f8_13_0.png)


    # Backgrounds


    Where does your story take place? There are lots of backgrounds to choose from.
    Can''t find the background you want in the ScratchJr gallery? No problem! Use
    the paint editor to create your own. Every background can fit your ideas.


    # Color-Coded Code Blocks


    How do you know which blocks to use? Blocks are color coded to help you remember
    what they do.


    - Yellow blocks begin a program.

    - Red blocks end it.

    - Blue blocks move characters around.

    - Purple blocks change the characters’ looks.

    - Green blocks let you add sounds.


    # SCRATCHJR


    Wait

    - Pauses the script for a specified amount of time (in tenths of seconds).


    - Stops all the characters'' scripts.


    Set Speed

    - Changes the rate at which certain blocks are run.

    - Runs the blocks inside a specified number of times.


    Repeat

    - Runs the blocks forever.


    ```

    END BLOCK

    ```


    # Control Blocks


    Orange code blocks are called control blocks. Orange blocks are in charge! Do
    you want Scratch Cat to spin around five times? Use the orange “Repeat” block.
    Do you want an elephant to lose a race? Use the orange “Set Speed” block to make
    him move slowly.


    ![](img/36e194ea6fa5b0114022609c91b4e6f8_19_0.png)


    Try creating your own backgrounds.


    # Make It Your Own!


    Can you find the background you want in the ScratchJr gallery? No problem! Use
    the paint editor to create your own. The paint editor has tools for filling in
    color, drawing by hand, and adding shapes. You can even use the camera to add
    your own face to a character.


    # Can I Save the Characters and Backgrounds I Make?


    Yes! Every character and background you create is saved to the gallery. This means
    you can use it again in other projects. If friends share their projects with you,
    their characters and backgrounds will be saved, too.


    # Sharing Your Project


    When you finish a project, you can share it!

    ScratchJr projects can be shared two ways.

    One way is to send them to friends through e-mail. The other way only works with
    iPads.

    You can use the AirDrop feature to send your project from one iPad to another.
    Ask an adult to help you before sharing anything. Congratulations! You made a
    program!

