    # What will you make?


    Some of today''s most incredible inventions are the work of makers. These people
    apply creativity to the latest technology to build a variety of homemade devices.
    Whether they are programming tiny computers, designing their own board games,
    or finding new uses for plastic, makers work together to share new ideas and technology.
    What will you make?


    # Read all of the Makers as Innovators Jr. books


    - Coding with Blockly

    - Coding with ScratchJr

    - Controlling an Ozobot

