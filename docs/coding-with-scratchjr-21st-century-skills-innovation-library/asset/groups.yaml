    # 什么是 ScratchJr？


    ScratchJr 是为了孩子们设计的语言。你可以在 iPad 上使用它来创作故事。


    # 什么是编程语言？


    编程语言是一套单词、符号和规则。有趣的。![](img/36e194ea6fa5b0114022609c91b4e6f8_9_0.png)


    - 撤销

