  \n# 关于作者\n\n`Daniel Hanson` 在量化建模和软件开发领域工作了近 25 年，主要使用 `C++` 实现期权定价模型、投资组合风险模型、交易系统以及库开发。在离开私营部门后，他在华盛顿大学应用数学系担任全职讲师，在计算金融与风险管理（CFRM）本科及研究生课程中教授量化开发课程。他教授的课程中，包括一系列针对量化金融的\
  \ `C++` 研究级课程，涵盖了从入门级到高级的水平。他还曾指导过多个 Google Summer of Code 学生项目，涉及使用 `C++` 和 `R`\
  \ 进行数学模型实现。他目前作为年度 `CppCon` 大会（ISO `C++` 基金）的工作人员保持活跃，主要担任会议学生项目的负责人。\n\n# 版后\n\n\
  *金融学习现代 C++*封面上的动物是一只安哥拉猫（或土耳其安哥拉猫）。安哥拉猫起源于土耳其，以土耳其首都安卡拉（曾名 Angora）命名，在那里仍被视为国宝。安哥拉猫是一种稀有但需求量巨大的猫品种，育种者处的等待名单通常长达一年，价格在\
  \ 650 到 2000 美元之间。\n\n安哥拉猫是已知最古的长毛品种，历史可以追溯到 17 世纪。20 世纪初，育种者利用安哥拉猫来改良波斯猫。然而，这几乎导致了安哥拉猫的灭绝。为了防止它们灭绝，土耳其政府在阿塔图尔森林农场和动物园（安卡拉动物园）建立了育种计划，专注于生产具有蓝色、金色或异色眼睛的白色安哥拉猫。\n\
  \n直到 20 世纪 50 年代，通过驻土耳其美国军，安哥拉猫才进入美国。在安卡拉动物园经过犹豫后，两个美国人——沃尔特·格兰特上校和夫人——被允许带着两只安哥拉猫回到美国。这两只猫是美国安哥拉猫育种计划的基础。不久之后，越来越多的美国人被允许将安哥拉猫带入美国。\n\
  \n安哥拉猫通常被称为“猫界的芭蕾舞者”，体型修长、肌肉发达，覆盖着柔软丝滑的毛发。尽管它们被认为是长毛品种，但安哥拉猫只有单层毛，使得它们的毛发更容易维护和打理。直到\
  \ 20 世纪 70 代，只有白色安哥拉猫被认为是真正的安哥拉猫。现在，安哥拉猫有多种颜色。尽管如此，最受青睐的是蓝色或异色眼睛的白色安哥拉猫。\n\nO'Reilly\
  \ 封面上的许多动物都是濒危物；它们对世界都至关重要。\n\n封面图像基于 Lydekker 的《皇家自然史》中的一张古董线条版画。系列设计由 Edie Freedman、Ellie\
  \ Volckhausen 和 Karen Montgomery 设计。封面字体使用 Gilroy Semibold 和 Guardian Sans。正文字体使用\
  \ Adobe Minion Pro；标题字体使用 Adobe Myriad Condensed；代码字体使用 Dalton Maag 的 Ubuntu Mono。\n\
