  \ `std::` 域来简化符号：\n\n```cpp\nusing std::valarray;\nvalarray prod = v1 * v2;\n```\n\
  现在这给了我们以下结果：\n```\n10 -40 90 -22.5 62.5\n```\n`v1` 和 `v2` 的点积可以通过调用 `valarray` 类的\
