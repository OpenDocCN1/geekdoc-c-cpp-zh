- "# 金融现代 C++ 学习指南\n\n\n\n![](img/cover.png)\n![](img/cover.png)\n\n\n\n\n\n\n\n\n\
  # 第一版修订历史\n\n\n\n\n\n\n\n# 献辞\n\n深怀缅我的父母。\n\n# 前言\n\n从 2011 年的 C++11 开始，C++ 标准新增的现代特性确实是卓越且具有变革性的。考虑以下截至\
  \ 2017 年为止添加的内容，它们对金融 C++ 开发者具有直接益处，且在大多数情况下很容易整合到代码中：\n\n*   移动语义（Move semantics），允许在不产生拷贝性能开销的情况下转移对象所有权（C++11）\n\
  *   智能指针（Smart pointers），大幅减少与原始指针相关的问题（C++11 和 C++14）\n*   并行标准算法，仅需额外的参数即可成倍提高代码运行速度（C++17）\n\
  *   来自常用分布的随机数生成（C++11）\n*   基于任务的并发（Task-based concurrency），通过替换几行代码即可并行运行任务（C++11）\n\
  \n自 C++11 以来，C++ 标准每三年发布一次更新版本，随后有了随后的 C++20 标准和最新的 C++23。特别是，这些较新的特性现在也已可用：\n\n\
  *   一个新的日期类，对于固定收益应用至关重要（C++20）\n*   概念（Concepts），使基于模板的泛型程序更易调试且更具表现力（C++20）\n\
  *   范围适配器（Range adaptors），能够以现代函数式形式组合算法，同时消除了低效对象拷贝的“中间人”（C++20 和 C++23）\n*   模块（Modules）——告别\
  \ `#include`，向更安全的代码致好（C++20）\n\n本书中涵盖了此处提到的所有现代特性，外复盖了流行的开源 C++ 库，如 Eigen（线性代数）和\
  \ Boost 库，并重点关注相关的金融应用。\n\n然而，在计算机科学和金融工程课程中（至少在整个美国），以及量化金融的热门在线认证项目中，C++ 教育在很大程度上似乎停留在过去。许多课程似乎仍然基于\
  \ 2003 年的标准（即 C++03）。这是我在 [CppCon](https://oreil.ly/JDAFa)（年度 C++ 大会）学生计划中听到的许多学生经常提到的抱怨，也是几位我在华盛顿大学教授直到\
  \ 2022 年的计算金融项目期间，进入项目前修过本科 C++ 课程的硕士学生所提到的。一些学生说教授拒绝更新他们的教学大纲，而另一些人说教授想教现代 C++，但他们的部门不允许。\n\
  \n因此，我尝试针对这部分读者来编写这本书：即那些对 C++ 有过入门级经验，但希望学习更多与金融模型实现相关的现代方法的人。对于具有其他编程语言经验的人来说，配合入门书籍一起学习本书也是可行的，例如\
  \ Stanley B. Lippman 等人编写 [*C++ Primer*, 第 5 版](https://oreil.ly/z12jO)（Addison-Wesley,\
  \ 2012），或 Siddhartha Rao 写的 [*Teach Yourself C++ in One Hour a Day*, 第 9 版](https://oreil.ly/5siGH）（Sams,\
  \ 2022），作为初学者和高级读者的参考书。另一个极好的资源是年度 CppCon 大会的 *Back to Basics* 系列演讲，这些视频在 [YouTube](https://www.youtube.com/user/CppCon)\
  \ 上免费提供。如果你想深入了解某个特定主题，很可能有相应的 *Back to Basics* 演讲。\n\n本书假设读者熟悉以下主题。如果你是 C++ 新手，或者已经很久没用了，可能需要专门回顾这些内容或准备参考书：\n\
  \n*   基础异常处理\n*   `static_cast`\n*   基础类设计，特别是 `public`、`protected` 和 `private`\
  \ 成员函数和数据成员\n*   静态数据成员和成员函数\n*   `cout` 和控制输出\n*   头文件和实现文件\n*   `#include<*`blah*`>`\
  \ 与 `#include \"`*`blah*`.h\"` 的区别\n*   标准 `vector` 容器\n*   使用集成开发环境调试\n\n由于金融建模涉及数学，某些章节还假设具备以下基础知识：\n\
  \n*   概率论与统计学\n*   基础数值根方法\n*   线性代数和矩阵分解\n*   Black-Scholes 期权定价及相关的布朗运动随机过程\n\n\
  # 本书指南\n\n本书的结构大致如下：\n\n*   第一章，“C++ 概述” 提供了 C++ 的概述，从 C++ 在金融领域的简史开始，一直到从 C++11\
  \ 开始向现代 C++ 的转变。它涵盖了核心语言与 C++ 标准库的分离，随后介绍了在本书剩余将使用的关键语言更新，如自动类型推导、基于范围的 `for` 循环、范围枚举和\
  \ Lambda 表达式。它还包含了核心语言和标准库中的基础数学特性。最后以对代码风格和标准的讨论结束，以及本书将遵循的标准。\n\n\n\n\n\n-   第\
  \ 2 章，“使用现代 C++ 特性编写用户定义类” 和 第 3 章，“继承、多态与智能指针” 重点介绍 `C++` 中的面向对象特性，以及那些改变（并帮助改进）了曾经\
  \ `C++` 中常用于实现组合和继承方法的现代新增功能。第 2 章 主要关注组合，即存储一个本身是对象的私有数据成员，以及 `C++11` 引入的移动语义（move\
  \ semantics）如何通过避免在构造封装类对象时进行对象拷贝，来使这一过程更高效。该章还涵盖了新的 `C++20` 三路比较运算符（也称为“飞船运算符”\
  \ `spaceship operator`），它极大地简化了等值和非等值运算符的实现。第 3 章 从能更好地促进继承和动态多态的现代特性开始。然后转回组合，此时子对象成员是一个指针资源，以及智能指针如何帮助消除与原始指针相关的问题。随后，组合和继承在现代语境下结合在一起，其中资源是指向多态对象的智能指针。两章中的金融示例均与期权定价有关。\n\
  \n-   第 4 章，“标准模板库第一部分：容器与迭代器” 和 第 5 章，“标准模板库第二部分：算法与范围” 涵盖了传统上被称为 `标准模板库` (`STL`)\
  \ 的内容。这是一组标准容器——包括 `vector` 容器等——加上允许你遍历这些容器的迭代器，以及对容器内元素执行操作的算法。`STL` 容器和迭代器在 第\
  \ 4 章 中介绍，而算法在 第 5 章 中介绍。第 5 章 还对 `C++20` 和 `C++23` 算法更具表现力的范围（ranges）形式的扩展进行了讨论，此外介绍了范围如何与范围视图（range\
  \ views）和范围适配器（range adaptors）相关。正如你将看到的，这些可以在函数式编程语境下用于组合一系列算法，从而避免拷贝数据和生成临时容器对象带来的性能开销。\n\
  \n-   第 6 章，“随机数生成与并发” 从从已知概率分布生成随机数的讨论开始，这是 `C++11` 发布的的另一个新标准库特性。特别是标准正态随机变量是连续时间金融模型的关键，而来自\
  \ `Poisson` 分布的随机值通常用于对逐笔数据（tick data）建模，以测试实盘交易策略。文中介绍了两个示例：第一个是 `shuffle` 算法结合\
  \ `C++11` 随机引擎，生成股票曲线的蒙特卡洛场景，以衡量与交易策略中最大回撤波动率相关的风险；第二个是用于带障碍的欧式期权定价的蒙特卡洛模型，其中来自标准正态分布的随机变量被用于离散布朗运动过程。随后，该章重点转向并发和并行，首先是带有\
  \ `C++17` 引入的并行 `STL` 算法示例。这些大多是现有算法的重载，但增加了一个额外的执行策略参数（execution policy parameter），这意味着只需包含一个额外参数即可获得显著的性能提升。章节最后回到蒙特卡洛期权定价示例，但使用了标准库的\
  \ `async(.)` 函数和 `future` 类，这有助于将每个蒙特卡洛场景生成为并行任务，再次在场景数量和时间步较多时显著提升了运行速度的量级。\n\n\
  -   第 7 章，“日期与固定收益证券” 引入了标准库中新的 `C++20` 日期功能，以及如何将固定收益交易通常所需的日期函数和校验整合到代码中。随后讨论了如何将此功能封装在用户定义的日期类中，该类可以用于收益率曲线类和债券类的设计，以及这些类如何结合使用来为付息债券定价。这涵盖了可能虽然琐碎但重要的细节，这些细节对固定收益交易至关重要，但在相关的教材和课程大纲中经常被遗漏。\n\
  \n-   第 8 章，“线性代数” 致力于 `C++` 中的线性代数。`C++` 线性代数库开发中一种常用技术是表达式模板编程（expression template\
  \ programming），因此在介绍开源第三方 `C++` 线性代数库 `Eigen` 之前，对该主题进行了简单介绍。这将包括在基金跟踪（回归）、篮子期权定价（Cholesky\
  \ 分解）和收益率曲线动态（主成分分解）中的应用。章节最后展望了 `C++` 标准库中的线性代数能力，特别是 `C++23` 的 `mdspan` 多维数组引用以及计划用于\
  \ `C++26` 的基于基础线性代数子程序 (`BLAS`) 的标准接口。\n\n-   第 9 章，“Boost 库” 涵盖了部分经过同行评审的开源 `Boost`\
  \ 库。多年来，来自 `Boost` 的大量内容已进入 `C++` 标准库（形式相似但不一定完全相同），而其他 `Boost` 库仍与标准库保持正交，但可以应用于解决金融领域出现的问题。特别是来自\
  \ `Boost Math Toolkit` 库的统计分布集，为 34 种“教科书级”分布提供了概率密度函数 (`PDF`)、累积分布函数 (`CDF`) 和分位数函数。`Boost\
  \ MultiArray` 库提供了一种通用多维数组，可以适配二项（和三项）格模型期权定价；而 `Boost Accumulators` 库包含了对动态数据集的高效描述性计算，非常适合跟踪回测中的性能指标。这些中都有涵盖。\n\
  \n-   第 10 章，“模块与概念” 涵盖了 `C++20` 中两个较新的特性：模块和概念。遗憾的是，模块启动缓慢，一些编译器才接近完成实现。另一方面，它们为\
  \ `C++` 软件设计和实现带来了更现代的感觉，具有更简洁更安全的代码、更高的生产力，在某些情况下缩短了编译时间。此外，我认为一旦模块变得主流，它们将为学习\
  \ `C++` 的人提供巨大的帮助，让他们能够更快上手。相比之下，概念被开发者快速采用，是一个长期期待的增强。概念为模板编程提供了更多控制，特别是准确定了以前可能埋没在晦涩错误信息中的编译时错误。它们还增加了代码的清晰度，从某种意义上帮助代码具有更好的自文档性。概念可以自定义，而一组基于\
  \ `C++11` 类型特性的健壮预定义概念已从 `C++20` 起由标准库提供。\n\n-   书末提供了五个附录，供对深入探讨更高级和历史话题感兴趣的读者参考。\n\
  \n# 本书使用的约定\n\n书中使用了以下排版约定：\n\n*斜体*\n\n表示新术语、URL、电子邮件地址、文件名和扩展名。\n\n`等宽字体`\n\n表示代码。\n\
  \n\n\n\n用于程序列表，也用于段落内部引用程序元素，例如变量名或函数名、数据库、数据类型、环境变量、语句和关键字。\n\n`等宽斜体`\n\n显示应替换为用户提供的值或由上下文确定的值的文本。\n\
  \n### 注意事项\n此元素表示一个普通说明。\n\n### 警告\n此元素表示一个警告或提示。\n\n# 使用代码示例\n\n如你所见，书中到处都是代码示例。这些示例可以从\
  \ [GitHub](https://github.com/QuantDevHacks/LearningModCppFinance) 下载，以便你可以在本地机器上编译和运行。根据\
  \ Mozilla 公共许可协议（Mozilla Public License）v.2.0 的合理条件，你可以自由地按需使用这些代码。还会定期发布随仓库的补充信息。\n\
  \n需要注意的是，这些代码示例旨在向你介绍现代 C++ 特性和开源库，并向你展示你可以使用它们的方法。它们并不是为了作为食谱或生产级代码的一部分。其首要任务是帮助你学习，以便你从那里在自己的应用程序中创造性地使用这些材料。\n\
  \n由于一直可能（特别是在软件首次发布时）其中包含错误或不一致之处，因此在此提前表歉意。如果你确实遇到了问题，请随时在配套 GitHub 站点上提交 issue（问题）。\n\
  \n如果你有技术问题或在使用代码示例时遇到问题，请发送邮件至 `support@oreilly.com`。\n\n这本书的目的是帮助你完成工作。通常情况下，如果书中提供了示例代码，你可以在你的程序和文档中使用它们。除非你复制了代码的大部分，否则你不需要联系我们获取许可。例如，编写一个使用书中几段代码的程序是不需要许可。销售或分发\
  \ O’Reilly 书籍中的示例则需要许可。通过引用本书和引用示例代码来回答问题不需要许可。将书中的大量示例代码整合到你的产品文档中则需要许可。\n\n我们感谢署名，但通常并不强制要求。署名通常包括标题、作者、出版商和\
  \ ISBN。例如：“Learning Modern C C++ for Finance by Daniel Hanson (O’Reilly). Copyright\
  \ 2025 Daniel Hanson, 978-1-098-10080-3.”\n\n如果你觉得你对代码示例的使用超出了合理使用范围或上述许可范围，请随时通过\
  \ `permissions@oreilly.com` 联系我们。\n\n# O’Reilly Online Learning\n\n### 注意事项\n40\
