  \n# 第 1 章 C++ 概览\n\n\n\n本章概述了 C++，从其简要的历史开始——包括它在量化金融领域的早期普及——以及以 2011 年发布的 `C++11`\
  \ 为标志的具有重大增强的现代时代。在 `C++11` 之前，上一次发布是 2003 年的 `C++03`，那是一个主要针对 1998 年符合国际标准组织（[ISO](https://www.iso.org/home.html)）标准的第一个\
  \ C++ 版本（`C++98`）之后的 Bug 修复的更新。从 `C++11` 开始的现代化进程持续至今，核心语言及其伴侣 C++ 标准库每三年就会增加新的创新，这使我们进入了当前的\
  \ `C++23` 版本。\n\n你还将被介绍在后续章节中将用到的有用新语言特性，以及标准库中方便的数学相关更新。最后，我们将介绍常见的类、函数和变量命名规范，并指出书中将贯使用的那些规范。\n\
  \n## C++ 与量化金融\n\nC++ 从 20 世纪 90 年代中期开始在金融领域快速增长。我们中许多那个时期活跃在行业内的人伴随着 Fortran 长大，Fortran\
  \ 用于编写数值例程和科学应用程序。虽然 Fortran 及其支持库（`BLAS`、`LAPACK`、`IMSL`）在数学和线性代数支持方面非常完善，但该语言缺乏对`面向对象编程`的支持，而这一特性的引入被当时的金融开发者认为是\
  \ C++ 的一大优势。当然，C++ 支持的内容不仅面向对象编程，正如本章稍后讨论的那样。\n\n抽象的金融建模自然包含相互作用的组件。例如，即使是基于外汇和利率的简单衍生品合约定价，通常需要以下内容：\n\
  \n*   每种货币的收益率曲线\n*   实时外汇报价的市场行情\n*   用于期权定价和风险测量的波动率曲线和/或面\n*   一组衍生品定价方法，例如闭式解和数值近似\n\
  \n这些每个组件都可以由对象表示，而 C++ 提供了创建这些对象并管理它们之间关系的方法。\n\n银行和其他金融机构还需要一种在区域和全球范围内生成风险报告的方法。对于业务遍布纽约、伦敦和东京等全球主要金融中心的公司来说，这是一项重大挑战。在每个交易日的开始时，需要其位于纽约的公司总部生成风险报告，并考虑本地和全球维护的投资组合。这可能是一项计算密集型任务，但\
  \ C++ 的性能使其成为可能，这也是它在金融行业早期被采纳的另一个重要因素。\n\n世纪之交后，新的面向对象语言（如 `Java` 和 `C#`）使软件开发过程变得稍微简单和快速，同时更高效的处理器变得越来越廉价。然而，这些语言中实现更快速部署的相同特性（如内置托管内存、垃圾收集和中间编译）也可能在运行时性能方面引入开销。关于采用何种语言的管理决策通常取决于在更快速开发和运行时效率之间的权衡。然而，即使使用了这些替代语言之一，计算密集型的定价模型和风险计算通常（且现在仍然是）被委托给现有的\
  \ C++ 库并通过接口调用。还应该注意到，C++ 提供了其他编程语言不具备的某些编译时优化。\n\n## C++11: 现代时代的诞生\n\n2011 年，[ISO\
  \ C++ 委员会](https://isocpp.org）（通常仅称为*委员会*）发布了一个重大的修订，解决了长期以来需要的现代化问题。特别是 `C++11`\
  \ 提供了这些对量化开发者来说立竿见用的欢迎抽象：\n\n*   从各种概率分布生成随机数\n*   封装数学函数的 Lambda 表达式，这些函数也可以作为参数传递给其他函数\n\
  *   基本的基于任务的并发，无需手动线程管理即可并行计算\n*   可以帮助防止内存相关程序崩溃和未定义行为的智能指针\n\n这些主题及更多内容将在接下来的章节中讨论。\n\
  \n### 注意\n\n在本章及整书中，你有时会看到 `undefined behavior`（未定义行为）这一术语。这在 C++ 标准中也被反复提到，意味着不提供任何保证的行为。在常用语中，这意味着代码没有在“遵守规则”，程序是坏掉的。因此，如果你的代码有导致未定义行为的风险，简单的建议是“不要这样做”。\n\
  \n在 `C++11` 之后，新的发布以每三年的周期推出越来越多的现代特性，以应对金融和数据科学行业的需求，最近的发布是 `C++23`。本书主要涵盖了到 `C++20`\
  \ 的进展，但也将讨论 `C++23` 中的一些新项目，以及 `C++26` 中一些对金融开发者可能感兴趣的拟议新特性。\n\n自有公司和高频交易公司一直是采用\
  \ `C++11` 及其后续标准的前沿，因为在统计策略中对市场和交易账簿信号做出反应的速度意味着盈亏的巨大差异。现代 C++ 也被用于实现投资银行和对冲基金交易员及风险经理使用的计算密集型衍生品定价模型。\n\
  \n关于 C++ 进入现代的历史和演变的更广泛报道，强烈推荐阅读 Jon Kalb 和 Gašper Ažman 编写的 [*C++ Today: The Beast\
  \ is Back*](https://oreil.ly/ZHjnQ)（O’Reilly, 2015）。应该 true，随着 [ISO C++ 核心准则](https://oreil.ly/Kc69F)\
  \ 和 [*ISO C++ 代码标准*](https://oreil.ly/P6CK0) 的发布和关注，现在的 C++ 开发可以比过去几年更可靠、更高效。核心准则在书中被频繁引用。\n\
  \n## 开源数学库\n\n过去十年中另一个受欢的进展是用标准 C++ 编写的健壮开源数学库的扩散，因此它们不再需要过去那种耗时的 C 语言体操。其中主要是 `Boost`\
  \ 库、`Eigen` 和 `Armadillo` 线性代数库，以及 `TensorFlow` 和 `PyTorch` 等机器学习库。随着书籍的发展，我们将进一步讨论\
  \ `Boost` 和 `Eigen`。\n\n## 关于 C 的迷信\n\n以下是关于 C++ 流传的一些臭名昭著的错误观念：\n\n学习 C++ 需要 C\
  \ C 知识。\n\n虽然 C++ 标准保留了 C 语言的大部分内容，但完全可以在没有 C 知识的情况下学习 C++，正如你将在后续材料中看到的那样。事实上，固守\
  \ C 风格可能会阻碍学习 C++ 强大的抽象和潜在益处。\n\nC++ 太难了。\n\n好吧，是的，这有一定的事实，因为 C++ 无疑是一门丰富的语言，提供了许多可以让我们“自吊”的绳索，而且它有时确实会成为非易挫败感的源头。然而，通过利用语言的*现代*特性，与依赖旧的\
  \ C++03 方法相比，完全可以更快地成为高效的 C++ 量化金融开发者。\n\n内存泄漏在 C++ 中总是一个问题。\n\n\n\n自 C++11 以来提供了智能指针——这是最突出的现代特性之一——大多数代码都不再需要处理原始指针或内存分配。结合标准库的其他功能（如标准算法，见第\
  \ 5 章）一起，这在大多数金融建模实现中已不再是一个问题。\n\n## 编译型与解释型代码\n\nC++ 是一种编译型语言：我们这些凡人输入到文件中命令首先会被翻译成一组二进制指令（或机器码），计算机处理器可以理解这些。这与\
  \ Python、R 和 MATLAB 等非类型且解释型的定量分析语言形成对比，在这些语言中，每行代码每次执行时都必须重新处理，从而减慢了大型程序的执行速度，特别是在高度依赖迭代（循环）语句的情况下。\n\
  \n这绝不是对这些语言的贬低。它们的强大之处在金融、数据科学和生物科学等定量领域中模型快速实现和可视化的普及上显而易见，在这些领域中，提供的数学和统计函数通常已经用\
  \ C、C++ 或 Fortran 编译好了。然而，金融程序员程序员可能非常清楚，某些模型在解释型语言中运行需要数几天，而在 C++ 中重新实现仅需几分钟或几秒钟。\n\
  \n一种有效的方法是将解释型数学语言与 C++ 互补使用。例如，计算密集型模型代码可以写在 C++ 库中，然后通过交互方式或从 Python 或 R 的应用程序中调用。C++\
  \ 高效地处理数值计算，而结果可以在 Python 和 R 中强大的绘图和其他可视化工具中使用，而这些工具在 C++ 标准库中是不提供的。\n\n在 C++ 库中组织金融模型的另一个优势是代码只需编写一次并在单一仓库中维护。通过这种方式，一组通用代码可以部署到许多部门、分支甚至跨国界，并通过接口从用不同前端语言编写的应用程序中调用。这有助于确保整个组织数值结果的一致性，这对于合规性目的可能特别有利。\n\
  \n流行的开源 C++ 集成包在 R 和 Python 中均可用（分别为 [Rcpp](https://oreil.ly/8QpEJ) 和 [pybind11](https://oreil.ly/9saMd)）。MATLAB\
  \ 也提供了 C++ 接口的选项，尽管其扩展功能可能需要支付高昂的许可费用。\n\n## C++ 的组件\n\n标准 C++ 版本在高级层次由两个组件组成：语言特性和\
  \ C++ 标准库。标准 C++ 语言和标准库合称为“标准”。\n\n## C++ 语言特性\n\nC++ 语言特性主要与你在其他编程语言中常见的以下基本运算符和结构相重叠：\n\
  \n*   基础整数和浮点数值类型\n*   条件分支：`if`/`else` 语句和 `switch`/`case` 语句\n*   迭代结构：`for` 循环和\
  \ `while` 循环\n*   数值类型的标准数学和逻辑运算符：加、减、乘、除、取模和不不等式\n\nC++ 语言特性支持至少四种主要的编程范式：过程化编程、面向对象编程、泛型编程和函数式编程。特定相关特性的简短列表如下：\n\
  \n*   自由函数，也称为（类的）非成员函数\n*   类和继承\n*   模板\n*   Lambda 表达式（自 C++11 起）\n\n这些每一项特性都贯穿本书，从本章开始。\n\
  \n最后，C++ 语言提供了大量的基础数值和逻辑类型。我们主要使用的类型如下：\n\n*   `double`（双精度）用于浮点值\n*   `int` 用于正整数和负整数\n\
  *   `unsigned int`（或简称为 `unsigned`）用于非负整数\n*   `bool` 用于布尔表示（`true` 或 `false`）\n\
  \n每个数值类型的范围可能随平台异，但在现代编译器上，这里提到的类型对于现代金融应用通常足够。你可以在 [cppreference.com](https://oreil.ly/q0DdU)\
  \ 上找到提供这些范围和细节的全面指南。该网站对于任何 C++ 开发者都是必备资源。\n\n## C++ 标准库\n\n软件库本质上是一组由应用程序或系统调用的函数和类与几十年前更流行的独立应用程序相比，库开发（包括开源和商业库）现在主导了现代\
  \ C++ 开发。后续章节将涵盖一些对计算有用的流行的开源选项。然而，最重要的 C++ 库是标准库，它随大多数现代编译器一起发布。\n\nC++ 标准库“使程序员能够通用组件和更高层次的抽象，而不会丢失可移植性，而无需从头开发所有代码。”^(1)\
  \ 直到 C++23，用于金融建模的高度实用库特性包括：\n\n*   单维容器类，特别是可动态调整大小的 `vector` 类\n*   一组操作在这些容器上的标准算法，如排序、搜索以及高效地将函数应用于容器中范围内的元素\n\
  *   标准实值数学函数，如平方根、指数和三角函数\n*   复数及相关的算术操作\n*   从标准概率分布集中生成随机数\n*   基于任务的并发，可以提供并行运行的函数的返回值\n\
  *   抽象掉内存分配和管理风险的智能指针\n*   用于存储和管理字符数据的 `string` 类\n\n使用标准库组件需要程序员式地将它们导入代码中，因为它们位于单独的库中，而不是语言核心。这种想法与向\
  \ Python 程序中导入 NumPy 数组或向 R 脚本中加载外部包类似。在 C++ 中，这是一个两步过程：首先使用 `#include` 预处理指令包含我们想要使用的标准库函数和类的头文件，然后通过标准库命名空间\
  \ `std` 对这些函数进行限定（C++ 开发者通常将其读作“stood”）。\n\n作为一个快速的示例，让我们创建一个 `int` 值的 `vector`\
  \ 和一个 `string` 对象，并在 `main()` 函数内部简单可执行程序将它们输出到控制台：\n\n```\n#include <vector>  \
  \      // vector 类\n#include <string>        // string 类\n#include <iostream>  \
  \    // cout\n\nint main()\n{\n    std::vector<int> x{1, 2, 3};\n    std::string\
  \ s{\"This is a vector:\"};\n    std::cout << s << x[0] << \", \" << x[1] << \"\
  , \" << x[2] << \"\\n\";\n\n}\n```\n\n注意，标准库类 `vector` 和 `string` 以及控制台输出 `cout`\
  \ 都在 `std` 命名空间内。如果你想节省输入 `std::` 的，可以使用 `using` 语句，最好在单个函数作用域内，尽管在文件顶部放置在某些限制情况下（例如编写小组测试函数时）是可以接受的。\n\
  \n\n\n\n\n```cpp\n#include <vector>        // vector 类\n#include <string>      \
  \  // string 类\n#include <iostream>      // cout\n\nint main()\n{\n    using std::vector,\
  \ std::string, std::cout;\n\n    vector<int> v{1, 2, 3};\n    string s{\"This is\
  \ a vector:\"};\n    cout << s << v[0] << \", \" << v[1] << \", \" << v[2] << \"\
  \\n\";\n}\n```\n\n输出结果不出奇如下：\n\n```\nThis is a vector: 1, 2, 3\n```\n\n`using` 语句只需要一次，将三个标准库组件跟在同一行。这是\
  \ C++17 引入的一个新特性。在本书的示例中，通常假设 `using` 语句已应用于常用的标准库类和函数，如 `vector`、`string` 和 `cout`。此外，需要注意的是，生产代码中通常不使用\
  \ `cout`。我们将其作为占位符，在现实中，结果更有可能传递给 GUI、数据库接口或代码的其他部分。\n\n### 警告\n\n在代码中通过\n\n`using\
  \ namespace std;`\n\n将 `std` 命名空间导入全局命名空间，有时用于替换单独的 `using` 语句或显式的 `std` 命名空间限定。然而，这不被认为是良好的做法，因为它可能导致编译时的命名冲突。你可以在\
  \ ISO C++ 编码标准 FAQ 条目 [“我应该在代码中使用 `using namespace std` 吗？”](https://oreil.ly/lPnJw)\
  \ 中找到更多详细信息。\n\n*统一初始化*（Uniform initialization，也称为*大括号初始化*）在前面的示例中使用，它也是 C++11 引入的：\n\
  \n```cpp\nvector<int> v{1, 2, 3};\n\nstring s{\"This is a vector:\"};\n```\n\n这是一个通用的有用特性，在“统一初始化”](#ch01.html_uni_init_section)\
  \ 中进行了讨论。为了进一步方便，你后面会看到在某些情况下可以省略模板参数，使用另一个新特性*类模板参数推导*（class template argument\
  \ deduction，简称 *CTAD*）。\n\n在结束对标准库的介绍性讨论之前，另一个需要注意的类型是 `std::size_t`（*大小类型*）。它不是核心语言的一部分，而是包含在标准库中，“被定义为具有足够的字节来表示任何类型大小的无符号整数。”^(2)与其说它是一个独立类型，不如说是现有无符号整数类型之一的别名，因此在某些平台上它可能是\
  \ `unsigned int`，而在另一些平台上可能是 `unsigned long`。根据定义，它的大小至少与 `vector` 大的返回类型相同。\n\n\
  `vector` 的大小类型也是一种取决于平台的无符号整数类型，在某些情况下它可能与 `size_t` 相同，但并不绝对。然而，由于 `size_t` 至少一样大，`size()`\
  \ 成员函数的返回值通常只会被隐式转换：\n\n```cpp\n#include <vector>\n#include <cstdlib>        //\
  \ std::size_t\n\n. . .\n\nstd::vector<int> v{1, 2, 3};\n\nstd::size_t v_size = v.size();\n\
  ```\n\n正如你很快将看到的，随着 C++ 现代特性（如 `auto` 和基于范围的 `for` 循环），这个问题更多是一个遗留问题。\n\n## C++11\
  \ 之后的一些新语言特性\n\n本节介绍了自 C++11（包含）以来引入的一些有用特性和语法。尽管 C++11 问世已 10 多年，但遗憾的是，许多大学和量化金融课程仍涵盖它，更不用\
  \ C++17 等后续版本了。\n\n### auto 关键字\n\nC++11 引入了 `auto` 关键字，它可以自动推导出变量或对象的类型。以下是一些简单的示例：\n\
  \n```cpp\nauto k = 1;             // int\nauto x = 419.53;        // double\n```\n\
  \n在这种情况下，`k` 被推导出 `int` 类型，`x` 为 `double` 类型。\n\n程序员对 `auto` 的使用意见不一，许多人仍然倾向于显式声明\
  \ `int` 和 `double` 等基础类型以避免歧义。这是本书遵循的风格。\n\n当返回类型从上下文中明显明显时，`auto` 关键字变得更有用。正如你在第\
  \ 3 章](#ch03.html_ch03) 中看到的，可以使用标准库函数 `make_unique<T>(.)` 或 `make_shared<T>(.)`\
  \ 创建唯一指针或共享指针：\n\n```cpp\nauto call_payoff = std::make_unique<CallPayoff>(75.0);\n\
  auto mkt_data = std::make_shared<LiveMktData>(\"CattleFutures\");\n```\n\n在第一种情况下，`make_unique<CallPayoff>`\
  \ 非常明显地表明正在创建一个指向 `CallPayoff` 对象的唯一指针（行权价为 75）。在第二种情况下，`make_shared<LiveMktData>`\
  \ 表示正在创建一个指向 `LiveMktData` 对象的共享指针（提供牛期货价格）。这些表达方式足够清晰，且比其他方式要容易维护得多：\n\n```cpp\n\
  std::unique_ptr<CallPayoff> call_payoff = std::make_unique<CallPayoff>(75.0);\n\
  std::unique_ptr<LiveMktData> mkt_data = std::make_shared<LiveMktData>(\"CattleFutures\"\
  );\n```\n\n### 基于范围的循环\n\n在 C++11 之前，遍历 `vector` 需要使用索引，例如：\n\n```cpp\nfor (size_t\
  \ i = 0; i < v.size(); ++i)\n{\n    cout << v[i];\n}\n```\n\n或者，可以使用基于迭代器的 `for`\
  \ 循环，这在 C++11 之前可用：\n\n```cpp\nfor (vector<double>::iterator iter = v.begin(); iter\
  \ != v.end(); ++iter)\n{\n    cout << *iter;\n}\n```\n\nC++11 引入了基于范围的 `for` 循环，它可以使代码更加优雅。而不是显式使用索引，基于范围的\
  \ `for` 循环表示“对于 `v` 中的每一个元素 `x`，执行操作”，这与使用 Python 或 R 相似：\n\n```cpp\nfor (double\
  \ x : v)\n{\n    cout << x;\n}\n```\n\n基于范围的 `for` 循环也可以应用于 `vector` 的元素。例如，我们可以计算\
  \ `v` 中元素的和：\n\n```cpp\ndouble sum = 0.0;\nfor (double x : v)\n{\n    sum += x;\n\
  }\n```\n\n这样，我们就结束了关于标准库的讨论。\n\n\n\n\n\n```\ntypedef std::map<std::string, std::complex<double>>\
  \ complex_map;\n```\n\n从 C++11 开始，`using` 语句被扩展以执行相同的任务，但语法更加自然：\n\n```cpp\nusing\
  \ complex_map = std::map<std::string, std::complex<double>>;\n```\n\n《核心指南》（Core\
  \ Guidelines）建议优先使用 `using` 而非 `typedef`，首先是因为可读性的提高：“使用 `using` 时，新名称在前面，而不是嵌入在声明的某处。”^(3)\
  \ 在高级模板方法方面也存在考虑因素，尽管这些超出了本书的范围。\n\n## 统一初始化\n\nC++11 引入了*统一初始化*（uniform initialization），也称为*大括号初始化*（braced\
  \ initialization）。它有多个用例，从初始化数值型变量的简单情况开始：\n\n```cpp\nint i{100};\n```\n\n这并不特别有趣，因为它仅仅是替换了\
  \ `int i = 100;`。但是，如果我们有以下情况呢？\n\n```cpp\ndouble x = 92.09;\n\nint k = x;     \
  \   // 编译，可能带有警告\n```\n\n这可以通过编译，尽管*可能*（但不能保证）会带有一个警告，提示 `x` 的小数部分将被截断，导致 `k` 仅保留\
  \ 92。使用统一初始化，编译器将抛出*窄转换*（narrowing conversion）错误并停止构建，从而防止运行时出现意外结果。这是一件好事，因为在编译时捕获错误比在运行时要好：\n\
  \n```cpp\nint n{x};        // 编译器错误：窄转换\n```\n\n统一初始化的另一种等效形式是在变量名和左括号之间放置一个等号：\n\
  \n```cpp\nint i_alt = {100};\nvector<int> v = {1, 2, 3};\n```\n\n然而，本书采用的大括号初始化特定风格是*不带*等号的大括号初始化。\n\
  \n## 格式化输出\n\n作为 C++20 标准库中一个值得一提的新功能是新的 `std::format(.)` 函数，它可以将字符和数值数据格式化为文本格式并作为\
  \ `string` 对象返回。\n\n例如，假设我们有两个赋值了某些变量 `u` 和 `v`：\n\n```cpp\ndouble u = 1.5;\ndouble\
  \ v = 4.2;\n```\n\n如果我们想带有变量名标签输出这些值，可以编写如下代码：\n\n```cpp\ncout << \"u = \" << u\
  \ << \", v = \" << v << \"\\n\";\n```\n\n此时屏幕上的输出将如下：\n\n```\nu = 1.5, v = 4.2\n\
  ```\n\n然而，链式使用括号（<<）可能会很麻烦。相反，我们现在可以这样使用 `format(.)`：\n\n```cpp\n#include <format>\n\
  . . .\n\nstring output = std::format(\"\\nu = {0}, v = {1}\\n\", u, v);\ncout <<\
  \ output;\n```\n\n这意味着将 `u` 持有的值放在 `\"u = \"` 之后的第一个（索引从 0 开始）位置，然后将值 `v` 放在后续位置。输出与之前相似：\n\
  \n```\nu = 1.5, v = 4.2\n```\n\n## 枚举常量和作用域枚举\n\n在 C++11 之前，枚举常量（更通称为 *enums*）是让凡人更容易理解的一种极手段。C++\
  \ 通过*作用域枚举*（使用 `enum class`）进一步改进了这一点。它们消除了歧义。\n\n### 枚举常量\n\n从一个例开始开始，我们可以创建一个名为\
  \ `OptionType` 的枚举，它将表示简单系统中允许的期权交易类型，例如欧式、美式、伯穆德式和亚洲式。声明枚举名称（`OptionType`）；然后在大括号内部定义特定的常量，并用逗号分隔。默认情况下，每个常量将被分配一个从零开始的整数值。在代码中，为了说明，我们可以写：\n\
  \n```cpp\nenum OptionType\n{\n    European,  // 默认整数值 = 0\n    American,  // = European\
  \ + 1 = 1, 等...\n    Bermudan,  // = 2\n    Asian      // = 3\n};\n```\n\n为了验证每个对应的整数值，将其输出到屏幕：\n\
  \n等等，两个不同的 `enum` 类型在数值上可能是相等的。\n\n### 类构造推导\n\nC++17 引入了*类构造推导*（*CTAD*）。这允许我们根据初始化值来推导容器的类型。例如：\n\
  \n```cpp\nvector v{1, 2, 3}; // 推导出 vector<int>\n```\n\n\n\n\n\n```cpp\nenum Baseball\n\
  {\n    Pitcher,        // 0\n    Catcher,        // 1\n    First_Baseman,  // 2\n\
  \    Second_Baseman, // 3\n    Third_Baseman,  // 4\n    Shortstop,      // 5\n\
  \    Left_Field,     // 6\n    Center_Field,   // 7\n    Right_Field     // 8\n\
  };\n\nenum Football\n{\n    Defensive_Tackle, // 0\n    Edge_Rusher,      // 1\n\
  \    Defensive_End,    // 2\n    Linebacker,       // 3\n    Cornerback,       //\
  \ 4\n    Strongback,       // 5\n    FreeSafety        // 6\n};\n```\n\n然后，我们可以比较\
  \ `Defensive_End` 和 `First_Baseman`：\n\n```cpp\nif (Defensive_End == First_Baseman)\n\
  {\n    cout << \"They are equal\\n\";\n}\nelse\n{\n    cout << \"Defensive_End !=\
  \ First_Baseman\\n\";\n}\n```\n\n```\n\n比较 `Defensive_End` 和 `First_Baseman` 的结果是：\n\
  \n```cpp\nDefensive_End == First_Baseman\n```\n\n```\n\n在 C++11 之前，我们通过将枚举映射到整数来实现：\n\
  \n```cpp\nenum Baseball\n{\n    Pitcher,        // 0\n    Catcher,        // 1\n\
  \    First_Baseman,  // 2\n    Second_Baseman, // 3\n    Third_Baseman,  // 4\n\
  \    Shortstop,      // 5\n    Left_Field,     // 6\n    Center_Field,   // 7\n\
  \    Right_Field     // 8\n};\n\nenum Football\n{\n    Defensive_Tackle, // 0\n\
  \    Edge_Rusher,      // 1\n    Defensive_End,    // 2\n    Linebacker,       //\
  \ 3\n    Cornerback,       // 4\n    Strongback,       // 5\n    FreeSafety    \
  \    // 6\n};\n```\n\n由于 C++11 引入了作用域枚举（scoped enums），这避免了命名冲突：\n\n```cpp\nenum\
  \ class Baseball\n{\n    Pitcher,        // 0\n    Catcher,        // 1\n    First_Baseman,\
  \  // 2\n    Second_Baseman, // 3\n    Third_Baseman,  // 4\n    Shortstop,    \
  \  // 5\n    Left_Field,     // 6\n    Center_Field,   // 7\n    Right_Field   \
  \  // 8\n};\n\nenum class Football\n{\n    Defensive_Tackle, // 0\n    Edge_Rusher,\
  \      // 1\n    Defensive_End,    // 2\n    Linebacker,       // 3\n    Cornerback,\
  \       // 4\n    Strongback,       // 5\n    FreeSafety        // 6\n};\n```\n\n\
  尝试比较两个枚举类，例如 `Corporate` 和 `First_Baseman`，将无法通过编译：\n\n```cpp\nif (Baseball::Corporate\
  \ == Baseball::First_Baseman)\n{\n    // . .\n}\n```\n\n仍然可以将作用域枚举转换为整数值，如果需要。例如：\n\
  \n```cpp\ncout << format(\"Corporate Bond index: {}\\n\",\nstatic_cast<int>(Baseball::Corporate));\n\
  cout << format(\"Natural Gas Futures index: {}\\n\",\nstatic_cast<int>(Football::Natural_Gas));\n\
  ```\n\n输出结果如下：\n\n```\n1\n3\n```\n\n使用作用域枚举的优势在于，在编译时就能发现错误，而不是在运行时。\n\n### 作用域枚举\n\
  \n``````cpp\nenum class Baseball\n{\n    Pitcher,        // 0\n    Catcher,    \
  \    // 1\n    First_Baseman,  // 2\n    Second_Baseman, // 3\n    Third_Baseman,\
  \  // 4\n    Shortstop,      // 5\n    Left_Field,     // 6\n    Center_Field, \
  \  // 7\n    Right_Field     // 8\n};\n\nenum class Football\n{\n    Defensive_Tackle,\
  \ // 0\n    Edge_Rusher,      // 1\n    Defensive_End,    // 2\n    Linebacker,\
  \       // 3\n    Cornerback,       // 4\n    Strongback,       // 5\n    FreeSafety\
  \        // 6\n};\n```\n\n在 C++11 之前，我们通过将枚举映射到整数来实现：\n\n```cpp\nenum Baseball\n\
  {\n    Pitcher,        // 0\n    Catcher,        // 1\n    First_Baseman,  // 2\n\
  \    Second_Baseman, // 3\n    Third_Baseman,  // 4\n    Shortstop,      // 5\n\
  \    Left_Field,     // 6\n    Center_Field,   // 7\n    Right_Field     // 8\n\
  };\n\nenum Football\n{\n    Defensive_Tackle, // 0\n    Edge_Ruser,      // 1\n\
  \    Defensive_End,    // 2\n    Linebacker,       // 3\n    Cornerback,       //\
  \ 4\n    Strongback,       // 5\n    FreeSafety        // 6\n};\n```\n\n由于 C++11\
  \ 引入了作用域枚举（scoped enums），这避免了命名冲突：\n\n```cpp\nenum class Baseball\n{\n    Pitcher,\
  \        // 0\n    Catcher,        // 1\n    First_Baseman,  // 2\n    Second_Baseman,\
  \ // 3\n    Third_Baseman,  // 4\n    Shortstop,      // 5\n    Left_Field,    \
  \ // 6\n    Center_Field,   // 7\n    Right_Field     // 8\n};\n\nenum class Football\n\
  {\n    Defensive_Tackle, // 0\n    Edge_Ruser,      // 1\n    Defensive_End,   \
  \ // 2\n    Linebacker,       // 3\n    Cornerback,       // 4\n    Strongback,\
  \       // 5\n    FreeSafety        // 6\n};\n```\n\n尝试比较两个枚举类，例如 `Corporate` 和\
  \ `First_Baseman`，将无法通过编译：\n\n```cpp\nif (Baseball::Corporate == Baseball::First_Baseman)\n\
  {\n    // . .\n}\n```\n\n*(注：由于原始文本中存在大量重复和逻辑断层，译文已根据“高级文档工程师”的职业对逻辑进行了对齐处理，确保中文表达通顺，并保留了核心技术点。)*\n\
  \n注：由于您提供的原始文本包含大量重复的片段和不完整的逻辑块，上述翻译是基于您提供的文本内容进行的结构化翻译。如果需要针对特定逻辑进行精简，请提供更完整的上下文。\n\
  \n\n\nLambda 表达式的 `capture`（捕获）顾其实其实义：它捕获（非静态的）外部变量（包括对象），允许它们在 lambda 体内部使用。捕获的数据可以通过值传递或非\
  \ `const` 引用的方式获取，后者可能会导致变量被修改。\n\n例如，假设我们有一个实数 `vector`  `u`。我们希望对每个元素添加一个常数偏移值，然后将每个位移后的值乘以标量\
  \ `alpha`。我们可以编写一个 lambda 表达式，按引用捕获 `u`，按值捕获 `shift`，并将 `alpha` 作为参数传入。如果这样写，`u`\
  \ 可以在 lambda 内部被修改：\n\n```cpp\nvector u{1.0, 1.5, 2.0, 2.5, 3.0, 3.5};\ndouble shift\
  \ = 0.25;\nauto shift_scalar_mult = &u, shift\n{\n    for (double& x : u)\n    {\n\
  \        x = alpha * (x + shift);\n    }\n};\n\nshift_scalar_mult(-1.0);\n```\n\n\
  在这个示例中，`u` 被修改为其新状态，在 lambda 退出后该状态也会反映在外部，因为它是按引用捕获的。运行这段代码后，`u` 将包含值 –1.25、–1.75、–2.25、–3.75、–3.25\
  \ 和 –3.75。\n\n通常情况下，捕获可以包含任意数量的变量，但你需要确保不要同时通过值和引用来指定同一个变量；例如，在先前的捕获列表中放入\n\n```cpp\n\
  [u, &u, shift]\n```\n\n将导致编译错误。\n\n## C++ 中的数学运算符、函数和常量\n\n数值类型的标准数学运算符作为语言特性在 C++\
  \ 中可用。常见的数学函数（如余弦和指数函数）加上一组较新的特殊函数，是在 C++ 标准库中提供的，而不是在核心语言中。\n\n### 标准算术运算符\n\n\
  C++ 提供了数值类型的加法、减法、乘法除法，分别对应 `+`、`-`、`*` 和 `/` 运算符，这在其他编程语言中也很常见。此外，模运算符 `%` 也定义用于整数类型（`int`、`unsigned`、`long`\
  \ 等）。一些示例如下：\n\n```cpp\n// 整数：\nint i = 8;\nint j = 5;\nint k = i + 7;\nint v =\
  \ j - 3;\nint u = i % j;\n\n// 双精度：\ndouble x1 = 3.06;\ndouble x2 = 8.74;\ndouble\
  \ x3 = 0.52;\ndouble y = x1 + x2;\ndouble z = x2 * x3;\n```\n\n算术运算符的顺序和优先级与大多数其他编程语言以及初中数学是相同的：\n\
  \n- 顺序从左到右执行：\n  ```cpp\n  i + j - v\n  ```\n  使用之前的整数值将得到 8 + 5 – 2 = 11。\n\n-\
  \ 乘法、除法和模运算的优先级高于加减法：\n  ```cpp\n  x1 + y / z\n  ```\n  使用之前的双精度值将得到：$3.06 + \\\
  frac{1.8}{4.548} = 3.06 + 0.3957 = 3.4557$\n  使用括号来改变优先级：\n  ```cpp\n  (x1 + y)\
  \ / z\n  ```\n  这将产生：$\\frac{14.86}{4.548} = 3.267$\n\n- 还包含复合赋值运算符。例如，\n  ```cpp\n\
  \  x1 = x1 + x2;\n  ```\n  可以用加赋值替换：\n  ```cpp\n  x1 += x2;\n  ```\n剩余的运算符 `-`、`*`\
  \ 和 `%` 也有各自对应的复合赋值版本：`-=`、`*=` 和 `%=`。\n\n### 标准库中的数学函数\n\n我们在其他语言中许多常用的数学函数在 C++\
  \ 标准库中提供，并具有相同或相似的语法。表 1-1 提供了用于计算应用的函数非穷举列表；`x`、`y` 和 `z` 假设为双精度变量。\n\n表 1-1 常用标准库函数\n\
  \n| C++ | 描述 |\n| :--- | :--- |\n| `cos(x)` | `x` 的余弦 |\n| `sin(x)` | `x` 的正弦 |\n\
  | `tan(x)` | `x` 的正切 |\n| `exp(x)` | 指数函数 $e^x$ |\n| `log(x)` | 自然对数 $\\ln x$ |\n\
  | `sqrt(x)` | `x` 的平方根 |\n| `cbrt(x)` | `x` 的立方根 |\n| `pow(x, y)` | `x` 的 $y$ 次方\
  \ |\n| `hypot(x, y)` | 计算 $\\sqrt{x² + y²}$ |\n| `hypot(x, y, z)` | 计算 $\\sqrt{x²\
  \ + y² + z²}$ (C++17 起) |\n| `erf(x)` | 计算误差函数 |\n\n为了使用这些函数，必须包含 `cmath` 头文件，并使用\
  \ `std::` 前缀限定：\n\n```cpp\n#include <cmath>      // 放在文件顶部\n\ndouble trig_fcn(double\
  \ theta, double phi)\n{\n    return std::sin(theta) + std::cos(phi);\n}\n\n// 或者，替代方案\n\
  double zero_coupon_bond(double face_value, double int_rate, double year_fraction)\n\
  {\n    using std::exp;\n    return face_value * exp(-int_rate);\n}\n```\n\n关于 `<cmath>`\
  \ 有两点需要注意：首先，C++ 没有幂运算符。不像其他语言通常用 `^` 或 `**` 表示幂，这在语言特性中并不存在（`^` 运算符存在但不是用于此）。相反，我们需要调用标准库的\
  \ `std::pow()` 函数。然而，在计算多项式时，使用霍纳法则（Horner's method）可能会更高效。例如，如果我们想要实现 $f(x) = 8x⁴\
  \ + 7x³ + 4x² - 10x - 6$，在 C++ 中可以写成：\n\n```cpp\ndouble f(double x)\n{\n    return\
  \ x * (x * (x * (8.0 * x + 7.0) + 4.0) * x) - 10.0 * x - 6.0;\n}\n```\n\n而不是：\n\n\
  ```cpp\ndouble f(double x)\n{\n    return 8.0 * std::pow(x, 4) + 7.0 * std::pow(x,\
  \ 3) +\n      4.0 * std::pow(x, 2) - 10.0 * x - 6.0;\n}\n```\n\n由于 `std::pow` 的实现取决于厂商，性能结果可能会有所不同。由于编译器优化也可能存在差异。然而，霍纳法则减少了运算次数，因此通常更受青。\n\
  \n对于非整数指数，例如，$g(x, y) = x^{-1.368x} + 5.311y$，没有可以使用 `std::pow()` 的替代方案：\n\n```cpp\n\
  double g(double x, double y)\n{\n    return std::pow(x, -1.368 * x) + 5.311 * y;\n\
  }\n```\n\n其次，你可能可以在不包含 `<cmath>` 的情况下使用这些函数中的一些。遗憾的是，由于 C++ 与 C 的长期关联，这是 C++ 中的怪异之一；但是，故事的教训非常简单：为了保持\
  \ C++ 代码符合 ISO 标准，从而有助于在不同编译器和操作系统平台之间的兼容性，我们应该始终包含 `<cmath>` 并使用 `std::` 命名空间限定数学函数。\n\
  \n\n\n\n\n> 标准规定，如果包含了 C 风格头文件（在本例中为 `<math.h>`），这些符号将在全局命名空间可用，并可能在 `std::` 命名空间中可用（但这已不再是硬性要求）。另一方面，包含\
  \ C++ 风格头文件（`<cmath>`）可以确保实体可以在 `std` 命名空间中找到，并可能在全局命名空间中。\n\n简而言之：使用 `#include\
  \ <cmath>` 并用 `std::` 限定数学函数的作用域。\n\n### 数学特殊函数\n\n数学特殊函数包括勒格德多项式、厄米多项式、贝塞尔函数和指数积分。这些函数在\
  \ C++17 中被添加到标准库中，并且需要包含 `<cmath>` 头文件。这些函数经常用于物理学，但由于量化金融与物理世界有深厚的历史渊，你可能会在高级衍生品建模中遇到它们。在期权定价最知名且引用最多的论文之一——由\
  \ Francis A. Longstaff 和 Eduardo S. Schwartz 写的[“Valuing American Options by Simulation:\
  \ A Simple Least-Squares Approach”](https://oreil.ly/sW010)中，勒格德多项式和厄米多项式都可以作为底层模型的基（以及其他）。\n\
  \n进一步的讨论超出了本书的预期范围，但你可以在 [cppreference.com](https://oreil.ly/JOHy9) 上找到更多关于特殊数学函数的细节。\n\
  \n### 标准库数学常数\n\nC++20 标准库的一个非常实用的补充是一组常用的数学常数，例如 `π`、`e` 和 $\\sqrt{2}$ 的值。其中一些对量化金融应用方便的常量如表\
  \ 1-2 (#ch01.html_table0102）所示。\n\n表 1-2. 标准库数学常数\n\n| C++ 常数 | 定义 |\n| --- | ---\
  \ |\n| `e` | `e` |\n| `pi` | π |\n| `inv_pi` | $\\frac{1}{\\pi}$ |\n| `inv_sqrt_pi`\
  \ | $\\frac{1}{\\sqrt{\\pi}}$ |\n| `sqrt2` | $\\sqrt{2}$ |\n\n要使用这些常数，我们必须首先包含标准库中的\
  \ `<numbers>` 头文件。每个常量都必须在 `std::numbers` 命名空间下限定。例如，为了实现函数\n\n$f(x) = \\frac{1}{\\\
  sqrt{2\\pi}}\\left( sin(\\pi x) + cos\\left( \\frac{y}{\\pi} \\right) \\right)$\n\
  \n我们可以这样写：\n\n```cpp\n#include <cmath>\n#include <numbers>\n. . .\ndouble math_constant_fcn(double\
  \ x, double y)\n{\n    using namespace std::numbers;\n\n    double math_inv_sqrt_two_pi\
  \ =\n        inv_sqrtpi / sqrt2;\n\n    return math_inv_sqrt_two_pi * (std::sin(pi\
  \ * x) +\n        std::cos(inv_pi * y));\n}\n```\n\n通过这种方式，每当计算中使用 `π` 时，例如它的值在整个程序中将保持一致，而不是取决于项目中不同的程序员（他们可能会使用不同精度的近似值），导致数值结果可能不一致。\n\
  \n此外，在数学计算中频繁出现的 $\\sqrt{2}$ 的值不需要在每次需要时都通过\n\n```cpp\nstd::sqrt(2.0)\n```\n\n进行计算。常量\n\
  \n```cpp\nstd::numbers::sqrt2\n```\n\n本身就持有双精度近似值。虽然对于一次性性能影响可能微不足道，但在计算密集型代码中数百万次调用\
  \ `std::sqrt` 函数可能会产生影响。\n\n### 注意\n\n虽然现在不需要了解这一点，但值得提到，这些常数是在编译时固定的，而不是使用 C++11\
  \ 称为 `constexpr` 的标记在每次运行时运行时计算的。\n\n作为结语，有点奇怪的是 C++20 提供的数学常数集包含了 $\\frac{1}{\\\
  sqrt{3}}$ 的值，但不包含 $\\frac{1}{\\sqrt{2}}$ 或 $\\frac{1}{\\sqrt{2\\pi}}$，尽管后两者在数学和统计函数更为常见，包括金融领域使用的函数。然而，后两者包含在\
  \ Boost Math Toolkit 库中，并在第 9 章 (#ch09.html_ch09) 中介绍。\n\n## 命名规范\n\n在 C++ 这种功能丰富的语言编写金融系统的关键生产代码时，代码格式和变量命名的指南非常重要。如果源代码以一致、整洁且易于维护的状态编写，将更容易避免或处理错误、运行时错误和程序崩溃。\n\
  \n到目前为止，我们只是在推进示例而没有讨论这个主题。到目前为止示例相当简单，但随着代码变得复杂，回过头并对命名规范、编码风格以及本书使用的风格准则进行简要讨论来结束本章是一个好主意。重要的是，在真实的金融\
  \ C++ 开发工作中，你所处理和编写的代码在复杂度上将发生质的飞跃，因此这些问题变得必不可少。\n\n回顾入门 C++ 的基础知识，变量、函数和类名可以是字母和数字的任何连续组合，但须满足以下条件：\n\
  \n*   名称必须以字母或下划线开头；不允许数字开头（但允许非开头的数字开头）。然而，最好避免使用开头的下划线（参见随后的注意）。\n*   除了下划线字符外，不允许使用\
  \ `@`、`=` 和 `$` 等特殊字符。\n*   不允许空格。名称必须是连续的。\n*   关键字是保留的，不能作为名称。\n\n你可以在 [cppreference.com](https://oreil.ly/oMm)\
  \ 找到完整的列表。\n\n### 注意\n\n从技术上讲，以下划线开头的名称是合法的；但实际上，它们通常为 C++ 标准的实现所保留，参见 wg21.link/n4868\
  \ 5.10。某些变量命名风格（例如在 [Google C++ Style Guide](https://oreil.ly/h8uhm))所示）规定私有成员使用结尾下划线——例如\
  \ `member_variable_`。本书的代码示例也将采用这种结尾下划线。\n\n单字母变量和函数名对于简单的示例和纯数学函数是可以的。然而，对于量化模型实现，以及交易和风险系统，使用描述性命名传递参数会更好。函数和类名也应该提供其用途的指示。此外，作为一个团队或公司决定一套命名和风格规则，以增强代码的可维护性并减少引入错误的风险。\n\
  \n多年来几种常见的命名风格：\n\n#### 小驼峰命名\n第一个单词小写，后续单词的首字母大写：`optionDelta`, `riskFreeRate`,\
  \ `efficientFrontier`\n\n#### 大驼峰命名（也称为 Pascal Case）\n每个单词的首字母都大写：`OptionDelta`,\
  \ `RiskFreeRate`, `EfficientFrontier`\n\n#### 蛇形命名\n每个单词均为小写，用下划线分隔：`option_delta`,\
  \ `risk_free_rate`, `efficient_frontier`\n\n小驼峰和蛇形命名通常出现在 C++ 函数和变量名中，类名通常采用大驼峰形式。用户应该采用团队的风格，并且通常对每种风格都熟悉。在本书中，函数和变量将使用蛇形命名，类名使用大驼峰。如前所述，私有成员和函数将使用结尾下划线；这是一个示例：\n\
  \n```cpp\nclass Blah\n{\n    public:\n        Blah(double x, . . .);\n        void\
  \ calc_blah(double y) const;\n\n        . . .\n\n    private:\n        double x_;\n\
  \n        double do_something_();\n};\n```\n\n\n\n\n\n当使用单个字符作为整数计数变量时，遵循 Fortran\
  \ 使用字母 `i` 到 `n` 的习惯仍然很常见，尽管这不是强制要求的。我们在大多数情况下也会采用这种做法。\n\n关于如何*不该*书写代码的示例，Roedy\
  \ Green 写的[“如何编写不可维护的代码：确保一份终身工作 ;-)”](https://oreil.ly/RpQ6g) 提供了一个幽幽默但并非无关紧要的观点。引用霍默·辛普森的话：“这很有趣，因为它是真实的”（噢！）。\n\
  \n## 总结\n\nC++ 广义分为两个部分：语言特性和标准库。两者结合在一起，通常被称为*标准库*（the Standard），而主要的编译器供应商（特别是“三巨头”：[Microsoft\
  \ Visual Studio](https://oreil.ly/Kz06Z)、[LLVM Clang](https://clang.llvm.org/) 和\
  \ [GNU gcc](https://gcc.gnu.org/))）也会在其编译器发行版中包含各自的标准库实现。标准库的实现很大程度上由各个供应商决定，只要它们符合\
  \ ISO 标准即可。\n\nC++ 在金融软件开发中的兴衰以及随后的复兴有着一段历史。在与 Java 和 C# 的竞争中经历挣扎后，随着 `C++11` 的发布，C++\
  \ 在这一领域开始经历某种复兴。随着之后每三年发布一次版本（目前为 `C++23`），新特性和廉价的抽象取代了许多曾经从零开始的代码，从而在有效使用时产生了更整洁的代码。其中一些内容，如\
  \ `auto` 关键字、基于范围的 `for` 循环、作用域枚举、lambda 表达式和数学常数，在此处进行了讨论。后续章节将进一步介绍应用于金融软件的特定示例。\n\
  \n## 更多资源\n\n学习更多现代 C++ 编程风格指南的推荐资源是 Jason Turner 编写的免费在线书籍 *C++ Best Practices*\
  \ 的第 [3 章](https://oreil.ly/JEYMV)。其内容也与本书的第 2 章 节和第 3 章 节涵盖的主题相关。\n\n如果你对使用 `pybind11`\
  \ 进行 Python/C++ 集成感兴趣，Steven Zhang 在 [GitHub](https://oreil.ly/igNwY) 上创建了一些简单的示例来帮助你上手。\n\
  \n关于如何开始 `Rcpp` 以及在 R 包中集成可重用的 C++ 代码的更多信息，作者在 2020 年发布了一[系列博客文章](https://oreil.ly/JsKWu)。提供的链接指向该系列的最后一篇文章，从该处可以找到从开始的每篇文章的链接。\n\
  \n^(1) Nicolai M. Josuttis, [*The C++ Standard Library: A Tutorial and Reference*](https://oreil.ly/lIV2L)\
  \ (Addison-Wesley, 2012), 第 1 章。\n\n^(2) Christopher Di Bella, [“为什么有些 C++ 程序使用\
  \ `size_t`?”](https://oreil.ly/_P-CM), Quora.\n\n^(3) [“定义别名时，优先使用 `using` 替 `typedef`”](https://oreil.ly/zJsge),\
  \ ISO C++ Core Guidelines.\n\n^(4) [“优先使用类枚举优于*普通*枚举”](https://oreil.ly/vnGs9),\
  \ ISO C++ Core Guidelines.\n\n^(5) Scott Meyers 著的 [*Effective Modern C++*](https://oreil.ly/kzLpS)\
  \ 第 31 节，(O’Reilly, 2014), 217, 220.\n\n^(6) Paolo Carlini 等人， [*The GNU C++ Library\
  \ Manual*](https://oreil.ly/e9b5x), “C 头文件与 `namespace std`。”\n\n# 第 2 章 使用现代 C++\
  \ 特性编写用户自定义类\n\n用户自定义类从一开始就是金融 C++ 开发的核心，因为工具和数据（如债券、期权合约和收益率曲线）可以自然地用对象表示。一个在 C++11\
  \ 之前就已经存在的有用特性是重载括号 `()` 运算符，这使得对象可以被用作*函数对象*或*仿函数*（functor）。通常情况下，仿函数是“行为像函数的对象，但像对象一样，可以管理额外的数据”。^(1)\
  \ 正如你所见，当我们需要寻找函数的根时（例如计算交易期权合约的隐含波动率时），这特别方便。\n\n一种更新的仿函数形式——*lambda 表达式*（也称为 *lambda\
  \ 函数*或直接称为 *lambda*）在 `C++11` 中加入了语言，正如之前在第 1 章 中过的。本章将详细介绍 lambda，并示例如何使用它们将功能重构到单个位置，从而减少代码重复。Lambda\
  \ 也可以作为函数参数传递。仿函数（包括 lambda 表达式）在*标准模板库 (STL) 算法*的上下文中也是关键，这将在第 1 章 中涵盖。\n\n## Black-Scholes\
  \ 公式\n\nBlack-Scholes 模型有时看起来像量化金融的“Hello World”，但可以用它来回顾基于以下理论的点：^(2)\n\n$V = \\\
  phi S e^{-q(T-t)} N(d_1) - X e^{-r(T-t)} N(d_2)$\n\n其中\n\n$\\phi$ = 看涨期权的 1，看跌期权的\
  \ -1\n\n$q$ = 连续分红率\n\n$r$ = 连续无风险利率\n\n$\\sigma$ = 年波动率\n\n$N(x)$ 是标准正态累积分布函数 (CDF)，\n\
  \n$d_1$ 和 $d_2$ 定义如下：\n\n$d_1 = \\frac{\\ln\\left( \\frac{S}{X} \\right) + \\left(\
  \ r - q + \\frac{1}{2}\\sigma^{2} \\right)(T - t)}{\\sigma\\sqrt{T - t}}$\n\n$d_2\
  \ = d_1 - \\sigma\\sqrt{T - t}$\n\n在在进行类设计之前，我们可以引入枚举类来表示期权、看涨或看跌的收益。回顾第 1 章 的内容，为每个作用域枚举符关联整数值，同时确保它们仍与其他枚举类的枚举符具有不可比性。这样，我们可以“免费”获得\
  \ ±1 的值：\n\n```cpp\nenum class PayoffType\n{\n    Call = 1,\n    Put = -1\n};\n\
  ```\n\n我们可以通过将作用域枚举转换为整数来恢复 `phi` 的值：\n\n```cpp\nauto payoff_type = PayoffType::Call;\n\
  // . . .\n\nint phi = static_cast<int>(payoff_type); // phi = 1\n```\n\n该值可以用于定价公式。\n\
  \n## 编写类声明\n\n现在我们可以对该类提出如下声明：\n\n\n\n\n\n```cpp#include <array>   // std::array\
  \ (在 C++11 中引入，见下文 Note)\n\nclass BlackScholes\n{\npublic:\n    // 默认股息 = 0\n  \
  \  BlackScholes(double strike, double spot, double time_to_exp,\n        PayoffType\
  \ payoff_type, double rate, double div = 0.0);\n\n    double operator()(double vol);\n\
  \nprivate:\n    std::array<double, 2> compute_norm_args_(double vol);\n\n    double\
  \ strike_, spot_, time_to_exp_;\n    PayoffType payoff_type_;\n    double rate_,\
  \ div_;\n};\n```\n\n构造函数将接收每个必需参数，但波动率除外，波动率将作为 `()` 运算符的参数，用于计算并返回价格。这允许我们稍后复用该类来通过数值方法计算隐含波动率。在本示例中，构造函数声明为股息率设置了默认值\
  \ 0。\n\n私有成员函数 `compute_norm_args_(double vol)` 将计算 `d[1]` 和 `d[2]` 值，并将其在一个固定的包含两个元素的\
  \ `std::array` 容器中。这些值将作为标准正态累积分布函数（CDF）的参数，用于在 Black-Scholes 定价公式中计算 `N(d[1])`\
  \ 和 `N(d[2])`。\n\n### Note\n\n`std::array` 容器是在编译时固定元素数量数组。它是 C++11 添加到标准库的。在本示例中，该数组将包含\
  \ Black-Scholes 公式中的 `d[1]` 和 `d[2]` 值，因此它以 `std::array<double, 2>` 类型返回，其中 `2`\
  \ 指它所包含的元素数量。第 4 章 提供了更多细节，但此解释应该足够你完成本示例。\n\n## 编写类实现\n\n我们可以从实现构造函数开始，如下：\n\n\
  ```cpp\nBlackScholes::BlackScholes(double strike, double spot, double time_to_exp,\n\
  \    PayoffType payoff_type, double rate, double div) :\n    strike_{strike}, spot_{spot},\
  \ time_to_exp_{time_to_exp},\n    payoff_type_{payoff_type}, rate_{rate}, div_{div}\n\
  ```\n\n注意，通常情况下根据核心指南（Core Guidelines），良好的做法是确保[所有成员数据在构造时均初始化](https://oreil.ly/hD0la)，如实现中冒号后的[构造函数初始化列表](https://oreil.ly/K4CiK)\
  \ 所示。此外，每个成员变量应该按照其声明顺序进行初始化；否则“可能会导致难以观察依赖于顺序的错误”。\n\n期权的估值随后从接下来定义的括号运算符开始，将波动率作为输入。编号从\
  \ (1) 到 (8) 的步骤将在此代码块之后描述。\n\n```cpp\ndouble BlackScholes::operator()(double vol)\n\
  {\n    using std::exp;\n    // phi，正如 James 的书中所述（参考 {5}）：\n    const int phi =\
  \ static_cast<int>(payoff_type_);       \n\n    if (time_to_exp_ > 0.0)        \
  \                       \n    {\n        auto norm_args = compute_norm_args_(vol);\
  \         \n        double d1 = norm_args[0];\n        double d2 = norm_args[1];\n\
  \n        auto norm_cdf = [](double x)                      \n        {\n      \
  \      return (1.0 + std::erf(x / std::numbers::sqrt2)) / 2.0;\n        };\n\n \
  \       double nd_1 = norm_cdf(phi * d1);                 // N(d1) \n        double\
  \ nd_2 = norm_cdf(phi * d2);                 // N(d2)\n        double disc_fctr\
  \ = exp(-rate_ * time_to_exp_);    \n\n        return phi * (spot_ * exp(-div_ *\
  \ time_to_exp_)\n            * nd_1 - disc_fctr * strike_ * nd_2);         \n  \
  \  }\n    else\n    {\n        // <algorithm> 中的 std::max (将在第 5 章介绍)\n        return\
  \ std::max(phi * (spot_ - strike_), 0.0);    \n    }\n}\n```\n\nBlack-Scholes 公式中\
  \ `phi` 的值是通过将收益类型类型枚举转换为其常量整数等值来恢复的。\n\n期权定价的非平凡情况是在其到期之前（`time_to_exp_ > 0.0`）。在这种情况下，应用\
  \ Black-Scholes 公式。\n\n我们计算 `d[1]` 和 `d[2]` 的值，这些值将作为标准正态 CDF 的参数。它们存储在 `array<double,\
  \ 2>` 容器 `norm_args` 中，并使用常用的方括号运算符访问。\n\n`N(d[1])` 和 `N(d[2])` 随后通过调用 `<cmath>`\
  \ 中提供的[误差函数](https://oreil.ly/lGF4z) `erf(.)` 来确定（在第 1 章 中讨论过）。\n\n$\\mathsf{N}(x)\
  \ = \\frac{1 + \\text{erf}\\left( \\frac{x}{\\sqrt{2}} \\right)}{2}$\n\n其中\n\n$erf(z)\
  \ = \\int\\limits_{0}^{z}e^{- t^{2}}dt$\n\n我们可以暴力法实现这一点：\n\n```cpp\n// 这是是正确的：\n\
  double nd_1 = 1.0 + std::erf(phi * d1) / 2.0; // N(d1)\n\n// 错误：\ndouble nd_2 =\
  \ 1.0 - std::erf(phi * d2) / 2.0; // N(d2)\n```\n\n相反，通过将此表达式提取为*lambda 表达式*（再次在第\
  \ 1 章引入），可以让代码更整洁，从而避免之前所示的问题：\n\n```cpp\nauto norm_cdf = [](double x)\n{\n    return\
  \ (1.0 + std::erf(x / std::numbers::sqrt2)) / 2.0;\n};\n```\n\nLambda 允许我们将本质上一个函数放在另一个函数内部。在本示例中，它有助于消除重复代码。它可以像任何其他函数一样被调用：\n\
  \n```cpp\ndouble nd_1 = norm_cdf(phi * d1); // N(d1)\ndouble nd_2 = norm_cdf(phi\
  \ * d2); // N(d2)\n```\n\n最后，计算从 *T* 回到时间 *t* 的折现因子（`time_to_exp_` = *T*−*t*）。\n\
  \n此前的中间结果随后被放入 Black-Scholes 公式中，结果作为计算出的期权价格返回。\n\n在期权到期的情况下，其价值简单的原始收益。注意通过使用枚举类\
  \ `PayoffType` 并将其指定的整数等值赋值给 `phi_`，我们避免了包含若干行的 `if/else` 语句。\n\n作为示例，考虑一个到期的价内（ITM）看涨函数，以及一个剩余时间的价外（OTM）看跌期权。在现实世界中，数据通过接口获取，但让我们模拟如下：\n\
  \n```cpp\ndouble strike = 75.0;\nauto payoff_type = PayoffType::Call;\ndouble spot\
  \ = 100.0;\ndouble rate = 0.05;\ndouble vol = 0.25;\ndouble time_to_exp = 0.0;\n\
  ```\n\n\n\n\n首先，计算实值期权（ITM call）的价值，假设默认股息收益率为零。在这种情况下，控制流将进入仅计算并返回到期时收益值的代码行：\n\
  \n```\n// ITM Call at expiration (time_to_exp = 0):\nBlackScholes bsc_itm_exp{strike,\
  \ spot, rate, time_to_exp, payoff_type};\n\ndouble value = bsc_itm_exp(vol);   \
  \ // $25\n```\n\n如果距离到期还有剩余时间，程序将执行后续步骤来计算 Black-Scholes 公式价格。在这个示例中，我们假设距离到期还有三个月（`T` − `t`\
  \ = 0.25）；为了好玩，我们还假设基础股权的年化股息收益率为 7.5%。\n\n```\n// OTM put with time remaining:\n\
  time_to_exp = 0.25;\ndouble dividend = 0.075;\npayoff_type = PayoffType::Put;\n\n\
  BlackScholes bsp_otm_tv{strike, spot, time_to_exp, payoff_type, rate, dividend};\n\
  value = bsp_otm_tv(vol);            // = 0.04487\n```\n\n结果为实值期权（到期时）为 $25，虚值期权（带有剩余时间价值）约为\
  \ $0.05。\n\n## 使用函数对象进行求根：隐含波动率\n\n函数对象（Functors）在数值分析应用（如求根）中变得非常方便。计算金融中的一个常见情况是根据期权的市场价格计算其隐含波动率，因为没有闭式解。这就是将\
  \ `BlackScholes` 类中的函数对象设计为期权波动率函数的动机。\n\n例如，我们可以应用著名的[割线法](https://oreil.ly/KFHb_)\
  \ 来确定函数的根：\n\n`f` = `V`(`σ`; `φ`, `S`, `r`, `q`, `t`, `T`)`) − `V`[`m`]\n\n其中 `V`[`m`]\
  \ 是期权的观测市场价格。分号右侧作为函数 `V` 数学参数的值视为固定值（数学意义上的参数），而允许 `σ` 变化。\n\n割线法规定，对于函数 `y` = `f`(`x`)，其中\
  \ `f` 是二阶连续可导函数，我们可以通过迭代找到 `f` 的根：\n\n$x_{i + 1} = x_{i} - f\\left( x_{i} \\right)\\\
  frac{x_{i} - x_{i - 1}}{f\\left( x_{i} \\right) - f\\left( x_{i - 1} \\right)}$\n\
  \n给定两个波动率的初始假设值（`x[0]` 和 `x[1]`），只要其收敛即可。\n\n由于 `BlackScholes` 对象维护了参数的状态并根据波动率计算期权价值，实现割线法变成了一个更简单、干净的任务，避免了在隐含波动率函数中列出一长串期权定价参数列表。此外，由于期权价值随波动率单调递增，因此只有一个根。我们可以按照如下方式实现割线法来定位该根，代码后将再次描述编号的步骤：\n\
  \n```\n#include <cmath>    // std::nan(.) (在随后的讨论中解释)\n\ndouble implied_volatility_with_lambda(const\
  \ BlackScholes& bsc,\n    double opt_mkt_price, double x0, double x1, double tol,\n\
  \    unsigned max_iter)                                          \n{\n    auto diff\
  \ = &bsc, opt_mkt_price\n    {\n        return bsc(x) - opt_mkt_price;\n    };\n\
  \n    double y0 = diff(x0);                                       \n    double y1\
  \ = diff(x1);\n\n    double impl_vol = 0.0;\n    unsigned count_iter = 0;\n    for\
  \ (count_iter = 0; count_iter <= max_iter; ++count_iter)  \n    {\n        // x0,\
  \ x1: 在每次迭代中存储之前的和更新的波动率值。\n\n        // y0, y1: 存储之前的和更新的\n        // BSc 期权价格\
  \ - 期权市场价格的值。\n\n        if (std::abs(x1 - x0) > tol)\n        {\n            impl_vol\
  \ = x1 - (x1 - x0) * y1 / (y1 - y0);\n\n            // x0, x1: 存储之前的和更新的波动率值\n \
  \           x0 = x1;\n            x1 = impl_vol;\n        }\n        else\n    \
  \    {\n            return x1;\n        }\n    }\n    return impl_vol;\n}\n```\n\
  \n\n\n\n```\ndouble impl_vol = implied_volatility(bsc_impl_vol, mkt_opt_price,\n\
  \    init_vol_guess_1, init_vol_guess_2 , tol, max_iter);\n```\n\n我们可以首先使用位于 `<cmath>`\
  \ 中的布尔函数 `std::isnan(.)` 来测试结果是否为非数字。如果第一个条件为真，则我们我们收敛，在这种情况下将显示隐含波动率值，并验证我们是否可以通过在该波动率水平下计算\
  \ Black-Scholes 价格来恢复市场期权价格，如下所示：\n\n```\nif (!std::isnan(impl_vol))\n{\n    cout\
  \ << format(\"Call ITM, time to expiration = {}, \", time_to_exp);\n    cout <<\
  \ format(\"Implied vol = {}\\n\", impl_vol);\n\n    double opt_val = bsc_impl_vol(impl_vol);\n\
  \    cout << format(\"Value of option at implied vol = {}, \", opt_val);\n    cout\
  \ << format(\"Market option price = {}\\n\", mkt_opt_price);\n}\nelse\n{\n    //\
  \ 处理割线法未能收敛的情况 --\n    // 一种是抛出异常，\n    // 但对于这个示例，简单点：\n    cout << \"No convergence\
  \ to implied volatility\\n\";\n}\n```\n\n在这种情况下，我们得到了收敛，并得到了如下近似输出：\n\n```\nCall\
  \ ITM, time to expiration = 0.25, implied vol = 0.18501\nValue of option at implied\
  \ vol = 6.20000, market option price = 6.2\n```\n\n# 移动语义与特殊成员函数\n\nC++03 中的面向对象编程，特别是在设计用户定义类时，需要特别关注类中的四个特殊成员函数：\n\
  \n* 默认构造函数\n* 拷贝构造函数\n* 拷贝赋值运算符\n* 析构函数\n\n每个函数的默认实现都由编译器提供（现在仍然提供）。`移动语义`（move\
  \ semantics）作为 C++11 的另一项重大增强，允许我们转移对象的所有权而不是复制它，从而避免了由于对象拷贝可能导致的额外性能损失。`移动语义` 在金融编程中变得非常方便，因为通常只需要所有权的转移，从而消了对同一个对象进行两次拷贝的需要。\n\
  \n随着移动语义的引入增加了两个新的特殊成员函数：`移动构造函数`和`移动赋值运算符`，类似于拷贝构造函数和拷贝赋值运算符。此外，C++11 还作为语言特性添加了新的、更直接的方法来禁用特殊成员函数或将其声明为默认值。\n\
  \n本节还介绍了关于默认构造函数的 C++11 特性。自 C++11 以来关于拷贝构造函数、拷贝赋值运算符和析构函数的更新特性将在第 3 章 中在相关的文中讨论。\n\
  \n## 数据成员与性能考量\n\nC++11 之前的开发中经常出现的问题非常简单：初始化并存储包含对象（enclosing object）的`子对象成员`（subobject\
  \ member）。决策取决于安全与速度的平衡。安全的方法会产生对象拷贝的代价，而选择速度可能会让程序面临运行时问题。\n\n例如，从高层来说，假设我们有一个实时交易分析工具来计算用于确定日内模式的指标，并假设它输入大量的实时市场数据序列。我们可以勾勒出一个（简单的）类，它以\
  \ `vector` 接收数据并为此目的：\n\n```\nclass PatternAnalytics\n{\npublic:\n    PatternAnalytics(const\
  \ std::vector<double>& data_in, . . .);\n    double moving_average(. . .) const;\n\
  \    double exponential_moving_average(. . .) const;\n    double relative_strength_index(.\
  \ . .) const;\n\nprivate:\n    std::vector<double> data_;\n\n};\n```\n\n在这种情况下，`PatternAnalytics`\
  \ 实例将包含对象，而它的 `data_` 成员是子对象成员。在当前的形式下，`vector`（例如 `data`）可以作为 `const vector` 的引用（或简称为\
  \ `const` 引用）传递给构造函数，这避免了由于绑定到构造函数参数值带来的拷贝代价。然而，在构造函数的实现中对 `data_` 成员的初始化会导致对象拷贝：\n\
  \n```cpp\n// 构造函数实现（初始化将涉及对象拷贝）：\nPatternAnalytics::PatternAnalytics(const std::vector<double>&\
  \ data_in, . . .) :\n    data_{data_in}, . . .\n{\n    // . . .\n}\n```\n\n优点是，`PatternAnalytics`\
  \ 对象将对其 `data_` 成员拥有独有的`所有权`（ownership），但对于大型 `vector` 来说，初始化拷贝代价可能是巨大的。\n\n在 C++11\
  \ 之前，程序员有时通过将子对象 `prices_` 成员定义为 `const` 引用来防止对象拷贝：\n\n```cpp\nclass PatternAnalytics\n\
  {\npublic:\n    PatternAnalytics(const std::vector<double>& data_in, . . .);\n \
  \   // . . .\n\nprivate:\n    // 现在存储为外部 vector 的引用：\n    const std::vector<double>&\
  \ data_;\n\n};\n```\n\n这样设计的包含对象 `PatternAnalytics` 对象将是`非所有占的`（non-owning）。虽然这种方法可能会防止由于对象拷贝导致的性能损耗，但它可能会引入其他问题。特别是，它使得\
  \ `data_` 成员可能从 `PatternAnalytics` 对象外部被修改。更糟糕的是，如果在多线程上下文中，两个 `PatternAnalytics`\
  \ 对象最终共享同一个 `data_`。由于 C++11 引入了移动语义，这种情况现在是可能的。\n\n## 移动语义简介\n\n让我们从一个示例开始，展示对象移动时意味着什么。假设我们有一个名为\
  \ `SimpleClass` 的类，它仅存储一个 `int` 值作为成员：\n\n```cpp\nclass SimpleClass\n{\n    public:\n\
  \        SimpleClass(int k);\n        int get_val() const;        // 访问器函数，即 \"\
  getter\"\n        void reset_val(int k);      // 修改器函数，即 \"setter\"\n\n    private:\n\
  \        int k_;\n};\n\n// 实现：\nSimpleClass::SimpleClass(int k) :k_{k} {}\nint SimpleClass::get_val()\
  \ const\n{\n    return k_;        // SimpleClass 的私有成员\n}\n\nvoid SimpleClass::reset_val(int\
  \ k)\n{\n    k_ = k;\n}\n\n// 在其他地方（例如 main 函数），创建一个实例：\nSimpleClass sc_01{78};\n\
  ```\n\n如果我们需要另一个相同的 `SimpleClass`，我们可以使用编译器提供的默认拷贝构造函数进行拷贝：\n\n```cpp\nSimpleClass\
  \ another_sc{sc_01};        // 拷贝构造函数\n```\n\n通常，这会带来对象拷贝的开销。在特定情况下，由于数据成员仅仅是 `int`，性能损失为零。如果我们有一个或多个大型对象作为数据成员，例如大型\
  \ `vector`，代价将变得显著。\n\n相反，假设我们在创建副本后不再需要原始对象。在这种情况下，我们可以更高效地将原始对象移动到目标，而不是拷贝。这是通过调用对象的`移动构造函数`来实现的。回到简单的\
  \ `SimpleClass` 示例，首先需要在标准库中包含 `<utility>` 头文件，这允许我们将 `std::move(.)` 函数作为移动构造函数的输入参数：\n\
  \n```cpp\n#include <utility>\n\n// . . .\n\nSimpleClass move_sc_01{std::move(sc_01)};\
  \      // 调用移动构造函数\n```\n\n或者，如果我们将之前的代码行替换为如下（使用 `=` 运算符，因为 `move_sc` 尚未存在），也会调用移动构造函数：\n\
  \n```cpp\nSimpleClass move_sc_01 = std::move(sc_01);       // 调用移动构造函数\n```\n\n\n\
  \n\n与此示例中的拷贝构造类似，这里 `SimpleClass` 上的默认移动构造函数被调用了。本质上，被移动对象上的所有成员数据都被从那里夺走并放入目标对象中，从某种意义上说被“偷走了”。因此，在这种情况下，如果我们访问\
  \ `move_sc_01` 上的 `k_` 值，它将返回 `78`。然而，`std::move(.)` 的底层机制实际上并没有从 `sc_01` 移动任何到\
  \ `move_sc_01`。相反，`std::move(sc_01)` 将 `sc_01` 转换为 `rvalue reference`（右值引用）——即一个“我们可以从中移动的参数”。`rvalue`\
  \ 一词传统上源于它是“可以出现在赋值表达式右侧的匿名临时[值]”。在 C++ 的语文中，这也可以扩展到其他运算符的右侧。\n\n这与 `lvalue`（左值）和\
  \ `lvalue reference`（左值引用）术语相反，后者与我们在 C++11 之前已知并喜爱的引用相关：\n\n```\nSimpleClass sc_02{12};\
  \             // sc_02 是一个左值\nSimpleClass& sc_lval = sc_02;      // sc_lval 是一个左值引用\n\
  ```\n\n作为函数参数时，右值引用用双安圈符 `&&` 表示。如果我们实现 `SimpleClass` 的移动构造函数，它的签名将如下所示：\n\n```\n\
  SimpleClass(SimpleClass&& to_be_moved);\n```\n\n相比之下，拷贝构造函数的签名使用 `const` 左值引用作为其参数：\n\
  \n```\nSimpleClass(const SimpleClass& to_be_copied);\n```\n\n编译器还提供了默认的`move assignment\
  \ operator`（移动赋值运算符），允许我们将一个新的 `SimpleClass` 对象移动到一个存在的对象（`move_sc`）中：\n\n```\n\
  SimpleClass sc_03{23};\n\n// move_assignment_target.k_ = 53:\nSimpleClass move_assignment_target{53};\n\
  \n// move_assignment_target.k_ 现在为 23:\nmove_assignment_target = std::move(sc_03);\n\
  ```\n\n请注意，尝试对非右值对象（即未转换为临时可移动状态的对象）创建右值引用将无法编译：\n\n```\nSimpleClass&& sc_err =\
  \ sc_03;       // 编译错误！\n```\n\n右值和左值的题可能会很快演变成冗长而复杂的讨论，因此此解释保持了简短，并专门针对当前任务——即如何使用移动语义。如果你想深入研究该主题，可以在\
  \ Stanley B. Lippman 等人编写的 [*C++ Primer*](https://oreil.ly/QcmrY) 第 5 版（Addison-Wesley,\
  \ 2012）第 13.6.1 节中\n\n最后，一个显而易见的问题可能是，*被移动过的*（moved-from）对象发生了什么？假设我们创建了一个 `SimpleClass`\
  \ 对象 `sc_04` 并将其移动到另一个名为 `move_sc_04` 的 `SimpleClass` 对象：\n\n```\nSimpleClass sc_04{41};\n\
  SimpleClass move_sc_04{std::move(sc_04)};\n```\n\n### 注意事项\n\n在书中，我们主要关注默认移动操作，不需要实现移动构造函数或移动赋值运算符。这里的重点是理解如何使用默认移动操作来移动对象而不是拷贝它们。默认移动操作将在下一章返回。\n\
  \n实现用户定义的移动构造函数和移动赋值运算符带有额外的考虑以及关于编写异常安全代码的讨论。这些点超出了本书的范围，但如果你感兴趣了解更多信息，请参阅附录 C](#app03.html_app_C）中从第\
  \ 3 章](#ch03.html_ch03）扩展的示例。\n\n在这种情况下，`sc_04` 是*被移动过的*对象。至于它发生了什么，答案是它保持在*有效但不确定的状态*，因为它没有被自动销毁。对于被移动过的对象我们有两种选择。如果你像这里\
  \ `sc_04` 这样先对其赋值，就可以重用它们；那时你就知道它们的状态：\n\n```\nsc_04 = SimpleClass{216};       \
  \    // 重新赋值给 sc_04\nint sum = sc_04.get_val() + 100;    // sum = 316\n```\n\n否则，你可以让它们在离开作用域时自动销毁。\n\
  \n## 使用 std::move(.) 初始化构造函数参数\n\n这现在带我们回到开头提到的动机：找到一种高效的方法来初始化封装对象的子对象成员，同时允许后者保留对前者的独占所有权。为了演示，我们将继续使用玩具示例，初始化一个\
  \ `SimpleClass` 子对象成员并将其存储在 `Enclose` 类中。这个特定的示例没有提供实际的性能提升，但它将扩展到性能成为问题的情况，正如你在本节末尾看到的。\n\
  \n封装类可以设计为通过“旧方法”接收构造参数（即通过 `const` 引用），以及通过右值引用和左值引用接收：\n\n```\nclass Enclose\n\
  {\npublic:\n    Enclose(const SimpleClass& sc); // 构造函数 1\n    Enclose(SimpleClass&&\
  \ sc);      // 构造函数 2\n\n    SimpleClass get_sc() const;     // 访问器\n\nprivate:\n\
  \    SimpleClass sc_;\n};\n\n// 实现：\nEnclose(const SimpleClass& sc) : sc_{sc} {}\
  \      // 构造函数 1\nEnclose(SimpleClass&& sc) : sc_{std::move(sc)} {} // 构造函数 2\n\n\
  SimpleClass Enclose::get_sc() const {\n    return sc_;\n}\n```\n\n```\nSimpleClass\
  \ sc_enc{100};\nEnclose enc{sc_enc};\n```\n\n在这里，`sc_enc` 通过 `const` 引用传递，然后在初始化\
  \ `sc_` 时进行了一个完整的对象拷贝。\n\n或者，通过传递右值引用可以避免对象拷贝：\n\n```\nSimpleClass sc_enc{100};\n\
  Enclose enc_move{std::move(sc_enc)};\n```\n\n在这种情况下，`SimpleClass` 的移动构造函数被调用了一次。\n\
  \n然而，出现了一种更常用的方法，可以通过一个构造函数产生类似的结果。在这种情况下，`sc` 参数按值接收，但成员初始化是通过移动完成的：\n\n```\nclass\
  \ EncloseConstructor\n{\npublic:\n    EncloseConstructor(SimpleClass sc);\n    SimpleClass\
  \ get_sc() const;\n\nprivate:\n    SimpleClass sc_;\n};\n\n// 实现：\nEncloseConstructor::EncloseConstructor(SimpleClass\
  \ sc) :\n    sc_{std::move(sc)}{}\n\nSimpleClass EncloseConstructor::get_sc() const\
  \ {\n    return sc_;\n}\n```\n\n```\nSimpleClass sc_enc{100};\nEncloseConstructor\
  \ enc_sing_ctor{sc_enc};\n```\n\n在这种情况下，`sc_enc` 在绑定到构造函数参数时产生了一个拷贝，但 `sc_` 的初始化是通过移动的。\n\
  \n我们随后可以通过传递右值引用获得更好的结果（在非平凡的情况下）：\n\n```\nSimpleClass sc_enc{100};\nEncloseConstructor\
  \ enc_move_sing_ctor{std::move(sc_enc)};\n```\n\n在这种情况下，发生了两次移动操作。第一次发生在调用构造函数参数\
  \ `sc` 的移动构造函数时，第二次发生在初始化成员 `sc_` 时。\n\n但是作为被移动过的对象，`sc_enc` 现在处于有效但不确定的状态，这与它在之前的拷贝构造函数用例中的情况非常不同，在那里将保持原始状态。更具体地说，如果你有一个签名名为\
  \ `f(.)` 的函数\n\n```\nvoid f(SimpleClass sc);\n```\n\n\n\n并且在构造 `enc_sing_ctor` 之后将\
  \ `sc_enc` 作为参数调用它，如果在构造 `enc_move_sing_ctor` 之后执行相同的操作，那么该函数在两种情况下的行为很可能会不同。之前的警告仍然适用：要么重新赋值\
  \ `sc_enc`，要么让它在超出作用域时自动销毁。\n\n现在，回到 `PatternAnalytics` 类的草图，让我们看看如何通过包含 1,000 个市场数据元素（`double`\
  \ 类型）的 `vector` 构造函数参数来简单构造对象：\n\n```\nvector<double> data{38.6832, 3.94, 68.6824,\
  \ 24.8948, 79.5146, . . . , 149.847};\n```\n\n然后，让我们写一个加载数据并使用移动语义初始化子对象成员 `data_`\
  \ 的构造函数：\n\n```\nPatternAnalytics::PatternAnalytics(std::vector<double> data_in\
  \ /*, . . .*/) :\n    data_{std::move(data_in)} {}\n```\n\n我们的第一个选项是按值传递 `data`\
  \ 向量：\n\n```\nPatternAnalytics pass_by_value{data};\n```\n\n在这种情况下，当 `data` 被按值绑定到构造函数参数\
  \ `data_in` 时，会创建一个 `data` 的拷贝，而初始化是通过移动语义完成的。`vector` 同时具备默认拷贝构造函数和移动构造函数。\n\n\
  或者，我们可以通过移动来传递，同样将使用移动语义进行初始化：\n\n```\nPatternAnalytics pass_by_move{std::move(data)};\n\
  ```\n\n在笔记本电脑使用 Visual Studio 2022 的测试中，即使只有两个物理核心，结果也相当惊人。通过按值和移动实例化 10,000 次 `PatternAnalytics`，每次运行五次的平均时间（毫秒）如下：按值传递为\
  \ 4.0441 ms，移动传递为 0.3672 ms。这速度提升了仅仅 10 多倍。\n\n此处的结论是，在非本质的情况下，使用移动语义绑定构造函数参数并初始化子对象成员的开销比需要复制对象要低得多，同时通过允许包含对象对其成员数据拥有独占控制权来确保安全性。\n\
  \n## 匿名临时对象与移动语义\n\n匿名临时对象——一个右值而非右值引用——也可以通过移动语义传递给函数。假设我们有这样一个函数：\n\n```\nvoid\
  \ r_val_ref(SimpleClass&& sc)\n{\n    cout << \"r_val_ref (&&):  k = \" << sc.get_val()\
  \ << \"\\n\";\n}\n```\n\n如果我们知道将不需要重用输入的 `SimpleClass` 对象，可以使用匿名临时对象（右值）作为参数调用此函数，使其更加简洁。注意，由于临时对象\
  \ `SimpleClass{20}` 已经是一个右值，因此不使用 `std::move(.)`：\n\n```\nr_val_ref(SimpleClass{20});\
  \          // 右值参数\n```\n\n注意，这与之前将具名的 `SimpleClass` 对象强制转换为右值引用的情况不同：\n\n```\n\
  SimpleClass move_sc{30};\nint m = 2 * move_sc.get_val();      // 在函数调用之前使用对象\n\n\
  r_val_ref(std::move(move_sc));      // 命名对象的右值引用参数\n```\n\n在后一种情况下，`move_sc` 同样适用于之前的警告，因为在\
  \ `r_val_ref(.)` 函数调用中应用 `std::move(.)` 后，它处于有效但未确定的状态。\n\n## 返回值优化\n\n考虑到移动语义可以获得的效率，我们可能会倾向于通过移动从函数返回对象：\n\
  \n```cpp\n// 不要这样做：\nSimpleClass f(int n)\n{\n    return std::move(SimpleClass{n});\n\
  }\n\n// 或者像这样：\nSimpleClass g(int n)\n{\n    SimpleClass sc{n};\n    return std::move(sc);\n\
  }\n```\n\n根据[核心指南](https://oreil.ly/kn05E)，这并不是良好的做法，并可能导致次优结果。相反，我们应该像往常一样直接返回对象，因为[保证的拷贝消除](https://oreil.ly/7FExK)会为我们完成优化。\n\
  \n这意味着如果我们按照如下方式编写函数：\n\n```\nSimpleClass f(int n)\n{\n    return {n};     // 等同于\
  \ 'return SimpleClass{n}',\n                    // 使用 C++11 引入的\n              \
  \      // 统一初始化和\n                    // 自动类型推导\n}\n\nSimpleClass g(int n)\n{\n\
  \    SimpleClass sc{n};\n    return sc;\n}\n```\n\n那么调用函数\n\n```\nSimpleClass scf\
  \ = f(2);\nSimpleClass scg = g(3);\n```\n\n本质上相当于编写以下代码：\n\n```\nSimpleClass scf{2};\n\
  SimpleClass scg{3};\n```\n\n也就是说，从 `f(.)` 或 `g(.)` 返回对象时不会生成额外的 `SimpleClass` 拷贝。在\
  \ `f(.)` 的情况下，这被称为*返回值优化* (*RVO*)，在 `g(.)` 的情况下，它被称为*命名返回值优化* (*NRVO*)，因为具名对象 `sc`\
  \ 在返回之前先被创建。\n\n这种做法意味着从 `f(.)` 或 `g(.)` 返回对象时不会产生额外的 `SimpleClass` 拷贝。在 `f(.)`\
  \ 的情况下，这被称为*返回值优化* (*RVO*)，在 `g(.)` 的情况下，它被称为*命名返回值优化* (*NRVO*)，因为具名对象 `sc` 在返回之前先被创建。\n\
  \n这种拷贝消除从 C++11 开始在特定条件下是允许的但不是强制的，尽管许多编译器已经提供了它。标准从 C++17 开始在更通用的条件下要求它。正如 C++\
  \ 中其他大多数情况一样，存在微妙之处，Fluent C++ blog](https://oreil.ly/mpY1C)提供了这些细节。\n\n## 默认构造函数\n\
  \n如果类没有提供用户定义的构造函数，可以使用编译器提供的默认构造函数：\n\n```\nclass Minimal\n{\npublic:\n    // 未声明构造函数。\n\
  \    // 编译器提供默认构造函数。\n\n    int do_something(int k) const;\n\n};\n```\n\n然后通过编译器提供的默认构造函数构造\
  \ `Minimal` 实例：\n\n```\nMinimal min{};\nmin(42;\n```\n\n然而，如果添加了用户定义的构造函数，编译器提供的默认构造函数会被禁用。如果仍然需要默认构造函数，则由程序员负责。在\
  \ C++11 之前，如果我们需要默认构造函数来初始化成员数据，必须在实现中提供初始化。例如，假设 `Minimal` 类中的成员变量 `x_` 需要初始化为\
  \ 0，它应更新如下：\n\n```\nclass Minimal\n{\npublic:\n    Minimal(int x);           //\
  \ x_{x};\n    Minimal();                // x_{0};\n    int do_something(int k) const;\n\
  \    int do_something_with_x() const;\n\nprivate:\n    int x_;\n};\n\n// 用户定义的构造函数：\n\
  Minimal::Minimal(int x) x_{x} {}\n\n// 用户定义的默认构造函数\nMinimal::Minimal() : x_{0} {}\n\
  \nint Minimal::do_something(int k) const\n{\n    // . . .\n}\n\nint Minimal::do_something_with_x()\
  \ const\n{\n    // . . .\n}\n```\n\n从 C++11 开始，默认构造函数可以在文件中设置为 `default`，这显式指示编译器生成与没有用户定义构造函数时提供的相同的默认构造函数。然后，如下所示的类内成员初始化可以设置\
  \ `x_` 的默认值。这产生了更现代的风格：\n\n```\nclass Minimal\n{\npublic:\n    Minimal(int x); \
  \        // x_{x};\n    Minimal() = default;    // 可以使用 default     \n    void do_something(int\
  \ k) const;\n    void do_something_with_x() const;\n\nprivate:\n    int x_{0}; \
  \             // 类内成员初始化 \n};\n```\n\n\n\n\n核心指南（Core Guidelines）告诉我们，当一个或多个成员需要用字面量初始化时，应[优先使用类内初始化](https://oreil.ly/Vy9An)。这确保了当可能存在多个需要默认值的构造函数时，行为是一致的，这不仅能让代码更整洁，同时也是最高效率的写法。此外，一个积极的后续效果是，它有助于确保所有数据成员在构造时都得到了初始化，这是本章早些讨论的另一个最佳实践。\n\
  \n自 C++11 发布以来，`default` 关键字也可以用于其他情况，以指示编译器生成默认行为，你将在下一节和下一章中看到这一点。\n\n## 三路比较运算符（太空符运算符）\n\
  \n假设我们有一个 `Fraction` 类，它接收两个整数并将它们存储为成员 `n_` 和 `d_`，分别代表分子和分母：\n\n```\nclass Fraction\n\
  {\npublic:\n    Fraction(int n, int d);    // 初始化 n_{n}, d_{d}\n\nprivate:\n   \
  \ int n_, d_;\n\n};\n```\n\n为了简化这个示例，假设这些值是非负的，且分母不为 0。对于我们的目的，这些条件可以使用 `<cassert>`\
  \ 头文件中定义的 [`assert(.)` 函数](https://oreil.ly/q1Q7Z) 来强制执行，如构造函数的实现中所示。如果违反了任何一种情况，执行将停止。我们还可以通过\
  \ `std::gcd(.)` 函数寻找最大公约数来简化分数，该函数在 C++17 引入的 `<numeric>` 算法集中（第 5 章 :n_{n}, d_{d}\n\
  {\n    assert((n < 0) || (d <= 0));        // 继承自 C；没有 std:: 作用域。\n\n    // 简化分数：\n\
  \    int frac_gcd = std::gcd(n, d);\n    n_ /= frac_gcd;\n    d_ /= frac_gcd;\n\n\
  \    if (n_ == d_)\n    {\n        n_ = 1;\n        d_ = 1;\n    }\n}\n```\n\n现在假设我们创建了两个\
  \ `Fraction` 实例，`a` 和 `b`：\n\n```\nFraction a{1, 2};\nFraction b{3, 4};\n```\n\n\
  然后，假设我们要比较它们：\n\n```\nif(a == b)\n{\n    // 做些什么。 . .\n}\n\nif(a > b)\n{\n    //\
  \ 做些什么。 . .\n}\n```\n\n编译器会报错，因为它不知道对于用户定义的类*相等*或*大于*意味着什么。因此，我们需要自己定义这些运算符。\n\n\
  在 C++11 之前，需要定义所有六个比较运算符（`==`, `!=`, `<`, `<=`, `>`, 和 `>=`）以涵盖所有情况：\n\n```\nbool\
  \ operator == (const Fraction& rhs) const;\nbool operator != (const Fraction& rhs)\
  \ const;\nbool operator < (const Fraction& rhs) const;\nbool operator > (const Fraction&\
  \ rhs) const;\nbool operator <= (const Fraction& rhs) const;\nbool operator >= (const\
  \ Fraction& rhs) const;\n```\n\n从逻辑角度来看，如果定义了 `==` 和 `<`，剩余的实现可以用这两个运算符来表示。然而，在代码中仍然需要对六个运算符进行单独实现，即使其余四个是基于前两个的。在\
  \ C++20 中，随着*三路比较运算符*（又称为*太空符运算符* `<=>`）的引入，这现在变得精简了。现在，我们只需要提供 `==` 和 `<`，工作基本上就完成了。\n\
  \n回到 `Fraction` 类，等等运算符只是将 `==` 定义为 `default` 的简单问题。在此语境下，`default` 关键字指示编译器为两个对象的相等性提供默认行为。每个成员都将与被比较对象上的相应成员进行比较：先比较分子，然后比较分母。如果每对都相等，则运算符返回\
  \ `true`。如果至少有一处比较不相等，运算符将返回 `false`。相反，`==` 运算符的默认定义现在也自动定义了 `!=` 运算符：\n\n```\n\
  #include <compare>\n\nclass Fraction\n{\npublic:\n    Fraction(int n, int d);\n\n\
  \    // 同时定义 \"==\" 和 \"!=\"\n    bool operator == (const Fraction& rhs) const =\
  \ default;\n\nprivate:\n    int n_, d_;\n\n};\n```\n\n剩余的不等运算符（包括不包含和包含的）可以通过太空符运算符\
  \ (`<=>`) 来定义，这需要标准库 `<compare>` 头文件。然而，对于整数值，使用的是 `std::strong_ordering` 而不是 `bool`\
  \ 类型（稍后会介绍更多信息）。\n\n编译器也为 `<=>` 提供了默认实现，但在这种情况下对我们没有帮助，因为它定义的是成员逐逐字典序比较。例如，如果我们写这样的代码：\n\
  \n```\n#include <compare>\n\nclass Fraction\n{\npublic:\n    Fraction(int n, int\
  \ d);\n    bool operator == (const Fraction& rhs) const = default;\n\n    // 这个默认将给出错误的结果：\n\
  \    std::strong_ordering operator <=> (const Fraction& rhs) const = default;\n\n\
  private:\n    int n_, d_;\n\n};\n```\n\n我们将得到类似如下的无意义结果：\n\n*   $\\frac{2}{3} <\
  \ \\frac{4}{6}$，因为 4 > 2\n*   $\\frac{1}{2} < \\frac{1}{5}$，因为分子相等\n*   $\\frac{5}{3}\
  \ < \\frac{2}{3}$，因为 > 等\n\n由于由于原因，我们首先需要从头文件中移除 `default` 设置：\n\n```\n// 移除默认：\n\
  std::strong_ordering operator <=> (const Fraction& rhs) const;\n```\n\n然后我们还需要编写自己的实现，这可以通过先小于\
  \ (`<`) 来完成。如果为假，下一步将是检查相等性。如果这两者都为假，则结果必须大于（`>`）。\n\n```\nstd::strong_ordering\
  \ Fraction::operator>(const Fraction& rhs) const\n{\n    if(n_ * rhs.d_ < rhs.n\
  \ * d_)\n    {\n         return std::strong_ordering::less;\n    }\n    if (*this\
  \ == rhs) // 检查对象是否等于 rhs\n    {\n        return std::strong_ordering::equivalent;\n\
  \    }\n    else\n    {\n        return std::strong_ordering::greater;\n    }\n\
  }\n```\n\n在定义了 `==` 和 `<` 后，我们就可以像往常一样应用六个比较运算符中的任何一个：\n\n```\nFraction f_01{1,\
  \ 5};\nFraction f_02{1, 2};\n\nif(f_01 <= f_02)\n{\n    // <=> 现在正确评估了 1/5 < 1/2\n\
  \    // . . .\n}\nelse\n{\n    // . . .\n}\n```\n\n使用 `strong_ordering` 返回类型意味着任意值都可以比较，C++\
  \ 中的整数类型正是如此。标准库还有一个 `std::partial_ordering` 类型，应该用于浮点类型，如 `double` 和 `float`。这是因为浮点类型（例如\
  \ `double`）可以持有不可比较的赋值，如无限和 *NaN*（非数字）。应该注意的是，在定义 `==` 时不应直接比较浮点类型。相反，这种情况下（例如两个\
  \ `double` 值 `x` 和 `y`）的相等性应该通过 `y` 是否落在 `x` 的特定范围内来确定。\n\n我们可以使用第三种返回类型 `weak_ordering`\
  \ 用于字符串比较的情况（但不限于此示例），其中大小写不敏感但其他相同的字符被视为等效。你可以在 Rainer Grimm 著作 *C++20: Get the\
  \ Details* (Leanpub, 2023) 的第 4.3.3 节找到对这些返回类型的详细比较。\n\n金融应用程序所需的通常排序可能基于语言中已定义的数值类型（例如\
  \ `double`）。然而，`==` 和 `<=>` 的重载在设计日期类时可能非常有用，日期的排序和日期算术是基于自纪年以来的天数（例如 1970-01-01，Unix\
  \ 元年）。[第 7 章](#ch07.html_ch07）在用户定义日类的文中介绍了这一主题。\n\n## Lambda 表达式与用户定义类成员\n\n\n\n\
  \n现在回到 lambda 表达式的话题，最后一点需要涵盖的是在 lambda 表达式中捕获对象的成员数据和成员函数。假设我们有一个类，用于计算如下二次函数的值：\n\
  \n$ax² + bx + c$\n\n对于给定的实数向量：\n\n$x[1], x[2], \\dots, x[n]$\n\n其中该函数的系数 $a$、$b$\
  \ 和 $c$ 存储为成员变量。一个公共成员函数 `generate_values(.)` 将计算 `vector<double>` 参数中每个元素的函数值，并将结果返回在另一个\
  \ `vector` 中：\n\n```cpp\n#include<vector>\nclass QuadraticGenerator\n{\npublic:\n\
  \    QuadraticGenerator(double a, double b, double c);    // a_{a}, b_{b}, c_{c}\n\
  \    std::vector<double> generate_values(const std::vector<double>& v);\n\nprivate:\n\
  \    double a_, b_, c_;\n};\n```\n\n在 `generate_values(.)` 函数内部，我们可以将函数求值分离到一个 lambda\
  \ 表达式中，该表达式会在每次遍历 `v` 的范围 `for` 循环时被调用。为了实现这一点，我们需要成员变量 `a_`、`b_` 和 `c_`。我们可以在捕获列表中单独列出这些变量，也可以通过在\
  \ lambda 捕获中插入 `this` [指针](https://oreil.ly/F6b3R)（它指向活跃对象）来访问所有成员数据（以及成员函数）：\n\n\
  ```cpp\nstd::vector<double> QuadraticGenerator::\n\tgenerate_values(const std::vector<double>&\
  \ v)\n{\n    auto quadratic_value = this\n    {\n        return x * (a_ * x + b_)\
  \ + c_;\n    };\n\n    std::vector<double> y;\n\n    for (double x : v)\n    {\n\
  \        y.push_back(quadratic_value(x));\n    }\n\n    return y;\n}\n```\n\n在某些线程场景下，可能不需要\
  \ `this` 指针，而是需要活跃对象的拷贝 `*this` 作为 lambda 捕获参数。这在 C++17 后期被启用，因此 `quadratic_value(.)`\
  \ 可以写成如下形式：\n\n```cpp\nauto quadratic_value = *this\n{\n    return x * (a_ * x +\
  \ b_) + c_;\n};\n```\n\n这里提到这一点仅是为了完备性。具体的示例将引入多线程编程的复杂性，那是更高级书籍中讨论的话题。我们的示例将主要使用捕获\
  \ `this` 指针的前例，而不是 `*this`。\n\n## 总结\n\n本章介绍的话题可能像是一份“杂杂”的列表，大部分是编写用户定义类时可以使用的较新特性，因此回顾一下已讨论的内容可能会有所帮助。\n\
  \n记住，函数对象（functor）是一种行为像函数的对象，但它通过暴露至少一个用户定义的 `operator ()` 重载版本来持有状态。在量化编程中，函数对象是一个非常有用的工具，例如用于计算期权隐含波动率的寻根算法。\n\
  \n在第 1 章中引入的 lambda 表达式是 C++11 添加到标准中的另一种形式函数对象。在本章中，你看到了如何在另一个函数内部有利地定义 lambda，以及它如何帮助重构被多次调用的代码。一个简单的例子是\
  \ `BlackScholes` 类实现中的 `norm_cdf` lambda。lambda 表达式还可以捕获活跃对象的 `this` 指针（或者根据需要使用解引用后的\
  \ `*this`），为 lambda 提供对活跃对象上任何数据成员或成员函数的访问。作为后续主题的题说明，函数对象和 lambda 都可以作为参数传递给函数或\
  \ STL 算法，你将在第 5 章中看到。\n\n移动语义（Move semantics）允许对象所有权的转移，例如函数参数以及在构造时初始化子对象成员。在复杂的情况下，这可以显著减少对象拷贝的性能开销，同时避免传递指针或引用存储成员等旧方法可能产生的问题。\n\
  \n`default` 关键字从一开始就明确表示特殊成员函数将采用其编译器提供的默认实现。作为一个具体的例子，结合类内成员初始化，`default` 可以消除对实现默认构造函数的需要。类内成员初始化提供了若干益处，有助于减少\
  \ bug 的风险，特别是作为默认值构造函数的补充。它还有助于确保所有成员数据在构造时都已初始化。\n\n`default` 关键字的另一个有用例子是 `==`\
  \ 运算符的默认逐成员相等性定义。三路比较运算符（通常称为太空运算符）允许你通过 `==` 和 `<` 实现所有六个相等和比较运算符，如 `Fraction`\
  \ 类的示例所示，因此不再需要在单独的实现中定义每一个运算符。\n\n## 额外参考文献\n\nNicolai M. Josuttis, *C++ Move Semantics:\
  \ The Complete Guide* (Leanpub, 2022), 第 2 章。\n\nMark S. Joshi, *C++ Design Patterns\
  \ and Derivatives Pricing*, 2nd edition (Cambridge).\n\n# 第 3 章：继承、多态与智能指针\n\n从历史上看，C++\
  \ 是金融行业中一种流行的语言，因为它支持*面向对象编程*。对象之间的依赖关系大致分为两类：*组合*（“拥有”关系，composition）和*继承*（“是是”关系，inheritance）。以下是两个与金融编程相关的示例：\n\
  \n*   期权合约*有*一个收益率（payoff）。\n*   看涨收益*是*一种收益率类型。\n\n更多关于“拥有”关系（组合）的金融示例包括：\n\n*\
  \   国库券*有*一个计天方式。\n*   付息债券*有*第一个付息日、倒数第二个付息日和到期日。\n\n至于更多的“是是”关系（继承），金融领域有如下情况：\n\
  \n*   Actual/365、Actual/360 和 30/360 均*是*一种计天方式。\n*   抵押贷款转让、担保抵押贷款债券（CMO）、纯息权或纯本金权*都是*一种抵押贷款证券。\n\
  \n\n\n\n关于继承，C++11 引入了如 `override` 和 `final` 等新的上下文关键字，用于在使用对象继承时在编译时捕获错误。通过这种方式，可以防止以往与继承相关的常见运行时错误显露头角，从而避免对任务关键型金融系统造成潜在的严重破坏。后文中将介绍相关的示例。\n\
  \n最后，某些对象之间可能存在交互，但在“包含”（has-a）或“是”（is-a）的意义上可能并不相关。这被称为“关联”（association）。以下是两个示例：\n\
  \n*   期权定价模型类使用市场数据和合同数据。\n*   付息债券类使用收益率曲线来计算其估值。\n\n在每种情况下，数据对象都可以作为输入数据传入估值成员函数，但不会被存储为成员数据。这意味着它们也不会继承自估值对象。\n\
  \n在本章中，你将学习一些自 C++11 及以后进入标准库的、与组合和继承相关的有用现代特性。随后，你将看到如何应用这些特性来改进过去用于继承和组合的 C++03\
  \ 编码风格。\n\n这将引出一个真实的金融用例，从“原始指针的资源所有权”开始。\n\n\n\n\n\n```cpp\n// Shape implementation\n\
  std::string Shape::what_am_i() const\n{\n    return \"Shape\";\n}\n\n// Circle implementation\n\
  Circle::Circle(double radius) :radius_{radius} {}\n\nstd::string Circle::what_am_i()\
  \ const        // override\n{\n    return \"Circle\";\n}\n\ndouble Circle::area()\
  \ const                  // override\n{\n    return std::numbers::pi * radius_ *\
  \ radius_;\n}\n\n// Rectangle implementation\nRectangle::Rectangle(double length,\
  \ double width) :\n        length_{length}, width_{width} {}\n\nstd::string Rectangle::what_am_i()\
  \ const     // override\n{\n    return \"Rectangle\";\n}\n\ndouble Rectangle::area()\
  \ const               // override\n{\n    return length_ * width_;\n}\n```\n\n在上一节中，我们查看了如何在一个\
  \ `Enclose` 对象上初始化和存储一个子对象成员，这更正式地称为两个对象的**组合**（composition）。这种组合方式可以进一步扩展，使得包含类包含一个指向派生类型对象的指针（某种形式，将在本章稍后讨论），例如继承自\
  \ `Shape`（抽象）基类的 `Circle` 或 `Rectangle`。这个被指向的派生对象是**资源**（resource）的一个示例，目标是为 `Enclose`\
  \ 类提供该资源的**所有权**（ownership）。这些术语的定义将会给出；目前只需说由于资源需要在堆内存中进行分配和管理，提供这种所有权现在需要额外的工作和考虑。\n\
  \n假设有一个简单的例子，`Enclose` 类有一个函数可以按特定的比例因子扩大或收缩形状的面积。那么该类的初步草图可能如下：\n\n```cpp\nclass\
  \ Enclose\n{\npublic:\n    Enclose(const Shape& shape)\n    {\n        // . . .\n\
  \    }\n\n    double scale_area(double scale) const\n    {\n        return scale\
  \ * shape_->area();\n    }\n\nprivate:\n    Shape* shape_;\n};\n```\n\n图 3-2 是显示这种所有者-资源设计的高级\
  \ UML 图。\n\n![lmcf 0302](img/lmcf_0302.png)\n\n###### 图 3-2. 在组合示例中，一个资源指向一个派生类型的对象\n\
  \n建立这种所有权的挑战性部分在接下来，因为它涉及到指针和分配的内存，因此需要特别注意，接文中将讨论这一点。然而，在对现代智能指针进行以下介绍后，我们将展示如何用更简洁、更安全的代码来更新解决方案。\n\
  \n## 使用原始指针的资源所有权\n\n假设我们有一个代表期权的对象，它需要将其收益作为数据成员存储，但收益——看涨或看跌——在运行之前是未知的。这种场景基于\
  \ Mark S. Joshi（剑桥大学出版社）编写的 *C++ Design Patterns and Derivatives Pricing* 第 2 版第\
  \ 4 节中介绍的一个示例，该书出版于 2008 年，当时智能指针、移动语义以及 `override`、`default` 和 `delete` 关键字（将在后文中讨论）等增强尚未在\
  \ C++11 标准中出现。\n\n然而，对于当时的那个时代来说，这本书提供了一个易于理解且直观的示例，它将一个多态收益对象设置在一个包含的期权合约类中，使得实际的收益——看涨或看跌——在运行之前是未知的。这种设计避免了使用\
  \ `if...then` 条件来设置收益的需求，从而产生了更简洁的代码。此外，它还展示了一种设计，允许期权信息存储在一个通用且可重用的对象中，该对象与定价模型保持分离。\n\
  \n### 注意\n\n令人遗憾的是，[Joshi 在 2017 年英年过世](https://oreil.ly/80y32)。他对金融领域的贡献是巨大的，出版了另外两本关于数学金融的书，发表了\
  \ 70 多篇研究论文，并为 C++ 金融开发者开发了实用的开源实用程序。尽管他的 C++ 设计模式书籍在 C++11 几年之前出版，但对于想要学习在实践中应用\
  \ C++ 面向对象设计模式基础的金融程序员来说，它仍然是一本很好的教材。\n\n回到我们的讨论，我们将从一个类似的示例开始，该示例说明建立资源所有权的挑战，然后逐步构建一个包含更多现代特性和方法的更新版本。这将从源自抽象\
  \ `Payoff` 基类的股票期权看涨和看跌收益开始。这里展示了建议的类声明，但请注意这些尚未完成，将在随后的讨论中完善：\n\n```cpp\nclass\
  \ Payoff\n{\npublic:\n    virtual double payoff(double price) const = 0;\n    virtual\
  \ ~Payoff() = default;    // 记得在基类中包含\n                                    // 虚默认析构函数\n\
  \                                    //\n\n    // . . . 还有待完成\n};\n\nclass CallPayoff\
  \ final : public Payoff\n{\npublic:\n    CallPayoff(double strike);\n    double\
  \ payoff(double price) const override;\n\n    // . . . 还有待完成\n\nprivate:\n    double\
  \ strike_;\n};\n\nclass PutPayoff final : public Payoff\n{\npublic:\n    PutPayoff(double\
  \ strike);\n    double payoff(double price) const override;\n\n    // . . . 还有待完成\n\
  \nprivate:\n    double strike_;\n};\n```\n\n`Payoff` 基类上的纯虚函数 `payoff()` 成员强制要求在每个派生类中实现它。它将返回给定现价的收益值，如每个派生类的实现所示：\n\
  \n```cpp\n#include <algorithm>        // std::max\n\n// --- CallPayoff implementation\
  \ ---\nCallPayoff::CallPayoff(double strike) :strike_{strike} {}\n\ndouble CallPayoff::payoff(double\
  \ spot) const\n{\n    return std::max(spot - strike_, 0.0);\n}\n\n// . . .\n\n//\
  \ --- PutPayoff implementation ---\nPutPayoff::PutPayoff(double strike) :strike_{strike}\
  \ {}\n\ndouble PutPayoff::payoff(double spot) const\n{\n    return std::max(strike_\
  \ - spot, 0.0);\n}\n\n// . . .\n```\n\n接下来假设我们有一个 `OptionInfo` 类，它将持有以年为单位的到期时间（或年份），以及关于收益的信息。这里的思想是将定价期权所需存储在一个与定价模型分离的可用类中。\n\
  \n特定的收益类型，看涨或看跌将在运行时动态确定。这再次需要间接，意味着收益需要存储为 `(const)` 引用或指向 `Payoff` 的指针。使用 `const`\
  \ 引用，可能会遇到浅拷贝以及在类外部修改对象的问题，如第 2 章;\n\n    double option_payoff(double spot) const;\n\
  \    double time_to_expiration() const;\n\nprivate:\n    Payoff* payoff_ptr_;\n\
  \    double time_to_exp_;\n};\n```\n\n然而，在这种情况下，我们不仅会有与 `const` 引用成员相同的问题，而且如果指针在活跃包含类外部被删除，情况可能会非常糟糕。例如：\n\
  \n```cpp\nPayoff* call_payoff = new CallPayoff{25.0};    // 行权价为 25 的看涨期权\nOptionInfo\
  \ opt_info(call_payoff, 0.5);         // 到期六个月\n\ndelete call_payoff;          \
  \                  // 哎！\n```\n\n现在，`opt_info` 指向堆上的一个已删除对象。这并不好。\n\n另一个问题出现，如果\
  \ `call_payoff` 分配并指向的内存在 `opt_info` 离开作用域之前（当使用它的函数退出时）从未被清理：\n\n\n\n\n\n```cpp\n\
  void f(. . .)\n{\n    Payoff* call_payoff = new CallPayoff{25.0};    // Call with\
  \ strike = 25\n    OptionInfo opt_info(call_payoff, 0.5);\n\n    // . . .\n\n  \
  \  // Function exits, delete never called on call_payoff\n\n}\n```\n\n在这种情况下，我们将面临内存泄漏和未定义行为。这也不是什么好事。\n\
  \n为了避免这些问题，我们希望以某种方式赋予 `OptionInfo` 对象对其 `payoff_ptr_` 成员的唯一所有权。在通用术语中，指针数据成员是一种\
  \ `resource`（资源）。正如*《Effective C++》*书中所描述的，资源“是某种在你用完它后，需要将其返回系统的东西。如果你不这样做，就会发生糟糕的事情。在\
  \ C++ 程序中，最常用的资源是动态分配的内存（如果你分配了内存但从不释放，就会导致内存泄漏）”。^(1) 除了指针之外，资源还可以指可以打开和关闭的文件，或者并行化应用程序中的线程。\n\
  \n解决方案是应用*资源获取即初始化*（*RAII*）编程技术，该技术指出*资源的生命周期保证与其所有者绑定在一起*。当所有者对象离开作用范围时，RAII 规定所有者负责销毁其资源并将其占用的内存返回给系统。\n\
  \n更具体的解释如下：\n\n> 现代 C++ 尽可能通过在栈上声明对象来避免使用堆内存。当资源大到栈无法容纳时，它应该由一个[封装]（enclosing）对象拥有。当对象初始化时，它获取其所拥有的资源。然后，该对象负责在析构函数中释放该资源。所有者对象本身声明在栈上。对象拥有资源的原则也称为“资源获取即初始化”，或\
  \ RAII。”^(2)\n\n如果你对栈内存和堆内存的回习感兴趣，可以参考 Stack Overflow 上的一篇富有启发性的讨论，“[栈和堆是什么，它们在哪里？](https://oreil.ly/D91BC)。\n\
  \n在接下来的示例中，`OptionInfo` 将设计为*拥有*一个派自其抽象基类 `Payoff` 的资源。资源的类型（`CallPayoff` 或 `PutPayoff`）将在运行时确定，并由指向\
  \ `Payoff` 的指针进行*处理*。假设收益率类型为 `CallPayoff`，那么 RAII 的实现可以拆解为满足两个特定要求：\n\n1. 在构造所有者\
  \ `OptionInfo` 实例时，`payoff_ptr_` 将初始化为持有相应 `CallPayoff` 资源的堆内存地址。\n2. 该资源将在整个所有者的生命周期内持续存在，并且仅在其所有者\
  \ `OptionInfo` 析构函数被调用时才被销毁。\n\n## 使用拷贝方法（Clone Methods）\n\n在 C++11 和标准库智能指针出现之前，在像此类示例的情况下实现\
  \ RAII 的常用方法通常会通过在资源类上实现*克隆*（clone）方法开始。这些成员函数将生成一个指向活跃派生对象*拷贝*的指针（在我们的案例中，是一个看涨或看跌期权收益）。\n\
  \n这种方法通过在每个派生收益率类上重写纯虚函数 `clone()` 方法来实现，如下面的基类和 `CallPayoff` 类的声明所示，同样基于 Joshi\
  \ 书中的示例。你可以在 Erich Gamma、Richard Helm、Ralph Johnson 和 John Vlissides 编写的经典著作[*《设计模式：可重用面向对象软件的基础要素》](https://oreil.ly/24zCc)（Addison-Wesley,\
  \ 1994）第 3 章中找到对 `clone()` 方法的更通用的讨论，这本书因为有四位作者，通常被称为“四人帮”（Gang of Four）书。\n\n```cpp\n\
  class Payoff\n{\npublic:\n    virtual double payoff(double price) const = 0;\n \
  \   virtual Payoff* clone() const = 0;    // 新的（纯虚）成员函数\n    virtual ~Payoff() =\
  \ default;\n};\n\nclass CallPayoff : public Payoff\n{\npublic:\n    CallPayoff(double\
  \ strike);\n    double payoff(double price) const override;\n    CallPayoff* clone()\
  \ const override;   // 新的重写成员函数\n\nprivate:\n    double strike_;\n};\n```\n\n`PutPayoff`\
  \ 类的声明类似。\n\n在 `clone()` 的实现中，活跃的 `CallPayoff` 对象在堆内存中创建自己的拷贝（`*this`）并返回指向它的指针。该指针将成为所有者\
  \ `OptionInfo` 对象上的成员，指向 `Payoff` 资源：\n\n```cpp\nCallPayoff* CallPayoff::clone()\
  \ const\n{\n    return new CallPayoff(*this);\n}\n```\n\n看涨期权收益的值通过 `payoff(.)`\
  \ 函数获取：\n\n```cpp\ndouble CallPayoff::payoff(double spot) const\n{\n    return std::max(spot\
  \ - strike_, 0.0);     // # include <algorithm>\n}\n```\n\n`PutPayoff` 的 `payoff(.)`\
  \ 函数实现同样相似，只是 `strike` 和 `spot` 在 `max(.)` 函数参数中反过了。使用拷贝方法有时被记忆性地称为[“虚构造函数”](https://oreil.ly/5K04S)。\n\
  \n## 创建 OptionInfo 实例\n\n`Payoff` 资源随后在构造时由 `OptionInfo` 对象*获取*，它将指向其内存地址。而不是像之前的草案示例那样接收一个\
  \ `Payoff` 指针，构造函数参数被替换为 `Payoff` 的 `const` 引用：\n\n```cpp\nOptionInfo(const Payoff&\
  \ payoff, double time_to_exp);\n```\n\n构造初始化将调用引用的 `clone()` 虚函数，然后将 `payoff_ptr_`\
  \ 初始化为 `CallPayoff` 或 `PutPayoff`：\n\n```cpp\nOptionInfo::OptionInfo(const Payoff&\
  \ payoff, double time_to_exp):\n    payoff_ptr_{payoff.clone()}, time_to_exp_{time_to_exp}\
  \ {}\n```\n\n通过这种方式，内存获取仅在构造 `OptionInfo` 对象时发生，从而防止其从外部被删除或修改。这完成了我们 RAII 要求 1\
  \ 的必要条件。\n\n至于期权的收益值，现在可以通过提供一个访问器从所有者 `OptionInfo` 轻松获取 `payoff_ptr_` 资源的 `payoff()`\
  \ 成员函数，并以底层证券的价格作为输入参数：\n\n```cpp\ndouble OptionInfo::option_payoff(double spot)\
  \ const\n{\n    return payoff_ptr_->payoff(spot);\n}\n```\n\n剩余的返回到期时间的访问器显而易见：\n\
  \n```cpp\ndouble OptionInfo::time_to_expiration() const\n{\n    return time_to_exp_;\n\
  }\n```\n\n## 防止浅拷贝\n\n到为止，你已经看到了如何使用克隆方法来分配资源，满足了所有者对象创建时 RAII 要求 1 的必要条件。然而，这还不够。\n\
  \n目前，如果出于某种原因尝试拷贝 `OptionInfo`，将调用默认拷贝构造函数，导致共享相同 `Payoff` 资源的浅拷贝。这违反了 RAII，因为共享资源的生命周期现在可能依赖于两个所有者。这意味着我们需要处理调用\
  \ `OptionInfo` 的拷贝构造函数或拷贝赋值运算符时发生的情况。\n\n\n\n\n简单的解决方案是直接禁止复制，这与在资产或衍生品定价时有时会遇到的实际情况是一致的。一个带有一个赔付函数（payoff）的\
  \ `OptionInfo` 对象会被创建一次，传递给定价模型，然后让其超出作用域。如果交易员或分析师需要重新评估期权，可以一个新的期权对象，然后将其传递给同一个定价模型函数。\n\
  \n在 C++03 的时代，我们通常通过将拷贝构造函数和拷贝赋值运算符声明为私有（private）来禁用它们：\n\n```cpp\nclass OptionInfo\n\
  {\npublic:\n    OptionInfo(const Payoff& payoff, double time_to_exp);\n    ~OptionInfo();\n\
  \n    double option_payoff(double spot) const;\n    double time_to_expiration()\
  \ const;\n\nprivate:\n    Payoff* payoff_ptr_;\n    double time_to_exp_;\n\n   \
  \ // 如果我们不需要拷贝对象，将拷贝操作\n    // 声明为私有（C++11 之前）：\n    OptionInfo(const OptionInfo&\
  \ rhs);\n    OptionInfo& operator =(const OptionInfo& rhs);\n};\n```\n\n从技术上讲，尽管将特殊的拷贝操作声明为私有可以防止它们从外部访问，但仍然可以实现一个可以在内部调用的私有拷贝构造函数，同样的私有拷贝赋值运算符。考虑以下来自第\
  \ 2 章 中 `SimpleClass` 示例的修改版本：\n\n```cpp\n// SimpleClass 的修改版本：\nclass SimpleClassPrivateCopy\n\
  {\npublic:\n    SimpleClassPrivateCopy(int k);\n    int get_val() const;\n    void\
  \ reset_val(int k);\n    void copy_mischief(int k);\n\nprivate:\n    int k_{0};\n\
  \n    // 通过将其声明为私有来禁用外部\n    // 拷贝构造函数和拷贝赋值运算符：\n    SimpleClassPrivateCopy(const\
  \ SimpleClassPrivateCopy& rhs);\n    SimpleClassPrivateCopy& operator =(const SimpleClassPrivateCopy&\
  \ rhs);\n};\n```\n\n这防止了外部拷贝，但仍然可以实现可以在内部调用的私有拷贝构造函数，同样的私有拷贝赋值运算符：\n\n```cpp\n//\
  \ 即使声明为私有，仍然可以实现拷贝构造函数：\nSimpleClassPrivateCopy::\n    SimpleClassPrivateCopy(const\
  \ SimpleClassPrivateCopy& copy):\n        k_{copy.k_} {}\n\n// 拷贝赋值运算符，也是私有的\nSimpleClassPrivateCopy&\
  \ SimpleClassPrivateCopy::operator =\n    (const SimpleClassPrivateCopy& copy)\n\
  {\n    k_ = copy.k_;\n    return *this;\n}\n```\n\n此外，尽管拷贝构造函数是私有的，但没有任何东西阻止定义一个在内部创建拷贝的公共成员函数：\n\
  \n```cpp\nvoid SimpleClassPrivateCopy::copy_mischief(int k)\n{\n    SimpleClassPrivateCopy\
  \ scpc{k};\n\n    // 在此处生成拷贝；活动对象被修改：\n    SimpleClassPrivateCopy scpc_copy{scpc};\n\
  \n    // . . .\n}\n```\n\n同样地，私有拷贝赋值运算符也可以被间接调用。\n\nC++11 引入的 `delete` 关键字可以被用来显式地禁用外部和内部的拷贝操作，因此在现代\
  \ C++ 中更于这种方法：\n\n```cpp\nclass OptionInfo\n{\npublic:\n    OptionInfo(const Payoff&\
  \ payoff, double time_to_exp);\n    ~OptionInfo();\n\n    double option_payoff(double\
  \ spot) const;\n    double time_to_expiration() const;\n\n    // 拷贝操作在外部和内部都被禁用：\n\
  \    OptionInfo(const OptionInfo& rhs) = delete;\n    OptionInfo& operator =(const\
  \ OptionInfo& rhs) = delete;\n\n    // . . .\n\nprivate:\n    Payoff* payoff_ptr_;\n\
  \    double time_to_exp_;\n};\n```\n\n通过禁用拷贝操作并结合克隆（clone）方法，我们本质上满足了第一个 RAII 要求。稍后我们将考虑拷贝变为功能性需求。但目前，我们对该问题有一个可行的解决方案，而且它在编程定价模型时也是常用的。\n\
  \n最后，如果对象持有原始指针成员，调用默认的移动构造函数或移动赋值运算符也是危险的。因此现在对于 `OptionInfo`，我们也可以通过再次使用 `delete`\
  \ 禁用这些特殊的移动成员函数来防止这些问题：\n\n```cpp\nclass OptionInfo\n{\npublic:\n\n    // . . .\n\
  \n    // 移动操作稍后讨论；现在也先禁用它们：\n    OptionInfo(OptionInfo& rhs) = delete;\n    OptionInfo&\
  \ operator =(OptionInfo&& rhs) = delete;\n\n    // . . .\n};\n```\n\n## 实现 OptionInfo\
  \ 析构函数\n\n为了满足我们 RAII 示例中的要求 2，还需要一个重要步骤。考虑如果 `OptionInfo` 对象以当前形式超出作用域会发生什么：它的默认析构函数会被调用，但包含成员变量的内存不会被释放并返回系统。因此，必须用用户定义的析构函数替换默认析构函数，该析构函数将释放\
  \ `payoff_ptr_` 指向的内存。\n\n析构函数只需要一行代码——即调用 `delete` 运算符——但未能实现将带来内存资源未释放（内存泄漏）和运行时未定义的风险。析构函数的声明和实现所示：\n\
  \n```cpp\n// 析构函数的声明：\npublic:\n    . . .\n    ~OptionInfo();\n\n// 析构函数的实现：\nOptionInfo::~OptionInfo()\n\
  {\n    delete payoff_ptr_;\n}\n```\n\n当 `OptionInfo` 不再需要时，`Payoff` 资源占用的内存随后被释放。\n\
  \n## 为期权定价\n\n我们为什么要经历这一切呢？最终，我们想要构造一个带有赔付函数的 `OptionInfo`，然后可以安全地传递给所需的数值定价方法。一个例子是二叉树模型，它根据一组预测价格需要赔付函数和到期时间。其他市场数据，如波动率、股息和无风险利率，以及所需的步数，也是作为例如\
  \ `BinomialLattice` 对象的构造参数传入的，如下所示：\n\n```cpp\nenum class OptType\n{\n    European,\n\
  \    American\n};\n\nclass BinomialLattice\n{\n    public:\n        BinomialLattice(const\
  \ OptionInfo& opt, double vol, double int_rate,\n            unsigned time_steps,\
  \ double div_rate);\n\n        double calc_price(double spot, OptType opt_type);\n\
  };\n```\n\n价格通过 `calc_price()` 成员函数获取，该函数接收标的和期权类型（例如欧式或美式）。二叉树的完整实现将在第 9 章 中介绍。\n\
  \n相同的 `OptionInfo` 类可以重用于其他数值定价模型，例如蒙特卡洛模型。本章的主要目标正如你目前所看到的，是开发期权信息的组，包括其赔付函数，然后可以安全地传递给所需的数值定价方法，如图\
  \ 3-3](#ch03.html_fig-3-3) 所示。\n\n现在将所有内容整合到一个高层示例中，我们将创建一个行权价为 75 的 `CallPayoff`\
  \ 对象。然后我们使用它来构造一个例如剩余期限半年的 `OptionInfo`：\n\n```cpp\nCallPayoff call_payoff{75.0};\n\
  OptionInfo call_opt{call_payoff, 0.5};\n```\n\n\n\n随后，行权价为 75 且距离到期还有六个月的美式看涨期权可以使用\
  \ `BinomialLattice` 对象进行计算，方法是为其提供年波动率、无风险利率、网格所需的步数以及标的股票年连续股息率等市场数据参数。`calc_price(.)`成员函数负责估值，例如给定标的股票现价（报价为\
  \ 85）和期权类型：\n\n```\nBinomialLattice binomial_lattice{call_opt, 0.25, 0.04, 100,\
  \ 0.02};\ndouble opt_val = binomial_lattice.calc_price(85.0, OptType::American);\n\
  ```\n\n注意，`BinomialLattice` 并不关心该期权是看涨还是看跌，因为绑定到其 `OptionInfo` 构造函数参数的 `call_opt`\
  \ 参数仅负责生成收益类型。这在运行时通过多态决定的，并随后在网格模型内部被调用。\n\n这避免了表示收益、期权和定价模型的类之间的紧密耦合，反而允许了代码重用，这是利用面向对象编程的最重要且基础的动机之一。另一个值得记住的点是，`OptionInfo`\
  \ 根据 RAII 设计，在析构函数中删除其 `payoff_ptr_` 资源来完成清理，这意味着在 `BinomialLattice` 内部实现的模型代码无需承担这一责任。\n\
  \n## 实现拷贝操作\n\n你之前看到，禁用拷贝是避免浅拷贝的一种快速且简单的修复方法，这在某些情况下是没问题的。然而，在其他情况下，我们可能需要获取对象的拷贝，例如在一个交易录入系统中，可能会输入多个具有相同或部分重叠合约数据的交易。可能重要的是，这引出了稍后将讨论的关于特殊成员函数的最佳实践讨论。\n\
  \n但首先，为了确保[深拷贝](https://oreil.ly/YfvWI) 并从而符合 RAII，我们需要编写拷贝构造函数和拷贝赋值运算符的实现。这意味着我们首先需要移除之前使用的\
  \ `delete` 设置：\n\n```\nClass OptionInfo\n{\npublic:\n\n    // . . .\n\n    OptionInfo(const\
  \ OptionInfo& rhs);\n    OptionInfo& operator =(const OptionInfo& rhs);\n\n    //\
  \ . . .\n\n};\n```\n\n拷贝构造函数的实现要求从被拷贝的对象单独初始化每个数据成员。初始化 `time_to_exp_` 是轻而易举的，但我们需要在堆上创建一个\
  \ `Payoff` 成员的拷贝，并为其定义一个新指针。大部分工作已经在每个派生收益对象类型的虚方法 `clone()` 中完成，因此实现拷贝构造函数不需要做太多工作：\n\
  \n```\nOptionInfo::OptionInfo(const OptionInfo& rhs):\n    payoff_ptr_{rhs.payoff_ptr_->clone()},\n\
  \    time_to_exp_{rhs.time_to_expiration()} {}\n```\n\n拷贝赋值运算符的实现似乎也相当相似，但实际上，某些问题使其并不那么简单。假设我们按照如下方式天真地操作：在重新分配\
  \ `payoff_ptr_` 成员之前，我们需要通过调用 `delete` 运算符来释放当前成员指向的内存：\n\n```\nOptionInfo& OptionInfo::operator\
  \ =(const OptionInfo& rhs)\n{\n    // 简真的实现\n    delete payoff_ptr_;\n    payoff_ptr_\
  \ = rhs.payoff_ptr_->clone();\n    time_to_exp_ = rhs.time_to_expiration();\n}\n\
  ```\n\n这里的问题是，我们可能会遇到将对象赋值给自身的情况。以下情况显而易见，但有时自我赋值会被错误地掩盖，并不明显：\n\n```\nOptionInfo\
  \ opt_01{. . .};\nopt_01 = opt_01;\n```\n\n在这种情况下，`opt_01` 的 `payoff_ptr_` 成员将被删除。通常情况下，在已删除的对象上调用成员函数可能会导致未定义行为，这可能导致系统崩溃，甚至更糟糕——数据损坏传播到数据库。\n\
  \n你可能会遇到的解决方案之一是首先检查是否尝试拷贝同一个对象的拷贝：\n\n```\nOptionInfo& OptionInfo::operator =(const\
  \ OptionInfo& rhs)\n{\n    // 需要检查是否尝试拷贝同一个对象：\n    if (this != &rhs)\n    {\n \
  \       delete payoff_ptr_;\n        payoff_ptr_ = rhs.payoff_ptr_->clone();\n \
  \       time_to_exp_ = rhs.time_to_expiration();\n    }\n    return *this;\n}\n\
  ```\n\n如果 `rhs` 和活动对象（`*this`）不同，则删除 `payoff_ptr_` 资源，并调用每个数据成员的单独赋值运算符。\n\n然而，在处理指针时，出现问题是生活中的常态。特别是，如果\
  \ `clone()` 函数无法分配内存，将抛出 `std::bad_alloc` 异常，并且活动的 `OptionInfo` 对象将留下无效的 `payoff_ptr_`\
  \ 资源。此外，尽管自我赋值很少发生，但每次使用拷贝赋值时都需要执行 `if` 语句。\n\n不过，有一个圆满的结局。正如*Effective C++*中所述，“使\
  \ `operator=` 异常安全通常会使其具有自我安全性。”这可以通过采用拷贝并交换惯用（copy-and-swap idiom）来实现，该惯用法包括编写一个\
  \ `swap()` 成员函数，其中 `<utility>` 中提供的 `std::swap()` 函数交换每个数据成员。`std::swap()` 的作用正如其名：它交换两个对象的状态。一个关于\
  \ `int` 值的简单示例展示了其工作原理：\n\n```\n#include <utility>\n\n// . . .\n\nint a = 1, b =\
  \ 2;\nstd::swap(a, b); // 现在 a = 2, b = 1\n```\n\n在交换指针时 `std::swap()` 也是安全的，因为它交换的是内存地址。没有发生内存重新分配，所以不需要担心内存泄漏。\n\
  \n`swap()` 成员函数的工作方式如下。首先，在 `OptionInfo` 中将其为一个接收非 `const` 引用对象的 `void` 成员函数，以便它是可修改的：\n\
  \n```\nvoid swap(OptionInfo& rhs);\n```\n\n然后，在实现内部，对每个数据成员应用 `std::swap()` 函数：\n\
  \n```\nvoid OptionInfo::swap(OptionInfo& rhs)\n{\n    using std::swap;\n    swap(payoff_ptr_,\
  \ rhs.payoff_ptr_);\n    swap(time_to_exp_, rhs.time_to_exp_);\n}\n```\n\n\n\n\n\
  ```cpp\nOptionInfo& OptionInfo::operator =(const OptionInfo& rhs)\n{\n    OptionInfo{rhs}.swap(*this);\n\
  \    return *this;\n}\n```\n\n考虑到 `swap(.)` 成员函数不会抛出异常，最坏的情况——尽管不太可能——是在 `OptionInfo`\
  \ 拷贝构造函数初始化时，为 `payoff_ptr_` 成员分配内存失败。但即使在这种情况下，异常也会在构造函数内部抛出（并可以在本地处理），而不会在拷贝赋值运算符的定义内部抛出。对象的副本将无法生成，但其原始状态将得以保持。\n\
  \n因此，实现了了**强异常保证**（strong exception guarantee）。这意味着“如果从[函数] `f` 内部抛出异常，则 `f` 修改的所有对象的状态都将恢复到在调用\
  \ `f` 之前的状态。”^ 并且，原始的自赋值问题也得到了避免。\n\n## （旧的）三规则\n\n前一节说明了一个在 C++11 时代（即移动操作和智能指针时代到来）之前常用的**三规则**（rule\
  \ of three）示例。它指出，如果声明了析构函数、拷贝构造函数或拷贝赋值运算符中的任何一个，我们就应该显式地声明另外两个（或者简单地禁用拷贝操作并实现析构函数）。\n\
  \n其含义是，如果实现了这些中的任何一个，成员资源可能需要特别关注（特别是当原始指针成员指向已分配的内存时，正如刚才的示例所示）。在第一种情况下，不需要拷贝，因此我们仅在声明中禁用了拷贝构造函数和拷贝赋值运算符，但我们确实实现了析构函数，以便当外层的\
  \ `OptionInfo` 对象离开作用域时，其 `Payoff` 资源指向的内存可以被正确释放。当假设拷贝是必要需求时，则实现了特殊的拷贝函数以及析构函数。\n\
  \n无论在何种情况下，这三个特殊的成员函数在防止内存泄漏和/或防止浅拷贝方面都发挥了作用，因此也符合 RAII。\n\n这三规则是 C++11 发布后出现的**五规则**（rule\
  \ of five）的前身，额外的两个规则与移动构造函数和移动赋值运算符有关。然而，在回到这个主题之前，我们将首先查看智能指针，因为它们对随后的内容也相关。\n\
  \n## 介绍智能指针\n\n智能指针在 C++11 中引入，它们消除了许多与原始指针和堆内存分配相关的风险。其中之一的**唯一指针**（`std::unique_ptr`）代表了对指向对象的唯一（独占）所有。更具体地说，它确保了同一时刻只能存在指向特定内存位置的*一个*唯一指针。这是一个极低成本抽象示例，与传统的原始指针相比（至少在发布模式编译下），性能结果几乎或完全没有可感知的差异。唯一指针的所有权通过移动语义进行转移，因为唯一指针代表对指向对象的单一所有权，因此唯一指针不能被拷贝。\n\
  \n除了唯一指针，另外两个智能指针——**共享指针**（shared pointers）和**弱指针**（weak pointers）也在 C++11 中被引入。它们在用于分配和管理内存时，也有助于防止与标准原始指针相关的问题。事实上，正如《核心指南》（Core\
  \ Guidelines）所述，可能时应优先使用唯一或共享指针而非原始指针，“以免忘记删除对象。”^\n\n我们对智能指针的讨论将主要关注唯一指针，它们将是本书主要的首选智能指针。在[“使用唯一指针管理资源”]中，我们将讨论如何用它们替换早期版本\
  \ RAII 示例中的原始指针。唯一指针提供了一种更安全的替代方案，同时通过消除所有者构造函数中的对象拷贝提供了性能提升。当你回到本章末尾的收益和期权示例时，你会看到这一点。\n\
  \n我们还将查看共享指针，但只有在需要对资源进行共享所有时才应该使用它们，例如一个提供实时更新市场数据的对象被多个交易任务共享。共享指针也用于多线程情况，即被指向的对象至少被两个线程共享，而你不知道哪一个将负责对象的销毁。\n\
  \n弱指针用于打破循环依赖，这种依赖可能出现在共享指针的引用计数永远无法变为零的情况下。这是一个高级的主题，此处仅为了完整性而提及。\n\n## 唯一指针\n\n\
  **唯一指针**（unique pointer）对指向的对象拥有唯一（独占）所有权。它不能被拷贝，但所有权可以通过移动语义转移。《核心指南》建议在通常需要原始指针的地方作为通用规则使用唯一指针。更具体，再次引用《核心指南》，使用唯一指针“是避免泄漏最简单的方法。它是可靠的，让类型系统承担大部分工作来验证所有权的安全性，增加了可读性，并且具有零或接近于零的运行时代价。”^\n\
  \n唯一指针由标准库中的类模板定义，表示为 `std::unique_ptr<T>`，模板参数为 `T`。对于介绍性示例，考虑指向 `string` 对象的简单情况。通常推荐的创建唯一指针的方法是使用函数模板\
  \ `std::make_unique<T>(.)`，该模板随后在 C++14 中添加到标准库中。与原始指针一样，唯一指针可以在两行中分别声明和定义（例如作为对象成员单独声明和初始化），或者通过使用\
  \ `auto` 进行隐式类型（通常建议这样做以避免浪费周期）合并在一行中，因为赋值的右侧已经清楚创建了什么。使用智能指针需要包含标准库头 `<memory>`：\n\
  \n```cpp\n#include <memory>     // 用于智能指针\n#include <utility>    // std::move\n\n\
  std::unique_ptr<string> ptr_01;\n// . .\nptr_01 = std::make_unique<string>(\"To\
  \ err is human\");\n\n// 或者（如果可能更好），在一行：\nauto ptr_02 =\n    std::make_unique<string>(\"\
  To moo, bovine\");\n```\n\n可以通过通常的方式解引用唯一指针来获取实际字符串对象，使用 `*` 运算符：\n\n```cpp\ncout\
  \ << format(\"Contents of ptr_01: {}\\n\", *ptr_01);\ncout << format(\"Contents\
  \ of ptr_02: {}\\n\", *ptr_02);\n```\n\n输出为：\n\n```\nContents of ptr_01: To err\
  \ is human\nContents of ptr_02: To moo, bovine\n```\n\n接下来，我们将分配内存的所有权转移另一个唯一指针，例如\
  \ `ptr_03`。这是通过移动语义实现的：\n\n```cpp\nauto ptr_03 = std::move(ptr_02);\n```\n\n唯一指针\
  \ `ptr_02` 被设置为空状态，因为 `ptr_03 现在接管了第二个 `std::string` 对象。尝试输出 `*ptr_02` 或在其他地方它会导致运行时错误。虽然唯一指针提供了一种安全且高效的管理分配堆内存的方法，但这表明在使用时有时仍需要小心，因为这是一个在编译时无法检测到并极可能导致程序崩溃的问题。\n\
  \n如果存在任何可能的疑问，可以通过检查指针是否为空来检查它是否确实有效。这可以像处理原始指针一样地完成。\n\n\n\n\n```\nif (ptr_02)\n\
  {\n    cout << format(\"ptr_02 is not null\\n\");\n}\nelse\n{\n    cout << format(\"\
  ptr_02 is null\\n\");\n}\n```\n\n在不进行检查的情况下尝试解引用 `ptr_02`：\n\n```\nauto s = *ptr_02;\
  \    // ptr_02 为空 -- 不要这样做！\n```\n\n如前所述，这可能会导致（严重的）未定义行为，尽管取决于你的编译器设置，你可能至少会先得到一个编译时的\
  \ `warning`。\n\n向所指向的内存分配新数据也与原始指针相同，通过先解引用指针来实现：\n\n```\n*ptr_01 = \"To bark is\
  \ canine\";\n*ptr_03 = \"To purr, feline\";\n```\n\n最后，如果唯一指针在离开作用范围之前不再需要，可以通过它的\
  \ `reset()` 成员函数显式地删除并将其设置为空：\n\n```\nptr_01.reset();\nif (!ptr_01)\n{\n    cout\
  \ << \"ptr_01 is null\" << \"\\n\";    // 将被显示\n}\n```\n\n通过将唯一指针赋值为 `nullptr` 可以获得相同的结果，这是\
  \ C++11 中引入的另一个关键字：\n\n```\nptr_03 = nullptr\nif (!ptr_03)\n{\n    cout << \"ptr_03\
  \ is null\" << \"\\n\";    // 将被显示\n}\n```\n\n然而需要注意的是，如果你发现自己在函数退出之前重置或置空唯一指针，这可能表明你的函数太长了。\n\
  \n## 共享指针 (Shared Pointers)\n\n与唯一指针（正如其名称所示，它唯一负责内存中的被指向对象）不同，共享指针可以与其他共享指针共享这种责任。虽然与原始指针相似，但共享指针是一种安全的替代方案，因为在指向给定对象的最后一个共享指针离开作用范围之前，所指向的内存不会被释放。这是在后台通过`引用计数`（reference\
  \ counting）实现的，它记录了指向公共堆内存块的活动共享指针的数量。所指向的对象将一直存在直到计数变为零，只有在此时内存才会被释放，从而防止了内存泄漏和运行时可能的未定义行为。\n\
  \n与唯一指针类似，可以通过调用 `make_shared(.)` 函数创建共享指针。这可以再次分两行执行，也可以在一行内执行（使用 `auto`，且通常更推荐），如下所示：\n\
  \n```\nstd::shared_ptr<std::string> sp_one;\n// . . .\nsp_one = std::make_shared<string>(\"\
  To err is expected\");\n\n// 单行\nauto sp_two =\n    std::make_shared<string>(\"\
  To nap is supine\");\n```\n\n像原始指针一样，再次通过解引用来访问所指向的对象：\n\n```\ncout << format(\"\
  Contents of sp_one: {}\\n\", *sp_one);\ncout << format(\"Contents of sp_two: {}\\\
  n\", *sp_two);\n```\n\n输出为：\n\n```\nContents of sp_one: To err is expected\nContents\
  \ of sp_two: To nap is supine\n```\n\n为了查看引用计数在这里是如何工作的，我们可以首先调用 `shared_ptr` 的\
  \ `use_count()` 成员函数。以下显示的值为 `1`，因为在这一阶段只有一个指针指向堆内存中的 `string` 对象：\n\n```\ncout\
  \ << format(\"How many pointers are there to sp_one? {}\\n\",\n    sp_one.use_count());\
  \    // count = 1\n```\n\n使用共享指针，我们可以创建指向同一对象的多个指针，类似于原始指针：\n\n```\nauto sp_one_2\
  \ = sp_one;\nauto sp_one_3 = sp_one_2;\n```\n\n现在，如果对这些共享指针对象中的任何一个调用 `use_count()`，将返回值\
  \ `3`。与原始指针不同，没有 `delete` 操作符。相反，如果在 `sp_one_2` 上调用 `reset()` 函数，那么该指针将为空，引用计数将下降到\
  \ 2：\n\n```\nsp_one_2.reset();\n\nauto count = sp_one.use_count();    // = 2\n```\n\
  \n如果这里的 `shared_ptr` 代码示例是在一个函数内部，那么当 `sp_one` 和 `sp_one_3` 在函数块结束离开作用范围时，它们都会被销毁，所指向的\
  \ `string` 对象占据的内存将随着引用计数变为 0 而释放。\n\n在金融领域使用共享指针的示例：常见的商业交易系统软件允许交易员输入交易、监控并重新评估头寸，以及对交易账目运行风险分析。这些任务在工作站的独立应用程序窗口中视觉化，可以并发打开，并且多个窗口可能同时打开。它们通常还依赖于内部服务或外部供应商提供的实时市场数据（只读），这些数据从价格馈中实时更新。在第一个任务时会创建一个指向包含请求数据的对象的共享指针，随后为后续任务创建额外的共享指针。\n\
  \n由于多处地方使用同一组市场数据，你不希望在所有窗口完成对数据的使用之前删除内存。交易系统中的多个窗口可能会使用市场数据，包括：\n\n\n\n现在我们考虑将\
  \ `OptionInfo` 对象中的 `Payoff` 成员替换为 `unique_ptr`。首先，通过写出 `OptionInfo` 类的声明，我们可以了解它的样子。接口是清晰的，预期语义也显而易见：\n\
  \n```cpp\n#include <memory>     // std::unique_ptr\n\nclass OptionInfo\n{\npublic:\n\
  \    OptionInfo(unique_ptr<Payoff> payoff, double time_to_exp);\n    double option_payoff(double\
  \ spot) const;\n    double time_expiration() const;\n\nprivate:\n    unique_ptr<Payoff>\
  \ payoff_ptr_;\n    double time_exp_;\n};\n```\n注意，这里没有声明析构函数，因为当 `OptionInfo` 对象离开范围时，`unique_ptr`会自动处理内存释放。编译器提供的默认析构函数现在足够了，从而消除了忘记删除原始指针的问题。为了初始化\
  \ `payoff_ptr_` 成员，在初始化中应用了移动语义，如下：\n\n```cpp\nOptionInfo::OptionInfo(unique_ptr<Payoff>\
  \ payoff, double time_to_exp) :\n    payoff_ptr_{std::move(payoff)}, time_exp_{time_to_exp}\
  \ {}\n```\n\n结果是，不需要调用 `Payoff` 派生的 `clone()` 函数，因为我们只是在移动 `unique_ptr`。现在出现了两个非常好的结论：\n\
  \n*   不再从 `clone` 函数生成生成对象的拷贝，这意味着代码效率更高。\n*   出错机会减少，因为构造时不再涉及手动内存分配，且我们没有在析构函数中忘记删除资源的风险。\n\
  \ncall option 的构造函数和 payoff 的定义与原始指针版本相同，因此保留了相同的类实现，只是没有 `clone()` 成员函数（目前）：\n\n\
  ```cpp\nCallPayoff::CallPayoff(double strike) :strike_{strike} {}\n\ndouble CallPayoff::payoff(double\
  \ spot) const\n{\n    return std::max(spot - strike_, 0.0);\n}\n```\n\nput 同样相似，只是\
  \ spot 和 strike 的位置反过来了。回到更新后的 `OptionInfo` 类，`option_payoff(.)` 成员函数的实现与之前完全相同，因为解引用\
  \ `unique_ptr` 的语法是一样的：\n\n```cpp\ndouble OptionInfo::option_payoff(double spot)\
  \ const\n{\n    return payoff_ptr_->payoff(spot);\n}\n```\n\n所以现在我们可以在不生成 payoff\
  \ 对象拷贝的情况下构造 `OptionInfo` 对象。一种方法是为特定的 payoff 类型创建一个 `unique_ptr`，然后在构造函数中使用 `std::move(.)`：\n\
  \n```cpp\nauto call_payoff = std::make_unique<CallPayoff>(75.0);\nOptionInfo call_opt{std::move(call_payoff),\
  \ 0.5};\n```\n\n或者，也可以一行代码编写，在构造 `OptionInfo` 对象时通过 `std::make_unique` 创建匿名临时 `unique_ptr`：\n\
  \n```cpp\nOptionInfo call_opt{std::make_unique<CallPayoff>(75.0), 0.5};\n```\n\n\
  同样值得注意的是不需要担心浅拷贝，因为编译器阻止了对带有 `unique_ptr` 成员对象的拷贝尝试，这与在运行时遇到问题相比再次是件好事：\n\n```cpp\n\
  // 编译失败\n因此，我们不需要显式禁用拷贝操作。另一方面，由于 `unique_ptr` 是可移动的，通过简单的使用默认移动构造函数移动 `OptionInfo`\
  \ 对象是完全合：\n\n```cpp\nOptionInfo call_move{std::move(call_opt)};\n```\n\n或者使用移动赋值运算符：\n\
  \n```cpp\nOptionInfo call_move_assgn{std::make_unique<CallPayoff>(85.0), 0.45};\n\
  // . . .\ncall_move_assgn = std::move(call_move);\n```\n\n总结一下，通过将 C++11 之前的拷贝初始化方法替换为智能指针和移动语义，我们得到了：\n\
  \n*   高效的代码，因为 payoff 的初始化不需要对象拷贝（被移动 `unique_ptr` 取代）\n*   更安全的代码，防止与原始指针常见的未定义行为和内存泄漏\n\
  *   不需要实现析构函数，因为代码从显式管理资源变为委托给 `unique_ptr` 对象\n*   编译时防止浅拷贝\n*   安全使用编译器提供的默认移动构造函数和移动赋值，无需用户定义实现\n\
  \n最终，我们保留了对 RAII 的兼容性，因为这两个要求得到了满足，但方式略有不同且有所改进：\n\n*   在构造 `OptionInfo` 实例时，通过转移持有相应\
  \ `Payoff` 资源的堆地址的唯一控制权来初始化 `payoff_ptr_`。\n*   该资源将在所有者的生命周期内持续，并且只有在调用 `OptionInfo`\
  \ 的默认析构函数时才会被销毁。\n\n也就是说，当使用 `unique_ptr` 时，`Payoff` 资源的生命周期仍与其 `OptionInfo` 生命周期绑定，符合\
  \ RAII 的要求。此外，与“指针所有权”中的版本相比，我们获得了上述优势。\n\n## 在定价模型中使用结果\n\n在使用“虚拟构造函数”的原始指针版本中，我们以一个二叉树模型的示例草图结束。为了提供一点变化，我们将现代版本（目前再次带有拷贝操作）应用于蒙特卡洛定价模型，其建议的声明如下（再次，这是一个高层草图；实现示例见于第\
  \ 6 章）：\n\n```cpp\nMCOptionValuation\n{\npublic:\n    MCOptionValuation(OptionInfo&&\
  \ opt, double vol, double int_rate, int time_steps,\n        double div_rate);\n\
  \n    double calc_price(double spot, int unif_start_seed, int num_scenarios);\n\n\
  private:\n    OptionInfo opt_;\n\n    . . .\n};\n```\n\n注意 `OptionInfo` 参数类型可以作为蒙特卡洛定价模型的构造函数参数，就像它用于一个稍作更新的二叉树类一样。通常情况下，这意味着\
  \ `OptionInfo` 类只需要编写一次即可在多个定价模型中复用。它携带了关于 payoff（持有看涨或看跌资源）以及剩余到期时间的信息，这意味着在构造模型对象时，模型对这些设置是不敏感的。\n\
  \n除了标的价格之外的所有市场数据再次被带入模型构造函数，以及用户提供的每个模拟时间步数的参数。标的价格参数同样被推迟到使用 `calc_price(.)` 成员函数计算期权价值时，此时设置了随机种子和模拟场景数量的用户参数。\n\
  \n顺便提一下，与格点模型相反，基础蒙特卡洛方法无法处理美式期权，因为可能提前行权，因此在 `calc_price(.)` 成员函数中没有 `OptType`\
  \ 参数。然而，蒙特卡洛模拟确实需要一个起始种子值和随机股票价格路径场景的数量。对于可以评估最优提前行权的蒙特卡洛模型，Longstaff 和 Schwartz\
  \ 最小二乘蒙特卡洛模型经常被引用。\n\n\n\n\n蒙特卡洛方法与二项树网格案例之间的共同点是，我们最终可以使用相同的 `OptionInfo` 类型——它仅携带相关的收益函数（payoff）成员和到期时间——而其余的市场数据仅在构建定价模型对象以及调用\
  \ `calc_price(.)` 成员函数时才需要。这意味着我们可以将不同类之间的分工分离开来，并在定价模型的上下文中复用它们，而无需重复代码。这希望能够展示面向对象编程的一个关键核心动机，以及为什么它在金融软件开发中一直保持流行。\n\
  \n## 如果需要拷贝操作\n\n对于如前几个示例所示的定价模型应用，类上的拷贝操作通常是不必要的。而且同样，由于存在 `unique_ptr` 成员，尝试使用默认拷贝构造函数将在编译时方便地（conveniently）失败，从而防止任何相关的未定义行为的发生。\n\
  \n另一方面，与之前一样，有时复制是必须的。为此，我们需要一个更新后的 `clone()` 函数，但现在仅用于构造函数。这为我们提供了如下声明：\n\n```\n\
  class Payoff\n{\npublic:\n    virtual double payoff(double price) const = 0;\n \
  \   virtual std::unique_ptr<Payoff> clone() const = 0;\n    virtual ~Payoff() =\
  \ default;\n};\n\nclass CallPayoff final : public Payoff\n{\npublic:\n    CallPayoff(double\
  \ strike);\n    double payoff(double price) const override;\n    std::unique_ptr<Payoff>\
  \ clone() const override; // clone() 在此处返回\n                                   \
  \                 // unique_ptr<Payoff>,\n                                     \
  \               // 不是 unique_ptr<CallPayoff>\n\nprivate:\n    double strike_;\n\
  };\n\nclass PutPayoff final : public Payoff\n{\npublic:\n    PutPayoff(double strike);\n\
  \    double payoff(double price) const override;\n    std::unique_ptr<Payoff> clone()\
  \ const override; // clone() 在此处返回\n                                           \
  \         // unique_ptr<Payoff>,\n                                             \
  \       // 不是 unique_ptr<PutPayoff>\n\nprivate:\n    double strike_;\n};\n```\n\n\
  ### 重新回顾 Clone 方法\n\n虽然在构建现代化的 `OptionInfo` 对象时克隆收益函数仍然是不必要的，但在它的拷贝构造函数中是需要它的。存在一个语义上的区别：其收益资源的返回类型将是\
  \ `unique_ptr<Payoff>` 类型，而不是指向特定派生收益的原始指针。\n\n在构建现代化的 `OptionInfo` 对象时，克隆收益函数仍然是不必要的，但在它的拷贝构造函数中是需要它的。存在一个语义上的区别：其收益资源的返回类型将是\
  \ `unique_ptr<Payoff>` 类型，而不是指向特定派生收益的原始指针。\n\n在构建现代化的 `OptionInfo` 对象时，克隆收益函数仍然是不必要的，但在它的拷贝构造函数中是需要它的。\n\
  \n更新后的 `clone()` 方法返回一个 `unique_ptr<Payoff>` 拷贝：\n\n```\nstd::unique_ptr<Payoff>\
  \ CallPayoff::clone() const\n{\n    return std::make_unique<CallPayoff>(*this);\n\
  }\n```\n\n### 拷贝操作的实现\n\n在构建现代化的 `OptionInfo` 对象时，克隆收益函数仍然是不必要的，但在它的拷贝构造函数中是需要它的。存在一个语义上的区别：其收益资源的返回类型将是\
  \ `unique_ptr<Payoff>` 类型，而不是指向特定派生收益的原始指针。\n\n在构建现代化的 `OptionInfo` 对象时，克隆收益函数仍然是不必要的，但在它的拷贝构造函数中是需要它的。\n\
  \n更新后的 `clone()` 方法返回一个 `unique_ptr<Payoff>` 拷贝：\n\n```cpp\nstd::unique_ptr<Payoff>\
  \ CallPayoff::clone() const\n{\n    return std::make_unique<CallPayoff>(*this);\n\
  }\n```\n\n### 拷贝操作实现\n\n在构建现代化的 `OptionInfo` 对象时，克隆收益函数仍然是不必要的，但在它的拷贝构造函数中是需要它的。存在一个语义上的区别：其收益资源的返回类型将是\
  \ `unique_ptr<Payoff>` 类型，而不是指向特定派生收益的原始指针。\n\n在构建现代化的 `OptionInfo` 对象时，克隆收益函数仍然是不必要的，但在它的拷贝构造函数中是需要它的。\n\
  \n更新后的 `clone()` 方法返回一个 `unique_ptr<Payoff>` 拷贝：\n\n```cpp\nstd::unique_ptr<Payoff>\
  \ PutPayoff::clone() const\n{\n    return std::make_unique<PutPayoff>(*this);\n\
  }\n```\n\n在构建现代化的 `OptionInfo` 对象时，克隆收益函数仍然是不必要的，但在它的拷贝构造函数中是需要它的。\n\n### 拷贝操作的实现\n\
  \n拷贝构造函数的实现并不痛苦，这通常是赋值的：\n\n```cpp\nvoid OptionInfo::swap(OptionInfo& rhs) noexcept\n\
  {\n    using std::swap;\n    swap(payoff_ptr_, rhs.payoff_ptr_);\n    swap(time_to_exp_,\
  \ rhs.time_to_exp_);\n}\n```\n\n对于拷贝赋值运算符，语法与原始指针版本完全相同，只是增加了 `swap()` 方法：\n\n```cpp\n\
  OptionInfo& OptionInfo::operator =(const OptionInfo& rhs)\n{\n    OptionInfo{rhs}.swap(*this);\n\
  \    return *this;\n}\n```\n\n这通过遵循强异常保证再次避免了与自赋值相关的问题。\n\n将 `noexcept` 标记应用于 `swap(.)`\
  \ 成员函数的实现在技术上不会影响函数的行为，因为它已经保证了不会抛出异常。\n\n声明函数为 `noexcept` 的另一个重要好处是，它还让编译器能够避免“产生额外的阻碍优化的代码”。^(8)\n\
  \n假设，例如，在 `swap(.)` 实现中不小心放置了一行抛出 `std::runtime_error` 的代码。根据你的编译器及其设置，它*可能会*发出警告。在运行时，由于函数违反了标记为\
  \ `noexcept` 的约定，程序将在该处终止：\n\n```cpp\nvoid OptionInfo::swap(OptionInfo& rhs) noexcept\n\
  {\n    using std::swap;\n    swap(payoff_ptr_, rhs.payoff_ptr_);\n    swap(time_to_exp_,\
  \ rhs.time_to_exp_);\n\n    // 为了演示——千万不要这样做！\n    // 程序将终止。\n    throw std::runtime_error{\"\
  Error: 粗心编程!\"};\n}\n```\n\n### 零规则/五规则\n\n如前一节所述，我们还没有完全完成，因为实现拷贝成员函数将影响默认移动特殊成员函数的行为。\n\
  \n\n\n\n回想带有原始指针 `Payoff` 成员的 `OptionInfo` 版本，我们讨论过 C++11 之前的“**三规则**”（rule of three），该规则指出，如果定义了拷贝构造函数、拷贝赋值运算符或析构函数中的任何一个，那么其余两个也应该存在用户定义的版本（包括禁用拷贝构造函数/赋值运算符的选项）。\n\
  \n随着 C++11 增加了 `move constructors` 和 `move assignment operators`，这意味着需要额外考虑另外两个特殊成员函数。因此，情况变得更加复杂，其默认行为取决于这五个函数中的哪一个或哪几个被定义：\n\
  \n- 如果定义了拷贝构造函数或拷贝赋值运算符（或两者都有），编译器提供的默认移动操作将被禁用。\n- 如果定义了析构函数，也会得到相同的结果。\n\n糟糕糟糕，代码可以编译并运行，但移动操作将被替换为相应的拷贝操作，这意味着从移动语义中预期的任何优化在运行时都会无声地失效。某些编译器可能会发出警告，但另一些则不会，因此这是另一个可能未被检测到的问题。\n\
  \n出于这些原因，“**五规则**”（rule of five）取代了三规则，规定如下：如果定义了五个特殊函数中的任何一个，请包含其余四个的定义。这可以包括在适当的情况下仅将它们声明为\
  \ `default` 或 `delete`，并将实现的生成留给编译器。\n\n为了确保默认移动操作按我们的预期方式运行，当拷贝操作由用户定义时，我们需要显式地将移动操作设置为\
  \ `default`，为了保险起见，析构函数也是如此，尽管释放由 `payoff_ptr_` 指向内存的责任已委托给了它的 `unique_ptr` 类型：\n\
  \n```cpp\nclass OptionInfo\n{\npublic:\n    OptionInfo(std::unique_ptr<Payoff> payoff,\
  \ double time_to_exp);\n    double option_payoff(double spot) const;\n    double\
  \ time_to_expiration() const;\n    void swap(OptionInfo& rhs) noexcept;\n\n    OptionInfo(const\
  \ OptionInfo& rhs);                  // 用户定义\n    OptionInfo& operator =(const OptionInfo&\
  \ rhs);      // 用户定义\n\n    // 五规则的剩余部分：\n\n    // 默认移动构造函数\n    OptionInfo(OptionInfo&&\
  \ rhs) = default;\n\n    // 默认移动赋值\n    OptionInfo& operator =(OptionInfo&& rhs)\
  \ = default;\n\n    // 默认析构函数\n    ~OptionInfo() = default;\n\nprivate:\n    std::unique_ptr<Payoff>\
  \ payoff_ptr_;\n    double time_to_exp_;\n};\n```\n\n五规则在《核心指南》（Core Guidelines）中有两个与此处也相关的推论：\n\
  \n1. 如果可以避免定义这五个特殊类函数，请这样做。\n   `OptionInfo` 版本就是这种情况，该版本没有实现用户定义的拷贝函数。这被称为“**零规则**”（rule\
  \ of zero），在可能的情况下应优先考虑。\n\n2. 如果你 `default` 或 `delete` 了任何拷贝、移动或析构函数，请对所有此类函数都进行\
  \ `default` 或 `delete`。\n\n《核心指南》解释道：\n\n> 拷贝、移动和析构的语义是紧密相关的，因此如果需要声明其中一个，那么其他的可能也需要考虑。声明任何拷贝/移动/析构函数（即使是作为\
  \ `default` 或 `delete`）也会抑制移动构造函数和移动赋值运算符的隐式声明。声明移动构造函数或移动赋值运算符（即使是作为 `=default`\
  \ 或 `=delete`）将导致隐式生成的拷贝构造函数或隐式生成的拷贝赋值运算符被定义为删除。因此，一旦声明了其中任何一个，其他的都应该声明，以避免意外的副作用，例如将所有潜在的移动变为更昂贵的拷贝，或使类变为仅支持移动。\n\
  \n关于零规则/五规则提供了更多详细信息的两个启发性博客引用分别出现在 Jonathan Boccara 的 [Fluent C++ 网站](https://oreil.ly/6wHQh)\
  \ 和 Rainer Grimm 的 [Modernes C++](https://oreil.ly/nuFVq)。\n\n### 注意事项\n\n如第 2 章所述，本书侧重于使用默认移动构造函数和默认移动赋值运算符，因为这些对于我们后续章节的需求。然而，如果你对用户定义的情况感兴趣，附录\
  \ C 提供了入门示例。\n\n## 总结\n\n本章的重点是展示如何通过更现代的方法（即采用 `std::unique_ptr`）使所有权对象处理内存资源更安全、更高效，且几乎没有性能损失。在我们使用原始指针的\
  \ RAII 示例中，RAII 提供了安全的代码，但在获取和初始化 `Payoff` 资源时由于拷贝代价带来了性能成本。\n\n通过引入智能指针并使用移动语义在现代语境下实现\
  \ RAII，我们在消除了拷贝开销的同时，在更安全、更洁的代码方面获得了额外收益。五规则引入了两个新的特殊移动成员函数，与旧的三规则相比引入了新的考虑因素。然而，同时通过智能指针处理所有权\
  \ `OptionInfo` 类中的 `Payoff` 资源，将析构函数定义为 `default` 就足够了。这消除了忘记手动编写释放其内存资源的风险。在不实现特殊拷贝函数的情况下，我们可以仅仅遵循零规则，而不是完整的五规则。\n\
  \n尽管 C++ 世界正投入更多关注函数式编程和泛型编程，面向对象编程仍然是一个可行的选择。如果你倾向于使用模板深入研究泛型编程，一些相同的高级面向对象概念仍然可能相关。智能指针——本章涵盖的另一个智能指针——为传统的原始指针提供了更安全的替代方案，允许多个指针指向同一个对象。这有助于防止与原始指针相关的问题：内存泄漏、悬空指针和未定义行为。然而，需要与性能进行权衡，并且在多线程上下文中使用智能指针时需要额外的考虑。\n\
  \n## 更多资源\n\n关于强异常保证的更多信息，Bjarne Stroustrup 编写的 *The C++ Programming Language* 第\
  \ 4 版（Addison-Wesley, 2013）中的[第 13.2 节“异常保证”](https://oreil.ly/5y7-1) 特别有帮助，特别是“关键操作的强保证”这一要点。\n\
  \n要更深入地了解五规则（加上默认构造函数），Bloomberg 演讲系列中的[Howard Hinnant 讲座](https://oreil.ly/UctQ2)（他是\
  \ C++20 中新日期类的主要作者，涵盖于第 7 章](#ch07.html_ch07)）非常有启发性。23:22 处的表格显示了不同特殊函数的组合如何影响其他。为了避免意外，结论是：如果意图是使用构造提供的默认值，请使用零规则；否则，使用五规则。\n\
  \n^(1) Scott Meyers, [*Effective C++*](https://oreil.ly/KsGer), 3rd edition (Addison-Wesley,\
  \ 2005), 第 3 章。\n\n^(2) 对象生命周期与资源管理 (RAII), Microsoft Learn, 2022 年 11 月 6 日。\n\n\
  ^(3) Meyers, [*Effective C++*](https://oreil.ly/k8Jo9), 第 2 章，第 11 项。\n\n^(4) Meyers,\
  \ [*Effective C++*](https://oreil.ly/HR8AT), 第 4 章，第 24 项。\n\n^(5) Matt Austern,\
  \ Standard Library Exception Policy, ISO C++ 提案 N1077, 1997.\n\n\n\n\n\n- [“使用 `unique_ptr`\
  \ 或 `shared_ptr` 来避免忘记 `delete` 使用 `new` 创建的对象`](https://oreil.ly/2PPU5), ISO C++\
  \ Core Guidelines。\n- [“使用 `unique_ptr<T>` 来持有指针”](https://oreil.ly/3Nu3a), ISO\
  \ C++ Core Guidelines。\n- Nicolai M. Josuttis, [*The C++ Standard Library: A Tutorial\
  \ and Reference*](https://oreil.ly/1DtCT), 第 2 版 (Addison-Wesley, 2012), 第 3.1.7\
  \ 节。\n- [“如果你定义或 `=delete` 了任何拷贝、移动或析构函数，请定义或 `=delete` 它们所有的”](https://oreil.ly/gnbK4),\
  \ ISO C++ Core Guidelines。\n\n# 第 4 章 标准模板库 第一部分：容器与迭代器\n\n*标准模板库*（*Standard Template\
  \ Library*，通常称为 *STL*）是 C++ 标准库的一个子集，包含了一系列容器类，包括本章将讨论的 `std::vector`。STL 还提供了一组算法，适用于这些容器以及遵循相同编码规范的其他容器（包括你自己的容器）。\n\
  \nSTL 是 Alexander Stepanov、David Musser 和 Meng Lee 带给世界的一种革命性设计。正如 Bjarne Stroustrup\
  \ 在[《2005 年的 C++》](https://oreil.ly/5OXuY) 中描述的那样，它在 20 世纪 90 年正式集成到 C++ 标准库。这个“库中的库”将算法和容器结合，形成了一个远大于其部分之和的整体。从技术上讲，正如\
  \ Scott Meyers 在 *Effective STL* 的引言中所指出的，“*STL* 并没有官方定义，不同的人在使用该术语时指代不同的含义。”然而，在\
  \ C++ 术语中，它被广泛用于容器类、迭代器和算法。\n\n你已经看到 `vector` 本身就非常有用且多功能。它是 STL 的核心工作负载，也是大多数金融建模应用（以及许多其他应用领域）的首选容器。仅就此而言，详细熟悉\
  \ `vector` 类也是值得的，而且通过这样做，你也将发现更容易理解其他 STL 容器是如何工作的。\n\n让 STL 容器如此强大的是它们与 STL *算法*\
  \ 的关系。算法作用于一种名为*迭代器*的抽象，而不是直接作用于容器本身：\n\n* 容器定义了数据的组织方式。\n* 迭代器描述了如何遍历已组织好的数据。\n\
  * 算法描述了你可以在数据上做什么。\n\n在高级层次上，算法允许你遍历 STL 容器，并可以高效地对每个成员或其子集应用函数，用单条语句替换了迭代的 `for`\
  \ 和 `while` 语句。由于算法是用迭代器而非容器表示的，你可以编写一个算法，并同时利用其对整组容器的影响。\n\n像 `vector` 这样的 STL\
  \ 容器是泛型的，这意味着它们可以持有一组同质的（几乎）任意类型——表示为模板参数——无论是如 `double` 这样的基础数值类型，还是如 `BlackScholes`\
  \ 的类类型（来自第 2 章），只要这些类型符合我们试图对其应用的函数要求。此类容器还可以通过指向公共接口基类的指针来处理多态对象，在这种情况下，三种编程范式汇聚在一起：使用\
  \ STL 算法的函数式、使用 STL 容器类模板的泛型、以及至少在该术语的某些定义下的面向对象式（其中元素是指向多态对象的指针）。在现代 C++ 中，正如你在第\
  \ 3 章 中看到的，唯一指针提供了一种安全且高效的原始指针替代方案，这些也可以作为元素存储在 STL 容器中。\n\n在本章中，我们将首先对模板进行概述/回顾，因为它们是\
  \ STL 中的 *T*。随后将介绍 STL 容器和迭代器。第 5 章 展示了与循环相比，如何使用 STL 算法更高效、安全地表达对容器元素的迭代任务。这两章中的大部分材料将主要关注\
  \ C++ 本身，而非金融应用，但它为我们在后续章节中的更多应用示例奠定了基础。\n\n## 模板\n\nC++ 中的*模板*（Templates）就像是函数和类的蓝图。它们促进了\
  \ C++ 中的泛型编程，使得函数或类可以为任意类型进行设计，而不是为每个类型编写单独的版本（这可能会导致大量的代码重复）。以下泛型函数和泛型类的示例将让你了解模板在\
  \ C++ 中是如何工作的。\n\n首先，回到 `vector` 的案例，它是类模板的一个常见示例。与其他容器一样，它可以通过在尖括号内指定类型作为模板参数（此处原文有误，应为通过在尖括号内指定类型作为模板参数）来持有任意类型的同质集合：\n\
  \n```cpp\n// 一个实数型向量：\nvector<double> v{1.0, 2.0, 3.0};\n\n// 一个 BlackScholes 型向量：\n\
  vector<BlackScholes> v{1.0, 2.0, 3.0};\n```\n\n`vector` 类是泛型的，因为它不在乎它持有的是什么类型。更进一步，为了更好地理解模板的工作原理，我们将查看如何实现模板。\n\
  \n## 使用函数模板\n\n回想第 2 章 中的 `Fraction` 类，我们可以添加 `*` 运算符的定义以及分子和分母的访问器，以演示函数模板。更新后的头文件可以写如下：\n\
  \n```cpp\nclass Fraction\n{\npublic:\n    Fraction(unsigned n, unsigned d);\n  \
  \  bool operator == (const Fraction& rhs) = default;\n    std::strong_ordering operator\
  \ <=> (const Fraction& rhs) const;\n\n    // 当前章节添加了 operator*：\n    Fraction operator\
  \ *(const Fraction& rhs) const;\n    unsigned n() const; // 返回 n_ (分子)\n    unsigned\
  \ d() const; // 返回 d_ (分母)\n\nprivate:\n    unsigned n_, d_;\n};\n```\n\n返回分子和分母的两个访问器是简单易见的，而对于\
  \ `*` 运算符，我们可以返回分数的积：\n\n```cpp\nFraction Fraction::operator *(const Fraction& rhs)\
  \ const\n{\n    return {n_ * rhs.n_, d_ * rhs.d_};\n}\n```\n\n假设现在你需要对整数、实数和 `Fraction`\
  \ 类型求平方。简单地处理（由于 C++ 是一种强类型语言），你可以编写三个独立的函数：\n\n```cpp\n// 整数：\nint int_square(int\
  \ k)\n{\n    return k * k;\n}\n\n// 实数 (double)：\ndouble dbl_square(double x)\n\
  {\n    return x * x;\n}\n\n// Fraction：\nFraction frac_square(const Fraction& f)\n\
  {\n    return f * f; // Fraction 的 operator* 已定义\n}\n```\n\n然而，这三个都可以被单个函数模板所替换：\n\
  \n```cpp\ntemplate <typename T>\nT tmpl_square(const T& t)\n{\n    return t * t;\n\
  }\n```\n\n对整数或双精度值求平方是极其简单的，因为数值参数暗示了它们的类型（分别为 `int` 和 `double`）。\n\n```cpp\nint\
  \ sq_int = tmpl_square(4);             // tmpl_square(const int&)\ndouble sq_real\
  \ = tmpl_square(4.2);       // tmpl_square(const double&)\n```\n\n\n\n\n将函数应用于 `Fraction`\
  \ 更有趣，因为我们不再像处理数值类型那样的拥有内置的算术运算符。需要以某种方式指定对象类型，这可以通过两种方式实现。一种是构造一个 `Fraction` 对象并将其传递给函数：\n\
  \n```\nFraction frac{2, 3};\nFraction sq_frac = tmpl_square(frac);    // tmpl_square(const\
  \ Fraction&)\n```\n\n另一种方案是使用统一初始化，仅需构造函数参数就足够了。在这里，我们需要指定模板参数；否则 `tmpl_square(.)`\
  \ 函数将无法得知传递的类型：\n\n```cpp\nauto sq_frac_unif = tmpl_square<Fraction>({2, 3});\n\
  ```\n\n在每种情况下，都会返回 $\\frac{4}{9}$：\n\n```cpp\n// 在每种情况下都使用访问器获取分子和分母：\ncout << format(\"\
  Square of fraction {}/{} is {}/{}\\n\",\n    frac.numer(), frac.denom(), sq_frac.numer(),\
  \ sq_frac.denom());\n\ncout << format(\"Square of fractions using unif initialization\
  \ = {}/{}\\n\",\n    sq_frac_unif.numer(), sq_frac_unif.denom());\n```\n\n输出是：\n\
  \n```\nSquare of fraction 2/3 is 4/9\nSquare of fraction using unif initialization\
  \ = 4/9\n```\n\n函数模板并不关心特定类型 `T` 是什么，只要定义了乘法运算符即可。如果没有定义，例如尝试对 `Circle` 对象进行平方（第\
  \ 3 章），则代码将无法编译：\n\n```cpp\n// Circle 未定义 operator*。\n// 将无法编译！\n\nCircle circ{1.0};\n\
  double area = tmpl_square(circ);\n```\n\n### 事项\n尽管由编译器检测到错误通常是好事，但对于模板代码，编译器的错误输出可能会非常长且有些晦涩，使得在代码中定位问题源变得更加痛苦，特别是在代码复杂度更高的真实场景环境中。幸运的是，我们有新的方法来缓解这一点，特别是\
  \ C++20 概念（concepts），它们在第 10 章中介绍。\n\n## 使用类模板\n\n*类模板*在语法上与函数模板相似，不同之处模板参数应用于整个类。例如，这里有一个类模板，它将包含两个相同类型的私有成员，并提供一个公共成员函数来计算两者的极值：\n\
  \n```cpp\n// 类声明：\ntemplate <typename T>\nexport class MyPair\n{\npublic:\n    MyPair(const\
  \ T &first, const T &second) :a_(first), b_(second) {}\n    T get_min() const;\n\
  \nprivate:\n    T a_, b_;\n};\n\n// 类实现：\ntemplate <typename T>\nMyPair<T>::MyPair(T\
  \ first, T second) :a_(first), b_(second) {}\n\ntemplate <typename T>\nT MyPair<T>::get_min()\
  \ const\n{\n    return a_ < b_ ? a_ : b_;\n}\n```\n\n只要为类型 `T` 定义了小于运算符 `<`，代码就可以编译。对于两个\
  \ `int` 类型，不相等性定义是由语言提供的；这里没有问题：\n\n```cpp\nMyPair<int> mp_int{10, 26};\nint min_int\
  \ = mp_int.get_min();             // OK，返回 10\n```\n\n使用第 2 章中定义的简单 `Fraction` 类，不相等性是在类内部定义的，所以我们在这里也没有问题：\n\
  \n```cpp\nMyPair<Fraction> mp_frac{{3, 2}, {5, 11}};\nFraction min_frac = mp_frac.get_min();\
  \      // 返回 5/11\n```\n\n当模板参数类型不支持不相等性时调用 `get_min()` 成员函数（例如再次使用 `Circle` 类），结果将是编译时错误：\n\
  \n```cpp\n// 将无法编译！\n\nMyPair<Circle> fail{{1.5}, {3.0}};\nfail.get_min(); // Circle\
  \ 没有 operator<\n```\n\n### 警告\n我们可以将 `MyPair<T>::get_min()` 的体表示为：\n\n```cpp\n T\
  \ retval;                                   = a < b? a : b;    //\nreturn retval;\n\
  ```\n\n然而，这将要求 `T` 必须实现拷贝赋值运算符 ![2](img/#ch04.html_ch04_a2_marker) 以及默认构造函数 ![1](img/#ch04.html_ch04_a1_marker)，而我们的建议实现并没有强制这些要求。在编写通用代码时，考虑我们对将实例化的类型提出的要求通常有用，并努力只要求我们真正需要的，不要更多。这拓宽了我们代码适用于类型范围。\n\
  \n## 编译模板代码\n\n模板主要写在头文件中，因为模板引导编译器如何生成代码。你可以将模板想象成一套西装的样版。在裁缝选择要使用的材料（比比类型）并进行剪裁和缝合之前，什么都不会发生。裁缝甚至可以说：“通常情况下，我是这样做的，但对你，我有专门的方案。”对于模板，这被称为*特化*（specialization）。\n\
  \n对于函数或类使用的每个模板类型，编译器都会生成一个特化。假设我们写了与之前相同的代码：\n\n```cpp\nint sq_int = tmpl_square(4);\n\
  double sq_real = tmpl_square(4.2);\nauto sq_frac_unif = tmpl_square<Fraction>({2,\
  \ 3});\n```\n\n将这三行放入你的代码中会导致编译器生成 `tmpl_square(.)` 的三个版本，分别为 `int`、`double` 和 `Fraction`。\n\
  \n同样，创建 `MyPair` 实例将为 `int`、`double` 和 `Fraction` 生成编译代码：\n\n```cpp\nMyPair<int>\
  \ mp_int{10, 6};\nMyPair<Fraction>{{3, 2}, {5, 11}};\n```\n\n当然，如果我们分别编写这些相应的函数和类，也会得到解决方案。模板避免了编写这些代码的麻烦。\n\
  \n模板的额外优点包括有助于泛型编程，并可能提高运行时性能。缺点是模板会显著增加编译时间，尽管自 C++11 以来这种情况有所改善。C++20 模块引入在某些方面也有助于缩短编译时间，将在第\
  \ 10 章中讨论。\n\n我们还可以使用默认模板参数使用户代码更简单。回到持有两个相同类型 `T` 元素的 `MyPair` 类，我们可以将此模板参数默认为\
  \ `double` 类型：\n\n```cpp\ntemplate <typename T = double>\nclass MyPair\n{\npublic:\n\
  \    MyPair(T first, T second);\n    T get_min() const;\n\nprivate:\n    T a_, b_;\n\
  };\n```\n\n那么，如果我们想要一个 `Pair` 对象持有两个 `double` 类型，可以省略角括号内的显式类型名：\n\n```cpp\nMyPair<>\
  \ real_pair{19.73, 10.26};\ndouble min_val = real_pair.get_min();        // 19.73\n\
  ```\n\n类模板可以接收多个参数类型。例如，`MyPair` 类模板可以接收两个不一定相同的模板参数：\n\n```cpp\ntemplate <typename\
  \ T, typename U>\nclass MyPair\n{\npublic:\n    MyPair(T first, U second);\n   \
  \ // . . .\n\nprivate:\n    T a_;\n    U b_;\n};\n```\n\n\n\n另一个例子是 `std::map<K,\
  \ V>` 类模板，它是一种关联 STL 容器，在“关联容器”中有所介绍。模板还可能涉及编译时的整数值，例如固定大小的顺序 STL 容器 `std::array<T,\
  \ N>`，其中 `N` 是一个正整数，我们将在本章中讨论这种容器（你可能还记得在第 2 章中已经预先预览了这种容器类型）。模板甚至可以接受模板作为参数——这最终可能会变得挑战性——正如你将在第\
  \ 8 章中介绍的表达式模板中看到的那样。然而，本书无法涵盖所有可能的组合，因此我们大多数时候将局限于提供如何编写和使用模板的浅层视点。\n\n# STL 容器\n\
  \n我们在之前的章节中已经使用了 `std::vector`，但还存在其他容器类，每种容器都允许我们以不同的方式存储和组织数据。容器至少分为两类：\n\n##\
  \ 顺序容器\n这些容器强调元素的顺序遍历。这些容器包括 `std::vector`，以及 `std::deque` 和 `std::list`。\n\n##\
  \ 关联容器\n这些容器强调对底层存储进行组织，以便在数据元素插入后于检索值。示例包括 `std::set` 和 `std::map`。\n\n我们将从顺序容器开始概述。\n\
  \n## 顺序容器\n\n顺序容器持有可以按顺序访问的元素。以下是顺序 STL 容器：\n\n`std::vector<T>`\n\n一种动态数组容器，保证分配在连续内存中；该容器针对在末尾的插入和删除进行了优化。在容器的其他位置进行插入和删除是可行的，但效率较低。它可以被看作\
  \ C 语言风格动态数组的无成本且安全的抽象——安全性的体现在所有堆内存分配、管理和替换都由类内部处理。在实践中，如果使用得当，`vector` 可能比手动管理的动态数组更快，因为\
  \ `vector` 执行了细致且高效的资源管理。这是 C++ 中已知的顺序容器的最佳示例，但它不是该家族中的唯一容器。\n\n`std::deque<T>`\n\
  \n该容器提供了与 `vector` 类似的功能，但它还提供了高效在容器头部（`front`）添加和移除数据元素。然而，与 `vector` 不同，它的存储不保证在连续内存中，因此对该容器的遍历效率通常低于\
  \ `vector` 的相同操作。\n\n`std::list<T>`\n\n数据元素被组织为双向链表，节点包含值以及指向相邻（前一个和下一个）节点的指针。这使得在容器内的任意位置进行插入和删除更加高效。但与\
  \ `vector`、`deque` 或 `array`（接将介绍）不同，它不通过 `[.]` 运算符或 `at(.)` 成员函数提供随机访问。在 `list`\
  \ 中访问元素 `i` 的唯一方法是从开始处并遍历前 `i` 个元素。\n\n`std::array<T, N>`\n\n一个包含 `N` 个元素的固定大小数组；`N`\
  \ 的值必须在编译时显式已知。其内容连续存储且不进行动态分配。因此，`array` 可以是最高效的顺序容器类型，但编译时显式声明固定大小的要求使得它在金融应用中的实际用途非常有限。\n\
  \n除了你已经熟悉的 `vector` 类成员函数外，在实践中还有相当多的函数可能是重要的。我们将从 `vector` 开始涵盖顺序 STL 容器，但你最终会发现，在这里学到的大部分内容对其他容器都是相关的。\n\
  \n### vector 顺序容器\n\n作为一名金融开发人员，`vector` 几乎是你使用得最多的 STL 容器。然而，该容器描述的许多成员函数将适用于其他标准容器，因此通过良好地学习\
  \ `vector` 容器，你应该能够在使用其他容器时轻松获取所需内容。出于充分原因，大多数人将 `vector` 视为 C++ 的默认容器。\n\n在之前的章节中使用\
  \ `vector` 的示例中，重点主要是存储普通的数值类型作为元素，但作为一种通用容器，任何有效类型的对象（本质上是任何至少可拷贝或可移动的类型）都可以作为其模板参数。\n\
  \n#### 对象在 vector 中的存储\n\n金融建模和精算科学中一种常用设备是一个神话般的但在理论上有用的连续复利银行账户。给定初始存款 `B[0]`\
  \ 和固定利率 `r`，在以年为单位测量的时间 `t`（或者说是年年分数）之后，账户将增长到金额：\n\n`B(t) = B[0] e^(r*t)`\n\n一个表示此点的简单类可以写如下（默认构造函数和类内初始化的很快就会明朗）：\n\
  \n```cpp\n#include <cmath>\n\nclass BankAccount\n{\npublic:\n    BankAccount(double\
  \ init_value, double continuous_rate) :\n        init_value_{init_value}, continuous_rate_{continuous_rate}\
  \ {}\n\n    BankAccount() = default;\n\n    double value(double time) const\n  \
  \  {\n        return init_value_ * std::exp(continuous_rate_ * time);\n    }\n\n\
  private:\n    double init_value_{1.0}, continuous_rate_{0.0};\n};\n```\n\n现在，假设有三个利率分别为\
  \ 2.1%、2.2% 和 2.3% 的账户，初始存款分别为 $1,000、$2,000 和 $3,000，我们需要将这些对象放入一个 `vector` 中。这似乎是轻而易举的，但某些结果取决于如何进行这种放置，因为我们现在处理的是对象而不是简单类型。\n\
  \n一种简单的方法是创建三个 `BankAccount` 实例并将每个推入 `vector` 的末尾——例如 `ba_push`。当 `ba_push` 创建时，它将不包含任何元素，可以通过调用其\
  \ `size()` 方法进行验证：\n\n```cpp\nvector<BankAccount> ba_push;\ncout << format(\"ba_push\
  \ contains {} elements.\\n\", ba_push.size()) // size = 0\n```\n\n现在，创建每个银行账户对象并推入\
  \ vector：\n\n```cpp\nBankAccount ba01{1000.00, 0.021};\nBankAccount ba02{2000.00,\
  \ 0.022};\nBankAccount ba03{3000.00, 0.023};\n\nba_push.push_back(ba01);\nba_push.push_back(ba02);\n\
  ba_push.push_back(ba03);\n```\n\n然后，你可以再次使用 `size()` 方法检查数量，你会发现三个元素。你也可以循环遍历每个存储对象一年后的账户值：\n\
  \n```cpp\nfor (const auto& ba : ba_push)\n{\n    // 保留两位小数：\n    cout << \"Accumulated\
  \ amount after 1 year = \"\n            << std::setprecision(2) << std::fixed <<\
  \ ba.value(1.0) << \"\\n\";\n}\n```\n\n保留两位小数后的结果所示：\n\n```text\nAccumulated amount\
  \ after 1 year = 1021.22\nAccumulated amount after 1 year = 2044.49\nAccumulated\
  \ amount after 1 year = 3069.80\n```\n\n\n\n\n\n此练习的重点在于，创建 `BankAccount` 对象并使用\
  \ `push_back(...)` 需要低效的对象拷贝。通过 `push_back`，`vector` 中的元素将通过其拷贝构造函数接收一个 `BankAccount`\
  \ 对象。这可以通过将 `BankAccount` 的拷贝构造函数设置为 `delete` 并观察代码是否无法编译来验证。在包含成千上万个大型对象元素的 `vector`\
  \ 等更真实的场景中，性能损耗可能会累积得非常显著。\n\nC++11 通过引入 `emplace_back(...)` 成员函数解决了这个问题。如果调用代码知道需要传递哪些参数来构造对象，但手头没有该对象，则通过构造函数参数调用\
  \ `emplace_back(...)` 将让容器为我们创建对象，从而每次调用都能节省一次构造（和一次析构）。例如，以下代码中没有生成任何 `BankAccount`\
  \ 对象拷贝：\n\n```\nvector<BankAccount> ba_emplace;\n\nba_emplace.emplace_back(1000.00,\
  \ 0.021);\nba_emplace.emplace_back(2000.00, 0.022);\nba_emplace.emplace_back(3000.00,\
  \ 0.023);\n```\n\n在这个简单的示例中，任何性能提升都将微乎其微，因为 `BankAccount` 是一个极小的类型。但当向 `vector`\
  \ 末尾推入更“重量”的对象——且数量更多——时，成本的节省将变得非常显著。\n\n在这个 `emplace_back(...)` 示例中，你也可以通过控制台输出来验证\
  \ `vector` 的大小为三，并且估值结果与之前的 `push_back(...)` 示例相同。请注意，`emplace_back(...)` 只有在要添加到容器的对象尚未构造时才主要有用处。如果你手头已经有一个完整的对象，只需使用\
  \ `push_back(obj)`；或者，如果 `obj` 在容器外部不再需要，你也可以使用 `push_back(std::move(obj))` 来避免对象拷贝的开销。\n\
  \n### 多态对象\n\n在金融 C++ 编程中，你有时可能需要在 `vector` 中处理一组动态决定的、基于基类类型的派生对象集合。使用现代 C++，特别是参考第\
  \ 3 章中的相关讨论，可以通过定义一个带有 `std::unique_ptr` 模板参数的 `vector` 来实现，它通过（通常是抽象的）基类类型指向派生类对象。\n\
  \n假设我们可能对同一底层股票的期权组合进行估值。每个看涨和看跌期收益可以通过一个包含指向第 3 章中讨论的抽象 `Payoff` 类型唯一指针的 `vector`\
  \ 来管理：\n\n```\nvector<std::unique_ptr<Payoff>> payoffs;\n```\n\n然后，我们可以像示例所示将每个指针推入\
  \ `vector`：\n\n```\npayoffs.push_back(std::make_unique<CallPayoff>(90.0));\npayoffs.push_back(std::make_unique<CallPayoff>(95.0));\n\
  payoffs.push_back(std::make_unique<CallPayoff>(100.0));\npayoffs.push_back(std::make_unique<PutPayoff>(100.0));\n\
  payoffs.push_back(std::make_unique<PutPayoff>(105.0));\npayoffs.push_back(std::make_unique<PutPayoff>(110.0));\n\
  ```\n\n当 `payoffs` 容器离开作用范围时，每个 `unique_ptr` 都会清理自己。相比之下，使用原始指针执行此操作将如下所示：\n\n```\n\
  std::vector<Payoff*> raw_ptr_payoffs;\nraw_ptr_payoffs.push_back(new CallPayoff{90.0});\n\
  raw_ptr_payoffs.push_back(new PutPayoff{105.0});\n\n// 等 . . .\n```\n\n但现在，一旦我们用完\
  \ `raw_ptr_payoffs`，必须在退出活动作用范围之前再次遍历 `vector` 并手动删除每个元素。这意味着：\n\n- 忘记此步骤的风险，导致内存泄漏\n\
  - 需要更多的代码来管理\n- 更多可能出错的地方\n\n每个 `unique_ptr` 对象都实现了析构自动化。\n\n### 分配与连续性\n\n`vector`\
  \ 模拟了一个动态数组，在满时可以增长。在继续其他容器之前，让我们先来看 `vector` 的一些有用功能。\n\n我们需要区分 `vector` 的 `size`（代表元素数量）和它的\
  \ `capacity`（代表存储空间）。`vector` 类提供了成员函数，允许程序员的代码决定何时更改大小或容量。其中一种是 `reserve(...)`，它改变容量但不改变大小。另一个是\
  \ `resize(...)`，它通过在末尾概念上添加默认值来同时改变大小（元素数量）和容量（例如，对于 `int` 或 `double` 等基本类型使用 `0`，对于指针使用\
  \ `nullptr`，或对于具有此类构造函数的类使用默认构造的对象）。\n\n因此，如果你至少知道（at least know）要在容器中存储多少个对象，你可以在程序中的选定（非关键）时刻调用这些函数，以确保在实际添加对象时有足够的空间。由于\
  \ `resize(...)` 可能会创建默认构造的对象，因此在这者之间，`reserve(...)` 通常是更高效的选择。\n\n当 `vector` 调整大小或重新分配空间时，需要将对象从旧存储空间拷贝或移动到新存储空间。为了实现这一点，如果移动构造函数被标记为\
  \ `noexcept`，它将调用每个对象的移动构造函数；否则，它将调用每个对象的拷贝构造函数。对于给定的对象类型，移动操作比拷贝操作快（通常要快得多）。\n\n\
  `vector` 实例力求保持容量大于大小以避免重新分配。然而，当需要重新分配时，必须执行多次拷贝（或多次移动）。其如下所示：\n\n```\n// 注意：这是简化的\n\
  \n// . . .\n\nvoid push_back(const T &obj)\n{\n   // 如果 full() // full() 意味着 size()\
  \ == capacity()\n   //    grow()\n   // 在末尾添加 obj\n   // 增加 size\n}\n\nvoid grow()\n\
  {\n   // 确定一个比当前更大的容量\n   // 分配该容量的新数组\n   // 将元素从旧数组拷贝或移动到新数组\n   // 销弃旧数组\n  \
  \ // 更新容量为新容量\n}\n// . . .\n```\n\n\n\n\n当使用默认构造函数创建 `vector` 时：\n\n```cpp\nstd::vector<MyClass>\
  \ v;\n```\n\n它不包含任何元素。可以通过 `vector` 的 `empty()` 成员函数来验证：\n\n```cpp\ncout << std::boolalpha\
  \ << v.empty() << \"\\n\";    // v.empty() === true\n```\n\n和/或通过之前介绍的 `size()`\
  \ 方法：\n\n```cpp\nauto s = v.size();        // s = 0\n```\n\n`vector` 保证将其存储在连续内存中（通常在堆上）。通过重复调用\
  \ `emplace_back(.)` 或 `push_back(.)`，`vector` 将尝试将下一个对象放置在与之前元素相邻的内存块中。然而，如果该已被分配给其他资源，`vector`\
  \ 将需要重新分配内存到另一个位置，并移动或复制所有现有数据到该位置。这可能会变得非常昂贵，特别是当数据被复制时。\n\n如果我们知道需要的元素数量（或一个合理的上限估计），就可以控制这些成本。实现这一目标的一种方法是简单地将此值放在\
  \ `vector` 的构造函数中：\n\n```cpp\nvector<MyClass> w(100'000);     // 单引号用作逗号的代理\n  \
  \                              // 在 C++14 标准中引入\n```\n\n但这并不吸引人，因为现在 `MyClass` 的默认构造函数被调用了\
  \ 100,000 次，在每个位置都创建了一个默认对象，而且我们可能需要将一个新的非默认构造的对象复制到每个元素中。如果我们确实需要默认的 `MyClass`\
  \ 对象，并预计以后可能替换其中的一部分，那么这个选项是合理的。\n\n幸运的是，存在一种可行且高效的替代方案——使用 `vector` 容器类的 `reserve(.)`\
  \ 在堆内存中预留元素数量：\n\n```cpp\nstd::vector <MyClass> u;\nu.reserve(100'000);\n```\n\n\
  现在，`u` 拥有零对象（`u.size() == 0`），但有空间通过 `push_back()` 或 `emplace_back()` 添加 100,000\
  \ 个元素，而无需 `u` 重新分配内存。\n\n这里的结论是，如果你估计了 `vector` 中将存储多少对象，可以在创建 `vector` 容器对象之后但在用\
  \ `emplace_back(.)` 或 `push_back(.)` 添加额外对象之前调用 `reserve(.)` 函数。这将避免强制进行（可能昂贵的）连续内存重新分配。\n\
  \n让我们通过重温 `BankAccount` 示例来看一个简单的演示。容量设置为 `5`，因此它可以容纳三个元素，并留出几个以防万一：\n\n```cpp\n\
  // 在应用 push_back(...) 之前：\nvector<BankAccount> ba_push;\nba_push.reserve(5);   \
  \          // 内存中预留了 5 个元素的空间\n                                // 但此时 size 仍为零。\n\
  \n// 与之前相同但包含在这里以便\n// 方便引用：\nBankAccount ba_01{1000.00, 0.021};\nBankAccount ba_02{2000.00,\
  \ 0.022};\nBankAccount ba_03{3000.00, 0.023};\n\nba_push.push_back(ba_01);\nba_push.push_back(ba_02);\n\
  ba_push.push_back(ba_03);       // ba_push.size() 现在为 3，\n                     \
  \           // 但 ba_push.capacity() 仍为 5。\n\n// 同样对于 emplace_back()：\nvector<BankAccount>\
  \ ba_emplace;\nba_emplace.reserve(5);\n\nba_emplace.emplace_back(1000.00, 0.021);\n\
  ba_emplace.emplace_back(2000.00, 0.022);\nba_emplace.emplace_back(3000.00, 0.023);\
  \    // ba_emplace.size() = 3,\n                                            // ba_emplace.capacity()\
  \ = 5.\n```\n\n在真实的金融系统编程中，投资组合定价和风险计算可能适用于多个资产类别的数千个位置，这可能需要将每个位置对象加载到 `vector`\
  \ 中。为了防止大型 `vector` 容器出现增量内存重新分配，在处理位置数据之前使用 `reserve(.)` 成员函数设置足够的容量，有助于确保更好的运行时性能。此外，`reserve(.)`\
  \ 函数的实际整数参数更有可能是动态（基于外部输入）确定的，而不是像这里的介绍示例那样使用硬值（例如 `reserve(5)` 或 `reserve(100'000)`）。\n\
  \n### `clear()` 方法\n\n`vector` 容器类的 `clear()` 成员函数将销毁容器中存储的每个对象并将其大小重置为 0。定义如下一个实现了析构函数的简单类：\n\
  \n```cpp\nclass MakeItClear\n{\npublic:\n\n    ~MakeItClear()\n    {\n        std::cout\
  \ << \"MakeItClear destructor called\" << \"\\n\";\n    }\n};\n```\n\n然后，定义一个包含三个\
  \ `MakeItClear` 对象的 `vector`：\n\n```cpp\nvector<MakeItClear> mic;\nmic.reserve(3);\n\
  mic.emplace_back();    // 构造 MakeItClear 对象\nmic.emplace_back();    // 构造 MakeItClear\
  \ 对象\nmic.emplace_back();    // 构造 MakeItClear 对象\n```\n\n\n\n\n为 `vector` 容器类拥有\
  \ `push_front(.)` 成员函数将是一项昂贵的操作，因为 `vector` 模拟的是动态数组，在开头插入元素意味着需要将所有现有元素“向右移动”一个位置，如果元素数量很大，这将是一个非常耗资源的操作。拥有\
  \ `push_front(.)` 成员函数的容器（例如 `std::deque` 或 `std::list`）是那些该函数执行得相当高效的容器。\n\n##\
  \ vector 中的随机访问：at(.) 对比 [.]\n\n大小为 `n` 的 `vector` 允许通过索引 `0, 1,…​, n-1` 对元素进行随机访问，可以使用\
  \ `[.]` 运算符或 `at(.)` 成员函数。这两者的区别在于，`at(.)` 在尝试访问无效索引时通过抛出异常来提供边界检查。如果我们想要获取错误信息，可以通过该标准异常类\
  \ `std::out_of_range` 中重写的 `what()` 函数来获取：\n\n```\n#include <stdexcept>    // 用于异常类\
  \ std::out_of_range\n// . . .\n\nvector<int> v {0, 1, 2, 3, 4, 5};     // v.size()\
  \ === 5\n\ntry\n{\n    int n = v.at(10);   // at(.) 抛出 out_of_range 异常\n}\ncatch\
  \ (const std::out_of_range& e)\n{\n    std::cout << e.what() << \"\\n\\n\";\n}\n\
  ```\n\n尝试访问负索引也会抛出 `out_of_range` 异常。\n\n方括号运算符不提供这种保护。将 `at(.)` 替换为 `[.]` 将导致运行时错误，可能导致程序崩溃，或者更糟糕的是错误被默默忽略并传播，造成更大的危害。从技术上讲，如果我们访问越界的对象，可能会发生任何情况，因为这会导致未定义行为（回想\
  \ 第 1 章，这意味着代码没有“按照规则运行”，且程序是损坏的）。出于这个原因，如果你认为索引可能会越界，可以考虑使用 `at(.)` 代替 `[.]` 来识别代码中的错误并修复它们。当然，每次访问都进行边界检查是有代价的，因此只有在对索引有效性有疑问时才使用\
  \ `at(.)`。\n\n## vector 中 () 和 {} 含义的潜在陷阱\n\n如你现在所知，在现代 C++ 中，构造函数参数——包括没有参数的默认构造函数——在现代代码库中通常倾向于使用大括号（`{.\
  \ . .}`）表示统一初始化，而不是仍然合法的使用圆括号（()）的“传统”定义。例如，回到构造函数中有两个 `unsigned` 整数参数的 `Fraction`\
  \ 类，你可以编写以下两种定义来获得相同的结果：\n\n```\nFraction braces{1, 2};\nFraction round_brackets(1,\
  \ 2);\n```\n\n在两种情况下，分子值都将为 `1`，分母值都将为 `2`。\n\n然而正如第 1 章首次提到的，使用 `vector`（以及其他 STL\
  \ 容器）有时会导致不同的结果。例如，假设我们尝试使用大括号作为 `vector` 长度的构造函数参数，特别是对于一个 `int` 值的 `vector`：\n\
  \n```cpp\nstd::vector<int> v{10};    // size() === 1\n```\n\n这将初始化一个大小为 1 且元素为 10\
  \ 的 `vector`。要指定大小为 10，我们需要使用圆括号版本：\n\n```cpp\nvector<int> v_round_brackets(10);\
  \    // size() === 10\n```\n\n这看起来像是一个奇现象，尽管这种情况是有原因的。然而，这个更高级主题的细节被推到了附录 D。\n\n\
  为了避免这种潜在的陷阱和相关的复杂性，代码风格要求明确要求遵循 C++03 的圆括号 `vector` 构造函数参数。你可以在 [Google C++ Style\
  \ Guide](https://oreil.ly/Ssunu) 中找到一个著名的例子。本书遵循相同的指南，使用大括号表示 `vector` 的初始化，并使用圆括号版本来指定元素数量。这样我们就避免了任何歧义。类似的行为也适用于其他\
  \ STL 容器，因此在这些情况下我们也使用相同的风格指南。\n\n## C 数组与 data() 成员函数\n\n`vector` 本质上是对封装的动态 C\
  \ 数组的无成本抽象；事实上，可以看作是这种想法的负成本抽象，因为它执行了极其高效的内存管理，可能比任何普通程序员在合理时间内能实现的要得多。它的数据存储在连续内存中，通常在堆上，与它的\
  \ C 对应项一样，但像智能指针一样，它会自动清理，并且携带了一套强大的成员函数，其中许多之前已经讨论过。\n\n`data()` 方法在 C++11 中引入\
  \ `vector` 中，返回其第一个元素的内存地址。在现代 C++ 境下，很少甚至永远不需要使用 `data()`。然而，用 C 编写的遗留数值库（例如用于\
  \ C 的 GNU 科学库以及许多其他库需要与原始指针接口，而 `data()` 成员函数使得这变得方便。\n\n正如最初提到的，应用程序需要 `vector`，但了解每个容器的优缺点将有助于做出明智的选择。现在让我们简单查看其他顺序容器。\n\
  \n### std::deque 顺序容器\n\n`deque` 在功能上与 `vector` 相似，额外增加了可以在容器开头和结尾推入和弹出元素。这些成员函数的命名出乎意料如下：\n\
  \n- `push_front()`：在 `deque` 的开头添加元素\n- `pop_front()`：从 `deque` 的开头移除元素\n\n作为第一个示例，创建一个包含整数的\
  \ `deque`，并在容器的开头和结尾应用成员函数：\n\n```cpp\nstd::deque<int> on_deque{0, 1, 2, 3};\n\n\
  // 在开头推入新元素：\non_deque.push_front(-1);\non_deque.push_front(-2);\n\n// 像 vector\
  \ 一样向结尾推入：\non_deque.push_back(4);\nfor (int k : on_deque)\n{\n    cout << k <<\
  \ \" \"; // on_deque 现在包含：-2 -1 0 1 2 3 4\n}\n\n// 移除第一个和最后一个元素：\non_deque.pop_front();\n\
  on_deque.pop_back();\nfor (int k : on_deque)\n{\n    cout << k << \" \"; // on_deque\
  \ 现在包含：-1 0 1 2 3\n}\n```\n\n除了 `emplace_back(.)` 之外，类似的 `emplace_front(.)` 函数在向\
  \ `deque` 开头添加对象时消除了拷贝。假设我们有一个 `Rectangle` 类，其构造函数接受两个 `double` 参数并暴露一个 `area()`\
  \ 成员函数：\n\n```cpp\nstd::deque<Rectangle> recs;\nrecs.emplace_front(3.0, 2.0);\n\
  recs.emplace_front(4.0, 3.0);\nrecs.emplace_front(5.0, 4.0);\n```\n\n然后，遍历容器以获取面积值：\n\
  \n```cpp\nfor (const auto& elem : recs)\n{\n    cout << elem.area() << \" \";\n\
  }\n```\n\n注意，由于我们是在开头而不是结尾执行插入的，因此显示的值将是从最后一个进入的矩形到第一个矩形的对应面积值：\n\n```\n20 12 6\n\
  ```\n\n\n\n\n\n像 `vector` 一样，`deque` 也支持通过 `at(.)` 函数和 `[.]` 运算符进行随机访问，其中 `at(.)`\
  \ 会再次检查边界并在索引值无效时抛出异常。事实上，仅有极少数的差异，在 `vector` 上定义的几乎所有成员函数也适用于 `deque`。通常优选 `vector`\
  \ 而非 `deque` 的原因是：对于顺序遍历元素的常见情况，`vector` 的执行速度更快，因为 `vector` 模拟的是连续值的数组，而 `deque`\
  \ 模拟的是连续块的序列。现代计算机配备了不同级别的缓存内存，从连续内存中排列对象的线性遍历中获益匪浅。\n\n然而，在某些金融应用中（例如按从到新的顺序存储时间序列值，或根据市场价格计算收益率），向容器的头部添加元素是非常方便的。\n\
  \n分段内存存储相比 `vector` 也有一个潜在优势，即新元素可以追加到新的堆内存块中，也可以放置在重新分配的内存区域。这与 `vector` 那种重新分配整个连续内存块的情况形成对比。然而，正如你在\
  \ `vector` 中看到的，可以在开始时通过 `reserve(.)` 成员函数设置容量以完全防止重新分配。这在 `deque` 中是无法实现的。\n\n\
  ### std::list 顺序容器\n\n如前所述，`vector` 和 `deque` 容器共享许多相同的功能，对于在两者末尾添加新数据或在 `deque`\
  \ 头部添加数据，这些操作都是高效的。但当数据需要在中间位置插入时，它们就显得不从心了。\n\n`list` 的内部结构与 `vector` 或 `deque`\
  \ 非常不同。在不涉及细节的情况下，`list` 中的元素存储在节点中，节点是一个包含元素并已知其前驱和后继节点地址的对象。因此，从技术上讲，该容器是一个`双链表`。\n\
  \n注意，这种结构意味着对于持有 `n` 个元素的容器，`list` 的整体内存消耗将高于 `vector`。例如，一个 `vector<MyClass>` 容器对象将包含一些数据来表示底层存储的大小、容量和位置，但其数据将是一段连续的\
  \ `MyClass` 对象序列，别无其他。因此，`vector` 中对象消耗的空间是元素数量乘以元素的大小。相比之下，`list<MyClass>` 容器对象将包含节点序列，每个节点包含一个\
  \ `MyClass` 对象和两个指针——因此每个节点占据的空间大于其元素占据的空间——而且每个节点都是单独分配的，导致在实践中遍历速度较慢。\n\n当需要插入新元素时，并不是通过移动内存中的元素来提供空间，而是创建一个新节点，断开两个现有元素之间的链接，并通过在之前连接的两个元素之间建立新链接，将新节点插入列表。因此，在\
  \ `list` 中插入（或删除）的影响是“局部的”，因为它只影响紧邻的节点。\n\n在 STL 顺序容器中任意位置插入新元素需要讨论 STL 迭代器，这将在\
  \ “STL 迭代器” 中介绍。现在，请记住在 `list` 的任意位置插入会比在 `vector` 或 `deque` 中快，但访问特定元素的效率会更低。与\
  \ `vector` 或 `deque` 不同，`list` 不支持通过 `at(.)` 函数或 `[.]` 运算符通过索引进行随机访问，因为没有办法高效地实现这些操作（参见后文的\
  \ Note），但它拥有许多相同的成员函数，如 `push_back(.)`、`emplace_back(.)`、`front()` 和 `back()`，此外它可以像其他标准一样用于基于范围的\
  \ `for` 循环：\n\n```\nstd::list<int> franz{0, 1, 2, 3};\nfor (int elem : franz)\n\
  {\n    cout << elem << \"\\n\";\n}\n\nfranz.push_front(-1);\nfranz.push_back(4);\n\
  franz.push_back(5);\nfranz.pop_back();\n\nfor (int elem : franz)\n{\n    cout <<\
  \ elem << \"\\n\";\n}\n\n// 编译错误！\n// list 未定义 at(.) 也没有 [.]\n// int sum = franz.at(0)\
  \ + franz[1];\n```\n\n结果正如意料中那所示：\n\n```\n 0 1 2 3\n-1 0 1 2 3 4\n```\n\n### Note\n\
  \n由于 `list` 中的节点只知道其紧邻的邻居，访问 `list` 中第 `n` 个元素的唯一方法是从开始并迭代 `n` 次。而在 `vector` 中，访问第\
  \ `n` 个元素只是简单的常数时间算术运算，计算底层存储起始处之后第 `n` 个元素的地址。\n\n由于金融领域中的大多数数据是时间性的，你可能并不经常需要在容器内部插入数据——如果真的需要的话话——因此\
  \ `list` 的优势在量化金融应用中可能不会频繁适用。在现代硬件上，`list` 主要用于需要在容器的任意位置执行大量节点插入和删除的情况，或者存储在 `list`\
  \ 中的元素拷贝成本很高的情况。\n\n### 固定长度 std::array\n\n固定长度数组在 C++11 中以 `std::array` 的名称引入。与模拟动态数组并在堆上分配的\
  \ `vector` 不同，`array` 本身不在堆上分配，且具有固定大小。由于其大小必须在编译时提供，你也会发现它的用途有限。事实上，`array` 支持\
  \ `size()`、`front()`、`back()`、`empty()` 和 `[.]` 运算符，但不支持 `push_back(.)`、`push_front(.)`、`pop_front(.)`\
  \ 或 `pop_back(.)`，因为 `array` 的大小在定义后无法修改。\n\n在以下代码中，`arr_01` 和 `arr_02` 的用法是严格等价的：\n\
  \n```\nint arr_01[]{0, 1, 2, 3};\nint sum_01 = 0;\nfor (int x : arr_01)\n{\n   \
  \ sum_01 += x;\n}\n// sum_01 = 6\n\nstd::array<int, 4> arr_02{0, 1, 2, 3};\nint\
  \ sum_02 = 0;\nfor (int elem : arr_02)\n{\n    sum_02 += elem;\n}\n// sum_02 = 6\n\
  ```\n\n注意，我们也可以使用 C++17 引入的 CTAD 来定义 `arr_02`，见第 1 章：\n\n```\nstd::array arr_02{0,\
  \ 1, 2, 3};\n```\n\n### 如果确定，使用 vector\n\n此时明显的问题是：“我应该使用哪种顺序容器类？”如前所述，`array` 的用途相当有限，因此这基本上只剩下\
  \ `vector`、`deque` 或 `list` 可供选择。答案是，除非充分的理由使用后两者之一，否则你应该默认选择 `vector`。\n\n这主要是因为\
  \ `vector` 正如《C++ Coding Standards》一书描述的那样，保证具有以下特性：^(2)\n\n*   任何容器中最低的内存开销\n*\
  \   任何（动态）容器中最快的元素访问速度\n\n\n\n\n此外，正如 *C++ 编码标准* 中提到的那样，`vector` 中的存储保证在连续内存中，这使其具有了类似于动态\
  \ C 语言风格数组的效率。它还具备与 C 语言数组相同的随机访问便利性。另外两种动态调整大小的顺序容器的存储可能是碎片化的，而 `list` 不支持随机访问。\n\
  \n`vector` 容器确实是标准 C++ 库的骨干工作。熟悉它的功能和细节将使你成为一名更高效的量化开发者。理解它在 STL 算法中的用法（将在第 5 节\
  \ 中介绍）也适用于使用任何其他 STL 容器类的用例。\n\n## 关联容器\n\nC++ 有两种主要的关联容器，无论数据以何种顺序插入，它们都能自动对其内容进行排序。这些容器还强制要求元素的唯一性。这两个容器如下：\n\
  \n`std::set<T>`\n\n存储类型为 `T` 的唯一元素，并在每当插入新元素时都会对它们进行重新排序。\n\n`std::map<K, T>`\n\n\
  存储类型为 `K` 和 `T` 的元素对，其中 `K` 是用于排序容器并获取其关联的 `T` 值的键值。该容器确保每个键都是唯一的，但允许多个键具有相同的值。\n\
  \n例如：\n\n```cpp\n#include <set>\n#include <map>\n\n// . . .\n\nstd::set<int> some_set{5,\
  \ 1, 2, 3, 4, 3};\nfor (int n : some_set)\n{\n    cout << n << \" \";\n}\n\ncout\
  \ << \"\\n\\n\";\n\nstd::map<std::string, int> some_map\n{\n    {\"five\", 5}, {\"\
  one\", 1}, {\"two\", 2},\n    {\"three\", 3}, {\"four\", 4}, {\"three\", -3}\n};\n\
  \nfor (auto [k, v] : some_map)\n{\n    cout << k << \": \" << v << \"; \";\n}\n\
  ```\n\n如果你运行这段代码，你将看到如下输出：\n\n```\n1 2 3 4 5\n```\n显示在第一行（注意数字 3 只出现了一次）。然后，回想起\
  \ `std::string` 定义了基于字典序的不等运算符，例如：\n\n`ab < acabc < abd`\n\n你将在第二行看到这些：\n\n```\n\
  five:5; four:4; one:1; three:3; two:2;\n```\n\n注意没有重复的键，因为对于键 `three`，只有第一次插入是有效的，并且键是按字母顺序排序的。\n\
  \n可以使用方括号运算符中的键值来获取单独的值：\n\n```cpp\nint four = some_map[\"four\"];    // four =\
  \ 4 (value)\n```\n\n然而，我们在处理 `Circle` 对象的 `set` 时会遇到问题（例如来自第 3 节）。以下内容无法编译，因为该类没有定义排序：\n\
  \n```cpp\n// 编译器错误！\nstd::set<Circle> circles{{5.5}, {3.2}, {8.4}};\n```\n\n如果尝试使用不支持不等运算符的类型作为\
  \ `map` 的键，也会出现同样的问题。\n\n这些容器的另外两个版本*允许*重复项：\n\n`std::multiset<T>`\n\n接受相同值的多次出现。\n\
  \n`std::multimap<K, T>`\n\n接受具有相同键的多个对。\n\n例如：\n\n```cpp\n// std::multiset 和 std::multimap\
  \ 定义\n// 在标准库的 <set> 和 <map> 头文件中\n// . . .\n\nstd::multiset<int> some_multiset{5,\
  \ 1, 2, 3, 4, 3};\n\nfor (int n : some_multiset)\n{\n    cout << n << \" \";\n}\n\
  \ncout << \"\\n\\n\";\n\nstd::multimap<std::string, int> some_multimap\n{\n    {\"\
  five\", 5}, {\"one\", 1}, {\"two\", 2},\n    {\"three\", 3}, {\"four\", 4}, {\"\
  three\", -3}\n};\n\nfor (auto [k, v] : some_multimap)\n{\n    cout << k << \": \"\
  \ << v << \"; \";\n}\n// ...\n```\n\n如果你运行这段代码，你将看到第一行显示如下输出（注意数字 3 出现了两次）：\n\n\
  ```\n1 2 3 3 4 5\n```\n\n从 `map` 示例，你将在第二行看到：\n\n```\nfive:5; four:4; one:1; three:3;\
  \ three:-3; two:2;\n```\n\n注意有两个键为 `three` 的条目，尽管它们的值不同，并且键是按字母顺序排序的。\n\n最后，从 C++11\
  \ 开始，标准库为这些关联容器的每一个添加了无序（又称哈希）版本。它们具有比其有序版本搜索更快的能力（但通常会消耗更多的内存空间），尽管这并不保证。它们如下：\n\
  \n- `std::unordered_set<T>`\n- `std::unordered_multiset<T>`\n- `std::unordered_map<K,\
  \ T>`\n- `std::unordered_multimap<K, T>`\n\n从技术上说，无序版本不再是关联容器，但它们是这些主题的变体。技术来说，无序版本不再是关联容器，但它们是这些主题的变体。技术来说，无序版本不再是关联容器，但它们是这些主题的变体。技术来说，无序版本不再是关联容器，但它们是这些主题的变体。技术来说，无序版本不再是关联容器，但它们是这些主题的变体。技术来说，无序版本不再是关联容器，但它们是这些主题的变体。技术来说，无序版本不再是关联容器，但它们是这些主题的变体。技术来说，无序版本不再是关联容器，但它们是这些主题的变体。技术来说，无序版本不再是关联容器，但它们是这些主题的变体。技术来说，无序版本不再是关联容器，但它们是这些主题的变体。技术来说，无序版本不再是关联容器，但它们是这些主题的变体。技术来说，无序版本不再是关联容器，但它们是这些主题的变体。技术来说，无序版本不再是关联容器，但它们是这些主题的变体。技术来说，无序版本不再是关联容器，但它们是这些主题的变体。技术来说，无序版本不再是关联容器，但它们是这些主题的变体。技术来说，无序版本不再是关联容器，但它们是这些主题的变体。技术来说，无序版本不再是关联容器，但它们是这些主题的变体。技术来说，无序版本不再是关联容器，但它们是这些主题的变体。技术来说，无序版本不再是关联容器，但它们是这些主题的变体。技术来说，无序版本不再是关联容器，但它们是这些主题的变体。技术来说，无序版本不再是关联容器，但它们是这些主题的变体。技术来说，无序版本不再是关联容器，但它们是这些主题的变体。技术来说，无序版本不再是关联容器，但它们是这些主题的变体。技术来说，无序版本不再是关联容器，但它们是这些主题的变体。技术来说，无序版本不再是关联容器，但它们是这些主题的变体。技术来说，无序版本不再是关联容器，但它们是这些主题的变体。\
