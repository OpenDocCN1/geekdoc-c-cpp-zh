  md: '# The teaching approach


    I began university teaching later in life after a career programming in the telecommunications
    industry.


    My concern has been to convey the sheer fun and creativity involved in getting
    computers to do what you want them to do and always try to give useful, practical,
    working examples of the kinds of things students commonly tell me they want to
    do.


    Learning a language can be a dry, boring affair unless results are immediate and
    visible so I tend to use the internet as the input-output channel right from the
    start.


    I prefer teaching an approach to programming which is deliberately “simple” using
    old-fashioned command-line tools and editors and stable, relatively unchanging
    components that are already built-in to Unix and Linux distributions such as Suse,
    Ubuntu and Red Hat.


    This is in response to the growing complexity of modern Integrated Development
    Environments (IDEs) such as Developer Studio, Netbeans and Eclipse which give
    students an illusion that they know what they are doing but generate obfuscation.


    My aim is to get students confident and up to speed quickly without all the nightmare
    associated with configuring complex tool chains. It is also essentially a license-free
    approach and runs on anything.


    With this fundamental understanding about what is really going on you can progress
    on to use and actually understand whatever tools you need in your career.


    In order to give a sense of doing something real and useful and up to date, the
    focus is on developing visible and effectively professional-quality web-server
    and client projects to put on-line, using:


    +   - Apache Web server and development libraries.

    +   - C language CGI programs (C programming using the "make" utility).

    +   - C language Apache modules.

    +   - MySQL server with C client library interfaces.

    +   - GD graphics library with C interfaces.

    +   - Incidental use of CSS, (X)HTML, XML, JavaScript, Ajax.


    This course has been designed for and lab-tested by first and second year Computer
    Science Students at Kingston University, London UK.'
