  md: '# 6. Graphics with GD library


    The ability to generate interesting images dynamically to suit the situation is
    an enjoyable, challenging, and rewarding type of programming. We will be using
    Thomas Boutell''s GD C library which has been around for many years as an open
    systems project.


    # 6.1 Generating binary content


    Here we create an image and print into it the value of the TEXT= part of the QUERY
    STRING and set our content type to image/gif. The gdImageGif function writes the
    binary image out to stdout which is the output stream instead of to a file, so
    binary image data is sent back to the browser.


    ![](img/a0cbda189e54d8cb1121c7e151992506_62_0.png)'
