  md: '# Conclusion


    Now you have worked through these simple examples I hope you can see why a knowledge
    of the C language is always going to be a useful and continually practical skill.


    After 25 years I still regularly write C programs to do everyday tasks quickly
    and effectively and once written they form part of a set of durable tools that
    suit me and which are portable.


    This short book contains a number of “tricks” that I have learned over the years
    for which there is little explicit documentation, and it frankly presupposes a
    familiarity with Linux. After testing the material with students of a wide range
    of experience I am confident that an attentive careful student will get all this
    material working and can start from there to discover the joy of C. Many of my
    students say “This is much more fun that Java, I can see what is really going
    on!” which is most gratifying and makes me confident you will find the material
    useful.


    Those interested might ask the publisher to commission me to write a companion
    volume :


    *C++ Standard Template Library Programming in Linux*


    Good luck and happy programming.


    David

    March 31st 2009'
