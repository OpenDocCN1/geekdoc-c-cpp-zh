- pgno: 14
  md: 'The function called “main”, which returns an integer, takes two arguments,
    an integer called “argc” which is a count of the number of command arguments then
    *argv[] which is a list or array of pointers to strings which are the actual arguments
    typed in when you run the program from the command line.


    # Some Definitions:


    function: a block of program code with a return data type, a name, some arguments
    of varying data types separated by commas, enclosed in brackets, then the body
    of the function enclosed in curly brackets, each statement ending with a semi-colon.

    integer symbol int : a counting number like 0,1,2,3,4,5.

    list, array symbol []: a sequence of things of the same kind in a numbered order.

    pointer symbol * : a memory address locating the start of piece of data of a certain
    type.

    string or char * : a pointer to a sequence of characters like ''c'',''a'',''t''
    making up "cat". A character string ends with s special character NULL or ''0''
    ascii value 0 or hex 00


