- pgno: 50
  md: 'The decode_value function takes three arguments:


    +   1. the name of the value we are looking for, “ITEM1=” or “ITEM2=”.

    +   2. the address of the variable into which we are going to put the value if
    found

    +   3. the maximum number of characters to copy


    The function looks for the start and end positions in the QUERY_STRING of the
    value and then copies the characters found one by one to the value variable, adding
    a NULL character to terminate the string.


    ![](img/a0cbda189e54d8cb1121c7e151992506_50_0.png)'
  merge: -1
  img_proc: true
- pgno: 51
  md: "```\n```c\n/********************************************************\n * C\
    \ Programming in Linux (c) David Haskins 2008\n * chapter4_2.c\n ********************************************************/\n\
    #include <stdio.h>\n#include <string.h>\n\nvoid decode_value(const char *key,\
    \ char *value, int size)\n{\n    int length = 0, i = 0, j = 0;\n    char *pos1\
    \ = '\\0', *pos2 = '\\0';\n    //if the string key is in the query string\n  \
    \  if ( pos1 = strstr((char *) getenv(\"QUERY_STRING\"), key)) != NULL )\n   \
    \ {\n        //find start of value for this key\n        for(i=0; i<strlen(key);\
    \ i++) pos1++;\n        //find length of the value\n        if( (pos2 = strstr(pos1,\
    \ \"&\")) != NULL )\n            length = pos2 - pos1;\n        else length =\
    \ strlen(pos1);\n        //character by character, copy value from query string\n\
    \        for(i = 0, j = 0; i < length ; i++, j++)\n        {\n            if(j\
    \ < size) value[j] = pos1[i];\n        }\n        //add NULL character to end\
    \ of the value\n        if(j < size) value[j] = '\\0';\n        else value[size-1]\
    \ = '\\0';\n    }\n}\nint main(int argc, char *argv[], char *env[])\n{\n    printf(\"\
    Content-type:text/html\\n\\n<html><body bgcolor=#23abe2>\\n\");\n    char value[255]\
    \ = \"\";\n    strncpy(value,(char *) getenv(\"QUERY_STRING\"),255);\n    printf(\"\
    QUERY_STRING : %s<BR>\\n\", value );\n    printf(\"<form>\\n\");\n    //call the\
    \ decode_value function to get value of \"ITEM1\"\n    decode_value( \"ITEM1=\"\
    , (char *) &value, 255);\n    if(strlen(value) > 0 )\n        printf(\"<input\
    \ type=\\\"TEXT\\\" name=\\\"ITEM1\\\" value=\\\"%s\\\">\\n\",value);\n    else\n\
    \        printf(\"<input type=\\\"TEXT\\\" name=\\\"ITEM1\\\">\\n\");\n    //call\
    \ the decode_value function to get value of \"ITEM2\"\n    decode_value( \"ITEM2=\"\
    , (char *) &value, 255);\n    if(strlen(value) > 0 )\n        printf(\"<input\
    \ type=\\\"TEXT\\\" name=\\\"ITEM2\\\" value=\\\"%s\\\">\\n\",value);\n    else\n\
    \        printf(\"<input type=\\\"TEXT\\\" name=\\\"ITEM2\\\">\\n\");\n    printf(\"\
    <input type=\\\"SUBMIT\\\">\");\n    printf(\"</form></body></html>\\n\");\n \
    \   return 0;\n}\n```\n```"
  merge: -1
  img_proc: true
- pgno: 52
  md: "It looks like we are going to have to do some serious work on this decode_value\
    \ package so as this is work we can expect to do over and over again it makes\
    \ sense to write a function that can be reused.\n\nFirst off we can put this function\
    \ into a separate file called decode_value.c and create a file for all the functions\
    \ we may write called c_in_linux.h and compile all this into a library. In the\
    \ Make file we can add:\n\n```\nSRC_CIL = decode_value.c\nOBJ_CIL = decode_value.o\n\
    #CIL_INCLUDES = -I/usr/include/apache2 -I. -I/usr/include/apache2 -I/usr/include/apr-1\n\
    #CIL_LIBS = -L/usr/lib/mysql -lmysqlclient -L/usr/lib -lgd -L/home/david/public_html/Ventus/code\n\
    \nall: lib_cil 4-4\n\nlib_cil:\n    gcc -c $(SRC_CIL)\n    ar rcs c_in_linux.a\
    \ $(OBJ_CIL)\n    $(RM) *.o\n\n4-4:\n    gcc -o logic4 chapter4_3.c c_in_linux.a\
    \ -lc\n    cp logic4 /home/david/public_html/cgi-bin/logic4\n```\n\nThis looks\
    \ horrible and complex but all it means is this:\ntyping “make all” will:\n\n\
    +   - compile all the *.c files listed in the list OBJ_SRC and into object files\
    \ *.o\n+   - compile all the object files into a library archive called lib_c_in_linux.a\n\
    +   - compile 4-4 using this new archive.\n\nThis is the model we will use to\
    \ keep our files as small as possible and the share-ability of code at its maximum.\n\
    \nWe can now have a simpler “main” function file, and files for stuff we might\
    \ want to write as call-able functions from anywhere really which we do not yet\
    \ know about. All this is organised into a library file (*.a for archive) – these\
    \ can also be compiled as dynamically loadable shared objects *.so which are much\
    \ like Windows DLLs. This exactly how all Linux software is written and delivered."
  merge: -1
  img_proc: true
