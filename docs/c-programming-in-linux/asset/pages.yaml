  md: "> Wikipedia defines environment variables like this:\n> \n> “In all Unix and\
    \ Unix-like systems, each process has its own private set of environment variables.\
    \ By default, when a process is created it inherits a duplicate environment of\
    \ its parent process, except for explicit changes made by the parent when it creates\
    \ the child........ All Unix operating system flavors as well as DOS and Microsoft\
    \ Windows have environment variables; however, they do not all use the same variable\
