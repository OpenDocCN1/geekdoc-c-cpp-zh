    <td><input type=hidden name=''ID'' value=''0''></td>

    <td><input type=text name=''data1'' value=''aaaaaaaaaaaaaa''></td>

    <td><input type=text name=''data2'' value=''aaaaaaaaaaaaaaa''></td>

    <td><input type=text name=''data3'' value=''aaaaaaaaaaaaaaa''></td>

    <td><input type=text name=''data4'' value=''aaaaaaaaaaaaaa''></td>

    <td><input type=text name=''data5'' value=''aaaaaaaaaaaaaaa''></td>

    <td><input type=text name=''data6'' value=''aaaaaaaaaaaaaa''></td>

    <td><input type=''submit'' value=''edit''></form>

    <a href=''?ID=0&MODE=DELETE''>delete</a></td>

    </tr>

    ```


    Close examination of the file index.php will allow you to see where all this happens,
    and to work backward to find where in the ghost.c source code this PHP code is
    generated. A good idea is to use a highlighter pen on a printout as we are embedding
    a language (HTML) inside another language (PHP) which is in turn inside another
    language so very very careful use is made of the escape characters ''\'' to express
    quotation marks both single and double where necessary to make it all work. This
    may seem complex – but the speedy prototyping that ghost permits makes it worthwhile
    to spend time customising the C code so the PHP that you want and the database
    you want come out the way you want it.


