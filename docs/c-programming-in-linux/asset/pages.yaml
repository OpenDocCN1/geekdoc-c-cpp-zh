- pgno: 45
  md: "# 4. Logic, loops and flow control\n\n# 4.1 Syntax of C Flow of control\n\n\
    We can can use the following C constructs to control program execution.\nWhen\
    \ we can count our way through a sequence or series:\n\n```\nfor( initial value;\
    \  keep on until  ; incremental change )\n{  do this; and this; and this;  }\n\
    ```\n\nWhen we are waiting for some condition to change:\n\n```\nwhile( this is\
    \ true )\n{  do this; and this; and this;  }\n```\n\nor if we want to do something\
    \ at least once then test:\n\n```\ndo {  do this; and this; and this;  }\nwhile(\
    \ this is true )\n```\n\nWhen we have a single option to test:\n\n```\nif(  this\
    \ is true )\n        {  do this; and this; and this;  }\nelse\n        {  do this;\
    \ and this; and this; }\n```\n\nWhen we have more options to test:\n\n```\nif(\
    \  this is true )\n        {  do this; and this; and this;  }\nelse if (  this\
    \ is true )\n        {  do this; and this; and this;  }\nelse\n        {  do this;\
    \ and this; and this;  }\n```\n\nWhen we have more options to test based on an\
    \ integer or single character value:\n\n```\nswitch( on an integer or character\
    \ value )\n{\n        case 0: do this; and this; and this; break;\n        case\
    \ n: do this; and this; and this; break;\n        default:do this; and this; and\
    \ this; break;\n}\n```"
  merge: -1
  img_proc: true
- pgno: 46
  md: "# 4.2 Controlling what happens and in which order\n\nThis part is all about\
    \ if, and then, and else and true and false – the nuts and bolts of how we express\
    \ and control the execution of a program. This can be very dry and dusty material\
    \ so to make it more understandable we are going to solve a problem you are going\
    \ to need to solve to do any interactive web work of any complexity.\n\nWe will\
    \ build something we can use in order to provide something like the functionality\
    \ that can be obtained from typical getParameter(\"ITEM1\") method in Java servlets\
    \ or $_REQUEST['ITEM1'] function in PHP.\n\nIn Chapter 1 we saw that environment\
    \ variables can be accessed by the implicit argument to the main function. We\
    \ can also use the library function getenv() to request the value of any named\
    \ environment variable.\n\n```\n```c\n/**********************************************************\n\
    \ * C Programming in Linux (c) David Haskins 2008\n * chapter4_1.c\n **********************************************************/\n\
    #include <stdio.h>\n#include <string.h>\n\nint main(int argc, char *argv[], char\
    \ *env[])\n{\n    printf(\"Content-type:text/html\\n\\n<html><body bgcolor=#23abe2>\\\
    n\");\n    char value[256] = \"\";\n    strncpy(value,(char *) getenv(\"QUERY_STRING\"\
    ),255);\n    printf(\"QUERY_STRING : %s<BR>\\n\", value );\n    printf(\"<form>\\\
    n\");\n    printf(\"<input type=\\\"TEXT\\\" name=\\\"ITEM1\\\">\\n\");\n    printf(\"\
    <input type=\\\"TEXT\\\" name=\\\"ITEM2\\\">\\n\");\n    printf(\"<input type=\\\
    \"SUBMIT\\\">\");\n    printf(\"</form></body></html>\\n\");\n    return 0;\n\
    }\n```\n```\n\nHere we display the QUERY_STRING which is what the program gets\
    \ as the entire contents of an HTML form which contains NAME=VALUE pairs for all\
    \ the named form elements.\n\nAn HTML form by default uses the GET method which\
    \ transmits all form data back to the program or page that contains the form unless\
    \ otherwise specified in an action attribute. This data is contained in the QUERY_STRING\
    \ as a series of variable = value pairs separated by the & character."
  merge: -1
  img_proc: true
