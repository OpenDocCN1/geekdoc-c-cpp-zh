- pgno: 43
  md: "The definition of the structure does not actually create any data, but just\
    \ sets out the formal shape of what we can instantiate. In the main function we\
    \ can express this instantiation in the form shown creating a list of sequences\
    \ of data elements that conform to the definition we have made.\n\nYou can probably\
    \ see that a struct with additional functions or methods is essentially what a\
    \ class is in Java, and this is also the case in C++. **Object Oriented languages**\
    \ start here and in fact many early systems described as \"object oriented\" were\
    \ in fact just built using C language structs.\n\nIf you take a look for example,\
    \ at the Apache server development header files you will see a lot of structs\
    \ for example in this fragment of httpd.h :\n\n```\nstruct server_addr_rec {\n\
    \  /** The next server in the list */\n  server_addr_rec *next;\n  /** The bound\
    \ address, for this server */\n  apr_sockaddr_t *host_addr;\n  /** The bound port,\
    \ for this server */\n  apr_port_t host_port;\n  /** The name given in \"<VirtualHost>\"\
    \ */\n  char *vhost;\n};\n```\n\nDont worry about what this all means – just notice\
    \ that this is a very common and very powerful technique, and the design of data\
    \ structures, just like the design of database tables to which it is closely related\
    \ are the core, key, vital task for you to understand as a programmer.\n\nYou\
    \ make the philosophical decisions that the world is like this and can be modelled\
    \ in this way. A heavy responsibility - in philosophy this work is called **ontology**\
    \ (what exists?) and **epistemology** (how we can know about it?). I bet you never\
    \ thought that this was what you were doing!\n\n# 3.5 Functions, pointers and\
