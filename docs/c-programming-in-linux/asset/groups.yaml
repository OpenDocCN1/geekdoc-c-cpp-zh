    \ 0;\n}\n```\n\n结果如下所示，照例是在浏览器中：\n\n![](img/a0cbda189e54d8cb1121c7e151992506_42_0.png)\n\
    \n这是一种非常强大且相当高级的技术，但你需要了解它。**结构体**的概念直接引出了**类**和**对象**的概念。\n\n我们可以看到，使用 struct\
    \ 极大地简化了在程序中传递数据元素以完成不同工作的业务任务。如果我们修改结构体的定义，它仍然可以工作，我们只需添加代码来处理新属性，而不必更改执行工作的函数的参数列表或签名。\n\
