    \ $(OBJ_CIL)\n    $(RM) *.o\n\n4-4:\n    gcc -o logic4 chapter4_3.c c_in_linux.a\
    \ -lc\n    cp logic4 /home/david/public_html/cgi-bin/logic4\n```\n\n这看起来既可怕又复杂，但它的意思仅仅是：键入“make\
