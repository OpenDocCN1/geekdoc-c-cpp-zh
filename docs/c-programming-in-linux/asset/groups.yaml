  mdcn: "\n## 1.5 Hello World 结论\n\n我们已经看到，一个包含少量输入和一些输出的简单程序实际上极其强大，因为它揭示并暴露了我们计算机内部的大量运作方式。\n\
    \n尽管我们才刚刚开始，但已经遇到了许多我们将反复使用的关键概念：\n\n- 函数与参数\n- 作为数据类型的数字（整数）和字符串\n- 列表或数组\n-\
    \ 使用 “for” 和 “while” 的循环\n\n我们有意迈出了一大步：从编写只在“终端屏幕”中运行的程序，转向编写可通过互联网在浏览器中看到的程序。\n\
    \n原因在于，编写在 Windows、GNOME 或 KDE 等窗口系统中与用户交互的程序极其复杂，并不是经常要求你去做的事情。\n\n如今，互联网浏览器已成为我们几乎一切活动事实上的界面模式，所以我们不妨从一开始就理解如何使用它。\n\
    \n在接下来的所有章节中，我们都将遵循这一模式：先介绍一些基本技术，然后将其应用到基于 Web 的系统中。\n\n在实践中，现实世界里并没有多少 C 公共网关接口编程，但作为\
    \ Apache 模块和 Microsoft IIS ISAPI DLL 运行的 C 和 C++ 代码却很多。也许没有多少人知道 eBay 的很大一部分是用\
    \ C/C++ 编写的。\n\n为什么？它能达到极快的速度，而他们与全球实时市场中的抢便宜货者之间的业务需要这个闪电般快速的核心，因此没有其他办法获得那种性能。\n\
    \n## 2. 数据与内存\n\n### 2.1 简单数据类型？\n\n当我们编写程序时，在声明和描述变量以表示我们想要纳入信息处理的各种事物时，我们必须对世界的本质做出决定或断言。\n\
    \n这个过程具有深刻的哲学性；我们做出**本体论**断言，即这个或那个事物存在；当我们选择特定的数据类型或数据类型集合来描述这些事物的属性时，我们做出**认识论**断言。这是沉重的事情，责任重大，不可轻率对待。\n\
    \n作为一个实际例子，我们可能声明一些看起来像地理数据库记录开头的内容。\n\n![](img/a0cbda189e54d8cb1121c7e151992506_22_0.png)\n\
    \n```c\n/******************************************************\nC Programming\
    \ in Linux (c) David Haskins 2008\nchapter2_1.c\n******************************************************/\n\
    #include <stdio.h>\n#define STRINGSIZE 256\n\nint main(int argc, char *argv[])\n\
    {\n        char town[STRINGSIZE] = \"Guildford\";\n        char county[STRINGSIZE]\
    \ = \"Surrey\";\n        char country[STRINGSIZE] = \"Great Britain\";\n     \
    \   int population = 66773;\n        float latitude = 51.238599;\n        float\
    \ longitude = -0.566257;\n        printf(\"Town name: %s  population:%d\\n\",town,population);\n\
    \        printf(\"County: %s\\n\",county);\n        printf(\"Country: %s\\n\"\
    ,country);\n        printf(\"Location latitude: %f longitude: %f\\n\",latitude,longitude);\n\
    \        printf(\"char = %d byte int = %d bytes float = %d bytes\\n\",\n     \
    \   sizeof(char),sizeof(int),sizeof(float) );\n        printf(\"memory used:%d\
    \ bytes\\n\", ((STRINGSIZE * 3) * sizeof(char) + sizeof(int) + (2 * sizeof(float))));\n\
    \        return 0;\n}\n```\n\n这里我们做了以下事情：\n\n- 断言我们在此应用程序中会遇到的所有字符串都将限制为 255 个字符，因此我们用**预处理器**语句来**定义**这一点——这些语句以\
    \ # 开头。\n- 断言城镇与郡相关联，而郡又以某种层级方式与国家相关联。\n- 断言人口按整数计数——没有半个人。\n- 断言位置将按照一种特定变体（WGS84）记录，该约定用纬度和经度描述地球表面上的点，并对度、分和秒使用小数。\n\
    \n这些语句中的每一条都会在声明它的函数的**作用域**内分配**内存**。每个**数据声明**都会占用一定数量的**字节**内存，并为那块内存赋予一个标签，即**变量名**。每种数据类型都有指定的大小，**sizeof()**\
    \ 库函数会将其作为整数返回。在本例中，是 3 x 256 个字符、一个整数和两个浮点数。确切大小取决于机器，但很可能是 780 字节。\n\n在声明数据的函数之外，该数据不可访问——这就是声明的**作用域**。如果我们声明在\
    \ main() 函数之外，它就会具有**全局**作用域，其他函数可以访问它。C 允许你愿意的话做这种危险的事情，所以要小心。\n\n通常我们会密切关注数据的作用域，并把**只读副本**或**带标签的内存地址**传递给程序中可能需要处理甚至修改数据的那部分。这些带标签的内存地址称为**指针**。\n\
    \n我们使用 **printf** 系列库函数进行输出（**sprintf** 用于创建字符串，**fprintf** 用于写入文件等），它们都使用一个共同的**格式字符串**参数来指定数据应如何表示。\n\
    \n- %c 字符\n- %s 字符串\n- %d 整数\n- %f 浮点数 等。\n\n参数中剩余的一系列变量会按指定顺序放入格式字符串中。\n\n在 C\
    \ 中，最好**初始化**你声明的任何数据，因为为它们分配的内存内容不会被清除，而可能包含任意旧垃圾。\n\n使用以下命令编译：**gcc -o data1\
    \ chapter2_1.c -lc**\n\n使用以下命令调用时程序的输出：**./data1**\n\n```\nTown name: Guildford\
    \  population:66773\nCounty: Surrey\nCountry: Great Britain\nLocation latitude:\
    \ 51.238598 longitude: -0.566257\nchar = 1 byte int = 4 bytes float = 4 bytes\n\
    memory used:780 bytes\n```\n\n### 关于 make 的说明：一个有用的工具\n\n到现在为止，你可能已经厌倦了输入所有这些编译器命令，因此有一个名为\
    \ **make** 的实用工具，它会运行代码所在文件夹中名为 **Makefile** 的文件。以下是目前为止示例的 Makefile：\n\n```makefile\n\
    #Makefile\n\nall:chap1 chap2\n\nchap1: 1-1 1-2 1-3 1-4\n\n1-1:\n\tgcc -o hello1\
    \ chapter1_1.c -lc\n\n1-2:\n\tgcc -o hello2 chapter1_2.c -lc\n\n1-3:\n\tgcc -o\
    \ hello3 chapter1_3.c -lc\n\n1-4:\n\tgcc -o hello4 chapter1_4.c -lc\n\nchap2:\
    \ 2-1 2-2\n\n2-1:\n\tgcc -o data1 chapter2_1.c -lc\n\n2-2:\n\tgcc -o data2 chapter2_2.c\
    \ -lc\n\nclean:\n\trm hello* data* *~\n```\n\n要编译所有内容，请输入 **make all**\n\n要为 chapter2_1.c\
    \ 编译目标 2-1，请输入 **make 2-1**\n\n每个 make 目标后的制表符对 make 的语法至关重要。\n\n代码包中有一份用于整本书的\
    \ Makefile。\n\n### 2.2 什么是字符串？\n\n一些编程语言（如 Java 和 C++）具有**字符串数据类型**，它隐藏了看似简单的事物背后的一些复杂性。\n\
    \n字符串的一个基本属性是，它是由长度不确定的单个字符元素组成的序列。\n\n我们可以在键盘上输入的大多数字符都由简单的数字 ASCII 码表示，而 C 数据类型\
    \ **char** 用于存储字符数据。\n\n字符串存储为以 `NULL` 结尾的字符**数组**，因此数组必须足够大，以容纳字符序列再加一个字符。记住，数组成员始终从零开始计数。\n\
    \n在此示例中，我们可以看到声明并初始化为相应值的 5 个单独字符，以及一个设置为“”的空字符数组。\n\n请点击广告\n\n![](img/a0cbda189e54d8cb1121c7e151992506_26_0.png)\n\
    \n### 你正在考虑欧洲的商科学位吗？\n\n哥本哈根商学院\n\n在大学阶段**学习商业**。我们将案例与前沿研究相结合，可单独或团队工作，而且每个人都讲英语。带回宝贵的知识和经验，以促进你的职业发展。\n\
    \n**遇见一种**由新食物、音乐和传统构成的文化，以及在安全、清洁的环境中学习商业的新方式——就在丹麦哥本哈根市中心。\n\n**参与**案例竞赛、体育运动等课外活动——在\
    \ cbs 来自 80 多个国家的 18,000 名学生中结交新朋友。\n\ncbs; EQUIS; Accredited Association of MBAs;\
    \ CEMS; PRME\n\n**在 cbs.dk 上了解我们的样貌和工作方式**\n"
