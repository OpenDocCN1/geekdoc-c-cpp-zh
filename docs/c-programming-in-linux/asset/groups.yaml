    \ int dstY, int srcX,\n    int srcY, int w, int h, int pct)\nvoid gdImagePaletteCopy(gdImagePtr\
    \ dst, gdImagePtr src)\nvoid gdImageSquareToCircle(gdImagePtr im, int radius)\n\
    void gdImageSharpen(gdImagePtr im, int pct)\n```\n\n## 其他函数：\n\n```\nint gdImageCompare(gdImagePtr\
    \ im1, gdImagePtr im2)\ngdImageInterlace(gdImagePtr im, int interlace)\ngdFree(void\
    \ *ptr)\n```\n\n为了使用这样的库，你需要熟悉其参数，这些参数通常是库本身定义的数据类型，例如 gdImagePtr，它是指向某种结构的指针，该结构包含要处理或存储的图像的所有数据。这些可能看起来都很不寻常，但过一段时间你就会开始习惯这种语法和在线文档，并开始看出复杂之中的模式。\n\
    \n## 7. Apache C 模块\n\n### 7.1 更安全的 C Web 应用\n\n在现实生活中，很少有 Web 管理员会梦想让任何人运行 C\
    \ 程序作为 CGI 内容生成器，因为存在崩溃和核心转储的风险。然而，Apache 服务器本身是用 C 编写的，其开发工具附带一些简单实用程序，允许你创建代码桩，将\
    \ C 程序放入其中，并在它们作为服务器的一部分加载时作为 Apache 模块运行，并在一种“沙盒”中安全管理。这里我们将拿一个较早的示例，把它变成一个 Apache\
    \ 模块。\n\nApache2 开发库中包含一个名为 apxs2 的实用程序，可以调用它为一个程序生成代码桩，该程序可编译成由 Apache Web 服务器加载和管理的模块。这些模块可用于执行种类繁多的任务，但在我们的例子中，我们将做类似于\
    \ IIS 服务器中 ISAPI DLL 的事情。apxs2 实用程序的确切位置会因你使用的 Linux 发行版而异，但在 OpenSuse 上它是这样运行的。\n\
    \n在终端中输入：`/usr/sbin/apxs2 -n labelmaker -g`\n\n```\ndavid@linux-bxs:~> /usr/sbin/apxs2\
    \ -n labelmaker -g\nCreating [DIR]  labelmaker\nCreating [FILE] labelmaker/Makefile\n\
    Creating [FILE] labelmaker/modules.mk\nCreating [FILE] labelmaker/mod_labelmaker.c\n\
    Creating [FILE] labelmaker/.deps\ndavid@linux-bxs:~>\n```\n\n这会创建一个以你给它的名称命名的文件夹（labelmaker），以及一个\
    \ **Makefile**、一个可供 Make 实用程序使用的 **modules.mk** 文件，还有一个名为 **mod_labelmaker.c**\
    \ 的文件。\n\n生成的 C 文件有点像 Apache 的 Hello World。它可能看起来复杂，但它确实提供了一个很长的解释性注释头，值得一读。其思路是，当\
    \ Apache 启动时，指定位置中任何被配置为需要在服务器配置文件中加载的模块都会被加载。`*_register_hooks` 函数列出了可在 Apache\
    \ 服务器进程特定阶段调用的函数名称和签名。在这种情况下，如果调用 http://localhost/labelmaker 这个名称，就会要求此模块处理 `*_handler`\
    \ 函数中发生的任何事情。\n\n服务器配置可能有点繁琐，但在 OpenSuse 中，我们必须将以下内容添加到文件\n\n**/etc/apache2/default-server.conf**\n\
    \n```\n<Location /labelmaker>\n    SetHandler labelmaker\n</Location>\n```\n\n\
    并在 **/etc/config.sys/apache2** 中，将我们的模块名 labelmaker **添加**到以下行开头的那一长串逗号分隔列表中\n\
    \n```\nAPACHE_MODULES=\".....labelmaker\"\n```\n\n现在转到 labelmaker 文件夹并输入：\n\n\
    ```\nsudo /usr/sbin/apxs2 -c -i mod_labelmaker.c\nsudo /etc/init.d/apache2 restart\n\
    ```\n\n请点击广告\n\n![](img/a0cbda189e54d8cb1121c7e151992506_73_0.png)\n\n在浏览器中这样调用：\n\
    \n![](img/a0cbda189e54d8cb1121c7e151992506_74_0.png)\n\n```c\n#include \"httpd.h\"\
    \n#include \"http_config.h\"\n#include \"http_protocol.h\"\n#include \"ap_config.h\"\
    \n\n/* The sample content handler */\nstatic int labelmaker_handler(request_rec\
    \ *r)\n{\n    if (strcmp(r->handler, \"labelmaker\")) {\n        return DECLINED;\n\
    \    }\n    r->content_type = \"text/html\";\n\n    if (!r->header_only)\n   \
    \     ap_rputs(\"The sample page from mod_labelmaker.c\\n\", r);\n    return OK;\n\
    }\n\nstatic void labelmaker_register_hooks(apr_pool_t *p)\n{\n    ap_hook_handler(labelmaker_handler,\
    \ NULL, NULL, APR_HOOK_MIDDLE);\n}\n\n/* Dispatch list for API hooks */\nmodule\
    \ AP_MODULE_DECLARE_DATA labelmaker_module = {\n    STANDARD20_MODULE_STUFF,\n\
    \    NULL,                  /* create per-dir    config structures */\n    NULL,\
    \                  /* merge  per-dir    config structures */\n    NULL,      \
    \            /* create per-server config structures */\n    NULL,            \
    \      /* merge  per-server config structures */\n    NULL,                  /*\
    \ table of config file commands       */\n    labelmaker_register_hooks /* register\
    \ hooks                   */\n};\n```\n\n### 7.2 添加一些功能\n\n现在我们可以把第 6 章为图形库所做的工作作为替换处理函数插入（在代码\
    \ Chapter7_1.c 中两个处理函数都在，其中一个被注释掉了）。注意（高亮显示的）对修改后的 decode_value 函数的调用，它使用 r->args\
    \ 指针来获取 QUERY_STRING，而不是 getenv()。另外，Apache 处理输出的方式也略有不同——调用 gdImageGifPtr 获取图像中字节数组的指针，然后由\
    \ ap_rwrite 函数输出数据。在输出调用之后，我们必须用 gdFree 释放该指针。\n\n```c\nstatic int labelmaker_handler(request_rec\
    \ *r)\n{\n    void    *iptr;\n    int sz = 0;\n\n    if (strcmp(r->handler, \"\
    labelmaker\")) {\n        return DECLINED;\n    }\n    r->content_type = \"Content-type:\
    \ image/gif\";\n    if (!r->header_only){\n        int text=0,background=0, x=0,y=0,size=30,string_rectangle[8];\n\
    \        double angle=0.0;\n        char value[255] = \"Hello\";\n        char\
    \ font[256] = \"/usr/share/fonts/truetype/DejaVuSans.ttf\";\n        char *err\
    \ = NULL;\n        gdImagePtr im_out = NULL;\n        decode_value(r,\"TEXT=\"\
    , (char *) &value, 255);\n        err=gdImageStringFT(NULL,&string_rectangle[0],0,\n\
    \            font,size,angle,0,0,value);\n        x = string_rectangle[2]-string_rectangle[6]\
    \ + 6;\n        y = string_rectangle[3]-string_rectangle[7] + 6;\n        im_out\
    \ = gdImageCreate(x,y);\n        background = gdImageColorAllocate(im_out, 0,0,0);\n\
    \        text  = gdImageColorAllocate(im_out,255,0,255);\n        x = 3 - string_rectangle[6];\n\
    \        y = 3 - string_rectangle[7];\n        err = gdImageStringFT(im_out,&string_rectangle[0],text,\n\
    \            font,size,angle,x,y,value);\n        iptr = gdImageGifPtr(im_out,&sz);\n\
    \        ap_rwrite(iptr, sz, r);\n        gdFree(iptr);\n        gdImageDestroy(im_out);\n\
    \    }\n    return OK;\n}\n```\n\n![](img/a0cbda189e54d8cb1121c7e151992506_76_0.png)\n\
    \n### 7.3 Apache 模块总结\n\n虽然编写和调试很棘手，但这可能是最有回报、最玄妙的领域，在这里你可以进行真正有商业价值且可安全部署的 Web\
    \ 内容生成。很容易看出，这个示例如何通过颜色和字体参数进行扩展，从而成为一个有用的 Web 内容工具。\n\n关于 Apache 模块的清晰简单资料很少，但可以从\
    \ http://httpd.apache.org/docs/2.2/developer/ 的在线文档开始。\n\n最近值得一看的一本书是 Nick Kew\
    \ 著、Prentice Hall 出版的《The Apache Modules Book》。\n\n![](img/a0cbda189e54d8cb1121c7e151992506_76_1.png)\n\
    \n## 8. Ghost 项目\n\n### 8.1 一个 PHP 网站生成器项目\n\n能够用 C 编写简短程序来自动化繁琐任务，或完成那些否则要花数小时摆弄笨重工具（例如做邮件合并）才能完成的事情，这会是你会最庆幸自己学会做的事情之一。这个项目就是这样的省时工具。Ghost\
    \ 是一个轻量级 PHP 生成器，供你定制。\n\n如果你发现自己总是要构建 PHP 网站，那么一步生成所有参数传递、解码、表单构建和数据库管理代码的快捷方法会很有用。像\
    \ Ruby on Rails 这样的工具提供了此类功能，但设置和运行起来要复杂得多，而且你最终还需要学习另一种语言才能继续深入。\n\n开始使用这个工具的最好方法可能就是编译并运行它。将\
    \ ghost.zip 源码解压到你的 public_html 文件夹中，这会创建一个名为 ghost 的文件夹。Makefile 包含一个目标 g1，用于编译并链接\
    \ ghost。因此转到 public_html/ghost 并输入：`make g1`。\n\n要运行网站生成器，请输入：\n\n- ./ghost testwebsite\
    \ data1 data2 data1 data3 data4 data6 data6\n- 这将创建：\n- 一个文件夹 public_html/testwebsite\n\
    - 一个名为 testwebsite 的 MySQL 数据库表，包含文本字段 data1 data2 data1 data3 data4 data6 data6\n\
    - 一个 testwebsite.css 文件\n- 空的 header.html 和 footer.html 页面\n- index.php，演示对指定数据项进行表单处理录入、编辑与更新、删除数据库表的操作。\n\
    \n在浏览器中访问 http://localhost/~yourname/testwebsite 时，你会看到如下内容\n\n![](img/a0cbda189e54d8cb1121c7e151992506_77_0.png)\n\
    \n"
