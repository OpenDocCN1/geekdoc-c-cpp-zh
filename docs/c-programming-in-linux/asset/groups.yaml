    n\");\n        fprintf(out,\"td {font-size:80%;color:#d92080;vertical-align:bottom;text-align:left;}\\\
    n\");\n        fprintf(out,\"input {font-size:80%;color:#196419;}\\n\");\n   \
    \     fprintf(out,\"a {font-size:65%;color:#000000;}\\n\");\n        fclose(out);\n\
    }\n```\n\n接下来生成 header.html 和 footer.html 文件。这些文件由 PHP 文件加载，并可用作通用的公共页眉和页脚。CSS\
    \ 文件从 header.html 文件中引用。\n\n```c\n//BUILD HEADER HTML////////////////////////////////\n\
    sprintf(BIT,\"../%s/head.html\",argv[1]);\nout = fopen(BIT,\"w\");\nfprintf(out,\"\
    <html>\\n\");\nfprintf(out,\"<head>\\n\");\nfprintf(out,\"<link rel=\\\"stylesheet\\\
