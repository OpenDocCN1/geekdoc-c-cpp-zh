    \      else value[j] = pos1[i];\n            }\n        }\n        if(j < size)\n\
    \        {\n            value[j] = '\\0';\n        }\n        else value[size-1]\
    \ = '\\0';\n    }\n}\n```\n\n## 4.3 逻辑、循环与流程总结\n\n控制程序流程最重要的部分，是要清楚地知道自己想做什么。我们还学会了将代码分解成易于管理的块，并开始构建和使用我们自己的库和头文件。\n\
    \n能够用普通语言或**伪代码**来表达一个过程是很有用的，它有助于你逐步分解代码。\n\n-   使用 **for** 循环来显式计数遍历你知道有结束点的事物。\n\
    -   使用 **while** 和 **do...while** 循环来重复操作，直到某个条件改变。\n-   使用 **switch** 语句，当整数或单个字符决定接下来发生什么时。\n\
    -   使用 **if**、**else if** 和 **else**，当互斥的条件可以按顺序测试时。\n-   复杂的 **if** 和 **else**\
    \ 以及 `not (!)` 条件组合可能最终变得难以阅读。\n-   使用花括号（`{ }`）将一切都分解成块。\n\n### 练习：\n\n现在一个有用的任务是**完成\
