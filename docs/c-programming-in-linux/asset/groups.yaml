    \ by running the ghost program.\n\n```html\n<tr>\n<form><input type='hidden' name='MODE'\
    \ value='INSERT'>\n<td><input type=hidden name='ID' value='1'>1 </td>\n<td><input\
    \ type=text name='data1'></td>\n<td><input type=text name='data2'></td>\n<td><input\
    \ type=text name='data3'></td>\n<td><input type=text name='data4'></td>\n<td><input\
    \ type=text name='data5'></td>\n<td><input type=text name='data6'></td>\n<td><input\
    \ type='submit' value='post'></td>\n</form>\n</tr>\n```\n\nFor each row in the\
    \ table we now generate a form allowing editing of the data and an anchor link\
    \ to do a delete operation.\n\n```html\n<tr>\n<form><input type='hidden' name='MODE'\
    \ value='UPDATE'>\n<td><input type=hidden name='ID' value='0'></td>\n<td><input\
    \ type=text name='data1' value='aaaaaaaaaaaaaa'></td>\n<td><input type=text name='data2'\
    \ value='aaaaaaaaaaaaaaa'></td>\n<td><input type=text name='data3' value='aaaaaaaaaaaaaaa'></td>\n\
    <td><input type=text name='data4' value='aaaaaaaaaaaaaa'></td>\n<td><input type=text\
    \ name='data5' value='aaaaaaaaaaaaaaa'></td>\n<td><input type=text name='data6'\
    \ value='aaaaaaaaaaaaaa'></td>\n<td><input type='submit' value='edit'></form>\n\
    <a href='?ID=0&MODE=DELETE'>delete</a></td>\n</tr>\n```\n\nClose examination of\
    \ the file index.php will allow you to see where all this happens, and to work\
    \ backward to find where in the ghost.c source code this PHP code is generated.\
    \ A good idea is to use a highlighter pen on a printout as we are embedding a\
    \ language (HTML) inside another language (PHP) which is in turn inside another\
    \ language so very very careful use is made of the escape characters '\\' to express\
    \ quotation marks both single and double where necessary to make it all work.\
    \ This may seem complex – but the speedy prototyping that ghost permits makes\
    \ it worthwhile to spend time customising the C code so the PHP that you want\
    \ and the database you want come out the way you want it.\n\n![](img/a0cbda189e54d8cb1121c7e151992506_81_0.png)\n\
    \nHere is the part of the PHP file index.php which generates the edit or delete\
    \ rows. The static HTML is highlighted and the other parts are inserted by MySQL\
    \ PHP function calls.\n\n```php\n$result = mysql_query(\"select * from testwebsite\"\
    );\nwhile($row = mysql_fetch_array($result))\n{\n        echo '<tr>';\n      \
    \  echo '<form><input type=hidden name=\"MODE\" value=\"UPDATE\">';\n        for($i=0;$i\
    \ < mysql_num_fields($result); $i++)\n        if($i==0){\n                echo\
    \ '<td><input type=hidden name=\"';\n                        mysql_field_name($result,\
    \ $i) . '\" value=\"'.\n                $row[mysql_field_name($result,$i)] .\n\
    \                '\">';\n                $row[mysql_field_name($result,$i)] .\n\
    \                '</td>';\n        }else\n                echo '<td><input type=text\
    \ name=\"';\n                        mysql_field_name($result, $i) .\n       \
    \                 '\" value=\"'.\n                        $row[mysql_field_name($result,$i)]\
    \ .\n                        '\"></td>';\n        echo '<td><input type=submit\
    \ value=\"edit\"></form>';\n        echo '<a href=\"?ID=' .\n                $row[mysql_field_name($result,0)]\
    \ .\n                '&MODE=DELETE\">delete</a>';\n        echo '<td></tr>';\n\
    }\nmysql_free_result($result);\nmysql_close($con);\n```\n\nAs you can see, a great\
    \ deal of tedious and repetitive work has been automated. You can move on by modifying\
    \ the PHP code or go deeper to customise the C program which generates all of\
    \ it.\n\nI personally use ghost frequently to save time on site-building and this\
    \ is why I wrote it. I got bored making mistakes writing virtually identical code\
    \ to decode HTML forms and populate or update databases.\n\n## Conclusion\n\n\
    Now you have worked through these simple examples, I hope you can see why a knowledge\
    \ of the C language is always going to be a useful and continually practical skill.\n\
    \nAfter 25 years I still regularly write C programs to do everyday tasks quickly\
    \ and effectively and once written they form part of a set of durable tools that\
    \ suit me and which are portable.\n\nThis short book contains a number of “tricks”\
    \ that I have learned over the years for which there is little explicit documentation,\
    \ and it frankly presupposes a familiarity with Linux. After testing the material\
    \ with students of a wide range of experience I am confident that an attentive\
    \ careful student will get all this material working and can start from there\
    \ to discover the joy of C. Many of my students say “This is much more fun than\
    \ Java, I can see what is really going on!” which is most gratifying and makes\
    \ me confident you will find the material useful.\n\nThose interested might ask\
    \ the publisher to commission me to write a companion volume:\n\n*C++ Standard\
    \ Template Library Programming in Linux*\n\nGood luck and happy programming.\n\
    \nDavid\nMarch 31st 2009\n"
  mdcn: "\n这背后的想法是，创建和管理表单内容的所有机械性细节都已完成，并且可以自定义。这张截图显示了提交一条记录后的结果。顶行用于输入新数据，下面的一行或多行允许编辑或删除记录。它是一个框架，允许你在自己的网站设计中取用其中的各部分。\n\
