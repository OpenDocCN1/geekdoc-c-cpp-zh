  - '[PAGE 8]


    C has been described as like "driving a Porsche with no brakes" - and because
    it is fast as well this can be exhilarating. C is often the only option when speed
    and efficiency is crucial.


    C has been called "dangerous" in that it allows low-level access to the machine
    but this scariness is exactly what you need to understand as it gives you respect
    for the higher-level languages you will use.


    Many embedded miniaturised systems are all still written in C and the machine-to-machine
    world of the invisible internet for monitoring and process control often uses
    C.


    Hopefully this list of reasons will start you thinking that it might be a good
    reason to have a go at this course.


    # References


    The C Programming Language – Second Edition - Kernighan and Richie

    ISBN 0-13-11-362-8


    The GNU C Library Free Software Foundation C Manual

    http://www.gnu.org/software/libc/manual/


    MySQL C library

    http://dev.mysql.com/doc/refman/5.1/en/index.html


    The GD C library for graphics

    http://www.libgd.org/Documentation


    APXS - the APache eXtenSion tool

    http://httpd.apache.org/docs/2.0/programs/apxs.html


    Apache

    http://httpd.apache.org/docs/2.2/developer/


    "The Apache Modules Book" Nick Kew, Prentice Hall

    ISBN 0-13-240967-4


    A Source Code Zip File Bundle is supplied with this course which contains all
    the material described and a Makefile.'
  - '[PAGE 9]


    # The teaching approach


    I began university teaching later in life after a career programming in the telecommunications
    industry.


    My concern has been to convey the sheer fun and creativity involved in getting
    computers to do what you want them to do and always try to give useful, practical,
    working examples of the kinds of things students commonly tell me they want to
    do.


    Learning a language can be a dry, boring affair unless results are immediate and
    visible so I tend to use the internet as the input-output channel right from the
    start.


    I prefer teaching an approach to programming which is deliberately “simple” using
    old-fashioned command-line tools and editors and stable, relatively unchanging
    components that are already built-in to Unix and Linux distributions such as Suse,
    Ubuntu and Red Hat.


    This is in response to the growing complexity of modern Integrated Development
    Environments (IDEs) such as Developer Studio, Netbeans and Eclipse which give
    students an illusion that they know what they are doing but generate obfuscation.


    My aim is to get students confident and up to speed quickly without all the nightmare
    associated with configuring complex tool chains. It is also essentially a license-free
    approach and runs on anything.


    With this fundamental understanding about what is really going on you can progress
    on to use and actually understand whatever tools you need in your career.


    In order to give a sense of doing something real and useful and up to date, the
    focus is on developing visible and effectively professional-quality web-server
    and client projects to put on-line, using:


    +   - Apache Web server and development libraries.

    +   - C language CGI programs (C programming using the "make" utility).

    +   - C language Apache modules.

    +   - MySQL server with C client library interfaces.

    +   - GD graphics library with C interfaces.

    +   - Incidental use of CSS, (X)HTML, XML, JavaScript, Ajax.


    This course has been designed for and lab-tested by first and second year Computer
    Science Students at Kingston University, London UK.'
  - '[PAGE 10]


    # Setting up your System


    This book presumes you are using the Linux operating system with either the KDE3.5,
    KDE4, or Gnome desktop. Specific instructions are included for Ubuntu (and Kubuntu)
    and OpenSuse 11.


    If you are using the KDE desktop you will have Konqueror or Dolphin as the File
    Manager and kate or kedit for an editor


    In Gnome you would probably use Nautilus and gedit


    You need to be familiar with the idea of doing some things as “super user” so
    that you have access permission to copy or edit certain files. This is normally
    done by prefixing the Linux command with “sudo” and providing the password, as
    in this example:


    ```

    `“sudo cp hello3 /srv/www/cgi-bin/hello3”`

    ```


    which copies the file “hello3” to the area where the Apache server locates common
    gateway interface or cgi programs.


    In KDE “kdesu konqueror” would open a file manager as super user.


    In Gnome “gnomesu nautilus” would open a file manager as super user.


    You will need to have installed the following packages:


    | package | Ubuntu | Open Suse |

    |---|---|---|

    | C development libraries | build-essential | Base Development (pattern) |

    | Apache web server | apache2 | Web and LAMP Server (pattern) |

    | Apache development libraries | apache2-prefork-dev | apache2-devel |

    | MySQL server, client and development libraries | mysql-server libmysqlclient15-dev
    | libmysqlclient-devel |

    | GD and development libraries | libgd2-xpm | gd<br>gd-devel |


    Throughout the text you will see references to the folder **cgi-bin**. The location
    of this will vary between Linux distributions. By default this folder used for
    web programs is:


    +   - OpenSuse: **/srv/www/cgi-bin**


    +   - Ubuntu: **/usr/lib/cgi-bin**'
