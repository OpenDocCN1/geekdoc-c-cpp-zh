    n\");\n    printf(\"<input type=\\\"TEXT\\\" name=\\\"ITEM1\\\">\\n\");\n    printf(\"\
    <input type=\\\"TEXT\\\" name=\\\"ITEM2\\\">\\n\");\n    printf(\"<input type=\\\
    \"SUBMIT\\\">\");\n    printf(\"</form></body></html>\\n\");\n    return 0;\n\
    }\n```\n\n这里我们显示 QUERY_STRING，它是程序收到的 HTML 表单的全部内容，其中包含所有已命名表单元素的 NAME=VALUE 对。\n\
    \nHTML 表单默认使用 GET 方法，除非在 action 属性中另有指定，否则该方法会将所有表单数据发送回包含该表单的程序或页面。这些数据以一系列由\
    \ & 字符分隔的变量 = 值对的形式包含在 QUERY_STRING 中。\n\n> 注意，在 HTML 中，事物的值用引号括起来，因此要将这些内容嵌入\
    \ C 字符串中，我们必须使用特殊符号 `\\` 对字符进行“转义”，如下所示：`\\\"ITEM1\\\"`。此外，我们在每段 HTML 输出的末尾使用\
    \ `\"\\n\"` 或显式换行符，这样当我们在浏览器中选择“查看源代码”时，会看到格式合理的文本，而不是整个页面显示为一条很长的单行。\n\n在浏览器中调用此程序时，我们会看到一个表单，并可以在框中输入一些数据：\n\
