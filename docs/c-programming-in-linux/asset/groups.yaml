  - '[PAGE 21]


    # 1.5 Hello World conclusion


    We have seen that a simple program with a tiny bit of input and some output is
    in fact extremely powerful in that it reveals and exposes the inner workings of
    a great deal of our computer.


    Even though we have just begun we have encountered many of the key concepts we
    will use over and over again:


    +   - functions and arguments

    +   - Numbers (integers) and character strings as data types

    +   - Lists or arrays

    +   - Loops using “for” and “while”


    We have made a deliberate big leap from writing a program that runs simply in
    a “terminal screen” to one which will be visible over the internet in a browser.


    The reason for this is that the process of writing programs that interact with
    users in windowing systems like Windows, Gnome or KDE is extremely complex and
    not something you will be asked very often to do .


    The internet browser has become the de facto interface mode for almost everything
    we do these days so we might as well understand using it from the start.


    In all the successive chapters we will follow this model: starting off with some
    basic technique then applying it to a web-based system.


    In practice there is not much real-world C common gateway interface programming
    going on but there is a great deal of C and C++ based code running as Apache modules
    and Microsoft IIS ISAPI Dlls. Perhaps not many know that much of Ebay is written
    in C / C++.


    Why? It is as fast as things get and their business with the bargain snipers in
    the a global real-time market needs this lightning fast core, so there is no other
    way to get that performance.'
  - '[PAGE 22]


    # 2. Data and Memory


    # 2.1 Simple data types?


    When we write programs we have to make decisions or assertions about the nature
    of the world as we declare and describe variables to represent the kinds of things
    we want to include in our information processing.


    This process is deeply philosophical; we make **ontological** assertions that
    this or that thing exists and we make **epistemological** assertions when we select
    particular data types or collections of data types to use to describe the attributes
    of these things. Heavy stuff with a great responsibility and not to be lightly
    undertaken.


    As a practical example we might declare something that looks like the beginnings
    of a database record for geography.


    ![](img/a0cbda189e54d8cb1121c7e151992506_22_0.png)'
  - "[PAGE 23]\n\n```\n```c\n/******************************************************\n\
    C Programming in Linux (c) David Haskins 2008\nchapter2_1.c\n******************************************************/\n\
    #include <stdio.h>\n#define STRINGSIZE 256\n\nint main(int argc, char *argv[])\n\
    {\n        char town[STRINGSIZE] = \"Guildford\";\n        char county[STRINGSIZE]\
    \ = \"Surrey\";\n        char country[STRINGSIZE] = \"Great Britain\";\n     \
    \   int population = 66773;\n        float latitude = 51.238599;\n        float\
    \ longitude = -0.566257;\n        printf(\"Town name: %s  population:%d\\n\",town,population);\n\
    \        printf(\"County: %s\\n\",county);\n        printf(\"Country: %s\\n\"\
    ,country);\n        printf(\"Location latitude: %f longitude: %f\\n\",latitude,longitude);\n\
    \        printf(\"char = %d byte int = %d bytes float = %d bytes\\n\",\n     \
    \   sizeof(char),sizeof(int),sizeof(float) );\n        printf(\"memory used:%d\
    \ bytes\\n\", ((STRINGSIZE * 3) * sizeof(char) +             sizeof(int) + (2\n\
    \ * sizeof(float)));\n        return 0;\n}\n```\n```\n\nHere we are doing the\
    \ following:\n\n+   - asserting that all the character strings we will ever encounter\
    \ in this application will be 255\n+     limited to characters so we **define**\
    \ this with a **preprocessor** statement – these start with #.\n+   - assert that\
    \ towns are associated with counties, and counties are associated with countries\
    \ some\n+     hierarchal manner.\n+   - assert that the population is counted\
    \ in whole numbers – no half-people.\n+   - assert the location is to be recorded\
    \ in a particular variant (WGS84) of the convention of\n+     describing spots\
    \ on the surface of the world in latitude and longitude that uses a decimal\n\
    +     fraction for degrees, minutes, and seconds.\n\nEach of these statements\
    \ allocates **memory** within the **scope** of the function in which it is declared.\
    \ Each **data declaration** will occupy an amount of memory in **bytes** and give\
    \ that bit of memory a label which is the **variable name**. Each data type has\
    \ a specified size and the **sizeof()** library function will return this as an\
    \ integer. In this case 3 x 256 characters, one integer, and two floats. The exact\
    \ size is machine dependent but probably it is 780 bytes."
  - '[PAGE 24]


    Outside the function in which the data has been declared this data is inaccessible
    – this is the **scope** of declaration. If we had declared outside the main()
    function it would be **global** in scope and other functions could access it.
    C lets you do this kind of dangerous stuff if you want to, so be careful.


    Generally we keep a close eye on the scope of data, and pass either **read-only
    copies**, or **labelled memory addresses** to our data to parts of the programs
    that might need to do work on it and even change it. These labelled memory addresses
    are called **pointers**.


    We are using for output the **printf** family of library functions (**sprintf**
    for creating strings, **fprintf** for writing to files etc) which all use a common
    **format string** argument to specify how the data is to be represented.


    +   - %c character

    +   - %s string

    +   - %d integer

    +   - %f floating point number etc.


    The remaining series of variables in the arguments are placed in sequence into
    the format string as specified.


    In C it is a good idea to **intialise** any data you declare as the contents of
    the memory allocated for them is not cleared but may contain any old rubbish.


    Compile with: **gcc -o data1 chapter2_1.c -lc**

    Output of the program when called with : **./data1**


    ```

    Town name: Guildford  population:66773

    County: Surrey

    Country: Great Britain

    Location latitude: 51.238598 longitude: -0.566257

    char = 1 byte int = 4 bytes float = 4 bytes

    memory used:780 bytes

    ```'
