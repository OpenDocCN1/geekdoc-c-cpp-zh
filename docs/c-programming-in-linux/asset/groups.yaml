  mdcn: "\n## 练习\n\n使用 C 库函数创建一个程序，该程序：\n\n- *以写入模式打开一个文件，*\n- *将一个命令行参数写入该文件*\n-\
    \ *关闭该文件*\n- *以读取模式打开该文件*\n- *读取内容*\n- *关闭该文件*\n- *将其打印到屏幕上*\n\n这将让你获得以下经验：查找信息、寻找合适的库函数，以及从网上或书中查找示例。\n\
    \n![](img/a0cbda189e54d8cb1121c7e151992506_44_0.png)\n\n## 4. 逻辑、循环与流程控制\n\n###\
    \ 4.1 C 控制流语法\n\n我们可以使用以下 C 结构来控制程序执行。\n当我们可以按计数方式遍历一个序列或一系列内容时：\n\n```c\nfor(\
    \ initial value;  keep on until  ; incremental change )\n{  do this; and this;\
    \ and this;  }\n```\n\n当我们等待某个条件发生变化时：\n\n```c\nwhile( this is true )\n{  do this;\
    \ and this; and this;  }\n```\n\n或者如果我们想至少执行一次然后再测试：\n\n```c\ndo {  do this; and\
    \ this; and this;  }\nwhile( this is true )\n```\n\n当我们有一个选项需要测试时：\n\n```c\nif(\
    \  this is true )\n        {  do this; and this; and this;  }\nelse\n        {\
    \  do this; and this; and this; }\n```\n\n当我们有更多选项需要测试时：\n\n```c\nif(  this is\
    \ true )\n        {  do this; and this; and this;  }\nelse if (  this is true\
    \ )\n        {  do this; and this; and this;  }\nelse\n        {  do this; and\
    \ this; and this;  }\n```\n\n当我们基于一个整数或单个字符值有更多选项需要测试时：\n\n```c\nswitch( on an\
    \ integer or character value )\n{\n        case 0: do this; and this; and this;\
    \ break;\n        case n: do this; and this; and this; break;\n        default:\
    \ do this; and this; and this; break;\n}\n```\n\n### 4.2 控制发生的内容及其顺序\n\n这一部分完全关于\
    \ if、then、else 以及 true 和 false——这是我们表达和控制程序执行方式的基本构件。这可能是非常枯燥乏味的材料，因此为了让它更易懂，我们将解决一个你需要解决的问题，以便完成任何具有一定复杂度的交互式\
    \ Web 工作。\n\n我们将构建一些可用的东西，以提供类似于 Java servlet 中典型的 getParameter(\"ITEM1\") 方法或\
    \ PHP 中 $_REQUEST['ITEM1'] 函数所能获得的功能。\n\n在第 1 章中，我们看到可以通过 main 函数的隐式参数访问环境变量。我们还可以使用库函数\
    \ getenv() 来请求任何指定名称的环境变量的值。\n\n```c\n/**********************************************************\n\
    \ * C Programming in Linux (c) David Haskins 2008\n * chapter4_1.c\n **********************************************************/\n\
    #include <stdio.h>\n#include <string.h>\n\nint main(int argc, char *argv[], char\
