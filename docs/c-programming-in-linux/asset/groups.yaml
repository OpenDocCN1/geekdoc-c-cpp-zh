    \n![](img/a0cbda189e54d8cb1121c7e151992506_56_0.png)\n\n## 5. 使用 MySQL 处理数据库\n\
    \n### 5.1 关于不重复造轮子\n\n每个项目都不从零开始是很明智的，我们建立在前人已经做过的工作之上。我们使用的所有 C 库都是由某人从更底层的零碎部分编写的，如果需要，我们可以访问和修改这些代码。这就是开放系统的全部意义。\n\
    \n实际上，我们只是想使用可靠的服务，而我们要使用的前两个服务无处不在——数据库访问和图形图像生成。\n\n### 5.2 MySQL C API\n\n\
    要访问 MySQL 函数集，我们确保编译器能够访问 MySQL 的头文件和库，然后直接调用一些我们无需自己编写的 MySQL 函数。\n\n在接下来的例子中，我们将数据库代码与上次所做的工作结合起来，把解码后的数据插入数据库，并读出目前存储的内容。\n\
