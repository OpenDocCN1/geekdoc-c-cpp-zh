    \n## 5. Database handling with MySQL\n\n### 5.1 On not reinventing the wheel\n\
    \nIt is pretty sensible to not start from scratch at every project so we build\
    \ on work done by others who came this way. All of the C libraries we are using\
    \ were written by someone from even lower level bits and pieces and we can access\
    \ and modify this code should we want to. This is what Open Systems is all about.\n\
    \nIn practice we simply want to use reliable services, and the first two we are\
    \ going to use are ubiquitous – databases access and graphical image generation.\n\
    \n### 5.2 MySQL C API\n\nTo access the set of MySQL functions we make sure our\
    \ compiler can access the header and libraries of MySQL and simply call some mysql\
    \ functions we have not had to write ourselves.\n\nIn this next example we join\
    \ the database code onto the last work we did and insert the decoded data into\
    \ a database, and read out what we have stored there so far.\n\nIn a new terminal\
    \ window we type:\n\n```\nmysql test\n```\n\nthen:\n\n```\ncreate table CIL (ITEM1\
    \ varchar(255),ITEM2 varchar(255));\n```\n\nThis creates a table for the program\
    \ to write to in the test database that should already be created in your MySQL\
