    \n## 关于作者，大卫·哈斯金斯\n\n我 1950 年出生于伦敦切尔西，但在新西兰长大，1966 年返回英国。在做了几年职业鼓手后，我自 1975 年起一直在计算机行业工作。\n\
    \n我的第一段经历是在斯佩里·尤尼瓦克（现为 Unisys）做了五年大型机硬件工程师，随后在伦敦的英国电信做了 14 年分析程序员。\n\n在从事转换大量地理数据（地图坐标参考）的复杂任务时，我发现了\
    \ C 的乐趣——它的速度和效率。那是在 1985 年，从那以后我一直是 C 的粉丝。\n\n自 1994 年以来，我一直是伦敦金斯顿大学计算、信息系统与数学学院的高级讲师。这主要是一所技术大学，由一所前理工学院发展而来，拥有悠久的航空工程传统。\n\
    \n我主要从事向庞大且多元文化的学生群体教授多种计算机语言和互联网系统设计。\n\n我的大多数学术研究和商业咨询都涉及空间系统设计，而大数据量和必要的处理效率问题促使我专注于\
    \ C 和 C++。我的教学网站是 www.ubiubi.org，其中展示了部分材料。\n\n作为开放系统的热心爱好者，自 2002 年以来我一直将所有教学完全集中在\
    \ Linux 平台上，而金斯顿大学在为所有学生实验室提供双启动设施方面已相当先进。\n\n![](img/a0cbda189e54d8cb1121c7e151992506_6_0.png)\n\
    \n我热爱游泳，2009 年完成了在澳大利亚维多利亚州举行的年度洛恩*码头到酒吧*游泳赛；这是世界上最大的公开海域游泳比赛，每年一月，4500 名各年龄段的人都会游泳，鲨鱼侦察机从头顶飞过。\n\
    \n不教学时，我热衷于种菜，也是一名业余音乐人，在爵士乐队和苏格兰风笛乐队中演奏。我会打鼓、演奏高地大风笛、单簧管、吉他和钢琴。\n\n## 引言\n\n\
    ### 为什么要学习 C 语言？\n\n因为 C 语言就像拉丁语——它是有限的，而且多年没有变化。C 紧凑而精简，在当前经济环境下，我们将需要一大批懂 C\
    \ 的年轻人来维持现有重要系统的运行。\n\nC 直接内置于 Linux 和 Unix 的核心。Unix 背后的设计理念是用 C 编写操作系统，因此将其移植到新架构所需的只是一个\
    \ C 编译器。Linux 本质上是一系列早期尝试制作 PC 版 Unix 的成功故事。\n\n懂 C 现在是、而且多年来一直是严肃软件专业人员的先决条件；随着开放系统近来的流行和成熟，这一点更加正确。C\
    \ 的简洁性和被认为的难度使其在 20 世纪 90 年代末被 Java 取代而退出大学教学，但一些教学群体中日益有一种感觉：Java 其实并不是开始教初学者的好选择。\n\
    \n矛盾的是，学生进入大学时对计算的了解比十年前更少，因为编程被认为对学校来说太难教。与此同时，对合格 IT 专业人员所期望的知识体系每几年就不可阻挡地翻一番。\n\
    \nJava 通常作为第一门语言教授，但可能会让学生困惑，因为它不断变化、非常抽象而强大，并且变得过于庞大，做同一件事有太多不同方法。它还有点“安全”，使学生与可怕的体验隔离开来，比如开车时有安全气囊、戴着耳机听音乐，所以你会不那么小心。对于从类和对象开始学习的人来说，在方法内编写过程式代码的核心活动似乎难以理解。\n\
    \n那么我们从哪里开始？一个明智的地方是“从头开始”，而 C 已经接近我们大多数人需要达到的底层程度，除非我们要成为硬件设计师。即使对这些学生来说，从 C\
    \ 开始并进一步深入机器底层也是一个好主意。\n\nC 就像拥有一把非常锋利的刀，它可能很危险，但如果你要学做厨师，你会需要一把，并且可能在探索它能做什么时割伤自己。同样，C\
    \ 期望你知道自己在做什么；如果你不知道，它不会在崩溃前警告你。\n\n掌握 C 会让你深入了解 Java 等高级语言表面之下发生的事情。C 的语法几乎可以保证你会轻松理解后来出现的其他语言，如\
    \ C++、Java、Javascript 和 C#。\n\nC 让你能够在细粒度的位级别访问机器核心及其所有资源。\n\n"
