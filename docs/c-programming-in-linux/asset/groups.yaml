    \ name='data4'></td>\n<td><input type=text name='data5'></td>\n<td><input type=text\
    \ name='data6'></td>\n<td><input type='submit' value='post'></td>\n</form>\n</tr>\n\
    ```\n\n现在我们为表中的每一行生成一个表单，允许编辑数据，并生成一个用于执行删除操作的锚链接。\n\n```html\n<tr>\n<form><input\
    \ type='hidden' name='MODE' value='UPDATE'>\n<td><input type=hidden name='ID'\
