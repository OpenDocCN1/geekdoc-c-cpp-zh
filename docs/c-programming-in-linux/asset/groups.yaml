    \ +44 (0)20 7000 7573\n\n提交表单后，我们会看到：\n\n![](img/a0cbda189e54d8cb1121c7e151992506_48_0.png)\n\
    \n要充分理解 QUERY_STRING 并在其中找到特定值，我们将不得不**解析**它，把它切分成各个组成部分，为此我们需要一些**条件逻辑**（if、else\
    \ 等）以及一些**循环**来遍历变量中的字符。理想情况下，应该创建一个用于此目的的基本函数，因为这是你可能需要反复执行的任务，所以拥有一段可以重复调用的代码是合理的。\n\
    \n在下一个示例中，我们添加了这个函数，输出中明显的区别是，在解析出提取的值之后，我们可以将它们插入 HTML 框中。我们似乎已经成功创建了类似 Java\
    \ getParameter() 函数的东西——真的是这样吗？\n\n![](img/a0cbda189e54d8cb1121c7e151992506_48_1.png)\n\
    \n仔细查看 chapter4_2.c，并用 A-Z、a-z 或数字以外的字符进行尝试，你会发现有些地方不太对劲。这里发生了某种编码！\n\n如果我在第一个字段中输入\
    \ **DAVID !!!**：\n\n![](img/a0cbda189e54d8cb1121c7e151992506_49_0.png)\n\n我得到这个结果：\n\
    \n![](img/a0cbda189e54d8cb1121c7e151992506_49_1.png)\n\n**空格字符变成了 +，而 ! 变成了 %21。**\n\
    \n出现这种编码是因为某些字符在传输协议本身中被显式使用。\n例如，& 用于分隔 QUERY_STRING 的各个部分，而空格不能按原样发送。\n\n任何希望使用\
    \ HTML 表单信息的程序都必须能够解码所有这些内容，\n我们现在将尝试这样做。\n\n程序 chapter4_2.c 完成了我们目前看到的功能。它在同一个文件中包含一个\
    \ main 函数和一个 decode_value 函数。\n\ndecode_value 函数接受三个参数：\n\n1. 我们要查找的值的名称，\"ITEM1=\"\
    \ 或 \"ITEM2=\"。\n2. 如果找到该值，我们将把值放入其中的变量的地址\n3. 要复制的最大字符数\n\n该函数在 QUERY_STRING\
    \ 中查找值的起始位置和结束位置，然后将找到的字符逐个复制到 value 变量中，并添加一个 NULL 字符来终止字符串。\n\n![](img/a0cbda189e54d8cb1121c7e151992506_50_0.png)\n\
    \n```c\n/********************************************************\n * C Programming\
    \ in Linux (c) David Haskins 2008\n * chapter4_2.c\n ********************************************************/\n\
    #include <stdio.h>\n#include <string.h>\n\nvoid decode_value(const char *key,\
    \ char *value, int size)\n{\n    int length = 0, i = 0, j = 0;\n    char *pos1\
    \ = NULL, *pos2 = NULL;\n    //if the string key is in the query string\n    if\
    \ ( (pos1 = strstr((char *) getenv(\"QUERY_STRING\"), key)) != NULL )\n    {\n\
    \        //find start of value for this key\n        for(i=0; i<strlen(key); i++)\
    \ pos1++;\n        //find length of the value\n        if( (pos2 = strstr(pos1,\
    \ \"&\")) != NULL )\n            length = pos2 - pos1;\n        else length =\
    \ strlen(pos1);\n        //character by character, copy value from query string\n\
    \        for(i = 0, j = 0; i < length ; i++, j++)\n        {\n            if(j\
    \ < size) value[j] = pos1[i];\n        }\n        //add NULL character to end\
    \ of the value\n        if(j < size) value[j] = '\\0';\n        else value[size-1]\
    \ = '\\0';\n    }\n}\nint main(int argc, char *argv[], char *env[])\n{\n    printf(\"\
    Content-type:text/html\\n\\n<html><body bgcolor=#23abe2>\\n\");\n    char value[255]\
    \ = \"\";\n    strncpy(value,(char *) getenv(\"QUERY_STRING\"),255);\n    printf(\"\
    QUERY_STRING : %s<BR>\\n\", value );\n    printf(\"<form>\\n\");\n    //call the\
    \ decode_value function to get value of \"ITEM1\"\n    decode_value( \"ITEM1=\"\
    , (char *) &value, 255);\n    if(strlen(value) > 0 )\n        printf(\"<input\
    \ type=\\\"TEXT\\\" name=\\\"ITEM1\\\" value=\\\"%s\\\">\\n\",value);\n    else\n\
    \        printf(\"<input type=\\\"TEXT\\\" name=\\\"ITEM1\\\">\\n\");\n    //call\
    \ the decode_value function to get value of \"ITEM2\"\n    decode_value( \"ITEM2=\"\
    , (char *) &value, 255);\n    if(strlen(value) > 0 )\n        printf(\"<input\
    \ type=\\\"TEXT\\\" name=\\\"ITEM2\\\" value=\\\"%s\\\">\\n\",value);\n    else\n\
    \        printf(\"<input type=\\\"TEXT\\\" name=\\\"ITEM2\\\">\\n\");\n    printf(\"\
    <input type=\\\"SUBMIT\\\">\");\n    printf(\"</form></body></html>\\n\");\n \
    \   return 0;\n}\n```\n"
