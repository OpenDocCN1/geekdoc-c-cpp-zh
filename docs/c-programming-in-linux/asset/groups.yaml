    <VirtualHost>\" */\n  char *vhost;\n};\n```\n\n不要担心这一切意味着什么——只需注意，这是一种非常常见且非常强大的技术，而数据结构的设计，就像与之密切相关的数据库表的设计一样，是作为一名程序员需要理解的核心、关键、至关重要的任务。\n\
    \n你做出了哲学上的决定：世界就是这样的，并且可以用这种方式建模。这是一项沉重的责任——在哲学中，这项工作被称为**本体论**（存在什么？）和**认识论**（我们如何知道它？）。我敢打赌，你从未想过这就是你正在做的事情！\n\
