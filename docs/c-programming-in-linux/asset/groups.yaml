    \ = '\\0';\n    }\n}\n```\n\n## 4.3 Logic, loops and flow conclusion\n\nThe most\
    \ important part of controlling the flow of your program is to have a clear idea\
    \ about what it is you are trying to do. We have also learned to break our code\
    \ up into manageable lumps, and started to build and use a library and header\
    \ file of our own.\n\nBeing able to express a process in normal words or **pseudocode**\
    \ is useful and helps you to break the code into steps.\n\n- Use **for** loops\
    \ to explicitly count through things you know have an ending point.\n- Use **while**\
    \ and **do...while** loops to do things until some condition changes.\n- Use **switch**\
    \ statements to when integers or single characters determine what happens next.\n\
    - Use **if** and **else if** and **else** when mutually exclusive things can be\
    \ tested in a sequence.\n- Complex sets of **if** and **else** and `not (!)` conditionals\
    \ can end up unreadable.\n- Use braces (`{ }`) to break it all up into chunks.\n\
    \n### Exercise:\n\nA useful task now would be **complete the function decode_value**\
