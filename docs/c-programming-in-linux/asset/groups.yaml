    \ 执行，或运行程序，它应返回以下文本：\n\n```text\nHello, you are still learning C!!\nNumber of\
    \ arguments to the main function:1\nargument number 0 is ./hello2\n```\n\n我们可以看到程序本身的名称被计为命令行参数，并且参数列表或数组中事物的计数是从零开始而不是从一开始。\n\
    \n现在输入 **./hello2 my name is David** 执行程序，它应返回以下文本：\n\n```text\nHello, you are\
    \ still learning C!!\nNumber of arguments to the main function:5\nargument number\
    \ 0 is ./hello2\nargument number 1 is my\nargument number 2 is name\nargument\
    \ number 3 is is\nargument number 4 is David\n```\n\n那么，这里发生了什么？看起来我们正在读回运行程序时输入的每个字符字符串（单词）。\n\
    \n### 程序结构：\n\n```c\nprintf(\"Hello, you are learning C!\\n\");\n```\n\n库函数 printf\
    \ 被调用，带有一个参数，即以 \\n 或换行字符结尾的字符字符串。\n\n```c\nprintf(\"Number of arguments to the\
    \ main function: %d\\n\", argc);\n```\n\n库函数 printf 被调用，带两个参数，一个以 \\n 结尾的字符字符串，其中包含\
    \ %d 作为第二个参数 argc 的占位符，argc 是一个 int。\n\n```c\nfor(i=0; i<argc; i++)\n```\n\n这是一个“for\
    \ 循环”，我们使用计数器整数 i 反复执行某事，i 在每次迭代时递增（通过表达式 i++），循环在 i 保持小于 argc 的值时继续。\n\n```c\n\
    printf(\"argument number %d is %s\\n\", i, argv[i]);\n```\n\n库函数 printf 被调用，带三个参数，一个以\
    \ \\n 结尾的字符字符串，其中包含 %d 作为第二个参数 i 的占位符，i 是一个 int，以及 %s 作为第三个参数 argv[i] 的占位符，argv[i]\
    \ 是名为 argv[] 的字符字符串指针数组的第 i 个成员。\n\n## 1.3 Hello 程序 3\n\n让我们实际操作并在网页中运行它。做一个额外的更改，添加第一个输出\
    \ printf 语句 “Content-type:text/plain\\n\\n”，它告诉服务器将要传输的 MIME 类型。\n\n使用 **gcc -o\
    \ hello3 chapter1_3.c** 编译，并将编译后的文件 hello3 复制到你的 public_html/cgi-bin 目录（或在自己的机器上以超级用户身份将程序复制到\
    \ /usr/www/cgi-bin（OpenSuse）或 /usr/lib/cgi-bin（Ubuntu））。\n\n```c\n/*************************************************************\n\
    \ * C Programming in Linux (c) David Haskins 2008\n * chapter1_3.c           \
    \         *\n *************************************************************/\n\
    #include <stdio.h>\n\nint main(int argc, char *argv[])\n{\n    int i=0;\n    printf(\"\
    Content-type:text/plain\\n\\n\");\n    printf(\"Hello, you are still learning\
    \ C!!\\n\");\n    printf(\"Number of arguments to the main function:%d\\n\", argc);\n\
    \    for(i=0;i<argc;i++)\n    {\n        printf(\"argument number %d is %s\\n\"\
    , i, argv[i]);\n    }\n    return 0;\n}\n```\n\n打开一个网页浏览器并在 URL 中输入 http://localhost/cgi-bin/hello3?david+haskins，你应该会看到网页内容可以由\
    \ C 程序生成。\n\n![](img/a0cbda189e54d8cb1121c7e151992506_17_0.png)\n\n## 1.4 Hello\
    \ 程序 4\n\n“main” 函数签名的鲜少被记录的特性是它可以接受 **三个** 参数，我们现在要查看的最后一个参数是 char *env[ ]，它也是一个指针列表，但在此情况下，这些是指程序运行时可用的\
    \ **系统环境变量**。\n\n```c\n/*..........................................................................\n\
    \ * C Programming in Linux (c) David Haskins 2008\n * chapter1_4.c           \
    \                         *\n *..........................................................................*/\n\
    #include <stdio.h>\n\n\nint main(int argc, char *argv[], char *env[])\n{\n   \
    \ int i=0;\n\n    printf(\"Content-type:text/plain\\n\\n\");\n    printf(\"Hello,\
    \ you are still learning C!\\n\");\n    printf(\"Number of arguments to the main\
    \ function:%d\\n\", argc);\n    for(i=0;i<argc;i++)\n    {\n        printf(\"\
    argument number %d is %s\\n\", i, argv[i]);\n    }\n    i = 0;\n    printf(\"\
    Environment variables:\\n\");\n    while(env[i])\n    {\n        printf(\"env[%d]\
    \ = %s\\n\", i, env[i]);\n        i++;\n    }\n    return 0;\n}\n```\n\n使用 **gcc\
    \ -o hello4 chapter1_4.c** 编译，并以超级用户身份将程序复制到 **/srv/www/cgi-bin**（OpenSuse）或 **/usr/lib/cgi-bin**（Ubuntu）。你可以在编译它的终端中使用\
    \ **./hello4** 运行它，你会看到一长串环境变量。在浏览器中输入 **http://localhost/cgi-bin/hello4** 时，你会看到完全不同的集合。\n\
    \n> Wikipedia 对环境变量的定义如下：\n> \n> “在所有 Unix 和类 Unix 系统中，每个进程都有自己私有的环境变量集合。默认情况下，进程创建时它会继承其父进程的重复环境，除非父进程在创建子进程时做了明确更改........\
    \ 所有 Unix 操作系统变种以及 DOS 和 Microsoft Windows 都有环境变量；然而，它们并不都使用相同的变量名。运行中的程序可以访问环境变量的值以进行配置。环境变量的例子包括......\
    \ PATH, HOME... “\n\n![](img/a0cbda189e54d8cb1121c7e151992506_19_0.png)\n\n![](img/a0cbda189e54d8cb1121c7e151992506_20_0.png)\n\
    \n我们很快会发现 **QUERY_STRING** 是我们在与程序通信时一个重要的环境变量，在此情况下我们看到它的值是 “david+haskins”，即我们在\
    \ URL 中输入的 “?” 之后的所有内容。这是一种向 **通用网关接口 (CGI)** 程序（如 hello4）发送信息的有效方式，但我们应将其限制为仅一个字符串。在我们的例子中，我们使用了\
    \ “+” 来连接两个字符串。如果我们输入：“david haskins”，浏览器会将其转换，因此我们会看到：\n\n```text\nQUERY_STRING=david%20haskins\n\
    ```\n\n我们稍后将学习如何将复杂的输入值集合传输到我们的程序中。\n\n"
