    sprintf(BIT,\"../%s/foot.html\",argv[1]);\nout = fopen(BIT,\"w\");\nfprintf(out,\"\
    </body></html>\\n\");\nfclose(out);\n```\n\n![](img/a0cbda189e54d8cb1121c7e151992506_79_0.png)\n\
    \n接下来我们创建数据库。\n\n```c\n//OPEN DATABASE////////////////////////////////////\nconn\
