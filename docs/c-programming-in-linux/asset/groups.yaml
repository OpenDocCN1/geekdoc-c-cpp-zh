    \ mim@london.edu  \nwww.london.edu/mim/\n\n### 脱颖而出\n\n伦敦商学院管理学硕士专为拥有不到一年全职研究生工作经验的毕业生设计，将拓展你的思维，并为你提供在商业领域取得成功的职业基础。\n\
    \n该课程在与招聘人员协商后开发，旨在为你提供顶尖雇主所需的关键技能。通过 11 个月的全日制学习，你将获得商业知识和能力，以增加职业选择并在人群中脱颖而出。\n\
