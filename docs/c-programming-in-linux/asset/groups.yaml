    \        char SQLINSERT[STRINGSIZE]=\"\";\n        char SQLUPDATE[STRINGSIZE]=\"\
    \";\n        char SQLDELETE[STRINGSIZE]=\"\";\n        int rc=0, i=0, num_fields=0;\n\
    \n        //CREATE DIRECTORY////////////////////\n        sprintf(BIT,\"mkdir\
