    \ value=\"'.\n                        $row[mysql_field_name($result,$i)] .\n \
    \                       '\"></td>';\n        echo '<td><input type=submit value=\"\
    edit\"></form>';\n        echo '<a href=\"?ID=' .\n                $row[mysql_field_name($result,0)]\
    \ .\n                '&MODE=DELETE\">delete</a>';\n        echo '<td></tr>';\n\
    }\nmysql_free_result($result);\nmysql_close($con);\n```\n\n如你所见，大量繁琐且重复的工作已经自动化。你可以继续修改\
    \ PHP 代码，或更深入地自定义生成所有这些内容的 C 程序。\n\n我个人经常使用 ghost 来节省建站时间，这也是我编写它的原因。我厌倦了在编写几乎相同的代码时犯错，这些代码用于解码\
    \ HTML 表单并填充或更新数据库。\n\n## 结论\n\n现在你已经完成这些简单示例，我希望你能明白为什么 C 语言知识始终是一项有用且持续实用的技能。\n\
    \n25 年之后，我仍然经常编写 C 程序来快速有效地完成日常工作；一旦写成，它们就成为一套适合我且可移植的持久工具的一部分。\n\n这本小书包含了我多年来学到的一些“技巧”，关于这些技巧的明确文档很少；并且它坦率地预设读者熟悉\
    \ Linux。在让各种经验水平的学生测试这些材料之后，我确信，一个认真细心的学生能够把所有这些材料运行起来，并可以从那里开始发现 C 的乐趣。我的许多学生说：“这比\
    \ Java 有趣多了，我能看到真正发生了什么！”这让我非常欣慰，也让我确信你会发现这些材料很有用。\n\n感兴趣的人可以请出版商委托我编写一本配套书：\n\
    \n*Linux 下的 C++ 标准模板库编程*\n\n祝你好运，编程愉快。\n\n大卫\n2009年3月31日\n\n"
