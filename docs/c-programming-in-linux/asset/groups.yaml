    \n## 3.4 数据结构\n\n有时我们希望将一组变量作为一个整体来管理，也许是从一条数据库记录中取出所有值，并在整个程序中传递整条记录来处理它。为此，我们可以将数据分组到结构体中。\n\
    \n这个程序使用 struct 来为一个称为 player 的对象定义一组属性。main 函数包含一个包含 5 名 player 的数组的声明和实例化。我们依次将指向每个数组成员的指针传递给一个函数，来为每个成员排名。该函数使用\
    \ switch 语句检查每个 player 名称的首字母，以进行任意排名。然后，我们依次将指向每个数组成员的指针传递给一个打印详细信息的函数。\n\n![](img/a0cbda189e54d8cb1121c7e151992506_40_0.png)\n\
