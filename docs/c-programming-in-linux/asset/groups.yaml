    \ value='aaaaaaaaaaaaaa'></td>\n<td><input type=text name='data5' value='aaaaaaaaaaaaaaa'></td>\n\
    <td><input type=text name='data6' value='aaaaaaaaaaaaaa'></td>\n<td><input type='submit'\
    \ value='edit'></form>\n<a href='?ID=0&MODE=DELETE'>delete</a></td>\n</tr>\n```\n\
    \n仔细检查 index.php 文件，你就能看到这一切发生在哪里，并反向追溯，找到这段 PHP 代码在 ghost.c 源代码中生成的位置。一个好主意是在打印稿上使用荧光笔，因为我们是在把一种语言（HTML）嵌入另一种语言（PHP），而后者又嵌入另一种语言，因此要非常非常小心地使用转义字符\
    \ '\\'，以便在必要时表示单引号和双引号，使一切正常工作。这看起来可能很复杂——但 ghost 所提供的快速原型开发能力，使得花时间自定义 C 代码是值得的，这样你想要的\
    \ PHP 和你想要的数据库就会以你想要的方式生成。\n\n![](img/a0cbda189e54d8cb1121c7e151992506_81_0.png)\n\
