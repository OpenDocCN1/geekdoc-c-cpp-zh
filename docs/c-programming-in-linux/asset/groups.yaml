    ,%s varchar(255)\",argv[i]);\n\tstrcat(SQL,BIT);\n}\nstrcat(SQL,\");\");\nrc =\
    \ mysql_query(conn,SQL);\n```\n\n现在开始进入复杂部分：生成 PHP 脚本。理解这一点的最佳方式，是在浏览器中查看页面源代码时检查程序的实际输出。\n\
    \n顶行是一个表单，其中为通过运行 ghost 程序生成的表中定义的每一列都提供一个文本框。\n\n```html\n<tr>\n<form><input\
    \ type='hidden' name='MODE' value='INSERT'>\n<td><input type=hidden name='ID'\
    \ value='1'>1 </td>\n<td><input type=text name='data1'></td>\n<td><input type=text\
