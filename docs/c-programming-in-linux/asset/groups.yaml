    ## 3.2 库函数\n\nC 包含许多用于执行常用任务的内置函数。到目前为止，我们已经使用了 atoi、printf、sizeof、strtok 和 sqrt。要获取任何内置库函数的完整详情，我们只需输入例如：\n\
