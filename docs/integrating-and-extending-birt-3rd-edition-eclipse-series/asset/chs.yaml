  \n#### 理解 Hibernate ODA 驱动扩展示例\n\nHibernate ODA 扩展示例的包 `org.eclipse.birt.report.data.oda.hibernate`\
  \ 使用 DTP 插件中定义的 ODA 插件接口 `org.eclipse.datatools.connectivity.oda` 以及 XML 架构文件 `datasource.exsd`\
  \ 中定义的扩展点实现了以下类。该包实现了以下类：\n\n- `Activator`：继承自 `org.eclipse.core.runtime.Plugin`。定义了启动、管理和停止插件实例的方法。\n\
  - `HibernateDriver`：实现了 `IDriver` 接口。为 Hibernate ODA 驱动实例化连接对象，该对象提供了 Hibernate\
  \ ODA 插件的入口。\n- `Connection`：实现了 `IConnection` 接口。打开和关闭与 Hibernate ODA 数据源的连接，并实例化\
  \ `IQuery` 对象。\n- `Statement`：实现了 `IQuery` 接口。准备结果集元数据，执行查询并从数据源获取行。\n- `ResultSet`：实现了\
  \ `IResultSet` 接口。提供对结果集中数据的访问，维护指向当前行的游标。处理指定数据类型的值。\n- `ResultSetMetaData`：实现了\
  \ `IResultSetMetaData` 接口。描述结果集中每个列的元数据。\n- `DataSetMetaData`：实现了 `IDataSetMetaData`\
  \ 接口。描述数据集的功能。\n- `Messages`：定义驱动程序的消息。\n- `DataTypes`：验证并返回 Hibernate 的类型。\n- `Constant`：定义包中的常量，例如驱动名称、版本、关键字。\n\
  - `HibernateUtil`：管理 `SessionFactory`，提供运行时接口。\n\n##### 理解 HibernateDriver\n\n`HibernateDriver`\
  \ 类为 Hibernate ODA 驱动实例化连接对象。该类实现了 `IDriver` 接口，但没有提供任何针对应用程序日志的处理。\n\n```java\n\
  public IConnection getConnection( String connectionClassName ) throws OdaException\n\
  {\n    return new Connection( );\n}\n```\n\n`getMaxConnections()` 返回 `0`，对来自 ODA\
  \ 源的连接数不设限制。\n\n```java\npublic int getMaxConnections() throws OdaException\n{\n\
  \    return 0;\n}\n```\n\n### 理解 Connection\n\n`Connection` 类实现了以下方法：\n\n- `open()`：打开\
  \ Hibernate 会话并将布尔变量 `isOpen` 设置为 `true`。`open()` 方法使用 `HibernateUtil` 类从 `SessionFactory`\
  \ 获取会话，提供 Hibernate 服务与 ODA 驱动之间的运行时接口。`open()` 方法从连接属性获取 Hibernate 配置文件和映射目录的位置。`open()`\
  \ 方法调用 `HibernateUtil.constructSessionFactory()`，尝试根据这些设置构建 `SessionFactory`。如果\
  \ `SessionFactory` 存在，除非 Hibernate 配置文件或映射目录发生了变化，否则插件不会重新创建它。\n\n```java\npublic\
  \ void open( Properties connProperties ) throws OdaException\n{\n    try\n    {\n\
  \        configfile = connProperties.getProperty( \"HIBCONFIG\" );\n        mapdir\
  \ = connProperties.getProperty( \"MAPDIR\" );\n        HibernateUtil.constructSessionFactory(\
  \ configfile, mapdir );\n        Session testSession = HibernateUtil.currentSession(\
  \ );\n        this.isOpen = true;\n    }\n    catch( Exception e )\n    {\n    \
  \    throw new OdaException( e.getLocalizedMessage() );\n    }\n}\n```\n\n- `newQuery()`\n\
  \n\n\n\n\n通过返回 `Statement` 对象的实例来开启新查询，该类实现了 `IQuery` 接口。连接可以处理多种结果集类型，但 Hibernate\
  \ ODA 示例仅使用一种，并忽略了 `dataSetType` 参数，如列表 20-36 所示。\n\n**列表 20-36** `newQuery()` 方法\n\
  \n```java\npublic IQuery newQuery( String dataSetType )\n   throws OdaException\n\
  {\n   if ( !isOpen( ) )\n      throw new OdaException( Messages.getString\n    \
  \      ( \"Common.CONNECTION_IS_NOT_OPEN\" ) );\n   return new Statement( this );\n\
  }\n```\n\n- `getMetaData()`\n  返回数据集类型的 `IDSetMetaData` 对象，如列表 20-37 所示。\n\n**列表\
  \ 20-37** `getMetaData()` 方法\n\n```java\npublic IDataSetMetaData getMetaData( String\
  \ dataSetType )\n   throws OdaException\n{\n   return new DataSetMetaData( this\
  \ );\n}\n```\n\n- `getMaxQueries()`\n  指示驱动程序支持的最大查询数。`getMaxQueries()` 方法返回 `1`，表示\
  \ Hibernate ODA 驱动程序不支持并发查询，如列表 20-38 所示。\n\n**列表 20-38** `getMaxQueries()` 方法\n\
  \n```java\npublic int getMaxQueries( ) throws OdaException\n{\n   return 1;\n}\n\
  ```\n\n- `commit()` 和 `rollback()`\n  处理事务处理。Hibernate ODA 驱动示例不支持事务操作。在 `Connection`\
  \ 类中，`commit()` 和 `rollback()` 方法会抛出 `UnsupportedOperationException`。[列表 20-39 显示了\
  \ `commit()` 方法的代码。\n\n**列表 20-39** `commit()` 方法\n\n```java\npublic void commit(\
  \ ) throws OdaException\n{\n   throw new UnsupportedOperationException ( );\n}\n\
  ```\n\n- `close()`\n  关闭 Hibernate 会话，如列表 20-40 所示。\n\n**列表 20-40** `close()` 方法\n\
  \n```java\npublic void close( ) throws OdaException\n{\n   this.isOpen = false;\n\
  \   try{\n      HibernateUtil.closeSession( );\n   }catch(Exception e){\n      throw\
  \ new OdaException( e.getLocalizedMessage( ) );\n   }\n}\n```\n\n### 理解 DataSetMetaData\n\
  \n`DataSetMetaData` 类描述了指定数据集的数据源的功能和能力。Hibernate ODA 驱动示例返回 `true` 或 `false` 来表示对某项功能的支持。Hibernate\
  \ ODA 驱动示例不支持输入或输出参数、命名参数或多个结果集。\n\n以下代码示例表明 Hibernate ODA 驱动不支持多个结果集，如列表 20-41\
  \ 所示。\n\n**列表 20-41** `supportsMultipleResultSets()` 方法\n\n```java\npublic boolean\
  \ supportsMultipleResultSets( ) throws OdaException\n{\n   return false;\n}\n```\n\
  \n如 `getSQLStateType()` 这样没有实现的方法简单地抛出 `UnsupportedOperationException`，如列表 20-42\
  \ 所示。\n\n**列表 20-42** `getSQLStateType()` 方法\n\n```java\npublic int getSQLStateType(\
  \ ) throws OdaException\n{\n   throw new UnsupportedOperationException ( );\n}\n\
  ```\n\n### 理解 Statement\n\n`Statement` 类实现了 `IQuery` 接口。该类准备并执行查询。`Statement` 还处理参数并检索结果集以及结果集元数据。\n\
  \n`Statement` 类实现了以下方法：\n\n- `prepare()`\n  ODA 框架在执行查询之前调用 `prepare()` 方法。ODA 框架使用保存在报告设计中的查询。\n\
  \n  Hibernate ODA 用户界面插件也会调用 `prepare()` 来验证在报告设计中使用的列。用户界面插件传递一个 HQL 语句，该语句从结果集对象中获取列。\n\
  \n  `prepare()` 设置结果集元数据并将查询存储在对象变量中，供 `executeQuery()` 方法使用。ODA 运行时使用结果集元数据检索数据。BIRT\
  \ 报告设计器也使用结果集元数据在用户界面中显示列。\n\n  `prepare()` 方法执行以下操作：\n\n  - 设置包含列、列类型和列类的数组列表\n\
  \  - 修剪查询字符串 `String`\n  - 使用 HQL 查询创建一个 `Hibernate Query` 对象\n  - 获取该查询的 Hibernate\
  \ 列名、类型和类\n  - 实例化 `ResultSetMetaData` 对象，并传入列名和数据类型\n  - 保存查询以供执行\n\n  列表 20-43\
  \ 显示了 `prepare()` 方法的代码。\n\n**列表 20-43** `prepare()` 方法\n\n```java\npublic void\
  \ prepare( String query ) throws Exception\n{\n   Query qry = null;\n   testConnection(\
  \ );\n   ArrayList arColsType = new ArrayList( );\n   ArrayList arCols = new ArrayList(\
  \ );\n   ArrayList arColClass = new ArrayList( );\n   String [] props = null;\n\
  \   try\n      Session hibernession = HibernateUtil.currentSession( );\n      query\
  \ = query.replaceAll( \"\\n]+\",\"\n      query = query.trim( );\n      qry = hibernession.createQuery(\
  \ query );\n      Type [] qryTypes = qry.getReturnTypes( );\n      if( qryTypes.length\
  \ > 0 && qryTypes[0].isEntityType( )\n      {\n         for( int j=0; j<qryTypes.length;\
  \ j++ )\n         {\n            String clsName=qryTypes[j].getName( );\n      \
  \      props = HibernateUtil.getPropTypes( clsName );\n            for( int x =\
  \ 0; x < props.length; x++ )\n            {\n               String propType = HibernateUtil.getPropTypes(\
  \ clsName, props[x] );\n               if( DataTypes.isValidType( propType ))\n\
  \               {\n                  arColsType.add( propType );\n             \
  \     arCols.add(props[x] );\n                  arColClass.add(clsName );\n    \
  \           }\n               else\n               {\n                  throw new\
  \ OdaException( Messages.getString( \"SOURCE_DATA_ERROR\" ) );\n               }\n\
  \            }\n         }\n      }\n      else\n      {\n         props = extractColumns(\
  \ qry.getQueryString( ) );\n         for( int t=0; t < qryTypes.length; t++) //\
  \ 注意：此处原文逻辑可能存误，但按要求翻译\n         {\n            if( DataTypes.isValidType(qryTypes[t].getName(\
  \ ) ))\n            {\n               arColsType.add( qryTypes[t].getName( ) );\n\
  \               arCols.add(props[t] ); // 注意：此处原文逻辑可能存误\n            }\n       \
  \  }\n      }\n   }\n   catch(Exception e)\n   {\n      throw new OdaException(\
  \ e.getLocalizedMessage( ) );\n   }\n   this.resultSetMetaData = new ResultSetMetaData(\
  \ (String[] )arCols.toArray( new String[arCols.size() ] ), (String[] )arColsType.toArray(\
  \ new String[arColsType.size() ] ), (String[] )arColClass.toArray( new String[arColClass.size()\
  \ ] ) );\n   this.query = query;\n}\n```\n\n- `getMetaData()`\n  BIRT 框架在 `prepare()`\
  \ 方法之后调用 `getMetaData()` 来获取结果集的元数据。BIRT 框架使用该元数据在报告中创建数据集。\n\n  列表 20-44 显示了 `getMetaData()`\
  \ 方法的代码。\n\n**列表 20-44** `getMetaData()` 方法\n\n```java\npublic IResultSetMetaData\
  \ getMetaData( ) throws OdaException\n{\n   return this.resultSetMetaData;\n}\n\
  ```\n\n- `executeQuery()`\n  `executeQuery()` 方法执行准备好的查询并检索结果。`executeQuery()` 方法返回一个\
  \ `IResultSet` 对象，该对象是使用 HQL 查询返回的列表结果、结果集元数据和 Hibernate 类型创建的。ODA 框架使用 `IResultSet`\
  \ 对象迭代结果。\n\n\n\n\n\n- 设置一个 `org.hibernate.type.Type` 数组，用于将 Java 类型映射到 JDBC 数据类型\n\
  - 设置一个列表以包含结果集\n- 修剪查询字符串（String）\n- 实例化一个 `Hibernate Query` 对象，创建 HQL 查询\n- 执行\
  \ HQL 查询，并在 `List` 中返回查询结果集\n- 获取查询结果集的 Hibernate 类型\n- 实例化一个 `ResultSet` 对象，传入数据、元数据和\
  \ Hibernate 类型\n\nListing 20-45 显示了 `executeQuery( )` 方法的代码。\n\n#### 列表 20-45 `executeQuery(\
  \ )` 方法\n\n```java\npublic IResultSet executeQuery( ) throws OdaException\n{\n \
  \  Type[ ] qryReturnTypes = null;\n   List rst = null;\n   try\n   {\n      Session\
  \ hibsession = HibernateUtil.currentSession( );\n      String qryStr = this.query;\n\
  \      qryStr = qryStr.replaceAll( \"[\\\\n\\\\r]+\",\" \" );\n      qryStr.trim(\
  \ );\n      Query qry = hibsession.createQuery( qryStr );\n      rst = qry.list(\
  \ );\n      qryReturnTypes = qry.getReturnTypes( );\n   }\n   catch( Exception e\
  \ )\n   {\n      throw new OdaException( e.getLocalizedMessage( ) );\n   }\n   return\
  \ new ResultSet( rst, getMetaData( ), qryReturnTypes );\n}\n```\n\n- `close( )`\n\
  `close( )` 方法清空 `Connection` 和 `ResultSetMetaData` 对象。在 `Connection` 对象中，`close(\
  \ )` 方法关闭 Hibernate 会话。\n\nListing 20-46 显示了 `Statement.close( )` 方法的代码。\n\n####\
  \ 列表 20-46 `Statement.close( )` 方法\n\n```java\npublic void close( ) throws OdaException\n\
  {\n   connection = null;\n   resultSetMetaData = null;\n}\n```\n\n### 理解 ResultSet\n\
  \n`ResultSet` 类实现了 `IResultSet` 接口。当该类被实例化时，它存储了从 `Statement` 对象传递的 `list.iterator(\
  \ )`。当 ODA 驱动框架调用 `next( )` 方法时，它会使用该迭代器。\n\n迭代器指向 HQL 查询结果中的下一行可用数据。框架会调用访问方法来获取当前行中列的数据类型。例如，如果第一列是\
  \ `String`，框架会调用 `getString( )`。该方法调用 `getResult( )` 方法，由该方法解释 HQL 查询结果。\n\n`getResult(\
  \ )` 方法以以下方式之一解析结果，取决于查询返回的是 Hibernate `EntityType` 还是仅值数组：\n\n- 如果查询使用 HQL 且每个返回类型都是\
  \ `EntityType`，`getResult( )` 会获取每个 `Column` 类并使用 `Hibernate ClassMetaData` 方法检索值。\n\
  - 如果查询返回标准数据类型，`getResult( )` 会获取每个值或多个值，返回一个包含简单值的 `Object` 或一个包含多个值的 `Objects`\
  \ 数组。\n\nListing 20-47 显示了 `getResult( )` 方法的代码。\n\n#### 列表 20-47 `getResult( )`\
  \ 方法\n\n```java\nprivate Object getResult( int rstcol ) throws OdaException\n  \
  \ {\n      Object obj = this.currentRow;\n      Object value = null;\n      try\n\
  \         {\n          if( qryReturnTypes.length > 0 && qryReturnTypes[0].isEntityType(\
  \ ))\n          {\n             String checkClass = (( ResultSetMetaData )getMetaData(\
  \ ))getColumnClass(rstcol);\n             Object myVal = HibernateUtil.getHibernateProp(\
  \ obj, checkClass, getMetaData( ).getColumnName(rstcol));\n             value =\
  \ myVal;\n          }\n          else\n          {\n             if( getMetaData(\
  \ ).getColumnCount( ) == 1)\n             {\n              value = obj;\n      \
  \       }\n             else\n             {\n              Object[ ] values = (\
  \ Object[ ])obj;\n              value = values[rstcol-1];\n             }\n    \
  \      }\n      catch( Exception e )\n      {\n         throw new OdaException(\
  \ e.getLocalizedMessage( ) );\n      }\n      return( value );\n}\n```\n\n### 理解\
  \ HibernateUtil\n\n`HibernateUtil` 是一个工具类，提供了 Hibernate 服务与应用程序之间的运行时接口。`HibernateUtil`\
  \ 类派自 Hibernate 文档中提供的类。`HibernateUtil` 执行以下操作：\n\n- 初始化 `SessionFactory`\n- 构建\
  \ `SessionFactory`\n- 打开和关闭会话\n- 返回关于 Hibernate 类和属性的信息\n- 向 `DriverManager` 注册\
  \ JDBC 驱动\n\n`Connection.open( )` 调用 `HibernateUtil.constructSessionFactory( )`，如果不存在则会创建一个\
  \ `SessionFactory`。如果配置文件或映射文件的位置发生了变化，`constructSessionFactory( )` 方法将关闭并重新构建 `SessionFactory`。\n\
  \n`SessionFactory` 的构构建过程会创建 `ClassLoader`。`ClassLoader` 将 `org.eclipse.birt.report.data.oda.jdbc`\
  \ 插件中的 `drivers` 目录以及 Hibernate ODA 插件中的 `hibfiles` 目录添加到类路径中。此过程向 `DriverManager`\
  \ 注册了 Hibernate 配置文件中指定的 JDBC 驱动。\n\n`HibernateUtil` 类实现了以下方法：\n\n- `initSessionFactory(\
  \ )`\n此方法根据 `hibernate.cfg.xml` 文件中的配置设置创建 `SessionFactory` 对象。\n\nListing 20-48\
  \ 显示了 `initSessionFactory( )` 方法的代码。\n\n#### 列表 20-48 `initSessionFactory( )` 方法\n\
  \n```java\nprivate static synchronized void initSessionFactory\n   ( String hibfile,\
  \ String mapdir)\n   throws HibernateException\n   {\n   if( sessionFactory == null)\n\
  \   {\n      Thread thread = Thread.currentThread( );\n      try\n         {\n \
  \         oldloader = thread.getContextClassLoader( );\n          refreshURLs( );\n\
  \          ClassLoader changeLoader = new URLClassLoader\n             ( ( URL [\
  \ ])URLList.toArray( new URL[0]),thread.getContextClassLoader( ));\n          thread.setContextClassLoader(\
  \ changeLoader );\n          Configuration cfg = buildConfig( hibfile,mapdir );\n\
  \          Class driverClass = changeLoader.loadClass( cfg.getProperty( \"connection.driver_class\"\
  \ ) );\n          Driver = ( Driver ) driverClass.newInstance();\n          WrappedDriver\
  \ wd = new WrappedDriver( obj, checkClass, getMetaData( ).getColumnName(rstcol));\
  \ // 注意: 上上下文推断\n          boolean foundDriver = false;\n          Enumeration drivers\
  \ = DriverManager.getDrivers( );\n          while( drivers.hasMoreElements() )\n\
  \          {\n             nextDriver = ( Driver )drivers.nextElement( );\n    \
  \         if( nextDriver.getClass( ) == wd.getClass( ))\n             {\n      \
  \        foundDriver = true;\n              break;\n             }\n          }\n\
  \          if( foundDriver )\n          {\n             DriverManager.registerDriver(\
  \ wd );\n          }\n          sessionFactory = cfg.buildSessionFactory( );\n \
  \         configuration = cfg;\n          HibernateDirectory = mapdir;\n       \
  \   HibernateConfigFile = hibfile;\n      }\n      catch( Exception e)\n      {\n\
  \         e.printStackTrace( );\n         throw new HibernateException( \"No Session\
  \ Created \" + e.getLocalizedMessage( ) );\n      }\n      finally\n      {\n  \
  \       thread.setContextClassLoader( oldloader );\n      }\n   }\n}\n```\n\n- `constructSessionFactory`\n\
  此方法检查是否发生了配置变化。如果发生，方法将关闭会话和 `SessionFactory` 并调用 `initSessionFactory` 重新构建 `SessionFactory`。\n\
  \nListing 20-49 显示了 `constructSessionFactory( )` 方法的代码。\n\n```java\npublic static\
  \ void constructSessionFactory\n   ( String hibfile, String mapdir)\n   throws HibernateException\n\
  \   {\n   if( hibfile == null)\n   {\n      hibfile = \"\";\n   }\n   if( mapdir\
  \ == null)\n   {\n```\n\n\n\n\n\n```java\nmapdir = \"\";\n\n}\n\nif( sessionFactory\
  \ == null)\n{\n    initSessionFactory( hibfile, mapdir);\n    return;\n}\nif( HibernateMapDirectory.equalsIgnoreCase(\
  \ mapdir ) && HibernateConfigFile.equalsIgnoreCase( hibfile ))\n{\n    return;\n\
  }\nsynchronized( sessionFactory )\n{\n    Session s = ( Session ) session.get( );\n\
  \    if ( s != null )\n    {\n        closeSession( );\n    }\n    if ( sessionFactory\
  \ != null && !sessionFactory.isClosed( ))\n    {\n        closeFactory( );\n   \
  \ }\n    sessionFactory = null;\n    initSessionFactory( hibfile, mapdir);\n}\n\
  ```\n\n### currentSession()\n\n此方法在被 `Connection.open()` 方法调用时打开一个会，如 列表 20-50 所示。\n\
  \n**列表 20-50** `currentSession()` 方法\n\n```java\npublic static Session currentSession()\
  \ throws HibernateException {\n   Session s = ( Session ) session.get( );\n   if\
  \ ( s == null ) {\n      s = sessionFactory.openSession( );\n      session.set(\
  \ s );\n   }\n   return s;\n}\n```\n\n该类中的其他方法返回特定类及其属性的信息。`getHibernateProp()`\
  \ 方法返回类的属性。`getHibernatePropTypes()` 方法返回类中属性的数据类型。\n\n### 构建 Hibernate ODA 驱动插件\n\
  \n要使用 Eclipse PDE Manifest 编辑器构建并部署 `org.eclipse.birt.report.data.oda.hibernate`\
  \ 插件，请执行以下任务：\n\n- 在 **Build（构建）** 中，指定构建配置以包含以下项：\n- 在 **Runtime Information（运行时信息）**\
  \ 中，添加 `odahibernate.jar` 文件。\n- 在 **Binary Build（二进制构建）** 中，选择以下文件和文件夹：\n    -\
  \ `META-INF`\n    - `exampleconfig`\n    - `hibfiles`\n    - `lib`\n    - `plugin.xml`\n\
  - 在 **Overview（概览）**中，在 **Exporting（导出）** 下，选择 **Export Wizard（导出向导）**并执行以下任务：\n\
  \    - 在 **Available Plug-ins and Fragments（可用插件和片段）**中，选择 `org.eclipse.birt.report.data.oda.hibernate`。\n\
  \    - 在 **Options（选项）**中，确保未勾选 `Package plug-ins as individual JAR archives（将插件作为单独的\
  \ JAR 档打包`。\n\n在 **Destination（目标）**中，选择目录 `$INSTALL_DIR\\birt-runtime-2_6_0 \\\
  Report Engine`。Hibernate ODA 示例使用 MySQL 作为数据库。BIRT 示例数据库和 MySQL 安装脚本可以从 [`www.eclipse.org/birt/db`](http://www.eclipse.org/birt/db)\
  \ 下载。有关所需的 Hibernate 库的信息，请参考 Hibernate 网站：[`www.hibernate.org`](http://www.hibernate.org)。\n\
  \n### 开发 Hibernate ODA 用户界面扩展\n\n为了在 BIRT 报告设计中使用 Hibernate ODA 驱动程序检索的数据，你必须扩展\
