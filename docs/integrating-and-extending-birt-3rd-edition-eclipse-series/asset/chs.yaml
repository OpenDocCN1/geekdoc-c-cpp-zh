  \        }\n    }\n}\n```\n\n\n\n\n\n```javascript\nvar node = iterator.next( );\n\
  row[1] = node.getFirstCol( );\nrow[2] = node.getSecondCol( );\nrow[3] = node.getThirdCol(\
  \ );\n```\n\n你必须返回 `true` 来向 BIRT 标识有有效的数据行待处理，如下代码所示：\n\n```javascript\nreturn\
  \ true;\n```\n\n### 在数据集的 close() 方法中进行清理\n\n你可以在 `close()` 方法中执行任何清理工作。该方法是将你创建的任何对象设置为\
  \ `null` 的良好位置。例如，以下代码将三个对象引用设置为 `null`：\n\n```javascript\nmyList = null;\niterator\
  \ = null;\nnode = null;\n```\n\n### 决定 Java 类的放置位置\n\n如果脚本数据源（scripted data source）使用了自定义\
  \ Java 类，则该类必须位于 BIRT 能够找到的位置。如果 Java 类所在的位置满足以下任一要求，BIRT 就能找到它：\n\n- Java 类位于运行\
  \ Eclipse 的 Java 运行时环境 (`JRE`) 的类路径路径（classpath）中。如果你的 Java 类由于其他原因位于此位置，请考虑使用此选项。\n\
  - Java 类位于 `<ECLIPSE_INSTALL>\\plugins\\org.eclipse.birt.report.viewer\\birt\\WEB-INF\\\
  lib` 中。如果你的 Java 类已构建、测试并准备好部署，请考虑使用此选项。\n- Java 类是一个 Eclipse Java 项目的一部分，且该项目与\
  \ BIRT 报告项目在同一个工作空间。如果你在开发 BIRT 报告的同时正在开发 Java 类，请考虑使用此选项。\n\n### 部署你的 Java 类\n\n\
  在将 BIRT 报告部署到应用程序服务器之前，你必须将 Java 类放在 JAR 文件中。然后你必须将该 JAR 文件部署到应用程序服务器上的相应位置，以便 BIRT\
  \ 报告查看器在运行时找到它。\n\n#### 在脚本数据集中使用输入和输出参数\n\n脚本数据集的 JavaScript 事件处理器方法具有两个可用于访问参数的数组：`inputParams`\
  \ 和 `outputParams`。`inputParams` 数组包含每个定义为输入的参数对应的一个字符串。`outputParams` 数组包含每个方向定义为输出的参数对应的一个字符串。\n\
  \n例如，假设你有一个带输入参数和一个输出参数的脚本数据集，如图 11-11 所示。\n\n**图 11-11** 带有输入和输出参数的脚本数据集\n\n![image](img/11fig11.jpg)\n\
  \n你可以像下面的示例一样使用 `inputParams` 和 `outputParams` 数组获取和设置 `out_msg` 和 `in_count` 参数的值：\n\
  \n```javascript\noutputParams[ \"out_msg\" ] = \"Total rows: \" +\ninputParams[\
  \ \"in_count\"];\n```\n\n你可以通过参数名或从 1 开始的索引值访问数组中的参数。`inputParams` 和 `outputParams`\
  \ 数组无法被 Java 事件处理器访问。\n\n### 使用自定义连接类创建 Web 服务数据源\n\n如前所述，你可以使用自定义连接类来创建 Web 服务数据源。自定义连接类负责返回一个包含\
  \ SOAP XML 响应的 `Input Stream`。该类必须实现 `connect()` 方法。该方法必须返回一个 `Object`，并实现 `executeQuery()`\
  \ 和 `disconnect()` 方法。\n\n`connect()` 方法接受两个参数，包含连接属性和应用程序上下文。\n\nBIRT 使用应用程序上下文映射（application\
  \ context map）来存储用于报告生成和展示所有阶段的值和对象。你可以从 `Script`、`Expression Builder`、ODA 层等地方引用应用程序上下文中的对象。应用程序上下文映射包含特定的键值对，这些键值对会被传递到所有生成和渲染过程中。\n\
  \n你可以使用应用程序上下文传递安全标识符，该标识符可以在连接类中进行验证，并作为 SOAP 请求的一部分传递。在许多情况下，Web 服务需要此类标识符。\n\n\
  #### 连接类\n\n如果数据源的 `connectionClass` 公共属性设置为非空字符串，运行时驱动程序将使用自定义连接类创建到 Web 服务的连接。自定义连接类还负责为与此数据源关联的\
  \ Web 服务数据集执行 Web 服务查询。\n\n连接类属性是 Java 类的全路径，它必须实现以下类方法以建立 Web 服务连接。该 Java 类必须位于应用程序类路径中。\n\
  \n```java\npublic static Object connect(\n    java.util.Map connectionProperties,\n\
  \    java.util.Map appContext );\n```\n\n`connectionProperties` 参数指定了驱动程序可用的所有公共连接属性的运行时值，这些值以连接属性名为键的\
  \ `(String, String)` 映射存在。该映射可能包含以下任何或全部映射键：`soapEndPoint`、`connectionTimeOut`、`connectionClass`、`OdaConnProfileName`\
  \ 和 `OdaConnProfileStorePath`。\n\n`appContext` 参数以 `(String, Object)` 对的形式提供所有的应用程序上下文值。它的值永远为\
  \ null，但其集合可能为空。\n\n#### 连接实例\n\n自定义驱动类类的 `connect(...)` 方法在成功建立连接后，会返回一个实现了以下两个方法的非空对象。\n\
  \n```java\npublic Object executeQuery(\n    java.lang.String queryText,\n    java.util.Map\
  \ parameterValues,\n    java.util.Map queryProperties);\n\npublic void disconnect(\
  \ );\n```\n\n#### executeQuery() 方法\n\n`queryText` 参数指定查询文本。如果连接不需要报告，它可以为 null。\n\
  \n`queryText` 参数指定查询文本。如果连接类不需要报告，它可以为 null。\n\n`parameterValues` 参数以参数名为键的 `(String,\
  \ Object)` 映射提供所有数据集的参数值。如果数据集没有定义参数，它可以为 null。\n\n`queryProperties` 参数以属性名为键的 `(String,\
  \ String)` 映射提供所有数据集的属性值。映射可能包含 `queryOut` 键。\n\n查询方法必须返回以下值之一：\n- `java.lang.String`:\
  \ 返回的字符串。\n- `java.io.InputStream`: 返回的流。\n\n#### disconnect() 方法\n\n该方法关闭连接。`disconnect()`\
  \ 方法的实现是可选的。如果实现了它，BIRT 在关联数据源关闭时调用此方法。\n\n#### 方法调用和错误处理\n\n驱动程序使用 Java 反射调用自定义类。定义方法抛出的任何异常会被视为错误，导致失败并抛出\
  \ ODA 异常。\n\n#### 自定义连接类示例\n\n列表 11-2 是一个访问一组连接属性并实例化查询对象的自定义示例。\n\n**列表 11-2**\
  \ 自定义连接类\n\n```java\nimport java.util.Iterator;\nimport java.util.Map;\n\npublic\
  \ class ConnectionClass {\n    public static Object connect( Map connectionProperties,\
  \ Map appContext ) {\n        Iterator it = connectionProperties.keySet().iterator();\n\
  \        while ( it.hasNext() ) {\n            Object key = it.next();\n       \
  \ }\n        it = connectionProperties.values().iterator();\n        while ( it.hasNext()\
  \ ) {\n            // 获取值\n            Object value = it.next();\n        }\n  \
  \      MyWSQuery msg = new MyWSQuery();\n        return msg;\n    }\n}\n```\n\n\
  列表 11-3 是一个通过打开文件输入流执行查询并在断开时关闭文件的查询类实现。\n\n**列表 11-3** 查询类实现\n\n```java\nimport\
  \ java.io.FileInputStream;\nimport java.util.Map;\n\npublic class MyWSQuery {\n\
  \    public Object executeQuery( String queryText, Map parameterValues, Map queryProperties\
  \ ) {\n        FileInputStream fis = null;\n        try {\n```\n\n\n\n\n\n```\n\
  fis = new FileInputStream( \"c:/ExchangeRates.xml\" );\n\n} catch ( Exception e\
  \ ) {\n\n}\n\nreturn fis;\n}\n\npublic void disconnect( )\n{\nIf( fis != null )\n\
  {\n    fis.close( );\n    fis = null;\n}\n}\n}```\n\n# 第 12 章：调试事件处理程序\n\nBIRT 的报告调试器工具提供了与其他调试框架类似的功能，例如\
  \ Java 和 C++ IDE 中的调试器。BIRT 报告调试器允许用户逐步运行报告、设置断点、检查实例属性，并在特定的上下文中观察和评估变量值。使用调试器可以帮助高级报告开发人员快速发现报告设计中的错误，并使之在运行时更更容易理解和识别异常。\n\
  \n与标准的 Java 调试器不同，报告调试器基于报告对象模型树（report object model tree）。报告调试器提供了以下功能：\n\n- JavaScript\
  \ 表达式的语法检查\n- 调试 JavaScript 事件处理程序\n- 调试 Java 事件处理程序\n- 调试报告执行异常\n- 检查报告项的实例值和变量值\n\
  \n基于标准的 Eclipse 调试框架，报告调试器框架增强了 Eclipse 内置的调试功能。\n\nBIRT 报告调试器由以下部分组成：\n\n- 报告 JavaScript\
  \ 调试器\n- 报告 Java EventHandler 调试器\n\n在 BIRT 的早期版本中，Java EventHandler 调试器需要设置 Eclipse\
  \ 工作启动参数。在当前版本中，新机制允许直接在 JVM 中调试报告引擎。\n\nJavaScript 调试器实现为 BIRT 报告脚本虚拟机（VM）。该 VM\
  \ 扩展了标准的 Eclipse 调试扩展点，并与 Eclipse 调试框架直接通信。此 VM 处理所有脚本调试任务，例如管理断点、与引擎任务线程通信以及向 Eclipse\
  \ 监听器报告。图 12-1 展示了 BIRT 调试器架构。\n\n**图 12-1** BIRT 调试器架构\n\n![image](img/12fig01.jpg)\n\
  \n### 检查 JavaScript 表达式的语法\n\nBIRT 报告设计器的表达式生成器和脚本编辑器支持编写 JavaScript。这两个编辑器都通过检查语法错误来验证代码。该检查仅验证\
  \ JavaScript 语法，而 own 验证脚本的语义逻辑。\n\n表达式生成器支持通过以下两种方式检查代码的语法错误，如图 12-2 所示：\n\n- 选择\
  \ `Validate` 按钮。语法错误信息将出现在表达式生成器标题栏下方。\n- 选择 `OK`。如果脚本编辑器检测到语法错误，将弹出警告消息。在消息上选择\
  \ `OK` 将保存代码。选择 `Cancel` 将关闭消息并将焦点返回到表达式生成器。\n\n**图 12-2** 在表达式生成器中检查 JavaScript\
  \ 语法错误\n\n![image](img/12fig02.jpg)\n\n脚本编辑器动态验证代码。当开发者输入 JavaScript 代码时，编辑器会验证语法并使用左侧边界上的红色叉号（标记）来指示任何包含错误的行。\n\
  \n包含错误的行会被标记，并高亮显示语法错误的精确位置，如图 12-3 所示。\n\n**图 12-3** 在脚本编辑器中检查 JavaScript 语法错误\n\
  \n![image](img/12fig03.jpg)\n\n当开发者将鼠标指针悬停在左边界的错误指示器上时，文本框中会显示错误描述，如图 12-4 所示。\n\
  \n**图 12-4** 在脚本编辑器中显示语法错误消息\n\n![image](img/12fig04.jpg)\n\n## 调试 JavaScript 事件处理程序代码\n\
  \n用户可以在 JavaScript 代码的特定执行点上设置断点。在调试期间，执行会在断点处停止，用户可以检查当前上下文中的变量。\n\n要调试 JavaScript\
  \ 代码，请切换到脚本编辑器，通过双击特定行的左边界来设置断点。\n\nBIRT 报告调试器使用标准的 Eclipse 调试功能。本章仅提供关于调试器主要组件的基本细节。关于调试器的更多信息，请参阅\
  \ Eclipse 文档。\n\n你在 Debug（调试）视图中管理报告的调试或运行。要打开 Debug 视图，选择 Window→Open Perspective→Other→Debug，如图\
  \ 12-5 所示。\n\n**图 12-5** 选择 Debug 视图\n\n![image](img/12fig05.jpg)\n\nDebug 视图及其视图如图图\
  \ 12-6 所示。\n\n**图 12-6** Debug 视图\n\n![image](img/12fig06.jpg)\n\nDebug 视图包含以下视图：\n\
  \n- Debug 视图：Debug 视图显示你正在调试的报告，以及你之前终止的其他报告。图 12-7 显示了调试目标的示例。调试目标是执行代码的 JVM 运行实例。调试目标具有有助于理解代码执行上下文、JVM\
  \ 参数和类路径的有用属性。你可以将栈帧（stack frame）想象为方法调用。当一个方法调用另一个方法时，栈帧会被添加到栈顶。当方法返回时，该栈帧将从栈顶移除。Debug\
  \ 视图提供了关于该过程的详细信息。图 12-7\n\nFigure 12-7 the in in in 1111111111 the1 the the the\
  \ the the the's the the the process. Figure 12-7 Table 12-1 用于控制调试过程。\n\n**表 12-1**\
  \ 调试器按钮\n\n![image](img/12tab01.jpg)\n\n- Variables（变量视图）：显示与 Debug 视图中选定的栈帧相关的变量信息，如图\
  \ 12-8 所示。\n\n**图 12-8** 变量视图\n\n![image](img/12fig08.jpg)\n\n- Breakpoints（断点视图）：列出你在工作区中当前设置的所有断点。图\
  \ 12-9 显示了断点视图中的单个断点。\n\n**图 12-9** 包含一个断点的列表\n\n![image](img/12fig09.jpg)\n\n双击断点可以以显示其在脚本编辑器中的位置。你可以删除、添加、启用或禁用断点。你可以根据工作集（working\
  \ set）对断点进行分组或设置命中次数。\n\n- Expressions（表达式视图）：显示在脚本代码中定义和操作的选变量，如图 12-10 所示。\n\n\
  **图 12-10** 表达式视图\n\n![image](img/12fig10.jpg)\n\n![image](img/expressions-view.jpg)\n\
  \n脚本编辑器和其他 Debug 视图使用的视图出现在 Eclipse 工作区的底部，如图 12-11 所示。\n\n**图 12-11** 脚本、控制台和大纲视图\n\
