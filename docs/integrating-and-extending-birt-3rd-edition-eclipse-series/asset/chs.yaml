  \ `HashMap` 对象，包含稍后运行报告将使用的参数值。变量 `engine` 是一个 `ReportEngine` 对象。变量 `runnable` 是一个\
  \ `IReportRunnable` 对象。此示例未显示从用户界面或数据库检索参数值的详细代码细节。执行这些任务的代码取决于您的应用程序需求。\n\n**Listing\
  \ 14-7** 无分组设置多个参数的值\n\n```java\n// 创建参数定义任务。\nIGetParameterDefinitionTask task\
  \ =\n   engine.createGetParameterDefinitionTask( runnable );\n\n// 创建设计中参数的扁平集合。\n\
  Collection params = task.getParameterDefns( false );\n\n// 获取参数的默认值。\nHashMap parameterValues\
  \ = task.getDefaultValues( );\n\n// 获取参数的值。此示例中的后续代码\n// 假设这一步创建了一个 HashMap 对象，\n\
  // inputValues。HashMap 中的键是参数名，\n// 值是用户提供的值。\n// 遍历报告参数，以标准的与区域无关的格式设置值。\nIterator\
  \ iterOuter = params.iterator( );\nReportParameterConverter cfgConverter = new\n\
