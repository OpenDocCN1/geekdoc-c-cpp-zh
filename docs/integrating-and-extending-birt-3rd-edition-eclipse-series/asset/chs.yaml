  \ helperModel.getInteractivity( )\n        .getLegendBehavior( ) );\n}\n// 清空现有序列定义\n\
  ( (ChartWithoutAxes)\n    currentChart ).getSeriesDefinitions( ).clear( );\n\n//\
  \ 拷贝序列定义\n( (ChartWithoutAxes)\n    currentChart ).getSeriesDefinitions( )\n   \
  \ .add( ( (ChartWithoutAxes)helperModel )\n    .getSeriesDefinitions( ).get( 0 )\
  \ );\n\n// 更新序列\nEList<SeriesDefinition> seriesdefinitions =\n    ( ( (ChartWithoutAxes)\
  \ currentChart )\n    .getSeriesDefinitions( ).get( 0 ) )\n    .getSeriesDefinitions(\
  \ );\n\nfor ( int j = 0; j < seriesdefinitions.size( ); j++ )\n{\n    Series series\
  \ = seriesdefinitions.get( j )\n    .getDesignTimeSeries( );\n    series = getConvertedSeries(\
  \ series, j );\n    // 清空任何现有序列\n    seriesdefinitions.get( j ).getSeries( ).clear(\
  \ );\n    // 添加新序列\n    seriesdefinitions.get( j ).getSeries( ).add( series );\n\
  }\ncurrentChart.getLegend( )\n.setItemType( LegendItemType.SERIES_LERAL );\ncurrentChart.getTitle(\
  \ )\n.getLabel( )\n.getCaption( )\n.setValue( getDefaultTitle( ) );\n}\nelse\n{\n\
  \    return null;\n}\nreturn currentChart;\n```\n\n私有方法 `getConvertedSeries()` 由\
  \ `getModel()` 方法调用，以便在模型更改之间保留序列更改，例如自定义折线图、将其更改为柱状图，然后改回折线图。如果没有这些方法，每次更改都必须重新创建序列，如下代码所示：\n\
  \n```java\nprivate Series getConvertedSeries( Series series, int seriesIndex )\n\
  {\n// 不转换基础序列\nif ( series.getClass( ).equals( SeriesImpl.class.getName( ) )\n{\n\
  \    return series;\n}\nRadarSeries radarseries = (RadarSeries) ChartCacheManager.getInstance(\
  \ )\n.findSeries( SeriesImpl.class.getName( ),\nseriesIndex );\nif ( radarseries\
  \ == null )\n{\n    radarseries = RadarSeriesImpl.create( );\n}\n// 拷贝通用属性\nChartUIUtil.copyGeneralSeries(\
  \ series, radarseries );\nreturn radarseries;\n}\n```\n\n私有方法 `addSampleData()`\
  \ 由 `getModel()` 调用，为图表提供示例数据。这些示例数据在选择真实数据之前会显示图表供审查。要使用真实数据而非示例数据显示图表，请启用图表的实时预览。图表构建器默认启用实时预览偏好。\n\
  \n```java\nprivate void addSampleData( Chart newChart )\n{\n    SampleData sd =\
