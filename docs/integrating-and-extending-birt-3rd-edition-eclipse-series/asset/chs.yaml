  \ Yacht</data>\n  <data>414</data>\n  <data>54.6</data>\n</report>\n```\n\n## 第\
  \ 20 章 开发 ODA 扩展\n\nBIRT 使用 Eclipse 数据工具平台 (DTP) 开放数据访问 (ODA) API 来构建连接数据源并为报告检索数据的驱动程序。该\
  \ API 定义了管理以下任务的接口和类：\n\n- 连接到数据源\n- 准备并执行查询\n- 处理结果集中的数据和元数据\n- 对象表示与数据源之间的映射\n\
  \nEclipse DTP 还为 SQL 开发、本地化、日志和其他特殊类型的处理提供了工具和支持。欲了解更多关于 Eclipse DTP 项目的信息，请访问 [`www.eclipse.org/datatools`](http://www.eclipse.org/datatools)。\n\
  \n\n\n\n\nODA 框架是 DTP 的核心组件。ODA 为 Java 开发者提供了一个健壮的架构，通过对自定义数据源进行报告来扩展 BIRT 的功能。该框架提供了新的项目向导，用于创建\
  \ ODA 运行时和设计器扩展的插件项目。生成的插件项目包含类模板和默认实现。这些插件项目支持加速自定义 ODA 数据源扩展的开发。\n\n本章将通过示例展示如何开发\
  \ ODA 扩展，这些示例将通过扩展了 `org.eclipse.datatools.connectivity.oda.dataSource` 扩展点，以提供对以下数据源的访问：\n\
  \n* CSV 文件\n  使用新的 DTP ODA 向导创建一个访问 CSV 数据源的插件项目。DTP ODA 接口与 `JDBC` 接口类似，但具有扩展性，这些扩展支持从关系型和非关系型数据库源中检索数据。\n\
  \n* 关系型数据库\n  使用 Java 的 `Hibernate Core`，这是一种面向对象的软件系统，用于生成 SQL 和处理 `JDBC` 结果集。Hibernate\
  \ 查询语言 (`HQL`) 提供了 SQL 透明的扩展，使得 DTP ODA 扩展可以移植到所有关系型数据库。此外，Hibernate 还支持使用数据库的原生\
  \ SQL 方言开发查询。\n\nHibernate 是根据 GNU 较小通用公共许可证 (`LGPL`) 许可的免费开源软件。有关 Hibernate 的更多信息，请访问\
  \ [`www.hibernate.org/`](http://www.hibernate.org/)。\n\n### 理解 ODA 扩展\n\nBIRT 报告设计指定了生成报告所需的数据访问类型和数据转换。所有数据均来自外部数据源。BIRT\
  \ 数据引擎支持 DTP ODA 框架。DTP ODA 框架通过开放 API 访问标准和自定义数据源。\n\n使用 DTP ODA 框架可以为任何外部数据源创建插件驱动程序。BIRT\
  \ 在报告设计器和报告生成环境中使用 DTP ODA 扩展点。\n\nDTP ODA 扩展通过实现以下扩展点为 BIRT 框架添加新的数据源驱动程序：\n\n\
  * ODA 数据源\n  `org.eclipse.datatools.connectivity.oda.dataSource` 支持 BIRT 设计时和运行时数据源访问的扩展。XML\
  \ 架构文件 `org.eclipse.datatools.connectivity.oda/schema/dataSource.exsd` 描述了此扩展点。\n\
  \n* ODA 用户界面\n  `org.eclipse.datatools.connectivity.oda.design.ui.dataSource` 支持可选地为\
  \ BIRT 报告设计器添加 ODA 驱动程序的集成用户界面。插件可以提供报告设计器用于指定数据源和编辑数据集的用户界面支持。XML 架构文件 `org.eclipse.datatools.connectivity.oda.design.ui/schema/dataSource.exsd`\
  \ 描述了此扩展点。\n\n* ODA 连接配置\n  `org.eclipse.datatools.connectivity.connectionProfile`\
  \ 支持可选地为 BIRT 报告设计器的 ODA 驱动程序用户界面添加不同类型的连接配置。连接配置可以定义一个类别或一组配置类型，例如 `JDBC` 连接配置。此用户界面定义了用于创建资源的相应\
  \ `newWizard` 元素。XML 架构文件 `org.eclipse.datatools.connectivity/schema/connectionProfile.exsd`\
  \ 描述了此扩展点。\n\n* ODA 连接属性页\n  `org.eclipse.ui.propertyPages` 支持可选地添加一个用于编辑连接配置属性的页面。XML\
  \ 架构文件 `org.eclipse.ui.propertyPages/schema/propertyPages.exsd` 描述了此扩展点。\n\n有关 DTP\
  \ ODA API 的更多信息，请参见 `org.eclipse.datatools.connectivity.oda` 包层次的 Javadoc。Javadoc\
  \ 位于 Eclipse Data Tools Platform 项目提供的 DTP 软件开发包 (SDK)，地址为 [`www.eclipse.org/datatools`](http://www.eclipse.org/datatools)。\n\
  \n## 开发 CSV ODA 驱动程序扩展\n\nEclipse DTP 提供了两个 ODA 插件模板向导，一个用于 ODA 数据源运行时驱动程序，另一个用于\
  \ ODA 数据源设计器。每个向导都会创建一个新的插件项目，生成相关 ODA 扩展点的实现。自动生成的 Java 类实现了支持单个结果集和输入参数的方法存根。这些类包含硬编码的结果集数据，以便\
  \ ODA 扩展开发人员能够立即验证生成的 ODA 驱动插件是否能与 ODA 消费者（例如 BIRT）工作。\n\n在 ODA 向导生成插件后，修改生成源码中的\
  \ `TODO` 标签以自定义数据源行为。\n\n要开发 CSV ODA 扩展，请执行以下任务：\n\n* 从 Eclipse CVS 仓库下载所需的 BIRT\
  \ 源代码。\n* 使用 Eclipse PDE 中的 ODA 向导创建两个新项目来实现以下插件：\n    * 用于访问数据源的 CSV ODA 驱动程序\n\
  \    * 用于在 BIRT 报告设计器中选择数据文件和可用数据列的 CSV ODA 用户界面\n* 通过在定义的扩展点添加新功能来扩展 CSV ODA 插件项目中的源码。\n\
  * 在运行时环境中测试并部署扩展。\n\n您可以在 [`www.actuate.com/birt/contributions`](http://www.actuate.com/birt/contributions)\
  \ 下载 CSV ODA 驱动程序扩展示例的源码。\n\n### 关于 CSV ODA 插件\n\nCSV ODA 扩展需要以下两个插件：\n\n* `org.eclipse.birt.report.data.oda.csv`\n\
  \  CSV ODA 数据源插件扩展了扩展点 `org.eclipse.datatools.connectivity.oda.dataSource` 定义的功能，以创建\
  \ CSV ODA 驱动程序。CSV 输入文件的第一行包含列名。其余行由换行符分隔，包含用逗号分隔的数据字段。`org.eclipse.birt.report.data.oda.csv`\
  \ 插件包含了用于处理 BIRT 报告中数据的数据库类和数据结构，例如数据类型、`result set`、`metadata result set` 和 `query`。\n\
  \n  `org.eclipse.datatools.connectivity.oda.dataSource` 扩展点位于 Eclipse DTP 项目中，是\
  \ `org.eclipse.datatools.connectivity` 插件的一部分。该插件可以从 CVS 仓库的 `/home/datatools` 获取。\n\
  \n* `org.eclipse.birt.report.data.csv.ui`\n  CSV ODA 用户界面插件扩展了 `org.eclipse.datatools.connectivity.connectionProfile`、`org.eclipse.ui.propertyPages`\
  \ 和 `org.eclipse.datatools.connectivity.oda.design.ui.dataSource` 扩展点定义的功能。界面由以下两个页面组成：\n\
  * 数据源页，指定并验证 CSV 文件的路径和名称。\n* 数据集页，显示选定的文件以及文件中可列。默认情况下，用户界面选择数据集中的所有列。\n\n### 从\
  \ CVS 仓库下载 BIRT 源代码\n\nCSV ODA 驱动插件 `org.eclipse.birt.report.data.oda.csv` 需要以下插件：\n\
  * `org.eclipse.core.runtime`\n* `org.eclipse.datatools.connectivity.oda`\n* `org.eclipse.datatools.connectivity.oda.profile`\n\
  \nCSV ODA 用户界面扩展 `org.eclipse.birt.report.data.csv.ui` 需要以下插件：\n* `org.eclipse.birt.report.data.oda.csv`\n\
  * `org.eclipse.core.runtime`\n* `org.eclipse.datatools.connectivity.oda.design.ui`\n\
  * `org.eclipse.ui`\n\n对于 `org.eclipse.birt.report.data.oda.csv` 插件，请扩展 `org.eclipse.datatools.connectivity.oda`\
  \ 插件中的 Java 类。对于 `org.eclipse.birt.report.data.csv.ui` 插件，请扩展 `org.eclipse.datatools.connectivity.oda.design.ui`\
  \ 插件中的 Java 类。\n\n\n\n\n\nEclipse 在 CVS 存储库中向开发者社区提供源代码。编译时不需要插件的源代码。你可以配置系统使用 `eclipse\\\
  plugins` 文件夹中的 JAR 文件。要进行调试，你可能需要所有需要的 BIRT 和 DTP 插件的源代码。\n\n### 实现 CSV ODA 驱动插件\n\
  \n本节描述了如何实现一个 ODA 驱动插件，并 CSV ODA 驱动插件为例。要创建一个 ODA 驱动插件，请执行以下任务：\n\n-   创建 ODA 驱动插件项目。\n\
  -   定义依赖。\n-   指定运行时存档（run-time archive）。\n-   声明 ODA 扩展点。\n\n你可以在 Eclipse PDE 中创建\
  \ CSV ODA 驱动插件项目 `org.eclipse.birt.report.data.oda.csv`。本节描述了如何使用“新插件项目”（New Plug-in\
  \ Project）向导创建该插件项目。\n\n#### 如何创建 CSV ODA 驱动插件项目\n\n**1** 从 Eclipse PDE 菜单中，选择 `File→New→Project`。\n\
  \n**2** 在“新项目—选择向导”（New Project—Select a wizard）中，打开“业务智能和报告工具”（Business Intelligence\
  \ and Reporting Tools），并如图 20-1 所示选择“ODA 运行时驱动插件项目”（ODA Runtime Driver Plug-in Project）。点击“下一步”。出现“新插件项目”窗口。\n\
  \n**图 20-1** 指定 CSV ODA 运行时驱动插件\n\n![image](img/20fig01.jpg)\n\n**3** 在“插件项目”（Plug-in\
  \ Project）中，如表 20-1 所示修改设置。\n\n**表 20-1** CVS ODA 插件项目选项设置\n\n![image](img/20tab01.jpg)\n\
  \n点击“下一步”。出现“插件内容”（Plug-in Content）。\n\n**4** 在“插件内容”（Plug-in Content）中，如表 20-2\
  \ 所示修改设置。\n\n**表 20-2** CSV ODA 插件内容选项设置\n\n![image](img/20tab02.jpg)\n\n点击“下一步”。出现“模板”（Templates）。\n\
  \n**5** 在“模板”（Templates）中，选择如图 20-2 所示的“ODA 数据源运行时驱动”（ODA Data Source Runtime Driver）。\n\
  \n**图 20-2** 指定 CSV ODA 数据源运行时驱动模板\n\n![image](img/20fig02.jpg)\n\n点击“下一步”。出现“ODA\
  \ 数据源运行时驱动”（ODA Data Source Runtime Driver）。\n\n**6** 在“ODA 数据源运行时驱动”中，为用于生成 ODA\
  \ 插件的以下选项指定值，如表 20-3 所示。\n\n**表 20-3** CSV ODA 数据源运行时驱动选项设置\n\n![image](img/20tab03.jpg)\n\
  \n点击“完成”。CSV ODA 驱动插件项目将出现在 Eclipse PDE 工作区中。由向导创建的项目如图 20-3 所示。向导创建了所有的插件文件和主功能\
  \ Java 类。根据需要自定义默认设置，并在 Java 类存根中添加代码以实现所需的功能。\n\n**图 20-3** 查看项目包结构\n\n![image](img/20fig03.jpg)\n\
  \n**7** 在“包资源管理器”（Package Explorer）中选择 `plugin.xml` 并双击打开 PDE Manifest 清单编辑器，如图\
  \ 20-4 所示。使用 PDE Manifest 清单编辑器，你可以查看并编辑所有的插件设置。\n\n**图 20-4** PDE Manifest 清单编辑器—CSV\
  \ ODA 概述\n\n![image](img/20fig04.jpg)\n\n### 理解 ODA 数据源扩展点\n\n在这一步中，你将查看向导添加的扩展点。点击\
  \ PDE Manifest 清单编辑器中的“扩展”（Extensions）选项卡以打开编辑器中的扩展面板。PDE Manifest 清单编辑器会自动添加以下两个扩展点：\n\
  \n-   `org.eclipse.datatools.connectivity.oda.dataSource`\n-   `org.eclipse.datatools.connectivity.oda.connectionProfile`\n\
  \n##### 理解 dataSource 扩展点属性\n\nODA 数据源扩展点支持为应用程序扩展设计时和运行时的数据源访问。扩展必须实现 `org.eclipse.datatools.connectivity.oda`\
  \ 插件中定义的 ODA Java 运行时接口。图 20-5 显示了 CSV ODA 插件示例中使用的 ODA 数据源扩展点。\n\n**图 20-5** PDE\
  \ Manifest 清单编辑器—CSV ODA 扩展\n\n![image](img/20fig05.jpg)\n\n扩展点 `org.eclipse.datatools.connectivity.oda.dataSource`\
  \ 指定了以下用于在运行时环境中标识扩展的属性：\n\n-   **ID**: 实例的可选标识符。\n\n向导向你在向导中指定的扩展点 ID 添加了引用引用 `%oda.data.source.id`。`plugin.properties`\
  \ 文件提供了所有本地化变量的定义。如列表 20-1 所示，`ID`的值如下：\n\n```\norg.eclipse.birt.report.data.oda.csv\n\
  ```\n\n**列表 20-1** plugin.properties\n\n* * *\n\n############################################################\n\
  # Copyright (c) 2009 <<Your Company Name>>\n############################################################\n\
  # Configuration\n############################################################\n\
  oda.data.source.id=org.eclipse.birt.report.data.oda.csv\n############################################################\n\
  # NLS String\n############################################################\nplugin.name=CSV\
  \ ODA Runtime Driver\ndata.source.name=CSV ODA Data Source\ndata.set.name=CSV ODA\
  \ Data Set\n# Name\n扩展实例的可选名称。扩展的完全限定标识符。\n扩展元素定义了设计时和运行时使用的数据源类型。它包含以下属性：\n\n-\
  \   **id**: 扩展的完全限定标识符。向导使用 `%oda.data.source.id` 引用外部化的 id。\n-   **driverClass**:\
  \ 实现 `org.eclipse.datatools.connectivity.oda.IDriver` 的 Java 类。该接口提供了 ODA 运行时扩展的入口。\n\
  -   **odaVersion**: ODA 接口的版本。对于为 BIRT 2.6 版本开发的 ODA 驱动程序，请指定版本 3.1。\n-   **defaultDisplayName**:\
  \ ODA 数据源扩展的显示名称。要外部化该值，请使用 `plugin.properties` 机制。\n-   **setThreadClassLoader**:\
  \ 表示 ODA 运行时插件的消费者在调用 ODA 接口方法之前是否必须设置线程类加载器。加载 ODA 运行时插件的 OSGi 类加载器设计并不用于加载额外的类。要加载额外的类，ODA\
  \ 运行时插件必须提供它自己的 `java.net.URLClassLoader` 对象并根据需要切换线程类加载器。\n\ndataSource 元素还指定了一个属性，包含扩展元素的细节：\n\
  \n-   **name**: 属性组的唯一名称。使用 HOME 作为属性名称。\n-   **defaultDisplayName**: 属性组的默认显示名称。要本地化该值，请使用\
  \ `plugin.properties` 机制。对于默认显示名称，输入“CSV File Full Path”。\n-   **type**: 属性类型。默认为\
  \ `String`。\n-   **canInherit**: 表示扩展元素是否可以继承属性的标志。选择 `true`。\n-   **defaultValue**:\
  \ 扩展元素的默认值。\n-   **isEncryptable**: 表示属性是否加密的标志。选择 `false`。\n-   **allowsEmptyValueAsNull**:\
  \ 表示此属性的空值是否可以被视为空值。默认值为 `true`。\n\ndataSet 扩展元素描述了以下属性：\n\n-   **id**: ODA 数据集扩展的强制标识符。\n\
  -   **defaultDisplayName**: ODA 数据集扩展的显示名称。要本地化该值，请使用 `plugin.properties` 文件。默认显示名称为\
  \ CSV ODA Data Set。\n\ndataSet 元素还指定了一个复杂数据类型 `dataTypeMapping`，它定义了包含以下属性的数据类型映射序列：\n\
  \n-   **nativeDataTypeCode**: 必须匹配 ODA 驱动接口实现中返回的数据类型代码之一的整数值。\n-   **nativeDataType**\n\
  \n\n\n\n\n指定数据源原生数据类型的 `String` 值。\n\n• `odaScalarDataType`\n\n映射到原生类型的 ODA 标量数据类型。支持的\
  \ ODA 数据类型包括 `Date`、`Double`、`Integer`、`String`、`Time`、`Timestamp`、`Decimal` 和 `Boolean`。向导设置的默认支持类型见表\
  \ 20-4。\n\n**表 20-4** CSV ODA `dataTypeMapping` 元素的设置\n\n![image](img/20tab04.jpg)\n\
  \n## 该扩展点支持使用连接配置文件创建数据库连接。CSV ODA 插件使用由插件向导创建的设置：\n\n• CSV ODA 数据源（类别）\n• CSV ODA\
  \ 数据源连接配置文件 (`connectionProfile`)\n• ODA 连接工厂 (`connectionFactory`)\n\n## 理解 CSV\
  \ ODA 驱动扩展的依赖关系\n\n在图 20-6 中，“依赖关系”页面列出了 CSV ODA 驱动扩展的类路径上必须可用的插件列表，以便进行编译和运行。\n\
  \n**图 20-6** CSV ODA 依赖关系页面\n\n![image](img/20fig06.jpg)\n\nODA 运行时驱动向导为您的插件添加以下依赖项：\n\
  \n• `org.eclipse.datatools.connectivity.oda`\n• `org.eclipse.datatools.connectivity.oda.profile`\n\
  \n你可以在工作结束时运行“组织清单”向导来优化依赖关系设置。图 20-7 显示了运行该向导时所使用的设置示例。\n\n**图 20-7** 组织清单向导\n\n\
  ![image](img/20fig07.jpg)\n\n该向导的链接位于清单编辑器（Manifest Editor）的概览页上。下一个向导页面将显示插件清单文件的更改。你可以检查建议的更改并接受或拒绝修改。\n\
  \n## 理解示例 CSV ODA 驱动扩展\n\nBIRT 数据引擎支持 Eclipse DTP ODA 框架。DTP ODA 框架支持创建一个扩展，可以将任何外部数据源接入\
  \ BIRT 报告引擎。\n\nDTP ODA API 规定了运行时驱动程序的接口。BIRT 数据引擎使用报告设计中的数据源和数据集定义来访问 ODA 运行时驱动，以执行查询并检索数据。\n\
  \nDTP ODA 接口类似于 JDBC 接口，具有支持从非关系型数据库（non-RDBMS）源检索数据的扩展。扩展 ODA 驱动可以实现这些接口，为另一个数据源（如\
  \ CSV 文件）封装 API，以检索包含数据行的结果集。\n\n本章描述的 CSV ODA 驱动扩展是一个简化示例，说明了如何使用 Eclipse PDE 创建\
  \ ODA 插件。CSV ODA 扩展示例的包 `org.eclipse.birt.report.data.oda.csv` 使用以下类来实现 ODA 插件接口：\n\
  \n• `Driver`：实现 `IDriver` 接口。实例化 CSV ODA 驱动的连接对象，并设置日志配置和上下文。\n• `Connection`：实现\
  \ `IConnection` 接口。打开和关闭与 CSV 文件的连接并实例化 `IQuery` 对象。\n• `Query`：实现 `IQuery` 接口。处理执行以下操作的过程：\n\
  \    - 设置 `java.io.File` 对象，包含文件名和路径名\n    - 使用内部类 `CSVBufferReader` 从数据文件中获取数据行\n\
  \    - 修剪列数据，移除多余字符（如逗号和引号）\n    - 准备结果集元数据，包含表名和列名\n• `ResultSet`：实现 `IResultSet`\
  \ 接口。处理将列的 `String` 值转换为指定数据类型。\n• `ResultSetMetaData`：实现 `IResultSetMetaData` 接口。描述结果集中每列的元数据。\n\
  • `DataSetMetaData`：实现 `IDataSetMetaData` 接口。描述数据集的功能和能力。\n• `Messages`：定义 CSV ODA\
  \ 驱动的异常消息。\n• `CommonConstant`：定义包中使用的常量，如驱动名称、ODA 版本、查询关键字和分隔符。\n\n### 理解 Driver\n\
  \n`Driver` 类通过调用 `getConnection()` 方法实例化 CSV ODA 驱动的连接对象，如列表 20-2 所示。\n\n**列表 20-2**\
  \ `getConnection()` 方法\n\n```java\npublic IConnection getConnection( String dataSourceType\
  \ )\n      throws OdaException\n{\n   return new Connection( );\n}\n```\n\n### 理解\
  \ Connection\n\n`Connection` 类打开和关闭与 CSV 文件的连接，并调用 `newQuery()` 方法实例化 `Query` 对象。列表\
  \ 20-3 显示了 `newQuery()` 方法。\n\n**列表 20-3** `newQuery()` 方法\n\n```java\npublic IQuery\
  \ newQuery( String dataSetType )\n      throws OdaException\n{\n   if( !isOpen(\
  \ ) )\n      throw new OdaException(\n          Messages.getString(\n          \
  \    \"common_CONNECTION_HAS_NOT_OPENED\" ) );\n   return new Query( this.homeDir,\
  \ this);\n}\n```\n\n### 理解 Query\n\n`Query` 类构造函数设置了一个包含文件名和路径名的 `java.io.File`\
  \ 对象。构造函数支持应用程序提交主目录参数 `homeDir` 作为文件名或路径。`Query()` 根据报告设计中指定的 `HOME` 属性值来配置数据源属性，如列表\
  \ 20-4 所示。\n\n**列表 20-4** `Query` 类构造函数\n\n```java\nQuery ( String homeDir, IConnection\
  \ host )\n   throws OdaException\n{\n   if ( homeDir == null || host == null )\n\
  \      throw new OdaException(Messages.getString\n          (\"Common.ARGUMENT_CANNOT_BE_NULL\"\
  ));\n   File file = new File(homeDir);\n   if(file.isDirectory( )\n      this.homeDirectory\
  \ = homeDir;\n   else if(file.isFile( )\n      this.homeDirectory = file.getParent(\
  \ );\n   this.connection = host;\n}\n```\n\n`Query` 类准备并执行查询，然后检索数据。`Query` 实现以下方法：\n\
  - `prepare()` 执行以下操作：\n    - 通过 `splitQueryText()` 生成查询和列信息\n    - 通过 `validateConnection()`\
  \ 验证连接\n    - 通过 `formatQuery()` 格式化查询字符串，消除冗余空格并将所有关键字转换为大写\n    - 通过 `validateQueryText()`\
  \ 验证查询\n    - 通过 `prepareMetaData()` 准备执行查询和检索结果所需的元数据\n列表 20-5 显示了 `prepare()`\
  \ 方法。\n\n**列表 20-5** `prepare()` 方法\n\n```java\npublic void prepare( String queryText\
  \ )\n      throws OdaException\n{\n   if ( queryText != null )\n   {\n      String\
  \ query = splitQueryText(queryText)[0];\n      String colInfo = splitQueryText(\
  \ queryText )[1];\n      validateConnection();\n      String formattedQuery = formatQuery(\
  \ query );\n      validateQueryText( formattedQuery );\n      prepareMetaData( formattedQuery,\
  \ colInfo );\n   }\n   else\n      throw new OdaException( Messages.getString(\n\
  \          \"common_NULL_QUERY_TEXT\" ) );\n}\n```\n\n- `prepareMetaData()` 获取以下元数据：\n\
  \    - 表名\n    - 从数据文件中读取的实际列名\n    - 查询列名\n    - 查询数据类型\n`prepareMetaData()` 然后实例化并配置\
  \ `ResultSetMetaData` 对象。列表 20-6 显示了 `prepareMetaData()` 方法。\n\n**列表 20-6** `prepareMetaData()`\
  \ 方法\n\n```java\nprivate void prepareMetaData( String query,\n      String savedSelectedColInfo\
  \ )\n   throws OdaException\n{\n   String[] queryFragments =\n      parsePreparedQueryText(\
  \ query );\n   String tableName = queryFragments[2];\n   String[] allColumnNames\
  \ =\n      discoverActualColumnMetaData( tableName,NAME_LITERAL );\n   String[]\
  \ allColumnTypes =\n      createTempColumnTypes( allColumnNames.length );\n   String[]\
  \ queryColumnNames = null;\n}\n```\n\n\n\n\n\n```java\nString[] queryColumnTypes\
  \ = null;\nString[] queryColumnLables = null;\nqueryColumnNames = allColumnNames;\n\
  queryColumnTypes = allColumnTypes;\nqueryColumnLabels = allColumnNames;\nthis.resultSetMetaData\
  \ =\n    new ResultSetMetaData(queryColumnNames,\n        queryColumnTypes, queryColumnLabels);\n\
  this.currentTableName = tableName;\n```\n\n- `executeQuery()` 执行以下操作：\n- 从文件中获取数据到\
  \ `Vector` 对象\n- 将数据从 `Vector` 传输到二维 `String` 数组\n- 在单个 `ResultSet` 对象中返回数据行和元数据\n\
  \n代码列表 20-7 显示了 `executeQuery()` 方法。\n\n代码列表 20-7 的 `executeQuery()` 方法\n\n```java\n\
  public IResultSet executeQuery() throws OdaException\n{\n    Vector v = fetchQueriedDataFromFileToVector();\n\
  \    String[][] rowSet =\n        copyDataFromVectorToTwoDimensionArray(v);\n  \
  \  return new ResultSet(rowSet, this.resultSetMetaData);\n}\n```\n\n- 内部类 `CSVBufferReader`\
  \ 从数据文件中获取数据行。代码列表 20-8 显示了 `readLine()` 方法。\n\n代码列表 20-8 的 `readLine()` 方法\n\n\
  ```java\npublic String readLine() throws IOException\n{\n    if (isLastCharBuff()\
  \ && needRefillCharBuff())\n        return null;\n    if (needRefillCharBuff())\n\
  \    {\n        charBuffer = newACharBuff();\n        int close = reader.read(charBuffer);\n\
  \        if (close == -1)\n            return null;\n        if (close != CHARBUFFSIZE)\n\
  \            this.eofInPosition = close;\n        this.startingPosition = 0;\n \
  \   }\n    String candidate = \"\";\n    int stopIn = CHARBUFFSIZE;\n    if (isLastCharBuff())\n\
  \    {\n        stopIn = this.eofInPosition;\n    }\n    for (int i = this.startingPosition;\
  \ i < stopIn; i++)\n    {\n        if (this.charBuffer[i] == '\\n')\n        {\n\
  \            return readALine(candidate, stopIn, i);\n        }\n    }\n    if (isLastCharBuff())\n\
  \    {\n        return readLastLine(candidate);\n    }\n    return readExtraContentOfALine(candidate);\n\
  }\n```\n\n### 理解 ResultSet\n\n`ResultSet` 类执行以下操作：\n\n- 提供光标处理功能，用于向后从缓冲区结果集行中获取数据\n\
  - 将列的 `String` 值转换为指定的数据类型\n\n`ResultSet` 实现了以下方法：\n\n- `ResultSet()` 构造函数，设置一个包含表数据和元数据的二维数组，如代码列表\
  \ 20-9 所示。\n\n代码列表 20-9 的 `ResultSet()` 构造函数\n\n```java\nResultSet(String[][] sData,\
  \ IResultSetMetaData rsmd)\n{\n    this.sourceData = sData;\n    this.resultSetMetaData\
  \ = rsmd;\n}\n```\n\n- `getRow()` 返回光标，指示行在结果集中的位置，如代码列表 20-10 所示。\n\n代码列表 20-10\
  \ 的 `getRow()` 方法\n\n```java\npublic int getRow() throws OdaException\n{\n    validateCursorState();\n\
  \    return this.cursor;\n}\n```\n\n- `next()` 将光标增加指向下一行，如代码列表 20-11 所示。\n\n代码列表\
  \ 20-11 的 `next()` 方法\n\n```java\npublic boolean next() throws OdaException\n{\n\
  \    if ((this.maxRows <= 0?cursor >= this.maxRows - 1) || cursor >= this.sourceData.length\
  \ - 1)\n    {\n        cursor = CURSOR_INITIAL_VALUE;\n        return false;\n \
  \   }\n    cursor++;\n    return true;\n}\n```\n\n- `getString()` 返回结果集中指定列所在行中列的值，如代码列表\
  \ 20-12 所示。\n\n代码列表 20-12 的 `getString()` 方法\n\n```java\npublic String getString(int\
  \ index) throws OdaException\n{\n    validateCursorState();\n    String result =\
  \ sourceData[cursor][index - 1];\n    if (result.length() == 0)\n        result\
  \ = null;\n    this.wasNull = result == null ? true : false;\n    return result;\n\
  }\n```\n\n### 理解 ResultSetMetaData\n\n`ResultSetMetaData` 类描述结果集中列的元数据，包括以下内容：\n\
  \n- 结果集中的列数\n- 显示长度\n- 名称\n- 数据类型\n- 精度\n- 标度\n- `getColumnName()` 返回结果集中指定行、列位置列的列名，如代码列表\
  \ 20-13 所示。\n\n代码列表 20-13 的 `getColumnName()` 方法\n\n```java\npublic String getColumnName(int\
  \ index) throws OdaException\n{\n    if (index > getCount() || index < 1)\n    \
  \    throw new OdaException(Messages.getString(\"resultSetMetaData_INVALID_INDEX\"\
  ) + index);\n    return columnNames[index];\n}\n```\n\n### 理解 DataSetMetaData\n\n\
  `DataSetMetaData` 类描述结果集中列的元数据，包括以下：\n\n- 结果集中的列数\n- 显示长度\n- 名称\n- 数据类型\n- 精度\n\
  - 标度\n- `getColumnName()` 返回结果集中指定行、列位置列的列名，如代码列表 20-13 所示。\n\n### 理解 ResultSetMetaData\n\
  \n`ResultSetMetaData` 类执行以下操作：\n\n- 提供光标处理，用于向后从缓冲区结果集行获取数据\n- 将列的 `String` 值转换为指定的数据类型\n\
  \n`getConnection()` 返回数据源引用，如代码列表 20-14 所示。\n\n代码列表 20-14 的 `getConnection()` 方法\n\
  \n```java\npublic IConnection getConnection()\n{\n    return connection;\n}\n```\n\
  \n### 理解 Messages\n\n`Messages` 类定义了 ODA 驱动的异常消息。\n\n`getString()` 使用资源包返回消息，如代码列表\
  \ 20-15 所示。\n\n代码列表 20-15 的 `getString()` 方法\n\n```java\npublic static String getString(String\
  \ key)\n{\n    try {\n        return RESOURCE_BUNDLE.getString(key);\n    }\n  \
  \  catch (MissingResourceException e) {\n        return '!' + key + '!';\n    }\n\
  }\n```\n\n### 理解 CommonConstants\n\n`CommonConstants` 类定义了包中的常量，例如驱动名称、ODA 版本、关键字和分隔符。代码列表\
  \ 20-16 显示了这些定义。\n\n代码列表 20-16 的 `CommonConstants` 类\n\n```java\nfinal class CommonConstants\n\
  {\n    public static final String DELIMITER_COMMA = \",\";\n    public static final\
  \ String DELIMITER_SPACE = \" \";\n    public static final String DELIMITER_DOUBLEQUOTE\
  \ = \"\\\"\";\n    public static final String KEYWORD_SELECT = \"SELECT\";\n   \
  \ public static final String KEYWORD_FROM = \"FROM\";\n    public static final String\
  \ KEYWORD_AS = \"AS\";\n    public static final String KEYWORD_ASTERISK = \"*\"\
  ;\n    public static final String DRIVER_NAME = \"ODA CSV FILE DRIVER\";\n    public\
  \ static final int MaxConnections = 0;\n    public static final int MaxStatements\
  \ = 0;\n    public static final String CONN_HOME_DIR_PROP = \"HOME\";\n    public\
  \ static final String CONN_DEFAULT_CHARSET = \"UTF-8\";\n    public static final\
  \ String PRODUCT_VERSION = \"3.0\";\n}\n```\n\n### 开发 CSV ODA 用户界面扩展\n\n数据源扩展点 `org.eclipse.datatools.connectivity.oda.design.ui.dataSource`\
  \ 支持向用户界面（如 BIRT 报告设计器）添加新的数据源。对于每个数据源，扩展实现了以下可选组件：\n\n- 创建数据源的向导\n- 编辑数据源的页面集\n\
  - 支持的数据集列表\n\n对于每个数据集，扩展实现了以下可选组件：\n\n- 创建数据集的向导\n- 编辑数据集的页面集\n\n数据源编辑器页面必须实现 `org.eclipse.ui.propertyPages`\
  \ 扩展点，通过扩展抽象类 `org.eclipse.datatools.connectivity.oda.design.ui.wizards.DataSourceEditorPage`。数据集编辑器页面必须实现\
  \ `org.eclipse.ui.propertyPages` 扩展点，通过扩展抽象类 `org.eclipse.datatools.connectivity.oda.design.ui.wizards.DataSourceEditorPage`。\n\
  \nODA 数据源和数据集用户界面扩展通过这些基类来创建具有页面控制和其他行为的自定义属性页。\n\n\n\n\n本节描述了如何实现 BIRT ODA 用户界面插件，并以\
  \ CSV ODA 驱动程序插件为例。\n\n要创建一个 ODA 驱动程序插件，请执行以下任务：\n\n* 创建 CSV ODA 用户界面插件项目。\n* 定义依赖项。\n\
  * 指定运行时归档（run-time archive）。\n* 声明 ODA 用户界面扩展点。\n\n## 创建 CSV ODA 用户界面插件项目\n\n你可以使用\
  \ Eclipse PDE 创建 CSV ODA 用户界面插件项目 `org.eclipse.birt.report.data.oda.csv.ui`。Eclipse\
  \ PDE 提供了一个向导，可以帮助你设置插件项目并为插件扩展创建框架。\n\n`New Plug-in Project`（新建插件项目）向导简化了指定插件项目的过程，它会自动添加所需的扩展点并设置依赖项。该向导还会生成插件清单文件\
  \ `plugin.xml`，以及（可选的）Java 插件运行时类。\n\n该向导会创建所有实现类的 Java 类。它还会在生成的源代码中放置 `//TODO`\
  \ 标签，用于自定义代码，并附带了引导性注释。\n\n在使用向导创建插件后，请检查设置、对设置进行调整，并将代码添加到 Java 类存根中以实现所需的功能。\n\
  \n接下来的章节描述了如何使用 `New Plug-in Project` 向导创建插件项目。\n\n### 如何创建 CSV ODA 用户界面插件项目\n\n\
  **1** 从 Eclipse 菜单中，选择 `File→New→Project`。出现 `New Project`。\n\n**2** 在 `New Project—Select\
  \ a wizard` 中，打开 `Business Intelligence and Reporting Tools`，并选择 `ODA Designer Plug-in\
  \ Project`，如图图 20-8 所示。\n\n**图 20-8** 指定 CSV ODA Designer 项目\n\n![image](img/20fig08.jpg)\n\
  \n**3** 选择 `Next`。出现 `New Plug-in Project`。\n\n**4** 在 `Plug-in Project` 中，按照表 20-5\
  \ 所示修改设置。选择 `Next`。出现 `Plug-in Content`。\n\n**表 20-5** CSV ODA 用户界面插件项目选项设置\n\n\
  ![image](img/20tab05.jpg)\n\n**5** 在 `Plug-in Content` 中，根据需要修改设置，如图表 20-6 所示。选择\
  \ `Finish`。\n\n**表 20-6** CSV ODA 用户界面插件内容选项设置\n\n![image](img/20tab06.jpg)\n\n\
  **6** 在 `Templates` 中，选择 `ODA Data Source Designer`，如图图 20-9 所示。选择 `Next`。出现 `ODA\
  \ Data Source Designer`。\n\n**图 20-9** 指定 CSV ODA Data Source Designer 模板\n\n![image](img/20fig09.jpg)\n\
  \n向导会提示你先创建 `ODA Data Source Runtime Driver`，然后再创建设计器用户界面。向导还列出了默认实现中包含的扩展点。\n\n\
  * `org.eclipse.datatools.connectivity.connectionProfile`\n* `org.eclipse.datatools.connectivity.ui.connectionProfileImage`\n\
  * `org.eclipse.ui.propertyPages`\n* `org.eclipse.datatools.connectivity.oda.design.ui.dataSource`\n\
  \n**7** 在 `ODA Data Source Designer` 中，指定用于生成 ODA 插件的后续选项值，如图表 20-7 所示。选择 `Finish`。\n\
  \n**表 20-7** CSV ODA UI 插件内容选项设置\n\n![image](img/20tab07.jpg)\n\nCSV ODA 用户界面插件项目将出现在\
  \ Eclipse Package Explorer 中，如图图 20-10 所示。\n\n**图 20-10** 查看 CSV ODA 用户界面插件项目\n\n\
  ![image](img/20fig10.jpg)\n\n双击 `plugin.xml` 在 `PDE Manifest Editor` 中打开它。插件的概述（Overview）页面如图图\
  \ 20-11 所示。\n\n**图 20-11** 查看 CSV ODA 用户界面插件\n\n![image](img/20fig11.jpg)\n\n###\
  \ 理解 ODA 数据源用户界面扩展点\n\n在下一步中，你将检查由向导添加的扩展点以实现 CSV ODA 用户界面扩展，并添加扩展元素的详细信息。图 20-12\
  \ 显示了 CSV ODA 用户界面扩展点的列表。\n\n**图 20-12** CSV ODA 用户界面扩展点\n\n![image](img/20fig12.jpg)\n\
  \nCSV ODA 用户界面插件扩展了由以下扩展点定义的功能：\n\n* `org.eclipse.datatools.connectivity.connectionProfile`:\
  \ 提供添加连接配置（connection profile）的支持。\n* `org.eclipse.datatools.connectivity.connectionProfileImage`:\
  \ 连接配置映像扩展点支持用户从其主连接配置扩展将多个图标导入到用于用户界面代码和资源的独立插件中。\n* `org.eclipse.ui.propertyPages`:\
  \ 属性页。\n* `org.eclipse.datatools.connectivity.oda.design.ui.dataSource`: 数据源设计用户界面。\n\
  \n扩展点指定了用于生成 ODA 插件的后续选项值，如图表 20-7 所示。（注：此处原文重复，已修正）\n\nCSV ODA 用户界面插件扩展了由以下扩展点定义的功能：\n\
  \n* `org.eclipse.datatools.connectivity.connectionProfile`: 提供添加连接配置的支持。\n* `org.eclipse.datatools.connectivity.connectionProfileImage`:\
  \ 连接配置映像扩展点支持用户从其主连接配置扩展将多个图标导入到用于用户界面代码和资源的独立插件中。\n* `org.eclipse.ui.propertyPages`:\
  \ 属性页。添加一个属性页，用于在对话框中显示该对象的属性。\n* `org.eclipse.datatools.connectivity.oda.design.ui.dataSource`:\
  \ 扩展 ODA 设计用户界面，以便用户可以指定数据源。\n\n扩展点指定了识别运行时扩展的后续属性：\n\n* `ID`: 扩展实例的可选标识符\n* `Name`:\
  \ 扩展实例的名称\n\n### 理解 ConnectionProfile 扩展点\n\n`connectionProfile` 扩展点指定了创建连接配置的 `newWizard`。\n\
  \n### 理解 propertyPages 扩展点\n\n`propertyPages` 扩展点指定了以下扩展元素：\n\n* `page`: 定义属性页。指定如\
  \ `id`、`display name`、`category`、`icon`、`object class`、`filter` 和 `category` 等属性。`id`\
  \ 和 `display name` 在 `plugin.properties` 文件中本地化，如代码 20-17 所示。\n\n**代码 20-17** `plugin.properties`\n\
  \n```\n########################################\nCopyright (c) 2009 <<您的公司名称>>\n\
  #######################################\n# 插件配置\n#\noda.data.source.id=org.eclipse.birt.report.data.oda.csv\n\
  #\n#######################################\n# NLS 字符串\n#\nplugin.name=CSV File ODA\n\
  data.source.name=CSV File Data Source\nconnection.profile.name=CSV File Data Source\
  \ Connection\nnewwizard.name=CSV File Data Source\nnewwizard.description=Create\
  \ a CSV File Data Source\n    connection profile\nwizard.window.title=New CSV Data\
  \ Source Profile\ndata.source.page.title=CSV File Data Source\nprofile.propertypage.name=CSV\
  \ File Data Source Connection\n    Properties\ndata.set.window.title=New CSV File\
  \ Data Set\ndata.set.page.title=Query\n```\n\nODA 用户界面框架提供了一个默认实现，它为每个属性值创建一个文本控件，因此无需提供自定义实现。默认情况下，向导在以下\
  \ `org.eclipse.ui.propertyPages` 扩展点中设置了 `page.class`：\n\n`page.class=org.eclipse.datatools.connectivity.oda.design.ui.pages.impl.DefaultDataSourcePropertyPage`\n\
  \n* `filter`: 指定一个操作过滤器，评估当前选择中每个对象的属性。如果对象具有指定的状态，则发生匹配。每个对象必须实现 `org.eclipse.ui.IActionFilter`\
  \ 接口。\n\n### 理解 dataSource 扩展点\n\n`dataSource` 扩展点指定了以下扩展元素：\n\n* `dataSourceUI`:\
  \ 为指定扩展数据源添加用户界面支持。\n* `dataSetUI`: `dataSetUI` 扩展元素定义了以下扩展元素和细节：\n    * `id`: 数据集的完全限定名称，例如\
  \ `org.eclipse.birt.report.data.oda.csv.dataSet`。此名称必须与 ODA 扩展驱动数据集的名称相同。\n    *\
  \ `dataSetWizard`: 数据集向导。\n\n\n\n\n`Wizard` 类用于在 BIRT Report Designer 用户界面中指定数据集。此类必须使用或扩展\
  \ `org.eclipse.datatools.connectivity.oda.design.ui.wizards.DataSetWizard`。在插件属性文件中本地化窗口标题\
  \ `%wizard.data.set.window.title`。\n\n* `dataSetPage`\n  指定一个编辑器页，将其添加到数据集的编辑器对话框中。数据集用户界面按照页面的定义顺序向向对话框中添加编辑器页。此类必须使用或扩展\
  \ `org.eclipse.datatools.connectivity.oda.design.ui.wizards.DataSetWizardPage`。其实现代码位于\
  \ `org.eclipse.birt.report.data.oda.csv.ui.impl.CustomDataSetWizardPage` 中。该向导提供了一个默认的实现代码。\n\
  \  页面的显示名称 `%wizard.data.set.page.title` 在 `plugin.properties` 文件中外部化。\n\n## 了解示例\
  \ CSV ODA 用户界面扩展\n\n本章描述的 CSV ODA 用户界面扩展阐明了如何使用 Eclipse PDE 创建 ODA 用户界面插件。接下来的部分描述了开发者在\
  \ Eclipse PDE 中定义插件框架后，为完成 CSV ODA 用户界面扩展开发而必须进行的代码级扩展。\n\nCSV ODA 用户界面插件包含以下包：\n\
  \n* `org.eclipse.birt.report.data.oda.csv.ui`\n  包含 `UiPlugin` 类，该类在您创建插件项目时由 PDE\
  \ Manifest 编辑器自动生成。\n\n* `org.eclipse.birt.report.data.oda.csv.ui.i18n`\n  包含 `Messages`\
  \ 类和属性文件 `messages.properties`，用于生成在用户界面中显示的消息。这些消息的本地化版本位于遵循以下命名语法的文件中：`messages_<locale>.msg`\n\
  \n* `org.eclipse.birt.report.data.oda.csv.ui.impl`\n  包含 `CustomDataSetWizardPage`\
  \ 类，这是一个自动生成的 ODA 数据集设计器页实现，支持创建或编辑 ODA 数据集。\n\n* `org.eclipse.birt.report.data.oda.csv.ui.wizards`\n\
  \  `wizards` 包包含了用于在 BIRT Report Designer 中选择数据源和数据集的用户界面页面的类。\n\n### 实现 ODA 数据源和数据集向导\n\
  \n在 BIRT 2.1 版本中，BIRT Report Designer 采用了 Eclipse Data Tools Platform (DTP) ODA\
  \ 设计时框架。BIRT 2.6 版本通过添加新的向导来自动生成可自定义的实现进一步扩展了 DTP ODA 设计时框架。DTP ODA 框架定义了 CSV ODA\
  \ 用户界面插件使用的三个扩展点中的两个：\n\n* 连接配置 (Connection profile)\n  定义在 `org.eclipse.datatools.connectivity.connectionProfile`\
  \ 中\n* 数据源和数据集向导\n  定义在 `org.eclipse.datatools.connectivity.oda.design.ui.dataSource`\
  \ 中\n\nCSV ODA 用户界面插件还必须实现定义 `org.eclipse.ui.propertyPages` 中的属性页扩展点。\n\nCSV ODA\
  \ 用户界面插件使用 `org.eclipse.datatools.connectivity.oda.design.ui.wizards` 包中的抽象基类来创建指定数据源和数据集页的向导。ODA\
  \ 用户界面插件必须扩展这些类，以为向导页提供页面控制和相关行为：\n\n* `DataSourceEditorPage`\n  为实现 ODA 数据源属性页提供框架\n\
  * `DataSourceWizardPage`\n  为实现 ODA 数据源向导页提供框架\n* `DataSetWizardPage`\n  为实现 ODA\
  \ 数据集向导页提供框架\n\n### 了解 org.eclipse.birt.report.data.oda.csv.ui.impl 包\n\n此自定义页面提供了一个简单的\
  \ `Query Text` 控件供用户输入。该页面扩展了 DTP ODA 设计时框架中的 `org.eclipse.datatools.connectivity.oda.design.ui.wizards.DataSetWizardPage`，以便使用查询元数据更新\
  \ ODA 数据集设计实例。\n\n### 了解 org.eclipse.birt.report.data.oda.csv.ui.wizards 包\n\nCSV\
  \ ODA 用户界面扩展示例中的 `org.eclipse.birt.report.data.oda.csv.ui.wizards` 包实现了以下类：\n\n\
  * `Constants`\n  为运行时驱动实现 `org.eclipse.birt.report.data.oda.csv` 中定义的数据源连接属性定义常量。\n\
  * `CSVFilePropertyPage`\n  扩展 `DataSourceEditorPage`。此类创建并初始化用于指定 ODA 数据源的属性页的编辑器控件。该类根据从页面收集的值更新连接配置属性。\n\
  * `CSVFileSelectionPageHelper`\n  指定页面布局并设置监听用户输入以及验证 CSV 数据源文件位置的控件。\n* `CSVFileSelectionWizardPage`\n\
  \  扩展 `DataSourceWizardPage`。此类创建并初始化数据源向导页的控件。该类设置选择文件消息并收集属性值。\n* `FileSelectionWizardPage`\n\
  \  扩展 `DataSetWizardPage`。此类创建并初始化数据集向导页的控件并指定页面布局。该类连接到数据源，执行查询，检索元数据和结果集，并更新数据集设计。\n\
  \n### 了解 Constants\n\n`Constants` 类为 `org.eclipse.birt.report.data.oda.csv` 中定义的数据源连接属性定义了以下变量：\n\
  \n* `ODAHOME` 指定 CSV ODA 文件路径常量 `HOME`\n* `ODA_DEFAULT_CHARSET` 指定默认字符集位 8 位 Unicode\
  \ 格式 (UTF8)\n* `DEFAULT_MAX_ROWS` 设置从数据源可以检索的最大行数\n\n```\npublic class Constants\
  \ {\n    public static String ODAHOME=\"HOME\";\n    public static String ODA_DEFAULT_CHARSET\
  \ = \"UTF-8\";\n    public static int DEFAULT_MAX_ROWS = 1000;\n}\n```\n\n### 了解\
  \ CSVFilePropertyPage\n\n`CSVFilePropertyPage` 扩展了 `DataSourceEditorPage` 类，实现了以下方法为\
  \ CSV 属性页提供编辑功能：\n\n* `createAndInitCustomControl()` 方法执行以下任务：\n* 实例化 `CSVFileSelectionPageHelper`\
  \ 对象\n* 指定页面布局并通过调用 `CSVFileSelectionPageHelper.createCustomControl()` 和 `initCustomControl()`\
  \ 方法设置控件\n\n```java\nprotected void createAndInitCustomControl( Composite parent,\
  \ Properties profileProps ) {\n    if( m_pageHelper == null ) {\n        m_pageHelper\
  \ = new CSVFileSelectionPageHelper( this );\n    }\n    m_pageHelper.createCustomControl(\
  \ parent );\n    m_pageHelper.initCustomControl( profileProps );\n    if( ! isSessionEditable()\
  \ ) {\n        getControl().setEnabled( false );\n    }\n}\n```\n\n* `collectCustomProperties()`\
  \ 通过调用 `CSVFileSelectionPageHelper.collectCustomProperties()` 方法用从页面收集的值更新连接配置属性：\n\
  \n```java\npublic Properties collectCustomProperties( Properties profileProps )\
  \ {\n    if( m_pageHelper == null ) {\n        return profileProps;\n    }\n   \
  \ return m_pageHelper.collectCustomProperties( profileProps );\n}\n```\n\n### 了解\
  \ CSVFileSelectionPageHelper\n\n`CSVFileSelectionPageHelper` 为 `CSVFilePropertyPage`\
  \ 和 `CSVFileSelectionWizardPage` 类提供辅助处理。`CSVFileSelectionPageHelper` 实现了以下方法：\n\
  \n* `createCustomControl()` 执行以下任务：\n* 设置复合页面布局\n\n\n\n\n\n- 调用 `setupFileLocation()`\
  \ 方法，该方法设置一个控件以监听用户输入并验证 CSV 数据源文件的位置。\n\n- `[列表 20-21]](#ch20.html_ch20ex21) 显示了\
  \ `createCustomControl()` 方法的代码。\n\n**列表 20-21** `createCustomControl()` 方法\n\n\
  ```java\nvoid createCustomControl( Composite parent )\n{\n   Composite content =\
  \ new Composite( parent, SWT.NULL );\n   GridLayout layout = new GridLayout( 2,\
  \ false );\n   content.setLayout(layout);\n   setupFileLocation( content );\n}\n\
  ```\n\n- `setupFileLocation()` 执行以下任务：\n    - 在页面布局中设置标签和网格数据对象\n    - 设置监听用户输入并验证\
  \ CSV 数据源文件位置的控件\n\n列表 20-22 显示了 `setupFileLocation()` 方法的代码。\n\n**列表 20-22** `setupFileLocation()`\
  \ 方法\n\n```java\nprivate void setupFileLocation( Composite composite )\n{\n   Label\
  \ label = new Label( composite, SWT.NONE );\n   label.setText( Messages.getString\n\
  \      ( \"label.selectFile\" ) );\n   GridData data = new GridData( GridData.FILL_HORIZONTAL\
  \ );\n   fileName = new Text( composite, SWT.BORDER );\n   fileName.setLayoutData(\
  \ data );\n   setPageComplete( false );\n   fileName.addModifyListener(\n      new\
  \ ModifyListener( )\n          {\n             public void modifyText( ModifyEvent\
  \ e )\n             {\n                 verifyFileLocation();\n             }\n\
  \          } );\n}\n```\n\n- `collectCustomProperties()` 在连接配置中设置数据源目录属性，如 [列表 20-23]](#ch20.html_ch20ex23)\
  \ 所示。\n\n**列表 20-23** `collectCustomProperties()` 方法\n\n```java\nProperties collectCustomProperties(\
  \ Properties props )\n{\n   if( props == null )\n      props = new Properties( );\n\
  \   props.setProperty( CommonConstants.CONN_HOME_DIR_PROP,\n      getFolderLocation(\
  \ );\n   return props;\n}\n```\n\n- `initCustomControl()` 将数据源控件初始化数据源文件的位置，如 [列表\
  \ 20-24]](#ch20.html_ch20ex24) 所示。\n\n**列表 20-24** `initCustomControl()` 方法\n\n\
  ```java\nvoid initCustomControl( Properties profileProps )\n{\n   if( profileProps\
  \ == null || profileProps.isEmpty( ) ||\n      fileName == null )\n   return;\n\
  \   String folderPath = profileProps.getProperty(\n      CommonConstants.CONN_HOME_DIR_PROP\
  \ );\n   if( folderPath == null )\n      folderPath = EMPTY_STRING;\n   fileName.setText(\
  \ folderPath );\n   verifyFileLocation();\n}\n```\n\n### 理解 CSVFileSelectionPage\n\
  \n`CSVFileSelectionWizardPage` 类继承自 `DataSourceWizardPage`，实现了以下方法为 CSV ODA 数据源页提供功能：\n\
  \n- `createPageControl()` 方法执行以下任务：\n    - 实例化 `CSVFileSelectionPage` 对象\n    -\
  \ 通过调用 `CSVFileSelectionHelper.createCustomControl()` 指定页面布局并设置向导控件\n    - 运行 `CSVFileSelectionHelper.initCustomControl()`\
  \ 将控件初始化数据源文件的位置\n\n列表 20-25 显示了 `createPageControl()` 方法的代码。\n\n**列表 20-25** `createPageControl()`\
  \ 方法\n\n```java\npublic void createPageControl( Composite parent )\n{\n   if( m_pageHelper\
  \ == null )\n      m_pageHelper = new CSVFileSelectionHelper( this );\n   m_pageHelper.createCustomControl(\
  \ parent );\n   m_pageHelper.initCustomControl( m_csvFileProperties );\n}\n```\n\
  \n- `collectCustomProperties()` 方法实例化一个 `Properties` 对象来包含 CSV 数据源信息，如 [列表 20-26]](#ch20.html_ch20ex26)\
  \ 所示。\n\n**列表 20-26** `collectCustomProperties()` 方法\n\n```java\npublic Properties\
  \ collectCustomProperties( )\n{\n   if( m_pageHelper != null )\n      return m_pageHelper.collectCustomProperties(\
  \ m_csvFileProperties );\n   return ( m_csvFileProperties != null ) ? m_csvFileProperties\
  \ : new Properties( );\n}\n```\n\n### 理解 FileSelectionWizardPage\n\n`FileSelectionWizardPage`\
  \ 类继承自 `DataSetWizardPage`，实现了以下方法为 CSV ODA 数据集页提供功能：\n\n- `createPageControl()`\
  \ 方法执行以下任务：\n    - 指定页面布局并设置向导控件\n    - 获取数据源属性\n    - 调用 `populateAvailableList()`\
  \ 更新数据集设计\n\n列表 20-27 显示了 `createPageControl()` 方法的代码。\n\n**列表 20-27** `createPageControl()`\
  \ 方法\n\n```java\nprivate Control createPageControl( Composite parent )\n{\n   Composite\
  \ composite = new Composite( parent, SWT.NULL );\n   FormLayout layout = new FormLayout(\
  \ );\n   composite.setLayout( layout );\n   FormData data = new FormData( );\n \
  \  data.left = new FormAttachment( 0, 5 );\n   data.top = new FormAttachment( 0,\
  \ 5 );\n   fileName = new Text( composite, SWT.BORDER );\n   fileName.setLayoutData(\
  \ data );\n   Properties dataSourceProps =\n      getInitializationDesign( ).getDataSourceDesign(\
  \ )\n      .getPublicProperties( );\n   fileName.setText( ( String )(\n      dataSourceProps.getProperty(\
  \ Constants.ODAHOME ))));\n   data = new FormData( );\n   data.top = new FormAttachment(\n\
  \      fileName, 10, SWT.BOTTOM );\n   data.left = new FormAttachment( 0, 5 );\n\
  \   data.right = new FormAttachment( 47, -5 );\n   data.bottom = new FormAttachment(\
  \ -5 );\n   data.width = DEFAULT_WIDTH;\n   data.height = DEFAULT_HEIGHT;\n   m_availableList\
  \ = new List( composite,\n      SWT.BORDER | SWT.H_SCROLL | SWT.V_SCROLL );\n  \
  \ m_availableList.setLayoutData( data );\n   m_selectedFile = ( String )( dataSourceProps.getProperty(\
  \ Constants.ODAHOME )) );\n   populateAvailableList( );\n   return composite;\n\
  }\n```\n\n- `getQuery()` 方法通过以下操作构建数据集查询：\n    - 从文件对象获取表名\n    - 将表名追加到选择所有列的查询\n\
  \    - 将特定列列表列表和表名追加到查询中\n    - 返回查询语句\n\n列表 20-28 显示了 `getQuery()` 方法的代码。\n\n**列表\
  \ 20-28** `getQuery()` 方法\n\n```java\nprivate String getQuery( )\n{\n   String tableName\
  \ = null;\n   StringBuffer buf = new StringBuffer( );\n   File file = m_selectedFile;\n\
  \   if(file != null )\n   {\n      tableName = file.getName();\n   }\n   if(tableName\
  \ != null )\n   {\n      if(m_availableList.getItemCount( ) == 0)\n      {\n   \
  \      buf.append(\"select from \").append(tableName);\n      }\n      else\n  \
  \    {\n         buf.append(\"select \");\n         String[ ] columns = m_availableList.getItems(\
  \ );\n         for(int n = 0; n < columns.length; n++)\n         {\n           \
  \ buf.append(columns[n]);\n            if(n < columns.length - 1)\n            {\n\
  \               buf.append(\", \");\n            }\n         }\n         buf.append(\"\
  \ from \").append(tableName);\n      }\n   }\n   return buf.toString();\n}\n```\n\
  \n- `getQueryColumnNames()` 方法执行以下任务：\n    - 实例化 `CSVFileDriver`\n    - 使用 CSV ODA\
  \ 运行时驱动程序和数据源连接属性准备查询并获取结果集元数据\n    - 获取列数\n    - 遍历元数据结果获取列名并返回结果\n\n列表 20-29 显示了\
  \ `getQueryColumnNames()` 方法的代码。\n\n**列表 20-29** `getQueryColumnNames()` 方法\n\n\
  ```java\nprivate String[ ] getQueryColumnNames(\n   String queryText, File file\
  \ )\n{\n   IDriver ffDriver = new CSVFileDriver( );\n   IConnection conn = null;\n\
  \   try\n   {\n      conn = ffDriver.getConnection( null );\n      IResultSetMetaData\
  \ metadata =\n         getResultSetMetaData( queryText, file, conn );\n```\n\n\n\
  \n```java\nint columnCount = metadata.getColumnCount( );\n\nif( columnCount == 0\
  \ )\n    return null;\nString[ ] result = new String[columnCount];\nfor( int i =\
  \ 0; i < columnCount; i++)\n    result[i] = metadata.getColumnName( i + 1 );\nreturn\
  \ result;\n\n}\ncatch( OdaException e )\n{\n    setMessage( e.getLocalizedMessage(\
  \ ), ERROR );\n    disableAll( );\n    return null;\n}\nfinally\n{\n    closeConnection(\
  \ conn );\n}\n```\n\n- `getResultSetMetaData()` 方法执行以下任务：\n- 设置 `Properties` 对象，指定数据源文件位置\n\
  - 打开与数据源的连接\n- 设置 `Query` 对象并准备查询文本\n- 执行查询\n- 返回元数据\n\n插列表 20-30 显示了 `getResultSetMetaData()`\
  \ 方法的代码。\n\n**插列表 20-30** `getResultSetMetaData()` 方法\n\n```java\nprivate IResultSetMetaData\
  \ getResultSetMetaData(\n    String queryText, File file, IConnection conn )\n \
  \   throws OdaException\n{\n    java.util.Properties prop = new java.util.Properties(\
  \ );\n    prop.put( CommonConstants.CONN_HOME_DIR_PROP,\n        file.getParent(\
  \ ) );\n    conn.open( prop );\n    IQuery query = conn.newQuery( null );\n    query.setMaxRows(\
  \ 1 );\n    query.prepare( queryText );\n    query.executeQuery( );\n    return\
  \ query.getMetaData( );\n}\n```\n\n- `setResultSetMetaData()` 方法通过执行以下任务用查询返回的元数据更新数据集页面设计：\n\
  - 调用 `DesignSessionUtil.toResultSetColumnsDesign()` 方法，将运行时元数据转换为设计时的 `ResultSetColumns`\
  \ 对象\n- 从设计工厂获取 `ResultSetDefinition` 对象，用于用元数据定义填充数据集页面设计\n- 调用 `resultSetDefn.setResultSetColumns()`\
  \ 方法，设置对 `ResultSetColumns` 对象的引用（该对象包含元数据内容）\n- 将结果集定义分配给数据集设计\n\n插列表 20-31 显示了\
  \ `setResultSetMetaData()` 方法的代码。\n\n**插列表 20-31** `setResultSetMetaData()` 方法\n\
  \n```java\nprivate void setResultSetMetaData(\n    DataSetDesign dataSetDesign,IResultSetMetaData\
  \ md )\n    throws OdaException\n{\n    ResultSetColumns columns =\n        DesignSessionUtil.toResultSetColumnsDesign(\
  \ md );\n    ResultSetDefinition resultSetDefn =\n        DesignFactory.eINSTANCE.createResultSetDefinition(\
  \ );\n    resultSetDefn.setResultSetColumns( columns );\n    dataSetDesign.setPrimaryResultSet(\
  \ resultSetDefn );\n    dataSetDesign.getResultSets().setDerivedMetaData( true );\n\
  }\n```\n\n- `savePage()` 方法执行以下任务：\n- 实例化 `CSVFileDriver`\n- 获取结果集元数据\n- 使用元数据更新数据集设计\n\
  - 关闭连接\n\n插列表 20-32 显示了 `savePage()` 方法的代码。\n\n**插列表 20-32** `savePage()` 方法\n\n\
  ```java\nprivate void savePage( DataSetDesign dataSetDesign )\n{\n    String queryText\
  \ = getQuery( );\n    dataSetDesign.setQueryText( queryText );\n    IConnection\
  \ conn = null;\n    try\n    {\n        IDriver ffDriver = new CSVFileDriver( );\n\
  \        conn = ffDriver.getConnection( null );\n        IResultSetMetaData metadata\
  \ =\n            getResultSetMetaData( queryText, m_selectedFile,\n            conn\
  \ );\n        setResultSetMetaData( dataSetDesign, metadata );\n    }\n    catch(\
  \ OdaException e )\n    {\n        dataSetDesign.setResultSets( null );\n    }\n\
  \    finally\n    {\n        closeConnection( conn );\n    }\n}\n```\n\n### 测试 CSV\
