  \n## 为报表设计使用 Java 事件处理程序\n\nBIRT 触发了几个由报表设计元素处理的事件。处理这些事件的 Java 类必须实现 `IReportEventHandler`\
  \ 接口或继承 `ReportEventAdapter` 类。所有事件处理方法都接收一个 `IReportContext` 对象。`beforeFactory()`\
  \ 方法还接收一个 `IReportDesign` 对象。表 9-6 列出了你可以为 `ReportDesign` 元素实现的方法，按执行顺序排序。\n\n**表\
  \ 9-6** ReportDesign 事件处理程序方法\n\n![image](img/09tab06.jpg)\n\n### 理解 BIRT 接口\n\n\
  Java 事件处理程序的开发者需要熟悉几个接口。大多数处理器参数和返回值都是 接口而不是类。开发事件处理程序最重要的 Java 接口有：\n\n- 元素设计\n\
  - `IReportElement`\n- 元素实例\n- 报表上下文\n- `IColumnMetaData`\n- `IDataSetInstance`\n\
  - `IDataSourceInstance`\n- `IDataSetRow`\n\n#### 关于元素设计接口\n\n每个元素都有唯一的元素设计接口。该 Java\
  \ 接口指定了访问和设置元素设计特定功能的方法。每个元素设计都继承 `IReportElement`。\n\n##### 每个报表元素的方法\n\n除了 `IDesignElement`\
  \ 定义的方法外，每个报表元素都有适用于该报表元素的方法。例如，`ICell` 是 `Cell` 对象的接口，除了 `IDesignElement` 定义的方法外，还包含以下方法：\n\
  \n- `getColumn()`\n- `getColumnSpan()`\n- `getDrop()`\n- `getHeight()`\n- `getRowSpan()`\n\
  - `getWidth()`\n- `setColumn(int column)`\n- `setColumnSpan(int span)`\n- `setDrop(java.lang.String\
  \ drop)`\n\n相比之下，`ITextItem`（文本元素的设计接口）包含了这些额外方法：\n\n- `getContent()`\n- `getContentKey()`\n\
  - `setContentType()`\n- `getDisplayContent()`\n- `setContent(java.lang.String value)`\n\
  - `setContentKey(java.lang.String resourceKey)`\n- `setContentType(java.lang.String\
  \ contentType)`\n\n##### 关于 IReportElement 接口\n\n`IReportElement` 接口是所有报表元素接口的基接口。`IReportElement`\
  \ 具有方法：\n\n- `getComments()`\n- `getCustomXml()`\n- `getDisplayName()`\n- `getDisplayNameKey()`\n\
  - `getName()`\n- `getNamedExpression(java.lang.String name)`\n- `getParent()`\n\n\
  \n\n\n- `getQualifiedName()`\n- `getStyle()`\n- `getUserProperty(java.lang.String\
  \ name)`\n- `setComments(java.lang.String theComments)`\n- `setCustomXml(java.lang.String\
  \ customXml)`\n- `setDisplayName(java.lang.String displayName)`\n- `setDisplayNameKey(java.lang.String\
  \ displayNameKey)`\n- `setName(java.lang.String name)`\n- `setNamedExpression(java.lang.String\
  \ name, java.lang.String exp)`\n- `setUserProperty(java.lang.String name, java.lang.Object\
  \ value)`\n\n## 关于元素实例接口\n\n元素实例接口在运行时可用，但在设计时不可。这些接口提供了对元素运行时实例的访问。`onCreate()`（生成阶段事件处理器）和\
  \ `onRender()`（呈现阶段事件处理器）都接收元素实例接口作为参数。通过实例接口，你可以访问到一组与设计时不同的属性。没有一个所有元素实例接口都继承的超接口。与元素设计接口一样，实例接口中的方法集随元素类型而异。例如，`ICellInstance`（单元格实例接口）包含以下方法：\n\
  \n- `getColSpan()`\n- `getColumn()`\n- `getRowSpan()`\n- `setColSpan(int colSpan)`\n\
  - `setRowSpan(int rowSpan)`\n\n相比之下，`IRowInstance`（行实例接口）包含这些方法：\n\n- `getBookmarkValue()`\n\
  - `getHeight()`\n- `getStyle()`\n- `setBookmark()`\n- `setHeight()`\n\n## 使用 IReportContext\
  \ 接口\n\n除了 `ScriptedDataSource` 和 `ScriptedDataSet` 对象外，所有事件处理器都使用 `IReportContext`\
  \ 类型的对象。`IReportContext` 接口包含了表 9-7 所示的方法。\n\n**表 9-7** `IReportContext` 接口方法\n\n\
  ![image](img/09tab07.jpg)\n\n![image](img/09tab07a.jpg)\n\n![image](img/09tab07b.jpg)\n\
  \n## 使用 IColumnMetaData 接口\n\n`IColumnMetaData` 接口提供了有关数据集列的信息。表 9-8 列出了 `IColumnMetaData`\
  \ 接口中的方法。\n\n**表 9-8** `IColumnMetaData` 接口方法\n\n![image](img/09tab08.jpg)\n\n##\
  \ 使用 IDataSetInstance 接口 \n\n`IDSetInstance` 接口提供了对数据集及其元素许多方面的访问。每个 DataSet 事件处理器方法都接收一个\
  \ `IDSetInstance` 对象作为参数。表 9-9 描述了 `IDSetInstance` 接口中的方法。\n\n**表 9-9** `IDSetInstance`\
  \ 接口方法\n\n![image](img/09tab09.jpg)\n\n## 使用 IDataSetRow 接口 \n\n`IDSetRow` 类型的对象被传递给\
  \ `DataSet.onfetch()` 事件处理器方法。`IDSetRow` 有两个 `getColumnValue()` 方法。这两个方法的区别仅在于指定包含该值的列的参数。它们都返回一个\
  \ `java.lang.Object` 对象，你必须将其转换为该列的相应类型。表 9-10 列出了 `IDSetRow` 接口中的方法。\n\n**表 9-10**\
  \ `IDSetRow` 接口方法\n\n![image](img/09tab10.jpg)\n\n## 使用 IRowData 接口 \n\n`IReportElementInstance`\
  \ 的 `getRowData()` 方法（每个报告元素实例接口都继承了该方法）返回一个 `IRowData` 类型的对象。`IRowData` 提供了对表格或列表中显示的绑定值的访问。`IRowData`\
  \ 接口有两个 `getExpressionValue()` 方法。这两个方法都返回表格中特定列的显示值。这两个方法的区别在于指定所需列的参数。表 9-11 列出了\
  \ `IRowData` 接口中的方法。\n\n**表 9-11** RowData 接口方法\n\n![image](img/09tab11.jpg)\n\n\
  ### Java 事件处理器示例\n\n以下列表提供了一些用 Java 编写的事件处理器的常见示例。第 8 章中以及“使用 JavaScript 编写事件处理器”中插的示例也可以作为参考。\n\
  \n### 报告级事件\n\n报告级事件包括 `initialize`、`beforeFactory`、`afterFactory`、`beforeRender`\
  \ 和 `afterRender`。这些事件的调用取决于正在发生的报告执行类型。\n\n`beforeFactory()` 方法经常被重写，因为在该事件处理器中可能会发生报告设计的变化。列表\
  \ 9-1 检查了一个布尔参数。如果该值为 true，则报告设计将删除一个名为 `Mytable` 的表格。\n\n**列表 9-1** 在 `beforeFactory`\
  \ 中使用 Report Engine API\n\n```java\npackage my.event.handlers;\n\nimport org.eclipse.birt.report.engine.api.script.IReportContext;\n\
  import org.eclipse.birt.report.engine.api.script.element.IReportDesign;\nimport\
  \ org.eclipse.birt.report.engine.api.script.eventadapter.ReportEventAdapter;\nimport\
  \ org.eclipse.birt.report.model.*;\nimport org.eclipse.birt.report.model.api.SemanticException;\n\
  \npublic class MyEvents extends ReportEventAdapter {\n    @Override\n    public\
  \ void beforeFactory(IReportDesign report, IReportContext reportContext) {\n   \
  \     if ((Boolean)reportContext.getParameter(\"check\")) {\n            ReportDesignHandle\
  \ rdh = (ReportDesignHandle)reportContext.getRunnable().getDesignHandle();\n   \
  \         try {\n                rdh.findElement(\"Mytable\").drop();\n        \
  \    } catch (SemanticException e) {\n                e.printStackTrace();\n   \
  \         }\n        }\n    }\n}\n```\n\n此示例使用 Design Engine API 需要将 `model.jar`\
  \ 和 `core.jar` 添加到构建路径中。列表 9-2，位于资源文件夹的库 `mylibrary.rpt` 打开。名为 `datasource` 的数据源、名为\
  \ `dataset` 的数据集以及名为 `mytable` 的表格都被添加到当前报告设计中。\n\n**列表 9-2** 在 `beforeFactory`\
  \ 中使用 Report Engine API\n\n```java\npackage my.event.handlers;\n\nimport org.eclipse.birt.report.engine.api.script.IReportContext;\n\
  import org.eclipse.birt.report.engine.api.script.element.IReportDesign;\nimport\
  \ org.eclipse.birt.report.engine.api.script.eventadapter.ReportEventAdapter;\nimport\
  \ org.eclipse.birt.report.model.*;\nimport org.eclipse.birt.report.model.api.SemanticException;\n\
  \npublic class MyReportAddEvent extends ReportEventAdapter {\n    @Override\n  \
  \  public void beforeFactory(IReportDesign report, IReportContext reportContext)\
  \ {\n        ReportDesignHandle rdh = (ReportDesignHandle)reportContext.getRunnable().getDesignHandle();\n\
  \        DesignSession ds = rdh.getModule().getSession();\n        try {\n     \
  \       String rsf = ds.getResourceFolder();\n            LibraryHandle libhan =\
  \ ds.openLibrary(rsf + \"/mylibrary.rpt\").handle();\n            DesignElementHandle\
  \ deh1 = libhan.findDataSource(\"datasource\");\n            DesignElementHandle\
  \ deh2 = libhan.findDataSet(\"dataset\");\n            DesignElementHandle deh3\
  \ = libhan.findElement(\"mytable\");\n            rdh.getDataSources().add(deh1);\n\
  \            rdh.getDataSets().add(deh2);\n            rdh.getBody().add(deh3);\n\
  \            libhan.close();\n        } catch (Exception e) {\n            e.printStackTrace();\n\
  \        }\n    }\n}\n```\n\n### 报告项事件\n\n报告项事件支持更改项目的默认行为。在 `onPrepare` 事件中进行的更改可以更改设计，在\
  \ `onCreate` 事件中进行的更改可以在生成时更改特定实例，而 `onRender` 事件可以在渲染时更改实例的属性。请考虑列表 9-3 中的图像项示例。\n\
  \n\n\n\n此示例演示了如何为不同的图像项目更改图像源。如果图像类型为 URL 图像，则会检查输出格式并更改图像的 URL。如果图像类型为资源文件夹中的文件，会在文件名中搜索字符串\
  \ `up`。如果找到该字符串，则将图像替换为名为 `down` 的图像。如果图像类型是嵌入图像，则会检查报告参数 `SwapImage`。如果该值为 `true`，则将图像切换为另一个嵌入图像。如果图像是来自数据库的\
  \ BLOB 类型图像，则将图像的字节流替换为从本地文件系统读取的字节流。\n\n### 列表 9-3 在 onRender 中更改报表项目属性\n\n```java\n\
  package my.event.handlers;\n\nimport org.eclipse.birt.report.engine.api.script.IReportContext;\n\
  import org.eclipse.birt.report.engine.api.script.eventadapter.ImageEventAdapter;\n\
  import org.eclipse.birt.report.engine.api.script.instance.IImageInstance;\nimport\
  \ org.eclipse.birt.report.engine.content.IImageContent;\nimport java.io.*;\n\npublic\
  \ class myImageHandler extends ImageEventAdapter {\n    public void onRender(IImageInstance\
  \ image, IReportContext reportContext) {\n        if(image.getImageSource() == IImageContent.IMAGE_URL)\
  \ {\n            if(reportContext.getOutputFormat().equalsIgnoreCase(\"html\"))\
  \ {\n                image.setURL(\"http://us.i1.yimg.com/us.yimg.com/i/ww/beta/y3.gif\"\
  );\n            } else {\n                image.setURL(\"http://www.google.com/intl/en_ALL/images/logo.gif\"\
  );\n            }\n        }\n        if(image.getImageSource() == IImageContent.IMAGE_FILE)\
  \ {\n            String rpl = image.getFile();\n            if(rpl.contains(\"up\"\
  )) {\n                String newstr = rpl.replaceAll(\"up\", \"down\");\n      \
  \          image.setFile(newstr);\n            }\n        }\n        if(image.getImageSource()\
  \ == IImageContent.IMAGE_NAME) {\n            if((Boolean)reportContext.getParameterValue(\"\
  SwapImage\")))\n                if(image.getImageName().compareToIgnoreCase(\"tocico.png\"\
  ) == 0) {\n                    image.setImageName(\"clientprintico.PNG\");\n   \
  \             }\n            }\n        }\n        if(image.getImageSource() ==\
  \ IImageContent.IMAGE_EXPRESSION) {\n            try {\n                File myfile\
  \ = new File(\"c:/temp/test.png\");\n                FileInputStream ist = new FileInputStream(myfile);\n\
  \                long lengthi = myfile.length();\n                byte[] imageData\
  \ = new byte[(int)lengthi];\n                ist.read(imageData);\n            \
  \    ist.close();\n                image.setData(imageData);\n            } catch(Exception\
  \ e) {\n                e.printStackTrace();\n            }\n        }\n    }\n\
  }\n```\n\n如前所述，`onPrepare` 处理器可以影响报表项目的设计。在列表 9-4 所示的示例中，`onPrepare` 为数据元素添加了超链接和目录。重写\
  \ `onCreate` 事件是为了根据数据实例的值来修改超链接。\n\n### 列表 9-4 在 onCreate 和 onPrepare 中更改项目属性\n\
  \n```java\npackage my.event.handlers;\n\nimport org.eclipse.birt.report.engine.api.script.IReportContext;\n\
  import org.eclipse.birt.report.engine.api.script.element.IAction;\nimport org.eclipse.birt.report.engine.api.script.element.DataItemItem;\n\
  import org.eclipse.birt.report.engine.api.script.eventadapter.DataItemAdapter;\n\
  import org.eclipse.birt.report.engine.api.script.instance.IActionInstance;\nimport\
  \ org.eclipse.birt.report.engine.api.script.instance.DataItemInstance;\nimport org.eclipse.birt.report.model.api.elements.DesignConstants;\n\
  \npublic class MyDataEvent extends DataItemAdapter {\n    @Override\n    public\
  \ void onCreate(DataItemInstance data, IReportContext reportContext) {\n       \
  \ IActionInstance ai = data.getAction();\n        if((Integer)data.getValue() ==\
  \ 1011) {\n            ai.setHyperlink(\"http://www.yahoo.com\", \"_blank\");\n\
  \        }\n    }\n    @Override\n    public void onPrepare(DataItemItem dataItemHandle,\
  \ IReportContext reportContext) {\n        IAction act = dataItemHandle.getAction();\n\
  \        try {\n            act.setTarget(\"_blank\");\n            act.setURI(\"\
  http://www.google.com\");\n            act.setLinkType(DesignConstants.ACTION_LINK_TYPE_HYPERLINK);\n\
  \            dataItemHandle.setTocExpression(\"row[\\\"ORDERNUMBER\\\"]\n      \
  \  } catch(Exception e) {\n            e.printStackTrace();\n        }\n    }\n\
  }\n```\n\n为行使用 `onCreate` 事件处理器可以访问绑定的列。例如，列表 9-5 中的代码获取了表格元素中每行数据的 `QUANTITYORDERED`\
  \ 列。如果该值大于 40，则将该行的背景设置为绿色。\n\n### 列表 9-5 在 onCreate 中访问绑定的数据值\n\n```java\npackage\
  \ my.event.handlers;\n\nimport org.eclipse.birt.report.engine.api.script.IReportContext;\n\
  import org.eclipse.birt.report.engine.api.script.eventadapter.RowEventAdapter;\n\
  import org.eclipse.birt.report.engine.api.script.instance.IRowInstance;\n\npublic\
  \ class MyRow extends RowEventAdapter {\n    @Override\n    public void onCreate(IRowInstance\
  \ rowInstance, IReportContext reportContext) {\n        try {\n            Integer\
  \ qty = (Integer)rowInstance.getRowData().getColumnValue(\"QUANTITYORDERED\");\n\
  \            if(qty > 40) {\n                rowInstance.getStyle().setBackgroundColor(\"\
  green\");\n            }\n        } catch(Exception e) {\n            e.printStackTrace();\n\
  \        }\n    }\n}\n```\n\n处理器可以通过使用 `reportContext` 的 `setPersistentGlobalVariable()`\
  \ 方法共享数据。该方法在生成两个过程的报表时会将变量写入报表文档。考虑一个需要在页眉中显示最后一个订单的报表。项目演示了如何使用两个过程来生成和渲染报表。主页眉首先包含一个表达式为\
  \ `\"placeholder\"+pageNumber` 的动态元素。生成的报表为所有页产生 `placeholder1`、`placeholder2` 等。主页眉还包含一个数据项目。数据项目的\
  \ `onPageBreak` 事件处理器包含了列表 9-6 中的代码。此代码为每页添加一个数组项。当 `onPageBreak` 事件触发时，数据项目包含该页的最后一个值。数组列表使用\
  \ `setGlobalVariable` 方法保存到报表文档。\n\n### 列表 9-6 在生成阶段准备持久全局变量\n\n```java\npackage\
  \ my.event.handlers;\n\nimport org.eclipse.birt.report.engine.api.script.IReportContext;\n\
  import org.eclipse.birt.report.engine.api.script.eventadapter.DataItemAdapter;\n\
  import org.eclipse.birt.report.engine.api.script.instance.DataItemInstance;\nimport\
  \ java.util.*;\n\npublic class MyHeaderDataItem extends DataItemAdapter {\n    @Override\n\
  \    public void onPageBreak(DataItemInstance data, IReportContext reportContext)\
  \ {\n        ArrayList ar = (ArrayList)reportContext.getPersistentGlobalVariable(\"\
  MyArrayList\");\n        if(ar == null) {\n            ar = new ArrayList();\n \
  \       }\n        ar.add(\"Page Ends with: \" + data.getValue());\n        reportContext.setPersistentGlobalVariable(\"\
  MyArrayList\", ar);\n    }\n}\n```\n\n主页眉中动态文本元素的 `onRender` 事件处理器包含了列表 9-7 中的代码。\n\
  \n\n\n\n此代码首先通过检查动态文本项值中的占位符文本，来验证动态文本元素是否正确。使用 `getPersistentGlobalVariable` 方法从报告文档中检索由数据项生成的数组列表。通过获取动态文本项当前值中的页码，从数组列表中检索特定的页面字符串。\n\
  \n**列表 9-7** 在呈现阶段阶段使用持久化全局变量\n\n* *\n\n```java\npackage my.event.handlers;\n\n\
  import org.eclipse.birt.report.engine.api.script.IReportContext;\nimport org.eclipse.birt.report.engine.api.script.eventadapter.DynamicTextEventAdapter;\n\
  import org.eclipse.birt.report.engine.api.script.instance.IDynamicTextInstance;\n\
  import java.util.*;\n\npublic class MyCustomHeaderDynamicTextItem extends DynamicTextEventAdapter\
  \ {\n    @Override\n    public void onRender(IDynamicTextInstance text, IReportContext\
  \ reportContext) {\n        String cmp = \"nomatch\";\n        if(text.getText().length()\
  \ > 10 ){\n            cmp = text.getText().substring(0,10);\n        }\n      \
  \  if(cmp.compareToIgnoreCase(\"placeholde\") == 0 ){\n            ArrayList ar\
  \ = (ArrayList)reportContext.getPersistentGlobalVariable(\"MyArrayList\");\n   \
  \         if( ar == null ){\n                return;\n            }\n          \
  \  Integer ccount = Integer.parseInt(text.getText().substring(11))-1;\n        \
  \    text.setText((String)ar.get(ccount));\n        }\n    }\n}\n```\n\n该技术仅在生成和呈现在两个独立的过程中进行时有效。原因是，当使用两个进程时，主页中动态文本项的\
  \ `onRender` 事件在所有报告项的 `onCreate` 和 `onPageBreak` 事件之后才触发。当使用单个进程时，主页页眉中动态文本项的 `onRender`\
  \ 事件会在其 `onCreate` 事件后立即触发。\n\n### 调试 Java 事件处理器\n\n使用 Java 编写事件处理器的主要优势之一是可以使用\
  \ Eclipse 对代码进行调试。为了协助这一过程，BIRT 为调试器提供了一个 BIRT 报告启动配置。通过在 Java 视角视图（Java Perspective）中打开事件处理器类、设置适当的断点并选择“运行→打开调试对话框”，来对事件处理器进行调试。\n\
  \n在可用配置中选择 BIRT Report 并选择“启动配置”。从可用项目列表中选择包含该事件处理器的报告的项目，并选择“调试”以启动 Eclipse 的独立实例。\n\
  \n在新实例中，导航到包含对事件处理器引用的报告并选择“预览”。事件处理器中的任何断点都将触发。\n\n## 第 10 章。使用图表事件处理器\n\nBIRT\
  \ 支持一种专用于图表引擎（Chart Engine）的事件处理器模型。该模型与标准 BIRT 报告元素的模型相似，并同时支持 Java 和 JavaScript\
  \ 环境。本章提供了关于这两个环境的详细信息。当图表引擎独立于 BIRT 引擎或报告设计使用时，它也支持此事件模型。\n\n### 图表事件概述\n\n图表是数据的图形化表示。图表事件发生在图表绘制之前、期间或之后。表\
  \ 10-1 列出了图表事件处理器方法，并标识了这些方法的调用时机。\n\n**表 10-1** 图表事件处理器方法\n\n![image](img/09tab12.jpg)\n\
  \n![image](img/09tab12a.jpg)\n\n以下章节描述了如何基于 BIRT 图表引擎的事件处理器模型实现图表事件。\n\n### 理解图表脚本上下文\n\
  \nJava 和 JavaScript 的所有图表事件处理器方法都接收一个图表脚本上下文作为参数，这是一个 `ChartScriptContext` 对象。图表脚本上下文对象提供了对以下对象的访问：\n\
  \n• 图表实例 (Chart instance)\n• 区域 (Locale)\n• ULocale\n• 日志 (Logging)\n• 外部上下文 (External\
  \ context)\n\n表 10-2 列出了图表上下文对象的方法及其操作。\n\n**表 10-2** 图表脚本上下文方法\n\n![image](img/10tab02.jpg)\n\
  \n### 使用图表实例\n\n图表脚本上下文对象提供了对 Chart 实例对象的访问。图表实例上的方法包含访问图表属性的方法。\n\n##### 图表实例方法\n\
  \n图表脚本上下文对象提供了对 Chart 实例对象的访问。图表实例上的方法包含访问图表属性的方法。\n\n图表脚本上下文对象提供了对 Chart 实例对象的访问。图表实例上的方法包含访问图表属性的方法。\n\
  \n图表脚本上下文对象提供了对 Chart 实例对象的访问。图表实例上的方法包含访问图表属性的方法。\n\n图表脚本上下文对象提供了对 Chart 实例对象的访问。图表实例上的方法包含访问图表属性的方法。\n\
  \n#### getter 方法\n\n图表脚本上下文对象提供了对 Chart 实例对象的访问。图表实例上的方法包含访问图表属性的方法。\n\n图表实例的 getter\
  \ 方法提供了图表的当前值。表 10-3 列出了图表上下文的方法。\n\n**表 10-3** 图表实例 getter 方法\n\n![image](img/10tab03.jpg)\n\
  \n#### setter 方法\n\n图表脚本上下文对象提供了对 Chart 实例对象的访问。图表实例上的方法包含访问图表属性的方法。\n\n图表实例的 setter\
  \ 方法支持更改属性。表 10-4 列出了这些方法。\n\n**表 10-4** 图表实例 setter 方法\n\n![image](img/10tab04.jpg)\n\
  \n#### 杂项方法\n\n图表脚本上下文对象提供了对 Chart 实例对象的访问。图表实例上的方法包含访问图表属性的方法。\n\n在需要时使用图表实例的杂项方法。表\
  \ 10-5 列出了这些方法。\n\n**表 10-5** 图表实例杂项方法\n\n![image](img/10tab05.jpg)\n\n#### 在事件处理器中访问图表实例\n\
  \n大多数事件处理器使用图表上下文来访问 Chart 实例。\n\n```javascript\nfunction beforeGeneration( chart,\
  \ context ) {\n    chart.setUnitSpacing( 20 );\n}\nvar oldSpacing;\nfunction beforeDrawSeries(\
  \ series, seriesRenderer, context ) {\n    oldSpacing = context.getChartInstance().getUnitSpacing();\n\
  \    if ( series.getSeriesIdentifier() == \"series one\" ) {\n        context.getChartInstance().setUnitSpacing(\
  \ 70 );\n    }\n}\nfunction afterDrawSeries( series, seriesRenderer, context ) {\n\
  \    context.getChartInstance().setUnitSpacing( oldSpacing );\n}\n```\n\n### 理解外部上下文\n\
  \n当从报告运行时，图表引擎使用报告的 `reportContext` 对象来访问其外部上下文。要在 JavaScript 编写的图表事件处理器中获取外部上下文，使用\
  \ `context.getExternalContext().getScriptable()` 方法。在基于 Java 的事件处理器中，使用 `context.getExternalContext().getObject()`。\n\
  \n事件处理器可以访问外部对象的变量和方法。例如，使用 JavaScript 事件处理器将图表轴标题设置为报告参数（如列表 10-2 所示），或使用 Java\
  \ 事件处理器（如列表 10-3 所示）。\n\n**列表 10-2** 使用 JavaScript 事件处理器设置图表轴标题\n\n```javascript\n\
  function beforeDrawAxisTitle ( axis, title, context ) {\n    importPackage( Packages.org.eclipse.birt.chart.model.attribute\
  \ );\n    if ( axis.getType() == AxisType.LINEAR_LITERAL ) {\n        title.getCaption().setValue(\n\
  \            context.getExternalContext().getScriptable()\n            .getParameterValue(\
  \ \"chartTitle\" )\n        );\n    }\n}\n```\n\n\n\n\n\n# 列表 10-3 使用 Java 事件处理器设置图表轴标题\n\
  \n```java\npublic void beforeDrawAxisTitle( Axis axis, Label label,\n      IChartScriptContext\
  \ icsc )\n{\n   IReportContext rc = ( IReportContext )\n      icsc.getExternalContext(\
  \ ).getObject( );\n   String mytitle =\n      ( String )rc.getParameterValue( \"\
  chartTitle\" );\n   if ( axis.getType( ) == AxisType.TEXT_LITERAL ) {\n      label.getCaption().setValue(mytitle);\n\
  \   }\n}\n```\n\n## 理解图表事件的触发时机\n\n在 BIRT 环境中，图表引擎生成器按以下四个阶段处理图表：\n\n* 准备 (Prepare)\n\
  * 数据绑定 (Data binding)\n* 构建 (Build)\n* 渲染 (Render)\n\n这些阶段对应于 BIRT 图表引擎生成图表时调用的方法：\n\
  \n* `Generator.prepare()`\n* `Generator.bindData()`\n* `Generator.build()`\n* `Generator.render()`\n\
  \n后续章节描述了这些阶段，并提供了关于图表事件触发上下文的更多信息。\n\n### 准备阶段 (Prepare phase)\n\n准备阶段设置图表脚本上下文。所有图表事件处理器都使用此脚本上下文对象。此阶段将脚本环境的类加载器设置为与\
  \ BIRT 脚本环境使用的相同的类加载器。此阶段不会触发任何事件处理器。\n\n### 数据绑定阶段 (Data binding phase)\n\n数据绑定阶段准备与系列（series）相关的所有数据集，系列是在图表中绘制的一组值。此准备工作执行以下两个任务：\n\
  \n* 获取由动态数据集提供的数据值\n* 从系列定义对象创建一个或多个运行时系列（run-time series）\n\n图表引擎支持静态和动态数据。静态数据不需要数据绑定阶段，因为数据已经以所需的格式准备好。图表引擎还提供了扩展点以支持自定义数据集类型。\n\
  \n实现 `org.eclipse.birt.chart.model.data.DataSet` 接口的对象提供静态数据。对于每个数据类型，具有静态 `create`\
  \ 方法的实现类初始化运行时系列数据值。例如，以下代码为系列创建了一个静态的 `NumberDataSet`：\n\n```java\nNumberDataSet\
  \ seriesOneValues =\n    NumberDataSetImpl.create( new double[ ]{ 15, 23, 55, 76\
  \ }\n   );\n```\n\n动态数据的来源包括 BIRT 数据集和 `java.sqlResultSet` 对象。BIRT 使用系列定义对象来定义系列包含的动态数据。例如，`row[\"\
  month\"]` 使用 BIRT 数据集中的月份列填充系列。数据绑定阶段使用系列定义对象创建绑定到静态、类型化图表数据集的运行时系列。BIRT 支持在系列定义中使用动态数据定义分组和排序。当使用这些功能时，BIRT\
  \ 会根据需要创建额外的运行时系列，每个系列都有其自己的图表数据集。\n\n要获取某个系列的运行时系列，请调用系列定义对象的 `getRunTimeSeries()`\
  \ 方法。列表 10-4 获取一个运行时系列，并将第一个条形系列的凸起类型（riser type）设置为三角形。\n\n# 列表 10-4 获取运行时系列\n\n\
  ```javascript\nfunction beforeGeneration( chart, icsc )\n{\n   importPackage(\n\
  \      Packages.org.eclipse.birt.chart.model.attribute );\n   var xAxis = chart.getBaseAxes(\
  \ )[0];\n   var yAxis = chart.getOrthogonalAxes( xAxis, true )[0]\n   var seriesDef\
  \ = yAxis.getSeriesDefinitions( ).get( 0 )\n   var runSeries = seriesDef.getRunTimeSeries(\
  \ );\n   var firstRunSeries = runSeries.get( 0 );\n   firstRunSeries.setRiser( RiserType.TRIANGLE_LITERAL\
  \ );\n}\n```\n\n绑定阶段触发以下事件类型：\n\n* `beforeDataSetFilled`\n* `afterDataSetFilled`\n\
  \n#### 关于 beforeDataSetFilled 事件\n\n图表引擎在创建和填充运行时系列图表数据集之前，会调用 `beforeDataSetFilled`\
  \ 事件处理器。该事件处理器接收两个参数：一个 `IDataSetProcessor` 实现类和图表脚本上下文。\n\n`IDataSetProcessor`\
  \ 实现类必须包含一个 `populate` 方法，该方法用于创建静态图表数据集类型之一。`populate` 方法在在此事件触发后立即被调用。包含空方法的 `DataSetProcessorImpl`\
  \ 类是 `IDataSetProcessor` 的默认实现。使用图表扩展点扩展此接口，以提供自己的的数据集处理器，以便在 `before` 事件中添加调用。\n\
  \n#### 关于 afterDataSetFilled 事件\n\n图表引擎在创建和填充运行时系列图表数据集之后，会调用 `afterDataSetFilled`\
  \ 事件处理器。该事件处理器接收三个参数：图表脚本上下文、运行时系列以及填充后的静态类型化图表数据集。\n\n`series` 对象是正在创建的运行时系列类型的实现。该对象对于分类系列（category\
  \ series）是一个 `SeriesImpl` 对象，对于其他系列则是图表特定的类型。例如，在条形图中，系列实例是 `BarSeriesImpl` 对象。获取类类型以确定当前系列类型，如\
  \ 列表 10-5 所示。\n\n# 列表 10-5 类类型以确定系列\n\n```javascript\nfunction afterDataSetFilled(\
  \ series, dataSet )\n{\n   importPackage( java.io );\n   importPackage( org.eclipse.birt.chart.model.type.impl\
  \ );\n   if ( series.getClass( ) == LineImpl ) {\n      series.getLineAttributes(\
  \ ).setThickness( 5 );\n   }\n   if ( series.getClass( ) == BarImpl ) {\n      ...\n\
  \   }\n}\n```\n\n传递给方法的数据集是当前系列的图表数据集。在此处，图表数据集的值可以进行操作。例如，列表 10-6](#ch10.html_ch10ex06)\
  \ 将数据集中的空值和小于 24000 的值替换为 0。\n\n# 列表 10-6 替换数据集中的空值\n\n```javascript\nfunction afterDataSetFilled(\
  \ series, dataSet )\n{\n   var list = dataSet.getValues( );\n   for ( i=0; i<list.length;\
  \ i=i+1 ) {\n      if ( ( list[i] == null ) || ( list[i] < 24000 ) ) {\n       \
  \  list[i]= 0;\n      }\n   }\n}\n```\n\n### 构建阶段 (Build phase)\n\n不要将图表构建阶段与渲染期间发生的\
  \ BIRT 报告生成阶段混淆。图表构建阶段于图表模型绑定数据集以产生 `GeneratedChartState` 对象。该对象包含了渲染图表所需的大部分信息。图表由块（blocks）组成，块是图表中的矩形子区域，作为特定信息的容器。图表模型包含以下块：\n\
  \n* 包含所有其他块的最外块\n* 图表标题的标题块\n* 用于渲染系列和任何轴的绘制块\n* 用于显示图例的图例块\n\n构建阶段计算以下值：\n\n* 所有块的边界\n\
  * 轴的最小值、最大值和比例\n\n构建阶段执行以下任务：\n\n* 初始化所有系列渲染器\n* 为图例、每个运行时系列以及系列中的数据点创建渲染提示\n* 将所有计算结果存储在图表模型的\
  \ `GeneratedChartState` 对象中\n\n构建阶段触发以下脚本事件：\n\n* `beforeGeneration`\n* `afterGeneration`\n\
  \n#### 关于 beforeGeneration 事件\n\n\n\n\n\n图表引擎（Chart Engine）在完成数据绑定阶段后会调用 `beforeGeneration`\
  \ 事件处理器。该事件处理器接收两个参数：绑定阶段绑定数据的图表模型以及图表脚本上下文（Chart script context）。\n\n图表模型是 `ChartWithAxesImpl`\
  \ 或 `ChartWithoutAxesImpl` 子类的实例。要实现 Java 事件处理器，可能需要强制转换为图表接口的具体实现类。你可以通过获取图表的类来确定图表类型。例如，要为饼图编写\
  \ `beforeGeneration` 事件处理器，以使包含大值的切片发生分离（explode），可以使用与 Listing 10-7 中示例类似的脚本。该示例显示了嵌套在第二级系列定义下的饼图值系列。分类系列则嵌套在顶层系列定义之下。\n\
  \n**Listing 10-7** 修改饼图切片属性\n\n```javascript\nfunction beforeGeneration( chart,\
  \ icsc )\n{\n   importPackage( Packages.org.eclipse.birt.chart.model.impl );\n \
  \  importPackage(\n      Packages.org.eclipse.birt.chart.model.type.impl );\n  \
  \ if ( chart.getClass( ) == ChartWithAxesImpl ) {\n      //Do something if a line\
  \ chart...\n   }\n   if ( chart.getClass( ) == ChartWithoutAxesImpl ) {\n      seriesDef\
  \ = chart.getSeriesDefinitions( ).get( 0 );\n      catRunSeries = seriesDef.getRunTimeSeries(\
  \ );\n      // 饼图使用嵌套的系列定义处理值系列\n      valSeriesDef = seriesDef.getSeriesDefinitions(\
  \ ).get( 0 );\n      valRunSeries = valSeriesDef.getRunTimeSeries( ).get( 0 );\n\
  \      if ( valRunSeries.getClass( ) == PieSeriesImpl ) {\n          valRunSeries.setExplosion(\
  \ 10 );\n          valRunSeries.setExplosionExpression(\"valueData > 15000\");\n\
  \      }\n   }\n}\n```\n\n### 关于 afterGeneration 事件\n\n图表引擎在处理所有计算之后、进入渲染阶段之前调用\
  \ `afterGeneration` 事件处理器。该事件处理器接收两个参数：`GeneratedChartState` 对象和图表脚本上下文可以使用 `GeneratedChartState`\
  \ 对象检索图表模型来对图表进行修改。例如，Listing 10-8 为绘图区域添加了蓝色边框。\n\n**Listing 10-8** 设置绘图区域属性\n\n\
  ```javascript\nfunction afterGeneration( gcs, icsc )\n{\n   importPackage(\n   \
  \   Packages.org.eclipse.birt.chart.model.attribute );\n   importPackage(\n    \
  \  Packages.org.eclipse.birt.chart.model.attribute.impl );\n   var outline = gcs.getChartModel(\
  \ ).getPlot( ).getOutline( );\n   outline.setColor( ColorDefinitionImpl.BLUE( )\
  \ );\n   outline.setStyle( LineStyle.SOLID_LITERAL );\n   outline.setVisible( true\
  \ );\n}\n```\n\n### 渲染阶段\n\n渲染阶段获取 `GeneratedChartState` 对象并渲染图表。该阶段还设置了图表的交互性。渲染阶段使用以下主要的对象类型来渲染图表：\n\
  \n- 设备渲染器（Device renderer）\n- 显示服务器（Display server）\n- 模型渲染器（Model renderers）\n\n\
  设备渲染器对象实现了 `IDeviceRenderer` 接口，该接口提供了绘制原始图形的方法，如 `drawPolygon`、`drawRectangle`、`drawText`\
  \ 和 `fillArc`。图表引擎为标准小部件工具 (SWT) 和 Swing 设备渲染器。BMP、JPEG、PDF、PNG 和 SVG 格式的设备渲染器扩展了\
  \ Swing 渲染器。图表引擎提供了一个扩展点来扩展此列表。\n\n显示服务器为设备渲染器提供通用服务，例如获取每点（DPI）分辨率和提供文本度量。显示服务器实现了\
  \ `IDisplayServer` 接口。图表引擎提供了 SWT 和 Swing 的实现。\n\n显示服务器根据渲染器的 Eclipse 扩展点项链接到特定的设备渲染器。目前，所有与\
  \ Swing 相关的渲染器都使用 Swing 显示服务器， SWT 设备渲染器使用 SWT 显示服务器。图表引擎提供了一个扩展点来扩展显示服务器列表。\n\n\
  模型渲染器渲染特定的系列，并使用设备渲染器渲染构成图表系列数据点的实际原始图形元素。所有图表系列渲染器都继承自 `BaseRenderer` 或 `AxesRenderer`\
  \ 抽象类，并实现 `ISeriesRenderer` 接口，该接口提供了 Table 10-6 中列出的。\n\n**Table 10-6** ISeriesRenderer\
  \ 方法\n\n![image](img/10tab06.jpg)\n\nTable 10-7 列出了特定于系列的渲染器。图表引擎提供了一个扩展点来扩展此列表。\n\
  \n**Table 10-7** 特定于系列的渲染器\n\n![image](img/10tab07.jpg)\n\n渲染阶段循环并渲染图表的所有运行时系列。在\
  \ Listing 10-9 中，伪代码显示了渲染事件的顺序。轴渲染代码适用于包含轴的图表类型。\n\n**Listing 10-9** 说明渲染操作顺序的伪代码\n\
  \n```\nLoop all renderers\n  Main block - 仅针对第一个系列\n  Title block - 仅针对第一个系列\n \
  \ Plot block\n  Render Background - 仅针对第一个系列\n  Render structure - 仅针对第一个系列\n  Render\
  \ Series - 特定于系列（如折线图或柱状图）\n  Render Axis labels - 仅针对最后一个系列\n  Render Legend（调用特定渲染器图形）-\
  \ 仅针对最后一个系列\nLoop\n```\n\n### 渲染阶段事件\n\n大部分图表事件在渲染阶段触发。某些事件特定于特定的图表，不会对所有渲染器调用。在\
  \ Listing 10-10 中，伪代码扩展了 Listing 10-9 的代码以显示大多数事件的触发。顺序取决于特定的系列渲染器。本章未尝试详细描述每个事件。脚本中使用的常用对象所示。\n\
  \n**Listing 10-10** 显示渲染事件触发顺序的伪代码\n\n```\nbeforeRendering\n  Loop all run-time\
  \ series\n    If first series\n      beforeDrawBlock - Main block\n      afterDrawBlock\
  \ - Main block\n      beforeDrawBlock - Title block\n      afterDrawBlock - Title\
  \ block\n      beforeDrawBlock - Plot block\n        Loop all marker ranges\n  \
  \        beforeDrawMarkerRange\n          afterDrawMarkerRange\n        End Loop\n\
  \        Loop all marker lines\n          beforeDrawMarkerLine\n          afterDrawMarkerLine\n\
  \        End Loop\n      beforeDrawSeries - Category series\n      afterDrawSeries\
  \ - Category series\n      afterDrawBlock - Plot block\n    End If\n    beforeDrawBlock\
  \ - Plot block\n    beforeDrawSeries - 特定于系列\n    Loop all data points - 特定于系列\n\
  \      beforeDrawDataPoint\n      afterDrawDataPoint\n    End Loop\n    Loop all\
  \ data point labels - 特定于系列\n      beforeDrawDataPointLabel\n      afterDrawDataPointLabel\n\
  \    End Loop\n    beforeDrawCurve\n    afterDrawCurve\n    afterDrawSeries\n  \
  \  If last series and chart contains axes\n      Loop each axis\n        beforeDrawAxisLabel\n\
  \        afterDrawAxisLabel\n      End Loop\n      beforeDrawAxisTitle\n      afterDrawAxisTitle\n\
  \    End If\n  afterRender\n```\n\n\n\n\n图表由块组成。这些块是矩形子区域，包含图表的子组件。例如，`plot` 块包含数据点的渲染，而\
  \ `title` 块包含图表标题。`beforeDrawBlock` 事件在渲染每个块之前触发。使用此事件处理程序可以在图表渲染之前修改块的属性。\n\n`beforeDrawBlock`\
  \ 和 `afterDrawBlock` 事件在 `Main`、`Title` 和 `Legend` 块上各触发一次，在 `Plot` 块上触发多次。这两个事件都接收两个参数：一个\
  \ `BlockImpl` 对象和 Chart script context（图表脚本上下文）。\n\n`block` 类提供了方法，用于确定哪个块触发了事件。两个事件处理器都支持对块进行操作，例如通过使用块的方法和属性设置锚点、背景填充颜色或轮廓。代码列表\
  \ 10-11 演示了如何为图例块中的图例设置锚点。\n\n**代码列表 10-11** 为图例块中的图例设置锚点\n\n* * *\n\n```javascript\n\
  function beforeDrawBlock( block, icsc )\n{\n   importPackage(\n      Packages.org.eclipse.birt.chart.model.attribute.impl\
  \ );\n   importPackage(\n      Packages.org.eclipse.birt.chart.model.attribute );\n\
  \   if ( block.isLegend( ) ) {\n      block.getOutline( ).setVisible( true );\n\
  \      block.getOutline( ).getColor( ).set( 21,244,231 );\n      block.setBackground(\
  \ ColorDefinitionImpl.YELLOW( ) );\n      block.setAnchor( Anchor.NORTH_LITERAL\
  \ );\n   }\n   else if ( block.isPlot( ) ) {\n      ...\n   }\n   else if ( block.isTitle(\
  \ ) ) {\n      ...\n   }\n   else if ( block.isCustom( ) ) {\n      // Main Block\n\
  \      ...\n   }\n}\n```\n\n### 渲染系列\n\n`beforeDrawSeries` 和 `afterDrawSeries` 事件会在图表中的每个运行时系列上触发一次。这些事件的事件处理器接收一个\
  \ `Series` 对象、一个 `ISeriesRenderer` 对象和 Chart script context 作为参数。\n\n要修改系列，请使用 `beforeDrawSeries`\
  \ 事件的处理程序。在 代码列表 10-12 中，事件处理程序将系列标识 `SalesBalance` 的可见性设置为 `false`，因此该系列不会在图表中渲染。\n\
  \n**代码列表 10-12** 使用 `beforeDrawSeries` 事件在图表设置设置可见性\n\n* * *\n\n```javascript\n\
  function beforeDrawSeries( series, seriesRenderer, context )\n{\n   if ( series.getSeriesIdentifier()\
  \ == \"SalesBalance\" )\n   {\n      series.setVisible( false );\n   }\n}\n```\n\
  \n### 渲染数据点和数据点标签\n\n`beforeDrawDataPoint`、`afterDrawDataPoint`、`beforeDrawDataPointLabel`\
  \ 和 `afterDrawDataPointLabel` 事件会在每个运行时系列值上触发一次。\n\n所有这些事件的事件处理器都接收一个 `DataPointHints`\
  \ 对象和 Chart script context 作为参数。构建阶段为每个运行时系列值创建一个 `DataPointHints` 对象。系列渲染器使用该对象的数据来渲染此对象。所有这些事件处理器都支持使用该对象的方法访问并（对于某些属性）操作\
  \ `DataPointHints` 对象。使用 `DataPointHints` 属性值可以在渲染数据点之前检查或修改图表。例如，代码列表 10-13 中的脚本打印了二维柱状图中运行时系列中每个值在绘图边界内的\
  \ `x-` 和 `y-` 位置、类别值和系列值，以及该运行时系列中每个值对应的柱状图的大小。\n\n**代码列表 10-13** 在二维柱状图中显示 `x-`\
  \ 和 `y-` 位置\n\n* * *\n\n```javascript\nfunction beforeDrawDataPoint( dph, fill,\
  \ icsc )\n{\n   importPackage( Packages.java.io );\n   out = new PrintWriter( new\
  \ FileWriter(\n      \"C:/data/datapoints.txt\", true ) );\n   out.println(\n  \
  \    \"BaseValue X-Axis Value \" + dph.getBaseValue( ) );\n   out.println(\n   \
  \   \"Orthogonal Y-Axis Value \" + dph.getOrthogonalValue( ) );\n   out.println(\
  \ \" X location \" + dph.getLocation( ).getX( ) );\n   out.println( \" Y Location\
  \ \"  + dph.getLocation( ).getY( ) );\n   out.println( \" Size \" + dph.getSize(\
  \ ) );\n   out.close( );\n}\n```\n\n`beforeDrawDatapoint` 和 `afterDrawDatapoint`\
  \ 事件处理器接收两个额外的参数：一个 `Fill` 对象和 Chart script context。`Fill` 的子类支持为数据点显示纯色、渐变色、图案或图像。例如，使用实现\
  \ `Fill` 接口的 `ColorDefinitionImpl` 类的实例，可以为数据点设置纯色。\n\n这些事件在图表渲染数据点之前和之后触发。使用这些事件可以修改数据点的渲染方式。在\
  \ 代码列表 10-14 中，事件处理器渲染了一个具有正负柱状的柱状图，并将负柱体涂为红色。`beforeDrawDataPoint` 事件处理器获取值并判断柱体是否为负值。如果柱体为负值，则事件处理器会保存当前的填充颜色。`afterDrawDataPoint`\
  \ 使用这些设置来恢复颜色，将柱体颜色设回红色。\n\n**代码列表 10-14** 渲染带有正负柱体的柱状图\n\n* * *\n\n```javascript\n\
  previousFill = null;\nfunction beforeDrawDataPoint( dph, fill, icsc )\n{\n   val\
  \ = dph.getOrthogonalValue( );\n   if ( val < 0 ){\n      previousFill = new Object(\
  \ );\n      previousFill.r = fill.getRed( );\n      previousFill.g = fill.getGreen(\
  \ );\n      previousFill.b = fill.getBlue( );\n      fill.set( 255, 0, 0 );\n  \
  \ }\n   else{\n      previousFill = null;\n   }\n}\nfunction afterDrawDataPoint(\
  \ dph, fill, icsc )\n{\n   if ( previousFill != null ){\n      fill.set( previousFill.r,\
  \ previousFill.g, previousFill.b );\n   }\n}\n```\n\n`beforeDrawPointLabel` 和 `afterDrawPointLabel`\
  \ 事件处理器接收一个额外的参数：一个 `Label` 对象和 Chart script context。`Label` 对象是 `Label` 类的实例，并提供了许多修改标签的方法。例如，修改标签标题或颜色。代码列表\
  \ 10-15 演示了如何更改标签的外观。\n\n**代码列表 10-15** 更改标签值\n\n* * *\n\n```javascript\nfunction\
  \ beforeDrawPointLabel( dph, label, icsc )\n{\n   value = dph.getOrthogonalValue(\
  \ ) .doubleValue( );\n   if ( value >= 0 ) && ( value < 500 ) {\n      label.getCaption(\
  \ ).getColor( ).set( 32,168,255 );\n      label.getCaption( ).getFont().setItalic(\
  \ true );\n      label.getCaption( ).getFont().setRotation( 5 );\n      label.getCaption(\
  \ ).getFont().setrikethrough( true );\n      label.getCaption( ).getFont().setSize(\
  \ 22 );\n      label.getCaption( ).getFont().setName( \"Arial\" );\n      label.getOutline(\
  \ ).setVisible( true );\n      label.getOutline( ).setThickness( 3 );\n   }\n  \
  \ else if ( value >= 500 ) {\n      label.getCaption( ).getFont().setRotation( 5\
  \ );\n      label.getOutline( ).setVisible( true );\n   }\n   else if ( value <\
  \ 0 ) {\n      label.getCaption( ).getColor( ).set( 0,208,32 );\n   }\n}\n```\n\n\
  #### 渲染轴\n\n`beforeDrawAxisLabel`、`afterDrawAxisLabel`、`beforeDrawAxisTitle`、`afterDrawAxisTitle`、`beforeDrawMarkerLine`、`afterDrawMarkerLine`、`beforeDrawMarkerRange`\
  \ 和 `afterDrawMarkerRange` 事件会在带有轴的每个轴上至少触发一次。\n\n所有这些事件的事件处理器接收两个参数：一个 `axis` 对象和\
  \ Chart script context。`axis` 对象是 `AxisImpl` 类的实例，并提供了许多可在脚本环境中使用的方法和属性。这些功能支持诸如获取与轴相关的运行时系列以及设置最小值、最大值和刻度值的操作。\n\
  \n要操作轴对象，首先通过获取轴类型或轴标题标题来确定它是哪个轴，如 代码列表 10-16 所示。示例中的 `getType()` 方法返回以下值之一：\n\n\
  • `DATE_TIME_LITERAL`\n\n• `LINEAR_LITERAL`\n\n• `LOGARITHMIC_LITERAL`\n\n• `TEXT_LITERAL`\n\
  \n\n\n\n如果图表具有多个 `y` 轴且它们都属于特定类型（例如 `LINEAR_LITERAL`），请使用轴标题来确定当前轴。标题不需要可见，但值必须存在。\n\
  \n使用 `beforeDrawAxisTitle` 和 `beforeDrawAxisLabel` 事件分别修改轴标题和标签元素。Listing 10-16\
  \ 显示了如何通过检查轴标题说明和轴类型来修改标题颜色。\n\n**列表 10-16** 检查轴类型以修改标题颜色\n\n* * *\n\n```\nfunction\
  \ beforeDrawAxisTitle( axis, label, icsc )\n{\n   importPackage(\n      Packages.org.eclipse.birt.chart.model.attribute.impl\
  \ );\n   importPackage(\n      Packages.org.eclipse.birt.chart.model.attribute );\n\
  \   if ( axis.getTitle( ).getCaption( ).getValue( ) ==\n      \"myYaxisTitle\" )\
  \ {\n      label.getCaption( ).setColor( ColorDefinitionImpl.BLUE( ) );\n   }\n\
  \   if ( axis.getType( ) == AxisType.DATE_TIME_LITERAL ) {\n      label.getCaption(\
  \ ).setColor( ColorDefinitionImpl.RED( ) );\n   }\n}\n```\n\n`beforeDrawAxisLabel`\
  \ 事件会在图表轴上渲染每个标签时触发。为此事件提供一个事件处理器以修改标签。在 Listing 10-17 中，修改后的标签提供了缩短的数字格式，使图表更具读性。\n\
  \n**列表 10-17** 在 beforeDrawAxisLabel 事件中修改标签\n\n* * *\n\n```\nfunction beforeDrawAxisLabel(\
  \ axis, label, context )\n{\n   value = label.getCaption( ).getValue( );\n   if\
  \ ( value >= 1000 && value < 1000000 )\n       value = value/1000 + \"k\";\n   else\
  \ if ( value >= 1000000 )\n      value = value/1000000 + \"M\";\n   label.getCaption(\
  \ ).setValue( value );\n}\n```\n\n当 `beforeDrawAxisXXX` 事件触发时，轴线和网格已经渲染，因此，要修改轴的基本属性，请在更早的事件中进行这些更改。Listing\
  \ 10-18 显示了如何使用这种方法修改轴。该代码获取所有轴并检查 `x` 轴是否为日期时间轴。验证后，代码指定了轴标签的格式。\n\n**列表 10-18**\
  \ 获取轴以修改轴属性\n\n* * *\n\n```\nfunction beforeGeneration( chart, icsc )\n{\n   importPackage(\n\
  \      Packages.org.eclipse.birt.chart.model.attribute.impl );\n   importPackage(\n\
  \      Packages.org.eclipse.birt.chart.model.attribute );\n   // The chart 模型仅支持一个基础轴\n\
  \   xAxis = chart.getBaseAxes( )[ 0 ];\n   yAxis = chart.getOrthogonalAxes( xAxis,\
  \ true )[ 0 ];\n   yAxisNumber2 = chart.getOrthogonalAxes( xAxis, true )[ 1 ];\n\
  \   if ( yAxis.getType( ) == AxisType.DATE_TIME_LITERAL ) {\n      xAxis.setFormatSpecifier(\n\
  \         JavaDateFormatSpecifierImpl.create( \"MM/dd/yyyy\" ) );\n   }\n}\n```\n\
  \n### 渲染图例项\n\n在图例渲染期间，`beforeDrawLegendItem` 和 `afterDrawLegendItem` 事件每个图例条目触发一次。事件处理器接收三个参数：`LegendEntryRenderingHints`\
  \ 类的实例、`BoundsImpl` 类的实例以及图表脚本上下文。\n\n`LegendEntryRenderingHints` 对象包含以下项目：\n- 数据索引，正在渲染的项的索引\n\
  - 一个 `Fill` 对象，定义填充图例项图形的颜色、图像或图案\n- 一个 `Label` 对象，`LabelImpl` 类的实例，代表图例项的标签\n-\
  \ 一个值标签，`LabelImpl` 类的实例，用于在按值着色且勾选了“显示值”复选框时\n\n`BoundsImpl` 对象包含图例项图形的顶部、左、宽度和高度值。如果您更改了这些值，请小心避免让图例项边界比图例块更宽或更高。Listing\
  \ 10-19 显示了如何对图例项标签和图形大小进行修改。在 `afterDrawLegendItem` 函数中进行这些更改没有效果，因为该项已经渲染。\n\n\
  **列表 10-19** 修改图例项标签\n\n* * *\n\n```\nfunction beforeDrawLegendItem( lerh, bounds,\
  \ icsc )\n{\n   importPackage(\n      Packages.org.eclipse.birt.chart.model.attribute.impl\
  \ );\n   label = lerh.getLabel( );\n   labelString = label.getCaption( ).getValue(\
  \ );\n   if ( labelString == \"true\" ) {\n      label.getCaption( ).getColor( ).set(\
  \ 32, 168, 255 );\n      label.getCaption( ).getFont( ).setItalic( true );\n   \
  \   label.getCaption( ).getFont( ).setRotation( 5 );\n      label.getCaption( ).getFont(\
  \ ).setRotation( true );\n   }\n}\n```\n\n### 编写 Java 事件处理器\n\n以与任何项目相同的方式编写 Java\
  \ 事件处理器。唯一的区别是事件处理器必须包含所有事件处理器。\n\n#### 设置图表事件项目\n\n创建一个 Java 事件处理器项目需要以下 JAR 文件：\n\
  - `chartengine.jar`\n- `org.eclipse.emf.ecore.jar`\n- `org.eclipse.emf.common.jar`\n\
  - 可选的 `scriptapi.jar`，用于访问 reportContext\n- 可选的 `com.ibm.icu.jar`，用于使用 ULocale 方法\n\
  \n为图实现 `EventHandler` 接口或扩展 `EventHandlerAdapter`。\n\n要将 Java 事件处理器应用于图表，请在报告设计中选择图表。在属性中，选择事件属性并输入完全类名，或选择浏览查找类。浏览器仅显示工作区或类路径中实现\
  \ `EventHandler` 或扩展 `EventHandlerAdapter` 的类。\n\n以与其他事件处理器相同的方式调试 Java 事件处理器。\n\
  \n### Java 事件处理器示例\n\n本节提供了 Java 事件处理器的常用示例。\n\nListing 10-20 中的代码使用 `beforeDrawBlock`\
  \ 事件处理器将图例块轮廓设为红色，将绘图块设为绿色，并将标题块的背景色设置为奶油色，轮廓设为蓝色。\n\n**列表 10-20** 设置轮廓和背景颜色\n\n\
  * * *\n\n```\npackage my.chart.events;\n\nimport org.eclipse.birt.chart.script.EventHandlerAdapter;\n\
  import org.eclipse.birt.chart.model.layout.Block;\nimport org.eclipse.birt.chart.script.IChartScriptContext;\n\
  import org.eclipse.birt.chart.model.attribute.impl\n.ColorDefinitionImpl;\n\npublic\
  \ class BlockScript extends EventHandlerAdapter\n{\n   public void beforeDrawBlock(\
  \ Block block,\n      IChartScriptContext icsc )\n   {\n      if ( block.isLegend(\
  \ ) ) {\n         block.getOutline( ).setVisible( true );\n         block.getOutline(\
  \ ).getColor( ).set( 255, 0, 0 );\n      }\n      else if ( block.isPlot( ) ) {\n\
  \         block.getOutline( ).setVisible( true );\n      }\n   }\n}\n```\n\n\n\n\
  \n\n```java\nblock.getOutline( ).getColor( ).set( 0, 255, 0 );\n}\nelse if ( block.isTitle(\
  \ ) ) {\n    block.getOutline( ).setVisible( true );\n    block.setBackground( ColorDefinitionImpl.CREAM(\
  \ ) );\n    block.getOutline( ).getColor( ).set( 0, 0, 255 );\n}\n}\n``` 列表 10-21\
  \ 使用 `beforeDrawSeries` 事件处理器将系列标签设置为红色，并对系列应用了曲线拟合线。如果该系列是折线系列，代码会将标记类型更改为三角形。\n\
  \n**列表 10-21** 设置系列标签颜色并应用曲线拟合线\n\n* * *\n\n```java\npackage my.chart.events;\n\n\
  import org.eclipse.birt.chart.script.ChartEventHandlerAdapter;\nimport org.eclipse.birt.chart.model.component.Series;\n\
  import org.eclipse.birt.chart.script.IChartScriptContext;\nimport org.eclipse.birt.chart.render.ISeriesRenderer;\n\
  import org.eclipse.birt.chart.model.type.LineSeries;\nimport org.eclipse.birt.chart.model.attribute.Marker;\n\
  import org.eclipse.birt.chart.model.attribute.MarkerType;\nimport org.eclipse.birt.chart.model.component.impl.CurveFittingImpl;\n\
  \npublic class SeriesScript extends ChartEventHandlerAdapter\n{\n    public void\
  \ beforeDrawSeries( Series series, ISeriesRenderer isr, IChartScriptContext icsc\
  \ )\n    {\n        if( series instanceof LineSeries ) {\n            Marker mk\
  \ = ( ( Marker )( ( LineSeries )series ).getMarkers( ).get( 0 ) );\n           \
  \ mk.setType( MarkerType.TRIANGLE_LITERAL );\n        }\n        series.setCurveFitting(\
  \ CurveFittingImpl.create( ) );\n        series.getLabel().getCaption().getColor().set(\
  \ 255, 0, 0 );\n    }\n}\n```\n\n在 列表 10-22 中，代码为 `beforeGeneration` 事件和 `beforeDrawSeries`\
  \ 事件创建了事件处理器。`beforeGeneration` 事件处理器将绘图背景颜色设置为灰色。如果图表具有轴，则事件处理器将 `x`轴标签的角度设置为 45\
  \ 度，并将标签放置在轴下方。该事件处理器还使 `y` 轴的主网格线可见。`beforeDrawSeries` 事件处理器为系列添加了鼠标悬停事件，以显示当前数据点的值。\n\
  \n**列表 10-22** `beforeGeneration` 和 `beforeDrawSeries` 事件处理器\n\n* * *\n\n```java\n\
  package my.chart.events;\n\nimport org.eclipse.birt.chart.script.ChartEventHandlerAdapter;\n\
  import org.eclipse.birt.chart.model.Chart;\nimport org.eclipse.birt.chart.script.IChartScriptContext;\n\
  import org.eclipse.birt.chart.model.attribute.impl.ColorDefinitionImpl;\nimport\
  \ org.eclipse.birt.chart.model.impl.ChartWithAxesImpl;\nimport org.eclipse.birt.chart.model.component.Axis;\n\
  import org.eclipse.birt.chart.model.attribute.Position;\nimport org.eclipse.birt.chart.model.component.Series;\n\
  import org.eclipse.birt.chart.model.attribute.TooltipValue;\nimport org.eclipse.birt.chart.model.attribute.impl.TooltipValueImpl;\n\
  import org.eclipse.birt.chart.model.data.Action;\nimport org.eclipse.birt.chart.model.data.impl.ActionImpl;\n\
  import org.eclipse.birt.chart.model.attribute.ActionType;\nimport org.eclipse.birt.chart.model.data.impl.TriggerImpl;\n\
  import org.eclipse.birt.chart.model.attribute.TriggerCondition;\n\npublic class\
  \ ChartModScript extends ChartEventHandlerAdapter\n{\n    public void beforeGeneration(\
  \ Chart cm, IChartScriptContext icsc )\n    {\n        cm.getPlot( ).getClientArea(\
  \ ).setBackground( ColorDefinitionImpl.GREY( ) );\n        if ( cm instanceof ChartWithAxesImpl\
  \ ) {\n            // x 轴\n            Axis xaxis = ( ( ChartWithAxesImpl ) cm ).getPrimaryBaseAxes(\
  \ )[ 0 ];\n            xaxis.setLabelPosition( Position.BELOW_LITERAL );\n     \
  \       xaxis.getLabel( ).getCaption( ).getFont( ).setRotation( 45 );\n        \
  \    Axis yaxis = ( ( ChartWithAxesImpl ) cm ).getPrimaryOrthogonalAxis( xaxis );\n\
  \            yaxis.getMajorGrid( ).getLineAttributes( ).setVisible( true );\n  \
  \      }\n    }\n\n    public void beforeDrawSeries( Series series, ISeriesRenderer\
  \ isr, IChartScriptContext icsc )\n    {\n        TooltipValue tt = TooltipValueImpl.create(\
  \ 500, null );\n        Action ac = ActionImpl.create( ActionType.SHOW_TOOLTIP_LITERAL,\
  \ tt );\n        series.getTriggers( ).add( TriggerImpl.create( TriggerCondition.ONMOUSEOVER_LITERAL,\
  \ ac ) );\n    }\n}\n```\n\n### 编写 JavaScript 图表事件处理器\n\n编写 JavaScript 图表事件处理器的过程与其他报表项目的\
  \ JavaScript 事件处理器编写过程不同。在 BIRT Report Designer 中，脚本（Script）在图表的 JavaScript 事件列表中仅显示\
  \ `onRender` 事件。图 10-1 显示了图表项目的 JavaScript 事件列表。\n\n**图 10-1** BIRT Report Designer\
  \ 中的图表 JavaScript 事件\n\n![image](img/10fig1.jpg)\n\n当你选择列表中的一个事件时，BIRT 会脚本窗口中添加该事件的存根（stub），如图\
  \ 10-2 所示。\n\n**图 10-2** 事件存根\n\n![image](img/10fig2.jpg)\n\n### 使用简化版 API\n\nBIRT\
  \ 提供了一种用于操作图表属性的简化 API。在早期版本中，访问图模型并不直观，且图模型与报表模型之间的差异导致了混淆。简化 API 整合了模型。列表 10-23\
  \ 显示了早期版本如何按类别设置颜色。\n\n**列表 10-23** 早期版本的颜色设置\n\n* * *\n\n```javascript\npublic\
  \ void beforeGeneration( Chart cm, IChartScriptContext icsc )\n{\n    cm.getLegend(\
  \ ).setItemType(LegendType.CATEGORIES_LITERAL);\n}\n```\n\n列表 10-24 显示了如何在命名为 Chart1\
  \ 的图表的事件处理器中使用简化版 API 实现相同的功能。\n\n**列表 10-24** 使用简化版 API\n\n* * *\n\n```javascript\n\
  var chart1 = this.getReportElement( \"Chart1\" )\nchart1.setColorByCategory( true\
  \ );\n```\n\n### 获取图表实例\n\n简化版 API 的核心是 `IChart` 接口。与其他报表项目接口一样，`IChart` 继承自 `IReportItem`。由于图项目较为复杂，`IChart`\
  \ 接口位于不同的包，并且比其他报表项目接口具有更多方法。使用 `getReportElement( )` 方法传入图元素的名称即可获取 `IChart` 实例。\n\
  \n在 Java 设计 Engine API 或开发 Java 事件处理器时，使用以下代码获取 `IChart` 对象：\n\n```java\nIChart\
  \ chart = (IChart)rptdesign.getReportElement( \"Chart name\" );\n```\n\n#### 理解\
  \ IChart 的子接口\n\n`IChart` 有两个子接口：\n\n- `IChartWithAxes`\n- `IChartWithoutAxes`\n\
  \n`IChartWithoutAxes` 为 `IChart` 增加了一个方法。`IChartWithAxes` 则增加了多个方法。\n\n\n\n\n\n\
  ```javascript\nIChartWithAxes chart = ( IChartWithAxes )\nrptdesign.getReportElement(\"\
  Name of an Axis-containing Chart\");\n```\n\n表 10-8 列出了 `IChart` 接口的方法。\n\n**表 10-8**\
  \ `IChart` 方法\n\n![image](img/10tab08.jpg)\n\n表 10-9 列出了 `IChartWithAxes` 接口的方法。\n\
  \n**表 10-9** `IChartWithAxes` 方法\n\n![image](img/10tab09.jpg)\n\n表 10-10 描述了 `IChartWithoutAxes`\
  \ 接口的方法。\n\n**表 10-10** `IChartWithoutAxes` 方法\n\n![image](img/10tab10.jpg)\n\n\
  该 API 最典型的用法是在 `beforeFactory` 事件处理程序中，Report 引擎在生成报告之前调用该处理程序。此事件处理程序还支持修改报告的设计。代码列表\
  \ 10-25 使用报告的 `beforeFactory` 事件处理程序中的脚本来定位名为 `Chart1` 的图表，将图标题设置为字符串 `My New Title`，并用红色渲染标题。\n\
  \n**代码列表 10-25** 使用 `beforeFactory` 事件处理程序\n\n```javascript\nvar chart1 = this.getReportElement(\
  \ \"Chart1\" );\nvar color1 = chart1.getTitle().getCaption().getColor();\nchart1.setColorByCategory(\
  \ true );\nchart1.getTitle().getCaption().setValue( \"My New Title\" );\ncolor1.setRed(\
  \ 255 );\ncolor1.setGreen( 0 );\ncolor1.setBlue( 0 );\nchart1.getTitle( ).getCaption(\
  \ ).setColor( color1 );\n```\n\n在脚本中添加以下行可以将图表更改三维图表：\n\n```javascript\nchart1.setDimension(\
  \ \"ThreeDimensional\" );\n```\n\n以下行脚本将图表的输出类型设置为 PNG：\n\n```javascript\nchart1.setOutputType(\
  \ \"PNG\" );\n```\n\n由于 `IChart` 扩展了 `ReportItem`，你可以使用 `setWidth()` 和 `setHeight()`\
  \ 方法设置图表尺寸。例如，要将宽度和高度设置为六英寸，可以使用以下脚本：\n\n```javascript\nchart1.setWidth( \"6in\"\
  \ );\nchart1.setHeight(\"6in\");\n```\n\n## 第 11 章 使用脚本访问数据\n\nBIRT 支持使用 JavaScript\
  \ 代码访问数据。这种数据源被称为脚本数据源。使用脚本数据源，你可以访问内置数据源类型以外的对象。\n\n由于访问和管理脚本数据源的 JavaScript 代码可以封装\
  \ Java 对象，因此脚本数据源可以访问 EJB、XML 流、Hibernate 对象或任何检索数据的 Java 对象。脚本数据源必须以表格格式返回数据，以便\
  \ BIRT 能够执行排序、聚合和分组。\n\n### 使用脚本数据源\n\n创建脚本数据源和非脚本数据源是相似的任务。创建脚本数据源与非脚本数据源之间的区别在于：\n\
  \n-   在创建脚本数据源时，必须从数据源类型列表中选择脚本数据源。\n-   脚本数据源仅提供两个事件处理程序方法：`open()` 和 `close()`。\n\
  \n每个脚本数据源必须至少有一个脚本数据集。创建脚本数据集与非脚本数据集之间的区别在于：\n\n-   脚本数据集必须与脚本数据源关联。\n-   必须提供脚本数据集\
  \ `fetch()` 事件处理程序方法的代码。\n-   识别脚本数据集列时有不同的对话框。\n\n使用 BIRT Report Designer 创建脚本数据源时，必须执行以下任务：\n\
  \n-   **创建脚本数据源。**\n    在 Data Explorer（数据资源管理器）中右键点击 Data Sources（数据源），并在数据源类型列表中选择\
  \ `Scripted Data Source`。\n\n-   **创建脚本数据集。**\n    在 Data Explorer 中右键点击 Data Sets（数据集），从可用数据源列表中选择脚本数据源。\n\
  \n-   **定义输出列。**\n    使用脚本数据集编辑器定义输出列的名称和类型。\n\n-   **为数据源 `open()` 和 `close()`\
  \ 方法提供代码。**\n    有两个脚本数据源事件处理程序方法：`open()` 和 `close()`。不是强制实现任一个方法，但大多数应用程序都需要使用\
  \ `open()` 方法来初始化数据源。通常，你在 `open()` 方法中创建一个用于访问数据源的 Java 对象。\n    使用 `close()` 方法清理任何遗留工作，包括将对象引用设置为\
  \ `null`，以确保对象在垃圾回收期间被删除。\n\n-   **为数据集方法提供代码。**\n    三个脚本数据集事件处理程序方法：`open()`、`fetch()`\
  \ 和 `close()`。实现 `fetch()` 方法是强制的，用于初始化变量并为抓取数据做准备。\n    使用 `fetch()` 方法从数据源获取一行数据并填充行对象的各个列。`fetch()`\
  \ 方法必须返回 `true` 或 `false`。`true` 值告诉 BIRT 还有另一行需要处理。`false` 返回值表示没有更多行需要处理。\n  \
  \  使用 `close()` 方法进行清理。\n\n-   **将列放置在报告布局中。**\n    按照与非脚本数据集相同的方式放置列。\n\n### 教程：创建脚本数据源\n\
  \n本教程将引导你完成脚本数据源的过程。在本教程中，你需要执行以下操作：\n\n-   创建报告。\n-   创建脚本数据源。\n-   编写数据源的 `open()`\
  \ 和 `close()` 方法。\n-   创建脚本数据集。\n-   编写数据集的 `fetch()` 方法。\n-   定义输出列。\n-   将列放置在报告布局中。\n\
  \n#### 任务 1：创建报告\n\n在此任务中，你将创建一个报告。\n\n1. 选择 `File→New→Report`。\n2. 在 `File Name\
  \ in New Report` 中输入 `ScriptedSrc`。\n3. 在 `Enter Folder` 中接受默认文件夹。选择 `Next`。\n4.\
  \ 在 `Report Templates` 中选择 `My First Report`。选择 `Finish`。BIRT 报告设计出现。如果有 `Cheat\
  \ Sheet` 标签，将其关闭。\n\n#### 任务 2：创建脚本数据源\n\n在此任务中，你将创建脚本数据源。\n\n1. 在 `Data Explorer`\
  \ 中右键点击 `Data Sources`选择 `New Data Source`。出现数据源类型选择。\n2. 在 `New Data Source` 中选择\
  \ `Scripted Data Source`。\n3. 在 `Data Source Name` 中输入 `ScriptedDataSource`。\n4.\
  \ 选择 `Finish`。\n\n`ScriptedDataSource` 的代码窗口出现如所示图 11-1。\n\n#### 任务 3：创建脚本数据集\n\n\
  在此任务中，你将创建脚本数据集。\n\n1. 在 `Data Explorer` 中右键点击 `Data Sets`选择 `New Data Set`。出现数据集出现如所示图\
