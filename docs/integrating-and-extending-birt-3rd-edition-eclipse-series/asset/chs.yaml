  \ 方法也需要在生成的 `Series` 接口中定义。在示例中，向 `org.eclipse.birt.chart.examples.radar.model.type.RadarSeries`\
  \ 接口添加了以下代码：\n\n```java\nRadarSeries copyInstance( );\n```\n\n## 实现扩展点\n\n接下来的部分首先描述设计时扩展点，然后是运行时扩展点。本章之前描述的\
  \ EMF 生成的代码必须位于运行时插件中。\n\n### 设计时插件扩展\n\n图表生成器和雷达图用户界面的设计时扩展实现在 `org.eclipse.birt.chart.examples`\
  \ 插件中。接下来的章节将讨论每个扩展点，首先从设计时扩展点 `org.eclipse.birt.chart.ui.types` 和 `org.eclipse.birt.chart.ui.seriescomposites`\
  \ 开始。\n\n#### 图表 UI-types 扩展点\n\n使用 UI-types 扩展点注册新的图表类型。要使用此扩展点，请创建一个实现 `org.eclipse.birt.chart.ui.swt.interfaces.IChartType`\
  \ 接口的类。在示例中，我们实际上是在创建一个新的系列渲染器，而不是新的图表类型。然而，这种类型在用户界面中显示为新的图表类型。\n\n该接口中的大多数方法在图表生成器被广泛使用。在图表引擎中，`IChartType`\
  \ 接口有一个默认实现，大多数图表类型都扩展自它，即 `org.eclipse.birt.chart.ui.swt.DefaultChartTypeImpl`\
  \ 类。本示例扩展自该类。以下列表描述了接口方法以及何时调用每个方法的简要说明：\n\n* `getName()`：返回图表的名称。\n* `getDisplayName()`：返回在图表生成器向导中显示的名称。\n\
  * `getImage()`：返回在图表生成器中显示的特定图表类型的图标图像。\n* `getChartSubtypes()`：返回该图表支持的图表子类型集合。集合应包含每个受支持的子类型的图像和名称。\n\
  * `getModel()`：返回当前开发中的图表的模型。当用户选择不同的图表类型时会调用此方法，以处理图表类型之间的转换。例如，当用户在第一个选项页中选择柱状图，然后选择饼图时，会调用此方法将带轴图表转换为不带轴的图表。\n\
  * `getSupportedDimensions()`：调用以确定图表类型支持多少个维度。目前引擎可以处理 2D、带深度的 2D 以及 3D。如果图表类型支持\
  \ 2D 以上，则必须编写额外的渲染代码，这将在本书稍后讨论。\n* `getDefaultDimension()`：返回图表类型的默认维度。\n* `supportsTransposition()`：确定图表维度是否转置（例如交换\
  \ x 轴和 y 轴）。转置可以适用于特定的维度类型。例如，2D 图支持转置，但 3D 图可能不支持。\n* `getDefaultOrientation()`：返回图表的默认方向，垂直或水平。没有实现默认是垂直。\n\
  * `getBaseUI()`：在图表生成器中构建基础系列用户界面，为图表类型设置数据值。\n* `isDimensionSupported()`：确定图表类型是否支持特定维度。\n\
  * `getSeries()`：为特定图表创建初始系列类型。每当用户界面中预填充系列类型列表时调用此方法。在大多数情况下，实现此方法只需要调用系列实现类的 `create()`\
  \ 方法，例如 `RadarSeriesImpl.create()`。\n* `canCombine()`：确定图表类型是否可以与另一种图表类型组合，例如柱线组合图。\n\
  \n在实现此扩展点之前，创建一个 16 × 16 像素的 GIF 图标来表示图表生成器第一个选项页中的图表。此外，为新图表类型的每个子类型创建一个 71 × 71\
  \ 像素的 GIF 图标。注意，你应该为默认图表子类型至少准备一张 71 × 71 的图像。\n\n此示例实现了三个子类型。每个子类型决定渲染什么种类型的背景，目前包括圆形和多边形非填充背景以及圆形填充背景。\n\
  \n要将图像包含在工作区，请在插件中创建 `icons` 目录并将图像导入该目录。打开插件清单编辑器（Plug-in Manifest Editor）上的构建标签页，勾选\
  \ icons 复选框以将此新目录包含在构建中，如图 23-17 所示。\n\n**图 23-17** 向工作区添加 icons 目录\n\n![image](img/23fig17.jpg)\n\
  \n接下来，将 `org.eclipse.birt.chart.ui.types` 扩展添加到 `plugin.xml` 中。示例所示所示向 `org.eclipse.birt.chart.examples`\
  \ 插件添加了以下扩展：\n\n```xml\n<extension\n    id=\"ChartWizardContext\"\n    name=\"Chart\
  \ example types\"\n    point=\"org.eclipse.birt.chart.ui.types\">\n    <chartType\n\
  \        classDefinition=\"org.eclipse.birt.chart.examples.radar.model.type.RadarSeries\"\
  \n        name=\"Radar Chart\"/>\n</extension>\n```\n\n使用 `ChartWizardContext` 作为标识符。图表生成器使用该标识符来显示支持哪些类型。在\
  \ `chartType` 元素下，`classDefinition` 指定了类。`org.eclipse.birt.chart.examples.radar.ui.type.RadarChart`\
  \ 通过扩展 `DefaultChartTypeImpl` 实现 `IChartType`。然后，添加以下依赖项：\n\n* `org.eclipse.birt.chart.engine`\n\
  * `org.eclipse.birt.chart.ui`\n* `org.eclipse.birt.chart.ui.extension`\n* `com.ibm.icu`\n\
  \n**图 23-18** 为插件添加依赖项\n\n![image](img/23fig18.jpg)\n\n在雷达图示例中，`com.ibm.icu` 位于一个依赖插件中，未在此图中显示。创建你在扩展点\
  \ `classDefinition` 属性中指定的类。雷达图使用 `org.eclipse.birt.chart.examples.radar.ui.type`\
  \ 包以及名为 `RadarChart` 的类：\n\n```java\npublic RadarChart() {\n    chartTitle = Messages.getString(\"\
  RadarChart.Txt.DefaultChartTitle\");\n}\n```\n\n查看源码示例以获取 `RadarChart`类的完整列表。该类的构造函数设置了图表的标题。`getImage()`\
  \ 方法将 16×16 像素的图标读取到 `org.eclipse.swt.graphics.Image` 变量中，当框架调用 `getImage()` 时返回该值，如下代码所示：\n\
  \n```java\npublic Image getImage() {\n    return UIHelper.getImage(\"icons/16/Radar16.gif\"\
  );\n}\n```\n\n`getName()` 和 `getDisplayName()` 方法分别返回字符串 Radar Chart 和 Radar Series，如下代码所示：\n\
  \n```java\npublic String getName() {\n    return Radar.TYPE_LITERAL;\n}\n\npublic\
  \ String getDisplayName() {\n    return Messages.getString(\"RadarChart.Txt.DisplayName\"\
  );\n}\n```\n\n`getChartSubtypes()` 方法创建一个子图表类型集合。对于图表的每个子类型，实例化 `DefaultChartSubTypeImpl`\
  \ 类的实例，并传递图表类型名称、从 `icons` 目录读取的图像、描述和显示名称，如列表 23-3 所示。\n\n**列表 23-3** getChartSubtypes()\
  \ 方法\n\n```java\npublic Collection<IChartSubType> getChartSubtypes(String sDimension,\
  \ Orientation orientation) {\n    Vector<IChartSubType> vSubTypes = new Vector<IChartSubType>(\
  \ );\n    // 对未知方向的请求不予响应\n    if ( !orientation.equals( Orientation.VERTICAL_LITERAL\
  \ ) ) {\n        return vSubTypes;\n    }\n}\n```\n\n\n\n```\nif ( sDimension.equals(\
  \ TWO_DIMENSION_TYPE )\n    ||\n    sDimension.equals( ChartDimension.TWO_DIMENSIONAL_LITERAL\n\
  .getName( ) )\n{\n    vSubTypes.add( new\nDefaultChartSubTypeImpl( Radar.STANDARD_SUBTYPE_LITERAL,\n\
  \      UIHelper.getImage( \"icons/wizban/Radar71.gif\" ),\n      sStandardDescription,\n\
