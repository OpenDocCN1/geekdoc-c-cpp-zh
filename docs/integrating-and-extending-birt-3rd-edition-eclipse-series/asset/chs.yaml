  \n### 创建右键菜单\n\n另一个吸引人且方便的 UI 特性是右键菜单。右键菜单显示指向特定操作的链接，并在用户用鼠标右键点击选中对象时出现。\n\n要支持自定义右键菜单，请实现\
  \ `org.eclipse.birt.report.designer.ui.menuBuilders`。该类实现了 `org.eclipse.birt.report.designer.ui.IMenuBuilder`\
  \ 接口，如 图 18-40 所示。\n\n**图 18-40** 添加菜单扩展\n\n![image](img/18fig40.jpg)\n\n如 图 18-41\
  \ 所示，`RotatedText`元素将菜单扩展绑定到模型。该类名为 `org.eclipse.birt.sample.report.item.rotatedtext.RotatedMenuBuilder`。\n\
  \n**图 18-41** 设置菜单属性\n\n![image](img/18fig41.jpg)\n\n`RotatedText` 项目的菜单构建器包含自定义操作，用于在\
  \ -90、90 和 180 度的角度值上快速旋转。代码见 代码列表 18-19。\n\n**代码列表 18-19** RotatedMenuBuilder 类\n\
  \n```java\npublic class RotatedMenuBuilder implements IMenuBuilder {\n  public void\
  \ buildMenu( IMenu menu, List selectedList ) {\n    if ( selectedList != null &&\
  \ selectedList.size() == 1 && selectedList.get(0 ) instanceof ExtendedItem ) {\n\
  \      ExtendedItem handle = (ExtendedItem) selectedList.get(0 );\n      if ( RotatedTextItem.EXTENSION_NAME.equals(handle.getExtensionName()\
  \ ) ) {\n        return;\n      }\n      RotatedTextItem item = null;\n      try\
  \ {\n        item = (RotatedTextItem) handle.getReportItem( );\n      } catch (\
  \ ExtendedElementException e ) {\n        e.printStackTrace( );\n      }\n     \
  \ if ( item == null ) {\n        return;\n      }\n      Separator separator = new\
  \ Separator( \"group.rotatedtext\" ); //$NON-NLS-1$\n      if ( menu.getItems().length\
  \ > 0 ) {\n        menu.insertBefore( menu.getItems()[0].getId(), separator );\n\
  \      } else {\n        menu.add( separator );\n      }\n      menu.appendToGroup(\
  \ separator.getId(), new RotateAction( item, -90 ) );\n      menu.appendToGroup(\
  \ separator.getId(), new RotateAction( item, 90 ) );\n      menu.appendToGroup(\
  \ separator.getId(), new RotateAction( item, 0 ) );\n      menu.appendToGroup( separator.getId(),\
  \ new RotateAction( item, 180 ) );\n    }\n  }\n  static class RotateAction extends\
  \ Action {\n    private RotatedTextText item;\n    private int angle;\n    RotateAction(\
