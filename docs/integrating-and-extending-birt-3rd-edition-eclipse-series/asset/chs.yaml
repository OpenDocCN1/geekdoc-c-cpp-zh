  ```\n\nBIRT 报告引擎可以使用标准发射器（emitter）扩展或自定义发射器扩展（例如此 CSV 渲染示例）来渲染报告设计。\n\n## 开发 XML\
  \ 报告渲染扩展\n\n示例 XML 报告渲染扩展是一个可以以 XML 格式导出 BIRT 报告数据的插件。通常报告开发人员会将 BIRT 报告数据渲染为 XML，以便与其他应用程序共享数据。\n\
  \n例如，企业对企业（B2B）系统必须以一致的方式向客户和交易伙伴传输数据，以支持电子数据交换（EDI）标准的互操作性。这些系统使用专门的 XML 形式，例如电子业务扩展标记语言（ebXML）。自定义的\
  \ XML 报告渲染扩展可以按照此既定标准的格式渲染 BIRT 报告数据。\n\n示例 XML 报告渲染扩展提供了以下功能：\n\n- 以 XML 格式导出 BIRT\
  \ 报告数据：XML 报告渲染插件渲染每个报告元素并写入输出文件 `<report_name>.xml`。\n- 定义用于以 XML 格式渲染 BIRT 报告的公共\
  \ API：该插件扩展了由 `org.eclipse.birt.report.engine` 插件中定义的 `org.eclipse.birt.report.engine.emitter`\
  \ 扩展点的功能。\n- 支持用户指定 XML Schema 来格式化输出：在渲染过程中，示例插件会处理报告设计中的所有元素，将 XML 属性和相关数据导出到输出文件中。可选的是插件支持将报告元素映射到\
  \ XML Schema，以为输出提供额外的格式支持。\n\n插件在属性文件 `<report_name>.xmlemitter` 中定义了这些映射。插件在运行时读取属性文件并加载自定义标签。\n\
  \n### 创建 XML 报告渲染插件项目\n\n使用 Eclipse PDE 为 XML 报告渲染扩展创建一个新的插件项目。\n\n#### 如何创建 XML\
  \ 报告渲染插件项目\n\n**1** 从 Eclipse PDE 菜单中，选择 `File→New→Project`。出现 New Project。\n\n\
  **2** 在 New Project 中，选择 `Plug-in Project`。点击 `Next`。出现 New Plug-in Project。\n\n\
  **3** 在 `Plug-in Project` 中，修改设置，如表 19-4 所示。\n\n**表 19-4** XML Emitter 插件项目字段的值\n\
  ![image](img/19tab04.jpg)\n\n点击 `Next`。出现 Plug-in Content。\n\n**4** 在 `Plug-in Content`\
  \ 中，修改设置，如表 19-5 所示。\n\n**表 19-5** XML Emitter 插件项目字段的值\n![image](img/19tab05.jpg)\n\
  \n点击 `Finish`。Eclipse 工作区中出现 XML 报告渲染项目，如图 15 所示。\n\n**图 15** XML 报告渲染项目\n![image](img/19fig15.jpg)\n\
  \n### 定义 XML 报告渲染的依赖\n\n要编译并运行扩展，请指定 `org.eclipse.birt.report.engine.emitters`。\n\
  \n### 声明扩展点\n\n要实现 XML 渲染扩展，请指定扩展点：\n\n**1** 在 PDE Manifest 上，选择 `Extensions`。\n\
  **2** 在 `All Extensions` 中，选择 `Add`。出现 New Extension Selection。\n**3** 在 `Available\
  \ extension points` 中，选择 `org.eclipse.birt.report.engine.emitters`。\n**4** 在 `Extension\
  \ Details` 中，指定 XML 发射器的属性，如表 19-6 所示。\n\n**表 19-6** XML Emitter 的值\n![image](img/19tab06.jpg)\n\
  \n### 理解 XML 报告渲染扩展\n\n示例 XML 报告渲染扩展扩展了 `org.eclipse.birt.report.engine.emitter`\
  \ 并提供了对页面、表格、行、单元格、文本、标签和数据的访问。示例将报告内容写入 XML 文件。输出文件名为带有 `.xml` 扩展名的报告。示例仅有限的错误检查。\n\
  \n### 理解 XML 报告渲染包\n\nXML 渲染扩展的实现包 `org.eclipse.birt.report.engine.emitter.xml`\
  \ 包含以下类：\n\n- `XMLPlugin`：扩展示例的插件运行时类。\n- `XMLReportEmitter`：处理渲染报告容器的开始和结束处理。\n\
  - `XMLRenderOption`：将插件与 BIRT 报告集成，指定配置信息，包括作为 XML 的输出格式。\n- `XMLTags`：定义写入 XML\
  \ 文件时使用的控件和关联属性列表。\n- `XMLFileWriter`：将 XML 版本、文本、图像、数据、标签和报告内容写入输出文件。\n- `LoadExportSchema`：如果存在\
  \ XML Schema 文件，则加载它，以替换为 XML 版本、数据、图像、标签、报告标签和文本所指定的默认值。每个标签的访问器方法将值返回给 `XMLReportEmitter`\
  \ 以输出到导出文件。\n\n### 理解 XMLReportEmitter\n\n`XMLReportEmitter` 将报告内容写入 XML 文件。`XMLReportEmitter`\
  \ 实例化写入器和发射器对象，并处理渲染报告容器的开始和结束处理。`XMLReportEmitter` 将报告的 XML 版本、数据、图像、标签、报告标签内容和文本导出到\
  \ XML 输出文件。\n\n`XMLReportEmitter` 实现以下方法：\n\n- `XMLReportEmitter()` 将 XML 报告发射器类实例化为\
  \ `org.eclipse.birt.report.engine.presentation.ContentEmitterVisitor` 对象以执行发射操作。\n\
  - `initialize()` 执行创建将报告内容写入 XML 文件的输出流所需的的操作，类似于 CSV 报告渲染扩展：\n    - 获取 `IEmitterServices`\
  \ 接口的引用。\n    - 使用指定的设置实例化文件和输出流对象。\n    - 实例化 XML 文件写入器对象。\n- `start()` 执行以下操作：\n\
  \    - 获取 `IReportContent` 接口的引用，该接口包含获取报告内容发射器接口的访问器方法。\n    - 设置启动发射器日志级别并写入日志文件。\n\
  \    - 如果存在可选的 XML Schema 文件，`start()` 将定位报告的 XML Schema 文件并。\n\n\n\n\n\n- 实例化 `LoadExportSchema`\
  \ 对象以读取 XML 架构文件\n- 打开输出文件，并将编码方案指定为 UTF-8\n- 启动 XML 写入器\n- 向输出文件写入起始标签，该标签指定 `<xml>`\
  \ 标签，包括版本和编码方案\n- 向输出文件写入 `<report>` 标签，该标签在报告属性列表中指定报告名称和其他属性\n\n代码列表 19-16 显示了\
  \ `start()` 方法。\n\n### 代码列表 19-16 的 `start()` 方法\n\n```java\npublic void start(\
  \ IReportContent report )\n{\n  logger.log( Level.FINE,\n    \"[XMLReportEmitter]\
  \ Start emitter.\" );\n  String fileName =\n    report.getDesign( ).getReportDesign(\
  \ ).getFileName( );\n  int pos = fileName.indexOf(\"/\");\n  String fn = fileName.substring(pos+1,fileName.length(\
  \ ));\n  fileName = fn;\n  if (fileName.length( ) > 0) {\n      pos = fileName.lastIndexOf(\"\
  .\");\n      if ( pos > 0 )\n        fileName = fileName.substring(0, pos);\n  \
  \      fileName = fileName + \".xmlemitter\";\n        pos = fileName.lastIndexOf(\"\
  /\");\n        String propFileName =\n            fileName.substring( pos+1 , fileName.length(\
  \ ) );\n      String resourceFolder =\n            report.getDesign().getReportDesign(\
  \ )\n              .getResourceFolder( );\n      if ( fileExists(resourceFolder\
  \ + \"/\"\n        + propFileName))\n        exportSchema = new LoadExportSchema(\n\
  \            resourceFolder + \"/\" + propFileName );\n      else\n        if (\
  \ fileExists(fileName))\n            exportSchema =\n                new LoadExportSchema(\
  \ fileName );\n      else exportSchema = new LoadExportSchema( \"\" );\n  }\n  this.report\
  \ = report;\n  writer.open( out, \"UTF-8\" );\n  writer.startWriter( );\n  writer.closeTag(\
  \ exportSchema.getExportStartTag( ));\n  writer.closeTag( XMLTags.TAG_CR );\n  String\
  \ rp = exportSchema.getExportReportTag( );\n  for (int i = 0;i < XMLTags.rPropList.length;i++)\n\
  \  {\n    if (exportSchema.isPropertyRequired(\n            XMLTags.rPropList[i],\
  \ rp))\n    {\n      String propValue = getReportPropValue(i,report);\n      rp\
  \ = replaceTag( rp, \"??\"\n                      +XMLTags.rPropList[i], propValue\
  \ );\n    }\n  }\n  writer.writeCode( rp );\n  writer.closeTag( XMLTags.TAG_CR );\n\
  }\n```\n\n- `end()` 执行以下操作，类似于 CSV 扩展：\n- 设置报告结束层级并写入日志文件\n- 结束写入过程并关闭 XML 写入器\n\
  - 关闭输出文件\n\n## 理解 XMLReportEmitter 方法\n\n`XMLReportEmitter` 类定义了以下额外方法，这些方法在报告生成过程的不同阶段被调用，它们提供了对报告容器、页面、表格、行、单元格文本、标签、数据、图像、超链接和其他内容的访问。以下示例显示了对标签（label）的处理：\n\
  \n- `startLabel()` 执行以下操作：\n- 调用 `LoadExportSchema.getLabelTag()` 以获取 `<report_name>.xmlemitter`\
  \ 文件中指定的 `<label>` 标签的模式。如果属性文件不存在，插件将使用 `LoadExportSchema` 类中指定的以下模式：`<label>??</label>`\n\
  - 遍历在 `XMLTags` 中定义的以下标签列表，以确定报告所需的属性：`static String[] lPropList = {\"Bookmark\"\
  ,\"Height\",\"Hyperlink\",\"InlineStyle\",\"Name\",\"TOC\",\"Width\",\"Y\"};`\n\
  - 调用 `getLabelValue()` 获取每个属性值并替换 `<label>` 标签中的值。\n- 调用 `startText()` 和 `FileWriter.closeTag()`\
  \ 将 `<label>` 标签写入输出文件。\n\n代码列表 19-17 显示了 `startLabel()` 方法。\n\n### 代码列表 19-17 的\
  \ `startLabel()` 方法\n\n```java\npublic void startLabel( ILabelContent label )\n\
  {\n  String lbl = exportSchema.getLabelTag( );\n  int len = XMLTags.lPropList.length;\n\
  \  for (int i = 0;i < XMLTags.lPropList.length;i++)\n  {\n    if (exportSchema.isPropertyRequired(\n\
  \            XMLTags.lPropList[i], lbl))\n    {\n      String propValue = getLabelPropValue(i,label);\n\
  \      lbl = replaceTag( lbl, \"??\"+XMLTags.lPropList[i],\n        propValue );\n\
  \    }\n  }\n  startText( label, lbl );\n  writer.closeTag( XMLTags.TAG_CR );\n\
  }\n```\n\n- `startText()` 执行以下操作：\n- 设置起始文本日志层级并写入日志文件\n- 迭代使用 `getLabelValue()`\
  \ 获取标签文本值\n- 将 `<label>` 标签写入输出文件\n\n代码列表 19-18 显示了 `startText()` 方法。\n\n### 代码列表\
  \ 19-18 的 `startText()` 方法\n\n```java\npublic void startText( ITextContent text,\
  \ String exportTag )\n{\n  logger.log( Level.FINE,\n    \"[XMLReportEmitter] Start\
  \ text\" );\n  String txt = exportSchema.getLabelTag();\n  int len = XMLTags.lPropList.length;\n\
  \  for (int i = 0;i < XMLTags.lPropList.length;i++)\n  {\n    if (exportSchema.isPropertyRequired(\n\
  \            XMLTags.lPropList[i], lbl))\n    {\n      String propValue = getLabelPropValue(i,label);\n\
  \      lbl = replaceTag( lbl, \"??\"\n          +XMLTags.lPropList[i], propValue\
  \ );\n    }\n  }\n  String textValue = text.getText( );\n  writer.writeCode( replaceTag(\
  \ exportTag, valueTag,\n    textValue ) );\n\n- `getPropValue()` 执行以下操作：\n- 调用相应的\
  \ `IContent` 访问方法获取属性值\n- 为 `startLabel()` 返回用于 `<label>` 标签中替换的值\n\n代码列表 19-19\
  \ 显示了 `getLabelPropValue()` 方法。\n\n### 代码列表 19-19 的 `getLabelPropValue()` 方法\n\n\
  ```java\nprivate String getLabelPropValue( int property, IContent label )\n{\n \
  \ String propValue;\n  switch (property) {\n    case 0: // Bookmark\n      propValue\
