  \ getSeries( ),\n        sd );\n}\n```\n\n`render` 方法绘制实际的雷达。该方法使用模型的值来决定如何显示图表。\n\
  \n`render` 方法首先计算雷达图的中心点和径向大小。如果系列是心形图，则渲染椭圆。遍历数据点并渲染标记和标签。这些点随后用于 `renderPolys()`\
  \ 方法来渲染每个线条和多边形。最后，如果该系列是轴上的最后一个，方法将渲染网格标签。`render` 方法的代码见列表 23-16 。\n\n**列表 23-16**\
