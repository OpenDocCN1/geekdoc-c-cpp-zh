  IScalarParameterDefn param = (IScalarParameterDefn)\n   task.getParameterDefn( \"\
  customerID\" );\n\n// 获取参数的默认值。在这种情况下，\n// 参数 customerID 的数据类型为 Double。\nint customerID\
  \ =\n   ((Double) task.getDefaultValue( param )).intValue( );\n\n// 获取参数的值。此示例假设\n\
  // 这一步创建了类型正确的对象 inputValue。\n// 设置参数的值。\ntask.setParameterValue( \"customerID\"\
  , inputValue );\n\n// 获取应用程序为所有参数设置的值。\nHashMap parameterValues = task.getParameterValues(\
  \ );\n\n// 关闭参数定义任务。\ntask.close( );\n```\n\n#### 如何使用报告参数集合\n\nListing 14-7 中的代码示例显示了如何使用报告参数的\
