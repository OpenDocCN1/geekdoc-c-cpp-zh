  \ dHandle.saveAs( \"./Test_modified.rptdesign\" );\n}\ncatch ( IOException e ) {\
  \ e.printStackTrace( ); }\n\ndHandle.close( );\n```\n\n### 整合在一起\n\nListing 15-23\
