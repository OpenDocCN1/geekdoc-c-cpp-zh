  \ `Enter` 键或双击。\n\n## 使用 `this` 对象设置报告项目属性\n\n此属性和函数列表不仅适用于 `this` 对象，也适用于其他对象。以下步骤将标签（label）的背景颜色设置为黄色。此步骤中解释的通用流程并不特定于标签报告项目。所有报告项目事件处理程序都支持此项功能。\n\
