  \n#### 设计引擎接口层次结构\n图 13-9 包含了设计引擎 API 的接口层次结构。此图中所有的接口都在 `org.eclipse.birt.report.model.api`\
  \ 包中。\n\n**图 13-9** 设计引擎包的接口层次结构\n\n![image](img/13fig09.jpg)\n\n\n\n\n\n虽然 BIRT\
  \ Chart Engine API 中有 500 多个类和接口，但创建或修改图表的大部分功能集中在一小部分类和接口中。BIRT Chart Engine API\
  \ 中的主要接口是 `Chart` 接口。`Chart` 类型的对象称为图表实例对象。`Chart` 接口有两个子接口：`ChartWithAxes` 和 `ChartWithoutAxes`。`DialChart`\
  \ 是继承自 `ChartWithoutAxes` 的第三个接口。`ChartWithoutAxes` 定义了饼图而 `DialChart` 定义了仪表图。`ChartWithAxes`\
  \ 定义了所有其他图表类型。\n\n要创建一个表实例对象，可以在 `ChartWithAxesImpl`、`ChartWithoutAxesImpl` 或 `DialChartImp`\
  \ 中调用 `create()`，如下所示：\n\n```\nChartWithAxes myChart = ChartWithAxesImpl.create(\
  \ );\n```\n\n要设置图表的基本属性（例如方向和维度），可以使用 `Chart` 接口的 setter 方法，例如：\n\n```\nmyChart.setOrientation(\
  \ Orientation.VERTICAL_LITERAL );\nmyChart.setDimension( ChartDimension.THREE_DIMENSIONAL\
  \ );\n```\n\n要设置图表更复杂的属性（例如图表轴和系列的特征），可以通过获取对象的实例进行修改，然后设置其属性。例如，要设置 `x` 轴的标题，请使用以下代码：\n\
  \n```\nAxis xAxis = myChart.getPrimaryBaseAxes( )[0];\nxAxis.getTitle( ).getCaption(\
  \ ).setValue( \"Months\" );\n```\n\n虽然图表通常按类型（如饼图或折线图）来识别，但具有多个不同类型系列的图表不能归类为一种类型。系列具有特定的类型。使用\
  \ BIRT Chart Engine API 通过使用 `SeriesImpl` 的任一子类的 `create()` 方法来创建特定类型的系列。例如，以下代码创建了一个条形系列：\n\
  \n```\nBarSeries barSeries1 = ( BarSeries ) BarSeriesImpl.create( );\n```\n\n###\
