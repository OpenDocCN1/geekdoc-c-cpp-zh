  \ null;\n}\n```\n\n### rotateImage()\n\n该方法用于旋转图像并确定图像的高度、宽度和原点，如列表 18-5 所示。\n\n\
  **列表 18-5** `rotateImage()` 方法\n\n```java\nprivate Image rotateImage(Image img,\
  \ double degrees)\n{\n    double positiveDegrees = (degrees % 360) +\n        ((degrees\
  \ < 0) ? 360 : 0);\n    double degreesMod90 = positiveDegrees % 90;\n    double\
  \ radians = Math.toRadians(positiveDegrees);\n    double radiansMod90 = Math.toRadians(degreesMod90);\n\
  \    if (positiveDegrees == 0)\n        return img;\n    int quadrant = 0;\n   \
  \ if (positiveDegrees < 90)\n        quadrant = 1;\n    else if ((positiveDegrees\
  \ >= 90) &&\n        (positiveDegrees < 180))\n        quadrant = 2;\n    else if\
  \ ((positiveDegrees >= 180) &&\n        (positiveDegrees < 270))\n        quadrant\
  \ = 3;\n    else if (positiveDegrees >= 270)\n        quadrant = 4;\n    int height\
  \ = img.getBounds().height;\n    int width = img.getBounds().width;\n    double\
  \ side1 = (Math.sin(radiansMod90) * height) +\n        (Math.cos(radiansMod90) *\
  \ width);\n    double side2 = (Math.cos(radiansMod90) * height) +\n        (Math.sin(radiansMod90)\
  \ * width);\n    double h = 0;\n    int newWidth = 0, newHeight = 0;\n    if ((quadrant\
  \ == 1) || (quadrant == 3)) {\n        h = (Math.sin(radiansMod90) * height);\n\
  \        newWidth = (int)side1;\n        newHeight = (int)side2;\n    } else {\n\
  \        h = (Math.sin(radiansMod90) * width);\n        newWidth = (int)side2;\n\
  \        newHeight = (int)side1;\n    }\n    int shiftX = (int)(Math.cos(radians)\
  \ * h) -\n        ((quadrant == 3) || (quadrant == 4)\n            ? width : 0);\n\
  \    int shiftY = (int)(Math.sin(radians) * h) +\n        ((quadrant == 2) || (quadrant\
  \ == 3)\n            ? height : 0);\n    Image newImg = new Image(display, newWidth,\
  \ newHeight);\n    GC newGC = new GC(newImg);\n    Transform tr = new Transform(display);\n\
  \    tr.rotate((float)positiveDegrees);\n    newGC.setTransform(tr);\n    newGC.setBackground(display.getSystemColor(SWT.COLOR_WHITE));\n\
  \    newGC.drawImage(img, shiftX, shiftY);\n    newGC.dispose();\n    return newImg;\n\
  }\n```\n\n#### 理解 RotatedCategoryFactory\n\n在此类中，`getCategory()` 方法为旋转标签的属性页（如书签、边距和目录）提供类别信息。列表\
