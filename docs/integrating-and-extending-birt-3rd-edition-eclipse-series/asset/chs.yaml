  - 创建与显示文本大小相同的图像\n- 在图像上绘制显示文本\n- 调用 `rotateImage()` 按指定角度旋转图像\n- 释放用于渲染图像的操作系统资源\n\
  - 返回图像对象\n\n代码列表 18-4 显示了 `createRotatedText()` 方法的代码。\n\n**代码列表 18-4** `createRotatedText()`\
