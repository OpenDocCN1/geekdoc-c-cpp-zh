  \ 中的类\n\n![image](img/13fig30.jpg)\n\n# 第 14 章 使用 BIRT Reporting API 进行编程\n\n报告应用程序使用\
  \ BIRT 报告引擎 API 从报告设计文件（`.rptdesign`）生成报告。通常，应用程序将报告生成为格式化文件或流，格式为 HTML 或 PDF。或者，应用程序会创建一个报告文档（`.rptdocument`）文件，该文件以二进制形式包含报告内容，稍后将报告渲染为支持的输出格式之一。\n\
  \n本章描述了报告应用程序的基本要求，并描述了你在应用程序中使用的 BIRT API 类和接口。本章还提供了关于报告应用程序执行的任务的详细信息。\n\n`org.eclipse.birt.report.engine.api`\
  \ 包中的 BIRT API 支持从报告设计生成报告的过程。该包提供了 `ReportEngine` 类以及支持的接口和类。\n\n可选，报告应用程序可以使用\
  \ BIRT 设计引擎 API 来访问报告设计、模板和库的结构。使用此 API，应用程序可以在生成报告之前创建和修改报告设计。此 API 支持创建和修改设计中的报告项目和其他元素。`org.eclipse.birt.report.model.api`\
  \ 包及其子包提供了对组成报告设计的所有项的访问。\n\n要获取这些包中类和接口的所有方法和字段的完整信息，请查看在线 Javadoc。要查看 Javadoc，请打开在线帮助并导航到\
  \ BIRT ProgrammerReference→Reference→API Reference。为报告引擎 API 选择 Report Engine API\
  \ Reference，为设计引擎 API 选择 Report Object Model API Reference。Javadoc 还显示了公共 API 中支持的包。\n\
  \n### 构建报告应用程序\n\n生成报告的应用程序必须完成下文节中描述的任务。额外的任务（如提供用户输入的值）是可选的。\n\n#### 创建并配置报告引擎\n\
  \n单个图表引擎可以从多个报告设计生成多个报告。使用 `Platform.createFactory()` 方法创建 `ReportEngine` 对象。设置\
  \ BIRT 目录，它定义了插件和库的位置。\n\n#### 打开报告设计或报告文档\n\n使用 `ReportEngine` 的 `openReportDesign()`\
  \ 方法从 `String` 文件名或输入流打开报告设计。这些方法返回一个 `IReportRunnable` 对象。\n\n使用 `ReportEngine`\
  \ 的 `openReportDocument()` 方法从 `String` 文件名打开报告文档（`.rptdocument`）。该方法返回一个 `IReportDocument`\
  \ 对象。\n\n#### 访问数据源\n\n确保报告引擎能够定位连接数据源并向数据集提供数据的类。报告引擎可以创建数据数据的连接，也可以使用应用程序提供的 `Connection`\
  \ 对象。\n\n#### 准备以支持的输出格式创建报告\n\n使用 `IRenderOption` 对象设置输出格式、输出文件名或流、区域以及特定设置。`HTMLRenderOption`\
  \ 类支持 HTML 输出格式。对于 PDF 输出，使用 `RenderOption`。\n\n#### 以支持的输出格式生成报告\n\n使用 `IRunAndRenderTask`\
  \ 对象从 `IReportRunnable` 对象创建报告。使用 `IRenderTask` 对象从 `IReportDocument` 对象创建报告。\n\n\
  或者，使用 URL 访问报告查看器 servlet，如本书前面提到的将 BIRT 报告部署到应用程序服务器所示。报告查看器可以从设计文件或文档文件生成报告。\n\
  \n#### 销毁引擎\n\n在应用程序生成所有报告后销毁报告引擎。\n\n#### 可选任务\n\n下列表的任务对于报告应用程序是可选的。通常，应用程序执行这些任务中的一个或多个。\n\
  \n- 参数值。如果应用程序使用了带有参数的报告设计，使用默认值或设置不同的值。\n- 创建报告文档文件。报告文档文件以二进制形式包含报告。如果应用程序使用了报告设计，使用\
  \ `IRunTask` 对象创建报告文档 `IReportDocument`。\n- 从报告文档导出数据。使用 `IDataExtractionTask` 对象从报告文档中的任何项或一组项中提取数据值。将数据值导出到文件或其他应用程序，或对数据进行进一步处理。\n\
  \n#### 关于开发环境\n\n\n\n\n\n报告应用程序的开发环境必须能够访问所有所需的 BIRT 插件和 API 库。应用程序的关键是 BIRT home\
  \ 目录的路径。BIRT home 目录包含 BIRT 引擎，该引擎由所需的 BIRT 插件和库组成。\n\n如第 3 章中描述的“安装其他 BIRT 软件包”所示，安装\
  \ BIRT Report Engine 软件包后，会在 `ReportEngine` 子目录中提供一个完整的 BIRT home。\n\n## 关于 BIRT\
  \ home 中的插件\n\nBIRT home 目录下的 `plugins` 子目录包含 `org.eclipse.birt` 以及其他提供报告应用程序运行的插件。根据您的报告应用程序的需求以及报告设计中的项目，您可以省略提供应用程序和设计中未使用的某些功能的插件。\n\
  \n## 关于 BIRT home 中的库\n\nBIRT home 目录下的 `lib` 子目录包含提供 BIRT API 类以及支持这些 API 的类的 JAR\
  \ 文件。报告引擎内部的此位置确保了部署报告引擎的应用程序服务器或 JVM 的类加载器可以找到这些库。根据您的报告应用程序的需求以及报告设计中的项目，您可以省略提供应用程序和设计中未使用的功能的库。\n\
  \n表 14-1 列出了并了 `lib` 目录中所有的 JAR 文件。\n\n**表 14-1** BIRT home lib 目录中的库\n\n![image](img/14tab01.jpg)\n\
  \n![image](img/14tab01a.jpg)\n\n## 关于所需的 JDBC 驱动\n\nBIRT 应用程序从 BIRT home 目录 `plugins/org.eclipse.birt.report.data.oda.jdbc_<version>/drivers`\
  \ 加载 JDBC 驱动程序。将访问 JDBC 数据源所需的驱动类或 Java 归（`.jar`）文件放置在此位置。\n\n### 设置构建路径并访问 Javadoc\n\
  \n为了在使用 Eclipse Workbench 的 Java 视图进行应用程序开发期间访问 BIRT API，请将 API 的 JAR 文件添加到构建路径中。`org.eclipse.birt.chart.doc.isv`\
  \ 和 `org.eclipse.birt.doc.isv` 插件提供了公共 BIRT API 的 Javadoc。将插件的 JAR 文件提取到方便的位置，例如您的工作区或资源文件夹。然后，使用\
  \ Eclipse 中的 Java Build Path 设置为每个公共 API JAR 文件指定 Javadoc 路径。表 14-2 列出了源插件和提取出的\
  \ Javadoc 提取位置。\n\n**表 14-2** BIRT API 库的 Javadoc 路径\n\n![image](img/14tab02.jpg)\n\
  \n## 如何将 BIRT 库和 API Javadoc 添加到 Java 应用程序的构建路径\n\n使用 Eclipse Workbench 中的 Java\
  \ 视图对现有的 Java 项目执行以下步骤。\n\n**1** 安装 BIRT 引擎软件包以创建 BIRT home。\n\n**2** 为了让 Eclipse\
  \ Java 视图能够访问 BIRT Javadoc 文件，请导航到 `eclipse\\plugins` 目录。将 `org.eclipse.birt.chart.doc.isv`\
  \ 和 `org.eclipse.birt.doc.isv` 插件的 JAR 文件提取到工作区或资源目录。\n\n**3** 在 Package Explorer\
  \ 中，右键点击 Java 项目。选择 `Build Path`（构建路径）→`Configure Build Path`（配置构建路径）。\n\n**4**\
  \ 在 `<project name>`—Java Build Path 属性中，选择 `Libraries`（库）。要向构建路径添加 JAR 文件，请选择 `Add\
  \ External JARs`（添加外部 JAR）。\n\n**5** 在 `JAR Selection`（JAR 选择）中，导航到 BIRT home 的\
  \ `lib` 目录。选择所需的 JAR 文件。选择 `Open`（打开）。JAR 文件将出现在构建路径的 `JARs` 和类文件夹中。\n\n**6** 将\
  \ Javadoc 与 BIRT API 库中的类文件关联，请执行以下步骤：\n\n**1** 展开构建路径中 `JARs` 和类文件夹下的 API JAR 文件。\n\
  选择 Javadoc location：` (None)`。选择 `Edit`（编辑）。\n\n**2** 在 `<JAR file name>` 的 Javadoc\
  \ 中，输入或浏览到包含步骤 2 中提取的 Javadoc 的目录。输入或浏览到表 14-2 指定的子目录。\n\n**3** 选择 `Validate`（验证）。验证\
  \ Javadoc Location 将显示一条关于指定目录是否包含 Javadoc 的消息。选择 `OK`（确定）。\n\n**4** 如有必要，纠正 Javadoc\
  \ 路径。在 `<JAR file name>` 的 Javadoc 中，选择 `OK`（确定）。\n\n**7** 对每个所需的 BIRT JAR 文件重复第\
  \ 4 到 6 步。\n\n### 使用 API 修改报告设计\n\n报告应用程序可以在生成报告之前修改报告设计。例如，应用程序可以根据生成报告的用户从报告设计中添加或删除项目。为了对报告提供进一步的定制，在输出期间，报告设计可以使用\
  \ JavaScript 类或嵌入 JavaScript 代码来处理事件。Design Engine API 中的类支持对报告设计进行更改并包含或更改脚本。关键\
  \ Design Engine 类位于 `org.eclipse.birt.model.api` 包中。\n\n### 关于部署环境\n\n部署的应用程序必须能够访问\
  \ BIRT 需要的所有类、外部数据源以及任何其他必要的类。为应用程序设置 BIRT home 目录和 `CLASSPATH`。\n\n如果您使用或自定义了 BIRT\
  \ 源代码，请确保您的应用程序使用的版本与 BIRT home 目录中插件和库的版本匹配。如果这些版本不同，报告应用程序可能会失败。\n\n### 从应用程序生成报告\n\
  \n报告应用程序必须执行的关键任务是设置报告引擎、任何所需的参数值以及生成报告的任务对象，最后渲染报告。报告应用程序生成报告时不需要 BIRT Designer\
  \ 用户界面。\n\n`org.eclipse.birt.report.engine.api` 包包含了应用程序用于生成报告的类和接口。主要的类和接口是 `ReportEngine`、`EngineConfig`、`IRunnable`、`IRenderOption`\
  \ 及其子类，以及 `ITask` 及其子类。\n\n### 设置报告引擎\n\n报告引擎是 `ReportEngine` 类的实例化。该对象是报告应用程序的关键组件。它提供了对报告设计、参数、报告设计结构以及生成报告任务的访问。使用\
  \ `EngineConfig` 对象准备报告引擎的属性。完成后，使用 BIRT 引擎工厂创建报告引擎。后续章节描述了各种配置选项和引擎的创建。\n\n#####\
  \ 配置 BIRT home\n\nBIRT home 是插件和库的位置，是报告引擎所需的关键属性。没有 BIRT home，报告引擎无法解析报告设计也无法渲染报告。对于独立应用程序，BIRT\
  \ home 是文件系统的绝对路径。对于从 Web 存档（`.war`）文件运行的应用程序，BIRT home 是 WAR 包内的相对路径。要设置 BIRT home\
  \ 位置，请使用以下技术之一：\n\n• 对于独立应用程序，请使用以下技术之一：\n\n• 调用 `EngineConfig.setBIRTHome()` 并传入\
  \ BIRT home 目录路径作为参数，例如：\n\n```\nconfig.setBIRTHome(\"C:/birt-runtime-<version>/ReportEngine\"\
  );\n```\n\n• 在应用程序环境中，设置 `BIRT_HOME` 和 `CLASSPATH` 变量。例如，在 Windows 批文件中，在启动独立应用程序之前包含类似下面的命令：\n\
  \n```batch\nset BIRT_HOME=\"C:\\birt-runtime-<version>\\ReportEngine\"\nSET CLASSPATH=%BIRT_HOME%\\\
  <required library 1>;\n%BIRT_HOME%\\<required library 2 and so on>;\n%CLASSPATH%\n\
  ```\n\n\n\n\n\n要开发使用 `BIRT_HOME` 环境变量的应用程序，请在 Eclipse 运行对话框的 VM 参数中设置 `BIRT_HOME`。例如，在\
  \ VM 参数中输入类似于下面这一行的文本：\n\n```\n-DBIRT_HOME=\"C:\\birt-runtime-<version>\\ReportEngine\"\
  \n```\n\n- 对于已部署的 Web 应用程序，请使用以下技术之一：\n\n- 如果应用程序在文件系统中有一个位置，请使用 servlet 上文来查找 BIRT\
  \ home 的真实路径，例如：\n\n```java\nconfig.setBIRTHome(servletContext.getRealPath(\"/WEB-INF\"\
  ) );\n```\n\n- 如果应用程序从 WAR 文件运行，请使用从 WAR 文件根目录的相对路径，如下例所示。此配置使用了 `PlatformServletContext`。\n\
  \n```java\nconfig.setBIRTHome( \"\" );\n```\n\n- 如果你在基于 Eclipse 的应用程序（如 RCP 应用程序）中使用\
  \ BIRT，且 BIRT 插件位于应用程序的 plugins 目录，则你不需要设置 `BIRT_HOME`。\n\n### 配置报告引擎\n\n可选地，使用\
  \ `EngineConfig` 对象上的方法设置其他配置属性。表 14-3 描述了这些属性以及如何使用 `EngineConfig` 方法设置它们。`EngineConfig`\
  \ 类还提供了 getter 方法来访问这些属性。\n\n**表 14-3** `EngineConfig` 属性\n\n![image](img/14tab03.jpg)\n\
  \n![image](img/14tab03a.jpg)\n\n### 设置独立运行或 WAR 文件环境\n\n有两个引擎配置属性取决于应用程序运行的环境是独立运行还是在应用程序服务器上的\
  \ Web 归档 (.war) 文件中。这些属性是平台上下文（platform context）和 HTML 发射器配置（HTML emitter configuration）。平台上下文为报告引擎提供了访问插件的机制。默认平台上下文为这些插件提供直接的文件系统访问，如独立应用程序所使用的那样。HTML\
  \ 发射器配置提供了处理图像以及处理超链接和书签操作的功能。\n\n### 设置平台上下文\n\n由于 BIRT 是一个基于 Eclipse 的应用程序，它使用\
  \ OSGi 平台来启动组成报告和设计引擎的插件。BIRT 应用程序通过平台上下文在 BIRT home 中定位插件，该平台上下文是 `org.eclipse.birt.core.framework.IPlatformContext`\
  \ 接口的实现。此接口定义了 `getPlatform()` 方法，该方法返回插件目录的位置。使用 `IPlatformContext` 对象作为 `EngineConfig`\
  \ 对象 `setPlatformContext()` 方法的参数。\n\nBIRT 框架提供了 `IPlatformContext` 接口的两种实现。这些实现提供了平台上下文所需的所有功能。\n\
  \n默认实现 `PlatformFileContext` 访问文件系统中 BIRT home 文件夹中的插件。如果应用程序在 `EngineConfig` 对象中设置了\
  \ `BIRT_HOME` 位置，或者应用程序环境包含 `BIRT_HOME`，则没有必要创建 `PlatformFileContext` 对象。\n\n对于\
  \ Web 部署（例如在应用程序服务器上从 WAR 文件运行的应用程序），请使用 `PlatformServletContext` 实现。该类使用 J2EE `ServletContext`\
  \ 类提供的基于资源的访问来定位所需的插件。该类的构造函数接受一个参数，即一个 `ServletContext` 对象。默认情况下，`PlatformServletContext`\
  \ 使用 `ServletContext.getRealPath()` 方法在 `/WEB-INF/platform/` 目录下查找插件。某些应用程序服务器从此方法返回\
  \ `null`。在这种情况下，`PlatformServletContext` 对象会在系统属性 `javax.servlet.context.tempdir`\
  \ 定义的位置创建一个平台目录。`PlatformServletContext` 对象将插件和配置文件夹拷贝到此位置。列表 14-2 为从 WAR 文件运行的报告应用程序设置了平台上下文。\n\
  \n如果这两个 `IPlatformContext` 实现都不能满足你的需求，请实现你自己的 `IPlatformContext` 版本。与处理内置平台上下文的方式一样，调用\
  \ `EngineConfig.setPlatformContext()` 配置引擎使用新的实现。\n\n### 设置 HTML 发射器\n\n要生成 HTML\
  \ 格式的报告，报告引擎使用 `org.eclipse.birt.report.engine.api.HTMLRenderOption` 对象来确定如何处理 HTML\
  \ 发射器使用或创建的资源。这些资源包括图像元素和图表元素的新图像文件，以及书签和钻（drill-through）动作跳转的位置。BIRT 为基于文件系统的应用程序和部署在\
  \ Web 上的使用不同的图像处理器。在创建报告引擎时，使用 `EngineConfig` 对象设置 HTML 发射器选项，如 列表 14-1 所示，或者在将报告渲染为\
  \ HTML 时后设置这些选项。\n\n要设置 HTML 发射器，请实例化 `HTMLRenderOption` 对象。使用此对象作为 `ReportEngine.setEmitterConfiguration()`\
  \ 的参数，在创建报告引擎时定义 HTML 渲染选项。\n\n调用 `HTMLRenderOption.setImageHandler()` 方法来配置图像处理器。此方法通过使用\
  \ `org.eclipse.birt.report.engine.api.IHTMLImageHandler` 对象确定如何保存图像文件。报告中定义为 URL\
  \ 的图像不会保存在本地。BIRT 提供了 `IHTMLImageHandler` 接口的两种实现。两种实现都为临时图像创建唯一的图像文件名。\n\n默认图像处理器实现\
  \ `HTMLCompleteImageHandler` 将图像保存到文件系统。对于独立应用程序或在应用程序服务器上使用文件系统部署的 Web 应用程序，使用此实现。此图像处理器通过以下顺序查找图像位置：首先\
  \ `HTMLRenderOption` 对象设置的图像目录，通过通过 EngineConfigConfig.TempDir()` 方法设置的临时目录，最后是系统设置\
  \ `java.io.tmpdir`。生成的 HTML 中的所有图像都使用指向创建的的文件。\n\n对于 Web 部署（例如在应用程序服务器上从 WAR 文件运行的应用程序），请使用\
  \ `HTMLServerImageHandler` 实现。该类将图像保存到 `HTMLRenderOption` 对象设置的图像目录。生成的 HTML 中图像的\
  \ `src` 属性会将图像名称附加到 `HTMLRenderOption` 对象中设置的基础 URL 上。通过这种方式，报告引擎在本地生成图像并使用 URL\
  \ 共享图像。使用此实现时，设置图像目录和基础 URL，如 列表 14-3 所示。`org.eclipse.birt.report.viewer` 插件中的示例\
  \ BIRT Web 视器使用了此实现。\n\n如果这两个 `IHTMLImageHandler` 都不能满足你的需求，请创建一个实现 `IHTMLImageHandler`\
  \ 的类或扩展现有的图像处理器。通常，`HTMLCompleteImageHandler` 提供了足够的文件系统访问功能，因此应用程序不需要扩展该类。对于应用程序服务器环境，扩展\
  \ `HTMLServerImageHandler`。与处理内置图像处理器的方式一样，调用 `EngineConfig.setEmitterConfiguration()`\
  \ 配置引擎使用新的实现。\n\n\n\n\n\n在设置好 `PlatformContext` 后，应用程序通过 `org.eclipse.birt.core.framework.Platform`\
  \ 类来启动平台。该类作为 `Eclipse OSGILauncher` 类的封装，并提供了 `startup()` 方法来启动平台。调用此同步静态方法会消耗大量的系统资源，因此应用程序应该只调用一次方法。如果报告引擎部署在\
  \ Web 应用程序中，请在 servlet 的 `init()` 方法或使用该平台的第一个请求中调用 `Platform.startup()`。为了实现这一行为，请将平台启动代码封装在单例中，如代码列表\
  \ 14-2 所示。当应用程序完成对平台的使用时，调用 `Platform.shutdown()`。如果您使用示例中的 Web 查看器，或在基于 Eclipse\
  \ 的项目（例如 `富客户端客户端平台 (RCP)` 应用程序）中部署报告引擎，则请勿启动或关闭平台，因为这些应用程序会控制 OSGi 的启动和关闭。\n\n\
  ### 创建报告引擎\n\nBIRT 提供了一个工厂服务来创建 `ReportEngine` 对象。调用 `Platform.createFactoryObject()`\
  \ 来创建此工厂，该工厂实现了 `org.eclipse.birt.report.engine.api.IReportEngineFactory` 接口。`createFactoryObject()`\
  \ 方法使用 `PlatformConfig` 对象。调用 `IReportEngineFactory.createReportEngine()` 来创建报告引擎。\n\
  \n#### 如何将报告引擎设置为独立应用程序\n\n代码列表 14-1 显示了在 Windows 系统上将报告引擎设置为独立应用程序的示例。该应用程序使用 BIRT\
  \ 目录下的 BIRT home。报告输出格式为 HTML。\n\n**代码列表 14-1** 为独立应用程序设置报告引擎\n\n```java\n// Create\
  \ an EngineConfig object.\nEngineConfig config = new EngineConfig();\n\n// 设置 BIRT\
  \ home 目录的路径。\nconfig.setBIRTHome(\"C:/Program Files/birt-runtime-2_6_0/ReportEngine\"\
  );\n\n// 为非 RCP 应用程序启动平台.\ntry {\n    Platform.startup(config);\n    IReportEngineFactory\
  \ factory = (IReportEngineFactory) Platform.createFactoryObject(\n            IReportEngineFactory.EXTENSION_REPORT_ENGINE_FACTORY);\n\
  \n    // 设置嵌入 HTML 输出的图像或图表的写入。\n    HTMLRenderOption ho = new HTMLRenderOption();\n\
  \    ho.setImageHandler(new HTMLCompleteImageHandler());\n    config.setEmitterConfiguration(RenderOption.OUTPUT_FORMAT_HTML,\
  \ ho);\n\n    // 创建引擎。\n    IReportEngine engine = factory.createReportEngine(config);\n\
  } catch (BirtException e) {\n    e.printStackTrace();\n}\n```\n\n#### 如何将报告引擎设置为\
  \ Web 应用程序\n\n**1** 设置平台上下文，如代码列表 14-2 所示。\n\n**代码列表 14-2** 为 WAR 文件部署设置平台上下文\n\n\
  ```java\n// 创建报告引擎的示例类\npublic class BirtEngine {\n    private static IReportEngine\
  \ birtEngine = null;\n\n    public static synchronized IReportEngine getBirtEngine(ServletContext\
  \ sc) {\n        if (birtEngine == null) {\n            EngineConfig config = new\
  \ EngineConfig();\n            config.setBIRTHome(\"\");\n            IPlatformContext\
  \ context = new PlatformServletContext(sc);\n            config.setPlatformContext(context);\n\
  \            try {\n                Platform.startup(config);\n                IReportEngineFactory\
  \ factory = (IReportEngineFactory)\n                        Platform.createFactoryObject(IReportEngineFactory.EXTENSION_REPORT_ENGINE_FACTORY);\n\
  \                birtEngine = factory.createReportEngine(config);\n            }\
  \ catch (BirtException e) {\n                e.printStackTrace();\n            }\n\
  \        }\n        return birtEngine;\n    }\n}\n```\n\n\n\n\n\n要从设计生成报告，请如列表 14-4\
  \ 所示打开报告设计。然后，执行本章稍后显示的任务。\n\n### 如何访问报告设计\n\n列表 14-4 显示了如何打开报告设计并查找属性值。如果引擎无法打开指定的报告设计，代码将销毁引擎。变量\
  \ `engine` 是一个 `ReportEngine` 对象。\n\n**列表 14-4** 访问报告设计\n\n```java\nString designName\
  \ = \"./SimpleReport.rptdesign\";\n\nIReportRunnable runnable = null;\n\ntry {\n\
  \   runnable = engine.openReportDesign( designName );\n}\ncatch ( EngineException\
  \ e ) {\n   System.err.println ( \"Design \" + designName + \" not found!\" );\n\
  \   engine.destroy( );\n   System.exit( -1 );\n}\n// 获取简单属性的值。\nString title = (\
  \ String ) runnable.getProperty\n    ( IReportRunnable.TITLE );\n```\n\n### 理解 IReportDocument\
  \ 对象\n\n`IReportDocument` 对象提供了对二进制报告文档结构和内容的访问。`IReportDocument` 提供了检索书签（bookmark）、页面和报告设计信息的方法。书签是一个\
  \ `String` 对象，用于定位文档中报告元素的实例以及该元素所在的页面。使用页面信息可以将文档中的单个页面渲染到输出格式。书签还提供了访问生成该元素实例的设计元素的权限。\n\
  \n使用 `getBookmarks()` 方法获取包含文档中所有书签的 `List` 对象。调用带有包含书签的 `String` 参数的 `getBookmarkInstance()`\
  \ 方法来访问实例化的报告元素。调用 `getReportRunnable()` 方法返回一个 `IReportRunnable` 对象，应用程序可以使用该对象来访问报告设计信息或生成另一个报告文档。\n\
  \n在使用后，调用 `IReportDocument.close()` 关闭文档。\n\n### 如何访问报告文档\n\n列表 14-5 显示了如何打开报告文档并查找页面。如果引擎无法打开指定的报告设计，代码将记录错误。变量\
  \ `engine` 是一个 `ReportEngine` 对象。\n\n**列表 14-5** 访问报告文档\n\n```java\nString dName\
  \ = \"./SimpleReport.rptdocument\";\n\nIReportDocument doc = null;\n\ntry {\n  \
  \ doc = engine.openReportDocument( dName );\n} catch ( EngineException e ) {\n \
  \  System.err.println( \"Document \" + dName + \" not found!\" );\n   return;\n\
  }\n// 获取文档中的第二个书签。\njava.util.List bookmarks = doc.getBookmarks( );\nString bookmark\
  \ = ( String ) bookmarks.get( 1 );\nlong pageNumber = doc.getPageNumber( bookmark\
  \ );\nlogger.log(Level.INFO, bookmark + \" Page number: \" + pageNumber);\n// 关闭文档。\n\
  doc.close( );\n```\n\n#### 访问报告参数\n\n报告参数是一种报告元素，在应用程序生成报告之前为报告设计提供输入。报告文档不使用报告参数来创建格式化报告。如果应用程序已经有了设置的参数名称和值，或者报告设计中所有报告参数的默认值始终有效，或者报告源是报告文档，则你不需要执行本节的任务。\n\
  \n报告参数具有报告应用程序可以访问的属性。最常用的属性是 `name` 和 `value`。报告引擎使用报告设计逻辑和报告参数值来执行诸如过滤数据集或在报告中显示外部值等任务。\n\
  \n报告应用程序设置报告参数的值后，它必须将这些值传递给生成报告的任务，如本章稍后所示。要访问报告参数及其默认值，并将用户提供的值设置到参数，应用程序使用表 14-4\
  \ 所示的 BIRT 报告引擎 API 类和接口。\n\n**表 14-4** 支持报告参数的类和接口\n\n![image](img/14tab04.jpg)\n\
  \n应用程序可以通过名称或使用通用代码访问报告参数。如果应用程序必须能够运行任何报告设计，请使用通用代码，例如，从依赖于用户输入的列表访问报告设计。仅运行固定一组已知报告设计的应用程序可以通过名称访问报告参数。\n\
  \n### 为报告设计创建参数定义任务对象\n\n单个 `IGetParameterDefinitionTask` 对象提供了对报告设计中所有参数的访问。通过调用\
  \ `ReportEngine.createGetParameterDefinitionTask()` 为每个报告设计仅创建一个此类对象。在使用后调用其 `close()`\
  \ 方法关闭参数定义任务对象。\n\n### 测试报告设计是否具有报告参数\n\n要测试报告设计是否具有报告参数，请调用 `IGetParameterDefinitionTask`\
  \  `getParameterDefns()` 方法。该方法返回一个 `Collection`。要测试 `Collection` 是否包含元素，调用 `Collection.isEmpty()`\
  \ 方法。仅运行已知报告设计的应用程序不需要执行此任务。\n\n### 获取报告设计中的报告参数\n\n要访问已知名称的单个报告参数，使用 `IGetParameterDefinitionTask.getParameterDefn()`\
  \ 方法。此方法返回类型为 `IParameterDefnBase` 的对象。\n\n使用 `IGetParameterDefinitionTask.getParameterDefns()`\
  \ 方法返回 `IParameterDefnBase` 对象的 `Collection`。应用程序可以使用 `Iterator` 逐个访问每个报告参数。`getParameterDefns()`\
  \ 方法接受一个 `Boolean` 参数。对于参数值 `false`，该方法返回一组未分组的报告参数。对于值 `true`，该方法返回在报告设计中定义的参数组。要创建一个复刻该参数组的用户界面，请使用\
  \ `true` 的值。\n\n要检查报告参数是否为一个组，应用程序必须调用 `IParameterDefnBase.getParameterType()`。如果参数是一个组，则该方法返回\
  \ `IParameterDefnBase.PARAMETER_GROUP`；如果它是级联参数组，则返回 `IParameterDefnBase.CASCADING_PARAMETER_GROUP`。要访问组的报告参数，使用\
  \ `IParameterGroupDefn.getContents()` 方法。此方法返回一个包含 `IScalarParameterDefn` 对象的 `ArrayList`\
  \ 对象。\n\n### 获取每个报告参数的默认值\n\n此任务是可选的。要获取单个已知报告参数的默认值，使用 `IGetParameterDefinitionTask.getDefaultValue()`。此方法返回一个\
  \ `Object`。要确定该对象的有效类型，使用 `IScalarParameterDefn.getDataType()`。此方法返回一个 `int` 值，它是\
  \ `IScalarParameterDefn` 中的静态字段之一。调用 `IGetParameterDefinitionTask.getDefaultValues()`\
  \ 获取报告设计中所有参数的默认值。此方法返回一个 `HashMap` 对象，它映射了报告参数名称及其默认值。\n\n### 使用限制值获取参数的有效值\n\n\
  某些报告参数仅接受来自限制列表的值。在某些情况下，此列表是静态值列表，例如 RED、BLUE 或 GREEN。在其他情况下，列表是动态的，通过数据库查询提供有效值。例如，查询可以返回销售跟踪数据库中的销售\
  \ set。要确定有效值列表，调用方法 `IGetParameterDefinitionTask.getSelectionList()`。此方法返回一个 `IParameterSelectionChoice`\
  \ 对象的 `Collection`。`IParameterSelectionChoice` 有两个方法：`getLabel()` 返回显示文本，`getValue()`\
  \ 返回值。如果 `Collection` 为 `null`，则报告参数可以接受任何值。\n\n#### 获取每个报告参数的属性\n\n\n\n\n\n此任务是可选的。要获取报告参数的属性，请使用\
  \ `IScalarParameterDefn` 方法。应用程序可以使用这些属性来生成定制化用户界面。例如，要获取报告参数的数据类型，请使用 `getDataType()`\
  \ 方法。\n\n### 为每个报告参数收集更新后的值\n\n为了为报告参数提供新值，请提供应用程序逻辑，例如用户界面或从数据库中检索值的代码。\n\n调用 `IGetParameterDefinitionTask.setParameterValue()`\
  \ 设置参数的值。如果用户界面为日期和数字参数向您的应用程序返回 `String` 值，请在设置值之前将 `String` 转换为与区域无关的格式。要执行此任务，请在调用\
  \ `setParameterValue()` 之前先调用方法 `ReportParameterConverter.parse()`。\n\n在设置了报告参数值后，调用方法\
  \ `IGetParameterDefinitionTask.getParameterValues()`。该方法返回一个 `HashMap` 对象，其中包含了通过调用\
  \ `IGetParameterDefinitionTask.setParameterValue()` 设置的当前参数值。按照本章后后的描述，使用此 `HashMap`\
  \ 对象为报告生成设置参数值。\n\n#### 如何设置已知报告参数的值\n\nListing 14-6 中的代码示例显示了如何设置已知名称报告参数的值。该示例创建了一个\
  \ `HashMap` 对象，包含稍后运行报告将使用的参数值。变量 `engine` 是一个 `ReportEngine` 对象。变量 `runnable` 是\
  \ `IReportRunnable` 类型的对象。此示例未显示从用户界面或数据库检索参数值的详细代码细节。执行这些任务的代码取决于您的应用程序需求。\n\n\
  **Listing 14-6** 设置单个参数的值\n\n```java\n// 创建参数定义任务。\nIGetParameterDefinitionTask\
