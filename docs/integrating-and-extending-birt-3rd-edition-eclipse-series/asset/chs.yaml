  \ (Integer) event.data ).intValue( ) );\n        }\n        else if ( event.type\
  \ == LineAttributesComposite.COLOR_CHANGED_EVENT )\n        {\n            series.getWebLineAttributes(\
  \ )\n              .setColor( (ColorDefinition) event.data );\n        }\n    }\n\
  }\n```\n\n`enableLineSettings()` 方法用于禁用或启用作为线条颜色框的系列调色板。如果系列配置界面不可见，默认行为是使用系列调色板作为线条颜色并禁用复选框。如果系列配置界面可见，则启用复选框。\n\
  \n```java\nprivate void enableLineSettings( boolean isEnabled )\n{\n    if ( btnPalette\
  \ != null )\n    {\n        btnPalette.setEnabled( isEnabled );\n    }\n}\n```\n\
  \n### 运行时扩展 (Run-time-in extensions)\n\n运行时应在扩展本章第一部分描述的图表模型的插件中实现。在雷达示例中，这些扩展点在\
  \ `org.eclipse.birt.chart.examples.core` 插件中实现。接下来的章节将讨论每个扩展点：`org.eclipse.birt.chart.engine.renderers`、`org.eclipse.birt.chart.engine.datasetprocessors`\
  \ 以及 `org.eclipse.birt.chart.engine.charttypes`。\n\n### 图类型扩展点 (Chart types extension\
  \ point)\n\n图表引擎框架使用 `charttypes` 扩展点来加载自定义模型。本示例使用位于 `org.eclipse.birt.chart.examples.radar.model`\
  \ 包中的 `RadarModelLoader` 类实现了此扩展点。该类仅有一个方法，用于创建 `RadarTypePackage` 的实例。\n\n```java\n\
  public class RadarModelLoader implements IChartModelLoader\n{\n    public EPackage\
  \ getChartTypePackage( )\n    {\n        return RadarTypePackage.eINSTANCE;\n  \
  \  }\n}\n```\n\n该扩展点的 `plugin.xml` 代码段如下所示：\n\n```xml\n<extension point=\"org.eclipse.birt.chart.engine.charttypes\"\
  >\n    <chartType\n      modelLoader=\"org.eclipse.birt.chart.examples.radar.model.RadarModelLoader\"\
  \n      namespaceURI=\"http://www.birt.eclipse.org/RadarChartModelType\">\n    </chartType>\n\
  </extension>\n```\n\n### 数据处理器扩展点 (Data processor extension point)\n\n数据集处理器扩展点支持设置一个处理器类，用于处理图表系列的行导航和数据集填充。本示例只需要默认的数据集处理器，因为每个数据点只有两个值。\n\
  \n要指定默认的数据集处理器，请打开 `plugin.xml` 并添加以下代码：\n\n```xml\n<extension point=\"org.eclipse.birt.chart.engine.datasetprocessors\"\
  >\n    <datasetProcessor\n      processor=\"org.eclipse.birt.chart.extension.datafeed.DataSetProcessorImpl\"\
  \n      series=\"org.eclipse.birt.chart.examples.radar.model.type.impl.RadarSeriesImpl\"\
  />\n</extension>\n```\n\n### 模型渲染器扩展点 (Model Renderer Point)\n\n模型渲染器扩展点是示例中的最后一个扩展点。它负责渲染系列。之前的所有处理创建并修改系列。\n\
  \n所有模型渲染器必须继承两个抽象类之一：`AxesRenderer` 或 `BaseRenderer`。当系列渲染器不需要轴时，扩展 `BaseRenderer`。如果模型渲染器需要轴并需要框架生成这些轴，则扩展\
  \ `AxesRenderer`。\n\n在雷达网图中，轴以径向方式渲染，`AxesRenderer` 类目前无法处理，因此本示例扩展了 `BaseRenderer`\
  \ 类。以下代码显示了该扩展点的 `plugin.xml` 代码段：\n\n```xml\n<extension point=\"org.eclipse.birt.chart.engine.renderers\"\
  >\n    <modelRenderer\n      renderer=\"org.eclipse.birt.chart.examples.radar.render.Radar\"\
  \n      series=\"org.eclipse.birt.chart.examples.radar.model.type.impl.RadarSeriesImpl\"\
  />\n</extension>\n```\n\n`modelRenderer` 元素有两个属性：`series` 和 `renderer`。`series`\
  \ 属性包含与渲染器使用的系列类。`renderer` 属性声明要扩展的渲染器类。将此片段添加到 `plugin.xml` 并创建 `renderer` 属性中指定的包和类。在雷达示例中，使用了位于\
  \ `org.eclipse.bir.chart.examples.radar.render` 包中的 `Radar` 类，它自自 `BaseRenderer`\
  \ 类。\n\n`BaseRenderer` 类实现了 `ISeriesRenderer` 接口，为模型渲染器提供一组便利方法。这些方法在本书中未讨论。更多信息请参见\
  \ Javadoc。\n\n`ISeriesRenderer` 接口包含以下方法，系列渲染器必须实现这些方法，因为抽象 `BaseRenderer` 类没有实现：\n\
  \n- `Compute()`：由图表引擎框架在图表引擎 `build()` 方法返回用于渲染图表的 `GenerateChartState` 对象之前调用。此方法为系列渲染器提供了对待渲染数据进行预处理的机会。\n\
  - `renderLegendGraphic()`：在渲染图例图形时调用。例如，使用指定的系列颜色和标记渲染折线图中的图例线条。\n\n\n\n\n\n###\
  \ `renderSeries()`\n\n框架在渲染特定类型系列的系列图形时，会为每个系列调用此方法。\n\n在讨论这些方法的具体实现之前，本节将提供关于图表引擎绘制框架工作原理的简单介绍。所有模型渲染器都会接收一个实现了\
  \ `IPrimitiveRenderer` 接口的对象实例。该对象通过实现 `org.eclipse.birt.chart.engine.devicerenderers`\
  \ 扩展点来渲染原始图形。\n\n`IPrimitiveRenderer` 接口描述了诸如 `drawCircle()`、`drawRectangle()` 和\
  \ `fillOval()` 等方法。这种方法将模型渲染器与编写图表实际输出的底层机制隔离开来。新的模型渲染器可以在像 BIRT 等使用图表引擎现有框架中运行。\n\
  \n每个原始图形渲染方法都需要一个参数来定义要绘制的对象。例如，绘制一条线需要起点和终点。该参数对象是扩展抽象类 `PrimitiveRenderEvent`\
  \ 的对象实例。\n\n`PrimitiveRenderEvent` 包含了所有对象类型通用的信息，例如背景颜色和线条属性，具体类必须实现这些信息。每个原始图形渲染方法都有一个相关的特定类，该类继承自\
  \ `PrimitiveRenderEvent` 类。\n\n目前，BIRT 为 `SWT`、`Swing`、`BMP`、`JPG`、`PNG`、`SVG` 和\
  \ `PDF` 格式提供了设备渲染器，如图图 23-24 所示。\n\n**图 23-24** 实现和扩展设备渲染器\n\n![image](img/23fig24.jpg)\n\
  \n例如，drawLine()` 方法传递一个 `LineRenderEvent` 对象。该类定义了线的起点、终点以及线条属性等属性。请参考 Javadoc 以查找为特定渲染事件对象设置的所有必需方法。\n\
  \n假设模型渲染器接收了 `ipr` 对象，它是 `SWTRendererImpl` 类的实例，该类实现了 `IPrimitiveRenderer` 接口。可以通过先设置\
  \ `LineRenderEvent` (`myLre`) 事件，然后调用 `ipr.drawLine(myLre)` 来绘制线条。\n\n为了提高性能，图表引擎还使用了事件对象缓存。该缓存存储了之前创建的\
  \ `RenderEvent` 对象以便重用，并封装在 `EventObjectCache` 类中。设备渲染器提供了一个方便的方法从缓存中检索对象。如果缓存中不存在该事件对象，将创建它、将其存储在缓存中并返回。\n\
  \n`getEventObject()` 方法两个参数：`source` 和 `type`。`source` 参数标识事件源自渲染框架的部分。`type` 参数指定实现该事件的类。\n\
  \n为了创建 `source` 参数，BIRT 提供了 `StructureSource` 类，它拥有创建各种框架源的方法。例如，在渲染图例时，可以使用 `StructureSource.createLegend()`\
  \ 方法创建 `source` 参数。在渲染系列时，使用 `StructureSource.createSeries()` 方法。\n\n`source` 参数被框架的各个方面（如交互函数）使用。`StructureSource`\
  \ 类还被 `WrappedStructureSource` 类扩展，该类提供了 `StructureSource` 子组件的细节。例如，在渲染数据点时，使用\
  \ `WrappedStructureSource.createSeriesDataPoint()` 方法，将系列以及特定的数据点值作为源传递。。请查看 `StructureSource`\
  \ 和 `WrappedStructureSource` 的 Javadoc 以查找可以创建哪些特定的源。\n\n在 `renderLegendGraphic()`\
  \ 方法中可以创建一个线条渲染事件，如下代码所示：\n\n```\nfinal LineRenderEvent lre = (LineRenderEvent)\
  \ ((EventObjectCache)\n    ipr).getEventObject(StructureSource.createLegend(lg),\n\
  \    LineRenderEvent.class);\n```\n\n然后为渲染事件对象填充适当的值，并作为参数传递给原始渲染器对象的 `drawLine()`\
  \ 方法。\n\n对于设计时系列，可以生成许多运行时系列。例如，当系列被分组时，这种情况通常需要复制或创建图表 EMF 模型中定义的新对象。\n\n为了帮助快速创建这些对象，BIRT\
  \ 提供了一个工厂类 `GObjectFactory`，它为图表模型的部分提供了创建和复制方法。为了访问对象工厂，提供了一个实例方法。示例中使用了以下行代码：\n\
  \n```java\nprotected final static IGObjectFactory goFactory =\n    GObjectFactory.instance();\n\
  ```\n\n图表引擎还提供了两个工具类，模型渲染器可以使用这些类来控制系列内部以及系列之间的 z 序（z-ordering）。这两个类是 `DeferredCache`\
  \ 和 `DeferredCacheManager`。\n\n`DeferredCacheManager` 在图表创建的渲染阶段设置，该实例在许多情况下可供所有模型渲染和框架使用。该类设计用于操作一个或多个\
  \ `DeferredCache` 实例，允许一个或多个系列的绘制事件在适当时间被缓存和刷新。\n\n对于 2D 图表，每个运行时系列都会创建一个 `DeferredCache`\
  \ 实例；或者对于 3D、带深度 2D 以及专门定义仅使用一个缓存的 2D 使用一个实例。`DeferredCache` 类提供了实用方法将渲染事件添加到缓存中，例如\
  \ `addLine()`、`addPlane()` 或 `addLabel()`。在适当的情况下，这些方法允许传递 z 序值。\n\n模型渲染器可以调用特定的刷新方法在处理过程中的特定时间绘制元素。为了简化雷达图示例，并不经常使用延迟缓存机制。\n\
  \n\n\n\n\n```java\n((EventObjectCache) ipr)\n    .getEventObject( StructureSource.create(\
  \ lg ),\n        LineRenderEvent.class );\nif ( fPaletteEntry instanceof ColorDefinition\
  \ &&\n    ( ls.isSetPaletteLineColor( ) &&\n        ls.isPaletteLineColor( ) ) )\n\
  {\n    liaMarker = goFactory.copyOf( liaMarker );\n    liaMarker.setColor( goFactory.copyOf(\
  \ FillUtil.getColor(\n        fPaletteEntry ) ) );\n}\nlre.setLineAttributes( liaMarker\
  \ );\nlre.setStart( LocationImpl.create( bo.getLeft( ) + 1,\n    bo.getTop( )#NAME?/\
  \ 2 ) );\nlre.setEnd( LocationImpl.create( bo.getLeft( ) +\n    bo.getWidth( ) -\
  \ 1,\n    bo.getTop( ) + bo.getHeight( ) / 2 ) );\nipr.drawLine( lre );\n}\n```\n\
  \n接下来，标记将使用基渲染器类提供的便利方法进行渲染，该方法处理标记的绘制。该方法名为 `renderMarker()`，并传递了边界、调色板项和设备渲染器等各种值。`renderLegendGraphic()`\
  \ 方法此后续部分的代码见列表 23-13 。\n\n**列表 23-13** `renderLegendGraphic()`（继续）\n\n```java\n\
  SeriesDefinition sd = getSeriesDefinition( );\nfinal boolean bPaletteByCategory\
  \ = isPaletteByCategory( );\nif ( bPaletteByCategory && ls.eContainer( )\n    instanceof\
  \ SeriesDefinition )\n{\n    sd = (SeriesDefinition) ls.eContainer( );\n}\n    int\
