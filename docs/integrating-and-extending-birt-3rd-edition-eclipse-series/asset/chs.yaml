  ## 理解示例中的 Hibernate ODA 用户界面扩展\n\n以下章节描述了开发者在 Eclipse PDE 中定义插件框架后，为了完成 Hibernate\
  \ ODA 用户界面扩展开发而必须进行的基于代码的扩展。\n\nHibernate ODA 用户界面插件实现了以下类：\n\n- `HibernatePropertyPage`：创建并初始化用于指定\
  \ ODA 数据源的属性页编辑器控件。该类根据从表单收集到的值更新连接配置文件的属性。`HibernatePropertyPage` 继承自 `org.eclipse.datatools.connectivity.oda.design.ui.wizards.DataSourceEditorPage`，后者是实现自定义\
  \ ODA 数据源属性页的抽象基类。\n\n- `HibernatePageHelper`：实现指定数据源属性的用户界面。该工具类指定了页面布局，设置了监听用户输入的控件，验证了\
  \ Hibernate 配置文件的位置，并设置了映射目录的位置。`HibernateDataSourceWizard` 和 `HibernatePropertyPage`\
  \ 类使用了 `HibernatePageHelper`。`HibernatePageHelper` 也继承自 `org.eclipse.datatools.connectivity.oda.design.ui.wizards.DataSourceEditorPage`。\n\
  \n- `HibernateDataSourceWizard`：创建并初始化数据源向导页的控件。该类设置了配置文件消息并收集属性值。在 `newDataSourceWizard`\
  \ 的扩展元素设置中，`pageClass` 属性将此类指定为 `dataSourceUI` 向导的实现类。`HibernateDataSourceWizard`\
  \ 类继承自 `org.eclipse.datatools.connectivity.oda.design.ui.wizards.DataSourceWizardPage`，后者是实现自定义\
  \ ODA 数据源向导页的抽象基类。\n\n- `HibernateHqlSelectionPage`：创建指定 HQL 语句的用户界面。Hibernate ODA\
  \ 用户界面插件在创建或修改数据源的数据集时会调用 `HibernateHqlSelectionPage`。在 `dataSetPage` 的扩展元素设置中，`wizardPageClass`\
  \ 属性将此类指定为 `dataSetUI` 页面向导的实现类。`HibernateHqlSelectionPage` 也继承自 `org.eclipse.datatools.connectivity.oda.design.ui.wizards.DataSourceWizardPage`。\n\
  \n- `Messages`：此类以及相关的属性文件 `messages.properties` 用于生成在 Hibernate ODA 用户界面中显示的消息。\n\
  \n### 理解 HibernatePageHelper\n\n该类通过以下方法创建选择 Hibernate 配置文件和映射文件目录的组件：\n\n- `createCustomControl()`：构建数据源的用户界面\n\
  - `initCustomControl()`：设置初始属性值\n- `collectCustomProperties()`：将修改后的属性返回给 ODA 框架\n\
  \n当数据源页面显示时，当 `setPageComplete()` 方法指示页面完成后，“完成（Finish）按钮将变为可用。\n\n`HibernateDataSourceWizard.createPageCustomControl()`\
  \ 和 `HibernatePropertyPage.createAndInitCustomControl()` 调用了 `HibernatePageHelper`。`createCustomControl()`\
  \ 方法是该类的入口。\n\n列表 20-51 显示 `createCustomControl()` 方法的代码。\n\n**列表 20-51** `createCustomControl()`\
  \ 方法\n\n```java\nvoid createCustomControl( Composite parent )\n{\n    Composite\
  \ content = new Composite( parent, SWT.NULL );\n    GridLayout layout = new GridLayout(\
  \ 3, false );\n    content.setLayout(layout);\n    setupConfigLocation( content\
  \ );\n    setupMapLocation( content );\n}\n```\n\n`setupConfigLocation()` 方法设置配置文件的位置。`setupMapLocation()`\
  \ 方法设置映射文件夹。这两个方法执行类似的任务。\n\n列表 20-52 显示 `setupConfigLocation()` 方法的代码。该方法添加了一个标签、一个文本输入组件和一个按钮。文本输入组件有一个\
  \ `ModifyListener()` 方法，用于验证所选文件是否存在；按钮有一个 `SelectionAdapter()` 方法，它使用 `FileDialog()`\
  \ 方法访问配置文件。\n\n**列表 20-52** `setupConfigLocation()` 方法\n\n```java\nprivate void\
  \ setupConfigLocation( Composite composite )\n{\n    Label label = new Label( composite,\
  \ SWT.NONE );\n    label.setText(\"Select Config File\" );\n    GridData data =\
  \ new GridData( GridData.FILL_HORIZONTAL );\n    m_configLocation = new Text( composite,\
  \ SWT.BORDER );\n    m_configLocation.setLayoutData( data );\n    m_configLocation.setPageComplete(\
  \ true );\n    m_configLocation.addModifyListener( new ModifyListener() {\n    \
  \    public void modifyText( ModifyEvent e )\n        {\n            verifyConfigLocation(\
  \ );\n        }\n    } );\n    m_browseConfigButton = new Button( composite, SWT.NONE\
  \ );\n    m_browseConfigButton.setText( \"...\" );\n    m_browseConfigButton.addSelectionListener(\
  \ new SelectionAdapter() {\n        public void widgetSelected( SelectionEvent e\
  \ )\n        {\n            FileDialog dialog = new FileDialog( m_configLocation.getShell()\
  \ );\n            if( m_configLocation.getText() != null && m_configLocation.getText().trim().length()\
  \ > 0 )\n            {\n                dialog.setFilterPath( m_configLocation.getText()\
  \ );\n            }\n            dialog.setText( \"Select Config File\" );\n   \
  \         String selectedLocation = dialog.open( );\n            if( selectedLocation\
  \ != null )\n            {\n                m_configLocation.setText( selectedLocation\
  \ );\n            }\n        }\n    } );\n}\n```\n\n`initCustomControl()` 方法初始化属性设置。插件从\
  \ `HibernateDataSourceWizard` 类的 `createPageCustomControl()` 和 `setInitialProperties()`\
  \ 方法以及 `HibernatePropertyPage` 类的 `createAndInitCustomControl()` 方法将属性传递给该方法。\n\n\
  `initCustomControl()` 方法获取 Hibernate 配置和映射文件目录的属性并设置组件值。\n\n列表 20-53 显示 `initCustomControl()`\
  \ 方法的代码。\n\n**列表 20-53** `initCustomControl()` 方法\n\n```java\nvoid initCustomControl(\
  \ Properties profileProps )\n{\n    setPageComplete( true );\n    setMessage( DEFAULT_MESSAGE,\
  \ IMessageProvider.NONE );\n    if( profileProps == null || profileProps.isEmpty()\
  \ || m_configLocation == null )\n    {\n        return;\n    }\n    String configPath\
  \ = profileProps.getProperty( \"HIBCONFIG\" );\n    if( configPath == null )\n \
  \   configPath = EMPTY_STRING;\n    m_configLocation.setText( configPath );\n  \
  \  String mapPath = profileProps.getProperty( \"MAPDIR\" );\n    if( mapPath ==\
  \ null )\n    mapPath = EMPTY_STRING;\n    m_mapLocation.setText( mapPath );\n}\n\
  ```\n\n\n\n\n\n```\nverifyConfigLocation( );\n\n}\n```\n\n当用户点击“完成”或“测试连接”按钮时，插件会调用\
  \ `collectCustomProperties()` 方法来获取 Hibernate 文件和映射文件目录的新值。`HibernateDataSourceWizard`\
  \ 和 `HibernatePropertyPage` 类会从它们的 `collectCustomProperties()` 方法调用 `HibernatePageHelper.collectCustomProperties()`\
  \ 方法。\n\n[Listing 20-54] 显示了 `collectCustomProperties()` 方法的代码。\n\n### Listing 20-54\
  \ `collectCustomProperties()` 方法\n\n```java\nProperties collectCustomProperties(\
  \ Properties props )\n{\n    if( props == null )\n        props = new Properties(\
  \ );\n    props.setProperty( \"HIBCONFIG\", getConfig( ) );\n    props.setProperty(\
  \ \"MAPDIR\", getMapDir( ) );\n    return props;\n}\n```\n\n#### 理解 HibernateDataSourceWizard\n\
  \n`HibernateDataSourceWizard` 类通过实现三个 ODA 框架调用的方法扩展了 `DTP DataSourceWizardPage`：\n\
  \n- `createPageCustomControl()`：构建用户界面\n- `setInitialProperties()`：设置用户界面的初始值\n\
  - `collectCustomProperties()`：获取修改后的值\n\n该类创建 `HibernatePageHelper` 类，并使用前面描述的方法来处理这三个方法。ODA\
  \ 框架使用该类来创建新的数据源。\n\n#### 理解 HibernatePropertyPage\n\n`HibernatePropertyPage` 类通过实现两个\
  \ ODA 框架调用的方法扩展了 `DTP DataSourceEditorPage`：\n\n- `createAndInitCustomControl()`：构建用户界面并设置初始值\n\
  - `collectCustomProperties()`：获取修改后的值\n\n该类创建 `HibernatePageHelper` 类，并使用前面描述的方法来处理这两个方法。ODA\
  \ 框架使用该类来创建新的数据源。\n\n#### 理解 HibernateHqlSelectionPage\n\n`HibernateHqlSelectionPage`\
  \ 类扩展了 `DataSetWizardPage`，用于 Hibernate ODA 数据集向导定义页面控件和相关功能。`HibernateHqlSelectionPage`\
  \ 允许用户创建一个 HQL 语句来选择数据集，并将该 HQL 语句嵌入报告设计中。该页面通过 `dataSource` 扩展中 `dataSetPage` 元素的\
  \ `wizardPageClass` 属性链接到 Hibernate ODA。\n\n`HibernateHqlSelectionPage` 类实现了以下方法：\n\
  \n- `createPageControl()`：此方法执行以下操作：\n    - 使用一系列 `GridLayout` 和 `GridData` 对象设置一组组合控件，以创建数据集编辑器用户界面\n\
  \    - 设置用户提示以输入 HQL 语句并验证查询\n    - 添加文本控件允许用户输入和修改文本\n    - 在文本控件上添加 `ModifyListener`\
  \ 以检测用户输入\n    - 设置“验证查询”按钮并添加 `SelectionListener` 以检测用户何时选了该按钮\n    - 返回组合页面控件\n\
  \n[Listing 20-55] 显示了 `createPageControl()` 方法的代码。\n\n### Listing 20-55 `createPageControl()`\
  \ 方法\n\n```java\npublic Control createPageControl( Composite parent )\n{\n    Composite\
  \ composite = new Composite( parent, SWT.NONE );\n    GridLayout layout = new GridLayout(\
  \ );\n    layout.numColumns = 1;\n    composite.setLayout( layout );\n    Label\
  \ label = new Label( composite, SWT.NONE );\n    label.setText( Messages.getString(\
  \ \"wizard.title.selectColumns\" }));\n    GridData data = new GridData( GridData.FILL_BOTH\
  \ );\n    queryText = new Text( composite, SWT.MULTI | SWT.WRAP | SWT.V_SCROLL );\n\
  \    queryText.setLayoutData( data );\n    queryText.addModifyListener( new ModifyListener(\
  \ )\n    {\n        public void modifyText( ModifyEvent e )\n        {\n       \
  \     if( m_initialized == false)\n            {\n                setPageComplete(true);\n\
  \                m_initialized = true;\n            }\n            else\n      \
  \      {\n                setPageComplete(false);\n            }\n        }\n  \
  \  } );\n    setPageComplete( false );\n    Composite cBottom = new Composite( composite,\
  \ SWT.NONE );\n    cBottom.setLayoutData( new GridData( GridData.FILL_HORIZONTAL\
  \ ) );\n    cBottom.setLayout( new RowLayout( ) );\n    queryButton = new Button(\
  \ cBottom, SWT.NONE );\n    queryButton.setText(Messages.getString( \"wizard.title.verify\"\
  \ ));\n    queryButton.addSelectionListener( new SelectionAdapter( )\n    {\n  \
  \      public void widgetSelected( SelectionEvent event )\n        {\n         \
  \   verifyQuery();\n        }\n    } );\n    return composite;\n}\n```\n\n- `initializeControl()`：插件调用此方法从当前设计中检索\
  \ HQL 查询，并用此值初始化 HQL 文本。`initializeControl()` 还从报告设计中读取 Hibernate 配置和映射目录，并将它们存储在成员变量中以便构建查询。[Listing\
  \ 20-56] 显示了 `initializeControl()` 方法的代码。\n\n### Listing 20-56 `initializeControl()`\
  \ 方法\n\n```java\nprivate void initializeControl( )\n{\n    Properties dataSourceProps\
  \ = getInitializationDesign().getDataSourceDesign().getPublicProperties();\n   \
  \ m_hibconfig = dataSourceProps.getProperty( \"HIBCONFIG\" );\n    m_mapdir = dataSourceProps.getProperty(\
  \ \"MAPDIR\" );\n    DataSetDesign dataSetDesign = getInitializationDesign();\n\
  \    if( dataSetDesign == null )\n        return;\n    String queryTextTmp = dataSetDesign.getQueryText(\
  \ );\n    if( queryTextTmp == null )\n        return;\n    queryText.setText( queryTextTmp\
  \ );\n    m_initialized = false;\n    setMessage( \"\", NONE );\n}```\n\n- `verifyQuery()`：此方法在用户选择“验证查询”按钮时被调用。`verifyQuery`\
  \ 执行以下操作：\n    - 打开运行时环境的连接\n    - 实例化 `Query` 对象并获取用户输入的查询\n    - 准备查询\n    - 检查列以判断查询准备是否成功。根据查询准备的结果，`verifyQuery()`指示页面处理完成或未完成。\n\
  \    - 重新启用“验证查询”按钮\n    - 关闭连接。[Listing 20-57] 显示了 `verifyQuery()` 方法的代码。\n\n###\
  \ Listing 20-57 `verifyQuery()` 方法\n\n```java\nboolean verifyQuery( )\n{\n    setMessage(\
  \ \"正在验证查询\", INFORMATION );\n    setPageComplete( false );\n    queryButton.setEnabled(\
  \ false );\n    Connection conn = new Connection( );\n    try\n    {\n        Properties\
  \ prop = new Properties( );\n        if( m_hibconfig == null)m_hibconfig = \"\"\
  ;\n        if( m_mapdir == null)m_mapdir = \"\";\n        prop.put(\"HIBCONFIG\"\
  , m_hibconfig );\n        prop.put(\"MAPDIR\", m_mapdir);\n        conn.open( prop\
  \ );\n        IQuery query = conn.newQuery( \"\" );\n        query.prepare( queryText.getText(\
  \ ) );\n        int columnCount = query.getMetaData( ).getColumnCount();\n     \
  \   if ( columnCount == 0 )\n        {\n            setPageComplete( false );\n\
  \            return false;\n        }\n        setPageComplete( true );\n      \
  \  return true;\n    }\n    catch ( OdaException e )\n    {\n        System.out.println(\
  \ e.getMessage( ) );\n        showError( \"ODA Exception\", e.getMessage( ) );\n\
  \        setPageComplete( false );\n        return false;\n    }\n    catch ( Exception\
  \ e )\n    {\n        System.out.println( e.getMessage( ) );\n        showError(\
  \ \"Verify Exception\", e.getMessage( ) );\n        setPageComplete( false );\n\
  \        return false;\n    }\n    finally\n    {\n        try\n        {\n    \
  \        queryButton.setEnabled( true );\n            conn.close( );\n        }\n\
  \        catch ( OdaException e )\n        {\n            System.out.println( e.getMessage(\
  \ ) );\n            setMessage( e.getLocalizedMessage( ), ERROR );e.getMessage(\
  \ ) );\n        }\n    }\n}\n```\n\n\n\n\n\n```java\nsetPageComplete( false );\n\
  return false;\n}\n}\n```\n\n### `savePage()`\n\n当 ODA 框架调用 `collectDataSetDesign()`\
  \ 方法时，会调用 `savePage()` 方法。此操作发生在用户点击新数据集向导上的“完成”按钮或点击数据集编辑器上的“确定”按钮时。`savePage()`\
  \ 方法会将查询保存到报告中，如列表 20-58 所示。\n\n**列表 20-58** `savePage()` 方法\n\n```java\nprivate\
  \ boolean savePage( )\n{\n   IConnection conn = null;\n   try\n   {\n      IDriver\
  \ hqDriver = new HibernateDriver( );\n      conn = hqDriver.getConnection( null\
  \ );\n      IResultSetMetaData metadata =\n          getResultSetMetaData( dataSetDesign\n\
  \            .getQueryText( ), conn );\n      setResultSetMetaData( dataSetDesign,\
  \ metadata );\n   }\n   catch( OdaException e )\n   {\n      dataSetDesign.setResultSets(\
  \ null );\n   }\n   finally\n   {\n      closeConnection( conn );\n   }\n}\n```\n\
  \n### `getResultSetMetaData()`\n\n在保存报告设计时，`savePage()` 方法会调用 `getResultSetMetaData()`\
  \ 方法。该方法检索 `setResultSetMetaData()` 用于创建数据集列的查询元数据。\n\n列表 20-59 显示了 `getResultSetMetaData()`\
  \ 方法的代码。\n\n**列表 20-59** `getResultSetMetaData()` 方法\n\n```java\nprivate IResultSetMetaData\
  \ getResultSetMetaData\n    ( String queryText, IConnection conn )\n    throws OdaException\n\
  {\n      java.util.Properties prop =\n          new java.util.Properties( );\n \
  \     if( m_hibconfig == null) m_hibconfig = \"\";\n      if( m_mapdir == null)\
  \ m_mapdir = \"\";\n      prop.put( \"HIBCONFIG\", m_hibconfig );\n      prop.put(\
  \ \"MAPDIR\", m_mapdir );\n      conSn.open( prop );\n      IQuery query = conn.newQuery(\
  \ null );\n      query.prepare( queryText );\n      return query.getMetaData( );\n\
  }\n```\n\n### `setResultSetMetaData()`\n\n在保存报告设计时，`savePage()` 方法会调用 `setResultSetMetaData()`\
  \ 方法。该方法使用查询的 `DataSetDesign` 和 `ResultSetMetaData` 对象在数据集中创建列，以便用于报告设计。\n\n列表 20-60\
  \ 显示了 `setResultSetMetaData()` 方法的代码。\n\n**列表 20-60** `setResultSetMetaData()` 方法\n\
  \n```java\nprivate void setResultSetMetaData\n    ( DataSetDesign dataSetDesign,\n\
  \      IResultSetMetaData md ) throws OdaException\n{\nResultSetColumns columns\
  \ =\n      DesignSessionUtil.toResultSetColumnsDesign( md );\n   ResultSetDefinition\
  \ resultSetDefn =\n      DesignFactory.eINSTANCE\n      .createResultSetDefinition(\
  \ );\n   resultSetDefn.setResultSetColumns( columns );\n   dataSetDesign.setPrimaryResultSet(\
  \ resultSetDefn );\n   dataSetDesign.getResultSets().setDerivedMetaData( true );\n\
  }\n```\n\n### `collectDataSetDesign()`\n\n插件在创建或修改查询时调用此方法。插件将当前设计传递给此方法。`collectDataSetDesign()`\
  \ 随后验证查询是否存在，并将设计查询设置为查询文本的值。`savePage()` 方法保存该设计并在数据集中创建列。列表 20-61 显示了 `collectDataSetDesign()`\
  \ 方法的代码。\n\n**列表 20-61** `collectDataSetDesign()` 方法\n\n```java\nprotected DataSetDesign\
  \ collectDataSetDesign\n    ( DataSetDesign design )\n{\nif( ! hasValidData( ) )\n\
  \   return design;\ndesign.setQueryText( queryText.getText( ) );\nsavePage( design\
  \ );\nreturn design;\n}\n```\n\n#### 构建 Hibernate ODA 用户界面\n\n要要使用 PDE Manifest\
  \ 编辑器构建 `org.eclipse.birt.data.oda.hibernate.ui` 插件，请执行以下任务：\n- 在 `Build` 中，指定 `Build\
  \ Configuration`（构建配置）以包含以下项目：\n- 在 `Runtime Information` 中，添加 `hibernateodai.jar`\
  \ 文件。\n- 在 `Binary Build` 中，选择以下文件和文件夹：\n    - `META-INF`\n    - `plugin.xml`\n\n\
  `Build Configuration` 会出现，如图 20-26 所示。\n\n**图 20-26** 构建配置设置\n![image](img/20fig26.jpg)\n\
  \n#### 测试 Hibernate ODA 用户界面\n\n要测试 Hibernate ODA 用户界面插件，在导出后，使用 Eclipse PDE 工作空间的运行配置（run\
  \ configuration）。\n\n**如何启动 Hibernate ODA 用户界面插件**\n1. 从 SDK 菜单中选择 `Run—Run Configurations`。在\
  \ `Run Configurations` 上，右键点击 `Eclipse Application`。选择 `New`。\n2. 执行以下任务以创建一个启动\
  \ Eclipse 应用程序的配置：\n    - 在 `Name` 中，输入：`Hibernate ODA Test`。\n    - 在 `Main` 的\
