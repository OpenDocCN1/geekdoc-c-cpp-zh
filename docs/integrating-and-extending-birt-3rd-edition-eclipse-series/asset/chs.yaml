  \            ChartException.GENERATION,ex );\n    }\n}\n```\n\n图表引擎为每个生成的运行时系列调用\
  \ `renderSeries()` 方法。该方法计算数据集的最小值和最大值并存储在类变量中。这些值被用于缩放雷达图。然后调用系列的渲染方法。列表 23-15\
  \ 中的代码展示了实现此功能的 `getMinMax()` 和 `renderSeries()` 方法。\n\n**列表 23-15** `getMinMax()`\
