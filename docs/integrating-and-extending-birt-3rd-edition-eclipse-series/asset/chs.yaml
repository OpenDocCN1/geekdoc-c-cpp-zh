  \ newChart );\n    return newChart;\n}\n```\n\n私有的 `getConvertedChart()` 方法在图表构建器切换图表类型时由\
  \ `getModel()` 调用，允许在设计会期间保留模型的更改。该方法中的大部分代码侧重于将一种类型图表的值复制到另一种图表，如列表 23-5 所示。\n\n\
  ### 列表 23-5 `getConvertedChart()` 方法\n\n```java\nprivate Chart getConvertedChart(\
  \ Chart currentChart, String sSubType,\n  String sDimension )\n{\n    Chart helperModel\
  \ = (Chart) EcoreUtil.copy( currentChart );\n    helperModel.Adapters().addAll(\
