  \n当异常被捕获、未捕获或两者兼有时，都可以停止执行。断点将出现在断点视图中，如图 12-14\n\n在处理复杂报告时，使用异常断点调试非常有帮助。例如，如果报告中的某列具有无效的数据类型，每次运行报告时，报告引擎都会抛出\
  \ `DataException`。如果报告使用了多个数据集或库，则很难找到准确的列定义。在这种情况下，为 `DataException` 添加异常断点并调试报告。当\
  \ `DataException` 再次发生时，调试器会在特定断点处停止执行。在变量（Variables）视图中检查当前报告上下文，以识别数据集名称和库名称。`reportContext`\
  \ 和 `rowInstance` 变量如图 12-15\n\n### 创建调试配置\n\n使用标准的 Eclipse 调试启动配置界面启动报告调试器。在配置页面上设置特定的报告调试器选项。理想情况下，报告和代码调试仅使用一种启动配置类型。要在调试透视图中运行报告，通过选择运行（Run）→调试配置（Debug\
  \ Configurations）创建报告调试配置。图 12-16 显示了“主”（Main）页，该页包含报告调试配置类型的关键配置设置。\n\n**图 12-16**\
  \ 报告调试配置设置\n\n![image](img/12fig16.jpg)\n\n在“主”页中，配置以下设置：\n\n• 名称（Name）\n调试配置的名称。良好的做法是使用报告名称作为配置名称，以便区分多个配置。\n\
  \n• 报告文件名（Report file name）\n要调试的报告文件路径。根据任务类型，可以对调试报告设计或报告文档。\n\n• 引擎主路径（Engine\
  \ home）\nBIRT 报告引擎的主路径。默认情况下，BIRT 使用与启动调试器相同的引擎。指定外部引擎主路径以使用不同版本的 BIRT 运行时库测试报告。外部报告引擎主路径通常指向\
  \ BIRT 运行时文件夹，例如 `C:\\birt-runtime-2_6_0\\ReportEngine`。\n\n• 临时文件夹（Temp folder）\n\
  报告调试过程的临时工作文件夹。默认情况下，此文件夹为系统临时文件夹。\n\n• 任务类型（Task type）\n调试过程使用的引擎类型。表 12-2 列出了可用类型：\n\
  \n**表 12-2** 调试报告的任务类型\n\n![image](img/12tab02.jpg)\n\n• 调试类型（Debug Type）\n可选调试类型：全部、Java\
  \ 或 JavaScript。\n\n• 输出（Output）\n可选输出格式：DOC、HTML、PDF、PostScript、PPT 或 XLS。\n\n要在调试过程完成后打开生成的文件，请选择“完成后打开文件”（Open\
  \ generated file when finished）。\n\n启动调试配置建立了调试器与运行报告之间的连接。随后可以使用断点、单步执行或表达式求\n\n\
  ### 如何创建调试配置\n\n本部分显示了如何创建一个调试 BIRT 报告的启动配置。报告名称为 `ProductsByLineDBG.rptdesign`。\n\
