  \n## 开发 Hibernate ODA 扩展\n\n要开发 Hibernate ODA 扩展，请 Eclipse PDE 中创建两个新项目。这两个项目实现了以下插件：\n\
  \n- `org.eclipse.birt.report.data.oda.hibernate`\n\nHibernate ODA 驱动使用 `HQL` 访问关系型数据源。Hibernate\
  \ ODA 数据源插件扩展了由 `org.eclipse.datatools.connectivity.oda.dataSource` 扩展点定义的功能，以创建\
  \ Hibernate ODA 驱动。\n\n- `org.eclipse.birt.report.data.oda.hibernate.ui`\n\nBIRT\
  \ Report Designer 的 Hibernate ODA 用户界面插件用于选择 Hibernate 数据源，并支持创建 `HQL` 语句以从可用表和列中检索数据。Hibernate\
  \ ODA 用户界面插件扩展了由 `org.eclipse.datatools.connectivity.oda.design.ui.dataSource`、`org.eclipse.ui.propertyPages`\
  \ 和 `org.eclipse.datatools.connectivity.connectionProfile` 扩展点定义的功能。\n\n界面由以下页面组成：\n\
  \n### 数据源页\n在可用数据列表中包含 Hibernate 数据源。Hibernate ODA 驱动包含预配置的 Hibernate 配置和映射文件，这些文件连接到\
  \ BIRT 演示数据库的 MySQL 版本 `ClassicModels`。\n\n### 数据集页\n创建一个 `HQL` 语句来选择数据集，并将 `HQL`\
  \ 语句嵌入报告设计中。\n\n在 BIRT Report Designer 中，Hibernate ODA 数据源向导支持选择包含预配置的 Hibernate\
  \ 配置和映射文件的 Hibernate ODA 驱动。Hibernate ODA 驱动会在插件的 `hibfiles` 目录搜索这些配置和映射文件。\n\n\
  Hibernate ODA 驱动还会在 `hibfiles` 目录搜索 JAR 和 ZIP 文件，并在 `org.eclipse.birt.report.data.oda.jdbc`\
  \ 插件中搜索 JDBC 驱动程序以添加到类路径中。这种方法避免了将驱动程序复制到多个位置的需要。注意，更改配置会导致 Hibernate ODA 驱动插件重新构建\
  \ `SessionFactory`，这是一项计算密集型操作。\n\n一旦 Hibernate ODA 驱动创建了数据源配置，就可以创建数据集。Hibernate\
  \ 数据集向导允许用户输入 `HQL` 语句。Hibernate ODA 用户界面示例仅支持简单查询，例如以下类型的语句：\n\n```sql\nFrom Customer\n\
  or:\nSelect ord.orderNumber,cus.customerNumber, cus.customerName\nfrom Orders as\
  \ ord, Customer as cus\nwhere ord.customerNumber = cus.customerNumber and\n  cus.customerNumber\
  \ = 363\n```\n\n在 Hibernate ODA 插件中，有一个 `exampleconfig` 目录。该目录包含一个示例 Hibernate 配置文件、映射文件以及连接到\
  \ BIRT 示例 MySQL 数据库的 Java 类。按照以下步骤使用这些文件测试插件：\n\n- 修改 `hibernate.cfg.file` 连接你的数据库配置。\n\
  - 将这些文件复制到 `hibfiles` 目录。\n- 创建一个包含 Java 类的 JAR 文件。\n\n你可以在 Eclipse PDE 运行时环境中测试并部署扩展。\n\
