  \ 和 `scriptapi.jar` 文件。这些库在 BIRT 运行时包中提供。从 Eclipse BIRT 网站下载 BIRT 报告引擎运行时归档文件（`.zip`），`birt-runtime-2_6_0.zip`。在你的环境中解压缩该文件。\n\
