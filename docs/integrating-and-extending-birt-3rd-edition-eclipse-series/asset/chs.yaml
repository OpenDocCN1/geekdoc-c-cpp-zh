  \n点击 Finish。出现 Extensions，如图 19-5 所示。\n\n**图 19-5** Extensions 页面上的插件扩展\n\n![image](img/19fig05.jpg)\n\
  \nAll Extensions 列出了扩展点 `org.eclipse.birt.report.engine.emitters` 和扩展元素 `emitter`。Extension\
  \ Element Details 包含了 `emitters.exsd` 架构文件中的元素列表。\n\n**4** 在 `Extension Element\
  \ Details` 中为为发射器扩展元素 `emitter` 指定属性，如表 19-3\n\n出现 Extension Element Details，如图\
  \ 19-6\n\nPDE Manifest Editor 会自动更新 plugin.xml。\n\n#### 理解示例 CSV 报告渲染扩展\n\n本章描述的\
  \ CSV 报告渲染扩展是一个简化的示例，展示了如何使用 Eclipse PDE 创建报告渲染插件。该扩展扩展了 `org.eclipse.birt.report.engine.emitters`\
  \ 中的报告发射器接口。\n\n\n\n\n\nCSV 报告渲染扩展示例仅将表格元素呈现的数据导出到 CSV 输出文件。CSV 输出文件的每一行仅包含用逗号分隔的列数据。示例\
  \ CSV 报告发射器不导出图像、图表或超链接。\n\n该扩展示例在导出的报告相同的文件夹中创建 CSV 输出文件。输出文件名由报告名加上 `.csv` 扩展名组成。该扩展示例不支持嵌套表格。\n\
  \n接下来的章节将泛述开发者在 Eclipse PDE 中定义插件框架后，为了完成 CSV 报告渲染扩展的开发而必须进行的基于代码的扩展工作。\n\n## 理解\
  \ CSV 报告渲染扩展包\n\nCSV 报告渲染扩展示例的实现包 `org.eclipse.birt.report.engine.emitter.csv` 包含以下类：\n\
  \n- `CSVPlugin`：定义启动、管理和停止插件实例的方法。\n- `CSVRenderOption`：将插件与 BIRT 报告引擎集成，指定配置信息。`CSVRenderOption`\
  \ 继承自 `RenderOption`，指定输出格式为 CSV。\n- `CSVReportEmitter`：继承自 `org.eclipse.birt.report.engine.emitter.ContentEmitterAdapter`。`CSVReportEmitter`\
  \ 处理渲染报告容器的开始和结束处理。\n- `CSVTags.java`：定义了写入 CSV 文件时使用的逗号和换行符字符串设置。\n- `CSVWriter`：`CSVWriter`\
  \ 通过调用 `java.io.PrintWriter.print()` 将报告的数据和标签内容写入 CSV 文件。`CSVWriter` 还使用 `org.eclipse.birt.report.engine.emitter.XMLWriter`\
  \ 结合 `java.util.logging.Logger` 在指定的级别写入日志消息。\n\n后续章节包含有关 CSV 报告渲染扩展包中类的具体实现细节信息。\n\
  \n### 理解 CSVReportEmitter\n\n`CSVReportEmitter` 是继承自 `ContentEmitterAdapter` 的类，用于将报告项目的文本内容输出到\
  \ CSV 文件。`CSVReportEmitter` 实例化写入器和发射器对象。\n\n`CSVReportEmitter` 实现了以下方法：\n\n- `CSVReportEmitter()`：将\
  \ CSV 报告发射器类实例化为 `org.eclipse.birt.report.engine.presentation.ContentEmitterVisitor`\
  \ 对象，以执行发射器操作，如 Listing 19-1 所示。\n\n**Listing 19-1** `CSVReportEmitter()` 构造函数\n\
  \n```java\npublic CSVReportEmitter( )\n{\n   contentVisitor = new ContentEmitterVisitor(\
  \ this );\n}\n```\n\n- `initialize()`：执行以下操作，以创建一个将报告文本内容写入 CSV 文件的输出流：\n    - 获取\
  \ `IEmitterServices` 接口的引用。使用指定的设置实例化文件和输出流对象。\n    - 实例化 CSV 写入器对象。\n\nListing\
  \ 19-2 显示 `initialize()` 方法。\n\n**Listing 19-2** `initialize()` 方法\n\n```java\n\
  public void initialize( IEmitterServices services )\n{\n   this.services = services;\n\
  \   Object fd = services.getOption\n      ( RenderOptionBase.OUTPUT_FILE_NAME );\n\
  \   File file = null;\n   try\n   {\n      if ( fd != null )\n      {\n        \
  \ file = new File( fd.toString( ) );\n         File parent = file.getParentFile(\
  \ );\n         if ( parent != null && !parent.exists( ) )\n         {\n        \
  \    parent.mkdirs( );\n         }\n         out = new BufferedOutputStream( new\n\
  \            FileOutputStream( file ) );\n      }\n   }\n   catch ( FileNotFoundException\
  \ e )\n   {\n      logger.log( Level.WARNING, e.getMessage( ), e );\n   }\n   if\
  \ ( out == null )\n   {\n      Object value = services.getOption\n          ( RenderOptionBase.OUTPUT_STREAM\
  \ );\n      if ( value != null && value instanceof OutputStream )\n      {\n   \
  \      out = (OutputStream) value;\n      } else\n      {\n         try\n      \
  \   {\n            file = new File( REPORT_FILE );\n            out =\n        \
  \       new BufferedOutputStream\n                  ( new FileOutputStream( file\
  \ ) );\n         }\n         catch ( FileNotFoundException e )\n         {\n   \
  \         logger.log( Level.SEVERE, e.getMessage( ), e );\n         }\n      }\n\
  \   }\n}\n```\n\n`CSVReportEmitter` 是继承自 `ContentEmitterAdapter` 的类，用于将报告项目的文本内容输出到\
  \ CSV 文件。`CSVReportEmitter` 实例化写入器和发射器对象。\n\n### 理解其他 CSVReportEmitter 方法\n\n`CSVReportEmitter`\
  \ 定义了以下方法并在不同阶段被调用，提供对发射器、选项和样式信息的访问：\n\n- `startTable()`：在写入 CSV 文件时，CSV 渲染会考虑行中除最后一个单元格外的单元格位置。`startTable()`\
  \ 使用 `ITableContent.getColumn()` 获取表格编号信息并初始化 `columnNumbers` 变量，如 Listing 19-5\
  \ 所示。\n\n**Listing 19-5** `startTable()` 方法\n\n```java\npublic void startTable(\
  \ ITableContent table )\n{\n   assert table != null;\n   ...\n}\n```\n\n- `startRow()`：在每行的开始处，`startRow()`\
  \ 执行以下操作：\n    - 调用 `isRowInFooterBand()` 确定行是否在表格或组的页眉或页脚带中。\n    - 如果当前元素属于表格页头、页脚或图像，则将\
  \ `exportElement` 设置为 `false`，因为该扩展将标签和数据导出到 CSV 文件。\n    - 将 `currentColumn` 指针置为\
  \ 0。\n\nListing 19-6 显示 `startRow()` 代码。\n\n**Listing 19-6** `startRow()` 方法\n\n\
  ```java\npublic void startRow( IRowContent row )\n{\n   assert row != null;\n  \
  \ if ( tableDepth > 1) {\n      logger.log( Level.FINE, \"[CSVTableEmitter] Nested\
  \ tables are not supported.\" );\n      return;\n   }\n   if ( isRowInFooterBand(\
  \ row ) )\n      exportElement = false;\n   }\n   currentColumn = 0;\n}\n```\n\n\
  - `isRowInFooterBand()`：如果行是带内容的实例，`isRowInFooterBand()` 会检查带的类型。如果带类型为页脚，则该方法返回\
  \ `true`，如 Listing 19-7 所示。\n\n**Listing 19-7** `isRowInFooterBand()` 方法\n\n```java\n\
  boolean isRowInFooterBand( IRowContent row )\n{\n   IElement parent = row.getParent(\
  \ );\n   if ( !( parent instanceof IBandContent ) )\n   {\n      return false;\n\
  \   }\n   IBandContent band = ( IBandContent )parent;\n   if ( band.getBandType(\
  \ ) == IBandContent.BAND_FOOTER )\n   {\n      return true;\n   }\n   return false;\n\
  }\n```\n\n- `startText()`\n\n\n\n\n\n如果元素是可导出的，`startText()` 将文本值写入 CSV 输出文件，如列表\
  \ 19-8 所示。\n\n**列表 19-8** `startText()` 方法\n\n```java\npublic void startText( ITextContent\
  \ text )\n{\n   if ( tableDepth > 1) {\n      logger.log( Level.FINE,\n        \
  \  \"[CSVTableEmitter] Nested tables are not supported.\"\n          );\n      return;\n\
  \   }\n   String textValue = text.getText( );\n   if (exportElement)\n   {\n   \
  \   writer.text( textValue );\n   }\n}\n```\n\n- • `endCell()`\n如果当前单元格不是行的最后一列且元素是可导出的，`endCell()`\
  \ 向 CSV 输出文件写入一个逗号，如列表 19-9 所示。\n\n**列表 19-9** `endCell()` 方法\n\n```java\npublic\
  \ void endCell( ICellContent cell )\n{\n   if ( ( currentColumn < columnNumbers\
  \ )\n      && exportElement )\n   {\n      writer.closeTag( CSVTags.TAG_COMMA );\n\
  \   }\n}\n```\n\n- • `endRow()`\n在每一行的结束处，如果元素是可导出的，`endRow()` 向 CSV 输出文件写入换行符或回车符，如列表\
  \ 19-10 所示。\n\n**列表 19-10** `endRow()` 方法\n\n```java\npublic void endRow( IRowContent\
  \ row )\n   if ( exportTableElement )\n      writer.closeTag( CSVTags.TAG_CR );\n\
  \n   exportElement = true;\n}\n```\n\n### 理解 CSVTags\n`CSVTags` 类定义了逗号和换行标签的内容，如列表\
  \ 19-11 所示。\n\n**列表 19-11** `CSVTags` 类\n\n```java\npublic class CSVTags\n{\n  \
  \ public static final String TAG_COMMA = \",\" ;\n   public static final String\
  \ TAG_CR = \"\\n\" ;\n}\n```\n\n### 理解 CSVWriter\n`CSVWriter` 类写入在 `CSVTags` 中定义的结束标签，如列表\
  \ 19-12 所示。\n\n**列表 19-12** `closeTag()` 方法\n\n```java\npublic void closeTag( String\
  \ tagName )\n{\n   printWriter.print( tagName );\n}\n```\n\n### 理解 CSVRenderOption\n\
  `org.eclipse.birt.report.engine.emitter.csv.CSVRenderOption` 类继承自 `org.eclipse.birt.report.engine.api.RenderOption`，用于将\
  \ CSV 渲染选项添加到 BIRT Report Engine 运行时，如列表 19-13 所示。\n\n**列表 19-13** `CSVRenderOption`\
  \ 类\n\n```java\npublic class CSVRenderOption extends RenderOption {\n   public static\
  \ final String CSV = \"CSV\";\n      public CSVRenderOption( ) {\n   }\n}\n```\n\
