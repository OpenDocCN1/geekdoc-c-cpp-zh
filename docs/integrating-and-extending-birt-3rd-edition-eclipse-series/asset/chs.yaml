  \n# 术语表\n\n# 索引\n\n## 前言\n\n有一种常见的误区，认为 Eclipse 项目仅仅关注为开发者提供出色的工具。实际上，人们的期望要高得多。每个\
  \ Eclipse 项目都被预期同时提供框架和可扩展的、典范的工具。正如任何尝试过考虑重用和扩展性来编写软件的人所知，这比简单地编写一个工具要困难得多。\n\n\
  “Exemplary”（典范的/卓越）是英语中一个具有两个含义的常用单词。在上述用法中，这两个含义都被兼顾了。Eclipse 项目提供的工具在“典范”的意义上是卓越的，因为它们提供了使用底层框架的范例。Eclipse\
  \ 工具还旨在在“卓越”的意义上是典范的，因为它们非常好，并为使用它们的开发者提供了即时的实用。\n\n自 BIRT 项目成立以来，一直致力于创建可重用的框架和可扩展的工具。本书主要关注如何扩展\
  \ BIRT 以及如何在你自己的应用程序和产品中使用 BIRT。因此，它展示了 BIRT 作为一种嵌入式报告解决方案日益成熟的价值。\n\n作为 Eclipse\
  \ 基金会的执行董事，我对 BIRT 团队自 2004 年 9 月项目启动以来取得的巨大进展感到高兴，同时也对围绕它已经发展起来的充满活力的社区感到同样高兴。当你使用\
  \ BIRT 以及书中描述的功能时，我鼓励你将你的成功经验回馈社区，并可能考虑贡献你开发的任何有趣的扩展。BIRT 网站可以在此处找到：\n\n`http://www.eclipse.org/birt`\n\
  \n它包含了指向 BIRT 新闻组的链接（你可以在那里与其他 BIRT 开发者交流并分享结果），以及指向 Eclipse 安装版 Bugzilla 的链接（你可以在那里贡献你的扩展）。如果你喜欢\
  \ BIRT——我相信这本书将帮助你爱上它——请参与并做出贡献。毕竟，社区的力量是衡量任何开源项目成功的真正标准。\n\nMike Milinkovich\n\n\
  Eclipse 基金会执行董事\n\n## 前言\n\n### 关于本书\n\n这是关于商业智能和报告技术两部曲丛中的第二本——《Integrating and\
  \ Extending BIRT》（集成与扩展 BIRT），向编程人员介绍了 BIRT 架构和报告框架。它的伴侣书籍《BIRT: A Field Guide》（BIRT：实战指南）向报告开发者展示了如何使用\
  \ BIRT Report Designer 的图形化工具创建报告。BIRT 构建在开源 Eclipse 平台上，是一个强大的报告系统，提供了从端到端的解决方案，从创建和部署报告到将报告能力集成到企业应用程序中。\n\
  \nBIRT 技术让程序员能够使用脚本和 BIRT API 构建自定义报告。本书告知报告开发者如何编写可以实现以下作用的脚本：\n\n• 定制化报告生成过程\n\
  • 在报告中加入复杂的业务逻辑\n\n本书还告知应用程序开发者如何：\n\n• 调试和部署报告\n• 将报告能力集成到其他应用程序中\n• 扩展 BIRT 功能\n\
  \n程序员可以使用 Eclipse 插件开发环境 (PDE) 创建新插件来扩展 BIRT 框架。本书提供了大量的示例，展示了如何构建插件以扩展 BIRT 框架的功能。这些示例的源代码可以在\
  \ `http://www.actuate.com/birt/contributions` 下载。\n\n本书讨论的主题包括：\n\n• 安装和部署 BIRT\n\
  • 将 BIRT 报告部署到应用程序服务器上\n• 了解 BIRT 架构\n• 在 BIRT 报告设计中使用脚本\n• 将 BIRT 功能集成到应用程序中\n\
  • 使用 BIRT 扩展框架工作\n\n此修订后的 BIRT 2.6 版本增加了以下新内容：\n\n• 更新的架构图\n• 扩展的脚本示例\n• 调试事件处理器（Event\
  \ Handlers）\n• 开发带有数据绑定的高级报告项\n• 开发数据提取（Data Extraction）\n\n开发图表扩展\n\n### 谁应该读本书\n\
  \n本书面向具有编程背景的人士。这些读者可以归类为：\n\n• 嵌入者和集成者\n这些人员通过软件将其集成到自己的应用程序基础设施中。\n\n• 扩展者\n这些人员利用\
  \ API 和其他扩展点来增加功能，或在当前相互分离的组件或服务之间建立新的互操作性。\n\n在报告设计中编写脚本需要具备 JavaScript 或 Java\
  \ 知识。更高级的任务（如扩展 BIRT 的功能）需要 Java 开发经验以及对 Eclipse 平台的熟悉。\n\n### 本书内容\n\n本书分为几个部分。以下章节描述了每个部分的内容。\n\
  \n#### 第一部分，安装和部署 BIRT\n\n第一部分介绍了当前可 BIRT 报告包、安装的先决条件以及安装和更新这些包的步骤。第一部分包含以下章节：\n\
  \n• 第 1 章：介绍 BIRT 报告设计器。BIRT 在 Eclipse 网站上以可下载的压缩包 (.zip) 文件提供了若干独立包。本章描述了每个可用包的先决条件。\n\
  • 第 2 章：安装 BIRT 报告设计器。BIRT 两个报告设计器作为独立的包，它们是 Eclipse 网站上可下载的压缩包 (.zip) 文件。本章描述了安装每个可用报告设计器所需的步骤。\n\
  • 第 3 章：安装其他 BIRT 包。本章描述了安装和更新每个可用包所需的步骤。\n• 第 4 章：将 BIRT 报告部署到应用程序服务器上。本章介绍了通过应用程序服务器（如\
  \ Apache Tomcat、IBM WebSphere 或 BEA WebLogic）分发报告。本章中的指令提供了关于将 BIRT 报告部署到 Apache\
  \ Tomcat 6.0 的详细指导。通过这些指令，开发者可以推导出如何部署到其他版本。\n\n#### 第二部分，了解 BIRT 框架\n\n\n\n\n\n\
  第 2 部分 介绍了 BIRT 架构和报告对象模型 (ROM)，并提供了背景信息，帮助程序员以程序化的方式设计或修改报告，而不是使用 BIRT Report Designer\
  \ 中的图形化工具。第 2 部分 包含以下章节：\n\n- 第 5 章。理解 BIRT 架构。本章提供了 BIRT 及其组件的架构概述，包括 BIRT 组件之间的关系以及\
  \ BIRT 与 Eclipse 和 Eclipse 框架之间的关系。架构图说明并澄清了组件之间的关系和工作流。本章还对所有主要的 BIRT 组件进行了简要概述。\n\
  - 第 6 章。理解报告对象模型。本章提供了 BIRT `ROM` 的概述。`ROM` 是一组 XML 元素的规范，这些元素定义了组成报告设计的视觉和非视觉元素。`ROM`\
  \ 规范包含了这些元素的属性、方法以及元素之间的关系。\n\n## 第 3 部分，报告设计中的脚本\n\n第 3 部分 描述了报告开发者如何通过编写 Java\
  \ 或 JavaScript 事件处理程序脚本来自定义和增强 BIRT 报告。第 3 部分 包含以下章节：\n\n- 第 7 章。在报告设计中使用脚本。本章介绍了如何使用\
  \ Java 或 JavaScript 编写 BIRT 事件处理器脚本，包括使用其中一种语言相对于另一种语言的优缺点。BIRT 事件处理器与数据集、数据源和报告项目相关。BIRT\
  \ 在报告处理过程中会在特定时间触发特定事件。本章识别了 BIRT 触发的事件并描述了事件的触发顺序。\n- 第 8 章。使用 JavaScript 编写事件处理器。本章讨论了使用\
  \ JavaScript 编写 BIRT 事件处理器的编码环境和编码考虑。本章描述了开发者可以使用的几个 BIRT JavaScript 对象，用于获取和设置影响最终报告的属性。BIRT\
  \ JavaScript 编码环境提供了事件处理器中可用的属性和函数的弹出列表。JavaScript 事件处理器也可以使用 Java 类。本章包含一个描述创建\
  \ JavaScript 事件处理器过程的教程。\n- 第 9 章。使用 Java 编写事件处理器。本章讨论了如何使用 Java 编写 BIRT 事件处理器。BIRT\
  \ 提供了 Java 适配器类，协助开发者创建 Java 事件处理器。报告开发者使用 BIRT Report Designer 的属性编辑器将 Java 事件处理器类与适当的报告元素关联。本章包含一个教程，逐步介绍了\
  \ Java 事件处理器的开发和部署过程。本章还描述了事件处理器方法及其参数。\n- 第 10 章。图图表事件处理器。本章描述了用于图表引擎的 BIRT 事件处理器模型。该模型与标准\
  \ BIRT 报告元素的模型类似，并支持 Java 和 JavaScript 环境。本章提供了这两个环境的详细信息。图表引擎在 BIRT 之外使用时也支持此事件模型。\n\
  - 第 11 章。使用脚本访问数据。本章描述了如何使用 JavaScript 代码访问数据源。使用 JavaScript 访问的数据源被称为脚本数据源。通过脚本数据源，你可以访问\
  \ SQL、XML 或文本文件数据源以外的对象。脚本数据源可以是 EJB、XML 流、Hibernate 对象或任何其他检索数据的 Java 对象。\n- 第\
  \ 12 章。调试事件处理器。本章描述了如何使用 BIRT 报告调试器调试用 JavaScript 和 Java 编写的 BIRT 报告和事件处理器。BIRT\
  \ 报告调试器允许用户逐步运行报告、设置断点、检查实例属性并在特定上下文观察和评估变量值。调试器帮助高级报告开发者快速发现报告设计中的错误，并便于在运行时理解和识别异常。本章提供了一个关于调试\
  \ Java 和 JavaScript 报告事件处理器的逐步说明教程。\n\n## 第 4 部分，将 BIRT 集成到应用程序\n\n第 4 部分 描述了 Java\
  \ 开发者可使用的公共 API（扩展 API 除外）。第 4 部分 包含以下章节：\n\n- 第 13 章。理解 BIRT API。本章介绍了 BIRT 的公共\
  \ API，位于三个层次结构中的类和接口：\n    - 报告引擎 API，位于 `org.eclipse.birt.report.engine.api` 层次结构，支持自定义报告生成器的开发者。\n\
  \    - 设计引擎 API，位于 `org.eclipse.birt.report.engine.api` 层次结构，支持自定义报告的设计。\n    -\
  \ 图表引擎 API，位于 `org.eclipse.birt.chart` 层次结构，用于开发自定义生成器。\n- 第 14 章。使用 BIRT API 进行编程](#ch14.html_ch14)。本章描述了报告应用程序的基本要求，并列出了用于创建报告应用程序的\
  \ BIRT API 类和接口。本章描述了报告应用程序所需的任务，并概述了如何构建报告应用程序。`org.eclipse.birt.report.engine.api`\
  \ 包支持从报告设计生成报告的过程。`org.eclipse.birt.report.model.api` 包支持创建新的报告设计和修改现有报告设计。\n- 第\
  \ 15 章。使用 BIRT 图表 API 进行编程](#ch15.html_ch15)。本章描述了图表应用程序的要求，无论是独立环境还是作为报告应用程序的一部分。`org.eclipse.birt.chart`\
  \ 包层次结构提供了 BIRT 中的图表功能。通过描述图表应用程序所需的的基本任务，本章介绍了用于创建图表的 API 类和接口。本章还描述了 chart examples-plugin\
  \ 中的图表编程示例。\n\n## 第 5 部分，使用扩展框架\n\n第 5 部分 向 Java 程序员展示如何向 BIRT 框架添加新功能。通过基于 Eclipse\
  \ 平台构建，BIRT 提供了一种让 Eclipse 插件开发者熟悉的扩展机制。此部分还为需要访问完整 BIRT 开源库的开发者提供了有关如何构建 BIRT 项目的信息。第\
  \ 5 部分 包含以下章节：\n\n- 第 16 章。构建 BIRT 项目](#ch16.html_ch16)。本章解释了如何下载 BIRT 2.6 源代码并为开发构建\
  \ BIRT 项目。本章描述了如何配置 Eclipse 工作空间、下载 BIRT 源代码并构建 BIRT 报告和 Web 查看器。\n- 第 17 章。扩展 BIRT](#ch17.html_ch17)。本章提供了\
  \ BIRT 扩展框架的概述，并描述了如何使用 Eclipse 插件开发环境 (PDE) 和 BIRT 扩展点来创建、构建和部署 BIRT 扩展。\n\n\n\n\
  \n\n# 第 18 章：开发报告项扩展\n\n本章描述了如何开发报告项扩展。旋转文本扩展示例是一个插件，它将报告项的文本渲染为图像。该扩展会旋转报告设计中的图像，以便以指定的角度显示文本。本章描述了如何构建旋转文本报告项插件，并使用定义的扩展点（extension\
  \ points）将该报告项添加到 `BIRT Report Designer` 中。\n\n# 第 19 章：开发报告渲染扩展\n\n本章描述了如何使用 `Eclipse\
  \ PDE` 开发报告渲染扩展，并以 CSV 和 XML 报告渲染扩展作为示例。本章描述了如何使用定义的扩展点扩展发射器接口（emitter interfaces），以构建并部署一个运行在\
  \ `BIRT Report Engine` 环境中的自定义报告渲染插件。\n\n# 第 20 章：开发 ODA 扩展\n\n本章描述了如何开发多种类型的 DTP\
  \ ODA 扩展。`CSV` ODA 驱动示例是一个从 `CSV` 文件读取数据的插件。`Hibernate` ODA 驱动示例使用 `Hibernate Query\
  \ Language` (`HQL`) 提供了一种 SQL 透明的扩展，使 ODA 扩展能够适用于所有关系型数据库。本章展示了如何为 `BIRT Report\
  \ Designer 2.6.0` 用户界面开发 ODA 扩展，允许报告设计人员选择扩展的 ODA 驱动程序。\n\n# 第 21 章：开发数据提取扩展\n\n\
  本章描述了如何使用 `Eclipse PDE` 开发报告数据提取扩展。数据提取示例将报告数据导出为 `XML` 格式。`Eclipse PDE` 为该扩展提供了基础。\n\
  \n# 第 22 章：开发片段（Fragment）\n\n本章描述了如何构建一个片段。`BIRT Report Engine` 环境支持插件片段（plug-in\
  \ fragments）。插件片段是一个单独加载的包，用于为现有插件添加功能，例如国家语言支持（`NLS`）本地化应用程序中的特定语言特性。本章中的示例创建了一个\
  \ `Java` 资源包，为 `org.eclipse.birt.report.viewer` 插件的 `messages.properties` 文件中定义的消息添加翻译。\n\
  \n# 第 23 章：开发图表扩展\n\n本章讨论了向 `BIRT` 图表引擎添加新图表类型的过程。`BIRT` 提供了一个雷达图类型作为图表引擎的示例，展示了如何构建新的图表类型。本章描述了如何创建这个雷达图示例。\n\
  \n*词汇表*（Glossary）包含了有助于理解书中所有部分的术语表。\n\n### 排版规范\n\n`Table P-1` 描述了书中使用的排版规范。\n\n\
