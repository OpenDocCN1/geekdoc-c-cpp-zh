  \ 属性\n\n![image](img/18fig21.jpg)\n\n这些设置完成了报表模型的定义。下一步是创建一个 `RotatedTextItem` 类。该类定义了访问报表属性的基本方法。\n\
  \n\n\n\n\n```java\nRotatedTextItem( ExtendedItemHandle modelHandle )\n{\n    this.modelHandle\
