  \n向导在第一次填充特定图表类型的维度选择或在第一次创建特定图表类型的工作模型时，调用 `getDefaultDimension()` 方法。每当在图表类型之间切换时，使用\
  \ `getModel()` 方法调用私有方法 `getDimensionFor()`。该方法使用之前选择的图表的维度。\n\n在此过程中，图表类型根据当前的工作会话自动指定维度。例如，当创建\
  \ 3D 柱状图且用户将其更改为面积图时，新图表也会变为 3D。在示例中，图表维度被设置为 2D，以覆盖传递给方法的任何维度，因为该示例仅支持 2D，如下所示：\n\
  \n```java\nprivate static final String[ ] saDimensions = new String[]{\n    TWO_DIMENSION_TYPE\n\
  };\n\npublic String[ ] getSupportedDimensions( )\n{\n    return saDimensions;\n\
  }\n\npublic String getDefaultDimension( )\n{\n    return saDimensions[0];\n}\nprivate\
