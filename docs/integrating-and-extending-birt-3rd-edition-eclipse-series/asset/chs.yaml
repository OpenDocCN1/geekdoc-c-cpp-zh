  #### 创建插件内容\n\nXML 架构规定了当你在 Eclipse 中创建扩展时遵循的语法。当你在 PDE 的 Extensions 页中选择一个扩展的元素时，Eclipse\
  \ 会使用 XML 架构在 Extension Details 部分填充该元素的有效属性和值的列表。\n\n1. 在 `PDE Manifest Editor`\
  \ 中，选择 `Extensions`。\n2. 在 `All Extensions` 中，右键点击 `org.eclipse.birt.report.designer.ui.reportitemUI`\
