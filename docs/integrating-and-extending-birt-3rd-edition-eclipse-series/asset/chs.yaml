  \ 理解旋转标签报告项扩展\n\n旋转标签报告项插件提供了运行时所需的功能，以便在报告设计和显示中将报告项的标签渲染为图像，并在指定的角度显示标签。以下章节包含了旋转标签报告项扩展中最重要的类的实现细节。\n\
  \n### 理解 RotatedLabelItemFactoryImpl\n\n`RotatedLabelItemFactoryImpl` 类在用户从面板调色板（Palette）拖动旋转标签报告项并将其放入\
