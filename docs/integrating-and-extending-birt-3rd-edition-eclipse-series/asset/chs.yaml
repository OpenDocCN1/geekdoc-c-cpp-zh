  \n# 第 21 章. 开发数据提取扩展\n\n本章描述了如何使用 Eclipse PDE 开发报告数据提取扩展。数据提取示例将报表数据导出为 XML 格式。Eclipse\
  \ PDE 为该扩展提供了基础。\n\n## 理解数据提取扩展\n\nBIRT Report Engine 提供了一个数据提取扩展点，支持开发新的插件，以将报告数据导出为自定义格式。BIRT\
  \ 用户界面还提供了内置的数据提取功能，可以以 CSV 格式从报告文档中导出数据。此功能在 BIRT Web Viewer 中可用。在 BIRT Web Viewer\
  \ 的工具栏中可以找到 Data Export（导出数据）功能，如图 21-1 所示。\n\n#### 图 21-1 BIRT Web Viewer 工具栏\n\
  \n![image](img/21fig01.jpg)\n\n用户可以使用 Export Data 选择要导出的数据列、导出格式、数据编码和其他属性，如图 21-2\
  \ 所示。\n\n#### 图 21-2 Export Data 菜单\n\n![image](img/21fig02.jpg)\n\n数据提取扩展通过实现扩展点\
  \ `org.eclipse.birt.report.engine.dataExtraction`，向 BIRT Report Engine 框架添加一个插件。XML\
  \ 架构文件 `org.eclipse.birt.report.engine/schema/dataExtraction.exsd` 描述了该扩展点。\n\n\
  数据提取扩展点使演示引擎能够支持新的输出格式。BIRT 插件注册表使用此扩展点来发现为报告引擎环境指定的所有支持输出格式。Export Data 菜单在 Export\
  \ format 列表中列出所有可用格式。\n\n本章中的 XML 数据提取扩展提供了一个如何创建数据提取扩展的示例。\n\n您可以在 [`www.actuate.com/birt/contributions`](http://www.actuate.com/birt/contributions)\
  \ 下载 XML 数据提取扩展示例的源代码。有关参考文档，请参阅 Eclipse Help 中 BIRT Report Engine API 的 Javadoc，对应\
  \ `org.eclipse.birt.report.engine.dataextraction` 和 `org.eclipse.birt.report.engine.content`\
  \ 包。\n\n### 开发 XML 数据提取扩展\n\n示例 XML 数据提取扩展是一个可以以 XML 格式导出 BIRT 报告数据的插件。通常情况下，报告开发者会将\
  \ BIRT 报告数据渲染为 XML，以便与其他应用程序共享数据。XML 数据提取扩展扩展了 `org.eclipse.birt.report.engine.dataExtraction`\
  \ 包定义的功能，该包是 `org.eclipse.birt.report.engine.dataextraction` 插件的一部分。在开发 XML 数据提取扩展的过程中，您需要执行以下任务：\n\
  \n- 在 Eclipse PDE 中创建 XML 数据提取扩展项目\n- 定义依赖关系\n- 声明插件扩展点\n- 实现插件接口\n- 测试扩展\n\n####\
  \ 创建 XML 数据提取插件项目\n\n使用 Eclipse PDE 为 XML 数据提取扩展创建一个新的插件项目。\n\n##### 如何创建 XML 数据提取插件项目\n\
  \n**1** 从 Eclipse PDE 菜单中，选择 File→New→Project。出现 New Project（新项目）。\n\n**2** 在 New\
  \ Project 中，选择 Plug-in Project（插件项目）。点击 Next（下一步）。出现 New Plug-in Project。\n\n**3**\
  \ 在 Plug-in Project 中，修改设置，如表 21-1 所示。\n\n#### 表 21-1 XML 数据提取插件项目的设置\n\n![image](img/21tab01.jpg)\n\
  \n出现 Plug-in Project，如图 21-3 所示。点击 Next。出现 Plug-in Content（插件内容）。\n\n#### 图 21-3\
  \ 指定插件项目设置\n\n![image](img/21fig03.jpg)\n\n**4** 在 Plug-in Content 中，修改设置，如表 21-2\
  \ 所示。\n\n#### 表 21-2 XML 数据提取插件内容的设置\n\n![image](img/21tab02.jpg)\n\n出现 Plug-in\
  \ Content，如图 21-4 所示。点击 Finish（完成）。\n\n#### 图 21-4 指定插件内容设置\n\n![image](img/21fig04.jpg)\n\
  \nXML 数据提取扩展项目出现在 Eclipse PDE 工作区中，如图 21-5 所示。\n\n#### 图 21-5 数据提取扩展\n\n![image](img/21fig05.jpg)\n\
  \n#### 定义依赖关系\n\n要编译和运行 XML 数据提取扩展，需要为扩展指定类路径上可用的插件列表。\n\n##### 如何指定依赖关系\n\n**1**\
  \ 在 PDE Manifest Editor 上，选择 Overview（概述）。\n\n**2** 在 Plug-in Content 中，选择 Dependencies（依赖关系）。\n\
  \n**3** 在 Dependencies 中，点击 Add（添加）。出现 Plug-in Selection（插件选择）。\n\n**1** 在 Plug-in\
  \ Selection 中，按住 CTRL 并选择以下\n- `org.eclipse.birt.report.engine.dataextraction`\n\
  - `org.eclipse.birt.report.engine`\n- [com.ibm.icu](http://com.ibm.icu)\n\n**2**\
  \ 点击 OK。出现 Dependencies，如图 21-6 所示。\n\n#### 图 21-6 Dependencies 页面\n\n![image](img/21fig06.jpg)\n\
  \n### 声明扩展点\n\n在这一步中，指定实现 XML 数据提取所需的扩展点并添加扩展详情。扩展点 `org.eclipse.birt.report.engine.dataExtraction`\
  \ 为扩展设置以下属性：\n\n- ID：扩展实例的可选标识符\n- Name：扩展实例的可选名称\n\n扩展点定义了如何创建一个新的数据提取扩展以自定义方式提取数据。扩展点定义了以下扩展元素属性：\n\
  \n- id：数据提取扩展的可选标识符\n- format：该数据提取扩展支持的格式\n- class：实现 `IDataExtractionExtension`\
  \ 的 Java 类\n- mimeType：文件的 MIME 类型，例如 `xml`\n- name：扩展名称\n- isHidden：用于判断是否在 UI\
  \ 显示\n\n使用 Eclipse PDE 指定扩展点和扩展详情。\n\n##### 如何指定扩展点\n\n**1** 在 PDE Manifest Editor\
  \ 上，选择 Extensions（扩展）。\n\n**2** 在 All Extensions 中，点击 Add。出现 New Extension—Extension\
  \ Point Selection。\n\n**3** 在 Available extension points 中，选择以下扩展点：\n`org.eclipse.birt.report.engine.dataExtraction`\n\
  \n出现 Extensions 界面，如图 21-7 所示。点击 Finish。\n\n#### 图 21-7 选择数据提取扩展点\n\n![image](img/21fig07.jpg)\n\
  \nAll Extensions 列出了扩展点。Extension Details 包含了 XML 架构文件 [dataExtraction.exsd](http://dataExtraction.exsd)\
  \ 中指定的扩展详情列表。\n\n**4** 在 All Extensions 中，选择扩展点 `org.eclipse.birt.report.engine.dataExtraction`。出现\
  \ Extension Element Details。\n\n**5** 在 Extension Element Details 中，为数据提取扩展元素指定属性，如表\
  \ 21-3 所示。\n\n#### 表 21-3 数据提取扩展元素的属性值\n\n![image](img/21tab03.jpg)\n\n出现 Extension\
  \ Element Details，如图 21-8 所示。PDE Manifest Editor 会更新 `plugin.xml`。\n\n\n\n\n\n#\
  \ 图 21-8 发射器扩展的属性值\n\n![image](img/21fig08.jpg)\n\n## 理解 XML 数据提取扩展\n\n本章描述的 XML\
  \ 数据提取扩展示例说明了如何创建一个插件扩展，将报告的全部或部分数据转换为 XML 格式。XML 数据提取扩展示例仅将在“导出数据”菜单中选中的数据导出到输出文件。导出数据功能在\
  \ BIRT Web Viewer 中可用。\n\n此扩展示例创建了 XML 输出流并将该流发送到浏览器。通常情况下，浏览器会显示一条下载消息，提示用户选择查看或保存\
  \ XML 输出。\n\n此行为取决于浏览器以及如何配置与 XML MIME 类型文件的配合。如果用户将插件扩展属性中的 MIME 类型更改为 `text/plain`，则浏览器将显示\
  \ XML 文件而不是显示下载消息。\n\n接下来的部分提供了开发者为完成 XML 数据提取扩展开发必须编写的代码的通用描述。\n\n## 实现数据提取接口\n\
  \n`org.eclipse.birt.report.engine.api` 和 `org.eclipse.birt.report.engine.dataextraction`\
  \ 插件定义了用于提取数据并将其格式化为指定格式的数据提取接口。XML 数据提取扩展实现了以下接口和类：\n\n* `org.eclipse.birt.report.engine.extension.IDataExtractionExtension`\
  \ 定义了三个方法，用于在数据提取过程中初始化资源、输出提取的数据以及释放分配的资源。输出方法的目的是处理结果集中的元数据并按所需的格式格式化输出。建议扩展接口\
  \ `DataExtractionExtensionBase` 的实现类而不是接口本身，这是一项最佳实践。\n* `org.eclipse.birt.report.engine.api.IExtractionResults`\
  \ 提供了检索结果集元数据的 API。\n* `org.eclipse.birt.report.engine.api.IDataExtractionOption`\
  \ 定义了数据提取的基本属性以及相关的 get 和 set 方法。基本属性包括输出格式、输出文件和输出流等元素。\n* `org.eclipse.birt.report.engine.dataextraction.ICommonDataExtractionOption`\
  \ 扩展了 `IDataExtractionOption` 接口，为通用数据提取插件定义基本属性及相关的 get 和 set 方法。XML 数据提取使用了此接口，因为为通用数据提取定义的多数属性也适用于\
  \ XML 提取。\n\n该接口的实现类是 `org.eclipse.birt.report.engine.dataextraction.impl.CommonDataExtractionImpl`。该类提供了根据数据提取选项初始化的实用方法。数据提取选项的基本属性为：\n\
  \n* 输出区域（locale）\n* 输出时区（timezone）\n* 输出编码，例如 `UTF-8`、`UTF-16LE` 或 `ISO-8859-1`\n\
  * 输出日期格式\n* 用于导出的选中列\n* 是否导出列数据类型的指示器\n* 是否导出区域中性格式值（locale neutral format value）的指示器\n\
  * 用户定义参数\n\n## 理解 XML 文格式\n\nXML 数据提取扩展的实现包 `org.eclipse.birt.report.engine.dataextraction.xml`\
  \ 仅包含 `XMLDataExtractionImpl.java` 类。\n\n`XMLDataExtractionImpl` 扩展了 `org.eclipse.birt.report.engine.dataextraction.impl.CommonDataExtractionImpl`\
  \ 类并实现了创建 XML 文档的私有方法。\n\nXML 文档架构包含以下元素：\n\n* `<Report>`：`<Report>` 封装 XML 文档的其他元素\n\
  * `<Properties>`：内容包含有关以下报告属性的信息：\n    * `<ReportName>` 完整路径和报告名称\n    * `<Locale>`\
  \ 显示的报告区域。如果区域为 `null`，默认值为 `en_US`，显示为美式英语。\n    * `<Encoding>` 指定“导出数据”用户界面中的一个选项，允许用户选择导出报告数据的编码。默认情况下，编码设置为\
  \ `UTF-8`。`<Encoding>` 的文本内容显示所选的编码。\n    * `<Parameters>` 此标签包含所有通过用于在 Web Viewer\
  \ 中运行报告的 URL 传递的参数。这些参数被称为用户参数，与报告参数不同。这些项目出现在独立的 `<Parameter>` 标签中。参数名显示在 `name`\
  \ 属性中，值作为文本显示在 `<Parameter>` 节点中。参数的精确数量和值取决于报告设计以及运行报告的环境。用户参数名是自文档性的。\n\n以下列表显示了最常用的用户参数：\n\
  * `__asattachment`\n* `__cubememsize`\n* `__dpi`\n* `__exportdatatype`\n* `__exportencoding`\n\
  * `__extractextension`\n* `__format`\n* `__locale`\n* `__localeneutral`\n* `__masterpage`\n\
  * `__report`\n* `__resourceFolder`\n* `__resultsetname`\n* `__rtl`\n* `__selectedcolumn0`\n\
  * `__selectedcolumn1`\n* `__selectedcolumn2`\n* `__selectedcolumnnumber`\n* `__sep=0`\n\
  * `__sessionId`\n* `__svg`\n* `__timezone`\n* `<isLocaleNeutral>`：用户可以选择以区域中性格式导出数据。数字被导出为中性字符串值。日期格式列按\
  \ ISO8601 格式导出，例如 YYYY-MM-DD 或 YYYYYMMDD。\n* `<Columns>`：列出数据行中的列。列类型是 `<Column>`\
  \ 的属性。`type` 属性是可选的，并且仅当用户在“数据导出”对话框中选择导出数据类型时才会出现在 XML 文档中。\n* `<Row>`：包含单行数据的数据。`<Data>`\
  \ 显示列值。\n\nListing 21-1 显示了一个导出的 XML 文档示例。\n\n**列表 21-1** 导出的 XML 文档\n\n```xml\n\
  <?xml version=\"1.0\" encoding=\"UTF-8\" standalone=\"no\"?>\n<Report>\n   <!--以\
  \ XML 格式提取报告数据-->\n   <!--列出报告属性，如名称、区域、\n   编码、用户参数-->\n   <Properties>\n     \
  \ <ReportName>C:\\TEST\\XMLDataExtraction\\\n    XMLDataExtraction.rptdesign</ReportName>\n\
  \      <Locale>English</Locale>\n      <isLocaleNeutral>true</isLocaleNeutral>\n\
  \      <Encoding>UTF-8</Encoding>\n      <Parameters>\n          <Parameter name=\"\
  __exportencoding\">UTF-8</Parameter>\n          <Parameter name=\"__svg\">false</Parameter>\n\
  \          <Parameter name=\n              \"__selectedcolumn1\">COUNTRY</Parameter>\n\
  \          <Parameter name=\n              \"__selectedcolumn2\">CREDITLIMIT</Parameter>\n\
  \          <Parameter name=\"__rtl\">false</Parameter>\n          <Parameter name=\n\
  \              \"__extractextension\">com.eclipse.birt.report\n    .engine.dataextraction.xml</Parameter>\n\
  \          <Parameter name=\n              \"__report\">C:\\TEST\\XMLDataExtraction\n\
  \    XMLDataExtraction.rptdesign</Parameter>\n          <Parameter name=\"__masterpage\"\
  >true</Parameter>\n          <Parameter name=\n              \"__sessionId\">20090923_10444_204</Parameter>\n\
  \          <Parameter name=\"__format\">html</Parameter>\n          <Parameter name=\"\
  __asattachment\">true</Parameter>\n          <Parameter name=\"__selectedcolumnnumber\"\
  >3</Parameter>\n          <Parameter name=\"__localeneutral\">true</Parameter>\n\
  \          <Parameter name=\"__sep\">0</Parameter>\n          <Parameter name=\n\
  \              \"__timezone\">America/Los_Angeles</Parameter>\n          <Parameter\
  \ name=\"1069371071\"/>\n          <Parameter name=\"__locale\">en_US</Parameter>\n\
  \          <Parameter name=\"__cubememsize\">10</Parameter>\n          <Parameter\
  \ name=\"__exportdatatype\">true</Parameter>\n          <Parameter name=\"__resultsetname\"\
  >ELEMENT_9</Parameter>\n          <Parameter name=\n              \"__selectedcolumn0\"\
  >CUSTOMERNAME</Parameter>\n          <Parameter name=\n              \"__resourceFolder\"\
  >C:\\TEST\\XMLDataExtraction</Parameter>\n          <Parameter name=\"__dpi\">100</Parameter>\n\
  \      </Parameters>\n   </Properties>\n</Report>\n```\n\n\n\n\n```xml\n<Columns>\n\
  \    <Column type=\"String\">CUSTOMERNAME</Column>\n    <Column type=\"String\"\
  >COUNTRY</Column>\n    <Column type=\"Float\">CREDITLIMIT</Column>\n</Columns>\n\
  <Row>\n    <Data>Signal Gift Stores</Data>\n    <Data>USA</Data>\n    <Data>71800.0</Data>\n\
  </Row>\n<Row>\n    <Data>Mini Gifts Distributors Ltd.</Data>\n    <Data>USA</Data>\n\
  \    <Data>210500.0</Data>\n</Row>\n<Row>\n    <Data>Mini Wheels Co.</Data>\n  \
  \  <Data>USA</Data>\n    <Data>64600.0</Data>\n</Row>\n</Report>\n```\n\n### 理解\
  \ `XMLDataExtractionImpl` 方法\n\n`XMLDataExtractionImpl` 继承自 `CommonDataExtractionImpl`。\n\
  \n该类创建了私有变量来存储输出的 XML 文档、作为字符串流的输出流以及报告的属性。这些属性导出在输出 XML 文件的 `<properties>` 标签中。\n\
  \n变量声明如 Listing 21-2 所示。\n\n**Listing 21-2** XML 数据提取选项变量\n\n```java\npublic class\
  \ XMLDataExtractionImpl extends CommonDataExtractionImpl {\n    public static final\
  \ String PLUGIN_ID = \"org.eclipse.birt.report.engine.dataextraction.xml\";\n  \
  \  public static final String DEFAULT_ENCODING = Charset.defaultCharset().name();\n\
  \    private Document outDocument;\n    private OutputStream outputStream;\n   \
  \ private String encoding;\n    private String selectedColumnNames;\n    private\
  \ boolean isExportDataType;\n    private boolean isLocaleNeutral;\n    private Locale\
  \ locale;\n    private String reportName;\n    private Map pUserParameters;\n}\n\
  ```\n\n`XMLDataExtractionImpl` 类使用 `org.w3c.dom` 包定义的 Java API 进行 XML 处理。Table 21-4\
  \ 描述了导出的属性变量。\n\n**Table 21-4** 报告属性变量\n\n![image](img/21tab04.jpg)\n\n以下 `XMLDataExtractionImpl`\
  \ 方法用于设置并实现数据提取：\n\n*   `initialize()`\n    由 `org.eclipse.birt.report.engine.extension.IDataExtractionExtension`\
  \ 接口类定义。初始化上下文和选项对象，并调用私有方法 `initXMLOptions()` 来初始化局部变量。\n\n**Listing 21-3** `initialize()`\n\
  \n```java\npublic void initialize( IReportContext context, IDataExtractionOption\
  \ options) throws BirtException {\n    super.initialize(context, options);\n   \
  \ initXMLOptions(options);\n}\n```\n\n*   `initXMLOptions()`\n    在每次数据提取开始时调用，执行以下操作：\n\
  \    *   创建输出流，将报告的文本内容写入 XML 文件。\n    *   获取 `CommonDataExtractionOption` 对象 `xmlOption`\
  \ 的引用，该对象包含用于获取插件 `IDataExtractionOption` 接口选项的访问方法。\n    *   使用数据提取 API 方法初始化报告属性值，例如\
  \ `encoding`、`locale`、`iLocaleNeutral`、`selected columns`、`isExportDataType`、`user\
  \ parameters` 和 `report name`。\n\n**Listing 21-4** `initXMLOptions()`\n\n```java\n\
  private void initXMLOptions( IDataExtractionOption options ){\n    outputStream\
  \ = options.getOutputStream();\n    CommonDataExtractionOption xmlOption;\n    if\
  \ ( options instanceof CommonDataExtractionOption ) {\n        xmlOption = (CommonDataExtractionOption)options;\n\
  \    } else {\n        xmlOption = (CommonDataExtractionOption) new CommonDataExtractionOption(options.getOptions());\n\
  \    }\n    encoding = xmlOption.getEncoding();\n    if ( encoding == null || \"\
  \".equals(encoding.trim())) {\n        encoding = null;\n    } else {\n        encoding\
  \ = encoding.trim();\n    }\n    if ( encoding == null ) {\n        encoding = DEFAULT_ENCODING;\n\
  \    }\n    isLocaleNeutral = xmlOption.isLocaleNeutral();\n    locale = (Locale)\
  \ xmlOption.getLocale();\n    if ( locale == null ) {\n        locale = Locale.getDefault();\n\
  \    }\n    selectedColumnNames = xmlOption.getSelectedColumns();\n    isExportDataType\
  \ = xmlOption.isExportDataType();\n    pUserParameters = xmlOption.getUserParameters();\n\
  \    getReportName(pUserParameters);\n}\n```\n\n*   `getReportName()`\n    由 `initXMLOptions()`\
  \ 方法调用，从用户参数中提取报告名称和路径。\n\n**Listing 21-5** `getReportName()`\n\n```java\nprivate\
  \ void getReportName( Map pUserParameters ) {\n    Map uParameters = pUserParameters;\n\
  \    // 遍历 map 中的键和值\n    if ( uParameters != null ) {\n        java.util.Iterator\
  \ it = null;\n        for ( it =(java.util.Iterator) uParameters.keySet().iterator();\
  \ ((java.util.Iterator) it).hasNext(); ) {\n            Object key = it.next();\n\
  \            Object value = uParameters.get(key);\n            if (key.toString().equalsIgnoreCase(\"\
  __report\")) {\n                reportName = value.toString();\n            }\n\
  \        }\n    }\n}\n```\n\n*   `output()`\n    接口接口方法，用于格式化数据提取的输出流。使用文档对象模型（DOM）组件\
  \ API 创建输出的 XML 文档。\n    数据集结果集通过 `IEExtractionResults` 输入参数传递给 `output()` 方法。代码遍历结果集以仅提取所选列的数据。最后，代码将\
  \ XML 文档转换为字符串并将字符串写入输出流。\n\n**Listing 21-6** `output()`\n\n```java\npublic void\
  \ output( IExtractionResults results ) throws BirtException{\n    String[ ] columnNames\
  \ = (String[ ]) selectedColumnNames;\n    try {\n        outDocument = createNewDocument();\n\
  \    } catch (Exception e) {\n        e.printStackTrace();\n    }\n    // 创建输出 XML\
  \ 文档的根元素\n    Element rootElement = outDocument.createElement(\"Report\");\n   \
  \ rootElement.appendChild(outDocument.createComment(\"Extract report data in XML\
  \ format\"));\n    outDocument.appendChild(rootElement);\n    Element pRow = outDocument.createElement(\"\
  Properties\");\n    rootElement.appendChild(outDocument.createComment(\"Lists the\
  \ report properties, such as name, locale, encoding, user parameters\"));\n    rootElement.appendChild(pRow);\n\
  \    Element nodeName = outDocument.createElement(\"Report\");\n    nodeName.appendChild(outDocument.createTextNode(reportName));\n\
  \    pRow.appendChild(nodeName);\n    Element nodeLocale = outDocument.createElement(\"\
  Locale\");\n    nodeLocale.appendChild(outDocument.createTextNode(locale));\n  \
  \  pRow.appendChild(nodeLocale);\n    Element nodeEncoding = outDocument.createElement(\"\
  Encoding\");\n    nodeEncoding.appendChild(outDocument.createTextNode(encoding));\n\
  \    pRow.appendChild(nodeEncoding);\n    Element nodeParameters = outDocument.createElement(\"\
  Parameters\");\n    nodeParameters.appendChild(outDocument.createTextNode(pUserParameters));\n\
  \    pRow.appendChild(nodeParameters);\n}\n```\n\n\n\n\n\n```java\nfor (int i =\
  \ 0; i < columnNames.length; i++) {\n    String columnName = results.getResultMetaData().getColumnName(i);\n\
  \    values[i] = getStringValue(iData.getValue(columnNames[i]), isLocaleNeutral,\
  \ locale);\n    Element node = outDocument.createElement(columnName);\n    node.appendChild(outDocument.createTextNode(values[i]));\n\
  \    row.appendChild(node);\n}\nif (encoding != null && encoding.trim().length()\
  \ > 0) {\n    outputStream.write(serialize(outDocument).getBytes(encoding.trim()));\n\
  } else {\n    outputStream.write(serialize(outDocument).getBytes());\n}\n} catch\
  \ (Exception e) {}\n```\n\n### getColumnTypes()\n从结果集元数据中提取数据类型。只有当用户在导出数据对对话框中选择此选项时，列数据才会导出到\
  \ XML 文档。\n\n#### 列表 21-7 getColumnTypes()\n```java\nprivate String[] getColumnTypes(String[]\
  \ columnNames, IExtraction results) throws BirtException {\n    Map<String,Integer>\
  \ typesMap = new HashMap<String,Integer>();\n    int count = results.getResultMetaData().getColumnCount();\n\
  \    for (int i = 0; i < count; i++) {\n        String colName = results.getResultMetaData().getColumnName(i);\n\
  \        int colType = results.getResultMetaData().getColumnType(i);\n        typesMap.put(colName,\
  \ colType);\n    }\n    int[] types = new int[columnNames.length];\n    String[]\
  \ typeNames = new String[columnNames.length];\n    for (int i = 0; i < columnNames.length;\
  \ i++) {\n        types[i] = typesMap.get(columnNames[i]).intValue();\n        typeNames[i]\
  \ = DataType.getName(types[i]);\n    }\n    return typeNames;\n}\n```\n\n### exportIntoString()\n\
  将 XML 文档转换为字符串，以便写入输出流并发送到浏览器。`exportIntoString()` 方法使用 `javax.xml.transform` API\
  \ 将 XML 文档转换为字符串。\n\n#### 列表 21-8 exportIntoString()\n```java\npublic String exportIntoString()\
  \ throws Exception {\n    try {\n        ByteArrayOutputStream byteArrayOutputStream\
  \ = new ByteArrayOutputStream();\n        TransformerFactory transformerFactory\
  \ = TransformerFactory.newInstance();\n        Transformer transformer = transformerFactory.newTransformer();\n\
  \        Properties props = new Properties();\n        props.setProperty(OutputKeys.INDENT,\
  \ \"yes\");\n        transformer.setOutputProperties(props);\n        Source source\
  \ = new DOMSource(outDocument);\n        StreamResult streamResult = new StreamResult(byteArrayOutputStream);\n\
  \        transformer.transform(source, streamResult);\n        return byteArrayOutputStream.toString(encoding);\n\
  \        //output is always in UTF-8\n    } catch (Exception e) {\n        System.out.println(\"\
  error in doExportIntoString\");\n        throw e;\n    }\n}\n```\n\n#### 测试 XML\
  \ 数据提取插件\n你可以直接在 BIRT Report Designer 中运行新的 XML 数据提取插件，或者在通过 Web Viewer 运行并渲染报告时通过程序运行它。本节描述了如何在\
  \ BIRT Report Designer 中测试 XML 数据提取插件。\n\n##### 如何启动 XML 数据提取插件\n1. 从 Eclipse SDK\
  \ 菜单中，选择 Run—Run Configurations（运行—运行配置）。在 Run Configurations 中，右键点击 Eclipse Application。选择\
