  \ 方法使用 `BaseRenderer` 的 `validateDataSet()` 方法验证基系列和正交系列的数据点数量是否相等。它还验证了列表 23-14\
  \ 中所示图表**使用的比例。\n\n**列表 23-14** `compute` 方法\n\n```java\npublic void compute( Bounds\
  \ bo, Plot p, IRenderingHints\n    isrh )\n    throws ChartException\n{\n    final\
  \ RenderingHints srh = (RenderingHints) isrh;\n    // VALIDATE CONSISTENT DATASET\
