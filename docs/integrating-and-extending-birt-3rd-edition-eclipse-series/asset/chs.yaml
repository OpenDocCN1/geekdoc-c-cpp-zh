  \n### 外连接\n一种连接类型，即使另一个表中不存在匹配值，也能从一个表中返回记录。外连接的三种类型是左外连接、右外连接和全外连接。左外连接返回连接表达式左侧表的所有记录，即使右侧表中不存在匹配值。右外连接返回连接表达式右侧表的所有记录，即使左侧表中不存在匹配值。例如，在\
  \ `customerID` 上连接客户表和订单表，并将客户表放在表达式的左侧，则返回的结果集包含所有客户记录，包括没有订单的客户。全外连接是左外连接和右外连接结果集的并集。\n\
