  \     */\n    SwingChartingApp() {\n        contextMap = new HashMap();\n      \
  \  try {\n            PlatformConfig config = new PlatformConfig();\n          \
  \  config.setProperty(\"STANDALONE\", \"true\");\n            idr = ChartEngine.instance().getRenderer(\"\
  SWING\");\n        } catch (ChartException ex) {\n            ex.printStackTrace();\n\
  \        }\n        cm = createBar();\n    }\n\n    /* 构建简单的柱状图 */\n    public static\
  \ final Chart createBar() {\n        ChartWithAxes waBar = ChartWithAxesImpl.create();\n\
  \        /* 绘图 */\n        waBar.getBlock().setBackground(ColorDefinitionImpl.WHITE());\n\
  \        waBar.getBlock().getOutline().setVisible(true);\n        Plot p = waBar.getPlot();\n\
  \        p.getClientArea().setBackground(ColorDefinitionImpl.create(255, 255, 25));\n\
  \        p.getOutline().setVisible(false);\n        /* 标题 */\n        waBar.getTitle().getLabel().getCaption().setValue(\"\
  Bar Chart\");\n        /* 图例 */\n        Legend lg = waBar.getLegend();\n      \
  \  lg.getText().getFont().setSize(16);\n        lg.setItemType(LegendItemType.CATEGORIES_LITERAL);\n\
  \        /* X 轴 */\n        Axis xAxisPrimary = waBar.getPrimaryBaseAxes()[0];\n\
  \        xAxisPrimary.setType(AxisType.TEXT_LITERAL);\n        xAxisPrimary.getMajorGrid().setTickStyle(TickStyle.BELOW_LITERAL);\n\
  \        xAxisPrimary.getOrigin().setType(IntersectionType.VALUE_LITERAL);\n   \
  \     xAxisPrimary.getTitle().setVisible(true);\n        /* Y 轴 */\n        Axis\
  \ yAxisPrimary = waBar.getPrimaryOrthogonalAxis(xAxisPrimary);\n        yAxisPrimary.getMajorGrid().setTickStyle(TickStyle.LEFT_LITERAL);\n\
  \        yAxisPrimary.setType(AxisType.LINEAR_LITERAL);\n        yAxisPrimary.getLabel().getCaption().getFont().setRotation(90);\n\
  \        /* 数据集 */\n        TextDataSet categoryValues = TextDataSetImpl.create(new\
  \ String[]{\"Item 1\", \"Item 2\", \"Item 3\"});\n        NumberDataSet orthoValues\
  \ = NumberDataSetImpl.create(new double[]{25, 25, 25});\n        /* ... 后续逻辑保持不变\
  \ ... */\n        return waBar;\n    }\n    // ... 其他方法省略\n}\n```\n\n\n\n\n`org.eclipse.birt.chart.examples`\
  \ 插件是图表引擎 `ChartSDK` 文件夹提供的图表编程示例集合。要访问示例的 Java 源码，请将 `org.eclipse.birt.chart.examples.source`\
  \ 插件的 JAR 文件解压到你的工作空间。然后，将这些文件作为项目导入。将 BIRT 根目录下的 `JAR` 文件以及 Java EE `JAR` 文件 `servlet.jar`\
  \ 包含构建路径中。根据需要从图表引擎的 `ChartSDK` 和 Eclipse 目录插件文件夹中添加更多的 `JAR` 文件，以解决单个示例中的构建错误。要运行示例，请使用\
  \ Eclipse 运行（Run）对话框设置 VM 参数，包含一行以下格式的参数，其中 `<Eclipse home>` 是 `eclipse.exe` 的位置：\n\
  \n```\n-DBIRT_HOME=\"<Eclipse home>\"\n```\n\n示例位于插件 `src/org/eclipse/birt/chart/examples`\
  \ 目录的子目录下，该目录被称为 `EXAMPLES_ROOT`。大多数示例包含一个显示图表的 Java 应用程序。具有 `main()` 方法的类称为查看器应用程序（viewer\
  \ applications），它们的类名以 `Viewer` 结尾。通常，这些示例使用一个或多个额外的类来构建图表。以下章节提供了图表示例插件中各个示例的概述。\n\
  \n## api.data 示例\n\n`api.data` 包包含三个示例：一个在 Java Swing 环境中显示图表，另外两个在报告设计中修改图表项。\n\
  \n### DataCharts 示例\n\n`DataCharts` 示例由 `DataChartsViewer` 组成，这是一个使用 `DataCharts`\
  \ 类来构建图表的 Java Swing 应用程序。`DataCharts` 在图表中显示硬编码的数据值。根据用户的选择，该应用程序将构建以下类型的图表之一：\n\
  \n- 具有多个 `y`-轴的柱状图\n- 具有多个 `y`序列的柱状图\n- 具有最小切片的饼图\n\n### GroupOnXSeries 示例\n\n`GroupOnXSeries`\
  \ 示例是一个 Java 应用程序，它读取 BIRT 报告设计并对其进行修改和保存。原始报告设计 `NonGroupOnXSeries.rptdesign` 包含一个使用脚本数据源数据的图表报告项。该图表项在\
  \ `x`-序列上没有分组。`GroupOnXSeries` Java 应用程序修改了设计，使图表报告项在 `x`-序列上分组。应用程序将修改后的报告设计保存为\
  \ `GroupOnXSeries.rptdesign`。打开这些报告设计并预览报告以查看此修改的效果。\n\n### GroupOnYAxis 示例\n\n\
  `GroupOnYAxis` 示例是一个 Java 应用程序，它读取 BIRT 报告设计并对其进行修改和保存。原始报告设计 `NonGroupOnYAxis.rptdesign`\
  \ 包含一个使用脚本数据源数据的图表报告项。该图表项在 `y`-轴上没有分组。`GroupOnYAxis` Java 应用程序修改了设计，使图表报告项在 `y`-轴上分组。应用程序将修改后的\
  \ BIRT 报告设计保存为 `GroupOnYAxis.rptdesign`。打开这些报告设计并预览报告以查看此修改的效果。\n\n## api.data.autobinding\
  \ 示例\n\n此示例是一个 Eclipse SWT 应用程序，由 `AutoDataBindingViewer` 类组成。该类实例化了一个 `SWT Display`\
  \ 对象并向其添加了一个图表。应用程序创建数据行结构并将其绑定到图表。然后，应用程序渲染图表。\n\n## api.format 示例\n\n此示例是一个 Java\
  \ Swing 应用程序，由 `FormatCharts` 和 `FormatChartsViewer` Java 类组成。`FormatChartsViewer`\
  \ 类显示了一个向用户提供选择的界面。根据用户的选择，`FormatChartsViewer` 调用 `FormatCharts` 类中的静态方法来构建图表。`FormatChartsViewer`\
  \ 然后渲染图表。`FormatCharts` 中的方法修改了以下图表属性：\n\n- 轴格式\n- 按类别着色\n- 图例标题\n- 百分数值值\n- 绘图格式\n\
  - 系列格式\n\n## api.interactivity 示例\n\n这组相关的示例应用程序演示了三个 Java 框架（SVG、Swing 和 SWT）中的图表交互功能。查看器应用程序为\
  \ `SvgInteractivityViewer`、`SwingInteractivityViewer` 和 `SwtInteractivityViewer`。查看器类显示了一个向用户提供相同交互选择的界面。根据选择，查看器类调用\
  \ `InteractivityCharts` 中的静态方法来构建交互式图表。然后，查看器渲染图表。这些图表中的交互类型包括：\n\n- 显示工具提示\n- 执行回调代码\n\
  - 高亮系列\n- 使用 URL 链接到外部站点\n- 切换系列的可见性\n\n## api.pdf 示例\n\n此示例是一个构建简单图表并将其渲染为 PDF\
  \ 文件的 Java 应用程序。`PDFChartGenerator` 示例中的类有 `ChartModels` 和 `PDFChartGenerator`。`ChartModels`\
  \ 有一个使用硬编码数据值构建简单图表的方法。`PDFChartGenerator` 使用 BIRT 图表 API 将图表渲染为 PDF 格式。应用程序保存 PDF\
  \ 文件为 `test.pdf`。\n\n## api.preference 示例\n\n此示例展示了 Java Servlet 如何处理 URL 设置偏好。Servlet\
  \ 类 `PreferenceServlet` 使用 `ChartModels` 类生成图表。Servlet 使用 `LabelStyleProcessor`\
  \ 类影响标签样式。该示例还包含一个帮助页面 `Help.htm`，解释了如何：\n\n- 使用 JSP 和 servlet 开发开发页面。\n- 运行 `Preference`\
  \ 示例。\n- 设置 Eclipse 以配合 Tomcat 工作。\n\n## api.processor 示例\n\n此示例构建一个简单图表并将样式应用于图表。该示例由\
  \ SWT 应用程序 `StyleChartViewer` 和 `StyleProcessor` 组成，后者实现了 `IStyle` 接口以创建样式对象。`StyleChartViewer`\
  \ 创建图表并将样式应用于图表。最后，`StyleViewer` 渲染图表。\n\n## api.script 示例\n\n此示例包含两个 SWT 应用程序：`JavaScriptViewer`\
  \ 和 `JavaViewer`。这两个应用程序都向用户提供一组选择。对于特定的选择，出现的图表在两个查看器中是相同的。每次选择都会调用 `ScriptCharts`\
  \ 类中的静态方法来创建图表并显示图表实现的事件处理器。`JavaScriptViewer` 调用 `ScriptCharts` 方法构建具有 JavaScript\
  \ 事件处理器的图表。`JavaViewer` 调用 `ScriptCharts` 方法构建具有 Java 事件处理器的图表。\n\n`ScriptCharts`\
  \ 类说明了创建具有元素事件处理器图表的技术。类中的方法创建使用 JavaScript 编写的元素事件处理器图表。每个 JavaScript 事件处理器都定义为\
  \ `ScriptCharts` 中的单个字符串。另一组方法使用 Java 编写的元素事件处理器创建具有相同功能的图表。这些 Java 事件处理器是位于 `EXAMPLES_ROOT/api/script/java`\
  \ 的 Java 类。定义 Java 事件处理器的 `ScriptCharts` 方法传递类路径的字符串。\n\n## api.viewer 示例\n\n`api.viewer`\
  \ 包包含创建各种图表的示例应用程序。每个类根据用户的选择创建并显示一组图表。除了 `SwingLiveChartViewer.java` 外，每个查看器类都会调用\
  \ `PrimitiveCharts` 类中的静态方法来创建显示的图表。`PrimitiveCharts` 为每个图表使用硬编码的数据值。\n\n### Chart3DViewer\
  \ 示例\n\n`Chart3DViewer.java` 是一个 SWT 应用程序，显示以下图表类型：\n\n- 3D 面积图\n- 3D 柱状图\n- 3D\
  \ 折线\n\n### CurveFittingViewer 示例\n\n`CurveFittingViewer.java` 是一个 SWT 应用程序，显示以下图表类型：\n\
  \n- 曲线拟合面积图\n- 曲线拟合柱状图\n- 曲线拟合折线\n- 曲线拟合股票图\n\n### DialChartViewer 示例\n\n\n\n\n\n\
  `DialChartViewer.java` 是一个 SWT 应用，用于显示以下图表类型：\n\n• 多仪表盘、多区域图表\n• 多仪表盘、单区域图表\n• 单仪表盘、多区域图表\n\
  • 单仪表盘、单区域图表\n\n#### SwingChartViewerSelector 示例\n\n`SwingChartViewerSelector.java`\
  \ 是一个 Swing 应用，支持以不同的方式显示相同的数据值。对于每种图表类型，用户可以选择显示图表为二维或具有深度二维。用户还可以选择转置轴显示图表、以百分比显示数值或使用对数刻度显示。某些选项仅适用于带有轴的图表。`SwingChartViewerSelector`\
  \ 显示以下图表类型：\n\n• 面积图\n• 堆叠柱状图和折线图\n• 柱状图\n• 具有两个系列的柱状\n• 气泡图\n• 差异图\n• 折线图\n• 饼图\n\
  • 具有四个系列的饼图\n• 散点图\n• 股票图\n\n#### SwingLiveChartViewer 示例\n\n`SwingChartLiveChartViewer.java`\
  \ 是一个 Swing 应用，用于显示带有滚动数据的实时动画图表。\n\n#### SWTChartViewerSelector 示例\n\n`SWTChartViewerSelector.java`\
  \ 是一个 SWT 应用，显示与 `SwingChartViewerSelector.java` 相同的用户界面选择和图表类型。\n\n#### builder\
  \ 示例\n\nbuilder 示例包含两个 Java 类：`ChartWizardLauncher` 和 `DefaultDataServiceProviderImpl`。`ChartWizardLauncher`\
  \ 尝试从 `testCharts.chart` 读取图表。如果文件存在，`ChartWizardLauncher` 会修改该文件。如果文件不存在，应用程序将创建一个新文件。`ChartWizardLauncher`\
  \ 使用 BIRT 图表向导创建图表。`DefaultDataServiceProviderImpl` 提供了模拟数据服务的基本实现。\n\n#### radar.ui\
  \ 示例\n\n`radar.ui` 示例包含为雷达图提供用户界面页面的类。\n\n#### report.api 示例\n\n三个 `report.api`\
  \ 示例都是没有用户界面的 Java 应用程序。这些示例使用 BIRT 设计引擎在图表示例插件的输出文件夹中构建新的 BIRT 报告设计文件。所有报告示例都按照所示的顺序向报告设计文件添加了以下组件：\n\
  \n• 主页\n• 数据源\n• 数据集\n• 报告主体中的图表元素\n\n所有报告示例都使用 BIRT 图表 API 向报告设计的主体槽添加图表。运行这些应用程序后，打开新的报告设计文件并预览报告以查看图表。\n\
  \n#### MeterChartExample 示例\n\n`MeterChartExample` 示例向报告设计添加了仪表盘图。报告设计的名称为 `MeterChartExample.rptdesign`。\n\
  \n#### SalesReport 示例\n\n`SalesReport` 示例创建样式并向报告设计添加了饼图。报告设计的名称为 `SalesReport.rptdesign`。\n\
  \n#### StockReport 示例\n\n`StockReport` 示例向报告设计添加了股票图。报告设计的名称为 `StockAnalysis.rptdesign`。\n\
  \n#### report.design 示例\n\n此文件夹中的报告设计演示了在报告设计中显示图表元素的方法。`BarChartWithinTableGroup.rptdesign`\
  \ 显示如何在表格元素中使用图表。`BarChartWithJavascript.rptdesign` 显示了如何使用 JavaScript 在用户查看报告时修改渲染的图表。`DynamicSeriesPieChart.rptdesign`\
  \ 显示了如何自定义饼图。\n\n#### report.design.script 示例\n\n此文件夹中的报告设计包含图表元素，这些元素使用了 `api.script`\
  \ 示例动态创建的 JavaScript 事件处理器。这些报告设计显示了脚本如何出现在 BIRT Report 设计器中。\n\n#### view 示例\n\n\
  view 文件夹及其子文件夹包含 Eclipse 视图“Chart Examples”的内容。要打开此视图，请从 Eclipse 主菜单中，选择 `Window→Show\
  \ View→Other`。在 Show View 窗口中，展开 `Report and Chart Design`，然后选择 `Chart Examples`\
  \ 并点击 `OK`。默认情况下，Chart Examples 视图显示在主窗口下方，与控制台窗口相同的位置。要使用 Chart Examples 视图，展开视图左侧的节点，然后选择一个项目。选中的图表显示在视图的右侧，如图图\
  \ 15-1 所示。\n\n**图 15-1** Chart Examples 视图，显示百分比值格式示例\n\n![image](img/15fig01.jpg)\n\
  \n要查看生成所选图表的应用程序源代码，从工具栏上选择 `Open Java Source`。\n\n![image](img/open-button.jpg)\n\
  \n要保存图表项结构的 XML，从工具栏上选择 `Save XML Source`。\n\n![image](img/save-button.jpg)\n\n\
  # 第五部分。使用扩展框架\n\n![image](img/part-opener-05.jpg)\n\n## 第 16 章 构建 BIRT 项目\n\n本章解释了如何构建\
  \ BIRT 项目。本章还解释了如何构建一个采用你对 BIRT 修改的新型 Web 查看器。\n\n这些信息主要针对 BIRT 开源项目的贡献者以及那些想要创建\
  \ BIRT 自定义版本的人。普通用户不需要通过构建 BIRT 来扩展 BIRT 或为 BIRT 编写脚本。\n\n在构建过程完成后，你可以探索 BIRT 源码并修改代码以满足你的需求。对\
  \ BIRT 源码的任何更改将立即在 BIRT Report Designer 中生效。要在 Web 中实现你的更改，你必须构建并导出新的 Web 查看器。\n\
  \n### 关于构建 BIRT 项目\n\n构建 BIRT 项目包含以下任务：\n\n• 安装可运行的 BIRT Report Designer 版本\n\n\
  通过首先安装你想要构建的相同版本的 BIRT Report Designer，你确保了你的 Eclipse 环境是正确的，并且你拥有了构建 BIRT 所需的所有组件。\n\
  \n• 配置 Eclipse 以编译 BIRT\n\n你可能需要更改编译器设置以匹配构建 BIRT 所需的设置。使用某些扩展点需要安装 Eclipse SDK。\n\
  \n• 下载并解压正确版本的 BIRT 源码 从 Eclipse 网站下载 BIRT 源码。随着新构建版本的添加，构建会变动，因此请使用搜索查找适当的版本。下载的版本与系统上可运行的版本必须一致。\n\
  \n• 导入并构建 BIRT 项目\n\n导入 BIRT 项目的操作将启动构建过程。构建过程需要几分钟，并应该在无错误的情况下完成。\n\n#### 安装可运行的\
  \ BIRT 版本\n\n为了确保你拥有构建 BIRT 所需的所有组件，请先安装一个可运行的 BIRT Report Designer。确保 BIRT 需要的所有插件和辅助文件都存在，并且这些资源是源码所需的版本。\n\
  \n要确认你拥有了可运行的 BIRT 安装的所有组件，最简单且可靠的方法是选择“Full Eclipse Install”。安装此包后，安装 BIRT SDK。\n\
  \n安装 BIRT 后，启动 Eclipse 并打开 Report Design 视图。验证你能够构建一个简单的报告，并且能够在 BIRT 预览器和 Web 查看器中预览该报告。通常，此测试足以保证你拥有一个有效的\
  \ BIRT 可运行版本。\n\n### 配置 Eclipse 以编译 BIRT 并构建 viewer JAR 文件\n```\n\n\n\n在将 BIRT 源码导入工作区之前，请检查工作区的\
  \ Java 编译器设置是否与 BIRT 兼容。2.6 版本的 BIRT 使用了某些仅在 `JDK` 1.5 及更高版本中才存在的特性。某些插件依赖于 Java\
  \ 1.5 的其他模块，且与 Java 1.6 不兼容。为了让 BIRT 成功构建，你需要将 Eclipse 编译器合规设置为 Java 1.5。通过启动 Eclipse\
  \ 并设置 Eclipse 偏好为你的 Eclipse 工作区设置此版本。确保将这些设置应用于任何用于处理 BIRT 的区。\n\n要构建查看器 Java 包（JAR）文件，系统变量\
  \ `JAVA_HOME` 必须引用工作区编译器偏好指定的已安装 `JRE`。\n\n在 BIRT 2.6 中，某些扩展点引用了 BIRT 全 Eclipse\
  \ 安装版中不存在的文件。为了让这些扩展点找到所需的文件，请安装 Helios Eclipse SDK。\n\n## 如何设置 Eclipse 工作区编译器偏好\n\
  \n**1** 在 BIRT Report 设计器中，选择 `Window`（窗口）→`Preferences`（偏好）。\n\n**2** 在 `Preferences`\
  \ 中，展开树形结构 `Java` 项并选择 `Installed JREs`（已安装的 JRE）。在 `Installed JREs` 中，选择一个 Java\
  \ 1.5 `JRE`，如图 16-1 所示。\n\n**图 16-1** 选择 Java 1.5 JRE\n\n![image](img/16fig01.jpg)\n\
  \n**3** 选择 `Compiler`（编译器）。在 `Compiler` 中，如图 16-2 所示，执行以下步骤：\n\n• 在 `JDK Compliance`（JDK\
  \ 合规性）中，在 `Compiler compliance level`（编译器合规级别）中选择 `1.5`。\n• 在 `Classfile Generation`（类文件生成）中，选择所有可用选项。\n\
  \n**图 16-2** 编译器偏好\n\n![image](img/16fig02.jpg)\n\n选择 `OK`。\n\n如果出现消息询问是否立即全部重新构建，选择\
  \ `No`。只有当你更改了编译器设置且工作区中存在 Java 项目时，才会出现此消息。\n\n## 如何安装 Eclipse SDK\n\n安装 Eclipse\
  \ SDK 以避免 BIRT 2.6 中某些扩展点缺少文件引用。\n\n**1** 在 BIRT Report 设计器中，选择 `Help`（帮助）→`Install\
  \ New Software`（安装新软件）。\n\n**2** 在 `Install` 中，如图 16-3 所示，执行以下步骤：\n\n• 在 `Work with`（工作项）中，选择：\n\
  \  Eclipse Project Updates - `http://download.eclipse.org`\n  `/eclipse/updates/3.6`\n\
  • 取消选择 `Show only the latest versions of available software`（仅显示可用软件最新版本）\n• 在可用软件列表中，展开\
  \ `Eclipse SDK`。选择：\n  `Eclipse SDK 3.6.0.I20100608-0911`\n\n**图 16-3** 选择 Eclipse\
  \ SDK\n\n![image](img/16fig03.jpg)\n\n选择 `Next`（下一步）。\n\n**3** 展开软件列表，如图 16-4 所示。\n\
  \n**图 16-4** 检查要安装的软件列表\n\n![image](img/16fig04.jpg)\n\n选择 `Finish`（完成）。Eclipse\
  \ 安装新软件，如图 16-5 所示。\n\n**图 16-5** 安装 Eclipse SDK\n\n![image](img/16fig05.jpg)\n\n\
  **4** 在出现的消息中，如图 16-6 所示，选择 `Restart Now`（立即重启）。\n\n**图 16-6** 准备重启 Eclipse\n\n\
  ![image](img/16fig06.jpg)\n\n当 Eclipse 重启时，选择用于 BIRT 源码的工作区。\n\n## 下载并提取正确版本的 BIRT\
  \ 源码\n\n从下载运行版 BIRT 的同一页面下载 BIRT 源码。源码包位于标记为 `BIRT Source Code` 的部分。压缩包文件名类似于 `birt-source-2_6_0.zip`。\n\
  \n将源码包提取到工作区目录。通常，你会使用一个与用于报告开发的工作区分开的 BIRT 源码工作区。虽然不需要独立的工作区，但它可以让你的报告工作区保持更整洁。如果你的工作区包含的\
  \ BIRT 构建源码与你 Eclipse 主目录中的插件不相同，Eclipse 将优先使用源码来运行 BIRT，而不是 Eclipse 主目录中的插件。\n\n\
  ### 导入、构建和测试 BIRT 项目\n\n在下载 BIRT 源码后，将功能文件、插件文件和源文件导入你的工作区。单次 Eclipse 导入操作会将源文件导入工作区并构建项目。\n\
  \n### 如何导入和构建 BIRT 项目\n\n使用 `Java` 视图来导入和构建 BIRT 项目。\n\n**1** 选择 `Window`（窗口）→`Perspective`（视角）→`Other`（其他）→`Plug-in\
  \ Development`（插件开发）。`Plug-in Development` 视图将打开。\n\n**2** 如需导入 BIRT 源码项目，选择 `File`（文件）→`Import`（导入）。\n\
  \n**3** 在 `Import` 中，展开 `General`（通用）。选择 `Existing Projects into Workspace`（将现有项目导入工作区），如图\
  \ 16-7 所示。\n\n**图 16-7** 导入项目显示 General \n\n![image](img/16fig07.jpg)\n\n选择 `Next`。\n\
  \n**4** 在 `Import Projects` 中，在 `Select root directory`（选择根目录](#ch16.html_ch16fig08）旁边点击\
  \ `Browse`（浏览）并选择工作区。\n\n**5** 选择 `Select All`（选择全部），如图 16-8 所示。然后选择 `Finish`。\n\
  \n**图 16-8** 选择 BIRT 源码\n\n![image](img/16fig08.jpg)\n\nEclipse 刷新工作区，然后构建所有项目，此过程可能需要几分钟。当构建无错误完成后，工作区状态如图\
  \ 16-9 所示。\n\n**图 16-9** 构建无错误\n\n![image](img/16fig09.jpg)\n\n如果在 `Problems`（问题）视图中出现错误，请使用\
  \ Eclipse 工具检查项目。\n\n### 如何测试 BIRT 项目\n\n要测试 BIRT 项目，以应用程序形式运行 `eclipse.birt`。\n\
  \n**1** 在 `Package Explorer`（包资源）中选择 `eclipse.birt`。\n\n**2** 选择 `Run`→`Run As`→`Eclipse\
  \ Application`。Eclipse 打开一个新实例并显示欢迎页。\n\n**3** 关闭欢迎页。\n\n**4** 选择 `Window`→`Open\
  \ Perspective`→`Report Design`。如果 `Report Design` 不可用，选择 `Other`，选择 `Report Design`，然后点击\
  \ `OK`。\n\n## 为了显示 BIRT 输出构建新的 JAR 文件\n\n创建用于查看器显示 BIRT 输出的文件。对于报告，该文件是 `viewserlets.jar`。对于独立图表，该文件是\
  \ `chart-viewer.jar`。\n\n### 构建 viewserlets.jar 文件\n\n你在 `eclipse.birt.report-viewer`\
  \ 插件项目中构建 `viewserlets.jar`。以下步骤显示了如何使用 Eclipse 构建此文件。\n\n#### 如何重新生成 viewserlets.jar\
  \ 文件\n\n**1** 在 `Package Explorer` 中展开 `eclipse.birt.report-viewer`。\n\n**2** 在\
  \ `eclipse.birt.report-viewer` 中，展开 `META-INF` 并右键点击 `MANIFEST.MF`。\n\n**3** 从上下文菜单中，选择\
  \ `PDE Tools`→`Create Build File`（创建 Ant 构建文件），如图 16-10 所示。\n\n**图 16-10** 选择创建构建文件\n\
  \n![image](img/16fig10.jpg)\n\nEclipse 在 `eclipse.birt.report-viewer` 根文件夹创建 `build.xml`。\n\
  \n**4** 在 `eclipse.birt.report-viewer` 文件夹中，右键点击 `build.xml` 并选择 `Run As`→`Ant Build`，如图\
  \ 16-11 所示。\n\n**图 16-11** 设置 Ant 构建以创建 viewserlets.jar\n\n![image](img/16fig11.jpg)\n\
  \n**5** 在 `Edit Configuration`（编辑配置）中，在 `Arguments`（参数）中选择 `Main`。在 `Arguments`\
  \ 中，将 `buildDirectory` 的值设置为你的 Eclipse 主目录路径，使用以下语法输入一行：\n\n```\n-DbuildDirectory=<Eclipse\
  \ home>\n```\n\n如果你的 Eclipse 主目录路径包含空格，请用引号括路径。\n\n选择 `Apply`（应用）。然后，选择 `Run`（运行）。\n\
  \n\n\n\nAnt 构建过程需要几分钟时间，并在 `org.eclipse.birt.report.viewer/birt/WEB-INF/lib` 中创建\
  \ `viewservlets.jar`。\n\n### 构建 chart-viewer.jar 文件\n\n如果你对图表源码进行了更改，通常会生成一个新的 `chart-viewer.jar`\
  \ 文件。请使用与重新创建 `viewservlets.jar` 类似的程序。要构建 `chart-viewer.jar`，请在 `org.eclipse.birt.chart.viewer`\
  \ 中执行该程序。构建过程会在 `org.eclipse.birt.chart.viewer` 根目录下创建 `chart-viewer.jar`。\n\n#\
  \ 第 17 节 扩展 BIRT\n\n本节提供了对 BIRT 扩展框架的概括介绍，并展示了如何使用 Eclipse 插件开发环境（PDE）创建并部署 BIRT\
  \ 扩展。\n\n### 扩展框架概述\n\nBIRT 是一组插件扩展，支持向应用程序添加报表功能。BIRT API 定义了扩展点（extension points），允许开发者向该框架添加自定义功能。报表开发人员可以在\
  \ Eclipse CVS 仓库中找到 BIRT 源代码。\n\n在 Eclipse 安装中，插件目录的名称带有附加版本号。为了简单起见，本书未在插件目录名称中显示版本号。例如，本书将插件目录名称\
  \ `org.eclipse.birt.report.viewer_2.6.0.v20100605` 简写为 `org.eclipse.birt.report.viewer`。\n\
  \n接下来的章节将概述如何在 BIRT 发布 2.6 框架中针对定义的扩展点制作扩展。\n\n### 了解 BIRT 插件的结构\n\n一个 Eclipse 插件实现了以下组件：\n\
  \n- 扩展点 schema 定义（Extension point schema definition）：一个 XML 文档，规定了在 Eclipse PDE\
  \ 中定义插件扩展元素时需要遵循的语法。\n- 插件清单文件（Plug-in manifest）：一个 XML 文档，用于向 Eclipse 运行时环境描述插件激活框架。\n\
  - 插件运行时类（Plug-in run-time class）：一个 Java 类，定义了在启动、管理和停止插件实例时使用的方法。\n\n接下来的章节将对这些\
  \ Eclipse 插件组件进行详细描述。\n\n### 了解扩展点 schema 定义文件\n\n插件插件目录通常在 `schema` 子目录下包含一个 XML\
  \ 扩展点 schema 定义文件（`.exsd`）。该 XML schema 文档记录了扩展点使用的元素、属性和类型。Eclipse PDE 使用这些信息来描述\
  \ Eclipse 平台中属性编辑器和其他可用功能中的元素和属性。\n\n要开发插件内容、测试并部署插件，请使用 Eclipse PDE。Eclipse PDE\
  \ 会生成 `plugin.xml`、`build.properties` 和运行时存档文件。\n\n文件 `$INSTALL_DIR\\eclipse\\plugins\\\
  org.eclipse.birt.report.designer.ui\\schema\\reportitemUI.exsd` 文档记录了向 BIRT 报表设计器用户界面添加报表项扩展的设置。该\
  \ XML schema 文件具有以下结构：\n\n- `<schema>` 是根元素，设置目标命名空间并包含所有其他元素及其属性。\n- `<annotation>`\
  \ 包含以下属性：\n    - `<appinfo>` 提供了 Eclipse 用于识别插件的机器可读元数据。`<appinfo>` 还提供了出现在 PDE\
  \ 扩展页面和 HTML 扩展点描述中的文本信息。\n    - `<documentation>` 提供了 PDE HTML 扩展点描述中的用户信息。\n \
  \   - `<element>` 为模型和可选的用户界面扩展（如生成器、调色板、编辑器、大纲和描述）声明引用。每个扩展元素都是一个复杂类型，包含属性和注解，如下文所示：\n\
  \        - `model` 是一个扩展元素，指定了报表项扩展的报表对象模型（ROM）名称。\n        - 每个用户界面扩展元素都指定了扩展元素名称以及实现扩展元素로指定接口的\
  \ Java 类的全限定名。例如，`builder` 实现接口 `org.eclipse.birt.report.designer.ui.extensions.IReportItemBuilderUI`。\n\
  \n列表 17-1 是显示 `reportitemUI.exsd` 的部分 schema 示例。省略号 (...) 标记了代码中省略行的地方。\n\n####\
  \ 列表 17-1 Report Item UI 部分 schema 示例\n\n```xml\n<?xml version='1.0' encoding='UTF-8'?>\n\
  \n<!-- PDE 编写的 schema 文件 -->\n\n<schema targetNamespace=\"org.eclipse.birt.report.designer.ui\"\
  \n    xmlns=\"http://www.w3.org/2001/XMLSchema\">\n\n    <annotation>\n      <appInfo>\n\
  \        <meta.schema\n              plugin=\"org.eclipse.birt.report.designer.ui\"\
  \n              id=\"reportitemUI\"\n              name=\"Report Item UI Extension\
  \ Point\"/>\n      </appInfo>\n      <documentation>\n          此扩展点与模型中定义的\n  \
  \        Report Item 点配合使用。它用于用于注册用于扩展项的 GUI。\n      </documentation>\n    </annotation>\n\
  \    <element name=\"extension\">\n      ...\n      <complexType>\n        <sequence>\n\
  \          ...\n          <element ref=\"model\"/>\n          <element ref=\"builder\"\
  \ minOccurs=\"0\" maxOccurs=\"1\"/>\n          <element ref=\"palette\" minOccurs=\"\
  0\" maxOccurs=\"1\"/>\n          <element ref=\"editor\" minOccurs=\"0\" maxOccurs=\"\
  1\"/>\n          <element ref=\"outline\" minOccurs=\"0\" maxOccurs=\"1\"/>\n  \
  \        <element ref=\"description\" minOccurs=\"0\" maxOccurs=\"1\"/>\n      \
  \  </sequence>\n        <attribute name=\"point\" type=\"string\" use=\"required\"\
  >\n          ...\n        </attribute>\n      </complexType>\n    </element>\n \
  \   <element name=\"model\">\n      <complexType>\n        <attribute name=\"extensionName\"\
  \ type=\"string\" use=\"required\">\n          <annotation>\n            <documentation>\n\
  \              映射到此 UI 的 Report Item 名称。\n            </documentation>\n       \
  \   </annotation>\n        </complexType>\n    </element>\n    ...\n    <element\
  \ name=\"builder\">\n      <annotation>\n        <documentation>\n          编辑器内部元素的可选生成器。当从编辑器内部的调色板拖入新项时，会进行实例化。\n\
  \        </documentation>\n      </annotation>\n      <complexType>\n        <attribute\
  \ name=\"class\" type=\"string\">\n          <annotation>\n            <documentation>\n\
  \              实现 org.eclipse.birt.report.designer.ui.extensions.IReportItemBuilderUI\
  \ 的 Java 类的全限定名\n            </documentation>\n            <appInfo>\n         \
  \     <meta.attribute kind=\"java\"/>\n            </appInfo>\n          </annotation>\n\
  \        </attribute>\n      </complexType>\n    </element>\n    ...\n</schema>\n\
  ```\n\n### 了解插件清单文件\n\n将插件安装在 `$INSTALL_DIR/eclipse/plugins` 的子目录下。插件清单文件 `plugin.xml`\
  \ 向 Eclipse 运行时环境描述插件激活框架。\n\n在运行时，Eclipse 扫描 `$INSTALL_DIR/eclipse/plugins` 中的所有子目录，解析每个插件清单文件的内容，并将信息缓存在插件注册表中。如果\
  \ Eclipse 需要某个扩展，Eclipse 会延迟加载插件，并使用注册表信息实例化插件对象。BIRT 报表引擎的运行时环境工作方式类似。\n\n插件清单文件向插件注册表声明所需的插件代码和扩展点。\n\
  \n\n\n\n\n• `<extension>` 指定了扩展点、相关元素和属性，这些元素定义了插件组件的处理能力。\n\nListing 17-2 显示了插件清单文件\
  \ `org.eclipse.birt.sample.reportitem.rotatedlabel/plugin.xml` 的内容。该文件描述了 BIRT 报告项扩展示例——旋转标签（rotated\
  \ label）所需的类和扩展点。\n\n**Listing 17-2** 示例插件清单文件\n\n***\n\n```xml\n<?xml version=\"\
  1.0\" encoding=\"UTF-8\"?>\n\n<?eclipse version=\"3.2\"?>\n\n<plugin>\n   <extension\n\
  \      id=\"rotatedLabel\"\n      name=\"Rotated Label Extension\"\n      point=\"\
  org.eclipse.birt.report.designer.ui\n         .reportitemUI\">\n      <reportItemLabelUI\n\
  \          class=\"org.eclipse.birt.sample.reportitem\n          .rotatedlabel.RotatedLabelUI\"\
  />\n      <model extensionName=\"RotatedLabel\"/>\n      <palette icon=\"icons/rotatedlabel.jpg\"\
  />\n      <editor\n          canResize=\"true\"\n          showInDesigner=\"true\"\
  \n          showInMasterPage=\"true\"/>\n      <outline icon=\"icons/rotatedlabel.jpg\"\
  />\n   </extension>\n   <extension\n      id=\"rotatedLabel\"\n      name=\"Rotated\
  \ Label Extension\"\n      point=\"org.eclipse.birt.report.model.reportItemModel\"\
  >\n      <reportItem\n          class=\"org.eclipse.birt.sample.reportitem\n   \
  \       .rotatedlabel.RotatedLabelItemFactoryImpl\"\n          extensionName=\"\
  RotatedLabel\">\n        <property\n          defaultDisplayName=\"Display Text\"\
  \n          defaultValue=\"Rotated Label\"\n          name=\"displayText\"\n   \
  \       type=\"string\"/>\n        <property\n          defaultDisplayName=\"Rotation\
  \ Angle\"\n          defaultValue=\"-45\"\n          name=\"rotationAngle\"\n  \
  \        type=\"string\"/>\n      </reportItem>\n   </extension>\n   <extension\n\
  \      id=\"rotatedLabel\"\n      name=\"Rotated Label Extension\n      point=\"\
  org.eclipse.birt.report.engine.reportitem\n         Presentation\">\n      <reportItem\n\
  \          class=\"org.eclipse.birt.sample.reportitem.rotated\n          label.RotatedLabelPresentationImpl\"\
  \n          name=\"RotatedLabel\"/>\n   </extension>\n   <extension\n      point=\"\
  org.eclipse.birt.report.designer.ui\n         .Adapters\">\n      <adaptable\n \
  \         class=\"org.eclipse.birt.report.model.api\n         .ExtendedItemHandle\"\
  >\n        <adapter\n            factory=\"org.eclipse.birt.sample.reportitem\n\
  \            .rotatedlabel.views\n          .RotatedPageGeneratorFactory\"\n   \
  \         id=\"ReportDesign.AttributeView\n          .RotatedPageGenerator\"\n \
  \           priority=\"1\"\n            singleton=\"false\"\n            type=\"\
  org.eclipse.birt.report.designer.ui\n         .views.IPageGenerator\">\n       \
  \   <enablement>\n            <test\n              forcePluginActivation=\"true\"\
  \n              property=\"ExtendItemHandle.extensionName\"\n              value=\"\
  RotatedLabel\">\n            </test>\n          </enablement>\n        </adapter>\n\
  \      </adaptable>\n   </extension>\n</plugin>\n```\n\n### 理解插件运行时类\n\n插件在插件运行时类的实例中运行。插件运行时类扩展了\
  \ `org.eclipse.core.runtime.Plugin`，它是所有插件运行时类实现的抽象父类。Plugin 运行时类定义了启动、管理和停止插件实例的方法。\n\
  \nPlugin 类通常包含对开放服务网关计划（OSGi）资源包的引用，该资源包管理执行上下文。`Plugin` 实现了 `org.osgi.framework.BundleActivator`\
  \ 接口，它负责安装、启动和卸载 OSGi 资源包。OSGi 资源包实现了一个服务注册，以支持以下服务：\n\n- 安装和卸载资源包\n- 订阅事件\n- 注册服务对象\n\
  - 获取服务引用\n\nOSGi 平台提供了一个安全的、托管的、可扩展的 Java 框架，用于下载、部署和管理服务应用程序。有关 OSGi 平台的更多信息，请访问\
  \ OSGi 联盟网站 [`www.osgi.org/`](http://www.osgi.org/)。\n\nListing 17-3 是一个代码示例，展示了旋转标签报告项插件的生命周期和资源包方法。\n\
  \n**Listing 17-3** 旋转标签报告项插件的示例代码\n\n```java\npackage org.eclipse.birt.sample.reportitem.rotatedlabel;\n\
  \nimport org.eclipse.core.runtime.Plugin;\nimport org.osgi.framework.BundleContext;\n\
  \n/**\n * 激活类控制插件的生命周期\n */\npublic class RotatedLabelPlugin extends Plugin {\n\
  \    // 插件 ID\n    public final String PLUGIN_ID = \"org.eclipse.birt.sample.reportitem.rotatedlabel\"\
  ;\n\n    // 共享实例\n    private static RotatedLabelPlugin plugin;\n\n    /**\n   \
  \  * 构造函数。\n     */\n    public RotatedLabelPlugin() {\n    }\n\n    /**\n     *\
  \ 在插件激活时调用此方法\n     */\n    public void start(BundleContext context) throws Exception\
  \ {\n        super.start(context);\n        plugin = this;\n    }\n\n    /**\n \
  \    * 当插件停止时调用此方法\n     */\n    public void stop(BundleContext context) throws\
  \ Exception {\n        plugin = null;\n        super.stop(context);\n    }\n\n \
  \   /**\n     * 返回共享实例。\n     */\n    public static RotatedLabelPlugin getDefault()\
  \ {\n        return plugin;\n    }\n}\n```\n\n### 使用 Eclipse PDE\n\nEclipse PDE\
  \ 是一个用于创建、开发、测试和部署插件的集成设计工具。PDE 提供向导、视图和启动器来协助开发。\n\nPDE 提供了一个向导——新插件项目（New Plug-in\
  \ Project），协助设置插件并创建框架扩展。\n\n#### 如何选择插件开发视图\n\n要访问 PDE，请选择插件开发视图。要打开插件开发视图，请执行以下操作：\n\
  \n1. 从 Eclipse 菜单中选择 `Window->Open Perspective->Other`。\n2. 选择 `Plug-in Development`，如图[17-1](#ch17.html_ch17ex02）所示。\n\
  \n**图 17-1** 选择视图\n\n#### 如何设置新插件项目\n\n要访问新插件项目向导并创建项目，请执行以下操作：\n\n1. 从文件菜单中选择 `File->New->Project`。\n\
  2. 在向导中，展开 `Plug-in Development` 并选择 `Plug-in Project`，如图[17-2](#ch17.html_ch17ex02）所示。\n\
  \n**图 17-2** 创建插件项目\n\n### 理解插件项目属性\n\n新插件项目向导为插件定义了以下属性：\n\n- 项目设置\n- 名称\n- 路径\n\
  - 源码和输出文件夹\n- 目标平台，指定 Eclipse 版本或 OSGi 框架\n- 插件内容\n- 属性，如 ID、版本号、名称、提供者以及运行时类类路径\n\
  - 生成激活类，一个控制插件生命周期的 Java 类\n\n#### 理解 Eclipse PDE 工作区\n\nEclipse PDE 支持工作区项目的主机和运行时实例。宿主机实例提供开发环境。运行时实例支持启动插件进行测试。\n\
  \n\n\n\n\n图 17-4 显示了 PDE Workbench 宿主机实例中报告项扩展示例、旋转标签的项目。\n\n**图 17-4** 查看 PDE Workbench\
  \ 的宿主机实例\n\n![image](img/17fig04.jpg)\n\n在宿主机实例，PDE Workbench 提供了以下视图和编辑器组件：\n\n\
  * `Package Explorer`（包资源管理器）提供插件包的可展开视图。\n* `Outline`（大纲）提供项目设置的可展开视图。\n* `PDE Manifest\
  \ Editor`（PDE 清单编辑器）显示一个包含 `Outline` 中当前所选项目项目设置的页面。\n\n在 `PDE Manifest Editor`\
  \ 中，可以在以下页面指定项目设置并编辑相关文件，以创建插件框架：\n\n* `Overview`（概览）\n  列出常规信息，如插件 ID、版本、名称、提供者、平台过滤器和激活器类。此页面还包含链接到插件内容页、扩展、测试和调试启动器、部署向导以及执行环境设置的章节。\n\
  * `Dependencies`（依赖关系）\n  列出编译和运行必须位于类路径上的插件。\n* `Runtime`（运行时）\n  声明插件向客户端公开的包。标识包对其他插件的可见性，以及插件类路径中的库和文件夹。\n\
  * `Extensions`（扩展）\n  声明插件对平台实现的扩展，并提供扩展详情，如扩展点 ID、名称、描述和架构。\n* `Extension Points`（扩展点）\n\
  \  声明插件为平台添加的新扩展点。\n* `Build`（构建）\n  显示构建配置设置。对此页面上的设置进行更改将更新文件 `build.properties`。\n\
  * `MANIFEST.MF`\n  显示一个可编辑的页面，包含清单文件 `MANIFEST.MF` 的头部设置，该文件提供了有关 OSGi 包的描述性信息。\n\
  * `Plug-in.xml`\n  显示一个可编辑的页面，包含插件清单文件 `plugin.xml` 的设置。\n* `Build.properties`\n\
  \  显示一个可编辑的页面，包含文件 `build.properties` 的设置。\n\n对 `PDE Manifest Editor` 页面中设置的修改会自动更新相应的插件清单或构建属性文件。\n\
  \n### 创建插件扩展的结构\n\n使用 PDE Workbench 宿主机实例通过执行以下任务创建插件扩展的基本结构：\n\n* 指定插件依赖\n* 验证插件运行时存档\n\
  * 指定插件扩展\n\n#### 如何指定插件依赖\n\n**1** 在 `PDE Manifest Editor` 上，选择 `Overview`。\n**2**\
  \ 在 `Plug-in Content` 中，选择 `Dependencies`。\n**3** 在 `Required Plug-ins` 中，选择 `Add`。\n\
  **4** 在 `Plug-in Selection` 中，选择一个插件，如下例所示，如图 17-5 所示：\n\n**图 17-5** 指定插件依赖\n\n\
  ![image](img/17fig05.jpg)\n\n选择 `OK`。\n**5** 重复步骤 2 和 3，在 `Dependencies` 页面的所需插件列表中添加更多插件。\n\
  \n在 `Required Plug-ins` 中，列表顺序决定了插件在运行时的加载顺序。使用 `Up`（向上）和 `Down`（向下）更改加载顺序。\n\n\
  图 17-6 显示了插件扩展的依赖列表示例。\n\n**图 17-6** 查看插件依赖\n\n![image](img/17fig06.jpg)\n\n####\
  \ 如何验证插件运行时存档\n\n**1** 在 `PDE Manifest Editor` 上，选择 `Runtime`。出现 `Runtime`，如图 17-7\
  \ 所示。\n\n**图 17-7** 指定运行时可见性\n\n![image](img/17fig07.jpg)\n\n**2** 在 `Runtime` 中，执行以下任务：\n\
  \n* 在 `Exported Packages`（导出包）中，列出插件向客户端公开的所有包。\n* 在 `Package Visibility`（包可见性）中，当插件处于严格运行时模式时，指示所选包对下游插件可见，还是对指定插件外隐藏。\n\
  * 在 `Classpath`（类路径）中，选择 `Add` 将存档文件或文件夹的名称添加到 `.classpath`。\n\n#### 如何指定插件扩展\n\n\
  **1** 在 `PDE Manifest Editor` 上，选择 `Extensions`。\n**2** 在 `All Extensions`（所有扩展）中，选择\
  \ `Add`。出现 `New Extension`。\n**3** 在 `Extension Point Selection`（扩展点选择）上，在 `Extension\
  \ Points` 中选择一个插件，如下例中的所示：\n\n`org.eclipse.birt.report.designer.ui.reportitemUI`\n\
  \n出现 `New Extension`，如图 17-8 所示。\n\n**图 17-8** 选择扩展点\n\n![image](img/17fig08.jpg)\n\
  \n选择 `Finish`。出现 `Extensions`，如图 17-9 所示。\n\n**图 17-9** 查看扩展点选择\n\n![image](img/17fig09.jpg)\n\
  \n重复步骤 2 和 3，在 `Extensions` 页面的所需扩展点列表中添加更多插件。\n\n### 创建插件扩展内容\n\nXML 架构指定了在 PDE\
  \ 中创建扩展时使用的语法。在 `Extensions` 页面上选择一个元素，Eclipse 使用 XML 架构填充 `Element Details`（元素详情）章节，该章节包含元素的属性列表和值。\n\
  \n在 `Extensions` 中，如图 17-10 所示，如果你选择 `Find extension point`，PDE 将搜索当前选的扩展点。如果你选择\
  \ `Open extension point schema`，PDE 将打开 `.exsd` 文件。如果你选择 `Show extension point description`，PDE\
  \ 将生成 HTML 页面并在查看器中显示。\n\n**图 17-10**（根据上下文）\n\n本节讨论了以下任务：\n\n* 搜索并查看扩展点信息\n* 指定插件内容\n\
  * 指定构建配置\n\n#### 如何搜索并查看扩展点信息\n\n**1** 在 Eclipse 中，在 `All Extensions` 中选择一个扩展，例如\
  \ `org.eclipse.birt.report.designer.ui.reportitemUI`。\n**2** 在 `Extension Details`\
  \ 中，选择 `Find extension point`。出现 `Search`。如图 17-10 所示，`Search` 列出了匹配项 `org.eclipse.birt.report.designer.ui.reportitemUI`。\n\
  **3** 在 `Search` 中双击匹配项。在 `PDE Manifest Editor` 中，`org.eclipse.birt.report.designer.ui/plugin.xml`\
  \ 文件的内容在新窗口中，如图 17-11 所示：\n\n**图 17-11** 显示扩展点的 plugin.xml\n\n![image](img/17fig11.jpg)\n\
  \n`plugin.xml` 描述了扩展点 `odatasource`、`reportItemUI`、`menuBuilders`、`elementAdapters`、`reportItemEditor`\
  \ 和 `DNDServices`。\n\n**4** 在 `PDE Manifest Editor` 中，关闭显示 `plugin.xml` 文件的窗口。\n\
  **5** 选择 `Extensions`。在 `Extension Details` 中，选择 `Open extension point schema`。PDE\
  \ Manifest Editor 打开 `Report Item Extension Point` 架构，如图 17-12 所示。\n\n**图 17-12**\
  \ 查看扩展点架构\n\n![image](img/17fig12.jpg)\n\n架构显示了常规信息的摘要、架构包含和文档。\n**6** 在 `Extension\
  \ Details` 中，选择 `Show extension point description`。查看器打开，显示扩展点的 HTML 文档，如图 17-13\
  \ 所示。\n\n**图 17-13** 查看扩展点描述\n\n![image](img/17fig13.jpg)\n\n在 HTML 文档中，`Configuration\
  \ Markup` 显示扩展点的属性列表。向下滚动查看 HTML 文档的所有内容，包括报告项扩展的可选用户界面元素集，如生成器、调面板、编辑器、大纲和描述。\n\
  \n\n\n\n2 在“所有扩展”（All Extensions）中，右键点击一个扩展点，例如 `org.eclipse.birt.report.designer.ui.reportItemUI`。然后，选择`New→<扩展点元素>`。图\
  \ 17-14 中的示例显示了如何选择扩展点元素 `reportItemLabelUI`。\n\n**图 17-14** 选择扩展点元素\n\n![image](img/17fig14.jpg)\n\
  \n“扩展”（Extensions）窗口出现，显示扩展元素及其详细信息，如图 17-15 所示。\n\n**图 17-15** 查看扩展及扩展元素详情\n\n\
  ![image](img/17fig15.jpg)\n\n在此示例中，“所有扩展”列出了扩展项 `org.eclipse.birt.sample.reportitem.rotatedlabel.RotatedLabelUI`\
  \ (`rotatedItemLabelUI`)，而“扩展元素详情”（Extension Element Details）列出了 `rotatedItemLabelUI`\
  \ 的属性。在“扩展元素详情”中，必需属性（如 `class`）的标签包含一个星号。\n\n3 要查看“扩展元素详情”中列出的属性的注释，将光标悬停在属性标签上。\n\
  \n会出现一个提示框（Tooltip），显示来自 XML 架构的该属性注释。图 17-16 显示了示例扩展元素 `rotatedItemLabelUI` 的 `class`\
  \ 属性的注释。\n\n**图 17-16** 查看扩展元素的注释\n\n![image](img/17fig16.jpg)\n\n4 要为扩展元素指定类属性，在“扩展元素详情”中选择\
  \ `class`。如果类文件存在，则会在 PDE Manifest 编辑器中打开类文件。如果不存在类文件，则出现 Java 属性编辑器（Java Attribute\
  \ Editor），如图 17-17 所示。\n\n**图 17-17** 在 Java 属性编辑器中指定类\n\n![image](img/17fig17.jpg)\n\
  \n在 Java 属性编辑器中，你可以修改或添加以下类属性的设置：\n\n- 源文件夹（Source folder）\n- 包（Package）\n- 闭包类型（Enclosing\
  \ type）\n- 类名（Class name）\n- 修饰符，如 public, default, private, protected, abstract,\
  \ final 和 static\n- 超类（Superclass）\n- 接口（Interfaces）\n- 方法存根，如 main、构造函数和继承的抽象方法\n\
  - 注释（Comments）\n\n修改设置后，选择`Finish`。要向所选的扩展点添加更多元素和属性，请重复步骤 1 和 2。\n\n图 17-18 显示了示例报告表项扩展\
  \ `org.eclipse.birt.sample.reportitem.rotatedlabel` 所需的全部扩展点完整列表。\n\n**图 17-18**\
  \ 查看扩展的所有扩展点\n\n![image](img/17fig18.jpg)\n\n### 构建插件扩展\n\n在 Eclipse PDE Manifest\
  \ 编辑器中，使用 `Build` 来指定构建配置，包括以下项目：\n\n- 运行时信息（Runtime Information）：定义库、编译到每个库的源文件夹以及编译顺序。\n\
  - 二进制构建（Binary Build）：选择包含在二进制构建中的文件和文件夹。\n- 源码构建（Source Build）：选择包含在源码构建中的文件和文件夹。通常不需要源码构建。源码构建使用\
  \ `org.eclipse.pde.core.source` 扩展点，允许 PDE 查找其他插件中库的源码包。\n\n#### 如何指定构建配置\n\n1.\
  \ 在 PDE Manifest 编辑器中，选择`Build`。出现构建配置窗口。图 17-19 显示了 Build。\n\n**图 17-19** 构建配置\n\
  \n![image](img/17fig19.jpg)\n\n2. 在“运行时信息”中，选择`Add Library`。出现“添加项”（Add Entry）。\n\
  \n3. 在“添加项”中，输入新库名称，如图 17-20 所示，或从列表中选择运行时库名称。\n\n**图 17-20** 添加库\n\n![image](img/17fig20.jpg)\n\
  \n选择`OK`。新库名称将出现在“运行时信息”中。\n\n4. 要更改库的编译顺序，请更改其在列表中的位置。在“运行时信息”中选择该库。然后选择`Up` 或\
  \ `Down`。图 17-21 中的示例显示选择了 `library.jar` 且 `Down` 可用。\n\n**图 17-21** 更改库的编译顺序\n\n\
  ![image](img/17fig21.jpg)\n\n5. 要向库添加文件夹，选择`Add Folder`。\n\n6. 在“新源文件夹”中选择一个如 `src`\
  \ 的文件夹，如图 17-22 所示。\n\n**图 17-22** 指定新的源文件夹\n\n![image](img/17fig22.jpg)\n\n选择`OK`。出现“运行时信息”，如图\
  \ 17-23 所示。\n\n**图 17-23** 查看运行时信息\n\n![image](img/17fig23.jpg)\n\n7. 在“二进制构建”中，通过选择文件夹将文件夹包含在二进制构建中。图\
  \ 17-24 显示选择了文件夹。\n\n**图 17-24** 在二进制构建中包含文件夹\n\n![image](img/17fig24.jpg)\n\n8.\
  \ 从 Eclipse 菜单中选择`Project→Build All`以构建项目。或者，选择`Project→Build Automatically`以便在修改代码时自动构建项目。\n\
  \n#### 生成 Ant 脚本\n\nPDE 可以根据 `build.properties` 文件中的设置生成 Ant 脚本，该脚本使用指定的 Java 编译器编译项目。\n\
  \n#### 如何生成 Ant 脚本\n\n在包管理器中，右键点击项目的 `plugin.xml` 文件并选择`PDE Tools→Create Ant Build`。PDE\
  \ 工具会在项目中创建一个名为 `build.xml` 的 Ant 脚本。\n\n### 测试插件扩展\n\n你可以运行运行时工作区来测试和调试插件扩展。\n\n\
  1. 在 PDE Manifest 编辑器中，选择`Overview`。出现“概述”窗口，如图 17-25 所示。\n\n**图 17-25** 显示测试选项的概述\n\
  \n![image](img/17fig25.jpg)\n\n2. 在“测试”中，选择`Launch an Eclipse application`。Eclipse\
  \ 启动应用程序。\n\n在报告项扩展中，出现了 `Report Design—Eclipse SDK`。在运行时工作区中创建一个新的报告设计项目以使用标签扩展。\n\
  \n### 部署扩展\n\n在 PDE 中，插件开发者可以使用 `Export Wizard` 生成一个包含插件代码和其他资源的可发行包。插件开发者可以使用 PDE\
  \ 中的 `Update Site Editor` 创建并管理更新站点。用户可以使用安装软件或更新管理器将包的内容提取到 Eclipse 安装中。\n\n####\
  \ 如何部署插件扩展\n\n1. 在 PDE Manifest 编辑器中，选择`Overview`。\n2. 在“导出”中，选择`Export Wizard`。出现导出向导。\n\
  3. 在“可用插件和片段”中，选择要导出的插件。例如，选择 `org.eclipse.birt.sample.reportitem.rotatedlabel`。\n\
  4. 在“导出目标”中，指定`Archive file`（归档文件）或`Directory`（目录）。例如，在`Directory`中输入：\n```\nC:\\\
  birt-runtime_2_6_0\\ReportEngine\\plugins\n```\n导出窗口如图 17-26 所示。\n\n**图 17-26**\
  \ 导出插件\n\n![image](img/17fig26.jpg)\n\n5. 在“导出选项”中，如有需要选择以下选项：\n- 包含源码\n- 将插件打包为独立的\
  \ JAR 归档\n- 保存为 Ant 脚本\n\n选择`Finish` 将插件导出到指定位置。\n\n### 创建更新站点项目\n\n插件开发者还可以使用更具结构化的方法并将插件分组为功能（Features）。功能包含信息，使安装软件或更新管理器能够定位已发布的更新并发现新的相关功能。更新通常发布在称为更新点的特殊互联网目录中，该站点由插件开发者使用\
  \ `Update Site Editor` 创建和管理。\n\n\n\n\n插件开发者可以通过在 Eclipse PDE 工作区中构建更新站点项目来创建一个更新站点。更新站点项目包含一个名为\
  \ `site.xml` 的清单文件，该文件列出了所有的功能（features）和插件包（plug-ins）。\n\n构建操作会将功能的 JAR 文件放置在 `features`\
  \ 文件夹中，将插件的 JAR 文件放置在 `plug-ins` 文件夹中。Eclipse PDE 还支持将更新站点上传到远程服务器或本地文件系统以便发布。\n\
  \n## 如何创建更新站点项目\n\n1. 从 Eclipse 菜单中，选择 `File→New→Project`。出现 New Project（新项目）。\n\
  \n2. 在向导程序（Wizards）中，打开 `Plug-in Development` 并选择 `Update Site Project`，如图 17-27\
  \ 所示。点击 Next。\n\n**图 17-27** 选择 Update Site Project 向导\n\n![image](img/17fig27.jpg)\n\
  \n3. 在 `Update Site Project` 中，指定以下项：\n\n• 项目名称（Project name）\n• 项目内容目录，例如 `C:/birt-runtime-2_6_0\
  \ BIRT Update Site`\n• Web 资源（Web resources）\n• 选择选项 `Generate web page listing\
  \ of all available features within the site.`（生成站点内所有可用功能的网页列表）。\n这将创建 `index.html`、`site.css`\
  \ 和 `site.xls` 文件来显示更新站点的内容。\n• Web 资源位置（Web resources location）。更改此设置为 Web 资源位置。默认值为\
  \ `web`。\n\nUpdate Site Project 如图 17-28 所示所示。点击 Finish。\n\n**图 17-28** 创建新的更新站点项目\n\
  \n![image](img/17fig28.jpg)\n\nUpdate Site Map（更新站点映射）如图 17-29 所示。\n\n**图 17-29**\
  \ 更新站点映射\n\n![image](img/17fig29.jpg)\n\n4. 选择 `New Category`（新建类别）来创建一个功能类别。\n\n\
  5. 选择 `Add Feature`（添加功能）向选定的类别中添加功能。\n\n### 安装可用软件\n\n如果新环境中所有依赖资源都可用，Eclipse 可以在运行时发现并激活该插件。在未管理的发布和安装中，如果未来发布了插件更新，用户必须查找并安装这些更新。\n\
  \n选择 `Help→ Install New Software`（帮助→ 安装新软件）以访问可用软件。Install Software 支持搜索可用站点的更新和新功能，如图\
  \ 17-30 所示。\n\n**图 17-30** 安装新软件\n\n![image](img/17fig30.jpg)\n\n## 下载扩展示例代码\n\n\
  本书提供了以下类型 BIRT 扩展的示例示例：\n\n• 高级报表项目（Advanced report item）\n示例演示了如何为自定义的旋转报表项目开发额外的用户界面功能。示例展示了如何实现报告项目生成器（report\
  \ item builder）、右键菜单、自定义属性页和数据绑定。\n\n• ODA 驱动程序（ODA drivers）\nCSV ODA 驱动示例是一个从 CSV\
  \ 文件读取数据的插件。Hibernate ODA 驱动示例使用 `HQL`（Hibernate 查询语言）提供一个透明 SQL 的扩展，使 ODA 扩展能够适用于所有关系型数据库。这些示例还展示了如何为\
  \ BIRT Report Designer 2.6 用户界面开发 ODA 扩展，以便报表开发者可以选择一个扩展的 ODA 驱动程序。\n\n• 插件片段（Plug-in\
  \ fragment）\n插件片段示例为现有插件为 BIRT Report Viewer 添加西班牙语和日语本地化功能。\n\n• 报表项目（Report item）\n\
  示例演示了如何构建一个旋转标签报表项目插件，并使用定义的扩展点将该报表项目添加到 BIRT Report Designer 中。该插件将报表项目的标签渲染为图像。扩展会旋转报表设计中的图像，以便以指定的角度显示标签。\n\
  \n• 报表渲染（Report rendering）\n示例展示了如何扩展发射器接口（emitter interfaces），以构建并部署一个在 BIRT Report\
  \ Engine 环境中运行的报表渲染插件。CSV（逗号分隔值）扩展示例是一个将报表中的表格数据写入 CSV 格式文件的插件。XML 扩展示例是一个将报表中的表格数据写入\
  \ XML 格式文件的插件。\n\n你可以在 [`www.actuate.com/birt/contributions`](http://www.actuate.com/birt/contributions)\
  \ 下载这些扩展示例的源码。\n\n## 第 18 章。开发报表项目扩展\n\n本章描述了如何在 Eclipse PDE 中使用示例报表项目扩展——旋转标签（rotated\
  \ label）来创建 BIRT 扩展。BIRT 报表项目扩展在以下章节中介绍：\n\n• 理解报表项目扩展\n• 开发示例报表项目扩展\n• 理解旋转标签报表项目扩展\n\
  • 部署和测试旋转标签报表项目插件\n• 开发高级报表项目\n\n### 理解报表项目扩展\n\n使用报表项目扩展，通过实现多个扩展点来向 BIRT 框架添加新的报表项目类型。定义扩展点的插件通常在\
  \ schema 子目录中包含一个 XML 扩展点架构定义文件（`.exsd`）。该架构描述了扩展所使用的元素、属性和类型。\n\n为了支持报表项目，报表项目扩展提供了以下扩展点：\n\
  \n• 报表项目模型（Report item model）\n`org.eclipse.birt.report.model.reportItem` 指定报表项目扩展。架构文件为\
  \ `org.eclipse.birt.report.model/schema/reportItem.exsd`。\n\n• 报表项目用户界面（Report item\
  \ user interface）\n`org.eclipse.birt.report.designer.ui.reportitemUI` 指定报表项目面板中的用户界面扩展点。架构文件为\
  \ `org.eclipse.birt.report.designer.ui/schema/reportitemUI.exsd`。\n\n• 报表项目查询（Report\
  \ item query）\n`org.eclipse.birt.report.engine.reportitemQuery` 指定 BIRT 设计器和引擎中的查询准备扩展点。查询准备是可选的。架构文件为\
  \ `org.eclipse.birt.report.engine/schema/reportitemQuery.exsd`。\n\n• 报表项目运行时（Report\
  \ item run time）\n`org.eclipse.birt.report.engine.reportitemGeneration` 指定报表生成期间实例化、处理和持久化新报表项目的扩展点。运行时扩展是可选的。架构文件为\
  \ `org.eclipse.birt.report.engine/schema/reportitemGeneration.exsd`。\n\n• 报表项目展示（Report\
  \ item presentation）\n`org.eclipse.birt.report.engine.reportitemPresentation` 指定报表展示期间实例化、处理和渲染新报表项目的扩展点。架构文件为\
  \ `org.eclipse.birt.report.engine/schema/reportitemPresentation.exsd`。\n\n• 报表项目\
  \ UI 属性页适配器（Report item UI property page adapters）\n`org.eclipse.birt.report.designer.ui.elementAdapters`\
  \ 指定报表项目属性页 UI 的适配器扩展点。架构文件为 `org.eclipse.birt.report.designer.ui/schema/elementAdapters.exsd`。\n\
  \n• 报表项目发射器（Report item emitter）\n`org.eclipse.birt.report.engine.emitters` 指定展示引擎支持新输出格式的扩展点。发射器扩展是可选的。架构文件为\
  \ `org.eclipse.birt.report.engine/schema/emitters.exsd`。\n\n在运行时，BIRT 报表引擎在渲染最终输出之前，会对报表项目进行以下处理：\n\
  \n• 查询准备\n收集报表定义的数据绑定信息和表达式，并将这些信息传递给报表引擎。数据引擎根据这些信息准备数据访问策略。\n\n• 生成\n\n• \n\n\n\
  \n\n将报告项渲染为支持的数据原始类型，例如图像、字符串、HTML 片段或自定义数据组件。\n\n- **Emitter（发射器）**\n\n将输出转换为指定的格式，例如\
  \ HTML 或 PDF。\n\n本章提供了一个自定义报告项扩展 `org.eclipse.birt.sample.reportitem.rotatedlabel`\
  \ 的示例。\n\n标准报告项插件 `chart` 是一个更复杂的报告项扩展示例。BIRT 图表插件实现了用户界面和报告引擎扩展，支持使用柱状图、折线图、饼图、散点图、股票图或其他图表进行报告设计。\n\
  \n有关报告项 API 的参考文档，请参阅 Eclipse Help 中 BIRT 程序员参考书中关于 `org.eclipse.birt.report.engine.extension`\
  \ 包的 Javadoc。\n\n### 开发示例报告项扩展\n\n报告项扩展框架支持在 BIRT Report Designer 的调色板中创建自定义报告项。你可以像使用标准报告项（如\
  \ `Label`、`Text`、`Grid`、`Table` 或 `Chart`）一样，在报告设计中使用报告项扩展。\n\n旋转标签报告项扩展的示例代码创建了一个可以在指定角度渲染文本的标签元素。要实现旋转标签报告项扩展，请执行以下任务：\n\
  \n- **配置插件项目。**\n  按照本章中的说明手动构建旋转标签报告项插件。\n\n- **将报告项添加到 Report Designer UI 中。**\n\
  \  使用 `org.eclipse.birt.report.designer.ui.reportItemUI` 扩展报告项 UI 扩展点。\n\n- **将报告项属性页添加到\
  \ Report Designer UI 中。**\n  使用 `org.eclipse.birt.report.designer.ui.elementAdapters`\
  \ 扩展报告项 UI 属性页扩展点。\n\n- **将报告项定义添加到 ROM 中。**\n  使用 `org.eclipse.birt.report.model.reportItemModel`\
  \ 扩展报告项模型 扩展点。\n\n- **添加报告项的运行时行为。**\n  使用 `org.eclipse.birt.report.engine.reportItemPresentation`\
  \ 扩展报告项呈现 扩展点。\n\n- **部署报告项扩展。**\n  从你的工作区将旋转标签报告项插件文件夹导出到 `eclipse\\plugins` 文件夹。当你在\
  \ PDE 中作为 Eclipse 启动该扩展时，此步骤对于测试扩展并非必须。\n\n旋转标签报告项扩展示例的源代码可用 [`www.actuate.com/birt/contributions`](http://www.actuate.com/birt/contributions)。\n\
  \n旋转标签报告项扩展依赖于以下 Eclipse 插件：\n\n- `org.eclipse.core.runtime.compatibility`\n- `org.eclipse.birt.core.ui`\n\
  - `org.eclipse.birt.data`\n- `org.eclipse.birt.report.designer.core`\n- `org.eclipse.birt.report.designer.ui`\n\
  - `org.eclipse.birt.report.designer.ui.views`\n- `org.eclipse.birt.report.engine`\n\
  - `org.eclipse.ui`\n\n#### 从 CVS 仓库下载 BIRT 源代码\n\nEclipse 在 CVS 仓库中向开发者社区提供了 BIRT\
  \ 源代码。编译任何所需的插件都不需要 BIRT 源代码。\n\n默认情况下，系统使用 `$INSTALL_DIR\\eclipse\\plugin` 文件夹中的\
  \ JAR 文件。这些插件必须在类路径中才能成功编译。为了进行调试，你可能需要所需 BIRT 插件的源代码。\n\n开发示例旋转标签报告项插件不需要 BIRT\
  \ 源代码。你只需要处理 `org.eclipse.birt.sample.reportitem.rotatedlabel` 包中的 Java 类。\n\n###\
  \ 创建旋转标签报告项插件项目\n\n在 Eclipse PDE 中为旋转标签报告项扩展创建一个新的插件项目。\n\n**如何创建插件项目**\n\n**1**\
  \ 在 Eclipse PDE 中，选择 `File→New→Project`。出现 New Project 窗口。\n\n**2** 在 Select a wizard\
  \ 向导中，选择 `Plug-in Project`。点击 Next。出现 New Plug-in Project 窗口。\n\n**3** 在 `Plug-in\
  \ Project` 中，修改设置，如 表 18-1 所示。\n\n**表 18-1** 报告项插件项目的设置\n![image](img/18tab01.jpg)\n\
  \n出现 Plug-in Project 窗口，如 图 18-1 所示。\n\n**图 18-1** 指定报告项插件项目设置\n![image](img/18fig01.jpg)\n\
  \n点击 Next。出现 Plug-in Content 窗口。\n\n**4** 在 `Plug-in Content` 中，修改设置，如 表 18-2 所示。\n\
  \n**表 18-2** 报告项插件内容的设置\n![image](img/18tab02.jpg)\n\n出现 New Plug-in Content 窗口，如\
  \ 图 18-2 所示。点击 Finish。\n\n**图 18-2** 指定报告项插件项目内容设置\n![image](img/18fig02.jpg)\n\n\
  旋转标签报告项扩展项目出现在 Eclipse PDE 工作空间中，如 图 18-3 所示。\n\n**图 18-3** 报告项插件概览\n![image](img/18fig03.jpg)\n\
  \n#### 为旋转标签项定义依赖\n\n在此任务中，指定编译和运行旋转标签项扩展时可用的插件列表。\n\n**1** 在 `PDE Manifest` 编辑中，选择\
  \ `Overview`。\n\n**2** 在 `Plug-in Content` 中，选择 `Dependencies`。Required-ins 包含：\n\
  `org.eclipse.core.runtime`\n\n**3** 在 Required-ins 中，选择 `org.eclipse.core.runtime`\
  \ 并点击 `Remove`。`org.eclipse.core.runtime` 不再出现在 Required-ins 中。\n\n**4** 在 Required-ins\
  \ 中，点击 `Add`。出现 Plug-in Selection 窗口。\n\n**5** 在 Plug-in Selection 中，按住 `CTRL` 并选择以下项：\n\
  - `org.eclipse.birt.core.ui`\n- `org.eclipse.birt.data`\n- `org.eclipse.birt.report.designer.core`\n\
  - `org.eclipse.birt.report.designer.ui`\n- `org.eclipse.birt.report.designer.ui.views`\n\
  - `org.eclipse.birt.report.engine`\n- `org.eclipse.ui`\n\n点击 OK。出现 Dependencies\
  \ 窗口，如 图 18-4 所示。\n\n**图 18-4** 显示所需的插件依赖\n![image](img/18fig04.jpg)\n\n列表的顺序决定了插件的运行时加载顺序。根据需要使用\
  \ `Up` 和 `Down` 更改顺序，如 图 18-4 所示。\n\n#### 指定旋转标签扩展的运行时包\n\n在 `Runtime` 中指定类路径上的导出包、包可见性和文件夹。在旋转标签报告项插件中，使以下包对其他插件可见：\n\
  - `org.eclipse.birt.sample.reportitem.rotatedlabel`\n- `org.eclipse.birt.sample.reportitem.rotatedlabel.i18n`\n\
  - `org.eclipse.birt.sample.reportitem.rotatedlabel.util`\n- `org.eclipse.birt.sample.reportitem.rotatedlabel.views`\n\
  \n在 `PDE Manifest` 编辑中，选择 `Runtime`。在 `Exported Packages` 中，验证指定的包是否出现在列表中，如 图 18-5\
  \ 所示。\n\n**图 18-5** Runtime 页面\n![image](img/18fig05.jpg)\n\n### 声明报告项扩展点\n\n接下来，指定实现旋转标签报告项扩展所需的扩展点，并添加扩展元素细节。Eclipse\
  \ PDE 使用每个扩展点定义的 XML 架构为扩展元素提供有效属性和值的列表。旋转标签报告项扩展实现了以下扩展点：\n\n- `org.eclipse.birt.report.designer.ui.reportItemUI`:\
  \ 注册用于该报告项扩展的图形用户界面 (GUI)。\n- `org.eclipse.birt.report.model.reportItemModel`: 指定如何在\
  \ ROM 中表示和持久化报告项扩展。\n- `org.eclipse.birt.report.engine.reportItemPresentation`:\
  \ 指定如何在报告呈现时实例化、处理和渲染新的报告项。\n- `org.eclipse.birt.report.designer.ui.elementAdapters`:\
  \ 指定报告项属性页 UI 的适配器。\n\n\n\n\nXML 架构规定了以下属性，用于标识运行时环境中的每个扩展点：\n\n- `ID`: 扩展实例的可选标识符\n\
  - `Name`: 扩展实例的可选名称\n\n扩展点 `org.eclipse.birt.report.designer.ui.reportItemUI` 规定了以下扩展元素：\n\
  \n- `reportItemFigureUI`: 实现 `org.eclipse.birt.report.designer.ui.extensions.IReportItemFigureProvider`\
  \ 接口的 Java 类全限定类名\n- `reportItemLabelUI`: 获取 BIRT Report Designer 中报表项组件显示文本的 Java\
  \ 类全限定类名\n- `reportItemImageUI`: 实现 `org.eclipse.birt.report.designer.ui.extensions.IReportItemImageProvider`\
  \ 接口的 Java 类全限定类名\n- `model`: 映射到此 UI 组件的 ROM 报告项扩展名称\n- `builder`: 当用户从 BIRT Report\
  \ Designer 调色板拖动扩展报表项到编辑器时实例化的可选组件\n- `palette`: 在调色板中显示的图标以及该图标所属的类别\n- `editor`:\
  \ 标记编辑器是否显示在主页（MasterPage）和设计器 UI 中，以及在编辑器中是否可调整大小\n- `outline`: 在大视图中显示的图标\n- `description`:\
  \ 包含描述 UI 扩展功能的的可可选元素\n\n扩展点 `org.eclipse.birt.report.model.reportItemModel` 规定了以下扩展元素属性：\n\
  \n- `extensionName`: 报表项扩展的内部唯一名称\n- `class`: 实现 `org.eclipse.birt.report.model.api.extension.IReportItemFactory`\
  \ 接口的 Java 类全限定类名\n- `defaultStyle`: 用于报表项扩展的预定义样式\n- `isNameRequired`: 表示报表项实例名称是否必的字段\n\
  - `displayNameID`: 显示名称的资源键\n- `extendsFrom`: 报表项扩展的父元素\n- `hasStyle`: 标记扩展项是否可以具有样式的标志\n\
  \n对于 `RotatedLabel`，`reportItem` 规定了以下属性扩展元素：\n\n- `displayText`\n- `rotationAngle`\n\
  \n这些扩展元素规定了以下属性：\n\n- `name`: 属性扩展元素的内部唯一名称。\n- `type`: 数据类型，例如整数或字符串。\n- `displayNameID`:\
  \ 显示名称的资源键。\n- `detailType`: 详细数据类型，例如布尔或字符串。\n- `subType`: 当 `detailType` 为列表时，`subType`\
  \ 是必的，且必须定义为限制选择之一。默认情况下，子类型为字符串。\n- `canInherit`: 表示属性扩展元素是否可以继承属性的标志。\n- `defaultValue`:\
  \ 属性扩展元素的默认值。\n- `isEncryptable`: 表示属性是否可以加密的标志。\n- `DisplayName`: 当不存在本地化 I18N\
  \ 显示名称时使用的显示名称。\n- `isList`: 表示属性值是单个结构还是列表。\n- `hasOwnModel`: 表示 XML 属性是否为扩展模型。\n\
  - `allowExpression`: 表示属性是否可以设为表达式。每个表达式包含值和类型。\n\n扩展点 `org.eclipse.birt.report.engine.reportitemPresentation`\
  \ 规定了以下 reportItem 扩展元素：\n\n- `name`: 报表项扩展的唯一名称。\n- `class`: 实现 `org.eclipse.birt.report.engine.extension.IReportItemPresentation`\
  \ 接口的 Java 类全限定类名。\n- `supportedFormats`: 此扩展项支持的渲染格式。该属性的值为逗号分隔的字符串，例如“HTML,PDF,EXCEL”。该字符串不区分大小写。\n\
  \n扩展点 `org.eclipse.birt.report.designer.ui.elementAdapters` 创建一个实现 `IPageGenerator`\
  \ 接口的适配器类。`org.eclipse.birt.report.model.api.ExtendedItemHandle` 类实现了使扩展点具有适配性的接口。该适配器为属性页指定了以下属性：\n\
  \n- `id`: `ReportDesign.AttributeView.RotatedLabelPageGenerator` 的唯一名称\n- `type`:\
  \ 实现 `org.eclipse.birt.report.designer.ui.views.IPageGenerator`\n- `factory`: 注册并创建\
  \ `IPageGenerator` 实例\n- `singleton`: 表示一个或多个适配器元素是否可以同时存在\n- `priority`: 运行时环境中的优先级\n\
  \n### 如何指定扩展点\n\n1. 在 PDE Manifest Editor 上，选择 `Extensions`。\n2. 在 `All Extensions`\
  \ 中，选择 `Add`。出现新扩展。\n3. 在 `New Extension—Extension Points` 中，从可用扩展点中选择以下插件：\n  \
  \ `org.eclipse.birt.report.designer.ui.reportitemUI`\n   出现 New Extension—Extension\
  \ Points，如图 18-6 所示。\n\n**图 18-6** 新扩展中的扩展点\n![image](img/18fig06.jpg)\n\n当插件未出现在列表中时，取消勾选\
  \ `Show only extension points from the required plug-ins` 选框。\n\n选择 `Finish`。\n\n\
  4. 重复步骤 2 和 3，将以下扩展点添加到 Extensions 页的所需扩展点列表中：\n   - `org.eclipse.birt.report.model.reportItemModel`\n\
  \   - `org.eclipse.birt.report.engine.reportitemPresentation`\n   - `org.eclipse.birt.report.designer.ui.elementAdapters`\n\
  \n图 18-7 显示了报表项扩展示例所需的扩展点列表。\n\n**图 18-7** 报表项扩展所需的扩展点\n![image](img/18fig07.jpg)\n\
