  \ 编码不依赖于任何平台或软件程序，因此为软件国际化提供了基础。\n\n### 相关术语\n代码点、字符、国际化\n\n### 统一资源定位符 (URL)\n\
  一种字符字符串，用于标识可以通过网络访问的信息的位置和类型。`http://` 是该项目可以通过网络访问的指示符。URL 通常包括域名、组织类型以及该项目所在目录结构中的精确位置。\n\
  \n### 相关术语\n字符、域名、超文本传输协议 (HTTP)、字符串\n\n### 对比\n通用资源标识符 (URI)\n\n### 通用超链接\n参见超链接。\n\
  \n### 通用资源标识符 (URI)\n一组短字符串形式的名称和地址，用于标识网络上的资源。资源是文档、下载文件和图像等项目。\n\n### 相关术语\n图像\n\
  \n### 对比\n统一资源定位符 (URL)、字符串\n\n### URI\n参见通用资源标识符 (URI)。\n\n### URL\n参见统一资源定位符 (URL)。\n\
  \n### 值\n1. 常量、参数、符号或变量的内容。\n2. 属性的特定实例。例如，蓝色是颜色属性的一个可能值。\n\n### 相关术语\n属性、常量、参数、变量\n\
  \n### Varchar 数据类型\n一种用于字符串计算的数据类型。Varchar 类型存储 Unicode 字符序列。Varchar 类型支持为字符串指定最大字符长度。\n\
  \n### 相关术语\n字符、数据类型、字符串、Unicode\n\n### 变量\n程序可以修改的数据的命名存储位置。每个变量都有唯一的名称，在其作用域内标识它，并包含特定类型的数据。\n\
  \n### 相关术语\n数据、数据类型、作用域\n\n### 对比\n类变量、动态变量、字段变量、全局变量、实例变量、局部变量、成员变量、静态变量\n\n###\
  \ 视图\n从关系型数据库中的一个或多个表中检索数据的定义查询。与表不同，视图不存储数据。用户可以使用视图选择、删除、插入和更新数据。数据库使用视图的定义来确定对底层表的适当操作。例如，数据库通过组合底层表中请求的数据来查询视图。\n\
  \n### 相关术语\n数据、数据库、查询、表\n\n### 对比\nEclipse 视图、预览器\n\n### 查看时间\n用户查看报告的时间。\n\n###\
  \ 相关术语\n报告\n\n### 对比\n设计时间、运行时间\n\n### 查看器\n支持基本查看任务的工具，如导航报告、使用目录、查看参数信息和导出数据。\n\
  \n### 相关术语\n数据、参数、报告、目录\n\n### 对比\n预览器\n\n### Web 存档 (.war) 文件\n用于封装 Web 应用程序的文件。\n\
  \n### 相关术语\n应用程序、格式\n\n### 对比\nJava 存档 (.jar`) 文件\n\n### 网页\n包含 浏览器解释并显示的标签的超文本标记语言\
  \ (HTML)页面。\n\n### 相关术语\n超文本标记语言 (HTML)、标签\n\n### 对比\n页面\n\n### Web 服务器\n在互联网上提供服务的计算机或程序。Web\
  \ 服务器根据超文本传输协议 (HTTP) 请求。Web 服务器还执行服务器端脚本，如活动服务器页面 (ASP) 和 Java 页面 (JSP)。\n\n###\
  \ 相关术语\n超文本传输协议 (HTTP)、Java 页面 (JSP)、请求、Web 服务\n\n### Web 服务\n一种旨在支持网络上机器交互的软件系统。Web\
  \ 服务指的是使用遵循简单对象访问协议 (SOAP) 标准的可扩展标记语言 (XML) 消息进行通信的客户端和服务器。通过 SOAP 或 HTTP-GET 和\
  \ HTTP-POST 协议进行远程调用。Web 服务以 XML 格式向客户端返回响应。任何支持 SOAP 协议和 XML 的操作系统都可以构建和使用 Web\
  \ 服务。\n\n### 相关术语\n可扩展标记语言 (XML)、超文本传输协议 (HTTP)、协议、简单对象访问协议 (SOAP)\n\n### 对比\n请求\n\
  \n### 良好的 XML\n\n\n\n\n\n遵循 XML 1.0 建议建立的语法规则的可扩展标记语言 (XML) 文档。格式良好意味着文档必须包含一个或多个元素，且根元素必须包含所有其他元素。每个元素必须按照语法规则嵌套在任何包含元素内部。\n\
  \n### 相关术语\n元素 (element), 可扩展标记语言 (XML),语法\n\n### Word 转换器\n一种将 BIRT 报告转换为 Microsoft\
  \ Word (.doc) 文件的工具。\n\n### 相关术语\n业务智能和报告工具 (BIRT), 转换器,报告\n\n### 工作台 (workbench)\n\
  参见 Eclipse Workbench。\n\n### 工作空间 (workspace)\n参见 Eclipse workspace。\n\n### 世界维网联盟\
  \ (W3C)\n一个提供网络标准建议的国际标准组织。世界维网联盟发布多个级别的文档，包括注释、工作草案、建议书以及关于可扩展标记语言 (XML) 和超文本标记语言\
  \ (HTML) 等主题的网络应用程序建议。\n\n### 相关术语\n应用程序 (application), 可扩展标记语言 (XML), 超文本标记语言 (HTML)\n\
  \n### XML (可扩展标记语言)\n参见 可扩展标记语言 (XML)。\n\n### XML 转换器\n一种将报告转换为可扩展标记语言 (XML) 文件的工具。\n\
  \n### 相关术语\n转换器, 可扩展标记语言 (XML),报告\n\n### XML 元素\n参见 元素。\n\n### XML 路径语言 (XPath)\n\
  XPath 支持基于文档层级结构的路径，对可扩展标记语言 (XML) 文档中的单个或多个元素进行定址。\n\n### 相关术语\n元素, 可扩展标记语言 (XML)\n\
  \n### XML schema\n参见 schema (架构)。\n\n### XPath\n参见 XML 路径语言 (XPath)。\n\n### Z 序\n\
  组合图、多 *y* 轴图或三维图元素元素图表系列的显示顺序。Z 序较高的系列会隐藏 Z 序较低的系列。图 G-34 中的示例显示了一个 Z 序为 1 的柱状系列和一个\
