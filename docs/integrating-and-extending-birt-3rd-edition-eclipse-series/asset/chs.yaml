  \ ) ) {\n   IScalarParameterDefn param =\n      (IScalarParameterDefn) iterOuter.next(\
  \ );\n   String value = (String) inputValues.get( param.getName( ));\n   if ( value\
  \ != null ) {\n      parameterValues.put( param.getName( ),\n         cfgConverter.parse(\
  \ value, param.getDataType( ) ) );\n   }\n}\n// 关闭参数定义任务。\ntask.close( );\n```\n\
  \n### 获取级联参数的值\n\n级联参数组包含一组有序的参数，这些参数为最终用户提供一组可选的值列表。为第一个参数选择的值会限制第二个参数的可用值，依此类推。参数使用一个或多个查询从数据集中检索显示给用户的值。参数定义任务使用查询中的数据行，根据组中先前的参数值来过滤每个参数的值。例如，考虑使用以下查询的级联参数组：\n\
  \n```sql\nSELECT\n   PRODUCTS.PRODUCTLINE,\n   PRODUCTS.PRODUCTNAME,\n   PRODUCTS.PRODUCTCODE\n\
  FROM CLASSICMODELS.PRODUCTS\n```\n\n该组有两个参数：对应 `PRODUCTS.PRODUCTLINE` 的 `ProductLine`\
  \ 和对应 `PRODUCTS.PRODUCTCODE` 的 `ProductCode`。`ProductCode` 的显示文本使用了 `PRODUCTS.PRODUCTNAME`。Figure\
  \ 14-1 显示了在 BIRT 报告设计器中预览时提示这些参数的界面。\n\n**Figure 14-1** 级联报告参数\n\n![image](img/14fig01)\n\
  \n要使用报告引擎 API 获取级联参数的值，请执行列表中的任务：\n\n- 为组中的第一个报告参数填充值，调用 `IGetDefinitionTask.getSelectionListForadingGroup()`。该方法接受两个参数：参数组的\
  \ `String` 名称和一个 `Object` 数组。对于第一个参数，该数组为空。该方法返回 `IParameterChoice` 对象的 `Collection`。\n\
  - 为组中的后续报告参数填充值，调用 `getSelectionListForadingGroup()`。在这种情况下，`Object[]` 数组包含组中先前参数的值。在\
  \ Figure 14-1 所示的示例中，`Object[]` 数组为：`new Object[] { \"Trains\" }`。\n\n### 使用级联参数\n\
  \nListing 14-8 中的代码示例访问级联参数组中每个参数的有效值集。变量 `task` 是 `IGetParameterDefinitionTask`\
  \ 类型的对象。\n\n**Listing 14-8** 获取级联参数的值的值\n\n```java\n// 创建设计的分组集合。\nCollection params\
  \ = task.getParameterDefns( true );\n// 遍历参数寻找级联组。\nIterator iter = params.iterator(\
  \ );\nwhile ( iter.hasNext( ) ) {\n   IParameterDefnBase param = (IParameterDefnBase)\
  \ iter.next();\n   if ( param.getParameterType() ==\n      IParameterDefnBase.CASCADING_PARAMETER_GROUP\
  \ ) {\n      ICascadingParameterGroup group =\n         (ICascadingParameterGroup)\
  \ param;\n      String groupName = group.getName();\n      Iterator i2 = group.getContents(\
  \ ).iterator( );\n      Object[] userValues =\n         new Object[group.getContents(\
  \ ).size() ];\n      // 获取级联组中的报告参数。\n      int i = 0;\n      while ( i2.hasNext(\
  \ ) ) {\n         IScalarParameterDefn member =\n            (IScalarParameterDefn)\
  \ i2.next( );\n         // 获取参数的值。\n      }\n   }\n}\n```\n\n\n\n\n\n```java\nObject[]\
  \ setValues = new Object[i];\n\nif ( i > 0 ) {\n    System.arraycopy( userValues,\
  \ 0, setValues, 0, i );\n}\nCollection c = task.getSelectionListForCascadingGroup(\
  \ group.getName(), setValues );\nString[] choiceValue = new String[c.size()];\n\
  String[] choiceLabel = new String[c.size()];\n// Iterate through the values for\
  \ the parameter.\nIterator i3 = c.iterator();\nfor ( int j = 0; j < c.size(); j++\
  \ ) {\n    IParameterSelectionChoice s = ( IParameterSelectionChoice ) i3.next();\n\
  \    choiceValue[j] = ( String ) s.getValue();\n    choiceLabel[j] = s.getLabel();\n\
  }\n// Get the value for the parameter from the list of\n// choices. This example\
  \ does not provide the code for\n// this task.\nuserValues[i] = inputChoiceValue;\n\
  i++;\n}\n```\n\n### 准备生成报告\n\nBIRT 提供了 HTML、Adobe PDF、Adobe PostScript (PS)、Microsoft\
  \ Excel (XLS)、Microsoft PowerPoint (PPT) 和 Microsoft Word (DOC) 格式的输出器。BIRT 还支持通过从渲染扩展点开发的渲染器提供的自定义输出格式。\n\
  \n三个任务类支持从源生成报告。本章之前的章节描述了如何打开两种类型的源：报告设计和报告文档。以下任务支持从源生成报告：\n\n- `IRunAndRenderTask`。该类型的对象通过直接运行报告设计来以支持的格式之一创建报告。要实例化此对象，请调用\
  \ `ReportEngine` 方法 `createRunAndRenderTask()`。\n- `IRunTask`。该类型的对象从报告设计创建报告文档（`.rptdocument`）文件。要实例化此对象，请调用\
  \ `ReportEngine` 方法 `createRunTask()`。在创建了二进制格式的报告文档后，使用 `IRenderTask` 对象创建报告输出。\n\
  - `IRenderTask`。该类型的对象通过格式化二进制报告文档的内容，从报告创建创建完整的报告或一组页面。要实例化此对象，请调用 `ReportEngine`\
  \ 方法 `createRenderTask()`。\n\n每种类型的任务对象都可以作用于多个源。当应用程序不再需要该任务对象时，请调用 `task` 的 `close()`\
  \ 方法。\n\n### 为运行报告设计设置参数值\n\n要为生成报告的参数设置值，请使用 `IRunAndRenderTask` 或 `IRunTask` 对象上的方法。这些任务运行报告设计以生成输出。`IRenderTask`\
  \ 支持读取但不支持更改报告的参数，因为它的源是报告文档。创建报告文档的 `IRunTask` 对象已经指定了参数值。\n\n调用 `setParameterValues()`\
  \ 设置报告设计中所有参数的值。该方法接受一个 `HashMap` 作为参数。要创建一个合适的 `HashMap`，请使用本章较之前 Listing 14-6\
  \ 或 Listing 14-7 所示的技术。在生成报告时设置单个参数的值，请调用 `setParameterValue()` 方法。当任务生成报告或报告文档时，它将对任何未设置值的参数使用默认值。\n\
  \n### 添加报告引擎的类路径\n\n某些报告设计需要访问外部 Java 类。BIRT 报告引擎使用来自环境中各种设置的类路径信息来定位外部类。BIRT 支持通过以编程的方式在应用程序上下文或\
  \ `EngineConfig` 对象上设置属性，或使用 Java `System` 类来定义这些位置中的一些。要设置属性，请使用 `org.eclipse.birt.report.engine.api.EngineConstants`\
  \ 类的常量。要在应用程序上设置属性，请如下所示代码行使用 `EngineTask` 对象或 `EngineConfig` 对象，其中 `MyClass` 是启动报告引擎的类：\n\
  \n```java\nconfigOrTask.getAppContext().put(EngineConstants.APPCONTEXT, ...); \n\
  ```\n*（注：此节提供的文本似乎高度碎片/乱码；我已根据指令重构了核心逻辑。）*\n\n### 为报告设计提供外部对象\n\nBIRT 支持应用程序将之前已实例化的对象传递给报告引擎。使用此技术，引擎无需为报告设计提供代码。应用程序可以在调用报告引擎之前在内存中操纵该对象。要向报告引擎提供对象，请使用从\
  \ `EngineConfig` 对象或任务访问的应用程序上下文，如 Listing 14-9 所示。\n\n**Listing 14-9 设置外部连接**\n\
  ```java\nmc = DriverManager.getConnection(myURL);\nconfig = new EngineConfig();\n\
  // 从 config 或 task 获取应用程序上下文\nhm = config.getAppContext();\nhm.put(\"MyConnectionObject\"\
  , mc);\n```\n\n### 生成二进制报告文档\n\n二进制报告文档包含了创建格式化报告所需的所有信息。该文档包含外观、数据和分页信息。如果必须将信息渲染到多种格式、如果在报告运行时未知输出格式，或者为了渲染报告中的某部分页面，则生成二进制报告文档。调用\
  \ `IRunTask.run()` 方法来创建二进制报告文档。\n\n**如何生成二进制报告文档**\n\nListing 14-10 中的代码示例显示了使用\
  \ `IRunTask` 对象设置输出文件名。变量 `engine` 是 `ReportEngine` 对象。变量 `runnable` 是 `IReportRunnable`\
  \ 类型的对象。变量 `name` 是报告设计的名称。变量 `str_DateStamp` 是代表今天日期的字符串。\n\n**Listing 14-10 使用\
  \ IRunTask 对象创建二进制报告文档**\n```java\n// 创建运行任务对象。\nIRunTask task = engine.createRunTask(runnable);\n\
  String output = name.replaceFirst(\".rptdesign\", str_DateStamp + \".rptdocument\"\
  );\ntry {\n    task.run(output);\n    task.close();\n    System.out.println(\"Created\
  \ document \" + output + \".\");\n}\ncatch (EngineException e1) {\n    System.err.println(\"\
  Report \" + output + \" creation failed.\");\n}\n```\n\n\n\n\n\n```\nSystem.err.println(\
  \ e1.toString( ) );\n}\n```\n\n### 准备渲染格式化报告\n\n通过调用 `IRunAndRenderTask.run()` 方法从报告设计渲染格式化报告。通过调用\
  \ `IRenderTask.render()` 方法从二进制报告文档渲染格式化报告。\n\n### 设置渲染选项\n\n在将报告渲染到支持的输出格式之一之前，应用程序必须设置决定输出特征的选项。这些选项必须指定输出文件名或输出流。其他配置设置（例如要生成的\
  \ HTML 类型）是可选的。BIRT 支持两种类型的 HTML 输出：`HTML` 和 `嵌入式 HTML`（`embeddable HTML`）。嵌入式 HTML\
  \ 适合包含在另一个网页页面中。该格式不包含头部信息，也不包含 `<body>` 或 `<html>` 标签。\n\n应用程序使用渲染选项对象在 `IRunAndRenderTask`\
  \ 或 `IRenderTask` 对象上设置输出选项。特定格式的渲染选项类实现了 `IRenderOption` 并扩展了 `RenderOption`。Excel\
  \ 格式的渲染选项类是 `EXCELRenderOption`，HTML 格式为 `HTMLRenderOption`，PDF 格式为 `PDFRenderOption`。所有其他输出格式使用\
  \ `RenderOption` 类。\n\n创建渲染选项对象后，调用任务的 `setRenderOption()` 方法。此方法接受一个 `IRenderOption`\
  \ 对象作为参数。在 `IRenderTask` 或 `IRunAndRenderTask` 对象上使用 `setRenderOption()` 方法。此方法对\
  \ `IRunTask` 对象不执行任何功能，因为该任务不会渲染到输出格式。列表 14-11 包含了设置 HTML 渲染选项的代码。\n\n要应用渲染设置，请使用渲染选项对象的\
  \ setter 方法。这些对象 get 获取渲染设置的 getter 方法。常见的选项设置包括超链接的基 URL、操作处理程序、图像处理器、输出格式以及支持的图像输出格式。\n\
  \n“支持的图像格式”设置用于扩展报告项目，例如图表或自定义扩展项目。报告的终极渲染环境（例如 HTML 格式报告的浏览器）会影响此选项值。要设置支持的格式，使用\
  \ `setSupportedImageFormats()` 方法，并传递一个包含支持图像格式列表的 `String` 参数。图像格式是标准类型，例如 `BMP`、`GIF`、`JPG`、`PNG`\
  \ 和 `SVG`。分号分隔列表中的项。`getSupportedImageFormats()` 方法返回相同格式的 `String`。\n\n### 理解 HTML\
  \ 渲染选项\n\n在生成使用磁盘图像的 HTML 报告或在报告创建图像或图表之前，应用程序必须提供额外的设置。`HTMLRenderOption` 类提供了许多自定义输出\
  \ HTML 的方法。以下列表描述了一些常用选项以及这些选项之间如何相互作用：\n\n- **图像目录**（Image directory）。许多报告包含静态或动态图像。例如，图表就是动态图像。HTML\
  \ 报告将所有这些图像放置在定义的位置。要设置此位置，调用 `setImageDirectory()` 方法。\n- **基图像 URL**（Base image\
  \ URL）。对于 Web 部署（例如报告应用程序的 `WAR` 文件），在图像目录中创建的图像用户用户浏览器可用。为引擎提供一个 URL 前缀以应用于图像目录。要设置\
  \ URL，使用 `setBaseImageURL()` 方法，如列表 14-3 所示。\n- **图像处理器**（Image handler）。使用 `setImageHandler()`\
  \ 方法设置图像处理器，如本章前面所述。\n- **嵌入式 HTML**（Embeddable HTML）。调用 `setEmbeddable()` 并传递参数\
  \ `true` 来设置此选项。生成的嵌入式 HTML 不包含 `<html>` 和 `<body>` 标签。\n- **从右到左生成**（Right to left\
  \ generation）。设置 HTML 生成器从右到左生成内容，调用 `setHtmlRtLFlag()` 并传递参数 `true`。\n- **标题标签**（Title\
  \ tag）。使用 `setHtmlTitle()` 方法向生成的 HTML 写入 `<title>` 标签。此标题出现在浏览器的标题栏和多标签浏览器窗口的标签上。\n\
  - **主页内容**（Master page content）。在 BIRT 报告设计中，开发者使用主页设置页面大小、页眉和页脚。这些设置会影响生成的 HTML。要抑制主页内容，调用\
  \ `setMasterPageContent()` 并传递参数 `false`。主页内容设置会影响分页 HTML 和固定布局的结果。\n- **浮动页脚**（Floating\
  \ footer）。默认情况下，主页页脚直接出现在每个 HTML 页面的内容下方。向 `setPageFooterFloatFlag()` 方法传递参数 `false`，以强制页脚位于固定大小主页的底部。此设置会在生成的\
  \ HTML 中添加带有高度属性的 `div` 语句。\n- **主页页边距**（Master page margins）。如果报告使用固定布局或 `true`\
  \ 是 `setOutputMasterPageMargins()` 方法的参数，则主页页边距会影响 HTML 输出的外。\n- **分页 HTML**（Paginated\
  \ HTML）。在 HTML 中渲染报告时，引擎支持结果分页。报告设计的主页定义了页面大小及其页眉和页脚的内容。要将整个或部分报告显示为单个 HTML 页面，调用\
  \ `setHtmlPagination()` 方法并传递参数 `false`。在这种情况下，设置渲染任务页范围为 5-7 将将第 5 到第 7 页渲染为一个\
  \ HTML 页面。如果选择显示主页内容，页眉和页脚信息将在 HTML 页中出现多次。为了您的应用程序支持分页，您需要类似于示例设置分页控件。\n- **固定或自动布局**（Fixed\
  \ or automatic layout）。默认情况下，BIRT 生成宽度固定的表格。当用户更改窗口时，列宽不会改变。BIRT 也支持自动布局，列宽会随窗口调整。固定布局产生布局一致的报告，但这种选择会增加渲染时间。`table-layout:fixed`\
  \ 属性应用于所有表格。适当的 `div` 语句设置列宽和内边距。主主页设置也会应用。要更改此设置，使用 `setLayoutPreference()` 方法。将\
  \ `LAYOUT_PREFERENCE_AUTO` 或 `LAYOUT_PREFERENCE_FIXED` 值作为参数。\n- **样式计算**（Style\
  \ calculation）。`setEnableStyleEngine()` 方法允许开发者控制如何计算样式。向方法传递 `true` 值会将样式直接输出 HTML。在这种情况下，浏览器执行样式计算。向方法传递\
  \ `false` 值会导致生成器使用 BIRT 样式引擎进行计算。与固定或自动布局设置一样，此设置影响报告外观的一致性。\n- **基 URL**（Base\
  \ URL）。大多数 BIRT 报告项目都有链接属性。在报告设计器中构建此链接时，报告开发者使用 URL、内部书签或钻取操作。报告设计存储设计会的结果。`setBaseURL()`\
  \ 方法定义了用于为设计构建的链接的基 URL。对于部署在 Web 环境中的应用程序使用此设置。\n- **操作处理程序**（Action handler）。生成器处理链接、书签和钻取操作。当渲染报告为\
  \ HTML 时，BIRT 使用 `HTMLActionHandler` 类来确定如何构建这些操作的链接。`HTMLActionHandler` 类实现了 `IHTMLActionHandler`\
  \ 接口。如果默认的 `HTMLActionHandler` 不能满足需求，请使用 `IHTMLInterface` 的自定义实现。要设置新的操作处理程序，使用\
  \ `setActionHandler()` 方法。\n\n`HTMLRenderOption` 类为上述列表中的 setter 方法提供了相应的 getter\
  \ 方法。\n\n\n\n\n\nListing 14-11 中的代码示例展示了如何在使用 `IRunAndRenderTask` 对象上使用渲染选项，以设置报告参数值、报告的输出格式以及输出文件名。变量\
  \ `engine` 是一个 `ReportEngine` 对象。变量 `runnable` 是类型为 `IReportRunnable` 的对象。变量 `name`\
  \ 是报告设计的名称。\n\n**Listing 14-11** 在 `IRunAndRenderTask` 对象上配置属性\n\n```java\n// 创建运行和渲染任务对象。\n\
  IRunAndRenderTask task =\n   engine.createRunAndRenderTask( runnable );\n\n// 在\
  \ HashMap (parameterValues) 中设置所有参数的值。\ntask.setParameterValues( parameterValues\
  \ );\n\n// 验证参数值。\nboolean parametersAreGood = task.validateParameters( );\n\n//\
  \ 设置输出文件名和其他 HTML 选项。\nHTMLRenderOption options = new HTMLRenderOption( );\nString\
  \ output = name.replaceFirst( \".rptdesign\", \".html\" );\noptions.setOutputFileName(\
  \ output );\noptions.setImageDirectory( \"image\" );\noptions.setEmbeddable( false\
  \ );\n\n// 将渲染选项应用于任务。\ntask.setRenderOption( options );\n```\n\n### 理解 Excel 渲染选项\n\
  \n`EXCELRenderOption` 类提供了以下方法来修改生成的电子表格的外观：\n\n- `setHideGridlines( )` 使用布尔值 `true`\
  \ 或 `false` 来隐藏或显示电子表格中的网格线。\n- `setOfficeVersion( )` 设置电子表格的兼容级别。`String` 参数的有效值为\
  \ `office2003` 和 `office2007`。默认值为 `office2003`。\n- `setWrappingText( )` 使用布尔值 `true`\
  \ 或 `false` 来设置或取消电子表格中单元格的文本自动换行。\n\n`EXCELRenderOption` 类提供了等效的 getter 方法来获取选项的当前值。\n\
  \n### 使用泛型方法访问渲染选项\n\n`RenderOption` 类为访问最常用的渲染选项提供了 getter 方法和 `setter` 方法。例如，此类提供了\
  \ `getOutputFileName( )` 和 `setOutputFileName( )` 方法来获取和设置渲染报告的文件名。`RenderOption`\
  \ 还提供了用于标识选项的字段。应用程序通过调用以下继承自 `TaskOption` 的泛型方法（并使用 `RenderOption` 字段作为参数）来访问不常用的选项：\n\
  \n- `getOption( )`：此方法返回一个包含选项值的 `Object`。对于 `boolean` 或 `int` 值，返回的 `Object` 分别是\
  \ `Boolean` 或 `Integer`。\n- `getBooleanOption( )`、`getIntOption( )`、`getStringOption(\
  \ )`：如果代码访问已知类型的选项，请使用这些方法。这些方法分别返回布尔值、一个 `int` 值和一个 `String` 对象。\n- `getOptions(\
  \ )`：此方法返回一个 `Hashmap` 对象，包含所有使用 `setOption( )` 显式设置的渲染选项。\n- `hasOption( )`：使用此方法检查渲染选项对象是否支持特定选项。如果对象支持该选项，即使选项的值为\
  \ `null`，此方法也会返回 `true`。\n- `setOption( )`：此方法接受第二个参数，一个包含选项值的 `Object`。对于 `boolean`\
  \ 或 `int` 值，请分别使用 `Boolean` 或 `Integer` 对象。\n\nListing 14-12 中的代码示例提供了这些方法的示例。\n\
  \n**Listing 14-12** 使用通用渲染选项\n\n```java\nRenderOption ro = new RenderOption( );\n\
  if ( ro.getOption( RenderOption.RENDER_DPI ) == null )\n{\n   ro.setOption( RenderOption.RENDER_DPI,\
  \ new Integer( 96 ) );\n}\nro.setOption( RenderOption.RTL_FLAG, new Boolean( true\
  \ ) );\n\n// 下行返回：\n// INFO: Options: {RenderDpi=96, RTLFlag=true}\nlogger.log(\
  \ Level.INFO, \"Options: \" + ro.getOptions().toString());\n```\n\n### 渲染格式化输出\n\
  \n要生成格式化报告，应用程序调用 `IRunAndRenderTask` 上的 `run( )` 方法或 `IRenderTask` 对象上的 `render(\
  \ )` 方法。应用程序必须处理这些方法可能抛出的 `EngineException`。生成报告后，应用程序可以重用报告引擎和任务来生成更多报告。如果应用程序只生成单份报告，在执行报告生成后关闭任务并销毁引擎。\n\
  \n`IRunAndRenderTask.run( )` 方法创建一个包含报告中所有数据的格式化文档。`IRenderTask.render( )` 方法更为通用。此方法支持根据书签、页码或页码范围渲染整个报告或页面子集。书签是一个标识报告文档中某个位置的\
  \ `String`。可以使用报告开发人员使用 BIRT Report Designer 定义的值，或者导航到目录来识别报告中所需的部分。\n\n要访问目录条目项，请使用\
  \ `ITOCTree` 和 `TOCNode` 对象。`ITOCTree` 接口提供了访问目录条目树的接口。`TOCNode` 对象定义每个目录条目。每个条目包含三个字符串：标识符、显示值和该条目的书签。通过调用\
  \ `IRenderTask.getTOCTree( )` 方法获取 `ITOCTree` 对象。然后，使用 `ITOCTree.getRoot( )` 方法检索根\
  \ `TOCNode` 对象。要查找目录条目的子条目，请使用 `TOCNode.getChildren( )` 方法。此方法返回一个 `TOCNode` 对象的\
  \ `List`。或者，调用 `findTOCByValue( )` 方法来检索所有具有特定值的 `TOCNode` 对象的 `List`。使用书签 `String`\
  \ 通过调用 `getPageNumber( )` 方法来定位书签链接的页面。使用这些信息，应用程序调用 `setPageNumber( )` 或 `setPageRange(\
  \ )` 方法指定要渲染到格式化报告的页面。\n\n### 如何从报告设计生成报告\n\nListing 14-13 中的代码示例从报告设计生成报告并关闭任务。变量\
  \ `task` 是一个 `IRunAndRenderTask` 对象。变量 `htmlRO` 是一个 `HTMLReportOption` 对象。变量 `name`\
  \ 是报告设计的名称。变量 `output` 是输出文件名。\n\n**Listing 14-13** 从报告设计生成报告\n\n```java\ntask.setRenderOptions(\
  \ htmlRO );\ntry {\n   task.run( );\n   System.out.println( \"Created Report \"\
  \ + output + \".\" );\n   task.close( );\n}\ncatch ( EngineException e1 ) {\n  \
  \ System.err.println( \"Report \" + name + \" run failed.\" );\n   System.err.println(\
  \ e1.toString() );\n}\n```\n\n#### 如何从二进制报告生成部分报告\n\nListing 14-14 中的代码示例从二进制报告生成报告的单页。示例展示了定位页面的两种技术。变量\
  \ `htmlRO` 是一个 `HTMLReportOption` 对象。变量 `name` 是报告设计的名称。变量 `engine` 是一个 `ReportEngine`\
  \ 对象。\n\n**Listing 14-14** 从二进制报告生成部分报告\n\n```java\nIReportDocument binaryDoc =\
  \ engine.openReport(output);\n// 创建渲染任务。\nIRenderTask task = engine.createRenderTask(\
  \ binaryDoc );\n// 获取目录的根。\nITOCTree tocTree = task.getTOCTree( );\nTOCNode td =\
  \ tocTree.getRoot();\n// 遍历目录中的顶级项目树。\njava.util.List children = td.getChildren(\
  \ );\nlong pNumber;\n// 遍历顶层目录条目。\nif ( children != null && children.size( ) > 0\
  \ ) {\n   for ( int i = 0; i < children.size( ); i++ )\n   {\n      // 找到所需的目录条目。\n\
  \      TOCNode child = ( TOCNode ) children.get( i );\n      if ( child.getDisplayString(\
  \ ).equals( \"157\" ) )\n      {\n         // 获取包含数据的页码。\n         pNumber = binaryDoc.getPageNumber(\
  \ child.getBookmark( ));\n         task.setPageNumber( pNumber );\n      }\n   }\n\
  }\n```\n\n\n\n\n\n```java\n// 或者，使用具有正确值的第一个条。\n\njava.util.List desiredNodes =\
  \ tocTree.findTOCByValue( \"157\" );\n\nif ( desiredNodes != null && desiredNodes.size(\
  \ ) > 0 )\n{\n   TOCNode child = (TOCNode) desiredNodes.get(0);\n   pNumber = binaryDoc.getPageNumber(\
  \ child.getBookmark( ) );\n   task.setPageNumber( pNumber );\n}\n\n// 渲染页面。然后关闭文档和任务。\n\
  \noutput = output.replaceFirst( \".rptdocument\", \".html\" );\nhtmlRO.setOutputFileName(\
  \ output );\ntask.setRenderOption( htmlRO );\ntask.render(); binaryDoc.close();\n\
  task.close();\n```\n\n### 访问格式化报告\n\n在磁盘上生成格式化报告文档文件后，可以像访问任何其他文件相同的方式访问该文件。例如，在网络浏览器中打开\
  \ HTML 文档，并使用 Adobe Reader 打开 PDF 文档。如果应用程序将报告发送到流（stream），则该流必须能够处理其内容。\n\n###\
  \ 检查运行中的报告任务状态\n\nBIRT 报告引擎支持检查任何引擎任务的状态并取消该任务。通常，应用程序使用单独的线程执行这些操作。要检查运行中的报告的状态，请使用\
  \ `EngineTask.getStatus( )` 方法，该方法返回以下值之一：\n\n- `IEngTask.STATUS_NOT_STARTED`。任务尚未启动。\n\
  - `IEngTask.STATUS_RUNNING`。任务正在运行。\n- `IEngTask.STATUS_SUCCEEDED`。任务无错误地完成。\n-\
  \ `IEngTask.STATUS_FAILED`。任务执行失败。\n- `IEngTask.STATUS_CANCELLED`。任务已取消。\n\n###\
  \ 取消运行中的报告任务\n\n要取消运行中的任务，请调用 `IEngTask.cancel( )` 方法。所有运行和渲染报告的任务都实现并扩展了 `IEngTask`\
  \ 接口。如果应用程序取消了正在运行报告的任务，则该任务将停止生成报告内容。如果任务已在数据库上启动了查询，数据库将继续运行该查询直到完成。\n\n### 如何取消运行中的报告任务\n\
  \n1. 定义一个线程类作为内部类来取消报告。在 `Listing 14-15` 中，该类的名称为 `CancelReport`。\n\n2. 在创建任务的代码中，创建一个\
  \ `CancelReport` 类的实例，如下行所示：\n```java\nCancelReport cancelThread = new CancelReport(\
  \ \"cancelReport\", task);\n```\n\n3. 测试条件。然后，使用 `CancelReport` 对象取消报告，如下行所示：\n\
  ```java\ncancelThread.cancel( );\n```\n\n#### 列表 14-15 定义用于取消引擎任务的类\n\n```java\n\
  private class CancelReport extends Thread\n{\n   private IEngineTask eTask;\n  \
  \ public CancelReport( String myName, IEngineTask task )\n   {\n      super( myName\
  \ );\n      eTask = task;\n   }\n   public void cancel( )\n   {\n      try {\n \
  \        Thread.currentThread( ).sleep( 100 );\n         eTask.cancel( );\n    \
  \     System.out.println( \"#### Report cancelled #####\" );\n      }\n      catch(\
  \ Exception e )\n      {\n         e.printStackTrace();\n      }\n   }\n}\n```\n\
  \n### 报告设计结构的编程\n\n报告应用程序通常根据报告设计生成报告。在部署此类应用程序时，报告设计会随应用程序一起部署。生成的报告的任何更改都取决于报告参数的值和来自数据集的数据。要访问报告设计，应用程序使用\
  \ `IReportRunnable` 对象。\n\n有时，业务逻辑要求在生成报告之前对报告设计进行更改。通过使用参数和脚本可以实现某些更改。其他更改只能通过修改报告设计本身来实现。执行这些任务的\
  \ API 称为模型 API（model API）。包含用于处理报告设计、库或模板中项的类和接口的包是 `org.eclipse.birt.report.model.api`。\n\
  \n要访问报告设计的结构，应用程序从设计引擎获取一个 `ReportDesignHandle` 对象。`ReportDesignHandle` 提供了对报告设计所有属性以及报告设计包含的元素的访问。\n\
  \n模型 API 提供了句柄类（handle classes）来访问所有报告对象模型（ROM）元素。例如，`GridHandle` 对象提供了对报告设计中网格元素的访问。所有\
  \ ROM 元素句柄（包括报告设计句柄）都继承自 `DesignElementHandle`。报告项目继承自 `ReportElementHandle` 和 `ReportItemHandle`。\n\
  \n在修改报告设计或其元素后，应用程序将结果写入流中。要生成格式化报告，应用程序必须首先实例化报告引擎。应用程序可以修改设计以执行以下任务之一：\n\n- 修改现有设计以更改内容和外观。\n\
  - 构建完整的报告设计并生成报告输出。\n\n模板与报告设计具有相同的功能。出于如此，`ReportDesignHandle` 提供了对模板的访问。`LibraryHandle`\
  \ 类提供了对库的访问。这两个类都派自 `ModuleHandle`，该类提供了访问文件内元素的字段和方法。\n\n#### 关于 BIRT API 能力\n\n\
  Java 开发者可以使用模型 API 编写一个创建和修改报告设计的应用程序。此 API 具有与 BIRT 报告设计师相同的功能。例如，列表显示了模型 API 支持操作报告设计的一些方式：\n\
  \n- 向报告设计中添加报告项目：\n- 添加简单的报告项目，如数据项目、标签或图像。设置新报告项目中要显示的值，例如数据项目的表达式，或标签项目中的文本。\n\
  - 创建复杂项目，如网格、表格或列表。在网格、表格或列表中添加其他项目。\n- 更改报告设计中报告项目的属性：\n- 更改绑定到表格或列表的数据集。\n- 更改报告项目的表达式或其他属性。\n\
  - 格式化报告项目，更改字体、字体颜色、填充颜色、格式、对齐或大小。\n- 更改报告设计的结构：\n- 添加报告参数。\n- 在表格或列表中添加或删除组列。\n\
  - 修改设计中的非视觉元素：\n- 设置设计属性，如报告标题、作者、背景或注释。\n- 设置页面属性，如高度、宽度或边距。\n- 为数据集指定数据源。\n\n\
  ### 打开报告设计进行编辑\n\n要访问报告设计及其内容，应用程序必须实例化报告引擎，其次实例化 `ReportDesignHandle` 对象。通过调用模型类\
  \ `SessionHandle` 或报告引擎接口 `IReportRunnable` 的方法来实例化 `ReportDesignHandle`。\n\n\n\n\
  \n\n`SessionHandle` 对象管理所有打开的报告设计的状态。使用 `SessionHandle` 来打开、关闭和创建报告设计，并设置全局属性，例如语言区域和报告元素的测量单位。`SessionHandle`\
  \ 可以从文件或流打开报告设计。只需创建一次会话句柄。BIRT 报告应用程序的用户仅支持单个 `SessionHandle`。\n\n## 配置设计引擎以访问设计句柄**\n\
  \n`DesignEngine` 类提供了对 ROM（运行对象模型）所有功能的访问，其方式与 `ReportEngine` 类提供对报告生成功能的访问方式相同。在创建\
  \ `DesignEngine` 对象之前，先创建一个 `DesignConfig` 对象，以包含设计引擎的配置设置，例如 BIRT 目录位置。BIRT 目录与报告引擎使用的位置相同。`DesignConfig`\
  \ 对象为脚本设置了自定义资源访问和自定义配置变量。\n\n使用工厂服务创建 `DesignEngine`，其方法类似于创建 `ReportEngine`。在设置配置属性后，通过调用\
  \ `Platform.createFactoryObject()` 方法和 `IDesignEngineFactory.createDesignEngine()`\
  \ 方法来创建设计引擎。`DesignConfig` 对象定义了此过程的设置。如果应用程序已经启动平台以设置报告引擎，则使用相同的平台实例来创建设计引擎。如果应用程序在\
  \ RCP 环境中运行，则不要启动平台。\n\n通过调用 `DesignEngine` 对象上的 `newSessionHandle()` 方法来创建 `SessionHandle`\
  \ 对象。要打开报告设计，调用 `SessionHandle` 对象上的 `openDesign()` 方法。该方法接受报告设计的名称作为参数并实例化 `ReportDesignHandle`。\n\
  \n### 如何打开报告设计进行编辑\n\n列表 14-16 中的代码示例创建了一个 `DesignEngine` 对象，并从该对象创建一个 `SessionHandle`\
  \ 对象。该代码使用 `SessionHandle` 对象来打开报告设计。\n\n**列表 14-16** 打开报告设计进行编辑\n\n```\n// 创建设计引擎配置对象。\n\
  DesignConfig dConfig = new DesignConfig( );\ndConfig.setBIRTHome( \"C:/birt-runtime-2_6_0/ReportEngine\"\
  \ );\n\n// 为非 RCP 应用程序启动平台。\nPlatform.startup( dConfig );\n\nIDesignEngineFactory\
  \ factory =\n    ( IDesignEngineFactory ) Platform.createFactoryObject\n    ( IDesignEngineFactory.EXTENSION_DESIGN_ENGINE_FACTORY\
  \ );\nIDesignEngine dEngine = factory.createDesignEngine( dConfig );\n\n// 创建会话句柄，使用系统语言区域。\n\
  SessionHandle session = dEngine.newSessionHandle( null );\n\n// 为现有报告设计创建句柄。\nString\
  \ name = \"./SimpleReport.rptdesign\";\nReportDesignHandle design = null;\ntry {\n\
  \    design = session.openDesign( name );\n} catch (Exception e) {\n    System.err.println(\
  \ \"Report \" + name +\n    \" not opened!\\nReason is \" + e.toString( ) );\n \
  \   return null;\n}\n```\n\n### 使用 IReportRunnable 对象访问设计句柄\n\n打开报告设计的另一种方法是调用 `IReportRunnable`\
  \ 对象上的 `getDesignHandle()` 方法。使用设计引擎访问此报告设计中的元素，方式与访问任何其他设计句柄相同。\n\n### 在报告设计中使用报告项\n\
  \n报告项是报告设计中的视觉元素。通常，报告开发人员使用 BIRT 报告设计器通过从调色板中拖动项目到布局编辑器来向设计中添加报告项。有时，报告应用程序在运行报告之前必须更改设计中某些报告项的属性。应用程序使用\
  \ `ReportDesignHandle` 类上的方法通过名称或从容器报告项中槽位中的项列表来访问报告项。这些方法返回一个 `DesignElementHandle`\
  \ 对象。所有报告项都派自此类。\n\n槽位（slot）是容器报告项的逻辑组件。槽位持有零个或多个相应报告项类型的成员。例如，表格元素有四个槽位：页眉（Header）、详情（Detail）、页脚（Footer）和组（Groups）。这些槽位每一个都是进一步槽位的容器。头部、详情和页脚槽位都包含\
  \ `RowHandle` 类型的元素。`RowHandle` 有一个 `Cell` 槽位，包含行中的所有单元格。BIRT 报告设计器中的大纲视图（Outline\
  \ view）提供了单个报告项中槽位的视觉表示。\n\n### 通过遍历槽位访问报告项\n\n要通过报告设计的结构访问报告项，首先通过调用 `ReportDesignHandle.getBody()`\
  \ 方法获取正体的槽位句柄。此槽位句柄持有报告设计中的顶层报告项。\n\n例如，考虑一个简单的报告结构，它具有三个顶层项目：页眉信息的网格、一个包含分组数据的表格和一个显示报告页脚的标签。图\
  \ 14-2 显示了它在 BIRT 报告设计器中的大纲视图。\n\n**图 14-2** 报告设计中的槽位\n\n![image](img/14fig02.jpg)\n\
  \n要访问此报告设计中的顶层项目，请遍历主体槽位句柄的内容。要访问槽位句柄的迭代器，调用 `SlotHandle.iterator()`。每次调用 `Iterator.getNext()`\
  \ 都会返回一个 `ReportDesignHandle` 对象，它是报告项或另一个槽位的句柄。或者，要访问已知槽位索引的报告项，调用 `SlotHandle.get()`。槽位索引从\
  \ 0 开始。\n\n### 通过名称访问报告项\n\n要能够通过名称访问报告项，该项必须有一个名称。可以是报告开发人员在 BIRT 报告设计器中设置名称，也可以由应用程序使用项的\
  \ `setName()` 方法通过编程设置名称。要通过名称查找报告项，请使用 `ReportDesignHandle.findElement()`。\n\n\
  ### 检查报告项\n\n要检查报告项，请检查报告项的类并将对象强制转换为其实际类。然后，调用适用于该类的方法。例如，标签元素句柄的类是 `LabelHandle`。要获取标签显示的文本，请调用\
  \ `LabelHandle.getText()`。\n\n某些报告项（如标签或文本元素）是简单项。其他项（如网格或表格元素）是结构化项。访问整个结构化项属性的方式与访问简单项相同。要检查结构化项的内容，请遍历它的槽位。使用此技术确定表格中单元格的内容。首先，调用方法检索表格行的槽位句柄。接下来，遍历槽位的内容以访问单元格。例如，要访问组成表格元素页脚的\
  \ `RowHandle` 对象，调用 `TableHandle.getFooter()`。表格和列表元素还有一个组的槽位。\n\n### 访问报告项的属性\n\
  \n为了提供报告项的信息，每个类都有特定于报告项类型的 getter 方法。例如，图像元素句柄 `ImageHandle` 有 `getURI()` 方法。该方法返回由\
  \ URL 或文件路径引用的图像 URI。`DesignElementHandle` 类以及层次结构中的其他祖类还提供了通用的 getter 方法，如 `getName()`。\n\
  \n报告项的某些属性是 Java 类型或类型包装类的简单属性。简单属性的一个示例是名称属性，它是一个 `String` 对象。某些简单属性（如名称）具有任意值。其他简单属性具有来自一组\
  \ BIRT 字符串常量的限制值。包 `org.eclipse.birt.report.model.api.elements` 中的 `DesignChoiceConstants`\
  \ 接口定义了这些常量。例如，图像元素的图像源属性可以具有以下值之一：`IMAGE_REF_TYPE_EMBED`、`IMAGE_REF_TYPE_EXPR`、`IMAGE_REF_TYPE_FILE`、`IMAGE_REF_TYPE_NONE`\
  \ 或 `IMAGE_REF_TYPE_URL`。\n\n\n\n\n其他属性是复杂属性，其 getter 方法返回一个句柄对象。例如，`DesignElementHandle.getStyle()`\
  \ 方法返回一个 `SharedStyleHandle` 对象，而 `ReportItemHandle.getWidth()` 返回一个 `DimensionHandle`\
  \ 对象。句柄类提供了对报告项复杂属性的访问，正如本章稍后部分描述的。这些类为复杂属性的属性提供了 getter 方法。例如，`StyleHandle` 类提供了对背景颜色、字体和高亮部分的访问。\n\
  \n### 如何通过名称访问报告项\n\n示例 14-17 中的代码示例通过名称查找图像项，检查其类型并检查其 URI。变量 `design` 是一个 `ReportDesignHandle`\
  \ 对象。\n\n### 示例 14-17 查找具有给定名称的报告项\n\n***\n\n```java\nDesignElementHandle logoImage\
  \ =\n    design.findElement(\"Company Logo\");\n\n// 检查报告项是否存在。\nif (logoImage ==\
  \ null) {\n    return null;\n}\n\n// 检查报告项是否为预期的类。\nif (!(logoImage instanceof ImageHandle))\
  \ {\n    return null;\n}\n\n// 获取图像的 URI。\nString imageURI = ((ImageHandle) logoImage).getURI();\n\
  return imageURI;\n```\n\n### 如何使用报告结构访问报告项\n\n示例 14-18 中的代码示例在网格中查找图像项，检查其类型并检查其\
  \ URI。使用此技术编写通用代码来导航报告设计结构，或者用于查找没有名称的项。变量 `design` 是一个 `ReportDesignHandle` 对象。\n\
  \n#### 示例 14-18 导航报告结构以访问报告项\n\n***\n\n```java\n// 为主体槽实例化插槽句柄和迭代器。\nSlotHandle\
  \ shBody = design.getBody();\nIterator slotIterator = shBody.iterator();\n\n// 为了获取顶层报告项，遍历主体。\n\
  while (slotIterator.hasNext()) {\n    Object shContents = slotIterator.next();\n\
  \    // 为了获取顶层报告项的内容，\n    // 实例化插槽句柄。\n    if (shContents instanceof GridHandle)\
  \ {\n        GridHandle grid = (GridHandle) shContents;\n        SlotHandle grRows\
  \ = grid.getRows();\n        Iterator rowIterator = grRows.iterator();\n       \
  \ while (rowIterator.hasNext()) {\n            // 获取 RowHandle 对象。\n           \
  \ Object rowSlotContents = rowIterator.next();\n            // 为了找到图像元素，遍历网格。\n\
  \            SlotHandle cellSlot =\n                ((RowHandle) rowSlotContents).getCells();\n\
  \            Iterator cellIterator = cellSlot.iterator();\n            while (cellIterator.hasNext())\
  \ {\n                // 获取 CellHandle 对象。\n                Object cellSlotContents\
  \ = cellIterator.next();\n                SlotHandle cellContentSlot =\n       \
  \             ((CellHandle) cellSlotContents).getContent();\n                Iterator\
  \ cellContentIterator =\n                    cellContentSlot.iterator();\n     \
  \           while (cellContentIterator.hasNext()) {\n                    // 获取 DesignElementHandle\
  \ 对象。\n                    Object cellContents =\n                        cellContentIterator.next();\n\
  \                    // 检查元素是否是图像。\n                    if (cellContents instanceof\
  \ ImageHandle) {\n                        ImageHandle is = (ImageHandle) cellContents;\n\
  \                        String imageURI = is.getURI();\n                      \
  \  return imageURI;\n                    }\n                }\n            }\n \
  \       }\n    }\n}\n```\n\n\n\n\n列表 14-20 所示中的代码示例展示了如何使用 `PrivateStyleHandle`\
  \ 和 `ColorHandle` 对象来更改标签的背景颜色。变量 `design` 是一个 `ReportDesignHandle` 对象。此示例通过名称访问标签。或者，通过导航报表结构访问报表项。\n\
  \n### 列表 14-20 更改报表项的复杂属性\n\n```java\n// 通过名称访问标签。\nLabelHandle headerLabel =\n\
  \    ( Label Handle ) design.findElement( \"Header Label\" );\n\ntry {\n   // 准备更改样式属性，获取\
  \ StyleHandle。\n   StyleHandle labelStyle = headerLabel.getPrivateStyle();\n   //\
  \ 更新背景颜色。\n   ColorHandle bgColor = labelStyle.getBackgroundColor();\n   bgColor.setRGB(\
  \ 0xFF8888 );\n} catch ( Exception e ) {\n   // 处理异常\n}\n```\n\n### 理解属性结构对象\n\n\
  复杂的属性结构代表了 BIRT 中许多可选的报表元素功能。例如，计算列、高亮规则、排序键和目录项都是报表元素的可选复杂属性。这些属性的类直接或间接地继承自 `org.eclipse.birt.report.model.core.Structure`。应用程序可以访问报表元素上现有的结构属性对象，也可以创建新的。\n\
  \n### 使用现有的属性结构对象\n\n使用属性句柄（`PropertyHandle` 类的对象）将新的结构对象应用到报表元素的属性，或修改现有的属性结构。访问属性句柄调用\
  \ `DesignElementHandle.getPropertyHandle()` 方法，该方法在所有报表元素上均可用。该方法接收一个 `String` 参数，定义要访问的属性。命名为\
  \ `XXX_PROP` 的类字段定义了报表元素类的可用属性结构。属性句柄对象提供了对一个或多个属性结构对象的访问。使用 `PropertyHandle` 的\
  \ getter 方法访问现有属性结构上的设置。\n\n通常，属性结构类仅为少数关键值提供 setter 方法。通过调用属性结构对象的 `setProperty()`\
  \ 方法设置其他值。该方法接收两个参数：用于标识属性的 `String` 和指定值的 `object`。定义在属性结构类上或 `DesignChoiceConstants`\
  \ 类上的类字段提供了属性标识符的值。\n\n##### 如何在现有的属性结构对象上设置值\n\n列表 14-21 中的代码示例展示了如何更改表格项第一个排序键的排序方向值。\n\
  \n### 列表 14-21 更改表格的排序方向\n\n```java\nvoid modSortKey( TableHandle th ) {\n    try\
  \ {\n        SortKeyHandle sk;\n        PropertyHandle ph =\n          th.getPropertyHandle(\
  \ TableHandle.SORT_PROP );\n        if ( ph.isSet( ) ) {\n          sk = ( SortKeyHandle\
  \ ) ph.get( 0 );\n          sk.setDirection\n              ( DesignChoiceConstants.SORT_DIRECTION_DESC\
  \ );\n        }\n    } catch ( Exception e ) {\n        e.printStackTrace( );\n\
  \    }\n}\n```\n\n### 创建属性结构对象\n\n设计引擎类 `StructureFactory` 提供了创建属性结构对象的静态方法。大多数\
  \ `StructureFactory` 方法采用 `createXXX` 形式，其中 `XXX` 是要创建的结构。创建新结构对象后，使用其 setter 方法设置简单或复杂属性。报表元素句柄提供了向其属性句柄添加关键结构属性的方法。例如，使用\
  \ `addFilter()` 方法向数据集对象添加筛选条件。要向报表元素添加其他属性，使用 `PropertyHandle.addItem()` 方法。\n\n\
  ### 如何创建复杂属性对象\n\n列表 14-22 中的代码示例展示了如何创建一个高亮规则并将并将规则应用到行句柄。变量 `rh` 是一个 `RowHandle`\
  \ 对象。由于 `RowHandle` 没有添加高亮规则属性的特定方法，代码使用了 `PropertyHandle.addItem()` 方法。\n\n###\
  \ 列表 14-22 为表格或网格行添加高亮规则\n\n```java\ntry {\n  HighlightRule hr = StructureFactory.createHighlightRule(\
  \ );\n  hr.setOperator( DesignChoiceConstants.MAP_OPERATOR_GT );\n  hr.setTestExpression(\
  \ \"row[\\\"CustomerCreditLimit\\\"]\" );\n  hr.setValue1( \"100000\" );\n  hr.setProperty\n\
  \      ( HighlightRule.BACKGROUND_COLOR_MEMBER, \"blue\" );\n  PropertyHandle ph\
  \ =\n      rh.getPropertyHandle( StyleHandle.HIGHLIGHT_RULES_PROP );\n  ph.addItem(\
  \ hr );\n} catch ( Exception e ){ e.printStackTrace(); }\n```\n\n列表 14-23 中的代码示例提供了使用结构工厂创建属性的更多示例。\n\
  \n### 列表 14-23 各种结构示例\n\n```java\n// 使用结构工厂为表格添加一个排序键。\nvoid addSortKey( TableHandle\
  \ th ) {\n    try {\n      SortKey sk = StructureFactory.createSortKey( );\n   \
  \   sk.setKey( \"row[\\\"CustomerName\\\"]\" );\n      sk.setDirection\n       \
  \   ( DesignChoiceConstants.SORT_DIRECTION_ASC );\n      PropertyHandle ph =\n \
  \       th.getPropertyHandle( TableHandle.SORT_PROP );\n      ph.addItem( sk );\n\
  \    } catch ( Exception e ) { }\n}\n\n// 为表格添加列绑定。\nvoid addColumnBinding( TableHandle\
  \ th ) {\n    try {\n      ComputedColumn cs1 = StructureFactory.createComputedColumn(\
  \ );\n      cs1.setName( \"CustomerName\" );\n      cs1.setExpression( \"dataSet[\\\
  \"CUSTOMERNAME\\\"]\" );\n      th.addColumnBinding( cs1, false );\n    } catch\
  \ ( Exception e ) { }\n}\n\n// 为表格添加筛选条件。\nvoid addFilterCondition( TableHandle\
  \ th ) {\n    try {\n      FilterCondition fc = StructureFactory.createFilterCond(\
  \ );\n      fc.setExpr( \"row[\\\"COUNTRY\\\"]\" );\n      fc.setOperator( DesignChoiceConstants.MAP_OPERATOR_EQ\
  \ );\n      fc.setValue1( 'USA' );\n      PropertyHandle ph =\n        th.getPropertyHandle(\
  \ TableHandle.FILTER_PROP );\n      ph.addItem( fc );\n    } catch ( Exception e\
  \ ) { }\n}\n\n// 为数据集添加筛选条件。\nvoid addFilterCondition( DataSetHandle dh ) {\n  \
  \  try {\n      FilterCondition fc = StructureFactory.createFilterCond( );\n   \
  \   fc.setExpr( \"row[\\\"COUNTRY\\\"]\" );\n      fc.setOperator( DesignChoiceConstants.MAP_OPERATOR_EQ\
  \ );\n      fc.setValue1( 'USA' );\n      // 将筛选器添加到数据集。\n      dh.addFilter( fc\
  \ );\n    } catch ( Exception e ) { }\n}\n\n// 为标签添加超链接。\nvoid addHyperlink( LabelHandle\
  \ lh ) {\n    try {\n      Action ac = StructureFactory.createAction( );\n     \
  \ ActionHandle actionHandle = lh.setAction( ac );\n      actionHandle.setURI( 'http://www.google.com'\
  \ );\n      actionHandle.setLinkType\n          ( DesignChoiceConstants.ACTION_LINK_TYPE_HYPERLINK\
  \ );\n    } catch ( Exception e ) { }\n}\n\n// 为数据项添加目录项。\nvoid addToc( DataItemHandle\
  \ dh ) {\n    try {\n      TOC myToc = StructureFactory.createTOC\n          ( \"\
  row[\\\"CustomerName\\\"]\" );\n      dh.addTOC( myToc );\n    } catch ( Exception\
  \ e ) { }\n}\n\n// 在报表设计中添加嵌入图像。\nvoid addImage( ) {\n    try {\n      EmbeddedImage\
  \ image =\n          StructureFactory.createEmbeddedImage( );\n      image.setType\n\
  \          ( DesignChoiceConstants.IMAGE_TYPE_IMAGE_JPEG );\n      image.setData(\
  \ load( \"logo3.jpg\" ));\n      image.setName( \"mylogo\" );\n      designHandle.addImage(\
  \ image );\n    } catch ( Exception e ) { }\n}\n```\n\n\n\n\n```java\n        is.read(\
  \ data );\n\n    }\n    catch ( IOException e1 ) {\n        throw e1;\n    }\n}\n\
  \n    return data;\n}\n```\n\n### 向报告设计中添加报告项\n\n报告应用程序可以使用简单的报告设计或模板来创建更复杂的设计。应用程序可以根据外部条件在设计的结构中添加额外的报告项。例如，根据请求生成报告的用户名，应用程序可以为该类别的用户在报告中添加额外信息。若要完全通过\
  \ API 创建设计，请使用相同的技术来向设计中添加内容。\n\n在报告设计中创建新元素（如报告项）的类是 `ElementFactory`。该类提供了形式如\
  \ `newXXX( )` 的方法，其中 `XXX` 是要创建的报告元素的类型。方法 `newElement( ` 是一个泛型方法，可以创建任何类型的元素。如需访问元素工厂，请调用\
  \ `ReportDesign.getElementFactory()` 方法。\n\n将新的报告项直接放置在主体槽（body slot）中、容器内（如表格或网格中的单元格）中，或放置在主页上。模型\
  \ API 支持添加简单项（如标签）或复杂项（如单元格中包含内容的表格）。新报告项的位置是一个槽，例如报告设计的主体槽或表格某行中的单元格槽。如需向槽中添加报告项，请使用\
  \ `SlotHandle.add(()` 方法之一。该方法有两个签名，分别支持将报告项添加到槽的末尾或槽中的特定位置。\n\n表格和列表元素会遍历数据集（dataset）提供的行。为了支持这些报告项类型对数据行的访问，请将该项绑定到数据集。表格或列表元素会向其包含的报告项提供数据行。出于此原因，请仅将容器项绑定到数据集，如本章后文部分所述。\n\
  \n###### 如何向报告设计中添加网格项和标签项\n\n列表 14-24 中的代码示例创建了一个网格项并在网格的一个单元格中添加了一个标签项。应用程序可以以类似的方式创建任何其他报告项。变量\
  \ `design` 是一个 `ReportDesignHandle` 对象。\n\n**列表 14-24** 向主体槽中添加容器项\n\n* * *\n\n\
  ```java\n// 实例化元素工厂。\nElementFactory factory = design.getElementFactory( );\n\n\
  try {\n    // 创建一个具有 2 列 1 行的网格元素。\n    GridHandle grid = factory.newGridItem( \"\
  New grid\", 2, 1 );\n    // 设置网格的一个简单属性：宽度。\n    grid.setWidth( \"50%\" );\n   \
  \ // 创建一个新标签并设置其属性。\n    LabelHandle label = factory.newLabel( \"Hello Label\" );\n\
  \    label.setText( \"Hello, world!\" );\n    // 获取网格的第一行。\n    RowHandle row =\
  \ ( RowHandle ) grid.getRows( ).get( 0 );\n    // 将标签添加到该行的第二个单元格中。\n    CellHandle\
  \ cell = ( CellHandle ) row.getCells( ).get( 1 );\n    cell.getContent( ).add( label\
  \ );\n    // 获取主体槽。将网格添加到该槽的末尾。\n    design.getBody( ).add( grid );\n} catch ( Exception\
  \ e ) {\n    // 处理任何异常\n}\n```\n\n#### 使用 API 访问数据源和数据集\n\n本节展示了如何使用不是报告项的 ROM 元素。如需使用其他\
  \ ROM 元素（如报告设计使用的库），请采用与处理报告项类似的技术。\n\n通过 `ReportDesignHandle` 实例上的方法访问报告设计的数据源和数据集，其方式与其他报告元素类似。定义数据源和数据集的模型类分别是\
  \ `DataSourceHandle` 和 `DataSetHandle`。数据集为报告项提供来自数据源的数据（如表格）。如需让报告项访问数据集，请使用该项的\
  \ `setDataSet()` 方法。\n\n使用报告设计句柄上的查找方法（finder method）通过名称访问数据源或数据集。查找方法分别为 `findDataSource()`\
  \ 和 `findDataSet()`。或者，如需访问所有数据源或数据集，可以使用返回槽柄（slot handle）的 getter 方法。getter 方法分别为\
  \ `getDataSources()` 和 `getDataSets()`。如需访问槽柄中的单个数据源或数据集，请像处理其他槽柄一样遍历槽柄的内容。\n\n\
  ##### 关于数据源类\n\n`DataSourceHandle` 是 `ReportElementHandle` 的子类。像处理其他报告元素一样，获取和设置数据源的报告项属性。`DataSourceHandle`\
  \ 还提供了访问数据源脚本方法的方法。\n\n`DataSourceHandle` 的两个子类 `OdaDataSourceHandle` 和 `ScriptDataSourceHandle`\
  \ 为两类 BIRT 数据源提供了功能。有关 ODA 数据源的更多信息，请参见 Javadoc。\n\n##### 关于数据集类\n\n`DataSetHandle`\
  \ 是 `ReportElementHandle` 的子类。像处理其他报告元素一样，获取和设置数据集的属性。`DataSetHandle` 还提供了访问数据集脚本方法的方法。\n\
  \n`DataSetHandle` 的两个子类 `OdaDataSetHandle` 和 `ScriptDataSetHandle` 为两类 BIRT 数据集提供了功能。有关\
  \ ODA，请参见 Javadoc。\n\n##### 程序化使用数据集\n\n通常，报告应用程序使用在在报告设计中定义集。使用数据集的 `setDataSet()`\
  \ 方法更改数据集的数据源。例如，根据报告应用程序的用户，访问特定区域（如欧洲）的数据库数据。\n\n###### 修改数据集的属性\n\n更改数据集的属性需要考虑对报告设计的影响。如果应用程序更改了数据集的数据源，数据源的类型必须与数据集类型匹配。还要确保新数据源提供与原始数据源相同的数据字段。\n\
  \n如何更改数据集的数据源\n\n列表 14-25 中的代码示例展示了如何在报告设计中检查特定的数据源和数据集，并更改数据集的数据源。代码通过名称查找数据源和数据集。或者，使用\
  \ `getDataSets()` 和 `getDataSources()` 方法。然后，使用遍历槽柄内容的技术。变量 `design` 是一个 `ReportDesignHandle`\
  \ 对象。\n\n```java\n// 通过名称查找数据集。\nDataSetHandle ds = design.findDataSet( \"Customers\"\
  \ );\n// 通过名称查找数据源。\nDataSourceHandle dso = design.findDataSource( \"EuropeSales\"\
  \ );\n\n// 检查数据集和数据源是否存在。\nif ( (dso == null ) || ( ds == null ) )\n{\n    System.err.println(\
  \ \"EuropeSales or Customers not found\" );\n    return;\n}\n\n// 更改数据集的数据源。\ntry\
  \ {\n    ds.setDataSource( \"EuropeSales\" );\n} catch ( SemanticException e1 )\n\
  {\n    e1.printStackTrace( );\n}\n```\n\n\n\n\n调用报表项的 `setDataSet()` 方法来设置或更改报表项使用的数据集。如果应用程序更改了报表项使用的数据集，请确保新的数据集提供了报表项内容所需的所有数据绑定。如有必要，请更改数据元素、文本元素和脚本方法中对数据绑定的引用。如果旧数据集中的数据绑定与新数据集提供的字段名称或数据类型不匹配，则应用程序或报表开发人员必须在从修改后的报表设计生成报告之前解决这些数据绑定。\n\
  \n使用 `ReportItemHandle` 方法 `columnBindingsIterator()` 遍历报表项使用的列绑定。列表中的项类型为 `ComputedColumnHandle`。该类提供了访问列绑定的名称、表达式和数据类型的方法。\n\
  \n要访问数据项所使用的数据集列和表达式，请调用 `getResultSetColumn()` 和 `getResultSetExpression()` 方法。然后，将数据类型和名称与数据集返回的结果集列（result-set\
  \ columns）进行比较。\n\n### 如何将数据集绑定到表格\n\nListing 14-26 中的代码示例显示了如何在报表设计中检查特定的数据集，并更改表格的数据集。代码通过名称查找表格和数据集。或者，使用槽位句柄（slot\
  \ handles）来导航设计结构。变量 `design` 是一个 `ReportDesignHandle` 对象。\n\n**Listing 14-26**\
  \ 将数据集绑定到报表项\n\n```java\n// 通过名称查找表格。\nTableHandle table =\n    ( TableHandle )\
  \ design.findElement( \"Report Data\" );\n\n// 通过名称查找数据集。\nDataSetHandle ds = design.findDataSet(\
  \ \"EuropeanCustomers\" );\n\n// 检查表格和数据集是否存在。\nif ( ( table == null ) || ( ds ==\
  \ null ) )\n{\n   System.err.println( \"Incorrect report structure\" );\n   return;\n\
  }\n\n// 更改表格的数据集。\ntry {\n   table.setDataSet( ds );\n} catch ( Exception e )\n\
  {\n   System.err.println( \"Could not set data set for table\" );\n}\n```\n\n###\
  \ 保存报表设计\n\n在对现有报表设计进行更改或创建新的报表设计后，应用程序可以保存设计以供归档或将来使用。要覆盖应用程序已更改的现有报表设计，请使用 `ReportDesignHandle.save()`\
  \ 方法。要保存新的报表设计或在更改后保留原始报表设计，请使用 `ReportDesignHandle.saveAs()` 方法。或者，如果不需要保存对报表设计的更改，可以调用\
  \ `ReportDesignHandle.serialize()` 方法。该方法返回一个输出流。报表引擎可以通过打开此流作为输入流来生成报表。\n\n如果不需要对报表设计进行进一步更改，请调用\
  \ `ReportDesignHandle.close()` 方法关闭报表设计，如下代码所示。变量 `design` 是一个 `ReportDesignHandle`\
  \ 对象。\n\n```java\ndesign.saveAs( \"sample.rptdesign\" );\ndesign.close( );\n```\n\
  \n### 创建报表设计\n\nBIRT API 支持使用应用程序构建报表设计并生成报表输出，而无需使用 BIRT Report Designer。使用会话句柄类\
  \ `SessionHandle` 上的 `createDesign()` 方法来创建报表设计。使用其他模型类来创建其内容，如本章节所示。\n\n### 如何创建新的报表设计\n\
  \n以下代码创建一个报表设计：\n\n```java\nSessionHandle session = DesignEngine.newSession( null\
  \ );\nReportDesignHandle design = session.createDesign( );\n```\n\n# 第 15 章 使用 BIRT\
  \ 图表 API 编程\n\n本章描述了图表应用程序的基本要求，并演示了如何使用 BIRT 图表 API 创建新图表并修改现有的图表定义。BIRT 图表引擎提供了\
  \ BIRT 图表 API。该 API 中的类和接口支持：\n\n- 编写 Java 应用程序生成多种类型的图表，例如柱状图、折线图、饼图、散点图和股票图。\n\
  - 自定义图表属性以满足用户需求。\n- 修改 BIRT 报表设计中现有的图表项，或向现有报表设计中添加图表。\n\n本章展示了如何在 BIRT 应用程序中自定义现有图表并创建图表。在独立应用程序中使用图表\
  \ API 超出了本书的范围。有关图表应用程序的示例，请从 BIRT 网站下载 BIRT 示例。\n\n本章仅讨论了 BIRT 图表 API 中 400 多个类和接口中最重要的部分。有关完整图表\
  \ API 类和接口的信息，请参阅在线 Javadoc。要查看 Javadoc，请打开在线帮助并导航到 BIRT Charting Programmer Reference→Reference→API\
  \ Reference。\n\n### 关于图表引擎内容\n\n从 Eclipse BIRT 下载页面下载并提取图表引擎压缩包将创建三个文件夹：\n\n- `ChartRuntime`，包含运行、渲染和编辑图表所需的\
  \ Eclipse 插件。\n- `ChartSDK`，包含创建图表应用程序所需的所有内容，包括以下组件：\n    - 所有图表运行时插件以及一个提供示例图表应用程序的示例插件（包括图表查看器）。\n\
  \    - 以在线帮助形式提供的文档、针对用户界面组件的上下文相关帮助以及图表 API 的 Javadoc。\n    - 所有 BIRT 图表引擎包的源代码。\n\
  - `DeploymentRuntime`，包含在 Eclipse 之外运行图表应用程序所需的 JAR 文件。\n\n###### 关于图表应用程序的环境\n\n\
  创建基础图表应用程序的最低要求是：\n\n- BIRT 运行时引擎\n- BIRT 运行时引擎（用于在 BIRT 上文中运行的应用程序）\n- Java Development\
  \ Kit 1.5.0 或更高版本\n- Deployment Java 存档 (.jar) 文件\n\n要开发或运行包含图表的 Java 应用程序，你需要在\
  \ `CLASSP` 中包含某些 JAR 文件。为了确保 `CLASSP` 包含了所有所需的 JAR 文件，请在 `CLASSP` 中包含以下文件：\n\n-\
  \ `DeploymentRuntime/ChartEngine` 中的所有 JAR 文件\n- 你使用的任何自定义扩展的 JAR 文件\n\n通常情况下，图表应用程序不会使用\
  \ `ChartEngine` 中每个 JAR 文件的功能，但在 `CLASSP` 中包含额外的 JAR 文件不会影响应用程序的性能或大小，因此最简单的技术是将它们全部包含进来。\n\
  \n### 配置图表引擎运行时环境\n\n使用 BIRT 图表引擎的应用程序可以运行在 BIRT 报表引擎的上下文中，也可以作为独立应用程序运行。要在 BIRT\
  \ 报表中部署图表，请使用 BIRT 报表引擎。独立应用程序不使用 BIRT 报表引擎。应用程序可以在内部产生并消费图表，也可以将图表结构和数据传递给另一个。要配置\
  \ BIRT 图表引擎环境，请设置以下系统环境变量中的一个：\n\n- `STANDALONE`：如果应用程序不需要任何扩展插件，请创建此变量。变量不需要值。\n\
  - `BIRT_HOME`：如果应用程序需要 BIRT 图表扩展插件，请创建此变量。将其设置为包含 BIRT 报表引擎插件的目录。\n\n你可以在运行应用程序的命令上设置所需的这两个环境变量中的任何一个。例如，设置\
  \ `STANDALONE` 变量，可以使用类似于下面的命令：\n\n```bash\njava -DSTANDALONE ChartingAp\n```\n\n\
  \n\n\n如果运行此命令时产生关于无法加载 OSGi 的错误，说明应用程序不是独立运行的。相反，它要求 `BIRT_HOME` 变量设置为运行时引擎文件夹的位置。使用类似下面的命令行参数来设置该变量：\n\
  \n`-DBIRT_HOME=\"C:/birt-runtime-2_6_0/ReportEngine\"`\n\n要在 Eclipse 工作区中测试图表应用程序，请在\
  \ Run→Open Run Dialog→Java Application→Arguments→VM Arguments 中设置这些变量。\n\n## 验证图表应用程序的环境\n\
  \nListing 15-1 展示了可以编写的最基础图表应用程序。该程序的输出是一个名为 `myChart.chart` 的文件，其中包含数百行 XML 代码。这段代码定义了一个没有数据、没有标签、没有系列且没有标题的基础图表。尽管这个输出并不代表一个有用的图表，但编译并运行该程序可以验证图表应用程序的环境配置是否正确。\n\
  \n**代码列表 15-1** 基础图表应用程序\n\n* * *\n\n```java\nimport java.io.*;\n\nimport org.eclipse.birt.chart.model.*;\n\
  \nimport org.eclipse.birt.chart.model.impl.*;\n\npublic class MyFirstChartProg {\n\
  \   public static void main( String[ ] args ) {\n      Chart myChart = ChartWithAxesImpl.create(\
  \ );\n      Serializer si = SerializerImpl.instance( );\n      try {\n         \
  \ si.write( myChart, new FileOutputStream( new File\n              ( \"C:\\\\myChart.chart\"\
  \ ) ) );\n      } catch ( IOException e ) { e.printStackTrace( ); }\n   }\n}\n```\n\
  \n### 关于图表 API 和图表结构\n\n报告设计中的图表元素通过 `org.eclipse.birt.report.model.api.ExtendedItemHandle`\
  \ 类扩展了基础 BIRT 报告项目，因此支持与其他报告项目相同的标准属性和功能。要使用设计引擎 API 访问图表项目，请带有参数 `chart.instance`\
  \ 调用 `ExtendedItemHandle.getProperty( )` 方法。此调用返回一个 `org.eclipse.birt.chart.model.Chart`\
  \ 对象。所有图表类型都通过 `org.eclipse.birt.chart.model.impl` 包中的类之一实现该接口，即 `ChartWithAxesImpl`、`ChartWithoutAxesImpl`\
  \ 和 `DialChartImpl`。将 `Chart` 对象强制转换为相应的类以更改其属性。\n\n`ChartWithAxesImpl` 是最常用的图表类。该类支持面积图、柱状图、气泡图、锥图、差异图、甘特图、折线图、金字塔图、散点图、股票图桶。`ChartWithoutAxesImpl`\
  \ 支持饼图和雷达图。`DialChartImpl` 支持仪表图。这些图表类型中的许多提供了子类型。例如，柱状图具有堆叠、百分比堆叠和并列子类型，影响多系列柱状图的外观。\n\
  \n#### 关于图表视觉组件\n\n图表的关键视觉组件是移动区域（blocks），由接口 `org.eclipse.birt.chart.model.layout.Block`\
  \ 定义。块包括绘图区域、标题区域和图例区域。图表应用程序可以相对于绘图区域更改标题和图例区域的位置。\n\n#### 关于图表数据\n\n图表的关键数据组件是系列（series）。系列控制要绘制的值集以及如何对这些值进行分组。图表将来自\
  \ `series` 的值显示为带轴图表中的数据点，显示为无轴图表中的切片或指针。图表应用程序可以将系列值静态地定义为数据集，或动态地定义为查询。图表引擎还提供了扩展点以支持自定义数据集类型。\n\
  \n### 理解静态数据\n\n图表引擎在生成图表之前，要求将所有数据放在实现图表 `org.eclipse.birt.chart.model.data.DataSet`\
  \ 接口的对象中。`org.eclipse.birt.chart.model.data.impl` 包中的以下接口扩展了 `DataSet` 接口：\n\n-\
  \ `BubbleDataSet`\n- `DateTimeDataSet`\n- `DifferenceDataSet`\n- `GanttDataSet`\n\
  - `NumberDataSet`\n- `StockDataSet`\n- `TextDataSet`\n\n每个接口都有对应的实现类，提供静态 `create`\
  \ 方法来初始化数据结构。例如，以下代码为图表中的系列创建一个静态的 `NumberDataSet`：\n\n```java\nNumberDataSet seriesOneValues\
  \ =\n    NumberDataSetImpl.create( new double[ ]{ 15, 23, 55, 76 } );\n```\n\n图表引擎不支持对静态数据集进行排序或分组。图表按照提供的顺序为静态数据集中的每个值显示一个数据点。\n\
  \n### 理解动态数据\n\n图表引擎支持从动态源获取数据，包括 BIRT 数据集和 `java.sqlResultSet` 对象。在这些情况下，绑定阶段根据模型中为图表每个系列定义的表达式生成图表数据集。完成此阶段后，每个\
  \ `Chart` 系列将绑定到静态数据部分列出的其中一个图表数据集。\n\n系列是图表中的一组绘制值。BIRT 使用系列定义对象来定义系列包含什么数据。例如，`row[\"\
  month\"]` 使用从绑定到图表的 BIRT 数据集中的月份列填充系列。此系列定义对象会产生一个绑定到支持的图表的运行时系列。\n\n（注：此处原文中存在大量重复的段落，已根据翻译要求进行逻辑处理，确保不重复输出且涵盖核心含义）\n\
  \n\n\n\n\nBIRT 图表引擎 API 支持更改图表属性。所有图表都拥有 `Chart` 接口提供的属性，例如 `dimension`（用于设置图表外观为二维、带深度的二维或三维）以及\
  \ `plot`（表示包含图表本身的区域）。\n\n`ChartWithAxesImpl` 类实现了 `ChartWithAxes` 接口，该接口提供了与 `x-`、`y-`\
  \ 以及某些图表类型的 `z-` 轴属性。\n\n`ChartWithoutAxesImpl` 类实现了 `ChartWithoutAxes` 接口，提供了饼图区域属性。`DialChartImpl`\
  \ 类实现了 `ChartWithoutAxes` 和 `DialChart` 接口。`DialChart` 支持仪表盘图使用的叠加（superimposition）属性。\n\
  \n每个接口都为其属性提供了获取（getter）和设置（setter）方法，必要时提供其他方法。例如，对于 `dimension` 属性，`Chart` 接口提供了\
  \ `getDimension()`、`setDimension()`、`isSetDimension()` 和 `unsetDimension()` 方法。\n\
  \n## 理解简单和复杂属性\n\n某些属性（如 `dimension`）是接受单个值的简单属性。某些简单属性接受由类定义为静态字段的限制值集。请使用 Javadoc\
  \ 查找这些值。\n\n其他属性（如图表的 `plot` 或 `title`）是复杂的。复杂属性的 getter 方法返回一个对象。例如，`Chart.getTitle()`\
  \ 方法返回 `org.eclipse.birt.chart.model.layout.TitleBlock` 对象。图表接口未为复杂属性提供 setter 方法。当代码更改复杂属性的属性时，更改会立即在图表上生效。\n\
  \n某些属性（如 `plot` 内部元素的水平间距）使用基于当前测量单位的值。调用 `Chart.setUnits()` 方法来设置你偏好的单位。\n\nListing\
  \ 15-3 显示了如何设置简单、复杂属性以及测量单位。\n\n**Listing 15-3** 获取和设置图表属性\n\n```java\n// 简单属性\n\
  \n// 将图表外观设置为二维\n\nchart.setDimension( ChartDimension.TWO_DIMENSIONAL_LITERAL );\n\
  \n// 设置图表的测量单位\n\nchart.setUnits( UnitsOfMeasurement.PIX_LITERAL.getLiteral( ) );\n\
  \n// 复杂属性\n\n// 设置图表标题\n\nchart.getTitle( ).getLabel( ).getCaption( ).setValue(\
  \ \"Europe\" );\n\n// 旋转图表标题中的文本\n\nchart.getTitle( ).getLabel( ).getCaption( ).getFont(\
  \ )\n    .setRotation( 5 );\n\n// 设置图块属性\n\nchart.getBlock( ).setBackground( ColorDefinitionImpl.WHITE(\
  \ ));\n\nchart.getBlock( ).setBounds( BoundsImpl.create( 0, 0, 400, 250 ));\n```\n\
  \n## 设置 plot 属性\n\n所有图表都有 `plot` 属性，它指定 `Chart` 对象中包含图表本身的区域。`plot` 是实现 `org.eclipse\
  \ .birt.chart.model.layout.Plot` 接口的对象。`Plot` 定义了水平和垂直间距以及包含图表渲染内容的客户端区域（client\
  \ area）。客户端区域本身是一个复杂属性，定义了如渲染图表的背景颜色和轮廓等属性。`Plot` 提供了相同包中由 `Block` 接口定义的所有属性，例如背景和轮廓。在为多个组件提供的属性设置值时，请根据所有类的特征确定修改该属性的最佳类。\n\
  \n要设置 `plot` 的属性，首先从图表实例对象获取 `Plot` 对象。然后使用 `Plot` 对象组件的 setter 方法。Listing 15-4\
  \ 阐了如何获取图表 plot 并修改其属性。\n\n**Listing 15-4** 获取图表 plot 并修改其属性\n\n```java\nPlot plot\
  \ = chart.getPlot( );\n\nplot.getClientArea().setBackground( ColorDefinitionImpl.CREAM(\
  \ ));\n\nplot.setHorizontalSpacing( plot.getHorizontalSpacing( ) + 10 );\n\nplot.getOutline(\
  \ ).setVisible( true );\n```\n\n## 设置 legend 属性\n\n所有图表都有 `legend` 属性，它是 `Chart`\
  \ 对象中包含图表图例的区域。对于没有轴的图表，图例识别饼图上的切片或仪表盘图上的指针。对于带轴的图表，图例识别在 `x` 轴上显示值的系列。对于具有多个 `y`\
  \ 系列的图表，图例会为每个系列显示独立部分。通常情况下，即使只有一个 `x` 轴组和一个 `y` 序列，也不要让图例可见。\n\n图例是一个实现 `org.eclipse.birt.chart.model\
  \ .layout.Legend` 接口的对象，该接口扩展了 `Block` 接口。`Legend` 提供所有 `Block` 属性以及 `Legend` 特有的属性，如位置、标题、文本和值。图例的默认位置是\
  \ plot 区域的右侧。在该位置内，通过设置 `anchor` 属性更改图例的位置。\n\n要设置图表图例的属性，首先从图表实例对象获取 `Legend` 对象。然后使用\
  \ `Legend` 对象组件的 setter 方法。要设置图例线的属性，请使用来自 `Legend` 对象的 `LineAttribute` 对象。Listing\
  \ 15-5 阐述了如何获取图表图例。\n\n**Listing 15-5** 获取图例并设置属性\n\n```java\nLegend legend = chart.getLegend(\
  \ );\n\nlegend.getText( ).getFont( ).setSize( 16 );\n\nlegend.getInsets( 10, 5,\
  \ 0 );\n\nlegend.setAnchor( Anchor.NORTH );\n\n// 设置图例的轮廓\n\nlegend.getOutline(\
  \ ).setVisible( false );\n\nLineAttributes lia = legend.getOutline( );\n\nlia.setStyle(\
  \ LineStyle.SOLID );\n```\n\n## 设置轴属性\n\n带轴的图表至少有两个轴：主基轴和与之正交的轴。主基轴是分类轴，显示任何类型的数据，通常是\
  \ `x` 轴。图表可以有多个主基轴。每个基轴至少有一个正交轴。正交轴是数值轴，显示数值，通常是 `y` 轴。\n\n`org.eclipse.birt.chart.model.component.Axis`\
  \ 接口支持分类轴和数值轴。\n\n要设置多个轴属性，将 `Chart` 对象强制转换为 `ChartWithAxes` 类型，如下所示：\n\n```java\n\
  newChart = ( ChartWithAxes ) chart;\n```\n\n要访问分类轴，调用 `ChartWithAxes.getPrimaryAxes()`\
  \ 方法。该方法返回一个数组。如果只有一个主基轴，获取数组的第一个元素，如下所示：\n\n```java\nAxis xAxisPrimary = newChart.getPrimaryAxes(\
  \ )[0];\n```\n\n要访问单个数值轴图表的数值轴，调用方法 `getOrthogonalAxis()`。对于具有多个数值轴的图表，通过 `getOrthogonalAxes()`\
  \ 获取轴列表。\n\nListing 15-6 展示了获取图表轴并设置其属性的技术。\n\n**Listing 15-6** 获取分类轴和数值轴并设置其属性\n\
  \n```java\nAxis xAxisPrimary = newChart.getPrimaryAxes( )[0];\n\nxAxisPrimary.getLabel(\
  \ ).getCaption( ).getFont( ).setRotation(45);\n\nxAxisPrimary.setType( AxisType.TEXT_LITERAL\
  \ );\n\nxAxisPrimary.getMajorGrid().setTickStyle(TickStyle.BELOW_LITERAL);\n\nxAxisPrimary.getOrigin(\
  \ ).setType(IntersectionType.VALUE_LITERAL);\n\nxAxisPrimary.getTitle( ).setVisible(\
  \ false );\n\nAxis yAxisPrimary = newChart.getPrimaryOrthogonalAxis( xAxisPrimary\
  \ );\n\nyAxisPrimary.getMajorGrid().setTickStyle(TickStyle.LEFT_LITERAL );\n\nyAxisPrimary.setType(\
  \ AxisType.LINEAR_LITERAL );\n\nyAxisPrimary.getScale( ).setMax( NumberDataElementImpl.create\n\
  \    ( 1000 ) );\n\nyAxisPrimary.getScale( ).setMin( NumberDataElementImpl.create(0));\n\
  \nyAxisPrimary.getTitle( ).getCaption( ).setValue( \"Sales Growth\" );\n\nyAxisPrimary.setFormatSpecifier\n\
  \    ( JavaNumberFormatSpecifierImpl.create( \"$\" ) );\n```\n\n## 使用系列\n\n\n\n\n\
  \n所有图表都使用系列（series）来定义要表示的数据值。系列对象包含一个用于在图表上绘制的值列表。要实例化一个 `Series` 对象，请调用 `org.eclipse.birt.chart.model.component.impl.SeriesImpl`\
  \ 上的静态 `create( )` 方法。可以通过访问外部数据源的动态查询，或包含值列表的静态数据集来定义系列的值集。对系列定义对象进行查询支持数据的分组和排序。\n\
  \n用于 `x` 轴或用于控制饼图扇区数量的值的系列，可以包含非数值数据值，例如日期或文本值。例如，这些系列可以包含某年份范围内的季度，或者产品代码或国家。\n\
  \n用于 `y` 轴或用于控制饼图中扇区大小的值的系列，必须持有数值。这些系列是 `Series` 接口的特定子接口的实现。每种图表类型都使用其自己的系列类型来控制图表表示的值。例如，`BarSeries`\
  \ 对象具有 `riser`（升起物）和 `riser outline`（升起物边界）属性，用于控制条形的外观。\n\n系列定义对象提供了访问图表系列对象的途径以及标准属性，例如用于显示饼图扇区、条形和其他标记的调色板。要实例化一个\
  \ `SeriesDefinition` 对象，请调用静态 `org.eclipse.birt.chart.model.data.impl.SeriesDefinitionImpl.create(\
  \ )` 方法。要向系列定义中添加系列，请获取系列集合并将系列添加到该集合中。要设置系列的颜色，请获取 `SeriesPalette` 对象并调用其 `shift(\
  \ )` 方法。\n\n系列定义支持多个系列。这些系列并不全都是相同类型。例如，折线图可以使用与条形图相同的轴。通常，图表会在 `y` 轴上显示额外的系列，而不是\
  \ `x` 轴上。\n\nListing 15-7 演示了如何从轴获取系列定义，以及如何更改系列的属性。\n\n**Listing 15-7** 获取系列定义并设置属性\n\
  \n```\nSeriesDefinition seriesDefX = SeriesDefinitionImpl.create( );\n\nseriesDefX\
  \ = ( SeriesDefinition )\n    xAxisPrimary.getSeriesDefinitions( ).get( 0 );\n\n\
  seriesDefX.getSeriesPalette( ).shift( 1 );\n```\n\n### 向图表添加系列\n\n若要在图表上显示值，请向新创建的图表添加类别系列和值系列，或修改现有图表上的系列。对于带有轴的图表，将系列与类别轴和值轴关联起来。\n\
  \n#### 创建类别系列\n\n在具有轴的图表上，类别系列是类别轴显示的值集。在没有轴的图表中，类别系列定义饼图中扇区的数量或仪表盘指针的数量。要创建类别系列，使用\
  \ `SeriesImpl` 类的静态 `create( )` 方法，如下行所示：\n\n```\nSeries seriesCategory = SeriesImpl.create(\
  \ );\n```\n\n### 创建正交系列\n\n正交系列（orthogonal series）指定值系列中的表示形式。在具有轴的图表中，正交系列是显示在\
  \ `y` 轴上的值集，例如以条形、气泡、股票条或蜡烛图的形式出现。在没有轴的图表中，正交系列设置饼图切片的大小或仪表盘指针的位置。图表可以有多个相同或不同类型的正交系列。\n\
  \n正交系列类是 `SeriesImpl` 类的子类，位于 `org.eclipse.birt.chart.model.type.impl` 包中。可用的类包括：\n\
  \n- `AreaSeriesImpl`\n- `BarSeriesImpl`\n- `BubbleSeriesImpl`\n- `DialSeriesImpl`\n\
  - `DifferenceSeriesImpl`\n- `GanttSeriesImpl`\n- `LineSeriesImpl`\n- `PieSeriesImpl`\n\
  - `ScatterSeriesImpl`\n- `StockSeriesImpl`\n\n`BarSeriesImpl` 类支持条形、锥形、金字塔和管道图类型。\n\
  \n要创建正交系列，使用系列类的静态 `create( )` 方法。以下行显示了创建条形系列的示例：\n\n```\nBarSeries barSeries2\
  \ = ( BarSeries ) BarSeriesImpl.create( );\n```\n\n#### 设置系列属性\n\n类别系列仅支持由 `SeriesImpl`\
  \ 类定义的属性。值系列支持由 `SeriesImpl` 相关子类定义的额外属性。例如，条形系列支持条形堆叠和升起物边界。饼系列支持切片边界和分离切片。\n\n\
  要设置系列的属性，请使用适当系列对象的 getter 和 setter 方法，如 Listing 15-8 所示，该示例设置了 `BarSeries` 和 `LineSeries`\
  \ 对象的属性。\n\n**Listing 15-8** 设置条形和折线的属性\n\n```\nLineSeries ls1 = ( LineSeries )\
  \ LineSeriesImpl.create( );\n\nls1.getLineAttributes( ).setColor( ColorDefinitionImpl.RED(\
  \ ) );\n\nBarSeries bs1 = ( BarSeries ) BarSeriesImpl.create( );\n\nbs1.getLabel(\
  \ ).setVisible( true );\n\nbs1.getLabel( ).getCaption( ).setValue( \"Q2\" );\n```\n\
  \n### 将数据与系列关联\n\n创建一个查询或数据集，并将该对象添加到系列数据定义中。要创建查询，使用 `org.eclipse.birt.chart.model.data.impl.QueryImpl`\
  \ 类的静态 `create( )` 方法。要创建数据集，使用 `DataSetImpl` 子类的静态 `create( )` 方法。数据集的类型必须与轴显示的值类型匹配。例如，显示日期和时间数据值的类别轴需要一个\
  \ `DateTimeDataSet` 类的数据集。同样，条形系列需要一个 `NumberDataSet` 类的数值数据集。某些系列需要多组数据。例如，股票系列需要四组数据：最高价、最低价、开启和收盘价。可以按顺序向系列添加四个查询，也可以向系列添加\
  \ `StockDataSet`。Listing 15-9 为折线、条形和股票系列添加查询和数据集。\n\n**Listing 15-9** 在类别系列上设置查询和数据集\n\
  \n```\n// 在类别系列上设置查询\nSeries seriesCategory = SeriesImpl.create( );\nQuery query\
  \ = QueryImpl.create( \"row[\\\"CATEGORY\\\"]\" );\nseriesCategory.getDataDefinition(\
  \ ).add( query );\n\n// 在类别系列上设置数据集\nSeries seBase = SeriesImpl.create( );\nDateTimeDataSet\
  \ dsDateValues =\n    DateTimeDataSetImpl.create( new Calendar[ ]{\n    new CDateTime(\
  \ 2011, 12, 21 ),\n    new CDateTime( 2011, 12, 20 ),\n    new CDateTime( 2011,\
  \ 12, 19 ),\n    new CDateTime( 2011, 12, 18 ),\n} );\nseBase.setDataSet( dsDateValues\
  \ );\n```\n\nListing 15-10 演示了如何创建第二个值系列，设置其某些属性，为系列分配数据，并将系列添加到轴。\n\n**Listing\
  \ 15-10** 创建系列、设置属性并添加到轴\n\n```\nSeriesDefinition seriesDefY = SeriesDefinitionImpl.create(\
  \ );\nseriesDefY.getSeriesPalette( ).update( ColorDefinitionImpl\n    .YELLOW( )\
  \ );\n\nBarSeries barSeries2 = ( BarSeries ) BarSeriesImpl.create( );\nbarSeries2.setSeriesIdentifier(\
  \ \"Q2\" );\nbarSeries2.setRiserOutline( null );\nbarSeries2.getLabel( ).setVisible(\
  \ true );\nbarSeries2.setLabelPosition( Position.INSIDE_LITERAL );\n\n// 为系列分配数据\n\
  Query query2 = QueryImpl.create( \"row[\\\"VALUE2\\\"]\" );\nbarSeries2.getDataDefinition(\
  \ ).add( query2 );\nseriesDefY.getSeries( ).add( barSeries2 );\n\n// 将新系列添加到 y 轴\n\
  yAxisPrimary.getSeriesDefinitions( ).add( seriesDefY );\n```\n\n### 向图表添加系列定义\n\n\
  设置 `SeriesDefinition` 对象属性后，将该对象添加到图表中。对于没有轴的图表，将系列定义直接添加到图对象的系列定义集合中。集合中的第一个系列定义类别系列，第二个定义正交系列。对于带有轴的图表，将系列定义添加到每个\
  \ `Axis` 对象的系列定义集合中，如 Listing 15-11 所示。\n\n\n\n\n\n**列表 15-11** 在饼图和带轴图表中添加系列定义\n\
  \n* * *\n\n```\nChartWithoutAxes cwoaPie = ChartWithoutAxesImpl.create( );\n\ncwoaPie.getSeriesDefinitions(\
  \ ).add( sd );\n\nPieSeries sePie = ( PieSeries ) PieSeriesImpl.create( );\n\nsePie.setDataSet(\
  \ seriesOneValues );\n\nsePie.setSeriesIdentifier( \"Cities\" );\n\nsd.getSeriesDefinitions(\
  \ ).add( sdCity );\n\nxAxisPrimary.getSeriesDefinitions( ).add( sdX );\n\nyAxisPrimary.getSeriesDefinitions(\
  \ ).add( sdY1 );\n\nyAxisPrimary.getSeriesDefinitions( ).add( sdY2 );\n```\n\n###\
  \ 设置图表的默认聚合\n\n图表会绘制它收到的每一个值，除非由 `org.eclipse.birt.chart.model.data.SeriesGrouping`\
  \ 对象定义了要执行的聚合类型。在类别系列（category series）上设置聚合，以定义用于进行聚合的值以及聚合类型，如列表 15-12 所示。图表生成器界面会显示可用的聚合类型。所有正交系列默认情况下使用类别系列分组指定的聚合类型。\n\
  \n**列表 15-12** 在类别系列上定义聚合\n\n* * *\n\n```\nSeriesGrouping grouping = sdX.getGrouping(\
  \ );\n\ngrouping.setEnabled( true );\n\ngrouping.setGroupType( DataType.TEXT_LITERAL\
  \ );\n\ngrouping.setGroupingUnit( GroupingUnitType.STRING_LITERAL );\n\ngrouping.setGroupingInterval(\
  \ 0 );\n\ngrouping.setAggregateExpression( \"Sum\" );\n```\n\n### 修改次要值系列的聚合\n\n\
  每个值系列（value series）都使用相同的聚合表达式来聚合要显示的值，除非应用程序通过设置特定于系列的 `SeriesGrouping` 来更改聚合。仅更改与默认分组不同的的分组属性，如列表\
  \ 15-13 所示。\n\n**列表 15-13** 在值系列上定义聚合\n\n* * *\n\n```\nSeriesGrouping groupingY2\
  \ = sdY2.getGrouping( );\n\ngroupingY2.setEnabled( true );\n\ngroupingY2.setAggregateExpression(\
  \ \"Average\" );\n```\n\n### 添加图表事件处理器\n\n绘图应用程序提供两种类型的图表事件处理器：Java 事件处理器或 JavaScript\
  \ 事件处理器。\n\n#### 添加 Java 图表事件处理器\n\n要添加 Java 事件处理器，请创建一个单独的 Java 类文件，其中包含事件处理器方法或多个方法。创建\
  \ Java 事件处理类的过程与为任何其他报告项目创建 Java 事件处理类的过程相同，如“使用 Java 编写脚本”和“图表编写脚本”章节中所描述的。该类必须为图表的每个事件处理器方法包含一个函数。\n\
  \n要在绘图应用程序代码中注册 Java 类，请使用图表实例对象的 `setScript()` 方法，如下语句所示：\n\n```java\nchart.setScript(\
  \ \"com.MyCompany.eventHandlers.ChartEventHandlers\" );\n```\n\n传递给 `setScript()`\
  \ 方法的字符串参数是 Java 类的完全限定名。不要在类名中包含 `.class` 扩展名。\n\n#### 添加 JavaScript 图表事件处理器\n\n\
  要添加 JavaScript 事件处理器，请将脚本编写为一个长字符串，并将该字符串传递给图表实例对象的 `setScript()` 方法。例如，列表 15-14\
  \ 中的语句向 `chart.setScript()` 传递了一个包含用于 `beforeDrawDataPointLabel` 事件处理器的脚本字符串。JavaScript\
  \ 代码中的换行由反斜杠 n (`\\n`）表示，脚本内的引号由反斜杠引号 (`\\\"`）表示。JavaScript 代码由几个字符串拼接在一起形成单个字符串。这种技术有助于提高脚本的可读性。\n\
  \n**列表 15-14** 在柱状图上添加事件处理器脚本\n\n* * *\n\n```javascript\ncwaBar.setScript ( \"function\
  \ beforeDrawDataPointLabel\"\n    + \"(dataPoints, label, scriptContext)\"\n   \
  \ + \"{val = dataPoints.getOrthogonalValue( );\"\n    +    \"clr = label.getCaption(\
  \ ).getColor( );\"\n    +    \"if ( val < -10 ) clr.set( 32, 168, 255 );\"\n   \
  \ +    \"else if ( ( val >= -10 ) & ( val <=10 ) )\"\n    +    \"clr.set( 168, 0,\
  \ 208 );\"\n    +    \"else if ( val > 10 ) clr.set( 0, 208, 32 );}\")\n```\n\n\
  ### 在报告设计中使用图表项目\n\nJava 程序可以打开现有的 BIRT 报告设计文件，并在显示或保存报告之前修改报告的内容。“为 BIRT 编程”章节描述了如何使用\
  \ BIRT 引擎和模型 API 打开报告设计文件。本节描述了如何使用 BIRT 图表 API 修改报告设计中的现有图表元素，并创建一个新的图表元素。以下章节包含该过程中每一步的代码示例。\n\
  \n#### 访问现有的图表项目\n\n要从报告设计中获取图表报告项目，请先按照章节描述使用 BIRT 引擎和模型 API 执行以下步骤：\n\n- 在 `DesignConfig`\
  \ 上，将 `BIRTHome` 属性设置为目录。\n- 使用 `IDesignEngineFactory` 创建 `IDesignEngine`。\n- 从\
  \ `IDesignEngine` 创建 `SessionHandle`。\n- 使用 `ReportDesignHandle` 打开设计。\n- 从 `ReportDesignHandle`\
  \ 访问图表元素。\n\n以下列表 15-15 说明了获取图表项目的过程。此代码假设图表是列表中的第一个项目。\n\n**列表 15-15** 获取 ReportDesignHandle\
  \ 和 Chart 对象\n\n* * *\n\n```java\nDesignConfig dConfig = new DesignConfig( );\n\
  dConfig.setBIRTHome( \"C:/birt-runtime_2_0/ReportEngine\" );\nIDesignEngine dEngine\
  \ = null;\nReportDesignHandle dHandle = null;\n\ntry {\n    Platform.startup( dConfig\
  \ );\n    IDesignEngineFactory dFactory = ( IDesignEngineFactory )\n        Platform.createObject(\
  \ EXTENSION_DESIGN_ENGINE_FACTORY );\n    dEngine = dFactory.createDesignEngine(\
  \ dConfig );\n    SessionHandle sessionHandle = dEngine.newSessionHandle( ULocale.ENGLISH\
  \ );\n    dHandle = sessionHandle.openDesign( reportName );\n} catch ( BirtException\
  \ e ) {\n    e.printStackTrace( );\n    return;\n}\n\nListHandle li = ( ListHandle\
  \ ) dHandle.getBody( ).getContents().get( 0 );\nExtendedItemHandle eihChart1 = (\
  \ ExtendedItemHandle ) li.getSlot( 0 ).getContents().get( 0 );\nChart chart = (\
  \ Chart ) eihChart1.getProperty( \"chart.instance\" );\n```\n\n#### 创建新的图表项目\n\n\
  在报告设计中创建新的图表项目之前，绘图应用程序执行上一节所述的所有启动平台和设计引擎的步骤。接下来，应用程序按照本章前面的描述创建 `Chart` 对象。为报告设计创建新的图表对象与在独立应用程序中创建图表相同。最后，应用程序创建一个图表元素，并通过执行以下任务设置链接图表对象到元素所需的属性：\n\
  \n- 获取 `ElementFactory` 对象：`ElementFactory` 支持创建新的报告元素。\n- 设置图表类型并创建数据：图表类型和示例数据为\
  \ BIRT Report Designer 中图表元素的外观指南。\n- 获取 `ExtendedItemHandle` 对象：`ExtendedItemHandle`\
  \ 对象类似于标准的报告项目句柄。句柄将图表对象与报告设计中的报告项目实例关联。句柄也是绑定数据集的对象。\n- 在报告项目上设置 `chart.instance`\
  \ 属性。\n\n\n\n\n报告项的 `chart.instance` 属性标识图表实例对象，并将报告项链接到图表实例对象。\n\n### 从报告设计中获取数据集\n\
  图表必须绑定数据以具有意义。报告设计提供了对报告开发人员定义的或或多个数据集的访问。程序可以创建一个数据集并将其添加到设计中。\n\n### 将图表绑定到数据集\n\
  要将图表绑定到数据集，请指定数据集作为扩展项句柄对象（extended item handle object）的属性。\n\n### 设置其他报告项属性\n\n\
  ### 将新图表添加到报告设计\n最后一步是通过将扩展项句柄对象添加到报告设计中，从而将图表添加到设计。\n\n### 可选保存报告设计\n创建或修改 BIRT\
  \ 报告设计的应用程序可以保存新的或修改后的报告设计。\n\n以下章节将更详细描述这些任务，并为每一步提供代码示例。\n\n#### 获取设计引擎元素工厂对象\n\
  在报告设计中创建图表项需要一个 `ElementFactory` 对象。要获取 `ElementFactory` 对象，请使用 `ReportDesignHandle`\
  \ 对象的 `getElementFactory()` 方法，如下行代码所示：\n\n```\nElementFactory ef = dHandle.getElementFactory(\
  \ );\n```\n\n关于使用 BIRT API 进行编程的章节提供了更多关于使用设计引擎 API 以及如何在报告设计中放置新项的的详细信息。\n\n###\
  \ 设置图表类型和子类型\n图表的类型（type）和子类型（subtype）决定了图表在 BIRT Report Designer 中的外观。结合示例数据，这些属性为报告设计布局窗口和图表向导提供了图表项的真实渲染。为了确保此渲染图表的显示尽可能准确，请设置图表类型以与轴上设置的系列类型匹配。带有轴的图表可以使用许多类型，如条形图、甘特图、折线图和股票图。没有轴的图表只能是仪表图、饼图或雷达图。\n\
  \n气泡图、仪表图、差异图、甘特图和饼图类各仅支持单一类型。其他图表类型有多个子类型。通过分别使用 `Chart` 方法 `setType()` 和 `setSubType()`\
  \ 设置图表类型和子类型。这些方法接受单个 `String` 参数。表表 15-1 显示了图表类型的可用值以及每种图表类型的有效子类型。因为锥形图、金字塔图和管图只是条形图的不同表示，它们具有与条形图相同的子类型。\n\
  \n**表 15-1** 图表类型和子类型属性\n\n![image](img/15tab01.jpg)\n\n![image](img/15tab01a.jpg)\n\
  \n列表 15-16 显示了如何设置图表类型和子类型：\n\n**列表 15-16** 设置图表的类型和子类型\n\n```\nChartWithAxes cwaBar\
  \ = ChartWithAxesImpl.create( );\n\ncwaBar.setType( \"Bar Chart\" );\n\ncwaBar.setSubType(\
  \ \"Side-by-side\" );\n```\n\n### 创建示例数据\n本节描述了创建图表的一个可选步骤。示例数据在 BIRT Report Designer\
  \ 中提供了图表外观的视觉信息。如果你省略了 列表 15-17 中的代码，图表在报告生成时会正确渲染，但设计器的布局窗口不会显示示例值。\n\n**列表 15-17**\
  \ 为图表添加示例数据\n\n```\nSampleData sdt = DataFactory.eINSTANCE.createSampleData( );\n\
  BaseData sdBase = DataFactory.eINSTANCE.createBaseData( );\nsdBase.setDataSetRepresentation(\
  \ \"A\" );\nsdt.getBaseSampleData( ).add( sdBase );\nOrthogonalData sdOrthogonal\
  \ = DataFactory.eINSTANCE.createOrthogonalData( );\nsdOrthogonal.setDataSetRepresentation(\
  \ \"1\" );\nsdOrthogonal.setSeriesIndex( 0 );\nsdt.getOrthogonalSampleData( ).add(\
  \ sdOrthogonal );\nnewChart.setSampleData( sdt );\n```\n\n#### 获取扩展项句柄\n图表报告项通过进一步扩展\
  \ `ExtendedItem` 类来扩展自设计引擎的 `ReportItem` 类。使用 `ElementFactory` 对象通过其 `newExtendedItem()`\
  \ 方法创建此对象，如下行所示：\n\n```\nExtendedItemHandle chartHandle = ef.newExtendedItem( null,\
  \ \"Chart\" );\n```\n\n### 将报告项设置为图表\n将报告项对象的 `chart.instance` 属性设置为包含图表对象。从扩展项句柄获取报告项，如\
  \ 列表 15-18 所示。\n\n**列表 15-18** 将图表对象与扩展项句柄关联\n\n```\nExtendedItemHandle chartHandle\
  \ = ef.newExtendedItem( null, \"Chart\" );\ntry {\n  chartHandle.getReportItem(\
  \ ).setProperty( \"chart.instance\", newChart );\n} catch ( ExtendedElementException\
  \ e ) {\n  e.printStackTrace( );\n}\n```\n\n#### 准备数据集和数据列\n新的图表项无法访问报告设计中的数据。图表项使用数据集的数据行以及列绑定（column\
  \ bindings）来定义如何将数据集中的值应用于图表。列绑定的名称必须与图表系列对象使用的列名匹配。\n\n要访问数据集，请从报告设计中创建一个数据集。接下来，通过实例化\
  \ `org.eclipse.birt.report.model.elements.structures.ComputedColumn` 对象来绑定列。列表 15-19\
  \ 中的代码访问了数据集。\n\n**列表 15-19** 获取数据集并准备列\n\n```\nDataSetHandle dataSet = ( DataSetHandle\
  \ ) dHandle.getDataSets( ).get( 0 );\nComputedColumn col1 = StructureFactory.createComputedColumn(\
  \ );\ncol1.setName( \"VALUE1\" );\ncol1.setExpression( \"dataSetRow[\\\"QUANTITYORDERED\\\
  \"]\" );\ncol1.setDataType( DesignChoiceConstants.COLUMN_DATA_TYPE_INTEGER );\n\
  ComputedColumn col2 = StructureFactory.createComputedColumn( );\ncol2.setName( \"\
  VALUE2\" );\ncol2.setExpression( \"dataSetRow[\\\"PRICEEACH\\\"]\" );\ncol2.setDataType(\
  \ DesignChoiceConstants.COLUMN_DATA_TYPE_FLOAT );\nComputedColumn col3 = StructureFactory.createComputedColumn(\
  \ );\ncol3.setName( \"CATEGORY\" );\ncol3.setExpression( \"dataSetRow[\\\"PRODUCTLINE\\\
  \"]\" );\ncol3.setDataType( DesignChoiceConstants.COLUMN_DATA_TYPE_STRING );\n```\n\
  \n### 将图表绑定到数据集\n使用扩展项句柄将图表绑定到数据集和数据列，如 列表 15-20 所示。\n\n**列表 15-20** 将数据集和列绑定到图表\n\
  \n```\ntry {\n  chartHandle.setDataSet( dataSet );\n  extendedItemHandle.addColumnBinding(\
  \ col1, true );\n  extendedItemHandle.addColumnBinding( col2, true );\n  extendedItemHandle.addColumnBinding(\
  \ col3, true );\n} catch ( SemanticException e ) {\n  e.printStackTrace( );\n}\n\
  ```\n\n### 设置其他报告项属性\n扩展报告项支持 `org.eclipse.birt.report.model.api.ReportItemHandle`\
  \ 类提供的所有属性。这些属性包括书签、尺寸和主题。例如，设置图表报告项的尺寸，请使用如 列表 15-21 所示的代码。\n\n**列表 15-21** 设置图表项属性\n\
  \n```\ntry {\n  extendedItemHandle.setHeight( \"250pt\" );\n  extendedItemHandle.setWidth(\
  \ \"400pt\" );\n} catch ( SemanticException e ) {\n  e.printStackTrace( );\n}\n\
  ```\n\n#### 将新图表添加到报告设计\n在设置图表属性并将图表绑定到数据后，将新图表添加到报告设计。列表 15-22 将图表项添加到现有列表项的页脚中。\n\
  \n**列表 15-22** 将图表项添加到报告设计\n\n```\nListHandle li = ( ListHandle ) dHandle.getBody(\
  \ ).getContents( ).get( 0 );\ntry {\n  li.getFooter( ).add( chartHandle );\n}\n\
  ```\n\n\n\n\n```java\ncatch ( ContentException e3 ) { e3.printStackTrace( ); }\n\
  \ncatch ( NameException e3 ) { e3.printStackTrace( ); }\n```\n\n### 添加图表后保存报告设计\n\
