  \ ) ) );\n}\nreturn vSubTypes;\n}\n```\n\n`getModel()` 方法将现有的图表模型转换为雷达图（Radar Chart），或者在向导尚未创建图表时创建一个新的。如前所述，当图表构建器在构建新图表或转换现有图表时会调用此方法，如列表\
  \ 23-4 所示。\n\n### 列表 23-4 `getModel()` 方法\n\n```java\npublic Chart getModel( String\
