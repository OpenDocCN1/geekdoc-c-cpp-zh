  \ 扩展点定义并实现了新数据源和数据集向导的用户界面。这些向导使用 Hibernate ODA 驱动插件来扩展 BIRT 报告设计器中 Data Explorer\
  \ 可用的功能。\n- `org.eclipse.ui.propertyPages`：`propertyPages` 扩展显示并操作 Hibernate 配置文件和映射文件。\n\
  - `org.eclipse.datatools.connectivity.connectionProfile`：`connectionProfile` 扩展在应用程序之间共享数据源连接。\n\
