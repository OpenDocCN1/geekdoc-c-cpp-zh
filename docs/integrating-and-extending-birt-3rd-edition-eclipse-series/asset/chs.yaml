  ```java\ndata.getStyle().setFontWeight(\"bold\");\n```\n\n11. 按 `CTRL-R` 运行代码到当前行。报告执行恢复并停止在当前行。\n\
  12. 在 `Variables` 视图中，检查当前上下文中的可用变量，如图 12-46 所示。\n\n当前订单针对产品线 `Planes`，并在报告中加粗字体显示。\n\
  \n**图 12-46** 在报告执行期间检查变量\n![image](img/12fig46.jpg)\n\n13. 在 Java 编辑器中，将鼠标指针悬停在\
  \ `ProductLine` 文本上，如图 12-47 所示。调试器解析文本并在可用时显示其值。\n\n**图 12-47** 鼠标指针悬停在 Java 文本上\n\
  ![image](img/12fig47.jpg)\n\n14. 在 `Breakpoint` 视图中，取消选择两个断点，如图 12-48 所示。在下次运行中，调试器将不再这些断点处暂停执行。\n\
  \n**图 12-48** 禁用断点\n![image](img/12fig48.jpg)\n\n15. 按 Resume `F8` 恢复执行。由于你在调试选项中选择了\
  \ `Open the generated file`（打开生成的文件），在调试进程终止后该文件将打开。一个包含生成的报告的新浏览器窗口将弹出，如图 12-49\
  \ 所示。\n\n**图 12-49** 在浏览器中查看报告\n![image](img/12fig49.jpg)\n\n\n\n\n\n16 检查已终止调试进程的调试视图，如图\
  \ 12-50 所示。\n\n**图 12-50** 检查调试进程的最终状态\n\n![image](img/12fig50.jpg)\n\n# 第四部分。将\
  \ BIRT 集成到应用程序\n\n![image](img/part-opener-04.jpg)\n\n## 第 13 章。理解 BIRT API\n\n\
  Eclipse BIRT 代码由数百个 Java 类和接口组成，但大多数是私有的，供 BIRT 开源项目的贡献者使用。应用程序开发者使用公共 API 中的类和接口。公共\
  \ API 包含以下包层次中的类和接口：\n\n- **报告引擎 API (Report Engine API)**\n`org.eclipse.birt.report.engine.api`\
  \ 包层次包含了自定义报告生成器开发者使用的 API。该 API 为报表应用程序提供了最常用的功能。报告引擎 API 中的关键类是 `ReportEngine`。该类提供了访问所有从报告设计或报告文档创建报告的任务\
  \ get。报告引擎 API 还包括支持报告设计脚本能力的类和包。\n\n- **设计引擎 API (Design Engine API)**\n`org.eclipse.birt.report.model.api`\
  \ 包层次是这两个报告 API 中大得多的。该 API 提供了对报告设计、模板或库的内容和结构的访问。报表应用程序可以调用此 API 来更改设计的结构。设计引擎\
  \ API 也是自定义报告设计开发者使用的 API。\n\n- **图表引擎 API (Chart Engine API)**\n`org.eclipse.birt.chart`\
  \ 包层次包含了图表生成器开发者使用的 API。报表应用程序还可以结合报告引擎和设计引擎 API 使用此 API，在报告设计中创建和修改图表元素。\n\n- **扩展\
  \ API (Extension APIs)**\nBIRT 提供了一系列扩展 API，用于创建自定义报告项目、自定义数据源和数据集、自定义渲染格式以及自定义图表。第\
  \ 5 部分，“使用扩展框架”提供了有关如何使用这些扩展的详细示例。\n\n有关 API 类和接口的详尽信息，请参阅在线帮助中的 Javadoc，位于 BIRT\
  \ Programmer Reference→Reference→API Reference 以及 BIRT Charting Programmer Reference→Reference→API\
  \ Reference。\n\n### 包层次结构图\n\n本章包含 BIRT API 中包的层次结构图。这些图显示了包内的类以及包局部的或由包内类实现的接口的层次结构。位于包名前之前的类和接口不是包局部的。在这些层次结构图中，表\
  \ 13-1 所示的图形表示类和接口的不同属性和关系。\n\n**表 13-1** 层次结构图的约定\n\n![image](img/13tab01.jpg)\n\
  \n### 关于 BIRT 报告引擎 API\n\nBIRT 报告引擎支持在几种不同的环境中进行报告生成和渲染，例如：\n\n- **独立引擎 (Stand-alone\
  \ engine)**\nJava 开发者使用独立引擎从现有的报告设计（`.rptdesign`）文件渲染 BIRT 报告。在这种环境中，Java 开发者创建一个命令行应用程序来以任何支持的格式写入完整的报告。\n\
  \n- **BIRT 报告查看器 (BIRT report viewer)**\nBIRT 报告设计器使用 BIRT 报告查看器以分页 HTML 形式查看报告。BIRT\
  \ 报告查看器是一个运行在嵌入 Eclipse 中的 Tomcat 应用程序服务器上的 Web 应用程序。该查看器包含内置报告引擎。\n\n- **嵌入引擎的自定义报告设计器\
  \ (Custom report designer with an embedded engine)**\n自定义桌面报告应用程序集成了 BIRT 报告引擎用于预览报告。\n\
  \n- **嵌入引擎的 Web 应用程序 (Web application that embeds the engine)**\n类似于 BIRT 报告查看器的\
  \ Web 应用程序可以使用 BIRT 报告引擎生成基于 Web 的报告。\n\nBIRT 报告引擎支持在这些环境中运行和渲染报告。它不执行依赖环境的处理，例如\
  \ URL 构建、图像存储和设计文件缓存。使用引擎 API 的应用程序必须向引擎提供此类上下文信息。\n\nBIRT 报告引擎 API 由接口和实现类组成，支持将\
  \ BIRT 的运行时集成到应用程序中。该 API 提供了支持以下操作的任务类：\n\n- 发现为报告定义的参数集\n- 获取参数的默认值\n- 运行报告设计以生成未格式化的报告文档\n\
  - 运行报告设计或报告文档以生成任何支持的输出格式\n- 从报告文档中提取数据\n\n#### 创建 BIRT ReportEngine 实例\n\n每个应用程序（无论是独立的还是基于\
  \ Web 的）只需要创建一个 `ReportEngine` 实例。由于 BIRT 报告引擎是线程安全的，因此单实例建议并不是限制。\n\n使用一个 `IReportEngineFactory`\
  \ 实例和 `EngineConfig` 对象来创建 `ReportEngine` 实例。\n\n### 使用 BIRT 报告引擎 API\n\nBIRT 报告引擎\
  \ API 支持以下生成报告的关键任务：\n\n- 使用 `EngineConfig` 对象设置报告引擎的选项\n- 启动平台 (Platform)\n- 使用\
  \ `ReportEngineFactory` 创建 `ReportEngine` 对象\n- 使用 `ReportEngine` 的 `openReportDesign()`\
  \ 方法之一打开现有的报告设计，或使用 `openReportDocument()` 方法打开现有的报告文档\n- 可选择使用 `IGetParameterDefinitionTask`\
  \ 对象获取报告参数的设计细节\n- 使用 `IRunAndRenderTask` 或 `IRunTask` 随后的 `IRenderTask` 运行并渲染报告\n\
  - 通过调用引擎实例上的 `destroy()` 清报告引擎，以卸载扩展并删除临时文件\n\n一些关键类和接口提供了 BIRT 报告的核心功能。接下来的章节提供了这些类的概述。\n\
  \n### EngineConfig 类\n\n`EngineConfig` 类封装了报告引擎的配置设置。使用 `EngineConfig` 对象为报告引擎的环境设置全局选项，包括：\n\
  \n- 指定 BIRT home，引擎插件和 Java 存档（`.jar`）文件的位置\n- 设置 OSGi 参数\n- 设置平台 (Platform)\n-\
  \ 设置资源位置\n- 添加应用程序范围的可脚本对象\n- 设置报告引擎写入临时文件的目录\n- 管理日志\n\n### ReportEngine 类\n\n\
  `ReportEngine` 类代表 BIRT 报告引擎。要实例化 `ReportEngine` 对象，请使用以 `EngineConfig` 对象作为参数的工厂方法。如果配置对象为空空，则环境必须提供指定\
  \ BIRT home 的 `BIRT_HOME` 变量。使用 `ReportEngine` 对象执行以下任务：\n\n- 获取配置对象\n- 打开报告设计或报告文档\n\
  - 创建获取参数定义的引擎任务\n- 创建访问报告项目数据的引擎任务\n- 获取支持的报告格式和 MIME 类型\n- 创建运行报告或渲染报告到输出格式的引擎任务\n\
  - 创建从报告文档提取数据的引擎任务\n- 更改日志配置\n- 清理并销毁引擎\n\n### IReportRunnable 接口\n\n使用引擎处理报告设计，请使用\
  \ `ReportEngine` 类中的 `openReportDesign()` 方法之一加载设计。这些方法返回一个代表报告报告设计的 `IReportRunnable`\
  \ 实例。使用 `IReportRunnable` 对象执行以下任务：\n\n- 获取标准报告设计属性，如报告标题\n\n\n\n\n\n-   获取报告设计中嵌入的图像\n\
  -   获取报告设计的句柄\n\n### IReportDocument 接口\n\n要使用报告文档，请使用 `ReportEngine.openReportDocument()`\
  \ 方法之一加载文档。这些方法返回一个 `IReportDocument` 实例。使用 `IRenderTask` 对象将 `IReportDocument`\
  \ 对象指定的报告渲染为支持的输出格式。使用 `IReportDocument` 中的目录标记来确定渲染的页面。`IReportDocument` 接口还支持获取页数、创建报告文档时使用的参数值以及书签。\n\
  \n## IEngineTask 接口\n\n`IEngineTask` 接口为报告引擎执行的任务提供了框架。`IEngineTask` 接口管理脚本上下文、获取和设置参数值、设置报告的区域、获取任务的当前状态以及取消任务。其他任务接口扩展了\
  \ `IEngineTask`。\n\n### IGetParameterDefinitionTask 接口\n\n`IGetParameterDefinitionTask`\
  \ 接口扩展了 `IEngineTask` 以提供对参数信息的访问。使用引擎工厂方法创建一个接受 `IReportRunnable` 参数的 `IGetParameterDefinitionTask`\
  \ 对象。参数定义提供了对以下内容的访问：\n\n- BIRT 报告设计器在设计时指定的信息\n- 静态或动态选择列表\n- 用户提供的值\n- 参数的分组结构\n\
  - 自定义 XML\n- 用户定义的属性\n\n### IDataExtractionTask 接口\n\n`IDataExtractionTask` 接口扩展了\
  \ `IEngineTask` 以提供对存储在 `IReportDocument` 对象中的数据的访问。使用 `IDataExtractionTask` 对象检查一组数据行的元数据。使用元数据选择一组列进行提取、排序或过滤。此接口可以从以下位置提取数据：\n\
  \n- 整个报告文档\n- 单个报告项\n- 报告项的单个实例\n\n## IRunTask 接口 \n\n`IRunTask` 接口提供了运行报告设计的方法。该任务将结果保存为磁盘上的报告文档（`.rptdocument`）文件。`IRunTask`\
  \ 对象接受 `HashMap` 作为参数值。在运行报告之前，调用 `validateParameters()` 方法验证参数值。\n\n## IRenderTask\
  \ 接口 \n\n`IRenderTask` 接口提供了将报告文档渲染为支持的输出格式之一的方法。该任务可以将报告保存到磁盘上的文件或流中。\n\n使用 `RenderOption`\
  \ 类设置渲染选项。使用 `RenderOption` 类的子类设置特定输出格式的选项。在渲染报告之前，将相应的渲染选项对象传递给 `IRenderTask`\
  \ 对象。\n\n## IRunAndRenderTask 接口 \n\n`IRunAndRenderTask` 接口提供了运行报告并将其为支持的输出格式之一的方法。该任务可以将报告保存到磁盘或流中。此任务不会创建中间报告文档（`.rptdocument`）文件。\n\
  \n`IRunAndRenderTask` 对象接受 `HashMap` 或单独参数值。在运行报告之前，调用 `validateParameters()` 方法验证参数值。\n\
  \n`IRunAndRenderTask` 对象支持与 `IRenderTask` 对象相同的渲染选项。在运行报告之前，将相应的渲染选项对象传递给 `IRunAndRenderTask`\
  \ 对象。\n\n### 报告引擎类层次结构\n\n图 13-1 中的类层次结构说明了报告引擎包中类的组织情况。除非另有说明，此图中所有类和接口都在 `org.eclipse.birt.report.engine.api`\
  \ 包中。\n\n**图 13-1** 报告引擎包中的类\n\n![image](img/13fig01.jpg)\n\n### 报告引擎接口层次结构\n\n\
  图 13-2 包含了报告引擎 API 的接口层次结构。除非另有说明，此图中所有接口都在 `org.eclipse.birt.report.engine.api`\
  \ 包中。\n\n**图 13-2** 报告引擎包的接口层次结构\n\n![image](img/13fig02.jpg)\n\n### 关于设计引擎 API\n\
  \n设计引擎 API 也称为报告模型 API。设计引擎 API 是工具编写者用于开发设计工具的 API。设计引擎 API 支持创建、访问和验证报告设计、库或模板。\n\
  \n`org.eclipse.birt.report.model.api` 包包含了用于访问设计模型对象的接口和类。设计引擎 API 支持以下任务：\n\n-\
  \ 读取和写写设计文件\n- 维护用于撤销和重做的命令历史\n- 提供报告设计的丰富语义表示\n- 提供有关 ROM 的元数据\n- 执行属性值验证\n- 在模型更改时通知应用程序\n\
  \n### 使用 BIRT 设计引擎 API\n\nBIRT 设计引擎 API 的目的是修改或创建设计文件，BIRT 报告引擎可以使用该文件生成报告。例如，BIRT\
  \ 报告设计器就是为了此目的使用 BIRT 设计引擎 API。为与 BIRT 报告设计器相同用途编写的自定义报告设计工具也可以使用 BIRT 设计引擎 API\
  \ 生成设计文件。设计引擎 API 以与报告设计相同的方式支持库和模板。BIRT 设计引擎 API 不包含任何用户界面类。自定义报告设计工具必须提供自己的用户界面代码。\n\
  \n设计引擎支持以下创建或修改 BIRT 报告设计的任务：\n\n- 通过使用 `DesignConfig` 对象为设计引擎设置选项\n- 启动平台（如果尚未启动）\n\
  - 使用 `DesignEngineFactory` 创建 `DesignEngine` 对象\n- 使用 `DesignEngine.newSessionHandle()`\
  \ 方法实例化 `SessionHandle` 对象开启会话\n- 使用 `SessionHandle` 对象设置会话参数并加载元素定义以创建 `ReportDesignHandle`\n\
  - 使用 `ReportDesignHandle` 创建 `ElementFactory`，它可以创建报告元素\n- 使用 `ReportDesignHandle`\
  \ 向报告设计中添加新元素或修改现有元素\n- 使用 `ReportDesignHandle` 保存设计文件\n\n以下章节描述了 BIRT 设计引擎 API\
  \ 主要类。\n\n### DesignConfig 类\n\n`DesignConfig` 类封装了设计引擎的设置。使用 `DesignConfig` 对象为设计引擎设置全局选项，包括：\n\
  \n- 指定引擎插件和 Java 归（.jar）文件的位置\n- 设置平台上下文\n- 指定配置变量\n- 设置 OSGi 参数\n\n### DesignEngine\
  \ 类\n\n`DesignEngine` 类代表 BIRT 设计引擎。使用接受 `DesignConfig` 对象的工厂方法创建 `DesignEngine`。如果配置对象为空，则环境必须提供\
  \ BIRT 路径，即包含引擎插件和 JAR 文件的目录。`DesignEngine` 类是创建构建报告设计所需的其他对象的入口。使用 `DesignEngine`\
  \ 类的方法通过调用 `newSession()` 创建特定区域的 `SessionHandle` 对象。`SessionHandle` 提供了对报告设计对象的访问。\n\
  \n### SessionHandle 类\n\n`SessionHandle` 类代表用户会话。`SessionHandle` 对象提供了对打开设计的访问。会话有一组默认属性值和一个默认测量单位。会话还有创建和打开报告设计、模板和库的方法，以及设置用于定位资源的路径和算法。创建或打开报告设计的方法返回\
  \ `ReportDesignHandle` 对象。\n\n### ModuleHandle 类\n\n\n\n\n\n`ModuleHandle` 提供了对报告设计、模板和库的通用结构和功能的访问。`ModuleHandle`\
  \ 类是 `ReportDesignHandle` 和 `LibraryHandle` 类的父类。`ModuleHandle` 提供了通用属性（如作者和注释）的访问。可以使用\
  \ `ModuleHandle` 处理文件的许多任务，包括：\n\n*   将模块保存到文件\n*   访问用于撤销和重做的命令堆栈\n*   导航到模块的不同部分\n\
  *   检索模块位置\n*   获取配置变量\n\n其他 `ModuleHandle` 方法支持获取指向单个报告项目以及报告设计、模板或库中所有其他元素的句柄。这些元素和支持组件包括：\n\
  \n*   报告项目。这些元素是视觉化报告元素，如表格、网格、图像和文本元素。\n*   代码模块。这些模块是应用于整个文件的全局脚本。\n*   参数。\n\
  *   数据源、数据集和联分析立方体（cubes）。\n*   调色板。该组件是自定义颜色名称的集合。\n*   模块使用的 CSS 文件。\n*   主题。主题是模块用于格式化报告元素的一组样式。\n\
  *   主页。此元素定义了分页报告输出中页的布局。\n*   库。任何模块可以使用一个或多个库来提供预定义的元素。\n*   资源。外部文件，例如提供本地化形式的图像或消息列表。\n\
  *   嵌入图像。\n\n### ReportDesignHandle 类\n`ReportDesignHandle` 提供了对报告设计特定属性的访问，例如在生成或渲染报告时执行的脚本。该类还提供了模板使用的属性访问，如备忘表、显示名称和图标文件。\n\
  \n`ReportDesignHandle` 是 `ModuleHandle` 的子类，因此支持该类的所有功能。使用 `ReportDesignHandle`\
  \ 获取单个报告项目的句柄，并处理许多报告设计特定的任务，包括：\n\n*   导航到设计的各个部分\n*   设置在报告引擎运行并渲染报告时执行的特定事件脚本\n\
  \n`ReportDesignHandle` 还具有访问以下报告组件的方法：\n\n*   样式，用于格式化报告元素的用户定义样式列表\n*   基本目录，具有相对路径的文件系统资源所在位置\n\
  *   主体（Body），设计中报告章节和报告项目的列表\n*   暂存板（Scratch Pad），在重构报告时存放报告项目的临时位置\n\n### LibraryHandle\
  \ 类\n`LibraryHandle` 是 `ModuleHandle` 的子类，因此支持该类的所有功能。`LibraryHandle` 还提供了对以下库特定属性的访问：\n\
  \n*   命名空间，包含库的模块用于识别库所定义的元素的名称\n*   库定义的主题集\n*   主题使用的导入 CSS 样式\n\n### DesignElementHandle\
  \ 类\n`DesignElementHandle` 是所有报告元素的基类，包括视觉化报告项目元素和非视觉元素（如数据集和联分析立方体）。`DesignElementHandle`\
  \ 为所有元素提供通用服务，例如：\n\n*   向槽位添加报告项目\n*   注册更改事件监听器\n*   获取和设置属性、名称和样式\n*   获取特定属性的可用选项\n\
  *   从设计中删除元素\n*   复制、粘贴和移动报告项目\n\n### 单个元素句柄类\n元素句柄类派自 `ReportElementHandle`。每个报告元素都有自己的句柄类。要执行针对特定报告元素唯一的操作，请将\
  \ `ReportElementHandle` 转换为该元素的相应子类。例如，`CellHandle` 类提供了 `getColumn()` 等方法，而 `DataSourceHandle`\
