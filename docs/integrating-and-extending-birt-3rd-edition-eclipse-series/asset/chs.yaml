  ![image](img/18fig54.jpg)\n\n报告设计器中的预览（如图 18-55-ch18.html_ch1855 所示）显示了来自数据库的 RotatedText\
  \ 项目项目的值。文本数据来自列绑定，并随行自动变化。\n\n\n\n\n\n一个 BIRT 插件通常在 BIRT 报告引擎环境中加载和运行，而不是在 Eclipse\
  \ 运行环境中。BIRT 为 BIRT 报告引擎实现了一套独立的插件加载框架，使 BIRT 报告引擎对报告执行具有完全控制权。BIRT 引擎插件扩展在功能上与\
  \ Eclipse 插件扩展相似。\n\n渲染扩展（rendering extension）通过实现扩展点 `org.eclipse.birt.report.engine.emitters`，向\
  \ BIRT 报告引擎框架添加一个发射器（emitter）。\n\nXML 架构文件 `org.eclipse.birt.report.engine/schema/emitters.exsd`\
  \ 描述了该扩展点。\n\n该扩展点使得演示引擎能够支持新的输出格式。BIRT 插件注册表使用此扩展点来发现为报告引擎环境指定的所有支持的输出格式。\n\n本章使用了自定义的\
  \ CSV 和 XML 报告渲染扩展作为示例，展示了如何创建报告渲染扩展。BIRT 用户界面还提供了一个内置的数据提取功能，可以将数据以 CSV、TSV（制表符分隔值）和\
  \ XML 格式从报告文档中导出。\n\n您可以在 [`www.actuate.com/birt/contributions`](http://www.actuate.com/birt/contributions)\
  \ 下载 CSV 和 XML 报告渲染扩展示例的源代码。参考文档，请查看 Eclipse Help 中 BIRT 报告引擎 API Javadoc 对应 `org.eclipse.birt.report.engine.emitter`\
  \ 和 `org.eclipse.birt.report.engine.content` 包。\n\n### 开发 CSV 报告渲染扩展\n\nCSV 报告渲染扩展扩展了\
  \ `org.eclipse.birt.report.engine.emitter` 包定义的功能，该包是 `org.eclipse.birt.report.engine`\
  \ 插件的一部分。在开发 CSV 报告渲染扩展时，您需要以下任务：\n\n*   在 Eclipse PDE 中创建 CSV 报告渲染扩展项目。\n*   定义依赖关系。\n\
  *   声明发射器扩展点。\n*   实现发射器接口。\n*   在设计器和运行环境中测试该扩展。\n\n#### 创建 CSV 报告渲染插件项目\n\n使用\
  \ Eclipse PDE 为 CSV 报告渲染扩展创建一个新的插件项目。\n\n**如何创建 CSV 报告渲染插件项目**\n\n**1** 从 Eclipse\
  \ PDE 菜单中，选择 `File→New→Project`。出现 New Project（新项目）。\n\n**2** 在 `New Project` 中，选择\
  \ `Plug-in Project`。点击 Next（下一步）。出现 New Plug-in Project（新插件项目）。\n\n**3** 在 `Plug-in\
  \ Project` 中，修改设置，如表 19-1\n\n出现 Plug-in Project，如图 19-1\n\n**4** 在 `Content` 中，修改设置，如表\
  \ 19-2\n\n出现 Content，如图 19-2\n\nCSV 报告渲染扩展项目出现在 Eclipse PDE 工作空间中，如图 19-3\n\n####\
  \ 为 CSV 报告渲染扩展定义依赖关系\n\n为了编译和运行 CSV 报告渲染示例，您需要指定在扩展类路径上必须可用的插件列表。\n\n**如何指定依赖关系**\n\
  \n**1** 在 PDE Manifest Editor（PDE 清单文件编辑器）上，选择 `Overview`（概述）。\n\n**2** 在 `Plug-in\
  \ Content` 中，选择 `Dependencies`（依赖关系）。Required Plug-ins（必需插件）包含以下插件：\n\n`org.eclipse.core.runtime`\n\
  \n**3** 在 `Required Plug-ins` 中，执行以下任务：\n\n**1** 选择 `org.eclipse.core.runtime` 并选择\
  \ `Remove`（移除）。\n\n`org.eclipse.core.runtime` 不再出现在 Required Plug-ins 中。\n\n**2**\
  \ 选择 `Add`（添加）。出现 Plug-in Selection（插件选择）。\n\n**3** 在 `Plug-in Selection` 中，按住 `CTRL`\
  \ 并选择 `org.eclipse.birt.report.engine` 插件。\n\n点击 `OK`。出现 Dependencies（依赖关系），如图 19-4\n\
  \n#### 声明发射器扩展点\n\n在此步骤中，您需要指定实现 CSV 报告渲染扩展所需的扩展点，并添加扩展元素详情。扩展点 `org.eclipse.birt.report.engine.emitters`\
  \ 指定了以下用于标识该扩展点的属性：\n\n*   `ID`: 扩展实例的可选标识符\n*   `Name`: 扩展实例的可选名称\n\n该扩展点定义了一个发射器，用于指定插件的输出格式，需要定义以下扩展元素属性：\n\
  \n*   `class`: 实现 `IContent` 的 Java 类\n*   `format`: 插件支持的输出格式，例如 `csv`\n*   `mimeType`:\
  \ 格式的 MIME 类型，例如 `text/csv`\n*   `id`: 扩展的可选标识符\n*   `icon`: 扩展的可选图标路径\n*   `pagination`:\
  \ 可选的分页设置。设置为 `page-break-pagination` 时，根据分页符分页；设置为 `no-pagination` 时，报告在页内；设置为\
  \ `paper-size-pagination` 时，根据纸张大小分页。\n*   `supportedImages`: 支持图片的格式。此示例中的 CSV\
  \ 发射器不支持图片。\n*   `outputDisplayNone`: 控制报告中是否输出隐藏内容。例如，如果用户设置为隐藏，内容将不会显示。\n*   `isHidden`:\
  \ 用于判断是否显示在 UI 中。该属性在当前版本中未使用。\n*   `needResultSet`: 表示发射器是否需要输出查询结果集。如果该属性设置为 true，发射器可以访问内容对象中的结果集。\n\
  \n使用 Eclipse PDE 指定扩展点。\n\n**如何指定扩展点**\n\n**1** 在 PDE Manifest Editor 上，选择 `Extensions`（扩展）。\n\
