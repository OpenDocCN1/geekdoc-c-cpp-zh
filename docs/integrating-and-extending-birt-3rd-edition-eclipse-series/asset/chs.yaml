  \ sdBase = DataFactory.eINSTANCE.createBaseSampleData( );\n    sdBase.setDataSetRepresentation(\
  \ \"A, B, C, D\" );\n    sd.getBaseData( ).add( sdBase );\n    // 创建正交示例数据（模拟次数为\
