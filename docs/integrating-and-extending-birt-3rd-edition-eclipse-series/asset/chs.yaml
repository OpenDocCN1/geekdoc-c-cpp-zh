  \ ASCII 格式的 `.properties` 文件。列表 22-2 显示了带有 `NativeToAscii` 规范的 `build.xml` 文件内容。\n\
  \n**列表 22-2** `build.xml` 文件的内容\n\n* * *\n\n```xml\n<?xml version=\"1.0\" encoding=\"\
  UTF-8\"?>\n    <project\n        name=\"org.eclipse.birt.report.viewer.nl\" default=\"\
  Jar\"\n        basedir=\".\">\n      <description>\n        NL Fragment for org.eclipse.birt.report.viewer\n\
  \      </description>\n      <property file=\"META-INF/MANIFEST.MF\" />\n      <property\
  \ name=\"dir.src\" value=\"src\" />\n      <property name=\"dir.bin\" value=\"bin\"\
  \ />\n      <property name=\"nl.group\" value=\"1\" />\n      <property name=\"\
  module.name\"\n        value=\"org.eclipse.birt.report.viewer.nl\" />\n      <property\
  \ name=\"jar.name\"\n        value=\"${module.name}${nl.group}_${Bundle-Version}.jar\"\
  \ />\n      <target name=\"Clean\">\n        <delete>\n          <fileset dir=\"\
  ${dir.src}\"\n          includes=\"**/*_??.properties\" />\n          <fileset dir=\"\
  .\" includes=\"${jar.name}\" />\n        </delete>\n      </target>\n      <target\
  \ name=\"NativeToAscii\"\n        description=\"Execute native2ascii for *.msg\"\
  >\n        <native2ascii encoding=\"Cp1252\"\n          src=\"${dir.src}\"\n   \
  \       dest=\"${dir.src}\"\n          ext=\".properties\"\n          includes=\"\
  **/*_de_DE.msg,\n          **/*fr_FR.msg, **/*_es_ES.msg\"/>\n        <native2ascii\
  \ encoding=\"GBK\"\n          src=\"${dir.src}\"\n          dest=\"${dir.src}\"\n\
  \          ext=\".properties\"\n          includes=\"**/*_zh_CN.msg\"/>\n      \
  \  <native2ascii encoding=\"SJIS\"\n          src=\"${dir.src}\"\n          dest=\"\
  ${dir.src}\"\n          ext=\".properties\"\n          includes=\"**/*_ja_JP.msg\"\
  />\n        <native2ascii encoding=\"MS949\"\n          src=\"${dir.src}\"\n   \
  \       dest=\"${dir.src}\"\n          ext=\".properties\"\n          includes=\"\
  **/*_ko_KR.msg\"/>\n      </target>\n      <target name=\"nl-jar\">\n        <jar\
  \ destfile=\"${jar.name}\"\n          manifest=\"./META-INF/MANIFEST.MF\">\n   \
  \       <zipfileset dir=\"${dir.src}\"\n            includes=\"**/*.properties\"\
  />\n          <fileset dir=\".\"\n            includes=\"plugin_??_??.properties\"\
  />\n        </jar>\n      </target>\n    </project>\n```\n\nEclipse PDE 提供了在运行时环境中部署插件的支持。要部署片段，请使用导出向导或手动将\
