  \n**6** 点击“应用”（Apply）创建报告调试配置。\n\n### 教程 3：调试包含 Java 和 JavaScript 代码的报告\n\n\n\n\n\
  本教程提供了逐步说明，介绍如何调试一个包含 Java 和 JavaScript 事件处理器的报告。本教程中的报告示例使用了 `Classic Models` 示例数据库，并显示了汽车销售情况，按国家和客户对数据进行分组。报告中的额外分析突出了价格高于\
  \ `fuschia`（洋洋红色）中位价的订单，以及价格低于 `yellow`（黄色）中位价的订单。用户选择的产品线的订单以**粗体**显示。报告使用 JavaScript\
