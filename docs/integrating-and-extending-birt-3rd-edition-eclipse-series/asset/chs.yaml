  ![image](img/08fig09.jpg)\n\n## 使用 `row` 对象\n\n`row` 对象提供了在 `DataSet.onFetch()`\
  \ 方法内部访问当前行列的权限。你可以使用类似下面示例语句中的列名来检索任何列的值：\n\n```\ncol1Value = row[\"custNum\"];\n\
  col1Value = row.custNum;\n```\n\n只有当列名是不包含空格或特殊字符的有效 JavaScript 名称时，你才能通过列名对列位置进行索引。或者，如果别名是有效的\
  \ JavaScript 名称，你可以使用列别名。\n\n你也可以通过数字索引列位置来获取列值，如下语句所示：\n\n```\ncol1Value = row[1];\n\
  ```\n\n当你用数字对列位置进行索引时，括号内的数字是该列的位置，从 1 开始。你可以通过 `row[0]` 获取行号。\n\n尽管你在 JavaScript\
  \ 中使用数组语法来访问 `row` 对象，但该对象并不是 JavaScript 数组。因此，你不能对 `row` 对象使用 JavaScript 数组属性（如\
  \ `length`）。\n\n#### 获取列信息\n\n`DataSet` 对象有一个 `getColumnMetaData()` 方法，该方法返回一个 `IColumnMetaData`\
  \ 对象。`IColumnMetaData` 接口提供了有关数据集中列信息的方法，如表 8-2 所示。\n\n**表 8-2** IColumnMetaData\
  \ 接口的方法\n\n![image](img/08tab02.jpg)\n\n从 `dataSet` 对象获取 `IColumnMetaData` 对象，如下语句所示：\n\
  \n```\ncolumnMetaData = this.getColumnMetaData();\n```\n\n此调用在 `beforeOpen` 或 `afterClose`\
  \ 事件中是不支持的，因为在这两个事件触发时，实例分别尚未构造或已从移除。\n\n你可以使用列数来遍历数据集中的所有列，如代码列表 8-15 所示。\n\n**代码列表\
  \ 8-15** 在 afterOpen 中遍历\n\n```\nimport org.birt.report.engine.internal.DataSetInstance;\n\
  if(this instanceof DataSetInstance){\n    columnMetaData = this.getColumnMetaData();\n\
  \    colCount = columnMetaData.getColumnCount();\n    for ( i = 1; i <= colCount;\
  \ i++ {\n        out.println(\"Column \" + i + \": \" + columnMetaData.getColumnName(i));\n\
  \    }\n}\n```\n\n#### 获取并修改查询字符串\n\n在任何 DataSet 事件处理程序中获取 JDBC 查询的文本，如下所示：\n\n\
  ```\nquery = this.queryText;\n```\n\n你可以在 `beforeOpen` 事件中通过设置 `queryText` 字符串来修改查询。更改查询时将\
  \ `queryText` 设置为有效的 SQL 查询，如下所示：\n\n```\nqueryText = \"select * from CUSTOMERS\
  \ WHERE CUSTOMNUMBER BETWEEN \" + params[lownumber].value + \" AND \" + params[highnumber].value;\n\
  ```\n\n动态修改查询优点可以使用业务逻辑来确定查询，这种方法比使用参数更灵活。使用此技术修改数据源的其他属性。BIRT 也支持在数据源和数据集编辑器中使用属性绑定功能修改数据集属性。这些方法之间的区别在于，属性绑定仅适用于运行中的报告。脚本在预览数据集时也有效。\n\
  \n使用类似的技术更改平面文件数据源的查询字段。在平面文件数据源中，查询存储了要读取的平面文件的名称以及列信息。代码列表 8-16 显示了平面文件查询的示例 XML\
  \ 代码。\n\n**代码列表 8-16** 平面文件数据源上的查询\n\n* *\n\n```xml\n<![CDATA[\nselect \"Age\",\
  \ \"Male\", \"Female\"\nfrom CSV1.csv :\n{\"Age\",\"Age\",STRING;\"Male\",\"Male\"\
  ,STRING;\"Female\",\"Female\",STRING}\n]]>\n```\n\n在此示例中，CSV1 是要读取的文件。`beforeOpen`\
  \ 数据集脚本可以使用简单的 `replace` 方法修改要读取的文件，如下代码所示：\n\n```\nqry = this.queryText\nthis.queryText\
  \ = qry.replace( \"CSV1.csv\", \"CSV2.csv\");\n```\n\n### 修改数据源连接属性\n\n通过访问 `DataSource`\
  \ 对象的 `extensionProperties` 数组更改数据源的连接属性。ODA 扩展定义了运行时设置的连接属性列表。\n\n表 8-3 描述了影响连接的\
  \ JDBC 数据源属性。\n\n\n\n\n要更改这些属性，请在数据源的 Listing 8-17 `beforeOpen` 脚本中添加类似语句的代码。\n\n\
  #### 列表 8-17 在 beforeOpen 中更改数据源连接属性\n\n```javascript\nextensionProperties.odaUser\
  \ = \"JoeUser\";\nextensionProperties.odaPassword = \"openSesame\";\nextensionProperties.odaURL\
  \ = \"jdbc:my_data_source:xxx\";\nextensionProperties.odaDriverClass = \"com.companyb.jdbc.Driver\"\
  ;\nextensionProperties.odaJndiName = \"java:/MySQLDs\";\nextensionProperties.OdaConnProfileName\
  \ = \"myprofile\";\nextensionProperties.OdaConnProfileStorePath = \"c:/conprof\"\
  ;\n```\n\n或者，使用以下语法设置这些属性\n\n```javascript\nthis.setExtensionProperty(\"odaURL\"\
  , \"jdbc:mysql://localhost/mysql\");\n```\n\n`beforeFactory` 事件也支持更改连接属性，如 Listing\
  \ 8-18 所示。\n\n#### 列表 8-18 在 beforeFactory 中更改数据源连接属性\n\n```javascript\nreport =\
  \ reportContext.getDesignHandle( );\ndsHandle = report.findDataSource(\"Data Source\"\
  );\ndsHandle.setProperty(\"odaDriverClass\", \"myDriver\");\ndsHandle.setProperty(\"\
  odaURL\", \"myUrl\");\n```\n\n你还可以使用数据源编辑器中的属性绑定功能来设置数据源和数据集的属性。\n\n#### 获取参数值\n\
  \n脚本通过将参数名称传递给 `reportContext` 对象的 `getParameterValue( )` 方法来获取报告参数的值。以下语句获取 `UserID`\
  \ 参数的值：\n\n```javascript\nuserID = reportContext.getParameterValue( \"UserID\" );\n\
  ```\n\n你还可以在具有以下语法的语句中使用 BIRT 全局变量 `params` 来取回参数值：\n\n```javascript\nuserID = params[\"\
  UserID\"].value;\n```\n\nBIRT 同样支持允许选择多个值的动态参数。使用以下语法访问这些参数：\n\n```javascript\n\
  reportContext.getParameterValue( \"MultiParm\" )[0];\nparams[\"MultiParm\"].value[0];\n\
  ```\n\n上述语句检索多值参数的第一个值。使用以下语法确定所选值的数量：\n\n```javascript\nreportContext.getParameterValue(\
  \ \"MultiParm\" ).length;\nparams[\"MultiParm\"].value.length;\n```\n\n在实现 `beforeOpen`\
  \ 事件处理程序时，可以使用这些功能为查询应用 `IN` 子句，如 Listing 8-19 所示。\n\n#### 列表 8-19 在 beforeOpen\
  \ 中访问多个参数值\n\n```javascript\nvar parmcount = params[\"parmorders\"].value.length\n\
  var whereclause = \"\";\n\nif( parmcount > 0 ){\n   whereclause = \" where customernumber\
  \ in ( \";\n}\nfor( i=0; i < parmcount; i++ ){\n   if( i == 0 ){\n      whereclause\
  \ = whereclause + params[\"parmorders\"].value[i];\n   }else{\n      whereclause\
  \ = whereclause + \" , \" +\n      params[\"parmorders\"].value[i];\n   }\n}\nif(\
  \ parmcount > 0 ){\n   this.queryText = this.queryText + whereclause + \" ) \";\n\
  }\n```\n\n数据集也有参数。这些参数会影响特定的数据集。通常，当数据集绑定到嵌套表时，数据集参数会链接到报告参数或绑定到外部表格列的值。数据集脚本支持获取和设置参数值。在数据集运行之前，在数据集的\
  \ `beforeOpen` 中设置参数值，如 Listing 8-20 所示。\n\n#### 列表 8-20 在 beforeOpen 中设置数据集参数值\n\
  \n```javascript\n//set input parameter\ninputParams[\"alpha\"] = 5;\n//or\nthis.setInputParameterValue(\"\
  alpha\", 5);\n```\n\n通过引用 `inputParams` 数组或使用 `this.getInputParameterValue` 方法来获取值。\n\
  \n#### 确定脚本执行顺序\n\n你可以通过编写代码生成一个文件，该文件包含你想要跟踪的每个脚本的一行，从而确定脚本的执行顺序。\n\n要创建一个包含脚本执行顺序的输出文件，请在\
  \ `ReportDesign.initialize` 脚本中包含初始化代码，并在 `ReportDesign.afterFactory` 脚本中包含结束代码。在你想要跟踪的每个脚本中，添加代码向输出文件写入一行文本。用\
  \ JavaScript 编写代码比 Java 更容易，但也可以用 Java 编写类似的代码。\n\n以下章节将展示如何使用 JavaScript 确定脚本执行顺序。\n\
  \n### 提供 ReportDesign.initialize 代码\n\n`ReportDesign.initialize` 方法中的后续代码会在硬盘上创建一个文件并向该文件添加一行。\n\
  \n```javascript\nimportPackage( Packages.java.io );\nfos = new java.io.FileOutputStream(\
  \ \"c:\\\\logFile.txt\" );\nprintWriter = new java.io.PrintWriter( fos );\nprintWriter.println(\
  \ \"ReportDesign.initialize\" );\n```\n\n前面的代码执行了以下任务：\n\n- 导入 Java 包 `java.io`\n\
  - 为你想要创建的文件创建输出流\n- 创建一个 `PrintWriter` 对象，每个脚本都可以使用它来跟踪脚本执行顺序\n\n**如何为 ReportDesign.initialize\
  \ 提供代码**\n\n1. 选择 `Script` 选项卡。\n2. 在 `Outline` 中选择顶行，如图 10 所示。\n3. 在 `Script` 中选择\
  \ `initialize`。\n4. 输入代码，如图 11 所示。\n\n#### 为想要跟踪的脚本提供代码\n\n在你想要跟踪的每个脚本中，编写一条向输出文件写入文本的语句，如上一节所示：\n\
  \n```javascript\nprintWriter.println( \"Table.onRow\" );\n```\n\n首先，在 `Outline`\
  \ 中选择相应的元素。然后，从脚本列表中选择脚本。\n\n### 提供 ReportDesign.afterFactory 代码\n\n要关闭日志文件，请在 `ReportDesign.afterFactory`\
  \ 中添加以下语句：\n\n```javascript\nprintWriter.close( );\n```\n\n此方法可以刷新缓冲区并确保所有输出出现在文件中。提供\
  \ `ReportDesign.afterFactory` 代码时，选择大纲的顶行并在脚本页面选择 `afterFactory`。\n\n### 教程 1：使用\
  \ JavaScript 编写事件处理器\n\n本教程提供了编写事件处理器的说明。教程展示了一个访问 Classic Models, Inc. 示例数据库的基础报告设计。该设计包含一个带有客户名称列的表格。在教程中，你统计包含字符串\
  \ Mini 的客户名称，然后在弹出窗口中显示结果。这些事件处理器提供了同于使用聚合报告元素的功能。\n\n在本教程中，你将执行以下任务：\n\n- 创建报告设计\n\
  - 在 `Table.onCreate` 中创建计数器\n- 条件地增加计数器\n- 显示结果\n\n#### 任务 1：创建报告设计\n\n使用 Classic\
  \ Models, Inc. 示例数据库创建一个报告设计以显示客户列表。该设计出现在布局编辑器中，如图 12 所示。\n\n#### 任务 2：在 Table.onCreate\
  \ 中创建计数器\n\n为了统计包含字符串 Mini 的客户数量，首先声明一个全局计数器并将其设置为 0。`Table.onCreate` 方法是执行此任务的最佳场所，因为\
  \ `Table.onCreate` 在检索任何行之前执行。在下一个任务中，你将在 `Row.onCreate( )` 方法中条件地增加此计数器。\n\n\n\n\
  ## 图 8-14 脚本窗口\n\n![image](img/08fig14.jpg)\n\n**3** 从可用脚本列表中选择 `onCreate`。\n\n\
  **4** 在 `onCreate` 方法的脚本编辑器中输入以下代码行：\n\n```\ncountOfMinis = 0;\n```\n\n**5** 选择\
  \ `Preview` 以运行报告并验证代码没有产生任何错误。\n\n**6** 滚动到报告底部，JavaScript 错误消息将出现在此处。如果没有错误，报告将如\
  \ 图 8-15 所示。\n\n## 图 8-15 报告预览\n\n![image](img/08fig15.jpg)\n\n如果你看到错误消息，可能是语句输入错误。如果是这样，请返回脚本窗口，选择你刚刚修改的方法，纠正错误并再次选择\
  \ `Preview`。\n\n#### 任务 3：条件增加计数器\n\n为了统计名称中包含字符串 `Mini` 的客户数量，请检查每个客户的名称，每出现一次就计数器加\
  \ 1。执行此任务的逻辑位置是 `Row.onCreate` 方法，该方法会在每次从数据源检索行数据时执行。\n\n**1** 在 `Layout` 中选择 `Row`。然后选择\
  \ `Script`。\n\n**2** 从脚本窗口顶部的可用脚本列表中选择 `onCreate`，如 图 8-16 所示。\n\n## 图 8-16 脚本窗口中的\
  \ onCreate( )\n\n![image](img/08fig16.jpg)\n\n**3** 在脚本窗口中输入以下 JavaScript 代码：\n\n\
  ```\nrow=this.getRowData();\n```\n\n注意，当在此之后输入点时，会弹出一个包含所有可用方法和属性的窗口，包括 `getRowData`。此行代码获取了一个\
  \ `IRowData` 实例，该实例有一个方法 `getExpressionValue()`，用于获取行某列的内容。\n\n**4** 在第 3 步代码下方输入以下\
  \ JavaScript 代码：\n\n```javascript\nCustName=row.getExpressionValue(\"row[CUSTOMERNAME]\"\
  );\n```\n\n此行代码返回数据集中 `CUSTOMERNAME` 列对应的表格列内容。\n\n**5** 输入以下代码行来条件地增加你在任务 2 中创建的计数器：\n\
  \n```javascript\nif( CustName.indexOf(\"Mini\") != -1 ) countOfMinis += 1;\n```\n\
  \n你可以使用 JavaScript 调板在上一行中插入以下元素：\n\n* `indexOf()`\n  选择 `Native ( JavaScript )\
  \ Objects`→`String Functions`→`indexOf()`\n* `!=`\n  选择 `Operators`→`Comparison`→`!=`\n\
  * `+=`\n  选择 `Operators`→`Assignment`→`+=`\n\n**6** 选择 `Preview` 再次运行报告，以验证你输入的代码没有产生任何错误。\n\
  \n#### 任务 4：显示结果\n\n为了显示名称中包含字符串 `Mini` 的客户计数，请在处理完列表中所有行后运行的方法中插入代码。此代码的逻辑位置是 `ReportDesign.afterFactorymethod`。\n\
  \n**1** 在 `Outline` 中选择报告设计，如 图 8-17 所示。\n\n## 图 8-17 在 Outline 中选择报告设计\n\n![image](img/08fig17.jpg)\n\
  \n**2** 从脚本编辑器中的可用脚本列表中选择 `afterFactory` 方法。\n\n**3** 在 `afterFactory` 方法中输入以下代码：\n\
  \n```javascript\nimportPackage( Packages.javax.swing );\nframe = new JFrame(\"Count\
  \ of Minis = \" + countOfMinis);\nframe.setBounds(310, 220, 300, 20);\nframe.show();\n\
  ```\n\n**4** 选择 `Preview` 查看结果。如果代码没有错误，你将看到与 图 8-18 类似的报告。\n\n## 图 8-18 更改 afterFactory(\
  \ ) 方法后的的结果\n\n![image](img/08fig18.jpg)\n\n如果你没有看到 Count of Minis 窗口，请查看 Eclipse\
  \ 窗口后面。如果 Count of Minis 窗口没有出现，最可能的原因是你输入的某条代码导致了脚本错误。\n\n如果你怀疑发生了脚本错误，请滚动到报告底部所有脚本错误消息出现的地方。在大多数情况下，加号\
  \ (`+`) 旁边有一个简短的错误消息。加号表示有一个更详细的错误消息，只有在展开简短错误消息后可见。要展开简短错误消息，请选择加号。向下滚动查看更详细的错误消息。\n\
  \n### JavaScript 事件处理器示例\n\n以下示例说明了你可以使用 JavaScript 事件处理器执行的一些常用函数。\n\n#### JavaScript\
  \ onPrepare 示例\n\n`onPrepare` 事件在生成过程的准备阶段为所有报告元素触发。该位置非常适合在生成单个报告项目实例之前更改特定报告元素的设计。\n\
  \n例如，BIRT 支持表格和列表中的分组。为了允许用户对数据进行分组，你可以通过以下开发任务来实现此功能：\n\n* 向表格添加一个组\n* 在报告的大纲视图中选择组\n\
  * 创建一个更改组定义的 `onPrepare` 脚本\n\nListing 8-21 按国家或城市对表格进行分组。\n\n\n\n\n内容的渲染可能在生成后的任何时间发生。用户通常会运行报告并以不同的格式对其进行多次渲染。`onRender`\
  \ 事件支持在渲染时进行某些自定义。例如，用户可能希望页面页脚中的标签显示报告的渲染时间或报告渲染时的当月几几。你可以通过使用标签元素的 `onRender`\
  \ 方法来实现这种效果，如下脚本所示：\n\n```javascript\nimportPackage( Packages.java.util );\n\ncl\
  \ = new GregorianCalendar( );\n\nthis.text = cl.get( Calendar.DAY_OF_MONTH );\n\
  ```\n\n## 交叉表脚本示例\n\n交叉表（Cross tabs）支持编写事件脚本。与其他报告项目一样，交叉表支持 `onPrepare`、`onCreate`\
  \ 和 `onRender` 事件。这些事件中的每一个都支持为交叉表或交叉表单元格编写处理程序。在为交叉表单元格实现 `onCreate` 事件时，处理程序会接收一个\
  \ `cellInst` 对象。该对象是单元格对象的实例，提供了用于确定单元格属性的方法。例如，开发者可以调用 `cellInst.getCellType(`。该方法返回\
  \ `aggregation`（聚合）或 `header`（表头），代表交叉表。使用 `cellInst.getCellID()` 来确定正在处理哪个特定的设计时单元格。该方法返回在单元格常规属性中定义的元素\
  \ ID（Element ID）。`cellInst` 对象还提供了一个方法 `getDataValue`，它返回单元格创建时交叉表绑定的特定值。`getStyle()`\
  \ 方法支持自定义特定单元格的外观。以下脚本说明了使用这些方法的机制。\n\n列表 8-25 中的脚本将针对行表头单元格或列表头单元格执行。随后，脚本会检查特定单元格的维度值是否等于\
  \ `Planes`。如果是，则将背景设置为红色并将字体大小设置为 12。所有其他表头单元格被设置为黄色。\n\n接下来检查单元格 ID，如果元素 ID 为 24，则将单元格背景颜色设置为橙色（Orange）。\n\
  \n**列表 8-25** 设置交叉表表头单元格属性\n\n```javascript\nfunction onCreateCell( cellInst, reportContext\
  \ )\n{\n   //可以通过类型或 id 引用单元格 - 有效类型 \"header\" 或\n   \"aggregation\"\n   if( cellInst.getCellType()\
  \ == \"header\" ) {\n      //获取数据值，查看交叉表上的绑定标签\n      if( cellInst.getDataValue(\"\
  PRODUCTLINE\") == \"Planes\" ){\n             cellInst.getStyle().setBackgroundColor(\"\
  #FF0000\");\n             cellInst.getStyle().setFontSize(\"12\");\n      }else{\n\
  \         //将其余部分设置为黄色\n         cellInst.getStyle().setBackgroundColor(\"#FFFF00\"\
  );\n         cellInst.getStyle().setFontSize(\"12\");\n      }\n   }\n   //引用交叉表表头\n\
  \   if( cellInst.getCellID() == 24){\n      cellInst.getStyle().setBackgroundColor(\"\
  Orange\");\n   }\n}\n```\n\n列表 8-26 中的脚本继续了 列表 8-25 中的 `onCreateCell` 脚本，处理了构成交叉表大部分部分的聚合元素的颜色设置。首先，如果产品线是\
  \ `Planes`，则单元格背景颜色设置为蓝灰色。此设置确保特定行或列中对应产品线 `Planes` 值的所有单元格显示为蓝灰色。因此，如果产品线维度在列级，则特定列显示为蓝灰色；如果产品维度在行级，则特定行显示为蓝灰色。最后，如果数值大于\
  \ 50000，则单元格背景颜色设置为绿色，字体设置为白色。在此示例中，你可以使用 `getDataValue` 来检索在交叉表绑定标签页定义的定义的绑定值。\n\
  \n**列表 8-26** 设置聚合单元格属性\n\n```javascript\n   if( cellInst.getCellType() == \"aggregation\"\
  ){\n      //可以使用 getDataValue 引用值或\n      if( cellInst.getDataValue(\"PRODUCTLINE\"\
  ) == \"Planes\" ){\n         //将颜色设置为蓝灰色\n   cellInst.getStyle().setBackgroundColor(\"\
  RGB(169,170,226)\");\n      }\n      }\n```\n\n### 从 JavaScript 调用 Java\n\nRhino\
  \ 与 Java 类提供了极佳的集成，支持 BIRT 脚本与用 Java 编写的业务逻辑无缝协作。使用 JavaScript 包装意味着开发者可以利用现有 Java\
  \ 代码的内部和外部库。\n\n### 调用 Java\n\n#### 理解 `Packages` 对象\n\n`Packages` 对象是访问 Java 类的\
  \ JavaScript 网关。它是一个顶层 Rhino 对象，包含每个顶层 Java 包的属性，如 `java` 和 `com`。`Packages` 对象包含其在类路径（classpath）中找到的每个包的属性。通过在类名前加上\
  \ `Packages` 来访问 `Packages` 具有该类属性的 Java 类，如下语句所示：\n\n```javascript\nvar nc = new\
  \ Packages.javax.swing.JFrame( \"MyFrame );\n```\n\n你也可以使用 `Packages` 对象来引用不属于任何包的\
  \ Java 类，如下语句所示：\n\n```javascript\nvar nc = new Packages.NumberConversion( );\n\
  ```\n\n为了让 BIRT 找到自定义的 Java 类或包，文件必须位于类路径中，本章稍后会讨论。\n\n#### 理解 `importPackage` 方法\n\
  \n你可以通过顶层 Rhino 方法 `importPackage()` 避免编写 Java 类的全限定引用。`importPackage()` 方法的功能类似于\
  \ Java 的 import 语句。使用 `importPackage()` 方法指定一个或多个包含你需要访问的 Java 类的包，如下语句所示：\n\n```javascript\n\
  importPackage( Packages.java.io, Packages.javax.swing );\n```\n\n你必须在每个包名前前加上 `Packages`。在\
  \ BIRT 第一次执行包含 `importPackage()` 方法的方法后，指定的包将对所有后续脚本可用。因此，请将 `importPackage()` 方法包含在\
  \ `ReportDesign.initialize` 脚本中，这是 BIRT 始终执行的第一个脚本。\n\n\n\n\nJava 隐式导入了 `java.lang.*`。相反，Rhino\
  \ 不会隐式导入 `java.lang.*`，因为 JavaScript 有几个与 `java.lang` 包中定义的某些类同名的顶层对象。这些类包括 `Boolean`、`Math`、`Number`、`Object`\
  \ 和 `String`。导入 `java.lang` 会与同名的 JavaScript 对象发生名称冲突。出于因此，请避免使用 `importPackage()`\
  \ 来导入 `java.lang`。\n\n#### 使用 Java 类\n\n要在 BIRT 脚本中使用 Java 类，请将一个 JavaScript 对象赋值为\
  \ Java 对象。然后，在 JavaScript 对象上调用 Java 类的方法。代码列表 8-27 创建了一个 Java Swing 框架，并将名为 `frame`\
  \ 的 JavaScript 对象设置为 Java `JFrame` 对象。然后，代码直接在 JavaScript 对象上调用 `setBounds()` 和\
  \ `show()` 方法。\n\n**代码列表 8-27** 在 JavaScript 对象上调用 Java 方法\n\n* * *\n\n```\nimportPackage(\
  \ Packages.javax.swing );\n\nframe = new JFrame( \"My Frame\" );\n\nframe.setBounds(\
  \ 300, 300, 300, 20 );\n\nframe.show( );\n```\n\n此代码示例的效果是在你的桌面上显示一个标题为 \"My Frame\"\
  \ 的 Java 窗口。此代码示例仅在 BIRT Report Designer 中有效。\n\n#### 放置 Java 类\n\n为了让 BIRT 报告查看器找到\
  \ Java 类，类必须位于以下文件夹：\n\n`$ECLIPSE_INSTALL\\plugins org.eclipse.birt.report`\n`.viewer_*\\\
  birt\\WEB-INF\\classes`\n\n或者，将类打包为 JAR 文件并放入：\n\n`$ECLIPSE_INSTALL\\plugins org.eclipse.birt.report`\n\
  `.viewer_*\\birt\\scriptlib`\n\nBIRT Report Designer 还会查找与报告项目在同一工作区内的 Java 项目中的类。可以使用报告的资源属性选项卡，将额外的\
  \ JAR 文件附加到特定的报告。\n\n如果你将示例查看器（Viewer）部署到应用程序服务器，你还必须将这些类或 JAR 文件部署到运行时环境中，除非这些\
  \ JAR 文件已经存在于应用程序的类路径中。\n\n将事件处理程序和 Java 类放置在 Web 查看器应用程序的 `web.xml` 中定义的 `SCRIPTLIB`\
  \ 目录。如果使用 `SCRIPTLIB` 目录，类必须是 JAR 格式。\n\n如果你在使用报告引擎 API，类必须在类路径中。或者，使用报告引擎添加到类路径的系统变量，如下所示：\n\
  \n```\nSystem.setProperty( EngineConstants.WEBAPP_CLASSPATH_KEY, \"c:/myjars/class.jar\"\
  \ );\n```\n\n如果你在使用报告引擎 API，可以通过在应用上下文中设置 `APPCONTEXT_CLASSLOADER_KEY` 来设置引擎的父类加载器，如代码列表\
  \ 8-28 所示：\n\n**代码列表 8-28** 为报告引擎设置父类加载器\n\n* * *\n\n```\nconfig = new EngineConfig(\
  \ );\n\nHashMap hm = config.getAppContext( );\n\nhm.put( EngineConstants.APPCONTEXT_CLASSLOADER_KEY,\
  \ YourClass.class.getClassLoader( ); );\n\nconfig.setAppContext( hm );\n```\n\n\
  设置应用上下文类加载器支持报告脚本访问父类加载器中的对象。\n\n## 在 JavaScript 代码中使用 Java 的问题\n\n编写 Java 代码有很多细微差别，例如如何处理重载方法以及如何使用接口。有关这些主题的更多信息，请参阅\
  \ Rhino 关于脚本 Java 的页面：[`www.mozilla.org/rhino/ScriptingJava.html`](http://www.mozilla.org/rhino/ScriptingJava.html)。\n\
  \n## 调用插件中类的方法\n\nJava 和 JavaScript 事件处理程序都可以访问存在于 Eclipse 插件中的任何类的所有公共方法。该插件可以是\
  \ Eclipse 核心插件之一、第三方提供的插件，或者你创建的插件之一。只要该插件在运行时对 BIRT 报告可用，BIRT 脚本就可以访问该插件内所有类的所有公共方法。\n\
  \n代码列表 8-29 显示了如何调用位于 Eclipse 插件中的 Java 类的方法：\n\n**代码列表 8-29** 使用 JavaScript 访问\
  \ Eclipse 插件中 Java 类的方法\n\n* * *\n\n```\nimportPackage( Packages.org.eclipse.core.runtime\
  \ );\n\nmybundle = Platform.getBundle( \"org.eclipse.myCorp.security\" );\n\nvalidateClass\
  \ = mybundle.loadClass( \"org.eclipse.myCorp.security.Validate\" );\n\nvalidateInstance\
  \ = validateClass.newInstance( );\n\nvar password = validateInstance.getPass( loginID\
  \ );\n```\n\n在示例中，第一条语句使 Eclipse 核心包 `org.eclipse.core.runtime` 可 JavaScript JavaScript\
  \ 代码。该包包含两个类 `Platform` 和 `Bundle`，脚本的其他部分需要这些类。\n\n`Platform` 类包含一个静态方法 `getBundle()`，它返回一个\
  \ `Bundle` 对象。`getBundle()` 的唯一参数是包含目标类的插件名称。\n\n`Bundle` 类包含一个 `loadClass()` 方法，它返回一个\
  \ `java.lang.Class` 对象。\n\n\n\n\n`\\WebViewerExample\\WEB-INF\\lib` 目录下的所有 JAR 文件都在部署的报告类路径中，因此\
  \ `scriptapi.jar` 在运行时是可以访问的。要在开发阶段使用 `scriptapi.jar` 文件，请下载报告引擎并从构建路径内部引用 `scriptapi.jar`。\n\
  \n所需的 JAR 文件也位于 BIRT 报告引擎的 `ReportEngine\\lib` 目录中。如果您使用报告引擎 API 运行报告，请将该目录下的 JAR\
  \ 文件添加到类路径和构建路径中。如果您在 Eclipse 应用程序中使用报告引擎插件，则不需要此此步骤，因为插件已经包含了依赖项和类路径条。\n\n### 扩展适配器类\n\
  \n元素适配器类（element adapter class）实现了元素接口并为每个方法提供了空存根。要使用该适配器类，请扩展该适配器类并重写您要提供处理代码的方法。Eclipse\
  \ 建议扩展适配器类而不是直接实现接口。\n\n关于事件处理程序接口和适配器类的 BIRT 命名规范将在本章稍后部分讨论。\n\n## 如何创建事件处理程序类并将其添加到\
  \ Java 项目\n\n本节描述了如何使用 Eclipse Java 开发环境为可脚本 BIRT 元素创建事件处理程序类。这些步骤假设 Java 视图已打开，且工作区中存在一个\
