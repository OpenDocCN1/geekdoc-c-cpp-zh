  \ 设置在应用程序上下文中可以指定驱动程序。\n\n\n\n\n\n# 使用此对象方法\n\n`this` 对象代表事件处理程序处理的元素。要使用 `this`\
  \ 对象，请在事件处理程序的脚本窗口中输入关键字 `this`，后跟一个点号。当你输入点号时，会出现一个包含该元素所有属性和函数的滚动列表，如图图 8-2 所示。\n\
