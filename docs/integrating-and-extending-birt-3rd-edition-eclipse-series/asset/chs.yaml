  \n图 22-10 显示了带有 BIRT Web Viewer 页面提示的报告，例如，“Showing page”显示西班牙语“Mostrando página”。\n\
  \n**图 22-10** 使用西班牙语 NL1 设置的 Web Viewer\n\n![image](img/22fig10.jpg)\n\n`NLS` 语言包仅配置\
  \ `BIRT Report Designer` 和 `Viewer` 用户界面的元素。例如，在图 22-9 和图 22-10 中，报告设计和输出中的元素（如表格标题和列名）是用户定义的，不属于\
  \ `NL1` 语言包配置的一部分。\n\n## 第 23 章。开发图表扩展\n\n本章讨论了向 `BIRT` 图表引擎添加新图表类型的过程。`BIRT` 图表引擎提供了一个雷达图作为构建新图表类型的示例。本章描述了如何创建此雷达图示例。\n\
  \n雷达图（也称为蜘蛛网图）使用等距半径按比例显示多个数据点。这种图表类型允许同时比较系列中的多个数据点。每个数据点的值决定了每个半径的大小。\n\n图表中的数据点数量决定了径向线的数量。数据点之间可以用线连接（第一个和最后一个数据点除外），或者可以将所有线连接起来并填充空间以形成多边形。\n\
  \n雷达图的背景可以是空白、圆形或多边形。某些图表生成器支持额外的背景类型，但以下示例仅支持这三种背景，如图 23-1 和图 23-2 所示。\n\n**图 23-1**\
  \ 可能的雷达图图像\n\n![image](img/23fig01.jpg)\n\n**图 23-2** 更多可能的雷达图图像\n\n![image](img/23fig02.jpg)\n\
  \n本文介绍的雷达图示例使用了版本 2.6 `BIRT` 图表引擎。\n\n### 关于 BIRT 图表扩展\n\n图表引擎与 `BIRT` 中的大多数组件一样，定义了用于添加新功能的扩展点。表\
  \ 23-1 是主要扩展点的部分列表，并带有简要描述。\n\n**表 23-1** BIRT 图表扩展\n\n![image](img/23tab01.jpg)\n\
  \n![image](img/23tab01.jpg)\n\n雷达图示例实现了表 23-1 中描述的某些扩展点。该示例为每个数据点使用类别和值，因此不需要对单个点进行特殊处理，例如，在图表中。该示例的实现需要两个插件。第一个插件实现了设计时向导中的用户界面，如图\
  \ 23-3 所示。第二个插件实现了出现在渲染文档中的雷达图运行时版本。\n\n**图 23-3** 查看雷达系列\n\n![image](img/23fig03.jpg)\n\
  \n雷达图示例需要 `org.eclipse.birt.chart.engine.datasetprocessors` 的默认实现，因为这种图表类型的数据是不唯一的。该示例还添加了一个新图表类型，这需要实现\
  \ `org.eclipse.birt.chart.ui.types` 和 `org.eclipse.birt.chart.engine.charttypes`\
  \ 扩展点。\n\n示例实现了 `org.eclipse.birt.chart.engine.modelrenderers` 点以执行绘制，并实现了 `org.eclipse.birt.chart.ui.seriescomposites`\
  \ 点以为图表构建器实现雷达图特定的系列。\n\n该示例实现了表 23-2 中列出的以下扩展点。\n\n**表 23-2** BIRT 雷达源插件\n\n![image](img/23tab02.jpg)\n\
  \n注意，这些插件包含了其他图表示例。例如，`org.eclipse.birt.chart.examples` 包含了图表引擎 API 示例。\n\n### 设置构建环境\n\
  \n示例需要初始工作空间设置。图表引擎使用 `XSD` SDK 生成 `EMF` 模型。该示例需要 `BIRT` 图表引擎插件。这些组件必须存在于环境中。从 `http://www.eclipse.org/downloads`\
  \ 下载适用于 Java 和报告开发人员的 `Eclipse IDE` 获取所需的插件。将下载的文件解压到合适的位置，并启动 `\\eclipse` 目录下的\
  \ `eclipse.exe`。创建一个新工作空间并提供名称，例如 `C:\\work\\workspaces\\2.6workspace\\examplechart`。接下来，手动添加\
  \ `EMF` 和 `XSD` 插件，或使用更新管理器。要使用更新管理器，选择 `Help→Install New Software`，如图 23-4 所示。\n\
  \n**图 23-4** 使用更新管理器安装新软件\n\n![image](img/23fig04.jpg)\n\n在 Install 中，在 Work with\
  \ 中选择一个更新站点。例如，选择 `Helios` - `http://download.eclipse.org/releases/helios`。在可用更新列表中，展开\
  \ `Modeling` 并选择 `EMF – Eclipse Modeling Framework SDK` 和 `XSD – XML Schema Definition\
  \ SDK` 项目，如图 23-5 所示。\n\n**图 23-5** 选择更新站点以及 EMF 和 XSD 项目\n\n![image](img/23fig05.jpg)\n\
  \n选择 `Next`。安装将计算依赖关系并呈现要安装项的摘要，如图 23-6 所示。\n\n**图 23-6** 要安装的建模组件\n\n![image](img/23fig06.jpg)\n\
  \n选择 `Next`，接受许可，然后选择 `Finish`。\n\n在下载 `EMF` 和 `XSD` 插件后，重启 `Eclipse`。然后，按照下节所述创建一个新的插件项目。\n\
  \n### 扩展图表模型\n\n设置好工作空间后，你可以开发新的图表类型。如前所述，`BIRT` 使用 `XSD` 文件来定义图表模型。这些 `XSD` 文件位于\
  \ `org.elcipse.birt.chart.engine` 插件中。你可以从 `CVS` 下载该插件或从源码下载获取。从上来说，只需要 `xsd` 目录和现有的\
  \ `EMF` 模型，尽管为了调试目的拥有图表引擎源码是有用的。\n\n图表引擎插件中的 `xsd` 目录包含架构文件，如表 23-3 中列出的。这些架构满足其他图表元素（如数据类型）的所有要求。雷达图只需要扩展类型架构。\n\
  \n**表 23-3** 图表引擎插件中的 XSD 架构文件\n\n![image](img/23fig03.jpg)\n\n图 23-7 显示了新的雷达图类型以及雷达系列所需的类型架构设置。例如，布尔值\
  \ `FillPolys` 决定了雷达图中绘制的多边形是否填充。\n\n**图 23-7** 查看雷达图类型的架构\n\n![image](img/23fig07.jpg)\n\
  \n该图类型架构及其架构文件的示例是名为 `radar.xsd` 的文件，它位于 `org.eclipse.birt.chart.examples.core`\
  \ 插件的 `org.eclipse.birt.chart.examples.radar.model` 包中。\n\n在架构文件中，`xsd:import` 语句使用以下代码从图表引擎导入现有的架构文件，例如类型架构：\n\
  \n```xml\n<xsd:import namespace=\"http://www.birt.eclipse.org/ChartModelType\"\n\
  schemaLocation=\"../../../../../../../\norg.eclipse.birt.chart.engine/xsd/type.xsd\"\
  />\n```\n\n创建一个插件项目。然后在项目中创建一个用于模型的文件夹或包。下一步是根据架构为系列创建一个 `EMF` 模型。要创建 `EMF Generator\
  \ Model`，选择 `File→New→Other`。在 New 中，展开 `Eclipse Modeling Framework` 并选择 `EMF Generator\
  \ Model`，如图 23-8 所示。\n\n**图 23-8** 选择 EMF 生成器模型\n\n\n\n\n\n![image](img/23fig08.jpg)\n\
  \n点击“下一步”（Next）。为模型类输入一个名称。在图 23-9 所示的雷达示例中，模型位于 `org.eclipse.birt.chart.examples.radar.model`\
  \ 包。\n\n**图 23-9** 为雷达系列类型创建 EMF 模型\n\n![image](img/23fig09.jpg)\n\n点击“下一步”（Next）。选择\
  \ XML Schema 作为模型导入器，如图 23-10 所示。\n\n**图 23-10** 为雷达系列类型创建 XML 架构\n\n![image](img/23fig10.jpg)\n\
  \n点击“下一步”（Next）。向导提示用于创建模型时要使用的架构文件位置。选择“浏览工作区”（Browse Workspace）并选择之前创建的 `XSD`\
  \ 文件，如图 23-11 所示。\n\n**图 23-11** 选择架构文件的位置\n\n![image](img/23fig11.jpg)\n\n点击“确定”（OK）。`XSD`\
  \ 文件将出现在向导中，如图 23-12 所示。\n\n**图 23-12** 检查架构文件的位置\n\n![image](img/23fig12.jpg)\n\
  \n点击“下一步”（Next）。在“包选择”（Package Selection）中，选择新类型的所在包，在雷达示例中，该包为 `org.actuate.birt.radar.chart.model.type`。你也可以更改\
  \ `ecore` 文件的名称。图 23-13 中的示例显示文件名已更改为 `radar.ecore`。\n\n**图 23-13** 选择新类型\n\n![image](img/23fig13.jpg)\n\
  \n要引用现有图表模型，选择“添加”（Add）。在“文件选择”（File Selection）中，选择要引用的生成器模型，如图 23-14 所示。现有的生成器模型位于图表插件的\
  \ `src/model` 目录下。\n\n**图 23-14** 选择新的 EMF 生成器模型\n\n![image](img/23fig14.jpg)\n\n\
  完成这些步骤后，“新建 EMF 生成器模型”（New EMF Generator Model）将显示所有引用的图表模型包以及要创建的新类型的根包，如图 23-15\
  \ 所示。\n\n**图 23-15** 选择新的 EMF 生成器模型\n\n![image](img/23fig15.jpg)\n\n点击“完成”（Finish）。此操作将创建\
  \ `genmodel` 和 `ecore` 文件。\n\n要更改模型，请修改 `XSD` 文件并重新加载模型。要执行此任务，右键点击 `genmodel` 文件并选择“重载”（Reload）。要根据此模型生成源代码，右键点击\
  \ `genmodel` 并选择“用 EMF 生成器打开”（Open with EMF Generator）。接下来，右键点击顶层节点并选择“生成模型代码”（Generate\
  \ Model Code），如图 23-16 所示。\n\n**图 23-16** 选择生成模型代码\n\n![image](img/23fig16.jpg)\n\
  \n这些操作生成了操作模型的基础代码。请注意，Eclipse 使用架构中定义的 `targetNamespace` 属性来构建包名，如下例所示：\n\n```\n\
  targetNamespace=\"http://www.birt.eclipse.org/RadarChartModelType\"\n```\n\n在雷达示例中，这些包已经过重构以使用更合适的名称。\n\
  \n### 完成新的 SeriesImpl\n\n在创建了操作模型的基础代码后，实现创建序列的扩展。首先，向新创建的 `SeriesImpl` 类添加方法。在本例中，该类为\
  \ `RadarSeriesImpl`。\n\n尽管 EMF 提供了大部分所需的代码，但 `org.eclipse.birt.chart.model.component.Series`\
  \ 接口中的有几个方法可能需要手动编写。这些方法包括 `canBeStacked`（用于确定多个相同类型的系列是否可以堆叠）以及 `canParticipateInCombination`（用于确定图表类型是否可以参与组合图表）。在大多数情况下（如本例所示），默认实现提供了足够的功能，不需要自定义实现。\n\
  \n通常需要实现 `getDisplayName()` 方法，该方法为图表返回一个用户友好的字符串名称。在示例中，`org.eclipse.birt.chart.examples.radar.i18n`\
  \ 包处理所有消息。\n\n以下代码实现了雷达图中的 `getDisplayName()` 方法：\n\n```java\npublic String getDisplayName(\
  \ )\n{\n    return Messages.getString( \"RadarSeriesImpl.displayName\" );\n}\n```\n\
  \n此类还需要重写新 `SeriesImpl` 类中的几个方法。第一个是 `create()` 方法，它允许创建并初始化 `SeriesImpl` 类的实例，如下代码所示：\n\
