  \ );\n  ( (RadarSeriesImpl) se ).initialize( );\n  return se;\n}\n```\n\n在添加 `create()`\
  \ 方法时，请确保 `genmodel` 文件来自 `org.eclipse.birt.chart.examples.radar.model.type`。\n\n\
  第二个方法是 `initialize()` 方法。在示例中，该方法设置序列的属性，如图 23-1 所示。\n\n**图 23-1** initialize 方法\n\
