  \n# 第一部分：安装与部署 BIRT\n\n![image](img/part-opener-01.jpg)\n\n## 第 1 章：介绍 BIRT 报告设计器\n\
  \n有两种设计应用程序可以创建 `BIRT` 报告：\n\n### BIRT Report Designer\n\n报告开发者用于构建 `BIRT` 报告设计并预览报告的工具。BIRT\
  \ Report Designer 是一组 Eclipse 插件，包含了 BIRT 报告引擎、BIRT 图表引擎和 BIRT 演示数据库。该工具支持 `Java`\
  \ 和 `JavaScript` 定制。BIRT Report Designer 需要多个 Eclipse 平台组件和 Java 开发包（`JDK`）。\n\n\
  ### BIRT RCP Report Designer\n\n\n\n\n\n供初级报告开发者用于构建 BIRT 报告设计和预览报告的简化工具。BIRT RCP（富客户端平台）报告设计器包含了\
  \ BIRT 报表引擎、BIRT 图表引擎和 BIRT 演示数据库，而没有完整 Eclipse 平台带来的额外开销。该工具支持 JavaScript 自定义，但不支持\
  \ Java 自定义或调试。\n\n#### 理解 BIRT 组件\n\nBIRT 报告设计器 2.6 包含以下组件：\n\n- Eclipse 软件开发包 (`SDK`)\
  \ 3.6\n`SDK` 是一个支持开发 Eclipse 平台插件和扩展的框架。`SDK` 包含了核心平台、Java 开发工具 (`JDT`) 和插件开发环境\
  \ (`PDE`)。\n\n- 数据工具平台 (`DTP`) 1.8.0\n`DTP` 是一组开发工具，用于开发访问数据源并检索数据的插件。\n\n- Eclipse\
  \ 建模框架 (`EMF`） 2.6.0\n`EMF` 支持 BIRT 图表的开发。`EMF` 包含了服务数据对象 (`SDO`)，它是一种图结构数据对象，支持将对图的更改应用回数据源。\n\
  \n- 图形编辑框架 (`GEF`) 3.6.0\n`GEF` 是 BIRT 报告设计器用户界面所需的 Eclipse 插件。该框架为运行在 Eclipse 平台上的应用程序提供丰富、一致的图形化编辑环境。\n\
  \n- Eclipse Web 工具平台 (`WTP`) 3.2\n`WTP` 是一组 Eclipse 插件，支持将 BIRT 报告查看器部署到应用程序服务器。该包包含了源码和图形化编辑器、工具、向导以及支持部署、运行和测试的\
  \ API。\n\n#### 理解 Eclipse BIRT 程序包\n\nEclipse BIRT 提供以下包。这些包不包含所需的 Java 1.5 JDK。\n\
  \n- 报告设计器全版 Eclipse 安装（合一版）\n包含 BIRT 和 Eclipse 集成开发环境 (`IDE`)。这种合一安装是安装 BIRT 最简单的方法。\n\
  \n- 报告设计器\n仅包含 BIRT，用于安装在现有的 Eclipse 集成开发环境 (`IDE`) 中。\n\n- RCP 报告设计器\n包含不带 Eclipse\
  \ `IDE` 的简化版 BIRT。\n\n- 软件开发包 (`SDK`)\n包含 BIRT 插件的源代码、文档和示例。\n\n- 报表引擎\n包含用于安装在\
  \ J2EE 应用程序服务器中的 BIRT 运行时版本。\n\n- 图表引擎\n包含支持在 Java 应用程序中嵌入图表的独立库。\n\n- BIRT Web\
  \ 工具集成\n包含在 Web 工具项目中使用 BIRT Web 项目向导所需的插件，包括源代码。\n\n- BIRT 源代码\n包含特定构建版本的 BIRT\
  \ 源代码。所有源代码均为插件格式，已准备好导入到工作空间以构建 BIRT。这些插件是标准 BIRT 安装所需的库。可能需要额外的库。例如，此包不包含数据工具平台\
  \ (`DTP`) 的源代码。\n\n- BIRT 示例\n包含示例报告和图表，以及使用图表引擎、报表引擎和设计引擎 API 的应用程序示例。\n\n- BIRT\
  \ 演示数据库\n包含用于将演示数据库定义并加载到 Apache Derby 和 MySQL 中的包，包括 SQL 和数据文件。演示数据库包是在 Apache\
  \ Derby 和 MySQL 系统中安装 Classic Models 数据库架构和数据的方便方法。该包不包含任何 BIRT 软件。报告设计器和 RCP 报告设计器包包含适用于\
  \ Apache Derby 的演示数据库。\n\n演示数据库支持以下 Apache 和 MySQL 版本：\n\n- Apache Derby 版本 5.1\
  \ 或更高\n- MySQL Connector/J 版本 3.1 或 MySQL 客户端版本 4.x\n\n##### 关于 BIRT 构建的类型\n\nEclipse\
  \ BIRT 下载网站为 BIRT 提供多种类型的构建。以下列表描述了这些构建：\n\n- 发布构建 (Release build)\n生产级构建，通过了所有组件和功能的完整测试套件。使用发布构建来开发应用程序。\n\
  \n- 里程碑构建 (Milestone build)\n开发构建，提供了新完成的功能。该构建是稳定的，但尚未达到生产质量。使用此类构建来预览新功能，并开发依赖这些功能的未来报告应用程序。\n\
  \n- 稳定构建 (Stable build)\n稳定的开发构建，但通过了简化的测试套件。新功能处于开发的中间阶段。使用稳定构建预览新功能。\n\n- 每日构建\
  \ (Nightly build)\nEclipse BIRT 开发团队每晚构建一次 BIRT。由于 BIRT 是一个开源项目，任何人都可以获取这些构建。这些构建对报告开发者可能没有用处。\n\
  \n如果您需要的某个功能在每日构建中无法工作，可以通过提交 bug 报告向开发团队提供反馈。稍后，您可以下载新构建以确认修复程序解决了您报告的问题。\n\n###\
  \ 第 2 章 安装 BIRT 报告设计器\n\n安装 BIRT 报告设计器会为 Eclipse 集成开发环境 (`IDE`) 添加报告设计视图。要安装 BIRT\
  \ 报告设计器，请从 Eclipse 网站下载压缩包并将其提取到现有的 Eclipse 环境中。BIRT 报告设计器适用于多种 Linux 和 Microsoft\
  \ Windows 平台。以下章节介绍了如何安装 BIRT Release 2.6。\n\n## 安装 BIRT 报告设计器全版 Eclipse 安装\n\n\
  如果您是 Eclipse 和 BIRT 的新手，请下载并安装 BIRT 报告设计器全版 Eclipse 安装（合一版），以便开始开发和设计 BIRT 报告。该包包含了\
  \ Eclipse 集成开发环境 (`IDE`)、BIRT 报告设计器以及所有其他所需的 Eclipse 组件。您必须下载并安装 Java JDK 1.5。\n\
  \n按照以下步骤在 Windows 或 Linux 系统上下载此安装包。\n\n### 如何安装 BIRT 报告设计器合一版\n\n1. 使用浏览器访问 BIRT\
  \ 主页：`http://www.eclipse.org/birt/phoenix`\n2. 从 BIRT 项目中，选择下载 BIRT 2.6。\n3. 从 BIRT\
  \ 报告下载中，选择合一版。\n4. 在 BIRT 报告下载中，选择符合要求的下载链接，例如 Windows 64 位。Eclipse 下载 - 镜像选择出现。此页面显示提供此下载文件的所有站点。\n\
  5. 选择距离您最近的下载站点。BIRT 报告设计器合一版压缩包下载到您的系统。\n6. 将压缩包提取到您指定的硬盘位置。提取操作将在您指定的位置创建一个名为\
  \ `eclipse` 的目录。\n\n要测试 BIRT 报告设计器的安装，请启动 Eclipse，然后按照下面的步骤启动 BIRT 报告设计器。BIRT 报告设计器是\
  \ Eclipse 中的一个视图。\n\n### 如何测试 BIRT 报告设计器安装\n\n1. 启动 Eclipse。\n2. 关闭欢迎窗口。在 Eclipse\
  \ 窗口菜单中，选择打开视图→报告设计。如果“报告设计”没有出现在打开视图窗口中，选择其他。出现视图列表。选择“报告设计”。\n\nEclipse 显示 BIRT\
  \ 报告设计器视图。\n\n#### 安装 BIRT RCP 报告设计器\n\nBIRT RCP 报告设计器是一个独立的报告设计应用程序，使报告开发者能够生成\
  \ Web 和 PDF 格式的报告。该应用程序使用 Eclipse 富客户端平台 (`RCP`) 提供比完整 Eclipse 平台更不复杂的报告设计环境。如果您需要完整\
  \ Eclipse 平台提供的项目化环境，请返回安装 BIRT 报告设计器的章节。BIRT RCP 报告设计器仅在 Windows 上运行。\n\n\n\n\n\
  要安装 BIRT RCP Report Designer，请下载并解压压缩包。以下示例使用 Release 2.6 版本。\n\n按照以下步骤在 Windows\
  \ 系统上下载并安装 BIRT RCP Report Designer。\n\n## 如何安装 BIRT RCP Report Designer\n\n1. 使用浏览器，导航到\
  \ BIRT 主页面：[`http://www.eclipse.org/birt/phoenix`](http://www.eclipse.org/birt/phoenix)\n\
  \n2. 在 BIRT Home（首页）中选择 Download 2.6。\n\n3. 在 BIRT Report Downloads（报告下载）中选择 RCP\
  \ Designer。\n\n出现 Eclipse 下载 -镜像选择页面。此页面显示所有提供该下载文件的站点。\n\n4. 选择距离您地理位置最近的下载站点。\n\
  \nBIRT RCP Report Designer 压缩包将下载到您的系统。\n\n5. 将压缩包解压到您指定的硬盘位置。\n\n解压过程会在您指定的位置创建一个名为\
  \ `birt-rcp-report-designer-2_6_0` 的目录。\n\n要测试安装情况，请按照后续步骤启动 BIRT RCP Report Designer。\n\
  \n## 如何测试 BIRT RCP Report Designer 安装\n\n1. 导航到 `birt-rcp-report-designer-2_6_0`\
  \ 目录。\n\n2. 要运行 BIRT RCP Report Designer，双击 `BIRT.exe`。BIRT RCP Report Designer\
  \ 将出现。\n\n### 安装问题排排除\n\n安装 BIRT 报告设计器是一项简单的任务。如果您将压缩包解压到适当的位置，并且预期位置存在所需的辅助文件，您的\
  \ BIRT 报告设计器即可工作。排排除安装问题的要步骤之一是确认所有文件都在正确的位置。\n\n验证 `/eclipse/plugins` 目录是否包含以 `org.eclipse.birt`、`org.eclipse.emf`\
  \ 和 `org.eclipse.gef` 开头的 JAR 文件。后续章节描述了解决两种常见安装错误的排排除步骤。\n\n#### 在安装 BIRT 报告设计器后避免缓存冲突\n\
  \nEclipse 会缓存插件信息以加快启动速度。在安装或升级 BIRT Report Designer 或 BIRT RCP Report Designer\
  \ 之后，使用某些页面的缓存副本会导致错误或功能缺失。该问题的症状包括以下情况：\n\n• Eclipse 中没有出现 Report Design（报告设计）视图。\n\
  \n• 在打开报告或使用 Report Design 视图时，收到发生错误的消息。\n\n• 您安装的 JDBC 驱动程序未出现在驱动管理器中。\n\n解决方案是移除缓存信息。建议的做法是从命令行使用\
  \ `-clean` 选项启动 Eclipse 或 BIRT RCP Report Designer。\n\n启动 Eclipse 请使用以下命令：\n\n```\n\
  eclipse.exe -clean\n```\n\n启动 BIRT RCP Report Designer 请使用以下命令：\n\n```\nBIRT.exe\
  \ -clean\n```\n\n#### 在启动 BIRT 报告设计器时指定 Java 虚拟机\n\n在启动 BIRT 报告设计器时，您可以指定要使用的 Java\
  \ 虚拟机 (JVM)。此指定非常重要，特别是对于 Linux 用户，因为路径和权限问题可能导致报告设计器无法找到合适的 JVM。克服此类问题的快速方法是在启动\
  \ BIRT 报告设计器时显式指定要使用的 JVM。\n\n在 Windows 和 Linux 系统上，您可以从命令行启动 BIRT 报告设计器，或者创建一个命令文件或\
  \ shell 脚本来调用带有 JVM 路径的相应执行文件。本节的示例使用了 Windows 系统上的 BIRT Report Designer。\n\n####\
  \ 如何在启动 BIRT 报告设计器时指定使用哪个 JVM\n\n在命令行中，输入类似下面的命令：\n\n```\neclipse.exe -vm $JAVA_HOME/jdk1.5/bin/java.exe\n\
  ```\n\n#### 安装语言包\n\n所有 BIRT 用户界面组件和消息都通过使用属性文件进行国际化。BIRT 使用英语作为默认语言，但通过安装包含所需属性文件的语言包来支持其他语言。BIRT\
  \ 2.6 提供了一个语言包 `NLpack1`，它支持以下语言：\n\n• 法语\n• 德语\n• 西班牙语\n• 日语\n• 韩语\n• 简体中文\n\n\
  以下说明解释了如何在 Windows 上下载并安装适用于 BIRT 2.6 的语言包。\n\n#### 如何下载和安装语言包\n\n要下载并安装语言包，请执行以下步骤：\n\
  \n1. 使用浏览器，导航到 BIRT 语言包页面：[`http://www.eclipse.org/babel/downloads.php`](http://www.eclipse.org/babel/downloads.php)\n\
  \n2. 从 Babel Language Packs for Galileo 中下载您所需产品的语言包。\n\n3. 将语言包压缩包解压到 Eclipse 目录的级目录。\n\
  \n例如，如果 `C:/eclipse` 是您的 Eclipse 目录，则将语言包解压到 `C:/`。\n\n4. 启动 Eclipse 并选择 Window→Preferences→Report\
  \ Design→Preview。\n\n5. 从 Choose your locale（选择您的区域设置）下拉列表中选择可选的语言。\n\n6. 重启 Eclipse。\n\
  \n如果 Windows 未在 BIRT 所需的区域设置下运行，请使用 `-nl <locale>` 命令行选项启动 Eclipse，其中 `<locale>`\
  \ 是标准的 Java 区域代码，例如用于西班牙西班牙语的 `es_ES`。区域代码列表可以在以下 URL 获取：[`http://www.oracle.com/technetwork/java/javase/locales-137662.html`](http://www.oracle.com/technetwork/java/javase/locales-137662.html)\n\
  \nEclipse 会记住您在命令行上指定的区域。在随后的启动 Eclipse 时，区域将设置为最近的区域设置。要恢复到之前的区域设置，请使用 `-nl` 选项启动\
  \ Eclipse。\n\n### 更新 BIRT Report Designer 安装\n\n由于 BIRT Report Designer 是基于 Java\
  \ 的应用程序，更新安装通常需要替换文件。Eclipse 通过提供更新管理器支持 BIRT Report Designer 的更新。BIRT RCP Report\
  \ Designer 是独立产品，因此您必须用新版本替换旧版本。\n\n本节描述了更新以下 BIRT 包所需的步骤：\n\n• Report Designer\n\
  • RCP Report Designer\n\n您可以使用 Eclipse 更新管理器查找并安装 BIRT Report Designer 的更高版本。\n\n\
  #### 使用更新管理器更新 BIRT Report Designer 安装\n\n1. 在 Eclipse 中，选择 Help→Check for Updates（检查更新）。\n\
  2. 在 Available Updates 中选择 Select All（全选），然后选择 Next。\n3. 在 Update Details 中选择 Next。\n\
  4. 在 Review Licenses 中，接受许可条款并选择 Finish。\n5. 更新完成后，重启电脑。\n\n#### 手动更新 BIRT Report\
  \ Designer\n\n1. 如果工作区位于 eclipse 目录结构中，请进行备份。\n2. 要移除 BIRT 文件，请使用以下技术之一：\n• 为了准备新的整体安装，请删除整个\
  \ eclipse 目录。\n• 为了仅准备 BIRT Report Designer 安装，请删除 BIRT 组件。\n3. 导航到 `eclipse\\features`\
  \ 目录。\n4. 删除所有以 `birt` 开头的 JAR 文件和子目录。\n5. 导航到 `eclipse\\plugins` 目录。\n6. 删除所有以\
  \ `birt` 开头的 JAR 文件和子目录。\n7. 按照本书之前介绍的方法下载并安装 BIRT Report Designer。\n8. 如需要，恢复工作区。\n\
  9. 使用 `-clean` 选项重启 BIRT Report Designer：\n\n```\neclipse.exe -clean\n```\n\n\n\n\
  与 BIRT Report Designer 不同，BIRT RCP Report Designer 是一个独立的应用程序。要更新此应用程序，你需要删除整个程序并重新安装新版本。如果您将报告设计和资源创建在\
  \ `birt-rcp-report-designer-<version>` 目录结构中，则在删除 BIRT RCP Report Designer 之前，必须备份您的工作空间（workspace）目录以及任何想要保留的资源。在安装新版本的应用程序后，可以将文件复制回应用程序目录结构。\n\
  \n作为最佳实践，请勿将工作空间放在 `birt-rcp-report-designer-<version>` 目录结构中。将工作空间放在不同的位置可以使您在将来更轻松地更新安装。\n\
  \n### 如何更新 BIRT RCP Report Designer\n\n1. 如果包含报告设计、库和其他资源的目录位于 `birt-rcp-report-designer-<version>`\
  \ 目录结构中，请备份工作空间目录以及任何其他目录。\n2. 删除 `birt-rcp-report-designer-<version>` 目录。\n3. 按照本书前面的说明下载并安装\
  \ BIRT RCP Report Designer。\n4. 如有，恢复在第 1 步中备份的目录。\n5. 使用 `-clean` 选项重启 BIRT RCP\
  \ Report Designer：\n\n```\nBIRT.exe -clean\n```\n\n## 第 3 章 安装其他 BIRT 包\n\n除了 BIRT\
  \ Report Designer 包外，BIRT 还提供了许多其他独立包，以下载归包的形式发布在 Eclipse 网站上。这些包中，一些是独立模块，另一些需要现有的\
  \ Eclipse 或 BIRT 环境，还有一些为报告开发者和应用程序开发者提供额外的功能。本章描述了安装下列表所示 BIRT 包所需的步骤：\n\n* 图表引擎\
  \ (Chart Engine)\n* 数据工具平台 (DTP) 集成\n* 演示数据库 (Demo Database)\n* 报告引擎 (Report Engine)\n\
  * 示例 (Samples)\n* 源代码 (Source Code)\n* Web 工具集成 (Web Tools Integration)\n\n### 安装\
  \ Chart Engine\n\nChart Engine 支持为 Java 应用程序添加图表功能。应用程序可以在不使用 BIRT 报告功能或报告引擎的情况下使用\
  \ Chart Engine。Chart Engine 集到 Microsoft Windows、UNIX 或 Linux 上的现有 Eclipse 平台。您也可以在现有的\
  \ J2EE 应用程序服务器上安装 Chart Engine。要使用 Chart Engine，可以使用其公共 API `org.eclipse.birt.chart`。\n\
  \nBIRT Report Designer 和 BIRT RCP Report Designer 包含 Chart Engine 的所有组件。如果您正在使用\
  \ BIRT 报告设计器，则无需单独安装 BIRT Chart Engine。\n\n### 如何安装 Chart Engine\n\n在 BIRT 网站上，执行以下操作：\n\
  \n1. 导航到 2.6.0 版本的 BIRT 下载页面。\n有关如何导航到 BIRT 网站以及 2.6.0 版本的 BIRT 下载的更多信息，请参阅第 2 章，“安装\
  \ BIRT Report Designer”。\n\n2. 在 Chart Engine 部分，选择 Chart Engine 归档文件：\n\n```\n\
  birt-charts-2_6_0.zip\n```\n\n3. 在文件下载中，选择“打开”（Open）。\n4. 将归档文件解压到您选择的位置。\n5. 从命令行使用\
  \ `-clean` 选项启动 Eclipse 以移除缓存信息。\n\n归档提取过程会在提取目录中创建以下子目录：\n\n* `ChartRuntime`：此目录包含\
  \ Eclipse 平台运行、渲染和编辑图表所需的插件和库。\n* `ChartSDK`：此目录包含来自 `ChartRuntime` 目录的插件和库，以及创建自己的图表应用程序所需的\
  \ SDK。它还包括示例、源代码以及一个支持 Web 应用程序中使用图表的 Web Tools Platform (WTP) 扩展。\n* `DeploymentRuntime`：此目录包含在非\
  \ Eclipse 环境（例如在应用程序服务器上）运行图表应用程序所需的库。\n\nChart Engine 下载文件还包含详尽的常见问题解答 (FAQ) 和说明如何使用\
  \ Chart Engine 的示例。解压归档后，您可以在以下位置找到 FAQ：\n\n```\n<CHART_ENGINE>/DeploymentRuntime/ChartEngine/docs/Charts_FAQ.doc\n\
  ```\n\n示例位于以下位置的 JAR 文件：\n\n```\n<CHART_ENGINE>/ChartSDK/eclipse/plugins/org.eclipse.birt.chart.examples_<version>.jar\n\
  ```\n\n### 安装 BIRT Data Tools Platform 集成\n\n此包包含了 BIRT Report Designer 需要的最小数据工具平台\
  \ (DTP) 插件集。如果您在现有的 Eclipse 安装中安装 BIRT Report Designer 包，可以安装此 BIRT DTP 集成包，而不是完整的\
  \ DTP 。\n\n### 如何安装 BIRT DTP 集成\n\n在 BIRT 网站上，执行以下操作：\n\n1. 导航到 2.6.0 版本的 BIRT 下载页面。\n\
  2. 在 BIRT DTP 集成部分，选择 BIRT DTP 集成归档文件：\n\n```\nbirt-dtp-integration-2_6_0.zip\n\
  ```\n3. 在 Eclipse 下载中，选择最近的下载站点。\n4. 将归档文件解压到包含您的 Eclipse 目录的目录。\n解压会在 `eclipse\\\
  features` 和 `eclipse\\plugins` 目录中创建 DTP 功能和插件。\n5. 从命令行使用 `-clean` 选项启动 Eclipse。\n\
  \n要测试 BIRT DTP 集成包，请按照以下步骤在 Eclipse 中打开报告设计视图（Report Design）。\n\n### 如何测试 BIRT DTP\
  \ 集成安装\n\n1. 启动 Eclipse。\n2. 从 Eclipse 主菜单中，选择打开视图（Open Perspective）→报告设计（Report\
  \ Design）。如果打开视图窗口中没有出现报告设计，请选择“其他”（Other）。从视图列表中选择“报告设计”。\nEclipse 将显示报告设计视图。\n\
  \n### 安装 BIRT Demo Database\n\nBIRT Demo Database 包提供了书中示例过程使用的 Classic Models 数据库。数据库以以下格式提供：\n\
  \n* Apache Derby\n* MySQL\n\nBIRT Report Designer 和 BIRT RCP Report Designer 包含了\
  \ Apache Derby 格式的数据库，作为 Classic Models 样本源。如果您想使用原生驱动访问此数据源，请安装 BIRT Demo Database。\n\
  \n### 如何安装 BIRT Demo Database\n\n在 BIRT 网站上，执行以下操作：\n\n1. 导航到 2.6.0 版本的 BIRT 下载页面。\n\
  2. 在 Demo Database 部分，选择 Demo Database 归档文件：\n\n```\nbirt-database-2_6_0.zip\n```\n\
  3. 在文件下载中，选择“打开”（Open）。\n4. 将归档文件解压到您选择的位置。\n解压会创建一个目录 `ClassicModels`，其中包含 Derby\
  \ 和 MySQL 格式的 BIRT Demo Database。\n\n要测试 BIRT Demo Database，首先使用原生数据库工具或 Java 应用程序连接数据库。\n\
  \n### 如何使用数据库工具访问 BIRT Demo Database\n\n根据您偏好的数据库，执行以下一组任务：\n\n* Apache Derby 数据库：连接到\
  \ `ClassicModels` 子目录下的 `derby` 数据库。\n* MySQL：\n1. 导航到 `ClassicModels` 的 `mysql`\
  \ 子目录。\n2. 创建一个使用的数据库或编辑 `create_classicmodels.sql` 以取消创建和选择 `classicmodels` 数据库行的注释。\n\
  3. 使用 mysql 命令行界面运行 `create_classicmodels.sql`。\n4. 查看 `load_classicmodels.sql`\
  \ 以判断是否可以在您的平台上无需编辑即可运行脚本。使用 mysql 命令行界面运行 `load_classicmodels.sql`。\n\n接下来，从 BIRT\
  \ Report Designer 或 BIRT RCP Report Designer 连接数据库。\n\n### 如何从 BIRT 设计设计器访问 BIRT\
  \ Demo Database\n\n使用 BIRT Report Designer 或 BIRT RCP Report Designer 连接数据库。\n\n\
  1. 要访问 Apache Derby 或 MySQL 格式的 Classic Models 数据库，首先向 BIRT 报告设计器安装添加驱动程序 JAR 文件。\n\
  \n\n\n\n2. 在任何报告设计中，请在数据库上创建一个数据源。在同一个报告设计中，在数据源上创建一个数据集。\n\n### 安装报告引擎 (Report\
  \ Engine)\n\n报告引擎支持为 Java 应用程序添加报告功能。BIRT 报告引擎可以集成到 Microsoft Windows、UNIX 或 Linux\
  \ 上的 Eclipse 平台。你也可以在现有的 J2EE 应用程序服务器上安装报告引擎组件。为了支持向应用程序服务器快速部署报告功能，报告引擎包含了一个 Web\
  \ 归档文件（`.war`）。\n\n#### 如何安装 BIRT 报告引擎\n\n在 BIRT 网站上执行以下操作：\n\n1. 导航到构建 2.6.0 的\
  \ BIRT 下载。\n\n2. 在 Report Engine 部分，选择 Report Engine 归文件：\n\n`birt-runtime-2_6_0.zip`\n\
  \n3. 在文件下载（File Download）中，选择打开。\n\n4. 将归档文件提取到合适的目录。\n\n5. 创建系统变量 `BIRT_HOME`。\n\
  \n将 `BIRT_HOME` 的值设置为 BIRT 报告引擎的安装目录。例如，如果你将 BIRT 报告引擎解压到 `C:\\`，则 `BIRT_HOME` 的值为：\n\
  \n`C:\\birt-runtime-2_6_0`\n\n要测试安装，请运行报告引擎报告生成命令行示例。该示例在 Windows 系统上使用批处理文件（.bat），在\
  \ UNIX 或 Linux 系统上使用 shell 脚本文件（.sh）。该文件接受表 3-1 所示的参数。\n\n**表 3-1** `genReport`\
  \ 脚本的参数\n\n![image](img/03tab01.jpg)\n\n#### 如何测试 BIRT 报告引擎安装\n\n1. 从命令行导航到你安装 BIRT\
  \ 报告引擎的目录。\n\n2. 导航到 `ReportEngine` 子目录。\n\n3. 要运行 `genReport` 脚本，请运行适用于你操作系统的文件：\n\
  \n- 在 Windows 平台上，运行 `genReport.bat`。\n- 在 UNIX 或 Linux 平台上，运行 `genReport.sh`。\n\
  \n将命令行参数的值用引号括起来。例如，以下 Windows 平台命令使用值 `Hello` 作为参数 `sample`，以从报告设计 `test.rptdesign`\
  \ 生成 HTML 文件：\n\n```\ngenReport -p \"sample=Hello\" \"C:\\birt-runtime-2_6_0\\WebViewerExample\\\
  test.rptdesign\"\n```\n\n`genReport` 生成所需的输出文件。\n\n4. 打开输出文件。在本示例中，该文件是 `C:\\birt-runtime-2_6_0\\\
  WebViewerExample\\test.html`。\n\n有关设置 BIRT 报告引擎的更多信息，请参阅第 4 章“将 BIRT 报告部署到应用程序服务器”。\n\
  \n### 安装 BIRT 示例 (BIRT Samples)\n\nBIRT Samples  BIRT 报告项扩展和图表应用程序的示例。报告项扩展集成到 BIRT\
  \ 报告设计器和 BIRT 报告引擎中。\n\n#### 如何安装 BIRT Samples\n\n在 BIRT 网站上执行以下操作：\n\n1. 导航到构建\
  \ 2.6.0 的 BIRT 下载。\n\n2. 在 Samples 部分，选择 Samples 归档文件：\n\n`birt-samples-plugins-2_6_0.zip`\n\
  \n3. 在文件下载（File Download）中，选择打开。\n\n4. 将归档文件提取到包含你 Eclipse 目录的目录。\n\n### 安装 BIRT\
  \ 源代码 (BIRT Source Code)\n\n此包包含所有 BIRT 插件的源代码。你可以检查这些代码以查看 BIRT 如何从设计生成报告。你也可以将此源代码导入到工作空间以构建自定义的\
  \ BIRT 安装。\n\n#### 如何安装 BIRT 源代码\n\n1. 导航到构建 2.6.0 的 BIRT 下载。\n\n2. 在 BIRT Source\
  \ Code 部分，选择 BIRT 源代码归档文件：\n\n`birt-source-2_6_0.zip`\n\n3. 在文件下载（File Download）中，选择打开。\n\
  \n4. 将归档文件提取到新的工作空间目录。\n\n提取会在该工作空间目录中创建构建文件以及 BIRT 特性目录和插件目录。\n\n要测试 BIRT 源代码包，请将源代码项目导入你的工作空间。\n\
  \n#### 如何测试 BIRT 源代码安装\n\n1. 启动 Eclipse。\n\n2. 为 BIRT 设置 Java 偏好。\n\n1. 从 Eclipse\
  \ 窗口菜单中，选择 `Window→Preferences`。\n\n2. 展开 `Java`，选择 `Compiler`。进行以下选择：\n\n- 将 `Compiler\
  \ Compliance Level` 设置为 `1.6`。\n- 取消勾选 `Use default compliance settings`。\n- 将 `Generated\
  \ .class files compatibility` 设置为 `1.6`。\n- 将 `Source compatibility` 设置为 `1.6`。\n\
  \n3. 点击 OK。\n\n3. 从 Eclipse 窗口菜单中，选择 `File→Import`。\n\n4. 在 `Import—Select` 中，展开\
  \ `General` 并选择 `Existing Projects into Workspace`。点击 Next。\n\n5. 在 `Import—Import\
  \ Projects` 中，选择 `Select root directory`，输入或浏览到你的工作空间目录。\n\nBIRT 特性和插件将出现在 `Projects`\
  \ 中。\n\n6. 选择 `Finish`。\n\nEclipse 会构建 BIRT 项目。\n\n如果项目没有正确构建，请检查你是否安装了 BIRT 报告设计器的先决条件，具体见第\
  \ 1 章“介绍 BIRT 报告设计器”。如果你尚未安装 BIRT 报告设计器 Full Eclipse 安装，请下载此包并提取任何 `JAR` 文件。\n\n\
  ### 安装 BIRT Web 工具集成 (BIRT Web Tools Integration)\n\n此包包含 Eclipse Web Tools Platform\
  \ (WTP) 构建 BIRT Web 项目时所需的最少 BIRT 插件集。此包还包含了这些插件的源代码。\n\n#### 如何安装 BIRT Web Tools\
  \ Integration\n\n在 BIRT 网站上执行以下操作：\n\n1. 导航到构建 2.6.0 的 BIRT 下载。\n\n2. 在 BIRT Web\
  \ Tools Integration 部分，选择 BIRT Web Tools Integration 归档文件：\n\n`birt-wtp-integration-sdk-2_6_0.zip`\n\
  \n3. 在文件下载（File Download）中，选择打开。\n\n4. 将归档文件提取到包含你 Eclipse 目录的目录。\n\n提取会在 `eclipse\\\
  features` 和 `eclipse\\plugins` 目录中创建 BIRT 特性和插件。\n\n要测试 BIRT Web Tools Integration\
  \ 包，请在 Eclipse 中创建一个 BIRT Web 项目。\n\n#### 如何测试 BIRT Web Tools Integration 安装\n\n\
  1. 启动 Eclipse。\n\n2. 从 Eclipse 窗口菜单中，选择 `File→New→Project`。\n\n3. 在 `New Project—Select\
  \ a wizard` 中，展开 `Web`，选择 `Dynamic Web Project`。点击 Next。\n\n4. 在 `New Project—Dynamic\
  \ Web Project` 中，为你的 BIRT Web 项目所需的选择，然后点击 Finish。\n\n如果你没有打开 Java EE 视角，Eclipse\
  \ 会显示以下消息：\n\n此类项目与 Java EE 视角相关。现在要打开此视角吗？\n\n选择 Yes。\n\n\n\n\n\n部署到 Tomcat 6.0\
  \ 版本与部署到其他 Apache Tomcat 版本的要求之间只有细微差异。Apache Tomcat 6.0 默认运行 Java 5，这这也是 BIRT 2.6\
  \ 推荐使用的版本之一。如果您使用较早版本的 Java，则需要安装兼容性包并配置 Apache Tomcat 使用 Java 1.4 运行时环境。有关配置 Apache\
  \ Tomcat 使用 Java 1.4 运行时环境的信息，请参阅 Apache Tomcat 帮助页面。\n\n## 关于部署到其他应用程序服务器\n\n大多数应用程序服务器都需要一个\
  \ WAR 文件，该文件包含应用程序所需的所有内容，包括描述应用程序和各种部署偏好设置 `web.xml` 文件。BIRT 报告引擎（Report Engine）包含一个适用于\
  \ Tomcat 的 WAR 文件。通常情况下，该 WAR 文件不需要修改。在某些情况下，具有其他应用程序服务器经验的开发者可以修改 `web.xml` 文件以反映其环境的要求。本章稍后关于报告查看器文件夹映射的部分将讨论如何设置\
  \ `web.xml` 参数。\n\n部署到 JBoss 可能需要将 `axis.jar` 和 `axis-ant.jar` 从 `WEBINF/lib` 复制到以下目录：\n\
  \n`jboss/server/default/lib`\n\n此步骤对于所有 JBoss 版本都不是必须的，但如果 JBoss 部署遇到困难，复制这些文件可以解决问题。\n\
  \n## 将 BIRT 报告查看器放在应用程序服务器上\n\n您必须将 BIRT 报告查看器放置在 Apache Tomcat 可以访问的位置。通常，该位置是\
  \ `$TOMCAT_INSTALL/webapps` 目录。重启 Apache Tomcat 时，如果 BIRT 报告查看器位于此文件夹，应用程序服务器会自动识别并启动\
  \ BIRT 报告查看器应用程序。\n\n## 将 BIRT 报告查看器安装为 Web 应用程序\n\nBIRT 报告查看器文件提供了运行、渲染和查看 BIRT\
  \ 报告的核心功能。若要使用不是标准 BIRT 包包含的额外 JDBC 驱动程序，您必须安装这些驱动程序以及 BIRT 报告查看器本身。如果您作为 WAR 文件安装\
  \ BIRT 报告查看器，则必须在 WAR 文件中包含 JDBC 驱动。\n\n以下指令假设您已从 BIRT 网站安装了 BIRT 报告引擎，您的 Web 应用程序目录为\
  \ `$TOMCAT_INSTALL/webapps`，且你的 BIRT 运行时安装目录为 `$BIRT_RUNTIME`。\n\n### 如何从 BIRT 报告引擎\
  \ WAR 文件安装 BIRT 报告查看器\n\n从 WAR 文件安装 BIRT 报告查看器的步骤取决于您是否需要为报告包含额外的 JDBC 驱动程序。如果没有额外的驱动程序，从\
  \ BIRT 报告引擎安装中安装 WAR 文件。如果您使用了额外的 JDBC 驱动程序，则必须在部署之前将其封装到 WAR 文件中。\n\n* 要从 BIRT\
  \ 报告引擎 WAR 文件安装 BIRT 报告查看器，如如下 DOS 命令所示，将 BIRT 报告引擎 WAR 文件 `birt.war` 复制到 Tomcat\
  \ 文件夹 `$TOMCAT_INSTALL/webapps`：\n\n```bash\ncopy $BIRT_RUNTIME/birt.war $TOMCAT_INSTALL/webapps\n\
  ```\n\n然后，重启 Apache Tomcat。\n\n* 要带上额外的 JDBC 驱动程序安装 BIRT 报告查看器，请执行以下步骤：\n\n1. 创建一个临时目录并进入该目录。\n\
  \n2. 使用类似于下方的命令将 BIRT 报告引擎 WAR 文件解压到临时目录：\n\n```bash\njar -xf $BIRT_RUNTIME/birt.war\n\
  ```\n\nBIRT 报告引擎应用程序将解压到临时目录。\n\n3. 将您的 JDBC 驱动程序的 JAR 文件复制到临时目录中的以下文件夹：\n\n`WEB-INF/platform/plugins/`\n\
  \n`org.eclipse.birt.report.data.oda.jdbc_<version>/drivers`\n\n4. 使用类似于下方的命令从临时目录将\
  \ BIRT 报告引擎 WAR 文件重新封装成一个新的 `birt.war` 文件：\n\n```bash\njar -cf birt.war *\n```\n\
  \n此命令会在临时目录中创建 `birt.war`。\n\n5. 如如下 DOS 命令所示，将新的 `birt.war` 文件复制到 Tomcat 应用程序文件夹\
  \ `$TOMCAT_INSTALL/webapps`：\n\n```bash\ncopy birt.war $TOMCAT_INSTALL/webapps\n\
  ```\n\n6. 重启 Apache Tomcat。\n\n### 如何从 BIRT 报告引擎查看器文件夹安装 BIRT 报告查看器\n\n要在文件系统文件夹中将\
  \ BIRT 报告查看器安装为应用程序，请使用 BIRT 报告引擎安装中的 `WebViewerExample` 文件夹。\n\n1. 导航到 `$TOMCAT_INSTALL/webapps`。\n\
  \n2. 创建名为 `birt` 的子目录。\n\n3. 如如下 DOS 命令所示，将 Web 查看器示例目录及其所有子目录复制到此新文件夹：\n\n```bash\n\
  xcopy /E \"$BIRT_RUNTIME/WebViewerExample\" $TOMCAT_INSTALL/webapps/birt\n```\n\n\
  4. 如果 BIRT 报告需要额外的 JDBC 驱动程序，请将 JDBC 驱动程序的 JAR 文件添加到以下目录：\n\n`$TOMCAT_INSTALL/birt/WEB-INF/platform/plugins/`\n\
  \n`org.eclipse.birt.report.data.oda.jdbc_<version>/drivers`\n\n5. 重启 Apache Tomcat。\n\
  \n## 测试 BIRT 报告查看器的安装\n\n要测试前面介绍的 BIRT 报告查看器安装，请在浏览器地址栏中输入以下 URL：\n\n`<server_name>:<port>`\n\
  \n`<server_name>` 是应用程序服务器的，`<port>` 是应用程序服务器使用的端口。\n\nTomcat 打开 JavaServer 页面 (JSP)\
  \ `index.jsp`。该文件存在于 WAR 文件和 BIRT 报告查看器根目录中。此页面上的链接运行报告设计 `test.rptdesign`。如果 BIRT\
  \ 报告查看器安装正确，Tomcat 使用 `index.jsp` 处理报告设计并生成报告。在首次运行报告时，Tomcat 会编译 JSP，因此会出现延迟。\n\
  \n## 修改 BIRT 报告查看器的上下文\n\n默认情况下，Web 应用程序的上下文是应用程序目录或 WAR 文件。BIRT 报告查看器的默认 WAR 文件为\
  \ `birt.war`，因此从 Tomcat 访问 BIRT 报告的默认 URL 类似于：\n\n`http://localhost:8080/birt/run?__report=myReport.rptdesign`\n\
  \n要更改上下文，更改 `$TOMCAT_INSTALL/webapps` 中 `/birt` 目录或 WAR 文件的名称。接下来重启 Apache Tomcat。在访问报告的\
  \ URL 中指定您选择的名称。例如，如果您选择了 `reports`，访问报告的 URL 将变为：\n\n`http://localhost:8080/reports/run?__report=myReport.rptdesign`\n\
  \n本节中的 URL 示例使用相对路径访问报告设计。`BIRT_VIEWER_WORKING_FOLDER` 参数设置访问报告设计的相对路径。\n\n##  BIRT\
  \ 报告查看器的位置\n\n要将 BIRT 报告查看器放置在 `$TOMCAT_INSTALL/webapps` 之外的位置，请在 `$TOMCAT_INSTALL/conf`\
  \ 中的 `server.xml` 文件中添加上下文映射。\n\n要添加上下文映射，请在 `server.xml` 文件结尾附近的 `</host>` 标签上方添加以下行：\n\
  \n```xml\n<Context path=\"/birt_context\" docBase=\"BIRT_Path\"/>\n```\n\n其中 *birt_context*\
  \ 是 BIRT 报告查看器应用程序的上下文，*BIRT_Path* 是包含 BIRT 报告查看器的目录的绝对路径。\n\n保存 `server.xml` 的更改并重启\
  \ Apache Tomcat 使其生效。\n\n## 理解 BIRT 报告查看器的上下文参数\n\n为了确定报告设计、报告图像和日志文件的位置，BIRT 报告查看器使用\
  \ `web.xml` 文件定义的上下文参数。作为这些参数的值路径可以是相对路径或绝对路径。相对路径相对于 BIRT 报告查看器应用程序的根目录。对于作为 WAR\
  \ 文件部署的 BIRT 报告查看器，可写位置的路径必须是绝对路径。\n\n\n\n\n默认情况下，报告设计的相对路径是相对于 BIRT 报告查看器的根目录。请将所有报告设计放在此文件夹中，或在\
  \ URL 中使用报告设计的完整路径。使用相对路径对于在 WAR 文件中部署 BIRT 报告查看器并不方便，因为报告设计的更改将需要重新封装 WAR 文件。若要为报告设计设置不同的位置，请更改\
  \ BIRT 报告查看器应用程序 `web.xml` 文件中的 `BIRT_VIEWER_WORKING_FOLDER` 参数。\n\n其他上下文参数决定了 BIRT\
  \ 报告查看器行为的其他方面，例如默认语言区域和查看器日志文件中的详细程度。\n\n### 如何设置报告设计的位置\n\n**1** 导航到 `$TOMCAT_INSTALL/webapps`。\n\
  \n**2** 根据您的部署配置，执行以下步骤之一，用代码编辑器打开 `web.xml`：\n\n• 如果您使用 WAR 文件部署 BIRT 报告查看器，请从\
  \ `birt.war` 中提取 `WEB-INF/web.xml` 到临时位置。\n• 如果您使用文件夹部署 BIRT 报告查看器，请导航到 `<context\
  \ root>/WEB-INF`。\n\n**3** 找到以下元素：\n\n```xml\n<context-param>\n   <param-name>BIRT_VIEWER_WORKING_FOLDER</param-name>\n\
  \   <param-value></param-value>\n</context-param>\n```\n\n**4** 修改 `param-value`\
  \ 元素，使其包含报告设计文件夹的绝对路径，类似于下面的代码，其中 `Report_Folder` 是报告设计文件夹的绝对路径：\n\n```xml\n<context-param>\n\
  \   <param-name>BIRT_VIEWER_WORKING_FOLDER</param-name>\n   <param-value>Report_Folder</param-value>\n\
  </context-param>\n```\n\n**5** 保存 `web.xml` 并关闭编辑器。\n\n**6** 如果您使用 WAR 文件部署 BIRT\
  \ 报告查看器，用刚刚修改的文件替换 `birt.war` 中的 `WEB-INF/web.xml`。\n\n**7** 将报告设计复制到 `BIRT_VIEWER_WORKING_FOLDER`\
  \ `param-value` 元素指定的文件夹中。\n\n**8** 重启 Apache Tomcat。\n\n### 验证 Apache Tomcat 正在运行\
  \ BIRT 报告查看器\n\n如果访问 BIRT 报告查看器时出现问题，请使用 Tomcat manager 来验证 BIRT 报告查看器正在 Apache\
  \ Tomcat 上运行。运行 Tomcat manager 需要管理员账户。如果不存在 Tomcat manager 账户，请通过向 `$TOMCAT_INSTALL/conf/tomcat-users.xml`\
  \ 添加以下行来创建一个：\n\n```xml\n<user name=\"admin\" password=\"tomcat\" roles=\"manager\"\
  \ />\n```\n\n在拥有管理员账户的情况下，首先打开 Tomcat 主页，对于典型的 Apache Tomcat 安装，该地址为 `http://localhost:8080`，如图图\
  \ 4-1 所示。\n\n**图 4-1** Apache Tomcat 首页\n\n![image](img/04fig01.jpg)\n\n在 Tomcat\
  \ 主页上，在面板（Administration panel）中，选择 Tomcat Manager。在管理器登录窗口中，输入在 `tomcat-users.xml`\
  \ 文件中定义的管理员账户用户名和密码。当 BIRT 报告查看器应用程序运行时，Eclipse BIRT Report Viewer 的运行（Running）状态为\
  \ true，如图图 4-2 所示。\n\n**图 4-2** BIRT 报告查看器的运行状态\n\n![image](img/04fig02.jpg)\n\n\
  ### 在应用程序服务器上放置字体\n\nBIRT 引擎需要某些 TrueType 字体来显示 PDF 报告。BIRT 在 Windows 和 Linux 的常用字体目录中搜索字体。BIRT\
  \ 在 Windows 系统上的搜索目录包括：\n\n• A 到 G 盘的 `/windows/fonts`\n• A 到 G 盘的 `/WINNT/fonts`\n\
  \n在 Linux 系统上的则包括：\n\n• `/usr/share/fonts/default/TrueType`\n• `/usr/share/fonts/truetype`\n\
  \n如果 PDF 报告似乎缺少内容，请将必要的字体放在上述列表中的任何目录中。或者，在环境变量 `BIRT_FONT_PATH` 中指定您自己的字体搜索路径。\n\
  \n#### 使用浏览器查看报告\n\n在将 BIRT 报告查看器部署到您的 J2EE 容器后，可以使用两个可用 BIRT 报告查看器 servlet 使用网络浏览器访问您的\
  \ BIRT 报告。要使用浏览器查看 BIRT 报告，请使用以下格式之一的 URL，其中 `parameter_list` 是 URL 参数列表：\n\n`http://localhost:8080/birt/run?parameter_list`\n\
  `http://localhost:8080/birt/frameset?parameter_list`\n\n`run` 和 `frameset` servlet\
  \ 以两种不同的方式显示报告。`run` servlet 将报告显示为独立的网页或 PDF 文件。如果报告需要参数，请在 URL 中指定它们。`frameset`\
  \ servlet 在浏览器中显示一个带有工具栏的页面，该工具栏包含四个按钮，用于执行以下任务：\n\n• 打印报告。\n• 显示目录。\n• 显示参数对话框。\n\
  • 显示导出数据的对话框。\n\n#### 在 Tomcat 上使用连接池\n\nBIRT 提供对连接池的支持。对于配置了连接池的 Tomcat 应用程序服务器，在连接\
  \ JDBC 数据库时，可以设置 BIRT 报告使用连接池中的连接。BIRT JDBC 数据源使用 JNDI 属性访问连接池获取服务。\n\n#### 设置报告使用连接池\n\
  \n使用 BIRT 设计器配置报告使用连接池。JDBC 数据源需要直接访问。此此的原因是某些 JNDI 提供程序不支持客户端访问。在设计期间，JDBC 驱动程序使用直接访问连接。如果\
  \ JNDI 因任何原因失败，JDBC 驱动程序将退回到直接访问 URL。\n\n同样，在运行时（例如报告预览），运行时驱动程序尝试查找 JNDI 名称服务以获取池连接。如果查找不成功，JDBC\
  \ 驱动程序使用直接访问 URL。\n\n#### 使用 jndi.properties 文件\n\n每个在 Web 服务器上的单个 JNDI 应用程序使用存储在\
  \ JVM 系统属性中的环境设置。JNDI 从系统属性读取以下标准 JNDI 属性：\n\n- `java.naming.factory.initial`\n\
  - `java.naming.factory.object`\n- `java.naming.factory.state`\n- `java.naming.factory.control`\n\
  - `java.naming.factory.url.pkgs`\n- `java.naming.provider.url`\n- `java.naming.dns.url`\n\
  \n为了简化为 JNDI 应用程序设置 JNDI 初始化环境的任务，JNDI 特性支持使用 `jndi.properties` 资源文件。将此文件安装在位于以下路径的\
  \ jdbc 插件的驱动子文件夹中：\n\n`WEB-INF\\platform\\plugins\\org.eclipse.birt.report.data.oda.jdbc_<version>\\\
  drivers`\n\n此文件包含属性文件格式的键值对列表，`key=value`。键是属性名称，值是一个字符串，例如 `java.naming.factory.object=jnp://localhost:1099`。\n\
  \n这是一个与 JBoss 应用服务器使用的 JNDI 资源文件示例：\n\n```properties\njava.naming.factory.initial=org.jnp.interfaces.NamingContextFactory\n\
  java.naming.provider.url=jnp://localhost:1099\njava.naming.factory.url.pkgs=org.jboss.naming:org.jnp.interfaces\n\
  ```\n\nJDBC 运行时驱动程序在 Web 应用程序树中查找 `jndi.properties` 文件。如果驱动程序未找到文件或读取出现问题，初始化上下文将使用\
  \ `javax.naming.Context` 定义的默认行为定位任何 JNDI 资源文件。为环境属性引用的类配置类路径是必要的。\n\n\n\n\nJDBC\
  \ 数据源的 JNDI URL 属性支持在 BIRT 报告部署到 Web 应用程序服务器时从池中检索 JDBC 连接。有关在 Tomcat 上配置连接池的更多信息，请参阅：\n\
  \n[`http://tomcat.apache.org/tomcat-6.0-doc/jndi-resources-howto.html`](http://tomcat.apache.org/tomcat-6.0-doc/jndi-resources-howto.html)\n\
  \n## 如何在 Tomcat 上配置 JNDI 连接对象\n\n以下示例假设你已经按照本章前面的描述，将 BIRT 报告查看器部署到了 Tomcat 6.0\
  \ 应用程序服务器的 `$TOMCAT_INSTALL/webapps/birt` 文件夹中。\n\n**1** 安装 JDBC 驱动。让 Tomcat 内部类和\
  \ Web 应用程序均可以使用相应的 JDBC 驱动程序，例如通过将驱动程序的 JAR 文件安装到 Tomcat 应用程序主目录下的以下库目录：\n\n`CATALINA_HOME/common/lib`\n\
  \n**2** 在 BIRT 报告查看器的 `WEB-INF/web.xml` 文件中声明资源需求。例如，添加以下条目以为名为 `MySqlDB` 的 MySQL\
  \ 格式数据库设置 JNDI 服务：\n\n```xml\n<resource-ref>\n   <description>Resource reference\
  \ to a factory for\n      java.sql.Connection</description>\n   <res-ref-name>jdbc/MySqlDB</res-ref-name>\n\
  \   <res-type>javax.sql.DataSource</res-type>\n   <res-auth>Container</res-auth>\n\
  </resource-ref>\n```\n\n**3** 在 BIRT 报告查看器的 `META-INF/context.xml` 文件中将 Tomcat 的资源工厂配置为\
  \ Resource 元素，类似于下面的行：\n\n```xml\n<Context>\n   <Resource name=\"jdbc/MySqlDB\"\
  \ auth=\"Container\"\n      type=\"javax.sql.DataSource\" maxActive=\"5\" maxIdle=\"\
  -1\"\n      maxWait=\"10000\" username=\"root\" password=\"\"\n      driverClassName=\"\
  com.mysql.jdbc.Driver\"\n      url=\"jdbc:mysql://localhost:3306/classicmodels\"\
  \n      description=\"MySQL DB\"/>\n</Context>\n```\n\n**4** 使你报告设计中的 JNDI URL 与\
  \ Tomcat 的资源工厂匹配，类似于下面的行：\n\n`java:comp/env/jdbc/MySqlDB`\n\n**5** 使用 BIRT Report\
  \ 设计器打开报告设计。编辑数据源。在“编辑数据源”（Edit Data Source）中，在 JNDI URL 输入 URL，如图 4-3 所示。\n\n**图\
  \ 4-3** 为 JDBC 数据源设置 JNDI URL\n\n![image](img/04fig03.jpg)\n\n**6** 将报告设计复制到 BIRT\
  \ 报告查看器的根目录。\n\n**7** 重启 Tomcat 服务。\n\n**8** 使用类似于下面的 URL 运行报告：\n\n`http://localhost:8080/birt/run?__report=myJNDIReport.rptdesign`\n\
  \n报告使用连接池连接到 MySQL 服务器上的数据库。\n\n# 第二部分。理解 BIRT 框架\n\n![image](img/part-opener-02.jpg)\n\
  \n## 第 5 章。理解 BIRT 架构\n\nBIRT 由许多相关组件组成。本章将概述 BIRT 架构、BIRT 组件、BIRT 所依赖的 Eclipse\
  \ 组件以及将它们所有紧密结合的关系。\n\n#### 理解 BIRT 集成\n\n作为一个 Eclipse 项目，BIRT 与 Eclipse 框架和平台紧密集成。与所有\
  \ Eclipse 项目一样，BIRT 被实现为一组 Eclipse 插件。BIRT 插件为所有 BIRT 组件提供功能，包括 BIRT 应用程序、驱动应用程序的引擎以及支持的应用程序接口（APIs）。BIRT\
  \ 插件还提供了与多个 Eclipse 框架和平台通信的接口机制。\n\nBIRT 与 Eclipse 组件之间的关系最容易被视为一个栈。栈中的每一层都依赖于、使用并与其下层级集成，如图\
  \ 5-1 所示。\n\n**图 5-1** 作为 Eclipse 平台插件的 BIRT 组件\n\n![image](img/05fig01.jpg)\n\n\
  图 5-2 展示了各种 BIRT 组件以及它们之间的关系。在图中，实线框中的组件是标准 BIRT 组件。虚线框中的组件是 Java 开发者可以提供的自定义组件。某些自定义组件是\
  \ BIRT 的扩展，而其他则是使用 BIRT API 的应用程序。点线框中的组件是包含它的组件所使用的标准 BIRT 组件。例如，因为 BIRT Report\
  \ Designer 使用设计引擎，因此设计引擎出现在 BIRT Report Designer 框内部的点线框中。\n\n**图 5-2** 标准 BIRT\
  \ 组件与自定义组件之间的任务流\n\n![image](img/05fig02.jpg)\n\n图 5-3 显示了 BIRT 组件在生成报告时的关系。\n\n\
  **图 5-3** 生成报告的 BIRT 组件之间的任务流\n\n![image](img/05fig03.jpg)\n\nBIRT Report Designer\
  \ 提供了拖放功能以设计报告。该报告设计器使用设计引擎生成报告设计文件。BIRT 报告消耗这些报告设计文件，然后在运行时使用设计时定义的查询获取适当的数据。在内存中生成分页报告，并以所需的输出格式发布，输出格式可以是\
  \ Microsoft Excel、分页 HTML、PDF、PostScript、Microsoft PowerPoint 或 Word 文件。要创建持久化报告，报告引擎会对数据进行转换和汇总，并将生成的报告缓存在中间二进制文件中。\n\
  \n这种缓存机制使得 BIRT 能够扩展以处理大量数据。BIRT 还提供了一个紧密集的图表组件，支持在报告中包含各种图表。图表在运行时使用图表引擎渲染。该图表引擎支持创建独立于报告的图表输出。图\
  \ 5-4 阐了这种架构和流程。\n\n**图 5-4** BIRT 架构和流程\n\n![image](img/05fig04.jpg)\n\n### 关于\
  \ BIRT 应用程序\n\n共有三个 BIRT 应用程序：BIRT Report Designer、BIRT RCP Report Designer 和 BIRT\
  \ Report Viewer。这两个报告设计器非常相似。BIRT Report Designer 作为一组 Eclipse 插件运行，并允许你在 Eclipse\
  \ 工作区构建报告。BIRT RCP Report Designer 拥有基于 Eclipse 客户端平台的简化报告设计界面。\n\n#### 关于 BIRT\
  \ Report Designer 和 BIRT RCP Report Designer\n\nBIRT Report Designer 是一个图形报告设计工具。BIRT\
  \ Report Designer 使用设计引擎根据报告对象模型（ROM）生成报告设计文件。ROM 支持标准的 BIRT 报告项和自定义报告项。BIRT Report\
  \ Designer 还支持通过将报告设计保存为模板来复用报告设计。你还可以将单个报告组件保存到组件库中，以便其他报告设计可以使用这些组件。\n\nBIRT RCP\
  \ Report Designer 和 BIRT Report Designer 之间的主要功能差异是：• BIRT RCP Report Designer 没有集成调试器。\n\
  \n• BIRT RCP Report Designer 不支持 Java 事件处理器。\n\n除了这些差异，这两个报告设计器的功能是完全相同的，本章后续所有提到\
  \ BIRT Report Designer 的地方同样适用于 BIRT RCP Report Designer。\n\n#### 关于 BIRT Viewer\n\
  \nBIRT 提供了 BIRT Viewer Web 应用程序，它包含了部署到大多数 J2EE 应用程序服务器所需的文件。该 Web 应用程序支持运行报告并查看分页\
  \ HTML（带有目录和书签），以及提取数据到值文件中。URL 提供了这种集成级别。主机应用程序将报告请求转发给 BIRT Viewer，并允许用户直接与报告交互。\n\
  \n\n\n\nBIRT Viewer 也可以以 Eclipse 插件的形式提供。该插件用于报告设计器内部，以便在开发过程中预览和显示报告。在 BIRT 报告设计器中，它被部署并与\
  \ `Eclipse Tomcat` 应用服务器插件协同工作。当产生报告请求时，Eclipse 工作空间会启动 Tomcat 应用并启动 BIRT Viewer。\n\
  \n#### 关于 BIRT 引擎和服务\n\n引擎是一组 `Java` （接口，它们在特定领域内提供基础功能。BIRT 包含多个引擎，例如报告引擎、设计引擎和图表引擎。这些引擎提供了多种不同类型的服务。服务是一组\
  \ `Java` 类，它们使用来自不同引擎提供的 API 来提供功能。例如，生成服务分别使用设计引擎 API 和报告引擎 API 来生成报告并产生报告文档。\n\
  \n#### 关于设计引擎\n\n设计引擎包含了用于验证和生成报告设计文件的 API。BIRT 报告设计器以及任何生成 BIRT 报告设计的自定义 `Java`\
  \ 应用程序都会使用设计引擎。生成服务在构建报告文档时也会使用设计引擎。设计引擎包含了根据 `ROM` 规范验证设计文件元素和结构性的 API。\n\n####\
  \ 关于报告引擎\n\nBIRT 报告引擎允许由 BIRT 报告设计器创建的 XML 报告设计被 `J2EE/Java` 应用程序使用。为了支持此功能，报告引擎提供了两个核心服务：生成和展示。\n\
  \n报告引擎提供了扩展以支持自定义项目和自定义输出格式。报告引擎还支持希望将强大的报告生成和查看能力集成到其应用程序中的 `Java` 开发者，而无需从底层 `Java`\
  \ 组件开始构建基础设施。\n\nBIRT 报告引擎 API 支持将 BIRT 的运行时集成到 `Java` 应用程序中。报告引擎提供了指定报告参数的能力、运行报告以产生\
  \ `HTML`、`PDF`、`DOC`、`PS` 或 `PPT` 输出并获取图像或图表。\n\n#### 关于生成服务\n\n报告引擎中的生成服务连接到报告设计中指定的数据源，使用数据引擎检索并处理数据，创建报告布局并生成报告文档。报告内容可以使用展示服务立即查看，也可以保存以供以后使用。包含数据快照视图的已保存报告文档可以保留以供随时间的使用和比较。\n\
  \n### 关于展示服务\n\n展示服务处理由生成服务创建的报告文档，并根据请求格式和设计中指定的布局渲染报告。展示服务使用数据引擎从报告文档中检索和处理数据。展示服务使用所需的任何发射器（emitter）来生成请求格式的报告。BIRT\
  \ 有多个标准发射器：`HTML` `PDF`、`DOC`、`PPT`、`PS` 和 `XLS`。BIRT 还支持修改这些默认格式或交付新格式的自定义发射器。\n\
  \n展示引擎和服务的扩展为图表项目和自定义报告项目提供了显示能力。\n\n#### 关于图表引擎\n\n图表引擎包含了生成图表并与数据源数据关联的 API。BIRT\
  \ 报告查看器解释报告设计中的任何图表信息，并使用图表引擎生成设计指定的图表。图表引擎的使用不受 BIRT 应用程序的限制。任何 `Java` 应用程序都可以使用图表引擎\
  \ API 创建并显示图表。\n\n#### 关于数据引擎和服务\n\n数据引擎包含了检索和转换数据的 API 和服务。数据服务从源检索数据按照报告设计处理数据。当被生成引擎使用时，数据服务从设计中指定的数据源检索数据。当被展示引擎使用时，数据服务从报告文档检索数据。`ODA`\
  \ 的数据引擎扩展为数据源提供了连接方法和驱动程序。\n\n#### 关于数据服务\n\n数据引擎提供两种关键服务类型：数据访问服务和数据转换服务。数据访问服务与\
  \ `ODA` 框架通信以检索数据。数据转换服务对数据服务返回的数据执行排序、分组、聚合和过滤等操作。\n\n#### 关于 ODA 框架\n\nBIRT 使用\
  \ Eclipse Data Tools Platform 项目提供的 `ODA` 框架来管理 `ODA` 和原生驱动程序、加载驱动程序、打开连接以及管理数据请求。`ODA`\
  \ 框架包含了支持添加自定义 `ODA` 驱动程序的扩展点。如果您有 BIRT 不支持且不需要脚本化数据源，请编写自定义 `ODA` 驱动程序。使用自定义 `ODA`\
  \ 驱动程序可能不仅需要扩展数据引擎，还需要扩展 BIRT 报告设计器。如果数据源需要用户界面组件来指定数据集和数据源属性，则需要 BIRT 报告设计器扩展。\n\
  \n## 关于 BIRT 报告项目类型\n\n报告项目是报告的视觉组件，例如标签、列表或图表。BIRT 中的报告项目有三类：标准报告项目、自定义报告项目和图表报告项目。\n\
  \n#### 关于标准报告项目\n\n报告项目是报告的视觉组件。报告项目可以是简单的标签，也可以是复杂的交叉表（cross tab）。每个报告项目在 BIRT\
  \ 报告设计器的调色板视图中都有一个图标。\n\n### 关于自定义报告项目\n\n自定义报告项目可以是新的报告项目，也可以现有报告项目的扩展。报告项目扩展的示例是添加属性（如颜色）。新报告项目的示例是旋转文本报告项目，它是报告项目扩展的引用实现。\n\
  \n创建新报告项目和扩展现有报告项目都涉及通过 Eclipse 插件机制扩展 BIRT。自定义项目需要对以下组件之一或多个进行扩展以支持新项目：\n\n- BIRT\
  \ 报告设计器\n扩展 BIRT 报告设计器为报告开发者提供了用户界面组件，用于指定报告项目的属性和其他设置。\n\n- 设计引擎\n扩展设计引擎用于验证由报告开发者提供的报告项目设置。\n\
  \n- 报告引擎\n扩展报告引擎支持为该报告项目生成和展示报告输出。\n\n#### 关于图表报告项目\n\n图表报告项目是作为 BIRT 扩展实现的标准 BIRT\
  \ 组件。创建图表报告项目的用户界面是一个图表生成器（chart builder），它会引导报告开发者完成设计图表并将其与适当的数据列关联的过程。\n\n####\
  \ 关于报告对象模型 (ROM)\n\n`ROM` 是 BIRT 基于的基础模型。`ROM` 是报告设计结构、语法和语义的规范。`ROM` 的正式表达式是通过\
  \ XML 架构和语义定义文件实现的。`ROM` 规范出现在以下插件 JAR 文件中：\n\n`$INSTALL_DIR\\eclipse\\plugins\\\
  `\n`org.eclipse.birt.report.model_<version>.jar`\n\n#### 关于 BIRT 文件类型\n\nBIRT 报告设计器使用四种文件：\n\
  \n- 报告设计文件\n- 报告文档文件\n- 报告库文件\n- 报告模板文件\n\n以下章节提供了对这些文件类型的简要概述。\n\n#### 关于报告设计文件\n\
  \n\n\n\n报告设计文件是一个 XML 文件，其中包含了报告设计，即对 `BIRT` 报告的完整描述。报告设计描述了报告的每一个方面，包括其结构、格式、数据源、数据集、JavaScript\
  \ 事件处理器代码以及 Java 事件处理器的名称。`BIRT Report Designer` 负责创建报告设计文件，并由 `BIRT` 报告引擎对其进行处理。\n\
  \n报告设计文件的扩展名为 `rptdesign`。\n\n#### 关于报告文档文件\n\n报告文档文件是一个二进制文件，它封装了报告设计，整合了数据，并包含了额外信息，例如数据行、分页信息和目录信息。\n\
  \n报告文档文件的扩展名为 `rptdocument`。\n\n#### 关于报告库文件\n\n报告库文件是一个 XML 文件，包含了可重用和可共享的 `BIRT`\
  \ 报告组件。报告开发者使用 `BIRT Report Designer` 中的 `Resource Explorer` 来提供库的共享访问、更新库以及使用库中的报告元素。\n\
  \n`BIRT` 报告库可以包含任何报告元素，例如：\n\n• 数据集和数据源\n• 嵌入图像\n• 事件处理器代码\n• 样式\n• 可视化报表项目\n\n\
  报告库文件的扩展名为 `rptlibrary`。\n\n## 关于报告模板文件\n\n报告模板是一个 XML 文件，包含一个可重用的设计。报告开发者可以使用模板作为开发新报告的基础。报告开发者使用报告模板来维护一组报告设计之间的一致样式，并简化报告设计流程。报告模板可以指定报告的许多不同元素，包括：\n\
  \n• 一个或多个数据源\n• 一个或多个数据集\n• 报告设计布局的部分或全部，包括网格、表格、列表和其他报表项目\n• 分组、过滤和数据绑定定义\n• 样式\n\
  • 库组件\n• 主页\n• 备忘页\n\n报告模板是报告开发的起点。它们通过捕捉常见类型报告的布局来加速报告开发。它们还让创建外观一致的报告变得简单。构建 `BIRT`\
  \ 模板与构建 `BIRT` 报告相似。其区别在于将报告项目转换为作为占位符的模板报告项目。\n\n报告模板文件的扩展名为 `rpttemplate`。\n\n\
  #### 关于自定义 Java 应用\n\nJava 开发者可以使用 `BIRT` APIs 创建自定义报告设计器或自定义报告生成器。\n\n#### 关于自定义报告设计器\n\
  \n自定义报告设计器是 Java 开发者创建的 Java 应用程序，用于根据特定需求生成格式良好的报告设计文件。自定义报告设计器并不一定包含用户界面。自定义报告设计器的典型示例是一个\
  \ Java 应用程序，它根据业务逻辑动态确定报告的内容、结构或数据源。自定义报告设计器使用与 `BIRT Report Designer` 相同的设计引擎 API。\n\
  \n#### 关于自定义 Java 报告生成器\n\n自定义 Java 报告生成器的功能与 `BIRT` 报告生成器相同，通常集成到 Web 应用程序或独立的\
  \ Java 应用程序中。自定义 Java 报告生成器使用引擎 API 读取报告设计文件并生成报告。自定义 Java 报告生成器可以使用业务逻辑来实现安全性需求、控制内容并确定输出格式。\n\
  \n#### 关于 BIRT 扩展\n\n通过其公共 APIs 和 `BIRT` 扩展框架，`BIRT` 允许 Java 开发者扩展 `BIRT` 的功能。`BIRT`\
  \ 使用 Eclipse 扩展来扩展框架的功能。`BIRT` 提供的扩展点支持创建新的图表类型、额外的数据源、报告控件以及用于渲染到额外输出的发射器（emit）。这些扩展点对具有特殊数据访问和格式化需求的用户具有吸引。以下列表显示了一些可能的自定义扩展：\n\
  \n• 自定义报告项目\n自定义报告项目是报告项目扩展。该报告项目可以是一个扩展、现有的 `BIRT` 报告项目或一个新的报告项目。\n\n• 自定义 ODA\
  \ 数据源驱动程序\n自定义 ODA 数据源驱动程序是自定义的 `ODA` 扩展，用于连接到 `BIRT` 直接支持以外的数据源类型。\n\n• 自定义报告发射器\n\
  自定义报告发射器生成除 HTML 或 PDF 以外格式的报告。\n\n本书后续章节将提供所有这些类型扩展的完整示例。\n\n### 第 6 章 理解报告对象模型\n\
  \n本章概述了 `BIRT` 报告对象模型（`ROM`）以及构成该模型的主要元素。`ROM` 定义了构建有效报告设计文件的规则，其定义方式与 `HTML` 定义构建有效网页的规则非常相似。因此，`ROM`\
  \ 是 `BIRT` 报告设计、模板或库文件的模型，就像 `HTML` 是网页的模型一样。有关 `ROM` 的每个组件的信息，请参阅 `BIRT` 程序员参考中的在线帮助条\
  \ `Report Object Model (ROM) Definitions Reference`。\n\n#### 关于 ROM 规范\n\n`ROM`\
  \ 规范定义了一组描述报告视觉和非视觉组件的 XML 元素。`BIRT Report Designer` 用于描述报告设计、库或模板生成的 XML 文件完全由\
  \ `ROM` 元素组成。视觉组件被称为报告项目，包括数据项、标签和表格。`ROM` 还为扩展的报表项目（如图表和交叉表）提供了框架。非视觉组件（例如数据立方体、数据集、数据源、报告参数和样式）支持报告项目，但不会出现在报告中。`ROM`\
  \ 规范定义了元素、它们的属性以及元素与其他元素的关系。`ROM` 规范通过元素的方法、属性、插槽（slots）和样式来描述元素。`ROM` 元素描述了：\n\n\
  • 用于填充报告的数据源和查询\n• 报告项目的位置、大小、样式和结构\n• 报告布局\n\n报告设计、模板或库文件包含了描述 `ROM` 元素的 XML 元素。`BIRT`\
  \ 设计引擎使用 `ROM` 规范和 `ROM` schema 来解释 `ROM` 元素。`ROM` 规范描述了每种报告元素类型。`ROM` schema 描述了文件中\
  \ XML 的结构。每个 `BIRT` 文件类型都出现在 `ROM` schema 中。检查 `BIRT` 文件和 `ROM` schema 可以发现模板的结构与报告设计相同。\n\
  \n`BIRT Report Designer` 显示设计引擎解释的元素。可视化报告项目出现在布局窗口。数据相关项目（如立方体、数据集和报告参数）出现在数据资源管理器中。报告设计中的所有元素出现在大纲视图。\n\
  \n#### ROM 方法\n\n`ROM` 元素可以拥有一个或多个方法，称为事件处理器。`BIRT` 在执行报告过程中会触发许多事件。当 `BIRT` 触发事件时，相应的事件处理器执行以处理该事件。默认情况下，事件处理器是空方法。通过为事件处理器提供代码，报告开发者可以自定义并扩展\
  \ `BIRT` 的功能。为事件处理器提供代码被称为脚本。\n\n#### ROM 属性\n\n\n\n\n\nROM 元素属性是有类型的。属性类型类似于编程中的变量类型或数据库术语中的数据类型。与变量和数据类型一样，ROM\
  \ 属性类型可以是简单的也可以是复杂的。`Design.xsd` 定义了这些类型。简单类型包括颜色、尺寸、数字和字符串。复杂类型包括列表和结构。复杂类型包含多个组件。例如，文本类型同时包含文本本身和用于文本国际化的资源键。\n\
  \n## ROM 槽 (slots)\n\nROM 槽是定义类型元素的容器。例如，报告元素有一个 `Body` 槽，其中可以包含任意数量的任何类型的报告项目。报告元素中的\
  \ `Styles` 槽仅包含 `Style` 项目，这些项目是该报告可用的样式。\n\n## ROM 样式 (styles)\n\nROM 样式系统基于级联样式表\
  \ (CSS)，其中容器中设置的样式会级联到其内容。`Report` 元素包含所有其他元素，因此 `Report` 元素的 `style` 属性定义了整个报告的默认样式。报告中的元素可以覆盖默认样式。报告开发人员可以从定义的样式集中选择样式，也可以创建一个新样式。典型的样式属性包括对齐方式、背景图像、颜色和文本大小。\n\
  \n## 关于 ROM Schema (schema)\n\nROM Schema 使用 XML Schema 语言编写，封装了 ROM 规范。XML Schema\
  \ 提供了一种定义 XML 文件结构、内容和语义的标准方法。XML Schema 类似于文档类型定义 (DTD)。因此，ROM Schema 包含了 ROM 报告设计的内容、结构和语义的正式表达式。ROM\
  \ Schema `design.xsd` 位于：\n\n[`http://www.eclipse.org/birt/2005/design`](http://www.eclipse.org/birt/2005/design)\n\
  \n`Design.xsd` 也存在于插件 `org.eclipse.birt.report.model` 中。\n\n每个报告设计、库或模板文件的顶部都会出现一条类似于下方的语句：\n\
  \n```xml\n<report xmlns=\"http://www.eclipse.org/birt/2005/design\" version=\"3.2.21\"\
  \ id=\"1\">\n```\n\nBIRT 使用此语句（通过它识别 schema 版本）来解释文件结构。如果文件包含 schema 中未定义的元素或违反了\
  \ schema 中规则的元素，则该文件为无效。\n\n使用如 XMLSpy 等感知 schema 的工具打开文件，支持根据 schema 验证文件。使用感知\
  \ schema 的工具还可以让自定义报告设计器的开发者验证自定义报告设计器的输出。\n\nROM Schema 定义了语法，支持在不更改实际 schema 的情况下对\
  \ BIRT 进行扩展。例如，一个扩展项使用以下标签：\n\n```xml\n<extended-item name=\"extension\">\n```\n\
  \nROM Schema 使用以下语法定义属性：\n\n```xml\n<property name=\"propertyName\">value</property>\n\
  ```\n\nROM Schema 并不定义任何实际属性。ROM 元素属性定义在另一个文件 `rom.def` 中。\n\n## 关于 rom.def 文件\n\
  \n`rom.def` 文件包含了定义特定 ROM 元素、其属性、槽位和方法的元数据。你可以在以下位置找到 `rom.def`：\n\n`$INSTALL_DIR\\\
  eclipse\\plugins\\org.eclipse.birt.report.model_<version>.jar`\n\n`rom.def` 文件是设计引擎用于为\
  \ ROM 元素呈现属性表的内部文件。元素的属性表包含该元素的属性及其类型、元素的方法，以及元素每个属性的有效可选值。当 BIRT 开发团队更改 ROM 元素的结构时，被更改的项将包含一个属性，显示发生该更改的\
  \ BIRT 版本，例如：\n\n```xml\n<Structure displayNameID=\"Structure.FormatValue\" name=\"\
  FormatValue\" since=\"2.6\">\n```\n\n`rom.def` 文件指定了以下类型的元数据：\n\n- **Choice (选择)**：选择定义指定了属性可以的所有允许值。大多数选择定义与样式属性。以下来自\
  \ `rom.def` 的示例定义了 `fontFamily` 样式规范可用的所有字体族：\n\n```xml\n<ChoiceType name=\"fontFamily\"\
  >\n  <Choice displayNameID=\"Choices.fontFamily.serif\" name=\"serif\" />\n  <Choice\
  \ displayNameID=\"Choices.fontFamily.sans-serif\" name=\"sans-serif\" />\n  <Choice\
  \ displayNameID=\"Choices.fontFamily.cursive\" name=\"cursive\" />\n  <Choice displayNameID=\"\
  Choices.fontFamily.fantasy\" name=\"fantasy\" />\n  <Choice displayNameID=\"Choices.fontFamily.monospace\"\
  \ name=\"monospace\" />\n</ChoiceType>\n```\n\n- **Class (类)**：类定义定义了一个报告设计应用程序可以通过\
  \ BIRT 模型 API 访问的 Java 类。类定义描述了以下组件类型：\n    - 数据类型，如 `Array`、`Number` 和 `String`\n\
  \    - 功能类，如 `Global`、`Math` 和 `RegExp`\n\n类定义定义了属性、构造函数、本地化、成员和方法标识符。以下来自 `rom.def`\
  \ 的示例显示了 `Number` 类的部分定义：\n\n```xml\n<Class displayNameID=\"Class.Number\" name=\"\
  Number\" native=\"true\" toolTipID=\"Class.Number.toolTip\">\n  <Constructor displayNameID=\"\
  Class.Number.Number\" name=\"Number\" returnType=\"Number\" toolTipID=\"Class.Number.toolTip\"\
  >\n    <Argument name=\"value\" tagID=\"Class.Number.value\" type=\"Object\"/>\n\
  \  </Constructor>\n  <Member dataType=\"number\" displayNameID=\"Class.Number.MAX_VALUE\"\
  \ is=\"true\" name=\"MAX_VALUE\" toolID=\"Class.Number.toolTip\"/>\n  <Member dataType=\"\
  number\" displayNameID=\"Class.Number.MIN_VALUE\" is=\"true\" name=\"MIN_VALUE\"\
  />\n  <Method displayNameID=\"Class.Number.toExponential\" name=\"toExponential\"\
  \ returnType=\"String\" toolID=\"Class.Number.toolTip\">\n    <Argument name=\"\
  digits\" tagID=\"Class.Number.toExponential.digits\" type=\"number\"/>\n  </Method>\n\
  \  <Method displayNameID=\"Class.Number.toFixed\" name=\"toFixed\" returnType=\"\
  String\" toolID=\"Class.Number.toolTip\">\n    <Argument name=\"digits\" tagID=\"\
  Class.Number.toFixed.digits\" type=\"number\"/>\n  </Method>\n</Class>\n```\n\n\
  - **Element (元素)**：`rom.def` 文件包含每个 ROM 元素的定义。元素定义包含属性，例如元素的名称、显示名称以及它扩展的元素类型。ROM\
  \ 在元素定义中支持方法、属性、可见性、槽和样式属性。以下来自 `rom.def` 文件的示例说明了一个元素定义：\n\n```xml\n<Element allowsUserProperties=\"\
  true\" canExtend=\"true\" displayNameID=\"Element.Parameter\" extends=\"ReportElement\"\
  \ hasStyle=\"false\" isAbstract=\"true\" isNameRequired=\"true\" name=\"Parameter\"\
  \ nameSpace=\"parameter\" since=\"1.0\">\n  <Property displayNameID=\"Element.Parameter.helpText\"\
  \ name=\"helpText\" runtimeSettable=\"false\" since=\"1.0\" type=\"string\"/>\n\
  \  <Property displayNameID=\"Element.Parameter.helpTextID\" name=\"helpTextID\"\
  \ type=\"resourceKey\"/>\n  <Property displayNameID=\"Element.Parameter.promptText\"\
  \ name=\"promptText\" runtimeSettable=\"false\" since=\"2.0\" type=\"string\"/>\n\
  \  <Property displayNameID=\"Element.Parameter.promptTextID\" name=\"promptTextID\"\
  \ since=\"2.1\" type=\"resourceKey\"/>\n  <Property displayNameID=\"Element.Parameter.hidden\"\
  \ name=\"hidden\" runtimeSettable=\"false\" since=\"1.0\" type=\"boolean\">\n  \
  \  <Default>false</Default>\n  </Property>\n  <Method context=\"factory\" displayNameID=\"\
  Element.Parameter.validate\" name=\"validate\" returnType=\"boolean\" since=\"2.5\"\
  \ toolTipID=\"Element.Parameter.validate.toolTip\">\n    <Argument name=\"reportContext\"\
  \ tagID=\"Element.Parameter.validate.reportContext\" type=\"org.eclipse.birt.report.engine.api.script.IReportContext\"\
  />\n  </Method>\n</Element>\n```\n\n\n\n\n</Element>\n\n`visibility` 属性指定 BIRT 是否将继承的属性暴露给用户界面。例如，`label`\
  \ 元素扩展了 `ReportItem`，而后者拥有 `dataSet` 和 `dataBindingRef` 属性。由于 `label` 不绑定数据，因此 `label`\
  \ 元素继承的属性不应对用户可见。以下示例展示了如何使用属性可见性来隐藏这些属性：\n\n```xml\n<Element canExtend=\"true\"\
  \ displayNameID=\"Element.Label\"\n    extends=\"ReportItem\" isAbstract=\"false\"\
  \n    javaClass=\"org.eclipse.birt.report.model.elements.Label\"\n    name=\"Label\"\
  \ selector=\"label\" since=\"1.0\" xmlName=\"label\">\n    ...\n    <PropertyVisibility\
  \ name=\"dataSet\" visibility=\"hide\"/>\n    <PropertyVisibility name=\"dataBindingRef\"\
  \ visibility=\"hide\"\n    />\n    ...\n</Element>\n```\n\n`Slot` 属性将元素定义为容器，并指定该槽位包含的项类型。槽位出现在\
  \ BIRT 视图（如 `Outline`）的用户界面中。以下示例插图了一个槽位的定义：\n\n```xml\n<Element allowsUserProperties=\"\
  true\" canExtend=\"true\"\n    displayNameID=\"Element.CascadingParameterGroup\"\
  \n    extends=\"ParameterGroup\" hasStyle=\"false\" isAbstract=\"false\"\n    isNameRequired=\"\
  true\" javaClass=\"org.eclipse.birt.report\n    .model.elements.CascadingParameterGroup\"\
  \n    name=\"CascadingParameterGroup\" since=\"2.0\"\n    xmlName=\"cascading-parameter-group\"\
  >\n    ...\n    <Slot displayNameID=\"Element.CascadingParameterGroup.slot\n   \
  \ .parameters\" multipleCardinality=\"true\" name=\"parameters\"\n    since=\"2.0\"\
  \ xmlName=\"parameters\">\n        <Type name=\"ScalarParameter\"/>\n        <Trigger\
  \ validator=\"CascadingParameterTypeValidator\"/>\n    </Slot>\n</Element>\n```\n\
  \n`style` 属性定义了 `ROM` 元素支持的样式组件。以下示例展示了数据元素的样式属性定义。`label` 元素的定义没有这些样式属性，因为它只包含字符串值，而不是数字。\n\
  \n```xml\n<Element allowsUserProperties=\"true\" canExtend=\"true\"\n    displayNameID=\"\
  Element.Data\" extends=\"ReportItem\"\n    hasStyle=\"true\" isAbstract=\"false\"\
  \ isNameRequired=\"false\"\n    javaClass=\"org.eclipse.birt.report.model.elements.DataItem\"\
  \n    name=\"Data\" selector=\"data\" since=\"1.0\" xmlName=\"data\">\n    ...\n\
  \    <StyleProperty name=\"numberFormat\"/>\n    <StyleProperty name=\"numberAlign\"\
  />\n    ...\n</Element>\n```\n\n### 结构 (Structure)\n\n结构是一种复杂的数据类型，通常由两个或更多成员组成。少数未来扩展的结构只有一个成员。以下来自\
  \ `rom.def` 示例说明了结构的定义。\n\n```xml\n<Structure displayNameID=\"Structure.TimeInterval\"\
  \n    name=\"TimeInterval\" since=\"2.5.2\">\n    <Member displayNameID=\"Structure.TimeInterval.measure\"\
  \n      isIntrinsic=\"true\" name=\"measure\" since=\"2.5.2\"\n      type=\"integer\"\
  />\n    <Member detailType=\"interval\"\n      displayNameID=\"Structure.TimeInterval.unit\"\
  \n      isIntrinsic=\"true\" name=\"unit\" since=\"2.5.2\"\n      type=\"choice\"\
  >\n      <Allowed>hour,minute,second</Allowed>\n    </Member>\n</Structure>\n```\n\
  \n### 样式 (Style)\n\n样式定义包含了 `rom.def` 中描述的任何类型元数据中最精少的信息。样式定义定义了样式的名称、显示名称和引用值，如下例所示。\n\
  \n```xml\n<Style displayNameID=\"Style.Report\" name=\"report\"\n    reference=\"\
  Overall default\" />\n```\n\n### 验证器 (Validator)\n\n验证器定义指定了一个用于执行验证的 Java 类。其中两个验证器类用于验证值。其余的都是语义验证器。以下来自\
  \ `rom.def` 示例说明了语义验证器的定义。\n\n```xml\n<SemanticValidator\n    class=\"org.eclipse.birt.report.model.api.validators\n\
  \    .CascadingParameterTypeValidator\" modules=\"design, library\"\n    name=\"\
  CascadingParameterTypeValidator\" />\n```\n\n#### 理解 ROM 元素\n\nROM 元素定义在层次结构中。抽象元素（无法直接在\
  \ BIRT 文件中使用）位于每个层次结构的顶部。这些元素定义了具体元素的关键特征，就像 Java 中的抽象类定义具体类要实现的方法和变量一样。报告设计由具体元素组成。\n\
  \n#### 关于核心 ROM 元素\n\n核心 ROM 元素由派生元素的抽象元素组成。以下是抽象元素：\n\n- `DataSet`: `DataSet` 定义了数据集的属性。\n\
  - `DataSource`: `DataSource` 定义了数据元素必须支持的方法。\n- `DesignElement`: `DesignElement`\
  \ 定义了 ROM 的基本功能。\n- `Listing`: `Listing` 是列表和表格项的抽象基。这两个项都支持数据集、过滤和方法。\n- `MasterPage`:\
  \ `MasterPage` 定义了页的基本属性。\n- `ReportElement`: `ReportElement` 代表任何可以命名和自定义的项。它包含了样式、主页和报告项等元素。\n\
  - `ReportItem`: `ReportItem` 是视觉元素的基元素。报告项包含样式并为报告中出现的任何元素提供视觉特征。\n\n以下具体元素描述了 BIRT\
  \ 文件的根元素：\n\n- `ReportDesign`: `ReportDesign` 包含关于设计的信息，定义了整个设计的属性。它是报告设计或模板的根元素。\n\
  - `Library`: `Library` 与 `ReportDesign` 类似，扩展了 `LayoutModule`，但具有不同的槽位且没有方法。\n\n\
  #### 关于报告项元素\n\nBIRT 提供了许多类型的视觉组件。每种视觉组件都有对应的派生自 `ReportItem` 的 ROM 元素。视觉组件被称为报告项。每个报告项在调板中都有条目，报告开发者使用调板来构建报告布局。\n\
  \n##### 关于报告项\n\nBIRT 提供了容器项和简单项。容器项是结构化组件，提供了槽位来放置一个或多个报告项。容器项中的槽位支持容器和简单报告项，因此网格可以包含表格，以此此类推。简单项不是结构化的，且不包含其他项。这些报告项具有描述其行为和外观的属性，但不提供槽位。例如，`Image`\
  \ 元素就是一个简单项。\n\n容器报告项示例包括：\n\n- `Grid`: `grid` 包含一组排列成具有固定列行的矩阵的报告项。网格中的每个单元格可以包含一个或多个简单或容器报告项。\n\
  - `List`: `list` 包含基于从数据集检索的数据任意内容。当某些报告项需要复杂的布局并为查询中的每行重复该布局时，`list` 是合适的。\n- `Table`:\
  \ `table` 包含一组排列成矩阵的报告项。`table` 具有固定的列和任意数量的行。`table` 为从数据集检索的每行数据生成一个详细行。\n\n#####\
  \ 理解报告项元素属性\n\n每种报告项除了继承自 `ReportItem` 的属性外，都有自己的一套属性。继承属性的类型包括：\n\n\n\n\n- `Method`，定义可执行代码。\n\
  - `Property`，包含名称和维度等值。\n- `Slot`，包含 `Type` 元素以定义其内容，如下所示元素定义所示。\n\n```xml\n<Slot\
  \ name=\"reportItems\"\n    displayNameID=\"Element.FreeForm.slot.reportItems\"\n\
  \    multipleCardinality=\"true\">\n    <Type name=\"Label\" />\n    <Type name=\"\
  Data\" />\n    <Type name=\"Text\" />\n</Slot>\n```\n\n- `StyleProperty`，定义样式相关的特征，例如颜色和字体大小。\n\
  \n#### 关于数据报告元素\n\nROM 规范中的几个元素适用于数据而非视觉报告条目。这些数据报告元素描述了数据源和数据集。以下元素是数据报告元素：\n\n\
  - `OdaDataSource`\n  `OdaDataSource` 元素表示与外部数据系统的连接，例如 RDBMS、文本文件或 XML 文件。\n\n-\
  \ `ScriptedDataSource`\n  `ScriptedDataSource` 元素表示与非 ODA 数据源的外部数据系统的连接。开发者必须提供打开和关闭脚本数据源的脚本。`ScriptedDataSource`\
  \ 继承自 `DataSource`。\n\n- `OdaDataSet`\n  `OdaDataSet` 元素表示从数据源检索的表格结果集。`OdaDataSet`\
  \ 元素定义了数据源、查询、过滤器、参数和结果集列。\n\n- `JointDataSet`\n  `JointDataSet` 元素表示由多个数据集连接产生的数据集。\n\
  \n- `ScriptedDataSet`\n  `ScriptedDataSet` 元素表示与脚本数据源关联的数据集。开发者必须提供打开、关闭和从脚本数据源获取某行的脚本。\n\
  \n# 第三部分：报告设计中的脚本编写\n\n![image](img/part-opener-03.jpg)\n\n## 第 7 章：在报告设计中使用脚本\n\
  \nBIRT 提供了强大的脚本能力，允许报告开发者创建自定义代码来控制报告创建的各个方面。本章提供了 BIRT 脚本编写的概述。后续章节将重点介绍如何使用 JavaScript\
  \ 和 Java 中实现脚本事件处理程序、为图表编写事件处理程序，以及使用脚本数据源访问数据。\n\n### BIRT 脚本概述\n\nBIRT 报告设计器支持使用\
  \ Java 和 JavaScript 编写自定义事件处理程序。BIRT RCP 报告设计器仅支持使用 JavaScript 编写自定义事件处理程序。\n\n\
  ### 在 JavaScript 和 Java 之间选择\n\n在编写事件处理程序时，JavaScript 和 Java 均有优缺点。对于只熟悉其中一种语言的开发者来说，使用熟悉语言的优势是显而易见的，但对于其他人来说，决定取决于报告需求。\n\
  \n使用 JavaScript 编写事件处理程序的优势包括：\n\n- **易于为特定事件处理程序添加简单脚本**\n  在报告中添加 JavaScript 事件处理程序比添加用\
  \ Java 编写的事件处理程序简单。要编写 JavaScript 事件处理程序，不需要在 Eclipse 中创建 Java 环境，也不需要学习 Eclipse\
  \ 的 Java 开发流程。不需要指定包、实现接口或了解你所编写的事件处理程序的参数。\n  要添加 JavaScript 事件处理程序，首先从 `Script`\
  \ 选项卡上的下拉列表中选择事件处理程序的名称。然后输入代码。\n\n- **更简单的语言结构、更宽松的类型和更不严格的语言规则**\n  由于要求更宽松，JavaScript\
  \ 的编码要求比 Java 低。\n\n使用 Java 编写事件处理程序的优势包括：\n\n- **可用的 Eclipse Java 开发环境**\n  Eclipse\
  \ Java 开发环境非常强大，包含了自动补全、上下文相关帮助、键盘快捷键和参数提示等功能。\n\n- **易于查找和查看事件处理程序**\n  报告的所有 Java\
  \ 事件处理程序都存在于可见的 Java 文件中。相比之下，JavaScript 事件处理程序被嵌入在设计中，你一次只能查看一个处理程序。\n\n### 同时使用\
  \ JavaScript 和 Java\n\n并不要求所有事件处理程序都用同一种语言编写。你可以用 JavaScript 写一些，用 Java 写另一些。如果同一个事件同时存在\
  \ JavaScript 和 Java 事件处理程序，BIRT 将使用 JavaScript 处理程序。\n\n### 事件概述\n\n在编写事件处理程序时，理解事件顺序是关重要的。事件触发的顺序取决于多个因素。这些因素包括正在执行哪种\
  \ BIRT 处理阶段、执行该过程的引擎任务以及正在处理什么种事件类型。\n\n### 引擎任务过程\n\n脚本章节经常引用引擎任务过程。本节概述了这些过程是什么以及它们如何影响脚本编写。\n\
  \n执行报告的报告引擎是以任务为导向的，提供了三个与报告执行和渲染相关的任务。这些任务分别是 `RunAndRenderTask`、`RunTask` 和 `RenderTask`。\n\
  \n`RunAndRenderTask` 使用一个进程打开报告设计并产生特定的输出（如 PDF）。`RunTask` 打开报告设计并执行报告，生成具有 `.rptdocument`\
  \ 扩展名的报告文档文件。该报告文档是一个中间二进制文件，随后供 `RenderTask` 使用以产生报告输出类型，例如 HTML、PDF、PPT、PS、Word\
  \ 或 XLS。`RenderTask` 打开报告文档（`.rptdocument`）并渲染相应的输出格式。此任务可以在 `RunTask` 之后的任何时间执行。此任务甚至可以在单独的系统中发生。\n\
  \nBIRT 报告设计器使用报告引擎显示报告预览。在编辑器中选择 `Preview`（预览）会启动 `RunAndRenderTask` 来生成报告。在 BIRT\
  \ 报告设计器工具栏中选择任何其他预览选项都会启动 `RunAndRenderTask` 生成输出，但 BIRT Web Viewer 中的“运行报告”除外，它是使用\
  \ `RunTask` 生成报告的。\n\n`RunTask` 和 `RenderTask` 任务在需要分开执行时可以使用。因此，分开运行和渲染任务需要两个进程来运行和渲染报告。\n\
  \n当 `RunAndRenderTask` 处理报告时，其事件触发顺序与 `RunTask` 和 `RenderTask` 作为两个进程使用时不同。\n\n\
  这些处理差异将在这些章节中讨论。\n\n后续部分描述了报告引擎如何在 Designer 环境中处理报告。\n\n#### BIRT Web Viewer\n\n\
  示例 BIRT Web Viewer 是一个 J2EE 应用程序，它封装了报告引擎以产生报告。该查看器包含三个用于生成报告的 Servlet 映射。这些分别是\
  \ `frameset`、`run` 和 `preview`。\n\n在示例查看器中，通过两个进程 `RunTask` 和 `RenderTask` 生成并渲染到输出格式以创建报告。在\
  \ Web Viewer 工具栏中选择导出报告图标会启动 `RenderTask` 在当前报告文档上执行。\n\n### BIRT 处理阶段\n\n用于生成和演示报告数据的\
  \ BIRT 服务在以下处理阶段创建报告：\n\n- **准备阶段 (Preparation)**\n  `RunTask` 或 `RunAndRenderTask`\
  \ 准备报告项。\n\n- **生成阶段 (Generation)**\n  `RunTask` 或 `RunAndRenderTask` 创建每个报告项的实例、连接数据源、执行数据集并处理数据以生成报告。\n\
  \n- **演示阶段 (Presentation)**\n  `RenderTask` 或 `RunAndRenderTask` 选择正确的发射器（emitters）以产生报告指定的输出。\n\
  \n`RunTask` 处理准备和生成阶段，`RenderTask` 处理演示阶段。`RunAndRenderTask` 处理报告的所有阶段。事件的类型及其触发的顺序取决于引擎任务中当前执行的处理阶段。\n\
  \n\n\n\n\nBIRT 支持以下类型的事件：\n\n* 参数\n* 报表设计\n* 数据源和数据集\n* 报表项目\n\n每种事件类型在报告处理过程中都会触发一系列事件。\n\
  \n##### 参数事件\n\nBIRT 目前支持两个参数级事件，可用于在参数输入框显示之前自定义参数选择和默认值。此外，BIRT 还支持一个在参数选择后调用的参数级事件。这些事件汇总在\
  \ 表 7-1 中。这些事件目前仅在 JavaScript 可。参数事件仅在报告包含参数时才会触发。\n\n**表 7-1** 参数事件\n\n![image](img/07tab01.jpg)\n\
  \n列表 7-1 提供了一个格式化为列表框的参数的 `getDefaultValueList` 和 `getSelectionValueList` 事件处理程序示例。数组\
  \ `dSLArray` 包含报告用户可以选择的四个值。数组 `dVLArray` 包含两个值，作为参数的默认值。当用户运行报告时，这些值会在可用列表中被选中。\n\
  \n**列表 7-1** 格式化为列表框的参数示例事件处理程序\n\n```javascript\n//getDefaultValueList\nvar dVLArray\
  \ = [];\ndVLArray[0]= \"10104\";\ndVLArray[1] = \"10108\";\ndVLArray;\n\n//getSelectionValueList\n\
  var dSLArray = [];\ndSLArray[0]= \"10101\";\ndSLArray[1]= \"10104\";\ndSLArray[2]=\
  \ \"10105\";\ndSLArray[3] = \"10108\";\ndSLArray;\n```\n\n`getDefaultValueList`\
  \ 对于提供日期参数也有用。\n\n如果在用户输入参数后需要更改参数，或者需要额外的参数验证，请为 `validate` 事件编写事件处理程序。以下示例显示了用于字符串参数的\
  \ validate 脚本：\n\n```javascript\nparams[\"MyParameter\"].value = \"Something Else\"\
  ;\ntrue;\n```\n\n### 报表设计事件\n\n报表设计事件对所有报告都会触发。表 7-2 描述了这些事件。这些事件支持通过事件处理程序对报表进行额外的处理。\n\
  \n**表 7-2** 报表设计事件\n\n![image](img/07tab02.jpg)\n\n![image](img/07tab02a.jpg)\n\n\
  ##### 数据源和数据集事件类型\n\n有多种数据源数据集。数据源可以是平面文件、JDBC 数据源、脚本数据源、Web 服务数据源或 XML 数据源。所有数据源都有一组公共事件处理程序。脚本数据源有两个额外的事件处理程序。\n\
  \n数据集事件可以被多次调用以支持多次聚合和数据集共享。不建议编写依赖数据集事件触发顺序的处理程序。另一个问题是，由于数据集缓存，数据集事件处理程序可能只调用一次。\n\
  \n表 7-3 描述了数据源事件。\n\n**表 7-3** 数据源事件\n\n![image](img/07tab03.jpg)\n\n数据源和数据集事件在使用它们的报表项目\
  \ `onCreate` 事件之前的生成阶段触发。数据集事件可能会触发多次。事件顺序将在本章稍后的部分进行详细介绍。表 7-4 描述了数据集事件。\n\n**表\
  \ 7-4** 数据集事件\n\n![image](img/07tab04.jpg)\n\n数据源和数据集事件在用于数据绑定项目之前触发。如果数据集在报告中从未被使用过，则数据源和数据集永远不会被调用。脚本数据集是访问脚本数据源的数据集。非脚本数据集访问标准数据源的数据集。使用脚本数据源和数据集编写自定义代码来获取数据值。\n\
  \n#### 脚本数据源事件\n\n脚本数据源包含所有数据源共有的 `afterOpen`、`afterClose`、`beforeOpen` 和 `beforeClose`\
  \ 事件，以及 `open` 和 `close` 事件。使用 `open` 和 `close` 事件的处理程序来执行打开和关闭数据源的操作。\n\n#### 脚本数据集事件\n\
  \n脚本数据集包含 `afterOpen`、`afterClose`、`OnFetch`、`beforeOpen`、`beforeClose`、`open`、`close`\
  \ 和 `fetch` 事件。使用 `open` 和 `close` 事件的处理程序来执行打开和关闭数据集的操作。使用 `fetch` 方法从数据源获取行数据。使用脚本数据集需要为\
  \ `fetch` 事件编写事件处理程序。\n\n#### 报表项目事件\n\n报表项目事件会在放置在报告中的报表项目触发。大多数项目支持为 表 7-5 中列出的事件编写事件处理程序。\n\
  \n**表 7-5** 报表项目事件\n\n![image](img/07tab05.jpg)\n\n### 事件顺序序列\n\n表 7-6 总结了哪个引擎任务负责特定阶段。后续章节将更详细地描述每个阶段的事件触发顺序。\n\
  \n**表 7-6** 按阶段划分引擎任务\n\n![image](img/07tab06.jpg)\n\n#### 准备阶段操作\n\n准备阶段包括参数验证以及报表中每个元素的初始化。准备阶段对于所有报告都是相同的。表\
  \ 7-7 列出了 `RunTask` 和 `RunAndRenderTask` 的事件类型。\n\n`RunTask` 没有准备阶段。在 `RunAndRenderTask`\
  \ 中，准备阶段会触发 `beforeRender` 事件。\n\n**表 7-7** 准备阶段事件\n\n![image](img/07tab07.jpg)\n\
  \n参数事件首先为每个参数触发。在显示参数输入框之前，为每个参数调用 `getDefaultValueList`。此脚本根据参数类型返回单个值或值列表。\n\n\
  接下来，每个为用户提供选项列表的参数调用 `getSelectionValueList`。如果使用 API 运行 `RunTask` 或 `RunAndRenderTask`，`getDefaultValueList`\
  \ 只对没有值的参数触发。不会调用 `getSelectionValueList`。如果使用 `createDefinitionTask` 构建自定义参数界面，这些事件的触发方式类似于查看器。\n\
  \n用户输入参数值后，下一个事件是 `validate` 事件，它为每个参数触发。随后是报表设计事件 `initialize`。当使用一个引擎任务时，`initialize`\
  \ 事件触发一次。使用分离引擎任务会至少触发两次 `initialize` 事件，一次针对准备阶段，另一次针对渲染阶段。额外的渲染任务或阶段也会触发 `initialize`\
  \ 方法。\n\n在 `initialize` 事件之后，准备阶段会触发报表中每个元素的 `onPrepare` 事件。此过程从主页内容开始，从左到右、从上到下处理。所有嵌套元素在处理下一个元素之前都会完成。\n\
  \n接下来触发 `beforeFactory` 事件。该事件指示报告即将创建，并为修改运行中的报告提供了位置。\n\n在使用 `RunAndRenderTask`\
  \ 时触发 `beforeRender` 事件。当使用两个任务时，该事件在发生渲染操作之前不会触发。\n\n#### 生成阶段操作\n\n生成阶段包括连接数据源、执行数据集和数据立方、评估数据绑定以及创建报告中的所有报表项目。数据源和数据集事件在创建数据绑定项目之前触发，但这种处理可能在创建其他报表项目之前发生。例如，如果表格绑定到数据集，且报告使用页脚仅有标签的主页，则主页内容的\
  \ `onCreate` 事件将在绑定表格数据集的数据源和数据集事件之前触发。\n\n\n\n\n此阶段会触发每个报告项的 `onCreate` 事件。BIRT\
  \ 在处理完主页内容后，会处理报告主体。报告主体包含了所有要创建和渲染的报告项。BIRT 以迭代方式处理所有层级的所有项，在每一层都遵循与处理顶层项相同的流程。不包含在另一个报告项中的报告项称为顶层报告项。BIRT\
  \ 从左到右、逐行并向右下角的顺序处理顶层项。每个报告至少有一个顶层报告项，通常是一个网格、列表或表格。在下一个元素的 `onCreate` 触发之前，所有嵌套元素都会完成\
  \ `OnCreate` 处理。\n\n对于每个顶层项，BIRT 在处理到下一个顶层项之前，会处理所有的二级项。二级报告项是包含在顶层项中的报告项。例如，包含在网格（grid）中的表格就是一个二级报告项。\n\
  \n报告项的层级可以是任意数量。要查看特定报告项的层级，请在 BIRT 报告设计器的“大纲”（Outline）视图中检查报告设计的结构，如图图 7-1 所示。\n\
  \n**图 7-1** 显示报告项层级的大纲\n\n![image](img/07fig01.jpg)\n\n如果由 `RunAndRenderTask` 进程执行生成阶段，每个元素都会被创建并立即渲染，这在处理下一个元素之前会触发\
  \ `onRender` 事件。如果由 `RunTask` 进程执行生成阶段，则不会触发 `onRender` 事件。\n\n表 7-8 列出了每个主要报告组件在生成阶段触发的事件，并按这些事件的执行顺序列出。数据源、数据集和\
  \ `onPageBreak` 事件是可选的。\n\n**表 7-8** 生成阶段事件\n\n![image](img/07tab08.jpg)\n\n如果报告项未进行数据绑定，或者该报告项绑定到了之前已执行的另一个报告项，则数据源和数据集事件不会触发。`onPageBreak`\
  \ 事件仅在发生实际分页时触发。\n\n接下来的三个章节将更详细地描述数据源、数据集、数据绑定和分页事件。\n\n### 关于数据源和数据集事件\n\n数据源和数据集元素的事件在创建绑定到数据集的报告项之前触发。对于每个绑定到数据集的报告项，都会发生这一序列，但数据源的\
  \ `beforeOpen` 和 `afterOpen` 事件除外。如果数据源已使用过，则这些事件不会触发。当一个报告项绑定到另一个报告项时，这些事件中都不会在绑定的报告项上触发，这支持两个数据绑定项共享一个数据集而无需重复执行数据集。\n\
  \n数据源的 `beforeClose` 和 `afterClose` 事件在生成阶段结束时触发，在 `afterFactory` 事件触发之前触发。在生成阶段，`RunTask`\
  \ 和 `RunAndRenderTask` 中的数据源或数据集处理没有区别。\n\nBIRT 支持数据集缓存，使数据集只执行一次并被多次使用。在这种情况下，数据集事件仅在第一次使用时触发。如果数据集经过了参数化，并且实际参数值在报告项内发生了更改，则将使用新的参数值重新执行查询。该查询执行会导致数据集事件再次触发。表\
  \ 7-9 列出了按执行顺序排列的数据源和数据集类型及事件。\n\n**表 7-9** 数据源和数据集事件\n\n![image](img/07tab09.jpg)\n\
  \n### 关于数据绑定\n\nBIRT 中的数据绑定在 BIRT 数据集与数据绑定元素（如表格和列表）之间实现了逻辑分离。选择一个表格或列表，然后在属性编辑器中选择“绑定”（Binding）选项卡，即可显示该项的当前绑定情况。报告开发人员可以创建绑定列，使用外部对象来计算特定的列值。绑定的数据集继续决定为给表格或列表处理的行数。\n\
  \n在表格或列表中，明细行（detail rows）数据绑定的评估发生在当前行的 `onCreate` 事件之前。这种方法支持 `onCreate` 事件处理程序获取该行的相应值。\n\
  \n绑定数据集中的每个明细行都会对数据绑定进行评估。包含使用绑定的数据元素的表格页脚（Table footers）会在最后一个明细行的最后一个 `onCreate`\
  \ 事件触发之前进行评估。\n\n不建议使用 `onCreate` 脚本尝试修改绑定列。例如，可以使用 `onCreate` 脚本配合 JavaScript 变量将某行的列值与该列之前的所有行的列值进行拼接。如果此值位于绑定列的表达式中，则最后一个值将从绑定列中排除。要显示最后一个值，请使用计算列（computed\
  \ column）、聚合报告项或在文本元素中使用动态文本 `<VALUE-OF>` 标签来显示 JavaScript 值。\n\n报告开发人员不能假设绑定表达式相对于各种表格项事件的任何特定评估顺序，除非绑定会在使用它的项的\
  \ `onCreate` 事件之前评估。最佳实践是在数据集脚本或绑定表达式中对数据所需的任何操作。\n\n分组（group）的数据绑定评估在创建表格或列表项之前会对绑定列进行多次评估。BIRT\
  \ 会对数据进行多次扫描以支持分组。分组绑定列表达式中的任何脚本都会在每次评估数据绑定时被调用，从而影响报告性能。\n\n表格的所有绑定始终是计算的，无论这些绑定是否被表格使用。出于性能考虑，请检查绑定列表并从设计中移除未使用的项。\n\
  \n报告项可以共享数据绑定。例如，两个表格可以共享一组绑定。第二个表格不会重新评估数据绑定。要在 BIRT 报告设计器中使用此功能，请选择第二个表格，在属性编辑器中选择绑定，从列表中选择相应的报告项。该列表仅支持数据绑定项。\n\
  \n上述场景会影响使用可用绑定的 BIRT 表达式。\n\n### 关于分页事件\n\n许多报告项支持分页。在表格上设置分页间隔会指示表格处理一定行数后应用分页。在分组部分设置分页会在分组处理之前和之后都应用分页，或仅在之后应用。分页可以应用于许多其他报告项之前。例如，在表格的行之前应用分页会指示引擎在表格处理每行数据之前应用分页。\n\
  \n分页事件基于分页 HTML 生成器。如果报告生成了 5 个 HTML 页面但有 20 个 PDF 页面，则分页事件只会触发 5 次。\n\n事件的通用顺序如下：\n\
  \n• 引擎创建页面。\n• 报告触发 `onStart` 事件。\n• 所选主页触发 `onPageStart` 事件。\n• 出现在页面上的触发 `onPageBreak`\
  \ 事件。\n• 所选主页触发 `onPageEnd` 事件。\n• 报告触发 `onPageEnd` 事件。\n• 引擎评估主页自动文本字段。\n\n所有出现在页面上的项的\
  \ `onCreate` 事件会在报告的 `onStart` 事件之前触发。某些项由于“保持在一起”（keep together）标记，触发了 `onCreate`\
  \ 但不会出现在当前页面上。此类项将出现在后续页面。\n\n页面级脚本用于 Run 和 Render 任务分离的场景。\n\n##### 关于图表事件顺序\n\n\
  图表事件由图表引擎处理，并在演示阶段执行。这些事件将在后面的章节中介绍。\n\n### 关于表格和列表事件顺序\n\n\n\n\nBIRT 引擎会迭代为报表项目触发\
  \ `onCreate` 事件。在处理迭代数据行的报表项目（例如表格或列表）时，事件顺序会发生变化，以便为每行数据添加额外的事件。行容器处理数据行。\n\n##\
  \ 行的执行顺序\n\n表格、列表和分组都包含行。BIRT 对所有行的处理方式相同。行有三种：\n\n• 表头 (Header)\n• 详情 (Detail)\n\
  • 页脚 (Footer)\n\n图 7-2 显示行的执行顺序。列表或表格可以包含多个元素，例如详情行或表头行。\n\n**图 7-2** 行执行顺序\n\n\
  ![image](img/07fig02.jpg)\n\n## 表格和列表方法的执行顺序\n\n列表等同于每行只有一个单元格的表格。BIRT 处理表格和列表的方式相同，不同在于对于列表，BIRT\
  \ 不会遍历多个单元格。BIRT 处理表格分为三个步骤：设置步骤、处理步骤和结束处理步骤。\n\n以下章节描述了表格和列表的执行顺序步骤。\n\n### 表格和列表设置步骤\n\
  \n所有表格（无论分组还是未分组）的预表格处理步骤都是相同的。\n\n图 7-3 显示了预表格处理步骤的执行顺序。该图展示了在生成阶段使用 `RunAndRenderTask`\
  \ 的事件顺序。\n\n**图 7-3** 表格和列表设置执行顺序\n\n![image](img/07fig03.jpg)\n\n`RunTask` 不会触发\
  \ `onRender` 事件。`RenderTask` 不触发 `onCreate`、数据源和数据集事件。数据源和数据集事件是可选的。\n\n### 表格和列表处理步骤\n\
  \n表格和列表处理步骤的顺序取决于表格或列表是否分组。没有分组的表格或列表的顺序与有分组的不同。\n\n图 7-4 显示了未分组表格或列表的执行顺序。\n\n\
  **图 7-4** 未分组表格或列表的详情执行顺序\n\n![image](img/07fig04.jpg)\n\n对于有分组的表格，BIRT 会为每个组创建一个\
  \ `ListingGroup` 项目。\n\n`ListingGroup` 类似于表格，因为它有一个或多个表头行和一个或多个页脚行。BIRT 处理分组行的方式与处理表格行相同。\n\
  \n除了这些行的标准 `onPrepare`、`onCreate` 和 `onRender` 事件外，`ListingGroup` 还会触发组的 `onPageBreak`\
  \ 和 `onPrepare` 事件。若要访问这些事件处理程序的脚本位置，请在大纲视图中找到该组并选择脚本选项卡。使用 `onPrepare` 事件处理程序中的代码修改分组行为，例如更改排序顺序。\n\
  \n图 7-5 显示了带分组表格的执行执行顺序。\n\n**图 7-5** 分组表格执行顺序\n\n![image](img/07fig05.jpg)\n\n\
  要验证特定报表事件处理程序的执行顺序，请向事件处理程序中添加日志代码。\n\n### 表格和列表结束处理步骤\n\n所有表格（无论分组还是未分组）的后表格处理步骤都是相同的。\n\
  \n##### 生成阶段的完成\n\n生成阶段完成后，所有数据源的 `beforeClose` 和 `afterClose` 事件将触发，随后是 `afterFactory`\
  \ 事件。如果使用 `RunAndRenderTask`，则 `afterRender` 事件会在关闭数据源之前触发。表 7-10 描述了生成阶段完成时可用的事件。\n\
  \n**表 7-10** 完成生成阶段\n\n![image](img/07tab10.jpg)\n\n#### 呈现阶段操作\n\n呈现阶段启动相应的发射器并根据生成的报表产生报表输出。该阶段在所有项目创建时触发它们的\
  \ `onRender` 事件。如果使用 `RenderTask` 渲染已有的报表文档，则首先触发 `initialize` 事件，然后触发每个渲染的报表项目的\
  \ `onRender` 事件。\n\n如果 `RenderTask` 逐页渲染页面，则 `onRender` 事件仅对已渲染的项触发。例如，BIRT Web\
  \ Viewer 使用 `RunTask` 创建报表文档。Web 查看器使用 `RenderTask` 渲染第一页。此操作会先触发 `initialize` 事件，然后页面上显示的每个项目的\
  \ `onRender` 事件。选择新页面并使用分页控制将产生新的 `RenderTask`，它会再次调用 `initialize` 事件并触发新页面上每个项目的\
  \ `onRender` 事件。\n\n### 事件顺序总结\n\n表 7-11 总结了每个处理阶段触发的报表设计和报表项目事件。事件按针对特定任务触发的顺序列出。为了简洁起见，未显示分页、`getDefaultValueList`、`getSelectionValueList`、数据源和数据集事件。\n\
  \n**表 7-11** 事件顺序总结\n\n![image](img/07tab11.jpg)\n\n![image](img/07tab11a.jpg)\n\
  \n## 第 8 章 使用 JavaScript 编写事件处理器\n\nBIRT 脚本基于 Mozilla Rhino 的 JavaScript 实现，也称为\
  \ ECMAScript。Rhino 实现了 ECMA 标准描述的 ECMAScript 1.5 版本。关于 Rhino 的完整规范请位于 ECMAScript\
  \ 版本 3。\n\n### 使用 BIRT 设计器输入 JavaScript 事件处理器\n\n你可以使用 BIRT 设计器输入 JavaScript 事件处理器并将其与特定事件关联。\n\
  \n**如何使用 BIRT 设计器输入 JavaScript 事件处理器**\n\n**1** 在大纲中，选择要编写事件处理器的报表元素、数据源或数据集。\n\
  **2** 选择脚本选项卡。\n**3** 从下拉列表中选择一个事件处理器。\n**4** 在脚本编辑器中输入事件处理器代码。\n\n图 8-1 显示了列表元素\
  \ `onPrepare()` 方法中的代码。\n\n**图 8-1** `onPrepare()` 方法的代码输入\n\n![image](img/08fig01.jpg)\n\
  \n#### 创建和使用全局变量\n\nJavaScript 有全局变量局部变量。局部变量只能在创建它的作用域内访问。在 JavaScript 中使用 `var`\
  \ 标识符创建局部变量，如下所示：\n\n```\nvar localCounter = 0;\n```\n\n要创建全局变量，请省略 `var` 标识符并将\
  \ local 替换为 global，如下所示：\n\n```\nglobalCounter = 0;\n```\n\nJavaScript 中的全局变量对在同一进程中执行的所有\
  \ JavaScript 代码可见。例如，使用全局变量来计算表格中的详情行，首先在表格的 `onCreate()` 方法中创建一个全局变量，如下所示：\n\n\
  ```\nrowCount = 0;\n```\n\n因为 `rowCount` 是全局的，详情行的 `onCreate()` 方法可以访问并增加它，如下所示：\n\
  \n```\nrowCount++;\n```\n\n要存储全局变量，使用 `reportContext.setGlobalVariable()` 方法。这种方法支持将全局变量传递给\
  \ Java 事件处理器。\n\n如果报表使用两个独立的进程进行执行（例如 `RunTask` 和 `RenderTask`），则只有在使用 `reportContext.setPersistentGlobalVariable()`\
  \ 方法设置时，全局变量对两个进程可用。该方法在渲染之前将变量值写入报表文档。如果你在 `initialize` 方法中设置全局变量，请记住当使用两个进程时该事件会触发多次。\n\
  \n#### 创建和使用页面变量和脚本\n\n\n\n\n在主页上，BIRT 支持使用自动文本（autotext）报告项来添加特定页的值。示例包括页码、文件名、创建日期和总页数。特定的自动文本项\
  \ `variable` 可以与页面脚本结合使用，以自定义页面的展示。此自动文本元素可以使用页面变量或报告变量。页面变量和报告变量在数据资源管理器视图（data\
  \ explorer view）中创建。页面变量针对报告的每一页进行评估，而报告变量针对整个报告进行评估。作为一个类比，可以考虑 `page n of m` 自动文本项。`n`\
  \ 代表当前页码，`m` 代表总页数。变量 `n` 类似于页面级变量，而变量 `m` 类似于报告变量。为了支持修改这些变量，BIRT 为报告及其中存在的任何主页提供了\
  \ `onPageStart` 和 `onPageEnd` 脚本。通过这些脚本和变量，报告开发者可以创建具有自定义页眉和页脚的报告，例如根据分组显示子分页，或显示第一页和最后一页条目信息的电话簿样式页眉。\n\
  \n当使用单独的运行（run）和渲染（render）任务时（例如使用 BIRT 查看器），请使用页面变量和脚本。例如，假设需要一个报告列出客户，且页眉需要包含特定页的第一和最后一个客户编号。为了实现此报告，开发者使用数据资源管理器视图创建了两个页面变量\
  \ `FIRST_CUSTOMER` 和 `LAST_CUSTOMER`。接下来，开发者为报告添加了一个 `OnPageStart` 事件脚本，将这些变量设置为\
  \ `null`。\n\n**Listing 8-1** `onPageStart` 事件脚本\n\n```\nreportContext.setPageVariable(\"\
  FIRST_CUSTOMER\", null);\nreportContext.setPageVariable(\"LAST_CUSTOMER\", null);\n\
  ```\n\n这些值在每个新页面上都会被设置为 `null`。最后，开发者选择客户编号数据项并输入以下 `onPageBreak` 脚本：\n\n**Listing\
  \ 8-2** `onPageBreak` 事件脚本\n\n```javascript\nvar customer = this.getValue( );\n\
  var first = reportContext.getPageVariable(\"FIRST_CUSTOMER\");\nvar last = reportContext.getPageVariable(\"\
  LAST_CUSTOMER\");\nif (first == null)\n{\n   reportContext.setPageVariable(\"FIRST_CUSTOMER\"\
  , value );\n}\nreportContext.setPageVariable(\"LAST_CUSTOMER\", value);\n```\n\n\
  特定的客户编号和两个页面变量被检索，然后存储在本地 JavaScript 变量中。\n\n此 `onPageBreak` 事件会在该数据项出现在页面上的每个实例处触发。每页仅设置一次\
  \ `FIRST_CUSTOMER`。如果第一个变量映射为 `null`，则页面变量 `FIRST_CUSTOMER` 被设置为当前客户编号。此条件在每页仅为真一次。接下来，将\
  \ `LAST_CUSTOMER` 页面变量设置为当前客户编号。此设置确保了 `LAST_CUSTOMER` 页面变量被设置为该页的最后一个客户编号。然后，开发者在主页页眉中添加两个变量自动文本报告项，并为它们赋值\
  \ `FIRST_CUSTOMER` 和 `LAST_CUSTOMER`。\n\n## 了解执行阶段和过程\n\nBIRT 有三个执行阶段：准备（preparation）、生成（generation）和展示（presentation）。可能存在一个或两个执行过程。当报告在\
  \ BIRT 报告设计器预览器中运行时，只有一个执行过程，该过程会执行一个 `RunAndRenderTask`。\n\n当报告在查看器中运行时，有两个执行过程。第一个过程称为“工厂过程”（`factory\
  \ process`），包含准备和生成阶段。第二个执行过程称为“渲染过程”（`render process`），仅包含展示阶段。渲染过程可能发生在比工厂过程晚得多的时间，并且可能在不同的机器上。\n\
  \n由于变量仅在创建它们所在的过程中可见的，因此知道哪些事件处理器运行在哪个过程中至关重要。如果渲染过程使用了在工厂过程中创建的变量，那么代码在预览器中可以工作，但在使用两个过程的运行时则将无法正常工作。\n\
  \n### 使用 reportContext 对象\n\n几乎每个事件处理器都可以访问一个名为 `reportContext` 的对象。表 8-1 列出了常用的\
  \ `reportContext` 对象方法。\n\n**Table 8-1** `reportContext` 类的方法\n\n![image](img/08tab01.jpg)\n\
  ![image](img/08tab01a.jpg)\n\n#### 使用 getOutputFormat\n\n为了在渲染时根据输出格式更改元素（element）样式，请使用\
  \ `reportContext` 对象将代码添加到 `onRender` 事件处理器中，如 Listing 8-3 所示。\n\n**Listing 8-3**\
  \ `onRender` 事件脚本\n\n```javascript\nif (reportContext.getOutputFormat( ) == \"pdf\"\
  ){\n   this.getStyle( ).backgroundColor = \"red\";\n}else{\n   this.getStyle( ).backgroundColor\
  \ = \"blue\";\n}\n```\n\n要在设计中创建两个主页并根据输出格式切换页面，请设置 `beforeFactory` 事件处理器，如 Listing\
  \ 8-4 所示。\n\n**Listing 8-4** `beforeFactoring` 事件脚本\n\n```javascript\nrptDesignHandle\
  \ = reportContext.getDesignHandle( );\ntbl = rptDesignHandle.findElement(\"mytable\"\
  );\nvar myoutputformat = reportContext.getOutputFormat( );\nif( myoutputformat ==\
  \ \"html\" ){\n   tbl.setProperty(\"masterPage\",\"MasterPageTwo\");\n}else{\n \
  \  tbl.setProperty(\"masterPage\",\"MasterPageOne\");\n}\n```\n\n此示例使用 `reportContext`\
  \ 对象获取设计的句柄。设计句柄定位名为 `mytable` 的表格元素，并根据输出格式将 `masterPage` 设置为第一个或第二个主页。需要的是，主页的发生在生成阶段，渲染时无法更改。该示例适用于以下情况：\n\
  - 重新创建报告\n- 使用任务运行并渲染报告\n\n### 使用 reportContext 获取设计句柄\n\n你可以在 `beforeFactory` 事件处理器中使用\
  \ `reportContext` 对象获取设计句柄。你可以在设计执行之前修改运行的设计。`beforeFactory` 方法仅在生成阶段执行。示例使用了后文介绍的设计\
  \ API。\n\n**Listing 8-5** 使用参数过滤表格\n\n```javascript\nimportPackage(org.eclipse.birt.report.model.api.elements)\n\
  ;\nimportPackage(org.eclipse.birt.report.model.api);\ntableHandle = reportContext.getDesignHandle(\
  \ ).findElement(\"mytable\");\nif( params[\"FilterCol\"].value.length > 0 ){\n \
  \  fc = StructureFactory.createFilter( );\n   fc.setExpr(\"row['\" + params[\"FilterCol\"\
  ] + \"']\");\n   fc.setOperator(params[\"FilterEq\"]);\n   fc.setValue1(\"\\\"\"\
  \ + unescape(params[\"FilterVal\"]) + \"\\\"\");\n   ph = tableHandle.getPropertyHandle(TableHandle.FILTER_PROP);\n\
  \   ph.addItem(fc);\n}\n```\n\n\n\n\n作为使用 `visibility` 属性隐藏报告内容的替代方案，可以使用报告设计句柄从正在运行的设计中删除元素，如下代码所示：\n\
  \n```javascript\nreportContext.getDesignHandle( ).findElement(\"table1\").drop(\
  \ );\n```\n\n你可以修改报告表项的额外属性。列表 8-7 显示了如何调整表格内列的宽度并更改绑定的数据集。如果报告表项绑定的数据集发生变化，则新数据集必须包含与之前数据集相同的列。\n\
  \n**列表 8-7** 修改表格属性\n\n* * *\n\n```javascript\ntable = reportContext.getDesignHandle(\
  \ ).findElement(\"table1\");\nch = table.getColumns( ).get(0);\nch.setProperty(\"\
  width\", \"10%\");\ntable.setProperty( \"dataSet\", \"My Alternate Data Set\" );\n\
  ```\n\n你可以在 `beforeFactory` 事件中更改 `styles` 属性。列表 88-8 为 PDF 生成使用一种样式，为所有其他格式使用另一种样式。此示例需要重新创建报告文档才能生效。或者，可以使用\
  \ `RunAndRender` 任务。\n\n**列表 8-8** 修改表格样式\n\n* * *\n\n```javascript\ntableHandle\
  \ = reportContext\n    .getDesignHandle( ).findElement(\"mytable\");\nrowHandle\
  \ = tableHandle.getDetail( ).get(0);\nif( reportContext.getOutputFormat( ) == \"\
  pdf\" ){\n    rowHandle.setStyleName(\"style2\");\n}else{\n    rowHandle.setStyleName(\"\
  style1\");\n}\n```\n\n#### 在进程之间传递变量\n\n虽然全局 JavaScript 变量无法在进程之间传递，但 BIRT 提供了一种从工厂过程（factory\
  \ process）传递变量到渲染过程（render process）的方法。报告上下文对象的 `setPersistentGlobalVariable( )`\
  \ 方法创建一个可以使用 `getPersistentGlobalVariable( )` 方法访问的变量。限制是变量必须是可序列化的 Java 对象。\n\n\
  例如，在运行时生成两个字符串，并在渲染 PDF 时显示一个字符串，在其他上下文中显示另一个字符串。在生成时使用 `setPersistentGlobalVariable(\
  \ )` 方法将变量存储在报告文档中。在渲染时，在渲染事件处理程序中使用 `getPersistentGlobalVariable( )` 方法检索变量。\n\n\
  列表 8-9 在标签元素的 `onCreate` 事件处理程序中调用 `setPeristentGlobalVariable( )` 方法来初始化两个字符串，然后在\
  \ `onRender` 事件处理程序中调用 `getPersistentGlobalVariable( )` 方法来指定格式上下文。\n\n**列表 8-9**\
  \ 使用持久性全局变量\n\n* * *\n\n```javascript\n//Label onCreate\nreportContext.setPersistentGlobalVariable(\"\
  mypdfstr\",\n    \"My PDF String\");\nreportContext.setPersistentGlobalVariable(\"\
  myhtmlstr\",\n    \"My HTML String\");\n\n// Label onRender\nif( reportContext.getOutputFormat(\
  \ ) == \"pdf\" ){\n    this.text =\n    reportContext.getPersistentGlobalVariable(\"\
  mypdfstr\");\n}else{\n    this.text =\n    reportContext.getPersistentGlobalVariable(\"\
  myhtmlstr\");\n}\n```\n\n#### 使用 getAppContext\n\nBIRT 使用应用程序上下文映射（application context\
  \ map）来存储用于报告生成和展示所有阶段的值和对象。要向应用程序上下文添加对象，可以使用 `Report Engine API` 或请求对象的 `setAttribute(\
  \ )` 方法。\n\n以下 JSP 示例向应用程序上下文添加了一个对象。`AppContextKey` 是引用对象的名称，`AppContextValue`\
  \ 包含对象的值。\n\n**列表 8-10** 向应用程序上下文添加对象\n\n* * *\n\n```jsp\n<%\njava.lang.String teststr\
  \ = \"MyTest\";\nsession.setAttribute( \"AppContextKey\", teststr );\njava.lang.String\
  \ stringObj = \"This test my Application Context From the Viewer\";\nsession.setAttribute(\
  \ \"AppContextValue\", stringObj );\nString redirectURL = \"http://localhost:8080/2.5.0/frameset?__report=AppContext.rptdesign\"\
  ;\nresponse.sendRedirect(redirectURL);\n%>\n```\n\n引用应用程序上下文中的对象。列表 8-11 使用 `try-catch`\
  \ 块来检测对象未未找到并返回适当的错误消息。\n\n**列表 8-11** 检查对象是否存在\n\n* * *\n\n```javascript\ntry {\n\
  \    MyTest.toString( );\n} catch (e) {\n    \"My Object Was Not Found\";\n}\n```\n\
  \n使用 `Report Engine API` 中的 `EngineConfig` 类或 `EngineTask` 类来添加对象，如 列表 8-12 所示。\n\
  \n**列表 8-12** 向应用程序上下文添加对象\n\n* * *\n\n```javascript\nconfig = new EngineConfig(\
  \ );\nHashMap hm = config.getAppContext( );\nhm.put( \"MyTest\", stringObj);\nconfig.setAppContext(hm);\n\
  ```\n\n应用程序上下文对象包含许多实用的设置。例如，可以使用类似以下代码为 JDBC 驱动程序设置驱动程序位置：\n\n`config.getAppContext(\
  \ ).put(\"OdaJDBCDriverClassPath\", \"C:/apps/apache-tomcat-5.5.20/webapps/2.5.0/frameset?__report=AppContext.rptdesign\"\
  );`\n\n`OdaJDBCDriverClassPath` 设置在应用程序上下文中可以指定驱动程序。`OdaJDBCDriverClassPath` 设置在应用程序上下文中可以指定驱动程序。`OdaJDBCDriverClassPath`\
