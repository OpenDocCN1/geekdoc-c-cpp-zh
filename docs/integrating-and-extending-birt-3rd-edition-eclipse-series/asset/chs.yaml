  \ 中，执行以下任务：\n\n### 1 再次右键点击 `reportItem` 并选择 `New→property`，以创建一个新的扩展元素属性，其设置如表\
  \ 18-6 所示。`displayText` 属性包含旋转标签显示的文本。\n\n**表 18-6** `displayText` 的属性值\n\n![image](img/18tab06.jpg)\n\
