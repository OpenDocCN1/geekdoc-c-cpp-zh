  \n## 使 Java 类对 BIRT 可见\n\n让 Java 事件处理程序类对 BIRT 报告设计器可见的方法是创建一个 Java 开发项目，在与 BIRT\
  \ 报告项目相同的工作区中编译该类。另一种方案是将类放置在 BIRT 类路径指定的目录或 JAR 文件中。要将报告部署到应用程序服务器，请将 Java 类复制到服务器上的相应位置。\n\
  \n## 将 Java 事件处理程序类与报告元素关联\n\n在创建 Java 事件处理程序类并编写了适当的处理方法后，将该类与报告元素关联。\n\n### 如何将\
  \ Java 类与报告元素关联\n\n此过程中的步骤遵循以下假设：\n\n• 报告设计在 Report Design（报告设计）视图中打开。\n• 报告设计包含可脚本的报告项目，例如标签。\n\
