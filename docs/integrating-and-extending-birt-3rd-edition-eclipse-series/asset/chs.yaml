  \ SQL 查询访问数据库的客户表，并检索信用额度小于或等于 100,000 的客户名称和信用额度值。然后 SQL 查询按客户名称对这些值进行排序。\n\n```sql\n\
  SELECT customers.customerName,\ncustomers.creditLimit\nFROM customers\nWHERE customers.creditLimit\
