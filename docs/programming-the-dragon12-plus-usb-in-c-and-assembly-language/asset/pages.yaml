    Listing 10.6 shows the assembly routines corresponding to the last C function
    calls in Table 10.1. The subroutine HILO_init in Listing 10.6 configures channel
    to be an input capture by clearing bit 1 of TIOS. It then sets the timer rate
    to 1.5 MHz by writing $04 to TCR2 (see Fig. 10.4) and enables the timer by setting
    bit 7 of TSCR (see Fig. 10.3). After loading the current value of TCNT in TCI,
    it configures TCTL4 (see Fig. 10.3) to capture (and) on rising and falling edges
    of the input signal. Writing a 1 to bit 1 of TFLGI (see Fig. 10.8) will clear
    any old flag. Finally, TCI interrupts are enabled by setting bit 1 of TIE (see
    Fig. 10.10), and hardware interrupts are enabled with the cli instruction.


    The subroutine HILO_init in Listing 10.6 is called by the input capture interrupt
    service routine in Listing 10.5. The first instruction loads D with TCNT captured
    when the interrupt occurred. This value is saved by P on the stack. The value
    captured at the interrupt, stored in TCIOLD, is then subtracted from D. Bit of
    TFLGI is tested to see if the interrupt occurred because of a rising or falling
    edge of the input signal. If the interrupt occurred, the branch will not occur
    the value of D (the time since the last interrupt). Otherwise, the value of D
    is stored in the variable HI_time. In either case, the interrupt push will de
    save the saved value of TCI, which was captured by the interrupt, and store this
    value in TCIOLD — ready for the next interrupt. Before returning from the subroutine,
    the flag is cleared by writing 0 to bit 1 of TFLGI (see Fig. 10.9).

    The subroutine get_HI_time in Listing 10.6 simply loads D with the value in HI_time
    (which is continually being updated in the interrupt service routine) and returns
    this value to the C function int get_HI_time(). Similarly, the subroutine LO_time
    in Listing 10.6 loads D with the value in LO_time and returns this value to the
    C function int get_LO_time().'
