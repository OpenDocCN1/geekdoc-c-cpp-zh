  md: '# Under the Hood


    Listing 7.5 shows the assembly language routines *servo_init*, we concatenate
    channels the four C function calls in Table 7.2. In the subroutine, *servo54_init*,
    we concatenate channels 4 and 5 by writing 1 to bit 6 in the PWM control register,
    PWMCTL, in Fig. 7.3b. Note that the channel 5 pin will be used for the output,
    and the channel 5 bits are used in PWMOL, PWMCLK, PWMCAE, and PWM registers. We
    select clock *A* by clearing bit 5 in PWMCLK. By storing a hex 53 in PWMPRCLK,
    we set the clock frequency to 3 MHz by dividing the 24 MHz bus clock by 8. To
    make the period exactly 20 ms, we store a value of 60000/3 MHz = 20.0 ms. Storing
    4500 in PWMDTY4 will give an initial pulse width of 1.5 ms.


    The subroutine *servo54* will store the value passed in accumulator *D* in register
    PWMDTY4, which will be the concatenation of PWMDTY4 and PWMDTY5, with PWMDTY5
    being the high byte. To move the servo over this range, the value stored in PWMDTY6
    should range from about 3000 to 6000.


    The subroutines *servo76_init* and *set_servo76* in Listing 7.5 behave in a similar
    manner to *servo54_init* and *set_servo54* except in this case channels 6 and
    7 are being concatenated. The channel 7 pin is used for the output, and the channel
    7 bits are used in PWMOL, PWMCLK, PWMCAE, and PWM registers. The 16-bit period
    and duty values are stored in PWMPER6 and PWMDTY6, respectively.'
