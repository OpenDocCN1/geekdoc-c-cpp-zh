  md: '# Appendix F


    # Phase Locked Loop


    A phase locked loop (PLL) is used to produce a higher output frequency than the
    oscillator frequency generated by the crystal on the board. A block diagram of
    the PLL that is in the Frecale MC9S12DG256 microcontroller is shown in Fig.1.
    The registers used to program this phase locked loop are shown in Fig.2. The lower
    bits of the REDFVG register are used to divide the oscillator frequency, OSCLK,
    by a value from 1 to 16, producing a signal with frequency $f_1$. The phase difference
    between this signal and second frequency $f_2$ is measured by the phase detector.
    The loop filter converts this phase difference into an analog voltage that is
    the input to a voltage controlled oscillator (VCO). The output of the VCO is a
    clock signal with a frequency that is proportional to the input voltage to the
    VCO. If the input voltage to the VCO increases, the output frequency will increase.
    If the input voltage to the VCO decreases, the output frequency will decrease.
    If you want the output frequency $f_2$ to be $N$ times the reference frequency
    $f_1$, then the loop programmable divider will divide the output frequency $f_1$
    by $N$ to produce the frequency $f_2$; if $f_2$ starts at a lower frequency than
    $f_1$, then the output of the phase detector and loop filter will be positive,
    causing the frequency $f_1$ (and therefore $f_2$) to increase. On the other hand,
    if $f_2$ starts at a higher frequency than $f_1$, then the output of the phase
    detector and loop filter will be negative, causing the frequency $f_1$ (and therefore
    $f_2$) to decrease. After a short time, the two frequencies $f_1$ and $f_2$ will
    become locked (equal) and therefore the phase difference will remain constant,
    and the output frequency $f_2$ will be constant and $N$ times the frequency of
    $f_1$.


    | OSCLK | Phase Detector | Loop Filter | VCO |

    |---|---|---|--|

    | Reference Programmable Divider | $f_1$ | | |

    | REDFV<3:0> | $f_2$ | | $f_2 = Nf_1$ |

    | | | Loop Programmable Divider (I/N) | |

    | | | SYN<3:0> |


    Figure F.1 Block diagram of the phase locked loop'
