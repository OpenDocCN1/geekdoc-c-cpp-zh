    \ up until the block starts to slide down the inclined plane. If this occurs at\
    \ an angle $\theta$ then the coefficient of static friction $\\mu_s$ is given\n\
    \n$\\mu_s = \\tan \\theta\\quad (6.2)$\n\n![](img/6c970885d6405944bd67e68f02bac5bc_91_0.png)\n\
    \nFigure 6.6 Measuring the coefficient of static friction\n\nThis result is easily\
    \ derived by drawing a free-body diagram of the block.\nThe accelerometer is mounted\
    \ on the poster board as shown in Fig. 6.6 where $a_s$ and $a_t$ measure the components\
    \ of the acceleration of gravity, $g$. Thus,\n\n$a_s = g \\sin \\theta\\quad (6.3)$\n\
    \nand\n\n$a_t = g \\cos \\theta\\quad (6.4)$\n\nFrom Eqs. (6.2) – (6.4) we see\
    \ that\n\n$\\mu_s = \\tan \\theta = \\frac{a_s}{a_t}\\quad (6.5)$\n\nTo calculate\
    \ the values of $a_s$ and $a_t$ to use in Eq. (6.5) we must subtract the value\
    \ corresponding to zero gravity from the measured accelerometer values. Let $a_0$\
    \ be the measured accelerometer reading corresponding to zero gravity. We assume\
    \ that this is the same value for both $a_s$ and $a_t$. That is, it is the $a_s$\
    \ value when $\theta=0$, and it is the $a_t$ value when $\theta=90^{\\circ}$.\
    \ We measure $a_0$ by measuring $a_s$ when $\theta=0$. In order to deal with integer\
    \ values we multiply Eq. (6.5) by 1000 before doing the calculation. Thus, the\
    \ integer that we will be from\n\n$\\mu_s = 1000 \\frac{a_s}{a_t}\\quad (6.6)$\n\
    \nListing 6.4 will perform this calculation. To make the measurement we would\
    \ make sure that the poster board was horizontal and then press the reset button.\
    \ This will start the program and calculate $\\alpha$ by averaging eight readings\
    \ of $ax$. Then lift the poster board slowly. The value of $\\tan \\theta$ times\
    \ 1000 will be continuously displayed on the LCD. The displayed value when the\
    \ block just starts to slide down the poster board will be 1000 times the coefficient\
    \ of static friction."
