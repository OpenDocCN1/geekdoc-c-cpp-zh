  md: '# E.5 Centroid Defuzzification


    The last step in the fuzzy controller shown in Figure E.7 is defuzzification.
    This involves the centroid of the net fuzzy set L'' shown in Figures E.10 and
    E.11. Although we used MIN-MAX rule in the previous section we will begin by deriving
    the centroid equation for the sum rule shown in Figure E.11. This will illuminate
    the assumptions made in deriving the defuzzification equation that we will actually
    use in the fuzzy controller.


    Let Li(y) be the original output membership function associated with rule i where
    y is the output universe of discourse (see Figure E.10). After applying rule i
    this membership function will be reduced to the value


    ```

    mi(y) = wi*Li(y)  (E.1)

    ```


    where wi is the minimum weight found by applying rule i. The sum of these reduced
    output membership functions over all rules is given by


    ```

    M(y) = ∑_{i=1}^{N} mi(y)  (E.2)

    ```


    where N is the number of rules.


    The crisp output value y0 is then given by the centroid of M(y) from the equation


    ```

    yo = ∫yM(y)dy / ∫M(y)dy  (E.3)

    ```


    Note that the centroid of membership function Li(y) is given by


    ```

    ci = ∫Li(y)dy / ∫Li(y)dy  (E.4)

    ```


    But


    ```

    li = ∫Li(y)dy  (E.5)

    ```


    is the area of membership function Li(y). Substituting into (E.4) we can write


    ```

    ∫Li(y)dy = ci*li  (E.6)

    ```


