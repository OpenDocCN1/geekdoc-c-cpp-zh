  md: '# 2.2 LEDs and 7-Segment Displays


    Port B is connected to the eight red LEDs on the DRAGON12-Plus-USB board. A light
    emitting diode (LED) emits light when current flows through it in the positive
    direction as shown in Fig. 2.2. Current flows through the LED when the voltage
    on the anode (the wide side of the triangle) is higher than the voltage on the
    cathode (the straight connected to the apex of the triangle). When current flows
    through a lit LED, the forward voltage across the LED is typically between -1.5
    and +2.0 volts.


    In DRAGON12-Plus-USB board, the anode of an LED is connected to a resistor to
    bit 1 of the Port J. If both PORTB[x] and Pj are 1 (+5V) then current can flow
    through the LED and therefore will be enabled. On the other hand, if PORTB[x]=1
    and Pj=0 (0V) then current will flow through the resistor R and the LED. The resistor
    is used to limit the amount of current that flows through the LED. DRAGON12-Plus-USB
    board is 1.5 kΩ. Typical currents needed to light LEDs range from 2 to 15 milliam.


    Thus, to turn on the data direction of Port B and Port J must be set to all 1''s
    (output), and the bits of Port B corresponding to the LEDs must be set to 0.


    Seven LEDs can be arranged in a pattern to form different digits as shown in Fig.
    2.3. Digital watches use liquid crystals rather than LEDs. Seven segment displays
    come in two flavors: common cathode and common anode. A common cathode 7-segment
    display has all the cathodes tied together, while a common anode tied.


    The DRAGON12-Plus-USB board has four common-cathode segment displays that are
    connected as shown in Fig. 2.3. The common cathodes of the are connected to the
    lower bits of Port P. These bits must be set to zero to enable the 7-segment displays.
    The output pins 6:0 of Port B are connected through 150 Ω current-limiting resistors
    to the anodes, g - a, of each of the four 7-segment displays. In this common-cathode
    case, an output 1 will turn on and an output 0 will turn it off. If all four bits
    of PTP[0:3] are zero, then all four digits will display the same segment given
    by


    ![](img/6c970885d6405944bd67e68f02bac5bc_13_0.png)


    Figure 2.2 Turning on an LED


    ![](img/6c970885d6405944bd67e68f02bac5bc_13_1.png)


    Figure 2.3 A 7-segment display contains seven light emitting diodes (LEDs)'
  merge: -1
  pgno: 13
