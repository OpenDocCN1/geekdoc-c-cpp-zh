    \n# E.3 Fuzzification of Inputs\n\nFor each crisp input $x_i$ a set of weights\
    \ $w_i^j$ are computed for each membership function such as each input will have\
    \ a different set and number of membership functions. For input number $i$ the\
    \ weight $w_i^j$ can be stored in a vector $weight[i]$, $j=1, M_i$, where $M_i$\
    \ is the number of membership functions for input $i$. Each value in the weight\
    \ vector is a weight value between 0 and 1 given by the shape of a particular\
    \ membership function. Typically for a given input the weight vector will contain\
    \ up to two non-zero entries in adjacent cells.\n\nThe purpose of the function\
    \ get_inputs() is to read each input value $x_i$ and fill the weight vector $weight[M_i]$\
    \ with the degree of membership of $x_i$ in each fuzzy set. The pseudo-code for\
    \ get_inputs() is shown in Figure E.9. In this figure $M_i$ is the number of membership\
    \ functions for input $i$.\n\n```\nget_inputs()\nfor i=1 to num_inputs {\n  get_x(i);\n\
    \  fill_weight(x_i, M_i);\n}\n```\n\nFigure E.9 Pseudocode for get_inputs()\n\n\
    The function get_x(i) is problem dependent and will consist of reading the input\
    \ values $x_i, i=1, num\\_inputs$. The function fill\\_weight(x_i, M_i) will fill\
    \ the weight vector $weight[M_i]$ with the degree of membership of $x_i$ in each\
