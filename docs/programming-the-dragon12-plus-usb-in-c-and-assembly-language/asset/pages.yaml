  md: '# Serial Communication Interface (SCI)


    A circular queue is shown in Fig. 8.4. Multiple values are stored in this queue
    before they are removed (in the same order they were stored). Therefore, characters
    will not be lost if they are received faster than they are removed. Of, if the
    queue is full and another character is received, we will implement this queue
    by writing four functions whose prototypes are shown in Listing 8.3. The C programs
    for these four functions are in the separate C file named queue.c that is shown
    in Listing 8.4.


    The queue is defined to be an array qbuf which is stored in the variable max QMAX
    bytes. The index of the first byte in the queue (0) is stored in the variable
    min and the index of front and rear are initialized to 0 in the C function init_q()
    in Listing 8.4 and serves as pointers to the front and rear of the queue. To store
    a value in a queue, the index rear is incremented and the value at qbuf[rear].
    However, if rear runs into front, then the queue is full and we will back up and
    not store the new value. The complete algorithm for storing a value in the queue
    is implemented by the C function qstore(char c) in Listing 8.4 which stores the
    character c in the queue.


    To read a value from the queue the index front is incremented, and the value at
    qbuf[front] is read. This will guarantee that the first value stored in the queue
    will be the first one read from the queue. The queue will be empty any time that
    front = rear. The C function int qempty(void) shown in Listing 8.4 will return
    1 (true) if the queue is empty and return 0 (false) if the queue is not empty.


    ![](img/6c970885d6405944bd67e68f02bac5bc_112_0.png)


    The variables in Listing 8.4 are defined to be static so that they will not be
    visible to your main program main.c. When you create a project using the stationery
    file LBE_DRAGON12-Plus-USB, the files queue.c (Listing 8.4) and queue.h shown
    in Listing


    Fig. 8.4 circular queue: (a) empty; (b) containing two values'
