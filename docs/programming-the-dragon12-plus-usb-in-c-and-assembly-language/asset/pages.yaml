    You must enable the timer by setting bit 7 of the timer system control register
    1, TSCRI, shown in Fig. 10.3. Thus, the assembly language instruction


    ```

    movb #80, TSCR1

    ```


    will enable the timer, and any access to TCNT you will obtain a new counter.


    | Timer System Control Register 1 (TSCR1 – 0x0046) | |

    | 7 6 5 4 3 2 1 0 |

    | TEN TSWAI TSFRZ FFCA 0 0 0 TSCR1 |

    EN = 1: Enabled. TEN = 0: Timer disabled.

    SWAI — Timer Module Stops While in Wait

    TSFRZ — Timer and Modulus Counter Stop in Freeze Mode

    TFFCA — Timer and Flag Clear All


    Figure 10.3 Timer System Control Register 1


    The value of TCNT is incremented at a rate that depends on the three bits: PR0;
    PR1, in the timer system control register 2, TSCR2, shown in Fig. 10.4 according
    to the formula


    Timer clock rate = BusClock/2^PR1PR0


    The defaults of PR[2:0] are 000, if the bus clock is 24 MHz, then the timer clock
    rate will be 24 MHz and TCNT will increment once about every 41.6 ns. This means
    the counter will overflow (go from FFFF to 00000) every 2.73 ms. By changing these
    three bits in TSCR you can double the clock rate by 2, 4, 8, 16, 32, 64, or 128.
    These bits may be changed at any time; however, the change will not take effect
    until the next time all prescaled counters are zero. For a 24 MHz bus clock, the
    slowest clock rate would be 24 MHz/2^7=187.5 kHz, at which rate the timer would
    overflow every 350 ms.


    | Timer System Control Register 2 (TSCR2 – 0x004D) | |

    | 7 6 5 4 3 2 1 0 |

    | TOI 0 0 0 TCRE PR1 PR0 TSCR2 |


    TOI = 1: Timer interrupt enabled.

    TOI = 0: Timer interrupt disabled.

    TCRE = 1: Counter reset by a successful output compare 7.

    TCRE = 0: Counter reset inhibited and counter free runs.


    PR[2:0] — Timer Prescaler


    Timer clock rate = BusClock/2^PR1PR0


