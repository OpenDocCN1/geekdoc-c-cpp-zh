  md: '# Analog-to-Digital Converter


    # ATD Control Register 2 (ATD0CTL2–00082) (ATD1CTL2–01022)


    | 7 | 6 | 5 | 4 | 3 | 2 | 1 | 0 |

    |---|---|---|---|---|---|---||}{

    | ADPU | AFFC | AWAI | EREGTRS | ETRIG | ERIE | ASCIE | ASCIF |


    ADPU = 1: Normal ATD functionality; ADPU = 0: Power down AT.

    AFFC = 1: ATD Fast Flag Clear enabled; AFFC = 0: ATD Fast Flag cleared.

    ASCIE = 1: ATD Sequence Complete Interrupt enabled

    ASCIE = 0: ATD Sequence Complete Interrupt disabled

    ASCIF = ATD Sequence Complete Interrupt Flag


    # ATD Control Register 3 (ATD0CTL3–00083) (ATD1CTL3–01023)


    | 7 | 6 | 5 | 4 | 3 | 2 | 1 | 0 |

    |---|---|---|---|---|---|---||}{

    | 0 | S8C | S4C | S2C | S1C | FIFO | FRZ1 | FRZO |


    S8C, S4C, S2C, S1C — Conversion Sequence Length

    FIFO — Filter Result Mode

    FRZ1, FRZ0 — Background Debug Enable


    # ATD Control Register 4 (ATD0CTL4–00084) (ATD1CTL4–01024)


    | 7 | 6 | 5 | 4 | 3 | 2 | 1 | 0 |

    |---|---|---|---|---|---|---||}{

    | SRES8 | SMP1 | SMP0 | PRS4 | PRS3 | PRS2 | PRS1 | PRS0 |


    SRES8 = 1: 8-bit resolution; SRES8 = 0: 10-bit resolution.

    SMP1, SMP0 — Sample Time Select

    PRS[4:0] — ATD Clock Pres


    # ATD Control Register 5 (ATD0CTL5–00085) (ATD1CTL5–01025)


    | 7 | 6 | 5 | 4 | 3 | 2 | 1 | 0 |

    |---|---|---|---|---|---|---||}{

    | DJM | DSGN | SCAN | MULT | | CH2 | CH1 | CH0 |


    DJM = 1: Right justified data in result registers

    DJM = 0: Left justified data in result registers

    DSGN = 1: Signed data in result registers

    DSGN = 0: Unsigned data in result registers

    SCAN = 1: Continuous conversion sequences (scan mode)

    SCAN = 0: Single conversion sequence

    MULT = 1: Sample across several channels

    MULT = 0: Sample only one channel

    CH[2:0] — Analog input channel number


    ![](img/6c970885d6405944bd67e68f02bac5bc_88_0.png)


    Once the A/D converter module has been enabled, a conversion is started by writing
    to control register ATD0CTL5. Setting bit 7 (DJM) to 1 will right justify the
    data in the result registers. Storing 0 in bit 5 (SCAN) and bit 4 (MULT) will
    cause a conversion sequence of only one channel. The channel number is stored
    in bits 2–0. In the subroutine adconv in Listing 6.2, the channel number is passed
    as a parameter in accumulator B. By masking this number to the lower three bits,
    bit 7 is set to 1 to right justify the data in the result registers, and the resulting
    value is written to ATDCTL5. The conversion begins. The number of conversions
    that take place is determined by the value of the conversion sequence length in
    ATD Control Register 3 is shown in Fig. 6.3. On reset, the default value of this
    conversion sequence length is 4, which means, in our case, four separate conversions
    of the analog signal on the selected channel are performed, and the results are
    stored in the first four words of the ATD Control Registers (ATDRHx/ATDRlx).'
