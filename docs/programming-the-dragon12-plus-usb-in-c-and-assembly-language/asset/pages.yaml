  md: '# Parallel Ports - Outputs


    The output of Port B. To display different digits on the four 7-segment displays,
    the displays must be multiplexed in time as will be shown in Example 6.


    # Example 1 – Writing to Ports


    In this example, we will show how writing to ports can turn on the LEDs and 7-segment
    displays on the DRAGON12-Plus-USB.


    Follow the steps in the tutorial in Appendix A to set CodeWarrior and create a
    new project called Example1 where you select the library LBE_DRAGON12-Plus-USB.
    When you open the file main.c in the Source folder will see the program in Listing
    2.1. All text following a double slash // will be a comment to the end of the
    line.


    The seven statements following the comment /* put your own code here */ will do
    the following:


    +   1. The statement PLL_init() will set the system clock frequency to 24 MHz
    as described above. This should be the first statement in all of your programs.


    +   2. The statement DDRB = 0xFF will set all bits in data register B to 1 and
    therefore to all outputs. The notation 0x means that FF is a hexadecimal number
    equal to the binary 11111111.


