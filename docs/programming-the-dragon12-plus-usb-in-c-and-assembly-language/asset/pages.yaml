  md: '# Chapter 4


    The subroutine sharp in Listing 4.4 implements the algorithm shown in Fig. 4.5.
    It does this by repeatedly calling the subroutine sharp until the quotient line
    in dnum is equal to zero. The subroutine sharp converts the next digit in the
    conversion by dividing dnum by, converting the remainder to ASCII, and storing
    this ASCII code in the next location in the buffer, which is pointed to by X (see
    Fig. 4.4). The division is carried out using the subroutine div in Listing 4.4.
    This division divides a 32-bit integer (long) by a 16-bit integer, leaving a 32-bit
    quotient and a 16-bit remainder. Recall from Appendix C that the unsigned division
    instruction ediv will divide the unsigned 32-bit number (Y:D) by the unsigned
    16-bit number X, and store the unsigned 16-bit quotient in Y and the unsigned
    remainder in D. The problem is, if the divisor in X is too small then the quotient
    won''t fit in Y, but could be solved by this problem using divd, which calls twice,
    by first dividing


    ```

    (0:numH)/denom=quoth remH

    ```


    ```

    (remH:numL)/denom=quot remL

    ```


    Note in the subroutine div the value of QUOTH, which is in Y after the first ediv,
    is stored on the stack using the instruction 2,-sp. This pre-decrement, indexed
    addressing will first decrement the stack pointer, sp, and then store the value
    of Y in memory at the address pointed to by sp. At the beginning of the subroutine
    we pushed D on the stack so we could access numL later. When we need it, we use
    the instruction ldd 2,sp to get the value of D from the stack. On the top of the
    stack, we use the value of Y from the stack (which contains the value of QUOTH),
    but the original value of D is still on the stack. We can remove this value from
    the stack by pulling it into D, because now D contains the correct value of quot.
    We need to add 2 to the stack pointer so that it will be pointing to the subroutine
    return address. Using the load effective instruction lea 2,sp, which loads into
    the stack pointer, the effective address of the addressing mode used. In this
    case, 2,sp adds 2 to sp, so the effective address is sp+2. Thus, the instruction
    leas 2,sp is equivalent to sp=sp+2.


    After calling the subroutine sharp in the subroutine write_int_lcd in Listing
    4.4, there will be a maximum of five ASCII codes stored at the end of the buffer.
    This is because the 16-bit unsigned number is 65535. Thus, the first character
    in the string will be loaded at pad -5. We load this address into X and then load
    each ASCII code into B using the instruction ldb 1,x+, and then display it on
    the LCD using the subroutine data8. Note that X gets incremented by 1 each we
    load B with the next ASCII code. We stop the loop when X is no longer less than
    pad. Note that we use the branching instruction blo rather than bne, because we
    want compare unsigned addresses and bne would treat the addresses as signed numbers
    and therefore not exit the loop properly.


    When the function write_long_lcd(long d) in Table 4.3 is called, the subroutine
    write_long_lcd executes. 32-bit integer d to display on the LCD is passed to the
    subroutine in X:D. That is, the 16-bits of d are passed in index register X, and
    the low 16-bits of d are passed in accumulator D. The operation of this subroutine
    is very similar to the subroutine write_int_lcd, except that a maximum of 10 digits
    are stored in'
