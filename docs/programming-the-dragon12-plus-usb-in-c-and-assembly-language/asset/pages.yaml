  md: 'will then fill the arrays memb_pos[20] and memb_speed[20] with the point_1,
    point_2, slope_1, and slope_2 format used by the MEM instruction.


    ![](img/6c970885d6405944bd67e68f02bac5bc_155_0.png)


    The MEM instruction requires accumulator A to contain the input value xi and index
    register X to point to a data structure containing the two points and slopes that
    define the membership function as shown in Fig. 11.6. Index register Y points
    to the element of the array weight(j) corresponding to membership function j.


    The MEM instruction will compute the weight value at the input value xi based
    on the membership function whose parameters are pointed to by X. The computed
    weight value ($00-$FF) is stored in the byte pointed to Y. After the MEM instruction
    is executed X will have been incremented by 4 and Y will have been incremented
    by 1. If the four parameters of all membership functions for a single input are
    stored in adjacent bytes of memory, then X will be pointing to the parameters
    of the next membership function. Y will be pointing to the next element in the
    array weight(j).


    | | | weight(j) |

    |---|---|---||

    | X --> | point_1 | |

    | | point_2 | |

    | | slope_1 | |

    | | slope_2 | |

    | X + 4 --> | Y + 1 --> | |


