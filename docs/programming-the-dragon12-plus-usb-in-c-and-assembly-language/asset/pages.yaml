  md: "# Chapter 4\n\nAfter initializing the LCD and enabling the keypad we enter\
    \ an infinite while loop.\n first wait for a key on the keypad to be pressed (using\
    \ getKey()) and then return the value in c. This hex value is converted to ASCII\
    \ using hex2c() and the result (in a) is stored at the next location in kbuf.\
    \ If the hex value c read from the keypad is less than 10 (i.e. 0–9), it is displayed\
    \ on the LCD using data(a) and the program waits for you to lift your finger from\
    \ the keypad. The kbuf index is then incremented and you can continue to type\
    \ in additional digits that will be displayed on the LCD and the ASCII values\
    \ stored in kbuf.\n\nIf you type any other than 0 – 9 (i.e. A – F) then the part\
    \ of the if statement is executed. The C switch statement, which behaves like\
    \ a case statement executes one of possible cases depending on the value of the\
    \ switch expression, in this case the value of the hex c. Note that the last statement\
    \ in the cases is a break statement that terminates the switch statement.\n\n\
    If c is 0xE (i.e. you pressed the E or * key) then the first case is executed.\n\
    The first statement in this case\n\n```\nop1 = number(ptr);\n```\n\nwhich will\
    \ convert the ASCII that you typed from the keypad to the long integer op1.\n\
    Note the ASCII value for E (0x45) was stored in kbuf when you pressed E and became\
    \ the invalid digit that wasn't between 0 and 9. The next two statements will\
    \ write this integer, right-just in a field of 10, on the second line. The following\
    \ two statements will clear the first line. After waiting for you to lift your\
    \ finger, the program resets the kbuf index i to zero, sets the LCD address to\
    \ the beginning of the first line, and then executes a break statement that will\
    \ break out of the switch statement.\n\nAfter typing in one number and entering\
    \ it by pressing E, you can copy in another, but instead of pressing E you should\
    \ press A this time, which will add the two numbers together and display the sum.\n\
    \nThe second case in the switch statement will execute if you press the A key.\
    \ It begins by displaying op1 again on the first line. The first statement will\
    \ convert the second number to binary and store the result in op2. The sum of\
    \ op1 and op2 is stored back in op1 and displayed on the second line. The line\
    \ is erased by overwriting it with blanks and the program waits for you to lift\
    \ your finger.\n\nThe LCD address is reset to the beginning of the first line\
    \ and you can now another number. If you press A again, the old sum will be added\
