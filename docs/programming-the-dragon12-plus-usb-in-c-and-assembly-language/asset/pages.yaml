    pushing B onto the stack. If the key has stopped bouncing, the value in B should
    be the same as the first value we pushed on the stack. We compare these two values
    by pulling the first value into A, and subtracting B from A. If the result is
    zero, we have debounced the key value still in B and we exit the subroutine. If
    the values are not equal, we go back and repeat the process until they are equal.


    Finally, the subroutine wait in Listing 3.9 is a debounced assembly version of
    the C function wait_keyup() in Listing 3.6. This subroutine continually calls
    the subroutine keyscan until the value in B is 16 ($10), i.e., until a key has
    been released. After delaying 10 ms, the subroutine then checks to make sure that
    the key is still up.


