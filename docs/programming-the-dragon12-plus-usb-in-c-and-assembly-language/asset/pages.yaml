  md: "# Interrupts\n\nbset CRGINT, #80\n\nwill do this. To disable real-time interrupts,\
    \ you would write a 0 to bit 7 (RTIE) of the CRGINT register. The assembly language\
    \ instruction to do this is\n\nbclr CRGINT, #80\n\nWhen a real-time interrupt\
    \ times out, bit 7 (RTIF) of the CRFLG register gets set to 1. If real-time interrupts\
    \ have been enabled by setting bit 7 in the CRGINT register, then a real-time\
    \ interrupt will occur. To clear the RTIF bit, you must write a 1 to this bit.\
    \ This may seem strange, but this is the way that flags are cleared. Writing a\
    \ 0 to a flag bit has no effect. Therefore, to clear the flag in bit 7 of the\
    \ CRFLG register, you could store the hex value $80 in this register using the\
    \ statement\n\n```\nmovb #80, CRFLG\n```\n\nNote that all of the zeros are written\
    \ to the other bits in the CRFLG register will have no effect on the flags that\
    \ may be set in these other bits.\n\n# Listing 5.1 Example 14a – DRAGON12-Plus-USB\n\
    \n```\n// Example 14a: Real-time interrupt\n#include <hidef.h> /* common defines\
