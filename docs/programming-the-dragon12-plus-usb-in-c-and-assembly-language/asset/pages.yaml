  md: '# Chapter 8


    # Serial Communication Interface (SCI)


    In this chapter, we will show how to communicate from a serial port to your PC
    to an SCI port on the DRAGON12-Plus USB board. We will provide new C function
    calls to make it easy to do this. The DRAGON12-Plus-USB has a USB port that connects
    directly to a USB port on your computer. However, it will be listed as a serial
    port under Ports in the Components section of the System Summary on your computer.
    You will need to determine which COM port number to use to connect to the DRAGON12-Plus
    USB board. If you are using an older DRAGON12-Plus board that has a standard 9-pin
    serial connector, you will need to use a USB-to-serial converter cable to connect
    a USB port on your computer to the serial connector on the DRAGON12-Plus board.


    # 8.1 Asynchronous Serial I/O


    There are two types of serial communication: synchronous and asynchronous. In
    synchronous communication, the timing is controlled by a standard clock at both
    the transmitter and receiver, and data are normally sent in blocks that often
    contain error checking. On the other hand, the timing for asynchronous communication
    is handled one character at a time while the clocks at the transmitter and receiver
    must be approximately the same, they resynchronized with each character. Because
    each character requires additional synchronizing bits, communication slower than
    synchronous communication. However, it is simpler to implement and is in widespread
    use.


    Asynchronous serial communication uses a start bit to tell when a particular character
    is sent. This is illustrated in Fig. 8.1, which shows the transmitted waveform
    when the character "T" (ASCII code=0x54) is sent with odd parity. Before a character
    is sent, the line is in the high, or mark state. The line is then brought low
    (a space) and held low for a time t called the start bit. This first space is
    called the start bit. It is typically followed by seven or eight bits. The least
    significant bit D0 is transmitted. For example, in Fig. 8.1 the seven bits correspond
    to the ASCII code 0x54 ("T" is starting with D0). These seven bits are followed
    by a parity bit. This bit is set to a 1 or 0 such that the number of 1s is transmitted
    is either even or odd. We used odd parity in Fig. 8.1. Since three 1s are sent
    (D2, D4, and D6) the parity bit is zero. Often a character is sent with no parity
    and 8 data bits. The parity bit is followed by one or two bits, which are always
    high (a mark). The next character will be indicated by the presence of the next
    start bit.'
  merge: -1
  pgno: 105
