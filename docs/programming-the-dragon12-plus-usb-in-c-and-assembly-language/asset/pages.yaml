    # B.1.3 Stack Pointer, SP


    The stack is a region of memory that is set aside for storing temporary data.
    The stack pointer, SP, is a 16-bit register that contains the address of the top
    of the stack. The stack is used by HCS12 to save the return address when a subroutine
    is called. It is also used to save register values when an interrupt occurs.


    The stack can be used to save the contents of registers A, B, X, and Y by using
    the instructions PSHA, PSHB, PSHX, and PSHY. These values are removed from the
    stack using the instructions PULA, PULB, PULX, and PULY.


