    # The HCS12 WAV Instruction


    The values of numer and denom in Fig. 11.10 can easily be calculated using the
    HCS12 WAV instruction. If index register X points to cent[k], index Y points to
    out[k], and accumulator B contains the number of output membership functions,
    Q, then the HCS12 WAV instruction computes a 24-bit value for numer and store
    the result in Y:D and compute a 16-bit value for denom and store the result in
    X. Therefore, if the WAV instruction is followed by the instruction EDIV (see
    Appendix C) then the cent value y0 will be left in.


