  md: '# Chapter 1


    Thus, the first microprocessors consisted only of a CPU that could address external
    memory as shown in Fig. 1.1.


    ![](img/6c970885d6405944bd67e68f02bac5bc_7_0.png)


    Figure 1.1 A microprocessor (CPU) connected to external memory


    The external memory shown in Fig. 1.1 consists of read-write memory (RAM), read-only
    memory (ROM), and input/output memory (I/O). The I/O memory consists of dedicated
    special-purpose devices for performing such operations as parallel I/O, serial
    I/O, timer functions, and analog-to-digital (A/D) conversion. These I/O devices
    contain registers that look like memory locations to the CPU. The RAM in Fig.
    1.1 could be static RAM (SRAM) or dynamic RAM (DRAM). Dynamic RAM can contain
    more bytes than static RAM for the same size chip, but requires additional circuitry
    to refresh the data periodically to keep it from being lost. Other types of memory
    devices that might be connected to the address and data buses in Fig. 1.1 include
    erasable programmable-only memory (EPROM), electrically-erasable programmable-only
    memory (EEPROM), and flash EEPROM. Both flash EEPROM and EEPROM are non-volatile
    memory that maintain their data when power is removed. Individual bytes can be
    erased and programmed in EEPROM while flash EEPROMs normally require erasing the
    entire memory array at once.


    As integrated circuit technology developed over the years has been the development
    of faster and more complex microprocessors such as the Intel 8086 and Pentium
    and the Motorola 68080 and PowerPC. These microprocessors are in many of the popular
    desktop computers used in offices all the world. Another trend has been to package
    more and functionality onto a single chip. The Motorola 6801 was introduced in
    1978 and included a small amount of RAM and ROM as well as parallel and serial
    I/O on a single chip. The following year Motorola introduced an EPROM version
    of the 6801, the 68701, and as the first of the low-cost 6805 family of microcontrollers.


    The first 68HC11 was introduced by Motorola in 1985. This 8-bit microcontroller
    (the A8 part) on a single chip the CPU11 processor, 8 Bytes of ROM, 256 bytes
    of RAM, 512 bytes of EEPROM, up to 38 parallel I/O lines, a 16-bit timer that
    synchronous serial peripheral interface (SPI), an asynchronous serial communications
    interface (SCI), and an 8-channel, 8-bit A/D converter. Since 1985 over five dozen
    68HC11 parts have been introduced by Motorola. These parts differ in the types
    and amounts of on-board resources that are included in the chip.'
  merge: -1
  pgno: 7
- img_proc: true
  md: '# Introduction


    In 1997 Motorola introduced the 68HC12 as an enhanced 68HC11. It is upward compatible
    with the 68HC11 (but not at the code level). It has a greatly enhanced central
    processing unit (CPU12) that has several new instructions and addressing modes
    to make it easier to support higher-level languages. Programs run significantly
    faster on a 68HC12 for several reasons. typical clock speed increased from 2 MHz
    on a 68HC11 to 8 MHz on a 68HC12. The number of clock cycles required to execute
    many of the instructions was reduced on the 68HC12. In addition, the new instructions
    and addressing modes require fewer instructions to perform the same task. This
    means that only do programs run faster, but they also take up less memory space.


    2002 Motorola introduced the HCS12 family of microcontrollers, which are a direct
    upgrade of the 68HC12 family. The Motorola Semiconductor division spun off as
    Freestyle Semiconductor in 2004. The MC9S12DG256 microcontroller has 256 bytes
    of flash, 12 bytes of RAM, 4 bytes of EEPROM, two-channel, 10-bit analog-to-digital
    (A/D) converters, two asynchronous serial communication interfaces (SCI), three
    serial peripheral interfaces (SPI), an 8-channel timer module that supports output
    compare and input capture, an 8-channel pulse-width modulator (PWM), with 26 discrete
    I/O channels, and comprehensive interrupt functions. We will cover all of these
    I/O functions in this book. The MC9S12DG256 microcontroller has additional features
    not covered in this book including two 2.0 nodes operate up to 25 MHz and we will
    run all of our programs at a clock speed of 24 MHz.


    A block diagram of a typical HCS12 microcontroller is shown in Fig. 1.2. In the
    single-chip mode (which is what the DRAGON12-Plus-USB uses) the entire program
    is stored in the flash memory and the only contact with the outside world is through
    the various peripheral lines connected to the timer, parallel I/O, SPI, SCI, or
    A/D converter. An HCS12 microcontroller can also operate in an expanded multiplexed
    mode in which the parallel I/O lines become multiplexed address and data busses
    that can be used to access external memory.


    ![](img/6c970885d6405944bd67e68f02bac5bc_8_0.png)


    Figure 1.2 Block diagram of the HCS12 microcontroller'
  merge: -1
