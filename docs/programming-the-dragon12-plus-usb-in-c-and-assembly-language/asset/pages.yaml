  md: '# Chapter 9


    # The Serial Peripheral Interface (SPI)


    In this chapter we will show how the serial peripheral interface (SPI) can be
    interfaced to the LTC1661 10-bit D/A converter (DAC) on the DRAGON12-Plus-USB
    board and to read up to 16 switches on a hex keypad.


    # 9.1 Operation of the SPI


    There are two methods of serial communications on HCS12 microcontrollers. We have
    already seen the use of the serial communications interface (SCI) in Chapter 8,
    which uses start and stop bits to synchronize transmitted character. The second
    method of serial communications is the serial peripheral interface (SPI), which
    is a synchronous serial interface in which a clock signal is sent along with the
    data signal.

    The SPI is a synchronous serial interface in which an 8-bit byte can be shifted
    in and out one bit at a time. It can be used to communicate with a serial peripheral
    device or with another microcontroller with an SPI interface. The MC9S12DG256
    has three SPI modules that behave the same. Each module carries four signals as
    shown in Table 9.1. The pin numbers in parenthesis in 9.1 are the MC9S12DG256
    pin numbers. The system can operate in either master or slave mode. When communicating
    with a peripheral device the MC9S12DG256 SPI will operate as the master. When
    one MC9S12DG256 (the master) is connected to a slave MC9S12DG256 (the slave) the
    four SPI signals will be connected as shown in Fig. 9.1.


    Table 9.1 MC9S12DG256 SPI Signals

    | | SPI signal | Name |

    |---|---||

    | SPI0 | | |

    | PS4 (9) | MISO | Master-In-Slave-Out |

    | PS5 (9) | MOSI | Master-Out-Slave-In |

    | PS6 (9) | SCK | Serial Clock |

    | PS7 (9) | SS0 | Slave Select |

    | SPI1 | | |

    | PP0 (4) | MIS1 | Master-In-Slave-Out |

    | PP1 (3) | MOS1 | Master-Out-Slave-In |

    | PP2 (2) | SCK1 | Serial Clock |

    | PP3 (1) | SS1 | Slave Select |

    | SPI2 | | |

    | PP4 (112) | MISO2 | Master-In-Slave-Out |

    | PP5 (111) | MOS2 | Master-Out-Slave-In |

    | PP7 (109) | SCK2 | Serial Clock |

    | PP6 (110) | SS2 | Slave Select |'
