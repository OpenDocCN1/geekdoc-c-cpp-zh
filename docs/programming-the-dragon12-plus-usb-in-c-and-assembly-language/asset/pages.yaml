    The MC9S1DG256 contains phased-locked loop (PLL) circuitry that CodeWarrior uses
    to set the frequency to 24 MHz. Thus, when you download a program to flash memory
    using CodeWarrior your program will be running at 24 MHz. However, when you move
    the LOAD-RESET switch to RUN and press the reset button, your program will normally
    run at a lower bus clock frequency that depends on the crystal on your board.
    To do this, we must include the statement PLL_init() at the beginning of our program,
    which will initialize the PLL to produce a PLL (oscillator) frequency of 48 MHz
    which results in a bus frequency of 24 MHz. The default stationary file main.c
    comes up when you create a new project contains this PLL_init() function at the
    beginning of the program. You should keep this function in all of your programs
    so that your program will always run at 24 MHz even out of reset. Appendix F describes
    this PLL_init() function in more detail.'
