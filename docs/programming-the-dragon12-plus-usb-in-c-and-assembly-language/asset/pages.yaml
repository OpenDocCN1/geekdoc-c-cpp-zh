  md: "# Example 17 – Reading the Potentiometer Value\n\nListing 6.1 shows a program\
    \ that reads channel 7 of ATDO, divides the value by 2 (to reduce noise in the\
    \ least-significant bit), and displays the result on the LCD display. The values\
    \ should vary from 0 to 511 as you turn the pot with a small screwdriver. Try\
    \ it.\n\nOn the DRAGON12-Plus-USB, if you change the channel number from 7 to\
    \ 4 in Listing 6.1, the program will read the output of the on-board phototransistor.\
    \ The resulting display on the LCD will increase as you shine more light on the\
    \ phototransistor.\n\n# Listing 6.1 Example 17\n\n```\n // Example 17: A/D Converter\
    \ -- Pot\n#include <stdio.h>      /* common defines and macros */\n#include <mc9s1dg256.h>\
    \   /* derivative information */\n#pragma LINK_INFO_DERIVATIVE mc9s1dg256b\n\n\
    #include \"main_asm.h\"      /* interface to the assembly module */\nint val;\n\
    \nvoid main(void) {\n    PLL init();             // set system clock frequency\
    \ to 24 MHz\n    ad0_enable();          // enable a/d converter 0\n    lcd_init();\
    \             // enable led\n    while(1) {\n        val = adconv(7);     // read\
    \ pot on channel 7\n        val = val >> 1;      // shift 1 bit (divide by 2)\n\
    \        set_lcd_addr(0x40);  // display on 2nd row of LCD\n        write_int_lcd(val);\
    \  // write value in field of 5\n        ms_delay(100);      // delay 0.1 seconds\n\
    \    }\n}\n```\n\n# Under the Hood\n\nThe subroutines in main.asm corresponding\
    \ to the C functions shown in Table 6.1 are given in Listing 6.2. The first three\
    \ subroutines apply to ATDO, and the last three subroutines apply to ATD1. The\
    \ subroutine ad0_enable will enable ATDO for 10-bit resolution. The frequency\
    \ of the A/D clock can be between 500 kHz and 2 MHz. It is set using the bits\
    \ [PRS4:0] in the ATD Control Register 4 in Fig. 6.3 according to the formula\n\
    \n> ATDclock=[BusClock]\n2(PRS+1) (6.1)\n\nIn the subroutine ad0_enable in Listing\
    \ 6.2, we have stored the value 0B in the control register ATDCTL4. This will\
    \ use a value of PRS=1 in (6.1), which will divide the bus clock frequency of\
    \ 24 MHz by 24, giving an A/D clock frequency of 1 MHz. Storing a value of SC0\
    \ in the control register ATDCTL2 will turn off the A/D conversion complete flag.\
    \ This feature will clear the A/D conversion complete flag when data are read\
    \ from the corresponding result register."
