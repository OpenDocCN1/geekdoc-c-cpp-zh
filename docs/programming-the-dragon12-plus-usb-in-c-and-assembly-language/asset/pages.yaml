  md: '# Pulse-Width Modulation (PWM): Motors and Servos 89


    # Chapter 7


    # Pulse-Width Modulation (PWM):

    Mot and Servos


    In this chapter we will show how to control the speed and direction of a DC motor
    input and the position of a servo. The DRAGON12-Plus-USB board has convenient
    headers and terminals for connecting motors and servos.


    # 7.1 Connecting a Motor to a Microcontroller


    When connecting a motor or some other load may draw current to a microcontroller,
    it is necessary to use some type of driver current. The SN754410 quadruple half-H
    driver board contains all connections shown in Fig-H. This is a 16-pin chip with
    the connections shown in Fig. 7.1. Separate power supply connections are for the
    input stage and the output stage of power for the output stage. When four tri-state
    buffers. Motor J18 on the DRAGON12-Plus-USB connects the 5 volts of $V_{cc}$ to
    the input determines the source of power. When using motors it is desirable to
    use a separate power supply $V_{out}$ to provide the current to the motors. Each
    driver in Fig. 7.1 can output up to 1 ampere of current. You connect the external
    voltage source to the VMOT logic on the terminal block T4 on the DRAGON12-Plus-USB.
    The SN754410 driver can handle voltages between 5 V and 36 V.


    ![](img/6c970885d6405944bd67e68f02bac5bc_94_0.png)


    The DC motor will be connected between pins $MOT1$ and $MOT2$ (between $MOT3$
    and $MOT4$) in Fig. 7.1. These are labeled on terminal block T4. The two top drivers
    are enabled with $PP0$. When $PP0$ is 1 the output $MOT1$ is high when $PB0$ is
    high and low when $PB0$ is low. Similarly, the output $MOT2$ is high when $PB0$
    is high and low when $PB0$ is low. When $PP0$ is low the outputs $MOT1$ and $MOT2$
    are in high impedance state. That is, it the same as disconnecting the motor.
    The two drivers in Fig. 7.1 are controlled by $PP1$ in a similar way.


    If a motor is connected between pins $MOT1$ and $MOT2$ in Fig. 7.1, and if $PB0$
    and $PB1$ are low and $PP0$ is 1 the motor will rotate in one direction. If $PB0$
    is low then current will flow through the motor in the opposite direction and
    the motor will rotate in the opposite direction. When $PB0$ and $PB1$ are both
    high or low then no current will flow through the motor and the motor will stop.'
  merge: -1
  pgno: 94
