  md: "# Under the Hood\n\nWhen the C function ms_delay(int n) is called, the assembly\
    \ language subroutine ms_delay shown in Listing 2.10 executed. The number of milliseconds\
    \ to delay, n, is passed to the subroutine in accumulator D.\n\nThe first two\
    \ instructions in the subroutine ms_delay push registers X and Y on the stack.\
    \ This is because we change the values of X and Y in this subroutine, which will\
    \ destroy these values if they are being used by the program that called this\
    \ subroutine. We can never know if this is the case, it is always important to\
    \ store the contents of any register we use at the beginning of a subroutine,\
    \ and restore these values at the end of the subroutine. In Listing 2.10 the two\
    \ instructions push and pull (or pop) the values of Y and X from the stack. Note\
    \ that the order of pulling values from the stack will be the opposite of pushing\
    \ values on the stack. For each push instruction, there must be a corresponding\
    \ pull instruction, to ensure that the return address is left on the top of the\
    \ stack for the RTS instruction to return to the next instruction in the calling\
    \ program.\n\n```\nListing 2.10 ms_delay Assembly Language Subroutine from main.asm\n\
    ms_delay\n; input:D = no. of milliseconds to delay\n; clock = 24 MHz\nms_delay:\n\
    \    psxh\n    pshy\n    tfr\n    ldx      D,Y\nmdl:     #5999   ; N = (24000\
    \ - 6)/4\nmd2:     dex      ; 1 ccycle\n    bne      md2     ; 3 ccycle\n    dey\n\
    \    bne      md1     ; Y ms\n    puly\n    pulx\n    rts\n```\n\nThe third instruction\
    \ in the subroutine ms_delay transfers the value in D (the number of milliseconds\
    \ to delay) to the index register Y. Index register X is loaded with the decimal\
    \ value 5999 ($176F). The loop\n\n```\nmd2:     dex      ; 1 ccycle\n    bne \
    \     md2     ; 3 ccycle\n```\n\nwill then decrementing X until it becomes zero.\
    \ Thus, each of these two instructions are executed a total of 5999 times. The\
    \ instruction dex takes one cycle and the instruction bne takes 3 cycles. You\
