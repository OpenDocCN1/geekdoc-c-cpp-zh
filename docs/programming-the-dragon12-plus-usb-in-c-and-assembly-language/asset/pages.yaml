    Figure 6.1 Illustrating the method of successive approximation


    The successive approximation method illustrated in Fig. 6.1 can be implemented
    using a comparator and D/A converter as shown in Fig. 6.2. Assuming a 4-bit A/D
    converter as shown in Figure 6.1, the control circuit will first put out the binary
    value 1000. The D/A converter will convert this value to $V_{DA} = 2.5V$. Because
    this value is less than $V_{in} = 3.5V$, the output, $C$, of the comparator will
    be 1. This tells the control circuit to keep this bit and output the value 1100
    in the second step, as shown in Fig. 6.1. This time the value of $V_{DA} = 3.75V$
    is greater than $V_{in} = 3.5V$, and therefore the output, $C$, of the comparator
    will be 0. This tells the control circuit to throw away this bit and output the
    value 1010 in step 3. This bit is kept as the last bit as shown in Figure 6.1.


