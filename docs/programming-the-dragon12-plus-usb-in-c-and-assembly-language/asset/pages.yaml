  md: '# 1.2 DRAGON12-Plus-USB™ Board


    The DRAGON12-Plus-USB board from Wytec is shown in Fig. 1.3. This board contains
    the Freescale MC9S12DG256 microcontroller surrounded by four convenient female
    headers that bring out of the I/O ports. This makes it easy to interface with
    your I/O circuitry on the attached board. In the board contains a four-digit 7-segment
    display, four pushbutton switches, an 8-position DIP switch, eight LEDs, a potentiometer
    for reading in an analog voltage between 0 and 5 volts, a liquid crystal display
    (LCD), a 4 x 4 keypad, a D/A converter chip, a temperature sensor, a light sensor,
    and an IR transmitter and receiver that can be used to detect the presence of
    an object. The DRAGON12-Plus-USB also has an on-board speaker, a built-in H-bridge
    for driving motors, and convenient headers for connecting servos and an accelerometer
    board available from Wytec.


    ![](img/6c970885d6405944bd67e68f02bac5bc_9_0.png)


    Figure 1.3 The Wytec DRAGON12-Plus-USB board


    # 1.3 The CodeWarrior Development Tools


    Traditionally microcontrollers have been programmed in assembly language. The
    advantage of assembly language is that it is closest to the hardware and can execute
    programs most efficiently. The disadvantage of assembly language is that it is
    not portable. Every time you change to a different microcontroller you have to
    rewrite all of your programs. In addition, it generally takes longer to say something
    in assembly language than it does in a high-level language, and therefore it takes
    longer to write assembly language programs than to write high-level programs.
    The trend in recent years is to program microcontrollers in a high-level language
    – the most popular being


    C. CodeWarrior Development Tools are available from Freescale for programming
    your microcontrollers in assembly language and C. The Special Edition is a free
    download that has code size restrictions, which will not be a concern for you.
    You will need to download the S(12) microcontroller version from www.freescale.com.
    (See Appendix A).


    One useful feature of CodeWarrior is the ability to create stationary projects
    upon which you can build your own. We have created a stationary project for the
    DRAGON12-Plus-USB. This project, called LBE_DRAGON12_+, is available to download
    from www.lbebooks.com. This stationary project contains over eighty assembly language
    routines that we write to access to all of the important I/O functions of the
    Freescale MC9S12DG256 microcontroller. When you create your own project by following'
