  md: '# B.1.4 Program Counter, PC


    The program counter, *PC*, is a 16-bit register that contains the address of the
    next instruction to be executed. When any instruction is executed the program
    counter is automatically incremented the number of times needed to point to the
    next instruction. HCS12 instructions may be from one to six bytes long. Therefore,
    the program counter may be incremented by 1 to 6 depending upon the instruction
    being executed.


    Some instructions cause the program counter to change to some new value rather
    than simply being incremented. These include the branching, jump, and subroutine
    instructions. We will discuss subroutines in Section B.3 and branching instructions
    in Section B.4.


    # B.1.5 The Condition Code Register


    The HCS12 has a condition code register (CCR) that contains five status flags
    or condition codes and three control flags. The five status flags are the carry
    flag (*C*), the zero flag (*Z*), the negative flag (*N*), the overflow flag (*V*),
    and the half carry flag (*H*). The three control flags are the interrupt mask
    flag (*I*), the X-interrupt mask flag (*X*), and the stop disable flag (*S*).
    Each flag is one bit in the condition code register. The location of each flag
    is shown in Figure B.2.


    ![](img/6c970885d6405944bd67e68f02bac5bc_177_0.png)


    Any of the bits in the condition code register (with the exception of the *X*
    bit) can be set using the HCS12 instruction *ORCC*. This instruction will perform
    a logical OR of the CCR with a byte in memory (immediate addressing) containing
    a 1 in the bit locations to set. Any of the bits in the condition code register
    can be cleared by the HCS12 instruction *ANDCC*. This instruction will perform
    a logical AND of the CCR with a byte in memory containing a 0 in the bits to be
    cleared.

    We will now look at the meaning of each bit in the condition code register.


    **Carry (C)**

    The carry flag is bit 0 of the condition code register. It can be considered to
    be an extension of a register, or memory location operated on an instruction.
    The bit is changed by three different types of instructions. These are first arithmetic
    instructions. These include the addition instructions *ADDA*, *ADDB*, *ADDD*,
    *ADCA* (add with carry), *ADCB*, and *ABA* (add *B* to *A*), the subtraction instructions
    *SUBA*, *SUB*, *SUBD*, *SBCA* (subtract carry from *A*), *SBCB*, and *SBA* (subtract
    *B* from *A*), and the compare instructions *CMPA*, *CMPB*, *CBA*, *CPD*, *CPX*,
    and *CPY*. The carry bit is also changed by the multiplication'
  merge: -1
  pgno: 177
- img_proc: true
  md: '# HCS12 Assembly Language Essentials


    instructions, MUL, EMUL, and EMULS, the five division instructions, IDIV, IDVS,
    EDIV, EDVS, FDIV, the negate instructions, NEG, NEGA, and NEGB, and the decimal
    adjust instruction, DAA.


    The second group of instructions that can carry the bit are the shifting and rotating
    instructions such as ASL, ASLA, ASLB, ASR, ASRA, ASL, LSLA, LSLB, LSR, LSRA, LSRB,
    LSRD, ROLA, ROLB, RORA, ROR, and RORB.


    Finally, the bit can be set to 1 with the instruction CLC (clear carry). These
    instructions are valid for the 6HC11 get translated to the HCS12 instructions
    ORCC #501 and ANDCC #5FE respectively.


    # Zero Flag (Z)


    The zero flag is bit 2 of the condition register. This flag is set to 1 when the
    result of an instruction is zero. If the result of an instruction is not zero,
    the Z flag is cleared to zero. This Z flag is tested by the branching instruction
    BEQ (branch if equal to zero, Z=1) and BNE (branch if not equal to zero, Z=0).
    These branching instructions are described in Section B.4.


    # Negative Flag (N)


    The negative flag is bit 3 of the condition register. Negative numbers are stored
    in HCS12 computers using the two''s complement representation. In this representation
    a negative number is indicated when bit 7 (the left-most) of a byte is set to
    1. When the result of an instruction leaves the sign bit (bit 7 of a byte or bit
    15 of a word), the N flag is cleared to 1. If the result of an instruction is
    positive,the sign bit is 0), the N flag is cleared to 0. The N flag is tested
    by the branching instruction BMI (branch if minus, N=1) and BPL (branch if plus,
    N=0). These branching instructions are described in Section B.4.


    # Overflow Flag (V)


    The overflow flag is bit 1 of the condition register. It is set any time the signed
    (two''s complement) operation is out of range. The V flag is tested by the branching
    instructions BVS (branch if overflow set, V=1) and BVC (branch if overflow clear,
    V=0).


    # Half Carry (H)


    The half carry flag is bit 5 of the condition register. It contains the carry
    from bit 3 resulting from an 8-bit addition or subtraction operation. The half
    carry flag is used by the microprocessor when performing binary-coded decimal
    (BCD) addition. As a programmer you generally not need to worry about the half-carry
    flag.


    # Interrupt Mask (I)


    The interrupt mask flag is bit 4 of the condition register. When it is set to
    1, hardware interrupts are masked and the HCS12 will not respond to an interrupt.
    When the I flag is cleared to 0, interrupts are enabled and the HCS12 will serve
    hardware interrupts.


    The I flag is set to 1 with the instruction SEI (set interrupt mask) and is cleared
    to zero with the instruction CLI (clear interrupt). The 6HC12 translates these
    two instructions to ORCC #$10 and ANDCC #$FE respectively. A more detailed discussion
    of interrupts will be given in Section B.


    ![](img/6c970885d6405944bd67e68f02bac5bc_178_0.png)'
