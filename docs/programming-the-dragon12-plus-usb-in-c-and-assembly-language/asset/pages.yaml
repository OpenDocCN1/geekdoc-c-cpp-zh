  md: '# Table 5.2 Traffic Light States


    | State | North - South | East - West | Delay (sec.) |

    |---|---|---|--|

    | 0 | Green | Red | 5 |

    | 1 | Yellow | Red | 1 |

    | 2 | Red | Red | 1 |

    | 3 | Red | Green | 5 |

    | 4 | Red | Yellow | 1 |

    | 5 | Red | Red | 1 |


    The idea is to use interrupts so that the entire operation will be carried out
    in the background without need for the CPU to intervene to keep the traffic lights
    going. The same idea can be used to cycle through any set of states, which you
    can change by writing to an output port.


    We begin by defining two arrays that represent the six states in Table 5.2. These
    arrays are called lights[] and delay[] in the program showing in List 5.5. The
    first in the array lights[] is the value 0x0C. This is binary value 00001100 which
    will be written to Port M. The bits in Port M will be assigned to the "colored"
    LEDs according to the bit positions -RYGYG. Thus the value 0x0C will turn on the
    green north-south and the red east-west.


    The first entry in the array delay[] is the delay time measured in ticks. A tick
    will be the time between interrupts, which is 10.24 ms. Therefore, a delay of
    1 second will be 488 ticks and a delay of 5 seconds will be 98 ticks. The rest
    of the entries in the lights[] array stores the values to write to Port M for
    each state, and the corresponding entries in the delay[] array contain the time
    for that state.


    The variable timeout defined at the beginning of the program in List 5.5 is to
    hold the number of ticks before that move to the next state. This value will be
    initialized to 1 so that a state change will occur on the first interrupt. The
    variable ix will be the index to the states.


    The interrupt service routine, handler(), as shown in List 5.5 by decrementing
    the value of dime. If the decremented value is not zero then the IF statement
    is skipped and the RTIF flag is cleared. If the decremented value of dime is equal
    to zero the interrupt service routine is executed. The first statement on the
    next set of lights by writing the value of lights[ix] to Port M. The next statement
    stores the corresponding time for state in dime. The state index ix is incremented
    and when it equals the number of states (6) it is reset to zero.


    In the main program, Port M is set as output, the real-time interrupts are enabled,
    ix is set to 0, and dime is set to 1. The main program then enters an infinite
    while loop. The interrupt routine takes care of changing the traffic lights on
    schedule. The main program could go on and do useful things while the traffic
    light is changing all on its own!


    Listing 5.6 is a version of this traffic lights program that will run directly
    on the DRAGON12-Plus-USB using its red LEDs as the traffic lights. You will have
    to pretend that some of them are yellow and green!'
