    input and output variables. These fuzzy sets are described by membership functions
    of the type shown in Figure E.6. These fuzzy set values are labeled NM (negative
    medium), NS (negative small), PS (positive small), and PM (positive medium). For
    example, if an input variable is temperature, the five membership functions might
