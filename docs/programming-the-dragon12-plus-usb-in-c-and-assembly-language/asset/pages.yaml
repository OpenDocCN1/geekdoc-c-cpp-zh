  md: '# Appendix B


    # HCS12 Assembly Language Essentials


    # B.1 The HCS12 Registers


    The programming model of the HCS12 is identical with that of the 68HC11 and 68HC12.
    It consists of the set of registers shown in Figure B.1. We will refer to these
    as the CPU registers. The HCS12 also contains a register block that is associated
    with the various I/O operations of the HCS12.


    In this section we will describe the CPU registers and illustrate how data can
    be moved into and out of these registers using some of the HCS12 instructions
    and addressing modes.


    | Accumulator A | A | B | Accumulator B |

    | Accumulator D | D | |

    | Index register X | IX |

    | Index register Y | IY |

    | Stack Pointer | SP |

    | Program counter | PC |

    | | S X H I N Z V C | Condition register |


    Figure B.1 The HCS12 Registers


    # B.1.1 The HCS12 Accumulators


    The HCS12 has two 8-bit accumulators, A and B, that can be combined into the single
    16-bit accumulator D. That is, A is the upper 8-bits of D and B is the lower 8-bits
    of D. The accumulators are used for storing intermediate results and for performing
    arithmetic and logical operations. The following are some of the instructions
    involving accumulators A, B, and D.'
