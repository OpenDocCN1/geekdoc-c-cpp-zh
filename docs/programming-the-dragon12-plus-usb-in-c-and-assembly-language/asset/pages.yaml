  md: '# Phase Locked Loop


    The first two instructions in Listing F.1 store a value of 2 in register SYNR
    and a 0 in register REFDV. The value of the oscillator frequency, OSCLK, on the
    DRAGON12-Plus_USB is 8 MHz. Using the equation for PLLCLK in Fig. F.2, this will
    produce a PLLCLK frequency of


    ```

    $PLLCLK = 2\times10^6\times\frac{(2+1)}{(0+1)} = 48\text{ MHz}$

    ```


    The next instruction in Listing F.1 will clear the register CLKSEL, which, from
    Fig. F.2, will clear bit PLLSEL. This means that the bus frequency, BUSCLK, will
    be


    ```

    $BUSCLK = OSCLK/2=8\times10^6/2 = 4\text{ MHz}$

    ```


    It is necessary to use this bus frequency because, at this point, the PLL is not
    locked. The one-instruction loop, pll1;, in Listing F.1 will wait for the PLL
    to lock by polling the LOCK bit in the CRGFLG register in Fig. F.2.


    The last instruction in Listing F.1 will set the PLLSEL bit in the CLKSEL register
    in Fig. 5.2. This means that the bus frequency, BUSCLK, will now be


    ```

    $BUSCLK = PLLCLK/2=48\times10^6/2 = 24\text{ MHz}$

    ```


    Thus, after calling the C function PLL_init(), the bus frequency will be 24 MHz.'
