    # B.5.2 68HC12 Maskable Interrupts


    All of the interrupts shown in Appendix D with vector numbers between 6 and 57
    are maskable interrupts that are inhibited when the I bit in the CCR is set (using
    the SEI instruction). To enable all of these maskable interrupts you must clear
    the I bit in the CCR by executing the CLI instruction. In addition, each interrupt
    source will have a local enable bit that must be set in one of the I/O registers
    to enable that particular interrupt, for example, to enable PE. For an IRQ interrupt,
    you must set IRQEN (bit 6) in the Interrupt Control Register, INCTR.


    The interrupts shown in Appendix D are listed in order of priority. If more than
    one interrupt occurs at the same time, the interrupt with the highest priority
    will be serviced first.


    When maskable interrupts occur the same process of pushing the registers on the
    stack occurs as described above for software interrupts.'
