  md: 'When the conversion is complete, bit 7 (SCF) of the ATD Status Register 0,
    shown in Fig. 6.4, is set to 1. The branch on clear statement


    ```

    ad01    brclr ATDSTATO,$80,ad01

    ```


    in the subroutine adconv in Listing 6.2 will branch on itself as long as the AND
    of ATDSTATO with $0 is zero, i.e., as long as bit 7 of ATDSTATO is 0. So as if
    the SCF flag goes to 1, the branch will fail, and the next instruction, bsr avg40,
    will be executed.


    | ATD Status Register 0 (ATDSTATO–0x0906) (ATDSTAT1–0x0126) |

    | 7 | 6 | 5 | 4 | 3 | 2 | 1 | 0 |

    |---|---|---|---|---|---|---|---|

    | SCF | | ETOFR | FIFOR | | CC2 | CC1 | CC0 |

    SCF1: Conversion sequence completed

    SCF0: Conversion sequence not completed

    ETORF— Trigger Overrun Flag

    FIFOR— FIFO Over Run Flag

    CC[2:0]: Conversion counter


    Figure 6.4 ATD Status Registers


    The subroutine, avg40, will average the four values that have been stored in the
    first ATD Conversion Result shown in Fig. 6.5. Note that the 10-bit conversion
    result is right justified in the two bytes ATDR0H/ATDR0L. In the subroutine, avg40,
    index register X points to ATD0RH. The first conversion result in ATDR0H/ATDR0L
    is loaded into accumulator D, and each of the next three conversion results are
    added to this value. The result is then divided by 4 (by shifting 2 bits to the
    right) to produce the average value in D. This is the result that is returned
    in the function int adconv(char cht).


    | ATD Conversion Result Registers (ATD0RH–0x09D0) (ATD1RH–0x0130) |

    | 7 | 6 | 5 | 4 | 3 | 2 | 1 | 0 |

    |---|---|---|---|---|---|---|---|

    | 0 | 0 | 0 | 0 | 0 | 0 | bit9 | bit8 | ATDR0H

    | bit 7 | | bit 5 | bit 4 | bit 3 | bit 2 | bit 1 | bit0 | ATDR0L

    | 0 | 0 | 0 | 0 | 0 | 0 | bit9 | bit8 | ATDR1H

    | bit 7 | | bit 5 | bit 4 | bit 3 | bit 2 | bit 1 | bit0 | ATDR1L

    | 0 | 0 | 0 | 0 | 0 | 0 | bit9 | bit8 | ATDR2H

    | bit 7 | | bit 5 | bit 4 | bit 3 | bit 2 | bit 1 | bit0 | ATDR2L

    | 0 | 0 | 0 | 0 | 0 | 0 | bit9 | bit8 | ATDR3H

    | bit 7 | | bit 5 | bit 4 | bit 3 | bit 2 | bit 1 | bit0 | ATDR3L


    Figure 6.5 The first four of (eight) Conversion Result Registers'
