  md: '# Chapter 1


    # Introduction


    The HCS12 is a family of Freescale microcontrollers and is a direct descendant
    of the original Motorola 68HC11 and the more recent 68HC12. In this book you will
    learn how to program the MC9S12DG256 microcontroller that is on the Wytec DRAGON12-Plus-USB™.
    You will learn to program this microcontroller in both assembly language and C
    using the industry-standard CodeWarrior development system. To make it as easy
    as possible we have provided a stationery project that you can build upon that
    includes a large collection of built-in assembly language routines to access all
    of the various I/O functions of the MC912DG256. You will access these routines
    through C function calls.


    # 1.1 From Microprocessors to Microcontrollers


    A major revolution in the computer industry has taken place in the past 25 years.
    The making of the first microprocessor was made possible by the remarkable development
    of integrated circuits during the 1960s. This technology allowed hundreds and
    thousands of transistors to be etched onto a single piece of silicon. This led
    to the design of integrated circuits in which more and more logic elements were
    incorporated into a single chip. In 1969 Intel undertook a task to develop a set
    of integrated circuits that could be used to make a programmable calculator. Instead
    of developing yet another purpose integrated circuit with only a limited function,
    Intel chose to produce a more general purpose device, the 4004 microprocessor,
    which could be programmed to perform many different functions. This first microprocessor
    had only four data lines over which address information and data had to be sent
    to memory devices. Put this chip on the market in 1971 as part of a four chip
    set that formed a micro-able computer. The 4004 had many limitations and following
    this Intel introduced the 8008 and two years later the 8080 which became widely
    used in the history of different applications. In 1975 Motorola produced its first
    microprocessor - the 6800.


    The 6800 had 8 data lines (called a data bus) and 16 address lines (called an
    address bus). This means it could address 2¹⁶ = 65,536 different memory addresses,
    each containing 8 bits, or one byte of data. The heart of the 6800 is its CPU,
    or central processing unit, sometimes referred to as an ALU, or microprocessor
    unit. The CPU contained the registers and logic to execute the instruction set
    of the 6800. The 6800 registers included two 8-bit accumulators (A and B), a 16-bit
    index register (X), a 16-bit stack pointer (SP), a 16-bit program counter (PC),
    and an 8-bit condition-code register (CCR).'
  merge: -1
  pgno: 6
