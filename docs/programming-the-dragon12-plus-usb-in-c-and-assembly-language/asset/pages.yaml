  md: '# Chapter 11


    # Fuzzy Control


    In this example we will show how to use the DRAGON12-Plus-USB board as a fuzzy
    controller. Before reading this example you should read Appendix E.


    # 11.1 Design of a Fuzzy Controller


    In Appendix E we show that the design of a fuzzy controller consists of the three
    parts shown in Fig. 11.1. The crisp inputs are first mapped to fuzzy sets using
    get_inputs(); the fuzzy rules are then applied to the input fuzzy sets using fire_rule();
    then then defuzzification operation is performed on the output fuzzy sets to produce
    a crisp output using find_output().


    In this example we will design a fuzzy controller that will keep a ping-pong floating
    at the center of a vertical, Plexiglas cylinder. be measured by an ultrasonic
    transducer at the bottom of the cylinder. Two consecutive position readings are
    used to determine the instantaneous velocity of the ball. The output of the fuzzy
    controller will be a signal will control the speed of a muffin fan at the bottom
    of the cylinder that blows up the cylinder to keep the ping pong blows at the
    desired height. A second ultrasonic transducer outside the cylinder could measure
    the height of your hand above the floor, and the fuzzy controller could make the
    ping-pong follow your hand!


    The first step is to define the membership functions for the inputs. The two inputs
    to the controller will be the ball_position and ball_speed and we will use sets
    of membership functions shown in Fig.11.2. To use the built-in HCS12 fuzzy controller
    assembly language instructions the functions values of ball_position and ball_speed
    must be an 8-bit number between 0 and 255.


    The second step is to define the output power. The output membership functions
    are defined as singletons and are shown in Fig. 11.3. Again the value of motor_power
    must be between 0 and 255.


    The third step is to determine the fuzzy rules. These will be common sense rules
    based on the two inputs, ball_position and ball_speed, and the output, motor_power.
    It is convenient to represent these rules in the form of a 5 x 5 fuzzy K-map of
    the form shown in Fig. 11.4. The entries in this fuzzy K-map are the membership
    functions of the output, motor_power.


    ![](img/6c970885d6405944bd67e68f02bac5bc_152_0.png)'
