  md: "156  Chapter 11\n\nYou may wonder how the REV instruction can tell the difference\
    \ between the $FE at the end of the antecedents and the $FE at the end of the\
    \ consequences. The answer is that it uses the overflow bit V in the condition\
    \ register as a flag to tell the difference. This bit is automatically set to\
    \ zero when the statement LDAA #FF is executed. The REV instruction then toggles\
    \ this bit by 1 when it encounters the $FE at the end of the antecedents and clears\
    \ it to zero by reloading accumulator A with $FF when it encounters the $FE at\
    \ the end of the consequences.\n\n# The C function_rules(...)\n\nWe have written\
