  md: '# The Serial Peripheral Interface (SPI)


    one side of each key is connected to a common ground. In this section, we will
    show how the SPI port can be used to read this type of 16×1 hex keypad using 74165
    shift registers.


    A 16×1 hex keypad (any collection of 16 switches) can be connected to two 74165
    shift registers as shown in Fig. 5. In this case, one side of each switch is connected
    to ground. The 74165 is an 8-bit parallel/in shift register. The other side of
    each switch is connected to one of the parallel inputs (A–H) of the shift register.
    If pin (SH-/LD) of the 74165 is brought low, the values on the eight parallel
    inputs are latched into the shift register. With the SH-/LD pin low and the CLK
    input each bits in the shift register are shifted one to the right. Bit A is shifted
    to B, B to C, etc. Bit G is shifted to H which shows on the serial output port,
    QH. In Fig. 5, the output of the lower 74165 is connected to the serial input
    port, QIH, of SPI. The output QH of the upper 74165 is connected to the MISO port
    of one of the shift ports in the MC912DG256.


    In Fig. 5, the SPI signal CLK is connected to each CLK pin of the two 74165 chips.
    Note that the MISO pin of the SPI port is not connected to anything. The SH-/LD
    pin is not connected to anything. We are only interested in receiving bytes in
    the MISO port. To do this, we must write a dummy value (say zero) to the SPI data
    register, SPI0DR, (by calling our C function SPI0DR(0)) and it will be shifted
    into the unconnected MISO port at the same time the desired byte is shifted into
    the Miso port.


    Notice in Fig. 5 pin H of the upper 74165 (key 3) will be the first bit shifted
    out. This will be the most-significant bit of the first byte transferred. After
    transferring one byte, the register contents of the lower 74165 will have been
    shifted into the upper 74165. The value associated with key 7 will now be at the
    output QIH of the upper 74165. After a second byte is transferred, this key 7
    value will be at the most-significant byte of this second byte. If the first byte
    transferred becomes the most-significant byte then the bits of this 16-bit word
    this 16-bit integer will be associated with the 16 hex key values as indicated
    in Fig. 9.6.


    # Example 28 – Reading Data from Shift Registers Using SPI


    The C function read_16shift() shown in Listing 9.3 will return the 16-bit value
    shown in Fig. 9.6. It does this by shifting in two 8-bit bytes through the SPI
    port. Note that the high byte is read first, shifted 8 bits to the left, and ORed
    with the low byte.


    Note from Fig. 9.5 if no key is being pressed, all of the parallel inputs to the
    shift registers are pulled high. This means that all of the bits in Fig. 9.6 will
    be set to 1. Thus, the value of this 16-bit value will be 0xFFFF. If any key is
    pressed when the function read_16shift() is executed the bit associated with that
    key will be zero. The function key() shown in Listing 9.4 will search for the
    bit in Fig. 9.6 that is cleared to zero. It does this by ANDing with a mask with
