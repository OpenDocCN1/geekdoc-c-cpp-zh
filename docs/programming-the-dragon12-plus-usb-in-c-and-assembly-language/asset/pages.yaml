    This is typical of many fuzzy controllers.

    HCS12 assembly language contains three sets of instructions that are useful for

    implementing a fuzzy controller. The MEMM instruction will fill a weights array
    given

    input and membership functions. We will describe a C function that calls this

    instruction in Section 11.2. The REV instruction is used to fill the rules. The
    WAV instruction is used to

    calculate the output defuzzification centroid. We will describe a C function that
    uses

    this instruction in Section 11.4.


    # 11.2 Fuzzification of Inputs – MEM and fill_weights(…)


    The first step in designing a fuzzy controller is to define the membership functions

    for all inputs and the output. Each membership function can be defined by the

    four parameters u1, u2, u3, and u4 shown in Fig. 11.5. The MEM instruction requires
    that the

    values u3 and u4 are 8-bit values between $00 and $SFF. The weight values also
    range from

    $00 to $SFF where SFF represents a value of 1.0 in Fig. 11.5.


    The MEM instruction does not use the parameters u1, u2, u3, and u4 shown in Fig.

    11.5 to define the membership function. It uses u1 (called point_1) and u4 (called

    point_2) together with the values of the two slopes, slope_1 and slope_2, in Fig.
    11.5.

    The value of slope_1 is SFF/(u2 - u1) and the value of slope_2 is SFF/(u4 - u3).

    These values range from 00 to $SFF. If u1 = u2 or u3 = u4 then the slope is really

    infinite. In this case the values of slope_1/or slope_2 are taken to be $00 inas
    as a

    mership function. This can be defined by setting u1 = u4 and slope_1 = slope_2
    = $00.


    In the example program shown in Listing 11.1 we have allowed you to enter the

    membership functions for ball_position and ball_speed using the parameters u1,
    u2, u3, and

    u4 from Fig. 11.5 in the arrays ball_position[ ] and ball_speed[ ]. The function

    get_slopes(const unsigned char mem[ ], int maxsize) in Listing 11.1'
