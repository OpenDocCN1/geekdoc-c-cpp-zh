  md: '# Chapter 5


    # Interrupts


    In this chapter we will introduce the idea of interrupts and show how to use the
    realtime interrupt to create a count variable that increments every 10 milliseconds.
    We will use this count variable to blink a 7-segment display, implement a traffic
    light controller, and blink the Morse code SOS.


    # 5.1 Hardware Interrupts


    Hardware interrupts allow external events to interrupt the normal execution of
    a program and instead execute interrupt service routine, after which the execution
    of the original program picks up where it left off. The addresses of the interrupt
    service routines are interrupt vectors. These interrupt vectors are stored in
    a special table in memory. When a particular interrupt occurs, the address of
    the interrupt service routine is located up in the interrupt vector table and
    is transferred to that address.


    There are over 50 different sources of interrupts on the MC9S12DG256 and their
    interrupt vectors are stored in memory between the $FF80 and $FFFF. The most important
    interrupt vector is the vector vector that is located at addresses $FFFF and $FFFF.
    The RESET pin on an HCS12 microcontroller gets low, normal microprocessor functions
    are suspended. When this pin returns high the microprocessor will disable hardware
    interrupts and start executing instructions at the address stored at $FFFF-$FFFF.
    HCS12 microcontrollers have a power-on reset (POR) circuit that causes the reset
    signal to be asserted after power (5 volts) is applied to the processor.


    It is necessary for $FFFF-$FFFF to be in some of non-volatile memory (ROM, EPROM,
    or Flash memory) so that a valid vector memory will be at address. Course, the
    memory it must also be in non-volatile memory so that some meaningful code will
    be executed when you turn on the processor. In the DRAGON12-Plus-USB, the memory
    between $FF80 and $FFFF is in protected flash memory and contains the Serial Monitor
    in addition to the table of interrupt vectors.¹1 The vector at $FFFF-$FFFF connects
    to the DRAGON12-Plus-USB is to LOAD, then when you press the reset button, the
    Serial Monitor at $FF80 will be executed. If the left slide switch SW7 is set
    to LOAD, you download your program to the flash memory using CodeWarrior the Serial
    Monitor maps the interrupt vector table between $FF80 - $FFFF to unprotected flash
    memory between $F780 - $7FF and stores the starting address of your program at
    $F7FE - $7FF. If the left slide switch SW7 is set to RUN, then when you press
    the reset button your program is at $F7FE - $7FF will be executed.


    > ¹You must order the DRAGON12-Plus-USB with the Serial Monitor included; otherwise,
    by default, it comes with a Debug1 monitor installed.'
