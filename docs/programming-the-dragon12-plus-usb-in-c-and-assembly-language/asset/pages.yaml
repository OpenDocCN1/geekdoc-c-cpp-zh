- img_proc: true
  md: '# X-Interrupt Mask Flag (X)


    The X-interrupt mask flag is bit 6 of the condition register. This bit is set
    to 1 by a hardware reset at which hardware interrupts entering the XIRQ pin of
    the microprocessor are masked. The X flag can be cleared to 0 with the instruction
    ANDCC #BF after which X-interrupts are enabled. The 68HC1 can use instruction
    TAP (gets translated to TAFR in the HCS12) to clear the X flag. The X-interrupt
    mask can not be set by software. Therefore, once the X bit has been cleared to
    zero the XIRQ is essentially a non-maskable interrupt. A more detailed discussion
    of interrupts will be given in Section B.5.


    # Stop Disable Flag (S)


    The stop disable flag is bit 7 of the condition register. If this bit is set to
    1 the STOP instruction is disabled. If this bit is cleared to 0 the STOP instruction
    is enabled. When this bit is set the STOP instruction is treated as no operation
    (NOP) instruction. The STOP instruction is used to conserve power by stopping
    the internal clocks. An external interrupt is needed to start the clocks again.


    # B.3 Addressing Modes


    Addressing modes determine the address where the data associated with instructions
    are located. All of the HCS12 addressing modes are listed in Table B.1. Only the
    first six addressing modes in Table B.1 are available on the 68HC1. (On the 68HC11)
    the relative and indexed addressing use only 8-bit offsets.)


    The 68HC2 and HCS12 have added the new addressing modes shown in the bottom half
    of Table B.1. In addition, the 68HC2 and HCS12 allow 5-bit, 9-bit, and 16-bit
    offsets in the indexed addressing mode. The constant offset is added to X, Y,
    SP, or PC to compute the effective address. For example, if X contains the value
    $1234, the instruction LDD -2,X will store the value D at address $1234 minus
    2 or $1232. This will store the contents of A at $1232 and the contents of B at
    $1233. Similarly, the instruction JSR 0,Y will jump to a subroutine at the address
    stored in Y.


    The pre-decrement addressing mode computes the effective address by first decrementing
    X, Y, or SP by a value of 1 to 8. For example, if X contains the value $1234 then
    the instruction STAA1,-X will decrement X by 1 to $1233 and then store the value
    of A at address $1233.


    As a second example, consider the MOVW instruction which is of the form


    ```

    MOVW source, dest

    ```


    and moves a word (16-bits) from the effective address source to the effective
    address dest. (There is also a MOVB instruction which moves an 8-bit byte). The
    addressing mode for source can be either immediate, extended, indexed, and the
    addressing mode for dest can be either extended or indexed.


    For example, suppose that X contains the value $1234 and the word $5678 is stored
    at address $1234 as shown in Figure B.3. Then after executing the instruction
    MOVW 0,X,-X'
