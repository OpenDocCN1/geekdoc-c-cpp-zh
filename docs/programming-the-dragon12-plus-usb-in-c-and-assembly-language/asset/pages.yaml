  md: '# B.4 Branching Instructions


    The HCS12 has a large number of branch instructions. There are two major categories,
    short branch and long branch instructions. When writing assembly language programs
    you would normally use short branch instructions. We will first look at short
    conditional branch instructions that test only a single bit in the condition code
    register. We will then explore the difference between unsigned and signed branch
    instructions.


    # B.4.1 Short Conditional Branch Instructions


    The instructions shown in Table B.3 test the state of one of flags in the condition
    code register, other will be described in later sections, test some combination
    of the status flags.

    A branching instruction will cause a branch to occur if the branch test is true.
    For example, the branching instruction BEQ (branch if equal) will cause a branch
    in the program if the Z flag in the condition code register is 1. This will be
    the case if the previous instruction produced a result of zero.


    | Operation | Mnemonic | Branch Test |

    |---|---|---|

    | Branch if equal zero | BEQ | Z = 1 |

    Branch if not equal zero | BNE | Z = 0 |

    Branch if plus | BPL | N = 0 |

    Branch if minus | BMI | N = 1 |

    Branch if carry clear | BCC | C = 0 |

    Branch if carry set | BCS | C = 1 |

    Branch if overflow set | BVS | V = 1 |

    Branch if overflow clear | BVC | V = 0 |


    The conditional branch instructions shown in Table B.3 are all bytes long. The
    first byte is the opcode and the second byte is the relative displacement of the
    branch destination. This is the two''s complement number that must be added to
    the value of the program counter +2 (the address of the next instruction) to obtain
    the address of the instruction to be executed if the branch test is true. If the
    branch test is false, then the instruction following the branch instruction is
    executed. This is illustrated in Fig. B.6. Note that if Z=1 when the BEQ instruction
    is executed, the program will branch to the address formed by adding the displacement
    (06) to the address of the next instruction (5014); that is, to address 501A =
    5014 + 06.'
