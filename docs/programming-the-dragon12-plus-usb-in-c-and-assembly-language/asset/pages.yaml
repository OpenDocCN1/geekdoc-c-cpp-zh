  md: '# Chapter 4


    The signal, RS, can be thought of as register signal that selects the LCD control
    register (RS = 0) or the LCD data register (RS = 1). The read/write R/W is 1 for
    a read operation and 0 for a write operation. Data or instruction codes are written
    on the falling edge of E, and E must be high for a read operation.


    The HD4780 has its own instruction set in Table 4.1. (For a complete data sheet
    to go to http://www.hitachi.com/). The first eight are instruction codes that
    are written to the LCD control register with RS = 0 and R/W = 0 as shown in Fig.
    4.1. The last two in Table 4.1 show the behavior of the busy-flag and address
    counter when reading from the LCD control register with RS = 0 and R/W = 1 as
    shown in Fig. 4.1.


    | Instruction | DB7 | DB6 | DB5 | DB4 | DB3 | DB2 | DB1 | DB0 | Description |

    |---|---|---|---|---|---|---|---|---||

    | Clear display | 0 | 0 | 0 | 0 | 0 | 0 | 0 |   | Clears display and returns cursor
    to home. Sets I/D=1 in Entry Mode. |

    | Return home | 0 | 0 | 0 | 0 | 0 | 0 | 0 | 1 | Returns cursor to home position
    (Address 0) Sets I/D=0 in Entry Mode. |

    | Entry mode | 0 | 0 | 0 | 0 | 0 | 0 | 1 | I/D | I/D=1: increment counter; S=normal;
    I/D=0: decrement counter; S=shift |

    | Display ON/OFF control | 0 | 0 | 0 | 0 | 0 |  | C | B | Sets ON/OFF of display
    (D), cursor (C), and blink of cursor (B). |

    | Cursor or shift | 0 | 0 | 0 |  | 1 | S/C | R/L | X | S/C=1: shift display; S/C=0:
    move cursor; R/L=1: shift left; R/L=0: shift right; DL=8; DL=0; DL=4; N=2; N=1;
    F=1; F=5; F=0x5 shift; F=0x7 shift. |

    | Function set | 0 | 0 | 1 | DL | N | F | X | Sets the function set. CG RAM is
    not affected. |

    | Set the CG address | | 1 | | CG address | | | | |

    | Set the DD RAM address | | | DD RAM address | | | | | Sets the DD RAM address,
    after DD RAM data is sent and received. |

    | Read busy flag/BF address | | | | Address counter | | | | Read busy flag (BF)
    and address counter contents. |


    The HD4780 contains a 128-byte data memory (DD RAM) that contains the ASCII characters
    of being displayed on the LCD. This DD RAM is set (address 0 is the display position)
    using the Set DD RAM address instruction. After this is done, subsequent data
    writes will write the ASCII code of the character to be displayed to the DD RAM
    address (and then increment the DD RAM address so that the next character will
    be displayed in the next location.


    The HD4780 also contains a 64-byte character-generator memory (CG RAM) that can
    be used to change the font of 16 different characters. If you are interested in
    this you can consult out the HD4780 data sheet.


    The data bus DB0-DB7 on the HD4780 can be connected directly to a microcontroller''s
    data bus and the controller can be wired up to read and write to a series of addresses.
    The HD4780 can also be connected to the parallel I/O ports on a microcontroller
    and software can be used to produce the control signals shown in Fig. 4.1. This
    is the approach taken on the DRAGON12-USB board.


    The diagram in Fig. 4.2 shows how the LCD controller on the DRAGON12-USB board
    is connected to Port K of the MC68HC912DG256. Note that only the upper 4 bits
    of the LCD controller data bus are connected to PTK[5:2] while the enable signal
    E is connected to PK1 and the register select signal RS is connected to PK0. The
    read/write line is connected to PK7 through the header J5 on the DRAGON12-USB
    board. This J5 header can also connect the read/write line to provide write-only
    operation'
