  md: '# Pulse-Width Modulation (PWM): Motors and Servos


    The polarity register, PWMPOL, in Fig. 7.3a will determine if the PWM signal starts
    high and goes low, or starts low and goes high. In Listing 7.2, we set the channel
    bits to 1 in this register, so in our case, the PWM signal will clear the center
    enable register, PWMCAE, in Listing 7.2, the PWM signal will be aligned. Two motors
    can be concatenated to a 16-bit PWM channel by setting the appropriate bits in
    the PWM control register, PWMCTL. For the motors we are using the two 8-bit channels
    0 and 1, so we use 4 bits in PWMCTL in Listing 7.2.


    The value stored in the channel duty register, PWMDTX, in Fig. 7.3b will determine
    when the PWM signal will go low. By storing a value of 128 in this register in
    Listing 7.2, the initial duty cycle will be 50%. The last insert in the motor
    initialization subroutine will set the appropriate bit in the PWM enable register,
    PWMME, in Fig. 7.3a. Once the PWM channel is enabled, the PWM signal will appear
    on the corresponding pin of Port P (PTP). The subroutines motor_off and motor1_off,
    in Listing 7.2 will stop the motors by disabling the PWM signal.


    The speed of the motor is changed by changing the value in the channel duty register,
    PWMDTX. The subroutines motor_0 and motor1 in Listing 7.2 do this by writing the
    value所在 in accumulator B to the channel duty register, PWMDTX.


    # 7.2 DC Servo Motors


    A servo motor is a special type of device that contains a DC motor, some gears,
    a potentiometer, and electronics for position feedback control, all packaged in
    a single compact device. These servos are widely used in model airplanes and radio
    controlled cars and are mass produced and very inexpensive. A typical servo of
    this type, the Futaba S3004, is shown in Fig. 7.4. This servo has three wires
    attached to it: the red wire goes to +5 volts, the black wire goes to ground,
    and the white wire goes to a PWM signal that controls the position of the motor
    shaft.


    ![](img/6c970885d6405944bd67e68f02bac5bc_100_0.png)


    The motor shaft is prevented from moving more than 90 degrees by limit stops.
    The PWM signal used to control the position of a servo is shown in Fig. 7.5. Note
    that the period is fixed at 20 ms and the pulse width varies from about 1.1 ms
    to 1.9 ms in order to move the servo position through a total angle of about 90
    degrees.


    Inasmuch as the useful duty cycle of the PWM signal varies from about 5 to 10
    percent, we will use the 16-bit out PWM clock in order to provide a resolution
    of 60,000 over the 20 ms period. In this case, the value of duty in Fig. 7.2 would
    be about 4500 for the neutral position, 3300 for the +45 degree position, and
