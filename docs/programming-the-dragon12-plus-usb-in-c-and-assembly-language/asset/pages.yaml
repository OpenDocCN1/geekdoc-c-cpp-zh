    # Under the Hood


    The registers used for programming the PWM module are shown in Figs. 7.3a and
    7.3b. Each of the output ports Port P (PTP) can be enabled as a PWM output using
    the PWM register in Fig. 7.3a. The time at which the output goes high and low
    is controlled by the 8-bit counter, PWMCNTX, shown in Fig. 7.3b. The clock source
    for this counter can be clock A, B, S1, or S4, depending on the settings in register
    PWMCLK. For channels 0 and 1, which are used in the motor driver in Fig. 7.1,
    we have selected clock S4 in the subroutines motor0 init and motor1 init. The
    frequency is determined by clock scaling and prescaling registers, PWMSCLK, and
    PWMPRCLK in Fig. 7.3b. In Listing 7.2, we have set the prescaler clock, PWMPRCLK,
    to hex $22, which means that the clock A is the bus clock (24 MHz) divided by
    4, or 6 MHz. The scale S4 register is set to hex $75 = 117$, which means that
    the S4 clock rate is $6 MHz/(2<117) = 25.64$ kHz.


    If we set the period register, WMPER, in Fig. 7.3b to 255, the period will be
    255/25.64 kHz = 9.95 ms.'
