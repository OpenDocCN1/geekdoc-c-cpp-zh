  md: '# Example 8 – Switches on the DRAGON12-Plus-USB


    Figure 3.2 DRAGON12-Plus-USB DIP switch SW1 connections to Port H


    +5V

    100 kΩ

    nThe pushbuttons and DIP switches on the DRAGON12-Plus-USB board are connected
    to Port H (PTH) as shown in Figs. 3.1 and 3.2. The program in Listing 3.1 will
    read PTH, (i.e. flip) each bit by using the bitwise NOT operator ~, and write
    the resulting value to the red LEDs. If the DIP switches are open (in the up position)
    and you are not pressing any pushbutton, reading PTH will read all 1s or #FF.
    Complementing this value will give 00 and all LEDs will be off. Pressing any pushbutton
    will ground the corresponding bit of Port H, which, when complemented, will become
    1 and turn on the corresponding LED. Thus, if you run the program in Listing 3.1,
    then any of the four pushbutton switches will light up the corresponding LED.
    Closing any of the DIP switches will also light up the corresponding LED. Note
    that all bits of Port H must be programmed as inputs by setting the data direction
    register DDRH to 0x00.


    To tell if switch SW2 is pressed we must first read the PTH register and test
    if it is bit 3 a 1 (SW2 open) or 0 (SW2 closed). We can do this by ANDing the
    value from PTH with the mask 00001000 (08). If the switch is open (not pressed),
    then the result of this AND operation will be 0x8. On the other hand, if the switch
    is closed (pressed), then the result of this AND operation will be 0x0. Similar
    masks can be used to test the pressing of pushbutton switches SW3, SW4, and SW5.


    The C program in Listing 3.2 will display a 2 on the 7-segment display number
    0 while switch SW2 is being pressed, de-is pressed, display a 3 on the 7-segment
    display number 1 while switch SW3 is being pressed, display a 4 on the 7-segment
    display number 2 while switch SW4 is being pressed, and display a 5 on the 7-segment
    display number 3 while switch SW5 is being pressed.


    ![](img/6c970885d6405944bd67e68f02bac5bc_37_0.png)'
