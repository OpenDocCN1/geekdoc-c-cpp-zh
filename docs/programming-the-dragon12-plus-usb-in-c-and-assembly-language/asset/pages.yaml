    # Example 5 – Turning Bits On and Off


    In this example we will show how to turn on and off individual LEDs on the DRAGON12-Plus-USB
    board. We will first show you how to do this entirely in C, and then we will provide
    new C functions to do this.


    Recall from Fig. 2.2 that setting a bit in Port B will turn on the corresponding
    LED on the DRAGON12-Plus-USB. Thus, it will be important to be able to set a bit
    in register 1 or clear a particular bit to 0.


    Suppose you want to set bit 3 of Port B to one, leaving all other bits unchanged.
    You can do this by ORing PORTB with the mask shown in Fig. 2.6. Note that ORing
    a bit with 0 will leave the bit unchanged, while ORing a bit with 1 will force
    the bit to be 1. From Table 2.5, we can do this by using either the C statement


    ```

    PORTB = PORTB | 0x08;

    ```


    (2.1)


    where |= is the C operator for bitwise OR. That is, each bit in PORTB is ORed
    with the corresponding bit in the hex value 0x08. A shorthand for writing the
    C statement (2.1) is


    ```

    PORTB |= 0x08;

    ```


    (2.4)


    Thus, statements (2.1) and (2.2) are equivalent when |= is called a shorthand
    assignment operator. Other C operators assignment operators are shown in Table
    2.5.


    | 7 | 6 | 5 | 4 | 3 | 2 | 1 | 0 |

    | PB7 | PB6 | PB5 | PB4 | PB3 | PB2 | PB1 | PB0 |

    | 7 | 6 | 5 | 4 | 3 | 2 | 1 | 0 |

    | 0 | 0 | 0 | 0 | 1 | 0 | 0 | Mask |


    Fig. 2.6 Setting a bit to 1 by ORing with the mask


    Suppose now you want to clear bit 3 of Port B to zero, leaving all other bits
    unchanged. You can do this by ANDing PORTB with the mask shown in Fig. 2.7. Note
    that ANDing a bit with a 1 will leave the bit unchanged, while ANDing a bit with
    a 0 will force the bit to be 0. A statement that does this is


    ```

    PORTB = PORTB & 0xF7;

    ```


    (2.3)'
