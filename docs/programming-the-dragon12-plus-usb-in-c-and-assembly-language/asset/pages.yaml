    | SCI0 - Serial Communications Interface

    ; Initialize SCI0, input: D = baudrate

    SCI0_init:

    CLR CLORCI0 ;8-bit data, no parity

    MOV #$50C, SCI0CR2 ;enable TE, RE; no interrupts

    TFR D,X ;calculate baud rate

    LDY #$0016 ;baudrate = 24MHz/(16*BR)

    LDD #$E360 ;24MHz/16 = $16E360

    EDIV ;Y = (Y:D)/X = $16E360/baudrate

    STY SCIBDH ;BR = (SCIBDH:SCIBDL)

    RTS |


    inchar0:


    ```

    brclr SCI0SR1,$20, ;wait for RDRF

    LDAB SCI0DRL ;get char

    RTS

    ```


    outchar0:


    ```

    brclr SCI0SR1,$80 ;wait for TDRE

    STAB SCI0DRL ;write char

    RTS

    ```


    ; SCI1 - Serial Communications Interface

    ; Initialize SCI1, input: D = baudrate

    SCI1_init:


    ```

    CLR CLORCI1 ;8-bit data, no parity

    MOV #$50C, SCI1CR2 ;enable TE, RE; no interrupts

    TFR D,X ;calculate baud rate

    LDY #$0016 ;baudrate = 24MHz/(16*BR)

    LDD #$E360 ;24MHz/16 = $16E360

    EDIV ;Y = (Y:D)/X = $16E360/baudrate

    STY SCIBDH ;BR = (SCIBDH:SCIBDL)

    RTS

    ```


    inchar1:


    ```

    brclr SCI1SR1,$80,inchar1 ;wait for RDRF

    LDAB SCI1DRL ;get char

    RTS

    ```


    outchar1:


    ```

    brclr SCI1SR1,$80,outchar1 ;wait for TDRE

    STAB SCI1DRL ;write char

    RTS

    ```


    # 8.3 A Circular Queue Data Structure


    A circular queue is a useful data structure to use when you need to store characters
    read in an interrupt service routine. The queue can then be read as necessary
    without missing any of the received characters. In Example 24, we will illustrate
    this using a queue by storing values read from a keypad and then displaying them
    all on an LCD. Example 25 will use a queue to store characters received in the
    SCI port using interrupts.'
