    SPE = 1: SPI interrupts enabled.

    SPE = 0: SPI disabled.

    SPTIE = 1: SPTEF interrupts enabled.

    SPTE = 0: SPI interrupts disabled.

    MSTR = 1: SPI in Master mode.

    CPOL = 1: Active-low clocks selected. In idle state CK is high.

