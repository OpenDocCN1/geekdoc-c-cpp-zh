  md: '# Chapter 3


    # Parallel Ports - Inputs


    In this chapter we will see how to read bits from parallel ports in order to read
    the status of pushbutton and DIP switches. We will also learn how to decode a
    hex keypad.


    # 3.1 Pushbuttons and DIP Switches


    The DIP switch SW1 is connected to the same Port H as shown in Fig. 3.2. Note
    that the rightmost four DIP switches share the same lower bits of Port H with
    the four pushbutton switches. Also note that the DIP switches are connected to
    ground through 4.7 kΩ resistors. These are low enough compared with the 100 kΩ
    pullup resistors that a closed switch will still read a zero.


    ![](img/6c970885d6405944bd67e68f02bac5bc_36_0.png)


    Figure 3.1 DRAGON12-Plus-USB pushbutton connections to Port H


    In Example 8 we will show how to read the DIP switch SW1 and the four pushbutton
    switches, SW2, SW3, SW4 and SW5, on the DRAGON12-Plus-USB board. We will first
    show you how to do this in C, and then we will provide new C function calls to
    this.'
