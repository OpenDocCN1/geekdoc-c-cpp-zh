  md: '# Chapter 4


    # Liquid Crystal Displays


    In this chapter we will show how to write characters to the liquid crystal display
    (LCD) on the DRAGON12-Plus-USB board. We will provide new C function calls to
    make it easy to do this.


    # 4.1 Liquid Crystal Displays


    A liquid crystal display (LCD) is a common type of display used in a variety of
    applications such as watches, calculators, and laptop computers. Its big advantage
    is that it uses much less power than an LED and therefore can be used in battery-powered
    applications. An LCD consists of a liquid material sandwiched between two conducting
    plates. An AC voltage applied between the two conductors will cause the reflectance
    (or transmittance) of the liquid crystal to change, making a character visible.
    LCD displays come in a variety of configurations.


    For example, the Sanyo DM1623 displays 2 lines of 16 characters. This display
    and many other ones use a built-in Hitachi HD44780 LCD Controller Driver that
    performs all the functions needed to drive the LCD and provides an easy interface
    to a microcontroller using an 8-bit data bus, DB0-DB7, and three control signals,
    RS, R/W, and E. It is also possible to communicate with the Hitachi HD44780 LCD
    Controller Driver over a 4-bit data bus. This is what the DRAGON12-Plus-USB does.
    The relationships between RS, R/W, and E are shown in Fig. 4.1.


    | RS | R/W | E | Operation |

    |--- | 0 | | Write instruction code |

    | 0 | 1 | | Read busy flag and address counter |

    | 1 | 0 | | Write data |

    | 1 | 1 | | Read data |


    Figure 4.1 Relationships between RS, R/W, and E'
