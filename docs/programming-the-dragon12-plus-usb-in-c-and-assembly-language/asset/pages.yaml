  md: '# HCS12 Assembly Language Essentials


    only short branch instructions. Well written assembly language programs should
    not need to branch conditionally more than ±127 bytes. Branches should take place
    within small program segments or subroutines. If you need to perform lots of instructions
    within a loop, for example, you should use subroutine calls to make the program
    modular. This will make the program much easier to debug and maintain.


    In the unlikely event that you need to branch conditionally more than ±127 bytes
    you can use the HCS12 long branch instructions. Each of the instructions in Table
    B.3 has a long branch equivalent. For example, the instruction LBEQ (long branch
    equal to zero) uses the test Z=1 as the instruction BEQ does. however use a 16-bit
    signed displacement rather than an 8-bit displacement. This means that the branching
    displacement can range from -32,768 ($8000) to +32,767 ($FFFF). The opcodes for
    the long branch instructions are two bytes so that these long branch instructions
    use a total of four bytes and execute slower than the short branch instructions.


    # B.4.2 Unconditional Branch and Jump Instructions


    The instructions in Table B.3 are conditional jump instructions that may or not
    cause a branch to occur depending upon the value of the bits in the code register.
    Registers you may want to jump no matter what. This is called an unconditional
    branch or jump. Different versions of unconditional branch and jump instructions
    are shown in Table B.4.


    The short BRA (branch always) has an 8-bit displacement as an operand. This is
    the same two''s complement displacement described above for conditional branch
    instructions. It will allow an unconditional jump a maximum of 127 bytes forward
    or -128 bytes backward.


    If you need to jump a further distance you can use the long branch always. LBRA
    requires a two-byte operand which represents a 16-bit two''s complement number
    that must be added to the address of the next instruction to obtain the destination
    address.


    | Table B.4 Unconditional Branch and Jump Instructions |

    | Operation | Mnemonic | Operand |

    | Short Branch Always | BRA | 8-bit displacement |

    | Long Branch Always | LBRA | 16-bit displacement |

    | Jump | JMP | <effective address> |


    The short and long branch always instructions in Table B.4 use a relative displacement
    in the instruction. Since this is the number that is added to the address of the
    following instruction, it means that if the entire program is moved within the
    memory, this relative displacement does not change. The use of relative displacements
    for determining a destination address will allow you to write position-independent
    code. This means that a program can be moved to any location in memory and still
    run.


    The JMP instruction shown in Table B.2 will jump unconditionally to the effective
    address determined by the particular addressing mode used in the operand. This
    could be an absolute address (extended addressing) or some form of indexed addressing.'
