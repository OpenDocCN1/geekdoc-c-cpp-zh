    \     // prototype definitions\n#define QMAX 16               // size of queue\n\
    \nstatic char qbuff[QMAX];  // the queue\nstatic int front;\nstatic int rear;\
    \        // queue pointers\nstatic int min = 0;      // start of queue\nstatic\
    \ int max = QMAX-1;  // end of queue\n\nvoid initq(void) {\n    min = 0;\n   \
    \ front = 0;\n    rear = 0;\n    max = QMAX-1;\n}\n\nvoid qstore(char c) {\n \
    \   rear++;                               // inc rear\n    if(rear > max) {\n\
    \        rear = min;\n        if(rear == front) {\\              // queue is full\n\
    \            rear--;\n            if(rear < min) {\\             // rewind rear\n\
    \                rear = max;\n            }\n        }\n    } else {\n       \
    \ qbuff[rear] = c;                   // store c at rear\n    }\n}\n```"
