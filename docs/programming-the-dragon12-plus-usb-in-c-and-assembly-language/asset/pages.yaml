    # E.4 Fuzzy Inference


    The heart of a fuzzy controller is the list of fuzzy rules. Fuzzy logic inference
    is used to find a fuzzy output, given a fuzzy input and a list of fuzzy rules.
    In a fuzzy controller inputs are normally crisp, non-fuzzy values that must first
    be fuzzified in the first step of Figure E.7 as described in Section E.3. The
    output also needs to be a crisp value used to control some device. Therefore,
    the fuzzy output resulting from processing the fuzzy rules must be defuzzified
    as described in the next section. The way fuzzy rules are processed is illustrated
    in Figure E.10 where fuzzy sets are represented by their membership functions
    m.


    Fuzzy inference involves a set of fuzzy rules of the form


    ```

    if x1 is A1 and x2 is B1 then y is L1

    ```


    ```

    if x1 is A2 and x2 is B2 then y is L2

    ```


    Given that fact


    ```

    x1 is A'' and x2 is B''

    ```


    the problem is to find the conclusion


    ```

    y is L''

    ```


    In this representation of the problem, A1, A2, B1, B2, A'', and B'' are input
    fuzzy sets and L1, L2, and L'' are output fuzzy sets. Fuzzy reasoning would form
    the union of the intersection of A'' and A1 is interpreted as being the maximum
    (union) of the minimum (intersection) of the membership functions A'' and A1.
    In Figure E.10 A'' is taken to the singleton fuzzy set x1 = a. In rule 1, the
    maximum of the intersection (minimum) of this singleton with A1 is the value w1
    shown in Figure E.10. Similarly, the minimum (maximum) of the singleton x2 = b
    with B1 is the value w2 shown in Figure E.10. The fact x1 = a and x2 = b applied
    to the antecedent x1 is A1 and x2 is B1 is interpreted as the intersection of
    w1 and w2, i.e for rule 1 in Figure E.10. The conclusion of rule 1, y is L1, found
    by taking the intersection (T-norm) of w2 with L1. This is normally the minimum
    operation which would truncate L1 to the height w2. However, for fuzzy control
    it is sometimes advantageous to use a T-product for this intersection which would
    have the effect of multiplying L1 by w2 as shown in rule 1 in Figure E.10. Thus,
    rule 1 in Figure E.10 will contribute the fuzzy set w1*L2 to the conclusion fuzzy
    set L''. Similarly, rule 2 in Figure E.10 will contribute the fuzzy set w2*L2
    because w2 is the minimum of w1 and w2 for rule 2. Note that if L1 and L2 are
    singletons (as is normally the case) then there would be no difference in using
    the minimum-norm or the T-product.


    The conclusion set L'' is found by forming the T-conorm of w2*L1 and w1*L2. This
    is normally the maximum operation. However, sometimes better results are obtained
    by taking the sum of w2*L1 and w1*L2 as shown in Figure E.10. The difference between
    these two approaches is shown in Figure E.11.'
