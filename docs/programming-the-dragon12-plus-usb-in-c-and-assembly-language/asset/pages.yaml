  md: '# 124 Chapter 9


    The master initiates a transfer by storing a bit in the SPI data register. The
    bits are shifted out of SPIXDR most-significant bit (bit 7) first and received
    in and out of the least-significant bit (bit 0) as shown in Figure 9.1. If the
    LSBFE in the SPI control register 1, SPIXCR1, is set to 1, then data is transferred
    least-significant bit first rather than the normal-significant bit.


    The clock controls how the bits are shifted out and into SPIXDR the serial clock
    SCK. The frequency of this clock can be controlled by the SPI baud register, SPIXDR,
    as shown in Figure 9.4. The SPI baud rate is determined by the bus clock (24 MHz)
    by the baud rate divisor


    The SPI control register 1, SPIXCR1, is shown in Figure 9.4. The two bits CPOL
    and CPHA control the polarity and phase of the clock. If CPOL = 0, the clock idles
    low and data shifted on the rising edge of the clock if CPHA = 0, and on the falling
    edge of the clock if CPHA = 1. If CPOL = 1, the clock idles high and data shifted
    on the falling edge of the clock if CPHA = 0, and on the rising edge of the clock
    if CPHA = 1. If CPHA = 1, the SS slave line can remain low during successive transfers.
    The other hand, if CPHA = 0, the SS must be deasserted and restarted between successive
    byte of data transfers.


    To use the SPI, the bit in the control register SPIXCR1 must be set to 1, and
    to use the SPI as the master MSTR must be set to 1. Setting the SPI bit will enable
    interrupts which cause a hardware interrupt to occur when data transfer has completed.


    When the bits have been completely shifted out of (and/or into) SPIXDR the SPIF
    flag (bit 7) in the status register, SPIXSR, is set to 1. This bit is cleared
    by reading the status register, SPIXSR, followed by accessing the data register,


    The SSOE in SPIXCR can enable an SS output in a master (if MODFEN in SPIXCR2 is
    set to 1) in which the SS output automatically goes low during each SPI transmission
    and goes high during each idle state so that devices are detected.


    In the bidirectional mode, a single (MOSI for a master and MISO for a slave) can
    be used for both input and output. The bidirectional mode is enabled by setting
    SPBC in the SPI control register 2, SPIXCR2, shown in Figure 9.4. When in the
    bidirectional mode, BIDIOE in SPI is the output bit. When BIDIOE = 0, the output
    buffer is in the high-impedance state, and an input from the MOSI pin can be read.


    Listing 9.2 shows the assembly language routines for the twelve function calls
    in Table 9.2. In the subroutine SPI0_init, the value $53 is set in SPI0BR, which
    sets the BaudRateDivisor


    BaudRateDivisor = (5 + 1) * 2^4 = 6 * 16 = 96


    The SPI baud rate is 24 MHz/96 = 250 kHz. The next statement moves the hex value
    $50 into SPI0CR1. This enables the SPI as a master by setting the MSTR bits, and
    clears both CPOL and CPHA bits to zero. This means that the clock idles low and
    data are shifted in and on the rising edge of the clock. Clearing all bits in
    SPI0CR2 disables the MODF. Finally, the SS0 is configured as an output by setting
    bit 7 of the data'
