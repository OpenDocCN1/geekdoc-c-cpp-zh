  md: "# Interrupts\n\nA hardware interrupt is an unexpected event that can occur\
    \ at any time during the execution of a program. It might result from pressing\
    \ a key, having a byte received in the SCI port, or some time has timed out. When\
    \ a hardware interrupt occurs, a series of events takes place. The current instruction\
    \ is completed, and then the programming registers (see B.1 in Appendix B) are\
    \ pushed on the stack. The return address will be the value in the program counter;\
    \ i.e., the address of the instruction following the one being executed when the\
    \ interrupt occurs. This will be the address returned to the interrupt service\
    \ routine is executed. After all registers in B.1 are pushed on the stack, both\
    \ the I bit and the X bit in the condition register CCR are set. This means that\
    \ another interrupt cannot get service during the execution of the interrupt service\
    \ routine. The address of the interrupt service routine is loaded from the interrupt\
    \ vector table into the program counter so that the first instruction in the interrupt\
    \ service routine will be executed. The RTI instruction, which will pop the registers\
    \ shown in B.1 off the stack, including the CCR register which will have its I\
    \ cleared. At that point a new interrupt can occur including one that might have\
    \ occurred during the processing of the previous interrupt.\n\nA list of all interrupt\
    \ sources available on the MC9S12DG256 is given in Table D.1 in Appendix D. Note\
    \ that each interrupt source has a vector number (between 0 and 57) associated\
    \ with it. The address of the interrupt vector for each interrupt source is also\
    \ shown in Table D.1.\n\n# 5.2 Real-Time Interrupts\n\nA real-time interrupt produces\
    \ an interrupt at periodic intervals. To use an interrupt, it is first necessary\
    \ to write an interrupt service routine that will be executed when the interrupt\
    \ occurs. To write a real-time interrupt routine in C and tell it the interrupt\
    \ vector is you should use the following function\n\n```\nvoid interrupt 7 handler(){\n\
    \  << C code goes here >>\n}\n```\n\nThe word interrupt tells the C compiler that\
    \ this is interrupt number 7 is the interrupt vector number from Table D.1. In\
    \ this case the 7 is the vector for a real-time interrupt with the interrupt vector\
    \ stored in addresses SFFF0 - SFFF1. The name of the interrupt service routine\
    \ is handler(). The compiler will automatically assign the address of this interrupt\
    \ routine to the proper interrupt vector. When using the Serial Monitor and CodeWarier,\
    \ these interrupt vector addresses have been mapped to S7F80 - S7FFF. You will\
    \ find the address of the real-time interrupt routine handler() at addresses S7F0\
    \ - S7F1.\n\nWe have written three language routines for real-time interrupts\
    \ that can be called using the C functions shown in Table 5.1. The RTI_init()\
    \ enables a real-time interrupt that produces an interrupt every 10.24 milliseconds.\
    \ When an interrupt occurs, it sets a flag in one of the RTI registers. You must\
    \ clear this flag in the interrupt service routine so not to cause another interrupt\
    \ immediately upon leaving the interrupt routine"
