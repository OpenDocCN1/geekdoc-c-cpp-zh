    # B.5 HCS112 Interrupts


    There are over fifty sources of interrupts on the MC9S12DP256B as shown in Appendix
    D. These interrupts are divided into two categories: non-maskable and maskable.
    The maskable interrupts can be masked by setting the 1-bit in the condition code
    register. Non-maskable interrupts cannot be masked. We will discuss non-maskable
    interrupts in Section B.5.1 and maskable interrupts in Section B.5.2.


    # B.5.1 HCS12 Non-Maskable Interrupts


    There are six HCS12 non-maskable interrupts shown in Table B.9. Each interrupt
    source has a 16-bit vector address that holds the address (interrupt vector) of
    the code be executed when the interrupt occurs.


    | Vector Address | Interrupt Source |

    | --- | --- |

    | $FFFF-$FFFF | Reset |

    | $FFFC-$FFFF | COP Clock Monitor Fail Reset |

    | $FFFA-$FFFF | COP Failure Reset |

    | $FFFF8-$FFFF | Unimplemented Instruction Trap |

    | $FFFF6-$FFFF | SWI |

    | $FFFF4-$FFFF | XIRQ |


    The non-maskable interrupts shown in Table B.9 are listed in order of priority.
    If more than one interrupt occurs at the same time, the interrupt with the highest
    priority will be serviced. We will briefly describe each of these non-maskable
    interrupts in turn.


    # Reset


    When the RESET pin on an HCS112 goes low, normal microprocessor functions are
    suspended. When this pin returns high the microprocessor sets bits X and I in
    the condition code register and starts executing instructions at the address stored
    at $FFFF-$FFFF. The HCS12 has a power-on reset (POR) circuit that causes the reset
    signal to be asserted after power has been applied to the processor.


    It is necessary for addresses $FFFF-$FFFF to be in some type of non-volatile memory
    (ROM, EPROM, or Flash memory) so that a valid reset vector will be at that address.
    Of course, the memory it points to also be in non-volatile memory so that some
    meaningful code will be executed when you turn on the processor.'
