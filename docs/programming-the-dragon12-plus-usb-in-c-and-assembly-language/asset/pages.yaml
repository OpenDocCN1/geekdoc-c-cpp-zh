    # COP (Computer Operating Properly)


    The two COP (computer operating properly) interrupts stored in Table B.9 are used
    to detect both hardware and software errors. When the clock monitor is enabled
    (by setting the CME bit in the CR Control Register, PLLCTL) special circuitry
    will produce a reset if the clock stops or its frequency falls below 500 KHz.


    The COP Failure Reset is a watchdog timer that will produce a reset if a sequence
    ($55 by $AA) is sent to the CCR TimerAlarm/Reset Register (ARMCOP) within a specified
    time. You would include this operation as part of your program when you know which
    portions of code must be executed within a certain time. A COP failure would be
    an indication that your software was not operating properly.


    # Unimplemented Instruction Trap


    All 1-byte opcodes in the HCS12 are valid except $18 which requires a second byte
    to form the complete opcode. Only 54 of the 256 possible second 2-byte opcodes
    are valid. If your program tries to execute any of these invalid 2-byte opcodes,
    the program will trap to the address stored in $FFF8-$FFFF.


    # Software Interrupts (SWI)


    A software interrupt occurs when you execute the SWI instruction. This will cause
    the instructions at the address stored in $FFF6-$FFF7 to be executed. Before this
    happens the return address (the address following the SWI instruction) is pushed
    on the stack together with registers Y, X, A, B, and CCR as shown in Fig. B.9.
    After pushing these values on the stack mask I, in the condition code register,
    CCR, is set to 1. This will prevent any maskable interrupts from being processed
    while the software interrupt routine. The I can be cleared to zero by either executing
    the CLI (clear interrupt mask) instruction or by executing the RTI (return from
    interrupt) instruction. The RTI instruction is executed at the end of all interrupt
    service routines. It will pop from the stack all of the values shown in Figure
    B.9. This will include the CCR register which may have the I cleared to zero if
    interrupts were enabled before the SWI instruction was executed. A similar sequence
    occurs for maskable hardware interrupts which we will describe in Section B.5.2.


    When the RTI instruction is executed the return address on the stack is popped
    into the program counter. The program will therefore continue at the point in
    the program where the interrupt occurred. For a software interrupt this would
    be the statement following the SWI instruction.


    # Non-maskable Interrupt Request (XIRQ)


    The XIRQ is in PE0 on the HCS12. XIRQ is a pseudo-non-maskable interrupt that
    is associated with the X bit in the CCR. After reset this bit set inhibits interrupts
    when the XIRQ pin goes low. However, software can clear the X bit in the CCR by
    using the instruction, ANDCC #8BF. Once this bit has been cleared it cannot be
    set to 1 again by software. Thus, at this point the interrupt becomes non-maskable.


    When an XIRQ interrupt occurs by a high signal on PE0 the current instruction
    is completed and then the registers shown in Figure B.9 are pushed on the stack.
    The return address will be the value in the program counter; i.e., the address
    of the instruction following the one being executed when the interrupt occurs.
    This will be the address returned to after the interrupt service routine is executed.
    The XIRQ interrupt service address is stored in the vector address SFFF4-$FFF5
    (see Table B,9). After'
