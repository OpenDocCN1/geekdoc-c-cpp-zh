  md: "# Listing 5.3 DRAGON12-Plus-USB ISR in main.asm\n\n```\nMY_EXTENDED_RAM: SECTION\n\
    \nticks_max:    equ 49\nticks:          rmb 2\n\nMyCode:         SECTION\nasm_main:\n\
    \rti_intser:\n    ldd             ticks\n    subd            #1              ;decrement\
    \ ticks\n    std             ticks\n    bne             rtl             ;if ticks\
    \ = 0\n    com             PORTB           ;toggle display\n    movw         \
    \   #ticks_max,ticks ;reset ticks to 49\nrtl:\n    movw            #$80,CRGFLG\
    \   ;clear rtif\n    rti\n\nblink_rti:\n    sei             #$FF,DDRB      ;disable\
    \ interrupts\n    movb            #$FF,DDRP      ;port B outputs\n    movb   \
    \         #$FF,DRJ       ;port J outputs\n    movw            #1,ticks       ;ticks\
    \ = 1\n    bset            PTJ,$0          ;disable leds\n    movb           \
    \ #$507,PTP       ;enable digit 3\n    clr             PORTB           ;turn 7seg\
    \ off\n    movw            #$54,RTICTL    ;set rti to 10.24 ms\n    bset     \
    \       CRGINT,$80      ;enable rti\n    cli\n    rti\n```\n\n; at the end of\
    \ main.asm add\norg $FF0\ndc.w rti_intser\n\n# Listing 5.4 Example 14b – Calling\
    \ blink_rti()\n\n```\n// Example 14b: Turn on every other segment on 7-seg display\n\
    #include <hide.h>          /* common defines and macros *//\n#include <mc9s12dg256.h>\
    \    /* derivative information *//\n#pragma LINK INFO DERIVATIVE \"mc9s12dg256b\"\
    \n#include \"main_asm.h\"        /* interface to the assembly module */\n\nvoid\
    \ main(void) {\n    init();              // set system clock frequency to 24 MHz\n\
    \    blink_rti();         // blink 7seg display using rti\n    while(1) {}   \
    \       /* wait forever */\n}\n```"
