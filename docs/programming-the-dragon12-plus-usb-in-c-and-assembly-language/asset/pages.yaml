  md: "# Writing Your Own Interrupt Service Routines (ISR) in main.asm\n\nIn Listing\
    \ 5.1, we used the C statements\n\n```\n// RTI Interrupt Service Routine\nvoid\
    \ interrupt handler() {\n    ticks++;\n    clear_RTI_flag();\n}\n```\n\nto write\
    \ the interrupt service routine. When these statements are compiled, the address\
    \ of the compiled interrupt service routine, called *handler*, is automatically\
    \ stored in the flash memory address, $F7F0$, which is the mapped interrupt vector\
    \ address of the RTI type 7 interrupt, $FFF0$, which is in protected memory.\n\
    \nIt is sometimes useful to be able to write the interrupt service routine in\
    \ assembly language in the file *main.asm*. When you do, the address of your interrupt\
    \ service routine must end in the mapped interrupt vector table in flash. For\
    \ the RTI interrupt, this will be at $F7F0$. The way to do this is to include\
    \ the following statements at the end of the *main.asm* file.\n\n```\norg $FFF0$\n\
    dw rti_intser\n```\n\nwhere *rti_intser* is the name of your assembly interrupt\
    \ service routine. Note that these statements will try to store the address of\
    \ *rti_intser* at the address $FFF0$, which is the real interrupt vector location\
    \ for an RTI interrupt in the table Appendix D, but is in protected memory. CodeWarrior\
    \ would automatically map this address to $F7F0$ and store the address of *rti_intser*\
    \ at this flash memory location. Listing 5.3 shows an example that illustrates\
    \ this process.\n\nThe interrupt service routine, *rti_intser*, in Listing 5.3\
    \ will blink an 8 on the right-7-segment display on the DRAGON12-Plus-USB once\
    \ per second. The 16-bit variable must be defined in the *MY_EXTENDED_RAM* section\
    \ of *main.asm*. The interrupt service routine, *rti_intser*, and the subroutine,\
    \ *blink_rti*, should be placed following *asm_main*: in the *MyCode* section\n\
    \nWhen the interrupt service routine, *rti_intser*, is executed (once every 10.24\
    \ ms), if the result is equal to zero, then the state of the segments-segment\
    \ display is toggled by Port B on the DRAGON2-Plus-USB. The value of ticks is\
    \ set to *ticks*, which is 49. If the result of decrementing ticks at the beginning\
    \ of *rti_intser*, is not zero, then the *RTIF* flag is cleared before returning\
    \ from the ISR.\n\nTo run this, the function call subroutine *blink_rti()* is\
    \ called from the C program in Listing 5.4. Note that after calling this function,\
    \ the main program just waits while the interrupt service routine, *rti_intser*,\
    \ will do all the work in the background.\n\nThe subroutine *blink_rti* in Listing\
    \ 5.3 initializes the appropriate ports, sets the value of ticks to 1 (so a blink\
    \ will occur on the first interrupt), and then enables RTI and hardware interrupts.\
    \ Once this subroutine is called, an RTI interrupt will occur every 10.24 ms,\
    \ and the interrupt service routine, *rti_intser*, will do all of the work in\
    \ blinking the 7-segment display."
