  md: "# Chapter 10\n\n# Example 31 – Measuring Input Pulse Widths\n\nIn this example\
    \ we will show how to measure the high time and low time (and therefore the period)\
    \ of an input pulse train using an capture interrupt on timer channel 1. Listing\
    \ 10.5 shows an example of reading the high and low pulse widths of an input pulse\
    \ train, and displaying these values together with the period on the LCD display.\
    \ Note that the values displayed be multiples of 1/1.5 MHz = 0.667 µsec.\n\n#\
    \ Listing 10.5 Example 31 Measuring Pulse Widths on Channel 1\n\n```\n// Example\
    \ 31: Measuring Input Pulse Width on Channel 1\n#include <hide.h> /* common defines\
    \ and macros */\n#include <mc9s12dg256.h> /* derivative information */\n#pragma\
    \ LINK_INFO DERIVATIVE \"mc9s12dg256b\"\n#include \"main_asm.h\" /* interface\
    \ to the assembly module */\n\n// Timer channel 1 interrupt service routine\n\
    void interrupt1() {\n    HLOTimes(); // update HI-LO times on Ch 1\n}\n\nvoid\
    \ main(void) {\n    int period;\n    int HI_time; // measured HI time of pulse\
    \ train on Ch 1\n    int LO_time; // measured LO time of pulse train on Ch 1\n\
    \n    PLL_init(); // set system clock frequency to 24 MHz\n    lcd_init();\n \
    \   HI0_init();\n    while(1) {\n        HI_time = get_HI_time(); // read new\
    \ HITIME\n        LO_time = get_LO_time(); // read new LOTIME\n        set_lcd_addr(0x00);\n\
    \        write_int_lcd(HIITIME); // write HITIME on row 1 of lcd\n        write_int_lcd(LOTIME);\
    \ // write LOTIME on row 1 of lcd\n        period = HI_time + LO_time;\n     \
    \   set_lcd_addr(0x04);\n        write_int_lcd(period); // write period on row\
    \ 2 of lcd\n        ms_delay(100);\n    }\n}\n```\n\nThe eight pins of Port T\
    \ can be selected as input capture lines by clearing the appropriate bits in the\
    \ TIOS register as shown in Figure 10.6. When configured for an input capture\
    \ the corresponding input capture/output register, TCX, in Figure 10.7 are used\
    \ to capture the current value, TCNT, when a rising or falling edge (or both)\
    \ occurs on the assigned pin PTx. When this occurs, the input capture channel\
    \ flag, CxF, in the main timer flag register, TFLAG1, is set as shown in Figure\
    \ 10.8. Note that this flag is cleared by writing 1 to the corresponding position.\
    \ The two bits EDxB and EDxA in timer control registers, TCTL3 and TCTL4, are\
    \ used to select the capture edge as shown in Figure 10.13.\n\n![](img/6c970885d6405944bd67e68f02bac5bc_149_0.png)"
