  md: '# Chapter 2


    # Parallel Ports - Outputs


    In this chapter you will learn how parallel ports are used to turn on LEDs and
    the segments of a 7-segment display. As in all of our examples we will first show
    you how to do it entirely in C, and then we will show you how to do it using C
    calls to our built-in assembly language routines. You will also learn how these
    assembly routines work. Using these built-in assembly language routines will make
    your C programs much shorter and easier to write.


    # MC9S12DG256 Parallel I/O Ports


    The MC9S12DG256 registers associated with parallel I/O are listed in Table 2.1.
    Each of these ports (except PORTAD and PORTAD1) have a data register and a data
    direction register of the type shown in Fig. 2.1. Each pin of an I/O port can
    be either an input or an output depending on the bits in the corresponding data
    direction register as shown in Fig. 2.1.


    | Port | Port Name | DDR Name | DRAGON12-Plus-USB use |

    |---|---|---|--|

    | T | PTT | DDRT | Speaker |

    | S | PTS | DDRS | SCI, SPI |

    | M | PTM | DDRM | |

    | P | PTP | DDRP | 7-Seg enable, Servo |

    | H | PTH | DDRH | Switches |

    | J | PTJ | DDRJ | LED enable |

    | AD0 | PORTAD | Input only | pot |

    | AD1 | PORTAD1 | Input only | |

    | A | PORTA | DDRA | Keypad |

    | B | PORTB | DDRB | LEDs, 7-Seg, H-bridge |

    | E | PORTE | DDRE | Mode, XIRQ |

    | K | PORTK | DDRK | LCD |


    Most of the I/O ports listed in Table 2.1 have alternate or special functions
    many of which we will consider in later examples. When the pins of an I/O port
    are not being used for one of these alternate functions they can be used as general
    purpose I/O.


    There are several different operating modes for the MC9S12DG256 including a single-chip
    mode and expanded external memory. In the expanded external memory modes, ports
    A and B are used for multiplexed address and data busses. The DRAGON12-Plus-USB
    board operates in the single-chip mode, so that ports A and B are available for
    parallel I/O. Port A is connected to the 4 x 4 keypad. on the'
