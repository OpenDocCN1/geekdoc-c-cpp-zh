  md: '# Appendix E


    # Introduction to Fuzzy Control


    Fuzzy logic has been applied successfully to a wide variety of difficult control
    problems. The input and output control variables are members of fuzzy sets that
    admit varying degrees of membership. In this appendix we will introduce the basic
    ideas of fuzzy sets. We will then describe how a fuzzy controller works and present
    an overall approach to implementing a fuzzy controller on a microcontroller. The
    HCS12 has some special instructions which simplify the implementation of a fuzzy
    controller. We define some C functions in Example 20 that use these HCS12 instructions
    to implement a fuzzy controller.


    # E.1 Fuzzy Sets


    Lotfi Zadeh introduced the term fuzzy sets in 1965.\ In normal "crisp" logic the
    basic assumption is that assertions, or statements, are either true or false.
