  md: "# HCS12 Assembly Language Essentials\n\nIt won't! The branching instruction\
    \ BLT LOOP will fail the first time. This is because the value of B is 1 and the\
    \ value of C8 is not 2010 but is -5610. Remember that the BLT instruction (and\
    \ all the instructions in Table B.6) consider all numbers to two's complement\
    \ signed numbers. Inasm as 1 (the value of B) is greater than -5610 the BLT instruction\
    \ will not branch.\n\nThe instruction you really want to use is BLO (branch if\
    \ lower). This instruction, and all instructions in Table B.5 treat all numbers\
    \ as unsigned numbers, so that C8 is considered 20010 and not -5610.\n\nIn Table\
    \ B.5 note that the instructions BHS and BLO test only the carry flag and are\
    \ the same as BCC and BCS respectively. All other instructions in Tables B.5 and\
    \ B.6 use branch tests that involve more than one flag in the code register.\n\
    \n# B.4.5 Bit-Condition Branch Instructions\n\nThe HCS12 has two bit-condition\
    \ branch instructions that are given in Table B.7. The BRCLR instruction will\
    \ branch if bits in a particular memory location are zero. The bits are selected\
    \ by setting corresponding bits in a mask to 1. The BRCLR instruction will then\
    \ branch if the logical AND of the memory location with the mask is zero. The\
    \ general form of instruction is\n\n```\nBRCLR opr,msk,rel\n```\n\nwhere opr is\
    \ the addressing mode for the memory location to be tested, msk is the mask value,\
    \ and rel is the label of the branch destination address.\n\n| Table B.7 Bit-Condition\
    \ Branch Instructions |\n| Operation | Mnemonic | Branch Test |\n| Branch if Selected\
    \ Bits Clear | BRCLR | (M) & (mask) = 0 |\n| Branch if Selected Bits Set | BRSET\
    \ | 1(M) & (mask) = 0 |\n\nThe BRSET instruction in Table B.7 will branch if selected\
    \ bits in a particular memory location are 1. In this case the BRSET instruction\
    \ will branch if the logical AND of the one's complement of the memory location\
    \ with the mask is zero.\n\n# B.4.6 Decrement and Branch Instructions\n\nThe HCS12\
    \ has two decrement and branch instructions that are given in Table B.8. The DBEQ\
    \ instruction will decrement a counter (A, B, D, X, Y, or SP) and branch if the\
    \ counter is equal to zero. The DBNE instruction will decrement a counter (A,\
    \ B, D, X, Y, or SP) and branch if the counter is not zero. As an example the\
    \ instructions\n\n```\nfwl:               mem\n      dbne B,fwl      ; fuzzy membership\
    \ grade\n```\n\nare used in the fuzzy control function fill_weights(...) in main.asm\
    \ to execute the MEM instruction B times."
