  md: 'The eight output compares, OC0–OC7, are associated with pins PTT0–PTT7 of Port
    T. As described when the free-running counter, TCNT, matches the value in one
    of the output compare registers, TCn, shown in Fig. 10.7, the corresponding output
    compare flag, CFx, is set in TFLGI as shown in Fig.10.8. When this occurs, it
    is possible to cause the output of PTT0–PTT7 to change. In this way we can produce
    waveforms on 0–7 of Port T.


    In addition to the registers shown in Fig. 10.7 and 10.8, the registers shown
    in Fig. 10.9 are also used for output compares. Output compare 7 can control the
    outputs of any of the pins PTT0–PTT7. On the other hand, output compares 0–6 can
    control only their own pins. The output compare 7 register, OC7M, and the output
    compare 7 data register, OC7D, are used by output compare 7 to control the outputs
    on pins PTT–PT7. By setting an output compare, OC7Mx, in OC7M will enable the
    corresponding output pin x. If this bit is set, the contents of the corresponding
    bit, OC7Dx, will determine whether x of Port T will be high or low on a successful
    match of output compare 1. For example, if OC7M is set to 1, and OC7D is cleared
    to 0, then on a successful match of output compare 7 (TC7) the pin PTT6 will go.


    It is possible to have output compare 7 (TC7) and output compare 6 (TC6) both
    control the output of pin PTT6 at the same time. The way that TC6 controls PTT6
    is determined by the two bits, OM6 and OL6, in register TCTL1 as shown in Fig.
    10.9. For example, if OM6 = 1 and OL6 = 1, then PTT6 will be set to 1 on a successful
    match of output compare 6.


    | Output Compare 7 Mask Register (OC7M–0x0042) |

