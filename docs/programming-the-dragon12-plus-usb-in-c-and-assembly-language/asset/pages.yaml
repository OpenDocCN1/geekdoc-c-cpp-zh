  md: '# # Preface


    Microcontrollers as the Frecale MC9DG256 are remarkable devices. They contain
    not only a sophisticated microprocessor with a rich set of instructions and addressing
    modes, but also contain built-in RAM, EEPROM, and flash memory as well as numerous
    I/O ports, including parallel I/O, different types of serial I/O, timers, and
    A/D converters.


    We will use a particular microcontroller, the MC9S12DG256, that it is one of the
    more powerful in the popular HCS12 microcontrollers from Frecale with lots of
    I/O capabilities. This microcontroller is available on the DRAGON12-Plus-USBM
    development board from Wyctec. The DRAGON12-Plus-USBM has built-in I/O devices
    including LEDs, switches, four 7-segment displays, a keycad LCD display, a D/A
    converter, an on-board switch, a built-in H-driver for motors, connectors for
    connecting sensors and an accelerometer board from Wyctec, and female headers
    for connecting your circuits to the built-in board.


    A previous book from LBE Books, Learning By C – Programming the DRAGON12-Plus
    Using CodeWarrior showed how to write programs in C with a minimum of effort for
    this development board. We did this by providing you with a CodeWarrior stationary
    project that contains an assembly language file to do all the low-level interaction
    with the I/O registers. These assembly language routines function for your C program.
    This previous book you didn''t have to learn any assembly language to get sophisticated
    programs to work on this development board.


    This current book provides these CodeWarrior stationary projects so that you can
    write C programs easily for the DRAGON12-Plus-USBM development board. However,
    in this book you will need to see all of the assembly language routines that are
    included in the stationary project work. This way you will learn how to program
    the HCS12 microcontroller in assembly language and how to be able to write your
    own assembly language subroutines that you can call from your C program, and in
    this way get the maximum performance from the MC9DG256 microcontroller.


    In Chapter 1 we introduce the DRAGON12-Plus-USBM development board. Chapter 2
    will include examples of the parallel ports for outputs and Chapter 3 will include
    examples of the parallel ports for inputs. Liquid crystal displays are described
    in Chapter 4. The important topic of interrupts is introduced in Chapter 5. Examples
    using the two-channel A/D converters built into the MC9DG256 are given in Chapter
    6. Examples showing how to use pulse-width modulation (PWM) to control the speed
    of a DC motor or the position of a servo are presented in Chapter 7. Chapter 8
    includes examples of the serial communication interface (SCI) and Chapter 9 shows
    how to use the serial peripheral interface (SPI). Examples using the built-in
    timer module are given in Chapter 10 and an example of using the MC9S12DG256 microcontroller
    for fuzzy control is included in Chapter 11.


    Many colleagues, students and reviewers have influenced the development of this
    book. Their stimulating discussions, and critical comments are greatly appreciated.
    Special thanks go to Michael Latcha and Osamah Rawashdeh with whom we have used
    many discussions related to the contents of this book.


    Richard E. Haskell

    Darrin M. Hanna'
