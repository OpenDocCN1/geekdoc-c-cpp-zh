  md: "# The Serial Peripheral Interface (SPI) 119\n\nIn the master, the bits are\
    \ sent out the MOSI (master - slave out) pin and received\nin the MISO (master\
    \ - slave in) pin and sent out the MISO (master - slave out) pin. In the slave,\
    \ the bits are received in the MOSI\nshifted out are stored in the SPI data register,\
    \ SP0DR, and by default are sent out most-\nsignificant bit (bit 7) as shown in\
    \ Figure 9.1. By programming in bit one of the\ncontrol registers, the bits can\
    \ be sent out least first bit. At the same time bit 7\nis shifted out the MOSI\
    \ pin in the master, a bit from bit 7 of the slave is shifting\ninto bit 0 of\
    \ the master via the MISO pin. This will eventually end up in bit 7 of the\nmaster\
    \ after each clock pulse or pulses. The clock controls how fast the bits are\n\
    shifted out and into SP0DR the signal CK. The frequency of this clock can be\n\
    controlled by the SPI baud rate register. The SS (slave-select) pin must be low\
    \ to select\na signal. This signal can come from any pin of the master, including\
    \ its SS pin when it\nconfigured as an output.\n\n![](img/6c970885d6405944bd67e68f02bac5bc_124_0.png)\n\
    \nFigure 9.1 Two SPI modules connected in a master-slave configuration\n\n# 9.2\
    \ Programming the SPI in C and Assembly Language\n\nTo make it easy to use the\
    \ SPI ports, we have written assembly language routines that\n be called using\
    \ the C functions shown in Table 9.2. There are four functions associated\nwith\
    \ each of the three SPI modules (x = 0, 1, 2). The function SPI_init() will initialize\
    \ the\nSPI port as a master and set the clock rate to 250 kHz.\n\nThe function\
    \ char send_SPI(char c) will send a byte out the MOSI pin, wait for the\ntransfer\
    \ to complete, and then return the value of the byte shifted into the data register.\n\
    Finally, the functions SS_HI() and SS_LO() set the corresponding SS pin high and\
    \ low.\n\nTo send a byte out of the SPI MOSI pin you just need to put the byte\
    \ in the\ncharacter c and call the function send_SPI(c). Note that when you do\
    \ this new byte will\ncome into the SPI data register, SP0DR, from the MISO pin.\
    \ This may or not be\nmeaningful data, depending on whether that pin is connected\
    \ to some peripheral. Similarly,\nt byte you send out the MOSI pin may may not\
    \ be meaningful, depending on whether\nthat pin is connected to some peripheral.\
    \ In Example 27, we will illustrate the use of the SPI\nport by interfacing with\
    \ the LTC1661 dual 10-bit D/A converter."
