    \ register, TCX, when a rising or falling edge (or) occurs on the associated pin\
    \ PTXx.\n\nThe function calls in Table 10.4 are assembly language routines that\
    \ will allow you to measure the high and low times of an pulse train on pin PTT1.\
    \ The function HI01_init will enable TCI interrupts on both edges of the pulse\
    \ train. The timer clock is set to 1.5 MHz so that TCI maximum high or low pulse\
    \ width that can be measured is 65,535/1.5 MHz = 43.7 ms.\n\nThe function HIotimes1()\
    \ is called in your interrupt service routine. It remembers the value of TCI that\
    \ was read at the last interrupt and subtracts this value from the current reading\
    \ of TCI to get the pulse width. It reads PTT1 if the interrupt occurs on a rising\
    \ edge (in which case the measured pulse width is low) or on a falling edge (in\
    \ which case the measured pulse width is high). This function saves the most recent\
    \ in two assembly variables. You can get these values from your C program by calling\
    \ the two functions get_HiTime1() and get_LOtime1().\n\n| Table 10.4 C functions\
