  md: '# Chapter 7


    The speed of a DC motor depends on the voltage applied to the motor – the higher
    the voltage faster the motor will turn. If you just want to turn on a motor at
    a constant speed, you can connect one side of the motor to MOT1 in Fig. 7.1 and
    connect the other side to ground. In this way you could connect up to four motors
    to the SN754410 in Fig. 7.1. The polarity of the voltage connected to the motor
    will determine which way the motor turns. If it is turning the wrong way, just
    exchange the two connections to the motor.


    # Example 21 – Controlling the Speed of a DC Motor Using PWM


    To control the speed of a DC motor using a microcontroller, one normally uses
    a pulse-width modulated signal of the type shown in Fig. 7.2. If this signal is
    connected to PP0 in Fig. 7.1, when the signal is high, current will flow through
    the motor assuming PB0 and PB1 have different values. When the PWM signal (PP0)
    is low, then the motor is disconnected from the circuit, and no current flows
    through the motor.


    The period of this pulse train remains constant and the width of the time, called
    duty in Fig. 7.2, is varied. The duty cycle of a PWM signal is as defined as the
    percent time that the signal is high. That is,


    ```

    duty cycle = \frac{duty}{period} \times100\%

    ```


    ![](img/6c970885d6405944bd67e68f02bac5bc_95_0.png)


    Figure 7.2 A pulse-width modulated signal


    The average DC value of the pwm signal in Fig. 7.2 will be proportional to the
    duty cycle. A duty cycle of 100% will have a DC value equal to the maximum value
    of the pwm signal. A duty cycle of 50% will have a DC value equal to half of the
    maximum value of the pwm signal, and so forth. If the voltage across the motor
    is proportional to this pwm signal, simply changing the pulse duty width and therefore
    the duty cycle changes the speed of the motor.


    Port P of the MC9S12DG256 can be used to generate up to 8-bit PWM signals or four
    16-bit PWM signals. An 8-bit PWM signal will have a resolution of 256thirteen
    different values of the pulse duty width. For speed control of a DC motor an 8-bit
    PWM signal is usually more than adequate. We provide assemble language routines
    for generating up to eight different 8-bit PWM signals. For controlling a servo,
    a 16-bit PWM signal is sometimes needed, and we will provide two such routines
    in the next section.


    The SN754410 quadruple built-H driver shown in Fig. 7.1 has internal diodes from
    the output to Vi,, and to ground that will eliminate possible voltage spikes that
    would tend to show up when the current through the motor changes quickly.


    The built-in C functions can be used to control the speed of a DC motor shown
    in Table 7.1.'
