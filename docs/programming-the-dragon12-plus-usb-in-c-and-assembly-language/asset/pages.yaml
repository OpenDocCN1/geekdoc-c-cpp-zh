  md: '# 6.2 Using the MC9S12DG256 A/D Converters


    The MC9S12DG256 microcontroller has two-channel A/D converters, called ATD0 and
    ATD1, which can produce 8-bit or 10-bit conversions. These A/D converters share
    the same input pins as PORTAD0 and PORTAD1, which can be used for digital inputs
    when the A/D converter is not being used. Pin 7 of PORTAD0 is connected to the
    center of the potentiometer on the DRAGON12-Plus-USB board. This input will vary
    between 0 and 5 volts as the cap of the potentiometer (pot) is turned with a small
    screw driver. We will use this input to illustrate the output of ATD0.


    There are lots of registers associated with the use of the A/D converters. We
    will look at these in the Under the Hood section below. To make easy, we have
    written several assembly routines that are called by the C functions in Table
    6.1.


    The pinouts of the two A/D converters are shown in Table 6.2. On DR12-Plus-USB,
    channel 7 of ATD0 is connected to the potentiometer, channel 5 of ATD0 is connected
    to a temperature sensor, and channel 4 of ATD0 is connected to a phototransistor.
    The DRAGON12-Plus-USB has a 10-pin header that is connected to the output of Channels
    0-2 of ATD1. This header is convenient for connecting an x-y-z accelerometer or
    the GP2D12 sensor to A/D channels of the MC9S12DG256 microcontroller.


    Table 6.1 C functions for the A/D converters


    | Function | Description |

    | --- | --- |

    | void ad0enable(void); | Enable ATD0 for 10 bits |

    | int ad0conv(char ch#); | Return the average of 4 successive readings of channel
    ch# |

    | void ad1enable(void); | Enable ATD1 for 10 bits |

    | int ad1conv(char ch#); | Return the average of 4 successive readings of channel
    ch# |


    Table 6.2 Pinouts for A/D Converter


