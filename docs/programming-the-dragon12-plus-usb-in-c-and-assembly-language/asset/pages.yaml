  md: '# Serial Communication Interface (SCI) 105


    In the subroutine SCI0_init, all of bits in control register, SCI0CR1, are cleared
    zero. This will select 8 data bits and no parity as shown in 8.3. You can refer
    to the S12SCIV2.pdf, after Freescale, for a description of the other bits in this
    control register. We will always clear them to zero. The value $0C is stored in
    control register, SCI0CR2. This will enable the SCI transmitter and receiver,
    while disabling all interrupts. Finally, the subroutine SCI0_init sets the baud
    rate. The baudrate is passed to the subroutine in accumulator D. The 13-bit value,
    BR, to store in the baud rate registers, SCI0BDH1, is found using the formula


    ```

    BR = BusClock/(16 x baudrate)

    ```


    In our case, BusClock is 24 MHz, and 2400000/16=156000=$E360. Therefore, we need
    to calculate BR=$E360/D. The ediv instruction will divide (Y:D) by X and leave
    the quotient in Y. We must first transfer D to X and then store $0016 in Y and
    $E360. After calling ediv, the Y, will be the value of BR to be stored in SCI0BDH.


    When receiving a character, you must first wait for the RDRF flag in status register
    1 to go high. In the subroutine inch0 in Listing 8.2, the statement


    ```

    inchar0: brclr SCI0SR1,$20,outchar0

    ```


    will do this. Recall that this statement will branch on itself as long as the
    AND of SCI0SR1 and $20 is zero, i.e. as bit 5 of SCI0SR1 is zero. As soon as the
    RDRF flag goes to 1, a character has been received in SCI0DRL, and this value
    is loaded into accumulator B, which returns this value to the calling function
    in the C program.


    When sending a character, you must first wait for the TDRE flag in status register
    1 to go high, meaning that the transmit data register is empty. In the subroutine
    outchar0 in Listing 8.2, the statement


    ```

    outchar0: brclr SCI0SR1,$80,outchar0

    ```


    will do this by for bit 7 of SCI0SR1 to go to 1. As soon the TDRE flag goes to
    1, the transmit data register is empty, and the value in accumulator B, passed
    from the calling function in the C program, is stored in SCI0DRL.


    The SCI1 subroutines in Listing 8.2 are the same as the SCI0 subroutines, except
    that they use the SCI registers.'
