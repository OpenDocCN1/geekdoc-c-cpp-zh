  md: '# Chapter 10


    # Timer


    Timers are an important part of microcontroller interfacing. They can be used
    to produce delays, measure time intervals such as pulse widths, create various
    output waveforms such as pulse-width modulated signals, count the number of events,
    and other similar activities. We have already used the pulse-width modulation
    PWM module in Chapter 7 and the real-time interrupt in Section 5.2. The HCS12
    family of microcontrollers has a fairly sophisticated enhanced timer module associated
    with port T that can perform all of the above functions. free-running 16-bit counter
    called TCNT.


    The two most basic functions that the timer can perform are output compares and
    input captures. In Section 10.1 we include the output compare function to generate
    a pulse train using interrupts. We will an example that will play musical notes
    on the speaker that is built into the DRAGON12-Plus-USB board. In Section 10.2
    we will use the input capture function to measure pulse widths and periods of
