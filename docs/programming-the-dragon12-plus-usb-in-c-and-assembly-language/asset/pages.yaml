  md: '# Chapter 6


    # Analog-to-Digital Converter


    In this chapter we will show how to use the two 8-channel analog-to-digital (A/D)
    converters that are part of the MC9S12DG256 microcontroller. We will use the A/D
    converter to read the potentiometer value, to read the values of an x-y-z accelerometer,
    and measure the temperature in Fahrenheit and Centigrade.


    # 6.1 Analog-to-Digital Conversion


    A/D converters transform an analog voltage within a given voltage range into a
    corresponding digital number. For example, you might convert a voltage between
    0 and 5 volts to an 8-bit binary number between 00000000 and 11111111. This represents
    a decimal number between 0 and 255. In this case, the least-significant bit (LSB)
    of 1 corresponds to a change in voltage of 5V/256 = 19.5 mV. This quantization
    error, or step size, is inherent in any type of A/D conversion. We can minimize
    this error by using more bits. For example, a 10-bit A/D converter will have a
    step size between 0 and 5 volts of 5V/2¹⁰ = 5V/1024 = 4.9 mV. The MC9S12DG256
    A/D converters can be programmed to do either 8-bit or 10-bit conversions. We
    will provide C functions to do 10-bit A/D conversions.


    There are several different methods for performing A/D conversions. One of the
    most popular, and the one used in the HC12 microcontrollers, is the method of
    successive approximation. We will illustrate this method using a 4-bit conversion
    with the step size between 0 and 5 volts is 5V/2⁴ = 5V/16 = 0.3125 V. For n bits
    the method of successive approximation requires n steps. The method is essentially
    a binary search as shown in Fig. 6.1 for four bits.


    Suppose that the input analog voltage to convert is Vᵢ = 3.5V. The first step
    is to guess the mid-range voltage of 2.5V correction. That is, we set the most-significant
    bit. If this voltage (2.5V) is less than the voltage Vᵢ, then we want to keep
    this bit, because we know the input is greater than 2.5V. We then add the next
    most-significant bit and try 1100, in step 2. This value is greater than 3.5V,
    so we have overshot the mark and must discard this bit. Setting the next bit means
    we will try the voltage 1010, 3.125V is step 3. Value is less than 3.5V so we
    will keep this bit. Finally, we will set the last (least-significant) bit and
    try 1011, 3.4375V in step 4. This is still less than 3.5V so we keep this bit.
    We are now done and our converted value is 1011, which really represents 3.4375V,
    but is within our error margin of 0.3125V.'
