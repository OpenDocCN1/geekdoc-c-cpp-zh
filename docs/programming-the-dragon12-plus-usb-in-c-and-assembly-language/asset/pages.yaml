  md: '# B.1.2 Index Registers, X and Y


    The index registers $X$ and $Y$ are 16-bit registers that are used for several
    different purposes. They can be used in a manner similar to the accumulators for
    temporary storage when moving 16-bit data to and from memory. The following are
    some of the instructions involving index registers $X$ and $Y$.


    # Load and Store Instructions:


    +   -LDX Load X from memory

    LDY Load Y from memory

    STX Store X to memory

    STY Store Y to memory

    LEAX Load effective address into X

    LEAY Load effective address into Y


    # Transfer and Exchange Instructions:


    +   -EXG X,Y Exchange X and Y

    XGDX Exchange D and X

    XGDY Exchange D and Y


