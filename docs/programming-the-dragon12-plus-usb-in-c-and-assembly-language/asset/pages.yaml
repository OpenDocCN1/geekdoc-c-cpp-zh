    # 8.2 The 68HC12 SCI Interface


    The MC9S12DG256 has two SC1 modules, SCI10 and SCI1. On the DRAGON12-Plus USB
    board, port J42 is used to select whether SCI10 or SCI1 is connected to the USB
    port that you connect to a USB port of your PC. SCIO is normally selected. Both
    SCI10 and SCI1 have TTL header connectors on the DRAGON12-Plus USB board.


    A functional block of the serial communication interface is shown in Fig. 8.2.
    The main function to transfer data from the HCS12 into serial and send out through
    the transmit pin TxD, and to receive serial data through the receive pin RxD and
    to parallel that data can be done by the HCS12.


    The signals TxD (pins P1 or PS1) and RxD (pins P0 or PS2) are generally connected
    to a 9-pin "D" connector through an EIA-232-DB (formally RS-232C) driver/receiver
    chip. This driver/receiver transforms the logic 0 (0 volts) and logic 1 (5 volts)
    to +12 volts and -12 volts respectively. (Sometimes +5 volts and -5 volts are
    used.) This allows for more noise immunity when sending the signals over a long
    distance. Pin 2 on the "D" connector is the "transmit" pin TxD on the microcontroller
    board and pin 3 is the "receive" pin RxD. But if a straight-cable is connected
    from the serial port on a PC to your target HCS12 board, the PC''s "transmit"
    pin must be pin 3 so'
  merge: -1
  pgno: 106
