  md: '# Introduction


    the tutorial in Appendix A, these assembly language routines will automatically
    be included in the file `main.asm` that will be part of your project. The top-level
    design in your project will be a C program that is stored in the file `main.c`.
    In this book, we will show you how to write your own assembly language routines
    that are stored in `main.asm` and how to call these as C function calls from your
    top-level C program stored in `main.c`.


    To use CodeWarrior with the DRAGON12-Plus-USB, the MC9S12DG256 microcontroller
    on these boards must contain the *Serial Monitor*. This *Serial Monitor* is 2
    kbytes of code stored at addresses $F800 - $FFFF in the flash memory. This code
    is executed when you press the reset button on the board and allows CodeWarrior
    to communicate with boards by Wytec through the serial port. When you order one
    of the development boards by Wytec, make sure to specify that you want the *Serial
    Monitor* that is not compatible with CodeWarrior; otherwise, it will come with
    the Dbug monitor that is not compatible with CodeWarrior.


    Getting the DRAGON12-Plus-USB board to do whatever you want is challenging and
    lots of fun. Therefore, let''s get started!'
