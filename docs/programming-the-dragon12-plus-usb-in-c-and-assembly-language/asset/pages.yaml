  md: '# # Example 15 – Interrupt-Driven Traffic Light


    It is useful to be able to sequence through an arbitrary number of states, staying
    in each state an arbitrary amount of time. For example, consider the set of traffic
    lights shown in Fig. 5.2. The lights are assumed to be at a four-way intersection
    with one street going north-south and the other road going east-west.


    ![](img/6c970885d6405944bd67e68f02bac5bc_78_0.png)


    To simulate these traffic lights you could plug colored LEDs into the protoboard
    and connect to Port M as shown in Fig. 5.3. When the pin output is low the output
    of the inverter is high (+5 volts) and no current can flow through the LED and
    therefore no light will be emitted. If you bring the port out the inverter goes
    low (about 0.2 volts) and current will flow from the +5 volt power supply through
    resistor R and the LED. The resistor will limit the amount of current that flows
    through the LED. A typical current would be 15 milli to 10 micro-amps. Using Ohm''s
    law we can compute the resistor size needed as shown in Fig. 5.3. You could, for
    example, connect the east-west lights to PM0–PM2 and the north-south lights to
    PM3–PM5.


    We can use real-time interrupts (Example 14) to continuously cycle through the
    six states shown in Note that when the light on the other street is green, we
    will delay 5 seconds. (Assume very fast cars so that you won''t have to wait all
    day!) We will delay 1 second on a yellow-red or red-red combination.


    ![](img/6c970885d6405944bd67e68f02bac5bc_78_1.png)'
