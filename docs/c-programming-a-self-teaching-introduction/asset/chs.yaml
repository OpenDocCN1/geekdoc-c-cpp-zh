  \ c;\nc = a++ + b + a++;\nprintf(“%d”, c);\nc = ++a + b + ++c;\nprintf(“%d”, c);\n\
  ```\n[提示: 30 50]。\n\nQ29. 编写一个 C 程序，输入一个 10 个字符的数组，并找到重复字符的数量（如果有）。\n\n[提示：\n```c\n\
  #include<stdio.h>\nint x, c=0;\nprintf(“\\n\\n Enter characters…”);\nfor (x=0; x<10;\
  \ x++)\n{\n  scanf(“%c”, &ch[x]);\n}\nfor (x=0; x < 10; x++)\n{\n  if (ch[x] ==\
  \ ch[x – 1])\n  {\n    c = c+ 1;\n  }\n}\nprintf(“\\n\\n No. of duplicate characters\
  \ %d”, c);\nreturn 0;\n```]\n\nQ30. 解释如何使用指针访问数组元素，并以两个阶为 10 的一维数组相加作为示例。\n\nQ31.\
  \ 用示例说明指针是如何传递给函数的。\n\nQ32. 编写一个 C 函数，计算两个向量 (x1, x2, … xn) 和 (y1, y2, … yn) 的叉积，结果为\
  \ Σ (xi* yi)，t = 1 到 n。在主程序中使用它输入 3 个向量 x, y, z 并计算向量方程：(xy + yz)。\n\nQ33. 编写一个\
  \ C 程序，输入 20 个整数，并计算所有可能的数字的阶乘之和。\n\nQ34. 编写一个 C 程序，使用指针访问一个 100 个字符的字符串，并通过将两个空格或空白替换为单个空格来输出它。\n\
  \nQ35. (a) 提到函数的返回类型。默认情况下，函数返回什么类型的值？请给出一个示例。\n(b) 描述形式参数、实际参数、函数声明和函数定义。\n(c)\
  \ 区分指向常量的指针和常量指针。\n(d) 编写一个 C 程序，按字母顺序对字符串列表排序。\n\nQ36. (a) 编写一个 C 程序，用单词形式打印 6\
  \ 位数字的每个数字。\n(b) 编写一个 C 程序找到向量中第二大和第二小的元素。\n(c) 编写一个 C 程序，使用指针对给定的数字列表进行升序排序。\n\
  (d) 编写一个 C 程序，使用递归反转 n 个字符。\n\n## 第 4 章：结构体与联合体\n\n## 4.0 引言\n\n我们已经看到数组是相似（同质）数据项目的集合。但\
  \ C 语言还提供了两种用户定义的数据类型——结构体（structures）和联合体（unions）。它们之所以被称为用户定义数据类型，是因为用户根据自己的需要来定义它们。我们将结构体定义为异构（不同）元素的集合，这些元素在内存中连续存储。请注意，结构体是一组固定数量元素的集合，通过名称而不是通过索引（像数组那样）来访问。结构体的元素可以是不同的数据类型。\n\
  \n假设我们想在程序中存储一个当前日期——让我们称之为 2016 年 3 月 24 日。我们取三个不同的变量来存储 24（日）、03（月）和 2016（年）。现在假设我们想要存储一个购买日期；同样我们需要三个变量——例如\
  \ `date_of_purchase`、`month_of_purchase` 和 `year_of_purchase`。这意味着我们现在需要另一组三个变量。这消耗了大量的内存。结构体在这里很有帮助。因此，我们可以如下声明一个日期结构体：\n\
  \n```c\nstruct date\n{\n  int month;\n  int day;\n  int year;\n};\n```\n\n在这里，`date`\
  \ 是一个结构体（用户定义），它有三个成员，分别称为 `month`、`day` 和 `year`。这里 `date` 的定义在语言中定义了一种新的数据类型，从这个意义上说，随后可以声明变量为\
  \ `struct date`：\n\n```c\nstruct date today;\n```\n\n然而，与 `int`、`float` 或 `char`\
  \ 类型的变量不同，在处理结构体变量时需要特殊的语法。访问成员函数的方法是指定变量名，后面跟一个点（`.`）或运算符，然后是成员名。\n\n例如，\n\n`today.day\
  \ = 24;`\n\n请注意，变量名、点和成员名之间不允许有空格。因此，要设置日期的年份，表达式为：\n\n`today.year = 2016;`\n\n\
  为了测试 `month` 的值以检查是否等于 3，语句如下：\n\n```c\nif( today.month == 03 )\n    next_month\
  \ = 01;\n```\n\n结构体声明的语法是：\n\n```c\nstruct 标签\n{\n  成员 1 类型;\n  成员 2 类型;\n  ...\n\
  };\n```\n\n\n\n\n\n```c\n #include<stdio.h>\n   main( )\n     {\n       struct Employee\n\
  \        {\n          char name[20];\n          int age;\n          float salary;\n\
  \        };\n       struct Employee emp1, emp2;\n       printf(\"\\n Enter name,\
  \ age and salary of the 1st employee:\");\n       scanf(\"%s %d %f\", &emp1.name,\
  \ &emp1.age, &emp1.salary);\n       printf(\"\\n Enter name, age and salary of the\
  \ 2nd employee:\");\n       scanf(\"%s %d %f\", &emp2.name, &emp2.age, &emp2.salary);\n\
  \       printf(\"\\n First Employee details…);\n       printf(\"\\n Name: %s\",\
  \ emp1.name);\n       printf(\"\\n Age: %d\", emp1.age);\n       printf(\"\\n Salary:\
  \ %f\", emp1.salary);\n       printf(\"\\n Second Employee details…);\n       printf(\"\
  \\n Name: %s\", emp2.name);\n       printf(\"\\n Age: %d\", emp2.age);\n       printf(\"\
  \\n Salary: %f\", emp2.salary);\n     }\n```\n\n**输出（运行后）：**\n\n输入第一个员工的姓名、年龄和工资：\
  \ Dr. Rajiv 40     82000.00\n\n输入第二个员工的姓名、年龄和工资： Mr. Sushant 30 50000.00\n\n第一个员工详细信息…\n\
  \n姓名: Dr. Rajiv\n\n年龄: 40\n\n工资: 82000.00\n\n第二个员工详细信息…\n\n姓名: Mr. Sushant\n\n年龄:\
  \ 30\n\n工资: 50000.00\n\n## 结构体的初始化\n\n就像初始化 `ints`、`floats`、`chars` 和数组一样，你也可以初始化结构体变量。\n\
  \n例如，在之前的结构体 `Emp` 中：\n\n```c\n struct Emp\n    {\n      char fname[40], lname[40];\n\
  \      int age;\n      float salary;\n      char address[30], dept[30];\n    };\n\
  ```\n\n那么，该结构体的变量——假设 `emp1`——可以在声明时按如下方式进行初始化：\n\n```c\nstruct Emp emp1 = {\"Rajiv\"\
  , \"Chopra\", 40, 82000.00, \"GTB Nagar\", \"Computer Science\"};\n```\n\n或者你也可以写如下所示：\n\
  \n```c\n struct Emp\n    {\n      char fname[40], lname[40];\n      int age;\n \
  \     float salary;\n      char address[30], dept[30];\n    }emp1 = {\"Rajiv\",\
  \ \"Chopra\", 40, 82000.00, \"GTB Nagar\", \"Computer Science\"};\n```\n\n在这里，\n\
  \n`emp1.fname = \"Rajiv\"`\n\n`emp1.lname = \"Chopra\"`\n\n`emp1.age = 40`\n\n`emp1.salary\
  \ = 82000.00`\n\n`emp1.address = \"GTB Nagar\"`\n\n`emp.dept = \"Computer Science\"\
  `\n\n由于我们可以将一个基本数据类型赋值给另一个基本数据类型变量，同样，我们可以将一个结构体变量赋值给另一个相同类型的结构体变量。\n\n例如：\n\n```c\n\
  \ struct Emp\n    {\n      char fname[40], lname[40];\n      int age;\n      float\
  \ salary;\n      char address[30], dept[30];\n    };\n\nstruct Emp emp1 = {\"Rajiv\"\
  , \"Chopra\", 40, 82000.00, \"GTB Nagar\", \"Computer Science\"};\n\nstruct Emp\
  \ emp2;\n\nemp2 = emp1; /* 有效 */\n```\n\n所以现在 `emp2` 将拥有与 `emp1` 相同的数据。\n\n但请注意以下初始化是无效的：\n\
  \n```c\nstruct Emp\n {\n     char fname[10] = \"Rajiv\"; /* 无效 */\n     int lname[10]\
  \ = \"Chopra\"; /* 无效 */\n     int age= 40; /* 无效 */\n     ……\n  };\n```\n\n这意味着不能在结构体声明内部初始化单个成员变量。如果你这样做，将会得到一个编译错误。\n\
  \n# 结构体数组\n\n当我们想要存储大量的相似记录时——例如 100 名员工——结构体数组的定义如下：\n\n```c\n struct Emp\n   \
  \  {\n       char fname[40], lname[40];\n       int age;\n       float salary;\n\
  \       char address[30], dept[30];\n     };\n\nstruct Emp emp1[100]; /* 声明结构体数组\
  \ */\n```\n\n这意味着 `emp1` 是一个包含 100 个 `struct Employee` 类型元素的数组。只有在执行此语句后，C 编译器才会为\
  \ 100 个结构体预留内存空间；结构体数组的规则与 `ints`、`floats` 或 `chars` 等基本数据类型数组的相同。\n\n![](img/Fig-4-2.jpg)\n\
  \n图 4.2: 存储的结构体数组\n\n请注意，这里 `struct Emp` 的员工仅通过索引来选择。\n\n例如，`emp1[0]` 是结构体数组 `emp1`\
  \ 中的第一个元素。数组 `emp1` 的每个元素都是一个类型为 `struct Emp` 的结构体。\n\n另外请注意，为了访问第一个员工的 `fname`，我们使用以下表达式\
  \ `emp1[0].fname`。因此，第一个员工被引用为：\n\n`emp1[0].fname`\n\n`emp1[0].lname`\n\n`emp1[0].age`\n\
  \n`emp1[0].salary`\n\n`emp1[0].address`\n\n`emp1[0].dept`\n\n同样，第二个员工记录被引用为：\n\n\
  `emp1[1].fname`\n\n`emp1[1].lname`\n\n`emp1[1].age`\n\n`emp1[1].salary`\n\n`emp1[1].address`\n\
  \n`emp1[1].dept`\n\n而第 100 个员工记录被引用为：\n\n`emp1[99].fname`\n\n`emp1[99].lname`\n\n\
  `emp1[99].age`\n\n`emp1[99].salary`\n\n`emp1[99].dept`\n\n还有另一种显示方法：\n\n```c\n struct\
  \ Emp {\n   char fname[40], lname[40];\n   int age;\n   float salary;\n   char address[30],\
  \ dept[30];\n };\nstruct Emp emp1[100]; /* 声明结构体数组 */\n```\n![](img/Fig-4-3.jpg)\n\
  \n因此，第一个员工被引用为：\n\n`emp1[0].fname`\n\n`emp1[0].lname`\n\n`emp1[0].age`\n\n`emp1[0].salary`\n\
  \n`emp1[0].address`\n\n`emp1[0].dept`\n\n相同的步骤适用于 `emp1[1]` 到 `emp1[99]` 的 100 名员工的记录。\n\
  \n# 如何初始化结构体数组\n\n我们可以像初始化单个结构体一样来初始化结构体数组。例如：\n\n```c\nstruct Emp {\n    char name[30];\n\
  \    int age;\n    float salary;\n};\nstruct Emp emp1[5] = {\n    {\"Rajiv\", 41,\
  \ 83000.00},\n    {\"Ajay\", 31, 73000.00},\n    {\"Sushant\", 32, 17000.00},\n\
  \    {\"Yash\", 29, 33000.00},\n    {\"Ankur\", 38, 55000.00}\n};\n```\n\n此声明创建了一个包含\
  \ 5 个 `Employee` 结构体的数组。第一组值被赋值给 `emp1[0]`，第二组赋值给 `emp1[1]`，依此类推。初始值用逗号分隔，并封装在大括号内。结束括号后跟分号。\n\
  \n我们现在可以写程序了。\n\n/* 显示结构体数组的概念 */\n\n```c\n #include<stdio.h>\nvoid main( )\n {\n\
  \   struct Employee\n     {\n       char name[20];\n       int age;\n       float\
  \ salary;\n     };\n     struct Employee emp[5];\n     int i;\n\n      float x,\
  \ *y = &x, x= *y; /* 为什么? */\n      printf(\"\\n\\t Enter your 5 employees name,\
  \ age and salary:    n\\n\");\n      for(i=0; i<5; i++)\n         scanf(\"%s %d\
  \ %f\", emp[i].name, &emp[i].age, &emp[i].salary);\n      printf(\"\\n You have\
  \ entered these records\\n\");\n      for(i=0; i<5; i++)\n      printf(\"\\n %s\\\
  t\\t: %d\\t\\t: %f\", emp[i].name, emp[i].age, emp[i].salary);\n   }\n```\n\n**输出（运行后）：**\n\
  \n输入 5 名员工的姓名、年龄和工资：\n\nRajiv 40 82000.00\nAjay 30 67000.00\nAmit 30 70000.00\n\
  Mayur 20 6700.00\nAdi 30 50000.00\n\n你已输入这些记录\n\nRajiv: 40: 82000.00\nAjay: 30:\
  \ 67000.00\nAmit: 30: 70000.00\nMayur: 20: 6700.00\nAdi: 30: 50000.00\n\n注意此程序中的以下语句：\n\
  \n`float x, *y = &x, x= *y;`\n\n如果不存在此语句，你将得到错误消息：\n\n`scanf: floating point formats\
  \ not linked. Abnormal program termination.`\n\n解释：此错误由于浮点数模拟器引起。浮点模拟器用于在 `scanf()`\
  \ 和 `atof()` 等运行时函数中处理浮点数。在某些情况下（例如结构体数组），`float` 是结构体成员，且对 `float` 的引用稍显模糊；这就是为什么编译器没有检测到对模拟器的需求。为了克服这一局限性，对\
  \ `float` 的地址进行了引用。当编译器遇到 `float` 的地址时，它会自动设置一个标记，让链接器链接浮点模拟器。这就是为什么这些语句强制将浮点模拟器链接到程序中。因此，为了防止此错误，请在程序的开头包含该语句。\n\
  \n## 嵌套结构体\n\n可以将一个结构体嵌套在另一个结构体内部。这种结构被称为嵌套结构体。\n\n例如：\n\n```c\nstruct date\n{\n\
  \    int day;\n    int month;\n    int year;\n};\n\nstruct Emp\n{\n    char fname[40],\
  \ lname[40];\n    int age;\n    float salary;\n    struct date dob;\n    struct\
  \ date dobj;\n    char address[30], dept[30];\n};\n```\n\n注意下一个示例所示的嵌套结构中的限制：\n\n\
  ```c\nstruct Emp\n{\n    char name[40];\n};\n```\n\n\n\n\n\n```c\nint age;\nfloat\
  \ salary;\nstruct Emp e; /* 这是法的 */\n};\n```\n\n因此，结构体的成员也可以是另一个结构。也就是说，你可以说结构中的单个结构成员也可以是结构。其成员本身是结构的结构被称为嵌套结构或层级结构。\n\
  \n例如，假设我们想要将名为 `address` 的结构嵌套在另一个名为 `Employee` 的结构中；声明这种嵌套结构有两种方法：\n\n### I. 第一种方法\n\
  \n```c\nstruct date\n {\n    int day;\n    int month;\n    int year;\n};\nstruct\
  \ Emp\n{\n    char fname[40], lname[40];\n    int age;\n    float salary;\n    struct\
  \ date dob;\n    struct date dobj;\n    char address[30], dept[30];\n};\n```\n\n\
  使用这种表示法时，请记住嵌入的结构类型（`date`）应该在包含它的结构中使用之前声明；否则编译器将无法识别它。\n\n### II. 第二种方法\n\n```c\n\
  struct Emp\n{\n    char fname[30], lname[30];\n    int age;\n    float salary;\n\
  \    struct date\n    {\n        int day;\n        int month;\n        int year;\n\
  \    } dob, doj;\n    char address[30], dept[30];\n};\n```\n\n在这种方法中，你不能直接在其他地方将结构\
  \ `date` 作为普通结构使用。另一方面，如果你使用第一种方法并将 `address` 结构声明在 `Emp` 结构之外，那么你也可以在其他地方直接使用 `address`\
  \ 结构。\n\n嵌套结构也可以如下进行初始化：\n\n```c\nstruct Emp emp1 = {\"Rajiv\", \"Chopra\", 40,\
  \ 82000.00, 24, 03, 2016, \"GTB NAGAR\", \"Computer Science\" };\n```\n\n现在让我们看看如何访问嵌套结构的成员。\n\
  \n在这个示例中，`date` 结构被用在 `Emp` 结构中。结构内部特定成员可以通过重复应用点（`.`）运算符来访问。\n\n例如，在以下语句中：\n\n\
  ```c\nemp.dob.day = 5;\n```\n\n我们将 `emp` 结构中 `dob` 结构的 `day` 变量设置为 5。同样，嵌套结构的其他成员访问方式如下：\n\
  \n```c\nemp.dob.month = 3;\nemp.dob.year = 2016;\n```\n\n我们还可以如下方式显示嵌套结构的成员：\n\n\
  ```c\nprintf(\"%d\", emp.dob.day);\nprintf(\"%d\", emp.dob.month);\nprintf(\"%d\"\
  , emp.dob.year);\n```\n\n注意，这种层级的嵌套可以达到任何层级。没有限制。还需要注意，结构不能嵌套在自身。\n\n例如：\n\n```c\n\
  struct Emp\n{\n    char name[40];\n    int age;\n    float salary;\n    struct Emp\
  \ e; /* 这是非法的 */\n};\n```\n\n但是可以有一个自身类型的结构指针作为其结构成员。\n\n例如：\n\n```c\nstruct Emp\n\
  {\n    char name[40];\n    int age;\n    float salary;\n    struct Emp*e; /* 这是非法的\
  \ */\n};\n```\n\n这样的结构被称为自引用结构。\n\n## 结构与函数\n\n就像我们可以传递基本数据类型一样，也可以将结构变量传递给函数并从函数接收结构数据类型。这里使用了两种技术：结构作为函数参数和函数返回结构。\n\
  \n## I. 结构作为函数参数\n\nC 语言提供了一种在函数调用中将整个结构作为参数传递给函数的方法。结构变量的传递就像任何基本数据类型一样。\n\n例如：\n\
  \n```c\n#include<stdio.h>\ndisplay(struct Employee);\nstruct Employee\n{\nchar name[10];\n\
  int age;\nfloat salary;\n};\nmain( )\n{\n   struct Employee emp = {\"Rajiv\", 40,\
  \ 82000.00};\n   display(emp); /* 将整个结构传递给 display( ) */\n}\ndisplay(struct Employee\
  \ e) {\n    printf(\"\\n Employee Record:\");\n    printf(\"\\n Name: %s\", e.name);\n\
  \    printf(\"\\n Age: %d\", e.age);\n    printf(\"\\n Salary: %f\", e.salary);\n\
  }\n```\n\n输出（运行后）：\nEmployee Record:\nName: Rajiv\nAge: 40\nSalary: 82000.00\n\n\
  解释：在这里，`struct Employee` 声明在 `main()` 外部，因为我们将整个结构变量 `emp` 传递给了函数 `display()`。如果你在\
  \ `main()` 内部声明 `struct Employee`，那么函数 `display()` 就不知道数据类型结构 `emp` 的标识符，因为它被视为局部声明。为了使其成为全局的，必须在\
  \ `main()` 外部声明 `struct Employee`。当你传递一个基本类型数组时，你也可以将结构数组传递给函数。在此情况下，你将使用与传递基本类型数组时相同的表示法。请注意，当结构变量作为参数传递给函数时，它是像其他类型一样按值传递的。因此，如果你在函数中进行了任何更改，调用者处是不可见的。\n\
  \n### II. 函数返回结构\n\n像基本数据类型一样，你也可以使用 `return` 语句从函数返回结构。\n\n例如：\n\n```c\n#include<stdio.h>\n\
  struct Employee readRecord( );\nstruct Employee\n{\n   char name[10];\n   int age;\n\
  \   float salary;\n};\nmain( )\n{\n   struct Employee emp1, emp2;\n   emp1 = readRecord(\
  \ );\n   emp2 = readRecord( );\n   printf(\"\\n First Record:\");\n   printf(\"\\\
  n Name: %s\", emp1.name);\n   printf(\"\\n Age: %d\", emp1.age);\n   printf(\"\\\
  n Salary: %f\", emp1.salary);\n   printf(\"\\n Second Record:\");\n   printf(\"\\\
  n Name: %s\", emp2.name);\n   printf(\"\\n Age: %d\", emp2.age);\n   printf(\"\\\
  n Salary: %f\", emp2.salary);\n}\nstruct Employee readRecord( )\n{\n   struct Employee\
  \ e;\n   printf(\"\\n Enter name, age and salary: \");\n   scanf(\"%s %d %f\", e.name,\
  \ &e.age, &e.salary);\n   return e;\n}\n```\n\n输出（运行后）：\nEnter name, age and salary:\n\
  Rajiv 40 82000.00\nFirst Record:\nName: Rajiv\nAge: 40\nSalary: 82000.00\nEnter\
  \ name, age and salary:\nAmit 30 75000.00\nSecond Record:\nName: Amit\nAge: 30\n\
  Salary: 75000.00\n\n\n\n\n\n| 月份 | 天数 |\n| :--- | :--- |\n| 1 月 | 31 |\n| 2 月 |\
  \ 28 |\n| 3 月 | 31 |\n| 4 月 | 30 |\n| 5 月 | 31 |\n| 6 月 | 30 |\n| 7 月 | 31 |\n|\
  \ 8 月 | 31 |\n| 9 月 | 30 |\n| 10 月 | 31 |\n| 11 月 | 30 |\n| 12 月 | 31 |\n\n下面的图展示了内存存储是如何实现的。\n\
  \n![](img/Fig-4-4.jpg)\n\n从图中可以看出，`months[0]` 是数组第一个位置的整个月份结构。该表达式的类型为 `struct month`。因此，当将\
  \ `months[0]` 作为参数传递给函数时，函数内部对应的形式参数必须声明为 `struct month` 类型。那么，表达式：\n\n`months[0].number_of_days`\n\
  \n指的是 `months[0]` 中包含的 `month` 结构体的 `number_of_days` 成员。该表达式的类型为 `int`。\n\n`months[0].name`\
  \ 指的是 `months[0]` 中 `month` 结构体的 `name` 成员。如果将此表达式作为参数传递给函数，对应的形式参数应声明为 `char` 类型数组。最后，表达式\n\
  \n`months[0].name[0]` 指的是 `months[0]` 中月份结构中 `name` 数组的第一个字符。\n\n### 4.1 结构体 (STRUCTURES)\
  \ 与 联合体 (UNIONS)\n\n与结构体一样，联合体也是用户定义的类型。联合体是一种允许不同类型的变量共享同一块内存的数据类型。与结构体每个成员都有自己的内存空间不同，联合体允许成员之间共享空间。\n\
  \n### 语法\n\n```c\nunion unname\n{\n    datatype-1 ListOfVariables;\n    datatype-2\
  \ ListOfVariables;\n    …………\n    datatype-n ListOfVariables;\n};\n```\n\n在这里，`union`\
  \ 是关键字，`unname` 是联合体类型的名称。声明一个联合体变量。当创建一个联合体变量时，C 编译器会自动分配足够的空间来容纳联合体最大的成员。由于联合体的所有成员使用相同的空间，每当一个成员发生变化，其他成员也会随之变化。例如：\n\
  \n```c\nunion Sample\n{\n    float x;\n    int a;\n    char ch;\n};\n```\n\n现在你可以这样创建一个\
  \ `union Sample` 联合体变量：\n\n`union Sample one;`\n\n在这里，`one` 是联合体变量。另一种实现这种方法如下：\n\
  \n```c\nunion Sample\n{\n    float x;\n    int a;\n    char ch;\n}one;\n```\n\n\
  与结构体一样，联合体成员的访问方式也是使用点运算符（`.`）。联合体成员的访问方式如下：\n\n```c\none.x = 3.14;\none.a = 80;\n\
  one.ch = 'R';\n```\n\n注意联合体变量一次只能包含一个有效值，将它存储为一种类型然后提取为另一种类型是错误的。这意味着联合体允许内存的一部分在某个时刻视为一种类型，在另一个时刻视为另一种类型。\n\
  \n同样注意结构体和联合体之间的一些区别：\n\n1. 结构体的大小等于其各个元素大小之和，而联合体的大小是其元素中最大值。\n2. 结构体的所有成员可以在任何时候被访问，而联合体在任何时刻只能访问其中一个成员，因为只有一个成员会有有效值。\n\
  \n联合体可以像结构体一样出现在数组和结构中。C 也允许在结构体中使用联合体。访问联合体中的结构成员的方法与访问结构体中的成员的方法相似。\n\n## 4.2\
  \ 结构体 (STRUCTURES) 与 指针 (POINTERS)\n\n通常，声明结构指针的语法是：\n\n`struct stname *eptr;`\n\
  \n其中 `struct` 是关键字，`stname` 是结构类型的名称，`eptr` 是指向结构 `stname` 的结构指针。结构指针持有相同类型结构变量的地址。\n\
  \n例如：\n\n```c\nstruct Emp\n{\n    char name[30];\n    int age;\n    float salary;\n\
  };\n```\n\n我们可以如下声明结构体变量和结构指针：\n\n```c\nstruct Emp emp; /* 声明结构体变量 */\nstruct Emp\
  \ *eptr; /* 声明结构指针 */\neptr = &emp;\n```\n\n在这里，`eptr` 是指向 `emp` 的结构指针。然而，你也可以在声明结构体变量的同时声明\
  \ `eptr`：\n\n```c\nstruct Emp emp1, *eptr = &emp1;\n```\n\n注意你可以如下将结构指针 `eptr` 初始化为\
  \ `emp` 的地址。\n\n另外注意 C 提供了一个特殊的箭头运算符（`->`），通过结构指针访问结构成员。其语法为：\n\n`eptr->member;`\n\
  \n现在如果 `eptr` 是 `struct Emp` 类型的结构指针，你可以如下访问结构体成员的名称、年龄和工资：\n\n```c\neptr->name;\n\
  eptr->age;\neptr->salary;\n```\n\n或者，你也可以通过点运算符通过结构指针访问结构体成员。为此你必须使用指针 `*` 对结构指针解引用并使用点运算符。例如，如果\
  \ `eptr` 是 `struct Emp` 类型的结构指针，你可以如下访问结构体成员的名称、年龄和工资：\n\n```c\n(*eptr).name;\n\
  (*eptr).age;\n(*eptr).salary;\n```\n\n这里必须使用括号，因为点运算符（`.`）的优先级高于解引用运算符（`*`）。如果你省略了括号，这些表达式将被解释为：\n\
  \n```c\n*(eptr.name);\n*(eptr.age);\n*(eptr.salary);\n```\n\n由于 `eptr` 是结构指针，C 编译器肯定会标记错误信息。\n\
  \n在继续讨论之前，让我们写一个程序来展示结构指针的使用，然后展示我们对结构体和联合体区别的理解。\n\n**示例 1：** 创建一个结构体 `Employee`\
  \ 并存储其姓名、年龄和工资。显示员工的详细信息。\n\n**解 1：** 程序如下：\n\n```c\n#include<stdio.h>\nmain( )\n\
  {\n   struct Employee\n    {\n      char name[30];\n      int age;\n      float\
  \ salary;\n    };\n   struct Employee emp1, emp2; /* 结构体变量 */\n   struct Employee\
  \ *eptr1, *eptr2; /* 结构指针 */\n   eptr1 = &emp1;\n   eptr2 = &emp2;\n   /* 对结构体使用点运算符，对指针使用箭头运算符\
  \ */\n   printf(\"\\n\\tEnter name, age and salary of first employee:\\n\");\n \
  \  scanf(\"%s %d %f\", emp1.name, &emp1.age, &emp1.salary);\n   printf(\"\\n\\tEnter\
  \ name, age and salary of second employee:\\n\");\n   scanf(\"%s %d %f\", eptr2->name,\
  \ &eptr2->age, &eptr2->salary);\n   printf(\"\\n First Employee:\");\n   printf(\"\
  \\nName: %s\", eptr1->name);\n   printf(\"\\nAge: %d\", eptr1->age);\n   printf(\"\
  \\nSalary: %f\", eptr1->salary);\n   printf(\"\\n Second Employee:\");\n   printf(\"\
  \\nName: %s\", emp2.name);\n   printf(\"\\nAge: %d\", emp2.age);\n   printf(\"\\\
  nSalary: %f\", emp2.salary);\n}\n```\n\n**输出（运行后）：**\n\n```\n\tEnter name, age and\
  \ salary of first employee:\nRajiv 40 82000.00\n\tEnter name, age and salary of\
  \ second employee:\nAmit 30 55000.00\n First Employee:\nName: Rajiv\nAge: 40\nSalary:\
  \ 82000.00\n Second Employee:\nName: Amit\nAge: 30\nSalary: 55000.00\n```\n\n结构体也可以包含指针作为其成员变量。例如：\n\
  \n```c\nstruct Emp\n{\n    char *name;\n    int age;\n    float salary;\n};\n```\n\
  \n在这里结构体 `Emp` 关联了一个指针 `name`。现在可以这样定义和使用结构体成员：\n\n```c\nstruct Emp emp1 ={\"Rajiv\"\
  , 40, 82000.00};\nstruct Emp emp2;\n```\n\n\n\n\n\n```c\nemp2.name = \"Rajiv\";\n\
  emp2.age = 40;\nemp2.salary = 82000.00\n```\n\n## 示例 2：区分结构体和枚举类型。\n\n解决方案 2：结构体是一种强大且灵活的方法，可以将多个不同的数据项分组合在一个名称下。另一方面，可以在类型说明符中为有限值集定义一个枚举数据类型。请记住，`C`\
  \ 语言并不提供读取和显示枚举类型值的功能。它们只能作为整数值被读取或显示。\n\n我们现在可以编写一些程序了。\n\n## 示例 1：编写一个 C 程序读取学生记录并计算其成绩百分比。它还应该根据下述规则分配等级：\n\
