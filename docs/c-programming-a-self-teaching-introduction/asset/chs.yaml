  \ `push` 和 `pop`。栈按照后进先出（LIFO）原理工作。在 C 中实现一个栈。编写两个函数 `push( )` 和 `pop( )`。\n\n**解决方案\
  \ 37：** 以下是两个函数：\n\n```\n /*栈上的 push 操作 */\n/* stack [ ] 是一个栈数组，item 是被推入栈的数据，*top\
  \ 是指针 */\n /* 指向栈顶，且 max_size 是栈的最大尺寸 */\nvoid push (char stack [ ], char item,\
  \ int *top, int max_size)\n{\n   if (*top < max_size – 1)\n    {\n      ++(*top);\n\
  \      stack[*top] = item;\n    }\n}\n/*栈上的 pop 操作 */\n/* stack [ ] 是一个栈数组，*top\
  \ 指向栈顶，item 是从栈中弹出的值 */\nchar pop(char stack, int *top)\n{\n   char item;\n   if\
  \ (*top >= 0) {\n      item = stack[*top];\n      - (*top);\n   }\nelse {\n    \
  \  item = STACK_EMPTY;\n   }\nreturn (item);\n}\n```\n\n### 总结\n\n数组和指针是相关的。在本章中，我们学习了\
