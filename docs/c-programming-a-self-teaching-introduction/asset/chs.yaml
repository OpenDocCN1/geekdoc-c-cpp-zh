  \n1. `fseek()`—将文件指针移动到文件中的新位置\n2. `ftell()`—找到当前位置并发送到文件中的位置\n3. `rewind()`—将文件指针置于开头\n\
  \n### 总结\n\n尽管今天数据库非常流行，但文件的概念仍然存在。这是因为文件可以执行某些最适合该格式完成的任务，例如记录的顺序处理。文件用于存储可程序处理的信息。所有数据和程序都存储在文件中。甚至是你使用的编辑器，如\
  \ `tc` 编辑器或 `tc++` 编辑器，也仅使用并处理文件。即使你在发送邮件附件时，这些也是被附加并发送的文件。\n\n### 练习题\n\n**Q1.**\
