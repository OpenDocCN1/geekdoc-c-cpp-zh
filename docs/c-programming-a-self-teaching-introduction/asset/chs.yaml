  \nSolution 3: 程序如下：\n\n```c\n #include<stdio.h>\nmain( )\n{\n int val[10];\n int\
  \ max, i,n;\n printf(\"\\n\\tPlease enter the array size:\");\n scanf(“%d”, &n);\n\
  \ printf(\"\\n\\tPlease enter the array elements:\");\n for(i=0; i<n;i++)\n  scanf(“%d”,\
  \ &val[i]);\n max = large(val, 10); /*passing the entire array ‘val’ */\n printf(\"\
  \\n\\tLargest elements is %d”, max);\n}\nlarge(int val[ ] , int n)\n{\n int temp,\
  \ i;\n temp = val[0];\n for(i=1;i<n;i++)\n  {\n    if (temp < val[i])\n       temp\
  \ = val[i];\n }\n return temp;\n}\n```\n\nOUTPUT（运行后）：\n\nEnter the size of the\
  \ array: 10\n\nEnter the array elements: 1 2 3 4 5 8 9 10 20 30\n\nLargest element\
  \ is: 30\n\n请注意，当数组作为参数传递时，传递的是数组的基地址（即第一个元素的地址）。另请注意，默认情况下数组仅按引用传递的。\n\n### Q4.\
  \ 编写一个 C 程序，读取 10 个整数元素，将它们反转，然后显示它们。\n\nSolution 4: 程序如下：\n\n```c\n #include<stdio.h>\n\
  void main( )\n{\n   int a[10], i;\n   clrscr( );\n   printf(\"\\n\\tEnter your 10\
