  \ C 程序，使用命令行合并两个文件。\n\n### 解决方案 7：`argc` 指参数的数量。`argv1` 指第一个文件。`argv2` 指第二个文件。以下程序使用命令行合并两个文件：\n\
  \n```c\n#include<stdio.h>\n#include<conio.h>\n\nmain(int argc, char *argv[])\n{\n\
  \    FILE *fp1, *fp2, *fp3;\n    int i, j, c1=0, c2=0, dup=0;\n    char ch;\n\n\
  \    if (argc != 4)\n    {\n        printf(\"Usage: %s <file1> <file2> <output>\\\
  n\", argv[0]);\n        exit(1);\n    }\n\n    if ((fp1 = fopen(argv[1], “r\"))\
  \ ==NULL)\n    {\n        printf(\"\\n Cannot open first file”);\n        exit(1);\n\
  \    }\n    if ((fp2 = fopen(argv[2], “r\")) ==NULL)\n    {\n        printf(\"\\\
  n Cannot open second file”);\n        exit(1);\n    }\n    fp3 = fopen(argv[3],\
  \ “w”);\n\n    n1 = getch(fp1);\n    n2 = getch(fp2);\n\n    while ((i != c1) &&\
  \ (j != c2))\n    {\n        if (n1 < n2)\n        {\n            putc(n1, fp3);\n\
  \            n1 = getch(fp1);\n            i++;\n        }\n        else\n     \
  \   {\n            if (n1 > n2)\n            {\n                putc(n2, fp3);\n\
  \                n2 = getch(fp2);\n                j++;\n            }\n       \
  \     else\n            {\n                putc(n1, fp3);\n                n1 =\
  \ getch(fp1);\n                n2 = getch(fp2);\n                i++;\n        \
  \        j++;\n                dup++;\n            }\n        }\n    }\n\n    if\
  \ (i == c1)\n    {\n        do {\n            putc(n2, fp3);\n        } while (n2\
  \ = getch(fp2)) != EOF);\n    }\n    else\n    {\n        do {\n            putc(n1,\
  \ fp3);\n        } while (n1 = getch(fp1)) != EOF);\n    }\n\n    fclose(fp1);\n\
  \    fclose(fp2);\n    fclose(fp3);\n}\n```\n\n\n\n\n\n## 24681012141618\n\n文件 `f3`\
