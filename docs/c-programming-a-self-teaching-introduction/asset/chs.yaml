  ### 5.2 文件的字符输入/输出\n\n正如使用 `getchar()` 和 `putchar()` 函数从键盘读取和写入数据一样，我们可以使用字符 I/O\
  \ 函数每次读取或写入一个字符。\n\n写入文件\n\n在向文件写入之前，我们必须以写入模式打开它。\n\n语法\n\n`fputc(ch, fp);`\n\n\
  其中 `ch` 是字符变量或常量，`fp` 是文件指针。\n\n从文件中读取数据\n\n写入文件中的数据也可以使用 `fgetc()` 函数从同一个文件中读取。\n\
  \n语法\n\n`ch = fgetc(fp);`\n\n其中 `ch` 是字符变量，`fp` 是文件指针。\n\n`fgetc()` 函数用于从 `fp` 指向的文件中每次读取一个字符。它返回读取到的字符，或者在到达文件结束时返回文件结束（EOF）字符。请注意，`EOF`\
  \ 也存在于 `<stdio.h>` 文件。\n\n### 5.3 字符串 I/O 函数\n\n同样可以以字符串的形式更方便地读取或写入数据。\n\n写入文件\n\
  \n我们可以以字符串的形式向文件写入数据。我们使用 `fputs()` 函数来实现。\n\n语法\n\n`fputs(s, fp);`\n\n\n\n\n其中\
  \ `s` 是一个字符串常量或变量，`fp` 是一个文件指针。此函数用于将数据放入或写入文件，这与用于将数据写入屏幕的 `puts()` 函数相比。\n\n###\
  \ 从文件中读取数据\n\n以字符串形式写入文件的数据也可以通过 `fgets()` 函数进行读取。\n\n### 语法\n\n```\nfgets (s, n,\
  \ fp);\n```\n\n其中 `s` 是字符串，`n` 是输入字符串的最大长度，`fp` 是文件指针。\n\n此函数一次读取一个字符串；如果读取到 `EOF`\
  \ 字符，它将返回 `NULL` 值。\n\n## 5.4 整数 I/O 函数\n\n正如我们可以以逐字符或逐字符串为基础来读取或写数据一样，我们也可以以整数的形式读写数据。\n\
  \n### 将数据写入文件\n\n要以整数形式写入数据，我们使用 `putw()` 函数：\n\n### 语法\n\n```\nputw (n, fp);\n\
  ```\n\n其中 `n` 是要写入文件的整数常量或变量，`fp` 是文件指针。\n\n### 从文件中读取数据\n\n从文件中读取数据，使用 `getw()`\
  \ 函数：\n\n### 语法\n\n```\ngetw (fp);\n```\n\n当遇到 `EOF` 时，此函数返回一个 `EOF` 字符。\n\n## 5.5\
  \ 格式化 I/O 函数\n\n格式化 I/O 函数用于从文件中读取或写入任何类型的数据（char、int、float、string 等）。这些函数的行为类似于控制台\
  \ I/O 函数——`scanf()` 和 `printf()`。唯一的区别是格式化 I/O 函数现在用于文件。\n\n### 将数据写入文件\n\n要向文件写入格式化输出，我们使用\
  \ `fprintf()` 函数：\n\n### 语法\n\n```\nfprintf(fp, “format string”, list);\n```\n\n\
  其中 `fp` 是文件指针；格式化字符串 `%c` 用于 char，`%d` 用于 int，或 `%f` 用于 float；`list` 是要写入文件的变量数量。\n\
  \n### 从文件中读取数据\n\n要从文件中读取格式化数据，我们使用 `fscanf()` 函数：\n\n### 语法\n\n```\nfscanf(fp,\
  \ “format string”, list);\n```\n\n其中 `list` 是要存储存储值的地址列表。\n\n## 5.6 块（或记录）I/O 函数\n\
  \n块或记录 I/O 函数用于从文件中读取或写入结构体或数组。这些函数基本上用于读写数据库文件——例如，如果我们想以结构体的形式从文件中读取或写入一个完整的员工记录。\n\
  \n### 将数据写入文件\n\n要将一个块数据写入文件，我们使用 `fwrite()` 函数：\n\n### 语法\n\n```\nfwrite (ptr,\
  \ m, n, fp);\n```\n\n其中 `ptr` 是写入文件的结构体或数组的地址，`m` 是结构体或数组的大小，`n` 是要写入的结构体或数组的数量，`fp`\
  \ 是文件指针。写入块后，此函数返回写入的数据项。如果少于请求数量，则发生了错误。在这种情况下，文件必须以二进制模式打开。\n\n### 从文件中读取数据\n\n\
  要从文件中读取一个块，我们使用 `fread()` 函数：\n\n### 语法\n\n```\nfread(ptr, m, n, fp);\n```\n\n其中\
  \ `ptr` 是从文件中读取的结构体或数组的地址，`m` 是结构体或数组的大小，`n` 是要读取的结构体或数组的数量，`fp` 是文件指针。\n\n### 示例\n\
