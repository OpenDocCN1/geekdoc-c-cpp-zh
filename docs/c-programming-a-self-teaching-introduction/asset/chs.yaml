  \ }\n```\n]\n\n# 第 5 章\n\n## C 语言中的文件处理\n\n### 5.0 引言\n\n文件长期以来一直用于存储数据。文件是传统的数据结构。它们对于顺序操作（如从文件读取或写入文件）非常有用。你需要创建一个文件，打开它，写入内容，最后关闭文件。你也可以从文件中读取。当文件数据以可读和可打印字符的形式存储时，该文件被称为文本文件。相反，如果文件包含二进制代码中的不可读字符，则该文件被称为二进制文件。例如，由编辑器创建程序程序存储为文本文件，而由编译器生成的执行文件则存储为二进制文件。\n\
  \n### 5.1 文件指针\n\n首先，我们必须打开文件。当我们打开文件时，程序和操作系统之间就建立了一个连接。因此，操作系统现在知道了文件名、数据结构以及打开文件的模式（读取或写入；文本模式或二进制模式）。文件名可以有任何扩展名，如\
  \ `.docx`、`.xlsx`、`.txt` 等。注意，文件数据结构定义为 `FILE`，它存在于 `<stdio.h>` 头文件中。\n\n语法（声明文件指针）\n\
  \n`FILE *fp;`\n\n其中 `FILE` 是包含在 `stdio.h` 中的数据结构，`fp` 是一个指向文件开头的文件指针。\n\n语法（打开文件）\n\
  \n`fp = fopen (“filename”, “mode”);`\n\n其中 `fp` 是一个指向 `FILE` 类型结构的指针。`fopen()` 是一个库函数，带有两个参数；一个是文件名，另一个是我们要打开文件的模式。它定义在\
  \ `stdio.h` 中，并返回一个指向指定文件的 `FILE` 结构的文件指针，我们将其存储在指针变量 `fp` 中。[表 5.1] 列出了不同的文件打开模式：\n\
