  \ by 1 */\n   printf(\"\\nLargest number =%d is stored at position = %d”, big, pos);\n\
  \   getch( );\n}\n```\n\nOUTPUT（运行后）：\n\nEnter the size of the array: 5\n\nEnter\
  \ the array elements: 1 2 3 4 5\n\nThe largest number = 5 is stored at position\
  \ = 5\n\n### Q6. 编写一个 C 程序，使用 10 个元素的数组交换其偶数位置和奇数位置元素。\n\nSolution 6: 程序如下：\n\n\
  ```c\n #include<stdio.h>\n#include<conio.h>\nvoid main( )\n{\n   int a[10], i, t;\n\
