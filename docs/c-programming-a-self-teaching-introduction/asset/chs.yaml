  \ -) {\n           sum = sum + j;\n         }\n      }\n```\n\n### 2.12 存储类：AUTO,\
  \ STATIC, EXTERN 和 REGISTER\n\nC 语言中的变量具有数据类型。但它们也有存储类，提供了关于其位置和可见性的信息。存储类划分了变量被识别的程序区域。以下是各种存储类：\n\
  \n### I. Auto\n\n`auto` 存储类是一个局部变量，仅对在其声明的函数可见。\n\n`auto` 是默认存储类。`auto` 关键字将指定的变量放入内存的堆栈区域。这在大多数变量声明（如\
  \ `int i;`）中通常是隐式的。\n\n所有局部变量的默认为存储类都是 `auto`。\n\n例如，\n\n```\nint counter;\n\nauto\
  \ int i;\n```\n\n这两个变量在这里定义的具有相同的存储类；`auto` 只能在函数内部使用（即局部变量）。\n\n### II. Static\n\
  \n`static` 存储类是一个局部变量，即使在控制权转移到调用函数后它仍然存在并保留其值。静态变量是那种不会[丢失值]的变量。\n\n\n\n\n关键字 `register`\
  \ 指存储在寄存器中的社会变量。它建议编译器将特定变量放在直接位于 CPU 上的快速寄存器内存中。如今的大多数编译器（如 `gcc`）非常智能，建议寄存器实际上可能会让你的程序运行变慢。请注意，`register`\
  \ 用于定义应该存储在寄存器而非 RAM 中的局部变量。还要注意，这意味着变量的最大大小等于寄存器的大小（通常为一个字/word），并且它不能使用一元运算符 `&`，因为它没有内存地址。\n\
  \n例如，\n\n```c\nregister int u;\n```\n\n`register` 关键字应仅用于需要快速访问的变量，例如计数器。还要理解，定义\
  \ `register` 并不意味着变量将存储在寄存器中；而是意味着它可能被存储在寄存器中——取决于硬件和实现的限制。\n\n在我们结束本章之前，让我们现在写一些程序。\n\
  \n### Q1. 写一个 C 程序将二进制数转换为十进制数。\n\nAns. 1: 程序如下所示：\n\n```c\n #include<stdio.h>\n\
  \    main( )\n     {\n       int binary, bin, digit, decimal=0, base=0;\n      \
  \ printf(“\\n\\t 输入任意二进制数:”);\n       scanf(“%d”, &binary);\n       bin = binary;\n\
  \       while (binary !=0)\n        {\n          digit = binary % 10;\n        \
  \  digit = digit << base;\n          decimal = decimal + digit;\n          base++;\n\
  \          binary = binary / 10;\n       }\n    printf(“\\n 二进制数 %d 的十进制对应值为 %d”,\
  \ bin, decimal);\n     }\n```\n\nOUTPUT（运行后）：\n\n输入任意二进制数：11111\n\n二进制数 11111 的\
  \ = 31\n\n### Q2. 写一个 C 程序求以下级数的和：\n\nSin (x) = x – x3 / 3! + x5 / 5! + x7 / 7!\
  \ + … + xn / n!\n\nAns. 1: 程序如下所示：\n\n```c\n #include<stdio.h>\n    main( )\n  \
