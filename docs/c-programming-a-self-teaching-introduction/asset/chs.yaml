  \ 循环和 `do-while` 循环。\n\n[提示：\n\n| `while` 循环 | `do-while` 循环 |\n| --- | --- |\n\
  | 1. 首先评估测试条件。 | 1. 先进入循环，然后评估测试条件。 |\n| 2. 循环执行的最小次数为零。 | 2. 循环至少执行一次。 |\n| 3.\
  \ 它也被称为预测试循环或入口控制循环。 | 3. 它也被称为后测试循环或退出控制循环。 |\n| 4. 它的语法是：`while(test-condition)`\
  \ { Statement(s); } | 4. 它的语法是：`do{ statement(s); while(test-condition); }` |\n\
  | 5. 不需要分号。 | 5. 在循环的 `while` 语句后需要一个分号。 |\n\n## for 循环\n\n程序中最常用、最频繁且功能多样的循环是 `for`\
  \ 循环。它被用于循环需要重复已知次数的情况。在 C 语言中，它可以用于执行已知次数的循环，或根据特定条件重复执行循环。\n\n### 语法\n\n```\n\
  \ for ( expression-1; boolExpr; expr3)\n           {\n            statement(s);\n\
  \        }\n```\n\n### `for` 循环的工作原理\n\n`for` 循环的工作原理如下：\n\n1. 首先，评估 `expr1`。它通常用于初始化计数器。\n\
  2. 接着，评估 `boolExpr` 以检查执行条件。如果它返回真值，则：\n   (a) 执行循环中的语句。\n   (b) 评估 `Expr2`。\n \
  \  (c) 控制权转移到步骤 2。\n3. 如果 `boolExpr` 返回假值，则循环终止。\n\n这意味着 `for` 循环的工作原理如下：\n\n![也就是说，首先评估\
  \ `expr1`。然后检查条件。如果为真，则进入循环体（`{` 大括号之后）并执行其中的语句。在一次迭代结束后，控制权返回到 `expr2`，然后再次检查 `boolExpr`\
  \ 条件。这就是 `for` 循环的工作过程。在此也要注意，在 `for` 循环中，三个表达式中的任何一个、两个或全部都可以省略，但必须放置两个分号（`;`）来分隔这些表达式。此外，`expr1`\
  \ 和 `expr2` 可以是逗号分隔的表达式列表。因此，`expr1` 或 `expr2` 也可能成为复合语句。记住关于 `for` 循环的以下几点：1. `for`\
  \ 循环可以使用 `while` 或 `do-while` 循环等价地编写，如下：使用 `while` 循环实现的 `for` 循环：``` expr1;  \
  \     while (boolExpr) {          statements;          expr2       }```同样，可以使用 `do-while`\
  \ 循环实现 `for` 循环：``` expr1;       do {          statements;          expr2      \
  \ }while (boolExpr);```2. 任何有效值都可以初始化为 `expr1` 并作为计数器。3. `for` 循环执行的最小次数为零。4. 可以在\
  \ `for` 循环本身中声明计数变量——例如，`for ( int count=1; count< 10; count++) {…}`。5. 我们还可以将目前讨论的三种循环中的任意相互嵌套。这种循环被称为嵌套循环。注意，循环之间不应重叠。此外，一种类型的循环结构可以嵌套在另一种类型的循环结构中。例如，`for`\
  \ 循环可以嵌套在 `while` 循环或 `do-while` 循环中，反之亦然。这取决于你正在解决的程序语句。6. 我们还可以使用带标签或不带标签的 `break`\
  \ 和 `continue` 语句控制循环的操作。`break` 语句立即终止循环代码块，而 `continue` 语句跳过块中的任何剩余代码并继续下一次循环迭代。7.\
  \ 在 `for` 语句中声明的变量/迭代器/计数变量只能在循环内部引用。8. 以下是 `for` 循环的最简形式（缺少部分）：`for (;;){ }`。9.\
  \ 这些循环是计数控制的循环。我们也可以编写用户控制的循环（即允许用户决定迭代次数）。10. `for` 循环的第一行也称为循环头。11. 注意 `expr3`\
  \ 之后没有分号。12. `for` 循环也是预测试循环，因为它在执行之前会检查条件。13. 可以在 `expr3` 的初始化部分执行多个语句，记住在 `for`\
  \ 头部的任何部分使用逗号分隔。例如，14. `for` 循环作为无限循环：`for (;)`15. `for` 循环的一个新功能是能够遍历集合（稍后讨论）。##\
