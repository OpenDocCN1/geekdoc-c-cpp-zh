  \ i++)\n    printf(\"\\n%s\\t%d\\t%f\\n\", list[i].name, list[i].roll, list[i].per);\n\
  \    getch( );\n }\n```\n\n## 示例 3：写出实现自引用结构体——链式结构的步骤。\n\n解决方案 3：当结构体的成员被声明为指向该结构体本身的指针时，它就是自引用结构体。\n\
  \n```c\nstruct link\n{\n    int data;\n    struct link *p;\n};\n```\n\n这意味着 `p`\
  \ 是一个 `link` 类型的指针。\n\n自引用结构体用于创建链表和树等数据结构。结构体的每个实例都可以指向另一个相同类型的实例。\n\n实现自引用结构体的步骤：\n\
  1. 定义带有相同类型指针成员的结构体。\n2. 声明结构体的变量。\n3. 为节点分配内存。\n4. 将一个节点的地址链接到另一个节点的指针成员。\n\n###\
  \ 示例 4：给出结构体的一些应用场景。\n\n解决方案 4：结构体的应用包括：\n1. 实现数据库系统\n2. 改变大小\n3. 清屏\n4. 使用图形绘制任何形状\n\
  5. 从键盘接收输入\n6. 检查计算机内存\n7. 输出到打印机\n8. 鼠标交互\n9. 隐藏目录中的文件\n\n## 示例 5：数组和结构体有什么相似之处？又有什么不同？\n\
  \n解决方案 5：主要点如下：\n\n| 数组 | 结构体 |\n| --- | --- |\n| 数组是内置类型。 | 结构体也是内置类型。 |\n| 数组的所有元素存储在连续位置。\
  \ | 结构体元素也存储在连续位置。 |\n| 数组是相同类型数据的集合。 | 结构体是不同类型数据的集合。 |\n| 数组只有声明。 | 结构体有声明和定义部分。\
  \ |\n| 数组没有关键字。 | 结构体带有 `struct` 关键字。 |\n| 数组不能包含位域。 | 结构体可以包含位域。\n\n### 示例 6：区分结构体（struct）和联合体（union）。\n\
  \n解决方案 6：差异如下表所示：\n\n| 结构体 (Structure) | 联合体 (Union) |\n| --- | --- |\n| 1. 结构体用于在内存的不同位置存储不同的成员。\
  \ | 1. 联合体用于在同一位置存储不同的成员。 |\n| 2. 它们不用于节省内存。 | 2. 它们用于节省内存。 |\n| 3. 使用的总内存等于各个元素/成员大小之和。\
  \ | 3. 分配的总内存等于所有成员中中最大的那个值。 |\n| 4. 使用 `struct` 关键字。 | 4. 使用 `union` 关键字。 |\n|\
  \ 5. 语法：`struct <name> { member-1; member-2; ... member-n; };` | 5. 语法：`union <name>\
  \ { member-1; member-2; ... member-n; };` |\n\n### 示例 7：编写一个 C 程序来乘两个复数。创建一个表示复数的\
  \ `complex` 结构体，并编写一个执行复数乘法的函数。已知：\n\n`(a + ib) * (c + id) = (ac – bd) + i(ad +\
  \ bc)`\n\n解决方案 7：程序如下：\n\n\n\n\n\n```c\n #include<stdio.h>\n#include<conio.h>\n\
  struct complex\n {\n   int r;\n   int i;\n};\nvoid main( )\n {\n   struct complex\
