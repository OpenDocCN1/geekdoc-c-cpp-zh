  \ per\", s1.per);\n  getch( );\n }\n```\n\n## 示例 2：修改前面的 C 程序以读取 n 个学生的记录并使用结构体数组计算他们的百分比。\n\
  \n解决方案 2：程序如下：\n\n```c\n #include<stdio.h>\n#include<conio.h>\nvoid main( )\n {\n\
