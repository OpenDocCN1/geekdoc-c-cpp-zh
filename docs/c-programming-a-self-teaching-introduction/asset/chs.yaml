  \ is %d + %di”, c.r, c.i);\n   getch( );\n }\nstruct complex multiply(struct complex\
  \ x, struct complex y)\n {\n   struct complex z;\n   z.r = (x.r + y.r) – (x.i *\
  \ y.i);\n   z.i = (x.r + y.i) – (x.i * y.r);\n   return (z);\n }\n```\n\n| 注意 |\
  \ 建议学生自行运行此程序。 |\n\n## 示例 8：编写一个 C 程序使用结构体处理学生记录。\n\n### 答案 8：程序如下：\n\n```c\n #include<stdio.h>\n\
