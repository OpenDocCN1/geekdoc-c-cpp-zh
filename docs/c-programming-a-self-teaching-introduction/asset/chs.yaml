  Enter a list of 5 elements: 2 4 6 8 10\n\nThe final list is: 4 2 8 6 10\n\n### Q7.\
  \ 编写一个 C 程序将二进制数转换为十进制数。\n\nSolution 7: 程序如下：\n\n```c\n #include<stdio.h>\n#include<conio.h>\n\
  #include<math.h>\nvoid main( )\n{\n   int i, r, count=0;\n   long b, n =0, b1;\n\
  \   clrscr( );\n   printf(\"\\nEnter a binary number: \");\n   scanf(“%ld”, &b);\n\
  \   b1 = b;\n   while(b > 0)\n    {\n      r = b % 10;\n      n = n + r * pow (2,\
  \ count);\n      count = count + 1;\n      b = b/10;\n    }\n    printf(\"\\nDecimal\
  \ value of binary %ld = %ld”, b1, n);\n    getch( );\n}\n```\n\nOUTPUT（运行后）：\n\n\
  Enter a binary number: 0010\n\nDecimal value of binary 010 = 2\n\n| NOTE | 学生应该尝试相反程序（即将十进制数转换为二进制形式）。\
  \ |\n\n### Q8. 编写一个 C 程序，从 n 个数字列表中搜索一个给定数字并打印其位置。\n\nSolution 8: 程序如下：\n\n```c\n\
