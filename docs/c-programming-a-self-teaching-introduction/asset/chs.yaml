  | 1 | 3 | 3 | 1 |  | |\n| 1 | 4 | 6 | 4 | 1 |\n\n### 什么是字符数组\n\n类似于数字数组，我们也可以定义和使用字符数组，其声明如下：\n\
  \n`char array_name[size];`\n\n这里，`array_name` 是存储字符类型数据的数组，`size` 是 `array_name`\
  \ 中字符的总数。\n\n例如，\n\n`char name[80];`\n\n这里，`name` 是可以包含 80 个字符的数组。同样，数组索引从 0 开始。因此\
  \ `name[]` 数组的第五个元素被称为：\n\n`name[4];`\n\n同样，可以使用循环访问整个数组元素。\n\n### 如何将字符读入字符数组\n\
  \n与整数数组相同，但你应该知道一个字符占用 1 字节，因此存储 10 个字符的字符数组大小为 10 字节。这里是循环：\n\n`for(i=0; i<size;\
  \ i++)`\n\n    `scanf(“%c”, &name[i]);`\n\n### 如何从字符数组写入字符\n\n与整数数组相同，但你应该知道一个字符占用\
  \ 1 字节，因此存储 10 个字符的字符数组大小为 10 字节。这里是循环：\n\n`for(i=0; i<size; i++)`\n\n    `scanf(“%c”,\
  \ &name[i]);`\n\n在讨论之前，让我们看一个 C 程序尝试写入字符串：\n\n```c\n #include<stdio.h>\n#include<conio.h>\n\
  void main( )\n{\n   int a[10][10], r, c, i, j, big, small, locbi, locbj, locsi,\
  \ locsj;\n   clrscr( );\n   printf(“\\n\\tEnter the number of rows and columns of\
  \ the\n matrix:”);\n   scanf(“%d%d”, &row, &col);\n   printf(“\\nReading array elements:”);\n\
  \   for(i=0; i<row; i++)\n    {\n      for(j=0; j<col; j++)\n         scanf(“%d”,\
  \ &a[i][j]);\n    }\n      big = a[0][0];\n      small = a[0][0];\n   for(i=0; i<r;\
  \ i++)\n    {\n      for(j=0; j<c; j++)\n       {\n         if (a[i][j] > big)\n\
  \          {\n               big = a[i][j];\n               locbi = i +1;\n    \
  \           locbj = j + 1;\n          }\n         if (a[i][j] < small)\n       \
  \   {\n               small = a[i][j];\n               locsi = i +1;\n         \
  \      locsj = j + 1;\n          }\n       }\n     }\n     printf(“\\nLargest element\
  \ is %d”, big);\n     printf(“\\nLargest element is stored at %d row %d column”,\
  \    locbi, locbj);\n     printf(“\\nSmallest element is %d”, small);\n     printf(“\\\
  nSmallest element is stored at %d row %d\n  column”, losci, locsj);\n     getch(\
  \ );\n}\n```\n\n\n\n\n```c\n #include<stdio.h>\nmain( )\n{\n   puts(\"\\nDr. RAJIV\"\
  );\n   puts(\"\\nCHOPRA\");\n   getch( );\n}\n```\n\n输出（运行后）：\n\nDr. RAJIV\n\nCHOPRA\n\
  \n在进一步讨论之前，让我们写一些程序。\n\n## 示例 1：编写一个 C 程序将大写字符串转换为小写字符串。\n\n### 解决方案 1：记住大写字母（A,\
  \ B, C，等）的 ASCII 值位于 65 到 90 之间，小写字母（a, b, c，等）的值位于 97 到 122 之间。每个大写字母与其对应的小写字母之间的差值为\
  \ 32。记住这一点，我们写了以下程序：\n\n```c\n #include<stdio.h>\nmain( )\n{\n   char name[80];\n\
  \   int i =0;\n   puts(\"\\nEnter any upper case string:\");\n   gets(name);\n \
  \  puts(\"\\nEchoing….);\n   puts(name);\n   while (name[i] != ‘0’)\n{\n   if (name[i]\
  \ >=65) && (name[i] <=90))\n      name[i] = name[i] + 32;\n   i++;\n}\nputs(\"Converted\
  \ lower case string is\");\nputs(name);\n}\n```\n\n输出（运行后）：\n\nEnter any uppercase\
  \ string: DR. RAJIV CHOPRA\n\nEchoing …\n\nDR. RAJIV CHOPRA\n\nConverted lowercase\
  \ string is:\n\ndr. rajiv chopra\n\n## 内置字符串函数和“string.h”头文件\n\nC 提供了一个内置的字符串处理函数库。这些内置函数定义在一个名为\
  \ `<string.h>` 的头文件中。如果你使用以下任何一个内置字符串函数，则必须包含该文件：\n\n| | |\n| --- | --- |\n| I.\
  \ | `strlen()` 函数 |\n| II. | `strcpy()` 函数 |\n| III. | `strcmp()` 函数 |\n| IV. |\
  \ `strcat()` 函数 |\n| V. | `strrev()` 函数 |\n| VI. | `strlwr()` 和 `strupr()` 函数 |\n\
  \n### I. strlen() 函数\n\n`strlen()` 函数返回字符串中字符的总数（不包括空字符）。\n\n语法\n\n```\nstrlen(str);\n\
  ```\n\n在这里，`str` 是任何字符串常量或字符串变量名。\n\n例如，\n\n```c\n #include<stdio.h>\n#include<string.h>\n\
  main( )\n{\n   char name[20];\n     int len;\n     printf(\"\\nEnter any string:\"\
  );\n     gets(name);\n     len = strlen(name);\n     printf(“The length of a given\
  \ string is %d”, len);\n}\n```\n\n输出（运行后）：\n\nEnter any string: Dr. Rajiv Chopra\n\
  \nThe length of a given string is 16\n\n| 注意 | 每个空格被计为 1 字节（即使是 '.' 也计为 1 字节）。 |\n\
  \n### II. strcpy() 函数\n\n`strcpy()` 函数将一个字符串的内容复制到另一个字符串。它返回一个整数值。\n\n语法\n\n```\n\
  strcpy(dest, source);\n```\n\n在这里，字符串 `source` 的内容被复制到字符串 `dest` 中。\n\n例如，\n\n```c\n\
  \ #include<stdio.h>\n#include<string.h>\nmain( )\n{\n   char name[20], dupname[20];\n\
  \   printf(\"\\nEnter your string:\");\n   gets(name);\n   strcpy(dupname, name);\n\
  \   printf(“Duplicated string is %s”, dupname);\n}\n```\n\n输出（运行后）：\n\nEnter your\
  \ string: DR. RAJIV\n\nDuplicated string is: DR. RAJIV\n\n### III. strcmp() 函数\n\
  \n`strcmp()` 函数比较一个字符串与另一个字符串的内容。它返回一个整数值。\n\n语法\n\n```\nstrcmp(str1, str2);\n```\n\
  \n在这里 `str1` 和 `str2` 是字符串常量或字符串变量。如果它们相等，函数返回 0；如果 `str1` 小于 `str2`，则返回负值；如果 `str1`\
  \ 大于 `str2`，则返回正值。记住这种比较是区分大小的。\n\n例如，\n\n```c\n #include<stdio.h>\n#include<string.h>\n\
  main( )\n{\n   char name1[80], name2[80];\n   printf(\"\\nEnter your first string:\"\
  );\n   gets (name1);\n   printf(\"\\nEnter your second string:\");\n   gets (name2);\n\
  \   if (strcmp(name1, name2) == 0)\n       printf(“Both strings are equal”);\n \
  \  else\n      printf(“Both strings are not equal”);\n}\n```\n\n输出（运行后）：\n\nEnter\
  \ your first string: DR. RAJIV\n\nEnter your second string: DR. RAJIV\n\nBoth strings\
  \ are equal\n\n输出-2（运行后）：\n\nEnter your first string: DR. RAJIV\n\nEnter your second\
  \ string: dr. rajiv\n\nBoth strings are not equal\n\n### IV. strcat() 函数\n\n`strcat()`\
  \ 函数将第二个参数的字符附加到第一个参数的末尾。\n\n语法\n\n```\nstrcat (str, str2);\n```\n\n在这里，字符串 `str2`\
  \ 的内容被附加到字符串 `str1` 上。\n\n例如，\n\n```c\n #include<stdio.h>\n#include<string.h>\n\
  main( )\n{\n   char str1[20], str2[20], str3[20];\n   printf(\"\\nEnter your first\
  \ string:\");\n   gets(str1);\n   printf(\"\\nEnter your second string:\");\n  \
  \ gets(str2);\n   strcpy(str3, str1);\n   strcat(str3, str2);\n   printf(“Concatenated\
  \ string is %s”, str3);\n}\n```\n\n输出（运行后）：\n\nEnter your first string: DR. RAJIV\n\
  \nEnter your second string: CHOPRA\n\nConcatenated string is: DR. RAJIVCHOPRA\n\n\
  ### V. strrev() 函数\n\n`strrev()` 函数反转字符串。\n\n语法\n\n```\nstrrev(str);\n```\n\n在这里，`str`\
  \ 的内容被反转。\n\n在继续之前，让我们写一个程序判断字符串是否为回文。\n\n示例 1：写一个程序判断一个字符串是否正反读都相同（回文）。\n\n```c\n\
  \ #include<stdio.h>\n#include<string.h>\nmain( )\n{\n   char name1[80], name2[80];\n\
  \   printf(\"\\nEnter your string:\");\n   gets(name1);\n   strcpy(name2, name1);\n\
  \   strrev(name2);\n   if (strcmp(name1, name2) == 0)\n      printf(“The string\
  \ is a palindrome”);\n   else\n      printf(“The string is not a palindrome”);\n\
  }\n```\n\n输出（运行后）：\n\nEnter your string: MADAM\n\nThe string is a palindrome\n\n\
  Enter your string: RAJIV\n\nThe string is not a palindrome\n\n### VI. strlwr() 和\
  \ strupr() 函数\n\n`strlwr()` 函数将字符串转换为小写，`strupr()` 函数将字符串转换为大写。\n\n语法\n\n```\nstrlwr(str);\n\
  strupr(str);\n```\n\n例如，\n\n```c\n #include<stdio.h>\n#include<string.h>\nmain(\
  \ )\n{\n   char name1[80], name2[80];\n   printf(\"\\nEnter your string:\");\n \
  \  gets(name1);\n   strcpy(name2, name1);\n   strlwr(name2);\n   printf(“Lower case\
  \ is %s”, name2);\n   /* strupr is not supported in all compilers */\n}\n```\n\n\
  输出（运行后）：\n\nEnter your string: Dr. Rajiv\n\nLower case is: dr. rajiv\n\n\n\n\n\n\
  ```c\nfor(i=0; i<6; i++)\n    scanf(\"\\n%s\", days[i]);\n```\n\n现在让我们写一个完整的程序，根据给定的星期几显示星期几名称。\n\
  \n```c\n #include<stdio.h>\nmain( )\n{\nchar days[7][10] = {\n         “MONDAY”,\n\
  \         “TUESDAY”,\n         “WEDNESDAY”,\n          “THURSDAY”,\n          “FRIDAY”,\n\
  \          “SATURDAY”,\n          “SUNDAY”\n         };\n int choice;\n printf(\"\
  \\nEnter any week day number:”);\n scanf(\"%d\", &choice);\n if ((choice >=1) &&\
  \ (choice <=7))\n printf(\"\\nYou have entered %s”, days[choice – 1]);\n else\n\
  \    printf(\"\\nYou have entered wrong number”);\n}\n```\n\n输出（运行后）：\n\nEnter any\
  \ week day number: 4\n\nYou have entered THURSDAY.\n\n我们现在可以编写一些程序了。\n\n## 示例 1：编写一个\
  \ C 程序来展示 C 中值传递（pass by value）的概念。然后使用引用传递（call by reference）的概念重写相同的程序。\n\n解决方案\
  \ 1：和其他任何参数（数据）一样，数组元素也可以通过值传递和引用传递。在值传递方法中，传递的是数组元素；而在引用传递中，传递的是数组元素的地址。我们现在来写这两个程序。\n\
  \n```c\n /* using pass by value or call by value in C */\n#include<stdio.h>\n#include<conio.h>\n\
  void main( )\n{\n   int m [ ] = {10, 20, 30, 40 50}, i;\n   clrscr( );\n   for(i\
  \ =0; i< 5; i++)\n      show(a[i]);\n   getch( );\n}\n   show (int marks)\n    {\n\
  \      printf(\"\\t%d”, marks);\n    }\n```\n\n输出（运行后）：\n\n10 20 30 40 50\n\n另一方面，在引用传递或引用传递中：\n\
  \n```c\n /* using pass by reference or call by reference in C */\n#include<stdio.h>\n\
  #include<conio.h>\nvoid main( )\n{\n   int m [ ] = {10, 20, 30, 40 50}, i;\n   clrscr(\
  \ );\n   for(i =0; i< 5; i++)\n      show(&a[i]);\n   getch( );\n}\n   show (int\
  \ *marks)\n    {\n      printf(\"\\t%d”, *marks);\n    }\n```\n\n输出（运行后）：\n\n10\
  \ 20 30 40 50\n\n## 示例 2：你将如何修改上面的程序以在 C 中传递整个数组？\n\n解决方案 2：程序如下：\n\n```c\n #include<stdio.h>\n\
  #include<conio.h>\nvoid main( )\n{\n   int a[ ] = {10, 20, 30, 40 50}, i;\n   clrscr(\
  \ );\n   show(a, 5); /* a 是数组的起始地址 */\n   getch( );\n}\nshow (int *a, int n)\n{\n\
  \   int i;\n   for (i=0; i<n++)\n    {\n      printf(\"\\t%d”, *a);\n      a ++;\n\
  \    }\n}\n```\n\n输出（运行后）：\n\n10 20 30 40 50\n\n## 示例 3：编写一个 C 程序使用冒泡排序法对整数数组进行排序。\n\
  \n解决方案 3：程序如下：\n\n```c\n #include<stdio.h>\n#include<conio.h>\nvoid main( )\n{\n\
  \   int a[10], i, j, temp;\n   clrscr( );\n   printf(\"\\nEnter the size of your\
  \ array:”);\n   scanf(\"%d”, &n);\n   printf(\"\\nEnter your elements:”);\n   for(i=0;\
  \ i<n++)\n    scanf(\"%d”, &a[i]);\n   printf(\"\\nEchoing array….\");\n   for(i\
  \ =0; i<n; i++)\n    printf(\"%d”, a[i]);\n   /*sorting now */\n   for(i =0; i<n;\
  \ i++)\n    for(j=1; j<n-1; j++)\n    if(a[i] > a[j])\n    {\n        temp = a[i];\n\
  \        a[i] = a[j];\n        a[j] = temp;\n    }\n    printf(\"\\n\\tThe sorted\
  \ array is:\");\n    for(i =0; i<n++)\n    printf(\"%d”, a[i]);\n    getch( );\n\
  }\n```\n\n输出（运行后）：\n\nEnter the size of your array: 10\n\nEnter your elements: 20\
  \ 10 40 50 30 60 70 80 100\n\nEchoing array…. 20 10 40 50 30 60 70 80 100\n\nThe\
  \ sorted array is 10 20 30 40 50 60 70 80 100\n\n### 示例 4：给出以下 C 代码的输出：\n\n```c\n\
  \ #include<stdio.h>\nmain( )\n{\n   int i, j, Num=1;\n   for (i =1; i <=10; i++)\n\
  \    {\n      for(j=1; j<10; j++)\n         Num +=1;\n      printf(\"%d\\n”, Num);\n\
  \    }\n}\n```\n\n解决方案 4：让我们通过干运行查看 `Num`、`i` 和 `j` 变量的内容：\n\n| Num | i | j |\n\
  | --- | --- | --- |\n| 1 | 1 | 1 |\n| 2 | 2 | 2 |\n| 3 | 3 | 3 |\n| .. | .. | ..\
  \ |\n| 99 | 99 | 99 |\n| 100 | 100 | 100 |\n| 101 | 101 | 101 |\n\n输出：\n\n10\n20\n\
  30\n40\n50\n60\n70\n80\n101\n\n### 示例 5：编写一个 C 程序使用数组求多项式。\n\n解决方案 5：程序如下：\n\n```c\n\
  \ #include<stdio.h>\nvoid main( )\n{\n    int a[40];\n    int x, n, i, res;\n  \
  \  printf(\"\\nEnter the maximum power of x: \\n\\t”);\n    scanf(\"%d”, &n); /*\
  \ 读取数组的最大大小 */\n    printf(\"\\nEnter the coefficients of the polynomial:\\n”);\n\
  \   for(i=0; i<=n; i++)\n    {\n      printf(\"\\nEnter coefficient of X^ %d = \\\
  t”, i);\n      scanf(\"%d”, &a[i]);\n    }\n   printf(\"\\nEnter the value of X=\
  \ \\t”);\n   scanf(\"%d”, &x);\n   /*计算多项式值 */\n   res = a[n];\n   for(i = n-1;\
  \ i >=0; i--)\n      res = res * x + a[i];\n   printf(\"\\nValue of polynomial =\
  \ %d\\n”, res);\n}\n```\n\n输出（运行后）：\n\nEnter the maximum power of x: 2\n\nEnter\
  \ the coefficients of the polynomial:\n\nEnter coefficient of X ^ 0 = 1\n\nEnter\
  \ coefficient of X ^ 1 = 2\n\nEnter coefficient of X ^ 2 = 3\n\nEnter the value\
  \ of X = 2\n\nValue of polynomial = 17\n\n## 示例 6：编写一个 C 程序将输入复制到输出，并将一个多个空格替换为一个空格。\n\
  \n解决方案 6：我们将使用 C 的 `getchar()` 和 `putchar()` 函数。\n\n### I. getchar 函数：`getchar();`\n\
  \n`getchar()` 函数从输入读取单个字符。它不接受参数并返回输入字符。通常，`getchar()` 的引用为：\n\n`variable = getchar();`\n\
  \n例如：\n\n`char c;`\n\n`c = getchar();`\n\n请注意，在使用 `getchar` 读取字符时遇到文件结束条件，将返回 `EOF`。\n\
  \n### II. putchar 函数：`putchar()`\n\n向标准输出打印或显示单个字符的标准函数称为 `putchar`。该函数接受一个要显示的字符作为参数。\n\
  \n例如：\n\n`putchar(variable);`\n\n或者\n\n`char var = '$';`\n\n`putchar(var);` 显示字符。\n\
  \n让我们先写算法：\n\n1：读取一个字符。\n\n2：如果输入的字符不是空格，则打印它。\n\n3：否则打印第一个空格并跳过所有后续空格。\n\n4：重复步骤\
  \ 1 到 3 直到输入的字符是换行符。\n\n程序如下：\n\n```c\n #include<stdio.h>\n#include<string.h>\n\
  void main( )\n{\n   char c;\n   printf(\"\\nEnter the text:\");\n   c= getchar();\n\
  \   printf(“The text is: “);\n   while (c!=‘\\n’)\n    {\n      if (c == ‘ ‘ ||\
  \ c == ‘\\t’)\n       {\n         c = ‘ ‘;\n         putchar( c );\n       }\n \
  \   while(c == ‘ ‘ || c == ‘\\t’)\n    {\n      c = getchar();\n    }\n  putchar(c\
  \ );\n  c = getchar();\n  }\n  printf(\"\\n”);\n}\n```\n\n输出（运行后）：\n\nDR. RAJIV\
  \ CHOPRA\n\nDR. RAJIV CHOPRA\n\n## 示例 7：编写一个 C 程序，在单维数组中按升序输入 N 个整数，然后对给定的键整数进行二分查找并显示适当的消息。\n\
  \n解决方案 7：让我们先写算法：\n\n1：读取数组大小 `n`。\n\n2：读取数组元素。\n\n3：读取要查找的键元素。\n\n4：如果键元素等于数组的中间元素，\n\
