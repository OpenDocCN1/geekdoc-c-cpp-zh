  当你完成文件操作后，必须关闭它。通过 `fclose()` 实现。\n\n语法（关闭文件）：\n\n`fclose(fp);`\n\n其中 `fp` 是与要关闭的文件关联的文件指针。始终关闭你打开的文件。这是一个良好的编程习惯。\n\
