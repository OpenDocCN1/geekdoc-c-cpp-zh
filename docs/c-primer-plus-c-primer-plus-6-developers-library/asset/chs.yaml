  \ 指针（基于你已经掌握的基础）以及查看它们与数组的关系\n\n![Image](img/squf.jpg) 编写处理数组的函数\n\n![Image](img/squf.jpg)\
  \ 二维数组\n\n人们依靠计算机处理诸如追踪每月开支、每日降量、季度销售额和每周体重等任务。企业依靠计算机来管理工资、库存和客户交易。作为一名程序员，你不可避免地需要处理大量的相关数据。通常，数组是高效、方便地处理此类数据的最佳方式。在第\
  \ 6 章“C 语言控制语句：循环”中，已经介绍了数组，而本章将对其进行更深入的探讨。特别是，它将审视如何编写处理数组的函数。此类函数允许你将模块化编程的优势扩展到数组。通过这样做，你可以看到数组和指针之间紧密的关系。\n\
  \n### 数组\n\n回想`array`（数组）由一系列相同数据类型的元素组成。你使用`declarations`（声明）来告诉编译器你何时想要数组。`array\
  \ declaration`（数组声明）告诉编译器数组包含多少个元素以及这些元素的类型是什么。有了这些信息，编译器就可以正确地设置数组。数组元素的类型与普通变量相同。考虑以下数组声明的示例：\n\
  \n点击此处查看代码图像\n\n```c\n/* some array declarations */\n\nint main(void)\n{\n   float\
  \ candy[365];      /* 365 个 float 型数组 */\n   char code[12];         /* 12 个 char\
  \ 型数组   */\n   int states[50];        /* 50 个 int 型数组   */\n   ...\n}\n```\n\n方括号\
  \ `[]` 标识 `candy` 以及其余部分为数组，括号内的数字表示数组中元素的数量。\n\n要访问数组中的元素，你通过其下标数字（也称为 `index`\
  \ 索引）来标识单个元素。编号从 0 开始。因此，`candy[0]` 是 `candy` 数组的第一个元素，而 `candy[364]` 是第 365 个也是最后一个元素。\n\
  \n这些都是老掉牙的内容；让我们学点新东西吧。\n\n#### 初始化\n\n数组通常用于存储程序所需的数据。例如，一个拥有 12 个元素的数组可以存储每个月的天数。在这种情况下，在程序开始时初始化数组是非常方便的。让我们看看是如何做的。\n\
  \n你知道可以在声明中使用表达式来对单值变量（有时称为 `scalar` 量变量）进行初始化，例如：\n\n```c\nint fix = 1;\nfloat\
  \ flax = PI * 2;\n```\n\n其中，希望 `PI` 在此之前已经定义为一个宏。C 语言使用新语法将初始化扩展到数组，如下所示：\n\n点击此处查看代码图像\n\
  \n```c\nint main(void)\n{\n    int powers[8] = {1,2,4,6,8,16,32,64}; /* ANSI C 及后续版本\
  \ */\n    ...\n}\n```\n\n如你所见，你通过使用花括号括逗号分隔的值列表来初始化数组。如果你愿意，可以在值和逗号之间使用空格。第一个元素（`powers[0]`）被赋值为值\
  \ `1`，依此类推。（如果你的编译器将这种初始化形式拒绝为语法错误，你可能在使用一个前 ANSI 时代的编译器。在数组声明前缀加上关键字 `static` 应该解决此问题。第\
  \ 12 章“存储存储类、链接和内存管理”讨论了该关键字的含义。）\n\n列表 10.1 展示了一个打印每个月天数的短程序。\n\n列表 10.1 day_mon1.c\
  \ 程序\n\n点击此处查看代码图像\n\n```c\n/* day_mon1.c -- 打印每个月的天数 */\n#include <stdio.h>\n#define\
  \ MONTHS 12\nint main(void)\n{\n    int days[MONTHS] = {31,28,31,30,31,30,31,31,30,31,30,31};\n\
  \    int index;\n    for (index = 0; index < MONTHS; index++)\n        printf(\"\
  Month %d has %2d days.\\n\", index + 1, days[index]);\n    return 0;\n}\n```\n\n\
  输出如下：\nMonth 1 has 31 days.\nMonth 2 has 28 days.\nMonth 3 has 31 days.\nMonth 4\
  \ has 30 days.\nMonth 5 has 31 days.\nMonth 6 has 30 days.\nMonth 7 has 31 days.\n\
  Month 8 has 31 days.\nMonth 9 has 30 days.\nMonth 10 has 31 days.\nMonth 11 has\
  \ 30 days.\nMonth 12 has 31 days.\n\n这并不是一个完美的程序，但它每四年中有一个月份是错误的。程序使用逗号分隔的值列表初始化\
  \ `days[]`。注意，此示例使用了符号常量 `MONTHS` 来表示数组大小。这是一种常见且推荐的做法。例如，如果世界切换到 13 个月的日历，你只需要修改\
  \ `#define` 语句而不需要追踪每个使用数组的地方。\n\n#### 在数组上使用 `const`\n\n有时你可能会使用一个意图为只读的数组。也就是说，程序将从数组中检索值，但不会尝试向数组中写入新值。在这种情况下，你可以也应该在声明和初始化数组时使用\
  \ `const` 关键字。因此，对于列表 10.1，更好的选择是点击此处查看代码图像\n\n```c\nconst int days[MONTHS] = {31,28,31,30,31,30,31,31,30,31,30,31};\n\
  ```\n\n这使得数组中的每个元素都是常量。一旦你了解了这一点，我们就可以在后续示例中使用 `const`。\n\n如果你没有初始化数组会发生什么？列表 10.2\
  \ 显示了。\n\n列表 10.2 no_data.c 程序\n\n点击此处查看代码图像\n\n```c\n/* no_data.c -- 未初始化的数组 */\n\
  #include <stdio.h>\n#define SIZE 4\nint main(void)\n{\n    int no_data[SIZE];  /*\
  \ 未初始化的数组 */\n    int i;\n    printf(\"%2s%14s\\n\", \"i\", \"no_data[i]\");\n \
  \   for (i = 0; i < SIZE; i++)\n        printf(\"%2d%14d\\n\", i, no_data[i]);\n\
  \    return 0;\n}\n```\n\n这是示例输出（你的结果可能会不同）：\ni           no_data[i]\n0        \
  \            0\n1          204937\n2          219854\n3          147348\n\n数组成员就像普通变量——如果你不初始化它们，它们可能有任何值。编译器被允许直接使用内存位置上已经存在的值，这就是为什么你的结果可能与这些不同。\n\
  \n注意：存储类注意事项\n\n数组像其他变量一样，可以使用不同的`存储类`创建。第 12 章调查了这个主题，但目前你应该意识到本章描述的是属于自动存储类的数组。这意味着它们是在函数内部声明的且没有使用\
  \ `static` 关键字。到目前为止书中使用的所有变量和数组都是自动类型的。\n\n现在提到存储类的原因是，不同的存储类具有不同的属性，因此你不能将本章所有内容推广到其他存储类。特别是，某些其他存储类的变量和数组如果未初始化，其内容将被设置为\
  \ `0`。\n\n列表中的项数应该与数组的大小相匹配。但如果你数错了呢？让我们再次尝试上一个示例，如列表 10.3 所示，使用一个短了两个列表。\n\n列表\
  \ 10.3 somedata.c 程序\n\n点击此处查看代码图像\n\n```c\n/* some_data.c -- 部分初始化的数组 */\n```\n\
  \n\n\n\n\n```c\n#include <stdio.h>\n\n#define SIZE 4\n\nint main(void)\n{\n    int\
  \ some_data[SIZE] = {1492, 1066};\n    int i;\n    printf(\"%2s%14s\\n\",\n    \
  \        \"i\", \"some_data[i]\");\n    for (i = 0; i < SIZE; i++)\n        printf(\"\
  %2d%14d\\n\", i, some_data[i]);\n    return 0;\n}\n```\n\n这次的输出看起来如下：\n\n```\ni\
  \  some_data[i]\n0           1492\n1           1066\n2               0\n3      \
  \         0\n```\n\n你可以看到，编译器并没有问题。当列表中的值用尽时，它会将剩余元素初始化为 `0`。也就是说，如果你完全不初始化一个数组，它的元素会像未初始化的普通变量一样得到垃圾值；但如果你对数组进行了部分初始化，剩余元素将被设置为\
  \ `0`。\n\n如果你提供的列表值过多，编译器就不不那么宽容了。这种过度慷慨被认为是一个错误。然而，你没有让自己置于编译器的嘲笑之中。相反，你可以通过省略大括号中的大小，让编译器将数组大小匹配到列表（参见列表\
  \ 10.4）。\n\n列表 10.4 day_mon2.c 程序\n\n点击此处查看代码图像\n\n```c\n/* day_mon2.c -- 让编译器计算元素\
  \ */\n#include <stdio.h>\n\nint main(void)\n{\n    const int days[] = {31,28,31,30,31,30,31,31,30,31};\n\
  \    int index;\n    for (index = 0; index < sizeof days / sizeof days[0]; index++)\n\
  \        printf(\"Month %2d has %d days.\\n\", index +1,\n               days[index]);\n\
  \    return 0;\n}\n```\n\n在列表 10.4 中需要注意两个主要点：\n\n1. ![Image](img/squf.jpg) 当你使用空括号初始化数组时，编译器会计算列表中项目的数量，并创建一个同样大小的数组。\n\
  2. ![Image](img/squf.jpg) 注意我们在 `for` 循环控制语句中所做的。由于（理所当然地）不相信自己正确计数的能力，我们让计算机告诉我们数组的大小。`sizeof`\
  \ 运算符给出其后对象（或*类型*）的大小，以字节为单位。因此，`sizeof days` 是整个数组的大小（字节），而 `sizeof days[0]` 是单个元素的大小（字节）。通过将整个数组的大小除以单个元素的大小，我们就能知道数组中有多少个元素。\n\
  \n这是运行该程序的结果：\n\n```\nMonth  1 has 31 days.\nMonth  2 has 28 days.\nMonth  3 has\
  \ 31 days.\nMonth  4 has 30 days.\nMonth  5 has 31 days.\nMonth  6 has 30 days.\n\
  Month  7 has 31 days.\nMonth  8 has 31 days.\nMonth  9 has 30 days.\nMonth 10 has\
  \ 31 days.\n```\n\n哎！我们只输入了 10 个值，但我们让程序寻找数组大小的方法防止了我们尝试打印数组边界之外的内容。这指出了自动计数的一个潜在缺点：元素数量的错误可能被遗漏。\n\
  \n还有另一种初始化数组的简短方法。然而，因为它只适用于字符字符串，我们将它留到下一章。\n\n### 指定初始化器 (C99)\n\nC99 增加了一项新功能：*指定初始化器*（designated\
  \ initializers）。此功能允许你挑选要初始化哪些元素。例如，假设你只想初始化数组中的最后一个元素。使用传统的 C 初始化语法时，你还必须初始化最后一个元素之前的每一个元素：\n\
  \n点击此处查看代码图像\n\n```c\nint arr[6] = {0,0,0,0,212}; // 传统语法\n```\n\n在 C99 中，你可以使用括号中的索引来指定特定元素：\n\
  \n点击此处查看代码图像\n\n```c\nint arr[6] = {[5] = 212}; // 将 arr[5] 初始化为 212\n```\n\n与普通初始化一样，在初始化至少一个元素后，未初始化的元素将被设置为\
  \ `0`。列表 10.5 显示了一个更复杂的示例。\n\n列表 10.5 designate.c 程序\n\n点击此处查看代码图像\n\n```c\n// designate.c\
  \ -- 指定初始化器\n#include <stdio.h>\n#define MONTHS 12\nint main(void)\n{\n    int days[MONTHS]\
  \ = {31,28, [4] = 31,30,31, [1] = 29};\n    int i;\n    for (i = 0; i < MONTHS;\
  \ i++)\n        printf(\"%2d %d\\n\", i + 1, days[i]);\n    return 0;\n}\n```\n\n\
  如果编译器支持 C99，输出如下：\n\n```\n1  31\n2  29\n3  0\n4  0\n5  31\n6  30\n7  31\n8  0\n\
  9  0\n10 0\n11 0\n12 0\n```\n\n输出揭示了指定初始化器的几个重要特征。首先，如果代码在指定初始化器后紧跟着更多值，如 `[4] =\
  \ 31,30,31`，则这些后续值将用于初始化后续元素。也就是说，在初始化 `days[4]` 为 `31` 之后，代码将 `days[5]` 和 `days[6]`\
  \ 分别初始化为 `30` 和 `31`。其次，如果代码多次初始化同一个元素，则最后一次初始化生效。例如，在列表 10.5 中，如果代码遵循指定初始化器并带有后续值，如\
  \ `[4] = 31,30,31`，这些后续值将用于初始化后续元素。也就是说，在初始化 `days[4]` 为 `31` 之后，代码将 `days[5]` 和\
  \ `days[6]` 分别初始化为 `30` 和 `31`。其次，如果代码多次初始化同一个元素，则最后一次初始化生效。\n\n*(注：由于原文文本在此处出现大量重复和中断，翻译已根据逻辑进行了合并处理)*\n\
  \n\n\n\n\n```c\nprintf(\"address of arr[-1]: %p\\n\", &arr[-1]);\nprintf(\"address\
  \ of arr[4]:  %p\\n\", &arr[4]);\nprintf(\"address of value1:  %p\\n\", &value1);\n\
  printf(\"address of value2:  %p\\n\", &value2);\nreturn 0;\n}\n```\n\n编译器并不会检查索引是否有效。使用错误索引的结果在\
  \ C 语言标准术语中是“未定义的”（undefined）。这意味着当你运行程序时，它看起来可能正常工作，可能运行得很奇怪，也可能会终止。以下是使用 GCC 的示例输出：\n\
  \n点击此处查看代码图片\n\n```\nvalue1 = 44, value2 = 88\n-1  -1\n0  1\n1  3\n2  5\n3  7\n\
  4  9\n5  1624678494\n6  32767\nvalue1 = 9, value2 = -1\naddress of arr[-1]: 0x7fff5fbff8cc\n\
  address of arr[4]:  0x7fff5fbff8e0\naddress of value1:  0x7fff5fbff8e0\naddress\
  \ of value2:  0x7fff5fbff8cc\n```\n\n注意，这个编译器似乎将 `value1` 存储在数组之后，将 `value2` 存储在数组之前。（其他编译器可能会在内存中以不同的顺序存储数据。）在这种情况下，如输出所示，`arr[-1]`\
  \ 与 `value2` 对应相同的内存位置，而 `arr[4]` 与 `value1` 对应相同的位置。因此，使用越界的数组索引会导致程序修改其他变量的值。另一个编译器可能会产生不同的结果，包括导致程序终止。\n\
  \n你可能会奇怪为什么 C 语言允许这种糟糕事情的发生。这归根于 C 语言“信任程序员”的哲学。不检查边界允许 C 程序运行得更快。编译器并不一定能发现所有的索引错误，因为索引的值可能在生成的程序开始执行后才能确定。因此，为了安全，编译器必须在运行时添加额外的代码来检查每个索引的值，这会减慢速度。所以\
  \ C 信任程序员能够正确编写代码，并以更快的程序作为奖励。当然，并不是所有的程序员都值得这种信任，这时问题就会随之产生。\n\n记住的一个简单点是数组编号从\
  \ 0 开始。一个需要培养的简单习惯是在数组声明以及其他使用数组大小的地方符号常量：\n\n```c\n#define SIZE 4\n\nint main(void)\n\
  {\n    int arr[SIZE];\n    for (i = 0; i < SIZE; i++)\n    ....\n```\n\n这有助于确保你在整个程序中始终使用相同的数组大小。\n\
  \n### 指定数组大小\n\n到目前为止，示例在声明数组时使用了整数常量：\n\n点击此处查看代码图片\n\n```c\n#define SIZE 4\n\n\
  int main(void)\n{\n    int arr[SIZE];     // 符号整数常量\n    double lots[144];  // 字面量整数常量\n\
  \    ...\n```\n\n还有什么是允许的？在 C99 标准之前，答案是你在声明数组时必须在方括号内使用`常量整数表达式`（constant integer\
  \ expression）。常量整数表达式是由整数常量构成的。出于这个目的，`sizeof` 表达式被视为整数常量，但（与 C++ 情况不同）`const` 值不是。此外，表达式的值必须大于\
  \ 0：\n\n点击此处查看代码图片\n\n```c\nint n = 5;\nint m = 8;\nfloat a1[5];               //\
  \ 是\nfloat a2[5*2 + 1];         // 是\nfloat a3[sizeof(int) + 1];  // 是\nfloat a4[-4];\
  \              // 否，大小必须 >0\nfloat a5[0];               // 否，大小必须 >0\nfloat a6[2.5];\
  \             // 否，大小必须是整数\nfloat a7[(int)2.5];        // 是，将 float 强制转换为 int\n\
  float a8[n];              // C99 之前不允许\nfloat a9[m];               // C99 之前不允许\n\
  ```\n\n正如注释所示，遵循 C90 标准的 C 编译器不允许最后两个声明。然而，从 C99 开始，C 语言允许它们，但它们创建了一种新数组，称为`变长数组`（variable-length\
  \ array），简称 `VLA`。（C99 使 VLA 变为可选，而非强制性。）\n\nC99 引入变长数组主要是为了让 C 成为一种更好的数值计算语言。例如，VLA\
  \ 使得更容易将现有的 FORTRAN 数值例程转换为 C。VLA 有一些限制；例如，你不能在声明中初始化 VLA。在本章在你学习了足够关于经典数组的局限性知识后，我们会回到\
  \ VLA。\n\n### 多维数组\n\nTemp Cloud 想要分析五年的月雨量数据。最初的决定之一是如何表示这些数据。一种选择是使用 60 个变量，每个项目一个。（我们之前提到过一次，这在当时和现在都是毫无意义。）使用一个包含\
  \ 60 个元素的数组会有改进，但如果她能研究 50 年的雨量而不是 5 年，那就更好了。她需要更好的方法。\n\n更好的方法是使用数组的数组。主数组将有 5\
  \ 个元素，每个元素代表一年。其中每个元素又是一个 12 元素的数组，每个元素代表一个月。以下是这样声明一个数组的方法：\n\n点击此处查看代码图片\n\n```c\n\
  float rain[5][12]; // 5 个包含 12 个 float 的数组数组\n```\n\n查看此声明的一种方法是先看内部部分（加粗部分）：\n\n\
  点击此处查看代码图片\n\n```c\nfloat rain[5][12]; // rain 是一个包含 5 个元素的数组\n```\n\n它告诉我们 `rain`\
  \ 是一个具有 5 个元素的数组。但这些元素各是什么呢？现在看声明的剩余部分（现在加粗）：点击此处查看代码图片\n\n```c\nfloat rain[5][12];\
  \ // rain 是 12 个 float 的数组\n```\n\n这告诉我们每个元素的类型都是 `float[12]`；也就是说，`rain` 的五个元素中的每一个都是\
  \ 12 元素的数组。\n\n按照这个逻辑，`rain[0]` 作为 `rain` 的第一个元素，是一个 12 元素的数组。`rain[1]`、`rain[2]`\
  \ 等也是如此。如果 `rain[0]` 是一个数组，它的第一个元素是 `rain[0][0]`，第二个元素是 `rain[0][1]`，以此此类推。简而言之，`rain`\
  \ 是一个包含 12 元素数组数组，`rain[0][0]` 是一个 `float`。要访问，例如第 2 行第 3 列的值，使用 `rain[2][3]`。（记住，数组计数从\
  \ 0 开始，所以第 2 行是第三行。）\n\n你也可以将 `rain` 数组可视化为一个由五行、每行十二列组成的二维数组，如图 10.1](#ch10.html_ch10fig01）所示。通过更改第二个下标，你可以按月份沿行移动。通过更改第一个下标，你可以按年份沿列移动。\n\
  \n![Image](img/10fig01.jpg)\n\n图 10.1 二维数组。\n\n\n\n\n\n/* 多年降雨数据的平均值 */\n\n```c\n\
  #include <stdio.h>\n\n#define MONTHS 12    // 一年的月份数\n\n#define YEARS   5    //数据的年份\n\
  \nint main(void)\n{\n //// 初始化 2010 - 2014 年的降雨数据\n    const float rain[YEARS][MONTHS]\
  \ =\n    {\n        {4.3,4.3,4.3,3.0,2.0,1.2,0.2,0.2,0.4,2.4,3.5,6.6},\n       \
  \ {8.5,8.2,1.2,1.6,2.4,0.0,5.2,0.9,0.3,0.9,1.4,7.3},\n        {9.1,8.5,6.7,4.3,2.1,0.8,0.2,0.2,1.1,2.3,6.1,8.4},\n\
  \        {7.2,9.9,8.4,3.3,1.2,0.8,0.4,0.0,0.6,1.7,4.3,6.2},\n        {7.6,5.6,3.8,2.8,3.8,0.2,0.0,0.0,0.0,1.3,2.6,5.2}\n\
  \    };\n\n    int year, month;\n    float subtot, total;\n    printf(\" YEAR  \
  \   RAINFALL  (inches)\\n\");\n    for (year = 0, total = 0; year < YEARS; year++)\n\
  \    {               // 每年，累加每个月的降雨量\n         for (month = 0, subtot = 0; month\
  \ < MONTHS; month++)\n             subtot += rain[year][month];\n\n         printf(\"\
  %5d %15.1f\\n\", 2010 + year, subtot);\n\n         total += subtot; // 所有年份的总计\n\
  \    }\n    printf(\"\\nThe yearly average is %.1f inches.\\n\\n\",\n          \
  \     total/YEARS);\n    printf(\"MONTHLY AVERAGES:\\n\\n\");\n    printf(\" Jan\
  \  Feb  Mar  Apr  May  Jun  Jul  Aug  Sep  Oct \");\n    printf(\" Nov  Dec\\n\"\
  );\n    for (month = 0; month < MONTHS; month++)\n    {               // 每个月，累加多年的降雨量\n\
  \         for (year = 0, subtot = 0; year < YEARS; year++)\n             subtot\
  \ += rain[year][month];\n\n         printf(\"%4.1f \", subtot/YEARS);\n    }\n \
  \   printf(\"\\n\");\n    return 0;\n}\n```\n\n***\n\n这里是输出：\n\n点击此处查看代码图像\n\n \
  \ YEAR     RAINFALL  (inches)\n  2010             32.4\n  2011             37.9\n\
  \  2012             49.8\n  2013             44.0\n  2014             32.9\n\n年平均值为\
  \ 39.4 英寸。\n\n每月平均值：\n\n Jan  Feb  Mar  Apr  May  Jun  Jul  Aug  Sep  Oct  Nov \
  \ Dec\n  7.3  7.3  4.9  3.0  2.3  0.6  1.2  0.3  0.5  1.7  3.6  6.7\n\n在你学习这个程序时，请关注初始化和计算。在这部分中，初始化更为复杂，所以让我们先看较简单的部分（计算）。要找到特定年份的总和，保持\
  \ `year` 不变，并让 `month` 遍历其范围。这是第一部分的内部 `for` 循环。然后对 `year` 的下一个值重复此过程。这是第一部分的外部循环。这种嵌套循环结构对于处理二维数组来说是而然的。一个循环处理第一个下标，另一个循环处理第二个下标：\n\
  \n点击此处查看代码图像\n```c\nfor (year = 0, total = 0; year < YEARS; year++)\n{         \
  \      // 处理每一年\n     for (month = 0, subtot = 0; month < MONTHS; month++)\n   \
  \      subtot += rain[year][month]; // 处理每个月\n```\n\n程序的第二部分具有相同的结构，但现在内部循环改变的是\
  \ `month`，外部循环改变的是 `year`。记住，外部循环每循环一次，内部循环就会完成其全部配额。因此，这种安排在更改月份之前会遍历所有年份。你得到了第一个月的五年平均值，依此类推：\n\
  \n点击此处查看代码图像\n```c\nfor (month = 0; month < MONTHS; month++)\n{               //\
  \ 处理每个月\n     for (year = 0, subtot = 0; year < YEARS; year++)\n         subtot\
  \ += rain[year][month]; // 处理每一年\n```\n\n### 初始化二维数组\n\n初始化二维数组是在初始化一维数组技术的基础上的。首先，回想初始化一维数组的形式如下：\n\
  \n点击此处查看代码图像\n```c\nsometype ar1[5] = {val1, val2};\n```\n\n在这里，`val1`、`val2` 等都是与\
  \ `sometype` 对应的值。例如，如果 `sometype` 是 `int`，`val1` 可能是 `7`；或者如果 `sometype` 是 `double`，`val1`\
  \ 可能是 `1.3`。但 `rain` 是一个拥有五个元素的数组，每个元素都是 `12 个 float 数组`。因此，对于 `rain`，`val1` 应该是初始化一个\
  \ `float` 一维数组的值，如下：\n\n点击此处查看代码图像\n```c\n{4.3,4.3,4.3,3.0,2.0,1.2,0.2,0.2,2.4,3.5,6.6}\n\
  ```\n\n也就是说，如果 `sometype` 是 `12 个 double 数组`，`val1` 就是 12 个 `double` 值的列表。因此，我们需要五个这样的逗号分隔的列表来初始化一个二维数组，如\
  \ `rain`：\n\n点击此处查看代码图像\n```c\nconst float rain[YEARS][MONTHS] =\n{\n    {4.3,4.3,4.3,3.0,2.0,1.2,0.2,0.2,2.4,3.5,6.6},\n\
  \    {8.5,8.2,1.2,1.6,2.4,0.0,5.2,0.9,0.3,0.9,1.4,7.3},\n    {9.1,8.5,6.7,4.3,2.1,0.8,0.2,0.2,1.1,2.3,6.1,8.4},\n\
  \    {7.2,9.9,8.4,3.3,1.2,0.8,0.4,0.0,0.6,1.7,4.3,6.2},\n    {7.6,5.6,3.8,2.8,3.8,0.2,0.0,0.0,0.0,1.3,2.6,5.2}\n\
  };\n```\n\n这种初始化使用了五组数字列表，都包含在一层大括号内。第一组内部括号中的数据分配给数组的第一行，第二组内部括号的数据分配给第二行，依此类推。我们讨论的关于数据与数组大小不匹配的规则适用于每一行。也就是说，如果第一个内部括号包含了\
  \ 10 个数字，那么只有第一行的前 10 个元素受影响。该行的最后两个元素默认初始化为零。如果数字过多，则会错误；数字不会被推入下一行。\n\n你可以省略内部括号，只保留最外层的括号。只要条目正确，效果是相同的。但如果条目不足，数组将按行填充，直到数据耗尽。剩余元素将初始化为\
  \ `0`。图 10.2 显示了初始化数组的两种方法。\n\n![Image](img/10fig02.jpg)\n\n图 10.2 初始化数组的两种方法。\n\
  \n由于 `rain` 数组包含不应被修改的数据，程序在声明数组时使用了 `const` 修饰符。\n\n### 更多维度\n\n关于二维数组的所有内容都可以推广到三维数组及更多。你可以这样声明一个三维数组：\n\
  \n```c\nint box[10][20][30];\n```\n\n你可以将一维数组想象为行，二维数组想象为表格，而三维数组想象为一堆数据表。例如，你可以将\
  \ `box` 数组想象成堆叠的 10 个二维数组（每个 20×30）。\n\n思考 `box` 的另一种方式是数组的数组的数组。也就是说，它是一个 10 元素的数组，每个元素都是一个\
  \ 20 元素的数组。每个 20 元素的数组又有 30 元素的数组元素。或者，你可以简单地根据所需的索引数量来考虑数组。\n\n通常，你会使用三个嵌套循环来处理三维数组，使用四个嵌套循环来处理四维数组，依此类推。我们在示例中坚持两个维度。\n\
  \n### 指针与数组\n\n指针，正如你可能从第 9 章 回想的那样，“函数](#ch09.html_ch09)”，提供了一种使用地址的符号方法。由于计算机的硬件指令高度依赖地址，指针使你能够以接近机器自身表达的方式来表达自己。这种对应关系使得带有指针的程序非常高效。特别是指针提供了一种处理数组的高效方法。事实上，正如你看到的，数组表示仅仅是指针的伪装用法。\n\
  \n这种伪装用法的一个例子是数组名也是数组第一个元素的地址。也就是说，如果 `flizny` 是一个数组，那么以下是成立：\n\n点击此处查看代码图像\n```\n\
  \n\n\n\n\n`flizny == &flizny[0];` // 数组名是第一个元素的地址\n\n`flizny` 和 `&flizny[0]` 都代表该第一个元素的内存地址。（回想一下\
  \ `&` 是地址操作符。）它们都是`常量`，因为它们在程序运行期间保持不变。然而，它们可以作为值赋值给指针`变量` `variable`，而且你可以更改变量的值，如\
  \ 列表 10.8 所示。注意看当你给指针加上一个数字时，指针的值发生了什么。（回想一下，指针的 `%p` 格式说明符通常显示十六进制值。）\n\n#### 列表\
  \ 10.8 pnt_add.c 程序\n\n点击此处查看代码图片\n\n```c\n// pnt_add.c -- 指针加法\n\n#include <stdio.h>\n\
  \n#define SIZE 4\n\nint main(void)\n{\n    short dates [SIZE];\n    short * pti;\n\
  \    short index;\n    double bills[SIZE];\n    double * ptf;\n    pti = dates;\
  \     // 将数组地址赋值给指针\n    ptf = bills;\n    printf(\"%23s %15s\\n\", \"short\", \"\
  double\");\n    for (index = 0; index < SIZE; index ++)\n        printf(\"pointers\
  \ + %d: %10p %10p\\n\",\n               index, pti + index, ptf + index);\n\n  \
  \  return 0;\n}\n```\n\n这里是示例输出：\n\n点击此处查看代码图片\n\n```text\nshort           double\n\
  pointers + 0: 0x7fff5fbff8dc 0x7fff5fbff8a0\npointers + 1: 0x7fff5fbff8de 0x7fff5fbff8a8\n\
  pointers + 2: 0x7fff5fbff8e0 0x7fff5fbff8b0\npointers + 3: 0x7fff5fbff8e2 0x7fff5fbff8a8\n\
  ```\n\n第二行打印了两个数组的起始地址，下一行给出了地址加 1 的结果，依此类推。请记住，地址是十六进制的，所以 `dd` 比 `dc` 大 1，`a1`\
  \ 比 `a0` 大 1。但我们在这里看到了什么？\n\n点击此处查看代码图片\n\n`0x7fff5fbff8dc + 1` 等于 `0x7fff5fbff8de`？\n\
  `0x7fff5fbff8a0 + 1` 等于 `0x7fff5fbff8a8`？\n\n看起来很蠢？像狐狸一样！我们的系统是按字节寻址的，但 `short`\
  \ 类型使用 2 个字节，而 `double` 类型使用 8 个字节。这里发生的情况是，当你说“给指针加 1”时，C 会增加一个`storage unit`（存储单元）。对于数组来说，这意味着地址增加到了下一个`element`\
  \ 的地址，而不仅仅是下一个字节（参见图 10.3）。这就是为什么你必须声明指针指向的对象类型。仅有地址是不够的，因为计算机需要知道存储该对象使用了多少字节。（即使对于指向标量变量的指针也是如此；否则获取值的\
  \ `*pt` 操作将无法正常工作。）\n\n![Image](img/10fig03.jpg)\n\n图 10.3 数组与指针加法。\n\n现在我们可以更清楚地定义什么是指向`int`\
  \ 的指针、指向`float` 的指针或指向任何其他数据对象的指针：\n\n![Image](img/squf.jpg) 指针的值是它所指向对象的地址。地址在内部的表示方式取决于硬件。包括\
  \ PC 和 Mac 在内的许多计算机都是字节寻址的，这意味着内存中的每个字节都是按顺序编号的。在这里，大型对象（例如 `double` 类型变量）的地址通常是该对象第一个字节的地址。\n\
  \n![Image](img/squf.jpg) 对指针应用 `*` 运算符会得到所指向对象存储的值。\n\n![Image](img/squf.jpg) 将指针加\
  \ 1 会根据指向类型的大小（以字节为单位）增加其值。\n\n由于 C 语言的巧妙，我们有了以下等式：\n\n点击此处查看代码图片\n\n`dates + 2\
  \ == &date[2]` // 地址相同\n`*(dates + 2) == dates[2]` // 值相同\n\n这些关系总结了数组和指针之间紧紧的联系。这意味着你可以使用指针来识别数组的单个元素并获取它的值。本质上，我们对同一种事物使用了两种不同的表示法。事实上，C\
  \ 语言用指针来描述数组表示法。也就是说，它定义 `ar[n]` 为 `*(ar + n)`。你可以将第二个表达式理解为“前往内存位置 `ar`，移动 `n`\
  \ 个单位，并检索值”。\n\n顺便说，不要混淆 `*(dates+2)` 和 `*dates+2`。间接符 `*` 的优先级比 `+` 高，所以后者意味着 `(*dates)+2`：\n\
  \n点击此处查看代码图片\n\n`*(dates+2)` 与 `*dates+2` 的混淆\n\n数组与指针之间的关系总结了它们之间紧紧的联系。这意味着你可以使用指针来识别数组的单个元素并获取它的值。本质上，我们对同一种事物使用了两种不同的表示法。事实上，C\
  \ 语言用指针来描述数组表示法。也就是说，它定义 `ar[n]` 为 `*(ar + n)`。你可以将第二个表达式理解为“前往内存位置 `ar`，移动 `n`\
  \ 个单位，并检索值”。\n\n### 函数、数组与指针\n\n假设你想要写一个处理数组的函数。例如，假设你需要一个返回数组元素和的函数。假设 `marbles`\
  \ 是一个 `int` 数组。函数调用看起来像什么样？记住，数组名是第一个元素的地址，所以实际参数 `marbles` 作为 `int` 的地址，应该赋值一个指向\
  \ `int` 的形式参数：\n\n点击此处查看代码图片\n\n```c\ntotal = sum(marbles); // 可能的函数调用\n```\n\n\
  原型应该是什么样？\n\n```c\nint sum(int * ar); // 对应的原型\n```\n\n`sum()` 从这个参数中得到了什么信息？它得到了数组第一个元素的地址，并且它了解到在该位置会找到一个\
  \ `int`。注意，这些信息并没有说明数组中元素的数量。我们面临两种将该信息传递函数的选择。第一种选择是在函数中硬编码固定的数组大小：\n\n点击此处查看代码图片\n\
  \n```c\nint sum(int * ar) // 对应的定义\n{\n    int i;\n    int total = 0;\n    for(\
  \ i = 0; i < 10; i++) // 假设有 10 个元素\n        total += ar[i]; // ar[i] 等于 *(ar +\
  \ i)\n    return total;\n}\n```\n\n在这里，我们利用了这样一个事实：正如你可以对数组使用指针表示法，也可以对指针使用数组表示法。此外，回想\
  \ `+=` 操作会将右侧操作数的值加到左侧操作数上。因此，`total` 是元素的累加。\n\n这个函数定义具有局限性；它只适用于具有 10 个元素的 `int`\
  \ 数组。更灵活的方法是将数组大小作为第二个参数传递：\n\n\n\n\n\n点击此处查看代码图像\n\n```c\nint sum(int * ar, int\
  \ n)  // 更通用的方法\n{\n    int i;\n    int total = 0;\n    for( i = 0; i < n; i++)\
  \   // 使用 n 个元素\n        total += ar[i];      // ar[i] 等于 *(ar + i)\n    return\
  \ total;\n}\n```\n\n在这里，第一个参数告诉函数去哪里寻找数组以及数组中数据的类型，第二个参数告诉函数存在多少个元素。\n\n关于函数参数，还有一点需要说明。在函数原型或函数定义头头部的语境下，*仅*在那种语境下，你可以用\
  \ `int ar[]` 替换 `int * ar`：\n\n```c\nint sum (int ar[], int n);\n```\n\n`int * ar`\
  \ 形式始终意味着 `ar` 的类型为指向 `int` 的指针。`int ar[]` 形式也意味着 `ar` 的类型为指向 `int` 的指针，但*仅*在用于声明形式参数时如此。这种设计的意图是，第二种形式提醒读者，`ar`\
  \ 不仅指向一个 `int`，而且指向一个作为数组元素的 `int`。\n\n***\n\n### 注意：声明数组参数\n\n由于数组名是第一个元素的地址，因此数组名的实际参数要求与之匹配的形式参数必须是一个指针。在这种语境下，且仅在此种语境下，C\
  \ 将 `int ar[]` 解释为与 `int * ar` 相同；即，`ar` 的类型为指向 `int` 的指针。由于原型允许你省略名称，以下四个原型均是等价的：\n\
  \n```c\nint sum(int *ar, int n);\nint sum(int *, int);\nint sum(int ar[], int n);\n\
  int sum(int [], int);\n```\n\n你不能在函数定义中省略名称，因此对于定义而言，以下两种形式是等价的：\n\n```c\nint sum(int\
  \ *ar, int n)\n{\n    // 代码在此处\n}\n\nint sum(int ar[], int n)\n{\n    // 代码在此处\n\
  }\n```\n\n你应该能够在使用这里显示的两个定义中的任何一个时，使用这四个原型中的任意一个。\n\n列表 10.10 显示了一个使用 `sum()` 函数的程序。为了指出数组参数的一个有趣事实，程序还打印了原始数组的大小以及代表数组的函数参数的大小。（如果你的编译器不支持用于打印\
  \ `sizeof` 值的 `%zd` 格式符，请使用 `%u` 或 `%lu`。）\n\n列表 10.10 sum_arr1.c 程序\n\n点击此处查看代码图像\n\
  \n***\n\n```c\n// sum_arr1.c -- 求数组元素的和\n// 如果 %zd 不起作用，请使用 %u 或 %lu\n#include <stdio.h>\n\
  #define SIZE 10\n\nint sum(int ar[], int n);\n\nint main(void)\n{\n    int marbles[SIZE]\
  \ = {20,10,5,39,4,16,19,26,31,20};\n    long answer;\n    answer = sum(marbles,\
  \ SIZE);\n    printf(\"The total number of marbles is %ld.\\n\", answer);\n    printf(\"\
  The size of marbles is %zd bytes.\\n\",\n            sizeof marbles);\n    return\
  \ 0;\n}\n\nint sum(int ar[], int n) // 数组有多大？\n{\n    int i;\n    int total = 0;\n\
  \    for( i = 0; i < n; i++)\n        total += ar[i];\n    printf(\"The size of\
  \ ar is %zd bytes.\\n\", sizeof ar);\n    return total;\n}\n```\n\n***\n\n在我们系统上的输出看起来如下：\n\
  点击此处查看代码图像\n\n```\nThe size of ar is 8 bytes.\nThe total number of marbles is 190.\n\
