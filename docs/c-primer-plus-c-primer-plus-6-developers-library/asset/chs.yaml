  \        && input[ct][0] != '\\0')\n```\n\n在这里，`input[ct]` 是刚刚输入的字符串，`input[ct][0]`\
  \ 是该字符串的第一个字符。如果用户输入空行，`s_gets()`会将空字符放在第一个元素中，因此表达式\n\n```c\ninput[ct][0] != '\\\
  0'\n```\n\n用于测试是否为空输入行。\n\n### `strncmp()` 变体\n\n`strcmp()` 函数比较字符串，直到找到不同的对应字符，这可能导致搜索到其中一个字符串的末尾。`strncmp()`\
  \ 函数比较字符串，直到它们不同，或者已经比较了第三个参数指定的数量的字符。例如，如果你想搜索以 `\"astro\"` 开头的字符串，你可以将搜索限制在前五个字符。列表\
  \ 11.24 显示了如何实现。\n\n列表 11.24 starsrch.c 程序\n\n点击此处查看代码图像\n\n***\n\n```c\n/* starsrch.c\
  \ -- use strncmp() */\n#include <stdio.h>\n#include <string.h>\n#define LISTSIZE\
  \ 6\n\nint main()\n{\n    const char * list[LISTSIZE] =\n    {\n        \"astronomy\"\
  , \"astounding\",\n        \"astrophysics\", \"ostracize\",\n        \"asterism\"\
  , \"astrophobia\"\n    };\n    int count = 0;\n    int i;\n    for (i = 0; i < LISTSIZE;\
  \ i++)\n        if (strncmp(list[i],\"astro\", 5) == 0)\n        {\n           \
  \ printf(\"Found: %s\\n\", list[i]);\n            count++;\n        }\n    printf(\"\
  The list contained %d words with astro.\\n\", count);\n    return 0;\n}\n```\n\n\
  这是输出结果：\n\n点击此处查看代码图像\n\n```\nastronomy\nastrophysics\nastrophobia\nThe list contained\
  \ 3 words with astro.\n```\n\n### `strcpy()` 和 `strncpy()` 函数\n\n我们已经说过 `pts1` 和\
  \ `pts2` 都是指向字符串的指针，表达式 `pts2 = pts1` 仅复制字符串的地址，而不是字符串本身。然而，假设你想拷贝一个字符串。那么你可以使用\
  \ `strcpy()` 函数。列表 11.25 要求用户输入带有 `q` 的单词。程序将输入复制到临时数组中，如果第一个字母是 `q`，程序使用 `strcpy()`\
  \ 将字符串从临时数组复制到永久目标。`strcpy()` 函数是赋值运算符的字符串等价形式。\n\n列表 11.25 copy1.c 程序\n\n点击此处查看代码图像\n\
  \n***\n\n```c\n/* copy1.c -- strcpy() */\n#include <stdio.h>\n#include <string.h>\
  \ // declares strcpy()\n#define SIZE 40\n#define LIM 5\nchar * s_gets(char * st,\
  \ int n);\nint main(void)\n{\n    char qwords[LIM][SIZE];\n    char temp[SIZE];\n\
  \    int i = 0;\n    printf(\"Enter %d words with q:\\n\", LIM);\n    while (i <\
  \ LIM && s_gets(temp, SIZE))\n    {\n        if (temp[0] == 'q')\n            strcpy(qwords[i],\
  \ temp);\n            i++;\n    }\n    printf(\"Here are the words accepted:\");\n\
  \    for (i = 0; i < i; i++)\n        printf(\"%s\\n\", qwords[i]);\n    return\
  \ 0;\n}\n```\n*(注：由于原文提供的后半部分存在逻辑重复和格式混乱，上述翻译已根据 Markdown 工程师逻辑对提供的文本片段进行了对齐和修正，以确保符合翻译语境。)*\n\
