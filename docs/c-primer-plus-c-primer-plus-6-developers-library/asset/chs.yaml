  \n*(注：由于用户提供的文本后续部分存在大量重复和截断，此处仅对已提供的有效内容进行翻译)*\n\n\n\n\n\n```c\n*pc = 92.99;  \
  \             // ok -- 修改了 rates[0]\n```\n\n这种指针仍然可以用于修改值，但它只能指向最初分配给它的位置。\n\n最后，你可以使用两次\
  \ `const` 来创建一个指针，该指针既不能改变它所指向的位置，也不能改变它所指向的值：\n\n点击此处查看代码图像\n\n```c\ndouble rates[5]\
  \ = {88.99, 100.12, 59.45, 183.11, 340.5};\n\nconst double * const pc = rates;\n\
  \npc = &rates[2];             // 不允许\n\n*pc = 92.99;               // 不允许\n```\n\
  \n### 指针与多维数组\n\n指针与多维数组之间是什么关系？你又可能需要了解这些？处理多维数组的函数是通过指针完成的，因此在处理此类函数之前，你需要一些指针的背景知识。关于第一个问题，让我们现在看一些示例来找到答案。为了简化讨论，我们使用一个小型数组。假设你有如下声明：\n\
  \n点击此处查看代码图像\n\n```c\nint zippo[4][2];  /* 一个 int 类型的数组的数组 */\n```\n\n那么 `zippo`\
  \ 作为一个数组的名称，是该数组第一个元素的地址。在这种情况下，`zippo` 的第一个元素本身是一个包含两个 `int` 的数组，因此 `zippo` 是一个包含两个\
  \ `int` 的数组的地址。让我们从指针属性的角度进一步分析：\n\n![Image](img/squf.jpg) 因为 `zippo` 是数组第一个元素的地址，所以\
  \ `zippo` 的值与 `&zippo[0]` 相同。接下来，`zippo[0]` 本身是一个包含两个整数的数组，所以 `zippo[0]` 的值与 `&zippo[0][0]`\
  \ 相同，即其第一个元素（一个 `int` 类型）的地址。简而言之，`zippo[0]` 是一个 `int` 大小对象的地址，而 `zippo` 是一个两个 `int`\
  \ 大小对象的地址。因为整数和两个整数的数组从相同的位置开始，所以 `zippo` 和 `zippo[0]` 具有相同的数值。\n\n![Image](img/squf.jpg)\
  \ 给指针或地址加 1 会得到一个比所引用对象大大的值。在这方面，`zippo` 和 `zippo[0]` 是不同的，因为 `zippo` 指向一个两个 `int`\
  \ 大小的对象，而 `zippo[0]` 指向一个一个 `int` 大小的对象。因此，`zippo + 1` 的值与 `zippo[0] + 1` 不同。\n\n\
  ![Image](img/squf.jpg) 对指针或地址进行解引用（应用 `*` 运算符或带有索引的 `[]` 运算符）会得到所引用对象代表的值。因为 `zippo[0]`\
  \ 是其第一个元素（`zippo[0][0]`）的地址，所以 `*(zippo[0])` 代表存储在 `zippo[0][0]` 中的值，一个 `int` 值。同样，`*zippo`\
  \ 代表其第一个元素 `zippo[0]` 的值，但 `zippo[0]` 本身是一个 `int` 的地址。它是地址 `&zippo[0][0]`，所以 `*zippo`\
  \ 是 `&zippo[0][0]`。对两个表达式应用解引用运算符意味着 `**zippo` 等于 `*&zippo[0][0]`，这化简为 `zippo[0][0]`，一个\
  \ `int`。简而言之，`zippo` 是地址的地址，必须解引用两次才能得到普通值。地址的地址或指针的指针是*双重间接*的例子。\n\n显然，增加数组维度的数量会增加指针视图的复杂性。到此时，大多数\
  \ C 语言学生开始意识到为什么指针被认为是该语言最困难的方面之一。你可能想仔细研究前面的点，并看看它们在 列表 10.15 中是如何说明的，该列表显示了一些地址值和数组内容。\n\
  \n列表 10.15 zippo1.c 程序\n\n点击此处查看代码图像\n\n```c\n/* zippo1.c --  zippo 信息 */\n\n#include\
  \ <stdio.h>\n\nint main(void)\n{\n    int zippo[4][2] = { {2,4}, {6,8}, {1,3}, {5,\
  \ 7} };\n\n    printf(\"   zippo = %p,  zippo + 1 = %p\\n\", zippo, zippo + 1);\n\
  \    printf(\"   zippo[0] = %p, zippo[0] + 1 = %p\\n\", zippo[0], zippo[0] + 1);\n\
  \    printf(\"   *zippo = %p,  *zippo + 1 = %p\\n\", *zippo, *zippo + 1);\n    printf(\"\
  \   zippo[0][0] = %d\\n\", zippo[0][0]);\n    printf(\"   *zippo[0] = %d\\n\", *zippo[0]);\n\
  \    printf(\"   **zippo = %d\\n\", **zippo);\n    printf(\"   zippo[2][1] = %d\\\
  n\", zippo[2][1]);\n    printf(\"   (*(zippo+2) + 1) = %d\\n\", *(*(zippo+2) + 1));\n\
  \    return 0;\n}\n```\n\n* *\n\n这里是某个系统上的输出：\n\n点击此处查看代码图像\n\n```\nzippo = 0x0064fd38,\
  \  zippo + 1 = 0x0064fd40\nzippo[0] = 0x0064fd38, zippo[0] + 1 = 0x0064fd3c\n*zippo\
  \ = 0x0064fd38, *zippo + 1 = 0x0064fd3c\n```\n\n\n\n你首先应用括号，使得 `pax` 成为包含两个某个元素的数组。接下来，你应用\
  \ `*`，使得 `pax` 成为包含两个指针的数组。最后，使用 `int`，使得 `pax` 成为两个指向 `int` 指针的数组。这种声明创建了*两个*指向单个\
  \ `int` 的指针，但原始版本使用括号先应用 `*`，创建了*一个*指向包含两个 `int` 的数组的指针。列表 10.16 显示了你如何像像使用原始数组一样使用这种指针。\n\
  \n### 列表 10.16 zippo2.c 程序\n\n点击此处查看代码图像\n\n* *\n\n```c\n/* zippo2.c --  通过指针变量获取\
  \ zippo 信息 */\n\n#include <stdio.h>\n\nint main(void)\n{\n    int zippo[4][2] =\
  \ { {2,4}, {6,8}, {1,3}, {5, 7} };\n    int (*pz)[2];\n    pz = zippo;\n    printf(\"\
  \    pz = %p,    pz + 1 = %p\\n\",\n               pz,           pz + 1);\n    printf(\"\
  pz[0] = %p, pz[0] + 1 = %p\\n\",\n               pz[0],      pz[0] + 1);\n    printf(\"\
  \  *pz = %p,  *pz + 1 = %p\\n\",\n               *pz,        *pz + 1);\n    printf(\"\
  pz[0][0] = %d\\n\", pz[0][0]);\n    printf(\"  *pz[0] = %d\\n\", *pz[0]);\n    printf(\"\
  \    **pz = %d\\n\", **pz);\n    printf(\"      pz[2][1] = %d\\n\", pz[2][1]);\n\
  \    printf(\"*(*(pz+2) + 1) = %d\\n\", *(*(pz+2) + 1));\n    return 0;\n}\n```\n\
  \n* *\n\n这里是新的输出：\n\n点击此处查看代码图像\n\n`pz = 0x0064fd38,  pz + 1 = 0x0064fd40`\n`pz[0]\
  \ = 0x0064fd38, pz[0] + 1 = 0x0064fd3c`\n`*pz = 0x0064fd38,  pz + 1 = 0x0064fd3c`\n\
  `pz[0][0] = 2`\n`*pz[0] = 2`\n`**pz = 2`\n`pz[2][1] = 3`\n`*(*(pz+2) + 1) = 3`\n\
  \n同样，你可能会得到不同的地址，但关系是相同的。正如所承诺的，你可以使用像 `pz[2][1]` 这样的符号，尽管 `pz` 是一个指针而不是数组名。更通地说，你可以使用数组表示或指针表示来表示单个元素：\n\
  \n点击此处查看代码图像\n\n`zippo[m][n] == *(*(zippo + m) + n)`\n`pz[m][n] == *(*(pz + m) +\
  \ n)`\n\n#### 指针兼容性\n\n将一个指针赋值另一个指针的规则比数值类型的规则更严格。例如，你可以在不使用类型转换的情况下将 `int` 值赋值给\
  \ `double` 变量，但对这些类型的指针不能相同的操作：\n\n点击此处查看代码图像\n\n```c\nint n = 5;\ndouble x;\nint\
  \ * p1 = &n;\ndouble * pd = &x;\nx = n; // 隐式转换\npd = p1; // 编译错误\n```\n\n这些限制扩展到了更复杂的类型。假设我们有以下声明：\n\
  \n点击此处查看代码图像\n\n```c\nint * pt;\nint (*pa)[3];\nint ar1[2][3];\nint ar2[3][2];\n\
  int **p2; // 指向指针的指针\n```\n\n那么我们有以下内容：\n\n点击此处查看代码图像\n\n```c\npt = &ar1[0][0];\
  \ // 都是指向 int 的指针\npt = ar1[0];    // 都是指向 int 的指针\npt = ar1;       // 无效\npa =\
  \ ar1;       // 都是指向 int[3] 的指针\npa = ar2;       // 无效\np2 = &pt;       // 都是指向\
  \ int *\n*p2 = ar2[0];   // 都是指向 int 的指针\np2 = ar2;       // 无效\n```\n\n注意，无效赋值涉及两个没有指向相同类型的指针。例如，`pt`\
  \ 指向单个 `int`，但 `ar1` 指向一个包含三个 `int` 的数组。同样，`pa` 指向一个包含两个 `int` 的数组，因此它与 `ar1` 兼容，但与\
  \ `ar2` 不兼容（`ar2` 指向一个包含两个 `int` 的数组）。\n\n最后两个例子有些棘手。变量 `p2` 是一个指向指针的 int 指针，而 `ar2`\
  \ 是一个指向包含两个 `int` 的数组的指针（或者更简洁地说，指向 `int[2]`）。因此，`p2` 和 `ar2` 的类型不同，你不能将 `ar2` 赋值给\
  \ `p2`。但 `*p2` 的类型是指向 `int`，这使其与 `ar2[0]` 兼容。记住 `ar2[0]` 是指向其第一个元素 `ar2[0][0]` 的指针，使得\
  \ `ar2[0]` 的类型也是指向 `int`。\n\n通常情况下，多级间接非常棘手。例如，考虑下一个代码段：\n\n点击此处查看代码图像\n\n```c\n\
  int x = 20;\nconst int y = 23;\nint * p1 = &x;\nconst int * p2 = &y;\nconst int\
  \ ** pp2;\np1 = p2;  // 不安全 -- 将常量赋值\n```\n\n\n\n然而，这种方法丢失了行和列的信息。在这个应用程序（求总和）中，这些信息并不重要，但假设每行代表一年，每列代表一个月。那么你可能需要一个函数来，比如，计算每一列的总和。在这种情况下，函数应该具备行和列信息。这可以通过声明正确的形式变量来实现，以便函数能够正确地传递数组。在这种情况下，数组\
  \ `junk` 是一个包含三个四个 `int` 数组的数组。正如前面的讨论所示，这意味着 `junk` 是一个指向包含四个 `int` 的数组的指针。你可以像这样声明这种类型的函数参数：\n\
  \n```c\nvoid somefunction( int (* pt)[4] );\n```\n\n或者，如果（且仅当）`pt` 是一个函数的形式参数时，你可以如下声明它：\n\
  \n```c\nvoid somefunction( int pt[][4] );\n```\n\n注意第一组括号是空的。空括号将 `pt` 标识为指针。该变量就可以像使用\
  \ `junk` 一样的方式使用。这就是我们在下一个示例中所做的，该示例位于列表 10.17。注意该列表展示了原型语法的三个等效替代方案。\n\n### 列表\
  \ 10.17 array2d.c 程序\n\n点击此处查看代码图像\n\n```c\n// array2d.c -- 用于二维数组的函数\n\n#include\
  \ <stdio.h>\n\n#define ROWS 3\n\n#define COLS 4\n\nvoid sum_rows(int ar[][COLS],\
  \ int rows);\n\nvoid sum_cols(int [][COLS], int );    // 允许省略变量名\n\nint sum2d(int\
  \ (*ar)[COLS], int rows); // 另一种语法\n\nint main(void)\n{\n    int junk[ROWS][COLS]\
  \ = {\n            {2,4,6,8},\n            {3,5,7,9},\n            {12,10,8,6}\n\
  \    };\n    sum_rows(junk, ROWS);\n    sum_cols(junk, ROWS);\n    printf(\"Sum\
  \ of all elements = %d\\n\", sum2d(junk, ROWS));\n    return 0;\n}\n\nvoid sum_rows(int\
  \ ar[][COLS], int rows)\n{\n    int r;\n    int c;\n    int tot;\n    for (r = 0;\
  \ r < rows; r++)\n    {\n        tot = 0;\n        for (c = 0; c < COLS; c++)\n\
  \            tot += ar[r][c];\n        printf(\"row %d: sum = %d\\n\", r, tot);\n\
  \    }\n}\n\nvoid sum_cols(int ar[][COLS], int rows)\n{\n    int r;\n    int c;\n\
  \    int tot;\n    for (c = 0; c < COLS; c++)\n    {\n        tot = 0;\n       \
  \ for (r = 0; r < rows; r++)\n            tot += ar[r][c];\n        printf(\"col\
  \ %d: sum = %d\\n\", c, tot);\n    }\n}\n\nint sum2d(int ar[][COLS], int rows)\n\
  {\n    int r;\n    int c;\n    int tot = 0;\n    for (r = 0; r < rows; r++)\n  \
  \      for (c = 0; c < COLS; c++)\n            tot += ar[r][c];\n    return tot;\n\
  }\n```\n\n输出如下：\n```\nrow 0: sum = 20\nrow 1: sum = 24\nrow 2: sum = 36\ncol 0:\
  \ sum = 17\ncol 1: sum = 19\ncol 2: sum = 21\ncol 3: sum = 23\nSum of all elements\
  \ = 80\n```\n\n列表 10.17 中的程序将名称 `junk` 作为参数传递，它是指向第一个元素（一个子数组）的指针，以及代表行数 `3` 的符号常量\
  \ `ROWS`。每个函数随后都将 `ar` 视为一个包含四个 `int` 数组的数组。列数是内置在函数中的，但行数是留开放的。如果传递 12 作为行数，那么该函数将同样适用于例如\
  \ 12×4 的数组。这是因为 `rows` 是元素的数量；然而，由于每个元素都是数组（或行），`rows` 变变成了行数。\n\n注意 `ar` 的使用方式与\
  \ `junk` 在 `main()` 中的使用方式相同。这是可能的，因为 `ar` 和 `junk` 是相同类型：指向包含四个 `int` 的数组的指针。\n\
  \n请注意以下声明将无法正常工作：\n\n点击此处查看代码图像\n```c\nint sum2(int ar[][], int rows); // 错误的声明\n\
  ```\n\n回想编译器会将数组表示法转换为指针表示法。这意味着，例如 `ar[1]` 将变为 `ar+1`。为了让编译器计算此项，它需要知道 `ar` 指向的对象的大小。声明：\n\
  \n点击此处查看代码图像\n```c\nint sum2(int ar[][4], int rows); // 有效声明\n```\n\n表示 `ar` 指向一个四个\
  \ `int` 的数组（在我们的系统上是一个 16 字节的对象），因此 `ar+1` 意味着“增加 16 字节”。对于空括号版本，编译器将不知道该做什么。\n\n\
  你也可以在另一组括号中包含大小，所示，但编译器会忽略它：\n\n点击此处查看代码图像\n```c\nint sum2(int ar[3][4], int rows);\
  \ // 有效声明，3 被忽略\n```\n\n这对于使用 `typedef` 的人非常方便（在第 5 章](#ch05.html_ch05)“[运算符、表达式和语句]”中提到，并在第\
  \ 14 章](#ch14.html_ch14)“[结构体和其他数据形式]”中讨论过）：\n\n点击此处查看代码图像\n```c\ntypedef int arr4[4];\
  \           // arr4 是包含四个 int 的数组\ntypedef arr4 arr3x4[3];\n```\n\n### 变长数组 (VLAs)\n\
  \n如果你真的想创建一个可以处理任意尺寸二维数组的单一函数，你可以做到，但这样做很麻烦。（你必须将数组作为一维数组传递，并让函数计算每行的起始位置。）此外，这种技术与\
  \ FORTRAN 子程序的配合并不顺畅，因为 FORTRAN 允许在函数调用时指定两个维度。\n\n这种需求是 C99 引入变长数组的主要动力，变长数组允许你在定义数组时使用变量。例如，你可以这样做：\n\
  \n```c\nint quarters = 4;\n\nint regions = 5;\n```\n\n\n\n\n```c\ndouble sales[regions][quarters];\
  \ // 一个 VLA\n```\n\n如前提到的，VLA 有一些限制。它们需要具有自动存储类（automatic），这意味着它们要么是在函数内部声明的，且不使用\
  \ `static` 或 `extern` 存储类修饰符（第 12 章），要么作为函数参数。此外，你不能在声明时初始化它们。最后，在 C11 中，VLA 是一个可选特性而不是强制性特性，就像在\
  \ C99 中那样。\n\n***\n\n### 注意：VLA 不改变大小\n\n变变长度数组（variable-length array）中的 `variable`\
  \ 一词并不意味着你可以在创建数组后修改其长度。一旦创建，VLA 就会保持相同的大小。`variable` 一词的真实含义是，在第一次创建数组时，指定数组维度可以使用变量。\n\
  \n***\n\n由于 VLA 是语言中新增的特性，目前对它们的支持还不完全。让我们来看一个简单的示例，它展示了如何编写一个能够和任意两个 `int` 二维数组内容的函数。\n\
  \n首先，这里是声明一个带有二维 VLA 参数的函数的方法：\n\n点击此处查看代码图像\n\n```c\nint sum2d(int rows, int cols,\
  \ int ar[rows][cols]);  // ar 是 VLA\n```\n\n注意，前两个参数（`rows` 和 `cols`）被用声明数组参数 `ar`\
  \ 的维度。因为 `ar` 的声明使用了 `rows` 和 `cols`，它们在参数列表中必须在 `ar` 之前声明。因此，下面的原型函数是错误的：\n\n点击此处查看代码图像\n\
  \n```c\nint sum2d(int ar[rows][cols], int rows, int cols); // 顺序无效\n```\n\nC99/C11\
  \ 标准说你可以省略原型函数中的名称；但在那种情况下，你需要用星号替换省略的维度：\n\n点击此处查看代码图像\n\n```c\nint sum2d(int,\
  \ int, int ar[*][*]);  // ar 是 VLA，名称已省略\n```\n\n第二，这里是定义函数的方法：\n\n点击此处查看代码图像\n\n\
  ```c\nint sum2d(int rows, int cols, int ar[rows][cols])\n{\n    int r;\n    int\
  \ c;\n    int tot = 0;\n    for (r = 0; r < rows; r++)\n        for (c = 0; c <\
  \ cols; c++)\n            tot += ar[r][c];\n    return tot;\n}\n```\n\n除了新的函数头外，该函数与经典\
  \ C 版本函数（列表 10.17）的唯一区别是常量 `COLS` 被变量 `cols` 替换了。函数头中变变长度数组的存在使得这种变化成为可能。此外，拥有同时代表行数和列数的变量使我们能够对任何尺寸的\
  \ `int` 二维数组使用新的 `sum2d()`。列表 10.18 阐释了这一点。然而，它需要一个实现了 VLA 特性的 C 编译器。它还证明了这个基于 VLA\
  \ 的函数可以用于传统的 C 数组，也可以用于变变长度数组。\n\n列表 10.18 vararr2d.c 程序\n\n点击此处查看代码图像\n\n***\n\n\
  ```c\n//vararr2d.c -- 使用 VLA 的函数\n\n#include <stdio.h>\n\n#define ROWS 3\n#define\
  \ COLS 4\n\nint sum2d(int rows, int cols, int ar[rows][cols]);\n\nint main(void)\n\
  {\n    int i, j;\n    int rs = 3;\n    int cs = 10;\n    int junk[ROWS][COLS] =\
  \ {\n        {2,4,6,8},\n        {3,5,7,9},\n        {12,10,8,6}\n    };\n    int\
  \ morejunk[ROWS-1][COLS+2] = {\n        {20,30,40,50,60,70},\n        {5,6,7,8,10}\n\
  \    };\n    int varr[rs][cs]; // VLA\n    for (i = 0; i < rs; i++)\n        for\
  \ (j = 0; j < cs; j++)\n            varr[i][j] = i + j;\n    printf(\"3x5 array\\\
  n\");\n    printf(\"Sum of all elements = %d\\n\", sum2d(ROWS, COLS, junk));\n \
  \   printf(\"2x6 array\\n\");\n    printf(\"Sum of all elements = %d\\n\", sum2d(ROWS-1,\
  \ COLS+2, morejunk));\n    printf(\"3x10 VLA\\n\");\n    printf(\"Sum of all elements\
  \ = %d\\n\", sum2d(rs, cs, varr));\n    return 0;\n}\n// 带有 VLA 的函数\nint sum2d(int\
  \ rows, int cols, int ar[rows][cols])\n{\n    int r;\n    int c;\n    int tot =\
  \ 0;\n    for (r = 0; r < rows; r++)\n        for (c = 0; c < cols; c++)\n     \
  \       tot += ar[r][c];\n    return tot;\n}\n```\n\n\n\n[content]\n\n就像在初始化命名数组时可以省略数组大小一样，你可以在复合字面量（compound\
  \ literal）中省略它，编译器会自动统计其中元素的个数：\n\n点击此处查看代码图片\n\n```c\n(int []){50, 20, 90} // 一个包含\
  \ 3 个元素的复合字面量\n```\n\n由于这些复合字面量是没有名字的，你不能仅仅在一个语句中创建它们并在之后使用。相反，你必须在创建它们时以某种方式使用它们。一种方法是使用指针来跟踪位置。也就是说，你可以这样操作：\n\
  \n```c\nint * pt1;\n\npt1 = (int [2]) {10, 20};\n```\n\n注意，该字面常量被识别为 `int` 数组。就像数组名一样，它被转换为第一个元素的地址，因此它可以赋值给指向\
  \ `int` 的指针。然后你可以在之后使用该指针。例如，在这种情况下，`*pt1` 值为 10，而 `pt1[1]` 值为 20。\n\n你可以对复合字面量做的另一件事是将其作为实际参数传递给具有匹配形式形式参数的函数：\n\
  \n点击此处查看代码图片\n\n```c\nint sum(const int ar[], int n);\n\n...\n\nint total3;\n\n\
  total3 = sum((int []){4,4,4,5,5,5}, 6);\n```\n\n在这里，第一个参数是一个包含六个元素的 `int` 数组，它的作用类似于第一个元素的地址，正如数组名所做的那样。这种在无需预先创建数组的情况下向函数传递信息的方法是复合字面量的典型用途。\n\
  \n你可以将该技术扩展到二维数组及更高维。例如，这里是是如何创建一个 `int` 二维数组并存储其地址的：\n\n点击此处查看代码图片\n\n```c\nint\
  \ (*pt2)[4]; // 声明一个指向包含 4 个 int 数组的数组的指针\n\npt2 = (int [2][4]) { {1,2,3,-9}, {4,5,6,-8}\
  \ };\n```\n\n在这里，类型是 `int [2][4]`，一个 2×4 的 `int` 数组。\n\n列表 10.19 将这些示例整合到了完整的程序中。\n\
  \n列表 10.19 `flc.c` 程序\n\n点击此处查看代码图片\n\n```c\n// flc.c -- 看起来奇怪的常量\n\n#include <stdio.h>\n\
  \n#define COLS 4\n\nint sum2d(const int ar[][COLS], int rows);\n\nint sum(const\
  \ int ar[], int n);\n\nint main(void)\n{\n    int total1, total2, total3;\n    int\
  \ * pt1;\n    int (*pt2)[COLS];\n    pt1 = (int [2]) {10, 20};\n    pt2 = (int [2][COLS])\
  \ { {1,2,3,-9}, {4,5,6,-8} };\n    total1 = sum(pt1, 2);\n    total2 = sum2d(pt2,\
  \ 2);\n    total3 = sum((int []){4,4,4,5,5,5}, 6);\n    printf(\"total1 = %d\\n\"\
  , total1);\n    printf(\"total2 = %d\\n\", total2);\n    printf(\"total3 = %d\\\
  n\", total3);\n    return 0;\n}\n\nint sum(const int ar[], int n)\n{\n    int i;\n\
  \    int total = 0;\n    for( i = 0; i < n; i++)\n        total += ar[i];\n    return\
  \ total;\n}\n\nint sum2d(const int ar[][COLS], int rows)\n{\n    int r;\n    int\
  \ c;\n    int tot = 0;\n    for (r = 0; r < rows; r++)\n        for (c = 0; c <\
  \ COLS; c++)\n            tot += ar[r][c];\n    return tot;\n}\n```\n\n你需要一个接受此\
  \ C99 扩展的编译器（并非所有编译器都支持）。以下是输出：\n\n```\ntotal1 = 30\ntotal2 = 4\ntotal3 = 27\n```\n\
  \n请记住，复合字面量是提供临时所需值的手段。它具有块作用（block scope），这个概念在第 12 章中有所介绍。这意味着一旦程序执行离开定义复合字面量的块（即包含定义的最内层大括号），它的存在就不无法保证了。\n\
  \n### 核心概念\n\n当你需要存储许多相同类型的项时，数组可能是答案。C 将数组称为*派生类型*（derived types），因为它们是构建在其他类型上的。也就是说，你并不是简单地声明一个数组。相反，你声明的是\
  \ `int` 数组或 `float` 数组或其他某种类型的数组。该其他类型本身也可以是数组类型，在这种情况下，你就得到了数组的数组，即二维数组。\n\n你通常会编写函数来处理数组。数组与指针之间的关系是紧密的，你可以使用数组表示法或指针表示法。C\
  \ 解释数组名为指向第一个元素的地址。因此，数组名等于第一个元素的指针。通常，数组和指针是紧密相连的。如果 `ar` 是一个数组，那么表达式 `ar[i]` 和\
  \ `*(ar + i)` 是等价的。\n\n### 总结\n\n*数组*是相同类型元素的集合。数组元素按顺序存储，并通过偏移量（offset）访问。在 C 中，数组第一个元素的索引为\
  \ `0`，因此包含 `n` 个元素的数组的最后一个元素索引为 `n - 1`。声明一个简单的一维数组使用以下格式：\n\n`type name[size];`\n\
  \n这里 `type` 是元素的数据类型，`name` 是数组名，`size` 是元素个数。传统上，C 要求 `size` 必须是常量表达式。C99/C11 允许使用非常量整数表达式；在这种情况下，数组是变长数组。\n\
  \n*二维数组*表示数组的数组。例如，声明\n\n`double sales[5][12];`\n\n创建一个名为 `sales` 的数组，它包含五个元素，每个元素都是包含\
  \ 12 个 `double` 的数组。这些一维数组中的第一个可以称为 `sales[0]`，第二个称为 `sales[1]`，依此类推，每个都是包含 12 个\
  \ `double` 的数组。使用第二个索引来访问这些数组中的特定元素。\n\n\n\n\n将多维数组传递给函数的传统 C 方法是将数组名（这是一个地址）传递给一个类型匹配的指针参数。该指针的声明除了第一个维度外，还应指定数组的所有其他维度；第一个参数的维度通常作为第二个参数传递。例如，为了处理前面提到的\
  \ `sales` 数组，函数原型和函数调用将如下所示：\n\n点击此处查看代码图片\n\n```\nvoid display(double ar[][12],\
  \ int rows);\n```\n\n```\ndisplay(sales, 5);\n```\n\n变变长度数组提供了第二种语法，可以将两个数组维度都作为参数传递。在这种情况下，函数原型和函数调用将如下所示：\n\
  \n点击此处查看代码图片\n\n```\nvoid display(int rows, int cols, double ar[rows][cols]);\n\
  ```\n\n```\ndisplay(5, 12, sales);\n```\n\n我们在讨论中使用了 `int` 数组和 `double` 数组，但相同的概念也适用于其他类型。然而，字符字符串有很多特殊规则。这源于字符串末尾的空字符为函数提供了一种在不传递长度的情况下检测字符串结束的方法。我们将在第\
  \ 11 章“字符字符串和字符串函数](#ch11.html_ch11)”中详细介绍字符字符串。\n\n### 复习题\n\n你可以在附录 A“复习题答案](#app01.html_app01)”找到复习题的答案。\n\
