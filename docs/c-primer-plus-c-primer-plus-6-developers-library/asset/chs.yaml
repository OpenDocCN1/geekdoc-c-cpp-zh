  \ `sum_line` 是截至为止队列的累计长度。\n\n想一下如果这段代码中散布着 `malloc()` 和 `free()` 函数以及指向节点的指针，它看起来会变得多么混乱和晦涩。使用队列包让你能够专注于模拟问题，而不是编程细节。\n\
