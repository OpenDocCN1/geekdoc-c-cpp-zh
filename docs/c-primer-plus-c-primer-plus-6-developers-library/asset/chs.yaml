  Disma Lapoult: \"Chicken of the Andes\" ($29.99)\nDone.\n\n列表 14.1 中创建的结构包含三个部分（称为成员或字段）：一个用于存储标题，一个用于存储作者，一个用于存储价值。这些是你必须掌握的三项技能：\n\
