  \n## 14. 完成编程练习 13，但使用变长数组函数参数。\n\n## 11. 字符字符串和字符串函数\n\n你将在本章中学习以下内容：\n\n![Image](img/squf.jpg)\
  \ 函数：\n\n点击此处查看代码图像\n\n`gets()`, `gets_s()`, `fgets()`, `puts()`, `fputs()`, `strcat()`,\
  \ `strncat()`, `strcmp()`, `strncmp()`, `strcpy()`, `strncpy()`, `sprintf()`, `strchr()`\n\
  \n![Image](img/squf.jpg) 创建和使用字符串\n\n![Image](img/squf.jpg) 使用 C 库中的多个字符串和字符函数并创建自己的字符串函数\n\
  \n![Image](img/squf.jpg) 使用命令行参数\n\n字符串是 C 语言中最实用和重要的数据类型之一。你一直都在使用字符字符串，但关于它们仍有很多东西需要学习。C\
  \ 库提供了广泛的函数用于读取和写入字符串、复制字符串、比较字符串、合并字符串、搜索字符串等。本章将这些能力增加到你的编程技能。\n\n### 字符串的表示和字符串\
  \ I/O\n\n当然，你已经知道最基本的事实：*字符字符串*是一个以空字符（`\\0`）终止的 `char` 数组。因此，你学过的关于数组和指针的知识同样适用于字符串。但由于字符串使用非常频繁，C\
  \ 提供了许多专门为处理字符串设计的函数。本章将讨论字符串的本质、如何声明和初始化字符串、如何将它们读入输出程序以及如何操作字符串。\n\n让我们来看一个短程序（参见\
  \ Listing 11.1），它说明了在程序中表示字符串的一些方法。\n\nListing 11.1 strings1.c 程序\n\n点击此处查看代码图像\n\
  \n* *\n\n```c\n//  strings1.c\n\n#include <stdio.h>\n\n#define MSG \"I am a symbolic\
  \ string constant.\"\n\n#define MAXLENGTH 81\n\nint main(void)\n{\n    char words[MAXLENGTH]\
  \ = \"I am a string in an array.\";\n    const char * pt1 = \"Something is pointing\
  \ at me.\";\n    puts(\"Here are some strings:\");\n    puts(MSG);\n    puts(words);\n\
  \    puts(pt1);\n    words[8] = 'p';\n    puts(words);\n    return 0;\n}\n```\n\n\
  * *\n\n`puts()` 函数与 `printf()` 一样属于 `stdio.h` 输入输出族。它显示字符串，与 `printf()` 不同，它会自动在字符串末尾添加换行符。输出如下：\n\
  \n点击此处查看代码图像\n\nHere are some strings:\nI am a string constant.\nI am a string in\
  \ an array.\nSomething is pointing at me.\n\n与其逐行阅读 11.1，我们采用一种更全面的方法。首先，我们将查看如何定义字符串。然后我们将学习如何将字符串读入程序。最后，我们将输出字符串。\n\
  \n#### 在程序中定义字符串\n\n正如你在阅读 11.1 时可能注意到的，有许多定义字符串的方法。我们需要字符串，主要方法包括使用字符串常量、使用 `char`\
  \ 数组以及使用 `char` 指针。\n\n##### 字符串字面量（字符串常量）\n\n*字符串字面量*也称为*字符串常量*，是双引号内的任何内容。内的字符加上编译器提供的终止字符\
  \ `\\0`，以字符字符串的形式存储在内存中。因此，`\"I am a string constant.\"`、`\"I am a string in an\
  \ array.\"`、`\"Something me.\"` 以及 `\"Here are some strings:\"` 都是字符串常量。\n\n回从 ANSI\
  \ C 开始，如果字符串字面量之间没有任何或只有空格隔开，C 会将其合并。例如，\n\n点击此处查看代码图像\n\nchar greeting[50] = \"\
  Hello, and\"\" how today!\";\n\n等同于：\n\n点击此处查看代码图像\n\nchar greeting[50] = \"Hello,\
  \ and how today!\";\n\n如果你想在字符串中使用双引号，请在引号前加一个反斜杠，如下所示：\n\n点击此处查看代码图像\n\nprintf(\"\
  \\\"Run, Spot, run!\\\" exclaimed Dick.\\n\");\n\n产生了如下输出：\n\n\"Run, Spot, run!\"\
  \ exclaimed Dick.\n\n字符串常量被放置在静态存储类中，这意味着如果你在函数中使用字符串常量，字符串只存储一次并持续整个程序运行，即使该函数被调用多次。整个引用短作为字符串存储位置的指针。这种动作类似于数组名作为数组位置的指针。如果是这样，Listing\
  \ 11.2 中的程序应该产生什么样的输出？\n\n\n\n\n\n* * *\n\n`%s` 格式应该打印字符串 `We`。`%p` 格式产生一个地址。因此，如果短语\
  \ `\"are\"` 是地址，那么 `%p` 应该打印字符串第一个字符的地址。（非 ANSI 的实现可能必须使用 `%u` 或 `%lu` 代替 `%p`。）最后，`*\"\
  space farers\"` 应该产生地址所指向的值，该值应该是字符串 `\"space farers\"` 的第一个字符。这种情况真的发生了吗？嗯，这里是输出：\n\
  \n```\nWe, 0x100000f61, s\n```\n\n## 字符字符串数组与初始化\n\n当你定义字符字符串数组时，必须让编译器知道需要空间。一种方法是指定一个足够大的数组大小来存放该字符串。以下声明将数组\
  \ `m1` 初始化为指定字符串的字符：\n\n点击查看代码图像\n\n```c\nconst char m1[40] = \"Limit yourself to\
  \ one line's worth.\";\n```\n\n`const` 表示不修改此字符串的意图。这种初始化形式是标准数组初始化形式的简写：\n\n点击查看代码图像\n\
  \n```c\nconst char m1[40] = {  'L',\n'i', 'm', 'i', 't', ' ', 'y', 'o', 'u', 'r',\
  \ 's', 'e', 'l',\n'f', ' ', 't', 'o', ' ', 'o', 'n', 'e', ' ',\n'l', 'i', 'n', 'e',\
  \ '\\\"', 's', ' ', 'w', 'o', 'r',\n't', 'h', '.', '\\0'\n};\n```\n\n注意结尾的空字符。如果没有它，你得到的是一个字符数组，而不是一个字符串。\n\
  \n当你指定数组大小时，请确保元素个数至少比字符串长度多出一个（又是那个空字符）。任何未使用的元素都会自动初始化为 `0`（在 `char` 形式下是空字符，而不是数字零字符）。参见图\
  \ 11.1。\n\n![图像](img/11fig01.jpg)\n\n图 11.1 初始化数组。\n\n通常，让编译器确定数组大小是很方便的；请记住，如果你在初始化声明中省略了大小，编译器将为你确定该大小：\n\
  \n点击查看代码图像\n\n```c\nconst char m2[] = \"If you can't think of anything, fake it.\"\
  ;\n```\n\n初始化字符数组是让编译器确定数组大小确实真正有意义的情况之一。这是因为字符串处理函数通常不需要知道数组的大小，因为它们只需要寻找空字符来标记结束。\n\
  \n让编译器计算数组的大小仅在初始化初始化数组时才有效。如果你创建了一个打算稍后填充的数组，你需要在声明时指定大小。当你声明数组大小时，该数组大小必须求值为一个整数。在\
  \ C99 变长长度数组（VLAs）出现之前，大小必须是一个整数常量，这包括由常量整数值构成的表达式的可能性。\n\n点击查看代码图像\n\n```c\nint\
  \ n = 8;\nchar cookies[1];     // 有效\nchar cakes[2 + 5];  // 有效，大小是一个常量表达式\nchar\
  \ pies[2*sizeof(long double) + 1];  // 有效\nchar crumbs[n];     // C99 之前无效，C99 为\
  \ VLA\n```\n\n字符数组的名字像任何数组名一样，产生数组第一个元素的地址。因此，以下等成立：\n\n点击查看代码图像\n\n```c\nchar car[10]\
  \ = \"Tata\";\ncar == &car[0] , *car == 'T', and *(car+1) == car[1] == 'a'\n```\n\
  \n事实上，你可以使用指针表示法来设置字符串。例如，列表 11.1 使用了以下声明：\n\n点击查看代码图像\n\n```c\nconst char * pt1\
  \ = \"Something is pointing at me.\";\n```\n\n这个声明与这一个几乎相同：\n\n点击查看代码图像\n\n```c\n\
  const char ar1[] = \"Something is pointing at me.\";\n```\n\n这些声明相当于说 `pt1` 和 `ar1`\
  \ 都是字符串的地址。在两种情况下，引号字符串本身决定了为该字符串分配的空间。尽管如此，这些形式并不相同。\n\n### 数组与指针\n\n那么，数组形式和指针形式之间的区别是什么？数组形式（`ar1[]`）会在计算机内存中分配一个包含\
  \ 29 个元素的数组（每个字符一个，加上一个用于终止的 `'\\0'`）。每个元素都被初始化为字符串字面量对应的字符。通常情况下，情况是引号内的字符串存储在可执行文件的数据段中；当程序加载时，它会被复制到内存中。第\
  \ 12 章 将更详细地讨论内存。\n\n\n\n\n这说明了什么？首先，`pt` 和 `MSG` 是同一个地址，而 `ar` 是不同的地址，正如承诺的那样。其次，虽然字面量\
  \ `\"I'm special.\"` 在 `printf()` 语句中出现了两次，但编译器选择使用一个存储位置，尽管该地址与 `MSG` 不相同。编译器有权将使用多次的字面量存储在一个或多个位置中。另一个编译器可能会选择用同一个存储位置来表示\
  \ `\"I'm special.\"` 的所有出现。第三，用于静态数据的内存部分与用于动态内存（即 `ar` 使用的内存）的部分是不同的。不仅值不同，该特定的编译器甚至使用不同的位数来表示这两种内存。\n\
  \n数组和指针表示字符串的差异重要吗？通常情况下并不重要，但这取决于你尝试做什么。让我们进一步探究这个问题。\n\n## 数组和指针的区别\n\n让我们检查初始化一个用于存储字符串的字符数组与初始化一个指向字符串的指针之间的差异。（通过“指向字符串”，我们实际上是指该指针指向字符串的第一个字符。）例如，考虑以下两个声明：\n\
  \n点击此处查看代码图像\n\n```c\nchar heart[] = \"I love Tillie!\";\n\nconst char *head = \"\
  I love Millie!\";\n```\n\n主要的区别在于数组名 `heart` 是一个常量，而指针 `head` 是一个变量。这在实践中产生了什么区别？\n\
  \n首先，两者都可以使用数组下标：\n\n```c\nfor (i = 0; i < 6; i++)\n    putchar(heart[i]);\nputchar('\\\
  n');\n\nfor (i = 0; i < 6; i++)\n    putchar(head[i]));\nputchar('\\n');\n```\n\n\
  这是输出：\n\n```\nI love\nI love\n```\n\n接下来，两者都可以使用指针偏移加法：\n\n```c\nfor (i = 0; i <\
  \ 6; i++)\n    putchar(*(heart + i));\nputchar('\\n');\n\nfor (i = 0; i < 6; i++)\n\
  \    putchar(*(head + i));\nputchar('\\n');\n```\n\n再次，输出如下：\n\n```\nI love\nI love\n\
  ```\n\n然而，只有指针版本可以使用自增运算符：\n\n点击此处查看代码图像\n\n```c\nwhile (*(head) != '\\0')  /* 在字符串末尾停止\
  \ */\n    putchar(*(head++));  /* 输出字符，指针移动 */\n```\n\n这产生了以下输出：\n\n```\nI love\
  \ Millie!\n```\n\n假设你想让 `head` 与 `heart` 一致。你可以说：\n\n点击此处查看代码图像\n\n```c\nhead =\
  \ heart;  /* head 现在指向数组 heart */\n```\n\n这使得 `head` 指针指向 `heart` 数组的第一个元素。\n\n\
  然而，你不能说：\n\n点击此处查看代码图像\n\n```c\nheart = head;  /* 非法构造 */\n```\n\n这种情况类似于 `x = 3;`\
  \ 与 `3 = x;`。赋值语句的左侧必须是一个变量，或者更通用地说，是一个可修改的*左值*，例如 `*p_int`。顺带一提，`head = heart;`\
  \ 并不会让 Millie 字符串消失；它只是更改了存储在 `head` 中的地址。然而，除非你在其他地方保存了 `\"I love Millie!\"` 的地址，否则当\
  \ `head` 指向另一个位置时，你无法访问该字符串。\n\n有一种方法可以修改 `heart` 信息——访问单个数组元素：\n\n```c\nheart[7]=\
  \ 'M';\n```\n\n或者\n\n```c\n*(heart + 7) = 'M';\n```\n\n数组的*元素*是变量（除非数组被声明为 `const`），但其*名*不是变量。\n\
  \n让我们回到一个没有使用 `const` 修饰符的指针初始化：\n\n```c\nchar * word = \"frame\";\n```\n\n你可以使用指针来更改这个字符串吗？\n\
  \n```c\nword[1] = 'l';  // 允许？？\n```\n\n你的编译器可能允许这样做，但在当前的 C 标准下，此类操作的行为是未定义的。这样的语句可能会导致内存访问错误。原因在于正如之前提到的，编译器可以选择用内存中的单一副本来表示所有相同的字符串字面量。例如，以下语句都可能指向字符串\
  \ `\"Klingon\"` 的同一个内存位置：\n\n点击此处查看代码图像\n\n```c\nchar * p1 = \"Klingon\";\n\np1[0]\
  \ = 'F';    // 好？\n\nprintf(\"Klingon\");\n\nprintf(\": Beware the %ss!\\n\", \"\
  Klingon\");\n```\n\n也就是说，编译器可以用相同的地址替换每个实例的 `\"Klingon\"`。如果编译器使用这种单一副本表示并允许将 `p1[0]`\
  \ 修改为 `'F'`，这将影响对该字符串的所有使用，因此打印字符串字面量 `\"Klingon\"` 的语句实际上会显示 `\"Flingon\"`：\n\n\
  事实上，在过去，某些编译器是这样做的，而另一些则会中止。因此，初始化字符串指针的推荐做法是使用 `const` 修饰符。\n\n## 字符串数组\n\n拥有字符串数组通常非常方便。然后你可以使用下标来访问不同的字符串。列表\
  \ 1.4 显示了两种方法：指针数组和 `char` 数组。\n\n```c\n#include <stdio.h>\n\n#define SLEN 40\n\
  #define LIM 5\n\nint main(void)\n{\n    const char *mytalents[LIM] = {\n       \
  \ \"Adding numbers\",\n        \"Multiplying accurately\",\n        \"Following\
  \ the letter\",\n        \"Understanding the C language\"\n    };\n    char yourtalent[LIM][SLEN]\
  \ = {\n        \"Walking in a straight line\",\n        \"Sleeping\",\n        \"\
  Mailing letters\",\n        \"Reading email\"\n    };\n    int i;\n    puts(\"Let's\
  \ compare talents.\");\n    printf(\"%-36s %25s\\n\", \"My Talents\", \"Your Talents\"\
  );\n    for (i = 0; i < LIM; i++)\n        printf(\"%-36s %25s\\n\", mytalents[i],\
  \ yourtalent[i]);\n    printf(\"\\nsizeof mytalents: %zd, sizeof yourtalent: %zd\\\
  n\", sizeof(mytalents), sizeof(yourtalent));\n    return 0;\n}\n```\n\n这是输出：\n\n\
  点击此处查看代码图像\n\n```\nLet's compare talents.\nMy Talents                          \
  \ Your Talents\nAdding numbers                       Walking in a straight line\n\
  Multiplying accurately              Sleeping\nFollowing the letter             \
  \  Mailing letters\nUnderstanding the C language         Reading email\n\nsizeof\
  \ mytalents: 40, sizeof yourtalent: 200\n```\n\n在某些方面，`mytalents` 和 `yourtalent`\
  \ 非常相似。每个都表示五个字符串。当使用一个索引使用时（如 `mytalents[0]` 和 `yourtalent[0]`），结果是一个单一字符串。而且正如\
  \ `mytalents[1][2]` 是 `'l'`（`mytalents` 表示的第二个字符串的第三个字符），`yourtalent[1][2]` 是 `'e'`（`yourtalent`\
  \ 表示的第二个字符串的第三个字符）。两者都是以相同的方式初始化的。\n\n\n\n但它们也有区别。`mytalents` 数组是一个包含五个指针的数组，在我们的系统上占用\
  \ 40 字节。而 `yourtalents` 是一个包含五个数组的数组，每个数组都有 40 个 `char` 值，在我们的系统上占用 200 字节。因此，尽管\
  \ `mytalents[0]` 和 `yourtalents[0]` 都是字符串，`mytalents` 与 `yourtalents` 是不同的类型。`mytalents`\
  \ 中的指针指向初始化时使用的字符串字面量的位置，这些字面量存储在静态内存中。然而，`yourtalents` 中的数组包含了字符串字面量的副本，因此每个字符串都存储了两次。此外，数组中的内存分配效率是低效的，因为\
  \ `yourtalents` 的每个元素必须具有相同的大小，而且该大小必须足够大以容纳最长的字符串。\n\n可视化这种差异的一种方法是将 `yourtalents`\
  \ 视为一个矩形二维数组，其中每行的长度都相同（在本例中为 40 字节）。接下来，将 `mytalents` 视为一个锯齿形数组（ragged array），即行长度各不相同的数组。图\
  \ 11.2 显示了这两种数组。（实际上，`mytalents` 数组元素指向的字符串并不一定需要连续存储在内存中，但该图确实说明了存储需求上的差异。）\n\n\
  ![Image](img/11fig02.jpg)\n\n图 11.2 矩形数组与锯齿形数组。\n\n结论是，如果你想用数组来表示一组要显示的字符串，指针数组比字符数组数组更具效率。然而，这其中存在一个陷阱。由于\
  \ `mytalents` 中的指针指向字符串字面量，这些字符串不应该被修改。然而，`yourtalents` 的内容是可以更改的。因此，如果你想修改字符串或为字符串输入留出空间，请不要使用指向字符串字面量的指针。\n\
  \n## 指针与字符串\n\n也许你注意到在关于字符串的讨论中偶尔会提到指针。大多数 C 语言的字符串操作实际上都是通过指针进行的。例如，考虑 列表 11.5\
  \ 所示的示例程序。\n\n列表 11.5 程序 p_and_s.c\n\n点击此处此处查看代码图像\n\n```c\n/* p_and_s.c -- 指针与字符串\
  \ */\n\n#include <stdio.h>\n\nint main(void)\n{\n    const char * mesg = \"Don't\
  \ be a fool!\";\n    const char * copy;\n    copy = mesg;\n    printf(\"%s\\n\"\
  , copy);\n    printf(\"mesg = %s; &mesg = %p; value = %p\\n\",\n           mesg,\
  \ &mesg, mesg);\n    printf(\"copy = %s; &copy = %p; value = %p\\n\",\n        \
  \   copy, &copy, copy);\n    return 0;\n}\n```\n\n#### 注意\n\n如果你的编译器不支持 `%p`，请使用\
  \ `%u` 或 `%lu` 代替 `%p`。\n\n查看这个程序，你可能会认为它复制了字符串 `\"Don't be a fool!\"`，而你对输出的第一眼观察似乎证实了这个猜想：\n\
