  \ 最大宽度整数函数\n\n### 备选拼写：iso646.h\n\n此头文件提供了 11 个宏，这些宏会展开为所指定的运算符，如表 RS.V.11 所示。\n\
  \n![Image](img/rs-vtab11.jpg)\n\n表 RS.V.11 备选拼写\n\n### 本地化：locale.h\n\n`locale`\
  \ 是一组设置，用于控制诸如小数点符号等项目。区域设置值存储在类型为 `struct lconv` 的结构体中，该结构体定义 `locale.h` 头文件中。可以通过字符串指定区域设置，该字符串用于指定结构体成员的一组特定值。默认区域设置由字符串\
