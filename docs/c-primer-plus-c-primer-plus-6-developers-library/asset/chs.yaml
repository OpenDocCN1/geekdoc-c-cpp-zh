  \n### 13. 重写练习 11，使函数无论用户输入大写还是小写都能识别字符。\n\n## 编程练习\n\n**1.** 设计并测试一个函数，它从输入中读取\
  \ `n` 个字符到数组中，但在 `n` 个字符或遇到空格、换行时停止（以先者为准）。\n\n**2.** 修改练习 3 中的函数，使其在读取 `n` 个字符或遇到空格、换行时停止（不要只使用\
  \ `scanf()`）。\n\n**3.** 设计并测试一个函数，它从行中读取第一个单词到数组中，并跳过空白字符。使用 `getchar()` 而 `scanf()`。\n\
  \n**4.** 设计并测试一个函数，与练习 3 类似，但它接受第二个参数来指定可以读取的最大字符数。\n\n**5.** 设计并测试一个函数，它在第一个参数指定的字符串中搜索第二个参数指定的字符首次出现的位置。如果成功则返回该指针，否则返回空（这复制了库\
  \ `strchr()` 函数的功能）。在一个完整的程序中使用循环提供输入值。\n\n**6.** 编写一个名为 `is_within()` 的函数，它接收一个字符和一个字符串指针作为两个参数。如果该字符在字符串中，则返回非零值（真），否则返回零（假）。在一个完整的程序中使用循环提供输入值。\n\
  \n**7.** `strncpy(s1,s2,n)` 函数从 `s2` 拷贝恰好 `n` 个字符到 `s1`，必要时会截断 `s2` 或填充额外的空字符。如果\
  \ `s2` 的长度为 `n` 或更多，则 `s1` 可能没有空字符终止。该函数返回 `s1`。编写该函数的自定义版本并命名为 `mystrncpy()`。在一个完整的程序中使用循环提供输入值。\n\
  \n**8.** 编写一个名为 `string_in()` 的函数，接收两个字符串指针作为参数。如果第二个字符串包含在第一个字符串中，让函数返回其起始的地址。例如，`string_in(\"\
  hats\", \"at\")` 将返回 `hats` 中 `a` 的地址。否则，让函数返回空指针。在一个完整的程序中使用循环提供输入值。\n\n**9.**\
  \ 编写一个函数，将字符串的内容反转。在一个完整的程序中使用循环提供输入值。\n\n**10.** 编写一个函数接收字符串作为参数并移除字符串中的空格。在一个程序中测试，该程序循环读取行直到输入空行。该程序对每个输入字符串应用该函数并显示结果。\n\
  \n**11.** 编写一个程序读取最多 10 个字符串或到 `EOF`（以先者为准）。为用户提供一个包含五个选项的菜单：打印原始字符串列表、按 ASCII 排序顺序打印字符串、按长度递增顺序打印字符串、按字符串中第一个单词的长度顺序打印字符串、退出。在用户输入退出请求之前让菜单循环循环。当然，程序应该实际执行所承诺的任务。\n\
  \n\n\n\n\n12. 编写一个程序，读取输入直到 `EOF`，并报告单词数、大写字母个数、小写字母个数、标点符号字符个数以及数字个数。使用 `ctype.h`\
  \ 系列函数。\n\n13. 编写一个程序，按单词反序回显命令行参数。例如，如果命令行参数为 `see you later`，则程序应打印 `later you\
  \ see`。\n\n14. 编写一个基于命令行的幂律程序。第一个命令行参数应该是要提升到特定幂次数的 `double` 类型数字，第二个参数应该是整数幂次。\n\
  \n15. 使用字符分类函数准备 `atoi()` 的实现；如果输入字符串不是纯数字，则该版本返回值 `0`。\n\n16. 编写一个程序，读取输入直到文件结束并将其回显到显示器上。让程序识别并实现以下命令行参数：\n\
  \n![Image](img/510tab01.jpg)\n\n此外，如果没有命令行参数，让程序的行为得像使用了 `–p` 参数一样。\n\n## 12. 存储类、链接与内存管理\n\
  \n你将在本章中学习到以下内容：\n\n![Image](img/squf.jpg) 关键字：\n\n点击此处查看代码图片\n\n`auto`, `extern`,\
  \ `static`, `register`, `const`, `volatile`, `restricted`, `_Thread_local`, `_Atomic`\n\
  \n![Image](img/squf.jpg) 函数：\n\n点击此处查看代码图片\n\n`rand()`, `srand()`, `time()`, `malloc()`,\
  \ `calloc()`, `free()`\n\n![Image](img/squf.jpg) C 如何允许你确定变量的作用域（可见范围）和变量的生命周期（持续存在的时间）\n\
  \n![Image](img/squf.jpg) 设计更复杂的程序\n\nC 的优势之一是它能够让你控制程序的细节点。C 的内存管理系统体现了这种控制，它让你决定哪些函数知道哪些变量，以及变量在程序中持续多多久。使用内存存储是程序设计的另一个元素。\n\
  \n### 存储类\n\nC 提供了若干种在内存中存储数据的不同模型，或称为*存储类*（storage classes）。为了理解这些选项，先回顾几个概念和术语是有帮助的。\n\
  \n书中的每个编程示例都在内存中存储数据。这涉及硬件层面——每个存储的值都占据物理内存。C 语言文献使用*对象*（object）一词来描述这样的内存块。一个对象可以包含一个或多个值。一个对象可能还没有实际的存储值，但它的大小将足够容纳一个适当的值。（*面向对象编程*这一短语中的*对象*一词具有更深层次的含义，指代类对象，其定义涵盖了数据以及对数据进行允许的操作；C\
  \ 并不是一种面向对象的编程语言。）\n\n还有软件层面的考虑——程序需要一种访问对象的方法。例如，这可以通过声明变量来实现：\n\n```c\nint entity\
  \ = 3;\n```\n\n此声明创建了一个名为 `entity` 的*标识符*（identifier）。标识符是一个名称，在本例中，它可以用于指定特定对象的内容。标识符符合第\
  \ 2 章“介绍 C](#ch02.html_ch02)”中讨论的变量命名规范。在本例中，标识符 `entity` 是软件（C 程序）指定存储在硬件内存中的对象的方式。此声明还提供了一个要存储在对象中的值。\n\
  \n变量并不是指定对象的唯一方法。例如，考虑以下声明：\n\n```c\nint * pt = &entity;\nint ranks[10];\n```\n\n\
  在第一种情况下，`pt` 是标识符。它指定了一个持有地址的对象。接下来，表达式 `*pt` 不是标识符，因为它不是一个名称。然而，它确实指定了一个对象，在本例中，与\
  \ `entity` 指定的是同一个对象。通常情况下，正如你可能从第 3 章“数据与 C](#ch03.html_ch03)”中记得的那样，指定对象的表达式被称为左值（lvalue）。因此，`entity`\
  \ 是一个作为左值的标识符，而 `*pt` 是一个作为左值的表达式。依此类推，法表达式 `ranks + 2 * entity` 既不是标识符（不是名称），也不是左值（没有指定内存位置的内容）。但表达式\
  \ `*(ranks + 2 * entity)` 是一个左值，因为它确实指定了特定内存位置的值，即 `ranks` 数组的第七个元素。顺带一提，`ranks`\
  \ 的声明创建了一个能够容纳十个 `int` 对象，数组的每个成员也是一个对象。\n\n如果像所有这些示例一样，可以使用左值来更改对象中的值，那么它就是*可修改左值*（modifiable\
  \ lvalue）。现在考虑此声明：\n\n点击此处查看代码图片\n\n```c\nconst char * pc = \"Behold a string literal!\"\
  ;\n```\n\n这导致程序将字符串字面量的内容存储在内存中，该字符值数组就是一个对象。数组中的每个字符也是一个对象，因为它可以被单独访问。该声明还创建了一个拥有标识符\
  \ `pc` 并持有字符串地址的对象。`pc` 是一个可修改左值，因为它可以重置指向不同的字符串。`const` 防止你修改所指向的内容，但不能改变指向的字符串。因此，`*pc`\
  \ 指定 `'B'` 字符的数据对象是一个左值，但不是可修改的。同样，字符串字面量本身因为它指定了字符字符串对象，是一个左值，但不是可修改的。\n\n####\
  \ 作用域\n\n\n\n\n`Scope`（作用域）描述了程序可以访问标识符的区域或区域。C 变量具有以下作用域之一：块级、函数级、函数原型级或文件级。到目前为止，程序示例几乎完全对变量使用了块作用域。正如你记得的，一个\
  \ `block`（块）是包含在左大括号和匹配右大括号之间的代码区域。例如，整个函数体就是一个块。函数内部任何复合语句也是一个块。在块内部定义的变量具有 `block\
  \ scope`（块作用域），它从定义点直到包含该定义的块结束都是可见的。此外，形式函数参数虽然出现在函数左大括号之前，但它们具有块作用域，并属于包含函数体的块。因此，我们到目前为止使用的局部变量（包括形式函数参数）都具有块作用域。因此，以下代码中的变量\
  \ `cleo` 和 `patrick` 都具有块作用域，且其范围延伸到右大括号：\n\n```c\ndouble blocky(double cleo)\n\
  {\n    double patrick = 0.0;\n    ...\n    return patrick;\n}\n```\n\n在内部块中声明的变量其作用域仅限于该块：\n\
  \n点击此处查看代码图像\n\n```c\ndouble blocky(double cleo)\n{\n    double patrick = 0.0;\n\
  \    int i;\n    for (i = 0; i < 10; i++)\n    {\n        double q = cleo * i; //\
  \ q 的作用域开始\n        ...\n        patrick *= q;\n    }                      // q\
  \ 的作用域结束\n    ...\n    return patrick;\n}\n```\n\n在这个示例中，`q` 的作用域被限于内部块，只有该块内的代码可以访问\
  \ `q`。\n\n传统上，具有块作用域的变量必须在块的开头声明。C99 放宽了这一规则，允许你在块的任何地方声明变量。一种新的可能性是在 `for` 循环的控制部分。也就是说，现在你可以这样做：\n\
  \n点击此处查看代码图像\n\n```c\nfor (int i = 0; i < 10; i++)\n    printf(\"A C99 feature:\
  \ i = %d\", i);\n```\n\n作为这一新功能的一部分，C99 扩展了块的概念，包含了由 `for` 循环、`while` 循环、`do while`\
  \ 循环或 `if` 语句控制的代码，即使没有括号。因此在之前的 `for` 循环中，变量 `i` 被视为 `for` 循环块的一部分。因此，它的作用域被限于\
  \ `for` 循环。执行离开 `for` 循环后，程序将不再看到该 `i`。\n\n`function scope`（函数作用域）仅适用于与 `goto` 语句配合使用的标签。这意味着即使标签第一次出现在函数内部的内部块中，它的作用域也延伸到整个函数。如果你可以在两个独立的块中使用相同的标签，那将很令人困惑，而标签的函数作用域防止了这种情况发生。\n\
  \n`function prototype scope`（函数原型作用域）适用于函数原型中使用的变量名，如下：\n\n点击此处查看代码图像\n\n```c\n\
  int mighty(int mouse, double large);\n```\n\n函数原型作用域从变量定义点开始，到原型声明结束。这意味着编译器在处理函数原型参数时只关心类型；你使用的名称（如果有的话）通常并不重要，且它们不需要与你在函数定义中使用的名称匹配。名称稍显重要的一类情况是使用变长数组参数时：\n\
  \n点击此处查看代码图像\n\n```c\nvoid use_a_VLA(int n, int m, ar[n][m]);\n```\n\n如果你在括号中使用名称，它们必须是原型中早早声明的名称。\n\
  \n定义在任何函数之外的变量具有 `file scope`（文件作用域）。具有文件作用域的变量从其定义点到包含该定义的文件结束都是可见的。看看这个示例：\n\n\
  点击此处查看代码图像\n\n```c\n#include <stdio.h>\n\nint units = 0;          /* 一个具有文件作用域的变量\
  \ */\nvoid critic(void);\n\nint main(void)\n{\n    ...\n}\n\nvoid critic(void)\n\
  {\n    ...\n}\n```\n\n在这里，变量 `units` 具有文件作用域，可以在 `main()` 和 `critic()` 中使用。\n\n\n\
  \n线程存储期（thread storage duration）在并发编程中发挥作用，在这种情况下，程序执行可以被分为多个线程。具有线程存储期的对象从声明开始一直到线程结束。当一个原本会创建文件作用域对象的声明使用\
  \ `_Thread_local` 关键字进行修改时，就会创建这样一个对象。当使用此说明符声明变量时，每个线程都会获得该变量的私有拷贝。\n\n块作用域（block\
  \ scope）的变量通常具有自动存储期（automatic storage duration）。当程序进入定义这些变量的块时，会为它们分配内存，并在退出块时释放内存。这种思想是，用于自动变量的内存是一个可以重复使用的空间或草稿纸。例如，在函数调用结束后，它用于存储变量的内存可以用于存储下一个调用的函数的变量。\n\
  \n变长数组（variable-length arrays）提供了一个轻微的例外，它们从声明点持续到块的结束，而不是从块的开始到结束。\n\n我们目前为止使用的局部变量都属于自动类。例如，在以下代码中，`number`\
  \ 和 `index` 变量每次调用 `bore()` 函数时都会产生，并在每次函数完成时消失：\n\n点击此处代码图像\n\n```c\nvoid bore(int\
  \ number)\n{\n    int index;\n    for (index = 0; index < number; index++)\n   \
  \     puts(\"They don't make them the way they used to.\\n\");\n    return 0;\n\
  }\n```\n\n然而，变量完全可能具有块作用域但具有静态存储期（static storage duration）。要创建这样的变量，可以在块内部声明它，并在声明中添加\
  \ `static` 关键字：\n\n```c\nvoid more(int number)\n{\n    int index;\n    static int\
  \ ct = 0;\n    ...\n    return 0;\n}\n```\n\n在这里，变量 `ct` 存储在静态内存中；它从程序加载开始一直到程序终止。但它的作用域被限制在\
  \ `more()` 函数块内。只有当该函数执行时，程序才能使用 `ct` 来访问它所指向的对象。（然而，可以通过允许函数向其他函数提供存储地址来允许间接访问，例如通过指针参数或返回值。）\n\
  \nC 语言使用作用域（scope）、链接（linkage）和存储期来定义变量的几种存储方案。本书没有涵盖并发编程，因此我们不会深入讨论这方面。我们将在本章稍些时候讨论分配存储。这就下了五种存储类：自动、寄存器、具有块作用域的静态、具有外部链接的静态以及具有内部链接的静态。表\
  \ 12.1 列出了这些组合。既然我们已经涵盖了作用域、链接和存储期，我们可以更详细地讨论这些存储类。\n\n![图像](img/12tab01.jpg)\n\n\
  ## 表 12.1 五种存储类\n\n### 自动变量\n\n属于自动存储类的变量具有自动存储期、块作用域且没有链接。默认情况下，在块或函数头中声明的任何变量都属于自动存储类。然而，你可以通过显式地使用\
  \ `auto` 关键字来使你的意图变得完全清晰，如下所示：\n\n```c\nint main(void)\n{\n    auto int plox;\n\
  ```\n\n例如，你这样做可能是是为了说明你特意地覆盖了一个外部变量定义，或者说明将变量更改为另一种存储类是不重要的。`auto` 关键字被称为*存储类说明符*（storage-class\
  \ specifier）。C++ 已经将 `auto` 关键字重新用于一种完全不同的用途，因此简单地不将 `auto` 作为存储类说明符对于 C/C++ 兼容性更好。\n\
  \n块作用域和无链接意味着只有定义该变量的块才能通过名称访问该变量。（当然，可以使用参数将变量的值和地址通信给另一个函数，但那是间接知识。）另一个函数可以使用相同名称的变量，但它将是存储在不同内存位置的独立变量。\n\
  \n记住，自动存储期意味着当程序进入包含变量声明的块时，该变量才产生。当程序退出该块时，自动变量就会消失。它的内存位置现在可以用于其他地方，但不一定如此。\n\n\
  让我们更仔细地观察嵌套块。变量仅对声明它的块以及该块内部的任何块是知的：\n\n点击此处代码图像\n\n```c\nint loop(int n)\n{\n \
  \   int m;          // m 在作用域内\n    scanf(\"%d\", &m);\n    {\n        int i;  \
  \    // m 和 i 都在作用域内\n        for (i = m; i < n; i++)\n            puts(\"i is local\
  \ to a sub-block\\n\");\n    }\n    return m;      // m 在作用域内，i 消失\n}\n```\n\n在这段代码中，`i`\
  \ 仅在内部括号内可见。如果你尝试在内部块之前或使用它，将得到编译器错误。通常情况下，你在设计程序时不会使用此功能。但是，如果一个变量在其他地方没有使用，那么在子块中定义它是有用的。这样，你可以在靠近使用变量的地方记录变量的含义。此外，当变量不再需要时，它不会占用内存。变量\
  \ `n` 和 `m` 定义在函数头和外部块中，它们在整个函数范围内都有作用域，并一直到函数终止。\n\n如果你在内部块中声明了一个与外部块中变量同名的变量会怎样？那么在块内部定义的名称将*隐藏*外部定义。然而，当执行退出内部块时，外部变量会重新回到作用域内。表\
  \ 12.1 阐了这些及更多点。\n\n\n\n然而，在循环内部，程序看到了第三个 `x` 变量，它定义在 `while` 循环块内部。因此，当代码在循环体中使用\
  \ `x++` 时，是这个新的 `x` 被递增到 `101` 并显示。当每个循环周期完成后，这个新的 `x` 就会消失。然后循环测试条件会使用并递增原始的 `x`，再次进入循环块，新的\
  \ `x` 再次被创建。在这个例子中，该 `x` 被创建和销毁了三次。请注意，为了终止此循环，必须在测试条件中递增 `x`，因为在循环体内递增 `x` 增加的是与测试中使用的\
  \ `x` 不同的变量。\n\n### 不带大括号的块\n\n早之前提到的 C99 特性是，作为循环或 `if` 语句部分的语句，即使不使用大括号（即 `{}`），也算作一个块。更完整地说，整个循环是包含它的块的子块，而循环体是整个循环的子块。同样，`if`\
  \ 语句是一个块，其关联的子语句是 `if` 语句的子块。这些规则影响了你可以在哪里声明变量以及该变量的作用范围。列表 12.2 显示了这在 `for` 循环中是如何工作的。\n\
  \n#### 列表 12.2 forc99.c 程序\n\n```c\n// forc99.c -- new C99 rules\n#include <stdio.h>\n\
  int main()\n{\n    int n = 8;\n    printf(\"Initially, n = %d at %p\\n\", n, &n);\n\
  \    for (int n = 1; n < 3; n++)\n    {\n        printf(\"loop 1: n = %d at %p\\\
  n\", n, &n);\n    }\n    printf(\"After loop 1, n = %d at %p\\n\", n, &n);\n   \
  \ for (int n = 1; n < 3; n++)\n    {\n        printf(\"loop 2 index n = %d at %p\\\
  n\", n, &n);\n        int n = 6;\n        printf(\"loop 2: n = %d at %p\\n\", n,\
  \ &n);\n        n++;\n    }\n    printf(\"After loop 2, n = %d at %p\\n\", n, &n);\n\
  \    return 0;\n}\n```\n\n以下是输出，假设编译器支持这一现代 C 特性：\n\n```\nInitially, n = 8 at 0x7fff5ffc8\n\
  loop 1: n = 1 at 0x7fff5ffc4\nloop 1: n = 2 at 0x7fff5ffc4\nAfter loop 1, n = 8\
  \ at 0x7fff5ffc8\nloop 2 index n = 1 at 0x7fff5ffcc0\nloop 2: n = 6 at 0x7fff5ffbc\n\
  loop 2 index n = 2 at 0x7fff5ffcc0\nloop 2: n = 6 at 0x7fff5ffbc\nAfter loop 2,\
  \ n = 8 at 0x7fff5ffc8\n```\n\n#### 注意：对 C99 和 C11 的支持\n\n某些编译器可能不支持这些 C99/C11 作用域规则（此时\
  \ Microsoft Visual Studio 2012 就是其中之一）。其他编译器可能提供激活这些规则的选项。例如，在本文写作时，GCC 默认支持许多 C99\
  \ 特性，但需要使用 `-std=c99` 来激活列表 12.2 中使用的特性：\n\n```bash\ngcc -std=c99 forc99.c\n```\n\
  \n同样，GCC 或 Clang 版本可能需要使用 `-std=c1x` 或 `-std=c11` 选项来识别 C11 特性。\n\n第一个 `for` 循环控制部分声明的\
  \ `n` 作用持续到循环结束，并隐藏了初始的 `n`。但在执行离开循环后，原始的 `n` 重新进入作用域。\n\n在第二个 `for` 循环中，作为循环索引声明的\
  \ `n` 隐藏了初始的 `n`。然后，循环体内声明的 `n` 隐藏了循环索引 `n`。当程序执行完循环体时，在体内声明的 `n` 消失，循环测试使用索引 `n`。当整个循环终止时，原始的\
  \ `n` 重新进入作用域。再次，没有必要一直重复使用同一个变量。\n\n\n\n静态变量 `stay` 记得它的值被增加了 1，但 `fade` 变量每次都会重新开始。这指出了初始化上的区别：`fade`\
  \ 在每次调用 `trystat()` 时都会被初始化，而 `stay` 仅在编译 `trystat()` 时被初始化一次。如果你没有显式地将其初始化为其他值，静态变量将初始化为零。\n\
  \n这两个声明看起来相似：\n\n```c\nint fade = 1;\nstatic int stay = 1;\n```\n\n然而，第一条语句实际上是\
  \ `trystat()` 函数的一部分，并在每次调用该函数时执行。它是一个运行时操作。第二条语句实际上并不是 `trystat()` 函数的一部分。如果你使用调试器逐步执行程序，你会发现程序似乎跳过了那一步。这是因为静态变量和外部变量在程序加载到内存后就已经准备就绪了。将该语句放置在\
  \ `trystat()` 函数中，是告诉编译器只有 `trystat()` 函数允许看到该变量；它并不是一个在程序运行期间执行的语句。\n\n你不能对函数参数使用\
  \ `static`：\n\n点击此处查看代码图像\n\n```c\nint wontwork(static int flu);   // 不允许\n```\n\
  \n具有块作用域的静态变量的另一个术是“局部静态变量”。此外，如果你阅读一些旧的 C 语言，你会发现这种存储类被称为 `internal static storage\
  \ class`。然而，`internal` 一词用于表示函数内部，而不是内部链接。\n\n### 具有外部链接的静态变量\n\n具有外部链接的静态变量具有文件作用域、外部链接和静态存储持续时间。这种类有时被称为\
  \ `external storage class`，这种类型的变量被称为 `external variables`。你通过在任何函数之外放置一个定义声明来创建一个外部变量。作为文档说明的一部分，外部变量还可以通过使用\
  \ `extern` 关键字在它的它的函数内部对其进行额外声明。如果某个特定的外部变量定义在一个源文件中，并在第二个源文件中使用，则在第二个文件中使用 `extern`\
  \ 声明该变量是强制性的。声明形式如下：\n\n点击此处查看代码图像\n\n```c\nint Errupt;             /* 外部定义的变量 \
  \ */\ndouble Up[100];          /* 外部定义的数组      */\nextern char Coal;       /* 如果\
  \ Coal\n                         /* 定义在另一个文件中，则强制声明 */\n\nvoid next(void);\n\nint\
  \ main(void)\n{\n  extern int Errupt;  /* 可选声明 */\n  extern double Up[]; /* 可选声明\
  \ */\n  ...\n}\n\nvoid next(void)\n{\n  ...\n}\n```\n\n注意，在 `double Up` 的可选声明中，你不需要给出数组的大小。这是因为原始声明已经提供了该信息。`main()`\
  \ 内部的 `extern` 声明可以完全省略，因为外部变量具有文件作用域，所以从声明点到文件结束都是已知的。然而，它们确实起到了记录 `main()` 使用这些变量的意图的作用。\n\
  \n如果仅从函数内部的声明中省略 `extern`，就会设置一个独立的自动变量。也就是说，将\n\n```c\nextern int Errupt;\n```\n\
  \n在 `main()` 中替换为\n\n```c\nint Errupt;\n```\n\n会导致编译器创建一个名为 `Errupt` 的自动变量。它将是一个单独的、局部变量，与原始的\
  \ `Errupt` 有区别。当程序执行 `main()` 时，局部变量在作用域内，但外部的 `Errupt` 在同一文件的其他函数（如 `next()`）中作用域内。简而言之，当程序执行块中的语句时，块作用域中的变量会“隐藏”文件作用域内的同名变量。如果由于某些极可能的概率，你实际上需要使用与全局变量同名的局部变量，你可能选择在局部声明中使用\
  \ `auto` 存储说明符来记录你的选择。\n\n外部变量具有静态存储持续时间。因此，数组 `Up` 无论程序是在执行 `main()`、`next()` 还是其他函数，都保持其存在和值。\n\
  \n以下三个示例显示了外部变量和自动变量的四种可能组合。示例 1 包含一个外部变量：`Hocus`。`main()` 和 `magic()` 均可见。\n\n\
  点击此处查看代码图像\n\n```c\n/* 示例 1 */\nint Hocus;\nint magic();\n\nint main(void)\n{\n\
  \    extern int Hocus;  // Hocus 声明为外部\n    ...\n}\n\nint magic()\n{\n    extern\
  \ int Hocus;  // Hocus 声明为外部\n    ...\n}\n```\n\n示例 2 有一个外部变量 `Hocus`，两个函数均可见。这一次，`magic()`\
  \ 默认知道它。\n\n点击此处查看代码图像\n\n```c\n/* 示例 2 */\nint Hocus;\nint magic();\n\nint main(void)\n\
  {\n    extern int Hocus;  // Hocus 声明为外部\n    ...\n}\n\nint magic()\n{\n    extern\
  \ int Hocus;  // Hocus 声明为外部\n    ...\n}\n```\n\n在示例 3 中，创建了独立的变量。`main()` 中的 `Hocus`\
  \ 变量是自动的且局限于 `main()`。`magic()` 中的 `Hocus` 变量是自动的且局限于 `magic()`。`Pocus` 变量是外部的对任何函数可见。最后，`Pocus`\
  \ 对 `main()` 可见。\n\n点击此处查看代码图像\n\n```c\n/* 示例 3 */\nint Hocus;\nint magic();\n\n\
  int main(void)\n{\n    int Hocus;  // Hocus 局部\n    ...\n}\n\nint magic()\n{\n \
  \   int Hocus;  // Hocus 局部\n    ...\n}\n\nint Pocus;\n```\n\n这些示例说明了外部变量的作用域：从声明点到文件结束。它们还说明了变量的生命周期。外部的\
  \ `Hocus` 和 `Pocus` 在程序运行期间持续存在，不受限于任何函数。\n\n### 初始化外部变量\n\n像自动变量一样，外部变量可以被初始化。与自动变量不同，如果不初始化，外部变量将初始化为零。这条规则也适用于数组元素。与自动变量的情况不同，你只能使用常量表达式来初始化文件变量：\n\
  \n点击此处查看代码图像\n\n```c\nint x = 10;             // 允许，10 是常量\nint y = 3 + 20;    \
  \     // 允许，常量表达式\nsize_t z = sizeof(int); // 允许，常量表达式\nint x2 = 2 * x;        \
  \ // 不允许，x 是变量\n```\n\n（只要类型不是变量数组，`sizeof` 表达式被视为常量表达式。）\n\n### 使用外部变量\n\n让我们来看一个涉及外部变量的简单示例。具体来说，假设你想让两个函数（命名为\
  \ `main()` 和 `critic()`）访问变量 `units`。你可以通过在两个函数之外上方声明 `units` 来实现，如列表 12.4\n\n```c\n\
  * * *\n/* global.c -- 使用外部变量 */\n#include <stdio.h>\n\nint units = 0;  /* 一个外部变量\
  \ */\n\nvoid critic(void);\n\nint main(void)\n{\n  extern int units;  /* 可选的重新声明\
  \ */\n  printf(\"How many pounds to a firkin of butter?\\n\");\n  scanf(\"%d\",\
  \ &units);\n  while ( units != 56)\n    critic();\n}\n```\n\n\n\n\n```c\n    printf(\"\
  You must have looked it up!\\n\");\n\n    return 0;\n}\n\nvoid critic(void)\n{\n\
  \    /* optional redeclaration omitted */\n    printf(\"No luck, my friend. Try\
  \ again.\\n\");\n    scanf(\"%d\", &units);\n}\n```\n\n以下是部分示例输出：\n\n点击此处查看代码图像\n\
  \n一桶黄油有多少磅？\n14\n\n运气不错，我的朋友。再试一次。\n56\n\n你一定查过了！\n（我们确实查过了。）\n\n注意 `units` 的第二个值是如何由\
  \ `critic()` 函数读取的，然而 `main()` 函数在结束 `while` 循环时也知道了新值。因此，`main()` 函数和 `critic()`\
  \ 函数都使用标识符 `units` 来访问同一个变量。在 C 术语中，我们说 `units` 具有文件作用域、外部链接和静态存储 Duration。\n\n\
  我们通过在任何函数定义之外（即在函数外部）定义 `units` 来使其成为一个外部变量。你只需要这样做，就可以让 `units` 对文件中后续的所有函数都可用。\n\
  \n让我们来看一些细节。首先，在声明 `units` 的地方进行声明，使其在无需任何进一步操作的情况下对下方的函数可用。因此，`critics()` 使用了 `units`\
  \ 变量。\n\n同样，让 `main()` 访问 `units` 不需要进行任何操作。然而，`main()` 内部确实有如下声明：\n\n`extern int\
  \ units;`\n\n在示例中，此声明主要起到文档说明的作用。存储类说明符 `extern` 告诉编译器，在此特定函数中对 `units` 的任何引用都指向函数外部定义的变量，甚至可能在文件外部。同样，`main()`\
  \ 和 `critic()` 都使用了外部定义的 `units`。\n\n### 外部标识符\n\nC99 和 C11 标准要求编译器识别局部标识符的前 63\
  \ 个字符，以及外部标识符的前 31 个字符。这修订了之前的要求，即识别局部标识符的前 31 个字符和外部标识符的前 6 个字符。你可能在使用在使用旧的规则。外部变量命名规则比局部变量规则更严格的原因是，外部名称需要符合本地环境的规则，而该环境可能更具限制性。\n\
  \n### 定义与声明\n\n让我们详细查看变量的定义和声明之间的区别。考虑以下示例：\n\n点击此处查看代码图像\n\n```c\nint tern = 1;\
  \           /* 定义了 tern */\nmain()\n{\n    external int tern;  /* 使用别处定义的 tern */\n\
  ```\n\n在这里，`tern` 被声明了两次。第一次声明为该变量开留了存储空间，它构成了变量的定义。第二次声明仅仅告诉编译器使用之前创建的 `tern` 变量，因此它不是一个定义。第一次声明被称为*定义声明*（defining\
  \ declaration），第二个被称为*引用声明*（referencing declaration）。关键字 `extern` 表明该声明不是定义，因为它指示编译器去别处查找。\n\
  \n假设你执行了以下操作：\n\n`extern int tern;`\n\n`int main(void)`\n`{`\n\n（注：在示例中，此声明主要起到文档说明的作用。存储类说明符\
  \ `extern` 告诉编译器，在此特定函数中对 `units` 的任何引用都指向函数外部定义的变量，甚至可能在文件外部。同样，`main()` 和 `critic()`\
  \ 都使用了外部定义的 `units`。）\n\n### 具有链接的静态变量\n\nC99 和 C11 标准要求编译器识别局部标识符的前 63 个字符，以及外部标识符的前\
  \ 31 个字符。这修订了之前的要求，即识别局部标识符的前 31 个字符和外部标识符的前 6 个字符。你可能在使用旧的规则。外部变量命名规则比局部变量规则更严格的原因是，外部名称需要符合本地环境的规则，而该环境可能更具限制性。\n\
  \n### 多文件\n\n内部链接和外部链接的区别仅在你有一个由多个单元构建的程序时才重要，所以让我们快速看一下这一点。\n\n复杂的 C 程序通常使用独立的源代码文件。有时这些文件可能需要共享一个外部变量。C\
  \ 的处理方法是在一个文件中有一个定义声明，在另一个文件中有引用声明。也就是说，除了一个声明（定义声明）之外，所有声明都应该使用 `extern` 关键字，且只有定义声明用于初始化变量。\n\
  \n注意，在一个文件中定义的外部变量对第二个文件不可用，除非它在第二个文件中也（使用 `extern`）进行了声明。单独的外部声明本身只会让变量变得可能可用。\n\
  \n### 存储类说明符总结\n\n你可能已经注意到 `static` 和 `extern` 的含义取决于上下文。C 语言有六个关键字被归类为存储类说明符。它们是\
  \ `auto`、`register`、`static`、`extern`、`_Thread_local` 和 `typedef`。`typedef` 关键字没有说明任何内存存储，但它是为了语法原因被包含在内的。特别是大多数情况下可以在声明中使用少于一个存储类说明符，这意味着你不能将其他存储类说明符之一作为\
  \ `typedef` 的。唯一的例外是 `_Thread_local` 可以与 `static` 和 `extern` 配合。\n\n`auto` 说明符表示具有自动存储期的变量。它只能用于具有块作用域的变量声明，而这些变量已经具有自动存储期了，因此它的主要作用是记录意图。\n\
  \n`register` 说明符也只能用于块作用域的变量。它将变量放入寄存器存储类，这等同于减少该变量的访问时间。它还防止你获取该变量的地址。\n\n\n\n\n\
  \n`static` 饰符创建一个具有静态存储周期的对象，该对象在程序加载时创建，在程序终止时结束。如果 `static` 用于文件作用域声明，则其作用域仅限于该文件。如果\
  \ `static` 用于块作用域声明，则其作用域仅限于该代码块。因此，该对象在程序运行期间一直存在并保留其值，但只有在执行代码块内的代码时才能通过该标识符访问它。具有块作用域的静态变量没有链接。具有文件作用域的静态变量具有内部链接。\n\
  \n`extern` 饰符表示你正在声明一个在别处定义的变量。如果包含 `extern` 的声明具有文件作用域，则所引用的变量必须具有外部链接。如果包含 `extern`\
  \ 的声明具有块作用域，则所引用的变量可以具有外部链接，也可以具有内部链接，这取决于该变量的定义声明。\n\n***\n\n### 总结：存储类\n\n自动变量具有块作用域、没有链接，并且具有自动存储周期。它们对于定义它们所在的块（通常是函数）是局部的且私有的。寄存器变量与自动变量具有相同属性，但编译器可能会使用快速内存或寄存器来存储它们。你无法获取寄存器变量的地址。\n\
  \n具有静态存储周期的变量可以具有外部链接、内部链接或没有链接。当变量在文件的任何函数外部被声明时，它是一个外部变量，具有文件作用域、外部链接和静态存储周期。如果你在类此类声明中添加\
  \ `static` 关键字，你将得到一个具有静态存储周期、文件作用域和内部链接的变量。如果你在函数内部声明变量并使用 `static` 关键字，该变量具有静态存储周期、块作用域且没有链接。\n\
  \n具有自动存储周期的变量的内存在程序执行进入包含该变量声明的块时分配，在退出该块时释放。如果未初始化，此类变量将有一个垃圾值。具有静态存储周期的变量的内存在编译时分配，并随着程序的运行一直存在。如果未初始化，此类变量被设置为\
  \ 0。\n\n具有块作用域的变量对于包含声明的块是局部的。具有文件作用域的变量对于其声明之后文件中（或翻译单元）中的所有函数都是可见的。如果文件作用域变量具有外部链接，则它可以被程序中的其他翻译单元使用。如果文件作用域变量具有内部链接，则它仅可以在声明它的文件中使用。\n\
  \n***\n\n这是一个使用了所有五种存储类的短程序。它跨越两个文件（列表 12.5 和 列表 12.6），因此你必须进行多文件编译。（指导请参阅 第 9 章、“函数””或你的编译器手册。）它的主要目标是使用所有五种存储类型，而不是提供一种设计模型；更好的设计不需要文件作用域变量。\n\
  \n#### 列表 12.5 parta.c 文件\n\n点击此处查看代码图像\n\n***\n\n```c\n// parta.c --- 各种存储类\n\n\
  // 与 partb.c 一起编译\n\n#include <stdio.h>\n\nvoid report_count();\n\nvoid accumulate(int\
  \ k);\n\nint count = 0;      // 文件作用域，外部链接\n\nint main(void)\n{\n    int value;\
  \       // 自动变量\n    register int i;  // 寄存器变量\n    printf(\"Enter a positive integer\
  \ (0 to quit): \");\n    while (scanf(\"%d\", &value) == 1 && value > 0)\n    {\n\
  \        ++count;     // 使用文件作用域变量\n        for (i = value; i >= 0; i--)\n     \
  \       accumulate(i);\n        printf(\"Enter a positive integer (0 to quit): \"\
  );\n    }\n    report_count();\n    return 0;\n}\n\nvoid report_count()\n{\n   \
  \ printf(\"Loop executed %d times\\n\", count);\n}\n```\n\n***\n\n#### 列表 12.6 partb.c\
  \ 文件\n\n点击此处查看代码图像\n\n***\n\n```c\n// partb.c -- 程序剩余部分\n\n// 与 parta.c 一起编译\n\n\
  #include <stdio.h>\n\nextern int count;      // 引用声明，外部链接\nstatic int total = 0;\
  \   // 静态定义，内部链接\n\nvoid accumulate(int k); // 原型\nvoid accumulate(int k)  // k\
  \ 有块作用域，没有链接\n{\n    static int total = 0; // 静态，块作用域，没有链接\n    if (k <= 0)\n  \
  \  {\n        printf(\"subtotal: %d; total: %d\\n\", total, count);\n    }\n   \
  \ else\n    {\n        total += k;\n    }\n}\n```\n\n***\n\n在这个程序中，`static` 变量 `total`\
  \ 跟踪 `main()` 中 `while` 循环执行的次数。（顺便说，这是一个关于如何使用外部变量的良好示例，因为它不必要将 `parta.c` 的代码与\
  \ `partb.c` 的代码交叉在一起。）在 `parta.c` 中，`main()` 和 `report_count()` 共享对 `count` 的访问权限。\n\
  \n这是一个示例运行：\n\n点击此处查看代码图像\n\nEnter a positive integer (0 to quit): 5\nloop cycle:\
  \ 1\nsubtotal: 15; total: 15\nEnter a positive integer (0 to quit): 10\nloop cycle:\
  \ 2\nsubtotal: 55; total: 70\nEnter a positive integer (0 to quit): 2\nloop cycle:\
  \ 3\nsubtotal: 3; total: 73\nEnter a positive integer (0 to quit): 0\nLoop executed\
  \ 3 times\n\n#### 存储类与函数\n\n函数也有存储类。函数可以是外部的（默认）或静态的。（C99 增加了第三种可能性：内联函数，在第 16 章、“C\
  \ 预处理器和 C 标准库”讨论。）外部函数可以被其他文件中的函数访问，但静态函数只能在定义文件中使用。例如，考虑包含以下函数原型的文件：\n\n点击此处查看代码图像\n\
  \n```c\ndouble gamma(double);      /* 默认外部的 */\nstatic double beta(int, int);\n\
  extern double delta(double, int);\n```\n\n函数 `gamma()` 和 `delta()` 可以被程序中其他文件中的函数使用，但\
  \ `beta()` 则不能。由于这个 `beta()` 被限制在一个文件中，你可以在其他文件中使用相同名称的不同函数。使用 `static` 存储类的原因之一是创建对特定模块的私有函数，从而避免命名冲突的可能性。\n\
  \n在声明其他文件中定义的函数时，通常的做法是使用 `extern` 关键字。这种做法主要是为了清晰，因为除非使用了 `static` 关键字，否则函数声明假设是\
  \ `extern` 的。\n\n#### 哪种存储类？\n\n\n\n\n\n“使用哪种存储类？”这个问题的答案通常是“自动的（automatic）”。毕竟，否则为什么要把自动的设为默认值呢？是的，我们知道从表面上看，外部存储非常有具惑力。只需将所有变量都设为外部的，你就永远不用担心使用参数和指针在函数之间进行通信了。然而，这里存在一个微妙的陷阱。你不得不担心函数\
  \ `A()` 悄悄修改函数 `B()` 中使用的变量，尽管你的初意并非如此。多年来集体计算机经验中不容置疑的证据表明，这种微妙的危险远比不加区分使用外部存储带来的浅层吸引力要大得多。\n\
  \n一个常见的例外是 `const` 数据。因为它们不能被修改，所以你不需要担心意外的修改：\n\n点击此处查看代码图像\n\n```c\nconst int\
  \ DAYS = 7;\n\nconst char * MSGS[3] = {\"Yes\", \"No\", \"Maybe\"};\n```\n\n防御性编程的黄金法则之一是“知之所需的”原则。尽可能让每个函数的内部实现对该函数私有，只共享那些必要的变量。其他类也是有用的，并且是可用的。但在使用它们之前，先问问自己是否有必要。\n\
  \n### 随机数函数和静态变量\n\n现在你已经对不同的存储类有了一些了解，让我们来看两个使用了其中一些类的程序。首先，让我们看一个使用具有内部链接（internal\
  \ linkage）静态变量的函数：随机数函数。ANSI C 库提供了 `rand()` 函数来生成随机数。生成随机数的算法有多种，ANSI C 允许实现层针对特定机器使用最佳算法。然而，ANSI\
  \ C 标准还提供了一种标准的、可移植的算法，可以在不同系统上产生相同的随机数。实际上，`rand()` 是一个“伪随机数生成器”，这意味着的数字序列是可预测的（计算机并不以自发性闻名），但这些数字在可能的数值范围内分布得很均匀。\n\
  \n我们将不会使用编译器内置的 `rand()` 函数，而是将使用可移植的 ANSI 版本，以便你可以看到内部发生了什么。该方案从一个被称为“种子（seed）”的数字开始。函数使用种子产生一个新数字，这个数字变成新种子。然后新种子可以产生更新的种子，以此此类推。为了让该方案正常工作，随机数函数必须记住它上一次调用时使用的种子。啊！这需要一个静态变量。列表\
  \ 12.7 是版本 0。（是的，版本 1 很快就会。）\n\n#### 列表 12.7 rand0.c 函数文件\n\n点击此处查看代码图像\n\n```c\n\
  /* rand0.c --产生随机数              */\n/*              ANSI C 可移植算法  */\nstatic unsigned\
  \ long int next = 1;  /* 种子 */\nint rand0(void)\n{\n    /* 生成伪随机数的魔术公式 */\n    next\
  \ = next * 1103515245 + 12345;\n    return (unsigned int) (next/65536) % 32768;\n\
  }\n```\n\n在列表 12.7 中，静态变量 `next` 从值 `1` 开始，每次调用函数时都会通过魔术公式进行修改。结果是在 `0` 到 `32767`\
  \ 范围内的某个返回值。注意 `next` 是具有内部链接的静态变量，而不仅仅是无链接的静态变量。这是因为示例稍后会扩展，使得 `next` 在同一个文件的两个函数之间共享。\n\
  \n让我们尝试用列表 12.8 所示的简单驱动程序运行 `rand0()` 函数。\n\n#### 列表 12.8 r_drive0.c 驱动程序\n\n点击此处查看代码图像\n\
  \n```c\n/* r_drive0.c -- 测试 rand0() 函数 */\n/* 使用 rand0.c 编译 */\n#include <stdio.h>\n\
  extern int rand0(void);\nint main(void)\n{\n    int count;\n    for (count = 0;\
  \ count < 5; count++)\n        printf(\"%d\\n\", rand0());\n    return 0;\n}\n```\n\
  \n这里又是一个练习使用多个文件的机会。使用一个文件对应列表 12.7，另一个文件对应列表 12.8。`extern` 关键字提醒你 `rand0()` 定义在单独的文件中，但不是强制要求的。\n\
  \n输出是：\n16838\n5758\n10113\n17515\n31051\n输出看起来是随机的，但让我们再次运行它。这次的结果如下：\n16838\n\
  5758\n10113\n17515\n31051\n嗯，这看起来很眼熟；这就是“伪” Aspects。每次运行主程序，你都从相同的种子 1 开始。你可以通过引入第二个名为\
  \ `srand1()` 的函数来解决这个问题，该函数允许你重置种子。技巧是让 `next` 成为一个只有 `rand1()` 和 `srand1()` 知道的内部链接静态变量。（C\
  \ 库中 `srand1()` 的对应物是 `srand()`。）将 `srand1()` 添加到包含 `rand1()` 的文件中。列表 12.9 是修改后的版本。\n\
  \n#### 列表 12.9 s_and_r.c 程序\n\n点击此处查看代码图像\n\n```c\n/* s_and_r.c -- 用于 rand1() 和\
  \ srand1() 的文件 */\n/*              ANSI C 可移植算法 */\nstatic unsigned long int next\
  \ = 1;  /* 种子 */\nint rand1(void)\n{\n    /* 生成伪随机数的魔术公式 */\n    next = next * 1103515245\
  \ + 12345;\n    return (unsigned int) (next/65536) % 32768;\n}\nvoid srand1(unsigned\
  \ int seed)\n{\n    next = seed;\n}\n```\n\n注意 `next` 是一个文件作用的静态变量。这意味着它可以被 `rand1()`\
  \ 和 `srand1()` 使用，但不能被其他文件使用。要测试这些函数，使用列表 12.10 中的驱动程序。\n\n#### 列表 12.10 r_drive1.c\
  \ 程序\n\n点击此处查看代码图像\n\n```c\n/* r_drive1.c -- 测试 rand1() 和 srand1() */\n/* 使用 s_and_r.c\
  \ 编译 */\n#include <stdio.h>\nextern void srand1(unsigned int);\nextern int rand1(void);\n\
  int main(void)\n{\n    int count;\n    unsigned seed;\n    printf(\"输入种子：\\n\");\n\
  \    while (scanf(\"%u\", &seed) == 1)\n    {\n        srand1(seed);   /* 重置种子 */\n\
  \        for (count = 0; count < 5; count++)\n            printf(\"%d\\n\", rand1());\n\
  \        printf(\"下一个种子（q 退出）：\\n\");\n    }\n    printf(\"完成\\n\");\n    return\
  \ 0;\n}\n```\n\n再次使用两个文件，并运行程序。\n\n点击此处查看代码图像\n\n输入种子：\n1\n16838\n5758\n10113\n\
  17515\n31051\n下一个种子（q 退出）：\n513\n20067\n23475\n8955\n20841\n15324\n下一个种子（q 退出）：\n\
  q\n完成\n\n对于 `seed` 使用值 `1` 会产生之前相同的值，但 `seed` 值 `3` 会产生新的结果。\n\n### 注意：自动重新种子\n\n\
  如果你的 C 实现允许访问某些变化的量（例如系统时钟），你可以使用该值（可能会截断）来初始化种子值。例如，ANSI C 有一个 `time()` 函数返回系统时间。时间单位取决于系统，但我们在这里关心的是返回值是一个算术类型，且其值随时间变化。确切类型取决于系统并标记为\
  \ `time_t`，但你可以使用类型转换。基本设置如下：\n\n点击此处查看代码图像\n\n```c\n#include <time.h>  /* time()\
  \ 的 ANSI 原型 */\nsrand1((unsigned int) time(0));  /* 初始化种子 */\n```\n\n通常，`time()`\
  \ 接收一个参数，即 `time_t` 类型对象的地址。在这种情况下，时间值也存储在该地址。然而，你可以传递空指针（`0`）作为参数，此时值仅通过返回值机制提供。\n\
  \n\n\n\n\n你可以将相同的技术运用于标准的 ANSI C 函数 `srand()` 和 `rand()`。如果你确实使用这些函数，请包含 `stdlib.h`\
  \ 头文件。事实上，既然你已经看到了 `srand1()` 和 `rand1()` 如何使用具有内部链接（internal linkage）的静态变量，你不妨直接使用编译器提供的版本。我们将在下一个示例中这样做。\n\
  \n## 掷骰（Roll ’Em）\n\n我们将模拟那种非常受欢迎的随机活动：掷骰。最流行的掷骰形式是使用两颗六面骰，但也有其他可能性。许多冒险幻想游戏会使用所有五种几何上可能的骰子：4\
  \ 面、6 面、8 面、12 面和 20 面。聪明的古希腊人证明了世界上只有五种面形状和大小完全相同的正多面体，而这些多面体就是各种骰子的基础。你可以制作其他面数的骰子，但它们的面形状不会都完全相同，因此它们出现的几率并不一定相等。\n\
  \n计算机计算不受这些几何因素的限制，因此我们可以设计出具有任意面数的电子骰子。让我们从六面骰开始，然后进行泛化。\n\n我们需要一个 1 到 6 之间的随机数。然而，`rand()`产生的是\
  \ 0 到 `RAND_MAX` 之间的整数；`RAND_MAX` 定义在 `stdlib.h` 中，它通常是 `INT_MAX`。因此，我们需要做一些调整。这里有一种方法：\n\
  \n1. 将随机数对 6 取模。它会产生一个 0 到 5 之间的整数。\n2. 加 1。新数字在 1 到 6 范围内。\n3. 为了泛化，只需将第 1 步中的数字\
  \ 6 替换为面数即可。\n\n以下代码实现了这些思想：\n\n点击此处查看代码图像\n\n```c\n#include <stdlib.h>   /* for\
  \ rand() */\n\nint rollem(int sides)\n{\n    int roll;\n    roll = rand() % sides\
  \ + 1;\n    return roll;\n}\n```\n\n让我们再更有野心一点，编写一个允许你掷出任意数量骰子并返回总点数的函数。列表 12.11\
  \ 实现了此功能。\n\n列表 12.11 diceroll.c 文件\n\n点击此处查看代码图像\n\n```c\n/* diceroll.c -- 骰子 simulation\
  \ */\n/* compile with mandydice.c             */\n#include \"diceroll.h\"\n#include\
  \ <stdio.h>\n#include <stdlib.h>               /* for library rand()    */\nint\
  \ roll_count  = 0;           /* external linkage    */\nstatic int rollem(int sides)\
  \  /* private to this file */\n{\n    int roll;\n    roll = rand() % sides + 1;\n\
  \    ++roll_count;               /* count function calls */\n    return roll;\n\
  }\nint roll_n_dice(int dice, int sides)\n{\n    int d;\n    int total = 0;\n   \
  \ if (sides < 2)\n    {\n        printf(\"Need at least 2 sides.\\n\");\n      \
  \  return -2;\n    }\n    if (dice < 1)\n    {\n        printf(\"Need at least 1\
  \ die.\\n\");\n        return -1;\n    }\n    for (d = 0; d < dice; d++)\n     \
  \   total += rollem(sides);\n    return total;\n}\n```\n\n这个文件增加了一些变化。首先，它将 `rollem()`\
  \ 变成一个该文件的私有函数。它是作为 `roll_n_dice()` 的辅助函数。其次，为了说明外部链接（external linkage）是如何工作的，该文件声明了一个名为\
  \ `roll_count` 的外部变量。该变量记录了 `rollem()` 函数被调用的次数。这个示例有些牵强，但它展示了外部变量功能的工作原理。\n\n第三，该文件包含以下语句：\n\
  \n`#include \"diceroll.h\"`\n\n当你使用如 `rand()` 等标准函数时，你包含的是标准头文件（`rand()` 使用 `stdlib.h`）而不是声明该函数。这是因为头文件包含了正确的声明。我们将通过提供一个与\
  \ `roll_n_dice()` 函数配合使用的 `diceroll.h` 头文件来模拟这种方法。用引号而不是角括号括围文件名，是指示编译器在本地查找，而不是在编译器用于头文件的标准位置查找。“本地查找”的含义取决于实现。一些常见的解释是将头文件放在与源代码相同的目录中，或者放在项目文件相同的目录下（如果你的编译器使用它们的话）。列表\
  \ 12.2\n\n```c\n// diceroll.h\nextern int roll_count;\nint roll_n_dice(int dice,\
  \ int sides);\n```\n\n此头文件包含函数原型和一个 `extern` 。由于 `diceroll.c` 文件包含了此头文件，`diceroll.c`\
  \ 包含了两个关于 `roll_count` 的声明：\n\n`extern int roll_count;` // 来自头文件\n`int roll_count\
  \ = 0;` // 来自源文件\n\n这是可以的。你只能对变量进行一次定义。但带有 `extern` 的声明是引用声明，你可以有任意数量的。使用 `roll_n_dice()`\
  \ 的程序也应该包含此文件。这不仅提供了 `roll_n_dice()` 的原型，还让 `roll_count` 对程序可用。列表 12.13\n\n```c\n\
  /* manydice.c -- 多骰子模拟 */\n/* compile with diceroll.c             */\n#include <stdio.h>\n\
  #include <stdlib.h>             /* for srand() */\n#include <time.h>           \
  \    /* for time()    */\n#include \"diceroll.h\"           /* for roll_n_dice()\
  \  */\n/* and for roll_count  */\nint main(void)\n{\n    int dice,roll;\n    int\
  \ sides;\n    srand((unsigned int) time(0)); /* randomize seed      */\n    printf(\"\
  输入每个骰子的面数，0 停止。\\n\");\n    while (scanf(\"%d\", &sides) == 1 && sides > 0 )\n \
  \   {\n        printf(\"掷几个骰子？\\n\");\n        if ((status =scanf(\"%d\", &dice))\
  \ != 1)\n        {\n            if (status == EOF)\n                break;     \
  \      /* exit loop          */\n            else\n            {\n             \
  \   printf(\"你应该输入一个整数。\");\n            }\n            printf(\" 让我们重新开始。\\n\"\
  );\n            while (getchar() != '\\n')\n                continue;\n        }\n\
  \        printf(\"你使用%d 面骰子掷出了总数%d。\\n\", sides, roll_n_dice(dice, sides));\n  \
  \  }\n    printf(\"rollem() 函数被调用了 %d 次。\\n\", roll_count);\n    printf(\"祝你好运！\\\
  n\");\n    return 0;\n}\n```\n\n\n\n\n由于程序使用了 `srand()` 来随机化随机数种子，即使输入相同，你可能也不会获得相同的输出。注意，`manydice.c`\
  \ 中的 `main()` 函数确实可以访问在 `diceroll.c` 中定义的 `roll_count` 变量。\n\n外部 `while` 循环有三种终止原因：`sides`\
  \ 小于 1、输入类型不匹配（`scanf()` 返回值为 `0`）或遇到文件末尾（返回值为 `EOF`）。在读取骰子数量时，程序处理文件末尾的方式与处理类型不匹配的方式不同：在前者它会退出\
  \ `while` 循环，而在后者它会启动一个新的循环周期。\n\n你可以以多种方式使用 `roll_n_dice()`。当 `sides` 等于 2 时，程序会模拟掷硬币，其中“正面”为\
  \ 2，“反面”为 1（或者如果你真的喜欢，也可以反过来）。你可以轻松地修改程序以显示单个结果以及总和，或者构建一个骰子模拟器。如果你需要大量的掷骰（如某些角色扮演游戏），你可以轻松地修改程序以产生如下输出：\n\
  \n点击此处查看代码图片\n\n输入组数；输入 q 停止。\n\n18\n\n多少面？几个骰子？\n\n6 3\n\n这里有 18 组 3 次六面骰的掷结果。\n\
  \n  12  10   6   9   8  14   8  15   9  14  12  17  11    7  10\n\n  13    8  14\n\
  \n多少组？输入 q 停止。\n\nq\n\n`rand1()` 或 `rand()` 的另一个用途（但不是 `roll()`）是创建一个猜数字程序，让电脑选择而由你来猜。你可以自己尝试一下。\n\
  \n### 分配内存：`malloc()` 和 `free()`\n\n我们讨论过的存储类有一个共同点。在你决定使用哪种存储类之后，关于作用域和存储生存期的决定会自动产生。你的选择遵循预设的内存管理规则。然而，还有一种选择，一种给你更多灵活性的选择。那个选择就是使用库函数来分配和管理内存。\n\
  \n首先，让我们回顾一下关于内存分配的一些事实。所有程序都必须留出足够的内存来存储它们所使用的数据。部分内存分配是自动完成的。例如，你可以声明：\n\n点击此处查看代码图片\n\
  \n```c\nfloat x;\nchar place[] = \"Dancing Oxen Creek\";\n```\n\n并留出足够的内存来存储该 `float`\
  \ 或字符串，或者你可以更显式地请求特定数量的内存：\n\n```c\nint plates[100];\n```\n\n此声明留出了 100 个内存位置，每个位置都适合存储一个\
  \ `int` 值。在所有这些情况下，声明还为内存提供了一个标识符，因此你可以使用 `x` 或 `place` 来标识数据。记住，静态数据是在程序加载到内存时分配的，而自动数据在程序执行进入一个块时分配，在执行离开该块时释放。\n\
  \nC 语言超出了此限制。你可以在程序运行时分配更多内存。主要的工具是 `malloc()` 函数，它接受一个参数：你想要的内存字节数。然后 `malloc()`\
  \ 会找到一个合适的空内存块。该内存是匿名的；也就是说，`malloc()` 分配了内存但没有给它分配名称。然而，它确实返回了该块第一个字节的地址。因此，你可以将该地址赋值给指针变量并使用该指针访问内存。由于\
  \ `char` 代表一个字节，`malloc()` 传统上被定义为指向 `char` 的指针类型。但是，从 ANSI C 标准开始，C 使用了一句新类型：指向\
  \ `void` 的指针。这种类型旨在作为一种“通用指针”。`malloc()` 函数可以用于返回指向数组、结构体等的指针，因此通常返回值会被强制转换为适当的值。在\
  \ ANSI C 下，为了清晰起见，你仍然应该进行类型转换，但将指向 `void` 的指针值赋值给其他类型的指针不被视为类型冲突。如果 `malloc()` 未能找到所需的空间，它将返回空指针（null）。\n\
  \n让我们 `malloc()` 应用于创建数组的任务。你可以使用 `malloc()` 在程序运行时请求一块存储空间。你还需要一个指针来跟踪该块在内存中的位置。例如，考虑这段代码：\n\
  \n点击此处查看代码图片\n\n```c\ndouble * ptd;\nptd = (double *) malloc(30 * sizeof(double));\n\
  ```\n\n这段代码请求了 30 个 `double` 类型值的空间，并将 `ptd` 指向该位置。注意 `ptd` 被声明为指向单个 `double` 的指针，而不是指向\
  \ 30 个 `double` 值的块。记住，数组的名字是其第一个元素的地址。因此，如果你让 `ptd` 指向块的第一个元素，你像使用数组一样使用它。\n\n\n\
  \n\n通过使用 `malloc()`，程序可以决定所需的数组大小并在程序运行时创建它。列表 12.14 阐述了这种可能性。它将内存块的地址赋值给指针 `ptd`，然后像使用数组名一样的方式使用\
  \ `ptd`。此外，如果内存分配失败，会调用在 `stdlib.h` 中声明原型的 `exit()` 函数来终止程序。该头文件中也定义了值 `EXIT_FAILURE`。C\
  \ 语言语言标准提供了两个保证在所有操作系统上都能运行的返回值：`EXIT_SUCCESS`（或等同于值 `0`）表示程序正常终止，以及 `EXIT_FAILURE`\
  \ 表示异常终止。包括 Unix、Linux 和 Windows 在内的某些操作系统可以接受表示特定形式失败的额外整数值。\n\n列表 12.14 `dyn_arr.c`\
  \ 程序\n\n点击此处查看代码图像\n\n```c\n/* dyn_arr.c -- 动态分配数组 */\n\n#include <stdio.h>\n\n\
  #include <stdlib.h> /* 用于 malloc(), free() */\n\nint main(void)\n{\n    double *\
  \ ptd;\n    int max = 0;\n    int number;\n    int i = 0;\n    puts(\"What is the\
  \ maximum number of type double entries?\");\n    if (scanf(\"%d\", &max) != 1)\n\
  \    {\n        puts(\"Number not correctly entered -- bye.\");\n        exit(EXIT_FAILURE);\n\
  \    }\n    ptd = (double *) malloc(max * sizeof (double));\n    if (ptd == NULL)\n\
  \    {\n        puts(\"Memory allocation failed. Goodbye.\");\n        exit(EXIT_FAILURE);\n\
  \    }\n    /* ptd 现在指向一个包含 max 个元素的数组 */\n    puts(\"Enter the values (q to quit):\"\
  );\n    while (i < max && scanf(\"%lf\", &ptd[i]) == 1)\n        ++i;\n    printf(\"\
  Here are your %d entries:\\n\", number = i);\n    for (i = 0; i < number; i++)\n\
  \    {\n        printf(\"%7.2f \", ptd[i]);\n        if (i % 7 == 6)\n         \
  \   putchar('\\n');\n    }\n    if (i % 7 != 0)\n        putchar('\\n');\n    puts(\"\
  Done.\");\n    free(ptd);\n    return 0;\n}\n```\n\n这是一个示例运行。在其中，我们输入了六个数字，但程序只处理了五个，因为我们将数组大小限制为\
  \ 5。\n\n点击此处查看代码图像\n\nWhat is the maximum number of entries?\n5\nEnter the values\
  \ (q to quit):\n20 30 35 25 40 80\nHere are your 5 entries:\n  20.00   30.00   35.00\
  \   25.00   40.00\nDone.\n\n让我们来看代码。程序通过以下几行找到所需的数组大小：\n\n点击此处查看代码图像\n\n```c\nif\
  \ (scanf(\"%d\", &max) != 1)\n{\n    puts(\"Number not correctly entered -- bye.\"\
  );\n    exit(EXIT_FAILURE);\n}\n```\n\n接下来，下一行分配了足够的空间来存放请求数量的条目，然后将内存块的地址赋值给指针\
  \ `ptd`：\n\n点击此处查看代码图像\n\n```c\nptd = (double *) malloc(max * sizeof (double));\n\
  ```\n\n在 C 中转换为 `(double *)` 是可选的，但在 C++ 中是必须的，因此使用类型转换使得程序从 C 迁移到 C++ 变得更加简单。\n\
  \n`malloc()` 可能无法获取所需的内存。在这种情况下，函数返回空指针，程序终止：\n\n点击此处查看代码图像\n\n```c\nif (ptd ==\
  \ NULL)\n{\n    puts(\"Memory allocation failed. Goodbye.\");\n    exit(EXIT_FAILURE);\n\
  }\n```\n\n如果程序越过了这个障碍，就可以将 `ptd` 视为一个包含 `max` 个元素的数组名，而它确实是这样做的。注意程序末尾的 `free()`\
  \ 函数。它释放了由 `malloc()` 分配的内存。`free()` 函数只释放其参数指向的内存块。某些操作系统会在程序结束时自动释放分配的内存，而其他可能不会。因此请使用\
  \ `free()`，不要依赖操作系统为你清理。\n\n使用动态数组你获得了什么？在这种情况下，你获得了灵活性。假设你知道大多数时候程序不需要超过 100 个元素，但有时需要\
  \ 10000 个。如果你声明一个数组，你就必须考虑最坏情况并声明为 10,000 个元素。大多数时候，该程序都会浪费内存。而当你唯一一次需要 10001 个元素时，程序将会失败。你可以使用动态数组根据情况调整程序。\n\
