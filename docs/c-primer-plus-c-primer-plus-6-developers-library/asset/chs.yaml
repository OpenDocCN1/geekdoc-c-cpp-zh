  \ 更多功能：\n- Image 更多功能：\n- Image 更多功能：\n- Image 更多功能：\n- Image 更多功能：\n\n### 程序翻译的第一步骤\n\
  \n编译器必须将程序通过若干阶段。它从字符映射到字符集开始。这处理了多字节字符和三字符组（trigraphs）——这些扩展扩大了外部表示。（参考第 VII 节\
  \ 提供了这些扩展的概述。）\n\n其次，编译器找到每个反斜杠后跟换行并将其删除。也就是说，如下两个物理行\n\n```c\nprintf(\"That's wond\n\
  ```\n\n被转换为单个*逻辑行*。注意，在此境下，“换行字符”是指按下 Enter 键产生的字符；它不是符号表示 `\\n`。\n\n此功能对于预处理准备很有用，因为预处理表达式要求是一行长的，但该逻辑行可以超过一个物理行。\n\
  \n接下来，编译器将文本拆分为预处理标记序列以及空白序列和注释。（在基本术语中，标记通过空格、制表符或换行符分开；本章将详细查看标记。）现在的一个感兴趣点是，每个注释都被替换为空格。此外，实现可能会选择将每个空白序列（换行外的）替换为空格。最后，程序准备好预处理阶段，预处理器寻找由行首\
  \ `#` 符号指示的预处理器指令。\n\n### 定义常量 #define\n\n`#define` 预处理器指令像所有预处理器指令一样，以行头的 `#` 符号开始。ANSI\
  \ 及后续标准允许 `#` 符号前有空格或制表符，并允许 `#` 与指令其余部分之间有空格。然而，旧版本的 C 通常要求指令从左边界开始，且 `#` 与指令其余部分之间没有空格。指令可以出现在源文件的任何地方，定义从其出现处一直持续到文件结束。我们在程序中大量使用指令来定义符号常量或*定义*常量，但它们的范围比此更广，正如我们将展示的。列表\
  \ 16.1 展示了 `#define` 指令的一些可能性和属性。\n\n\n\n\n预处理器指令一直运行到 `#` 之后的第一个换行符为止。这意味着一个指令的长度被限制为一行。然而，如前面提到的，反斜杠/换行符组合在预处理开始之前会被删除，因此你可以将指令跨越多个物理行。但是，这些物理行构成了单一的逻辑行。\n\
  \n### 列表 16.1 preproc.c 程序\n\n点击此处代码图像\n\n```c\n/* preproc.c -- simple preprocessor\
  \ examples */\n\n#include <stdio.h>\n\n#define TWO 2         /* 如果你愿意，可以使用注释   */\n\
  \n#define OW \"Consistency is the last refuge of the unimagina\\\ntive. - Oscar\
  \ Wilde\" /* 反斜杠将定义延续 */\n                           /* 到下一行             */\n\n\
  #define FOUR  TWO*TWO\n\n#define PX printf(\"X is %d.\\\n\nint main(void)\n{\n \
  \   int x = TWO;\n    PX;\n    x = FOUR;\n    printf(FMT, x);\n    printf(\"%s\\\
  n\", OW);\n    printf(\"TWO: OW\\n\");\n    return 0;\n}\n```\n\n每个 `#define` 行（即逻辑行）都包含三个部分。第一部分是\
  \ `#define` 指令本身。第二部分是你选择的缩写，称为*宏*（macro）。某些宏（如这些示例所示）表示值；它们被称为*对象类宏*（object-like\
  \ macros）。（C 还有*函数类宏*（function-like macros），我们稍后会介绍它们）。宏名称不能包含空格，并且必须遵循与 C 变量相同的命名规则：只能使用字母、数字和下划线（`_`）字符，第一个字符不能是数字。第三部分（行的剩余部分）称为*替换列表*（replacement\
  \ list）或*体*（body）（参见图 16.1）。当预处理器在程序中找到你的宏的实例时，它几乎总是将其替换为体。（有一个例外，我们稍后会向你展示。）这种从宏到最终替换的过程被称为*宏展开*（macro\
  \ expansion）。注意，你可以在 `#define` 行上使用标准的 C 注释；如前提到的，每个注释在预处理器看到之前会被替换为空格。\n\n![图像](img/16fig01.jpg)\n\
  \n图 16.1 对象类宏定义的组成部分。\n\n让我们运行示例并看看它是如何工作的：\n\n点击此处代码图像\n\n```\nX is 2.\nX is 4.\n\
  Consistency is the last refuge of the unimaginative. - Oscar Wilde\nTWO: OW\n```\n\
  \n这里发生了什么。语句\n\n```c\nint x = TWO;\n```\n\n变为\n\n```c\nint x = 2;\n```\n\n因为 `TWO`\
  \ 被替换为 `2`。然后，语句\n\n```c\nPX;\n```\n\n变为\n\n```c\nprintf(\"X is %d.\\n\", x);\n\
  ```\n\n因为进行了这种整体替换。这是一个新花样，因为到目前为止我们只使用宏来表示常量。在这里你看到宏可以表示任何字符串，甚至是一个完整的 C 表达式。然而，请注意，这是一个这是一个常量字符串；`PX`\
  \ 只打印名为 `x` 的变量。\n\n下一行也代表了新内容。你可能认为 `FOUR` 被替换为 `4`，但实际过程是：\n\n```c\nx = FOUR;\n\
  ```\n\n变为\n\n```c\nx = TWO*TWO;\n```\n\n然后变为\n\n```c\nx = 2*2;\n```\n\n宏展开过程到此结束。实际的乘法并不是发生在预处理器工作时，而是在编译期间，因为\
  \ C 编译器在编译时评估所有的常量表达式（仅包含常量的表达式）。预处理器不进行任何计算；它只是字面上地执行建议的替换。\n\n注意，宏定义可以包含其他宏。（某些编译器不支持这种嵌套功能。）\n\
  \n在下一行中\n\n```c\nprintf (FMT, x);\n```\n\n变为\n\n```c\nprintf(\"X is %d.\\n\",x);\n\
  ```\n\n因为 `FMT` 被替换为相应的字符串。如果你有一个需要使用多次的长型控制字符串，这种方法可能会非常方便。或者，你可以执行以下操作：\n\n点击此处代码图像\n\
  \n```c\nconst char * fmt = \"X is %d.\\n\";\n```\n\n然后你就可以使用 `fmt` 作为 `printf()`\
  \ 的控制字符串。\n\n在下一行中，`OW` 被替换为相应的字符串。双引号使得替换字符串成为字符字符串常量。编译器将将其存储在一个以空字符终止的数组中。因此，\n\
  \n```c\n#define HAL 'Z'\n```\n\n定义了一个字符常量，但\n\n```c\n#define HAP \"Z\"\n```\n\n\
  定义了一个字符字符串：`Z\\O`。\n\n在示例中，我们在行尾之前立即使用了一个反斜杠：\n\n点击此处代码图像\n\n```c\n#define OW \"\
  Consistency is the last refuge of the unimagina\\\ntive. - Oscar Wilde\"\n```\n\n\
  \n\n一个将主体解释为字符字符串的预处理器会将 `EIGHT` 替换为 `4 * 8`。也就是说，额外的空格将是替换内容的一部分；但一个将主体解释为标记（tokens）的预处理器会将\
  \ `EIGHT` 替换为三个由单个空格分隔的标记：`4 * 8`。换句话说，字符字符串解释将空格视为主体的一部分，而标记解释则将空格视为主体标记之间的分隔符。在实践中，某些\
  \ C 编译器将宏主体视为字符串而非标记。这种区别对于比我们在这里尝试的用法更复杂的用法具有实际意义。\n\n顺便提一下，C 编译器对标记的理解比预处理器更复杂。编译器理解\
  \ C 的规则，并不一定要求使用空格来分隔标记。例如，C 编译器会将 `2*2` 视为三个标记，因为它识别出每个 `2` 都是常量，而 `*` 是运算符。\n\n\
  ## 重新定义常量\n\n假设你将 `LIMIT` 定义为 20，然后在同一个文件的后面再次将其定义为 25。这个过程被称为`重新定义常量`。不同的实现对重新定义的策略不相同。有些实现认为这是一个错误，除非新定义与旧定义相同。另一些实现则允许重新定义，或许会发出警告。ANSI\
  \ 标准采取第一种观点，仅当新定义与旧定义重复时才允许重新定义。\n\n相同的定义意味着主体必须以相同的顺序具有相同的标记。因此，这两个定义是达成一致的：\n\n\
  ```c\n#define SIX 2 * 3\n#define SIX 2          *   3\n```\n\n它们都具有相同的三个标记，额外的空格不是主体的一部分。下一个定义被认为是不同的：\n\
  \n```c\n#define SIX 2*3\n```\n\n它只有一个标记，而不是三个，所以它不匹配。如果你想重新定义一个宏，请使用 `#undef` 指令，我们稍后会讨论。\n\
  \n如果你确实有需要重新定义的常量，使用 `const` 关键字和作用域规则来实现这一目的可能会更容易。\n\n## 在 #define 中参数\n\n通过使用参数，你可以创建看起来和行为都非常像运行的`类函数宏`。带有参数的宏看起来与函数非常相似，因为参数封装在括号内。类函数宏的定义在括号内有一个或多个参数，这些参数随后出现在替换部分，如图\
  \ 16.2 所示。\n\n![Image](img/16fig02.jpg)\n\n图 16.2 类函数宏定义的各个部分。\n\n这是一个示例定义：\n\n\
  ```c\n#define SQUARE(X) X*X\n```\n\n它可以像这样在程序中使用：\n\n```c\nz = SQUARE(2);\n```\n\
  \n这看起来像是一个函数调用，但它的行为并不一定完全相同。列表 16.2 说明了如何使用这个宏和第二个宏。某些示例还指出了可能的陷阱，因此请仔细阅读。\n\n\
  列表 16.2 程序 `mac_arg.c`\n\n点击此处此处查看代码图像\n\n***\n\n```c\n/* mac_arg.c -- 带有参数的宏 */\n\
  #include <stdio.h>\n\n#define SQUARE(X) X*X\n\n#define PR(X)   printf(\"The result\
  \ is %d.\\n\", X)\n\nint main(void)\n{\n    int x = 5;\n    int z;\n    printf(\"\
  x = %d\\n\", x);\n    z = SQUARE(x);\n    printf(\"Evaluating SQUARE(x): \");\n\
  \    PR(z);\n    z = SQUARE(2);\n    printf(\"Evaluating SQUARE(2): \");\n    PR(z);\n\
  \    printf(\"Evaluating SQUARE(x+2): \");\n    PR(SQUARE(x+2));\n    printf(\"\
  Evaluating 100/SQUARE(2): \");\n    PR(100/SQUARE(2));\n    printf(\"x is %d.\\\
  n\", x);\n    printf(\"Evaluating SQUARE(++x): \");\n    PR(SQUARE(++x));\n    printf(\"\
  After incrementing, x is %x.\\n\", x);\n    return 0;\n}\n```\n\n***\n\n（注：原文此处存在大量重复段落，已保留核心逻辑翻译）\n\
  \n在这里，`SQUARE` 是宏标识符，`SQUARE(X)` 中的 `X` 是宏参数，而 `X*X` 是替换列表。在列表 16.2 中任何出现 `SQUARE(x)`\
  \ 的地方，它都会替换为 `x*x`。这与之前的示例不同之处，在使用此宏时，你可以自由使用 `x` 以外的符号。宏定义中的 `x` 被该符号替换。\n\n##\
  \ 从宏参数创建字符串：# 运算符\n\n这是一个类函数宏：\n\n点击此处查看代码图像\n\n```c\n#define PSQR(X)  printf(\"\
  The square of X is %d.\\n\", ((X)*(X)));\n```\n\n假设你像这样使用该宏：\n\n```c\nPSQR(8);\n\
  ```\n\n这是输出结果：\n\n\n\n\n`X` 的平方是 64。\n\n请注意，引用字符串中的 `X` 被视为普通文本，而不是可以被替换的标记（token）。\n\
  \n假设你确实想在字符串中包含宏参数。C 语言允许你这样做。在类函数宏的替换部分中，`#` 符号变成一个预处理运算符，它能将标记（tokens）转换为字符串常量。例如，假设\
  \ `x` 是一个宏参数，那么 `#x` 就是将该参数名转换为字符串 `\"x\"`。这个过程被称为*字符串化*（stringizing）。列表 16.3 阐述了该过程是如何工作的。\n\
  \n### 列表 16.3 subst.c 程序\n\n点击此处查看代码图像\n\n```c\n/* subst.c -- 在字符串中替换 */\n\n#include\
  \ <stdio.h>\n\n#define PSQR(x) printf(\"The square of \" #x \" is %d.\\n\",((x)*(x)))\n\
  \nint main(void)\n{\n    int y = 5;\n    PSQR(y);\n    PSQR(2 + 4);\n    return\
  \ 0;\n}\n```\n\n输出如下：\nThe square of y is 25.\nThe square of 2 + 4 is 36.\n\n在宏的第一次调用中，`#x`\
  \ 被替换为 `\"y\"`；在第二次调用中，`#x` 被替换为 `\"2 + 4\"`。随后，ANSI C 字符串拼接将这些字符串与 `printf()` 语句中的其他字符串合并，生成最终最终使用的字符串。例如，第一次调用变为：\n\
  \n点击此处查看代码图像\n\n```c\nprintf(\"The square of \" \"y\" \" is %d.\\n\",((y)*(y)));\n\
  ```\n\n然后，字符串拼接将这三个相邻的字符串转换为一个字符串：\n\"The square of y is %d.\\n\"\n\n#### 预处理器粘合剂：##\
  \ 运算符\n\n与 `#` 运算符类似，`##` 运算符也可以用于类函数宏的替换部分。此外，它还可以用于对象类宏的替换部分。`##` 运算符将两个标记合并为一个单一标记。例如，你可以执行以下操作：\n\
  \n```c\n#define XNAME(n) x ## n\n```\n\n那么宏 `XNAME(4)` 就会展开为：\n`x4`\n\n列表 16.4 使用了这种宏以及另一个使用\
  \ `##` 的宏来完成一些标记粘合。\n\n### 列表 16.4 glue.c 程序\n\n点击此处查看代码图像\n\n```c\n// glue.c --\
  \ 使用 ## 运算符\n\n#include <stdio.h>\n\n#define XNAME(n) x ## n\n\n#define PRINT_XN(n)\
  \ printf(\"x\" #n \" = %d\\n\", x ## n);\n\nint main(void)\n{\n    int XNAME(1)\
  \ = 14;  // 变为 int x1 = 14;\n    int XNAME(2) = 20;  // 变为 int x2 = 20;\n    int\
  \ x3 = 30;\n    PRINT_XN(1);        // 变为 printf(\"x1 = %d\\n\", x1);\n    PRINT_XN(2);\
  \        // 变为 printf(\"x2 = %d\\n\", x2);\n    PRINT_XN(3);        // 变为 printf(\"\
  x3 = %d\\n\", x3);\n    return 0;\n}\n```\n\n输出如下：\nx1 = 14\nx2 = 20\nx3 = 30\n\n\
  注意 `PRINT_XN()` 宏如何使用 `#` 运算符组合字符串，并使用 `##` 运算符将标记组合为一个新的标识符。\n\n#### 可变宏：... 和\
  \ __VA_ARGS__\n\n某些函数（例如 `printf()`）接受数量数量参数。本章稍后讨论的 `stdvar.h` 头文件提供了创建数量数量参数的用户定义函数的工具。C99/C11\
  \ 对宏也采取同样的操作。虽然在标准中未使用，但 *variadic*（可变的）一词已流行用来标记这种机制。（然而，将*字符串化*和*可变*引入 C 语言词汇的过程尚未导致将具有固定数量参数的函数或宏标记为\
  \ fixadic 函数和 normadic 宏。）\n\n其思想是，宏定义参数列表中的最后一个参数可以是省略号（即三个点）。如果是这样，则可以在替换部分使用预定义的宏\
  \ `__VA_ARGS__`，用以指示用什么来替换省略号。例如，考虑此定义：\n\n点击此处查看代码图像\n\n```c\n#define PR(...) printf(__VA_ARGS__)\n\
  ```\n\n假设你之后像这样调用宏：\n点击此处查看代码图像\n\n```c\nPR(\"Howdy\");\nPR(\"weight = %d, shipping\
