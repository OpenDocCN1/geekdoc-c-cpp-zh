  \ `7 * 5.0`）\n\n## 4. 第 0 行**: 应包含 `<stdio.h>`。\n**第 3 行**: 应该是分号结尾，而不是逗号。\n**第\
  \ 6 行**: `while`语句建立了一个无限循环，因为 `i` 的值始终为 `1` 且小于 `30`。可能是想写 `while(i++ < 30)`。\n\
  **第 6–8 行**: 缩进意味着想要第 7 和第 8 行组成一个块，但缺少花括号意味着 `while` 只包含第 7 行。应该添加花括号。\n**第 7 行**:\
  \ 因为 `1` 和 `i` 都是整数，当 `i` 为 `1` 时，除法结果为 `1`，对于所有较大的值，结果将是非零答案。\n**第 8 行**: 我们在控制语句中遗漏了换行符（`\\\
  n`）。这导致数字可能打印在同一行。\n**第 10 行**: 应为 `return 0;`。\n\n这是一个修正后的版本：\n\n```c\n#include\
  \ <stdio.h>\nint main(void)\n{\n   int i = 1;\n   float n;\n   printf(\"Watch out!\
  \ Here come a bunch of fractions!\\n\");\n   while (i++ < 30)\n   {\n      n = 1.0/i;\n\
  \      printf(\" %f\\n\", n);\n   }\n   printf(\"That's all, folks!\\n\");\n   return\
  \ 0;\n}\n```\n\n## 5. 主要问题在于测试语句（`sec` 是否大于 0？）与获取 `sec` 值的 `scanf()` 语句之间的关系。特别是当第一次进行测试时，程序还没有机会获取\
  \ `sec` 的值，比较将与该内存位置上的垃圾值进行；它可能大于 0。一种虽然并不优雅解决方案是将 `sec` 初始化为 `1`，这样第一次测试就能通过。这发现了第二个问题：当你最后输入\
  \ `0` 停止程序时，`sec` 在循环结束*之后*才被检查，并打印了 0 秒的结果。你真正想要在 `while` 测试之前有一个 `scanf()` 语句。你可以通过如下方式修改程序的中间部分：\n\
  \n```c\nscanf(\"%d\", &sec);\nwhile ( sec > 0 )\n{\n   min = sec/10;\n   left =\
  \ sec%10;\n   printf(\"%d sec is %d sec.\\n\", sec, left);\n   printf(\"Next input?\\\
  n\");\n   scanf(\"%d\", &sec);\n}\n```\n\n第一次使用了循环外的 `scanf()`。之后使用了循环结束处的 `scanf()`（因此再次在循环前使用）。这是处理此类问题的常用方法，这也是为什么代码列表\
  \ 5.9 使用了它。\n\n## 6. 输出如下：\n\n```\n%s! C is cool!\n! C is cool!\n11\n12\n11\n```\n\
  \n让我们解释一下。第一个 `printf()` 语句相当于：\n\n```c\nprintf(\"%s! C is cool!\\n\",\"%s! C is\
