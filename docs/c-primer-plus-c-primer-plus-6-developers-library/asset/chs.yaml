  \ `calloc()` 部分的后续翻译）。\n\n#### `calloc()` 函数\n\n另一种内存分配方案是使用 `calloc()`。典型的用法如下：\n\
  \n点击此处查看代码图像\n\n```c\nlong * newmem;\nnewmem = (long *) calloc(100, sizeof (long));\n\
  ```\n\n与 `malloc()` 类似，`calloc()` 返回：\n[content] ... \n```\n\n#### `calloc()` 函数\n\
  \n另一种内存分配方案是使用 `calloc()`。典型的用法如下：\n\n点击此处查看代码图像\n\n```c\nlong * newmem;\nnewmem\
  \ = (long *) calloc(100, sizeof (long));\n```\n\n与 `malloc()` 类似，`calloc()` 在非 ANSI\
  \ 版本中返回 `char *` 指针，在 ANSI 版本下返回 `void *` 指针。如果你想存储不同类型，应该使用转换运算符。这个新函数接受两个参数，两个都应该是无符号整数（ANSI\
  \ 下为 `size_t` 类型）。第一个参数是你想要的内存单元数量。第二个参数是每个单元的字节大小。在我们的例子中`long` 使用 4 字节，因此该指令设置了\
  \ 100 个 4 字节单元，总共使用 400 字节存储。\n\n使用 `sizeof (long)` 代替 `4` 使代码更具可移植性。在那些 `long`\
  \ 大小不是 4 字节的系统中，它同样有效。\n\n`calloc()` 函数还提供了一个额外功能：它将块中的所有位都置零。（但注意，在某些硬件系统中，浮点值\
  \ `0` 的表示并非所有位都为 0。）\n\n`free()` 函数也可以用于释放由 `calloc()` 分配的内存。\n\n\n\n\n\n变长数组（VLAs）与\
  \ `malloc()` 的使用在功能上存在重叠。例如，它们都可以用于创建一个在运行时确定大小的数组：\n\n点击此处此处查看代码图片\n\n```c\nint\
  \ vlamal()\n{\n    int n;\n    int * pi;\n    scanf(\"%d\", &n);\n    pi = (int\
  \ *) malloc (n * sizeof(int));\n    int ar[n];   // vla\n    pi[2] = ar[2] = -5;\n\
  ...\n}\n```\n\n区别之一在于，VLA 是自动存储的。自动存储的一个结果是，VLA 使用的内存空间在执行离开定义块时会被自动释放——在这种情况下，就是当\
  \ `vlamal()` 函数终止时。因此，你不需要担心使用 `free()`。另一方面，使用 `malloc()` 创建的数组不需要将其访问限制在一个函数内。例如，一个函数可以创建一个数组并返回指针，从而让调用函数获得访问权限。然后，调用函数可以在完成后调用\
  \ `free()`。在 `free()` 中使用与 `malloc()` 不同的指针变量是可以的；必须一致的是指针中存储的地址。然而，你不应该尝试两次释放同一块内存。\n\
  \nVLAs 对于多维数组来说更加方便。你可以使用 `malloc()` 创建一个二维数组，但语法很笨拙。如果编译器不支持 VLA 特性，其中一个维度必须是固定，就像在函数调用中一样：\n\
  \n点击此处查看代码图片\n\n```c\nint n = 5;\nint m = 6;\nint ar2[n][m];      // n x m VLA\n\
  int (* p2)[6];      // C99 之前有效\nint (* p3)[m];      // 需要 VLA 支持\np2 = (int (*)[6])\
  \ malloc(n * 6 * sizeof(int));  // n * 6 数组\np3 = (int (*)[m]) malloc(n * m * sizeof(int));\
  \  // n * m 数组\n// 上面的表达式也需要 VLA 支持\nar2[1][2] = p2[1][2] = 12;\n```\n\n复习一下指针声明是有价值的。`malloc()`\
  \ 函数返回一个指针，因此 `p2` 必须是一个适当类型的指针。该声明\n\n点击此处查看代码图片\n\n```c\nint (* p2)[6];   // C99\
  \ 之前有效\n```\n\n表示 `p2` 指向一个包含六个 `int` 的数组。这意味着 `p2[i]` 将被解释为一个由六个 `int` 组成的元素，而\
  \ `p2[i][j]` 将被解释为单一的 `int`。\n\n第二个指针声明使用变量来指定 `p3` 指向的数组的大小。这意味着 `p3` 被认为指向 VLA\
  \ 的指针，这就是为什么该代码在 C90 标准下无法工作。\n\n### 存储类与动态内存分配\n\n你可能会好奇存储类与动态内存分配之间的联系。让我们来看一个理想模型。你可以将程序看作将其可用内存划分为三个独立区域：一个用于具有外部链接、内部链接和无链接的静态变量；一个用于自动变量；另一个用于动态分配的内存。\n\
  \n用于静态生存期存储类所需的内存量在编译时是已知的，存储在该区域中的数据只要程序运行就可用。这些类中的每个变量都会在程序开始时产生，在程序结束时失效。\n\n\
  然而，自动变量在程序进入包含变量定义的代码块时产生，在离开该代码块时失效。因此，随着程序调用函数以及函数终止，使用的内存量会增长和缩小。动态分配的内会在调用 `malloc()`\
  \ 时产生，并在调用 `free()` 时释放。其持久性由程序员控制，而不是由一套僵化的规则控制，因此内存可能会在活跃块之间碎片（通常称为*内存堆*或*空闲存储器*）。\n\
  \n### ANSI 类型限定符\n\n你已经看到变量由其类型和存储类共同刻画。C90 增加了两个属性：常量性和易变性。这些属性用关键字 `const` 和 `volatile`\
  \ 声明。C99 增加了第三种限定符 `restrict`，旨在促进编译器优化。C11 增增加了第四种 `_Atomic`。C11 提供了一个由 `stdatomic.h`\
  \ 管理的可选库，以支持并发编程。\n\nC99 为类型限定符赋予了一个新属性——它们现在是幂等的！尽管这听起来是一个很有有力的断言，但它的真实意义是你可以在声明中多次使用相同的限定符，而多余的会被忽略：\n\
  \n点击此处查看代码图片\n\n```c\nconst const int n = 6; // 等同于 const n = 6\n```\n\n#### const\
  \ 类型限定符\n\n第 4 章、“字符字符串与格式化输入输出”以及第 10 章、“数组与指针”已经介绍了 `const`。复习一下，声明中的 `const`\
  \ 关键字建立了一个值无法通过赋值或递增递减来修改的变量。在符合 ANSI 的编译器上，代码\n\n点击此处查看代码图片\n\n```c\nconst int\
  \ nochange;   /* 将 nochange 限定为常量 */\nnochange = 12;        /* 不允许 */\n```\n\n应该产生错误信息。然而，你可以初始化\
  \ `const` 变量。因此，以下代码是允许：\n\n点击此处查看代码图片\n\n```c\nconst int nochange = 12; // 允许\n\
  ```\n\n前面的声明使 `nochange` 成为只读变量。在初始化之后，它不能被更改。\n\n\n\n\n你可以使用 `const` 关键字，例如，创建一个程序无法修改的数据数组：\n\
  \n点击此处查看代码图片\n\n```c\nconst int days1[12] = {31,28,31,30,31,30,31,31,30,31,30,31};\n\
  ```\n\n### 在指针和参数声明中使用 const\n\n在声明简单变量和数组时使用 `const` 关键字非常简单。指针要复杂得多，因为你必须区分是让指针本身变为\
  \ `const`，还是让它所指向的值变为 `const`。下面的声明\n\n点击此处查看代码图片\n\n```c\nconst float * pf;  /*\
  \ pf 指向一个常量浮点数值 */\n```\n\n确定了 `pf` 指向一个必须保持不变的值。`pf` 本身的值是可以改变的。例如，它可以被设置为指向另一个\
  \ `const` 值。相比之下，下面的声明\n\n点击此处查看代码图片\n\n```c\nfloat * const pt;     /* pt 是一个常量指针\
  \ */\n```\n\n表示指针 `pt` 本身的值不能改变。它必须始终指向同一个地址，但所指向的值可以改变。最后，下面的声明\n\n```c\nconst\
  \ float * const ptr;\n```\n\n意味着 `ptr` 必须始终指向同一个位置，且该位置存储的值不能改变。\n\n还有一个可以放置 `const`\
  \ 的第三位置：\n\n点击此处查看代码图片\n\n```c\nfloat const * pfc;  // 等同于 const float * pfc;\n\
  ```\n\n如注释所示，将 `const` 放在类型名之后、`*` 之前意味着指针不能用于修改所指向的值。简而言之，`*` 左侧的任何 `const` 都会让数据常量；而\
  \ `*` 右侧的 `const` 则会让指针本身常量。\n\n该新关键字的一个常见用途是声明作为形式函数参数的指针。例如，假设你有一个名为 `display()`\
  \ 的函数，用于显示数组的内容。要使用它，你将把数组名作为实际参数传递，但数组名是一个地址。这将允许函数修改调用函数中的数据。但下面的原型防止了这种情况的发生：\n\
  \n点击此处查看代码图片\n\n```c\nvoid display(const int array[], int limit);\n```\n\n在原型和函数头中，参数声明\
  \ `const int array[]` 与 `const int * array` 相同，因此该声明表示 `array` 所指向的数据不能被修改。\n\n\
  ANSI C 库遵循这一做法。如果指针仅用于让函数访问值，则该指针被声明为指向带有 `const` 修符类型的指针。如果指针用于修改调用函数中的数据，则不使用\
  \ `const` 关键字。例如，ANSI C 对 `strcat()` 的声明如下：\n\n点击此处查看代码图片\n\n```c\nchar *strcat(char\
  \ * restrict s1, const char * restrict s2);\n```\n\n回想一下 `strcat()` 将第二个字符串的副本添加到第一个字符串的末尾。这修改了第一个字符串，但保持第二个字符串不变。该声明反映了这一点。我们稍后会回到\
  \ `restrict` 的作用。\n\n### 在全局数据中使用 const\n\n回想一下，使用全局变量被认为是一种风险方法，因为这使得数据暴露在程序任何部分误改的风险。如果数据是常量，这种风险就会消失，因此使用带有\
  \ `const` 修符的全局变量是完全合理的。你可以拥有 `const` 变量、`const` 数组和 `const` 结构（结构是在下一章讨论的复合数据类型）。\n\
  \n然而，需要注意的一个领域是跨文件共享 `const` 数据。你可以使用两种策略。第一种是遵循外部变量的通常规则——在一个文件中使用定义声明，在其他文件中使用引用声明（使用\
  \ `extern` 关键字）：\n\n点击此处查看代码图片\n\n```c\n/* file1.c -- 定义了一些全局常量 */\nconst double\
  \ PI = 3.14159;\nconst char * MONTHS[12] =\n    {\"January\", \"February\", \"March\"\
  , \"April\", \"May\", \"June\", \"July\",\n      \"August\", \"September\", \"October\"\
  , \"November\", \"December\"};\n\n/* file2.c -- 使用别处定义的全局常量 */\nextern const double\
  \ PI;\nextern const * MONTHS[];\n```\n\n第二种方法是将常量放在 `include` 文件中。在这里，你必须采取使用 `static`\
  \ 外部存储类的额外步骤：\n\n点击此处查看代码图片\n\n```c\n/* constant.h -- 定义了一些全局常量 */\nstatic const\
  \ double PI = 3.14159;\nstatic const char * MONTHS[12] =\n    {\"January\", \"February\"\
  , \"March\", \"April\", \"May\", \"June\", \"July\",\n      \"August\", \"September\"\
  , \"October\", \"November\", \"December\"};\n```\n\n如注释所示，将 `const` 放在类型名之后、`*`\
  \ 之前意味着指针不能用于修改所指向的值。简而言之，`*` 左侧的任何 `const` 都会让数据常量；而 `*` 右侧的 `const` 则会让指针本身常量。\n\
  \n（注：此处提供的原文示例代码块似乎存在错乱/重复，翻译时已根据上下文逻辑对齐）\n\n修正后的代码块逻辑对应：\n```c\n/* constant.h --\
  \ 定义了一些全局常量 */\nstatic const double PI = 3.14159;\nstatic const char * MONTHS[12]\
  \ =\n    {\"January\", \"February\", \"March\", \"April\", \"May\", \"June\", \"\
  July\",\n      \"August\", \"September\", \"October\", \"November\", \"December\"\
  };\n\n/* file1.c -- 使用别处定义的全局常量 */\n#include \"constant.h\"\n\n/* file2.c -- 使用别处定义的全局常量\
  \ */\n#include \"constant.h\"\n```\n\n如果你不使用 `static` 关键字，在 `file1.c` 和 `file2.c`\
  \ 中包含 `constant.h` 将导致每个文件拥有相同标识符的定义，这是不受支持的（尽管某些编译器允许）。通过将每个标识符变为 `static`，你实际上给每个文件了一个独立的副本。如果文件应该通过该数据进行通信，这将行不通，因为每个文件看到的都是自己的副本。\n\
  \n头文件方法的优点是，你不需要在一个文件中使用定义声明并在另一个文件中使用引用声明；所有文件只需包含同一个头文件。缺点是数据被复制了。对于前面的例子，这不是真正的问题，但如果常量数据包含巨大的数组，可能是。\n\
  \n#### volatile 类型修符\n\n`volatile` 修符告诉编译器变量可能会被程序以外的机构修改。它通常用于硬件地址以及与其他程序或线程共享的数据。例如，一个地址可能持有当前时钟。无论你的程序在做什么，该地址的值随时间改变。或者，一个地址可能用于接收来自另一台计算机的信息。\n\
  \n其语法与 `const` 相同：\n\n点击此处查看代码图片\n\n```c\nvolatile int loc1;  /* loc1 是一个 volatile\
  \ 位置 */\nvolatile int * ploc; /* ploc 指向一个 volatile 位置 */\n```\n\n这些语句声明 `loc1`\
  \ 为一个 volatile 值，而 `ploc` 指向一个 volatile 值。\n\n你可能认为 `volatile` 是一个有趣的概念，但你可能疑惑为什么\
  \ ANSI 委员会认为有必要将 `volatile` 作为一个关键字。由于它可以有助于编译器优化。例如，假设你有如下代码：\n\n```c\nval1 = x;\n\
  \n/* 不使用 x 的一些代码 */\n\nval2 = x;\n```\n\n\n\n\n一个智能（优化型）编译器可能会注意到你使用了两次 `x` 两次，而没有改变它的值。它会临时将\
  \ `x` 的值存储在寄存器中。然后，当 `val2` 需要使用 `x` 时，它可以通过从寄存器中读取值而不是从原始内存位置读取值，从而节省时间。这种过程被称为\
  \ `caching`（缓存）。通常情况下，缓存是一种很好的优化，但如果 `x` 在两个语句之间被其他机构更改了，则大大不了。如果没有 `volatile` 关键字，编译器无法得知这是否会发生。因此，为了安全起见，编译器无法进行缓存。那是非\
  \ ANSI 时代的情况。然而，现在如果在声明中未使用 `volatile` 关键字，编译器就可以假设值在两次使用之间没有变化，然后它就可以尝试优化代码。\n\n\
  一个值可以同时是 `const` 和 `volatile` 的。例如，硬件时钟设置通常不应该被程序更改，使其成为 `const`，但它会被程序以外的机构更改，使其成为\
  \ `volatile`。只需在声明中使用这两个限定符即可，如下所示；顺序并不重要：\n\n```\nvolatile const int loc;\nconst\
  \ volatile int * ploc;\n```\n\n### `restrict` 类型限定符\n\n`restrict` 关键字通过赋予编译器优化某些类型代码的权限来增强计算支持。它只能应用于指针，并指示该指针是访问数据对象的唯一初始手段。为了了解为什么很有用，我们需要看几个例子。考虑以下内容：\n\
  \n点击查看代码图像\n\n```c\nint ar[10];\nint * restrict restar = (int *) malloc(10 * sizeof(int));\n\
  int * par = ar;\n```\n\n在这里，指针 `restar` 是访问 `malloc()` 分配的内存的唯一初始手段。因此，可以使用 `restrict`\
  \ 关键字对其进行限定。然而，指针 `par` 既不是访问 `ar` 数组数据的初始手段，也不是唯一手段，因此它不能被限定为 `restrict`。\n\n现在考虑下面这个相当人为的示例，其中\
  \ `n` 是一个 `int`：\n\n```c\nfor (n = 0; n < 10; n++)\n{\n    par[n] += 5;\n    restar[n]\
  \ += 5;\n    ar[n] *= 2;\n    par[n] += 3;\n    restar[n] += 3;\n}\n```\n\n由于 `restar`\
  \ 是访问其所指向的数据块的唯一初始手段，编译器可以将两个涉及 `restar` 的语句替换为具有相同效果的单个语句：\n\n点击查看代码图像\n\n```c\n\
  restar[n] += 8;   /* 合法替换 */\n```\n\n然而，将涉及 `par` 的两个语句合并为一个将是一个计算错误：\n\n点击查看代码图像\n\
  \n```c\npar[n] += 8;     / * 得到错误答案 */\n```\n\n它给出错误答案的原因是，循环使用了 `ar` 在 `par` 两次访问相同数据之间更改了数据的值。\n\
  \n如果没有 `restrict` 关键字，编译器必须假设最坏的情况；即某些其他标识符可能在指针两次使用之间更改了数据。使用 `restrict` 关键字后，编译器就可以自由寻找计算捷径。\n\
  \n你可以将 `restrict` 关键字用指针函数参数的限定符。这意味着编译器可以假设在函数体内部没有其他标识符修改所指向的数据，并且编译器可以尝试它可能可能不会使用的优化。例如，C\
  \ 库有两个函数用于将字节从一个位置复制到另一个位置。在 C99 下，它们具有这些原型：\n\n点击查看代码图像\n\n```c\nvoid * memcpy(void\
  \ * restrict s1, const void * restrict s2, size_t n);\nvoid * memmove(void * s1,\
  \ void * s2, size_t n);\n```\n\n每个函数都从位置 `s2` 拷贝 `n` 个字节到位置 `s1`。`memcpy()` 要求这两个位置之间没有重叠，但\
  \ `memmove()` 没有这个要求。将 `s1` 和 `s2` 声明为 `restrict` 意味着每个指针都是唯一的访问手段，因此它们不能访问同一块数据。这符合没有重叠的要求。允许重叠的\
  \ `memmove()` 函数必须在拷贝数据时更加小心，以防在数据被使用之前覆盖它。\n\n`restrict` 关键字有两个受众。一个是编译器，它告诉编译器它可以自由做出关于优化的某些假设。另一个受众是用户，它告诉用户只使用满足\
  \ `restrict`要求的参数。通常，编译器无法检查你是否遵守了这一限制，但如果你违反了，后果自自负。\n\n### `_Atomic` 类型限定符 (C11)\n\
  \n并发编程将程序执行分为可能并行执行的线程。这引发了若干编程挑战，包括如何管理访问相同数据的不同线程。C11 提供了可选而非强制的由 `stdatomic.h`\
  \ 和 `threads.h` 设置的管理方法。一个方面是由各种宏控制的原子类型概念。例如，类似\n\n点击查看代码图像\n\n```c\nint hogs;\n\
  ```\n\n在这里，将值 `12` 存储到 `hogs` 中的原子过程可以替换为：\n\n点击查看代码图像\n\n```c\n_Atomic int hogs;\n\
  atomic_store(&hogs, 12);\n```\n\n这指示了其他线程不会访问 `hogs`。在本文编写时，预计会有对该特性的支持。\n\n###\
  \ 关键字的新位置\n\nC99 允许你在函数原型和头文件中形式参数的初始括号内放置类型限定符存储类限定符 `static`。对于类型限定符的情况，这为现有功能提供了一种替代语法。例如，这里有一个使用旧语法的声明：\n\
  \n点击查看代码图像\n\n```c\nvoid ofmouth(int * const a1, int * restrict a2, int n);\n```\n\
  \n它表示 `a1` 是指向 `int` 的 `const` 指针，正如你记得的，这意味着指针是常量，而不是它指向的数据。它还指示 `a2` 是限制指针，如前节所述。新的等效语法是：\n\
  \n点击查看代码图像\n\n```c\nvoid ofmouth(int a1[const], int a2[restrict], int n);\n```\n\
  \n`static` 的情况不同，因为它引入了该关键字的新且无关的用途。它不再指示静态存储变量的作用域或链接，新用途是告诉编译器形式参数将如何使用。例如，考虑这个原型：\n\
  \n点击查看代码图像\n\n```c\ndouble stick(double ar[static 20]);\n```\n\n这种 `static` 的用法指示函数调用中的实际参数是一个指向包含至少\
  \ 20 个元素的数组的第一个元素的指针。此举目的是让编译器能够利用该信息来对其函数的编码进行优化。\n\n\n\n\n与 `restrict` 类似，`static`\
  \ 关键字有两个受众。一个是编译器，它告诉编译器可以自由对优化做出某些假设。另一个受众是用户，它告诉用户仅提供满足 `static` 要求的参数。\n\n###\
  \ 核心概念\n\nC 语言提供了多种管理内存的模型。你应该熟悉这些选择。你还需要培养一种判断何时选择各种类型的直觉。在大多数情况下，自动变量是最佳选择。如果你决定使用其他类型，应该有一个充分理由。对于函数之间的通信，通常使用自动变量、函数参数和返回值比使用全局变量更好。另一方面，全局变量对于常量数据特别有用。\n\
  \n你应该尝试理解静态内存、自动内存和分配内存的属性。特别要注意，静态内存量是在编译时决定的，静态数据在程序加载到内存时被加载到内存中。自动变量在程序运行时被分配和释放，因此自动变量使用的内存量在程序执行期间发生变化。你可以将自动内存视为一个可写的工作空间。分配内存也会增长和收缩，但在这种情况下，该过程是由函数调用控制的，而不是自动发生。\n\
  \n### 总结\n\n程序中存储数据的内存可以根据存储期、作用域和链接来特征。存储期可以是静态的、自动的或分配的。如果是静态的，内会在程序执行开始时分配，并在程序运行期间一直存在。如果是自动的，变量内会在程序执行进入定义变量的块时分配，并在退出该块时释放。如果是分配的，则通过调用\
  \ `malloc()`（或相关函数）分配内存，并通过调用 `free()` 函数释放内存。\n\n作用域决定了程序的哪些部分可以访问数据。定义在任何函数之外的变量具有文件作用域，对在该变量声明之后定义的任何函数都可见。定义在块内部或作为函数参数的变量具有块作用域，仅对该块以及嵌套在其中的任何块可见。\n\
  \n链接描述了在程序某一单元中定义的变量在多大程度上可以与其它地方链接。具有块作用域的变量是局部的，没有链接。具有文件作用域的变量可以具有内部链接或外部链接。内部链接意味着变量只能在包含定义的文件中使用。外部链接意味着变量也可以在其他文件中使用。\n\
  \n以下是 C 的五种存储类（不包括线程概念）：\n\n![Image](img/squf.jpg) **自动的—** 在块中声明（或作为函数头中的参数）且没有存储类修饰符，或带有\
  \ `auto` 存储类修饰符的变量属于自动存储类。它具有自动存储期、块作用域且没有链接。它的值如果未初始化，则不是未定的。\n\n![Image](img/squf.jpg)\
  \ **寄存器的—** 在块中声明（或作为函数头中的参数）且带有 `register` 存储类修饰符的变量属于寄存器存储类。它具有自动存储期、块作用域且没有链接，并且不能获取地址。将变量声明为寄存器变量是对编译器的提示，提供尽可能快的访问。它的值如果未初始化，则不是未定的。\n\
  \n![Image](img/squf.jpg) **静态，无链接—** 在块中声明并带有 `static` 存储类修饰符的变量属于“静态，无链接”存储类。它具有静态存储期、块作用域且没有链接。它在编译时初始化一次。如果没有式初始化，它的字节被设置为\
  \ 0。\n\n![Image](img/squf.jpg) **静态，外部链接—** 定义在任何函数外部且没有使用 `static` 存储类修饰符的变量属于“静态，外部链接”存储类。它具有静态存储期、文件作用域和外部链接。它在编译时初始化一次。如果没有显式初始化，它的字节被设置为\
  \ 0。\n\n![Image](img/squf.jpg) **静态，内部链接—** 定义在任何函数外部并使用 `static` 存储类修饰符的变量属于“静态，内部链接”存储类。它具有静态存储期、文件作用域和内部链接。它在编译时初始化一次。如果没有显式初始化，它的字节被设置为\
  \ 0。\n\n分配内存通过使用 `malloc()`（或相关）函数提供，该函数返回指向具有请求字节内存块的指针。通过调用 `free()` 函数并将地址作为参数，可以使该内存重用。\n\
  \n类型限定符有 `const`、`volatile` 和 `restrict`。`const` 限定符将数据限定为常量。当与指针配合使用时，`const` 可以指示指针本身是常量，或者它所指向的数据是常量，取决于\
  \ `const` 在声明中的位置。`volatile` 限定符表示数据可能会被程序以外的过程所修改。它的目的是警告编译器避免假设其他情况的优化。提供 `restrict`\
  \ 限定符也是出于优化的考虑。被 `restrict` 限定的指针被识别为提供了对数据块的唯一访问。\n\n### 复习题\n\n你可以在 附录 A 中的“复习题答案”找到复习题的答案。\n\
  \n**1.** 哪些存储类创建了包含它们的函数的局部变量？\n\n**2.** 哪些存储类创建了持续整个程序期间的变量？\n\n**3.** 哪些存储类创建了跨多个文件的变量？仅限于单个文件的变量？\n\
  \n**4.** 块变量具有什么样的链接？\n\n**5.** `extern` 关键字是做什么用的？\n\n**6.** 考虑这段代码段：\n\n```c\n\
  int * p1 = (int *) malloc(100 * sizeof(int));\n```\n在结果方面，以下语句有何不同？\n\n```c\nint\
  \ * p1 = (int *) calloc(100, sizeof(int));\n```\n\n**7.** 哪些函数知道以下每个变量？是否存在错误？\n\
  \n```c\n/* 文件 1 */\nint daisy;\nint main(void)\n{\n  int lily;\n  ...;\n}\n\nint\
  \ petal()\n{\n  extern int daisy, lily;\n  ...;\n}\n\n/* 文件 2 */\nextern int daisy;\n\
  static int lily;\nint rose;\nint stem()\n{\n  int rose;\n  ...;\n}\n\nvoid root()\n\
  {\n  ...;\n}\n```\n\n**8.** 下面程序将打印什么？\n\n```c\n#include <stdio.h>\nchar color=\
  \ 'B';\nvoid first(void);\nvoid second(void);\n\nint main(void)\n{\n  extern char\
  \ color;\n  printf(\"color in main() is %c\\n\", color);\n  first();\n  printf(\"\
  color in main() is %c\\n\", color);\n  second();\n  printf(\"color in main() is\
  \ %c\\n\", color);\n  return 0;\n}\n\nvoid first(void)\n{\n  char color;\n  color\
  \ = 'R';\n  printf(\"color in first() is %c\\n\", color);\n}\n\nvoid second(void)\n\
  {\n  color = 'G';\n  printf(\"color in second() is %c\\n\", color);\n}\n```\n\n\
  **9.** 一个文件开头有以下声明：\n\n```c\nstatic int plink;\nint value_ct(const int arr[], int\
  \ value, int n);\n```\n\n**a.** 这些声明告诉了你程序员的什么意图？\n\n\n\n\n**b.** 将 `int value`\
  \ 和 `int n` 替换为 `const int value` 和 `const int n` 是否会增强调用程序对这些值的保护？\n\n## 编程练习\n\
  \n**1.** 重写列表 12.4 中的程序，使其不使用全局变量。\n\n**2.** 油油消耗在美国通常以每加仑里程计算，在欧洲以每百公里升计算。以下是一个程序的一部分，它要求用户选择一种模式（公制或美制），然后收集数据并计算燃油消耗：\n\
  \n点击此处查看代码图像\n\n```c\n// pe12-2b.c\n\n// cùng pe12-2a.c 编译\n\n#include <stdio.h>\n\
  \n#include \"pe12-2a.h\"\n\nint main(void)\n{\n  int mode;\n  printf(\"Enter 0 for\
  \ metric mode, 1 for US mode: \");\n  scanf(\"%d\", &mode);\n  while (mode >= 0)\n\
  \  {\n      set_mode(mode);\n      get_info();\n      show_info();\n      printf(\"\
  Enter 0 for metric mode, 1 for US mode\");\n      printf(\" (-1 to quit): \");\n\
  \      scanf(\"%d\", &mode);\n  }\n  printf(\"Done.\\n\");\n  return 0;\n}\n```\n\
  \n这里是一些示例输出：\n\n点击此处查看代码图像\n\nEnter 0 for metric mode, 1 for US mode: 0\nEnter distance\
  \ traveled in kilometers: 600\nEnter fuel consumed in liters: 78.8\nFuel consumption\
  \ is 13.13 liters per 100 km.\nEnter 0 for metric mode, 1 for US mode (-1 to quit):\
  \ 1\nEnter distance traveled in miles: 434\nEnter fuel consumed  in gallons: 12.7\n\
  Fuel consumption is 34.2 miles per gallon.\nEnter 0 for metric mode, 1 for US mode\
  \ (-1 to quit): 3\nInvalid mode specified. Mode 1(US) used.\nEnter distance traveled\
  \ in miles: 388\nEnter fuel consumed  in gallons: 15.3\nFuel consumption is 25.4\
  \ miles per gallon.\nEnter 0 for metric mode, 1 for US mode (-1 to quit): -1\nDone.\n\
  \n如果用户输入了错误的模式，程序会对此进行注释并使用最近的模式。提供一个 `pe12-2a.h` 头文件和一个 `pe12-2a.c` 源代码文件以使其能够工作。源代码文件应该定义三个文件作用域的内部链接变量。一个代表模式，一个代表距离，一个代表消耗的燃料。`get_info()`\
  \ 函数根据模式设置提示输入数据并将响应存储在文件作用域变量中。`show_info()` 函数根据模式设置计算并显示燃料消耗。你可以假设用户响应的是数字输入。\n\
  \n**3.** 重新设计编程练习 2 中描述的程序，使其仅使用自动变量。让程序提供相同的用户界面——也就是说，它应该提示用户输入模式等等。然而，你必须想出一组不同的函数调用方法。\n\
  \n**4.** 在循环中编写并测试一个函数，该函数返回它被调用的次数。\n\n**5.** 编写一个程序，生成 1–10 范围内 100 个随机数，并按降序排序。（你可以调整第\
  \ 11 章中“字符字符串和字符串函数”的排序算法以适用于 `int`。在这种情况下，只需对数字本身排序。）\n\n**6.** 编写一个程序，生成 1–10\
  \ 范围内 1000 个随机数。不要保存或打印数字，但要打印每个数字产生的次数。让程序对 10 个不同的种子值执行此操作数字的数量相等吗？你可以使用本章中的函数或\
  \ ANSI C `rand()` 和 `srand()` 函数，它们的格式与我们的函数相同。这是检查特定随机数生成器随机性的方法之一。\n\n**7.** 编写一个行为类似于列表\
  \ 12.13 修改版的程序，我们在展示了列表 12.13 的输出后讨论了它。也就是说，让程序产生如下输出：\n\n点击此处查看代码图像\n\nEnter the\
  \ number of sets; enter q to stop: 18\nHow many sides and how many dice? 6 3\nHere\
  \ are 18 sets of 3 6-sided throws.\n  12  10  6  9  8  15  9  12  17  1  10  13\
  \  8\nHow many sets? Enter q to stop: q\n\n**8.** 这里是程序的一个部分：\n\n点击此处查看代码图像\n\n\
  ```c\n//#include <stdio.h>\nint * make_array(int elem, int val);\nvoid show_array(const\
  \ int ar[], int n);\nint main(void)\n{\n  int * pa;\n  int size;\n  int value;\n\
  \  printf(\"Enter the number of elements: \");\n  while (scanf(\"%d\", &size) ==\
  \ 1 && size > 0)\n  {\n      printf(\"Enter initialization value: \");\n      scanf(\"\
  %d\", &value);\n      pa = make_array(size, value);\n      if (pa)\n      {\n  \
  \      show_array(pa, size);\n        free(pa);\n      }\n      printf(\"Enter the\
  \ number of elements (<1 to quit): \");\n  }\n  printf(\"Done.\\n\");\n  return\
  \ 0;\n}\n```\n\n通过为 `make_array()` 和 `show_array()` 提供函数定义来完成程序。`make_array()` 函数接受两个参数。第一个是\
  \ `int` 数组的元素个数，第二个是要赋值给每个元素的值。该函数使用 `malloc()` 创建合适大小的数组，将每个元素设置为指定的值，并返回数组的指针。\n\
  \n**9.** 编写一个具有以下行为的程序：首先它询问你想输入多少个单词。然后让你输入单词，最后显示这些单词。使用 `malloc()` 和第一个问题的答案（单词数）创建一个\
  \ `char` 指针数组。注意由于数组中的每个元素都是 `char` 指针，读取字符串时，程序应将其读取到一个临时 `char` 数组，使用 `malloc()`\
  \ 为存储分配足够的空间，并将地址存储在 `char` 数组中。然后它应该将单词从临时数组复制到分配的空间中。这样，你就得到了一个指针数组，每个指针指向一个存储单词所需的精确大小的对象。示例运行可能如下：\n\
  \n点击此处查看代码图像\n\nHow many words do you wish to enter? 5\nEnter 5 words now:\nI enjoyed\
  \ doing exercise\nHere are your words:\nI\nenjoyed\ndoing\nthis\nexercise\n\n##\
  \ 13. 输入输出\n\n你将在本章中学习以下内容：\n\n- 函数：`fopen()`, `getc()`, `putc()`, `exit()`, `fclose()`\n\
  - `fprintf()`, `fscanf()`, `fgets()`, `fputs()`\n- `rewind()`, `fseek()`, `ftell()`,\
  \ `fflush()`\n- `fgetpos()`, `fsetpos()`, `feof()`, `ferror()`\n- `ungetc()`, `setvbuf()`,\
  \ `fread()`, `fwrite()`\n- 使用 C 标准 I/O 族函数处理文件\n- 文本模式和二进制模式、文本和二进制格式，以及缓冲和非缓冲 I/O\n\
  - 使用可以顺序和随机访问文件的函数\n\n文件对于今天的计算机系统至关重要。它们用于存储程序、文档、数据、通信、表单、图形、照片、音乐、视频和无数其他信息。作为程序员，你必须编写创建文件、写入文件和读取文件的程序。在本章中，我们将向你如何这样做。\n\
  \n### 与文件通信\n\n你经常需要从文件中读取信息或将结果写入文件的程序。程序与文件通信的一种形式是文件重定向，正如你在第 8 章中“字符输入输出和输入验证”看到的那样。这种方法简单但有限。例如，假设你想编写一个交互式程序，要求你输入书名，并将完整列表保存到文件中。如果你使用重定向，例如：\n\
  \n```\nbooks > bklist\n```\n\n\n\n\n\n你的交互式提示符被重定向到了 `bklist`。这不仅会将不必要的文本放入 `bklist`，还会导致你无法看到本应该回答的问题。\n\
  \n正如你所预期的，C 语言提供了更强大的文件通信方法。它允许你在程序内部打开一个文件，然后使用特殊的 I/O 函数从该文件读取或向其写入内容。在研究这些方法之前，让我们简要回顾一下文件的本质。\n\
  \n#### 什么是文件？\n\n`file` 是存储器上一个命名的区域，通常位于磁盘上，或者在最近，位于固态设备上。例如，你可以将 `stdio.h` 为一个包含某些有用信息的文件的名称。然而，对于操作系统来说，文件要复杂得多。例如，一个大文件可能最终存储在几个分散的碎片中，或者它可能包含额外数据，允许操作系统确定它是什么类型的文件。但是，这些都是操作系统关心的，而不是你关心的（除非你正在编写操作系统）。你关心的是文件在\
  \ C 程序中是如何显示的。\n\nC 语言将文件视为连续的字节序列，每个字节都可以被单独读取。这对应于 C 语言成长的 Unix 环境中的文件结构。由于其他环境可能无法完全对应这种模型，C\
  \ 语言提供了两种查看文件的方式：文本视图和二进制视图。\n\n#### 文本模式和二进制模式\n\n首先，让我们区分文本和二进制内容、文本和二进制文件格式，以及文件的文本和二进制模式。\n\
  \n所有文件内容都是二进制形式的（0 和 1）。但如果一个文件主要使用字符的二进制代码（例如 ASCII 或 Unicode）来表示文本（就像 C 字符串那样），那么它就是一个文本文件；它具有文本内容。相反，如果文件中的二进制值代表机器语言代码或数值数据（使用与\
  \ `long` 或 `double` 值相同的内部表示法）或图像或音乐编码，则内容是二进制的。\n\nUnix 对这两种内容都使用相同的文件格式。这并不意外，考虑到\
  \ C 语言是作为开发 Unix 的工具而创建的，C 和 Unix 都使用 `\\n`（换行符）来指示文本中的换行。Unix 目录维护着文件大小计数，程序可以使用该计数来确定何时到达文件末尾（EOF）。然而，其他系统有其他专门用于存放文本的文件处理方法。也就是说，它们的文本文件格式不同于\
  \ Unix 模型。例如，在 OS X 之前的 Macintosh 文件使用 `\\r`（回车符）来指示新行。早期的 MS-DOS 文件使用 `\\r\\n`\
  \ 组合表示换行，并使用嵌入的 Ctrl+Z 字符表示文件结束，尽管实际文件会填充额外的空字符以使总大小成为 256 的倍数。（在 Windows 中，记事本仍然生成\
  \ MS-DOS 格式的文本文件，但较新的编辑器可能会使用更类 Unix 的格式。）其他系统可能会让文本文件中的每行长度相同，在必要时为每行填充空字符以确保长度正确。或者系统可能会在每行的开头编码每行的长度。\n\
  \n为了使文本文件的处理更加规范，C 语言提供了两种访问文件的方式：`binary` 二进制模式和 `text` 文本模式。在二进制模式下，程序可以访问文件的每一个字节。然而，在文本模式下，程序看到的与文件中的内容可能不同。在文本视图中，读取文件时，本地环境对行结束或文件结束等内容的表示会被映射到\
  \ C 视图。同样，C 视图也会映射到输出的本地表示。例如，在旧版 Macintosh 上编译并使用文本模式的 C 程序在以文本模式读取文件时会将 `\\r`\
  \ 转换为 `\\n`，并在写入文件时将 `\\n` 转换为 `\\r`。或者，在 MS-DOS 平台上编译的 C 文本模式程序在读取文件时会将 `\\r\\\
  n` 转换为 `\\n`，在写入文件时将 `\\n` 转换为 `\\r\\n`。为其他环境编写的文本模式程序也会进行类似的调整。\n\n你并不限制仅对文本文件使用文本视图。你也可以使用同一文件的二进制视图。如果你对旧的\
  \ MS-DOS 文本文件这样做，你的程序将同时看到文件中的 `\\r` 和 `\\n` 字符；不会发生映射。（图 13.1 通过一些航海文本说明了这一点。）\n\
  \n![Image](img/13fig01.jpg)\n\n图 13.1 二进制视图和文本视图。\n\n尽管 C 语言提供了二进制视图和文本视图，但这些视图可以用相同的方式实现。正如所述，由于\
  \ Unix 只使用一种文件结构，因此在 Unix 实现中，这两种视图是相同的。这对于 Linux 也是如此。\n\n#### I/O 层级\n\n除了选择文件的视图外，大多数情况下，你可以在两种\
  \ I/O 层级（即两种处理文件访问层级）之间选择。`低级 I/O` 使用操作系统提供的基础 I/O 服务。`标准高级 I/O` 使用标准的 C 库函数包和 `stdio.h`\
  \ 头文件定义。C 标准仅支持标准 I/O 包，因为没有办法能保证所有的操作系统都能通过相同的低级 I/O 模型来表示。特定的实现也可能提供低级库，但由于 C\
  \ 标准建立了可移植的 I/O 模型，我们将集中于它。\n\n#### 标准文件\n\nC 程序会自动代表你打开三个文件。它们被称为*标准输入*（standard\
  \ input）、*标准输出*（standard output）和*标准错误输出*（standard error）。默认情况下，标准输入是系统的正常输入设备，通常是键盘。默认情况下，标准输出和标准错误输出都是系统的正常输出设备，通常是显示器。\n\
  \n标准输入自然而地为你的程序提供输入。它是 `getchar()` 和 `scanf()` 读取的文件。标准输出是程序正常输出去的地方。它被 `putchar()`、`puts()`\
  \ 和 `printf()` 使用。正如你在第 8 章 中学到的，重定向会导致其他文件识别为标准输入或标准输出。标准错误输出文件的目的是提供一个逻辑上独立的地方来发送错误消息。例如，如果你使用重定向将输出发送到文件而不是屏幕，那么发送到标准错误输出的内容仍然显示在屏幕上。这是好事，因为如果错误消息被路由到文件中，你将在查看文件之前是看不到它们的。\n\
  \n\n\n\n\n标准 I/O 包除了可移植性外，相比低级 I/O 还有两个优势。首先，它有许多专门函数函数可以简化处理不同的 I/O 问题。例如，`printf()`\
  \ 将各种形式的数据转换为适用于终端的字符串输出。其次，输入和输出是`缓冲的`（buffered）。也就是说，信息是分大块（通常一次 512 字节或更多）传输的，而不是一次一个字节地传输。例如，当程序读取文件时，一组数据会被复制到缓冲区中——这是一个中间存储区域。这种缓冲极大地提高了数据传输率。程序随后可以检查缓冲区中的单个字节。缓冲是在后台处理的，因此你会有种逐个字符访问的错觉。（你也可以对低级\
  \ I/O 进行缓冲，但你必须自己完成大部分工作。）Listing 13.1 显示了如何使用标准 I/O 读取文件并统计文件中的字符数。我们将在接下来的几个章节中讨论\
  \ Listing 13.1 的特性。（该程序使用了命令行参数。如果你是 Windows 用户，可能需要在编译后在命令提示符窗口中运行程序。如果你是 Macintosh\
  \ 用户，最简单的方法是在 Terminal 中以命令行形式编译并运行程序。或者，如第 11 章中“字符字符串和字符串函数”所述，你可以使用 Xcode 产品菜单为在\
  \ IDE 中运行的程序提供命令行参数。或者，你可以修改程序使用 `puts()` 和 `fgets()` 代替命令行参数来获取文件名。）\n\nListing\
  \ 13.1 count.c 程序\n\n点击此处查看代码图像\n\n* * *\n\n```\n/* count.c -- using standard I/O\
  \ */\n\n#include <stdio.h>\n\n#include <stdlib.h> // exit() prototype\n\nint main(int\
  \ argc, char *argv[])\n\n{\n    int ch;           // 存储读取的每个字符\n    FILE *fp;  \
  \       // \"文件指针\"\n    unsigned long count = 0;\n    if (argc != 2)\n    {\n \
  \       printf(\"Usage: %s filename\\n\", argv[0]);\n        exit(EXIT_FAILURE);\n\
  \    }\n    if ((fp = fopen(argv[1], \"r\")) == NULL)\n    {\n        printf(\"\
  Can't open %s\\n\", argv[1]);\n        exit(EXIT_FAILURE);\n    }\n\n    while ((ch\
  \ = getc(fp)) != EOF)\n    {\n        putc(ch,stdout);  // same as putchar(ch);\n\
  \        count++;\n    }\n    fclose(fp);\n    printf(\"File %s has %lu characters\\\
  n\", argv[1], count);\n    return 0;\n}\n```\n\n* * *\n\n#### 检查命令行参数\n\n首先，Listing\
  \ 13.1 中的程序检查 `argc` 的值以判断是否存在命令行参数。如果没有，程序将打印用法信息并退出。字符串 `argv[0]` 是程序的名称。使用 `argv[0]`\
  \ 而不是显式指定程序名，使得当你更改可执行文件的名称时，错误消息会自动更改。这种功能在 Unix 等允许单个文件拥有多个名称的环境中也非常方便。但请注意——某些操作系统可能无法识别\
  \ `argv[0]`，因此这种用法并不是完全可移植的。\n\n`exit()` 函数导致程序终止并关闭所有已打开的文件。`exit()` 的参数会传递给某些操作系统（包括\
  \ Unix、Linux、Windows 和 MS-DOS），在这些系统中，它可以被其他程序使用。通常的约定是：对于正常终止的程序传递值 `0`，对于异常终止传递非零值。可以使用不同的退出值来区分不同的失败原因，这是\
  \ Unix 和 DOS 编程中的通常做法。然而，并非所有的操作系统都识别相同范围的可能返回值。因此，C 标准规定了一个相当有限的最小范围。特别是，标准要求使用值\
  \ `0` 或宏 `EXIT_SUCCESS` 来表示成功终止，并使用宏 `EXIT_FAILURE` 表示失败终止。这些宏以及 `stdlib.h` 头文件提供了\
  \ `exit()` 的原型声明。\n\n#### fopen() 函数\n\n接下来，程序使用 `fopen()` 打开文件。它的第一个参数是文件名；第二个参数是一个字符串，用于标识打开文件时使用的模式。C\
  \ 提供了若干种可能性，如表 13.1 所示。\n\n注意！\n\n如果你对现有文件使用任何不带 `x` 的 `\"w\"` 模式，`fopen()` 会截断文件，以便你的程序可以从空白状态开始。然而，如果你尝试用带有\
  \ `x` 的模式打开现有文件，则尝试将失败，文件将不受损坏。\n\n当你的程序成功打开文件后，`fopen()` 返回一个文件指针，其他 I/O 函数可以使用该指针来指定文件。文件指针（在本例中为\
  \ `fp`）的类型是指向 `FILE` 的指针；`FILE` 是在 `stdio.h` 中定义的派生类型。指针 `fp` 并不实际文件。相反，它指向一个包含文件信息的对象，包括用于\
  \ I/O 的缓冲区信息。由于标准库中的 I/O 函数使用缓冲区，它们需要知道缓冲区在哪里。它们还需要知道缓冲区有多满以及在使用哪个文件。这使得函数能够在需要时填充或清空缓冲区。`fp`\
  \ 指向的对象包含了所有这些信息。（该对象是一个 C 结构体的示例，我们在第 14 章“结构体和其他数据形式”中讨论过主题。）\n\n#### getc() 和\
  \ putc() 函数\n\n`getc()` 和 `putc()` 这两个函数的工作方式与 `getchar()` 和 `putchar()` 非常相似。区别在于你必须告诉这些新成员要使用哪个文件。因此，以下老习惯意味着“从标准输入获取一个字符”：\n\
  \n```\nch = getchar();\n```\n\n然而，这条语句意味着“从由 `fp` 标识的文件获取一个字符”：\n\n```\nch = getc(fp);\n\
  ```\n\n\n\n\n\n```c\nch = getc(fp);\n```\n\n同样，这条语句的意思是是将字符 `ch` 放入由 `FILE` 指针 `fpout`\
  \ 标识的文件：\n\n```c\nputc(ch, fpout);\n```\n\n在 `putc()` 的参数列表中，字符在前面，然后是文件指针。\n\n\
  列表 13.1 使用 `stdout` 作为 `putc()` 的第二个参数。它在 `stdio.h` 中被定义为与标准输出关联的文件指针，因此 `putc(ch,stdout)`\
  \ 等同于 `putchar(ch)`。事实上，后者函数通常被定义为前者的形式。同样，`getchar()` 被定义为使用标准输入的 `getc()`。\n\n\
  你可能会疑惑为什么这个示例使用了 `putc()` 而不是 `putchar()`。原因之一是为了介绍 `putc()` 函数。另一个原因是你可以通过使用 `stdout`\
  \ 以外的参数，轻松地将此程序转换为产生文件输出。\n\n### 文件结束 (End-of-File)\n\n一个从文件读取数据的程序在到达文件末尾时需要停止。程序如何判断是否已到达末尾？如果\
  \ `getc()` 函数尝试读取字符并发现已到达文件末尾，它将返回特殊值 `EOF`。因此，C 程序只有在尝试读取文件末尾之后，才会发现自己到达了文件末尾。（这与某些语言的行为不同，那些语言使用一个特殊函数在尝试读取*之前*测试文件是否结束。）\n\
  \n为了避免尝试读取空文件时出现问题，你应该对文件输入使用“入口条件循环”（而不是 `do while` 循环）。由于 `getc()`（以及其他 C 输入函数）的设计，程序在进入循环体之前应该尝试进行第一次读取。因此，以下设计是良好的：\n\
  \n点击此处查看代码图片\n\n```c\n// 良好的设计 #1\nint ch;             // 用 int 存储 EOF\nFILE * fp;\n\
  fp = fopen(\"wacky.txt\", \"r\");\nch = getc(fp);      // 获取初始输入\nwhile (ch != EOF)\n\
  {\n    putchar(ch);    // 处理输入\n    ch = getc(fp);  // 获取下一个输入\n}\n```\n\n这可以简化为以下设计：\n\
  \n点击此处查看代码图片\n\n```c\n// 良好的设计 #2\nint ch;\nFILE * fp;\nfp = fopen(\"wacky.txt\"\
  , \"r\");\nwhile (( ch = getc(fp)) != EOF)\n{\n    putchar(ch);  // 处理输入\n}\n```\n\
  \n因为输入语句是 `while` 测试条件的一部分，它在程序进入循环体之前就已经执行了。\n\n你应该避免这种类型的设计：\n\n点击此处查看代码图片\n\n\
  ```c\n// 糟糕的设计（两个问题）\nint ch;\nFILE * fp;\nfp = fopen(\"wacky.txt\", \"r\");\nwhile\
  \ (ch != EOF)    // 第一次使用时 ch 值未\n{\n    ch = getc(fp);   // 获取输入\n    putchar(ch);\
  \    // 处理输入\n}\n```\n\n第一个问题是，当第一次与 `EOF` 比较 `ch` 时，还没有赋值。第二个问题是，如果 `getc()` 确实返回了\
  \ `EOF`，循环会尝试将 `EOF` 当作一个有效字符来处理。这些缺陷是可以修复的。例如，你可以将 `ch` 初始化为一个哑值并在循环内部添加一个 `if`\
  \ 语句，但既然已经有了良好的设计，何何费此呢。\n\n这些警告也适用于其他输入函数。它们在遇到文件末尾后也会返回一个错误信号（可以是 `EOF` 或 `NULL`\
  \ 指针）。\n\n### fclose() 函数\n\n`fclose(fp)` 函数关闭由 `fp` 标识的文件，并根据需要刷新缓冲区。对于一个比这个示例更不那么随意的程序，你应该检查文件是否已成功关闭。`fclose()`\
  \ 函数成功时返回 `0`，失败时返回 `EOF`：\n\n点击此处查看代码图片\n\n```c\nif (fclose(fp) != 0)\n    printf(\"\
  Error in closing file %s\\n\", argv[1]);\n```\n\n`fclose()` 函数可能会失败，例如磁盘已满、可移动存储设备被移除，或者发生了\
  \ I/O 错误。\n\n### 指向标准文件的指针\n\n`stdio.h` 文件将三个文件指针与 C 程序自动打开的三个标准文件关联起来：\n\n![图像](img/574tab01.jpg)\n\
  \n这些指针的类型都是 `pointer-to-FILE`，因此它们可以作为标准 I/O 函数的参数，就像示例中的 `fp` 一样。让我们进入创建一个新文件并向其写入内容的示例。\n\
  \n### 一个简单的压缩程序\n\n接下来的程序将数据从一个文件复制到另一个文件。它打开了两个文件，一个使用 `r` 模式，另一个使用 `w` 模式。列表 13.2\
  \ 通过保留每第三个字符来缩小第一个文件。最后，第二个文件是在原名后追加了 `.red`。使用 `stdout` 以外的参数打开多个文件通常是没有限制的，你将看到它的用途。\n\
  \n```c\n* *\n#include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\n\nint\
  \ main(int argc, char *argv[])\n{\n    FILE *in, *out;  // 声明 FILE 指针\n    int ch;\n\
  \    char name[LEN]; // 用于存储文件名\n    int count = 0;  // 检查命令行参数\n    if (argc <\
  \ 2)\n    {\n        fprintf(stderr, \"Usage: %s\\n\", argv[0]);\n        exit(EXIT_FAILURE);\n\
  \    }\n    // 设置输入\n    if ((in = fopen(argv[1], \"r\")) == NULL)\n    {\n    \
  \    fprintf(stderr,\"I couldn't open the file \\\"%s\\\"\\n\", argv[1]);\n    \
  \    exit(3);\n    }\n    // 设置输出\n    strncpy(name,argv[1], LEN - 5); // 复制文件名\n\
  \    name[LEN - 5] = '\\0';\n    strcat(name,\"\".red\");          // 追加 .red\n\
  \    if ((out = fopen(name, \"w\")) == NULL)\n    {\n        fprintf(stderr,\"Can't\
  \ create output file.\\n\");\n        exit(3);\n    }\n    // 复制数据\n    while ((ch\
  \ = getc(in)) != EOF)\n    {\n        if (count++ % 3 == 0)\n            putc(ch,\
  \ out);  // 打印第三个字符\n    }\n    // 清理\n    if (fclose(in) != 0 || fclose(out) !=\
  \ 0)\n    {\n        fprintf(stderr,\"Error in closing files\\n\");\n    }\n   \
  \ return 0;\n}\n```\n\n* *\n\n这个示例展示了多种编程技巧。现在让我们来检查其中的一些。\n\n`fprintf()` 函数类似于\
  \ `printf()`，不同在于它需要一个文件指针作为第一个参数。我们使用 `stderr` 指针将错误信息发送到标准错误；这是标准的 C 语言做法。\n\n\
  \n\n\n\n为了构造输出文件的新名称，程序使用 `strncpy()` 将名称 `eddy` 拷贝到数组 `name` 中。`LEN - 5` 参数为 `.red`\
  \ 后缀和最后的空字符留出了空间。如果 `argv[2]` 字符串长于 `LEN – 5`，则不会拷贝空字符，因此程序会以防万一添加一个空字符。在 `strncpy()`\
  \ 调用后，`name` 中的第一个空字符会在 `strcat()` 函数附加该字符串时被 `.red` 中的点覆盖，从而在在这种情况下生成了 `eddy.red`。我们还检查了程序是否成功打开了该名称的文件。这在某些环境中尤为重要，因为像\
  \ `strange.c.red` 这样的文件名可能是无效的。例如在传统的 DOS 下，你不能为扩展名添加扩展。（正确的 MS-DOS 方法是将任何现有的扩展名替换为\
  \ `.red`，因此 `strange.c` 的精简版本将是 `strange.red`。例如你可以使用 `strchr()` 函数来定位名称中的点（如果有），并仅复制点之前的字符串部分。）\n\
  \n此程序同时打开了两个文件，因此我们声明了两个 `FILE` 指针。注意，每个文件的打开和关闭是相互独立的。一次性可以打开的文件数量是有限制的。限制取决于你的系统和实现；范围通常是\
  \ 10 到 20。只要这些文件没有同时打开，你就可以对不同的文件使用同一个文件指针。\n\n### 文件 I/O：`fprintf()`, `fscanf()`,\
  \ `fgets()` 和 `fputs()`\n\n对于前几章节中的每个 I/O 函数，都有一个类似的文件 I/O 函数。主要的区别在于，你需要使用 `FILE`\
  \ 指针来告诉新函数要对哪个文件进行操作。与 `getc()` 和 `putc()` 一样，这些函数要求你通过指向 FILE 的指针（如 `stdout`）来标识文件，或者使用\
  \ `fopen()` 的返回值。\n\n#### `fprintf()` 和 `fscanf()` 函数\n\n文件 I/O 函数 `fprintf()` 和\
  \ `fscanf()` 的工作方式与 `printf()` 和 `scanf()` 相同，但它们需要额外的第一个参数来标识正确的文件。你已经用过 `fprintf()`\
  \ 了。代码列表 13.3 展示了这两个文件 I/O 函数以及 `rewind()` 函数。\n\n代码列表 13.3 `addaword.c` 程序\n\n\
  ```c\n/* addaword.c -- uses fprintf(), fscanf(), and rewind() */\n#include <stdio.h>\n\
  #include <stdlib.h>\n#include <string.h>\n\n#define MAX 41\n\nint main(void)\n{\n\
  \    FILE *fp;\n    char words[MAX];\n    if ((fp = fopen(\"wordy\", \"a+\")) ==\
  \ NULL)\n    {\n        fprintf(stdout,\"Can't open \\\"wordy\\\" file.\\n\");\n\
  \        exit(EXIT_FAILURE);\n    }\n    puts(\"Enter words to add to the file;\
  \ press the #\");\n    puts(\"key at the beginning of a line to terminate.\");\n\
  \    while ((fscanf(stdin,\"%40s\", words) == 1)  && (words[0] != '#'))\n      \
  \  fprintf(fp, \"%s\\n\", words);\n    puts(\"File contents:\");\n    rewind(fp);\
  \             /* go back to beginning of file */\n    while (fscanf(fp,\"%s\",words)\
  \ == 1)\n        puts(words);\n    puts(\"Done!\");\n    if (fclose(fp) != 0)\n\
  \        fprintf(stderr,\"Error closing file\\n\");\n    return 0;\n}\n```\n\n此程序允许你向文件中添加单词。通过使用\
  \ `\"a+\"` 模式，程序可以对文件进行读写操作。第一次使用该程序时，它会创建 `wordy` 文件并允许你向其中放入单词，每行一个。当你之后使用该程序时，它允许你向之前的内容添加（追加）单词。追加模式仅允许向文件末尾添加内容，但\
  \ `\"a+\"` 模式确实允许你读取整个文件。`rewind()` 命令将程序带回文件开头，以便最后的 `while` 循环可以打印文件内容。注意 `rewind()`\
  \ 接收一个文件指针参数。\n\n以下是 Unix 环境下的示例运行结果（可执行程序已重命名为 `addaword`）：\n\n```\n$ addaword\n\
  Enter words to add to the file; press the key at the beginning of a line to terminate.\n\
  File contents:\n...\nDone!\n$ addaword\nEnter words to add to the file; press the\
  \ key at the beginning of a line to terminate.\nFile contents:\n...\nDone!\n```\n\
  \n如你所示，`fprintf()` 和 `fscanf()` 的工作类似于 `printf()` 和 `scanf()`。与 `putc()` 不同，`fprintf()`\
  \ 和 `fscanf()` 函数将 `FILE` 指针作为第一个参数。\n\n#### `fgets()` 和 `fputs()` 函数\n\n你在第 1 章遇到过\
  \ `fgets()`。第一个参数与 `gets()` 类似，是应存储输入的内容的地址（`char *`）。第二个参数是一个整数，表示输入的最大尺寸。最后一个参数是标识文件的文件指针。因此，函数调用看起来如下：\n\
  \n```c\nfgets(buf, STLEN, fp);\n```\n在这里，`buf` 是 `char` 数组的名字，`STLEN` 是字符串的最大尺寸，`fp`\
  \ 是指向 FILE 的指针。\n\n正如我们之前看到的，`fgets()` 函数通过第一个换行符读取输入，直到读取的字符少于上限，或者遇到文件结束符（EOF）；随后\
  \ `fgets()` 会添加一个终止空字符以形成字符串。因此，上限代表的是字符数加上空字符的总数。如果 `fgets()` 在遇到字符限制之前读取了整行，它会将换行符（标记行结束）放在空字符之前的字符串中。当\
  \ `fgets()` 遇到 `EOF` 时返回值 `NULL`。你可以用此检查文件是否结束。否则，它返回传递给它的地址。\n\n`fputs()` 函数接受两个参数：首先是字符串的地址，然后是文件指针。它将指向位置的字符串写入指定的文件。与\
  \ `puts()` 不同，`fputs()` 在打印时不会追加换行符。调用形式如下：\n\n```c\nfputs(buf, fp);\n```\n在这里，`buf`\
  \ 是字符串地址，`fp` 标识目标文件。由于 `fgets()` 保留了换行符而 `fputs()` 不添加，它们配合得很好。如列表 1.8 所示，如果 `STLEN`\
  \ 小于输入长度，它们可以协同工作。\n\n### 随机访问：`fseek()` 和 `ftell()`\n\n`fseek()` 函数允许你像数组一样处理文件，直接移动到\
  \ `fopen()` 打开的文件任意字节。为了查看它是如何工作的，让我们创建一个（见列表 13.4）倒序显示文件的程序。注意 `fseek()` 有三个参数并返回一个\
  \ `int` 值。`ftell()` 函数以 `long` 值返回文件中的当前位置。\n\n代码列表 13.4 `reverse.c` 程序\n\n```c\n\
  /* reverse.c -- displays a file in reverse order */\n#include <stdio.h>\n#include\
  \ <stdlib.h>\n#define CNTL_Z '\\032  /* eof marker in DOS text files */\n#define\
  \ SLEN 81\n\nint main(void)\n{\n    char file[SLEN];\n    char ch;\n    FILE *fp;\n\
  \    long count, last;\n    puts(\"Enter the name of the file to be processed:\"\
  );\n    scanf(\"%80s\", file);\n    if ((fp = fopen(file,\"rb\")) == NULL)\n   \
  \ {               /* read-only mode */\n        printf(\"reverse can't open %s\\\
  n\", file);\n        exit(EXIT_FAILURE);\n    }\n    fseek(fp, 0L, SEEK_END);  \
  \  /* to end of file */\n    last = ftell(fp);\n    for (count = 1L; count <= last;\
  \ count++)\n    {\n        fseek(fp, -count, SEEK_END); /* go backward */\n    \
  \    ch = getc(fp);\n        if (ch != CNTL_Z && ch != '\\r')  /* MS-DOS files */\n\
  \            putchar(ch);\n    }\n    putchar('\\n');\n    fclose(fp);\n}\n```\n\
  \n\n\n\n\n```c\nreturn 0;\n\n}\n```\n\n***\n\n以下是示例文件的输出：\n\n点击此处查看代码图像\n\n输入要处理的文件名：\n\
  \nCluv\n\n一个更复杂的程序（反过来写是）\n\n我想我应该重写它（反过来写是）\n\n该程序使用二进制模式，以便能够同时处理 MS-DOS 文本文件和\
  \ Unix 文件。然而，在某些使用其他文本文件格式的环境，它可能无法正常工作。\n\n***\n\n### 注意事项\n\n如果你从命令行环境运行该程序，该程序期望文件名与可执行程序位于同一个目录（或文件夹）中。如果你在\
  \ IDE 中运行程序，则程序查找文件的位置取决于具体实现。例如，Microsoft Visual Studio 2012 默认查找包含源代码的目录，而 Xcode\
  \ 4.6 则查找包含可执行文件的目录查找。\n\n***\n\n我们现在需要讨论三个话题：`fseek()` 和 `ftell()` 是如何工作的、如何使用二进制流，以及如何使程序具有移植性。\n\
  \n## fseek() 和 ftell() 的工作原理\n\n`fseek()` 的三个参数中的第一个是指向要搜索文件的 `FILE` 指针。该文件应该已经通过\
  \ `fopen()` 打开。\n\n`fseek()` 的第二个参数称为 `offset`（偏移量）。该参数告诉程序从起点移动多少距离（请参见下面的模式起始点列表）。该参数必须是一个\
  \ `long` 类型的值。它可以是正数（向前移动）、负数（向后移动）或零（留在）。\n\n第三个参数是模式（mode），它标识起始点。自 ANSI 标准以来，`stdio.h`\
  \ 头文件规定了以下模式的显式常量：\n\n![图像](img/581tab01.jpg)\n\n旧版本的实现可能缺少这些定义，取而分别使用数值值 `0L`、`1L`\
  \ 和 `2L` 来表示这些模式。请记住，`L` 后缀标识类型为 `long` 的值。或者实现可能在不同的头文件中定义了这些常量。如有疑问，请查阅你的用户手册或在线手册。\n\
  \n以下是一些示例函数调用，其中 `fp` 是一个文件指针：\n\n点击此处查看代码图像\n\n```c\nfseek(fp, 0L, SEEK_SET); \
  \  // 转到文件开头\nfseek(fp, 10L, SEEK_SET);  // 在文件中移动 10 字节\nfseek(fp, 2L, SEEK_CUR);\
  \   // 从当前位置向前移动 2 字节\nfseek(fp, 0L, SEEK_END);   // 转到文件末尾\nfseek(fp, -10L, SEEK_END);\
  \ // 从文件末尾回退 10 字节\n```\n\n这些调用存在某些限制；稍后我们会回到那个话题。\n\n如果一切正常，`fseek()` 返回值为 `0`；如果发生错误（例如尝试越文件边界），则返回\
  \ `-1`。\n\n`ftell()` 函数的类型为 `long`，它返回当前的文件位置。在 ANSI C 中，它在 `stdio.h` 中声明。在最初的 Unix\
  \ 的实现中，`ftell()` 通过返回从开始计算的字节数来指定文件位置，第一个字节为字节 0，依此类推。在 ANSI C 中，此定义适用于以二进制模式打开的文件，但不一定适用于以文本模式打开的文件。这就是为什么\
  \ 列表 13.4 使用二进制模式的原因之一。\n\n现在我们可以检查 列表 13.4 的基本元素。首先，语句\n\n```c\nfseek(fp, 0L, SEEK_END);\n\
  ```\n\n将位置设置为相对于文件末尾偏移量 0 字节。也就是说，它将位置设置为文件末尾。接下来，语句\n\n```c\nlast = ftell(fp);\n\
  ```\n\n将从文件开始到末尾的字节数赋值给 `last`。\n\n接下来是这个循环：\n\n点击此处查看代码图像\n\n```c\nfor (count =\
  \ 1L; count <= last; count++)\n{\n  fseek(fp, -count, SEEK_END);    /* 向后移动 */\n\
  \  ch = getc(fp);\n}\n```\n\n第一个循环将程序定位在文件末尾之前的第一个字符（即文件的最后一个字符）。然后程序打印该字符。下一个循环将程序定位在在前一个字符上并打印它。这个过程一直持续到到达并打印第一个字符。\n\
  \n## 二进制模式与文本模式\n\n我们设计 列表 13.4 是为了在 Unix 和 MS-DOS 环境下都能运行。Unix 只有一种文件格式，因此不需要特殊调整。然而，MS-DOS\
  \ 的需要额外的关注。许多 MS-DOS 编辑器用 `Ctrl+Z` 字符标记文本文件的结束。当在文本模式下打开此类文件时，它会被识别为文件末尾。在二进制模式下，该字符被视为文件的普通字节。与文本模式不同，二进制模式不会翻译换行符。在处理包含空字符的文件时，二进制模式至关重要。该程序使用二进制模式，以便能够同时处理\
  \ MS-DOS 文本文件和 Unix 文件。然而，在某些使用其他文本文件格式的环境，它可能无法正常工作。\n\n## 移植性\n\n理想情况下，`fseek()`\
  \ 和 `ftell()` 应该遵循 Unix 模型。然而，系统之间的差异使得这变得不可能。因此，ANSI 对这些函数给出了较低的预期。是一些限制：\n\n![图像](img/squf.jpg)\
  \ 在二进制模式下，实现不需要支持 `SEEK_END`。那么，列表 13.4 并不保证具有移植性。更具移植性的方法是逐字节读取整个文件。但顺序读取文件到末尾比直接跳转到末尾慢。C\
  \ 预处理器条件编译指令在第 16 章中讨论过，“C 预处理器与 C 标准库”，提供了一种处理替代代码的系统方法。\n\n![图像](img/squf.jpg)\
  \ 在文本模式下，只有这些 `fseek()` 调用是保证有效的：\n\n![图像](img/583tab01.jpg)\n\n幸运的是，许多常见环境允许对这些函数进行加强实现。\n\
  \n## fgetpos() 和 fsetpos() 函数\n\n`fseek()` 和 `ftell()` 的一个潜在问题是将大小限制在 `long` 可以表示的值。几十亿字节似乎足够，但存储设备容量不断增长使得大文件成为可能。ANSI\
  \ C 引入了两个新的定位函数，用于处理更大的文件。这些函数不再使用 `long` 值来表示位置，而是使用一个新类型 `fpos_t`（文件位置类型）来实现该目的。`fpos_t`\
  \ 类型不是基本类型；相反，它是根据其他类型定义的。`fpos_t` 变量或数据对象可以指定文件中的位置，且它不能是数组类型，但在此之外未规定其性质。实现可以可以提供一种满足特定平台的类型。\n\
  \nANSI C 确实定义了如何使用 `fpos_t`。`fgetpos()` 函数具有如下原型：\n\n\n\n\n\n点击此处查看代码图像\n\n```c\n\
  int fgetpos(FILE * restrict stream, fpos_t * restrict pos);\n```\n\n调用该函数时，它会将一个\
  \ `fpos_t` 值存放在 `pos` 指向的位置；该值描述了文件中的一个位置。函数执行成功时返回 0，失败时返回非零值。\n\n`fsetpos()` 函数的原型如下：\n\
  \n点击此处查看代码图像\n\n```c\nint fsetpos(FILE *stream, const fpos_t *pos);\n```\n\n调用该函数时，它使用\
  \ `pos` 指向的位置中的 `fpos_t` 值将文件指针设置为该值所指示的位置。函数执行成功时返回 0，失败时返回非零值。该 `fpos_t` 值应该通过之前调用\
  \ `fgetpos()` 获得的。\n\n### 标准 I/O 的内部机制\n\n现在你已经了解了标准 I/O 包的一些功能，让我们来检查一个代表性的概念模型，看看标准\
  \ I/O 是如何工作的。\n\n通常，使用标准 I/O 的第一步是使用 `fopen()` 打开文件。（但请记住，`stdin`、`stdout` 和 `stderr`\
  \ 文件是自动打开的。）`fopen()` 函数不仅打开一个文件，还会设置一个缓冲区（读写模式下有两个缓冲区），并设置一个包含文件信息和缓冲区信息的数据结构。此外，`fopen()`\
  \ 返回一个指向该结构的指针，以便其他函数知道去哪里找到它。假设该值被赋值给名为 `fp` 的指针变量。`fopen()` 函数被称为“打开一个流”。如果以文本模式打开文件，你将获得一个文本流；如果以二进制模式打开文件，你将获得一个二进制流。\n\
  \n该数据结构通常包含一个文件位置指示器，用于指定流中的当前位置。它还有错误和文件结束指示器、一个指向缓冲区开头的指针、一个文件标识符以及实际复制到缓冲区中的字节数计数。\n\
  \n让我们关注文件输入。通常，下一步是调用 `stdio.h` 中声明的输入函数之一，例如 `fscanf()`、`getc()` 或 `fgets()`。调用这些函数中的任何一个都会导致数据数据从文件复制到缓冲区。缓冲区的大小取决于实现，但它通常是\
  \ 512 字节或其倍数，例如 4,096 或 16,384 字节。（随着硬盘和计算机内存的增大，缓冲区大小的选择往往也会变大。）除了填充缓冲区外，初始函数调用还会设置\
  \ `fp` 指向的结构中的值。特别是流中的当前位置和复制到缓冲区中的字节数会被设置。通常当前位置从第 0 字节开始。\n\n在数据结构和缓冲区初始化后，输入函数从缓冲区中读取请求的数据。在读取过程中，文件位置指示器被设置为指向最后一个读取字符之后的下一个字符。由于\
  \ `stdio.h` 系列的所有输入函数都使用相同的缓冲区，因此调用其中任何一个函数都会从上一次调用任何一个函数停止的地方继续。\n\n当输入函数发现它已经读取了缓冲区中的所有字符时，它会请求将下一个缓冲区大小的数据从文件复制到缓冲区中。通过这种方式，输入函数可以读取直到文件结束的所有文件内容。当函数读取完最后一个缓冲区大小的数据的数据后，它会将文件结束指示器设置为真。下一次调用输入函数将返回\
  \ `EOF`。\n\n类似地，输出函数写入缓冲区。当缓冲区填满时，数据会被复制到文件中。\n\n### 其他标准 I/O 函数\n\nANSI 标准库在标准\
  \ I/O 族中包含三十多个函数。虽然我们在这里没有涵盖它们，但我们将简要描述另外几个，以便你对可用功能有较好的了解。我们将通过每个函数的 C 原型列出它们，以指示其参数和返回值。在我们讨论的这些函数中，除\
  \ `setvbuf()` 之外，所有函数在预 ANSI 实现中也是可用的。参考章节 V，“带有 C99 扩展的标准 ANSI C 库](#app02.html_app02lev1sec5)”列出了完整的\
  \ ANSI C 标准 I/O 包。\n\n#### int ungetc(int c, FILE *fp) 函数\n\n`int ungetc()` 函数将\
  \ `c` 指定的字符推回输入流。如果你向输入流中推回一个字符，下一次调用标准输入函数将读取该字符（参见图 13.2）。例如，假设你想让一个函数读取字符直到但不包含下一个冒号。你可以使用\
  \ `getchar()` 或 `getc()` 读取字符直到读到冒号，然后使用 `ungetc()` 将冒号放回输入流。ANSI C 标准保证一次只允许推回一次。如果某种实现允许你连续推回几个字符，则输入函数读取这些字符的顺序与推回的顺序相反。\n\
  \n![图像](img/13fig02.jpg)\n\n图 13.2 `ungetc()` 函数。\n\n#### int fflush() 函数\n\n`fflush()`\
  \ 的原型如下：\n\n```c\nint fflush(FILE *fp);\n```\n\n调用 `fflush()` 函数会将输出缓冲区中未写入的数据发送到\
  \ `fp` 标识的文件。这个过程被称为*刷新缓冲区*。如果 `fp` 为空指针，所有输出缓冲区都会刷新。在输入流上使用 `fflush()` 的效果是未定义的。\n\
  \n#### int setvbuf()\n\n`setvbuf()` 的原型如下：\n\n点击此处查看代码图像\n\n```c\nint setvbuf(FILE\
  \ * restrict fp, char * restrict buf, int mode, size_t size);\n```\n\n`setvbuf()`\
  \ 函数为标准 I/O 函数设置一个替代缓冲区。它在文件打开之后、执行其他操作之前被调用。指针 `fp` 标识流，`buf` 指向要使用的存储器。如果 `buf`\
  \ 的值为 `NULL`，则你必须创建缓冲区。例如，你可以声明一个 1024 个 `char` 的数组并传递该数组的地址。然而，如果你对 `buf` 使用 `NULL`，该函数将自行分配缓冲区。`size`\
  \ 变量告诉 `setvbuf()` 数组的大小。（`size_t` 类型是一种派生整数类型；参见第 5 章，“运算符、表达式和语句](#ch05.html_ch05)”）`mode`\
  \ 从以下选项中选择：`_IOFBF` 表示全缓冲（满时刷新），`_IOLBF` 表示行缓冲（满或写入换行符时刷新），以及 `_IONBF` 表示无缓冲。函数执行成功时返回\
  \ 0，否则返回非零。\n\n假设你有一个程序处理每个大小为 3,000 字节的存储对象的数据。你可以使用 `setvbuf()` 创建一个大小为数据对象大小倍数的缓冲区。\n\
  \n#### 二进制 I/O：fread() 和 fwrite()\n\n`fread()` 和 `fwrite()` 函数是列表中的下一个，但先介绍一些背景。你目前为止使用的标准\
  \ I/O 函数是面向文本的，处理字符和字符串。但如果你想在文件中保存数值数据呢？诚然，你可以使用 `fprintf()` 和 `%f` 格式来保存浮点值，但那时你是将其作为字符序列保存的。例如，以下代码\n\
  \n```c\ndouble num = 1./3.\n\nfprintf(fp,\"%f\", num);\n```\n\n\n\n\n将 `num` 保存为八个字符的序列：`0.333333`。使用\
  \ `%.2f` 格式符将其保存为四个字符：`0.33`。使用 `%.12f` 格式符将其保存为 14 个字符：`0.333333333333`。更改格式符会改变存储该值所需的空间；也可能导致存储不同的值。当\
  \ `num` 的值被存储为 `0.33` 后，在读取文件时无法找回原始精度。通常情况下，`fprintf()` 将数值转换为字符数据，可能会改变该值。\n\n\
  存储数字最准确且一致的方法是使用与计算机相同的位模式。因此，一个 `double` 值应该存储在大小为 `double` 的单元中。当使用与程序相同的表示法将数据存储在文件中时，我们称该数据是以`二进制形式`存储的。不存在从数值形式到字符序列的转换。对于标准输入/输出，`fread()`\
  \ 和 `fwrite()` 函数提供了这种二进制服务（参见图 13.3）。\n\n![Image](img/13fig03.jpg)\n\n图 13.3 二进制与文本输出。\n\
  \n实际上，正如你可能记得，所有数据都是以`二进制形式`存储的。即使字符也是使用字符代码的二进制表示存储的。然而，如果文件中所有数据都被解释为字符代码，我们称该文件包含`文本数据`。如果部分或全部数据被解释为`二进制形式`的数值数据，我们称该文件包含`二进制数据`。（此外，数据代表机器语言指令的文件是二进制文件。）\n\
  \n`binary` 和 `text` 这两个术语的使用可能会引起混淆。ANSI C 识别了两种打开文件的模式：二进制和文本。许多操作系统识别两种文件格式：二进制和文本。信息可以以二进制数据或文本数据的形式存储或读取。这些之间都是相关的，但并不等同。你可以以二进制模式打开文本格式文件。你可以在二进制格式文件中存储文本。你可以使用\
  \ `getc()` 来复制包含二进制数据的文件。但通常情况下，你使用二进制模式在二进制格式文件中存储二进制数据。同样，你最经常在以文本格式打开的文本文件中使用文本数据。（文字处理器产生的文件通常是二进制文件，因为它们包含了大量描述字体和格式的非文本信息。）\n\
  \n### size_t fwrite() 函数\n\n`fwrite()` 的原型如下：\n\n点击此处查看代码图像\n\n```c\nsize_t fwrite(const\
  \ void * restrict ptr, size_t size, size_t nmemb,\n                FILE * restrict\
  \ fp);\n```\n\n`fwrite()` 函数向文件写入二进制数据。`size_t` 类型根据标准 C 类型定义。它是 `sizeof` 运算符返回的类型。通常，它是\
  \ `unsigned int`，但实现可以可以选择另一种类型。指针 `ptr` 是要写入的数据块的地址。此外，`size` 代表要写入的数据块的大小（以字节为单位），`nmemb`\
  \ 代表要写入的数据块数。一如既，`fp` 标识要写入的文件。例如，为了保存一个大小为 256 字节的数据对象（如数组），你可以这样做：\n\n```c\nchar\
  \ buffer[256];\nfwrite(buffer, 256, 1, fp);\n```\n\n此调用从 `buffer` 向文件写入一个 256 字节的块。或者，为了保存一个包含\
  \ 10 个 `double` 值的数组，你可以这样做：\n\n点击此处查看代码图像\n\n```c\ndouble earnings[10];\nfwrite(earnings,\
  \ sizeof (double), 10, fp);\n```\n\n此调用将 `earnings` 数组的数据分 10 个块写入文件，每个块的大小为 `double`。\n\
  \n你可能注意到了 `fwrite()` 原型中 `const void * restrict ptr` 奇特的声明。`fwrite()` 的一个问题是它的第一个参数不是固定类型。例如，第一个示例使用了\
  \ `buffer`，其类型是指向 `char` 的指针；而第二个示例使用了 `earnings`，其类型是指向 `double` 的指针。在 ANSI C 函数原型规定下，这些实际参数被转换为指向\
  \ `void` 的指针类型，它充当了指针的通用类型。（非 ANSI C 使用类型 `char *` 作为此参数，需要你将实际参数强制转换为该类型。）\n\n\
  `fwrite()` 函数返回成功写入的项目数。通常，这等于 `nmemb`，如果发生写入错误，它可能会较小。\n\n### size_t fread() 函数\n\
  \n`fread()` 的原型如下：\n\n点击此处查看代码图像\n\n```c\nsize_t fread(void * restrict ptr, size_t\
  \ size, size_t nmemb,\n                FILE * restrict fp);\n```\n\n`fread()` 函数采用与\
  \ `fwrite()` 相同的参数。这次 `ptr` 是将读取数据的内存地址，`fp` 标识要读取的文件。使用 `fwrite()`。例如，为了恢复数组，请使用以下代码：\n\
  \n点击此处查看代码图像\n\n```c\ndouble earnings[10];\nfread(earnings, sizeof (double), 10,\
  \ fp);\n```\n\n此调用将 10 个 `double` 写入 `earnings` 数组。`fread()` 返回成功读取的项目。通常，这等于 `nmemb`，但如果发生读取错误或到达文件尾，它可能会较小。\n\
  \n### int feof(FILE *fp) 和 int ferror(FILE *fp) 函数\n\n当标准输入函数返回 `EOF` 时，这意味着它们已到达文件尾。然而，它也可能指示发生了错误。`feof()`\
  \ 和 `ferror()` 函数让你能够区分这两种可能性。如果最后一次调用检测到文件尾，`feof()` 返回非零值，否则返回零。如果发生了读取错误，`ferror()`\
  \ 返回非零值，否则返回零。\n\n\n\n\n```c\n    char file_src[SLEN];  // name of source file\n\
  \n    int ch;\n\n    puts(\"Enter name of destination file:\");\n    s_gets(file_app,\
  \ SLEN);\n    if ((fa = fopen(file_app, \"a+\")) == NULL)\n    {\n        fprintf(stderr,\
  \ \"Can't open %s\\n\", file_app);\n        exit(EXIT_FAILURE);\n    }\n    if (setvbuf(fa,\
  \ NULL, _IOFBF, BUFSIZE) != 0)\n    {\n        fputs(\"Can't create output buffer\\\
  n\", stderr);\n        exit(EXIT_FAILURE);\n    }\n    puts(\"Enter name of first\
  \ source file (empty line to quit):\");\n    while (s_gets(file_src, SLEN) && file_src[0]\
  \ != '\\0')\n    {\n        if (strcmp(file_src, file_app) == 0)\n            fputs(\"\
  Can't append file to itself\\n\",stderr);\n        else if ((fs = fopen(file_src,\
  \ \"r\")) == NULL)\n            fprintf(stderr, \"Can't open %s\\n\", file_src);\n\
  \        else\n        {\n            if (setvbuf(fs, NULL, _IOFBF, BUFSIZE) !=\
  \ 0)\n            {\n                fputs(\"Can't create input buffer\\n\",stderr);\n\
  \                continue;\n            }\n            append(fs, fa);\n       \
  \     if (ferror(fs) != 0)\n                fprintf(stderr,\"Error in reading file\
  \ %s.\\n\", file_src);\n            if (ferror(fa) != 0)\n                fprintf(stderr,\"\
  Error in writing file %s.\\n\", file_app);\n            fclose(fs);\n          \
  \  files++;\n            printf(\"File %s appended.\\n\", file_src);\n         \
  \   puts(\"Next file (empty line to quit):\");\n        }\n    }\n    printf(\"\
  Done appending. %d files appended.\\n\", files);\n    rewind(fa);\n    printf(\"\
  %s contents:\\n\", file_app);\n    while ((ch = getc(fa)) != EOF)\n        putchar(ch);\n\
  \    puts(\"Done.\");\n    fclose(fa);\n    return 0;\n}\n\nvoid append(FILE *source,\
  \ FILE *dest)\n{\n    size_t bytes;\n    static char temp[BUFSIZE]; // allocate\
  \ once\n    while ((bytes = fread(temp,sizeof(char),BUFSIZE,source)) > 0)\n    \
  \    fwrite(temp, sizeof (char), bytes, dest);\n}\n\nchar * s_gets(char * st, int\
  \ n)\n{\n    char * ret_val;\n    char * find;\n    ret_val = fgets(st, n, stdin);\n\
  \    if (ret_val)\n    {\n        find = strchr(st, '\\n'); // look for newline\n\
  \        if (find) // if the address is not NULL,\n            *find = '\\0'; //\
  \ place null character there\n        else\n            while (getchar() != '\\\
  n')\n                continue;\n    }\n    return ret_val;\n}\n```\n\n\n\n\nC 语言解释字节输入流或输出流的方式取决于你使用的输入/输出函数。程序既可以原封不动地读取并存储字节，也可以将字节解释为字符，而字符又可以被解释为普通文本或数字的文本表示。同样，在输出时，你使用的函数决定了二进制值是被原封不动地传输，还是转换为文本或数字的文本表示。如果你有需要保存并恢复且不丢失精度的数值数据，请使用二进制模式以及\
  \ `fread()` 和 `fwrite()` 函数。如果你正在保存文本信息并想创建可以使用普通文本编辑器查看的文件，请使用文本模式以及如 `getc()`\
  \ 和 `fprintf()` 等函数。\n\n要访问文件，你需要创建一个文件指针（类型为 `FILE *`）并将该指针与特定的文件名关联。随后的代码在处理文件时将使用指针而非文件名。\n\
  \n理解 C 如何处理“文件结束”（end-of-file）概念是非常关重要的。通常，一个读取文件的程序使用循环读取输入，直到到达文件末尾。C 的输入函数在尝试读取文件末尾之后是无法检测到文件结束的。这意味着检测文件结束测试应该在尝试读取*之后*立即进行。你可以参考本章“文件结束”节中标记为“良好设计”的双文件输入模型作为指南。\n\
  \n### 总结\n\n向文件写入和从文件读取对于大多数 C 程序来说都是至关重要的。大多数 C 实现都为这些目的提供了低级 I/O 服务和标准高级 I/O 服务。由于\
  \ ANSI C 库包含了标准 I/O 服务但不包含低级服务，因此标准包具有更好的可移植性。\n\n标准 I/O 包会自动创建输入和输出缓冲区以加速数据传输。`fopen()`\
  \ 函数打开一个文件用于标准 I/O，并创建一个用于存储文件和缓冲区信息的数据结构。`fopen()` 函数返回指向该数据结构的指针，该指针被其他函数用于标识要被处理的文件。`feof()`\
  \ 和 `ferror()` 函数报告 I/O 操作失败的原因。\n\nC 将输入视为字节流。如果你使用 `fread()`，C 将输入视为二进制值，并将其置于你指定的任何存储位置。如果你使用\
  \ `fscanf()`、`getc()`、`fgets()` 或任何相关函数，C 将每个字节视为字符代码。随后，`fscanf()` 和 `scanf()`\
  \ 函数尝试根据格式说明符将字符代码翻译为其他类型。例如，`%f` 说明符会将输入 `23` 翻译为浮点值，`%d` 说明符会将相同的输入翻译为整数值，而 `%s`\
  \ 说明符会将字符输入保存为字符串。`getc()` 和 `fgets()` 函数族将输入保持为字符代码，并将其存储在 `char` 变量中作为单个字符，或存储在\
  \ `char` 数组中作为字符串。同样，`fwrite()` 将二进制数据直接放入输出流，而其他输出函数在放入输出流之前会将非字符数据转换为字符表示。\n\n\
  ANSI C 提供了两种文件打开模式：二进制和文本。当文件以二进制模式打开时，可以按字节读取。当文件以文本模式打开时，其内容可能会从系统的文本表示映射为 C 的表示。对于\
  \ Unix 和 Linux 系统，这两种模式是相同的。\n\n输入函数 `getc()`、`fgets()`、`fscanf()` 和 `fread()` 通常从文件开始顺序读取。然而，`fseek()`\
  \ 和 `ftell()` 函数允许程序移动到文件的任意位置，实现随机访问。`fgetpos()` 和 `fsetpos()` 将类似的能力扩展到更大的文件。随机访问在二进制模式下的效果比文本模式下更好。\n\
  \n### 复习题\n\n你可以在附录 A 中的“[复习题答案”找到复习题的答案。\n\n**1.** 这个程序哪里有问题？\n\n点击此处查看代码图像\n\n\
  ```c\nint main(void)\n{\n    int * fp;\n    int k;\n    fp = fopen(\"gelatin\");\n\
  \    for (k = 0; k < 30; k++)\n        fputs(fp, \"Nanette eats gelatin.\");\n \
  \   fclose(\"gelatin\");\n    return 0;\n}\n```\n\n**2.** 下面这个程序会做什么？（假设它在命令行环境中运行。）\n\
  \n点击此处查看代码图像\n\n```c\n#include <stdio.h>\n#include <stdlib.h>\n#include <ctype.h>\n\
  int main(int argc, char *argv[])\n{\n    int ch;\n    FILE *fp;\n    if (argc <\
  \ 2)\n        exit(EXIT_FAILURE);\n    if ((fp = fopen(argv[1], \"r\")) == NULL)\n\
  \        exit(EXIT_FAILURE);\n    while ((ch=getc(fp)) != EOF)\n        if(isdigit(ch))\n\
  \            putchar(ch);\n    fclose(fp);\n    return 0;\n}\n```\n\n**3.** 假设你有以下语句点击此处查看代码图像\n\
  \n```c\n#include <stdio.h>\nFILE *fp1,*fp2;\nchar ch;\nfp1 = fopen(\"terky\", \"\
  r\");\nfp2 = fopen(\"jerky\", \"w\");\n```\n\n为函数调用提供缺失的参数：\na. `ch = getc(fp1);`\n\
  b. `fprintf(fp2 ,\"c\\n\", ch);`\nc. `putc(ch, fp2);`\nd. `fclose(fp1); /* 关闭 terky\
