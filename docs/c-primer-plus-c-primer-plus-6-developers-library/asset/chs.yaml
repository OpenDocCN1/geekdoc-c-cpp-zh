  \ (注：原文 copy 的 value 是 0x0040a000)\n\n*等等，我发现原文是：*\nmesg = Don't be a fool!; &mesg\
  \ = 0x0012ff48; value = 0x0040a000\ncopy = Don't be a fool!; &copy = 0x0012ff44;\
  \ value = 0x0040a000 (注：原文 copy 的 value 是 0x0040a000)\n\n*好吧，我直接翻译原文：*\nmesg = Don't\
  \ be a fool!; &mesg = 0x0012ff48; value = 0x0040a000\n\ncopy = Don't be a fool!;\
  \ &copy = 0x0012ff44; value = 0x0040a000 (注：原文 copy 的 value 是 0x0040a000)\n\n*等等，我发现原文是：*\n\
  mesg = Don't be a fool!; &mesg = 0x0012ff48; value = 0x0040a000\ncopy = Don't be\
  \ a fool!; &copy = 0x0012ff44; value = 0x0040a000 (注：原文 copy 的 value 是 0x0040a000)\n\
  \n*好吧，我直接翻译原文：*\nmesg = Don't be a fool0 &mesg = 0x0012ff48; value = 0x0000a000\n\
  \ncopy = Don't0 a000000 000002000000  0000000000000 的 value0 \n\
  \n\n\n那么问题所在哪里？问题在于 `gets()` 不会检查输入行是否真的适合放入数组。由于它在这里唯一的参数是 `words`，`gets()` 无法进行检查。记住，数组名会被转换为第一个元素的地址。因此，`gets()`\
  \ 只知道数组从哪里开始，而不知道它有多少个元素。\n\n如果输入字符串太长，你就会遇到 `buffer overflow`（缓冲区溢出），这意味着多出的字符溢出了指定的区域。这些额外的字符可能只是进入了未使用的内存且不会产生立即问题，也可能会覆盖你程序中的其他数据，但这绝对不是唯一的可能性。这里有一个示例运行结果，其中\
  \ `SLEN` 被重置为 5，以便更容易溢出缓冲区：\n\n点击此处查看代码图片\n\n```\nEnter a string, please.\n\nwarning:\
  \ this program uses gets(), which is unsafe.\n\nI think I'll be just fine.\n\nYour\
  \ string twice:\n\nI think I'll be just fine.\n\nI think I'll be just fine.\n\n\
  Done.\n\nSegmentation fault: 11\n```\n\n“Segmentation fault”（段错误）听起来不健康，它也确实如此。在\
  \ Unix 系统上，此信息表示程序尝试访问未分配给它的内存。\n\n但 C 语言提供了许多由于编程不良而导致尴尬且难以追踪的失败的途径。那么，为什么要特别提到\
  \ `gets()` 呢？可能因为它的不安全行为构成了安全风险。在过去，人们利用使用 `gets()` 的系统程序来插入并运行破坏系统安全的代码。\n\n很一段时间以来，C\
  \ 编程社区的许多人一直建议将 `gets()` 从编程词汇中剔除。创建 C99 标准的委员会也发布了该标准的说明（rationale）。该说明承认了 `gets()`\
  \ 的问题并不鼓励使用它。然而，它为将 `gets()` 保留在标准中提供了合理理由，因为它在适当的情况下是一个方便的函数，而且它是许多既有代码的一部分。\n\n\
  然而，C11 委员会采取了更严厉的，并将 `gets()` 从标准中删去。不过，标准规定的是编译器必须支持什么，而不是它不能支持什么。在实践中，为了向后兼容，大多数编译器将将继续提供该函数。但是，正如我们所使用的编译器一样，它们并不对此感到高兴。\n\
  \n## gets() 的替代方案\n\n`gets()` 的传统替代方案是 `fgets()`，它的接口稍微复杂一点，处理输入的方式略有不同。C11 标准将\
  \ `gets_s()` 也引入其中。它更像 `gets()`，并且更容易作为替代品替换到现有代码中。然而，它是 `stdio.h` 输入/输出函数族的一个可选扩展，因此\
  \ C11 C 编译器不需要支持它。\n\n## fgets() 函数（以及 fputs()）\n\n`fgets()` 函数通过接收一个限制读取字符数的第二个参数解决了可能的溢出问题。该函数是为文件输入设计的，这使得使用起来稍微笨拙。以下是\
  \ `fgets()` 与 `gets()` 的区别：\n\n![Image](img/squf.jpg) 它接收第二个参数，指示读取的最大字符数。如果该参数的值为\
  \ `n`，`fgets()` 读取最多 `n-1` 个字符或遇到换行符，以先者为准。\n\n![Image](img/squf.jpg) 如果 `fgets()`\
  \ 读取到换行符，它将其存储在字符串中，与 `gets()` 不同，后者会丢弃它。\n\n![Image](img/squf.jpg) 它接收第三个参数，指示读取哪个文件。要从键盘读取，使用\
  \ `stdin`（标准输入）作为参数；该标识符定义在 `stdio.h` 中。\n\n由于 `fgets()` 函数将换行符作为字符串的一部分（假设输入行适用），它通常与\
  \ `fputs()` 配对使用，`fputs()` 类似于 `puts()`，但它不会自动添加换行符。它接收第二个参数来指示写入哪个文件。对于计算机显示器，我们可以使用\
  \ `stdout`（标准输出）作为参数。列表 11.7 示例了 `fgets()` 和 `fputs()` 的行为。\n\n列表 11.7 fgets1.c\
  \ 程序\n\n点击此处查看代码图片\n\n```\n/*  fgets1.c  -- using fgets() and fputs() */\n\n#include\
  \ <stdio.h>\n\n#define STLEN 14\n\nint main(void)\n{\n    char words[STLEN];\n \
  \   puts(\"Enter a string, please.\");\n    fgets(words, STLEN, stdin);\n    printf(\"\
  Your string twice (puts(), then fputs()):\\n\");\n    puts(words);\n    fputs(words,\
  \ stdout);\n    puts(\"Enter another string, please.\");\n    fgets(words, STLEN,\
  \ stdin);\n    printf(\"Your string twice (puts(), then fputs()):\\n\");\n    puts(words);\n\
  \    fputs(words, stdout);\n    puts(\"Done.\");\n    return 0;\n}\n```\n\n等等，源码在代码块中有些格式很乱。让我重新正确格式化那个特定的代码块：\n\
  \n```c\n/*  fgets1.c  -- using fgets() and fputs() */\n\n#include <stdio.h>\n\n\
  #define STLEN 14\n\nint main(void)\n{\n    char words[STLEN];\n    puts(\"Enter\
  \ a string, please.\");\n    fgets(words, STLEN, stdin);\n    printf(\"Your string\
  \ twice (puts(), then fputs()):\\n\");\n    puts(words);\n    fputs(words, stdout);\n\
  \    puts(\"Enter another string, please.\");\n    fgets(words, STLEN, stdin);\n\
  \    printf(\"Your string twice (puts(), then fputs()):\\n\");\n    puts(words);\n\
  \    fputs(words, stdout);\n    puts(\"Done.\");\n    return 0;\n}\n```\n\n\n\n\
  系统使用缓冲 I/O。这意味着输入会被存储在临时内存（缓冲区）中，直到按下回车键为止；回车键会向输入添加一个换行符，并将整行发送给 `fgets()`。在输出时，`fputs()`\
  \ 将字符发送到另一个缓冲区，当发送换行符时，缓冲区的内容会被发送到显示器。\n\n`fgets()` 存储换行符这一点既是一个问题也是一个机会。问题在于，你可能不希望换行符作为存储字符串的一部分。而机会在于，可以通过存储字符串中是否存在换行符，来判断是否完整读取了整行。如果没有读取完整，你就可以决定对行的剩余部分如何处理。\n\
  \n### 首先，如何丢弃换行符？\n\n一种方法是在存储的字符串中搜索换行符，并将其替换为空字符：\n\n点击此处查看代码图片\n\n```c\nwhile\
  \ (words[i] != '\\n') // 假设 words 中有 \\n\n    i++;\nwords[i] = '\\0';\n```\n\n###\
  \ 其次，如果输入行仍有剩余怎么办？\n\n如果整行无法放入目标数组中，一个合理的选择是丢弃无法容纳的部分：\n\n点击此处查看代码图片\n\n```c\nwhile\
  \ (getchar() != '\\n')  // 读取但不存储\n    continue;             // 输入包括 \\n\n```\n\n\
  列表 11.9 在这些基础概念的基础上增加了一些测试，以生成能够读取输入行、移除已存储的换行符（如果有的话）并丢弃无法容纳行部分的代码。\n\n#### 列表\
  \ 11.9 的 fgets3.c 程序\n\n点击此处查看代码图片\n\n```c\n/*  fgets3.c  -- 使用 fgets() */\n#include\
  \ <stdio.h>\n\n#define STLEN 10\n\nint main(void)\n{\n    char words[STLEN];\n \
  \   int i;\n    puts(\"Enter strings (empty line to quit):\");\n    while (fgets(words,\
  \ STLEN, stdin) != NULL\n                           && words[0] != '\\n')\n    {\n\
  \        i = 0;\n        while (words[i] != '\\n' && words[i] != '\\0')\n      \
  \      i++;\n        if (words[i] == '\\n')\n            words[i] = '\\0';\n   \
  \     else // 是 words[i] == '\\0'\n            while (getchar() != '\\n')\n    \
  \            continue;\n        puts(words);\n    }\n    puts(\"done\");\n    return\
  \ 0;\n}\n```\n\n### 循环\n\n点击此处查看代码图片\n\n```c\nwhile (words[i] != '\\n' && words[i]\
  \ != '\\0')\n    i++;\n```\n\n遍历字符串直到遇到换行符或空字符，以先到为准。如果该字符是换行符，接下来的 `if` 语句将其替换为空字符。否则，`else`\
  \ 部分将处理输入的剩余部分。以下是示例运行：\n\n点击此处查看代码图片\n\n```\nEnter strings (empty line to quit):\n\
  This\nThis\nprogram seems\nprogram s\nunwilling to accept long lines.\nunwilling\n\
  But it doesn't get stuck on long\nBut it do\nlines either.\nlines eit\ndone\n```\n\
  \n### 空与空指针（Null and Null）\n\n空字符和空指针都出现在列表 11.9 中。从概念上讲，这两个“空”是不同的。空字符（或 `'\\0'`）是用于标记\
  \ C 字符串结束的字符。它是编码为零的字符。因为这并不是任何字符的编码，所以它不会意外出现在字符串的某部分。\n\n空指针（或 `NULL`）的值不对应任何有效地址。它通常由那些原本返回有效地址的函数用来，指示某些特殊情况，例如遇到文件结束（EOF）或未能按预期执行。因此，空字符是整数类型，而空指针是指针类型。有时引起混淆的是两者在数值上都可以表示为\
  \ `0`。但从概念上讲，它们是不同的类型。此外，虽然空字符作为字符占用一个字节，但空指针作为地址，通常占用四个字节。\n\n### gets_s() 函数\n\
  \nC11 可选的 `gets_s()` 函数与 `fgets()` 类似，使用一个参数来限制读取的字符数。给定列表 11.9 中使用的相同定义，以下代码将一行输入读取到\
  \ `words` 数组中，并在开头保留换行符：\n\n```c\ngets_s(words, STLEN);\n```\n\n与 `fgets()` 的三个主要区别是：\n\
  - `gets_s()` 仅从标准输入读取，因此不需要参数。\n- 如果 `gets_s()` 读取了换行符，它会丢弃它而不是存储。\n- 如果 `gets_s()`\
  \ 读取了最大字符数且未能读取换行符，它会执行几个步骤：将目标数组的第一个字符设置为空字符；读取并丢弃后续输入直到遇到换行符或文件结束；返回空指针；调用一个取决于实现的的“处理器”（或者你选择的处理器），这可能导致程序退出或中止。\n\
  \n第二个特征意味着，只要输入行不是太长，`gets_s()` 的行为就像 `gets()` 一样，这使得用 `gets_s()` 替换 `gets()` 比用\
  \ `fgets()` 更容易。第三个特征意味着使用该函数有一个学习曲线。\n\n让我们比较一下 `gets()`、`fgets()` 和 `gets_s()`\
  \ 的适用性。如果输入行可以放入目标存储器，三者都能正常工作。但 `fgets()` 确实包含了换行符作为字符串的一部分，你可能需要提供代码将其替换为空字符。\n\
  \n如果输入行无法容纳呢？那么 `gets()` 是安全的；它会破坏你的数据并危及安全。`gets_s()` 函数是安全的，但如果你不想程序中止，你需要学习如何编写并注册“处理器”。此外，如果你设让程序继续运行，`gets_s()`\
  \ 无论你意愿如何都会丢弃输入的剩余部分。`fgets()` 函数在行无法容纳时是最易用的，因为它把更多选择留给了你。如果你想处理输入的剩余部分，可以这样做，如列表\
  \ 11.8` 比 `fgets()` 不方便灵活。这可能就是 `gets_s()` 只是标准库可选扩展的原因之一。鉴于 `gets_s()` 是可选的，使用\
  \ `fgets()` 通常是更好的选择。\n\n### s_gets() 函数\n\n列表 11.9 展示了一种使用 `fgets()` 的方法：读取整行并将换行符替换为空字符，或者读取可以容纳的部分并丢弃剩余——类似于没有额外负担的\
  \ `gets_s()` 函数。没有标准函数符合该描述，但我们可以创建一个。它在随后的示例中会很有用。列表 11.10 展示了一种方法。\n\n#### 列表\
  \ 11.10 的 s_gets() 函数\n\n点击此处查看代码图片\n\n```c\nchar * s_gets(char * st, int n)\n{\n\
  \    char * ret_val;\n    int i = 0;\n    ret_val = fgets(st, n, stdin);\n    if\
  \ (ret_val) // i.e., ret_val != NULL\n    {\n        while (st[i] != '\\n' && st[i]\
  \ != '\\0')\n            i++;\n        if (st[i] == '\\n')\n            st[i] =\
  \ '\\0';\n        else // 是是 words[i] == '\\0'\n            while (getchar() !=\
  \ '\\n')\n                continue;\n    }\n    return ret_val;\n}\n```\n\n\n\n\n\
  如果 `fgets()` 返回 `NULL`，表示到达文件尾或读取错误，此时 `s_gets()` 将跳过剩余的处理。否则，它会模拟 Listing 11.9，如果字符串中存在换行符，则将其替换为空字符（`null\
  \ character`），否则丢弃行的剩余部分。然后它将返回与 `fgets()` 相同的值。我们将在后面的示例中使用该函数。\n\n你可能在想，丢弃过长行的剩余部分的理由是什么呢。问题在于，如果将行的剩余部分留留在原处，它将成为下一次读取语句的输入。例如，如果下一个读取语句正在寻找一个\
  \ `double` 类型的值，这可能会导致程序崩溃。丢弃剩余部分可以保持读取语句与键盘输入之间的同步。\n\n我们的 `s_gets()` 函数并不是完美的。它最严重的缺陷是，当遇到不符合要求的输入时，它是“沉默”的。它在不通知程序或用户的情况下丢弃了额外的输入，从而关闭了其他选项，例如让用户重试或寻找更多的存储空间。另一个缺陷是它无法处理误用情况，例如传递一个为\
  \ 1 或更小的大小。但它作为我们示例中 `gets()` 的替代品已经足够了。\n\n### scanf() 函数\n\n让我们再次回顾 `scanf()`。我们之前用过\
  \ `%s` 格式使用 `scanf()` 来读取字符串。`scanf()` 与 `gets()` 或 `fgets()` 之间的主要区别在于它们如何决定何时到达字符串末尾：`scanf()`\
  \ 更多是一个“获取单词”函数而不是“获取字符串”函数。正如你所看到的，`gets()` 函数会读取到第一个换行符之前的所有字符，`fgets()` 也是如此（如果字符串足够短）。`scanf()`\
  \ 函数有两种终止输入的选择。对于无论哪种选择，字符串都从遇到的第一个非空白字符开始。如果你使用 `%s` 格式，字符串将持续到（但不包括）下一个空白字符（空格、制表符或换行符）。如果你指定了字段宽度，例如\
  \ `%10s`，`scanf()` 将收集最多 10 个字符或到第一个空白字符为止，以先到的为准（参见 Figure 11.3）。\n\n![Image](img/11fig03.jpg)\n\
  \n图 11.3 字段宽度与 `scanf()`。\n\n记住，`scanf()` 函数返回一个整数值，等于成功读取的项数，或者在遇到文件尾时返回 `EOF`。\n\
  \nListing 11.11 展示了当指定字段宽度时，`scanf()` 是如何工作的。\n\nListing 11.11 `scan_str.c` 程序\n\
  \n点击此处查看代码图像\n\n```c\n/* scan_str.c -- using scanf() */\n\n#include <stdio.h>\n\n\
  int main(void)\n{\n    char name1[11], name2[11];\n    int count;\n    printf(\"\
  Please enter 2 names.\\n\");\n    count = scanf(\"%5s %10s\",name1, name2);\n  \
  \  printf(\"I read the %d names %s and %s.\\n\",\n              count, name1, name2);\n\
  \    return 0;\n}\n```\n\n这里有三次运行结果：\n\n点击此处查看代码图像\n\nPlease enter 2 names.\nJesse\
  \ Jukes\nI read the 2 names Jesse and Jukes.\n\nPlease enter 2 names.\nLiza Applebottham\n\
  I read the 2 names Liza and Applebotth.\n\nPlease enter 2 names.\nPortensia Callowit\n\
  I read the 2 names Porte and nsia.\n\n在第一个示例中，两个名字都处于允许的大小限制范围内。在第二个示例中，只读取了 `Applebottham`\
  \ 的前 10 个字符，因为我们使用了 `%10s` 格式。在第三个示例中，`Portensia` 的最后四个字母进入了 `name2`，因为第二次调用 `scanf()`\
  \ 从第一次读取结束的地方继续读取输入；在这种情况下，它仍在 `Portensia` 单词内部。\n\n根据所需输入的性质，你可能使用 `fgets()` 从键盘读取文本会得更好。例如，`scanf()`\
  \ 对于输入书名或歌曲名可能没那么有用，除非该名称是一个单单词。`scanf()` 的典型用途是读取并转换为某些标准格式的混合数据类型。例如，如果每行输入包含工具名称、库存数量和物品成本，你可能会使用\
  \ `scanf()`，或者你可以自己编写一个带有某些输入错误检查的函数。如果你想一次处理一个单词的输入，可以使用 `scanf()`。\n\n`scanf()`\
  \ 函数具有与 `gets()` 相同的潜在缺陷；如果输入单词不适合目标位置，它可能会产生内存溢出。但你可以使用格式字符串中的字段宽度选项。\n\n### 字符串输出\n\
  \n现在让我们从字符串输入转向输出。C 有三个库函数用于打印：`puts()`、`fputs()` 和 `printf()`。\n\n#### puts() 函数\n\
  \n`puts()` 函数非常易用。只需给它一个地址即可。Listing 11.12 展示了 `puts()` 如何工作。\n\nListing 11.12 `put_out.c`\
  \ 程序\n\n点击此处查看代码图像\n\n```c\n/* put_out.c -- using puts() */\n\n#include <stdio.h>\n\
  \nint main(void)\n{\n    char side_a[] = \"Side A\";\n    char dont[] = {'W', 'O',\
  \ 'W', '!' };\n    char side_b[] = \"Side B\";\n    char *str1 = \"An array\";\n\
  \    char *str2 = \"\";\n\n    puts(str1);\n    puts(&str1[5]);\n    puts(str2+4);\n\
  \    return 0;\n}\n```\n\n由于 `dont` 缺少空字符，它不是一个字符串，因此 `puts()` 不知道在哪里停止。它将从 `dont`\
  \ 之后的内存一直打印直到找到空字符。为了确保空字符不会太远，程序将 `dont` 存储在两个字符串之间。这是一个示例运行：\n\n点击此处查看代码图像\n\n\
  WOW!Side A\n\n这里使用的编译器在内存中将 `side_a` 数组存储在 `dont` 数组之后，因此 `puts()` 一直持续直到 `side_a`\
  \ 中的空字符。取决于编译器如何安排数据，可能会得到不同的结果。如果程序省略了 `side_a` 和 `side_b` 数组呢？内存中通常有很多空字符，如果你足够幸运，`puts()`\
  \ 可能会很快找到一个，但不要寄希望于此。`puts()` 如何知道何时停止？它在遇到空字符时停止，所以那里最好有一个。\n\n[Listing 11.13]\
  \ The `noo.c` 程序。\n\n```c\n/* noo.c -- no! */\n\n#include <stdio.h>\n\nint main(void)\n\
  {\n    char side_a[] = \"Side A\";\n    char dont[] = {'W', 'O', 'W', '!' };\n \
  \   char side_b[] = \"Side B\";\n    puts(dont); /* dont 不是一个字符串 */\n    return\
  \ 0;\n}\n```\n\n\n\n\n\n![Image](img/squf.jpg) 与 `puts()` 不同，`fputs()` 不会在输出时自动添加换行符。\n\
  \n注意 `gets()` 在输入时会丢弃换行符，但 `puts()` 在输出时会添加换行符。另一方面，`fgets()` 在输入时会存储换行符，而 `fputs()`\
  \ 在输出时不会添加换行符。假设你想写一个循环，读取一行并在下一行回显它。你可以这样做：\n\n点击此处查看代码图片\n\n```c\nchar line[81];\n\
  \nwhile (gets(line))  // 等同于 while (gets(line) != NULL)\n    puts(line);\n```\n\n\
  记住，`gets()` 在遇到文件结束（EOF）时会返回空指针。空指针的值为 0，即为假，从而终止循环。或者你也可以这样做：\n\n```c\nchar line[81];\n\
  \nwhile (fgets(line, 81, stdin))\n    fputs(line, stdout);\n```\n\n在第一个循环中，`line`\
  \ 数组中的字符串会单独占据一行，因为 `puts()` 添加了换行符。在第二个循环中，`line` 数组中的字符串也会单独占据一行，因为 `fgets()`\
  \ 存储了换行符。注意，如果你将 `fgets()` 输入与 `puts()` 输出混合使用，每个字符串将会显示两个换行符。重点在于 `puts()` 的设计是为了配合\
  \ `gets()` 使用的，而 `fputs()` 的设计是为了配合 `fgets()` 使用的。\n\n当然，我们提到 `gets()` 只是为了让你在代码中遇到它时知道它的工作原理，而不是鼓励你使用它。\n\
  \n### printf() 函数\n\n我们在第 4 章“字符字符串和格式化输入/输出](#ch04.html_ch04)”中已经彻底讨论过 `printf()`。像\
  \ `puts()` 一样，它接受一个字符串地址作为参数。`printf()` 函数的使用不如 `puts()` 方便，但它更通用，因为它可以格式化各种数据类型。\n\
  \n区别之一是，`printf()` 不会自动将每个字符串打印到新行。相反，你必须指定想在哪里换行。因此，\n\n```c\nprintf(\"%s\\n\"\
  , string);\n```\n\n的效果等于\n\n```c\nputs(string);\n```\n\n如你所见，第一种形式需要更多的输入。计算机执行它的时间也更长（尽管你可能察不到）。另一方面，`printf()`\
  \ 让组合多个字符串进行单行打印变得简单。例如，以下语句将 `Well,` 与用户名以及一个 `#defined` 字符字符串组合，全部在同一行内：\n\n```c\n\
  printf(\"Well, %s, %s\\n\", name, MSG);\n```\n\n### 自定义选项\n\n你并不局限于标准 C 库的输入和输出选项。如果你没有这些选项或不喜欢它们，可以基于\
  \ `getchar()` 和 `putchar()` 准备你自己的版本。假设你想要一个像 `puts()` 那样不会自动添加换行符的函数。列表 11.14 展示了创建该函数的一种方法。\n\
  \n列表 11.14 put1() 函数\n\n点击此处查看代码图片\n\n```c\n/* put1.c -- 打印字符串且不添加 \\n */\n\n#include\
  \ <stdio.h>\n\nvoid put1(const char * string) /* string 不会被修改 */\n{\n    while (*string\
  \ != '\\0')\n        putchar(*string++);\n}\n```\n\n`char` 指针 `string` 最初指向调用参数的第一个元素。由于此函数没有修改字符串，使用了\
  \ `const` 修饰符。在打印完该元素的内容后，指针增加并指向下一个元素。这个过程一直持续，直到指针指向包含空字符的元素。记住，`++` 的优先级高于 `*`，这意味着\
  \ `putchar(*string++)` 会打印 `string` 指向的值，但会增加 `string` 本身，而不是它所指向的字符。\n\n你可以将 `put1.c`\
  \ 看作编写字符串处理函数的模型。由于每个字符串都有一个空字符标记结束，你不需要向函数传递长度。相反，函数逐个处理每个字符，直到遇到空字符。\n\n编写该函数的另一种较长的方法是使用数组下标：\n\
  \n```c\nint i = 0;\n\nwhile (string[i]!= '\\0')\n    putchar(string[i++]);\n```\n\
  \n这涉及到一个额外的索引变量。\n\n许多 C 程序员会使用以下 `while` 循环测试：\n\n```c\nwhile (*string)\n```\n\n\
  当 `string` 指向空字符时，`*string` 的值为 `0`，从而终止循环。这种方法确实比之前的版本需要的字符更少。如果你不熟悉 C 语言写法，这一点并不显而易见。然而，这种惯用法非常广泛，预计\
  \ C 程序员应该熟悉它。\n\n#### 注意\n\n为什么列表 11.14 使用 `const char * string` 而不是 `const char\
  \ string[]` 作为形式参数？从技术上讲，两者是等价的，所以任何形式都可以工作。使用括号符号的一个理由是提醒用户函数正在处理一个数组。对于字符串，实际参数可以是数组、引号内的字符串或声明为\
  \ `char` 的变量。假设你想要一个像 `puts()` 那样又能告诉你多少个字符的函数。使用 `const char *` 提醒你实际参数不一定是数组。列表\
  \ 11.15 展示了这种功能。\n\n列表 11.15 put2() 函数\n\n点击此处查看代码图片\n\n```c\n/* put2.c -- 打印字符串并计算字符\
  \ */\n\n#include <stdio.h>\n\nint put2(const char * string)\n{\n    int count =\
  \ 0;\n    while (*string) /* 等同于 *string != '\\0' */\n    {\n        putchar(*string++);\n\
  \        count++;\n    }\n    putchar('\\n'); /* 换行符 */\n    return(count);\n}\n\
  ```\n\n以下调用打印字符串 `pizza`：\n\n```c\nput1(\"pizza\");\n```\n\n下一个调用将字符数赋值给 `num`（在此情况下为\
  \ `5`）：\n\n```c\nnum = put2(\"pizza\");\n```\n\n列表 11.16 展示了使用 `put1()` 和 `put2()`\
  \ 的程序。\n\n列表 11.16 put_put.c 程序\n\n点击此处查看代码图片\n\n```c\n//put_put.c -- 用户定义函数\n#include\
  \ <stdio.h>\n\nvoid put1(const char *);\nint put2(const char *);\n\nint main(void)\n\
  {\n    put1(\"If'd as much money\");\n    put1(\" as I could spend,\\n\");\n   \
  \ printf(\"I count %d.\\n\", put2(\"never would cry to mend.\"));\n    return 0;\n\
  }\n\nvoid put1(const char * string)\n{\n    while (*string)\n        putchar(*string++);\n\
  }\n\nint put2(const char * string)\n{\n    int count = 0;\n    while (*string)\n\
  \    {\n        putchar(*string++);\n        count++;\n    }\n    putchar('\\n');\n\
  \    return(count);\n}\n```\n\n嗯，我们正在使用 `printf()` 来打印 `put2()` 的值，但在寻找 `put2()`\
  \ 值的过程中，必须先执行该函数，导致字符串被打印。以下是输出：\n\n点击此处查看代码图片\n\nIf'd as much money as I could\
  \ spend,\nnever would cry to mend.\nI count 37 characters.\n\n### 字符串函数\n\nC 库提供了若干处理字符串的函数；ANSI\
  \ C 使用 `string.h` 头文件提供这些原型。我们将查看一些最实用且常用的函数：`strlen()`、`strcat()`、`strncat()`、`strcmp()`、`strncmp()`、`strcpy()`\
  \ 和 `strncpy()`。我们还将检查 `stdio.h` 头文件支持的 `sprintf()`。有关 `string.h` 系列函数的完整列表，请参见参考章节\
  \ V，“标准 ANSI C 库及 C99 扩展](#app02.html_app02lev1sec5)”，见附录 B。\n\n#### strlen() 函数\n\
  \n你已经知道，`strlen()` 函数查找字符串的长度。它被用于下一个示例，一个缩短长字符串的函数：\n\n点击此处查看代码图片\n\n```c\nvoid\
  \ fit(char *string, unsigned int size)\n{\n    if (strlen(string) > size)\n```\n\
  \n\n\n\n```c\nstring[size] = '\\0';\n\n}\n```\n\n此函数会修改字符串，因此在函数头中声明形式参数 `string`\
  \ 时没有使用 `const`。\n\n尝试 列表 11.17 中测试程序中的 `fit()` 函数。注意，该代码使用了 C 语言的字符串字面量拼接特性。\n\n\
  列表 11.17 test_fit.c 程序\n\n点击此处查看代码图像\n\n```c\n/* test_fit.c -- 尝试收缩字符串的函数 */\n\n\
  #include <stdio.h>\n\n#include <string.h> /* 字符串函数的原型声明 */\n\nvoid fit(char *, unsigned\
  \ int);\n\nint main(void)\n{\n    char mesg[] = \"Things should be as simple as\
  \ possible,\"\n    \" but not simpler.\";\n    puts(mesg);\n    fit(mesg,38);\n\
  \    puts(mesg);\n    puts(\"Let's look at some more of the string.\");\n    puts(mesg\
  \ + 39);\n    return 0;\n}\n\nvoid fit(char *string, unsigned int size)\n{\n   \
  \ if (strlen(string) > size)\n        string[size] = '\\0';\n}\n```\n\n输出如下：\n\n\
  点击此处查看代码图像\n\nThings should be as simple as possible, but not simpler.\n\nThings\
  \ should be as simple as possible\n\nLet's look at some more of the string.\n\n\
  but not simpler.\n\n`fit()` 函数在数组的第 39 个元素处放置了一个 `'\\0'` 字符，替换了一个逗号。`puts()` 函数在遇到第一个空字符时停止并忽略数组的剩余部分。然而，数组的其余部分仍然存在，如下调用所示：\n\
  \n```c\nputs(mesg + 8);\n```\n\n表达式 `mesg + 39` 是 `mesq[39]` 的地址，它是一个空格字符。因此 `puts()`\
  \ 显示该字符并继续运行，直到遇到原始的空字符。图 11.4 用（一个较短的字符串）说明了该程序中发生的情况。\n\n![Image](img/11fig04.jpg)\n\
  \n图 11.4 `puts()` 函数与空字符。\n\n（`mesg` 数组中引用的变体归于阿尔伯特·爱因斯坦，但它看起来更可能是对他哲学的表达，而非直接引用。）\n\
  \n`string.h` 文件包含了 C 语言字符串函数的原型，这就是为什么这个示例包含了它。\n\n### 注意事项\n\n某些预 ANSI 系统使用 `strings.h`\
  \ 代替，另一些系统可能完全缺少字符串头文件。\n\n### `strcat()` 函数\n\n`strcat()`（字符串连接）函数接受两个字符串作为参数。第二个字符串的副本被附加在第一个字符串的末尾，这个合并后的版本成为新的第一个字符串。第二个字符串不会被修改。`strcat()`\
  \ 函数的类型为 `char *`（即指向 `char` 的指针）。它返回第一个参数的值——即附加第二个字符串的字符串中第一个字符的地址。\n\n列表 11.18\
  \ 展示了 `strcat()` 的功能。它还使用了我们在 列表 11.10 中定义的 `s_gets()` 函数；回想它使用 `fgets()` 读取一行，然后删除可能存在的换行符。\n\
  \n列表 11.18 str_cat.c 程序\n\n点击此处查看代码图像\n\n```c\n/* str_cat.c -- 合并两个字符串 */\n\n#include\
  \ <stdio.h>\n\n#include <string.h>  /* 声明 strcat() 函数 */\n#define SIZE 80\nchar\
  \ * s_gets(char * st, int n);\n\nint main(void)\n{\n    char flower[SIZE];\n   \
  \ char addon[] = \"s smell like old shoes.\";\n    puts(\"What is your favorite\
  \ flower?\");\n    if (s_gets(flower, SIZE))\n    {\n        strcat(flower, addon);\n\
  \        puts(flower);\n        puts(addon);\n    }\n    else\n        puts(\"End\
  \ of file!\");\n    puts(\"bye\");\n    return 0;\n}\n\nchar * s_gets(char * st,\
  \ int n)\n{\n    char * ret_val;\n    int i = 0;\n    ret_val = fgets(st, n, stdin);\n\
  \    if (ret_val)\n    {\n        while (st[i] != '\\n' && st[i] != '\\0')\n   \
  \         i++;\n        if (st[i] == '\\n')\n            st[i] = '\\0';\n      \
  \  else // have words[i] == '\\0'\n            while (getchar() != '\\n')\n    \
  \        continue;\n    }\n    return ret_val;\n}\n```\n\n这是一个示例输出：\n\n点击此处查看代码图像\n\
  \nWhat is your favorite flower?\nwonderflowers smell like old shoes.\ns smell like\
  \ old shoes.\nbye\n\n输出说明 `flower` 被修改了，而 `addon` 没有。\n\n### `strncat()` 函数\n\n\
  `strcat()` 函数不会检查第二个字符串是否能装入第一个数组中。如果你没有为第一个数组分配足够的空间，你将遇到问题，多余的字符会进入相邻的位置。当然，你可以使用\
  \ `strlen()` 在行动前先进行检查，如 列表 1.15 所示。注意它在长度上加 `1` 以为空字符留出空间。或者，你可以使用 `strncat()`，它接受一个第二个参数，指示要添加的最大字符数。例如，`strncat(bugs,\
  \ addon, 13)` 将 `addon` 字符串的内容添加到 `bugs`，当达到 13 个额外字符或遇到空字符时停止（以先者为准）。因此，考虑到空字符（在两种情况下都会追加），`bugs`\
  \ 数组应该足够容纳原始字符串（不计空字符）、最多 13 个额外字符以及末尾的空字符。列表 11.19 使用此信息计算 `available` 变量的值，它是作为最大额外字符数。列表\
  \ 11.19 join_chk.c 程序\n\n点击此处查看代码图像\n\n```c\n/* join_chk.c -- 合并两个字符串，先检查大小 */\n\
  #include <stdio.h>\n#include <string.h>\n#define SIZE 30\n#define BUGSIZE 13\nchar\
  \ * s_gets(char * st, int n);\n\nint main(void)\n{\n    char flower[SIZE];\n   \
  \ char addon[] = \"s smell like old shoes.\";\n    char bug[BUGSIZE];\n    int available;\n\
  \    puts(\"What is your favorite flower?\");\n    s_gets(flower, SIZE);\n    if\
  \ ((strlen(addon) + strlen(flower) + 1) <= SIZE)\n        strcat(flower, addon);\n\
  \    puts(flower);\n    puts(\"What is your favorite bug?\");\n    s_gets(bug, BUGSIZE);\n\
  \    available = BUGSIZE - strlen(bug) - 1;\n    strncat(bug, addon, available);\n\
  \    puts(bug);\n    return 0;\n}\n\nchar * s_gets(char * st, int n)\n{\n    char\
  \ * ret_val;\n    int i = 0;\n    ret_val = fgets(st, n, stdin);\n    if (ret_val)\n\
  \    {\n        while (st[i] != '\\n' && st[i] != '\\0')\n            i++;\n   \
  \     if (st[i] == '\\n')\n            st[i] = '\\0';\n        else // have words[i]\
  \ == '\\0'\n            while (getchar() != '\\n')\n            continue;\n    }\n\
  \    return ret_val;\n}\n```\n\n这里是运行示例：\n\nWhat is your favorite flower?\nRose\n\
  Roses smell like old shoes.\nWhat is your favorite bug?\nAphid\nAphids\n\n你可能注意到\
  \ `strcat()` 和 `gets()` 一样会导致缓冲区溢出。那么为什么 C11 标准不丢弃 `strcat()` 而只提供 `strncat()` 呢？原因可能是\
  \ `gets()` 将程序暴露在来自用户的危险之中，而 `strcat()` 将程序暴露在粗心程序员的危险之中。你无法控制未来用户会做什么，但你可以控制进入程序的内容。C\
  \ 信任程序员的哲学也带来了识别何时可以安全使用 `strcat()` 的责任。\n\n### `strcmp()` 函数\n\n假设你想将某人的响应与存储的字符串进行比较，如\
  \ 列表 11.20 所示。\n\n列表 11.20 nogo.c 程序\n\n点击此处查看代码图像\n\n```c\n/* nogo.c -- 这有效吗？ */\n\
  #include <stdio.h>\n#define ANSWER \"Grant\"\n#define SIZE 40\nchar * s_gets(char\
  \ * st, int n);\n\nint main(void)\n{\n    char try[SIZE];\n    puts(\"Who is buried\
  \ in Grant's own?\");\n    s_gets(try, SIZE);\n    while (try != ANSWER)\n    {\n\
  \        puts(\"No, that's wrong. Try again.\");\n    }\n}\n```\n\n\n\n\n\n```c\n\
  \    s_gets(try, SIZE);\n\n    }\n\n    puts(\"That's right!\");\n\n    return 0;\n\
  }\n\nchar * s_gets(char * st, int n)\n{\n    char * ret_val;\n    int i = 0;\n \
  \   ret_val = fgets(st, n, stdin);\n    if (ret_val)\n    {\n        while (st[i]\
  \ != '\\n' && st[i] != '\\0')\n            i++;\n        if (st[i] == '\\n')\n \
  \           st[i] = '\\0';\n        else // must have words[i] == '\\0'\n      \
  \      while (getchar() != '\\n')\n                continue;\n    }\n    return\
  \ ret_val;\n}\n```\n\n***\n\n尽管这个程序看起来很不错，但它无法正常工作。`ANSWER` 和 `try` 实际上都是指针，因此比较\
  \ `try != ANSWER` 并不是在检查两个字符串是否相同，而是检查两个字符串是否具有相同的地址。因为 `ANSWER` 和 `try` 存储在不同的位置，这两个地址永远不会相同，用户会被永远告知他或她是错误的。这样的程序往往会让人们产生畏情绪。\n\
  \n你需要的是一个比较字符串*内容*而不是字符串*地址*的函数。你可以自己设计一个，但 `strcmp()`（用于*字符串比较*）已经为你完成了这项工作。这个函数对字符串的作用就像关系运算符对数字的作用的一样。具体来说，如果它的两个字符串参数相同，它返回\
  \ `0`，否则返回非零。修改后的程序在列表 11.21 所示。\n\n### 列表 11.21 compare.c 程序\n\n点击此处查看代码图像\n\n\
  ***\n\n```c\n/* compare.c -- this will work */\n\n#include <stdio.h>\n#include <string.h>\
  \   // declares strcmp()\n#define ANSWER \"Grant\"\n#define SIZE 40\n\nchar * s_gets(char\
  \ * st, int n);\n\nint main(void)\n{\n    char try[SIZE];\n    puts(\"Who is buried\
  \ in Grant's tomb?\");\n    s_gets(try, SIZE);\n    while (strcmp(try,ANSWER) !=\
  \ 0)\n    {\n        puts(\"No, that's wrong. Try again.\");\n        s_gets(try,\
  \ SIZE);\n    }\n    puts(\"That's right!\");\n    return 0;\n}\n\nchar * s_gets(char\
  \ * st, int n)\n{\n    char * ret_val;\n    int i = 0;\n    ret_val = fgets(st,\
  \ n, stdin);\n    if (ret_val)\n    {\n        while (st[i] != '\\n' && st[i] !=\
  \ '\\0')\n            i++;\n        if (st[i] == '\\n')\n            st[i] = '\\\
  0';\n        else // must have words[i] == '\\0'\n            while (getchar() !=\
  \ '\\n')\n                continue;\n    }\n    return ret_val;\n}\n```\n\n***\n\
