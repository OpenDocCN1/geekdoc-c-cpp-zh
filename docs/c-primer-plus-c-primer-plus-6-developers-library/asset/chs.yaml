  \ ...);  // 有效\nchar f3(char c1, ..., char c2);      // 无效，省略号不在最后\ndouble f3(...);\
  \                      // 无效，没有参数\n\n最右边的参数（紧邻省略号之前的参数）起着特殊作用；标准使用 `parmN` 作为名称。在前面的示例中，第一种情况下\
  \ `parmN` 是 `n`，在第二种情况下是 `k`。传递给此参数的实际参数将省略号所代表的参数个数。例如，原型为 `f1()` 的可以这样使用：\n\n\
