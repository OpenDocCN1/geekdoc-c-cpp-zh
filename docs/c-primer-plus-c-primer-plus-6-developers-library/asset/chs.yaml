  \n表 RS.V.14 `struct lconv` 必需成员\n\n### 数学库：math.h\n\n在 C99 中，`math.h` 头文件定义了两类型：\n\
  \n```\nfloat_t\ndouble_t\n```\n\n这些类型的宽度至少不小于 `float` 和 `double`，且 `double_t` 的宽度至少不小于\
  \ `float_t`。这些类型旨在成为执行 `float` 和 `double` 计算时效率最高的类型。\n\n此头文件还定义了几个宏，如表 RS.V.15\
  \ 所示；除 `HUGE_VAL` 外，所有的都是 C99 新增的内容。其中一些在第 VIII 节 “C99 数值计算增强”中进行了更详细的讨论。\n\n![Image](img/rs-vtab15.jpg)![Image](img/rs-vtab15a.jpg)\n\
  \n表 RS.V.15 `math.h` 宏\n\n数学函数通常与 `double` 类型的值工作。C99 为这些函数增加了 `float` 和 `long double`\
  \ 版本，通过在函数名后分别添加 `f` 后缀和 `l` 后缀来指示。例如，语言现在提供了这些原型声明：\n\n点击此处查看代码图像\n\n```\ndouble\
  \ sin(double);\nfloat sinf(float);\nlong double sinl(long double);\n```\n\n为了简洁起见，表\
  \ RS.V.16 仅列出了数学库函数的 `double` 版本。该表引用了 `FLT_RADIX`。该常量定义在 `float.h` 中，是内部浮点表示中指数运算的基数。最常见的值是\
  \ `2`。\n\n![![Image](img/rs-vtab16.jpg)![Image](img/rs-vtab16a.jpg)![Image](img/rs-vtab16b.jpg)![Image](img/rs-vtab16c.jpg)![Image](img/rs-vtab16d.jpg)\n\
  \n表 RS.V.16 ANSI C 标准数学函数\n\n### 非局部跳转：setjmp.h\n\n`setjmp.h` 头文件允许你跳过通常的函数调用-函数返回序列。`setjmp()`\
  \ 函数将当前执行环境的信息（例如指向当前指令的指针）存储在类型为 `jmp_buf` 的变量（在该头文件中定义的数组类型）中，而 `longjmp()` 函数将执行转移到此类环境。这些函数旨在处理错误情况，而不是作为程序流程控制的一部分。表\
  \ RS.V.17 列出了这些函数。\n\n![Image](img/rs-vtab17.jpg)\n\n表 RS.V.17 `setjmp.h` 函数\n\n\
  ### 信号处理：signal.h\n\n信号（`signal`）程序执行期间可以报告的条件。它由正整数表示。`raise()` 函数发送或抛出一个信号，而 `signal()`\
  \ 函数设置对特定信号的响应。\n\n标准定义了一个整数类型 `sig_atomic_t`，用于指定对于信号处理程序是原子的对象。也就是说，更新原子类型是一个不可分割的过程。\n\
  \n标准提供了在表 RS.V.18 中列出的宏来表示可能的信号；实现可以添加更多值。它们可以作为 `raise()` 和 `signal()` 的参数。\n\n\
  ![Image](img/rs-vtab18.jpg)\n\n表 RS.V.18 信号宏\n\n`signal()` 函数的第二个参数是一个指向接受 `int`\
  \ 参数的 `void` 函数的指针。它还返回一个相同类型的指针。响应信号而调用的函数称为信号处理程序（`signal handler`）。标准定义了三个符合此原型声明的宏：\n\
  \n```\nvoid (*funct)(int);\n```\n\n表 RS.V.19 列出了这些宏。\n\n![Image](img/rs-vtab19.jpg)\n\
  \n表 RS.V.19 类型 `void (*funct)(int)`\n\n如果抛出了信号 `sig` 且 `func` 指向一个函数（参见表 RS.V.20），通常情况下首先调用\
  \ `signal(sig, SIG_DFL)` 将信号处理重置为默认，然后调用 `(*func)(sig)`。信号处理函数可以通过执行返回语句或调用 `abort()`、`exit()`\
  \ 或 `longjmp()` 来终止。表 RS.V.20 列出了信号函数。\n\n![Image](img/rs-vtab20.jpg)\n\n表 RS.V.20\
  \ 信号函数\n\n### 对齐：stdalign.h (C11)\n\n`stdalign.h` 头文件定义了四个用于确定和指定数据对象对齐属性的宏。表 RS.V.21\
  \ 列出了这些宏。前两个创建了与 C++ 用。\n\n![Image](img/rs-vtab21.jpg)\n\n表 RS.V.21 `stdalign.h`\
  \ 宏\n\n### 可变参数：stdarg.h\n\n`stdarg.h` 头文件提供了一种定义具有数量参数函数的方法。此类函数的原型应具有至少一个参数后跟省略号的参数列表：\n\
  \n点击此处查看代码图像\n\n```\nvoid f1(int n, ...); // 有效\nint f2(int n, float x, int k, ...);\
  \ // 有效\ndouble f3(...); // 无效\n```\n\n在下表中，术语 parmN 是用于省略号之前的最后一个参数的标识符。在前面的示例中，第一种情况\
  \ parmN 为 `n`，第二种情况为 `k`。\n\n该头文件声明了一个 `va_list` 类型，用于表示存储参数列表中省略号部分对应参数的对象。表 RS.V.22\
  \ 列出了三个在具有可变参数列表函数使用的宏。在使用这些宏之前，应声明一个类型为 `va_list` 的对象。\n\n表 RS.V.22 可变参数列表宏\n\n\
  \n\n\n该头文件与 `threads.h` 一起为并发编程提供了支持。这个主题远远超出了本书的范围，但通俗来说，`stdatomic.h` 头文件提供了用于创建原子操作的宏。编程社区使用\
  \ `atomic`（原子）一术语正如德谟克利在其原子理论中使用的那样，意思是“不可分割的”。一个操作（例如将一个结构体赋值给另一个结构体）在编程层面可能是原子的，但在机器语言层面可能由多个步骤组成。如果一个程序被分成多个线程，一个线程可能会读取或修改另一个线程正在使用的数据。例如，你可能会得到一个“奇幻”结构体，其某些成员由一个线程赋值，而另一些成员由另一个线程赋值。`stdatomic.h`\
  \ 头文件允许你创建表现得原子性相同的操作，使得一个线程无法中断另一个线程的工作。\n\n## 布尔支持：stdbool.h (C99)\n\n此头文件定义了表\
  \ RS.V.23 所示的四个宏。\n\n![Image](img/rs-vtab23.jpg)\n\n表 RS.V.23 `stdbool.h` 宏\n\n\
  ## 通用定义：stddef.h\n\n此头文件定义了一些类型和宏，如表 RS.V.24 和 RS.V.25 所示。\n\n![Image](img/rs-vtab24.jpg)\n\
  \n表 RS.V.24 `stddef.h` 类型\n\n![Image](img/rs-vtab25.jpg)\n\n表 RS.V.25 `stddef.h`\
