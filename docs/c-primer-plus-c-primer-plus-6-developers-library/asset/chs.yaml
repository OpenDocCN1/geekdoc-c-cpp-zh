  \n\n`int` 类型是有符号整型。这意味着它必须是一个整数，并且可以是正数、负数或零。可能值的范围取决于计算机系统。通常，一个 `int` 使用一个机器字（machine\
  \ word）进行存储。因此，具有 16 位字的旧版 IBM PC 兼容机使用 16 位来存储一个 `int`。这允许从 `–32768` 到 `32767`\
  \ 的数值范围。目前的个人电脑通常具有 32 位整数，并将 `int` 适配为该大小。现在个人电脑行业正向 64 位处理器发展，这自然会使用更大的更大的整数。ISO\
  \ C 规定类型 `int` 的最小范围应为从 `–32767` 到 `32767`。通常，系统通过使用特定位的值来指示符号的有符号整数。第 15 章 讨论了常用方法。\n\
