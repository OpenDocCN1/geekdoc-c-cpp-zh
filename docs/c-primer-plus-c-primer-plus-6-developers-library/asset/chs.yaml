  \ `transform()` 函数连续调用的参数。\n\n## 15. 位操作 (Bit Fiddling)\n\n你将在本章学习到以下内容：\n\n![Image](img/squf.jpg)\
  \ 运算符：\n\n`~ & |^`\n`>> <<`\n`&= |= ^= >>= <<=`\n\n![Image](img/squf.jpg) 二进制、八进制和十六进制数表示法（回顾）\n\
  \n![Image](img/squf.jpg) 处理值中单个位的两种 C 语言机制：位运算符和位域\n\n![Image](img/squf.jpg) 关键字：\n\
  \n`_Alignas, _Alignof`\n\n使用 C 语言，你可以操作变量中的单个位。你可能在想为什么会有人想这样做。请放心，这种能力有时是必要的，或者至少是有用的。例如，硬件设备通常通过发送一个或两个字节来控制，其中每个位都有特定的含义。此外，关于文件的操作系统信息通常也使用特定的位来指示特定的项目。许多压缩和加密操作都会处理单个位。高级语言通常不处理这种细节；C\
  \ 语言在提供高级语言设施的同时，能够在通常留给汇编语言的级别工作，使其成为编写设备驱动程序和嵌入代码的首选语言。\n\n在我们提供一些关于位、字节和其他背景知识后，将在本章研究\
  \ C 语言的位操作。\n\n### 二进制数、位和字节\n\n通常表示数字的方法是基于 10 的。例如，2157 在千位上有 2，在百位上有 1，在十位上有\
  \ 5，在个位上有 7。这意味着你可以将 2157 理解为：\n\n点击此处查看代码图像\n\n2 x 1000 + 1 x 100 + 5 x 10 + 7\
  \ x 1\n\n然而，1000 是 10 的立方，100 是 10 的平方，10 是 10 的一次幂，根据惯例，1 是任何正数的 0 次幂。因此，你也可以将\
  \ 2157 写为：\n\n点击此处查看代码图像\n\n2 x 10³ + 1 x 10² + 5 x 10¹ + 7 x 10⁰\n\n由于我们的数字系统是基于\
  \ 10 的幂，所以我们说 2157 是用*十进制*写的。\n\n推测十进制系统的进化是因为我们有 10 根手指。计算机位在某种意义上只有两个手指，因为它只能设置为\
  \ 0 或 1，关闭或开启。因此，*基 2* 系统对于计算机是自然的。它使用 2 的幂而不是 10 的幂。用基 2 表示的数字被称为*二进制数*。数字 2 在二进制中扮演的角色与数字\
  \ 10 在十进制中扮演的角色相同。例如，像 1101 这样的二进制数意味着：\n\n1 x 2³ + 1 x 2² + 0 x 2¹ + 1 x 2⁰\n\n\
  在十进制数中，它变成：\n\n1 x 8 + 1 x 4 + 0 x 2 + 1 x 1 = 13\n\n你可以使用二进制系统将任何整数（只要有足够的位）表示为\
  \ 1 和 0 的组合。这种系统对于数字计算机非常方便，计算机通过开启和关闭状态的组合来表示信息，这些状态可以被解释为 1 和 0。让我们看看二进制系统如何作用于\
  \ 1 字节整数的。\n\n#### 二进制整数\n\n\n\n\n通常，一个字节包含 8 个位。请记住，C 语言使用 `byte` 一术来表示存储系统字符集的大小，因此一个\
  \ C 语言字节可以是 8 位、9 位、16 位或其他值。然而，8 位字节是用于描述内存芯片的字节，也是描述数据传输速率的字节。为了简单起见，本章假设字节为 8\
  \ 位。（为了清晰起见，计算机世界经常使用 `octet` 一词来表示 8 位字节。）你可以认为这 8 个位从左到右编号为 7 到 0。第 7 位被称为 `high-order\
  \ bit`（高位），第 0 位是字节中的 `low-order bit`（低位）。每个位编号都对应 2 的一个特定幂。想象该字节看起来所示图 15.1。\n\n\
  ![Image](img/15fig01.jpg)\n\n图 15.1 位数和位值。\n\n在这里，128 是 2 的 7 次方，依此类推。该字节能容纳的最大数字是\
  \ 1，所有位都设为 1：`11111111`。这个二进制数的值如下：\n\n点击此处查看代码图像\n\n128 + 64 + 32 + 16 + 8 + 4\
  \ + 2 + 1 = 255\n\n最小的二进制数是 `00000000`，或者简单的 0。一个字节可以存储从 0 到 255 的数字，共 256 个可能的值。或者，通过不同的解释位模式，程序可以使用字节存储从\
  \ –128 到 +127 的数字，同样是 256 个值。例如，`unsigned char` 通常使用一个字节表示 0 到 255 的范围，而 `signed\
  \ char` 通常使用一个字节表示 –128 到 +127 的范围。\n\n#### 有符号整数\n\n有符号数的表示由硬件决定，而不是由 C 语言。表示符号数最简单的方法可能是保留\
  \ 1 位（例如高位）来表示符号。在 1 字节值中，这为数字本身留下了 7 位。在这样的 `sign-magnitude`（符号位）表示中，`10000001`\
  \ 是 –1，`00000001` 是 1。那么，总范围是 –127 到 +127。\n\n这种方法的一个缺点是有两个零：+0 和 –0。这很令人困惑，而且它仅为一个值就占用了两个位模式。\n\
  \n`two’s-complement`（补码）方法避免了这个问题，是目前最常用的系统。我们将讨论该方法应用于 1 字节值的情况。在这种语境下，0 到 127\
  \ 的值由最后 7 位表示，高位设为 0。到为止，这与符号位表示法相同。此外，如果高位为 1，则该值为负数。区别在于确定该负数的值。从 9 位模式 `100000000`（二进制表示的\
  \ 256）中减去负数的位模式，结果就是该数值的绝对值。例如，假设模式为 `10000000`。作为一个无符号字节，它是 128。作为一个有符号值，它是负的（第\
  \ 7 位为 1），其值为 `100000000−10000000`，即 `10000000` (128)。因此，数字是 –128。（在符号位表示法中它将是 –0。）同样，`10000001`\
  \ 是 –127，`11111111` 是 –1。该方法表示 –128 到 +127 范围内的数字。\n\n反转补码二进制数符号的最简单方法反转每个位（将 0\
  \ 变为 1，将 1 变为 0）然后加 1。因为 1 是 `00000001`，所以 –1 是 `11111110 + 1` 或 `11111111`，正如你之前看到那样。\n\
  \n`one’s-complement`（反码）方法通过反转模式中的每个位来形成数的负数。例如，`00000001` 是 1，`11111110` 是 –1。这种方法也有一个\
  \ –0：`11111111`。它的范围（对于 1 字节值）是 –127 到 +127。\n\n#### 二进制浮点数\n\n浮点数存储在两个部分：二进制分数和二进制指数。让我们来看看是如何实现的。\n\
  \n##### 二进制分数\n\n普通分数 0.527 表示：\n\n5/10 + 2/100 + 7/1000\n\n分母表示 10 递增的幂次。在二进制分数中，你使用\
  \ 2 的幂作为分母，因此二进制分数 `.101` 表示：\n\n5/10 + 2/100 + 7/1000\n\n（注：原文在此处存在大量重复内容，翻译时已根据逻辑进行了清理并保留核心含义。）\n\
  \n\n\nC 提供了位运算逻辑运算符和移位运算符。在接下来的示例中，我们将以二进制形式写出值，以便你可以看到位发生了什么变化。在实际程序中，你将使用通常形式编写的整数变量或常量。例如，你不会使用\
  \ `00011001`，而是使用 `25`、`031` 或 `0x19`。在我们的示例中，我们将使用 8 位数，位从左到右编号为 7 到 0。\n\n## 位运算逻辑运算符\n\
  \n四个位运算逻辑运算符作用于整数类型数据，包括 `char`。它们被称为*位运算*（bitwise），是因为它们是独立于左侧或右侧的位，对每个位进行操作的。不要将它们与普通的逻辑运算符（`&&`、`||`\
  \ 和 `!`）混淆，后者是对整个值进行操作的。\n\n### 异码反，或位取反：~\n\n一元运算符 `~` 将每个 1 改变为 0，将每个 0 改变为 1，例如所示：\n\
  \n```\n~(10011010)  // 表达式\n(01100101)   // 结果值\n```\n\n假设 `val` 是一个赋值为 `2` 的 `unsigned\
  \ char`。在二进制中，`2` 是 `00000010`。那么 `~val` 的值为 `11111101`，即 `253`。注意运算符并没有改变 `val`\
  \ 的值，就像 `3 * val` 不改变 `val` 的值一样；`val` 仍然是 `2`，但它创建了一个可以在其他地方使用或赋值的新值：\n\n```\n\
  newval = ~val;\nprintf(\"%d\", ~val);\n```\n\n如果你想将 `val` 的值改为 `~val`，请使用这个简单的赋值：\n\
  \n```\nval = ~val;\n```\n\n### 位与：&\n\n二元运算符 `&` 通过在两个操作数之间进行逐位比较来产生一个新值。对于每个位位置，只有当操作数中的对应位均为\
  \ 1 时，结果位才为 1。（从真/假的角度来看，只有当两个位操作数都为真时，结果才为真。）因此，表达式\n\n```\n(10010011) & (00111101)\
  \  // 表达式\n```\n\n求值为以下结果：\n\n```\n(00010001)               // 结果值\n```\n\n原因是只有两个操作数中的第\
  \ 4 和第 0 位都是 `1`。C 还有一个复合的位与赋值运算符：`&=`。语句\n\n```\nval &= 0377;\n```\n\n产生的与以下代码相同的最终结果：\n\
  \n```\nval = val & 0377;\n```\n\n### 位或：|\n\n二元运算符 `|` 通过在两个操作数之间进行逐位比较来产生一个新值。对于每个位位置，如果操作数中的对应位有一个为\
  \ 1，则结果位为 1。（从真/假的角度来看，如果其中一个位操作数为真，或者两者都为真，结果就为真。）因此，表达式\n\n```\n(10010011) | (00111101)\
  \  // 表达式\n```\n\n求值为以下结果：\n\n```\n(00111111)               // 结果值\n```\n\n原因是除了第\
  \ 6 位外，所有位位置在其中一个操作数（或两者）中都有值 `1`。C 还有一个复合的位或赋值运算符：`|=`。语句\n\n```\nval |= 0377;\n\
  ```\n\n产生的与以下代码相同的最终结果：\n\n```\nval = val | 0377;\n```\n\n### 位异或：^\n\n二元运算符 `^`\
  \ 在两个操作数之间进行逐位比较。对于每个位位置，如果操作数中的对应位中有一个（但不是两个都）为 1，则结果位为 1。（从真/假的角度来看，如果其中一个位操作数为真——但不是两个都真——结果就为真。）因此，表达式\n\
  \n```\n(10010011) ^ (00111101)  // 表达式\n```\n\n求值为：\n\n```\n(10101110)         \
  \      // 结果值\n```\n\n注意，因为第 0 位在两个操作数中的值均为 `1`，所以生成的 0 位值为 `0`。C 还有一个复合的位异或赋值运算符：`^=`。语句\n\
  \n```\nval ^= 0377;\n```\n\n产生的与以下代码相同的最终结果：\n\n```\nval = val ^ 0377;\n```\n\n\
  ## 使用：掩码（Masks）\n\n位 `AND` 运算符经常与掩码（mask）一起使用。*掩码*是一种位模式，其中某些位设置为开启（1），另一些位设置为关闭（0）。为了理解为什么掩码被称为掩码，让我们看看当一个数量通过\
  \ `&` 运算符与掩码结合时会发生什么。例如，假设你定义符号常数 `MASK` 为 `2`（即二进制 `00000010`），只有第 1 位是非零的。那么语句\n\
  \n```\nflags = flags & MASK;\n```\n\n将导致 `flags` 的所有位（第 1 位除外）被设置为 0，因为任何位使用 `&`\
  \ 运算符与 0 结合的结果都是 0。\n\n\n\n\n`MASK` 中所有设置为 `1` 的位在结果中都将被设置为 `0`（清零）。`flags` 中所有对应\
  \ `MASK` 中 `0` 位的位都保持不变。\n\n你可以使用这种简写形式：\n\n```c\nflags &= ~MASK;\n```\n\n### 使用方法：翻转位（Toggling\
  \ Bits）\n\n*翻转*（Toggling）一个位意味着如果它是开启的则将其关闭，如果是关闭的则将其开启。你可以使用位异或（EXCLUSIVE OR）运算符来翻转位。其原理是：如果\
  \ `b` 是一个位设置（1 或 0），那么当 `b` 为 `1` 时，`1 ^ b` 为 `0`；当 `b` 为 `0` 时，为 `1`。同样，无论其值如何，`0\
  \ ^ b` 都等于 `b`。因此，如果你通过 `^` 将一个值与掩码结合，掩码中 `1` 对应的值将会被翻转，而掩码中 `0` 对应的值将保持不变。要翻转 `flags`\
  \ 中的第 1 位，你可以执行以下任一操作：\n\n```c\nflags = flags ^ MASK;\n\nflags ^= MASK;\n```\n\n\
  例如，假设 `flags` 为 `00001111` 且 `MASK` 为 `10110110`。表达式\n\n`flags ^ MASK`\n\n变为\n\n\
  ```\n(00001111) ^ (10110110)  // 表达式\n```\n\n(点击此处查看代码图片)\n\n```\n(10111001)   \
  \           // 结果值\n```\n\n(点击此处查看代码图片)\n\n`MASK` 中所有设置为 `1` 的位都会导致 `flags` 中对应的位被翻转。`flags`\
  \ 中所有对应 `MASK` 中 `0` 位的位都保持不变。\n\n### 使用方法：检查位的值\n\n你已经见过如何更改位的值了。现在，假设你想检查某个位的值。例如，`flags`\
  \ 的第 1 位是否被设置为 1？你不应该简单地将 `flags` 与 `MASK` 比较：\n\n(点击此处查看代码图片)\n\n```c\nif (flags\
  \ == MASK)\n  puts(\"Wow!\");    /* 这行不起作用 */\n```\n\n即使 `flags` 中的第 1 位被设置为 1，`flags`\
  \ 中的其他位设置也可能导致比较不成立。相反，你必须先对 `flags` 中的其他位进行掩码处理，以便 `flags` 的第 1 位与 `MASK` 进行比较：\n\
  \n```c\nif ((flags & MASK) == MASK)\n  puts(\"Wow!\");\n```\n\n位运算符的优先级低于 `==`，因此\
  \ `flags & MASK` 外围需要括号。\n\n为了避免边缘引起的信息泄露，位掩码的宽度至少要与它所掩码的值一样宽。\n\n### 位移运算符\n\n\
  现在让我们来看 C 语言的移动运算符。位移运算符将位向左或向右移动。同样，我们将显式地写出二进制数以展示其工作机制。\n\n#### 左移： <<\n\n左移运算符（`<<`）将左操作数的值按右操作数指定的位数向左移动位。空出的位置用\
  \ 0 填充，移出左操作数末的位将丢失。在下面的示例中，每个位都向左移动了两位：\n\n```\n(10001010) << 2  // 表达式\n(00101000)\
  \      // 结果值\n```\n\n此操作产生一个新的位值，但不会改变它的操作数。例如，假设 `stonk` 为 `1`。那么 `stonk<<2` 为\
  \ `4`，但 `stonk` 仍是 `1`。你可以使用左移赋值运算符（`<<=`）来实际改变变量的值。该运算符将变量中的位按右侧值指定的位数向左移动。这里有一个示例：\n\
  \n(点击此处查看代码图片)\n\n```c\nint stonk = 1;\nint onkoo;\nonkoo = stonk << 2;   /* 将 4\
  \ 赋值给 onkoo */\nstonk <<= 2;         /* 将 stonk 改为 4 */\n```\n\n#### 右移： >>\n\n\
  右移运算符（`>>`）将左操作数的值按右操作数指定的位数向右移动位。移出左操作数右侧的位将丢失。对于 `unsigned` 类型，左侧空出的位置由 0 填充。对于有符号类型，结果取决于机器。空出的位置可能用\
  \ 0 填充，也可能用符号位（最左侧位）填充：\n\n(点击此处查看代码图片)\n\n```\n(10001010) >> 2  // 表达式，有符号值\n(00100010)\
  \      // 结果值，某些系统\n(10001010) >> 2  // 表达式，有符号值\n(11100010)      // 结果值，其他系统\n\
  ```\n\n对于无符号值，你得到：\n\n(点击此处查看代码图片)\n\n```\n(10001010) >> 2  // 表达式，无符号值\n(00100010)\
  \      // 结果值，所有系统\n```\n\n每个位都向右移动了两位，空出的位置用 0 填充。右移赋值运算符（`>>=`）将左侧变量中的位向右移动指定的位数，如下：\n\
  \n(点击此处查看代码图片)\n\n```c\nint sweet = 16;\nint ooosw;\nooosw = sweet >> 3; // ooosw\
  \ = 2, sweet 仍为 16\nsweet >>= 3;         // sweet 改为 2\n```\n\n##### 使用方法：位移运算符\n\
