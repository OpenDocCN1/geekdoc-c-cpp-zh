  \n### 核心概念\n\nC 标准不仅描述了 C 语言，它还描述了一个由 C 语言、C 预处理器和标准 C 库组成的包。预处理器允许你塑造编译过程，列出需要进行的替换，指定哪些代码行应该被编译，以及编译器行为的其他方面。C\
  \ 库扩展了语言的范围，并为许多编程问题提供了预定义的解决方案。\n\n### 总结\n\nC 预处理器和 C 库是 C 语言的两个重要辅助。C 预处理器遵循预处理器指令，在编译之前调整你的源代码。C\
  \ 库提供了许多函数，旨在帮助处理输入输出、文件处理、内存管理、排序和搜索、数学计算和字符串处理等任务（仅列举几个）。附录 B](#app02.html_app02)、参考章节\
