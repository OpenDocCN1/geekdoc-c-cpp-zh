  \ 第一个元素的指针。我们的系统使用 8 字节表示地址，所以指针变量的大小是 8 字节。（其他系统可能使用不同数量的字节。）总之，在列表 10.10 中，`marbles`\
  \ 是数组，`ar` 是指向 `marbles` 第一个元素的指针，C 语言中数组和指针之间的连接允许你对指针 `ar` 使用数组符号\n\n#### 使用指针参数\n\
