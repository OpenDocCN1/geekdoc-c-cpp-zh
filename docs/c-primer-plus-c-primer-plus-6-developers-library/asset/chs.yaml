  \                 : 1;\n    unsigned int fill_color     : 3;\n    unsigned int \
  \               : 4;\n    bool show_border            : 1;\n    unsigned int border_color\
  \   : 3;\n    unsigned int border_style   : 2;\n    unsigned int               \
  \ : 2;\n};\n```\n\n填充使结构达到了 16 位。如果没有填充，该结构将是 10 位。然而，请记住，C 使用 `unsigned int` 作为带有位域结构的基本布局单元。因此，即使结构的唯一成员是一个单个\
  \ 1 位字段，该结构的大小也与 `unsigned int` 相同，在我们系统中是 32 位。此外，此代码假设假设 C99 的 `_Bool` 类型可用，并且在\
  \ `stdbool.h` 中被别名为 `bool`。\n\n你可以对 `opaque` 成员使用 `1` 值表示框是不透明的，使用 `0` 值表示透明。你对\
  \ `show_border` 成员也可以同样的操作。对于颜色，你可以使用简单的 RGB（红-绿-蓝）表示法。这些是混合光的原色。显示器混合红色、绿色和蓝色像素来再产生不同的颜色。在计算机颜色的早期，每个像素可以是开启或关闭的，因此你可以用一个位来表示这三种二进制颜色的每个强度。通常的顺序是左位表示蓝色强度，中间位表示绿色强度，右位表示红色强度。表\
  \ 15.3 显示了八种可能的组合。它们可以用作 `fill_color` 和 `border_color` 成员的值。最后，你可以选择让 0、1 和 2 代表实线、点线和虚线；它们可以被用作\
  \ `border_style` 成员的值。\n\n![Image](img/15tab03.jpg)\n\n表 15.3 简单的颜色表示\n\nListing\
  \ 15.3 在一个简单的示例中使用了 `box_props` 结构。它使用 `#define` 为可能的成员值创建了符号常量。注意，原色由单个位被开启来表示。其他颜色可以用原色的组合来表示。例如，洋红由蓝色位和红色位开启组成，因此它可以用组合\
  \ `BLUE | RED` 表示。\n\nListing 15.3 程序 `fields.c`\n\n* * * \n\n```c\n/* fields.c\
  \ -- 定义和使用字段 */\n\n#include <stdio.h>\n#include <stdbool.h>   //C99, 定义 bool\n\n\
  /* 线型 */\n#define SOLID   0\n#define DOTTED  1\n#define DASHED  2\n\n/* 原色 */\n\
  #define BLUE    4\n#define GREEN   2\n#define RED     1\n\n/* 混合色 */\n#define BLACK\
  \   0\n#define YELLOW  (RED | GREEN)\n#define MAGENTA (RED | BLUE)\n#define CYAN\
  \    (GREEN | BLUE)\n\nconst char * colors[8] = {\"black\", \"red\", \"yellow\"\
  , \"blue\", \"magenta\", \"cyan\", \"white\"};\n\nstruct box_props {\n    bool opaque\
  \                 : 1; // 或 int\n    unsigned int fill_color     : 3;\n    unsigned\
  \ int                : 4;\n    bool show_border            : 1;\n    unsigned int\
  \ border_color   : 3;\n    unsigned int border_style   : 2;\n    unsigned int  \
  \              : 2;\n};\n\nvoid show_settings(const box_props * pb);\n\nint main(void)\
  \ {\n    /* 创建并初始化 box_props */\n    struct box_props box = {true, YELLOW , true,\
  \ GREEN, DASHED};\n    printf(\"原始设置:\\n\");\n    show_settings(&box);\n    box.opaque\
  \ = false;\n    box.fill_color = WHITE;\n    box.border_color = MAGENTA;\n    box.border_style\
  \ = SOLID;\n    printf(\"修改后的设置:\\n\");\n    show_settings(&box);\n    return 0;\n\
  }\n\nvoid show_settings(const box_props * pb) {\n    printf(\"框是 %s。\\n\", pb->opaque\
  \ ? \"opaque\" : \"transparent\");\n    printf(\"填充颜色是 %s。\\n\", colors[pb->fill_color]);\n\
  \    printf(\"边界 %s。\\n\", pb->show_border ? \"shown\" : \"not shown\");\n    printf(\"\
  边界颜色是 %s。\\n\", colors[pb->border_color]);\n    printf(\"边界样式是 \");\n    switch(pb->border_style)\
  \ {\n        case SOLID: printf(\"实线。\\n\"); break;\n        case DOTTED: printf(\"\
  点线。\\n\"); break;\n        case DASHED: printf(\"虚线。\\n\"); break;\n        default:\
  \ printf(\"未知类型。\\n\");\n    }\n}\n```\n\n\n\n注意 `colors` 数组的定义方式，使得每个索引值对应一个字符串，该字符串代表颜色名称，而索引值则是该颜色的数值。例如，索引\
  \ `1` 对应字符串 `\"red\"`，而枚举常量 `red` 的值为 `1`。\n\n## 位域与位运算运算符\n\n位域和位运算运算符是解决同一类型编程问题的两种替代方法。也就是说，通常你可以使用这两种方法中的任何一种。例如，上一个例子使用了一个与\
  \ `unsigned int` 大小相同的结构体来存储图形框的信息。相反，你可以使用一个 `unsigned int` 变量来存储相同的信息。然后，你不再使用结构体成员表示法来访问不同部分，而是可以使用位运算运算符来实现目的。通常情况下，这样做会稍微笨拙一点。让我们来看一个同时采用这两种方法的示例。（同时采用这两种方法是为了说明区别，而不是建议同时使用这两种方法是个好主意！）\n\
  \n你可以使用联合体（union）作为结合结构体方法与位运算方法的手段。给定现有的 `struct box_props` 类型声明，你可以声明如下联合体：\n\n\
  点击此处查看代码图片\n\n```c\nunion Views      /* 将数据视为结构体或 unsigned short */\n{\n    struct\
  \ box_props st_view;\n    unsigned short us_view;\n};\n```\n\n在某些系统上，`unsigned int`\
  \ 和 `box_props` 结构体都占用 16 位内存。在其他系统上（如我们的），`unsigned int` 和 `box_props` 是 32 位。无论何种情况，通过这个联合体，你可以使用\
  \ `st_view` 成员将该内存视为结构体，或者使用 `us_view` 成员将同一块内存视为 `unsigned short`。结构体中的哪些位域对应 `unsigned\
  \ short` 中的哪些位？这取决于实现和硬件。接下来的示例假设结构体是从字节的低位端到高位端加载到内存。也就是说，结构体中的第一个位域进入字的第 0 位。（为了简单起见，图\
  \ 15.3 用一个 16 位单位说明了这一概念。）\n\n![图像](img/15fig03.jpg)\n\n图 15.3 作为一个整数和结构体的联合体。\n\
  \n列表 15.4 使用 `Views` 联合体让你比较位域和位运算方法。在其中，`box` 是 `Views` 联合体，因此 `box.st_view` 是使用位域的\
  \ `box_props` 结构体，而 `box.us_view` 是视为 `unsigned short` 的相同数据。记得联合体可以初始化它的第一个成员，因此初始化值与结构体视图相匹配。程序使用基于结构体视图的函数显示框的属性，同时也使用基于\
  \ `unsigned short` 视图的函数进行显示。哪种方法都能让你访问数据，但技术不同。程序还使用了在本章之前定义的 `itobs()` 函数将数据以二进制字符串的形式显示，这样你就可以哪些位是开启的，哪些位是关闭的。\n\
  \n列表 15.4 dualview.c 程序\n\n点击此处查看代码图片\n\n```c\n/* dualview.c -- 位域和位运算运算符 */\n#include\
  \ <stdio.h>\n#include <stdbool.h>\n#include <limits.h>\n\n/* 位域常量 */\n/* 线条样式  \
  \   */\n#define SOLID   0\n#define DOTTED  1\n#define DASHED  2\n/* 原色  */\n#define\
  \ BLUE    4\n#define GREEN   2\n#define RED     1\n/* 混合色  */\n#define BLACK   0\n\
  #define YELLOW  (RED | GREEN)\n#define MAGENTA (RED | BLUE)\n#define CYAN    (GREEN\
  \ | BLUE)\n#define WHITE   (RED | GREEN | BLUE)\n/* 位运算常量   */\n#define OPAQUE \
  \        0x1\n#define FILL_BLUE      0x8\n#define FILL_GREEN     0x4\n#define FILL_RED\
  \       0x2\n#define FILL_MASK      0xE\n#define BORDER         0x100\n#define BORDER_BLUE\
  \   0x800\n#define BORDER_GREEN  0x400\n#define BORDER_RED    0x200\n#define BORDER_MASK\
  \    0xE0\n#define B_SOLID        0\n#define B_DOTTED       0x100\n#define B_DASHED\
  \       0x200\n#define STYLE_MASK     0x300\nconst char colors[8] = {\"black\",\
  \ \"red\", \"yellow\", \"blue\", \"magenta\", \"white\"};\nstruct box_props {\n\
  \    bool opaque      : 1;\n    unsigned int fill_color: 3;\n    unsigned int  \
  \        : 4;\n    bool show_border  : 1;\n    unsigned int border_color: 3;\n \
  \   unsigned int border_style: 2;\n    unsigned int          : 2;\n};\nunion Views\
  \  /* 将数据视为结构体或 unsigned short */\n{\n    struct box_props st_view;\n    unsigned\
  \ short us_view;\n};\nvoid show_settings(const struct box_props *);\nvoid show_settings1(unsigned\
  \ short);\nchar * itobs(int n, char * ps);\nint main(void)\n{\n    /* 创建结构体视图 */\n\
  \    union Views box = {{true, GREEN, true, RED, DASHED}};\n    printf(\"Original\
  \ box settings:\\n\");\n    show_settings(&box.st_view);\n    printf(\"Box settings\
  \ using unsigned int view:\\n\");\n    show_settings1(box.us_view);\n\n    /* 修改位域视图\
  \ */\n    box.st_view.opaque = false; /* 取消透明 */\n    box.st_view.fill_color = CYAN;\
  \ /* 设置填充颜色 */\n    box.st_view.show_border = true; /* 开启边框 */\n    box.st_view.border_color\
  \ = YELLOW; /* 设置边框颜色 */\n    box.st_view.border_style = DOTTED; /* 设置样式 */\n\n\
  \    printf(\"\\nModified box settings:\\n\");\n    show_settings(&box.st_view);\n\
  \    printf(\"Box settings using unsigned int view:\\n\");\n    show_settings1(box.us_view);\n\
  \n    return 0;\n}\nvoid show_settings(struct box_props *pb)\n{\n    printf(\"Box\
  \ is %s.\\n\", pb->opaque ? \"opaque\": \"transparent\");\n    printf(\"The fill\
  \ color is %s.\\n\", colors[pb->fill_color]);\n    printf(\"Border %s.\\n\", pb->show_border\
  \ ? \"shown\" : \"not\");\n    printf(\"The color is %s.\\n\", colors[pb->border_color]);\n\
  \    printf(\"The style is \");\n    switch(pb->border_style) {\n        case SOLID:\
  \ printf(\"solid.\\n\"); break;\n        case DOTTED: printf(\"dotted.\\n\"); break;\n\
  \        case DASHED: printf(\"dashed.\\n\"); break;\n        default: printf(\"\
  unknown type.\\n\"); break;\n    }\n}\nvoid show_settings1(unsigned short us)\n\
  {\n    printf(\"Box is %s.\\n\", us & OPAQUE ? \"opaque\": \"transparent\");\n \
  \   printf(\"The fill color is %s.\\n\", colors[(us >> 9) & 7]);\n    printf(\"\
  Border %s.\\n\", us & BORDER ? \"shown\" : \"not\");\n    printf(\"The style is\
  \ \");\n    switch(us & STYLE_MASK) {\n        case SOLID: printf(\"solid.\\n\"\
  ); break;\n        case DOTTED: printf(\"dotted.\\n\"); break;\n        case DASHED:\
  \ printf(\"dashed.\\n\"); break;\n        default: printf(\"unknown type.\\n\");\
  \ break;\n    }\n}\nchar * itobs(int n, char * ps)\n{\n    int i;\n    const int\
  \ size = CHAR_BIT * sizeof(int);\n    for (i = size - 1; i >= 0; i--, n >>= 1)\n\
  \        ps[i] = (1 & n) + '0';\n    ps[size] = '\\0';\n    return ps;\n}\n```\n\
  \n以下是输出：\n\n点击此处查看代码图片\n\nOriginal box settings:\n\nBox is opaque.\nThe fill color\
  \ is yellow.\nBorder shown.\nThe color is green.\nThe style is dashed.\n\nBox settings\
  \ using unsigned int view:\n\nbox is opaque.\nThe fill color is yellow.\nBorder\
  \ shown.\nThe style is dashed.\nbits are 00000000000000000010010100000111\n\nModified\
  \ box settings:\n\nBox is transparent.\nThe fill color is cyan.\nBorder shown.\n\
  The color is yellow.\nThe style is dotted.\n\nBox settings using unsigned int view:\n\
  \nbox is transparent.\nThe fill color is cyan.\nBorder shown.\nThe style is dotted.\n\
  bits are 00000000000000100101111000001010\n\n\n\n\n# 使用 unsigned int 视图的框设置：\n\n\
  box 框是透明的。\n\n填充颜色为青色。\n\n不显示边框。\n\n边框样式为点线。\n\n边框颜色为黄色。\n\n位为 `00000000000000000001011100001100`\n\
  \n## 讨论点\n\n有几点需要讨论。位域（bit-field）和位运算视图（bitwise views）之间的区别在于，位运算视图需要位置信息。例如，我们使用\
  \ `BLUE` 来表示蓝色。这个常量的数值为 `4`。但是，由于结构体中数据的排列方式，填充颜色蓝色设置的实际位是第 3 位（记住，编号从 0 开始——参见图\
  \ 15.1），而边框蓝色设置的位是第 11 位。因此，程序定义了一些新常量：\n\n```c\n#define FILL_BLUE       0x8\n#define\
  \ BORDER_BLUE     0x800\n```\n\n在这里，`0x8` 是仅当第 3 位设置为 1 时的值，`0x800` 是仅当第 11 位设置为\
  \ 1 时的值。你可以使用第一个常量来设置填充颜色的蓝色位，使用第二个常量设置边框的蓝色位。使用十六进制表示法更容易看出涉及哪些位。记住，每个十六进制数字代表四位。因此，`0x800`\
  \ 与 `0x8` 相同的位模式，但后面标记了 8 个 0 位。使用十进制等效值 2048 和 8 来说，这种关系就没那么直观了。\n\n如果值是 2 的幂，你可以使用左移运算符来提供值。例如，你可以将最后几个\
  \ `#define` 语句替换为这些：\n\n```c\n#define FILL_BLUE       1<<3\n#define BORDER_BLUE\
  \     1<<11\n```\n\n在这里，第二个操作数是与 `2` 使用的幂。即 `0x8` 是 `2³`，而 `0x800` 是 `2¹¹`。等价地，表达式\
  \ `1<<n` 是仅第 `n` 位设置为 `1` 的整数值。像 `1<<11` 这样的表达式是常量表达式，会在编译时求值。\n\n你可以使用枚举代替 `#define`\
  \ 来创建符号常量。例如，你可以这样做：\n\n点击此处查看代码图像\n\n```c\nenum { OPAQUE = 0x1, FILL_BLUE = 0x8,\
  \ FILL_GREEN = 0x4, FILL_RED = 0x2,\n       FILL_MASK = 0xE, BORDER = 0x100, BORDER_BLUE\
  \ = 0x800,\n       BORDER_GREEN = 0x400, BORDER_RED = 0x200, BORDER_MASK = 0xE00,\n\
  \       B_DOTTED = 0x1000, B_DASHED = 0x2000, STYLE_MASK = 0x3000};\n```\n\n如果你不打算创建枚举变量，则不需要在声明中使用标签（tag）。\n\
  \n## 位运算符的复杂性\n\n注意，使用位运算符来更改设置更为复杂。例如，考虑将填充颜色设为青色。仅仅开启蓝色位和绿色位是不够的：\n\n点击此处查看代码图像\n\
  \n```c\nbox.us_view |= (FILL_BLUE | FILL_GREEN); /* 重置填充 */\n```\n\n问题在于，颜色还取决于红色位的设置。如果该位已经设置（如颜色为黄色），这段代码将保持红色位为开启状态，并设置蓝色和绿色位，导致颜色变为白色。解决这个问题的简单方法是在设置新值之前，先关闭所有的颜色位。这就是为什么程序使用以下代码：\n\
  \n点击此处查看代码图像\n\n```c\nbox.us_view &= ~FILL_MASK;           /* 清除填充位 */\nbox.us_view\
  \ |= (FILL_BLUE | FILL_GREEN); /* 重置填充 */\n```\n\n为了展示如果不先清除相关位会发生什么，程序还执行了操作：\n\
  \n点击此处查看代码图像\n\n```c\nbox.us_view |= BORDER_RED;           /* 错误的方法 */\n```\n\n\
  由于 `BORDER_GREEN` 位已经被设置，结果颜色为 `BORDER_GREEN | BORDER_RED`，翻译为黄色。\n\n在这样的情况下，位域版本更简单：\n\
  \n点击此处查看代码图像\n\n```c\nbox.st_view.fill_color = CYAN;  /* 位域等效写法 */\n```\n\n你不需要先清除位。此外，对于位域成员，你可以为边框和填充使用相同的颜色值，但对于位运算符方法，你需要使用不同的值（反映实际位位置的值）。\n\
  \n接下来，比较以下两个打印语句：\n\n点击此处查看代码图像\n\n```c\nprintf(\"边框颜色是 %s\\n\", colors[box.st_view.border]);\n\
  printf(\"填充颜色是 %s\\n\", colors[(box.us_view & FILL_MASK) >> 2]);\n```\n\n\n\n\n\
  你可以使用 `_Alignas` 限定符来为变量或类型请求特定的对齐方式。但你不应该请求比该类型基础对齐更低的对齐。例如，如果 `float` 的对齐要求为 `4`，则不要请求对齐值为\
  \ `1` 或 `2`。该限定符用作声明的一部分，后面跟着一个括号，括号内包含一个对齐值或一个类型：\n\n点击此处查看代码图像\n\n```c\n_Alignas(double)\
  \ char c1;\n_Alignas(8) char c2;\nunsigned char _Alignas(long double) c_arr[sizeof(long\
  \ double)];\n```\n\n#### 注意\n\n在在本文时，`Clang`（版本 `3.2`）要求 `_Alignas(` 类型`)` 限定符跟在类型限定符之后，如上例的第三行所示。但\
  \ `GCC` `4.7.3` 识别两种顺序，随后的 `Clang` 版本（`3.3`）也是如此。\n\n列表 15.5 提供了 `_Alignas` 和 `_Alignof`\
  \ 的短示例。\n\n##### 列表 15.5 align.c 程序\n\n点击此处查看代码图像\n\n```c\n//  align.c -- 使用 _Alignof\
  \ 和 _Alignas  (C11)\n#include <stdio.h>\n\nint main(void)\n{\n    double dx;\n \
  \   char ca;\n    char cx;\n    double dz;\n    char cb;\n    char _Alignas(double)\
  \ cz;\n    printf(\"char alignment:   %zd\\n\", _Alignof(char));\n    printf(\"\
  double alignment: %zd\\n\", _Alignof(double));\n    printf(\"&dx: %p\\n\", &dx);\n\
  \    printf(\"&ca: %p\\n\", &ca);\n    printf(\"&cx: %p\\n\", &cx);\n    printf(\"\
  &dz: %p\\n\", &dz);\n    printf(\"&cb: %p\\n\", &cb);\n    printf(\"&cz: %p\\n\"\
  , &cz);\n    return 0;\n}\n```\n\n这里是示例输出：\n\n```text\nchar alignment:   1\ndouble\
  \ alignment: 8\n&dx: 0x7fff5fbff660\n&ca: 0x7fff5fbff65f\n&cx: 0x7fff5fbff65e\n\
  &dz: 0x7fff5fbff650\n&cb: 0x7fff5fbff64f\n&cz: 0x7fff5fbff648\n```\n\n在我们的系统中，`double`\
  \ 的对齐值 `8` 意味着该类型对齐到 `8` 的倍数地址。以 `0` 或 `8` 结尾的十六进制地址可以被 `8` 整除，这些正是两个 `double` 变量以及\
  \ `char` 变量 `cz`（它被赋予了 `double` 对齐值）所使用的地址。因为 `char` 的对齐值为 `1`，编译器可以为普通的 `char`\
  \ 变量使用任何地址。\n\n包含 `stdalign.h` 头文件允许你使用 `alignas` 和 `alignof` 来对应 `_Alignas` 和 `_Alignof`。这与\
  \ C++ 的关键字一致。\n\nC11 还通过在 `stdlib.h` 库中添加一个新的内存分配函数，带来了分配内存的对齐能力。其原型如下：\n\n点击此处查看代码图像\n\
  \n```c\nvoid *aligned_alloc(size_t alignment, size_t size);\n```\n\n第一个参数指定所需的对齐方式，第二个参数请求所需的字节数；它应该是第一个参数的倍数。与其他内存分配函数一样，在完成后使用\
  \ `free()` 释放内存。\n\n### 核心概念\n\n让 C 区别于大多数高级语言的特性之一，是它访问整数中单个位的能力。这通常是与硬件设备和操作系统进行交互的关键。\n\
  \nC 提供了访问位的两种主要方法。一种是位运算符运算符族，另一种是在结构体中创建位域的能力。\n\nC11 增加了检查内存对齐要求并请求更严格要求的能力。\n\
  \n通常（但并非总是），使用这些特性的程序与特定的硬件平台或操作系统绑定，并且并不具有移植性。\n\n### 总结\n\n计算硬件与二进制系统紧密相关，因为二进制数中的\
  \ 1 和 0 可以表示计算机内存和寄存器中位的开启和关闭状态。虽然 C 不允许你以二进制形式编写整数，但它确实识别相关的八进制和十六进制表示法。正如每个二进制数字代表\
  \ 1 个位，每个八进制数字代表 3 个位，每个十六进制数字代表 4 个位。\n\n### 复习题\n\n在附录 A 中查找复习题答案。\n\n**1.** 将以下值转换为二进制：\n\
  a. `3`\nb. `5`\nc. `9`\nd. `11`\n\n**2.** 将以下二进制值转换为十进制、八进制和十六进制：\na. `00010101`\n\
  b. `01010101`\nc. `01001100`\nd. `1001111`\n\n**3.** 计算以下表达式的值；假设每个值均为 8 位：\na.\
  \ `~3`\nb. `3 & 6`\nc. `3 | 6`\nd. `3 ^ 6`\ne. `7 >> 1`\nf. `7 << 2`\n\n**4.** 计算以下表达式的值；假设每个值均为\
  \ 8 位：\na. `~0`\nb. `!0`\nc. `2 & 4`\nd. `2 && 4`\ne. `2 | 4`\nf. `2 || 4`\ng. `5\
  \ << 3`\n\n**5.** 因为 ASCII 码仅使用 7 位，有时希望屏蔽掉其他位。掩码的二进制是什么？十进制是什么？八进制是什么？十六进制是什么？\n\
  \n**6.** 在 列表 15.2 中，你可以将\n\n```c\nwhile (bits-- > 0)\n{\n    mask |= bitval;\n\
  \    bitval <<= 1;\n}\n```\n\n替换为\n\n```c\nwhile (bits-- > 0)\n{\n    mask += bitval;\n\
  \    bitval *= 2;\n}\n```\n\n程序仍然可以运行。这意味着操作 `*= 2` 等同于 `<<= 1` 吗？`|=` 和 `+=` 呢？\n\
