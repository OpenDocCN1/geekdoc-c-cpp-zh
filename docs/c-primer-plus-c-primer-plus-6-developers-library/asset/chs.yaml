  \ `show_array()` 和 `new_d_array()` 的代码来完成程序。\n\n## 17. 高级数据表示\n\n你将在本章中学习以下内容：\n\
  \n![Image](img/squf.jpg) 函数：\n\n- 更多 `malloc()`\n![Image](img/squf.jpg) 使用 C 表示各种数据类型\n\
  ![Image](img/squf.jpg) 新算法以及提升你概念性开发程序的能力\n![Image](img/squf.jpg) 抽象数据类型 (ADTs)\n\
  \n学习计算机语言就像学习音乐、木工或工程学。起初，你与这些工具打交道，练习音阶，学习锤子该握哪一端以及避开哪一端，解决无数涉及掉落、滑动和平衡物体的问题。获取并练习技能是你在书中书中一直在做的事情，学习创建变量、结构体、函数等。然而，你最终会移动到一个更高的层次，在那个层次，使用工具已成为本能，真正的挑战在于设计和创建一个项目。你培养了一种将项目视为一个连贯整体的能力。本章集中于这一高级层次。你可能会发现这里的内容比之前的章节更具挑战性，但你可能也发现它更有收获，因为它帮助你从学徒的角色转向工匠的角色。\n\
  \n我们将从研究程序设计的一个至关方面开始：程序表示数据的方式。通常，程序开发中最重要的方面是为该程序处理的数据找到一种良好的表示方法。正确的数据表示可以让编写程序的其余部分变得简单。到目前，你已经看到了\
  \ C 的内置数据类型：简单变量、数组、指针、结构体和联合体。\n\n然而，寻找合适的数据表示通常超出了简单的选择一种类型。你还应该考虑哪些操作是必要的。也就是说，你应该决定如何存储数据，并定义哪些操作对该类型是有效的。例如，C\
  \ 的实现通常将 C `int` 类型和 C 指针类型都存储为整数，但这两个类型具有不同的有效操作集。例如，你可以将一个整数乘以另一个整数，但不能将一个指针乘以另一个指针。你可以使用\
  \ `*` 运算符对指针进行解引用，但该操作对整数来说没有意义。C 语言定义了其基本类型的有效操作。然而，当你设计一种表示数据的方案时，你可能需要自己定义有效操作。在\
  \ C 语言中，你可以通过设计 C 函数来表示所需的操作来实现这一点。简而言之，设计数据类型包括决定如何存储数据以及设计一组用于管理数据的函数。\n\n你还将查看一些*算法*，即处理数据的配方。作为一名程序员，你将获得一套这样的配方库，并将它们反复应用于类似的问题上。\n\
  \n本章探讨了设计数据类型的过程，这是一个将算法与数据表示相匹配的过程。在其中，你将遇到一些常见的数据形式，如队列、列表和二叉搜索树。\n\n你还将被介绍抽象数据类型\
  \ (ADT) 的概念。ADT 以一种面向问题而非面向语言的方式将方法和数据表示封装在一起。在你设计好一个 ADT 后，可以很容易地在不同情况下复用它。理解 ADT\
  \ 能在概念上为你进入面向对象编程 (OOP) 和 C++ 语言的世界做好准备。\n\n### 探索数据表示\n\n让我们从思考数据开始。假设你必须创建一个通讯录程序。你会使用什么数据形式来存储信息？因为每个条目关联着多种信息，所以用结构体来表示每个条目是合理的。你如何表示多个条目呢？使用标准的结构体数组？使用动态数组？还是使用其他形式？条目应该按字母排序吗？你应该能够通过邮政编码搜索条目吗？通过区号？你想要执行的操作可能会影响你决定如何存储信息。简而言之，在投入编码之前，你有很多设计决策要做出。\n\
  \n你会如何表示你想要存储在内存中的位图图像？位图图像是像素被设置的图像。在黑白时代，你可以用一个位表示一个像素（开启或关闭）。现在是彩色的，描述一个像素需要多一个位。例如，如果你为像素分配\
  \ 8 位，可以得到 256 种颜色。这是这样做的方法吗？还是你能开发出压缩信息的方法？这种压缩是*无损*的还是*有损*的？\n\n让我们处理一个特定的数据案例。假设你想写一个程序，让你输入你看过的电影列表（包括录像带、DVD\
  \ 和蓝光光）。对于每部电影，你想记录各种信息，如标题、发行年份、导演、主演、长度、类型（喜剧、科幻、浪漫）等。这建议对每部电影使用一个结构体，并使用数组来列表。为了简化问题，我们将结构体限制为两个成员：电影标题和你的评分（0\
  \ 到 10 分的比例）。列表 17.1 显示了使用这种方法的初步实现。\n\n```c\n/* films1.c -- 使用结构体数组 */\n#include\
  \ <stdio.h>\n#include <string.h>\n\n#define TSIZE 45 /* 保存标题的数组大小 */\n#define FMAX\
  \ 5   /* 标题的最大数量 */\n\nstruct film {\n    char title[TSIZE];\n    int rating;\n\
  };\n\nchar * s_gets(char * st, int n);\n\nint main(void)\n{\n    struct film movies[FMAX];\n\
  \    int i = 0;\n    int j;\n    puts(\"输入第一个电影标题:\");\n    while (i < FMAX && s_gets(movies[i].title,\
  \ TSIZE) != NULL &&\n          movies[i].title[0] != '\\0')\n    {\n        puts(\"\
  输入你的评分 <0-10>:\");\n        scanf(\"%d\", &movies[i++].rating);\n        while(getchar()\
  \ != '\\n')\n            continue;\n        puts(\"输入下一个电影标题（空行停止）:\");\n    }\n\
  \    if (i == 0)\n        printf(\"没有输入数据。 \");\n    else\n        printf (\"这里是电影列表:\\\
  n\");\n    for (j = 0; j < i; j++)\n```\n\n\n\n\n\n```c\nprintf(\"Movie: %s  Rating:\
  \ %d\\n\", movies[j].title, movies[j].rating);\nprintf(\"Bye!\\n\");\nreturn 0;\n\
  }\n\nchar * s_gets(char * st, int n)\n{\n    char * ret_val;\n    char * find;\n\
  \    ret_val = fgets(st, n, stdin);\n    if (ret_val)\n    {\n        find = strchr(st,\
  \ '\\n');   // 寻找换行符\n        if (find)               // 如果地址不是 NULL\n         \
  \   *find = '\\0';           // 在处放置空字符\n        else\n            while (getchar()\
  \ != '\\n')\n                continue;           // 忽略剩余行\n    }\n    return ret_val;\n\
  }\n```\n\n该程序创建了一个结构体数组，并用用户输入的数据填充该数组。输入持续进行，直到数组满（通过 `FMAX` 测试）、到达文件结束符（通过 `NULL`\
  \ 测试），或者用户在行开头按了回车键（通过 `\\0` 测试）。\n\n这种方案存在一些问题。首先，程序很可能会浪费大量空间，因为大多数电影的标题没有 40\
  \ 个字符长，但某些电影的标题确实很长，例如《中产阶级的秘密享受》（The Discreet Charm of the Bourgeoisie）和《拯救好莱坞的狗汤汤》（Won\
  \ Ton Ton, The Dog Who Saved Hollywood）。其次，许多人会认为每年五部电影的限制太严格。当然，你可以增加这个限制，但什么值比较好呢？有些人每年看\
  \ 500 部电影，所以你可以将 `FMAX` 增加到 500，但这对某些人可能仍然太小，而对另一些人可能浪费大量内存。此外，某些编译器对如 `movies`\
  \ 等自动存储类变量设置了可用内存默认限制，如此大的数组可能会超过该值。你可以通过将数组变为静态或外部数组，或者指示编译器使用更大的栈来解决这个问题，但这并没有解决根源问题。\n\
  \n这里的真正问题是数据表示太不灵活了。你必须在编译时做出本该在运行时做出的决策。这表明应该切换到使用动态内存分配的数据表示。\n\n点击此处查看代码图像\n\n\
  ```c\n#define TSIZE  45            /* 存储标题的数组大小  */\nstruct film {\n    char title[TSIZE];\n\
  \    int rating;\n};\n...\n    int n, i;\n    struct film * movies;   /* 结构体指针*/\n\
  \    ...\n    printf(\"Enter the maximum number of movies you'll enter:\\n\");\n\
  \    scanf(\"%d\", &n);\n    movies = (struct film *) malloc(n * sizeof(struct film));\n\
  ```\n\n在这里，就像在第 12 章的“存储类、链接与内存管理”中一样，你可以像使用数组名一样使用指针 `movies`：\n\n点击此处查看代码图像\n\n\
  ```c\nwhile (i < FMAX && s_gets(movies[i].title, TSIZE) != NULL &&\n       movies[i].title[0]\
  \ != '\\0')\n```\n\n通过使用 `malloc()`，你可以将确定元素数量推迟到程序运行时，因此如果只需要 20 个元素，程序就不需要分配 500\
  \ 个。然而，这把提供正确值的负担放在了用户身上。\n\n### 从数组到链表\n\n理想情况下，你希望能够无限添加数据（或直到程序耗尽内存），而无需预先指定要创建多少条目，同时又不让程序分配巨大的内存块。你可以在每次输入后调用\
  \ `malloc()`，并分配恰好容纳新条目的空间。如果用户输入三部电影，程序会调用三次 `malloc()`；如果用户输入 300 部电影，程序会调用 300\
  \ 次 `malloc()`。\n\n这个巧妙的想法引发了一个新问题。要看看是什么，请对比调用一次 `malloc()` 请求足够容纳 300 个 `film`\
  \ 结构体的空间，与调用 300 次 `malloc()`（每次请求容纳一个 `film` 结构体的空间）。第一种情况将内存分配为一个连续的块，你只需要维护一个指向该块中第一个结构体的结构体指针（`film`）来跟踪内容即可。简单的数组表示法允许指针访问块中的每个结构体，如前面的代码所示。第二种方法的问题是，无法保证连续调用\
  \ `malloc()` 会产生相邻的内存块。这意味着结构体并不一定连续存储（参见图 17.1）。因此，你不需要存储一个指向 300 个结构体块的指针，而是需要存储\
  \ 300 个指针，每个对应一个独立的结构体！\n\n![图像](img/17fig01)\n\n图 17.1 在块中分配结构体与单独分配。\n\n解决方案（我们将不会使用）是创建一个指针数组，并在分配新结构体时逐个为指针赋值：\n\
  \n点击此处查看代码图像\n\n```c\n#define TSIZE  45    /* 存储标题的数组大小  */\n#define FMAX  500 \
  \  /* 电影的最大数量 */\nstruct film {\n    char title[TSIZE];\n    int rating;\n};\n...\n\
  \    struct film * movies[FMAX]; /* 指针数组 */\n    int i;\n    ...\n    movies[i]\
  \ = (struct film *) malloc (sizeof(struct film));\n```\n\n这种方法在不使用全部指针时节省了大量内存，但它仍然浪费了未用指针的空间，并且仍然施加了\
  \ 500 个结构的限制。\n\n有一种更好的方法。每次使用 `malloc()` 分配新结构体空间时，也可以在前一个结构体中存储它的地址。“但是，”你说，“那么我需要另一个指针来跟踪它，以此类推。”解决这个潜在问题的技巧是重新定义结构，使每个结构都包含一个指向*下一个*结构体的指针。简而言之，你需要这样重新定义\
  \ `film` 结构：\n\n点击此处查看代码图像\n\n```c\n#define TSIZE  45  /* 存储标题的数组大小  */\nstruct\
  \ film {\n    char title[TSIZE];\n    int rating;\n    struct film * next; /* 指向下一个结构的指针\
  \ */\n};\n```\n\n确实，结构不能包含包含相同类型的自身，但它可以包含指向相同类型结构体的指针。这种定义是定义*链表*的基础——一种每个项都包含如何找到下一个项的列表。\n\
  \n在查看链表的 C 代码之前，让我们对这样一个列表进行概念性的漫游。假设用户输入《现代时代》作为标题，将 10 作为评分。程序将为 `film` 结构体分配空间，将字符串\
  \ `Modern Times` 复制到 `title` 成员中，并将 `rating` 成员设置为 10。为了表示后面没有结构体，程序会将 `next` 成员指针设置为\
  \ `NULL`。（回想起来，`NULL` 是 `stdio.h` 文件中定义的符号常量，表示空指针）。当然，你需要跟踪第一个结构体存储的位置。你可以通过将它的地址分配一个单独的指针来实现，我们将该指针称为*头指针*。头指针指向链表中的第一个项。图\
  \ 17.2 表示了这种结构看起来的样子。（为了节省图形空间，省略了 `title` 成员中的空白空间。）\n\n![图像](img/17fig02.jpg)\n\
  \n图 17.2 链表中的第一个项。\n\n\n\n\n现在假设用户输入了第二个电影名称和评分——例如，`Midnight in Paris` 和 `8`。程序为第二个\
  \ `film` 结构分配空间，并将新结构的地址存储在第一个结构的 `next` 成员中（覆盖掉之前存储在该处的 `NULL`），这样其中一个结构的 `next`\
  \ 指针就指向了链表中的下一个结构。然后，程序将 `Midnight in Paris` 和 `8` 拷贝到新结构中，并将其 `next` 成员设置为 `NULL`，表示它现在是列表中的最后一个结构。图\
  \ 17.3 显示了这样一个包含两个项目的项的列表。\n\n![Image](img/17fig03.jpg)\n\n图 17.3 包含两个项的链表。\n\n\
  每部新电影都将以相同的方式处理。它的地址将存储在它的前一个结构中，新信息将进入新结构，并且它的 `next` 成员被设置为 `NULL`，从而建立一个如图 17.4\
  \ 所示的链表。\n\n![Image](img/17fig04.jpg)\n\n图 17.4 包含多个项的链表。\n\n假设你想显示该列表。每次显示一个项时，可以使用相应结构中存储的地址来定位要显示的下一个项。然而，为了让这种方案生效，你需要一个指针来跟踪列表中的第一个项目，因为列表中的没有任何结构存储了第一个项目的地址。幸运的是，你已经通过\
  \ `head` 指针实现了这一点。\n\n### 使用链表\n\n现在你已经了解了链表的工作原理，让我们来实现它吧。代码列表 17.2 修改了代码列表 17.1，使其使用链表而不是数组来存储电影信息。\n\
  \n列表 17.2 films2.c 程序\n\n点击此处查看代码图像\n\n```c\n/* films2.c -- using a linked list\
  \ of structures */\n\n#include <stdio.h>\n\n#include <stdlib.h>      /* has the\
  \ malloc prototype      */\n#include <string.h>      /* has the strcpy prototype\
  \      */\n\n#define TSIZE    45      /* size of array to hold title   */\n\nstruct\
  \ film {\n    char title[TSIZE];\n    int rating;\n    struct film * next;  /* points\
  \ to next struct in list */\n};\n\nchar * s_gets(char * st, int n);\n\nint main(void)\n\
  {\n    struct film * head = NULL;\n    struct film * prev, * current;\n    char\
  \ input[TSIZE];\n/* Gather  and store information             */\n    puts(\"Enter\
  \ first movie title:\");\n    while (s_gets(input, TSIZE) != NULL && input[0] !=\
  \ '\\0')\n    {\n        current = (struct film *) malloc(sizeof(struct film));\n\
  \        if (head == NULL)      /* first structure      */\n            head = current;\n\
  \        else                  /* subsequent structures */\n            prev->next\
  \ = current;\n        current->next = NULL;\n        strcpy(current->title, input);\n\
  \        puts(\"Enter your rating <0-10>:\");\n        scanf(\"%d\", &current->rating);\n\
  \        while(getchar() != '\\n')\n            continue;\n        puts(\"Enter\
  \ next movie title (empty line to stop):\");\n        prev = current;\n    }\n/*\
  \ Show list of movies              */\n    if (head == NULL)\n        printf(\"\
  No data entered. \");\n    else\n        printf (\"Here the movie list:\\n\");\n\
  \    current = head;\n    while (current != NULL)\n    {\n        printf(\"Movie:\
  \ %s  Rating: %d\\n\", current->title, current->rating);\n        current = current->next;\n\
  \    }\n/* Program done, free allocated memory */\n    current = head;\n    while\
  \ (current != NULL)\n    {\n        free(current);\n        current = current->next;\n\
  \    }\n    printf(\"Bye!\\n\");\n    return 0;\n}\n\nchar * s_gets(char * st, int\
  \ n)\n{\n    char * ret_val;\n    char * find;\n    ret_val = fgets(st, n, stdin);\n\
  \    if (ret_val)\n    {\n        find = strchr(st, '\\n'); // look for newline\n\
  \        if (find) // if the address is not NULL,\n            *find = '\\0'; //\
  \ place null character there\n        else\n            while (getchar() != '\\\
  n')\n                continue; // dispose of rest of line\n    }\n    return ret_val;\n\
  }\n```\n\n该程序使用链表执行两个任务。首先，它构建列表并填充了输入的数据。其次，它显示该列表。显示是一个更简单的任务，所以让我们先看它。\n\n####\
  \ 显示列表\n\n思路是先设置一个指针（称为 `current`）指向第一个结构。因为 `head` 指针（称为 `head`）已经指向了那里，所以这段代码就足够了：\n\
  \n```c\ncurrent = head;\n```\n\n然后你可以使用指针表示法来访问该结构的成员：\n\n点击此处查看代码图像\n\n```c\nprintf(\"\
  Movie: %s  Rating: %d\\n\", current->title, current->rating);\n```\n\n下一步是使用指针赋值让\
  \ `current` 指向列表中的下一个结构。为了完成这项任务，`next` 成员会被设置为 `NULL`，因为该结构现在是列表中的最后一项。这就是显示列表时使用的\
  \ `current` 值：\n\n点击此处查看代码图像\n\n```c\ncurrent = current->next;\n```\n\n为什么不直接使用\
  \ `head` 而不是创建一个指针（`current`）？因为使用 `head` 会改变 `head` 的值，程序将无法找到列表的开头。当显示列表最后一个项时，`current`\
  \ 将设置为 `NULL`。这就是 `films2.c` 用于遍历列表的代码：\n\n点击此处查看代码图像\n\n```c\nwhile (current !=\
  \ NULL)\n{\n    printf(\"Movie: %s  Rating: %d\\n\", current->title, current->rating);\n\
  }\n```\n\n既然你已经了解链表是如何工作的，让我们来实现它吧。代码列表 17.2 修改了代码列表 17.1，使其使用链表而不是数组来存储电影信息。\n\n\
  #### 创建列表\n\n创建列表涉及三个步骤：\n\n1. 使用 `malloc()` 分配结构空间。\n2. 存储结构地址。\n3. 将信息拷贝到结构中。\n\
  \n程序使用临时存储 `input` 数组来获取选择。如果用户从键盘模拟 `EOF` 或输入空行，输入循环退出：\n\n点击此处查看代码图像\n\n```c\n\
  while (s_gets(input, TSIZE) != NULL && input[0] != '\\0')\n```\n\n如果有输入，程序请求空间并将其地址赋值给指针\
  \ `current`：\n\n点击此处查看代码图像\n\n```c\ncurrent = (struct film *) malloc(sizeof(struct\
  \ film));\n```\n\n第一个结构的地址应该存储在 `head` 指针中。每个后续结构的地址应该存储在它的前一个结构的 `next` 成员中。因此，程序需要一种方法知道自己是否正在处理第一个结构。简单的方法是在程序启动时将\
  \ `head` 指针初始化为 `NULL`。然后程序就可以根据 `head` 的值来决定做什么：\n\n点击此处查看代码图像\n\n```c\nif (head\
  \ == NULL)      /* first structure */\n    head = current;\nelse               \
  \   /* subsequent structures */\n    prev->next = current;\n```\n\n在这段代码中，`prev`\
  \ 是一个指向上一次分配结构的指针。\n\n接下来，你必须为结构成员设置正确的值。特别是，你应该将 `next` 成员设置为 `NULL`，以表示当前结构是列表中的最后一个项。你应该将电影标题从\
  \ `input` 数组拷贝到 `title` 成员，并且你应该为 `rating` 成员获取一个值。以下代码完成了这些操作：\n\n点击此处查看代码图像\n\n\
  ```c\ncurrent->next = NULL;\n\nstrcpy(current->title, input);\n\nputs(\"Enter your\
  \ rating <0-10>:\");\n\nscanf(\"%d\", &current->rating);\n```\n\n\n\n由于对 `s_gets()`\
  \ 的调用将输入限制为 `TSIZE – 1` 个字符，`input` 数组中的字符串将放入 `title` 成员中，因此使用 `strcpy()` 是安全的。\n\
  \n最后，你应该为下一次输入循环做好程序准备。特别是，你需要将 `prev` 指向当前结构，因为在输入下一个电影名称并分配下一个结构后，它将成为上一个结构。程序在循环结束时设置了这个指针：\n\
  \n```\nprev = current;\n```\n\n有效吗？这里有一个示例运行结果：\n\n点击此处查看代码图片\n\n输入第一部电影标题：\n\n\
  千与千寻\n\n输入你的评分 <0-10>:\n\n9\n\n输入下一个电影标题（空行停止）：\n\n决斗者\n\n输入你的评分 <0-10>:\n\n8\n\n\
  输入下一个电影标题（空行停止）：\n\n魔鬼：猎犬之丘\n\n输入你的评分 <0-10>:\n\n1\n\n输入下一个电影标题（空行停止）：\n\n以下是电影列表：\n\
  \n电影：千与千寻  评分: 9\n\n电影：决斗者  评分: 8\n\n电影：魔鬼：猎犬之丘  评分: 1\n\n再见！\n\n### 释放列表内存\n\n\
  在许多环境中，程序在终止时会释放 `malloc()` 使用的内存，但最好养成用 `free()` 调用来平衡 `malloc()` 用的习惯。因此，程序通过对每个分配的结构应用\
  \ `free()` 来清理它的内存使用：\n\n```\ncurrent = head;\nwhile (current != NULL)\n{\n    free(current);\n\
  \    current = current->next;\n}\n```\n\n### 结语\n\n`films2.c` 程序略显简陋。例如，它没有检查 `malloc()`\
  \ 是否找到了请求的内存，而且没有提供从列表中删除项的任何机制。然而，这些缺陷是可以修复的。例如，你可以添加代码检查 `malloc()` 的返回值是否为 `NULL`（这是未能获取到你所需内存的标志）。如果程序需要删除条目，你可以编写更多代码来实现这一点。\n\
  \n这种根据需要解决问题和添加功能的权宜方法并不总是最好的编程方法。但另一方面，你通常无法预判程序需要做的一切。随着编程项目规模的扩大，程序员或编程团队预先计划一切的模式变得越来越不现实。据观察，最成功的大程序都是那些从成功的小程序逐步演变而来的。\n\
  \n鉴于你可能需要修改计划，以一种简化修改的方式来开发你的原始想法是一个好主意。列表 17.2 中的示例并没有遵循这一准则。特别地，它倾向于将编码细节和概念模型混合在一起。例如，在示例程序中，概念模型是你向列表添加项。程序通过将\
  \ `malloc()` 和 `current->next` 指针等细节推向前景，模糊了这一接口。如果能以一种方式编写程序，让你显而易见你正在向列表添加某些东西，并隐藏诸如调用内存管理函数和设置指针等簿记工作细节，那就太好了。将用户界面与细节分离将使程序更容易理解和更新。通过重新开始，你可以实现这些目标。让我们看看如何做。\n\
  \n### 抽象数据类型 (ADTs)\n\n在编程中，你尝试将数据类型与编程问题的需求相。例如，你会使用 `int` 类型表示你拥有的鞋子数量，使用 `float`\
  \ 或 `double` 类型表示每双鞋的平均成本。在电影示例中，数据形成了一个项列表，每个项由一个电影名称（C 字符串）和一个评分（一个 `int`）组成。没有基本的\
  \ C 类型匹配该描述，因此我们定义了一个结构来表示单个项，然后设计了两种方法将一系列结构连接起来形成列表。从本质上，我们利用 C 的能力设计了一种符合我们需求的新数据类型，但我们这样做是非系统的。现在我们将采用更系统化的方法来定义类型。\n\
  \n什么构成了一个类型？*类型*指定了两类信息：一组属性和一组操作。例如，`int` 类型的属性是它代表一个整数值，因此共享整数的属性。允许的算术操作包括改变符号、两个\
  \ `int` 相加、两个 `int` 相减、两个 `int` 相乘、一个 `int` 除以另一个 `int` 以及一个 `int` 对另一个取模。当你声明一个变量为\
  \ `int` 时，你是在说只有这些操作可以影响它。\n\n***\n\n#### 注意：整数属性\n\n在 C `int` 类型背后是一个更抽象的概念，即*整数*。数学家可以、并且确实以正式的抽象方式定义整数的属性。例如，如果\
  \ `N` 和 `M` 是整数，那么 `N + M = M + N`，或者对于任意两个整数 `N` 和 `M`，存在一个整数 `S`使得 `N + M = S`。如果\
  \ `N + M = S` 且 `N + Q = S`，那么 `M = Q`。你可以认为数学提供了整数的抽象概念。\n\n***\n\n假设你想定义一个新类型。首先，你必须提供一种存储数据的方法，也许是通过一个结构。其次，你必须提供操作数据的方法。例如，考虑\
  \ `films2.c` 程序（列表 17.2](#ch17.html_ch17lis02)）。它有一个链结构来存储信息，并提供了添加信息和显示信息的代码。然而，这个程序处理这些方式并没有让我们清楚我们在创建一个新类型。我们本应该怎么做？\n\
  \n计算机科学开发出了一种非常成功定义新数据类型的方法。这是一个从抽象到具体的三个步过程：\n\n1. 提供该类型属性以及在该类型上可以执行的操作的抽象描述。这种描述不应绑定到任何特定的实现。它甚至不应该绑定到特定的编程语言。这种正式的抽象描述被称为*抽象数据类型*\
  \ (ADT)。\n2. ...\n3. 编写代码来实现接口。这一步当然是不可少的，但使用新类型的程序员不需要知道实现的细节。\n\n让我们通过一个示例来看看这个过程是如何运作的。由于我们已经在电影列表示例上投入了一些精力，让我们用新方法重做一遍。\n\
  \n\n\n\n基本上，你的电影项目只需要一个项目列表。每个项目包含一个电影名称和一个评分。你并能够将新项目添加到列表的末尾，并且能够显示列表的内容。我们将处理这些需求的抽象类型称为\
  \ `list`。\n\n### 列表应该具备什么属性？显然，列表应该能够容纳一个项的序列。也就是说，列表可以包含多个项，并且这些项是某种顺序排列的，因此你可以谈论列表中的第一个项目、第二个项目或最后一个项目。接下来，列表类型应该支持诸如向列表添加项等的操作。这里是一些实用的操作：\n\
  \n![Image](img/squf.jpg) 将列表初始化为空列表\n\n![Image](img/squf.jpg) 向列表末尾添加一个项\n\n![Image](img/squf.jpg)\
  \ 判断列表是否为空\n\n![Image](img/squf.jpg) 判断列表是否已满\n\n![Image](img/squf.jpg) 判断列表中有多少个项\n\
  \n![Image](img/squf.jpg) 访问列表中的每个项以执行某些操作，例如显示该项\n\n对于这个项目，我们不需要任何额外的操作，但一个更通用的列表操作可能包括以下内容：\n\
  \n![Image](img/squf.jpg) 在列表的任何位置插入一个项\n\n![Image](img/squf.jpg) 从列表中删除一个项\n\n![Image](img/squf.jpg)\
  \ 从列表中检索一个项（列表保持不变）\n\n![Image](img/squf.jpg) 用另一个项替换列表中的某一个项\n\n![Image](img/squf.jpg)\
  \ 在列表中搜索一个项\n\n那么，列表的非正式但抽象的定义是：它是一个能够容纳项序列的数据对象，你可以对它应用上述的任何操作。这个定义并没有说明列表中可以存储什么种类型的项。它没有指定应该使用数组、链式结构集合还是其他数据形式来存储这些项。它没有规定应该使用哪种方法（例如，查找列表中的元素个数）。这些问题都是留给实现的细节。\n\
  \n为了保持示例简单，让我们采用一个简化的列表作为抽象数据类型（ADT），它只体现了电影项目所需的特征。以下是该类型的总结：\n\n![Image](img/788tab01.jpg)\n\
  \n下一步是为简单列表 ADT 开发一个 C 语言接口。\n\n### 构建接口\n\n简单列表的接口分为两部分。第一部分描述数据将如何表示，第二部分描述实现\
  \ ADT 操作的函数。例如，将会有用于向列表添加项以及报告列表项数量的函数。接口设计应该尽可能地与 ADT 描述并行。因此，它应该用某种通用的 `Item`\
  \ 类型来表示，而不是某些特定类型（如 `int` 或 `struct film`）。实现此点的一种方法是使用 C 语言的 `typedef` 将 `Item`\
  \ 定义为所需的类型：\n\n点击此处查看代码图像\n\n```c\n#define TSIZE 45\n\nstruct film {\n    char title[TSIZE];\n\
  \    int rating;\n};\n\ntypedef struct film Item;\n```\n\n然后你可以在后续的定义中使用 `Item`。\n\
  \n```c\ntypedef struct node {\n    Item item;\n    struct node * next;\n} Node;\n\
  \ntypedef Node * List;\n```\n\n定义了 `Item` 后，你现在必须决定如何存储列表。这一步属于实现范围，但让我们遵循这种写法：\n\
  \n```c\ntypedef struct {\n    Node * head;\n    int size;\n} List;\n```\n\n在链表中，每个节点包含一个指向\
  \ `next` 或结构体的指针，我们使用了 `typedef` 让 `List` 成为一个指针。最后，为了管理列表，我们需要一个指向其开头的指针，我们使用了\
  \ `typedef` 让 `List` 类型化。\n\n```c\ntypedef struct {\n    Node * head;\n    int size;\n\
  } List;\n```\n\n这是定义 `List` 的唯一方法吗？不是。例如，你可以引入一个变量来跟踪条目：\n\n点击此处查看代码图像\n\n```c\n\
  typedef struct {\n    Node * head;\n    int size;\n} List;\n```\n\n你可以添加第二个指针来跟踪列表的结尾。稍后你会看到一个那样做的示例。现在，让我们坚持\
  \ `List` 的第一个定义。重要的点是，`movies` 的准确数据表示是一个实现细节，在接口级别应该是不可见的。例如，程序在启动时应该将头指针初始化为 `NULL`，但不应该使用像这样的代码：\n\
  \n```c\nmovies = NULL;\n```\n\n为什么不？因为以后你可能会发现你更喜欢 `List` 的结构实现，这将需要下面的初始化：\n\n\
  ```c\nmovies.next = NULL;\nmovies.size = 0;\n```\n\n任何使用 `List` 类型的人都不应该担心这些细节。相反，他们应该能够按照以下思路操作：\n\
  \n```c\nInitializeList(movies);\n```\n\n程序员只需要知道他们应该使用 `InitializeList()` 函数来初始化列表。他们不需要知道\
  \ `List` 变量的具体数据实现。这是*数据隐藏*的一个例子，即从高层编程中隐藏数据表示细节的艺术。\n\n为了引导用户，你可以提供如下所示函数原型：\n\n\
  点击此处查看代码图像\n\n```c\n/* 操作：初始化列表\n前置条件：plist 指向一个列表\n后置条件：列表被初始化为空 */\nvoid InitializeList(List\
  \ * plist);\n```\n\n你应该注意到的三点。首先，注释列出了*前置条件*——即在调用函数之前应该满足的条件。在这里，例如，你需要列表来进行初始化。其次，注释列出了*后置条件*——即在函数执行后应该满足的条件。最后，该函数使用列表的指针而不是列表本身作为参数，因此函数调用将是：\n\
  \n```c\nInitializeList(&movies);\n```\n\n原因是 C 语言通过值传递参数，因此 C 函数修改调用程序中变量的唯一方法是使用该变量的指针。在这里，语言的限制使得接口稍微偏离了抽象描述。\n\
  \n\n\n\n在 C 语言中将所有类型和函数信息封装到单个包中的方法是将类型定义和函数原型（包括前置条件和后置条件注释）放在头文件中。该文件应该提供程序员使用该类型所需的所有信息。列表\
  \ 17.3 显示了一个用于简单 `list` 类型的头文件。它定义了一个特定的结构作为 `Item` 类型，然后根据 `Item` 定义了 `Node`，再根据\
  \ `Node` 定义了 `List`。表示列表操作的函数随后使用 `Item` 类型和 `List` 类型作为参数。如果函数需要修改参数，它将使用对应类型的指针而不是直接使用该类型。该文件将每个函数名的首字母大写，以此将其标记为接口程序包的一部分。此外，该文件使用了在第\
  \ 16 章中讨论过的“C 预处理器与 C 库”中的 `#ifndef` 技术，以防止文件被多次包含。如果你的编译器不支持 C99 的 `bool` 类型，你可以用\n\
  \n点击此处查看代码图像\n\n```c\n#include <stdbool.h>      /* C99 特性          */\n```\n\n替换为头文件中的：\n\
  \n点击此处查看代码图像\n\n```c\nenum bool {false, true}; /* 定义 bool 为类型，false, true 为值 */\n\
  ```\n\n列表 17.3 list.h 接口头文件\n\n点击此处查看代码图像\n\n***\n\n```c\n/* list.h -- 简单列表类型的头文件\
  \ */\n\n#ifndef LIST_H_\n\n#define LIST_H_\n\n#include <stdbool.h>      /* C99 特性\
  \          */\n\n/* 程序特定声明 */\n#define TSIZE      45    /* 存储标题的数组大小  */\nstruct\
  \ film\n{\n    char title[TSIZE];\n    int rating;\n};\n\n/* 通用类型定义 */\ntypedef\
  \ struct film Item;\ntypedef struct node\n{\n    Item item;\n    struct node * next;\n\
  } Node;\ntypedef Node * List;\n\n/* 函数原型 */\n/* 操作:         初始化列表              \
  \             */\n/* 前置条件:   plist 指向一个列表                            */\n/* 后置条件:\
  \   列表被初始化为空              */\nvoid InitializeList(List * plist);\n\n/* 操作:     \
  \    判断列表是否为空                  */\n/*                  plist 指向一个已初始列表         \
  \ */\n/* 后置条件:   如果列表为空返回 True              */\n/*                  否则返回 False \
  \                 */\nbool ListIsEmpty(const List *plist);\n\n/* 操作:         判断列表是否已满\
  \                   */\n/*                  plist 指向一个已初始列表          */\n/* 后置条件:\
  \   如果列表已满返回 True              */\n/*                  否则返回 False              \
  \            */\nbool ListFull(const List *plist);\n\n/* 操作:      列表中的项目数量     \
  \               */\n/*                  plist 指向一个已初始列表          */\n/* 后置条件:  \
  \ 函数返回项目的数量         */\nunsigned int ListItem(const List *plist);\n\n/* 操作:    \
  \  将项目添加到列表末尾                    */\n/* 前置条件:   item 是要添加到列表的项          */\n/* \
  \                 plist 指向一个已初始列表          */\n/* 后置条件:   如果可能，函数将项目添加到列表末尾*/\n\
  of list 并返回 True；否则函数返回 False          */\nbool AddItem(Item item, List * plist);\n\
  \n/* 操作:      对列表中的每个项目应用函数      */\n/*                  plist 指向一个已初始列表       \
  \   */\n/*                  pfun 指向一个接收 Item      */\nItem 参数且没有返回值的函数         \
  \                 */\n/* 后置条件:   pfun 指向的函数会为列表中的      */\n/* 每个项目执行一次         \
  \             */\nvoid Traverse (const List *plist, void (* pfun)(Item item) );\n\
  \n/* 操作:      释放已分配的内存（如果有）                */\n/*                  plist 指向一个已初始列表\
  \          */\n/* 后置条件:   为列表分配的任何内存都会被释放 */\nand 列表被设为空                       \
  \        */\nvoid EmptyTheList(List * plist);\n\n#endif\n```\n\n***\n\n只有 `InitializeList()`、`AddItem()`\
  \ 和 `EmptyTheList()` 函数修改列表，因此从技术上讲，它们是唯一需要指针参数的方法。然而，如果用户必须记住向某些函数传递 `List` 参数，而向其他函数传递\
  \ `List` 的地址作为参数，可能会引起困惑。为了简化用户的责任，所有函数都使用指针参数。\n\n头文件中的原型之一比其他的复杂一点：\n\n点击此处查看代码图像\n\
  \n```c\n/* 操作:    对列表中的每个项目应用函数      */\n/*                  plist 指向一个已初始列表   \
  \       */\n/*                  pfun 指向一个接收 Item      */\nItem 参数且没有返回值的函数     \
  \                     */\n/* 后置条件:   pfun 指向的函数会为列表中的      */\n/* 每个项目执行一次     \
  \                 */\nvoid Traverse (const List *plist, void (* pfun)(Item item)\
  \ );\n```\n\n`pfun` 是一个指向函数的指针。具体来说，它指向一个接受 `item` 作为参数且没有返回值的函数指针。正如你在第 14 章中可能记得的，你可以将函数指针传递给\
  \ `Traverse()`，以便 `Traverse()` 对列表中的每个项目应用该函数。\n\n#### 使用接口\n\n我们的主张是，你应该能够使用此接口编写程序——例如，知道函数是如何实现的。在编写支持函数之前，让我们编写新版本的程序。这里有一个伪代码表示：\n\
  \n点击此处查看代码图像\n\n```text\n创建一个 List 变量。\n创建一个 Item 变量。\n初始化列表为空。\n当列表未满且还有输入时：\n\
  \    将输入读入 Item 变量。\n    将项添加到列表末尾。\n访问列表中的每个项目并显示。\n```\n\n列表 17.4 所示的程序遵循这一基本计划，并进行了一些错误检查。注意它是如何使用在列表\
  \ 17.3 中描述的接口的。同样注意列表中包含 `showmovies()` 函数的代码，它符合 `Traverse()` 的原型。因此，程序可以将指针 `showmovies`\
  \ 传递给 `Traverse()`，以便 `Traverse()` 对列表中的每个项目应用该函数。（记住函数名就是一个指针。）\n\n列表 17.4 films3.c\
  \ 程序\n\n点击此处查看代码图像\n\n***\n\n```c\n/* films3.c -- 使用 ADT 风格的链表 */\n/* 与 list.c 编译\
  \ */\n#include <stdio.h>\n#include <stdlib.h> /* exit() 的原型 */\n#include \"list.h\"\
  \   /* 定义 List, Item */\n\nvoid showmovies(Item item);\nchar * s_gets(char * st,\
  \ int n);\n\nint main(void)\n{\n    List movies;\n    Item temp;\n\n    /* 初始化 */\n\
  \    InitializeList(&movies);\n    if (ListIsFull(&movies))\n    {\n        fprintf(stderr,\"\
  无可用内存！再见!\\n\");\n        exit(1);\n    }\n\n    /* 收集并存储 */\n    puts(\"输入第一个电影标题:\"\
  );\n```\n\n\n\n\n```c\nwhile (s_gets(temp.title, TSIZE) != NULL && temp.title[0]\
  \ != '\\0')\n{\n    puts(\"Enter your rating <0-10>:\");\n    scanf(\"%d\", &temp.rating);\n\
  \    while(getchar() != '\\n')\n        continue;\n    if (AddItem(temp, &movies)==false)\n\
  \    {\n        fprintf(stderr,\"Problem allocating memory\\n\");\n        break;\n\
  \    }\n    if (ListIsFull(&movies))\n    {\n        puts(\"The list is now full.\"\
  );\n        break;\n    }\n    puts(\"Enter next movie title (empty line to stop):\"\
  );\n}\n/* display             */\nif (ListIsEmpty(&movies))\n    printf(\"No data\
  \ entered. \");\nelse\n{\n    printf (\"Here is the movie list:\\n\");\n    Traverse(&movies,\
  \ showmovies);\n}\nprintf(\"You entered %d movies.\\n\", ListItemCount(&movies));\n\
  /* clean up             */\nEmptyTheList(&movies);\nprintf(\"Bye!\\n\");\nreturn\
  \ 0;\n}\n\nvoid showmovies(Item item)\n{\n    printf(\"Movie: %s  Rating: %d\\n\"\
  , item.title,\n        item.rating);\n}\n\nchar * s_gets(char * st, int n)\n{\n\
  \    char * ret_val;\n    char * find;\n    ret_val = fgets(st, n, stdin);\n   \
  \ if (ret_val)\n    {\n        find = strchr(st, '\\n');   // look for newline\n\
  \        if (find)               // if the address is not NULL,\n        *find =\
  \ '\\0';            // place a null character there\n        else\n        while\
  \ (getchar() != '\\n')\n            continue;           // dispose of rest of line\n\
  \    }\n    return ret_val;\n}\n```\n\n### 实现接口\n\n当然，你仍然需要实现 `List` 接口。C 语言的方法是将函数定义收集在一个名为\
  \ `list.c` 的文件中。完整的程序随后由三个文件组成：`list.h`，它定义了数据结构并为用户接口提供了原型；`list.c`，提供了实现接口的函数代码；以及\
  \ `films3.c`，这是一个将列表接口应用于特定编程问题的源代码文件。代码列表 17.5 显示了 `list.c` 的一种可能实现方式。要运行该程序，你必须编译\
  \ `films3.c` 和 `list.c` 并将它们链接。（你可能想回顾第 9 章中关于“函数”的编译多文件程序的讨论。））`list.h`、`list.c`\
  \ 和 `films3.c` 文件共同构成了一个完整的程序（请参见图 17.5）。\n\n![Image](img/17fig05.jpg)\n\n图 17.5\
  \ 程序包的三个部分。\n\n列表 17.5 list.c 实现文件\n\n点击此处查看代码图像\n\n```c\n/* list.c -- functions\
  \ supporting list operations */\n#include <stdio.h>\n#include <stdlib.h>\n#include\
  \ \"list.h\"\n\n/* local function prototype */\nstatic void CopyToNode(Item item,\
  \ Node * pnode);\n\n/* interface functions   */\n/* set the list to empty */\nvoid\
  \ InitializeList(List * plist)\n{\n    * plist = NULL;\n}\n\n/* returns true if\
  \ list is empty */\nbool ListIsEmpty(const List * plist)\n{\n    if (*plist == NULL)\n\
  \        return true;\n    else\n        return false;\n}\n\n/* returns true if\
  \ list is full */\nbool ListIsFull(const List * plist)\n{\n    Node * pt;\n    bool\
  \ full;\n    pt = (Node *) malloc(sizeof(Node));\n    if (pt == NULL)\n        full\
  \ = true;\n    else\n        full = false;\n    free(pt);\n    return full;\n}\n\
  /* returns number of nodes */\nunsigned int ListItemCount(const List * plist)\n\
  {\n    unsigned int count = 0;\n    Node * pnode = *plist;   /* set to start of\
  \ list */\n    while (pnode != NULL)\n    {\n        ++count;\n        pnode = pnode->next;\
  \   /* set to next node */\n    }\n    return count;\n}\n/* creates node to hold\
  \ item and adds it to the end of */\n/* list pointed by plist (slow implementation)\
  \ */\nbool AddItem(Item item, List * plist)\n{\n    Node * pnew;\n    Node * scan\
  \ = *plist;\n    pnew = (Node *) malloc(sizeof(Node));\n    if (pnew == NULL)\n\
  \        return false;   /* quit on failure */\n    CopyToNode(item, pnew);\n  \
  \  pnew->next = NULL;\n    if (scan == NULL)   /* empty list, so place */\n    \
  \    *plist = pnew;   /* pnew at head of list */\n    else\n    {\n        while\
  \ (scan->next != NULL)\n            scan = scan->next;   /* find end of list */\n\
  \        scan->next = pnew;   /* add pnew to end */\n    }\n    return true;\n}\n\
  /* visit each node and execute function pointed at */\nvoid Traverse(List * plist,\
  \ void (*pfun)(Item))\n{\n    Node * pnode = *plist;   /* set to start of list */\n\
  \    while (pnode != NULL)\n    {\n        pfun(*pnode);         /* apply function\
  \ */\n        pnode = pnode->next;   /* advance to next */\n    }\n}\n/* clean up\
  \             */\nvoid EmptyTheList(List * plist)\n{\n    Node * pnode;\n    while\
  \ (*plist != NULL)\n    {\n        pnode = *plist;\n        *plist = pnode->next;\n\
  \        free(pnode);           /* free node */\n    }\n}\n\n/* local function copies\
  \ into node */\nstatic void CopyToNode(Item item, Node * pnode)\n{\n    pnode->item\
  \ = item;\n    pnode->next = NULL;\n}\n```\n\n\n\n\n```c\nscan = scan->next;  /*\
  \ 找到列表末尾 */\nscan->next = pnew;   /* 将 pnew 添加到末尾 */\n}\n\nreturn true;\n\n```\n\
  \n`AddItem()` 函数执行的第一件事是为新节点分配空间。如果成功，该函数将使用 `CopyToNode()` 将项拷贝到节点中。然后，它将节点的 `next`\
  \ 成员设置为 `NULL`。正如你所回的，这表示该节点是链表中的最后一个节点。最后，在创建节点并对其成员分配正确的值后，函数将该节点附加到列表末尾。如果该项是添加到列表的第一个项，程序会将头指针指向该第一个项。（记住，调用\
  \ `AddItem()` 时，第二个参数是头指针的地址，因此 `* plist` 是头指针的值。）否则，代码将遍历链表，直到找到 `next` 成员设置为 `NULL`\
  \ 的项。该节点目前是最后一个节点，因此该函数重置其 `next` 成员以指向新节点。\n\n良好的编程习惯要求你在尝试向列表添加项之前调用 `ListIsFull()`。然而，用户可能没有遵守这一规定，因此\
  \ `AddItem()` 会自行检查 `malloc()` 是否成功。此外，用户可能在调用 `ListIsFull()` 和调用 `AddItem()` 之间执行其他分配内存的操作，因此最好检查\
  \ `malloc()` 是否正常工作。\n\n`Traverse()` 函数与 `ListItemCount()` 函数类似，不同在于对列表中的每个项应用了一个函数：\n\
  \n点击此处查看代码图像\n\n```c\nvoid Traverse (const List * plist, void (* pfun)(Item item)\
  \ )\n{\n    Node * pnode = *plist;   /* 设置为列表起始 */\n    while (pnode != NULL)\n\
  \    {\n        (*pfun)(pnode->item); /* 对项应用函数 */\n        pnode = pnode->next;\
  \  /* 移动到下一个项 */\n    }\n}\n```\n\n记住 `pnode->item` 代表存储在节点中的数据，`pnode->next` 指定链表中的下一个节点。例如，函数调用\n\
  \n```\nTraverse(movies, showmovies);\n```\n\n将 `showmovies()` 函数应用到列表中的每个项。\n\n\
  最后，`EmptyTheList()` 函数释放之前使用 `malloc()` 分配的内存：\n\n点击此处查看代码图像\n\n```c\nvoid EmptyTheList(List\
  \ * plist)\n{\n    Node * psave;\n    while (*plist != NULL)\n    {\n        psave\
  \ = (*plist)->next; /* 保存下一个节点的地址 */\n        free(*plist);          /* 释放当前节点 */\n\
  \        *plist = psave;       /* 移动到下一个节点 */\n    }\n}\n```\n\n实现通过将 `List` 变量设置为\
  \ `NULL` 来表示空列表。因此，该函数需要传递 `List` 变量的地址以便能够重置。由于 `List` 已经是一个指针，`plist` 是指向指针的指针。因此，在代码中，表达式\
  \ `*plist` 的类型是指向节点的指针。当列表结束时，`*plist` 为 `NULL`，意味着原始实际参数现在被设置为 `NULL`。\n\n代码保存了下一个节点的地址，因为原则上，调用\
  \ `free()` 可能会导致当前节点（由 `*plist` 指向的内容）的内容不再可用。\n\n***\n\n注意：`const` 的局限性\n\n几个处理列表的函数将\
  \ `const List * plist` 作为参数。这表示这些函数不会修改列表。在这里，`const` 提供了一些保护。它防止 `*plist`（`plist`\
  \ 指向的内容）被更改。在程序中，`plist` 指向 `movies`，因此 `const` 防止这些函数更改 `movies`，而 `movies` 反过来指向列表中的第一个链接。因此，不允许出现如下代码：\n\
  \n点击此处查看代码图像\n\n```\n*plist = (*plist)->next;\n```\n\n***\n\n### 思考你的工作\n\n花一点时间评估一下\
  \ ADT（抽象数据类型）所做的工作。\n\n\n\n最后，想想这种方法为程序开发过程带来的好处。如果某些部分运行不正常，你可能可以将问题定位到单个函数。如果你认为执行某项任务有更好的方法（例如添加项），你只需要重写那一个函数即可。如果你需要一个新功能，可以考虑向包中添加一个新函数。如果你认为数组或双向链表更好，你可以重写实现部分，而无需修改使用该实现的程序。\n\
  \n### 使用 ADT 实现队列\n\n正如你所见的，在 C 语言中采用抽象数据类型（ADT）方法进行编程涉及以下三个步骤：\n\n1. 以抽象、通的方式描述一种类型，包括它的操作。\n\
  2. 设计一个函数接口来表示新类型。\n3. 编写详细的代码来实现该接口。\n\n你已经见过这种方法应用于简单列表。现在，让我们将其应用于稍微复杂一点的东西：队列。\n\
  \n### 定义队列抽象数据类型\n\n`queue` 是一个具有两个特殊属性的列表。首先，新项只能添加到列表的末尾。在这一点方面，队列类似于简单列表。第二，项只能从列表的头部移除。你可以将队列想象成一排在剧院买票的人。你从队尾加入队列，买完票后从队头离开。队列是一种“先进先出”（FIFO）的数据结构，就像电影院排队一样（如果没有人插队）。再次，让我们给出一个非正式的、抽象定义，所示：\n\
  \n![Image](img/804tab01.jpg)\n\n### 定义接口\n\n接口定义将放入名为 `queue.h` 的文件中。我们将使用 C 语言的\
  \ `typedef` 机制为两种类型创建名称：`Item` 和 `Queue`。对应结构体的确切实现应该是 `queue.h` 文件的一部分，但从概念上说，设计结构是详细实现阶段的一部分。目前，只需假设类型已经定义，并集中在函数原型上。\n\
  \n首先，考虑初始化。它涉及修改 `Queue` 类型，因此函数应该接受一个 `Queue` 的地址作为参数：\n\n点击此处查看代码图像\n\n```\nvoid\
  \ InitializeQueue (Queue * pq);\n```\n\n接下来，确定队列是否为空或满需要一个返回真值或假值的函数。这里我们假设可以使用\
  \ C99 的 `stdbool.h` 头文件。如果不可用，你可以使用 `int` 类型或自己定义一个 `bool` 类型。由于函数没有更改队列，它可以接受一个\
  \ `Queue` 参数。另一方面，取决于 `Queue` 类型对象的大小，仅传递 `Queue` 的地址可能会更快且更节省内存。让我们尝试一下这种方法。另一个优势是，通过这样所有函数都将接受一个地址作为参数。为了指示这些函数不会改变队列，你可以、也应该使用\
  \ `const` 修饰符：\n\n点击此处查看代码图像\n\n```c\nbool QueueIsFull(const Queue * pq);\n\nbool\
  \ QueueIsEmpty (const Queue * pq);\n```\n\n换句话之，指针 `pq` 指向一个 `Queue` 数据对象，该对象无法通过\
  \ `pq` 进行修改。你可以为返回返回队列中项数量的函数定义一个类似的原型：\n\n点击此处查看代码图像\n\n```c\nint QueueItemCount(const\
  \ Queue * pq);\n```\n\n在队列末尾添加项涉及识别该项和队列。这次队列被修改了，因此使用指针是必要的，而不是可选的。函数类型可以是 `void`，或者你可以使用返回值来指示添加项的操作是否成功。让我们采用第二种方法：\n\
  \n点击此处查看代码图像\n\n```c\nbool EnQueue(Item item, Queue * pq);\n```\n\n最后，移除项可以通过多种方式完成。如果项被定义为结构体或基本类型之一，它可以由函数返回。函数参数可以是\
  \ `Queue` 或指向 `Queue` 的指针。因此，一种可能的原型是这样的：\n\n```c\nItem DeQueue(Queue q);\n```\n\
  \n然而，以下原型更通用一些：\n\n点击此处查看代码图像\n\n```c\nbool DeQueue(Item * pitem, Queue * pq);\n\
  ```\n\n从队列中移除的项将进入 `pitem` 指针指向的位置，返回值指示操作是否成功。\n\n清空队列函数需要的唯一应该是队列的地址，这建议了如下原型：\n\
  \n点击此处查看代码图像\n\n```c\nvoid EmptyTheQueue(Queue * pq);\n```\n\n### 实现接口的数据表示\n\n\
  第一步是决定使用何种 C 数据格式作为队列。一种可能性是数组。数组的优势是易于使用，并且在数组已填充部分的末尾添加项很容易。问题出现在从队列头部移除项。在剧院买票的类比中，从队列头部移除项涉及复制数组的首元素并将每个元素向前移动。虽然这种方法很容易，但会浪费大量的计算机时间（见图\
  \ 17.6](#ch17_images.html_p806)）。\n\n![Image](img/06.jpg)\n\n图 17.6 使用数组作为队列\n\n\
  处理数组的第二种方法是让元素留在原处，改变你称部的头部（见图 17.7](#ch17_images.html_p807)）。这种方法的问题是弃用的元素变成了死空间，导致队列的可用空间不断减少。\n\
  \n![Image](img/07.jpg)\n\n图 17.7 重新定义头部\n\n解决死空间问题的巧妙方法是使队列变为环形的。这意味着从数组的末尾绕回到开头。也就是说，将数组的首元素紧邻最后一个元素，这样当你到达数组末尾时，可以从开始添加项（见图\
  \ 17.8](#ch17_images.html_p808)）。你可以想象将数组画在纸上，然后将数组的一端贴在另一端形成一个带。当然，你现在必须做一些记录以确保队列的结尾超过头部。\n\
  \n![Image](img/08.jpg)\n\n图 17.8 环形队列\n\n另一种解决方案是使用链表。它的优点是移除头部不需要移动所有其他元素。只需重置指针指向新的第一个元素。由于我们已经在处理链表，我们将采取这条路线。为了测试我们的想法，我们将从一个整数队列开始：\n\
  \n```c\ntypedef int Item;\n```\n\n链表由节点构建，所以让我们定义一个节点 next：\n\n```c\ntypedef struct\
  \ node {\n    Item item;\n    struct node * next;\n} Node;\n```\n\n对于队列，你需要跟踪头部和尾部项。可以使用指针来实现。此外，你可以使用计数器来跟踪队列中项的数量。因此，该结构体有两个指针成员和一个\
  \ `int` 类型成员：\n\n点击此处查看代码图像\n\n```c\ntypedef struct queue {\n    Node * front; /*\
  \ 指向队列头部的指针 */\n    Node * rear;  /* 指向队列尾部的指针 */\n    int items;     /* 队列中项的数量\
  \ */\n} Queue;\n```\n\n注意 `Queue` 是一个三个成员的结构体，因此早期使用队列指针而不是整个队列作为参数可以节省时间和空间。\n\n\
  \n\n\n接下来，考虑队列的大小。使用链表时，限制是由可用内存量设定的，但通常更小的尺寸更为合适。例如，你可能使用队列来模拟在机场等候降落的飞机。如果等待的飞机数量过大，新飞入的飞机可能会被重路由到其他机场。我们将设置最大队列大小为\
  \ 10。列表 17.6 包含了队列接口的定义和原型。它留下了 `Item` 类型的具体定义空间。在使用该接口时，你将为你的特定程序插入相应的定义。\n\n###\
  \ 列表 17.6 queue.h 接口头文件\n\n点击此此处查看代码图片\n\n```c\n/* queue.h -- 队列的接口 */\n\n#ifndef\
  \ _QUEUE_H_\n\n#define _QUEUE_H_\n\n#include <stdbool.h>\n\n/* 在此处插入 ITEM 类型 */\n\
  \n/* 例如， */\n\ntypedef int Item;  // 用于 use_q.c\n\n/* 或者使用 typedef struct item {int\
  \ gumption; int charisma;} Item; */\n\n#define MAXQUEUE 10\n\ntypedef struct node\n\
  \n{\n\n    Item item;\n    struct node * next;\n} Node;\n\ntypedef struct queue\n\
  \n{\n\n    Node * front;  /* 指向队列头的指针  */\n    Node * rear;   /* 指向队列尾的指针    */\n\
  \    int items;      /* 队列中的项目数量    */\n} Queue;\n\n/* 操作：初始化队列              */\n\
  /* 前提：pq 指向一个队列              */\n/* 后置条件：队列初始化为空  */\nvoid InitializeQueue(Queue\
  \ * pq);\n\n/* 操作：检查队列是否已满            */\n/* 前提：pq 指向一个之前初始化的队列  */\n/* 后置条件：如果队列满返回\
  \ True，否则返回 False  */\nbool QueueIsFull(const Queue * pq);\n\n/* 操作：检查队列是否为空  */\n\
  /* 前提：pq 指向一个之前初始化的队列  */\n/* 后置条件：如果队列为空返回 True，否则返回 False */\nbool QueueIsEmpty(const\
  \ Queue *pq);\n\n/* 操作：确定队列中的项目数量  */\n/* 前提：pq 指向一个之前初始化的队列  */\n/* 后置条件：返回队列中的项目数量\
  \      */\nint QueueItemCount(const Queue * pq);\n\n/* 操作：将项目添加到队列尾部           \
  \   */\n/* 前提：pq 指向一个之前初始化的队列  */\n/*               item 将被放在队列尾部  */\n/* 后置条件：如果队列不为空，item\
  \ 被放在  */\n/*                尾部且函数返回    */\n/*                True；否则，队列保持不变且  */\n\
  bool EnQueue(Item item, Queue * pq);\n\n/* 操作：从队列头部移除项目  */\n/* 前提：pq 指向一个之前初始化的队列\
  \  */\n/* 后置条件：如果队列不为空，头部的  */\n/*                项目被复制到 *pitem 并从  */\n/*     \
  \           队列中删除，并返回 True；如果  */\n/*                操作清空了队列，队列将  */\n/*       \
  \         重置为空。如果队列本身为空，则 */\n/*                队列保持不变且  */\nbool DeQueue(Item *pitem,\
  \ Queue * pq);\n\n/* 操作：清空队列  */\n/* 前提：pq 指向一个之前初始化的队列  */\n/* 后置条件：队列为空  */\n\
  void EmptyTheQueue(Queue * pq);\n\n#endif\n```\n\n### 实现接口函数\n\n现在我们可以开始编写接口代码了。首先，将队列初始化为“空”意味着将头、尾指针设置为\
  \ `NULL`，并将项目计数（`items` 成员）设置为 `0`：\n\n点击此此处查看代码图片\n\n```c\nvoid InitializeQueue(Queue\
  \ * pq)\n{\n    pq->front = pq->rear = NULL;\n    pq->items = 0;\n}\n```\n\n接下来，`items`\
  \ 成员使得能够很容易地检查队列是否满或为空，并返回队列中的项目数量：\n\n点击此此处查看代码图片\n\n```c\nbool QueueIsFull(const\
  \ Queue * pq)\n{\n    return pq->items == MAXQUEUE;\n}\n\nbool QueueIsEmpty(const\
  \ Queue * pq)\n{\n    return pq->items == 0;\n}\n\nint QueueItemCount(const Queue\
  \ * pq)\n{\n    return pq->items;\n}\n```\n\n向队列中添加项目涉及以下步骤：\n\n1. 创建一个新节点。\n2.\
  \ 将项目复制到节点中。\n3. 将节点的 `next` 指针设置为 `NULL`，标识该节点为列表的最后一个。\n4. 将当前尾部节点的 `next` 指针指向新节点，将新节点链接到队列。\n\
  5. 将 `rear` 指针设置为新节点，以便找到最后一个节点。\n6. 将项目计数加 1。\n\n此外，该函数必须处理两种特殊情况。首先，如果队列为空，`front`\
  \ 指针应设置为指向新节点。这是因为当只有一个节点时，该节点既是队列的头部也是尾部。其次，如果函数无法获取内存，它应该做某些处理。由于我们设想的是小队列，如果内存耗尽，我们将让程序终止。这里是\
  \ `EnQueue` 的代码：\n\n点击此此处查看图片\n\n```c\nbool EnQueue(Item item, Queue * pq)\n{\n\
  \    Node * pnew;\n    if (QueueFull(pq))\n    {\n        return false;\n    }\n\
  \    pnew = (Node *) malloc(sizeof(Node));\n    if (pnew == NULL)\n    {\n     \
  \   fprintf(stderr,\"无法分配内存!\\n\");\n        exit(1);\n    }\n    CopyToNode(item,\
  \ pnew);\n    pnew->next = NULL;\n    if (QueueIsEmpty(pq))\n    {\n        pq->front\
  \ = pnew;\n    }\n    else\n    {\n        pq->rear->next = pnew;\n    }\n    pq->items++;\n\
  \    return true;\n}\n```\n\n`CopyToNode()` 函数是一个处理复制项目到节点的静态函数：\n\n```c\nstatic\
  \ void CopyToNode(Item item, Node * pn)\n{\n    pn->item = item;\n}\n```\n\n从队列头部移除项目涉及以下步骤：\n\
  \n1. 将项目复制到一个变量。\n2. 释放节点使用的内存。\n3. 将头指针指向队列中的下一个项目。\n4. 如果删除了最后一个项目，将尾指针重置为 `NULL`。\n\
  5. 减少项目计数。\n\n这里是执行所有操作的代码：\n\n```c\nbool DeQueue(Item *pitem, Queue * pq)\n{\n\
  \    Node * pt;\n    if (QueueIsEmpty(pq))\n    {\n        return false;\n    }\n\
  \    CopyToItem(pq->front, pitem);\n    pt = pq->front;\n    pq->front = pq->front->next;\n\
  \    free(pt);\n    pq->items--;\n    if (pq->items == 0)\n    {\n        pq->rear\
  \ = NULL;\n    }\n    return true;\n}\n```\n*(注：原文在 DeQueue 块中使用了 `CopyToItem`，而在描述中使用了\
  \ `CopyToNode`，翻译时保留了原文的逻辑名称)*\n\n\n\n\n\n```c\nvoid EmptyTheQueue(Queue * pq)\n\
  {\n    Item dummy;\n    while (!QueueIsEmpty(pq))\n        DeQueue(&dummy, pq);\n\
  }\n```\n\n***\n\n**注意：** 保持你的 ADT 纯洁性\n\n在定义 ADT 接口后，你应该只使用接口提供的函数来处理数据类型。例如，请注意\
  \ `Dequeue()` 取决于 `EnQueue()` 函数能够正确地完成设置指针的工作，并将 `rear` 节点的 `next` 指针设置为 `NULL`。如果你在使用\
  \ ADT 的程序中决定直接操作队列的部分内容，你可能会破坏接口包中函数之间的协调工作。\n\n***\n\nListing 17.7 显示了接口的所有函数，包括在\
  \ `EnQueue()` 中使用的 `CopyToItem()` 函数。\n\nListing 17.7 `queue.c` 实现文件\n\n点击此处查看代码图像\n\
  \n***\n\n```c\n/* queue.c -- Queue 类型的实现*/\n#include <stdio.h>\n#include <stdlib.h>\n\
  #include \"queue.h\"\n\n/* 本地函数 */\nstatic void CopyToNode(Item item, Node * pn);\n\
  static void CopyToItem(Node * pn, Item * pi);\n\nvoid InitializeQueue(Queue * pq)\n\
  {\n    pq->front = pq->rear = NULL;\n    pq->items = 0;\n}\n\nbool QueueIsFull(const\
  \ Queue * pq)\n{\n    return pq->items == MAXQUEUE;\n}\n\nbool QueueIsEmpty(const\
  \ Queue * pq)\n{\n    return pq->items == 0;\n}\n\nint QueueItemCount(const Queue\
  \ * pq)\n{\n    return pq->items;\n}\n\nbool EnQueue(Item item, Queue * pq)\n{\n\
  \    Node * pnew;\n    if (QueueIsFull(pq))\n        return false;\n    pnew = (Node\
  \ *) malloc( sizeof(Node));\n    if (pnew == NULL)\n    {\n        fprintf(stderr,\"\
  Unable to allocate memory!\\n\");\n        exit(1);\n    }\n    CopyToNode(item,\
  \ pnew);\n    pnew->next = NULL;\n    if (QueueIsEmpty(pq))\n        pq->front =\
  \ pnew;           /* item 到队头部 */\n    else\n        pq->rear->next = pnew;    \
  \  /* 在队列末尾链接 */\n    pq->rear = pnew;               /* 记录结束位置 */\n    pq->items++;\
  \                  /* 队列多了一个元素 */\n    return true;\n}\n\nbool DeQueue(Item * pitem,\
  \ Queue * pq)\n{\n    Node * pt;\n    if (QueueIsEmpty(pq))\n        return false;\n\
  \    CopyToItem(pq->front, pitem);\n    pt = pq->front;\n    pq->front = pq->front->next;\n\
  \    free(pt);\n    pq->items--;\n    if (pq->items == 0)\n        pq->rear = NULL;\n\
  \    return true;\n}\n\n/* 清空队列 */\nvoid EmptyTheQueue(Queue * pq)\n{\n    Item\
  \ dummy;\n    while (!QueueIsEmpty(pq))\n        DeQueue(&dummy, pq);\n}\n/* 本地函数\
  \ */\nstatic void CopyToNode(Item item, Node * pn)\n{\n    pn->item = item;\n}\n\
  static void CopyToItem(Node * pn, Item * pi)\n{\n    *pi = pn->item;\n}\n```\n\n\
  ***\n\n### 测试队列\n\n在将新设计（如队列包）插入关键程序之前，对其进行测试是一个好主意。测试的方法之一是编写一个短程序（有时称为驱动程序），其唯一目的就是测试该包。例如，Listing\
  \ 17.8 使用了一个允许你添加和删除元素的队列。在使用该程序之前，请确保 `queue.h` 中存在以下行：\n\n```c\ntypedef int item;\n\
  ```\n\n同时记住，你必须链接 `queue.c` 和 `use_q.c`。\n\nListing 17.8 `use_q.c` 程序\n\n点击此处查看代码图像\n\
  \n***\n\n```c\n/* use_q.c -- 测试 Queue 接口的驱动程序 */\n/* 使用 queue.c 编译 */\n#include\
  \ <stdio.h>\n#include \"queue.h\" /* 定义 Queue, Item */\nint main(void)\n{\n    Queue\
  \ line;\n    Item temp;\n    char ch;\n    InitializeQueue(&line);\n    puts(\"\
  Testing the Queue. 输入 a 添加一个值，\");\n    puts(\"输入 d 删除一个值，输入 q 退出。\");\n    while\
  \ ((ch = getchar()) != 'q')\n    {\n        if (ch != 'a' && ch != 'd') /* 忽略其他输入\
  \ */\n            continue;\n        if (ch == 'a')\n        {\n            printf(\"\
  Integer to add: \");\n            scanf(\"%d\", &temp);\n            if (!QueueIsFull(&line))\n\
  \            {\n                printf(\"Putting %d into queue\\n\", temp);\n  \
  \              EnQueue(temp,&line);\n            }\n            else\n         \
  \       puts(\"Queue is full!\");\n        }\n        else\n        {\n        \
  \    if (QueueIsEmpty(&line))\n                puts(\"Nothing to delete!\");\n \
  \           else\n            {\n                DeQueue(&temp,&line);\n       \
  \         printf(\"Removing %d from queue\\n\", temp);\n            }\n        }\n\
  \        printf(\"%d items in queue\\n\", QueueItemCount(&line));\n        puts(\"\
  Testing the Queue. 输入 a 添加一个值，\");\n        puts(\"输入 d 删除一个值，输入 q 退出。\");\n   \
  \ }\n    EmptyTheQueue(&line);\n    puts(\"Bye!\");\n    return 0;\n}\n```\n\n这里是一个示例运行。你还应该测试它在队列满时的行为是否正常。\n\
  \n\n\n\n这里有一种方法。让时间以分钟为单位递增。每分钟，检查一次是否有新客户到达。如果客户到达且队列未满，则将客户加入队列。这涉及到在 `Item` 结构体中记录客户的到达时间和客户要求的咨询时长，然后将该项目加入队列。然而，如果队列满了，则拒绝客户。为了方便记账，请记录客户总数和“拒绝人数”（即因为队列满而无法排队的人数）总数。\n\
  \n接下来，处理队列头部。也就是说，如果队列不空且 Sigmund 没有在忙于上一个客户，则从队列头部移除该项目。记得，该项目包含了客户加入队列的时间。通过将此时间与当前时间进行比较，你可以得到客户在队列中停留的分钟数。项目还包含客户要求的咨询分钟数，这决定了\
  \ Sigmund 将在该新客户身上花费多长时间。使用一个变量来跟踪这段等待时间。如果 Sigmund 忙碌，则没有人“出队”。但是，跟踪等待时间的变量应该减\
  \ 1。\n\n核心代码可能如下，每个循环对应一分钟的活动：\n\n点击此处查看代码图像\n\n```c\nfor (cycle = 0; cycle < cyclelimit;\
  \ cycle++)\n{\n    if (newcustomer(min_per_cust))\n    {\n        if (QueueIsFull(&line))\n\
  \            turnaways++;\n        else\n        {\n            customers++;\n \
  \           temp = customertime(cycle);\n            EnQueue(temp, &line);\n   \
  \     }\n    }\n    if (wait_time <= 0 && !QueueIsEmpty(&line))\n    {\n       \
  \ DeQueue (&temp, &line);\n        wait_time = temp.processtime;\n        line_wait\
  \ += cycle - temp.arrive;\n        served++;\n    }\n    if (wait_time > 0)\n  \
  \      wait_time--;\n    sum_line += QueueItemCount(&line);\n}\n```\n\n注意，时间粒度较粗（一分钟），因此每小时的客户人数仅为\
  \ 60 人。\n\n以下是一些变量和函数的含义：\n\n![Image](img/squf.jpg) `min_per_cust` 是客户到达间隔的平均分钟数。\n\
  \n![Image](img/squf.jpg) `newcustomer()` 使用 C 语言的 `rand()` 函数来确定在该分钟内是否有客户出现。\n\n\
