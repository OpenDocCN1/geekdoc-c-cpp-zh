  n) 宠物数量  f) 查找宠物\nq) 退出\nq\n再见。\n\n#### 树的思考\n\n二叉搜索树有一些缺点。例如，二叉搜索树只有在完全填充或 `balanced`（平衡）的状态时才是高效的。假设你正在存储随机输入的单词。树可能会看起来非常茂密，如`图\
  \ 17.12`所示。现在，假设你按字母顺序输入数据。那么每个新节点都会被添加到右侧，树可能会看起来像`图 17.16`。`图 17.12` 中的树被称为 `balanced`（平衡），而\
  \ `图 17.16` 中的树则是 `unbalanced`（不平衡）。搜索这种树的效率并不高于顺序搜索链表。\n\n![图像](img/17fig16.jpg)\n\
  图 17.16 一个糟糕的二叉搜索树。\n\n避免链状树的一种方法是在构建树时更加小心。如果一棵树或子树在某侧变得不平衡，请重新排列节点以恢复更好的平衡。同样，你可能在删除操作后需要重新排列树。俄罗斯数学家\
  \ Adel’son-Vel’skii 和 Landis 开发了一种算法来实现这一点。使用他们方法构建的树被称为 `AVL 树`。由于额外的重构，构建平衡树需要更长时间，但你可以确保获得最大或接近最大的搜索效率。\n\
  \n你可能想要一个允许重复项的二叉搜索树。例如，假设你想通过跟踪每个单词出现的次数来分析某些文本。一种方法是将 `Item` 定义为包含一个单词和一个数字的结构。第一次遇到该单词时，将其添加到树中并将数字设置为\
  \ `1`。下次遇到相同的单词时，程序找到该单词所在的节点并增加数字。修改二叉搜索树以这种方式运行并不困难。\n\n另一种变体，考虑 Nerfville 宠物俱乐部。示例按名称和种类进行排序，因此可以在一个节点存放\
  \ Sam 猫，另一个 Sam 狗，第三个 Sam 山羊。然而，你无法拥有两个名为 Sam 的猫。另一种方法是仅按名称排序树。这将允许只有一个 Sam，无论种类如何，但你随后可以将\
  \ `Item` 定义为结构列表而不是单个结构。第一次遇到 Sally 时，程序将创建一个新节点，创建一个新列表，然后将 Sally 及其种类添加到列表中。下次出现的\
  \ Sally 将重定向同一个节点并添加到列表中。\n\n#### 提示：扩展库\n\n你可能已经得出结论，实现像链表或树这样的 ADT 是一项大量工作，并且有很多出错的机会。扩展库提供了一种替代方案：让别人完成工作和测试。通过学习本章的两个简单示例，你现在能够更好地理解和欣赏此类库。\n\
  \n\n\n\n\n在你熟悉了 C 语言之后，你可能想要研究 C++、Objective C 或 Java。这些`面向对象`的语言都源于 C。C 已经有了数据对象，其复杂度从简单的\
  \ `char` 变量到大型复杂的结构。面向对象的语言将“对象”的概念推得更远。例如，一个对象的属性不仅包括它可以包含什么类型的信息，还包括可以对其执行哪些操作。本章中的\
  \ ADT（抽象数据类型）遵循了这种模式。此外，对象可以继承其他对象的属性。OOP 将模块化推到了比 C 语言更高的抽象层次，并便于大型程序的编写。\n\n你可能想查看参考章节\
  \ I 中的参考文献“扩展阅读”，以寻找可能进一步提升你兴趣的书籍。\n\n### 核心概念\n\n数据类型的特征取决于数据如何结构化和存储，同时也取决于可以进行哪些操作。抽象数据类型（ADT）以抽象的方式规定了表征某种类型的属性和操作。从概念上讲，你可以通过两个步骤将\
  \ ADT 翻译为特定的编程语言。第一步是定义编程接口。在 C 语言中，你可以通过头文件定义类型名称，并提供与允许的操作对应的函数原型。第二步是实现接口。在 C\
  \ 语言中，你可以使用源文件来提供与原型对应的函数定义。\n\n### 总结\n\n列表（list）、队列（queue）和二叉树是计算机编程中常用的 ADT 示例。它们通常使用动态内存分配和链式结构来实现，但有时使用数组来实现它们是更好的选择。\n\
  \n当你使用特定类型（例如队列或树）进行编程时，你应该根据该类型的接口来编写程序。这样，你就可以修改和改进实现，而无需更改使用接口的程序。\n\n### 习习题\n\
