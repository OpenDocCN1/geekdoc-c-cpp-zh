  n')\n            st[i] = '\\0';\n        else // have words[i] == '\\0'\n      \
  \      while (getchar() != '\\n')\n                continue;\n    }\n    return\
  \ ret_val;\n}\n```\n\n以下是一个运行示例：\n点击此处查看代码图片\n\n```\nEnter 5 words beginning with\
  \ q:\nquack\nquadratic\nquisling\nquota\nquagga\nHere are words accepted:\nquack\n\
  quadra\nquisli\nquota\nquagga\n```\n\n函数调用 `strncpy(target, source, n)` 从 `source`\
  \ 复制最多 `n` 个字符或直到空字符（以先到者为准）到 `target`。因此，如果源字符串中的字符数少于 `n`，则复制整个字符串，包括空字符。该函数复制的字符永远不超过\
  \ `n` 个，所以如果如果在字符串结束之前达到了限制，则不会添加空字符。结果是最终产品可能包含也不包含空字符。由于这个原因，程序将 `n` 设置为比目标数组大小小一，然后将数组中的最后一个元素设置为空字符：\n\
  \n```c\nstrncpy(qwords[i], temp, TARGSIZE - 1);\nqwords[i][TARGSIZE - 1] = '\\0';\n\
  ```\n\n这确保了你存储的是一个字符串。如果源字符串确实装得下，随之复制的空字符标记了字符串的真实结束。如果源字符串装得下，这个最后的空字符则标记了字符串的结束。\n\
  \n### `sprintf()` 函数\n\n`sprintf()` 函数声明在 `stdio.h` 中而不是 `string.h` 中。它的工作原理类似于\
  \ `printf()`，但它是写入一个字符串而不是写入显示器。因此，它提供了一种将多个元素组合成单个字符串的方法。`sprintf()` 的第一个参数是目标字符串的地址。其余参数与\
  \ `printf()` 相同——一个转换字符串，后面跟着一个要写入的项目列表。\n\n列表 11.28 使用 `sprintf()` 将三个项目（两个字符串和一个数字）组合成单个字符串。注意，它使用\
  \ `sprintf()` 的方式与使用 `printf()` 相同，只是生成的字符串存储在数组 `formal` 中而不是显示在屏幕上。\n\n列表 11.28\
  \ `format.c` 程序\n\n点击此处查看代码图片\n\n```c\n/* format.c -- format a string */\n#include\
  \ <stdio.h>\n#define MAX 20\nchar * s_gets(char * st, int n);\n\nint main(void)\n\
  {\n    char first[MAX];\n    char last[MAX];\n    char formal[MAX*2];\n    double\
  \ prize;\n\n    printf(\"Enter your first name:\");\n    s_gets(first, MAX);\n \
  \   printf(\"Enter your last name:\");\n    s_gets(last, MAX);\n    printf(\"Enter\
  \ your prize:\");\n    scanf(\"%lf\", &prize);\n    sprintf(formal, \"%s %s $%.2f\"\
  , first, last, prize);\n    puts(formal);\n    return 0;\n}\n\nchar * s_gets(char\
  \ * st, int n)\n{\n    char * ret_val;\n    int i = 0;\n    ret_val = fgets(st,\
  \ n, stdin);\n    if (ret_val)\n    {\n        while (st[i] != '\\n' && st[i] !=\
  \ '\\0')\n            i++;\n        if (st[i] == '\\n')\n            st[i] = '\\\
  0';\n        else // have words[i] == '\\0'\n            while (getchar() != '\\\
  n')\n                continue;\n    }\n    return ret_val;\n}\n```\n\n这是一个运行示例：\n\
  ```\nEnter your first name:\nAnnie\nEnter your last name:\nWurstk\nEnter your prize:\n\
  50\nAnnie Wurstk $50.00\n```\n\n`sprintf()` 命令将输入格式化并将其存储在其中。\n\n### 其他字符串函数\n\n\
  ANSI C 库有超过 20 个处理字符串的函数，以下列表总结了一些常用的：\n\n\n\n\n\n该函数的工作类似于 `strcmp()`，不同之处在于比较在处理\
  \ `n` 个字符后或遇到第一个空字符时就会停止，以先到者为准。\n\n![Image](img/squf.jpg)\n```\nchar *strchr(const\
  \ char * s, int c);\n```\n\n该函数返回字符串 `s` 中第一个包含字符 `c` 的位置的指针。（终止空字符是字符串的一部分，因此可以对其进行搜索。）如果未找到该字符，函数返回空指针。\n\
  \n![Image](img/squf.jpg)\n```\nchar *strpbrk(const char * s1, const char * s2);\n\
  ```\n\n该函数返回字符串 `s1` 中第一个包含 `s2` 字符串中任一字符的位置的指针。如果没有找到任何字符，函数返回空指针。\n\n![Image](img/squf.jpg)\n\
  ```\nchar *strrchr(const char * s, int c);\n```\n\n该函数返回字符串 `s` 中字符 `c` 最后一次出现位置的指针。（终止空字符是字符串的一部分，因此可以对其进行搜索。）如果未找到该字符，函数返回空指针。\n\
  \n![Image](img/squf.jpg)\n```\nchar *strstr(const char * s1, const char * s2);\n\
  ```\n\n该函数返回字符串 `s1` 中字符串 `s2` 第一次出现位置的指针。如果未找到字符串，函数返回空指针。\n\n![Image](img/squf.jpg)\n\
  ```\nsize_t strlen(const char * s);\n```\n\n该函数返回字符串 `s` 中找到的字符个数，不包括终止空字符。\n\n\
  注意，这些原型声明使用了 `const` 关键字来指示哪些字符串不会被函数修改。例如，考虑以下内容：\n\n点击此处查看代码图像\n\n```\nchar *strcpy(char\
  \ * restrict s1, const char * restrict s2);\n```\n\n这意味着 `s2` 指向一个不能被更改的字符串，至少不能被\
  \ `strcpy()` 函数更改，但 `s1` 指向的是一个可以更改的字符串。这是合逻辑的，因为 `s1` 是目标字符串，会被修改，而 `s2` 是源字符串，应该保持不变。\n\
  \n第 12 章中讨论的 `restrict` 关键字表示对函数参数的使用限制，例如，不要将字符串拷贝到自身。\n\n`size_t` 类型如第 5 章中讨论的，“运算符、表达式和语句”，是\
  \ `sizeof` 运算符返回的任何类型。C 语言规定 `sizeof` 运算符返回一个整数类型，但没有指定是哪种整数类型，因此 `size_t` 在一个系统上可能是\
  \ `unsigned int`，在另一个系统上可能是 `unsigned long`。`string.h` 文件为特定系统定义了 `size_t`，否则引用另一个包含定义的头文件。\n\
  \n如前所述，附录 V 列出了 `string.h` 族中的所有函数。许多实现提供了 ANSI 标准之外的额外函数。你应该检查你所实现实现的文档以查看哪些可用函数。\n\
  \n让我们来看这些函数之一的一个简单用法。之前我们看到 `fgets()` 在读取一行输入时，会将换行符存储在目标字符串中。我们的 `s_gets()` 函数使用\
  \ `while` 循环来检测该换行符，但我们可以改用 `strchr()`。首先，使用 `strchr()` 换行符（如果有）。如果函数找到了换行符，它会返回换行符的地址，然后你就可以在该地址放置一个空字符：\n\
  \n点击此处查看代码图像\n\n```\nchar line[80];\nchar * find;\nfgets(line, 80, stdin);\nfind\
  \ = strchr(line, '\\n');   // 寻找换行符\nif (find)                   // 如果地址不是 NULL\n\
  \    *find = '\\0';            // 在那里放置一个空字符\n```\n\n如果 `strchr()` 未找到换行符，说明 `fgets()`\
  \ 在到达行尾之前遇到了大小限制。你可以像我们在 `s_gets()` 中做的那样在 `if` 中添加一个 `else` 来处理那种情况。\n\n接下来，让我们来看一个处理字符串的完整程序。\n\
  \n### 字符串示例：字符串排序\n\n让我们来解决按字母顺序排序字符串的实际问题。这个任务可能出现在准备列表、制作索引以及许多其他情况中。此类程序中的主要工具之一是\
  \ `strcmp()`，因为它可以用来确定两个字符串的顺序。通用计划是读取一个字符串数组，对其进行排序，然后打印它们。之前我们展示了一种读取字符串的方案，我们将以这种方式开始程序。打印字符串没有问题。我们将使用一种稍后会解释的标准排序算法。我们还会做一件稍微棘手的事情；看看你是否能发现它。列表\
  \ 11.29 展示了该程序。\n\n列表 11.29 sort_str.c\n点击此处查看代码图像\n\n```c\n* sort_str.c -- 读取并排序字符串\n\
  #include <stdio.h>\n#include <string.h>\n#define SIZE 8      // 包括 \\0 在内\n#define\
  \ LIM 20      // 最大行数\n#define HALT \"\"     // 停止字符串\nvoid stsrt(char *strings[],\
  \ int num); // 排序函数\nchar * s_gets(char * st, int n);    // 读取字符串\nint main(void)\n\
  {\n    char input[LIM][SIZE]; // 输入数组\n    char *ptstr[LIM];      // 指针数组\n    int\
  \ ct = 0;            // 输入计数\n    int k;                 // 输出计数\n    printf(\"\
  Input %d lines, and I will sort them.\\n\",LIM);\n    printf(\"To stop, press the\
  \ Enter key at line's start.\\n\");\n    while (ct < LIM && s_gets(input[ct], SIZE)\
  \ != NULL\n      && input[ct][0] != '\\0')\n    {\n        ptstr[ct] = input[ct];\
  \ // 设置指针指向字符串\n        ct++;\n    }\n    stsrt(ptstr, ct);      // 排序\n    puts(\"\
  \\nHere's the sorted list:\\n\");\n    for (k = 0; k < ct; k++)\n        puts(ptstr[k]);\
  \      // 输出排序后的指针\n    return 0;\n}\n// 排序函数\nvoid stsrt(char *strings[], int num)\n\
  {\n    char *temp;\n    int top, seek;\n    for (top = 0; top < num-1; top++)\n\
  \        for (seek = top + 1; seek < num; seek++)\n            if (strcmp(strings[top],strings[seek])\
  \ > 0)\n            {\n                temp = strings[top];\n                strings[top]\
  \ = strings[seek];\n                strings[seek] = temp;\n            }\n}\nchar\
  \ * s_gets(char * st, int n)\n{\n    char * ret_val;\n    int i = 0;\n    ret_val\
  \ = fgets(st, n, stdin);\n    if (ret_val)\n    {\n        while (st[i] != '\\n'\
  \ && st[i] != '\\0')\n        {\n            i++;\n        }\n        if (st[i]\
  \ == '\\n')\n        {\n            st[i] = '\\0';\n        }\n        else // 必须\
  \ words[i] == '\\0'\n        {\n            while (getchar() != '\\n')\n       \
  \         continue;\n        }\n    }\n    return ret_val;\n}\n```\n\n* * *\n\n\
  我们向 列表 11.29 喂了一首冷门的童歌来测试它：\n\n点击此处查看代码图像\n\n```\nInput up to 20 lines, and I will\
  \ sort them.\nTo stop, press the Enter key at line's start.\nO that I was where\
  \ I would be,\nThen would I be where I am not;\nBut where I am I must be,\nAnd where\
  \ I would be I can not.\n\nHere's the sorted list:\nAnd where I would be I can not.\n\
  But where I am I must be,\nO that I was where I would be,\nThen would I be where\
  \ I am not;\n```\n\n嗯，这首童歌按字母排序似乎没有太大影响。\n\n#### 排序指针而不是字符串\n\n\n\n\n\n程序的巧妙之处在于，我们并没有重新排列字符串本身，而是重新排列了指向字符串的`pointers`。让我们来看看这意味着什么。最初，`ptrst[0]`\
  \ 被赋值为 `input[0]`，依此类推。这意味着指针 `ptrst[i]` 指向数组 `input[i]` 中的第一个字符。每个 `input[i]` 都是包含\
  \ 81 个元素的数组，而每个 `ptrst[i]` 都是一个变量。排序过程重新排列了 `ptrst`，而保持 `input`不变。例如，如果 `input[1]`\
  \ 在字母顺序上于 `input[0]` 之前，程序会交换 `ptrsts`，导致 `ptrst[0]` 指向 `input[1]` 的开头，导致 `ptrst[1]`\
  \ 指向 `input[0]` 的开头。这比使用 `strcpy()` 来交换两个 `input` 字符串的内容要容易得多。请参见图 11.6 获取该过程的另一种视图。它具有保留\
  \ `input` 数组原始顺序的优势。\n\n![Image](img/11fig06.jpg)\n\n图 11.6 排序字符串指针。\n\n## 选择排序算法\n\
  \n为了对指针排序，我们使用 `selection sort`（选择排序）算法。其思想是使用 `for` 循环将每个元素与第一个元素进行比较。如果被比较元素在当前第一个元素之前，程序就会交换两者。当程序到达循环末尾时，第一个元素包含一个指向机器排序序列中排在前面的字符串指针。然后，外层\
  \ `for` 循环重复该过程，这次从 `input` 的第二个元素开始。当内层循环完成后，指向第二大字符串的指针最终位于 `ptrst` 的第二个元素中。该过程一直持续，直到所有元素都排序完毕。\n\
  \n现在让我们更详细地查看选择排序。这里有一个伪代码概述：\n\n点击此处查看代码图像\n\n```\nfor n = first to n = next-to-last\
  \ element,\n    find largest remaining number and place it in the nth element\n\
  ```\n\n该方案的工作原理如下：首先，从 `n = 0` 开始。扫描整个数组，找到最大的数，并将其与第一个元素交换。接下来，设置 `n = 1`，然后扫描数组中第一个元素以外的所有元素。找到剩余最大的数并将其与第二个元素交换。继续这个过程直到到达倒数第二个元素。现在只剩下两个元素。比较它们，并将较大的放在倒数第二个位置。这使得所有元素中最小的留在最后一个位置。\n\
  \n这看起来像是一个 `for` 循环任务，但我们仍然需要更详细地描述“查找并放置”的过程。选择剩余最大值的一种方法是比较剩余数组的第一个和第二个元素。如果第二个更大，则交换这两个值。现在比较第一个元素和第三个元素。如果第三个更大，则交换这两个。每次交换都会将一个较大的元素移动到顶部。继续这种方式，直到你将第一个元素与最后一个元素比较完毕。完成后，最大值现在就在剩余数组的第一个元素中。你已经完成了第一个元素的排序，但数组的其余部分是乱序的。以下是伪代码形式的过程：\n\
  \n点击此处查看代码图像\n\n```\nfor n - second element to last element,\n  compare nth element\
  \ with first element; if nth is greater, swap values\n```\n\n这个过程看起来像另一个 `for` 循环。它将嵌套在第一个\
  \ `for` 循环中。外层循环指示要填充哪个数组元素，而内层循环找到要放在那里的值。将伪代码的两部分结合并翻译成 C 代码，我们得到了列表 11.29 中的函数。顺便提一下，C\
  \ 标准库包含一个更高级的排序函数 `qsort()`。除其他特性外，它还使用函数指针来进行排序比较。第 16 章“C 预处理器和 C 标准库”提供了其用法的示例。\n\
  \n## ctype.h 字符函数与字符串\n\n第 7 章 “C 控制语句：分支与跳转”引入了 `ctype.h` 族与字符相关的函数。这些函数不能应用于整个字符串，但它们可以应用于字符串中的单个字符。例如，列表\
  \ 11.30 定义了一个对字符串中的每个字符应用 `toupper()` 函数的函数，从而将整个字符串转换为大写。它定义了一个使用 `ispunct()` 统计字符串中标点符号数量的函数。最后，程序使用之前描述的\
  \ `strchr()` 来处理 `fgets()` 读取的字符串中的换行符（如果有）。\n\n列表 11.30 mod_str.c 程序\n\n点击此处查看代码图像\n\
  \n* * *\n\n```c\n/* mod_str.c -- 修改字符串 */\n\n#include <stdio.h>\n#include <string.h>\n\
  #include <ctype.h>\n\n#define LIMIT 81\n\nvoid ToUpper(char *);\nint PunctCount(const\
  \ char *);\n\nint main(void)\n{\n    char line[LIMIT];\n    char *find;\n\n    puts(\"\
  Please enter a line:\");\n    fgets(line, LIMIT, stdin);\n    find = strchr(line,\
  \ '\\n'); // 寻找换行符\n    if (find)\n        find = '\\0'; // 在此处放置空字符\n\n    ToUpper(line);\n\
  \    puts(line);\n    printf(\"That line has %d punctuation characters.\\n\", PunctCount(line));\n\
  \    return 0;\n}\n\nvoid ToUpper(char * str)\n{\n    while (*str)\n    {\n    \
  \    *str = toupper(*str);\n        str++;\n    }\n}\n\nint PunctCount(const char\
  \ * str)\n{\n    int ct = 0;\n    while (*str)\n    {\n        if (ispunct(*str))\n\
  \            ct++;\n        str++;\n    }\n    return ct;\n}\n```\n\n* * *\n\n`while\
  \ (*str)` 循环处理 `str` 指向字符串中的每个字符，直到遇到空字符。此时，`*str` 变为 0（空字符的代码）或假，循环终止。这是一个示例运行：\n\
  \n点击此处查看代码图像\n\n```\nPlease enter a line:\nMe? talkin' to me? Get outta here!\n\
  ME? TALKIN' TO ME? GET OUTTA HERE!\nThat line has 4 punctuation characters.\n```\n\
  \n按照 ANSI C 定义，`toupper()` 函数只修改小写字符。然而，非常旧的 C 实现并不进行该检查，因此旧代码通常会这样做：\n\n```c\n\
  if (islower(*str))\n    *str = toupper(*str);\n```\n\n顺便提一下，`ctype.h` 函数通常实现为*宏*。这些是像函数的\
  \ C 预处理器构造，但它们有一些重要的区别。我们将在第 16 章介绍宏。\n\n## 命令行参数\n\n在现代图形界面之前，存在命令行界面。DOS 和 Unix\
  \ 都是示例，Linux 终端提供了类 Unix 的命令行环境。*命令行*是你在命令行环境中运行程序时输入的行。假设你有一个名为 `fuss` 的程序文件。那么在\
  \ Unix 中运行它的程序的命令行可能像这样：\n\n$ fuss\n\n或者在 Windows 的命令提示符模式下可能像这样：\n\nC:\\> fuss\n\
  \n\n\n\n\nC> fuss\n\n`命令行参数`是同一行上的额外项目。示例如下：\n\n```\n$ fuss -r Ginger\n```\n\nC\
  \ 程序可以读取这些额外项目并供自身使用（参见图 11.7）。\n\n![Image](img/11fig07.jpg)\n\n图 11.7 命令行参数。\n\n\
  C 程序通过传递给 `main()` 的参数来读取这些项目。列表 11.31 显示了一个典型的示例。\n\n列表 11.31  repeat.c 程序\n\n\
  点击此处查看代码图像\n\n* *\n\n```c\n/* repeat.c -- main() with arguments */\n\n#include <stdio.h>\n\
  \nint main(int argc, char *argv[])\n{\n    int count;\n    printf(\"The command\
  \ line has %d arguments:\\n\", argc - 1);\n    for (count = 1; count < argc; count++)\n\
  \        printf(\"%d: %s\\n\", count, argv[count]);\n    printf(\"\\n\");\n    return\
  \ 0;\n}\n```\n\n* *\n\n将此程序编译为名为 `repeat` 的可执行文件。当你从命令行运行它时，会发生以下情况：\n\n点击此处查看代码图像\n\
  \n```\nC>repeat Resistance is futile\n```\n\n命令行有 3 个参数：\n\n1: Resistance\n2: is\n\
  3: futile\n\n你可以看出为什么它命名为 `repeat`，但你可能好奇它是如何工作的。我们现在来解释一下。\n\nC 编译器允许 `main()`\
  \ 没有参数，或者有两个参数。（某些实现允许额外的参数，但那是对标准的扩展。）在两个参数的情况下，第一个参数是命令行中字符串的数量。按照传统（但并非必须），这个\
  \ `int` 参数被称为 `argc`，代表 *argument count*（参数计数）。系统使用空格来标示一个字符串何时结束，另一个字符串何时开始。因此，`repeat`\
  \ 示例有四个字符串（包括命令名称），而 `fuss` 示例有三个。程序将命令行字符串存储在内存中，并将每个字符串的地址存储在指针数组中。该数组的地址存储在第二个参数中。按照习惯，这种指向指针的指针被称为\
  \ `argv`，代表 *argument values*（参数值）。在可能的情况下（某些操作系统不允许），`argv[0]` 被赋值为程序本身。然后 `argv[1]`\
  \ 被赋值为随后的第一个字符串，依此类推。对于我们的示例，我们有以下关系：\n\n`argv[0]` 指向 `repeat`（对于大多数系统）\n`argv[1]`\
  \ 指向 `Resistance`\n`argv[2]` 指向 `is`\n`argv[3]` 指向 `futile`\n\n列表 11.31 中的程序使用 `for`\
  \ 循环逐个打印字符串。记得 `printf()` 的 `%s` 格式说明符期望提供字符串地址作为参数。每个元素——`argv[0]`、`argv[1]` 等——正是这样一个地址。\n\
  \n这种形式与任何具有形式参数的函数相同。许多程序员为 `argv` 使用了不同的声明：\n\n点击此处查看代码图像\n\n```c\nint main(int\
  \ argc, char **argv)\n```\n\n这种 `argv` 的替代声明确实等同于 `char *argv[]`。它表示 `argv` 是一个指向\
  \ `char` 指针的指针。示例的意思相同。它有一个包含七元素的数组。数组名是指向第一个元素的指针，因此 `argv` 指向 `argv[0]`，而 `argv[0]`\
  \ 是指向 `char` 的指针。因此，即使使用原始定义，`argv` 也是一个指向 `char` 指针的指针。你可以使用任何形式，但我们认为第一种更清楚地表明\
  \ `argv` 代表一组字符串。\n\n顺便提一下，包括 Unix 和 DOS 在内的许多环境允许使用引号将多个单词合并为单个参数。例如，命令\n\n```\n\
  repeat \"I am hungry\" now\n```\n\n这会将字符串 `\"I am hungry\"` 赋值给 `argv[1]`，将字符串 `\"\
  now\"` 赋值给 `argv[2]`。\n\n#### 集成环境中的命令行参数\n\n集成化 Windows 环境（如 Apple 的 Xcode、Microsoft\
  \ Visual C++ 和 Embarcadero C++ Builder）不使用命令行运行程序。然而，某些环境具有项目对话框，允许你为特定项目指定命令行参数。在其他情况下，你可能可以在\
  \ IDE 中编译程序，然后打开 MS-DOS 窗口以命令行模式运行程序。但如果你的系统有运行如 `GCC` 等命令行编译器的选项，操作会更简单。\n\n####\
  \ Macintosh 命令行参数\n\n如果你正在使用 Xcode 4.6（或类似版本），可以通过进入 Products 菜单并选择 Scheme、Edit\
  \ Scheme、Run 来提供命令行参数。然后选择 Arguments 标签页并在 Arguments on Launch 中输入参数。\n\n或者你可以进入\
  \ Mac 的终端模式并使用 `gcc`。\n\n### 字符串转数字\n\n数字可以存储为字符串。`atoi()` 函数将字符串转换为数字。它接收一个字符串并返回一个整数值。列表\
  \ 11.32 显示了一个示例用法。\n\n列表 11.32 hello.c 程序\n\n点击此处查看代码图像\n\n* *\n\n```c\n/* hello.c\
  \ -- command-line argument to number */\n#include <stdio.h>\n#include <stdlib.h>\n\
  \nint main(int argc, char *argv[])\n{\n    int i, times;\n    if (argc < 2 || (times\
  \ = atoi(argv[1])) < 1)\n        printf(\"Usage: %s positive-number\\n\", argv[0]);\n\
  \    else\n        for (i = 0; i < times; i++)\n            puts(\"Hello, good looking!\"\
  );\n    return 0;\n}\n```\n\n* *\n\n这里是一个运行示例：\n\n```\n$ hello 3\nHello, good looking!\n\
  Hello, good looking!\nHello, good looking!\n```\n\n`$` 是 Unix 和 Linux 的提示符。（某些 Unix\
  \ 系统使用 `%`。）命令行参数 `3` 被存储为字符串 `\"3\"`。`atoi()` 函数将此字符串转换为整数值 `3`，并赋值给 `times`。这决定了\
  \ `for` 循环执行的次数。\n\n如果你在没有命令行参数的情况下运行程序，`argc < 2` 测试将终止程序并打印用法信息。如果 `times` 为 0\
  \ 或负数，也会发生相同的情况。如果字符串仅开头是整数，`atoi()` 函数仍然有效。在这种情况下，它会转换字符直到遇到不是整数部分的内容。例如，`atoi(\"\
  42regular\")` 返回整数 `42`。\n\n\n\n\n我们包含了 `stdlib.h` 头文件，因为自 ANSI C 以来，它就包含了 `atoi()`\
  \ 的函数声明。该头文件还包含了 `atof()` 和 `atol()` 的声明。`atof()` 函数将字符串转换为 `double` 类型的值，而 `atol()`\
  \ 函数将字符串转换为 `long` 类型的值。它们的工作方式与 `atoi()` 类似，因此它们分别对应 `double` 和 `long` 类型。\n\n\
  ANSI C 提供了这些函数的更复杂的版本：`strtol()` 将字符串转换为 `long`，`strtoul()` 将字符串转换为 `unsigned long`（无符号长整），而\
  \ `strtod()` 将字符串转换为 `double`。更复杂之处在于，这些函数能够识别并报告字符串中第一个不是数字数字的字符。此外，`strtol()`\
  \ 和 `strtoul()` 允许你指定数字进制。\n\n让我们来看一个涉及 `strtol()` 的示例。它的原型定义如下：\n\n点击此处查看代码图像\n\
  \n```c\nlong strtol(const char * restrict nptr, char ** restrict endptr, int base);\n\
  ```\n\n这里，`nptr` 是指向你想转换的字符串的指针，`endptr` 是一个指针的地址，该指针将被设置为终止输入数字的字符地址，而 `base` 是数字所使用的进制。列表\
  \ 11.33 中的示例使得这一点更加清晰。\n\n### 列表 11.33 strcnvt.c 程序\n\n点击此处查看代码图像\n\n```c\n/* strcnvt.c\
  \ -- try strtol()  */\n\n#include <stdio.h>\n#include <stdlib.h>\n\n#define LIM\
  \ 30\n\nchar * s_gets(char * st, int n);\n\nint main()\n{\n    char number[LIM];\n\
  \    char * end;\n    long value;\n    puts(\"Enter a number (empty line to quit):\"\
  );\n    while(s_gets(number, LIM) && number[0] != '\\0')\n    {\n        value =\
  \ strtol(number, &end, 10);  /* base 10 */\n        printf(\"base 10 input, base\
  \ 10 output: %ld, stopped at %s (%d)\\n\",\n               value, end, *end);\n\
  \        value = strtol(number, &end, 16);  /* base 16 */\n        printf(\"base\
  \ 16 input, base 10 output: %ld, stopped at %s (%d)\\n\",\n               value,\
  \ end, *end);\n        puts(\"Next number:\");\n    }\n    puts(\"Bye!\\n\");\n\
  \    return 0;\n}\n\nchar * s_gets(char * st, int n)\n{\n    char * ret_val;\n \
  \   int i = 0;\n    ret_val = fgets(st, n, stdin);\n    if (ret_val)\n    {\n  \
  \      while (st[i] != '\\n' && st[i] != '\\0')\n            i++;\n        if (st[i]\
  \ == '\\n')\n            st[i] = '\\0';\n        else // must have words[i] == '\\\
  0'\n            while (getchar() != '\\n')\n                continue;\n    }\n \
  \   return ret_val;\n}\n```\n\n这里是一些示例输出：\n\n点击此处查看代码图像\n\n```text\nEnter a number\
  \ (empty line to quit):\n10\nbase 10 input, base 10 output: 10, stopped at  (0)\n\
  base 16 input, base 10 output: 16, stopped at  (0)\nNext number:\n10\nbase 10 input,\
  \ base 10 output: 10, stopped at atom (97)\nbase 16 input, base 10 output: 266,\
  \ stopped at tom (116)\nNext number:\nBye!\n```\n\n首先，请注意当 `base` 为 `16` 时，字符串 `\"\
  10\"` 被转换为数字 `10`。同样注意，如果 `end` 指向一个字符，则第一次转换在遇到空字符时结束，因此 `end` 指向空字符。打印 `end` 会显示一个空字符串，而用\
  \ `%d` 打印 `end` 则会显示空字符的 ASCII 码。\n\n对于第二个输入（进制 `10`），`end` 被赋予 `'a'` 字符的地址。因此，打印\
  \ `end` 显示字符串 `\"atom\"`，打印 `end` 显示 `'a'` 字符的 ASCII 码。当 `base` 变为 `16` 时，`'a'`\
  \ 字符被识别为有效数字，函数将十六进制 `10` 转换为 `26`。`strtol()` 函数支持最高 36 进制，使用从 `'a'` 到 `'z'` 的字母作为数字。`strtoul()`\
  \ 函数的功能相同，但转换的是无符号值。`strtod()` 函数仅支持 10 进制，因此它使用两个参数。许多实现提供了 `itoa()` 和 `ftoa()`\
  \ 函数将整数和浮点值转换为字符串。然而，它们并不是标准库的一部分；请使用 `sprintf()` 以获得更好的兼容性。\n\n### 核心概念\n\n许多程序处理文本数据。程序可能会要求你输入信息。我们包含了\
  \ `stdlib.h` 头文件，因为自 ANSI C 以来，它就包含了 `atoi()` 的函数声明。该头文件还包含了 `atof()` 和 `atol()`\
  \ 的声明。\n\n`atof()` 函数将字符串转换为 `double` 类型的值，而 `atol()` 函数将字符串转换为 `long` 类型的值。它们的工作方式与\
  \ `atoi()` 类似，因此它们分别对应 `double` 和 `long` 类型。\n\nANSI C 提供了这些函数的更复杂的版本：`strtol()`\
  \ 将字符串转换为 `long`，`strtoul()` 将字符串转换为 `unsigned long`（无符号长）。复杂之处在于，这些函数能够识别并报告字符串中第一个不是数字的字符。此外，`strtol()`\
  \ 和 `strtoul()` 允许你指定数字进制。\n\n让我们来看一个涉及 `strtol()` 的示例。它的原型定义如下：\n\n点击此处查看代码图像\n\
