  \ 2013.\n\n这本书由 C++ 的创造者编写，介绍了介绍了 C++11 标准。\n\n## 第二节：C 运算符\n\nC 拥有丰富的运算符。表 RS.II.1\
  \ 按优先级从高到低列出了 C 运算符，并指示了它们如何结合。除非另有说明，所有运算符都是二元的（两个操作数）。注意，某些二元和单元运算符例如 `*`（乘法）和\
  \ `*`（间接引用）共享相同的符号但优先级不同。表格之后是每个运算符的摘要。\n\n![Image](img/rs11tab01.jpg)\n\n表 RS.II.1\
  \ C 运算符\n\n### 算术运算符\n\n`+` 将右侧的值加到左侧的值上。\n\n`+` 作为一元运算符，产生一个与右侧操作数数值相等（且符号相同）的值。\n\
  \n`–` 从左侧的值中减去右侧的值。\n\n`–` 作为一元运算符，产生一个与右侧操作数数值相等（但符号相反）的值。\n\n`*` 将右侧的值乘以左侧的值。\n\
  \n`/` 将左侧的值除以右侧的值。如果两个操作数都是整数，结果将被截断。\n\n`%` 产生左侧的值除以右侧的值的余数（仅限整数）。\n\n`++` 将右侧变量的值加\
  \ 1（前缀模式），或将左侧变量的值加 1（后置模式）。\n\n`--` 类似于 `++`，但减去 1。\n\n### 关系运算符\n\n以下每个运算符都比较左侧的值与右侧的值：\n\
  \n![Image](img/910tab01.jpg)\n\n#### 关系表达式\n\n一个简单的关系表达式由一个关系运算符和两侧各的操作数组成。如果关系为真，关系表达式的值为\
  \ `1`。如果关系为假，关系表达式的值为 `0`。这里有两个示例：\n\n`5 > 2` 是真的，值为 `1`。\n\n`(2 + a) == a` 是假的，值为\
  \ `0`。\n\n### 赋值运算符\n\nC 有一个基础赋值运算符和若干几个复合赋值运算符。`=` 运算符是基本形式：\n\n`=` 将右侧的值分配给左侧的左值（lvalue）。\n\
  \n每个赋值运算符都使用指定的操作，通过右侧的值更新左侧的左值（我们使用 R–H 表示右侧，L–H 表示左侧）：\n\n`+=` 将 R–H 量加到 L–H 变量，并将结果放在\
  \ L–H 变量中。\n\n`-=` 从 L–H 变量中减去 R–H 量，并将结果放在 L–H 变量中。\n\n`*=` 将 L–H 变量乘以 R–H 量，并将结果放在\
  \ L–H 变量中。\n\n`/=` 将 L–H 变量除以 R–H 量，并将结果放在 L–H 变量中。\n\n`%=` 给出 L–H 除以 R–H 的余数，并将结果放在\
  \ L–H 变量中。\n\n`&=` 分配 L–H `&` R–H 并将结果放在 L–H 变量中。\n\n`|=` 分配 L–H `|` R–H 并将结果放在\
  \ L–H 变量中。\n\n`^=` 分配 L–H `^` R–H 并将结果放在 L–H 变量中。\n\n`>>=` 分配 L–H `>>` R–H 并将结果放在\
  \ L–H 变量中。\n\n`<<=` 分配 L–H `<<` R–H 并将结果放在 L–H 变量中。\n\n##### 示例\n\n`rabbits *= 1.6;`\
  \ 等同于 `rabbits = 1.6;`。\n\n### 逻辑运算符\n\n逻辑运算符通常以关系表达式作为操作数。`!` 运算符接受一个操作数。其余的接受两个：左一个和一个右。\n\
  \n`&&` ⠠⠠与（AND）\n\n`||` ⠠⠠或（OR）\n\n`!` ⠠⠠非（NOT）\n\n#### 逻辑表达式\n\n`expression1 &&\
  \ expression2` 仅当两个表达式都为真时为真。\n\n`expression1 || expression2` 当任意一个或两个表达式为真时为真。\n\
  \n`!expression` 当表达式为假时为真。\n\n##### 求值顺序\n\n逻辑表达式从左到右求值。一旦发现使表达式为假的因素，就会停止。\n\n\
  ##### 示例\n\n`6 > 2 && 3 == 3` 是真的。\n\n`! ( 6 > 2 && 3 == 3 )` 是假的。\n\n`x != 0 &&\
  \ 20/x < 5.` 只有当 `x` 不为零时才计算第二个表达式。\n\n### 条件运算符\n\n`? :` 接受三个操作数，每个操作数都是表达式。排列如下：\n\
  \nexpression1 ? expression2 : expression3\n\n如果 expression1 为真，整个表达式的值等于 expression2\
  \ 的值，否则等于 expression3 的值。\n\n##### 示例\n\n`( 5 > 3 ) ? 1 : 2` 的值为 `1`。\n\n`( 3 >\
  \ 5 ) ? 1 : 2` 的值为 `2`。\n\n`( a > b ) ? a : b` 的值为 `a` 或 `b` 中较大的值。\n\n### 指针运算符\n\
  \n`&` 是地址运算符。跟随变量名时，`&` 给出该变量的地址。\n\n\n\n\n\n`*` 是间接引用或解引用运算符。当后面跟着一个指针时，`*` 返回存储在所指向地址的值。\n\
  \n### 示例\n\n在这里，`&nurse` 是变量 `nurse` 的地址：\n\n点击此处查看代码图片\n\n```c\nnurse = 22;\nptr\
  \ = &nurse; /* 指向 nurse 的指针 */\nval = *ptr;\n```\n\n结果是将值 `22` 赋值给 `val`。\n\n###\
  \ 符号运算符\n\n`–` 是负号，用于反转操作数的符号。\n\n`+` 是加号，保持操作数的符号不变。\n\n### 结构体和联合运算符\n\n结构体（structure）和联合（union）使用运算符来标识单个成员。成员运算符用于结构体和联合，间接成员运算符用于指向结构体或联合的指针。\n\
  \n#### 成员运算符\n\n成员运算符（`.）用于结构体或联合名，以指定该结构体或联合的成员。如果 `name` 是结构体的名称，`member` 是由结构模板指定的成员，则\
  \ `name.member` 标识该结构中的该成员。`name.member` 的类型是为 `member` 指定类型。成员运算符也可以以相同的方式用于联合。\n\
  \n#### 示例\n\n```c\nstruct {\n    int code;\n    float cost;\n} item;\n\nitem.code\
  \ = 1265;\n```\n\n该语句为结构体 `item` 的 `code` 成员赋值。\n\n#### 间接成员运算符（或结构体指针运算符）\n\n间接成员运算符（–>）用于指向结构体或联合的指针，以标识该结构体或联合的成员。假设\
  \ `ptrstr` 是指向结构体的指针，`member` 是由结构模板指定的成员。那么 `ptrstr->member` 标识所指向结构体的该成员。间接成员运算符也可以以相同的方式用于联合。\n\
  \n#### 示例\n\n```c\nstruct {\n    int code;\n    float cost;\n} item, * ptrst;\n\n\
  ptrst = &item;\nptrst->code = 3451;\n```\n\n这段程序片段为 `item` 的 `code` 成员赋值。以下三个表达式是等价的：\n\
  \n点击此处查看代码图片\n\n```c\nptrst->code  item.code  (*ptrst).code\n```\n\n### 位运算运算符\n\
  \n除 `~` 之外，以下所有位运算符均为二元运算符：\n\n`~` 是一元运算符，产生一个与操作数每个位都取反的值。\n\n`&` 是按位与（AND），只有当两个操作数的对应位都为\
  \ 1 时，产生的结果中该位才为 1。\n\n`|` 是按位或（OR），当两个操作数的对应位中有一个或两个都为 1 时，产生的结果中该位即为 1。\n\n`^`\
  \ 是按位异或（EXCLUSIVE OR），只有当两个操作数的对应位中仅有一个（而非两者都）为 1 时，产生的结果中该位才为 1。\n\n`<<` 是左移，通过将左操作数的位向左移动右操作数指定的位数得到一个值。空出的用\
  \ 0 填充。\n\n`>>` 是右移，通过将左操作数的位向右移动右操作数指定的位数得到一个值。对于无符号整数，空出的位用 0 填充。有符号值的行为取决于实现。\n\
  \n#### 示例\n\n假设你有以下内容：\n\n```c\nint x = 2;\nint y = 3;\n```\n\n那么 `x & y` 的值为 `2`，因为只有\
  \ `x` 和 `y` 的位 1 是“开启”的。此外，`y<<x` 的值为 `12`，因为这是将 `3` 的位模式向左移动两位后得到的值。\n\n### 杂运算符\n\
  \n`sizeof` 产生其右侧操作数的大小，以 `char` 值的大小为单位。通常，一个 `char` 值的大小为 1 字节。操作数可以是括号中的类型说明符，例如\
  \ `sizeof (float)`，也可以是特定变量、数组等的内容名称，例如 `sizeof foo`。`sizeof` 表达式的类型为 `size_t`。\n\
  \n`_Alignof` (C11) 产生其操作数指定类型的对齐要求。某些系统要求特定类型存储在某个特定值（如 4）的倍数地址上。这个整数就是对齐要求。\n\n\
  `(type)` 是强制类型转换运算符，将跟随其后的值转换为括号内关键字指定的类型。例如，`(float) 9` 将整数 `9` 转换为浮点数 `9.0`。\n\
  \n`,` 是逗号运算符；它将两个表达式连接成一个，并保证先求值左侧表达式。整个表达式的值是右表达式的值。该运算符通常用于在 `for` 循环控制表达式包含更多信息。\n\
  \n#### 示例\n\n点击此处查看代码图片\n\n```c\nfor (...)\n```\n\n#### 第三部分：基本类型与存储类\n\n#### 总结：基本类型\n\
  \n基本类型分为两类：整数和浮点数。\n\n#### 关键字\n\n基本类型包括：整数和浮点数。\n\n#### 有符号整数\n\n有符号整数可以有正或负值：`int`\
  \ 是系统的基本整数。`long` 至少 32 位，`short` 至少 16 位，取决于系统。\n\n#### 无符号整数\n\n无符号整数只有零或正值，这扩展了最大可能数字的范围。在所需的类型前使用关键字\
  \ `unsigned`：`unsigned int`、`unsigned long`、`unsigned short` 或 `unsigned long long`。\n\
  \n#### 字符\n\n字符是如 `A`、`&` 和 `+` 等排版符号。根据定义，`char` 使用一个字节内存。在过去，8 位是 `char` 最典型的大小。然而，C\
  \ 处理更大字符集的能力可能会导致 16 位甚至 32 位的字节。\n\n#### 布尔类型 (C99)\n\nC99 布尔类型为 `_Bool`。它是一种无符号整数类型，可以保存两个值之一：`0`\
  \ 表示假，`1` 表示真。包含 `stdbool.h` 头文件允许你使用 `bool` 代替 `_Bool`，用 `true` 代替 `1`，用 `false`\
  \ 代替 `0`，使代码与 C++ 兼容。\n\n#### 实与复浮点类型\n\nC99 识别了两个浮点类型领域：实浮点和复浮点。这两个领域共同构成了浮点类型。\n\
  \n实浮点数可以有正或负值。C 识别了三种实浮点类型：\n\n`float` 是系统的基本浮点类型。它可以精确表示至少六个有效数字。通常，`float` 使用\
  \ 32 位。\n\n`double` 是用于保存浮点数的（可能的）更大的单元。相比 `float`，它允许更多的有效数字和可能更大的指数。它可以精确表示至少\
  \ 10 个有效数字。通常，`double` 使用 64 位。\n\n\n\n\n\n`long double` 是一个（可能更大的）用于存储浮点数的单位。它可能比\
  \ `double` 允许更多的有效数字，并且可能有更大的指数。\n\n复数包含两个部分：实部和虚部。C99 内部用一个双元素数组来表示复数，第一个分量是实部，第二个分量是虚部。共有复数类型：\n\
  \n`float _Complex` 用类型 `float` 值表示实部和虚部。\n\n`double _Complex` 用类型 `double` 值表示实部和虚部。\n\
  \n`long double _Complex` 用类型 `long double` 值表示实部和虚部。\n\n在每种情况下，前缀类型被称为*对应实部类型*。例如，`double`\
  \ 是 `double _Complex` 的对应实部类型。\n\n在 C99 中，复数类型在自机（freestanding）环境（即 C 程序可以在没有操作系统的情况下运行）中是可选的。在\
  \ C11 中，它们在自机环境和托管（hosted）环境中均为可选的。\n\n还有三种虚数类型；这些类型在自机环境和托管环境（即 C 程序在操作系统下运行的环境）中均为可选的。虚数只有一个虚部。这三种类型列如下：\n\
  \n`float _Imaginary` 用类型 `float` 值表示虚部。\n\n`double _Imaginary` 用类型 `double` 值表示虚部。\n\
  \n`long double _Imaginary` 用类型 `long double` 值表示虚部。\n\n复数可以使用实数和值 `I` 进行初始化，`I`\
  \ 定义在 `complex.h` 中，代表 `i`，即 -1 的平方根：\n\n点击此处查看代码图像\n\n```\n#include <complex.h>\
  \  // 用于 I\n\ndouble _Complex z = 3.0;           // 实部 = 3.0, 虚部 = 0\ndouble _Complex\
  \ w = 4.0 * I;      // 实部 = 0.0, 虚部 = 4.0\ndouble Complex u = 6.0 – 8.0 * I; //\
  \ 实部 = 6.0, 虚部 = -8.0\n```\n\n本附录后部分讨论的 `complex.h` 库包含了返回复数实部和虚部分函数。\n\n## 总结：如何声明简单变量\n\
  \n1. 选择你需要的类型。\n2. 为变量选择一个名称。\n3. 使用此格式进行声明语句：\n   `type-specifierviable-name;`\n\
  \n类型说明符（type-specifier）由一个或多个类型关键字组成。以下是一些示例：\n\n```\nint erest;\nunsigned short\
  \ cash;\n```\n\n4. 若要声明多个同类型的变量，请用逗号分隔变量名：\n```\nchar ch, init, ans;\n```\n\n5.\
  \ 你可以在声明语句中初始化变量：\n\n```\nfloat mass = 6.0E24;\n```\n\n***\n\n## 总结：存储类\n\n**关键字：**\
  \ \n`auto`, `extern`, `static`, `register`, `_Thread_local` (C11)\n\n**通用注释：**\n\
  变量的存储类决定了它的作用域（scope）、链接（linkage）和存储生存期。存储类取决于变量定义的位置以及与其相关的关键字。定义在所有函数之外的变量是外部变量，具有文件作用域、外部链接和静态存储生存期。在函数内部定义的变量是自动的，除非使用了其他关键字之一。它们具有块作用域、无链接和自动存储生存期。在函数内部使用\
  \ `static` 关键字定义的变量具有块作用域、无链接和静态存储生存期。在函数外部使用 `static` 关键字定义的变量具有文件作用域、内部链接和静态存储生存期。\n\
  \nC11 添加了一个新的存储类限定符：`_Thread_local`。用此限定符声明的对象具有线程存储生存期，意味着它在声明它的线程的整个生命周期内持续存在，并在线程开始时初始化。因此，此类对象对于线程是局部的。\n\
  \n**属性：**\n以下总结了存储类的属性：\n\n![图像](img/918tab01.jpg)\n\n注意，关键字 `extern` 仅用于重新声明在其他地方外部定义过的变量。在函数外定义变量的行为使其成为外部变量。\n\
  \n***\n\n除了这些存储类外，C 还提供了分配的内存。这种内存通过调用 `malloc()` 系列函数中的一个来分配，该函数返回一个可以用于访问内存的指针。内存一直保持分配状态，直到调用\
  \ `free()` 或程序终止。对内存的访问可以从任何能够访问该内存指针的函数进行。例如，一个函数可以将指针值返回另一个函数，然后该函数就可以访问内存。\n\n\
  ## 总结：限定符\n\n### 关键字\n使用以下关键字来限定变量：\n`const`, `volatile`, `restrict`\n\n### 通用注释\n\
  限定符以某种方式限制变量的使用。`const` 变量在初始化后不能被更改。编译器不能假设 `volatile` 变量没有被某些外部机构（如硬件更新）更改过。被限定为\
  \ `restrict` 的指针被被理解为（在特定作用域内）提供了某块内存的唯一访问。\n\n### 属性\n声明语句：\n```\nconst int joy\
  \ = 101;\n```\n确认为 `joy` 的值固定为 `101`。\n\n声明语句：\n点击此处查看代码图像\n```\nvolatile int incoming;\n\
  ```\n建立了 `incoming` 的值可能会改变。\n\n声明：\n```\nint * const ptr = &joy;\n```\n确认为 `ptr`\
  \ 不能更改其指向的内容；但它可以指向另一个位置。\n\n声明：\n点击此处查看代码图像\n```\nvoid simple (const * s);\n```\n\
  在 `s` 初始化后，`simple()` 不更改其指向的值。\n\n原型：\n```\nvoid supple(int * const pi);\n```\n\
  以及等效原型：\n```\nvoid supple(int pi[const]);\n```\n建立了函数 `supple()` 不更改参数 `pi`。\n\n\
  原型：\n点击此处查看代码图像\n```\nvoid interleave(int * restrict p1, int * restrict p2, int\
  \ n);\n```\n表明 `p1` 和 `p2` 分别是其指向的内存块的唯一访问；这意味着这两个内存块之间没有重叠。\n\n# 第四节：表达式、语句和流程\n\
  \n在 C 语言中，表达式表示值，语句表示指令。\n\n### 表达式\n*表达式*是操作符和操作数的组合。简单的表达式只是不带操作符的常量或变量，例如 `22`\
  \ 或 `beebop`。更复杂的示例有 `55 + 22` 和 `vap = 2 * (vip + (vup = 4))`。\n\n### 语句\n*语句*是计算机的命令。任何跟随分号的表达式都构成一个语句，但不一定是有意义的。语句可以是简单的，也可以是复合的。*简单语句*以分号结束，如示例所示：\n\
  \n![图像](img/920tab02.jpg)\n\n（技术上，标准将声明单独分为一类，而不是将它们与语句一起分组。）\n\n*复合语句*或*块（block）由在大括号内的一个或多个语句（语句本身可以是复合的）组成。以下\
  \ `while` 语句是一个示例：\n\n```\nwhile (years < 100)\n{\n    wisdom = wisdom + 1;\n  \
  \  printf(\"%d %d\\n\", years, wisdom);\n    years = years + 1;\n}\n```\n\n## 总结：while\
  \ 语句\n### 关键字\n`while`\n\n\n\n\n\n`while` 语句的关键字是 `while`。\n\n### 通用注释\n`while`\
  \ 语句创建一个循环，该循环会重复直到测试表达式变为假或零。`while` 语句是一种**入口条件**（entry-condition）循环；是否再执行一次循环的决定是在循环遍历**之前**做出的。因此，循环可能永远不会被执行。该形式的语句部分可以是简单语句，也可以是复合语句。\n\
  \n### 格式\n```\nwhile (expression)\n    statement\n```\n语句部分会重复执行，直到 `expression`\
  \ 变为假或零。\n\n### 示例\n点击此处查看代码图像\n\n```c\nwhile (n++ < 100)\n    printf(\" %d %d\\\
  n\",n, 2*n+1);\n\nwhile (fargo < 1000)\n{\n    fargo = fargo + step;\n    step =\
  \ 2 * step;\n}\n```\n\n### 总结：for 语句\n\n#### 关键字\n`for` 语句的关键字是 `for`。\n\n#### 通用注释\n\
  `for` 语句使用三个用分号分隔的控制表达式来控制循环过程。初始化表达式在执行任何循环语句之前执行一次。如果测试表达式为真（或非零），则循环执行一次。然后求值更新表达式，此时该再次检查测试表达式了。`for`\
  \ 语句是一种**入口条件**循环；是否再执行一次循环的决定是在循环遍历**之前**做出的。因此，循环可能永远不会被执行。该格式的语句部分可以是简单语句，也可以是复合语句。\n\
  \n#### 格式\n点击此处查看代码图像\n\n```c\nfor (initialize ; test ; update)\n    statement\n\
  ```\n循环重复执行，直到 `test` 变为假或零。\nC99 允许初始化部分包含一个声明。变量的作用域和生存周期被限于 `for` 循环。\n\n####\
  \ 示例\n点击此处查看代码图像\n\n```c\nfor (n = 0;  n < 10 ; ++n)\n    printf(\"%d %d\\n\", n,\
  \ 2 * n+1);\n\nfor (int k = 0;  k < 10 ; ++k)             // C99\n    printf(\"\
  %d %d\\n\", k, 2 * k+1);\n```\n\n### 总结：do while 语句\n\n#### 关键字\n`do while` 语句的关键字是\
  \ `do` 和 `while`。\n\n#### 通用注释\n`do while` 语句创建一个循环，该循环会重复直到测试表达式变为假或零。`do while`\
  \ 语句是一种**出口条件**（exit-condition）循环；是否再执行一次循环的决定是在循环遍历**之后**做出的。因此，循环至少执行一次。该格式的语句部分可以是简单语句，也可以是复合语句。\n\
  \n#### 格式\n```c\ndo\n    statement\nwhile (expression);\n```\n语句部分重复执行，直到 `expression`\
  \ 变为假或零。\n\n#### 示例\n```c\ndo\n    scanf(\"%d\", &number)\nwhile(number != 20);\n\
  ```\n\n### 总结：使用 if 语句进行选择\n\n#### 关键字\n`if` 语句的关键字是 `if` 和 `else`。\n\n#### 通用注释\n\
  在以下每种形式中，语句可以是简单语句，也可以是复合语句。“真”表达式，更通俗地说，是指具有非零值的表达式。\n\n#### 格式 1\n```c\nif (expression)\n\
  \    statement\n```\n如果 `expression` 为真，则执行语句。\n\n#### 格式 2\n```c\nif (expression)\n\
  \    statement1\nelse\n    statement2\n```\n如果 `expression` 为真，则执行 `statement1`。否则，执行\
  \ `statement2`。\n\n#### 格式 3\n```c\nif (expression1)\n    statement1\nelse if (expression2)\n\
  \    statement2\nelse\n    statement3\n```\n如果 `expression1` 为真，则执行 `statement1`。如果\
  \ `expression1` 为假但 `expression2` 为真，则执行 `statement2`。否则，如果两个表达式都为假，则执行 `statement3`。\n\
  \n#### 示例\n点击此处查看代码图像\n\n```c\nif (legs == 4)\n    printf(\"It might be a horse.\\\
  n\");\nelse if (legs > 4)\n    printf(\"It is not a horse.\\n\");\nelse  /* case\
  \ of legs < 4 */\n{\n    legs++;\n    printf(\"Now it has one more leg.\\n\");\n\
  }\n```\n\n### 总结：使用 switch 进行多重选择\n\n#### 关键字\n`switch` 语句的关键字是 `switch`。\n\n####\
  \ 通用注释\n程序控制跳转到带有 `expression` 值的标签所在的语句。程序流继续执行剩余的语句，除非再次重定向。表达式和标签都必须具有整数值（包括\
  \ `char` 类型），且标签必须是常量或仅由常量组成的表达式。如果没有标签匹配表达式的值，控制将跳转到 `default` 标签。\n\n#### 格式\n\
  点击此处查看代码图像\n```c\nswitch (expression)\n{\n    case label1: statement1\n    case\
  \ label2: statement2\n    default: statement3\n}\n```\n`switch` 语句允许根据常量值进行多重分支。\n\
  \n#### 示例\n点击此处查看代码图像\n\n```c\nswitch (variable)\n{\n    case 'a:\n        printf(\"\
  A\\n\");\n        break;\n    case 'b:\n        printf(\"B\\n\");\n        break;\n\
  \    default:\n        printf(\"Other\\n\");\n}\n```\n\n\n\n\nANSI C 库将函数分为若干组，每组都有一个相关的头文件。本附录向您提供了该库的概览，列出了头文件并简要描述了它们相关的函数。其中某些函数（例如，几个\
  \ I/O 函数）在正文中有更详细的讨论。更来说，若要完整的描述，请查阅您实现版本的文档、参考手册，或者尝试在线参考资源，例如：[`www.acm.uiuc.edu/webmonkeys/book/c_guide/`](http://www.acm.uiuc.edu/webmonkeys/book/c_guide/)\n\
  \n## 诊断：assert.h\n\n此头文件将 `assert()` 定义为一个宏。在包含头文件 `assert.h` 之前定义宏标识 `NDEBUG` 可以禁用\
  \ `assert()` 宏。用作参数使用的表达式通常是一个关系表达式或逻辑表达式，如果程序运行正常，则该表达式在程序的该点上应该为真。Table RS.V.1\
  \ 描述了 `assert()` 宏。\n\n![Image](img/rs-vtab01.jpg)\n\n表 RS.V.1 诊断宏\n\nC11 添加了 `static_assert`\
  \ 宏，它展开为 `_Static_assert`。而 `_Static_assert` 本身是一个被视为声明的形式的。它提供了一种编译时检查，使用方法如下：\n\
  \n点击此处查看代码图像\n\n```\n_Static_assert (constant-expression, string-literal);\n```\n\
  \n如果常量表达式的值为零，编译器将发出一条包含该字符串字面量的错误消息。否则，没有影响。\n\n## 复数：complex.h (C99)\n\nC99 标准为复数计算提供了广泛支持，而\
  \ C11 扩展了这种支持。实现版本可以选择在提供 `_Complex` 类型外，再提供一个 `_Imaginary` 类型。在 C11 下，两者都是可选的。C99\
  \ 使 `_Complex` 成为强制性，而 `_Imaginary` 是可选的。本附录的 Section VIII 进一步讨论了复数支持。该头文件定义了 Table\
  \ RS.V.2 中列出的以下宏。\n\n![Image](img/rs-vtab02.jpg)\n\n表 RS.V.2 complex.h 宏\n\n由 `complex.h`\
  \ 头文件支持的 C 语言复数实现与由 `complex` 头文件支持的 C++ 实现非常不同。C++ 使用类来定义复数类型。\n\n可以使用 `STDC CX_LIMITED_RANGE`\
  \ 伪指令来指示是否可以使用常规数学公式（on 设置），或者是否对极值需要特殊注意（off 设置）：\n\n点击此处查看代码图像\n\n```\n#include\
  \ <complex.h>\n\n#pragma STDC CX_LIMITED_RANGE on\n```\n\n库函数有三种类型：`double`、`float`\
  \ 和 `long double`。Table RS.V.3 列出了 `double` 版本。`float` 和 `long double` 版本分别在函数名末尾附加\
  \ `f` 和 `l`。因此，`csinf()` 是 `csin()` 的 `float` 版本，而 `csinl()` 是 `long double` 版本。\n\
  \n![Image](img/rs-vtab03.jpg)![Image](img/rs-vtab03a.jpg)\n\n表 RS.V.3 复数函数\n\n角度以弧度测量。\n\
  \n## 字符处理：ctype.h\n\n这些函数接受 `int` 参数，这些参数能够表示为 `unsigned char` 值或 `EOF`；提供其他值的影响是未定义的。在\
  \ Table RS.V.4 中，“true”用作“非零值”的简写。某些定义的解释取决于当前的区域设置，该设置由 `locale.h` 中的函数控制；表格显示了“C”区域的解释。\n\
  \n![Image](img/rs-vtab04.jpg)\n\n表 RS.V.4 字符处理函数\n\n## 错误报告：errno.h\n\n`errno.h`\
  \ 头文件支持一种旧的错误报告机制。该机制提供了一个外部静态内存位置，可以通过标识符（或可能是宏）`ERRNO` 来访问。某些库函数会在该位置放置一个值以报告错误。包含此头文件的程序可以检查\
  \ `ERRNO` 的值来查看是否报告了特定错误。`ERRNO` 机制被认为落后于时代，且数学函数不再需要设置 `ERRNO` 值。标准提供了三个表示特定错误的宏值，但实现版本可以提供更多。Table\
  \ RS.V.5 列出了标准宏。\n\n![Image](img/rs-vtab05.jpg)\n\n表 RS.V.5 errno.h 宏\n\n## 浮点环境：fenv.h\
  \ (C99)\n\nC99 标准通过 `fenv.h` 头文件提供了对浮点环境的访问和控制。\n\n浮点环境由一组状态标志和控制模式组成。浮点计算期间的异常情况（例如除零）会引发异常。这意味着\
  \ `fenv.h` 头文件定义了控制模式，例如舍入方向。该头文件还提供了启用或禁用环境的伪指令：\n\n```\n#pragma STDC FENV_ACCESS\
  \ on\n```\n\n```\n#pragma STDC FENV_ACCESS off\n```\n\n该伪指令在另一个伪指令出现之前、直到文件结束（外部）或复合语句结束（块）为止有效。该头文件定义了\
  \ [Table RS.V.6] 中的两种类型。\n\n![Image](img/rs-vtab06.jpg)\n\n表 RS.V.6 fenv.h 类型\n\n\
  头文件定义了表示可能的浮点异常的宏。实现可以定义额外的宏，只要它们以 `FE_` 开头并跟一个大写字母。Table RS.V.7 显示了标准宏。\n\n![Image](img/rs-vtab07.jpg)\n\
  \n表 RS.V.7 fenv.h 类型\n\nTable RS.V.8 显示了 `fenv.h` 头文件中的标准函数原型。注意参数值和返回值通常对应 [Table\
