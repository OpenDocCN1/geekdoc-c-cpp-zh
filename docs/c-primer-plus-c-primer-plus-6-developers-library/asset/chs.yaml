  \ `int` 数组或 `float` 数组。使用七个不同的数组来跟踪所有内容可能会变得复杂，特别是当 Gwen 想要生成几个完整的列表时——一个按标题排序，一个按作者排序，一个按价值排序，等等。更好的解决方案是使用一个数组，其中每个成员都包含关于某本书书的所有信息。\n\
  \n那么，Gwen 需要一种既能包含字符串又包含数字，并以某种方式将信息隔离开的数据类型。`C` 结构体满足了这一需求。为了了解结构体是如何设置以及如何运行的，我们将从一个有限的示例开始。为了简化问题，我们将设定两个限制条件：首先，我们只包含标题、作者和当前市场价值。其次，我们将清单限制为本书。不过，不要担心这个限制，因为我们很快就会扩展程序。\n\
  \n请看列表 14.1 中的程序及其输出。然后阅读对要点的解释。\n\n#### 列表 14.1 `book.c` 程序\n\n点击此处查看代码图像\n\n```c\n\
  //* book.c -- 单本书库存清单 */\n\n#include <stdio.h>\n\n#include <string.h>\n\nchar *\
  \ s_gets(char * st, int n);\n\n#define MAXTITL  41      /* 标题最大长度 + 1          \
  \ */\n#define MAXAUTL  31      /* 作者名最大长度 + 1 */\nstruct book {               /*\
  \ 结构体模板：标签为 book  \n    char title[MAXTITL];\n    char author[MAXAUTL];\n    float\
  \ value;\n};                         /* 结构体模板结束  */\n\nint main(void)\n{\n    struct\
  \ book library; /* 将 library 声明为一个 book 变量  */\n    printf(\"Please enter the book\
  \ title.\\n\");\n    s_gets(library.title, MAXTITL); /* 访问标题部分            */\n \
  \   printf(\"Now enter the author.\\n\");\n    s_gets(library.author, MAXAUTL);\n\
  \    printf(\"Now enter the value.\\n\");\n    scanf(\"%f\", &library.value);\n\
  \    printf(\"%s by %s: $%.2f\\n\",library.title,\n              library.author,\
  \ library.value);\n    printf(\"%s: \\\"%s\\\" ($%.2f)\\n\", library.author,\n \
  \             library.title, library.value);\n    printf(\"Done.\\n\");\n    return\
  \ 0;\n}\n\nchar * s_gets(char * st, int n)\n{\n    char * ret_val;\n    char * find;\n\
  \    ret_val = fgets(st, n, stdin);\n    if (ret_val)\n    {\n        find = strchr(st,\
  \ '\\n');   // 寻找换行符\n        if (find)               // 如果地址不是 NULL，\n        \
  \    *find = '\\0';          // 在那里放置一个空字符\n        else\n            while (getchar()\
  \ != '\\n')\n                continue;       // 丢弃剩余行\n    return ret_val;\n}\n\
  ```\n\n与之前的章节一样，我们使用 `s_gets()` 来去掉 `fgets()` 通常存储在字符串中的换行符。这里是一个示例运行：\n\n点击此处查看代码图像\n\
