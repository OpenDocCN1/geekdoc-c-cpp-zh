  \ 分钟。此外，拒绝人数也从 0 增加到 3，再到 94。西格蒙德可以使用这种分析来决定他是否需要第二个咨询台。\n\n## 链表与数组\n\n许多编程问题（例如创建列表或队列）都可以用链表——我们指动态分配结构的链式序列——或数组来处理。每种形式都有其优缺点，因此选择哪种取决于问题的具体需求。表\
  \ 17.1 总结了链表和数组的特性。\n\n![Image](img/17tab01.jpg)\n\n表 17.1 数组与链表的比较\n\n仔细观察插入和删除元素的过程。要在数组中插入元素，你必须移动元素为新元素腾出空间，如图\
  \ 17.9 所示。新元素的位置越靠前，移动的元素就越多。然而，在链表中插入节点，你只需要给两个指针赋值，如图 17.10 所示。同样，从数组中删除元素涉及元素的整体重定位，但从链表中删除节点涉及重置指针并释放被删除节点使用的内存。\n\
  \n![Image](img/17fig09.jpg)\n\n图 17.9 向数组中插入元素。\n\n![Image](img/17fig10.jpg)\n\n\
  图 17.10 向链表中插入元素。\n\n接下来，考虑如何访问列表的成员。使用数组时，你可以使用数组索引立即访问任何元素。这被称为`random access`（随机访问）。使用链表时，你必须从列表开始，从一个节点移动到下一个节点直到找到所需的节点，这被称为`sequential\
  \ access`（顺序访问）。数组也可以进行顺序访问，只需每次将数组索引递一，即可顺序遍历数组。对于某些情况，顺序访问就足够了。例如，如果你想显示列表中的每一项，顺序访问就可以了。其他情况则极大倾向于`random\
  \ access`。假设你想在列表中搜索特定项目。一种算法是从列表开始并对其进行搜索，称为`sequential search`（顺序搜索）。如果项目没有按某种顺序排列，你必须查看列表中的每一个项目才能得出该项目不存在的结论。（并发编程在此方面可以有所帮助。）\n\
  \n你可以通过先对列表进行排序来改进顺序搜索。对于有序列表，你可以通过`binary search`（二分查找）方法获得比顺序搜索好得多的结果。其工作原理如下：首先，调用你想要查找的目标列表项，并假设列表按字母顺序排列。接下来，选取列表中间的项并与`target`进行比较。如果两者相同，搜索结束。如果该项在字母上于`target`，那么如果`target`在列表中，一定在后半部分。如果该项在字母上于`target`，则`target`在前半部分。无论何种情况，比较都排除了一部分列表作为搜索区域。接下来，再次应用该方法，即在剩余列表的一半中间选择一个项。按这种方式进行，直到找到项目或排除了整个列表（参见图\
  \ 17.11）。这种方法非常高效。例如，假设列表有 127 项。顺序搜索平均需要 64 次比较才能找到项目或排除其存在。另一方面，二分查找法最多只需要 7 次比较。第一次比较将可能的项减少到\
  \ 63 个，第二次比较将可能的项减少到 31 个，以此类推，直到第六次比较将可能性减少到 1。第七次比较将确定剩下的唯一选择是否为`target`。通常，`n`次比较可以处理具有`2^n−1`个成员的数组，因此列表越长，二分查找相对于顺序搜索的优势就越大。\n\
  \n![Image](img/17fig11.jpg)\n\n图 17.11 对 Susan 的二分查找。\n\n\n\n\n使用数组实现二分查找非常简单，因为你可以使用数组索引来确定任何列表或列表子区域的中点。将子区域起始元素和结束元素的下标相加并除以\
  \ 2 即可。例如，在一个包含 100 个元素的列表中，第一个索引为 0，最后一个索引为 99，初始猜测的值为 `(0 + 99) / 2`，即 49（整数除法）。如果索引为\
  \ 49 的元素在字母表中太靠后，那么正确的选择必须在 0–48 范围范围内，因此下一次猜测为 `(0 + 48) / 2`，即 24。如果元素 24 在字母表中太靠前，下一次猜测将为\
  \ `(25 + 48) / 2`，即 36。这正是数组的随机访问特性大显身场的地方。它允许你直接从一个位置跳转到另一个位置，而无需访问之间的每一个位置。链表仅支持顺序访问，没有提供跳转到列表中间点的方法，因此你无法对链表使用二分查找技术。\n\
  \n可见，数据类型的选择取决于问题。如果情况需要一个频繁插入和删除以不断调整大小、但不经常搜索的列表，那么链表是更好的选择。如果情况需要一个仅偶尔插入和删除但必须频繁搜索的稳定列表，那么数组是更好的选择。\n\
  \n如果你需要一种既支持频繁插入删除又支持频繁搜索的数据结构呢？链表和数组对于这一系列目的都不是理想的。另一种形式——二分查找树——可能正是你需要的。\n\n\
  ## 二分查找树\n\n二分查找树是一种结合了二分查找策略的链结构。树中的每个节点都包含一个项目和两个指向其他节点的指针，称为子节点。图 17.12 显示了二分查找树中的节点是如何链接的。其思想是每个节点有两个子节点——一个左节点和一个右节点。这种顺序性源于：左节点中的项目排在父节点项目之前，而右节点中的项目排在父节点项目之后。这种关系适用于每一个拥有子节点的节点。此外，所有可以追溯到父节点左节点的项目，其在顺序上都位于父节点项目之前；而每个源自右节点的项目，其在顺序上都位于父节点项目之后。图\
  \ 17.12 中的树以这种方式存储单词。树的顶部在植物学中是一个有趣的反转，被称为根。树是一种层次化结构，意味着数据按等级（或层级）组织，每一级通常上方和下方都有层级。如果一个二分查找树是完全填充的，每一层的节点数都是其上方层的两倍。\n\
  \n![Image](img/17fig12.jpg)\n\n图 17.12 存储单词的二分查找树。\n\n二分查找树中的每个节点本身就是其下方所有节点的根，使得该节点及其后代构成子树。例如，在图\
  \ 17.12 中，包含 *fate*、*carpet* 和 *llama* 单词的节点形成了整个树的左子树，而单词 *voyage* 是 *style*-*plenum*-*voyage*\
  \ 子树的右子树。\n\n假设你想在这样的树中找到一个项目——称之为目标。如果该项目排在根节点项目之前，你只需要搜索树的左半部分；如果目标在根节点项目之后，你只需要搜索根节点的右子树。因此，一次比较就能排除掉一半的树。假设你搜索左半部分，这意味着将目标与左子节点中的项目进行比较。如果目标在左子节点项目之前，你只需要搜索其后代中的左半部分，依此类推。与二分查找一样，每次比较都会将潜在匹配项的数量减少一半。\n\
  \n让我们应用这种方法来看看单词 *puppy* 是否在图 17.12 所示的树中。通过通过将 *puppy* 与 *melon*（根节点项目）进行比较，你会发现\
  \ *puppy* 如果存在，则一定在树的右半部分。因此，你进入右孩子并将 *puppy* 与 *style* 比较。在这种情况下，*puppy* 排在节点项目之前，所以你必须顺着链接到左节点。在那里你找到了\
  \ *plenum*，它在 *puppy* 之前。你现在必须遵循该节点的右分支，但它是空的，所以三次比较就告诉你 *puppy* 不在树中。\n\n因此，二分查找树将链结构与二分查找的效率结合了起来。编程上的代价是构建一棵树比创建一个链表更复杂。让我们为下一个也是最后一个\
  \ ADT 项目创建一个二叉树吧。\n\n### 二叉树 ADT\n\n如 usual 一样，我们首先从通用术语上定义二叉树。这个特定定义假设树不包含重复项目。许多操作与列表操作相同。区别在于数据的层次化安排。以下是该\
  \ ADT 的非正式总结：\n\n![Image](img/829tab01.jpg)\n\n### 搜索树接口\n\n在原理上，你可以通过多种方式实现二分查找树。你甚至可以用数组来实现。但实现二分查找树最直接的方法是使用链接的动态分配节点，因此我们从这些开始：\n\
  \n```c\ntypedef struct {\n    char petname[20];\n    char petkind[20];\n} Item;\n\
  \ntypedef struct trnode {\n    Item item;\n    struct trnode * left;\n    struct\
  \ trnode * right;\n} trnode;\n\ntypedef struct tree {\n    trnode * root;\n    int\
  \ size;\n} Tree;\n```\n\n每个节点包含一个项目、一个指向左节点的指针和一个指向右节点的指针。你可以将 `Tree` 定义为指向 `trnode`\
  \ 的指针，因为只需要根即可访问整棵树。然而，使用带有 `size` 成员的结构可以更容易跟踪大小。我们将开发的示例是 Nerville Club，每个成员由一个名称和一个种类。基于此，我们可以设置如下接口：\n\
  \n\n\n\n```c\nbool TreeIsFull(const Tree * ptree);\n\n/* 操作：确定树中元素的数量 */\n/* 前提：ptree\
  \ 指向一棵树 */\n/* 后置：函数返回树中元素的数量 */\n\nint TreeItemCount(const Tree * ptree);\n\n/*\
  \ 操作：向树中添加项 */\n/* 前提：pi 是要添加项的地址 */\n/* ptree 指向一个已初始化的树 */\n/* 后置：如果可能，函数将项添加到树中并返回\
  \ true；否则函数返回 false */\n\nbool AddItem(const Item * pi, Tree * ptree);\n\n/* 操作：在树中查找项\
  \ */\n/* 前提：pi 指向一个项 */\n/* ptree 指向一个已初始化的树 */\n/* 后置：如果项在树中则返回 true，否则返回 false\
  \ */\n\nbool InTree(const Item * pi, const Tree * ptree);\n\n/* 操作：从树中删除项 */\n/*\
  \ 前提：pi 是要删除项的地址 */\n/* ptree 指向一个已初始化的树 */\n/* 后置：如果可能，函数从树中删除项并返回 true；否则函数返回\
  \ false */\n\nbool DeleteItem(const Item * pi, Tree * ptree);\n\n/* 操作：对树中的每个项应用函数\
  \ */\n/* 前提：ptree 指向一棵树 */\n/* pfun 指向一个接受 Item 参数且没有返回值的函数 */\n/* 后置：pfun 指向的函数会为树中的每个项执行一次\
  \ */\nvoid Traverse (const Tree * ptree, void (* pfun)(Item));\n\n/* 操作：从树中删除所有内容\
  \ */\n/* 前提：ptree 指向一个已初始化的树 */\n/* 后置：树变为空 */\nvoid DeleteAll(Tree * ptree);\n\
  ```\n\n## 二叉树实现\n\n接下来，开始实现 `tree.h` 中概述的函数。`InitializeTree()`、`EmptyTree()` 和 `TreeItems()`\
  \ 函数是简单的，工作原理与列表和队列抽象数据类型（ADT）的对应函数类似；我们将关注剩余的函数。\n\n### 添加项\n\n在向树中添加项时，你应该首先检查树是否有空间容纳新节点。然后，由于二叉树的定义是不包含重复项的，你应该检查该项是否已经存在于树中。如果新项通过了这两个障碍，你就可以创建一个新节点，将项拷贝到节点中，并将节点的左右指针设置为\
  \ `NULL`。这表示该节点没有子节点。然后，你应该更新 `Tree` 结构体的 `size` 成员，以标记新项的添加。接下来，你必须找到节点在树中应该所在的位置。如果树是空的，你应该将根指针指向新节点。否则，遍历树以找到可以添加节点的位置。`AddItem()`\
  \ 函数遵循这一配方，将部分工作交给了尚待定义的函数：`SeekItem()`、`MakeNode()` 和 `AddNode()`。\n\n点击此处查看代码\n\
  \n```c\nbool AddItem(const Item * pi, Tree * ptree)\n{\n  node * new_node;\n  if\
  \ (TreeIsFull(ptree))\n{\n    fprintf(stderr,\"Tree is full\\n\");\n    return false;\
  \ /* 提前返回 */\n  }\n  if (SeekItem(pi, ptree).child != NULL)\n{\n    fprintf(stderr,\
  \ \"Attempted to add duplicate item\\n\");\n    return false; /* 提前返回 */\n  }\n\
  \  new_node = MakeNode(pi); /* 指向新节点 */\n  if (new_node == NULL)\n{\n    fprintf(stderr,\
  \ \"Couldn't create node\\n\");\n    return false; /* 提前返回 */\n  }\n/* 成功创建新节点 */\n\
  \  ptree->size++;\n  if (ptree->root == NULL) /* 情况 1：树为空 */\n    ptree->root =\
  \ new_node; /* 新节点成为树根 */\n  else /* 情况 2：不为空 */\n    AddNode(new_node, ptree->root);\
  \ /* 添加节点 */\n  return true;\n}\n```\n\n`SeekItem()`、`MakeNode()` 和 `AddNode()`\
  \ 函数不是公共接口的一部分。它们隐藏在 `tree.c` 文件中。`MakeNode()` 函数非常简单；它处理节点的动态分配和初始化。参数是指向项的指针，返回值是指向新节点的指针。\n\
  \n点击此处查看代码\n\n```c\nstatic Trnode * MakeNode(const Item * pi)\n{\n  Trnode * new_node;\n\
  \  new_node = (Trnode *) malloc(sizeof(Trnode));\n  if (new_node != NULL)\n  {\n\
  \    new_node->item = *pi;\n    new_node->left = NULL;\n    new_node->right = NULL;\n\
  \  }\n  return new_node;\n}\n```\n\n`AddNode()` 函数是二叉树中第二个困难的函数。它必须确定新节点的位置，然后将其添加。特别是，它需要将新项与根进行比较，以判断项是进入左子树还是右子树。如果项是数字，可以使用\
  \ `<` 和 `>`。如果项是字符串，可以使用 `strcmp()`。但项是一个结构体，因此你必须为比较定义自己的函数。稍后定义的 `ToLeft()` 函数在新项应该在左子树中时返回\
  \ `True`，而 `ToRight()` 函数在新项应该在右子树时返回 `True`。这两个函数分别类比 `<` 和 `>`。假设新项进入左子树。左子树可能是空的。在这种情况下，函数只需让左孩子指向新节点。如果左子树为空呢？那么函数应该将新项与左节点中的项进行比较，决定新项应该进入该子节点的左子树还是右子树。这个过程应该一直持续，直到函数到达一个空子树，此时就可以添加新节点。实现这种搜索的一种方法是使用递归——即将\
  \ `AddNode()` 函数应用于子节点而不是根节点。递归的函数调用序列在左或右子树为空时结束——即当 `root->left` 或 `root->right`\
  \ 为 `NULL` 时。记住，`root` 是指向当前子树顶部的指针，因此在每次递归调用中，它都指向一个新的、更层次的子树。（你可能想复习第 9 章中关于递归的讨论。）\n\
  \n点击此处查看代码\n\n```c\nstatic void AddNode (Trnode * new_node, Trnode * root)\n{\n\
  \  if (ToLeft(&new_node->item, &root->item))\n  {\n    if (root->left == NULL) /*\
  \ 子树为空 */\n      root->left = new_node; /* 在此处添加节点 */\n    else\n      AddNode(new_node,\
  \ root->left);/* 或者处理子树 */\n  }\n  else if (ToRight(&new_node->item, &root->item))\n\
  \  {\n    if (root->right == NULL)\n```\n\n\n\n\n\n```c\nroot->right = new_node;\n\
  \nelse\n    AddNode(new_node, root->right);\n}\nelse                        /* should\
  \ be no duplicates */\n{\n    fprintf(stderr,\"location error in AddNode()\\n\"\
  );\n    exit(1);\n}\n```\n\n`ToLeft()` 和 `ToRight()` 函数取决于 `Item` 类型的性质。Nerfville\
  \ 宠物俱乐部的成员将按照名称的字母顺序排序。如果两个宠的名称相同，则按种类排序。如果它们的种类也相同，那么这两个项目就是重复的，而这在基础搜索树中是不允许的。记住，标准\
  \ C 库函数 `strcmp()` 如果第一个参数所表示的字符串在第二个字符串之前，则返回负数；如果两个字符串相同，则返回零；如果第一个字符串在第二个字符串之后，则返回正数。`ToRight()`\
  \ 函数具有类似的代码。使用这两个函数而不是直接在 `AddNode()` 中进行比较，可以使代码更容易适应新需求。当需要不同形式的比较时，不需要重写 `AddNode()`，只需重写\
  \ `ToLeft()` 和 `ToRight()`。\n\n点击此处查看代码图片\n\n```c\nstatic bool ToLeft(const Item\
  \ * i1, const Item * i2)\n{\n    int comp1;\n    if ((comp1 = strcmp(i1->petname,\
  \ i2->petname)) < 0)\n        return true;\n    else if (comp1 == 0 &&\n       \
  \        strcmp(i1->petkind, i2->petkind) < 0 )\n        return true;\n    else\n\
  \        return false;\n}\n```\n\n### 查找项目\n\n三个接口函数涉及在树中搜索特定项目：`AddItem()`、`InTree()`\
  \ 和 `DeleteItem()`。此实现使用一个 `SeekItem()` 函数来提供该服务。`DeleteItem()` 函数有一个额外要求：它需要知道被删除删除项目的父节点，以便在子节点被删除时可以更新父节点的子节点指针。因此，我们设计了\
  \ `SeekItem()` 返回一个包含两个指针的结构体：一个指向包含项目的节点（如果未找到项目则为 `NULL`），另一个指向父节点（如果该节点是根节点且没有父节点则为\
  \ `NULL`）。该结构体类型定义如下：\n\n```c\ntypedef struct pair {\n    Trnode * parent;\n   \
  \ Trnode * child;\n} Pair;\n```\n\n`SeekItem()` 函数可以用递归方式实现。然而，为了让你接触到各种编程技术，我们将使用\
  \ `while` 循环来处理树的下降。与 `AddNode()` 类似，`SeekItem()` 使用 `ToLeft()` 和 `ToRight()` 来遍历树。`SeekItem()`\
  \ 最初将 `look.child` 指针指向树的根节点，然后在它追踪到预期项目项目的路径时，将 `look.child` 重置为连续的子树。同时，`look.parent`\
  \ 被设置为指向连续的父节点。如果没有找到匹配的项目，`look.child` 将是 `NULL`。如果匹配的项目在根节点中，`look.parent` 将是\
  \ `NULL`，因为根节点没有父节点。以下是 `SeekItem()` 的代码：\n\n点击此处查看代码图片\n\n```c\nstatic Pair SeekItem(const\
  \ Item * pi, const Tree * ptree)\n{\n    Pair look;\n    look.parent = NULL;\n \
  \   look.child = ptree->root;\n    if (look.child == NULL)\n        return look;\
  \                    /* early return */\n    while (look.child != NULL)\n    {\n\
  \        if (ToLeft(pi, &(look.child->item)))\n        {\n            look.parent\
  \ = look.child;\n            look.child = look.child->left;\n        }\n       \
  \ else if (ToRight(pi, &(look.child->item)))\n        {\n            look.parent\
  \ = look.child;\n            look.child = look.child->right;\n        }\n      \
  \  else /* must be same if not left or right */\n            break; /* look.child\
  \ is address of node */\n    }\n    return look; /* successful return */\n}\n```\n\
  \n注意，由于 `SeekItem()` 函数返回一个结构体，因此可以使用结构体运算符。例如，`AddItem()` 函数使用了以下内容：\n\n点击此处查看代码图片\n\
  ```c\nif (SeekItem(pi, ptree).child != NULL)\n```\n\n在你拥有 `SeekItem()` 之后，编写 `InTree()`\
  \ 公共接口非常简单：\n\n点击此处查看代码图片\n```c\nbool InTree(const Item * pi, const Tree * ptree)\n\
  {\n    return (SeekItem(pi, ptree).child == NULL) ? false : true;\n}\n```\n\n###\
  \ 删除项目的注意事项\n\n移除项目是最困难的任务之一，因为你必须重新连接剩余的子树以形成一棵有效的树。在尝试此任务之前，对必须的操作建立一个视觉形象是一个很好的主意。\n\
  \n图 17.13 展示了最简单的情况。在这里要删除的节点没有子节点。这样的节点被称为叶子节点。在这种情况下，需要做的是将父节点中的一个指针重置为 `NULL`\
  \ 并使用 `free()` 函数回收被删除节点占用的内存。\n\n![图像](img/17fig13.jpg)\n图 17.13 删除叶子节点。\n\n复杂度之后是删除一个只有一个子节点的节点。删除该节点会使子子树与树的其他部分分离。为了修复这个问题，需要将子树的地址存储在父节点中原本被删除节点地址所在的位置（参见图\
  \ 17.14）。\n\n![图像](img/17fig14.jpg)\n图 17.14 删除单子节点节点。\n\n最后的情况是删除一个具有两个子树的节点。一个子树（例如左侧）可以连接到被删除节点所在的位置。但剩余的子树应该放在哪里呢？记住树的基本设计：左子树中的每个项目都位于父节点项目之前，右子树中的每个项目都位于父节点项目之后。这意味着右子树中的每个项目都在左子树中的每个项目之后。由于右子树曾是被删除节点所在子树的一部分，右子树中的每个项目都在被删除节点的父节点之前。想象沿着树寻找放置右子树的地方。它在父节点之前，所以你需要从那里进入左子树。然而，它在左子树的每个项目之后，所以你需要沿着左子树的右侧向下，直到找到一个空位。图\
  \ 17.15](#ch17_html_ch17fig15) 展示了这种方法。\n\n![图像](img/17fig15.jpg)\n图 17.15 删除双子节点。\n\
  \n#### 删除节点\n\n现在你可以开始规划必要的函数，将工作分为两个任务：一个是将特定项目关联，另一个是实际删除节点。需要注意的一点是，所有情况都涉及修改父节点中的指针，这有两个重要的后果：\n\
  \n![图像](img/squf.jpg) 程序需要识别要删除节点的父节点。\n\n![图像](img/squf.jpg) 为了修改指针，代码必须将该指针的地址传递给删除函数。\n\
  \n我们稍后回到第一个问题。同时，要修改的指针本身是 `Trnode *` 类型，即指向 `Trnode` 的指针。由于函数参数是该指针的地址，该参数将是 `Trnode\
  \ **` 类型，即指向指针的指针。假设你已经获取了正确的地址，可以如下所示编写删除函数：\n\n点击此处查看代码图片\n```c\nstatic void DeleteNode(Trnode\
  \ **ptr)\n/* ptr 是指向目标节点的父成员的地址 */\n{\n    Trnode * temp;\n    if (*ptr)->left ==\
  \ NULL)\n    {\n        temp = *ptr;\n        *ptr = (*ptr)->right;\n        free(temp);\n\
  \    }\n    else if (*ptr)->right == NULL)\n```\n\n\n\n\n\n```c\ntemp = *ptr;\n\n\
  *ptr = (*ptr)->left;\n\nfree(temp);\n\n}\n\nelse /* 删除的节点有两个孩子 */\n{\n    /* 寻找重新附加右子树的位置\
  \ */\n    for (temp = (*ptr)->left; temp->right != NULL;\n         temp = temp->right)\n\
  \        continue;\n    temp->right = (*ptr)->right;\n    temp = *ptr;\n*ptr =(*ptr)->left;\n\
  free(temp);\n}\n```\n\n该函数显式地处理了三种情况：没有左子节点的节点、没有右子节点的节点以及有两个孩子的节点。没有节点的节点可以被视为没有左子节点的特例。如果节点没有左子节点，代码将右子节点的地址赋值给父指针。但如果该节点也没有右节点，则该指针为\
  \ `NULL`，这正是没有节点情况的正确值。\n\n注意，代码使用一个临时指针来跟踪被删除节点的地址。在父指针（`*ptr`）重置后，程序将丢失对被删除节点位置的追踪，但\
  \ `free()` 函数需要这些信息。因此，程序将 `*ptr` 的原始值存储在 `temp` 中，然后使用 `temp` 释放被删除节点使用的内存。\n\n\
  两个孩子情况的代码首先在 `for` 循环中使用 `temp` 指针在左子树的右侧搜索空位。当找到空位时，它将右子树附加在那里。然后它复用 `temp` 来跟踪被删除节点的位置。接着，它将左子树连接到父节点，然后释放\
  \ `temp` 指向的节点。\n\n注意，由于 `ptr` 的类型是 `Trnode **`，`*ptr` 的类型是 `Trnode *`，使其与 `temp`\
  \ 的类型相同。\n\n### 删除项目\n\n问题的剩余部分是将节点与特定项目关联。你可以使用 `SeekItem()` 函数来实现此操作。记住，它返回一个结构体，其中包含一个指向父节点的指针和一个指向包含项目的节点的指针。然后，你可以使用父节点指针来获取正确的地址，传递给\
  \ `DeleteNode()` 函数。这里显示的 `DeleteItem()` 函数遵循了这一计划：\n\n点击此处查看代码图片\n\n```c\nbool\
  \ DeleteItem(const Item * pi, Tree * ptree)\n{\n    Pair look;\n    look = SeekItem(pi,\
  \ ptree);\n    if (look.child == NULL)\n        return false;\n    if (look.parent\
  \ == NULL)      /* 删除根项目 */\n        DeleteNode(&ptree->root);\n    else if (look.parent->left\
  \ == look.child)\n        DeleteNode(&look.parent->left);\n    else\n        DeleteNode(&look.parent->right);\n\
  \    ptree->size--;\n    return true;\n}\n```\n\n首先，将 `SeekItem()` 函数的返回值赋值给 `look`\
  \ 结构体变量。如果 `look.child` 为 `NULL`，说明搜索未找到该项目，`DeleteItem()` 函数退出并返回 `false`。如果找到了\
  \ `Item`，该函数将处理三种情况。首先，`look.parent` 为 `NULL` 值意味着在根节点中找到了该项目。在这种情况下，没有父节点需要更新。相反，程序必须更新\
  \ `Tree` 结构中的根指针。因此，函数将该指针的地址传递给 `DeleteNode()` 函数。否则，程序将判断要删除的节点是父节点的左孩子还是右孩子，然后传递相应指针的地址。\n\
  \n注意，公共接口函数（`DeleteItem()`）是从终端用户关注的角度（项目和树）来描述，而隐藏的 `DeleteNode()` 函数则处理指针移动的细碎工作。\n\
  \n### 遍历树\n\n遍历树比遍历链表要复杂，因为每个节点都有两个分支需要遵循。这种分支性质使得分治法递归（第 9 章）成为处理该问题的自然选择。在每个节点处，函数都应该执行以下操作：\n\
  \n- 处理项目。\n- 处理左子树。\n- 处理右子树。\n\n你可以将此过程分为两个函数：`Traverse()` 和 `InOrder()`。注意，`InOrder()`\
  \ 函数先处理左子树，然后处理项目，最后处理右子树。这种顺序会导致按字母顺序遍历树。如果你有时间，你可能想看看使用不同的顺序（如 `item-left-right`\
  \ 和 `left-right-item`）会发生什么。\n\n点击此处查看代码图片\n\n```c\nvoid Traverse (const Tree *\
  \ ptree, void (* pfun)(Item item))\n{\n    if (ptree != NULL)\n        InOrder(ptree->root);\n\
  }\n\nstatic void InOrder(const Trnode * root, void (* pfun)(Item item))\n{\n   \
  \ if (root != NULL)\n    {\n        InOrder(root->left);\n        (*pfun)(root->item);\n\
  \        InOrder(root->right);\n    }\n}\n```\n\n### 清空树\n\n清空树的过程与遍历基本相同。也就是说，代码需要访问每个节点并对其应用\
  \ `free()`。它还需要重置 `Tree` 结构的成员以表示树为空。`DeleteAll()` 函数负责 `Tree` 结构，并将释放任务交给 `DeleteAllNodes()`。后者与\
  \ `InOrder()` 的设计相同。它确保了根节点在释放后依然可用。以下是这两个函数的代码：\n\n```c\nvoid DeleteAll(Tree *\
  \ ptree)\n{\n    if (ptree != NULL)\n        DeleteAllNodes(ptree->root);\n    ptree->root\
  \ = NULL;\n    ptree->size = 0;\n}\n\nstatic void DeleteAllNodes(Trnode * root)\n\
  {\n    Trnode * pright;\n    if (root != NULL)\n    {\n        pright = root->right;\n\
  \        DeleteAllNodes(root->left);\n        free(root);\n    }\n}\n```\n\n###\
  \ 完整包\n\n列表 17.11 显示了整个 `tree.c`。总之，`tree.h` 和 `tree.c` 构成了一个树的程序包。\n\n列表 17.11\
