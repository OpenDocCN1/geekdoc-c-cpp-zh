  \ */\n    }\n    return look; /* 成功返回 */\n}\n\nstatic void DeleteNode(Trnode **ptr)\
  \ /* ptr 是指向目标节点的父节点地址 */\n{\n    Trnode * temp;\n    if (*ptr)->left == NULL)\n\
