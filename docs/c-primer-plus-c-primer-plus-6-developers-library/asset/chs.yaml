  \    ...\n}\n```\n\n## 整数类型：stdint.h\n\n此头文件使用 `typedef` 机制创建指定整数属性的整数类型名称。此头文件被\
  \ `inttypes.h` 头文件包含，后者提供了用于输入/输出函数调用的宏。参考章节 VI 节（“扩展整数类型”）概述了这些类型如何被使用。\n\n###\
  \ 固定宽度类型\n\n一组 `typedef` 标识了具有精确大小的类型。表 RS.V.26 列出了这些名称和大小。但请注意，并非所有系统都能支持所有类型。\n\
  \n![Image](img/rs-vtab26.jpg)\n\n表 RS.V.26 固定宽度类型\n\n### 最小宽度类型\n\n最小宽度类型保证类型的大小至少为特定的位宽。表\
