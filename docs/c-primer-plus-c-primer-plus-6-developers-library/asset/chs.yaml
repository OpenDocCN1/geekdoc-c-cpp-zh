  \ 如果你打算使用宏而不是函数主要是为了加快程序运行速度，请首先尝试确定这是否可能产生显著差异。在程序中只使用一次的宏可能对运行时间产生任何明显的改进。嵌套循环内部的宏是速度改进的更佳候选。许多系统都提供了程序性能分析工具，来帮助你确定程序在何处花费了最长的时间。\n\
  \n假设你已经开发了一些你喜欢的宏函数。你难道在每次编写新程序时都得重新输入它们吗？如果你记住在下一节中介绍的 `#include` 指令，就不需要。\n\n\
  ### 文件包含：`#include`\n\n当预处理器发现一个 `#include` 指令时，它会寻找后续文件名，并将该文件的内容包含在当前文件中。源文件中的\
  \ `#include` 指令会被替换为所包含文件的文本。这好比你坐下来，在源文件的该特定位置手动输入了被包含文件的全部内容。`#include` 指令有两种：\n\
  \n![Image](img/726pro01.jpg)\n\n在 Unix 系统上，尖角括号告诉预处理器从一个或多个标准系统目录查找文件。双引号则告诉它首先在当前目录（或你在文件名中指定的其他目录）查找，然后在标准位置查找：\n\
  \n![Image](img/726pro02.jpg)\n\n集成开发环境（IDEs）也为系统头文件设置了标准位置或多个位置。许多环境提供了菜单选项，用于在使用尖角括号时指定要搜索的附加位置。与\
  \ Unix 类似，使用双引号意味着首先搜索本地目录，但具体搜索的目录取决于编译器。有些编译器搜索与源代码相同的目录；有些编译器搜索当前工作目录；有些则搜索与项目文件相同的目录。\n\
  \nANSI C 并不要求文件遵循特定的目录模型，因为并非所有计算机系统的组织方式都是相似的。通常情况下，命名文件的方法依赖于系统，但尖角括号和双引号的使用并不依赖于系统。\n\
  \n为什么要包含文件？因为它们包含了编译器所需的。例如，`stdio.h` 文件通常包含 `EOF`、`NULL`、`getchar()` 和 `putchar()`\
  \ 的定义。后两个被定义为宏函数。它还包含了 C I/O 函数的原型。\n\n`.h` 后缀按照惯例用于*头文件*——即放在程序开头的包含信息的文件。头文件通常包含预处理器语句。某些（如\
  \ `stdio.h`）是随系统提供的，但你可以自由创建自己的。\n\n包含一个大型头文件并不一定会显著增加程序的大小。头文件的内容大部分是编译器生成最终代码时使用信息，而不是要添加到最终代码中的材料。\n\
  \n### 头文件：一个示例\n\n假设你开发了一个用于存储人名的结构体，并编写了一些使用该结构的函数。你可以将各种声明汇集在一个头文件中。列表 16.6 显示了此的一个示例。\n\
  \n列表 16.6 `names_st.h` 头文件\n\n点击此处查看代码图像\n\n***\n\n```\n// names_st.h -- names_st\
  \ 结构体头文件\n\n// constants\n#include <string.h>\n\n#define SLEN 32\n\n// structure\
  \ declarations\nstruct names_st\n{\n    char first[SLEN];\n    char last[SLEN];\n\
  };\n\n// typedefs\ntypedef struct names_st names;\n\n// function prototypes\nvoid\
  \ get_names(names *);\nvoid show_names(const names *);\nchar * s_gets(char * st,\
  \ int n);\n```\n\n***\n\n此头文件包含了头文件中常见的许多类型内容：`#define` 指令、结构体声明、`typedef` 语句和函数原型。注意，这些内容都不是可执行代码；相反，它们是编译器创建可执行代码时使用的信息。\n\
  \n这个特定的头文件有点天真。通常情况下，你应该使用 `#ifndef` 和 `#define` 来防止头文件的多次包含。我们稍后会回到这种技术。\n\n可执行代码通常位于源文件文件中，而不是头文件中。例如，列表\
  \ 16.7 显示了头文件中原型定义的那些函数的函数定义。它包含了该头文件，以便编译器知道 `names` 类型。\n\n列表 16.7 `name_st.c`\
  \ 源文件\n\n点击此处查看代码图像\n\n```\n// names_st.c -- 定义 names_st 函数\n\n#include <stdio.h>\n\
  #include \"names_st.h\"     // 包含头文件\n\n// function definitions\nvoid get_names(names\
  \ * pn)\n{\n    printf(\"Please enter your first name: \");\n    s_gets(pn->first,\
  \ SLEN);\n    printf(\"Please enter your last name: \");\n    s_gets(pn->last, SLEN);\n\
  }\n\nvoid show_names(const names * pn)\n{\n    printf(\"%s %s\", pn->first, pn->last);\n\
  }\n\nchar * s_gets(char * st, int n)\n{\n    char * ret_val;\n    char * find;\n\
  \    ret_val = fgets(st, n, stdin);\n    if (ret_val)\n    {\n        find = strchr(ret_val,\
  \ '\\n');\n        if (find)\n        {\n            *find = '\\0';\n        }\n\
  \        else\n        {\n            ret_val[strlen(ret_val)] = '\\0';\n      \
  \  }\n    }\n    return ret_val;\n}\n```\n\n`s_gets()` 函数（通过 `fgets()`）用于防止数组溢出。列表\
  \ 16.8 是使用该头文件和源文件的示例。\n\n列表 16.8 `useheader.c` 程序\n\n点击此处查看代码图像\n\n***\n\n```\n\
  // useheader.c -- 使用 names_st 结构体\n\n#include <stdio.h>\n#include \"names_st.h\"\
  \n\nint main(void)\n{\n    names candidate;\n    get_names(&candidate);\n    printf(\"\
  Let's welcome \");\n    show_names(&candidate);\n    printf(\"to this program!\\\
  n\");\n    return 0;\n}\n```\n\n***\n\n这是一个示例运行：\n\n点击此处查看代码图像\n\nPlease enter your\
  \ first name: Ian\nPlease enter your last name: Smersh\nLet's welcome Ian Smers\
  \ to this program!\n\n注意关于此程序的几点：\n\n![Image](img/squf.jpg) 两个源文件都使用 `names_st`\
  \ 结构体，因此它们都必须包含 `names_st.h` 头文件。\n\n![Image](img/squf.jpg) 你需要编译并链接 `names_st.c`\
  \ 和 `useheader.c` 源文件。\n\n![Image](img/squf.jpg) 声明之类的内容放入 `names_st.h` 头文件中；函数定义放入\
  \ `names_st.c` 源文件中。\n\n### 头文件的用途\n\n浏览任何标准头文件都可以让你对其中包含的信息类型有一个良好的了解。头文件内容的常见形式包括以下：\n\
  \n![Image](img/squf.jpg) **定义常量**——例如，典型的 `stdio.h` 文件定义了 `EOF`、`NULL` 和 `BUFSIZ`。\n\
  \n![Image](img/squf.jpg) **宏函数**——例如，`getchar()` 通常被定义为 `getc(stdin)`，`getc()` 通常定义为一个相当复杂的宏，而\
  \ `ctype.h` 头通常包含 `ctype` 函数的宏定义。\n\n![Image](img/squf.jpg) **函数声明**——例如，`string.h`\
  \ 头（在某些旧系统上为 `strings.h`）包含了字符串族函数的声明。在 ANSI C 及更高版本中，声明采用函数原型形式。\n\n\n\n\n\n![Image](img/squf.jpg)\
  \ **结构体定义—**标准 I/O 函数使用 `FILE` 结构体，其中包含关于文件及其关联缓冲区的信息。`stdio.h` 文件包含了该结构体的声明。\n\n\
  ![Image](img/squf.jpg) **类型定义—**你可能记得标准 I/O 函数使用指向 `FILE` 的指针作为参数。通常情况下，`stdio.h`\
  \ 使用 `#define` 或 `typedef` 来让 `FILE` 表示指向结构体的指针。同样，`size_t` 和 `time_t` 类型也是在头文件中定义的。\n\
  \n许多程序员会编写自己的标准头文件，并在程序中使用。如果你开发了一系列相关的函数和/或结构体，这就会特别有价值。\n\n此外，你还可以使用头文件来声明外部变量，供多个文件共享。这是很有意义的，例如，你开发了一系列函数，它们共享一个变量来报告某种状态（如错误条件）。在这种情况下，你可以在包含函数声明的源文件中定义一个具有文件作用域、外部链接的变量：\n\
  \n点击此处查看代码图像\n\n```c\nint status = 0;     // 文件作用域，源文件\n```\n\n然后，在与源文件相关的头文件中，你可以放置一个引用声明：\n\
  \n点击此处查看代码图像\n\n```c\nextern int status;  // 在头文件中\n```\n\n那么这段代码将出现在任何包含了该头文件的文件中，使得变量对使用该系列函数的文件可用。该声明也会通过包含出现在函数源文件中，但只要声明的类型一致，在同一个文件中同时拥有定义声明（defining\
  \ declaration）和引用声明（reference declaration）是可以的。\n\n另一个包含在头文件中的候选是具有文件作用域、内部链接且带有\
  \ `const` 限定符的变量或数组。`const` 部分可以防止意外修改，而 `static` 部分意味着每个包含头文件的文件都获得其自己的常量副本，这样就避免了需要一个文件进行定义声明、而其他文件进行引用声明的问题。\n\
  \n`#include` 和 `#define` 指令是最频繁使用的 C 预处理器特性。我们将以较不详细的内容介绍其他指令。\n\n## 其他指令\n\n程序员可能需要准备要在各种环境中运行的\
  \ C 程序或 C 库包。代码类型的选择可能随环境而异。预处理器提供了若干指令，帮助程序员通过更改某些 `#define` 宏的值，产生可以从一个系统移动到另一个系统的代码。`#undef`\
  \ 指令取消之前的 `#define` 定义。`#if`、`#ifdef`、`#ifndef`、`#else`、`#elif` 和 `#endif` 指令允许你为编译指定不同的备代码。`#line`\
  \ 指令允许你重置行和文件信息，`#error` 指令允许你发布错误消息，而 `#pragma` 指令允许你向编译器提供指令。\n\n### #undef 指令\n\
  \n`#undef` 指令“取消定义”给定的 `#define`。也就是说，假设你有如下定义：\n\n```c\n#define LIMIT 400\n```\n\
  \n那么该指令：\n\n```c\n#undef LIMIT\n```\n\n将移除该定义。现在，如果你愿意，可以重新定义 `LIMIT` 以赋予它一个新值。即使\
  \ `LIMIT` 起初没有被定义，取消它仍然有效。如果你想使用一个特定的名称但不确定它之前是否被使用过，可以取消它的定义以防万一。\n\n### 已定义——C\
  \ 预处理器的视角\n\n预处理器遵循与 C 相同的关于标识符构的规则：标识符只能由大写字母、小写字母、数字和下划线组成，且数字不能作为第一个字符。当预处理器在预处理器指令中遇到标识符时，它将其视为已定义或未定义。这里，*定义*（defined）指的是被预处理器定义。如果该标识符是由同一文件中之前的\
  \ `#define` 指令创建的宏名称，且没有被 `#undef` 指令关闭，则它是已定义的。如果该标识符不是宏，而是例如一个文件作用域的 C 变量，那么在预处理器看来，它是未定义的。\n\
  \n已定义的宏可以是对象类宏（包括空宏），也可以是函数类宏：\n\n点击此处查看代码图像\n\n```c\n#define LIMIT 1000       \
  \   // LIMIT 已定义\n#define GOOD               // GOOD 已定义\n#define A(X)  ((-(X))*(X))\
  \ // A 已定义\nint q;                  // q 不是宏，因此未定义\n#undef GOOD              //\
  \ GOOD 未定义\n```\n\n注意，`#define` 宏的作用范围从它在文件中声明点延伸到它成为 `#undef` 的对象。某些预定义宏（如 `__DATE__`\
  \ 和 `__FILE__`）始终被视为已定义。\n\n## 条件编译\n\n### #ifdef, #else, 和 #endif 指令\n\n`#ifdef`\
  \ 指令表示，如果后续标识符已定义，则遵循所有指令并编译到 `#else` 或 `#endif`（以先出现的者为准）。如果有 `#else`，当标识符未定义时，从\
  \ `#else` 到 `#endif` 的所有内容都不会执行。`#ifdef #else` 的形式与 C 的 `if else` 非常相似。主要区别在于预处理器不识别使用大括号（`{}`）标记块的方法，因此使用\
  \ `#else`（如果有）和 `#endif`（必须存在）来标记指令块。这些条件结构可以嵌套。你也可以使用这些指令来标记 C 语句块，如列表 16.9 所示。\n\
  \n```c\n/* ifdef.c -- 使用条件编译 */\n#include <stdio.h>\n#define JUST_CHECKING\n#define\
  \ LIMIT 4\n\nint main(void)\n{\n    int i;\n    int total = 0;\n    for (i = 1;\
  \ i <= LIMIT; i++)\n    {\n        total += 2*i*i + 1;\n#ifdef JUST_CHECKING\n \
  \           printf(\"i=%d, running total = %d\\n\", i, total);\n#endif\n    }\n\
  \    printf(\"Grand total = %d\\n\", total);\n    return 0;\n}\n```\n\n编译并运行该程序将产生如下输出：\n\
  \n```text\ni=1, running total = 3\ni=2, running total = 12\ni=3, running total =\
  \ 31\ni=4, running total = 64\nGrand total = 64\n```\n\n\n\n\n\n如果你省略了 `JUST_CHECKING`\
  \ 的定义（或将其放在 C 注释中，或使用 `#undef` 取消定义）并重新编译程序，则只会显示最后一行。你可以使用这种方法，例如来帮助程序调试。定义 `JUST_CHECKING`\
  \ 并明智地选择若干 `#ifdef`，编译器就会包含用于打印中间值以供调试的程序代码。在一切运行正常后，你可以删除该定义并重新编译。如果以后你发现再次需要这些信息，可以重新插入该定义，而无需重新输入所有的额外打印语句。另一种可能性是使用\
  \ `#ifdef` 在适用于不同 C 实现的备备用代码块之间进行选择。\n\n# `#ifndef` 指令\n\n`#ifndef` 指令可以与 `#else`\
  \ 和 `#endif` 使用，其方式与 `#ifdef` 相同。`#ifndef` 询问后面的标识符是否*未*被定义；`#ifndef` 是 `#ifdef`\
  \ 的否定形式。该指令通常用于在常量尚未定义时对其进行定义。这里有一个例子：\n\n```c\n/* arrays.h  */\n\n#ifndef SIZE\n\
  \    #define SIZE 100\n#endif\n```\n\n（较旧的实现可能不允许对 `#define` 指令进行缩进。）\n\n通常，这种写法用于防止在包含多个头文件时对同一个宏进行重复定义，因为每个头文件都可能包含一个定义。在这种情况下，包含的第一个头文件中的定义将成为有效定义，其他头文件中的后续定义将被忽略。\n\
  \n这是另一种用法。假设我们在文件开头放置这一行：\n\n```c\n#include \"arrays.h\"\n```\n\n这会导致 `SIZE` 被定义为\
  \ 100。但在文件开头放置内容：\n\n```c\n#define SIZE 10\n#include \"arrays.h\"\n```\n\n则会将 `SIZE`\
  \ 设置为 10。在这里，在处理 `arrays.h` 中的行时，`SIZE` 已经被定义，因此 `#define SIZE 100` 这一行被跳过。你可能会这样做，例如使用较小的数组尺寸来测试程序。当程序运行符合你的预期时，你可以删除\
  \ `#define SIZE 10` 语句并重新编译。这样，你就永远不需要担心修改头文件数组本身。\n\n`#ifndef` 指令通常用于防止文件的多次重复包含。也就是说，头文件通常按照以下方式设置：\n\
  \n```c\n/* things.h */\n\n#ifndef THINGS_H_\n    #define THINGS_H_\n    /* 文件的其余部分\
  \ */\n#endif\n```\n\n假设此文件由于某种原因被包含了几次。预处理器第一次遇到这个包含文件时，`THINGS_H_` 未定义，因此程序继续定义\
  \ `THINGS_H_` 并处理文件的其余部分。当预处理器下次遇到此文件时，`THINGS_H_` 已定义，因此预处理器跳过文件的其余部分。\n\n为什么要多次包含一个文件？常见的原因是许多包含文件包含了其他文件，所以你可能会显式地包含一个另一个包含文件已经包含的文件。为什么这是一个问题？包含文件中出现的某些项（例如结构体类型的声明）在文件中只能出现一次。标准\
  \ C 头文件使用 `#ifndef` 技术来避免多次包含。其中一个问题是确保你正在测试的标识符没有在别处定义。供应商通常通过使用文件名作为标识符、使用大写字母、将点替换为下划线，并使用下划线（或两个下划线）作为前缀和后缀来解决这个问题。例如，如果你检查你的\
  \ `stdio.h` 头文件，你可能会发现类似这样的内容：\n\n```c\n#ifndef _STDIO_H\n#define _STDIO_H\n// 文件内容\n\
  #endif\n```\n\n你可以做类似的操作。然而，你应该避免使用下划线作为前缀，因为标准规定这种用法是被保留的。你不会希望意外定义一个与标准头文件内容冲突的宏。列表\
  \ 16.10 使用 `#ifndef` 为列表 16.6 中的头文件提供多次包含保护。\n\n### 列表 16.10 这里的 names.h 头文件\n\n\
  ```c\n// names.h -- 带有包含保护的修订\n\n#ifndef NAMES_H_\n#define NAMES_H_\n\n// 常量\n#define\
  \ SLEN 32\n\n// 结构体声明\nstruct names_st\n{\n    char first[SLEN];\n    char last[SLEN];\n\
  };\n\n// typedef\ntypedef struct names_st names;\n\n// 函数原型\nvoid get_names(names\
  \ *);\nvoid show_names(const names *);\nchar * s_gets(char * st, int n);\n\n#endif\n\
  ```\n\n你可以使用列表 16.11 显示的程序测试此头文件。当使用列表 16.10 显示的头文件时，该程序应该正常工作；如果你从列表 16.10 中移除\
  \ `#ifndef` 保护，它应该无法编译。\n\n### 列表 16.11  predef.c 程序\n\n```c\n// predef.c -- 带有包含保护的修订\n\
  \n#include <stdio.h>\n\n#include \"stdio.h\"\n#include \"names.h\"\n\nint main()\n\
  {\n    names winner[] = {\"Less\", \"more\"};\n    printf(\"The winner is %s %s.\\\
  n\", winner.first, winner.last);\n    return 0;\n}\n```\n\n# `#if` 和 `#elif` 指令\n\
  \n`#if` 指令更像普通的 `if`。它后面跟着一个常量表达式，该表达式非零时被视为真，你可以在它与其他关系运算符：\n\n```c\n#if SYS ==\
  \ 1\n    #include \"ibm.h\"\n#endif\n```\n\n你可以使用 `#elif`（在某些实现中可用）来扩展 `if-else`\
  \ 序列。例如，你可以：\n\n```c\n#if SYS == 1\n    #include \"ibm.h\"\n#elif SYS == 2\n   \
  \ #include \"vax.h\"\n#elif SYS == 3\n    #include \"mac.h\"\n#endif\n```\n\n较新的实现提供了另一种测试名称是否定义的方法。与其使用\
  \ `#ifdef VAX`，可以使用这种形式：\n\n```c\n#if defined (VAX)\n```\n\n在这里，`defined` 是一个预处理器运算符，如果参数被定义则返回\
  \ 1，否则返回 0。这种新形式的优势在于它可以配合 `#elif`。使用它，你可以这样重写之前的示例：\n\n```c\n#if defined (IBM)\n\
  \    #include \"ibm.h\"\n#elif defined (VAX)\n    #include \"vax.h\"\n#elif defined\
  \ (MAC)\n    #include \"mac.h\"\n#else\n    #include \"general.h\"\n#endif\n```\n\
  \n如果你在例如 VAX 上使用这些行，你会在文件的较早位置通过这一行定义 `VAX`：\n\n```c\n#define VAX\n```\n\n这些条件编译功能的一个用途是使程序更具移植性。通过更改文件头的几个关键定义，你可以为不同的系统设置不同的值并包含不同的文件。\n\
  \n## 预定义宏\n\nC 标准指定了一些预定义宏，表 16.1 列出了它们。在我们讨论预定义标识符时，C99 标准提供了一个 `__func__`。它展开为包含该标识符函数的名称字符串。因此，标识符必须具有函数作用域，而宏本质上具有文件作用域。因此，`__func__`\
  \ 是 C 语言预定义标识符而非预定义宏。\n\n列表 16.12 显示了这些预定义标识符的使用。注意，其中某些是 C99 添加的，因此预 C99 编译器可能不会接受。对于\
  \ GCC，你可能需要使用 `-std=c99` 或 `-std=c11` 标志。\n\n### 列表 16.12 predef.c 程序\n\n```c\n\
  // predef.c -- 预定义标识符\n\n#include <stdio.h>\n\nvoid why_me();\n\nint main()\n{\n\
  \    printf(\"The file is %s.\\n\", `__FILE__`);\n    printf(\"The date is %s.\\\
  n\", `__DATE__`);\n    printf(\"The time is %s.\\n\", `__TIME__`);\n}\n```\n\n\n\
  \n\n\n```c\n    printf(\"The version is %ld.\\n\", 3TDC_VERSION`____);\n\n    printf(\"\
  This is line %d.\\n\", `__LINE__`);\n\n    printf(\"This function is %s\\n\", `__func__`);\n\
  \n    why_me();\n\n    return 0;\n\n}\n\nvoid why_me()\n\n{\n\n    printf(\"This\
  \ function is %s\\n\", `__func__`);\n\n    printf(\"This is line %d.\\n\", `__LINE__`);\n\
  }\n```\n\n***\n\n这里是一个运行示例：\n\n文件是 predef.c。\n\n日期是 2013 年 9 月 23 日。\n\n时间是 22:01:09。\n\
  \n版本号是 201112。\n\n这是第 11 行。\n\n此函数是 main\n\n此函数是 why_me\n\n这是第 21 行。\n\n#### #line\
  \ 和 #error\n\n`#line` 指令允许你重置由 `__LINE__` 和 `__FILE__` 宏报告的行号和文件名。你可以这样使用 `#line`：\n\
  \n点击此处查看代码图像\n\n```c\n#line 1000    // 将当前行号重置为 1000\n\n#line 10 \"cool.c\"  //\
  \ 将行号重置为 10，文件名重置为 cool.c\n```\n\n`#error` 指令会导致预处理器发布错误消息，其中包含指令中的任何文本。如果可能，编译过程应该停止。你可以这样使用该指令：\n\
  \n点击此处查看代码图像\n\n```c\n#if __STDC_VERSION__ != 201112L\n\n#error Not C11\n\n#endif\n\
  ```\n\n尝试编译程序可能会产生如下结果：\n\n点击此处查看代码图像\n\n```bash\n$ gcc newish.c\n\nnewish.c:14:2:\
  \ error: #error Not C11\n\n$ gcc -std=c11 newish.c\n\n$\n```\n\n当编译器使用旧标准时，编译过程失败；当使用\
  \ C11 标准时，则成功。\n\n#### #pragma\n\n现代编译器有几个可以通过命令行参数或使用 IDE 菜单修改的设置。`#pragma` 允许你在源代码中放置编译器指令。例如，在开发\
  \ C99 期间，它被称为 C9X，其中一个编译器使用以下 pragma 来开启对 C9X 支持：\n\n```c\n#pragma c9x on\n```\n\
  \n通常，每个编译器都有自己的 pragmas。它们可能被用于（例如）控制为自动变量预留的内存量，或设置错误检查的严格性，或启用非标准语言特性。C99 标准确实提供了三个具有较强技术性的标准\
  \ pragma，但我们在此不会讨论它们。\n\nC99 还提供了 `_Pragma` 预处理器运算符。它将字符串转换为普通的 pragma。例如，\n\n点击此处查看代码图像\n\
  \n```c\n_Pragma(\"nonstandardtreatmenttypeB on\")\n```\n\n等同于以下内容：\n\n点击此处查看代码图像\n\
  \n```c\n#pragma nonstandardtreatmenttypeB on\n```\n\n由于该运算符不使用 `#` 符号，你可以将其作为宏展开的一部分：\n\
  \n点击此处查看代码图像\n\n```c\n#define PRAGMA(X) _Pragma(#X)\n\n#define LIMRG(X) PRAGMA(STDC\
  \ CX_LIMITED_RANGE  X)\n```\n\n然后你可以像这样使用代码：\n\n```c\nLIMRG ( ON )\n```\n\n顺便提到，以下定义不起作用，尽管它看起来可能可以：\n\
  \n点击此处查看代码图像\n\n```c\n#define LIMRG(X) _Pragma(STDC CX_LIMITED_RANGE  #X)\n```\n\
  \n问题在于它依赖于字符串拼接，但编译器在预处理完成之前不会进行字符串拼接。\n\n`_Pragma` 运算符完成了完整的“去字符串化”工作；即字符串中的转义序列会被转换为它们所代表的字符。因此，\n\
  \n点击此处查看代码图像\n\n```c\n_Pragma(\"use_bool \\\"true \\\"false\")\n```\n\n变为\n\n```c\n\
  #pragma use_bool \"true \"false\n```\n\n#### 通用选择 (C11)\n\n在编程中，“泛型编程”（generic programming）术语指的是不特定于特定类型的代码，一旦指定了类型，就可以转换为该类型的代码。例如，C++\
  \ 允许你以模板的形式创建泛型算法，编译器随后可以使用模板自动为指定的类型实例化代码。C 没有完全类似的机制。然而，C11 增加了一种新的表达式，称为通用选择表达式（generic\
  \ selection expression），可以使用它。\n\n\n\n\n通常情况下，函数调用是有开销的。这意味着设置调用、传递参数、跳转到函数代码和返回都需要消耗执行时间。正如你所看到的，你可以使用宏将代码内联，从而避免这种开销。C99\
  \ 借鉴了 C++（但并不总是完全相同），增加了另一种方法：`inline functions`。从名称上看，你可能预期望内联函数会用内联代码替换函数调用，但你会被误导的。C99\
  \ 和 C11 标准的标准说明是：“将函数设为内联函数意味着对该函数的调用应尽可能快。此类建议的有效程度取决于实现。”因此，将函数设为内联函数可能会导致编译器用内联代码替换函数调用，和/或执行某些其他类型的优化，也可能没有任何影响。\n\
  \n创建内联函数定义有多种方法。标准规定，具有内部链接（internal linkage）的函数可以是内联的，且内联函数的定义必须位于使用该函数的同一个文件中。因此，一种简单的方法是使用\
  \ `inline` 函数说明符配合 `static` 存储类说明符。通常，内联函数定义在文件中第一次使用之前，因此该定义也充当了原型（prototype）。也就是说，代码看起来如下：\n\
  \n点击此处查看代码图像\n\n```c\n#include <stdio.h>\n\ninline static void eatline()   // inline\
  \ definition/prototype\n\n{\n    while (getchar() != '\\n')\n        continue;\n\
  }\n\nint main()\n{\n...\n    eatline();                  // function call\n...\n\
  }\n```\n\n看到内联声明后，编译器可以选择（例如）用函数体替换 `eatline()` 函数调用。也就是说，最终效果可能与你编写了以下代码是一样的：\n\
  \n点击此处查看代码图像\n\n```c\n#include <stdio.h>\n\ninline static void eatline()   // inline\
  \ definition/prototype\n\n{\n    while (getchar() != '\\n')\n        continue;\n\
  }\n\nint main()\n{\n...\n    while (getchar() != '\\n')   // function call replaced\n\
  \        continue;\n...\n}\n```\n\n由于内联函数没有为其专门分配的独立代码块，因此你无法获取它的地址。（实际上，你可以获取地址，但编译器会生成一个非内联函数。）此外，内联函数可能不会在调试器中显示。\n\
  \n内联函数应该是短小的的。对于长函数，调用函数消耗的时间与执行函数体消耗的时间相比很短，因此使用内联版本并没有节省时间。\n\n为了让编译器进行内联优化，它必须知道函数定义的内容。这意味着内联函数的定义必须与函数调用位于同一个文件中。出于这个原因，内联函数通常具有内部链接。因此，如果你有一个多文件程序，在调用该函数的每个文件中都需要一个内联定义。实现这一点最简单的方法是将内联函数定义放在头文件中，然后在使用该函数的文件中包含该头文件。\n\
  \n点击此处查看代码图像\n\n```c\n// eatline.h\n\n#ifndef EATLINE_H_\n#define EATLINE_H_\n\n\
  inline static void eatline()\n{\n    while (getchar() != '\\n')\n        continue;\n\
  }\n\n#endif\n```\n\n内联函数是“不在头文件中放置可执行代码”这一规则的例外。由于内联函数具有内部链接，在多个文件中定义它并不会导致问题。\n\
  \nC 与 C++ 不同，也允许内联定义与外部定义（具有外部链接的函数定义）混合使用。例如，一个程序拥有以下三个文件：\n\n点击此处查看代码图像\n\n```c\n\
  //file1.c\n...\ninline static double square(double);\ndouble square(double x) {\
  \ return x * x; }\nint main()\n{\n    double q = square(1.3);\n...\n\n//file2.c\n\
  ...\ndouble square(double x) { return (int) (x*x); }\nvoid spam(double v)\n{\n \
  \   double kv = square(v);\n...\n\n//file3.c\n...\ninline double square(double x)\
  \ { return (int) (x * x + 0.5); }\nvoid masp(double w)\n{\n    double kw = square(w);\n\
  ...\n```\n\n其中一个如前所示是 `inline static` 定义。一个是普通的函数定义，因此具有外部链接。另外一个是 `inline` 定义。\n\
  \n\n\n请记住，你应该为你使用的函数声明函数类型。通常，你可以通过包含相应的头文件来实现这一点。描述库函数的用户手册会告诉你需要包含哪些文件。然而，在某些旧旧系统上，你可能需要手动输入函数声明。同样，用户手册会指示函数的类型。此外，附录\
  \ B“参考章节”总结了 ANSI C 库，并按头文件对函数分组。\n\n在过去，头文件的文件名在不同的实现之间并不一致。ANSI C 标准将库函数分为若干类，每一类都有一个特定的头文件用于其函数原型。\n\
  \n### 文件的包含\n\n如果一个函数被定义为宏，你可以使用 `#include` 指令包含包含其定义的文件。通常，相似的宏会被收集在一个命名恰当的头文件中。例如，自从\
  \ ANSI C 引入以来，C 编译器都带有一个 `ctype.h` 文件，其中包含几个确定字符性质的宏：大写字母、数字等。\n\n### 库的包含\n\n在编译或链接程序的某个阶段，你可能需要指定库选项。即使是自动检查标准库的系统，也可能有其他使用频率较低的函数库。这些库必须通过编译时选项显式请求。注意，这个过程与包含头文件是不同的。头文件提供函数声明或原型。库选项告诉系统去哪里寻找函数代码。显然，我们无法列举所有系统的细节，但这些讨论应该提醒你应该需要关注的内容。\n\
  \n### 使用库描述\n\n我们没有空间讨论整个库，但我们将查看一些具有代表性的示例。首先，让我们来看文档。\n\n你可以在几个地方找到函数文档。你的系统可能有一个在线手册，集成开发环境通常有在线帮助。C\
  \ 语言供应商可能提供描述库函数的打印版用户指南，或者他们可能会将等效材料放在参考 CD-ROM 或在线上。几家出版商发行了 C 库函数的参考手册。有些在本质上是通用的，而有些针对特定的实现。而且，正如前面提到的，本书中的附录\
  \ B 提供了一个总结。\n\n阅读文档时所需的关键技能是解释函数标题。这种习惯已经随着时间发生了变化。在这里，是 `fread()` 在旧版 Unix 文档中的列出方式：\n\
  \n点击此处查看代码图像\n\n```\n#include <stdio.h>\n\nfread(ptr, sizeof(*ptr), nitems, stream)\n\
  \nFILE *stream;\n```\n\n首先，给出了正确的 `include` 文件。`fread()`、`ptr`、`sizeof(*ptr)` 或\
  \ `nitems` 都没有给出类型。在过去，在默认情况下，它们被认为是 `int` 类型，但上下文清楚地表明 `ptr` 是一个指针。（在 C 语言的早期，指针被处理为整数。）`stream`\
  \ 参数被声明为指向 `FILE` 的指针。该声明使其看起来就像你应该使用 `sizeof` 运算符作为第二个参数。实际上，它是说该参数的值应该是 `ptr`\
  \ 所指向对象的大小。通常情况下，你会如图中所示使用 `sizeof`，但任何 `int` 类型的值都符合语法要求。\n\n后来，形式变成了这种形式：\n\n\
  点击此处查看代码图像\n\n```\n#include <stdio.h>\n\nint fread(ptr, size, nitems, stream;)\n\
  \nchar *ptr;\n\nint size, nitems;\n\nFILE *stream;\n```\n\n现在所有类型都显式地给出，且 `ptr`\
  \ 被视为指向 `char` 的指针。\n\nANSI C90 标准提供了以下描述：\n\n点击此处查看代码图像\n\n```\n#include <stdio.h>\n\
  \nsize_t fread(void *ptr, size_t size, size_t nmemb, FILE *stream);\n```\n\n首先，它使用了新的原型格式。其次，它更改了一些类型。`size_t`\
  \ 类型被定义为 `sizeof` 运算符返回的无符号整数类型。通常它是 `unsigned int` 或 `unsigned long`。`stddef.h`\
  \ 文件包含了 `size_t` 的 `typedef` 或 `#define`，其他几个文件也是如此，包括 `stdio.h`，通常通过包含 `stddef.h`\
  \ 实现。许多函数包括 `fread()`，经常将 `sizeof` 运算符作为实际参数的一部分。`size_t` 类型使得形式参数匹配这种常用用法。\n\n\
  此外，ANSI C 使用指向 `void` 的指针作为一种通用指针，用于可能使用不同类型指针的情况。例如，`fread()` 的实际第一个参数可以是指向 `double`\
  \ 数组的指针，或指向某种结构的指针。如果实际参数是（例如）指向 20 个 `double` 数组的指针，而形式参数是指向 `void` 的指针，编译器会创建相应的类型版本，而不会对类型冲突发牢。\n\
  \n最近，C99/C11 标准在描述中引入了新关键字 `restrict`：\n\n点击此处查看代码图像\n\n```\n#include <stdio.h>\n\
  \nsize_t fread(void * restrict ptr, size_t size,\n\n      size_t nmemb, FILE * stream);\n\
  ```\n\n现在让我们转向一些具体的内容。\n\n### 数学库\n\n数学库包含许多实用的函数。`math.h` 头文件提供了这些函数的声明。表 16.2\
  \  ANSI C 数学函数\n\n![Image](img/16tab02.jpg)\n\n#### 一些三角函数\n\n让我们使用数学库来解决一个常见问题：将\
  \ x/y 坐标转换为幅值和角度。例如，假设你在网格上画了一条线，水平跨越 4 个单位（`x` 值），垂直跨越 3 个单位（`y` 值）。线的长度（幅值）是多少？它的方向是什么？三角函数告诉我们：\n\
  \n```\nmagnitude = sqrt(x² + y²)\n\nand\n\nangle = atan(y/x)\n```\n\n数学库提供了平方根函数和两个反正切函数，因此你可以在\
  \ C 程序中实现这个解决方案。平方根函数称为 `sqrt()`，接收一个 `double` 参数并返回参数的平方根，同样为 `double` 类型值。\n\n\
  `atan()` 函数接收一个 double 参数——正切值——并返回具有该值的角度。遗憾的是，`atan()` 函数会被（例如）`x` 和 `y` 值为 -5\
  \ 和 -5 的线所困扰。因为 (-5)/(-5) 是 1，`atan()` 会报告 45°，这与 `x` 和 `y` 值为 5 和 5 的线相同。也就是说，`atan()`\
  \ 无法区分给定角度的线与其反方向 180° 的线。（实际上，`atan()` 报告的是弧度而不是角度；我们很快会讨论这种转换。）\n\n幸运的是，C 库还提供了\
  \ `atan2()` 函数。它接收两个参数：x 值和 y 值。这样，函数就可以检查 x 和 y 的符号并确定正确的角度。像 `atan()` 一样，`atan2()`\
  \ 返回弧度。要转换为角度，将结果角度乘以 180 并除以 pi。你可以通过表达式 `4 * atan(1)` 让计算机计算 pi。列表 16.14 说明了这些步骤。它还给了你机会复习结构体和\
  \ `typedef` 机制。\n\n\n\n\n\n```c\n/* rect_pol.c -- 将直角坐标转换为极坐标 */\n\n#include <stdio.h>\n\
  \n#include <math.h>\n\n#define RAD_TO_DEG (180/(4 * atan(1)))\n\ntypedef struct\
  \ polar_v {\n    double magnitude;\n    double angle;\n} Polar_V;\n\ntypedef struct\
  \ rect_v {\n    double x;\n    double y;\n} Rect_V;\n\nPolar_V rect_to_polar(Rect_V);\n\
  \nint main(void)\n{\n    Rect_V input;\n    Polar_V result;\n    puts(\"Enter x\
  \ and y coordinates; enter q to quit:\");\n    while (scanf(\"%lf %lf\", &input.x,\
  \ &input.y) == 2)\n    {\n        result = rect_to_polar(input);\n        printf(\"\
  magnitude = %0.2f, angle = %0.2f\\n\",\n               result.magnitude, result.angle);\n\
  \    }\n    puts(\"Bye.\");\n    return 0;\n}\n\nPolar_V rect_to_polar(Rect_V rv)\n\
  {\n    Polar_V pv;\n    pv.magnitude = sqrt(rv.x * rv.x + rv.y * rv.y);\n    if\
  \ (pv.magnitude == 0)\n        pv.angle = 0.0;\n    else\n        pv.angle = RAD_TO_DEG\
  \ * atan2(rv.y, rv.x);\n    return pv;\n}\n```\n\n这里是一个示例运行：\n\n点击此处查看代码图片\n\nEnter\
  \ x and y coordinates; enter q to quit:\n10 10\nmagnitude = 14.14, angle = 45.00\n\
  -12 -5\nmagnitude = 13.00, angle = -157.38\nq\nBye.\n\n如果你在编译时遇到类似下面的信息：\n\nUndefined:\
  \ `_sqrt`\n\n或者\n\n'`sqrt`: unresolved external\n\n或者类似的信息，说明你的编译器-链接器没有找到数学库。Unix\
  \ 系统可能需要你使用 `-lm` 标志来指示链接器搜索数学库：\n\n`cc rect_pol.c –lm`\n\n注意 `-lm` 标志位于命令的末尾。这是因为链接器是在编译器编译\
  \ C 文件之后工作的。Linux 上的 GCC 编译器可能有相似的行为：\n\n`gcc rect_pol.c -lm`\n\n### 类型变体\n\n基本的浮点数数学函数接收\
  \ `double` 类型参数并返回 `double` 类型的值。你可以向它们传递 `float` 类型或 `long double` 类型参数，函数仍然可以工作，因为参数会被转换为\
  \ `double` 类型。这很方便，但并不一定是最优的。不需要双精度，使用单精度 `float` 值进行计算可能会更快。而当 `long double` 类型值传递给\
  \ `double` 类型参数时，将会丢失精度；该值甚至可能无法被表示。为了处理这些潜在问题，C 标准提供了标准函数的 `float` 类型和 `long double`\
  \ 类型版本，通过在函数名后加上后缀 `f` 或 `l`（字母“l”）来实现。因此，`sqrtf()` 是 `sqrt()` 的 `float` 版本，而 `sqrtl()`\
  \ 是 `long double` 版本。\n\nC11 引入的泛型选择表达式（generic selection expression）允许我们定义一个泛型宏，根据参数类型选择最合适的数学函数版本。列表\
  \ 16.15 显示了两种方法。\n\n列表 16.15  own generic.c\n\n点击此处查看代码图片\n\n```c\n//  generic.c\
  \  -- 定义泛型宏\n\n#include <stdio.h>\n#include <math.h>\n#define RAD_TO_DEG (180/(4\
  \ * atanl(1)))\n\n// 泛型平方根函数\n#define SQRT(X) _Generic((X),\\\n    long double:\
  \ sqrtl, \\\n    default: sqrt, \\\n    float: sqrtf)(X)\n// 泛型正弦函数，角度为度\n#define\
  \ SIN(X) _Generic((X),\\\n    long double: sinl((X)/RAD_TO_DEG),\\\n    default:\
  \ sin((X)/RAD_TO_DEG),\\\n    float: sinf((X)/RAD_TO_DEG)\\\n)\nint main(void)\n\
  {\n    float x = 45.0f;\n    double xx = 45.0;\n    long double xxx = 45.0L;\n \
  \   long double y = SQRT(x);\n    long double yy = SQRT(xx);\n    long double yyy\
  \ = SQRT(xxx);\n    printf(\"%.17Lf\\n\", y); //  float\n    printf(\"%.17Lf\\n\"\
  , yy); //  default\n    printf(\"%.17Lf\\n\", yyy); //  long double\n    int i =\
  \ 45;\n    long double yy = SQRT(i); //  default\n    printf(\"%.17Lf\\n\", yy);\n\
  \    long double yyy = SIN(xxx); //  long double\n    printf(\"%.17Lf\\n\", yyy);\n\
  \    return 0;\n}\n```\n\n输出结果如下：\n6.7080237925702148\n6.7080239324993642\n6.7080239324993642\n\
  6.707106781865472\n\n如你所示，`SQRT(i)` 的值与 `SQRT(xx)` 相同，因为两个参数类型（`int` 和 `double`）都对应\
  \ `default` 标签。\n\n一个很有意思的点是如何让使用 `_Generic` 定义的宏像函数一样工作。`SIN()` 的定义采用了更为显而易见的方法：每个带标签的值都是一个函数调用，因此\
  \ `_Generic` 表达式的值是一个特定的函数调用，例如 `sin((X)/RAD_TO_DEG)`，其中 `SIN()` 的参数替换了 `X`。`SQRT()`\
  \ 的定义可能更优雅。在这种情况下，`_Generic` 表达式的值是函数名，例如 `sinf`。函数名被函数地址替换，因此 `_Generic` 表达式的值是一个函数指针。然而，整个\
  \ `_Generic` 表达式后面跟着 `(X)`，这种“函数指针(参数)”的组合实际上是调用了函数。\n\n### math.h (C99)\n\nC99\
  \ 增加的 `math.h` 允许我们定义泛型宏。列表 16.15 显示了两种方法。如果编译器支持复数，它支持 `complex.h` 头文件，提供了数学函数的复数形式。例如，它声明了\
  \ `csqrtf()`、`csqrt()` 和 `csqrtl()`，分别返回 `float complex`、`double complex` 和 `long\
  \ double complex` 类型。当提供这种支持时，`math.h` `sqrt()` 宏也可以扩展为相应的复数平方根函数。\n\n如果你想在包含 `math.h`\
  \ 的情况下调用 `sqrt()` 函数而不是 `sqrt()` 宏，可以将函数名放在括号中：\n\n点击此处查看代码图片\n\n```c\n#include\
  \ <math.h>\n...\nfloat x = 44.0f;\ndouble y;\ny = sqrt(x); // 调用宏，即 sqrtf(x)\ny\
  \ = (sqrt)(x); // 调用函数 sqrt()\n```\n\n这是因为函数类宏的名字必须紧跟一个左括号，而使用括号可以规避这一点。除了运算符优先级外，括号不会影响包含它的表达式，因此将函数名括起来仍然是函数调用。事实上，由于\
  \ C 语言关于函数指针的矛盾规则，你也可以使用 `(*sqrt)` 来调用 `sqrt()` 函数。\n\n### 通用工具库\n\n通用工具库包含了各种函数，包括随机数生成器、搜索和排序函数、转换函数以及内存管理函数。你已经在第\
  \ 12 章中见过 `rand()`、`srand()`、`malloc()` 和 `free()`。在 ANSI C 下，这些函数的原型存在于 `stdlib.h`\
  \ 头文件中。附录 B、参考章节 V 列出了该类族的所有函数；我们现在将详细介绍其中几个。\n\n#### exit() 和 atexit() 函数\n\n\n\
  \n\n\n我们已经在几个示例中显式地使用了 `exit()`。此外，`exit()` 函数会在从 `main()` 返回时自动被调用。ANSI 标准添加了一些非常有用的功能，但我们还没有使用过。最重要的新增是，你可以指定在\
  \ `exit()` 执行时调用的特定函数。`atexit()` 函数通过注册退出时调用的函数提供了这一功能；`atexit()` 函数接受函数指针作为其参数。列表\
  \ 16.16 显示了它是如何工作的。\n\n### 列表 16.16 byebye.c 程序\n\n点击此处查看代码图像\n\n* * *\n\n```c\n\
  /* byebye.c -- atexit() example */\n\n#include <stdio.h>\n\n#include <stdlib.h>\n\
  \nvoid sign_off(void);\n\nvoid too_bad(void);\n\nint main(void)\n{\n    int n;\n\
  \    atexit(sign_off);    /* register the sign_off() function */\n    puts(\"Enter\
  \ an integer:\");\n    if (scanf(\"%d\",&n) != 1)\n    {\n        puts(\"That's\
  \ no integer!\");\n        atexit(too_bad); /* register the too_bad()  function\
  \ */\n        exit(EXIT_FAILURE);\n    }\n    printf(\"%d is %s.\\n\", n, (n % 2\
  \ == 0)? \"even\" : \"odd\");\n    return 0;\n}\n\nvoid sign_off(void)\n{\n    puts(\"\
  Thus terminates another program from\");\n    puts(\"SeeSaw Software!\");\n}\n\n\
  void too_bad(void)\n{\n    puts(\"SeeSaw Software extends its condolences\");\n\
  \    puts(\"to you upon the failure of your program.\");\n}\n```\n\n* *\n\n这是第一次运行：点击此处查看代码图像\
  \ Enter an integer: 2 is even. Thus terminates another program from SeeSaw Software!\
  \ 如果你在 IDE 中运行，你可能看不到最后几行。\n\n这是第二次运行：点击此处查看代码图像 Enter an integer: That's no integer!\
  \ SeeSaw Software extends its condolences to you upon the failure of your program.\
  \ Thus terminates another program from SeeSaw Software! 如果你在 IDE 中运行，你可能看不到最后几行。\n\
  \n让我们来看两个领域：`atexit()` 和 `exit()` 的使用。\n\n#### 使用 atexit()\n\n这是一个使用函数指针的函数！要使用\
  \ `atexit()` 函数，只需传递你希望在退出时调用的函数地址。因为函数名在用作参数时充当地址，因此使用 `sign_off` 或 `too_bad` 作为参数。然后\
  \ `atexit()` 会将该函数注册到当调用 `exit()` 时执行的函数列表中。ANSI 保证你可以在列表中放置至少几个函数。每个函数都通过单独调用 `atexit()`\
  \ 来添加。当 `exit()` 函数最终被调用时，它会执行这些函数，其中最后添加的函数最先执行。\n\n注意，当输入失败时，`sign_off()` 和 `too_bad()`\
  \ 都被调用了，但输入成功时，只有 `sign_off()` 被调用。这是因为 `if` 语句仅在输入失败时才注册 `too_bad()`。由 `atexit()`注册的函数（如\
  \ `sign_off()` 和 `too_bad()`）应该是不带参数的 `void` 函数。通常，它们会执行管理任务，例如更新程序监控文件或重置环境变量。注意，即使没有显式调用\
  \ `exit()`，`sign_off()` 也会被调用；这是因为当 `main()` 终止时会隐式调用 `exit()`。\n\n#### 使用 exit()\n\
  \n在 `exit()` 执行完 `atexit()`指定的函数后，它会进行一些清理。它会刷新所有输出流，关闭所有打开的流，并关闭由标准 I/O 函数 `tmpfile()`\
  \ 创建的临时文件。然后 `exit()` 将控制权返回给主机环境，并在可能的情况下向环境报告终止状态。传统上，Unix 程序使用 0 表示成功终止，使用非 0\
  \ 表示失败。Unix 返回码并不一定适用于所有系统，因此 ANSI C 定义了一个名为 `EXIT_FAILURE` 的宏，可以跨平台地用于指示失败。同样，它定义了\
  \ `EXIT_SUCCESS` 来指示成功，但 `exit()` 也接受 0 来实现此目的。在 ANSI C 中，在非递归的 `main()` 函数中使用 `exit()`\
  \ 函数等同于使用关键字 `return`。然而，当 `exit()` 用于 `main()` 的其他函数时，它也会终止程序。\n\n#### qsort()\
  \ 函数\n\n“快速排序”方法是最有效的排序算法之一，特别是对于较大的数组。它由 C.A.R. Hoare 于 1962 年开发，将数组划分成越来越小的规模，直到达到元素级。首先，将数组分为两个部分，一个分区中的每个值都小于另一个分区中的每个值。这个过程持续到数组完全排序。\n\
  \nC 语言实现的快速排序算法名称为 `qsort()`。`qsort()` 函数对数据对象数组排序。它有以下 ANSI 原型：点击此处查看代码图像\n\n```c\n\
  void qsort (void *base, size_t nmemb, size_t size,\n           int (*compar)(const\
  \ void *, const void));\n```\n\n第一个参数是待排序数组起始起始指针。ANSI C 允许任何数据指针类型转换为 `void` 指针，因此\
  \ `qsort()` 的第一个实际参数可以引用任何类型的数组。第二个参数是要排序的项目数。原型将此值转换为 `size_t` 类型。正如你可能记得多次提到的，`size_t`\
  \ 是 `sizeof` 运算符返回的整数类型，定义在标准头文件中。\n\n由于 `qsort()` 将第一个参数转换为 `void` 指针，`qsort()`\
  \ 失去了每个数组元素的大小。为了补偿这一点，你必须显式告诉 `qsort()` 数据对象的大小。这就是第三个参数的作用。例如，如果你正在对 `double`\
  \ 类型数组进行排序，你应该处使用 `sizeof(double)`。\n\n最后，`qsort()` 需要一个用于确定排序的函数指针。比较函数接受两个参数：指向待比较项目的指针。如果第一个项目应该在第二个项目之后，应返回正整数；如果项目相同，返回零；如果第二个项目应该在第一个项目之后，则返回负整数。`qsort()`\
  \ 将使用该函数，并传递它从其他提供的信息计算出的值。比较函数必须的形式在 `qsort()` 原型的最后一个参数中给出：点击此处查看代码图像\n\n```c\n\
  int (*compar)(const void *, const void *)\n```\n\n这表示最后一个参数是一个指向函数的指针，该函数返回一个 `int`\
  \ 并接受两个参数，每个参数都是指向 `const void` 的指针。这两个指针指向待比较的项目。\n\n\n\n\n\n```c\nvoid showarray(const\
  \ double ar[], int n)\n{\n    int index;\n    for( index = 0; index < n; index++)\n\
  \    {\n        printf(\"%9.4f \", ar[index]);\n        if (index % 6 == 5)\n  \
  \          putchar('\\n');\n    }\n    if (index % 6 != 0)\n        putchar('\\\
  n');\n}\n\n/* 按值升序排序 */\nint mycomp(const void * p1, const void * p2)\n{\n    /*\
  \ 需要使用 double 指针来访问值 */\n    const double * a1 = (const double *) p1;\n    const\
  \ double * a2 = (const double *) p2;\n    if (*a1 < *a2)\n        return -1;\n \
  \   else if (*a1 == *a2)\n        return 0;\n    else\n        return 1;\n}\n```\n\
