  Disma Lapoult: \"Chicken of the Andes\" ($29.99)\nDone.\n\n列表 14.1 中创建的结构体有三个部分（称为成员或字段）——一个用于存储标题，一个用于存储作者，一个用于存储价值。这些是你必须掌握的三项技能：\n\
  \n![graphics/squf.jpg) 为结构体设置格式或布局\n![graphics/squf.jpg) 声明一个符合该布局的变量\n![graphics/squf.jpg)\
  \ 获取变量各个独立组件\n\n### 设置结构体声明\n\n`结构体声明`（structure declaration）是描述结构体如何组合的主计划。声明看起来如下：\n\
  \n点击此处查看代码图像\n```c\nstruct book {\n    char title[MAXTITL];\n    char author[MAXAUTL];\n\
  \    float value;\n};\n```\n\n此声明描述了一个由两个字符数组和一个 `float` 变量组成的结构体。它没有创建一个实际的数据对象，但它描述了构成这样一个对象的要素。（有时，我们将结构体声明称为*模板*（template），因为它概述了数据将如何被存储。如果你在\
  \ C++ 中听过模板，那是该词的另一种、更具野心的用法。）让我们来看细节。首先是关键字 `struct`。它标识接下来的内容为一个结构体。接下来是一个可选的\
  \ `tag`（标签）——单词 `book`——这是一个你可以用来引用它的简写标签。\n\n\n\n换句话说，声明结构体的过程和定义结构变量的过程可以合并为一个步骤。将声明和变量定义结合起来，如下所示，这是唯一不需要使用标签的情况：\n\
  \n```c\nstruct {          /* 无标签 */\n    char title[MAXTITL];\n    char author[MAXAUTL];\n\
  \    float value;\n} library;\n```\n\n但是，如果你计划多次使用结构体模板，请使用标签形式，或者可以使用本章稍后介绍的 `typedef`\
  \ 替代方案。\n\n在定义结构变量时，有一个方面在示例中没有提到：初始化。我们现在来看这个问题。\n\n## 初始化结构体\n\n你已经见过如何初始化变量和数组了：\n\
  \n```c\nint count = 0;\nint fibo[7] = {0,1,1,2,3,5,8};\n```\n\n结构变量也可以初始化吗？是的，可以。要初始化一个结构体（对于\
  \ ANSI C 及以后版本的任何存储类型，但排除预-ANSI C 版本的自动变量），你使用与数组相似的语法：\n\n点击此处查看代码图像\n\n```c\n\
  struct book library = {\n    \"The Pious Pirate and the Devious Damsel\",\n    \"\
  Renee Vivotte\",\n    1.95\n};\n```\n\n简而言之，你使用花括号括起来的逗号分隔初始化器列表。每个初始化器都应该与被初始化的结构成员类型匹配。因此，你可以将\
  \ `title` 成员初始化为字符串，将 `value` 成员初始化为数字。为了让这种关联更加明显，我们为每个成员都单独写了一行初始化，但编译器只需要逗号来分隔一个成员的初始化和下一个。\n\
  \n***\n\n**注意：** 结构体初始化与存储类持续时间\n\n第 12 章，“存储类、链接与内存管理”提到过，如果你初始化一个具有静态存储持续时间的变量（例如静态外部链接、静态内部链接或无链接的静态变量），你必须使用常量值。这也适用于结构体。如果你正在初始化一个具有静态存储持续时间的结构体，初始化列表中的值必须是常量表达式。如果存储持续时间是自动的，则列表中的值不需要是常量。\n\
  \n***\n\n## 结构体成员\n\n结构体就像一个“超级数组”，其中一个元素可以是 `char`，下一个元素可以是 `float`，再下一个元素可以是 `int`\
  \ 数组。你可以使用下标来访问数组的单个元素。那么如何访问结构体的单个成员呢？使用点（`.`），即结构成员运算符。例如，`library.value` 是 `library`\
  \ 的 `value` 部分。你可以像使用任何其他 `float` 变量一样使用 `library.value`。同样，你可以像使用 `char` 数组一样使用\
  \ `library.title`。因此，程序使用了如下表达式：\n\n```c\ns_gets(library.title, MAXTITL);\n```\n\
  \n```c\nscanf(\"%f\", &library.value);\n```\n\n本质上，`.title`、`.author` 和 `.value`\
  \ 在 `book` 结构体中充当了下标的角色。\n\n注意，尽管 `library` 是一个结构体，但 `library.value` 是 `float` 类型，其用法与其他任何\
  \ `float` 类型一样。例如，`scanf(\"%f\",...)` 需要一个 `float` 位置的地址，而 `&library.float` 正是如此。此处点运算符的优先级高于\
  \ `&`，因此该表达式等同于 `&(library.float)`。\n\n如果你有第二个相同类型的结构体变量，将使用相同的方法：\n\n```c\nstruct\
  \ book bill, newt;\n```\n\n```c\ns_gets(bill.title, MAXTITL);\ns_gets(newt.title,\
  \ MAXTITL);\n```\n\n`.title` 指的是 `book` 结构的第一个成员。注意初始程序如何以两种不同的格式打印结构体 `library`\
  \ 内容。这说明了你在使用结构体成员时的自由度。\n\n## 结构体的初始化器\n\nC99 和 C11 为结构体提供了指定初始化器。语法与数组的指定初始化器相似。然而，结构体的指定初始化器使用点运算符和成员名，而不是括号和索引来识别特定元素。例如，要仅初始化\
  \ `book` 结构体的 `value` 成员，你可以这样做：\n\n点击此处查看代码图像\n\n```c\nstruct book surprise = {\
  \ .value = 10.99};\n```\n\n你可以按任何顺序使用指定初始化器：\n\n点击此处查看代码图像\n\n```c\nstruct book\
  \ gift = { .value = 25.99,\n                    .author = \"James Broadfool\",\n\
  \                    .title = \"Rue for the Toad\"};\n```\n\n与数组一样，位于指定初始化器之后的普通初始化器会为其其随后的成员提供值。此外，为特定成员提供的最后一个值是它最终获得的值。例如，考虑此声明：\n\
  \n点击此处查看代码图像\n\n```c\nstruct book gift= { .value = 18.90,\n                    .author\
  \ = \"Philion Pestle\",\n                    0.25};\n```\n\n值 `0.25` 被赋值给 `value`\
  \ 成员，因为它紧跟在 `author` 成员之后。新值 `0.25` 覆盖了 `18.90` 的值。现在你掌握了这些基础知识，准备好扩展视野，查看结构体的若干影响。你将看到结构体数组、嵌套结构体、结构体指针以及处理结构体的函数。\n\
  \n### 结构体数组\n\n让我们扩展书籍程序以处理更多的书籍。显然，每本书都可以由一个 `book` 类型的结构体变量描述。要描述两本书，你需要使用两个变量，以此此类推。为了处理几本书，你可以使用此类结构体的数组，这就是我们在下一个程序中所创建的，所示于列表\
  \ 14.2。（如果你正在使用 Borland C/C++，请参见本章稍后的“Borland 与浮点数”。）\n\n***\n\n### 结构体与内存\n\n\
  `manybook.c` 程序使用包含 100 个结构体的数组。由于该数组是一个自动类对象，信息通常被放置在栈上。如此大的数组需要大量的内存，这可能会导致问题。如果你遇到运行时错误，提示栈大小太小或栈溢出，那么你的编译器可能使用的默认栈大小对于此示例来说太小了。要修复此，你可以使用编译器选项将栈大小设置为\
  \ 10,000 以容纳结构体数组，或者可以将数组设为 `static` 或外部（这样它就不会被放置在栈中），或者你可以将数组缩小到 16。为什么我们不一开始就让栈变小？因为你应该了解潜在的栈大小，以便在你遇到它时能够应对。\n\
  \n***\n\n#### 列表 14.2 manybook.c 程序\n\n点击此处查看代码图像\n\n***\n\n```c\n/* manybook.c\
  \ -- 多本书库存 */\n#include <stdio.h>\n#include <string.h>\nchar * s_gets(char * st,\
  \ int n);\n#define MAXTITL  40\n#define MAXAUTL  40\n#define MAXBKS  100    /* 最大书籍数量\
  \ */\nstruct book {           /* 设置书籍模板 */\n    char title[MAXTITL];\n    char author[MAXAUTL];\n\
  \    float value;\n};\nint main(void)\n{\n    struct book library[MAXBKS]; /* 结构体数组\
  \ */\n    int count = 0;\n    int index;\n    printf(\"请输入书名。\\n\");\n    printf(\"\
  行首按 [回车] 停止。\\n\");\n    while (count < MAXBKS && s_gets(library[count].title, MAXTITL)\
  \ != NULL\n          && library[count].title[0] != '\\0')\n    {\n        printf(\"\
  现在输入作者。\\n\");\n        s_gets(library[count].author, MAXAUTL);\n        printf(\"\
  现在输入数值。\\n\");\n        scanf(\"%f\", &library[count++].value);\n        while (getchar()\
  \ != '\\n')\n            continue;      /* 清空输入行 */\n    }\n}\n```\n\n\n\n\n```c\n\
  if (count < MAXBKS) {\n    printf(\"Enter the next title.\\n\");\n}\n\nif (count\
  \ > 0) {\n    printf(\"Here is the list of your books:\\n\");\n    for (index =\
  \ 0; index < count; index++)\n        printf(\"%s by %s: $%.2f\\n\", library[index].title,\
  \ library[index].author, library[index].value);\n}\nelse\n    printf(\"No books?\
  \ Too bad.\\n\");\nreturn 0;\n}\n\nchar * s_gets(char * st, int n) {\n    char *\
  \ ret_val;\n    char * find;\n    ret_val = fgets(st, n, stdin);\n    if (ret_val)\
  \ {\n        find = strchr(st, '\\n'); // look for newline\n        if (find) //\
  \ if the address is not NULL,\n            *find = '\\0'; // place a null character\
  \ there\n        else\n            while (getchar() != '\\n')\n            continue;\
  \ // dispose of rest of line\n    }\n    return ret_val;\n}\n```\n\n## Borland C\
  \ 与浮点数\n\n旧版本的 Borland C 编译器会尝试通过使用较小版本的 `scanf()` 来使程序更加紧凑，前提是程序没有使用浮点值。然而，编译器（通过\
  \ Borland C/C++ 3.1 用于 DOS，但并不包括 Borland C/C++ 4.0）会被欺骗，如果唯一的浮点值位于结构体数组中，正如列表 14.2\
  \ 所示。结果，你会得到类似这样的消息：\n\n`scanf : floating point formats not linked`\n`Abnormal program\
  \ termination`\n\n### Borland C 浮点数链接问题的解决方法\n\n一种解决方法是在你的程序中添加以下代码：\n\n```c\n#include\
  \ <math.h>\ndouble dummy = sin(0.0);\n```\n\n这段代码强制编译器加载 `scanf()` 的浮点数版本。\n\n以下是示例程序的运行情况所示：\n\
  \n点击此处查看代码图像\n\n请输入书名。\n在行首按 [enter] 键停止。\n我的鹦鹉生活\n现在输入作者。\nMack Zackles\n现在输入数值。\n\
  12.95\n输入下一个书名。\n...更多输入...\n\n以下是你的书籍列表：\nMy Life as a Budgie by Mack Zackles:\
  \ $12.95\nThought and Unthought Rethought by Kindra Schlagmeyer: $43.50\nConcerto\
  \ for Financial Instruments by Filmore Walletz: $49.99\nThe CEO Power Diet by Buster\
  \ Downsize: $19.25\nC++ Primer Plus by Stephen Prata: $59.99\nFact Avoidance: Perception\
  \ as Reality by Polly Bull: $19.97\nCoping with Coping by Dr. Rubin Thonkwacker:\
  \ $0.02\nDiaphanous Frivolity by Neda McFey: $29.99\nMurder Wore a Bikini by Mickey\
  \ Splats: $18.95\nA History of Buvania, Volume 8, by Prince Nikoli Buvan: $50.04\n\
  Mastering Your Digital Watch, 5nd Edition, by Miklos Mysz: $28.95\nA Foregone Confusion\
  \ by Phalty Reasoner: $5.99\nOuts Government: Selection. Election by Ima Pund: $33.33\n\
  \n首先，我们将描述如何声明结构体数组以及如何访问单个成员。然后，我们将重点介绍程序中的两个方面。\n\n#### 声明结构体数组\n\n声明结构体数组与声明任何类型的数组都是类似的。这里有一个示例：\n\
  \n```c\nstruct book library[MAXBKS];\n```\n\n这声明 `library` 为一个具有 `MAXBKS` 个元素的数组。该数组的每个元素都是一个\
  \ `book` 结构体。因此，`library[0]` 是一个 `book` 结构体，`library[1]` 是第二个 `book` 结构体，依此类推。图\
  \ 14.2 可能会帮助你直观地理解这一点。`library` 本身并不是结构体名；它是一个元素为 `struct book` 结构体的数组名。\n\n![Image](img/14fig02.jpg)\n\
  图 14.2 结构体数组。\n\n#### 识别结构体数组的成员\n\n要识别结构体数组的成员，你适用与用于单个结构体相同的规则：在结构体名后跟点运算符，然后是跟成员名。这里有一个示例：\n\
  \n```c\nlibrary[0].value // 与第一个数组元素关联的值\nlibrary[4].title // 与第五个数组元素关联的标题\n```\n\
  \n注意数组下标是附加在 `library` 之上的，而不是名称末尾：\n\n`library.value[2]` // 错误\n`library[2].value`\
  \ // 正确\n\n使用 `library[2].value` 的原因是 `library[2]` 是结构体名，就像 `library[1]` 是另一个结构体名一样。顺便问一下，你认为以下内容代表什么？`library[2].title[4]`\n\
  \n它是指由第三个结构体（`library[2]` 部分）所描述的书籍标题中的第五个字符（`title[4]` 部分）。在示例中，它将是字符 B。这个例子指出，位于点运算符右侧的下标适用于单个成员，而位于左侧的下标适用于数组。\n\
  \n```\nlibrary // 结构体数组\nlibrary[2] // 结构体\nlibrary[2].title // 字符数组（结构体成员）\nlibrary[2].title[4]\
  \ // 字符（结构体成员）\n```\n\n#### 程序讨论\n\n现在让我们完成程序。与第一个程序的主要区别在于我们插入了一个循环来读取多个条目。循环从这个\
  \ `while` 条件开始：\n\n```c\nwhile (count < MAXBKS && s_gets(library[count].title, MAXTITL)\
  \ != NULL\n      && library[count].title[0] != '\\0')\n```\n\n`s_gets(library[count].title,\
  \ MAXTITL)` 读取书籍标题；如果 `s_gets()` 尝试读取文件结束，表达式为 `NULL`。`library[count].title[0] !=\
  \ '\\0'` 测试字符串的第一个字符是否为空字符（即，如果用户按了 Enter 键，则字符串为空）。正如你从之前的章节中记得，这段代码补偿了 `scanf()`\
  \ 函数忽略空格和换行符。当你响应书籍数值请求时，你输入如下内容：\n\n`12.50[enter]`\n\n该语句传输了字符序列：`12.50\\n`。`scanf()`\
  \ 函数收集了 `1`、`2`、`.`、`5` 和 `0`，但它将 `\\n` 留在那里，等待后续的读取语句。如果没有这段预防性代码，下一个读取语句 `s_gets(library[count].title,\
  \ MAXTITL)` 将读取留下的换行符作为空行，程序会认为你发送了停止信号。我们插入的代码将一直消耗字符直到找到并处理换行符。这为 `s_gets()` 的下次输入提供了新的开始。\n\
  \n```c\nwhile (getchar() != '\\n')\n    continue; // 清空输入行\n```\n\n让我们回到结构体。\n\n\
  ### 嵌套结构体\n\n有时让一个结构体包含或*嵌套*另一个结构体非常方便。例如，Shalala Pirosky 正在构建一个关于她的朋友信息的结构体。结构体的一个成员自然然是朋友的名字。然而，名字本身可以通过另一个结构体来表示，具有独立的姓和名成员条目。列表\
  \ 14.3 是 Shalala 工作的一个简短示例。\n\n```c\n// friend.c -- 嵌套结构体的示例\n#include <stdio.h>\n\
  #define LEN 20\nconst char * msgs[5] =\n{\n    \"感谢你带来如此美好的夜晚， \",\n    \"你确实证明了一个\
  \ 是一个很特殊的男人。我们必须再次聚聚\",\n    \"一起吃美味的 \",\n    \" 并大笑一场\"\n};\n```\n\n\n\n\n\n```c\n\
  struct names { // first structure\n    char first[LEN];\n    char last[LEN];\n};\n\
  \nstruct guy { // second structure\n    struct names handle; // nested structure\n\
  \    char favfood[LEN];\n    char job[LEN];\n    float income;\n};\n\nint main(void)\n\
  {\n    struct guy fellow = { // initialize a variable\n        { \"Ewen\", \"Villard\"\
  \ },\n        \"grilled salmon\",\n        \"personality coach\",\n        68112.00\n\
  \    };\n\n    printf(\"Dear %s, \\n\\n\", fellow.handle.first);\n    printf(\"\
  %s%s.\\n\", msgs[0], fellow.handle.first);\n    printf(\"%s%s\\n\", msgs[1], fellow.job);\n\
  \    printf(\"%s\\n\", msgs[2]);\n    printf(\"%s%s%s\", msgs[3], fellow.favfood,\
  \ msgs[4]);\n\n    if (fellow.income > 150000.0)\n        puts(\"!!\");\n    else\
  \ if (fellow.income > 75000.0)\n        puts(\"!\");\n    else\n        puts(\"\
  .\");\n\n    printf(\"\\n%40s%s\\n\", \" \", \"See you soon,\");\n    printf(\"\
  %40s%s\\n\", \" \", \"Shalala\");\n    return 0;\n}\n```\n\n***\n\n这里是输出：\n\n点击此处查看代码图片\n\
  \n亲爱的 Ewen，\n\n    感谢你这个美好的夜晚，Ewen。\n\n你确实证明了性格教练\n是一种特殊的家伙。我们必须找聚在一起，\n一起吃顿美味的烤三文鱼并大笑一场。\n\
  \                               回头见，\n                                 Shalala\n\
  \n首先，注意在结构体声明中是如何设置嵌套结构体的。它被简单地声明，就像声明一个 `int` 变量一样：\n\n`struct names handle;`\n\
  \n该声明表示 `handle` 是一个 `struct names` 类型的变量。当然，该文件也应该包含 `names` 结构的声明。\n\n其次，注意你是如何访问嵌套结构体的成员的；你只需要使用两次点运算符：\n\
  \n点击此处查看代码图片\n\n`printf(\"Hello, %s!\\n\", fellow.handle.first);`\n\n该构造按照以下方式解释，从左到右：\n\
  \n`(fellow.handle).first`\n\n即：找到 `fellow`，然后找到 `fellow` 的成员 `handle`，然后找到该成员的 `first`\
  \ 成员。\n\n### 结构体指针\n\n指针爱好者会很高兴地知道你可以拥有指向结构体的指针。拥有指向结构体指针的好主意至少有四个理由。首先，就像数组指针（例如在排序问题中）比数组本身更容易操作，结构体指针通常比结构体本身更容易操作。其次，在某些旧的实现中，结构体不能作为参数传递给函数，但结构体指针可以。第三，即使你可以将结构体作为参数传递，传递指针通常更高效。第四，许多奇妙的数据表示包含了指向其他结构指针的结构体。\n\
  \n下一个短示例（参见列表 14.4）展示了如何定义指向结构体的指针，以及如何使用它来访问结构体的成员。\n\n列表 14.4 `friends.c` 点击此处查看代码图片\n\
  \n***\n\n```c\n/* friends.c -- 指向结构体的指针 */\n#include <stdio.h>\n#define LEN 20\n\
  struct names {\n    char first[LEN];\n    char last[LEN];\n};\nstruct guy {\n  \
  \  struct names handle;\n    char favfood[LEN];\n    char job[LEN];\n    float income;\n\
  };\nint main(void)\n{\n    struct guy fellow[2] = {\n        {{ \"Ewen\", \"Villard\"\
  \ }, \"grilled salmon\", \"personality coach\", 68112.00},\n        {{ \"Rodney\"\
  , \"Swillbelly\" }, \"tripe\", \"tabloid editor\", 22400.00}\n    };\n    struct\
  \ guy * him; // 这里是一个指向结构体的指针\n    printf(\"address #1: %p %2: %p\\n\", &fellow[0],\
  \ &fellow[1]);\n    him = &fellow[0]; // 告诉指针指向哪里\n    printf(\"pointer #1: %p #2:\
  \ %p\\n\", him, him + 1);\n    printf(\"him->income is $%.2f: (*him).income is $%.2f\\\
  n\", him->income, (*him).income);\n    him++; // 指向下一个结构\n    printf(\"him->favfood\
  \ is %s: him->handle.last is %s\\n\", him->favfood, him->handle.last);\n    return\
  \ 0;\n}\n```\n\n***\n\n输出如下：\n\n点击此处查看代码图片\n\naddress #1: 0x7fff5ff820 #2: 0x7fff5ff874\n\
  pointer #1: 0x7fff5ff820 #2: 0x7fff5ff874\nhim->income is $68112.00: (*him).income\
  \ is $68112.00\nhim->favfood is tripe: him->handle.last is Swillbelly\n\n让我们先看我们是如何创建一个指向\
  \ `guy` 结构体的指针的。然后我们将解释如何使用指针来指定单个结构体成员。\n\n#### 声明和初始化结构体指针\n\n声明可以简单到极致：\n\n`struct\
  \ guy * him;`\n\n首先是关键字 `struct`，然后是结构体标记 `guy`，接着是星号 `*` 加上指针名。语法与你见过的其他指针声明相同。\n\
  \n此声明并没有创建一个新的结构体，但指针 `him` 现在可以被指向任何 `guy` 类型的结构体。例如，如果 `barney` 是一个 `guy` 类型的结构体，你可以这样做：\n\
  \n`him = &barney;`\n\n与数组的情况不同，结构体的名称并不是结构体的地址；你需要使用 `&` 运算符。\n\n在示例中，`fellow` 是一个结构体数组，这意味着\
  \ `fellow[0]` 是一个结构体，因此通过以下代码初始化 `him` 指向 `fellow[0]`：\n\n`him = &fellow[0];`\n\n\
  前两行显示了赋值成功。比较这两行，你会发现 `him` 指向 `fellow[0]`，而 `him + 1` 指向 `fellow[1]`。注意对 `him`\
  \ 加 `1` 是增加了 8 字节。\n\n#### 通过指针访问成员\n\n指针 `him` 指向结构体 `fellow[0]`。如何使用 `him` 获取\
  \ `fellow[0]` 成员的值？第三行输出显示了两种方法。\n\n第一种方法也是常用的，使用了一个新运算符 `->`。该运算符由字符 `-` 后跟大于符号\
  \ `>` 组成。我们有这些关系：\n\n点击此处查看代码图片\n\n`him->income is barney.income if him == &barney`\n\
  `him->income is fellow[0].income if him == &fellow[0]`\n\n换句话说，结构体指针接 `->` 运算符与结构体名称接\
  \ `.`（点）运算符的作用相同。（你不能正确地说 `him.income`，因为 `him` 不是结构体名称。）\n\n重要的是 `him` 是一个指针，但\
  \ `him->income` 是所指向结构体的成员。因此在这种情况下，`him->income` 是一个 `float` 变量。\n\n指定结构体成员值的第二种方法遵循以下序列：如果\
  \ `him == &fellow[0]`，那么 `*him == fellow[0]`，因为 `&` 和 `*` 是互逆运算符。因此，通过替换，你得到了：\n\
  \n点击此处查看代码图片\n\n`fellow[0].income == (*him).income`\n\n括号是必要的，因为 `.` 运算符的优先级高于 `*`。\n\
  \n总结，如果 `him` 是指向名为 `barney` 的 `guy` 类型结构体的指针，以下所有都是等价的：\n\n点击此处查看代码图片\n\n`barney.income\
  \ == (*him).income == him->income` // 假设 him == &barney\n\n\n\n\n回想一下，函数参数将值传递给函数。每个值都是数字——可能是\
  \ `int`，可能是 `float`，可能是 ASCII 字符编码，也可能是一个地址。结构比单个值要复杂一点，因此，古老的 C 实现不允许结构用作函数的参数，这并不意外。这种限制在较新的实现中被消，ANSI\
  \ C 允许结构作为参数使用。因此，现代实现让你能够选择：将结构作为参数传递，或者将结构指针作为参数传递——或者，如果你只关心结构的一部分，你可以将结构成员作为参数传递。我们将检查这三种方法，首先从将结构成员作为参数开始。\n\
  \n## 传递结构成员\n\n只要结构成员是具有单一值的数据类型（即 `int` 或其相关的类型：`char`、`float`、`double` 或指针），它就可以作为函数参数传递给接受该特定类型的函数。代码列表\
  \ 14.5 中那个初创的财务分析程序（它将客户的银行账户加到其储蓄和贷款账户中）说明了这一点。\n\n代码列表 14.5 funds1.c 程序\n\n点击此处查看代码图像\n\
  \n```\n/* funds1.c -- 将结构成员作为参数 */\n#include <stdio.h>\n\n#define FUNDLEN 50\n\n\
  struct funds {\n    char   bank[FUNDLEN];\n    double bankfund;\n    char   save[FUNDLEN];\n\
  \    double savefund;\n};\n\ndouble sum(double, double);\n\nint main(void)\n{\n\
  \    struct funds stan = {\n        \"Garlic-Melon Bank\",\n        4032.27,\n \
  \       \"Lucky's Savings and Loan\",\n        8543.94\n    };\n    printf(\"Stan\
  \ has a total of $%.2f.\\n\",\n           sum(stan.bankfund, stan.savefund) );\n\
  \    return 0;\n}\n\n/* 将两个 double 数字相加 */\ndouble sum(double x, double y)\n{\n\
  \    return(x + y);\n}\n```\n\n这是运行此程序的结果：\n\nStan has a total of $12576.21.\n\n\
  啊，它可以工作。注意，函数 `sum()` 既不知道也不乎实际参数是否是结构的成员；它只需要参数的类型为 `double`。\n\n当然，如果你想让被调用的函数影响调用函数中成员的值，你可以传递该成员的地址：\n\
  \n`modify(&stan.bankfund);`\n\n这将是一个修改 Stan 银行账户的函数。\n\n告知函数关于结构的另一种方法是让被调用的函数知道它正在处理一个结构。\n\
  \n## 使用结构地址\n\n我们将解决与之前相同的问题，但这次使用结构的地址作为参数。由于函数必须处理 `funds` 结构，它也必须使用 `funds` 的声明。程序请参阅\
  \ 代码列表 14.6。\n\n代码列表 14.6 funds2.c 程序\n\n点击此处查看代码图像\n\n```\n/* funds2.c -- 传递指向结构的指针\
  \ */\n#include <stdio.h>\n\n#define FUNDLEN 50\n\nstruct funds {\n    char   bank[FUNDLEN];\n\
  \    double bankfund;\n    char   save[LENLEN];\n    double savefund;\n};\n\ndouble\
  \ sum(const struct funds *);  /* 参数是一个指针 */\nint main(void)\n{\n    struct funds\
  \ stan = {\n        \"Garlic-Melon Bank\",\n        4032.27,\n        \"Lucky's\
  \ Savings and Loan\",\n        8543.94\n    };\n    printf(\"Stan has a total of\
  \ $%.2f.\\n\", sum(&stan));\n    return 0;\n}\n\ndouble sum(const struct funds *\
  \ money)\n{\n    return(money->bankfund + money->savefund);\n}\n```\n\n这同样产生了以下输出：点击此处查看代码图像\n\
  \nStan has a total of $12576.21.\n\n`sum()` 函数使用指向 `funds` 结构的指针 (`money`) 作为其参数。将地址\
  \ `&stan` 传递给函数会导致指针 `money` 指向结构 `stan`。然后使用 `->` 运算符来获取 `stan.bankfund` 和 `stan.savefund`\
  \ 的值。由于函数没有修改指向的值，它将 `money` 声明为指向 `const` 的指针。此函数也可以访问机构名称，尽管它没有使用它们。注意，你必须使用 `&`\
  \ 运算符来获取结构的地址。与数组名不同，结构名本身并不是其地址的同义词。\n\n## 将结构作为参数\n\n对于允许结构作为参数的编译器，上一个示例可以像 代码列表\
  \ 14.7 所示所示重写。\n\n代码列表 14.7 funds3.c 程序\n\n点击此处查看代码图像\n\n```\n/* funds3.c -- 传递结构\
  \ */\n#include <stdio.h>\n#define FUNDLEN 50\n\nstruct funds {\n    char   bank[FUNDLEN];\n\
  \    double bankfund;\n    char   save[FUNDLEN];\n    double savefund;\n};\n\ndouble\
  \ sum(struct funds moolah); /* 参数是结构 */\nint main(void)\n{\n    struct funds stan\
  \ = {\n        \"Garlic-Melon Bank\",\n        4032.27,\n        \"Lucky's Savings\
  \ and Loan\",\n        8543.94\n    };\n    printf(\"Stan has a total of $%.2f.\\\
  n\", sum(stan));\n    return 0;\n}\n\ndouble sum(struct funds moolah)\n{\n    return(moolah.bankfund\
  \ + moolah.savefund);\n}\n```\n\n再次，输出为：\n\nStan has a total of $12576.21.\n\n我们用\
  \ `struct funds` 变量 `moolah` 替换了 `money`（后者是结构指针的指针）。当调用 `sum()` 时，创建了一个名为 `moolah`\
  \ 的自动变量。该结构的成员被初始化为 `stan` 结构中对应成员的值的副本。因此，计算是通过使用该结构的副本完成的；而之前的程序（使用指针的那一个）使用的是\
  \ `money->bankfund`。\n\n## 关于结构性的更多信息\n\n现代 C 允许将一个结构赋值给另一个结构，这在数组上是不行的。也就是说，如果\
  \ `n_data` 和 `o_data` 都是相同类型的结构，你可以执行以下操作：\n\n点击此处查看代码图像\n\n`o_data = n_data;` //\
  \ 将一个结构赋值给另一个\n\n这会导致 `n_data` 的每个成员都被赋予 `o_data` 对应成员的值。即使某个成员恰好是数组，这同样有效。此外，你还可以将一个结构初始化为另一个：\n\
  \n点击此处查看代码图像\n\n`struct names right_field = {\"Ruthie\", \"George\"};`\n`struct\
  \ names captain = right_field;` // 初始化另一个结构\n\n在现代 ANSI C 中，结构不仅可以作为函数参数传递，还可以作为函数的返回值。将结构作为函数参数允许你将结构信息传递给函数；函数返回结构允许你将结构信息从被调用函数传递给调用函数。结构指针也允许双向通信，因此你可以使用任何方法来解决编程问题。为了对比这两种方法，我们将编写一个使用指针处理结构的程序；然后通过结构传递和结构返回来重写它。程序本身询问你的名和姓，并报告其中字母的总数。这个项目并不真正需要结构，但它提供了一个观察它们如何运作的简单框架。代码列表\
  \ 14.8 展示了指针形式。\n\n```\n/* names1.c -- 使用指向结构的指针 */\n```\n\n\n\n```c\n#include <stdio.h>\n\
  #include <string.h>\n\n#define NLEN 30\n\nstruct namect {\n    char fname[NLEN];\n\
  \    char lname[NLEN];\n    int letters;\n};\n\nvoid getinfo(struct namect *);\n\
  \nvoid makeinfo(struct namect *);\nvoid showinfo(const struct namect *);\n\nchar\
  \ * s_gets(char * st, int n);\n\nint main(void)\n{\n    struct namect person;\n\
  \    getinfo(&person);\n    makeinfo(&person);\n    showinfo(&person);\n    return\
  \ 0;\n}\n\nvoid getinfo (struct namect * pst)\n{\n    printf(\"Please enter your\
  \ first name.\\n\");\n    s_gets(pst->fname, NLEN);\n    printf(\"Please enter your\
  \ last name.\\n\");\n    s_gets(pst->lname, NLEN);\n}\n\nvoid makeinfo (struct namect\
  \ * pst)\n{\n    pst->letters = strlen(pst->fname) +\n    strlen(pst->lname);\n\
  }\n\nvoid showinfo (const struct namect * pst)\n{\n    printf(\"%s %s, your name\
  \ contains %d letters.\\n\",\n           pst->fname, pst->lname, pst->letters);\n\
  }\n\nchar * s_gets(char * st, int n)\n{\n    char * ret_val;\n    char * find;\n\
  \    ret_val = fgets(st, n, stdin);\n    if (ret_val)\n    {\n        find = strchr(st,\
  \ '\\n');   // 查找换行符\n        if (find)               // 如果地址不是 NULL，\n        \
  \    *find = '\\0';            // 在处放置一个空字符\n        else\n            while (getchar()\
  \ != '\\n')\n                continue;           // 忽略行的剩余部分\n    }\n    return\
  \ ret_val;\n}\n```\n\n***\n\n编译并运行程序产生的结果如下：\n\n点击此处查看代码图像\n\nPlease enter your\
  \ first name.\nViola\n\nPlease enter your last name.\nPlunderfest\n\nViola Plunderfest,\
  \ your name contains 16 letters.\n\n该程序的工作分配给了三个由 `main()` 用的函数。在每种情况下，`person`\
  \ 结构的地址都被传递给了这些函数。\n\n`getinfo()` 函数将信息从自身传递到 `main()`。具体来说，它从用户处获取名称并使用 `pst` 指针定位，将其放入\
  \ `person` 结构中。记住 `pst->lname` 意味着 `pst` 所指向的结构的 `lname` 成员。这使得 `pst->lname` 等同于\
  \ `char` 数组名，因此是 `gets()` 的合适参数。注意，尽管 `getinfo()` 向主程序传递了信息，但它没有使用返回机制，因此它的类型是 `void`。\n\
  \n`makeinfo()` 函数执行信息的双向传递。通过使用指向 `person` 的指针，它定位了存储体中的两个名称。它使用 C 库函数 `strlen()`\
  \ 计算每个名称的字母总数，然后使用 `person` 的地址存储总和。同样，其类型为 `void`。最后，`showinfo()` 函数使用指针定位要打印的信息。由于该函数没有修改数组的内容，因此它将指针声明为\
  \ `const`。\n\n在所有这些操作中，只有一个结构变量 `person`，并且每个函数都使用结构地址来访问它。一个函数将信息从自身传递到调用程序，一个将信息从调用程序传递到自身，而一个两者都做了。\n\
  \n现在让我们看看如何使用结构参数和返回值来编写相同的任务。首先，若要传递结构本身，请使用参数 `person` 而不是 `&person`。那么，对应的形式参数声明类型为\
  \ `struct namect` 而不是该类型的指针。其次，为了向 `main()` 提供结构，你可以返回一个结构。列表 14.9 展示了非指针版本。\n\n\
  ### 列表 14.9 names2.c\n点击此处查看代码图像\n\n***\n\n```c\n/* names2.c -- 传递并返回结构 */\n#include\
  \ <stdio.h>\n#include <string.h>\n#define NLEN 30\nstruct namect {\n    char fname[NLEN];\n\
  \    char lname[NLEN];\n    int letters;\n};\nstruct namect getinfo(void);\nstruct\
  \ namect makeinfo(struct namect);\nvoid showinfo(struct namect);\nchar * s_gets(char\
  \ * st, int n);\nint main(void)\n{\n    struct namect person;\n    person = getinfo();\n\
  \    person = makeinfo(person);\n    showinfo(person);\n    return 0;\n}\nstruct\
  \ namect getinfo(void)\n{\n    struct namect temp;\n    printf(\"Please enter your\
  \ first name.\\n\");\n    s_gets(temp.fname, NLEN);\n    printf(\"Please enter your\
  \ last name.\\n\");\n    s_gets(temp.lname, NLEN);\n    return temp;\n}\nstruct\
  \ namect makeinfo(struct namect info)\n{\n    info.letters = strlen(info.fname)\
  \ + strlen(info.lname);\n    return info;\n}\nvoid showinfo(struct namect info)\n\
  {\n    printf(\"%s %s, your name contains %d letters.\\n\",\n           info.fname,\
  \ info.lname, info.letters);\n}\nchar * s_gets(char * st, int n)\n{\n    char *\
  \ ret_val;\n    char * find;\n    ret_val = fgets(st, n, stdin);\n    if (ret_val)\n\
  \    {\n        find = strchr(st, '\\n');   // 查找换行符\n        if (find)        \
  \       // 如果地址不是 NULL，\n            *find = '\\0';            // 在处放置一个空字符\n  \
  \      else\n            while (getchar() != '\\n')\n                continue; \
  \          // 忽略行的剩余部分\n    }\n    return ret_val;\n}\n```\n\n***\n\n这个版本与之前的产生相同的最终结果，但它的执行方式不同。三个函数中的每一个都创建了自己的\
  \ `person` 副本，因此该程序使用了四个不同的结构，而不仅仅是一个。\n\n以 `makeinfo()` 函数为例。在第一个程序中，传递了 `person`\
  \ 的地址，函数处理了实际的 `person` 值。在第二个版本中，创建了一个新结构 `info`。存储在 `person` 中的值被拷贝到 `info`，函数在副本上工作。因此，当计算出字母数时，它存储在\
  \ `info` 中，而不是 `person` 中。然而，返回机制解决了这个问题。注意 `makeinfo()` 函数必须声明为 `struct namect`，因为它返回一个结构。\n\
  \n#### 结构还是结构指针？\n\n假设你必须编写一个结构相关的函数。你应该使用结构指针作为参数，还是使用结构参数和返回值？每种方法都有优缺点。\n\n指针参数方法的两个优点是它兼容旧版和新的\
  \ C 实现，并且速度快；你只需要传递一个地址。缺点是对你的数据保护较少。调用函数中的某些操作可能会意外影响原始数据。然而，ANSI C 增加的 `const`\
  \ 限定符解决了这个问题。例如，如果你在列表 11.8 的 `showinfo()` 函数中更改结构的任何成员，编译器都会将其视为错误。\n\n作为参数传递结构的一个优点是函数处理原始数据的副本，这比处理原始数据更安全。此外，编程风格往往更清晰。假设你定义了以下结构类型：\n\
  \n点击此处查看代码图像\n\n```c\nstruct vector {double x; double y;};\n```\n\n你想将向量 `ans` 设置为\
  \ `a` 和 `b` 之和。你可以编写一个结构传递并返回的函数，使得程序看起来像这样：\n\n点击此处查看代码图像\n\n```c\nstruct vector\
  \ ans, a, b;\nstruct vector sum_vect(struct vector, struct vector);\n```\n\n```c\n\
  ans = sum_vect(a,b);\n```\n\n对于工程师来说，之前的版本比指针版本看起来更自然，指针版本可能像这样：\n\n点击此处查看代码图像\n\
  \n```c\nstruct vector ans, a, b;\nvoid sum_vect(const struct vector *, const struct\
  \ vector *, struct vector *);\n```\n\n```c\nsum_vect(&a, &b, &ans);\n```\n\n\n\n\
  此外，在指针版本中，用户必须记住求和的地址应该是第一个参数还是最后一个参数。\n\n传递结构体的两个主要缺点是旧的实现可能无法处理这些代码，而且它会浪费时间和空间。将大型结构体传递给只使用其某一个或两个成员的函数是非常为浪费的。在这种情况下，传递指针或仅将所需的成员作为单独参数传递更有意义。\n\
  \n通常情况下，程序员出于效率考虑会使用结构体指针作为函数参数，并在需要时使用 `const` 来保护数据免受意外更改。按值传递结构体通常用于那些本身就很小的结构体。\n\
  \n## 结构体中的字符数组或字符指针\n\n到目前为止的示例都使用字符数组在结构体中存储字符串。你可能会想是否可以使用字符指针（`char *`）代替。例如，列表\
  \ 14.3\n\n```c\nstruct names veep = {\"Talia\", \"Summers\"};\nstruct pnames treas\
  \ = {\"Brad\", \"Fallingjaw\"};\n\nprintf(\"%s and %s\\n\", veep.first, treas.first);\n\
  ```\n\n这段代码是有效的且可以运行，但考虑一下字符串存储在哪里。对于 `struct names` 变量 `veep`，字符串存储在结构体内部；结构体分配了共\
  \ 40 字节来存储这两个名字。然而，对于 `struct pnames` 变量 `treas`，字符串存储在编译器存储字符串常量的地方。结构体持有的只是两个地址，在我们的系统上总共占用了\
  \ 16 字节。特别是，`struct pnames` 结构体没有为存储字符串分配空间。它只能用于已经在其他地方分配了空间的字符串，例如字符串常量或数组中的字符串。简而言之，`pnames`\
  \ 结构体中的指针应该只用于管理在程序其他地方创建并分配的字符串。\n\n让我们看看这种限制在何时成为问题。考虑以下代码：\n\n点击此处查看代码图像\n\n\
  ```c\nstruct names accountant;\nstruct pnames attorney;\n\nputs(\"Enter the last\
  \ name of your accountant:\");\nscanf(\"%s\", accountant.last);\n\nputs(\"Enter\
  \ the last name of your attorney:\");\nscanf(\"%s\", attorney.last);   /* 这里隐藏着危险\
  \ */\n```\n\n从语法上来说，这段代码没有问题。但输入存储在哪里呢？对于会计师，名字存储在 `accountant` 变量的最后一个成员中；该结构体拥有一个数组用来存放字符串。对于律师，`scanf()`\
  \ 被告知将字符串放在 `attorney.last` 提供的地址处。由于这是一个未初始化的变量，该地址可以是任何值，程序可能会尝试将名字放在任何地方。如果你足够幸运，程序可能会运行，至少在某些时候是这样——或者一次尝试就会导致你的程序崩溃停止。实际上，如果程序运行了，说明你运气不好，因为程序将存在一个你未察觉的危险编程错误。\n\
  \n所以，如果你想让结构体存储字符串，使用字符数组成员更为简单。存储字符指针有其用处，但它存在严重误用的可能性。\n\n## 结构体、指针与 malloc()\n\
  \n在结构体中使用指针处理字符串时，一种有意义的实例是：你使用 `malloc()` 分配内存并使用指针来存储地址。这种方法的优点是，你可以要求 `malloc()`\
  \ 只分配字符串所需的空间大小。你可以请求分配 4 字节来存储 `\"Joe\"`，并请求 18 字节来存储马达加斯加人名字 `\"Rasolofomasoandro\"\
  `。将列表 14.9 适配到这种方法并不费力。两个主要变化是更改结构体定义以使用指针代替数组，然后提供 `getinfo()` 函数的新版本。\n\n新的结构体定义看起来如下：\n\
  \n点击此处查看代码图像\n\n```c\nstruct namect {\n    char * fname;  // 使用指针代替数组\n    char\
  \ * lname;\n    int letters;\n};\n```\n\n新版本的 `getinfo()` 将输入读取到临时数组中，使用 `malloc()`\
  \ 分配存储空间，并将字符串复制到新分配的空间。它会对每个名字执行此操作：\n\n点击此处查看代码图像\n\n```c\nvoid getinfo (struct\
  \ namect * pst)\n{\n    char temp[SLEN];\n    printf(\"Please enter your first name.\\\
  n\");\n    s_gets(temp, SLEN);   // 分配内存存放名字\n    pst->fname = (char *) malloc(strlen(temp)\
  \ + 1); // 将名字拷贝到分配的内存\n    strcpy(pst->fname, temp);\n    printf(\"Please enter\
  \ your last name.\\n\");\n    s_gets(temp, SLEN);\n    pst->lname = (char *) malloc(strlen(temp)\
  \ + 1);\n    strcpy(pst->lname, temp);\n}\n```\n（注：由于提供的原文文本在结尾处似乎出现了重复或截断，上述翻译已根据提供的文本逻辑进行了完整处理。）\n\
  \n\n\n\n点击此处查看代码图像\n\n请输入您的名。\n\nFloresiensis\n\n请输入您的姓。\n\nMann\n\nFloresiensis\
  \ Mann，您的名字包含 16 个字母。\n\n## 复合字面量与结构 (C99)\n\nC99 的复合字面量（compound literal）功能不仅适用于数组也适用于结构。如果你只需要一个临时的结构体值，它非常有用。例如，你可以使用复合字面量创建一个结构，用作函数参数或赋值给另一个结构体。其语法是在花括号括起来初始化列表前加上圆括号括起来的类型名。例如，以下是\
  \ `struct book` 类型的复合字面量：\n\n点击此处查看代码图像\n\n```\n(struct book) {\"The Idiot\", \"\
  Fyodor Dostoyevsky\", 6.99}\n```\n\n列表 14.11 展示了一个使用复合字面量为结构体变量提供两个备选值的示例。（在编写时，某些（但不是所有）编译器都支持这一特性，但时间会解决这个问题。）\n\
  \n列表 14.11 complit.c 程序\n\n点击此处查看代码图像\n\n```c\n* * *\n\n/* complit.c -- compound\
  \ literals */\n\n#include <stdio.h>\n\n#define MAXTITL  41\n#define MAXAUTL  31\n\
  \nstruct book {           // 结构体模板：tag 为 book\n    char title[MAXTITL];\n    char\
  \ author[MAXAUTL];\n    float value;\n};\n\nint main(void)\n{\n    struct book readfirst;\n\
  \    int score;\n    printf(\"Enter test score: \");\n    scanf(\"%d\",&score);\n\
  \    if(score >= 84)\n        readfirst = (struct book) {\"Crime and Punishment\"\
  ,\n                                     \"Fyodor Dostoyevsky\",\n              \
  \                       11.25};\n    else\n        readfirst = (struct book) {\"\
  Mr. Bouncy's Nice Hat\",\n                                     \"Fred Winsome\"\
  ,\n                                     5.99};\n    printf(\"Your assigned reading:\\\
  n\");\n    printf(\"%s by %s: $%.2f\\n\",readfirst.title,\n      readfirst.author,\
  \ readfirst.value);\n    return 0;\n}\n\n* * *\n```\n\n你也可以将复合字面量用函数的参数。如果函数期望一个结构体，你可以将复合字面量作为实际参数传递：\n\
  \n点击此处查看代码图像\n\n```c\nstruct rect {double x; double y;};\ndouble rect_area(struct\
  \ rect r){return r.x * r.y;}\n...\n\ndouble area;\narea = rect_area( (struct rect)\
  \ {10.5, 20.0});\n```\n\n这会导致 `area` 被赋值为 `210.0`。\n\n如果函数期望一个地址，你可以传递复合字面量的地址：\n\
  \n点击此处查看代码图像\n\n```c\nstruct rect {double x; double y;};\ndouble rect_areap(struct\
  \ rect * rp){return rp->x * rp->y;}\n...\n\ndouble area;\narea = rect_areap( &(struct\
  \ rect) {10.5, 20.0});\n```\n\n这会导致 `area` 被赋值为 `210.0`。\n\n出现在任何函数之外的复合字面量具有静态存储期，而出现在块内部的则具有自动存储期。复合字面量的语法规则与普通列表相同。这意味着，例如，你可以使用指定初始化器（designated\
  \ initializers）。\n\n## 灵活数组成员 (C99)\n\nC99 有一项项名为灵活数组成员（flexible array member）的特性。它允许你声明一个结构，其最后一个成员是一个具有特殊属性的数组。一个特殊属性是该数组并不存在——至少，不是立刻存在。第二个特殊属性是，通过正确的代码，你可以像使用存在的那样使用灵活数组。这听起来可能有点奇怪，所以让我们来看看创建和使用带有灵活数组的结构的步骤。\n\
  \n首先，这些是声明灵活数组的规则：\n- 灵活数组成员必须是结构体的最后一个成员。\n- 必须至少还有另一个成员。\n- 灵活数组的声明方式与普通数组相同，只是括号是空的。\n\
  \n这里是一个说明这些规则的示例：\n\n点击此处查看代码图像\n\n```c\nstruct flex\n{\n    int count;\n    double\
  \ average;\n    double scores[]; // 灵活数组\n};\n```\n\n如果你声明一个类型为 `struct flex` 的变量，你无法对\
  \ `scores` 做任何事情，因为没有为它留出内存空间。事实上，设计意图并不是让你声明 `struct flex` 类型的变量。相反，你应该声明一个指向 `struct\
  \ flex` 的指针，然后使用 `malloc()` 为 `struct flex` 的普通内容加上灵活数组的任何额外空间分配内存。例如，假设你想让 `scores`\
  \ 代表一个五个 `double` 值的数组。那么你应该这样做：\n\n点击此处查看代码图像\n\n```c\nstruct flex * pf;\npf =\
  \ malloc(sizeof(struct flex) + 5 * sizeof(double));\n```\n\n现在你拥有一块足够存储 `count`、`average`\
  \ 以及五个 `double` 值的内存。你可以使用指针 `pf` 访问这些成员：\n\n点击此处查看代码图像\n\n```c\npf->count = 5;\n\
  pf->average = 18.0;\npf->scores[0] = 20.0;\npf->scores[1] = 19.0;\npf->scores[2]\
  \ = 18.0;\npf->scores[3] = 17.0;\npf->scores[4] = 16.0;\n```\n\n使用指定初始化器也可以实现此目的：\n\
  \n```c\npf = (struct flex) {.count = 5, .average = 18.0, .scores[] = {20.0, 19.0,\
  \ 18.0, 17.0, 16.0}};\n```\n\n这展示了灵活数组在第一种情况和五个值值在第二种情况。\n\n列表 14.12 进一步说明了这一点，让灵活数组代表五个值。\n\
  \n点击此处查看代码图像\n\n```c\n* * *\n\n/* flexmemb.c -- flexible array member */\n\n#include\
  \ <stdio.h>\n#include <stdlib.h>\n\nstruct flex\n{\n    int count;\n    double average;\n\
  \    double scores[]; // 灵活数组\n};\n\nvoid showFlex(const struct flex * p);\n\nint\
  \ main(void)\n{\n    struct flex *pf1, *pf2;\n    int n;\n    double tot;\n    int\
  \ i;\n\n    pf1 = malloc(sizeof(struct flex) + 5 * sizeof(double));\n    n = 5;\n\
  \    pf1->count = n;\n    tot = 0;\n    for (i = 0; i < n; i++)\n    {\n       \
  \ pf1->scores[i] = 20.0 - i;\n        tot += pf1->scores[i];\n    }\n    pf1->average\
  \ = tot / n;\n    showFlex(pf1);\n\n    pf2 = malloc(sizeof(struct flex) + 9 * sizeof(double));\n\
  \    n = 9;\n    pf2->count = n;\n    tot = 0;\n    for (i = 0; i < n; i++)\n  \
  \  {\n        pf2->scores[i] = 20.0 - i;\n        tot += pf2->scores[i];\n    }\n\
  \    pf2->average = tot / n;\n    showFlex(pf2);\n\n    free(pf1);\n    free(pf2);\n\
  \    return 0;\n}\n\nvoid showFlex(const struct flex * p)\n{\n    int i;\n    printf(\"\
  Scores : \");\n    for (i = 0; i < p->count; i++)\n    {\n        printf(\"%g \"\
  , p->scores[i]);\n    }\n    printf(\"\\nAverage: %g\\n\", p->average);\n}\n\n*\
  \ * *\n```\n\n这里是输出：\n\n点击此处查看代码图像\n\nScores : 20 19 18 17 16 \nAverage: 18\n\n\
  Scores : 20 19.5 19 18.5 18 17.5 17 16.5 16 \nAverage: 17\n\n带有灵活数组成员的结构确实有一些特殊的处理要求。首先，不要使用结构赋值来拷贝：\n\
  \n点击此处查看代码图像\n\n```c\nstruct flex * pf1, *pf2; // *pf1 和 *pf2 是结构体\n...\n*pf2 =\
  \ *pf1; // 不要这样做\n```\n\n这只会拷贝结构中的非灵活成员。相反，请使用第 16 章“C 预处理器和 C 标准库”中描述的 `memcpy()`\
  \ 函数。\n\n其次，不要在按值传递结构体的函数中使用这种结构。原因相同；按值传递参数就像赋值一样。相反，请使用传递结构地址的函数。\n\n第三，不要将带有灵活数组成员的结构作为数组的元素或另一个结构的成员。\n\
  \n\n\n\n\n你们中的某些人可能听过类似于灵活数组成员（flexible array member）的东西，被称为 `struct hack`。`struct\
  \ hack` 没有使用空括号来声明灵活成员，而是指定了一个大小为 0 的数组。然而，`struct hack` 是一种针对特定编译器（`GCC`）有效的技巧；它并不是标准\
  \ C 语言。灵活成员方法提供了一个标准认可的技巧版本。\n\n### 匿名结构体 (C11)\n\n匿名结构体是一个未命名结构体的结构体成员。为了了解它是如何运作的，首先考虑以下嵌套结构的设置：\n\
  \n点击此处查看代码图像\n\n```c\nstruct names\n{\n    char first[20];\n    char last[20];\n\
  };\n\nstruct person\n{\n    int id;\n    struct names name;  // 嵌套结构体成员\n};\n\n\
  struct person ted = {8483, {\"Ted\", \"Grass\"}};\n```\n\n在这里，`name` 成员是一个嵌套结构体，你可以使用像\
  \ `ted.name.first` 这样的表达式来访问 `\"Ted\"`：\n\n```c\nputs(ted.name.first);\n```\n\n\
  在 C11 中，你可以使用嵌套的匿名成员结构体来定义 `person`：\n\n点击此处查看代码图像\n\n```c\nstruct person\n{\n \
  \   int id;\n    struct {char first[20]; char last[20];};  // 匿名结构体\n};\n```\n\n\
  你可以以相同的方式初始化这个结构体：\n\n点击此处查看代码图像\n\n```c\nstruct person ted = {8483, {\"Ted\", \"\
  Grass\"}};\n```\n\n但访问变得简单了，因为你可以像使用 `person` 成员一样直接使用如 `first` 这样的成员名：\n\n```c\n\
  puts(ted.first);\n```\n\n当然，你完全可以直接将 `first` 和 `last` 变为 `person` 的直接成员，并消除嵌套结构体。匿名功能在嵌套联合体中变得更有用，我们将在本章稍后的部分讨论这一点。\n\
  \n### 使用结构体数组的函数\n\n假设你有一个想要用函数处理的结构体数组。数组名是其地址的同义词，因此它可以传递给函数。同样，函数需要访问结构体模板。为了展示它是如何运作的，列表\
  \ 14.13 将我们的货币程序扩展到两个人，使其包含一个由两个 `funds` 结构体的数组。\n\n列表 14.13 funds4.c 程序\n\n点击此处查看代码图像\n\
  \n* * *\n\n```c\n/* funds4.c -- 将结构体数组传递给函数 */\n#include <stdio.h>\n\n#define FUNDLEN\
  \ 50\n#define N 2\n\nstruct funds {\n    char   bank[FUNDLEN];\n    double bankfund;\n\
  \    char   save[FUNDLEN];\n    double savefund;\n};\n\ndouble sum(const struct\
  \ funds money[], int n);\n\nint main(void)\n{\n    struct funds jones[N] = {\n \
  \       {\n            \"Garlic-Melon Bank\",\n            4032.27,\n          \
  \  \"Lucky's Savings and Loan\",\n            8543.94\n        },\n        {\n \
  \           \"Honest Jack's Bank\",\n            3620.88,\n            \"Party Time\
  \ Savings\",\n            3802.91\n        }\n    };\n    printf(\"The Joneses have\
  \ a total of $%.2f.\\n\",\n           sum(jones,N));\n    return 0;\n}\n\ndouble\
  \ sum(const struct funds money[], int n)\n{\n    double total;\n    int i;\n   \
  \ for (i = 0, total = 0; i < n; i++)\n        total += money[i].bankfund + money[i].savefund;\n\
  \    return(total);\n}\n```\n* * *\n\n输出如下：\n\n点击此处查看代码图像\nThe Joneses have a total\
  \ of $20000.00. （多么均匀的和！人们甚至会认为这些数字是凑出来的。）\n\n数组名 `jones` 是数组的地址。具体来说，它是数组第一个元素的地址，即\
  \ `jones[0]`。因此，指针 `money` 最初由此表达式赋值：\n\n```c\nmoney = &jones[0];\n```\n\n由于 `money`\
  \ 指向 `jones` 数组的第一个元素，`money[0]` 是第一个元素的另一个名称。同样，`money[1]` 是第二个元素。每个元素都是一个 `funds`\
  \ 结构体，因此每个元素都可以使用点 (`.`) 运算符访问成员。\n\n这些是重点：\n- 你可以使用数组名将数组中第一个结构体的地址传递给函数。\n- 然后你可以使用数组符号来访问数组中的后续结构体。注意，函数调用\
  \ `sum(&jones[0], N)` 的效果与使用数组名相同，因为 `jones` 和 `&jones[0]` 是同一个地址。\n- 使用数组名只是传递结构体地址的一种间接方式。\n\
  - 由于 `sum()` 函数不应该修改原始数据，该函数使用了 ANSI C 的 `const` 限定符。\n\n### 将结构体内容保存到文件中\n\n由于结构体可以包含各种信息，因此它们是构建数据库的重要工具。例如，你可以使用结构体来存储关于员工或部件的所有相关信息。最终，你希望能够将这些信息保存到文件中并从文件中检索。一个数据库文件可以包含任意数量此类对象。结构体中持有的整个信息被称为*记录*\
  \ (record)，而单个项目则是*字段* (fields)。让我们研究一下这些主题。\n\n保存记录最明显的方法也许是效率最低的方法，那就是使用 `fprintf()`。例如，回想在\
  \ 列表 14.1 中引入的 `book` 结构体：\n\n```c\n#define MAXTITL 40\n#define MAXAUTL 40\nstruct\
  \ book {\n    char title[MAXTITL];\n    char author[MAXAUTL];\n    float value;\n\
  };\n```\n\n如果 `pbooks` 标识了一个文件流，你可以通过以下语句在名为 `primer` 的 `struct book` 变量中保存信息：\n\
  \n点击此处查看代码图像\n\n```c\nfprintf(pbooks, \"%s %s %.2f\\n\", primer.title, primer.author,\
  \ primer.value);\n```\n\n这种设置对于拥有 30 个成员的结构体来说变得非常笨拙。它还带来了检索问题，因为程序需要某种方法来告知一个字段何时结束，另一个字段何时开始。这个问题可以使用固定大小的字段（例如\
  \ `\"%39s%39s%8f\"`）来解决，但尴尬依然存在。\n\n更好的解决方案是使用 `fread()` 和 `fwrite()` 来读写结构体大小的单元。记住这些函数使用程序使用的相同的二进制表示。例如：\n\
  \n点击此处查看代码图像\n\n```c\nfwrite(&primer, sizeof (struct book), 1, pbooks);\n```\n\n\
  访问 `primer` 结构的起始地址，并将结构体的所有字节拷贝到 `pbooks` 关联的文件。`sizeof (struct book)` 项告诉函数拷贝多大的块，`1`\
  \ 表示只拷贝一个块。具有相同参数的 `fread()` 函数从文件中将结构体大小的数据块拷贝到 `&primer` 指向的位置。总之，这些函数一次读取整个记录，而不是一个字段。\n\
  \n用二进制表示保存数据的一个缺点是不同系统可能使用不同的二进制表示，因此数据文件可能不具有移植性。即使在同一个系统中，不同的编译器设置也可能导致不同的二进制布局。\n\
  \n### 结构体保存示例\n\n为了展示如何在程序这些函数，我们修改了 列表 14.2 中的程序，将书名保存到名为 `book.dat` 的文件中。如果该文件已存在，程序将显示其当前内容并允许你向文件中添加。列表\
  \ 14.14 展示了新版本。（如果你使用的是旧版本的 Borland 编译器，请查看 列表 14.2 附近侧栏中的“Borland C 和浮点数](#ch14.html_ch14sb01)”讨论。）\n\
  \n\n\n\n\n```c\n#include <string.h>\n\n#define MAXTITL  40\n\n#define MAXAUTL  40\n\
  \n#define MAXBKS   10          /* maximum number of books */\n\nchar * s_gets(char\
  \ * st, int n);\n\nstruct book {               /* set up book template */\n    char\
  \ title[MAXTITL];\n    char author[MAXAUTL];\n    float value;\n};\n\nint main(void)\n\
  {\n    struct book library[MAXBKS]; /* array of structures */\n    int count = 0;\n\
  \    int index, filecount;\n    FILE * pbooks;\n    int size = sizeof (struct book);\n\
  \    if ((pbooks = fopen(\"book.dat\", \"a+b\")) == NULL)\n    {\n        fputs(\"\
  Can't open book.dat file\\n\",stderr);\n        exit(1);\n    }\n    rewind(pbooks);\
  \               /* go to start of file */\n    while (count < MAXBKS &&  fread(&library[count],\
  \ size,\n                                     1, pbooks) == 1)\n    {\n        if\
  \ (count == 0)\n            puts(\"Current contents of book.dat:\");\n        printf(\"\
  %s by %s: $%.2f\\n\",library[count].title,\n              library[count].author,\
  \ library[count].value);\n        count++;\n    }\n    filecount = count;\n    if\
  \ (count == MAXBKS)\n    {\n        fputs(\"The book.dat file is full.\", stderr);\n\
  \        exit(2);\n    }\n    puts(\"Please add new book titles.\");\n    puts(\"\
  Press [enter] at the start of a line to stop.\");\n    while (count < MAXBKS &&\
  \ s_gets(library[count].title, MAXTITL) != NULL\n          && library[count].title[0]\
  \ != '\\0')\n    {\n        puts(\"Now enter the author.\");\n        s_gets(library[count].author,\
  \ MAXAUTL);\n        puts(\"Now enter the value.\");\n        scanf(\"%f\", &library[count++].value);\n\
  \        while (getchar() != '\\n')\n            continue;               /* clear\
  \ input line */\n        if (count < MAXBKS)\n            puts(\"Enter the next\
  \ title.\");\n    }\n    if (count > 0)\n    {\n        puts(\"Here is the list\
  \ of your books:\");\n        for (index = 0; index < count; index++)\n        \
  \    printf(\"%s by %s: $%.2f\\n\",library[index].title,\n              library[index].author,\
  \ library[index].value);\n        fwrite(&library[filecount], size, count - filecount,\n\
  \              pbooks);\n    }\n    else\n        puts(\"No books? Too bad.\\n\"\
  );\n    puts(\"Bye.\\n\");\n    fclose(pbooks);\n    return 0;\n}\n\nchar * s_gets(char\
  \ * st, int n)\n{\n    char * ret_val;\n    char * find;\n    ret_val = fgets(st,\
  \ n, stdin);\n    if (ret_val)\n    {\n        find = strchr(st, '\\n');   // look\
  \ for newline\n        if (find)                  // if the address is not NULL,\n\
  \            *find = '\\0';          // place a null character there\n        else\n\
  \            while (getchar() != '\\n')\n                continue;       // dispose\
  \ of rest of line\n    }\n    return ret_val;\n}\n```\n\n***\n\n我们将查看几次示例运行，然后讨论主要的编程要点。点击此处查看代码图片\n\
  \n$ booksave\nPlease add new book titles.\nPress [enter] at the start of a line\
  \ to stop.\nMetric Merriment\nNow enter the author.\nPolly Poetica\nNow enter the\
  \ value.\n18.99\nEnter the next title.\nDeadly Farce\nNow enter the author.\nDudley\
  \ Forse\nNow enter the value.\n15.99\nEnter the next title.\n[enter]\nHere is the\
  \ list of your books:\nMetric Merriment by Polly Poetica: $18.99\nDeadly Farce by\
  \ Dudley Forse: $15.99\nBye.\n\n$ booksave\nCurrent contents of book.dat:\nMetric\
  \ Merriment by Polly Poetica: $18.99\nDeadly Farce by Dudley Forse: $15.99\nPlease\
  \ add new book titles.\nThe Third Jar\nNow enter the author.\nNellie Nostrum\nNow\
  \ enter the value.\n22.99\nEnter the next title.\n[enter]\nHere is the list of your\
  \ books:\nMetric Merriment by Polly Poetica: $18.99\nDeadly Farce by Dudley Forse:\
  \ $15.99\nThe Third Jar by Nellie Nostrum: $22.99\nBye.\n\n$\n\n再次运行 `booksave.c`\
  \ 程序将显示所有三本书都为当前文件记录。\n\n### 程序要点\n\n首先，打开文件时使用了 `\"a+b\"` 模式。`a+` 部分允许程序读取整个文件并将数据附加到文件末尾。`b`\
  \ 是 ANSI 标准方法，表示程序将使用二进制文件格式。对于不接受 `b` 的 Unix 系统，你可以省略它，因为 Unix 无论如何都只有一种文件形式。对于其他非\
  \ ANSI 之前的实现，你可能需要找到与使用 `b` 的本地等价项。\n\n我们选择二进制模式是因为 `fread()` 和 `fwrite()` 是为二进制文件设计的。诚然结构中的某些内容是文本，但\
  \ `value` 成员不是。\n\n如果你使用文本编辑器查看 `book.dat`，文本部分将正常显示，但数值部分可能会导致你的编辑器崩溃。\n\n`rewind()`\
  \ 命令确保文件指针位于文件开头，准备好读取。\n\n初始的 `while` 循环每次读取一个结构到数组中，直到数组满为止。`filecount` 跟踪读取了多少个结构。这个\
  \ `while` 循环提示并获取用户输入。因为文件是以追加模式打开的，新条目被添加到文件末尾。\n\n`for` 循环打印来自文件和用户的数据。我们决定利用\
  \ `fwrite()` 一次写入多个块的能力。表达式 `count - filecount` 产生要添加的新标题数量，`fwrite()` 调用将该数量的结构大小块写入文件。`&library[filecount]`\
  \ 是数组中第一个新结构的地址，因此拷贝从该点开始。\n\n另一种方法是使用变长记录。为了方便从文件中读取此类记录，每个记录开头都有一个指定大小的数值字段。这比我们所做的复杂一点。通常，这种方法涉及“链式结构”（我们接下来将描述）以及动态内存分配（我们在第\
  \ 16 章 中讨论）。\n\n### 结构：接下来是什么？\n\n在结束对结构的探索之前，我们想提到结构的一个更重要的用途：创建新的数据形式。计算机用户开发特定问题的数据形式比我们提供的数组和简单结构高效得多。这些形式的名称如队列、二叉树、堆、哈希表和图。许多此类形式由链式结构构建。通常，每个结构包含一个或两个数据项以及指向相同类型其他结构的指针。这些指针将一个结构连接起来，并提供了一条允许你搜索整个集合的路径。\n\
  \n\n\n\n\n图 14.3 中显示的层级结构（或 `tree` 结构）比数组更高效？考虑一个具有 10 层节点的树。它有 `2¹⁰-1` 个或 `1,023`\
  \ 个节点，你可以在其中存储最多 `1,023` 个单词。如果这些单词按照某种合理的计划排列，你可以从顶层开始，在最多九次移动内找到任何单词，因为你的搜索会从一层向下移动到下一层。如果你将单词存储在数组中，你可能在找到你寻找的单词之前需要搜索所有的\
  \ 1,023 个元素。\n\n如果你对这类更高级的概念感兴趣，可以查阅任何关于数据结构的计算机科学书籍。通过 `C` 结构，你可以创建并使用这些书中呈现的几乎每种形式。此外，第\
  \ 17 章“高级数据表示](#ch17.html_ch17)”研究了这些高级形式中的某些。\n\n这是我们本章关于结构的最后说明，但我们将在第 17 章中展示链结构的示例。接下来，我们将查看处理数据的三个其他\
  \ `C` 特性：联合体（unions）、枚举（enumerations）和 `typedef`。\n\n### 联合体：快速浏览\n\n`union` 允许你在同一内存空间中存储不同数据类型（但不同同时存储）的类型。一个典型的用法是设计一个用于按某种既不规则也无法预先的顺序混合类型的类型。通过使用联合体数组，你可以创建一个等大小单元的数组，每个单元都可以容纳多种数据类型。\n\
  \n联合体的设置方式与结构非常相似。它有一个 `union` 模板和一个 `union` 变量。它们可以在一步中定义，也可以通过使用 `union` 标签（tag）分步定义。这里是一个带有标签的\
  \ `union` 模板的示例：\n\n```c\nunion hold {\n    int digit;\n    double bigfl;\n    char\
  \ letter;\n};\n```\n\n具有类似声明的结构能够存储一个 `int` 值、一个 `double` 值和一个 `char` 值。然而，这个联合体可以存储一个\
  \ `int` 值或一个 `double` 值或一个 `char` 值。\n\n以下是定义三个 `hold` 类型的联合体变量的示例：\n\n点击此处查看代码图像\n\
  \n```c\nunion hold fit;      // hold 类型的联合体变量\nunion hold save[10]; // 10 个联合体变量数组\n\
  union hold * pu;     // 指向 hold 类型变量的指针\n```\n\n第一个声明创建了一个单一变量 `fit`。编译器分配足够的空间，以容纳所描述的可能中最大的那个。在这种情况下，列出的最大可能性是\
  \ `double`，它在我们的系统上需要 64 位或 8 字节。第二个声明创建了一个名为 `save` 的数组，包含 10 个元素，每个元素的大小为 8 字节。第三个声明创建了一个可以持有\
  \ `hold` 联合体地址的指针。\n\n你可以初始化联合体。由于联合体只存储一个值，其规则与结构体不同。特别是，你有三个选择：你可以将联合体初始化为另一个相同类型的联合体，可以初始化联合体的第一个元素，或者在\
  \ C99 中，你可以使用指定初始化器（designated initializer）：\n\n点击此处查看代码图像\n\n```c\nunion hold valA;\n\
  valA.letter = 'R';\nunion hold valB = valA;  // 将一个联合体初始化为另一个\nunion hold valC =\
  \ {88};  // 初始化联合体的 digit 成员\nunion hold valD = {.bigfl = 118.2};  // 指定初始化器\n```\n\
  \n### 使用联合体\n\n以下是如何使用联合体：\n\n点击此处查看代码图像\n\n```c\nfit.digit = 23;   // 23 存储在 fit\
  \ 中；使用了 2 字节\nfit.bigfl = 2.0;  // 23 被清空，存储了 2.0；使用了 8 字节\nfit.letter = 'h'; //\
  \ 2.0 被清空，存储了 h；使用了 1 字节\n```\n\n点运算符（.）显示正在使用哪种数据类型。一次只存储一个值。你不能同时存储一个 `char` 和\
  \ `int`，尽管有足够的空间来这样做。你有责任编写程序，以跟踪当前存储在联合体中的数据类型。\n\n你可以像对指向结构体的指针使用运算符一样，以相同的方式对指向联合体的指针使用\
  \ `->` 运算符：\n\n点击此处查看代码图像\n\n```c\npu = &fit;\nx = pu->digit;  // 等同于 x = fit.digit\n\
  ```\n\n下下一个序列显示了*不应该*做的事：\n\n点击此处查看代码图像\n\n```c\nfit.letter = 'A';\nflnum = 3.02*fit.bigfl;\
  \   // 错误 错误 错误\n```\n\n这个序列是错误的，因为存储了 `char` 类型，但下一行假设 `fit` 的内容是 `double`。\n\n\
  \n\n\n\n点击此处查看代码图像\n\n`ptrst->code` `item.code` `(*ptrst).code`\n\n* * *\n\n###\
  \ 枚举类型 (Enumerated Types)\n\n你可以使用枚举类型来声明符号名称，以表示整数常量。通过使用 `enum` 关键字，你可以创建一个新的“类型”并指定它可能具有的值。（实际上，`enum`\
  \ 常量的类型是 `int`；因此，你可以在任何需要使用 `int` 的地方使用它们。）枚举类型的目的是增强程序的可读性。其语法与结构体使用的语法相似。例如，你可以进行这些声明：\n\
  \n点击此处查看代码图像\n\n```c\nenum spectrum {red, orange, yellow, green, blue, violet};\n\
  enum spectrum color;\n```\n\n第一个声明将 `spectrum` 了一个标签名（tag name），这允许你将 `enum spectrum`\
  \ 作为类型名。第二个声明使 `color` 成为该类型的变量。大括号内的标识符枚举了 `spectrum` 变量可能具有的所有值。因此，`color` 的可能值为\
  \ `red`、`orange`、`yellow` 等。这些符号常量被称为枚举员（enumerators）。然后，你可以使用如下所示的语句：\n\n点击此处查看代码图像\n\
  \n```c\nint c;\ncolor = blue;\nif (color == yellow)\n    ...;\nfor (color = red;\
  \ color <= violet; color++)\n    ...;\n```\n\n虽然像 `red` 和 `blue` 这样的枚举员类型是 `int`，但只要该类型能够容纳枚举常量，枚举变量对整数类型的限制就更加松散。例如，`spectrum`\
  \ 的枚举常量的范围是 0–5，因此编译器可以选择使用 `unsigned char` 来表示 `color` 变量。\n\n顺便提一下，某些 C 举属性并不会传递到\
  \ C++。例如，C 允许对枚举变量应用 `++` 运算符，而 C++ 标准则不允许。因此，如果你认为你的代码将来可能会合并到 C++ 程序中，你应该在上述的示例中将\
  \ `color` 声明为 `int` 类型。这样代码就可以在 C 或 C++ 中运行。\n\n#### enum 常量 (enum Constants)\n\n\
  `blue` 和 `red` 到底是什么？从技术上说，它们是 `int` 类型常量。例如，根据前面的枚举声明，你可以尝试这样做：\n\n点击此处查看代码图像\n\
  \n```c\nprintf(\"red = %d, orange = %d\\n\", red, orange);\n```\n\n输出如下：\n\n`red\
  \ = 0, orange = 1`\n\n发生的情况是 `red` 已经变成了一个表示整数 0 的命名常量。同样，其他标识符也是表示整数 1 到 5 的命名常量。你可以在任何可以使用整数常量的地方使用枚举常量。例如，你可以将它们作为数组声明中的尺寸，也可以将它们作为\
  \ `switch` 语句中的标签。\n\n#### 默认值 (Default Values)\n\n默认情况下，枚举列表中的常量被赋值为整数值 0、1、2 等。因此，如下声明：\n\
  \n点击此处查看代码图像\n\n```c\nenum kids {nippy, slats, skippy, nina, liz};\n```\n\n导致 `nina`\
  \ 的值为 `3`。\n\n#### 赋值值 (Assigned Values)\n\n你可以选择你希望常量拥有的整数值。只需在声明中包含所需的值即可：\n\n\
  点击此处查看代码图像\n\n```c\nenum levels {low = 100, medium = 500, high = 2000};\n```\n\n\
  如果你给一个常量赋值了值但没有给后续常量赋值，则后续常量将顺序编号。例如，假设你有有如下声明：\n\n点击此处查看代码图像\n\n```c\nenum feline\
  \ {cat, lynx = 10, puma, tiger};\n```\n\n那么 `cat` 默认为 `0`，而 `lynx`、`puma` 和 `tiger`\
  \ 分别为 `10`、`11` 和 `12`。\n\n#### enum 使用 (enum Usage)\n\n记住枚举类型的目的是增强程序的可读性并使其更于维护。如果你正在处理颜色，使用\
  \ `red` 和 `blue` 比比使用 `0` 和 `1` 要明显得多。注意，枚举类型是内部使用的。如果你想为 `color` 输入 `orange` 的值，你必须输入\
  \ `1` 而不是单词 `orange`，或者你可以读取字符串 `\"orange\"` 并让程序将其转换为值 `orange`。\n\n由于枚举类型是整数类型，`enum`\
  \ 变量可以像整数变量一样在表达式中使用。它们为 `case` 语句提供了方便的标签。\n\n代码列表 14.15 显示了一个使用 `enum` 的简短示例。该示例依赖于默认值赋值方案。这使得\
  \ `red` 的值为 `0`，使其成为指向字符串 `\"red\"` 指针的索引。\n\n列表 14.15 enum.c 程序\n\n点击此处查看代码图像\n\
  \n```c\n/* enum.c uses enumerated values */\n#include <stdio.h>\n#include <string.h>\n\
  #include <stdbool.h> // C99 feature\nenum spectrum {red, orange, yellow, green,\
  \ blue, violet};\nchar * colors[] = {\"red\", \"orange\", \"yellow\", \"blue\",\
  \ \"violet\"};\n#define LEN 30\nint main(void)\n{\n    char choice[LEN];\n    enum\
  \ spectrum color;\n    bool color_found = false;\n    puts(\"Enter a color (empty\
  \ line to quit):\");\n    while (s_gets(choice, LEN) != NULL && choice[0] != '\\\
  0')\n    {\n        for (color = red; color <= violet; color++)\n        {\n   \
  \         if (strcmp(choice, colors[color]) == 0)\n            {\n             \
  \   color_found = true;\n                break;\n            }\n        }\n    \
  \    if (color_found)\n            switch(color)\n            {\n              \
  \  case red: puts(\"Roses are red.\"); break;\n                case orange: puts(\"\
  Poppies are orange.\"); break;\n                case yellow: puts(\"Sunflowers are\
  \ yellow.\"); break;\n                case green: puts(\"Grass is green.\"); break;\n\
  \                case blue: puts(\"Bluebells are blue.\"); break;\n            \
  \    case violet: puts(\"Violets are violet.\"); break;\n            }\n       \
  \ else\n            printf(\"I don't know about the color %s.\\n\", choice);\n \
  \       color_found = false;\n        puts(\"Next color, please (empty line to quit):\"\
  );\n    }\n    puts(\"Goodbye!\");\n    return 0;\n}\n\nchar * s_gets(char * st,\
  \ int n)\n{\n    char * ret_val;\n    char * find;\n    ret_val = fgets(st, n, stdin);\n\
  \    if (ret_val)\n    {\n        find = strchr(st, '\\n'); // look for newline\n\
  \        if (find) // if the address is not NULL\n        {\n            *find =\
  \ '\\0'; // place a null character there\n        }\n        else\n        {\n \
  \           while (getchar() != '\\n')\n            {\n                continue;\
  \ // dispose of rest of line\n            }\n        }\n    }\n    return ret_val;\n\
  }\n```\n\n当输入字符串与 `colors` 数组成员指向的字符串之一匹配时，代码将跳出 `for` 循环。如果循环找到了匹配的颜色，程序随后使用枚举变量的值来匹配作为\
  \ case 标签的枚举常量。以下是示例运行：\n\n点击此处查看代码图像\n\nEnter a color (empty line to quit):\n\n\
  blue\n\nBluebells are blue.\n\nNext color, please (empty line to quit):\n\norange\n\
  \nPoppies are orange.\n\nNext color, please (empty line to quit):\n\npurple\n\n\
  I don't know about the color purple.\n\nNext color, please (empty line to quit):\n\
  \nGoodbye!\n\n\n\n\nC 使用 `namespace`（命名空间）术语来标识程序中识别名称的部分。作用域（Scope）是该概念的一部分：两个同名但位于不同作用域的变量不会冲突；同一作用域内的两个同名变量则会冲突。命名空间还有一个分类维度。在特定作用域内的结构标签（structure\
  \ tags）、联合体标签（union tags）和枚举标签（enumeration tags）共享同一个 `namespace`，而该命名空间与普通变量使用的命名空间不同。这意味着你可以在同一个作用域内对一个变量和一个标签使用相同的名称而不会引起错误，但你不能在同一个作用域内声明两个同名的标签或两个同名的变量。例如，以下代码在\
  \ C 中不会引起冲突：\n\n点击此处查看代码图片\n\n```c\nstruct rect { double x; double y; };\nint rect;\
  \ // 在 C 中不构成冲突\n```\n\n然而，以两种不同的方式使用同一个标识符可能会引起混义；此外，C++ 不允许这样做，因为它将标签和变量名放在了同一个\
  \ `namespace` 中。\n\n### typedef：快速概览\n\n`typedef` 是一种高级数据特性，允许你为类型创建自己的名称。在某方面它与\
  \ `#define` 相似，但有三点不同：\n\n![Image](img/squf.jpg) 与 `#define` 不同，`typedef` 仅限于为类型提供符号名称，而不为值提供。\n\
  \n![Image](img/squf.jpg) `typedef` 的解释是由编译器执行的，而不是预预处理器。\n\n![Image](img/squf.jpg)\
  \ 在其限制范围内，`typedef` 比 `#define` 更灵活。\n\n让我们看看 `typedef` 是如何工作的。假设你想用 `BYTE` 术语来表示单字节数字。你只需要将\
  \ `BYTE` 定义为类似于 `char` 变量，并在定义前加上 `typedef` 关键字即可，如下：\n\n点击此处查看代码图片\n\n```c\ntypedef\
  \ unsigned char BYTE;\n```\n\n从那时起，你就可以使用 `BYTE` 来定义变量：\n\n```c\nBYTE x, y[10],\
  \ * z;\n```\n\n该定义的作用域取决于 `typedef` 语句的位置。如果定义在函数内部，则作用域是局部的，局限于该函数。如果定义在函数外部，则作用域是全局的。\n\
  \n通常使用大写字母进行这些定义，以提醒用户类型名称实际上是一个符号缩写，但你也可以使用小写：\n\n```c\ntypedef unsigned char byte;\n\
  ```\n\n规定变量有效名称的规则同样适用于 `typedef` 使用的名称。\n\n为现有类型创建名称似乎有些多余，但它是很有用的。在前面的示例中，使用 `BYTE`\
  \ 代替 `unsigned char` 有助于记录你计划使用 `BYTE` 变量来表示数字而非字符代码。使用 `typedef` 还有提高移植性。例如，我们提到过\
  \ `size_t` 类型，它表示 `sizeof` 运算符返回的类型，以及 `time_t` 类型，它表示 `time()` 函数返回值的类型。C 标准说 `sizeof`\
  \ 和 `time()` 返回整数类型，但具体哪种类型由实现决定。缺乏特定性的原因是 C 标准委员会认为，没有哪一种选择可能对每个计算机平台都是最佳选择。因此，他们创建了一个新的类型名称（如\
  \ `time_t`），并让实现使用 `typedef` 将该名称设置为某些特定类型。这样，他们就可以提供如下所示的通用原型：\n\n```c\ntime_t\
  \ time(time_t *);\n```\n\n在一个系统上，`time_t` 可以是 `unsigned long`；在另一个系统上，它可以是 `unsigned\
  \ long long`。只要你包含了 `time.h` 头文件，你的程序就可以访问相应的定义，你也可以可以在代码中声明 `time_t` 变量。\n\n`typedef`\
  \ 的某些特性可以通过 `#define` 复制。例如：\n\n```c\n#define BYTE unsigned char\n```\n\n这会导致预处理器将\
  \ `BYTE` 替换为 `unsigned char`。有一个无法通过 `#define` 复制的例子：\n\n```c\ntypedef char * STRING;\n\
  ```\n\n如果没有 `typedef` 关键字，这个示例会将 `STRING` 本身识别为指向 `char` 的指针。有了关键字，它让 `STRING` 成为指向\
  \ `char` 的指针的标识符。因此，\n\n```c\nSTRING name, sign;\n```\n\n意味着\n\n```c\nchar * name,\
  \ * sign;\n```\n\n假设你做了这样的操作：\n\n```c\n#define STRING char *\n```\n\n那么\n\n```c\n\
  STRING name, sign;\n```\n\n将翻译为：\n\n```c\nchar * name, sign;\n```\n\n在这种情况下，只有 `name`\
  \ 是指针。\n\n你也可以对结构体使用 `typedef`：\n\n```c\ntypedef struct complex {\n    float real;\n\
  \    float imag;\n} COMPLEX;\n```\n\n然后你就可以使用类型 `COMPLEX` 代替名为 `complex` 的 `struct`\
  \ 来表示复数。使用 `typedef` 的原因之一是为常用的类型创建方便、易识别的名称。例如，许多人倾向于使用 `STRING` 或其等效物（如前面的示例所示）。\n\
  \n在使用 `typedef` 为结构体类型命名时，可以省略标签：\n\n```c\ntypedef struct {double x; double y;}\
  \ rect;\n```\n\n假设你这样使用 `typedef`：\n\n```c\nrect r1 = {3.0, 6.0};\nrect r2;\n```\n\
  \n这是一个点击此处查看代码图片\n\n```c\nstruct {double x; double y;}\n```\n\n如果两个结构体没有标签且成员相同，C\
  \ 认为它们是同一种类型，因此将 `r1` 赋值给 `r2` 是有效操作。\n\n使用 `typedef` 的另一个原因是 `typedef` 名称经常被使用。例如，声明\n\
  \n```c\ntypedef char (*FRC)();\n```\n\n使得 `FRC` 成为一个返回 `char` 指针的类型。通过结构体、联合体和 `typedef`，C\
  \ 提供了高效且移植的工具。\n\n### 复杂的声明\n\nC 允许创建复杂的格式。尽管我们坚持简单的形式，但我们认为有义务指出某些可能性。当你进行声明时，可以通过在名称后面添加修饰符。\n\
  \n![Image](img/655tab01)\n\nC 允许使用多个修饰符，这使得能够创建各种类型，如下所示：\n\n点击此处查看代码图片\n\n```c\n\
  int board[8][8]; // int 二维数组\nint ** ptr; // 指针的指针\nint * risks[10]; // 指向指针的数组\n\
  int (* rusks)[10]; // 指向 10 个 int 数组的指针\nint * oof[3][4]; // 3x4 的指针数组\nint (* uuf)[3][4];\
  \ // 指向 3x4int 数组的指针\nint (* uof[3])[4]; // 指向 4 元素 int 数组指针的 3 元素数组\n```\n\n解析这些声明的诀窍在于确定应用修饰符的顺序。这些规则可以帮你解决：\n\
  \n1. `[]`（表示数组）和 `()`（表示函数）具有相同的优先级。这种优先级高于 `*` 取地址运算符，这意味着下面的声明使 `risks` 成为指针数组，而不是指向数组的指针：\n\
  \n```c\nint * risks[10];\n```\n\n2. `[]` 和 `()` 从左到右结合。因此，下一个声明使 `goods` 成为包含 12\
  \ 个 50 元素数组的数组，而不是包含 50 个 12 元素 int 数组的数组：\n\n```c\nint goods[12][50];\n```\n\n\n\
  \n\n### 3. `[]` 和 `()` 的优先级相同\n\n但因为它们是从左到右结合的，以下声明在应用括号之前，会将 `*` 和 `rusks` 结合在一起。这意味着接下来的声明使\
  \ `rusks` 成为指向一个包含 10 个 `int` 的数组的指针：\n\n```c\nint (* rusks)[10];\n```\n\n#### 将规则应用于\
  \ `oof[3][4]`\n\n让我们将这些规则应用于此声明中：\n\n```c\nint * oof[3][4];\n```\n\n`[3]` 的优先级高于\
  \ `*`，而且根据从左到右的规则，它在 `[4]` 之前应用。因此，`oof` 是一个包含三个元素的数组。接下来是 `[4]`，所以 `oof` 的元素是包含四个元素的数组。`*`\
  \ 告诉我们这些元素是指针。`int` 补全了整个结构：`oof` 是一个包含三个元素的数组，每个元素都是一个包含四个元素的 `int` 指针的数组，简而言之，这是一个\
  \ 3×4 的 `int` 指针数组。系统为 12 个指针分配了存储。\n\n现在看这个声明：\n\n```c\nint (* uuf)[3][4];\n```\n\
  \n括号导致 `*` 修饰符具有最高优先级，使 `uuf` 成为指向一个 3×4 `int` 数组的指针。系统为单个指针分配了存储。\n\n#### 相关类型和\
  \ typedef\n\n这些规则还产生了以下类型：\n\n点击此处查看代码图像\n\n```c\nchar * fump(int);      // 返回 char\
  \ 指针的函数\nchar (* frump)(int);   // 指返回类型 char 的函数的指针\nchar (* flump[3])(int);//\
  \ 包含 3 个指针的数组，这些指针指向返回类型 char 的函数\n```\n\n这三个函数都接受一个 `int` 参数。你可以使用 `typedef` 来构建一系列相关类型：\n\
  \n点击此处查看代码图像\n\n```c\ntypedef int arr5[5];\ntypedef arr5 * p_arr5;\ntypedef p_arr5\
  \ arrp10[10];\n\narr5 togs; // togs 是一个 5 个 int 的数组\np_arr5 p2; // p2 是指向 5 个 int\
  \ 数组的指针\narrp10 ap; // ap 是一个包含 10 个指向 5 个 int 数组指针的数组\n```\n\n当你引入结构体时，声明的可能性确实变得极其复杂。至于应用……好吧，我们留到更高级的文本来讨论。\n\
  \n### 函数与指针\n\n正如对声明的讨论所示，声明指向函数的指针是可行的。你可能会想这种“怪物”是否有任何用。通常，函数指针被用作另一个函数的参数，告诉第二个函数应该使用哪一个函数。例如，排序数组涉及比较两个元素以查看哪个在前。如果元素是数字，你可以使用\
  \ `>` 运算符。更通用地说，元素可能是字符串或结构体，需要调用函数来完成比较。C 标准库中的 `qsort()` 函数设计用于处理任何类型的数组，只要你告诉它使用哪个函数来比较元素即可。为了这个目的，它接受一个函数指针作为其中一个参数。然后\
  \ `qsort()` 函数使用该函数对该类型进行排序——无论是整数、字符串还是结构体。\n\n让我们仔细观察函数指针。首先，它意味着什么？例如，指向 `int`\
  \ 的指针持有内存中某个位置的地址，那里可以存储一个 `int`。函数也有地址，因为函数的机器语言实现由加载到内存中的代码组成。指向函数的指针可以持有函数代码起始处的地址。\n\
  \n其次，当你声明一个数据指针时，你必须声明它所指向的数据类型。当声明函数指针时，你必须声明它所指向的函数类型。要指定函数类型，你需要指定函数签名，即函数的返回类型和函数的参数类型。例如，考虑这个原型声明：\n\
  \n点击此处查看代码图像\n\n```c\nvoid ToUpper(char *);   // 将字符串转换为大写\n```\n\n`ToUpper()` 函数的类型是“具有\
  \ `char *` 参数且返回类型为 `void` 的函数”。要声明一个名为 `pf` 且类型为该函数类型的指针，请执行以下操作：\n\n点击此处查看代码图像\n\
  \n```c\nvoid (*pf)(char *);     // pf 是一个指向函数的指针\n```\n\n读取此声明，你看到第一对括号将 `*` 运算符与\
  \ `pf` 结合，这意味着 `pf` 是一个指向函数的指针。这使得 `(*pf)` 成为函数，使得 `(char *)` 成为函数的参数列表，而 `void`\
  \ 是返回类型。创建此声明最简单的方法可能是注意到它将函数名 `ToUpper` 替换为表达式 `(*pf)`。因此，如果你想声明一个特定类型函数的指针，可以声明该类型的函数，然后将函数名替换为\
  \ `(*pf)` 形式的表达式以创建函数指针声明。\n\n正如前面提到的，第一对括号将 `*` 运算符与 `pf` 结合。（注意：提供的文本包含了几个关于此解释不同版本的重复/冲突片段，已针对核心逻辑流进行了清理）。\n\
  \n#### 函数指针的语法变体\n\n正如你可以使用数据指针来访问数据一样，你可以使用函数指针来访问函数。奇怪的是，实现此操作有两种逻辑上不一致的规则，如下所示：\n\
  \n点击此处查看代码图像\n\n```c\nvoid ToUpper(char *);\nvoid ToLower(char *);\nvoid (*pf)(char\
  \ *);\nchar mis[] = \"Nina Metier\";\n\npf = ToUpper;\n(*pf)(mis); // 语法 1：应用 ToUpper\n\
  \npf = ToLower;\npf(mis);    // 语法 2：应用 ToLower\n```\n\n每种方法看起来都合理。第一：因为 `pf` 指向\
  \ `ToUpper` 函数，`*pf` 就是 `ToUpper` 函数，因此表达式 `(*pf)(mis)` 等于 `ToUpper(mis)`。查看 `ToUpper`\
  \ 和 `pf` 的声明可知 `ToUpper` 和 `(*pf)` 是等价的。第二：因为函数名是一个指针，你可以交替使用指针和函数名，因此 `pf(mis)`\
  \ 等于 `ToLower(mis)`。查看 `pf` 的赋值语句可知 `pf` 和 `ToLower` 是等价。\n\n历史上，贝尔实验室的 C 和 Unix\
  \ 开发者采用第一种观点，而 Berkeley 的 Unix 扩展者采用第二种观点。K&R C 不允许第二形式，但为了兼容现有代码，ANSI C 接受两种形式（`(*pf)(mis)`\
  \ 和 `pf(mis)`）等价。随后的标准继续维持了这种模棱两可的态度。\n\n正如数据指针最常见的用法之一是函数的参数一样，函数指针最常见的用法之一也是函数的参数。例如，考虑这个函数原型：\n\
  \n点击此处查看代码图像\n\n```c\nvoid show(void (* fp)(char *), char * str);\n```\n\n\n\n\n\
  这看起来很乱，但它声明了两个参数：`fp` 和 `str`。`fp` 参数是一个函数指针，而 `str` 是一个数据指针。更具体地说，`fp` 指向一个接受 `char\
  \ *` 参数且返回类型为 `void` 的函数，而 `str` 指向一个 `char`。因此，根据我们之前的声明，你可以像下面这样进行函数调用：\n\n点击此处查看代码图片\n\
  \n```c\nshow(ToLower, mis);  /* show() 使用 ToLower() 函数: fp = ToLower   */\nshow(pf,\
  \ mis);      /* show() 使用 pf 指向的函数: fp = pf */\n```\n\n那么 `show()` 是如何使用传递给它的函数指针的呢？它使用\
  \ `fp()` 或 `(*fp)()` 语法来调用函数：\n\n点击此处查看代码图片\n\n```c\nvoid show(void (* fp)(char\
  \ *), char * str)\n{\n    (*fp)(str); /* 将选定的函数应用于 str */\n    puts(str);  /* 显示结果\
  \             */\n}\n```\n\n在这里，例如，`show()` 首先通过应用 `fp` 指向的函数来转换字符串 `str`，然后显示转换后的字符串。\n\
  \n顺便说，带有返回值的函数可以用两种不同的方式作为其他函数的参数。例如，考虑以下代码：\n\n点击此处查看代码图片\n\n```c\nfunction1(sqrt);\
  \      /* 传递 sqrt 函数的地址 */\nfunction2(sqrt(4.0)); /* 传递 sqrt 函数的返回值 */\n```\n\n\
  第一条语句传递了 `sqrt()` 函数的地址，get `function1()` 会在其代码中使用该函数。第二条语句首先调用 `sqrt()` 函数并对其求值，然后将返回值（在这种情况下为\
  \ 2.0）传递给 `function2()`。\n\n为了展示核心思想，列表 14.16 中的程序使用了 `show()`，并将各种转换函数作为参数。该列表还展示了处理菜单的一些实用技巧。\n\
  \n### 列表 14.16 func_ptr.c 程序\n\n点击此处查看代码图片\n\n```c\n// func_ptr.c -- 使用函数指针\n\n\
  #include <stdio.h>\n#include <string.h>\n#include <ctype.h>\n\n#define LEN 81\n\n\
  char * s_gets(char * st, int n);\nchar showmenu(void);\nvoid eatline(void);    \
  \ // 读取到行尾\nvoid show(void (* fp)(char *), char * str);\nvoid ToUpper(char *); \
  \  // 将字符串转换为大写\nvoid ToLower(char *);   // 将字符串转换为小写\nvoid Transpose(char *); //\
  \ 转换大小写\nvoid Dummy(char *);     // 保持字符串不变\n\nint main(void)\n{\n    char line[LEN];\n\
  \    char copy[LEN];\n    char choice;\n    void (*pfun)(char *); // 指向一个具有\n  \
  \                       // char * 参数且没有\n                         // 返回值的函数\n  \
  \  puts(\"输入一个字符串（空行退出）:\");\n    while (s_gets(line, LEN) != NULL && line[0] !=\
