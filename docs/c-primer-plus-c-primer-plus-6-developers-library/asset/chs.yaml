  \n表 RS.V.28 最快最小宽度类型\n\n### 最大宽度类型\n\n`stdint.h` 头文件还定义了最大宽度类型。该类型的变量可以存储系统中可能的任何整数值（考虑符号）。表\
  \ RS.V.29 列出了这些类型。\n\n![Image](img/rs-vtab29.jpg)\n\n表 RS.V.29 最大宽度类型\n\n### 可存储指针的整数\n\
  \n头文件还包含两种表 RS.V.30 所示的整数类型，它们可以准确地存储指针。准确来说，如果你将 `void *` 值赋值给这些类型之一，然后将整数类型赋回指针，信息就不会丢失。或者两种类型可能都不存在。\n\
  \n![Image](img/rs-vtab30.jpg)\n\n表 RS.V.30 用于存储指针的整数类型\n\n### 定义常量\n\n`stdint.h`\
  \ 头文件定义了表示该头文件中定义的类型限制值的常量。这些常量以类型命名。取类型名称，将 `_t` 替换为 `_MIN` 或 `_MAX`。\n\n\n\n点击此处查看代码图像\n\
  \n```c\n#include <stdio.h>\n#include <string.h>\n\nint main(void)\n{\n    char data[]\
  \ = \"  C is\\t  too#much\\nfun!\";\n    const char tokseps[] = \" \\t\\n#\"; /*\
  \ separators  */\n    char * pt;\n    puts(data);\n    pt = strtok(data,tokseps);\
  \      /* intial call  */\n    while (pt)                      /* quit on NULL */\n\
  \    {\n        puts (pt);                  /* show token   */\n        pt = strtok(NULL,\
  \ tokseps);  /* next token  */\n    }\n    return 0;\n}\n```\n\n输出如下：\n\n  C is\
  \    too#much\n\nfun!\n\nC\n\nis\n\ntoo\n\nmuch\nfun!\n\n#### 类型泛型数学：tgmath.h (C99)\n\
  \n`math.h` 和 `complex.h` 库提供了许多仅类型上不同的函数实例。例如，以下六个函数都在计算正弦：\n\n点击此处查看代码图像\n\n```c\n\
  double sin(double);\nfloat sinf(float);\nlong double sinl(long double);\ndouble\
  \ complex csin(double complex);\nfloat csinf(float complex);\nlong double csinl(long\
  \ double complex);\n```\n\n`tgmath.h` 头文件定义了宏，这些宏根据参数类型将泛型调用展开为相应的函数。以下代码演示了 `sin()`\
  \ 宏的使用，它会展开为正弦函数的各种形式：\n\n点击此处查看代码图像\n\n```c\n#include <tgmath.h>\n...\n\ndouble\
  \ dx, dy;\nfloat fx, fy;\nlong double complex clx, cly;\ndy = sin(dx);   // 展开为\
  \ dy = sin(dx)  (函数)\nfy = sin(fx);   // 展开为 fy = sinf(fx)\ncly = sin(clx); // 展开为\
  \ cly = csinl(clyx)\n```\n\n该头文件定义了三类函数的泛型宏。第一类由 `math.h` 和 `complex.h` 函数组成，具有六种变体，使用\
  \ `l` 和 `f` 后缀以及 `c` 前缀（如前面的 `sin()` 示例）。在这种情况下，泛型宏的名字与 `double` 版本的函数相同。\n\n第二类由\
  \ `math.h` 函数组成，具有三种变体，使用 `l` 和 `f` 后缀且没有复数对应项，例如 `erf()`。在这种情况下，宏的名字与示例中的不带后缀函数\
  \ `erf()` 相同。对复数参数使用此类宏的效果是未定义的。\n\n第三类由 `complex.h` 函数组成，具有三种变体，使用 `l` 和 `f` 后缀且没有实数对应项，例如\
  \ `cimag()`。在这种情况下，宏的名字与示例中的不带后缀函数 `cimag()` 相同。对实数参数使用此类宏的效果是未定义的。\n\n表格 RS.V.38\
  \ 列出了泛型宏函数。\n\n![图像](img/rs-vtab38.jpg)\n\n表格 RS.V.38 泛型数学函数\n\n在 C11 之前，实现者不得不诉助于标准的扩展来实现泛型宏。但\
  \ `_Generic` 表达式的引入允许使用标准 C11 进行直接实现。\n\n#### 线程：threads.h (C11)\n\n该头文件同 `stdatomic.h`\
  \ 一起提供了并发编程的支持。这个主题远超本书的范围，但总体而言，该头文件支持多个执行线程，原则上这些线程可以分配给不同的处理器。\n\n#### 日期和时间：time.h\n\
  \n`time.h` 头文件定义了三个宏。第一个是在许多其他头文件中定义的 `NULL`，表示空指针。第二个宏是 `CLOCKS_PER_SEC`；将 `clock()`\
  \ 返回的值除以此宏可得到秒为的时间。第三个（C11）是 `TIME_UTC`，一个正整数常量，指定 UTC（协调世界时）时间基，它是 `timespec` 的潜在参数。\n\
  \n（注：后续重复的 `time.h` 描述内容已根据要求去重。）\n\n\n\n\n![Image](img/rs-vtab48.jpg)![Image](img/rs-vtab48a.jpg)\n\
  \n# 表 RS.V.48 宽字符输入输出函数\n\n有一个宽字符 I/O 函数没有标准的 I/O 对应：\n\n```c\nint fwide(FILE *stream,\
  \ int mode);\n```\n\n如果 `mode` 为正数，它首先尝试将参数 `stream` 所代表的流设置为`宽字符定向`；如果 `mode` 为负数，它首先尝试将流设置为`字节定向`；如果\
  \ `mode` 为 0，则它不尝试更改流的方向。只有在流起初没有方向时，它才会尝试更改方向。在所有情况下，如果流是宽字符定向的，它返回正值；如果流是字节定向的，它返回负值；如果流没有方向，则返回零。\n\
  \n该头文件提供了几个基于 `string.h` 中函数建模的字符串转换和处理函数。通常，`string.h` 标识符中的 `str` 被替换为 `wcs`，因此\
  \ `wcstod()` 是 `strtod()` 函数的宽字符版本。表 RS.V.49 列出了这些函数。\n\n![Image](img/rs-vtab49.jpg)![Image](img/rs-vtab49a.jpg)\n\
  \n# 表 RS.V.49 宽字符字符串实用函数\n\n该头文件还声明了一个基于 `time.h` 头文件中 `strftime()` 函数建模的一次性函数：\n\
  \n点击此处查看代码图像\n\n```c\nsize_t wcsftime(wchar_t * restrict s, size_t maxsize,\nconst\
  \ wchar_t * restrict format,\nconst struct tm * restrict timeptr);\n```\n\n最后，该头文件声明了几个将宽字符字符串转换为多字节字符串以及反之的函数，如\
  \ 表 RS.V.50 所示。\n\n![Image](img/rs-vtab50.jpg)![Image](img/rs-vtab50a.jpg)![Image](img/rs-vtab50b.jpg)\n\
  \n# 表 RS.V.50 宽字符、多字节转换函数\n\n## 宽字符分类与映射工具：wctype.h (C99)\n\n`wctype.h` 库提供了 `ctype.h`\
  \ 中字符函数的宽字符对应物，以及一些额外的函数。它还定义了 表 RS.V.51 所示的三种类型和宏。\n\n![Image](img/rs-vtab51.jpg)\n\
  \n# 表 RS.V.51 `wctype.h` 类型和宏\n\n此库中的字符分类函数在宽字符参数满足函数描述的条件时返回真（非零）。通常，如果与宽字符对应的单字节字符在相应的\
  \ `ctype.h` 函数中返回也返回真，则该宽字符函数也返回真。表 RS.V.52 列出了这些函数。\n\n![Image](img/rs-vtab52.jpg)\n\
  \n# 表 RS.V.52 宽字符分类函数\n\n该库还包括两个被称为“可扩展”的分类函数，因为它们使用当前区域的 `LC_CTYPE` 值来分类字符。表 RS.V.53\
  \ 列出了这些函数。\n\n![Image](img/rs-vtab53.jpg)\n\n# 表 RS.V.53 可扩展宽字符分类函数\n\n`wctype()`\
  \ 的有效参数由宽字符分类函数的名称组成，去掉 `isw` 前缀并以字符串形式表示。例如，`wctype(\"alpha\")` 刻画了由 `iswalpha()`\
  \ 函数测试的字符类。因此，调用\n\n```c\niswctype(wc, wctype(\"alpha\"))\n```\n\n等同于调用\n\n```c\n\
  iswalpha(wc)\n```\n\n区别在于字符使用 `LC_CTYPE` 类别进行分类。\n\n该库提供了四个与转换相关的函数。两个是 `ctype.h`\
  \ 库中 `toupper()` 和 `tolower()` 的宽字符等价物。第三是可扩展版本，使用区域的 `LC_CTYPE` 设置来确定哪些字符被视为大写或小写。第四个为第三个提供了合适的分类参数。表\
  \ RS.V.54 列出了这些函数。\n\n![Image](img/rs-vtab54.jpg)\n\n# 表 RS.V.54 宽字符转换函数\n\n## 第六节：扩展整数类型\n\
  \n如 第 3 章“数据与 C”所述，C99 头文件 `inttypes.h` 为各种整数类型提供了一套系统的替代名称。这些名称比标准名称更清晰地描述了类型的属性。例如，`int`\
  \ 类型可能是 16 位、32 位或 64 位，但 `int32_t` 类型始终是 32 位。\n\n更精确地说，`inttypes.h` 头文件定义了可以与\
  \ `scanf()` 和 `printf()` 使用的宏，用于读写这些类型的整数。该头文件包含了 `stdlib.h` 头文件，后者提供了实际的类型定义。格式宏是字符串，可以与其他字符串拼接以产生正确的格式化方向。\n\
  \n这些类型使用 `typedef` 定义。例如，一个具有 32 位 `int` 的系统可能会使用此定义：\n\n```c\ntypedef int int32_t;\n\
  ```\n\n格式说明符使用 `#define` 指令定义。例如，一个使用上述定义处理 `int32_t` 的系统可能有此定义：\n\n点击此处查看代码图像\n\
  \n```c\n#define PRId32 \"d\"   // 输出说明符\n#define SCNd32 \"d\"   // 输入说明符\n```\n\n\
  使用这些定义，你可以如下声明一个扩展整数变量、输入一个值并显示它：\n\n点击此处查看代码图像\n\n```c\nint32_t cd_sales;  // 32\
  \ 位整数\nscanf(\"%\" SCNd32, &cd_sales);\nprintf(\"CD sales = %10\" PRId32 \"\\n\"\
  , cd_sales);\n```\n\n字符串拼接会将字符串合并以获得最终的格式字符串。因此，之前的代码被转换为：\n\n点击此处查看代码图像\n\n```c\n\
  int32_t cd_sales;\nscanf(\"%d\", &cd_sales);\nprintf(\"CD sales = %10d\\n\", cd_sales);\n\
  ```\n\n如果你将原始代码移动到一个具有 16 位 `int` 的系统，该系统可能会将 `int32_t` 定义为 `long`，将 `PRId32` 定义为\
  \ `\"ld\"`，并将 `SCNd32` 定义为 `\"ld\"`。但你可以使用相同的代码，使用 32 位整数。\n\n本参考内容的其余部分列出了扩展类型以及说明符和宏。\n\
  \n### 精确宽度类型\n\n一组 `typedef` 定义了具有精确尺寸的类型。通用形式是符号类型 `int`N`_t` 和无符号类型 `uint`N`_t`，其中\
  \ N 表示位数。但注意，并非所有系统都支持所有类型。例如，对于最小内存单元为 16 位的系统，可能不支持 `int8_t` 和 `uint8_t` 类型。符号类型的格式宏可以使用\
  \ `d` 或 `i`，因此 `PRIi8` 和 `SCNi8` 同样有效。对于无符号类型，你可以用 `o`、`x` 或 `X` 替换 `u` 以获得 `%o`、`%x`\
  \ 或 `%X` 说明符代替 `%u`。例如，你可以使用 `PRIX32` 以十六进制格式打印 `uint32_t` 类型。表 RS.VI.1 列出了精确宽度类型、格式说明符和值限制。\n\
  \n![Image](img/rs-v1tab01.jpg)\n\n# 表 RS.VI.1 精确宽度类型\n\n### 最小宽度类型\n\n最小宽度类型保证类型至少某些位数。这些类型始终存在。例如，不支持\
  \ 8 位单元的系统可以将 `int_least_8` 定义为 16 位类型。表 RS.VI.2 列出了最小宽度类型、格式说明符和值限制。\n\n![Image](img/rs-v1tab02.jpg)\n\
  \n# 表 RS.VI.2 最小宽度类型\n\n### 最快最小宽度类型\n\n\n\n\n\n对于特定的系统，某些整数表示法可能比其他方法更快。例如，`int_least16_t`\
  \ 可能会实现为 `short`，但系统使用 `int` 类型进行算术运算可能会更快。因此，`inttypes.h` 还定义了表示至少特定位数的最快类型。这些类型总是[]的。在某些情况下，可能没有明确的“最快”选择；在这种情况下，系统仅会指定这些选择之一。表\
  \ RS.VI.3 列出了最快的最小宽度类型、格式说明符和取值范围。\n\n![Image](img/rs-v1tab03.jpg)\n\n表 RS.VI.3\
  \ 最快的最小宽度类型\n\n## 最大宽度类型\n\n有时你可能希望使用可用的最大的整数类型。表 RS.VI.4 列出了这些类型。事实上，它们可能比 `long\
  \ long` 或 `unsigned long long` 更宽，因为系统可能会提供比所需类型更宽的额外类型。\n\n![Image](img/rs-v1tab04.jpg)\n\
  \n表 RS.VI.4 最大宽度类型\n\n## 可以存储指针值的整数\n\n`inttypes.h` 头文件（通过包含的 `stdint.h` 头文件）定义了两种表\
  \ RS.VI.5 中列出的可以准确存储指针值的整数类型。也就是说，如果你将 `void *` 类型的值赋值给这些类型之一，然后将该整数类型赋值回指针，则不会丢失信息。其中一种类型或两者都可能不存在。\n\
  \n![Image](img/rs-v1tab05.jpg)\n\n表 RS.VI.5 用于存储指针值的整数类型\n\n## 扩展整数常量\n\n你可以用 `L`\
  \ 后缀来表示长常量，如 `445566L`。如何指示一个常量为 `int32_t` 类型呢？使用在 `inttypes.h` 中定义的宏。例如，表达式 `INT32_C(445566)`\
  \ 展开为类型 `int32_t` 常量。本质上，该宏是到底层类型的类型转换——即到在特定实现中表示 `int32_t` 的基础类型。\n\n宏名的形成方法是取类型名称，将\
  \ `_t` 替换为 `_C`，并将所有字母大写化。例如，要使 `1000` 成为类型 `uint_least64_t` 常量，使用表达式 `UINT_LEAST64_C(1000)`。\n\
  \n# 第七节：扩展字符支持\n\nC 最初并不是被设计为国际编程语言。它的字符选择是基于或或标准的美国键盘。然而，C 的国际流行导致了多种支持不同且更大字符集的扩展。本参考的这部分提供了这些新增内容的概述。\n\
  \n### 三元组序列 (Trigraph Sequences)\n\n某些键盘没有提供 C 中使用的所有符号。因此，C 使用一组三个字符的序列提供了若干符号的替代表示，这些序列被称为*三元组序列*（trigraph\
  \ sequences）。表 RS.VII.1 列出了这些三元组。\n\n![Image](img/rs-v11tab01.jpg)\n\n表 RS.VII.1\
  \ 三元组序列\n\nC 会将源文件中所有这些三元组的出现（即使在引号字符串中）替换为相应的符号。因此，\n\n点击查看代码图像\n\n```c\n??=include\
  \ <stdio.h>\n\n??=define LIM 100\n\nint main()\n\n??<\n\n    int q??(LIM??);\n\n\
  \    printf(\"More to come.??/n\");\n    ...\n\n??>\n```\n\n变为以下内容：\n\n点击查看代码图像\n\
  \n```c\n#include <stdio.h>\n\n#define LIM 100\n\nint main()\n\n{\n    int q[LIM];\n\
  \    printf(\"More to come.\\n\");\n    ...\n}\n```\n\n你可能需要开启编译器标志来激活此功能。\n\n###\
  \ 双字连形 (Digraphs)\n\n考虑到三元组系统的笨拙，C99 提供了两个字符的标记，被称为*双字连形*（digraphs），它们可以替代某些标准的\
  \ C 标点符号。表 RS.VII.2 列出了这些双字连形。\n\n![Image](img/rs-v11tab02.jpg)\n\n表 RS.VII.2 双字连形\n\
  \n与三元组不同，引号字符串内的双字连形没有特殊意义。因此，\n\n```c\n%:include <stdio.h>\n\n%:define LIM 100\n\
  \nint main()\n\n<%\n\n    int q<:LIM:>;\n\n    printf(\"More to come.:>\");\n  \
  \  ...\n\n%>\n```\n\n行为与以下内容相同：\n\n点击查看代码图像\n\n```c\n#include <stdio.h>\n\n#define\
  \ LIM 100\n\nint main()\n\n{\n    int q[LIM];\n    printf(\"More to come.:>\");\
  \  // :> 只是字符串的一部分\n    ...\n}                         // :> 等同于 }\n```\n\n### 替代性拼写：iso646.h\n\
  \n使用三元组序列，你可以将 `||` 运算符写为 `??!??!`，这有点不吸引人。C99 通过 `iso646.h` 头文件（第五节，表 RS.V.11）提供了展开为运算符的宏。标准将这些宏称为*替代性拼写*（alternative\
  \ spellings）。\n\n如果你包含了 `iso646.h` 头文件，这样的语句\n\n```c\nif(x == M1 or x == M2)\n \
  \   x and_eq 0XFF;\n```\n\n展开为以下内容：\n\n```c\nif(x == M1 || x == M2)\n  x &= 0XFF;\n\
  ```\n\n### 多字节字符\n\n标准将多字节字符描述为一个或多个字节的序列，表示源环境或执行环境扩展字符集的成员。源环境是你准备源代码的环境；执行环境是你运行编译程序的环境。两者可以不同。例如，你可以在一个环境中开发程序，并打算在另一个环境中运行。扩展字符集是\
  \ C 所需的基础字符集的超集。\n\n实现可能会提供一个扩展字符集，允许你输入不对应于基础字符集的键盘字符。这些字符可以用于字符串字面量和字符常量，并可以出现在文件中。实现还可以提供基础字符集中字符的多字节等效形式，用于替代三元组或双字连形。\n\
  \n例如，一个德国的实现可能允许你在字符串中使用变音符号：\n\n点击查看代码图像\n\n```c\nputs(\"eins zwei drei fünf\"\
  );\n```\n\n通常情况下，程序可用的扩展字符集取决于区域（locale）设置。\n\n### 通用字符名称 (UCNs)\n\n多字节字符可以用于字符串，但不能用于标识符。通用字符名称（UCNs）是\
  \ C99 的新增，允许你将扩展字符集中的字符作为标识符的一部分。系统扩展了转义序列的概念，允许编码来自 ISO/IEC 10646 标准的字符。该标准是国际标准化组织（ISO）和国际电工委员会（IEC）共同的工作，为大量的字符提供了数值编码。（参见侧边栏）。\n\
  \n* *\n\nUnicode 和 ISO 10646\n\nUnicode 为大量的字符和符号提供一套标准的编号系统，解决了各种字符集的表示问题。例如，ASCII\
  \ 码作为 Unicode 的子集被纳入，因此美国拉丁字母（如 A 和 Z）在两个系统中表示相同。但 Unicode 还包含了其他拉丁字母，例如用于欧洲语言的字母；其他字母的字符，包括希腊语、西里尔语、希伯来语、切罗基语、阿拉伯语、泰语和孟加拉语；以及表意文字。目前为止，Unicode\
  \ 表示了超过 110,000 个符号和 100 种字体，并且仍在开发中。\n\nUnicode 为其每个字符分配了一个称为*代码点*（code point）的数字。Unicode\
  \ 代码点的典型表示法如下：U-222B。U 表示这是一个 Unicode 字符，而 222B 是该字符（在本例中积分符号）的十六进制数。\n\n\n\n国际标准化组织（ISO）建立了一个工作组来开发\
  \ `ISO 10646`，这也是一种多语言文本编码标准。`ISO 10646` 组与 Unicode 组自 1991 年以来一直合作，以保持彼此标准的同步。\n\
  \n***\n\nUCN 序列有两种形式。第一种是 `\\u` 十进制字组（hexquad），字组是四个十六进制数字的序列；`\\u00F6` 就是一个示例。第二种是\
  \ `\\U` 十进制字组对（hexquadhexquad）；`\\U0000AC01` 就是一个示例。由于每个十六进制数字对应四位位，`\\u` 形式可用于\
  \ 16 位整数表示的代码，而 `\\U` 形式可用于 32 位整数表示的代码。\n\n如果你的系统实现了 UCNs 并且扩展字符集中包含了所需的字符，则可以在字符串、字符常量和标识符中使用\
  \ UCNs：\n\n点击此处查看代码图像\n\n```\nwchar_t value\\u00F6\\u00F8 = L'\\u00f6';\n```\n\n\
  ### 宽字符\n\nC99 通过 `wchar.h` 和 `wctype.h` 库，通过使用宽字符为更大的字符集提供了更多支持。这些头文件将 `wchar_t`\
  \ 定义为整数类型；其具体类型取决于实现。它的预期用途是存储来自扩展字符集的字符，该扩展字符集是基本字符集的超集。根据定义，`char` 类型足以处理基本字符集。`wchar_t`\
  \ 类型可能需要更多位来处理更广泛的代码值范围。例如，`char` 可能是一个 8 位字节，而 `wchar_t` 可能是一个 16 位 `unsigned short`。\n\
  \n宽字符常量和字符串字面量以 `L` 前缀标明，你可以使用 `%lc` 和 `%ls` 修饰符来显示宽字符数据：\n\n点击此处查看代码图像\n\n```\n\
  wchar_t wch = L'I';\n\nwchar_t w_arr[20] = L\"am wide!\";\n\nprintf(\"%lc %ls\\\
  n\", wch, w_arr);\n```\n\n例如，如果 `wchar_t` 被实现为 2 字节单元，则 `'I'` 的 1 字节代码将存储在 `wch`\
  \ 的低位字节。非标准集的字符可能需要两个字节来存储字符代码。你可以使用通用字符代码，例如来表示代码值超出 `char` 范围的字符：\n\n点击此处查看代码图像\n\
  \n```\nwchar_t w = L'\\u00E2'; /* 16 位代码值 */\n```\n\n`wchar_t` 值的数组可以包含一个宽字符字符串，每个元素包含一个宽字符代码。代码值为\
  \ `0` 的 `wchar_t` 值等同于空字符的 `wchar_t`，被称为*空宽字符*（null wide character）。它被用于终止宽字符字符串。\n\
  \n你可以使用 `%lc` 和 `%ls` 说明符读取宽字符：\n\n```\nwchar_t wch1;\n\nwchar_t w_arr[20];\n\n\
  puts(\"Enter your grade:\");\n\nscanf(\"%lc\", &wch1);\n\nputs(\"Enter your first\
  \ name:\");\n\nscanf(\"%ls\",w_arr);\n```\n\n`wchar.h` 头文件提供了进一步的宽字符支持。特别是，它提供了宽字符\
  \ I/O 函数、宽字符转换函数和宽字符字符串处理函数。在大多数情况下，它们是现有函数的宽字符版本。例如，你可以使用 `fwprintf()` 和 `wprintf()`\
  \ 进行输出，使用 `fwscanf()` 和 `wscanf()` 进行输入。主要区别在于这些函数需要一个宽字符控制字符串，并且它们处理宽字符输入输出流。例如，以下内容作为宽字符序列显示信息：\n\
  \n```\nwchar_t * pw = L\"Points to a wide-character string\";\n\nint dozen = 12;\n\
  \nwprintf(L\"Item %d: %ls\\n\", dozen, pw);\n```\n\n同样，还有 `getwchar()`、`putwchar()`、`fgetws()`\
  \ 和 `fputws()` 函数。该头文件定义了一个 `WEOF` 宏，其作用与 `EOF` 在字节定向 I/O 中的作用相同。它必须是一个不对应任何有效字符的值。由于\
  \ `wchar_t` 类型的所有值都可能是有效字符，库定义了一个 `wint_t` 类型，它可以包含所有 `wchar_t` 值加上 `WEOF`。\n\n\
  还有与 `string.h` 库函数对应的函数。例如，`wcscpy(ws2, ws1)` 将 `ws1` 指向的宽字符串复制到 `ws2` 指向的宽字符数组。同样，存在\
  \ `wcscmp()` 函数用于比较宽字符串，等等等。\n\n`wctype.h` 头文件增加了字符分类函数。例如，`iswdigit()` 如果其宽字符参数是数字则返回真，而\
  \ `iswblank()` 函数如果其宽字符参数是空白字符则返回真（注：原文此处误写为 digit，已根据语境译为空白字符）。\n\n\n\n\n国际电工委员会（IEC）发布了一项关于浮点数计算的标准（IEC\
  \ 60559）。该标准讨论了浮点格式、精度、NaN、无穷大、舍入惯例、转换、异常、推荐的函数和算法等。C99 接受该标准作为 C 语言实现浮点计算的指南。C99\
  \ 对浮点设施的大多数新增内容都是这一工作的一部分，例如 `fenv.h` 头文件和若干个新的数学函数。此外，`float.h` 头文件定义了几个与 IEC 浮点模型相关的宏。\n\
  \n## 浮点数模型\n\n让我们快速查看浮点数模型。该标准将浮点值 `x` 可视为某个基数的幂乘以该基数下的分数值，类似于 C 语言的 E 计数法（在这种计数法中，我们可以将\
  \ `876.54` 写为 `0.87654E3`）。正如你所预期的，形式化的表示法看起来更复杂：\n\n![Image](img/990equ01.jpg)\n\
  \n简而言之，这把一个数字表示为基数 `b` 的幂（或指数）`e` 乘以一个尾数（即一个多位的分数）。\n\n以下是各个组件的含义：\n\n* `s` 是符号（±1）。\n\
  * `b` 是基数（radix），或所使用的数基。最常见的值是 2，因为浮点处理器通常使用二进制数学。\n* `e` 代表整数指数。（不应与用作自然对数底的数值常数\
  \ e 混淆）。它的范围将受限制在一个具有最小值和最大值的范围内。这些值取决于预留用于存储指数的位数。\n* `f[k]` 代表基数 `b` 的可能数字；例如，在\
  \ 2 基中，可能的数字是 0 和 1；在十六进制中，可能的数字是 0 到 F。\n* `p` 是精度，即表示尾数时所使用的基数 `b` 数字位数。它的值将受预留用于存储尾数的位数限制。\n\
  \n理解这种表示法是理解 `float.h` 和 `fenv.h` 内容的关键，因此让我们来看两个说明浮点表示法如何工作的示例。\n\n首先，假设基数 `b`（或\
  \ radix）为 10。假设精度 `p` 为 5。那么值 `24.51` 可以写成：\n\n(+1)10³(2/10 + 4/100 + 5/1000 + 1/10000\
  \ + 0/100000)\n\n假设计算机可以存储十进制数字，它可以存储符号、指数 3 以及那五个 `f[k]` 值 2, 4, 5, 1 和 0。（这里 `f[1]`\
  \ 是 2，`f[2]` 是 4，等）。因此，尾数是 0.24510。将其乘以 10³ 得到 24.51。\n\n接下来，假设（这是更常见的情况）基数 `b`\
  \ 为 2。假设 `p` 为 7，指数为 5，尾数存储为 1011001（使用 `p` 指定的 7 位二进制数字）。假设符号为正。那么我们可以根据上面的公式构造该数字：\n\
  \n```\nx = (+1)2⁵(1/2 +0/4 + 1/8 + 1/16 + 0/32 + 0/64 + 1/128)\n= 32(1/2 +0/4 +\
  \ 1/8 + 1/16 + 0/32 + 0/64 + 1/128)\n= 16 + 0 + 4 + 2 +0 + 0 + ¼ = 22.25\n```\n\n\
  许多 `float.h` 宏引用了这种表示法。例如，`FLT_RADIX` 是 `b`（即使用的基数），而 `FLT_MANT_DIG` 是 `p`（即 `float`\
  \ 值尾数中的基 `b` 数字位数）。\n\n## 规格化与非规格化值\n\n规格化浮点值的概念起着重要作用，让我们来研究它。为了简单起见，假设系统使用 10\
  \ 基（`b` = `FLT_RADIX` = 10），且 `float` 尾数使用 5 位十进制数字（`p` = `FLT_MANT_DIG` = 5）。（标准要求比这更高的精度，但我们的简化说明允许我们忽略这一要求。）考虑以下表示值\
  \ 31.841 的几种方法：\n\n* 指数 = 3, 尾数 = .31841 (.31841E3)\n* 指数 = 4, 尾数 = .03184 (.03184E4)\n\
  * 指数 = 5, 尾数 = .00318 (.00318E5)\n\n显然，第一种方法最精确，因为它使用了尾数中所有的可用数字。规格化的非零浮点值是指尾数的第一位是非零的值，这正是浮点值通常存储的方式。\n\
  \n现在假设最小指数（`FLT_MIN_EXP`）为 -10。那么最小的规格化值是：\n\n* 指数 = -10, 尾数 = .10000 (.10000E-10)\n\
  \n通常，乘以或除以 10 意味着提高或降低指数，在这种情况下，如果你除以 10，就无法进一步降低指数了。不过，你可以改变尾数来得到这种表示：\n\n* 指数\
  \ = -10, 尾数 = 0.0100 (.01000E-10)\n\n这个数字会被称为非规格化的（subnormal），因为它没有使用尾数的全部精度。例如，将\
  \ 0.12343E-10 除以 10 得到 .01234E-10，丢失了一位信息。\n\n对于这个特定的例子，0.1000E-10 是最小的非零规格化表示（`FLT_MIN`），而最小的非零非规格化值是\
  \ 0.00001E-10（`FLT_TRUE_MIN`）。\n\n`float.h` 宏 `FLT_HAS_SUBNORM`、`DBL_HAS_SUBNORM`\
  \ 和 `LDBL_HAS_SUBNORM` 表示实现如何处理非规格化值。以下是这些宏可能的值及其含义：\n\n![Image](img/992tab01.jpg)\n\
  \n`math.h` 库提供了诸如 `fpclassify()` 和 `isnormal()` 宏，使用户能够识别程序何时产生非规格化值，从而导致精度丢失。\n\
  \n## 求值方案\n\n`float.h` 宏 `FLT_EVAL_METHOD` 指明实现用于求值浮点表达式的方案。指定的选项有：\n\n![Image](img/992tab02.jpg)\n\
  \n允许实现提供额外的负值来表示其他选项。\n\n例如，假设你的程序相乘了两个 `float` 值，并将结果赋值给第三个 `float`。在选项 1 下（这是\
  \ K&R C 所做的），两个 `float` 值被扩展为 `double`，使用 `double` 进行计算，并在赋值时将结果舍入为 `float`。\n\n\
  在选项 0 下（这是 ANSI C 增加的选项），两个 `float` 值将作为 `float` 相乘，然后赋值结果。这种操作可能比模式 1 更快，但可能会有微小的精度损失。\n\
  \n## 舍入\n\n`float.h` 宏 `FLT_ROUNDS` 描述系统如何处理舍入。指定的舍入可能性如下：\n\n![Image](img/993tab01.jpg)\n\
  \n具有不同选项的系统可以定义进一步的值。\n\n某些系统提供了对舍入方案的控制，在这种情况下 `fenv.h` 函数 `fesetround()` 提供了编程控制。\n\
  \n如果你在计算制作 37 个蛋糕需要多少面粉，那么不同舍入方法的影响并不并不，但它们会影响例如关键的财务或科学计算。显然，当你将高精度浮点值转换为低精度值时（例如，将\
  \ `double` 计算的结果赋值给 `float`），舍入方法就会起作用。它在改变数基时也可能起作用。在一个数基中可以精确表示的分数在另一个数基中可能无法精确表示。考虑以下这段代码：\n\
  \n```\nfloat x = 0.8;\n```\n\n分数 8/10 或 4/5 在 10 基中可以精确表示。但大多数计算机系统将结果存储在 2 基中，而在该基中，4/5\
  \ 是一个无限循环小数：\n\n0.1100110011001100...\n\n因此，`0.8` 在存储到 `x` 时会被舍入为一个近似值，且该值取决于舍入方法。\n\
  \n然而，某些实现可能不符合 IEC 60559 的所有要求；例如，底层硬件可能无法胜任。因此，C99 定义了两个可以在预处理器指令中检查合规性的宏。首先，宏\
  \ `__STDC_IEC_559__` 如果实现符合 IEC 60559 浮点规范，则会被条件定义为常量 1。其次，宏\n\n\n\n\n\n`STDC_IEC_559_COMPLEX__`\n\
  \n如果实现遵循兼容 IEC 60559 的复数运算，则该宏条件定义为常量 1。\n\n如果实现没有定义这些宏，则无法保证其符合 IEC 60559 标准。\n\
  \n## fenv.h 头文件\n\n`fenv.h` 头文件提供了与浮点环境交互的手段。也就是说，它允许你设置浮点控制模式值，这些值控制浮点计算的发生方式；并允许你确定浮点状态标志（或\
  \ `exceptions`）的值，这些标志用于报告算术运算结果影响的信息。控制模式设置的一个示例是指定用于舍入数字的方法。状态标志的一个示例是如果操作产生了浮点溢出，则会被设置的标志。设置状态标志的操作被称为`抛出异常`（raising\
  \ an exception）。\n\n状态标志和控制模式仅在硬件支持它们时才有意义。例如，如果硬件没有该选项，你就无法更改舍入方法。\n\n你使用预处理器指令来开启支持：\n\
  \n```\n#pragma STDC FENV_ACCESS ON\n```\n\n支持会一直持续直到程序到达包含该 pragma 的块的结束，或者如果 pragma\
  \ 是外部的，则持续到文件或翻译单元的结束。或者，你可以使用以下指令关闭支持：\n\n```c\n#pragma STDC FENV_ACCESS OFF\n\
  ```\n\n你也可以发布以下 pragma：\n\n```c\n#pragma STDC FENV_ACCESS DEFAULT\n```\n\n这恢复了编译器的默认状态，该状态取决于实现。\n\
  \n该机制对于涉及关键浮点计算的人来说很重要，但对普通用户兴趣有限，因此附录未介绍细节。\n\n## STDC FP_CONTRACT Pragma\n\n某些浮点处理器可以将包含多个运算符的浮点表达式合并为单一操作。例如，处理器可能能够一步求出以下表达式：\n\
  \n```\nx*y - z\n```\n\n这提高了计算速度，但可能会降低计算的可预测性。`STDC FP_CONTRACT` pragma 允许你开启或关闭此功能。默认状态取决于实现。\n\
  \n要关闭特定计算的合并功能，然后重新开启，你可以这样做：\n\n```c\n#pragma STDC FP_CONTRACT OFF\n\nval = x *\
  \ y - z;\n\n#pragma STDC FP_CONTRACT ON\n```\n\n## math.h 库的补充\n\nC90 数学库大部分声明了具有\
  \ `double` 类型参数和 `double` 类型返回值的函数，如下所示：\n\n```c\ndouble sin(double);\ndouble sqrt(double);\n\
  ```\n\nC99 和 C11 库提供了所有这些函数的 `float` 类型和 `long double` 类型版本。这些函数在名称中使用 `f` 或 `l`\
  \ 后缀，如下：\n\n```c\nfloat sinf(float);               /* sin() 的 float 版本 */\nlong\
  \ double sinl(long double);  /* sin() 的 long double 版本 */\n```\n\n具有不同精度层级的函数族允许你根据特定目的选择最高效的类型和函数组合。\n\
  \nC99 还增加了若干个在科学、工程和数学计算中常用的函数。[表 RS.V.14] 列出了所有数学函数的 `double` 类型版本，并标识了 C99 新增的内容。在许多情况下，这些函数返回的值可以使用现有函数计算出来，但新函数的执行速度更快或更准确。例如，`log1p(x)`\
  \ 表示的值与 `log(1 + x)` 相同，但 `log1p(x)` 使用了不同的算法，该算法对于较小的 `x` 值更准确。因此，通常情况下你会使用 `log()`\
  \ 函数，但如果高精度至关重要，对于小的 `x` 值你会使用 `log1p()`。\n\n除了这些函数，数学库还定义了若干与数字分类和舍入相关的常量和函数。例如，一个值可以分类为无限、非数字\
  \ (`NaN`)、正规、次正规和真零。（`NaN` 是表示值不是数字的特殊值；例如，`asin(2.0)` 返回 `NaN` 是因为 `asin()` 仅对\
  \ `-1` 到 `1` 范围内的参数定义。次正规数数值小于全精度可表示的最小数。）还有一些专门的比较函数，当一个或多个参数为异常值时，它们的行为于标准关系运算符。\n\
  \n你可以使用 C99 的分类方案来检测计算异常。例如，`math.h` 中的 `isnormal()` 宏如果其参数是正规数则返回真。以下是使用该函数在数字变成次正规时终止循环的代码：\n\
  \n```c\n#include <math.h>  // 用于 isnormal()\n\n...\n\nfloat num = 1.7e-19;\n\nfloat\
  \ numprev = num;\n\nwhile (isnormal(num))  // 当 num 具有全 float 精度时\n{\n    numprev\
  \ = num;\n    num /= 13.7f;\n}\n```\n\n总之，对于如何处理浮点计算的详细控制有了扩展支持。\n\n## 对复数的支持\n\n\
  `complex number`（复数）是一个具有实部和虚部的数。实部是一个普通的实数，如浮点类型所表示的数。虚部表示一个虚数。而虚数反而是 -1 的平方根的倍数。复数通常写成形式\
  \ 4.2 + 2i；i 代表 -1 的平方根。\n\nC99 支持三种复数类型（在 C11 中可选的）：\n\n- `float _Complex`\n- `double\
  \ _Complex`\n- `long double _Complex`\n\n例如，`float _Complex` 值的内存布局与双元素数组相同，实部存储在第一个元素，虚部存储在第二个元素。\n\
  \nC99 和 C11 实现可能还支持三种虚数类型：\n\n- `float _Imaginary`\n- `double _Imaginary`\n- `long\
  \ double _Imaginary`\n\n包含 `complex.h` 头文件允许你使用 `complex` 代表 `_Complex`，使用 `imaginary`\
  \ 代表 `_Imaginary`。\n\n算术运算遵循通常的数学规则进行定义。例如，`(a+b*I)*(c+d*I)` 的值为 `(a*c-b*d)+(b*c+a*d)*I`。\n\
  \n`complex.h` 头文件定义了一些宏和若干接受复数并返回复数的函数。特别是宏 `I` 代表 -1 的平方根。它允许你执行以下操作：\n\n```c\n\
  double complex c1 = 4.2 + 2.0 * I;\nfloat imaginary c2= -3.0 * I;\n```\n\nC11 提供了另一种手段，即宏\
  \ `CMPLX()` 来为复数赋值。例如，如果 `re` 和 `im` 是 `double` 类型的值，你可以：\n\n```c\ndouble complex\
  \ c3 = CMPLX(re, im);\n```\n\n其意图是宏在处理异常情况（如 `im` 为无限或非数字）时，比直接赋值处理得。\n\n`complex.h`\
  \ 头文件声明了若干复数函数。许多是 `math.h` 函数的复数等效版本，带有 `c` 前缀。例如，`csin()` 返回其复数参数的正弦。其他则与复数的特性相关。例如，`creal()`\
  \ 返回复数的实部，而 `cimag()` 返回作为实数的虚部。也就是说，给定 `z` 为 `double complex` 类型，下式成立：\n\n```c\n\
  z = creal(z) + cimag(z) * I;\n```\n\n\n\n\n如果你熟悉复数并需要使用它们，你可能想要查看 `complex.h` 的内容。\n\
  \n这里是一个短程序，展示了复数支持的部分功能。\n\n点击此处查看代码图像\n\n```c\n//  complex.c --  complex numbers\n\
  \n#include <stdio.h>\n\n#include <complex.h>\n\nvoid show_cmlx(complex double cv);\n\
  \nint main(void)\n{\n    complex double v1 = 4.0 + 3.0*I;\n    double re, im;\n\
  \    complex double v2;\n    complex double sum, prod, conjug;\n    printf(\"Enter\
  \ the real part of a complex number: \");\n    scanf(\"%lf\", &re);\n    printf(\"\
  Enter the imaginary part of a complex number: \");\n    scanf(\"%lf\", &im);\n//\
  \  CMPLX() a C11 feature\n//  v2 = CMPLX(re, im);\n\n    v2 = re + im * I;\n   \
  \ printf(\"v1: \");\n    show_cmlx(v1);\n    putchar('\\n');\n    printf(\"v2: \"\
  );\n    show_cmlx(v2);\n    putchar('\\n');\n    sum = v1 + v2;\n    prod = v1 *\
  \ v2;\n    conjug =conj(v1);\n    printf(\"sum: \");\n    show_cmlx(sum);\n    putchar('\\\
  n');\n    printf(\"product: \");\n    show_cmlx(prod);\n    putchar('\\n');\n  \
  \  printf(\"complex congjugate of v1: \");\n    show_cmlx(conjug);\n    putchar('\\\
  n');\n    return 0;\n}\n\nvoid show_cmlx(complex double cv)\n{\n    printf(\"(%.2f,\
  \ %.2fi)\", creal(cv), cimag(cv));\n    return;\n}\n```\n\n如果你使用 C++，你应该意识到 C++\
  \ 的 `complex` 头文件提供了一种基于类的不同处理复数方法，这与 C 的 `complex.h` 头文件不同。\n\n# 第九节：C 和 C++ 之间的差异\n\
  \n在大多数情况下，C++ 是 C 的超集，这意味着一个有效的 C 程序也是有效的 C++ 程序。C++ 和 C 之间的主要区别在于 C++ 支持的许多额外功能。然而，在某些领域，C++\
  \ 的规则与 C 的等效规则略有不同。这些差异可能导致 C 程序在编译为 C++ 时运行方式略有不同，或者根本无法运行。\n\nC99 标准的发布在某些方面复杂了问题，它让\
  \ C 更加接近 C++。例如，它允许在代码体中任意穿插声明，并识别 `//` 注释。在其他方面，C99 增加了与 C++ 的分离性——例如通过添加变量数组和\
  \ `restrict` 关键字。C11 在某种程度上缩小了差距，例如引入了 `char16_t` 类型，添加了 `alignas` 并创建了匹配 C++ 关键字的宏\
  \ `alignas`。由于 C11 仍仍处于起步阶段且未被某些厂商完全接受，我们面临着 C90、C99 和 C11 之间的差异，以及 C++11 与这些每个标准之间的差异。本节将面对未来，讨论\
  \ C99、C11 和 C++ 之间的一些差异。同时，C++ 也在演进，因此 C 和 C++ 之间精确的对应和差异将继续变化。\n\n## 函数原型\n\n在\
  \ C++ 中，函数原型是强制的，但在 C 中是可选的。如果你在声明函数时留空括号，这种差异就会体现。在 C 中，空括号意味着你放弃了原型声明，但在 C++ 中，它们意味着函数没有参数。也就是说，在\
  \ C++ 中，原型 `int slice();` 与下方的 `int slice(void);` 相同。例如，以下序列在 C 中虽然过时但是可以接受的，但在\
  \ C++ 中是错误：\n\n```c\nint slice();\n\nint main()\n{\n    slice(20, 50);\n}\n\nint\
  \ slice(int a, int b)\n{\n}\n```\n\n在 C 中，编译器假设你使用了旧的形式来声明函数。在 C++ 中，编译器假设 `slice()`\
  \ 等于 `slice(void)`，并且假设你没有声明 `slice(int, int)`。此外，C++ 允许你声明多个同名的函数，只要它们具有不同的参数列表。\n\
  \n## char 常量\n\nC 将 `char` 常量视为 `int`，而 C++ 将它们视为 `char`。例如，考虑此语句：\n\n```c\nchar\
  \ ch = 'A';\n```\n\n在 C 中，常量 `'A'` 存储在一个 `int` 大小的内存块中；更确切地说，字符代码存储在 `int` 中。相同的数值也存储在变量\
  \ `ch` 中，但这里它只占用一个字节的内存。另一方面，C++ 对 `'A'` 和 `ch` 都使用一个字节。这种区别不会影响本文中的任何示例。然而，某些 C\
  \ 程序确实通过使用字符表示法表示整数值来利用 `char` 常量类型为 `int`。例如，如果系统有一个 4 字节的 `int`，你可以在 C 中这样做：\n\
  \n点击此处查看代码图像\n\n```c\nint x = 'ABCD'; /* C 中 4 字节 int 允许，但 C++ 不允许 */\n```\n\n`'ABCD'`\
  \ 的意义是一个 4 字节的 `int`，第一个字节存储字母 `A` 的字符代码，第二个字节存储 `B` 的字符代码，依此类推。注意 `''ABCD'` 与 `\"\
  ABCD\"` 完全不同。前者只是一种 `int` 值的奇奇写法，而后者是一个字符串，并对应于 5 字节内存块的地址。\n\n考虑以下代码：\n\n点击此处查看代码图像\n\
  \n```c\nint x = 'ABCD';\nchar c = 'ABCD';\nprintf(\"%d %d %c %c\\n\", x, 'ABCD',\
  \ c, 'ABCD');\n```\n\n在我们的系统上，它产生此输出：\n\n```\n1094861636 1094861636 D D\n```\n\n\
  这个示例说明，如果你将 `'ABCD'` 视为一个 `int`，它是一个 4 字节的整数值；但如果你将其视为 `char` 类型，程序将只查看最后一个字节。尝试使用\
  \ `%s` 格式说明符打印 `'ABCD'` 会导致程序在我们的系统上崩溃，因为 `'ABCD'` 的数值值（`1094861636`）是一个越界地址。\n\n\
  使用如 `'ABCD'` 等值的理由是它提供了一种独立设置 `int` 中每个字节的方法，因为每个字符精确对应一个字节。然而，一种更好的方法（因为它不依赖特定的字符代码）是使用十六进制作为整数常量，利用每两个十六进制数字对应一个字节的特性。第\
  \ 15 章，“位操作”讨论了这种技术。（早期版本的 C 并不提供十六进制表示法，这可能就是最初开发多字符常量的原因。）\n\n## const 修饰符\n\n\
  在 C 中，全局 `const` 具有外部链接，但在 C++ 中，它具有内部链接。也就是说，C++ 的声明\n\n```cpp\nconst double PI\
  \ = 3.14159;\n```\n\n等同于 C 的声明\n\n点击此处查看代码图像\n\n```c\nstatic double PI = 3.14159;\n\
  ```\n\n只要这两个声明都在任何函数之外。C++ 规则的目标是使在头文件中使用 `const` 更加。如果常量具有内部链接，每个包含该头文件的文件都会获得该常量的副本。如果常量具有外部链接，则必须有一个文件具有定义声明，其他文件必须具有引用声明（使用\
  \ `extern` 关键字的）。\n\n顺带提，C++ 可以使用 `extern` 关键字使 `const` 值具有外部链接，因此两种语言都可以创建具有内部链接和外部链接的常量。区别仅在于默认使用哪种链接。\n\
  \nC++ `const` 的附加属性是它可以用于声明普通数组的大小：\n\n点击此处查看代码图像\n\n```cpp\nconst int ARSIZE =\
  \ 100;\ndouble loons[ARSIZE]; /* 在 C++ 中，等同于 double loons[100]; */\n```\n\n你可以在\
  \ C99 中进行相同的声明，但在 C99 中，该声明创建一个变量数组。\n\n\n\n\n\n在 C++ 中（但在 C 中不行），你可以使用 `constvalues`\
  \ 来初始化其他的 `const` 值：\n\n点击查看代码图像\n\n```cpp\nconst double RATE = 0.06;          \
  \ // valid C++, C\nconst double STEP = 24.5;           // valid C++, C\nconst double\
  \ LEVEL = RATE * STEP;  // valid C++, invalid C\n```\n\n## 结构体与联合体\n\n在声明一个带有标签（tag）的结构体或联合体后，你\
  \ 可以在 C++ 中将该标签作为类型名使用：\n\n点击查看代码图像\n\n```cpp\nstruct duo\n{\n    int a;\n    int\
  \ b;\n};\n\nstruct duo m;  /* valid C, C++ */\nduo n;         /* invalid C, valid\
  \ C++ */\n```\n\n结果是，结构体名可能会与变量名发生冲突。例如，以下程序可以作为 C 程序编译，但在 C++ 程序中会失败，因为 C++ 将 `printf()`\
  \ 语句中的 `duo` 解释为结构体类型，而不是外部变量：\n\n点击查看代码图像\n\n```cpp\n#include <stdio.h>\n\nfloat\
  \ duo = 100.3;\n\nint main(void)\n{\n    struct duo { int a; int b;};\n    struct\
  \ duo y = { 2, 4};\n    printf (\"%f\\n\", duo);   /* ok in C, not in C++ */\n \
  \   return 0;\n}\n```\n\n在 C 和 C++ 中，你可以在一个结构体内部声明另一个结构体：\n\n点击查看代码图像\n\n```cpp\n\
  struct box\n{\n    struct point {int x; int y; } upperleft;\n    struct point lowerright;\n\
  };\n```\n\n在 C 中，你可以使用任何一种结构体，但 C++ 要求嵌套结构体使用特殊的表示法：\n\n点击查看代码图像\n\n```cpp\nstruct\
  \ box ad;      /* valid C, C++          */\nstruct point dot;   /* valid C, invalid\
  \ C++ */\nbox::point dot;     /* invalid C, valid C++ */\n```\n\n## 枚举\n\nC++ 对枚举的使用比\
  \ C 更加严格。特别是，对于 `enum` 变量，你可以做的有用操作只有是将 `enum` 常量赋值给它，并将其与其他值进行比较。在没有显式类型转换的情况下，不能将\
  \ `int` 赋值给 `enum`，也不能递增 `enum` 变量。以下代码说明了这些点：\n\n点击查看代码图像\n\n```cpp\nenum sample\
  \ {sage, thyme, salt, pepper};\nenum sample season;\n\nseason = sage;          \
  \   /* ok in C, C++ */\nseason = 2;               /* warning in C, error in C++\
  \ */\nseason = (enum sample) 3; /* ok in C, C++ */\nseason++;                 /*\
  \ ok in C, error in C++ */\n```\n\n此外，C++ 允许在声明变量时省略 `enum` 关键字：\n\n点击查看代码图像\n\n\
  ```cpp\nenum sample {sage, thyme, salt, pepper};\nsample season;    /* invalid C,\
  \ valid C++ */\n```\n\n与结构体和联合体的情况一样，如果变量和 `enum` 类型具有相同的名称，可能会导致冲突。\n\n## 空指针\n\
  \n在 C++ 中，与 C 一样，你可以将任何类型的指针赋值给空指针（`void *`），但但与 C 不同的是，除非使用显式类型转换，否则不能将 `void *`\
  \ 指针赋值给另一种类型。以下代码说明了这些点：\n\n点击查看代码图像\n\n```cpp\nint ar[5] = {4, 5, 6,7, 8};\nint\
  \ * pi;\nvoid * pv;\n\npv = ar;             /* ok in C, C++ */\npi = pv;       \
  \      /* ok in C, invalid in C++ */\npi = (int * ) pv;   /* ok in C, C++ */\n```\n\
  \nC++ 的另一个区别是，你可以将派生类对象的地址赋值给基类指针，但这与 C 中甚至不存在的特性有关。\n\n## 布尔类型\n\n在 C++ 中，布尔类型是\
  \ `bool`，且 `true` 和 `false` 是关键字。在 C 中，布尔类型是 `_Bool`，但包含头文件 `stdbool.h` 后，可以使用 `bool`、`true`\
  \ 和 `false`。\n\n## 替代拼写\n\n在 C++ 中，用于 `||` 的 `or` 替代拼写是关键字。在 C99 和 C11 中已定义。\n\n\
  ## 宽字符支持\n\n在 C++ 中，`wchar_t` 是一个内置类型。在 C99 和 C11 中，`wchar_t` 定义在多个头文件中（`std.h`,\
  \ `stdlib.h`, `wctype.h`）。同样地，`char16_t` 和 `char32_t` 定义在 `uchar.h` 中。\n\n## 复数类型\n\
  \n在 C++ 中，`complex` 是一个内置类型。在 C99 中，`complex` 定义在 `complex.h` 中。\n\n## 符号\n\n- `+`\
