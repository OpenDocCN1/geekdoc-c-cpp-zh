  表 RS.V.12 本地化函数\n\n`setlocale()` 函数参数 `locale` 的必需可能取值为 `\"C\"`（默认值）和 `\"\"`（代表实现定义的原生环境）。实现可以定义额外的区域设置。`setlocale()`\
