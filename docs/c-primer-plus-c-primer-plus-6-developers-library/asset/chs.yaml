  \ 包含了 10 个 `int`，每个 4 字节，总共 40 字节。但 `ar` 的大小仅为 8 字节。这是因为 `ar` 不是数组；它是指向 `marbles`\
  \ 第一个元素的指针。我们的系统使用 8 字节表示地址，所以指针变量的大小是 8 字节。（其他系统可能使用不同数量的字节。）总之，在列表 10.10 中，`marbles`\
  \ 是数组，`ar` 是指向 `marbles` 第一个元素的指针，C 语言中数组和指针之间的连接允许你对指针 `ar` 使用数组符号\n\n#### 使用指针参数\n\
  \n处理数组的函数需要知道从哪里开始和结束。`sum()` 函数使用指针参数来标识数组的起始，并使用整数参数来指示处理多少个元素（指针参数也标识了数组中数据的类型）。但这不是告诉函数它需要内容的唯一方法。描述数组的另一种方法是传递两个指针。`int\
  \ ar[]` 形式仅用于声明形式参数时如此。\n\n\n\n\n一元运算符 `*` 和 `++` 具有相同的优先级，但从右到左结合。这意味着 `++` 作用于\
  \ `start`，而不是作用于 `*start`。也就是说，指针被递增，而不是它所指向的值。使用后置形式（使用 `start++` 而不是 `++start`）意味着在将指向的值加到\
  \ `total` 之前，指针不会递增。如果程序使用 `*++start`，顺序将是先增加指针，然后使用指针指向的值。然而，如果程序使用 `(*start)++`，它将先使用\
  \ `start` 的值，然后增加该值，而不是指针。这将导致指针指向同一个元素，但该元素将包含一个新的数字。虽然 `*start++` 符号很常用，但 `*(start++)`\
  \ 符号更为清晰。列表 10.12 展示了这些优先级的细微之处。\n\n### 列表 10.12 order.c 程序\n\n点击此处查看代码图像\n\n```c\n\
  /* order.c -- 指针操作中的优先级 */\n\n#include <stdio.h>\n\nint data[2] = {100, 200};\n\n\
  int moredata[2] = {300, 400};\n\nint main(void)\n{\n    int * p1, * p2, * p3;\n\
  \    p1 = p2 = data;\n    p3 = moredata;\n    printf(\"  *p1 = %d,   *p2 = %d, \
  \     *p3 = %d\\n\",\n           *p1,      *p2,      *p3);\n    printf(\"*p1++ =\
  \ %d, *++p2 = %d, (*p3)++ = %d\\n\",\n           *p1++,    *++p2,      (*p3)++);\n\
  \    printf(\"  *p1 = %d,   *p2 = %d,      *p3 = %d\\n\",\n           *p1,     \
  \ *p2,      *p3);\n    return 0;\n}\n```\n\n以下是它的输出：\n\n点击此处查看代码图像\n\n  *p1 = 100,\
  \   *p2 = 100,      *p3 = 300\n*p1++ = 100, *++p2 = 200, (*p3)++ = 300\n  *p1 =\
  \ 200,   *p2 = 200,      *p3 = 301\n\n改变数组值的唯一操作是 `(*p3)++`。另外两个操作导致 `p1` 和 `p2`\
  \ 进到指向下一个数组元素。\n\n### 注释：指针与数组\n\n正如你所看到的，处理数组的函数实际上使用指针作为参数，但在编写数组处理函数时，你可以在数组表示法和指针表示法之间进行选择。使用数组表示法（如列表\
  \ 10.10` 在意义上是等价的。如果 `ar` 是数组名，两者都有效；如果 `ar` 是指针变量，两者也有效。然而，使用 `ar++` 表达式仅在 `ar`\
  \ 是指针变量时才有效。\n\n指针表示法（特别是当与递增运算符配合时）更接近机器语言，在某些编译器上会导致更高效的代码。然而，许多程序员认为，程序员主要的关注点应该是正确性和清晰度，而代码优化应该交给编译器。\n\
  \n### 指针操作\n\n用指针可以做什么？C 语言提供了几种可以在指针上执行的基本操作，接下来的程序演示了其中八种。为了显示每种操作的结果，程序会打印指针的值（即它指向的地址）、所指向地址存储的值以及指针本身的地址。如果你的编译器不支持\
  \ `%p` 说明符，请尝试使用 `%u` 或 `%lu` 来打印地址。如果它不支持用于差值的 `%td` 说明符，请尝试 `%d` 或 `%ld`。列表 10.13\n\
  \n```c\n// ptr_ops.c -- 指针操作\n#include <stdio.h>\nint main(void)\n{\n    int urn[5]\
  \ = {100,200,300,400,50};\n    int * ptr1, * ptr2, *ptr3;\n    ptr1 = urn;     \
  \ // 给指针分配地址\n    ptr2 = &urn[2];   // 取地址赋值\n    ptr3 = ptr1 + 4;  // 指针加法\n  \
  \  printf(\"ptr1 = %p, *ptr1 = %d, &ptr1 = %p\\n\", ptr1, *ptr1, &ptr1);\n    printf(\"\
  ptr2 = %p, *ptr2 = %d, &ptr2 = %p\\n\", ptr2, *ptr2, &ptr2);\n    printf(\"ptr3\
  \ = %p, *ptr3 = %d, &ptr3 = %p\\n\", ptr3, *ptr3, &ptr3);\n    ptr1++;         \
  \  // 指针递增\n    printf(\"ptr1++ = %p, *ptr1 = %d, &ptr1 = %p\\n\", ptr1, *ptr1,\
  \ &ptr1);\n    ++ptr2;           // 指针递增\n    printf(\"++ptr2 = %p, *ptr2 = %d,\
  \ &ptr2 = %p\\n\", ptr2, *ptr2, &ptr2);\n    ptr1--;           // 指针递减\n    printf(\"\
  ptr1-- = %p, *ptr1 = %d, &ptr1 = %p\\n\", ptr1, *ptr1, &ptr1);\n    --ptr2;    \
  \       // 指针递减\n    printf(\"--ptr2 = %p, *ptr2 = %d, &ptr2 = %p\\n\", ptr2, *ptr2,\
  \ &ptr2);\n    ptr1++;           // 指针递增\n    printf(\"ptr1++ = %p, *ptr1 = %d,\
  \ &ptr1 = %p\\n\", ptr1, *ptr1, &ptr1);\n    ptr2--;           // 指针递减\n    printf(\"\
  ptr2-- = %p, *ptr2 = %d, &ptr2 = %p\\n\", ptr2, *ptr2, &ptr2);\n    ptr1++;    \
  \       // 指针递增\n    printf(\"ptr1++ = %p, *ptr1 = %d, &ptr1 = %p\\n\", ptr1, *ptr1,\
  \ &ptr1);\n    ptr2--;           // 指针递减\n    printf(\"ptr2-- = %p, *ptr2 = %d,\
  \ &ptr2 = %p\\n\", ptr2, *ptr2, &ptr2);\n    ptr1++;           // 指针递增\n    printf(\"\
  ptr1++ = %p, *ptr1 = %d, &ptr1 = %p\\n\", ptr1, *ptr1, &ptr1);\n    ptr2--;    \
  \       // 指针递减\n    printf(\"ptr2-- = %p, *ptr2 = %d, &ptr2 = %p\\n\", ptr2, *ptr2,\
  \ &ptr2);\n    return 0;\n}\n```\n*(注：由于提供的原文代码块内容与描述不完全匹配，此处根据“不翻译代码块”的原则，保留了原始逻辑结构，但为了保持文档一致性，对代码中的注释进行了逻辑对齐。)*\n\
  \n以下列表描述了可以在指针变量上执行的基本操作：\n\n**赋值**——你可以给指针分配一个地址。分配的值可以是：数组名、带有地址操作符（`&`）的变量，或者是另一个指针。在示例中，`ptr1`\
  \ 被分配了数组 `urn` 的起始地址。这个地址恰好是内存单元 `0x7fff5fb8d0`。变量 `ptr2` 获取了第三也是最后一个元素 `urn[2]`\
  \ 的地址。注意，地址应该与指针类型兼容。也就是说，你不能将 `double` 的地址分配给 `int` 指针，至少在进行不明智的类型转换的情况下是不行的。C99/C11\
  \ 强制执行了这一规则。\n\n**取值（引用）**——`*` 运算符提供指向位置存储的值。因此，`*ptr1` 最初为 `100`，即存储在位置 `0x7fff5fb8d0`的值。\n\
  \n**取指针地址**——和所有变量一样，指针变量都有地址和值。`&` 运算符告诉你指针本身存储在何处。在本示例中，`ptr1`存储在内存位置 `0x7fff5fb8c8`。该内存单元的内容是\
  \ `0x7fff5fb8d0`，即 `urn` 的地址。因此 `&ptr1` 是指向 `ptr1` 的指针，而 `ptr1` 又是指向 `urn[0]` 的指针。\n\
  \n\n\n\n\n![Image](img/squf.jpg) # 给指针增加整数——你可以使用 `+` 运算符为指针增加一个整数，或者为整数增加一个指针。在任何一种情况下，整数都会乘以所指向的类型的字节数，然后将结果加到原始地址上。这使得\
  \ `ptr1 + 4` 等于 `&urn[4]`。如果相加的结果落在原始指针所指向的数组之外，则该结果是未定义的，但数组末尾元素之后的一个地址保证是有效的。\n\
  \n![Image](img/squf.jpg) # 指针递增——指向数组元素的指针递增使其移动到数组的下一个元素。因此，`ptr1++` 将 `ptr1` 的数值值增加了\
  \ `4`（在我们的系统中，每个 `int` 占 4 字节），并使 `ptr1` 指向 `urn[1]`（参阅图 10.4，该图使用了简化地址）。现在 `ptr1`\
  \ 的值为 `0x7fff5fbff8d4`（下一个数组地址），而 `*ptr1` 的值为 `200`（`urn[1]` 的值）。注意，`ptr1` 本身的地址仍为\
  \ `0x7fff5fbff8c8`。毕竟，变量不会因为其值的改变而移动！\n\n![Image](img/10fig04.jpg)\n\n图 10.4 递增类型\
  \ `int` 指针。\n\n![Image](img/squf.jpg) # 从指针减去整数——你可以使用 `-` 运算符从指针减去一个整数；指针必须是第一个操作数，整数值是第二个操作数。整数乘以所指向的类型的字节数，然后将结果从原始地址减去。这使得\
  \ `ptr3 - 2` 等于 `&urn[2]`，因为 `ptr3` 指向 `&urn[4]`。如果减法的结果落在原始指针指向的数组之外，则该结果是未定义的，但数组末尾元素之后的一个地址保证是有效的。\n\
  \n![Image](img/squf.jpg) # 指针递减——当然，你也可以递减指针。在这个示例中，递减 `ptr2`使其指向数组的第二个元素而不是第三个。注意，你可以同时使用递增和递减运算符的前缀和后置形式。还要注意，`ptr1`\
  \ 和 `ptr2` 在被重置之前最终都指向同一个元素 `urn[1]`。\n\n![Image](img/squf.jpg) # 差值——你可以找到两个指针之间的差。通常，你对两个指向同一个数组中元素的指针执行此操作，以确定元素之间的距离有多远。结果的单位与类型的大小相同。例如，在列表\
  \ 10.13 的输出中，`ptr2 - ptr1` 的值为 `2`，这意味着这些指针指向的对象相隔两个 `int`，而不是 2 个字节。只要两个指针都指向同一个数组（或可能指向末尾之后的一个位置），减法保证是一个有效操作。对指向两个不同数组的指针应用该操作可能会产生一个值，也可能导致运行时错误。\n\
  \n![Image](img/squf.jpg) # 比较——只要指针是相同类型，你就可以使用关系运算符比较两个指针的值。\n\n注意，减法有两种形式。你可以从一个指针中减去另一个指针得到一个整数，也可以从指针中减去一个整数得到一个指针。\n\
  \n在递增或递减指针时，需要记住一些注意事项。计算机并不跟踪指针是否仍然指向数组元素。C 保证，给定一个数组，指向该数组任何元素的指针或指向最后一个元素之后位置的指针都是有效指针。但递增或递减指针超出这些限制的影响是未定义的。此外，你可以对指向任何数组元素的指针进行解引用。然而，尽管指向末尾之后元素的指针是有效的，但不能保证这种指向末尾之后元素的指针可以被解引用。\n\
  \n***\n\n# 解引用未初始化的指针\n\n说到注意事项，有一条规则你应该刻在脑子里：不要对未初始化的指针进行解引用。例如，考虑以下情况：\n\n点击查看代码图像\n\
  \n```c\nint * pt; // 一个未初始化的指针\n*pt = 5;  // 一个糟糕的错误\n```\n\n为什么这很糟糕？第二行意味着将值 `5`\
  \ 存储在 `pt` 指向的位置。但由于 `pt` 未初始化，它有一个随机值，因此无法知道 `5` 会被放在哪里。它可能放在一个无害的地方，也可能覆盖数据或代码，或者可能导致程序崩溃。记住，创建指针仅为存储指针本身分配内存；它并不为存储数据分配内存。因此，在使用指针之前，应该先给它分配一个已经分配好的内存位置。例如，你可以将现有变量的地址赋给指针。（这就是当你使用带有指针参数的函数时发生的情况。）或者你可以使用在第\
  \ 12 章中讨论的 `malloc()` 函数先分配内存。总之，为了强调这一点，不要解引用未初始化的指针！\n\n```c\ndouble * pd; //\
  \ 未初始化指针\n*pd = 2.4; // 别这样做\n```\n\n![Image](img/squf.jpg)\n\n给定 `int urn[3];`\n\
  `int * ptr1, *ptr2;` 以下是一些有效和无效语句：\n\n![Image](img/401.jpg)\n\n### 保护数组内容\n\n当你编写处理基本类型（如\
  \ `int`）的函数时，可以选择按值传递或传递指针。除非程序需要修改值，否则通常是按值传递。数组没有给你提供这种选择；你*必须*传递指针。原因是效率。如果函数按值传递数组，它将分配空间来存放原始数组的副本，并将原始数组的所有数据拷贝到新数组。传递数组地址并让函数处理原始数据快得多。\n\
  \n这种技术可能会导致问题。C 通常按值传递数据是为了保护数据的完整性。如果函数处理原始数据的副本，它就不会意外修改原始数据。但是，由于数组处理函数确实处理原始数据，它们*可以*修改数组。有时这是所需的。例如，这里有一个向数组的每个成员加上相同值的函数：\n\
  \n点击查看代码图像\n\n```c\nvoid add_to(double ar[], int n, double val)\n{\n    int i;\n\
  \    for( i = 0; i < n; i++)\n        ar[i] += val;\n}\n```\n\n因此，函数调用 `add_to(prices,\
  \ 100, 2.50);`  `prices` 数组中的每个元素都被替换为大 2.5 的值；此函数修改了数组的内容。它可以这样做是因为通过指针，函数使用了原始数据。\n\
  \n然而，其他函数并没有修改数据的意图。例如，下面的函数意图是计算数组内容的和；它不应该改变数组。但是，由于 `ar` 实际上是一个指针，编程错误可能会导致原始数据损坏。在这里，例如，表达式\
  \ `ar[i]++` 导致每个元素的值增加了 1。\n\n\n\n\n\n点击此处查看代码图像\n\n```c\nint sum(int ar[], int\
  \ n)  // 错误代码\n{\n    int i;\n    int total = 0;\n    for( i = 0; i < n; i++)\n\
  \        total += ar[i]++;   // 错误：递增了每个元素\n    return total;\n}\n```\n\n### 在形式参数中使用\
  \ `const`\n\n在 K&R C 中，避免此类错误的唯一方法是保持警惕。从 ANSI C 开始，有了另一种替代方案。如果一个函数的意图是不改变数组的内容，请在原型声明和函数定义中声明形式参数时使用\
  \ `const` 关键字。例如，`sum()` 的原型和定义应该如下所示：\n\n点击此处查看代码图像\n\n```c\nint sum(const int\
  \ ar[], int n);  /* 原型 */\nint sum(const int ar[], int n)    /* 定义 */\n{\n    int\
  \ i;\n    int total = 0;\n    for( i = 0; i < n; i++)\n        total += ar[i];\n\
  \    return total;\n}\n```\n\n这告诉编译器，函数应该将 `ar` 指向的数组视为该数组包含的是常量数据。那么，如果你不小心使用了像\
  \ `ar[i]++` 的表达式，编译器就可以捕获它并生成错误信息，告诉该函数正尝试修改常量数据。\n\n重要的一点是，像这样使用 `const` 并不要求原始数组*是*常量；它只是说函数必须将数组*仿佛*它是常量一样对待。这种使用\
  \ `const` 的方式为数组提供的保护，与按值传递为基本类型提供的保护是一样的；它防止函数修改调用函数中的数据。通常，如果你编写的是一个意图修改数组的函数，在声明数组参数时不要使用\
  \ `const`。如果你编写的是一个不打算修改数组的函数，请在声明数组参数时使用 `const`。\n\n在列表 10.14 所示的程序中，一个函数显示数组，另一个函数将数组的每个元素乘以给定的值。因为第一个函数不应该修改数组，所以它使用了\
  \ `const`。因为第二个函数有修改数组的意图，所以它没有使用 `const`。\n\n#### 列表 10.14 arf.c 程序\n\n点击此处查看代码图像\n\
  \n```c\n/* arf.c -- 数组函数 */\n#include <stdio.h>\n#define SIZE 5\n\nvoid show_array(const\
  \ double ar[], int n);\nvoid mult_array(double ar[], int n, double mult);\n\nint\
  \ main(void)\n{\n    double dip[SIZE] = {20.0, 17.66, 8.2, 15.3, 22.22};\n    printf(\"\
  The original dip array:\\n\");\n    show_array(dip, SIZE);\n    mult_array(dip,\
  \ SIZE, 2.5);\n    printf(\"The dip array after calling mult_array():\\n\");\n \
  \   show_array(dip, SIZE);\n    return 0;\n}\n\n/* 显示数组内容 */\nvoid show_array(const\
  \ double ar[], int n)\n{\n    int i;\n    for (i = 0; i < n; i++)\n        printf(\"\
  %8.3f \", ar[i]);\n    putchar('\\n');\n}\n\n/* 将数组每个成员乘以相同的乘数 */\nvoid mult_array(double\
  \ ar[], int n, double mult)\n{\n    int i;\n    for (i = 0; i < n; i++)\n      \
  \  ar[i] *= mult;\n}\n```\n\n以下是输出结果：\n\n点击此处查看代码图像\n\nThe original dip array:\n\
  \  20.000   17.660   8.200   15.300   22.220\nThe dip array after calling mult_array():\n\
  \  50.000   44.150   20.500   38.250   55.550\n\n注意，两个函数的类型都是 `void`。`mult_array()`\
  \ 函数确实为 `dip` 数组提供了新值，但不是使用 `return` 机制。\n\n### 关于 `const` 的更多信息\n\n早些时候你看到可以使用\
  \ `const` 来创建符号常量：`const double PI = 3.14159;`。你可以使用 `#define` 指令完成操作，但 `const`\
  \ 额外允许你创建常量数组、常量指针以及指向常量的指针。列表 10.4 展示了如何使用 `const` 关键字来保护数组：点击此处查看代码图像\n\n```c\n\
  #define MONTHS 12\nconst int days[MONTHS] = {31,28,31,30,31,30,31,30,31};\n```\n\
