  \       switch (choice)  // switch 设置指针\n            {\n                case 'u'\
  \ : pfun = ToUpper;  break;\n                case 'l' : pfun = ToLower;  break;\n\
  \                case 't' : pfun = Transpose; break;\n                case 'o' :\
  \ pfun = Dummy;    break;\n            }\n            strcpy(copy, line);// 为 show\
  \ 制作副本\n            show(pfun, copy);  // 使用函数\n        }\n        puts(\"输入一个字符串（空行退出）:\"\
  );\n    }\n    puts(\"再见!\");\n    return 0;\n}\n\nchar showmenu(void)\n{\n    char\
  \ ans;\n    puts(\"进入菜单:\");\n    puts(\"u) 大写\");\n    puts(\"l) 小写\");\n    puts(\"\
  t) 转换 o) 原始大小写\");\n    puts(\"n) 下一个字符串\");\n    ans = getchar();  // 获取响应\n  \
  \  ans = tolower(ans); // 转换为小写\n    eatline();  // 处理一行的剩余部分\n    while (strchr(\"\
  ulton\", ans) == NULL)\n    {\n        puts(\"请输入 u, l, o, 或 n:\");\n        ans\
  \ = tolower(getchar());\n        eatline();\n    }\n    return ans;\n}\n\nvoid eatline(void)\n\
