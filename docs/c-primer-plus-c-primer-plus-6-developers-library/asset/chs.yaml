  \ 2）。这导致层 2 调用中的 `n` 被赋值为 `2`，因此打印语句 #1 输出了 `Level 2`。同样地，接下来的两次调用将导致输出 `Level 3`\
  \ 和 `Level 4`。\n图 9.4 递归变量。\n\n其次，每个函数调用都有一个对应的 `return` 来平衡。当程序流到达最后一次递归末尾的 `return`\
  \ 时，控制权会传给上一层。程序不会直接跳回 `main()` 中的原始调用。相反，程序必须逐层返回每一个递归层，从一层 `up_and_down()` 返回到调用它的那层\
  \ `up_and_down()`。\n\n第三，递归函数中位于递归调用之前的语句，其执行顺序与函数调用的顺序是一致的。例如，在列表 9.6 中，打印语句 #1\
  \ 位于递归调用之前。它按照层 1、层 2、层 3 和层 4 的顺序执行了四次。\n\n第四，递归函数中位于递归调用之后的语句，其执行顺序与函数调用的顺序相反相反。例如，打印语句\
  \ #2 位于递归调用之后，它按照层 4、层 3、层 2、层 1 的顺序执行。递归的这一特性对于涉及反转的编程非常有用。很快就会看到一个例子。\n\n第五，虽然每一层递归都有自己的一组变量，但代码本身并没有重复。代码是一系列指令，而函数调用是跳转到该序列开头的命令。递归调用随后会将程序返回到序列的开头。除了递归调用会在每次调用时创建新变量外，它们与循环非常相似。事实上，有时递归可以代替循环，反之亦然。\n\
  \n最后，递归函数必须包含某种能停止递归调用序列的内容是至关重要的。通常，递归函数使用 `if` 测试或等效机制，当函数达到特定值时终止递归。为了使之起作用，每次调用都需要为参数使用不同的值。例如，在最后那个例子中，`up_and_down(n)`\
  \ 调用了 `up_and_down(n+1)`。最终，实际参数达到了值 `4`，导致 `if (n < 4)` 测试失败。\n\n## 尾递归\n\n在最简单的递归形式中，递归调用位于函数的末尾，紧邻\
  \ `return` 语句。这被称为`尾递归`，或者说`结束递归`，因为它就像一个循环。让我们看看一个循环版本和一个递归版本的函数来计算阶乘。整数的阶乘是自 1\
  \ 到该数字的乘积。例如，`3!` 是 `1*2*3`。`0!` 被定义为 1，且负数没有定义阶乘。列表 9.7 展示了一个使用循环的版本和一个使用递归的版本。\n\
  \n```c\n// factor.c -- 使用循环和递归计算阶乘\n#include <stdio.h>\nlong fact(int n);\nlong\
  \ rfact(int n);\nint main(void)\n{\n    int num;\n    printf(\"此程序计算阶乘。\\n\");\n\
  \    printf(\"输入 0-12 之间的数字 (q 退出):\\n\");\n    while (scanf(\"%d\", &num) == 1)\n\
  \    {\n        if (num < 0)\n            printf(\"不要负数。\\n\");\n        else if\
  \ (num > 12)\n            printf(\"输入应小于 13。\\n\");\n        else\n        {\n \
  \           printf(\"循环: %d 阶乘 = %ld\\n\", num, fact(num));\n            printf(\"\
  递归: %d 阶乘 = %ld\\n\", num, rfact(num));\n        }\n        printf(\"输入 0-12 之间的数字\
  \ (q 退出):\\n\");\n    }\n    printf(\"再见。\\n\");\n    return 0;\n}\nlong fact(int\
  \ n) // 基于循环的函数\n{\n    long ans;\n    for (ans = 1; n > 1; n--)\n        ans *=\
  \ n;\n    return ans;\n}\nlong rfact(int n) // 递归版本\n{\n    long ans;\n    if (n\
  \ > 0)\n        ans = n * rfact(n-1);\n    else\n        ans = 1;\n    return ans;\n\
  }\n```\n\n* * *\n\n测试驱动程序将输入限制在整数 0–12。事实证明 `12!` 小于五亿，这使得 `13!` 在我们的系统上远大于 `long`\
  \ 的范围。要超过 `12!`，你必须使用范围更大的类型，例如 `double` 或 `long long`。\n\n这里有一个示例运行：\n\n点击此处查看代码图像\n\
  \n此程序计算阶乘。\n\n输入 0-12 之间的数字 (q 退出):\n\n5\n循环: 5 阶乘 = 120\n递归: 5 阶乘 = 120\n输入 0-12\
  \ 之间的数字 (q 退出):\n\n10\n循环: 10 阶乘 = 3628800\n递归: 10 阶乘 = 3628800\n输入 0-12 之间的数字 (q\
  \ 退出):\n\nq\n再见。\n\n循环版本将 `ans` 初始化为 1，然后与从 `n` 到 `2` 的每个整数相乘。理论上讲，你应该乘以 `1`，但这不会改变值。\n\
  \n\n\n\n现在考虑递归版本。关键在于 `n! = n` × `(n-1)!`。这是因为 `(n-1)!` 是从 1 到 `n-1` 所有正整数的乘积。因此，乘以\
  \ `n` 就得到了直到 `n` 的乘积。这暗示了一种递归方法。如果你调用函数 `rfact()`，则 `rfact(n)` 就是 `n * rfact(n-1)`。因此，你可以通过让它调用\
  \ `rfact(n-1)` 来评估 `rfact(n)`，如 Listing 9.7 所示。当然，你必须在某处结束递归，可以通过 `n` 为 `0` 时将返回值设置为\
  \ `1` 来实现。\n\nListing 9.7 的递归版本与循环版本的输出相同。注意，尽管对 `rfact()` 的递归调用不是函数的最后一行，但在 `n\
  \ > 0` 时它是最后执行的语句，因此它是尾递归。\n\n鉴于你可以使用循环或递归来编写函数，你应该用哪一个？通常情况下，循环是更好的选择。首先，因为每个递归调用都有自己的一组变量，所以递归消耗更多内存；每个递归调用都会在栈上放置一组新变量。栈中的空间限制可能会限制递归调用的次数。其次，递归速度较慢，因为每个函数调用都需要时间。那么，为什么要展示这个例子呢？因为尾递归是最容易理解的递归形式，而递归值理解理解，因为在某些情况下，没有简单的循环替代方案。\n\
  \n### 递归与反转\n\n现在让我们来看一个递归的反转顺序能力非常实用的问题。（这是一个递归比使用循环更简单的情况。）问题是：写一个打印整数的二进制等价值的函数。二进制法用\
  \ 2 的幂次来表示数字。就像十进制的 234 意味着 2 × 10² + 3 × 10¹ + 4 × 10⁰ 一样，二进制的 101 意味着 1 × 2² +\
  \ 0 × 2¹ + 1 × 2⁰。二进制只使用 0 和 1 两个数字。\n\n你需要一种方法或算法。例如，你如何找到 5 的二进制等价值？嗯，奇数的二进制表示以\
  \ 1 结尾。偶数以 0 结尾，所以你可以通过评估 `5 % 2` 来确定最后一位是 1 还是 0。如果结果为 1，则 5 是奇数，最后一位是 1。通常，如果\
  \ `n` 是一个数字，最后一位是 `n % 2`，所以你找到的第一个数字是你想要打印的最后一位。这暗示使用一个递归函数，在递归调用之前计算 `n % 2`，但在递归调用之后打印它。这样，第一个计算出的值就是最后一个打印的值。\n\
  \n要获取下一个位，将原数除以 2。这等相当于将小数点向左移动一位的二进制等价操作，以便你可以检查下一个二进制位。如果这个值是偶数，下一个二进制位就是 0。如果是奇数，则二进制位就是\
  \ 1。例如，5/2 是 2（整除），所以下一个位是 0。到目前为止得到了 01。现在重复这个过程。将 2 除以 2 得到 1。评估 `1 % 2` 得到 1，所以下一个位是\
  \ 1。这得到了 101。何时停止？当除以 2 的结果小于 2 时你停止，因为只要它是 2 或更大，就多了一个二进制位。每次除以 2 都会掉落一个二进制位，直到结束。（如果这让你感到很困惑，可以尝试通过十进制类比。628\
  \ 除以 10 的余数是 8，所以 8 是最后一位。整除 10 得到 62，62 除以 10 的余数是 2，那么这就是下一个位，依此类推。）Listing 9.8\
  \ 实现了这种方法。\n\n#### Listing 9.8 的 binary.c 程序\n\n点击此处查看代码图像\n\n```c\n/* binary.c\
  \ -- 以二进制形式打印整数 */\n\n#include <stdio.h>\n\nvoid to_binary(unsigned long n);\n\n\
  int main(void)\n{\n    unsigned long number;\n    printf(\"Enter an integer (q to\
  \ quit):\\n\");\n    while (scanf(\"%lu\", &number) == 1)\n    {\n        printf(\"\
  Binary equivalent: \");\n        to_binary(number);\n        putchar('\\n');\n \
  \       printf(\"Enter an integer (q to quit):\\n\");\n    }\n    printf(\"Done.\\\
  n\");\n    return 0;\n}\n\nvoid to_binary(unsigned long n)\n{\n    int r;\n    r\
  \ = n % 2;\n    if (n >= 2)\n    {\n        to_binary(n / 2);\n    }\n    putchar(r\
  \ + '0');\n}\n```\n\n\n\n[content]\n程序中的每个 C 函数与其他函数处于平等地位。每个函数都可以调用任何其他函数，也可以被任何其他函数调用。使得\
  \ C 函数与 Pascal 和 Modula-2 的过程有所不同，因为那些过程可以嵌套在其他过程中。一个嵌套层中的过程不知道另一个嵌套层中的过程。\n\n`main()`\
  \ 函数不是特殊吗？是的，它有一点特殊，即当一个包含多个函数的程序组合在一起时，执行从 `main()` 中的第一条语句开始，但这就是它特殊性的极限。即使是 `main()`\
  \ 也可以被自身递归地调用或其他函数调用，尽管这种情况很少见。\n\n# 使用两个或多个源文件编译程序\n\n使用多个函数的最简单方法是将它们放在同一个文件中。然后像编译单函数文件一样编译该文件即可。其他方法更多取决于系统，正如接下来的章节所示。\n\
  \n## Unix\n\n这假设 Unix 系统安装了 Unix C 编译器 `cc`。（原始的 `cc` 已退役，但许多 Unix 系统将 `cc` 命令作为某些其他编译器命令的别名，通常是\
  \ `gcc` 或 `clang`）。假设 `file1.c` 和 `file2.c` 是两个包含 C 函数的文件。那么下面的命令将编译这两个文件并生成一个名为\
  \ `a.out` 的可执行文件：\n\n```cc\ncc file1.c file2.c\n```\n\n此外，还会产生名为 `file1.o` 和 `file2.o`\
  \ 的对象文件。如果你之后更改了 `file1.c` 但没有更改 `file2.c`，可以使用此命令编译第一个文件并与第二个文件的对象代码版本结合：\n\n```cc\n\
  cc file1.c file2.o\n```\n\nUnix 有一个 `make` 命令可以自动管理多文件程序，但这超本书的范围。\n\n注意，OS X Terminal\
  \ 实用程序打开了一个命令行 Unix 环境，但你必须从 Apple 下载命令行编译器（GCC 和 Clang）。\n\n## Linux\n\n这假设 Linux\
  \ 系统安装了 GNU C 编译器 GCC。假设 `file1.c` 和 `file2.c` 是两个包含 C 函数的文件。那么下面的命令将编译这两个文件并生成一个名为\
  \ `a.out` 的可执行文件：\n\n```cc\ngcc file1.c file2.c\n```\n\n此外，还会产生名为 `file1.o` 和 `file2.o`\
  \ 的对象文件。如果你之后更改了 `file1.c` 但没有更改 `file2.c`，可以使用此命令编译第一个文件并与第二个文件的对象代码版本结合：\n\n```cc\n\
  gcc file1.c file2.o\n```\n\n## DOS 命令行编译器\n\n大多数 DOS 命令行编译器的工作原理与 Unix 的 `cc` 命令类似，但使用不同的名称。区别之一是对象文件带有\
  \ `.obj` 扩展名而不是 `.o` 扩展名。某些编译器产生汇编语言或其他特殊代码的中间文件，而不是对象代码文件。\n\n## Windows 和 Apple\
  \ IDE 编译器\n\n用于 Windows 和 Macintosh 的集成开发环境编译器是*项目导向的*。一个*项目*描述了特定程序使用的资源。资源包括你的源代码文件。如果你一直在使用这些编译器之一，你可能一直创建项目来运行单文件程序。对于多文件程序，请找到允许将源文件添加到项目中的菜单命令。你应该确保所有的源代码文件（带有\
  \ `.c` 扩展的文件）都被列为项目的一部分。在许多 IDE 中，你不需要在项目列表中列出头文件（带有 `.h` 扩展的文件）。其理念是项目管理使用哪些源代码文件，而源代码文件中的\
  \ `#include` 指令管理使用哪些头文件。然而，在 Xcode 中，你确实需要将头添加到项目中。\n\n## 使用头文件\n\n如果你将 `main()`\
  \ 放在一个文件中，将函数定义放在第二个文件中，第一个文件仍然需要函数声明。与其在每次使用函数文件时都手动输入它们，你可以将函数声明存储在头文件中。这就是标准\
  \ C 库所做的，例如将 I/O 函数声明放在 `stdio.h` 中，将数学函数声明放在 `math.h` 中。你也可以对你的函数执行此操作。\n\n此外，你经常会使用\
  \ C 预处理器来定义程序中使用的常量。这些定义仅对包含 `#define` 指令的文件有效。如果你将程序的函数存放在单独的文件中，还必须让每个文件都能使用这些\
  \ `#define` 指令。最直接的方法为每个文件重写这些指令，但这样非常耗时且增加了错误的可能性。此外，它还带来了维护问题：如果你修改了 `#define`\
  \ 值，你必须记得在每个文件中都进行修改。更好的解决方案是将 `#define` 指令放在头文件中，然后在每个源代码文件中使用 `#include` 指令。\n\
  \n因此，将函数声明和定义的常量放在头文件中是良好的编程习惯。让我们来看一个例子。假设你管理一个四家酒店的连锁。每家酒店收取的房费不同，但给定酒店内的所有房间的价格相同。对于预订多晚的人，第二晚的价格是第一晚的\
  \ 95%，第三晚的价格是第二晚的 95%，以此此类推。（不用担心这种政策的经济性。）你希望有一个程序，能够让你指定酒店和天数，并给出总费用。你希望程序有一个菜单，允许你继续输入数据，直到你选择退出。列表\
  \ 9.9、9.10 和 9.11 显示了可能出现的内容。第一个包含 `main()` 函数，提供了程序的整体结构。第二个包含支持函数，保存在单独的文件。最后，9.11\
  \ 显示了在 Unix 环境中，`#include` 中的双引号表示该文件位于当前目录。如果你使用 IDE，你需要知道它如何整合头文件。\n\n### Listing\
  \ 9.9\n```c\n/* hotel.c -- 程序 */\n/* 使用 9.9 编译 */\n#include <stdio.h>\n#include\
  \ \"hotel.h\" /* 常量，声明函数 */\nint main(void)\n{\n    int nights;\n    double hotel_rate;\n\
  \    int code;\n    while ((code = menu()) != QUIT)\n    {\n        switch(code)\n\
  \        {\n            case 1 : hotel_rate = HOTEL1;\n                break;\n\
  \            case 2 : hotel_rate = HOTEL2;\n                break;\n           \
  \ case 3 : hotel_rate = HOTEL3;\n                break;\n            case 4 : hotel_rate\
  \ = HOTEL4;\n                break;\n            default: hotel_rate = 0.0;\n  \
  \              printf(\"Oops!\\n\");\n                break;\n        }\n      \
  \  nights = getnights();\n        showprice(hotel_rate, nights);\n    }\n    printf(\"\
  谢谢，再见。\\n\");\n    return 0;\n}\n```\n\n### Listing 9.10\n```c\n/* hotel.c -- 管理函数\
  \ */\n#include <stdio.h>\n#include \"hotel.h\"\nint menu(void)\n{\n    int code,\
  \ status;\n    printf(\"\\n%s%s\\n\", STARS, STARS);\n    printf(\"输入所需酒店编号：\\n\"\
  );\n    printf(\"1) Fairfield Arms      2) Hotel Olympic\\n\");\n    printf(\"3)\
  \ Chertworthy Plaza    4) The Stockton\\n\");\n    printf(\"5) 退出\\n\");\n    printf(\"\
  %s%s\\n\", STARS, STARS);\n    while ((status = scanf(\"%d\", &code)) != 1 || (code\
  \ < 1 || code > 5))\n    {\n        if (status != 1)\n            scanf(\"%*s\"\
  ); // 忽略非整数输入\n    }\n}\n```\n\n\n\n\n```c\n    printf(\"Enter an integer from 1\
  \ to 5, please.\\n\");\n\n    }\n\n    return code;\n}\n\nint getnights(void)\n\
  {\n    int nights;\n    printf(\"How many nights are needed? \");\n    while (scanf(\"\
  %d\", &nights) != 1)\n    {\n        scanf(\"%*s\");       // 丢弃非整数输入\n        printf(\"\
  Please enter an integer, such as 2.\\n\");\n    }\n    return nights;\n}\n\nvoid\
  \ showprice(double rate, int nights)\n{\n    int n;\n    double total = 0.0;\n \
  \   double factor = 1.0;\n    for (n = 1; n <= nights; n++, factor *= DISCOUNT)\n\
  \        total += rate * factor;\n    printf(\"The total cost will be $%0.2f.\\\
  n\", total);\n}\n```\n\n### 列表 9.11 hotel.h 头文件\n\n点击此处查看代码图像\n\n```c\n/* hotel.h\
  \ -- hotel.c 的常量和声明 */\n#define QUIT       5\n#define HOTEL1     180.00\n#define\
  \ HOTEL2     225.00\n#define HOTEL3     255.00\n#define HOTEL4     355.00\n#define\
  \ DISCOUNT   0.95\n#define STARS \"**********************************\"\n\n// 显示选项列表\n\
  int menu(void);\n// 返回所需的晚数\nint getnights(void);\n// 根据费率、晚数计算价格\n// 并显示结果\nvoid\
  \ showprice(double rate, int nights);\n```\n\n这里是一个示例运行：\n\n点击此处查看代码图像\n\n```text\n\
  ********************************************************************\nEnter the\
  \ number of the desired hotel:\n1) Fairfield Arms             2) Hotel Olympic\n\
  3) Chertworthy Plaza  4) The Stockton\n5) quit\n********************************************************************\n\
  3\nHow many nights are needed? 1\nThe total cost will be $255.00.\n********************************************************************\n\
  Enter the number of the desired hotel:\n1) Fairfield Arms             2) Hotel Olympic\n\
  3) Chertworthy Plaza  4) The Stockton\n5) quit\n********************************************************************\n\
  4\nHow many nights are needed? 3\nThe total cost will be $1012.64.\n********************************************************************\n\
  Enter the number of the desired hotel:\n1) Fairfield Arms             2) Hotel Olympic\n\
  3) Chertworthy Plaza  4) The Stockton\n5) quit\n********************************************************************\n\
  5\nThank you and goodbye.\n```\n\n顺便提到，程序本身具有一些有趣的特性。特别是 `menu()` 和 `getnights()`\
  \ 函数，通过测试 `scanf()` 的返回值并使用 `scanf(\"%*s\")` 调用来跳到下一个空白符，从而跳过非数字数据。注意以下摘自 `menu()`\
  \ 的片段是如何同时检查非数字输入和超出范围的数值输入的：\n\n点击此处查看代码图像\n\n```c\nwhile ((status = scanf(\"%d\"\
  , &code)) != 1  ||\n     (code < 1 || code > 5))\n```\n\n这段代码段使用了 C 语言的保证，即逻辑表达式从左到右求值，并且在语句明确为假时停止求值。在此实例中，只有在确定\
  \ `scanf()` 成功读取到一个整数值后，才会检查 `code` 的值。\n\n将单独的任务分配给单独的函数鼓励这种精细化。对 `menu()` 或 `getnights()`\
  \ 的第一轮处理可能会使用简单的 `scanf()`，而不包含已添加的数据验证功能。然后，在基础版本运行良好后，你就可以开始改进每个模块。\n\n### 寻找地址：&\
  \ 运算符\n\nC 语言中最重要的概念之一（有时也是最困惑的概念之一）是**指针**，它是一个用于存储地址的变量。你已经看到 `scanf()` 在参数中使用地址。更通地说，任何在不使用\
  \ `return` 返回值的情况下修改调用函数中值的任何 C 函数都会使用地址。我们将介绍使用地址的函数，从一元运算符 `&` 开始（下一章将继续对指针的探索和利用）。\n\
  \n一元运算符 `&` 允许你获取变量所存储的地址。如果 `pooh` 是一个变量名，那么 `&pooh` 就是该变量的地址。你可以将地址视为内存中的一个位置。假设你有：\n\
  \n```c\npooh = 24;\n```\n\n假设 `pooh` 存储的地址是 `0B76`（PC 地址通常以十六进制值给出）。那么语句\n\n```c\n\
  printf(\"%d %p\\n\", pooh, &pooh);\n```\n\n将产生此结果（`%p` 是地址的说明符）：\n\n```text\n24\
  \ 0B76\n```\n\n列表 9.12 使用此运算符来查看同名但在不同函数中的变量存储在何处。\n\n### 列表 9.12 loccheck.c 程序\n\
  \n点击此处查看代码图像\n\n```c\n/* loccheck.c -- 检查变量存储在何处 */\n#include <stdio.h>\nvoid mikado(int);\
  \ // 声明函数\nint main(void)\n{\n    int pooh = 2, bah = 5; // local to main\n    printf(\"\
  %d %p\\n\", pooh, &pooh);\n    printf(\"%d %p\\n\", bah, &bah);\n    mikado(pooh);\n\
