    \ Collector runs, it immediately removes from memory any garbage objects that\
    \ do not have finalizers. All objects that have finalizers remain in memory. These\
    \ objects are added to a finalization queue, and the Garbage Collector spawns\
    \ a new thread to run the finalizers on those objects. After the finalizer thread\
    \ has finished its work, the garbage objects can be removed from memory. Objects\
    \ that need finalization stay in memory for far longer than objects without a\
    \ finalizer. But you have no choice. If you’re going to be defensive, you must\
    \ write a finalizer when your type holds unmanaged resources. But don’t worry\
    \ about performance just yet. The next steps ensure that it’s easier for clients\
    \ to avoid the performance penalty associated with finalization.\n\nImplementing\
    \ IDisposable is the standard way to inform users and the runtime system that\
    \ your objects hold resources that must be released in a timely manner. The IDisposable\
    \ interface contains just one method:\n\n```\npublic interface IDisposable\n{\n\
    \    void Dispose();\n}\n```\n\nThe implementation of your IDisposable.Dispose()\
    \ method is responsible for four tasks:\n\n+   1. Freeing all unmanaged resources.\n\
    +   2. Freeing all managed resources (this includes unhooking events).\n+   3.\
    \ Setting a state flag to indicate that the object has been disposed. You need\
    \ to check this state and throw ObjectDisposed exceptions in your public methods,\
    \ if any get called after disposing of an object.\n+   4. Suppressing finalization.\
    \ You call GC.SuppressFinalize(this) to accomplish this task.\n\nYou accomplish\
    \ two things by implementing IDisposable: You provide the mechanism for clients\
    \ to release all managed resources that you hold in a timely fashion, and you\
    \ give clients a standard way to release all unmanaged resources. That’s quite\
    \ an improvement. After you’ve implemented IDisposable in your type, clients can\
    \ avoid the finalization cost. Your class is a reasonably well-behaved member\
    \ of the .NET community."
