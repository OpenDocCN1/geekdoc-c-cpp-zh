    \ degradation. Think of value types as storage containers, not objects in the\
    \ OO sense.\n\nYou’ll create more reference types than value types. If you answer\
    \ yes to all these questions, you should create a value type. Compare these to\
    \ the previous Employee example:\n\n+   1. Is this type’s principal responsibility\
    \ data storage?\n+   2. Is its public interface defined entirely by properties\
    \ that access its data members?\n+   3. Am I confident that this type will never\
    \ have subclasses?\n+   4. Am I confident that this type will never be treated\
    \ polymorphically?\n\nBuild low-level data storage types as value types. Build\
    \ the behavior of your application using reference types. You get the safety of\
    \ copying data that gets exported from your class objects. You get the memory\
    \ usage benefits that come with stack-based and inline value storage, and you\
    \ can utilize standard object-oriented techniques to create the logic of your\
    \ application. When in doubt about the expected use, use a reference type.\n\n\
    # Item 19: Ensure That 0 Is a Valid State for Value Types\n\nThe default .NET\
