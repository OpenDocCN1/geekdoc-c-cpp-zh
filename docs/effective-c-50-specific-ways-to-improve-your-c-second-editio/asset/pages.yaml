    the more options you have to extend and modify any implementation in the future.


    # Item 22: Prefer Defining and Implementing Interfaces to Inheritance


    Abstract base classes provide a common ancestor for a class hierarchy. An interface
    describes one atomic piece of functionality that can be implemented by a type.
    Each has its place, but it is a different place. Interfaces are a way to design
    by contract: A type that implements an interface must supply an implementation
    for expected methods. Abstract base classes provide a common abstraction for a
    set of related types. It’s a cliché, but it’s one that works: Inheritance means
    “is a,” and interfaces means “behaves like.” These clichés have lived so long
    because they provide a means to describe the differences in both constructs: Base
    classes describe what an object is; interfaces describe one way in which it behaves.


    Interfaces describe a set of functionality, or a contract. You can create placeholders
    for anything in an interface: methods, properties, indexers, and events. Any type
    that implements the interface must supply concrete'
