  md: "Stop and Go means that the thread starting the enumeration will join on all\
    \ the threads running the query expression. That method is used when you request\
    \ that immediate execution of a query by using ToList() or ToArray(), or anytime\
    \ PLINQ needs the full result set before continuing such as ordering and sorting.\
    \ Both of the following queries use Stop and Go:\n\n```\nvar stopAndGoArray =\
    \ (from n in data.AsParallel()\n    where n < 150\n    select Factorial(n)).ToArray();\n\
    ```\n\n```\nvar stopAndGoList = (from n in data.AsParallel()\n    where n < 150\n\
    \    select Factorial(n)).ToList();\n```\n\nUsing Stop and Go processing you’ll\
    \ often get slightly better performance at a cost of a higher memory footprint.\
    \ However, notice that I’ve still constructed the entire query before executing\
    \ any of the query expressions. You’ll still want to compose the entire query,\
    \ rather than processing each portion using Stop and Go and then composing the\
    \ final results using another query. That will often cause the threading overhead\
    \ to overwhelm performance gains. Processing the entire query expression as one\
    \ composed operation is almost always preferable.\n\nThe final algorithm used\
    \ by the parallel task library is Inverted Enumeration. Inverted Enumeration doesn’t\
    \ produce a result. Instead, it performs some action on the result of every query\
    \ expression. In my earlier samples, I printed the results of the Factorial computation\
    \ to the console:\n\n```\nvar numsParallel = from n in data.AsParallel()\n   \
    \ where n < 150\n    select Factorial(n);\n\nforeach (var item in numsParallel)\n\
    \    Console.WriteLine(item);\n```\n\nLINQ to Objects (nonparallel) queries are\
    \ evaluated lazily. That means each value is produced only when it is requested.\
    \ You can opt into the parallel execution model (which is a bit different) while\
    \ processing the result of the query. That’s how you ask for the Inverted Enumeration\
    \ model:\n\n```\nvar nums2 = from n in data.AsParallel()\n    where n < 150\n\
    \    select Factorial(n);\n\nnums2.ForAll(item => Console.WriteLine(item));\n\
    ```"
