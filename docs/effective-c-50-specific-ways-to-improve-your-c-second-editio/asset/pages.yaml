  md: "```\ncalled MoveNext\nDelivered 290 at 1:50:39 PM\n```\n\nNotice how much it\
    \ changed. The very first call to MoveNext() causes PLINQ to start all the threads\
    \ involved in generating the results. That causes quite a few (in this case, almost\
    \ all) result objects to be produced. Each subsequent call to MoveNext() will\
    \ grab the next item from those already produced. You can’t predict when a particular\
    \ input element will be processed. All you know is that the query will begin executing\
    \ (on several threads) as soon as you ask for the first element of the query.\n\
    \nPLINQ’s methods that support query syntax understand how this behavior can affect\
    \ performance on queries. Suppose you modify the query to select the second page\
    \ of results using Skip() and Take():\n\n```\nvar answers = (from n in ParallelEnumerable.Range(0,\
    \ 300)\n    where n.SomeTest()\n    select n.SomeProjection()).\n    Skip(20).Take(20);\n\
    ```\n\nExecuting this query produces output that is identical to that produced\
    \ by LINQ to Objects. That’s because PLINQ knows that it will be faster to produce\
    \ only 20 elements rather than 300. (I’m simplifying, but PLINQ’s implementation\
    \ of Skip() and Take() do tend to favor a sequential algorithm more than other\
    \ algorithms.)\n\nYou can modify the query a bit more, and get PLINQ to generate\
    \ all the elements using the parallel execution model. Just add an orderby clause:\n\
    \n```\nvar answers = (from n in ParallelEnumerable.Range(0, 300)\n    where n.SomeTest()\n\
    \    orderby n.ToString().Length\n    select n.SomeProjection()).\n    Skip(20).Take(20);\n\
    ```\n\nThe lambda argument for orderby must not be something that the compiler\
    \ can optimize away (that’s why I used n.ToString().Length rather than just n\
    \ above). Now, the query engine must generate all the elements of the output sequence\
    \ before it can order them properly. Only once the elements are ordered properly\
    \ can the Skip() and Take() methods know which elements should be returned. Of\
    \ course, it’s faster on multicore machines to use multiple threads to generate\
    \ all the output than it would be to generate the sequence sequentially. PLINQ\
    \ knows that, too, so it starts multiple threads to create the output."
