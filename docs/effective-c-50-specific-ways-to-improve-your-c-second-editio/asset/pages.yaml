- pgno: 20
  md: "```\nget { return ComputeValue(x, y); }\n}\n```\n\n```\npublic int this[int\
    \ x, string name]\n{\n    get { return ComputeValue(x, name); }\n}\n```\n\nNotice\
    \ that all indexers are declared with the this keyword. You cannot name an indexer\
    \ in C#. Therefore, every different indexer in a type must have distinct parameter\
    \ lists to avoid ambiguity. Almost all the capabilities for properties apply to\
    \ indexers. Indexers can be virtual or abstract; indexers can have separate access\
    \ restrictions for setters and getters. You cannot create implicit indexers as\
    \ you can with properties.\n\nThis property functionality is all well and good,\
    \ and it’s a nice improvement. But you might still be tempted to create an initial\
    \ implementation using data members and then replace the data members with properties\
    \ later when you need one of those benefits. That sounds like a reasonable strategy—but\
    \ it’s wrong. Consider this portion of a class definition:\n\n```\n// using public\
    \ data members, bad practice:\npublic class Customer\n{\n    public string Name;\n\
    \    // remaining implementation omitted\n}\n```\n\nIt describes a customer, with\
    \ a name. You can get or set the name using the familiar member notation:\n\n\
    ```\nstring name = customerOne.Name;\ncustomerOne.Name = \"This Company, Inc.\"\
    ;\n```\n\nThat’s simple and straightforward. You are thinking that you could later\
    \ replace the Name data member with a property, and the code would keep working\
    \ without any change. Well, that’s sort of true. Properties are meant to look\
    \ like data members when accessed. That’s the purpose behind the syntax. But properties\
    \ are not data. A property access generates different Microsoft Intermediate Language\
    \ (MSIL) instructions than a data access.\n\nAlthough properties and data members\
    \ are source compatible, they are not binary compatible. In the obvious case,\
    \ this means that when you"
