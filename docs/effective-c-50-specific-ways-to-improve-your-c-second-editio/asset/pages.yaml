    later. Even though Func<out T> is declared covariant, its use is to bring an input
    to the object implementing IContravariantDelegate. Its use is contravariant with
    respect to the IContravariantDelegate.


    It certainly can get complicated describing exactly how covariance and contravariance
    work. Thankfully, now the language supports decorating generic interfaces and
    delegates with in (contravariant) and out (covariant) modifiers. You should decorate
    any interfaces and delegates you define with the in or out modifiers wherever
    possible. Then, the compiler can correct any possible misuses of the variance
    you’ve defined. The compiler will catch it both in your interface and delegate
    definitions, and it will detect any misuse of the types you’ve created.'
