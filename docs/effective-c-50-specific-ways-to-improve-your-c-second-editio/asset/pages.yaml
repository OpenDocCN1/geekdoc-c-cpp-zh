    \ wrapper, which minimizes access to the contained object. The System.Collections.ObjectModel.ReadOnlyCollection<T>\
    \ type is the standard way to wrap a collection and export a read-only version\
    \ of that data:\n\n```\npublic class MyBusinessObject\n{\n    // Read Only property\
    \ providing access to a\n    // private data member:\n    private BindingList<ImportantData>\
    \ listOfData = new BindingList<ImportantData>();\n    public IBindingList BindingData\n\
