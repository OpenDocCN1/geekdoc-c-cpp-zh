  md: 'of a type. You should understand both the order of operations and the default
    initialization of an object. You should strive to initialize every member variable
    exactly once during construction. The best way for you to accomplish this is to
    initialize values as early as possible. Here is the order of operations for constructing
    the first instance of a type:


    +   1. Static variable storage is set to 0.

    +   2. Static variable initializers execute.

    +   3. Static constructors for the base class execute.

    +   4. The static constructor executes.

    +   5. Instance variable storage is set to 0.

    +   6. Instance variable initializers execute.

    +   7. The appropriate base class instance constructor executes.

    +   8. The instance constructor executes.


    Subsequent instances of the same type start at step 5 because the class initializers
    execute only once. Also, steps 6 and 7 are optimized so that constructor initializers
    cause the compiler to remove duplicate instructions.


    The C# language compiler guarantees that everything gets initialized in some way
    when an object gets created. At a minimum, you are guaranteed that all memory
    your object uses has been set to 0 when an instance is created. This is true for
    both static members and instance members. Your goal is to make sure that you initialize
    all the values the way you want and execute that initialization code only once.
    Use initializers to initialize simple resources. Use constructors to initialize
    members that require more sophisticated logic. Also factor calls to other constructors,
    to minimize duplication.


    # Item 15: Utilize using and try/finally for Resource Cleanup


    Types that use unmanaged system resources should be explicitly released using
    the Dispose() method of the IDisposable interface. The rules of the .NET environment
    make that the responsibility of the code that uses the type, not the responsibility
    of the type or the system. Therefore, anytime you use types that have a Dispose()
    method, it’s your responsibility to release those resources by calling Dispose().
    The best way to ensure that Dispose() always gets called is to utilize the using
    statement or a try/finally block.


