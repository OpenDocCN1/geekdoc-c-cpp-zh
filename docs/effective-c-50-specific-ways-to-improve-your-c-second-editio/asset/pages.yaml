    \ necessary properties for your dynamic method. As long as you have properties\
    \ named “Price” and “Name”, the WritePricingInformation method will do the job.\n\
    \nOf course, you can use anonymous types that have other properties as well. As\
    \ long as the properties you have include the pricing information, you’re fine:\n\
    \n```\nvar orderInfo = from n in Ordered select new {\n    n.Name,\n    Price\
    \ = n.Cost * 1.15M,\n    ShippingCost = n.Cost / 10M\n};\n```\n\nPlain old C#\
    \ objects can be used where dynamic is expected. This means your pricing information\
    \ method can be used with this concrete type that happens to use the correct property\
    \ names:\n\n```\npublic class DiscountProduct\n{\n    public static int NumberInInventory\
    \ { get; set; }\n    public double Price { get; set; }\n    public string Name\
    \ { get; set; }\n    public string ReasonForDiscount { get; set; }\n\n    // other\
    \ methods elided\n}\n```\n\nYou may have noticed that the type of the Price property\
    \ in DiscountProduct is double where the type of the Price property in the earlier\
    \ anonymous types was decimal. That’s fine as well. WritePricingInformation uses\
    \ the dynamic static type, so it will figure that out correctly at runtime. Of\
    \ course, if DiscountProduct derived from a base Product class, and the Product\
    \ class contained the Name and Price properties, that would work.\n\nThe code\
    \ written above could easily lead you to believe that I’m advocating dynamic more\
    \ often than I really am. Dynamic invocation is a good way to solve this problem,\
    \ but don’t overuse it. Dynamic invocation means"
