  md: "```\npublic decimal CurrentPayAmount\n{\n    get;\n    set;\n}\n\npublic virtual\
    \ void Pay(BankAccount b)\n{\n    b.Balance += CurrentPayAmount;\n}\n}\n```\n\n\
    That breaks much of the existing code that uses your customer struct. Return by\
    \ value becomes return by reference. Parameters that were passed by value are\
    \ now passed by reference. The behavior of this little snippet changed drastically:\n\
    \n```\nEmployee e1 = Employees.Find(e => e.Position == \"CEO\");\nBankAccount\
    \ CEOBankAccount = new BankAccount();\ndecimal Bonus = 10000;\ne1.CurrentPayAmount\
    \ += Bonus; // Add one time bonus.\ne1.Pay(CEOBankAccount);\n```\n\nWhat was a\
    \ one-time bump in pay to add a bonus just became a permanent raise. Where a copy\
    \ by value had been used, a reference is now in place. The compiler happily makes\
    \ the changes for you. The CEO is probably happy, too. The CFO, on the other hand,\
    \ will report the bug. You just can’t change your mind about value and reference\
    \ types after the fact: It changes behavior.\n\nThis problem occurred because\
    \ the Employee type no longer follows the guidelines for a value type. In addition\
    \ to storing the data elements that define an employee, you’ve added responsibilities—in\
    \ this example, paying the employee. Responsibilities are the domain of class\
    \ types. Classes can define polymorphic implementations of common responsibilities\
    \ easily; structs cannot and should be limited to storing values.\n\nThe documentation\
    \ for .NET recommends that you consider the size of a type as a determining factor\
    \ between value types and reference types. In reality, a much better factor is\
    \ the use of the type. Types that are simple structures or data carriers are excellent\
    \ candidates for value types. It’s true that value types are more efficient in\
    \ terms of memory management:"
