  md: "# Item 41: Use DynamicObject or IDynamicMetaObjectProvider for Data-Driven\
    \ Dynamic Types\n\n```\npublic override bool TryGetMember(GetMemberBinder binder,\
    \ out object result)\n{\n    string key = binder.Name;\n    if (storage.ContainsKey(key))\n\
    \    {\n        result = storage[key];\n        return true;\n    }\n    else\n\
    \    {\n        result = null;\n        return false;\n    }\n}\n\npublic override\
    \ bool TrySetMember(SetMemberBinder binder, object value)\n{\n    string key =\
    \ binder.Name;\n    if (storage.ContainsKey(key))\n        storage[key] = value;\n\
    \    else\n        storage.Add(key, value);\n    return true;\n}\n\npublic override\
    \ string ToString()\n{\n    StringWriter message = new StringWriter();\n    foreach\
    \ (var item in storage)\n    {\n        message.WriteLine(\"{0}:\\t{1}\", item.Key,\
    \ item.Value);\n    }\n    return message.ToString();\n}\n```\n\nThe dynamic property\
    \ bag contains a dictionary that stores the property names and their values. The\
    \ work is done in TryGetMember and TrySetMember.\n\nTryGetMember examines the\
    \ requested name (binder.Name), and if that property has been stored in the Dictionary,\
    \ TryGetMember will return its value. If the value has not been stored, the dynamic\
    \ call fails.\n\nTrySetMember accomplishes its work in a similar fashion. It examines\
    \ the requested name (binder.Name) and either updates or creates an entry for\
    \ that item in the internal Dictionary. Because you can create any property, the\
    \ TrySetMember method always returns true, indicating that the dynamic call succeeded.\n\
    \nDynamicObject contains similar methods to handle dynamic invocation of indexers,\
    \ methods, constructors, and unary and binary operators. You can override any\
    \ of those members to create your own dynamic members."
