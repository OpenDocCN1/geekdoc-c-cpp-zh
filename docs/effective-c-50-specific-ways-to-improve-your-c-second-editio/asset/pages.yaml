    \ is rather simple, and I’ll show it only for completeness:\n\n```\nprivate static\
    \ void finishDownload(string url, byte[] bytes)\n{\n    Console.WriteLine(\"Read\
    \ {0} bytes from {1}\",\n        bytes.Length, url);\n}\n```\n\nStartDownload\
    \ shows a bit more of the interface provided by the Parallel Task Library. The\
    \ specific types used help to support the Task interface. I’d like to abstract\
    \ that away, but handling these types will be a bit different for each specific\
    \ task you want to accomplish. In fact, the Parallel Task Library puts a common\
    \ interface on top of the many different async patterns that existed in the .NET\
    \ BCL prior to this version.\n\n```\nprivate static Task<byte[]> startDownload(string\
    \ url)\n{\n    var tcs = new TaskCompletionSource<byte[]>(url);\n    var wc =\
    \ new WebClient();\n    wc.DownloadDataCompleted += (sender, e) =>\n    {\n  \
    \      if (e.UserState == tcs)\n        {\n            if (e.Cancelled)\n    \
    \            tcs.TrySetCanceled();\n            else if (e.Error != null)\n  \
    \              tcs.TrySetException(e.Error);\n            else\n             \
    \   tcs.TrySetResult(e.Result);\n        }\n    };\n    wc.DownloadDataAsync(new\
    \ Uri(url), tcs);\n    return tcs.Task;\n}\n```\n\nThis method has a mix of general\
    \ Task code and code specific to downloading data from a URL, so let’s go through\
    \ it very carefully. First, it creates a TaskCompletionSource object for this\
    \ task. A TaskCompletionSource object enables you to separate the creation of\
    \ a task from its completion."
