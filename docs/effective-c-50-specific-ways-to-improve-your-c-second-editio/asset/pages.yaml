    \ is part of a multithreaded program. Any context switch after the city changes\
    \ and before the state changes would leave the potential for another thread to\
    \ see an inconsistent view of the data.\n\nOkay, so you think you’re not writing\
    \ a multithreaded program. You can still get into trouble. Imagine that the ZIP\
    \ code was invalid and the set threw an exception. You’ve made only some of the\
