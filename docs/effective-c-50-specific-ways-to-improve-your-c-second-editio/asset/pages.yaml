    The decision to make a value type or a reference type is an important one. It\
    \ is a far-reaching change to turn a value type into a class type. Consider this\
    \ type:\n\n```\npublic struct Employee\n{\n    // Properties elided\n    public\
    \ string Position\n    {\n        get;\n        set;\n    }\n\n    public decimal\
    \ CurrentPayAmount\n    {\n        get;\n        set;\n    }\n\n    public void\
    \ Pay(BankAccount b)\n    {\n        b.Balance += CurrentPayAmount;\n    }\n}\n\
    ```\n\nThis fairly simple type contains one method to let you pay your employees.\
