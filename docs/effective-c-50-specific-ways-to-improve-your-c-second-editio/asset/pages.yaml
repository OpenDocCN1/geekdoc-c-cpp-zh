- pgno: 17
  md: "If you had used public data members, you’re stuck looking for every bit of\
    \ code that sets a customer’s name and fixing it there. That takes more time—much\
    \ more time.\n\nBecause properties are implemented with methods, adding multithreaded\
    \ support is easier. You can enhance the implementation of the get and set accessors\
    \ to provide synchronized access to the data:\n\n```\npublic class Customer\n\
    {\n    private object syncHandle = new object();\n\n    private string name;\n\
    \    public string Name\n    {\n        get\n        {\n            lock (syncHandle)\n\
    \                return name;\n        }\n        set\n        {\n           \
    \ if (string.IsNullOrEmpty(value))\n                throw new ArgumentException(\n\
    \                    \"Name cannot be blank\",\n                    \"Name\");\n\
    \            lock (syncHandle)\n                name = value;\n        }\n   \
    \ }\n    // More Elided.\n}\n```\n\nProperties have all the language features\
    \ of methods. Properties can be virtual:\n\n```\npublic class Customer\n{\n  \
    \  public virtual string Name\n    {\n        get;\n\n```"
