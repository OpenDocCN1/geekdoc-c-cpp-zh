  md: "# Item 23: Understand How Interface Methods Differ from Virtual Methods\n\n\
    At first glance, implementing an interface seems to be the same as overriding\
    \ a virtual function. You provide a definition for a member that has been declared\
    \ in another type. That first glance is very deceiving. Implementing an interface\
    \ is very different from overriding a virtual function. Members declared in interfaces\
    \ are not virtual—at least, not by default. Derived classes cannot override an\
    \ interface member implemented in a base class. Interfaces can be explicitly implemented,\
    \ which hides them from a class’s public interface. They are different concepts\
    \ with different uses.\n\nBut you can implement interfaces in such a manner that\
    \ derived classes can modify your implementation. You just have to create hooks\
    \ for derived classes.\n\nTo illustrate the differences, examine a simple interface\
    \ and implementation of it in one class:\n\n```\ninterface IMsg\n{\n    void Message();\n\
    }\n```\n\n```\npublic class MyClass : IMsg\n{\n    public void Message()\n   \
    \ {\n        Console.WriteLine(\"MyClass\");\n    }\n}\n```\n\nThe Message() method\
    \ is part of MyClass’s public interface. Message can also be accessed through\
