    your error handling. How can you recover from an error you don’t see?


    The last location for the no-throw guarantee is in delegate targets. When a delegate
    target throws an exception, none of the other delegate targets gets called from
    the same multicast delegate. The only way around this is to ensure that you do
    not throw any exceptions from a delegate target. Let’s state that again: Delegate
    targets (including event handlers) should not throw exceptions. Doing so means
    that the code raising the event cannot participate in the strong exception guarantee.
    But here, I’m going to modify that advice. Item 24 showed how you can invoke delegates
    so that you can recover from exceptions. Not everyone does, though, so you should
    avoid throwing exceptions in delegate handlers. Just because you don’t throw exceptions
    in delegates does not mean that others follow that advice; do not rely on the
    no-throw guarantee for your own delegate invocations. It’s that defensive programming:
    You should do the best you can because other programmers might do the worst they
    can.


    Exceptions introduce serious changes to the control flow of an application. In
    the worst case, anything could have happened—or not happened. The only way to
    know what has and hasn’t changed when an exception is thrown is to enforce the
