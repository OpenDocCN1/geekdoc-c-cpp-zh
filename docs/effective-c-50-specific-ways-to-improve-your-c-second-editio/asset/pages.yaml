    # Item 5: Always Provide ToString()


    System.Object.ToString() is one of the most-used methods in the .NET environment.
    You should write a reasonable version for all the clients of your class. Otherwise,
    you force every user of your class to use the properties in your class and create
    a reasonable human-readable representation. This string representation of your
    type can be used to easily display information about an object to users: in Windows
    Presentation Foundation (WPF) controls, Silverlight controls, Web Forms, or console
    output. The string representation can also be useful for debugging. Every type
    that you create should provide a reasonable override of this method. When you
    create more complicated types, you should implement the more sophisticated IFormattable.ToString().
    Face it: If you don’t override this routine, or if you write a poor one, your
    clients are forced to fix it for you.'
