    \ is very simple yet it does illustrate a few important concepts used throughout\
    \ PLINQ. AsParallel() is the method you call to opt in to parallel execution of\
    \ any query expression. Once you call AsParallel(), subsequent operations will\
    \ occur on multiple cores using multiple threads. AsParallel() returns an IParallelEnumerable()\
    \ rather than an IEnumerable(). PLINQ is implemented as a set of extension methods\
    \ on IParallelEnumerable. They have almost exactly the same signatures as the\
    \ methods found in the Enumerable class that extends IEnumerable. Simply substitute\
