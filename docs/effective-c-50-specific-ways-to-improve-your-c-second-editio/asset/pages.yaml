  md: "The code shown above is not truly asynchronous. It’s making use of multiple\
    \ threads to perform some work in parallel, but the surrounding program will wait\
    \ for all the Web requests to finish before continuing with other work. The Parallel\
    \ Task Library provides other primitives to implement the async pattern. One very\
    \ common pattern is to begin a number of I/O bound tasks and perform some action\
    \ on those results. Ideally, I’d like to write something like:\n\n```\nurls.RunAsync(\n\
    \    url => startDownload(url),\n    task => finishDownload(task.AsyncState.ToString(),\n\
    \    task.Result));\n```\n\nThis would use the startDownload() method to begin\
    \ downloading each URL. As each download finishes, finishDownload() would be called.\
    \ Once all the downloads have finished, RunAsync() would finish. There is a reasonable\
    \ amount of work using the Parallel Task Library to accomplish this, so let’s\
    \ examine it closely. The best place to begin is the RunAsync method itself:\n\
    \n```\npublic static void RunAsync<T, TResult>(\n    this IEnumerable<T> taskParms,\n\
    \    Func<T, Task<TResult>> taskStarter,\n    Action<Task<TResult>> taskFinisher)\n\
    {\n    taskParms.Select(parm => taskStarter(parm)).\n        AsParallel().\n \
    \       ForAll(t => t.ContinueWith(t2 => taskFinisher(t2)));\n}\n```\n\nThis method\
    \ creates a task per input parameter. The Select() method returns the sequence\
    \ of tasks. Next, you need to opt into parallel processing of the results, by\
    \ using AsParallel(). For every single task, you’ll want to call the post processing\
    \ method for every task. The Task<T> class represents a (possibly parallel) task\
    \ and contains properties to report on the input and output values from the task.\
    \ One of the methods of Task<T> is ContinueWith(). It will be called as the task\
    \ finishes and allows you to perform any processing after the task has finished\
    \ running. In the RunAsync method, it calls the taskFinisher, giving the Task\
    \ object as the parameter. That enables the caller to perform any processing as\
    \ the task finishes. ForAll() performs the inverted enumeration, so that it blocks\
    \ until all tasks have completed."
