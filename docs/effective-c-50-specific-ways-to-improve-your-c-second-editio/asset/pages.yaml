  md: "by extension, the method syntax that implements the query expression pattern,\
    \ provides a cleaner expression of your intent than imperative looping constructs.\n\
    \nThis code snippet shows an imperative method of filling an array and then printing\
    \ its contents to the Console:\n\n```\nint[] foo = new int[100];\n\nfor (int num\
    \ = 0; num < foo.Length; num++)\n    foo[num] = num * num;\n\nforeach (int i in\
    \ foo)\n    Console.WriteLine(i.ToString());\n```\n\nEven this small example focuses\
    \ too much on how actions are performed than on what actions are performed. Reworking\
    \ this small example to use the query syntax creates more readable code and enables\
    \ reuse of different building blocks.\n\nAs a first step, you can change the generation\
    \ of the array to a query result:\n\n```\nint[] foo = (from n in Enumerable.Range(0,\
    \ 100)\n    select n * n).ToArray();\n```\n\nYou can then do a similar change\
    \ to the second loop, although you’ll also need to write an extension method to\
    \ perform some action on all the elements:\n\n```\nfoo.ForAll((n) => Console.WriteLine(n.ToString()));\n\
    ```\n\nThe .NET BCL has a ForAll implementation in List<T>. It’s just as simple\
    \ to create one for IEnumerable<T>:\n\n```\npublic static class Extensions\n{\n\
    \    public static void ForAll<T>(\n        this IEnumerable<T> sequence,\n  \
    \      Action<T> action)\n    {\n        foreach (T item in sequence)\n      \
    \      action(item);\n    }\n}\n```"
