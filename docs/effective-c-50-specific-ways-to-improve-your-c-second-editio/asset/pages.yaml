    The Conditional attribute can be applied only to entire methods. In addition,
    any method with a Conditional attribute must have a return type of void. You cannot
    use the Conditional attribute for blocks of code inside methods or with methods
    that return values. Instead, create carefully constructed conditional methods
    and isolate the conditional behavior to those functions. You still need to review
    those conditional methods for side effects to the object state, but the Conditional
    attribute localizes those points much better than #if/#endif. With #if and #endif
    blocks, you can mistakenly remove important method calls or assignments.


    The previous examples use the predefined DEBUG or TRACE symbols. But you can extend
    this technique for any symbols you define. The Conditional attribute can be controlled
    by symbols defined in a variety of ways. You can define symbols from the compiler
    command line, from environment variables in the operating system shell, or from
    pragmas in the source code.


