    \ removed.\n}\n```\n\n```\nC cThing = new C();\n```\n\nHow many objects are created?\
    \ How big are they? It depends. If MyType is a value type, you’ve made one allocation.\
    \ The size of that allocation is twice the size of MyType. However, if MyType\
    \ is a reference type, you’ve made three allocations: one for the C object, which\
    \ is 8 bytes (assuming 32-bit pointers), and two more for each of the MyType objects\
    \ that are contained in a C object. The difference results because value types\
    \ are stored inline in an object, whereas reference types are not. Each variable\
    \ of a reference type holds a reference, and the storage requires extra allocation.\n\
    \nTo drive this point home, consider this allocation:\n\n```\nMyType[] arrayOfTypes\
    \ = new MyType[100];\n```\n\nIf MyType is a value type, one allocation of 100\
    \ times the size of a MyType object occurs. However, if MyType is a reference\
    \ type, one allocation just occurred. Every element of the array is null. When\
    \ you initialize each element in the array, you will have performed 101 allocations—and\
    \ 101 allocations take more time than 1 allocation. Allocating a large number\
    \ of"
