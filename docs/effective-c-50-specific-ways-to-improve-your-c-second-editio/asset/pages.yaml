    \ However, at that point, you’ve pretty much reimplemented the code that handles\
    \ dynamic dispatch for C# (see Item 41). Instead of all that work, just use dynamic.\n\
    \nYou should use the expression version for those times when the operands and\
    \ the result are the same. That gives you generic type parameter inference and\
    \ fewer permutations when the code fails at runtime. Here’s the version I would\
    \ recommend to use Expression for implementing runtime dispatch:\n\n```\n```csharp\n\
    public static class BinaryOperators<T>\n{\n    static Func<T, T, T> compiledExpression;\n\
    \n    public static T Add(T left, T right)\n    {\n        if (compiledExpression\
    \ == null)\n            createFunc();\n\n        return compiledExpression(left,\
    \ right);\n    }\n\n    private static void createFunc()\n    {\n        var leftOperand\
    \ = Expression.Parameter(typeof(T),\n            \"left\");\n```\n```"
