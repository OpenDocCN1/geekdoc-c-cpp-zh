  md: 'follows this strategy to initialize system colors. The static methods `Color.FromKnownColor()`
    and `Color.FromName()` return a copy of a color value that represents the current
    value for a given system color.


    Third, you can create a mutable companion class for those instances in which multistep
    operations are necessary to fully construct an immutable type. The .NET string
    class follows this strategy with the System.Text.StringBuilder class. You use
    the StringBuilder class to create a string using multiple operations. After performing
    all the operations necessary to build the string, you retrieve the immutable string
    from the StringBuilder.


    Immutable types are simpler to code and easier to maintain. Don’t blindly create
    get and set accessors for every property in your type. Your first choice for types
    that store data should be immutable, atomic value types. You easily can build
    more complicated structures from these entities.'
