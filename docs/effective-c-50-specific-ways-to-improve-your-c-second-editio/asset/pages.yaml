  md: 'The last version of the Customer struct, with the embedded RevenueComparer,
    lets you order a collection of customers by name, the natural order for customers,
    and provides an alternative order by exposing a class that implements the IComparer
    interface to order customers by revenue. If you don’t have access to the source
    for the Customer class, you can still provide an IComparer that orders customers
    using any of its public properties. You should use that idiom only when you do
    not have access to the source for the class, as when you need a different ordering
    for one of the classes in the .NET Framework.


    Nowhere in this item did I mention Equals() or the == operator (see Item 6). Ordering
    relations and equality are distinct operations. You do not need to implement an
    equality comparison to have an ordering relation. In fact, reference types commonly
    implement ordering based on the object contents, yet implement equality based
    on object identity. CompareTo() returns 0, even though Equals() returns false.
    That’s perfectly legal. Equality and ordering relations are not necessarily the
