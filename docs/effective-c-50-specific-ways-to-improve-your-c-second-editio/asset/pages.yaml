- pgno: 233
  md: 'It’s important here because you are using the WebClient class’s async methods
    to create the task. The type parameter for the TaskCompletionSource is the type
    of result returned from the task.


    The WebClient class uses the Event-based Asynchronous Pattern (EAP). That means
    you register a handler for an event that will be raised when an asynchronous operation
    completes. startDownload() stores the task completion information in the TaskCompletionSource
    when that event is raised. The TaskSheduler picks up the task and then the download
    is started. The method returns the Task object embedded inside the TaskCompletionSource
    so that the event results can be processed once the task completes.


