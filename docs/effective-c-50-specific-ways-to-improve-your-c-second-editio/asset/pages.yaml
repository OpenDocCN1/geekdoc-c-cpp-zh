    \ new Person { Name = \"Old Name\" };\nattendees.Add(p);\n\n// Try to change the\
    \ name:\n// Would work if Person was a reference type.\nPerson p2 = attendees[0];\n\
    p2.Name = \"New Name\";\n\n// Writes \"Old Name\":\nConsole.WriteLine(attendees[0].ToString());\n\
    ```\n\nPerson is a value type. The JIT compiler creates a specific closed generic\
    \ type for List<Person> so that Person objects are not boxed, because they are\
    \ stored in the attendees collection. Another copy gets made when you remove the\
    \ Person object to access the Name property to change. All you did was change\
    \ the copy. In fact, a third copy was made to call the ToString() function through\
    \ the attendees[0] object. For this and many other reasons, you should create\
    \ immutable value types (see Item 20).\n\nYes, value types can be converted to\
    \ System.Object or any interface reference. That conversion happens implicitly,\
    \ complicating the task of finding them. Those are the rules of the environment\
    \ and the language. The boxing and unboxing operations make copies where you might\
    \ not expect. That causes bugs. There is also a performance cost to treating value\
