- pgno: 91
  md: "The final reason to move initialization into the body of a constructor is to\
    \ facilitate exception handling. You cannot wrap the initializers in a try block.\
    \ Any exceptions that might be generated during the construction of your member\
    \ variables get propagated outside your object. You cannot attempt any recovery\
    \ inside your class. You should move that initialization code into the body of\
    \ your constructors so that you implement the proper recovery code to create your\
    \ type and gracefully handle the exception (see Item 47).\n\nMember initializers\
    \ are the simplest way to ensure that the member variables in your type are initialized\
    \ regardless of which constructor is called. The initializers are executed before\
    \ each constructor you make for your type. Using this syntax means that you cannot\
    \ forget to add the proper initialization when you add new constructors for a\
    \ future release. Use initializers when all constructors create the member variable\
    \ the same way; it’s simpler to read and easier to maintain.\n\n# Item 13: Use\
    \ Proper Initialization for Static Class Members\n\nYou know that you should initialize\
    \ static member variables in a type before you create any instances of that type.\
    \ C# lets you use static initializers and a static constructor for this purpose.\
    \ A static constructor is a special function that executes before any other methods,\
    \ variables, or properties defined in that class are accessed for the first time.\
    \ You use this function to initialize static variables, enforce the singleton\
    \ pattern, or perform any other necessary work before a class is usable. You should\
    \ not use your instance constructors, some special private function, or any other\
    \ idiom to initialize static variables.\n\nAs with instance initialization, you\
    \ can use the initializer syntax as an alternative to the static constructor.\
    \ If you simply need to allocate a static member, use the initializer syntax.\
    \ When you have more complicated logic to initialize static member variables,\
    \ create a static constructor.\n\nImplementing the singleton pattern in C# is\
    \ the most frequent use of a static constructor. Make your instance constructor\
    \ private, and add an initializer:\n\n```\npublic class MySingleton\n{\n    private\
    \ static readonly MySingleton theOneAndOnly =\n        new MySingleton();\n```"
