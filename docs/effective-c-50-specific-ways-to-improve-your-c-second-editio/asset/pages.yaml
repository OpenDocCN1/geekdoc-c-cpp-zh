- pgno: 15
  md: '# 1 | C# Language Idioms


    Why should you change what you are doing today if it works? The answer is that
    you can be better. You change tools or languages because you can be more productive.
    You don’t realize the expected gains if you don’t change your habits. This is
    harder when the new language, C#, has so much in common with a familiar language,
    such as C++ or Java. C# is another curly braced language, making it easy to fall
    into the same idioms you used in other languages in the same family. That will
    prevent you from getting the most out of C#. The C# language has evolved since
    its first commercial release in 2001. It’s now much farther removed from C++ or
    Java than it was in its original release. If you are approaching C# from another
    language, you need to learn the C# idioms so that the language works with you,
    rather than against you. This chapter discusses the habits that you should change—and
    what you should do instead.


    # Item 1: Use Properties Instead of Accessible Data Members


    Properties have always been first-class citizens in the C# language. Several enhancements
    since the 1.0 release of the C# language have made properties even more expressive.
    You can specify different access restrictions on the getter and setter. Implicit
    properties minimize the hand typing for properties instead of data members. If
    you’re still creating get and set public methods by hand, stop now. Properties
    let you expose data members as part of your public interface and still provide
    the encapsulation you want in an object-oriented environment. Properties are language
    elements that are accessed as though they are data members, but they are implemented
    as methods.


    Some members of a type really are best represented as data: the name of a customer,
    the x,y location of a point, or last year’s revenue. Properties enable you to
    create an interface that acts like data access but still has all the benefits
    of a method. Client code accesses properties as though they are accessing public
    fields. But the actual implementation uses methods, in which you define the behavior
    of property accessors.'
  merge: -1
  img_proc: true
- pgno: 16
  md: "The .NET Framework assumes that you'll use properties for your public data\
    \ members. In fact, the data binding classes in the .NET Framework support properties,\
    \ not public data members. This is true for all the data binding libraries: WPF,\
    \ Windows Forms, Web Forms, and Silverlight. Data binding ties a property of an\
    \ object to a user interface control. The data binding mechanism uses reflection\
    \ to find a named property in a type:\n\n```\ntextBoxCity.DataBindings.Add(\"\
    Text\",\n    address, \"City\");\n```\n\nThe previous code binds the Text property\
    \ of the textBoxCity control to the City property of the address object. It will\
    \ not work with a public data member named City; the Framework Class Library designers\
    \ did not support that practice. Public data members are bad practice, so support\
    \ for them was not added. Their decision simply gives you yet another reason to\
    \ follow the proper object-oriented techniques.\n\nYes, data binding applies only\
    \ to those classes that contain elements that are displayed in your user interface\
    \ logic. But that doesn't mean properties should be used exclusively in UI logic.\
    \ You should use properties for other classes and structures. Properties are far\
    \ easier to change as you discover new requirements or behaviors over time. You\
    \ might soon decide that your customer type should never have a blank name. If\
    \ you used a public property for Name, that's easy to fix in one location:\n\n\
    ```\npublic class Customer\n{\n    private string name;\n    public string Name\n\
    \    {\n        get { return name; }\n        set\n        {\n            if (string.IsNullOrEmpty(value))\n\
    \                throw new ArgumentException(\n                    \"Name cannot\
    \ be blank\",\n                    \"Name\");\n            name = value;\n   \
    \     }\n    }\n    // More Elided.\n}\n```"
