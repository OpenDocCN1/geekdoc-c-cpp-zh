  md: "It may not look that significant, but it can enable more reuse. Anytime you\
    \ are performing work on a sequence of elements, ForAll can do the work.\n\nThis\
    \ is a small, simple operation, so you may not see much benefit. In fact, you’re\
    \ probably right. Let’s look at some different problems.\n\nMany operations require\
    \ you to work through nested loops. Suppose you need to generate (X,Y) pairs for\
    \ all integers from 0 through 99. It’s obvious how you would do that with nested\
    \ loops:\n\n```\nprivate static IEnumerable<Tuple<int, int>> ProduceIndices()\n\
    {\n    for (int x = 0; x < 100; x++)\n        for (int y = 0; y < 100; y++)\n\
    \            yield return Tuple.Create(x, y);\n}\n```\n\nOf course, you could\
    \ produce the same objects with a query:\n\n```\nprivate static IEnumerable<Tuple<int,\
    \ int>> QueryIndices()\n{\n    return from x in Enumerable.Range(0, 100)\n   \
    \        from y in Enumerable.Range(0, 100)\n           select Tuple.Create(x,\
    \ y);\n}\n```\n\nThey look similar, but the query syntax keeps its simplicity\
    \ even as the problem description gets more difficult. Change the problem to generating\
    \ only those pairs where the sum of X and Y is less than 100. Compare these two\
    \ methods:\n\n```\nprivate static IEnumerable<Tuple<int, int>> ProduceIndices2()\n\
