- pgno: 155
  md: "# Item 23: Understand How Interface Methods Differ from Virtual Methods\n\n\
    ```\n```csharp\nIMsg m = d as IMsg;\nm.Message(); // prints \"MyDerivedClass\"\
    \nMyClass b = d;\nb.Message(); // prints \"MyClass\"\n```\n```\n\nOne way to fix\
    \ this problem is to modify the base class, declaring that the interface methods\
    \ should be virtual:\n\n```\n```csharp\npublic class MyClass : IMsg\n{\n\tpublic\
    \ virtual void Message()\n\t{\n\t\tConsole.WriteLine(\"MyClass\");\n\t}\n}\n```\n\
    ```\n\n```\n```csharp\npublic class MyDerivedClass : MyClass\n{\n\tpublic override\
    \ void Message()\n\t{\n\t\tConsole.WriteLine(\"MyDerivedClass\");\n\t}\n}\n```\n\
    ```\n\nMyDerivedClass—and all classes derived from MyClass—can declare their own\
    \ methods for Message(). The overridden version will be called every time: through\
    \ the MyDerivedClass reference, through the IMsg reference, and through the MyClass\
    \ reference.\n\nIf you dislike the concept of impure virtual functions, just make\
    \ one small change to the definition of MyClass:\n\n```\n```csharp\npublic abstract\
    \ class MyClass : IMsg\n{\n\tpublic abstract void Message();\n}\n```\n```\n\n\
    Yes, you can implement an interface without actually implementing the methods\
    \ in that interface. By declaring abstract versions of the methods in the interface,\
    \ you declare that all types derived from your type must implement that interface.\
    \ The IMsg interface is part of the declaration of MyClass, but defining the methods\
    \ is deferred to each derived class."
