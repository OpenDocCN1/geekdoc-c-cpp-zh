    \            if (x + y < 100)\n                yield return Tuple.Create(x, y);\n\
    }\n```\n\n```\nprivate static IEnumerable<Tuple<int, int>> QueryIndices2()\n{\n\
    \    return from x in Enumerable.Range(0, 100)\n           from y in Enumerable.Range(0,\
    \ 100)\n```"
