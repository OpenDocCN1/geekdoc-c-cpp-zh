  md: "If you run your little test, you see the following obvious output:\n\n+   Value\
    \ is 5\n+   Value is 6\n+   ...\n+   Value is 9\n\nTime passes, and you release\
    \ a new version of the Infrastructure assembly with the following changes:\n\n\
    ```\npublic class UsefulValues\n{\n\tpublic static readonly int StartValue = 105;\n\
    \tpublic const int EndValue = 120;\n}\n```\n\nYou distribute the Infrastructure\
    \ assembly without rebuilding your Application assembly. You expect to get this:\n\
    \n+   Value is 105\n+   Value is 106\n+   ...\n+   Value is 119\n\nIn fact, you\
    \ get no output at all. The loop now uses the value 105 for its start and 10 for\
    \ its end condition. The C# compiler placed the const value of 10 into the Application\
    \ assembly instead of a reference to the storage used by EndValue. Contrast that\
    \ with the StartValue value. It was declared as readonly: It gets resolved at\
    \ runtime. Therefore, the Application assembly makes use of the new value without\
    \ even recompiling the Application assembly; simply installing an updated version\
    \ of the Infrastructure assembly is enough to change the behavior of all clients\
    \ using that value. Updating the value of a public constant should be viewed as\
    \ an interface change. You must recompile all code that references that constant.\
    \ Updating the value of a read-only constant is an implementation change; it is\
    \ binary compatible with existing client code.\n\nOn the other hand, sometimes\
    \ you really mean for a value to be determined at compile time. For example, consider\
    \ a set of constants to mark different versions of an object in its serialized\
    \ form (see Item 27). Persistent values that mark specific versions should be\
    \ compile-time constants; they never change. The current version should be a runtime\
    \ constant, changing with each release."
