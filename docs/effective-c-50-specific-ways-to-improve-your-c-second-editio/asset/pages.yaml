- pgno: 10
  md: '# Who Should Read This Book?


    Effective C# was written for professional developers who use C# as part of their
    daily toolset. It assumes you are familiar with the C# syntax and the language’s
    features. The second edition assumes you understand the new syntax added in C#
    4.0, as well as the syntax available in the previous versions of the language.
    This book does not include tutorial instruction on language features. Instead,
    this book discusses how you can integrate all the features of the current version
    of the C# language into your everyday development.


    In addition to language features, I assume you have some knowledge of the Common
    Language Runtime (CLR) and Just-In-Time (JIT) compiler.


    # About the Content


    There are language constructs you’ll use every day in almost every C# program
    you write. Chapter 1, “C# Language Idioms,” covers those language idioms you''ll
    use so often they should feel like well-worn tools in your hands. These are the
    building blocks of every type you create and every algorithm you implement.


    Working in a managed environment doesn’t mean the environment absolves you of
    all your responsibilities. You still must work with the environment to create
    correct programs that satisfy the stated performance requirements. It’s not just
    about performance testing and performance tuning. Chapter 2, “.NET Resource Management,”
    teaches you the design idioms that enable you to work with the environment to
    achieve those goals before detailed optimization begins.


    In many ways, we write programs to satisfy human readers rather than a compiler.
    All the compiler cares about is that a program is valid. Our colleagues want to
    understand our intent as well. Chapter 3, “Expressing Designs in C#,” discusses
    how the C# language can be applied to express your design intent. There are always
    several ways to solve a problem. The recommendations in Chapter 3 will help you
    choose the solution that best expresses your design intent to fellow developers.


    C# is a small language, supported by a rich framework library. Chapter 4, “Working
    with the Framework,” covers the portions of the .NET Base Class Library (BCL)
    that support your core algorithms. In addition, I cover'
  merge: -1
  img_proc: true
- pgno: 11
  md: 'some of the common idioms that you’ll encounter throughout the framework. Multicore
    processors are a way of life, and the Parallel Task Library provides a step forward
    in creating multithreaded programs on the .NET platform. I cover the most common
    practices for the Parallel Task Library in this chapter.


    Chapter 5, “Dynamic Programming in C#,” discusses how to use C# as a dynamic language.
    C# is a strongly typed, statically typed language. However, more and more programs
    contain both dynamic and static typing. C# provides ways for you to leverage dynamic
    programming idioms without losing the benefits of static typing throughout your
    entire program. You’ll learn how to use dynamic features and how to avoid having
    dynamic types leak through your entire program.


    Chapter 6, “Miscellaneous,” covers those items that somehow continue to defy classification.
    These are the techniques you’ll use often to create robust programs that are easier
    to maintain and extend.


    # Code Conventions


    We no longer look at code in monochrome, and we shouldn’t in books either. While
    it’s impossible to replicate the experience of using a modern IDE on paper, I’ve
    tried to provide a better experience reading the code in the book. Where the medium
    supports it, the code samples use the standard Visual Studio IDE colors for all
    code elements. Where I am pointing to particular changes in samples, those changes
    are highlighted.


    Showing code in a book still requires making some compromises for space and clarity.
    I’ve tried to distill the samples down to illustrate the particular point of the
    sample. Often that means eliding other portions of a class or a method. Sometimes
    that will include eliding error recovery code for space. Public methods should
    validate their parameters and other inputs, but that code is usually elided for
    space. Similar space considerations remove validation of method calls, and `try/finally`
    clauses that would often be included in complicated algorithms.


    I also usually assume most developers can find the appropriate namespace when
    samples use one of the common namespaces. You can safely assume that every sample
    implicitly includes the following using statements:


    ```

    ```csharp

    using System;

    using System.Collections.Generic;

    ```

    ```'
