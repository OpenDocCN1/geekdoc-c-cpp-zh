  md: "Even if you did spot where the parameter order was reversed, did you think\
    \ that it was an error? The imperative model places so much more emphasis on how\
    \ actions are performed that it’s easy to get lost in those actions and lose the\
    \ original intent for what actions are being accomplished.\n\nThere’s one more\
    \ justification for using query syntax over looping constructs: Queries create\
    \ a more composable API than looping constructs can provide. Query syntax naturally\
    \ leads to constructing algorithms as small blocks of code that perform one operation\
    \ on a sequence. The deferred execution model for queries enables developers to\
    \ compose these single operations into multiple operations that can be accomplished\
    \ in one enumeration of the sequence. Looping constructs cannot be similarly composed.\
    \ You must either create interim storage for each step, or create methods for\
    \ each combination of operations on a sequence.\n\nThat last example shows how\
    \ this works. The operation combines a filter (the where clause) with a sort (the\
    \ orderby clause) and a projection (the select clause). All of these are accomplished\
    \ in one enumeration operation. The imperative version creates an interim storage\
    \ model and separates the sort into a distinct operation.\n\nI’ve discussed this\
    \ as query syntax, though you should remember that every query has a corresponding\
    \ method call syntax. Sometimes the query is more natural, and sometimes the method\
    \ call syntax is more natural. In the example above, the query syntax is much\
    \ more readable. Here’s the equivalent method call syntax:\n\n```\nprivate static\
    \ IEnumerable<Tuple<int, int>> MethodIndices3()\n{\n    return Enumerable.Range(0,\
    \ 100).\n        SelectMany(x => Enumerable.Range(0,100),\n        (x,y) => Tuple.Create(x,y)).\n\
    \        Where(pt => pt.Item1 + pt.Item2 < 100).\n        OrderByDescending(pt\
    \ =>\n            pt.Item1* pt.Item1 + pt.Item2 * pt.Item2);\n}\n```\n\nIt’s a\
    \ matter of style whether the query or the method call syntax is more readable.\
    \ In this instance, I’m convinced the query syntax is clearer. However, other\
    \ examples may be different. Furthermore, some methods do not have equivalent\
    \ query syntax. Methods such as Take, TakeWhile, Skip, SkipWhile, Min, and Max\
    \ require you to use the method syntax at some"
