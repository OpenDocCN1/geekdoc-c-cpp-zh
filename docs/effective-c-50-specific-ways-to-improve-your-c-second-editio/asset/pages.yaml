    \ Foo()\n{\n    return foo;\n}\n```\n\n```\n// Not CLS compliant, parameter is\
    \ an unsigned int.\npublic void Foo2(UInt32 parm)\n{\n}\n```\n\nRemember that\
    \ creating a CLS-compliant assembly affects only items that can be seen outside\
