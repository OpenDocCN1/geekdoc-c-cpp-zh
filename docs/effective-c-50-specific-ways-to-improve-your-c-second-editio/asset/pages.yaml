    Collector defines generations to optimize its work. Generations help the GC identify
    the likeliest garbage candidates more quickly. Any object created since the last
    garbage collection operation is a generation 0 object. Any object that has survived
    one GC operation is a generation 1 object. Any object that has survived two or
    more GC operations is a generation 2 object. The purpose of generations is to
    separate local variables and objects that stay around for the life of the application.
    Generation 0 objects are mostly local variables. Member variables and global variables
    quickly enter generation 1 and eventually enter generation 2.


    The GC optimizes its work by limiting how often it examines first- and second-generation
    objects. Every GC cycle examines generation 0 objects. Roughly 1 GC out of 10
    examines the generation 0 and 1 objects. Roughly 1 GC cycle out of 100 examines
    all objects. Think about finalization and its cost again: An object that requires
    finalization might stay in memory for nine GC cycles more than it would if it
    did not require finalization. If it still has not been finalized, it moves to
    generation 2. In generation 2, an object lives for an extra 100 GC cycles until
