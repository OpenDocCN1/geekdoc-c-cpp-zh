    public IBindingList BindingData\n{\n    get { return listOfData; }\n}\npublic\
    \ ICollection<ImportantData> CollectionOfData\n{\n    get { return listOfData;\
    \ }\n}\n// other details elided\n}\n```\n\nBefore we talk about how to create\
    \ a completely read-only view of the data, let’s take a brief look at how you\
    \ can respond to changes in your data when you allow public clients to modify\
    \ it. This is important because you’ll often want to export an IBindingList to\
    \ UI controls so that the user can edit the data. You’ve undoubtedly already used\
    \ Windows forms data binding to provide the means for your users to edit private\
    \ data in your objects. The BindingList<T> class supports the IBindingList interface\
    \ so that you can respond to any additions, updates, or deletions of items in\
    \ the collection being shown to the user.\n\nYou can generalize this technique\
    \ anytime you want to expose internal data elements for modification by public\
    \ clients, but you need to validate and respond to those changes. Your class subscribes\
    \ to events generated by your internal data structure. Event handlers validate\
    \ changes or respond to those changes by updating other internal state. (See Item\
    \ 25.)\n\nGoing back to the original problem, you want to let clients view your\
    \ data but not make any changes. When your data is stored in a BindingList<T>,\
    \ you can enforce that by setting various properties on the BindingList object\
    \ (AddEdit, AllowNew, AllowRemove, etc.). The values of these properties are honored\
    \ by UI controls. The UI controls enable and disable different actions based on\
    \ the value of these properties. These are public properties, so that you can\
    \ modify the behavior of your collection. But that also means you should not expose\
    \ the BindingList<T> object as a public property. Clients could modify those properties\
    \ and circumvent your intent to make a read-only binding collection. Once again,\
    \ exposing the internal storage through an interface type rather than the class\
    \ type will limit what client code can do with that object."
