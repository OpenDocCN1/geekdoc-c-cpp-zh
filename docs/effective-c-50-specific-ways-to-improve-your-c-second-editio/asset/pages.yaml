    lead to hard-to-find bugs in your code. In this item, you’ll learn why creating
    overloads of methods that are defined in a base class leads to similar issues.
    You should not overload methods declared in a base class.


    The rules for overload resolution in the C# language are necessarily complicated.
    Possible candidate methods might be declared in the target class, any of its base
