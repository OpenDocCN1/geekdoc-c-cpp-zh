    BindingList<ImportantData> stuff = bizObj.Data;\n// Not intended, but allowed:\n\
    stuff.Clear(); // Deletes all data.\n```\n\nAny public client of MyBusinessObject\
    \ can modify your internal dataset. You created properties to hide your internal\
    \ data structures. You provided methods to let clients manipulate the data only\
    \ through known methods, so your class can manage any changes to internal state.\
    \ And then a read-only property opens a gaping hole in your class encapsulation.\
    \ It’s not a read-write property, where you would consider these issues, but a\
    \ read-only property.\n\nWelcome to the wonderful world of reference-based systems.\
    \ Any member that returns a reference type returns a handle to that object. You\
