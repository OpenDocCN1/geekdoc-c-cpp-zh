    # Item 43: Use Expressions to Transform Late Binding into Early Binding


    Late binding APIs use the symbol text to do their work. Compiled APIs do not need
    that information, because the compiler has already resolved symbol references.
    The Expression API enables you to bridge both worlds. Expression objects contain
    a form of abstract symbol tree that represents the algorithms you want to execute.
    You can use the Expression API to execute that code. You can also examine all
    the symbols, including the names of variables, methods, and properties. You can
    use the Expression APIs to create strongly typed compiled methods that interact
    with portions of the system that rely on late binding, and use the names of properties
    or other symbols.


    One of the most common examples of a late binding API is the property notification
    interfaces used by Silverlight and WPF. Both Silverlight and WPF were designed
    to respond to bound properties changing so that user interface elements can respond
    when data elements change underneath the user interface. Of course, there is no
    magic; there is only code that you'
