    # Providing Feedback


    Despite my best efforts, and the efforts of the people who have reviewed the text,
    errors may have crept into the text or samples. If you believe you have found
    an error, please contact me at bill.wagner@srtsolutions.com. Errata will be posted
    at http://srtsolutions.com/blogs/effectivecsharp. Many of the items in this book,
    and More Effective C#, are the result of email conversations with other C# developers.
    If you have questions or comments about the recommendations, please contact me.
    Discussions of general interest will be covered on my blog at http://srtsolutions.com/blogs/billwagner.


    # Acknowledgments


    There are many people to whom I owe thanks for their contributions to this book.
    I’ve been privileged to be part of an amazing C# community over the years. Everyone
    on the C# Insiders mailing list (whether inside or outside Microsoft) has contributed
    ideas and conversations that made this a better book.


    I must single out a few members of the C# community who directly helped me with
    ideas, and with turning ideas into concrete recommendations. Conversations with
