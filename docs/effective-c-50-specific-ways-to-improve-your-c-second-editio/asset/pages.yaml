    # Item 49: Prefer CLS-Compliant Assemblies


    The .NET environment is language agnostic: Developers can incorporate components
    written in different .NET languages without limitations. In practice, it’s almost
    true. You must create assemblies that are compliant with the Common Language Subsystem
    (CLS) to guarantee that developers writing programs in other languages can use
    your components.


    One of C#’s advantages is that because it was designed to run on the CLR, almost
    all of your C# assemblies will be CLS compliant. That’s not true for many other
    languages. Many F# constructs do not compile down to CLS-compliant types. DLR
    languages, such as IronPython and IronRuby, do not create CLS-compliant assemblies
    in this release. That’s one of the reasons C# is an excellent choice for component
    development in .NET. C# components can be consumed by all the languages that run
    on the CLR. That’s because it’s not that hard to create C# components that are
    CLS compliant.


    CLS compliance is a new twist on that least common denominator approach to interoperability.
    The CLS specification is a subset of operations that every language must support.
    To create a CLS-compliant assembly, you must create an assembly whose public interface
    is limited to those features in the CLS specification. Then any language supporting
    the CLS specification must be capable of using the component. This does not mean
    you must limit your entire programming palette to the CLS-compliant subset of
    the C# language, however.'
