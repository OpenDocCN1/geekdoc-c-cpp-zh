  md: "Notice that I had to add the new keyword to the definition of the previous\
    \ Message method (see Item 33). MyClass.Message() is not virtual. Derived classes\
    \ cannot provide an overridden version of Message. The MyDerived class creates\
    \ a new Message method, but that method does not override MyClass.Message: It\
    \ hides it. Furthermore, MyClass.Message is still available through the IMsg reference:\n\
    \n```\nMyDerivedClass d = new MyDerivedClass();\nd.Message(); // prints \"MyDerivedClass\"\
    .\nIMsg m = d as IMsg;\nm.Message(); // prints \"MyClass\"\n```\n\nInterface methods\
    \ are not virtual. When you implement an interface, you are declaring a concrete\
    \ implementation of a particular contract in that type.\n\nBut you often want\
    \ to create interfaces, implement them in base classes, and modify the behavior\
    \ in derived classes. You can. You’ve got two options. If you do not have access\
    \ to the base class, you can reimplement the interface in the derived class:\n\
    \n```\npublic class MyDerivedClass : MyClass\n{\n    public new void Message()\n\
    \    {\n        Console.WriteLine(\"MyDerivedClass\");\n    }\n}\n```\n\nThe addition\
    \ of the IMsg keyword changes the behavior of your derived class so that IMsg.Message()\
    \ now uses the derived class version:\n\n```\nMyDerivedClass d = new MyDerivedClass();\n\
    d.Message(); // prints \"MyDerivedClass\".\nIMsg m = d as IMsg;\nm.Message();\
    \ // prints \" MyDerivedClass \"\n```\n\nYou still need the new keyword on the\
    \ MyDerivedClass.Message() method. That’s your clue that there are still problems\
    \ (see Item 33). The base class version is still accessible through a reference\
    \ to the base class:\n\n```\nMyDerivedClass d = new MyDerivedClass();\nd.Message();\
    \ // prints \"MyDerivedClass\".\n```"
