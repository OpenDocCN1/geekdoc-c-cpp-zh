  img_proc: true
- pgno: 124
  md: "There is less heap fragmentation, less garbage, and less indirection. More\
    \ important, value types are copied when they are returned from methods or properties.\
    \ There is no danger of exposing references to internal structures. But you pay\
    \ in terms of features. Value types have very limited support for common object-oriented\
    \ techniques. You cannot create object hierarchies of value types. You should\
