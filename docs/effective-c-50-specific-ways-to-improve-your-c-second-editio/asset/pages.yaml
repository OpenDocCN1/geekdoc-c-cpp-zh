  md: "```\nset;\n    }\n}\n```\n\nYou’ll notice that the last examples use the C#\
    \ 3.0 implicit property syntax. Creating a property to wrap a backing store is\
    \ a common pattern. Often, you won’t need validation logic in the property getters\
    \ or setters. The language supports the simplified implicit property syntax to\
    \ minimize typing needed to expose a simple field as a property. The compiler\
    \ creates a private member field (typically called a backing store) for you and\
    \ implements the obvious logic for both the get and set accessors.\n\nYou can\
    \ extend properties to be abstract and define properties as part of an interface\
    \ definition, using similar syntax to implicit properties. The example below shows\
    \ a property definition in a generic interface. Note that while the syntax is\
    \ consistent with implicit properties, the interface definition below does not\
    \ include any implementation. It defines a contract that must be satisfied by\
    \ any type that implements this interface.\n\n```\npublic interface INameValuePair<T>\n\
    {\n    string Name\n    {\n        get;\n    }\n\n    T Value\n    {\n       \
    \ get;\n        set;\n    }\n}\n```\n\nProperties are full-fledged, first-class\
    \ language elements that are an extension of methods that access or modify internal\
    \ data. Anything you can do with member functions, you can do with properties.\n\
    \nThe accessors for a property are two separate methods that get compiled into\
    \ your type. You can specify different accessibility modifiers to the get and\
    \ set accessors in a property in C#. This gives you even greater control over\
    \ the visibility of those data elements you expose as properties:"
