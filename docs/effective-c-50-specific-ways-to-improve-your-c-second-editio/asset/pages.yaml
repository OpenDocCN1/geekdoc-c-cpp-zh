    \ prevent other programmers from creating an instance of a value type that is\
    \ initialized to all 0s. Make that the default value for your type.\n\nOne special\
    \ case is enums. Never create an enum that does not include 0 as a valid choice.\
    \ All enums are derived from System.ValueType. The values for the enumeration\
    \ start at 0, but you can modify that behavior:\n\n```\npublic enum Planet\n{\n\
    \    // Explicitly assign values.\n```"
