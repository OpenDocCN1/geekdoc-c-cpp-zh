    \ complexity. To fully implement exception safety, you would need to create defensive\
    \ copies around any code block in which you change more than one field. Thread\
    \ safety would require adding significant thread-synchronization checks on each\
    \ property accessor, both sets and gets. All in all, it would be a significant\
    \ undertaking—and one that would likely be extended over time as you add new features.\n\
