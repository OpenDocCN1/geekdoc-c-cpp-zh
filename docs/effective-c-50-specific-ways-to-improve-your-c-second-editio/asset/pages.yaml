- pgno: 315
  md: "Finally, watch out for non-CLS types sneaking into an interface when you use\
    \ polymorphic arguments. It’s easy to do with event arguments. You can create\
    \ a type that is not compliant with CLS and use it where a base type that is CLS-compliant\
    \ is expected.\n\nSuppose that you created this class derived from EventArgs:\n\
    \n```\npublic class BadEventArgs : EventArgs\n{\n    public UInt32 ErrorCode;\n\
    }\n```\n\nThe BadEventArgs type is not CLS compliant; you should not use it with\
    \ event handlers written in other languages. But polymorphism makes this easy\
    \ to do. You can declare the event type to use the base class, EventArgs:\n\n\
    ```\n// Hiding the non-compliant event argument:\npublic delegate void MyEventHandler(\n\
    \    object sender, EventArgs args );\n\npublic event MyEventHandler OnStuffHappens;\n\
    ```\n\n```\n// Code to raise Event:\nBadEventArgs arg = new BadEventArgs();\n\
    arg.ErrorCode = 24;\n```\n\n```\n// Interface is legal, runtime type is not:\n\
    OnStuffHappens(this, arg);\n```\n\nThe interface declaration, which uses an EventArgs\
    \ argument, is CLS compliant. However, the actual type you substituted in the\
    \ event arguments was not. The end result is a type that some languages cannot\
    \ use. Developers trying to use those types will not be able to call the methods\
    \ in your assembly. Their language may even hide the visibility of those APIs.\
    \ Or, they may show that the APIs exist but not provide a way to access them.\n\
    \nThis discussion of CLS compliance ends with how CLS-compliant classes implement\
    \ compliant or noncompliant interfaces. It can get complicated, but we’ll simplify\
    \ it. Understanding CLS compliance with interfaces also will help you fully understand\
    \ what it means to be CLS compliant and how the environment views compliance."
  merge: -1
  img_proc: true
- pgno: 316
  md: "This interface is CLS compliant if it is declared in a CLS-compliant assembly:\n\
    \n```\n```csharp\n[assembly: CLSCompliant(true)]\npublic interface IFoo\n{\n \
    \   void DoStuff(Int32 arg1, string arg2);\n}\n```\n```\n\nYou can implement that\
    \ interface in any CLS-compliant class. However, if you declare this interface\
    \ in an assembly that is not marked as CLS compliant, the IFoo interface is not\
    \ CLS compliant. In other words, an interface is CLS compliant only if it is defined\
    \ in a CLS-compliant assembly; conforming to the CLS spec is not enough. The reason\
    \ is compiler performance. The compilers check CLS compliance on types only when\
    \ the assembly being compiled is marked as CLS compliant. Similarly, the compilers\
    \ assume that types declared in assemblies that are not CLS compliant actually\
    \ are not CLS compliant. However, the members of this interface have CLS-compliant\
    \ signatures. Even if IFoo is not marked as CLS compliant, you can implement IFoo\
    \ in a CLS-compliant class. Clients of this class could access DoStuff through\
    \ the class reference, but not through the IFoo reference.\n\nConsider this small\
    \ variation:\n\n```\n```csharp\npublic interface IFoo2\n{\n    // Non-CLS compliant,\
    \ Unsigned int\n    void DoStuff(UInt32 arg1, string arg2);\n}\n```\n```\n\nA\
    \ class that publicly implements IFoo2 is not CLS compliant. To make a CLS-compliant\
    \ class that implements IFoo2, you must use explicit interface implementation:\n\
    \n```\n```csharp\npublic class MyClass2 : IFoo2\n{\n    // explicit interface\
    \ implementation.\n    // DoStuff() is not part of MyClass's public interface\n\
    \    void IFoo2.DoStuff(UInt32 arg1, string arg2)\n    {\n        // content elided.\n\
    \    }\n}\n```\n```"
  merge: -1
