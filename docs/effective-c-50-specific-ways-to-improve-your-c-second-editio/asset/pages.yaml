  md: "or class keyword when you create the type, but it’s much more work to update\
    \ all the clients using your type if you change it later.\n\nIt’s not as simple\
    \ as preferring one over the other. The right choice depends on how you expect\
    \ to use the new type. Value types are not polymorphic. They are better suited\
    \ to storing the data that your application manipulates. Reference types can be\
    \ polymorphic and should be used to define the behavior of your application. Consider\
    \ the expected responsibilities of your new type, and from those responsibilities,\
    \ decide which type to create. Structs store data. Classes define behavior.\n\n\
    The distinction between value types and reference types was added to .NET and\
    \ C# because of common problems that occurred in C++ and Java. In C++, all parameters\
    \ and return values were passed by value. Passing by value is very efficient,\
    \ but it suffers from one problem: partial copying (sometimes called slicing the\
    \ object). If you use a derived object where a base object is expected, only the\
    \ base portion of the object gets copied. You have effectively lost all knowledge\
