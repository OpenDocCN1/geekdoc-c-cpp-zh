    I also had great email conversations with Stephen Toub and Michael Wood on the
    Parallel Task Library and its implications on C# idioms.


    I had a wonderful team of technical reviewers for this edition. Jason Bock, Claudio
    Lassala, and Tomas Petricek pored over the text and the samples to'
