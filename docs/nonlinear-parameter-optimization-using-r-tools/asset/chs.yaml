  \n\n\n\n\n### 7.1.3 使用非线性最小二乘法\n\n如所述，我们可以使用非线性最小二乘法来求解非线性方程（NLEs）。多年来，我一直倾向于使用这种方法，但必须承认，这种倾向可能源于对此类方法的熟悉。当然，有必要检查在建议解处的平方和是否基本为零。此外，某些非线性最小二乘工具，特别是\
  \ R 中的 `nls()` 函数，并不是为了处理小残差问题设计的。\n\n注意，诸如 `nlmrt` 包中的工具可以处理参数边界，这对于寻找可行解或排除不可行解可能有所帮助。\n\
  \n### 7.1.4 使用函数最小化方法\n\n更进阶的方法是将通用函数最小化工具应用于方程的平方和函数。在这里，我们忽略了特殊结构，并且必须再次检查在建议解处目标函数是否为零。虽然这不是理想的方法，但在约束条件很重要时，通用工具可能允许应用这些约束。\n\
  \n## 7.2 比较各种方法的简单示例\n\n(Dennis and Schnabel 1983, Example 6.5.1, p. 149) 提供了一个包含两个方程的简单示例，我们可以用它来说明上述建议。我们将方程写为残差，然后尝试找到具有\
  \ ![c07-math-0003](img/c07-math-0003.png) 的解。\n\n**7.2** ![equation](img/c07-math-0004.png)\n\
  \n我们首先建立残差及其偏导数（雅可比矩阵）。\n\n```\n# Dennis Schnabel example 6.5.1 page 149\ndslnex\
  \ <- function(x) {\n    r <- numeric(2)\n    r[1] <- x[1]² + x[2]² - 2\n    r[2]\
  \ <- exp(x[1] - 1) + x[2]³ - 2\n    r\n}\njacdsln <- function(x) {\n    n <- length(x)\n\
  \    Df <- matrix(numeric(n * n), n, n)\n    Df[1, 1] <- 2 * x[1]\n    Df[1, 2]\
  \ <- 2 * x[2]\n    Df[2, 1] <- exp(x[1] - 1)\n    Df[2, 2] <- 3 * x[2]²\n    Df\n\
  }\nssdsln <- function(x) {\n    ## a sum of squares function for 6.5.1 example\n\
  \    rr <- dslnex(x)\n    val <- as.double(crossprod(rr))\n}\n```\n\n现在我们将尝试使用 `BB`\
  \ 和 `nleqslv` 中的 NLE 工具来求解这些方程。\n\n```\nrequire(microbenchmark)  # 用于计时\nrequire(BB)\n\
  require(nleqslv)\nxstart <- c(2, 0.5)\nfstart <- dslnex(xstart)\n## xstart:\nprint(xstart)\n\
  ## [1] 2.0 0.5\n## resids at start:\nprint(fstart)\n## [1] 2.25000 0.84328\n# a\
  \ solution is c(1,1)\nprint(dslnex(c(1, 1)))\n## [1] 0 0\n```\n\n我们现在将尝试通过各种方法找到这个解。在此过程中，我们将使用\
  \ `microbenchmark` 获取每个方法执行时间的平均值和标准差。我们包含了调用语法，但隐藏了数据处理过程以节省空间并保持整洁。\n\n首先，让我们尝试\
  \ `BB` 包的“默认”求解器。\n\n```\ntabbx <- microbenchmark(abbx <- BBsolve(xstart, dslnex,\
  \ quiet = TRUE))$time\ncat(\"solution at \", abbx$par[1], \" \", abbx$par[2], \"\
  \\n\")\n## solution at  1   1\n```\n\n但 `BB` 可以直接使用其函数 `sane()` 和 `dfsame()`。注意\
  \ `quiet` 和 `trace` 设置以避免此处不必要的输出。\n\n```\ncl <- list(trace = FALSE)\n# sane\ntasx\
  \ <- microbenchmark(asx <- sane(xstart, dslnex, quiet = TRUE,\n    control = cl))$time\n\
  cat(\"solution at \", asx$par[1], \" \", asx$par[2], \"\\n\")\n## solution at  1\
  \   1\n```\n\n```\ntadx <- microbenchmark(adx <- dfsane(xstart, dslnex, quiet =\
  \ TRUE,\n    control = cl))$time\ncat(\"solution at \", adx$par[1], \" \", adx$par[2],\
  \ \"\\n\")\n## solution at  1   1\n```\n\n另一个选项是 `nleqlsv` 包。它有一个默认方法，但有很多选项，我们尝试了两种\
  \ `method` 选择：“`Newton`”和“`Broyden`”。\n\n```\nrequire(nleqslv)\ntanlx <- microbenchmark(anlx\
  \ <- nleqslv(xstart, dslnex))$time\ncat(“solution at ”, anlx$x[1], “ ”, anlx$x[2],\
  \ \"\\n\")\n## solution at  1   1\n```\n\n```\ntanlNx <- microbenchmark(anlNx <-\
  \ nleqslv(xstart, dslnex, method = \"Newton\"))$time\ncat(\"solution at \", anlNx$x[1],\
  \ \" \", anlNx$x[2], \"\\n\")\n## solution at  1   1\n```\n\n```\ntanlBx <- microbenchmark(anlBx\
  \ <- nleqslv(xstart, dslnex, method = \"Broyden\"))$time\ncat(\"solution at \",\
  \ anlBx$x[1], \" \", anlBx$x[2], \"\\n\")\n## solution at  1   1\n```\n\n正如我们提到的，平方和为零的解显然是\
  \ NLE 的解。`minpack.lm` 和 `nlmrt` 包提供了 `nls.lm` 和 `nlfb` 函数来处理用 R 编写的残差函数指定的问题。`pracma`\
  \ 中也有 `gaussNewton()` 函数，我尚未尝试过。还有其他函数可以处理通过表达式指定的问题。在后续试验中，我们看到非线性最小二乘程序有时会找到并没有求解非线性方程的“答案”。\n\
  \n```\nrequire(minpack.lm)\ntakx <- microbenchmark(akx <- nls.lm(par = xstart, fn\
  \ = dslnex,\n```\n\n\n\n对于所有的优化解决方案，我们可以说明什么？首先，大多数方法**没有**找到非线性方程组（NLEs）的解。我们怀疑\
  \ `dfoptim` 包中 `hjkb()` 得到的解是运气。然而，`optimx` 为我们提供了 KKT 测试，这提供了一种保证，即答案至少是平方和的局部最小值。\n\
  \n同样，无论是使用解析法还是数值近似雅可比矩阵，`nls.lm` 都找到了一个**不是** NLEs 的解。然而，对该解进行简单的探测显示：\n\n```\n\
  JJ <- jacdsln(akx$par)\nsvd(JJ)$d\n## [1] 3.3853e+00 2.4743e-06\nres <- dslnex(akx$par)\n\
  res\n## [1]  0.20548 -0.37569\ng <- t(JJ) %*% res\ng\n##            [,1]\n## [1,]\
  \ 6.8001e-05\n## [2,] 1.0596e-06\nfn <- ssdsln(akx$par)\nfn\n## [1] 0.18336\nHH\
  \ <- hessian(ssdsln, akx$par)\nHH\n##            [,1]       [,2]\n## [1,] 2.2522e+01\
  \ 3.0682e-05\n## [2,] 3.0682e-05 8.2190e-01\neigen(HH)$values\n## [1] 22.5220  0.8219\n\
  ```\n\n因此，报告的答案处的平方和梯度几乎为零，且海森矩阵是正定的。我们找到了平方和函数的一个局部最小值，但它并不是 NLEs 的解。同样，目前我们不会去寻找\
  \ `nls.lm` 收敛到返回的特定点的原因。\n\n哪种方法最高效？我们使用了 `microbenchmark`，因此我们拥有特定机器上的耗时（在第 18\
  \ 章中，我们将看到如何针对该机器校准此类耗时）。注意，上面 `optimx` 的输出包含每个方法的单一耗时，而 `microbenchmark` 提供了一组此类耗时。由于优化结果通常是不可接受的，我们不再进一步处理它们。\n\
  \n我们还有关于残差评估次数（`fevals`）、雅可比评估次数（`jevals`）或“迭代”的数据。遗憾的是，最后一个元素在方法之间是不可比的。我们还可能获得某些方法的返回代码，这可能提供关于返回解有效性的信息。注意上面\
  \ `optimx` 的输出包含了类似的信息。\n\n首先，让我们看看返回的参数和残差。这重申了我们已经知道的，即除 `nls.lm` 和 `optimx` 外，所有方法都返回\
  \ `c(1, 1)` 处的解。\n\n```\n##                par1     par2      res1       res2\n\
  ## BBsolve      1.0000 1.00e+00 0.0000001 -0.0000001\n## sane         1.0000 1.00e+00\
  \ 0.0000000  0.0000000\n## dfsane       1.0000 1.00e+00 0.0000000  0.0000000\n##\
  \ nleqslv      1.0000 1.00e+00 0.0000000  0.0000000\n## nleqslvN     1.0000 1.00e+00\
  \ 0.0000000  0.0000000\n## nleqslvB     1.0000 1.00e+00 0.0000000  0.0000000\n##\
