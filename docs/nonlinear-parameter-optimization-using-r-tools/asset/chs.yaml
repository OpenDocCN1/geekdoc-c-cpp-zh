  \ lanc.res, trace = FALSE, data = Lanczos1))\ntnlfb2\n## nlmrt class object: x\n\
  ## residual sumsquares =  4.2906e-06  on  24 observations\n##     after  42    Jacobian\
  \ and  57 function evaluations\n##   name       coeff       SE      tstat     pval\
  \      gradient    JSingval\n## a1          1.87271         NA        NA       \
