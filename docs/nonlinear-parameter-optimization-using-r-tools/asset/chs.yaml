  \      NA  -2.199e-09   1.887e-16\ntnlfb1j <- try(nlfb(bb1, lanc.res, trace = FALSE,\
  \ data = Lanczos1))\ntnlfb1j\n## nlmrt class object: x\n## residual sumsquares =\
  \  5.3038e-09  on  24 observations\n##     after  9    Jacobian and  10 function\
  \ evaluations\n##   name      coeff       SE      tstat      pval      gradient\
