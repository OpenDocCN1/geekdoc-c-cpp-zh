  \ 13.1 顺序应用惩罚函数\n\n惩罚函数（Penalty functions）是另一种实施约束的方法，尽管它是近似的在这种情况下，我们从原始目标函数构造，然后加上约束违反的加权倍数。如果约束是等式，我们对其平方。为了自动化这一过程，我们从\
  \ `pen=10` 开始（它是我们目标函数的默认值为 100），并逐递增加它，直到残差和发生变化。当然，这并不是一个保证性的程序。\n\n```r\nhassan.f\
  \ <- function(x, pen = 100, dta) {\n    mod <- x[1] + x[2] * dta$two + x[3] * dta$three\
  \ + x[4] * dta$four + x[5] * dta$five + x[6] * dta$six\n    res <- mod - dta$one\n\
  \    pfn <- x[3] * x[6] - x[4] * dta$5\n    fun <- sum(res * res) + pen * pfn  #\
  \ 返回(fun)\n}\nxx <- coef(uncmod)\nbestRSS <- 1e+30\nrss <- 1e+29  # 设置一个与 bestRSS\
  \ 不同的\npen <- 10\nwhile (rss != bestRSS) {\n    bestRSS <- rss\n    pen = 10 * pen\n\
  \    anmp <- optim(par = xx, fn = hassan.f, dta = hn, pen = pen)\n    xx <- anmp$par\
  \  # 下一次迭代\n    rss <- ssall(xx, dta = hn)\n    cat(\"RSS = \", rss, \"  for pen=\"\
  , pen, \"\\n\")\n    cat(\"    Constraint =\", convi(xx, dta = hn), \"\\n\")\n}\n\
  ## RSS = 985.43   for pen=100\n##     Constraint violation = 0.13551\n## RSS = 985.54\
  \   for pen=1000\n##     Constraint violation = 0.0142\n## RSS = 985.54   for pen=10000\n\
  ##     Constraint violation = 0.00050568\n## RSS = 985.52   for pen=1e+05\n##  \
  \   Constraint violation = 0.00016767\n## RSS = 985.52   for pen=1e+06\n##     Constraint\
  \ violation = 1.3581e-05\n## RSS = 985.52   for pen=1e+07\n##     Constraint violation\
  \ = 1.6515e-06\n## RSS = 985.52   for pen=1e+08\n##     Constraint violation = 4.3183e-07\n\
  ## RSS = 985.52   for pen=1e+09\n##     Constraint violation = 4.1873e-08\n## RSS\
  \ = 985.52   for pen=1e+10\n##     Constraint violation = 1.7881e-08\n## RSS = 985.52\
