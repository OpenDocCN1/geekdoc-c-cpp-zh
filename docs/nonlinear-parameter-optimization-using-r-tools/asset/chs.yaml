  \ Varadhan R 2012 *alabama: 约束非线性优化*. R 包版本 2011.9-1。\n\n# 第 15 章：全局优化与随机方法\n\n\
  本章介绍了一些专为处理那些具有许多局部极值的棘手问题设计的工具——我们将再次通过讨论最小值来介绍这些思想。通常情况下（但并非绝对），R 采用随机方法来处理这类问题。也就是说，我们尝试许多起始点并找到许多局部最小值，然后选择出“最佳”的一个。\n\
  \n## 15.1 方法概览\n\n对于只想找到问题解决方案的人来说，遗憾的是，全局优化和随机优化领域的方法过于拥挤。糟糕的是，尽管我既没有时间也没有兴趣深入研究这个课题，但似乎其中有很多思想的“换汤重造”，导致许多“新方法”论文和程序实际上并不是新颖。事实上，人们可以认为，许多论文的作者与洗衣液营销人员的共同点比与数学家的还要多。\n\
  \n与这些随机方法相关的名称有时反映了其哲学动机：模拟退火、遗传算法、禁忌搜索、差分进化、粒子群优化、自组织迁移算法。有如此多的途径和方法，这一事实有力地说明了此类问题的困难性。此外，对用户的指导仅限于一般性评论：随机方法的成功取决于所提出的具体问题，会有很大差异。\n\
  \n## 15.2 用于全局和随机优化的 R 包\n\nR 在这一领域有许多包和工具。我不能声称尝试过超过一小样本——我没有时间这样做，而且每个包都有自己的设置和调用序列。然而，这里有一个简要概述。我尝试将列表将相似的包组织在一起。\n\
  \n* `optim()` 中的 `SANN()`：一种仅使用迭代次数作为终止标准的模拟退火方法。正因这个原因，我不推荐这个工具。\n\n* `GenSA`:广义模拟退火。与\
  \ `optim()` 方法 `SANN` 不同，`GenSA()` 函数包含了几个终止优化过程的控制参数（Xiang 等人，2013）。\n\n* `likelihood`\
  \ 使用模拟退火作为其优化工具。遗憾的是，在编写时，它是针对该包的目标函数特定的，但作者（Lora Murphy）已表现出对泛化优化器的兴趣。\n\n* `GrassmannOpt`:\
  \ 全局优化。\n\n* `DE`: 全局优化。\n\n* `Rgen`: 全局优化。\n\n* `ga`:遗传算法。\n\n* `mcga`:遗传算法。\n\n\
  * `smco`: 全局优化。\n\n* `soma`: 全局优化。\n\n* `rgp`: 全局优化。\n\n* `optim`: 全局优化。\n\n## 15.3\
  \ 一个示例问题\n\n为了说明这些包，我们将使用一个名为 Rastrigin 函数的知名测试函数（Mühlenbein 等人，1991；Törn 和 Zilkas，1989）。它在\
  \ `GenSA` 包的示例中定义如下。\n\n```\nRastrigin <- function(x) {\n    sum(x² - 10 * cos(2\
  \ * pi * x)) + 10 * length(x)\n}\ndimension <- 5\nlower <- rep(-5.12, dimension)\n\
  upper <- rep(5.12, dimension)\nstart1 <- rep(1, dimension)\n```\n\n由于 R 处理向量，该函数的维度与提供它的向量\
  \ `x` 中的参数数量相同。传统的函数是二维的，但 `GenSA` 中的 Gubain 等人认为 30 维问题特别困难。在这里，我们使用五维作为折中方案，既能更容易显示结果，又保持了一定的难度。注意，我们对参数定义了上下界约束，并设置了起始向量。\n\
  \n### 15.3.1 来自 `optim()` 的 `SANN` 方法\n\n基础 R 在 `optim()` 函数中提供了模拟退火方法。正如我指出的，我不喜欢该方法总是执行\
  \ `maxit` 次函数评估。\n\n```\n 对于 'SANN' 'maxit' 给出了函数评估\n          总次数：没有其他停止标准。默认\n\
  \          为 '10000'。\n```\n\n尽管如此，让我们在五维问题上尝试这种方法，使用全 1 作为起始。我们还将固定随机数生成器种子，并在每种方法中重置它，以尝试获得输出的一致性。\n\
  \n\n\n\n\n```\nmyseed <- 1234\nset.seed(myseed)\nasann1 <- optim(par = start1, fn\
  \ = Rastrigin, method = \"SANN\",\n    control = list(trace = 1))\n## sann objective\
  \ function values\n## initial       value 5.000000\n## iter     1000 value 5.000000\n\
  ## iter     2000 value 5.000000\n## iter     3000 value 5.000000\n## iter     4000\
  \ value 5.000000\n## iter     5000 value 5.000000\n## iter     6000 value 5.000000\n\
  ## iter     7000 value 5.000000\n## iter     8000 value 5.000000\n## iter     9000\
  \ value 5.000000\n## iter     9999 value 5.000000\n## final         value 5.000000\n\
  ## sann stopped after 9999 iterations\nprint(asann1)\n## $par\n## [1] 1 1 1 1 1\n\
  ##\n## $value\n## [1] 5\n##\n## $counts\n## function gradient\n##    10000     \
  \  NA\n##\n## $convergence\n## [1] 0\n##\n## $message\n## NULL\n```\n\n遗憾的是，我们不仅没有取得进展，而且收敛代码\
  \ 0 意味着我们“成功”了，尽管我们已经使用了允许的最大函数评估次数。我的观点是 SANN 应该从 `optim()` 函数中被弃。\n\n### 15.3.2\
  \ 包 `GenSA`\n\n鉴于 `GenSA` 使用 30 维的 Rastrigin 函数作为示例，我们可以预期该工具将产生更成功的结果，事实上，该包在该示例上的表现良好。请注意，我们仅为该方法提供了边界约束，没有提供初始值。\n\
  \n```\nsuppressPackageStartupMessages(require(GenSA))\nglobal.min <- 0\ntol <- 1e-13\n\
  set.seed(myseed)\nctrl <- list(threshold.stop = global.min + tol, verbose = TRUE)\n\
  aGenSA1 <- GenSA(lower = lower, upper = upper, fn = Rastrigin,\n    control = ctrl)\n\
  ## 在边界内用随机数据初始化 par\n## It: 1, obj value: 34.82336476\n## It: 7, obj value: 9.949580495\n\
  ## It: 38, obj value: 3.979836228\n## It: 63, obj value: 1.989918114\n## It: 66,\
  \ obj value: 0.9949590571\n## It: 68, obj value: 7.105427358e-15\nprint(aGenSA1[c(\"\
  value\", \"par\", \"counts\")])\n## $value\n## [1] 7.10543e-15\n##\n## $par\n##\
  \ [1]  2.08631e-12 -6.33376e-09  6.58850e-13  1.22032e-13\n## [5]  5.46241e-12\n\
  ##\n## $counts\n## [1] 1332\n```\n\n### 15.3.3 包 `DEoptim` 和 `RcppDE`\n\n差分进化算法被许多研究者认为是全局优化领域最成功的工具之一。与\
