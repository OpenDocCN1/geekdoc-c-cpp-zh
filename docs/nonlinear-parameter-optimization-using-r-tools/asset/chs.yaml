  ### 15.3.9 包 `gaoptim`\n\n在与 `gaoptim` 的维护者（Tenorio, 2013）交流之前，在使用它时遇到了一些困难，从信息交流来看，我怀疑文档将会得到澄清。似乎该包需要指定一个\
  \ `selection` 方法，以指导选择哪些试验结果来驱动算法。最简单的选择是在配对过程中用于演化所选参数集合的 `uniform`。\n\n```\nsuppressPackageStartupMessages(require(gaoptim))\n\
  set.seed(myseed)\nminRast <- function(x) {\n    -Rastrigin(x)\n}  # 用于最小化\n## 初始调用语法\
  \ - 无选择参数\n## agaor1<-GAReal(minRast, lb=lower, ub=upper)\nagaor1 <- GAReal(minRast,\
  \ lb = lower, ub = upper, selection = \"uniform\")\nagaor1$evolve(200)  # 迭代 200\
  \ 代\n## 从 400 代返回了相同的结果\nagaor1\n## 200 代的结果:\n## Mean Fitness:\n##    Min. 1st\
  \ Qu.  Median    Mean 3rd Qu.    Max.\n##  -88.80   -5.36   -3.13   -8.00   -2.43\
  \   -1.43\n```\n\n\n\n\n```R\n## branmin.R\nmyseed <- 123456L  # 用户可以使用任何种子。但是 ...\
  \ 某些种子的效果并不好。\nbranin <- function(x) {\n    ## Branin 测试函数\n    if (length(x) !=\
  \ 2)\n        stop(\"参数向量维度错误\")\n    x1 <- x[1]  # 限制在 [-5, 10]\n    x2 <- x[2]\
  \  # 限制在 [0, 15]\n    a <- 1\n    b <- 5.1/(4 * pi * pi)\n    c <- 5/pi\n    d <-\
  \ 6\n    e <- 10\n    f <- 1/(8 * pi)\n    ## 全局最小值 0.397887 别位于 (-pi, 12.275),\
  \ (pi, 2.275),\n    ## (9.42478, 2.475)\n    val <- a * (x2 - b * (x1²) + c * x1\
  \ - d)² + e * (1 - f) *\n        cos(x1) + e\n}\nbranin.g <- function(x) {\n   \
  \ ## Branin 测试函数\n    if (length(x) != 2)\n        stop(\"参数向量维度错误\")\n    x1 <-\
  \ x[1]\n    x2 <- x[2]\n    a <- 1\n    b <- 5.1/(4 * pi * pi)\n    c <- 5/pi\n\
  \    d <- 6\n    e <- 10\n    f <- 1/(8 * pi)\n    ## 全局最小值 0.397887 别位于 (-pi, 12.275),\
  \ (pi, 2.275),\n    ## (9.42478, 2.475) val <- a*(x2 - b*(x1²) + c*x1 - d)² +\n\
  \    ## e*(1 - f)*cos(x1) + e\n    g1 <- 2 * a * (x2 - b * (x1²) + c * x1 - d) *\
  \ (-2 * b *\n        x1 + c) - e * (1 - f) * sin(x1)\n    g2 <- 2 * a * (x2 - b\
  \ * (x1²) + c * x1 - d)\n    gg <- c(g1, g2)\n}\n```\n\n在接下来，我们实际上利用关于三个全局最小值的外部知识，并观察\
  \ `Rvmmin()` 从不同起始点的终止点。我们为 `images/c15-math-0001.png` 和 `images/c15-math-0002.png`\
  \ 之间的第一个参数创建一个起始点网格，第二个参数则在 0 和 15 之间。我们将在每个轴上使用 40 个点，总共 1600 组起始参数。我们可以将这些点放在一个\
  \ 40x40 的字符数组中，并对任何不是三个已知最小值之一的结果赋值为 0，并将成功找到的任一个最小值的标签 1、2 或 3 分配给起始参数相应的数组位置。\n\
  \n只有极少数的点实际上未能找到该函数的某个全局最小值，而且其中大多数位于边界上。如所示，程序代码将三个最优值标记为 1、2 或 3，并对任何其他解决方案标记\
  \ 0。\n\n为了找出生成了哪个解决方案（如果有的话），让我们计算解决方案与三个已知最小值之一之间的欧几里距离，这些最小值被标记为 `y1`、`y2` 和 `y3`。如果距离到相关最小值小于\
  \ `1e!images/c15-math-0003.png`，我们就分配相应的代码，否则留为 0。\n\n```R\ndist2 <- function(va,\
  \ vb) {\n    n1 <- length(va)\n    n2 <- length(vb)\n    if (n1 != n2)\n       \
  \ stop(\"向量不匹配\")\n    dd <- 0\n    for (i in 1:n1) {\n        dd <- dd + (va[i]\
  \ - vb[i])²\n    }\n    dd\n}\ny1 <- c(-pi, 12.275)\ny2 <- c(pi, 2.275)\ny3 <- c(9.42478,\
  \ 2.475)\nlo <- c(-5, 0)\nup <- c(10, 15)\nnpt <- 40\ngrid1 <- ((1:npt) - 1) * (up[1]\
  \ - lo[1])/(npt - 1) + lo[1]\ngrid2 <- ((1:npt) - 1) * (up[2] - lo[2])/(npt - 1)\
  \ + lo[2]\npnts <- expand.grid(grid1, grid2)\nnames(pnts) = c(\"x1\", \"x2\")\n\
  nrun <- dim(pnts)[1]\n```\n\n我们不会显示完成所有繁琐工作代码。以下起始点未收敛：\n```\n(-3.84615, 0)(6.15385,\
  \ 0)(6.53846, 0)\n```\n\n\n\n\n\n# 第 16 章\n\n缩放与重参数化\n\n**缩放**（用优化参数的标量倍数替换原始参数）和**重参数化**（用优化参数的可逆函数替换参数本身）都是一些工具，它们有时可以帮助我们获得解决方案，或者减少获取解决方案所需的计算工作量。当然，缩放仅仅是重参数化的一种简单形式。\n\
  \n在本章中，我们将探讨这一主题。遗憾的是，虽然缩放和重参数化经常被推荐且在数学上非常简单，但它们的使用也并非易事，因为需要谨慎应用；而且像许多其他主题一样，其结果可能既帮助也会阻碍获得良好结果的过程。\n\
  \n## 16.1 为什么要进行缩放或重参数化？\n\n函数 `c16-math-0001` 非线性的本质在于，`c16-math-0002` (c16-math-0002)\
  \ 的值无法用参数幂为 `1` 的形式来表示。当我们想要理解 `c16-math-0003` 的函数曲面时，这可能非常重要。在某些区域，对参数 `x` 进行标准变化（无论是绝对变化还是百分变化）会导致\
  \ `c16-math-0004` 值发生微小，而在另一些区域，这种变化会非常巨大。\n\n从优化的角度来看，将优化问题类比为寻找碗底是有帮助的。当我们能够可视化整个对象时，这是很容易的，特别是当\
  \ `c16-math-0005` 维度为 2，且这些对象的尺寸宽度和高度处于同一数量级时。\n\n## 参考文献\n\n```r\nfor (ii in 1:npt)\
  \ {\n    vrow <- paste(cmat[ii, ], sep = \" \", collapse = \" \")\n    cat(vrow,\
  \ \"\\n\")\n}\n```\n1. Adni, K. (2012). `deopt`. *Journal of Statistical Software*,\
  \ 50(5), 1–18.\n2. Bergmeir, J. (2011). `gaopt`. R package version 0.1.\n3. Cline,\
  \ C. (2012). `sopt`. R package version 0.1.\n4. Murphy, L. (2013). `gaopt`. R package\
  \ version 1.1.\n5. Törn, A. and Zilinskas, A. (1989). *Global Optimization*. Lecture\
  \ Notes in Computer Science. New York: Springer-Verlag.\n6. Xiang, Y. (2013). `gensa`.\
  \ *The R Journal*, 5(1), 13–29.\n\n\n\n\n因此，我们进行 `scaling`（缩放）的第一个理由是我们希望参数 `x`\
  \ 的大小大致相同，或者用该活动领域人员熟悉的单位来表示。我发现一个非常有用的经验法是：对于所有的 ![c16-math-0006](img/c16-math-0006.png)，其\
  \ ![c16-math-0007](img/c16-math-0007.png) 的比例为 1 : ![c16-math-0008](img/c16-math-0008.png)，其中\
  \ ![c16-math-0009](img/c16-math-0009.png) 是参数的数量，应该在 1 到 10 之间。函数最小化方法试图改变 ![c16-math-0010](img/c16-math-0010.png)\
  \ 的参数，使得改变后的参数 ![c16-math-0011](img/c16-math-0011.png) 的函数值小于当前集合 ![c16-math-0012](img/c16-math-0012.png)\
  \ 的函数值。当参数及其变化的大小和尺度相似时，人类发现更容易设想参数的变化。将参数的大小想象成类似于炉灶控制器的旋钮可能会有帮助，范围从 1 到 10。如果一个炉头在\
  \ 5.01 到 5.03 之间从冷热变为通红，而另一个炉头在相同的热范围内范围是 1.0–9.9，那么操作起来就会非常别扭。\n\n糟糕的是，在某些区域寻找最优值是没有意义的。如果函数\
  \ ![c16-math-0013](img/c16-math-0013.png) 在一个或多个 ![c16-math-0014](img/c16-math-0014.png)\
  \ 发生微变化时迅速波动，那么假设我们正在“寻找碗底”的优化工具将难以工作。函数不连续甚至导数不连续的区域也可能存在问题。为了讨论，我们将搁置这些担忧，除非它们说明了缩放问题。\n\
  \n第二个理由主要是管理数据和结果时的人为因素问题。在记录或输入数据时，不需要携带过多的数字或不需要输入指数是有用的，特别是对于那些“接近”最优值的参数值。例如，在下文中讨论的霍布斯杂草（Hobbs\
  \ weed）虫害问题中，缩放后的解“接近”参数值 2、5 和 3，这些值很容易被记忆和输入。此外，显示大量的数字（其中大多数数字在当前问题的语境下可能没有意义）可能会导致用户认为估算程序的结果是“准确”的。随着需要读取或复制的信息量的增加，人为失误的可能性也会随之增加。\n\
  \n这类论点显然不足以强制要求缩放。事实上，并不是所有方法都需要用户对函数进行缩放。然而，缩放是有帮助的，正如我们将通过以下示例尝试展示的那样。\n\n一个特殊问题涉及在最优处为零的参数。对于某些问题，此类零参数可能并不真正“存在”。也就是说，在我们尝试估计的模型中，可能不需要该参数，可以从函数中删除。如果该参数确实是我们目标函数的一部分，那么随着方法逐渐减小参数的大小以优化目标函数，我们可能会看到该参数相对于其他参数的尺度发生快速变化。\n\
  \n也可以对目标函数进行缩放。我建议仅这样做是为了使数字在问题背景或应用领域中具有合理意义。遗憾的是，`optim()` 函数有一个允许应用函数缩放的功能，但它的用法示例是改变函数的符号，以便让\
  \ `optim()` 中的 `minimizers` 能够 `maximize`（最大化）一个函数。我强烈倾向于避免将这种符号改变称为“缩放”，特别是最大化似乎是该功能主要的、也许唯一的用途。\n\
  \n## 16.2 缩放与重参数化的形式化\n\n缩放是 `reparameterization`（重参数化）整体问题的一部分。例如，如果存在一组可逆的函数集\
  \ `z()`（我们使用粗体表示这里正在使用一个函数向量，每个参数对应一个），我们可以写成：\n\n**16.1** ![equation](img/c16-math-0015.png)\n\
  \n简单情况使用矩阵变换，为了方便，我们使用一个称为 ![c16-math-0016](img/c16-math-0016.png) 的矩阵。因此\n\n**16.2**\
  \ ![equation](img/c16-math-0017.png) **16.3** ![equation](img/c16-math-0018.png)\n\
  \n虽然 ![c16-math-0019](img/c16-math-0019.png) 可以是任何奇异矩阵，但一个对角线上没有元素的简单对角矩阵提供了我们所谓的“缩放”，因为我们随后将\
  \ ![c16-math-0020](img/c16-math-0020.png) 的每个元素乘以对应的 ![c16-math-0021](img/c16-math-0021.png)。\n\
  \n### 16.3 Hobbs' 杂草案例\n\n该问题由农业部的 Dave 先生提供（图 16.1），他建议适当的模型是一个三参数逻辑回归，即\n\n**16.6**\
  \ ![equation](img/c16-math-0030.png)\n\n其中 ![c16-math-0031](img/c16-math-0031.png)\
  \ 是生长期。\n\n![c16f001](img/c16f001.jpg)\n\n现在我们用 R 表示平方和函数。首先我们将使用未缩放的损失函数和残差。然后我们将通过\
  \ 10 的幂进行缩放。注意数据嵌入在函数内部。\n\n```r\nhobbs.f<- function(x){ # Hobbs 杂草问题 - 函数\n   \
  \ if (abs(12*x[3])>50) { # 检查计算性\n       fbad<-.Machine$double.xmax\n       return(fbad)\n\
  \    }\n    res<-hobbs.res(x)\n    f<-sum(res*res)\n}\nhobbs.res<-function(x){ #\
  \ Hobbs 杂草问题 - 残差\n# 此变体使用了循环\n    if(length(x) != 3) stop(\"hobbs.res -- 参数长度不是\
  \ 3\")\n    y<-c(5.308, 7.24, 9.638, 12.866, 17.069, 23.192, 31.443,\n         38.558,\
  \ 50.156, 62.948, 75.995, 91.972)\n    t<-1:12\n    if(abs(12*x[3])>50) {\n    \
  \   res<-rep(Inf,12)\n    } else {\n       res<-x[1]/(1+x[2]*exp(-x[3]*t)) - y\n\
  \    }\n}\n```\n\n让我们尝试在 `optim()` 中使用标准的 Nelder–Mead 方法运行此问题，从向量为 c(100, 10, 0.1)\
  \ 的开始。这个未缩放的起点在下面的缩放版本中对应 c(1, 1, 1)。\n\n\n\n\n\n```r\ncat(\"Running the Hobbs problem\
  \ - code already loaded - with Nelder-Mead\\n\")\n```\n\n## 运行 Hobbs 问题 - 代码已加载\
  \ - 使用 Nelder-Mead\n\n```r\nstart <- c(100, 10, 0.1)\nf0 <- hobbs.f(start)\ncat(\"\
  initial function value=\", f0, \"\\n\")\n## initial function value= 10685.3\ntu\
  \ <- system.time(ansnm1 <- optim(start, hobbs.f, control = list(maxit = 5000)))[1]\n\
  # opt2vec 是一个小型程序，用于将答案转换为向量形式以便于打印\nUnscaled1 <- opt2vec(\"unscaled Nelder\", ansnm1)\n\
  ## unscaled Nelder : f( 195.863 ,  49.0609 ,  0.313756 )= 2.58754\n##     after\
  \  247  fn &  NA  gr evals\n```\n\n以下是对原始问题非常简单的缩放。以下是函数和残差的代码。\n\n```r\nshobbs.f<-function(x){\
  \ # 缩放后的 Hobbs 杂草问题 -- 函数\n    if (abs(12*x[3]*0.1)> 50) { # 检查计算性\n       fbad<-.Machine$double.xmax\n\
  \       return(fbad)\n    }\n    res<-shobbs.res(x)\n    f<-sum(res*res)\n}\nshobbs.res<-function(x){\
  \ # 缩放后的 Hobbs 杂草问题 -- 残差\n# 此变体使用循环\n    if(length(x) != 3) stop(\"hobbs.res --\
  \ parameter vector n!=3\")\n    y<-c(5.308, 7.24, 9.638, 12.866, 17.069, 23.192,\
  \ 31.443, 38.558, 50.156,\n          62.948, 75.995, 91.972)\n    t<-1:12\n    res<-100.0*x[1]/(1+x[2]*10.*exp(-0.1*x[3]*t))\
  \ - y\n}\n```\n\n让我们也尝试在 `optim` 中通过标准的 Nelder–Mead 方法运行缩放后的问题，起始点设为向量 `c(1, 1,\
  \ 1)`。\n\n```r\ncat(\"Running the scaled Hobbs problem - code already loaded - with\
  \ Nelder-Mead\\n\")\n## 运行缩放后的 Hobbs 问题 - 代码已加载 - 使用 Nelder-Mead\nstart <- c(1,\
  \ 1, 1)\nf0 <- shobbs.f(start)\ncat(\"initial function value=\", f0, \"\\n\")\n\
  ## initial function value= 10685.3\nts <- system.time(ansnms1 <- optim(start, shobbs.f,\
  \ control = list(maxit = 5000)))[1]\nopt2vec(\"scaled Nelder\", ansnms1)\n## scaled\
  \ Nelder : f( 1.9645 ,  4.9116 ,  3.13398 )= 2.58765\n##     after  196  fn &  NA\
  \  gr evals\n```\n\n示例提示，缩放版本对于 Nelder–Mead 方法来说求解工作量略少，但这种优势并不大。我们可以假设：\n\n*  \
  \ 缩放后的问题可能从“随机”或简单的起始点找到解决方案的难度更小。\n*   从等效起始点来看，缩放后的函数可能允许更高效地找到解决方案，即具有更少的函数评估次数。\n\
  \n让我们对同样的两个任务应用不同的优化器（`BFGS`）。\n\n```r\ncat(\"Running the Hobbs problem - code already\
  \ loaded - with BFGS\\n\")\n## 运行 Hobbs 问题 - 代码已加载 - 使用 BFGS\nstart <- c(100, 10,\
  \ 0.1)\nstarts <- c(1, 1, 1)\nf0 <- hobbs.f(start)\nf0s <- shobbs.f(starts)\ncat(\"\
  initial function values: unscaled=\", f0, \"  scaled=\", f0s, \"\\n\")\n## initial\
  \ function values: unscaled= 10685.3   scaled= 10685.3\ntu <- system.time(abfgs1\
  \ <- optim(start, hobbs.f, method = \"BFGS\", control = list(maxit = 5000)))[1]\n\
  opt2vec(\"BFGS unscaled\", abfgs1)\n## BFGS unscaled : f( 196.194 ,  49.0884 , \
  \ 0.313556 )= 2.58728\n##     after  209  fn &  59  gr evals\nts <- system.time(abfgs1s\
  \ <- optim(starts, shobbs.f, method = \"BFGS\", control = list(maxit = 5000)))[1]\n\
  opt2vec(\"BFGS scaled\", abfgs1s)\n## BFGS scaled : f( 1.9619 ,  4.90919 ,  3.13568\
  \ )= 2.58728\n##     after  118  fn &  36  gr evals\n```\n\n我们看到缩放减少了函数/梯度计数并获得了略低的函数值。当然，在\
  \ `BFGS` 方法中真的应该使用解析梯度而非数值梯度。让我们再次放入它们运行。\n\n```r\nhobbs.jac <- function(x) {\n\
  \    # Hobbs 问题的雅可比矩阵\n    jj <- matrix(0, 12, 3)\n    t <- 1:12\n    yy <- exp(-x[3]\
  \ * t)\n    zz <- 1/(1 + x[2] * yy)\n    jj[t, 1] <- zz\n    jj[t, 2] <- -x[1] *\
  \ zz * yy\n    jj[t, 3] <- x[1] * zz * t\n    return(jj)\n}\nshobbs.g <- function(x)\
  \ {\n    # Hobbs 梯度——再次调用是不高效的\n    jj <- shobbs.jac(x)\n    res <- shobbs.res(x)\n\
  \    gg <- as.vector(2 %*% jj)\n    return(gg)\n}\nshobbs.jac <- function(x) {\n\
  \    # 缩放后的 Hobbs 杂草问题 -- 雅可比\n    jj <- matrix(0, 12, 3)\n    t <- 1:12\n    yy\
  \ <- exp(-0.1 * x[3] * t)\n    zz <- 100/(1 + x[2] * yy)\n    jj[t, 1] <- zz\n \
  \   jj[t, 2] <- -x[1] * zz * yy\n    jj[t, 3] <- x[1] * zz * t\n    return(jj)\n\
  }\nshobbs.g <- function(x) {\n    # 缩放后的 Hobbs 杂草问题 -- 梯度\n    shj <- shobbs.jac(x)\n\
  \    shres <- shobbs.res(x)\n    shg <- as.vector(2 %*% shj)\n    return(shg)\n\
  }\n```\n\n```r\ncat(\"Running the Hobbs problem - code already loaded - with BFGS\\\
  n\")\n## 运行 Hobbs 问题 - 代码已加载 - 使用 BFGS\nstart <- c(100, 10, 0.1)\nstarts <- c(1,\
  \ 1, 1)\nf0 <- hobbs.f(start)\nf0s <- shobbs.f(starts)\ncat(\"initial function values:\
  \ unscaled=\", f0, \"  scaled=\", f0s, \"\\n\")\n## initial function values: unscaled=\
  \ 10685.3   scaled= 10685.3\ntu <- system.time(abfgs1g <- optim(start, hobbs.f,\
  \ gr = hobbs.g, method = \"BFGS\", control = list(maxit = 5000)))[1]\nopt2vec(\"\
  BFGS unscaled\", abfgs1g)\n## BFGS unscaled : f( 196.175 ,  49.0885 ,  0.313573\
  \ )= 2.58728\n##     after  127  fn &  50  gr evals\nts <- system.time(abfgs1sg\
  \ <- optim(starts, shobbs.f, gr = shobbs.g, method = \"BFGS\", control = list(maxit\
  \ = 5000)))[1]\nopt2vec(\"BFGS scaled\", abfgs1sg)\n## BFGS scaled : f( 1.96186\
  \ ,  4.90916 ,  3.1357 )= 2.58728\n##     after  119  fn &  36  gr evals\n```\n\n\
  我们看到，通过对缩放函数使用解析梯度在函数/梯度计数方面没有太大收益，但在未缩放问题上我们得到了更好的结果，包括函数/梯度计数和更低的函数值。这可能是由于在计算梯度的正向差分近似（第\
  \ 10.5 节）中使用了或或固定的 `eps` 值。虽然文档告诉我们实际上可以更改每个维度的偏移，但我认为我从未在 R 中做过这一点，也不期望用户能轻松做到。\n\
  \n```\n'ndeps' 用于梯度差分近似的步长向量，\n          基于 'par/parscale' 尺度。\n          默认值为 '1e-3'\n\
  ```\n\n让我们尝试使用 `optim` 提供的 `parscale`。注意，许多优化工具并不包含此功能。对于 `BFGS` 方法，我们将包含 trace\
  \ 以检查初始函数值是否符合预期。在 `parscale` 中获取错误的缩放值很容易。\n\n```r\ncat(\"Try using parscale\\\
  n\")\n##尝试使用 parscale\nstart <- c(100, 10, 0.1)\nanmps1 <- optim(start, hobbs.f,\
  \ control = list(trace = FALSE, parscale = c(100,  10, 0.1)))\nopt2vec(\"Nelder\
  \ + parscale\", anmps1)\n## Nelder + parscale : f( 196.45 ,  49.116 ,  3.13398 )=\
  \ 2.58765\n##     after  196  fn &  NA  gr evals\nabfps1 <- optim(start, hobbs.f,\
  \ gr = hobbs.g, method = \"BFGS\", control = list(trace = TRUE, parscale = c(100,\
  \ 10, 0.1)))\n## initial  value 10685.287754\n## iter  10 value 1023.938721\n##\
  \ iter  20 value 45.644964\n## iter  30 value 2.629944\n## final  value 2.587277\n\
  ## converged\nopt2vec(\"BFGS + parscale\", abfps1)\n## BFGS + parscale : f( 196.186\
  \ ,  49.0916 ,  3.1357 )= 2.58728\n##     after  119  fn &  36  gr evals\n```\n\n\
  \n\n\n对于一个无约束目标函数 ![c16-math-0032](img/c16-math-0032.png)，`y` 处取得（局部）最小值的 KKT（Karush–Kuhn–Tucker）条件（Karush,\
  \ 1939; Kuhn and Tucker, 1951）是：![c16-math-0033](img/c16-math-0033.png) 在 `y` 处的梯度为零，且\
  \ ![c16-math-0034](img/c16-math-0034.png) 在 `y` 处的 Hessian 矩阵的特征值均为正。梯度是 ![c16-math-0035](img/c16-math-0035.png)\
  \ 对参数的一阶导数向量（在 ![c16-math-0036](img/c16-math-0036.png) 处评估）。Hessian 矩阵是二阶导数矩阵。\n\
  \n当然，“零”和“正”是假设精确算术的概念。现实情况是我们希望梯度是“小的”。对于 Hessian 矩阵，我们的首要条件是所有特征值均为正。这相对容易检查。然而，如果最小特征值与最大特征值的比值小于，例如\
  \ 1e![c16-math-0037](img/c16-math-0037.png)，我们可能怀疑 Hessian 矩阵非常接近奇异。这意味着我们无法确定自己是否处于局部最小值处。换另一种解释，这表明确定最小值很困难，因为参数空间的一个区域可能是“平坦”的。\n\
  \n让我们使用解析梯度对缩放后的 Hobbs 函数（scaled Hobbs function）的 BFGS 结果运行这些检查。函数 `kktc()` 输出（在我们处使用的实验版本中），因此我们将避免重复输出，不打印结果\
  \ `kbfgs1sg`。\n\n```\n## Loading required package: numDeriv\n## results from KKT\
  \ check of abfgs1sg solution (scaled, with gradient from BFGS)\n## KKT test tolerances:\
  \ for g =  0.0012207    for H =  0.012207\n## Parameters: [1] 1.96186 4.90916 3.13570\n\
  ## Successful convergence!\n## Compute gradient approximation at finish\n## Gradient:[1]\
  \  0.001991813 -0.000485584  0.002579320\n## kkt1 =  TRUE\n## Compute Hessian approximation\n\
  ##          [,1]      [,2]     [,3]\n## [1,] 12654.61 -3256.125 16021.06\n## [2,]\
  \ -3256.13   862.709 -4095.21\n## [3,] 16021.06 -4095.206 20434.34\n## Eigenvalues\
  \ found\n## [1] 33860.5130    76.3199    14.8306\n## negeig =  FALSE\n## evratio\
  \ = 0.00043799\n## kkt2 =  FALSE\n```\n\n结果显然“不太好”。然而，如果我们对未缩放的 Hobbs 函数 `abfps1`\
  \ 的最新 `parscale` 版本以及带有梯度的未缩放函数 `abfgs1g` 尝试相同的练习，我们将得到以下输出。\n\n```\n## results\
  \ from KKT check of abfps1 solution (parscaled, with gradient from BFGS)\n## KKT\
  \ test tolerances: for g =  0.0012207    for H =  0.012207\n## Parameters: [1] 196.18627\
  \  49.09165   0.31357\n## Successful convergence!\n## Compute gradient approximation\
  \ at finish\n## Gradient:[1]  1.99186e-05 -4.85596e-05  2.57938e-02\n## kkt1 = \
  \ FALSE\n## Compute Hessian approximation\n##            [,1]        [,2]      \
  \ [,3]\n## [1,]    1.26546    -3.25613    1602.11\n## [2,]   -3.25613     8.62709\
  \   -4095.21\n## [3,] 1602.10555 -4095.20623 2043434.30\n## Eigenvalues found\n\
  ## [1] 2.04344e+06 4.24926e-01 4.41380e-03\n## negeig =  FALSE\n## evratio = 2.15998e-09\n\
  ## kkt2 =  FALSE\n```\n\n```\n## results from KKT check of abfgs1g solution (unscaled,\
  \ with gradient from BFGS)\n## KKT test tolerances: for g =  0.0012207    for H\
  \ =  0.012207\n## Parameters: [1] 196.18627  49.09165   0.31357\n## Successful convergence!\n\
  ## Compute gradient approximation at finish\n## Gradient:[1]  3.03187e-05 -7.66194e-04\
  \  1.1432e-04\n## kkt1 =  TRUE\n## Compute Hessian approximation\n##           \
  \ [,1]        [,2]       [,3]\n## [1,] 12654.61 -3256.125 1602.06\n## [2,] -3256.13\
  \   862.709 -4095.21\n## [3,] 16021.06 -4095.206 20434.34\n## Eigenvalues found\n\
  ## [1] 2.04333e+06 4.24989e-01 4.41682e-03\n## negeig =  FALSE\n## evratio = 2.1616e-09\n\
  ## kkt2 =  FALSE\n未缩放函数的梯度（即梯度）更好，但 Hessian 矩阵非常接近奇异。后者会导致牛顿法出现困难。**问题：** 梯度总是更差吗？**答案：**\
  \ 不一定。以下是一个非常简单的函数，随着 `skew` 的增大而变得“糟糕”。解位于 (0, 2)。\n\n```\ndiagfn(par, skew = 1)\
  \ {\n    x <- par[1]\n    y <- par[2]\n    a <- x - 2\n    b <- 4\n    fval <- a\
  \ + skew * a\n}\ndiaggr(par, skew = 1) {\n    x <- par[1]\n    y <- par[2]\n   \
  \ a <- x - 2\n    b <- 4\n    g1 <- (2 * a + 8) * skew\n    g2 <- 2 * a - 8\n  \
  \  gr <- c(g1, g2)\n    return(gr)\n}\n```\n\n```\n## Diagonal function\n## Nelder-Mead\
  \ results\n      skew        fmin         par1 par2 nf ng ccode\n## an1     1 1.77099e-27\
  \ -2.21587e-14    2 10  3     0\n## abf1g      1 2.83990e-29 -2.84217e-16    2 \
  \ 7  3     0\n## abf10     10 1.01635e-19  9.89887e-12    2 26 11     0\n## abf10g\
  \    10 1.01635e-19  9.89886e-12    2 26 11     0\n## abf100   100 3.14335e-25 -1.22168e-15\
  \    2 39 10     0\n## abf100g  100 3.14640e-25 -1.21920e-15    2 39 10     0\n\
  ```\n\n```\n## gradient abf1:\n## [1] -1.04805e-13 -6.21725e-14\n## gradient abf1g:\n\
  ## [1] -7.10543e-15  7.10543e-15\n## gradient abf10:\n## [1] -9.68713e-10  1.72011e-09\n\
  ## gradient abf10g:\n## [1] -9.68713e-10  1.72011e-09\n## gradient an1:\n## [1]\
  \ 2.28659e-08 -2.58505e-07\n## gradient an10:\n## [1] -1.44379e-06  2.57408e-06\n\
  ## gradient an100:\n## [1] -3.4527e-06  5.7009e-06\n```\n\n```\n##  BFGS results\n\
  ##         skew        fmin         par1 par2 nf ng ccode\n## abf1       1 1.77099e-27\
  \ -2.21587e-14    2 10  3     0\n## abf1g      1 2.83990e-29 -2.84217e-16    2 \
  \ 7  3     0\n## abf10     10 1.01635e-19  9.89887e-12    2 26 11     0\n## abf10g\
  \    10 1.01635e-19  9.89886e-12    2 26 11     0\n## abf100   100 3.14335e-25 -1.22168e-15\
  \    2 39 10     0\n## abf100g  100 3.14640e-25 -1.21920e-15    2 39 10     0\n\
  ```\n\n如果我们为不同的 `skew` 水平绘制函数图，就能看出问题所在。这里我们只显示 `skew=10` 的情况（图 16.2）。增加 `skew`\
  \ 参数会导致函数表面看起来不像一个碗，而更像一个槽。这反映在两个维度上不同的曲率，也可以通过 Hessian 矩阵的特征值表现出来。然而，梯度大小在两个 `skew`\
  \ 值下更大，但似乎并没有遵循特定的模式，我们看到的可能是舍入误差。\n\n## 16.5 杂草问题的重新参数化\n\n上述三参数逻辑模型可以采用某种不同的形式，即\n\
  \n**16.7** ![equation](img/c16-math-0038.png)\n\n\n\n其中 ![c16-math-0039](img/c16-math-0039.png)\
  \ 通常被重命名为 `Asym`。显然，我们可以很容易地将一种形式转换为另一种，或者转换为缩放版本 `shobbs()`。形式 (16.7) 用于 Doug Bates\
  \ 开发的 R 语言 `SSlogis` 自启动非线性模型。这种形式允许对参数与模型 S 型形状的关系进行很有意义的几何解释。第一个参数 ![c16-math-0040](img/c16-math-0040.png)\
  \ 或 `Asym` 是曲线的上渐近线；`xmid` 是曲线位于上下渐近线中间点的 ![c16-math-0041](img/c16-math-0041.png)-轴位置；`scal`\
  \ 控制曲线上升的速率。`scal` 值越小，曲线上升得越陡峭。这种解释有助于选择前两个参数，并指导第三个参数的选择。然而，这是否会提高我们优化器的成功概率？我们将在下一节之后讨论这个问题。\n\
  \n## 16.6 参数空间跨越尺度变化\n\n非线性优化在一个“爱丽丝梦游境”的环境中进行，空间不同部分的尺度不同。为了更清楚地看到这一点，我们可以在优化开始和结束时将不同\
  \ Hobbs 参数改变 1%。为了方便起见，我们使用缩放后的 Hobbs 函数作为基础模型，并使用起始参数向量 `c(1,1,1)`。我们将此起始值转换为未缩放的\
  \ Hobbs 模型和 Hobbs–Bates 模型。此外，我们仅优化缩放后的 Hobbs 函数，然后在预期的最优值处转换另外两个模型的参数。不过，我们确实重新评估了未缩放的\
  \ Bates 函数，以确保我们获得了相同的解。\n\n```\n##                   fn value 1% p1 effect 1% p2\
  \ effect 1% p3 effect\n## shobbs - start 10685.28775    -0.941062     0.729787 \
  \   -0.771187\n## uhobbs - start 10685.28775    -0.941062     0.729787    -0.771187\n\
  ## hbates - start 10685.28775    -0.941062     1.689136    -0.906786\n## shobbs\
  \ - final     2.58765    92.435940    40.769094   387.872740\n## uhobbs - final\
  \     2.58765    92.435940    40.769094   387.872740\n## hbates - final     2.58765\
  \    92.435940    40.769094   47.9160\n```\n\n表格显示，在起始参数附近将其中一个参数改变 1% 对平方和值的影响是有限的。事实上，函数值的变化最多也只有适度的\
  \ 7%。相比之下，在最小值处，改变渐近线 ![c16-math-0042](img/c16-math-0042.png)、![c16-math-0043](img/c16-math-0043.png)\
  \ 或 `Asym` 对平方和的影响超过了 2%。对于其他参数的类似百分比变化，`hobbs.f()` 和 `shobbs.f()` 的变化相同，但对于 1%\
  \ 的参数变化，函数分别变化了约 1% 和 8%。Bates 重新参数化则不同，平方和对 `xmid` 参数非常敏感——`scal` 的 1% 变化会导致 8%\
  \ 的变化。\n\n## 16.7 方法对起始点的稳健性\n\n我们现在可以检查缩放或重新参数化是否允许我们轻松地找到解。对优化和非线性建模初学者的一个常见告诫是选择不同的且理想情况下更好的起始点。然而，这并不总是有用。如果我们知道答案，就不需要优化了！对于这个练习，我们最初为三个缩放参数中的每一个参数在\
  \ 0 到 5 的边界框内生成了 1000 个随机点。然后我们生成了未缩放的 Bates 起始点。\n\n```\n# generate 1000 sets of\
  \ points in [0, 5) with runif()\nset.seed(12345)\nnrun <- 1000\nsstart <- matrix(runif(3\
  \ * nrun, 0, 5), nrow = nrun, ncol = 3)\nustart <- sstart %*% diag(c(100,10,0.1))\n\
  bstart <- matrix(NA, nrow = nrun, ncol = 3)\nfor (i in 1:nrun) {\n    b1 <- ustart[i,\
  \ 1]\n    b2 <- ustart[i, 2]\n    b3 <- ustart[i, 3]\n    Asym <- b1\n    scal <-\
  \ 1/b3\n    xmid <- log(b2)/b3\n    bstart[i, 1] <- Asym\n    bstart[i, 2] <- xmid\n\
  \    bstart[i, 3] <- scal\n}\n```\n\n由于起始点是等价的，我们可以比较三个模型（即未缩放、缩放和 Bates）的性能。这个练习显示的\
  \ Bates 模型结果比我想象的差，在检查时，我发现某些起始集对于 Bates 模型是不可取的——在函数或梯度计算中返回了无限或 NaN 结果。然后我尝试从\
  \ Bates 模型开始并像下面的代码一样生成点。注意，我们现在限制 `Asym` 参数大于 9。这并不是绝对要求，因为数据可能更高或更低，但它避免了一些不可取的起始点。此外，`xmid`\
  \ 参数被限制在 2 到 11 之间，`scal` 大于 0.05。\n\n```\n# random Bates start 1000 sets of points\
  \ in [0, 5) with runif()\nset.seed(12345)\nnrun <- 1000\nbstart <- matrix(runif(3\
  \ * nrun, 0, 5), nrow = nrun, ncol = 3)\nminasymp <- 92\nbstart[, 1] <- bstart[,\
  \ 1] * (500 - minasymp) + minasymp\nbstart[, 2] <- bstart[, 2] * 9 + 2  # inside\
  \ t interval\nscal0 <- 0.05\nbstart[, 3] <- bstart[, 3] * (5 - scal0) + scal0  #\
  \ No check for zero!\nsstart <- matrix(NA, nrow = nrun, ncol = 3)\nustart <- sstart\n\
  for (i in 1:nrun) {\n    Asym <- bstart[i, 1]\n    xmid <- bstart[i, 2]\n    scal\
  \ <- bstart[i, 3]\n    b1 <- Asym\n    b2 <- exp(xmid/scal)\n    b3 <- 1/scal\n\
  \    ustart[i, 1] <- b1\n    sstart[i, 1] <- b1/100\n    ustart[i, 2] <- b2\n  \
  \  sstart[i, 2] <- b2/10\n    ustart[i, 3] <- b3\n    sstart[i, 3] <- b3 * 10\n\
  }\ndput(bstart, file = \"supportdocs/scaling/batestrtb.dput\")\ndput(sstart, file\
  \ = \"supportdocs/scaling/batestrts.dput\")\ndput(ustart, file = \"supportdocs/scaling/batestrtu.dput\"\
  )\n```\n\n然而，尽管在上述为 Bates 模型生成参数时采取了措施，\n\n\n\n\n我们现在可以探索在三种模型下，不同方法在优化平方和方面表现如何。\n\
  \n### 16.7.1 优化技术的稳健性\n\n使用 `optimx` 包，运行计算的代码非常直观，但很繁琐，此处将其省略。\n\n```\n## Loading\
  \ required package: optimx\n## Result has function value < 2.6\n##\n##         \
  \  hbates shobbs uhobbs Total\n##   ss>=2.6   6155   4860   8101 19116\n##   ss\
  \ <2.6   7187   8482   5241 20910\n##   Total    13342  13342  13342 40026\n```\n\
  \n这些结果表明，尽管重参数化提供了稳定性，但 Bates 模型的成功率低于缩放后的 Hobbs 模型，而未缩放模型的成功率则低得多。如果我们把成功标准限制在那些同样满足\
  \ KKT 条件的结果上，未缩放模型失败得非常惨，尽管这可能是由于缺乏缩放的直接结果。缺乏缩放增加了未缩放 Hessian 矩阵的条件数，但 `optimx`\
  \ 中 KKT 测试使用的容差对于梯度为 0.001，对于 Hessian 矩阵最小与最大特征值之比则为 1e![c16-math-0044](img/c16-math-0044.png)。请注意，我们正在处理的解是将\
  \ `optim()` 方法 `BFGS` 应用于无约束 Hobbs 第一个随机起点。我们对该解进行缩放，并计算缩放后的 Hobbs 模型量。在缩放后的 Hobbs\
  \ 模型中对相同的缩放版本应用 `BFGS` 实际上并没有找到一个良好的解。非线性建模的生活便是如此。\n\n```\nbrunall$lt2.6k <- (brunall$lt2.6\
  \ & brunall$kkt1 & brunall$kkt2)\nmyopt26k <- table(brunall$lt2.6k, brunall$model,\
  \ useNA = \"no\")\nprint(myopt26k)\n##\n##         hbates shobbs uhobbs\n##   FALSE\
  \   7841   7355  13342\n##   TRUE    5501   5987      0\n## 获取第一个未缩放的解参数\nhobbu1\
  \ <- as.numeric(c(brunu[1, \"b1\"], brunu[1, \"b2\"], brunu[1, \"b3\"]))\ncat(\"\
  First unscaled solution has sum of squares=\", hobbs.f(hobbu1), \"\\n\")\n## First\
  \ unscaled solution has sum of squares= 22.9947\nrequire(numDeriv)\nhessu1 <- hessian(hobbs.f,\
  \ hobbu1)\n## Hessian of the unscaled function at this solution\nprint(hessu1)\n\
  ##            [,1]         [,2]        [,3]\n## [1,]   0.225654    -0.998173   \
  \  910.864\n## [2,]  -0.998173     4.427138   -3989.510\n## [3,] 910.863644 -3989.509799\
  \ 3756349.376\n## Eigenvalues\nprint(eigen(hessu1)$value)\n## [1]  3.75635e+06 \
  \ 1.94973e-01 -1.96168e-04\n## Gradient of unscaled function\nprint(as.numeric(hobbs.g(hobbu1)))\n\
  ## [1]  0.0751719 -0.1095026 48.5989307\nhobbu1s <- hobbu1 * c(0.01, 0.1, 10)  #\
  \ scale the parameters\n## Hessian of the scaled function at this solution (when\
  \ scaled)\nshessu1 <- hessian(shobbs.f, hobbu1s)\nprint(shessu1)\n##          [,1]\
  \      [,2]     [,3]\n## [1,] 2256.543  -998.173  9108.64\n## [2,] -998.173   442.714\
  \ -3989.51\n## [3,] 9108.636 -3989.510 37563.49\n## Eigenvalues\nprint(eigen(shessu1)$value)\n\
  ## [1] 40200.24451    63.07288    -0.56663\n## Gradient of scaled function\nprint(as.numeric(shobbs.g(hobbu1s)))\n\
  ## [1]  7.51719 -1.09503  4.85989\n```\n\n在上面的表格中，我们在略少于 1000 个起点上使用了 14 种方法。我们可以按方法对结果进行分段。我们只显示结果为“良好”的计数，即平方和小于\
  \ 2.6，并将忽略 KKT 条件。\n\n```\n##              hbates shobbs uhobbs   Sum\n##\n## BFGS\
