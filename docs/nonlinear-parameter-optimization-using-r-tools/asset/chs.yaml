  \  4.5 0.371532  -6.8279e-15   4.1078e-15\n## 11  5.0 0.412392  -3.7192e-15   7.1054e-15\n\
  ## 12  5.5 0.453168   7.6605e-15  -3.2196e-15\n## 13  6.0 0.493862   -9.5479e-15\
  \   1.1657e-15\n## 14  6.5 0.534474   5.5511e-15  -5.3291e-15\n## 15  7.0 0.575004\
  \  -1.3323e-15  -5.8842e-15\n## 16  7.5 0.615452  -5.3291e-15   5.3291e-15\n## 17\
  \  8.0 0.655820   6.8834e-15  -3.9968e-15\n## 18  8.5 0.696106  -8.5487e-15   2.2204e-15\n\
  ## 19  9.0 0.736312   1.1102e-15  -9.5479e-15\n```\n\n## 4.4 求解一维求根的方法\n\n从上面的示例可以清楚地看到，任何求根器都需要告诉用户它的意图。遗憾的是，很少有人说明他们对问题的理解！让我们考虑调用求根器的主要方式。\n\
  \n-   我们可以要求用户提供一个区间、一个预期根的下限和上限，并进一步要求区间两端的函数值符号相反。这是 R 的 `uniroot()` (Brent, 1973)\
  \ 和来自 [r-forge.r-project.org/R/?group_id=395](https://r-forge.r-project.org/R/?group_id=395)\
  \ 软件包 `rootoned` 中的 `root1d()` (Nash, 1979) 的情况。\n\n-   另一种方法是考虑从我们的参数 ![c04-math-0037](img/c04-math-0037.png)\
  \ 的函数 ![c04-math-0038](img/c04-math-0038.png) 的单个值开始搜索根。这是一维牛顿法的设置，它使用公式 **4.12**\
  \ ![equation](img/c04-math-0039.png) 进行迭代。\n\n-   我们可能希望在没有参数起始值 ![c04-math-0040](img/c04-math-0040.png)\
  \ 的情况下指定函数。一个例子是我们已经使用的 `polyroot` 函数。据作者所知，R 或他熟悉的其他地方没有这种类型的通用求根器。\n\n使用 R，可以使用函数的\
  \ `expression` 开发一个可能的包。这将允许应用符号微分算符 `D()` 来获取导数，尽管该工具有一些局限性。例如，它不理解 `sum()` 和其他常用函数。我还没有精力追求这种可能性。\n\
  \n也可以考虑牛顿法的割线法版本。也就是说，我们像在 `zeroin()`、`root1d` 或 `uniroot` 那样使用两个点，但不要求它们的函数值符号相反。另一种设置是使用根的初始猜测和步长。\n\
  \n## 4.5 会出现什么问题？\n\n求根似乎是一项相当直接的活动，但有很多情况会引起麻烦。\n\n**多根**在多项式求根问题中很常见。我们已经见过多项式是单项式幂的\
  \ ![c04-math-0041](img/c04-math-0041.png) 的情况。在计算上，如果我们有一个奇次幂并使用提供包含根区间的求根器，那么这类问题是“容易”的。然而，如果没有进一步的工作，我们无法得知根的重数。\n\
  \n更麻烦的是函数恰触及零的情况，例如单项式的幂为偶数时。在这种情况下，牛顿法有时可以成功，但如果 ![c04-math-0042](img/c04-math-0042.png)\
  \ 变得很小，迭代公式就会崩溃。事实上，牛顿法通常需要此类计算问题进行保护。成功的牛顿法的大部分代码将位于保护措施中；基础方法虽然简单，但容易出现数值失败。\n\
  \n完全没有根的问题也会发生，例如下面的示例，它计算以度为单位的角度的正切。我们还提供了梯度代码。\n\n```\nmytan <- function(xdeg)\
  \ {\n    # tangent in degrees\n    xrad <- xdeg * pi/180  # conversion to radians\n\
  \    tt <- tan(xrad)\n}\ngmytan <- function(xdeg) {\n    # tangent in degrees\n\
  \    xrad <- xdeg * pi/180  # conversion to radians\n    gg <- pi/(180 * cos(xrad)²)\n\
  }\n```\n\n\n\n让我们考虑一些示例输出，这些输出经过了编辑以避免过多的空格，我们正在寻找 80° 到 100° 之间的一个根。该函数在此处有一个奇点，但其在提供的区间初始限处的定义值符号相反。对函数进行绘图（假设我们在计算时不会报错）将清晰地显示该问题。然而，我们可以观察四种不同的寻根器的效果：`uniroot()`\
  \ 以及来自 `rootoned` 的三个寻根器，即 `root1d()`、`zeroin()` 和 `newt1d()`。对于最后一个例程，我们包含了迭代输出，注意：\n\
  \n```r\ntint <- c(80, 100)\nru <- uniroot(mytan, tint)\nru\n## $root\n## [1] 90\n\
  ##\n## $f.root\n## [1] -750992\n##\n## $iter\n## [1] 19\n##\n## $estim.prec\n##\
  \ [1] 7.6293e-05\nrz <- zeroin(mytan, tint)\nrz\n## $root\n## [1] 90\n##\n## $froot\n\
  ## [1] -6152091027\n##\n## $rtol\n## [1] 9.3132e-09\n##\n## $maxit\n## [1] 30\n\
  rr <- root1d(mytan, tint)\n## Warning: Final function magnitude> 0.5 * max(abs(f(lbound)),\
  \ abs(f(ubound)))\nrr\n## $root\n## [1]100\n##\n## $froot\n## [1] -5.6713\n##\n\
  ## $rtol\n## [1] 0\n##\n## $fcount\n## [1] 6\nrn80 <- newt1d(mytan, gmytan, 80)\n\
  rn80\n## $root\n## [1] 0\n##\n## $froot\n## [1] -5.6395e-29\n##\n## $itn\n## [1]\
  \ 8\nrn100 <- newt1d(mytan, gmytan, 100)\nrn100\n## $root\n## [1] 180\n##\n## $froot\n\
  ## [1] -1.2246e-16\n##\n## $itn\n## [1] 8\n```\n\n注意：\n\n- `zeroin()` 和 `uniroot()`\
  \ 没有给出任何问题警告，并返回了一个接近 90° 的“根”，但该参数点处的函数值量级很大；\n- `root1d()` 确实对这种情况给出了警告；\n- `newt1d()`\
  \ 从 80°（起始区间的的一端）开始，到了 0°（另一个“根”），而这超出了其他寻根器所使用的起始区间。同样，从 100° 开始返回了 180° 的根。当然，这些结果是正确的。\n\
  \n## 4.6 成为寻根程序的明智用户\n\n大多数情况下——我足够胆小，不定义“大多数”——使用 `uniroot()` 等寻根器的用户都能在没有问题的情况下得到满意的结果。另一方面，偶尔检查这些结果确实是非常值得的。通过\
  \ `curve` 函数可以轻松实现这一点，它可以让你绘制感兴趣的函数。上面的示例展示了如何在 0 处添加一条水平线作为参考，并使检查根的位置变得容易。即使在代码内部，如果在建议根处的函数值“很大”，生成一个警告也是很有用的，例如，该值在级上与搜索初始区间端点的函数值数量级相同。事实上，我很惊讶\
  \ `uniroot()` 竟然没有这样的警告，并且已经在我自己的一个例程中加入了这样的检查。\n\n当出现精度问题时，记住 `Rmpfr` 包也是值得的，尽管这一建议带有前提条件，即代码可能需要修改，以确保不调用非\
  \ R 函数，并且性能和输出可能会变得不尽理想。\n\n## 4.7 结论与扩展\n\n根据前面的讨论：\n\n- 单变量寻根方法工作效率良好，但仍需要“关注”。这适用于几乎任何迭代计算。\n\
  - 需要更多“深思熟虑”的方法，以为用户提供更多关于其函数的信息，并建议需要调查的潜在问题。此类工具旨在用于常规工具似乎给出不恰答案的情况。\n- 像往常一样，更多良好的测试用例和示例对于改进我们的方法是有用的。\n\
  \n## References\n\n1. Brent R 1973 *Algorithms for Minimization without Derivatives*.\
  \ Prentice-Hall, Englewood Cliffs, NJ.\n2. Maechler M 2013 *Rmpfr: R MPFR - Multiple\
  \ Precision Floating-Point Reliable*. R package version 0.5-3.\n3. Nash JC 1979\
  \ *Compact Numerical Methods for Computers: Linear Algebra and Function Minimisation*.\
  \ Hilger, Bristol.\n\n# 第 5 章：单参数最小化问题\n\n涉及单参数函数最小化的问题本身并不像其他优化问题中的子问题那样常见。这是因为许多优化方法会先生成一个搜索方向，然后需要沿着该方向找到“最佳”步长。然而，确实存在需要优化单个参数的问题，因此我们拥有合适的工具来解决这些问题是非常重要的。\n\
  \n## 5.1 `optimize()` 函数\n\nR 有一个内置函数用于寻找区间内单参数函数的最小值，`optimize()`。它是基于 Brent (1973)\
  \ 的方法，对于 Lennard–Jones 势能函数极其敏感。它需要一个函数和一个区间。事实上，在级上与搜索初始区间端点的函数值数量级相同，如果在建议根处的函数值“很大”，在代码内部生成一个警告也是很有用的。事实上，我很惊讶\
  \ `uniroot()` 竟然没有这样的警告，并且已经在我自己的一个例程中加入了这样的检查。\n\n## 5.2 使用寻根器\n\n正如我们在第 4 章所看到的，如果我们有函数的导数形式，就可以尝试求解该函数的根，从而希望找到原函数的极值。这当然不能保证我们找到的是最小值，因为梯度在极大值或鞍点也为零。这里我们使用了\
  \ `uniroot`，但可以使用第 4 章的任何思想。\n\n```r\nljgr <- function(r, ep = 0.650196, sig = 0.31655)\
  \ {\n    expr1 <- 4 * ep\n    expr2 <- sig/r\n    expr8 <- sig/r²\n    value <-\
  \ expr1 * (expr2¹² - expr2⁶)\n    grad <- -(expr1 * (12 * (expr8¹¹)) - 6 * (expr8⁵))\n\
  }\nroot <- uniroot(ljgr, interval = c(0.001, 5))\ncat(\"f(\", root$root, \")=\"\
  , root$f.root, \" after \", root$iter, \" Est. Prec'n=\",\n    root$estim.prec,\
  \ \"\\n\")\n## f( 0.3553 )= -0.0079043  after  13  Est. Prec'n= 6.1035e-05\n```\n\
  \n## 5.3 但最小值在哪里？\n\n这些很好，但大多数最小化的新手很快就会意识到，他们需要提供一个区间才能得到合理的答案。在很多问题中——我处理过的大多数——这是获取答案最困难的部分。考虑以下示例。\n\
  \n```r\nwoblramp <- function(x) {\n    (-3 + 0.1 * x) * cos(x * 2)\n}\nrequire(pracma,\
  \ quietly = TRUE)\nwmins <- findmins(woblramp, a = -10, b = 10)\ncurve(woblramp,\
  \ from = -10, to = 10)\nymins <- woblramp(wmins)  # 计算最小值点处的函数值\npoints(wmins, ymins,\
  \ col = \"red\")  # 在图上覆盖打印\ntitle(main = \"WOBLRAMP function with minima graphed\"\
  )\n```\n\n稍后在第 11 章，我们将看到一种避免除零危险的 `optimize()` 方法。\n\n\n\n实现这一目标的方法是对函数进行网格搜索。这就是\
  \ Borchers (2013) 使用 `pracma` 软件包中的 `findmins` 函数所做的。另一种方法是使用 R 的基础函数 `curve`，简单地在参数的两个值之间绘制函数，正如我们之前做的那样。事实上，绘制\
  \ 1D 函数是自然而然的，且作为第一步是非常建议的。随后我们很快就会发现那些阻碍此类问题自动化解决方案的棘手缩放问题。\n\n在之前的示例中，我考虑过在不带\
  \ `quietly=TRUE` 条件的情况下发布 `require` 语句。该指令通常会抑制关于 `pracma` 中已加载函数被同名函数覆盖（mask 码）的消息。以下是一个展示这种可能性的示例。\n\
  \n```\ndetach(package:pracma)\nrequire(numDeriv)\n## Loading required package: numDeriv\n\
  require(pracma)\n## Loading required package: pracma\n##\n## Attaching package:\
  \ 'pracma'\n##\n## The following objects are masked from 'package:numDeriv':\n##\n\
  ##    grad, hessian, jacobian\n```\n\n我相信，同名函数之间的混淆经常是 R 用户困扰的根源。如果存在疑问，可以使用以下形式调用函数：\n\
  \n`packagename::functionname()`\n\n如果怀疑可能存在混淆，我推荐这种虽然麻烦的方法。\n\n## 5.4 1D 最小化器的思路\n\
  \n关于单参数函数求根和最小化的文献在 20 世纪 60 年代和 70 年代非常丰富。从本质上说，开发人员们寻求的是：\n\n*   提供一种稳健的方法，当给定参数的起始区间时，该方法至少能找到单峰函数的最小值，并且在理想情况下，对于多峰函数也能找到其中一个极小值；\n\
  *   速度快速，即当函数“表现良好”时，使用较少的函数和/或导数评估；\n*   相对易于实现。\n\n为了这一目标，这些方法尝试将稳健搜索（如成功-失败搜索\
  \ (Dixon, 1972)、黄金分割法搜索（[`en.wikipedia.org/wiki/Golden_section_search`](http://en.wikipedia.org/wiki/Golden_section_search)）或二分法（[`en.wikipedia.org/wiki/Bisection_method`](http://en.wikipedia.org/wiki/Bisection_method)）与基于简单多项式模型（通常是二次）的反插值法相结合。最流行的之一是\
  \ Brent (1973) 方法，称为 `FMIN`。\n\n对于大多数用户来说，即使面对相当复杂的函数，1D 最小化也不可能需要投入巨大的努力来提高效率。当有成千上万的问题需要解决时，或许值得更仔细地观察这些方法。在这种情况下，良好的起始值估计和自定义的终止测试可能比更改方法更能有效地加速计算。\n\
  \n另一方面，方法的要求可能非常重要。Brent/Dekker 代码要求我们为感兴趣的参数指定一个区间。使用成功/失败搜索（通常紧接着是二次反插值）的代码则使用感兴趣参数的起始点和步长。这些不同的方法方法迫使用户提供截然不同的信息。如果我们有一个涉及相当简单计算的函数，但不知道极值的位置，那么根据我的经验，“点\
  \ + 步长”的公式的要求要低得多，因为我们不需要担心是否已经包围了一个最小值。\n\n用户必须记住的一点是，许多函数在参数的整个定义域内并没有定义。例如，考虑函数\n\
  \n5.1 ![equation](img/c05-math-0004.png)\n\n该函数在 ![c05-math-0005](img/c05-math-0005.png)\
  \ 非正时未定义。用户对这种情况添加测试并让函数返回一个非常大的值可能是明智的。这可以避免麻烦，但可能会减慢方法。注意，R 函数 `optimize()` 似乎内置了这种保护，但用户不应该依赖最小化器进行如此严谨的代码。以下是关于提供这种保护的示例。\n\
  \n```\n#保护的 log 函数\nmlp <- function(x) {\n    if (x < 1e-09)\n        fval <- 0.1\
  \ * .Machine$double.xmax else fval <- (log(x) * (x * x - 3000))\n}\nml <- function(x)\
  \ {\n    fval <- (log(x) * (x * x - 3000))\n}\nmin <- optimize(mlp, interval = c(-5,\
  \ 5))\nprint(min)\n## $minimum\n## [1] 4.9999\n##\n## $objective\n## [1] -4788\n\
  minx <- optimize(ml, interval = c(-5, 5))\n## Warning: NaNs produced\n## Warning:\
  \ NA/Inf replaced by maximum positive value\nprint(minx)\n## $minimum\n## [1] 4.9999\n\
  ##\n## $objective\n## [1] -4788\n## But we missed the solution!\nmin2 <- optimize(mlp,\
  \ interval = c(-5, 55))\nprint(min2)\n## $minimum\n## [1] 20.624\n##\n## $objective\n\
  ## [1] -7792.1\n```\n\n`optimize()` 无法告诉我们没有找到最小值，我认为这是一个非常遗憾的弱点。我们可以轻松检查是否找到了最小值。为\
  \ `optimize()` 增加更好的保护措施是我待办事项中的任务之一。\n\n## 5.5 线搜索\n\n一维最小化在多参数优化中非常频繁，其中一个子问题是寻找搜索方向。在实践中，由于搜索方向可能是不完美的，并不需要沿线找到精确最小值，许多线搜索只需提供满意的改进。注意，区间方法在信域方法中也有其地位\n\
  \n# 第 6 章 非线性二乘\n\n正如我们提到的，非线性二乘问题非常常见且重要，因此有专门的工具来解决。让我们看看 R 提供的工具。\n\n## 6.1 来自\
  \ `stats` 软件包的 `nls()`\n\n在常用的 R 系统中，`stats` 软件包包含了 `nls()`。该函数旨在解决非线性二乘问题，并拥有针对此类问题的丰富功能。一个优点是调用\
  \ `nls()` 计算非线性二乘的方式。我们可以将非线性二乘问题定义为数学表达式，由 `nls()` 完成将其转换为求解非线性二乘所需的内部计算结构。在我看来，`nls()`\
  \ 指出了非线性二乘和其他参数估计的实现方向，是该领域软件开发的里程碑。感谢 Doug Bates 和他的合作者。\n\n遗憾的是 `nls()` 有许多缺点，将在后续讨论。我们还展示了一些可以克服这些缺陷的替代方案。\n\
  \n### 6.1.1 简单示例\n\n让我们考虑一个简单的示例，其中 `nls()` 使用肥胖患者随时间的体重变化进行（Venables and Ripley,\
  \ 1994, p. 225）（图 6.1）。数据在 R 软件包 `MASS` 中，基础发行版名为 `wtloss`。我将其提取在这里，这样它就不会与手稿分开文件。\n\
  \n## 参考文献\n\n1.  Borchers HW 2013 *pracma: Practical Numerical Functions*. R package\
  \ version 1.5.0.\n2.  Brent R 1973 *Algorithms for Minimization without Derivatives*.\
  \ Prentice-Hall, Englewood Cliffs, NJ.\n3.  Dixon L 1972 *Nonlinear Optimisation*.\
  \ The English Universities Press, London.\n\n\n\n\n```\nWeight <- c(184.35, 182.51,\
  \ 180.45, 179.91, 177.91, 175.81, 173.11, 170.06, 169.31,\n    165.1, 163.11, 158.3,\
  \ 155.8, 154.31, 153.86, 154.2, 152.2, 152.8, 150.3, 147.8,\n    146.1, 145.6, 142.5,\
  \ 142.3, 139.4, 137.9, 133.7, 133.7, 133.3, 131.2, 133, 132.2,\n    130.8, 131.3,\
  \ 129, 127.9, 126.9, 127.7, 129.5, 128.4, 125.4, 124.9, 124.9, 118.2,\n    118.2,\
  \ 115.3, 115.7, 116, 115.5, 112.6, 114, 112.6)\nDays <- c(0, 4, 7, 7, 11, 18, 24,\
  \ 30, 32, 43, 46, 60, 64, 70, 71, 71, 73, 74, 84,\n    88, 95, 102, 106, 109, 115,\
  \ 122, 133, 137, 140, 143, 147, 148, 149, 150, 153,\n    156, 161, 164, 165, 165,\
  \ 170, 176, 179, 198, 214, 218, 221, 225, 233, 238, 241,\n    246)\nwl <- data.frame(Weight\
  \ = Weight, Days = Days)\nwlmod <- \"Weight ∼ b0 + b1*2^(-Days/th)\"\nwlnls <- nls(wlmod,\
  \ data = wl, start = c(b0 = 1, b1 = 1, th = 1))\nsummary(wlnls)\n## Formula: Weight\
  \ ∼ b0 + b1 * 2^(-Days/th)\n## Parameters:\n##    Estimate Std. Error t value Pr(>|t|)\n\
  ## b0    81.37       2.27    35.9   <2e-16 ***\n## b1   102.68       2.08    49.3\
  \   <2e-16 ***\n## th   141.91       5.29    26.8   <2e-16 ***\n## - - -\n## Signif.\
  \ codes:  0 '***' 0.001 '**' 0.01 '*' 0.05 '.' 0.1 ' ' 1\n## Residual standard error:\
  \ 0.895 on 49 degrees of freedom\n## Number of iterations to convergence: 6\n##\
  \ Achieved convergence tolerance: 3.28e-06\nplot(wl$Days, wl$Weight)\ntitle(\"Weight\
  \ loss over time in Days\")\npoints(wl$Days, predict(wlnls), type = \"l\", col =\
  \ \"red\")\n```\n\n![c06f001](img/c06f001.jpg)\n\n**图 6.1**](#9781118883969c06.xhtml_c06-fig-anc-0001)\n\
  \n尽管起始参数非常粗糙，但我们看到在这种情况下 `nls()` 很好地将模型拟合到了数据上。\n\n### 6.1.2 回归与最小二乘法\n\n我认为 `nls()`\
  \ 的命名“非线性最小二乘法”可能并不完全准确。它的主要目的是解决非线性回归建模问题，即我们试图通过调整模型参数以拟合数据来估计这些参数。在这些问题中，我们很少得到零和，甚至是一个特别小的平方和。此外，我们通常对参数的变异性（也称为`系数`）以及基于它们计算出的量感兴趣。在比较用于非线性最小二乘问题的工具时，这一点值得记住。那些用于非线性回归的非线性最小二乘工具是显而易见的；但并非所有非线性最小二乘问题都源于回归应用，这一点取决于用户的历史背景和经验，可能并不那么明确。\n\
  \n## 6.2 一个更困难的案例\n\n现在让我们来尝试一个最初由 Ratkowsky (1983, p. 88) 提出并由 Huet 等人 (1996, p.\
  \ 1) 开发的例子。这是一个关于牧草再长的模型，其中产量是自上次放牧以来时间的函数。这两个变量都没有说明单位，我认为这是一种不规范的做法，因为单位是很重要的（Nash,\
  \ 2012）。也可以对我自己提出批评。有时，分析人员并没有获得所有信息。再次，我们通过将数据放入数据框并指定模型公式来建立计算。可以是一个公式对象，但我发现将其保存为字符串会遇到更少的困难。注意\
  \ `~`（波浪号）字符，它在 R 中表示“建模为”。我们使用两组起始参数，第一组：\n\n```\noptions(width = 60)\npastured\
  \ <- data.frame(time = c(9, 14, 21, 28, 42, 57, 63, 70, 79),\n    yield = c(8.93,\
  \ 10.8, 18.59, 22.33, 39.35, 56.11, 61.73, 64.62, 69.31))\nregmod <- \"yield ∼ t1\
  \ - t2*exp(-t3/t4)\"\nones <- c(1, 1, 1, 1)\nhuet <- c(1, 1, 1, 1)\n```\n\n注意 `nls()`\
  \ 无法从任何一组参数找到解。\n\n```\nanls <- nls(regmod, data = pastured, start = ones)\nanlsx\
  \ <- nls(regmod, data = pastured, start = huet)\n```\n\n现在我们尝试来自 `nlmrt` 的 `nlxb()`\
  \ 算法。该函数被设计作为 `nls()` 的替代，尽管它并没有涵盖后者的所有特征。此外，它比 `nls()` 更健壮。`nlxb()` 比 `nls()` 更严格，并且要求数据在数据框中。\n\
  \n```\nrequire(nlmrt)\nanmrt <- nlxb(regmod, data = pastured, start = huet)\n##\
  \ nlmrt class object: x\n## residual sumsquares = 4648.1  on 9 observations\n##\
  \     after 3    Jacobian and 4 evaluations\n##   name        coeff       SE   \
  \   tstat     pval      gradient    JSingval\n## t3          -9.2088    0.8172 \
  \   -11.27  9.617e-05   5.022e-06       164.8\n## t4          2.37778     0.221\
  \     10.76  0.0001202  -6.244e-05       3.762\n## t1          69.9554     2.363\
  \     29.61  8.242e-07   2.196e-07       1.617\n## t2          61.6818     3.194\
  \     19.31  6.865e-06  -7.295e-070.326\nanmrtx <- nlxb(regmod, data = pastured,\
  \ start = ones)\n## nlmrtx\n## nlmrt class object: x\n## residual sumsquares = 8.3759\
  \  on 9 observations\n##     after 32    Jacobian and 44 function evaluations\n\
  ##   name       coeff      SE      tstat      pval      gradient    JSingval\n##\
  \ t3          0.998202     NA        NA        NA   1.889e-08           3\n## t4\
  \          0.996049     NA        NA        NA   4.15e-08   1.437e-09\n## t1   \
  \        38.8378     NA        NA        NA   -3.04e-11   2.167e-16\n## t2     \
  \      1.00007     NA        NA        NA  -7.748e-10    5.14e-26\n```\n\n展示奇异值大小的一种有效方法是将它们放在柱状图中（[图\
  \ 6.2]）。如果对来自 `anmrtx` 结果中的奇异值进行此操作，我们会发现代表最小奇异值的条形非常小。事实上，雅可比矩阵中变异的大部分都集中在第一个奇异值上。\n\
  \n\n\n\n\n```\nJnmrtx <- pastjac(coef(anmrtx), yield = pastured$yield, time = pastured$time)\n\
  svals <- svd(Jnmrtx)$d\nbarplot(svals, main = \"Singular values at nlxb solution\
  \ to pasture problem\",\n    horiz = TRUE)\n```\n\n![c06f002](img/c06f002.jpg)\n\
  \n**图 6.2**\n\n`nlxb()` 中使用的 Levenberg–Marquardt 稳定方法通过对对角线进行增强，直到其在计算上是非奇异，从而避免了雅可比矩阵的奇异性。这种常用方法的详细信息可以在地方找到（Nash,\
  \ 1979, Algorithm 23）。`minpack.lm` 包具有函数 `nlsLM` 用来实现类似的方法，并能够从参数 `huetstart` 开始解决问题，但因为它使用了\
  \ `nls()` 的内部函数 `nlsModel()` 来建立计算，所以它无法从起始向量 `ones` 中的值开始。\n\n```\nrequire(minpack.lm)\n\
  ## Loading required package: minpack.lm\naminp <- try(nlsLM(regmod, start = ones,\
  \ trace = FALSE, data = pastured))\nsummary(aminp)\n##    Length     Class     \
  \ Mode\n##         1 try-error character\naminpx <- try(nlsLM(regmod, start = huetstart,\
  \ trace = FALSE,\n    data = pastured))\nprint(aminpx)\n## Nonlinear regression\
  \ model\n##   model: yield ∼ t1 - t2 * exp(-exp(t3 + t4 * log(time)))\n##    data:\
  \ pastured\n##    t3    t4    t1    t2\n## -9.21  2.38 69.96 61.68\n##  residual\
  \ sum-of-squares: 8.38\n##\n## Number of iterations to convergence: 42\n## Achieved\
  \ convergence tolerance: 1.49e-08\n```\n\n`nlmrt` 和 `minpack.lm` 都有函数可以处理以 R 函数而非表达式表示的模型，且\
  \ `nlmrt` 还有工具可以将表达式转换为函数。`pracma` 包有一个类似的函数 `lsqnonlin()`。CRAN 包 `MarqLevAlg` 也旨在解决无约束的非线性最小二乘问题，但它处理的是平方和函数而不是残差。\n\
  \nR 语言中还有其他工具旨在解决非线性最小二乘问题，以至于有两个名为 `nls2` 的包。在编写时（2013 年 8 月），我们尚未能成功使用 INRA 包\
  \ `nls2`。这是一个相当复杂的包，无法通过 `install.packages()` 作为普通的 R 包进行安装。CRAN 上由 Gabor Grothendieck\
  \ 开发的 `nls2` 包旨在将网格搜索与 `nls()` 函数相结合。以下是其从 `ones` 开始求解牧草再生问题的用法示例：\n\n```\nrequire(nls2)\n\
  ## Loading required package: nls2\n## Loading required package: proto\nset.seed(123)\
  \  # 为了可重复性\nregmodf <- as.formula(regmod)  # 以防万一\nm100 <- c(t1 = -100, t2 = -100,\
  \ t3 = -100, t4 = -100)\np100 <- (-1) * m100\ngstart <- data.frame(rbind(m100, p100))\n\
  anls2 <- try(nls2(regmodf, start = gstart, data = pastured, algorithm = \"random-search\"\
  , control = list(maxiter = 1000)))\nprint(anls2)\n## Nonlinear regression model\n\
  ##   model: yield ∼ t1 - t2 * exp(-exp(t3 + t4 * log(time)))\n##    data: pastured\n\
  ##    t1    t2    t3    t4\n##  11.6 -44.8  84.8 -26.1\n##  residual sum-of-squares:\
  \ 1377\n##\n## Number of iterations to convergence: 1000\n## Achieved convergence\
  \ tolerance: NA\n```\n\n这远不如我们从 `nlxb()` 或 `nlsLM()` 得到的 Marquardt 解法好，但从其他起始点尝试这些程序得到的“答案”都是到处乱跳的。某些地方不对劲！\n\
  \n然而，我们可以尝试 `nls2()` 中的部分线性工具。我们注意到参数 ![c06-math-0001](img/c06-math-0001.png) 是截距项，且\
  \ ![c06-math-0002](img/c06-math-0002.png) 乘积了涉及 ![c06-math-0003](img/c06-math-0003.png)\
  \ 和 ![c06-math-0004](img/c06-math-0004.png) 的指数结构，因此我们可以将问题视为通过非线性建模寻找后两个参数，并用线性回归求解另外两个参数。`nlmrt`\
  \ 包尚未具备这种能力，但 `nls2` 有。下面的代码显示了如何使用它。\n\n```\nrequire(nls2)\nset.seed(123)  # 为了可重复性\n\
  plinform <- yield ∼ cbind(1, -exp(t3 + t4 * log(time)))\ngstartpl <- data.frame(rbind(-10,\
  \ 1), c(10, 8))\nnames(gstartpl) <- c(\"t3\", \"t4\")\nanls2pl <- try(nls2(plinform,\
  \ start = gstartpl, data = pastured,\n    algorithm = \"plinear-brute\", control\
  \ = list(maxiter = 200))\nprint(anls2pl)\n## Nonlinear regression model\n##   model:\
  \ yield ∼ t1 - t2 * exp(-exp(t3 + t4 * log(time)))\n##    data: pastured\n##   \
  \ t3    t4 .lin1 .lin2\n## -10.0   2.5  75.5  64.8\n##  residual sum-of-squares:\
  \ 38.6\n##\n## Number of iterations to convergence: 225\n## Achieved convergence\
  \ tolerance: NA\n================================\nanls2plr <- try(nls2(plinform,\
  \ start = gstartpl, data = pastured,\n    algorithm = \"plinear-random\", control\
  \ = list(maxiter = 200))\nprint(anls2plr)\n## Nonlinear regression model\n##   model:\
  \ yield ∼ t1 - t2 * exp(-exp(t3 + t4 * log(time)))\n##    data: pastured\n##   \
  \ t3    t4 .lin1 .lin2\n## -6.42  1.57 87.95 84.82\n##  residual sum-of-squares:\
  \ 29.9\n##\n## Number of iterations to convergence: 200\n## Achieved convergence\
  \ tolerance: NA\n```\n\n遗憾的是我们看到了两个不同的结果，表明该模型并不理想。但我们可以使用 `nls2` 的最终结果并用 `nls()`\
  \ 进行尝试。在这里我们利用了在起始向量中放入 ![c06-math-0005](img/c06-math-0005.png) 和 ![c06-math-0006](img/c06-math-0006.png)，因为我们只需要固定参数。从两个起始点来看，我们找到了与\
  \ `nlxb()` 相同的解。\n\n为了直观地比较 `nls2` 找到的模型与最佳解，我们绘制了三个模型的拟合线。这样我们就可以计算并绘制拟合值；我们将使用\
  \ `nlmrt` 的 `wrapnls()` 函数并将拟合结果与原始数据对比（图 6.3）。残差也可以通过箱线图显示，我们也展示了那种显示（图 6.4）。\n\
  \n```\nrequire(nlmrt)\n## Loading required package: nlmrt\nsplb <- coef(anls2pl)\n\
  splr <- coef(anls2plr)\nnames(splb) <- names(huetstart)\nnames(splr) <- names(huetstart)\n\
  anlsfromplb <- nls(regmod, start = splb, trace = FALSE, data = pastured)\nanlsfromplr\
  \ <- nls(regmod, start = splr, trace = FALSE, data = pastured)\nagomp <- wrapnls(regmodf,\
  \ start = huetstart, data = pastured)\nfitnlxb <- fitted(agomp)\nfitnls2b <- fitted(anls2plb)\n\
  fitnls2r <- fitted(anls2plr)\nplot(pastured$time, fitnlxb, type = \"l\", lwd = 2,\
  \ xlab = \"time\")\npoints(pastured$time, fitnls2b, col = \"red\", type = \"l\"\
  , lty = \"dashed\",\n    lwd = 2)\npoints(pastured$time, fitnls2r, col = \"blue\"\
  , type = \"l\", lty = \"dotdash\",\n    lwd = 2)\npoints(pastured$time, pastured$yield)\n\
  title(main = \"Fitted models for pasture data\")\nsstr = \"best = solid line, nls2.plinear.brute\
  \ = dashed, nls2.plinear.random = dotdash\"\ntitle(sub = sstr, cex.sub = 0.8)\n\
  ```\n\n```\nresnlxb <- pastured$yield - fitnlxb\nresnls2b <- pastured$yield - fitnls2b\n\
  resnls2r <- pastured$yield - fitnls2r\n```\n\n![c06f003](img/c06f003.jpg)\n\n**图\
  \ 6.3**\n\n![c06f004](img/c06f004.jpg)\n\n**图 6.4**\n\n虽然图表显示 `nlxb()` 的解比其他解“更好”，但仍然感到不安，因为还没有可靠地获得一个合理的解。其他实验表明，`nlxb()`\
  \ 可以从许多起始值给出不满意的解。我们在这里很幸运。注意，`nls2()` 必须提供包含“良好”参数的区间，因此要求我们对这些参数在哪里有何想法。\n\n\n\
  \n\n\n通过使用 **`nlmrt`** 代码 `model2ssfun()` 和 `model2grfun()` 生成目标函数及其梯度以供优化例程使用，可以发现类似的结果差异。\n\
  \n```\nssfn <- model2ssfun(regmodf, ones)\ngrfn <- model2grfun(regmodf, ones)\n\
  time <- pastured$time\nyield <- pastured$yield\n# aopto<-optim(ones, ssfn, gr=grfn,\
  \ yield=yield, time=time,\n# method='BFGS', control=list(maxit=10000)) print(aopto)\
  \ ##\n# We did not run this one.\naopth <- optim(huetstart, ssfn, gr = grfn, yield\
  \ = yield, time = time,\n    method = \"BFGS\", control = list(maxit = 10000))\n\
  print(aopth)\n## $par\n##      t3      t4      t1      t2\n## -9.2089  2.3778 69.9552\
  \ 61.6815\n##\n## $value\n## [1] 8.3759\n##\n## $counts\n## function gradient\n\
  ##       92       36\n##\n## $convergence\n## [1] 0\n##\n## $message\n## NULL\n\
  ```\n\n这一切的结论是什么？虽然我们可以找到接受的解决方案，但这些工具可能无法自动为我们提供我们拥有最佳解决方案的证据。这是一个仍然值得研究（数学方面）和开发（软件工具方面）的领域。\n\
  \n## 6.3 `nls()` 求解的结构\n\nR 函数 `str()` 可以快速显示 `nls()` 返回的内容这是一组令人印象深刻的能力。如前所述，我唯一的担心是它对于许多应用和用户来说太复杂了。某些用户还会发现其命名法与优化社区的用法不一致。假设第\
  \ 6.1.1 节中体重减轻问题通过 `nls()` 和 `nlxb()` 的解分别为 `wlnls` 和 `wlnlxb`。解处的残差雅可比矩阵从 `wlnls`\
  \ 获取的方式是 `wlnls$m$gradient()`（注意这是一个函数调用），而从 `wlnlxb` 获取的方式则是 `wlnlxb$jacobian`。对“gradient”一词的使用延续到了错误信息“singular\
  \ gradient”，我认为这让用户感到困惑。\n\n```\nrequire(nlmrt)\nwlmod <- \"Weight ∼ b0 + b1*2^(-Days/th)\"\
  \nwlnlxb <- nlxb(wlmod, data = wl, start = c(b0 = 1, b1 = 1, th = 1))\nwlnlxb\n\
  ## nlmrt class object: x\n## residual sumsquares =  39.245  on  52 observations\n\
  ##     after  9    Jacobian and  13 function evaluations\n##   name       coeff\
  \       SE      tstat     pval      gradient    JSingval\n## b0          81.3751\
  \      2.266      35.9         0   7.707e-05        8.53\n## b1          102.683\
  \       2.08     49.36         0  -8.111e-05       1.427\n## th          141.908\
  \      5.289     26.83         0  -2.634e-05      0.1471\n```\n\n`nlxb()` 和 `nls()`\
  \ 都可以使用函数 `coef()` 来获取线性模型的参数或系数。因此，\n\n```\ncoef(wlnls)\n##      b0      b1   \
  \   th\n##  81.374 102.684 141.910\ncoef(wlnlxb)\n```\n\n然而，在内部，`nlxb()` 将系数作为 `wlnlxb$coefficients`\
  \ 返回，即作为解决方案的一个简单元素。相比之下，人们需要使用 `wlnls$m$getPars()` 从 `nls()` 求解对象中提取它们。这个函数似乎没有通过传统的\
  \ R 方法（使用 `?getPars` 或 `??getPars`）进行记录。但通过 `str(wlnls)` 看到它。在 [`web.njit.edu/all_topics/Prog_Lang_Docs/html/library/nls/html/nlsModel.html`](http://web.njit.edu/all_topics/Prog_Lang_Docs/html/library/nls/html/nlsModel.html)\
  \ 一个标题为“Create an nlsModel Object”的网页上也有相关文档。然而，我在 [www.r-project.org](http://www.r-project.org)\
  \ 网站的主 R 手册中没有找到这个页面。我的抱怨并不是一旦知道机制获取信息有多困难，而是寻找如何这样做需要比应该要求的更多的挖掘。\n\n当然，正如我在第 3\
  \ 章中指出的，要以一种通用方便的方式构建 `nls()` 等复杂工具的输出是困难的。知道如何使用函数 `getPars()` 或 `coef(wlnls)`，用户可以快速访问他们需要的信息。还有另一种可能性是\
  \ `summary(wlnls)$coefficients[,1]`。\n\n能够……是有帮助的（后续文本遵循逻辑）\n\n\n\n\n\n```\nx <-\
  \ 1:10\ny <- 2 * x + 3  # perfect fit\nyeps <- y + rnorm(length(y), sd = 0.01) \
  \ # added noise\nanoise <- nls(yeps ∼ a + b * x, start = list(a = 0.12345, b = 0.54321))\n\
  summary(anoise)\n##\n## Formula: yeps ∼ a + b * x\n##\n## Parameters:\n##   Estimate\
  \ Std. Error t value Pr(>|t|)\n## a  3.01098    0.00699     431   <2e-16 ***\n##\
  \ b  1.99857    0.00113    1775   <2e-16 ***\n## - - -\n## Signif. codes:  0 '***'\
  \ 0.001 '**' 0.01 '*' 0.05 '.' 0.1 ' ' 1\n##\n## Residual standard error: 0.0102\
  \ on 8 degrees of freedom\n##\n## Number of iterations to convergence: 2\n## Achieved\
  \ convergence tolerance: 3.91e-09\naperf <- try(nls(y ∼ a + b * x, start = list(a\
  \ = 0.12345, b = 0.54321)))\nprint(strwrap(aperf))\n## [1] \"Error in nls(y ∼ a\
  \ + b * x, start = list(a = 0.12345,\"\n## [2] \"b = 0.54321)) : number of iterations\
  \ exceeded maximum\"\n## [3] \"of 50\"\nldata <- data.frame(x = x, y = y)\naperfn\
  \ <- try(nlxb(y ∼ a + b * x, start = list(a = 0.12345, b = 0.54321),\n    data =\
  \ ldata))\naperfn\n## nlmrt class object: x\n## residual sumsquares =  4.5342e-20\
  \  on  10 observations\n##     after  3    Jacobian and  4 function evaluations\n\
  ##   name       coeff        SE       tstat    pval      gradient    JSingval\n\
  ## a                 3   5.143e-11  5.833e+10        0   1.671e-10       19.82\n\
  ## b                 2   8.289e-12  2.413e+11        0  -9.542e-10       1.449\n\
  ```\n\n### 6.4.2 稳健性——“奇异梯度”烦恼\n\n我们已经见过 `nls()` 因带有“奇异梯度（singular gradient）”终止信息而停止的示例。虽然\
  \ Marquardt 方法也可能失败，但它们通常比 `nls()` 的高斯-牛顿法更稳健。\n\n以下问题发布在 Rhelp 列表上。它只有四个观测值来拟合三个参数，因此我们完全预考虑到会有奇怪的结果。第一次尝试使用\
  \ `nls()` 会导致常见的“奇异梯度”错误，但 `nlxb()` 可以找到解决方案。\n\n```\nx <- c(60, 80, 100, 120)\n\
  y <- c(0.8, 6.5, 20.5, 45.9)\nmydata <- data.frame(x, y)\npnames <- c(\"a\", \"\
  b\", \"d\")\nnpar <- length(pnames)\nst <- c(1, 1, 1)\nnames(st) <- pnames\nrnls\
  \ <- try(nls(y ∼ exp(a + b * x) + d, start = st, data = mydata),\n    silent = TRUE)\n\
  if (class(rnls) == \"try-error\") {\n    cat(\"nls() failed (singular gradient?)\\\
  n\")\n} else {\n    summary(rnls)\n}\n## nls() failed (singular gradient?)\nrequire(nlmrt)\n\
  rnlx0 <- try(nlxb(y ∼ exp(a + b * x) + d, start = st, data = mydata),\n    silent\
  \ = TRUE)\ncat(\"Found sum of squares \", rnlx0$ssquares, \"\\n\")\n## Found sum\
  \ of squares  1.701e+104\nprint(rnlx0$coefficients)\n##           a           b\
  \           d\n##  5.0003e-01  9.9583e-01 -5.9072e+47\n## 现在关闭相对偏移测试\nrnlx1 <- try(nlxb(y\
  \ ∼ exp(a + b * x) + d, start = st, data = mydata,\n    control = list(rofftest\
  \ = FALSE)), silent = TRUE)\ncat(\"Found sum of squares \", rnlx1$ssquares, \"\\\
  n\")\n## Found sum of squares  2.3892e+50\ncoef(rnlx1)\n## 还有平方和大小测试\nrnlx2 <- try(nlxb(y\
  \ ∼ exp(a + b * x) + d, start = st, data = mydata,\n    control = list(rofftest\
  \ = FALSE, smallsstest = FALSE)), silent = TRUE)\ncat(\"Found sum of squares \"\
  , rnlx2$ssquares, \"\\n\")\n## Found sum of squares  0.728\ncoef(rnlx2)\n```\n\n\
  \n\n\n\n```\nydat <- c(5.308, 7.24, 9.638, 12.866, 17.069, 23.192, 31.443,\n   \
  \ 38.558, 50.156, 62.948, 75.995, 91.972)  # 用于测试\ntdat <- 1:length(ydat)  # 用于测试\n\
  weeddata <- data.frame(y = ydat, t = tdat)\nrequire(nlmrt)\nrequire(minpack.lm)\n\
  hobmod <- \"y∼100*b1/(1+10*b2*exp(-0.1*b3*t))\"\nst <- c(b1 = 1, b2 = 1, b3 = 1)\n\
  low <- c(-Inf, -Inf, -Inf)\nup <- c(2, 2, 2)\ncat(\"try nlxb\\n\")\n## try nlxb\n\
  anlxb2 <- nlxb(hobmod, st, data = weeddata, lower = low, upper = up)\nanlxb2\n##\
  \ nlmrt class object: x\n## residual sumsquares =  839.73  on  12 observations\n\
  ##     after  7    Jacobian and  8 function evaluations\n##   name       coeff \
  \      SE      tstat     pval      gradient    JSingval\n## b1                2U\
  \        NA        NA        NA           0       60.46\n## b2          1.78636\
  \         NA        NA        NA  -3.637e-05           0\n## b3                2U\
  \        NA        NA        NA           0           0\ntry(anls2p <- nls(hobmod,\
  \ st, data = weeddata, lower = low, upper = up,\n    algorithm = \"port\"))\nsummary(anls2p)\n\
  ##\n## Formula: y ∼ 100 * b1/(1 + 10 * b2 * exp(-0.1 * b3 * t))\n##\n## Parameters:\n\
  ##    Estimate Std. Error t value Pr(>|t|)\n## b1     2.00       3.96    0.50  \
  \   0.63\n## b2     1.79       3.08    0.58     0.58\n## b3     2.00       1.21\
  \    1.66     0.13\n##\n## Residual standard error: 9.66 on 9 degrees of freedom\n\
  ##\n## Algorithm \"port\", convergence message: relative convergence (4)\nanls2p$m$deviance()\n\
  ## [1] 839.73\naLM2 <- nlsLM(hobmod, st, data = weeddata, lower = low, upper = up)\n\
  summary(aLM2)\n##\n## Formula: y ∼ 100 * b1/(1 + 10 * b2 * exp(-0.1 * b3 * t))\n\
  ##\n## Parameters:\n##    Estimate Std. Error t value Pr(>|t|)\n## b1     2.00 \
  \      5.12    0.39     0.71\n## b2     2.00       4.49    0.44     0.67\n## b3\
  \     2.00       1.41    1.42     0.19\n##\n## Residual standard error: 10.5 on\
  \ 9 degrees of freedom\n##\n## Number of iterations to convergence: 2\n## Achieved\
  \ convergence tolerance: 1.49e-08\naLM2$m$deviance()\n## [1] 987.58\n```\n\n## 6.5\
  \ 非线性最小二乘法的某些辅助工具\n\n由于非线性最小二乘问题的重要性和通用性，存在许多附加工具。在这里我们只考虑其中的一部分。\n\n### 6.5.1 起始值与自启动问题\n\
  \n请注意，我们讨论的所有方法都假设用户以某种方式提供了一些数据，而且大多数方法还要求对模型参数（系数）的值提供一些初步估计值。\n\n`nlxb()` 总是需要一个参数的\
  \ `start` 向量。`nls()` 包含一项规定，如果如果没有提供，则尝试将所有参数的起始值设置为 1。虽然我考虑过修改 `nlxb()` 这样做，并且我自己也经常使用这样的起始向量，但我认为它应该不于提供这样的默认值。\n\
  \n良好的起始向量确实有助于节省精力并获得更好的解。对于 `nls()`，有许多自启动模型（self-starting models）。特别是 `SSlogis`\
  \ 模型提供了一种三参数逻辑的形式，我们之前曾用它来对 Hobbs 数据进行建模。我们在第 16 章中探索这种重参数化，那里有模型的详细信息，但展示如何使用 R\
  \ 中的这个工具是有用的。\n\n```\n## 将 weeddata 放入此处以防万。可能需要重置工作空间。\nanlss2 <- nls(y ∼ SSlogis(t,\
  \ p1, p2, p3), data = weeddata)\nsummary(anlss2)\n##\n## Formula: y ∼ SSlogis(t,\
  \ p1, p2, p3)\n##\n## Parameters:\n##    Estimate Std. Error t value Pr(>|t|)\n\
  ## p1     196.13     0.069    284     2e-16\n## p2     0.3346     0.057     5.87e-08\n\
  ## p3     3.1891     0.058     54.9     2e-16\n```\n（注：原文此处格式混乱，已根据标准 R 输出进行了清理）。\n\
  \n注意平方和是残差乘以自由度。\n\n### 6.5.2 将表达式转换为平方和\n\n有时我们希望使用 R 函数来计算残差、雅可比或平方和函数，以便使用 `optim()`\
  \ 等工具。见 6.6。\n\n我们当然可以编写此类函数，但 `nlmrt` 和其他工具提供了这种方法，例如：\n\n* `model2ssfun()` 创建平方和函数；\n\
  * `model2resfun()` 创建计算残差函数；\n* `model2jacfun()` 创建雅可比函数；\n* `model2grfun()` 创建梯度函数。\n\
  \n这些函数需要 `formula` 以及一个典型的起始向量。\n\n还有两个工具可以使用残差和雅可比函数并计算平方和和梯度：\n\n* `modss()` 通过计算残差并形成乘积来计算平方和；\n\
  * `modgr()` 从雅可比计算梯度。\n\n这两个函数在语法上需要残差和雅可比函数。\n\n### 6.5.3 非线性回归的帮助\n\n本书主要关于非线性优化的车辆引擎，但许多人更关注非线性建模汽车的车身和功能。幸运的是，关于这个主题有一些参考著作，其中一些是针对\
  \ R 用户的。特别是 Ritz 和 Streibig (2008) 很有帮助。Huet 等人 (1996) 也有一些很好的例子，但使用的软件不是 R 的流。旧书籍有很多有用材料，但必须将其思想转换为\
  \ R 语境。这些 Bates 和 Watts (1988)、Seber 和 Wild (1989)、Nash 和 Walker-Smith (1987)、Ratkowsky\
  \ (1983) 以及 Ross (1990)。\n\n## 6.6 最小化计算平方的 R 函数\n\n`nlmrt` 包和 `minpack.lm` 包包含了以函数而非表达式表示的平方残差最小化工具。它们都使用基于马夸特的方法来解决非线性最小二乘问题。我们已经见过\
  \ `nlxb()` 和 `nlsLM()`。然而，`minpack.lm` 中的 `nls.lm` 和 `nlmrt` 中的 `nlfb` 都设计用于处理一个在给定参数集计算残差向量的函数，并（可选地）配合一个计算雅可比矩阵的函数。\n\
  \n\n\n\n\n# 加权非线性回归\n\n```r\nTreated <- as.data.frame(Puromycin[Puromycin$state\
  \ == \"treated\",\n    ])\nweighted.MM <- function(resp, conc, Vm, K) {\n    ##\
  \ 目的：与白书第 451 页完全一致 -- nls() 的右侧\n    ## 加权的 Michaelis-Menten 模型\n    ## - - - -\
  \ - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -\
  \ - - - - - - - - - - - -\n    ## 参数: 'y', 'x' 以及两个参数（参见书籍）\n    ## - - - - - -\
  \ - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -\
  \ - - - - - - - - - -\n    ## 作者: Martin Maechler, 日期: 2001 年 3 月 23 日\n    pred\
  \ <- (Vm * conc)/(K + conc)\n    (resp - pred)/sqrt(pred)\n}\nwtMM <- function(x,\
  \ resp, conc) {\n    # 为 nlfb() 重新定义\n    Vm <- x[1]\n    K <- x[2]\n    res <-\
  \ weighted.MM(resp, conc, Vm, K)\n}\nstart <- list(Vm = 200, K = 0.1)\nPur.wt <-\
  \ nls(∼weighted.MM(rate, conc, Vm, K), data = Treated,\n    start)\nprint(summary(Pur.wt))\n\
  ##\n## 公式: 0 ∼ weighted.MM(rate, conc, Vm, K)\n##\n## 参数:\n##    Estimate Std. Error\
  \ t value Pr(>|t|)\n## Vm 2.07e+02   9.22e+00   22.42  7.0e-10 ***\n## K  5.46e-02\
  \   7.98e-03    6.84  4.5e-05 ***\n## - - -\n## 显著性代码:  0 '***' 0.001 '**' 0.01\
  \ '*' 0.05 '.' 0.1 ' ' 1\n##\n## 残差标准误: 1.21，自由度为 10\n##\n## 收敛的迭代次数: 5\n## 达到的收敛容差:\
  \ 3.83e-06\nrequire(nlmrt)\nanlf <- nlfb(start, resfn = wtMM, jacfn = NULL, trace\
  \ = FALSE,\n    conc = Treated$conc, resp = Treated$rate)\nanlf\n## nlmrt 类对象: x\n\
  ## 残差平方和 =  14.597  基于 12 个观测值\n##     在 6 次 Jacobian 计算和 7 次函数评估后\n##   name  \
  \    coeff        SE      tstat      pval      gradient   JSingval\n## Vm      \
  \   206.835       9.225     22.42  7.003e-10  -9.708e-11      230.7\n## K      \
  \  0.0546112    0.00797     6.845  4.488e-05  -7.255e-09      131\n```\n\n## 6.7\
  \ 选择方法\n\n我们已经看到，在 R 中求解非线性最小二乘问题通常有两种方法：要么通过一个建模 `expression`（表达式），要么通过一个或多个计算残差及相关数量的\
  \ `functions`（函数）。这些方法的“感觉”非常不同。当我们处理残差函数时，通常会考虑它们的导数——雅可比矩阵；而基于表达式的工具则尝试自动生成此类信息。在任务中，正如我们在接下来的示例所示，`nls()`\
  \ 比 `nlxb()` 更多功能。相比之下，当采用函数方法时，我们在定义残差方面具有更大的灵活性。我们将用于说明方法差异的问题称为“双直线”问题。在这里，我们希望使用在某一点相交的直线模型对数据进行建模（参见图\
  \ 6.5）。这个问题在 20 世纪 70 年代引起加拿大农业部一位同事的兴趣。参见 Nash and Price (1979)。对于本示例，我们将生成一些数据。\n\
  \n```r\nset.seed(123)\nx <- 1:40\nxint <- 20.5 * rep(1, length(x))\nsla <- 0.5\n\
  slb <- -0.5\nyint <- 30\nidx <- which(x <= xint)\nymod <- yint + (x - xint) * slb\n\
  ymod[idx] <- yint + (x[idx] - xint) * sla\nydata <- ymod + rnorm(length(x), 0, 2)\n\
  plot(x, ymod, type = \"l\", ylim = c(0, 40), ylab = \"y\")\npoints(x, ydata)\ntitle(main\
  \ = \"straight lines data\")\ntitle(sub = \"Lines are used to generate data\")\n\
  ```\n\n![c06f005](img/c06f005.jpg)\n\n如果我们稍微留心定义建模表达式并选择初始值，就可以用 `nls()` 非常漂亮地对这些数据进行建模。注意我们应该省略\
  \ `start`，但在这里似乎不起通。使用一组粗略的参数也不行。然而，非常粗的选择可以。\n\n```r\ntslexp <- \"y ∼ (yint + (x-xint)*slb)*(x>=\
  \ xint) + (yint + (x-xint)*sla)*(x < xint)\"\nmydf <- data.frame(x = x, y = ydata)\n\
  mnls <- try(nls(tslexp, trace = FALSE, data = mydf))\nstrwrap(mnls)\n## [1] \"Error\
  \ in getInitial.default(func, data =\"\n## [2] \"as.list(match.call(func)) : no\
  \ 'getInitial' method\"\n## [3] \"found for 'function' objects\"\nmystart <- c(xint\
  \ = 1, yint = 1, sla = 1, slb = 1)\nmnls <- try(nls(tslexp, start = mystart, trace\
  \ = FALSE, data = mydf))\nstrwrap(mnls)\n## [1] \"Error in nlsModel(formula, mf,\
  \ start) : singular\"\n## [2] \"gradient matrix at initial estimates\"\nmyst2 <-\
  \ c(xint = 15, yint = 25, sla = 1, slb = -1)\nmnls2 <- try(nls(tslexp, start = myst2,\
  \ trace = FALSE, data = mydf))\nsummary(mnls2)\n##\n## 公式: y ∼ (yint + (x - xint)\
  \ * slb) * (x >= xint) + (yint + (x - xint) *\n##     sla) * (x < xint)\n##\n##\
  \ 参数:\n##      Estimate Std. Error t value Pr(>|t|)\n## xint  19.9341     1.5623\
  \   12.76  6.4e-15 ***\n## yint  29.4904     0.6922   42.61  < 2e-16 ***\n## sla\
  \    0.4617     0.0915    5.05  1.3e-05 ***\n## slb   -0.4276     0.0787   -5.43\
  \  4.0e-06 ***\n## - - -\n## 显著性代码:  0 '***' 0.001 '**' 0.01 '*' 0.05 '.' 0.1 '\
  \ ' 1\n##\n## 残差标准误: 2.18，自由度为 36\n##\n## 收敛的迭代次数: 5\n## 达到的收敛容差: 8.05e-09\nmnls2$m$deviance()\n\
  ## [1] 171.62\n```\n\n\n\n\n\n```r\nmyres <- model2resfun(tslexp, mystart)\n```\n\
  \n## 现在检查计算结果\n\n```r\ntres <- myres(myst2, x = mydf$x, y = mydf$y)\ntres\n# [1]\
  \  -7.85402  -6.18029 -10.22992  -7.97355  -7.47842\n# [6] -10.14639  -6.34569 \
  \ -7.05972  -7.98057  -5.55515\n# [11]  -2.36927  -5.91993  -1.74969  -1.90661 \
  \ -0.60365\n# [16]  -4.57540  -6.47660  -5.84212  -6.91754 -10.38309\n# [21] -10.74823\
  \  -7.26064 -14.16750 -11.29679 -13.85938\n# [26] -12.55585 -12.68729 -14.22140\
  \ -12.35207 -15.71322\n# [31] -13.14478 -13.50182 -21.21353 -16.25285 -21.17923\n\
  # [36] -20.28866 -19.61445 -19.45144 -14.75980 -24.25293\n```\n\n## 但雅可比矩阵（jacobian）计算失败了\n\
  \n```r\njactry <- try(myjac <- model2jacfun(tslexp, mystart))\nstrwrap(jactry)\n\
  # [1] \"Error in deriv.default(parse(text = resexp), pnames)\"\n# [2] \": Function\
  \ ''<'' is not in the derivatives table\"\n```\n\n## 尝试在不提供雅可比函数（jacfn）的情况下使用 nlfb。\n\
  \n```r\nmnlfb <- try(nlfb(mystart, resfn = myres, trace = FALSE, x = mydf$x,\n \
  \   y = mydf$y))\nmnlfb\n# nlmrt class object: x\n# residual sumsquares =  434.73\
  \  on  40 observations\n#     after  4    Jacobian and  5 function evaluations\n\
  #   name       coeff       SE      tstat     pval      gradient    JSingval\n# xint\
  \       -10.4204         NA        NA        NA   9.993e-09       208.8\n# yint\
  \        25.1081         NA        NA        NA   7.067e-10       2.211\n# sla \
  \              1         NA        NA        NA           0    7.68e-09\n# slb \
  \    -0.00182172         NA        NA        NA   3.604e-08   5.527e-23\n```\n\n\
  ## 尝试使用更好的初始值（better start）\n\n```r\nmnlfb2 <- try(nlfb(myst2, resfn = myres, trace\
  \ = FALSE, x = mydf$x,\n    y = mydf$y))\nmnlfb2\n# nlmrt class object: x\n# residual\
  \ sumsquares =  171.62  on  40 observations\n#     after  6    Jacobian and  7 function\
  \ evaluations\n#   name       coeff        SE      tstat      pval      gradient\
  \   JSingval\n# xint        19.9341       1.562     12.76  6.217e-15  -2.978e-13\
  \         54\n# yint        29.4904      0.6922     42.61          0   6.917e-12\
  \      49.62\n# sla        0.461741     0.09145     5.049  1.294e-05   3.462e-11\
  \      3.148\n# slb       -0.427626     0.07868    -5.435   3.96e-06  -3.232e-11\
  \      1.395\n```\n\n它也可以通过 `mnlfb2j<-try(nlfb(myst2, resfn=myres, jacfn=NULL, trace=FALSE,\
  \ x=mydf$x, y=mydf$y))` 运行，或者使用包 `pracma` 中的中的函数 `lsqnonlin`（但没有很好的摘要输出！）。\n\n```r\n\
  require(pracma)\nalsqn <- lsqnonlin(myres, x0 = myst2, x = mydf$x, y = mydf$y)\n\
  print(alsqn$ssq)\n# [1] 171.62\nprint(alsqn$x)\n#     xint     yint      sla   \
  \   slb\n# 19.9341 29.49038  0.46174 -0.42763\n```\n\n我们还可以证明 `minpack.lm` 可以使用基于表达式的\
  \ `nls()` 或基于函数的 `nls()` 来解决这个问题。也可以将该问题视为一个一维最小化问题，其中我们选择 `c06-math-0010` 作为两条直线的交点，并对该分界线的左右两侧分别计算线性模型，其目标函数是两个平方和。这种方法（尽管“大多数情况下”有效）的缺陷在于，有时这两条线并不在所选的\
  \ `c06-math-0011` 附近相交。在这种情况下，表面的平方和太低。这是许多情况之一，对线性建模进行相对简单的改变就会产生一个在某些方面是非线性的问题。受约束线性问题（例如目前的或更直的直线），以及\
  \ Nash (1979, p. 184) 在第 13 章处理的内容，可以使用非线性二乘法来处理。\n\n## 6.8 可分离平方和\n\n在许多情况下，我们遇到需要解决非线性二乘法的问题，但拟合模型有多个参数，或者可以重新组织。我们之前已经遇到过这种情况。一个经典的例子是具有不同半期的放射性元素混合物随时间的衰减。这里的\
  \ `c06-math-0012` 是来自性的总和并随时间衰减，由变量 `c06-math-0013` 给出。\n\n```r\nrequire(NISTnls)\n\
  L1 <- Lanczos1  # 数据，但 y 有两位小数\nL[, \"y\"] <- round(L1[, \"y\"], 2)\nL1\n#     \
  \  y    x\n# 1  2.51 0.00\n# 2  2.04 0.05\n# 3  1.67 0.10\n# 4  1.37 0.15\n# 5 \
  \ 1.12 0.20\n# 6  0.93 0.25\n# 7  0.77 0.30\n# 8  0.64 0.35\n# 9  0.53 0.40\n# 10\
  \ 0.45 0.45\n# 11 0.38 0.50\n# 12 0.32 0.55\n# 13 0.27 0.60\n# 14 0.23 0.65\n# 15\
  \ 0.20 0.70\n# 16 0.17 0.75\n# 17 0.15 0.80\n# 18 0.13 0.85\n# 19 0.11 0.90\n# 20\
  \ 0.10 0.95\n# 21 0.09 1.00\n# 22 0.08 1.05\n# 23 0.07 1.10\n# 24 0.06 1.15\n```\n\
  \n很容易写出一个用于残差的函数（这里是“模型-数据”形式）。雅可比函数也同样容易编写。我们还设置了一些初始向量，并提供了参数名称。这对于基于函数的方法来说并非必需的。\n\
  \n\n\n\n\n```\ntnls1 <- try(nls(lancexp, start = bb1, data = Lanczos1, trace = FALSE))\n\
  strwrap(tnls1)\n## [1] \"Error in numericDeriv(form[[3L]], names(ind), env) :\"\n\
