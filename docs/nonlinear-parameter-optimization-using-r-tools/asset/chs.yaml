  ## [1] 5.10063e-03 4.82318e-02 7.07952e+02\nhu <- jacobian(hobbs.g, tpar)\neigen(hu)$values\n\
  ## [1] 8.54892e+05 1.85137e+01 2.90094e-06\n```\n\n## 16.8 缩放策略\n\n从上面的示例中，让我们提炼一些关于如何在非线性模型中处理缩放的想法。\n\
  \n首先，如果你的工作是探索性的，并且你是交互式工作的，那么你可能不需要在缩放上花费大量精力。在这种情况下，我倾向于以呈现给你的形式尝试计算，但要留意明显的尺度差异。如果很容易调整计算（例如缩放后的\
  \ Hobbs 形式与未缩放的形式相比），那么这似乎是值得做的。\n\n对于将由他人运行和/或自动化到工具中的脚本，由于进行有意义的干预的机会有限，则需要更高水平的审查。这时需要安排参数处于合理的尺度范围内，并且所有参数都具有相当相似的数量级。初始值应该考虑它们与底层系统真实情况的一致性。我们在处理\
  \ Hobbs 问题时做到了这一点，考虑到 `A*[sym]` 参数不应小于建模变量的最大值。\n\n正如我以后在其他地方将说明的那样，通常不需要非常准确的初始值，但非常荒谬或懒惰的选择会自找苦吃。通常，一些非常简单的规则就可以产生良好的起始值。我建议对参数设置松散的边界，以防止它们远离荒谬的值。转换是有价值的，但可能会耗时且容易出错。然而，对于必须为正数的参数，我建议使用\
  \ `![c16-math-0045](img/c16-math-0045.png)` 作为工作参数。假设我们希望渐近线 `Asym` 在模型函数内部始终为正值。那么将选择\
  \ `![c16-math-0046](img/c16-math-0046.png)` 作为工作参数，并在计算残差（对于非线性最小二乘法）的中心函数早期我们得到\n\
  \n```\nAsym <- exp(Asyml)\n```\n\n`Asym` 现在始终为正，但我们没有单独实施边界约束。\n\n在获得结果后，我认为几乎总是值得检查\
  \ KKT 条件的。这在计算上可能很贵，但使用错误的值对我们的金钱、努力和声誉造成的成本要直接得多。当然，在运行 KKT 计算之前，检查所使用的优化器是否返回了满意的终止代码是一个非常好的主意。我多次看到用户发送“你的程序运行不正常”的消息，而他们根本没有注意到\
  \ `conv` 或类似命名的返回代码正在告诉他们结果可能是错误的。\n\n## 参考文献\n\n1.  Karush W 1939 Minima of functions\
  \ of several variables with inequalities as side constraints. Master's thesis.\n\
  2.  Kuhn HW and Tucker AW 1951 Nonlinear programming. Proceedings of 2nd Symposium,\
  \ pp. 481–492, Berkeley, USA.\n\n## 17. 整数优化\n\n本章探讨我们如何\n\n*   找到解决方案\n*   检查它是否满意\n\
  \n在本章中，我们只讨论最小化问题。这是因为我们假设已转换为最小化问题。\n\n### 17.1 特定要求\n\n正如我们之前提到的，如果一个或多个参数必须遵守某些约束（例如正数），必须告知软件。因此，本节的建议是\n\
  \n*   为软件写下每个要求；\n*   给定尝试解，检查是否符合要求；\n*   根据需要，\n\n### 17.1.1 少数整数参数\n\n对于只有两三个整数参数的情况，我会创建一个循环或网格，并对每个整数值求解优化。承认，这是一个非常粗糙的方法，但整数优化是一个充满困难的领域。让我们以经典的\
  \ Rosenbrock 函数为例。\n\n```\nfr <- function(x) {\n    ## Rosenbrock 函数\n    x1 <-\
  \ x[1]\n    x2 <- x[2]\n    value <- 100 * (x2 - x1)² + (1 - x1)²\n}\nx1r <- seq(-10,\
  \ 10, 1)\nx2r <- x1r\nfrbest <- 1e+300\nxbest <- rep(NA, 2)\nfor (x1 in x1r) {\n\
  \    for (x2 in x2r) {\n        fval <- fr(c(x1, x2))\n        if (fval < frbest)\
  \ {\n            xbest <- c(x1, x2)\n            frbest <- fval\n        }\n   \
  \ }\n}\n```\n\n这种方法也适用于需要决定哪个活动序列最佳的情况，通过生成可能的序列并遍历它们。显然，这通常不是一个好方法。我不会推荐它，例如对于\
  \ Michael Trick 执行的调度优化类型（参见示例 [`mat.tepper.cmu.edu/trick/`](http://mat.tepper.cmu.edu/trick/)\
  \ ）。然而，当可以使用像上面简单的结构来执行本质上的穷举搜索时，可能比学习如何设置和使用更复杂的工具要省力。\n\n## 17.2 迭代方法的初始值\n\n\
  非线性优化或最小二乘迭代方法的初始值是几乎所有此类软件的共同问题。初始值的选择通常取决于计算目的。\n\n\n\n\n从测试解决方案的角度来看，初始值似乎是一个不恰当的话题。然而，在迭代方法中，不仅要考虑方法产生的参数，还要考虑该方法如果使用了迭代过程，它是从哪里开始的，这是很有用的。此外，如果终点距离一个认为是合理的起点非常远，我们应该思考发生了什么。如果我们可以将其视作一种测试，那么它就是一种关于与我们预期结果的一致性测试。\n\
  \n我们使用的初始参数来自各种来源：\n\n*   对于许多测试问题，存在众为人知的初始值集合。因此，对于 Rosenbrock 测试函数（Rosenbrock,\
  \ 1960），起点设在 `![c17-math-0001](img/c17-math-0001.png)`。\n\n*   对于某些问题，例如带有 `selfStart()`\
  \ 模块的 `nls()` 问题，存在满足某些所谓“合理”条件的初始值。注意 `selfStart` 中的大小写字母。\n\n*   对于用户具有一定基础经验的问题，很可能对参数提供相当不错的猜想。\n\
  \n*   如果参数有合理的边界，那么某些选择（如区间的中点）可能效果良好。对于正参数，上边界的平方根可能是更好的选择（即边界的几何平均值）。\n\n*   在可能的情况下，我建议初始值**不要**在边界上。某些方法（例如\
  \ `dfoptim` 中的 `nmkb()`）不能在参数位于边界时被调用。\n\n*   对于那些众所周知从实际上任何起点都能可靠求解的问题，将每个初始值设为\
  \ 1 并不罕见。事实上，这被 `nls()` 以及其他程序用作默认值，我自己有时也使用过它。\n\n在许多情况下，非常粗略的近似就足以确定参数的尺度，常常识判断可以提供松散的边界。如果可以对模型进行粗略线性化（例如进行线性回归），则可以获得更好的初始值。`SSlogis()`\
  \ 工具的初始值使用了这种想法的变体（参见第 6.5.1 节和 16.5 节）。注意，可以通过 R 命令行输入 `SSlogis` 来显示代码以查看其功能。\n\
  \n## 17.3 KKT 条件\n\n### 17.3.1 无约束问题\n\n对于具有连续梯度的函数的无约束最小化，解在每个局部最小值处都必须具有零梯度（Karush,\
  \ 1939; Kuhn and Tucker, 1951）。这是一个必要条件，但由于局部极大值和鞍点也会产生零梯度，因此它不充分。我们称此为一阶 KKT (Karush–Kuhn–Tucker)\
  \ 条件。\n\n我们还希望目标函数在拟议最小值“附近”的每个点更高，以便函数在局部是凸的。在 [`shreevatsa.wordpress.com/2009/03/17/convex-and-concave/`](http://shreevatsa.wordpress.com/2009/03/17/convex-and-concave/)\
  \ 有一个很好的助记可以帮助记住这一点。如果二阶导数正定的，则函数是局部凸的。\n\n### 17.3.2 约束问题\n\n约束问题的优化条件在指定和计算上要求更高。Gill\
  \ 等人（1981, 第 3 章）提供了一个相当全面的解决方案，但对于大多数 R 用户来说，我认为这些内容并不容易理解。\n\n## 17.4 搜索测试\n\n\
  遵循检查拟议解附近点的思路，我发现对于许多问题来说，在拟议或试验的最小值周围进行简单的轴向搜索是有用的。这里我们只考虑最小化问题。\n\n\n\n\n我常用的搜索方法是轴向搜索（axial\
  \ search），即在每个参数方向上尝试“向前”或“向后”移动一小步并重新评估目标函数。这种方法的 BASIC 代码出现在 Nash 和 Walker-Smith\
  \ (1987) 中。R 语言也有一个版本，位于 R-forge 上 `optimizer` 项目包中的 `optextras` 包里（[`r-forge.r-project.org/R/?group_id=395`](https://r-forge.r-project.org/R/?group_id=395)）。该版本能够识别边界和掩码约束。然而，它无法评估更通用的约束，需要对其对其进行修改。\n\
  \n实现轴向搜索的目的之一是重启像 Nelder–Mead 这样的直接搜索算法。当然，它并不是万无一失的。例如，如果一个函数在假设最小值的东北和东南方向之间有一个鞍点，且在东北和西南方向上下降，那么可能会发现北、南、东、西四个轴向在我们迷雾笼的表面上都能得到更高的值。\n\
  \n## 参考文献\n\n1. Gill PE, Murray W, and Wright MH 1981 *Practical Optimization*.\
  \ Academic Press, London and New York.\n2. Karush W 1939 Minima of functions of\
  \ several variables with inequalities as side constraints. Master's thesis, M.Sc.\
  \ Dissertation, Department of Mathematics, University of Chicago Chicago, IL.\n\
  3. Kuhn HW and Tucker AW 1951 Nonlinear programming. Proceedings of 2nd Berkeley\
  \ Symposium, pp. 481–492, Berkeley, USA.\n4. Nash JC and Walker-Smith M 1987 *Nonlinear\
  \ Parameter Estimation: An Integrated System in BASIC*. Marcel Dekker, New York.\
  \ 参阅 [`www.nashinfo.com/nlpe.htm`](http://www.nashinfo.com/nlpe.htm) 获取获取扩展的可下载版本。\n\
  5. Rosenbrock HH 1960 An automatic method for finding the greatest or least value\
  \ of a function. *The Computer Journal* **3**, 175–184.\n\n# 第 18 章：调优与终止方法\n\n\
  本章介绍提高计算过程的性能。对于大多数计算，我认为没有必要费心测量工作完成的速度有多快。然而，在某些情况下，计算必须执行多次，且执行速度足够慢，导致无法快速获得所需的结果。\n\
  \n## 18.1 定时与性能分析\n\nR 提供了 `system.time()` 函数来对命令计时。特别是，我们通常选择返回向量的第三个元素作为命令执行所需的时间。这里有一个示例，我们测量了生成一组随机均匀分布数所需的时间。\n\
  \n```\nnnum <- 100000L\ncat(\"Time to generate \", nnum, \"  is \")\n## Time to\
  \ generate  100000   is\ntt <- system.time(xx <- runif(nnum))[[3]]\ncat(tt, \"\\\
  n\")\n## 0.005\n```\n\n除了 `system.time` 工具外，R 还提供了一些包来辅助计时。遗憾的是，虽然英文单词“benchmark”（基准）是一个逻辑选择，但“benchmark”和“benchmarking”都指的是用于其他计算的包。`benchmark`\
  \ 是关于统计学习方法的（Eugster and Leisch, 2011; Eugster et al. 2012），虽然它可能具有某些对计时 R 表达式有用的功能，但这些特征有很多，且大多数并不是针对当前任务的。因此，`benchmark`\
  \ 不是我使用的工具之一。同样，包 `Benchmarking` 是关于随机前沿分析（一种经济建模形式）。\n\n两个非常有用的包是 `rbenchmark`\
  \ 和 `microbenchmark`。R 还有一个性能分析工具 `Rprof()`。\n\n### 18.1.1 rbenchmark\n\n在该包（Kusnierczyk,\
  \ 2012）中，`benchmark` 函数是 `system.time` 的封装，允许对一个命令或一组命令的多次重复进行计时。在这里，我们仅展示该工具的最简单用法。注意，我们显式地引用\
  \ `rbenchmark::benchmark()`，以避免与 `Rsolnp` 包产生不幸的名称冲突，该包在用 `knitr` 包处理本书文本时会存在。\n\
  \n```\nnnum <- 100000L\nrequire(\"rbenchmark\")\n## Loading required package: rbenchmark\n\
  cat(\"Time to generate \", nnum, \"  is \")\n## Time to generate  100000   is\n\
  trb <- rbenchmark::benchmark(runif(nnum))\n# print(str(trb))\nprint(trb)\n##   \
  \       test replications elapsed relative user.self sys.self user.child\n## 1 runif(nnum)\
  \          100   0.502        1       0.5    0.004          0\n##   sys.child\n\
  ## 1         0\n```\n\n### 18.1.2 microbenchmark\n\n在这些计时工具中，我发现我用最多这个。它提供了跨重复次数时间分布的五位数汇总。\n\
  \n```\nnnum <- 100000L\nrequire(\"microbenchmark\")\n## Loading required package:\
  \ microbenchmark\ncat(\"Time to generate \", nnum, \"  is \")\n## Time to generate\
  \  100000   is\ntmb <- microbenchmark(xx <- runif(nnum))\nprint(str(tmb))\n## Classes\
  \ 'microbenchmark' and 'data.frame': 100 obs.\n##  $ expr: Factor W:1 \"xx <- runif(nnum)\"\
  \n##  $ time: 4603 4607 4601 46034 45975\nprint(tmb)\n## Unit: milliseconds\n##\
  \               expr     min      median      uq     max\n##               4.5974\
  \ 4.6069 5.1213 5.2774 7.396\n```\n\n`microbenchmark` 还提供了箱线图来绘制结果分布。对于 `microbenchmark`\
  \ 和 `rbenchmark`，可能会执行多次计时，并获取返回对象的 `time` 元素的均值和标准差。18.1.3 校准\n\n比较计时是不容易的。首先，对不同机器进行比较是愚蠢的。其次，我们需要对单个机器进行测量，正如\
  \ Dongarra 等 (2003) 所示，[`www.netlib.org/`](http://www.netlib.org/) 提供了许多示例。在这种情况下，对一个特定的机器进行校准是非常有用的。\n\
  \n```r\n# 准备一个循环函数\n# \n# 这里的 Nash 2013\nbusyloop <- function(k) {\n    for (j in\
  \ 1:k) {\n        x <- exp(j)\n    }\n    x\n}\n# \n# busyvec <- function(k) {\n\
  \    for (j in 1:k) {\n        x <- exp(j)\n    }\n    x\n}\n# \n# require(microbenchmark,\
  \ quietly = TRUE)\n# \n# nlist <- c(1000, 10000, 50000, 1e5, 2e5)\n# \n# mlistl\
  \ <- rep(NA, length(nlist))\n# \n# for (kk in 1:length(nlist)) {\n#     cat(\"number\
  \ of loops =\", nlist[kk], \"\\n\")\n#     cat(\"loop\\n\")\n#     tt <- microbenchmark(busyloop(nlist[kk]))\n\
  #     mlistl[kk] <- mean(tt$time)\n#     sistl[kk] <- sd(tt$time)\n#     cat(\"\
  vec\\n\")\n#     tt <- microbenchmark(busyvec(nlist[kk]))\n#     mlistv[kk] <- mean(tt$time)\n\
  #     sistv[kk] <- sd(tt$time)\n# }\n# \n# # 构建表格\n# \n# restime <- data.frame(n=nlist,\
  \ mlistl=mlistl, sistl=sistl, mlistv=mlistv, sistv=sistv)\n# names(restime) <- c(\"\
  n\", \"mean loop\", \"sd loop\", \"cv loop\", \"mean vec\", \"sd vec\", \"loop/vec\"\
  )\n# \n# # 转换为毫秒\n# \n# restime\n# \n# # 写入文件\n# \n# dput(restime, file='filenamefourmachine.dput')\n\
  ```\n\n```\n##       n mean loop  sd loop   cv loop  mean vec   sd vec   cv vec\
  \ loop/vec\n## 1 1e+3   1.73955 0.227875 0.130996  0.183392 0.073123 0.398724  9.48542\n\
  ## 2 1e+4  17.35379 0.461499 0.0265936  2.019939 2.138447 1.058669  8.59124\n##\
  \ 3 5e+4  87.37063 3.499007 0.0400479  9.592821 2.801119 0.292002  9.10792\n## 4\
  \ 1e+5 175.11408 4.565432 0.0260712 19.563233 5.574316 0.284938  8.95118\n## 5 2e+5\
  \ 350.09785 6.398471 0.0182762 38.632340 7.214505 0.186748  9.06230\n```\n\n\n\n\
  对于这本书，我一直使用一台所谓的“桌面式”计算机（尽管我的是一台塔式机箱，放在地板上），通过在终端窗口中输入 `cat /proc/cpuinfo` 显示，它配备了“AMD\
  \ Phenom(tm) II X6 1090T Processor”，而不是相信购买发票。该处理器具有六核心，运行频率为 800 MHz，采用 64 位指令集。箱内有\
  \ 16 GB RAM，已通过 `cat /proc/meminfo` 确认。然而，所有这些信息与 R 实际使用的机器能力在某种程度上是脱节的。在我称之为 `J6`\
  \ 的示例机器上，R 应该能够访问几乎所有的内存。另一方面，它访问内存的速度取决于主板及其支持处理器和内存的电路，以及操作系统、编译器和 R 层次的软件。当操作系统和计算软件发生变化时，预计性能也会发生变化。这些变化有时会在\
  \ R 的邮件列表中被提到（例如，[http://r.789695.n4.nabble.com/big-speed-difference-in-source-btw-R-2-15-2-and-R-3-0-2-td4679314.html]）。因此，使用一个小而相对快速的程序来校准我们的计时是有用的。\n\
  \n请注意，这些计时是不可重复的。现代计算机正在执行许多任务，这些任务在某种程度上相互干扰。要观察这一点，只需多次运行上面的程序并比较结果即可。你甚至可以保存\
  \ dataframe。注意，这种波动是在我们对每个用例执行 100 次取平均值**之后**，但我经常观察到平均时间存在 2–3% 的差异。\n\n## 18.2\
  \ 性能分析 (Profiling)\n\n性能分析是一种通常非常强大的技术，通过程序的各个组成部分来对其进行计时。其目的是发现计算耗费时间的地方。通常，这并不是一项容易的工作，因为捕捉执行某操作所需的时间本身实际上就需要花费时间，而且在现代机器上，测量间隔可能足够大，以至于我们在完成测量之前就已经完成了计算。\n\
  \n因此，性能分析最好用于我们已经发现的“缓慢”计算。接接的示例展示了如何通过将对 `Rvmmin` 最小化器的调用封装在请求保存配置文件的命令中来实现。然后，我们在显示之前回并对这些数据进行粗略分析。\n\
  \n将以下代码放入文件 `rpcode.R` 将进行性能分析。\n\n```\nrequire(Rvmmin)\nsqs<-function(x) {\n  \
  \ sum( seq_along(x)*(x - 0.5*seq_along(x))²)\n}\nsqsg<-function(x) {\n   ii<-seq_along(x)\n\
  \   g<-2.*ii*(x - 0.5*ii)\n}\nxstrt<-rep(pi,200)\naa<-0.5*seq_along(xstrt)\nans<-Rvmmin(xstrt,\
  \ sqs, gr=sqsg)\n```\n\n我们将编写代码运行它并放入 `doprof.R` 文件中，以调用性能分析器。这种笨拙的方法在这里是必要的，因为似乎无法在\
  \ `knitr` markdown 环境中进行性能分析。\n\n```\ntryit<-Rprof(\"testjohn1.txt\", memory.profiling=TRUE)\n\
  source(\"rpcode.R\", echo=TRUE)\nRprof(NULL)\n```\n\n我们实际上将所有内容整合如下：\n\n```\nsystem(\"\
  Rscript - -vanilla doprof.R\")\nmyprof <- summaryRprof(\"testjohn1.txt\")\nmyprof$by.self\n\
  ##             self.time self.pct total.time total.pct\n## \"%*%\"            0.42\
  \    35.59       0.42     35.59\n## \"*\"              0.24    20.34       0.24\
  \     20.34\n## \"-\"              0.20    16.95       0.20     16.95\n## \"crossprod\"\
  \      0.08     6.78       0.08      6.78\n## \"Rvmminu\"        0.06     5.08 \
  \      1.08     91.53\n## \"+\"              0.04     3.39       0.04      3.39\n\
  ## \"seq\"            0.04     3.39       0.04     3.39\n## \"as.vector\"      0.02\
  \     1.69       0.32     27.12\n## \"func\"           0.02     1.69       0.06\
  \      5.08\n## \"grepl\"          0.02     1.69       0.02      1.69\n## \"objects\"\
  \        0.02     1.69       0.02      1.69\n## \"t\"              0.02     1.69\
  \       0.02      1.69\n```\n\n在这个示例中，可以注意到 `Rvmmin` 中用于执行 BFGS 更新的 `outer()` 函数是总计算时间的相对大大户。我们能做得更好吗？确实可以。\n\
  \n另一个性能分析工具是 Wickham 的 `profr`，它生成的数据结构与 data frame 非常相似。同样，似乎无法在 `knitr` 内部运行它。`profr`\
  \ 有一个绘图方法，以相对有趣的方式展示计时信息，尽管我并没有发现它立即有用。和所有性能分析工具一样，需要投入精力来关注值得注意的代码段。\n\n```\nrequire(profr)\n\
  tryit<-profr(\"rpcode.R\")\ntryit\n```\n\n### 18.2.1 尝试可能的改进\n\n基于前面提到的性能分析，需要对\
  \ `Rvmminu()` 程序中近似海森矩阵的 BFGS 更新进行正确性和性能测试。核心计算通过应用来自搜索方向和梯度信息的向量 `c` 和 `t` 的外积来更新矩阵\
  \ `B`。我们的第一步是使用 R 命令 `dput()` 将示例向量和矩阵保存到 `testc.txt`、`testt.txt` 和 `testB.txt`\
  \ 文件，然后我们在测量中使用它们。\n\n测量使用 `microbenchmark()` 进行。更新的四种变体分别是原始形式（`bfgsout`）、使用简单循环的形式（`bfgsloop`）、矩阵乘法形式（`bfgsmult`），以及最后将中间结果保存在第二个矩阵中的外积变体（`bfgsx`）。最后一种变体付出了存储矩阵的代价，如果优化的参数数量很大，可能会消耗大量的可用内存。\n\
  \n我们还查看加速计算的其他部分，即数量 `D1` 和 `D2` 的计算以及中间向量 `y` 的构建。\n\n\n\n\n\n```\nrequire(microbenchmark)\n\
  # 执行 BFGS 更新的不同方法\nbfgsout <- function(B, t, y, D1, D2) {\n    Bouter <- B - (outer(t,\
  \ y) + outer(y, t) - D2 * outer(t, t))/D1\n}\nbfgsloop <- function(B, t, y, D1,\
  \ D2) {\n    A <- B\n    n <- dim(A)[1]\n    for (i in 1:n) {\n        for (j in\
  \ 1:n) {\n            A[i, j] <- A[i, j] - (t[i] * y[j] + y[i] * t[j] - D2 * t[i]\
  \ * t[j])/D1\n        }\n    }\n    A\n}\nbfgsmult <- function(B, t, y, D1, D2)\
  \ {\n    A <- B\n    A <- A - (t %*% t(y) + y %*% t(t) - D2 * t %*% t(t))/D1\n}\n\
  bfgsx <- function(B, t, y, D1, D2) {\n    # fastest\n    A <- outer(t, y)\n    A\
  \ <- B - (A + t(A) - D2 * outer(t, t))/D1\n}\n# 恢复保存的数据\nc <- dget(file = \"supportdocs/tuning/testc.txt\"\
  )\nt <- dget(file = \"supportdocs/tuning/testt.txt\")\nB <- dget(file = \"supportdocs/tuning/testB.txt\"\
  )\n# ychk<-dget(file='supportdocs/tuning/testy.txt')\ntD1sum <- microbenchmark(D1a\
  \ <- sum(t * c))$time  # 更快？\ntD1crossprod <- microbenchmark(D1c <- as.numeric(crossprod(t,\
  \ c)))$time\n# summary(tD1sum) summary(tD1crossprod)\nmean(tD1crossprod - tD1sum)\n\
  ## [1] 697.22\ncat(\"abs(D1a-D1c)=\", abs(D1a - D1c), \"\\n\")\n## abs(D1a-D1c)=\
  \ 0\nif (D1a <= 0) stop(\"D1 <= 0\")\ntymmult <- microbenchmark(y <- as.vector(B\
  \ %*% c))$time\ntycrossprod <- microbenchmark(ya <- crossprod(B, c))$time  # 更快\n\
  # summary(tymmult) summary(tycrossprod)\nmean(tymmult - tycrossprod)\n## [1] 20977.2\n\
  cat(\"max(abs(y-ya)):\", max(abs(y - ya)), \"\\n\")\n## max(abs(y-ya)): 0\ntd2vmult\
  \ <- microbenchmark(D2a <- as.double(1 + (t(c) %*% y)/D1a))$time\ntd2crossprod <-\
  \ microbenchmark(D2b <- as.double(1 + crossprod (c, y)/D1a))$time  # 更快\ncat(\"\
  abs(D2a-D2b)=\", abs(D2a - D2b), \"\\n\")\n## abs(D2a-D2b)= 0\n# summary(td2vmult)\
  \ summary(td2crossprod)\nmean(td2vmult - td2crossprod)\n## [1] 11249.4\ntouter <-\
  \ microbenchmark(Bouter <- bfgsout(B, t, y, D1a, D2a))$time\ntbloop <- microbenchmark(Bloop\
  \ <- bfgsloop(B, t, y, D1a, D2a))$time\ntbmult <- microbenchmark(Bmult <- bfgsloop(B,\
  \ t, y, D1a, D2a))$time\ntboutsave <- microbenchmark(Boutsave <- bfgsx(B, t, y,\
  \ D1a, D2a))$time  # 更快？\n## summary(touter) summary(tbloop) summary(tbmult) summary(tboutsave)\n\
  dfBup <- data.frame(touter, tbloop, tbmult, tboutsave)\ncolnames(dfBup) <- c(\"\
  outer\", \"loops\", \"matmult\", \"out+save\")\nboxplot(dfBup)\ntitle(\"Comparing\
  \ timings for BFGS update\")\n```\n\n```\n## 检查计算是否等价\nmax(abs(Bloop - Bouter))\n\
  ## [1] 1.38778e-17\nmax(abs(Bmult - Bouter))\n## [1] 1.38778e-17\nmax(abs(Boutsave\
  \ - Bouter))\n## [1] 0\n```\n\n从这些结果来看，在 R 中使用 `outer` 积函数已经是计算近似逆海森矩阵更新的性能上的最佳选择，这对于许多拟牛顿法和变量度量法至关重要。对于计算进入此更新的\
  \ `D1` 量，`sum(t*c)` 机制比使用 `crossprod(t,c)` 稍微好一点。我们还可以通过使用 `crossprod()` 计算中间向量\
  \ `y` 和数量 `D2` 来进行细微的改进。这些改进将渗透到分布式代码中。\n\n![c18f001](img/c18f001.jpg)\n\n图 18.1\n\
