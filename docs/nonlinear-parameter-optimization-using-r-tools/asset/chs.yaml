- "# 使用 R 工具的非线性参数优化\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n本作品是许多具有社区意识的人努力的一部分，并致力于这一努力，他们创建、支持、推广和使用免费开源软件，并慷慨地分享这些理念，如果没有这些理念，R\
  \ 特别将不存在。\n\n# 前言\n\n本书介绍了用于寻找函数参数的工具，这些函数描述了现象或系统，在这些系统中，参数涉及的方式使得无法通过求解线性方程组来确定。此外，本书还涉及如何使用\
  \ R 来实现。\n\nR 是一种计算机语言和函数库，主要用于统计和数学计算。它有一个强大但相当较小的基础系统，拥有丰富的科学计算函数，以及针对特定额外问题和情况的庞大扩展包集合。\n\
  \n在基础工具和扩展工具中，都包含了描述系统或现象的函数“最佳”参数的设施。此类工具用于向数据拟合方程、提高设备性能或寻找从 A 到 B 的最有效路径等。某些此类问题具有特定的结构，我们只需要求解一两组线性方程。而另一些问题——本书的主题——需要迭代方法来近似我们所需的解决方案。通常我们将这些称为非线性参数。后文将给出正式定义，但我们将讨论的工具无论如何都可以应用。\n\
  \n有时问题涉及约束条件以及目标函数。处理约束也是本书的主题。当存在许多约束时，该问题通常被称为`数学规划`（mathematical programming），这是一个取决于目标和约束性质而具有许多子领域的领域。虽然书中包含对\
  \ R 数学规划工具的某些回顾，但这类问题在我的工作中并不突出，因此在这里的探讨深度较浅。这并不意味着该主题应该被忽视，尽管对我来说，并且在某种程度上对 R 来说，数学规划的优先级可能低于带有少量约束的非线性函数最小化。这反映了\
  \ R 在主要统计学群体中的起源。\n\n书中的主题最可能对必须解决参数确定问题的研究人员和从业者感兴趣。在某些情况下，他们将开发专门的工具，例如用于极大似然估计的包，因此这里讨论的工具就像汽车设计师用来准备其特定产品时使用的引擎一样。在其他情况下，工作者将希望直接使用工具。无论何种情况，我的目标都是提供关于哪些可能有效以及通常应该避免哪些内容的建议和提示。\n\
  \n本书也应该对内部使用优化的复合包的深度用户感兴趣。我注意到某些此类包会调用肉眼看到的第一个或最显眼的工具。我认为用户确实应该被提供选择，或者至少被告知使用的是哪种工具。通过这种方式受益最多的人是那些面临大型计算密集型问题的工作者，或者是面临标准方法可能会“失败”——或更可能仅仅是在未找到满意的解决方案之前就终止了的棘手问题的工作者。\n\
  \n因此，我准备本书的目标是提供对工具的理解，以及它们在何处最有用。大多数 R 用户并不是计算专家，而这些专门工具的原理就像一个黑箱。这可能导致误用。伐木工的链锯对于神经外科医生的手术来说是一个糟糕的选择。但像\
  \ R 这样的系统需要针对不同场合提供范围。用户也需要帮助做出选择。\n\n我并希望提供足够的简化示例，既能帮助用户，也能激励开发者。虽然我们在 R 中有很多用于非线性参数确定的工具，但缺乏关于其使用的良好组织的指导，以及如何有效淘汰那些不足的方法。\n\
  \n作为此类工具的开发者，我发现自己多次遇到用户告诉我，他们的同事说我的程序非常好，但“它没用”。这几乎总是是因为使用模式或工具选择不当。理想情况下，我的目标是让软件识别此类误用，但这是一个我在职业生涯中花费了精力解决的巨大挑战。\n\
  \n\n\n\n\n当然，任何书籍都归功于作者以外的其他人。我无法希望对每一位在思想或支持上提供帮助的人给予公正，但以下这些（不分先后顺序）是我认为对本书的写作做出了贡献的人：Mary\
  \ Nash, Ravi Varadhan, Stephen Nash, Hans Werner Borchers, Claudia Beleites, Nathan\
  \ Lemoine, Paul Gilbert, Dirk Eddelbeuttel, John Fox, Ben Bolker, Doug Bates, Kate\
  \ Mullen, Richard Alexander 和 Gabor Grothendieck。\n\nJohn C. Nash\n\n# 第 1 章：优化问题任务及其产生\n\
  \n在引言章节中，我们将探讨将讨论求解工具的问题类。我们还考虑了不同问题类之间以及不同求解方法之间的相互关系。这是非常通用的。除了一些示例外，`R` 与本章并无太大。在这里我们列出待办事项。\n\
  \n## 1.1 通用优化问题\n\n通用的约束优化问题可以述如下：\n\n1. 找到 `x` = ![c01-math-0001](img/c01-math-0001.png)(`x`)\n\
  2. 使得\n3. (`x`)>= `0`\n\n注意 ![c01-math-0002](img/c01-math-0002.png) 是标量函数，但 ![c01-math-0003](img/c01-math-0003.png)\
  \ 是向量。![c01-math-0004](img/c01-math-0004.png) 的值可能存在或不存在`constraints`，这些约束在函数向量\
  \ ![c01-math-0005](img/c01-math-0005.png) 中形式化表示。虽然这些函数是通用的，但许多问题具有得简单的约束，例如我们在下文中讨论的，![c01-math-0006](img/c01-math-0006.png)\
  \ 的值不小于某些下界或不大于某些上界。\n\n我们将问题指定为一个最小化问题，但最大化问题可以通过将目标函数乘以 ![c01-math-0007](img/c01-math-0007.png)\
  \ 来转换为最小化问题。\n\n同样注意，我们要求的是使目标最小化的参数集 `x`，这在本质上意味着全局最小值。然而，优化中的许多（如果不是大多数的话）数值方法只能找到局部最小值，而且相当的问题的情况是可能存在许多局部最小值，甚至可能多于一个全局最小值。也就是说，全局最小值可能出现在多组参数\
  \ `x` 上，并可能出现在某条线或曲面上。\n\n## 1.2 为什么通用问题通常是无趣的\n\n虽然确实存在处理通用优化问题的方法，但在与统计和建模相关的问题优化中，几乎所有的“真实”工作倾向于由更专门的方法完成，这些方法处理的是由于目标函数或约束性质（或缺乏约束）而在某些方面受到限制的问题。事实上，对于许多特定问题，有专门为解决它们而设计的非常专门的软件包。遗憾的是，用户通常必须非常努力才能判断其问题是否实际上符合该专门软件包的设计考虑因素。看似微小的变化——例如参数必须为正数的条件——就可能使该软件包变得失效。另一方面，一个非常通用的工具对于用户来说应用可能非常费琐，因为在某些情况下，目标函数和约束需要大量的程序代码。\n\
  \n在现实世界中，目标函数 ![c01-math-0008](img/c01-math-0008.png) 和约束 ![c01-math-0009](img/c01-math-0009.png)\
  \ 不仅仅是 ![c01-math-0010](img/c01-math-0010.png) 的函数，还取决于数据；事实上，它们可能取决于大量的数据，特别是在涉及大型系统的统计问题中。\n\
  \n为了说明，考虑以下示例，它们虽然“小”，但说明我们将遇到的一些问题。\n\n### Cobb–Douglas 示例\n\nCobb–Douglas 生产函数（Nash\
  \ and Walker-Smith, 1987, p. 375）将商品的生产量 ![c01-math-0011](img/c01-math-0011.png)\
  \ 预测为投入 ![c01-math-0012](img/c01-math-0012.png)（对该变量使用 K 是传统的做法）和所使用的 ![c01-math-0013](img/c01-math-0013.png)\
  \ 的函数，即：\n\n**1.1** ![equation](img/c01-math-0014.png)\n\n处理该问题的传统方法是取对数以得到\n\n\
  **1.2** ![equation](img/c01-math-0015.png)\n\n然而，这两种形式意味着误差分布的不同方式。让我们假设 ![c01-math-0016](img/c01-math-0016.png)\
  \ 是加性的，而 ![c01-math-0017](img/c01-math-0017.png) 是乘性的。如果我们认为 ![c01-math-0018](img/c01-math-0018.png)\
  \ 是常数，那么 ![c01-math-0019](img/c01-math-0019.png) 则不是。\n\n### Hobbs 虫害示例\n\n该问题在\
  \ 1974 年左右当我开发程序时出现在我的桌上。我为 Data General 系统编写了几个变体高斯法。那台早期微型计算机提供非常有限的环境：每秒 10 个字符的打字机带纸读打印机。\n\
  \n问题是由加拿大农业部的 Dave Hobbs 提供的。正如我所说的，观测值 ![c01-math-0024](img/c01-math-0024.png)\
  \ 是 12 个生长周期内的杂草密度。我从未获得观测值的实际单位。这里是数据（见图 1.1）。\n\n```r\n# 绘制数据\ny <- c(5.308, 7.24,\
  \ 9.638, 12.866, 17.069, 23.192, 31.443, 38.558, 50.156,\n    62.948, 75.995, 91.972)\n\
  t <- 1:12\nplot(t, y)\ntitle(main = \"Hobbs' weed infestation data\", font.main\
  \ = 4)\n```\n\n![c01f001](img/c01f001.jpg)\n\n\n\n\n\n我们所说的“非线性”是指什么？这个词显然意味着“不是直线”，许多研究人员将其应用于他们试图估计的模型。然而，对于估计过程而言（这通常涉及最小化损失函数，如平方偏差和，或最大化似然函数），关键问题在于通过求解一组方程来找到结果。\n\
  \n当我们对一个参数是线性的模型最小化平方和时，例如上述柯布-道格拉斯函数的对数形式(1.2)，其中 ![c01-math-0029](img/c01-math-0029.png)、![c01-math-0030](img/c01-math-0030.png)\
  \ 和 ![c01-math-0031](img/c01-math-0031.png) 仅以一次幂出现，我们可以应用标准微积分来得到`normal equations`。这是一组线性方程。然而，当我们想要最小化原始模型（1.1)的平方和时，通常需要从某组初始参数\
  \ ![c01-math-0032](img/c01-math-0032.png)、![c01-math-0033](img/c01-math-0033.png)\
  \ 和 ![c01-math-0034](img/c01-math-0034.png) 使用迭代法。\n\n就本书而言，“非线性”将指的是寻找解的过程，并意味着没有一种方法可以通过一组预定义的线性方程解来找到解。也就是说，虽然我们在寻找书中感兴趣的问题解时使用了大量的线性代数，但我们无法预先指定多少此类子问题。\n\
  \n## 1.4 目标函数属性\n\n目标函数的一些特殊形式会导致专门但相当常见的求解方法。这为我们提供了一个维度或轴，用于分类我们之后考虑的优化方法。\n\n\
  ### 1.4.1 平方和\n\n如果目标函数是平方项之和，我们可以使用求解`nonlinear least squares`（非线性最小二乘）问题的方法。显然，通过最小化残差平方和来估计上述柯布-道格拉斯生产模型属于这类问题。\n\
  \n我们注意到，在对数形式模型的情况下，柯布-道格拉斯问题是线性的。线性二乘问题无处不在，值得注意的是如何求解它，因为某些解决线性问题的方法可以被视为求解一系列线性问题。\n\
  \n### 1.4.2 极小极大近似\n\n有时，模型与“数据”之间偏差的上限是重要的。因此，我们希望找到模型中的一组参数，使得最大偏差最小，从而成为`minimax\
  \ problem`（极小极大问题）。特别是，考虑到对于某些特殊且难以计算的特殊函数可能存在相对简单的近似。这类`approximation problem`对统计工作者来说没有平方和问题那么熟悉。此外，小的残差可能使得某些传统方法（如\
  \ R 函数`nls()`）不适合它们的求解。\n\n### 1.4.3 具有多个极值的问题\n\n可能由于我们大多数人接受的通用数学教育，我们对函数的看法是它们具有“良好”的形状，即只有一个最小值或极大值。现实要严酷得多。函数通常有多个局部极值，而我们的大多数方法——通常基于传统的微积分思想——设计用于高效地寻找局部最小值或极大值。如果我们想要找到正确的甚至是可以接受的解，知道可能存在多个局部、甚至可能存在多个全局解是非常重要的。\n\
  \n### 1.4.4 只能进行不精确计算的目标\n\n有时目标函数不是精确确定的。在一次情况下，我考虑过通过测量完成赛道循环所需的时间来“计算”目标，从而优化赛车参数，如燃空气比、制动设置等。这显然是随机的。还有其他此类问题，通过蒙特卡洛方法估计积分。例如，请参见[`en.wikipedia.org/wiki/Monte_Carlo_integration`](http://en.wikipedia.org/wiki/Monte_Carlo_integration)\
  \ 获取概述。\n\n## 1.5 约束类型\n\n优化问题及其求解方法的另一种分类方法是通过施加在参数上的约束。\n\n最明显的情况是`unconstrained`（无约束）——没有约束。说实话，现实问题总有约束，但许多问题可以在不需要显式包含它们的情况下最容易且高效地解决。\n\
  \n其次简单的是`bounds`（边界）或`box constraints`（箱约束）。在这里我们对参数施加下限和上限。如果我们在向量 `lo` 中有下界在向量\
  \ `up` 中有上限，那么参数就在由不等式定义的 ![c01-math-0035](img/c01-math-0035.png)维箱内。\n\n**1.7**\
  \ ![equation](img/c01-math-0036.png)\n\n`Linear`（线性）约束的形式为\n\n**1.8** ![equation](img/c01-math-0037.png)\n\
  \n或\n\n**1.9** ![equation](img/c01-math-0038.png)\n\n如果所有约束都是线性的（包括边界），可能会专门的方法。特别是，如果目标函数对参数也是线性的\
  \ ![c01-math-0039](img/c01-math-0039.png)，我们就有`linear programming`（线性规划）的特殊情况。对于\
  \ ![c01-math-0040](img/c01-math-0040.png) 是二次的且带有线性约束的目标，我们得到`quadratic programming`（二次规划）。“programming”（规划）一词的历史用法是遗憾的，但我们将使用它，因为它有大量的文献。据我所知，`nonlinear\
  \ programming`（非线性规划）一词是具有非线性目标和非线性约束的通用优化问题的同义词。\n\n`Equality`（等式）约束可以指定为一组（可能的）非线性函数向量\n\
  \n**1.10** ![equation](img/c01-math-0041.png)\n\n我们可以正式地将每个此类方程替换为两个不等式，从而将函数集 ![c01-math-0042](img/c01-math-0042.png)\
  \ 吸入扩展的 ![c01-math-0043](img/c01-math-0043.png) 函数中，即使这不是我们寻找解时会选择的方法。然而，可的等式约束意味着我们可以根据其他参数求解某些参数。在大多数情况下，我倾向于假设已经找到了这样的解，并且正在处理一个具有等式约束的简化问题。\n\
  \n## 1.6 求解方程组\n\n产生等式约束的方程的求解与求解完整的 ![c01-math-0044](img/c01-math-0044.png)(非线性）方程\
  \ ![c01-math-0045](img/c01-math-0045.png)未知数并不相同。约束方程通常会留下一些待定的参数，通用方法可能难以发现和应用。\n\
  \n对于求解完整的方程组，我们想要求解 ![c01-math-0046](img/c01-math-0046.png)\n\n**1.11** ![equation](img/c01-math-0047.png)\n\
  \n向量 ![c01-math-0048](img/c01-math-0048.png) 不给出 `0`，而是给出一个非零向量 `r`，即“残差”。因此我们可以使用非线性最小二乘法尝试求解。如果我们得到的目标值\n\
  \n**1.12** ![equation](img/c01-math-0049.png) 结果为零，那么我们就找到了一个解。在这里，我将对该解是否唯一的问题处理得非常谨慎，同样认为解的存在性问题通过找到这样一个解来证明。然而，未能找到平方和为零并不保证不存在这样的解。\n\
  \n\n\n\n在第 7 章中，我们将讨论非线性方程。正如我们刚刚注意到的，如果解的残差为零，可以通过非线性最小二法求解。通常被认为是一种糟糕的方法，但我有时发现它是方便的。反之，如果可以找到解并证明它是最优的（最小化时的最小值，极大时的最大值），求解一组梯度方程就可以解决优化和非线性最小二乘问题，而不是鞍点或平坦区域。此外，在存在多个局部最优解的情况下，我们可能需要全局最优解。因此，我通常避免这种优化方法，因为它对\
  \ `solution` 的检查要求过多。\n\n## 1.7 最优条件\n\n在早期阶段，提到“优化”的含义并不是没有解释是有帮助的。可以采取非常纯的数学视角，但这不可避免无法帮助需要为困难问题提供合理答案的科学家、经济学家和工程师。\n\
  \n对于我们来说，最优意味着我们想要找到描述感兴趣系统的函数参数值，使得该函数成为最小值。要找到最大值，我们可以找到该函数负值的最小值。\n\n除了最小值概念外，我们可能有一系列假设，其中许多是未说明的。这些假设产生了约束，其中一些可以被纳入优化方法中，而另一些可能仅仅是“那组参数不感兴趣”。这可能是因为某些数学可能性与实际应用没有关系，例如，一种也会杀死患者的医疗感染解决方案。\n\
  \n书中特别感兴趣将是 `optimality conditions`，有时被称为 `Karush Kuhn Tucker conditions` (Karush,\
  \ 1939; Kuhn and Tucker, 1951)。这些条件本质上说明，除了约束边界外，函数的最小值将零梯度和正定海森矩阵（Hessian）。我们在书中多次回到这些思想。\n\
  \n## 1.8 其他分类\n\n求解方法有时决定了我们处理问题的方式。老格言说“有锤子的人看什么都像钉子”，这与现实太接近了以至于让人感到不安。因为有许多专门的计算方法可以非常高效地解决特定的优化相关问题，人们往往倾向于将问题转化为可以应用这些方法的形式。本书的一个重要方面是提供一些视角，以便用户可以判断何时以及这样做是合理的。\n\
  \n## 参考文献\n\n1. Karush W 1939 *Minima of functions of several variables with inequalities\
  \ as side constraints*. 硕士论文, 芝加哥大学数学系，伊利诺伊州芝加哥。\n\n2. Kuhn HW and Tucker AW 1951\
  \ Nonlinear programming. *Proceedings of 2nd Berkeley Symposium*, pp. 481–492, 伯伯克利，美国。\n\
  \n3. Nash JC and Walker-Smith M 1987 Nonlinear Parameter Estimation: An Integrated\
  \ System in BASIC. Marcel Dekker, 纽约。更多可下载版本请参见 `http://www.nashinfo.com/nlpe.htm`。\n\
  \n# 第 2 章\n\n优化算法——概述\n\n在本章中，我们将查看为了解决第 1 章优化问题而开发的各种方法，然后再深入研究 `R` 用于此类任务的特定工具。同样，`R`\
  \ 处于背景。本章是一个概述，试图为该主题提供一些结构。我建议所有优化初学者至少浏览一下这一章，以对该主题有一个视角。如果你能很好地判断什么方法可能适合你的问题，可能会节省许多小时的苦恼。\n\
  \n## 2.1 使用梯度的方法\n\n如果我们寻找函数 `![c02-math-0001](img/c02-math-0001.png)` 的单个（局部）最小值，可能受约束限制，最明显的方法之一是计算函数的\
