  \ R）中。困难之处在于对分数次方 (1/6) 的近似值仅仅是近似值。对于低利率情况，当我们从一个与 1 不太不同的数字的 (1/6) 次方减去 1 时，答案注会导致数字抵消。然而，R\
  \ 实际上表现得很好。在上述函数 ![c04-math-0032](img/c04-math-0032.png) 上使用 `uniroot` 也是可以的，只要指定的精度足够小，否则我们会得到一个相当糟糕的答案。\n\
  \n解决这个问题的非常好的方法是通过二项式定理，其中 ![c04-math-0033](img/c04-math-0033.png) 的展开（用 ![c04-math-0034](img/c04-math-0034.png)\
  \ 替换 ![c04-math-0035](img/c04-math-0035.png)）为：\n\n**4.11** ![equation](img/c04-math-0036.png)\n\
  \n除了收敛非常快外，该级数展开从 1 开始，我们可以通过解析法将其减去，从而避免数字抵消。以下计算以程序形式展示了这些思路，说明了这三种方法对于这个问题来说都是合理的。\n\
  \n```\nmrate <- function(R) {\n    val <- 0\n    den <- 1\n    fact <- 1/6\n   \
  \ term <- 1\n    rr <- R/200\n    repeat {\n        # main loop\n        term <-\
  \ term * fact * rr/den\n        vallast <- val\n        val <- val + term\n    \
  \    # cat('term =',term,' val now ',val,'\\n')\n        if (val == vallast)\n \
  \           break\n        fact <- (fact - 1)\n        den <- den + 1\n        if\
  \ (den > 1000)\n            stop(\"Too many terms in mrate\")\n    }\n    val *\
  \ 100\n}\nA <- function(I, Rval) {\n    A <- (1 + I/100)⁶ - (1 + R/200)\n}\nRvec\
  \ <- c()\ni.formula <- c()\ni.root <- c()\ni.mrate <- c()\nfor (r2 in 0:18) {\n\
  \    R <- r2/2  # rate per year\n    Rvec <- c(Rvec, R)\n    i.formula <- c(i.formula,\
  \ 100 * ((1 + R/200)^(1/6) - 1))\n    i.root <- c(i.root, uniroot(A, c(0, 20), tol\
  \ = .Machine$double.eps, Rval = R)$root)\n    i.mrate <- c(i.mrate, mrate(R))\n\
  }\ntabR <- data.frame(Rvec, i.mrate, (i.formula - i.mrate), (i.root - i.mrate))\n\
  colnames(tabR) <- c(\"rate\", \"i.mrate\", \"form - mrate\", \"root - mrate\")\n\
  print(tabR)\n##    rate  i.mrate form - mrate root - mrate\n## 1   0.0 0.000000\
