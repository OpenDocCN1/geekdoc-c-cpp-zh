  ```\n\n## 13.2 缩放和问题\n\n一类经常出现的优化问题可以被称为**缩放和**问题。在这种情况下，我们希望最大化或最小化一个目标函数 $f(x)$，其中参数受到某种缩放约束，使得\
  \ $g(x)=0$。目前，让我们考虑一个简单的例子，即：\n\n\n\n![equation](img/c13-math-0021.png)\n\n这是多项式极大似估计问题的一个非常简化版本，由\
  \ Gabor Grothendieck 建议作为此类问题的测试题。解决此问题的一种方法是消除最后一个参数，并对其他 ![c13-math-0022](img/c13-math-0022.png)\
  \ 进行优化，其中 ![c13-math-0023](img/c13-math-0023.png) 是参数的数量。让我们尝试对 ![c13-math-0024](img/c13-math-0024.png)\
  \ 的几个值进行。为了保持输出整洁，我们关闭了一些测试和警告。\n\n```r\nrequire(optimx, quietly = TRUE)\n# 加载一系列优化方法\n\
  pr <- function(y) {\n    -prod(y) * (1 - sum(y))\n}\npr.g <- function(x) {\n   \
  \ g <- -prod(x) * (1 - sum(x))/x + prod(x)\n}\nn <- 2\ncat(\"  n\", \"\\t\", \"\
  \  x1\", \"\\t\\t\\t\", \" 1e5*(x1-1/n)\\n\")\noptions(digits = 6)\nwhile (n <=\
  \ 6) {\n    st <- 1:(n - 1)/(n * n)\n    ctrl <- list(starttests = FALSE, trace\
  \ = 0, dowarn = FALSE)\n    ans <- optimx(st, pr, pr.g, method = \"Rvmmin\", control\
  \ = ctrl)\n    cc <- coef(ans)\n    cat(n, \"\\t\", (1/n), \"\\n\")\n    print(cc)\n\
  \    n <- n + 1\n}\n```\n\n```text\n##   n     x1      1e5*(x1-1/n)\n## 2   0.5\n\
  ##      [,1]\n## [1,] 0.35\n## 3   0.333333\n##              p1       p2\n## Rvmmin\
  \ 0.333333 0.333333\n## 4   0.25\n##            p1    p2     p3\n## Rvmmin 0.0625\
  \ 0.125 0.1875\n## 5   0.2\n##          p1   p2   p3   p4\n## Rvmmin 0.04 0.08 0.12\
  \ 0.16\n## 6   0.166667\n##               p1        p2        p3       p4      \
  \ p5\n## Rvmmin 0.0277778 0.0555556 0.0833333 0.111111 0.138889\n```\n\n“解”正如我们预期的那样，对于所有的\
  \ ![c13-math-0026](img/c13-math-0026.png) 来说是 ![c13-math-0025](img/c13-math-0025.png)。对于非常小的\
  \ ![c13-math-0027](img/c13-math-0027.png)，这种方法运行良好。然而，我们看到随着问题规模的增大，很快就会计算问题。由于参数之和被限制为\
  \ 1，参数的数量级为 ![c13-math-0028](img/c13-math-0028.png)，因此函数的数量级为 ![c13-math-0029](img/c13-math-0029.png)，这在\
  \ R 中大约 ![c13-math-0030](img/c13-math-0030.png) 处就会下溢。实际上，这种情况出现得早得多。\n\n如果我们使用目标函数的对数，可以得到更好的结果。以下计算了大量的参数，我们只显示解析答案以及前五个参数估计。注意，我们切换到了\
  \ `Rcgmin`，它使用了一种适用于大量参数的方法。\n\n```r\nnll <- function(y) {\n    if ((any(y <= 10\
  \ * .Machine$double.xmin)) || (sum(y) > 1 -\n        .Machine$double.eps))\n   \
  \     .Machine$double.xmax else -sum(log(y)) - log(1 - sum(y))\n}\nnll.g <- function(y)\
  \ {\n    -1/y + 1/(1 - sum(y))\n}  # 此时未进行保护\nn <- 1000\ncat(\"  n\", \"\\t\", \"\
  \  x1\", \"\\t\\t\\t\", \" 1e5*(x1-1/n)\\n\")\n##   n     x1      1e5*(x1-1/n)\n\
  options(digits = 6)\nwhile (n <= 10000) {\n    st <- 1:(n - 1)/(n * n)\n    ctrl\
  \ <- list(starttests = FALSE, trace = 0, dowarn = FALSE)\n    ans <- optimx(st,\
  \ nll, nll.g, method = \"Rvmmin\", control = ctrl)\n    cc <- coef(ans)\n    cat(n,\
  \ \"\\t\", (1/n), \"\\n\")\n    print(cc)\n}\n```\n*(注：提示中提供的代码块在第二个循环中逻辑被截断了；我根据提供文本的上下文对格式进行了清理。)*\n\
