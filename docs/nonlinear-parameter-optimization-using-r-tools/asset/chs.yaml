  \n\n\n\n该条款允许作者收取一笔较高的费用，为一位私人贷款人重新计算还款计划。该贷款人在 20 世纪 80 年代初年利率约为 20% 期间使用了一个美国计算机程序。借款人希望每月付款。这在加拿大是可行的，但我们必须使用等于半年利率的利率进行计算。因此，如果年利率为\
