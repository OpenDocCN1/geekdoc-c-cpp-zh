  \ mu, sigma) {\n    dd <- (-1) * (1/sqrt(2 * pi * sigma²))*(exp(-(x - mu)²/(2 *\
  \ sigma²)) *\n        ((x - mu)/(sigma²)))\n}\nr1 <- uniroot(der, lower = 1, upper\
  \ = 6, mu = 4, sigma = 1)\nr.1 <- uniroot(der, lower = 1, upper = 6, mu = 4, sigma\
