  \ for large-scale bound-constrained optimization. *ACM Transactions on Mathematical\
  \ Software* **23**(4), 550–560.\n\n# 第 3 章\n\n软件结构与接口\n\n在介绍了一些属于本书标题所涵盖的问题后，我们现在转而考虑不同的软件结构方法，以尝试寻找这些问题的解决方案。出于讨论的考虑，并且由于我最有经验的一类问题，我们将主要关注在最多简单约束下的函数最小化。在统计学界，许多人称之为\
  \ `optimization`（优化），而工程和经济学领域的人则期望具有更多约束但目标函数可能更简单的模型。由于 `R` 主要针对统计计算，这里的处理方法将倾向于这一方向。\n\
  \n## 3.1 观点\n\n在该领域相当长的职业生涯中，我发现人们对“速度”有着共同的。更准确地说，人们不希望感觉自己正在等待计算完成。如果他们确实发现自己在等待，他们可能会根据计时来对方法进行判断，而这些计时往往少得惊人且执行得糟糕。\n\
  \n在对计算效率有浓厚兴趣的同时，我持有以下观点：\n\n*   知道所给出的答案是“正确”的，或者在结果可能不令人满意时提供指导或信息是非常重要的。例如，可能存在多个解，或者结果可能只是我们在困难情况下所能做出的最佳结果。优化器可以并且会由于由于满意答案以外的原因而停止。尽管我们尽了最大努力，用户函数经常出现错误。对于人类来说，发现并纠正错误答案可能非常非常耗时，而且可能让人感到尴尬。\n\
  \n*   执行提供上述诊断和解释性信息所需的测试和检查将消耗计算时间。因此，用户会发现，例如，运行 `optimx` 包中的优化器（见第 9.1 节）比直接运行它们花费的时间长。这种代价通常并不巨大，尽管当参数数量\
  \ ![c03-math-0001](img/c03-math-0001.png) 很大时，计算海森矩阵（Hessians）所需的时间可能比优化过程还要长。事实上，当没有可用的解析导数或\
  \ ![c03-math-0002](img/c03-math-0002.png) 存在 ![c03-math-0003](img/c03-math-0003.png)\
  \ 时，`optimx` 并不计算海森矩阵和最优性（Karush–Kuhn–Tucker, KKT）测试。同样，实验包 `optplus` 在每次函数评估时提供参数缩放和不可接受参数的检查，但成本高到我我正在重新思考如何更好地提供此类功能。\n\
  \n*   当问题必须非常快且/或非常频繁地解决，以至于 `R` 优化器花费的时间太大时，我认为考虑重新实现特定的计算是值得的。见第 19 章。否则，我觉得相对于用户而言，计算机时间是“廉价”的。\n\
  \n## 3.2 选择问题\n\n虽然本书是关于 `R` 中的优化，但更广泛地说，用户必须决定他们执行计算的系统。在过去的十年里，已经可以在不参考将要使用的硬件或操作系统的情况下决定在“R”中计算。这对于其他主要的计算选择（如\
  \ `Matlab`、`Python` 或 `SAS` 等）在很大程度上也是如此。\n\n然而，一旦决定使用 `R`，就有许多包——在写作时多于 4000 个——使得很难发现每个包的作用，也无法判断它们的特性和质量是否符合我们的需求。这对于优化问题来说尤其尤为困难。许多包针对特定的研究领域。它们可能声称具有极大的性能或功能，但这些能力可能适用于极少数用户群体。\n\
  \n显然，本书的目的之一是为这一丛林提供指导，但尽管我正积极追求 `R` 优化的课题，但我痛苦地意识到，我可能会漏掉某些具有有用功能的包。因此，我选择查看那些可以适应许多问题的通用工具，而不是针对特定问题的工具。\n\
  \n同样值得注意的是，，有许多包包含了自定义构建的优化器，例如 `likelihood` 包（Murphy, 2012）。从像我这样的工具构建者的角度来看，这是遗憾的：\n\
  \n*   要将此类包中的优化器从其周围的基础设施和上下文中抽象出来，通常需要大量工作。\n\n*   包开发者的兴趣和关注点通常在他们工作领域的特定问题上。优化器在那个领域可能构建得很好，但在其他领域使用则存在风险。\n\
  \n*   出于类似的原因，优化器的来源和文档可能不明确。\n\n此外，对于偏好那些完全用 `R` 编写且呈现得尽可能简单和通用的包，我不感到任何歉意。这种关注部分源于某种程度的懒惰——我不喜欢翻阅那些晦涩、不透明且带有特有词汇的文档。然而，我也相信，许多情况下使用非\
  \ `R` 语言编写的程序会导致接口错误，或在非 `R` 代码中留下不适当的控制。此外，确定代码的来源很困难，尽管 `R` 在记录其起源方面做得非常好。\n\n\
  例如，在 `L-BFGS-B` 优化器的情况下，搜索源码包得到了 `lbfgs.c` 程序，其注释为“版本 2.3”。然而，作者原始的网页([http://www.ece.northwestern.edu/~nocedal/lbfgs.html]）只显示版本\
  \ 2.1 (1997) 和 3.0 (2011)。而且，这两个都是 `Fortran` 而不是 `C`。在 `R` 的源码中多处都有注释说代码是使用名为 `f2c`\
  \ 的程序（Feldman et al. 1991）从 `Fortran` 转换为 `C` 的。\n\n我理解选择、转换和接口 `L-BFGS-B` 等复杂程序以供\
  \ `R` 使用的困难。此外，我理解开发者为什么不希望在 `R` 内部重新实现该方法。然而，我发现一旦代码进入 `R`，特别是如果代码保持平实——我经常使用这个词——寻找和修复错误、调整代码适应特定情况以及随着新想法的出现进行改进要容易得多。\n\
  \n## 3.3 软件问题\n\n在尝试解决优化问题时，会出现很多软件问题：\n\n*   向优化器指定目标和约束\n*   向问题定义函数传递外部数据\n*\
  \   掩码（即临时固定）的优化参数\n*   处理不可接受的结果\n*   为函数提供导数\n*   存在约束时的导数近似\n*   参数和函数的缩放\n*\
  \   终止测试——计算正常结束\n*   终止测试——异常结束\n*   监控进展的输出\n*   优化结果的输出\n*   优化器的控制\n*   默认控制设置\n\
  *   适当的性能衡量\n*   优化接口。\n\n我们将在章的剩余部分将探讨这些问题。\n\n## 3.4 向优化器指定目标和约束\n\n\n\n\n\n与具有固定结构的统计计算（例如线性回归）不同，通用约束优化问题需要用户提供一个目标函数\
  \ ![c03-math-0004](img/c03-math-0004.png) 以及任何不等式约束\n\n### 3.1 ![equation](img/c03-math-0005.png)\n\
  \n或等式约束\n\n### 3.2 ![equation](img/c03-math-0006.png)\n\n多种可能的函数形式导致了难度程度各异的问题。\n\
  \n至于后者，等式约束，可以通过其他方式引入，不幸的是，这些方法可能会导致计算不稳定。总的来说，这个问题在于`向优化器指定目标和约束条件`。\n\n## 3.5\
  \ 将外生数据传递给问题定义函数\n\n在现实世界中，目标函数 ![c03-math-0007](img/c03-math-0007.png) 以及约束 ![c03-math-0008](img/c03-math-0008.png)\
  \ 和 ![c03-math-0009](img/c03-math-0009.png) 不仅是参数 ![c03-math-0010](img/c03-math-0010.png)\
  \ 的函数，还取决于数据。事实上，它们可能取决于海量数据，特别是在涉及大型系统的统计问题中。通常，此类数据由对许多变量的 ![c03-math-0011](img/c03-math-0011.png)\
  \ 观测值组成![c03-math-0012](img/c03-math-0012.png) 可能是一个很大。将这些数据传递给目标函数、约束函数以及计算导数的函数有时是一项尴尬的任务。即使很简单，也可能枯燥且容易出错。当想要应用许多不同的最小化算法时，这种困难会被放大，因为每个算法可能有其自己的结构。\n\
  \n在 R 中，用户工作区中的可用数据通常对低级程序可以使用。我们可以在下面的示例看到这一点，`xx` 和 `yy` 不需要通过调用 `minpack.lm`\
  \ 包中的 `nlsLM()` 传入。相反，`nlmrt` 包中的函数 `nlxb()` 要求我们在调用时指定一个数据框 `data` 作为参数。\n\n```\n\
  xx <- 1:12\nyy <- exp(-0.1 * sin(0.3 * xx))\nrequire(minpack.lm, quietly = TRUE)\n\
  strt1 <- list(p1 = 0, p2 = 1)\n## 此处我们没有指定任何外生数据\nanls1 <- nlsLM(yy ~ exp(p1 * sin(p2\
  \ * xx)), start = strt1, trace = FALSE)\nanls1\n## 非线性回归模型\n##   model: yy ∼ exp(p1\
  \ * sin(p2 * xx))\n##    data: parent.frame()\n##      p1      p2\n## -0.0113  0.9643\n\
  ##  residual sum-of-squares: 0.0496\n##\n## 收敛所需的迭代次数: 7\n## 达到的收敛精度: 1.49e-08\n\
  rss <- function(par) {\n    p1 <- par[1]\n    p2 <- par[2]\n    res <- exp(p1 *\
  \ sin(p2 * xx)) - yy\n    sum(res * res)\n}\n## 检查初始平方和\nprint(rss(c(-0.1, 0.3)))\n\
  ## [1] 0\n## 以及最终平方和\nprint(rss(coef(anls1)))\n## [1] 0.04957\n# 现在尝试使用优化器（默认方法=Nelder-Mead）\n\
  anm <- optim(strt1, rss)\nanm\n## $par\n##       p1       p2\n## -0.01131  0.96426\n\
  ##\n## $value\n## [1] 0.04957\n##\n## $counts\n## function gradient\n##       53\
  \       NA\n##\n## $convergence\n## [1] 0\n##\n## $message\n## NULL\n## 但（在写作时）nlmrt\
  \ 需要显式数据\nmydat <- data.frame(xx = xx, yy = yy)\nrequire(nlmrt, quietly = TRUE)\n\
  anlxb1 <- nlxb(yy ~ exp(p1 * sin(p2 * xx)), start = strt1, trace = FALSE, data =\
  \ mydat)\n## 在调用中插入以下内容以获得更激进的搜索\n## control=list(roffset=FALSE, smallsstest=FALSE)\n\
  print(anlxb1)\n## nlmrt class object: x\n## residual sumsquares =  0.049565  on\
  \  12 observations\n##     after  12    Jacobian and  20 function evaluations\n\
  ## name     coeff        SE       tstat      pval       gradient    JSingval\n##\
  \ p1     -0.0113074   0.02762   -0.4094    0.6909     -2.513e-10    2.513\n```\n\
  \n### 3.5.1 “全局”数据和变量的使用\n\n总体，R 的作用域机制运行良好，允许 R 函数使用用户在工作区中定义的对象。不幸的是，当函数使用的对象与工作区中的对象同名时，“运行良好”仍可能让我们遇到很多麻烦。在这种情况下，我们必须在调用函数时谨慎使用相应的赋值，例如\n\
  \n```\nresult <- afunction(x=myx, y=y)\n```\n\n这并不困难，我建议使用显式赋值而不是信任不会出现问题。我怀疑我不止一个人觉得这些作用域问题比我想象的更麻烦。\n\
  \n\n\n\n\n```\nmystart <- function() {\n    # JN: Define globals here.\n    gtn\
  \ <- list(x = 0, y = 1, vec = rep(0, 9))\n    envjn <- list2env(gtn)\n}\ny <- 4\n\
  myrun <- function() {\n    cat(\"y:\", y, \"  envjn$y: \")\n    print(envjn$y)\n\
  \    envjn$y <- 9876\n    return(0)\n}\nmystart()\nmyrun()\n## y: 4   envjn$y: [1]\
  \ 1\n## [1] 0\ncat(\"envjn$y:\", envjn$y, \"\\n\")\n## envjn$y: 9876\n```\n\n一个小麻烦是，特殊赋值运算符\
  \ `<<-` 将环境对象 `envjn` 置了用户的工作空间，而不是将其保持在 `mystart` 的作用范围内。此外，还需要为该对象选择一个名称，以免与其他另一个包可能使用的名称发生冲突。虽然我确定可能有更优雅的机制，但这里的方法优点在于足够清晰，且存储在\
  \ `envjn` 中的信息可以相对安全地使用。感谢 Gabor Grothendieck 在此提供的帮助讨论。\n\n## 3.6 掩码（临时固定）优化参数\n\
  \n有时，我们希望固定某些 ![c03-math-0013](img/c03-math-0013.png) 参数。固定一个参数意味着参数向量中的元素少了一个，但调整所有索引是一项艰巨的任务，本质上是对我们目标函数和约束函数的重写。遗憾的是，尽管使用此类固定或掩码参数的数学原理甚至其编程实现都相对简单，但在优化代码中却出奇地罕见。因为这可能非常有用，我包含了一个关于掩码及其使用的章节（第\
  \ 12 章），并在那里提到了某些指定固定参数的方法，这些方法与下文的讨论有所不同。\n\n掩码的思想已经存在很长时间了。作者回忆起第一次在昆士兰大学 Ron\
  \ Duggleby 的某项工作中识别出显式程序代码，而这些思想被整合进了 Nash 和 Walker-Smith (1987) 中。掩码是等式约束的一种特殊形式。正如提到的，对于非线性优化程序来说，它们带来的是细节和繁琐的问题，而不是严重的数学障碍。\n\
  \n遵循 Nash 和 Walker-Smith (1987)，在我自己的 R 代码中，我使用一个指示向量 `bdmsk`，它在每个掩码（固定）参数的位置放置\
  \ 0。初始状态下，其他参数是自由的，这通过 `bdmsk` 对应元素中的值 1 来指示。该指示向量也用于边界约束，当从一个具有边界和掩码能力的优化器返回时，![c03-math-0014](img/c03-math-0014.png)\
  \ 的 `bdmsk` 元素意味着该参数处于活跃的下界，而 ![c03-math-0015](img/c03-math-0015.png) 则意味着该参数处于活跃的上界。\n\
  \n`bdmsk` 中的 0 可以以简单的方式应用于梯度，因为固定参数的梯度分量将为 0——毕竟，它是固定的。同样，与掩码参数对应的 Hessian 矩阵的行和列也将为\
  \ 0。虽然显然这些零值不应该是优化方法的本质障碍，但某种方法的特定实现可能会无意中产生“0/0”的情况。要使优化器能够处理掩码实际上比引入边界（箱形约束）要简单得多，但必须必须仔细处理这些细节。\n\
  \n## 3.7 处理不可接受的结果\n\n有时，用户提供的用于定义问题的函数（即目标函数、约束函数，有时还包括导数计算）其返回的值无法被我们的优化代码处理。返回的对象可能是无限大、NULL\
  \ 或 NA，导致优化器和其他计算的失败。有时计算返回的是一个向量、矩阵或数组对象，而该对象本应应该是数值型的。例如，在非线性最小二法计算中，残差向量 `resids`\
  \ 的平方和可以使用以下方法高效找到：\n\n```\nsumsqrs<-crossprod(resids)\n```\n\n遗憾的是，`sumsqrs` 是一个\
  \ 1 ![c03-math-0016](img/c03-math-0016.png) 1 矩阵。我们需要使用：\n\n```\nsumsqrs<-as.numeric(crossprod(resids))\n\
  ```\n\n通常，这类看似微不足的问题会导致程序突然停止。理想情况下，我们希望程序只是对该问题发出警告并明智地继续。至少，我们希望它以一种控制的方式终止。虽然本质上是函数的输入不可接受并导致了我们的困扰，但在特定上下文中尝试计算的结果才是我们困难的根源。\n\
  \n我发现，用户编写的函数返回不可接受的值是用户将优化工具应用于其问题时失败的最常见原因之一。事实上，这类错误包括了计算错误的导数（主要是梯度或雅可比矩阵）以及参数的糟糕缩放，解释了我看到的几乎所有优化代码的“失败”。\n\
  \n用户经常提供的目标函数或残差函数中包含 `log()` 或 `sqrt()` 组件，其参数可能变成负数。初始参数可能使得函数最初是可计算的，用户可能没有意识到优化过程可能会为函数生成负数参数。\n\
  \n通过仔细地编写问题函数，我们可以指示输入是不可接受的（或不理想的）。一个经常“有效”的简单办法是返回一个非常大的值。在实验性包 `optplus` 中，我使用了\
  \ `badval=(0.5)*Machine.xmax`，其值接近 1E![c03-math-0017](img/c03-math-0017.png)。但注意，仅仅在不理想的点让函数值很大可能会扭曲优化方法的行为。我们并不想真正将此结果作为函数值；它是一个不应属于域的点的指示。事实上，因为那些在参数空间中生成点并利用它们向有利方向搜索的方法极可能会在返回的极大值上进行计算，我也使用了较小的设置，例如\
  \ `badval=(1e-6)*Machine.xmax`，这对于除极端函数以外的所有函数都可以作为指示。\n\n在 Nash 和 Walker-Smith\
  \ (1987) 中，我们使用了一个“不可计算标记”，允许优化方法调整它们对最优值的搜索。然而，我们编写了所有的优化器，并可以对标记做出相应反应。对于他人从不同基础和视角编写的优化器，这远没那么容易。R\
  \ 中的极少数优化方法（包括我自己的）还没有多少能力来利用这一点。然而，即使是最小的能力也允许将失败报告传递给调用程序，从而避免计算的意外停止。\n\nR 还有一个\
  \ `try()` 函数可以让我们捕获错误。这在我的几个代码中被用于避免“崩溃”，但到目前为止，它大多只是报告困难并停止或退出。也就是说，我们还没有充分利用从危险参数区域回溯的能力。\n\
  \n## 3.8 为函数提供导数\n\n许多优化工具需要目标函数的导数信息。这足够重要，以至于在书中值得一整章（第 10 章）。一般的非线性目标函数 ![c03-math-0018](img/c03-math-0018.png)\
  \ 会产生梯度 ![c03-math-0019](img/c03-math-0019.png)。如果目标是平方和，那么通常最好是处理残差并找到它们的导数作为雅可比矩阵，然后通过雅可比矩阵与残差向量的内积来构建梯度。\n\
  \n\n\n\n通用非线性目标函数的二阶导数信息可以通过海森矩阵 ![c03-math-0020](img/c03-math-0020.png) 得到。对于平方和，我们通过二项表达式的形式找到海森矩阵元素。因此，![c03-math-0021](img/c03-math-0021.png)\
  \ 的第 ![c03-math-0022](img/c03-math-0022.png) 元素是雅可比矩阵的第 ![c03-math-0023](img/c03-math-0023.png)\
  \ 列和第 ![c03-math-0024](img/c03-math-0024.png) 列的内积（即矩阵 ![c03-math-0026](img/c03-math-0026.png)\
  \ 的第 ![c03-math-0025](img/c03-math-0025.png) 元素），加上形式为下面的元素的和：\n\n**3.3** ![equation](img/c03-math-0027.png)\n\
  \n要求用户提供残差的二阶导数是罕见的，在作者看来，这比应该要求的还要罕见。然而，海森矩阵信息通常用于判断解是否可以接受。此外，在非线性最小二乘计算中，应该更广泛使用海森矩阵，而不是对残差雅可比进行“标准”近似，后者忽略了某些海森信息。\n\
  \n计算足够精确的导数对于某些优化工具的正常运行非常重要，特别是那些显式使用梯度信息的工具。对于共轭梯度/截断牛顿法以及拟牛顿/变量度法类的方法来说尤其如此，这些方法有大量的算法和实现，例如\
  \ Nielsen 2000，Nash (2011a)， Nash (2011b)，Nielsen and Mortensen (2012)， Byrd et\
  \ al. 1995，Dai and Yuan 1999。\n\n对于这类优化方法，通常认为从解析函数计算的导数效果最好。这类函数需要人工或计算机符号数学，或者自动微分（在\
  \ [`en.wikipedia.org/wiki/Automatic_differentiation`](http://en.wikipedia.org/wiki/Automatic_differentiation)\
  \ 和 [`www.autodiff.org/`](http://www.autodiff.org/) 上有非常好的解释），它通过程序化的对我们的函数代码应用链式法则和其他算法。许多从业者在优化中使用自动微分，例如\
  \ NEOS Web 终端优化系统 ([`www.neos-server.org/`](http://www.neos-server.org/)) 和 AD Model\
  \ Builder 软件 ([`admb-project.org/`](http://admb-project.org/))。这些工具理地吸引了一定的追随，但根据我的经验，使用它们需要巨大的精力。另一方面，许多工作者（包括一些非常著名的优化软件开发者）倾向于使用数值近似导数或隐式获取这些信息的方法。\n\
  \n当符号导数或自动微分不可用时，通常采用数值近似。作为一个相当糟糕的例子，简单的前向导数近似可以通过如下代码计算：\n\n```r\ngr <- function(par,\
  \ ...) {\n    fbase <- myfn(par, ...)  # 确保我们有正确值，可能不需要\n    df <- rep(NA, length(par))\n\
  \    teps <- eps * (abs(par) + eps)\n    for (i in 1:length(par)) {\n        dx\
  \ <- par\n        dx[i] <- dx[i] + teps[i]  # 如果有约束阻碍，这一步是危险的！\n        tdf <- (myfn(dx,\
  \ ...) - fbase)/teps[i]\n        if (!is.finite(tdf) || is.nan(tdf))\n         \
  \   tdf <- 0  #这是一个良好的选择吗？\n        df[i] <- tdf\n    }\n    df\n}\n```\n\n## 3.9\
  \ 有约束时的导数近似\n\n无论选择什么导数方法，当参数存在边界或其他约束时，情况会严重放大。原则上讲，我们可以简单地将梯度投影到沿约束的切面上。在实践中，我们的方法必须发现它们是否处于或非常接近约束面上。为了我自己的健康，我将不会尝试在此语文中定义什么是“非常接近”。\n\
  \n糟糕的是，如果我们使用数值近似导数，计算可能会超出边界。考虑上述在前向近似中使用单变量函数 ![c03-math-0028](img/c03-math-0028.png)\
  \ 的导数表达式：\n\n**3.4** ![equation](img/c03-math-0029.png)\n\n软件开发的问题在于，当 ![c03-math-0030](img/c03-math-0030.png)\
  \ 在边界内时，![c03-math-0031](img/c03-math-0031.png) 可能不在范围内，因此我们需要包含对违反约束的检查，以及用于替代计算导数近似的特殊代码。我还没有见过这样做的程序。这个概念相当简单，但实际代码会非常长且详细。\n\
  \n上述代码块中标记为危险的步骤给程序员带来了挑战，主要因为它造成了相当巨大的开销。首先，我们必须检查梯度的第 ![c03-math-0032](img/c03-math-0032.png)\
  \ 元素是否越了边界，如果是，我们必须想办法如何近似梯度。例如，上面的代码使用了基于以下的反向近似：\n\n```r\ntdf <- (fbase - myfn(dx,\
  \ ...))/teps[i]\n```\n\n## 3.10 参数的缩放\n\n用户编写参数缩放以及计算函数的尺度是另一个影响因素。当用户意识到缩放时，他们通常能够提供适当的调整。自动缩放并不简单，因为非线性的一个特征是不同区域缩放不同。再次，这在第\
  \ 17 章会有专门的处理。\n\n## 3.11 计算的正常结束\n\n我们如何知道计算是满意的？回答这个问题涉及到最优性测试和程序性能等棘手问题。几乎每个执行最小化的程序都有特定的终止测试——通常被误认为是收敛。正如我们注意到的，\n\
  \n**程序终止，而算法（可能）收敛。**\n\n最优性测试总是与著名的 KKT 条件（Gill et al. 1981）有关，但存在许多近似和捷径，因此实际计算梯度和海森矩阵是有用的。我们希望梯度“足够小”，海森矩阵是“正定的”，但在浮点运算的语境下，这些概念的意义并非显而易见。关于这个主题有更多内容见第\
  \ 19 章。\n\n## 3.12 终止测试——异常结束\n\n非常常见的是优化程序并不是因为找到了满意答案而退出。相反，它们通常因为花费了太多精力而返回调用程序，这种精力通过时间、函数评估、梯度评估或“迭代”来衡量。最后一种衡量很遗憾，因为很难找到关于特定方法迭代定义的清晰一致文档。\n\
  \n除了精力问题外，优化程序还可能由于方法的特定原因停止。让我们考虑一个例子。R 的 `optim()` 函数包含一个基于我书中（Nash, 1979）的 Nelder–Mead\
  \ 多面体最小化器。该方法如第 2.10.3 节提到的，接受一个由 ![c03-math-0033](img/c03-math-0033.png) 个点组成的\
  \ ![c03-math-0034.png)空间中的初步多面体，并根据各种规则对其修改。这些规则之一被称为 SHRINK，它将第 ![c03-math-0035](img/c03-math-0035.png)\
  \ 个点向函数值最低的点移动。\n\n\n\n\n人们可能会认为这种操作会缩小多胞形的体积测量值，但在编写代码时（在一个内存仅有 4K 到 8K 之间、且算术非常不理想的机器上使用\
  \ BASIC 语言），我注意到有时由于舍入误差，多胞形的体积测量值不会减少。这通常发生在多胞形塌陷到一个点时，而该点往往是最小值的良好近似值。由于 `SHRINK`\
  \ 操作可能未能达到目的，我在操作前后都计算了尺寸度量，并将无法缩小多胞形体积作为退出原因，否则程序将不断循环，尝试收缩多胞形但屡屡失败。\n\n## 3.13\
  \ 输出以监控计算进度\n\n对于大型计算，能够监控计算进度是很有帮助的。我喜欢定期查看目前为止找到的最优函数值，以及一些函数或梯度计算的测量指标。此类输出的量通过设置合适的选项来控制。遗憾的是，此类选项有许多名称和类型。`trace`\
  \ 是一个常见的名称，但根据优化器的不同，它可以是一个逻辑值，也可以是一个整数。还有许多其他名称。如果你只使用一种方法，这几乎不值考虑；但如果你想尝试不同的方法，语法的变化将是一个巨大的困扰。\n\
  \n输出数量和数量的选择在不同的优化代码之间差异很大。这种不一致性部分由于优化器的内部实现导致。然而，如果进度信息在许多优化器之间保持一致，那么方法之间的比较将比现在简单得多。这是\
  \ `optimx` 的主要动机之一。\n\n## 3.14 优化结果的输出\n\n当优化程序完成后（即使是成功正常终止），返回的信息在不同方法之间可能存在差异。输出标准化是\
  \ `optimx` 封装的另一个目标，我们投入了大量工作来提供有用且一致的输出，但仍然存在一些尴尬的结构。我们投入了大量工作（特别感谢 Gabor Grothendieck），提供了访问\
  \ `optimx` 返回结果的工具。大多数封装了几个相关工具的大型 R 包也存在类似的问题。\n\n请注意，在许多情况下，我们只需要最优参数。然而，对函数值进行某些检查（自动或手动）以及某些表明解可能可接受的指标（如\
  \ KKT 测试）几乎总是值得的。\n\n在较少的情况下，提供优化的轨迹（`trajectory`）重要的。这些点集合（可能由函数值补充），标记了我们方法中的迭代或其他识别的步骤。这与不同应用对返回或保存特定信息的需求截然不同，正如我们建议的那样，这些需求可能只需要参数，或许还有函数值和完成代码。相比之下，轨迹可能会导致一个令人不满的“答案”。我们想知道的是该方法如何以及最终为什么得到这个答案的。\n\
  \n## 3.15 优化器的控制参数\n\n大多数包和函数都包含一个“控制”列表，通常称为 `control`。在 R 中，此列表可以用于提供收敛测试的容差、提供输出水平的指示器、计算导数的算法以及类似的选项。用户通常可以理解这些控制的一般用途，即使他们缺乏将其发挥到最大优势的理解。\n\
  \n对于非专业人士来说，改变优化器方法行为的控制参数要困难得多。一个相对容易理解的例子是，在非线性最小二乘法的 Levenberg–Marquardt 方法中，用于增加或减少所谓的\
  \ Marquardt 参数的一对控制。`images/c03-math-0036.png` 通过本质上将最速下降分量混合到高斯-牛顿搜索方向中，从而保护（safeguards）高斯-牛顿搜索方向的计算。然而，如果它太大，通常会减慢向最小值的进展。尝试解决这种可能的策略是减小\
  \ Marquardt 参数 `images/c03-math-0037.png`，例如，当我们改进（即减小）平方和函数时，将其乘以 0.4；当我们未能获得更小的平方和时，将其增加，例如，增加\
  \ 10 倍。为减小和增加控制设置特定值对性能可能非常重要。另一方面，我们希望对这些数字有多种选择，以及 `images/c03-math-0038.png`\
  \ 的初始值，这些选择对于许多目标函数和起始参数都是广泛有效的。\n\n## 3.1 control 默认控制设置\n\n函数具有一种机制来提供函数的默认值。这允许用户如果他们乐于使用提供的默认值，就可以省略对这些参数的引用。因此，如果我们声明\n\
  \n```R\nmyfn<-function(parameters, siglevel=0.05){\n```\n\n那么我们就可以使用调用语法\n\n```R\n\
  result<-myfn(somepars)\n```\n\n此时 `siglevel` 将被赋予默认值 0.05。如果我们希望覆盖此值并使用 0.01，我们写道\n\
  \n```R\nresult<-myfn(somepars, siglevel=0.01)\n```\n\n对于函数调用的 `control` 列表参数，我们必须指定特化的项。例如，我们可能会写\n\
  \n```R\nresult<-myfn(somepars, control=list(trace=2))\n```\n\n来设置 `trace` 控制，它的默认值通常为零。\n\
  \n## 3.17 性能衡量\n\n性能通常通过计算时间来衡量，但也可以进行其他努力的衡量，例如函数、梯度和海森矩阵的评估次数，或者方法的“迭代”次数。内存量或必须存储的双精度数字数量也可能重要。遗憾的是，所有这些都取决于实现方式。\n\
  \n## 3.18 优化界面\n\n最后，有一个巨大的问题涉及到人类用户向优化工具提供输入并从中接收输出的整体方式。传统上，R 的操作是通过输入程序行来执行函数并将输出作为对象。有时我们运行的函数还会将数据写入文件或屏幕。由于早期的终端是打字机，因此即使写入屏幕也使用\
  \ `print` 命令。\n\n由于我们将程序存储为文件，我们也可以在 R 终端之外运行它们。有如 `Rscript` 等工具和 `R CMD` 构建可以实现这一点。如今，许多用户不习惯输入命令，而是喜欢使用鼠标等指针设备在屏幕上移动图标、从菜单中中选择，并在通常不碰键盘的情况下完成大部分工作。R\
  \ 有许多工具可以构建此类图形用户界面 (GUI)。GUI 主题有许多变体，每种在特定用途下都有其优缺点。\n\n\n\n\n与大多数优化工具一样，这个工具相对容易运行到演示水平。然而，冰山水面下的大部分是许多微小但关重要的检查，用于处理那些不允许或不应被允许的情况，这些情况会导致结果不令人满意。因此，`optimgui`\
  \ 在编写时虽然已经“可以工作”，但尚未完成，并且不是 CRAN 仓库的一部分。\n\n# 第 4 章：单参数求根问题\n\n问题往往只涉及一个参数。在这种情况下，某些通用计算工具在被要求求解时实际上会“崩溃”，尽管这通常是它们软件设计在处理单维度问题上的失败。然而，即使我们有一个可以处理任意数量参数的良好求解器，使用专门的工具来寻找单参数函数的根或该函数的最小值（最大值），通常也比尝试应用通用的程序是更好的主意。本章考虑求根问题。\n\
  \n## 4.1 根\n\n让我们看看涉及单变量函数根的问题是如何产生的，以及 R 如何解决它们。虽然我们会提到多项式求根（因为这是一个非常常见的问题），我们认为这个特定问题（以及矩阵的特征值）与本文的重点有所不同。\n\
  \n我们还想指出求根技术在局限性。在作者看来，将求根器视为黑箱是危险的，因为这增加了对我们所需的答案产生许多糟糕近似的风险，甚至是得到完全错误的答案。在很大程度上，这是因为用户对问题和/或软件做了一些没有根据的假设。事实上，在目前的处理中，我们主要寻找方程的实值解——这是一个很大的假设。\n\
  \n我们还想证明，R 中内置的一维求根工具 `uniroot()` 虽然是一个很好的选择，但它仍然基于几项设计考虑，这些考虑可能并不适用于特定的用户问题。\n\n\
  ## 4.2 单变量方程\n\n许多数学问题是以方程的形式表述的。如果我们有一个方程，且方程中只有一个变量是“未知”的（即尚未确定），那么我们应该能够求解该方程。为了做到这一点，我们将指定未知变量为\
  \ ![c04-math-0001](img/c04-math-0001.png)，并将方程重写为\n\n**4.1** ![equation](img/c04-math-0002.png)\n\
  \n其中 ![c04-math-0003](img/c04-math-0003.png) 是单参数的函数。\n\n当然，可能有多个 ![c04-math-0004](img/c04-math-0004.png)\
  \ 的值会导致 ![c04-math-0005](img/c04-math-0005.png) 为零。这种解的多重性是求根软件的主要困难点之一。根也可能有复值，用户（以及软件）认为只有实根是可接受且需要的是非常合理的。正如提到的，除非另有说明，否则我们将寻求实根。\n\
  \n## 4.3 示例\n\n示例通常是学习该主题最直接的方法。\n\n### 4.3.1 指数形式说明\n\n指数函数 ![c04-math-0006](img/c04-math-0006.png)\
