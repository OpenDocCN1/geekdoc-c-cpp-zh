  ```\n\n\n\n\n\n# 优化方法\n*   本章讨论的所有方法都相对“老旧”。它们最早可以追溯到 20 世纪 70 年代到 80 年代，即使代码可能要新一些。这并不意味着它们不是好工具。相反，现在有更新的工具考虑了不断变化的需求，处理更大或稍不同的问题，并包含了基础工具所缺的能力。\n\
  \n*   基础方法已被其他 R 工具使用，因此在某些情况下它们作为这些工具的支持存在。\n\n*   从运行中的系统中移除某些东西是非常困难的，即使有更合适的替代方案。\n\
  \n## 8.1 `optim()`\n\n`optim()` 是 R 中常用的工具之一。它包含了五种方法，其中三种源于作者本人（Nash, 1979）。这五种方法大部分是独立的，但都通过\
  \ `optim()` 调用，调用方式如下：\n\n```\nans<-optim(start, fn=myfn, gr=mygr, method=\"BFGS\"\
  ,\n        X=myx, Y=myY, control=list(trace=1))\n```\n\n其中 `start` 是作为优化迭代初始点的参数向量，`myfn`\
  \ 是要最小化的函数，`mygr` 是其梯度，`control` 列表指定我们要跟踪迭代（`trace`），而通过 `X=myX, Y=myY` 的元素是 `myfn`\
  \ 和 `mygr` 需要的命名变量，并通过 `...` 参数传递给 `optim()`。`method` 通过字符串指定，这里使用了一种名为“BFGS”（Broyden–Fletcher–Goldfarb–Shanno）的方法。\n\
  \n`optim()` 中包含的方法有：\n\n*   `Nelder–Mead`。这是默认方法，是 Nelder 和 Mead (1965) 描述方法的变体。该方法不需要提供任何导数信息；事实上，它会被忽略。该方法在由\
  \ ![c08-math-0001](img/c08-math-0001.png) 点在 ![c08-math-0002](img/c08-math-0002.png)\
  \ 空间中构建一个多面体（或单纯形），然后通过其余点的质心反射“最高”点，并继续利用这种几何信息稳定地减小函数值。过去，“Nelder–Mead 单纯形法”名称曾与\
  \ Dantzig 的线性规划方法引起混淆（Nash, 2000）。我更倾向于使用“Nelder–Mead 多面体法”或简单的“Nelder–Mead”甚至 `NM`。\n\
  \n*   `BFGS`。这是 Fletcher (1970) 提出的变尺度法。该方法是一种使用梯度的下降法，建议使用解析梯度或非常好的近似。从一个简单的单位矩阵开始，在该方法的迭代过程中建立的梯度信息被用于构建近似逆海森矩阵，使得该方法“接近”牛顿法。虽然实验显示近似效果较差，但在实践中该方法表现良好。使用\
  \ BFGS 公式来“更新”逆海森近似导致了该方法在 R 中的命名，但读者通过使用搜索术“variable metric”（变尺度法）可能会找到关于该方法的有用信息。\n\
  \n*   `L-BFGS`。这是 BFGS 算法的有限内存版本。它对于无法存储完整海森矩阵的高维问题特别有用。\n\n*   `CG`。这是共轭梯度法。这是一种求解大规模线性系统的有效方法，也可以应用于非线性优化。它只需要函数的梯度，不需要存储海森矩阵。\n\
  \n*   `Newton`。该方法使用目标函数的二阶导数。这是一种拟牛顿法，使用梯度信息近似海森矩阵。由于海森矩阵很大，对于高维问题，计算成本可能很高。\n\n\
  *   `SANN`。代表模拟退火。这是一种用于寻找函数全局最小值的随机优化方法。它的灵感来源于冶金中的退火过程。\n\n## 8.2 `nlm()`\n\n\
  `nlm` 是 UNCMIN 的接口，这是一组用于无约束最小化的算法（Schnabel et al., 1985）。该方法是牛顿法或拟牛顿法，但细节有些难以理解。`nlm()`\
  \ 的调用序列与 `optim()` 非常不同，手册给出的用法：\n\n```\nnlm(f, p, ..., hessian = FALSE, typsize\
  \ = rep(1, length(p)),\n     fscale = 1, print.level = 0, ndigit = 12, gradtol =\
  \ 1e-6,\n     stepmax = max(1000 * sqrt(sum((p/typsize)²)), 1000),\n     steptol\
  \ = 1e-6, iterlim = 100, check.analyticals = TRUE)\n```\n\n注意函数 `f` 在序列中在前，参数在后，这与\
  \ `optim()` 相反。此外，梯度和可能的海森矩阵代码作为属性传递给 `f`，描述如下：\n\n```\nf: 要最小化的函数。如果函数值具有\n   \
  \ 'gradient' 属性或同时具有 'gradient' 和 'hessian'\n    属性，则这些属性将用于更新更新的\n    参数值的计算中。否则，将使用数值导数。\n\
  \    'deriv' 返回一个具有合适 'gradient'\n    属性的函数。这应该是一个长度为 'p' 的\n    向量的函数，后面跟随着由 '...'\
  \ 参数\n    指定的其他参数。\n```\n\n与许多优化例程序一样，`nlm()` 有许多控制参数，本质上是为了调整方法的启发式策略。在实践中，我很少甚至从未使用过这些参数，尽管我在优化领域工作并应该具备这方面的知识。一个可能的例外是迭代次数的限制。我通常想知道在允许进行尽可能多次迭代的情况下，方法是否能得到有效解。\n\
  \n尽管对 `nlm()` 有上述批评，但根据我的经验，它是无约束函数最可靠且高效的优化方法之一，即使只提供了函数代码也是。为了简化使用，我通常通过 `optimx()`\
  \ 调用它，这允许使用通用的、类似于 `optim` 的调用序列。\n\n## 8.3 `nlminb()`\n\n\n\n\n\n由于 `nlm()` 是一个无约束最小化器，但由于许多极大似然问题需要边界约束，因此\
  \ `nlminb()` 被添加到了基础优化器集合中。`nlminb()` 所的基础的代码由 David Gay 在贝尔实验室编写，并且是 PORT Fortran\
  \ 库的一部分（Fox 等人 1978）。贝尔实验室的 S 语言使用它作为其优化器，Doug Bates 在 2008 年 6 月的一封邮件中写道：\n\n```\n\
  > 我创建 nlminb 函数是因为我无法使用 nlm 和 optim \n> 在 nlme 和 lme4 软件包中针对某些困难的优化问题获得 \n> 可靠的收敛。nlme\
  \ 包最初是由贝尔实验室为 S \n> 编写的（SPLUS 的前身），而 PORT 包是当时使用的\n> 优化代码。尽管它是非常老式的\n> Fortran 代码，但我发现它作为一个优化器是非常可靠的。\n\
  ```\n\n我同意这一普遍观点，尽管 PORT 库中的代码并不容易追踪和使用。此外，与 `nlm()` 一样，有很多可能有帮助的设置和选择，但更多的 R 用户可能希望将其搁置。然而，`nlminb`\
  \ 的调用方式与 `optim()` 非常相似，即：\n\n```\nnlminb(start, objective, gradient = NULL, hessian\
  \ = NULL, ...,\n   scale = 1, control = list(), lower = -Inf, upper = Inf)\n```\n\
  \n控制的问题在 2010 年的发现中被突出（见 `https://stat.ethz.ch/pipermail/r-help/2010-July/245194.html`）：`nlminb()`\
  \ 假设目标函数是正的（很可能是平方和），且默认的终止测试是 `abs.tol`，这是 `nlminb` 的控制参数。许多负对数似然函数并不是正的，很难知道有多少个错误的结果被使用或发布了。这个问题凸显了\
  \ R 等开源软件的核心问题——如果我们想要改进代码，就必须能够方便地审查代码。PORT 库有许多优秀的代码，但在我看来，它们并不容易理解或修改，特别是当为 R\
  \ 的使用而实现时，界面增加了另一层困惑。\n\n## 8.4 使用基础优化工具\n\n让我们用本章的方法来解决著名的 Rosenbrock (1960) 香蕉形山谷问题。我们将从“标准”点开始，并且目前我们不会提供梯度。\n\
  \n```\nfr <- function(x) {\n    ## Rosenbrock 香蕉函数\n    x1 <- x[1]\n    x2 <- x[2]\n\
  \    100 * (x2 - x1 * x1)² + (1 - x1)²\n}\nsstart <- c(-1.2, 1)\n```\n\n为了保持输出整洁，我们将使用一个小小的显示函数。\n\
  \n```\nprtopt <- function(optres, headname) {\n    # optim() 结果紧凑打印\n    cat(headname,\
  \ \": f(\")\n    npar <- length(optres$par)\n    for (i in 1:(npar - 1)) {\n   \
  \     cat(optres$par[[i]], \", \")\n    }\n    cat(optres$par[[npar]], \") = \"\
  , optres$value, \" after \",\n        optres$counts[[1]], \"f & \", optres$counts[[2]],\
  \ \"g\\n\")\n    cat(optres$message, \"  convergence code=\", optres$convergence,\n\
  \        \"\\n\")\n}\n```\n\n首先，我们尝试 `optim()` 的 Nelder–Mead, BFGS, CG 和 L-BFGS-B\
  \ 方法：\n\n```\nanm <- optim(sstart, fr)  # Nelder Mead 是默认方法\nprtopt(anm, \"anm\"\
  )\n## anm : f(1.0003 , 1.0005 ) =  8.8252e-08  after  195 f &  NA g\n##    convergence\
  \ code= 0\nabfgs <- optim(sstart, fr, method = \"BFGS\")\nprtopt(abfgs, \"abfgs\"\
  )\n## abfgs : f(0.9998 , 0.99961 ) =  3.8274e-08  after  118 f &  38 g\n##    convergence\
  \ code= 0\nacg1 <- optim(sstart, fr, method = \"CG\", control = list(type = 1))\n\
  prtopt(acg1, \"acg1\")\n## acg1 : f(-0.76481 , 0.59271 ) =  3.1065  after  402 f\
  \ &  101 g\n##    convergence code= 1\nacg2 <- optim(sstart, fr, method = \"CG\"\
  , control = list(type = 2))\nprtopt(acg2, \"acg2\")\n## acg2 : f(0.96767 , 0.93628\
  \ ) =  0.001042  after  384 f &  101 g\n##    convergence code= 1\nacg3 <- optim(sstart,\
  \ fr, method = \"CG\", control = list(type = 3))\nprtopt(acg3, \"acg3\")\n## acg3\
  \ : f(0.94 , 0.988 ) =  0.0012  after  402 f &  101 g\n##    convergence code= 1\n\
  alfgs <- optim(sstart, fr, method = \"L-BFGS-B\")\nprtopt(alfgs, \"alfgs\")\n##\
  \ alfgs : f(0.9998 , 0.9996 ) =  3.9985e-08  after  49 f &  49 g\n```\n*(注：由于原文文本中部分输出结果在示例中可能存在截断或细微差异，为保持逻辑一致性，此处遵循翻译逻辑处理)*\n\
  \n我们观察到， CG 方法与其他方法相比表现较差。\n\n\n\n\nCRAN（综合 R 存档网络）和 R-Forge 拥有许多用于函数最小化的包。事实上，我是其中几个包的开发者。本章将探索其中一些。坦率地说，相关材料多于一本书能合理包含的内容，更不用说书中的一章了，但我们将尽力提供一个体面的概述。\n\
  \n## 9.1 软件包 `optimx`\n\n`optimx` 包（Nash and Varadhan, 2011a, 2011b）是许多优化算法程序的封装包，包含了基础系统中的其中几个程序。其目的之一是将许多有用优化器的调用统一到一种通用语法中，从而能够方便地对它们的性能进行比较。这种比较能力使得该包成为其所调用的许多包的有用介绍。针对不同程序使用不同的调用语法对用户来说是一个巨大的困扰，也是错误频繁发生的来源。\n\
  \n然而，`optimx` 不仅仅是一个统一调用序列语法的工具。其设计包含了本书其他地方讨论的一些重要概念（见第 3 章）。\n\n* 在尝试优化之前，可以对函数、梯度和缩放进行若干初始测试。\n\
  * 优化器完成后，如果参数数量不是太大，则对解进行 Kuhn–Karush–Tucker 验证是默认行为。\n* 对返回的结果提供了 `summary()`、`coef()`\
  \ 和 `print()` 方法。\n\n还有其他可以提高优化计算成功率的特征，这些特征已经在 R-forge 上的 `optimizer` 项目中的实验性包\
  \ `optplus` 中经过研究（[`r-forge.r-project.org/R/?group_id=395`](https://r-forge.r-project.org/R/?group_id=395)）。它如下如下扩展了\
  \ `optimx`：\n\n* 像 `optim()` 函数那样的参数缩放适用于所有方法。这一扩展为代码增加了许多复杂性并导致了性能损失。\n* 同样，会对函数求值进行检查以判断是否计算，以便修正测试点或搜索方向。这允许优化继续并避免某些导致用户程序崩溃的停止，但对于所有测试点都是可计算的问题，这是一种时间浪费。\n\
  * 优化器完成后，对解进行轴向搜索验证是默认行为。这需要对每个方法执行 `![c09-math-0001](img/c09-math-0001.png)` 次函数评估，其中\
  \ `![c09-math-0002](img/c09-math-0002.png)` 是参数的数量。\n\n遗憾的是，这些特征的性能成本似乎超过了其可靠性收益。缩放和函数检查是有用的想法，但我尚未在\
  \ R 中发现一种通用且高效的实现。当多次执行某个优化任务时，我们希望分离一些检查和缩放，以免它们产生不必要的重复。为了性能考虑，缩放和检查应该在编写目标和梯度函数的阶段应用。另一方面，当我们只想解决一个问题时，此类检查可以帮助避免耗时的错误，而缩放可以帮助我们找到解。\n\
  \n### 9.1.1 `optimx` 中的优化器\n\n在写作时，`optimx` 中的优化方法包括第 8 章中讨论过的以下基础系统中的方法：\n\n* 来自\
  \ `optim()` 函数的 BFGS、Nelder–Mead、L-BFGS-B 和 CG 方法；\n* `nlm()`；\n* `nlminb()`。\n\n\
  还包括的（同样在写作时）有：\n\n* `Rvmmin` 包（Nash, 2011b），这是我对 Fletcher (1970) 变量尺度法的全 R 实现；\n\
  * `Rcgmin` 包（Nash, 2011a），这是我对 Dai 和 Yuan (2001) 共轭梯度法的全 R 实现；\n* 来自 `BB` 包的 `spg`\
  \ 函数（Varadhan and Gilbert, 2009），这是 Ravi Varadhan 对 Birgin 和 Raydan (2001) 代码的 R\
  \ 实现；\n* `ucminf` 包（Nielsen and Mortensen, 2012），一种由 Nielsen (2000) 使用的逆海森矩阵近似并带线搜索的变量尺度法；\n\
  * 来自 `dfoptim` 包的 `nmkb` 和 `hjkb` 函数（Varadhan and Borchers, 2011），它们是 Kelley (1987)\
  \ 带边界的 Nelder–Mead 方法的变体，以及带边界的 Hooke and Jeeves (1961) 方法；\n* 来自 `minqa` 包的 `newuoa`\
  \ 和 `bobyqa` 方法（Bates et al. 2010），这是用 Fortran 编写的 Powell (2009) BOBYQA 的接口；\n\n\
  ### 9.1.2 `optimx()` 的示例用法\n\n让我们使用传统的 Rosenbrock 函数 `fr()`，并在可以使用的地方，使用第 8 章中介绍的解析梯度\
  \ `frg()`。\n\n```\nrequire(optimx)\n## 加载所需的包: optimx\nfr <- function(x) {\n   \
  \ ## Rosenbrock 香蕉函数\n    x1 <- x[1]\n    x2 <- x[2]\n    (1-x1)² + 100*(x2-x1²)²\n\
  }\nfrg <- function(x) {\n    x1 <- x[1]\n    x2 <- x[2]\n    c(-2*(1-x1)-400*x1*(x2-x1²),\
  \ 200*(x2-x1²))\n}\nxstart <- c(-1.2, 1)\nres <- optimx(fn=fr, gr=frg, start=xstart,\
  \ method=\"BFGS\")\nsummary(res)\n```\n\n\n\n\n`nloptr` (Ypma, 2013) 是由 MIT 的 Steven\
  \ G. Johnson 维护的 NLopt 库的接口（[`ab-initio.mit.edu/wiki/index.php/NLopt`](http://ab-initio.mit.edu/wiki/index.php/NLopt)）。该库有一个简化的封装称为\
  \ `nloptwrap` (Borchers, 2013)。NLopt 中有许多优化工具，其中一些与上述用于无约束优化和边界约束优化的工具镜像，且源自相同的来源。\n\
  \n```\nrequire(nloptwrap)\n## Loading required package: nloptwrap\n## Loading required\
  \ package: nloptr\n##\n## Attaching package: 'nloptwrap'\n##\n## The following objects\
  \ are masked from 'package:minqa':\n##\n##    bobyqa, newuoa\nnowp <- function(answer)\
  \ {\n    # nloptwrap answer summary\n    cat(\"Fn =\", answer$value, \" after \"\
  , answer$iter, \" iterations, parameters:\\n\")\n    print(answer$par)\n    cat(answer$message,\
  \ \"\\n\")\n    invisible(0)\n}\nalbfgs <- lbfgs(sstart, fr, gr = frg)\nnowp(albfgs)\n\
  ## Fn = 7.357e-23  after  56  iterations, parameters:\n## [1] 1 1\n## NLOPT_SUCCESS:\
  \ Generic success return value.\natnewton <- tnewton(sstart, fr, gr = frg)\nnowp(atnewton)\n\
  ## Fn = 1.735e-24  after  74  iterations, parameters:\n## [1] 1 1\n## NLOPT_SUCCESS:\
  \ Generic success return value.\navarmetric <- varmetric(sstart, fr, gr = frg)\n\
  nowp(avarmetric)\n## Fn = 1.391e-18  after  53  iterations, parameters:\n## [1]\
  \ 1 1\n## NLOPT_SUCCESS: Generic success return value.\nanelmead <- neldermead(sstart,\
  \ fr)\nnowp(anelmead)\n## Fn = 3.656e-14  after  214  iterations, parameters:\n\
  ## [1] 1 1\n## NLOPT_XTOL_REACHED: Optimization stopped because xtol_rel or xtol_abs\
  \ (above) was reached.\nanewuoa <- newuoa(sstart, fr)\nnowp(anewuoa)\n## Fn = 8.023e-17\
  \  after  194  iterations, parameters:\n## [1] 1 1\n## NLOPT_SUCCESS: Generic success\
  \ return value.\n# remove the packages in case of confusion\ndetach(package:nloptwrap)\n\
  detach(package:nloptr)\n```\n\n### 9.2.2 trust and trustOptim\n\n优化中的置信域方法（正如 [`en.wikipedia.org/wiki/Trust_region`](http://en.wikipedia.org/wiki/Trust_region)\
  \ 中非常好的指出的那样）为寻找一组新的且可能更好的参数选择一个步长，然后找到搜索方向。步长由该区域决定，在该区域内目标函数的模型对于优化需求足够准确。传统的梯度方法是选择搜索方向，然后计算步长。\n\
  \n`trust` (Geyer, 2013) 实现了一种置信域方法，用户必须提供目标函数代码和一组初始参数。然而，目标函数现在不仅返回函数值，还返回其梯度和海森矩阵（Hessian）。对于许多问题来说，这是一项庞大且艰巨的任务。在下文中，我们将使用刚刚使用的\
  \ Rosenbrock 函数来说明这一点。此外，我们使用来自 `trust` 的示例代码来展示在 `objfun2()` 中生成目标函数的另一种方法。\n\n\
  ```\nfrh <- function(x) {\n    ## Rosenbrock Banana function gradient\n    x1 <-\
  \ x[1]\n    x2 <- x[2]\n    h11 <- -400 * x2 + 1200 * x1 * x1 + 2\n    h12 <- -400\
  \ * x1\n    h21 <- h12\n    h22 <- 200\n    HH <- matrix(c(h11, h12, h21, h22),\
  \ nrow = 2, ncol = 2)\n}\nobjfun1 <- function(x) {\n    val <- fr(x)\n    gg <-\
  \ frg(x)\n    HH <- frh(x)\n    list(value = val, gradient = gg, hessian = HH)\n\
  }\nobjfun2 <- function(x) {\n    stopifnot(is.numeric(x))\n    stopifnot(length(x)\
  \ == 2)\n    f <- expression(100 * (x2 - x1∧2)∧2 + (1 - x1)∧2)\n    g1 <- D(f, \"\
  x1\")\n    g2 <- D(f, \"x2\")\n    h11 <- D(g1, \"x1\")\n    h12 <- D(g1, \"x2\"\
  )\n    h22 <- D(g2, \"x2\")\n    x1 <- x[1]\n    x2 <- x[2]\n    # ... logic continues\
  \ as per original text\n    list(value = val, gradient = gg, hessian = HH)\n}\n\
  objfun1 <- function(x) {\n    val <- fr(x)\n    gg <- frg(x)\n    HH <- frh(x)\n\
  \    list(value = val, gradient = gg, hessian = HH)\n}\n```\n\n\n\n\n\n# 第 10 章：计算与使用导数\n\
  \n## 参考文献（选选）\n\n10. Nash JC 2011a `Rcgmin`: *带框约束的非线性函数共轭梯度最小化*. Nash Information\
  \ Services Inc. R package version 2011-2.10.\n11. Nash JC 2011b `Rvmmin`: *带边界约束的变量度非线性函数最小化*.\
  \ Nash Information Services Inc. R package version 2011-2.25.\n12. Nash JC and Varadhan\
  \ R 2011a `optimx`: *`optim()`函数的替换与扩展*. Nash Information Services Inc. and 约翰霍普金斯大学.\
  \ R package version 2011-3.5.\n13. Nash JC and Varadhan R 2011b 统一优化算法以帮助软件用户：用于\
  \ R 的 `optimx`. *Journal of Statistical Software* **43**(9), 1–14.\n14. Nielsen\
  \ HB 2000 UCMINF - 一种无约束非线性优化的算法. 技术报告，丹麦技术大学数学建模系. 报告 IMM-REP-2000-18.\n15. Nielsen\
  \ HB and Mortensen SB 2012 `ucminf: *通用无约束非线性优化*. R package version 1.1-3.\n16.\
  \ Powell MJD 2009 用于无导数边界约束优化的 BOBYQA 算法。\n17. Varadhan R and Borchers HW 2011 `dfoptim:\
  \ *无导数优化*. 约翰霍普金斯大学和 ABB 公司研究院. R package version 2011.12-9.\n18. Varadhan R and\
  \ Gilbert P 2009 `BB`: 一个用于求解大型非线性方程组和优化高维非线性目标函数的 R 包. *Journal of Statistical\
  \ Software* **32**(4), 1–26.\n19. Ypma J 2013 `nloptr: *NLopt 的 R 接口*. R package\
  \ version 0.9.3.\n\n## 引言\n\n在之前的章节中，我们多次提到了导数，即函数的梯度和海森矩阵。在实践中，拥有良好的导数信息对于获取解或确定我们已获得有效解非常重要。本章将探讨获取和使用此类信息的方法。\n\
  \n## 10.1 为什么以及如何\n\n### 导数信息非常重要\n\n* 因为极小值的 KKT 条件（Karush, 1939; Kuhn and Tucker,\
  \ 1951）要求一阶导数为“零”，且海森矩阵（即二阶导数矩阵）必须是**正定的**；\n* 因为许多方法可以使用梯度信息。\n\n事实上，即使是那些声称“无导数型”的方法，通常也会使用梯度和海森矩阵的概念，无论是针对要最小化的函数，还是针对近似模型。\n\
  \n根据我的经验，良好的导数信息的主要用途在于验证我们确实有了一个解。也就是说，它对于终止测试很有用，并且能提高性能，因为它允许我们在旅程完成时停止尝试。在某些情况下，当我们距离解很远时，近似导数在初始步骤实际上可能为某些梯度方法提供更好的性能。这类似于适用于割线法在早期迭代中表现优于牛顿法。\n\
  \n遗憾的是，导数的计算并非一项易事。本章介绍了一些方法，并给出了一些建议，我坦诚这些建议是开放讨论的——它们是我基于处理这些问题的多年经验得出的个人观点，但它们不可避免地基于我曾试图解决的特定问题，而这些问题可能与读者所面临的问题大不同。\n\
  \n以下是一些通用的考量和建议：\n\n* 始终对计算结果进行检查。事实上，我帮助开发的一些软件包包含了对导数与数值近似进行对比的检查，因为导数编码非常容易出错。\n\
  *   为你的代码编写注释。我通常发现写代码的那个人（我我自己！）就是以后那个必须搞懂它的人，因此，为了我自己的工作效率，尝试编写可读的脚本至关重要。在这方面，导数可能变得特别棘手。\n\
  *   如果存在边界，或者函数在定义域的某些区域未定义，请尝试包含适当的检查，以避免“崩溃”，或者更糟糕的是得到导致静默失败的结果，即答案是错误的但没有错误信息。\n\
  \n## 10.2 解析解导数——手动编写\n\n对于频繁运行的问题，我相信手动编码的导数函数通常能够提供最佳的性能。如果程序员足够明智，这些函数也会带有注释，并且对于代码读者来说比任何自动生成的函数都易理解。注意，对于某些函数，同时计算目标函数、梯度和海森矩阵是非常高效的，因为可能存在共同的子计算。\n\
  \n遗憾的是，推导出解析导数是枯燥且容易出错的。在非线性二乘法或类似的计算（即试图通过改变参数 `parms` 为数据拟合函数模型 `parms`）中，我发现将残差写成以下形式很有用：\n\
  \n**10.1** ![equation](img/c10-math-0001.png)\n\n这避免了在对 `resids` 求导数时可能出现的一个符号错误，尽管大多数统计学家会将残差写成\
  \ `data—model(parms)` 的形式。当然，这对于平方和没有影响。我敦促读者开发适合自己工作习惯的技巧，以便避免在计算导数时出现简单但代价巨大的错误。正如\
  \ McCullagh 和 Nelder (1989, p. 9) 所述，高斯和勒格德都对残差使用了上述形式，因此我的做法并不孤单。\n\n## 10.3 解析解导数——工具\n\
  \n如前所述，存在允许符号数学的软件工具，这些工具可以用于生成导数的表达式。我本人偶尔使用过此类软件包，例如 `DERIVE` (Nash, 1995)。（该包似乎已不可用）。我也偶尔使用\
  \ `Maxima` ([`maxima.sourceforge.net`](http://maxima.sourceforge.net))）。然而，我发现这些工具很难用好，需要持续使用来保持技能。如果你愿意经常使用这些软件包，我相信它们可能会带来丰厚的回报。\n\
  \n符号数学工具的一个特殊用途是允许在“手动”编写导数函数时部分开发。它们还可以提供一种检查我们的代码是否生成正确答案的方法，可能是在导数计算的中间阶段。\n\n\
  ## 10.4 使用 R 工具求分的示例\n\n让我们使用示例 1.2 中的非线性二乘法。我们在 `mod` 中设置模型表达式，在 `namev` 中提供参数名称，并使用\
  \ R 函数 `deriv()` 获取梯度的表达式。\n\n\n\n\n\n```\nmod <- ∼100 * b1/(1 + 10 * b2 * exp(-0.1\
  \ * b3 * t))\nmod\n```\n\n## ∼100 * b1/(1 + 10 * b2 * exp(-0.1 * b3 * t))\n\n```r\n\
  namev <- c(\"b1\", \"b2\", \"b3\")\ntry1 <- deriv(mod, namev)\ntry1\n## expression({\n\
  \    .expr1 <- 100 * b1\n    .expr2 <- 10 * b2\n    .expr6 <- exp(-0.1 * b3 * t)\n\
  \    .expr8 <- 1 + .expr2 * .expr6\n    .expr13 <- .expr8²\n    .value <- .expr1/.expr8\n\
  \    .grad <- array(0, c(length(.value), 3L), list(NULL, c(\"b1\",\n        \"b2\"\
  , \"b3\")))\n    .grad[, \"b1\"] <- 100/.expr8\n    .grad[, \"b2\"] <- -(.expr1\
  \ * (10 * .expr6)/.expr13)\n    .grad[, \"b3\"] <- .expr1 * (.expr2 * (.expr6 *\
  \ (0.1 * t)))/.expr13\n    attr(.value, \"gradient\") <- .grad\n    .value\n## })\n\
  ```\n\n我们现在可以将这个表达式复制并粘贴到函数中，用于计算模型的残差和雅可比矩阵。然后我们计算平方和和梯度。\n\n```r\nresfn <- function(pars,\
  \ t = t, y = y) {\n    b1 <- pars[[1]]\n    b2 <- pars[[2]]\n    b3 <- pars[[3]]\n\
  \    .expr1 <- 100 * b1\n    .expr2 <- 10 * b2\n    .expr6 <- exp(-0.1 * b3 * t)\n\
  \    .expr8 <- 1 + .expr2 * .expr6\n    .expr13 <- .expr8²\n    .value <- .expr1/.expr8\n\
  \    .grad <- array(0, c(length(.value), 3L), list(NULL, c(\"b1\",\n        \"b2\"\
  , \"b3\")))\n    .grad[, \"b1\"] <- 100/.expr8\n    .grad[, \"b2\"] <- -(.expr1\
  \ * (10 * .expr6)/.expr13)\n    .grad[, \"b3\"] <- .expr1 * (.expr2 * (.expr6 *\
  \ (0.1 * t)))/.expr13\n    attr(.value, \"gradient\") <- .grad\n    .value\n   \
  \ res <- .value - y\n    attr(res, \"jacobian\") <- .grad\n    res\n}\n## 测试该函数\n\
  ydat <- c(5.308, 7.24, 9.638, 12.866, 17.069, 23.192, 31.443,\n    38.558, 50.156,\
  \ 62.948, 75.995, 91.972)  # 用于测试\ntdat <- 1:length(ydat)  # 用于测试\nstart <- c(1,\
  \ 1, 1)\nmyres <- resfn(start, y = ydat, t = tdat)\nprint(as.vector(myres))  # 我们不需要‘gradient’\n\
  ##  [1]   4.64386   3.64458   2.25518   0.11562  -2.91533\n##  [6]  -7.77921 -14.68094\
  \ -20.35397 -30.41538 -41.57497\n## [11] -52.89343 -67.04642\nss <- as.numeric(crossprod(as.vector(myres)))\n\
  ss\n## [1] 10685\nJJ <- attr(myres, \"jacobian\")\nJJ\n##            b1       b2\
  \       b3\n##  [1,]  9.9519  -8.9615  0.89615\n##  [2,] 10.8846  -9.6998  1.93997\n\
  ##  [3,] 11.8932 -10.4787  3.14361\n##  [4,] 12.9816 -11.2964  4.51856\n##  [5,]\
  \ 14.1537 -12.1504  6.07520\n##  [6,] 15.4128 -13.0373  7.82235\n##  [7,] 16.7621\
  \ -13.9524  9.76668\n##  [8,] 18.2040 -14.8902 11.91213\n##  [9,] 19.7406 -15.8437\
  \ 14.2533\n## [11] -52.89343 -67.04642\n```\n\n\n\n\n```\ndetach(package:pracma)\
  \  # avoid confusion between two grad() functions\nf1 <- function(x) 1 + x²\nf2\
  \ <- function(x) abs(1 + x²)\nrequire(numDeriv)\ngrad(f1, 1, method = \"complex\"\
  )\n## [1] 2\ngrad(f2, 1, method = \"complex\")\n## Error: function does not return\
  \ a complex value as required by method ‘complex’.\n```\n\n## 10.7 导数的策略与技巧\n\n\
  在建议我认为合理的导数计算方法之前，让我们先检查不同方法的成本和准确性（图 10.1）。我们将使用带有缩放因子为 100 的广义 Rosenbrock 函数来处理不同数量参数。\n\
  \n```r\ngenrose.f <- function(x, gs = 100) {\n    # objective function A generalization\
  \ of the Rosenbrock\n    # banana valley function to n parameters\n    n <- length(x)\n\
  \    fval <- 1 + sum(gs * (x[1:(n - 1)]² - x[2:n])² + (x[2:n] -\n        1)²)\n\
  \    return(fval)\n}\ngenrose.g <- function(x, gs = 100) {\n    # vectorized gradient\
  \ for genrose.f\n    n <- length(x)\n    gg <- as.vector(rep(0, n))\n    tn <- 2:n\n\
  \    tn1 <- tn - 1\n    z1 <- x[tn] - x[tn1]²\n    z2 <- 1 - x[tn]\n    gg[tn] <-\
  \ 2 * (gs * z1 - z2)\n    gg[tn1] <- gg[tn1] - 4 * gs * x[tn1] * z1\n    return(gg)\n\
  }\n```\n\n![c10f001](img/c10f001.jpg)\n\n**图 10.1**\n\n我们通过计算最大绝对误差与最大绝对梯度元素之比，来计算梯度与解析值相比的相对误差。也就是说，我们并不是计算所有的相对误差然后找到它们的最大绝对值。这样做是为了避免除以零，同时获得相对误差的衡量。结果给出在本节末尾的表格中。\n\
  \n总的来说，我对优化软件用户的建议是首先尝试使用解析导数。与使用数值近似导数相比，这有时可能会导致优化计算的耗时略长或工作量稍大，特别是当起点距离解较远时。至少从一个一维问题中可以对这一事实有部分理解：在一维问题中，割线法在早期迭代中向最小值的进展可能比牛顿法（即切线法）进展更好。另一方面，解析导数在确定我们是否确实处于最优解方面要可靠得多。此外，它们在运行\
  \ KKT 和其他最优性测试，以及评估用于判断优化代码终止的测试量时，节省了大量工作量。\n\n如果无法解析导数，那么显然复数步近似法（在这里提供了全精度）是下一个最佳选择，但它对于某些函数可能是不可计算的。虽然\
  \ `numDeriv` 的效果优于中心差分法，但后者在计算时间上更加经济效益，并且实现了合理的准确度。\n\n### 导数相对误差\n\n```\n##\n\
