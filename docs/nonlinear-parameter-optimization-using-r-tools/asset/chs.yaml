  \n\n\n\n与基于梯度的函数最小化略有不同的方法是非线性共轭梯度最小化器族。这些方法的推导方式就像我们正在最小化一个 Hessian 矩阵为常正定矩阵的二次型。这导致了一个具有以下结构的算法：\n\
  \n*   提供起始参数 ![c02-math-0073](img/c02-math-0073.png)，并计算初始函数 ![c02-math-0074](img/c02-math-0074.png)和梯度\
  \ ![c02-math-0075](img/c02-math-0075.png)。选择初始搜索方向为负梯度方向。\n\n*   沿搜索方向进行某种线搜索。如果我们沿着负梯度方向搜索，若函数值未能改进，则停止方法；否则，我们将搜索重置为该方向。\n\
  \n*   我们在新点处计算梯度，并利用该梯度、之前的梯度以及搜索方向来推导出新的搜索方向。注意，这仅涉及几个向量的存储。有几种公式可以更新搜索方向，还有许多测试可以确保这是一个“良好”的方向。\n\
  \n*   应用各种终止或重启测试，直到无法进展为止。\n\n尽管共轭梯度法对存储存储的要求非常低且结构相当简单，但它们在处理很大的问题（即参数达到数百个）时表现往往惊人。另一方面，“经常”并不同于“几乎总是”，重要的是，我认为\
  \ `optim()` 中的‘CG’方法以及在 Nash (1979) 中的前身是我所实现的方法中最不成功的。这提供了三种更新搜索方向的公式选择，即原始的 Fletcher–Reeves\
  \ 公式、Polak 和 Ribière 的公式，以及 Beale 和 Sorenson 的公式。其中第一个是 `optim()` 的默认值；然而，第二个是我不情的偏好。\n\
  \n幸运的是，我们不需要纠结这些选择，Dai 和 Yuan 2001 显示了一种结合这些公式的方法，并利用它们提供了一个何时重启迭代的测试。这在包 **`Rcgmin`**\
  \ 中实现，并且看起来良好。Hager 和 Zhang 2006 有最近的工作可能提供进一步的改进，但我还没有机会实现这些思想。\n\n## 2.9 其他梯度方法\n\
  \n对于一个具有 ![c02-math-0076](img/c02-math-0076.png) 参数的问题，拟牛顿法需要一个阶阶为 ![c02-math-0077](img/c02-math-0077.png)\
  \ 的矩阵工作空间以及几个同阶的向量。共轭梯度法的空间效率高得多——只需要几个 ![c02-math-0078](img/c02-math-0078.png)\
  \ 向量——但在少数评估内最小化函数的能力可能没有那么好。因此，许多研究试图寻找介于这两类方法之间的方法，以兼顾时间和空间效率。其中一种是 `optim` 中的\
  \ Nocedal 及其同事的有限内存 BFGS 方法（Zhu et al. 1997）。另一种是不精确牛顿法和截断牛顿法（Nash, 2000b），在其中我们部分求解（线性）牛顿方程，特别是对于截断牛顿法，使用如共轭梯度等近似迭代方法。这类方法中有许多细节，有时对于提高寻找解的效率至关重要。糟糕的是，根据我的经验，这些细节在某些问题上可以带来方法巨大的改进，但在另一些问题上可能是有害的。\n\
  \n## 2.10 无导数方法\n\n当解析导数极其困难或无法提供时，有必要使用仅依赖函数值的方法。我赞同 Conn 等人 2009 中提出的观点，即无导数优化方法是必要的，但如果有梯度，则不应使用它们。\n\
  \n### 2.10.1 梯度的数值近似\n\n对于参数数量较少且底层具有导数（但我们不愿意或无法生成相应的代码）的问题，梯度的数值近似有时是一个可行的选择。通常，非常粗略的近似就足够获得合理的解，但可能效率较低。第\
  \ 10 章讨论了数值导数近似的使用。\n\n### 2.10.2 近似与下降\n\n在参数域的单点进行工作的替代方法是选择一组点，并根据这些点的值对目标函数进行建模。模型只需要粗略地近似目标函数，尽管我们通常假设在最小值处它是“足够接近”。一旦有了模型，我们就计算建模函数的最小值（或某些较低的点）并移动到该最小值处。如果该点的目标函数在某些方面比已评估的点“更好”，则将新点加入建模集合，可能会删除一个或多个点，并重复该过程。这种“近似与下降”的方法也可用于目标函数只能进行近似评估的情况，尽管评估中的不确定性意味着我们必须使用更多的近似点。参考\
  \ Nash 2003 以了解其中一种方法。\n\n### 2.10.3 启发式搜索\n\n暴力法是简单地在各种点上评估目标函数，然后在最低点或点附近重复该过程。然而，网格搜索或随机搜索都可以通过更聪明的搜索来改进。有很多方法可以实现，它们使用了不同的思想和假设。\n\
  \n一种早期方法是沿坐标轴进行简单搜索（轴搜索）配合模式移动，由 Hooke 和 Jeeves 1961 提出。这种方法通常很可靠但效率低下。然而，Torczon\
  \ 1995 扩展并改进了这些思想。\n\n针对 ![c02-math-0079](img/c02-math-0079.png) 参数的另一种且流行的方法，是从具有最小值的\
  \ ![c02-math-0080](img/c02-math-0080.png) 点的多面形（或单纯形）开始。开发了多种演化多面形的方案。最常用的是 Nelder\
  \ 和 Mead 1965 的方法，它使用最高点通过质心（平均值）的反射。\n\n尽管有很多关于 Nelder 方法缺陷的论文，它仍然是最常用的方法之一，对其的大多数“改进”都被放弃了。然而，值得提到\
  \ Kelley 1997 的思想，它们已实现在 **dfoptim** 的 `nmk()` 和 `nmkb()` 函数中。\n\n## 2.11 随机方法\n\
  \n当目标函数有很多最小值且寻找全局最小值时，通常尝试随机方法。这类方法非常多。事实上，我怀疑有很多命名方法实际上是同一种。\n\n*   模拟退火 (Kirkpatrick\
  \ et al. 1983)\n*   禁忌搜索 (Glover, 1989)\n*   量子退火 ([`en.wikipedia.org/wiki/Quantum_annealing`](https://en.wikipedia.org/wiki/Quantum_annealing))\n\
  *   概率集合 (Rajnarayan et al. 2006)\n*   反应式搜索优化 ([`www.reactive-search.org`](http://www.reactive-search.org))\n\
  *   交叉熵方法 (Boer et al. 2002)\n*   随机搜索，有许多方法，最早的之一是 Bremmerman 1970 的\n*   随机隧道\
  \ (Wenzel 和 Hamacher, 1999)\n*   并行回火，也称为 *副本交换 MCMC 采样* (Geyer, 1991; Swendsen\
  \ and Wang, 1986)\n*   随机爬山算法或随机梯度下降（许多研究人员似乎在机器学习和遗传算法结合使用这些术语）\n\n\n\n\n\n*  \
  \ （粒子）群算法 (Kennedy and Eberhart, 1995)\n*   演化操作，由 George Box 于 20 世纪 50 年代开始用于过程优化，影响了其他演化算法的发展\n\
  *   遗传算法是演化算法的一种形式，许多贡献早在 20 世纪 50 年代就开始，但可能由 Holland 于 1975 年确立。\n\n此外，当然还有许多由用户开发的随机优化方法。如果局部最优点的数量较少，那么对常规最小化器进行随机启动是一种常见且通常有效的策略。例如，Varadhan\
  \ 和 Gilbert (2009a) 在 `BB` 包中提供了函数 `multiStart`。\n\n对随机优化方法产生不满意的主要原因是它们无法提供任何保证其已经获得成功。坦率地说，具有成功保证的全局优化方法要么难以实现、要么难以使用或两者兼有，否则它们早已取代随机方法了。对于特定的函数形式，我们可能应用专门的方法，如\
  \ Hompack（Watson et al. 1997）或区间分析（Hansen and Walster, 2004），但大多数用户将难以确认他们的问题是否符合此类方法所需条件。据我所知，R\
  \ 语言中也没有用于此类技术的程序包。\n\n## 2.12 基于约束的方法——数学规划\n\n虽然 R 在数学规划（MP）工具方面较薄弱，但重要的是，在更广泛的社区中，有一大量的工具用于解决优化问题，这些问题主要通过对参数施加的约束来定义。线性规划（LP）问题是指在满足若干不等式约束的情况下，最小化参数的线性函数，通常还结合参数的非负条件，这是经典的计算问题之一，并有大量的文献。原始的\
  \ Dantzig 单形法仍然是一个受关注的话题 (Nash, 2000)。\n\n当我们有一个二次目标函数但仍有线性不等式时，我们就得到了二次规划（QP）问题。因此，线性约束最小二乘问题可以通过\
  \ QP 方法求解。更通用的数学规划问题（有时称为非线性规划 (NLP））可能非常难以正确表述和求解。它们可能无解、多解，或者求解器可能无法找到接受的解。然而，针对此类问题的某些类别的方法正在逐渐开发中。\n\
  \n凸优化是指目标函数和约束在参数空间上是凸函数，且允许参数的集合也是凸集，它提供了一类优化问题，这些问题非常有用，但 R 中没有设计用于求解它们的工具。\n\n\
  R 也往往倾向于处理更多的连续（即“实数”）数字，而许多数学规划任务涉及选择、分配、序列和其他本质上离散的参数，这些参数用整数处理更好。\n\n## 参考文献\n\
