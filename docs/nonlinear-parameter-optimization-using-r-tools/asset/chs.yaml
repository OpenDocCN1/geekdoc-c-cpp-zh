  \ R 中有一个常见的令人恼恼的问题，即相同的数值在不同函数中具有不同的名称，例如 `start`、`pvec`、`prm` 和 `x`。写这一部分让我想起，在这方面我也是罪魁祸首之一。\n\
  \n在统计学之外，优化通常关注另一种类型的不确定性，即约束限制的严格程度。显然，我们不能放宽会导致 `log(0)` 或类似不可能情况的边界。然而，许多边界是政策性问题，例如某些经济模型中商品的价格底价。在后一种情况下，我们可以考虑目标函数随约束条件（即边界）单位变化的变化率。这就是`影子价格`（[http://en.wikipedia.org/wiki/Shadow_price]）的概念。该概念通常与线性规划相关，我不知道有任何\
  \ R 包能为非线性函数最小化的边界解提供此类信息。\n\n## 附录 11.A 函数 `transfinite`\n\n```r\n##- - - - - -\
  \ - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -\
  \ - - - - - - - -\n## t r a n s f i n i t e . R\n##- - - - - - - - - - - - - - -\
  \ - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -\n\
  transfinite <- function(lower, upper, n = length(lower)) {\n```\n\n\n\n\n*   这里有一个显式检查，确保我们的第三个参数在计算形式下（即指数化后）不会过大。\n\
  *   残差表示为“模型–数据”，如第 10 章所述，这并不是当今统计学家通常采用的选择。由于我们对残差进行了平方，结果是相同的，且残差的导数符号与模型导数的符号相同。这是一个很微小的点，但我发现它有助于减少误差。\n\
  \n现在必须将残差合并到似然函数。\n\n```r\nlhobbs.lik <- function(xaug, y = y0) {\n    #  sigma\
  \ 的似然函数\n    xl <- xaug[1:3]\n    logSigma <- xaug[4]\n    sigma2 = exp(2 * logSigma)\n\
  \    res <- lhobbs.res(xl, y)\n    nll <- 0.5 * (length(res) * log(2 * pi * sigma2)\
  \ + sum(res *\n        res)/sigma2)\n}\n```\n\n该函数显式地对似然乘积的对数取负。因此，我们可以相对于这四个参数对该函数进行`minimize`。再次注意，我们使用目标数值的对数作为我们的参数。\n\
  \n在这个问题中，虽然相当冗长，但通过链式法则推导梯度表达式相对容易，我们将这样做。首先，我们需要残差的雅可比矩阵。\n\n```r\nlhobbs.jac <-\
  \ function(xl, y) {\n    # 缩放后的 Hobbs 野草问题 -- 雅可比矩阵\n    x <- exp(xl)\n    jj <-\
  \ matrix(0, 12, 3)\n    t <- 1:12\n    yy <- exp(-x[3] * t)\n    zz <- 1/(1 + x[2]\
  \ * yy)\n    jj[t, 1] <- zz * exp(xl[1])\n    jj[t, 2] <- -x[1] * zz * zz * yy *\
  \ exp(xl[2])\n    jj[t, 3] <- x[1] * zz * zz * yy * x[2] * t * exp(xl[3])\n    return(jj)\n\
  }\n```\n\n从此，我们可以计算平方和函数的梯度。\n\n```r\nlhobbs.g <- function(xl, y) {\n    # 缩放后的\
  \ Hobbs 野草问题 -- 梯度\n    shj <- lhobbs.jac(xl, y)\n    shres <- lhobbs.res(xl, y)\n\
  \    shg <- as.vector(2 * (shres %*% shj))\n    return(shg)\n}\n```\n\n最后，我们将所有这些结合起来，得到负对数似然的梯度。\n\
  \n```r\nlhobbs.lg <- function(xaug, y = y0) {\n    #  sigma 的梯度函数\n    xl <- xaug[1:3]\n\
  \    logSigma <- xaug[4]\n    sigma2 = exp(2 * logSigma)\n    res3 <- lhobbs.res(xl,\
  \ y)\n    n <- length(res3)\n    f3 <- crossprod(res3)\n    g3 <- 0.5 * lhobbs.g(xl,\
  \ y)/sigma2\n    gg <- c(g3, (n - f3/sigma2))\n}\n```\n\n虽然我们可以建立一个仅包含三个参数的单独函数并通过求解最小二乘问题来获得逻辑参数的初步估计，但通过`masks`，我们可以使用刚刚创建的函数并固定\
  \ sigma 参数。以下是计算过程。注意我们如何使用向量 `bdmsk` 来固定第四个参数，以及非常粗略的初始值。\n\n```r\ny0 <- c(5.308,\
  \ 7.24, 9.638, 12.866, 17.069, 23.192, 31.443, 38.558,\n    50.156, 62.948, 75.995,\
  \ 91.972)\nrequire(Rvmmin)\n## Loading required package: Rvmmin\n## Loading required\
  \ package: optextras\n## Loading required package: numDeriv\nstart <- c(1, 1, 1,\
  \ 1)\nbdmsk <- c(1, 1, 1, 0)  # 起初固定参数 4\n## afix4<-Rvmmintry(start, lhobbs.lik,\
  \ lhobbs.lg, bdmsk=bdmsk,\n## y=y0, control=list(trace=2))\nafix4 <- Rvmmin(start,\
  \ lhobbs.lik, lhobbs.lg, bdmsk = bdmsk,\n    y = y0, control = list(trace = 0))\n\
  print(afix4)\n## $par\n## [1] 1 1 1 1\n##\n## $value\n## [1] 1520\n##\n## $counts\n\
  ## [1] 5 2\n##\n## $convergence\n## [1] -1\n##\n## $message\n## [1] \"Rvmminb appears\
  \ to have converged\"\n##\n## $bdmsk\n## [1] 1 1 1 0\n```\n\n现在让我们获取这次运行的参数，并将它们应用于所有参数自由的四参数问题中，即不使用掩码。\n\
  \n```r\nstart2 <- afix4$par\nprint(start2)\n## [1] 1 1 1 1\nbdmsk <- rep(1, 4) \
  \ ## 参数自由\naall <- Rvmmin(start2, lhobbs.lik, lhobbs.lg, bdmsk = bdmsk,\n    y =\
  \ y0)\nprint(aall)\n## $par\n## [1] 5.2791 3.8937 -1.1597 -0.7672\n##\n## $value\n\
  ## [1] 7.821\n##\n## $counts\n## [1] 393 91\n##\n## $convergence\n## [1] 0\n##\n\
  ## $message\n## [1] \"Rvmminb appears to have converged\"\n```\n\n最后，让我们回到四参数问题，比较两者的工作量。\n\
  \n```r\n## [1] 1 1 1 1\n## $par\n## [1] 5.2791 3.8937 -1.1597 -0.7672\n##\n## $value\n\
  ## [1] 7.821\n##\n## $counts\n## [1] 393 91\n##\n## $convergence\n## [1] 0\n##\n\
  ## $message\n## [1] \"Rvmminb appears to have converged\"\n##\n## Comparison of\
  \ work: Masked      vs.    Free\n##     Functions          398             393\n\
  ##     Gradients           93              91\n##  Exponentated parameters, last\
  \ is sigma:\n## [1] 196.1863  49.0916   0.3136   0.4633```我们看到工作量有所节省，尽管在现代计算机上时间节省并不明显。更重要的是，当所有参数自由时，有时很难获得解，而分阶段的方法可以成功。\n\
  \n## 12.3 非最小二乘法的掩码\n\n`nlmrt` 包允许使用参数名称来指定掩码。这是一个三参数逻辑回归 Bates 形式的小示例，我们将上渐近固定为一个特定值。\n\
  \n```r\nweeddata <- data.frame(y = y0, t = 1:12)\nmystart <- c(Asym = 250, xmid\
  \ = 6, scal = 1)  # 设置 Asym 值\nrequire(nlmrt)  # 确保可用\n## Loading required package:\
  \ nlmrt\nmaskrun <- nlxb(y ~ Asym/(1 + exp((xmid - t)/scal)), start = mystart,\n\
  \    data = weeddata, mask = c(\"Asym\"), trace = FALSE)\nmaskrun\n## nlmrt class\
  \ object: x\n## residual sumsquares =  6.0738  on  12 observations\n##     after\
  \  6    Jacobian and  7 function evaluations\n##   name        coeff        SE \
  \     tstat     pval      gradient   JSingval\n## Asym             250  M      \
  \ NA        NA           0       52.8\n## xmid         13.8144          NA     \
  \   NA   3.094e-06       12.9\n## scal         3.43303          NA        NA  -6.946e-06\
  \          0\n```\n\n在上面的输出中，我们注意到标准误差估计和 ![c12-math-0009](img/c12-math-0009.png)-统计量被省略了。这是因为降维问题的雅可比矩阵现在是奇异的。当然，我们可以像下面一样重构问题。然而，调整包函数以提供适当估计是我的“待办事项”列表。\n\
  \n```r\nmystart2 <- c(xmid = 6, scal = 1)  # 设置 Asym 值\nmaskrun2 <- nlxb(y ~ 250/(1\
  \ + exp((xmid - t)/scal)), start = mystart2,\n    data = weeddata)\nmaskrun2\n##\
  \ nlmrt class object: x\n## residual sumsquares =  6.0738  on  12 observations\n\
  ##     after  6    Jacobian and  7 function evaluations\n##   name      coeff  \
  \      SE      tstat      pval      gradient    JSingval\n## xmid       13.8144\
  \     0.04945     279.3          0   3.094e-06        52.8\n## scal       3.43303\
  \     0.03772        91  6.661e-16  -6.946e-06        12.9\n```\n\n## 12.4 掩码的其他方法\n\
  \n显然，我们可以通过显式编码适当函数来采用掩码的`想法`。当然，当我们的目标是估计全参数化模型时，这需要更多工作。作者感到惊讶的是，掩码的想法在非线性参数估计软件中并不常见。包含该想法的工具之一是\
  \ AD Model Builder (ADMB)，在其中它被称为“阶段”(phases)。在 ADMB 中，参数通过下界、上限以及一个给出其允许参与优化的“阶段”的整数来指定。\n\
  \n在基础 R 附带的 `stats4` 包中，`mle()` 函数声允许用户指定固定值的参数，但我尝试使用该函数时没有成功。相比之下，来自 `bbmle` 包的非常类似的\
  \ `mle2()` (Bolker and Team, 2013) 看起来运行良好。它包含了相同的固定参数的功能，即 `fixed=list(parameter=\
  \ value)`。在第 21.1 节中有一个示例。\n\n\n\n\n\n`maxLik` 软件包 (Toomet and Henningsen, 2008)\
  \ 也允许作者所说的“固定参数”。在这里，需要固定（掩码）的参数通过一个向量来指定，该向量给出了参数向量中待固定值所在的位置。对于参数较多的情况，这会比我在 `bdmsk`\
  \ 中在相应位置使用零指示器的方法更整洁。更好的方法是——一个我可能会复制的想法——它们允许使用一个相关参数的字符名称向量。\n\n# 第 13 章 处理一般约束\n\
  \n在本章中，我们考虑既不是边界（bounds）也不是掩码（masks）的约束。如果有很多此类约束，那么该问题通常被视为**数学规划**，参见第 14 章，而且约束通常是线性的。可能还存在其他特征，例如所有变量都是整数，或者整数与实数参数的混合。这类问题在统计学中通常并不常见，但人们的兴趣日益增长。\n\
  \n然而，在本章中，我们考虑的是只有几个约束的问题，因此关注的重点仍然是目标函数。\n\n## 13.1 等式约束\n\n根据我的经验，等式约束通常比不等式约束更棘手。这听起来可能很矛盾。毕竟，每个等式约束都应该使问题的维度减少一个参数。困难之处在于选择消除哪一个参数。\n\
  \nNash (1979, p. 184) 提出了一个问题（报告的结果似乎是错误的），该问题显然是一个线性回归，只是其中四个系数之间存在联系。我们有六个变量 ![c13-math-0001](img/c13-math-0001.png)，并且想要模型\n\
  \n**13.1** ![equation](img/c13-math-0002.png)\n\n然而，存在一个约束使得\n\n**13.2** ![equation](img/c13-math-0003.png)\n\
  \n在这个例子中，显而看出我们可以解出四个参数中的任何一个。问题的数据是从一个逗号分隔值 (CSV) 文件读取的。根据数据集和问题的来源，我将其称为哈桑问题（Hassan\
  \ problem）。\n\n首先，让我们找到无约束解并检查约束的违反情况。\n\n```\nhn <- read.csv(\"hassan182.csv\"\
  , header = TRUE)\nconvi <- function(x, dta) {\n    # dta not used\n    h <- rep(NA,\
  \ 1)  # vector value\n    h[1] <- x[3] * x[6] - x[4] * x[5]\n    h\n}\nuncmod <-\
  \ lm(one ∼ two + three + four + five + six, data = hn)\nuncmod\n##\n## Call:\n##\
  \ lm(formula = one ∼ two + three + four + five + six, data = hn)\n##\n## Coefficients:\n\
  ## (Intercept)          two        three         four\n##     -1.1352       0.9460\
  \       0.0997      -0.0276\n##        five          six\n##    -31.4896      56.1636\n\
  bu <- coef(uncmod)\ncat(\"Constraint violation = b3*b6-b4*b5 =\", as.numeric(convi(bu)),\n\
  \    \"\\n\")\n## Constraint violation = b3*b6-b4*b5 = 4.7287\ncat(\"Sum of squared\
  \ residuals = \", as.numeric(crossprod(uncmod$residuals)),\n    \"\\n\")\n## Sum\
  \ of squared residuals =  891.99\n```\n\n一个小的警告。非线性最小二乘法代码 `nls()`、`nlxb()` 和 `nlsLM()`\
  \ 接受的模型表达式类似于但**并不于**用于 `lm()` 构建 `uncmod` 时使用的表达式。由于线性模型是非线性模型的特例，我们本可以使用这些函数来执行上述计算。为了做到，我们需要显式地添加系数，即：\n\
  \n```\nuncmod2 <- nls(one ∼ b1 + two * b2 + three * b3 + four * b4 +\n    five *\
  \ b5 + six * b6, data = hn)\n## Warning: No starting values specified for some parameters.\n\
  ## Initializing ‘b1’, ‘b2’, ‘b3’, ‘b4’, ‘b5’, ‘b6’ to ‘1.’.\n## Consider specifying\
  \ ‘start’ or using a selfStart model\nsummary(uncmod2)\n##\n## Formula: one ∼ b1\
  \ + two * b2 + three * b3 + four * b4 + five * b5 + six *\n##     b6\n##\n## Parameters:\n\
  ##    Estimate Std. Error t value Pr(>|t|)\n## b1  -1.1352    41.3043   -0.03  \
  \  0.978\n## b2   0.9460     0.1917    4.93    8e-05 ***\n## b3   0.0997     0.0576\
  \    1.73    0.099\n## b4  -0.0276     0.0305   -0.91    0.376\n## b5 -31.4895 \
  \   34.9621   -0.90    0.378\n## b6  56.1637    37.3244    1.50    0.148\n## - -\
  \ -\n## Signif. codes:  0 ‘***’ 0.001 ‘**’ 0.01 ‘*’ 0.05 ‘.’ 0.1\n##\n## Residual\
  \ standard error: 6.68 on 20 degrees of freedom\n##\n## Number of iterations to\
  \ convergence: 3\n## Achieved convergence tolerance: 4.18e-07\n```\n\n对于受约束问题的求解，我们在这里将三种方法：\n\
  \n*   求解约束方程，用其他参数来表示其中一个参数，并将其代入上述模型。\n*   使用受非线性等式（或不等式）约束限制的非线性优化工具，其中 `alabama`\
  \ 和 `Rsolnp` 看起来最有前景；\n*   定义一个惩罚目标函数，其中我们添加一个正因子乘以约束违反情况的平方和，并随着惩罚因子的增加进行顺序求解。每个解的参数将作为下一个惩罚更强的解的起始值值输入。对于目前这个具有相当糟糕性质的问题，我们将看到得到离理想结果很远的答案是非常容易的。\n\
  \n### 13.1.1 参数消除\n\n在这个问题中，“求解”其中一个参数的困难之一在于我们存在除以零的可能性。例如，如果我们解出\n\n**13.3** ![equation](img/c13-math-0004.png)\n\
  \n并且 ![c13-math-0005](img/c13-math-0005.png) 接近零，我们可以预计算法和程序会出现问题。尽管有这种可能性，我们仍然可以尝试通过用其他参数表示一个参数并对生成的模型使用非线性最小二乘来处理问题，或者使用优化器最小化这些残差的和。\n\
  \n## 参考文献\n\n1. Bolker B and Team RDC 2013 *bbmle: Tools for general maximum likelihood\
  \ estimation*. R package version 1.0.13.\n2. Toomet O and Henningsen A 2008 Sample\
  \ selection models in r: package sample selection. *Journal of Statistical Software*\
  \ **27**(7), 1–23.\n\n\n\n\n\n```\nres3 <- function(x, dta) {\n    b1 <- x[1]\n\
  \    b2 <- x[2]\n    # b3<-x[3]\n    b4 <- x[3]\n    b5 <- x[4]\n    b6 <- x[5]\n\
  \    res <- dta$two * b2 + dta$three * b4 * b5/b6 + dta$four *\n        b4 + dta$five\
  \ * b5 + dta$six * b6 + b1 - dta$one\n    return(-res)\n}\nss3 <- function(x, dta)\
  \ {\n    res <- res3(x, dta)\n    sum(res * res)\n}\nrequire(nlmrt)\n## Loading\
  \ required package: nlmrt\nrequire(optimx)\n## Loading required package: optimx\n\
  st3 <- setNames(bu[-3], c(\"b1\", \"b2\", \"b4\", \"b5\", \"b6\"))\nanlfb3 <- try(nlfb(start\
  \ = st3, resfn = res3, dta = hn))\nif (class(anlfb3) != \"try-error\") {\n    cnb3\
  \ <- coef(anlfb3)\n    print(cnb3)\n    cat(\"RSS=\", crossprod(anlfb3$resid), \"\
  \\n\")\n} else {\n    cat(\"Error - failed\\n\")\n}\n##         b1         b2  \
  \       b4         b5         b6\n## -28.680156   1.036184  -0.042352 -41.310598\
  \  79.207696\n## attr(,\"pkgname\")\n## [1] \"nlmrt\"\n## RSS= 985.52\n## derived_b3\n\
  cnb3[\"b4\"] * cnb3[\"b5\"]/cnb3[\"b6\"]\n##       b4\n## 0.022089\n## Try optimx\n\
  aop3 <- optimx(st3, fn = ss3, gr = \"grnd\", dta = hn, control = list(all.methods\
