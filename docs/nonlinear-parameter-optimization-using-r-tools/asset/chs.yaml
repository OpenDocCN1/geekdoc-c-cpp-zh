  \   1.887e-16\ntnlfb1 <- try(nlfb(bb1, lanc.res, trace = FALSE, data = Lanczos1))\n\
  tnlfb1\n## nlmrt class object: x\n## residual sumsquares =  5.3036e-09  on  24 observations\n\
  ##     after  9    Jacobian and  10 function evaluations\n##   name       coeff\
