  \ 或 ![c13-math-0035.png](img/c13-math-0035.png) 定义的目标函数会随着参数的尺度而改变。此外，约束 ![c13-math-0036.png](img/c13-math-0036.png)\
  \ 有效地施加了 ![c13-math-0037.png](img/c13-math-0037.png)。`BB` 包中的优化器 `spg()` 允许我们将搜索方向投影以满足约束。因此，我们可以以下方法：\n\
  \n```\nrequire(BB, quietly = TRUE)\nnllrv <- function(x) {\n    -sum(log(x))\n}\n\
  nllrv.g <- function(x) {\n    -1/x\n}\nproj <- function(x) {\n    x/sum(x)\n}\n\
  n <- 5\naspg <- spg(par = (1:n)/n², fn = nllrv, gr = nllrv.g, project = proj)\n\
  ## iter:  0  f-value:  11.3069  pgrad:  0.360757\naspgn <- spg(par = (1:n)/n², fn\
  \ = nllrv, project = proj)\n## iter:  0  f-value:  11.3069  pgrad:  0.133333\ncat(\"\
  F_optimal: with gradient=\", aspg$value, \"  num. approx=\",\n    aspgn$value, \"\
  \\n\")\n## F_optimal: with gradient= 8.04719   num. approx.= 8.04719\npbest <- rep(1/n,\
  \ n)\ncat(\"fbest = \", nllrv(pbest), \"  when all parameters = \", pbest[1],\n\
  \    \"\\n\")\n## fbest =  8.04719   when all parameters =  0.2\ncat(\"deviations:\
  \  with gradient=\", max(abs(aspg$par - pbest)),\n    \"   num. approx.=\", max(abs(aspg$par\
  \ - pbest)),\n## deviations:  with gradient= 8.04719   num. approx.= 8.04719\n```\n\
  \n## 13.3 不等式约束\n\nKovalchik 等人 (2013) 提出了一种有趣且易读的方法来估计他们称为 EXPIT 模型。这种方法试图解释二进制响应\
  \ ![c13-math-0038.png](img/c13-math-0038.png)，例如患疾病时为 1。模型使用了加法和乘法变量，这些变量被放在 ![c13-math-0039.png](img/c13-math-0039.png)\
  \ 和 ![c13-math-0040.png](img/c13-math-0040.png) 中。为了解释方便，我将其简化为单个加法协变量 ![c13-math-0041.png](img/c13-math-0041.png)\
  \ 和单个乘法协变量 ![c13-math-0042.png](img/c13-math-0042.png)。真实未知的 ![c13-math-0043.png](img/c13-math-0043.png)\
  \ 被假设服从伯努利（即二一）分布，其概率参数（是 ![c13-math-0044.png](img/c13-math-0044.png) 和 ![c13-math-0045.png](img/c13-math-0045.png)\
  \ 的函数）\n\n**13.4** ![equation](img/c13-math-0046.png)\n\n其中概率显然被限制在 0 和 1 之间。事实上，这个概率不应该实际取这些端值，否则我们没有变异。\n\
  \n**13.5** ![equation](img/c13-math-0047.png)\n\n其中\n\n**13.6** 是反 logit 函数。logit\
  \ 函数是\n\n**13.7** ![equation](img/c13-math-0049.png)\n\n\n\n\n\n```\nexpit <- function(q)\
  \ {\n    zz <- exp(q)\n    zz/(1 + zz)\n}\nlogit <- function(p) {\n    log(p/(1\
  \ - p))\n}\nnegll <- function(par, data) {\n    yy <- data$y\n    ss <- data$sugar\n\
  \    aa <- data$age\n    beta0 <- par[1]\n    gam0 <- par[2]\n    gam1 <- par[3]\n\
  \    ppi <- beta0 * ss + expit(gam0 + gam1 * aa)\n    ## need to watch out for ppi\
  \ out of bounds\n    if (any(ppi >= 1) || any(ppi <= 0)) {\n        val <- 1e+200\n\
  \    } else {\n        val <- -sum(log(1 - ppi)) - sum(yy * logit(ppi))\n    }\n\
  \    val\n}\n```\n\nKovalchik 等人 (2013) 建议，从数据中某种方式导出初始值是有用的。在这里，我们将采用非常粗略的方法，设置\
  \ ![c13-math-0051](img/c13-math-0051.png)。这意味着我们有一个更简单的逻辑回归模型，我们可以按照如下方式对其进行估计：\n\
  \n```\ntglm <- glm(y ∼ age, family = binomial(logit), data = mydata)\npars <- c(0,\
  \ coef(tglm))\nnames(pars) <- c(\"beta0\", \"gam0\", \"gam1\")\npars\n##      beta0\
  \       gam0       gam1\n##  0.0000000 -4.6583342  0.0504476\n```\n\n现在我们可以继续拟合\
  \ LEXPIT 模型了。我们将尝试所有的 `optimx` 方法。\n\n```\nrequire(optimx)\naoptimx <- optimx(pars,\
  \ negll, \"grnd\", method = \"all\", control = list(trace = 0),   data = mydata)\n\
  ## Warning: Replacing NULL gr with ‘grnd’ approximation\n## Warning: bounds can\
  \ only be used with method L-BFGS-B (or Brent)\n## Warning: bounds can only be used\
  \ with method L-BFGS-B (or Brent)\n## Warning: bounds can only be used with method\
  \ L-BFGS-B (or Brent)\nprint(summary(aoptimx, order = value))\n##              \
  \   beta0     gam0      gam1        value\n## Rcgmin      0.1566348 -5.79545 0.0632420\
  \  1.99324e+02\n## ucminf      0.1566348 -5.79545 0.0632420  1.99324e+02\n## Rvmmin\
  \      0.1566348 -5.79545 0.0632420  1.99324e+02\n## nlminb      0.1566348 -5.79545\
  \ 0.0632420  1.99324e+02\n## nmkb        0.1566367 -5.79532 0.0632398  1.99324e+02\n\
  ## nlm         0.1565503 -5.79397 0.0632233  1.99324e+02\n## spg         0.1565252\
  \ -5.79387 0.0632229  1.99324e+02\n## hjkb        0.1563568 -5.79060 0.0631810 \
  \ 1.99324e+02\n## BFGS        0.0815319 -4.67534 0.0494269  2.00107e+02\n## CG \
  \         0.0815319 -4.67534 0.0494269  2.00107e+02\n## Nelder-Mead 0.0815319 -4.67534\
  \ 0.0494269  2.00107e+02\n## L-BFGS-B    0.0815319 -4.67534 0.0494269  2.00107e+02\n\
  ## bobyqa      0.0206010 -4.65833 0.0504476  2.00391e+02\n## newuoa            \
  \ NA       NA        NA 8.98847e+307\n##             fevals gevals niter convcode\
  \  kkt1 kkt2 xtimes\n## Rcgmin        1007    150    NA        1  TRUE TRUE  0.736\n\
  ## ucminf          18     18    NA        0  TRUE TRUE  0.072\n## Rvmmin       \
  \   71     12    NA        0  TRUE TRUE  0.060\n## nlminb          29     14   \
  \ 13        0  TRUE TRUE  0.060\n## nmkb           217     NA    NA        0  TRUE\
  \ TRUE  0.040\n## nlm             NA     NA    16        0  TRUE TRUE  0.008\n##\
  \ spg           2342     NA    1304        0  TRUE TRUE  0.660\n## hjkb        \
  \  2132     NA    19        0  FALSE 0.292\n## BFGS            13     13    NA \
  \       0  FALSE 0.044\n## CG              13     13    NA        0  FALSE 0.048\n\
  ## Nelder-Mead     13     13    NA        0  FALSE 0.052\n## L-BFGS-B        13\
  \     13    NA        0  FALSE 0.048\n## bobyqa          21     NA    NA       \
  \ 0  FALSE 0.004\n## newuoa          NA     NA     9999    NA  0.004\n```\n\n我们看到大多数方法都找到了合理的解决方案。我们也可以尝试受约束优化包\
  \ `alabama` 和 `Rsolnp`。首先，我们需要定义不等式约束。\n\n```\npibnd <- function(par, data) {\n\
  \    # inequality constraints\n    yy <- data$y\n    nobs <- length(yy)\n    ss\
  \ <- data$sugar\n    aa <- data$age\n    beta0 <- par[1]\n    gam0 <- par[2]\n \
  \   gam1 <- par[3]\n    ppi <- beta0 * ss + expit(gam0 + gam1 * aa)\n    hh <- rep(NA,\
  \ 2)\n    # Note probability bounded at both 0 and 1\n    hh <- c((ppi - 1e-04),\
  \ (1 - 1e-04 - ppi))\n    hh\n}\nyy <- mydata\nnobs <- length(yy)\nlo <- rep(1e-04,\
  \ nobs)\nup <- 1 - lo\nrequire(alabama)\ncoo <- list(trace = FALSE)\naaug <- auglag(par\
  \ = pars, fn = negll, hin = pibnd, data = mydata, control = coo)\naaug$par\n## \
  \     beta0       gam0       gam1\n##  0.1501910 -5.6903499  0.0619483\naaug$value\n\
  ## [1] 199.33\naaug$convergence\n## [1] 0\naco <- constrOptim.nl(par = pars, fn\
  \ = negll, hin = pibnd, data = mydata, control = coo)\naco$par\n##      beta0  \
  \     gam0       gam1\n##  0.1501612 -5.6901151  0.0619458\naco$value\n## [1] 199.33\n\
  aco$convergence\n## [1] 0\n```\n\n在本部分的最后，我们尝试 `Rsolnp`。\n\n```\nrequire(Rsolnp)\n\
  pineq <- function(par, data) {\n    # we will compute functions that obey the ineqLB\
  \ and ineqUB\n    # constraints\n    yy <- data$y\n    nobs <- length(yy)\n    ss\
  \ <- data$sugar\n    aa <- data$age\n    beta0 <- par[1]\n    gam0 <- par[2]\n \
  \   gam1 <- par[3]\n    ppi <- beta0 * ss + expit(gam0 + gam1 * aa)\n}\nasolnp <-\
  \ solnp(pars = pars, fun = negll, ineqfun = pineq, ineqLB = lo,\n    ineqUB = up,\
  \ data = mydata)\n##\n## Iter: 1 fn: 199.3254  Pars:   0.15280 -5.74331  0.06263\n\
  ## Iter: 2 fn: 199.3239  Pars:   0.15663 -5.79529  0.06324\n## Iter: 3 fn: 199.3239\
  \  Pars:   0.15663 -5.79529  0.06324\n## solnp- - > Completed in 3 iterations\n\
  asolnp$pars\n##     beta0      gam0      gam1\n##  0.156626 -5.795292  0.063240\n\
  negll(asolnp$pars, mydata)\n## [1] 199.324\n```\n\n虽然我们看到几种方法已经相当满意地解决了这个估计问题，但我想要提醒，一个重要的步骤是为参数提供合理的初始值。受约束问题似乎比其无约束对应版本需要更好的起始点，但这是基于有限经验的观点，而非详尽的证据。\n\
  \n## 13.4 惩罚函数方法的视角\n\n对数障碍函数（logarithmic barrier function）通常用于使目标函数变得非常大，从而使参数偏离约束。另一种方法是对比违反约束的行为进行惩罚。这实际上允许参数取不可行的值，即边界之外的值。增加惩罚的权重或控制允许我们使其更加严格，并且如果我们能忍受这种语言上的折磨，通常情况下参数会变得不那么不可行。\n\
  \n## 13.5 评估\n\n在本章中，我们看到有几种方法可以使用 R 来处理带有通用约束的优化问题。有哪些教训？以下是我的观点：\n\n- 作为第一次尝试，最好坚持原始陈述的问题，并验证目标函数和约束。\n\
  - 保持任何缩放简单，例如 10 的幂次。这有助于优化软件更容易处理问题，并且不涉及容易出错的复杂代数。\n- 等式约束的处理可能非常困难。如果可能，我倾向于消除一个或多个参数，但正如我们看到的，需要考虑消除哪些参数。\n\
  - 惩罚方法简单且适用于探索问题，特别是当允许不可行的参数时。否则，障碍函数可以保持参数可行，但我们确实需要一个初始可行参数集。\n- 良好的起始参数对于成功很重要。\n\
  - 作为持续检查，评估问题原始规范中的目标函数和约束。\n\n\n\n\n\n## 参考文献\n\n1. Geradin M 1971 The computational\
  \ efficiency of a new minimization algorithm for eigenvalue analysis. *Journal of\
  \ Sound and Vibration* **19**, 319–331.\n2. Kovalchik SA, Varadhan R, Fetterman\
  \ B, Poitras NE, Wacholder S, and Katki HA 2013 A general binomial regression model\
  \ to estimate standardized risk differences from binary response data. *Statistics\
  \ in Medicine* **32**(5), 808–821.\n3. Nash JC 1979 *Compact Numerical Methods for\
  \ Computers: Linear Algebra and Function Minimisation*. Adam Hilger, Bristol. Second\
  \ Edition, 1990, Bristol: Institute of Physics Publications.\n\n# 第 14 章：数学规划的应用\n\
  \n在我看来，数学规划是在满足约束条件的同时，尝试使目标函数最小化或最大化。也就是说，存在“许多”约束条件，而它们是我们关注的首要重点。此外，该学科受到许多实际资源分配问题的驱动，因此变量也可能是整数，而不仅仅是或作为实数。\n\
  \n## 14.1 数学规划的统计学应用\n\n在这一领域，R 显示了它的统计学传统，但并非处于前沿。大多数统计学家并不使用数学规划。我自己也是如此。我对这类工具的需求很大程度上是由近似问题驱动的，我们希望最小化绝对误差之和或最大绝对误差。在某些情况下，我也想解决某些优化问题，例如饮食问题，其约束条件是营养素的总摄入量或对盐和脂肪的限制，而目标是最小化提供该饮食的成本。\n\
  \n20 世纪 80 年代，新南威尔士大学开展了一项由布鲁斯·穆塔格（Bruce Murtagh）指导的计划，以廉价的咨询价格为公司提供优化问题的学生帮助。我相信一家猫食品公司支付了\
  \ 5000 美元来确定一种罐装宠物食品的经济配方。通过线性规划确定的混合物使用了磨碎的鱼头、鱼油以及以谷物为主的成分，节省的费用是咨询费的许多倍。这并不是 R\
  \ 用户通常解决的问题。\n\n然而，它在统计学中也有一些应用。一个领域是对已发表的统计数据进行模糊化，使得通过从总数中减去来获取隐私信息变得困难或不可能。例如，加拿大统计局的报告《数据质量和机密标准与指南（公共）：2011\
  \ 年人口普查发布》（[`www12.statcan.gc.ca/census-recensement/2011/ref/DQ-QD/2011_DQ-QD_Guide_E.pdf`](http://www12.statcan.gc.ca/census-recensement/2011/ref/DQ-QD/2011_DQ-QD_Guide_E.pdf)）。戈登·桑德（Gordon\
  \ Sande）在向 2003 年（美国）联邦统计方法学委员会提交的一篇论文对此提出了一些观点（[`www.fcsm.gov/events/papers2003.html`](http://www.fcsm.gov/events/papers2003.html)）。该想法是使用约束条件使发布的数据足够远离实际数值，以防止通过计算揭示个人数据，同时以某种方式最小化扰动。麦卡锡和贝特曼（McCarthy\
  \ and Bateman, 1988）介绍了大型统计机构中数学规划的另一种用途，他们考虑了调查的设计。Bhat（2011）在他的博士论文引言中对统计学中的数学规划给出了非常好的概述，列出了列联表和假设检验中的一些应用，以及我之前提到的极小极大和最小绝对偏差问题。在机器学习中也有一些应用，例如，[`stackoverflow.com/questions/12349122/solving-quadratic-programming-using-r`](http://stackoverflow.com/questions/12349122/solving-quadratic-programming-using-r)。\n\
  \n## 14.2 用于数学规划的 R 包\n\n我们已经在第 13 章处理了一般的非线性规划问题。然而，我的经验是，尽管问题的正式陈述——即在可能的非线性约束下使非线性目标最小化——是本章传统线性和二次规划问题的推广，但许多问题的约束条件相当少。它们实际上是受约束的非线性函数最小化问题。\n\
  \n在第 13 章中，我们考虑了 `alabama`（Varadhan, 2012）和 `Rsolnp`（Ghalanos and Theussl, 2012）。在我看来，这些包在使用上比书中讨论的大多数包需要更多的关注和注意。`Rsolnp`\
  \ 是 R-forge 项目“R 中的整数和非线性优化 (RINO)”中列出的唯一包，但代码库中还有三个包。然而，在写作之前的这些包在 ![c14-math-0001](img/c14-math-0001.png)\
  \ 年间都没有更新，而 `Rsolnp` 似乎仍在维护。由于本段落中的包与函数最小化有更深的渊源，我们将在本章不再进一步讨论它们。\n\n大多数传统的数学规划涉及目标或约束的某些特殊形式，特别是具有线性或二次目标的线性约束。这导致了众所周知的**线性规划**（LP）和**二次规划**（QP）问题。\n\
  \n二次规划在 R 中有两个工具作为主要候选。来自 `quadprog` 包的 `Solve.QP()`（原始由 Berwin A. Turlach 开发，由\
  \ Andreas Weingessel 移植，2013）在我看来具有更传统的接口，而来自 `kernlab` 包的 `ipop()`（Karatzoglou\
  \ et al., 2004）则对线性约束有不寻常的格式。\n\n对于线性规划，`linprog`（Henningsen, 2012）和 `lpSolve`（Berkelaar\
  \ et al., 2013）有不同的调用序列。这两者都是针对实数的。然而，许多 LP 是针对整数或混合整数的。`Rglpk`（Theussl and Hornik,\
  \ 2013）提供了 Gnu LP 工具集的接口，并可以处理实数混合整数问题。同样的作者提供了 `Rsymphony`（Harter et al., 2013）和\
  \ `ROI`（Hornik et al., 2011）用于混合整数规划问题。这些都是复杂的包，其输入风格与我们在书中其他地方看到的完全不同。\n\n同样，伦敦大学学院的\
  \ Jelmer Ypma 提供了指向 Steven Johnson NLopt 的接口 `nloptr` 以及指向 COIN-OR 内点优化器的 `ipoptr`\
  \ `ipopt()`。（这不应与 `kernlab` 中的 `ipop()` 混淆。）\n\n这些都不是 CRAN 仓库的一部分，并且像前一段的工具一样，其安装方式与其他\
  \ R 包不常见。我决定不讨论这两组工具，因为我没有足够的经验来做出公平评价。然而，重要的是，内点法在过去二十年的优化文献中被广泛讨论，但目前还没有 R 包能解决这一需求。在写作时，R\
  \ 似乎也没有提供任何凸优化的工具。\n\n还有一些商业求解器的 R 接口。`Rcplex` 是 CPLEX 优化引擎的接口。该系列求解器的历史在 [`en.wikipedia.org/wiki/CPLEX`](http://en.wikipedia.org/wiki/CPLEX)\
  \ 中描述。该 R 接口似乎仅支持 Linux 平台。同样，`Rmosek`（[`rmosek.r-forge.r-project.org/`](http://rmosek.r-forge.r-project.org/)）是\
  \ MOSEK 求解器的 R 接口，并声称能够处理具有线性、二次和其他整数约束的大规模优化问题。再次，安装将是非标准的，因为用户必须首先安装商业软件包。我没有此类包的经验，在此不再进行介绍。\n\
  \n\n\n\n\n有一些 R 包是基于上述某些工具构建的。例如，用于“投资组合配置与风险管理应用”的 `parma` 包调用了 `Rgplk` 工具。在本章的剩余部分，我们将学习使用其中一些工具来解决具有统计性质的说明性问题。\n\
  \n## 14.3 示例问题：L1 回归\n\n传统的回归估计问题最小化残差平方和。然而，有许多理由支持基于残差的其他损失函数（L 无穷回归或极小值回归、M 估计量等）。在这里，我们将研究\
  \ L1 或最小绝对偏差（LAD）回归。对于线性模型，其表述为：\n\n**14.1** ![equation](img/c14-math-0002.png)\n\
  \n其中 ![c14-math-0003](img/c14-math-0003.png) 是预测变量矩阵（通常一列全为 1 以提供常数项或截距项），而 ![c14-math-0004](img/c14-math-0004.png)\
  \ 是独立变量或预测变量。我们不是最小化残差平方和，而是最小化绝对值之和。\n\n让我们设定一个小问题。\n\n```\nx <- c(3, -2, -1)\n\
  a1 <- rep(1, 10)\na2 <- 1:10\na3 <- a2²\nA <- matrix(c(a1, a2, a3), nrow = 10, ncol\
  \ = 3)\nA\n       [,1] [,2] [,3]\n  [1,]    1    1\n  [2,]    2    4\n  [3,]   \
  \ 3    9\n  [4,]    4   16\n  [5,]    5   25\n  [6,]    6   36\n  [7,]    7   49\n\
  \  [8,]    8   64\n  [9,]    9   81\n [10,]   10  100\n## create model\ny0 = A*%\
  \ x\ny0\n  [1,]    0\n  [2,]   -5\n  [3,]   -12\n  [4,]   -21\n  [5,]   -32\n  [6,]\
  \   -45\n  [7,]   -60\n  [8,]   -77\n  [9,]   -96\n [10,]  -117\n## perturb the\
  \ model data\nseed(1245)\ny <- as.numeric(y0) + runif(10, -1, 1)\ny\n  [1,]    0.324886\
  \ -4.428305 -12.85456 -20.393083\n  [5,]  -32.85457 -45.193280 -60.193202 -77.24378\n\
  \  [9,]  -96.406035 -117.24182\n## try least squares model\nl2fit <- lm(y ~ a2 +\
  \ a3)\nl2fit\n## Call:\nlm(formula = y ~ a2 + a3)\n## Coefficients:\n(Intercept)\
  \           a2            a3\n      3.737       -2.339       -0.976\n```\n\n结果显示优化器在求解\
  \ L1 范数问题时遇到了困难。同时也检查 L2 范数，发现它小得多。\n\n```\nsumabs <- function(x, y) {\n    # loss\
  \ function\n    abs(y - A*% x)\n}\nsumsq <- function(x, y) {\n    # loss function\n\
  \    (y - A*% x)²  # poor way to this\n}\nrequire(optimx)\nst <- rep(1, 3)\nans1\
  \ <- optimx(st, sumabs, method = \"all\", control = list(numDeriv = TRUE), A = A,\
  \ y = y)\n## Warning: Replacing NULL with 'numDeriv'\n## Warning: bounds only used\
  \ with L-BFGS-B (or Brent)\n## Warning: bounds only used with L-BFGS-B (or Brent)\n\
  ## Warning: bounds only used with L-BFGS-B (or Brent)\nprint(summary(ans1, order\
  \ = value))\n##                   p1        p2        p3        value\n## nmkb \
  \       3.605201 -2.302050 -0.978265  3.2951e+00\n## nlm         3.582684 -2.277278\
  \ -0.980520  3.2952e+00\n## ucminf      3.545880 -2.236248 -0.984252  3.2953e+00\n\
  ## hjkb        3.490341 -2.175003 -0.988822  3.2955e+00\n## Rvmmin      3.604006\
  \ -2.290916 -0.979367  3.3000e+00\n## nlminb      3.509092 -2.210676 -0.986442 \
  \ 3.3137e+00\n## bobyqa      3.418332 -2.049762 -1.004648  3.7761e+00\n## BFGS \
  \       3.352885 -1.263250 -1.054194  7.0721e+00\n## CG          3.352885 -1.263250\
  \ -1.054194  7.0721e+00\n## Nelder-Mead  3.352885 -1.263250 -1.054194  7.0721e+00\n\
  ## L-BFGS-B     3.352885 -1.263250 -1.054194  7.0721e+00\n## newuoa       0.427852\
  \ -0.821233 -1.104232  9.2086e+00\n## Rcgmin       0.902925 -0.542689 -1.288875\
  \  2.5024e+01\n## spg               NA        NA        NA  8.9847e+00\n##     \
  \        fevals gevals niter convcode  kkt1  kkt2\n## nmkb           257       \
  \ NA        NA      TRUE  0.032\n## nlm             NA        29      FALSE  0.004\n\
  ## ucminf          51        NA      FALSE  0.008\n## hjkb          674        NA\
  \        19      TRUE  0.108\n## Rvmmin         142        20        NA      FALSE\
  \  0.012\n## nlminb          54        22        NA      FALSE  0.004\n## bobyqa\
  \         206        NA        FALSE  0.004\n## BFGS           146        146  \
  \      NA      FALSE  0.016\n## CG             146        146        NA      FALSE\
  \  0.012\n## Nelder-Mead    146        146        NA      FALSE  0.016\n## L-BFGS-B\
  \       146        146        NA      FALSE  0.016\n## newuoa           302    \
  \    NA        FALSE  TRUE  0.004\n## Rcgmin         101        112        NA  \
  \    FALSE  0.036\n## spg               NA        9999        NA  0.160\n```\n\n\
  ans2 <- optimx(st, sumsq, method = \"all\", control = list(numDeriv = TRUE), A =\
  \ A, y = y)\n## Warning: Replacing NULL with 'numDeriv'\n## Warning: bounds only\
  \ used with L-BFGS-B (or Brent)\n## Warning: bounds only used with L-BFGS-B (or\
  \ Brent)\n## Warning: bounds only used with L-BFGS-B (or Brent)\nprint(summary(ans2,\
  \ order = value))\n##                   p1        p2        p3        value\n##\
  \ Rvmmin      3.716710 -2.338840 -0.975874  3.9129e+00\n## nlm         3.716710\
  \ -2.338840 -0.975874  3.9129e+00\n## ucminf      3.716710 -2.338840 -0.975874 \
  \ 3.9129e+00\n## nlminb      3.716710 -2.338840 -0.975874  3.9129e+00\n## BFGS \
  \       3.716710 -2.338840 -0.975874  3.9129e+00\n## CG          3.716710 -2.338840\
  \ -0.975874  3.9129e+00\n## Nelder-Mead  3.716710 -2.338840 -0.975874  3.9129e+00\n\
  ## L-BFGS-B     3.716710 -2.338840 -0.975874  3.9129e+00\n## newuoa       3.716710\
  \ -2.338840 -0.975874  3.9129e+00\n## Rcgmin       3.716710 -2.338840 -0.975874\
  \  3.9129e+00\n\n```\n\n然而，可以使用线性规划（LP）来解决由 `images/c14-math-0005.png` 观测值 `images/c14-math-0006.png`\
  \ 参数定义的 LAD 问题，这些参数由上述的 `images/c14-math-0007.png` 矩阵和 `images/c14-math-0008.png`\
  \ 向量定义。遵循 Bisschop 和 Roelofs (2006) 的方法，我们将该问题建立为最小化：\n\n**14.2** ![equation](img/c14-math-0009.png)\n\
  \n受限于约束：\n\n**14.3** ![equation](img/c14-math-0010.png)**14.4** ![equation](img/c14-math-0011.png)\n\
  \n这些看似奇异的约束同时实施，会将绝对残差和推向最小值。\n\n遗憾的是，大多数 LP 求解器会自动对我们想要的 `images/c14-math-0012.png`\
  \ 变量施加非负约束。我们通过定义以下内容来绕过这个问题：\n\n**14.5** ![equation](img/c14-math-0013.png)\n\n\
  \n\n\n其中变量 ![c14-math-0014](img/c14-math-0014.png) 和 ![c14-math-0015](img/c14-math-0015.png)\
  \ 是非负的。此外，我们在这里使用的求解器（来自 `linprog` 包的 `SolveLP()`）更倾向于将约束设置为 ![c14-math-0016](img/c14-math-0016.png)\
  \ 形式而非 ![c14-math-0017](img/c14-math-0017.png) 形式。为了这一点，我们构建了一个超矩阵。\n\n### 14.6\
  \ ![equation](img/c14-math-0018.png)\n\n约束的右侧是向量 (`bvec`)\n\n### 14.7 ![equation](img/c14-math-0019.png)\n\
  \n目标函数由一个向量 (`cvec`) 定义，该向量包含 ![c14-math-0020](img/c14-math-0020.png) 个 1 和 ![c14-math-0021](img/c14-math-0021.png)\
  \ 个 0。后者元素用于定义解的 ![c14-math-0022](img/c14-math-0022.png) 和 ![c14-math-0023](img/c14-math-0023.png)\
  \ 元素，而 1 则用于提供我们的目标函数。\n\n这种设置在下面的函数 `LADreg` 中实现，该函数的输入为矩阵 ![c14-math-0024](img/c14-math-0024.png)\
  \ 和向量 ![c14-math-0025](img/c14-math-0025.png)。\n\n```\nLADreg <- function(A, y)\
  \ {\n    # Least sum abs residuals regression\n    require(linprog)\n    m <- dim(A)[1]\n\
  \    n <- dim(A)[2]\n    if (length(y) != m)\n        stop(\"Incompatible A and\
  \ y sizes in LADreg\")\n    ones <- diag(rep(1, m))\n    Abig <- rbind(cbind(-ones,\
  \ -A, A), cbind(-ones, A, -A))\n    bvec <- c(-y, y)\n    cvec <- c(rep(1, m), rep(0,\
  \ 2 * n))  # m z's, n pos x, n neg x\n    ans <- solveLP(cvec, bvec, Abig, lpSolve\
  \ = TRUE)\n    sol <- ans$solution\n    coeffs <- sol[(m + 1):(m + n)] - sol[(m\
  \ + n + 1):(m + 2 * n)]\n    names(coeffs) <- as.character(1:n)\n    res <- as.numeric(sol[1:m])\n\
  \    sad <- sum(abs(res))\n    answer <- list(coeffs = coeffs, res = res, sad =\
  \ sad)\n}\n```\n\n让我们用它来解决我们的示例。\n\n```\nmyans1 <- LADreg(A, y)\nmyans1$coeffs\n\
  \         1         2         3\n##  3.489517 -2.174794\nmyans1$sad\n## [1] 3.2951\n\
  ```\n\n事实证明 R 中有专门用于此问题的工具。特别是来自 `pracma` 包的 `Llinreg()` 和来自 `quantreg` 包的 `rq()`\
  \ 可以完成这项工作。`quantreg` (Koenker, 2013) 还有非线性分位数回归函数 `nlrq()`。Koenker (2005) 在分位数回归领域有深远的影响，他的包非常成熟，推荐用于此应用。上述的临时处理方法旨在向读者介绍如何使用可用工具处理类似的问题。\n\
  \n```\nrequire(pracma)\nap1 <- Llinreg(A = A, b = y)\nap1$x\n## [1] 3.60510 -2.30189\
  \ -0.97828\n## reltol [1] 4.1772e-08\n## iter [1] 20\nsumabs(ap1$x, A)\n## [1] 3.2951\n\
  require(quantreg)\nqreg <- rq(y ~ a2 + a3, tau = 0.5)\n## Warning: Solution may\
  \ be nonunique\n## Call:\nrq(formula = y ~ a2 + a3, tau = 0.5)\n## Coefficients:\n\
  ## Intercept          a2          a3\n## 3.48951 -2.17479 -0.98983\n## Degrees of\
  \ freedom: 10\nxq <- coef(qreg)\nsumabs(xq, A)\n## [1] 3.2951\n```\n\n## 14.4 示例问题：minimax\
  \ 回归\n\n类似的问题是 minimax L-infinity 回归。对于线性模型，其表述为 14.8 ![equation](img/c14-math-0026.png)，其中\
  \ ![c14-math-0027](img/c14-math-0027.png) 是预测变量矩阵（通常一列为 1 提供常数项），![c14-math-0028](img/c14-math-0028.png)\
  \ 是自变量。也就是说，我们要最小化残差的最大值。再次，我们的传统优化方法并不理想。我们将使用上面的代码。\n\n```\nminmax <- function(x,\
  \ y) {\n    res <- y - A*% x\n    val <- max(abs(res))\n    attr(val, \"where\"\
  ) <- which(abs(res) == val)\n    val\n}\nminmax <- function(x, y) {\n    res <-\
  \ y - A*% x\n    val <- max(abs(res))\nrequire(optimx)\nst <- c(1, 1, 1)\nansmm1\
  \ <- optimx(st, minmax, method = \"grnd\", A = A, y)\n## Warning: Replacing NULL\
  \ with 'grnd' approximation\n## required package: numDeriv\n## Warning: bounds can\
  \ only be used with L-BFGS-B (or Brent)\n## Warning: bounds can only be used with\
  \ L-BFGS-B (or Brent)\n## Warning: bounds can only be used with L-BFGS-B (or Brent)\n\
  print(summary(ansmm1, order = value))\n##                   p1         p2      \
  \ p3    value fevals\n## ucminf      49      TRUE  0.040\n## Rvmmin      15    \
  \  FALSE  0.012\n## nmkb        24      FALSE  0.024\n## spg         141     FALSE\
  \  1.284\n```\n\n通过线性规划（LP）求解问题的设置与 LAD 回归（Bisschop and Roelofs, 2006）相当相似，但这次需要最小化的是单个最大残差。技巧在于我们需要选择残差集合中的哪一个绝对值最大。为了做到，我们约束所有残差都小于该元素。以下代码通过传统的线性规划计算解。\n\
  \n```\nmmreg <- function(A, y) {\n    # max abs residuals regression\n    require(linprog)\n\
  \    m <- dim(A)[1]\n    n <- dim(A)[2]\n    if (length(y) != m)\n        stop(\"\
  Incompatible A and y sizes in LADreg\")\n    onem <- rep(1, m)\n    Abig <- rbind(cbind(-A,\
  \ A, -onem), cbind(A, -A, -onem))\n    bvec <- c(-y, y)\n    cvec <- c(rep(0, 2\
  \ * n), 1)  # n pos x, n neg x, 1 t\n    ans <- solveLP(cvec, bvec, Abig, lpSolve\
  \ = TRUE)\n    sol <- ans$solution\n    coeffs <- sol[1:n] - sol[(n + 1):(2 * n)]\n\
  \    names(coeffs) <- as.character(1:n)\n    res <- as.numeric(A*% coeffs - y)\n\
  \    mad <- max(abs(res))\n    answer <- list(coeffs = coeffs, res = res, mad =\
  \ mad)\n}\n```\n\n让我们将其应用于我们的问题中。\n\n```\namm <- mmreg(A, y)\namm\n## $coeffs\n\
  \        1        2        3\n##  2.73966 -1.92954 -1.00881\n##\n## $res\n##  [1]\
  \ -0.5235670 -0.7263380  0.7263380 -0.7263380  0.7263380\n##  [6]  0.0386108  0.4914828\
  \ -0.0166592  0.0663623 -0.1947466\n##\n## $mad\n## [1] 0.726338\nmmcoef <- amm$coeffs\n\
  ## minimax 解的平方和\nprint(sumsqr(mmcoef, A, y))\n## [1] 2.67004\n## minimax 解的绝对残差和\n\
  print(sumabs(mmcoef, A, y))\n## [1] 4.23678\n```\n\n## 14.5 非线性分位数回归\n\n\n\n\nKoenker\
  \ 的 `quantreg` 包包含一个函数 `nlrq()`，其功能与非线性最小二法工具 `nls()`、`nlxb()` 和 `nlsLM()` 对应。让我们将其应用于我们的缩放后的\
  \ Hobbs 问题（第 1.2 节）。\n\n```\ny <- c(5.308, 7.24, 9.638, 12.866, 17.069, 23.192,\
  \ 31.443, 38.558,\n    50.156, 62.948, 75.995, 91.972)\nt <- 1:12\nweeddata <- data.frame(y\
  \ = y, t = t)\nrequire(quantreg)\nformulas <- y ∼ 100 * sb1/(1 + 10 * sb2 * exp(-0.1\
  \ * sb3 * t))\nsnames <- c(\"sb1\", \"sb2\", \"sb3\")\nst <- c(1, 1, 1)\nnames(st)\
  \ <- snames\nanlrqsh1 <- nlrq(formulas, start = st, data = weeddata)\nsummary(anlrqsh1)\n\
  ## \n## Call: nlrq(formula = formulas, data = weeddata, start = st, control = structure(list(\n\
  ##     maxiter = 100, k = 2, InitialStepSize = 1, big = 1e+20, eps = 1e-07, \n##\
  \     beta = 0.97), .Names = c(\"maxiter\", \"k\", \"InitialStepSize\", \n## \"\
  big\", \"eps\", \"beta\")), trace = FALSE)\n## \n## tau: [1] 0.5\n## \n## Coefficients:\n\
  ##     Value       Std. Error  t value     Pr(>|t|)   \n## sb1 86710.77088 10616.02767\
  \     8.16791     0.00002\n## sb2 98665.17861     0.00000         Inf     0.00000\n\
  ## sb3     1.95666     0.14804    13.21723     0.00000\n```\n\n这里的系数是用异常之少的迭代次数找到的，显然与第\
  \ 16.7 节中找到答案完全不同。我们尝试从一组更合理的初始参数重新开始，得到了非常接近最小二法答案的结果。\n\n```\nst <- c(2, 5, 3)\n\
  names(st) <- snames\nanlrqsh2 <- nlrq(formulas, start = st, data = weeddata)\nsummary(anlrqsh2)\n\
  ## \n## Call: nlrq(formula = formulas, data = weeddata, start = st, control = structure(list(\n\
  ##     maxiter = 100, k = 2, InitialStepSize = 1, big = 1e+20, eps = 1e-07, \n##\
  \     beta = 0.97), .Names = c(\"maxiter\", \"k\", \"InitialStepSize\", \n## \"\
  big\", \"eps\", \"beta\")), trace = FALSE)\n## \n## tau: [1] 0.5\n## \n## Coefficients:\n\
  ##     Value    Std. Error t value  Pr(>|t|)\n## sb1  1.94496  0.22886    8.49839\
  \  0.00001\n## sb2  4.95160  0.48881   10.12981  0.00000\n## sb3  3.16140  0.08643\
  \   36.57837  0.00000\n```\n\n与大多数非线性建模一样，L1 回归或设置分位数参数 `tau = 0.5` 的分位数回归要求我们注意初始值以及多解的可能。尽管如此，我发现\
  \ `quantreg` 包做得非常好。\n\n## 14.6 多项式近似\n\n有时偶尔会出现的一个特定问题是为具有已知最大误差的函数开发多项式近似（例如，参见\
  \ [`en.wikipedia.org/wiki/Minimax_approximation_algorithm`](http://en.wikipedia.org/wiki/Minimax_approximation_algorithm)）。注意，关于这个主题已有完善的文献，而\
  \ Remez 算法是执行此任务的金标准（关于该主题的最新贡献参见 Pachón and Trefethen (2009)）。遗憾的是，R 似乎缺乏这种方法的有效方法。\n\
  \n如果我们的函数是 ![c14-math-0029](img/c14-math-0029.png)，且我们想要一个次数为 ![c14-math-0030](img/c14-math-0030.png)\
  \ 的多项式，这就变成了寻找向量 ![c14-math-0031](img/c14-math-0031.png) 在 **14.9** ![equation](img/c14-math-0032.png)\
  \ 中系数的问题，使得对于区间 ![c14-math-0033](img/c14-math-0033.png) 内所有 ![c14-math-0034](img/c14-math-0034.png)\
  \ 成立。注意，目标是用给定次数的多项式来近似 `function`，而这是使用 Remez 方法的地方。该问题的离散化版本是在离散值集 ![c14-math-0035](img/c14-math-0035.png)\
  \ 上寻找解。这是 Hans Werner Borchers 提供的示例（Figure 14）。让我们先得到最小二法拟合，这将提供解可能所在的一些线索。\n\n\
  ```\nn <- 10  # 多项式次数为 10\nm <- 101  # 点数\nxi <- seq(-1, 1, length = m)\nyi <- 1/(1\
  \ + 5 * xi)²\nplot(xi, yi, type = \"l\", lwd = 3, col = \"gray\", main = \"Runge's\
  \ function\")\ntitle(sub = \"Polynomial approximation is dot-dash\")\npfn <- function(p)\
  \ max(abs(polyval(p, xi)) - yi)\nrequire(pracma)\npf <- polyfit(xi, yi, n)\nprint(pfn(pf))\n\
  ## [1] 0.102366\nlines(xi, polyval(pf), col = \"blue\", lty = 4)\n```\n\n从图中可以看出，该解显然非常糟糕，但如果我们知道区间\
  \ ![c14-math-0036](img/c14-math-0036.png) 内 101 个点的最大误差，那么它仍然可以帮助我们。\n\n```\n为多项式数据设置矩阵\n\
  ndeg <- 10\nAr <- matrix(NA, nrow = 101, ncol = ndeg + 1)\nAr[, ndeg + 1] <- 1\n\
  for (j in 1:ndeg) {\n    # 对齐到 polyval\n    Ar[, ndeg + 1 - j] <- xi * Ar[, ndeg\
  \ + 2 - j]\n}\ncat(\"Check minimax value for least squares fit\\n\")\n## 最小二法拟合的\
  \ minimax 值\nprint(minmaxw(pf, Ar, yi))\n## [1] 0.102366\n## attr(\"where\")\n##\
  \ [1] 51\napoly1 <- mmreg(Ar, yi)\napoly1$mad\n## [1] 0.065478\npcoef <- apoly1$coeffs\n\
  pcoef\n##           1           2           3           4           5 \n##  -50.248256\
  \    0.000000  135.853517    0.000000 -134.201071 \n##           6           7 \
  \          8           9          10 \n##    0.000000   59.193155    0.000000  -11.558883\
  \    0.000000 \n##          11 \n##     0.934532\nsumabs(pcoef, Ar, yi)\n## [1]\
  \ 4.28865\nsumsqr(pcoef, Ar, yi)\n## [1] 0.224028\nprint(minmaxw(pcoef, Ar, yi))\n\
  ## [1] 0.065478\n## attr(\"where\")\n## [1]  3 99\n```\n\n```\n## Runge 的 LAD 回归\n\
  apoly2 <- LADreg(Ar, yi)\napoly2$sad\n## [1] 3.06181\npcoef2 <- apoly2$coeffs\n\
  pcoef2\n##            1            2            3            4 \n##  -2.19324e+01\
  \  0.00000e+00  6.29108e+01  0.00000e+00 \n##            5            6        \
  \    7            8 \n##  -6.78485e+01  0.00000e+00  3.41440e+01 -1.39697e-12 \n\
  ##            9           10           11 \n##  -8.11899e+00  4.66635e-14  8.45327e-01\n\
  sumabs(pcoef2, Ar, yi)\n## [1] 3.06181\nsumsqr(pcoef2, Ar, yi)\n## [1] 0.211185\n\
  print(minmaxw(pcoef2, Ar, yi))\n## [1] 0.154673\n## attr(\"where\")\n## [1] 51\n\
  ```\n\n如果我们有一个可用的全局最小化工具，就可以检查该解。通常的工具（参见第 15 节）在这个问题的上并不理想，但 `adagio` 包确实可以找到解，尽管速度缓慢。\n\
