  \    0.002182\n## c3          1.6246    0.02808    57.86          0   5.637e-05\
  \   0.0001837\ntnlfb2j <- try(nlfb(bb2, lanc.res, trace = FALSE, data = Lanczos1))\n\
  tnlfb2j\n## nlmrt class object: x\n## residual sumsquares =  4.2906e-06  on  24\
  \ observations\n##     after  42    Jacobian and  57 function evaluations\n##  \
  \ name       coeff       SE      tstat      pval      gradient    JSingval\n## a1\
  \          1.87271         NA        NA        NA   4.242e-08       6.007\n## a2\
  \          1.87274         NA        NA        NA  -3.419e-08        2.57\n## a3\
  \          4.63965         NA        NA        NA    2.42e-09      0.2743\n## c1\
  \          4.99146         NA        NA        NA  -1.174e-08     0.02612\n## c2\
  \         -4.54744         NA        NA        NA  -1.174e-08    1.59e-06\n## c3\
  \          2.06878         NA        NA        NA  -2.199e-09   1.887e-16\n```\n\
  \n从上述结果可以看出，我们发现很难恢复原始的指数参数（1、3 和 5）。这可能是意料之中的，因为在残差和最小化过程中，没有任何机制可以防止这三个指数项发生角色交换。事实上，提出的解决方案中，一个似乎找到了鞍点，该点的梯度很小，雅可比矩阵奇异，且有两个指数参数相同。注意平方和非常小。\n\
  \n当然，不能期望 `nls()` 处理这种小残差问题。然而，它的线性算法从起始值 `bb1s` 开始表现良好，只是在小残差的相对偏移收敛测试失败了。将迭代次数限制在\
  \ 20 次是为了减少输出。\n\n\n\n\n\n```r\nbb1s <- bb1[1:3]  # 缩短起始，因为只有 3 个起始非线性参数\nbb2s <-\
  \ bb2[1:3]\nllexp <- \"y∼cbind(exp(-a1*x), exp(-a2*x), exp(-a3*x))\"\ntnls1p <-\
  \ try(nls(llexp, start = bb1s, data = Lanczos1, algorithm = \"plinear\",\n    trace\
  \ = TRUE, control = list(maxiter = 20)))\n## 0.007251 :   1.0000  2.0000  3.0000\
  \  0.9718 -3.8894  5.3912\n## 0.0006056 :   1.29580 -0.04136  4.79435  0.48291 -0.06102\
  \  2.10094\n## 0.000102 :   2.466172 -0.989412  4.744276  0.667864  0.006105  1.835376\n\
  ## 1.281e-07 :   2.257394 -0.788374  4.795171  0.620122  0.003522  1.889673\n##\
  \ 9.748e-08 :   2.295432 -0.514802  4.806250  0.633739  0.005439  1.874171\n## 8.308e-08\
  \ :   2.336692 -0.275700  4.817737  0.647657  0.008083  1.857636\n## 7.818e-08 :\
  \   2.38021 -0.07137  4.82939  0.66150  0.01150  1.84040\n## 7.705e-08 :  2.42499\
  \ 0.10063 4.84101 0.67502 0.01564 1.82276\n## 7.596e-08 :  2.4701 0.2443 4.8525\
  \ 0.6881 0.0204 1.8049\n## 7.317e-08 :  2.51480 0.36385 4.86370 0.70065 0.02561\
  \ 1.78717\n## 6.834e-08 :  2.5584 0.4634 4.8746 0.7127 0.0311 1.7696\n## 6.187e-08\
  \ :  2.60027 0.54639 4.88513 0.72436 0.03669 1.75239\n## 5.444e-08 :  2.64003 0.61569\
  \ 4.89522 0.73552 0.04221 1.73571\n## 5.018e-08 :  2.71463 0.73165 4.91441 0.75636\
  \ 0.05338 1.70369\n## 4.808e-08 :  2.84063 0.88892 4.94806 0.79338 0.07365 1.64642\n\
  ## 4.261e-09 :  2.99329 1.01211 4.99369 0.85082 0.09646 1.56613\n## 2.229e-12 :\
  \  3.00003 0.99992 4.99999 0.86072 0.09509 1.55759\n## 8.227e-22 :  3.0000 1.0000\
  \ 5.0000 0.8607 0.0951 1.5576\n## 1.429e-25 :  3.0000 1.0000 5.0000 0.8607 0.0951\
  \ 1.5576\n## 1.429e-25 :  3.0000 1.0000 5.0000 0.8607 0.0951 1.5576\n## 1.429e-25\
  \ :  3.0000 1.0000 5.0000 0.8607 0.0951 1.5576\nstrwrap(tnls1p)\n## [1] \"Error\
  \ in nls(llexp, start = bb1s, data = Lanczos1,\"\n## [2] \"algorithm = \\\"plinear\\\
  \", : number of iterations\"\n## [3] \"exceeded maximum of 20\"\ntnls2p <- try(nls(llexp,\
  \ start = bb2s, data = Lanczos1, algorithm = \"plinear\",\n    trace = TRUE, control\
  \ = list(maxiter = 20)))\n## 0.06729 :     1.0    1.1    1.2  271.1 -590.0  321.3\n\
  strwrap(tnls2p)\n## [1] \"Error in numericDeriv(form[[3]], names(ind), :\"\n## [2]\
  \ \"Missing value or an infinity produced when evaluating\"\n## [3] \"the model\"\
  \n```The “linear” algorithm in `nls()` takes advantage of the linear structure within\
  \ the model. In the present case, there are three linear coefficients multiplying\
  \ an exponential factor. There is no constant term in the model. We can then think\
  \ of computing the linear coefficients—by least squares once we specify the exponential\
  \ parameters. And there are just three rather than six of these nonlinear parameters.\
  \ The design matrix has columns. The necessary computational steps were worked out\
  \ by Golub and Pereyra (1973), who called the problem *separable least squares*\
  \ and their approach *variable projection method*. The Fortran implementations have\
  \ been improved over the years by a number of workers including Fred Krogh, Linda\
  \ Kaufman, and John Bolstad, but the code is large and unwieldy. Recently O'Leary\
  \ and Rust (2013) presented a new Matlab implementation that markedly improves the\
  \ readability of the computational steps. It appears that `nls()` uses a variant\
  \ of the Golub–Pereyra code. However, it is complicated and virtually uncommented.\
  \ This, with the failure of the relative offset test on small residual problems\
  \ is unfortunate. My own choice for problems like this is to use numerical approximation\
  \ of the derivatives with a direct solution of the linear least squares problem.\
  \ The code and example solution is shown below.\n\n```\nlanclin.res <- function(b,\
  \ data) {\n    # 重构以便于线性化\n    xx <- data$x\n    yy <- data$y\n    res <- rep(NA,\
  \ length(xx))\n    m <- length(xx)\n    n <- 3\n    A <- matrix(NA, nrow = m, ncol\
  \ = n)\n    for (j in 1:n) {\n        A[, j] <- exp(-b[j] * xx)\n    }\n    lmod\
  \ <- lsfit(A, yy, intercept = FALSE)\n    res <- lmod$residuals\n    attr(res, \"\
  coef\") <- lmod$coef\n    res\n}\nbb1s\n## a1 a2 a3\n##  1  2  3\nres1L <- lanclin.res(bb1s,\
  \ data = Lanczos1)\ncat(\"sumsquares via lanclin for bb1s start:\", as.numeric(crossprod(res1L)),\n\
  \    \"\\n\")\n## sumsquares via lanclin for bb1s start: 0.007251\ntnlfbL1 <- try(nlfb(bb1s,\
  \ lanclin.res, trace = FALSE, data = Lanczos1))\ntnlfbL1\n## nlmrt object: x\n##\
  \ residual sumsquares = 3.288e-24  on  24 observations\n## after  15    Jacobian\
  \ and  16 evaluations\n## name     coeff        SE       tstat      pval    gradient\n\
  ## a1              1.219e-09  82009724         0   -2.05e-06\n## a2            \
  \  3.478e-09  2.029e+09         0   -2.877e-16    0.002831\n## a3              5.908e-10\
  \  1.218e+10         0   -5.729e-17   0.002005\n## Get the linear coefficients\n\
  resL1 <- lanclin.res(coef(tnlfbL1), data = Lanczos1)\nresL1\n## [1]  3.6607e-13\
  \ -4.0310e-13 -4.7523e-13 -2.3124e-15\n## [5]  6.0493e-14  5.7877e-13  5.0700e-13\
  \  2.0330e-13\n## [9]  1.4304e-14 -2.4395e-13 -3.8695e-13 -4.6264e-13\n## [13] -4.3314e-13\
  \ -4.6082e-13 -4.9132e-13 -4.6641e-13\n## [17] -1.7623e-13 -3.5244e-13 -3.8359e-13\
  \ -3.9038e-13\n## [21] 2.6474e-13 -6.9038e-14 -2.2982e-13 -6.4024e-13\n## attr(,\"\
  coef\")\n##     X1     X2     X3\n## 0.0951 0.8607 1.5576\n## Now from bb2s\nbb2s\n\
  ##  a1 a2 a3\n##  1  2  3\nres2L <- lanclin.res(bb2s, data = Lanczos1)\ncat(\"sumsquares\
  \ via lanclin for bb2s start:\", as.numeric(crossprod(res2L)),\n    \"\\n\")\n##\
  \ sumsquares via lanclin for bb2s start: 0.06729\ntnlfbL2 <- try(nlfb(bb2s, lanclin.res,\
  \ trace = FALSE, data = Lanczos1))\ntnlfbL2\n## nlmrt object: x\n## residual sumsquares\
  \ = 3.288e-24  on  24 observations\n## after  15    Jacobian and  16 evaluations\n\
  ## name     coeff        SE       tstat      pval    gradient\n## a1           \
  \   1.219e-09  82009724         0   -2.05e-06\n## a2              3.478e-09  2.029e+09\
  \         0   -2.877e-16    0.002831\n## a3              5.908e-10  1.218e+10  \
  \       0   -5.729e-17   0.002005\n## Get the linear coefficients\nresL2 <- lanclin.res(coef(tnlfbL2),\
  \ data = Lanczos1)\nresL2\n## [1]  3.6607e-13 -4.0310e-13 -4.7523e-13 -2.3124e-15\n\
  ## [5]  6.0493e-14  5.7877e-13  5.0700e-13  2.0330e-13\n## [9]  1.4304e-14 -2.4395e-13\
  \ -3.8695e-13 -4.6264e-13\n## [13] -4.3314e-13 -4.6082e-13 -4.9132e-13 -4.6641e-13\n\
  ## [17] -1.7623e-13 -3.5244e-13 -3.8359e-13 -3.9038e-13\n## [21] 2.6474e-13 -6.9038e-14\
  \ -2.2982e-13 -6.4024e-13\n## attr(,\"coef\")\n##     X1     X2     X3\n## 0.0951\
  \ 0.8607 1.5576\n```\n\nSeparable least squares problems, or alternatively nonlinear\
  \ least squares problems where many of the parameters are linear, has a fairly large\
  \ literature of its own. Some examples and discussion are given in the book by Pereyra\
  \ and Scherer (2010) or in the article by Mullen et al. (2007).\n\n\n\n\n## 6.9\
  \ 非线性最小二乘的策略\n\n用户在处理非线性最小二乘问题时面临的困扰并不是因为这些问题通常极其难以解决。正如我们所看到的，虽然存在目标函数非常奇异的问题，但大多数问题在某些参数区域表现得良好。我觉得，在处理此类问题时方法选择的局限性才是带来了巨大的困扰。\n\
  \n使用基于表达式的工具，用户可能会在控制损失函数方面放弃很多灵活性，但在许多情况下可以受益于雅可比矩阵的自动生成。当然，如果表达式非常直观，我更倾向于这种攻击手段。另一方面，我发现基于函数的工具虽然初始设置工作较大，但更便于检查和修改，并能融入更多样化的方法中——例如，通过生成平方和及其梯度，我们可以访问任何优化工具。\n\
  \n边界约束（Bounds constraints）的使用频率似乎比应有的要低。通过对解设定范围框，我们可以避免许多困难，特别是当平方和在整个区域内都有定义时。掩码（Masks，即固定参数）虽然存在，但在\
  \ R 的非线性建模文献中出现得较少。\n\n变量投影法（Variable projection methodology）很早就就引入了 R，但正如所述，它受到了\
  \ `nls()` 中代码结构和收敛测试的限制。我希望在未来几年内能在 R 包中看到更新后的 `VARPRO` 方法。在此期间，当存在许多线性参数时，建模的选择是：如果残差不接近零，则使用\
  \ `nls()`；或者像上一节示例那样使用基于函数的方法对雅可比矩阵进行数值近似。\n\n## 参考文献\n\n1. Bates DM and Watts DG\
  \ 1981 A relative off set orthogonality convergence criterion for nonlinear least\
  \ squares. *Technometrics* **23**(2), 179–183.\n\n2. Bates DM and Watts DG 1988\
