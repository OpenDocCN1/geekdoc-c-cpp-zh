  \          0   5.637e-05   0.0001837\ntnlxb2 <- try(nlxb(lancexp, start = bb2, data\
  \ = Lanczos1, trace = FALSE))\ntnlxb2\n## nlmrt class object: x\n## residual sumsquares\
  \ =  4.2906e-06  on  24 observations\n##     after  42    Jacobian and  57 function\
  \ evaluations\n##   name       coeff       SE      tstat     pval      gradient\
