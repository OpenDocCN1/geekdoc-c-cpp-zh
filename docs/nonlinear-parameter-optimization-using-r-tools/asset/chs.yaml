  \ 1.03618 -0.042352 -41.311 79.208\n## Rcgmin      -28.6807 1.03619 -0.042352 -41.310\
  \ 79.207\n## nmkb        -28.6803 1.03618 -0.042354 -41.308 79.209\n## BFGS    \
  \    -25.3920 1.01751 -0.043002 -35.760 82.639\n## CG          -25.3920 1.01751\
  \ -0.043002 -35.760 82.639\n## Nelder-Mead -25.3920 1.01751 -0.043002 -35.760 82.639\n\
  ## L-BFGS-B    -25.3920 1.01751 -0.043002 -35.760 82.639\n## hjkb        -13.2112\
  \ 0.96400 -0.031632 -39.492 71.582\n## bobyqa       -1.1530 0.91213 -0.018279 -31.496\
  \ 57.114\n## newuoa       -1.1312 0.91182 -0.018244 -31.399 57.140\n## spg     \
  \     -1.1713 0.91260 -0.017788 -31.549 56.304\n## nlm          -1.1354 0.91246\
