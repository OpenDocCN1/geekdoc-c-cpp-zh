  \ alpha = 0.02), add = TRUE, lty = 3)\nrform1 <- -log(0.2)/1\nrform2 <- -log(0.2)/0.02\n\
  resr1 <- uniroot(efn, tint, tol = 1e-10, alpha = 1)\ncat(\"alpha = \", 1, \"\\n\"\
  )\n## alpha = 1\ncat(\"root(formula)=\", rform1, \"  root1d:\", resr1$root, \" tol=\"\
  , resr1$estim.prec,\n    \"  fval=\", resr1$root, \"  in   \", resr1$iter, \"\\\
  n\")\n## root(formula)= 1.609   root1d: 1.609  tol=0.0005702   fval= 0   in    13\n\
