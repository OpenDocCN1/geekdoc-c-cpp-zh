  \       985.52     27     NA  TRUE\n## Rvmmin       985.52     68     NA  TRUE\n\
  ## nlminb       985.52     45     24  TRUE\n## Rcgmin       985.52   1228310   \
  \ NA  TRUE\n## nmkb         985.52   1050     NA  FALSE\n## BFGS         986.67\
  \     51     NA  FALSE\n## CG           986.67     51     NA  FALSE\n## Nelder-Mead\
