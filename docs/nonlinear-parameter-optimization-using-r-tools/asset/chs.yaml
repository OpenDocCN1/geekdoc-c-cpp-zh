  \ hjkb         995.02  10007     NA  FALSE6\n bobyqa      1039.36    235     NA\
  \  FALSE\n## newuoa       1039.43    217     NA  FALSE\n## spg         1041.92 \
  \  2764  1501  FALSE\n## nlm         1042.51     NA     9  FALSE\n\n读者可能会对 `optimx`\
  \ 产生的各种结果感到困惑。然而，最成功的方法（残差最小的方法）与非最小二乘法之间是一致的。\n\n### 13.1.2 消除哪个参数？\n\n在刚刚完成的计算中，我们消除\
  \ c13-math-0006.png。是否有任何理由选择它而不是 c13-math-0007.png、c13-math-0008.png 或 c13-math-0009.png？事实证明，这种选择是非常重要的。特别是当消除\
  \ c13-math-0010.png 时，通过 `nlfb()` 或 `optimx` 得到的最佳非最小二乘法残差和为 1008.334。这显然没有消除其他参数时发现的最优值\
  \ 985.5175。尝试全 1 的起始向量允许 `optimx` 的两种方法找到较低的值，但 `nlfb()` 仍然得到较高的平方差和。无约束参数 c13-math-0011.png\
  \ 在数值上最大，并且在消除 c13-math-0012.png 时，它作为一个除数。当我们消除 c13-math-0013.png 时，较小的 c13-math-0014.png\
  \ 是我们的除数，优化过程中的不幸步骤可能会导致除零。然而，这个问题似乎并不影响对 c13-math-0015.png 的消除，其数值也相当。\n\n### 13.1.3\
  \ 缩放和中心化？\n\n在开发此示例的过程中，我探索了将变量中心化的常规建议，即减去它们的均值。对于线性回归，这通常可以稳定计算并将正方程（或其等价）的维度减少\
  \ 1。也可以除以标准差来标准化变量。\n\n然而，在示例中，对变量进行中心化或标准化会引入复杂的约束的变化。除非这种稳定性能提供巨大的优势，否则我会避免这样做。但是，简单的\
  \ 10 的幂次缩放是有用的，不需要进行代数运算。我发现，如果通过分别乘以[equation]来对数据列进行缩放：\n\n![equation](img/c13-math-0016.png)\n\
  \n消除参数的四种选择都能至少给出一个 `optimx` 满意的解决方案。\n\n然而，消除 c13-math-0017.png 仍然无法获得非最小二乘解。\n\
  \n### 13.1.4 非线性规划包\n\n让我们尝试使用 `alabama` 包中的 `constrOptim.nl()` 和 `auglag()` 增广拉格日方法，以及\
  \ `Rsolnp` 的 `solnp()` 函数。所有这些方法也能处理不等约束，但目前我们只使用等式约束功能。再次我们必须警告，不同函数的调用语法并不标准，特别注意\
  \ `solnp()` 的 `eqB` 字段。我们在代码中包含了雅可比计算，但并不一定使用它。\n\n\n\n\n\n```r\nresall <- function(x,\
  \ dta) {\n    b1 <- x[1]\n    b2 <- x[2]\n    b3 <- x[3]\n    b4 <- x[4]\n    b5\
  \ <- x[5]\n    b6 <- x[6]\n    res <- dta$two * b2 + dta$three * b3 + dta$four *\
  \ b4 + dta$five *\n        b5 + dta$six * b6 + b1 - dta$one\n    return(-res)\n\
  }\njacall <- function(x, dta) {\n    b1 <- x[1]\n    b2 <- x[2]\n    b3 <- x[3]\n\
  \    b4 <- x[4]\n    b5 <- x[5]\n    b6 <- x[6]\n    nobs <- dim(dta)[1]\n    JJ\
  \ <- cbind(rep(-1, nobs), -dta$two, -dta$three, -dta$four,\n        -dta$five, -dta$six)\n\
  }\nssall <- function(x, dta) {\n    res <- resall(x, dta)\n    sum(res * res)\n\
  }\nstones <- rep(1, 6)  # 平凡初始值\nnames(stones) <- c(\"b1\", \"b2\", \"b3\", \"b4\"\
  , \"b5\", \"b6\")\nstunc <- coef(uncmod)  # 无约束参数初始值\n```\n\n我们不会展示所有的输出，输出内容非常多。对于初始值\
  \ `stones`，`constrOptim.nl()`、`auglag()` 和 `solnp()` 的调用序列如下：\n\n```r\nrequire(alabama)\n\
  aalabco <- constrOptim.nl(par = stones, fn = ssall, heq = convi,\n    dta = hn)\n\
  aauglag <- auglag(stones, fn = ssall, heq = convi, dta = hn)\nrequire(Rsolnp)\n\
  asolnp <- solnp(stones, fun = ssall, eqfun = convi, eqB = c(0),\n    dta = hn)\n\
  ```\n\n```r\n ## 加载包: alabama\n## 从全 1 开始 - - constrOptim.nl\n##         b1    \
