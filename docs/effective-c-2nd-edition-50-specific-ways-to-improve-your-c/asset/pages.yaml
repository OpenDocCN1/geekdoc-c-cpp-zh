    \ removes from memory any garbage objects that do not have finalizers. All objects\
    \ that have finalizers remain in memory. These objects are added to a finalization\
    \ queue, and the Garbage Collector spawns a new thread to run the finalizers on\
    \ those objects. After the finalizer has finished its work, the garbage objects\
    \ can be removed from memory. Objects that need finalization in memory for far\
    \ longer than objects without a finalizer. But you have no choice. If you're going\
    \ to be defensive, you must write a finalizer when your type holds unmanaged resources.\
    \ Don't worry about performance just yet. The next steps ensure that it's easier\
    \ for clients to avoid the performance penalty associated with finalization.\n\
    \nImplementing IDposable is the standard way to inform users and the runtime system\
    \ that your objects hold resources that must be released in a timely manner. The\
    \ IDposable interface contains just one method:\n\n```\npublic interface IDposable\n\
    {\n    void Dispose();\n}\n```\n\nThe implementation of your IDposable.Dispose()\
    \ method is responsible for four tasks:\n\n+   1. Freeing all unmanaged resources.\n\
