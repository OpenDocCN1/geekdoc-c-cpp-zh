    \ get called after disposing of an object.\n4. Suppressing finalization. You can\
    \ call GC.SuppressFinalize(this) to accomplish this task.\n\nYou accomplish two\
    \ things by implementing IDposable: You provide the mechanism for clients to release\
    \ all managed resources that you hold in a timely fashion, and give clients a\
    \ standard way to release all unmanaged resources. That's quite an improvement.\
    \ After you've implemented IDposable in your type, clients can avoid the finalization\
