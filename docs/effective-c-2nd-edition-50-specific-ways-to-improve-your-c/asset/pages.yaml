  md: "# Item 49: Prefer CLS-Compliant Assemblies\n\nTo create a CLS-compliant assembly,\
    \ you must follow two rules. First, the type of all parameters and return values\
    \ from public and protected members must be CLS compliant. Second, any non-CLS-compliant\
    \ public or protected member must have a CLS-compliant synonym.\n\nThe first rule\
    \ is simple to follow: You can have it enforced by the compiler. Add the CLSCompliant\
    \ attribute to your assembly:\n\n```\n[assembly: System.CLSCompliant(true)]\n\
    ```\n\nThe compiler enforces CLS compliance for the entire assembly. If you write\
    \ a public method or property that uses a construct that is not compliant with\
    \ CLS, it's an error. That's good because it makes CLS compliance an easy goal.\
    \ After turning on CLS compliance, these two definitions won't compile because\
    \ unsigned integers are not compliant with CLS:\n\n```\n// Not CLS Compliant,\
    \ returns unsigned int:\npublic UInt32 Foo()\n{\n    return foo;\n}\n\n// Not\
    \ CLS compliant, parameter is an unsigned int.\npublic void Foo2(UInt32 parm)\n\
    {\n}\n```\n\nRemember that creating a CLS-compliant assembly affects only items\
    \ that can be seen outside the current assembly. Foo and Foo2 generate CLS compliance\
    \ errors when declared either public or protected. However, if Foo and Foo2 were\
    \ internal, or private, they could be included in a CLS-compliant assembly; CLS-compliant\
    \ interfaces are required only for items that are exposed outside the assembly.\n\
    \nWhat about this property? Is it CLS-compliant?\n\n```\npublic MyClass TheProperty\
    \ { get; set; }\n```\n\nIt depends. If MyClass is CLS compliant and indicates\
    \ that it is CLS compliant, this property is CLS compliant. On the other hand,\
    \ if MyClass is not marked as CLS compliant, this property is not CLS compliant.\
    \ That means that the earlier TheProperty is CLS compliant only if MyClass resides\
    \ in a CLS-compliant assembly."
