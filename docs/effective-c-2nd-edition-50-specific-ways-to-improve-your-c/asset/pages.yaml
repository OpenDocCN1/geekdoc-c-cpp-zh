    \n# Item 6: Understand the Relationships Among the Many Different Concepts of\
    \ Equality\n\nWhen you create your types (either classes or structs), you define\
    \ what equality means for that type. C# provides four different functions that\
    \ determine whether two different objects are “equal\":\n\n```\npublic static\
    \ bool ReferenceEquals\n    (object left\n```\n\nThe language enables you to create\
    \ your own versions of all of these methods. But just because you doesn't means\
    \ that you should. You should never redefine the first two static functions. You'll\
    \ create your own instance Equals() method to define the semantics of your type,\
    \ and you'll occasionally override operator==(), typically for performance reasons\
    \ in value types. Furthermore, there are relationships among these functions,\
    \ so when you change one, you can affect the behavior of the others. Yes—needing\
    \ functions to test equality is complicated. But don't worry—you can simplify\
    \ it.\n\nOf course, those four methods are not the only options for equality.\
    \ Types that override Equals() should implement IEquatable<T>. Types that implement\
    \ value semantics implement the IStructuralEquality interface. That means six\
    \ different ways to express equality.\n\nLike so many of the complicated elements\
    \ in C#, this one follows from the fact that C# enables you to create both value\
    \ types and reference types. Two variables of reference type are equal if they\
    \ refer to the same object, referred to as object identity. Two variables of a\
    \ value type are equal if they are the same type and they contain the same contents.\
    \ That's why equality tests need so many different methods."
