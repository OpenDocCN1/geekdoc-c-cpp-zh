  md: "# 216 Chapter 4 Working with the Framework\n\nThis snippet of code performs\
    \ Web downloads from a series of Web sites:\n\n```\nforeach (var url in urls)\n\
    {\n    var result = new Web().DownloadData(url);\n    UseResult(result);\n```\n\
    \nThe DownloadData() calls a Web synchronous request and waits until all the data\
    \ is retrieved. This algorithm will spend a lot of time waiting. You can quickly\
    \ change to a parallel model using a parallel for loop:\n\n```\nParallel.ForEach(urls,\
    \ url =>\n{\n    var result = new WebClient().DownloadData(url);\n    UseResult(result);\n\
    });\n```\n\nParallel.ForEach() opts into a parallel processing model. This version\
    \ takes much less time than the serial version. In fact, on your dual core machine,\
    \ the speedup is roughly proportional to the number of elements in the urls collection.\
    \ Threads are spending much of their time waiting, so the Parallel Task Library\
    \ will create more threads.\n\nYou can use PLINQ and query syntax to produce the\
    \ same kind of result:\n\n```\nvar results = from url in urls.AsParallel()\n \
    \   select new WebClient().DownloadData(url)\nresults.All(result => UseResult(result));\n\
    ```\n\nPLINQ operates a bit differently than the Parallel Task Library's Parallel.ForEach()\
    \ support. PLINQ will use a fixed number of threads, whereas AsParallel() will\
    \ ramp the number of threads up or down to increase throughput. You can control\
    \ the number of threads in PLINQ using ParallelEnumerable.WithDegreeOfParallelism()\
    \ (see Item 35), Parallel.ForEach() will manage it for you. Parallel.ForEach()\
    \ works best when the load is some mixture of I/O bound and CPU operation. Parallel.ForEach()\
    \ will manage the number of active threads based on the current load. When threads\
    \ are blocked waiting on I/O operations, it will increase throughput. When threads\
    \ are working, it will allow the number of active threads to go down to minimize\
    \ context switching."
