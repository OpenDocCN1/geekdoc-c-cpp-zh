    The Conditional attribute can be applied only to methods. In addition, any method
    with a Conditional attribute must have a return type of void. You cannot use the
    Conditional attribute for blocks of code inside methods or methods that return
    values. Instead, create carefully constructed methods and isolate the conditional
    behavior to functions. You still need to review those conditional methods for
    side effects to the object state, but the Conditional attribute localizes those
    points much better than #if/#endif. With #if and #endif blocks, you can mistakenly
    remove method calls or assignments.


    The previous examples use the predefined DEBUG and TRACE symbols. But you can
    extend this technique for symbols you define. The Conditional attribute can be
    controlled by symbols defined in a variety of ways. You can define symbols for
    controlled by the compiler command line, from environment variables in the operating
    system shell, or from pragmas in the source code.


    You may have noticed that every method shown with the Conditional attribute has
    been a method that has a void return type and takes no parameters. That’s a practice
    you should follow. The compiler enforces that conditional methods must have void
    return type. However, you could create a method that takes any number of reference
    type parameters. That can lead to practices where an important side effect does
    not take place. Consider this snippet of code:


    ```

    Queue<string> names = new Queue<string>();

    names.Enqueue("one");

    names.Enqueue("two");

    names.Enqueue("three");

    ```'
