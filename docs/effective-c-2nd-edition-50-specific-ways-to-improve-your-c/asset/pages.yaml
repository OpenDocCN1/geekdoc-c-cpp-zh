  md: '# 304 Chapter 6 Miscellaneous


    reuse components and harder to update parts of a system. Many smaller assemblies
    make it easier to use your classes as binary components.


    The title also highlights the importance of cohesion. Cohesion is the degree to
    which the responsibilities of a single component afford meaningful unit. Cohesive
    components can be described in a single sentence. You can see this in many of
    the .NET FCL assemblies. Two examples are: The System.Core provides types and
    algorithms that support LINQ, and the System.Windows.Forms assembly provides classes
    that model Windows controls. Web Forms and Windows Forms are in different assemblies
    because they are not related. You should be able to describe your own assemblies
    in the same fashion using one single sentence. No cheating: The MyApplication
    assembly provides everything you need. Yes, that''s a single sentence. But it''s
    also lazy, and you probably don''t need all of functionality in My2ndApplication.
    (Though you''d like to reuse some of it. That "some of it" should be packaged
    in its own assembly.)


    You should not create assemblies with only one class. You need to find the middle
    ground. If you go too far and create too many assemblies, you lose benefits of
    encapsulation: You lose the benefits of internal types by not packing public classes
    in the same assembly. The JIT compiler can perform more efficient inlining across
    assembly boundaries. This means that packaging related types in the same assembly
    is to your advantage. Your goal is to create the best-sized package for the functionality
    you are delivering in your component. This goal is easier to achieve with cohesive
    components: Each component should have one responsibility.


    In some sense, an assembly is the binary equivalent of class. We use classes to
