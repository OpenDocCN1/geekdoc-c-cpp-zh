  md: "# 238 Chapter 5 Dynamic Programming in C#\n\n```\nvar answer3 = from v in GetSomeStrings()\n\
    \      select (MyType)v;\nforeach (var v in answer3)\n    Console.WriteLine(v);\n\
    ```\n\nWhat's the difference? The two versions that don't work use Cast<T>(),\
    \ and the version that includes the case in the lambda used as the argument to\
    \ Select().Cast<T> cannot access any user-defined conversions on the runtime time\
    \ it only make reference conversions and boxing conversions. A reference conversion\
    \ succeeds when the is operator succeeds (see Item 3). A boxing conversion converts\
    \ a value type to a reference type and vice versa (see Item 45). Cast<T> cannot\
    \ access any user-defined conversions because it can only assume that T contains\
    \ the members defined in System.Object. System.Object does not contain any user-defined\
    \ conversions, so those are not eligible. The version using Select<T> succeeds\
    \ because the lambda used by Select() takes an input parameter of string. That\
    \ means the conversion operation defined on MyType.\n\nAs I before, I view conversion\
    \ operators as a code smell. On occasion, they are useful, but often they cause\
    \ more problems than they are worth. Here, without the conversion operators, no\
    \ developer would be tempted to write the example code that didn't work.\n\nOf\
    \ course, if I'm recommending not using conversion operators, I should offer an\
    \ alternative. MyType already contains a read/write property to store the string\
    \ property, so you can just remove the conversion operators and write either of\
    \ these:\n\n```\nvar answer4 = GetSomeStrings()\nSelect(n) => new MyType { StringMember\
    \ = n });\nvar answer5 = from v in GetSomeStrings()\n      select new MyType {\
    \ StringMember = v };\n```\n\nAlso, if you needed, you could create a different\
    \ constructor for MyType. Of course, that is just working around a limitation\
    \ in Cast<T>. Now that you understand why those limitations exist, it's time to\
