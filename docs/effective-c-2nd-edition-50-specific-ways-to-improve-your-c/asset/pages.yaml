    The WebClient class uses the Event-based Asynchronous Pattern (EAP). That means
    you register a handler for an event that will be raised when an asynchronous operation
    completes. startDownload() stores the task completion information in the TaskCompletionSource
    when that event is raised. The TaskScheduler picks up the task and then the download
    is started. The method returns the Task object embedded inside the TaskCompletionSource
