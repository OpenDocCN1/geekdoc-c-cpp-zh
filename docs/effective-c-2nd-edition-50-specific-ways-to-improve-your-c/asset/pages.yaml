  md: 'Item 41: UseDynamicObject or IDynamicMetaObjectProvider for Data-Driven Dynamic
    Types 243


    The compiler will use the specific version for any objects of type Product or
    SpecialProduct (or any other product-derived class in your object model). For
    anything else, the compiler will use the statically typed as dynamic. That includes
    anonymous types. Internally, the dynamic binder will cache info for each method
    it uses. This will minimize the overhead for the likely case that you''ll be calling
    WritePricingInformation() for the same anonymous type over and over. Once the
    binding has been performed on the first call, it will be reused on subsequent
    call. It''s a nonzero cost, but the dynamic implementation does as much work as
    possible to minimize the cost of using dynamic.


    You may be wondering why none of these methods are extension methods so that they
    would appear to be members of the anonymous type. Well, that would be great, but
    it''s not legal C#. You are not allowed to create extension methods that extend
    dynamic objects.


    You can leverage dynamic to create methods that are intended to be used with anonymous
    types. It''s a technique to be used sparingly, like spices. If you find yourself
    creating methods with dynamic invocation that are intended for use with anonymous
    types, that''s a strong indication that you should create a concrete type to represent
    that content. It will be much easier to maintain over time, and you''ll have better
    support from the compiler and the type system. However, when you need one or two
    utility methods that use an anonymous type, dynamic invocation is a simple way
    to create that behavior.


    # Item 41: UseDynamicObject or IDynamicMetaObjectProvider for Data-Driven Dynamic
    Types


    One great advantage of dynamic programming is the ability to build types whose
    public interface changes at runtime, based on how you use them. C# provides that
    ability through dynamic, the System.Dynamic.DynamicObject base class, and the
    System.Dynamic.IDynamicMetaObjectProvider interface. Using these tools, you can
    create your own types that have dynamic capabilities.


    The simplest way to create a type with dynamic capabilities is to derive from
    System.Dynamic.DynamicObject. That type implements the IDynamicMetaObjectProvider
    interface using a private nested class. This private nested class does the hard
    work of parsing expressions and forwarding them to one of a number of virtual
    methods in the DynamicObject class.


