  md: "# 22 Chapter 1 C# Language Idioms\n\n```\nTrace.WriteLine(\"Exiting CheckState\
    \ for Person\");\n#endif\n}\n```\n\nUsing the #if and #endif pragmas, you’ve created\
    \ an empty method in your release builds. The CheckState() method gets called\
    \ in all builds, release and debug. It doesn't do anything in the release builds,\
    \ but you pay for the method call. You also pay a small cost to load and JIT the\
    \ empty routine.\n\nThis practice works fine but can lead to subtle bugs that\
    \ appear only in release builds. The following common mistake shows what can happen\
    \ when you use pragmas for conditional compilation:\n\n```\npublic void Func()\n\
    {\n    string msg = null;\n\n```\n\n```\n#if DEBUG\n    msg = GetDiagnostics();\n\
    #endif\n    Console.WriteLine(msg);\n\n```\n\nEverything works fine in your debug\
    \ build, but your release builds happily print a blank message. That's not your\
    \ intent. You goofed, the compiler couldn't help you. You have code that is fundamental\
    \ to your logic inside a conditional block. Sprinkling your source code with #if/#endif\
    \ blocks makes it hard to diagnose the differences in behavior between the different\
    \ builds.\n\nC# has a better alternative: The Conditional attribute. You can isolate\
    \ functions that be part of your classes only when a particular environment variable\
    \ is defined or set to a certain value. The most common use of this feature is\
