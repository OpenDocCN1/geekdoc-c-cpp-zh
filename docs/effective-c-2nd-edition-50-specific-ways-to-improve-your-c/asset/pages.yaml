  md: "# Item 26: Avoid Returning References to Internal Class Objects 155\n\ncaller\
    \ a handle to your internal structures, so the caller no longer needs to go through\
    \ your object to modify that contained reference.\n\nClearly, you want to prevent\
    \ this kind of behavior. You built the interface to your class, and you want users\
    \ to follow it. You don't want users to access or modify the internal state of\
    \ your objects without your knowledge. You've got four strategies for protecting\
    \ your internal data structures from unintended modifications: value types, immutable\
    \ types, interfaces, and wrappers.\n\nValue types are copied when clients access\
    \ them through a property. Any changes to the copy retrieved by the clients of\
    \ your class do not affect your object's internal state. Clients can change the\
    \ copy as much as necessary to achieve their purposes. This does not affect your\
    \ internal state.\n\nImmutable types, such as System.String, are also safe (see\
    \ Item 20). You can return strings, or any immutable type, safely knowing that\
    \ no client of your class can modify the string. Your internal state is safe.\n\
    \nThe third option is to define interfaces that allow clients to access a subset\
    \ of your internal member's functionality (see Item 22). When you create your\
    \ classes, you can create sets of interfaces that support subsets of the functionality\
    \ of your class. By exposing the functionality through those interfaces, you minimize\
    \ the possibility that your internal data changes in ways you did not intend.\
    \ Clients can access the internal object through the interface you supplied, which\
    \ will not include the full functionality of the class. Exposing the IEnumerable<T>\
    \ interface pointer in the List<T> is one example of this strategy. The Machiavellian\
    \ programmers out there can defeat by using the type of object that implements\
    \ the interface and using a cast. But programmers who go to that much work to\
    \ create bugs what they deserve.\n\nThere is one strange twist in the BindingList\
    \ that may cause some problems. There isn't a generic version of IBindingList,\
    \ so you may want to create two different API methods for accessing the data:\
    \ one that supports DataBinding via the BindingList, and one that supports programming\
