    not. Poorly designed algorithms may not perform improvements from parallelization.
    Your task is to look for loops and other tasks that can be parallelized. Take
    those algorithms and try the parallel versions. Measure the results. Work on the
    algorithms to get better results on the performance. Realize that some algorithms
    aren’t easily parallelizable, and keep those serial.


    # Item 36: Understand How to Use PLINQ for I/O Bound Operations


    The Parallel Task Library looks like it would be optimized for CPU bound operations.
    While that is a core mission for the library, it does well with I/O bound operations
    as well. In fact, the design of the Parallel Task Library handles I/O bound operations
    by default. It will update the number of threads allocated to your algorithms
    based on how busy those threads are. More blocked threads (waiting for I/O operations)
    will result in the ThreadPool allocating more threads to the tasks at hand.


    As with other parallel extensions, you can use methods, or LINQ query syntax to
    opt into a parallel execution model. Parallel execution for I/O bound operations
    behaves a little differently than CPU bound operations. You’ll often want more
    threads than cores, because the I/O threads spend more of their time waiting for
    some external event. PLINQ provides a framework for these idioms as well.'
