  md: "Derived classes can also prevent further overrides by sealing the method:\n\
    \n```\npublic class MyDerivedClass2 : MyClass\n{\n    public sealed override void\
    \ Message()\n    {\n        Console.WriteLine(\"MyDerivedClass\");\n    }\n}\n\
    ```\n\nAnother solution is to implement the interface, and include a call to a\
    \ virtual method that enables derived classes to participate in the interface\
    \ contract. You would do that in MyClass in this way:\n\n```\npublic class MyClass2\
    \ : IMsg\n{\n    protected virtual void OnMessage()\n    {\n    }\n\n    public\
    \ void Message()\n    {\n        OnMessage();\n        Console.WriteLine(\"MyClass\"\
    );\n    }\n}\n```\n\nAny derived class can override OnMessage() and add their\
    \ own work to the Message() method declared in MyClass2. It’s a pattern you’ve\
    \ seen before when classes implement IDisposable (see Item 17).\n\nExplicit interface\
    \ implementation (see Item 31) enables you to implement an interface, hide its\
    \ members from the public interface of your type. Its use a few other twists in\
    \ the relationships between implementing and overriding virtual functions. You\
    \ use explicit interface implementation to limit client code using the interface\
    \ methods when a more appropriate version is available. The IComparable idiom\
    \ in Item 31 shows this in detail.\n\nThere is also one last wrinkle to add to\
    \ working with interfaces and base classes. A base class can provide a default\
    \ implementation for methods in an interface. Then, a derived class can declare\
    \ that it implements an interface and inherit the implementation from that base\
    \ class, as this example shows."
