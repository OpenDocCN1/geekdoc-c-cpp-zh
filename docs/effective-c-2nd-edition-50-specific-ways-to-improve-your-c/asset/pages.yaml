  md: "```\nvar rightOperand = Expression.Parameter(typeof(T2),\n    \"right\");\n\
    var body = Expression.Add(leftOperand, rightOperand);\nvar adder = Expression.Lambda<Func<T1,\
    \ T2, TResult>>(\n    body, leftOperand, rightOperand);\n    compiledExpression\
    \ = adder.Compile();\n```\n\nAt this point, you're probably wondering which technique\
    \ to use: dynamic or Expressions. That decision depends on the situation. The\
    \ Expression version uses a slightly simpler set of runtime computations. That\
    \ might make it faster in many circumstances. However, expressions are a less\
    \ dynamic than dynamic invocation. Remember that with dynamic invocation, you\
    \ could add many types successfully: int and double, short and float, whatever.\
    \ As long as it was legal in C# it was legal in the compiled version. You could\
    \ even add a string and number. If any of those dynamic versions will throw an\
    \ InvalidOperationException. Even though there are conversion operations that\
    \ work, the Expressions you've built don't build those conversions into the lambda\
    \ expression. Dynamic invocation does more work and therefore supports more types\
    \ of operations. For instance, suppose you want to update the Expression to add\
    \ different types and perform the proper conversions. Well, you just have to update\
    \ the code that builds the expression to include the conversions from the parameter\
    \ types to the result type yourself. Here's what it looks like:\n\n```\n// A fix\
    \ for one problem causes another\npublic static TResult AddExpressionWithConversion\n\
    <T1, T2, TResult>(T1 left, T2 right)\n{\n    var leftOperand = Expression.Parameter(typeof(T1),\n\
    \        \"left\");\n    Expression convertedLeft = leftOperand;\n    if (typeof(T1)\
    \ != typeof(TResult))\n    {\n        convertedLeft = Expression.Convert(leftOperand,\n\
    \            typeof(TResult));\n    }\n    var rightOperand = Expression.Parameter(typeof(T2),\n\
    \        \"right\");\n```"
