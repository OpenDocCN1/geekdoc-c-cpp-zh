  md: "# Item 44: Minimize Dynamic Objects in Public APIs | 269\n\nDynamic is not\
    \ free. There's quite a bit of code generated by the compiler to make dynamic\
    \ invocation in C#. Worse, this code will be repeated everywhere that you invoke\
    \ the dynamic Add() method. That's going to have size and performance implications\
    \ on your application. You can wrap the Add() method shown in Item 38 in a bit\
    \ of generic syntax to create a version that keeps the dynamic types in a constrained\
    \ location. The same code will be generated in fewer places:\n\n```\nprivate static\
    \ dynamic DynamicAdd(dynamic left,\ndynamic right)\n{\n  return left + right;\n\
    }\n```\n\n```\n// Wrap it it:\npublic static T1 Add<T1, T2>(T1 left, T2 right)\n\
    {\n  dynamic result = DynamicAdd(left, right);\n  return (T1)result;\n}\n```\n\
    \nThe compiler generates all the dynamic callsite code in the generic Add() method.\
    \ It isolates it into one location. Furthermore, the callsites become quite bit\
    \ simpler. Where previously every result was statically typed to match the type\
    \ of the first argument. Of course, you can create an overload to control the\
    \ result type:\n\n```\npublic static TResult Add<T1, T2, TResult>\n{\n  dynamic\
    \ result = DynamicAdd(left, right);\n  return (TResult)result;\n}\n```\n\nIn either\
    \ case, the callsites live completely in the strongly typed world:\n\n```\nint\
    \ answer = Add(5, 5);\nConsole.WriteLine(answer);\n\ndouble answer2 = Add(5.5,\
    \ 7.3);\nConsole.WriteLine(answer2);\n```\n\nwww.it-ebooks.info"
