    \ and IComparable. Even code that relies on the classic IComparable will have\
    \ fewer times when boxing and unboxing is necessary because the client can call\
    \ IComparable.CompareTo() without unboxing the object.\n\nBase classes describe\
    \ and implement common behaviors across related concrete types. Interfaces describe\
