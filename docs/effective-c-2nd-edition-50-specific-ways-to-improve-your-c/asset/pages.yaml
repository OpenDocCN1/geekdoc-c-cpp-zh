  md: "```\n// usage:\nvoid Func()\n{\n    // The lifetime of s controls access to\n\
    \    // the system resource.\n    CriticalSection s = new CriticalSection();\n\
    \    // Do work.\n\n    // ...\n    // compiler generates call to destructor.\n\
    \    // code edits critical section.\n}\n```\n\nThis common C++ idiom ensures\
    \ resource deallocation is exception-proof. This doesn't work in C#, however—at\
    \ least, not in the same way. Deterministic finalization is not part of the .NET\
    \ environment or the C# language. Trying to force the C++ idiom of deterministic\
    \ finalization into the C# language won't work well. In C#, the finalizer eventually\
    \ executes, but it doesn't execute in a timely fashion. In the previous example,\
    \ the code eventually executes the critical section, but in C#, it doesn't execute\
    \ the critical section when the function exits. That happens at some time later.\
    \ You don't know when. You can't know when. Finalizers are the only way to guarantee\
    \ that unmanaged resources allocated by an object of a given type are eventually\
    \ released. Finalizers execute at nondeterministic, so your design and coding\
    \ practices should minimize the need for creating finalizers, and also minimize\
    \ the need for executing the finalizers that do. Throughout this chapter you'll\
    \ learn when you must create a finalizer, and to minimize the negative impact\
    \ of having one.\n\nRelying on finalizers also introduces performance penalties.\
    \ Objects that require finalization put a performance drag on the Garbage Collector.\
    \ When the GC finds that an object is garbage but also requires finalization,\
    \ it cannot remove it from memory just yet. First, it calls the finalizer. Finalizers\
    \ are not executed by the same thread that collects garbage. Instead, the GC places\
    \ each object that is ready for finalization in a queue and spawns another thread\
    \ to execute all the finalizers. It continues with its business, removing garbage\
    \ from memory. On the next GC cycle, those objects that have been finalized are\
    \ removed from memory. Figure 2.2 shows three different GC operations and the\
    \ difference in memory usage. Notice that the objects that require finalizers\
    \ stay in memory for extra cycles."
