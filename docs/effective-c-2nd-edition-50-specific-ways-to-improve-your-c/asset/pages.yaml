    \ to private details in your types. If you don't supply serialization, it's difficult\
    \ or impossible for users of your class to add it.\n\nInstead, prefer adding serialization\
    \ to your types when practical. It should be practical for all types that do not\
    \ represent UI widgets, windows, or forms. The extra perceived work is no excuse\
    \ ..NET serialization support is so simple that you don't have any reasonable\
