    \ The best place to begin is the RunAsync method itself:\n\n```\npublic static\
    \ void RunAsync<T, TResult>(n    IEnumerable<T> taskParams,\n    Func<T, Task<TResult>>\
    \ taskStarter,\n    Action<Task<TResult>> taskFinisher\n{\n    taskParams.Select(param\
    \ => taskStarter(param));\n    AsParallel().\n    ForAll(t => t.ContinueWith(t2\
    \ => taskFinisher(t2)));\n}\n```\n\nThis method creates a task for each input\
    \ parameter, returns the set of tasks. Next, you need to opt into parallel processing\
