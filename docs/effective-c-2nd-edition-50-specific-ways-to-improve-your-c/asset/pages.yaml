    # Item 9: Avoid Conversion Operators in Your APIs


    Conversion operators introduce a kind of substitutability between classes. Substitutability
    means that one class can be substituted for another. This can be a benefit: An
    object of a derived class can be substituted for an object of its base class,
    as in the classic example of the shape hierarchy. You create a Shape base class
    and derive a variety of customizations: Rectangle, Ellipse, Circle, and so on.
    You can substitute a Circle anywhere a Shape is expected. That''s using polymorphism
    for substitutability. It works because a circle is a specific type of shape. When
    you create a class, certain conversions are allowed automatically. Any object
    can be substituted for an instance of System.Object, the root of the .NET class
    hierarchy. In the same fashion, any object of a class you create will be substituted
    implicitly for an interface that it implements, or any of its base interfaces,
    or any of base classes. The language also supports a variety of numeric conversions.


    When you define a conversion operator for your type, then the compiler that your
    type may be substituted for the target type. These substitutions often result
    in subtle errors because your type probably isn''t a perfect sub-'
