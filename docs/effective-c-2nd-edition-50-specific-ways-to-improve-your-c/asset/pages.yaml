  md: "```\nset;\n}\n```\n\nYou’ll notice that the last examples use the C# 3.0 implicit\
    \ property syntax. Creating a property to wrap a backing store is a common pattern.\
    \ Often, you won’t need validation logic in the property getters or setters. The\
    \ language supports the simplified implicit property syntax to minimize exposing\
    \ a simple field as a property. The compiler creates a private member field (typically\
    \ called a backing store) for you and implements the obvious logic for both the\
    \ get and set accessors.\n\nYou can extend properties to abstract and define properties\
    \ as part of an interface definition, using similar syntax to implicit properties.\
    \ The example below shows a property definition in a generic interface. Note that\
