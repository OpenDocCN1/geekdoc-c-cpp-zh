  md: '# .NET Resource Management


    The simple fact that .NET programs run in a managed environment has a big impact
    on the kinds of designs that create effective C#. Taking advantage of that environment
    requires changing your thinking from other environments to the .NET Common Language
    Runtime (CLR). It means understanding the .NET Garbage Collector. An overview
    of the .NET memory management environment is necessary to understand the specific
    issues in this chapter, so let''s get on with the overview.


    The Garbage Collector (GC) controls managed memory for you. Unlike native environments,
    you are not responsible for memory leaks, dangling pointers, uninitialized pointers,
    or a host of other memory-management issues. But the Garbage Collector is not
    magic: You need to clean up after yourself, too. You are responsible for unmanaged
    resources such as file handles, database connections, GDI+ objects, COM objects,
    and other system objects. In addition you can cause objects to stay in memory
    longer than you''d like because of linked links between event handlers or delegates.
    Queries, can also cause objects to remain referenced longer than you would expect.
    Queries capture bound variables in closures, and those bound variables are reachable
    until the containing references have gone out of scope.


    Here''s the good news: Because the GC controls memory, certain design idioms are
    much easier to implement. Circular references, both simple relationships and complex
    webs of objects, are much easier. The GC''s Mark and Compact algorithm efficiently
    detects these relationships and removes unreachable webs of objects in their entirety.
    The GC determines whether an object is reachable by walking the object tree instead
    of forcing each object to keep track of references to it, as in COM. The EntitySet
    class provides an example of how this algorithm simplifies object ownership decisions.
    An Entity is a collection of objects loaded from a database. Each Entity may contain
    references to other Entity objects. Any of these entities may also contain links'
