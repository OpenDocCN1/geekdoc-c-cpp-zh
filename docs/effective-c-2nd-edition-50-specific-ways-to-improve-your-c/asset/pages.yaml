  md: '# Introduction


    The C# community is very different in 2010 than it was in 2004 when the first
    edition of Effective C# was published. There are many more developers using C#.
    A large contingent of the C# community is now seeing C# as their first professional
    language. They aren''t approaching C# with a set of ingrained habits formed using
    a different language. The community has a much broader broader range of experience.
    New graduates all the way to professionals with decades of experience are using
    C#.


    The C# language has also grown in the last five years. The language I covered
    in the first edition did not have generics, lambda expressions, LINQ, and many
    of the other features we now take for granted. C# 4.0 adds new features that change
    our toolset again. And even with all the growth in the C# language, much of the
    original advice is as relevant as it was in the C# 1.x days. Viewed in hindsight,
    the changes to the C# language appear to be natural and obvious extensions to
    what we had in C# 1.0. New editions give us new ways of solving problems, without
    invalidating previous idioms.


    I organized this second edition of Effective C# by taking into account the changes
    in the language and the changes in the C# community. Effective C# does not take
    you on a historical journey through the changes in the language. Rather, I provide
    advice on how to use the current C# language. The items that have been removed
    from this second edition are those that aren''t relevant in today''s C# language.
    The new items cover the new language and framework features, and the practices
    the community has learned from building several versions of software products
    using C#. Overall, these items are a set of recommendations that will help you
    use C# 4.0 more effectively as a professional developer.


    This book covers C# 4.0, but it is not an exhaustive treatment of the new language
    features. Like all books in the Effective Software Development Series, this book
    offers practical advice on how to use these features to solve problems you''re
    likely to encounter every day. Many of the items are equally valid in the 3.0
    and even earlier versions of the language.'
