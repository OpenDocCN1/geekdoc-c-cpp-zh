  md: '# # C# Language Idioms


    Why should you change what you are doing today if it works? The answer is that
    you can be better. You change tools or languages because you can be more productive.
    You don''t realize the expected gains if you don''t change your habits. This is
    harder when the new language, C#, has so much in common with a familiar language,
    such as C++ or Java. C# is another curly braced language, making it easy to fall
    into the idioms you use in other languages family. That will prevent you from
    getting the most out of C#. The C# language has evolved since its first commercial
    release in 2001. It''s now much further removed from C++ or Java than it was in
    its original release. If you are approaching C# from another language, you need
    to learn the C# idioms so that the language works with you, rather than against
    you. This chapter discusses the habits that you should change—and what you should
    do instead.


    # ## Item 1: Use Properties Instead of Accessible Data Members


    Properties have always been first-class citizens in the C# language. Several enhancements
    from the 1.0 release of the C# language have made properties even more expressive.
    You can specify access restrictions on the getter and setter. Implicit properties
    minimize the hard typing for properties instead data members. If you''re still
    creating public variables in your types, stop now. If you''re still creating get
    and set by methods, stop now. Properties let you expose data members as part of
    your public interface and still provide the encapsulation you want in an object-oriented
    environment. Properties are language elements that are accessed as though they
    are data members, but they are implemented as methods.


    Some members of a type are best represented as data: the name of a customer, the
    x,y location of a point, or last year''s revenue. Properties enable you to create
    an interface that acts like data but still has the benefits of a method. Client
    code accesses properties as though they are public fields. But the actual implementation
    uses methods, in which you define the behavior of property assessors.'
