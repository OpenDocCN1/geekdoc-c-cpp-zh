    \ class could implement a method that returned a collection of WeatherData objects.\
    \ That would look something like:\n\n```\npublic List<WeatherData> DataSequence\n\
    {\n    get { return sequence; }\nprivate List<WeatherData> sequence = new List<WeatherData>();\n\
    ```\n\nThat leaves you vulnerable to future problems. At some point, you might\
    \ change from using a List<WeatherData> to exposing an array, a SortedList<T>.\
    \ Any of those changes will break the code. Sure, you can change the parameter\
    \ type, but changing the public interface to a class causes you to make more changes\
    \ to a large system; you would need to change all the locations where the public\
    \ property was accessed.\n\nThe second problem is more immediate and more troubling:\
    \ The List<T> class provides numerous methods to change the data it contains.\
    \ Uses of your class could delete, modify, or even replace every object in the\
    \ sequence. That almost certainly not your luck. Luckily, you can limit the capabilities\
    \ of your class. Instead of returning a reference to some internal object, you\
    \ should return the interface you intend clients to use. That would mean returning\
    \ an IEnumerable<WeatherData>.\n\nWhen you expose properties as class types, it\
    \ exposes the entire interface to that class. Using interfaces, you can choose\
    \ to expose only the methods and properties you want clients to use. The class\
    \ used to implement the interface is an implementation detail that can change\
    \ over time (see Item 26).\n\nFurthermore, unrelated types can implement the same\
    \ interface. Suppose you're building an application that manages employees, customers,\
