  md: "resources must be managed by developers: you and the users of your classes.\
    \ Two mechanisms help developers control the lifetimes of unmanaged resources:\
    \ finalizers and the IDisposable interface. A finalizer is a defensive mechanism\
    \ that ensures your objects have a way to release unmanaged resources. Finalizers\
    \ have many drawbacks, so you also have the IDisposable interface that provides\
    \ a less intrusive way to return resources to the system in a timely manner.\n\
    \nFinalizers are called by the Garbage Collector. They will be called some time\
    \ after an object becomes garbage. You don't know when that happens. All you know\
    \ is that it happens sometime after your object cannot be reached. That is a big\
    \ change from C++, and it has important ramifications for your designs. Experienced\
    \ C++ programmers wrote classes that allocated a critical resource in its constructor\
    \ and released it in its destructor:\n\n```\n// Good C++, bad C:\nclass CriticalSection\n\
    {\n    // Constructor acquires the system resource.\n    public CriticalSection()\n\
    \    {\n        EnterCriticalSection();\n    }\n\n    // Destructor releases system\
    \ resource.\n    ~CriticalSection()\n    {\n        ExitCriticalSection();\n \
    \   }\n\n    private void ExitCriticalSection()\n    {\n        throw new NotImplementedException();\n\
    \    }\n\n    private void EnterCriticalSection()\n    {\n        throw new NotImplementedException();\n\
    \    }\n}\n```"
