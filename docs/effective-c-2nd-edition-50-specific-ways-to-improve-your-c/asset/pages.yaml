    release, use optional and named parameters to create whatever combination of overloads
    your users may want to use. However, once you start future releases, you must
    create overloads for additional parameters. That way, existing client applications
    will still function. Furthermore, in any future release, avoid changing parameter
    names. They are now part of your public interface.


    # Item 11: Understand the Attraction of Small Functions


    As experienced programmers, in what language we favored before C#, we internalized
    several practices for developing more efficient code. Sometimes what we worked
    in our previous experience is counterproductive in the .NET environment. This
    is very true when you try to hand-optimize algorithms for the C# compiler. Your
    actions prevent the JIT compiler from more optimizations. Your extra work, in
    the name of performance, generates slower code. You''re better writing the clearest
    code you can create. Let the JIT compiler do the rest. One of the most common
    examples of premature causing problems is when you get longer, more complicated
    functions in the hopes of avoiding function calls. Practices such as hoisting
    function logic into the bodies of loops actually harm the performance of .NET
    applications. It''s counterintuitive, so let''s go over all the details.


    The .NET runtime invokes the JIT compiler to translate the IL generated by the
    C# compiler into machine code. This task is amortized across the lifetime of your
    program''s execution.'
