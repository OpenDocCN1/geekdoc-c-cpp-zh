  md: '# Item 1: Use Properties Instead of Accessible Data Members


    change from a public data member to the equivalent public property, you must recompile
    all code that uses the public data member. C# treats binary assemblies as first-class
    citizens. One goal of the language is that you can release a single updated assembly
    without upgrading the entire application. The simple act of changing a data member
    to a property breaks binary compatibility. It makes upgrading single assemblies
    that have been deployed much more difficult.


    While looking at the IL for a property, you probably wonder about the relative
    performance of properties and data members. Properties will not be faster than
    data member access, but they might not be slower. The JIT compiler does inline
    some method calls, including property accessors. When the JIT compiler does inline
    propertyors, the performance of data members and properties is the same. Even
    when a property accessor has not been inlined, the actual performance difference
    is the negligible cost of one function call. That is measurable only in a small
    number of situations.


    Properties are methods that can be viewed from the code like data. That puts some
    expectations into your users'' heads. They will see a property access as though
    it was a data access. After all, your property accessors should live up to those
    expectations. Get accessors should not have observable side effects. Set accessors
    modify the state, and users should be able to see these changes.


    Property accessors also have performance expectations for your users. A property
    access looks like a data field access. It should not have performance characteristics
    that are significantly different than a simple data access. Property accessors
    should not perform lengthy computations, or make cross-application calls (such
    as perform database queries), or do other lengthy operations that would be inconsistent
    with your users'' expectations for a property accessor.


    Whenever you expose data in your type''s public or protected interfaces, use properties.
    Use an indexer for sequences or dictionaries. All data members should be private,
    without exception. You immediately get support for data binding, and you make
    it easier to make changes to the implementation of the methods in the future.
    The extra typing to encapsulate any variable in a property amounts to one or minutes
    of your day. Finding that you need to use properties later to correctly express
    your designs will take hours. Spend a little time now, and save yourself lots
    of time later.'
