  md: "Finally, watch out for non-CLS types sneaking into an interface when you use\
    \ polymorphic arguments. It's easy to do with event arguments. You can create\
    \ a type that is not compliant with CLS and use it where a base type that CLS-compliant\
    \ is expected.\n\nSuppose that you created this class derived from EventArgs:\n\
    \n```\npublic class BadEventArgs : EventArgs\n{\n    public UInt32 ErrorCode;\n\
    }\n```\n\nThe BadEventArgs type is not CLS compliant; you should not use it with\
    \ event handlers written in other languages. But polymorphism makes this easy\
    \ to do. You can declare the event type to use the base class, EventArgs:\n\n\
    ```\n// Hiding the non-compliant event argument\npublic delegate void MyEventHandler(\n\
    \    object sender, EventArgs args );\n```\n\n```\npublic event MyEventHandler\
    \ OnStuffHappens;\n```\n\n```\n// Code to raise Event:\nBadEventArgs arg = new\
    \ BadEventArgs();\narg.ErrorCode = 24;\n```\n\n```\n// Interface is legal, runtime\
    \ type is not:\nOnStuffHappens(this, arg);\n```\n\nThe interface declaration,\
    \ which uses an EventArgs argument, is CLS compliant. However, the actual type\
    \ you substituted in the event arguments was not. The end result is a type that\
    \ some languages cannot use. Developers trying to use those types will not be\
    \ able to call the methods in your assembly. Their language may hide the visibility\
    \ of those APIs. Or, they may show that the APIs exist but not provide a way to\
    \ access them.\n\nThis discussion of CLS compliance ends with how CLS-compliant\
    \ classes implement noncompliant interfaces. It can get complicated, but we'll\
    \ simplify it. Understanding CLS compliance with interfaces also will help you\
    \ fully understand what it means to be CLS compliant and how the environment views\
    \ compliance."
