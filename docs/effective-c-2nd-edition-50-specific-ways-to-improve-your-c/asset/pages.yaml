  md: '# Item 50: Prefer Smaller, Cohesive Assemblies


    gram flow crosses boundaries. The CLR loader has a little more work to do to load
    many assemblies and turn IL into machine instructions, particularly resolving
    function addresses.


    Extra security checks also are done across assembly boundaries. All code from
    the same assembly has the same level of trust (not necessarily the same access
    rights, but same trust level). The CLR performs security checks whenever flow
    crosses an assembly boundary. The fewer times your program flow crosses assembly
    boundaries, the more efficient it will be.


    None of these performance concerns should dissuade you from breaking assemblies
    that are too large. The performance penalties are minor. C# and .NET were designed
    with components in mind, and the greater flexibility is worth the price.


    So how do you decide how much code or many classes go in one assembly? More important,
    how do you decide which code goes in an assembly? It depends greatly on the specific
    application, so there is not one answer. Here is my recommendation: Start by looking
    at all your public classes. Combine public classes with common base classes into
    assemblies. Then add the utility classes necessary to provide all the functionality
    associated with the public classes in that same assembly. Package related public
    interfaces into their own assemblies. As a final step, look for classes that are
    used horizontally across your application. Those are candidates for a broad-based
    utility assembly that contains your application''s utility library.


    The end result is that you create a component with a single related set of public
    classes and the utility classes necessary to support it. You create an assembly
    that is small enough to get the benefits of easy updates and reuse, while minimizing
    the costs associated with multiple assemblies. Well-designed, cohesive components
    can be described in one simple sentence. For example, "Common.Storage.dll manages
    the offline data cache and all user settings" describes a component with low cohesion.
    Instead, make two components: "Common.Data.dll manages the offline data cache.
    Common.Settings.dll manages user settings." When you split those up, you might
    need a third component: "Common.EncryptedStorage.dll manages file system IO for
    encrypted storage." You can update any of those components independently.'
