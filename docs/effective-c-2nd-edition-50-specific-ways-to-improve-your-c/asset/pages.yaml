  md: '# Item 47: Prefer the Strong Exception Guarantee


    community does not need to create its own strategies for exception safety; the
    C++ community did all the hard work for us. Starting with Tom Cargill''s article
    “Exception Handling: A False Sense of Security,” and continuing with writings
    by Dave Abrahams, Herb Sutter, Scott Meyers, Matt Austern, and Greg Colvin, the
    C++ community developed a series of best practices that we can adapt to C#. The
    discussions on exception handling occurred over the course of six years, from
    1994 to 2000. They discussed, debated, and examined many twists on a difficult
    problem. We should leverage all that hard work in C#.


    Dave Abrahams defined three exception-safety guarantees: the basic guarantee,
    the strong guarantee, and the no-throw guarantee. Herb Sutter discussed these
    guarantees in his book Exceptional C++ (Addison-Wesley, 2000). The basic guarantee
    states that no resources are leaked and all objects are in a valid state after
    your exception leaves the function emitting. It means that any finally clauses
    run in the method that throws. The strong exception guarantee builds if an exception
    occurs, the program did not change. The no-throw guarantee states that an operation
    never fails, from which it follows that a method does not throw exceptions. The
    strong exception guarantee provides the best tradeoff between recovering from
    exceptions and simplifying exception handling.


    You get some of the basic guarantee from the .NET CLR. The environment handles
    memory management. The only way you can leak resources due to exceptions is to
    throw an exception while you own a resource that implements IDisposable. Item
    15 explains how to avoid leaking resources in the face of exceptions. You are
    still responsible for ensuring that your object''s state is valid. Suppose your
    type caches the size of a collection, with the collection. You''d need to ensure
    that the size matches the actual storage after an Add() operation throws exception.
    There are countless applications may have that if only partially completed would
    leave your application in an invalid state. These cases are harder to handle,
    because there are fewer idioms for automatic support. Many of these can be solved
    by adhering to the strong guarantee.


    The strong guarantee states that if an operation terminates because of an exception,
    program state remains unchanged. Either an operation completes or it does not
    modify program state; there is no middle ground. The advantage of the strong guarantee
    is that you can more easily continue


