  md: 'Sure, you could reuse the source code and create different assemblies for the
    client and server-side business rules, but that would complicate your delivery
    mechanism. That leaves you with two builds and two installations to perform when
    you update the rules. Instead, separate the client-side validation from the most
    robust server-side validation by placing them in different assemblies. You are
    reusing binary objects, packaged in assemblies, rather than reusing object code
    or source code by compiling objects into multiple assemblies.


    An assembly should contain an organized library of related functionality. That''s
    easy implement to practice. The reality is that you might not know beforehand
    which classes will be distributed to both the server and client portions of a
    distributed application. Even more likely, the set of server- and client-side
    functionality will be somewhat fluid; you''ll move features between the two locations.
    By keeping the assemblies small, you''ll be more likely to redeploy easily on
    both client and server. The assembly is a binary building block for your application.
    That makes it easier to plug a new component into place in a working application.
    If you make a mistake, take too many smaller assemblies rather than too large
    ones.


    I often use Legos as an analogy for assemblies and binary components. You can
    pull out one Lego and replace it easily; it''s a small block. In the same way,
    you should be able to pull out one assembly and replace it with another assembly
    that has the same interfaces. The rest of the application should continue as if
    nothing happened. Follow the Lego analogy a little further. If all your parameters
    and return values are interfaces, any assembly can be replaced by another that
    implements the same interfaces (Item 22).


    Smaller assemblies also let you amortize the cost of application startup. The
    larger an assembly is, the more work the CPU does to load the assembly and convert
    the necessary IL into machine instructions. Only the routes called at startup
    are JITed, but the entire assembly gets loaded and the CLR creates stubs for every
    method in the assembly.


    Time to take a break and make sure we don''t go to extremes. This item is about
    making sure that you don''t create monolithic programs, but that you build systems
    of binary, reusable components. You can take this advice to heart. Some costs
    are associated with a large program but too many small assemblies. You will incur
    a performance penalty pro'
