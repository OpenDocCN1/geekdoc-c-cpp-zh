    # Item 44: Minimize Dynamic Objects in Public APIs


    Dynamic objects just don''t behave well in a statically typed system. The type
    system sees them as though they were instances of System.Object. But they are
    special instances. You can ask them to work above and beyond what''s defined in
    System.Object. The compiler generates code that tries to find and execute whatever
    members you try to access.


    But dynamic objects are pushy. Everything becomes dynamic. Perform an operation
    where any one of the parameters is dynamic, and the result is dynamic. Return
    a dynamic object from a method, and wherever dynamic used becomes a dynamic object.
    It''s like watching bread mold grow in a petri dish. Pretty soon, everything is
    dynamic, and there''s no safety left anywhere.


    Biologists grow cultures in petri dishes, restricting where they can grow. You
    need to do the same with dynamic: Do the work with dynamic objects in an isolated
    environment and return objects that are statically typed as something other than
    dynamic. Otherwise, and slowly, everything involved in your application will be
    dynamic.


    This is not to imply that dynamic is universally bad. Other items in this chapter
    have shown you of the techniques where dynamic programming is an excellent solution.
    However, dynamic typing and static typing are very different, with different practices,
    different idioms, and different strategies. Mixing them without regard will lead
    to numerous errors and inefficiencies. C# is a statically typed language, enabling
    dynamic typing in some areas. Therefore, if you''re using C#, you should spend
    most of your time using static typing and minimize the scope of the dynamic features.
    If you want to write programs that are dynamic through and through, you should
    consider a language that is dynamic rather than a static language.


    If you''re going to use dynamic features in your program, try to keep them out
    of the public interface to your types. That way, you can use dynamic typing in
    a single object (or type) petri dish without having escape'
