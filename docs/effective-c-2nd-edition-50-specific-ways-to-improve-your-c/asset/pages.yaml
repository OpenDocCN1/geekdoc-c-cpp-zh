    \ is available at runtime, it can be used. Here's a method that adds two dynamic\
    \ objects, as long as there is an available operator + at runtime\n\n```\npublic\
    \ static dynamic Add(dynamic left,\n    dynamic right)\n{\n    return left + right;\n\
    }\n```\n\nThis is my first discussion of dynamic, so let's look into what it's\
    \ doing. Dynamic can be thought of as \"System.Object with runtime binding.\"\
    \ At compile time, dynamic variables have only those methods defined in System.Object.\
    \ However, the compiler adds code so that every access is implemented as a dynamic\
    \ call site. At runtime, code executes the object and determine if the requested\
    \ method is available. (See Item 41 on implementing dynamic objects.) This is\
    \ often referred to as \"duck typing\": If it walks like a duck and talks like\
    \ a duck, it may well be a duck. You don't need to declare a particular interface,\
    \ or provide any compile-time type operations. As long as the members are available\
    \ at runtime, it will work.\n\nFor this method above, the dynamic call will determine\
    \ if there is an accessible + operator for the actual runtime types of the two\
    \ objects listed. All of these calls will provide a correct answer:\n\n```\ndynamic\
    \ answer = Add(5, S);\nanswer = Add(5.5, 7.3);\nanswer = Add(5, 12.3);\n```\n\n\
    Notice that the answer must be declared as a dynamic object. Because the call\
    \ is dynamic, the compiler can't know the type of the return value. The only way\
    \ to resolve the type of the return code at runtime is to make it a dynamic object.\
    \ The static type of the return value is dynamic. Its runtime type is resolved\
    \ at runtime.\n\nOf course, dynamic Add is not limited to numeric type. You can\
    \ add strings, because string does have an operator + defined:\n\n```\ndynamic\
    \ label = Add(\"Here is \", \"a label\");\n```"
