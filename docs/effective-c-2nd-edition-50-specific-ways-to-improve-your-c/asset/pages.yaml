    # Item 17: Implement the Standard Dispose Pattern


    We''ve discussed the importance of disposing of objects that hold unmanaged resources.
    Now it''s time to cover how to write your own resourcemanagement code when you
    create types that contain resources other than memory. A standard pattern is used
    throughout the .NET Framework for disposing of unmanaged resources. The users
    of your type will expect you to follow this standard pattern. The standard dispose
    idiom frees your unmanaged resources using the IDisposable interface when clients
    remember, and it use the finalizer defensively when clients forget. It works with
    the Garbage Collector to ensure that your objects pay the performance penalty
    associated with finalizers only when necessary. This is the right way to handle
    unmanaged resources, so it pays to understand it thoroughly.


    The root base class in the hierarchy should implement the IDisposable interface
    to free resources. This type should also add a finalizer as a defensive mechanism.
    Both of these routines delegate the work of freeing resources to a virtual method
    that the derived classes can override for their own resource-management needs.
    The derived classes need to override the virtual method to free its own resources
