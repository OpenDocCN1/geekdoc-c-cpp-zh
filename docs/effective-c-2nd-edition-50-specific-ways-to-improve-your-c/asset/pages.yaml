    Last, and most stringent, is the no-throw guarantee. The no-throw guarantee is
    pretty much what it sounds like: A method satisfies the no-throw guarantee if
    it is guaranteed to always run to completion and never let an exception leave.
    This isn''t practical for all routines in large programs. However, in a few locations,
    methods must enforce the no-throw guarantee. Finalizers and Dispose methods must
    not throw exceptions. In both cases, throwing an exception can cause more problems
    than any other alternative. In the case of a finalizer, throwing an exception
    terminates the program without further cleanup. Wrapping a large method in a try/catch
    block and swallowing all exceptions is how you achieve this-throw guarantee. Most
    methods that must satisfy the no-throw guarantee, such as Dispose() and Finalize(),
    have limited responsibilities.'
