  md: 'Here’s a simple query using method call syntax that calculates n! for the first
    150 numbers:


    ```

    var nums = data.Where(m => m < 150).

    Select(n => Factorial(n));

    ```


    You can make this a parallel query by simply adding AsParallel() as the first
    method on the query:


    ```

    var numsParallel = data.AsParallel().

    Where(m => m < 150).Select(n => Factorial(n));

    ```


    Of course, you can do the same kind of work with query syntax.


    ```

    var nums = from n in data

    where n < 150

    select Factorial(n);

    ```


    The Parallel relation relies on using AsParallel() on the data sequence:


    ```

    var numsParallel = from n in data.AsParallel()

    where n < 150

    select Factorial(n);

    ```


    The results are the same as with the method call.


    This first sample is very simple yet it illustrates a few important concepts used
    throughout LINQ. AsParallel() is the method you call to opt in parallel execution
    of any query expression. Once you call AsParallel(), subsequent operations will
    occur on multiple cores using multiple threads. AsParallel() returns an IParallelEnumerable
    rather than an IEnumerable. LINQ is implemented as a set of extension methods
    for IParallelEnumerable. They have almost exactly the same signatures as the methods
    found in the Enumerable class that extends IEnumerable. Simply substitute IParallelEnumerable
    for IEnumerable in both parameters and return values. The advantage of this choice
    is that LINQ follows the same patterns that all LINQ providers follow. That makes
    LINQ very easy to learn. Everything you know about LINQ, in general, will apply
    to LINQ.


    Of course, it’s not quite simple. This initial query is very easy to use with
    PLINQ. It does not have any shared data. The order of the results doesn’t matter.
    That’s why it is possible to get a speedup in direct proportion to the number
    of cores in the machine upon which this code'
