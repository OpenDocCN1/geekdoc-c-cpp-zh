  md: "# Item 6: Understand the Relationships Among the Many Different Concepts of\
    \ Equality 37\n\nLet’s start with the two functions you should never change. Object\
    \ .ReferenceEquals() returns true if two variables refer to the same object—that\
    \ is, the two variables being reference types or value types, this method always\
    \ tests object identity, not object contents. Yes, that means ReferenceEquals()\
    \ always returns false when you use it to test value types. Even when you compare\
    \ a value type to itself, ReferenceEquals() returns false. This is due to boxing,\
    \ which is covered in Item 45.\n\n```\nint i = S;\nint j = S;\nif (Object.ReferenceEquals(i,\
    \ j))\n    Console.WriteLine(\"Never happens.\");\nelse\n    Console.WriteLine(\"\
    Always happens.\");\n\nif (Object.ReferenceEquals(i, i))\n    Console.WriteLine(\"\
    Never happens.\");\nelse\n    Console.WriteLine(\"Always happens.\");\n```\n\n\
    You’ll never redefine Object.ReferenceEquals() because it does exactly what it\
    \ is supposed to do: test the object identity of two different variables.\n\n\
    The second function you tests whether two variables are equal when you don’t know\
    \ the runtime type of the two arguments. Remember that System.Object is the ultimate\
    \ base class for everything in C#. Any you compare two variables, they are instances\
    \ of System.Object. Value types and reference types are instances of System.Object.\
