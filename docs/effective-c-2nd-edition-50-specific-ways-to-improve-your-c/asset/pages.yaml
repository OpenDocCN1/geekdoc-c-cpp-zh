  md: '# 214 Chapter 4 Working with the Framework


    PLINQ tries to create the best implementation for the queries you write in order
    to generate the results you need with the least amount of work, and in the least
    amount of time. Sometimes that means PLINQ queries execute in a different manner
    than you would expect. Sometimes it act more like LINQ to Objects, asking for
    the next item in the output sequence executes the code it produces. Sometimes
    it will behave more like LINQ to SQL or Entity Framework in asking for the first
    item will produce all of them. Sometimes it will behave like a mixture of the
    two. You should make sure that you don''t introduce any side effects in your LINQ
    queries. Those will be unreliable in a PLINQ execution model. You should construct
    your queries with some care to ensure that you get the most out of the underlying
    technology. That requires you to understand how they work differently.


    Parallel algorithms are limited by Amdahl''s law: The speedup of a program using
    multiple processors is limited by the sequential fraction of the program. The
    extension methods in ParallelEnumerable are no exception to this rule. Many of
    these methods can operate in parallel, but some of them will affect the degree
    of parallelism require some coordination between tasks. Skip, SkipWhile, Take,
    and TakeWhile will affect the degree of parallelism. Parallel tasks running on
    different cores finish in different orders. You use the AsOrdered() and AsUnordered()
    methods to instruct PLINQ as to whether or not order matters in the result sequence.


    Sometimes your own algorithm relies on side effects and cannot be parallelized.AsSequential()
    extension method to interpret a parallel sequence as IEnumerable and force sequential
    execution.


    Finally, ParallelEnumerable contains methods that allow you to control how PLINQ
    executes parallel queries. You can use WithExecutionMode() to suggest parallel
    execution, even if that means selecting a high overhead algorithm. By default,
    PLINQ will parallelize those constructs where it expects parallelism to help.
    You can use DegreeOfParallelism() to suggest the number of threads that may be
    used in your algorithm. Usually, PLINQ will allocate threads based on the number
    of processors on the current machine. You can also use the WithMergeOptions()
    to request a change in how PLINQ controls buffering results during a query. Usually,
    PLINQ will buffer results from each thread before them'
