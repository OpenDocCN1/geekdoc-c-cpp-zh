  md: "# Chapter 6 Miscellaneous\n\nYou cannot build a CLS-compliant assembly if you\
    \ have types in your public or protected interface that are not CLS compliant.\
    \ If, as a component designer, you do not have an assembly marked as CLS compliant,\
    \ you make it harder for users of your component to create CLS-compliant assemblies.\
    \ You must hide your types and mirror the functionality in a CLS-compliant wrapper.\
    \ Yes, this can be done. But, no, it's not a good way to treat the programmers\
    \ who want to use your components. It's better to strive for CLS-compliant assemblies\
    \ in all your work: This is the easiest way for clients to incorporate your work\
    \ in their CLS-compliant assemblies.\n\nThe second rule is up to you: You need\
    \ to make sure that you provide a language-agnostic way to perform all public\
    \ and protected operations. You need to make sure that you do not sneak a noncompliant\
    \ object through your interface using polymorphism.\n\nOperator overloading is\
    \ a feature that some love and others hate. As, not every language supports or\
    \ operator overloading. The CLS standard does not take a pro or cons on the concept\
    \ of operator overloading. Instead, it defines a function name for each operator:\
    \ op_equals is the function name created when you write an operator = . op_add\
    \ is the name for an overloaded addition operator. When you write an overloaded\
    \ operator, the operator syntax can be used in languages that support overloaded\
    \ operators. Developers using a language that does not support operator overloading\
    \ use the op_function name. If you expect these programmers to use your CLS-compliant\
    \ assembly, you should provide a more convenient syntax. That leads to this simple\
    \ recommendation: Anytime you overload an operator, create a semantically equivalent\
    \ function:\n\n```\n// Overloaded Addition operator, preferred C# syntax:\npublic\
    \ static Foo operator +(Foo left, Foo right)\n{\n    // Use the same implementation\
    \ as the Add method:\n    return Foo.Add(left, right);\n}\n```\n\n```\n// Static\
    \ function, desirable for some languages:\npublic static Foo Add(Foo left, Foo\
    \ right)\n{\n    return new Foo(left.Bar + right.Bar);\n}\n```"
