  md: "# Item 22: Prefer Defining and Implementing Interfaces to Inheritance 131\n\
    \nThis implementation reuse provides another benefit: If you add a method to the\
    \ base class, all derived classes are automatically and implicitly enhanced. In\
    \ that sense, base classes provide a way to extend the behavior of several types\
    \ efficiently over time: By adding and implementing functionality in the base\
    \ class, all derived classes immediately incorporate that behavior. Adding a member\
    \ to an interface breaks all the classes that implement that interface. They will\
    \ not contain the new method and will no longer compile. Each implementer must\
    \ update that type to include the new member.\n\nChoosing between an abstract\
    \ class and an interface is a question of how to best support your abstractions\
    \ over time. Interfaces are fixed: You release an interface as a contract for\
    \ a set of functionality that any type can implement. Base classes can be extended\
    \ over time. These extensions become part of every derived class.\n\nThe two models\
    \ can be mixed to reuse implementation code while supporting multiple interfaces.\
    \ One obvious example in the .NET Framework is the IEnumerable<T> interface and\
    \ the System.Linq.Enumerable class. The System.Linq.Enumerable class contains\
    \ a large number of extension methods defined on the System.Collections.Generic.IEnumerable<T>\
    \ interface. That separation enables very important benefits. Any class that implements\
    \ IEnumerable<T> appears to include all those extension methods. However, those\
    \ additional methods are not formally defined in the IEnumerable<T> interface.\
    \ That class developers do not need to create their own implementation of all\
    \ methods.\n\nExamine this class that implements IEnumerable<T> for weather observations.\n\
    \n```\npublic enum Direction\n{\n    North,\n    NorthEast,\n    East,\n    SouthEast,\n\
