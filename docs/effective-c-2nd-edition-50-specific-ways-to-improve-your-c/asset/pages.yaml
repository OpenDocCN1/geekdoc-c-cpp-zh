    \ types can implement interfaces. What's more, it's easier for other developers\
    \ to implement an interface than it is to derive from a base class you've created.\n\
    \nWhat you can't do in an interface provide implementation for any of these members.\
    \ Interfaces contain no implementation whatsoever, and they cannot contain any\
    \ concrete data members. You are declaring the binary contract that must be supported\
