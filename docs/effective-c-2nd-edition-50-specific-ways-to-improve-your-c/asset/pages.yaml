    Sometimes, the short-term inconvenience of changing your method is still better.


    The new modifier must be used with caution. If you apply it indiscriminately,
    you create ambiguous method calls in your objects. It''s for the special case
    when upgrades of your base class cause collisions in your class. Even in that
    situation, think carefully before using it. Most importantly, don''t use it in
    any other situations.


    # Item 34: Avoid Overloading Methods Defined in Base Classes


    When a base class chooses the name of a member, it assigns the semantics to that
    name. Under no circumstances will the derived class use the same name for different
    purposes. And yet, there are many other reasons why a derived class might use
    the same name. It may want to implement the same semantics in a different way,
    or with different parameters. Sometimes that''s naturally supported by the language:
    Class designers declare virtual functions so that derived classes implement semantics
    differently. Item 33 covered why using the new modifier could lead to hard-to-bugs
    in your code. In this item, you''ll learn why creating overloads of methods that
    are defined in a base class leads to similar issues. You should not overload methods
    declared in a base class.


    The rules for overload resolution in the C# language are necessarily complicated.
    Possible candidate methods might be declared in the target class, any of its classes,
    extension method using the class, and interfaces it implements. Add generic methods
    and generic extension methods, and it gets very complicated. Throw in optional
    parameters, and I''m not sure anyone could know exactly what the results will
    be. Do you really want to add more complexity to this situation? Creating overloads
    for methods declared in your base class adds more possibilities to the best overload
    match. That increases the chance of ambiguity. It increases the chance that your
    interpretation of the spec is different than the compilers, and will certainly
    confuse your users. The solution is simple: Pick a different method name. It''s
