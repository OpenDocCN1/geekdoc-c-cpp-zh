    \ pattern is to begin a number of I/O tasks and perform some action on those results.\
    \ Ideally, I'd like to write something this:\n\n```\nurls.RunAsync(\n    url =>\
    \ start(url),\n    task => finishDownload(task.AsyncTask.ToString(),\n    task.Result));\n\
