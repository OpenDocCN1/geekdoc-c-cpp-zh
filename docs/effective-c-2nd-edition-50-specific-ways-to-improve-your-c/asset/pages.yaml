  md: "# 2 Chapter 1 C# Language Idioms\n\nThe .NET Framework assumes that you'll\
    \ use properties for your public data members. In fact, the data binding classes\
    \ in the .NET Framework support properties, not public data members. This is true\
    \ for all the data binding libraries: WPF, Windows Forms, Web Forms, and Silverlight.\
    \ Data binding properties of an object to a user interface control. The data binding\
    \ mechanism uses reflection to find a named property in a type:\n\n```\ntextBoxCity.DataBindings.Add(\"\
    Text\",\naddress, \"City\");\n```\n\nThe previous code binds the Text property\
    \ of the textBoxCity control to the City object. It will not work with a public\
    \ data member City; the Framework Class Library designers did not support that\
    \ practice. Public data members are bad practice, so support for them was not\
    \ added. Their decision gives you yet another reason to follow the proper object-oriented\
    \ techniques.\n\nYes, data binding applies only to those classes that contain\
    \ elements that are displayed in your user interface logic. But that doesn't mean\
    \ properties should be used exclusively in UI logic. You should use properties\
    \ for other classes and structures. Properties are far easier to change as you\
    \ cover new requirements or behaviors over time. You might soon decide that your\
    \ customer type should never have a blank name. If you used a public property\
    \ for Name, that's easy to fix in one location:\n\n```\npublic class Customer\n\
    {\n    private string name;\n    public string Name\n    {\n        get { return\
    \ name; }\n        set {\n            if (string.IsNullOrEmpty(value))\n     \
    \           throw new ArgumentException(\"\"Name cannot be blank,\", \"Name\"\
    );\n            name = value;\n        }\n    }\n    // More Elided.\n}\n```"
