    If most of your users will be in one language, whatever that might be, separating
    languages into a separate assembly (or even one assembly per language) might make
    sense. On the other hand, if your user base will need to use CSV files in a variety
    of languages, multiple languages should be part of the core functionality. You
    need to decide if this new functionality is going to be useful to an overwhelming
    majority of users for your core functionality. If it is, then you should add the
    new functionality to the same assembly. On the other hand, if it is expected to
    be used only in some of the more complicated examples, then you should separate
