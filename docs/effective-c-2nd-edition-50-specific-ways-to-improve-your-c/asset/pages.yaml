    It''s more complicated than that of another GC generation decision.

    The .NET Garbage Collector defines generations to optimize its work.

    Generations help the GC identify the likeliest garbage candidates

    quickly. Any object created since the last garbage collection operation is a

    gereneration0 object. Any object that has survived one GC operation is a gen-

    eration 1 object. Any object that has survived two or more GC operationsnis a
    generation 2 object. The purpose of generations is to separate local

    variables and objects that stay around for the life of the application. Gen-

    eration 0 objects are mostly local variables. Member variables and global

    qualities enter generation 1 and eventually enter generation 2.


    The GC optimizes its work by limiting how often it examines first- and

    second-generation objects. Every GC cycle examines generation 0 objects.

    Roughly 1 GC out of 10 examines the generation 0 and 1 objects. Roughly

    1 GC out of 100 examines all objects. Think about finalization and

    it cost again: An object that requires finalization might stay in memory for

    ine GC cycles more than it would if it did not require finalization. If it still

    has not been finalized, it moves to generation 2. In generation 2, an object

    llives for an extra 100 GC cycles until the next generation 2 collection.


