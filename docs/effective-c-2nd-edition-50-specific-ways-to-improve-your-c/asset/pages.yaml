    # Item 35: Learn How PLINQ Implements Parallel Algorithms


    This is the item where I wish I could say that parallel programming is now as
    simple as adding AsParallel() to all your loops. It''s not, but PLINQ does make
    it much easier than it was to leverage multiple cores in your programs and still
    have programs that are correct. It''s by no means trivial to create programs that
    use of multiple cores, PLINQ makes it easier.


    You still have to understand when data access must be synchronized. You still
    need to measure the effects of parallel and sequential versions of the methods
    declared in ParallelEnumerable. Some of the methods involved in LINQ queries can
    execute in parallel very easily. Others force more sequential access to the sequence
