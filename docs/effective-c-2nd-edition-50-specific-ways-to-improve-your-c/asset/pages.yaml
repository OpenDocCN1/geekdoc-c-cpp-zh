    \ a (possibly parallel) task and contains properties to report on the input and\
    \ output values from the task. One of the methods Task<T> is ContinueWith(). It\
    \ will be called the task has finished running. In the RunAsync method, it calls\
    \ the taskFinisher, giving the Task as the parameter. That enables the caller\
    \ to perform any processing as the tasks finish. ForAll() performs the inverted\
    \ enumeration, so that it blocks until all tasks have completed.\n\nwww.it-ebooks.info"
