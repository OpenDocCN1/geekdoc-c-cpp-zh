  md: "# Item 23: Understand How Interface Methods Differ from Virtual Methods\n\n\
    ```\nIMsg m = d as IMsg;\nm.Message(); // prints \"MyDerivedClass\"\nMyClass b\
    \ = d;\nb.Message(); // prints \"MyClass\"\n\n```\n\nOne way to fix this problem\
    \ is to modify the base class, declaring that the interface methods should be\
    \ virtual:\n\n```\npublic class MyClass : IMsg {\n    public virtual void Message()\
    \ {\n        Console.WriteLine(\"MyClass\");\n    }\n}\n\n```\n\n```\npublic class\
    \ MyDerivedClass : MyClass {\n    public override void Message() {\n        Console.WriteLine(\"\
    MyDerivedClass\");\n    }\n}\n\n```\n\nMyDerivedClass—and all classes derived\
    \ from MyClass—can declare their own methods for Message(). The overridden version\
    \ will be called every time: through the MyClass reference, through the IMsg reference,\
    \ and through the MyClass reference.\n\nIf you like the concept of impure virtual\
    \ functions, just make one small change to the definition of MyClass:\n\n```\n\
    public abstract class MyClass : IMsg {\n    public abstract void Message();\n\
    }\n\n```\n\nYes, you can implement an interface without actually implementing\
    \ the methods in that interface. By declaring abstract versions of the methods\
    \ in the interface, you declare that all types derived from your type must implement\
    \ that interface. The IMsg interface is part of the declaration of MyClass, but\
    \ defining the methods is deferred to each derived class."
