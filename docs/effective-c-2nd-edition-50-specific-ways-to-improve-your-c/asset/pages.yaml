    a database. It''s not useful. Do not dispose of objects that are still being referenced
    elsewhere in your program.


    In some ways, resource management can be more difficult in C# than it was in C++.
    You can rely on deterministic finalization to clean up every resource you. A garbage-collected
    environment really is much simpler for you. The majority of the types you use
    do not implement IDisposable. Less than 100 classes in the .NET Framework implement
    IDisposable—that''s out of more than 1,500 types. When you use the ones that implement
    IDisposable, remember to dispose of them in all cases. You should wrap those objects
    in using clauses or try/finally blocks. Whichever you use, make sure that objects
    get disposed properly all the time, every time.


    # Item 16: Avoid Creating Unnecessary Objects


    The Garbage Collector is an excellent job of managing memory for you, and it removes
    unused objects in a very efficient manner. But no matter how you look at it, allocating
    and destroying a heap-based object takes more processor time than not allocating
    and not destroying a heap-based object. You can introduce serious performance
    drains on your program by creating an excessive number of reference objects that
    are local to your methods.


    So don''t overwork the Garbage Collector. You can follow some simple techniques
    to minimize the amount of work that the Garbage Collector needs to do on your
    program''s behalf. Reference types, even local variables, are allocated on the
    heap. Every local variable of a reference type becomes garbage as soon as that
    function exits. One very common bad practice is to allocate GDI objects in a Windows
    paint handler:'
