  md: "# Item 24: Express Callbacks with Delegates 145\n\npass the test embodied in\
    \ the predicate. The compiler takes the lambda expression, converts that to a\
    \ delegate, and uses the delegate to express the callback.\n\nTrueForAll() is\
    \ similar in that it applies the test to each of the elements, and determines\
    \ if the predicate is true for all items. RemoveAll() modifies the list counter\
    \ by removing all items for which the predicate is true.\n\nFinally, the List.ForEach()\
    \ method performs the specified action on each of the elements in the list. As\
    \ before, the compiler converts the lambda expression into a method and creates\
    \ a delegate referring to that method.\n\nYou’ll find numerous examples of this\
    \ concept in the .NET Framework. All of LINQ is built on delegates. Callbacks\
    \ are used to handle cross-thread marshalling in WPF and Windows Forms. Wherever\
    \ the .NET Framework needs a single method, it will use a delegate that callers\
    \ express in the form of a lambda expression. You should follow the same example\
    \ when you need a callback idiom in any of your APIs.\n\nFor historical reasons,\
    \ all delegates are multicast delegates. Multicast delegates wrap all the target\
    \ functions that have been added to the delegate in a single call. Two caveats\
    \ apply to this construct: It is not safe in the face of exceptions, and the return\
    \ value will be the return value of the last target function invoked by the multicast\
    \ delegate.\n\nInside a multicast delegate invocation, each target is called in\
    \ succession. The delegate does not catch any exceptions. Therefore, any exception\
    \ that the target throws ends the delegate invocation chain.\n\nA similar problem\
    \ exists with return values. You can define delegates that have return types other\
    \ than void. You could write a callback to check for user abort:\n\n```\npublic\
    \ void LengthyOperation(Func<bool> pred)\n{\n    foreach (ComplicatedClass cl\
    \ in container)\n    {\n        cl.DoLengthOperation();\n        // Check for\
    \ user abort:\n        if (false == pred())\n            return;\n    }\n}\n```"
