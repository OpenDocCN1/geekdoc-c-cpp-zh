    \ by performing other processing in your Dispose or finalize methods. Objects\
    \ are born when you construct them, and they die when the Garbage Collector reclaims\
    \ them. You can consider them comatose when your program can no longer access\
    \ them. If you cannot reach an object, you can't call any of its methods. For\
    \ all intents and purposes, it is dead. But objects that finalizers get a last\
    \ breath before they are declared dead. Finalizers should do nothing but clean\
    \ unmanaged resources. If a finalizer makes an object reachable, it has been resurrected.\
    \ It's alive and never lost, even though it has awoken from a comatose state.\
