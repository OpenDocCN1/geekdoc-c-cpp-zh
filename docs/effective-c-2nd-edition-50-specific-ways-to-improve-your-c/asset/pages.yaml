    ```\n\nYou still need to specify the one type parameter when you call Add. Doing\
    \ so gives you the advantage of being able to leverage the compiler to create\
    \ any conversions at the callsite. The compiler can promote ints to doubles and\
    \ so on.\n\nThere are also performance costs with using dynamic and building expressions\
    \ at runtime. Just like any dynamic system, your program has more work to do at\
    \ runtime the compiler did not perform any of its type checking. The compiler\
    \ must generate instructions to perform all these checks at runtime. I don't want\
    \ to overstate, but the C# compiler does produce efficient code for most cases,\
    \ using dynamic will be faster than writing your code to use reflection and produce\
    \ your own version of late binding. However, the amount of runtime work is nonzero;\
    \ the time it takes is nonzero. If you can solve a problem using static typing,\
    \ it will undoubtedly be more efficient than using dynamic types.\n\nWhen you\
    \ control all the types involved, and you can create an interface instead of dynamic\
    \ programming, that's the better solution. You can define the interface, program\
    \ against the interface, and implement the interface in all types that should\
    \ exhibit the behavior defined by the interface. The C# type system will make\
    \ it harder to introduce type errors in your code, and the compiler will produce\
    \ more efficient code because it can assume that certain classes of errors are\
    \ not possible.\n\nIn many cases, you can generate the generic API using lambdas\
    \ and force callers to define the code you would execute in the dynamic algorithm.\n\
    \nThe next choice would be using expressions. That's the right choice if you have\
    \ a relatively small number of permutations for different types, and a small number\
    \ of possible conversions. You can control what expressions get created and therefore\
    \ how much work happens at runtime."
