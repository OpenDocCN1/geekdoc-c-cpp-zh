  md: "# Chapter 3 Expressing Designs in C#\n\nimplementations of all elements defined\
    \ in the interface. You must implement all methods, supply and all property accessors\
    \ and indexers, and define all elements defined in the interface. You identify\
    \ and factor reusable behavior into interfaces. You use interfaces as parameters\
