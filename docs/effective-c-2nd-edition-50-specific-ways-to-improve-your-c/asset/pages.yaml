  md: '# Item 29: Support Generic Covariance and Contravariance 171


    But you might still be wasting bandwidth. Your last design works best when every
    known customer calls every day. That''s probably not true. If it is, your company
    has customer service problems that are far outside the scope of a software program.


    How can we further limit the size of each transaction without increasing the number
    of transactions or the latency of the service rep-responsiveness to a customer?
    You can make some assumptions about which customers in the database go to place
    calls. You track some statistics and find that if customers go six months without
    ordering, they are very unlikely to order again. So you stop retrying those customers
    and their orders at the beginning of the day. That shrinks the size of the initial
    transaction. You also find that any customer who calls shortly after placing an
    order is usually inquiring about the last order. So you modify the list of orders
    sent down to the client to include only the last order after all orders. This
    would not change the signatures of the server methods, but it would shrink the
    size of the packets back to the client.


    This hypothetical discussion focused on getting you to think about the communication
    between remote machines: You want to minimize both the frequency and the size
    of the transactions between machines. Those goals are at odds, and you need to
    make tradeoffs between them. You should end up close to the center of the two
    extremes, but err toward the side of fewer, larger transactions.


    # Item 29: Support Generic Covariance and Contravariance


    Type variance, and specifically, covariance and contravariance define the conditions
    under which one type can be substituted for another type. Whenever possible, you
    should decorate generic interfaces and delegate definitions to support generic
    covariance and contravariance. Doing so will enable your APIs to be used in many
    different ways, and safely. If you cannot substitute one type for another, it
    is called invariant.


    Type variance is one of those topics that many developers have encountered but
    not really understood. Covariance and contravariance are two different forms of
    type substitution. A return type is covariant if you can substitute a more derived
    type than the type declared. A parameter type is contravariant if you can substitute
    a more base parameter type than the type declared. Object-oriented languages generally
    support covariance of parameter types. You can pass an object of a derived type
