  md: '# # Chapter 6: Building APIs with ASP.NET Core 3


    # RESTful API Design Principles


    In today''s interconnected digital landscape, APIs (Application Programming Interfaces)
    play a crucial role in enabling communication and data exchange between disparate
    systems and services. REST (Representational State Transfer) has emerged as the
    dominant architectural style for designing web APIs, offering a set of principles
    and constraints that promote simplicity, scalability, and maintainability. In
    this section, we''ll delve into the core tenets of RESTful API design, exploring
    their essence, benefits, and practical implementation within the context of ASP.NET
    Core 3.


    # Understanding REST


    At its core, REST is an architectural style that leverages the underlying principles
    of the HTTP protocol to create a standardized and intuitive way for systems to
    interact over the web. It emphasizes a client-server model, where clients send
    requests to servers to access and manipulate resources, and servers respond with
    representations of those resources.


    # Core Principles of REST


    +   - **Client-Server Architecture:** REST enforces a clear separation between
    the client (the consumer of the API) and the server (the provider of the API).
    This separation promotes independent evolution and scalability of both components.


    +   - **Statelessness:** Each request from the client to the server must contain
    all the information necessary to understand and process the request. The server
    doesn''t maintain any client context between requests, simplifying implementation
    and enabling horizontal scaling.


    +   - **Cacheability:** Responses from the server can be explicitly or implicitly
    labeled as cacheable or non-cacheable, allowing clients to store responses locally
    and reuse them for subsequent requests, improving performance and reducing network
    traffic.'
  merge: -1
  img_proc: true
- pgno: 85
  md: '+   - **Layered System:** REST allows for the layering of system components,
    where each layer interacts only with adjacent layers, promoting modularity and
    encapsulation.

    +   - **Uniform Interface:** REST defines a set of standard HTTP methods (GET,
    POST, PUT, PATCH, DELETE) to perform operations on resources, providing a consistent
    and predictable interface for clients.

    +   - **Code on Demand (Optional):** Servers can optionally extend the functionality
    of clients by transferring executable code, such as JavaScript, to be executed
    on the client-side.


    # REST in Practice: Key Design Considerations


    When designing RESTful APIs, adhering to these key considerations ensures clarity,
    consistency, and ease of use:


    +   - **Resource-Oriented:** Design your API around resources, which represent
    the key entities or data objects in your system. Use nouns to represent resources
    in your URLs (e.g., /products, /orders) and HTTP methods to perform actions on
    those resources.

    +   - **HTTP Verbs:** Leverage the standard HTTP verbs to represent the intended
    action on a resource:

    +       - **GET:** Retrieve a representation of a resource.

    +       - **POST:** Create a new resource.

    +       - **PUT:** Update or replace an existing resource.

    +       - **PATCH:** Partially modify an existing resource.

    +       - **DELETE:** Delete a resource.

    +   - **Status Codes:** Utilize appropriate HTTP status codes to indicate the
    outcome of a request:

    +       - **2xx (Success):** The request was successfully processed.

    +       - **4xx (Client Error):** The request contains errors or invalid data.

    +       - **5xx (Server Error):** An error occurred on the server while processing
    the request.'
  merge: -1
  img_proc: true
- pgno: 86
  md: "+   • Content Negotiation: Support multiple data formats, such as JSON or XML,\
    \ allowing clients to specify their preferred format in the Accept header of the\
    \ request.\n\n+   • HATEOAS (Hypermedia as the Engine of Application State): Include\
    \ hypermedia links in your responses to guide clients on how to interact with\
    \ your API, promoting discoverability and self-documentation.\n\n# Building RESTful\
    \ APIs with ASP.NET Core 3\n\nASP.NET Core 3 provides a robust framework for building\
    \ RESTful APIs. Let's see a simple example of an API controller:\n\n```\nC#\n\n\
