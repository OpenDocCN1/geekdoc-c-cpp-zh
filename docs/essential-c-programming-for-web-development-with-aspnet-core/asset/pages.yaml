  md: '# # Chapter 1: C# Basics


    # ## Variables, Data Types, and Operators


    In the realm of programming, variables are the fundamental containers that store
    data, allowing us to manipulate and work with information dynamically. Data types,
    on the other hand, define the kind of values a variable can hold, ensuring data
    integrity and efficient memory management. Operators, the final piece of this
    puzzle, empower us to perform operations on variables and values, opening the
    doors to calculations, comparisons, and transformations. In this chapter, we''ll
    embark on a journey through these core concepts, laying a solid foundation for
    your C# programming endeavors.


    # ## Variables: The Data Storehouses


    In essence, a variable is a named storage location in a computer''s memory. It''s
    like a labeled box where you can put different things, be it numbers, text, or
    more complex data structures. To create a variable in C#, you need to declare
    it, specifying its data type and assigning it a name. Here''s the general syntax:


    ```

    ```csharp

    data_type variable_name;

    ```

    ```


    For instance, let''s create a variable named age to store a person''s age:


    ```

    ```csharp

    int age;

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 9
  md: 'In this case, int is the data type, indicating that the variable age can hold
    integer values (whole numbers without decimals).


    # **Assigning Values to Variables**


    Once you''ve declared a variable, you can assign a value to it using the assignment
    operator (=):


    ```

    ```csharp

    age = 30;

    ```

    ```


    Now, the variable age holds the value 30. You can also declare and initialize
    a variable in a single line:


    ```

    ```csharp

    int age = 30;

    ```

    ```


    # **Variable Naming Conventions**


    In C#, variable names must adhere to certain conventions:


    +   - They must start with a letter or an underscore ( _ ).

    +   - They can contain letters, numbers, and underscores.

    +   - They are case-sensitive, meaning age and Age are considered different variables.

    +   - It''s recommended to use descriptive names that reflect the purpose of the
    variable, making your code more readable and maintainable.


    # **Data Types: Classifying the Data**'
  merge: -1
  img_proc: true
- pgno: 10
  md: 'Data types play a crucial role in programming by defining the kind of values
    a variable can store. C# offers a rich set of built-in data types, each designed
    for specific purposes. Let''s explore some of the most common ones:


    # 1. Numeric Data Types


    +   - int (Integer): Represents whole numbers without decimals (e.g., -2, 0, 100).

    +   - double (Double-precision floating-point number): Represents numbers with
    decimals (e.g., 3.14, -1.5).

    +   - float (Single-precision floating-point number): Similar to double, but with
    less precision.

    +   - decimal (Decimal floating-point number): Provides high precision for financial
    calculations.


    # 2. Textual Data Types


    +   - char (Character): Represents a single Unicode character (e.g., ''A'', ''!'',
    ''?'').

    +   - string (String): Represents a sequence of characters (e.g., "Hello, world!").


    # 3. Boolean Data Type


    +   - bool (Boolean): Represents a logical value, either true or false.


    # 4. Other Data Types


    +   - DateTime : Represents a specific date and time.

    +   - object : The base class for all other types in C#.


    # Choosing the Right Data Type


    Selecting the appropriate data type for your variables is crucial for efficient
    memory usage and preventing potential errors. Consider the nature of the data
    you''ll be working with and choose the most suitable type. For instance, if you''re
    storing a person''s age, int would be a logical choice. However, if'
  merge: -1
  img_proc: true
- pgno: 11
  md: 'you need to store their height with decimal precision, double or float would
    be more appropriate.


    # Operators: Performing Operations on Data


    Operators are symbols or keywords that perform operations on variables and values.
    C# provides a wide array of operators, categorized based on their functionality:


    # 1. Arithmetic Operators


    +   - + (Addition)

    +   - - (Subtraction)

    +   - * (Multiplication)

    +   - / (Division)

    +   - % (Modulo - returns the remainder of a division)


    # 2. Assignment Operators


    +   - = (Simple assignment)

    +   - += (Add and assign)

    +   - -= (Subtract and assign)

    +   - *= (Multiply and assign)

    +   - /= (Divide and assign)

    +   - %= (Modulo and assign)


    # 3. Comparison Operators


    +   - == (Equal to)

    +   - != (Not equal to)

    +   - > (Greater than)

    +   - < (Less than)

    +   - >= (Greater than or equal to)

    +   - <= (Less than or equal to)


    # 4. Logical Operators


    +   - && (Logical AND)

    +   - || (Logical OR)

    +   - ! (Logical NOT)'
  merge: -1
  img_proc: true
