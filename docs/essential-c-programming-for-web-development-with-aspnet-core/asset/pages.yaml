- pgno: 91
  md: 'An HTTP request is a message sent from a client, such as a web browser or another
    application, to a server, requesting a specific action or resource. It typically
    consists of the following components:


    +   - **Method:** The HTTP method (e.g., GET, POST, PUT, PATCH, DELETE) indicating
    the intended action on the resource.

    +   - **URI (Uniform Resource Identifier):** The address of the resource being
    requested, including the hostname, path, and any query parameters.

    +   - **Headers:** Metadata providing additional information about the request,
    such as the content type, authorization credentials, or client preferences.

    +   - **Body (Optional):** Data sent with the request, typically used for POST,
    PUT, and PATCH requests to create or modify resources.


    # Parsing Incoming Data


    ASP.NET Core 3 provides powerful model binding capabilities to automatically extract
    data from incoming requests and populate corresponding objects in your controller
    action methods. It supports binding data from various sources, including:


    +   - **Request Body:** For POST, PUT, and PATCH requests, data is typically sent
    in the request body, often in JSON or XML format. You can use the [FromBody] attribute
    to bind this data to a parameter in your action method.

    +   - **Query String:** Query parameters are appended to the URI after a question
    mark ( ? ) and are typically used for filtering, sorting, or pagination. You can
    access query parameters using the Request.Query property in your controller.

    +   - **Route Values:** Route values are extracted from the URI based on the defined
    routes. You can access route values using parameters in your action method signature.

    +   - **Headers:** You can access request headers using the Request.Headers property
    in your controller.


    # Generating HTTP Responses'
  merge: -1
  img_proc: true
- pgno: 92
  md: 'Once your controller action method has processed the request and interacted
    with the model, it needs to generate an appropriate HTTP response to send back
    to the client. ASP.NET Core 3 offers various ways to create responses:


    +   • **Action Results:** Action methods typically return action results, which
    represent the response to be sent to the client. Common action result types include
    Ok, NotFound, BadRequest, Created, and NoContent.


    +   • **Object Results:** You can also return objects directly from your action
    methods. The framework will automatically serialize the object into the appropriate
    format (e.g., JSON) based on content negotiation.


    +   • **Custom Responses:** For more fine-grained control, you can create custom
    responses using the Response object in your controller.


    # Content Negotiation


    Content negotiation is the process of determining the best representation of a
    resource to send to the client based on its preferences. Clients can specify their
    preferred media types (e.g., application/json, application/xml) in the Accept
    header of the request. ASP.NET Core 3 supports content negotiation out of the
    box, automatically selecting the appropriate formatter based on the client''s
    preferences.


    # Error Handling and Status Codes


    When errors or unexpected situations occur, it''s important to return appropriate
    HTTP status codes to communicate the outcome of the request to the client. Use
    4xx status codes for client errors (e.g., 400 Bad Request, 404 Not Found) and
    5xx status codes for server errors (e.g., 500 Internal Server Error). You can
    also include additional information in the response body, such as error messages
    or details, to aid in troubleshooting.


