  md: '# Chapter 2: Working with Data


    # Arrays, Lists, and Collections


    In the realm of programming, data rarely exists in isolation. More often than
    not, we need to work with collections of related information, such as a list of
    students, an array of product prices, or a dictionary of employee records. C#
    provides a rich set of tools for managing such collections, including arrays,
    lists, and other specialized collection types. In this section, we’ll delve into
    the world of data collections in C#, exploring their characteristics, strengths,
    and practical applications.


    # Arrays: Fixed-Size Data Structures


    An array is a fundamental data structure that stores a fixed-size, sequential
    collection of elements of the same type. It’s like a row of numbered boxes, where
    each box holds an item and can be accessed using its index (position).


    # Declaring and Initializing Arrays


    To declare an array in C#, you specify the element type, followed by square brackets
    and the array name:


    ```

    C#

    int[] numbers;

    ```


    This declares an array named `numbers` that can hold integer values. To initialize
    an array, you use the `new` keyword and specify the size within the square brackets:


    ```

    C#

    numbers = new int[5]; // Creates an array with 5 elements

    ```'
  merge: -1
  img_proc: true
- pgno: 30
  md: 'You can also declare and initialize an array in a single line, providing the
    initial values within curly braces:


    ```

    C#

    int[] numbers = { 10, 20, 30, 40, 50 };

    ```


    # Accessing Array Elements


    You can access individual elements of an array using their index, which starts
    at 0 for the first element:


    ```

    C#

    int firstNumber = numbers[0]; // Accesses the first element (10)

    int thirdNumber = numbers[2]; // Accesses the third element (30)

    ```


    # Array Properties and Methods


    Arrays in C# come with several useful properties and methods:


    +   - Length: Returns the number of elements in the array.

    +   - CopyTo(): Copies elements from one array to another.

    +   - Sort(): Sorts the elements of the array in ascending order.

    +   - Reverse(): Reverses the order of the elements in the array.


    # Lists: Dynamic Collections'
