  md: "# # Key Features of Razor Syntax\n\n+   - @ Symbol: The @ symbol is the gateway\
    \ to C# code within Razor views. It signals the start of a C# expression or code\
    \ block.\n+   - Code Blocks: You can enclose multiple lines of C# code within\
    \ { ... } curly braces.\n+   - Expressions: You can embed C# expressions directly\
    \ within your HTML markup using @(...) syntax. The expression's value will be\
    \ rendered in the output.\n+   - Variables and Data Access: You can access data\
    \ passed from the controller using the Model property or other variables defined\
    \ within the view.\n+   - Control Flow and Loops: Razor supports C# control flow\
    \ statements (e.g., if, else, switch, for, foreach) and loops, allowing you to\
    \ conditionally render content or iterate over collections.\n+   - Helpers and\
    \ Tag Helpers: Razor provides built-in HTML helpers and tag helpers that simplify\
    \ common tasks, such as generating form elements, links, and validation messages.\n\
    \n# ## Crafting Views with Razor\n\nLet's see a simple example of a Razor view\
    \ that displays a list of products:\n\nRazor CSHTML\n\n```\n@model IEnumerable<Product>\n\
    <h2>Products</h2>\n<ul>\n    @foreach (var product in Model)\n    {\n        <li>@product.Name\
    \ - $@product.Price</li>\n    }\n</ul>\n```"
