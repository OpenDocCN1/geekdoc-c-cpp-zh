    # Controllers: Handling Requests and Generating Responses


    Controllers are the heart of request handling in ASP.NET Core 3 MVC applications.
    They encapsulate the logic for processing incoming requests, interacting with
    the model, and generating appropriate responses. Each controller is a C# class
    that inherits from the Controller base class and contains action methods that
    respond to specific routes.


    # Action Methods


    Action methods are the public methods within a controller that handle incoming
    requests. They typically perform tasks such as:


    +   - Retrieving data from the model

    +   - Processing user input

    +   - Performing business logic

    +   - Selecting the appropriate view to render

    +   - Returning data or redirecting to other actions


    # Action Results


    Action methods return action results, which represent the response to be sent
    back to the client. Common action result types include:


    +   - ViewResult : Renders a view, typically an HTML template or Razor page.

    +   - JsonResult : Returns JSON-formatted data, often used for APIs.

    +   - ContentResult : Returns plain text content.

    +   - RedirectResult : Redirects the user to another action or URL.

    +   - FileResult : Returns a file for download.


