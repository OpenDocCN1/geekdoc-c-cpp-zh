    # Objects: Instances of Classes


    An object is a concrete instance of a class, representing a specific entity in
    your program. It''s like a particular car created from the Car blueprint, with
    its own unique set of values for the make, model, and year.


    To create an object in C#, you use the new keyword followed by the class name
    and any necessary arguments for the constructor:


    ```

    C#

    Car myCar = new Car("Toyota", "Camry", 2023);

    ```


    This line of code creates a new Car object named myCar with the specified make,
    model, and year.


    # Accessing Members of an Object


    Once you have an object, you can access its fields, properties, and methods using
    the dot ( . ) operator:


    ```

    C#

    Console.WriteLine(myCar.Make); // Output: Toyota

    myCar.StartEngine(); // Output: Engine started!

    ```


