  md: 'While arrays are useful for fixed-size collections, lists offer the flexibility
    of dynamic resizing. A list is a collection that can grow or shrink as needed,
    making it ideal for scenarios where the number of elements is not known in advance.


    # Creating and Working with Lists


    To work with lists, you need to include the System.Collections.Generic namespace:


    ```

    C#

    using System.Collections.Generic;

    ```


    You can then create a list by specifying the element type within angle brackets:


    ```

    C#

    List<string> names = new List<string>();

    ```


    To add elements to a list, you use the Add() method:


    ```

    C#

    names.Add("Alice");

    names.Add("Bob");

    names.Add("Charlie");

    ```'
