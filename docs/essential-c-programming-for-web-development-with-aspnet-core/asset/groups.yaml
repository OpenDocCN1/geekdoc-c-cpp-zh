    \ REST 的核心原则\n\n- **客户端-服务器架构：** REST 强制执行客户端（API 的消费者）和服务器（API 的提供者）之间的清晰分离。这种分离促进了两个组件的独立演进和可扩展性。\n\
    \n- **无状态性：** 客户端向服务器发送的每个请求都必须包含理解和处理请求所需的所有信息。服务器在请求之间不维护任何客户端上下文，从而简化了实现并实现了水平扩展。\n\
    \n- **可缓存性：** 服务器的响应可以显式或隐式地标记为可缓存或不可缓存，允许客户端在本地存储响应并重复用于后续请求，从而提高性能并减少网络流量。\n\
    \n- **分层系统：** REST 允许系统组件的分层，每一层仅与相邻层交互，从而促进模块化和封装。\n- **统一接口：** REST 定义了一组标准\
    \ HTTP 方法（GET、POST、PUT、PATCH、DELETE）来对资源执行操作，为客户端提供一致且可预测的接口。\n- **按需代码（可选）：**\
    \ 服务器可以选择通过传输可执行代码（例如 JavaScript）来扩展客户端的功能，以在客户端上执行。\n\n### REST 实践中的关键设计注意事项\n\
    \n在设计 RESTful API 时，遵循这些关键注意事项可确保清晰度、一致性和易用性：\n\n- **面向资源：** 围绕资源设计您的 API，资源代表系统中的关键实体或数据对象。在\
    \ URL 中使用名词来表示资源（例如，/products、/orders），并使用 HTTP 方法对这些资源执行操作。\n- **HTTP 动词：** 利用标准\
    \ HTTP 动词来表示对资源的预期操作：\n  - **GET：** 检索资源的表示。\n  - **POST：** 创建新资源。\n  - **PUT：**\
    \ 更新或替换现有资源。\n  - **PATCH：** 部分修改现有资源。\n  - **DELETE：** 删除资源。\n- **状态码：** 利用适当的\
    \ HTTP 状态码来指示请求的结果：\n  - **2xx（成功）：** 请求已成功处理。\n  - **4xx（客户端错误）：** 请求包含错误或无效数据。\n\
