    [Route(\"api/[controller]\")]\npublic class ProductsController : ControllerBase\n\
    {\n    [HttpGet]\n    public IEnumerable<Product> Get()\n    {\n        // ...\
    \ retrieve all products\n    }\n\n    [HttpGet(\"{id}\")]\n    public IActionResult\
    \ Get(int id)\n    {\n        // ... retrieve product by id\n    }\n\n    [HttpPost]\n\
    \    public IActionResult Post([FromBody] Product product)\n    {\n        //\
    \ ... create a new product\n    }\n\n    // ... other actions (Put, Patch, Delete)\n\
    }\n```\n\n此控制器定义了用于检索所有产品（GET /api/products）、按 ID 检索特定产品（GET /api/products/{id}）以及创建新产品（POST\
    \ /api/products）的端点。[ApiController] 特性启用了特定于 API 控制器的功能，例如自动模型验证和绑定源推断。\n\n在本节中，我们探讨了\
    \ RESTful API 设计的基本原则及其在 ASP.NET Core 3 中的实际实现。我们见证了 REST 如何利用 HTTP 的强大功能为 Web\
    \ 服务创建标准化且直观的接口，从而促进简单性、可扩展性和可维护性。掌握这些知识后，您现在已具备设计和构建强大且结构良好的 API 的能力，这些 API 可以与其他系统和服务无缝集成，扩展应用程序的覆盖范围和功能。\n\
    \n### 创建 API 控制器\n\n在 Web API 的世界中，控制器充当客户端请求与应用程序底层逻辑之间的中介。它们负责接收传入请求、处理数据、与模型交互以及生成适当的响应。ASP.NET\
    \ Core 3 提供了专用的 ApiController 特性和一组约定，简化了构建 RESTful API 控制器的过程，使其更加简洁、高效，并专注于数据交换。在本节中，我们将深入探讨在\
    \ ASP.NET Core 3 中创建 API 控制器的复杂性，探索其结构、操作方法、特性路由以及构建设计良好且易于维护的 API 的最佳实践。\n\n\
    ### ApiController 特性\n\n[ApiController] 特性是 ASP.NET Core 3 中 API 控制器的关键区别因素。当应用于控制器类时，它会启用几项专门针对\
