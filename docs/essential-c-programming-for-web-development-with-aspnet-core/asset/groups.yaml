    \ `SaveChanges()` 将更改保存到数据库。\n\n### 删除：移除记录\n\n`Delete` 操作涉及从数据库移除记录。在 EF Core\
    \ 中，您通常检索要删除的实体，然后在相应的 `DbSet` 上调用 `Remove()` 方法，随后调用 `SaveChanges()` 以持久化删除。\n\
    \n让我们删除特定产品：\n\n```csharp\nusing (var context = new ApplicationDbContext())\n\
    {\n    var productToDelete = context.Products.Find(1); // Retrieve product with\
    \ Id = 1\n    if (productToDelete != null)\n    {\n        context.Products.Remove(productToDelete);\n\
    \        context.SaveChanges();\n    }\n}\n```\n\n在这段代码中，我们检索 ID 为 1 的产品，如果找到，则将其从\
    \ Products DbSet 中移除并调用 SaveChanges() 将其从数据库中删除。\n\n### CRUD 操作的最佳实践\n\n- **验证用户输入：**\
    \ 在执行 CRUD 操作之前，始终验证用户输入，以确保数据完整性并防止潜在的安全漏洞。\n- **处理并发：** 实施适当的并发管理策略，以避免当多个用户或进程同时尝试修改相同数据时发生冲突。\n\
    - **使用事务：** 对于涉及多个数据库更改的操作，考虑使用事务以确保数据一致性和原子性。\n- **优化查询：** 编写高效的查询，仅检索必要数据，并利用索引提高性能。\n\
    - **优雅地处理异常：** 预见并处理潜在的数据库异常，向用户提供信息丰富的反馈。\n\n在本节中，我们探索了 Entity Framework Core\
    \ 中的基本 CRUD 操作（创建、读取、更新、删除）。我们学习了如何在 ASP.NET Core 3 应用程序中无缝执行这些操作，确保数据完整性、安全性和流畅的用户体验。掌握这些知识后，您现在已具备能力，能够构建动态且数据驱动的\
    \ Web 应用程序，使用户能够与数据库中存储的信息进行交互和管理。\n\n## 数据验证与安全\n\n在 Web 应用程序领域，数据验证和安全性至关重要。用户输入虽然对交互至关重要，但如果不小心处理，也可能成为漏洞的来源。恶意行为者可以利用验证不当的输入来注入有害代码、泄露敏感数据或干扰应用程序的运行。在本节中，我们将深入探讨\
    \ ASP.NET Core 3 和 Entity Framework Core 中数据验证和安全性的关键方面，为您提供知识和工具，以构建强大且有弹性的应用程序，防范潜在威胁。\n\
    \n### 数据验证：确保数据完整性\n\n数据验证是确保用户输入符合预期格式、范围或其他约束的过程。它充当第一道防线，防止无效或恶意数据进入您的系统。ASP.NET\
    \ Core 3 提供了一套全面的工具和技术，用于在客户端和服务器端实现数据验证。\n\n### 客户端验证\n\n客户端验证利用 HTML5 属性和 JavaScript\
    \ 在用户与表单交互时提供即时反馈。它有助于尽早捕获错误，改善用户体验并减少与服务器的往返次数。\n\n- **HTML5 属性：** HTML5 引入了几个内置验证属性，例如\
    \ `required`、`minlength`、`maxlength`、`pattern` 和 `type`，这些属性可直接在 HTML 标记中启用基本验证。\n\
    - **JavaScript 验证库：** 对于更复杂的验证场景，您可以使用 JavaScript 验证库，例如 jQuery Validate 或 Validate.js，来执行自定义验证逻辑并提供丰富的错误消息。\n\
    \n### 服务器端验证\n\n虽然客户端验证对用户体验很有价值，但务必始终执行服务器端验证。恶意用户可以绕过客户端检查，因此服务器端验证是应用程序的最终保障。\n\
    \n- **模型验证：** ASP.NET Core 3 与 MVC 无缝集成模型验证，允许您使用模型属性上的数据注解属性定义验证规则。这些属性（例如 Required、StringLength、Range\
    \ 和 RegularExpression）在将数据提交到控制器时会自动触发验证检查。\n- **自定义验证：** 对于更复杂的验证场景，您可以创建自定义验证属性，或直接在控制器操作方法中实现验证逻辑。\n\
    \n### 安全最佳实践\n\n除了数据验证之外，遵循安全最佳实践对于保护您的应用程序及其用户至关重要。让我们强调几个关键原则：\n\n- **输入清理：**\
    \ 始终清理用户输入，以防止跨站脚本（XSS）攻击，其中恶意脚本被注入到您的应用程序中。在将其呈现到输出之前，对潜在有害字符（例如 <、> 和 &）进行编码或转义。\n\
    - **参数化查询：** 在与数据库交互时，使用参数化查询或存储过程，以防止 SQL 注入攻击，其中恶意 SQL 代码被注入到您的查询中。\n\n"
