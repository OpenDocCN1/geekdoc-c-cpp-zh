    \n## switch：处理多个情况\n\n`switch` 语句提供了一种基于表达式值处理多个情况的简洁方法。当你有一系列离散值需要比较时，它特别有用。让我们看看它的实际应用：\n\
    \n```csharp\nint dayOfWeek = 3; // Assuming 1 represents Monday, 2 represents\
