    - **授权操作和视图：** 使用 [Authorize] 特性根据角色或个人权限限制对特定控制器操作或 Razor 页面的访问。\n\n```C#\n\n\
    [Authorize(Roles = \"Admin\")]\npublic IActionResult AdminDashboard()\n{\n   \
    \ // ...\n}\n```\n\n此操作方法仅可供属于“Admin”角色的用户访问。\n\n- **以编程方式检查权限：** 在需要更精细控制的场景中，您可以使用\
    \ IAuthorizationService 以编程方式检查用户是否具有特定权限，然后再允许其执行操作。\n\n```C#\n\n[HttpPost]\n\
    public async Task<IActionResult> EditProduct(int id, Product product)\n{\n   \
    \ var authorizationResult = await _authorizationService.AuthorizeAsync(User,\n\
    \    \"EditProductPolicy\");\n    if (authorizationResult.Succeeded)\n    {\n\
    \        // ... update the product\n    }\n    else\n    {\n        return Forbid();\
    \ // Or handle unauthorized access in another way\n    }\n}\n```\n\n在此示例中，我们使用\
    \ IAuthorizationService 检查当前用户是否根据自定义“EditProductPolicy”获得编辑产品的授权。\n\n## RBAC\
    \ 的最佳实践\n\n- **最小权限原则：** 仅授予用户执行其任务所需的最小必要权限，以降低意外或恶意操作的风险。\n- **角色层次结构：** 考虑实现角色层次结构，其中高级角色继承低级角色的权限，从而简化权限管理并促进一致性。\n\
    - **动态授权：** 在需要根据复杂业务规则或上下文信息在运行时评估权限的场景中，考虑使用基于策略的授权以获得更大的灵活性。\n- **定期审查：** 定期审查和更新您的\
    \ RBAC 配置，以确保其与应用程序不断发展的安全要求和用户角色保持一致。\n\n在本节中，我们探讨了 ASP.NET Core 3 中基于角色的访问控制\
    \ (RBAC) 的原则和实现。我们学习了如何定义角色、将其分配给用户，并根据这些角色授权访问特定操作或视图。通过遵循最佳实践并利用 ASP.NET Core\
    \ Identity 的内置功能，您可以创建一个安全且井然有序的权限系统，保护应用程序的数据和功能，同时提供无缝且用户友好的体验。\n\n## 实现社交登录（例如\
    \ Google、Facebook）\n\n在 Web 应用程序快节奏的世界中，用户体验至高无上。简化注册和登录流程是减少摩擦并鼓励用户参与的关键。社交登录允许用户使用\
    \ Google 或 Facebook 等热门提供商的现有帐户进行身份验证，为传统的用户名/密码身份验证提供了一种方便且无摩擦的替代方案。在本节中，我们将探讨在\
    \ ASP.NET Core 3 中实现社交登录的复杂性，指导您完成必要的步骤、配置和最佳实践，以将这些功能无缝集成到您的应用程序中，为用户提供愉快且安全的身份验证体验。\n\
    \n## 社交登录的优势\n\n社交登录提供了许多有助于积极用户体验的优势：\n\n- **减少摩擦：** 用户可以跳过创建和记住新凭据的繁琐过程，从而提高注册和登录率。\n\
    - **提升用户信任：** 利用 Google 或 Facebook 等成熟平台可以增强用户对您的应用程序的信任，因为用户已经熟悉这些提供商及其安全措施。\n\
    - **增强用户体验：** 社交登录为用户访问您的应用程序提供了一种快速且方便的方式，降低了进入门槛并鼓励参与。\n- **访问用户数据（可选）：** 在获得用户同意的情况下，您可以获取宝贵的用户数据，例如他们的姓名、电子邮件地址和个人资料图片，从而丰富应用程序的功能和个性化。\n\
    \n## 前提条件\n\n在深入实施细节之前，请确保已具备以下前提条件：\n\n- **ASP.NET Core Identity：** 您的项目应配置为使用\
    \ ASP.NET Core Identity，它为身份验证和用户管理提供了基础。\n- **外部登录提供商帐户：** 您需要为打算集成的社交登录提供商（例如\
    \ Google 或 Facebook）创建开发者帐户。这些帐户将为您提供所需的客户端 ID、密钥和配置设置。\n\n## 将社交登录与 ASP.NET Core\
    \ 3 集成\n\nASP.NET Core 3 通过中间件和配置的组合简化了社交登录的集成。让我们概述一下涉及的一般步骤：\n\n- **安装 NuGet\
    \ 包：** 安装您想要支持的特定社交登录提供商的 NuGet 包。例如，要集成 Google 身份验证，您将安装 Microsoft.AspNetCore.Authentication.Google\
    \ 包。\n- **配置身份验证中间件：** 在 Startup.cs 文件中，配置身份验证中间件以包含所需的社交登录提供商。\n\n```C#\nservices.AddAuthentication()\n\
    \    .AddGoogle(options =>\n    {\n        options.ClientId = Configuration[\"\
    Authentication:Google:ClientId\"];\n        options.ClientSecret =\n        Configuration[\"\
    Authentication:Google:ClientSecret\"];\n    })\n    .AddFacebook(options =>\n\
    \    {\n        options.AppId = Configuration[\"Authentication:Facebook:AppId\"\
    ];\n        options.AppSecret =\n        Configuration[\"Authentication:Facebook:AppSecret\"\
    ];\n    });\n```\n\n此代码片段配置 Google 和 Facebook 身份验证，从应用程序的配置中检索所需的客户端 ID 和密钥。\n\
    \n- **添加登录按钮：** 在 Razor 视图中，为您支持的每个社交登录提供商添加登录按钮或链接。\n\n```Razor CSHTML\n\n<a\
    \ asp-action=\"ExternalLogin\" asp-route-provider=\"Google\">Login with Google</a>\n\
    <a asp-action=\"ExternalLogin\" asp-route-provider=\"Facebook\">Login with Facebook</a>\n\
    ```\n\n这些链接会触发控制器中的 ExternalLogin 操作方法，并将提供商名称作为路由参数传递。\n\n- **处理外部登录回调：** 在控制器中实现\
    \ ExternalLogin 操作方法，以启动与所选提供商的身份验证流程。\n\n```C#\n\n[HttpPost]\n[AllowAnonymous]\n\
    public IActionResult ExternalLogin(string provider, string returnUrl = null)\n\
    {\n    var redirectUrl = Url.Action(\"ExternalLoginCallback\", \"Account\", new\n\
    \    {\n        ReturnUrl = returnUrl\n    });\n    var\n    properties =\n  \
    \  _signInManager.ConfigureExternalAuthenticationProperties(provider,\n    redirectUrl);\n\
    \    return new ChallengeResult(provider, properties);\n}\n```\n\n"
