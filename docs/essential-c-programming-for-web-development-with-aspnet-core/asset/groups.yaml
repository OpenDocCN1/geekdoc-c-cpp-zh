    # Arrays: Fixed-Size Data Structures


    An array is a fundamental data structure that stores a fixed-size, sequential
    collection of elements of the same type. It’s like a row of numbered boxes, where
    each box holds an item and can be accessed using its index (position).


    # Declaring and Initializing Arrays


    To declare an array in C#, you specify the element type, followed by square brackets
    and the array name:


    ```

    C#

    int[] numbers;

    ```


