    \ Accept 标头中指定其首选格式。\n\n- **HATEOAS（作为应用状态引擎的超媒体）：** 在响应中包含超媒体链接，以指导客户端如何与您的 API\
    \ 交互，从而促进可发现性和自文档化。\n\n### 使用 ASP.NET Core 3 构建 RESTful API\n\nASP.NET Core 3\
