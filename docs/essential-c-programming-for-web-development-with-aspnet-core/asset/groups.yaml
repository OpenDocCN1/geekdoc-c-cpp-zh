    \   Console.WriteLine(\"Invalid day of the week.\");\n        break;\n}\n```\n\
    \n在此示例中，switch 语句计算 dayOfWeek 的值并执行相应的 case 块。`break` 语句至关重要，可防止贯穿，确保仅执行预期的代码块。`default`\
    \ case 充当任何不匹配指定 case 的值的捕获项。\n\n## 循环：重复执行操作\n\n循环对于在编程中执行重复任务不可或缺。C# 提供了几种类型的循环，每种都适用于不同的场景：\n\
    \n### 1. for 循环\n\nfor 循环在预先知道迭代次数时非常理想。它由三部分组成：初始化、条件和迭代。\n\n```csharp\nfor (int\
    \ i = 0; i < 5; i++)\n{\n    Console.WriteLine(\"Iteration: \" + i);\n}\n```\n\
    \n此循环将执行五次，在每个周期中打印迭代编号。\n\n### 2. while 循环\n\nwhile 循环会在指定条件保持为真时继续执行。\n\n```csharp\n\
    int count = 0;\nwhile (count < 10)\n{\n    Console.WriteLine(\"Count: \" + count);\n\
    \    count++;\n}\n```\n\n此循环将递增 count 变量并打印其值，直到其达到 10。\n\n"
