  mdcn: "\nappsettings.json、环境变量或命令行参数。\n\n- 日志记录：ASP.NET Core 3 提供了内置的日志记录框架，使你能够捕获并存储关于应用程序执行的诊断信息。\n\
    \n## 浏览项目结构\n\n了解项目结构及其关键组件，能让你高效地定位和修改文件、添加新功能，并有效地排查问题。这对于理解应用程序内部的数据和控制流也至关重要，使你能够设计和实现既可维护又可扩展的解决方案。\n\
    \n在本节中，我们对 ASP.NET Core 3 项目结构进行了导览，探索了其根目录、关键文件夹和基本组件。我们深入了解了控制器、模型和视图的组织方式，以及中间件、依赖注入、配置和日志记录的作用。掌握这些知识后，你现在可以自信地浏览\
    \ ASP.NET Core 3 项目，为构建健壮且结构良好的 Web 应用程序奠定坚实基础。\n\n## 路由和控制器\n\n在动态的 Web 应用程序世界中，路由和控制器在处理传入请求并将其导向适当的操作方法进行处理方面发挥着关键作用。它们构成了请求-响应周期的支柱，确保用户交互能够无缝转化为应用程序中的有意义操作。在本节中，我们将深入探讨\
    \ ASP.NET Core 3 中路由和控制器的复杂性，探讨其机制、配置以及在塑造 Web 应用程序流程方面的实际应用。\n\n## 路由：将请求映射到操作\n\
    \n路由是根据预定义模式将传入的 HTTP 请求与特定控制器操作方法进行匹配的过程。它充当交通指挥员，引导请求到达应用程序中的预定目标。ASP.NET Core\
    \ 3 提供了一个灵活且强大的路由系统，允许你使用约定、特性或两者的组合来定义路由。\n\n## 基于约定的路由\n\n基于约定的路由依赖于预定义模式来将请求映射到控制器和操作。默认约定是根据控制器名称将请求映射到控制器（例如，/Home\
    \ 映射到 HomeController），并根据 HTTP 动词和操作名称将请求映射到操作（例如，对 /Home/Index 的 GET 请求映射到 HomeController\
    \ 中的 Index 操作方法）。\n\n## 基于特性的路由\n\n基于特性的路由允许你使用控制器操作方法上的特性显式定义路由。这提供了更大的控制力和灵活性，特别是在默认约定不足的场景中。\n\
    \n```csharp\n[Route(\"api/[controller]\")]\npublic class ProductsController :\
    \ Controller\n{\n    [HttpGet(\"{id}\")]\n    public IActionResult GetProduct(int\
    \ id)\n    {\n        // ... retrieve product by id\n    }\n}\n```\n\n在此示例中，控制器上的\
    \ Route 特性指定了控制器内所有操作的基础路由。GetProduct 操作方法上的 HttpGet 特性定义了用于处理带有 id 参数的 GET 请求的路由。\n\
    \n## 控制器：处理请求和生成响应\n\n控制器是 ASP.NET Core 3 MVC 应用程序中请求处理的核心。它们封装了处理传入请求、与模型交互以及生成适当响应的逻辑。每个控制器都是一个继承自\
    \ Controller 基类的 C# 类，包含响应特定路由的操作方法。\n\n## 操作方法\n\n操作方法是控制器中处理传入请求的公共方法。它们通常执行诸如以下任务：\n\
    \n- 从模型检索数据\n- 处理用户输入\n- 执行业务逻辑\n- 选择要呈现的适当视图\n- 返回数据或重定向到其他操作\n\n## 操作结果\n\n\
    操作方法返回操作结果，表示要发送回客户端的响应。常见的操作结果类型包括：\n\n- ViewResult：呈现视图，通常是 HTML 模板或 Razor 页面。\n\
    - JsonResult：返回 JSON 格式的数据，通常用于 API。\n- ContentResult：返回纯文本内容。\n- RedirectResult：将用户重定向到另一个操作或\
    \ URL。\n- FileResult：返回供下载的文件。\n\n## 再探请求-响应周期\n\n让我们在路由和控制器的背景下重新探讨请求-响应周期：\n\
    \n- 1. 用户向应用程序发送请求。\n- 2. 路由系统根据定义的路由将请求与控制器和操作方法匹配。\n- 3. 控制器中相应的操作方法被执行。\n-\
    \ 4. 操作方法（如有必要）与模型交互以检索或修改数据。\n- 5. 操作方法返回操作结果。\n- 6. 操作结果被处理，相应的响应被发送回用户。\n\n\
    在本节中，我们探讨了路由和控制器在 ASP.NET Core 3 MVC 应用程序中发挥的关键作用。我们了解了路由如何将传入请求映射到特定操作方法，以及控制器如何处理这些请求、与模型交互并生成适当响应。通过理解这些机制，你现在已具备设计和实现\
    \ Web 应用程序核心逻辑的能力，确保用户交互能够无缝转化为有意义的操作，并且数据以清晰、有条理的方式呈现。\n\n## 视图和 Razor 语法\n\n\
    在 Web 开发领域，视图在以视觉吸引人且交互式的方式向用户呈现数据方面发挥着关键作用。它们充当底层数据与用户浏览器之间的桥梁，根据从控制器接收到的信息动态呈现内容。ASP.NET\
    \ Core 3 采用 Razor 语法，这是一种强大而优雅的模板语言，用于创建将 HTML 标记与 C# 代码无缝融合的动态视图。在本节中，我们将深入探讨视图和\
    \ Razor 语法的世界，探讨其核心概念、特性以及在为 Web 应用程序打造引人入胜的用户界面方面的实际应用。\n\n## Razor：模板强力引擎\n\n\
    Razor 是一种标记语法，允许你在 HTML 标记中嵌入服务器端 C# 代码，从而实现动态内容生成并与应用程序的数据无缝交互。它提供了一种简洁直观的方式来表达视图的呈现逻辑，使其更易于维护和适应。\n\
    \n## Razor 语法的关键特性\n\n- @ 符号：@ 符号是 Razor 视图中 C# 代码的入口。它标志着 C# 表达式或代码块的开始。\n- 代码块：你可以将多行\
    \ C# 代码包含在 { ... } 花括号中。\n- 表达式：你可以使用 @(...) 语法将 C# 表达式直接嵌入 HTML 标记中。表达式的值将在输出中呈现。\n\
    - 变量和数据访问：你可以使用 Model 属性或视图中定义的其他变量来访问从控制器传递的数据。\n- 控制流和循环：Razor 支持 C# 控制流语句（例如，if、else、switch、for、foreach）和循环，允许你有条件地呈现内容或遍历集合。\n\
    - 辅助程序和标记辅助程序：Razor 提供内置的 HTML 辅助程序和标记辅助程序，简化常见任务，例如生成表单元素、链接和验证消息。\n\n## 使用 Razor\
    \ 制作视图\n\n让我们看一个显示产品列表的简单 Razor 视图示例：\n\nRazor CSHTML\n\n```razor\n@model IEnumerable<Product>\n\
    <h2>Products</h2>\n<ul>\n    @foreach (var product in Model)\n    {\n        <li>@product.Name\
    \ - @product.Price</li>\n    }\n</ul>\n```\n\n在此视图中，`@model` 指令指定了从控制器期望的数据类型（一个\
    \ `IEnumerable<Product>` 集合）。`foreach` 循环遍历 `Model` 中的产品，对于每个产品，它呈现一个显示产品名称和价格的列表项。\n\
    \n## 布局页面和分部视图\n\nRazor 还支持布局页面和分部视图，促进代码重用和模块化：\n\n- **布局页面：** 布局页面为多个视图提供通用结构和共享元素，例如页眉、页脚和导航菜单。\n\
    - **分部视图：** 分部视图封装可在多个视图中包含的可重用标记部分，减少冗余并提高可维护性。\n\n## 视图组件\n\n视图组件是可从视图或布局页面调用的自包含\
    \ Razor 标记和代码单元。它们对于封装复杂的 UI 元素或呈现需要超出标准视图中现成逻辑的额外逻辑的动态内容非常有用。\n\n在本节中，我们探索了 ASP.NET\
    \ Core 3 中视图和 Razor 语法的世界。我们了解了 Razor 如何通过无缝融合 HTML 标记与 C# 代码，使我们能够创建动态且交互式的用户界面。我们还涉及了布局页面、分部视图和视图组件，了解了它们如何在我们的视图中促进代码重用和模块化。掌握这些知识后，你现在已具备打造引人入胜且用户友好的界面的能力，使你的\
    \ Web 应用程序栩栩如生。在下一节中，我们将把重点转移到使用 ASP.NET Core 3 构建第一个 Web 应用程序的实际方面，指导你\n"
