  mdcn: "\n\n继承是面向对象编程（OOP）中的一种强大机制，它允许你基于现有类（基类或超类）创建新类（派生类或子类）。派生类继承基类的所有成员（字段、属性和方法），促进代码复用，并建立类之间的层次关系。\n\
    \n让我们扩展我们的 `Car` 示例：\n\n```csharp\nclass ElectricCar : Car\n{\n    public int\
