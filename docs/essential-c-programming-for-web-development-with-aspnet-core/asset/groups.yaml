    \ Web 应用程序安全性和完整性的技术和最佳实践。\n\n## HTML 表单：用户输入的入口\n\nHTML 表单为用户与 Web 应用程序交互提供了主要机制。它们允许用户通过各种输入元素（如文本字段、复选框、单选按钮和提交按钮）输入数据、进行选择和触发操作。\n\
    \n让我们在 Razor 视图中创建一个简单的表单：\n\n```\nRazor CSHTML\n\n@model MyViewModel\n\n<form\
    \ asp-controller=\"Home\" asp-action=\"Submit\" method=\"post\">\n<div>\n<label\
    \ asp-for=\"Name\"></label>\n<input asp-for=\"Name\" />\n<span asp-validation-for=\"\
    Name\"></span>\n</div>\n<div>\n<label asp-for=\"Email\"></label>\n<input asp-for=\"\
    Email\" />\n<span asp-validation-for=\"Email\"></span>\n</div>\n<button type=\"\
    submit\">Submit</button>\n</form>\n```\n\n此表单捕获用户的姓名和电子邮件地址，并使用 HTTP POST 请求将数据提交到\
    \ HomeController 中的 Submit 操作方法。asp-* 标签辅助程序简化了将表单元素绑定到模型属性和生成验证消息的过程。\n\n## 模型绑定：连接表单到控制器\n\
    \n模型绑定是将传入请求中的数据映射到控制器操作方法中的参数或属性的过程。ASP.NET Core 3 提供了强大的模型绑定功能，可自动从表单字段、查询字符串和路由参数中提取数据，并填充控制器中的相应对象。\n\
    \n让我们看看如何在 HomeController 中处理表单提交：\n\n```\nC#\npublic IActionResult Submit(MyViewModel\
    \ model)\n{\nif (ModelState.IsValid)\n{\n// Process the submitted data\n// ...\n\
    return RedirectToAction(\"Success\");\n}\nreturn View(model); // Redisplay the\
    \ form with validation errors\n}\n```\n\nSubmit 操作方法接收一个 MyViewModel 对象，该对象会自动使用表单字段中的数据填充。ModelState.IsValid\
    \ 属性检查提交的数据是否符合模型中定义的任何验证规则。如果数据有效，你可以继续处理它；否则，可以重新显示带有验证错误的表单。\n\n## 数据验证：确保数据完整性\n\
    \n数据验证对于维护应用程序的完整性和安全性至关重要。它涉及检查用户输入，以确保其符合预期的格式、范围或其他约束。ASP.NET Core 3 提供了内置的数据验证支持，使用模型属性上的数据注释特性。\n\
    \n让我们向 MyViewModel 类添加一些验证特性：\n\n```\nC#\npublic class MyViewModel\n{\n[Required]\n\
    public string Name { get; set; }\n[Required]\n[EmailAddress]\npublic string Email\
    \ { get; set; }\n}\n```\n\nRequired 特性确保 Name 和 Email 字段不为空，而 EmailAddress 特性验证电子邮件地址的格式。\n\
    \n## 安全注意事项\n\n处理用户输入时，必须将安全性放在首位，以保护应用程序免受潜在漏洞（例如跨站点脚本 (XSS) 和 SQL 注入攻击）的影响。在处理或存储用户输入之前，始终对其进行清理和验证。\n\
    \n在本节中，我们探讨了在 ASP.NET Core 3 中处理用户输入和表单提交的技术和最佳实践。我们学习了如何创建 HTML 表单、利用模型绑定将表单连接到控制器，以及实施数据验证以确保数据完整性。我们还涉及了安全注意事项，强调了清理和验证用户输入的重要性。掌握这些知识后，你现在已具备构建交互式\
    \ Web 应用程序的能力，能够有效地捕获和处理用户数据，同时保持系统的安全性和可靠性。\n\n## 显示数据库中的数据\n\n在 Web 应用程序领域，数据是推动动态和个性化体验的生命线。从数据库中检索信息并以有意义且视觉吸引人的方式呈现给用户，是\
    \ Web 开发的基石。在本节中，我们将探讨将数据库交互无缝集成到 ASP.NET Core 3 应用程序中的技术和最佳实践，使你能够清晰高效地从数据存储向用户显示数据。\n\
    \n## Entity Framework Core：你的数据访问网关\n\n如前几章所探讨的，Entity Framework Core (EF Core)\
    \ 是应用程序与底层数据库之间的桥梁。它提供了一个强大且直观的对象关系映射 (ORM) 框架，允许你将数据作为对象和类来处理，从而抽象掉原始 SQL 查询的复杂性。\n\
    \n## 使用 EF Core 检索数据\n\n让我们说明如何在 ASP.NET Core 3 控制器中使用 EF Core 从数据库检索数据：\n\n```\n\
    C#\nusing Microsoft.AspNetCore.Mvc;\nusing Microsoft.EntityFrameworkCore; // Import\
    \ EF Core namespace\nusing MyFirstWebApplication.Data; // Import your DbContext\
    \ class\n\nnamespace MyFirstWebApplication.Controllers\n{\n    public class ProductsController\
    \ : Controller\n    {\n        private readonly ApplicationDbContext _context;\
    \ // Inject the DbContext\n\n        public ProductsController(ApplicationDbContext\
    \ context)\n        {\n            _context = context;\n        }\n\n        public\
    \ IActionResult Index()\n        {\n            var products = _context.Products.ToList();\
    \ // Retrieve all products\n            return View(products); // Pass the products\
    \ to the view\n        }\n    }\n}\n```\n\n在此示例中，我们使用依赖注入将 ApplicationDbContext\
    \ 注入到 ProductsController 中。然后，Index 操作方法使用 _context.Products.ToList() 从数据库中检索所有产品，并将它们传递给视图进行呈现。\n\
    \n从数据库检索数据后，你可以在视图中使用 Razor 语法动态将其呈现给用户。让我们创建一个视图来显示产品列表：\n\n```\nRazor CSHTML\n\
    @model IEnumerable<Product>\n<h2>Products</h2>\n<ul>\n@foreach (var product in\
    \ Model)\n{\n<li>@product.Name - $@product.Price</li>\n}\n</ul>\n```\n\n此视图遍历\
    \ Model（控制器传递的产品集合），并在列表项中呈现每个产品的名称和价格。\n\n## 筛选和排序数据\n\nEF Core 和 LINQ 在将数据传递给视图之前，提供了强大的筛选和排序功能。让我们修改\
    \ Index 操作方法，以仅检索价格大于 $50 的产品，并按名称升序排序：\n\n```\nC#\npublic IActionResult Index()\n\
    {\n    var products = _context.Products\n        .Where(p => p.Price > 50)\n \
    \       .OrderBy(p => p.Name)\n        .ToList();\n\n    return View(products);\n\
    }\n```\n\n## 分页和数据分页\n\n处理大型数据集时，实现分页或数据分页以分块显示数据至关重要，这可以提高性能和用户体验。EF Core 提供了使用\
    \ Skip() 和 Take() 方法的内置分页支持。\n\n## 数据安全和隐私\n\n显示数据库中的数据时，必须考虑安全和隐私影响。避免暴露敏感信息，例如密码或个人身份信息\
    \ (PII)，并实施适当的访问控制，以根据用户角色或权限限制数据可见性。\n\n在本节中，我们探讨了在 ASP.NET Core 3 应用程序中显示数据库数据的技术和最佳实践。我们利用\
    \ Entity Framework Core 的强大功能检索数据，使用 Razor 语法在视图中动态呈现数据，并实施了筛选、排序和分页以增强用户体验。我们还涉及了数据安全和隐私的重要性，强调了保护敏感信息的必要性。掌握这些知识后，你现在已具备构建数据驱动型\
    \ Web 应用程序的能力，能够实现无缝交互。\n"
