    \n### 操作方法和特性路由\n\nAPI 控制器中的操作方法负责处理特定的 HTTP 请求并生成相应的响应。它们通常使用特性路由特性进行装饰，以定义其路由和所处理的\
    \ HTTP 方法。\n\n让我们看看带有操作方法的 API 控制器示例：\n\n```csharp\n[ApiController]\n[Route(\"\
