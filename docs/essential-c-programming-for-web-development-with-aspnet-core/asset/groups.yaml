    ## 选择合适的托管选项


    您的 ASP.NET Core 3 应用程序的理想托管选项取决于多种因素，包括：


    - 预算：考虑每个托管选项相关的前期和持续成本。


    - 可扩展性要求：评估应用程序的预期流量模式，并选择可以相应扩展的托管环境。


    - 控制和定制：确定您对托管环境所需的控制和定制级别。


    - **安全性和合规性：** 评估应用程序的安全性和合规性要求，并选择满足这些需求的托管选项。


