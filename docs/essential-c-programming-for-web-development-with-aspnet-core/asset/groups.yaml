  mdcn: "\n\n### 3. do-while 循环\n\ndo-while 循环与 while 循环类似，但它保证循环内的代码块至少会执行一次，即使条件最初为假。\n\
    \n```csharp\nint number = 0;\ndo\n{\n    Console.WriteLine(\"Number: \" + number);\n\
    \    number++;\n} while (number < 5);\n```\n\n此循环将打印 number 的值并将其递增，直到达到 5。\n\n\
    ### 4. foreach 循环\n\nforeach 循环专为遍历集合（如数组和列表）而设计。\n\n```csharp\nstring[] fruits\
    \ = { \"apple\", \"banana\", \"orange\" };\nforeach (string fruit in fruits)\n\
    {\n    Console.WriteLine(fruit);\n}\n```\n\n此循环将遍历 `fruits` 数组并打印每个水果。\n\n在本节中，我们探讨了\
    \ C# 中的基本控制流结构：if、else、switch 和循环。我们了解到这些结构如何使我们能够做出决策、处理多种情况以及重复执行操作，为我们的程序增添动态性和灵活性。掌握这些知识后，你现在已具备编写能够应对复杂场景并适应多样化输入的\
    \ C# 代码的能力。\n\n## 函数和方法\n\n函数和方法是编程的主力军，使我们能够将可重用的代码块封装为独立的单元。它们促进模块化、代码重用性和可维护性，使我们的程序更加有条理和高效。在\
    \ C# 中，函数和方法本质上是相同的，术语“方法”通常用于指代在类中定义的函数。在本节中，我们将深入探讨函数和方法的世界，了解它们的语法、参数、返回值以及在构建\
    \ C# 程序中所起的关键作用。\n\n## 定义函数和方法\n\n在 C# 中定义函数或方法的一般语法如下：\n\n```csharp\naccess_modifier\
    \ return_type function_name(parameters)\n{\n    // Code to be executed\n    return\
    \ value; // If the function has a return type\n}\n```\n\n让我们分解此语法的各个组成部分：\n\n\
    - `access_modifier`：指定函数或方法的可访问性（例如，`public`、`private`、`protected`）。\n- `return_type`：定义函数将返回的值的数据类型。如果函数不返回值，请使用关键字\
    \ `void`。\n- `function_name`：你为函数或方法命名的名称，遵循 C# 的命名约定。\n- `parameters`：函数或方法作为输入接受的变量的逗号分隔列表。\n\
    - `// Code to be executed`：执行函数或方法预期任务的实际代码。\n- `return value;`：函数返回的值（如果适用）。\n\
    \n## 示例：一个简单的函数\n\n让我们创建一个计算数字平方的简单函数：\n\n```csharp\npublic static int Square(int\
    \ number)\n{\n    int result = number * number;\n    return result;\n}\n```\n\n\
    在此示例中，函数 Square 接受一个整数 number 作为输入，计算其平方，并将结果作为整数返回。public static 修饰符表示该函数可以从程序中的任何位置访问，并且不需要对象实例即可调用。\n\
    \n## 调用函数和方法\n\n要利用函数或方法中封装的功能，你需要调用它，并在需要时提供必要的参数。\n\n```csharp\nint number =\
    \ 5;\nint squaredNumber = Square(number);\nConsole.WriteLine(\"The square of \"\
    \ + number + \" is \" + squaredNumber);\n```\n\n在此代码片段中，我们调用 Square 函数，将 number\
    \ 变量的值作为参数传递。该函数计算平方并返回结果，我们将其存储在 squaredNumber 变量中。最后，我们将结果打印到控制台。\n\n## 参数和实参\n\
    \n参数充当你在调用函数或方法时传递的值的占位符。另一方面，实参是你在函数调用期间提供的实际值。\n\n- **按值传递**：在 C# 中，参数通常按值传递，这意味着会创建参数值的副本并将其传递给函数。在函数内对参数所做的任何修改都不会影响原始参数。\n\
    - **按引用传递**：你也可以使用 ref 或 out 关键字按引用传递参数。在这种情况下，函数接收对原始参数的引用，从而允许直接修改参数的值。\n\n\
    ## 返回值\n\n函数和方法可以向调用者返回值，提供一种传达结果或计算数据的方式。return 语句用于指定要返回的值。\n\n## 重载函数和方法\n\n\
    C# 允许你定义多个名称相同的函数或方法，只要它们的参数列表不同即可。这称为函数或方法重载，为代码设计提供了灵活性。\n\n在本节中，我们探讨了 C# 中函数和方法的世界，学习了如何定义它们、调用它们，并利用其力量来封装可重用代码。我们还研究了参数、返回值和函数重载，深入了解了它们为\
    \ C# 编程带来的多功能性和效率。掌握这些知识后，你现在已具备更有效地构建代码、促进重用性并使用 ASP.NET Core 3 构建强大 Web 应用程序的能力。\n\
    \n## 面向对象编程（类、对象、继承、多态性）\n\n面向对象编程（OOP）是一种强大的范式，彻底改变了我们设计和构建代码的方式。它使我们能够将现实世界的实体建模为对象，将其数据和行为封装在自包含的单元中。OOP\
    \ 促进模块化、代码重用性和可维护性，使其成为现代软件开发的基石。在本节中，我们将踏上探索 C# 中 OOP 核心原则的旅程，了解类、对象、继承和多态性，并见证它们如何使我们能够创建优雅且可适应的程序。\n\
    \n## 类：对象的蓝图\n\n在 OOP 领域中，类充当创建对象的蓝图或模板。它定义了该类对象将具有的结构和行为。可以将其视为饼干模具，每个饼干都代表从同一模具中创建的对象。\n\
    \n以下是在 C# 中定义类的一般语法：\n\n```csharp\nclass ClassName\n{\n    // Fields (data members)\n\
    \    // Properties (accessors for fields)\n    // Methods (functions associated\
    \ with the class)\n    // Constructors (special methods for object creation)\n\
    }\n```\n\n让我们通过一个示例来说明：\n\n```csharp\nclass Car\n{\n    // Fields\n    public\
    \ string Make;\n    public string Model;\n    public int Year;\n    // Constructor\n\
    \    public Car(string make, string model, int year)\n    {\n        Make = make;\n\
