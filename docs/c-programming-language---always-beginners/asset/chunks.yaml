    { When program starts.


    } When program ends.


    ; To terminate program statements.• Defining Constants in C ProgramThere are two
    simple ways in C to define constants:


    1\. Using #define preprocessor.


    2\. Using const keyword.The #define Preprocessor:


    The #define macro definitions allow constant values to be declared for use throughout
    your code. Macro definitions are not variables and cannot be changed by your program
    code like variables. The syntax for creating a constant using #define in the C
