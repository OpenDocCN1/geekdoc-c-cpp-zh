- fmt: "\n# 函数基础\n\n## 函数的组成部分\n- **返回值类型**：`return type`；可以是任何合法的数据类型，例如 `int`, `char`,\
    \ `pointer`……如果函数不返回任何值，则返回值类型为 `void`。\n- **函数名**：由字母和数字组成序列的首字符必须是字母（下划线视作字母）。函数名应具有含义。例如：*result()*\n\
    - **参数列表**：传递给函数的参数需用逗号分隔，每个参数必须指明其数据类型和参数名称。\n\n### 3.1、没有参数的 UDF  \n这种用户自定义函数的返回值为\
    \ void ，并且在调用时不传入形参表。  \n\n###   使用 IO BIT除了常见形式外还有两种特殊Udf:\n>注意：\n\n#### With\
    \ argument no return value (有參數無回傳) \n\n  此類 open..\"',\n\n答案解析如下 :\n\n第一種情况是没有自变数且无对应結果的使用方式：\n\
    采用的是function宣告時加上no parameter name及不能从外部获得数据的設計思路,\n直接在内部运算并输出至console .\n\n第二种类是有input但没有output结果(return),必須於arguments內表明每個变量的型態,同样最終以printf等方式呈現而不透過關鍵字\
    \ Return完成.\n\n第三种则是既有输入也有正确响应的版本 ——我們會將運算後得到的final answer送出去給主程序或其他調用地方继续活用 。下面分別舉例:\n\
    \n/* 【範例完整演示】：*/\n```c\n#include<stdio.h>\n#include<conio.h>\n\nvoid sum1(); \
    \                 // func declaration: No params , Void ret \nvoid sum2(int,int);\
    \           // Func with two integer param & void возврат   \nint sum3(int a,\
    \ int b){        /* Only prototype before main; full body later? Let’s unify */\
    \ }\n\n...\n\n```\n實際上根據原稿內容整理為以下清晰結構 --- \n\n##### A . No Arguments & No Return\
