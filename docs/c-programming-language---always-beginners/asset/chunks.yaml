    if ( a<=b )


    printf(“ a is less than and equal to b “ );


    if ( a<b )


    printf(“ a is less than b “ );


    }• LOGICAL OPERATORS IN C


    There are three logical operators in C Language. Logical operators are use to
    join multiple relation conditions.Operator Description Example ! Logical NOT !
    n1


    && Logical AND n1 > 0&& n1 <= 100 | | Logical OR n1 == n2


    || n1 == n3Result


    returns true if n1 is false . returns true only if both conditions are true


    returns true if any one condition is true .


    Example :#include < stdio.h > #include < conio.h >void main( ) {


    float per; clrscr( );printf( “Enter Student’s Percentage of Marks : “); scanf(“%d”,
    &per);


    if( per < 40 || per >100 ) printf(“ Fail “);


    if ( per >= 70 )


    printf(“ Distinction “);


    if ( per >= 60 && per < 70 ) printf(“ First Class “);


    if ( per >= 48 && per < 60 ) printf(“ Second Class”);


    if( per >=40 && per < 48 ) printf(“ Pass Class “); }• TERNARY OPERATORS IN C (
    CONDITIONAL OPERATOR ) The conditional operator ? and : are sometimes called ternary
    operators because they take three arguments. Ternary operator can be use instead
    of if … else condition.Syntax :


    expression1 ? expression2 : expression3


    expression1 expression2expression3 Relational condition


    if Relational condition in expression1 is true, the value returned will be expression2.


    if Relational condition in expression1 is false , the value returned will be expression3.y=(x
    > 5 ? 3 : 4);


    This statement will store 3 in y if x is greater than 5, otherwise it will store
    4 in y.• UNARY INCREMENT AND DECREMENT OPERATOR ( ++ , - - ) Two types of Unary
    operator (1) increment operator ++ (2) decrement operator --. Those work in two
    flavors PRE and POST as per its position. pre incrementIncrement operator position
    is before the operand. In pre increment operator, the operand value is increased
    by one before assignment. Ans= ++a;


    It is combination of two statements (1) a=a+1; (2) ans=a;


    post increment


    Increment operator position is after the operand. In post increment operator,
    the operand value is increased by one after any assignment. Ans= a++;


    It is combination of two statements (1) ans=a; (2) a=a+1;


    pre decrement


    Decrement operator position is before the operand. In pre decrement operator,
    the operand value is decrease by one before any assignment. Ans= --a;


    It is combination of two statements (1) a=a-1; (2) ans=a;


    post decrement


    Decrement operator position is after the operand. In post decrement operator,
    the operand value is decrease by one after any assignment. Ans= a--;


    It is combination of two statements (1) ans=a; (2) a=a-1;


    Example :


    #include <stdio.h>void main( ) {


    int a,b,c,d;


    int i=2,j=2,k=2,m=2;


    a=++i;


    b=j++;


    c= --k;


    d= m--;


    printf(“\n a=%d b=%d c=%d d=%d”,a,b,c,d ) ; // Returns a=3 b=2 c=1 d=2


    printf(“\n i=%d j=%d k=%d m=%d”,i, j, k, m ) ; // Returns i=3 j=3 k=1 m=1• C LANGUAGE
    TOKENS


    The language elements are called tokens. Identifiers, operators, keywords, Literals
    and special symbols are examples of tokens. Identifiers:


    The names of variables, functions or arrays in a program are an identifier.


    Keywords


    The keywords are reserved identifiers used by C language. C language has total
    32 keywords in all. Some of them are do, while, for, break etc… Literals ( Constants
    )


    A literal denotes constant value.integer : 200 0 -7


    real : 3.14 -3.14 3e+5


    character : ‘a’ ‘A’ ‘ * ‘ ‘ $ ’


    string : “abba” “3.14” “is”Comments


    The compiler ignores everything written in comments. The C language supports two
