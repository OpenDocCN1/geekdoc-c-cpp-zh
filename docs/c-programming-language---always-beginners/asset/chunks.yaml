    is higher than Addition and Subtraction operator. So if in any arithmetic statement
    these operators are available then Multiplication, Division and Modulus operation
    is performed first. After that Addition and Subtraction is performed.


    Example :#include < stdio.h > #include < conio.h > void main( )


