  trans: "\n我们可以使用 `const` 前缀来声明具有特定数据类型的常量。在 C 语言中，使用 `const` 创建常量的语法如下：\n```\nconst\
    \ data-type variable = value;\n```\n\n例如：\n```c\nconst int AGE=10;\n```\n\n程序：\n\
    \n```c\n#include <stdio.h>\n\n#define LENGTH 10 \n#define NEWLINE '\\n'\n\nvoid\
    \ main() {\n    const int WIDTH=5; \n    int area;\n    area = LENGTH * WIDTH;\n\
    \n    printf(\"value of area : %d\", area); \n    printf(\"%c\", NEWLINE);\n}\n\
    ```\n\n## **决策结构**\n\n### **1. if**语句\n\n`if` 是一个功能强大的决策语句，用于控制语句的执行流程。\n\n**语法：**\n\
    ```\nif (关系表达式) { …  语      句块；… }\nStatement-x；\n```\n如果关系条件为真，则执行程序中的“句子块”；否则跳过此步骤\
    \ ，并直接跳转到 statement‑x 。\n\n*If* ––流程图:\n入口 → condition？True→yes 将处理 “ blocks \"\
    \ ；False⇒ skip- ——两者均前往 Statement - x,然後继续下一步。\n\n\n示例节选 （中文解释）—保持原代码不翻译但更新括号等对齐:——\n\
    \n ``` csharp /* ex 源码保持一致改写不是添加/删除)：*/\n# include<stdio .h > \n\n void　main(\
    \ ){\n　　　int i ;\n     clrscr();\n         Printf(“请输入任意整数:“ );\n            scanf\
    \ (“% d”,&i);\n\n               if        ( I %2 ==0 ) {\n                   \
    \  Print f（”该数字可以被 2 整除。“）；\n\n                    }  \n// ... end example 内容完成\
    \     \n ```\n\n ### ****２\\.**** else——应用  \n\n比基础扩展的更强大——“IF...else”。多条的话就是无穷循环等待选择\
    \ 。其框架是条件成立走分支 true block +失败进到下行｛false part ｝接着取连续赋予新变量再分配定义其他运用复杂组合……\n\n对的：“Entry\
