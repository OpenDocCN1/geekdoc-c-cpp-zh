  raw: 'statements; ….}When the control enters for loop the variables used in for
    loop is initialized with the starting value such as I=1\. The value which was
    initialized is then checked with the given test condition. The test condition
    is a relational expression, such as I <=10 that checks whether the given condition
    is satisfied or not if the given condition is satisfied the control enters the
    body of the loop or else it will exit the loop. The body of the loop is entered
    only if the test condition is satisfied and after the completion of the execution
    of the loop the control is transferred back to the expression part of the loop.
    The conditional variable is incremented using an assignment statement such as
    I++ and the new value of the control variable is again tested to check whether
    it satisfies the loop condition. If the value of the control variable satisfies
    then the body of the loop is again executed. The process goes on till the control
    variable fails to satisfy the condition.Example :#include < stdio.h > void main
    ( )


    {int i;


    clrscr( );


    for ( i=1;i<=10;i++) {printf(“%d\n”,i); }• BREAK, CONTINUE STATEMENTS IN C1\.
    break StatementWe often come across situations where we want to jump out of a
    loop instantly, without waiting to get back to the conditional test. The keyword
    break allows us to do this. When the keyword break is encountered inside any C
    loop, control automatically passes to the first statement after the loop.Example:


    void main( )


    {clrscr( );


    for(i=1 ; i <= 100 ; i++) {


    printf( “%d”,i );


    if( i == 50 ) break; }


    }


    2\. continue StatementIn some programming situation we want to take the control
    to the beginning of the loop, bypassing the statements inside the loop which have
    not yet been executed. The keywords continue allows us to do this. When the keyword
    continue is encountered inside any C loop, control automatically passes to the
    beginning of the loop.Example:


    void main( )


    {clrscr( );


    for(i=1 ; i <= 100 ; i++) {


    if( i % 5 == 0 ) continue; printf( “%d”,i ); }• ARRAYDefinition :


    An array is a collection of elements having same name, same data type and different
    index value.Declaring Arrays


    We can declare an array by specify its data type, name and the number of elements
    the array holds between square brackets immediately following the array name.


    Here is the syntax:data_type array_name[size];For example, to declare an integer
    array which contains 100 elements we can do as follows:


    int a[100];There are some rules on array declaration.


    • The data type can be any valid C data types.


    • The array name has to follow the rule of variable name. • The size of array
    has to be a positive constant integer.Initializing Arrays


    To initialize an array, you provide initializing values which are enclosed within
    curly braces in the declaration and placed following an equals sign after the
    array name.


    Here is an example of initializing an integer array.int a[5] = { 10,20,30,40,50
    };


    This statement stores 10 to a[0], 20 to a[1], 30 to a[2], 40 to a[3] and 50 to
    a[4].Accessing Arrays Elements


    We can access array elements via indexes array_name[index]. Indexes of array starts
    from 0 not 1 so the highest elements of an array is array_name[size-1].


    Here is an example of accessing an arrayprintf(“First Element of A array:=%d”,a[0]);


    printf(“Fourth Element of A array:=%d”,a[3]);


    Program for Store and Print Array Elements:


    #include<stdio.h>


    void main( ) {


    int a[10],i;// Store values in an array for(i=0;i<10;i++)


    {printf(“Enter element %d = “,i+1); scanf(“%d”,&a[i]);


    }


    // Print values in an array


    for(i=0;i<10;i++){


    printf(“Element a[%d] = %d “,i , a[i] );


    }}


    Multidimensional Arrays:An array with more than one index value is called a multidimensional
    array.


    The entire array above is called single-dimensional array. To declare a multidimensional
    array you can do follow syntaxdata_type array_name[][][];The number of square
    brackets specifies the dimension of the array. For example to declare two dimensions
    integer array we can do as follows:int matrix[3][3];Initializing Multidimensional
    Arrays


    You can initialize an array as a single-dimension array. Here is an example of
    initialize an two dimensions integer array:int matrix[3][3] = {


    {11,12,13}, {21,22,23}, {32,31,33},};


    Program for Store and Print Two Dimension Array Elements:


    #include<stdio.h>void main( ) {


    int a[3][3],i,j; clrscr( );// Store values in an arrayfor(i=0;i<3;i++) {


    for(j=0;j<3;j++) {


    printf(“Enter element a[%d][%d] = “,i,j); scanf(“%d”,&a[i][j]);


    }


    }


    // Print values in an arrayfor(i=0;i<3;i++) {


    for(j=0;j<3;j++) {


    printf(“%3d “,a[i][j] ); }


    printf(“\n”);


    }}


