    true if value of n1 is greater than or equal to n2


    true if n1 and n2 are equal. true if n1 and n2 are not equal. ➢ Relation operators
    are useful in relational conditions (i.e. decisionmaking and looping structures).


    ➢ Relation operators are binary operators and require two operands. ➢ Relation
    operator returns result of operation either true (1 or otherthan zero) or false
