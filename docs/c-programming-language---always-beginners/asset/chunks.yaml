  raw: '• Data type of return value of function ; it can be any legal data type such
    as int, char, pointer… if the function does not return a value then return type
    is void.• Function name; function name is a sequence of letters and digits, the
    first of which is a letter, and where an underscore counts as a letter. The name
    of a function should meaningful. for example result(),• And a parameter list;
    parameter passed to function have to be separated by a comma, and each parameter
    has to indicate it data type and parameter name.Function body


    Function body is the place you write your own source code.


    Return statement


    Return statement returns a value to where it was called. A copy of return value
    being return is made automatically. If the void keyword used, the function don’t
    need a return statement.Types of UDF:


    Basically three types of UDF


    1) No argument no return value 2) With argument no return value 3) With argument
    with return valueNo argument no return value:


    • This user defined function return data type is void. • no parameter list pass
    in function.With argument no return value:


    • This user defined function return data type is void • parameter list pass in
    function.With argument with return value:


    • This user defined function return data type is can be any legal data type such
    as int, char etc… and parameter list pass in function.• Function body has a return
    statement .


    • At a time of function call return value store in any variable or directly display
    using printf statement.For example:


    #include<stdio.h> #include<conio.h>void sum1( );


    void sum2(int, int); int sum3(int, int); void main()


    {int no1,no2,ans; clrscr();


    sum1();


    sum2(10,30);


    ans=sum3(100,200);Function Declaration


    Function Callingprintf(“\n With Arg. with Return Sum:=%d”,ans); }


    void sum1( )


    {int x=1, y=2,ans;


    ans=x+y;


    printf (“\n No Arg. No Return Sum :=%d”,ans);}


    void sum2(int x, int y)


    {int ans; Function Definition ans=x+y;


    printf (“\n With Arg. No Return Sum :=%d”,ans);}


    int sum3(int, int)


    {return (x+y); }OUTPUT:


    [No Arg. No Return Sum :=3](#part0001.xhtml_aC7) [With Arg. No Return Sum :=40](#part0001.xhtml_aC8)
    With Arg. with Return Sum :=300'
