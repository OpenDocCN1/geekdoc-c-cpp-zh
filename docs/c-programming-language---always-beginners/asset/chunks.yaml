- fmt: "\nWe can use `const` prefix to declare constants with a specific data type.\
    \ The syntax for creating a constant using `const` in the C language is:  \n```\n\
    const data-type variable = value;\n```\n\nFor example:\n```c\nconst int AGE=10;\n\
    ```\n\nPROGRAM:\n\n```c\n#include <stdio.h>\n\n#define LENGTH 10 \n#define NEWLINE\
    \ '\\n'\n\nvoid main() {\n    const int WIDTH=5; \n    int area;\n    area = LENGTH\
    \ * WIDTH;\n\n    printf(\"value of area : %d\", area); \n    printf(\"%c\", NEWLINE);\n\
    }\n```\n\n## DECISION STRUCTURES\n\n### 1. if Statement\n\nThe `if` statement\
    \ is a powerful decision making statement and is used to control the flow of execution\
    \ of statements.\n\n**Syntax:**  \n```\nif (relational Condition) { …Statements-block;\
    \ … }\nStatement-x;\n```\n\nIf relational condition is true then statements-block\
    \ is executed in the program otherwise skipped and the execution will jump to\
    \ the statement-x .\n\n**Execution Flow of If Statement:**\n\nEntry → Condition?\
    \ True → Statements-block, False → skip directly — both go to Statement-x then\
    \ Next Statements.\n\nExample:\n```c\n#include<stdio.h> \n\nvoid main( ) {\n \
    \  int i;\n   clrscr( );\n   printf(“Enter Any Number : “ ); scanf(“%d”,&i);\n\
    \n   if ( i % 2 == 0 ) {\n      printf(“Number is divisible by 2“);\n   }\n}\n\
    ```\n\n### 2. if…else Statement\n\nThe `if…else` statement is an extension of\
    \ the simple `if` statement.\n\n**Syntax:**  \n```\nif (relational Condition)\
    \ {True block statements;}\nelse                    {False block statements;}\n\
    Statement–x ;\n```\n\nIf relational condition evaluates as true, true block part\
    \ executes ; else false block part (`else`) executes instead . After that，statement‑\
    \ x runs 。\n\nAn Execution diagram： Entry→Condition？True⇒true_block；False⇒false_block——they\
    \ converge on ‘statement – X’ ⇒Next。  \n\nExample：\n``` csharp（or none）/* Since\
    \ code already has*/ # include< standard io header > ... etc */\n//keep given\
    \ one exactly without extra edits below :\n# include \" stdio 。 h \"\n void　　　main\
    \ （）\n{\n     float per；\n     …… // same style restore final ex完整正确形式见下块：\n\n\
    我们会精确再现原始内容 ，不作取舍改动结构 ——考虑易读调整独立代码block ＋反引号标注。\n以下严格还原示例原文最终部分且执行格式化规则。\n\n_______\n\
