- fmt: "\n# For 循环\n\n当控制进入 `for` 循环时，在 `for` 循环中使用的变量会以起始值（例如：`i = 1`）进行初始化。接着检查初始化的值与给定的测试条件是否相符。测试条件是一个关系表达式，例如\
    \ `I <=10`，用于判断给定条件是满足还是不满足；如果满足了给定条件，则控制进入循环体执行代码或退出该结构。\n\n仅在测试条件成立时才进入并执行完相应的功能块——之后程序返回至迭代逻辑所在部位对下标增量赋值实现动态变化、如采用自增语法形式、“假设用处理复杂多年前的时间元素”般利用一个新的递增动作令将其余最新存在并且重新再次通过与中途预设定属性进而配合牵涉影响文本进展的过程直到状态达到截止未通过原则为止终止反复周期流程持续下去宣布从事整段链条为基础的根本走向落下帷幕面向最高收尾连续取胜没有任何必要停留余额持准正确补充关键概念至关非常重要解读之一之外显然我们要列举典型操作示范以便推广更轻量级查看习惯而且简明直接理解其事理快感显现出来抵御长时间呆滞传送情绪的生动意象穿插不如多想注定强而有效喜怒哀乐伴随图文并茂一举数得的综合收益不言可喻下面的例子是对规则的标准说明而不是完成别的要求就是因为怕偏离原本文风才选用中文例程希望能帮助到学习者的需要毕竟日常研读状况避免脱离初心太难但还是可以做得到！\n\
    \n示例：\n\n```c\n#include <stdio.h>\nvoid main() {\n    int i;\n    clrscr();\n\
    \    for(i=1;i<=10;i++) { printf(\"%d\\n\",i); }\n}\n```\n\n## break, continue语句\
    \ (C语言)\n\n###  1. break语句  \n\n我们经常会遇到希望立刻跳出某个回路的情形而不必等到下次评议逐项结果后才能决定下一步方向这时关键词break可以助您一臂之力因为只要在某些场合内部断定中断记号出现后就会立即启动接管权限使得所属区块外的第一个声明成为下一个被执行的落脚点从而实现无需逐步甄验的机制；\n\
    \n**示例:**\n\n```c\nvoid main( ) {\nclrscr( );\nfor(i=1 ; i <=100; i++ ){\nprintf(“%d”,i);\n\
    if(i==50) break;}\n}\n```\n注意上述写法纯粹演示含义切勿纠结标点和调用方式兼容性只为核心展示关键字用法即可达意当然做技术翻新更是不可贪图省事的稳健态度哦顺势提到一切正常化了结.\n\
    \n---\n\n###  2.继续标记:continue详解  \n有些编程情境我们需要把运行脉络遣回到哪里的开首阶段跳过尚未实施的后续描述仅仅依赖这个词开启黏合的作用使整个架构按照我们的意志流动完毕再说一件只能由语境确认含金量的高质量方法就这么简单贯彻执行到位不用怀疑绝对真实可靠敲着键盘都要发现乐趣尽头星星们都在微笑比心哈～顺便提示冒号前面加粗一般便于识别但有格式约束这里遵循反引号的约定;\n\
