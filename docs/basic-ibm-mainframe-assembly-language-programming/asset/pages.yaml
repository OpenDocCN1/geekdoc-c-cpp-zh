- pgno: 115
  md: '# 12.2 Condition Code After Binary Operations


    All signed arithmetic Add and Subtract instructions set the Condition Code to
    indicate the result of the operation as shown in Table 23. Multiply and divide
    instructions do not set the condition code, it remains unchanged.


    # 12.3 Overflows


    The signed binary add and subtract instructions can encounter situations where
    the result of the operation would overflow the register. This happens in 32-bit
    addition when the result exceeds the maximum or minimum allowed for a signed positive
    32 bit number, +2,147,483,647 and -2,147,483,648, respectively. In the case of
    64 bit numbers, these values are +18,446,744,073,709,551,615 and -18,446,744,073,709,551,616.


    **Table 23 Condition Codes**


    | Result | Condition Code |

    |---|---|

    | zero | 0 |

    | < zero | 1 |

    | > zero | 2 |

    | overflow | 3 |


    Overflows can also occur with the Shift Left Arithmetic (SLA, SLAG) and Shift
    Left Double Arithmetic (SLDA) instructions (when a bit unlike the sign bit is
    shifted into the sign bit position (the high order bit). As this would result
    in a sign change, it is considered to be an overflow.


    When an overflow, the Condition Code is set to 3 and a fixed-point overflow exception
    interrupt is raised. This normally results in program termination unless bit 20
    (in the Program Mask) of the PSW is 1 in which case the interrupt is disallowed.


    **Table 24 Signed Subtract Instructions**


    | OpCode | Type | 1st Operand | 2nd Operand | Result |

    |---|---|---|---|---|

    | S | RX | 32 bit register | 32 bit memory | 32 bit register |

    | SR | RR | 32 bit register | 32 bit register | 32 bit register |

    | SH | RX | 32 bit register | 16 bit memory | 32 bit register |

    | SCR | RXE | 64 bit register | 64 bit register | 64 bit register |

    | SGFR | RRE | 64 bit register | 32 bit register | 64 bit register |

    | SY | RXY | 32 bit register | 32 bit memory | 32 bit register |

    | SG | RXY | 64 bit register | 64 bit memory | 64 bit register |

    | SGF | RXY | 64 bit register | 32 bit memory | 64 bit register |

    | SHY | RXY | 32 bit register | 16 bit memory | 32 bit register |'
  merge: -1
  img_proc: true
- pgno: 116
  md: '# 12.4 Subtraction


    Similar to the Add instructions A and AR, are the original Subtract instructions
    S and SR. The S instruction is of type RX and the SR is of type RR. Both subtract
    the contents of the second operand from the register specified as the first operand
    leaving the result in the first operand. Both operate on 32 bit signed (2s complement)
    binary integers. The full set of Subtract instructions is given in Table 24.


    # 12.5 Unsigned Binary Arithmetic


    The architecture provides for unsigned arithmetic known as logical instructions
    as shown in Table 26 and Table 27. All logical instructions treat both operands
    as unsigned binary integers. An overflow cannot occur. Instead, the Condition
    Code indicates if a carry took place as shown in Table 25. The similar table for
    Subtract Logical indicates a borrow. This information can be used to construct
    extended precision binary integer arithmetic for which the Add Logical with Carry
    (ALCR, ALC, ALCGR, and ALCG) instructions were specifically added.


    Table 25 CC after logical add


    Result | Condition Code

    zero, no carry | 0

    not zero, no carry | 1

    zero, carry | 2

    not zero, carry | 3


    Table 26 Logical Add Instructions


    OpCode | Type | 1st Operand | 2nd Operand | Result

    AL | RX | 32 bit register | 32 bit memory | 32 bit register

    ALR | RR | 32 bit register | 32 bit register | 32 bit register

    ALGR | RRE | 64 bit register | 64 bit register | 64 bit register

    ALGFR | RRE | 64 bit register | 32 bit register | 64 bit register

    ALY | RXY | 32 bit register | 32 bit memory | 32 bit register

    ALG | RXY | 64 bit register | 64 bit memory | 64 bit register

    ALGF | RXY | 64 bit register | 32 bit memory | 64 bit register

    ALCR | RRE | 32 bit register | 32 bit register | 32 bit register

    ALC | RXY | 32 bit register | 32 bit memory | 32 bit register

    ALCGR | RRE | 64 bit register | 64 bit register | 64 bit register

