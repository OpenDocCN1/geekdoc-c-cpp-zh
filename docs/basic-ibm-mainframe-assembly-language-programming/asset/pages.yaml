  img_proc: true
- pgno: 85
  md: 'In addition to the BXLE, there is the newer BXLEG instruction. This is of machine
    format RSY (see section 6.8.7). In this instruction, for purposes of addition
    and comparison, the operands are treated as 64 bit signed integers. Overflow is
    likewise ignored. Otherwise, the instruction behaves similarly to the BXLE. Note
    that RSY instructions use longer, signed displacements.


    # 8.4.1.2 Branch Relative on Index Low or Equal (BRXLE)


    ```

    BRXLE R1,R3,I2

    ```


    The Branch Relative on Index Low or Equal is an RSI format (see section 6.8.6)
    instruction similar to the BXLE. In the case of the BRXLE instruction, the branch
    address is calculated by adding the twice the value of the 16 bit signed immediate
    operand to the current instruction address. Thus, the instruction, if it branches,
    branches relative to the current address. The immediate operand specifies the
    number of half-words to branch. The index, increment and limit are treated as
    signed 32 bit quantities.


    # 8.4.1.3 Branch Relative on Index Low or Equal (BRXLG)


    ```

    BRXLG R1,R3,I2

    ```


    This instruction is of format RIE and is the same as BRXLE except the index, increment
    and limit are treated as signed 64 bit quantities.


    # 8.4.2 Branch Index High (BXH)


    ```

    BXH R1,R3,D2(B2)

    ```


    Closely related to the BXLE is the Branch Index High - BXH. The BXH operands are
    the same in scope and function as the BXLE except that the branch takes place
    when the contents of the register specified as the first operand are greater than
    the limit value. If not, the branch does not take place.


    # 8.4.2.1 Branch Index High 64 bit (BXHG)


    ```

    BXHG R1,R3,I2

    ```


    Corresponding to the BXH is the newer RSY format BXHG instruction in which the
    increment, limit and index registers are treated as signed 64 bit quantities.


    # 8.4.2.2 Branch Relative on Index High (BRXH/BRXHG)


    ```

    BRXH R1,R3,I2

    BRXHG R1,R3,I2

    ```


    The BRXH is similar to the BXH (32 bit operands), and the BRXHG is similar to
    the BXHG (64 bit operands) however both instructions calculate the branch address
    by adding twice'
  merge: -1
  img_proc: true
- pgno: 86
  md: 'value of the 16 bit signed immediate operand to the current instruction address.


    # 8.4.3 Branch on Count (BCT/BCTR)


    ```

    BCT  R1,D2(X2,B2)

    BCTR R1,R2

    ```


    A similar set of looping instructions are the BCT and BCTR or Branch on Count
    instructions. In both of these, one is subtracted from the contents of the register
    specified as the first operand. If the result is not zero, a branch is made to
    the address specified by the second operand. When the result is zero, execution
    advances to the next instruction following the BCT or BCTR. The first operand
    is treated as a 32 bit signed quantity.


    In the case of the BCTR, the second operand is a register whose contents are the
    branch address except when the second operand is specified as register zero. In
    this case no branch takes place (R0 being used in an addressing context). In the
    case of the second operand being R0, the BCTR becomes, in effect, a decrement
    instruction on the register specified as the first operand.


    Using a BCT instruction, the program from Figure 32 becomes the program in Figure
    33. As before, we zero the contents of R2 (line 5) and load 100 into R5, the count
    register. On line 7 we add the counting register into the total (R2). The BCT
    instruction decrements R5 and branches to LOOP if R5 is not zero.


    ```

    1     PRINT          NOGEN

    2     EQUREGS

    3     SUM100          SUBENTRY

    4

    5     SR              R2,R2

    6     L               R5,HUNDRED

    7     LOOP            AR              R2,R5

    8     BCT             R5,LOOP

    9     XDECO           R2,DBL

    10    XPRNT            DBL,L''DBL

    11    SUBRETURN

    12    LTORG

    13    HUNDRED          DC              F''100''

    14    DBL              DS              CL12

    15    END

    ```


    Figure 33 BCT Loop Example'
  merge: -1
  img_proc: true
- pgno: 87
  md: '# 8.4.3.1 Branch on Count (BCTG/BCTGR)


    ```

    BCTG R1,D2(X2,B2)

    BCTGR R1,R2

    ```


    These instructions are essentially the same as the BCT/BCTR but treat the first
    operand as a 64 bit signed quantity. The BCTG uses a 20 bit signed displacement
    rather than an unsigned 12 bit displacement as is the case with the BCT.


    # 8.4.3.2 Branch Relative on Count (BRCT/BRCT G)


    ```

    BRCT R1,I2

    BRCTG R1,I2

    ```


    The BRCT is the same as the BCT (32 bit operand), and the BRCTG is the same as
    the BCTG (64 bit operand), except that, in both cases, the branch address is calculated
    by adding twice the value of the signed 16 bit displacement to the current instruction
    address.'
