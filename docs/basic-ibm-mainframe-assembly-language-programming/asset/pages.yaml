- pgno: 98
  md: 'is omitted, a default value of 4 will be used. This describes the extent of
    the memory area to be dumped. If no operands are given, the entire memory area
    associated with the program is dumped.


    # 10.3 XDECO/XDECI


    These pseudo instructions are used to convert from binary to printable zoned decimal
    and the reverse.


    XDECO converts from fixed point binary to printable zoned decimal and has the
    format:


    ```

    [LABEL]    XDECO R1,D2(X2,B2)

    ```


    The first operand designates the register containing the signed 32 bit fixed point
    binary number to be converted to printable decimal. The second operand gives the
    address of a 12 byte character field that will receive the converted number. The
    number will be right justified with a leading minus sign if negative and padded
    to the left with blanks. The label is optional.


    The XDECI converts from zoned decimal to fixed point binary and has the format:


    ```

    [LABEL]    XDECI R1,D2(X2,B2)

    ```


    The first operand designates the register to receive the number converted to signed
    fixed point binary and the second operand designates the address of a field in
    memory containing the zoned decimal number. The first operand is normally not
    machine general purpose register R1 as R1 is altered by the instruction (see below).


    XDECI scans the input string. If the first character is neither a numeric nor
    a plus nor a minus sign, the instruction halts and machine register R1 is set
    to the address of the first character and the Condition Code is set to 3. Note:
    R1 in this case means the actual register R1, not the first operand. Otherwise,
    the instruction scans the input character string until a non-decimal character
    is encountered (for example, a blank). It converts the zoned decimal number prior
    to the non-decimal character to signed fixed point binary number which it places
    in the first operand. The Condition Code is set to 0 if the converted number is
    zero, 1 if the number is less than zero and 2 if the number is greater than zero.
    If there are more than 9 digits in the zoned decimal number, the Condition Code
    is set to 3 and the first operand is unchanged. In all cases, machine register
    R1 is set to the address of the first character which is not a digit.'
  merge: -1
  img_proc: true
- pgno: 99
  md: '# 10.4 XHEXO/XHEXI


    These operations are similar to XDECO/XDECI except hexadecimal numbers are converted
    and plus or minus signs are not allowed.'
  merge: -1
  img_proc: true
