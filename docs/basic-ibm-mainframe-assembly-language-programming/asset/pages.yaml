  md: '6. Instructions are either two, four or six bytes long. This is true for all
    basic instruction types.


    In the following sections we will examine each instruction format binary layout.


    # 6.7.1 RR Format


    All but one (SPM - Set Program Mask) of the RR format instructions have two operands,
    both of which are either general purpose registers (GPR) or, in the case of branch
    instructions, a mask and a general purpose register. All RR instructions are 16
    bits in length and consist of an 8 bit op-code and two four bit fields used to
    designate the operands. RR format instructions are referred to as register to
    register instructions. RR instructions are shown in assembly language format as:


    ```

    OpCode R1,R2

    OpCode M1,R2

    ```


    Where the opcode is the operation code mnemonic. The R1 field indicates that the
    first operand is a register and R2 tells us that the second operand is also a
    register. M1 tells us that the first operand is a 4 bit mask. A mask is a 4 bit
    pattern that tells a conditional branch instruction the conditions under which
    it should branch. A typical RR instruction is:


    ```

    AR R5,R6

    ```


    AR is a signed binary add instruction where the low order 32 bits from the second
    register (R6) are added to low order 32 bits of R5 with the results remaining
    in R5. RR instruction mnemonics normally end in the letter R (e.g. AR, SR, LR,
    DR, and so forth).


    ![](img/4b7e9c58cac527296b19b501116daeb1_58_0.png)


    Figure 10 RR Format


    RR machine language format, as shown in Figure 10 is the simplest. It consists
    of an opcode in the first eight bits (bits zero through seven) and, in most cases,
    two register specifications in bits 8 through 11 and bits 12 through 15, respectively.
    Since each of the register fields is four bits, it can have a value from 0000₂
    to 1111₂ (R0 to R15). For example, consider the instruction:


    ```

    AR R5,R6

    ```'
  merge: -1
  img_proc: true
- pgno: 59
  md: 'The opcode for the AR instruction, in hexadecimal, is 1A so the machine language
    translation of the above is the two bytes:


    ```

    1A56

    ```


    This is the translation of the symbolic format code to actual executable code.
    When you run the assembler, you will see this translation on the left hand side
    of the assembler output file (the .PRN file in the z390 emulator).


    In the Branch Conditional Register (BCR) instruction, the 4 bits of the first
    operand are not a register but, rather, a 4 bit mask which is used to determine
    under what conditions the instruction will branch. The branch address is contained
    in the register specified as the second operand.


    # 6.7.2 RX Format


    RX format instructions have two operands. The opcode is always the first byte.
    The first operand is a register (shown as R1) or a mask (shown as M1). The second
    operand, shown as D2(X2,B2), is used to calculate the address of the operand in
    memory. The R1/M1 operand is specified in a 4 bit field. The address of the second
    operand is calculated from the base register, displacement and index register.
    The displacement is a 12 bit field containing an unsigned constant between 0 and
    4095. If the index register is specified as register zero (often the case), it
    means there is no index register. RX instructions are always four bytes long.


    RX instructions are specified in assembly language as:


    ```

    OpCode R1,D2(X2,B2)

    OpCode M1,D2(X2,B2)

    ```


    A typical RX instruction would be:


    ```

    A R5,100(R0,R13)

    ```


    Which means to add the 32 bits from memory at the address calculated from the
    second operand to the 32 bits in R5 leaving the answer in R5. The RX machine language
    format is shown Figure 11.


    Address calculation in the original architecture always results in a positive,
    unsigned number.


    The RX instruction:


    ```

    A R5,240(R0,R13)

    ```


