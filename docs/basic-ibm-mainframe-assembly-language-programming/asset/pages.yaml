- pgno: 105
  md: "+   1. Column 1 is what is known as the location counter. It is in hexadecimal\
    \ and gives, relative to location zero, the starting byte address of each line\
    \ of code in the machine language image being created by the assembler. Each time\
    \ a machine language instruction is generated or an area of memory is allocated,\
    \ the location counter will increment by an amount equal to the effective size\
    \ of the instruction or data area. To achieve memory address alignment, bytes\
    \ are occasionally skipped so the location counter increment can sometimes be\
    \ larger than the size of the instruction or data area (all instructions must\
    \ begin on halfword boundaries, F type data definitions on fullword boundaries\
    \ and so forth).\n+   \n+   2. Column 2 is also in hexadecimal and is the translation\
    \ of the assembly language statement (up to the first 8 bytes) of the source code\
    \ shown column 6. Not all assembly language source statements generate machine\
    \ language so this column may be blank.\n+   \n+   3. Column 3 is the effective\
    \ address, relative to zero, of the first operand of the machine language instruction\
    \ if the first operand is a memory address. If the first operand is not a memory\
    \ address (for example, a register) this column is blank. The effective address\
    \ is the location counter address.\n+   \n+   4. Column 4 is the effective address,\
    \ relative to zero, of the second operand if the second operand is a memory address.\
    \ It is blank otherwise.\n+   \n+   5. Column 5 indicates the macro level (first\
    \ number in the parentheses), the original source code statement line number (second\
    \ number in the parentheses), and, finally, the actual line number taking into\
    \ account statements inserted by macro expansions.\n+   \n+   6. Column 6 contains\
    \ your original source code statements.\n\nThe reason why we need to know how\
    \ to read the .PRN file is because it is used in debugging. Very often when we\
    \ have an error, we need to examine the contents of a memory dump (see Chapter\
    \ 20 and the .PRN file is our road map to the dump.\n\nFor example, look at the\
    \ line with the location counter value of 72₁₆ (leading zeros omitted). But there\
    \ are two lines with location counter value of 72₁₆! The first of these, corresponding\
    \ to original source code line 3 (column 5), is the value of the location counter\
    \ at the point when the assembler reads the EQUIREGS statement.\n\nEQUIREGS is\
    \ the name of a macro. The assembler goes to the macro library and inserts the\
    \ 16 lines of macro code at this point."
  merge: -1
  img_proc: true
