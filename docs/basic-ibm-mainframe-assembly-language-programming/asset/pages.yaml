  md: '# 9. Data Definitions & Aggregates


    # 9.1 Define Constant and Define Storage (DC and DS)


    In an assembly language program, you allocate memory either statically by means
    of data declaration instructions that tell the assembler how many bytes to allocate
    and the attributes of the data, or dynamically by using system services. In this
    section, we deal with static data allocation generated by DC and DS instructions.


    In many cases, you will associate a label with each item of data. For each data
    definition, the assembler keeps track of the address of the first byte of the
    data along with several attributes stated or implied by the data definition statement
    (such as length, data type, alignment, repetition factor, initialization, and
    so forth).


    In IBM assembly language, there are two ways to allocate and label memory. The
    first is with a DC instruction and the second is with a DS instruction. A DC (define
    constant) instruction allocates and initializes memory in your program whereas
    a DS (define storage) instruction allocates memory without initialization. Actually,
    the term define constant is misleading. A DC instruction allocates and initializes
    an area of memory but the programmer is free to alter it during execution.


    DS and DC instructions are actually assembler directives and not executable instructions
    as an Add or Subtract would be. They instruct the assembler to reserve bytes in
    the memory image of your program where data will be stored.


    In both forms you often (but not always) place a unique label complying with assembler
    naming rules (see section 4.4) on the instruction. Labels begin in column 1. Following
    the label, you include one or more spaces followed by either DC or DS, followed
    by one or more spaces followed by a series of codes that indicate the data type,
    initial value (if any), duplication factor (similar to dimensionality in a high
    level language), and, if not otherwise implied, the length of the item being allocated.
    Based on these codes, the assembler will allocate memory at the current location
    in your program and will remember the attributes with which you defined the item
    for future use.


    When reserving memory, codes used in the DS/DC instructions tell the assembler
    the type of data being allocated. The most common codes are given in Table 20.
    Each code indicates a data type, and implied length and alignment of the data
    item being defined.


    Several of the codes may have an additional type extension code that further defines
    the data being allocated. For our purposes,'
  merge: -1
  img_proc: true
- pgno: 89
  md: 'only the type extension D will be considered. It may be added to the fixed
    point binary F code and address data codes A and V. The D extension makes the
    underlying data type a doubleword (8 bytes) rather than the default 4 bytes. Thus,
    the data type FD is fixed point binary doubleword. AD and VD are double word address
    values.


    In Table 20, several data specification types show an implied length of 1 byte.
    In other data specifications, however, there is a larger implied length. For example,
    a fixed point binary integer, type F, is normally 32 bits or 4 bytes and thus
    has an implied length of 4.


    | Type | Implied Length (bytes) | Alignment | Format |

    |---|---:|---|---|

    | C | 1 | byte | characters |

    | X | 1 | byte | hexadecimal digits |

    | B | 1 | byte | binary digits |

    | F | 4 | word | fixed point binary |

    | H | 2 | halfword | fixed point binary |

    | D | 8 | doubleword | long floating point |

    | P | 1 | byte | packed decimal |

    | Z | 1 | byte | zoned decimal |

    | A | 4 | word | address value |

    | V | 4 | word | external address value |


    *Table 20 Basic DS/DC Data Types*


    Alignment refers to the addresses at which allocated memory may be placed. Some
    data types require that the address of their first byte be evenly divisible by
    4 (word alignment), 8 (doubleword alignment) or 2 (half word alignment). This
    is for performance reasons as some memory operations execute quicker if the data
    is aligned to boundaries. Byte alignment means the item can begin on any address.


    When allocating a unit of memory using a code with a required alignment, if the
    next available byte is not of the required alignment for the data type being allocated,
    the assembler will automatically skip one or more bytes in order that the item
    be correctly aligned.


    For example, if the next address available is divisible by 2 but not 4 and you
    are allocating a full word fixed point value (type F), the assembler will skip
    two bytes before allocating your data. Normally you won''t notice this but if
    you look carefully in'
  merge: -1
  img_proc: true
- pgno: 90
  md: 'the .PRN file for the program, you will see the extra location counter increment
    necessary to achieve alignment.


    In some cases, especially where you need to know the exact number of bytes being
    used in an otherwise contiguous memory area, these extra padding bytes are important.
    Simply adding the sizes of the items allocated may not be accurate due to embedded
    padding bytes.


    If you use the DS instruction, you do not provide initialization (if you do, it
    will be ignored). If you use DC, you give the initial value that will be loaded
    into the memory location when the program begins. Initialization is normally a
    single-quoted string beginning immediately after the data type. The value in the
    string must be appropriate for the data type.


    Figure 34 gives some examples of DS and DC instructions. The first three DS instructions
    reserve 4, 2 and 8 bytes respectively. None of the data items at these labels
    is initialized and, consequently, the contents of each are undefined until the
    program stores a value in them.


    DAT4 is a double word (8 bytes). It uses the D extension to indicate that it is
    a 64 bit fixed point binary.


    Both DAT5A and DAT5B are 10 bytes but they have different attributes. DAT5A is
    one instance of a character string of length 10 while DAT5B is 10 contiguous instances
    of a character string of length 1.


    DAT6 is 120 bytes: 10 instances (duplication factor) of a character string of
    length 20. The number preceding the data type is the duplication factor.


    | Label | Instruction | Data Type | Comment |

    |---|---|---|---|

    | DAT1 | DS | F | * fullword uninitialized |

    | DAT2 | DS | H | * halfword uninitialized |

    | DAT3 | DS | D | * doubleword uninitialized |

    | DAT4 | DS | FD | * doubleword uninitialized |

    | DAT5A | DS | CL10 | * 10 bytes |

    | DAT5B | DS | 10CL1 | * 10 bytes |

    | DAT6 | DS | 10CL20 | * 120 bytes |

    | LAB1 | DC | F''123'' | * binary full word |

    | LAB2 | DC | C''Hello World'' | * character string |

    | LAB3 | DC | B''1011101010010001'' | * bit string |

    | LAB4 | DC | X''2F3C'' | * hexadecimal string |

    | LAB5 | DC | P''1234'' | * packed decimal string |

    | LAB6 | DC | F''789'' | * full word fixed |

    | * |  |  | * point binary |

    | LAB7 | DC | FD''1234'' | * doubleword fixed |'
