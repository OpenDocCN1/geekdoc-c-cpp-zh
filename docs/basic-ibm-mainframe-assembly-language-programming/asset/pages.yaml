- pgno: 80
  md: 'the second operand. With the BALR, however, if the second operand is specified
    as R0, no branch takes place.


    In both versions of the instruction, the memory address of the byte immediately
    following the BAL or BALR is placed into the register specified as the first operand.
    This is the linking operation: it stores the address where return should be made.


    These instructions were on the earliest models of the 360 architecture where addresses
    were always 24 bits. In current machines, where the registers are 64 bits in length,
    when a program is operating in 24 bit addressing mode, the 24 bit updated PSW
    instruction address is placed in the rightmost 24 bits of the first operand register
    (bits 40 through 63 of the 64 bit register), while the following fields from the
    PSW are stored in bits 32 through 39 of the register:


    +   1. The Instruction Length Code (bits 32 and 33)

    +   2. The Condition Code (bits 34 and 35)

    +   3. The Program Mask (Bits 36 through 39)


    This effectively mimics the operation of the early 24 bit address machines. The
    low order 32 bits of the 64 bit first operand register mimic a 32 bit register
    from the early architecture. In these are stored eight bits of status information
    from the PSW followed by 24 bits of address. Since early machines only used 24
    bit for addressing, the high order 8 bits were available for other uses. In this
    case, they stores information about the status of the program as the subroutine
    call was being made. This information could be used to restore the status upon
    return.


    However, in 31 bit addressing mode, bit 32 of the 64 bit first operand becomes
    one and the remaining low order 31 bits (bits 33 through 63) are loaded with the
    updated instruction address from the PSW.


    In both 24 and 31 bit addressing modes, bits 0 through 31 (the high order bits)
    of the 64 bit register specified as the first operand are unchanged.


    In 64 bit addressing mode, the full 64 bit updated address portion of the PSW
    is placed in the 64 bit register specified as the first operand.


    The main use for these instructions is to branch to a subroutine and, in the same
    operation, load a register with the address of the return point as shown in this
    example:


    ```

    L R15,=V(SUB1) * load address of subroutine

    BALR R14,R15 * branch to subroutine

    ```'
  merge: -1
  img_proc: true
