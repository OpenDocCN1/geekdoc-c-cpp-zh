  md: 'a row have been converted to zoned decimal and placed in the output, the line
    is printed. The entire process repeats for each row by means of the BCTs.


    The actual matrix multiplication takes place on lines 212 through 273. It follows
    the example in the C code on lines 202 through 210.


    Registers R2, R3 and R4 correspond to C variables i, j, and k. The code consists
    of a three nested loop as in the C code. The outermost (for C variable l) reenters
    at label L8 for each iteration which promptly initializes j and k. The loop for
    variable j reenters at label L9 for each iteration and initializes k. Label L10
    is the iteration entry point for the innermost loop, that involving k.


    The looping mechanism is in lines 262 to 272. Lines 262 through 264 increment
    R4 (C program variable k) and test if it is still less than the limit AROWS. If
    so, it reiterates.


    Likewise lines 266 through 268 and lines 270 through 272 test if R3 (C variable
    j) and R2 (C variable l) have reached their limits. The innermost loop iterates
    the most and the outermost the least, as in the C program.


    Lines 222 through 260 calculate and sum the values that contribute to each element
    of the C matrix. Lines 222 through 229 calculate the address of which element
    of matrix C we are working on and store it. Likewise lines 231 through 238 and
    lines 240 through 247 calculate the addresses in the A and B matrices, respectively.
    The addresses are calculated in the same manner as the C program except for the
    multiplications by 4. In C, address arithmetic is done in units of the underlying
    data type which in this case has a length of 4. In assembly language, we must
    adjust the values by 4 as address arithmetic is always in units of one.


    Once the addresses of the components have been calculated, lines 249 through 260
    multiply the A matrix element by the B matrix element and add the result to the
    C matrix element and store the result.


    Once the result C matrix has been calculated, it is printed (lines 284 through
    305) in the same manner as used earlier to print the A and B matrices.


    Example input and output are shown.'
