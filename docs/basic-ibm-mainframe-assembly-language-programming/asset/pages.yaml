    # 23.11 Word Count Program with List


    Next we modify the word count program to change the data base of words from an
    array to a list structure. The program is shown in Figure 93. The DSECT for this
    is:


    ```

    NODE    DSECT

    WRD     DS CL8

    FREQ    DS F

    NEXT    DS A

    ```


    As you can see, we''ve added one more item: a pointer named NEXT which is a four
    byte address. Each node now has a pointer to the next node and the last node will
    have a NULL pointer (0). The first node will be pointed to by a START pointer,
    which is initially NULL. Nodes will be allocated from the same large data array
    although dynamic memory allocation using system macros is also possible.


    The initial part of the program is the same as the previous example,


    Changes occur in lines 43 through 55 where we search the list for each newly read
    word. On line 43 the address of the first node is loaded into R6. It is checked
    for NULL and, if it is, we branch to the section that creates a new node. Otherwise,
    we compare the input word with the table entry WRD and branch to L6 if they are
    the same. If they are not equal, we load R6, the DSECT base, with the contents
    of the current node''s NEXT pointer thus advancing the base register R6 to point
    the next node. We check that the new value of R6 is not NULL on line 44. If it
    is, there are no more nodes to test and our word is not in the list.


    If we found the word in the list, we increment its count (FREQ) on lines 57 through
    59 and proceed to process the next input word.


    If we did not find the word, we allocate a new node. This is done in lines 62
    through 73. First, we load R6 with the pointer (CRNT) to the next available byte
    in our data array. The field CRNT is an address stored in memory which points
    to the next available byte in the data area TAB.'
