  md: "Now, addition could proceed correctly by summing the columns in the usual manner\
    \ and this would yield the same answer if you envision the fixed decimal point\
    \ two positions to the left of the last digit. By assuming the presence of a decimal\
    \ point at a fixed location in each number, it is possible to perform arithmetic\
    \ that is similar to floating point. The same principle involved with fixed point\
    \ calculations on calculators can be extended to packed decimal calculations as\
    \ we show next.\n\nFigure 94 gives a program which is an example of using fixed\
    \ point packed decimals to calculate PI. It is based on the Gregory-Leibniz method\
    \ which can be summarized as the series: PI/4 = 1 - 1/3 + 1/5 - 1/7 + 1/9 ...\n\
    \nthe right hand side of which, in decimal, is:\n\n1 - 0.3333 + 0.2000 - 0.1428\
    \ + 0.1111 ...\n\n```\n```c\n#include <stdio.h>\n\nint main() {\n    int i,j=3;\n\
    \    double pi = 1.0;\n    for (i=0;i<500000; i++) {\n        if (i%2==0) pi+=1.0/j;\n\
    \        else pi-=1.0/j;\n        j+=2;\n    }\n    printf(\"iterations=%d pi=%f\\\
    n\",i,4*pi);\n    return 0;\n}\n```\n```\n\n# Figure 94 Calculation of PI in C\n\
    \nA C program to accomplish this is shown in Figure 94. The final value of i is\
    \ multiplied by 4 to give PI. The formula converges very slowly so many iterations\
    \ are needed to obtain even a modest number of digits of accuracy.\n\nWhen using\
    \ floating point (double in C), the PI program is simple because the divisions\
    \ on lines 9 and 10 result in numbers with fractional parts. Thus, the calculation\
    \ of 1.0/3.0 yields 0.333333333333333 when converted to decimal and printed.\n\
    \nHowever, a packed decimal division (DP instruction) of the same values yields\
    \ 0 with a remainder of 1 which is not exactly what the formula requires. So,\
    \ the question becomes, how can you get a series of numbers such as: 0.3333, 0.2000,\
    \ 0.1428, 0.1111 and so forth?\n\nThe answer is quite simple. First, initialize\
    \ PI as a large integer packed decimal number such as 10 000 000 000."
