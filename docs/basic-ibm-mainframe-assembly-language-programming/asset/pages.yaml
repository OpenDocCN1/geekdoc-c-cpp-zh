- pgno: 52
  md: '# 6.5 Basic Explicit Operands


    The simplest form of addressing is register addressing. In an instruction, if
    an operand is in a register, you simply specify the register number. If the operand
    is in memory, you specify the base and displacement or, in the case of RX instructions,
    the base, displacement and index.


    Both operands are registers in RR format instructions (the BCR instruction in
    an exception). In RX instructions the first operand is normally register and the
    second is in memory (the BC instruction is an exception). RS instructions the
    first and third operands are registers and the second is in memory. In SS instructions,
    both operands are in memory. In SI instructions, one operand is in memory and
    one is a constant that is part of the instruction itself (the immediate operand).


    For RR examples, see Figure 5. Note that the mnemonics for RR instruction opcodes
    always end in the letter R. A mnemonic is a short sequence of letters to make
    information easier to remember.


    The first example involves the Add Register instruction, AR, as shown in see Figure
    5. The instruction adds the contents of the register specified as the second operand
    to the contents of the register specified as the first operand and leaves the
    result in the first operand.


    ```

    AR R2,R3 *Contents of R3 added to R2, result in R2

    SR R3,R4 *Contents of R4 subtracted from R3, result in R3

    LR R4,R5 *Contents of R5 copied to R4

    ```


    Figure 5 RR Examples


    In the example, you can see that register 2 is the first operand and register
    3 is the second operand so the value (contents) in register 3 will be added to
    the value (contents) in register 2 and the answer (result) will be left in register
    2.


    Note: technically, the assembler requires you to use only numbers to specify registers
    so the example should not use the letter R in the register designations. However,
    in most cases, we will assume that the macro EQUREGS has been invoked at the beginning
    of each program. This macro tells the assembler that R0 means 0, R1 means 1, and
    so forth.


    In the second example we see the Subtract Register (SR) instruction. Similar to
    the AR instruction, the SR instruction subtracts the contents of register 4 from
    the contents of register 3 and the result is placed in register 3.'
  merge: -1
  img_proc: true
- pgno: 53
  md: 'In the final example we see the LR or Load Register instruction. This instruction
    copies the contents of the second operand to the first.


    On the other hand, if an operand is in memory, you must specify it''s location
    usually by means of a base, displacement and, possibly (in RX instructions), an
    index register.


    ```

    D2(B2)       base and displacement

    D2(X2,B2)    base, index and displacement

    ```


    Figure 6 Memory Operands


    In the most fully explicit expression of a memory operand, you fill-in both the
    base register and displacement yourself (and, possibly, the index). The syntax
    for a base/displacement memory operand looks like the examples in Figure 6.


    In Figure 6, D2 is the displacement, B2 is the base register and X2 is the index
    register. The number 2 following each indicates if this is part of the second
    operand. In the example, 2 is shown as the operand number since many memory operands
    are second operands. In the original instruction set, third operands are never
    of the base displacement variety however they may be first operands.


    In the original architecture, index registers were only available in RX instructions.
    In later versions, the closely related RXE, RXF and RXY formats were added. These
    also use index registers. Often index registers are specified as R0. If R0 is
    used in an addressing context, it means no register. Note, however, that register
    R0 can be used for arithmetic and other things but it has a special meaning when
    used for addressing.


    Since the index register is seldom used, R0 is often seen in this position and
    the operand address, in effect, is calculated from the base register and displacement
    only.


    Note: in an operand where no index register is used, you could, technically, place
    the base register number in the index position and a zero in the base register
    position with no effect on the address calculated. However, in many machines this
    would result in a tiny performance reduction.


    Figure 7 gives a few examples of base/displacement addressing with and without
    index registers. In each, the value of the displacement is 1234, the base is R5
    and the index is either R6 or R0. Programmer written displacements are normally
    specified in decimal.'
