- pgno: 159
  md: '# 17.6 Multiply Packed (MP)


    In the MP instruction, the multiplier (the second operand) is multiplied by the
    multiplicand (first operand) and the result is placed in the first operand. The
    multiplier may not be longer than 15 digits and must be shorter in length than
    the multiplicand. In order to prevent an overflow from occurring, the multiplicand
    must include at least as many leading bytes of zeros as the number of bytes in
    the multiplier. If this is not the case, a data exception occurs. The Condition
    Code is unchanged.


    # 17.7 Divide Packed (DP)


    In the DP instruction, the first operand is the dividend and the second operand
    is the divisor. The results are a quotient and a remainder which will replace
    the dividend. The divisor may not be longer than 15 digits.


    The quotient occupies the leftmost bytes of the result. Its length is equal to
    the difference between the length of the dividend (L1) and the divisor (L2). The
    remainder occupies the remaining bytes of the first operand. A Decimal Divide
    exception occurs in the case of divide by zero or a quotient too large to fit
    in the digits available. The Condition Code is unchanged.


    # 17.8 EDIT (ED)


    Although there is an Unpack instruction (UNPK), the ED instruction is the preferred
    way to a convert packed decimal number to a zoned decimal, printable string. The
    first operand is a set of pattern codes that control the formatting process and
    the second operand is the packed number to be converted. The result replaces the
    first operand.


    The first byte of the first operand pattern is called the fill byte. It will be
    placed in the leading bytes of the result in place of non-significant leading
    zeros.


    Following the fill byte are a collection of pattern bytes and message bytes.


    When the instruction begins the significance indicator is off. It stays off until
    a significant digit (i.e., non-zero) is encountered or turned on by a pattern
    byte. When the significance indicator is off, zeros in the source are replaced
    by the fill byte. If the significance indicator is on, the source digit appears
    in the result even if it is zero.


    There are two main pattern bytes: 20₁₆ and 21₁₆. The first is called the digit
    selector. If encountered in the format, the next digit in the source field is
    selected. If the source digit is zero and the significance indicator is off, the
    fill byte replaces the digit'
  merge: -1
  img_proc: true
- pgno: 160
  md: 'selector. If the digit is non-zero or the significance indicator is on, the
    digit is converted to zoned decimal and replaces the digit selector. If a non-zero
    digit is selected, the significance indicator is turned on if not already on.


    The pattern code 21₁₆ is called the significance starter. It acts like the 20₁₆
    above except it turns the significance indicator on if not already on. Turning
    the significance indicator on affects the next digit, not the current digit.


    Other characters in the pattern, such as commas and decimal points are only displayed
    if the significance indicator is on. Otherwise, they are replaced by the fill
    byte.


    When the last digit of a number is selected, the sign is examined. If the sign
    is positive (CAFE), the significance indicator is turned off. If the sign is negative,
    it remains on or is turned on. The effect of this is to leave or replace trailing
    characters in the format. For example, the final characters in the format could
    be (DB) indicating a debit or negative balance. The (DB) will be replaced by the
    fill byte if the number is positive but remain in the result if the number is
    negative. (Note: you often see this in bank statements where a negative value
    is indicated at the end of the number). For example, the pattern (extra spaces
    added for readability):


    ```

    40 20 20 20 6B 20 20 20 6B 20 21 20 4B 20 20 4D C4 C2 5D

    ```


    40₁₆ is a blank. 6B₁₆ is a comma while 4B₁₆ is a decimal point. 4D₁₆ is an open
    parenthesis and 4D₁₆ is a close parenthesis. C4₁₆ is the letter D and C2₁₆ is
    the letter B.


    The fill character is blank. Until a nonzero character is encountered, blanks
    replace the selector bytes and the commas. However, just prior to the decimal
    point the significance indicator is forced on if not already on. This means that
    a zero immediately prior to the decimal point will be printed as well as the decimal
    point. The (DB) will be printed if the number is negative and converted to blanks
    if the number is positive. For example:


    | Hex | | Result |

    |---|---|---|

    | 00 00 00 00 00 0C | becomes | 0.00 |

    | 00 00 00 00 00 0D | becomes | 0.00 (DB) |

    | 00 00 00 10 00 0C | becomes | 1.00 |

    | 00 00 01 00 00 0C | becomes | 1,000.00 |

    | 00 10 00 00 00 0D | becomes | 1,000,000.00 (DB) |'
