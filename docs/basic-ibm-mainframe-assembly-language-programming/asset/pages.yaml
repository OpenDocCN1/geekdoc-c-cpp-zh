- pgno: 186
  md: '# 20. Debugging (XDUMP, SNAP)


    A dump is a snapshot, usually in hexadecimal, of the contents of memory, the registers,
    the PSW and other information relating to the state of the machine at a given
    instant. The memory area shown by the dump can either be that of a currently running
    program or larger. In the early days of computing, dumps were produced on paper
    and could run to thousands of pages. Now they are written to a file.


    A dump is ordinarily produced when a program encounters a run time exception or
    interrupt. Alternatively, a programmer can explicitly request a dump with either
    the ASSIST XDUMP macro or the system macro SNAP.


    In the case of a dump resulting from an error, the program terminates. When a
    programmer requests a dump, it is usually for diagnostic reasons and the program
    may or may not terminate, at the programmer''s option.


    For example, if the program from Figure 47 were modified to include the XDUMP
    as shown in Figure 71, the result is the text shown in Figure 72 (long lines truncated).


    The contents of a dump consist of one or more of the following:


    +   1. The contents of the 16 64-bit general purpose registers R0 through RF (R0
    through R15);

    +   2. The contents of the 16 64-bit floating point registers F0 through FF (F0
    through F15);

    +   3. The contents of memory beginning at location 00000000₁₆ through location
    000FFFFF₁₆.

    +   4. The PSW.

    +   5. A save area trace back.


    The contents of the general purpose and floating point registers are displayed
    as 16 hexadecimal digits (corresponding to 8 bytes). Normally, there are four
    registers displayed per line. For example, the first line for the general purpose
    registers displays R0, R1, R2 and R3 while the last line displays the contents
    of registers RC (R12), RD (R13), RE (R14) and RF (R15). A similar pattern is shown
    for the floating point registers (F0 through FF).


    The z390 emulator pre-initializes each byte of each register to F4₁₆, thus the
    high order 32 bits of the registers may be F4₁₆ if the program only uses 32 bit
    instructions. The low order 32 bits of a register will be F4₁₆ unless the register
    was used in the course of the program.'
  merge: -1
  img_proc: true
- pgno: 187
  md: '# 20.1 XDUMP


    XDUMP is part of the ASSIST package. It dumps the general purpose and floating
    point registers and either all or a portion of the user memory area. The entire
    user memory area is written if the XDUMP macro has no arguments while a limited
    area is written if the user specifies two operands giving the start and length
    of the memory area to dump. In both cases, the contents of the registers are displayed.
    In the z390 emulator output appears on the user''s console and is also written
    to the .LOG file for the program. The length, if present, consists of a constant
    or a register surrounded by parentheses.


    ```

    XDUMP * REGS AND ALL MEMORY WRITTEN

    XDUMP BEGIN,LENGTH * REGS & SOME MEMORY WRITTEN

    ```


    # 20.2 SNAP


    SNAP is a system macro generally available on most systems. It is similar to the
    XDUMP macro but has additional optional operand options:


    +   1. ID= is optional. If given, the number provided after the equals sign will
    appear in the written output to identify which SNAP in the program wrote same.

    +   2. PDATA=(...) indicates optional items to display in a comma list. Some of
    these are:

    +      2.1. REGS - all registers displayed;

    +      2.2. GPR - only the general purpose registers displayed;

    +      2.3. FPR - only the floating point registers displayed;

    +      2.4. CB - all control blocks;

    +      2.5. DCB - DDNAME, DCB, AND DSNAME''S

    +   3. STORAGE=(BEGIN,END) where BEGIN and END are the addresses of the starting
    and ending points of the memory area to be displayed (usually labels).

    +   4. ID=nbr - a programmer supplied number that identifies the SNAP output.


    Example:


    ```

    SNAP PDATA=(GPR),STORAGE=(LAB1,LAB2)

    ```'
  merge: -1
  img_proc: true
- pgno: 188
  md: '# 20.3 Dump Format


    The format of the output of both the SNAP and XDUMP are similar. The program in
    Figure 71 produced the XDUMP shown in Figure 72.


    In Figure 71 we initially see the 16 general purpose registers R0 through RF (register
    identifiers are in hexadecimal), four 8 byte registers per line. Next, you will
    see the 16 floating point registers designated as F0 through FF. Note that the
    z390 emulator initializes all registers to F4₁₆ by default. This would not be
    the case in a real system.


    Next we see the contents of memory shown in rows of 32 hexadecimal digits grouped
    into four fields of 8 digits each. Each group of 8 digits corresponds to one word
    (4 bytes) of memory. They are separated from one another by a blank to improve
    readability. Each line, therefore, displays 16 bytes of memory.


    At the beginning of each row is the address of the first byte in the row. On the
    right hand side is an attempted conversion of each byte in the row to a printable
    character. Where there is no printable character for a byte code, a period is
    printed. Where the byte code has a printable equivalent, it is shown. In most
    cases, the printable equivalents are not meaningful.


    Thus, the following line:


    ```

    00002600 *F0F61F1 F461F1F0 00000000 0000000* *09/14/10.........*

    ```


    means that it is the dump of the 16 memory locations beginning at 2600₁₆ through
    260F₁₆ inclusive (16 bytes of data). Because each line has 10₁₆ (16₁₀) bytes of
    data, the address on the next line will be incremented by 10₁₆.


