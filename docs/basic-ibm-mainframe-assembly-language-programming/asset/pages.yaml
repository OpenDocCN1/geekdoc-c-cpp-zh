  md: 'implementation only the low order 32 bits of the general purpose registers
    participate. The high order bits are unchanged. The low order portions of both
    registers are treated as one 64 bit signed binary integer with the high order
    part of the number in the even register. There is no halfword divide instruction.


    | OpCode | Type | 1st Operand | 2nd Operand | Result |

    |---|---|---|---|---|

    | D | RX | 32 bit register | 32 bit memory | 32 bit register |

    | DR | RR | 32 bit register | 32 bit register | 32 bit register |

    | DSGR | RRE | 64 bit register | 64 bit register | 64 bit register |

    | DSGFR | RRE | 64 bit register | 32 bit memory | 64 bit register |

    | DSG | RXY | 64 bit register | 32 bit memory | 64 bit register |

    | DSGF | RXY | 64 bit register | 64 bit memory | 64 bit register |


    # Table 30 Signed Divide Instructions


    The divisor is a 32 bit signed number located in the register specified as the
    second operand (DR) or at the memory location specified by the second operand
    address.


    | OpCode | Type | 1st Operand | 2nd Operand | Result |

    |---|---|---|---|---|

    | DL | RXY | 32 bit register | 32 bit memory | 64 bit register |

    | DLR | RXE | 32 bit register | 32 bit register | 64 bit register |

    | DLGR | RXE | 64 bit register | 64 bit register | 128 bit register |

    | DLG | RXY | 64 bit register | 64 bit memory | 128 bit register |


    # Table 31 Unsigned Divide Instructions


    The result consists of a remainder located in the even register of the first operand
    and the quotient located in the odd register. The sign of the quotient is determined
    by the rules of algebra and the remainder has the same sign as the dividend except
    that zero is always positive. A divide by zero will raise a fixed-point divide
    exception if enabled . The condition code is unchanged.


    For example, if location VAR1 contains the 32 bit number 10, and location VAR2
    contains the 32 bit number 3, you can divide the value at VAR1 by the value at
    VAR2 with the following:


    ```

    L R2,VAR1

    SRDA R2,32

    D R2,VAR2

    ```


    The results will be 1 in R2 (the remainder) and 3 in R3 (the quotient).


    Only the low order 32 bits of the even/odd registers participate in the D and
    DR instructions and they are treated as a single 64 bit number.'
