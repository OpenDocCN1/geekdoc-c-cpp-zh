  md: '# 21. System Input/Output Macros


    Operating system provided input/output macros will vary according the operating
    system and data access method. The IBM architecture has many legacy access methods.
    Among these are:


    +   1. VSAM - Virtual Storage Access Method

    +   2. BISAM/QISAM - Basic and Queued Indexed Sequential access Method

    +   3. BPAM - Basic Partitioned Access Method

    +   4. BDAM - Basic Direct Access Method

    +   5. BSAM/QSAM - Basic/Queued Sequential Access Method


    Common to all methods is the concept of the Data Control Block (DCB) created by
    a macro of the same name which establishes a table of data concerning the data
    set (file) to be accessed. Anther table building macro is the Data Event Control
    Block (DECB) used, depending on the access method, to synchronize asynchronous
    I/O.


    # 21.1 Console Input/Output


    In addition to the access methods listed above, there are also macros for console
    input/output. These were designed to permit programs to communicate directly with
    the system operator at the system console.


    You may read and write directly to the console (in the z390 emulator, the console
    is your screen) using the WTO and WTOR macros. Here we demonstrate the WTO and
    WTOR macros which are normally available in the IBM assembler.


    The WTO macro can be used to write a constant string to the console (your command
    prompt window in the emulator) or it can be used to write a memory resident string.
    The simplest form is:

    WTO ''STRING TO BE WRITTEN''

    The above will write the contents within the quote marks (up to 119 characters)
    to the console window. Alternatively, you can write a string stored in memory
    to the console with:

    WTO MF=(E,MSG)

    where MSG refers to a data area such as the following:

    MSG DC AL2(MSGEND-*,0)'
  merge: -1
  img_proc: true
- pgno: 194
  md: '```

    MSG1 DS CL20

    MSGEND EQU *

    ```


    The first line, MSG, consists of 2 half words. The first halfword contains the
    length of the string to be written (including the half words themselves). The
    second halfword contains a zero. This is then followed by the data area containing
    the string to be written, in this case a string of length 20 whose contents will
    be set from somewhere else in the program.


    The symbol MSGEND has as its value the location counter of point in your program
    where the symbol occurs. This value is used in the line with label MSG. The value
    of the first half word at MSG is the difference between the location counter value
    for MSG and the location counter value after MSG1. Remember, * means the current
    location counter value as was seen with USING so MSGEND-* is the difference or,
    in this case, the length, of the message including the initial halfwords.


    ```

    1        PRINT       NOGEN

    2                 EQUEREGS

    3 WTO    SUBENTRY

    4

    5                 WTO        ''CONSOLE READ/WRITE''

    6

    7                 WTOR       ''ENTER A STRING'',STRING,20,EV

    8                 WAIT       ECB=EV      * PAUSE

    9                 WTO        MF=(E,MSG)

    10

    11                SUBEXIT

    12

    13 MSG    DC          AL2(STREND-*,0),C''YOU TYPED ''

    14 STRING DS          CL20

    15 STREND EQU         *

    16

    17 EV     DC          F''0''    * ECB

    18

    19                 END        WTO

    ```


    # Figure 73 Console I/O


    WTOR is a related macro which both writes a message and receives a reply. Its
    parameters are the message to be written, an area in memory to receive a reply,
    an optional input length, and an event control block (ECB) (A full word in memory
    initially set to zero). If the input length is omitted, it will be determined
    from the implied length of the area to receive the input. The macro is followed
    by a line with the WAIT macro with the ECB from the WTOR. This pauses the program
    until a reply has been entered.'
