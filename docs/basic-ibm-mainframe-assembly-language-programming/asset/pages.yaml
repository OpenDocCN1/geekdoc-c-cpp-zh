  md: 'When we write in a high level language, a compiler translates each line of
    code into one or more (usually more) machine instructions. However, the instructions
    generated by the compiler might not always be optimal: there may be faster and
    shorter ways to accomplish the same task. In many cases, in assembly language
    we are able to write a program more efficiently. Generally speaking, high level
    languages increase programmer productivity but low level languages can increase
    program efficiency.


    The output of the assembler (or a compiler, for that matter) is a binary object
    module which is a memory image of the program''s instructions and data. While
    this module is nearly executable, it usually still needs subroutines to be included
    from as well as resolution of subroutine addresses. To build a final, executable
    module we employ a program known as the link editor or linking loader which adds
    needed library routines and fills in any subroutine addresses. The result is then
    either written to disk as an executable module or loaded it directly into memory
    for immediate execution subject to some final adjustments.


    A macro assembler is an assembler where the assembly language source code is initially
    read by a macro pre-processor. Entries in the source code cause the pre-processor
    to insert source code modules from a disk library of macros (not to be confused
    with binary object modules included by the link editor). The pre-processor may
    also modify and generate source code based on macro language commands. The modified
    source code is then passed to the assembler. The IBM macro pre-processor, as is
    the case with most others, has a language of its own and is briefly touched upon
    in this text. Macros allow us to create small code packages for frequently done
    tasks and store them for reuse.


    # 4.3 Overview of Assembly Language Statements


    Assembly language statements break down into four classes:


    +   1. Instruction statements These are statements, one per line, which are to
    be translated into machine language for execution at run time. Each specifies
    an operation to be executed and the data to be used. All instructions have one
    or more operands. All instruction statements result in binary code being added
    to the program image.

    +   2. Data Definition Instructions (DS/DC). These are statements that tell the
    assembler to reserve memory in the run time program image for data. The data area
    may be uninitialized (DS statements - declare storage) or initialized (DC statements
    - declare constant).

    +   3. Assembler directives These are statements that inform the assembler of
    some situation or direct the assembler to take some action. While these statements
    may affect the way in'
