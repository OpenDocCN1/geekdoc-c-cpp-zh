  md: '# 15. Store Instructions


    In this section we discuss the basic store instructions. The complete list of
    Store instructions is given in Table 33.


    # 15.1 Store (ST)


    The store instruction stores the 32 bit contents of a register to a word in memory.
    It is an RX instruction. The memory address should be a word boundary. The Condition
    Code is unchanged. ST is of format RX.


    ```

    ST R1,D2(X2,B2)

    ```


    # 15.2 Store Multiple (STM)


    One or more general purpose registers are stored to consecutive words beginning
    at the memory address specified as the second operand. The Condition Code is unchanged.
    The STM is of format RS. The registers to be stored begin with the register specified
    as the first operand through and including the register specified as the third
    operand. If the register specified as the first operand is greater than the register
    specified as the third operand, wrap around occurs. If the first and third operands
    both specify the same register, only 4 bytes are stored. Examples:


    ```

    STM R1,R5,L1  * R1,R2,R3,R4 and R5 are stored

    ```


    ```

    STM R6,R4,L2  * R6,R7, ... R15, R0,R1, ... R4 stored

    ```'
  merge: -1
