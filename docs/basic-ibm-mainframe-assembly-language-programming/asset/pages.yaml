    # 5.5 Quick Overview of Assembly Language Programming


    As we have seen, assembly language programs consist of sequences instructions
    that operate on data. In a program, an instruction is written as one or more letters
    that are an abbreviation or other indicator of the instruction''s name or function.
    These are referred to as mnemonics.


    Each instruction in a program has one or more operands which designate the data
    on which the instructions operate. The operands specify the location of the data
    which can be in constants, registers, memory or all three.


    Typical instructions involve mathematical operations (add subtract, multiply,
    divide), logical operations on bits (AND, OR, Exclusive OR, etc.), data movement,
    and comparisons (is A greater than B?), and branch instructions (GOTOs).


    In the IBM architecture, most instructions have two operands and the result of
    an operation is usually placed in the first operand. The second operand, in most
    cases, is unchanged.


    In some instructions, both operands are in registers, in others the first operand
    is a register and the second is in memory and, in a few instructions, both operands
    are in memory. While most instructions have two operands, some have more. In some
    instructions, one or more operands are constants contained in the instruction
    itself.


    Also, there are instructions to initiate and control input/output. These are normally
    only executed by operating system.'
  merge: -1
  img_proc: true
