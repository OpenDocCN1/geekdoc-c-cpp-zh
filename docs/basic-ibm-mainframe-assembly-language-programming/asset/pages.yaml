  md: '```

    1 0101 1010

    ```


    The extra bit on the left is an overflow. The answer is not zero and this is a
    problem. To do arithmetic on sign and magnitude you need even more specialized
    hardware to take into account all the possible combinations of positive and negative
    operands.


    A second possible solution is called 1s complement. In 1s complement we form the
    negative of a number by inverting (complementing) the bits. This, 109 and -109
    appear as:


    ```

    0110 1101    109

    1001 0010    -109

    ```


    As it turns out, in this format all negative numbers have a leading one bit so
    that position is still called the sign but the remainder of the number is quite
    different. Does this work? It solves the arithmetic problem when we add +109 to
    -109:


    ```

    0110 1101

    + 1001 0010

    ---------

    1111 1111

    ```


    And the answer is zero. Yes, 1111 1111 is zero because 1s complement also has
    two zeros:


    ```

    0000 0000    positive zero

    1111 1111    negative zero

    ```


    So, we still have the problem of two zero values but there is a solution: 2s complement.


    A 2s complement number is formed by adding one to the 1s complement. Thus 109
    becomes negative in the following way:


    ```

    0110 1101    +109

    1001 0010    1s complement

    1001 0011    2s complement

    ```


    How does this solve the two zeros problem:


    ```

    0000 0000    zero

    1111 1111    1s complement

    0000 0000    2s complement (overflow ignored)

    ```


    In other words, if you try to create a negative zero, you get the original zero
    again. There is only one zero! Can we do arithmetic? Yes. Here we add +109 and
    -109:'
