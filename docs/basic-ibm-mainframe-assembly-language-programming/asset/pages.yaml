- pgno: 152
  md: 'However, in the original architecture, there are cases where modification of
    the code image was desirable. For example, take the case of the length byte in
    an MVC instruction. To achieve a variable length move you could modify the MVC''s
    length attribute with a Store Character instruction and then execute the MVC however
    this would render the program non-reentrant.


    In an environment where the code for a program is shared among several users where
    each user has their own data areas but the actual executable code image is shared,
    you could have a situation where one user modifies an MVC but another user executed
    it. For example, user 1 modifies an MVC to a length of 10. User 1 is interrupted
    by the operating system. User 2 eventually next gets control. User 2 modifies
    the same MVC to a length of 20. User 2 is interrupted. User 1 gets control and
    executes the MVC which now has a 20 in it and not 10.


    The purpose of the Execute instruction is to permit programs to make such modifications
    remain reentrant. The Execute instruction, in one, uninterruptible operation,
    makes a copy of an instruction, modifies it and executes it. The actual original
    instruction in memory is unchanged.


    The EX instruction is an RX instruction. The first operand is a register whose
    low order byte contains information that will be used to modify the copy of the
    instruction to be executed. The second operand is the address of the instruction
    to be executed. The EX works as follows:


    +   1. a copy of the instruction at the address specified as the second operand
    is made;

    +   2. the low order byte of the register specified as the second operand is or''ed
    with the second byte of the copy of the instruction to be executed;

    +   3. the copy of the instruction with the modified second byte is executed.


    In all SS instructions the second byte is the length byte. In several, such as
    the MVC and CLC, the length is the entire byte. In others, such as AP, SP, MP,
    DP and so forth, the byte is divided into 2 four bit fields the first of which
    is the length of the first operand and the second the length of the second operand.
    In SI instructions, the second byte is the immediate operand. The EX is normally
    used in connection with SS and SI instructions.


    Instructions to be executed by the EX instruction are ordinarily placed in a data
    area of your program as they are not directly executed. The EX instruction appears
    in the code where the instruction to be executed would have appeared.'
  merge: -1
  img_proc: true
- pgno: 153
  md: 'Note that rather than simply replacing the second byte, the EX or''s the low
    byte of the register with the instruction byte. In cases where the instruction
    to be executed was coded with a second byte all of whose bits are zero, this results,
    in effect, in replacement.


    However, consider the situation where the first operand of an AP with a base register
    of has a fixed length, say 10, but the second operand has a variable length. By
    coding the first half of the instruction length byte with 9 (machine language
    length values are always 1 less than the real length) and coding the second 4
    bit field as all zeros, it is possible to modify only the second field. In this
    situation, in the register designated as the first operand of the EX, the low
    order byte of the register will have all zeros in its high four bits and the length
    for the second operand in the low four bits. When the EX executes, the high four
    bits from the low byte of the register will leave the first operand length unchanged
    but the second operand length will become the low four bits from the register.
    For example:


    +   1. R5 contains 00 00 00 05₁₆.

    +   2. The instruction is: FA 90 D0 20 D0 40 which in assembly language is: AP
    32(9,R13),64(0,R13)

    +   3. The AP instruction is located at label APL.

    +   4. The EX is: EX R5,APL

    +   5. The result to be executed is: FA 95 D0 20 D0 40


    The 05₁₆ was or''ed with 90₁₆ yielding 95₁₆ as the effective length byte.'
  merge: -1
  img_proc: true
- pgno: 154
  md: '# 17. Decimal Arithmetic


    The decimal instruction set consists of those instructions that operate on or
    support packed decimal (also known as BCD or binary coded decimal) data.


    # 17.1 Zoned and Packed Decimal


    Arithmetic on an IBM mainframe can be carried out in fixed point binary integer,
    packed decimal and floating point modes.


    Initially, when numbers are read as character (EBCDIC) input (when using the z390
    emulator, ASCII input is automatically converted to EBCDIC by the emulator,),
    they are in what is called zoned decimal format where the high order 4 bits of
    each byte contain a hexadecimal F16 called the zone and the low order 4 bits (called
    the digit) are the value of the character number in binary (0 through 9). For
    example, the internal hexadecimal EBCDIC for the printable number 1234 is:


    ```

    F1 F2 F3 F416

    ```


    Arithmetic may not be performed on character representations of numbers. Instead,
    they must be converted to one of the numeric types: packed decimal, fixed point
    binary or floating point. Of these, conversion to packed decimal is the easiest.


    A packed decimal number is a string of one or more bytes containing, in each half
    byte, a value (in binary) from 0 to 9 except for the last half byte. The last
    half byte contains the sign of the number. The hex codes C,A,F, and E mean the
    number is positive (CAFE) and the codes D and B mean it''s negative (DB). Thus,
    the zoned decimal number 1234 (F1 F2 F3 F416) in packed format would be:


    ```

    01 23 4F16

    ```


    In this format the zones have been eliminated and a sign appended. All packed
    decimal numbers occupy an integral number of bytes in memory. A leading zero is
    prepended as necessary.


    Packed decimal numbers can be up to 16 bytes long and, therefore, can represent
    numbers up to 31 digits (2 digits per byte except for the last byte which has
    one digit and the sign). Packed decimal is especially useful for business applications
    where many digits of accuracy are required.


    # 17.2 The PACK Instruction


    The PACK instruction is used to convert from printable, zoned decimal character
    strings to packed decimal. As noted above, all'
  merge: -1
  img_proc: true
- pgno: 155
  md: 'zoned numeric characters have the same value of F₁₆ for their zone (the high
    order 4 bits of each character). The low order portion of all zoned numeric characters
    (called the numeric part of a byte) is a 4 bit binary number whose value is between
    zero and nine. The PACK instruction, when applied to a string of zoned numbers,
    removes the zones from all bytes except the last and packs two numerics per byte.
    In the last byte (possibly the only byte), it swaps the numeric and zoned fields.
    The result is padded with leading zeros as needed to make an integral number of
    bytes. This is illustrated in Figure 57.


    ![](img/4b7e9c58cac527296b19b501116daeb1_155_0.png)


    Figure 57 1234 in Zoned & Packed


    In a PACK instruction, both operands are located in memory. The operands are processed
    one byte at a time from left to right. The second operand is the source and the
    result replaces the first operand. The Condition Code is unchanged.


    Bytes from left to right of the source are read, the zone is removed and the digit
    portion stored in the next available half byte moving to the right in the target.
    The source and target may be of different lengths but the target must be long
    enough to hold the answer. If the source field is short and the target field long,
    the target will be padded to the left with leading zeros as needed.


    The final byte of the source, however, is treated differently. In this case, the
    zone and digit parts of the source byte are reversed and placed in the last (rightmost)
    byte of the target. This always results in an F₁₆ code in the sign position. Since
    F₁₆ is one of the positive sign indicators in packed format, all numbers are initially
    positive until altered by the program. The positive sign can be changed to negative
    by executing an And Immediate instruction on the low order (rightmost) byte of
    the packed result with an immediate byte (mask) of X''F0''. This will preserve
    the high order four bits and alter the low order F₁₆ to D₁₆ thus making the number
    negative.'
  merge: -1
  img_proc: true
- pgno: 156
  md: 'Once a number is in packed format, you may do arithmetic on it. While packed
    or decimal arithmetic is slower than binary arithmetic, it can handle more digits
    of accuracy and it does not need any further conversion.


    # 17.3 Converting Packed Decimal to Binary


    To convert a number from zoned decimal to fixed point binary you first must pack
    the number (PACK is very fast), then perform a Convert to Binary instruction.
    In the original architecture, this was performed by the CVB instruction which
    converts a packed number to a 32 bit signed fixed point binary integer leaving
    the result in a register.


    More recently, the similar CVBY instruction has been added which differs from
    the CVB in that it uses signed long displacements. Also added is the CVBG which
    likewise uses signed long displacements but the result occupies 64 bits. For the
    CVB and CVBY instructions, the second operand is an 8 byte packed decimal field,
    while, for the CVBG, the second operand is a 16 byte packed decimal field.


    The reverse, converting binary to packed, is done by the Convert to Decimal CVD
    instruction which uses a signed 32 bit source register. Also available are the
    CVDY and CVDG instructions which use long signed displacements and, in the case
    of the CVDG, the source is a 64 bit register. The instructions write either an
    8 or 16 byte signed packed decimal number to memory for 32 and 64 bit register
    source operands respectively.


    # 17.4 Decimal Instruction Set


    The basic set of packed decimal arithmetic instructions are shown in Figure 58.


    | Code | Description |

    |------|-------------|

    | AP | Add Packed |

    | CP | Compare Packed |

    | DP | Divide Packed |

    | ED | Edit |

    | EDMK | Edit and Mark |

    | MP | Multiply Packed |

    | SP | Subtract Packed |

    | SRP | Shift and Round Packed |

    | TP | Test Packed |

    | ZAP | Zero and Add Packed |


    Figure 58 Decimal Instructions


    The example in Figure 59 illustrates some basic packed arithmetic operations.
    It reads in a set of numbers in zoned'
  merge: -1
