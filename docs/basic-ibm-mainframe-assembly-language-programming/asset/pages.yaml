- pgno: 183
  md: '# 19.3.2 System Stack Based Linkage


    The original IBM 360 included neither hardware stack support nor separate instruction
    and data address spaces. In more recent versions, these have been added to some
    extent.


    The Linkage Stack, introduced in 1989, is a system provided means to save registers
    and other system state information. The instructions that use the Linkage Stack
    are shown in Figure 69.


    The Linkage Stack must be used for AR (access register) Address Space Control
    (ASC) programs. In primary mode, the CPU uses the general purpose registers to
    calculate an address while in AR mode, the contents of access registers as well
    as the general purpose registers are used. This text deals only with primary ASC
    mode programming. AR Mode is for multiple address spaces. It is optional for non-AR
    (primary) ASC programs.


    When the Branch and Stack (BAKR) and Program Call (PC) instructions execute, they
    save the required registers and status on the system stack. When the Program Return
    (PR) is executed, it restores the registers and status. The BAKR, among other
    things, stores general purpose registers 2 through 14 while the PR instruction
    restores them and branches to the return address.


    | Instruction | Mnemonic | Type |

    |---|---|---|

    | Branch and Stack | BAKR | RSE |

    | Extract Stacked Registers | EREG/EREGG | RRE |

    | Extract Stacked State | ESTA | RRE |

    | Modify Stacked State | MSTA | RRE |

    | Program Call | PC | S |

    | Program Return | PR | E |

    | Test Access | TAR | RRE |


    Figure 69 Stack Linkage Instructions


    # 19.3.2.1 System Stack Linkage Example


    Figure 70 shows the factorial program calculated using the system stack. The instructions
    used access the stack are Branch and Stack Register (BAKR) and Program Return
    (PR).


    The BAKR instruction stores the general purpose registers and access registers
    (used to access alternate virtual memory data spaces when the program is in AR
    mode) on the linkage stack. The first operand contains the return address. A branch
    is made to the second operand unless it is zero.


    The PR instruction restores the calling program''s access registers and general
    purpose registers 2 - 14, removes the entry from the linkage stack, and returns
    control to the calling program. Note that only general purpose and access registers
    2 through 14 are restored.'
  merge: -1
  img_proc: true
