    \nFigure 56 Input Lines\n\n# 13.2.2 Translate\n\nThe translate instruction (TR)\
    \ has characteristics that are similar to the TRT. It has a source string, the\
    \ first operand, and it has a 256 byte table addressed as the second operand.\
