  md: 'The assembler when it sees NAME codes the address as the first byte of FIRST
    (NAME takes no space and thus shares the same memory address as FIRST) but it
    takes the length from the length attribute of NAME which is 75.


    Another related usage would be mapping individual constituent bytes of a larger
    data item with smaller labeled items.


    For example, the four bytes of a fixed point binary field in memory could be individually
    addressed by name. In Figure 37, the label VAR, once again, takes no storage for
    itself however the four individual character data items following it do allocate
    the required 4 bytes. Thus, a Load or Store instruction on VAR would load or store
    4 bytes however each individual byte could be manipulated by name with the labels
    V1, V2, V3 or V3 (for example, in calculating a hash function).


    ```

    VAR DS 0F

    V1 DS C

    V2 DS C

    V3 DS C

    V4 DS C

    ```


    Figure 37 Data Mapping


    Note that the declaration of VAR in Figure 37 may result in a change in the location
    counter in order to achieve alignment. This will happen if the next byte in the
    program is not on the correct memory boundary. In this case, he memory address
    must be evenly divisible by four. The assembler will skip up to three bytes in
    order that the label VAR is on a full word boundary. In fact, it is not uncommon
    in code to see DS statements, possibly unlabeled, with zero repetitions of aligned
    data types such as H, F and D in order to achieve boundary alignment alone. See
    Table 20 Basic DS/DC Data Types.


    In another example, you might have two data sets (files) on disk. One of these
    is an index file and contains fixed length records each of which consists of two
    pointers and a name record. The other is a data file containing information on
    the person named.


    Each record contains a person''s name (first, middle and last) and a pointer to
    their data record in the other file. It also contains a pointer to the next index
    record in the index file. The index file is maintained on disk as a list structure
    so as to make it easy to keep it alphabetized when new names are added. The disk
    pointers are 32 bit unsigned numbers which give the relative record number of
    the record to which they are point.


    The data declarations are shown in Figure 38. The name of the entire index file
    entry is INDEX. Its components include two pointers, one to the next index record
    (IPTR) and the'
