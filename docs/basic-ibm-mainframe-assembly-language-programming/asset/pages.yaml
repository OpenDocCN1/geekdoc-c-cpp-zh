  md: '# 22. Macros


    Macros are code fragments stored in a library that are processed and inserted
    into your program when you reference them. When placed in your program, internal
    macro statements may tailor the macro to your particular needs. Macros are serviced
    by a pre-processor which reads your program and scans for any macro references
    before the program is passed to the assembler. The macro pre-processor has its
    own language which is used to tailor the macro code to your needs. The macro language,
    distinct from the host assembly language, includes variables, data types, IF statements,
    GOTOs and so forth.


    While macro pre-processors are nearly universally available in assembly languages,
    they are also widely used in many high level languages such as PL/I, C/C++ and
    others. The GNU M4 macro pre-processor is generic and used in many applications.
    This chapter presents an overview of the IBM assembly language macro pre-processor
    language along with examples.


    To the casual observer, macros in an assembly language program look like ordinary
    instructions. They have an optional label, an opcode (the name of the macro) and
    zero or more operands.


    When you assemble your program it is first read by the macro pre-processor. The
    output of the pre-processor is submitted to the actual assembler. While reading
    your program, when the pre-processor encounters an opcode that is not a machine
    instruction opcode or assembly language directive, it checks the macro library
    to see if there is a macro with the same name. If there is, it inserts it into
    your program at the place where the reference occurred. The source program label
    and operands on the macro reference, if any, are made available to the macro.
    These will be used as labels, operands and parameters in the process of macro
    expansion.


    During macro expansion, the pre-processor examines each line of code in the macro.
    If a line contains no pre-processor code, the line is normally copied to the output
    file which will ultimately be seen by the assembler. Any macro language statements
    found in a line of code will be processed and the resulting modified or generated
    code is inserted into the output file.


    # 22.1 ADD Macro


    By way of example we start with a very simple macro to add the contents of two
    user specified registers and place the result in a third. The macro is shown in
    Figure 75. The key features of any macro are:'
  merge: -1
  img_proc: true
