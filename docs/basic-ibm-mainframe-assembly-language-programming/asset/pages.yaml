  md: '# 3. store the result to memory at label K


    Assume all values are 32 bit (4 byte) signed, fixed point binary values. Assume
    that your program is using R13 as its base register. Assume that label I is 400₁₀
    bytes from the start of the program, label J is 404₁₀ bytes from the start, and
    label K is 408₁₀ bytes from the beginning. Figure 8 gives a code fragment for
    this (other parts of the program have been omitted).


    ```

    1  L       R7,I

    2  A       R7,J

    3  ST      R7,K

    ... ...

    4  I DC    F''10''

    5  J DC    F''20''

    6  K DS

    ```


    Figure 8 Symbolic Addressing


    The first instruction is the RX form of the Load instruction. It loads the 32
    bit value from the address specified by the second operand label (I) into the
    register specified as the first operand. Thus, the four byte value from memory
    at I is loaded into register 7.


    When the assembler encounters the Load instruction, it scans and parses its operands.
    The first operand, R7, is simple. However, the second operand, I, is more complex.


    The assembler finds label I in the program. Then it calculates how many bytes
    from the beginning of the program the label is located at. For this example, let
    us say that I is at offset 400₁₀ from the beginning of the program. Next the assembler
    calculates the relative offset of label I from the base register (SUBENTRY only
    establishes one base register: R13).


    The macro SUBENTRY establishes R13 as your base register and initializes it to
    point to byte 8 of your program. Note: R13 does not point at the beginning of
    your program but 8 bytes into it!


    So, given R13 that the base register is pointing at byte 8 and that the label
    I is located at location 400₁₀ from the actual start of your program, the assembler
    will generate the explicit code:


    ```

    L R7,392(R0,R13)

    ```


    The displacement is calculated relative to the base register, not the start of
    the program. While your label is 400₁₀ bytes from the start of the program, it
    is only 392₁₀ bytes from the value in the base register. Hence, the displacement
    is 392₁₀.'
