- pgno: 18
  md: '# 2. Quick Overview of Numbering Systems


    # 2.1 Binary


    The IBM mainframe, as is the case with all modern digital computers, internally
    codes all numbers, characters, instructions, pointers and so forth in binary.
    Binary is based on only two digits: 0 and 1.


    When writing a number, each position, reading from right to left, represents a
    higher power of two as shown in Table 1. This table shows the equivalence between
    the first 16 binary, decimal, hexadecimal numbers (base 16, see next section).
    The value of a number in binary is, for each position in the binary number consisting
    of a 1, the sum of the values of the powers of 2 corresponding to those positions.


    | Binary | Decimal | Hexadecimal | Power of 2 |

    |---|---:|---|---|

    | 0000 | 0 | 0 | |

    | 0001 | 1 | 1 | 2⁰ |

    | 0010 | 2 | 2 | 2¹ |

    | 0011 | 3 | 3 | 2¹+2⁰ |

    | 0100 | 4 | 4 | 2² |

    | 0101 | 5 | 5 | 2²+2⁰ |

    | 0110 | 6 | 6 | 2²+2¹ |

    | 0111 | 7 | 7 | 2²+2¹+2⁰ |

    | 1000 | 8 | 8 | 2³ |

    | 1001 | 9 | 9 | 2³+2⁰ |

    | 1010 | 10 | A | 2³+2¹ |

    | 1011 | 11 | B | 2³+2¹+2⁰ |

    | 1100 | 12 | C | 2³+2² |

    | 1101 | 13 | D | 2³+2²+2⁰ |

    | 1110 | 14 | E | 2³+2²+2¹ |

    | 1111 | 15 | F | 2³+2²+2¹+2⁰ |


    **Table 1 Numbering Systems**


    Any decimal integer can be represented exactly by a corresponding binary number.
    For example, the binary series which is equivalent to the decimal number 10 is:


    1×2³ (8₁₀) + 0×2² (4₁₀) + 1×2¹ (2₁₀) + 0×2⁰ (1₁₀)


    or, stated as a single number: 1010₂'
