- pgno: 70
  md: '# 6.8.7 RSY Format


    The RSY format, shown in Figure 23, is similar to the RS format but has additional
    opcode information and an extended 20 bit displacement. While 12 bit displacements
    are treated as unsigned, positive numbers, 20 bit displacements are treated as
    20 bit signed numbers. A 12 bit displacement can range in value from 0 to 4095
    while a 20 bit displacement can range from -524,288 to +524,287.


    # 6.8.8 RXE Format


    The RXE format, shown in Figure 24, is used mainly with floating point operations.


    ![](img/4b7e9c58cac527296b19b501116daeb1_70_0.png)


    Figure 23 RSY Format


    # 6.8.9 RXF Format


    The RXF format, shown in Figure 25, is used mainly with floating point operations.


    ![](img/4b7e9c58cac527296b19b501116daeb1_70_1.png)


    Figure 24 RXE Format


    # 6.8.10 RXY Format


    RXY instructions, shown in Figure 26, are similar to RX instructions except they
    have a 20 bit signed displacements and a 16 bit opcode. One or both of the operands
    are 64 bit values.


    ![](img/4b7e9c58cac527296b19b501116daeb1_70_2.png)


    Figure 25 RXF Format'
  merge: -1
  img_proc: true
- pgno: 71
  md: '![](img/4b7e9c58cac527296b19b501116daeb1_71_0.png)


    Figure 26 RXY Format


    # 6.8.11 S Format


    The S format, shown in Figure 27, has one memory resident operand. The Test and
    Set (TS) is the most commonly used of this format. Originally, TS was labeled
    as an SI instruction but the I operand was never used.


    ![](img/4b7e9c58cac527296b19b501116daeb1_71_1.png)


    Figure 27 S Format


    # 6.8.12 SIY Format


    SIY instructions, shown in Figure 28, are similar to SI instructions but use a
    signed 20 bit displacement. Many original SI instructions have SIY counterparts
    such as Compare Logical (CL/CL Y).


    ![](img/4b7e9c58cac527296b19b501116daeb1_71_2.png)


    Figure 28 SIY Format


    # 6.8.13 SSE Format


    SSE instructions, shown in Figure 29, are mainly used for machine control, not
    general programming.


    ![](img/4b7e9c58cac527296b19b501116daeb1_71_3.png)


    Figure 29 SSE Format'
