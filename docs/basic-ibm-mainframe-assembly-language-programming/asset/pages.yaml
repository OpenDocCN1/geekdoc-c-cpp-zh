    |---|---|

    | **Load**<br>**Store** | Load instructions load data from memory into one or
    more registers and Store instructions store data from one or more registers to
    memory. As many operations require that one of the operands be in a register,
    Load/Store instructions are quite convenient.<br><br>For example, a Load instruction
    that loads 32 bits (4 bytes) from memory into a register:<br><br>`L R5,LABEL`<br><br>The
    four bytes beginning at the address associated with the label LABEL are loaded
    into register 5. The Store instruction is similar except the data movement is
