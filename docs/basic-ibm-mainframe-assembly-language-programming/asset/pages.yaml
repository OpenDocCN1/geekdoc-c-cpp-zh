    others (for example, RISC machines normally do not support multiply and divide
    instructions, among others).<br><br>The Add instruction is illustrative of the
    class. The basic Add instruction adds a 32 bit fixed point binary number stored
    in memory to the contents of a register. The register is specified as the first
