  md: 'The general purpose registers are addressed by a number between 0 and 15. These
    are the binary codes between 0000₂ (0₁₀) and 1111₂ (15₁₀). Thus, in all machine
    language coded instructions, a general purpose register operand is specified by
    a field of four bits.


    If an operand is in a register, the register number will be given. If an operand
    is in memory, the architecture mainly uses an addressing scheme known as base/displacement
    addressing (Some newer instruction formats permit relative addressing as well).
    In base/displacement addressing, the address of the operand is calculated by adding
    the contents of a base register with a constant called a displacement. A base
    register is a register selected by the programmer from general purpose registers
    1 through 15 (register zero is not normally used) but certain registers are more
    commonly used than others.


    Originally, displacements were always 12 bit unsigned integer numbers although
    in newer systems, 20 bit signed displacements are possible in some instructions.
    Twelve bit displacements are always treated as positive integers and, consequently,
    can range from 0₁₀ (0000 0000 0000₂ or 000₁₆) to 4095₁₀ (1111 1111 1111₂ or FFF₁₆).


    The purpose of the base/displacement addressing scheme is to achieve program relocatability,
    that is, the ability to place a program anywhere in memory. Consider that if a
    program used actual memory address constants to specify operand addresses, the
    program image would always need to be located in same place in memory. This would
    make it very difficult for a computer to run multiple programs at the same time
    because programs might compete for the same memory locations. In machines designed
    prior to the S360, this was often the case.


    Base/displacement addressing makes it possible to load a program anywhere in memory
    as the memory addresses of operands are calculated relative to the contents of
    a base register. Thus, when a program is loaded into memory, the base register
    is loaded with a memory address whose value is usually points to a byte near or
    at the starting point of the program. Since operand addresses are specified as
    positive offsets from the address in the base register, they will be correct if
    the base register is correct. Should the program be placed somewhere else in memory,
    a different value would be loaded into the base register and operand addresses
    will be likewise relocated.


    For example, if an assembly language program has a label located 1000 bytes from
    the start of the program and if the base register (let us say R15) is presumed
    to point to the start of the program, the base/displacement address for the label
    is written as 1000(R15) or, the sum of the value in R15 and 1000. If you'
