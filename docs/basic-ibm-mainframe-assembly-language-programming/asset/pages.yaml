- pgno: 23
  md: 'When text digits are read from a keyboard or other input device, each digit
    is encoded in zoned format. Thus, if you type 1234 into an EBCDIC (See Chapter
    25) terminal, internally this will be coded as the four bytes: F1 F2 F3 F4 (Note:
    in the z390 emulator, ASCII PC keyboard input is automatically converted to EBCDIC).
    Likewise, if you send F1 F2 F3 F4 to a display device or printer, the decimal
    number 1234 will appear.


    Zoned decimal format is a character string data type and you cannot perform arithmetic
    on it directly. To perform arithmetic, a zoned format number must be converted
    to packed decimal (BCD), binary or floating point format. Conversion to packed
    format is the easiest and quickest and you can perform arithmetic directly on
    packed decimal numbers.


    On an IBM mainframe, packed format decimal numbers are represented as strings
    of from 1 to 16 bytes. Each byte contains two binary coded decimal digits except
    for the final byte which consists of a 4 bit digit (high order bits) and a 4 bit
    sign (low order bits). Thus, on an IBM mainframe, in BCD you can represent numbers
    up to 31 digits in length (the sign must always be present). The shortest BCD
    number is one byte (one digit) and the longest is 31 digits. The decimal numbers
    0 through 9 are represented in packed format by their binary equivalents 000₂
    through 1001₂ (hex codes 0 through 9).


    In a BCD number, the codes 1100₂, 1010₂, 1111₂ and 1110₂ (hex digits C, A, F,
    and E) are legal only in the sign position and indicate that the number is positive
    while the codes 1101₂ and 1011₂ (hex digits D and B), also only legal in the sign
    position, indicate a negative number. These are easy to remember: the positive
    codes are CAFE and the negative are DB (as in debit). Any code is equally valid
    but C and D are the defaults for positive and negative, respectively, used by
    the system.


    You convert from zoned decimal to packed decimal by removing the zones and packing
    two digits into each byte except for the last which gets one digit and a sign
    code. There is an instruction for this called, not surprisingly, the PACK instruction.


    Table 5 gives several examples of zoned and packed numbers (in this table, 4E₁₆
    is the hex code for a printable plus sign and 60₁₆ is the code for a printable
    minus sign). As you can see, packed decimal numbers are merely an encoding of
    the original decimal number with a sign appended to the end.


    | Zoned Decimal | Packed Decimal | Packed Decimal Size |

    |---|---|---|

    | 4E F1 F2 F3 F4 F5 | 12 34 5C | 3 bytes |

    | 60 F1 F2 F3 F4 F5 | 12 34 5D | 3 bytes |

    | 4E F1 | 1C | 1 byte |'
  merge: -1
