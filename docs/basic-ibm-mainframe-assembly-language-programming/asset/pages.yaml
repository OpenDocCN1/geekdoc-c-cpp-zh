    # 23.12 Iterative Calculation of PI


    To calculate PI we need fractions. To this point, we have only discussed fixed
    point integers and floating point calculations are beyond the scope of this book
    as they are very specialized and not often done in assembly language. If floating
    point is needed, a FORTRAN subroutine is often written and called. But fixed point
    numbers can be used to calculate fractions. It is not required that we assume
    the binary or decimal point is to the right of all the digits. The assumed point
    could be elsewhere.


    Anyone who has used an old mechanical calculator or who remembers some of the
    early primitive electronic calculators will be familiar with the concept of fixed
    point calculations where the point was fixed but not necessarily at the right
    end of the number. When using devices such as these, each number entered had an
    assumed decimal point, usually two digits to the left of the final digit. All
    numbers entered had to include a full set of digits to the right of the decimal
    point. On modern calculators, however, only the significant numbers are entered.
    For example, on a modern calculator to add 2.3, 3, 5.63, and 100, you would enter
    the numbers as shown. The calculator understands the significance of the decimal
    point and aligns the values correctly for addition.


    However, on a fixed point calculator there is no decimal point key on the keyboard
    although there would be a fixed decimal point illuminated on the display ordinarily
    two positions from the right end of the display. Instead, in a fixed point calculator,
    you would enter the numbers above with the keystrokes 230, 300, 563, and 10000
    and the calculator would perceive the numbers aligned as:


    +   - 2 30

    +   - 3 00

    +   - 5 63

    +   - 100 00'
