    # 23.9 Word Count Program


    The next program builds a dictionary of words that stores up to 1000 words up
    to 8 characters in length along with a count of the number of times each word
    occurs. Word counts are useful to identify words that may make poor indexing terms
    in an indexing application. Historically, many indexing systems used a limited
    number of characters in an indexing word because the stem of a word in English
    is mainly in the first part of the word. The Salton SMART System (see Salton,
    G., *The SMART Retrieval System—Experiments in Automatic Document Processing*
    (Prentice-Hall, Upper Saddle River, NJ, 1971)), for example, was originally based
    on six character words because the early mainframe word size could hold six characters
    (characters were six bits).


    In this program the data structure for each word consists of eight characters
    of text followed by a four byte of fixed point binary integer giving the number
    of times the word has occurred in the document. Thus, each entry requires 12 bytes.


    The word count program is given in Figure 91 where the data structure for words
    and counts is contained in a table whose declaration is on line 121. This is a
    12,000 byte table which allows for 1,000 12 byte entries. The first eight bytes
    of each word is the word text and the last four bytes are the count.


    Because our data structure uses full word fixed point binary counts and because
    these must be on full word aligned memory'
