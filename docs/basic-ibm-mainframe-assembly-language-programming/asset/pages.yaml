  md: 'In relative addressing, the address of the operand is calculated relative to
    the address of the current instruction. Relative addressing is used mainly in
    branch instructions and in the Load Address Relative Long (LARL) instruction.
    The relative address value is specified in halfword units. Most relative address
    values are located in immediate operands.


    # 6.3 Operand Notations


    For each instruction there is a standard shorthand notation used by the documentation
    to describe the instruction. This format tells you the mnemonic opcode and the
    number and nature of the operands.


    In this shorthand, you will see code letters that indicate what kind of operands
    the instruction uses. Instructions may have from one to three operands but most
    have two. Operands can be in registers, immediate data (part of the instruction
    itself) or in memory.


    In the standard shorthand notation, operands are specified with the letters R,
    I, B, X, M, L and D. For example, the assembly language fully explicit format
    for the 32 bit signed binary Add instruction is given as:


    ```

    A R1,D2(X2,B2)

    ```


    The first letter (A) is the instruction mnemonic (Add). The codes that follow
    tell us what each operand or operand component is and the numbers tell us which
    operand we are looking at (first, second, third).


    | Notation | Meaning |

    |---|---|

    | R | general purpose register |

    | I | immediate byte operand |

    | B | base register |

    | D | displacement |

    | X | index register |

    | M | mask |

    | L | length |

    | DH | high 8 bits of an extended displacement |

    | DL | low 12 bits of an extended displacement |


    Table 11 Operand Notations


    In the Add instruction above, the code R1 means that the first operand is a register
    while the second operand is composed of a displacement (D2), an index register
    (X2), and a base register (B2). In the case of the Add instruction, the 32 bits
    from memory are added to the low order 32 bits of the register specified as the
    first operand. The designation R1 (or R2 or R3 in other instructions) means the
    first (or second or third, respectively) operand is a register. It does not necessarily
    mean that the first'
