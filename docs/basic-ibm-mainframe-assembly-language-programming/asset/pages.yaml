- pgno: 161
  md: '# 17.9 Miscellaneous Decimal Related


    # 17.10 Instructions


    # 17.10.1 UNPACK (UNPK)


    The UNPK instruction converts each packed decimal second operand to zoned format
    except for the last digit. Each digit in the source becomes a byte in the result
    with a leading F16 zone except in the case of the last digit, which becomes the
    digit in the final result byte but the zone is not F16 but the sign from the source.
    The UNPK is not as useful as the ED.


    # 17.10.2 Move Numerics (MVN)


    The right-most 4 bits of each source byte (second operand) are moved to the right-most
    4 bits of the target operand (first operand). The zones are unchanged. The Condition
    Code is unchanged. Up to 256 bytes may participate.


    # 17.10.3 Move Zones (MVZ)


    The left-most 4 bits of each source byte (second operand) are moved to the left-most
    4 bits of the target operand (first operand). The digits are unchanged. The Condition
    Code is unchanged. Up to 256 bytes may participate.'
  merge: -1
  img_proc: true
- pgno: 162
  md: "# 18. CSECTS, DSECTS and Base Registers\n\n# 18.1 CSECT\n\nAssembly language\
    \ programs are comprised of one or more sections. There are three types of sections:\
    \ control sections (CSECTs), common sections (COMs) and dummy sections (DSECTs).\
    \ CSECTs contain ordinary code, dummy sections do not generate object code but\
    \ are layouts or mappings of memory, and common sections are areas of memory common\
    \ to multiple object modules.\n\nA CSECT directive is used to begin or continue\
    \ a control section. The label on the CSECT directive is the name of the section\
    \ for linkage purposes. The START directive, used only at the beginning of an\
    \ assembly program, is the equivalent of a CSECT. In a program with multiple CSECTs,\
    \ the code for several sections may be intermingled in the source file. The CSECT\
    \ directive is used to identify to which section different code sections belong.\n\
    \n```\nFIRST     CSECT\n          .\n          .                 some code for\
    \ CSECT FIRST\n          .\nSECOND    CSECT\n          .\n          .        \
    \         some code for CSECT SECOND\n          .\nTMPLT1    DSECT\n         \
    \ .\n          .                 some code for DSECT TMPLT1\n          .\nFIRST\
    \     CSECT\n          .\n          .                 more code for CSECT FIRST\n\
    \          .\nSECOND    CSECT\n          .\n          .                 more code\
    \ for CSECT SECOND\n          .\n```\n\nFigure 60 CSECT/DSECT Flow\n\nIn an assembly\
    \ language program you may have several CSECTS and DSECTS (discussed below). These\
    \ need not be contiguous. You may begin a CSECT and write some code then begin\
