- pgno: 132
  md: 'An example use for the TR instruction would be to convert from lower to upper
    case or to replace some punctuation characters with blanks.


    In newer architectures, several variations were added: Translate Extended (TRE)
    which halts upon encountering a programmer specified test byte. Translate One
    To One (TROO), Translate One To Two (TROT), Translate Two To One (TRTO), and Translate
    Two To Two (TRTT) are variations that operate on multiple bytes and longer string
    lengths.


    # 13.3 Insert Character (IC/ICY)


    The Insert Character instructions IC (format RX) and ICY (format RXY) load the
    byte addressed by the second operand into the low order 8 bits of the register
    specified as the first operand. Other bits of the first operand register are unchanged.
    The IC instruction uses an unsigned 12 bit displacement while the ICY uses a 20
    bit signed displacement. Neither alters the condition code. Additionally, there
    is the Insert Characters Under Mask instruction (ICM) which selectively loads
    up to 4 characters from memory into a register.


    # 13.4 Store Character (STC/STCY)


    The STC instruction stores the low order byte from the register designated as
    the first operand at the address specified by the second operand. It is of RX
    format. The similar STCY instruction is of format RXY and uses a 20 bit signed
    displacement. A related instruction, Store Characters Under Mask (STCM) stores
    a variable numbers of bytes.


    ```

    STC R1,D2,(X2,B2)

    ```'
