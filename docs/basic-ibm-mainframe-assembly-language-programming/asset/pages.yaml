  md: 'Next, take a large integer packed decimal number such as


    10 000 000 000


    and divide it by 3, 5, 7, 9 and so on. The results will be


    3 333 333 333

    2 000 000 000

    1 428 571 428

    1 111 111 111


    and so forth (remainders ignored).


    Add or subtract, as appropriate in the series, the results of the division to
    the candidate PI. If you print out PI at each step with a decimal point inserted
    after the first digit the results will be:


    0.6666666667

    0.8666666667

    0.7238095239

    0.8349206350


    Which, when multiplied by 4, converges to PI.


    The program in Figure 95 (output in Figure 96) follows the same pattern as the
    program in Figure 94.


    On lines 5 and 6 we use the pre-processor to set the number of iterations (&ITER)
    of the series we will run. This is substituted into the Compare Packed instruction
    on line 40 during pre-processing (note: many iterations are required to begin
    to get a usable value for PI).


    Register R3 is zeroed on line 3. This register will toggle between 0 and 1 to
    indicate if the next term of the equation is to be added or subtracted, respectively,
    from the approximation. The toggle is done by the Exclusive Or on line 23 which
    also sets the condition code to indicate the result in R3 thus saving a Compare
    instruction. If R3 is 0, an Exclusive or with 1 results in 0. If R3 is 1, and
    Exclusive OR with 1 results in 1. The Condition Code indicates if the result is
    or is not zero and this informs the Branch Conditional (BNE).


    The denominator B is initially set to 1 in line 10. This is incremented by 2 in
    line 13 at the top of the main loop.


    The numerator A for each term is set on line 14 to a very large power of 10. The
    denominator B is divided into it on line 16. The results of the DP are in are
    in A. The first 6 bytes of A are the quotient and the last 4 are the remainder.
    The quotient values will be 3 333 333 333, 2 000 000 000, 1 428 571 428, 1 111
    111 111 and so forth. These are converted to printable decimal with'
