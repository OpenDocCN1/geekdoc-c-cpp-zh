  md: 'addresses of labels as displacements from the point in the program whose address
    is contained in the base register.


    # 18.3 Programs Longer than 4096 Bytes


    One problem with the base-displacement addressing scheme used in the original
    architecture is that the maximum displacement from a base register is 4095 bytes.
    That is, the assembler cannot address a byte which is more than 4095 bytes from
    the address contained in the base register. When a byte is within this window
    of addressability we say that the label is within using of a base register.


    Programs in the real world, however, are obviously longer than 4096 bytes. The
    base register addressability problem can be partly solved by having multiple base
    registers with the second pointing 4096 bytes beyond the first and so forth.


    However, for large programs, there are usually not enough spare registers to allow
    very many to be pre-allocated as base registers so other techniques must be employed.
    One technique is that larger programs are organized as blocks of code where each
    block establishes its own base register on entry into the block. Thus, the same
    register or registers can be re-used.


    # 18.4 Loading an Address - BALR / BASR


    Loading a base register with the an address can be accomplished by either BALR
    or BASR instructions in which the second operand is specified as R0 (the BAL and
    BAS instructions will also load the current address into a register but they always
    branch). In BALR and BASR, no branch takes place because the second operand is
    R0. The first operand receives the address of the byte immediately following the
    BALR or BASR.


    So, for example, if we want to establish R12 as a base register, we would first
    load it with the address of where we are in the program. Then we inform the assembler
    that R12 is a base register and where the contents of R12 are pointing. This could
    be accomplished with the following code fragment:


    ```

    BASR R12,R0

    USING *,R12

    ```


    The above loads the address of the byte following the BASR into R12 then tells
    the assembler to use R12 as a base register. The format of the assembler directive
    USING is an address expression followed by one of more register designations.
    In this case the address expression is asterisk meaning here. The register is
    assumed to contain the address indicated by the address expression. If the USING
    specifies more than one register, they are assumed to contain the addresses 4096,
    8192,'
  merge: -1
  img_proc: true
- pgno: 165
  md: 'and so forth beyond the value in the first register. Note that the USING follows
    the BALR/BASR. This is because the address loaded into the register specified
    as the first operand (R12) is the address of the byte immediately following the
    BALR/BASR. Hence, as the asterisk refers to the current address, the USING needs
    to be after the BALR. Had it been the other way around, the assembler would assume
    that the address in R12 was the address of the BALR/BASR.


    You will also note there is a DROP directive. This discontinues use of a base
    register. The use of USING and DROP are assemble-time directives - they cover
    areas of code and are not run time states. That is, from the point or line in
    a program where a register is designated as a base register by USING until the
    point or line where it is dropped by a DROP (or the end of the program), the register
    may be used by the assembler to construct a base and displacement address. Outside
    that area, the register is not a base register.


    When operands can be addressed with a valid base and displacement combination,
    they are said to be in using; if an operand is beyond the maximum 4095 byte displacement
    of any base register, the operand is said to be out of using.


    # 18.5 Specifying More Than One Base Register


    You tell the assembler to use multiple base registers by including more than one
    register in the USING statement as seen in Figure 61. The assembler assumes that
    each register has as its contents an address value 4096 higher than the previous
    register in the list. In a long program, the assembler will select the base register
    which is closest to a label.


    As there are only fifteen register that can be used as base registers (R0 may
    not be a base register), most large programs frequently re-use base registers
    rather than using many registers at once. However, it is not unusual to have more
    than one base register available for addressing. In this case the programmer needs
    to be sure to load each register correctly. An example can be seen in Figure 61.


    ```

    1   BALR        R12,R0

    2   USING       *,R12,R11,R10

    3   LA          R11,2048(R0,R12)

    4   LA          R11,2048(R0,R11)

    5   LA          R10,2048(R0,R11)

    6   LA          R10,2048(R0,R10)

    ```


    Figure 61 Multiple Base Registers'
