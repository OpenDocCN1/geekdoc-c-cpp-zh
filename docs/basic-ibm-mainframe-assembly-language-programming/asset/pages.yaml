- pgno: 12
  md: '# 1. Preface


    # 1.1 Goals


    The goals of this book are to give the reader a basic understanding of the IBM
    mainframe architecture from the perspective of the instruction set and to serve
    as an assembly language text for introductory college courses in computer organization.
    The text originally began as a set of class notes for an undergraduate computer
    science course on Computer Organization. Over the years it has been expanded and
    enlarged to the text you see here.


    Many computer architectures have come and gone in the past 50 years and only a
    relatively few designs remain in production today. In the early 90s, the rapid
    rise of new computer manufacturers such as Sun, Apollo, Silicon Graphics, MIPS,
    Digital Equipment Corporation (DEC), Tandem, Prime, Data General, SDS (also known
    as XDS) and many more seemed to point to a world without the mainframes. All these,
    however, are now gone along with several legacy mainframe manufacturers such as
    NCR, Burroughs, Control Data Corporation, General Electric, Honeywell, RCA and
    UNIVAC (UNIVAC and Burroughs merged to form UNISYS which still manufactures a
    limited line of mainframes).


    In the not too distant past it was assumed that the rise of microprocessors and
    server centric computing would bring an end to the age of big iron as mainframes
    were referred to.


    But the IBM mainframe architecture has endured and, rather than declining, is
    growing in popularity and becoming the platform of choice for such rapidly emerging
    technologies as cloud computing and virtualization. As the world chokes in an
    energy and space intensive microprocessor based server sprawl, a single mainframe
    system can deliver thousands of virtual Linux platforms for a fraction of the
    cost in dollars, energy and space.


    While most computer users are familiar with the ubiquitous Intel x86 microprocessor
    line, few have had any experience with another widely used architecture, the IBM
    mainframe.


    As the baby-boom generation programmers who wrote the billions of lines of mainframe
    assembly language code since the introduction of the IBM 360 in 1964 are beginning
    to retire, the demand for replacement programmers to maintain, support and extend
    these applications as well as develop new ones is growing rapidly. To those looking
    to meet this need, this text will serve as a basic road map and introduction to
    the fundamentals of the architecture.'
  merge: -1
  img_proc: true
- pgno: 13
  md: 'The other purpose of this book is to provide an alternative assembly language
    platform for introductory college level courses in computer organization. From
    an academic perspective, the question of which architecture to use when teaching
    assembly language poses several challenges. Once, the answer was simple: the Intel
    x86 assembly language. However, as the Intel x86 architecture has grown into an
    intricate and unwieldy collection of exceptions and special cases, its value as
    a viable pedagogical platform in an introductory course has diminished.


    So, in many cases, the choice defaults to an assembly language based on a simulator
    for a non-existent, abstract RISC based architecture. Although this gives students
    a taste of a machine level architecture, it provides little real experience that
    can actually be used to further their careers and is often regarded by students
    themselves as an exercise in futility.


    For most, the basic impediment to teaching mainframe assembly language is actual
    access to a mainframe. While many colleges and universities use mainframes, students
    seldom have access.


    This text, however, is designed to be used in combination with a free, portable,
    open sourced, GPL licensed, Java based z390 mainframe emulator and macro assembler
    which permits a student to assemble and execute IBM mainframe programs on a Windows,
    Linux or Apple based computer (see: http://www.z390.org/). Other options also
    exist including the Hercules System/370, ESA/390, and z/Architecture Emulator
    with Hercules-390.eu/).


    For the most part, this text mainly concentrates on the basic architecture in
    order to keep to a manageable size suitable for a section in a college course
    in computer organization. While there are a number of instructions and features
    not discussed here, these are, for the most part, logically intuitive extensions
    of the basic architecture or of a substantially more application or operating
    system specific nature.


    # 1.2 History and Background


    The current series of IBM mainframes (System z13) had its roots in 1964 with the
    introduction of the IBM 360 Series. This was conceived as a family of computers
    designed to meet a wide range of applications both scientific and commercial.
    The system was intended to be a collection of compatible computers ranging from
    small, basic machines to large, enterprise level configurations. Originally the
    architecture was based on a 24 bit address space (16 MB, massive at the time)
    and a basic 32 bit word size. This has evolved in the latest models that support
    for 64 bit addressing and data.'
  merge: -1
  img_proc: true
- pgno: 14
  md: 'Prior to the introduction of the 360 Series, IBM, as was the case with other
    vendors, sold machines with differing architectures and computing power to different
    markets. There was the IBM 1620, a small machine often used for scientific calculations,
    the IBM 1400 series designed to replace unit record devices in commercial settings,
    and the high end 7000 series for large commercial and scientific applications.


    These architectures were mainly incompatible with one another and used widely
    varying primitive operating systems. They were based on six bit characters with
    either fixed or variable word sizes. Some had hardware supported binary and floating
    point instructions while others did calculations on varying length binary coded
    decimals. Some had multiply and divide instructions while others did not. The
    1620 did arithmetic by means of lookup tables! This chaos extended across all
    manufacturers at the time. The concept of software portability was just that.
    A concept.


    So, in the 1960s the idea of a single architecture that would meet the needs of
    all users, both business and scientific, was new and daring. The design and implementation
    effort was considerable. It required a completely new architecture with many new
    features and a massive programming effort to create a totally new operating system
    and related software. Basically, IBM bet the company on the project.


    But the experiment proved wildly successful and IBM quickly became the dominant
    player in the mainframe market. Even to this day, all models of the IBM mainframe,
    even the most recent, are backwards compatible with the earliest of the 360 series.
    That is, a program written for the oldest and smallest 360 Model 20 will run on
    the latest system made today.


    With each new generation, additional facilities and instructions were added. These
    are referred to as architecture levels. At present, there are three architecture
    levels named: ARCHLVL1 (ESA 390 systems), ARCHLVL2 (zSeries and System z9 machines),
    and ARCHLVL3 (System z10 machines). These reflect additions to the original design
    which are, for the most part, consistent with the original design.


    The z/Architecture was introduced in 2000 and is represented by machines in the
    z9 through z13 families. It is a 64 bit CISC (complex instruction set computer)
    architecture with sixteen 64/32 bit general purpose registers, sixteen 64 bit
    floating point registers, sixteen access registers, and sixteen 64/32 bit control
    registers. The access registers permit multiple address spaces to be utilized
    by a program and, due to their complexity, are not discussed in this text. In
    some models, the high order 32 bits of'
  merge: -1
  img_proc: true
- pgno: 15
  md: 'the 64 bit registers can be used as a second set of 32 bit registers.


    Memory addressing is implemented as either 24, 31 or 64 bits and all modes can
    be used concurrently depending upon the application program''s needs. Much legacy
    programming is still operates in 24 bit mode. This book will deal mainly with
    31 bit addressing as this is the primary mode supported by the z390 emulator and
    assembler.


    As of this writing, the z390 emulator corresponds to the system definition as
    found in the IBM z/Architecture Principles of Operation, Document Number: SA22-7832-03
    (05/04/04) which is available online from IBM.


    The initial models in the 360 series were known as models 20, 30, 40, 44, 50,
    65, 67, 75 and 91, 95 and 195. These systems, depending on model, featured multiple
    independent input/output channels, multiple processors, dynamic address translation
    (more commonly known as MMU now), cache memory and varying memory bandwidths.
    Memory was originally made from ferrite cores and limited to a maximum of 1 megabyte.
    Some models were hardwired and some were microcoded. Operating systems ranged
    from a simple disk based operating system for low end hardware to the resident
    O/S 360 that supported multiple concurrent tasks. All input output was centralized
    through the operating system. By means of memory protect keys and supervisor/problem
    states, programs were isolated from one another. The operating systems were mainly
    priority event driven. The use of a spooling subsystem permitted unit record input/output
    queues to be managed by the operating system rather than by separate computers
    as had been the case in previous systems. The original 360 series supported hardware
    binary, floating point (optional depending on model) and decimal arithmetic (optional
    depending on model).


    In 1970, the 360 series was supplanted by the 370 series which expanded on the
    original base to include enhanced support for virtual memory, additional instructions
    and larger memory. The 80s and 90s saw the architecture continue to evolve with
    the System 390 (September 1990) and the Z series (in 2000 for models z900 and
    z990) followed by the System Z moniker in 2006.


    Typical of a CISC (Complex Instruction Set Computer) architecture, the IBM mainframe
    has several addressing modes and instruction lengths. In a RISC (Reduced Instruction
    Set Computer), on the other hand, instructions are generally of one size and nearly
    all operations are done register to register. On the IBM mainframe, however, operations
    may be performed register to register, register to memory, or memory to memory.'
  merge: -1
  img_proc: true
- pgno: 16
  md: The IBM mainframe architecture normally uses the EBCDIC (Extended Binary Coded
    Decimal Interchange Code - see chapter 25) to represent characters rather than
    the more common ASCII-7 (American Standard Code for Information Interchange, 7
    bit). Note, however, that EBCDIC has changed over the years and there are likely
    to be differences between this table and others you may find online.
  merge: -1
  img_proc: true
