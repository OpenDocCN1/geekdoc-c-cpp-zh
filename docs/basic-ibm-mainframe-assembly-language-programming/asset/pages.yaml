- pgno: 176
  md: 'relating to reentrancy. In both these cases, static save areas are not adequate.


    Programs can be classified as either serially reusable, reentrant or neither.
    In reusable programs, a copy of a program loaded in memory may be used by only
    one user at a time but, upon completion, the original state of the program''s
    data is restored and another used may use the code.


    A reentrant routine is one which may have more than one concurrent users. In order
    to allow this, it must be pure, unchanging code and data. Any code or data subject
    to modification must not be part of the shared image. It must belong to individual
    users.


    For example, the program code for an editor may be used by several users concurrently.
    It is much more efficient to have only one copy of the program reside in memory
    rather than a copy for each user. The program is shared among several users. But
    in order for this to work, each user must have their own data areas and registers.
    The program itself may contain only code and constants. If the program contained
    alterable data, it would eventually occur that:


    +   1. One user executing the program would set a data value and be interrupted,

    +   2. Another user would gain control and set the same data but to a different
    value and become interrupted,

    +   3. The first use gain control and use that data value actually set by the
    other user.


    To avoid this, we write programs where the code and data is unchanging. The hardware
    even supports this with the Execute instruction which permits reentrant compliant
    temporary modification of, among other things, the length byte in SS instructions.


    In a multi-user system, each user has their own privately allocated data area
    pointed to by their registers. When an operating system switches between users,
    the currently executing user''s set of general purpose registers, floating point
    registers and PSW and other per user information are saved and, ultimately, restored
    when the user gains control again.


    When a code module is shared among multiple users, it is using a particular user''s
    registers to address that user''s private data area. When another user gains control,
    the program uses that user''s registers to access that user''s data area.'
  merge: -1
  img_proc: true
- pgno: 177
  md: 'Thus, for example, the code for the telephone table lookup shown in Figure
    65 bases all its data accesses on the contents of register 2 which is the base
    for the DSECT ID. Similarly, if a reentrant program were to make all its data
    references within a DSECT which itself is based on a user supplied base register,
    the program would use different data areas for different users. The program itself
    would have no local data other than constants.


    A program which only modifies the contents of its registers and data pointed to
    by the registers in the user''s private data area does not violate reentrancy
    rules. Each user has their own set of registers and their own private (unshared)
    data area.


    Even if a program is reentrant and each user has their own data area, there is
    still a problem when a program calls itself (recursive call) if it uses a statically
    allocated (legacy) save area.


    If a program calls itself, the second call will overwrite the statically allocated
    save area. This is also true if a program indirectly calls itself. Consequently,
    we need a mechanism to stack multiple save areas for the same function.


    One approach is to have the called routine dynamically allocate a new save area
    each time it is called and free it upon ultimate return. This is usually done
    with the GETMAIN or STORAGE system macros.


    Another approach is to use the system stack. The original IBM 360 architecture
    did not provide for system supported stacks. It is rumored that the engineers
    thought this feature was more characteristic of a mini-computer. Nonetheless,
    the feature was ultimately introduced in 1989 – 25 years later! The system stack
    and several semi-privileged instructions support recursive calls.


    # 19.3.1 Chained Dynamically Allocated Save Areas


    As noted, programs that are to be recursively called need to be reentrant so that
    successive calls do not use or alter previous calls'' intermediate results if
    they are stored in. For example, the calculation of factorials is often done on
    a series of recursive calls. Each instance waits for the return of one or more
    deeper invocations. Each invocation stores local values as needed to complete
    its evaluation level prior to making a return.


    An example of factorial in C is given in Figure 67Figure 1 where, on line 12,
    each invocation waits for lower level invocations to return and, ultimately, their
    result be multiplied by a current value of i. The variable i must be local to
    each invocation and not shared.


    One way to implement this program is to use a chain of save areas dynamically
    allocated by the GETMAIN or STORAGE macros.'
  merge: -1
