    # 23.5 Bubble Sort


    The program in Figure 87 performs a bubble sort on the table of ten full word
    binary numbers beginning at label TAB. The program consists of two loops: an outer
    loop beginning at OUTER and an inner loop beginning at LOOP.


    The inner loop examines each entry of the table from positions 0 to 9 and compares
    each with the entry in the position above it. That is, the entry at position 0
    is compared with the entry at position 1, entry 1 is compared with entry 2 and
    so forth until entry 9 is compared with entry 10.'
