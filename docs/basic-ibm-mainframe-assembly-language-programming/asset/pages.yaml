  md: '![](img/4b7e9c58cac527296b19b501116daeb1_69_0.png)


    Figure 20 RSL Format


    # 6.8.5 RRF Format


    The RRF format, shown in Figure 21, is used mainly with floating point instructions.


    ![](img/4b7e9c58cac527296b19b501116daeb1_69_1.png)


    Figure 21 RRF Format


    # 6.8.6 RSI Format


    The RSI format, shown in Figure 22, is used with only two instructions: Branch
    Relative on Index High and Branch Relative on Index Low or Equal (BRXH/BRXLE).
    These instructions use 32 bit arithmetic. The relative address in the immediate
    operand is in halfword units.


