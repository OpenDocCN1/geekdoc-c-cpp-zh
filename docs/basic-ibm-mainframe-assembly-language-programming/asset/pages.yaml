    # 23.8 Print a String in Hexadecimal


    The program in Figure 90 prints a string of bytes in hexadecimal notation. For
    example, for the character string ABC123, the equivalent hexadecimal is: C1C2C3F1F2F3


    The program in Figure 90 advances through the input string byte by byte. For each
    byte, it first extracts the high order four bits and uses these as indices (between
    0 and 15) into a table of printable characters which correspond to the value of
    the four bit field. For example, if the four bit field has 1010₂ (10₁₀), this
    indexes to the eleventh position in the table where the character A is located.
    Note: the table begins at zero. Hence, offset 10 into the table is to the eleventh
    entry.'
