- pgno: 45
  md: 'The *Hello World* program isn''t very interesting. It doesn''t actually do
    any calculations and mainly relies on system macros and pseudo instructions instead
    of real machine instructions. In Figure 4, however, we see a more advanced program.
    It has all the basic components of the *Hello World* program above but, rather
    than merely printing a message, it adds two binary numbers, converts the result
    to decimal and prints the answer.


    The differences between this program and the *Hello World* program are:


    +   1. On line 4, we load the 4 byte (32 bit) signed binary value located in memory
    at label ONE into register 2. Note: although registers are actually 64 bits wide,
    this form of the Load instruction only loads into the low order 32 bits of the
    register. The high order 32 bits are unchanged.

    +   2. On line 5, we add the 4 byte signed binary value from memory at label TWO
    to the low order contents of register 2. The high order 32 bits are unchanged.

    +   3. On line 6, we write a title. We give the XPRNT pseudo-instruction the address
    of the beginning of MSG and its length.

    +   4. On line 7, we convert the binary value in R2 to printable decimal characters
    and stores them, right justified padded to the left with blanks, in the 12 byte
    character string in memory at label OUT. The contents of R2 are in signed binary
    and cannot be printed directly. XDECO is an Assist package pseudo-instruction
    that converts binary into printable decimal characters

    +   5. On line 8, we print the contents of OUT.

    +   6. On line 9 we exit the program.

    +   7. Lines 11 and 12 reserve storage for two full word (4 byte, 32 bit) binary
    values and initializes them to the binary equivalent of 1₁₀ and 2₁₀, respectively.
    DC statements reserve storage and initialize it. The code F tells the assembler
    to initialize a full word (4 bytes, 32 bits) with the binary equivalent of the
    decimal number contained within the quotes. Note that the assembler uses single-quote
    marks rather than double quotes.

    +   8. Line 13 reserves, but does not initialize, a character string of length
    12. A DS differs from a DC in that a DS merely reserves memory, it does not initialize
    it. The contents of these 12 bytes are random until a program stores something
    in them.

    +   9. The END statement is an assembler directive that indicates the end of the
    input program. It does not generate exit code. That is done by the SUBEXIT macro.'
