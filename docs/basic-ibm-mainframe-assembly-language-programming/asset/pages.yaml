- pgno: 46
  md: '# 6. Instruction Formats


    An instruction format refers to the layout of an instruction and its operands.
    Each computer architecture has its own set of instruction formats. Some are very
    simple, such as those used in RISC (Reduced Instruction Set Computer) machines
    such as the in SPARC (Scalable Processor Architecture), while some are very complex,
    such as those used in CISC (Complex Instruction Set Computer) machines such as
    the Intel Pentium and the now deceased Digital VAX architecture.


    Instruction formats can be viewed at two levels. At the assembly language level
    they are the syntax that maps where the different operands are placed in the source
    code form of an instruction. They tell us, for each instruction, the operands
    to be used and how to write them in a fully explicit notation.


    On the second level, instruction formats are layouts for the actual executable
    binary format for the instructions generated when the assembler translates source
    code into binary.


    Each instruction belongs to an instruction format family. The executable binary
    code for all instructions in a family of instructions follows the same pattern
    or layout. Components of the source code format for an instruction map to a specific
    bits in the binary machine code format.


    First, we will discuss instruction formats from the assembly language perspective
    and then from the machine language perspective. For example, a generic RX format
    instruction has the fully explicit assembly language format of:


    ```

    OpCode R1,D2(X2,B2)

    ```


    This is the syntax of how you would write a fully explicit RX instruction. It
    begins with an OpCode, a short sequence of characters that indicate the instruction
    to be executed. For example, A for Add, S for subtract, L for load, and ST for
    store. Next is the layout for the operands. All RX instructions have two operands.
    The first is in a register and the second is in memory. In the format above, the
    first operand is designated as R1. In the syntax, this means that the first operand
    is a register. The letter R means register and the number indicates if it is the
    first, second, etc. operand. Note: this notation is tells us the format to of
    how to write an RX instruction. The designation R1 does not mean you must use
    the actual machine register 1. It merely means that the first operand is a register.
    Next, following the comma, you see the layout for the second operand as indicated
    by the number 2 on each token. The second operand for an RX instruction is in
    memory whose address is'
