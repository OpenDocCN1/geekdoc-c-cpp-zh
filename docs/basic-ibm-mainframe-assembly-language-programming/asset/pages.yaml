- pgno: 73
  md: 'Bit 22 Enable floating point underflow exception

    Bit 23 Enable floating point significance exception


    Table 14 PSW Program Mask


    When the bit is 1, the exception is enabled. When 0, the exception is ignored.
    If enabled, the exception will interrupt your program.


    # 7.5 Problem / Supervisor State Bit


    The Problem State bit is located at bit 15. When 1, the machine is operating in
    unprivileged problem state. In problem state, not all instructions may be executed.
    When 0, the machine is in supervisor state and all instructions may be executed.
    The operating system routines often run in supervisor state and has access to
    all instructions.


    # 7.6 Instruction Addressing


    The PSW always contains the address of the next instruction to be executed. This
    is often referred to as the updated address portion of the PSW. When an instruction
    is fetched, before it is executed, the address portion of the PSW is updated (incremented)
    to point to the address of the byte immediately following the instruction just
    fetched and yet to be executed. Thus, the PSW points to where the next instruction
    should be located. The address portion of the PSW always points to the next instruction,
    not the current instruction. In case of an error and a system dump, the PSW address
    will likely be pointing at the instruction following the one causing the error.


    Any of the branch instructions can alter the address portion of the PSW. In effect,
    a branch means loading a new value into the address portion of the PSW. When you
    alter this value, the next instruction to be executed will be fetched from this
    location.'
  merge: -1
