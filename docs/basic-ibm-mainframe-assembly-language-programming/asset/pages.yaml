    those symbols replaced with the values supplied in the macro invocation.


    # 22.2 Set and Sequence Symbols


    In addition to symbolic parameters, the macro language has variables, called set
    symbols, and labels, called sequence symbols. These are visible only to the pre-processor.
    They, as is the case with all pre-processor statements, do not appear in the pre-processor
    file passed to the assembler.


    Set symbols can either be local to an individual macro expansion or global and
    known to all other macros in an assembly. They can be declared as arithmetic,
    Boolean or character string, either as simple variables or one-dimensional arrays.
    All set symbols begin with an ampersand. There are also some pre-defined system
    set symbols.


    The macro statements LCLA, LCLB and LCLC are used to declare local arithmetic,
    Boolean and character string set symbols, respectively. The macro statements GBLA,
    GBLB and GBLC are'
