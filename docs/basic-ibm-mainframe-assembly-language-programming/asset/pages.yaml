  md: '# 11. Binary Arithmetic


    # 11.1 A Program to Add Numbers


    Next we modify, in stages, the *Hello World!* program from Chapter 5. Our new
    program will be called ADD.MLC whose purpose it will be to add a set of numbers.


    First make a copy of *hello.MLC* and name it *add.MLC*. This is file we will modify
    by first adding a table of numbers initialized with values between 1 and 5. Figure
    40 shows the first modification with the added table of initialized numbers. We
    have also modified the message from *Hello World!* to *Adding Numbers*. Note that
    Figure 40 shows line numbers on the right but these are for reference and are
    not part of the actual source code.


    ```

    1 PRINT NOGEN

    2 ADD SUBENTRY

    3 EQUEREGS

    4 XPRNT MSG,L''MSG

    5 SUBEXIT

    6 MSG DC C''Adding Numbers''

    7 ONE DC F''1''

    8 TWO DC F''2''

    9 THREE DC F''3''

    10 FOUR DC F''4''

    11 FIVE DC F''5''

    12 END


    Figure 40 ADD.MLC Step 1

    ```


    Each of the storage definitions on lines 7 through 11 allocates a full word (4
    bytes) whose contents are initialized to the signed fixed point binary equivalent
    of the decimal numbers in the quoted fields. Note that the fields use single quotes,
    not double quotes. The total storage allocated is 20 bytes. At this point the
    program does nothing but print MSG.


    Next we need to calculate the total of the four numbered we added. Since we are
    working with 32 bit signed fixed point binary integers, we will need a register
    in which to do the calculations. A register is required because the 32 bit binary
    arithmetic instructions are all of the RR or RX variety and, consequently, one
    or both of the operands must be a register.


    Although any register is legal, we normally select a register in the range R2
    through R12. This is because registers R0, R1 and R13, R14 and R15 have significance
    with regard to program linkage. R2 is a good choice but be careful, it can sometimes
    be altered by some system calls and instructions (for example, the'
  merge: -1
  img_proc: true
- pgno: 101
  md: 'TRT instruction) but this will not be the case here so we will select R2.


    R2 is our accumulator. That is, we will add each of the values into it until it
    has the final total and then we will print the total. Obviously we first need
    to put zero into the register. This can be done in either of two ways. One way
    is to load a full word constant zero into the register. This would use a 4 byte
    Load instruction and require a corresponding 4 byte constant in memory. This is
    shown in Figure 41.


    The Load instruction (line 4) loads the full word from the memory address specified
    by the second operand into the register specified as the first operand. It is
    an RX instruction and the assembler calculates the memory address by a base and
    displacement. The index register will be zero. The SUBENTRY macro has already
    established R13 as the base register.


    Alternatively, we could use a literal as shown in Figure 42 but this is really
    the same thing as the assembler makes an equivalent storage declaration for us.


    ```

    1        PRINT          NOGEN

    2        ADD            SUBENTRY

    3                       EQUREGS

    4        L              R2,ZERO   *Zero R2

    5        XFRNT          MSG,L''MSG

    6                       SUBEXIT

    7 MSG     DC             C''Adding Numbers''

    8 ZERO    DC             F''0''

    9 ONE     DC             F''1''

    10 TWO    DC             F''2''

    11 THREE  DC             F''3''

    12 FOUR   DC             F''4''

    13 FIVE   DC             F''5''

    14                       END

    ```


    Figure 41 ADD.MLC Step 2


    The preferred alternative is to simply subtract the register from itself as shown
    in Figure 43. This is the quickest and uses the least memory (two bytes: RR instructions
    are all two bytes in length). The SR instruction subtracts the contents of the
    register specified as the second operand from the contents of the register specified
    as the first operand and leaves the result in the first operand. In this case,
    the result is zero. As we have not used R2 in our program, it would normally contain
    a random value from the last program that used it. But in the z390 emulator all
    register bytes are initialized to F416. Regardless of its prior value, subtraction
    from itself yields zero.'
