- pgno: 48
  md: 'added but they are philosophically rooted in the original five. At present,
    there are 21 instruction formats.


    # 6.1 Registers


    In the original IBM 360 architecture there were sixteen 32 bit general purpose
    registers (GPR) and four 64 bit floating point registers. In the current architecture
    there are sixteen 64 bit general purpose registers and sixteen 64 bit floating
    point registers.


    Those instructions from the original architecture which operated on 32 bit general
    purpose registers now use the low order 32 bits of the 64 bit registers. The high
    order 32 bits are normally not affected. Only newer instructions use the full
    64 bit GPRs.


    Additionally, the current architecture includes a number of control and memory
    access registers which are not covered in this text as they are mainly operating
    system oriented.


    # 6.2 Operands and Data Addressing


    Instructions consist of an opcode and one or more operands. Opcodes in the original
    architecture were all one byte numbers indicating which instruction to execute.
    In the newer architectures, opcodes can be longer than one byte. Most instructions
    have operands which determine the data upon which the instruction operates. Operands
    can be in registers or in memory or part of the instruction itself. When the operand
    is in a register, the operand is specified simply by giving the register number
    (0 through 15). This requires only 4 bits.


    However, in the original architecture, when an operand is in memory, the memory
    address is specified as a combination of a base register, an unsigned displacement
    and, in some instructions, an optional index register. The address is calculated
    by adding the contents of the base register, the value of the displacement and,
    if present, the contents of the index register. The resulting number is the address
    of the operand in memory.


    Displacements in the original architecture are all 12 bits unsigned numbers ranging
    in value from 0 to 4095. In some newer instructions, the displacements may be
    20 bit signed numbers.


    Registers are always specified with 4 bits (a range of 0 to 15). So, to specify
    an operand that is a memory, an instruction format needs, at a minimum, between
    16 and 20 bits (a 12 bit displacement and one or two register specifications at
    4 bits each).'
  merge: -1
  img_proc: true
