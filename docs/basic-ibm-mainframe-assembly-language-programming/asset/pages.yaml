  md: '# 14. Load Instructions


    The architecture provides a number of instructions to load the contents of registers
    and these are detailed next. For purposes of programming examples, only the basic
    load instructions will be used but a complete list is given in Table 32.


    # 14.1 Load (L)


    The basic load instruction loads a 32 bit word from memory into a general purpose
    register. The word in memory should be on a word boundary (a memory address evenly
    divisible by 4). The Condition Code is unchanged. Load is of format RX.


    ```

    L R5,L1

    ```


    Additional variations on the Load instruction are shown in Table 32. These vary
    on the size of the data loaded and the memory addressing method. Instructions
    not offered on the original architecture are shown shaded.


    # 14.2 Load (LR)


    The contents of the register specified as the second operand are copied to the
    register specified as the first operand. The Condition Code is unchanged. LR is
    of format RR.


    ```

    LR R5,R6

    ```


    # 14.3 Load Multiple (LM)


    One or more general purpose registers are loaded from consecutive words beginning
    at the memory address specified as the second operand. The Condition Code is unchanged.
    The LM is of type RS. The registers to be loaded begin with the register specified
    as the first operand through and including the register specified as the third
    operand. If the register specified as the first operand is greater than the register
    specified as the third operand, wrap around occurs. If the first and third operands
    both specify the same register, only 4 bytes are loaded.


    ```

    LM R1,R5,L1  * R1,R2,R3,R4 and R5 are loaded

    LM R6,R4,L2  * R6,R7, ... R0,R1, ... R4 are loaded.

    ```


    # 14.4 Load and Test (LTR)


    The contents of the register specified as the second operand are loaded into the
    register specified as the first operand and the Condition Code is set to reflect
    the value of the fixed point binary integer word copied. Often both operands are
    specified as the same register in which case the only effect is to set the Condition
    Code. The LTR is format RR. The Condition Code is set as follows:'
  merge: -1
  img_proc: true
- pgno: 135
  md: '```

    CC=0 Zero;

    CC=1 Negative;

    CC=2 Positive.

    ```


    # 14.5 Load Positive (LPR)


    The absolute value of the signed binary value in the register specified as the
    second operand is loaded into the register specified as the first operand. Both
    operands may be the same register. The Condition Code is set. The LPR is format
    RR. The largest negative number has no positive equivalent and this case can generate
    an overflow. The Condition Code is set as follows:


    ```

    CC=0 Zero, no overflow

    CC=1 Not possible

    CC=2 Greater than zero, no overflow

    CC=3 Overflow

    ```


    # 14.6 Load Negative (LNR)


    The 2s complement of the absolute value of the signed fixed point binary integer
    contained in the register specified as the second operand is loaded into the register
    specified as the first operand. The Condition Code is set. LNR is of format RR.
    The Condition Code is set as follows:


    ```

    CC=0 Zero

    CC=1 Negative

    CC=2 Not possible

    CC=3 Not possible

    ```


    # 14.7 Load Complement (LCR)


    The LCR loads into the register designated as the first operand the 2s complement
    of the contents of the register designated as the second operand. Both register
    designations may be the same in which case the contents of the designated register
    are complemented. A value of zero in is unchanged (the 2s complement of 0 is 0).
    The Condition Code is set as follows:


    ```

    CC=0 Result 0

    CC=1 Result negative

    CC=2 Result positive

    CC=3 Overflow

    ```


    # 14.8 Load Address (LA)


    The load address instruction is an RX instruction which calculates the address
    specified by the second operand and places the result into the register specified
    as the first operand. No memory access is made. The instruction only performs
    the address arithmetic. In 24 bit addressing mode the result is 24'
  merge: -1
  img_proc: true
- pgno: 136
  md: 'bits while in 31 bit addressing mode the result is 31 bits. All address arithmetic
    is done with positive numbers only.


    The LA is also used as a fast way to load small constants into registers and to
    do limited positive binary arithmetic. It can also be used to add the positive
    contents of two registers in one operation. Examples:


    +   1. Load the constant 22 into R5: LA R5,22(R0,R0) Since R0 does not participate
    in address arithmetic, the effective result of the address calculation is 22 which
    is loaded into R5. This is considerably faster than a load instruction with a
    4 byte memory operand.

    +   2. Increment the contents of R5 by 10 (contents of R5 must be positive and
    no more than 24 or 31 bits in length, depending upon the current addressing mode).
    LA R5,10(R0,R5) The value in R5 and 10 are added and the result replaces the contents
    of R5. Again, R0 does not participate. This is considerably faster than an Add
    instruction with a four byte memory operand.

    +   3. Add the contents of R2 and R3 and place the result in R5. Assumes that
    R2 and R3 have positive values not greater than 24 or 31 bits (depending on addressing
    mode) and the result will be less than 31 or 24 bits in length (depending on addressing
    mode) LA R5,0(R2,R3) For small positive values, this instruction replaces as SR
    and two AR instructions and is very fast (address arithmetic is the fastest form
    of arithmetic).'
  merge: -1
