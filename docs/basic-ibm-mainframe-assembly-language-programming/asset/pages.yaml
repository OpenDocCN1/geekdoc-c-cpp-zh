    \ when the contents of R3 become equal to 101.\n\n```\n```text\n 1          PRINT\
    \       NOGEN\n 2  SUM100   SUBENTRY\n 3          REGS\n 4          SR       \
    \   R2,R2       * zero R2\n 5          L           R3,=F'1'    * init R3\n 6 \
    \ LOOP    AR          R2,R3\n 7          A           R3,=F'1'    * incr R3\n 8\
    \          C           R3,=F'101'\n 9          BL          LOOP\n10          XDECO\
    \       R2,DBL\n11          XPRNT       DBL,L'DBL\n12          SUBRETURN\n13 \
    \         LTORG\n14  DBL     DS          CL12\n15          END\n```\n```\n\n*Figure\
    \ 50 Loop Example*\n\nIn Figure 50 we see another form of the BC instruction being\
    \ used: the extended mnemonic form. The BL (Branch Low) on line 9 is really a\
    \ BC with a mask of B'0100'. There are several of these forms accepted by the\
    \ assembler as shown in Table 18. They help make your program more readable but\
    \ are, in reality, an ordinary BC instruction with the appropriate mask filled\
    \ in by the assembler."
