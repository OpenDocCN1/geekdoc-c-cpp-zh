  md: 'Where 45₁₆ is the opcode, F₁₆ (R15) is the R1 field, F₁₆ (R15) is the B2 field
    (base register), 0 (R0) is the X2 (index register) field and 06B₁₆ is the D2 field.


    In the memory dump area, the presence of "........" in the address column means
    the missing lines are the same as the line above.


    Looking at the general purpose registers you can see the contents of the base
    register, R13, are 80008008₁₆. The high order bit is 1 (hence the leading 8) and
    only the lower 31 bits are used for addressing. This corresponds to the address
