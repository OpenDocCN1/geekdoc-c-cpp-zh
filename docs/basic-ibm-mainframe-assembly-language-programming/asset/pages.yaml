- pgno: 103
  md: 'discussed below in Section 23.7. XDECO is a pseudo RX instruction in the Assist
    package that converts the signed fixed point binary integer in the register specified
    as the first operand to a 12 byte signed, right justified, decimal character string
    (zoned decimal) padded to the left with blanks. It places the result in memory
    beginning at the address specified as the second operand.


    ```

    1          PRINT           NOGEN

    2     ADD    SUBENTRY

    3            EQUREGS

    4     SR             R2,R2    *Zero R2

    5     A      R2,ONE

    6     A      R2,TWO

    7     A      R2,THREE

    8     A      R2,FOUR

    9     A      R2,FIVE

    10    XPRNT   MSG,L''MSG

    11          SUBEXIT

    12    MSG    DC      C''Adding Numbers''

    13    ONE    DC      F''1''

    14    TWO    DC      F''2''

    15    THREE  DC      F''3''

    16    FOUR   DC      F''4''

    17    FIVE   DC      F''5''

    18          END

    ```


    Figure 44 ADD.MLC Step 5


    Note that the operand on the DS instruction labeled OUT is CL12. This format means
    character length 12 or, one character string with a length attribute of 12. Another
    way of allocating it would be an operand of 12C which means 12 character strings
    of length one (one is the implied, default length of a character). However, this
    later notation would not work with the L''OUT figure in the XPRNT which evaluates
    to the length attribute of OUT. The value of L''OUT would be 1, not 12. Used in
    this manner 12 is a duplication count, not a length.


    We assemble, link and execute the code from Figure 45 with the command:


    assist add


    Note that you do not include the .MLC ending. The command assembles the program
    and, if there are no errors, runs it. The assist command tells the assembler to
    use the Assist package of pseudo-instructions. The results are shown in Figure
    46 (long lines truncated). Prior to the lines printed by the ADD program, you
    see the separate steps the process entails: assembly'
