    Note the initial DS 0F which aligns what follows to begin to a full word boundary.
    If the DS 0F had not been present, it is possible that INDEX may have been assigned
    to a non-fullword boundary because it is a character string and requires no alignment.
    However, IPT R does require a full word and would have resulted in padding bytes
    to be inserted until a fullword boundary was achieved. As a consequence, INDEX
    and IPT R would not share the same address.


