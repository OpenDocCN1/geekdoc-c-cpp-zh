  md: '# 10. Assist Macro Input/Output


    Normally, input/output on the IBM mainframe architecture involves mastering a
    set of somewhat complex underlying operating system macros some of which are covered
    in Chapter 21. However, for purposes of this text, the simplified Assist pseudo
    instructions XREAD, XPRNT, XDECO, XDECI, XDUMP, XHEXO, and XHEXI are used.


    In some systems the Assist package is implemented as macros, in others, such as
    the z390 package, they are pseudo-instructions. That is, they appear in code as
    though they were actual instructions.


    These macros or pseudo-instructions handle reading, printing, conversion from
    fixed point binary to printable decimal and the reverse, memory dumps, conversion
    from fixed point binary to printable hexadecimal, and printable hexadecimal to
    fixed point binary. These are considerably simpler to use than the underlying
    system macros.


    # 10.1 Input / Output using XREAD and XPRNT


    In the z390 emulator, by default, the XREAD pseudo-instruction reads from a file
    with the same name as the file containing the assembly language source program
    but with the .XRD extension. The output file from the XPRNT pseudo-instruction
    has the same name as your assembly language source program file but with the .XPR
    extension. XPRNT output will also appear in the console window. Note the spelling
    of XPRNT.


    The general format of the XREAD is:


    ```

    ```

    [LABEL] XREAD INFIELD,LENGTH

    ```

    ```


    The LABEL is optional. INFIELD is the address of the area of memory into which
    data will be read. This address may be specified in the same manner as a second
    operand in an RX instruction but is usually just a label. The length is specified
    as either a constant or as a register enclosed in parentheses. If specified as
    a register, the value in the register at runtime is the length used.


    On a PC, the z390 emulator converts ASCII input lines to EBCDIC with carriage-returns
    and line-feeds removed. Short records are padded to the right with blanks (40_hex
    in EBCDIC) to fill the input area to the length specified. Long input records
    (that is, those that exceed the length stated in the XREAD) are truncated. In
    the event of an error, the program aborts with an abend (abnormal end) code of
    S013. If you attempt to read beyond end-of-file, the Condition Code is set to
    1, 0 otherwise.'
  merge: -1
  img_proc: true
- pgno: 97
  md: <!-- no content -->
  merge: -1
