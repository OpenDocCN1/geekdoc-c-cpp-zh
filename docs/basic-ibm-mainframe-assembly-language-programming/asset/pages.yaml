- pgno: 82
  md: 'upon the addressing mode. In 24 bit addressing mode, bits 32 through 39 of
    the 64 bit register are set to zero. In 31 bit addressing mode, bit 32 is set
    to one. In 24 and 31 bit addressing mode, bits 0 through 31 of the first operand
    remain unchanged. In 64 bit mode, the entire register specified as the first operand
    receives the address.


    # 8.3.3 Branch Relative and Save (BRAS/BRASL)


    ```

    BRAS  R1,I2

    BRASL R1,I2

    ```


    These instructions are comparable to the BAS/BASR instructions. The register specified
    as the first operand is loaded with the updated address portion of the PSW in
    the same manner as the BAS/BASR.


    In the BRAS instruction there is a 16 bit immediate field which is treated as
    a signed binary number. In the BRASL, there is a 32 bit immediate field which
    is likewise treated as a signed number. BRAS is an RI format instruction while
    BRASL is an RIL format instruction (see section 6.8.1).


    In both instructions, the branch address is computed by adding the twice the value
    of the immediate field to the current instruction address. That is, the immediate
    field is treated as the number of half words to jump relative to the current instruction
    address. All instructions must begin on half-word boundaries.


    # 8.4 Looping Branch Instructions


    Looping normally involves three separate actions: an arithmetic calculation, a
    comparison and a conditional branch. For example, to loop through a section of
    code ten times you need a counter (usually a register) initialized to zero, an
    add instruction to increment the counter, a compare instruction to see if the
    counter has reached nine followed by a conditional branch instruction to iterate
    if it hadn''t.


    Since this is such a common sequence of events, the architecture provides several
    instructions that perform all three operations in one instruction.


    There are three looping instructions families with several variations in how the
    branch address is calculated and the number of bits in the operands. These are:


    +   1. Branch Index Low or Equal: the loop continues so long as an index is less
    than or equal to a limit;

    +   2. Branch Index High: the loop continues so long as the index is greater than
    a limit; and'
  merge: -1
  img_proc: true
- pgno: 83
  md: '# 3. Branch on Count: loop until a counter reaches zero.


    The operands in these instructions (the count, index and limit values) can be
    either 32 or 64 bits, depending on the instruction. The branch address is specified
    either as a register, a base/displacement, or a relative address (on offset from
    the current instruction''s address).


    # 8.4.1 Branch Index Low or Equal (BXLE)


    The first of these is the BXLE instruction, Branch on Index Low or Equal. The
    instruction is an RS instruction which has the explicit format:


    ```

    BXLE R1,R3,D2(B2)

    ```


    The instruction operates as follows: first, an increment is added to the contents
    of the register specified as the first operand. The value in the first operand
    is then compared with a limit value and a branch takes place to the address specified
    by the second operand, the result of the D2(B2) calculation, if the result of
    the comparison indicates that the contents of the first operand are less than
    or equal to the limit value.


    The third operand, the R3 in the above, is used to determine both the increment
    and the limit values. If the register designated as R3 is even, it is the even
    register of an even odd pair of registers. In this case, the even register of
    the pair contains the increment and the odd register contains the limit value.
    If the register designated as R3 is odd, its contents are used as both the limit
    and the increment.


    | Line | Label/Mnemonic | Operands |

    |---|---|---|

    | 1 | PRINT | NOGEN |

    | 2 | EQUEREGS |  |

    | 3 | SUM100 | SUBENTRY |

    | 4 |  |  |

    | 5 | SR | R2,R2 |

    | 6 | L | R3,ONE |

    | 7 | L | R4,ONE |

    | 8 | L | R5,HUNDRED |

    | 9 | LOOP | AR R2,R3 |

    | 10 | BXLE | R3,R4,LOOP |

    | 11 | XDECO | R2,OUT |

    | 12 | XPRNT | OUT,L''OUT |

    | 13 | SUBRETURN |  |

    | 14 |  |  |

    | 15 | ONE | LTORG |

    | 16 | HUNDRED | DC F''100'' |

    | 17 | OUT | DS CL12 |'
