    # 22.8 Example EQUREGS Macro


    The purpose of the EQUREGS macro is to generate sixteen lines of the form:


    ```

    R0 EQU 0

    R1 EQU 1

    R2 EQU 2

    ...

    ```


    We could do this with 16 EQU statements or, as shown in Figure 81, as a macro.
    On line 3 we declare a local arithmetic set symbol &R and, on line 4, initialize
    it to zero. Lines 5 through 8 constitute a loop. Line 6 is the only line that
    generates code for the assembler. The lines it generates have a label constructed
    by the concatenation of the letter R with the numeric value of the set symbol
    &R followed by blanks, the string EQU and the value of &R. Thus, each time line
    6 is processed by the pre-processor, another EQU statement is generated into the
    user''s program.


    The first EQU generated is for &R with a value of zero. In line 7, however, &R
    is incremented. On line 8 we test if the value in &R is less than 16 and, if it
    is, we branch to the sequence symbol'
