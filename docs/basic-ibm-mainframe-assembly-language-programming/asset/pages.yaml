  md: '# Figure 32 BXLE Loop Example


    There are several instructions that use even/odd register pairs.


    The valid pairs are:


    +   - R0/R1

    +   - R2/R3

    +   - R4/R5

    +   - R6/R7

    +   - R8/R9

    +   - R10/R11

    +   - R12/R13

    +   - R14/R15


    The program in Figure 32 gives an example of a BXLE. This program adds the first
    100 numbers into R2 and then prints the result. Lines 5 through 8 we initialize
    the registers. On line 5, R2 is set to zero by subtracting it from itself. R3
    will be the BXLE''s counting register which is set to 1. R4 will be the increment
    register, also set to 1 and R5 is the limit register, set to 100.


    The contents of R3 are added to the contents of R2 in line 9. The BXLE (line 10)
    then increments R3 by 1 (from contents of R4) and compares the result with 100
    (contents of R5). The BXLE branches to LOOP so long as the value in R3 is less
    than or equal to 100. When R3 becomes 100, execution continues with the XDECO
    which converts the fixed point binary value in R2 to printable digits in the 12
    byte string OUT. The XPRNT prints the result to the screen. The second operand
    of the XPRNT is the length of the string OUT.


    The data declarations on line 15 and 16 create two full word fixed point binary
    values in memory initialized with the values 1 and 100, respectively. The declaration
    on line 17 reserves storage for a character string of length 12 but does not initialize
    it (DC statements initialize, DS statements only reserve memory).


    The advantage of the BXLE instruction is that it combines the increment, comparison
    and conditional branch into one instruction and thus, in a loop iterated many
    times, results in considerably faster execution. The disadvantage is that it ties
    up several registers in the process. But, in many circumstances, it is justified.


    In the BXLE, the addition and comparison operations treat the operands as 32 bit
    signed integers but any overflow that may be caused by the addition is ignored.


    # 8.4.1.1 Branch Index Low or Equal 64 bit (BXLEG)


    ```

    BXLEG R1,R3,D2(B2)

    ```'
