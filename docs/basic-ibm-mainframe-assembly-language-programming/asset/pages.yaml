  md: '# 18.6 DSECTs


    A DSECT is a code section which contains ordinary assembly language statements
    but no object code is generated. They are mainly used as layouts to assist in
    writing programs.


    For example, consider a program with an array structured phone directory. Each
    entry in the array consists of a 30 character name, a 30 character city, a two
    character state code, a 5 character zip code and a 10 character phone number for
    a total of 77 bytes for each entry. Assume the array is 77,000 bytes long, log
    enough for 1,000 entries. Figure 64 gives a code fragment to print each element
    of the array. It loops 1,000 times, until R3 becomes zero, by means of the BCT
    on line 9. Each XPRNT statement prints a part of the structure using displacements
    from the start of each array entry. R2 is a pointer that is advanced from the
    beginning of each array entry to the next.


    Figure 65 shows the same code using a DSECT. In this example, the name of the
    current CSECT is PGM. Lines 1 through 6 define the DSECT which is named ID. Line
    7 ends the DSECT and resumes the CSECT PGM (we interrupted the code for PGM on
    line 1).


    ```

    1   LA      R2,ARRAY

    2   L       R3,=F''1000''

    3 LOOP    XPRNT 0(R2),30      * NAME

    4        XPRNT 30(R2),30      * CITY

    5        XPRNT 60(R2),2       * STATE

    6        XPRNT 62(R2),5       * ZIP

    7        XPRNT 67(R2),10      * PHONE

    8        LA   R2,77(0,R2)     * INCR POINTER

    9        BCT  R3,LOOP

    Figure 64 Table without DSECT

    ```


    The DSECT is a layout for an element in the array. It does not actually reserve
    memory in the object module.


    On line 8 we load the address of the data array into R2 and on line 9 tell the
    assembler that any references to data described in the DSECT ID should be based
    on R2. Consequently, when we reference the labels from the DSECT in lines 11 through
    15, the assembler generates code relative to R2 with displacements calculated
    from the beginning of the DSECT (NAME has a displacement of 0, CITY a displacement
    of 30, STATE a displacement of 60 and so on).'
  merge: -1
  img_proc: true
- pgno: 170
  md: 'There are several obvious advantages to the DSECT approach not the least of
    which are readability. It should also be noted that, should the data structure
    change, say, to enlarge the name field, it need be done only in the DSECT itself
    and not in each of the XPRNT statements.


    ```

    1  ID      DSECT

    2  NAME    DS      CL30

    3  CITY    DS      CL30

    4  STATE   DS      CL2

    5  ZIP     DS      CL5

    6  PHONE   DS      CL10

    7  PGM     CSECT

    8         LA      R2,ARRAY

    9         USING   ID,R2

    10        L       R3,=F''1000''

    11 LOOP    XPRNT   NAME,L''NAME      * NAME

    12        XPRNT   CITY,L''CITY      * CITY

    13        XPRNT   STATE,L''STATE    * STATE

    14        XPRNT   ZIP,L''ZIP        * ZIP

    15        XPRNT   PHONE,L''PHONE    * PHONE

    16        LA      R2,77(0,R2)      * INCR POINTER

    17        BCT     R3,LOOP

    ```


    Figure 65 Table with DSECT'
