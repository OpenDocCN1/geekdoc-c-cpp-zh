- pgno: 221
  md: 'If the value of an entry is greater than the value of the entry above it, their
    contents are swapped with one another. When a pair of entries are swapped, a flag
    is set to indicate that a swap has taken place.


    After all entries have been compared, the flag is examined. If the flag indicates
    that a pair of entries were swapped, the process is repeated. If the flag indicates
    that no swap took place, the sort is finished and the results are printed.


    In the program R2 is the counter from 0 to 9 and R8 is the swap flag. At the beginning
    of the outer loop these are both set to zero (lines 4 and 5).


    Inside the inner loop we convert the counter contained in R2 to an offset relative
    to the table start and store it in R4. That is, the value of the counter is 0,
    1, 2, ..., but we need the actual offset into the table in order to address the
    entries. These are of the form 0, 4, 8, 12, ...


    To convert the count into an offset, we load the count into R4 and then shift
    the value left by two bits (lines 7 and 8). A shift left by 2 is the equivalent
    of multiplying by 4 and thus the value becomes our offset.


    We load the value from the table into R3 on line 9. Note that the format of the
    statement in line 9 causes R4 to be used as the index register. Thus, the value
    we load is at TAB+R4.


    Next we load into R5 the value of R4 incremented by 4 (Line 10). We use the LA
    instruction which sums the value of R4 and the displacement (4) and places the
    result in R5. Now R5 is the offset into the table of the element just above the
    element whose value is in R3.


    On line 11 we compare the contents of R3 with the value in the table at offset
    R5. If the contents of R3 are greater than the value of this element, we branch
    to the section of code where we swap the contents (SWAP).


    If we do not swap, we advance to line 14 and increment R2. We compare the contents
    of R2 with 9. If the value in R2 is less than 9 we continue and execute another
    loop cycle (note: the value in R2 will range between 0 and 8 which is nine values
    - our first offset to be zero). If not, we have completed a full 9 iterations
    of the inner loop.


    Next we check the contents of R8. If the value in R8 is zero, it means that all
    nine iterations of the inner loop resulted in no swap and the table is now sorted.
    So we branch to the location where we print the results. If the contents of R8
    are not zero, we branch to the top of the outer loop and reset R2 and R8.'
