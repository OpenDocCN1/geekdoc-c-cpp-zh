- pgno: 19
  md: '# 2.2 Hexadecimal


    Internally, most modern computer memories are organized as a collection of 8 bit
    bytes grouped into words of 4 or 8 bytes each. However, when printing the contents
    of memory, representing bytes and words in binary digits yields inconveniently
    long sequences of 1s and 0s. To avoid this we use hexadecimal, that is, base 16
    numbers.


    Note that a byte consists of two 4 bit fields and that in 4 bits you can count
    from 0 to 15 (16 values). A single digit hexadecimal number also ranges from 0
    to 15. Thus, you can represent the contents of any byte with exactly 2 hexadecimal
    digits, one digit for the first 4 bits and a second digit for the second 4 bits.
    Since 16 is itself a power of two, conversion between a digit in base 16 and the
    corresponding value in base 2 and back is a trivial substitution as can be seen
    in Table 1.


    In order to use base 16 we need 16 symbols to represent the digits of the numbering
    system (the equivalent of 0₁₀ through 15₁₀). For the first 10 digits, we use the
    same symbols as the decimal numbering system (0 through 9). For digits above nine,
    representing the values 10₁₀ through 15₁₀, we use the upper (or lower) case letters
    A, B, C, D, E, and F (see Table 1).


    When we have a binary numbers longer than 4 bits, we group the bits, from right
    to left, into groups of 4 bits each and then substitute the equivalent hexadecimal
    code. Thus, if you have a binary number such as:


    ```

    0000 0001 1010 1011 0010 0011 0111 1000

    ```


    Using the values from Table 1, it can be represented in hexadecimal as:


    | 0000 | 0001 | 1010 | 1011 | 0010 | 0011 | 0111 | 1000 | bin |

    |---|---|---|---|---|---|---|---|---|

    | 0 | 1 | A | B | 2 | 3 | 7 | 8 | hex |


    Conversion from a hexadecimal number (also referred to as hex) to its equivalent
    decimal notation, however, requires more work because there is a fundamental change
    in base. When you want the decimal value of a hex number, you need to sum, in
    decimal, the contributions of each hex digit. To do this, a table such as that
    in Table 2 is useful. It gives, for each hex digit position (up to an eight digit
    hex number), the contribution of that digit expressed in decimal.


    Thus, if you have the hexadecimal number such as: 01 AB 23 78, it can be converted
    to decimal by adding the positional decimal equivalent contributions of each of
    the hex digits as shown in Table 3.'
