  md: '# 19. Subroutine Calls and Linkage


    Linkage refers to the set of conventions used by an operating system whereby programs
    call one another, pass arguments, and return values. The IBM mainframe still uses
    many of the original linkage conventions established when the machine was introduced
    in 1964 although there have been additional modes added since then. For purposes
    of this text, we have mainly used the legacy linkage as embodied in the SUBENTRY
    and SUBEXIT macros provided by the z390 emulator. These macros follow the legacy
    31 bit program linkage conventions. Depending on addressing mode and other language
    dependent conditions, such as calling programs written in C/C++, other linkage
    conventions may apply.


    SUBENTRY saves the contents of the calling program''s registers in the calling
    program''s save area, creates a local save area to be used by any programs our
    program calls, and sets up a base register. SUBEXIT restores the calling program''s
    registers and branches back to the calling program.


    # 19.1 Linkage Registers


    On entry into a routine, several registers have predefined values as shown in
    Table 38.


    Table 38 Linkage Registers


    | Register | Description |

    |---|---|

    | R1 | Address of a parameter list |

    | R13 | Address of save area in calling program |

    | R14 | Address of return point in calling program |

    | R15 | Address of entry point in called program |


    +   1. On entry to a routine, R1 points to a table of addresses in memory. Each
    address, in turn, points to an argument being passed to the subroutine.

    +   2. On entry, R13 points to the address in the calling program of a 72 byte
    save area where the called program will store most of the calling programs registers.
    There are restore on exit from the called program.

    +   3. R14 contains the return address. That is, when your program has finished,
    it should branch to the address contained in R14.

    +   4. R15 contains the address of the entry point in the called program. Normally
    this is the address of the first instruction in the called program however some
    routines can have multiple entry points. In any event, R15 is the address of the
    first instruction to be executed upon entry into your routine. It is also provided
    by the calling program.'
  merge: -1
  img_proc: true
- pgno: 173
  md: '5. Upon entry into a program, it is the responsibility of the called program
    to save the calling programs registers and, upon exit, to restore them.


    6. There are two places where a program saves registers. The first is in a save
    area provided by the calling program (pointed to by R13) and the second is in
    a system-provided linkage stack.


    7. The ASC mode of the called program determines which method may be used. A primary
    mode program may use either the linkage stack or the calling program''s save area
    while an AR mode program must use the linkage stack.


    8. The save area provided by the calling program may be statically allocated in
    the calling program or it may be a dynamically allocated area. Save areas for
    programs operating in 31 or 24 bit addressing modes are 18 full words or 72 bytes
    in length.


    # 19.2 Static Save Area


    In the original linkage model, every program that may call another program has
    a local save area. Lowest level programs that call no other programs, do not need
    a local save area A save area, as shown in Table 39, is an 18 full word (72 byte)
    area (assumes 31 bit or 24 addressing mode) in which you save the contents of
    registers. It is also helpful for debugging by providing a linked list of pointers
    to previous save areas. Note: There are newer linkage models that permit the save
    area to be allocated on a system stack thus permitting recursion, multi-threading
    and so forth.


    By convention, upon entry, R13 will contain the address of a save area in the
    calling program''s data area. When your routine starts, it should immediately
    save the contents of all the general purpose registers (except R13) into the calling
    program''s save area. Then you create a save area of your own and, after some
    cross linking, place the address of your program''s save area in R13.


    The z390 provides a macro named SUBENTRY to do the basic program entry tasks.
    This code saves the calling program''s registers and sets up your local save area.
    An example of the code generated by the SUBENTRY macro as shown in Figure 66 SUBENTRY
    Code. The line numbers are from the assembler and the plus sign after each indicates
    that the code is from a macro expansion (non-macro code does not have a plus sign
    on the line number).'
