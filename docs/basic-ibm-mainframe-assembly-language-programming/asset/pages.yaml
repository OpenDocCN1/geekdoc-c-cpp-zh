    # Figure 71 Add Program Details


    On the far right column is the attempted character interpretation of the bytes.
    It tells us that the first eight bytes of the line''s content correspond to the
    characters: 09/14/10 which appears to be a date. The remaining 8 bytes did not
    have printable equivalents. This is indicated by the periods.


    Comparing the code from Figure 71 with the dump in Figure 72, we can see that
    the program''s first executable instruction (line 4) is the Store Multiple RS
    instruction:


    ```

    STM 14,12,12(13)

    ```


    which corresponds to the machine code:


    ```

    90ECD00C

    ```


    Which corresponds to the RS format (See Figure 12):


    | Op Code | R1 | R3 | B2 | D2 |

    |---|---|---|---|---|

    | 90 | E | C | D | 00C |

    | 0 | 8 | 12 | 16 | 20 | 31 |


    Where the opcode is 90₁₆, E₁₆ (R14) is in the R1 field, C₁₆ (R12) is in the R3
    field, D₁₆ (R13) is in the B2 field and 00C₁₆ is in the D2 field.


    If you look in the dump at address 8000₁₆ you will see the same code for the STM
    instruction. Location 8000₁₆ is the first byte of the program. In fact, because
    of the emulator, all programs will appear to begin at location 8000₁₆.


    Moving on, the next instruction following the STM is:


    ```

    BAL 15,104(15)

    ```


    which is the Branch and Link RX instruction and translates into the machine language:


    ```

    45FF0068

    ```'
