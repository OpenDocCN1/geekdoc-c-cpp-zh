- pgno: 175
  md: 'The next instruction, the BAL (Branch and Link), does two things: it causes
    a branch to the ST (Store) instruction on line 10 and it resets the contents of
    R15 to point to the first byte of the local 18 full word save area immediately
    following it. This is the current program''s save area. Note that it is statically
    (i.e., not dynamically) allocated.


    The branch address in line 5 is calculated by adding the contents of R15 and 104,
    the displacement which is sufficient to branch around the save area and the fixed
    length program name information. The ST instruction at line 10 is 104 bytes from
    the beginning STM.


    R15 receives the address of the first byte of the save area (because of the BAL)
    but not until after the branch address is calculated. The BAL first calculates
    the branch target address. Then it loads into the first operand, R15, the updated
    address portion of the PSW, that is, the address of the byte immediately following
    the BAL. Finally, it branches.


    As an instruction executes, the address portion of the PSW always contains the
    address of the byte immediately following the instruction. In most cases, this
    is the address of the next instruction. In this case, however, it is the address
    of our program''s save area.


    At line 10, the ST instruction stores the address of our save area into the third
    word of the calling program''s save area then stores the address of the calling
    program''s save area in the second word of our save area. Thus, the calling program''s
    save area points to ours and ours points to the calling program''s save area.


    The contents of R15 (now the address of our save area) are copied to R13 and the
    assembler is told to use R13 as a base register and to assume that it is pointing
    at the 8th byte of the program (the 1st byte of the save area) which it is.


    You will note that after the 18 word save area there are character fields containing
    the name of the CSECT and the date and time when it was assembled.


    Happily all this is done by the SUBENTRY macro. Likewise, the SUBEXIT macro reloads
    the calling program''s registers and returns to the address originally provided
    in R14.


    # 19.3 Linking Reentrant and Recursive Programs


