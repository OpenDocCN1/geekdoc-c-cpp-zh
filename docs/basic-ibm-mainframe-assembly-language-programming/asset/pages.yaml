    Figure 17 RIL Formats


    # 6.8.2 RIE Format


    The RIE format, shown in Figure 18 is used in only two instructions: the Branch
    Relative on Index High and the Branch Relative on Index Low or Equal (BRXHG/BRXLG)
    where the immediate operand is used as a signed relative branch address in multiples
    of halfwords.


    ![](img/4b7e9c58cac527296b19b501116daeb1_68_1.png)


    Figure 18 RIE Format


    # 6.8.3 RRE Format


    RRE (register register extended), shown in Figure 19, is similar to RR instructions
    but the opcode is 16 bits long. Bits 16 through 23 of these instructions are not
    used. This format is used in many instructions that extend the original RR format
    instruction set to accommodate two 64 bit register operands or one 64 and one
    32 bit register operands. Examples include Add (AGR and AGFR).


    ![](img/4b7e9c58cac527296b19b501116daeb1_68_2.png)


    Figure 19 RRE Format


    # 6.8.4 RSL Format


    The RSL format, shown in Figure 20, is used only with the Test Decimal (TP) instruction.'
