  md: 'A simple way to construct a decimal mask is to remember that the bit positions
    in the mask each have a decimal equivalent. By adding the decimal equivalents
    of the bit positions, a final decimal mask can be created. The equivalents are
    shown in Table 18. So, if you want to branch if the Condition Code is either 0
    or 3, the decimal mask would be 9 (8+1).


    The BCR instruction is similar to the BC. The first operand is the four bit mask
    with the same meanings as in the BC instruction. The second operand is a register
    which contains the branch address. However, should the second operand be specified
    as R0, no branch will ever take place since R0 means no register when used in
    an addressing context.


    Additionally, there are built in extended mnemonic branch instructions. These
    are no additional instructions but variations of the basic Branch Conditional
    instruction where the assembler will fill in the mask for you. These are shown
    in Table 19. The purpose of these is to make your program more readable. Instead
    of using the mask codes, you use a mnemonic which is indicative of the purpose.
    The assembler interprets these as either a BC or BCR with a predetermined mask.
    Some mask settings (such as 8) have more than one extended representation: BE
    after a Compare instruction (Branch Equal) and BZ after an arithmetic instruction
    (Branch Zero). Because the mask is the same, they are interchangeable.


    # 8.2.2 Branch Relative on Condition (BRC)


    ```

    BRC M1,I2

    ```


    The Branch Relative on Condition instruction is a newer RI format (see section
    6.8.1) instruction which is similar to the BC instruction. However, the branch
    address is calculated by adding twice the value of the signed 16 bit immediate
    operand to the current instruction address. Hence the term Relative in its name.
    Since all instructions must begin on an even memory address, an odd relative offset
    would make no sense. Doubling the relative offset also increases the range of
    the offset. The value in the relative operand is specified in halfwords.


    # 8.2.3 Branch Relative on Condition Long (BRCL)


    ```

    BRCL M1,I2

    ```


    The Branch Relative on Condition Long is an RIL format (see section 6.8.1.1 instruction
    similar to the BRC instruction except that the immediate operand is 32 bits in
    length. The value in the relative operand is specified in halfwords.'
  merge: -1
  img_proc: true
