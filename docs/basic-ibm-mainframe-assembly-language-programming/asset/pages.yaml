    8    C                R3,=F''16''

    9    BC               B''1100'',LOOP

    10   XPRNT             MSG,L''MSG

    11   XDECO             R2,DBL

    12   XPRNT             DBL,L''DBL

    13   SUBEXIT

    14 MSG DC              C''Adding Numbers''

    15 ONE DC              F''1''

    16    DC              F''2''

    17    DC              F''3''

    18    DC              F''4''

    19    DC              F''5''

    20 DBL DS              CL12

    21   LTORG

    22   END

    ```


    Figure 49 ADD2.MLC


    If the contents of R3 are equal to 16, the Condition Code is set to 0, if contents
    of R3 are less than 16, the Condition Code is set to 1, otherwise, the Condition
    Code is set to 2. The BC instruction mask causes a branch if the Condition Code
    is either 0 or 1. When the contents of R3 exceed 16, the branch will not take
    place and the instruction following the BC instruction, the XPRNT (line 10), will
    execute.


    Looping code similar to this is very common in programming. In fact, so common
    that several instructions were added to the architecture to combine the increment/compare/branch
    operations as was discussed in section 8.4.


    The LTORG directive at the end tells the assembler to place any undefined literals
    at this place in your program. These include the =F''4'' and =F''16''. Note: if
    you do not include a LTORG, the assembler will place any literals it has accumulated
    at the end of your program anyway.'
