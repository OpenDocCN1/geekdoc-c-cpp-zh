- pgno: 107
  md: 'With regard to the second byte of the instruction (22₁₆), the first operand
    is designated by the first four bits and the second operand by the second four
    bits. Since a hex digit corresponds to four bits, the first hex digit (2) is the
    first operand and the second hex digit (2) is the second operand. Hence, the code
    1B22₁₆ is the machine language result for SR R2,R2.


    Since all RR instructions are two bytes in length, the location counter advances
    by 2 from 72₁₆ to 74₁₆.


    The next instruction is A R2,ONE which says to fetch the 4 bytes beginning at
    the label ONE and add them to the 4 bytes in register R2, leaving the result in
    R2. The Add instruction is an RX instruction and, as is the case with nearly all
    RX instructions (except the BC), has the format shown in section 6.7.2 above (the
    BC has a mask where R1 normally appears)


    From the Add instruction we get the hexadecimal machine language code of 5A20D0B0₁₆.
    The first byte (5A) is the opcode. The next byte contains the first operand (R2)
    and the index register (R0). The third byte contains the base register (D₁₆ or
    R13) and the first 4 bits of the displacement (0). The full displacement is 0B0₁₆
    or 176₁₀.


    The fully explicit notation for the Add would correspond to:


    A R2,176(R0,R13)


    Because we specified the second operand with the label ONE, the assembler has
    calculated that the address of ONE is at a displacement of B0₁₆ (leading zero
    omitted) relative to the contents of register 13. This means that, when the program
    runs, the address of ONE will be the sum contents of R13 plus B0₁₆ (176₁₀).


    So the question becomes, what''s in R13? If you look at the location counter you
    will see that ONE is at location B8₁₆ from the start of the program but the displacement
    of ONE, relative to the contents of R13, is B0₁₆. Thus, R13 must have 8 in it!.


    When we assemble our programs we do not know where in memory they will be placed.
    So, instead, the assembler tabulates addresses as though programs were all loaded
    at location zero. When the program runs, the first byte of our program will be
    located at an actual run time address which will not be zero. (In fact, the emulator
    makes it appear that our programs are always loaded at runtime at address location
    8000₁₆.)


    During the first few instructions of our program when our program actually runs,
    the SUBENTRY macro determines where in memory our program actually is located
    and sets the base'
  merge: -1
  img_proc: true
- pgno: 108
  md: 'register (R13) accordingly. This can be seen in Figure 3. It shows the expansion
    of the SUBENTRY macro.


    Several things happen in Figure 3. First, the BAL on line 4, loads R15 with the
    updated address portion of the PSW. This is the actual run time address of the
    eighth byte of the program. On line 11, the LR instruction copies this value from
    R15 to R13. Note: system macros use ordinary numbers for the registers, not numbers
    preceded by the letter R. The USING tells the assembler that R13 is our base register.


    Thus, when the program runs, R13 has the actual, real-live address of the eighth
    byte of our program. Because R13 is designated as the base register (line 12 in
    Figure 3), the assembler calculates all displacements relative to byte 8 which
    at run time is 8008₁₆ (in the emulator). Thus, if a label is 100 bytes from byte
    8 in the assembler location counter listing, it will be 100 bytes from 8008₁₆
    at run time.


    As noted, the assembler uses R13 as the base register due to the USING on line
    12 in Figure 3. USING is an assembler directive that does not generate code but
    tells the assembler which register to use as a base register and where the base
    register is pointing. In this case, it tells the assembler that R13 is pointing
    at HELLO+8, the eighth byte of the program. Since the SUBENTRY macro will always
    expands the same way in each program (except for the program name and date time
    stamp), if we use SUBENTRY, R13 will always be our base register, it will always
    point to the eighth byte of the program, and all displacements relative to the
    base register will be eight less than the location counter value for the label.
    SUBENTRY is not the only entry macro. Others may be used which could establish
    a different base register.


    Thus, the assembler, knowing that R13 can be used as a base register and that
    it is pointing 8 bytes into the program, seeing the label ONE in the Add instruction,
    calculates, correctly, that the label is at B0₁₆ or 176₁₀ bytes from the 8th byte
    of the program. Thus we see a displacement of 0B0₁₆ and a base register of R13
    in the machine code.


    The index register in the Add instructions in Figure 4 are all specified as R0.
    When R0 is used in an addressing context, it means no register. There is an R0
    and you can use it for arithmetic but if you use it in an address, it means no
    value is contributed regardless of the actual value in R0. Normally, the index
    register in an address will be R0 unless you explicitly tell the assembler to
    use it.'
  merge: -1
  img_proc: true
- pgno: 109
  md: '# 11.3 Data Addressing Alternatives


    The program in Figure 45 used several labels to address the data. An alternative
    program, which generates identical machine language code, can be seen in Figure
    48. Here only one label (ONE) is used for each of the second operands in the Add
    instructions but with an increment that takes into account the number of bytes
    from the label ONE to the desired operand.


    Since F type data each take four bytes of memory, the data for F''2'' begins at
    ONE+4, the next, F''3'', is at ONE+8 and so on. Since each DC inmstruction generates
    exactly four bytes of data, these are arranged at consecutive memory locations.


    Note that in some circumstances, padding bytes may be placed between data items.
    This occurs when the next data item requires an address alignment which the next
    byte lacks. In these cases, enough bytes are skipped after the last byte of the
    previous item to attain the required alignment. In the case of the example here,
    since F type data is aligned to addresses evenly divisible by 4 (word alignment)
    and the length of each is 4, each item is on consecutive word aligned boundaries.
    No padding bytes will occur.


    ```

    1    PRINT           NOSEN

    2    ADD             SUBENTRY

    3                    EQUREGS

    4    SR              R2,R2   *Zero R2

    5    A               R2,ONE

    6    A               R2,ONE+4

    7    A               R2,ONE+8

    8    A               R2,ONE+12

    9    A               R2,ONE+16

    10   XPRNT           MSG,L''MSG

    11   XDECO           R2,DBL

    12   XPRNT           DBL,L''DBL

    13                   SUBEXIT

    14   MSG  DC          C''Adding Numbers''

    15   ONE  DC          F''1''

    16       DC          F''2''

    17       DC          F''3''

    18       DC          F''4''

    19       DC          F''5''

    20   DBL  DS          CL12

    21                   END

    ```


    Figure 48 ADD1.mlc'
