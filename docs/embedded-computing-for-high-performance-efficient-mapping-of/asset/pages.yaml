    depends on data size or other runtime conditions, then it may be preferable to
    perform the mapping process at runtime. One possible runtime management system
    is shown in Fig. 3.23. Here, the application explicitly invokes managed tasks,
    which are dispatched to the Executive process. This Executive process determines,
    based on several factors, which available processing element the task should be
