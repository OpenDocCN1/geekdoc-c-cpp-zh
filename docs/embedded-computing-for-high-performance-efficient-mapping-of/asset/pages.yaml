  md: 'There are plenty of abstractions that may help to program applications and
    models. In addition to the inherent support for matrix operations as highlighted
    in this example, the support for regular expressions is another abstraction that
    provides enhanced semantic information in a compact form to a compiler. Recognizing
    a regular expression allows compilers to generate the most efficient implementation
    considering the target architecture, input data, and regular expression complexity.
    When direct support for regular expressions is not available, an implementation
    needs to be provided, which constrains the code transformations and optimizations
    of a compiler, and reduces opportunities for further transformations.


    The use of higher abstraction levels allows the code to capture a specification
    rather than an implementation. As a specification, it focuses on the operations
    that need to be done (what), as opposed to the way they are done (how). As a result,
    code using low-level abstractions and close to a target implementation may make
    it difficult to identify alternative implementation paths. Domain-Specific Languages
    (DSLs) [8] allow the level of abstraction to be increased by providing domain-specific
    constructs and semantics to developers with which they can convey critical information
    that can be directly exploited by compilers in pursuit of optimized implementations
    for a given design.


    The use of modeling languages and model-driven approaches has many benefits. Visual
    modeling languages such as Unified Modeling Languages (UMLs) [9] provide high
    abstraction levels and a specification of the application/system. They are, however,
    dependent on the capability of tools to generate efficient code and the availability
    of environments to simulate these models.


    High levels of abstraction can also be provided by environments such as Simulink
    [2] and Ptolemy [10]. These can be seen as component-based simulation and development
    frameworks where visual languages (e.g., structuring a program in terms of components)
    are mixed with textual languages (e.g., to program the behavior of each component).
    These environments provide the capability to mix different components, such as
    parts of the computing system and emulator interfaces to these environments, while
    using models for each component. They also provide the possibility to describe
    each component with different levels of abstractions, e.g., using high- or low-level
    descriptions of the behavior, within the same framework. For instance, a system
    can be simulated such that one or more components use a high-level language description
    of the computation or can be simulated using a cycle-accurate model of a microprocessor.
    In some environments, one may simulate the system mixing models with “hardware
    in the loop” (i.e., using hardware for some of the components) [11].


    Higher levels of abstraction can be provided in traditional textual languages
    such as C/C++ and Java using specific Application Programming Interfaces (APIs)
    and/or embedded DSLs [33]. An example of an API that provides high levels of abstraction
    is the regular expression APIs available for programming languages without native
    support for regular expressions (such as is the case of the Java language).'
