  md: '# 8.5.4 AUTOTUNING WITHOUT DYNAMIC COMPILATION


    Without dynamic compilation, autotuning has to resort to the use of code multiversioning
    so that at runtime the suitable code version is selected according to the observed
    parameter values or target architecture. Fig. 8.9a presents an example considering
    three function code versions (f1, f2, and f3) using the option variable to control
    the invocation of one of these three functions versions via a function pointer.
    Fig. 8.9b illustrates an alternative code implementation using a switch statement
    instead.


    From an implementation perspective, a dynamic autotuning without dynamic compilation
    can be realized by generating code consisting of two alternating execution phases,
    namely, one phase responsible for “sampling,” i.e., measuring the performance
    of the current solution being considered and another phase responsible for “production,”
    i.e., switching to the best solution found so far during sampling [11]. Fig. 8.10
    illustrates an example of the implementation of this approach considering the
    existence of multiple versions of a given function and the access to a version
    using the function pointer multiversioning code method (see Fig. 8.9). The sampling
    phase is responsible for the measurement of the performance of each version in
    the current environment by running each version for a fixed time interval. In
    each production phase, the system uses the function version that yielded the best
    performance in the previous sampling phase. Obviously, the implementation can
    even periodically repeat sampling-production phases to adapt to a possible changing
    execution environment.


    ![](img/55beb9162c0073b3a3d7b44f1d5873e8_278_0.png)


    FIG. 8.9 The use of function multiversioning: (A) the use of a pointer to a function
    to select the function to execute based on the value of option; (B) a switch that
    can be used instead of the pointer to functions.


    *It should be clear that this online search strategy is orthogonal to the code
    generation scheme used, for instance, static code generation using multiversioning,
    or runtime code generation using a Just-In-Time (JIT) compiler.'
