    +   Depending on the objectives of the DSE, this evaluation can be simplified,

    +   for instance, when searching for the minimum program size. In this case,

    +   the evaluation simply needs to inspect the size (in bytes) of the code generated
    for the

    +   function/program being optimized.


    One of the most popular methods for exploring design spaces is simulated annealing

    (SA) [1]. SA is a probabilistic iterative method proposed for solving combinatorial

    optimization problems based on an analogy with the thermodynamics concepts of

    cooling and heating. The algorithm relies on the abstract notion of temperature

    (and thus vibration of molecules), where at high temperatures it explores design

    points in the space “distant” from the current best design points. At higher temperatures,

    the reach of the search (or move) is thus more “global.” The algorithm then

    cools-off narrowing its search reach, confining the search to more “local” designs

    next to the best design solutions found so far. The algorithm engages in a series

    of these heating and cooling cycles (or iterations), at each lowering the amplitude

    of the “temperature swing,” until it reaches a stable state where it has identified

    the best solution or solutions.


    Fig. 8.3 presents an example of an SA-based algorithm. The initial temperature
    (T0)

    and the number of iterations (iter) are important parameters of this algorithm.
    Usually,

    these parameters are calculated based on search space characteristics. During
