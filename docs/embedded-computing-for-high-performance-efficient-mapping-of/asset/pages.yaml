    \ promotes the use of scalar replacement since identical references in the same\
    \ loop iteration can make use of a scalar variable.\n\n# 5.6.2 LOOP COALESCING\n\
    \nLoop coalescing [1] can be used to transform two or more nested loops in a single\
    \ loop. This technique can reduce the loop control overhead and improve instruction\
    \ scheduling (given the potential increase in Instruction-Level Parallelism in\
    \ the loop body), but typically adds some instruction complexity by introducing\
    \ modulo and division operations used to compute array indexing functions. Next,\
    \ we show a simple example of loop coalescing. The two loops j and i (left) are\
    \ coalesced in loop t (right), and the i, j indices are calculated based on the\
    \ value of t and on the trip count of the innermost loop. This technique can be\
    \ applied even when the trip count of the outermost loop is not statically known.\n\
    \n```\nfor(j=0; j<M; j++)\n  for(i=0; i<N; i++)\n    sum += A[i][j];\n\nfor(t=0;\
    \ t<N*M; t++) {\n  j = t%M;\n  i = t/M;\n  sum += A[j][i];\n}\n```\n\nThe profitability\
    \ of using loop coalescing depends on the performance and cost of the modulo operation.\
    \ In some cases, one can use strength reduction over the modulo operation. For\
    \ example, the modulo of powers of 2 can be expressed as a bitwise AND operation\
    \ as x % 2^n = x & (2^n - 1). In other cases, it might be better to use x - y*[x/y]\
    \ (i.e., x - y*floor(x/y)) instead of x%y (a transformation already mentioned\
    \ in the beginning of this chapter).\n\nAnother alternative to the use of modulo\
    \ and division operations is the use of conditional code. The following example\
    \ shows the application of loop coalescing to the previous example, but considering\
    \ conditional code to calculate the indexing values.\n\n```\ni=0;\nj=0;\nfor(t=0;\
    \ t<N*M; t++) {\n  sum += A[i][j];\n  if((i+1) == (i+j)++)\n    i=j=1;\n  else\
    \ i++;\n}\n```\n\nThe following example shows loop coalescing applied to a triple\
    \ nested loop. In general, loop coalescing requires one division and one modulo\
    \ operation per loop coalesced. This example introduces two divisions and two\
    \ modulo operations."
