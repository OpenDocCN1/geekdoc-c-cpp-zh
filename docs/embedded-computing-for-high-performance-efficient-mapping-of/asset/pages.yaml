- pgno: 4
  md: '# About the Authors


    **João M.P. Cardoso** is a full professor at the Department of Informatics Engineering,
    Faculty of Engineering of the University of Porto, Porto, Portugal and a research
    member at INESC TEC. Before, he was with the IST/Technical Univ. of Lisbon (UTL)
    (2006–08), a senior researcher at INESC-ID (2001–09), and with the University
    of Algarve (1993–2006). In 2001/2002, he worked for PACT XPP Technologies, Inc.,
    Munich, Germany. He received his PhD degree in electrical and computer engineering
    from IST/Technical University of Lisbon in 2001. He served as a Program Committee
    member, as General Co-Chair, and as Program Co-Chair in many international conferences.
    He has (co-)authored over 150 scientific publications on subjects related to compilers,
    embedded systems, and reconfigurable computing. In addition, he has been involved
    in several research projects. He is a senior member of IEEE, a member of IEEE
    Computer Society, and a senior member of ACM. His research interests include compilation
    techniques, domain-specific languages, reconfigurable computing, application-specific
    architectures, and high-performance computing with a particular emphasis in embedded
    computing.


    **José Gabriel F. Coutinho** is an associate researcher working in the Custom
    Computing Research Group at Imperial College London. He received his M. Eng. degree
    in computer engineering from Instituto Superior Técnico, Portugal in 1997. In
    2000 and 2007 he received his MSc and PhD in computing science from Imperial College
    London, respectively. Since 2005, he has been involved in United Kingdom and EU
    research projects, including FP6 hArtes, FP7 REFLECT, FP7 HARNESS, and H2020 EXTRA.
    In addition, he has published over 50 research papers in peer-referred journals
    and international conferences and has contributed to four book publications. His
    research interests include reconfigurable computing, HPC platforms, cloud computing
    platforms, high-level compilation techniques, programming models, and domain-specific
    languages.


    **Pedro C. Diniz** received his MS in electrical and computer engineering from
    the Technical University in Lisbon, Portugal and his PhD in computer science from
    the University of California, Santa Barbara in 1997. Since 1997 he has been a
    research associate with the University of Southern California’s Information Sciences
    Institute (USC/ISI) and a research assistant professor of Computer Science at
    USC in Los Angeles, California. He has participated and/or led various research
    projects in the area of compilation for high-performance computing, mapping and
    synthesis for reconfigurable computing architectures, and more recently resilient
    computing. He has also been heavily involved in the scientific community having
    participated as part of the technical program committee of over 20 international
    conferences in the area of high-performance computing, reconfigurable and field-programmable
    computing.'
  merge: -1
  img_proc: true
- pgno: 5
  md: '# Preface


    Over the last decades, computer users have enjoyed the benefits of a seemingly
    unbounded availability of transistors on a die, with every new microprocessor
    design exhibiting performance figures that dwarfed previous generations. Computing
    platforms evolved from a single processor core to general-purpose multicores and
    specialized cores, such as graphics processing units (GPUs), delivering unprecedented
    performance thanks to the high degree of parallelism currently available. More
    recently, energy efficiency has become a major concern, prompting systems to include
    custom computing engines in the form of field-programmable gate arrays (FPGA)
    and other forms of reconfigurable computing devices.


    All these computing platforms trends are permeating the embedded computing domain,
    especially in high-performance embedded computing systems. Still, these advanced
    architectures expose an execution model that is far detached from the traditional
    sequential programming paradigm that programmers have been accustomed to when
    developing their extensive code base, and which they rely on when reasoning about
    program correctness. As a natural consequence of this gap between architectures
    and high-level programming languages, developers must understand the basic mapping
    between the application and the target computing architectures to fully exploit
    their capabilities. To help mitigate the complexity of this mapping and optimization
    problem, many high-level languages now include language extensions and compiler
    directives that allow applications to make more effective use of parallel architectures,
    for instance, to exploit multithreading on multiple cores. Given the stringent
    requirements of current embedded computing platforms in terms of latency, throughput,
    power and energy, developers need to further master this mapping process.


    This book provides a comprehensive description of the basic mapping techniques
    and source code transformations for computations expressed in high-level imperative
    programming languages, such as C or MATLAB, to high-performance embedded architectures
    consisting of multiple CPUs, GPUs, and reconfigurable hardware (mainly FPGAs).
    It is therefore meant to help practitioners in the area of electrical, computer
    engineering, and computer science to effectively map computations to these architectures.


    This book also covers existing compilers and their transformations outlining their
    use in many mapping techniques. These include the classical parallel-oriented
    transformations for loop constructs, but equally important data-oriented and data-mapping
    transformations that are key in the context of GPU-based systems. As such, this
    book is aimed to help computer engineers and computer scientists, as well as electrical
    engineers, who are faced with the hard task of mapping computations to high-performance
    embedded computing systems. Given the comprehensive set of source code and retargeting
    transformations described here, this book can be'
  merge: -1
  img_proc: true
- pgno: 6
  md: 'effectively used as a textbook for an advanced electrical, computer engineering,
    and computer science course focused on the development of high-performance embedded
    systems.


    We are very conscious about the difficulty of presenting in a single book, and
    in a cohesive form, all the topics we consider important about the process of
    mapping computations to high-performance embedded computing platforms. However,
    we believe that the topics presented in this book should be mastered by the next
    generation of developers.


    We hope you enjoy reading this book, and that it contributes to increasing your
    knowledge about developing efficient programs on high-performance embedded platforms,
    and that it serves as an inspiration to your projects.


    João M.P. Cardoso

    José Gabriel F. Coutinho

    Pedro C. Diniz'
  merge: -1
