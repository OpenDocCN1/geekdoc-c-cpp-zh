  md: '# Controlling the design and development cycle


    # 3.1 INTRODUCTION


    The availability of rich programming and visualization environments has allowed
    the development of high-performance embedded systems using the so-called fourth-generation
    programming languages such as MATLAB [1] and Simulink [2]. This development approach,
    in its basic form, starts with a model specification where end-to-end functions
    are verified taking into account internal feedback loops and specific numeric
    variable precision requirements. Once this first functional specification is complete,
    designers and developers can focus on meeting additional specification requirements.
    These requirements typically involve performance and/or energy goals, and in some
    extreme cases where Application-Specific Integrated Circuits (ASICs) are sought,
    design area constraints for specific clock rate ranges. To keep design options
    open for later phases of the implementation of a design, it is common to encapsulate
    expensive arithmetic operations as abstract operators at behavioral level. Even
    for integer value representations, there is a wide variety of implementations
    for basic operators such as addition and multiplication. This exploration of suitable
    operator implementations is largely guided by performance factors such as clock
    rate and timing.


    Common design space exploration (DSE) approaches lack the language mechanisms
    that allow designers to convey specific target requirements, as well as the lack
    of tools that can use the information conveyed by different stages of the design
    flow to effectively explore and derive efficient design solutions. While there
    are tools that perform hardware DSE, they tend to be tightly integrated in a hardware
    synthesis toolchain (e.g., [3]), or only allow the exploration using a limited
    set of parameters (such as the unroll loop factor), and thus do not provide the
    flexibility to explore alternative and potentially more optimized solutions. Other
    tools focus exclusively on the exploration of arithmetic precision concerns to
    meet specific algorithmic-level requirements (e.g., noise level).


    To make matters worse, these hardware designs often need to be certified for timing
    requirements and integrated in the context of complex systems-on-a-chip (SoC),
    in many cases executing under the supervision of a Real-Time Operating System
    (RTOS). The validation and certification of such systems is extremely complex.
    While specific hardware designs can meet stringent timing targets, their inclusion
    in real-time systems requires a perfect synchronization of the timing and the
    priorities of multiple threads on computing cores with nondeterministic execution.
    It is'
