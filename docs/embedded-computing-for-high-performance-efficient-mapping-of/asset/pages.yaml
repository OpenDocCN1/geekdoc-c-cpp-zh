    MPI supports two types of communication: point to point and collective. Point-to-point
    communication involves two processes: the sender process which packs all the necessary
    data and uses the MPI_Send (blocking) or MPI_Isend (nonblocking) routines to initiate
    the transmission; and the receiver process which acknowledges that it is to receive
    this data with the MPI_Recv (blocking) or MPI_Irecv (nonblocking). The collective
    communication, on the other hand, involves all the processes in a communicator.
    Examples of collective communication include MPI_Bcast which sends the same data
    from one process to all other processes in a communicator, MPI_Scatter which sends
    chunks of an array to different processes, MPI_Gather which receives data from
    different processes and gathers them to a single process, and MPI_Reduce, which,
    as we have seen in our example, performs an operation on data received from different
    processes.


    Both types of communication routines, point to point and collective, allow the
    implementation of a diverse set of well-known distributed computing patterns,
    such as master-slave, scatter-gather, stencil, pipeline, and ring, as illustrated
    in Fig. 6.8. The master-slave pattern employs a coordinator process which is responsible
    for distributing workload to the remaining processes. The scatter-gather pattern,
    as previously mentioned, is a variant of the master-slave pattern in which a process
    (e.g., the master) performs the reduce phase. The stencil pattern allows processes
