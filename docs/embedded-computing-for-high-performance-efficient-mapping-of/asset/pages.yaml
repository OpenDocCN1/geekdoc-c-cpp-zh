    \ and to add or remove elements. These data structure operations have different\
    \ costs and depending on the their frequency of use, one may opt for a more profitable\
    \ data structure.\n\n# 5.8.1 SCALAR EXPANSION, ARRAY CONTRACTION, AND ARRAY SCALARIZATION\n\
    \nScalar expansion consists of substituting scalar variables by array variables\
    \ and it can enable output- and antidependences. Scalar expansion is always legal/safe\
    \ and can enable autovectorization and/or help parallelization. The transformation\
    \ is often required when applying loop fission as scalars shared between statements\
    \ of the original loop, and that are now distributed in both loops after loop\
    \ fission, need now to be stored in arrays in the first loop so that they can\
    \ be available in the second loop.\n\nArray contraction [19,20] is a code transformation\
    \ technique to reduce memory requirements and consists of transforming an array\
    \ to one or more lower size/dimensional arrays. The transformation can also be\
    \ used when intermediate data hold in arrays is now communicated via buffers (e.g.,\
    \ FIFOs). In this case, arrays are substituted with data structures with lower\
    \ storage requirements."
