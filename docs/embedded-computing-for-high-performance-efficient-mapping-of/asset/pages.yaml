  md: 'context, configurations can be defined as tuples consisting of parameter values,
    code/ algorithmic variants, and/or compiler transformation/optimizations. As with
    other optimization problems in the domain of hardware synthesis or hardware/software
    codesign alluded to in Section 8.3, software tuning exhibits design spaces that
    cannot be manually searched, thus requiring automated approaches analogous to
    the ones described in Section 8.2.


    Autotuning can be an important task for runtime adaptivity. For example, to automatically
    tune the value of N (number of iterations) in the code of Fig. 8.5, or the threshold
    value 255 used in statement if (range < 255) in the examples presented in Fig.
    8.6.


    # 8.5.1 SEARCH SPACE


    Consider, as an example, a program containing a loop (identified as Li) we wish
    to tune based on the use of three compiler transformations, namely, loop unrolling,
    loop tiling, and loop parallelization. In this context, a configuration is specified
    by the tuple <Li, UF, TS, PAR> where Li indicates the loop on which the transformations
    are applied, UF denotes the unrolling factor (in this illustrative case 1, 2,
    4, 8; with an unrolling factor of 1 corresponding to no-unrolling); TS denotes
    the tile/block sizes used in loop tiling (in this illustrative case 1, 32, 64,
    128, 256, 512, 1024; with a tile size of 1 indicating no-tiling); and PAR denotes
    the presence or absence of loop parallelization. The search space for <Li, UF,
    TS, PAR> considering the values to be explored consists therefore of UF x TS x
    PAR = 4 x 6 x 2 = 48 possible parameter configurations.


    In a second scenario, and in addition to loop Li, we consider a second loop, Lj,
    and its configuration denoted by <Lj, UF, PAR> with only three unrolling factors
    (1, 2, 4) to use when applying loop unrolling and the choice between loop or no
    loop parallelization. Considering a search space where we assume the tuning of
    both loops to be independent, one can first search the best configuration for
    loop Li and then the best configuration for loop Lj. This translates into exploring
    a space with 48 and 6 possible design points for loops Li and Lj, respectively,
    and thus a total of 48+6 = 54 design points. If, however, we take into account
    that the execution of the loops is not independent, we need to consider a search
    space with 48 x 6 = 288 design points.


    In general, in a code tuning problem that consists of a sequence of n code sections
    (considered dependent on each other), the total number of design points to consider
    is given by $\prod_{i=1}^{n} \prod_{j=1}^{m(i)} \#option_{i,j}$, where $\#option_{i,j}$
    identifies the number of options for the optimization $i_j$, and $m(i)$ represents
    the total number of optimizations for code section $i$. When the optimizations
    and options for each code section (e.g., loop) are identical, the total number
    of search points is given by $\left( \prod_{i=1}^{m} \#option_i \right)^n$. Both
    situations may imply large search spaces unfeasible to explore exhaustively, thus
    prompting the use of search heuristics and/or design space search pruning techniques.'
