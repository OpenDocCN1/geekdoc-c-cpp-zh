  md: '![](img/55beb9162c0073b3a3d7b44f1d5873e8_35_0.png)


    FIG. 2.8 High-level block diagram of the OpenCL platform model.


    Fig. 2.8 shows a high-level block diagram of a typical OpenCL platform which may
    include one or more computing devices. Each device includes several Computing
    Units (CUs) and each Computing Unit consists of several Processing Elements (PEs).
    A single kernel can execute in one or more PEs in parallel within the same CU
    or in multiple CUs. The computing devices (e.g., a GPU board with support to OpenCL)
    are connected to a host CPU via a shared bus.


    PEs are typically SIMD units responsible for executing sequences of instructions
    without conditional control flow. In some cases, control flow can be supported
    by applying if-conversion and/or by executing both branches and then selecting
    the required results by multiplexing the values provided by the different branches.


    As depicted in Fig. 2.9, an OpenCL computing device may also include a hierarchical
    memory organization consisting of private memories (registers tightly coupled
    to the PEs (one memory per PE), a local memory per CU, a global read-only memory
    that can be written by the host CPU but only read by the computing device, and
    a global memory read/written by the computing device and by the host CPU. Each
    CU''s local memory is shared by all the CU''s PEs.


    The OpenCL kernels execute through parallel work items (each one with an associated
    ID and seen as hardware threads) and the work items define groups (known as work
    groups). Each work group executes on a CU and its associated work items execute
    on its PEs.


    The OpenCL platform is very suitable for computations structured in SIMT (Single
    Instruction, Multiple Thread) as is the case when targeting GPUs. Recently, the
    main FPGA vendors have adhered to the OpenCL model and provide toolchain support
    to map the model to the FPGA resources (i.e., making FPGAs OpenCL computing devices).'
