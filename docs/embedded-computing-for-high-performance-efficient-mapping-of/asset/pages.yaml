    # 7.2 ROOFLINE MODEL REVISITED


    When retargeting an application to a complex heterogeneous platform, it is important
    to understand the main characteristics of the application''s workload, as well
    as the features of the target architecture.


    We begin with the workload characterization. The way we characterize workloads
    depends largely on the type of application we are targeting. For instance, for
    floating-point applications it is relevant to count the number of floating-point
    operations. We can extend this workload characterization by also counting the
    number of bytes transferred between the memory and the processor when executing
    load and store operations. In general, the application workload is proportional
    to the problem size; a large problem, such as a 1000 x 1000 matrix multiplication,
    leads to a larger workload than a 100 x 100 matrix multiplication since the former
    computation requires a larger number of operations and bytes transferred.


    We now assume a simple platform consisting of one compute node and one memory
    unit. To estimate the time required to execute a given workload, defined as (#operations,
    #bytes moved), we need two pieces of information about the platform: the computational
    throughput (how many operations the compute node can process per second) and memory
    bandwidth (the rate at which data is read from or stored to memory).


    It is important to note that the computational throughput is often not a constant
    but rather a function of the size of data processed. This is true, for instance,
    when computer architectures have deep processing pipelines, requiring them to
    be filled to attain maximum throughput. However, the most prevalent factor preventing
    peak performance is that the rate at which the compute node processes data is
    dependent on the rate at which it can access data. In other words, if the data
    access rate is lower than the computation throughput then bandwidth becomes a
    performance bottleneck.


    This implies that the workload distribution needs to account not only the computation
    throughput for each of the platform compute nodes, but also data movements, in
    terms of data size and data access rates, as these factors directly affect performance.
    For this reason, it is useful to consider another metric to characterize and compare
    workloads: operational intensity, which is the ratio of total number of operations
    to the total data movement (bytes): #operations / #bytes moved Flops/byte. For
    instance, FFTs typically perform at around 2 Flops/byte, while N-body simulation
    performs in the order of tens of Flops/byte. Intuitively, algorithms requiring
    more cycles dedicated to data operations (loads and stores) than computation operations
    will typically exhibit'
