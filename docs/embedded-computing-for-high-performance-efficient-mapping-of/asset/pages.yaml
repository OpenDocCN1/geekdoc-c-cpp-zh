    clause, there would be an implicit barrier at the end of the first loop. This
    barrier would have prevented any idle threads (having completed the first loop)
    to start executing the second loop.


    ```

    #pragma omp parallel

    {

    #pragma omp for schedule(dynamic,1) nowait

    for(int i=0; i<n; ++i) a[i] = bigFunc1(i);

    #pragma omp for schedule(dynamic,1)

    for(int j=0; j<n; ++j) b[j] = bigFunc2(j)

