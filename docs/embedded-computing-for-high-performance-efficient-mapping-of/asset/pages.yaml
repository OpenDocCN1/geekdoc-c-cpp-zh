  md: 'capturing both execution time and any additional overheads for a given problem
    size. As an example, consider the following two execution models:


    +   1. **Blocking coprocessor execution model.** In this execution model, the
    host processor is responsible for transferring data to and from the accelerator
    storage space (or simply copying it to a selected region of its own address space)
    and by initiating and observing the completion of a task''s execution by the accelerator.
    While the host processor can carry on other unrelated computations as the accelerator
    is computing, it is often the responsibility of the host to check when the accelerator
    has terminated its execution. The following analytical expression (Eq. 7.1) captures
    the execution time of this model:


    \( T_{comp}^{acc}(n) = T_{comm}^{HostAcc}(n) + T_{acc}^{exec}(n) + T_{comm}^{AccHost}(n)
    \) (7.1)


    Clearly, for an accelerator operating under this execution model to be effective,
    the data transfer time needs to be either reduced to a minimum or hidden as is
    the case of the nonblocking model as explained next.


    +   2. **Nonblocking coprocessor execution model.** In this execution model, and
    after triggering the execution of the first task on the accelerator, the host
    can initiate a second task (if is independent from the previous one) by transferring
    the data for the second task to the accelerator while the accelerator is carrying
    out the computation corresponding to the first task.


    The analytical expression in (Eq. 7.2) captures the execution time of this model
    for a “steady state” operation mode, where the communication for the first and
    the last task is ignored, and where the max function is used to capture the fact
    that if the computation takes longer than the communication, the accelerator will
    delay the communication or if the data transfer from the host to the accelerator
    takes longer than the computation of the previous task, the accelerator will stall.


    \( T_{comp}^{acc}(n) = \max(T_{comm}^{HostAcc}(n) + T_{acc}^{exec}(n), T_{acc}^{exec}(n))
    \) (7.2)


    This model is only possible if there are no dependences between the two computations
    and there is enough memory space to save the data for the computation scheduled
    to be executed next. This execution model reaches its maximum benefit when the
    communication between the host and the accelerator can be entirely masked by the
    computation, and excluding the initial and final computations, the execution time
    is simply dictated by the maximum duration of the communication or the accelerator
    execution.


    Given the execution models described earlier, and under the assumption developers
    can accurately model the various sources of overhead, it is possible to determine
    when it is profitable to use an accelerator to execute a set of computational
    tasks based on the problem (workload) size _n_. For simplicity, we assume the
    overall computation is composed of a series of tasks with the same data sizes.


    Using the execution models earlier, we can depict in a chart when it becomes profitable
    to offload the computation''s execution to an accelerator with the two execution
    models. Fig. 7.2 illustrates when it is profitable to offload the computation
    to an accelerator in both execution models described earlier. In this illustrative'
