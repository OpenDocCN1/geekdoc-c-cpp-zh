    \ such as conditionals (e.g., if statements). However, some conditionals may be\
    \ removed automatically by the compiler using predication, where control statements\
    \ (e.g., if ( c ) { y=f(x); } else { y=g(x); } ) are converted to predicated expressions\
    \ (e.g., y = c ? f(x) : g(x)).\n\n+   3. Function calls. Function calls also prevent\
    \ vectorization unless the compiler supports vectorized versions of these functions.\
