- pgno: 92
  md: 'provides mechanisms for controlling tools of a toolchain in a consistent and
    systematic way, using a unified programming interface (see, e.g., [20]).


    LARA allows developers to capture nonfunctional requirements from applications
    in a structured way, leveraging high/low-level actions and flexible toolchain
    interfaces. Developers can thus benefit from retaining the original application
    source code while exploiting the benefits of an automatic approach for various
    domain- and target component-specific compilation/synthesis tools. Specifically,
    the LARA AOP approach has been designed to help developers reach efficient implementations
    with low programming effort. The experiences of using aspects for software/hardware
    transformations [23] have revealed the benefits of AOP in application code development,
    including program portability across architectures and tools, and productivity
    improvement for developers. Moreover, with the increasing costs of software development
    and maintenance, as well as verification and validation, these facets of application
    code development will continue to be of paramount significance to the overall
    software development cycles.


    In essence, LARA uses AOP mechanisms to offer in a unified framework: (a) a vehicle
    for conveying application-specific requirements that cannot otherwise be specified
    in the original programming language, (b) using these requirements to guide the
    application of transformations and mapping choices, thus facilitating DSE, and
    (c) interfacing in an extensible fashion the various compilation/synthesis components
    of the toolchain.


    LARA support is provided by a LARA interpreter and weavers. Examples of tools
    using the LARA technology are the following four compilers: MATISSE (a MATLAB
    to C compiler), Harmonic (a source-to-source C compiler), MANET (a source-to-source
    C compiler), ReflectC (a CoSy-based C compiler), and KADABRA (a source-to-source
    Java compiler).


    We briefly present in this section the main constructs of the LARA language and
    how it can be used to modify the code of a given application to meet certain requirements.


    The LARA code is modular and organized around the concept of aspects. Aspect definitions
    can invoke other aspects, and, thus, a set of LARA aspects can be applied to a
    given input program. A special tool, called a weaver, executes these aspects and
    weaves the input program files according to the actions expressed in the aspects
    to produce new files. Fig. 3.25 shows the inputs/outputs of two kinds of source-to-source
    compilers. The first (Fig. 3.25A) which is common, considers the control via directives
    and/or command line options. The second (Fig. 3.25B) is extended to support LARA.
    In this case, the output console shown is mainly used to print the messages from
    LARA aspects (e.g., via LARA println statements). We note that other uses of LARA
    can include the control of a compiler in the context of machine code generation.'
