    \ CL_TRUE, 0, sizeof(float) * nx * nz, C);\n queue.finish();\n```\n\nWe finalize\
    \ this section with a summary of techniques for exploiting OpenCL devices. First,\
    \ one of the bottlenecks in performance is the data movement between the host\
    \ and the devices working as coprocessors since the bus interfacing the devices\
    \ might be slow. One common technique to minimize data transfers is to organize\
    \ various kernels in a consumer-producer “chain,” in which intermediate results\
    \ are kept in the device while running a sequence of kernels receiving as input\
    \ the result of the previous executed kernel. Another important consideration\
    \ is to use local memory instead of global memory since it allows almost 10 times\
    \ faster accesses. For some devices, such as AMD GPUs and CPUs, the use of vector\
    \ operations can have a huge impact on performance. Also, the use of half_ and\
    \ native_ math intrinsics can help accelerate the computation at the expense of\
    \ precision. Divergent execution can also reduce performance, which is caused\
    \ when conditionals are introduced in kernels, and forces work-item branches (then\
    \ and else parts) to be executed serially. Global memory coalescing also contributes\
    \ to improve the performance as it combines multiple memory accesses into a single\
    \ transaction, thus exploiting the fact that consecutive work-item access consecutive\
    \ words from memory. Still, it is not always possible to coalesce memory accesses\
    \ when they are not sequential, are sparse, or are misaligned. In this case, one\
    \ common technique is to move accessed data to local memory.\n\n# 7.5 HIGH-LEVEL\
    \ SYNTHESIS\n\nCompiling high-level program descriptions (e.g., C/C++) to reconfigurable\
    \ devices (e.g., FPGAs), known as High-Level Synthesis or HLS, is a remarkable\
    \ distinct process than when targeting common processor architectures, such as\
    \ the x86 architecture. More specifically, software compilation can be seen as\
    \ a translation process, in which high-level programming constructs are translated\
    \ into a sequence of instructions natively supported by the processor. High-level\
    \ synthesis, on the other hand, generates a customized architecture implementing\
    \ the computations, described by the high-level program, using basic logic elements\
    \ and their interconnections.\n\nIn general, the compilation of high-level programming\
    \ languages to reconfigurable devices (see, e.g., [5–7]) distinguishes two types\
    \ of targets: (a) fine-grained reconfigurable devices, and (b) coarse-grained\
    \ reconfigurable devices or coarse-grained overlay architectures."
