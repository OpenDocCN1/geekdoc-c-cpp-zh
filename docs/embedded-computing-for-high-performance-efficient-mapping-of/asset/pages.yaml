  md: 'The classic example of this transformation consists of using matrix transposition
    so that the data layout of an array in memory (using either column-major or row-major)
    organizations matches the data access pattern. When the code traverses the column
    or row of the matrix, consecutive accesses would translate into accesses to consecutive
    data items in the address space, and thus into consecutive cache lines (possibly
    even within the same line for short sequences). This promotes cache line reuse
    and increases the effectiveness of execution techniques such as prefetching.


    The following example depicts a code in which matrix A is transposed to improve
    data reference locality. Alternatively, loops can be interchanged (not always
    legal) to achieve the same effect (as illustrated in the loop interchange section).
    In many cases, we do not need additional overhead (in this case of copying and
    transpose the values of array A to Anew) since the way data is stored can be changed
    in a way that suits the computations accessing that data.


    ```

    for(j=0; j<N; j++)

    for(i=0; i<N; i++)

    A[i][j] += C;


    for(j=0; j<N; j++)

    for(i=0; i<N; i++)

    Anew[i][j] = A[j][i];

    for(j=0; j<N; j++)

    for(i=0; i<N; i++)

    Anew[j][i] += C;

    ```


    However, this layout organization is not exclusive for multidimensional arrays.
    In the context of more discrete data structures, it is possible to layout fields
    of structures as discussed earlier or convert arrays of structs (AoS) to structs
    of arrays (SoA) to promote multithreading execution in the context of GPU execution.


    # 5.8.10 DATA REPLICATION AND DATA DISTRIBUTION


    Replicating data can be an important code transformation to increase the level
    of parallelism, especially in the presence of distributed memories. However, data
    replication may impose a high overhead in terms of memory usage, and thus the
    trade-off between performance improvements and memory requirements need to be
    evaluated.


    A simple example of data replication is the replication of arrays. By creating
    more than one array storing the same data and by distributing them over multiple
    memories, we allow concurrent accesses to these arrays.


    The best scenario is to trigger the replication process when data is created (i.e.,
    in the source, as opposed to make an additional copy which may reduce or eliminate
    data replication benefits. When data also needs to be stored in a replicated scheme,
    the update might be done only at the end of the computations over that data, especially
    when not in the presence of negative distances in data dependences. In the presence
    of negative distances in data dependences, the replication of data may not be
    feasible and/or efficient. Overall, data replication can be suitable when computations
    consume input data and produce output data using distinct input/output arrays.


    When there is no need to replicate all the data structures, the replication method
    becomes similar to data distribution in which chunks or sections of a data structure'
