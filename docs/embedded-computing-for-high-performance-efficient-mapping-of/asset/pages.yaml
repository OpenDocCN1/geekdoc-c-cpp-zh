    # 6.9 SUMMARY


    This chapter described compiler options, optimizations, and the use of developer’s
    knowledge to guide compilers when targeting CPU-based computing platforms. In
    the topic of compiler options, we restrict our focus on optimizations most compilers
    provide, as opposed to code transformations and optimizations covered extensively
    in Chapter 5 and that need to be applied manually or by specialized source-to-source
    compilers.


    This chapter also focused on loop vectorization as an important optimization to
    support SIMD units in contemporary CPUs (see Chapter 2). Given the multicore and
    multiple CPU trends, this chapter described the use of OpenMP and MPI to target
    shared and distributed memory architectures, respectively, and how they address
    concurrency. Lastly, this chapter introduced cache optimizations, as an important
    transformation to accelerate applications targeting the hierarchical memory organization
    of most CPU-based computing platforms.


