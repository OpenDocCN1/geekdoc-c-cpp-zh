    versions of the same code region (e.g., function) can be used and one is selected
    according to runtime information. For example, according to the number of iterations,
    only known at runtime, of a loop, it may be offloaded or not. As the offloading
    process may incur in a setup, communication, and synchronization overheads, a
    runtime decision about the offloading of the computations can provide more efficient
    implementations.


    Recent versions of directive-driven programming models, such as OpenMP 4.0 [28],
    already include accelerator directives, delegating to the compiler the task of
    processing these directives, generating the necessary setup code for the host
    and the code for the accelerator.


