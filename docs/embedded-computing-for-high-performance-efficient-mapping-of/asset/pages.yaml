    In MPI, the selection of which distributed pattern to use depends largely on two
    factors, namely, the level of concurrency inherent in the application and which
    pattern can maximize workload distribution. The level of concurrency can be derived
    by using dataflow analyses and/or other techniques (such as polyhedral analysis)
    to uncover potential concurrency. If the algorithm is embarrassingly parallel,
    meaning that it exhibits no data dependencies, then patterns such as master-slave
    or scatter-gather are often used. Other forms of concurrency patterns, such as
    the stencil pattern, occur in algorithms that update all array elements at regular
    time steps, such as in image processing. Nonparallel loops may still be optimized
    using the pipeline or ring executing patterns, which preserve the order of execution
    of the iterations, but execute parts of the loop body in parallel in a sequence
    of stages (P1, P2, P3, ...).


    A fundamental issue of any form of parallel execution consists in maximizing performance.
    To achieve it, programmers must ensure that computational resources are adjusted
    to support a given workload and not the converse. In other words, the workload
    size and type should dictate what and which (of the available) resources should
    be used. In addition, when parallelizing a program and distributing its workload,
    programmers need to ensure that all resources operate as close to their peak performance
    as possible. A common issue when decomposing a problem into work chunks and mapping
    them to available processors is the potential reduction in arithmetic intensity,
    as each processor performs less work and thus becomes more prone to be bound by
    memory or I/O operations. Hence, the number of processors used in an MPI job must
    be adjusted to the given workload. This is not the case with the example provided
    at the beginning of this section, which is designed to use all processing elements
    available regardless of the vector size, and where the partition size is computed
    as a function of the number of processing elements available. This simple partition
    strategy leads to nonoptimal performance when the number of processing elements
    is comparably larger than the size of the vector.


    To address the issue of adjusting resources to workload, programmers can use performance
    models to estimate how the application performs for a given workload size and
    number (and type) of resources. These performance models are derived by profiling
    the application on a set of representative workloads and then applying statistical
    analysis (such as regression). More details about workload distribution are provided
    in Chapter 7 in the context of heterogeneous platforms.


