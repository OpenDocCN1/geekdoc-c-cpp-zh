    When auto-vectorization is enabled, compilers analyze the code to verify whether
    vectorization can be performed such that the code generated is correct with respect
    to the original scalar version. Further analysis determines whether vectorization
    is profitable. For instance, if the compiler performs noncontiguous memory accesses,
    then vectorization may not be beneficial. To support vectorization, the compiler
    may need to apply a set of transformations, such as loop peeling and loop unrolling
    (see Chapter 5).


    Although the auto-vectorization process has improved considerably over the years,
    the level of support and efficiency is not consistent across different C/C++ compilers.
    Some compilers are still not able to vectorize code if it does not conform to
    specific idioms or style, thus requiring manual effort to make the code more amenable
    to auto-vectorization.


    The compiler options presented in Table 6.2 control the auto-vectorization process
    for popular C compilers, namely, GNU C Compiler (GCC) [11], Intel C Compiler (ICC)
    [12], and CLANG/LLVM [13]. As can be seen, each compiler has its own set of options
    to control auto-vectorization. For instance, auto-vectorization can be enabled
    implicitly when specifying a high optimization level (-O2 or -O3) or can be enabled
    explicitly (e.g., -free-vectorize). There are also options to disable auto-vectorization
    and to report how auto-vectorization was applied to each loop.


