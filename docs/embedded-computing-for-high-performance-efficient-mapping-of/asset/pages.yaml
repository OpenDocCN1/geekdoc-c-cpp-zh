  md: '*Loop scaling* consists of increasing the step traversing the iteration space
    and can be useful in the context of other loop transformations such as loop tiling.


    *Loop reindexing* (also known as loop alignment or index set shifting) consists
    of changing the indexing of array variables by, e.g., considering a different
    loop iteration control.


    Two interprocedural code motion techniques related to headers are *loop embedding*
    and *loop extraction* [12]. Loop embedding pushes a loop header into a procedure
    called within the loop, and loop extraction extracts an outermost loop from a
    procedure body into the calling procedure.


    Memory access coalescing is an optimization performed on some computation architectures
    where multiple data elements can be loaded or stored at the same time (e.g., coalesced
    by GPU hardware [13]). Loop transformations can be used to allow coalescing by
    aligning memory accesses and by transforming code to achieve stride 1 accesses
    to memory.


    # ## 5.6.20 OVERVIEW


    This section provides a global picture of the loop transformations briefly described
    in the previous subsections. Even though there are many loop transformations,
    compilers support a very limited subset, and thus much of the burden to optimize
    code—especially when targeting heterogeneous multicore platforms—is placed on
    developers.


    It is recognized that there are some loop transformations that have a wider applicability,
    such as loop unrolling and loop tiling, but even very simple techniques such as
    loop reversal can be very important. For example, changing the order for traversing
    the iteration space may allow other transformations (e.g., loop fusion) that were
    impossible to apply due to data dependences.


    Table 5.2 summarizes the loop transformations described in this chapter and provides
    simple illustrative examples for each of them. The aim of this list is to provide
    a quick guide to these loop transformations.


    A key aspect in a compiler organization is how to leverage these transformations
    and combine them in a coherent and effective sequence of program transformations
    that can be guided by a set of well-defined and qualitative performance metrics.
    In general, choosing the set and order in which these loop transformations are
    executed is very challenging as there are inherent undecidability limitations
    a compiler cannot possibly overcome. Still, researchers have developed very sophisticated
    algorithms that are guided by specific metrics such as data locality which can
    suggest a sequence of transformation that, in many practical cases, result in
    high-performance code [12]. In other contexts, and in the absence of effective
    compile time guiding metrics, researchers have resorted to the use of autotuning
    exploration techniques in optimization frameworks, such that a compiler can experiment
    with different parameters and sets of transformation in search of a transformation
    combination that leads to good performance results [14].


    Table 5.3 indicates the usefulness of a number of loop transformation techniques
    in terms of main goals and context. We note that many of the loop transformations
    are not useful if isolated but they can permit the applicability of other loop
    transformations and/or compiler optimizations.'
