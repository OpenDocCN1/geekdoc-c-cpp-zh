    # ## 2.3 CORE-BASED ARCHITECTURAL ENHANCEMENTS


    In addition to the recent multicore trend, CPU cores have also been enhanced to
    further support parallelism and specific type of computations. This includes the
    use of SIMD, FMA units, and support for multithreading.


    # ### 2.3.1 SINGLE INSTRUCTION, MULTIPLE DATA UNITS


    Single Instruction, Multiple Data (SIMD) units refer to hardware components that
    perform the same operation on multiple data operands concurrently. Typically,
    a SIMD unit receives as input two vectors (each one with a set of operands), performs
    the same operation on both sets of operands (one operand from each vector), and
    outputs a vector with the results. Fig. 2.10 illustrates a simple example of a
    SIMD unit executing four operations in parallel (as represented as follows).


    ```

    C[3:0] = A[3:0] op1 B[3:0];

    ```


    # SIMD UNITS


    SIMD units have been available in Intel microprocessors since the advent of the
    MMX, SSE (Streaming SIMD Extensions), and AVX (Advanced Vector Extensions) ISA
    extensions [17]. The MMX extensions were initially included to speed up the performance
    of multimedia applications and other application domains requiring image and signal
    processing.'
