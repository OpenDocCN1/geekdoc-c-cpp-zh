  md: '# High-performance embedded computing


    # 2.1 INTRODUCTION


    Embedded systems are very diverse and can be organized in a myriad of ways. They
    can combine microprocessors and/or microcontrollers with other computing devices,
    such as application-specific processors (ASIPs), digital-signal processors (DSPs),
    and reconfigurable devices (e.g., FPGAs [1,2] and coarse-grained reconfigurable
    arrays—CGRAs—like TRIPS [3]), often in the form of a System-on-a-Chip (SoC). In
    the realm of embedded systems, and more recently in the context of scientific
    computing (see, e.g., [4]), the use of hardware accelerators [5] has been recognized
    as an efficient way to meet the required performance levels and/or energy savings
    (e.g., to extend battery life). Although the focus of this book is not on GPU
    computing (see, e.g., [6–8]), the use of GPUs is also addressed as one possible
    hardware accelerator in high-performance embedded systems.


    Fig. 2.1 presents the main drivers that helped improve the performance of computing
    systems over the last three decades as well as the trends for the upcoming years.
    Clearly, frequency scaling was the main driver for improving performance until
    the mid-2000s. Since then, more complex technologies have been employed to increase
    the computational capacity of computing platforms, including more aggressive pipelining
    execution, superscalar execution, multicore architectures, single instruction,
    multiple data (SIMD) support, fused multiply-add (FMA) units, and chip multiprocessors
    (CMPs). The combination of hardware accelerators with many-core architectures
    is currently an important source of performance gains for emerging high-performance
    heterogeneous architectures accelerators, and we believe will continue to be prominent
    in the upcoming years.


    In general, when requirements for a given application and target embedded computing
    system, such as execution time, power dissipation, energy consumption, and memory
    bandwidth, are not met, engineers and developers often resort to one or more of
    the following techniques:


    +   - Perform code optimizations to reduce the number of executed instructions
    or replace expensive instructions with instructions that use fewer resources while
    producing the same results.

    +   - Parallelize sections of code by taking advantage of the lack of control
    and data dependencies, thus enabling the parallel execution of instructions by
    multiple functional units or multiple processor units.'
  merge: -1
  img_proc: true
