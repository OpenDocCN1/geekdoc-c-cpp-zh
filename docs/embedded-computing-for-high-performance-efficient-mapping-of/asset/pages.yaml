    # 6.6 DISTRIBUTED MEMORY (MULTIPROCESSOR)


    In the previous section, we covered the OpenMP programming model which allows
    the development of multithreaded applications. The OpenMP model is used within
    the context of a process, allowing multiple threads to execute on available processor
    cores and share the same memory space (*intraprocess parallelization*).


    In this section, we cover the MPI (Message Passing Interface) model, which is
    suitable for parallelizing computations distributed across a set of processes,
    where each process has its own memory space and execution environment (*interprocess
    parallelization*). These processes can run on the same computing platform or across
    different computing platforms. As processes do not share the same memory space,
    MPI offers an interprocess communication API supporting synchronization and data
    movement from one process memory space to another. With this API, interaction
    between processes is made via explicit message exchanges. MPI is therefore suitable
    for harnessing the computation capacity of multiple (and potentially heterogeneous)
    processing elements connected via fast interconnects, from many-core architectures
    to distributed system platforms.


