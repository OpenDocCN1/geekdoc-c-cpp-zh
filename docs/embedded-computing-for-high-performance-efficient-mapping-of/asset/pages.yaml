- pgno: 190
  md: 'Most loop transformations that have been proposed are commonly associated with
    a specific publication, such is the example of loop versioning [33]. However,
    we suggest interested readers to refer to the survey of code transformations with
    an emphasis on loop transformations presented in Ref. [34]. Relevant bibliography
    exists for readers interested in knowing more about specific topics. For example,
    the work presented in Ref. [16] about JIT specialization in the context of JavaScript
    code includes a very general and comprehensive overview of specialization.


    Other code transformations, such as code specialization, are part of advanced
    JIT compilers such as the ones used for executing Java bytecodes or JavaScript
    code (see, e.g., [16,53,36]). While JIT compilers do not have the benefit of expensive
    compile time static analyses, they have the advantage of using runtime data knowledge
    (see, e.g., [37]) and thus better gage the impact of the specialization on metrics
    such as performance or power. Folding, even limited static compile time information
    in the generated code, allows them to dynamically adapt the code’s execution.


    Code transformations might also be important to satisfy other nonfunctional requirements
    that were not addressed in this book. For example, safety requirements may profit
    from software techniques and thus amenable for code transformations (see, e.g.,
    [38,39]). One example is to increase resilience through triple-module redundancy
    (TMR) techniques applied at the software code level.


