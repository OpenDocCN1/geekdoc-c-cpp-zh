    which executes at a much lower clock frequency. In this case, Eq. (2.1) is still
    valid but the period ($T$) or the clock frequency ($f$) must reflect the hardware
    cycles used.


    ```

    $$T_{exec} = N_{cycles} \times T = \frac{N_{cycles}}{f}$$

    ```


    When considering offloading computations to a hardware accelerator, the execution
    time is affected by the three main factors in Eq. (2.2), namely the execution
    time of the section of the application running on the CPU ($T_{CPU}$), the execution
    time associated to the data communication ($T_{Comm}$) between the CPU and the
    hardware accelerator (HA), and the execution time of the section of the application
