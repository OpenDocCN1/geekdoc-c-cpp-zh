  md: 'All of them can be important in different stages of the mapping of applications
    to an embedded system when considering the use of multiple cores and hardware
    accelerators.


    Instrumentation can also be important to support critical path analysis (CPA)
    and highlighting regions of code or execution paths where one should focus on
    optimizations and/or acceleration. By properly instrumenting the application code,
    the execution of the application can generate an execution trace which can then
    be analyzed to build a dynamic dependence graph (DDG). In this DDG, each instruction
    executed is a node and edges represent the dataflow (dependencies between instructions.
    It is also possible to construct a dynamic Control/Data Flow Graph (CDFG) and
    explicitly expose control and data flow. Note that all the graphs built from traces
    and profiling can be enriched with information associated to nodes and/or edges
    regarding the runtime properties. The inspection of the graphs to determine important
    properties. For instance, inspecting the incoming and outgoing data dependence
    edges can be helpful to determine if variables are privatizable. Other useful
    schemes can find reduction operations, streaming-based data accesses, etc.


    Value profiling extracts information such as range values, enumeration of values
    for a certain variable, which can also be used to identify variables as invariant
    or constant, and perform more aggressive constant folding, code specialization,
    and partial evaluation. This information can be used to guide function inlining,
    code partitioning for CPUs and accelerators, etc. For instance, after acquiring
    dynamic data dependences and memory access patterns one can determine contiguous
    memory accesses and, for instance, identify opportunities to apply vectorization
    for SIMD parallelism. Also, important for guiding vectorization are features such
    as loop trip counts, access strides for the arrays, alignment of the arrays and,
    finally, the outcomes of the branches inside a loop.


    Identifying memory allocation and free operations, system calls, calls to functions
    of a specific library (e.g., Math.h), can also be of paramount importance to guide
    code transformations, partitioning, and mapping. For instance, this information
    can restrict the mapping of certain functions to hardware accelerators, and can
    trigger a set of transformations on a specific code region to make it ready for
    migration to the hardware accelerator.


    As it is apparent, some code metrics, such as execution time and power consumption,
    can be platform dependent, i.e., the measurements may vary depending on the hardware
    used. In this case, the code analysis process may require platform properties
    (in addition to code properties) to identify, for instance, whether a particular
    task can (or should) be mapped to a hardware accelerator such as a GPGPU. Useful
    platform properties include memory and cache size, storage volume size, number
    of processing cores, and core clock frequency.


    While many of these metrics are very architecture oriented, such as the number
    of clocks per instructions, there are other metrics of great interest in the context
    of transformations and which relate to the structure of the application code.
    For example, in various contexts it is important to know the range of the values
    specific loop bounds assume as they dictate the number of executed iterations
    or the sizes of the allocated'
