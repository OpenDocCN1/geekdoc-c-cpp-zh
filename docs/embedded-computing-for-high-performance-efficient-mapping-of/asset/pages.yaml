    Dynamic frequency scaling (DFS) and dynamic voltage scaling (DVS) are techniques
    to reduce the power dissipation when voltage and frequency ranges are not fully
    interdependent, i.e., when changes in clock frequency do not imply (up to a certain
    point) changes in the supply voltage and vice versa. Decreasing the clock frequency
    without changing the supply voltage (possibly maintaining it to the level needed
    to operate at the maximum clock frequency) implies a decrease of power dissipation
    but may lead to insignificant changes in energy consumption (theoretically we
    would expect the same energy consumption). Decreasing the supply voltage without
    changing the operating frequency implies both power and energy reductions.


    The DVFS technique can be seen as a combination of DFS and DVS and when the interdependence
    between power supply and operating frequency is managed in a global way. However,
    in CPUs where the voltage-frequency interdependence exists, DFS, DVS, and DVFS
    are often used with the same meaning, i.e., the dynamic scaling of voltage-frequency.


    # 2.6.3 DARK SILICON


    The end of Dennard scaling [34], which argued that one could continue to decrease
    the transistor feature size and voltage while keeping the power density constant,
    has raised a big challenge for large transistor count IC designs. At the core
    of the issue of power density is the fact that with the growing number of increasingly
    smaller transistors, the aggregate leakage current, if unchecked, is large enough
    to'
