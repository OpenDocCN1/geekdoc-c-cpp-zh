  md: '# Targeting heterogeneous computing platforms


    # 7.1 INTRODUCTION


    High-level languages, such as C and C++, are designed to allow code to be portable
    across different types of computation platforms, in contrast to assembly language
    in which the level of abstraction is close to the machine code instruction set.
    Compilers are responsible for translating such high-level descriptions into efficient
    instructions, allowing application code to be mostly oblivious to the underlying
    architecture. This approach worked well during the single-core era, in which CPU-based
    processors became increasingly more powerful by successive increases in clock
    frequencies and by the introduction of specialized instruction sets that could
    be automatically exploited by compilers with little or no effort from developers.
    However, due to the physical limits concerning heat dissipation and gate delays,
    CPU speeds ceased to increase. This stagnation gave way to more complex platforms
    that: (a) embraced native hardware support for parallel execution with more independent
    processing cores; (b) became more heterogeneous to support specialized and customized
    computation; and (c) became more distributed to support applications requiring
    large-scale computations, including Big Data and HPC. However, this considerable
    increase in computation capacity came at a cost: the burden of optimization shifted
    from compilers back to developers.


    In this chapter, we expand on the topic of code retargeting introduced in Chapter
    6, covering techniques geared toward specialized computing devices (GPUs and FPGAs)
    and heterogeneous platforms in general. Code retargeting is the process of optimizing
    the application source code to run more efficiently on a particular platform architecture.
    The most basic computation platform corresponds to a single type of computing
    device, such as a general-purpose processor (e.g., a multicore CPU) or a hardware
    accelerator (e.g., FPGAs and GPUs). We can build a more complex and heterogeneous
    computing platform by combining general-purpose processors with hardware accelerators.
    Applications targeting these heterogeneous platforms run on general-purpose processors
    and offload critical parts of their computation to hardware accelerators.


    The structure of this chapter is as follows. In Section 7.2, we cover the roofline
    model and explain how it can guide the code retargeting process. In Section 7.3,
    we focus on the problem of workload distribution, which deals with how computations
    can be effectively offloaded to hardware accelerators in a heterogeneous platform.
    Section 7.4 covers the OpenCL framework for targeting CPU platforms with GPU'
  merge: -1
  img_proc: true
