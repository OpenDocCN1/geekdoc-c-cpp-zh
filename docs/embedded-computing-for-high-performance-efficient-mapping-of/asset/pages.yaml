    An exhaustive search involves the evaluation of six copy versions (design points)
    when applying loop unrolling and loop tiling with the parameter settings denoted
    by the tuple (UF, TS) as (2, 64), (2, 128), (2, 256), (4, 64), (4, 128), and (4,
    256). This exhaustive design point search is the default search strategy used
    by the Intel ISAT tool (see the “Offline Autotuning with ISAT”).


    Alternatively, we can consider a search algorithm in two steps. The first step
    would evaluate all design points using all possible values related to the UF parameter
    and an arbitrary value for the TS parameter. The second step would then use the
    best UF value (UFbest) found for all possible values of TS, i.e., (UFbest, 64),
    (UFbest, 128), and (UFbest, 256). This “dependent” or sequential search reduces
    the number of points to be evaluated, in general from \sum_{j=1}^{m(op)} Option_j
    to \sum_{j=1}^{m(op)} hop_j, but is not guaranteed to find the optimal design
    point. Conversely, the exhaustive search does guarantee optimal results at the
    expense of a potentially much longer search time.


    For simplicity, we now consider the implementation of a simple autotuning strategy
    as depicted in Fig. 8.8. In this case, we consider the use of loop tiling to a
    matrix multiplication (function matmult) where the size of the block is a parameter
    (variable blocksize) to be tuned at runtime. The strategy starts with an initial
    block size. For each block size, it measures the execution time for the matmult
    function and then increments the block size by a step value. The search terminates
    when either the execution time increases relative to the previous choice of block
    size or a maximum value of block size is reached.


