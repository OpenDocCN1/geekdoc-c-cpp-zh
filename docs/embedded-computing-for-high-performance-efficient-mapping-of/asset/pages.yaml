    # ## 5.7 FUNCTION-BASED TRANSFORMATIONS


    At the function level there are important code transformations that can impact
    the performance and resource utilization. In this section we describe a representative
    set of these transformations.


    # ## 5.7.1 FUNCTION INLINING/OUTLINING


    Function or procedure inlining is a transformation technique that consists of
    substituting a function/procedure call with the body of the called function/procedure.
    This transformation helps reduce the call overhead and exposes more opportunities
    for further code analysis and transformations, such as constant folding and constant
    propagation, as well as other code optimizations that can now be applied at the
    call site. For instance, partial evaluation (see Section 5.7.2) can be applied,
    which allows function arguments that have a specific value to propagate to the
    body of the function. Conversely, this technique may increase register pressure
    and result in code bloating, in particular when the entire call chain is inlined.
    Clearly, recursive regions of the call graph cannot be inlined unless previously
    transformed to iterative versions.'
