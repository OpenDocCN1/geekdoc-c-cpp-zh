  md: '![](img/55beb9162c0073b3a3d7b44f1d5873e8_29_0.png)


    FIG. 2.2 Block diagram of typical single CPU/single core architectures: (A) with
    all devices connected through a system bus; (B) with the possibility to have devices
    connected to the CPU using direct channels.


    The simplest embedded computing system consists of a single CPU/core with a system
    bus that connects all the system devices, from I/O peripherals to memories, as
    illustrated by the block diagram in Fig. 2.2A. In some cases, computing devices
    (e.g., the CPU) have direct access to other components using point-to-point channels
    (Fig. 2.2B). In other cases, all the components are accessed using a memory-mapped
    addressing scheme where each component is selected and assigned to a specific
    region of the global address space.


    In most high-performance systems, the CPU uses a hierarchical memory cache architecture.
    In such systems, the first level of memory has separate instruction and data caches
    [9]. For instance, in the system depicted in Fig. 2.2, the memory is organized
    as a level one (L1) instruction (S) and data (SD) caches, a second level of cache
    (L2) and the main memory. However, there are cases, such as low-performance and
    safety-critical systems, where the system only supports one level of memory. This
    is because most safety-critical systems with stringent real-time requirements
    may not cope with the variability of the execution time that cache memories introduce.
    In particular, a system may not meet its real-time requirement as dictated by
    the worst-case execution time (WCET) when using cache memories, and therefore
    these systems may not include them.


    # 2.2.1 HARDWARE ACCELERATORS AS COPROCESSORS


    Simple embedded systems, such as the ones depicted in Fig. 2.2, can be extended
    by connecting the host CPU to coprocessors acting as hardware accelerators. One
    type of hardware accelerator is the FPGA, which is a reprogrammable silicon chip
    that can be customized to realize any digital circuit. Other examples of hardware
    accelerators include GPUs and network coprocessors (i.e., coprocessors specially
    devoted to the network interface and communication).'
