  md: "Loop unrolling is always a legal transformation as the order in which the operations\
    \ are executed remains unchanged (special care must be taken in the presence of\
    \ continue instructions). Yet, and as with other transformations that replicate\
    \ code instructions, the compiler needs to evaluate the impact of code expansion\
    \ that can result from the use of loop unrolling, in particular when the iteration\
    \ space or the number of body statements is very large.\n\n# 5.6.13 UNROLL AND\
    \ JAM\n\nUnroll and jam is a loop transformation that unrolls an outer loop by\
    \ a factor and then fuse/merge (jam) the inner loops resultant from the outer\
    \ loop unrolling. The following example shows an unrolling of 2 x and a jam which\
    \ results in two stores of the y array per iteration of the outermost loop, maintaining\
    \ a single innermost loop (this one with two loads of array z).\n\n```\nfor(i=0;i<4;i++)\
    \ {\n y_aux = 0.0;\n for(j=0; j<64;j++)\n y_aux += z[i*64+j];\n y[i] = y_aux;\n\
    }\n\n// unroll 2x outermost loop and jam\nfor(i=0;i<64; i+=2) {\n y_aux0 = 0.0;\n\
    \ y_aux1 = 0.0;\n for(j=0; j<64;j++){\n y_aux0 += z[i*64+j];\n y_aux2 += z[(i+1)*64+j];\n\
    \ }\n y[i] = y_aux0;\n y[i+1] = y_aux2;\n}\n```\n\n# 5.6.14 LOOP UNSWITCHING\n\
    \nLoop unswitching consists of moving loop invariant conditionals (conditions\
    \ without side effects and whose logical values are independent of the loop iterations)\
    \ outward. This transformation involves having as many loops as there are branch\
    \ conditions, and each loop body executing the corresponding branch statements.\
    \ The following example shows on the left a loop where there is a condition (op==1)\
    \ which is not dependent on the loop iterations (i.e., during the execution of\
    \ the loop it is always true or false). In this case, the condition can be moved\
    \ to outside the loop and each branch of the if-statement has now a loop responsible\
    \ for each of the original branch statements (see the following example on the\
    \ right).\n\n```\nfor(i=0;i<m;i++) {\n if(op==1)\n sum += A[i];\n else\n sum *=\
    \ A[i];\n}\n\nif(op==1) {\n for(i=0;i<m;i++) {\n sum+=A[i];\n }\n } else {\n for(i=0;i<m;i++)\
    \ {\n sum *= A[i];\n }\n }\n```\n\nThe legality of this transformation hinges\
    \ on the compiler's ability to determine if a given predicate is a loop invariant,\
    \ and thus enables the use of this transformation."
