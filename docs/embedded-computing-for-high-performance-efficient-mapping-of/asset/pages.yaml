    # 3.2.3 DEALING WITH GENERIC CODE


    When developing a model using a high-level abstraction language, it is often desirable
    to reuse the model in various projects and applications. With this goal in mind,
    the code is developed in a more generic way, usually by providing certain options
    as parameters. This is common when programming for modularity and reusability.
    For instance, a function to sort a list of numbers is usually programmed to sort
    N numbers and not a specific number, e.g., 1000, that might be required for a
    particular application being developed. When considering MATLAB code, it is very
    common to develop code as generic as possible, taking into account various usage
    scenarios. This is also true in the context of the functions in the libraries
    that maximize reusability if provided with many usage scenarios in mind.


    # ASPECT-ORIENTED PROGRAMMING


    “AOP is a programming paradigm that aims to increase modularity by allowing the
    separation of cross-cutting concerns. It does so by adding additional behavior
    to existing code (an advice) without modifying the code itself, instead having
    a separate description that captures which code is modified via a “pointcut”,
    such as “log all function calls when the function’s name begins with ‘set’”. This
    allows behaviors that are not central to the business logic (such as logging)
    to be added to a program without cluttering the code core to the functionality.
    AOP forms a basis for aspect-oriented software development.” (“in”)


    A well-known AOP language is AspectJ which provides AOP concepts to the Java Programming
    language.


    *Aspect-Oriented Programming. https://en.wikipedia.org/wiki/Aspect-oriented_programming.
    *AspectJ. https://en.wikipedia.org/wiki/AspectJ.'
