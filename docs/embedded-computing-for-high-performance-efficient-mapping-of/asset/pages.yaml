- pgno: 255
  md: '# VIVADO HLS DIRECTIVES


    HLS tools leverage user annotations and directives (with their associated parameters)
    to manually guide the optimization tasks. These directives are mostly applied
    at the source code level, e.g., via pragmas when dealing with input C code as
    in the example of the Xilinx Vivado HLS [12] directives. Vivado HLS includes directives
    to guide loop pipelining (the target II), task-level pipelining, function inlining,
    loop unrolling, loop merging, loop flattening, array reshaping, and resource usage
    and allocation. There are also directives to inform the tool of certain code/execution
    properties, such as the maximum and minimum loop trip counts, and information
    about data dependencies.


    The following table presents some of the directives supported by Vivado HLS.


    | Directive | Brief description |

    | :--- | :--- |

    | INLINE | Inlines functions |

    | PIPELINE | Applies loop pipelining. The target value for II can be specified
    |

    | LOOP_TRIPCOUNT | Specifies the maximum, minimum, and average number of iterations
    of a loop |

    | ARRAY_PARTITION | Partitions arrays into multiple smaller arrays |

    | ARRAY_RESHAPE | Reshapes an array in order that instead of one with many elements
    we have one with fewer elements and larger word length per element |

    | ARRAY_MAP | Combines multiple arrays into a single array |

    | DATAFLOW | Enables task-level pipelining. Loops and functions can execute in
    parallel |

    | DEPENDENCE | Provides information about loop-carried dependencies |

    | EXPRESSION_BALANCE | Turns off automatic balancing of expressions |

    | UNROLL | Unrolls a loop |

    | LOOP_MERGE | Merges consecutive loops |

    | LOOP_FLATTEN | Flattens nested loops |

    | STREAM | Implements a specific array as a FIFO or memory channel |


    In addition to the task parallelism uncovered in this block diagram (Fig. 7.10),
    we can also leverage task-level pipelining. In a task-level pipelined execution
    mode, the computations are structured as a sequence of stages partially overlapped
    in time. Depending on the data accesses between producer and consumer tasks, the
    implementation can use FIFOs and/or memory channels to support communication between
    successive tasks.


    There is in fact a substantial number of possible optimizations when using fine-grained
    reconfigurable devices, including the use of customized resources, code specialization,
    loop pipelining, and data parallelism. Furthermore, restructuring code (e.g.,
    considering the code transformations presented in Chapter 5) and efficiently using
    HLS directives allows the HLS tool to derive efficient hardware implementations
    when compared to their software counterparts.


    Given the potential benefit of energy-efficient computing with reconfigurable
    devices, there has been a substantial investment in high-level synthesis (HLS)
    [13] in industry as well as an increased focus on academic research. At this time,
    and considering FPGAs as target devices and C/C++ code as the main input, there
    are academic tools such as the LegUp [14], as well as tools provided by FPGA'
  merge: -1
  img_proc: true
- pgno: 256
  md: 'vendors such as the Vivado HLS [12] by Xilinx [15], and tools provided by EDA
    companies (such as the Catapult C [16] by Mentor Graphics or the Impulse-C by
    Impulse Accelerated Technologies [17,18]). Recent trends include tools to map
    OpenCL computations to FPGAs and both Xilinx [19] and Altera [20] (now Intel [21])
    provide such tools. Other commercial tools have focused on specific models of
    computation. This is the case with the MaxJ language and MaxJ compiler provided
    by Maxeler [22,23] which heavily relies on dataflow models of computation and
    streaming architectures targeting contemporary FPGAs.


    One important aspect about fine-grained compilation to reconfigurable devices
    is the high computational and memory requirements for some of its compilation
    stages, in particular placement and routing. Developers used to fast software
    compilation cycles must contend with long compilation runtimes (several minutes
    to hours) required to synthesize a hardware design. Hence it is not always feasible
    to perform an exhaustive search of hardware designs. In this context, developers
    must understand the implications of source code transformations and compiler options
    before engaging the hardware compilation design flow.


    The compilation flow targeting coarse-grained reconfigurable devices [24] or overlay
    architectures is fundamentally analogous to the flow described for fine-grained
    reconfigurable architectures, but often bypasses the hardware synthesis-related
    stages. In this context, Coarse-Grained Reconfigurable Arrays (CGRAs) [25] are
    the most used coarse-grained architectures, as they provide computing structures
    such as Processing Elements (PEs). These PEs provide their own custom instruction
    set architectures (ISA) which natively support word lengths of 16, 24, or 32-bit,
    and interconnect resources, between PEs and/or internal memory elements at the
    same word level. Because of their granularity, CGRAs impose additional constraints
    on how high-level computations are mapped to PEs, memory elements, as well as
    how their execution is orchestrated. Although the compilation of most CGRAs still
    requires a placement and routing (P&R) stage, this process is often less complex
    than when targeting fine-grained reconfigurable devices.


    # 7.6 LARA STRATEGIES


    We now describe two strategies for improving the efficacy of the Xilinx Vivado
    high-level synthesis (HLS) tool. Both strategies first decide where to apply specific
    HLS optimizations, and then automatically apply these optimizations by instrumenting
    the code with HLS directives (see section textbox on Vivado HLS directives in
    the previous section).


    The first LARA strategy (see Fig. 7.11) applies loop pipelining to selected nested
    loops in a program. As the Vivado HLS tool does not pipeline outer loops without
    fully unrolling all inner loops, when the PIPELINE directive is associated to
    a loop, all enclosed loops are fully unrolled. In the beginning of the strategy,
    all loop nests of a program are analyzed to decide where to include the PIPELINE
    directive. This is'
  merge: -1
  img_proc: true
- pgno: 257
  md: '```

    1. aspectdef strategy1_AVivadoHLS

    2.

    3.   input

    4.     FuncName = ''smooth'',

    5.     threshold = 100, // threshold to decide about fully unrolling

    6.     II = 1 //value for the loop pipelining initiation interval

    7.   end

    8.

    9.   /* Select each loop nest and start at the loop nest leaves */

    10.  apply function(funcName):loopIsInnermost==true) end

    11.  apply

    12.    var $currentLoop = $loop;

    13.    do

    14.      // calling aspect to determine the cost when fully unroll the loop

    15.      // and its inner loops

    16.      call A: CostFullyUnrollAll[$currentLoop];

    17.      if($currentLoop == undefined){

    18.        call InsertPragma[$currentLoop, ''pragma HLS PIPELINE II=[II]''];

    19.        continue $loop; //i.e., go to the next join point "loop"

    20.      }

    21.      $currentLoop = $currentLoop.ancestor[''loop''];

    22.    } while($currentLoop != undefined);

    23.  end

    24. end

    ```


    FIG. 7.11 A LARA example to select a loop and to apply loop pipelining.


    achieved by traversing all loop nests from the innermost to the outermost. For
    each traversed loop, the strategy invokes the aspect CostFullyUnrollAll (line
    16) to decide about the possible feasibility and profitability of full loop unrolling.
    The CostFullyUnrollAll aspect (not shown here) estimates the complexity of the
    loop body (including all enclosed loops) if it where to be mapped to the FPGA.
    This complexity can be based on the number of iterations of the loops and on their
    body statements and operations. If the cost of the traversed loop is larger than
    the given threshold (supplied by the input parameter threshold), then the strategy
    instruments the code with the PIPELINE directive (see line 18) using the initiation
    interval (II) supplied by the input parameter II (with a default value of 1).


    When this strategy is applied to a C code implementing the smooth image operator
    we obtain the code in Fig. 7.12, in which the PIPELINE directive is instrumented
    in the code using C pragmas.


    The second LARA strategy (see Fig. 7.13) applies loop flattening (see Chapter
    5) to perfectly or semiperfectly nested loops (starting from the outermost loop
    in the loop nest) while applying full loop unrolling to the remaining inner loops.
    This strategy mixes two strategies, one for selecting and applying loop flattening
    and another to apply full loop unrolling. For each traversed loop, the strategy
    acquires the information required to decide on the feasibility and profitability
    of full loop unrolling using the aspect used in the first LARA strategy (CostFullyUnrollAll).
    Also, this strategy can be easily extended to consider loop pipelining, thus making
    it applicable in a wider set of transformations contexts.'
