    # 5.11 DATA AND COMPUTATION PARTITIONING


    Partitioning is an important code transformation that can be applied to data structures
    and/or code regions with computations. These transformations have been extensively
    used in the context of parallelizing compilers for scientific computations as
    in this domain there has been a strong desire to automatically translate legacy
    applications onto distributed memory multiprocessors [25]. Typically, large array
    data structures have to be partitioned and distributed across the various memories
    of each computing node in a multiprocessor, and along with it the corresponding
    computation also needs to be partitioned.


    # 5.11.1 DATA PARTITIONING


    In many cases and especially in the presence of data parallelism one may partition
    data structures in order to store them in distributed memories. Often, although
    not necessarily, this data partitioning is also accompanied by a computation partition
    so that computations that manipulate the partitioned data structures can be executed
    by distinct processors.


