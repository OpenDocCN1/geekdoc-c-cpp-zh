  md: '![](img/55beb9162c0073b3a3d7b44f1d5873e8_254_0.png)


    FIG. 7.10 Block diagram of an implementation of edge detection (see task graph
    presented in Fig. 4.15). Dotted horizontal lines identify the computing stages,
    rectangular nodes represent data, and elliptical nodes identify computing tasks.


    One of the benefits of mapping high-level computations to fine-grained reconfigurable
    devices, such as FPGAs, is the ability to select the best suited execution model
    and target custom architecture. As an example, the block diagram presented in
    Fig. 7.10 captures the structure of the edge detection implementation of the UTDSP
    benchmark introduced in Chapter 4. This block diagram exposes concurrency between
    tasks in the same stage (stages are identified in Fig. 7.10 with horizontal dotted
    lines) of this implementation. For instance, two convolve2d task instances can
    execute in parallel on two distinct implementations of the hardware elements that
    support their execution. When mapped to an FPGA, the computational nodes (elliptical-shaped
    nodes) are implemented as logic circuits with discrete elements, such as adders
    and multipliers, and their own Finite State Machine (FSM) controllers. On the
    other hand, storage nodes (rectangular-shaped node) can be implemented using on-chip
    FPGA memory resources (BRAMs), possibly using one memory per array, and in some
    cases using dual-port memories.'
