    programming (ILP), greatest-common divisor (GCD) tests [8] and the Fourier-Motzkin
    methods [9]. As with any other NP-complete decision problem, data dependence testing
    algorithms for the affine domain range from solutions that are quick to evaluate
    but yield imprecise answers or more computational expensive resulting in more
    precise results. Invariably, compilers have to opt for conservative solutions.
    As such, and in the presence of inclusive results, where the method yields a result
    that indicates a possible data dependence, compilers have to assume the existence
    of this dependence and hence restrict some program transformations. In these scenarios,
    the data dependence resolution can be delayed until runtime by a technique named
    “inspector-execution” (see, e.g., [10,11]). Here, the compiler generates code
    that checks for data dependences at runtime during a first iteration of a loop
    nest. If at runtime no dependences are detected during this first run, assuming
