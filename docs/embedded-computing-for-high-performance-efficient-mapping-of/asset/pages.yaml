  md: 'host and one or more hardware accelerators (GPU) act as coprocessors. In this
    type of platform, applications running on the host are sped up by offloading sections
    of the program to the GPUs. The choice of which parts of the program are offloaded
    to the GPU, and indeed to any hardware accelerator acting as a coprocessor, is
    critical to maximize overall performance.


    As mentioned in the beginning of this section, data-parallel algorithms are a
    good fit for GPU acceleration, since the GPU architecture contains hundreds of
    lightweight processing units able to operate over several data items in parallel.
    Moreover, algorithms must be computationally intensive to maximize the utilization
    of the GPU compute resources and in this way, hide memory latency. This is because
    GPUs support fast context switching: when memory accesses are required while processing
    a subset of data elements, this subset is put on hold, and another subset is activated
    to keep the GPU compute resources busy at all times. Additionally, problems requiring
    streaming large sequences of data are also a good fit, as they reduce the data
    movement overhead between the host and the GPU memories.


    To express data parallelism in OpenCL, programmers must specify the *global dimensions*
    of their problem. The global dimensions specify the total problem size, describing
    an array of data elements processed using the same operation, known as a *kernel*.
    Global dimensions can be expressed in 1D, 2D, or 3D spaces depending on the algorithm.
    In this context, a *work-item* is an instance of the kernel that executes on one
    data element of the array defined in the global dimensions’ space, thus being
    analogous to a CPU thread. Therefore the global dimensions define the number of
    work-items that will execute on the hardware device. Consider, for instance, the
    following problems:


    +   1. 1D: process an 8k audio sample using one thread per sample: ~8 thousand
    work-items

    +   2. 2D: process a 4k frame (3840 x 2160) using one thread per pixel: ~8 million
    work-items

    +   3. 3D: perform raytracing using a voxel volume of 256 x 256 x 256: ~16 million
    work-items


    Current GPU devices are not big enough to run 16 million work-items at once, hence
    these items are scheduled according to available computing resources. Still, the
    developer is responsible for defining explicitly the total number of work-items
    and its dimensions according to the problem at hand. For instance, the developer
    can decide to process a 4k frame by using a work-item that operates on a line
    instead of a pixel, thus requiring a total of 2160 work-items instead of around
    8 million. This affects not only the number of work-items that need to be scheduled
    but also the granularity of each work-item.


    Developers must also specify the *local dimensions* of their problem, which defines
    the number of work-items executing together in a *work-group*. The size of this
    work-group must evenly divide the global size in each dimension. Hence, if the
    global dimensions of a problem are 1024 x 1024, then 512 x 512 and 128 x 128 are
    valid local dimensions, but 512 x 100 is not valid as 100 does not evenly divide
    1024. The work-groups are, thus, important as they define the set of work-items
    logically executed together on a physical *compute unit*, and it is only'
