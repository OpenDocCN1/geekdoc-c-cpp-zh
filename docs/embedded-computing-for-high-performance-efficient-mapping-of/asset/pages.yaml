- pgno: 84
  md: '# ## 3.4 HARDWARE/SOFTWARE PARTITIONING


    An important task when targeting computing systems consisting of hardware and
    software components is hardware/software partitioning. Hardware/software partitioning
    is the process of mapping different sections of an application to distinct processing
    elements in a heterogeneous computing platform, such that performance and/or other
    nonfunctional requirements, e.g., energy consumption, can be met. A heterogeneous
    platform may harbor a diverse set of processing elements, such as general purpose
    processors (GPPs), FPGAs, and GPUs, and each of these devices may handle specific
    types of workloads more efficiently than others.


    An efficient hardware/software partitioning process thus aims at distributing
    the workload among the most appropriate computation elements in a heterogeneous
    computing platform consisting of software and hardware components. This process
    can be considerably complex, as hardware platforms are becoming increasingly more
    specialized thus requiring enhanced programmer expertise to effectively exploit
    their built-in architectural features. Examples of heterogeneous hardware platforms
    include embedded systems consisting of Multiprocessor System-on-Chips (MPSoCs)
    provided by devices such as Zynq UltraScale+, the new Intel Xeon CPUs with integrated
    FPGAs, and emerging heterogeneous cloud platforms that offer on-demand computation
    resources.


    The partitioning process identifies computations, described as sections of the
    application code, to be mapped to the different processing elements. The mapping
    process usually requires specific code generators and compiler optimizations for
    each target processing element. Once the mapping process is defined, the main
    application code needs to be modified to offload the computations and code sections
    to different processing elements. This offloading process, typically, involves
    the insertion of synchronization and data communication primitives. As each processing
    element may exhibit different energy/power/performance characteristics and the
    data communication between a host processor and the different processing elements
    may have different costs, the partitioning process must deal with a design exploration
    process with the goal of finding the best partitioning according to given requirements.


    Given its importance, it is thus not surprising that there has been considerable
    research in hardware/software partitioning (see, e.g., [17]). The choice of techniques
    and algorithms depend on a number of factors, including:


    +   - The number of candidate program partitions derived from an application description.
    We consider a partition to be a self-contained program module with well-defined
    inputs and outputs. Since each partition can be potentially executed on a different
    processing element, the mapping process needs to take into account the communication
    overhead between partitions when they are mapped on different processing elements.
    A partition can be defined by a program function or a subprogram module. However,
    a function may be further partitioned to find regions of code that are prime candidates
    for hardware acceleration, for instance, loop statements identified as hotspots
    in a program.'
  merge: -1
  img_proc: true
- pgno: 85
  md: '+   The number of processing elements available for the mapping process, their
    corresponding architecture type, and interprocessor communication model. In particular,
    processing elements may communicate with each other by storing and accessing data
    through shared memory. Alternatively, in the case of heterogeneous architectures,
    each processing element may have its own local memory, and communication might
    be performed through shared memory and/or communication channels. In the case
    of non-existent shared memory, the mapping process becomes less flexible, with
    partitions that share the same data having to be possibly mapped to the same processing
    element.


    In general, we can divide the hardware/software partitioning process in two broad
    categories: static and dynamic. The static partitioning process is determined
    at compile time and remains unchanged at runtime. In a dynamic partitioning process,
    the mapping is determined at runtime taking into account existing workload and
    device availability. In the remaining subsections, we describe design flows that
    support these two categories of hardware/software partitioning.


    # 3.4.1 STATIC PARTITIONING


    A typical design flow performing static partitioning is illustrated in Fig. 3.18
    and consists of the following steps:


    +   1. Refactoring the application to uncover candidate partitions. This involves
    merging and splitting functions from the original code to find a good set of partitions.
    Profiling can be performed to find hotspots and regions of code that may be accelerated,
    as well as to extract data communication patterns between different regions of
    code. Additional heuristics, based on source code inspection and profiling, can
    be applied to find partitions with minimized interdependences.


    ![](img/55beb9162c0073b3a3d7b44f1d5873e8_85_0.png)


    FIG. 3.18 Hardware/software partitioning steps in a static design flow.'
  merge: -1
  img_proc: true
- pgno: 86
  md: 'Furthermore, partitions can be identified to uncover more opportunities for
    mapping a partition to different types of processing elements, thus increasing
    the chances of optimization.


    +   2. Once a set of partitions is derived, the next problem consists in finding
    an efficient mapping. This usually involves employing a metaheuristic search algorithm,
    such as tabu search or simulated annealing, where the goal is to satisfy an overall
    nonfunctional performance goal. To achieve this, a cost model is required to estimate
    the performance of a particular mapping configuration, and guide the subsequent
    steps in the optimization process. This cost model may consider possible optimizations
    in the code for a particular processing element. For instance, loops can be pipelined
    to increase throughput if mapped onto an FPGA.


    +   3. Once a mapping solution is found, the code may still be optimized to take
    into account the specific architecture of the processing element chosen. The optimization
    can be performed at source code level or at a lower intermediate representation
    (IR) level. Furthermore, as previously mentioned, the code is modified with synchronization
    and data communication primitives to offload computation between different processing
    elements. Once the final code is generated, it is compiled and linked by the different
    subtoolchains.


    +   4. Finally, the generated application can be profiled on the target platform
    (or by simulation) to ensure it meets the application requirements. If not, then
    one can run the partitioning process from step 1. In this context, the synthesis
    and profiling reports are fed back to the refactoring (1), mapping (2), and optimization
    and code generation (3) steps to refine the hardware/software partitioning process.


    The partitioning process also depends on the programming and execution models.
    Next we look at a typical example where a C application is mapped onto an heterogeneous
    embedded platform which hosts a CPU and an arbitrary number of hardware accelerators.
    We consider C functions to define partitions (note that other granularities may
    be used). Once the code is adequately refactored, a mapping process inspects the
    code and generates a static call graph G = (N, E), where nodes N represent function
    calls and edges E correspond to flow of data and control from one node to another.
    We consider that each function call instantiates a task. Because a single function
    can be invoked at different points in the program, two tasks can be instantiated
    from the same function and potentially mapped to different processing elements.
    Note that because a static call graph is generated at compile time it does not
    capture the number of tasks that are executed at runtime since this number may
    depend on runtime conditions, such as input data. Furthermore, in a call graph,
    edges can be associated with data flow information, such as the data type of input
    and output arguments.


    Consider the C program in Fig. 3.19A and the corresponding call graph presented
    in Fig. 3.19B. As can be seen, the main function invokes functions (tasks) a and
    d, and function a invokes functions (tasks) b, c and d. The invocations of function
    d in the call graph are identified as d1 and d2 respectively, as they correspond
    to two distinct invocation sites.'
