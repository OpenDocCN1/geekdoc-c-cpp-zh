  md: 'by reading or by writing) the same data item d. This dependence can thus be
    classified as four types of dependences, namely:


    +   - True-data dependence: op1 writes d; op2 reads d, i.e., the first instruction
    possibly modifies the value of the data item d, which op2 will read.

    +   - Anti-data dependence: op1 reads d; op2 writes d, i.e., the second instruction
    possibly modifies the value of the data item d, which op1 has read.

    +   - Output-data dependence: both op1 and op2 modify the value of the data item
    d. The value written by op2 is the value of d after both operations execute.

    +   - Input-data dependence: both op1 and op2 read the value of the data item
    d. Neither operation modifies the value of d, which remains unchanged after their
    execution.


    With the exception of input data dependences, all the other forms of dependences
    force the compiler to preserve the original execution order of the two operations
    as otherwise there is no guarantee that the final value of the data item d is
    the same.


