- pgno: 220
  md: 'In the previous example, we divided the main function into four stages (Fig.
    6.7):


    +   - Stage 1 initializes the MPI environment (MPI_Init), gets the process rank
    (MPI_Comm_rank), and the number of processes spawned (MPI_Comm_size) within the
    communicator MPI_COMM_WORLD. A communicator defines a group of processes that
    can communicate with each other. Each process in a communicator is assigned a
    unique rank. Processes communicate with each other explicitly using their ranks.
    The MPI_COMM_WORLD communicator corresponds to all processes within an MPI job.
    Unless a more complex communication pattern is required, an MPI program typically
    begins with these three lines of code, as they offer a full view of all processes
    in an MPI job and their associated ranks.


    +   - In Stage 2, the master process (identified by rank 0) partitions the vector
    among the workers (remaining processes). The master process sends a partition
    (part of the vector) to each available worker using the MPI_Isend function. This
    function sends data without waiting until it is received. The process of sending
    the partition to each worker is performed in two steps: first, the size of the
    partition is sent, followed by the partition itself. If the vector cannot be evenly
    divided by the number of workers, then the last worker is assigned a larger partition.
    Conversely, the workers receive the partition from the master worker with the
    MPI_Recv function, which blocks execution until data is received. This process
    mirrors the protocol used by the master in this stage: first the worker receives
    the size of the partition, and then the partition. Each worker will then add the
    values in their assigned partition.


    +   - In Stage 3, the results from all workers are sent back to the master using
    the reduction collective communication primitive, MPI_Reduce, which automatically
    adds the results into a single value for the master process. The reduction operation,
    in this case MPI_SUM, must be supplied in the MPI_Reduce call.


    +   - Finally, in Stage 4, the MPI_Finalize routine is invoked to clean up all
    MPI states, and free all used resources. After this call, no other MPI routine
    can be invoked.


    There are many available implementations of MPI, including Open MPI, Intel MPI,
