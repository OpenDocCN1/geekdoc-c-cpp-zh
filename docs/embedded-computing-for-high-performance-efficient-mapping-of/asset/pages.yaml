    We now focus on the OpenCL runtime architecture introduced in Chapter 2. At the
    top level OpenCL exposes a set of platforms (see Fig. 7.6 each of which is composed
    by a set of computing devices supplied by the same vendor, such as AMD, Intel,
    and Nvidia. There are many types of OpenCL devices, including CPUs, GPUs, and
    FPGAs. Each device has a global memory with a specific size and bandwidth. Typically,
    GPUs have faster memories than CPUs as they can support higher computational throughputs.
    Devices can communicate with each other (e.g., via PCIe), but typically devices
    within the same platform can communicate more efficiently with each other. Each
    device is composed of a set of compute units which operate independently from
    each other, and each compute unit has a set of processing elements. All OpenCL
    devices exhibit this architecture organization, varying in the number of compute
    units, the number of processing elements, and their computational throughput capacity.


    To deploy and execute an OpenCL program into one or more devices, OpenCL supports
    two important concepts. First, a context which groups a set of devices from the
    same platform, allowing them to share the same OpenCL objects, such as memory
    and programs, and thus support the management of multiple devices from a single
    execution context. Second, a command-queue which must be created on each device
    (within an execution context) to allow the host to submit work to the device.
    When using multiple OpenCL devices, developers are responsible for manually partitioning
    application workload and distributing each part across available devices according
    to their computational capacities. In addition, and while the OpenCL kernel specification
    can be deployed to any device without modification, it is often modified, e.g.,
    to take into account that CPUs have lower memory bandwidth but larger cache systems
    and support fewer threads when compared to GPUs.'
