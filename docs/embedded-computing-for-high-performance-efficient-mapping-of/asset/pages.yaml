    # 2.5.3 WORST-CASE EXECUTION TIME ANALYSIS


    In other contexts, it is required that specific sections of the code or tasks
    execute within prescribed time bounds. As such, one must model its execution time.
    This is the case with many embedded systems such as real-time and safety-critical
    systems, which require that the execution of specific tasks be time bounded so
    as to ensure the correct behavior per system requirements (see, e.g., [27], Chapter
    10). As an example, in an auto engine, specific operation controls must occur
    within very stringent timing constraints. Similarly, in a nuclear reactor software,
    safety-related control actions have to take place at precise time once alarm conditions
    are triggered. In these contexts, developers must guarantee the worst-case execution
    time (WCET) for specific tasks to be below a specific time bound so that, and
    it is common practice, they can execute within the schedule time slot allocated
    to them by the underlying real-time operating system (RTOS).


    Embedded software developers have resorted to a combination of static analysis
    (instruction counting and execution path coverage analysis) and restriction on
    the sharing of resources with other tasks, or even preemption, so that feasible
    execution time upper bounds can be derived (see e.g., [28]).


    The existence of architectural elements, such as cache memories and branch prediction
    with nondeterministic timing behavior, renders the estimation of WCET, even for
    input bounded code, very complex (see e.g., [29]). Because of these limitations
    and in instances where satisfying strict timing deadlines is of paramount importance,
    e.g., in safety applications, software developers opt to use hardware components
    which do not exhibit nondeterministic behavior often at the expense of lower expected
    average performance.


