- pgno: 171
  md: 'To avoid these problems, it is common to apply “partial inlining” which requires
    the selection of candidate call sites where function inlining must be applied.
    This selection hinges on which call sites are deemed more profitable taking into
    account, for instance, constraints about code size.


    Function outlining (also known as function exlining) performs the opposite of
    inlining, promoting code reuse at the expense of the call/return overhead. More
    specifically, in this transformation a section of code is extracted to a function/procedure
    and substituted by a call to that function/procedure. The technique may reduce
    code size when the function substitutes more than one code section (which happens
    with code cloning sections). It is usually applied as a step to enable multiple
    versions of a code section.


    # 5.7.2 PARTIAL EVALUATION AND CODE SPECIALIZATION


    Partial evaluation, which is also known as “currying” [15], is a technique where
    the computation is evaluated with respect to a given operand’s value. That is,
    rather than treating an operand as a variable, its value becomes “fixed.” Given
    a specific value of an argument, the code is specialized by replacing the occurrences
    of the variable with the corresponding value. Clearly, and in the absence of any
    information about run-time values of the program inputs, a compiler can create
    multiple code variants of a procedure/function for specific values of its arguments.
    The choice of which value to specialize can be guided either by runtime profiling
    or by static analysis of the procedure/function call sites. Code specialization
    is particularly beneficial when combined with transformations such as constant
    propagation, strength reduction, and in general control-flow optimization.


    Code specialization can be performed statically or dynamically. Dynamic code specialization
    is used in JIT compilers [16], while static code specialization is performed based
    on information collected by a static analysis (e.g., the compiler is able to determine
    that at least one of the arguments in a call site is a statically known constant
    value) or using profiling data.


    Code specialization can be categorized as control-flow specialization and data
    specialization. Control specialization leverages the execution paths to furnish
    specialized version of the code. Data specialization, on the other hand, takes
    advantage of the data values (or their properties) to provide specialized versions.
    Both techniques can be fully identified by static analysis or using profiling
    data, runtime data, or a mix between them.


    The specialization of functions is a type of optimization that can be used to
    improve performance and/or energy/power consumption. This specialization is usually
    applied based on the runtime values of the arguments in call sites. For instance,
    one of the arguments of a function might be at all times a constant value or some
    of the times have a specific value. This translates into one specialized version
    or multiple versions of that function, respectively.'
