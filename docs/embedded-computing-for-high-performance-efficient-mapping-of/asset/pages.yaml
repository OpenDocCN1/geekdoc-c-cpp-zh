  md: '# 3.2.2 DEALING WITH DIFFERENT CONCERNS


    During the design cycle, developers may have to deal with different concerns that
    include emulating the input/output of the system, providing timing/energy/power
    measurements, and monitoring capabilities. These concerns might translate to specific
    code that must be introduced in the application, but ultimately removed in the
    final implementation and/or when deploying it to the target system. Timing and
    measuring the power and energy consumption of an application are examples of concerns
    typically considered during the design cycle. Figs. 3.7 and 3.8 present examples
    of code inserted in the application to provide such measurements. Both include
    calls to specific function libraries (APIs) to interface with hardware components
    (e.g., a timer and a power sensor).


    The high abstraction level provided by programming languages such as MATLAB allows
    the specification of simulation models that take into account the connections
    to input/output components, but usually impose code to emulate certain features
    of the system. This code is in a later step removed from the application. One
    example is the emulation interface to an input camera which loads images from
    files instead of connecting to a real camera. In some prototypes and production
    embedded implementations, these codes interface with a real camera.


    ```

    ```c

    #include "time.h"

    ...

    clock_t begin, end;

    begin = clock(); // number of CPU clock cycles

    // code section under timing measurements

    end = clock(); // number of CPU clock cycles

    printf("Elapsed #clock cycles: %d\n", (int) (end-begin));

    printf("CLOCKS_PER_SEC is the CPU number of clock cycles per second");

    printf("Elapsed time: %f (sec)\n", (double) (end-begin)/CLOCKS_PER_SEC);

    ```

    ```


    FIG. 3.7 Timing a section of an application.


    ```

    ```c

    #include "energy.h"

    ...

    double begin, end;

    begin = energy_start();

    // code section under energy measurements

    end = energy_end();

    printf("Consumed energy: %d (J) \n", (end-begin));

    ```

    ```


    FIG. 3.8 Measuring energy for a section of an application.'
