  md: '# 8.3 HARDWARE/SOFTWARE CODESIGN


    Hardware/software codesign [24] is the process of designing computing systems
    consisting of both hardware and software components [4]. It is by nature a cooperative
    and concurrent design process as decisions to use specific hardware components
    for selected sections of an application must be taken with a global view of the
    system (i.e., those decisions are not taken separately and without evaluating
    the global design impact). Although the main tasks of hardware/software codesign
    involve describing the system (e.g., using a modeling language) and exploring
    the best possible architectures to implement such a system as illustrated in Fig.
    8.4, often the target architecture is fixed with the possible exception of the
    reconfigurable hardware component when present.


    In this brief introduction to this topic, we focus on the restricted codesign
    scenario where the goal is to map a software computation to a computing platform
    that features some degree of hardware architectural flexibility. In this class
    of architectures, we include SoC-based architectures and other conventional architectures
    with a limited set of hardware configuration knobs (such as cache memory configurations).
    This is, we believe, the most common mapping scenario for software developers.


    In this context, the two most important hardware/software codesign tasks are hardware/software
    cosynthesis and hardware/software partitioning [5,6]. Hardware/


    ![](img/55beb9162c0073b3a3d7b44f1d5873e8_269_0.png)


    FIG. 8.4 Hardware/software codesign main tasks.'
  merge: -1
  img_proc: true
- pgno: 270
  md: 'software cosynthesis usually refers to the synthesis of both the software code
    and the hardware component code, as well as the synthesis of their interfaces
    (including communication and synchronization). Software code synthesis (referred
    to as software flow in Fig. 8.4) is also required when the application is described
    using a high-level description language not directly supported by the toolchain
    of the target architecture (e.g., when using MATLAB without a suitable cross-compiler).
    As a result, this synthesis process requires the translation of the application
    specification to a suitable program description (such as C/C++) subsequently compiled
    to the target architecture. The flow may also produce parts of the application
    code, for instance, in C or in OpenCL, amenable to hardware acceleration and optimized
    for a hardware- and vendor-specific toolchain (referred to as hardware flow in
    Fig. 8.4), such as high-level synthesis tools when targeting FPGA reconfigurable
    hardware.


    Hardware/software partitioning consists in identifying sections of the software
    code (in a software centric codesign approach) to be mapped to specialized architectures
    (such as GPUs and FPGAs) to execute them more efficiently. In the context of FPGAs
    and other reconfigurable devices, the code selected is synthesized into custom
    hardware structures, while in the case of GPUs the code is cross-compiled to exploit
    a specific execution model and its supporting hardware. This code is commonly
    referred to as being offloaded to the hardware accelerator. In other contexts,
    as is the case of FPGA-based accelerators, and in addition to the offloading,
    there is also the need to synthesize hardware structures by typically using a
    high-level synthesis (HLS) tool, such as Vivado HLS [7].


    The selection of which software code section to be offloaded to hardware is often
    guided by the execution performance ratio between hardware and software, which
    takes into account the data communication costs between the host processor and
    the accelerators (see Chapter 6). In other contexts, offloading computations to
    hardware might be dictated by real-time response requirements. For instance, the
    hardware/software partitioning problem can be formulated as an optimization problem
    addressed by a simulated annealing (SA) algorithm as proposed by, e.g., [6]. In
    this case, the movements in each iteration of the SA algorithm consist of migrating
    code sections (e.g., instructions, basic blocks, loops, functions) from software
    to hardware and vice versa. For each new design solution, the cost considers the
    associated communication costs and the performance of each code section on both
    the host processor and the hardware accelerator.


    # 8.4 RUNTIME ADAPTABILITY


    Runtime adaptivity refers to a system’s ability to adapt to runtime changes in
    its execution environment. As an example, at the application level, runtime adaptivity
    may focus on switching between algorithms depending on specific parameter values
    (also known as software knobs), data representation, or on code adaptations with
    respect to the lack of computing resources. In addition, runtime adaptivity may
    also involve'
  merge: -1
  img_proc: true
- pgno: 271
  md: "modifying system-level properties such as the clock frequency or cache memories\
    \ configurations (also known as hardware knobs).\n\n# 8.4.1 TUNING APPLICATION\
    \ PARAMETERS\n\nDepending on the application, there might be various parameters\
    \ to be tuned (statically or dynamically). An example is the number of taps used\
    \ for a given digital signal processing filter. The number of taps influences\
    \ the execution time, power and energy, as well as the effectiveness of the filter\
    \ (e.g., the signal-to-noise ratio--SNR).\n\nAt runtime, parameters might be tuned\
    \ according to specific objectives. As an example, consider the code in Fig. 8.5,\
    \ which provides an iterative implementation of the hyperbolic sinh or sinh function\
    \ using its Taylor's expansion series. An adaptive implementation of this computation\
    \ can tune the number of iterations (N) parameter at runtime according to a specified\
    \ execution deadline. A large number N leads to increased precision, but also\
    \ longer evaluation (computation) times.\n\n# 8.4.2 ADAPTIVE ALGORITHMS\n\nIn\
    \ addition to algorithm parameters, adaptivity can also take place at the algorithmic\
    \ level by considering modifications to the baseline algorithm or using alternative\
    \ algorithms. An example of this type of adaptivity is the implementation of the\
    \ qsort function in the C standard library \"stdlib\". It uses insertion sort\
    \ when the number of elements to sort in each partition is below a certain threshold\
    \ reverting to quicksort otherwise. A more sophisticated adaptivity case for sorting\
    \ would make use of additional sorting algorithms (see, e.g., [8] for a presentation\
    \ of sorting algorithms). For example, one can use a sorting network when the\
    \ number of elements to sort is small and those elements can be loaded simultaneously\
    \ as inputs to the network, and/or use a counting sorting algorithm when the elements\
    \ to be sorted are integers and exhibit small value ranges. In the counting sort\
    \ algorithm, when the integer values of the array elements range, e.g., between\
    \ 0 and 255, one can use an array of 256 entries and the input elements can be\
    \ sorted with O(n) worst-case time complexity by incrementing the entry given\
    \ by the index corresponding to the element's value. There are\n\n```\nint N =\
    \ 10;\ndouble sinh(double x) {\n    int i, j;\n    double y = 0.0;\n    for (i\
    \ = 1, j=0; j < N; i+=2, j++) {\n        y += pow(x, i)/fact(i);\n    }\n    return\
    \ y;\n}\n```\n\n# FIG. 8.5\n\nExample of parameter-based adaptivity."
  merge: -1
  img_proc: true
