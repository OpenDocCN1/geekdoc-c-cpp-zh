  md: '# 8.5.2 STATIC AND DYNAMIC AUTOTUNING


    Autotuning can be performed offline (statically, i.e., at compile time) and/or
    online (dynamically, i.e., at runtime). In offline autotuning, developers typically
    use heuristics to guide the parameter settings of applicable compiler optimizations
    and code transformations, either using compiler analysis and/or profiling (taken
    from previous executions). The heuristics can lead to the generation of multiversion
    code implementations akin to the ones described in Section 8.4.1 and tend to produce
    optimized, but possibly not optimal results, for a wide range of input codes.


    In online autotuning, there is usually a mix of static analysis and profiling
    to build models, typically about performance, leveraging them at runtime and to
    make code execution decisions. Other models are refined according to information
    collected at run-time. In addition, there are models built entirely at runtime,
    often incrementally, without requiring an offline analysis and model construction.


    As an example, consider a code section with a loop nest to which loop tiling (see
    Chapter 5) was applied and where the block size is a parameter to be tuned. With
    static autotuning, developers analyze the execution time of the loop nest considering
    different datasets and different block sizes. With this profiling information,
    developers then generate code using the specific block size for each dataset input
    characteristics (e.g., sizes of the arrays) corresponding to the best observed
    performance for each combination of dataset input and target architecture.


    With dynamic autotuning, developers may defer this block size tuning to runtime.
    In this context, developers insert additional code in the application in order
    to dynamically change the block size value based on observed dataset sizes or
    even on other input dataset characteristics (e.g., specific values of other relevant
    variables) to implement more sophisticated, albeit with additional overhead, adaptivity
    schemes.


    # OFFLINE AUTOTUNING WITH ISAT


    One way to generate different code versions and other code required to support
    offline autotuning is to use specific code annotations to guide source-to-source
    modifications to output the different versions ready to be compiled and evaluated
    on the target machine. Some approaches also consider the uses of code annotations
    to select sections of code for tuning and for measurements (e.g., timing) and
    to provide specific details regarding the search scheme for tuning as well as
    the software knobs to be explored. One example of a tool that uses this approach
    is the Intel software autotuning tool (ISAT). ISAT is an offline autotuner to
    tune programs taking into account program parameters (e.g., pragmas) and machine
    parameters (e.g., number of cores). ISAT is a source-to-source (C language) tool
    controlled by specific pragmas to create and evaluate multiple code versions based
    on two types of search (dependent and independent). The values to tune are defined
    in the pragma directives using a list of values or ranges (with some support for
    expressions and use of environment parameters).


    *Intel Corp., Intel Software Autotuning Tool, https://software.intel.com/en-us/articles/intel-software-autotuning-tool.


    *Luk C-K, Newton R, Hasenplaugh W, Hammond M, Lowney G. A synergetic approach
    to throughput computing on x86-based multicore desktop processors. IEEE Software
    2011;28(1):39–50.


    Autotuning is analogous to design space exploration (DSE) as it involves a search
    space process to find the best (or an acceptable) configuration for the parameters'
