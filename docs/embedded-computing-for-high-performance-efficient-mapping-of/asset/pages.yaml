    # 5.8.4 REDUCING THE NUMBER OF DIMENSIONS OF ARRAYS


    It is sometimes profitable to transform multidimension arrays into lower dimension
    arrays. This might be needed, e.g., because of the nonsupport of multidimensional
    arrays by some hardware compilers. The following is an example where two-dimension
    arrays are converted into one-dimension arrays.


    ```

    int A[N][M], B[N][M];

    for((i=0;i<M;i++) {

    A[1][j] = 0;

    for((j=0;j<M;j++) {

    A[i][j] += B[1][j]*c;

    }

    }

    ```


    ```

    int A[N*M], B[N*M];

    for((i=0;i<N*M;i++) {

    A[1*M+j] = 0;

    for((j=0;j<M;j++) {

    A[1*M+j] += B[1*M+j]*c;

    }

    }

