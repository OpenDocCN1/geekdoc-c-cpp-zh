  md: '# ## 4.3 STATIC SOURCE CODE ANALYSIS


    We now focus on tools and analysis techniques geared toward static code analysis.
    These tools begin by parsing the source code to generate one or more internal
    representations, abstracting away lexical details, while supporting a representation
    that preserves program semantics and is more adequate for automated code analysis.
    Typical examples of internal representations include abstract syntax trees (ASTs),
    control flow graphs (CFGs), call graphs (CGs), dataflow graphs (DFGs), representations
    based on the static single assignment (SSA) form [7], and Data Dependence Graphs
    (DDGs). While internal representations can be derived directly from the code during
    the parsing process (e.g., ASTs), other representations require prior analysis.
    For instance, the question of whether a function $F$ directly (or indirectly)
    calls $G$, or whether a variable $x$ uses a value defined in a prior statement,
    requires analysis of calls (and the generation of call graphs) and dataflow analysis,
    respectively.


    An important static analysis task is the identification of data dependences. This
    identification is fundamental to decide about the parallelization of the code
    and about the application of many code transformations described in Chapter 5.
    The following subsection describes data dependences and some of the representations
    used to identify those dependences.


    # ### 4.3.1 DATA DEPENDENCES


    A substantial amount of a modern compiler’s effort is dedicated to program analysis
    and transformations often incorrectly described as “optimizations.”$^3$ These
    transformations take advantage of the characteristics of the target architecture
    such as its pipelined execution units, cache memories, and/or multiple execution
    units in the form of multiple homogeneous or heterogeneous cores as is the case
    of systems with multiple CPU cores and additional GPU devices.


    Often, to expose these features, compilers change the execution order of the operations
    as specified by programmers. For example, operations that manipulate the same
    data items should be “bundled” together in the same processing unit. Furthermore,
    operations that manipulate the same data items should also be executed adjacent
    in time. In other words, operations that operate on the same items should be colocated
    in space and in time to expose the benefits of concurrency and locality, respectively.


    At the cornerstone of the compiler transformations, which expose these notions
    of concurrency and locality, is the notion of data dependence that ensures the
    fundamental property of every compiler—correctness. Two sequential operations,
    op1 and op2 (or instructions, i1 and i2) are data dependent if they manipulate
    (either


    $^3$The dependence on input values precludes a compiler to generate optimal code
    for any nontrivial code in what is referred to as “undecidability.”'
