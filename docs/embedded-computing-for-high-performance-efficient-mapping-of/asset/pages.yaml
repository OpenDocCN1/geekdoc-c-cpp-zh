  md: '# 5.3 DATA TYPE CONVERSIONS


    Data types impact memory usage and execution time. Depending on the data type,
    operations may require more or less clock cycles and the number of values that
    can be simultaneously loaded may also vary, e.g., affecting vectorization. It
    is common to convert floating-point data from double to single precision (if the
    resultant accuracy stays at acceptable levels). There are also cases of conversions
    from floating-point to integers and to fixed-point data types. While the effect
    of data type conversions may not be noticeable in most CPUs and GPUs, the impact
    can be very significant when using field-programmable gate array (FPGA)-based
    accelerators. Hence, an analysis of the impact of data conversions must include
    not only the resultant accuracy, but also the overhead associated with these conversions
    and the efficiency of the target architecture to compute operations with these
    transformed data types.


    # 5.4 CODE REORDERING


    In many cases, code reordering may significantly impact performance/energy/power.
    One example is the reordering of loops in nested loops (described in the section
    about loop transformations). In terms of instructions, it is common to rely on
    the reordering performed by the compiler based on data dependences, e.g., when
    scheduling instructions. There are cases, however, where developers may need to
    reorder instructions manually. One example is the reordering of cases in switch
    statements. The most frequent case (the common case) can be moved to the top as
    the top case needs less test and jump operations.


    # 5.5 DATA REUSE


    There are code transformations with the aim of maximizing data reuse. Data reuse
    is very important as it reduces the number of accesses to slow memory by using
    instead faster storage. Data reuse techniques eliminate repeated accesses to the
    same data, saving such data in internal registers and/or in faster access memories
    than where the data is originally stored. Frequently accessed data is saved in
    registers when it is first used and then reused in subsequent accesses. This increases
    data availability and avoids accesses to main memories. However, in the case of
    microprocessors, data reuse techniques may increase register pressure (as we may
    add additional scalar variables to the code), and it is not easy to apply them
    automatically due to compiler difficulties to identify data reuse opportunities
    for some data access patterns. There are cases of data reuse where the optimization
    benefits from hardware support, such as rotating registers.


    Consider the code example in Fig. 5.2. For each iteration of the loop, we load
    one new position of x and two x positions already loaded in previous iterations
    (as shown in Fig. 5.3). We can transform the loop to store in scalar variables
    data that is reused'
