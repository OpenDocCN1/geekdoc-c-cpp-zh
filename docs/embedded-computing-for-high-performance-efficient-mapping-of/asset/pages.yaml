    # 6.5 SHARED MEMORY (MULTICORE)


    OpenMP [21] is an API that allows programmers to exploit data- and task-level
    parallelism on multicore platforms with shared memory (see Chapter 2). One of
    the key features of OpenMP is that programs can be parallelized incrementally
    from an initial sequential version. Once developers identify the regions of code
    that can benefit from parallel execution (e.g., hotspots), the code can be annotated
    with OpenMP directives to define how computations can be distributed across different
    cores and what data are accessed within each core.


    OpenMP provides a set of compiler directives, a routine library, and a runtime
    to implement its execution model (Fig. 6.3). The OpenMP runtime supports parallelism
    using threads. A thread is an autonomous subroutine that can be executed in parallel
    within the context of a process and is transparently scheduled by the operating
    system taking into account available resources and resource utilization. Unlike
    processes, multiple threads share the same address space. One of the design goals
    of OpenMP has been portability: a well-constructed OpenMP program outputs the
    same result whether it uses one thread or multiple threads, affecting only the
    performance according to the level of parallelism attained. To maximize performance,
    the number of threads is usually set as a function of the number of cores available
    in the platform and the workload size. Hence, an OpenMP application can be developed
    such that its workload is efficiently distributed across the available compute
    resources without having to be recompiled.


    ![](img/55beb9162c0073b3a3d7b44f1d5873e8_209_0.png)


    FIG. 6.3 The OpenMP API components.'
