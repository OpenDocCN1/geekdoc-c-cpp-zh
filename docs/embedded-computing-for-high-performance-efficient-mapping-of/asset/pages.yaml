- pgno: 289
  md: '**Code specialization** the derivation of a customized version of a code section
    based on specific values of its input parameters, operands, dataset, workload,
    or environment properties.


    **Computing in space** the execution of different hardware devices or elements.
    In the context of reconfigurable architectures, space computing refers to the
    fact that in these architectures all active logic elements operate in parallel
    in a totally asynchronous fashion. That is, unlike computing in time (see computing
    in time), there are multiple instances of control threads executing concurrently
    when computing in space.


    **Computing in time** a sequential execution mode supported by the abstractions
    of a thread organized around the concept of a program counter and storage. Thread
    instructions use data from the storage as input and upon completion update or
    create new data in storage.


    **Configurable logic blocks (CLBs)** a configurable digital logic structure that
    is a fundamental block of a Field Programmable Gate Array (FPGA). Commonly, composed
    of logic elements such as Flip-Flops (FFs) and Look-Up tables (LUTs) in addition
    to other discrete logic elements or gates.


    **Control step** a step of the control unit common in the implementation of high-level
    hardware synthesis designs. Often in synchronous designs, a control step corresponds
    to a single clock cycle.


    **Cycle-accurate simulators** a simulator that tracks the number of clock cycles
    required to execute (and retire) a given code section or application (see instruction-level
    simulators).


    **D**


    **Data parallelism, SIMD and SPMD** a form of concurrent execution where different
    processing elements operate on disjoint sections of the same data structure (e.g.,
    an array) and typically, in a very tight synchronization mode (i.e., in locked
    step). Instruction-level data parallel execution is often referred to as Single
    Instruction, Multiple Data (SIMD) where the same instruction is executed on different
    portion or sections of a single data item or data items that are colocated in
    space (see also SSE and MMX instructions). At a coarse grain level, data parallel
    execution is also referred to as Single Program, Multiple Data (SPMD) where processing
    elements operate on disjoint data items with looser execution control.


    **Dataflow computing** a form of execution in which processors are allocated tasks
    from a task graph (or workflow) and are executed whenever their inputs are available.
    The task outputs are then propagated to inputs of other tasks (often via the use
    of FIFO buffers) which will trigger the execution of further tasks. Unlike data-streaming
    computing, there is no notion of time synchronization between inputs.


    **Data-streaming computing** a form of execution in which processors are allocated
    tasks from a task graph (or workflow). Tasks are executed when data is streamed
    (or "pumped") through the inputs (often subject to data rate control) and through
    the various outputs and inputs of subsequent tasks. Unlike data flow computing
    (see dataflow computing), data-streaming input items are "time synchronous" in
    the sense that they are processed as an "item" through the task graph producing
    the corresponding set of output items (see also task-level pipelining).


    **Def-use chains** a data structure that identifies for a program variable definition
    (write) all uses (reads) that are reachable from that definition.'
  merge: -1
  img_proc: true
- pgno: 290
  md: '**Delay** the time required for a computation or logic circuit to produce a
    change in its output (if any), given a change in the inputs.


    **Dependence direction vector** a vector of the iteration space of a given loop
    that defines the minimum dependence distance between distinct instances of instructions
    in the referred loop. It is an n-dimensional vector defined over the loop in an
    n-dimensional Cartesian space. This distance can be a constant vector in which
    case it is referred to as a dependence distance vector or include approximated
    distances vector in a summarized form as positive, negative, or unknown distance.


    **Dependence distance vector** an n-dimensional vector representing the iteration
    space graph of an n-dimensional loop nest, which captures the dependence distance
    between array accesses. While this vector captures the “shape” of the dependences,
    it loses where the dependences originates. For example, the array references A[i]
    and A[i − 1] on a single dimensional 1-loop have a dependence distance of 1 iteration.


    **Design space exploration (DSE)** a technique for deriving optimized designs
    by exploring different configurations, such as input parameters, source transformations,
    and compiler options. Each generated design may exhibit distinct “performance”
    metrics such as power/energy or wall-clock time performance, and provide different
    trade-offs between them (see also Pareto points).


    **Dynamic analysis** a program analysis performed at runtime. By exercising the
    application with one or more input datasets, dynamic analysis can uncover information
    that cannot be collected statically, such as the number of iterations of a given
    loop, or the specific values of a procedure’s argument.


    # E


    **Embedded DSL** a Domain-Specific Language (DSL) that inherits the same language
    constructs as the host language, while adding new domain-specific primitives to
    allow programmers work at a much higher abstraction. One of the key benefits of
    Embedded DSLs is that DSL descriptions can often be compiled with the same toolchain
    as the host language.


    # H


    **Hard real-time constraints** constraints that must meet all the deadlines prescribed
    in the requirements to be considered a feasible solution (in contrast to soft
    real-time constraints). Examples of systems with hard real-time constraints include
    nuclear facilities, flight control systems, and medical life-support systems.


    **Hardware processors** a term used when a VLSI design includes a block in the
    silicon layout that is a copy of the VLSI mask of the processor layout. This is
    also often referred to as “hard IP.”


    **Hardware design and synthesis** the process of capturing the structure and behavior
    of a digital circuit, including the spatial organization of the hardware as well
    as its timing control, using a hardware-oriented programming language such as
    Verilog or VHDL. The process of generating a configuration file targeting a specific
    reconfigurable device such as an FPGA is called hardware synthesis and requires
    a specific design-flow toolchain.


    **Hardware knobs** an interface to adjust specific aspects of the hardware systems,
    such as clock frequency, sharing of caches, and storage capacity allocated to
    OS (operating system) vs user programs. Unlike software knobs, which are application
    specific, hardware knobs affect the operation of the system across all applications.'
  merge: -1
  img_proc: true
- pgno: 291
  md: '**Hardware synthesis** the translation from VHDL or Verilog descriptions to
    a specific Register-Transfer-Level (RTL) description, then used by other tools
    to synthesize either bit-level specifications for the target hardware or directly
    targeting a library of predefined IP blocks.


    **Hardware/software codesign** the process of designing computing systems consisting
    of both hardware and software components. It is by nature a cooperative and concurrent
    design process as the decision to use specific hardware components targeting selected
    sections of an application must take into account its global impact (see Hardware/software
    Codesynthesis and Hardware/software Partitioning).


    **Hardware/software codesign** one of the stages of the hardware/software codesign
    process, responsible for synthesizing software code and hardware components of
    the target system, as well as its interface (including communication and synchronization)
    (see Hardware/software Codesign).


    **Hardware/software partitioning**: the process of identifying which sections
    of the application will execute either on software or on hardware components of
    the target architecture (see Hardware/software codesign).


    **Hardware in the loop** a term used to identify a computer simulation of a system
    using real hardware for some of its components.


    **High-level synthesis (HLS)** a software tool that translates computations specified
    in a high-level programming language such as C to a hardware specification language
    such as VHDL or Verilog. This is often referred to as a "C-to-gates" high-level
    synthesis.


    **Hotspots** regions (also known as critical sections) of the program''s code
    that account for a high percentage (or fraction) of the program''s execution time,
    and are thus prime candidates for optimization and/or hardware acceleration.


    **Instruction-level simulators** a simulator that can trace the execution of an
    executable program code one instruction at a time. It provides the user the ability
    to inspect the various instruction fields and verify the functionality of a given
    program (see cycle-accurate simulators).


    **Instruction set architecture**: the instruction set architecture, or ISA, of
    a processor defines all the commands that a processor can execute, providing an
    interface between applications running on the platform and its hardware.


    **Internet of things (IoT)** the synergetic interconnection between embedded devices,
    applications, and other physical devices that allows them to share data across
    the Internet.


    **Intrinsics** sequences of instructions specifically targeted for a given architecture
    (for instance, taking advantage of the cache line sizes and pipeline depths).
    These are often called intrinsic functions and are inlined at the corresponding
    call sites.


    **Iteration space graphs** a representation in which all the iterations of a nested
    loop are explicitly represented along with the dependences between them. In some
    representations, each iteration indicates explicitly all the instructions associated
    to each iteration along with the respective dependences within and across iterations.


    **Iterative compilation** the process where compiler optimizations and/or code
    transformations are successfully applied to a program and then evaluated, for
    instance, by executing the program. The compiler optimizations that best satisfy
    a given objective (e.g., performance improvements, energy savings) are selected.'
  merge: -1
  img_proc: true
- pgno: 292
  md: '# L


    **Lane** segments of elements that are packed into vectors (forming groups of
    elements) used in the context of SIMD units. For instance, in a 128-bit vector
    we can consider four lanes of 32-bit elements (i.e., a group of four 32-bit elements),
    two lanes of 64-bit elements, and so on.


    **Latency** the time needed (usually in terms of the number of clock cycles) for
    a computation to terminate from the time it started. This specific term is common
    in the context of pipelined execution of instructions, for instance, when mentioning
    that a specific instruction has K cycles of latency.


    **Lexically forward/backward dependence** a loop-carried dependence between two
    statements S1 and S2 is lexically backward if S2 appears before S1 in the loop
    body, otherwise this dependence is considered lexically forward.


    **Little-endian and big-endian** the order in which bytes in an addressable word
    are stored in memory. In the big-endian order, the most significant byte (or bit)
    of a word is stored in the lower physical addresses. For instance, a 4-byte (32-bit)
    word will have the most significant byte stored at address $N$ and the least significant
    byte stored at address $N+3$. In the little-endian order, the most significant
    byte is stored at address $N+3$, whereas the least significant byte is stored
    at address $N$.


    **Logic synthesis** the process of translating a hardware design described in
    register-transfer level (RTL) style into a lower level design representation (circuit
    netlist) consisting of gates (e.g., ANDs, ORs) and registers (flip-flops).


    **Look-up table (LUT)** a hardware structure that implements, in the context of
    FPGAs, a table with $N$ inputs (typically between 3 and 6) and one or two outputs.
    This table can be reconfigured (i.e., its content can be uploaded postfabrication
    or in the field) and can be implemented as an SRAM. In FPGAs, each LUT can implement
    an $N$-input logic function, a shift register, and/or a distributed memory.


    # M


    **Manycore and Multicore Architectures** a manycore architecture is composed of
    a very large number of (homogeneous) cores that are loosely coupled and often
    used in high-performance applications due to its high degree of parallelism. In
    contrast, a multicore architecture has comparably less number of cores however
    each of them is more powerful. Furthermore, these cores are closely coupled, often
    sharing cache resources, and are thus more amenable to fine grain concurrency
    management as the synchronization costs are lower than using a message passing
    style of communication.


    **Mapping (hardware synthesis)** a hardware synthesis stage which assigns all
    logic and storage elements of the circuit''s netlist (output of logic synthesis
    and consisting of gates and registers) to generic FPGA resources, such as LUTs
    and registers.


    # 0


    **Overlay architectures** coarse grained architectures with components that are
    synthesized from a much finer grained set of elements. The common overlay architecture
    is based on fine grained FPGA configurable blocks to define a “virtual” coarse
    grained architecture with processing elements, each of which has its own ALU,
    local storage, and communicate with other processing elements in the overlay architecture
    via specific interconnect resources or via a network on a chip.'
  merge: -1
  img_proc: true
- pgno: 293
  md: '**Owner-computes rule** a rule used by HPF (High-Performance Fortran) compilers
    that states that the processor that owns the left-hand side element of an assignment
    statement performs the calculation. In this context, the components that own the
    data used in the right-hand side must communicate the data to the owner, which
    subsequently performs the computation.


    # P


    **Pareto points** a set of design points which provide trade-offs between potentially
    conflicting criteria, whereby improving one criterion invariably worsens another.
    Often used in the context of multiobjective optimizations.


    **Performance** the numerical inverse of the time to execute a given workload,
    and is commonly used in the context of evaluating computer architectures and applications.
    Hence, an increase in performance means a reduction of the execution time. It
    is, however, common to use performance in a more generic sense to capture other
    metrics, such as power and/or energy, or the overall efficiency of a given algorithm
    (including the quality of its results).


    **Phase detection** a term used in the context of application profiling where
    developers attempt to characterize sections of their applications with remarkably
    distinct behavior, either in terms of performance, energy or memory access pattern
    behavior, floating-point intensity, or any other hardware- or software-based metric.


    **Phase selection and ordering** a term used in the context of the optimization
    (transformation) phase of a compiler. This phase is often structured as a sequence
    of lower-level phases or “passes.” The effectiveness of the compiler’s optimization
    depends largely on which phases (or passes) are selected and in which order they
    are applied. It is common that a particular ordering of phases (or passes) is
    applied multiple times.


    **Placement and routing** a hardware synthesis stage which is executed after the
    mapping stage, and is responsible for assigning the generic logic and storage
    FPGA resources to available physical FPGA resources and to interconnect them using
    fabric routing resources.


    **Predictable memory accesses** a type of memory accesses that can be determined
    or predicted at compile time (statically) by inspecting the source code or even
    through binary code-level analysis.


    # R


    **Reconfigurable fabric** a generic term used to describe a computing architecture
    that contains programmable compute elements (such as in the case of CLBs) and/or
    interconnections that are also configurable.


    **Register-transfer level (RTL)** a design specification that models synchronous
    digital circuits in terms of registers (flip-flops) and combinatorial components,
    e.g., formed by logic elements such as AND, OR, and NOT gates.


    **Row-major and Column-major** two common organizations of multidimensional array
    variables. In the row-major organization, the array is laid out in memory by rows
    whereas in a column-major it is laid out by columns. This memory organization
    is defined in terms of virtual addresses, not physical addresses, as the underlying
    hardware and operating system might impose a specific mapping for consecutive
    virtual addresses in terms of the ordering of addresses.'
  merge: -1
  img_proc: true
- pgno: 294
  md: '# S


    **Scratchpad memory** a storage structure that is typically not a part of the
    traditional processor address space but instead private to a computation unit
    or processor, and is used to explicitly save and restore temporary data.


    **Shader cores** a programmable computing core designed to implement in hardware
    specific vertex geometry shading operations.


    **Slack** a metric used to identify the delay or latency between the completion
    of a computation and a specific timing mark. For instance, if the objective is
    to have a computation completed in 100 clock cycles and the implementation is
    able to accomplish it in 80 clock cycles, then the time slack of this execution
    is 20 clock cycles. Slack can be negative, which means that the actual completion
    has extended beyond the preset timing mark.


    **Slices** groups of FPGA logic resources, where each slice contains a small set
    (typically 2) of configurable logic blocks or CLBs (see look-up table and configurable
    logic blocks).


    **Soft real-time constraints** constraints that may miss some of the deadlines
    and still be deemed feasible. A secondary performance metric assesses the utility
    of the systems as a function of the number and severity of the deadlines missed.
    Examples of these systems include sound/image systems where missing a deadline
    may lead to a loss of quality but not to catastrophic results.


    **Software processors** term used when a processor component is mapped onto the
    underlying architecture of the device. This is commonly used in the context of
    FPGAs, where a processor specification is mapped on configurable logic blocks
    (CLBs). This is often referred to as a “soft IP” (see also Overlay Architectures).


    **Software knobs** algorithmic parameters that can be tuned for enhanced efficiency
    or effectiveness to specific inputs. These parameters can be tuned by the programmer
    using these so-called software knobs, often exposed via a GUI interface or a set
    of application preferences.


    **Source-to-source compiler** a compiler that receives as input a high-level description
    using programming languages such as C or FORTRAN, and outputs (transformed) high-level
    source code, possibly using the same high-level programming language. Source to
    source is used in the context of analysis, source code-level instrumentation,
    and source code transformations (e.g., code refactoring).


    **Static analysis** a compile time analysis of a program or part of it. Uses a
    combination of data- and control-flow analysis to derive information such as def-use
    chain and liveness.


    **Subword-level parallelism (SLP)** instructions that operate in a concurrent
    fashion on subsets of the underlying base word size. For example, one can use
    subword instructions to operate on four 8-bit elements on a 32-bit word performing
    operations such as masking or even averaging 8-bit integer values, taking into
    account subword boundaries for arithmetic operations, as described subsequently.


    **Superlinear speedup** sublinear speedup metrics used when analyzing a speedup
    metric. In the presence of multiple available processing elements, workload can
    be distributed across them. We can expect that, if we double the number of processors,
    the performance is also doubled if the workload distribution is properly balanced
    and all processors are working at peak capacity. In this case, we say that performance
    has scaled linearly. However, if the performance is less than double than we say
    that performance scaled sublinearly. This can happen if the increase in the number
    of processors, which leads to less workload per processor, results in memory or
    IO bottlenecks. On the other hand, the computation scales'
  merge: -1
  img_proc: true
- pgno: 295
  md: 'superlinearly if the performance more than doubles. This can happen, for instance,
    when the workload allocated to each processor fits in the cache memory, thus increasing
    the performance of individual processors. Furthermore, in the context of a distributed
    system, the reduction in workload size may also lead to reduce or hide network,
    memory, and disk storage bottlenecks in each machine.


    **Systolic array** a homogeneous parallel computing architecture where each processing
    node is interconnected in a very regular fashion, typically in a two-dimensional
    grid. These architectures typically accomplish their computation by “waves” of
    data flowing and/or pulsating along one or more direction.


    # T


    **Task parallelism** a form of concurrent execution where different tasks or code
    sections are executed concurrently by different processing elements, requiring
    explicit synchronization between them whenever tasks need to share data or to
    satisfy control and data dependencies.


    **Task-level pipelining** an execution mode in which different processors (or
    application-specific architectures) execute sequences of data-dependent tasks
    in a pipelined fashion. Synchronization and data communication between executing
    tasks is typically achieved via FIFO buffers or other communication channels.


    **Thread-level parallelism** a form of parallelism in which tasks execute asynchronously
    within the same execution environment (address space) and communicate using specific
    synchronization primitives, such as semaphores and locks. The threading environment
    is managed by the operating system.


    **Timespan** a time frame or a span of time in the context of execution time or
    scheduling.


    **Toolchain, tool flow, design-flow** a generic name given to a set of synthesis
    and compilation tools that work together to produce an executable specification
    and/or a hardware design specification.


    **Trip count or iteration count (loop iterations)** the number of times a loop
    body is executed. The trip count can be statically determined if loop bounds can
    be determined at compile time (e.g., they are constants).


    # U


    **Unit-stride accesses (stride-one accesses)** a term used when successive accesses
    to array elements are performed on contiguous locations of memory.


    **Use-def chains** a data structure that indicates for a program variable (read)
    all definitions (writes) that can reach that use. Hence, a UD chain allows a compiler
    to determine which are the possible write operations (definitions) that can influence
    the result of a specific read operation.


    # V


    **Vector length** the number of consecutive data items that a vector instruction
    can handle. Vector length supports the auto-vectorization process by providing
    the correct factor to unroll and strip-mine to derive suitable vector instructions.


    **Vector splats** term used when assigning all elements of a vector to a certain
    value (the value can be given by a scalar variable, by a constant, or by an element
    of the vector).'
  merge: -1
  img_proc: true
- pgno: 296
  md: '**Vectorization/auto-vectorization** a feature supported by most compilers,
    which include program analysis and code transformations that automatically infer
    vector instructions from loop-based computations in order to maximize performance.


    # W


    **Worst-case execution time (WCET)** a timing analysis that computes the worst-case
    execution time of a section of a code for all possible data inputs and possible
    environment conditions. This metric is key to perform scheduling analysis for
    real-time safety-critical systems.


    # Z


    **Zero stride** a type of stride in which only a single element of the array (in
    a specific position) is to be used in all the computations. Conceptually, it can
    be used in a vector operation as a constant.'
  merge: -1
  img_proc: true
