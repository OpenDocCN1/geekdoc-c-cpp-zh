- pgno: 262
  md: '# Additional topics


    # 8.1 INTRODUCTION


    This chapter focuses on topics that complement the contents of previous chapters.
    In particular, it covers techniques for design space exploration (DSE), hardware/
    software codesign, runtime adaptivity, and autotuning. There has been a growing
    interest and need for these techniques, given the increasing complexity of high-
    performance embedded architectures and the development of applications with increasingly
    high computing demands. The challenge of targeting applications to high-performance
    embedded architectures is further exacerbated by the need to manage different
    development tools and code versions for each of the target architectures.


    The goal of this chapter is to introduce these techniques by exposing the readers
    to main concepts, hoping that those concepts can assist developers to explore
    alternative approaches in their own work. In this perspective, we include simulated
    annealing [1] as a generic optimization approach applicable to many problems and
    problem domains.


    # 8.2 DESIGN SPACE EXPLORATION


    Design Space Exploration (DSE) is the process of finding a design'' solution,
    or solutions, that best meet the desired design requirements, from a space of
    tentative design points. This exploration is naturally complex, as the search
    may involve tentative designs resulting from applying code transformations and
    compiler optimizations at various levels of abstraction and/or from the selection
    of specific values of parameters (e.g., configurations) or even the selection
    of algorithmic alternatives. As it is common when considering the diversity of
    embedded systems currently available on the market, the sheer size of this search
    space makes imperative the automation of the selection of alternative design choices
    and of the corresponding design generation and evaluation.


    > ''The term design is often associated with a hardware design, but it is used
    here in a broader sense to refer to a hardware/software design.'
  merge: -1
  img_proc: true
- pgno: 263
  md: 'While there are cases where an exhaustive search can be pursued, or where heuristics,
    dynamic programming, and branch-and-bound approaches are successful in deriving
    optimal design solutions, in the vast majority of the design cases, an exhaustive
    exploration of this space, even if automated, is infeasible. DSE approaches must
    therefore derive designs in useful time while satisfying given requirements (e.g.,
    related to performance). Approaches for DSE use a variety of algorithmic techniques,
    namely, stochastic optimization methods such as random search, evolutionary algorithms,
    swarm algorithms, stochastic hill climbing, and even machine learning. In terms
    of the evaluation of each design point (tentative solution), developers can typically
    use one of two approaches (or a combination of both): (1) empirical evaluation
    using measurements from real execution or from simulation; (2) performance models,
    possibly analytical, to derive the required information. Regarding the optimization
    criteria, designs can be categorized as either single objective (possibly with
    multiple criteria) or multiobjective as described next.


    # 8.2.1 SINGLE-OBJECTIVE OPTIMIZATION AND SINGLE/MULTIPLE CRITERIA


    The goal of a single-objective optimization problem is to find the best solution
    for a specific criterion or metric, such as execution time (or performance) and/or
    a combination of this metric with energy consumption or power dissipation metrics.
    We can further combine multiple criteria into a single-objective optimization
    problem by defining the single-objective cost function as a weighted sum of the
    normalized costs associated with each of the metrics as given in Eq. (8.1), where
    \(\alpha > 0\) and \(\sum_{i=1}^k \alpha_i = 1\).


    ```

    Cost = \(\alpha_1 \times Cost_{n1}/Cost_{n1}^f + \alpha_2 \times Cost_{n2}/Cost_{n2}^f
    + \dots + \alpha_k \times Cost_{nk}/Cost_{nk}^f\) (8.1)

    ```


    As a particular case, Eq. (8.2) presents an example of a cost function consisting
    of a weighted sum of three metrics, namely, execution time, energy consumption,
    and power dissipation. These three metrics can be normalized using the costs of
    an initial nonoptimized solution as a reference.


    ```

    Cost = \(\alpha_1 \times Cost_{time}/Cost_{time}^f + \alpha_2 \times Cost_{energy}/Cost_{energy}^f
    + \alpha_3 \times Cost_{power}/Cost_{power}^f\) (8.2)

    ```


    In this example, the DSE goal can be defined as finding a design solution with
    the minimum cost, i.e., all the criteria are now combined in a single cost. However,
    there are cases where the goal of the DSE consists in minimizing multiple metrics,
    i.e., as a multiobjective problem. In this case, it is important to consider Pareto
    optimal solutions, as described next.'
  merge: -1
  img_proc: true
- pgno: 264
  md: '# ## 8.2.2 MULTIOBJECTIVE OPTIMIZATION, PARETO OPTIMAL SOLUTIONS


    A multiobjective optimization problem involves finding a set of optimal solutions
    for different and often competing (or conflicting) objectives: Fig. 8.1 presents
    an illustrative plot of various design points based on two criteria: execution
    time and power dissipation. While it is desirable to reduce both execution time
    and power dissipation, these tend to conflict. For instance, to reduce execution
    time we may increase the circuit operating voltage and clock rate, which leads
    to an increase in dissipated power. As a result, designs with lower power dissipation
    tend to execute slower, and conversely design points with higher power dissipation
    tend to run faster. Yet, not all designs plotted in this chart provide a good
    trade-off between execution time and power dissipation, thus prompting the need
    to develop a method for comparing all feasible designs so that developers can
    determine which design is the most profitable.


    To this effect, we consider that each design is characterized by a vector \(x
    = (x_1, ..., x_d) \in F\), where each element corresponds to an objective measurement
    such as speed and power dissipation, \(d\) is the number of objectives, and \(F\)
    is a \(d\)-dimensional objective space for the design problem. We also assume
    that each measurement \(i \in \{1, ..., d\}\) measurement can be compared with
    orders \(<\) (\(x_i\) is better than \(y_i\)) and \(\le\) (\(x_i\) is better or
    equal than \(y_i\)). We say design \(x = (x_1, ..., x_d) \in F\) dominates design
    \(y = (y_1, ..., y_d) \in F\) iff:


    +   - \(x\) is "better" than y with respect to at least one objective: \(\exists
    i \in \{1, ..., d\} : x_i < y_i\)

    +   - \(x\) is not "worse" than y with respect to other objectives: \(\forall
    i \in \{1, ..., d\} : x_i \le y_i\)


    Using this definition of dominance, design A in our illustrative example (Fig.
    8.1) dominates design B as both exhibit similar execution times, design A dissipates
    less power. Hence, intuitively, design B is less desirable than design A and can
    be discarded from the DSE process. In this plot, the designs not dominated


    ![](img/55beb9162c0073b3a3d7b44f1d5873e8_264_0.png)


    **FIG. 8.1** Example of Pareto points of and a Pareto front.'
  merge: -1
  img_proc: true
