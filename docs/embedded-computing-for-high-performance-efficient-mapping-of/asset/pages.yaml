    the application during execution.


    One implication of the dynamic partitioning process is that all the application
    code, except for managed tasks, is handled by the host CPU. A managed task, however,
    is handled by the Executive process, and its execution depends on available task
    implementations and computing resources. In particular, a task can be associated
