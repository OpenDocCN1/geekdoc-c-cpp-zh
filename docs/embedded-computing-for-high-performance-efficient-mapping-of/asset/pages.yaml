  md: 'best practices, understanding available retargeting mechanisms, and deploying
    and testing the application. The resulting code, while being more efficient, often
    becomes difficult to maintain since it becomes polluted with artifacts used for
    optimization (e.g., with new API calls and data structures, code transformations).
    For this reason, developers often keep two versions of their source code: a functional
    version used to verify correctness and an optimized version which runs more efficiently
    on a specific platform.


    This chapter is organized as follows. In Section 6.2, we provide a brief overview
    of common retargeting mechanisms. Section 6.3 briefly describes parallelism opportunities
    in CPU-based platforms and compiler options, including phase selection and ordering.
    Section 6.4 focuses on loop vectorization to maximize single-threaded execution.
    Section 6.5 covers multithreading on shared memory multicore architectures, and
    Section 6.6 describes how to leverage platforms with multiprocessors using distributed
    memory. Section 6.7 explains CPU cache optimizations. Section 6.8 presents examples
    of LARA strategies related to code retargeting. The remaining sections provide
    further reading on the topics presented in this chapter.


    To illustrate the various retargeting mechanisms described in the following sections,
    we consider the multiplication of two matrices A ($nX$ rows and $nY$ columns)
    and B ($nX$ rows and $nZ$ columns) producing a matrix C ($nX$ rows and $nZ$ columns),
    generically described as follows:


    $C = AB, \quad s.t. C_{ij} = (AB)_{ij} = \sum_{k=0}^{n-1} A_{ik}B_{kj} \quad A
    \ 0 \le i < nX \ A \ 0 \le j < nZ$


    This matrix product computation is a key operation in many algorithms and can
    be potentially time consuming for very large matrix size inputs. Although several
    optimized algorithms have been proposed for the general matrix multiplication
    operation, we focus, as a starting point, on a simple implementation in C, described
    as follows:


    ```

    void matrix_mult(float *A, float *B, float *C) {

    for (int i = 0; i < nX; i++) {

    for (int j = 0; j < nZ; j++) {

    C[i*nZ+j] = 0;

    for (int k = 0; k < nY; k++) {

    C[i*nZ+j] += A[i*nY+k] * B[k*nZ+j];

    }

    }

    }

    }

    ```


    To compute each element of matrix C (see Fig. 6.1), the algorithm iterates over
    row i of matrix A and column j of matrix B, multiplying in a pair-wise fashion
    the elements from both matrices, and then adding the resulting products to obtain
    Cij.


    Although this is a simple example, it provides a rich set of retargeting and optimization
    opportunities (clearly not exhaustively) on different platforms. Yet, its use'
