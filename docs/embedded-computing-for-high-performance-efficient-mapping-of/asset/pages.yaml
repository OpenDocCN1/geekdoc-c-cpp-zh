  md: 'dependence distances have some “shape,” meaning that there is a precise dependence
    in some loops, but for other loops the dependence is less precise. For instance,
    a dependence vector can have the form D =(0,>) which indicates that there is no
    dependence along the iterations of the first loop of the nest, but there are positive
    dependence distances between the iterations of the second loop still for the same
    iteration of the first loop. While less precise, this dependence distance is still
    useful as the iterations of the first loop can be executed concurrently as long
    as the iterations of the second loop execute sequentially, thus following their
    original execution order. In this example, the compiler can transform the outer
    for loop into a parfor construct to indicate that iterations of the specific loop
    can be executed concurrently and hence in arbitrary order with respect to each
    other, possibly even on distinct execution units.


    Given a loop nest, the compiler can determine which loop of the nest does carry
    a dependence, meaning which loop does require all of its iterations to be executed
    in the original sequential order. To determine this information, a compiler can
    make use of the notion of a lexicographically positive dependence vector. We define
    a dependence vector D =(d1 , ..., dn ) to be lexicographically positive, if and
    only if its first nonzero component (starting from d1 towards dn ) is positive.
    In addition, we say that the loop corresponding to this first nonzero component
    is the loop that carries the (data) dependence of the loop nest. A compiler can
    thus build a simple concurrency test by examining all the dependence vectors uncovered
    and check which one has the first loop in the nest that carries a data dependence.
    All outward loops of this loop including itself must execute sequentially. All
    outward loops in the nest can execute concurrently. The example in Fig. 4.43,
    albeit simple, shows how the compiler can determine that the first loop of the
    nest, the i-loop, can be executed concurrently whereas the inner loop, the j-loop,
    must execute sequentially.


    While in many cases it is not possible to directly uncover parallelizable loops
    in a given loop nest, it is still possible to apply transformations that expose
    parallel loops. In Fig. 4.4A we present a loop nest that has a dependence distance
    vector of D =(1, 0). The outermost loop, the i-loop, carries the dependence thus
    making it impossible to parallelize this loop. However, it is possible to permute
    the two loops in the nest, i.e., exchange the order in which the two loops are
    executed thus exposing the concurrency at the outermost loop.


    One can formalize this loop permutation transformation by using what is referred
    in the literature as unimodular loop transformations as captured by a transformation
    matrix T [12]. Given an input loop nest with a set of dependence vectors d ∈ D,
    T is a legal loop transformation if and only if, for all d ∈ D, T.d ≥ 0. In other
    words, for every dependence distance vector the transformed dependence distance
    vectors need to be lexicographically positive.'
