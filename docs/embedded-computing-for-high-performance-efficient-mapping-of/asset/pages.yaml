  md: 'lower computational intensity and be more likely to be memory bound. Conversely,
    algorithms requiring more computation than data movement will have a higher computational
    intensity and be more likely to be compute bound.


    The roofline performance model [1,2], introduced in Chapter 2, provides a useful
    visualization of how a given application (or one of its kernels) performs when
    exploiting various architectural and runtime features of a specific platform (e.g.,
    multicore, hardware accelerators, cache memories). The most basic roofline model
    can be derived by plotting the computational throughput (y-axis) as a function
    of operational intensity (x-axis). The resultant curve, as presented in Fig. 7.1,
    defines two performance bounds under which the application performance exists:
    the memory bandwidth ceiling and the computation performance ceiling, both of
    which are plot performance specific. As expected, implementations with high operational
    intensity will hit the peak computation ceiling as they require more computation
    than data movement, otherwise they will hit the memory bandwidth ceiling.


    When retargeting an application or a kernel to a specific platform, we seek implementations
    that perform as close as possible to the peak computation performance of the platform.
    In the example presented in Fig. 7.1, only implementation Z hits this ceiling.
    While it may not always be possible to achieve peak computation performance, especially
    in cases where an algorithm has inherently low computational demands, the following
    techniques can be used to maximize performance:


