  md: 'In this context, the decision maker must provide a set of weights \( w_i >
    0 \) to each objective function \( f_i(x) \) according to their importance:


    ```

    \(\min_{x \in X} \sum_{i=1}^k w_i f_i(x), \quad s.t. \ x \in X\)

    ```


    This approach requires normalizing the objective functions since they express
    incomparable metric values, e.g., execution time and power dissipation. Furthermore,
    this method cannot identify Pareto points if they are in the nonconvex regions
    of the Pareto frontier.


    +   \(\epsilon\)-constraint method. Instead of weights, this method requires selecting
    one objective function \( f_i(x) \) to be minimized, while the remaining objective
    functions are constrained by an upper-bound limit \( \epsilon_i \):


    ```

    \(\min f(x) \\

    s.t. \quad x \in X, f_i(x) \le \epsilon_i, \quad \text{for } i \in \{1, ..., k\}
    \setminus \{j\}\)

    ```


    +   Utility function method. This is a general method that requires a utility
    function \( u(t) \) expressing preferences between designs. If \( u(f_1(x), ...,
    f_k(x)) > u(f_1(y), ..., f_k(y)) \), then design \( x \) is preferable over \(
    y \) allowing the best design to be determined by solving:


    ```

    \(\max \ uf(x), \quad s.t. \ x \in X\)

    ```


    In practice, finding the population of all feasible designs is a computationally
    intensive process as the number of possible sequences of optimizations used to
    generate each individual design is extremely large. Therefore, developers rely
    on metaheuristic optimization algorithms, such as simulated annealing or evolutionary
    algorithms [3], to guide the search process. Alternatively, developers can combine
    the methods described earlier to rank designs and/or identify their neighbors,
    and find (possibly in an iterative fashion) feasible designs close to the Pareto
    optimal solutions.


    # 8.2.3 DSE AUTOMATION


    The automation of the DSE process is based on three major components: the search
    space algorithm, the definition (or synthesis) of each design point being explored,
    and the evaluation of each design point. For each of these components, the DSE
    process can use several techniques, namely:


    +   Search space algorithm approaches include: 1—combinatorial optimizations,
    such as Simulated Annealing (SA), Tabu-Search (TS), Genetic Algorithms (GA), Ant
    Colony optimization algorithms (ACO), Particle Swarm Optimization (PSO); 2—Integer-Linear
    Programming (ILP) solvers;'
  merge: -1
  img_proc: true
