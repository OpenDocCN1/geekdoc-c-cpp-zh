- pgno: 196
  md: 'systematically to optimize the application on a hardware platform while guaranteeing
    compilation correctness with respect to the original code. Even when performing
    automatic code transformations by a compiler, developers might need to identify
    a sequence of code transformations with the correct parametrization (e.g., loop
    unroll factors) to derive implementations complying with given nonfunctional requirements.
    There are instances, however, when developers must completely change the algorithm
    to better adapt to a platform, for example, by replacing a recursive algorithm
    with an iterative stream-based version when targeting an FPGA-based accelerator.


    +   3. Code annotations. Developers can annotate their programs using comments
    or directives (e.g., pragmas in C/C++) to support a programming model or to guide
    a compiler optimization process. Code annotations are not invasive and usually
    do not require changing the code logic. Nonetheless, this method has been successfully
    used by developers to parallelize their sequential applications by identifying
    all the concurrent regions of their code. Such approaches include directive-driven
    programming models as is the example of OpenMP [21]. The code annotation mechanism
    has the advantage to allow programs to preserve a high degree of portability since
    code annotations can be easily removed or ignored if not activated or even supported.


    +   4. Domain-specific libraries. Libraries are often employed to extend the compiler
    capabilities and generate efficient code. In contrast with code annotations, integrating
    a library into an application often requires considerable changes in the application
    source code, including introducing new data structures and replacing existing
    code with library calls. Hence, portability can become an issue if the library
    is not widely supported on different platforms. Still, libraries can provide an
    abstraction layer for an application domain, allowing developers to write applications
    using the library interface without having to provide implementation details.
    This way, application can be ported with little effort to a different platform
    as long as an optimized library implementation is available for that platform,
    thus also providing some degree of performance portability. An example of a portable
    application domain library is ATLAS [2] for linear algebra, which is available
    for many platforms. In addition, libraries can support a programming model for
    a specific computation platform, allowing the generation of efficient code. The
    MPI library [22], for instance, supports platforms with distributed memory.


    +   5. Domain-specific languages. Another mechanism for retargeting applications
    involves rewriting parts of the source code using a domain-specific language (DSL)
    [3] to support an application domain or a specific type of platform. DSLs can
    be embedded within the host language (e.g., C++, Scala), often leading to “cleaner”
    code when compared to code that results from the use of domain-specific libraries.
    Alternatively, DSLs can be realized using a separate language and/or programming
    model (e.g., OpenCL) than the one employed by the host. In this case, the DSL
    requires its own toolchain support.'
