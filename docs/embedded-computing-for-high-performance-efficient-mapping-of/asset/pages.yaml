- pgno: 146
  md: '# Source code transformations and optimizations


    # 5.1 INTRODUCTION


    In the presence of strict requirements, involving, e.g., performance, energy,
    or power consumption, it may not be enough to delegate to compilers the task of
    automatically satisfying these requirements through the use of standard compiler
    optimizations (such as using –O2 or –O3 command-line options with compilers such
    as GCC or ICC). While code transformations have an important role in improving
    performance, save energy, reduce power consumption, etc., many code transformations
    are not included in the portfolio of optimizations in mainstream compilers. Especially
    because most code transformations are not general enough to justify the effort
    to include them. Thus, code transformations may need to be manually applied by
    developers. This, however, imposes an additional burden on developers, as in order
    to apply a specific code transformation one needs to understand if it is legal
    and if it is profitable. Usually, to understand if it is legal, one needs to perform
    a specific type of static analysis that depends on the transformation at hand.
    An analysis of profitability also needs to be conducted, and it is usually not
    easy for inexperienced developers to understand the impact of a transformation
    unless they manually apply it and measure its impact directly. In addition, the
    analysis might need experiments with this code transformation, e.g., to tune its
    parameters.


    In practice, profiling is also used to decide whether to apply a specific code
    transformation. There are cases, however, where the improvements achieved by a
    code transformation depend on the dataset and execution environment. In this case,
    developers may need to consider multiple versions of the code, each of them resulting
    from applying different code transformations and compiler optimizations, and to
    include code to decide at runtime which one to be executed in each execution pass.
    More advanced mechanisms delegate the tuning of the code transformations and their
    application to the runtime system and are usually part of adaptive compilation
    and online autotuning systems (briefly described in Chapter 8).


    This chapter describes the most relevant code transformations. First, it covers
    basic code transformations and then it follows with more advanced code and loop
    transformations.'
  merge: -1
  img_proc: true
- pgno: 147
  md: '# 5.2 BASIC TRANSFORMATIONS


    Most basic code transformations are internally applied by compilers on a high-level
    intermediate representation (IR). Examples of these code transformations include
    constant propagation, strength reduction, constant folding, common subexpression
    elimination, dead-code elimination, scalar replacement, if-conversion, function
    inlining, and call specialization.


    We now consider a few examples of strength reduction. A trivial case of strength
    reduction is when integer multiplications and divisions by a power of two integer
    constants are substituted by left and right shifts, respectively. For example,
    being x an integer variable, 8 × x can be substituted by x << 3. More complex
    cases involve constants that are not power-of-two where the multiplication and
    division might be converted to expressions using shifts, additions, and subtractions.
    For instance, in the following expression, the constant 105 is transformed to
    15 × 7 = (16 − 1) × (8 − 1), and thus:


    ```

    B = 105 * A;

    ```


    can be substituted by:


    ```

    A1 = (A<<4) - A;

    B = (A1<<3) - A1

    ```


    The choice of whether to apply this transformation depends on the cost of performing
    two shifts and two subtractions instead of one multiplication on the target architecture.


    The following strength reduction example uses different approaches to substitute
    the expression 113*A. More specifically, (1) uses directly the binary representation
    of 113 = 1110001 (2^6 + 2^5 + 2^4 + 2^0), (2) considers subtractions and in this
    case 1110001 can be represented as 2^7 - 2^4 + 1, (3) with a factorization of
    the expression in (1) but using only additions, and finally (4) with a factorization
    of the expression in (1) but using additions and subtractions.


    ```

    int B = (A<<6)+(A<<5)+(A<<4)+A; (1)

    int C = (A<<7) - (A<<4)+A; (2)

    int D = (((((A<<1)+A)<<1)+A)<<1)+A; (3)

    int E = ((((A<<3)-A)<<4)+A; (4)

    ```


    Another example of strength reduction is the substitution of a modulo operation:


    ```

    A = n % d

    ```


    with the expression (its application is mainly dependent on the cost of calculating
    n/d):


    ```

    A = n - d*floor(n/d);

    ```


    While it is highly unlikely that a programmer would manually perform such transformations,
    compiler transformations such as loop coalescing can include a'
  merge: -1
  img_proc: true
- pgno: 148
  md: 'large number of such expressions at the intermediate level representation of
    the code, which can then be simplified in later phases of the compiler optimization
    passes.


    There are cases where one can substitute expressions by approximate ones. One
    example related to strength reduction is the use of (x>>1)+(x>>3) – (x>>6) – (x>>9)
    to substitute x*0.607259. This is a topic that we focus in more detail and in
    the context of function approximation.


    When considering floating-point numbers, there are also opportunities to apply
    strength reduction. For example, the multiplication of a floating-point value
    by 2 can be done by adding one to the exponent of the representation. The following
    code shows how this can be done in the C programming language. We note however
    that C is not a particularly good example to perform this transformation, as it
    requires many operations in order to capture the right bits of the exponent, adding
    one, and placing the new exponent in the right place. In general, any multiplication
    of a floating-point number by an integer power of two can be substituted by adding
    a constant to the exponent of the floating-point representation.


    ```

    // get the bit representation of the floating-point as an uint

    unsigned int p1 = * (unsigned int *) &a;

    // get the exponent

    unsigned char exp = (p1 & (0xFF<<23))>>23;

    // equivalent to multiply by 2

    exp = exp + 1;

    // add the new exponent to the representation of the floating-point value

    p1 = (p1 & (~(0xFF<<23))) | (exp<<23);

    // the resultant floating-point value: 2*a

    float ax2 = * (float *) &p1;

    ```


    Another example regarding floating-point values is when we need to negate a value,
    e.g., as in -1*a. This can be done by modifying the bit signal of the floating-point
    representation as it is shown in the following C code (for illustrative purposes
    as an implementation of this in a microprocessor is not profitable).


    ```

    unsigned int p2 = * (unsigned int *) &a;

    p2 ^= 1 << 31;

    float neg_a = * (float *) &p2;

    ```


    Strength reduction can be also applied in the context of loops as is illustrated
    in Fig. 5.1. In this case, the multiplication in Fig. 5.1A can be substituted
    by an addition (see Fig. 5.1B). Note that we can even go further if we change
    the loop control to reflect the index computations (see Fig. 5.1C).


    This form of strength reduction can be typically applied to induction variables
    (i.e., to variables whose values are functions of the loop iteration values),
    and in some cases can lead to the elimination of the induction variable (induction
    variable elimination) altogether as shown in the example code in Fig. 5.1C.'
