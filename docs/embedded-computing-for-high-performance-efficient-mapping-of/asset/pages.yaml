    There are other techniques which can be applied manually to enhance the applicability
    of the auto-vectorization of loops (see, e.g., Refs. [11–13]), including: (a)
    using loop indices in array accesses instead of pointers or pointer arithmetic,
    (b) minimizing indirect addressing in array accesses, (c) aligning data structures
    to 16 byte boundaries (SSE instructions) or 32 byte boundaries (AVX instructions),
    (d) favoring the use of structures of arrays (SoA) over arrays of structures (AoS).


    While the auto-vectorization process is performed at compile time, not all information
    may be available when compiling. For instance, the compiler might not know whether
    two pointers reference the same memory position inside a loop, thus creating a
    dependence and preventing vectorization. In this case, the compiler may generate
    a vectorized and a nonvectorized version, and invoke one of them at runtime depending
    on the addresses of the pointers (see Chapter 5).


    # MEMORY ALIGNMENT


    Memory alignment is important as it allows the concurrent execution of load/store
    operations from/to successive memory positions.


    Alignment support for dynamically allocated memory is provided by specific functions
    (see the following examples), such as aligned_alloc and _aligned_malloc for Linux
    and Windows, respectively.


    ```

    float *c = (TYPE *) aligned_alloc(16, sizeof(float) * N);

    float *c = (TYPE *) aligned_malloc(16, sizeof(float) * N);

    ```


    In case of a static memory allocation of array variables, it is common to provide
    support via attributes as depicted in the following example.


    ```

    float c[LEN] __attribute__((aligned(16)));

    ```


    Additional alignment information can be conveyed via the use of special built-in
    functions to instruct the compiler to assume aligned data as in the following
    example.


    ```

    TYPE_OF_ARG *c1 = __builtin_assume_aligned (arg, 16);

    ```


    *http://www.gnu.org/software/libc/manual/html_node/Aligned-Memory-Blocks.html.


