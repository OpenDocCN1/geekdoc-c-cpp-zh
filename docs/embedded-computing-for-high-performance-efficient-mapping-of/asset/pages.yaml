    # 6.2 RETARGETING MECHANISMS


    Developers have at their disposal different mechanisms to optimize and fine-tune
    their applications for a given computing platform. Given the complexity of today''s
    platforms and the lack of design tools to fully automate the optimization process,
    there is often a trade-off between how much effort an expert developer spends
    optimizing their application and how portable the optimized code becomes. In this
    context we can identify the following retargeting mechanisms:


    +   1. Compiler control options. This mechanism controls the code optimization
    process by configuring the processor''s toolchain options. For instance, some
    options select the target processor architecture (e.g., 32- or 64-bit), others
    select the use of a specific set of instructions (e.g., SSE, SSE2, AVX, AVX2),
    or to set the level of optimization (favoring, for instance, faster generated
    code over code size). Additional options enable language features and language
    standards (including libraries). In general, this mechanism requires the least
    amount of developer effort, but it is also the least effective in fully exploiting
    the capabilities of modern-day computing platforms given the inherent limitations
    of today''s compilers.


    +   2. Code transformations. Programmers often need to manually rewrite their
    code to adopt practices and code styles specific to the platform''s toolchain
    and runtime system. This is the case, for instance, with the use of hardware compilation
    tools for application-specific architectures on FPGAs. These tools typically impose
    restrictions on the use of certain programming language constructs and styles
    (e.g., arrays instead of pointers), as otherwise they can generate inefficient
    hardware designs. There are also transformations (see Chapter 5) one can apply'
  merge: -1
