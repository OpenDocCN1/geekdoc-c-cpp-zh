    # ## 2.8 SUMMARY


    This chapter described the main architectures currently used for high-performance
    embedded computing and for general purpose computing. The descriptions include
    multicore and many-core integrated circuits (ICs) and hardware accelerators (e.g.,
    GPUs and FPGAs). We presented aspects to take into account in terms of performance
    and discussed the impact of offloading computations to hardware accelerators and
    the use of the roofline model to reveal the potential for performance improvements
    of an application. Since power dissipation and energy consumption are of paramount
    importance in embedded systems, even when the primary goal is to provide high
    performance, we described the major contributing factors for power dissipation
    and energy consumption, and some techniques to reduce them.


