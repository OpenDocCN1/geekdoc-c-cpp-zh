    \ and/or properties. In Table 4.2, we depict examples of representative code properties.\
    \ The examples include data types, loop type, loop rank, use-def chains, AST,\
    \ CFG, and Call Graphs (static only).\n\nAs is readily observed, none of these\
    \ metrics are target dependent as they depend exclusively on the structure of\
    \ the source code and are aimed at program comprehension as opposed to application\
    \ performance tuning. One such metric that captures the inherent “complexity”\
    \ of the source code is the cyclomatic complexity. This specific metric relies\
    \ on the Control Flow Graph (CFG) of the source code where nodes represent basic\
    \ blocks (or instructions) and edges correspond to the flow of the execution between\
    \ basic blocks (or instructions). Given a CFG, the cyclomatic complexity metric\
    \ is computed as E – N + 2 × P, where E is number of edges of the CFG, N is the\
    \ number of nodes, and P is the number of modules in the program. This cyclomatic\
    \ complexity metric (see, e.g., [2]) is used to measure the complexity of a program\
    \ by taking into account the number of linearly independent paths of a program.\n\
    \n7 A basic block captures straight-line pieces of code where the execution flow\
    \ always starts with the first instruction and only leaves in the last instruction\
    \ (i.e., if the first instruction executes, then all subsequent instructions are\
