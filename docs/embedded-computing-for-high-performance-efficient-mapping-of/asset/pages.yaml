    # ## 2.5 PERFORMANCE


    In the embedded systems domain, an important challenge for developers is to meet
    nonfunctional requirements, such as execution time, memory capacity, and energy
    consumption. In this context, a developer must consider and then evaluate different
    solutions to optimize the performance of a system. As part of this evaluation,
    it is important for developers to identify the most suitable performance metrics
    to guide this process.


    The performance of an application is defined as the arithmetic inverse of the
    application''s execution time. Other common metrics involve the identification
    of the number of clock cycles used to execute a function, a specific code section,
    or'
