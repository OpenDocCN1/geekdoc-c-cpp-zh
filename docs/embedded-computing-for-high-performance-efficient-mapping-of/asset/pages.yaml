    model with supplied library routines. The MPI library is based on a well-established
    standard, making MPI programs portable across a wide range of parallel computing
    platforms with support for C/C++ and Fortran. This portability feature means that
    MPI code are designed to preserve functional behavior when they are recomplied
    to different parallel architecture platforms. However, to maximize performance
    on a given platform, MPI applications must be designed to be scalable and match
    workload requirements to available resources.


