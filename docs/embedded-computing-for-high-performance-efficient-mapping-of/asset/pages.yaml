  md: "# 5.6.18 LOOP PERFORATION\n\nSome loop transformations may not preserve the\
    \ original results, since they change the order of the floating-point operations.\
    \ This is however not intentional and is the result of the limited precision used\
    \ to represent real numbers. There are other cases where code transformations\
    \ lead to approximate computing as is the case of loop perforation [11]. This\
    \ loop transformation considers only part of the iteration space by skipping some\
    \ of the iterations. The following example shows (on the right) the result of\
    \ loop perforation applied to the code on the left. In this example, the loop\
    \ iterations skip k - 1 iterations of the original loop between every two consecutive\
    \ iterations of the new loop.\n\nLoop perforation can be used to improve performance,\
    \ reduce energy/power consumption, as long as the QoS (Quality-of-Service) or\
    \ the QoE (Quality-of-Experience) are acceptable.\n\n```\nfor(i=0; i<N; i++) {\n\
    \    sum += A[i];\n}\n\nfor(i=0; i<N; i+=k) {\n    sum += A[i];\n}\n```\n\n# 5.6.19\
    \ OTHER LOOP TRANSFORMATIONS\n\nIn addition to the loop transformations briefly\
    \ described in the previous subsections, there are other transformations that\
    \ enable the use of other transformations or perform an intermediate transformation.\n\
    \nOne example of such transformation is the conversion between loop types, e.g.,\
    \ transforming while do and do while into for type loops. A useful technique is\
    \ loop inversion which consists in replacing a while loop by a repeat-until (do\
    \ while) loop. The following example illustrates this conversion. Note that the\
    \ if-statement may not be needed when the original loop always executes at least\
    \ one iteration.\n\n```\nwhile (e) {\n    S;\n}\n\nif(e) {\n    do {\n       \
    \ S;\n    } while (e);\n}\n```\n\nLoop normalization is a common transformation\
    \ performed to make data dependence testing easier. It modifies the loop bounds\
    \ so that the lower bound of all do loops is one (or zero) and the increment is\
    \ one. This simplifies data dependence tests because two out of three loop bound\
    \ expressions will be a simple known constant.\n\nLoop reversal consists of changing\
    \ the order in which the iteration space is traversed. Loop reversal is illegal\
    \ when the loop has loop-carried data dependences.\n\nHoisting of loop invariant\
    \ (also known as loop invariant code motion) computations consists of moving computations\
    \ that do not change with the iterations of the loop and thus can be moved to\
    \ before the loop.\n\nNode splitting consists of copying data to remove data dependence\
    \ cycles."
