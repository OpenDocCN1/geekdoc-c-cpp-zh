    # 2.4.2 RECONFIGURABLE HARDWARE ACCELERATORS


    Given the ever-present trade-off between customization (and hence performance
    and energy efficiency) and generality (and thus programmability), reconfigurable
    hardware has been gaining considerable attention as a viable platform for hardware
    acceleration. Reconfigurable devices can be tailored (even dynamically—at runtime)
    to fit the needs of specific computations, morphing into a hardware organization
    that can be as efficient as a custom architecture. Due to their growing internal
    capacity (in terms of available hardware resources), reconfigurable devices (most
    notably FPGAs) have been extensively used as hardware accelerators in embedded
    systems.'
