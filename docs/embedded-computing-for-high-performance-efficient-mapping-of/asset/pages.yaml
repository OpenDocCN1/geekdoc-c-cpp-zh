- pgno: 193
  md: '# Code retargeting for CPU-based platforms


    # 6.1 INTRODUCTION


    In this chapter, we focus exclusively on code retargeting issues in the context
    of CPU-based architectures and where the application source code is optimized
    to execute more efficiently on a given platform. In Chapter 7, we extend the topic
    of code retargeting to cover heterogeneous platforms, such as GPUs and FPGAs.


    Here, we assume as input the application’s source code, written in a high-level
    language such as C/C++, possibly even translated from higher levels of abstraction
    as described in Chapter 3. This source code captures the algorithmic behavior
    of the application while being independent of the target platform. As a first
    step, this code version is compiled and executed on a CPU platform, allowing developers
    to test the correctness of the application with respect to its specification.


    However, as computer architectures are becoming increasingly complex, with more
    processing cores, more heterogeneous and more distributed, applications compiled
    for existing machines will not fully utilize the target platform resources, even
    when binary compatibility is guaranteed, and thus do not run as efficiently as
    they could. In particular, modern-day computing platforms (see Chapter 2 for a
    brief overview) support many independent computational units to allow parallel
    computations, contain specialized architectural features to improve concurrency
    and computational efficiency, support hierarchical memories to increase data locality
    and reduce memory latency, and include fast interconnects and buses to reduce
    data movement overhead. Hence, to maximize performance and efficiency it is imperative
    to leverage all the underlying features of a computing platform.


    While imperative languages, such as C and C++, allow developers to write portable
    applications using high-level abstractions, the complexity of modern computing
    platforms makes it hard for compilers to derive optimized¹ and efficient code
    for each platform architecture. Retargetable compilers do exist, but they typically
    limit themselves to generate code for different CPU instruction set architectures.
    This limitation forces developers to manually optimize and refine their applications
    to support the target computation platform. This process requires considerable
    expertise to port the application, including applying code optimization strategies
    based on


    ¹ In this chapter, as with most of the literature, we use the term “optimization”
    loosely as a synonym for “performance improvement” as in general (and including
    trivial computations) program optimization is an undecidable problem at compile
    time (or design time).'
  merge: -1
  img_proc: true
