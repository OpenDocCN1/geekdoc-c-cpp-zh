    # 2.4.1 GPU ACCELERATORS


    Originally used exclusively for the acceleration of graphical computation (e.g.,
    shading), graphics processing units (GPUs) have evolved in terms of flexibility
    and programmability to support many other compute-intensive application domains,
    such as scientific and engineering applications. Internally, GPUs consist of many
    lightweight cores (sometimes referred as shader cores) and on-chip memories which
    provide native support for high degrees of parallelism. Hence, the single program,
    multiple data (SPMD) paradigm is often used to program GPUs.


    For embedded devices, GPUs have a relatively simple organization as illustrated
    by the example in Fig. 2.13, whereas for high-end computing a typical internal
    organization is depicted in Fig. 2.14. Naturally, the GPU used for embedded applications
    illustrated in Fig. 2.14 has a relatively “flat” hierarchical organization with
    multiple GPU cores sharing their access to an internal memory or L2 cache. Conversely,
    high-end GPUs have a much more complex internal architecture where cores are organized
    hierarchically in clusters, each of which have local nonshared and shared resources,
    such as for example, constant caches and L1 caches as illustrated in Fig. 2.14.
    Regarding their intended target applications, the diversity of the embedded domains
    has led to a greater diversity of embedded GPU configurations with varying characteristics
    (e.g., size of caches, number of shader cores, number of ALUs per shader core).
    On the other hand, high-end GPUs exhibit less architectural diversity as they
    are mostly designed to serve as hardware accelerators, providing architectures
    with many cores and vast on-chip memory resources.


