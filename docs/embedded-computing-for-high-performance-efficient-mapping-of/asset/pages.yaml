- pgno: 285
  md: 'combining multiple algorithms and using the best approach for each particular
    execution environment and dataset. The PetaBricks language consists of rules defining
    code transformations that its compiler translates to C++ code. Recent work on
    PetaBricks also considers a two-level input learning algorithm for algorithm autotuning
    [18].


    Much of the research on autotuning, both offline and online, has focused on the
    selection of compiler optimizations and/or on compiler optimization parameters
    regarding a specific goal. A representative example is the Automated De-Coupled
    Adaptive Program Transformation (ADAPT) framework [19–21]. ADAPT consists of the
    ADAPT language (AL), a DSL for programming runtime iterative compilation processes
    (including the monitoring points); the ADAPT compiler; and an infrastructure to
    collect measurements, to execute a policy, and to invoke a remote compiler. The
    ADAPT approach follows a separation of concerns where the adaptivity is expressed
    in a specific file (consisting of global variables, one or more “technique” sections
    and one coordination section), thus not requiring modifications to the original
    source application. ADAPT overlaps optimization with execution. AL is a C-like
    language specially dedicated to program optimization policies in the context of
    runtime exploration of compiler optimizations. Optimization policies are expressed
    as AL “technique” sections which include optimization phase subsections. A coordination
    section defines how AL techniques are combined (AL includes linear search, parallel
    search, and exhaustive search). The language provides mechanisms to constrain
    the intervals (code regions) where a given ADAPT technique is to be applied (e.g.,
    innermost loops, perfect nested loops, loops where the number of iterations is
    known at their entry). AL also provides statements to define the interface to
    the tool to be used to apply the optimization and/or compiler parameters. Examples
    of interfaces include if the code variant is to be generated by a specific compiler
    flag. Collect statements define what to measure for each specific interval (e.g.,
    timing). AL policies can use machine information (e.g., clock frequency, cache
    sizes), iteration counts for innermost and outermost loops, and other information
    regarding runtime input data through the use of macros. In addition to the phase
    sections, an AL technique can include default and safe sections. The ADAPT compiler
    is responsible to process both the application source code and the AL code, and
    to generate the complete runtime system.


    Autotuning can be considered a special case of DSE as it requires searching for
    the “best” code variants. It can thus leverage the vast number of approaches already
    proposed for DSE. For instance, iterative compilation, a specific case of autotuning,
    has also been addressed by iterative algorithms such as batch elimination, iterative
    elimination, and combined elimination [22]. Finally, other autotuning approaches
    have also considered approximate computing (see, e.g., [18,23]), providing additional
    optimization criteria for applications not requiring exact computations. Applications
    benefiting from this approach include those with requirements that can be defined
    in terms of QoS (Quality-of-Service) or QoE (Quality-of-Experience), and which
    exhibit outputs that need neither be deterministic nor exact.'
