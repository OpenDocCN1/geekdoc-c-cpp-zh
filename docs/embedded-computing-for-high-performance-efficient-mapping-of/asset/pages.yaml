    # 5.6.6 LOOP PEELING


    Loop peeling consists on separating (or peeling off ) iterations from the beginning
    and/or the end of the loop (see a simple example below). Loop peeling is always
    legal and can be used as the basis for better code generation in the context of
    scalar replacement and software pipelining. It is sometimes required to generate
    vector code with aligned vector loads/stores and to peel off some loop iterations
    to prologue and/or epilogue in loop unrolling and/or software pipelining.'
