    device (e.g., either a GPU or an FPGA). While this partitioning is often viewed
    exclusively as a computation partition, it often involves data partitioning as
    well since data offloaded to the accelerator can be kept private to that computing
    device.


    # 5.11.3 COMPUTATION OFFLOADING


    To accelerate applications, one possibility is to migrate the most computationally
    intensive parts (e.g., also known as hotspots or critical regions) to more powerful
    computing devices, such as hardware accelerators (e.g., GPUs, FPGAs), servers,
    supercomputing resources, or cloud computing infrastructures. This migration of
    computations is known as computation offloading and has become of particular relevance
    in the context of mobile computing [27] where devices may not provide the hardware
    acceleration capabilities for increasing the performance of the critical regions
    of computations.


    In terms of code generation, the compiler needs to replace the code that is to
    be offloaded from the main thread of execution (e.g., on a CPU) to the accelerator
    with a sequence of operations that transfer data to the accelerator, initiate
    the execution of the accelerator (possibly invoking a previously compiled binary
    image for that accelerator), synchronize the termination of the execution, and
    transfer the results of the execution back to the main thread. Although simplified
    here, these steps make use of variants of library functions such as memory allocation
    and synchronization. As the overhead of data transfer is often nonnegligible,
    it is desirable to minimize the volume of data transferred per invocation of the
    offloaded computation by prompting the use of accelerator private data or data
    that can be reused and accessed in multiple accelerator invocations.


    The offloading of computations requires the availability of implementations in
    the target architecture where the code regions will be offloaded and the transformation
    of the host code of the application to offload the computations. The offloading
    of computations needs to identify a specific implementation and target device
    and/or request a service, to communicate input/output data between the host computing
    system and the target computing device, and the synchronization between both.


    Computation offloading can be statically defined or decided at runtime. In the
    former case, the host code is prepared to deal with the execution of the critical
    region in the target computing system and the offloading does not depend on the
    runtime'
