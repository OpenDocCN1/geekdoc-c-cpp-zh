  md: '# 4.5.3 DYNAMIC CALL GRAPHS


    Call graphs provide a window into program behavior by representing the relationship
    between different program modules (functions, subroutines). In particular, each
    node in the call graph represents a module, and an edge represents one or more
    calls to a module. The call graph can be built at compile time (statically) by
    identifying the statements with function calls. It represents the structure of
    all the invocations that can happen during program executions. In the case of
    a dynamic call graph, we are able to trace all modules invoked for a particular
    execution. In particular, which modules were invoked and which module triggered
    them. Dynamic call graphs can be annotated with additional information such as
    its execution time or other metrics. In this section, we focus on the generation
    of a dynamic call graph by instrumenting the code. The instrumentation strategy
    is as follows:


    +   1. Profiling API header. Include the profiling API header in the beginning
    of each source file to access call graph monitoring functions.


    +   2. Call statements. Insert a monitoring API call (cgraph_task) before each
    function call. In this example, we ignore all system calls.


    +   3. Generate call graph. Before the application terminates, we generate the
    call graph with cgraph_report.


    Let us consider the code in Fig. 4.20 based on the SHA benchmark [18,19]. It shows
    the instrumented code highlighted in bold based on the earlier strategy. We can
    automate this process using the LARA aspect presented in Fig. 4.21 as follows:


    +   1. Lines 3-8: Select the first statement of every source file, and insert
    the header file of the profiling API.


    +   2. Lines 10-18: Insert the cgraph_task API call before each call. The cgraph_task
    API call receives two arguments: the name of the function that triggers the call
    and the function called. We add a condition that we only track the call if it
    is not a system call.


    +   3. Lines 20-25: Select all exit points of the main function, and insert a
    call to cgraph_report() to generate the call graph.


