  md: '![](img/55beb9162c0073b3a3d7b44f1d5873e8_247_0.png)


    When the host sends workload to a device, it creates a kernel execution instance
    as illustrated in Fig. 7.7, where the kernel (along with its global and local
    dimensions) is deployed to the device. The global dimensions define the total
    number of work-items (threads) the device must compute. These work-items are combined
    into work-groups according to the local dimensions specified by the developer.
    Each work-group is executed by a compute unit, and each work-item is processed
    by one or more processing elements. The architecture of an OpenCL processing element
    depends on the type of device and its vendor, but it typically supports SIMD instructions.
    While the global dimensions are defined by the problem size, the choice of local
    dimensions can considerably affect overall performance since the number of work-items
    deployed to each compute unit has to be large enough to hide memory latency. The
    work-group size must also leverage available parallelism taking into account the
    number of processing elements within each compute unit and the number of compute
    units available in the device. For this reason, developers often perform design
    space exploration, experimenting different local dimensions to find the most performant
    configuration for a particular OpenCL device.


    The OpenCL memory model is illustrated in Fig. 7.8. The OpenCL runtime assumes
    the existence of a host where an application is originally deployed and executed,
    and a set of OpenCL devices that handle offloaded computations from the host.
    The host has a main memory where the application data resides. On the other hand,
    each OpenCL device has four types of memory: (1) global memory which is the primary
    conduit for data transfers from the host memory to the device and can be accessed
    by all work-items, (2) constant memory where content can be accessed by all work-items
    as read-only, (3) local memory which is only accessed by work-items within a work-group,
    and (4) private memory which is specific to a work-item and cannot be accessed
    by any other work-item.'
  merge: -1
  img_proc: true
- pgno: 248
  md: '![](img/55beb9162c0073b3a3d7b44f1d5873e8_248_0.png)


    # Fig. 7.8 OpenCL memory model.


    There is no automatic data movement in OpenCL. Developers are responsible for
    explicitly allocating global data, transferring data from the host memory to the
    global memory of the device, allocating local data and copying data from global
    to local memories and back, and finally transferring the results back to the host.
    When performing data movements, it is important to take into account both the
    size of memories and bandwidth. For instance, when the OpenCL device is connected
    to the host via the PCIe bus, transferring data from the host memory through the
    global memory can support bandwidths between 5 and 10 GB/s. Work-items can access
    the global memory with a bandwidth of 50–200 GB/s and the local memory at 1000
    GB/s. Hence, caching data on faster memories can result in overall performance
    speedup. Modern GPUs support the option of automatically cache data to local memories,
    instead of manually managing it.


    OpenCL implements a relaxed consistency memory model. This means work-items may
    have a different view of memory contents during the execution. Within a work-item,
    all reads and write operations are consistently ordered, but between work-items
    it is necessary to synchronize to ensure consistency. OpenCL offers two types
    of built-in functions to order memory operations and synchronize execution: (a)
    memory fences wait until all reads/writes to local/global memory made by the work-item
    prior to the memory fence are visible to all threads in the work-group; (b) barriers
    wait until all work-items in the work-group have reached the barrier, and issues
    a memory fence to the local/global memory. Note that synchronization support is
    limited to work-items within the same work-group. If synchronization between work-groups
    is required, should they share data in global memory, one solution is to execute
    the kernel multiple times so that memory is synchronized each time the kernel
    exits.'
