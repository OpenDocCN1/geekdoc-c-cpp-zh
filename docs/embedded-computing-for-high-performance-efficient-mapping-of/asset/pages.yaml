    used in intermediate values. For instance, the floating-point expression d=a*b+c;
    implies in the case of an FMA instruction that the multiplication a*b is performed
    with higher precision, and the result of the addition is rounded to produce the
    desired floating-point precision (i.e., the precision associated to the floating-point
    type of d). This computation is performed differently when using non-FMA instructions,
    which would first compute t=a*b with the same floating-point type for t, a, and
    b, and then compute d=t+c. In this case, the use of an FMA instruction may produce
    results with a higher accuracy than the corresponding non-FMA instructions.


    # 2.3.3 MULTITHREADING SUPPORT


    Modern microprocessors support simultaneous multithreading (SMT) by providing
    multiple cores and by duplicating hardware in a single core to allow native support
    of parallel thread execution. The execution of multiple threads within the same
    core is realized by time multiplexing its hardware resources and by fast context
    switching. The Intel Hyper-Threading² is an example of such technology, which
    efficiently supports the balanced execution of two threads on the same core. Processors
    without multithreading, on the other hand, execute threads sequentially without
    interleaving their execution. Chapter 6 (Section 6.5) explains how to exploit
    multithreading using OpenMP.


