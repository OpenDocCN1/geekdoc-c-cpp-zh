    # 4.5 CUSTOM PROFILING EXAMPLES


    This section presents a number of custom profiling examples for code analysis
    commonly used in the context of embedded platforms. All the examples require the
    instrumentation of the applications in order to derive specific dynamic metrics.
    Although the instrumentation of the applications can be done manually, we emphasize
    here the use of the LARA language [14,15] to specify strategies for code instrumentation
    and the use of source-to-source compilers that produce the code modifications
    based on those strategies.


