    \ and the vertical size of the images (variables sizeX and sizeY in the code),\
    \ respectively.\n\n# 5.6 LOOP-BASED TRANSFORMATIONS\n\nApplications tend to spend\
    \ a significant amount of their execution time in a few critical sections dominated\
    \ by loops and/or nested loops. Therefore, loops are usually the hotspots in an\
    \ application, i.e., important code regions that have the highest impact in performance/energy/power.\
    \ The list of loop transformations a compiler (or a programmer) can apply is very\
    \ extensive and most compilers (even commercial ones) only support a few (e.g.,\
    \ loop unrolling and loop tiling).\n\nThe following subsections present loop transformations\
    \ that are mostly used in practice. At the end of this section we present an overview\
    \ of these techniques, including their feasibility and suitability.\n\n# 5.6.1\
    \ LOOP ALIGNMENT\n\nThe loop alignment transformation aims at promoting the reuse\
    \ of array references in each iteration of the loop. Consider the following example.\
    \ The code on the left has two references to array b and two references to array\
    \ a. However, both arrays have misaligned accesses in each iteration of the loop,\
    \ since we have two distinct accesses for each array. The code on the right, however,\
    \ has both arrays aligned. Here we have “peeled” one of the loop assignments and\
    \ placed them before the loop, and “shifted” the occurrences of the statements\
    \ of the loop by “one”. Now, in each iteration of the loop the references to either\
    \ array b or array a are identical. Also, note that we need to take care of the\
    \ last loop iteration, which needs to be partially backpeeled.\n\n```\nfor(i=1;\
    \ i<=N; i++) {\n    b[i]=a[i];\n    d[i]=b[i-1];\n    c[i]=a[i+1];\n}\n\nd[1]=b[0];\n\
    for(i=2; i<=N; i++) {\n    b[i]=b[i-1];\n    b[i]=a[i-1];\n    c[i]=a[i-1];\n\
    }\nb[N]=a[N];\nc[N]=a[N+1];\n```"
