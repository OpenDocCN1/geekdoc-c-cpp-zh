    # 3.5 LARA: A LANGUAGE FOR SPECIFYING STRATEGIES


    LARA [21, 38] is an AOP language [22, 39] specially designed to allow developers
    to describe: (1) sophisticated code instrumentation schemes (e.g., for customized
    profiling); (2) advanced selection of critical code sections for hardware acceleration;
    (3) mapping strategies including conditional decisions based on hardware/software
    resources; (4) sophisticated strategies determining sequences of compiler optimizations,
    and (5) strategies targeting multicore architectures. Furthermore, LARA also'
