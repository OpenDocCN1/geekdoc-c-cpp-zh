    # 5.6.12 LOOP UNROLLING


    Loop unrolling is a well-known loop transformation. When unrolling a loop by a
    factor of K, the loop body is repeated K number of times and the loop iteration
    space is reduced (or eliminated when the loop is fully unrolled). Loop unrolling
    enables other optimizations and/or increases the parallelism degree in the loop
    body given the increase of its operations. As the number of iterations of a loop
    is not always known, there is a need to include a “clean-up” code as part of the
    prologue and/or epilogue of the loop when unrolled. However, when the number of
    iterations of the loop is known at compile time and it is a multiple of the unrolling
    factor no prologue or epilogue code is needed.


    In the following example, the loop on the left is fully unrolled, which results
    in the code in the right.


    ```

    for(i=0; i<4;i++) {

    c[i] = a[i] + b[i];

    }


    c[0] = a[0] + b[0];

    c[1] = a[1] + b[1];

    c[2] = a[2] + b[2];

    c[3] = a[3] + b[3];

    ```


    The following example shows the loop unrolled by a factor of 2. In this case,
    the loop is not eliminated.


    ```

    for(i=0; i<4;i+=2) {

    c[i] = a[i] + b[i];

    c[i+1] = a[i+1] + b[i+1];

    }

    ```


    When the number of iterations is not known at compile time and the intention is
    to unroll a loop by a factor, there is the need to include code to test if the
    number of iterations is greater or equal than the unrolling factor, and to include
    an epilogue (example on the left) or a prologue (example on the right).


    ```

    if(N > 2) {

    for(i=0; i<N-2;i+=2) { // K>=2

    c[i] = a[i] + b[i];

    c[i+1] = a[i+1] + b[i+1];

    }

    } else i=0;

