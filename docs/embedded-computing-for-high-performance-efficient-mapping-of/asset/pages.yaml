    # 2.5.2 THE ROOFLINE MODEL


    The roofline model [24,25] is an increasingly popular method for capturing the
    compute-memory ratio of a computation and hence quickly identify if the computation
    is compute or memory bound. The roofline model is often represented as a two-dimensional
    plot with Performance (Flops/Cycle or Flops/s) in the Y-axis and operational (also
    known as arithmetic or numeric) intensity (Flops/Byte) in the X-axis, as depicted
    in Fig. 2.21.


    This plot delimits various performance regions based on the architectural features
    of the computing system at hand where computational kernels can be placed depending
    on the features used and compiler transformations exercised. Clearly, the region
    labeled © is infeasible as it implies bandwidth values beyond what the computing
    system can provide. The line labeled “peak stream bandwidth” thus identifies the
    bandwidth upper-bound for any given code design. The plot also contains other
    “upper-bound” lines corresponding to the use of architectural features or elements.
    For instance, the line labeled “without software prefetching” indicates that codes
    not taking advantage of prefetching cannot move beyond this performance bound
    line. Similarly, other horizontal lines bound the performance of a code design
    if these do not use SIMD instructions or simply do not take advantage of instruction-level
    parallelism (ILP). Ideally, developers would want to have their code reach as
    high as possible, and break some of these ceilings, by using compiler transformations
    and code restructuring to exhibit the highest possible performance rate.


    In short, the goal of the roofline model is to set expectations for performance
    for specific architectures and specific code to guide the developers to tune their
    code and take advantage of the target computing systems. This model can also be
    used to expose performance bottlenecks and to guide code transformations. For
    codes that'
