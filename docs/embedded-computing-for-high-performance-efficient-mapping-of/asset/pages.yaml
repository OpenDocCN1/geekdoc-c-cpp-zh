  md: "# # CACHE-OBLIVIOUS ALGORITHMS\n\nCache-oblivious algorithms are designed to\
    \ make effective use of CPU cache systems. However, unlike explicit blocking algorithms\
    \ and other cache-aware algorithms, these algorithms do not depend on explicit\
    \ hardware parameters, such as cache size or cache-line length. Such algorithms\
    \ can thus perform well without modification on machines with different cache\
    \ sizes and levels.\n\nA cache-oblivious algorithm often employs a recursive divide-and-conquer\
    \ approach, where a problem is divided into increasingly smaller subproblems until\
    \ reaching a base case. The key idea behind these algorithms is that eventually\
    \ one reaches a subproblem size that fits into the available cache. This approach\
    \ works regardless of the cache size and the number of levels it supports.\n\n\
    Kumar P. \"Cache-Oblivious Algorithms.\" Algorithms for Memory Hierarchies, Lecture\
    \ Notes on Computer Science (LNCS 2625). Springer Verlag, 2003, p. 193-212.\n\n\
    In the example described in Section 6.1, the matrix multiplication algorithm accesses\
    \ all columns of matrix B to compute each row of matrix C. This leads to nonoptimal\
    \ use of the cache if the number of columns of B is considerably larger than the\
