    # FMA UNITS


    The FMA units recently included in Intel microprocessors are able to perform fused
    operations such as multiply-add, multiply-subtract, multiply add/subtract, signed-reversed
    multiply on multiply-add and on multiply-subtract. These recent FMA extensions
    [18] include 36 256-bit floating-point instructions to compute on 256-bit vectors,
    and additional 128-bit and scalar FMA instructions.


    There are two types of FMA instructions: FMA3 and FMA4. An FMA3 instruction supports
    three input operands (i.e., three registers), and its result must be stored in
    one of the input registers. An FMA4 instruction, on the other hand, supports three
    input operands with the result stored in a dedicated output register. For instance,
    the Intel FMA instruction VFMADD213PS (FMA3) computes 80~31 = 80*31 + 50*52 while
    the instruction VFMADDP5 (FMA4) is able to compute 50*31 = 32 * 433. Most recent
    processors implement FMA instructions using the FMA3 type.'
