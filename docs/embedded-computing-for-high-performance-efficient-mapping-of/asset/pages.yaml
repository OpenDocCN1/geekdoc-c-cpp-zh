  md: '![](img/55beb9162c0073b3a3d7b44f1d5873e8_28_0.png)


    FIG. 2.1 Indicative computer architecture trends in terms of performance enhancements.
    Based on Lecture materials for “CSE 6230—High Performance Computing: Tools and
