    of threads. The operating system will then schedule these threads to the available
    processing cores. There are two considerations to take into account in our optimization
    strategy. First, we need to decide which loops should be optimized; and second,
    how many threads should we allocate to each loop selected for optimization. Both
    considerations are meant to ensure that computations can benefit from parallelization,
    which can be adversely affected if there is not enough computational workload.
