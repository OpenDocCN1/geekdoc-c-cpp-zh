  md: "![](img/55beb9162c0073b3a3d7b44f1d5873e8_163_0.png)\n\nFIG. 5.8 Software pipelining\
    \ stages: prologue, kernel, and epilogue.\n\nAn important parameter used in software\
    \ pipelining is the Initiation Interval (II) [9], which identifies the number\
    \ of cycles between the start of successive iterations. The ultimate goal of software\
    \ pipelining is to maximize performance is to achieve an II of one clock cycle,\
    \ which means that the kernel is executed at one iteration per cycle. However,\
    \ this may impose too many hardware resources that are not available or impose\
    \ significant overhead from register pressure. The minimum possible II depends\
    \ on the hardware resources that are simultaneously available, of their latency\
    \ and pipelining stages, and of the latencies imposed by cycles in the data dependence\
    \ graph (DDG).\n\n```\nfor(i=0; i<10; i++) {\n    a[i] = A[i] * B[i];\n}\n```\n\
    \n```\na_tmp = A[0];\nb_tmp = B[0];\nfor(i=0; i<10; i++) {\n    C[i] = a_tmp *\
    \ b_tmp;\n    a_tmp = A[i+1];\n    b_tmp = B[i+1];\n}\nC[9] = a_tmp * b_tmp;\n\
    ```\n\n```\nfor(i=0; i<10; i++) {\n    C[i-1] = a_tmp * b_tmp; if i!=0\n    a_tmp\
    \ = A[i]; if i!=10;\n    b_tmp = B[i]; if i!=10;\n}\n```\n\n# 5.6.17 EVALUATOR-EXECUTOR\
    \ TRANSFORMATION\n\nThe evaluator-executor loop transformation was proposed in\
    \ Ref. [10] and allows the pipelined execution of loops with conditional constructs\
    \ whose values cannot be ascertained at compile time. The technique splits the\
    \ loop into an evaluator loop and an executor loop (see the following example).\
    \ The main idea is to reduce computations inside a loop with conditions, which\
    \ avoids predicated execution when applying loop pipelining.\n\n```\nfor(i=0;\
    \ i<N; i++) {\n    ai = A[i];\n    if (ai > 0) {\n        B[i] = sqrt(ai);\n \
    \   }\n}\n```\n\n```\nint ExecC = 0;\nfor(i=0; i<N; i++) { // evaluator loop\n\
    \    ai = A[i];\n    if(ai > 0) {\n        ExecC++;\n        ExecC[ExecC] = i;\n\
    \    }\n}\nfor(j=0; j<ExecC; j++) { // executor loop\n    i = ExecC[j];\n    ai\
    \ = A[i];\n    B[i] = sqrt(ai);\n}\n```"
