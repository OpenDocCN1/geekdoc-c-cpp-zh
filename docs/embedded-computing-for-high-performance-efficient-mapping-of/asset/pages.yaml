- pgno: 198
  md: '# 6.3 PARALLELISM AND COMPILER OPTIONS


    While there have been considerable advances in compiler technology targeting CPU
    platforms, many of the optimizations performed automatically are limited to single-threaded
    execution, thus missing out vast amounts of computational capacity one can attain
    from multicore and distributed computing. As such, developers must manually exploit
    the architectural features of CPUs to attain the maximum possible performance
    to satisfy stringent application requirements, such as handling very large workloads.


    # 6.3.1 PARALLEL EXECUTION OPPORTUNITIES


    Fig. 6.2 illustrates the different parallelization opportunities for commodity
    CPU platforms. At the bottom of this figure, we have SIMD processing units available
    in each CPU core which simultaneously execute the same operation on multiple data
    elements, thus exploiting data-level parallelism. To enable this level of parallelism,
    compilers automatically convert scalar instructions into vector instructions in
    a process called auto-vectorization (Section 6.4). Data-level parallelism can
    also be enabled in the context of multicore architectures where multiple instances
    of a region of computations, each one processing a distinct set of data elements,
    can be executed in parallel using thread-level approaches such as OpenMP (Section
    6.5). Next, we have task-level parallelism, which requires developers to explicitly
    define multiple concurrent regions of their application also using approaches
    such as OpenMP.


    ![](img/55beb9162c0073b3a3d7b44f1d5873e8_198_0.png)


    FIG. 6.2 Different levels of parallelism in CPU-based platforms: multiprocessor,
    multicore and SIMD processor units.'
  merge: -1
  img_proc: true
- pgno: 199
  md: 'These concurrent regions of an application, implemented in OpenMP as *threads*,
    share the same address space and are scheduled by the operating system to the
    available CPU cores. Large workloads can be further partitioned to a multiprocessor
    platform with distributed memory, where each processor has its own private memory
    and address space, and communicate with each other using message-passing, such
    as MPI (Section 6.6). Finally, data movement is an important consideration to
    ensure data arrives at high enough rates to sustain a high computational throughput.
    For CPU platforms, one important source of optimization at this level is to leverage
    their hierarchical cache memory system (Section 6.7).


    # OTHER USEFUL GCC OPTIONS


    The GCC compiler supports many compilation options controlled by specific flags
    at the command line. The “-E” option outputs the code after the preprocessing
    stage (i.e., after applying and expanding macros, such as #define, #include, preprocessor
    directives). The “-S” option outputs, as “.s” files, the generated assembly code.
    The “-c” assemble flag outputs the assembly code with additional machine code.


    When dealing with optimizations of math operations (and without being conservative
    as to preserve original precision/accuracy), one can exercise the flag “-funsafe-math-optimizations”
    (or “-Ofast”). When available, one can take advantage of FMA (fused multiply-add)
    instructions using the flag “-fip-contract=fast” (or “-Ofast”).


    When targeting native CPU optimizations one can use “-march-native,” or to explicitly
    define a particular target such as “-march=corei7-avx” or a specific unit such
    as one of the SIMD units: “-mmmx,” “-m3dnow,” “-msse,” “-msse2,” “-msse3,” “-mssse3,”
    “-msse4,” “-msse4.2,” “-mavx,” “-mavx2,” “-mavx512f,” etc.


    In terms of rendering developers can use flags such as “-fopenmp-info” which information
    about applied optimizations.


    In terms of specific loop and code optimizations, there are several flags to enable
    them. For example, “-floop-interchange” applies loop interchange, “-fivopts” performs
    induction variable optimizations (strength reduction, induction variable merging,
    and induction variable elimination) on trees.


    *https://gcc.gnu.org/onlinedocs/gcc/Optimize-Options.html.


    # 6.3.2 COMPILER OPTIONS


    The most popular CPU compilers and tools supporting high-level descriptions (e.g.,
    in C, C++) include GCC, LLVM, and ICC (Intel C/C++ compiler). These compilers
    support command-line options to control and guide the code generation process,
    for instance, by selecting a predefined sequence of compiler optimizations aimed
    at maximizing the performance of the application or alternatively reducing its
    size. As an example, the widely popular GNU GCC compiler includes 44 optimizations
    enabled using the flag -O1, an additional 43 if -O2 is used, and an additional
    12 if -O3 is used (see Ref. [4]). Moreover, the programmer may explicitly invoke
    other transformations at the command-line compiler invocation. Examples of compilation
    options include:


    +   • Compiling for reduced program size (e.g., gcc -Os). Here the compiler tries
    to generate code with the fewest number of instructions as possible and without
    considering performance improvements. This might be important when targeting computing
    systems with strict storage requirements;'
  merge: -1
  img_proc: true
- pgno: 200
  md: '+   • Compiling with a minimal set of optimizations, i.e., using only simple
    compiler passes (e.g. gcc -O0), which can assist debugging;

    +   • Compiling with optimizations that do not substantially affect the code size
    but in general improve performance (e.g. gcc -O1);

    +   • Compiling with a selected few optimizations, such that do not lead to numerical
    accuracy issues (e.g. gcc -O2);

    +   • Compiling with more aggressive optimizations, e.g., considering loop unrolling,
    function inlining, and loop vectorization (e.g. gcc -O3);

    +   • Compiling with more advanced optimizations, possibly with a significant
    impact on accuracy for certain codes where the sequence of arithmetic instructions
    may be reordered (e.g. gcc -Ofast);


    # COMPILER OPTIONS FOR LOOP TRANSFORMATIONS


    The GCC compiler includes a number of loop transformations such as “-floop-interchange,”
    “-floop-strip-mine,” “-floop-block,” “-floop-distribution,” and “-floop-unroll-and-jam”
    (supported via the Graphite framework).


    For some of the compiler flags, it is possible to define the value of parameters
    that may control internal loop transformation heuristics. For example, the parameter
    “max-unroll-times-n” (that can be used when invoking gcc following the “--param”
    option) asserts the maximum number (n) of unrolling operations on a single loop.
    To force loop unrolling, one can use the flag “-funroll-loops” and parameters
    such as “-max-unroll-times,” “-max-unrolled-insns,” and “max-average-unrolled-insns”
    to control this process.


    *https://gcc.gnu.org/onlinedocs/gcc/Optimize-Options.html. **https://gcc.gnu.org/wiki/Graphite.


    # GCC REPORTING


    It is important that compilers report information about the effectiveness of their
    transformations so that developers can decide which transformations to use and
    to tune each of them via the parameters they support.


    To this effect, GCC supports reporting flags. To output the intermediate representation
    (IR) for each function after applying loop vectorization one can use the flag
    “-fdump-tree-vect-blocks=foo.dump”.


    The “-dump” flag has other useful options such as “-fdump-tree-pre” and “-fdump-tree-pre-blocks,”
    whereas the “-fopt-info” flag with its various options such as “-fopt-info-vec-all”
    which reports detailed information after applying vectorization optimizations.
    With respect to loop vectorization information, one can use the flag “-fvectorizer-verbose=n”
    where n (ranging from 1 to 7) represents the level of information to be reported
    (a higher value of n means that more details are reported).


    **https://gcc.gnu.org/onlinecdgcc/Developer-Options.html.


    Overall, these compilation options offer developers a simple mechanism to find
    suitable trade-offs between code size and performance. However, such mechanisms
    are not extended to support compiler options aiming at minimizing power and/or
    energy consumption. Still, optimizations aimed at reducing the total amount of
    work tend to minimize both energy consumption and execution time.'
  merge: -1
  img_proc: true
- pgno: 201
  md: 'Compilers also allow users to select specific compilation options from a vast
    repository of flags, often controlled using their command-line interface. The
    order in which the transformations associated with these flags are applied is
    not, however, typically controlled by the user (i.e., users may select some of
    the compilation phases but not their ordering). Common compiler flags control
    the following compiler functionality:


    +   - Function inlining and heuristics to control function inlining (e.g., maximum
    number of statements and maximum number of instructions of the function to be
    inlined)—in gcc, passed as arguments using the "-param" command-line option.

    +   - Loop unrolling and heuristics to control loop unrolling, such as the unrolling
    factor.

    +   - Loop vectorization and the SIMD unit to be targeted (this depends on backward
    compatibility and is mostly used when targeting ×86 architectures).

    +   - Math options which may result in accuracy loss. The associated compiler
    flags may also be needed to enable the use of FMA units.

    +   - Target a specific machine which may improve results but may lead to code
    incompatible with other machines.


    We note that it is common for these compiler flags to also require the internal
    execution of specific compiler analyses and preparation phases, as well as their
    corresponding phase orderings.


    The number of available compiler flags is typically in the order of hundreds,
    and there are several options to report analysis information on the use of compiler
    optimizations (e.g., report on attempts to auto-vectorize loops in the application
    code). Usually, most of these flags can also be activated with the use of source
    code directives (e.g., using pragmas in the case of the C programming language).
    Note that each compiler supports its own set of pragmas for controlling the compiler
    options.


    # 6.3.3 COMPILER PHASE SELECTION AND ORDERING


    The problem of selecting a set of optimizations and a sequence of such optimizations
    is known as phase selection and phase ordering, respectively, and has been a long-standing
    research problem in the compiler community.


    While some combinations of transformations are clearly synergistic (such as constant
    propagation followed by algebraic simplification and strength reduction), the
    feasibility and profitability of other transformation sequences are far less obvious
    since many transformations adversely interact.


    Not surprisingly, there has been an extensive body of research in this area with
    the use of optimization techniques, ranging from generalized optimization [5]
    to machine learning [6,7] and genetic algorithms [8,9], as well as random-based
    search. Mainly, the specialization of phase ordering, taking into account specific
    function properties and/or application domain, may provide significant improvements
    in performance, power, and energy, when compared to the best achievements using
    general predefined optimization sequences provided by -Ox options and compiler
    flags.'
  merge: -1
  img_proc: true
- pgno: 202
  md: 'Very few compilers allow developers to define a specific ordering of its phases.
    An example of a compiler without user’s support for specifying a specific phase
    ordering is the GCC compiler. The ordering can be, however, by modifying the compiler
    itself, but this requires general expertise about the inner works of a compiler,
    the compiler source code, and deep knowledge about target compiler architecture.
    In contrast, the LLVM compiler infrastructure [10] allows developers to specify
    the ordering of the compiler optimizations in addition to the predefined optimization
    sequence options.


    # PHASE SELECTION AND ORDERING IN LLVM


    The LLVM compiler infrastructure [10] provides a tool named opt that receives
    as input a sequence of optimizations and applies that sequence to the LLVM IR
    (e.g., stored in a file using the bitcode format, which is the binary format used
    by LLVM to store the IR and that can be generated by the clang frontend). This
    IR can then be translated to assembly code using the llc tool.


    An example of a compiler sequence (phase order) that can be applied with opt is
    presented below. In this example, we consider a C program named x.c. The clang
    tool translates this program to the LLVM representation which is then passed to
    the opt tool. The opt tool then applies a sequence of compiler optimizations specified
    through the command line to generate an LLVM IR file. Finally, llc translates
    this LLVM IR file to assembly code, which is subsequently translated to an executable
    by gcc.


    ```

    clang -emit-llvm x.c -c -o x.bc

    opt -loop-simplify -loop-rotate -inline -

    -simplify-libcalls -basicaa -licm -constmerge,

    -reassociate -gvn -loop-rotate -loop-unroll -

    -reassociate -gvn -licm -loop-rotate -loop-unroll -

    -licm -gvn -g -o y.s // translate to assembly code

    gcc y.s -o y // create executable “y”

    ```


    *The LLVM compiler infrastructure, http://llvm.org/.

    *opt - LLVM optimizer, http://llvm.org/docs/Passes.html.

    *opt - LLVM optimizer, http://llvm.org/docs/CommandGuide/opt.html#passes.

    *LLVM bitcode file format, http://llvm.org/docs/BitCodeFormat.html.

    *llc - LLVM static compiler, http://llvm.org/docs/CommandGuide/llc.html.


    # 6.4 LOOP VECTORIZATION


    Loop vectorization is the process of translating scalar operations inside a loop
    body into vector (SIMD) instructions (see Chapter 2). Since a vector instruction
    can simultaneously operate on multiple pairs of operands, this technique can be
    used to speedup applications if data parallelism can be exploited. Most modern
    CPUs feature vector processing instructions, including Intel x86’s MMX, SSE and
    AVX instructions, MPS’s MSA, SPARC’s VIS, and ARM NEON extensions.


    To understand why vectorization can improve performance, consider the following
    code:'
