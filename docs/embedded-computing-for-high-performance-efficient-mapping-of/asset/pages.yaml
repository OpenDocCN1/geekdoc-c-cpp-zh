- pgno: 11
  md: '# Introduction


    # 1.1 OVERVIEW


    Embedded computing systems permeate our lives from consumer devices, such as smartphones
    and game consoles, to less visible electronic devices that control, for instance,
    different aspects of a car’s operation. Applications executing on current embedded
    systems exhibit a sophistication on par with applications running on desktop computers.
    In particular, mobile devices now support computationally intensive applications,
    and the trend points to a further increase in application complexity to meet the
    growing expectations of their users. In addition to performance requirements,
    energy and power consumption are of paramount importance for embedded applications,
    imposing restrictions on how applications are developed and which algorithms can
    be used.


    Fig. 1.1 presents a generic and simplified architecture of an embedded computing
    system. A key distinguishing feature of an embedded system lies in the diversity
    of its input and output devices, generically known as sensors and actuators, fueled
    by the need to customize their use for each specific domain. In this diagram,
    we have a bus-based computing core system consisting of a RAM, ROM, and a processor
    unit. The computing core system interacts with its physical environment via a
    set of actuators and sensors using Analog-to-Digital (ADC) and Digital-to-Analog
    (DAC) converter units. At the software level, the operating system and application
    software are stored in ROM or in Flash memory, possibly running a customized version
    of the Linux operating system able to satisfy specific memory and/or real-time
    requirements [1] and can support additional software components, such as resident
    monitors, required by the embedded system.


    Developing applications in heavily constrained environments, which are typical
    targets of embedded applications, requires considerable programming skills. Not
    only programmers need to understand the limitations of the underlying hardware
    and accompanying runtime support, but they must also develop solutions able to
    meet stringent nonfunctional requirements, such as performance. Developing these
    interdisciplinary skills is nontrivial and not surprisingly there is a lack of
    textbooks addressing the development of the relevant competences. These aptitudes
    are addressed when developing and mapping high-performance applications to current
    and emerging embedded computing systems. We believe that this textbook is a step
    in this direction.'
  merge: -1
  img_proc: true
- pgno: 12
  md: '![](img/55beb9162c0073b3a3d7b44f1d5873e8_12_0.png)


    FIG. 1.1 Block diagram of a typical embedded computing system.


    # 1.2 EMBEDDED SYSTEMS IN SOCIETY AND INDUSTRY


    While not necessarily comprehensive, Fig. 1.2 illustrates the diversity of the
    domains and environments in which embedded systems operate. At home, embedded
    systems are used to control and monitor our appliances from the simple stand-alone
    microwave oven, washing machine, and thermostat, to the more sophisticated and
    sensitive security system that monitors cameras and possibly communicates with
    remote systems via the Internet. Embedded systems also control our vehicles from
    the fuel injection control to the monitoring of emissions while managing a plethora
    of information using visual aids to display the operation of our vehicles. In
    our cities, embedded systems monitor public transportation systems which are ubiquitously
    connected to central stations performing online scheduling of buses and trains
    and provide real-time updates of arrival times across all stops for all transportation
    lines. At the office, embedded systems handle small electronic devices such as
    printers, cameras, and security systems as well as lighting.


    Moreover, today''s smartphones are a marvel of technological integration and software
    development. These high-end embedded systems now include multicore processor(s),
    WiFi, Bluetooth, touch screens, and have performance commensurate to the performance
    of high-end multiprocessing systems available just a few years ago to solve scientific
    and engineering computing problems.'
  merge: -1
  img_proc: true
- pgno: 13
  md: '![](img/55beb9162c0073b3a3d7b44f1d5873e8_13_0.png)


    # ## 1.3 EMBEDDED COMPUTING TRENDS


    Over the last decades, the seemingly limitless availability of transistors has
    enabled the development of impressive computing architectures with a variety and
    heterogeneity of devices. This resulted in the ability to combine, on a single
    integrated circuit, computing and storage capacity, previously unimaginable in
    terms of raw hardware performance and consequently in terms of software complexity
    and functionality. Various empirical laws have highlighted and captured important
    trends and are still relevant today in the context of embedded systems. These
    empirical laws include:


    +   - Moore''s Law—"The number of components in integrated circuits doubles every
    18 months." Moore''s Law is one of the driving forces leading to the miniaturization
    of electronic components and to their increasing complexity;

    +   - Gustafson''s Law—"Any sufficiently large problem can be efficiently parallelized."
    Due to the increasing complexity of embedded applications, the potential to use
    the many- and multicore architectures has also increased;

    +   - Wirth''s Law—"Software gets slower faster than hardware gets faster." This
    observation is supported by the fast advances of multicore systems and custom
    computing and hardware accelerators when compared with the availability of'
  merge: -1
  img_proc: true
- pgno: 14
  md: 'effective development tools and APIs (Application Programming Interfaces) to
    exploit the target architectures;


    +   - Gilder''s Law—"Bandwidth grows at least three times faster than computer
    power." This observation points to the advances in data transmission which amplify
    the advances of computing and storage technologies, forming the basis of technologies
    such as cloud computing and the Internet of Things (IoT).


    One of the key trends in embedded systems has been the growing reliance on multi-core
    heterogeneous architectures to support computationally intensive applications
    while ensuring long battery lifetimes. This increase in computing power coupled
    with the ever increase desire to be connected has fueled a fundamental transition
    from embedded systems, mostly operating in stand-alone environments, to a context
    where they are ubiquitously connected to other devices and communication infrastructures,
    in what has been coined as the Internet of Things (IoT).


    As with the evolution of hardware, IoT software requirements have also evolved
    to support more application domains. While in the past years, the focus has been
    on digital signal and image processing, embedded systems are now expected to interact
    with other devices on the network and to support a variety of applications, e.g.,
    with the capability to search remote databases and to compute using geographically
    distributed data.


    Not surprisingly, the computational demands of mobile applications have also increased
    exponentially [2], thus exacerbating the complexity of mapping these applications
    to mobile architectures. It is believed (see, e.g., [3]) that in some domains
    neither hardware scaling nor hardware replication is enough to satisfy the performance
    requirements of advanced mobile applications. Therefore, in addition to the research
    and development of next-generation hardware architectures, it will be critical
    to revisit the development and mapping process of applications on resource-constrained
    devices. In particular, a key step ahead, when considering algorithmic and/or
    target hardware system changes, is the evaluation of code transformations and
    compiler optimizations that fully leverage the acceleration capabilities of the
    target system.


    Another critical issue for companies is time-to-market [4] (see Fig. 1.3). Delays
    entering the market mean smaller overall sales as products have less time to benefit
    from the market before it starts to decline. Thus, a fast and efficient process
    to develop applications is one of the key factors for success in such competitive
    markets.


    # 1.4 EMBEDDED SYSTEMS: PROTOTYPING AND PRODUCTION


    Fig. 1.4 illustrates a design flow for embedded systems. Developing a high-performance
    application for an embedded platform requires developers to exploit sophisticated
    tool flows and to master different levels of abstraction across the various stages
    of application development, including deployment and maintenance.'
  merge: -1
  img_proc: true
- pgno: 15
  md: '![](img/55beb9162c0073b3a3d7b44f1d5873e8_15_0.png)


    # FIG. 1.3 Simplified sales model and marketing entry.


    Based on Vahid F, Givargis T. Embedded system design: a unified hardware/software
    introduction. 1st ed. New York, NY: John Wiley & Sons, Inc.; 2001.


    In our example, the development flow begins by capturing the user requirements
    followed by the actual development of the application. A first proof-of-concept
    prototype is usually validated on a desktop computer, possibly using a programming
    language with features that facilitate early prototyping such as MATLAB, and relying
    on the emulation of external interfaces (e.g., instead of using the real camera,
    one can use prerecorded videos or simple sequences of images stored as files).
    If this initial prototype does not meet its functional requirements, the developer
    must iterate and modify the application, possibly changing its data types (e.g.,
    converting double to single floating-point precision), and applying code transformations
    and/or refactoring code to meet the desired requirements. This process is guided
    by developers’ knowledge about the impact of these modifications on the final
    embedded version. Depending on the project at hand, the prototype may be developed
    in the same programming language used for the embedded version, but possibly using
    different APIs.


    The next step of the development process involves modifying the prototype code
    to derive an embedded code implementation. This includes using emulators, simulators,
    and/or virtual platforms to validate the embedded version and to optimize it if
    needed. At this stage, developers must consider the full set of nonfunctional
    requirements. It is also typical at this stage to explore and test hardware accelerators.
    This step partitions and maps the selected computations to available accelerators.
    If this validation stage is successful, the application is then deployed to the
    target embedded system or to a hardware system emulator, and a second stage of
    validation is'
  merge: -1
  img_proc: true
- pgno: 16
  md: '![](img/55beb9162c0073b3a3d7b44f1d5873e8_16_0.png)


    FIG. 1.4 An example of a design flow for developing an embedded application.'
  merge: -1
  img_proc: true
- pgno: 17
  md: 'performed. If this second level validation is successful, then the application
    is ready to be deployed as a product.


    Depending on the application, target system requirements and nonfunctional requirements
    (in some of the development stages described earlier) might be merged. One of
    the barriers preventing an effective integration of these development stages is
    the lack of interfaces between the corresponding tools to allow them to be truly
    interoperable. This limitation forces developers to manually relate the effects
    of the transformations and analyzes across them, in an error-prone process.


    The development and mapping of applications to high-performance embedded systems
    must consider a myriad of design choices. Typically, developers must analyze the
    application and partition its code among the most suitable system components through
    a process commonly known as hardware/software partitioning [5]. In addition, developers
    have to deal with multiple compilation tools (subchains) for targeting each specific
    system component. These problems are further exacerbated when dealing with FPGAs
    (Field-Programmable Gate Arrays), a technology for hardware acceleration and for
    fast prototyping as it combines the performance of custom hardware with the flexibility
    of software [5,6]. As embedded platforms are becoming increasingly more heterogeneous,
    developers must also explore code and mapping transformations specific to each
    architecture so that the resulting solutions meet their overall requirements.


    One of the key stages of the mapping process is to profile the code to understand
    its behavior (see, e.g., [7]), which is commonly achieved by extensive code instrumentation
    and monitoring. In addition, the development of applications targeting high-performance
    embedded systems leads to source code transformed by the extensive use of architecture-specific
    transformations and/or by the use of tool-specific compilation directives. Such
    practices require developer expertise in order to understand when transformations
    may limit portability, as otherwise when the underlying architecture changes,
    developers may need to restart the design process. Another issue contributing
    to development complexity is the presence of different product lines for the same
    application in order to support multiple target platforms and/or multiple application
    scenarios.


    A key aspect for enhancing performance is exploiting parallelism available in
    the computing platform. In this context, when improving the performance of an
    application, developers need to consider Amdahl’s law [8,9] and its extensions
    to the multicore era [10,11] to guide code transformations and optimizations,
    as well as code partitioning and mapping.


    # 1.5 ABOUT LARA: AN ASPECT-ORIENTED APPROACH


    LARA is an aspect-oriented language able to express code transformations and mapping
    strategies, allowing developers to codify nonfunctional concerns in a systematic
    fashion, which can be subsequently applied in an automated way on their application
    code.'
  merge: -1
  img_proc: true
- pgno: 18
  md: 'The use of Aspect-Oriented Programming (AOP) mechanisms allows LARA descriptions
    to be decoupled from the application code itself—an important feature to improve
    maintainability and program portability across target platforms. In addition,
    LARA descriptions can be easily composed to create increasingly sophisticated
    design space exploration (DSE) strategies using native LARA looping and reporting
    analysis constructs. In short, LARA provides a more formal vehicle to specify
    the strategies for the various stages of a application’s design flow, in what
    can be seen as executable strategies.1


    Many of the descriptions of code instrumentation and transformations in this book
    use the LARA language [12]. Despite the many advantages of LARA as a transformation
    description language, this book is not about LARA. In other texts, many if not
    all of the mapping techniques and code transformations used when targeting high-performance
    embedded systems have been described in an informal, often ad hoc fashion, using
    abstractions of the underlying hardware and even runtime systems. The LARA descriptions
    presented in this book can thus be viewed as a vehicle to help the reader to clearly
    and unambiguously understand the various code and data transformations used in
    a complex mapping process. Furthermore, LARA has been developed and validated
    in the context of many research projects targeting real computing systems, and
    supports popular languages such as C and MATLAB to target heterogeneous systems
