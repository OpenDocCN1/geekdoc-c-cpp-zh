    # 7.4 GRAPHICS PROCESSING UNITS


    A Graphics Processing Unit (GPU) is a specialized type of hardware accelerator
    originally designed to perform graphics processing tasks. However, with the advent
    of programmable shaders and floating-point support, GPUs were found to be considerably
    faster than CPUs for solving specific types of problems, such as scientific applications,
    that can be formulated as uniform streaming processes. This type of processes
    exploits data parallelism, applying the same kernel (operation) over a large sequence
    of data elements.


    One popular approach for programming GPUs is OpenCL [3,4], an open standard which
    is currently maintained by the consortium Khronos Group. Unlike CUDA, OpenCL is
    vendor independent and supports a wide range of compute devices spanning from
    multicore CPUs to FPGAs. In this section, we consider the use of OpenCL to program
    GPUs in the context of a heterogeneous platform where a CPU acts as the


    1 It is common to use the term GPGPU (General-Purpose Graphics Processing Unit)
    to refer GPUs that are programmable and can support different application domains.
    We use the term GPU and GPGPU interchangeably since most GPUs on the market today
    belong to the latter category.'
