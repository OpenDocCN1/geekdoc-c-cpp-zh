  md: "by other designs are named pareto-optimal designs and define the Pareto frontier.\
    \ A Pareto optimal design solution thus exhibits a key property: an improvement\
    \ in one objective results in worsening at least one other objective.\n\nTo solve\
    \ a multiobjective optimization problem, we identify the set of all Pareto optimal\
    \ solutions or its most representative points. Assuming a set of designs, we can\
    \ compute the Pareto frontier by first sorting these designs in descending order\
    \ of importance by the first objective function, e.g., execution time. Assuming\
    \ the sorted population of designs as D, we can use the recursive algorithm frontier(D)\
    \ depicted in Fig. 8.2 to determine the design space Pareto algorithm (see Ref.\
    \ [2] for further reading).\n\nThis algorithm works by partitioning the design\
    \ population D in two halves: T and B. Given the way the initial population is\
    \ sorted, the top half T is considered to contain dominant designs with respect\
    \ to the subpopulation considered, and thus we only need to check the bottom half\
    \ B for designs not dominated by any elements of T. The nondominated designs from\
    \ B are then merged with T to produce M to compute the Pareto frontier.\n\nSince\
    \ each computed Pareto frontier design point corresponds to a trade-off between\
    \ conflicting objectives, we still need to determine which design solution to\
    \ select. This can be done by manually inspecting the Pareto frontier design points,\
    \ e.g., using information provided by developers to express some preference or\
    \ priority possibly based on other nonfunctional requirements.\n\nGiven the importance\
    \ of this problem, researchers have developed various methods to derive the Pareto\
    \ frontier. Here, we assume a population of designs x ∈ X, where X corresponds\
    \ to all feasible solutions, and we have k objective functions f(x), each one\
    \ corresponding to a metric of interest. The three major methods described in\
    \ the literature can be broadly classified as:\n\n+   - Linear scalarization.\
    \ This method involves recasting a multiobjective optimization problem as a single-objective\
    \ problem (as previously described), such that the solutions to the latter are\
    \ Pareto optimal solutions of the former.\n\n```\nfrontier(D)\n    nd = size(D)\n\
    \    if nd is 1: return D\n    T = frontier(D[0:nd/2])\n    B = frontier(D[nd/2+1:nd-1]);\n\
    \    M = T\n    for each design t ∈ T:\n        for each design b ∈ B:\n     \
    \       if design b is not dominated by design t: M = M U {b}\n    return M\n\
    ```\n\nFIG. 8.2 Algorithm for determining the Pareto Front."
