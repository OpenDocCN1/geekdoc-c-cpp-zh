    # 5.13 SUMMARY


    This chapter presented several code transformations that are usually considered
    to improve performance, reduce power or energy consumption. The portfolio of code
    transformations is diverse and large, and to the best of our knowledge there is
    no compiler or source-to-source compiler that automatically performs all of them.
    In fact, most compilers (including GCC) only support a limited set of the code
    transformations introduced in this chapter. This makes the user knowledge about
    them even more important. However, the decision to apply most of these transformations
    is not easy and requires specific expertise and/or an app-and-evaluate approach.
    In most cases, it is difficult to understand the implications in terms of performance/energy/power
    without real measurements and any further optimization opportunities that could
    arise by applying a specific code transformation. Still, information given by
    code analysis tools, the manual analysis of the code, or by runtime profiling
    is usually helpful in guiding developers in their choice of which code transformations
    to use.


    # 5.14 FURTHER READING


    The literature regarding code transformations is vast due to their use in many
    application domains. An important aspect of code transformations is the underlying
    techniques used for code analysis, not only to determine their legality but also
    their potential profitability. Code analysis techniques are part of any compiler
    as described extensively in the literature (see, e.g., [29,30,31,32]).'
