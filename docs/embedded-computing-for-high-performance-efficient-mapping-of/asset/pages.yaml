  md: '# Source code analysis and instrumentation


    # 4.1 INTRODUCTION


    Source code analysis and instrumentation are fundamental aspects in the software
    development process for understanding application behavior and potential code
    transformations. Understanding the structure of the code both at a high granularity
    level (global program scope) as well as at a lower granularity level (procedure/function
    scope level) is very important for debugging and validation. At a high level,
    understanding the structure of the code by examining which procedures invoke other
    procedures or which procedures allocate storage enables the use of sophisticated
    source code transformations or performance-oriented transformations (or “optimizations”).
    Understanding storage allocation and its use is a key analysis for embedded systems
    given their often limited memory capacity. Last, but not least, understanding
    where the execution spends the bulk of its time (execution time profiling) is
    a key information to help developers select a set of transformations that have
    impact on performance.


    Programmers might be interested in many aspects of code analysis. An extensive
    number of software metrics have been proposed by the software engineering community
    (see, e.g., [1–3]). These include simple metrics such as the number of lines of
    code (LOCs), cyclomatic complexity, and cohesion. If the developer’s goal is to
    assess the potential for migration to a CPU with high floating-point computation
    capability, then an analysis of floating-point computation versus integer arithmetic
    computation is desirable. Yet, in the context of concurrent execution, there is
    a need to know the data communication volume to assess the benefits of porting
    the application code to a system with more suitable internode communication bandwidth.


    In general, source code analysis can be viewed in two perspectives. The first
    perspective looks at code analysis as the means to an end. That is, a particular
    goal must be defined in order to identify the techniques that can achieve it.
    For instance, one commonly used technique to help optimize an application’s execution
    time (the “goal”) is code profiling to find hotspots, also known as critical sections.
    Hotspots are regions of the code where program execution spends a high portion
    of the overall execution time, and thus are prime candidates for optimization.
    By reducing the execution time of hotspots, higher global reductions are achieved'
  merge: -1
  img_proc: true
- pgno: 110
  md: 'than by reducing the execution of code regions with lower contribution to the
    overall execution time.


    Still, code analyses are not exclusively geared toward performance and other optimization
    goals. In a second perspective, the goal of discovering information about an application
    through an exploratory experimental process aims at uncovering unforeseen properties
    of an application—related to functional and nonfunctional concerns—and to allow
    the development of new code analysis techniques that can handle the growing complexity
    of software applications. Code analyses can provide insights, e.g., into assertion
    discovery, clone detection, debugging, empirical software engineering research,
    fault localization, optimization techniques, performance modeling, program evolution,
    quality assessment, reverse engineering, safety criticality, software maintenance,
    software reliability engineering, software versioning, symbolic execution, testing,
    validation (conformity checking), and verification.


    In many scenarios, tools that can automatically analyze code are increasingly
    desirable. These tools are invariably diverse as the type of information they
    capture. For simple analysis, such as the calling structure, a simple source code
    analyzer will suffice and code execution is not required. On the other end of
    the spectrum, dynamic measures such as the amount of storage used or data transferred,
    tools must examine a running executable under representative input datasets. In
    order to address the dynamic behavior of applications and their main characteristics
    in terms of the input data, operating environment, and target system, profiling
    is becoming an essential stage when developing an application.


    In this book, we focus on code analysis and instrumentation to help developers
    (and in some contexts, automated tools) to better decide about how to transform
    a given section of code and/or to better map an application to a target computer
    architecture, possibly consisting of multiple cores and hardware accelerators.
    Of paramount importance to these goals is the extraction of data- and task-level
    parallelism, data communication demands, and program execution distribution at
    function and code section levels. Here, we assume the existence of the source
    code of the application and a process consisting of code transformations, compiler
    optimizations, and code translation and/or extensions to different programming
    models.


    # 4.2 ANALYSIS AND METRICS


    The output of a source code analysis can take many forms. It can provide high-level
    information about the application, such as metrics identifying program properties,
    and annotated internal representations such as call graphs, capturing the number'
  merge: -1
  img_proc: true
- pgno: 111
  md: 'of times a function has been invoked. Unlike other transformations that modify
    the source code, code instrumentation is often meant to be executed in order to
    uncover dynamic properties of the application and discarded afterwards. A classic
    example of instrumentation consists of inserting timing calls in strategic regions
    of code to identify hotspots.


    We can thus classify code analyses as either static or dynamic. Static code analysis
    is applied without running the application and requires the inspection and analysis
    of the source code. It focuses mainly on the structure of the application code
    itself and is, in general, intended for application code understanding. Programmers
    need to understand which sections of the code invoke which routines (or procedures)
    and what form of concurrent constructs are used. These analyses thus inspect the
    source code and do not require the knowledge of the program input to extract metrics
    of “performance” as the application is never executed. The scope of the derived
    information is thus limited.


    # TOOLS FOR PROFILING


    Typical tools used for profiling an application include GNU Gprof [5], Valgrind
    [6], VTune, and Vampir. Note, however, that according to the target system there
    might be specific APIs and libraries to acquire certain system information such
    as power consumption.


    +   - GNU gprof. http://www.cs.utah.edu/dept/old/texinfo/as/gprof.html.

    +   - Gprof main page. http://www.gnu.org/software/binutils/manual/gprof-2.9.1/html_mono/gprof.html.

    +   - Valgrind. http://valgrind.org/docs/manual/ (Accessed June 2012).

    +   - Intel VTune Amplifier XE 2013. http://www.intel.com/software/products/vtune/
    (Accessed June 2014).

    +   - Vampir. https://www.vamper.eu/ (Accessed October 2015).


    In contrast, a dynamic analysis aims at uncovering metrics of “performance” that
    are inherently tied to the execution of the code. There is a wide variety of metrics
    that are of interest, and analyses such as code profiling are supported by instrumentation
    of either the source code and/or of its binary executable form.


    Given the diversity and possibly the huge volume of the data uncovered by dynamic
    analyses (as these can vary widely given the characteristics of the input datasets)
    it is not uncommon for tools to generate aggregate summary data or to simply focus
    on selected metrics of performance. A specific example includes metrics such as
    number and size of messages exchanged between concurrently executing threads in
    MPI (Message Passing Interface) programs. Depending on the number of threads,
    the size of the generated dataset using such analysis (instrumenting the MPI send/receive
    calls) can be extremely large.


    Complementary to the type of analysis, we can also classify them as safe if they
    can assurance of a particular outcome (for instance, if function A is executed,
    then function B is executed as well). In addition, an analysis is said to be sound
    if'
  merge: -1
  img_proc: true
- pgno: 112
  md: 'it provides correctness guarantees with respect to the program semantics. One
    example of an _unsound_ analysis is word length optimization, which assigns custom
    word lengths to variables and expressions of the program (as opposed to fixed
    32- or 64-bit widths) to derive a more efficient implementation (e.g., using fewer
    hardware resources, saving memory) based on the expected input ranges and the
    desired output precision.


    We can also classify the outcomes of static analyses as code properties and/or
    source code metrics, and the outcome of dynamic properties as execution metrics.
    Code properties capture structural, syntactic, and semantic information about
    the source code. They can identify, for instance, whether a specific variable
    is of integer type, whether a function is only declared within the context of
    a file, or if a variable''s value can be reached in a particular region of code.
    On the other hand, source code metrics provide a quantitative measure that allows
    assertions to be made about the application''s code, for instance, about its complexity,
    computational requirements, and even design quality. A simple commonly used measure
    for code complexity is the number of lines of code (LOC) (Table 4.1).


    # Table 4.1 Examples of common code metrics


    | Metric | Description | Method | Scope |

    | :--- | :--- | :--- | :--- |

    | Lines of code | Number of lines of code in all files | Code inspection | Complexity
    |

    | # operators | Number of operators in a module | Code inspection | Complexity
    |

    | Cyclomatic complexity | Complexity of the module structure | Code inspection
    | Complexity |

    | Coupling | Degree of interdependence between software modules | Code inspection
    | Complexity |

    | Cohesion | Degree in which elements of a module belong together | Code inspection
    | Complexity |

    | Code coverage | Degree in which the source is tested by unit and integration
    tests | Code instrumentation and execution | Testing |

    | Profiling | Execution time for modules in the program | Code instrumentation
    and execution | Optimization |

    | Power consumption | Dynamic power consumed when executing the program | Code
    instrumentation and execution | Optimization |

    | Performance model | Provides an estimation of how much profitable a module can
    be on a particular device based on the input data (size, data type, etc) | Code
    inspection, instrumentation and execution | Optimization |'
