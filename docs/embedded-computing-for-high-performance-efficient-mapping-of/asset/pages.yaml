  md: '![](img/55beb9162c0073b3a3d7b44f1d5873e8_253_0.png)


    FIG. 7.9

    The main stages of a high-level synthesis (HLS) approach.


    The HLS compilation flow [8–10] targeting fine-grained reconfigurable devices
    consists of a number of stages, as illustrated in Fig. 7.9. In the first stage,
    an RTL description is generated from a high-level program (e.g., a C/C++ program).
    An RTL model (usually described in a hardware description language such as Verilog
    or VHDL) represents a hardware design in terms of registers (Flip-Flops), memories,
    and arithmetic and logical components. In a subsequent stage, this RTL description
    is synthesized to logic gates (in a process known as *logic synthesis* [11]) and
    functional units directly supported by the FPGA resources. Next, these logic gates
    and the functional units are further *mapped* to FPGA elements (LUTs, Slices,
    BRAMs, DSP blocks, etc.). Finally, the placement and routing (P&R) process assigns
    these FPGA elements to actual resources on the FPGA and allocates the necessary
    interconnects between these resources to form a complete hardware circuit.'
  merge: -1
  img_proc: true
