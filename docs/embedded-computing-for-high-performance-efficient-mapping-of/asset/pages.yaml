  img_proc: true
- pgno: 106
  md: 'C/C++ code) or with the binaries and/or traces of executed instructions [41].
    Approaches addressing dynamic hardware/software partitioning have been focused
    more recently (see, e.g., [7,42]). Other approaches consider the static preparation
    of hardware/software components, but delegate to runtime the decision to execute
    computations in hardware or software. For instance, Beisel et al. [28] present
    a system for deciding at runtime between hardware/software partitions to library
    function level. The system intercepts library calls and for each call it decides
    to offload the call to a hardware accelerator. The decision is based on tables
    storing information about the execution time for each supported function and for
    different data sizes. Additional decisions can also consider other information,
    such as the number of iterations (calculated at runtime) each loop will execute
    for each execution point, to decide off-loading computations to hardware accelerators.
    Vaz et al. [29] propose to move the decision point within the application to possibly
    hide some overheads, such as the preparation of the coprocessor execution.


    Current heterogeneous multicore architectures support GPUs and/or reconfigurable
    hardware (e.g., provided by FPGAs) with the possibility to provide different execution
    models and architectures, thus increasing the complexity of mapping computations
    to the target components. Systems may have to consider not only code transformations
    that might be suitable for a particular target, but also decide where to execute
    the computations, which is not trivial. For instance, when considering a target
    architecture consisting of a CPU + GPU, a system may need to decide about the
    execution of OpenCL kernels in a multicore CPU or on a GPU [30]. The complexity
    of the problem and the variable parameters involved to make a decision are being
    addressed by sophisticated solutions, such as the ones using machine learning
    techniques to estimate execution time based on static and dynamic code features
    [31]. Other authors address the data migration problem when targeting GPU acceleration
    [32]. As these are hot research topics, it is expected that further solutions
    will be proposed especially considering the interplay between code transformations,
    workloads, runtime adaptivity, and the specificities of the target architecture.


