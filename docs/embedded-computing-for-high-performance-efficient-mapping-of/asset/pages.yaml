    # 5.8.6 ARRAY PADDING


    As the sizes of caches are usually a power of 2, large arrays that have sizes
    that are powers of 2 may cause conflicts. Array padding consists of increasing
    the size of one of the array dimensions by one (known as interarray padding) to
    reduce such conflicts or to “force” the base address of subsequent arrays by introducing
    pad arrays between successive array declarations (known as intraarray padding).
    The following example shows the use of interarray padding (code on the middle)
    and intraarray padding (code on the right) techniques.


    ```

    double A[1024];

    double B[1024];

    double sum=0.0;

    for(i=0;i<1024; i++)

    sum+=A[i]*B[i];


    double A[1024];

    double pad[M];

    double B[1024];

    double sum=0.0;

    for(i=0;i<1024; i++)

    sum+=A[i]*B[i];


    double A[1024+1];

    double B[1024];

    double sum=0.0;

    for(i=0;i<1024; i++)

    sum+=A[i]*B[i];

    ```


