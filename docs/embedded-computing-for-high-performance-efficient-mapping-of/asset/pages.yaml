    # 8.7 SUMMARY


    This chapter highlighted additional topics complementing the contents of previous
    chapters, namely, design space exploration (DSE), hardware/software codesign,
    runtime adaptivity, and autotuning. These topics are increasingly important given
    the growing complexity of both applications and high-performance embedded architectures.


    # 8.8 FURTHER READING


    Design space exploration (DSE) has been the focus of current research in the area
    of embedded computing and system synthesis (see, e.g., [12,13]). The diversity
    of possible DSE approaches makes it hard to select an approach or even an algorithm.
    In most cases, developers use conventional and/or generic approaches based on
    stochastic algorithms as a way to find near-optimal solutions.


    As hardware/software partitioning is one of the main tasks of hardware/software
    codesign, it has been explored by many authors employing several approaches (see,
    e.g., [5,14]). Not surprisingly, the hardware/software codesign problem has been
    the focus of research for many years by the electronic design automation (EDA)
    community (see, e.g., [5,6,15]) and has recently also attracted the attention
    of the HPC community (see, e.g., [16]).


    The runtime adaptivity topic has received more attention recently due to the availability
    of computing resources that have rendered its runtime variants increasingly feasible.
    A representative approach is proposed by PetaBricks (see, e.g., [17]). PetaBricks
    includes an “implicit parallel language” for program development based on algorithmic
    choice. Using PetaBricks, the programmer can specify multiple algorithms solving
    a problem, without the need to specify the one to be used in each particular situation
    (e.g., according to the dataset size). Instead, based on the set of algorithms
    to solve the problem and experimental testing, the compiler generates and autotunes
    an optimized hybrid algorithm. Hybrid algorithms are obtained by'
