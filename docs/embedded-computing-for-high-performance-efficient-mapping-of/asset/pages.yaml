- pgno: 288
  md: '# Glossary


    # A


    **Affine function** a function of the form: $f(x_1, x_2, ..., x_n) = c_1 x_1 +
    c_2 x_2 + ... + c_n x_n + c_0$, considering $n \ge 1$ variables $x_i$, and $n+1$
    constants $c_i$ (see also affine index functions).


    **Affine index function** used in the context of an array index when the expression
    that defines is a linear combination of the loop induction variables. For example,
    the index function $2*i + j$ is an affine index function over the induction variables
    $i$ and $j$, but the indexing function $i*j$ is not affine (see also affine functions).


    **Aspect-oriented programming (AOP)** programming paradigm which aims at increasing
    software code modularity by allowing the separation of cross-cutting concerns
    from the rest of the application. AOP typically requires extensions to the programming
    language or a new language to describe cross-cutting concerns (using aspects),
    and the use of a tool that merges these concerns with the application source code
    (a process known in the AOP community as weaving and the tool responsible for
    weaving is known as weaver). Examples of AOP approaches include AspectJ for Java
    and AspectC++ for C++.


    **Autotuning** the automatic process of deriving an efficient configuration that
    satisfies a given objective based on one or more performance metrics (e.g., energy
    consumption or execution time). In this context, configurations are defined as
    tuples consisting of parameter values, code/algorithmic variants, and/or compiler
    transformation/optimizations. Auto-tuning can be performed offline (at compile
    time), online (at runtime), or both.


    **Basic block** the maximum sequence of instructions (possibly defined at the
    assembly or intermediate representation level) such that if the first instruction
    of the sequence is executed, then all the instructions in that sequence are also
    executed. In other words, it is a sequence of instructions with no "jump" to or
    from any instructions inside the basic block.


    # B


    **big.LITTLE** a heterogeneous computing architecture developed by ARM, which
    couples power-efficient slower processors (LITTLE) with more powerful power-hungry
    processors (big) in the same device.


    **Block and cyclic distribution** an array can be partitioned on available distributed
    memories in a multiprocessor platform by specifying for each dimension of the
    array the mapping between array indices and abstract processors. A distribution
    of size N is distributed in a block fashion across P if N/P consecutive elements
    are assigned to a given processor. In a cyclical distribution, every other P element
    of the N elements is distributed to the same processor. It is possible that an
    array is distributed using the block scheme along one dimension and cyclical along
    another dimension.


    **Built-in functions** functions that are specific to a target machine and that
    take advantage of specific ISA support.


    # C


    **Cloud computing** the delivery of on-demand computing, storage, and communication
    resources, as well as computing platforms and software, over the Internet on a
    pay-for-use basis.'
