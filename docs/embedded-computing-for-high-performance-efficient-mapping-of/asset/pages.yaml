    \ of loops: (A) original loop; (B) applying strength reduction to 4*i; (C) moving\
    \ the strength reduction to the loop control (a transformation also known as induction\
    \ variable elimination).\n\nAnother important transformation is scalar replacement\
    \ where references to array elements are replaced by references to scalar variables.\
    \ Typically, a computation such as an accumulation of values is first performed\
    \ on a scalar variable (possibly even mapped to a hardware register by the compiler).\
    \ When the accumulation is completed, the value of the scalar variable is then\
    \ transferred to the array location thus resulting in substantial savings in terms\
    \ of array address calculation and load/store operations. In addition, scalar\
    \ replacement can achieve data reuse when applied in the context of the reuse\
    \ of subscripted variables. In this case, redundant array accesses can be eliminated\
    \ and replaced by scalar accesses.\n\nThe use of scalar variables to replace accesses\
    \ to arrays can be done for some of the elements of the array or for the entire\
    \ array. A special case of scalar replacement, and usually enabled by loop unrolling,\
    \ is register blocking. By unrolling loops, it is common to expose blocks of scripted\
    \ variables (registering array accesses) and to increase the opportunity to apply\
    \ scalar replacement.\n\nThe following example presents an example of scalar replacement\
    \ (sometimes known as loop scalar replacement). In this case accesses to array\
    \ y over i are replaced with accesses to scalar y_aux and only one access to y\
    \ for each i is required. This example shows the elimination of redundant array\
    \ accesses using scalar replacement.\n\n```\nfor (i=0;i<64;i++) {\n y[i] = 0;\n\
