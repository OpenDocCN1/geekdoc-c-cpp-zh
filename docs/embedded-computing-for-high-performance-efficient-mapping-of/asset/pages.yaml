    # ACPI: ADVANCED CONFIGURATION AND POWER INTERFACE


    ACPI is a standard interface specification supported by hardware and software
    drivers. Usually the operating system uses this API to manage power consumption,
    but the API can also be used by applications.


    ACPI considers four global states (from G0 to G3, with a subdivision in six sleep
    states S0 to S5), performance states (base on the possible OPPs), known as P-states
    (and from P0 to P15 at maximum, being P0 the state operating at maximum clock
    frequency and resulting in the highest power dissipation). Processor states, known
    as C-states (and usually from C0 to C3, but depending on the processor). The C-states
    represent operating (C0), Halt (C1), Stop-Clock (C2), and Sleep (C3) states.


    *Unified EFI Inc. Advanced configuration and power interface ACPI overview. Revision
    5.1 July, 2014) http://www.uefi.org/sites/default/files/resources/ACPI_5_1_Release.pdf.


    ```

    E = P_avg × T (2.11)

    ```


    Energy consumption is not directly associated with heat but affects battery usage.
    Thus by saving energy one is also extending the battery life or the length of
    the interval between battery recharges. On the other hand, energy efficiency is
    a term related to performing the work needed with as less energy as possible,
    sometimes being quantified by the work done per Joule (e.g., samples/J, Gbit/J,
    and frames/J). Two common metrics used to represent the trade-off between energy
    consumption and performance are the energy delay product (EDP) and the energy
    delay squared product (ED²P). EDP is obtained by multiplying the average energy
    consumed by the computation time required [31]. Both EDP and ED²P give more importance
    to the execution time than to the energy consumed. Compared to EDP, by squaring
    the computation time required, the ED²P metric gives even more importance to execution
    time than to energy consumption. One can give even more importance to performance
    by powering the computation time required by values >2.


