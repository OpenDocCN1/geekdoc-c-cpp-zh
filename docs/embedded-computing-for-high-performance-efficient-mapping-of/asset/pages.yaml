    # 3.5.4 INVOKING ASPECTS


    LARA provides a mechanism for invoking an aspect from an aspect definition and
    optionally share data between them through their input and output parameters.
    This enhances modularity and reuse. Fig. 3.38 shows a simple example where one
    of the LoopUnroll Innermost aspects presented before is invoked with 2 as its
    argument.


    When calling an aspect with output parameters, the only way to access the output
    values is through the assignment of an identifier to the call and then to use
    a syntax similar to a field access. For instance, in call A.countFOR(loops); in
    line 2 of Fig. 3.31, the identifier A is used to represent that specific call
    of aspect countFOR loops. The use of A.num_for_loops in line 3 allows the value
    of num_for_loops to be accessed in that specific call.


    The current semantics related to calls varies in terms of insert and exec/def
    actions. The result of the insert actions is not made available to subsequent
    weaving statements until the output code is generated and input to the compiler.
    That is, the code modifications using insert actions are not immediately visible
    during the weaving process responsible for those insertions.


    On the other hand, the changes that result from the exec/def actions are available
    once execution enters a new aspect. We show here an example of what the semantic
    of the exec/def actions implies. The aspect presented before in Fig. 3.35 unrolls
    the innermost for loops. If we apply the aspect with a factor= 0, we will fully
    unroll all the loops that fit a specific condition. This aspect does not fully
    unroll the loops recursively because it only considers the original innermost
    loops found in the application. The recursive invocation of this aspect would
    lead to the full unrolling of all the loops regardless of their original position
    in the nested loop structure. Fig. 3.39 presents a possible aspect that recursively
    unrolls all loops in the program. Note the use of the break instruction in line
    23 to prevent the unrolling of loops that no longer exist as a result of having
    been fully unrolled. Fig. 3.40 illustrates an aspect with the same goal but using
    iteration instead of recursion.


