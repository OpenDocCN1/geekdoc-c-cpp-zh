  md: "# 5.6.15 LOOP VERSIONING\n\nLoop versioning consists of generating multiple\
    \ versions of a loop, in which each version's execution is predicated and selected\
    \ at runtime. This transformation is always legal and is commonly used in conjunction\
    \ with partial loop unrolling to test if the number of iterations of the loop\
    \ evenly divides the selected unrolling factor.\n\nThis transformation can also\
    \ be used to ensure the legality of other transformations. For example, the following\
    \ code shows how a compiler can generate transformed code and use a predicate\
    \ to ensure that a loop can be vectorized. In this case, it emits code that checks\
    \ at runtime the absence of data dependences between the array variables (i.e.,\
    \ if arrays A and B are not fully or partially overlapped) and thus can be vectorized.\
    \ If this predicate does not hold at runtime, then the loop is not vectorizable\
    \ and the code will execute an alternative version of the loop (possibly the original\
    \ loop version).\n\n| //Float *a, float *b\nfor(i = 0; i < N; i++)\n A[i] = B[i]\
    \ + C; | //float *a, float *b\n// USE ORIGINAL VERSION:\nif (((B[A[N-1]] >= B[0])\
    \ && (B[N-1] >> A[0]))\n for(...) { // N: i++ }\n // USE VECTORIZED VERSION:\n\
    \ else { // assuming N==4\n for(i = 0; i < N; i+=4)\n A[i:i+3] = B[i:i+3] + C;\
    \ |\n\nTypically, multiple versions corresponding to different optimizations of\
    \ the same loop can coexist at runtime and selected depending on certain runtime\
    \ properties. This transformation can be even extended when considering the use\
    \ of hardware accelerators and/or computation offloading. In this case, multiple\
    \ implementations of the same loop can be provided, and the decision to execute\
    \ one of them is postponed to runtime.\n\n# 5.6.16 SOFTWARE PIPELINING\n\nSoftware\
    \ pipelining [8] (also known as loop pipelining and loop folding) is a technique\
    \ that overlaps loop iterations (i.e., subsequent iterations start before previous\
    \ finished). This technique is suitable to increase performance but may also increase\
    \ register pressure (not a main problem in reconfigurable architectures with pipeline\
    \ stages). One of the most used software pipelining techniques is the iterative\
    \ modulo scheduling [9].\n\nAll efficient compilers include software pipelining\
    \ as part of their set of optimizations. This technique is mostly applied at the\
    \ intermediate representation (IR) level of a program, but can also be applied\
    \ at the source code level (and in this case, it is considered a code transformation\
    \ technique, as the following example shows.\n\nSoftware pipelining requires a\
    \ prologue, a kernel, and an epilogue (see Fig. 5.8). They can be explicit as\
    \ shown in the following example (middle) or implicit during execution as can\
    \ be the case of code on the right. In the latter, predicated execution is used.\
    \ The kernel is the section of code that iterates capturing all loop instructions.\
    \ The prologue and the epilogue execute a subset of instructions (ramp-up and\
    \ ramp-down)."
