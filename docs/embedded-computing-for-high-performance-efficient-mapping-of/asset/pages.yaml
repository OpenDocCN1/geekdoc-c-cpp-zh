  md: 'At runtime, one can derive the exact number of occurrences for a specific execution
    scenario, e.g., not only the number of load/store instructions but also the number
    of times each one was executed, as the edges of the CFG can be annotated with
    its execution frequencies. One important representation is the Call Graph (CG).
    It can be created by a static analysis or by a dynamic analysis and it is thus
    referred to as a Static CG or Dynamic CG, respectively. The Dynamic CG can capture
    the same information as the Static CG, or it can represent part of the Static
    CG by considering only the function calls executed in a specific execution scenario.
    The power of the Dynamic CG derives not only the identification of the actual
    calls executed at runtime, but also from the possibility to be annotated with
    dynamic information such as the size of data flowing between calls and the number
    of times each function was called.


    # LARA AND INSTRUMENTATION


    LARA [14,15] is an aspect-oriented programming (AOP) language specially designed
    for allowing developers to program code instrumentation strategies, to control
    the application of code transformations and compilations, and to effectively control
    different tools in a toolchain. Besides instrumentation, LARA aspects allow the
    user to instrument code to collect schemes (e.g., for profiling customization).
    The unified view provided by LARA also contributes to the development of strategies
    that use as input information output from profiling. The LARA technology is currently
    being used in four compiler tools: MATISSE (a MATLAB to C compiler), Harmonic
    (a source-to-source compiler), MANET (a source-to-source compiler), and ReflectC
    (a C-style-based C compiler).


    MATISSE: http://...

    Harmonic: http://...

    Reflect: http://...


    Another useful representation is the Task Graph (TG), also similar to a graph
    representing a workflow. A TG represents the application as a collection of tasks
    along with the control and data dependencies between them, and thus can be used
    to identify task-level parallelism opportunities, including task-level pipelining.
    The TG can also be seen as a Data Dependence Graph (DDG) at the task level.


    At a lower level, one can view the creation of a Dynamic DDG at the statement/instruction/operation
    level. Using traces of the accessed memory addresses one can determine memory
    access distances and guide code transformations to promote data reuse, regions
    of memory accessed (which can be used to guide data partitioning), memory access
    patterns, producer/consumer tasks, their communication access patterns (which
    can be used to guide task-level pipelining), etc.


    The information one can acquire from the execution of an application is diverse
    and very dependent on the specific analysis and/or transformation goal. Table
    4.3 shows a representative set of features in the context of high-performance
    embedded computing. The monitoring is grouped according to three types: control,
    data, and operations. We consider here that the information acquired is used to
    guide code transformations, compiler optimizations, and partitioning and mapping.
    The acquired features or metrics include range values, data sizes, loop trip counts,
    memory alias, and execution frequency of paths and basic blocks (considering branches).'
