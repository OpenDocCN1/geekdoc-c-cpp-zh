  md: 'create the threat of thermal runaway. This is particularly serious in devices
    with many cores where the execution of all the cores at maximum or acceptable
    speed is unfeasible.


    To cope with this issue, ICs may have resorted to “Dark Silicon” [35] techniques
    that under-power or under-clock regions of an IC whenever they are not being used.
    To support these techniques, ICs have to provide low-level mechanisms that allow
    the monitoring of the thermal conditions of specific regions of the IC, e.g.,
    of a coprocessor or hardware accelerator and provide an interface with which a
    runtime environment or a scheduler can reduce the associated clock rate or even
    temporarily power down that unit for the sake of power dissipation. The impact
    on the ability of compilers to statically schedule the execution of selected computations
    on such devices is substantial. Execution predictability and hence nonfunctional
    requirements guarantees such as latency and throughput are, in this context, harder
    to ensure. Another possibility is to map and schedule the computations at runtime
    using OS, middleware, or application-level support.


    # 2.7 COMPARING RESULTS


    When comparing execution times, power dissipation, and energy consumption, it
    is common to compare the average (arithmetic mean) results of a number of application
    runs. This reduces the impact of possible measurement fluctuations as most of
    times measurements can be influenced by unrelated CPU activities and by the precision
    of the measuring techniques. Depending on the number of measurements, it might
    be also important to report standard deviations. When comparing speedups and throughputs,
    however, it is convenient to compare the geometric mean of the speedups/throughputs
    achieved by the optimizations or improvements for each benchmark/application used
    in the experiments, as opposed to the use of arithmetic mean for speedups which
    may lead to wrong conclusions. In most cases, the measurements use real executions
    in the target platform and take advantage of the existence of hardware timers
    to measure clock cycles (and correspondent execution time) and of the existence
    of sensors to measure the current being supplied. Most embedded computing platforms
    do not include current sensors and it is sometimes needed to use a third-party
    board that can be attached to the power supply (e.g., by using a shunt resistor
    between the power supply and the device under measurement).


    There are cases where performance evaluations are carried out using cycle-accurate
    simulators (i.e., simulators that execute at the clock cycle level and thus report
    accurate latencies and power/energy models. Cycle-accurate simulations can be
    very time-consuming and an alternative is to use instruction-level simulators
    (i.e., simulators that focus on the execution of the instructions but not of the
