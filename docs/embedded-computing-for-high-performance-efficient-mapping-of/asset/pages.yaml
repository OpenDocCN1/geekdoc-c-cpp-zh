  md: 'and as such it becomes imperative to determine which sections of the code are
    responsible for the vast majority of the execution time in what is named a “hotspot.”
    To find such hotspots, the typical approach consists in instrumenting the code
    by inserting timing primitives that measure the execution time of specific regions
    of code, such as function calls and loops. Once the instrumented application is
    executed, the timing data can be collected and used for subsequent analysis. This
    is the typical approach of the *profiling* tools that instrument the code to collect
    a wide range of metrics related to the execution of the program which in many
    cases, and unlike intrinsic code metrics or properties, are intimately tied to
    the architecture of the target system.


    Profiling outputs a report about the characteristics of the application and of
    its behavior in one or more executions as it is usually possible to aggregate
    in a single report the results of different execution runs. The information in
    the report can be output in a human readable way or to be used by other tools
    or compilers. Due to the complexity of the information output, more advanced profiling
    tools use visualization schemes such as graphs (e.g., annotated call graphs, data
    dependence graphs), and charts (data distribution). The output reports usually
    have explicit cross-references to the application source code in order to guide
    users and/or tools and compilers. Still, and in order to be helpful, profiling
    must be performed using representative input data.


    The information reported by the profiling process can be passed on to toolchains
    with annotations using directive-driven programming model approaches, attributes,
    compiler options, and/or more sophisticated strategies, such as the ones supported
    by LARA [14,15] (see the “LARA and Instrumentation” sidebar and Chapter 3).


    Most profiling approaches use instrumentation schemes, i.e., code is inserted
    at key points of the application code to log/monitor dynamic behavior. They usually
    use a library for instrumentation and the code inserted usually consists of calls
    to library functions. The application is then compiled and linked against the
    instrumentation library. The information is reported after and/or during the executing
    of the instrumented application. One of the problems of this approach is the impact
    of the inserted code in the applicability of compiler optimizations and thus the
    corresponding code generation effectiveness and subsequently its impact on the
    execution time. It is sometimes required to profile the same application multiple
    times with the same input data distributing the instrumentation among the different
    runs and/or to instrument only regions of code. In fact, this can be a multistage
    process as in a first run critical functions (paths and/or regions) are identified
    and then the profiling is focused on those critical functions, possibly to report
    additional and more refined information.


    # 4.4.1 INFORMATION FROM PROFILING


    At compile time, profiling can uncover some properties of the application, such
    as the number of load/store instructions, the number of branch instructions, number
    of iterations for well-structured loops, etc. Other properties can be usually
    estimated.'
