    +   4—general search algorithms such as dynamic programming and branch

    +   and bound;


    +   Definition of each design point may involve the use of specific (sequences
    of )

    +   source code transformations (see Chapter 5), as well as assigning specific
    values to

    +   application variables or even substituting a specific function/algorithm with
