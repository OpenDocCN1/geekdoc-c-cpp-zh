  md: 'power management (DPM) are techniques related to architectures and hardware
    to reduce energy/power consumption.


    Power consumption is represented in watts (W), which directly affects system heat
    (temperature) and the possible need for cooling schemes. The total power consumption
    of a CMOS integrated circuit (IC) is the sum of the static power and the dynamic
    power as represented by Eq. (2.6).


    ```

    $P = P_{static} + P_{dynamic}$ (2.6)

    ```


    Short circuits and leakage currents are responsible for power consumption even
    when transistor devices are not switching. The static power consumption ($P_{static}$)
    can be calculated by Eq. (2.7), where $V_{cc}$ represents the supply voltage (sometimes
    also represented as $V_{dd}$) and $I_{cc}$ (sometimes represents as $I_{dd}$)
    represents the overall current flowing through the device which is given by the
    sum of the leakage currents. The static power depends mainly on the area of the
    IC and can be decreased by disconnecting some parts of the circuit from the supply
    voltage and/or by reducing the supply voltage.


    ```

    $P_{static} = V_{cc} \times I_{cc}$ (2.7)

    ```


    The dynamic power ($P_{dynamic}$) consumption can be calculated by Eq. (2.8),
    where $V_{cc}$ represents the supply voltage, $\beta$ represents the activity
    factor, $C_L$ represents the load capacitance, and $f$ denotes the clock frequency
    at which the device is operating. $P_{dynamic}$ is proportional to the switching
    activity of the transistors in the IC. Thus, one way to reduce the dynamic power
    is to make regions of the IC non active and/or to reduce $V_{cc}$ and/or $f$.


    ```

    $P_{dynamic} = \beta \times C_L \times V_{cc}^2 \times f$ (2.8)

    ```


    When reducing the dynamic power by reducing the frequency and/or the supply voltage,
    it is common to attempt to reduce the value of the supply voltage as its value
    impacts in a quadratic way the dynamic power ($P_{dynamic} \propto V_{cc}^2$).
    Reducing the clock frequency clearly has a negative impact on execution time as
    the components will operate at a lower clock frequency thus translating into longer
    execution times, increased latencies, or lower throughputs. Moreover, reducing
    supply voltage may also imply a reduction of the clock frequency. Typically, the
    system provides a table of discrete values of supply voltages that they can operate
    under along with the corresponding maximum clock frequencies (known as frequency-voltage
    table). Thus, the supply voltage ($V_{cc}$) can be seen as a linear function of
    the clock frequency as depicted in Eq. (2.9) and the dynamic power consumption
    is directly proportional to the cube of the clock frequency ($P_{dynamic} \propto
    f^3$), as shown in Eq. (2.10).'
