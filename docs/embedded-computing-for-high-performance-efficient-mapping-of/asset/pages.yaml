    include packets or frames per second and samples per clock cycle.


    Scalability is also often an important design consideration as it highlights how
    the application performance changes with different dataset sizes and/or when using
    additional cores/CPUs/hardware accelerators. Scalability drives common resource
    usage analysis such as the impact of the number of threads on the application
    execution time and energy consumption, and is key to understanding the required
    level of parallelization and hardware resources to meet specific performance targets.


    In terms of raw performance metrics, the execution time of an application or task,
    designated as $T_{exec}$, is computed as the number of clock cycles the hardware
    (e.g., the CPU) takes to complete it, multiplied by the period of the operating
    clock (or divided by the clock frequency) as presented in Eq. (2.1). In most cases,
    when dealing with CPUs, the number of clock cycles measured is not the number
