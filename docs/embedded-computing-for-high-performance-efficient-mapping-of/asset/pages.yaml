    # 5.7.3 FUNCTION APPROXIMATION


    If the resultant accuracy is adequate, the use of approximate functions instead
    of exact functions may increase performance, reduce power and/or energy consumption.
    The methods used for approximate computing of functions include:


    +   • Lookup tables;

    +   • Lookup tables and interpolation, e.g., generating the table by using the
    Ramer-Douglas-Peucker algorithm ;

    +   • Lower cost functions;

    +   • Iterative methods such as Taylor''s series [17] and the Newton-Raphson method
    [18].


    Lookup tables can be an efficient scheme to substitute functions such as the trigonometric
    functions. A function can be substituted by a table with values for a number of
    input values and the values not present in the table for a given number of inputs
    can be obtained by approximating to the closest ones or by interpolating between
    the two closest points. This is an effective and efficient method, especially
    in the context of custom hardware, but does not scale for nontrivial functions
    as this table can become quite large and infeasible for applications that target
    embedded systems.


    An option to generate an approximation of a given function is to use the Ramer-Douglas-Peucker
    algorithm. This algorithm reduces the number of points in a curve by considering
    for each pair of points a line between them, and then identify a point between
    the two with the largest vertical distance to that line (this process is repeated
    a number of times while considering the addition of points under a certain maximum
    distance).'
