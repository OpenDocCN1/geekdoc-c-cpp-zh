    +   - Find the best trade-off between accuracy and other nonfunctional requirements
    by reducing computation requirements of specific calculations while meeting numerical
    accuracy requirements, for example.

    +   - Migrate (also known as offloading) sections of the code from the host CPU
    to one or more hardware accelerators (e.g., GPUs, FPGAs) to meet nonfunctional
    requirements, such as performance and energy efficiency.


    In some instances, developers may simply consider the use of a more suitable hardware
    platform, which includes microprocessors, peripherals, and accelerators with more
    powerful computing capabilities.


    # 2.2 TARGET ARCHITECTURES


    A recent trend in embedded computing platforms involves the inclusion of multiple
    computing components that are either homogeneous or heterogeneous, and are connected
    using traditional bus systems or using more advanced communication systems based
    on networking such as those found in network-on-a-chip (NoC) devices. Typically,
    these architectures include multiple distributed memories, in addition to shared
    memories, at distinct levels of the memory hierarchy and with different address
    space views.'
