    # 2.5.1 AMDAHL''S LAW


    Amdahl''s law [22, 23] states that the performance improvement of a program is
    limited by the sections that must be executed sequentially, and thus can be used
    to estimate the potential for speeding up applications using parallelization and/or
    hardware acceleration. In short, Amdahl''s law states that the speedup achieved
    by accelerating portions of an application is limited by the code sections that
    are not accelerated. More formally, the achievable performance speedup is limited
    by the fraction of the sequential (not improved) execution time of the application
    ($1 - f$) and by the actual speedup ($s$) one can achieve for the fraction remainder
    fraction $f$ of the application''s execution. This application speedup can thus
    be expressed by Eq. (2.4).


    Speedup = $\frac{1}{(1-f) + \frac{f}{s}}$ (2.4)


    This relation thus indicates that one must improve significant fractions of the
    application''s execution that represent a significant fraction of the global execution
    time if we are to attain substantial overall performance improvements. Also, this
    relation reveals that if a computation has a substantial fraction $f$ that cannot
    be (or is not) improved, that fraction $f$ limits the achievable speedup of the
    overall application. As the performance speedup $s$ of the fraction $f$ increases,
    possibly using additional resources and/or by the use of advanced compiler transformations,
    the overall application speedup will asymptotically tend to the values given by
    Eq. (2.5).


    Speedup = $\frac{1}{1-f}$ (2.5)


