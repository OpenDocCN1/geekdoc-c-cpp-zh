  md: '![](img/55beb9162c0073b3a3d7b44f1d5873e8_30_0.png)


    # FIG. 2.3 Block diagram of a typical single CPU/single core architecture extended
    with hardware accelerators.


    Fig. 2.3 presents a block diagram of an architecture consisting of a CPU (③) and
    a hardware accelerator (②). Depending on the complexity of the hardware accelerator
    and how it is connected to the CPU (e.g., tightly or loosely coupled), the hardware
    accelerator may include local memories (③ on-chip and/or external, but directly
    connected to the hardware accelerator). The presence of local memories, tightly
    coupled to the accelerator, allows local data and intermediate results to be stored,
    which is an important architectural feature for supporting data-intensive applications.


    At a programmatic level, an important aspect to consider when using hardware accelerators
    is the data movement cost between the accelerator and the host processor. Often,
    the accelerator only has control of its local storage, and data communication
    between the host processor and the accelerator is accomplished explicitly via
    data messaging. Despite its conceptual simplicity, this organization imposes a
    significant communication overhead if the CPU must be involved in transferring
    data from the main memory (⑤) to the accelerator (②). An alternative arrangement
    that incurs in a much lower communication overhead relies on the use of direct
    memory access (DMA), as the accelerator can autonomously access data in the main
    memory (⑤→②). In this case, only the data location needs to be communicated between
    the host CPU and the accelerator (①↔②). In addition, and depending on the system-level
    connectivity of the input/output devices, the hardware accelerator may be directly
    connected to input/output channels (④↔②), e.g., using FIFOs thereby bypassing
    the host CPU altogether.


    Hardware accelerators are also used in desktops and servers, and are commonly
    connected to the CPU via a PCI-express (PCIe) bus. Although PCIe provides a dedicated
    connection, it still imposes a high data transfer latency and exhibits low throughput.
    Thus, only computationally intensive regions of code where the ratio'
