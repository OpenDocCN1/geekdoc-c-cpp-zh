- pgno: 82
  md: '# 3.3 TRANSLATION, COMPILATION, AND SYNTHESIS DESIGN FLOWS


    Given a high-level description of a computation to be mapped to a hybrid software/hardware
    execution platform, designers need to master a set of tools, namely:


    +   * Compilers: These tools translate code described in a high-level imperative
    programming language, such as C, into assembly code targeting one or more cores,
    and using concurrency management primitives such as the ones offered by the OpenMP
    library (see Chapter 7). When interfacing with hardware or GPU devices, the code
    needs to include specific library and runtime environments for accessing the devices
    for data and computation synchronization.

    +   * Synthesis tools: These tools translate a description in a hardware-centric
    language such as Verilog/VHDL, describing hardware behavior at Register-Transfer
    Level (RTL), to a target-specific representation suited for the mapping to, e.g.,
    an FPGA device.


    Fig. 3.17 depicts the general organization of the tools and the overall compilation
    and synthesis flow. At the core of this mapping process there is the need to interface
    the data and the control between the generated components, namely the software
    component where the control exists in a sequential or concurrent structure, and
    is defined by the semantics of the specific concurrency execution environment
    and the target hardware devices.


    When targeting GPU devices, vendors offer libraries and interfacing environments
    that are still high level and map well to the abstractions of memory and control
    of traditional execution environments. Typically, the GPU interfaces have been
    structured around the abstraction of a coprocessor model, where input data is
    transferred to the device prior to execution followed by the corresponding transfer
    of results to the host processor address space. Vendors provide library functions
    to perform copy operations and provide compilers that translate high-level code
    to GPU assembly code. From a developer’s perspective, the intellectual effort
    includes the encapsulation of which computation needs to be captured as a “kernel”
    and how to stage the data to and from the device to maximize performance. For
    many popular computations, such as Fast Fourier Transformations (FFTs) and linear
    Algebra functions, vendors even provide libraries that facilitate the access to
    highly tuned implementations of specific functions. Overall these approaches greatly
    simplify the reasoning of the program execution and hence the development and
    verification of concurrent codes.


    Conversely, when targeting a hardware-centric device, such as an FPGA, there are
    significant differences in the compilation flow. While the data staging has been
    captured using the same approach of copying data to and from the device, the actual
    computation now requires the translation of the computation from a high-level
    programming language such as C to a hardware-oriented programming language such
    as Verilog or VHDL. Once the identification of the computation to be mapped to
    the'
