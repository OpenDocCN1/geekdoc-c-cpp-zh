  img_proc: true
- pgno: 68
  md: 'common for designers in this case to settle for the worst-case execution time
    scenarios, which often leads to an increase in resource usage and to suboptimal
    energy-wise design solutions.


    Most of the complexity in designing these systems stems from the fact that it
    is extremely hard to trace the original project design goals, such as overall
    energy or timing requirements, to individual design components. As it is common
    in many areas of engineering, designers organize their solutions into a hierarchy
    of logically related modules. Tracing and propagating down these requirements
    across the boundaries of the hierarchy is extremely complex as multiple solutions
    may exhibit feasible individual design points but when put together, the combined
    design may not meet its requirements. Thus, exposing requirements at a higher
    design level and allowing a tool to understand how these requirements can be translated
    up and down the module hierarchy is a critical aspect of modern high-performance
    embedded systems design.


    In the remainder of this chapter, we address this need using a series of design
    specifications and examples assuming that readers are familiar with imperative
    programming languages such as C and MATLAB.


    # 3.2 SPECIFICATIONS IN MATLAB AND C: PROTOTYPING AND DEVELOPMENT


    The language used to program an application, a model, an algorithm, or a prototype
    greatly influences the effort required to efficiently map them to the target computing
    system. High-level abstraction languages typically promote design productivity
    while also increasing the number of mapping solutions of the resulting designs
    without requiring complex code restructuring/refactoring techniques. In the following
    sections, we use MATLAB [1] and C [4] programming languages to describe the prototyping
    and the programming development stages.


    # 3.2.1 ABSTRACTION LEVELS


    Programming languages such as C are usually considered low level as algorithms
    are implemented using constructs and primitives closer to the target processor
    instructions, since most operations, such as arithmetic, logic, and memory accesses,
    are directly supported by the microprocessor instruction set. For instance, if
    a low-level programming language does not directly support matrix multiplication
    or sort operations (either natively or through a library), developers are forced
    to provide their own implementations using low-level operations. Such low-level
    implementations can constrain the translation and mapping process of the computation
    defined at this level of abstraction, since the compiler is naturally limited
    to a narrow translation and mapping path, leaving relatively little room for high-level
    optimizations.


    Alternatively, developers may use programming languages with higher levels of
    abstraction which natively support high-level operations such as matrix'
