  md: '![](img/55beb9162c0073b3a3d7b44f1d5873e8_43_0.png)


    FIG. 2.15 Simplified block diagram of a typical reconfigurable fabric.


    Fig. 2.15 illustrates the organization of a typical reconfigurable fabric. It
    consists of configurable logic blocks (CLBs), input/output blocks (IOBs), digital
    signal processing (DSP) components, block RAMs (BRAMs), and interconnect resources
    (including switch boxes). The extreme flexibility of configurable (and reconfigurable)
    fabric lies in the ability to use its components to build customized hardware,
    including customizable memories (e.g., both in terms of number of ports and size),
    customizable datapaths, and control units. With such configurable fabric, developers
    can thus implement hardware designs that match the characteristics of the computations
    at hand rather than reorganizing the software code of their application to suit
    a specific computing architecture. The on-chip memory components (BRAMs or distributed
    memories) can be grouped to implement large memories and/or memories with more
    access ports than the two access ports provided by default. This is an important
    feature as memory components can be customized as needed by the application.


    More specifically, reconfigurable architectures allow hardware customization by
    providing hardware structures to implement functions with an arbitrary number
    of input bits; bit-level registers; bit-level interconnect resources; resource
    configuration to support shift registers, FIFOs, and distributed memories; and
    high-performance built-in arithmetic and memory components that can be configured,
    for instance, to implement mathematical expressions (e.g., similarly to FMA units)
    and to support local storage.'
