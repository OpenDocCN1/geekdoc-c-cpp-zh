  md: 'The concept behind lower cost functions is a generalization of strength reduction
    extended to functions. The basic idea is to replace the intended function with
    a simpler implementation performing algebraic simplifications or taking advantage
    of symmetry properties. In some contexts, and for regions of the function''s domain
    one can approximate the function by a linear function, thus substantially simplifying
    its evaluation. Truncation of the function''s Taylor series, as described next,
    is a popular implementation of this technique.


    Approximation using Taylor''s series is one of the methods used to implement many
    of the computationally expensive trigonometric functions such as "sin," "cos,"
    "tan," and "arctan." The "sin" function can be implemented with:


    ```

    sin(x) = x - x³/3! + x⁵/5! - x⁷/7! + ...

    ```


    The more terms are used, the more accurate the "sin" function evaluation is. If
    acceptable, one might only use a small number of terms, thus resulting in a lower
    cost approximation function.


    One of the most used methods to calculate the square root of a number is the Newton-Raphson
    method (also known as Newton''s method). Using the Newton-Raphson method, the
    square root of x, √x, can be calculated iteratively using:


    ```

    yₙ₊₁ = ½ (yₙ + x/yₙ)

    ```


    The method starts with y₀, a first approximation to √x. Increasing the number
    of iterations increases the accuracy of the result.


    Another example of the use of the Newton''s method is the calculation of the inverse
    square root: 1/√x. The iterative calculation is managed by the following equation:


    ```

    yₙ₊₁ = ½ yₙ (3 - x * yₙ²)

    ```


    An implementation of the inverse square root using the Newton''s method is presented
    in Fig. 5.9, which only needs a single iteration to produce acceptable accuracy
    for many problems (this version considers single precision input/output, but a
    double precision version mainly differs on the data types and on the constant
    value used to calculate the first estimation). The main improvement of this implementation
    in comparison to a typical one using the Newton''s method is the efficiency of
    the scheme to calculate a first estimation close enough to the solution (it uses
    a number usually referred in this context as the "magic number").


    With the inverse square root one can obtain the square root: sqrt(x) = x * invsqrt(x).
    This approach was mostly used in computer games, but it is less prevalent in'
