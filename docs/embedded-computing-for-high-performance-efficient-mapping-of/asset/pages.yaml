- pgno: 197
  md: 'Other widely used approaches to assist code retargeting include: compiler auto-vectorization
    (in the context of CPU SIMD units), OpenMP (in the context of parallelization
    using shared memory architectures), OpenCL (in the context of CPUs, GPUs, and
    FPGAs), MPI (in the context of distributed memory architectures), and High-Level
    Synthesis (HLS) tools to translate C programs to reconfigurable hardware provided
    by FPGAs.


    Table 6.1 summarizes these approaches and the retargeting mechanisms used by each
    of them: the auto-vectorization process is mainly driven by code transformations—manual
    or automatic—to infer CPU vector instructions; OpenMP requires code annotations
    and library calls to parallelize code targeting multicore/processor systems with
    shared memory, and with the latest OpenMP specification the support for vectorization;
    MPI requires library calls to query the environment and trigger communication
    between nodes, and code must be restructured to support the MPI model; OpenCL
    requires modifying the host code to query the platform and configure the devices
    for execution and translating hotspots into OpenCL kernels; HLS requires the use
    of directives and code transformations to make the source code more amenable to
    FPGA acceleration by the HLS tool, and the host code must be modified to interface
    to the hardware accelerator.


    # Table 6.1 Retargeting mechanisms and approaches


    | | Auto-vectorization | OpenMP | MPI | OpenCL | HLS |

    |---|---|---|---|---|---|

    | Compiler options | Yes | Yes | No | No | Yes |

    | Code transformations | Yes | Yes | Yes | Yes | Yes |

    | Code annotations | Yes | Yes | No | No | Yes |

    | Libraries | No | Yes | Yes | Yes | Yes |

    | DSL | No | No | No | Yes | No |

    | Targets | CPU with vector instructions | CPU with multiple cores (shared mem)<br>CPU
    with vector instructions (OpenMP 4.0) | CPU with multiple cores/processors (distributed
    mem)<br>large-scale distributed systems | CPU<br>GPU<br>FPGA | FPGA |

    | Ref. section | 6.4 | 6.5 | 6.6 | 7.4 | 7.5 |'
