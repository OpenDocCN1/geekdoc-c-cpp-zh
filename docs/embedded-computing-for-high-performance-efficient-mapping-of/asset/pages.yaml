    # 4.7 FURTHER READING


    In this chapter, we focused on the analysis of the application source code and
    on properties and metrics that can be used in order to help developers to understand
    the code of, e.g., the application hotspots. We have also introduced custom profiling
    techniques and the use of monitoring which have been extensively researched in
    the scholarly literature. Complementary to the profiling examples presented in
    the chapter, there are other profiling techniques such as path profiling [20]
    and vertical profiling [21] that enable developers to better understand runtime
    behavior. Profiling can provide important information to developers and tools
    by, e.g., capturing: (1) the branch frequency of executed paths in if-then-else
    constructs; (2) invariant argument values in specific function calls which enable
    distinct specializations for the same function, and (3) data ranges and numerical
    accuracies of variables to guide word length optimizations. Moreover, code instrumentation
    is becoming increasingly important not only to detect faults/bugs, but also to
    acquire runtime information to guide tools to compile to hardware [22], to GPUs
    [17], and to multicore-based systems [23]. One example is the instrumentation-based
    data dependence profiling approach used to guide speculative optimizations. Another
    example is the use of instrumentation to help identify and/or suggest regions
    of code to parallelize [16,23]. Although the instrumentation strategies employed
    are commonly dependent on specific tools and are limited in terms of scope and
    flexibility, these approaches provide mechanisms for extracting relevant runtime
    information.


