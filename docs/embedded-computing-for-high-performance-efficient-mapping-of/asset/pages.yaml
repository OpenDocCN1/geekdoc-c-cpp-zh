  md: '**Data locality.** Given that modern-day platforms contain several types of
    memory storage units, with different sizes, speeds, and access models (shared
    or distributed), it is important to improve data locality, such that compute units
    can access data as fast as they can process them. This means making effective
    use of multilevel cache systems (Section 6.7) and using local device memories
    to store intermediate results for hardware accelerators working as coprocessors.
    Other techniques to improve data locality include software data prefetching, which
    are used to mitigate the long latency of memory accesses either from main storage
    or from upper levels of the cache hierarchy and thus reduce the stall cycles in
    the execution pipeline of modern processors. The basic idea behind prefetching
    is to load data in advance to hide the latency of memory accesses, hence making
    data already available when the computation needs it. If the hardware supports
    prefetching instructions and buffers, compilers can exploit them by judiciously
    placing prefetching instructions in the code. When data locality is not optimized,
    there is a risk of increasing the amount of data movement (e.g., due to cache
    misses or having superfluous transfers between CPU and hardware accelerators),
    which leads to lower operational intensity and designs becoming memory (or I/O)
    bound, as is the case of implementation X shown in Fig. 7.1.


    **Heterogeneous computation.** General-purpose processors are flexible enough
    to execute most workloads. However, this flexibility comes at the price of having
    a relatively low performance ceiling. Consequently, even implementations with
    a lower computational intensity may quickly hit the platform’s performance ceiling
    (see dashed line on implementation Y shown in Fig. 7.1). To further increase the
    height of the performance ceiling, developers need to exploit the platform’s specialized
    features. The key idea is to map a given workload (or selected parts of this workload)
    to specialized processing units, including: (i) packing scalar instructions into
    vector instructions to perform more operations in parallel (Section 6.4); (ii)
    running a kernel in parallel over multiple data points on a GPU (Section 7.4);
    (iii) streaming data across a customized pipelined data path architecture on an
    FPGA (Section 7.5). Such mapping requires a deep understanding of the architectural
    features of the compute devices (CPU, GPU, FPGA) and the type of workload amenable
    to run on such devices. This effort allows the peak performance to increase, typically
    between 1 and 2 orders of magnitude, over a general-purpose processor.


    **Multicore and multiprocessors.** With today’s platforms consisting of multicore
    CPU machines with computation capacities that can be extended by connecting several
    machines together with fast network interconnects, there is the potential to run
    very large computational intensive workloads. Such workloads can be partitioned
    within the cores and processors of each machine (Section 6.5) and across available
    machines (Section 6.6), such that each compute unit operates at its peak computational
    throughput. The process of partitioning and mapping workload can be done statically
    if all parameters (e.g., workload type and size) are known at compile time, or
    otherwise decided dynamically by the platform’s runtime system.'
