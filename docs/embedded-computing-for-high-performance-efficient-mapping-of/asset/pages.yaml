  md: '# 7.3 WORKLOAD DISTRIBUTION


    As discussed in the previous section, it is important to understand both the nature
    of the application and the features of the underlying platform to derive an efficient
    mapping between them. This is particularly critical, as platforms are becoming
    more heterogeneous, allowing various types of hardware accelerators to assist
    in speeding up computations running on the host processor. Hence, we need to understand
    in what conditions should we offload computations to these devices and what factors
    affect overall performance. This is the subject of this section.


    When computations are offloaded to an accelerator, there is a cost overhead that
    is absent when the entire computation is carried out by the host processor, namely:


    +   1. Data transfer to and from the host to the accelerator’s storage or address
    space.

    +   2. Synchronization to initiate and terminate the computation by the accelerator.


    Given the current system-level organization of most computing systems, data needs
    to be physically copied between storage devices often via a bus. This has been
    traditionally the major source of overhead when dealing with accelerators. Furthermore,
    the host needs to actively engage in polling to observe the termination of the
    computations on the accelerators, thus synchronization also incurs an overhead,
    which is typically proportional to the number of tasks to be offloaded to the
    accelerators.


    Hence, in cases where the host and the accelerators execute in sequence (i.e.,
    the host blocks until the accelerator terminates execution), it is only profitable
    to offload kernels to accelerators if they exhibit a very high operational intensity
    (the ratio of computation to data used—see previous section). Furthermore, for
    offloading to be profitable, the accelerator methods to execute the computation
    considerably faster than the host to offset the aforementioned overheads.


    To measure the benefits of offloading, we need to first select one or more metrics
    of performance, such as execution time and energy consumption. Typically, developers
    compare the execution time of a kernel running on the host for each relevant problem
    of size $n$, i.e., $T_{host}(n)$, against the time it takes to perform the same
    computation using an accelerator, say $T_{comp}(n)$.


    Note that the execution time (or another metric such as energy) can depend non-linearly
    on the problem size. For linear algebra operations, such as matrix-matrix multiplications,
    simple algorithms can be described as having a computational complexity that increases
    with the cube of the input matrix dimension size $n$ (the *number of columns or
    rows for squared matrices*), i.e., the computation time on the host can be modeled
    as $T_{host}^{comp}(n) = \alpha_0 n^3 + \beta_0$ for a square matrix with dimension
    size $n$. For other computations, the complexity might be quadratic as in $T_{host}^{comp}(n)
    = \alpha_0 n^2 + \beta_0$.


    When the same computation is executed on an accelerator, while the complexity
    may not change, the values of the coefficients $\alpha_0$ and $\beta_0$ may be
    different due to other sources of overhead, namely, data transfer cost.


    To assess the benefits and hence to aid in deciding whether to offload computations,
    programmers can build execution models for the host and for the accelerator,'
