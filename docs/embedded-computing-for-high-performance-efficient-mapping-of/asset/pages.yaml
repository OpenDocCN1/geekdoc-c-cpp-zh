- pgno: 88
  md: 'The task mapping process needs to find a configuration that minimizes the overall
    cost to meet a given performance goal:

    min \sum_{task \in App} cost(PE_{task}, task)

    where PE_{task} corresponds to the processing element onto each task of the application
    (App) is mapped for a particular configuration. The initial configuration, which
    serves as the baseline partitioning, places all tasks in the CPU. At each subsequent
    mapping step, the mapping algorithm tries to find a better mapping configuration
    by mapping one or more tasks from one processor to another, such that the overall
    cost is lower than the cost of the previous configuration. Another challenge for
    the optimization process is to find a set of feasible mapping configurations,
    since not all configurations are valid. For instance, in our previous example,
    tasks a and b cannot be mapped to two distinct hardware accelerators, as in our
    target architecture, hardware accelerators cannot communicate directly with each
    other. For the same reason, if task b cannot be mapped to a hardware accelerator,
    then task a, which invokes task b, must also be mapped to the CPU. Hence, a search
    optimization algorithm, such as simulated annealing, can be associated with a
    constraint solver to find candidate mapping solutions. Also note that the cost
    estimation function must take into account not only the computation cost of migrating
    a task to a hardware accelerator, but also the communication overhead between
    the CPU and the hardware accelerator. Fig. 3.21 depicts a mapping solution for
    the previous example, where tasks a, b, c, and d2 are mapped to hardware accelerator
    #1 and the remaining tasks to the CPU.


    # 3.4.2 DYNAMIC PARTITIONING


    The underlying assumption of static hardware/software partitioning is that the
    mapping solution derived at compile time is resilient to changing runtime conditions.
    This may not be true for all classes of applications. Consider the AdPredictor
    machine learning algorithm [34] used to rank web execution for the Bing search
    engine, so that only ads with the highest probability of being clicked are presented.


    ![](img/55beb9162c0073b3a3d7b44f1d5873e8_88_0.png)


    FIG. 3.21 Hardware/software partitioning solution.'
