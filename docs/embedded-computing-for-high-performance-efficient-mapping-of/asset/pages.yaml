    parallelism can be enabled in two ways, namely, by invoking the library routine
    `omp_set_nested()` (as shown in the following code example) or by setting the
    `OMP_NESTED` environment variable. If nested parallelism is enabled, when a thread
    within a parallel region encounters a new `omp parallel` pragma statement, an
    additional team of threads is spawned, and the original thread becomes its master.
    If nested parallelism is disabled, then a thread inside a parallel region ignores
    any parallel pragma construct it encounters. It is important to understand the
    impact of nesting parallel regions, since they can quickly spawn a large number
    of threads. In general, nested parallelism incurs a larger overhead than using
    a single parallel region. Yet, they can be useful in execution scenarios with
    load unbalanced problems, and where one code region can be further parallelized.


