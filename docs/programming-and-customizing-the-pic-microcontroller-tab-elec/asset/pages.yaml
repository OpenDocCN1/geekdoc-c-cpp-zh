    970 APPENDIX A


    The C Programming Language, 2nd ed. (1988)

    Authors: B. W. Kernighan and D M. Ritchie

    ISBN: 0-13110-362-8


    Brian W. Kernighan and Dennis M. Ritchie''s classic text explaining the C programming
    language has not of its usefulness seen by more students in colleges and universities
    than any other. Despite the fact that the book was written originally for a programming
    course, the writing is crisp, sharp, and easily understandable. It is a book that
    I''ve probably owned five copies of, with couple being worn out and a growing
    legs and walking out of my office.


    # # Recommended PIC

    Microcontroller Websites


    When I have a problem, here is a list of sites that I turn in an attempt to find
    the answers to what other people have done. Most of these are dedicated to the
    PIC16F84 (and the PIC16C84), but there is also a list of useful information, code,
    and circuits that you can get from these sites. This list is still current, although
    it is changing all the time.


    As I write, there is somewhere in the neighborhood of 1,000 web pages devoted
    to the PIC microcontroller with different applications, code snippets, code development
    tools, programmers, and other miscellaneous information on the PIC microcontroller
    and other microcontrollers. To simplify your searching, I have included websites
    that have either unique information and applications or have substantial links
    to other sites.


    My own website has links and information on not only the PIC microcontroller but
    other devices and subjects as well:


    www.myke.com


    Bob Blick''s website has some interesting PIC microcontroller projects that are
    quite a bit different from the run-of-the-mill projects:


    www.boblick.com/


    Scott Dattallo''s highly optimized PIC microcontroller does math algorithms. This
    is best place to go if you are looking for mathematical functions for the PIC
    microcontroller:


    www.dattalo.com/technical/software/software.html


    Along with the very fast PIC microcontroller routines, Scott also has been working
    on some GNU general purpose license tools designed to run under Linux. More information
    on these tools can be downloaded from


    www.dattalo.com/gnupic/gpsim.html


    www.dattalo.com/gnupic/gpasm.html'
