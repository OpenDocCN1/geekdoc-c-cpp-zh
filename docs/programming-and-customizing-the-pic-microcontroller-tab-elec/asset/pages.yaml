- img_proc: true
  md: 'RESOURCES 971


    Marco Di Leo''s PIC Corner has some interesting applications, including information
    on networking microcontrollers and using them for cryptography:


    http://members.tripod.com/~mdileo/


    On the Dontronics home page, Don McKenzie presents a wealth of information on
    the PIC microcontroller, as well as other electronic products. There are lots
    of useful links to other sites, and it is the home of the SimmStick:


    www.dontronics.com/


    On the Fast Forward Engineering home page, Andrew Warren presents useful information
    and a highly useful question and answer page on the PIC microcontroller:


    http://home.netcom.com/~fastwd/


    Steve Lawther''s list of PIC microcontrollers has many interesting PIC microcontroller
    (and other microcontroller) projects:


    http://www.worldcompuser.com/homepages/steve_lawther/ucindex.htm


    Eric Smith''s PIC Page has some interesting projects and code examples to work
    through:


    www.brouhaha.com/~eric/pic/


    Rickard''s PIC-Wall is a good site with a design for a PIC microcontroller–based
    composite video game generator:


    www.efd.lth.se/~e9gr/pic.html


    PicPoint has lots of good projects to choose from, including 5 MB free to anyone
    that wants to start his or own PIC microcontroller webpage:


    www.picpoint.com/


    MicroTronics presents programmer and application reviews:


    www.eedevl.com/index.html


    # Periodicals


    Here are a number of magazines that give a lot of information and projects on
    PIC microcontrollers. Every month, each magazine has a better than 50% chance
    of presenting a PIC microcontroller application.'
