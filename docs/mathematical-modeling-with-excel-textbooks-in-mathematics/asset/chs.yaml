  \ 6.8.3\n在本练习中，我们将通过图形化验证用于生成三角形分布随机变量 `X` 数值的 Excel 公式确实是有效的。\n\n1.  根据参数 `a =\
  \ 3`、`m = 5.25` 和 `b = 9` 生成 500 个任务持续时间的值。允许用户更改这些参数。\n2.  为 a 部分的值创建直方图。直方图的形状是否类似于三角形分布密度曲线的图？尝试参数的其他值。\n\
