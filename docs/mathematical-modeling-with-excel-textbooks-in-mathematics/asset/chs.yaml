  为了对示例 2.3.3 中的空气阻力进行建模，我们假设该力与速度成正比。简要说明你可能如何收集数据并利用这些数据来判断这一假设是否合理。\n\n## 2.4 用解析法拟合直线\n\
  \n正如我们所看到的，利用比例关系进行建模通常需要我们对一组数据拟合一条直线。在之前的章节中，我们使用了图表法，这种方法可能相当主观。在本节中，我们将研究“最佳拟合”直线的不同定义，并根据数据点的\
  \ `x` 坐标和 `y` 坐标求出最佳拟合直线斜率和 `y` 截距的公式。这将为拟合直线提供一种客观的方法。\n\n第一步是为拟合效果良好的直线定义标准。图\
  \ 2.14 中左图中的直线比右图中的直线“更好”地拟合数据。这两条线之间有什么区别呢？回答这个问题的方法可能有很多种。\n\n![fig2_14.jpg](img/fig2_14.jpg)\n\
  \n图 2.14\n\n我们看到，在右图中，直线非常靠近最右侧的点，但比左图中的直线距离另外两个点更远。我们可以说，左图中的直线总体上比右图中的直线更靠近数据点。最小化直线与点之间距离的思想将形成最佳拟合直线定义的基础。\n\
  \n这些距离（也称为`误差`）在图 2.15 中用虚线表示。如果点的坐标由下列给出\n\n(`x`[`i`]`, `y`[`i`]) 对于 `i` = 1, 2,\
  \ …, `n`\n\n且直线由函数 `f`(`x`) = `mx` + `b` 描述，那么距离的值为\n\n|`y`[`i`]` − `f`(`x`[`i``))|\
  \ 对于 `i` = 1, 2, …, `n`。\n\n定义最佳拟合直线如何最小化这些距离的方法有很多。其中一种名为`切比雪夫`标准（Chebyshev’s criterion）的方法基于这样的思想：最佳拟合直线应该使这些距离中的最大值尽可能小。用更技术术语来说，该标准规定给出最佳拟合直线的函数\
  \ `f`(`x`) = `mx` + `b` 是使下面数值最小的\n\n`C` = {|`y`[`i`] − `f`(`x``i``)| : `i` = 1,\
  \ 2, …, `n`}的最大值。\n\n我们的目标是找到斜率 `m` 和 `y` 截距 `b` 的公式。由于我们要最小化某个值，可能会考虑使用导数。切比雪夫标准逻辑上是合理的，但并不明显如何求导或如何利用它来寻找\
  \ `m` 和 `b` 的简单公式。\n\n![fig2_15.jpg\n\n图 2.15\n\n另一个标准基于这样的思想：最佳拟合直线应该最小化距离之和。在数学符号中，`f`(`x`)\
  \ = `mx` + `b` 应该最小化数值\n\n$$A = \\sum\\limits_{i = 1}^{n}\\left| {y_{i} - f(x_{i})}\
  \ \\right|.$$\n\n这个标准也非常合逻辑，但绝对值使得导数的计算变得困难。为了使导数更简单，我们可能会考虑完全放弃求和式中的绝对值，并增加一个和必须为非负的标准。然而，这会导致求和中的某些项变为正，另一些项变为负。因此，可能会有一些巨大的正值抵消掉一些巨大的负值，导致一个较小的和，但最广泛使用的标准被称为`最小二法`（least-squares），它使用平方而非绝对值来使所有项变为正。在数学符号中，该标准规定函数\
  \ `f`(`x`) = `mx` + `b` 应该最小化数值\n\n$$S = \\sum\\limits_{i = 1}^{n}\\left( {y_{i}\
  \ - f(x_{i})} \\right)^{2}.$$\n\n这个数值被称为*平方和*（sum of squares）。\n\n### 示例 2.4.1（说明最小二法）\n\
  \n为了说明寻找直线的思想以及这在最小二法方面的意义，请考虑图 2.16 中的数据。\n\n1.  将一个空白工作表重命名为“**最小二法**”，并将其格式化为图\
  \ 2.16。\n2.  使用 **A** 和 **B** 中的数据创建散点图。注意图 2.17 中的直线拟合了数据。\n3.  添加一个滚动条，将**最小**和**最大**设置为\
  \ 0 和 1000，并将**链接单元**设置为 **B**。（有关添加滚动条的更多信息请参见附录 A。）\n4.  使用滚动条改变 `m` 的值。观察当直线在图形上越拟合数据时，平方和越小。当\
  \ `m` = 0.634 时，平方和取得最小值 3.4993。因此，当截距 `b` = 2 时，我们说最佳拟合直线的斜率为 `m` = 0.634。\n\n\
  在示例 2.4.1 中，我们可能通过调整 `b` 的值来获得拟合效果更好的直线（即获得更小的平方和）。但如果我们调整了 *b*，那么就需要调整 *m* 的值。这可能会变得相当复杂。因此，我们使用微积分根据数据值找到\
  \ `m` 和 `b` 的公式，以最小化平方和。\n\n我们想要找到使下面数值最小的 `m` 和 `b`：\n\n$$S = \\sum\\limits_{i\
  \ = 1}^{n}\\left( {y_{i} - f(x_{i})} \\right)^{2} = \\sum\\limits_{i = 1}^{n}\\\
  left( {y_{i} - mx_{i} - b} \\right)^{2}.$$\n\n注意 *S* 实际上是变量 *m* 和 *b* 的函数。最优性的必要条件是相对于这些这些变量的偏导数为零。这给出了方程\n\
  \n\n\n\n\n$$\\begin{matrix} \\frac{\\partial S}{\\partial m} & {= \\sum{2\\left(\
  \ {y_{i} - mx_{i} - b} \\right)( - x_{i})} = - 2\\sum{\\left( {y_{i} - mx_{i} -\
  \ b} \\right)x_{i}} = 0} \\end{matrix}$$ (2.5)\n\n$$\\begin{matrix} \\frac{\\partial\
  \ S}{\\partial b} & {= \\sum{2\\left( {y_{i} - mx_{i} - b} \\right)( - 1)} = - 2\\\
  sum\\left( {y_{i} - mx_{i} - b} \\right) = 0} \\end{matrix}$$ (2.6)\n\n其中所有求和项从\
  \ 1 到 *n*。重写这些方程并解出 *m* 和 *b* 得到公式：\n\n$$m = \\frac{n\\sum{x_{i}y_{i}} - \\sum x_{i}\\\
  sum y_{i}}{n\\sum x_{i}^{2} - \\left( {\\sum x_{i}} \\right)^{2}}\\mspace{22mu}\\\
  text{and}\\mspace{22mu} b = \\overline{y} - m\\overline{x}$$ (2.7)\n\n其中 $\\overline{x}\
  \ = \\sum x/n$ 和 $\\overline{y} = \\sum y/n$ 分别是 *x*-值和 *y*-值的平均值。用这些公式计算出的斜率和 *y*-截距的直线被称为*最小二法回归线*。\n\
  \n### 例 2.4.2（计算最小二法回归线）\n\n实现公式 (2.7) 相对容易。将图 2.20 中的公式添加到 `Least-Squares` 工作表中。\n\
  \n![fig2_20.jpg](img/fig2_20.jpg)\n\n图 2.20\n\n这些公式给出了 *m* ≈ 0.694 和 *b* ≈ 1.689，因此最小二法回归线为\
  \ *y* = 0.694*x* + 1.689。我们将单元格 `B10` 和 `B11` 中的值分别更改为 0.694 和 1.689，就可以看到平方和约为\
  \ 3.3699。这个值比例 2.4.1 中找到的值小得多，这说明最小二法回归线最小化了平方和。\n\n公式 (2.7) 也内置在 Excel 中。要实现这些公式，请添加图\
  \ 2.21 中的公式。注意，这些内置公式提供的 *m* 和 *b* 值与公式 (2.7) 相同。\n\n![fig2_21.jpg](img/fig2_21.jpg)\n\
  \n图 2.21\n\n还有另一种使用内置公式计算最小二法回归线的方法。在例 2.4.1 第一步创建的数据散点图上，右键点击其中一个数据点并选择`添加趋势线…`。在`趋势/回归类型`下选择`线性`。勾选`在图上显示方程`旁边的复框并按`关闭`。图形应与图\
  \ 2.22 相似。□\n\n![fig2_22.jpg](img/fig2_22.jpg)\n\n图 2.22\n\n### 练习\n\n**2.4.1**\
