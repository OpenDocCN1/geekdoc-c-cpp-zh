  \ = 3.77（液体 1 为咖啡，液体 2 为牛奶）。\n\n1. 确定两种方案在时间 `t` = 10 时咖啡/牛奶混合物的温度。\n2. 两种方案之间有很大差异吗？\n\
  3. 研究系统对参数 `m`[2] 的敏感性。描述你的观察结果。\n\n### 5.3 混合问题\n导数 `dy`/`dt` 描述数量 `y`(*t*) 的变化率。在某些情况下，一个数量被一个因素增加并被另一个因素减少。在这些情况下，我们可以使用以下原理描述总变化率：\n\
  \n总变化率 = 增加率 — 减少率。\n\n作为该原理的应用，考虑一个含有 50 加仑溶液的储箱，溶液由 90% 的水和 10% 的酒精组成。含有 50% 酒精的溶液以每分钟\
  \ 2 加仑的速度加入储箱。同时，溶液以每分钟 3 加仑的速度从储箱中排出。这种情况如图图 5.14\n\n图 5.14\n\n让 `y`(*t*) 表示时间\
  \ `t` 分储箱中纯酒精的加仑。加入储箱的溶液增加了 `y` 的值，从储箱中排出的溶液减少了 `y` 的值。上述原理给出了以下通用微分方程模型：\n\n$$\\\
  begin{matrix} \\frac{dy}{dt} & {= \\text{酒精的变化率（单位：加仑酒精/分钟）}} \\\\ & {= {\\text{流入率\
  \ - 流出率}}} \\end{matrix}$$\n\n现在我们需要对流入率和流出率建模。流入建模相对容易。以每分钟 2 加仑的恒速率向储箱加入 50% 的酒精溶液。因此，\n\
  \n$$\\text{Rate in} = \\left( \\frac{0.5 gal alcohol}}{\\text{1 gal solution}} \\\
  right)\\left( \\text{2 gal/min} \\right)$$\n\n流出建模稍微复杂一点，因为储箱中溶液的比例正在变化。注意储箱中溶液的体积正在减少。因此，储箱中的酒精量为：\n\
  \n$$\\text{Rate out} = \\left( \\frac{0.5\\text{ gal alcohol}}{\\text{1 gal solution}}\
  \ \\right)\\left( \\text{3 gal/min} \\right)$$\n\n\n\n\n\n$$\\frac{dy}{dt} = 1 \\\
  cdot 0.5 - \\left( \\begin{array}{l} {0{\\,\\text{如果阀门关闭}}} \\\\ {2{\\,\\text{如果阀门开启}}}\
  \ \\end{array} \\right)\\left( \\frac{y}{\\text{罐中溶液的体积}} \\right).$$\n\n为了近似该微分方程的解曲线，将一个空白工作表命名为“带阀门的箱”（Tank\
  \ with Valve），并按照图 5.18\n\n图 5.18\n\n![fig5_19.jpg](img/fig5_19.jpg)\n\n图 5.19\n\
  \n`B` 列中的公式将时间向下取整到最近的整数，计算该取整时间对 2 取模，如果结果为 0 则返回 1（意味着阀门开启），否则返回 0。`A` 列中的 `ROUND`\
  \ 函数将时间保留到小数点后。这是必要的，因为当 Excel 重复相加数字时（如在每一步中向时间加上 `h`），它会引入一个隐藏的“舍入”误差。因此，当时间本应该是一个整数时，Excel\
  \ 认为它不是整数。`ROUND` 函数纠正了这一错误。\n\n注意，罐中酒精的体积最初增加，但随后开始波动。浓度最初增加，然后在 0.5 附近趋于平稳。这是我们预期的，因为流入罐的溶液浓度为\
  \ 0.5。从图表和数值结果可以看出，在时间大约为 7 分钟时，浓度为 0.4。□\n\n### 练习题\n\n**方向**：使用欧拉法求解以下问题。选择一个\
