  ### 定义 4.2.3 (排斥与吸引平衡)\n\n如果存在一个数字 `ε`，使得当某个 `n` 的 `|a[0] - a| < ε` 时 `|a[n] - a|\
  \ > ε`，则平衡值 `a` 是*不稳定的*或*排斥的*。如果存在一个数字 `ε`，使得：\n\n$$\\lim\\limits_{n\\rightarrow\\\
  infty}a_{n} = a\\quad\\text{只要}\\quad\\left| {a_{0} - a} \\right| < \\varepsilon$$\n\
  \n则平衡 `a` 是*稳定的*或*吸引的*。\n\n用通俗的话说，如果系统从其附近开始但并没有靠近它，则平衡值 `a` 是排斥的。这正是我们在示例 4.2.2\
  \ 中看到的。如果系统从 `a` 附近开始并趋向于它，则该平衡是吸引的。\n\n### 示例 4.2.3 (血液中的抗生素)\n\n一个婴儿被给予抗生素来治疗耳朵炎。在服用抗生素时，保持血液中药物量的相对恒非常重要。如果浓度太低，细菌可能会开始重新生长；如果浓度太高，可能会导致并发症。\n\
