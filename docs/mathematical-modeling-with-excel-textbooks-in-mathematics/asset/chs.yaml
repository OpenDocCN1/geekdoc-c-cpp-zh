  \n**8.6.12** 资源约束的拉格朗日乘数值告诉我们，如果相应资源的数量增加微小量，目标函数将大约增加多少。在具有两个或多个资源约束的问题中，每个约束都有一个拉格朗日乘数，它告诉我们，在保持其他资源不变的情况下，如果相应资源增加微小量，目标函数将大约增加多少。作为这一想法的应用，考虑以下问题：水果部门的经理正试图决定制作多少种不同的果篮以实现利润最大化。她只剩下\
