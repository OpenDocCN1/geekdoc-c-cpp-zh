  \ 越南: 1968 | 6 | |\n\n### 示例 5.7.1（应用于越南战争）\n1968 年春天，大约有 1,680,000 名美军正规军和 280,000\
  \ 名由北越和越共领导的游击队。这意味着正规军与游击队的比例大约为 1,680,000/280,000 = 6（即 `n` ≈ 6）。这段时间，美军指挥官威斯特兰请求增援\
