  \n2. 使用数据表存储来自 100 个不同 `x[0]` 值的梯度法结果。然后显示其中最佳的一个。\n\n3. 数据表在寻找全局最小值方面的效果如何？\n\n\
  ### 8.4.4 梯度法\n梯度法需要对目标函数的导数有了解。在示例 8.4.2 中，我们使用导数求法规则找到 `f′(x)`，然后用此来计算 `f′ (x[k])`。这种方法并不总是完全可行，因为它要求用户首先找到\
  \ `f′(x)`，这可能非常困难。数值上近似 `f′(x[k])` 的方法之一是使用割线。具体来说，我们选择一个较小值 `d`，然后计算\n\n$$f'\\\
  left( x_{k} \\right) \\approx \\frac{f\\left( x_{k} + d \\right) - f\\left( x_{k}\
  \ \\right)}{d}.$$\n\n1. 在 `1-Dim` 工作表中，将 `f′(x[k])` 的公式替换为这种近似 `f′(x[k])` 的方法。初始使用\
  \ `d = 0.01`，但允许用户指定 `d` 的值。\n\n2. 尝试 0 到 4 之间的随机值 `x[0]`。将这些结果与原始结果进行比较。\n\n3.\
  \ 尝试不同的 `d` 值。`d` 的值会影响结果吗？\n\n### 8.4.5 硫酸生产\n一家化工公司以每单位 100 美元的价格出售硫酸。`x` 单位的每日总成本（美元）为：\n\
  \n`C(x) = 100000 + 50x + 0.0025x²`，\n\n且每日产量最多为 7000 单位。\n\n1. 假设公司销售所有生产的产品，制造商应该生产多少单位硫酸以使每日利润最大化？使用\
  \ `Solver` 求解此问题。\n\n2. 现在假设公司的日生产能力翻了一倍，但售价和生产成本保持不变。他们现在应该生产多少单位硫酸以使利润最大化？所有的额外生产能力都是需要的吗？\n\
  \n### 8.4.6 键盘批次制造\nKeyrific 公司分批制造键盘。他们正试图决定明年生产多少批键盘，以使生产和存储成本最低。让 `x` = 每年生产的键盘批数。定义参数：\n\
