  \n### 2.1 引言\n\n建模的第一步之一是做出简化假设，而最简单的假设之一是一个变量仅仅是另一个变量的常数倍。这种关系被称为`proportional\
  \ 性`。\n\n**定义 2.1.1.** 如果存在一个非零常数 `c`（称为`比例常数`），使得\n\n变量 `y` 与变量 `x` `成比例`。\n\n\
  | `y = cx` | (2.1) |\n\n表达式 `y ∝ x` 表示 `y` 与 `x` 成比例。通常使用“正比”一词来描述这种关系。我们必须指出，两个变量之间的比例关系并不意味着一个变量`导致`了另一个。\n\
  \n注意，如果 `y = cx`，那么 $x = \\frac{1}{c}y$，因此 `x` 与 `y` 成比例。因此，如果 `y` 与 `x` 成比例，我们立即知道\
  \ `x` 与 `y` 成比例（即比例关系是对称的）。出于这个原因，如果 `y` 与 `x` 成比例，我们简单地说 `x` 和 `y` 成比例。\n\n从图形上看，`y\
  \ ∝ x` 意味着 `y` 对 `x` 的图（纵轴为 `y`，横轴为 `x`）应该形成过原点的直线。比例常数是这条直线的斜率。\n\n### 2.2 使用数据\n\
  \n著名的比例关系之一是`胡克定律`，它将作用在弹簧上的力与其伸长或压缩的距离联系起来。胡克定律简单规定：\n\n| `d = kF` | (2.2) |\n\n\
  其中 `F` 是作用在弹簧上的力，`d` 是伸长或压缩的距离，`k` 是弹簧刚度相关的常数。\n\n**示例 2.2.1**（弹簧上的桶）\n\n假设我们从弹簧上挂一个桶，向桶里装不同数量的沙子，并测量弹簧伸长的距离。结果记录在表\
