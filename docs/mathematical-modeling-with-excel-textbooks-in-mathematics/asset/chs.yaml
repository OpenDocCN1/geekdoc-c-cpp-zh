  \n### 5.3.5\n箱中初始含有 50 L 纯水。一种含有 50% 水和 50% 酒精的溶液以 `r(t) = 1 + cos (t)` L/min 的速率倒入箱中。箱内混合良好，溶液以每分钟\
  \ 1 L 的恒定速率流出箱外。\n\n### 5.3.6\n令 `y(t)` 表示时间 `t`（单位：天）培养皿中细菌的数量（单位：千）。假设细菌以 3 的速率增长。然而，假设向培养皿中加入了一种抗生素，按\
  \ `f(t)` 描述的速率杀死细菌。\n\n### 5.3.7\n放射性同素 R1 衰变为另一种放射性同素 R2，然后 R2 衰变为稳定原子。令 `y(t)`\
  \ 表示时间 `t`（单位：分钟）R2 的质量（单位：克）。假设 R1 以 `50e^(−10t)` g/min 的速率衰变，R2 以 `2y` g/min 的速率衰变。\n\
  \n### 5.3.8\n考虑练习题 5.2.6](#14_Chapter05.xhtml_sec5_3) 中描述的建筑加热与冷却，其中 `k = 0.25`、`U\
  \ = 3`、`D = 21`、`T(0) = 12` 且 `M(t) = 12 + 4cos (πt/12)`。\n\n### 5.3.9\n考虑一个容量为\
  \ 80 亿立方米（m³）的水库，初始污染浓度为 0.0025 kg/m³。每天流入 5 亿 m³ 浓度为 0.0005 kg/m³ 的水，流出等量的库内混合水。大约需要多久将水库的污染浓度降低到\
  \ 0.001 kg/m³？\n\n## 5.4 微分方程组\n\n*微分方程组*是一组两个或多个涉及两个或多个未知函数的相关的微分方程。在本节中，我们限制一组具有一般形式的两个方程：\n\
  \n$$\\frac{dx}{dt} = F(x,\\, y),\\frac{dy}{dt} = G(x,\\, y)$$\n\n以及初始条件 *x* (*t*[0])\
  \ = *x*[0], *y* (*t*[0]) = *y*[0]。此类系统的欧拉法为：\n\n\n\n\n\n$$\\begin{matrix} t_{1}\
  \ & = & {t_{0} + h} & x_{1} & = & {x_{0} + hF\\left( x_{0},y_{0} \\right)} & y_{1}\
  \ & = & {y_{0} + hG\\left( x_{0},y_{0} \\right)} \\\\ t_{2} & = & {t_{1} + h} &\
  \ x_{2} & = & {x_{1} + hF\\left( x_{1},y_{1} \\right)} & y_{2} & = & {y_{1} + hG\\\
  left( x_{1},y_{1} \\right)} \\\\ & \\vdots & & & \\vdots & & & \\vdots & & t_{n\
  \ + 1} & = & {t_{n} + h} & x_{n + 1} & = & {x_{n} + hF\\left( x_{n},y_{n} \\right)}\
  \ & y_{n + 1} & = & {y_{n} + hG\\left( x_{n},y_{n} \\right).} \\end{matrix}$$\n\n\
  ### 示例 5.4.1（相连水箱）\n\n考虑如图图 5.20 所示的两个充满盐水的连接水箱。让 `x(t)` 和 `y(t)` 表示时间 `t` 时水箱中盐的质量（单位：kg），其中\
  \ `x(0) = 4` 且 `y(0) = 2`。我们假设两个水箱均为完全混合。本示例的目标是描述 `x` 和 `y` 的长期行为。\n\n![fig5_20.jpg](img/fig5_20.jpg)\n\
  图 5.20\n\n为了建立微分方程组，我们使用来自第 5.3 节的以下原理：\n\n总变化率 = 输入速率 - 输出速率。\n\n首先，观察到每个水箱都以 8\
  \ L/min 的总速率流出溶液并以 8 L/min 的速率获得溶液，因此每个水箱的体积没有变化。现在考虑水箱 1。该水箱左侧以 6 L/min 的速率流入纯水，右侧以\
  \ 2 L/min 的速率流入来自水箱 2 的溶液。因此，\n\n$$\\text{Rate in} = \\frac{0\\,\\text{kg}}{\\text{L}}\
  \ \\times \\frac{6\\,\\text{L}}{\\text{min}} + \\frac{y\\,\\text{kg}}{24\\,\\text{L}}\
  \ \\times \\frac{2\\,\\text{L}}{\\text{min}} = \\frac{y\\,\\text{kg}}{12\\,\\text{min}}.$$\n\
  \n同样，水箱 1 的溶液以 8 L/min 的速率从右侧流，所以：\n\n$$\\text{Rate out} = \\frac{x\\,\\text{kg}}{24\\\
  ,\\text{L}} \\times \\frac{8\\,\\text{L}}{\\text{min}} = \\frac{x\\,\\text{kg}}{3\\\
  ,\\text{min}}.$$\n\n因此，水箱 1 的微分方程为：\n\n$$\\frac{dx}{dt} = \\frac{y}{12} - \\frac{x}{3}.$$\n\
  通过类似的论证，水箱 2 的微分方程为：\n$$\\frac{dy}{dt} = \\frac{x}{3} - \\frac{y}{3}.$$\n\n要使用步长为\
  \ `h` = 0.2 的欧拉法数值求解该系统，请将一个空白工作表重命名为“Connected Tanks”，并按如图 5.21 所示进行格式化。将第 5 行复制到第\
  \ 204 行。\n\n![fig5_21.jpg](img/fig5_21.jpg)\n图 5.21\n\n为了通过图形化分析结果，请按照图 5.22 所示创建\
  \ `x` 随 `t` 和 `y` 随 `t` 的图。这些图被称为*时间轨迹图*。在这些图中，我们看到水箱 1 中的盐质量在大约时间 20 min 左右下降到\
  \ 0。水箱 2 中的盐质量最初增加，但在大约时间 30 min 左右下降到 0。\n\n![fig5_22.jpg](img/fig5_22.jpg)\n图\
  \ 5.22\n\n我们可以通过绘制如图 5.23 所示的 `y` 随 `x` 的图，将两个时间轨迹图合并为一张图。该图中的 `x - y` 平面被称为*相平面*，曲线被称为*轨迹*。轨迹显示系统从点\
  \ (4, 2)（初始条件）开始。沿着轨迹向左移动，我们看到 `x` 减小，而 `y` 起初增加，但随后开始减少。`x` 和 `y` 最终都趋于 0。这正是我们在时间轨迹图中看到的。□\n\
  \n![fig5_23.jpg](img/fig5_23.jpg)\n图 5.23\n\n示例 5.4.1 中相平面上的点 (0, 0) 称为系统的*平衡点*。平衡点是微分方程组分析的核心内容。\n\
  \n#### 定义 5.4.1\n微分方程组\n$$\\frac{dx}{dt} = F(x,\\, y),\\frac{dy}{dt} = G(x, y)$$\n\
  的*平衡点*是指点 `(x[0], y[0])`使得 `F(x[0], y[0]) = 0 = G(x[0], y[0])`。简单来说，平衡点是相平面上的一个点，如果我们从那里开始，就会停留在那里。对于离散动力系统，微分方程组的平衡点是相平面上通常吸引或排斥的点。吸引轨迹的平衡点被称为*吸引的*、*稳定的*或*渐近稳定的*。排斥轨迹的平衡点被称为*不稳定的*或*排斥的*。\n\
  \n### 示例 5.4.2（分析平衡点）\n再次考虑示例 5.4.1 中的连接水箱系统。为了确认 (0, 0) 确实是一个平衡点，请在 Connected Tanks\
  \ 工作表中将 `x(0)` 和 `y(0)` 改为 0，并观察 `x` 和 `y` 保持为 0。要确定 (0, 0) 是否具有吸引，请添加图 5.24 中的公式，将初始条件改为\
  \ -5 到 5 之间的值。\n\n![fig5_24.jpg](img/fig5_24.jpg)\n图 5.24\n\n在轨迹图上，将轴 mins 和 maxes\
  \ 改为 -5 和 5，如图 5.25 所示。按几次 `F9` 键。每次都会生成一组新的初始条件。观察发现轨迹始终靠近点 (0, 0)。这在图形上表明 (0,\
  \ 0) 是一个吸引的平衡点。□\n\n![fig5_25.jpg](img/fig5_25.jpg)\n图 5.25\n\n### 示例 5.4.3（寻找平衡点）\n\
  我们通过图形法确定了 (0, 0) 是示例 5.4.1 系统的平衡点，但可能存在其他平衡点吗？要从代数上找到形式为\n$$\\frac{dx}{dt} = F(x,\\\
  , y),\\frac{dy}{dt} = G(x, y)$$\n的方程组平衡点，我们需要将 `F(x, y)` 和 `G(x, y)` 等于 0 并求解 `x`\
  \ 和 `y`。在示例 5.4.1 中，这得到了方程\n$$\\begin{matrix} {\\frac{y}{12} - \\frac{x}{3}} &=\
  \ 0 \\\\ {\\frac{x}{3} - \\frac{y}{3}} &= 0. \\end{matrix}$$\n使用线性代数技术求解该方程组得到 `x\
  \ = y = 0`。因此，(0, 0) 是唯一的平衡点。\n\n### 习题\n\n**5.4.1** 考虑图 5.26 中的连接水箱。\n\n![fig5_26.jpg](img/fig5_26.jpg)\n\
