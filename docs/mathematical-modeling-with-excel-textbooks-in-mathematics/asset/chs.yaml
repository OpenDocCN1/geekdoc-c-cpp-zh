  \n## 7.2.10 Cubicles Unlimited 公司制造办公桌和柜柜。管理层正试图决定在某周制造多少办公桌和柜柜，以满足下周的订单。要求如下：\n\
  \n* 每张办公桌需要 45 分钟组装时间和 30 分钟油漆时间，每个柜柜需要 30 分钟组装时间和 21 分钟油漆时间。\n* 组装部门有 40.25 小时，油漆部门有\
  \ 28.5 小时的生产时间可用。\n* 本周初库存有 50 张办公桌和 55 个柜柜。\n* 订单为 75 张办公桌和 95 个柜柜。\n\n\n\n\n\n\
  *   公司政策是使每周末的总库存量最大化。\n\n寻找该问题的优解。\n\n### 7.2.11 线性规划\n\n线性规划可以用矩阵形式表示。`标准最大问题`定义为：\n\
  \n| $$\\begin{matrix} \\textbf{Maximize~} & {\\mathbf{c}^{T}\\mathbf{x}} \\\\ \\\
  textbf{Subject to~} & {A\\mathbf{x} \\leq \\mathbf{b}\\{~and~}\\mathbf{x} \\geq\
  \ 0,} \\end{matrix}$$ | (7.2) |\n\n其中 `c` 是目标函数中的系数向量，`x` 是决策变量向量，`A` 是约束条件中的系数矩阵，`b`\
  \ 是约束条件右侧的常数向量。例如，示例 7.2.1 中以这种标准形式写出的线性规划为：\n\n| $$\\begin{matrix} \\textbf{Maximize~}\
  \ & {\\begin{bmatrix} 3 & 4 \\end{bmatrix}\\begin{bmatrix} x_{1} \\\\ x_{2} \\end{bmatrix}}\
  \ \\\\ \\textbf{Subject to~} & {\\begin{bmatrix} 3 & 2 \\\\ 1 & 2 \\end{bmatrix}\\\
  begin{bmatrix} x_{1} \\\\ x_{2} \\end{bmatrix} \\leq \\begin{bmatrix} 200 \\\\ 100\
  \ \\end{bmatrix}\\{~and~}\\begin{bmatrix} x_{1} \\\\ x_{2} \\end{bmatrix} \\geq\
  \ \\begin{bmatrix} 0 \\\\ 0 \\end{bmatrix}.} \\end{matrix}$$ | (7.3) |\n\n每个线性规划都有一个相关的`对偶线性规划`。标准最大问题（7.2）的对偶定义为\n\
  \n$$\\begin{matrix} \\textbf{Minimize~} & {\\mathbf{y}^{T}\\mathbf{b}} \\\\ \\textbf{Subject\
  \ to~} & {\\mathbf{y}^{T}A \\geq \\mathbf{c}^{T}\\{~and~}\\mathbf{y} \\geq 0,} \\\
  end{matrix}$$\n\n其中 `y` 是新决策变量向量。线性规划及其对偶之间有着紧密的联系。在本练习中，我们将观察这些联系之一。对偶问题的研究属于数学的一个分支，称为`对偶理论`。\n\
  \n1. 证明问题（7.3）的对偶为：\n$$\\begin{matrix} \\textbf{Minimize~} & {\\begin{bmatrix} y_{1}\
  \ & y_{2} \\end{bmatrix}\\begin{bmatrix} 200 \\\\ 100 \\end{bmatrix}} \\\\ \\textbf{Subject\
  \ to~} & {\\begin{bmatrix} y_{1} & y_{2} \\end{bmatrix}\\begin{bmatrix} 3 & 2 \\\
  \\ 1 & 2 \\end{bmatrix} \\geq \\begin{bmatrix} 3 & 4 \\end{bmatrix}\\{~and~}\\begin{bmatrix}\
  \ y_{1} \\\\ y_{2} \\end{bmatrix} \\geq \\begin{bmatrix} 0 \\\\ 0 \\end{bmatrix}.}\
  \ \\end{matrix}$$\n\n2. 求解 a 部分中的对偶问题，并将此解与示例 7.2.1 中的原始问题进行比较。你观察到了哪些相似之处？\n\n\
  ### 7.2.12 寻找以下线性规划的对偶\n\n求解该线性规划及其对偶，并比较它们的解。\n\n$$\\begin{matrix} \\textbf{Maximize}\
  \ & P & = & x_{1} & + & x_{2} & & \\\\ \\textbf{Subject to} & & & x_{1} & + & {2x_{2}}\
  \ & \\leq & 4 \\\\ & & & {4x_{1}} & + & {2x_{2}} & \\leq & 12 \\\\ & & & {- x_{1}}\
  \ & + & x_{2} & \\leq & 1 \\\\ & & & & & {x_{1},\\, x_{2}} & \\geq & 0 \\end{matrix}$$\n\
  \n## 7.3 运输问题 #06_Contents.xhtml_rsec7_3\n\n运筹学（OR）是应用数学的一个分支，致力于研究企业和工业等机构的运营，目标是帮助它们运行得更高效。它也被称为管理科学，与工程中的工业工程领域密切相关。运筹学始于第二次世界大战期间，目的是帮助军队更高效地分配和运输资源。\n\
  \n运筹学涉及排队论、库存理论和仿真等主题。求解线性规划（LP）也是运筹学的重要部分。在运筹学中，线性规划根据模型的形式进行分类，并根据该形式的原型示例进行命名。在本节和下一节中，我们考虑两种非常常见的线性规划类型：`运输问题`和`指派问题`。\n\
  \n### 示例 7.3.1（运送面包）\n\n优质面包公司（Better Bread Company）在美国中部的小麦生长区附近有三家面包坊，并在全美范围内分布着四个个分销仓库。管理层正在研究降低运输成本的方法。表\
  \ 7.3 所示进行格式。决策变量 `x_ij` 代表从面包坊 `i` 到仓库 `j` 的次数。该问题可以建模为：\n\n```\nMinimize Z = 119*x11\
  \ + 253*x12 + 321*x13 + 402*x14 + 205*x21 + 198*x22 + 348*x23 + 365*x24 + 432*x31\
  \ + 351*x32 + 195*x33 + 248*x34\nSubject to:\nx11 + x12 + x13 + x14 = 21 (供应 1)\n\
  x21 + x22 + x23 + x24 = 18 (供应 2)\nx31 + x32 + x33 + x34 = 18 (供应 3)\nx11 + x21\
  \ + x31 <= 119 (需求 1)\nx12 + x22 + x32 <= 253 (需求 2)\nx13 + x23 + x33 <= 321 (需求\
  \ 3)\nx_ij >= 0\n```\n\n使用 Solver 插件寻找 `x_ij` 的最优值。解如图 7.8 所示。它显示面包坊 1 应该向仓库 1 运送\
  \ 15 车，向仓库 3 运送 3 车。面包坊 2 应该向仓库 2 运送 10 车，向仓库 4 运送 8 车。面包坊 3 应该向仓库 3 运送 6 车，向仓库\
  \ 4 运送 12 车。\n\n注意在示例 7.3.1 的最优解中，所有的变量都是整数。这一观察在以下定理得到了推广。\n\n**定理 7.3.1.** *在运输问题中，如果所有的供应和需求都是整数，那么最优解中的所有决策变量都将整数。*\n\
  \n### 示例 7.3.2（不同的分配）\n\n考虑与示例 7.3.1 相同的问题，但分配量如表 7.4 所示略有不同。\n\n表 7.4\n\n|   |\
  \ **仓库** |  |  |  |  |\n| --- | --- | --- | --- | --- | --- |\n| **面包坊** | 1 | 2\
  \ | 3 | 4 | **产量** | |\n| **1** | 119 | 253 | 321 | 402 | 21 | |\n| **2** | 205\
  \ | 198 | 348 | 365 | 18 | |\n| **3** | 432 | 351 | 195 | 248 | 18 | |\n| **分配**\
  \ | 13 | 10 | 12 | 19 | | |\n\n\n\n\n注意，总产量为 57，而总分配为 54。因此，我们无法要求所有的面包店都生产其全部的产量，因为没有足够的仓库空间来存放所有产品。我们可以使用不等式约束将此问题建模为一个线性规划（LP）：\n\
  \n![umath7_9.jpg](img/umath7_9.jpg)\n\n该 LP 可以使用 `Solver` 中的 `Simplex`（单纯形法）求解。然而，上述公式并不是运输问题，因为它包含一些不等式约束而不是所有的等式约束。这看起来可能不是什么大问题。但是，`Simplex`\
  \ 方法有一个特殊版本被称为`运输单纯形法`（Transportation Simplex method），它在解决运输问题方面比通用的`Simplex` 方法要高效得多。对于具有数千个决策变量的大型问题（实际应用中常见），`运输单纯形法`相比`Simplex`\
  \ 方法可以节省大量的计算时间。因此，如果一个问题可以建模为运输问题，那么这样做是更好的。\n\n为了将此问题建模为运输问题，我们将引入一个“虚拟”仓库，将多出的\
  \ 3 卡车面包分配给它，并将其运费设定为 0。包含此虚拟仓库的参数表如表 7.5 所示。\n\n#### 表 7.5\n\n| | **仓库** | | |\
  \ | | | |\n| --- | --- | --- | --- | --- | --- | --- |\n| **面包店** | 1 | 2 | 3 |\
  \ 4 | **虚拟** | **产量** |\n| --- | --- | --- | --- | --- | --- | --- |\n| **1** |\
  \ 119 | 253 | 321 | 402 | 0 | 21 |\n| **2** | 205 | 198 | 348 | 365 | 0 | 18 |\n\
  | **3** | 432 | 351 | 195 | 248 | 0 | 18 |\n| **分配** | 13 | 10 | 12 | 19 | 3 | |\n\
  \n注意在这个版本中，总分配等于总产量，因此这个版本是一个真正的运输问题。注意此问题有三个额外的决策变量。要解决这个问题，我们只需简单地修改工作表 `Bread`\
