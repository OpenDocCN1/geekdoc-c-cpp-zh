  \ 2.27\n\n4. 创建一个图表来比较 `L` 的观测值与预测值，如图 2.28 所示。注意，这两组值非常接近，表明我们有一个很好的模型。\n\n   ![fig2_28.jpg](img/fig2_28.jpg)\n\
  \n   图 2.28\n\n5. 为了进一步分析模型与数据的拟合程度，对于每个数据点，定义：\n\n   残差 = (观测值) − (预测值)\n\n   ![fig2_29.jpg](img/fig2_29.jpg)\n\
