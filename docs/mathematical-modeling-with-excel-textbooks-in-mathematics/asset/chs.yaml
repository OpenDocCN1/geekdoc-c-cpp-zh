  \ 和队列中的期望等待时间 `W[q]` 由给出\n\n\n\n\n\n$$L_{q} = \\frac{\\lambda^{2}\\sigma^{2} + \\\
  rho^{2}}{2\\left( {1 - \\rho} \\right)}\\quad\\text{and}\\quad W_{q} = \\frac{L_{q}}{\\\
  lambda}$$\n\n其中\n\n*   `λ` = 单位时间内的平均到达客户数（到达率），\n*   `μ` = 单位时间内服务的平均客户数（服务率），\n\
  *   `σ` = 服务时间的标准差，\n*   `ρ` = `λ`/`μ`。\n\n1.  计算示例 6.7.1 中队列的 `L[q]` 和 `W[q]`。这些数字与仿真中找到的结果是否一致？\n\
  2.  计算到达率为 5、服务率为 6 的队列的 `L[q]` 和 `W[q]`，并用仿真验证这些数字。\n3.  计算练习 6.7.4 中两个队列中各自的 `L[q]`\
  \ 和 `W[q]`。（**提示**：参见示例 6.6.1 来计算均匀服务时间队列的平均值和标准差。）\n\n### 6.7.6\n假设客户以每分钟 2 人的人的速度进入单个队列，但有两个完全相同的服务器，每个服务器的服务率均为每分钟\
  \ 3 人。假设到达之间的间隔时间和服务时间都服从指数分布。\n\n1.  仿真该队列并估计期望等待时间。\n\n    **建议**：\n\n    *  \
