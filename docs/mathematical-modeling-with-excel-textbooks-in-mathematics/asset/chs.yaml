  \n1. 求解此问题并找到每个约束条件的拉格朗日乘子值。\n2. 如果经理有一些额外的资金用于购买苹果或橙子（但不同时买），她应该购买更多的苹果还是橙子？简要说明你的理由。\n\
  \n### 8.6.13 \n假设一家报社必须购买三种纸张。他们必须在满足需求的同时，使用 `Economic Order Quantity` (EOQ) 模型使总成本最小。设\
  \ `Q[i]` 为每周购买的 `i` 类型纸卷的数量。每周购买和存储 `i` 类型纸张的成本如下：\n\n$$C\\left( Q_{i} \\right)\
  \ = \\frac{a_{i}d_{i}}{Q_{i}} + h_{i}\\frac{Q_{i}}{2}$$\n\n其中\n\n* `a[i]` 是订货成本（美元），\n\
  * `d[i]` 是订货率（卷/周），\n* `h[i]` 是存储成本（美元/周/卷），以及\n* `Q[i]/2` 是平均库存量。\n\n每周的总成本是这三种成本之和：\n\
  \n`C(Q[1], Q[2], Q[3]) = C(Q[1]) + C(Q[2]) + C(Q[3])`。\n\n唯一的约束是可用存储面积。`i` 类型纸张所需的存储面积为：\n\
  \n`S(Q[i]) = s[i]Q[i]`\n\n其中 `s[i]` 是每卷需要的平方英尺（ft²）。所需的总存储面积是这三个面积之和：\n\n`S(Q[1],\
  \ Q[2], Q[3]) = S(Q[1]) + S(Q[2]) + S(Q[3])`。\n\n纸卷不能堆叠；它们必须并排铺在地面上。参数值见下表：\n\n\
  | 参数 | 类型 I | 类型 II | 类型 III |\n| --- | --- | --- | --- |\n| `a` | 25 | 18 | 20\
  \ |\n| `d` | 32 | 24 | 20 |\n| `h` | 1 | 1.5 | 2 |\n| `s` | 4 | 3 | 2 |\n\n1. 如果有\
  \ 200 ft² 的可用空间，请找到最优解。确保你的解是整数。\n2. 现在假设报社想要增加其存储能力。增加存储实际上会降低总成本吗？如果是，你建议额外增加多少存储？简要说明你的理由。\n\
  \n### 8.7 分支界法\n\n`Branch and bound`（分支界法）是一种用于求解 `integer programs`（整数规划）的技术，在这些规划中决策变量必须是整数。在本节中，我们关注一种特定的整数规划，称为\
  \ `binary integer program` (`BIP`，二进制整数规划），其中决策变量必须为 0 或 1（即为二进制）。\n\n为了说明分支界法的工作原理，考虑以下场景：\n\
  \nNathan 和 Laura 正在试图出售他们的房子，房子有两个卧室和两个浴室。为了增加房屋价值，他们想装修一个或多个房间。他们估计了装修每个房间的成本，他们的房地产中介估计了如果装修每个房间，房屋价值的增加量，如表\
  \ 8.2 所示（成本和价值增加均以千美元为单位）。他们只有 $10,000 用于装修，并且他们决定不能同时装修浴室 2 和卧室 2。只有在也装修浴室 1 的情况下，他们才会装修浴室\
  \ 2。同样，只有在也装修卧室 1 的情况下，他们才会装修卧室 2。他们应该装修哪些房间以使房屋总价值最大化？\n\n表 8.2\n\n| 房间 | 决策变量\
  \ | 装修成本 | 房屋价值增量 |\n| --- | --- | --- | --- |\n| 浴室 1 | `x[1]` | 6 | 9 |\n| 卧室\
  \ 1 | `x[2]` | 3 | 5 |\n| 浴室 2 | `x[3]` | 5 | 6 |\n| 卧室 2 | `x[4]` | 2 | 4 |\n\n\
  \n\n\n\n`分支`（Branching）是将一个或多个决策变量的值设置为 0 或 1 的过程，这将创建新的松弛，称为`子问题`（sub-problems）。分支的第一步如图图\
  \ 8.40\n图 8.40\n\n**子问题 1：** 首先，我们向左分支并将 `x[1]` 设置为 0。如图 8.41\n图 8.41\n\n运行 `Solver`\
  \ 得到最优解 (0, 1, 0, 1)，此时 `Z` = 9。这意味着对于所有 `x[1]` = 0 的解，最佳的都是 (0, 1, 0, 1)，`Z` =\
  \ 9。该解及其相关的 `Z` 值有特殊的称呼：\n\n*   `当前解`（incumbent）是目前为止找到的最佳二进制解。\n*   `Z` 是当前解处目标函数的值。\n\
  \n因此，在此时，当前解为 (0, 1, 0, 1) 且 `Z` = 9。我们如图 8.42 所示记录下这些值。\n\n![fig8_42.jpg](img/fig8_42.jpg)\n\
  图 8.42\n\n**子问题 2：** 接下来，我们向右分支并将 `x[1]` 设置为 1。如图 8.43 所示，我们通过调整 `x[1]` 的上下界为 1\
  \ 来修改松弛。\n\n![fig8_43.jpg](img/fig8_43.jpg)\n图 8.43\n\n运行 `Solver` 得到最优解 (1, 0.8,\
  \ 0, 0.8)，此时 `Z` = 16.2。这意味着对于所有 `x[1]` = 1 的解，最佳的都是 (1, 0.8, 0, 0.8)，`Z` = 16.2（即\
  \ `Z` = 16 是所有 `x[1]` = 1 的二进制解的上界）。\n\n### 步骤 3：舍弃子问题\n\n在这一步中，我们确定步骤 2 中的哪些子问题值得进一步考虑。那些不被认为值得考虑的将（`舍弃`（fathomed）。\n\
  \n*   **子问题 1：** 在这里我们将 `x[1]` 设置为 0 并得到了解 (0, 1, 0, 1)，它是二进制的。因此，没有理由去检查任何其他 `x[1]`\
  \ = 0 的可能解，因为我们已经找到了最佳的一个。因此，我们舍弃了它。\n*   **子问题 2：** 在这里我们将 `x[1]` 设置为 1 并得到了非二进制解，但\
  \ `Z` = 16.2 大于 `Z` = 9。这意味着可能找到一个比当前解更好的、`x[1]` = 1 的可行二进制解。因此，这个子问题值得进一步考虑，我们对该子问题进行`分支`。\n\
  \n通常情况下，我们舍弃一个子问题有三个原因：\n\n1.  它的 `Z` 值小于或等于 `Z`。\n2.  它没有可行解。\n3.  它的解是二进制的。\n\n\
  我们如图 8.44 所示记录每个子问题的的结果。在每个子问题下面的第一个框中，我们记录相关的 `Z` 值。在下方，我们记录步骤 3 的结果。“F3”意味着由于原因\
  \ 3 舍弃了该子问题。“B”意味着对该子问题进行分支。\n\n### 步骤 4：对最新剩余的子问题进行分支\n\n![fig8_44.jpg](img/fig8_44.jpg)\n\
  图 8.44\n\n从 `x[1]` = 1 的子问题开始，我们进行分支形成两个新的子问题：一个 `x[2]` = 0，另一个 `x[2]` = 1。这如图 8.45\
  \ 所示。\n\n*   **子问题 3：** 我们向左分支并将 `x[2]` 设置为 0 同时将 `x[1]` 设置为 1。我们如图 8.46 所示修改松弛。求解此得到\
  \ (1, 0, 0.8, 0) 的解，`Z` = 13.8。\n*   **子问题 4：** 我们向右分支并将 `x[2]` 设置为 1 同时将 `x[1]`\
  \ 设置为 1。我们相应地修改松弛、求解并获得 (1, 1, 0, 0.5) 的解，`Z` = 16。\n\n### 步骤 5：重复步骤 3 – 4 直到没有子问题\n\
  \n![fig8_45.jpg](img/fig8_45.jpg)\n图 8.45\n![fig8_46.jpg](img/fig8_46.jpg)\n图 8.46\n\
  \n我们应用步骤 3 来确定子问题 3 或 4 应该舍弃。两个子问题都不符合舍弃标准。我们决定对子问题 4 进行分支，因为它的 `Z` 值更大。我们如图 8.47\
  \ 所示记录结果。\n\n![fig8_47.jpg](img/fig8_47.jpg)\n图 8.47\n\n于是我们对 `x[2]` = 1 进行分支。将\
  \ `x[3]` 设置为 0 得到 `Z` = 16 的非二进制解。将 `x[3]` 设置为 1 是不可行的，因此根据标准 2 舍弃它。对 `x[3]` = 0\
  \ 进行分支并设置 `x[4]` = 0 得到 (1, 1, 0, 0) 的解，`Z` = 14。这比 `Z` = 9 的当前解要好。因此 (1, 1, 0,\
  \ 0) 成为新的当前解，`Z` = 14。我们也根据标准 3 舍弃它。将 `x[4]` 设置为 1 是不可行的，因此根据标准 2 舍弃它。我们如图 8.48\
  \ 所示记录结果。\n\n![fig8_48.jpg](img/fig8_48.jpg)\n图 8.48\n\n我们还有一个剩余的子问题需要考虑，`x[1]`\
  \ = 1 且 `x[2]` = 0，得到的 `Z` = 13.8。这个 `Z` 值小于我们的 `Z` = 14，因此我们根据标准 1 舍弃它。我们如图 8.49\
  \ 所示记录此结果。\n\n![fig8_49.jpg](img/fig8_49.jpg)\n图 8.49\n\n因此没有剩余的子问题，我们完成了。最优解是 (1,\
  \ 1, 0, 0)，`Z` = 14。这意味着 Nathan 和 Laura 应该装修浴室 1 和卧室 1。这将增加他们房屋价值 $14,000。这与通过二进制约束用\
  \ `Solver` 找到的解一致。\n\n这种分支定技术可以扩展到一般的整数问题，每个变量可以取多个整数值。基本思想是相同的，只是每个分支有超过两个选项。\n\
  \n### 练习题\n\n*   **8.7.1** 使用分支定法求解以下 BIP：\n![umath8_67.jpg](img/umath8_67.jpg)\n\
