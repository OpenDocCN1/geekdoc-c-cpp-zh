  \ 1 号仓库，5 卡发往 3 号仓库。\n\n**示例 7.3.3 一个新需求**\n\n考虑与示例 7.3.2 相同的场景，但管理层现在要求 1 号面包店恰好生产\
  \ 21 卡车面包。我们可以像以前一样对其建模，但增加了一个约束：从 1 号面包店到虚拟仓库的卡车数量恰好为 0，但这样我们就得不到一个运输问题了。\n\n相反，我们将使用`大\
  \ M 法`（big-M method）。我们将完全按照示例 7.3.2 中的方式对问题建模，但为从 1 号面包店到虚拟仓库的货物分配一个巨大的成本 `M`（在此情况下\
