  \ 步得到图 7.30 所示的表格 2。\n\n![fig7_30.jpg](img/fig7_30.jpg)\n\n图 7.30\n\n在表格 2 中，我们看到底行没有负系数，因此没有主元列。非基变量（设为\
  \ 0 的变量）是 `y[1]` 和 `y[2]`，因此表格给出了图 7.31 所示的最优解。这与其他方法找到的解完全相同。表格 2 底行的数字 0.5 和 1.5\
  \ 具有特殊含义，正如我们在下一节中看到的样。\n\n图 7.31\n\n![fig7_31.jpg](img/fig7_31.jpg)\n\n### 练习题\n\
