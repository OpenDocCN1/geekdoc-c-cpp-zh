  \ – 成本。）\n\n## 7.4 指派问题与二进制约束\n\n*指派问题*（Assignment Problem, AP）是一种特殊的线性规划问题，我们通常称之为将*工人*指派去执行某些*任务*。最简单的例子是员工被分配执行不同类型的任务。然而，工人并不总是人，任务也不总是是字面意义上的要执行的任务。在下面的示例\
  \ 7.4.1 中，工人是卡车，任务是需要交付的包裹。\n\n在指派问题中，决策是哪些工人应该执行哪些任务，以使某些成本函数最小。一个问题当且仅当它满足以下假设时，被称为指派问题（参见\
  \ Hillier, F. and G. Lieberman, *Introduction to Operations Research*, Seventh Edition,\
  \ Boston, 2001, p. 382）：\n\n1. 工人数 `n` 等于任务数。\n2. 每个工人恰好被分配一个任务。\n3. 每项任务恰好由一个工人执行。\n\
  4. 将工人 `i` 分配给任务 `j` 有相关的成本 `c[ij]`。\n5. 目标是使总成本最小。\n\n决策变量 `x[ij]` 是二进制的（等于 0 或\
  \ 1）：\n```\nx_{ij} = \\begin{cases} 1 & \\text{如果工人 } i \\text{ 执行任务 } j \\\\ 0\
  \ & \\text{否则}\\end{cases}\n```\n\n#### 示例 7.4.1 (准时交付)\nOn-Time Delivery 的调度员有三个需要交付的包裹。根据卡车的位置，调度员有一个表\
