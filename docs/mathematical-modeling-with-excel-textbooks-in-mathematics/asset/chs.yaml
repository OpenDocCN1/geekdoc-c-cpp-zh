  \ 6.687。\n\n这个示例说明了拉格朗日乘数的以下解释：\n\n如果约束资源的拉格朗日乘数为 `λ`，且该资源的数量增加一个微小量 `Δ`，那么目标函数的最大值将增加大约\
  \ `λΔ`。\n\n这种解释与第 7.7 节讨论的 `影子价格` 相似。\n\n最后一点说明：这些示例处理的是只有一个约束的受约束优化问题。拉格朗日乘数法可以适用于具有多个约束的问题。请参见练习\
  \ 8.6.2 和 8.6.3 的示例。\n\n### 练习题\n\n**8.6.1** 假设 `x`、`y` 和 `z` 为正数。在约束 `xyz = 1`\
