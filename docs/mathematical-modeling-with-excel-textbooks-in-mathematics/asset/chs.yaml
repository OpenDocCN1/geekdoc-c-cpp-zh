  \ of Trafalgar）。\n8. 尝试用离散逻辑方程（discrete logistic equation）对美国人口随时间变化的情况进行建模。\n9.\
  \ 研究特征值和特征向量如何用于寻找二维离散动力系统的解析解。\n10. 模拟 14*世纪伦敦黑鼠疫的传播。\n11. 假设你刚大学毕业，有学生贷款要还。但你也认为你需要一辆新车。你应该\
  \ A. 尽可能久地保留你的旧破车并支付维修费，还是 B. 现在买一辆新车，支付更少的维修费，并多还一些学生贷款？创建一个工作表来分析这个问题。\n12. 假设你是一个刚从大学毕业的学生，正准备进入职场，你有几笔学生贷款开始考虑偿还。尽管你刚毕业，但你已经在考虑为买房存钱了。现在你想知道，根据利率，是尽快还清所有贷款好，还是在偿还较少学生贷款的同时开始投资并为买房蓄钱好？创建一个工作表来分析这个问题。\n\
  \n### 延伸阅读\n* 如需了解关于离散动力系统的极佳论述，请参阅 Sandefur, James T, *Discrete Dynamical Systems\
  \ Theory and Applications*, Clarendon Press, 1990。\n* 如需更多离散动力系统的示例，请参见 Meerschaert,\
  \ Mark M., *Mathematical Modeling*, Second ed., Academic Press, 1999, 第 141 – 152\
  \ 页。另见第 152 页提供的参考文献。\n* 如需离散动力系统应用于复利和房贷还款的示例，请参见 Tung, Ka–Kit, *Topics in Mathematical\
  \ Modeling*, Princeton University Press, 2007, 第 54 – 67 页。\n* 如需关于流行模型的更多信息，请参见\
  \ Allman, Elizabeth Spencer and John A. Rhodes, *Mathematical Models in Biology:\
  \ An Introduction*, Cambridge University Press, 2004。\n* 如需使用特征值和特征向量方法的离散动力系统信息，请参见\
  \ Lay, David C., *Linear Algebra and its Applications*, Third ed., Addison Wesley,\
  \ 第 342–353 页。\n* 如需了解动力系统的不同方法，请参见 Hannon, Bruce and Matthias, *Dynamic Modeling*,\
  \ Springer, 2001。\n\n### 5.1 引言\n通常描述一个数量的变化速度非常容易。例如，在 4 章中的细菌群体示例中，我们从数据中观察到随着人口接近容量，培养物减少的速度。这一观察得出了差分方程：\n\
  \n```\nΔa[n] = b * (621 - a[n])\n```\n注意，在这个例子中，我们处理的是离散的时间增量。实际上，时间是连续的，因此使用离散单位是一种简化，因为像\
  \ (5.1) 这样的差分方程很容易用 `a[n]` 解出 `a[n+1]`。\n\n在连续测量时间时，我们用*微分方程*描述变化。微分方程的形成方式与差分方程基本相同，但寻找它们的解可能要复杂得多。\n\
  \n为了说明微分方程是如何形成的，考虑以下观察结果：\n\n当一杯热咖啡放在桌子上时，它最初冷却得非常快。随着咖啡接近室温，它的冷却速度变慢了。\n\n这个简单的观察是牛顿冷却定律的一个例子：\n\
  \n热物体冷却（或冷物体升温）的速度与物体温度与其环境温度之间的差成正比。\n\n该定律可以转化为以下微分方程：\n\n```\ndy/dt = k(y - T)\n\
  ```\n\n其中\n\n$$\\begin{matrix} {y(t)} & { \\text{物体在时间}\\, t 的温度}} \\\\ T & { \\\
  text{环境温度（假设为常数）}} \\\\ k & { \\text{比例常数}} \\end{matrix}$$\n\n这个微分方程可以使用基础技术求解，得到通解：\n\
  \n`y(t) = T + Ce^{kt}`\n\n其中 `C` 是任意常数。\n\n### 本章目标\n* 使用欧拉法寻找微分方程的数值解\n* 数值求解微分方程组\n\
  * 使用微分方程模拟混合问题、人口增长和军事\n* 介绍 Runge-Kutta 方法\n\n#### 示例 5.1.1（牛顿冷却定律）\n考虑一杯初始温度为\
  \ 100 ^°F 的咖啡，10 分钟后冷却到 90 ^°F，放置在温度恒定为 *T* = 60 ^°F 的房间内。\n\n\n\n\n牛顿冷却定律的通解为 `y`\
  \ (`t`) = `T` + `Ce^(kt)`。为了找到这种情况的具体解，我们需要找到常数 `C` 和 `k` 的值。初始条件 `y(0)` = 100 给出：\n\
  \n100 = 60 + Ce^(k*(0)) ⇒ C = 40\n\n条件 `y(10)` = 90 给出：\n\n90 = 60 + 40e^(k*(10))\
  \ ⇒ k ≈ -0.02877\n\n因此，模型为：\n\n| `y(t) = 60 + 40e^(-0.02877*t).` | (5.2) |\n| ---\
  \ | --- |\n\n该模型的图如图图 5.1 所示。这条曲线被称为`解曲线`。\n\n![fig5_1.jpg](img/fig5_1.jpg)\n\n\
  图 5.1\n\n在本章中，我们不像示例 5.1.1 那样解析地求解微分方程。相反，我们使用一种名为`欧拉法`的技术来数值近似解曲线，然后通过图表分析结果。\n\
  \n## 5.2 欧拉法](#06_Contents.xhtml_rsec5_2)\n\n欧拉法是一种近似微分方程解曲上点的技术。为了说明该方法，考虑形式如下的微分方程：\n\
  \n$$\\frac{dy}{dt} = F(y)$$\n\n以及初始条件 `y(t[0])` = `y[0]`，其中 `t[0]` 和 `y[0]` 是给定的值。如图图\
  \ 5.2 所示，点 `(t[0], y[0])` 是解曲线上的一点。现在，让 `h` 为某个小的正数，定义时间 `t[1]` 为 `t[1] = t[0] +\
  \ h`。我们的目标是近似解曲上的点 `(t[1], y(t[1]))` 的 `y` 坐标。\n\n![fig5_2.jpg](img/fig5_2.jpg)\n\
  \n图 5.2\n\n在图 5.2 的三角形中，底长为 `h`，斜边位于斜率为 `F(y[0])` 的直线上。因此，高度为：\n\n`height = h F(y[0])`\n\
  \n三角形底的 `y` 坐标为 `y[0]`。因此，三角形顶部的 `y` 坐标为：\n\n| `y[1] = y[0] + h F(y[0])`` | (5.3)\
  \ |\n| --- | --- |\n\n该 `y` 坐标是 `y(t[1])` 的近似值。为了近似 `t[2] = t[1] + h` 的 `y(t[2])`我们可以重复此过程，将\
  \ `y[0]` 替换为 `y[1]`。我们继续按如下方式重复此过程：\n\n$$\\begin{matrix} {t_{1} = t_{0} + h} & {y_{1}\
  \ = y_{0} + h\\, F\\left( y_{0} \\right)} \\\\ {t_{2} = t_{1} + h} & {y_{2} = y_{1}\
  \ + h\\, F\\left( y_{1} \\right)} \\\\ \\vdots & \\vdots \\\\ {t_{n + 1} = t_{n}\
  \ + h} & {y_{n + 1} = y_{n} + h\\, F\\left( y_{n} \\right)} \\end{matrix}$$\n\n\
  该算法被称为`欧拉法`。欧拉法的结果至少可以从两种方式解释：\n\n1. **数值上**：对于每个 `n`，`y[n] ≈ y(t[n])`。\n2. **图表上**：每个点\
  \ `(t[n], y[n])` 大约是解曲线上的一个点。\n\n**示例 5.2.1**（应用欧拉法）\n\n欧拉法在 Excel 中易于实现。这里我们将其应用于示例\
  \ 5.1.1 中的牛顿冷却定律问题，并检查 `h` 的值如何影响近似结果。将一个空白工作表重命名为“**Euler**”并按照图 5.3 进行格式化。将第 5\
  \ 行复制到第 1004 行，以计算 1000 个不同时间的值。\n\n![fig5_3.jpg](img/fig5_3.jpg)\n\n图 5.3\n\n从数值上看，这些结果告诉我们不同时间的近似温度。例如，第\
  \ 24 行告诉我们时间为 10 时，温度约为 89.9 °F。从图表上看，我们可以利用结果来近似解曲线。使用**Time**（时间）和**Approximate**（近似值）列创建一个如图\
  \ 5.4 所示的图表。\n\n![fig5_4.jpg](img/fig5_4.jpg)\n\n图 5.4\n\n观察图 5.4 中的近似解曲线，它看起来与图\
  \ 5.2 中的精确解曲线非常相似。要数值地比较这些曲线，请添加图 5.5 中的公式。**Exact**（精确）列中的公式产生精确温度。误差是近似温度与精确温度之间的差。\n\
  \n![fig5_5.jpg](img/fig5_5.jpg)\n\n图 5.5\n\n为了分析误差，使用**Time**（时间）和**Error**（误差）列创建一个如图\
  \ 5.6 所示的图表。将 `y` 轴的**min**和**max**分别设置为 0 和 0.25，将 `x` 轴的**min**和**max**分别设置为 0\
  \ 和 200。\n\n![fig5_6.jpg](img/fig5_6.jpg)\n\n图 5.6\n\n图 5.6 显示误差始终小于 0.2，且随着时间的推移，误差变得更小。这表明欧拉法给出了非常准确的结果。为了分析\
  \ `h` 值如何影响误差，添加一个**min**和**max**为 0 和 100 的滚动条，并将**linked cell**（链接单元）设置为 E1。添加图\
  \ 5.7 中的公式来改变 0 到 1 之间的 `h` 值。\n\n![fig5_7.jpg](img/fig5_7.jpg)\n\n图 5.7\n\n使用滚动条改变\
  \ `h` 的值并观察误差的变化。图 5.8 显示了两个示例。注意，随着 `h` 变小，误差减小；随着增大，误差增加。但注意误差从未大于 0.25，这相对于精确值是非常大的。\n\
  \n![fig5_8.jpg](img/fig5_8.jpg)\n\n图 5.8\n\n□\n\n示例 5.2.1 说明通常情况下，`h` 越小，近似越良好。但存在权衡。如果我们使用较小的\
  \ `h` 值，就必须在相同的 `t` 范围内进行更多迭代来绘制解曲线。这引发了问题：\n\n1. 我们如何选择 `h` 的值？\n2. 我们如何知道近似解是否准确？\n\
  \n没有完美的答案，但我们提供以下指南：将 `h` 的值减半。如果近似解曲线没有“显著”变化，那么近似可能是准确的。\n\n**示例 5.2.2**（逻辑方程）\n\
  \n假设将 25 只豹子释放到一个保护区。最初人口以每年约 25% 的速度增长，但由于食物供应有限，该保护区被认为只能容纳 200 只豹子。我们想要对随时间变化的人口建模。\n\
  \n建议创建一个微分方程来模拟人口的变化率。如果 `y(t)` 代表 `t` 年的人口，25% 的初始速率建议我们建模：\n\n$$\\frac{dy}{dt}\
  \ = 0.25y$$\n\n然而，这个模型没有考虑到保护区只能容纳 200 只豹子的事实。假设当 `y` 接近 200 时增长率将下降是合理的。一种这种此的方法是：\n\
  \n| $$\\frac{dy}{dt} = 0.25\\left( {1 - \\frac{y}{200}} \\right)y$$ | (5.4) |\n\
  | --- | --- |\n\n注意，当 `y` → 200 时，$\\left( {1 - \\frac{y}{200}} \\right)\\rightarrow\
  \ 0$，意味着 $\\frac{dy}{dt}\\rightarrow 0$。方程 (5.4)被称为`逻辑微分方程`。同样注意该逻辑微分方程与我们在第 4 章中为细菌人口推出的逻辑差方程非常相似。\n\
  \n逻辑方程的一般形式为：\n\n$$\\frac{dy}{dt} = k\\left( {1 - \\frac{y}{L}} \\right)y$$\n\n\
  参数 `L` 称为`载容量量`，参数 `k` 称为`无限制`（或*内禀*）`增长率`。\n\n为了近似方程 (5.4) 的解曲线，将一个空白工作表重命名为“**Logistic**”并按照图\
  \ 5.9 进行格式化。将第 5 行复制到第 129 行，以建模 25 年。\n\n![fig5_9.jpg](img/fig5_9.jpg)\n\n图 5.9\n\
  \n接下来，创建一个如图 5.10 所示的图表。\n\n![fig5_10.jpg](img/fig5_10.jpg)\n\n图 5.10\n\n\n\n\n\
  图 5.10 显示，正如预期的那样，当数量接近 200 时，增长率会放缓。数量在第 25 年达到载入容量。另请注意，该图与示例 4.3.1 中的细菌数量图表看起来非常相似。\n\
  \n为了判断图 5.10 中的近似解曲线是否准确，我们遵循上述指导方针。我们将单元格 `B2` 中的 `h` 值更改为 0.1，将第 5 行向下复制到第 254\
  \ 行，并像图 5.11 所示创建一个图表。\n\n![fig5_11.jpg](img/fig5_11.jpg)\n\n图 5.11\n\n观察到图 5.10\
  \ 和图 5.11 看起来几乎完全相同。因此，`h` = 0.2 似乎给出了准确的结果。如果这两个图差异很大，那么我们需要不断将 `h` 半半，直到曲线不再发生显著变化。\n\
  \n形式如下非自治微分方程（即右侧显式依赖于 `t` 的方程）\n\n$$\\frac{dy}{dt} = F(t,\\, y)$$\n\n在应用中频繁出现。欧拉法可以很容易地适用于这类微分方程。基本算法如下：\n\
  \n```\nt[n + 1] = t[n] + h\ny[n + 1] = y[n] + h*F(y[n], t)\n```\n\n下一个示例说明了非自治微分方程的应用。\n\
