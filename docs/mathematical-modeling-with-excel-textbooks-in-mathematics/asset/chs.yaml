  \ 2.6\n涉及预期寿命的因素有很多；每位医生对应的人数只是其中之一。似乎可以相信，随着每位医生对应的人数的增加（意味着人均拥医生越少），预期寿命会下降，因为人们获得医疗服务的便利性降低了。我们并不声称每位医生对应的人数\
  \ *导致*了预期寿命，但这两个变量之间可能存在关系。\n\n\n\n\n数据的图表所示图 2.24。请注意，随着每位医生的对应人数的增加，预期寿命会下降，这符合我们的直觉。还要注意，这些点似乎形成了一条曲线，最初下降迅速，然后于平稳。这表明对数模型或幂模型可能是合适的。\n\
