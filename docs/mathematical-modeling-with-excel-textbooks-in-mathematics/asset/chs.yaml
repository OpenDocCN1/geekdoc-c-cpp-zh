  \ 离散动力系统\n\n## 章节目标\n\n* 定义并求解离散动力系统\n* 通过数值和图表方法分析离散动力系统的长期行为\n* 使用线性和非线性离散动力系统对不同场景进行建模\n\
  \n## 4.1 引言\n\n`dynamical system`（动力系统）简单来说就是随时间变化的系统。第 1 章中建模的细菌生长就是此类例子。当时间以离散增量来衡量时（例如细菌生长模型中），该系统被称为`discrete\
  \ dynamical system`（离散动力系统）。\n\n动力系统“建模容易求解困难”（Meerschaert, Mark M., *Mathematical\
  \ Modeling*, Second ed., Academic Press, 1999, p. 127）。在本中，我们将介绍建立动力学模型的基本技术以及分析这些模型的图形化方法。\n\
  \n从数学角度来说，一个离散动力系统仅仅是一个数字序列。考虑一个每年复利一次的储蓄账户，利息在年底加入。如果 `a`[`n]` 是第 `n` 年末账户中的金额（`n`\
  \ = 0, 1, …），且 `r` 是利率，则我们有序列：\n\n$$\\begin{matrix} a_{1} & {= a_{0} + r\\, a_{0}\
  \ = (1 + r)\\, a_{0}} \\\\ a_{2} & {= a_{1} + r\\, a_{1} = (1 + r)\\, a_{1}} \\\\\
  \ & {\\quad\\quad\\quad \\vdots} \\\\ a_{n + 1} & {= a_{n} + r\\, a_{n} = (1 + r)\\\
  , a_{n}} \\end{matrix}$$\n\n最后一个方程引出了我们动力系统的正式定义。\n\n**定义 4.1.1**（离散动力系统）。`discrete\
  \ dynamical system`（离散动力系统）是一个数字序列 {a`[`n]` | `n` = 0, 1,…}，由如下形式的关系定义：\n\n`a`[`n` + 1] = `f`(`a`[`n`])`\n\
  \n其中 `f` 是某个实值函数。\n\n变量 `a`[`n]` 通常被称为 `state of the system`（系统状态）。简单来说，离散动力系统是指系统状态由前一个状态决定的系统。在储蓄账户示例中，系统只有一个组件（账户金额），因此它被称为`one-dimensional`（一维）。\n\
  \n当函数 `f` 的形式为 `f(x)` = `bx` 且 `b` 为常数时，该动力系统被称为`linear`（线性）。\n\n**定义 4.1.2**（线性离散动力系统）。`linear\
  \ discrete dynamical system`（线性离散动力系统）是一个数字序列 {a`[`n]` | `n` = 0, 1,…}，由如下形式的关系定义：\n\
  \n`a`[`n` + 1] = `b`**`a`[`n`]`\n\n其中 `b` ≠ 0 是常数。\n\n任何没有这种线性形式的动力系统通称为`nonlinear`（非线性）。离散动力系统的\
  \ `solution`（解）是关于 `n` 和初始状态 `a`[`0]` 的 `a`[`n]` 的显式描述。\n\n**定理 4.1.1** *对于 `b`\
  \ ≠ 0，线性动力系统 `a`[`n`+1] = `ba`[`n`]` 的解为*\n\n| `a`[`n]` = `b`^(`n`)*`a`[`0]` | 4.1\
  \ |\n| --- | --- |\n*其中 `a`[`0]` 是初始状态。*\n\n*证明*. 我们首先需要证明 (4.1 满足初始条件。注意在 (4.1\
  \ 中，`a`[`0]` = `b`⁰`a`[`0]`，满足初始条件。接下来，我们需要证明 (4.1 满足线性离散动力系统的定义。注意 `a`[`n` + 1] = `b`^(`n` + 1)*`a`[`0]` = `b`^(`n`)*`a`[`0]`\
  \ 符合要求。□\n\n## 4.2 长期行为与平衡](#06_Contents.xhtml_r4_2)\n\n定理 4.1.1 给出了寻找 `a`[`n]`\
  \ 精确值的常用公式。然而，我们通常感兴趣的是系统的长期行为，而不是某个时间点的精确值。也就是说，我们想知道当 `n` 很大时 `a`[`n]` 会发生什么。\n\
  \n**示例 4.2.1**（长期行为）\n让我们通过图形方法检查线性动力系统 `a`[`n`+1] = `ba`[`n]` 在不同 `b` 值下的长期行为。为了简单起见，假设\
  \ `a`[`0]` = 0.1。\n\n1. 将一个空白工作表重命名为“Linear”，并将其格式化为类似于图 4.1。将 **A3:B3** 中的公式向下填充。这将给出在\
