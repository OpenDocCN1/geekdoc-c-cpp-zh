  | 15 | 20 |\n| 20 | 25 |\n| 25 | 30 |\n| 30 | 35 |\n| 40 | 40 |\n\n我们将使用 `d = kF`\
  \ 将作用在弹簧上的力与其伸长或压缩的距离联系起来。胡克定律简单规定 `d = kF`。\n\n[content]\n\n| 重量（牛顿） | 距离（厘米） |\n\
