  \n图 7.16\n\n上一个示例说明了二元决策变量在建模“是-否”决策的另一种完全不同的用途。\n\n### 示例 7.4.3（家居装修决策）\n\nNathan\
  \ 和 Laura 正在试图出售他们的房子，该房子有两个卧室和两个浴室。为了增加房屋的价值，他们想装修一个或多个房间。他们估计了装修每个房间的成本，他们的房地产中介估计了如果对每个房间进行装修，房屋价值的增加量，如表\
  \ 7.10 所示（其中成本和价值增加以千美元为单位）。他们只有 $10,000 用于装修，他们决定不能既装修 2 号浴室又装修 2 号卧室。只有在也装修 1\
  \ 号浴室的情况下，他们才会装修 2 号浴室。同样，只有在也装修 1 号卧室的情况下，他们才会装修 2 号卧室。他们应该装修哪些房间使房屋价值的总增加最大化？\n\
  \n表 7.10\n\n| 房间 | 决策变量 | 装修成本 | 房屋价值增加 |\n| --- | --- | --- | --- |\n| 1 号浴室 |\
  \ `x[1]` | 6 | 9 |\n| 1 号卧室 | `x[2]` | 3 | 5 |\n| 2 号浴室 | `x[3]` | 5 | 6 |\n| 2\
  \ 号卧室 | `x[4]` | 2 | 4 |\n\n这个问题中有四个决策要做出：他们要装修 1 号浴室吗？他们要装修 1 号卧室吗？等等。因此，这四个决策变量中的每一个如果相关的决策为“是”，则等于\
  \ 1，如果决策为“否”，则等于 0。\n\n我们的目标目标是最大化\n\n`Z = 9*x[1] + 5*x[2] + 6*x[3] + 4*x[4]`\n\n\
  他们只有 $10,000 可花费意味着 `6*x[1] + 3*x[2] + 5*x[3] + 2*x[4] <= 10`\n\n由于他们不能既装修 2 号浴室又装修\
  \ 2 号卧室，我们不能让 `x[3] = x[4] = 1`。因此在不等式中，我们有 `x[3] + x[4] <= 1`。由于他们只有在也装修 1 号浴室的情况下才会装修\
  \ 2 号浴室，我们只能有 `x[1] = 1` 且 `x[3] = 1`，或者 `x[1] = 1` 且 `x[3] = 0`（注：此处原文逻辑应为 x[3]\
  \ <= x[1]，翻译遵循原文）。由于他们只有在也装修 1 号卧室的情况下才会装修 2 号卧室，我们有 `x[4] <= x[2]`，即 `x[4] - x[2]\
  \ <= 0`。\n\n将这些整合在一起得到程序\n\n![umath7_16.jpg](img/umath7_16.jpg)\n\n程序被称为二元规划（BIP）。注意，这不符合运输规划的形式，因此我们需要二元约束。为了在\
  \ Excel 中解决此，将一个空白工作表重命名为 `Improvement` 并按照图 7.17 所示进行格式设置，设置 Solver 如图 7.18 所示。结果如图\
  \ 7.19 所示。\n\n![fig7_19.jpg](img/fig7_19.jpg)\n\n图 7.19\n\n### 练习\n\n**方向**：使用二元变量对以下问题进行建模并求解。\n\
