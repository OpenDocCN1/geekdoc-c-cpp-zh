  \ | 8 | 12 | – | – | 12 |\n| **D** | 5 | 5 | 8 | 3 | 6 |\n| **E** | 10 | 12 | 15\
  \ | 10 | – |\n\n### 7.4.15\n战俘营由 4 行 5 列排列的 20 个囚房组成。每个房间安置囚犯的每日成本如下表所示。每个房间只能安置一个囚犯。\n\
  \n| | 列 | | | | |\n| --- | --- | --- | --- | --- | --- |\n| **行** | 1 | 2 | 3 |\
  \ 4 | 5 |\n| --- | --- | --- | --- | --- | --- |\n| **1** | 2 | 4 | 3 | 5 | 1 |\n\
  | **2** | 6 | 2 | 3 | 1 | 5 |\n| **3** | 3 | 5 | 6 | 4 | 2 |\n| **4** | 1 | 2 |\
  \ 6 | 4 | 5 |\n\n假设战斗中抓获了 9 名囚犯，其中 8 名是普通囚犯，1 名是一个真正的“坏分子”。坏分子非常危险，在任何相邻的房间安置囚犯都是安全的。例如，如果坏分子在第\
  \ 3 行第 4 列，记为 `(3, 4)`，则不能在 `(3, 3)`、`(2, 4)`、`(3, 5)` 或 `(4, 4)` 安置囚犯。与其共用角的房间（如\
  \ `(2, 5)`）可以放置囚犯。\n\n1. 假设坏分子被安置在房间 `(1, 1)`。找到其他 8 名囚犯到剩余房间的分配方案，使总成本最低。\n2. 对坏分子的其他位置重复\
  \ a 小题。\n3. a 小中的哪种情况使总成本最低？\n\n\n\n\n在第 7.2 节中，我们研究了以下线性问题：\n\n某社区超市的水果部门经理正在为忙碌的假期期间制作果篮。他销售两种尺寸的篮子：大两种号。他仅剩下\
  \ 200 个苹果和 100 个橙子，正在决定每种尺寸应该制作多少个。每个小篮子可以获得 3 美元利润，需要 3 个苹果和 1 个橙子；每个大篮子可以获得 4\
  \ 美元利润，需要 2 个苹果和 2 个橙子。假设他能卖掉所有产品，他应该制作多少数量的篮子以使利润最大化？\n\n我们用线性规划对该问题建模：\n\n```\n\
  $$\\begin{matrix} \\textbf{Maximize} & P & = & {3s} & + & {4l} & & \\\\ \\textbf{Subject\
  \ to} & & & {3s} & + & {2l} & \\leq & 200 \\\\ & & & {1s} & + & {2l} & \\leq & 100\
  \ \\\\ & & & & & {s,\\, l} & \\geq & 0 \\end{matrix}$$\n``` (7.4)\n\n其中 `s` = 生产的小篮子数量，`l`\
  \ = 生产的大篮子数量。Solver 给出了最优解，即 50 个小篮子和 25 个大篮子，这带来了 250 美元的最大利润。在本节中，我们将通过图形法和代数法来研究求解该规划问题。在下一节中，我们将研究单纯形法的工作原理。\n\
  \n### 示例 7.5.1（图形解法）\n\n要检查该模型的图形解法（7.4），请打开书籍网站上的**Linear Programming** Workbook\
  \ 中的“**Graphical Solution**”工作表，并按照以下步骤操作：\n\n1. 输入决策变量、目标函数和前两个约束条件的名称，如图 7.21\
  \ 所示（无需担心非负性约束）。\n\n2. 生成的图如图图 7.22 所示（`s` 位于横轴，`l` 位于纵轴）。图中包含直线 `3s + 2l = 200`\
  \ 和 `s + 2l = 100`，这些线被称为*约束线*（注意，非负性约束意味着 `s`轴和`l`轴也是约束线）。第一条线下方的区域是满足第一个约束的所有点（即小、大篮子数量的组合）的集合。第二条线下方的点满足第二个约束。*两条*线下方的点满足*两个*约束，并构成了所谓的*可行区域*（feasible\
  \ region）。这些点都是可行解。\n\n3. 向右移动 **Desired Profit**（期望利润）下方的滑块，直到期望利润达到 170.00。向右移动\
  \ **Desired Schedule**（期望计划）下方的滑块，直到 `s` = 22.0 且 `l` = 26.0。生成的图如图图 7.23 所示。标记为“Profit”（利润）的粗黑线被称为*等值线*（level\
  \ curve），它是所有产生 170.00 美元利润点的集合。注意，该线与可行区域相交。这意味着*可能*制作出某种大小篮子的组合来获得 170.00 美元的利润。具体而言，点\
  \ `s` = 22.0 和 `l` = 26.0 位于该等值线上且在可行区域内。这意味着可以制作 22 个小篮子和 26 个大篮子并获得 170.00 美元利润。\n\
  \n4. 继续向右移动 **Desired Profit** 下方的滑块以增加期望利润。注意，当利润高于 250.00 时，等值线不再交叉可行区域。这意味着利润*不可能*超过\
  \ 250.00。这就是我们的最大利润。移动滑块直到期望利润恰好为 250.00，并注意等值线仅与可行区域相交于一点。使用 **Desired Schedule**\
  \ 下方的滑块，我们看到该点的坐标为 `s` = 50 和 `l` = 25，如图图 7.24 所示。这就是我们的最优解，与 Solver 找到的结果完全相同。\n\
  \n![fig7_21.jpg](img/fig7_21.jpg)\n图 7.21\n\n![fig7_22.jpg](img/fig7_22.jpg)\n图\
  \ 7.22\n\n![fig7_23.jpg](img/fig7_23.jpg)\n图 7.23\n\n![fig7_24.jpg](img/fig7_24.jpg)\n\
  图 7.24\n\n在这个以及所有线性规划中，可行区域构成了所谓的*凸集*（convex set），这意味着如果集合中的任意两点由线段连接，则该线段将完全位于集合内部（即它永远不会“离开”集合）。可行区域的*角点*（corner\
  \ point）是两条条约束线的交点。注意，最优解位于角点处。\n\n\n\n通常情况下，为了找到约束线的交点，我们需要在 (7.5) 中将两个变量设为 0 并解出剩余变量。我们选择哪些变量设为\
  \ 0 的方法（即交点的数量）由以下公式给出：\n\n$$\\binom{4}{2} = \\frac{4!}{2!(4 - 2)!} = 6$$\n\n所有这些不同的组合均如表\
  \ 7.11 所示。注意，并非所有组合都是可行的，因为某些组合并不满足 (7.5) 中的非负约束。我们看到四个可行的角点解，最优解是 `s` = 50，`l`\
  \ = 25（即 50 个小篮子和 25 筐大篮子），利润为 $250$。这与我们通过图法和使用 `Solver` 得到的解完全相同。\n\n### 表 7.11\n\
  \n| **点** | `s` | `l` | `y[1]` | `y[2]` | 可行？ | 利润 |\n| --- | --- | --- | --- |\
  \ --- | --- | --- |\n| 1 | 0 | 0 | 200 | 100 | 是 | 0 |\n| 2 | 0 | 100 | 0 | −100\
  \ | 否 | – |\n| 3 | 0 | 50 | 100 | 0 | 是 | 200 |\n| 4 | 200/3 | 0 | 0 | 100/3 | 是\
  \ | 200 |\n| 5 | 100 | 0 | −100 | 0 | 否 | – |\n| 6 | 50 | 25 | 0 | 0 | 是 | 250 |\n\
  \n这个基本思想似乎简单，但在计算效率上存在严重问题。假设我们有一个具有 `m` 个决策变量和 `n` 个不等式约束的线性规划。首先，我们通过上述的方法引入 `n`\
  \ 个松弛变量将约束转换为等式。这总共给了 `m` + `n` 个变量。我们通过将 `m` 个变量设为 0 来找到约束线的交点。这得到了一个包含 `n` 个变量的\
  \ `n` 个方程组，原则上可以通过矩阵技术来求解。\n\n选择这些 `m` 个变量设为 0 的方法（即交点的数量）由以下公式给出：\n\n$$\\binom{m\
  \ + n}{m} = \\frac{\\left( {m + n} \\right)!}{m!\\left( {\\left( {m + n} \\right)\
  \ - m} \\right)!} = \\frac{\\left( {m + n} \\right)!}{m!n!}$$\n\n对于一个具有 25 个决策变量和\
  \ 50 个不等式约束的问题（对于实际应用来说相对较小），交点的数量为：\n\n$$\\binom{75}{25} = \\frac{75!}{25!\\, 50!}\
  \ = 5.25 \\times 10^{19}$$\n\n对于任何计算机来说，要检查这些点太多了。因此，我们想要找到不需要寻找和检查所有交点的算法。其中一种算法就是单纯形法，将在下一节中讨论。\n\
  \n### 练习题\n\n**7.5.1** 假设农产品经理开始制作 50 个小篮子和 25 个大篮子，但发现有两个苹果和五个橘子烂了。总共仍然可能制作 50\
  \ 个小篮子和 25 个大篮子吗？为什么或为什么不？现在应该制作多少才能使利润化？\n\n**7.5.2** 假设农产品经理增加了一个约束，不能制作超过 40\
  \ 个小篮子（假设他还有 200 个苹果和 100 个橘子）。\n\n1. 用图法估计新的最优解。\n2. 假设他自己限制在 30 个小篮子。新的最优解是什么？\n\
  3. 随着允许的小篮子数量减少，最优解在图上发生了什么变化？\n4. 假设我们添加通用约束 `s` ≤ `s[0]`，其中 0 ≤ `s[0]` ≤ 50。找到最优解的公式（记住，`s`\
  \ 和 `l` 必须是整数）。\n\n**7.5.3** 考虑以下线性规划：\n\n$$\\begin{matrix} \\textbf{Minimize} &\
  \ C & = & x & + & {2y} & & \\\\ \\textbf{Subject to} & & & x & + & y & \\geq & 6\
  \ \\\\ & & & {3x} & + & y & \\geq & 9 \\\\ & & & & & {x,\\, y} & \\geq & 0. \\end{matrix}$$\n\
  \n1. 用图法求解该程序（注意可行区域在约束线的*上方*）。\n2. 找到目标函数中 `x` 的系数值，使得最优解为 `x` = 1.5，`y` = 4.5，`C`\
  \ = 15.00。\n\n**7.5.4** 求解该线性规划：\n\n$$\\begin{matrix} \\textbf{Maximize} & P & =\
  \ & {20x} & + & {32y} & & \\\\ \\textbf{Subject to} & & & x & + & y & \\geq & 6\
  \ \\end{matrix}$$\n\n\n\n同样，在单纯形法的图形化解释中，我们决定首先增加 `x[2]`，因为它在目标函数中具有最大的系数。这个变量以及它在表格中对应的列有特殊的名称：\n\
  \n- `主元列`（pivot column）是表格底行中系数绝对值最大的负系数所在列。\n- `入基基变量`（entering basic variable）是对应主元列的变量。\n\
  \n在这种情况下，主元列是第 2 列（对应于 `x[2]`）。\n\n### 第 2 步：通过将其输入表格的左侧列，识别表格中每行的基变量。\n\n识别基变量和非基变量相对容易：\n\
  \n- 在表格 0 中（且仅在表格 0 中），非基变量是决策变量。基变量是松弛变量和 `z`。每行的基变量是系数为 1 的那个基变量。\n- 当从一个表格移动到下一个表格时，基变量保持不变，但有一个例外。基变量中的其中一个被称为\
  \ `出基基变量`（leaving basic variable，其正式定义见下文），会被 `入基基变量` 替换。\n\n在单纯形法的图形化解释中，我们通过将每个约束的右侧值（RHS）除以\
  \ `x[2]` 对应的系数，来决定可以增加多少 `x[2]`。在这里我们执行类似的步骤。\n\n### 第 3 步：计算表格前两行 RHS 与主元列系数之间的比率。这可以通过在图\
  \ 7.26 中输入公式来实现。\n\n![fig7_26.jpg](img/fig7_26.jpg)\n\n图 7.26\n\n在单纯形法的图形化解释中，我们刚刚计算出的最小比率告诉我们可以增加多少\
  \ `x[2]`。对应约束的行被赋予特殊的名称：\n\n- `主元行`（pivot row）是 RHS 与主元列系数之比率最小且为正的某行。\n- `出基基变量`是对应于主元行的变量。\n\
  - `主元`（pivot）是位于主元列与主元行交点处的元素。\n\n在下一个表格中，`出基基变量`将变为非基变量。\n\n### 第 4 步：通过将它们输入表格的右侧，识别主元列、主元行及出基变量。\n\
  \n此时，表格 0 看起来应该像图 7.27。\n\n![fig7_27.jpg](img/fig7_27.jpg)\n\n图 7.27\n\n### 第 5\
  \ 步：对系数矩阵进行初等行变换，使得主元变为 1，且主元列中的所有其他元素都变为 0。这被称为“清除主元列”。\n\n第 5 步可以通过将图 7.28 中的公式输入表格\
  \ 1 来。\n\n![fig7_28.jpg](img/fig7_28.jpg)\n\n图 7.28\n\n### 第 6 步：重复第 2 至 5 步，直到底行不再有负元素。\n\
