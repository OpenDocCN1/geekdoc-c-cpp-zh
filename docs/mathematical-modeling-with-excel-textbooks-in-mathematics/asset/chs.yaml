  \n   ![fig2_37.jpg](img/fig2_37.jpg)\n\n   图 2.37\n\n3. 添加图 2.37 中的公式计算预测值和残差。将第\
  \ 2 行向下填充到第 16 行。\n\n4. 创建 `Residual` 与 `P` 的图，如图 2.38 所示。注意所有残差的幅度至少为 1，其中一个接近\
  \ -9。这表明模型无法很准确地预测任何 `L` 的值。因此，正如之前怀疑的那样，这不是最佳拟合模型。□\n\n   ![fig2_38.jpg](img/fig2_38.jpg)\n\
  \n   图 2.38\n\n### 示例 2.6.4（趋势线）\n\nExcel 将自动为我们计算这些不同的模型。绘制 `L` 与 `P` 的图，添加趋势线，在**类型**下选择你需要的模型类型，并在图表上显示方程。结果如图\
  \ 2.39 所示。注意这些是完全相同的模型。还要注意，对数模型和幂模型的图表很好地捕捉了数据的趋势，而指数模型没有。这证实了我们基于残差图得出的结论。□\n\n\
  ![fig2_39.jpg](img/fig2_39.jpg)\n\n图 2.39\n\n在三个模型中，根据对模型图和残差图的分析，对数模型和幂模型是“最佳”的。在下一节中，我们将介绍更多衡量模型拟合数据集的分析技术。\n\
  \n现在我们有了两个拟合良好的模型，可以用它们做什么呢？至少有两个用途。其次，如果我们知道每位医生的对应人数，就可以用模型预测预期寿命。例如，假设一个国家每位医生对应\
  \ 3500 人。对数模型预测预期寿命为\n\n\n\n\n\n`L` = $103.4 - 5.2876 \\ln(3500) \\approx 60.25$\
  \ 年\n\n而幂模型给出：\n\n`L` = $117.63(3500)^{(-0.0823)} \\approx 60.10$ 年\n\n我们确实可以将 `P`\
  \ = 3, 500 代入指数模型并得到：\n\n`L` = $70.537e^{(-0.00003(3500))} \\approx 63.51$ 年\n\n\
  然而，我们看到指数模型并没有很好地拟合数据，因此将其用于预测是不恰当的。这说明了使用经验模型时的第一个注意事项：**如果一个模型不拟合一组数据，就不要用它来进行预测。**\n\
  \n现在假设一个国家每每位医生对应 100 人。我们可以将 `P` = 100 代入对数模型并得到：\n\n`L` = $103.4 - 5.2876 \\ln(100)\
  \ \\approx 79.04$ 年\n\n然而，请注意 `P` = 100 在原始数据的范围之外。我们不知道 `P` 小于 275 时的数据趋势。它可能会改变，也可能保持不变；我们只是不知道。因此，使用这些任何一个模型来预测\
  \ `P` 小于 275 的 `L` 值都是不恰当的。79.04 年这个值可能准确也可能不准确，因此我们不应该报告这个“预测”。这说明了使用经验模型时的第二个注意事项：**仅使用处于原始数据集范围内的预测变量值。**\n\
