  4. 尝试使用较大的 `λ` 值。这如何影响算法的性能？\n\n**8.4.3** 正如我们在示例 8.4.2 中所示，初始值 `x` (`x[0]`) 会影响梯度法给出的解。这提示我们尝试不同的\
