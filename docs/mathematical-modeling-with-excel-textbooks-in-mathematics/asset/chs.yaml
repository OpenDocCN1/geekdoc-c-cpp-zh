  \ 和 `d` 的值。\n2. 函数 `y = asin(bx + c) + d` 的周期是 `2π/b`。估计数据的周期并用此估计 `b` 的值。\n3. 最初，让\
  \ `c = 0`。\n4. 为了找到 `a` 和 `d` 的值，创建 `y` 与 `sin(bx + c)` 的图，并对转换后的数据拟合趋势线。显示 `R`²\
  \ 值。斜率为 `a` 的值，截距为 `d` 的值。使用函数 `SLOPE` 和 `INTERCEPT` 分别计算 `a` 和 `d` 的值。\n5. 创建滑动条使\
  \ `b` 的值在 -1 到 +1 之间变化，另一个滑动条使 `c` 的值在 -2 到 +2 之间变化（关于滑动条的更多请参见附录 A.4）。\n6. 使用滑动条找到\
  \ `R`² 值最大的 `b` 和 `c` 值。\n7. 在原始数据之上绘制模型图。模型拟合情况如何？\n\n## 3.4 多回归\n\n在之前的章节中，我们讨论了如何用一个预测变量\
  \ `x` 预测一个响应变量 `y` 的值。在本节中，我们将讨论使用两个或多个预测变量 `x[1]`、`x[2]`、……`x[n]`。这个主题被称为多元回归。\n\
  \n考虑预测售价的问题。售价受许多因素影响，包括房龄、居住面积、卧室数量等。表 3.6 列出了社区内 10 户房屋的售价、居住面积（平方英）、土地面积和卧室数量。\n\
