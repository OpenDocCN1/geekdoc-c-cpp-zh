  \n`a[n + 1] − a[n] = k(a[n] − 60)`\n\n其中 `a[n]` 是第 `n` 分时的咖啡温度，`k` 是某个常数。\n\n1.\
  \ 实现该模型预测 0 ≤ `n` ≤ 150 时的咖啡温度。使用滚动条找到使 `a[10]` ≈ 90 的 `k` 值。\n2. 创建 `a[n]` 对 `n`\
  \ 的图表。\n3. 这个模型看起来合理吗？简要说明为什么或不为什么。\n\n## 4.4 线性捕食者-猎物模型\n\n考虑一个包含狐狸和兔子的森林，狐狸吃兔子作为食物。我们想检查这两个物种是否能够长期生存。森林是一个非常复杂的生态系统。为了简化模型，我们将使用以下假设：\n\
  \n1. 狐狸的唯一食物来源是兔子，兔子的唯一捕食者是狐狸。\n2. 在没有兔子的情况下，狐狸将会灭绝。\n3. 在没有狐狸的情况下，兔子数量将会增长。\n4.\
  \ 兔子的存在增加了狐狸种群的增长速率。\n5. 狐狸的存在减少了兔子的增长速率。\n\n我们将使用离散动力模型对这些种群进行建模。系统的每个状态由某一时刻狐狸和兔子的数量组成。由于该状态由两个部分组成，因此这是一个*二维离散动力系统*。\n\
  \n为了建立模型，我们首先需要定义一些变量。令\n\n$$\\begin{matrix} F_{n} & {= \\text{第 n 个月末的狐狸数量}} \\\
  \\ R_{n} & {= \\text{第 n 个月末的兔子数量}} \\end{matrix}$$\n\n与细菌模型一样，假设是以变化率的形式的：`ΔF[n]`\
  \ = `F[n+1]` - `F[n]` 和 `ΔR[n]` = `R[n+1]` - `R[n]`。有许多方法可以通过假设对这些变化率进行建模。在本节中，我们将创建一个线性模型。在下一节中，我们将创建一个非线性模型。\n\
  \n假设 2 和 3 涉及到在不存在对方的情况下每个种群的变化率。建模这些速率的合理方法是说这些速率与种群数量成正比。这得到了差分方程\n\n| $$\\begin{matrix}\
  \ {\\Delta F_{n}} & {= F_{n + 1} - F_{n} = - a\\mspace{180mu} F_{n}} \\end{matrix}$$\
  \ | (4.6) |\n| --- | --- |\n| $$\\begin{matrix} {\\Delta R_{n}} & {= R_{n + 1} -\
  \ R_{n} = d\\mspace{180mu} R_{n}} \\end{matrix}$$ | (4.7) |\n| --- | --- |\n\n其中\
  \ `a` 和 `d` 都在 0 和 1 之间。注意 [(4.6)] 中的比例系数是负数，以反映在没有兔子的情况下，狐狸将会灭绝（负变化率）。[(4.7)] 中的系数是正数，因为在没有狐狸的情况下，兔子数量会增长（正变化率）。\n\
  \n现在，假设 4 和 5 说明在另一个物种存在的情况下，方程 [(4.6)] 和 [(4.7)] 中的这些速率会增加或减少。因此，为了纳入这些假设，我们只需在方程\
  \ [(4.6)] 和 [(4.7)] 的每个方程中添加一个项，得到：\n\n| $$\\begin{matrix} {F_{n + 1} - F_{n}} &\
  \ {= - a\\mspace{180mu} F_{n} + bR_{n}} \\end{matrix}$$ | (4.8) |\n| --- | --- |\n\
  | $$\\begin{matrix} {R_{n + 1} - R_{n}} & {= - cF_{n} + d\\mspace{180mu} R_{n}}\
  \ \\end{matrix}$$ | (4.9) |\n| --- | --- |\n\n其中 `b` 和 `c` 是非负的。注意 [(4.8)] 中添加的项是正数，反映了兔子的增加增加了狐狸种群的增长速率[(4.9)]\
  \ 中添加的项是负数，因为狐狸的存在减少了兔子的增长速率。\n\n重写方程 [(4.8)] 和 [(4.9)] 得到线性方程组形式的模型\n\n| $$\\begin{matrix}\
  \ F_{n + 1} & {= (1 - a)F_{n} + bR_{n}} \\end{matrix}$$ | (4.10) |\n| --- | ---\
  \ |\n| $$\\begin{matrix} R_{n + 1} & {= - cF_{n} + (1 + d)R_{n}} \\end{matrix}$$\
  \ | (4.11) |\n| --- | --- |\n\n由于我们的模型具有线性方程组的形式，它被称为*二维离散动力系统*。该模型可以以矩阵形式写为：\n\n\
  $$\\begin{bmatrix} F_{n + 1} \\\\ R_{n + 1} \\end{bmatrix} = \\begin{bmatrix} 1-a\
  \ & b \\\\ -c & 1+d \\end{bmatrix} \\begin{bmatrix} F_{n} \\\\ R_{n} \\end{bmatrix}$$\n\
  \n(注：由于文本中存在大量重复内容，译文已按要求去重并合并翻译)\n\n\n\n\n2. 将图 4.21 中的公式加入，使兔子的死亡因子从 0 变化到 -0.50，每次增量为\
  \ 0.001。\n\n3. 左右移动滚动条上的滑块，观察系统行为的变化。当死亡因子值小于 −0.123 时，原点似乎具有吸引力，两个物种群都会消灭，如图 4.20\
  \ 所示。当值大于 −0.123 时，原点似乎具有排斥力，两个物种群都会无限制地增长，如图 4.22 所示。这种由参数值变化引起的行为变化称为`分叉`。\n\n\
  ![fig4_21.jpg](img/fig4_21.jpg)\n\n图 4.21\n\n![fig4_22.jpg](img/fig4_22.jpg)\n\n\
  图 4.22\n\n注意，该模型预测两个物种群要么无限制地增长，要么灭绝。这是两种极端情况。第 4.5 节中的模型是对此模型的改进，允许了其他可能性。\n\n\
  ### 练习\n\n#### **4.4.1** 假设兔子的死亡因子为 -0.05，其他因素如图 4.19 所示。对于 500 只狐狸和 200 只兔子的初始种群，我们看到种群在长期来看内是无限制增长的。在这里，我们将研究这是否对所有初始种群都成立。\n\
  \n1. 固定初始兔子数量为 200。如果初始狐狸数量增加或减少会发生什么？为了让两个物种都能存活，初始狐狸数量可以有多大？\n2. 固定初始狐狸数量为 500。如果初始兔子数量增加或减少会发生什么？为了让两个物种都能存活，初始兔子数量可以有多小？\n\
  \n#### **4.4.2** 使用图 4.19 所示的其他参数值和初始种群，研究对兔子出生因子参数的敏感性（即增加和减少兔子出生因子，并观察种群在长期来看的变化）。\n\
  \n1. 兔子出生因子的什么值下种群会灭绝？什么值下种群会无限制地增长？是否存在某些值使得种群似乎达到了平衡？\n2. 一位森林保护员知道，在图 4.19 的参数下，两个种群都会灭绝。为了防止这种情况，她提议建造兔子避难所试图增加兔子出生因子。该模型预测这会对种群生存产生任何影响吗？为什么？为什么不？\n\
  \n#### **4.4.3** 在图 4.19 所示的参数和初始种群下，两个种群都会灭绝。一个狩猎俱乐部声称，如果允许他们每月捕杀（或采集）几只狐狸，种群就能存活。\n\
  \n1. 修改模型以包含这种捕杀。模型支持这一主张吗？如果支持，每月可以捕杀多少只狐狸才能让两个物种都存活？\n2. 一个保护组织声称，每个月应该向森林里投入更多狐狸以使种群存活。你的模型支持这一主张吗？\n\
  \n#### **4.4.4** 一位生物学家用以下模型对另一个森林中的狐狸和兔子的种群建模：\n\n$$\\begin{matrix} F_{n + 1} &\
  \ {= 1.3F_{n} + 0.4R_{n}} \\\\ R_{n + 1} & {= - 0.6F_{n} + 1.05R_{n}} \\end{matrix}$$\n\
  \n该模型对在没有兔子的情况下狐狸的增长或死亡暗示了什么？该模型是否与本节建立模型时使用的假设一致？为什么？为什么不？\n\n#### **4.4.5** 考虑形式如下的二维系统：\n\
  \n$$\\begin{matrix} x_{n + 1} & {= ax_{n} + by_{n}} \\\\ y_{n + 1} & {= cx_{n} +\
  \ dy_{n}} \\end{matrix}$$\n\n1. 如果 $1 - d - \\frac{cb}{1 - a} \\neq 0$，证明唯一的平衡点是\
  \ (0, 0)。\n2. 如果 $1 - d - \\frac{cb}{1 - a} = 0$，证明任何形式为 (`x`, `x(1 − a)`/`b`) 的点都是平衡点。\n\
  \n#### **4.4.6** 考虑以下线性二维离散动力学系统：\n\n$$\\begin{matrix} x_{n + 1} & {= 0.5x_{n} +\
  \ 0.4y_{n}} \\\\ y_{n + 1} & {= - 0.104x_{n} + 1.1y_{n}.} \\end{matrix}$$\n\n1.\
  \ 数值验证该系统的解为：\n\n    $$\\begin{matrix} {x_{n} = 10c_{1}(1.02^{n}) + 5c_{2}(0.58^{n})}\
  \ & {\\;\\;\\;\\text{where}\\;\\;\\;} & {c_{1} = \\frac{y_{0}}{11} - \\frac{x_{0}}{55}}\
  \ \\\\ {y_{n} = 13c_{1}(1.02^{n}) + c_{2}(0.58^{n})} & & {c_{2} = \\frac{13x_{0}}{55}\
  \ - \\frac{2y_{0}}{11}} \\end{matrix}$$\n\n    对于任何初始条件 `x[0]` 和 `y[0]`。（也就是说，计算几个\
  \ `n` 值对应的系统状态，例如 `n` 从 0 到 30，正如我们在图 4.19 中做的那样。然后使用声称的解计算每个 `n` 值对应的状态。尝试不同的初始条件。验证解是否始终给出正确的状态值。）\n\
  2. 使用该解，解释为什么原点是一个排斥平衡点。\n\n### 4.5 非线性捕食者-捕物者模型\n\n让我们考虑类似的狐狸和兔子种群，具有与第 4.4 节相同的假设设置，但以不同的方式建模。我们从：\n\
  \n$$\\begin{matrix} \\Delta F_{n} & {= -af_{n}} \\end{matrix} \\quad (13)$$\n$$\\\
  begin{matrix} \\Delta R_{n} & {= dr_{n}} \\end{matrix} \\quad (14)$$\n\n其中 $0 <\
  \ a \\le 1$ 且 $0 < d \\le 1$。在第 4.4 节中，`F[n]` 和 `R[n]` 的系数是常数。在本节中我们将它们改变。假设 4 说兔子的存在会增加狐子的增长率，因此我们写道：\n\
  \n$$\\begin{matrix} \\Delta F_{n} & {= br_{n}} \\end{matrix} \\quad (15)$$\n\n其中\
  \ $b \\ge 0$。同样，假设 5 说狐子的存在会降低兔子的增长率，因此我们有：\n\n$$\\begin{matrix} \\Delta R_{n} &\
  \ {= -cf_{n}} \\end{matrix} \\quad (16)$$\n\n其中 $c \\ge 0$。重写 (4.15 和 (4.16，得到我们的模型：\n\
  \n$$\\begin{matrix} F_{n + 1} & {= (1 - a)F_{n} + br_{n}} \\end{matrix} \\quad (17)$$\n\
  $$\\begin{matrix} R_{n + 1} & {= -cf_{n} + (1 + d)R_{n}} \\end{matrix} \\quad (18)$$\n\
  \n这种类型的模型被称为 `Lotka-Volterra` 模型，以在 20 世纪 20 代和 30 年代发明该模型的学者命名。\n\n\n\n\n\n该模型预测种群将以相同的周期进行振荡，但存在相位差，这意味着它们不会在同一时间达到峰值。这些振荡导致了兔子与狐狸图中轨迹呈现螺旋状。在自然界中实际上观察到了这种振荡；因此，这个模型比线性模型更合理。\n\
  \n现在我们来计算系统的平衡点。假设 `f`, `r` 是一个平衡点。根据定义，该点必须满足以下方程组：\n\n$$\\begin{matrix} f & {=\
  \ 0.88f + 0.0001fr} \\\\ r & {= - 0.0003fr + 1.039r} \\end{matrix}$$\n\n假设 `f` ≠\
  \ 0 ≠ `r`，解得 `f = 130` 和 `r = 1, 00`。另一个平衡点是 (0, 0)。注意，点 (130, 1200) 位于相平面螺旋的中心。如果我们将工作表中的起始种群数量改为\
  \ 130 只狐狸和 1200 只兔子，我们注意到正如预期的那样，种群数量并没有变化。\n\n为了确定这个平衡点是吸引的还是排斥的，我们需要考虑平衡点附近的起始种群。将初始种群改为\
  \ 129 只狐狸和 1201 只兔子会产生如图 4.25 所示的轨迹。注意轨迹正在远离平衡点。尝试其他的初始种群会相似的结果。轨迹远离平衡点的事实证明该平衡点是排斥的。\n\
  \n![fig4_25.jpg](img/fig4_25.jpg)\n\n图 4.25\n\n**示例 4.5.1**（狩猎）\n\n假设当地狩猎俱乐部想在接下来的两次会议中的一次进行狐狸猎。第一次会议是在现在\
  \ 36 个月后，下一次是在之后的 36 个月。如果他们限制自己只杀死 50 只狐狸，那么这两种方案将如何影响狐狸和兔子的长期种群？\n\n从 110 只狐狸和\
  \ 900 只兔子开始，模型预测在第 36 个月，大约会有 88 只狐狸。杀死 50 只狐狸将这一数字减少到 38。在工作表中，将第 36 个月的狐狸数量改为\
  \ 38，会产生如图 4.26 所示的图。注意，这导致系统行为发生了剧烈变化。种群的波动远比图 4.24 中大得多。因此，在第 36 个月狩猎 50 只狐狸会对长期种群产生巨大影响。\n\
  \n![fig4_26.jpg](img/fig4_26.jpg)\n\n图 4.26\n\n现在将第 36 个月的狐狸数量改回原始公式。在第 72 个月，模型预测种群为\
  \ 212。杀死 50 只狐狸将剩下 162 只。将第 72 个月的狐狸数量改为 162，会产生如图 4.27 所示的图。注意狐狸数量在第 72 个月下降，这导致兔子数量最初增长。然而，从长期来看，种群的行为与图\
  \ 4.24 中非常相似。\n\n![fig4_27.jpg](img/fig4_27.jpg)\n\n图 4.27\n\n为什么这两个案例之间会有如此巨大的差异？注意，最初在第\
  \ 36 个月附近，狐狸数量接近局部最小值。在第 72 个月，它接近局部最大值。在局部最小值附近杀死 50 只狐狸的影响比在局部最大值附近大得多。\n\n因此，狩猎俱乐部不应该安排在第\
  \ 36 个月狩猎；这会对种群产生过大影响。在第 72 个月的狩猎不会产生长期影响。\n\n### 练习题\n\n**4.5.1** 在狐狸兔模型中，我们看到平衡点\
  \ (130, 1200) 在技术上是排斥的。\n\n1. 评价一下这个点的“排斥”程度如何。也就是说，如果种群从靠近 (130, 1200) 开始，它们是很快离开这个点还是不会？\n\
  2. 在图 4.23 中，我们从初始种群 (110, 900) 开始，并看到种群波动很大。假设一位生物学家主张向森林中引入大约 20 只新狐狸和 300 只新兔子，使得初始种群靠近\
  \ (130, 1200)。这有助于稳定种群吗，还是它们会波动得更大？请解释原因。\n\n**4.5.2** 考虑狐狸死亡因子参数。\n\n1. 研究系统对该参数值的敏感性（使用初始种群\
  \ 110 只狐狸和 900 只兔子）。具体来说，评论振幅是如何随着该参数的变化而变化的。\n2. 这个死亡因子可能大于或等于 1 吗？为什么或为什么不（**提示**：参见方程\
  \ (4.13) 和 (4.17)）。\n3. 该参数可以解释为在没有兔子的情况下，从上个月到下个月的狐狸比例。假设一种疾病感染了狐狸种群，减少了每月生存的比例。这会对种群产生什么影响？\n\
  \n**4.5.3** 考虑如下形式的模型：\n\n$$\\begin{matrix} F_{n + 1} & {= aF_{n} + bF_{n}R_{n}}\
  \ \\\\ R_{n + 1} & {= cR_{n} + dF_{n}R_{n}} \\end{matrix}$$\n\n其中 `a`, `b`, `c`,\
  \ 和 `d` 是非零常数。找到用 `a`, `b`, `c`, `d` 表示系统平衡点的公式。\n\n**4.5.4** 假设允许猎人在每个月底杀死 `m`\
  \ 只兔子。\n\n1. 修改模型以考虑这一点（使用图 4.23 中的参数和初始种群）。\n2. 这长期来看会产生什么影响？你认为系统对参数 `m` 敏感吗？\n\
  3. 猎人每个月可以杀死多少兔子仍让种群在长期内生存？\n\n**4.5.5** 一位生物学家担心狐狸和兔子种群的大幅波动。为了应对这个问题，她主张建立兔子避难所以增加生存率，从而增加兔子的出生因子。我们的模型预测这会产生预期效果吗（从图\
  \ 4.23 中的参数和初始条件开始）？解释你的答案。\n\n**4.5.6** 考虑一个包含狐狸和狼的森林，它们竞争相同的食物。如果 `F[n]` 和 `W[n]`\
  \ 分别代表第 `n` 月末狐狸和狼的种群，那么它们的种群模型为：\n\n$$\\begin{matrix} F_{n + 1} & {= 1.2\\, F_{n}\
  \ - 0.001\\, F_{n}W_{n}} \\\\ W_{n + 1} & {= 1.3\\, W_{n} - 0.002\\, F_{n}W_{n}}\
  \ \\end{matrix}$$\n\n1. 考虑参数 1.2 和 1.3。解释为什么它们都大于 1。\n2. 为什么参数 -0.001 和 -0.002 都是负数？\n\
  3. 找到该系统的平衡点并通过图形确定它们是吸引的还是排斥的（仅考虑直到 n = 25 的值）。\n4. 该模型对初始种群敏感吗？为什么或为什么不？\n\n###\
  \ 4.6 流行](#06_Contents.xhtml_rsec4_6)\n\n考虑一个有 1000 人的社区，其中三个成员患了流感。下周报告了五例新的流感病例。我们对疾病在社区中的传播进行建模。\n\
  \n考虑以下假设：\n\n1. 没有人进入或离开社区，社区内没有人与社区外的人接触。\n2. 每个人要么是易感者（可能感染流感）、感染者（目前患有流感并能传播）、或移除者（已患过流感且无法再次感染）。最初每个人要么是易感者要么感染者。\n\
  3. 易感者只有通过与感染者接触才能感染流感。\n4. 一旦某人感染了流感，就不会再次感染。\n5. 流感的平均持续时间为两周，在此期间感染者可以将疾病传染给易感者。\n\
  \n\n\n\n我们将构建的模型被称为 `SIR` 模型（关于此类模型的更多信息，请参阅 Allman, Elizabeth Spencer 和 John A.\
  \ Rhodes 等的 *Mathematical Models in Biology: An Introduction*, Cambridge University\
  \ Press, 2004）。我们首先将人口分为三类：易感者（Susceptible）、感染者（Infected）和康复者（Removed），如假设 2 所示。人们在这三类之间移动，如图图\
  \ 4.28 所示。\n\n![fig4_28.jpg](img/fig4_28.jpg)\n图 4.28\n\n让 `S[n]`、`I[n]` 和 `R[n]`\
  \ 分别代表第 `n` 周结束时易感者、感染者和移除者的数量。与之前的模型一样，我们将首先用差分方程对这些变量的`change`进行建模。\n\n### 建模\
  \ R[n]\n\n让我们从对 `R[n]`建模开始。假设 5 表示流感的平均持续时间为 2 周。这意味着，平均每周有约一半的感染者会康复（或移除）。因此，如果\
  \ `γ = 0.5`，则 `R[n]` 的差分方程为：\n\n| `ΔR[n] = R[n+1] - R[n] = γI[n]` | (4.19) |\n|\
  \ --- | --- |\n\n得到模型：\n\n| `R[n+1] = R[n] + γI[n]` | (4.20) |\n| --- | --- |\n\n\
  参数 `γ` 称为`移除率`（removal rate），代表每周被移除的感染者的比例。数量 `γI[n]` 可以被视为每周“新移除”的人数。\n\n### 建模\
  \ I[n]\n\n现在来考虑 `I[n]`。该数量会由于易感者和感染者相互作用而产生的新感染者而增加，并由于新移除的感染者而减少。因此，差分方程为：\n\n\
  | `ΔI[n] = I[n+1] - I[n] = αS[n]I[n] - γI[n]` | (4.21) |\n| --- | --- |\n\n第一项 `αS[n]I[n]`\
  \ 建模了易感者和感染者之间的相互作用次数，类似于非线性捕食者模型。这个数量可以被视为“新感染”的人数。注意，每周的新感染者人数是上*周*感染人数和易感者人数的乘积。参数\
  \ `α` 称为“传播系数”（transmission coefficient）。它是衡量感染者与易感者之间的相互作用导致感染概率的指标，它可能是一个非常小的数字。方程\
  \ (4.21 产生模型：\n\n| `I[n+1] = I[n] + αS[n]I[n] - γI[n]` | (4.22) |\n| --- | --- |\n\
  \n### 建模 S[n]\n\n最后，为了建模 `S[n]`，请注意该数量仅因新感染者的增加而减少，且不会增加。因此，差分方程为：\n\n| `ΔS[n] =\
  \ S[n+1] - S[n] = -αS[n]I[n]` | (4.23) |\n| --- | --- |\n\n因此，模型为：\n\n| `S[n+1]\
  \ = S[n] - αS[n]I[n]` | (4.24) |\n| --- | --- |\n\n### 整体模型\n\n整体模型由三个方程给出：\n\n\
  $$\\begin{matrix} S_{n + 1} & {= S_{n} - \\alpha\\, S_{n}I_{n}} \\\\ I_{n + 1} &\
  \ {= I_{n} + \\alpha\\, S_{n}I_{n}} \\\\ R_{n + 1} & {= R_{n} + \\gamma I_{n}}\\\
  end{matrix}$$\n\n现在来确定参数 `α` 和 `γ` 的值。我们已经注意到 `γ` 是每周移除的感染者的比例。在这种情况下，`γ = 0.5`。一般来说：\n\
  \n$$\\gamma = \\frac{1}{\\text{传染期的平均持续时间}}$$\n\n为了找到 `α` 的值，我们需要利用我们开始时有 3 个人且在第一周有\
  \ 5 例新病例的事实。从变量来看，这意味着在第 0 周，`I[0] = 3` 且 `S[0] = 9`。在第 1 周，新感染人数为 5，所以：\n\n$$\\\
  begin{matrix} 5 = \\alpha S_{0}I_{0} = \\alpha(3 \\cdot 9)\\end{matrix} \\text{(4.25)}$$\n\
  \n$$\\begin{matrix} \\Rightarrow\\alpha = \\frac{5}{3 \\cdot 9} = 0.185\\end{matrix}\
  \ \\text{(4.26)}$$\n\n### 模型实现\n\n现在我们可以实现模型。\n\n1. 将空白工作表重命名为“Epidemics”，并按照图 4.29\
  \ 所示进行格式化。将第 8 行复制到第 32 行以建模 25 周。\n2. 接下来，使用易感者（Susceptibles）、感染者（Infectives）和移除者（Removals）列中的数据形成如图\
  \ 4.30 所示的图表。\n\n![fig4_29.jpg](img/fig4_29.jpg)\n图 4.29\n\n![fig4_30.jpg](img/fig4_30.jpg)\n\
  图 4.30\n\n注意，当有 4 个初始病例时，传播系数的值降低，疫情最严重的情况发生在大约 2 周后，且严重程度降低。在峰值时期，只有 27 人患了流感，从长期来看，约\
  \ 6 人从未患过流感。\n\n随着初始病例数量的增加，严重程度降低。特别注意，当初始病例达到 10 个或更多时，感染人数永远不会增加。在这种情况下，我们说没有流行。我们看到，如果初始感染人数比最初认为的要，疫情可能没有想象的那么糟糕。\n\
  \n$$\\lim_{n\\rightarrow\\infty}S_{n} \\approx 9$$\n\n此极限值不是 0 的事实在 SIR 模型中是典型的。\n\
  \n### 敏感性分析\n\n现在让我们检查对初始病例的敏感性。在疫情开始时，初始病例往往被低报。通过我们的模型可以轻松评估这一点。我们假设第一周的新病例数为\
  \ 5 是准确的。如果初始病例发生变化，传播系数也会发生变化。通过推广方程 (4.26，我们看到：\n\n$$\\alpha = \\frac{\\text{第一周新病例数}}{(\\\
  text{人数})(\\text{初始人数})} \\text{(4.27)}$$\n\n可以使用公式 (4.27 来轻松计算不同初始病例下的 `α` 值。为此，请按照图\
  \ 4.31 所示修改工作表。\n\n![fig4_31.jpg](img/fig4_31.jpg)\n图 4.31\n\n将第 0 周的感染人数改为 4 到\
  \ 10 之间，并观察系统的变化。三个示例在图 4.32 所示。\n\n![fig4_32.jpg](img/fig4_32.jpg)\n图 4.32\n\n\
  注意，当有 4 个初始病例时，传播系数的值降低，疫情最严重的情况发生在大约 2 周后，且严重程度降低。在峰值时期，只有 27 人患了流感，从长期来看，约 6 人从未患过流感。\n\
  \n### 习题\n\n**4.6.1** 在本节中我们认为初始病例可能被低报。如果是这样且第一周的新病例数是固定的，那么模型预测疫情可能没有最初认为的那么糟糕。可以使用模型研究如果第一周的新病例高于\
  \ 5 但初始病例为 3 时，疫情的严重性。\n\n**4.6.2** 在原始模型中，我们假设人口是恒定的。现在让我们放宽这一假设。从第 1 周开始，每周有 25\
  \ 个人进入社区。假设这些人中的都是易感的。\n\n1. 修改工作表以纳入这些人口，并描述在 100 周内流感传播的情况（使用 `α = 0.00167`，`γ\
  \ = 0.5` 且 `I[0] = 3`）。\n\n2. 如果每周有 100 个新成员进入，会发生什么？\n\n\n\n\n\n### 4.6.3\n假设人口为常数\
  \ 1,000，最初有 50 人患流感（`I[0] = 50`），`α` = 0.00167，`γ` = 0.5。为了尝试降低疫情的严重性，社区对部分感冒者进行了隔离。模拟隔离的一种方法是简单修改传播系数。例如，如果\
  \ 25%的感冒者被隔离，那么感染者与易感者之间的相互作用中只有 75%能够产生新的感染者。因此，新感染人数由以下公式给出：\n\n```\n(0.75 * α)*S[n]*I[n]\n\
  ```\n\n因此，新的“有效”传播系数为 `(0.75 * α)`。\n\n1. 在“**Epidemics**”工作表中添加一个单元格来存储新参数“隔离比例”（Proportion\
  \ Quarantined），将其设置为 0.25，并修改模型以包含该参数。描述隔离 25%的人员与不隔离相比产生了什么影响。\n2. 添加一个滚动条，允许用户在\
  \ 0 到 1 之间改变隔离比例。描述随着隔离比例的变化发生了什么变化。如果比例等于 0 会发生什么？如果等于 1 又发生什么？\n3. 添加一个滚动条，允许用户在\
  \ 0 到 1000 之间改变初始病例数 `I[0]`。\n4. 找到一个隔离比例值，无论 `I[0]` 的取值如何，疫情都不会发生（即感染人数永远不会增加）。估计该隔离比例的最小值。\n\
  \n### 4.6.4\n考虑一种如感冒之类的疾病，人在一旦“治愈”后*并不*具有免疫力。治愈后，人会再次恢复为易感状态。此类疾病可以使用 SIS 模型进行建模，如图图\
