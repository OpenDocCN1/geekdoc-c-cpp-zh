  | 100,000 | 2,205 | 2.5 | 3 |\n| 93,500 | 2,155 | 0.8 | 3 |\n| 95,650 | 2,600 |\
  \ 1.1 | 4 |\n| 75,025 | 1,900 | 0.35 | 3 |\n| 95,000 | 1,200 | 2.5 | 2 |\n| 80,250\
  \ | 2,050 | 1.8 | 3 |\n| 85,250 | 2,250 | 0.9 | 4 |\n| 121,250 | 2,490 | 1.8 | 3\
  \ |\n| 94,575 | 2,390 | 1.6 | 2 |\n| 109,000 | 3,100 | 1.0 | 4 |\n\n**示例 3.4.1**（单预测变量）。\n\
  \n考虑图 3.33 所示的售价与面积、售价与土地面积的图，以及每个对应的线性回归方程。\n\n![fig3_33.jpg](img/fig3_33.jpg)\n\
  \n图 3.33\n\n\n\n\n\n注意，预测变量 `Area` 的 `R²` 值高于 `Acres` 的 `R²` 值。这意味着关于 `Area` 的 `Selling\
  \ Price` 回归方程比关于 `Acres` 的方程提供`更好`的预测 `Selling Price`。我们可以说，在这两个变量中，`Area` 是售价最好的单变量预测因子。\n\
  \n假设某房屋的面积为 2,800 ft²。我们可以使用关于 `Area` 的 `Selling Price` 回归方程预测该房屋的售价为 `12.852(2,800)\
  \ + 66,239 = $102,224`。当然，这只是价格的点估计，而且可能不是一个很准确的估计，因为回归方程的 `R²` 值仅为 0.2232。□\n\n\
