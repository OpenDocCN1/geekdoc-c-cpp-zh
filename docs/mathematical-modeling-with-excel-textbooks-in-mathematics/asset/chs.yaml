  \n## 5.5 二次种群模型\n在本节中，我们用两个微分方程对两个物种进行建模，并使用欧拉法分析系统的行为。\n\n### 示例 5.5.1（竞争的狐狸与狼）\n\
  考虑森林。在没有竞争的情况下，狐狸的增长率为 10%，狼的增长率为 25%。森林可以支持 10,000 只狐狸或 6,000 只狼。这两个物种竞争相同的资源，但竞争的程度尚未知。我们想知道这两个物种是否可以共存，还是其中一个占据主导地位。\n\
  为了对该场景建模，定义：\n$$\\begin{matrix} {F(t)} & { \\text{t 时间份的狐狸数量} \\\\ {W(t)} & { \\\
  text{t 时间份的狼数量} \\end{matrix}$$\n我们可以使用示例 5.2.2](#14_Chapter05.xhtml_stat5_3) 中的逻辑方程来根据承载能力建模增长率：\n\
  $$\\begin{matrix} \\frac{dF}{dt} & {= 0.10\\left( 1 - \\frac{F}{10,000}} \\right)F}\
  \ \\\\ \\frac{dW}{dt} & {= 0.25\\left( 1 - \\frac{W}{6,000}} \\right)W} \\end{matrix}$$\n\
  现在为了模拟竞争的影响，我们假设竞争会与两个数量的乘积成正比地减少增长率（这个乘积模拟了两个物种的相互作用）。这产生：\n\n\n\n\n题目没有指定 `c[1]`\
  \ 和 `c[2]` 的值，因此让我们考虑可能的值。`FW` 项可以被认为模拟了物种*之间*的竞争，而平方项则模拟了物种*内部*的竞争。不同物种竞争的是相似但不同的资源。物种内部的成员竞争的是完全相同的资源。因此，物种内部竞争的影响比物种间的竞争更大似乎是合理的。换句话说，`FW`\
  \ 项系数的绝对值比平方项系数的绝对值小似乎是合理的。这表明如下形式的模型：\n\n$$\\begin{matrix} \\frac{dF}{dt} & {=\
  \ 0.10F - \\frac{0.10}{10,000}F^{2} - \\lambda\\frac{0.10}{10,000}FW} \\\\ \\frac{dW}{dt}\
  \ & {= 0.25W - \\frac{0.25}{6,000}W^{2} - \\lambda\\frac{0.25}{6,000}FW,} \\end{matrix}$$\n\
  \n其中 `λ` 是 0 到 1 之间的某个参数。□\n\n示例 5.5.1 中的模型是*二次种群模型*（Quadratic Population Model）的一个例子，其一般形式为：\n\
  \n$$\\begin{matrix} \\frac{dx}{dt} & {= a_{1}x + b_{1}x^{2} + c_{1}xy} \\\\ \\frac{dy}{dt}\
  \ & {= a_{2}y + b_{2}y^{2} + c_{2}xy.} \\end{matrix}$$\n\n参数 `a` 描述在没有竞争的情况下每个种群的变化。参数\
  \ `b` 可以被认为是物种*内部*竞争如何影响增长速率。参数 `c` 描述物种*之间*竞争如何影响速率。这些参数的正负符号告诉我们许多关于系统的信息。例如，在示例\
  \ 5.5.1 的两个方程中，`a` 是正的，而 `b` 和 `c` 是负的。这告诉我们，在没有竞争的情况下，两个物种都会增长，且物种内部的竞争以及物种间的竞争都会降低这两个增长速率。\n\
  \n示例 5.5.1 中的问题是：“这两个物种可以共存吗？”为了回答这个问题，我们需要分析种群的长期行为，并确定这如何受 `λ` 值的影响。\n\n### 示例\
  \ 5.5.2（分析二次种群模型）\n\n要图形化分析示例 5.5.1 中的模型，请遵循以下步骤：\n\n1. 将一个空白工作表重命名为“Quadratic”，并按照图\
  \ 5.28 进行进行格式化。（注意，在这个例中，物种 1 是狐狸，物种 2 是狼。）\n\n   ![fig5_28.jpg](img/fig5_28.jpg)\n\
  \n   图 5.28\n\n2. 添加图 5.29 中的公式，并将第 15 行复制到第 214 行。\n\n   ![fig5_29.jpg](img/fig5_29.jpg)\n\
  \n   图 5.29\n\n3. 创建一个如图 5.30 所示的图。将 `x`轴最小值和最大值设置为 0 和 10,000，将 `y`轴最小值和最大值设置为\
  \ 0 和 6000。图表显示种群从 (1000, 1000) 开始，并在 (9333, 1333) 附近停止变化。因此，有了这些参数和初始种群，狐狸和狼确实可以共存。\n\
  \n   ![fig5_30.jpg](img/fig5_30.jpg)\n\n   图 5.30\n\n4. 初始种群 (1000, 1000) 是任意的，让我们尝试不同的值看看会发生什么。添加图\
  \ 5.31 中的公式来生成随机初始种群。（如果这些公式不起作用，请选择**工具** → **加载项…**，选择**分析工具库**并按**确定**。）\n\n\
  \   ![fig5_31.jpg](img/fig5_31.jpg)\n\n   图 5.31\n\n   多次按下 `F9` 键尝试不同的初始种群。注意，对于每种情况，种群都会稳定在\
  \ (9333, 1333) 附近。因此，无论初始种群如何，种群似乎都可以共存（至少在当前的 `λ` 取值下）。\n\n   □\n\n点 (9333, 1333)\
  \ 似乎是系统的平衡点。平衡点在种群模型中非常重要，因为它们指示了种群长期来看会发生的情况。\n\n### 示例 5.5.3（二次种群模型的平衡点）\n\n要找到二次种群模型的平衡点，我们需要求解代数方程组：\n\
  \n$$\\begin{matrix} 0 & {= a_{1}x + b_{1}x^{2} + c_{1}xy} \\end{matrix} (5.6)$$\n\
  $$\\begin{matrix} 0 & {= a_{2}y + b_{2}y^{2} + c_{2}xy} \\end{matrix} (5.7)$$\n\n\
  显然，(0, 0) 是一个平衡点。如果 $x \\neq 0$ 且 $y = 0$，根据 5.6 得：\n\n$$\\begin{matrix} 0 & {=\
  \ a_{1}x + b_{1}x^{2} = x(a_{1} + b_{1}x)} \\\\ \\Rightarrow & x = -\\frac{a_{1}}{b_{1}}}\
  \ \\end{matrix}$$\n\n因此 $(\\frac{a_{1}}{b_{1}}, 0)$ 是另一个平衡点。如果 $x = 0$ 且 $y \\neq\
  \ 0$，类似的计算得出 $(0, -\\frac{a_{2}}{b_{2}})$ (5.9) 为另一个。假设 $x \\neq 0$ 且 $y \\neq 0$，我们需要求解：\n\
  \n$$\\begin{matrix} 0 & {= a_{1}x + b_{1}x^{2} + c_{1}xy} \\\\ 0 & {= a_{2}y + b_{2}y^{2}\
  \ + c_{2}xy} \\end{matrix}$$\n\n将第一个方程除以 $x$，第二个方程除以 $y$，并重写为：\n\n$$\\begin{matrix}\
  \ b_{1}x + c_{1}y & {= a_{1}} \\\\ c_{2}x + b_{2}y & {= a_{2}} \\end{matrix}$$\n\
  \n将其写成矩阵：\n\n$$\\begin{bmatrix} b_{1} & c_{1} \\\\ c_{2} & b_{2} \\end{bmatrix}\\\
  begin{bmatrix} x \\\\ y \\end{bmatrix} = \\begin{bmatrix} - a_{1} \\\\ - a_{2} \\\
  end{bmatrix}$$\n\n现在，根据克莱姆法则（Cramer's rule）得到：\n\n$$x = \\frac{\\left| \\begin{matrix}\
  \ - a_{1} & c_{1} \\\\ - a_{2} & b_{2} \\end{matrix} \\right|}{\\left| \\begin{matrix}\
  \ b_{1} & c_{1} \\\\ c_{2} & b_{2} \\end{matrix} \\right|} = \\frac{- a_{1}b_{2}\
  \ + a_{2}c_{1}}{b_{1}b_{2} - c_{1}c_{2}} \\text{ 且 } y = \\frac{\\left| \\begin{matrix}\
  \ b_{1} & - a_{1} \\\\ c_{2} & - a_{2} \\end{matrix} \\right|}{\\left| \\begin{matrix}\
  \ b_{1} & c_{1} \\\\ c_{2} & b_{2} \\end{matrix} \\right|} = \\frac{- a_{2}b_{1}\
  \ + a_{1}c_{2}}{b_{1}b_{2} - c_{1}c_{2}}$$\n\n因此，第四个平衡点是：\n\n$$\\left( \\frac{-\
  \ a_{1}b_{2} + a_{2}c_{1}}{b_{1}b_{2} - c_{1}c_{2}}, \\frac{- a_{2}b_{1} + a_{1}c_{2}}{b_{1}b_{2}\
  \ - c_{1}c_{2}} \\right) (5.10)$$\n\n只要 $b[1]b[2] - c[1]c[2] \\neq 0$。这一点特别重要，因为\
  \ $x$ 和 $y$ 坐标都是（可能的）正数。在这个平衡点，两个物种共存且种群不发生。□\n\n### 示例 5.5.4（计算平衡点）\n\n我们可以很容易在\
  \ Excel 中实现公式 (5.8)、(5.9) 和 (5.10)，并使用结果分析示例 5.5.1 中的狐-狼模型。在 **Quadratic** 工作表中，添加图\
  \ 5.32 中的公式。\n\n   ![fig5_32.jpg](img/fig5_32.jpg)\n\n   图 5.32\n\n我们看到系统具有平衡点 $\\\
  left( 9333.\\overline{3}, 1333.\\overline{3} \\right)$、(10, 000, 0)、(0, 6, 000)\
  \ 和 (0, 0)。由于所有轨迹似乎都被吸引到点 $\\left( 9333.\\overline{3}, 1333.\\overline{3} \\right)$，我们有图形证据表明该平衡点是吸引的。其他平衡点似乎是斥性的。\n\
  \n现在看看随着 `λ` 的变化发生了什么。添加一个滚动条，将最小值和最大值分别设置为 0 和 1000，并将链接单元格设置为 **B6**。添加图 5.33\
  \ 中的公式。\n\n   ![fig5_33.jpg](img/fig5_33.jpg)\n\n   图 5.33\n\n使用滚动条，我们看到当 `λ` 在\
  \ 0 到 0.6 之间时，第一个平衡点具有正 $x$ 和 $y$ 坐标，且它似乎总是吸引的。因此这两个物种可以共存。当 `λ` > 0.6 时，平衡点的 $y$\
  \ 坐标为负值。这意味着物种 2（狼）将会灭绝，狐狸将占据主导地位。\n\n\n\n\n因此，为了回答“这两个物种能否共存？”这个问题，我们需要确定哪种可能性更大：`λ`\
  \ < 0.6 还是 `λ` > 0.6。种内竞争远大于种间竞争是合理的。这意味着 `c[i]` 远小于 `b[i]`，因此 `λ` 必须非常小（即 `λ` <\
  \ 0.6）。因此我们得出结论：这两个物种可以共存。通用二次群体模型可以适用于各种场景，如下一个示例所示。\n\n示例 5.5.5（捕食者-猎物系统）\n\n\
  考虑 `第 4 章` 中讨论的狐狸和兔子的例子，其中兔子是狐狸唯一的食物来源。假设如果没有兔子，狐狸以每月 8% 的速度死亡；而如果没有狐狸，兔子种群将以每月\
  \ 4% 的速度增长。兔子的存在增加了狐狸种群的增长，而狐狸的存在减少了兔子种群的增长。\n\n如果 `F(t)` 和 `R(t)` 代表时间 `t` 时狐狸和兔子的数量，我们可以使用微分方程对该系统进行建模（而不是像\
  \ `第 4 章` 那样使用差分）：\n\n```\n\\begin{matrix} \\frac{dF}{dt} & = -0.08F + c_{1}FR \\\
  \\ \\frac{dR}{dt} & = 0.04R + c_{2}FR \\end{matrix}\n```\n\n在 `第 4 章` 中，我们取 `c[1]`\
  \ = 0.0001 且 `c[2]` = −0.0003。注意，这个模型是没有平方项的二次群体模型（即 `b[1]` = `b[2]` = 0）。将这些参数值输入到\
  \ `Quadratic` 工作表中，设置初始种群为 100 只狐狸（物种 1）和 1000 只兔子（物种 2），且 `h` = 0.6，将得到如图 `图 5.34`\
  \ 所示的轨迹（你可能需要更改轴上的刻度来重现此图）。\n\n![fig5_34.jpg](img/fig5_34.jpg)\n\n### 图 5.34\n\n\
  注意第一个平衡点是 $(133.\\overline{3}, 800)$，轨迹围绕该点形成一个环。（注意，在理论上轨迹是一个闭合环，但由于我们的图只是近似，因此环是开放的。使用较小的\
  \ `h` 值和更多的欧拉法迭代将产生更准确的图。）其他种群会给出相似的结果。初始种群离平衡点越远，产生的环就越大。这意味着这两个种群随时间变化。由于轨迹没有被平衡点吸引，我们有证据表明它是排斥的。这些环意味着种群随时间波动。一些生物学家认为这种模型是不符合实际的，因为在自然界中，种群并不倾向于波动。相反，它们倾向于向平衡点移动，正如狐-狼模型所示。\n\
