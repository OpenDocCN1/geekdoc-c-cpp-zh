  \ `d`, `x`, 和 `y` 表示 $\\frac{dy}{dx}$。代入关系 `a = \\lambdac` 和 `b = \\lambdad`。在直线\
  \ `x = ny` 上计算该斜率。证明你在 c 部分的关系保证了该斜率小于 $\\frac{1}{n}$。\n\n## **5.7.3** 考虑工作单 **Vietnam**\
  \ 中模拟的常规战斗与游击战斗。我们使用该工作单通过图形法估计 `n` 的值，使得常规军队获胜。在练习中，我们通过分析法找到这个值。\n\n1. 让 `G[1]`\
