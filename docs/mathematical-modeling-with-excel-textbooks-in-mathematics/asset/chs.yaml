  \ 如果第 c 部分发现的狩猎水平持续，这两个物种的数量会发生什么变化？\n\n## 5.7 兰彻战斗模型](#06_Contents.xhtml_rsec5_7)\n\
  \n在本节中，我们展示一个微分方程组的应用，这与之前介绍的人口模型非常不同。然而，我们将看到所得模型并没有太大区别。\n\n在第一次世界大战期间，F. W. 兰彻（F.\
  \ W. Lanchester）设计了若干战争数学模型。从那时，他的模型被广泛研究并应用于从“孤立战斗到整个战争”的各种场景。在本节中，我们将图形化地分析一个由\
  \ Courtney S. Coleman 在《Modules in Applied Mathematics》第 1 卷（William F. Lucas 编，Springer-Verlag，1983\
  \ 年，第 109–131 页）中的“Combat Models”章节的模型。\n\n令 `A(*t*)` 代表时间 `t` 时军队 A 中的战斗员人数。`A(*t*)`\
  \ 随时间变化的速率 `dA/dt` 受几个因素的影响，包括敌军造成的伤亡、疾病、逃兵和援军。为了简单起见，我们只考虑第一个因素。\n\n由于敌军造成的伤亡导致战斗员损失的速率被称为*战斗损失率*（CLR）。在数学符号中，它由微分方程描述：\n\
  \n$$\\frac{dA}{dt} = - \\text{CLR}$$\n\n军队分为大类：常规军和游击军。常规军在明确的战线上作战，而游击军以小部队为单位作战。考虑一个常规军\
  \ `C` 对抗游击军 `G` 的场景。我们可以用基础微分方程组描述它：\n\n$$\\begin{matrix} \\frac{dC}{dt} & {= \\\
  text{CLR}} \\\\ \\frac{dG}{dt} & {= \\text{CLR}} \\end{matrix}$$\n\n战斗效能 `g` 定义为：（此处原文似乎漏公式，应为单个游击队员的暴露部分/占据面积）\n\
  \n（注：原文此处为 $g = \\frac{\\text{Area of the exposed part of a single guerilla...}$，根据上下文逻辑补全）\n\
  \n$$g = \\frac{\\text{单个游击队员的暴露部分}}{\\text{占据的面积}}$$\n\n击中对手的概率 `p` 定义为：\n\n$$p\
  \ = \\frac{\\text{单个战斗员的暴露部分}}{\\text{总面积}}$$\n\n战斗效能 `c` 的定义方式与 `g` 。由于游击军 `G`\
  \ 隐藏在森林中，击中对手的概率为：\n\n$$c = \\frac{\\text{单个战斗员的暴露部分}}{\\text{总面积}}$$\n\n这里建模的战斗类型在越南很常见，美军和南越军对抗游击队的北越军和越共。由于这个原因，这个模型被称为“越南模型”。\n\
  \n现在我们将使用这个模型来分析问题：“什么样的初始人数比例（`C*[0]/G*[0]` = *n*）是军队 C 获胜所需的？”当军队 G 先耗尽战斗员时，我们说军队\
  \ C “获胜”。\n\n为了回答这个问题，我们将方程解出关于 `C` 的 `G`。注意到\n\n$$\\frac{dC}{dG} = \\frac{- g\\\
  , G}{- c\\, C\\, G} = \\frac{g}{c\\, C}$$\n\n交叉相乘，得到：\n\n$$g\\, dG = c\\, dC$$\n\
  \n现在对两边积分得：\n\n$$g\\, G = \\frac{1}{2}c\\, C^{2} + M$$\n\n其中 *M* 是任意常数。除以 *g* 得到：\n\
  \n$$G = \\frac{c}{2g}\\, C^{2} + \\frac{M}{g}$$\n\n\n\n\n方程 (5.18) 并没有用 `t` 的项给出\
  \ `G` (`t`) 或 `C` (`t`)，但它给出了 `G` (`t`) 和 `C` (`t`) 之间的 `relation`。我们可以通过图表来回答这个问题。\n\
  \n现在为了找到 `M` 的值，我们需要使用 `G` (0) = `G[0]` 和 `C` (0) = `C[0]` 的条件。将 (5.18) 代入 `t` =\
  \ 0 得到：\n\n$$\\begin{matrix} {G(0)} & {= \\frac{c}{2g}\\, C(0)^{2} + \\frac{M}{g}}\
  \ \\\\ {\\Rightarrow\\quad G_{0}} & {= \\frac{c}{2g}\\, C_{0}^{2} + \\frac{M}{g}}\
  \ \\\\ {\\Rightarrow\\quad M} & {= g\\, G_{0} - \\frac{c}{2}\\, C_{0}^{2}} \\end{matrix}$$\n\
  \n为了实现此模型并分析它以找到军队 `C` 胜利的 `n` 值，请遵循以下步骤：\n\n1.  将一个空白工作表重命名“Vietnam”，并按照图 5.43\
  \ 进行格式设置。将第 11 行复制到第 309 行，以计算 300 组 `C` 和 `G` 的值。注意，`A` 列中的 `C` 值是以 15 为增增的（即它们不是通过任何公式计算出的）。`B`\
  \ 列中对应的 `G` 值使用方程 (5.18) 计算。另请注意，图 5.43 中参数的值是任意的，但是合理的。\n\n2.  添加一个滚动条，将链接单元设置为\
  \ `D1`，并将最小值和最大值分别设置为 0 和 1500。创建一个类似于图 5.44 中的图。\n\n![fig5_43.jpg](img/fig5_43.jpg)\n\
  图 5.43\n\n![fig5_44.jpg](img/fig5_44.jpg)\n图 5.44\n\n在 5.44 中我们看到，当 `n` = 8（即军队\
