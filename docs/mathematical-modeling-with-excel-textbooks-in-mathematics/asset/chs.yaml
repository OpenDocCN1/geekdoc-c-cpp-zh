  \n   图 2.34\n\n### 示例 2.6.3（指数模型）\n\n数据的分布图不像指数模型的图，因此这种模型可能不是最好的。然而，我们将为数据拟合一个模型。指数模型的形式为\
  \ `L` = `ae`^(`bP`)。为了找到 `a` 和 `b` 的值，我们对模型的两边取自然对数，得到：\n\nln(`L`) = ln (`a`*e`^(`bP`)) = ln `a` + ln (`e`^(`bP`)) = ln `a` + `b`*P*。因此，对\
  \ ln `L` 与 `P` 的图拟合的直线将斜率为 `b`，`y` 截距为 ln `a`。\n\n1. 将一个空白工作表命名为 `Exponential` 并按照图\
  \ 2.35 所示进行格式设置。从工作表 `Power`复制剩余数据并将单元格 `C2`向下填充到第 13 行。\n\n   ![fig2_35.jpg](img/fig2_35.jpg)\n\
