  \n![fig7_34.jpg](img/fig7_34.jpg)\n\n## 7.7 敏感性分析\n\n再次考虑由以下模型建立的问题：\n\n```\n\\\
  begin{matrix} \\textbf{Maximize} & P & = & {3x} & + & {4y} & & \\\\ \\textbf{Subject\
  \ to} & & & {3x} & + & {2y} & \\leq & 200 \\\\ & & & x & + & {2y} & \\leq & 100\
  \ \\\\ & & & & & {x,\\, y} & \\geq & 0 \\end{matrix}\n```\n\n其中 `x` = 小果筐的数量，`y`\
  \ = 大果筐的数量。这有一个最优解 `x` = 50，`y` = 25，最大利润为 250。在进行敏感性分析时，我们将分析两个问题：\n\n1. 单位利润（即目标函数中的系数）可以变化多少而最优解保持不变？\n\
  2. 增加资源数量会增加多少利润？\n\n这两个问题在经济学上很重要。如果某个商品的利润突然发生变化，管理层将调整生产计划以确保利润最大化。此外，管理层可能对某些资源进行投资（例如雇用更多员工、更新设备）。他们需要知道这是否会增加利润，如果是的话会增加多少。另一个原因是问题中的系数通常是估计值。回答这些问题可以帮助我们理解这些估计值的重要性。\n\
  \n### 单位利润\n\n我们首先通过图形法分析目标函数中的系数变化时最优解会发生什么。将程序输入**图形解**工作表。将小果筐的单位利润（目标函数中 `x`\
  \ 的系数）改为 3 以上以下的值，并保持大果筐的利润为 4。对于每种情况，找到最优解。\n\n图 7.32 展示了三个这样的例子（虚线是约束线，实线是对应于三个目标函数的等值线）。注意当单位利润为\
  \ 2.75 或 4 时，最优解保持在(50, 25）（尽管每种情况下 P 的最大值不同）。当单位利润为 9 时，最优解变为(66.67, 0)。通常情况下，我们看到单位利润的小幅变化会让解保持不变。如果变化足够大，解就会改变。如果在保持小果筐利润为\
  \ 3 的情况下改变大果筐的利润，我们会观察到现象。\n\n从图形上观察，只要利润线的斜率处于约束线的斜率之间，最优解就会保持不变。为了量化这一点，我们计算约束线的斜率：\n\
  \n\n\n因此，只要利润线的斜率在 $- \\frac{3}{2}$ 和 $- \\frac{1}{2}$ 之间，最优解将保持不变。\n\n现在假设小篮子的单位利润为\
  \ `C`。那么，利润方程为：\n\n$$P = Cx + 4y\\;\\Rightarrow\\; y = - \\frac{C}{4}x + \\frac{P}{4}$$\n\
  \n由此我们看到，利润线的斜率仅由 `C` 的值决定。利润值 `P` 的大小不影响斜率，只影响 `y` 截距。因此，如果\n\n$$- \\frac{3}{2}\
  \ \\leq - \\frac{C}{4} \\leq - \\frac{1}{2}\\;\\Rightarrow\\; 2 \\leq C \\leq 6$$\n\
  \n那么最优解将保持在 (50, 25)。但注意，这仅在大篮子的单位利润固定为 4 时才有效。\n\n现在让 `K` 代表大篮子的单位利润。利润方程为：\n\n\
  $$P = 3x + Ky\\;\\Rightarrow\\; y = - \\frac{3}{K}x + \\frac{P}{K}$$\n\n我们再次看到利润方程的斜率仅由\
  \ `K` 的值决定。因此，如果\n\n$$- \\frac{3}{2} \\leq - \\frac{3}{K} \\leq - \\frac{1}{2}\\\
  ;\\Rightarrow\\; 2 \\leq K \\leq 6$$\n\n那么最优解将保持在 (50, 25)。与之前类似，这仅在小篮子的单位利润固定为\
  \ 3 时才有效。\n\n因此，第一个问题的答案是：小篮子的单位利润可以减少 $1 或增加 $3。大篮子的单位利润可以变化 $2。无论在哪种情况下，解 (50,\
  \ 25) 都将保持为最优。这仅当其中一个单位利润发生变化时有效。如果两者都发生变化，我们必须重新求解问题（或进行更多分析）。\n\n## 增加资源\n\n我们已经找到了第二个问题的答案。它体现在图\
  \ 7.33 所示的单纯形法最终表的最后一行中。\n\n![fig7_33.jpg](img/fig7_33.jpg)\n\n图 7.33\n\n数字 0.5\
  \ 和 1.5 是最终表底行松弛变量的系数，分别称为苹果和橙子资源的“影子价格”（shadow prices）。这些数字告诉我们，增加一个单位苹果将使最大利润增加\
  \ $0.5，增加一个单位橙子将使最大利润增加 $1.50。\n\n为了理解为什么这些影子价格具有这些含义，观察表 2 的底行如何通过公式与表 0 相关：\n\n\
  $$\\begin{matrix} \\text{(表 2 的底行)} & {= 0.5 \\times \\text{(表 0 的第 1 行)}} \\\\\
  \ & {+ 1.5 \\times \\text{(表 0 的第 2 行)}} \\\\ & {+ \\text{(表 0 的第 3 行)}} \\end{matrix}$$\n\
  \n因此，如果表 0 第 1 行的右侧值（RHS）增加 1（即苹果数量增加 1），则表 2 底行的 RHS 增加 0.5（即最大利润增加 0.5）。同样，如果表\
  \ 0 第 2 行的 RHS 增加 1，则表 2 底行的 RHS 增加 1.5。\n\n通常，这意味着如果苹果的数量改变了 `n` 个（正或负），那么：\n\n\
  | 最大利润的变化 = 0.5*n* | (7.6) |\n| --- | --- |\n\n注意，这一结论仅在我们只改变苹果数量时才成立。\n\n然而，这一结论仅在苹果数量在限制范围内范围内变化时才有效。为了说明这一点，请在\
  \ **Graphical Solutions**（图形解法）工作表中画出该计划的可行区域（使用原始单位利润）。将苹果的数量（约束 1 的 RHS）更改为 200\
  \ 以上和以下的值。每次都寻找最优解。图 7.34 中给出了三个这样的例子，其中实线是约束 2 线，虚线是三种不同苹果数量的约束 1 线，实心点是这三种情况的最优解。\n\
  \n![fig7_34.jpg](img/fig7_34.jpg)\n\n图 7.34\n\n注意，对于 230 个苹果，最优解仍然位于约束 1 线和约束 2\
  \ 线的交点（与原始解不同，但仍然发生在该交点）。对于 325 个苹果，苹果数量不再是约束，最优解出现在约束 2 线的 `x`截距处。对于 85 个苹果，橙子的数量不是约束，最优解出现在约束\
  \ 1 线的 `y`截距处。因此我们看到，如果苹果的数量变化足够，我们解的性质就会改变。这意味着方程 (7.6) 仅在有限区域内成立。\n\n\n\n\n单元\
  \ `E15` 给出了苹果的影子价格。单元 `F15` 显示可用苹果的数量。单元 `G15` 和 `H15` 告诉我们，如果苹果数量增加 100 或减少 100\
  \ 个（即在 100 到 300 之间），则影子价格的解释是有效的。第 16 行提供了橙子的类似结果。\n\n这些与我们之前得出的结论完全相同。\n\n###\
  \ 练习\n\n**7.7.1** 假设经理可以以 20 美元的价格购买一箱 50 个橙子或一箱 50 个苹果来制作果篮，但他只能购买其中一种。他应该购买哪一个？为什么？\n\
  \n**7.7.2** 假设有 350 个苹果和 100 个橙子可用于果篮。生成敏感性报告，并解释为什么苹果的影子价格为 0，允许增加量为 $\\infty$，而允许减少量仅为\
  \ 50。\n\n**7.7.3** 一家玩具公司生产汽车和卡车。每辆汽车使用 1 单位塑料和 20 单位金属，利润 14 美元。每辆卡车使用 1 单位塑料和\
  \ 30 单位金属，利润 16 美元。该公司有 100 单位塑料和 2400 单位金属可用。为了确定使利润最大化的每种玩具制造数量，我们需要求解该程序：\n\n\
  ![umath7_44.jpg](img/umath7_44.jpg)\n\n其中 `x[1]` = 汽车的数量，`x[2]` = 生产的卡车数量。这是我们在练习\
  \ 7.6.2 中解决的相同程序。\n\n1. 使用你在练习 7.6.2 求解方案中的最终表，寻找汽车和卡车的影子价格。\n2. 手动找到每个资源影子价格解释有效的范围。\n\
  3. 手动找到单位利润的范围，在该范围内解将保持保持最优。\n4. 使用 `Solver` 验证你的计算结果。\n\n### 延伸阅读\n\n- 关于运筹学一切内容的经典参考，请参\
  \ Hillier, F. 和 G. Lieberman, *Introduction to Operations Research*, 第七版, McGraw\
  \ Hill, 2001。\n- 有更多关于单纯形法、敏感性分析、线性规划以及本章其他主题的信息，请参见 Winston, Wayne L. 和 Munirpallam\
  \ Venkataramann, *Introduction to Mathematical Programming, Operations Research:\
  \ Volume One*, 第四版, Thomson Brooks/Cole, 2003。\n\n## 非线性优化\n\n## 章节目标\n\n- 使用 `Newton’s\
  \ method` 求解优化问题\n- 使用黄金分割法\n- 引入一维梯度法\n- 引入二维梯度法\n- 使用拉格朗日乘子\n- 引入分支界法\n- 引入旅行员问题\n\
  \n## 8.1 引言\n\n`非线性规划`是指任何不符合线性规划定义的程序。线性规划具有非常特殊的结构，可以利用该结构构建高效的解法（即 `Simplex method`）。这种方法的缺点是，如果问题不符合这种特殊结构，则无法应用该解法。\n\
  \n正如我们将看到的，非线性规划在本质上比线性规划更难求解。事实上，没有高效的算法能保证通用非线性规划的最优解，就像`Simplex method`保证通用线性规划的最优解。然而，某些类型的非线性规划如二整数、凸、可分离和二次规划，具有可以利用来寻找高效解法的特殊结构。在本章中，我们介绍了几种近似非线性规划最优解的数值技术。\n\
  \n我们从一个非线性规划的经典微积分应用开始。\n\n### 示例 8.1.1（微积分问题）\n\n工程师需要通过埋地电缆将风力电机连接到收集升压变压器。风机位于直线道路\
  \ 2 公里处，变压器位于道路下游 6 公里处，如图图 8.1\n\n图 8.1\n\n最短路径是从风力电机到变压器的直线，但这条路径完全经过岩石地区，因此价格可能很贵。另一个选择是直达道路，然后沿着整条道路行驶。这将最小化穿越岩石地区的距离，但它将是最长的路径。因此这个选项可能也很贵。第三种选择是将电缆铺到道路上的某点\
  \ `x`，然后沿着道路铺，如图图 8.1 = 2000\\sqrt{4 + x²} + 1500(6-x)$\n\n为了解决这个问题，我们需要对 $C$ 关于\
  \ $x$ 求导：\n\n$C'(x) = \\frac{2000x}{\\sqrt{4+x²}} - 1500$\n\n将导数等于 0：\n\n$\\frac{2000x}{\\\
  sqrt{4+x²}} = 1500$\n\n$\\frac{4x}{\\sqrt{4+x²}} = 3$\n\n$4x = 3\\sqrt{4+x²}$\n\n\
  $16x² = 9(4+x²)$\n\n$16x² = 36 + 9x²$\n\n$7x² = 36$\n\n$x² = \\frac{36}{7}$\n\n\
  $x = \\frac{6}{\\sqrt{7}} \\approx 2.269$\n\n### 候选点测试\n\n该测试说明连续函数在区间上的最小值和最大值位于界点和端点。我们只需要在每个候选点评估函数。\n\
  \n对于示例函数 $C(x)$，候选点是界点 $x=2.269$ 以及区间的端点 $x=0$ 和 $x=6$。我们对这些点评估 $C(x)$：\n\n$C(0)\
  \ = 2000\\sqrt{4+0²} + 1500(6-0) = 4000 + 9000 = 13000$\n$C(2.269) = 2000\\sqrt{4+2.269²}\
  \ + 1500(6-2.269) \\approx 11691.7$\n$C(6) = 2000\\sqrt{4+6²} + 1500(6-6) = 12649.1$\n\
  \n这三个成本中最小的是 $11691.7$，因此我们得出最优解为 `x=2.269`。因此，工程师应将电缆铺到道路 2.269 公里处，然后沿着道路铺设剩余\
  \ $6-2.269=3.731$ 公里的电缆。总成本为 11691.7。\n\n### 二导数测试\n\n该测试通过在临界点评估函数的二阶导数，来识别给定临界点是最小值还是最大值的位置。如果二阶导数在临界点为正，则该点为最小值的位置；如果为负，则该点为最大值的位置。\n\
  \n对于示例函数 $C(x)$，二阶导数为：\n\n$$C''(x) = \\frac{8000}{(4 + x²)^{3/2}}$$\n\n在临界点 `x=2.269`\
  \ 处评估二阶导数得到：\n\n$$C''(2.269) = \\frac{8000}{(4 + 2.269²)^{3/2}} > 0$$\n\n由于二阶导数为正，该点为最小值的位置。\n\
  \n\n\n\n\n$$C^{''}(2.267) = \\frac{8000}{\\left( 4 + 2.267^{2} \\right)^{3/2}} >\
  \ 0.$$\n\n由于二阶导数为正，我们得出结论：临点 `x` = 2.267 是成本最小的位置，这与候选测试得出的结论相同。□\n\n此示例涉及求导数并将其设为\
  \ 0 以找到临点。临点是 `x` 的可能值，使得函数在该点处具有`局部`（或`相对`）`极大值`或`最小值`。如果对于以 `x[0]` 为中心的某个区间内的所有\
  \ `x` 都有\n\n`f(x[0]) ≥ f(x)`，则在 `x[0]` 处出现局部极大值。\n\n局部最小值的定义类似。相反，如果对于 `f` 域内的所有\
  \ `x` 都有\n\n`f(x[0]) ≥ f(x)`，则在 `x[0]` 处出现`全局极大值`。\n\n全局最小值的定义类似。通常，局部极小值称为`局部极值`，而全局最小值和极大值称为`全局极值`。\n\
  \n从图上看，局部极大值出现在函数图上的`高`点。全局极大值出现在图上的`最高`点。最小值的识别方法也类似。\n\n### 示例 8.1.2（识别局部和全局极值）\n\
  \n作为局部和全局极值定义的示例，请参见图 8.2 所示的 `y = g(x)`，其定义域为 0 ≤ `x` ≤ 4。函数 `g(x)` 在 0.6 附近有一个局部极大值，在\
  \ 3.5 附近有一个全局极大值，在 2 和 4 附近有局部最小值，在 0 处有一个全局最小值。□\n\n![fig8_2.jpg](img/fig8_2.jpg)\n\
  \n图 8.2\n\n求解非线性规划时，我们通常希望找到全局极值。正如我们在下一节看到的，有时很难知道我们找到的是局部极值还是全局极值。\n\n### 8.2\
  \ 牛顿法\n\n示例 8.1.1 要求我们找到目标函数的导数，将其设为 0，然后通过代数运算求解该方程。这部分代数运算可以说是问题中最困难的部分。在本节中，我们介绍了一种用于数值近似该方程解的算法，称为`牛顿法`。与大多数数值近似技术一样，它从对解的“猜想”或近似开始，然后通过多次迭代来改进这种近似。\n\
  \n牛顿法是一种迭代法，用于近似形式为 `f(x) = 0` 的方程的解，其中 `f(x)` 是一个可导函数。这样的解被称为函数的`根`或`零`。从图上看，该解是函数的\
  \ `x` 轴距。根为 `r` 的通用函数 `f(x)` 的图如图图 8.3 所示。\n\n![fig8_3.jpg](img/fig8_3.jpg)\n\n\
  图 8.3\n\n图 8.3 说明了牛顿法的工作原理。令 `x[n]` 为根 `r` 的近似值。在点 `(x[n], f(x[n]))` 处画一条切线。令 `x[n+1]`\
  \ 为该切线的 `x` 轴距。从图上看，我们看到 `x[n+1]` 比 `x[n]` 是 `r` 更好的近似。为了找到 `x[n+1]`，考虑点 `(x[n+1],\
  \ 0)` 和 `(x[n], f(x[n]))`。我们可以通过两种方法计算这两点之间的斜率：\n\n1. 它们都在点 `(x[n], f(x[n]))` 的切线上，因此斜率为点\
  \ `f'(x[n])`。\n2. 使用两点间斜率的定义，斜率为 $$\\frac{f\\left( x_{n} \\right) - 0}{x_{n} - x_{n\
  \ + 1}} = \\frac{f\\left( x_{n} \\right)}{x_{n} - x_{n + 1}}.$$\n\n将这两个斜率计算结果等量并求解\
  \ `x[n+1]`，得到：\n\n$$f'\\left( x_{n} \\right) = \\frac{f\\left( x_{n} \\right)}{x_{n}\
  \ - x_{n + 1}}\\quad\\Rightarrow\\quad x_{n + 1} = x_{n} - \\frac{f\\left( x_{n}\
  \ \\right)}{f'\\left( x_{n} \\right)}.$$\n\n这个思想引出了以下简单的算法。\n\n**牛顿法**：为了近似可导函数\
  \ `f(x)` 的根 `r`\n\n1. 令 `x[0]` 为 `r` 的初始近似值\n2. 计算 $$x_{n + 1} = x_{n} - \\frac{f\\\
  left( x_{n} \\right)}{f'\\left( x_{n} \\right)}.$$\n3. 重复步骤 2 10 次迭代。\n\n执行 10 次迭代是完全任意的。在算法更复杂的版本中，会重复步骤\
  \ 2 直到满足某些停止准则。\n\n### 8.2.1（实现牛顿法）\n\n考虑 `x` 年后产生的收入为\n\n$$h(x) = 1 - e^{-x} +\
  \ (1 + x)^{-1}$$\n\n其中 0 ≤ `x` ≤ 5。找到最大收入。\n\n通常，优化问题的第一步是画出目标函数，如图图 8.6 所示。我们看到在\
  \ `x = 2` 和 `x = 3` 之间存在极大值。这为牛顿法提供了一个初始值的想法，`x[0] = 2.5` 可能是一个很好的选择。\n\n![fig8_6.jpg](img/fig8_6.jpg)\n\
  \n图 8.6\n\n为了使用牛顿法估计临点，我们首先找到 `h'(x)` 并将其重命名为 `f(x)`：\n\n$$f(x) = e^{-x} - (1 +\
  \ x)^{-2}.$$\n\n现在我们需要找到 `f(x)` 的根。`f(x)` 的导数是\n\n$$f'(x) = -e^{-x} + 2(1 + x)^{-3}.$$\n\
  \n为了牛顿法找到 `f(x)` 的根，重命名空白工作表为 `牛顿 2`，并按照图 8.7 所示进行格式。将第 3 行复制到第 12 行。\n\n![fig8_7.jpg](img/fig8_7.jpg)\n\
  \n图 8.7\n\n结果如图 8.8 所示。它们表明 `f(x)` 在 `x ≈ 2.512862` 处有一个根，且\n\n$$f'(2.512862) =\
  \ g''(2.512862) = -0.0349.$$\n\n由于 `g''(2.512862) < 0`，二阶导测试告诉我们临点 2.512862 是极大值的位置，正如图\
  \ 8.6](#17_Chapter08.xhtml_fig8_6)所示所示。\n\n![fig8_8.jpg](img/fig8_8.jpg)\n\n图 8.8\n\
  \n因此，我们得出最大收入为\n\n$$h(2.51862) = 1 - e^{-2.51862} + (1 + 2.51862)^{-1} \\approx\
  \ 1.203632.$$\n\n\n\n\n\n这是一个与示例 8.1.1 不同的类型的优化问题。我们并不是试图寻找目标函数的优化值。相反，我们正试图找到方程\
  \ `x` = tan `x` 的最小正解。这个方程很难通过代数方法求解，因此我们将使用牛顿迭代法来近似解，然后从中从中选择出最小的那个解。\n\n首先，我们重写该方程：\n\
  \n`x = tan x ⇒ x - tan x = 0`\n\n如果我们令 `f(x) = x - tan x`，该问题就可以表述为“找到 `f(x)` =\
  \ 0 的最小正解”，这是一个我们可以使用牛顿迭代法解决的问题。`f(x)` 在区间 0 ≤ `x` ≤ 8 上的图像如图 8.9 所示。注意，图像有三个“部分”，且最小的正\
  \ `x` 轴截距似乎在 4.5 左右。\n\n![fig8_9.jpg](img/fig8_9.jpg)\n\n图 8.9\n\n`f(x)` 的导数是\n\n\
  `f'(x) = 1 - sec²x`\n\n为了用初值猜测 `x[0]` = 4.5 实现牛顿迭代法，请将一个空白工作表重命名为“**Newton 3**”，并按照图\
  \ 8.10 所示格式进行格式化。\n\n![fig8_10.jpg](img/fig8_10.jpg)\n\n图 8.10\n\n结果给出了根 `x` ≈ 4.493409。现在假设我们使用\
  \ `x[0]` = 4。只需在工作表中将 `x[0]` 改为 4 就得到结果 `x[n] → ∞`。为什么我们会得到如此完全不同的结果？为了帮助解释原因，考虑点\
  \ (4, `f(4)`) 处的切线，如图 8.11 所示。我们看到切线的 `x` 轴截距约为 6.1，这意味着 `x[1]` ≈ 6.1。这导致搜索转向了函数的第三部分，远离了我们想要的地方。□\n\
  \n![fig8_11.jpg](img/fig8_11.jpg)\n\n图 8.11\n\n### 练习题\n\n**8.2.1** 在我们简单的牛顿迭代算法中，我们任意执行了\
  \ 10 次迭代。在算法更复杂的版本中，会重复步骤 2 直到满足某些“停止准则”。一个非常简单的停止准则是：当 `x[n]` 停止显著变化时算法终止。具体而言，当\
  \ `|x[n+1] - x[n]| < δ` 时算法终止，其中 `δ` > 0 是某个指定的常数。修改工作表 **Newton** 以包含此停止准则，并输出执行的迭代次数以及根的近似值。允许用户输入\
  \ `δ` 的值。\n\n**8.2.2** 另一个停止准则是基于：如果 `x[n+1]` 和 `x[n]` 在前 `m` 位数字上一致，则近似值 `x[n+1]`\
  \ 可能精确到 `m` 位。因此，如果我们想要一个 9 位小数精度的近似值，例如，我们只需在 `x[n+1]` 和 `x[n]` 同于 9 位小数时停止。作为这一想法的应用，考虑求解方程\n\
  \n`x² - 2 = 0`\n\n初等代数显示精确解为 $\\sqrt{2}$。使用牛顿迭代法，利用 `x[0]` = 1 将此解估计到 9 位小数精度。此结果是\
  \ $\\sqrt{2}$ 的 9 位小数估计值。需要多少次迭代？\n\n**8.2.3** 从一张 11 英寸 × 8.5 英寸的纸角切掉正方形。得到的纸片将被制成一个无盖箱。找到正方形的尺寸，使得得到的箱子体积最大。\n\
  \n**8.2.4** 尝试使用牛顿迭代法近似 `x^(1/3) = 0` 的解。尝试任何不同于 0 的 `x[0]` 值。你发现了什么？（**提示**：在 Excel\
  \ 中输入 `x^(2/3)` 时，请输入 `(x²)^(1/3)`。）\n\n**8.2.5** 一棵 12 米高的树被切掉某个高度，使得切掉部分的长度立方根等于剩余部分的高度。使用牛顿迭代法近似剩余部分的高度。\n\
  \n**8.2.6** 考虑示例 8.2.2\n\n1. 在区间 0 ≤ `x` ≤ 5 上绘制函数 `f(x) = e^(-x) - (1 + x)^(-2)`\
  \ 的图像。\n2. 假设我们从 `x[0]` = 0.4 开始使用牛顿迭代法。这能找到 `f(x)` 在 `x` ≈ 2.512 处的根吗？使用 `f(x)`\
  \ 的图像来解释。具体来说，使用点 (0.4, `f(0.4)`) 处的切线来解释为什么 `x[1]` 与 `x[0]` 差异。\n3. 现在假设我们使用 `x[0]`\
  \ = 0.6。搜索在定位 `x` ≈ 2.512 处的根方面效果更好吗？解释为什么或为什么。\n4. 现在假设我们使用 `x[0]` = 4.5。解释发生了什么。\n\
  \n**8.2.7** 函数 `g(x) = sin 3x - cos x` 在区间 0 ≤ `x` ≤ 10 上有许多局部最小值和极大值。该问题的目标是估计全局最小值和极大值。\n\
  \n1. 使用牛顿迭代法估计 `g(x)` 的关键点，其中 `x[0]` 是 0 到 10 之间的随机数。\n2. 使用数据表存储 a 部分 100 次试验的结果。\n\
  3. 为 b 部分的每个结果计算 `g(x)`。找到 `g(x)` 的最大值和。\n\n**8.2.8** 使用牛顿迭代法在 `y = cos x` 的图像上找到至少两个点，这些点处的切线通过原点。\n\
  \n**8.2.9** 使用牛顿迭代法找到函数 `g(x) = -16x⁶ + 48x⁵ - 61x⁴ + 42x³ - 16x² + 35x` 的极大值。\n\
  \n1. 在 `x[0]` = 0.9 时使用 100 次牛顿迭代法估计该极大值。\n2. 现在使用 `x[0]` = 0.9。解释为什么接近 a 部分找到的值需要更多迭代。\n\
  \n**8.2.10** 一条 1 英里（5280 英尺）长的轨道在没有接缝的情况下修建。假设轨道受热导致长度增加，使其形成如图 8.12 所示的圆弧，其中 `θ`\
  \ 是圆扇的角，`R` 是半径。该问题被称为*轨道问题*，目标是找到地面上的高度 `x`。\n\n可以证明 `x` 满足方程\n\n$$\\tan^{- 1}\\\
  left( \\frac{5280x}{2640^{2} - x^{2}} \\right) \\cdot \\left( \\frac{2640^{2} +\
  \ x^{2}}{2x} \\right) - \\frac{5280}{2} = 0.$$ (8.1)\n\n代数求解该方程将极其困难。使用牛顿迭代法求解也会困难，因为导数很复杂。数值计算\
  \ `f'(n)` 的一种方法是使用割线。具体来说，我们选择一个小的量 `d`，然后计算\n\n$$f'(x_{n}) \\approx \\frac{f(x_{n}\
  \ + d) - f(x_{n})}{d}.$$\n\n1. 使用牛顿迭代法实现方程 (8.1。使用 `d = 0.01`，但将 `d` 设置为用户可以更改的参数。（**提示**：使用公式\
  \ **ATAN** 处理 `tan^(-1)`。）\n2. **额外积分**：推导方程 (8.1)。\n\n\n\n非正式地说，如果一个函数在区间内仅有一个局部极值，则该函数在该区间上是单峰的。从图上上看，如果一个函数在区间内只有一个高点或低点，它就是单峰的。单峰性是一个很好的特性，因为只需要寻找一个局部极值。当我们找到它时，我们就找到了全局极值。\n\
  \n### 示例 8.3.1（识别单峰性）\n\n考虑图 8.13 所示的函数 `f(x)` 图像。在区间 [0, 4] 上，该函数不是单峰的，因为它有两个低点和一个高点。然而，`f(x)`\
  \ 在 [0, 1] 上是单峰的，因为它在该区间内只有一个低点。类似地，该函数在 [1, 3] 和 [3, 4] 上也都是单峰的。\n\n![fig8_13.jpg](img/fig8_13.jpg)\n\
  \n图 8.13\n\n黄金分割法依赖于一个被称为*黄金分割比例*的数字，它源于希腊数学中的一个著名问题：假设我们将长度为一的线段分成两部分，如图 8.14 所示，使得长段与短段的比例等于整个线段与长段的比例。找到\
  \ `r` 的值。\n\n![fig8_14.jpg](img/fig8_14.jpg)\n\n图 8.14\n\n在代数上，这个问题等价于求解代数方程\n\n\
  | $$\\frac{r}{1 - r} = \\frac{1}{r}.$$ | (8.2) |\n| --- | --- |\n\n可以证明解为 $r = \\\
  frac{\\sqrt{5} - 1}{2} \\approx 0.618$（见练习 8.3.1）。数字 $\\frac{1}{r} \\approx 1.618$\
  \ 被称为*黄金比例*。\n\n下一个示例有助于理解黄金分割法的动机。\n\n### 示例 8.3.2（寻找最大值）\n\n在区间 [0, 20] 上寻找函数\
  \ $f(x) = 1 - e^{- x} + \\frac{1}{1 + x}$ 的最大值。该函数的图像见图 8.15。我们看到该函数在 [0, 20] 上是单峰的。\n\
  \n![fig8_15.jpg](img/fig8_15.jpg)\n\n图 8.15\n\n我们通过受黄金比例问题的启发，在区间 [0, 20] 中选择两个“测试点”`x[1]`\
  \ 和 `x[2]` 开始搜索：\n\n$$\\begin{matrix} x_{1} & {= 0 + (1 - 0.618)(20 - 0) = 7.64,}\
  \ \\\\ x_{2} & {= 0 + 0.618(20 - 0) = 12.36.} \\end{matrix}$$\n\n观察到 `x[1]` 定义了一个区间\
  \ [0, `x[1]]`，其长度是 [0, 20] 长度的 (1 — `r`) 倍，而 `x[2]` 定义了一个区间 [0, `x[2]]`，其长度是 [0,\
  \ 20] 长度的 `r` 倍。接下来，我们在这两个测试点上评估函数：\n\n$$\\begin{matrix} {f\\left( x_{1} \\right)}\
  \ & {= 1 - e^{- 7.64} + \\frac{1}{1 + 7.64} \\approx 1.115,} \\\\ {f\\left( x_{2}\
  \ \\right)} & {= 1 - e^{- 12.36} + \\frac{1}{1 + 12.36} \\approx 1.075.} \\end{matrix}$$\n\
  \n这些计算显示 `f(x)` 在区间 [`x[1], x[2]]` 上是递减的。由于 `f(x)` 是单峰的，我们可以得出 `f(x)` 在区间 [`x[2],\
  \ 20]` 上也是递减的。因此，我们可以排除区间 [`x[2], 20]` 作为最大值所在的位置。这使得最大值的范围缩小到区间 [0, `x[2]]`。然后我们可以迭代此过程。每次迭代都会产生一个更窄的最大值所在区间。一旦区间的宽度小于某个指定的值（称为*容差*），我们就可以停止。\n\
  \n我们在下面的算法中泛化了上述示例。\n\n**黄金分割法**：在容差为 `t` 的区间 [`a, b]` 上寻找单峰函数 `f(x)` 的最大值：\n\n\
  1. 设置 `r` = 0.618 并定义测试点 $$\\begin{matrix} x_{1} & {= a + (1 - r)(b - a),} \\\\\
  \ x_{2} & {= a + r(b - a).} \\end{matrix}$$\n2. 计算 `f(x[1])` 和 `f(x[2])`。\n3. 比较\
  \ `f(x[1])` 和 `f(x[2])`：\n    1. 如果 `f(x[1]) <= f(x[2])`，则新区间为 [`x[1], b]`（即 `a`\
  \ 变为 `x[1]`）。\n    2. 如果 `f(x[1]) > f(x[2])`，则新区间为 [`a, x[2]]`（即 `b` 变为 `x[2]`）。\n\
  4. 计算新区间的宽度。如果该宽度小于容差 `t`，则跳转到第 5 步。否则返回第 1 步。\n5. 将最终区间的中点估计为最大值的位置。命名为 `x*`。近似最大值为\
  \ `f(x*)`。\n\n我们可以通过交换第 3 步中的不等式来修改此算法以寻找单峰函数的最小值。\n\n### 示例 8.3.3（实现黄金分割）\n\n要在区间\
