  \n### 5. 解出修改后模型中的 `y`，并使用 d 部分找到的参数来预测 `y` 的值。这些预测结果如何？\n\n#### 2.6.10 正如所述，对数可以用于模型线性化。它们还可以帮助我们处理大数字或小数字。考虑在模型中寻找比例系数的问题\n\
  \n$$t_{l} \\propto \\frac{1}{m_{p}^{2}}$$\n\n其中 `t`[`l`] 是卫星进入轨道锁定所需的时间，`m`[`p`]\
  \ 是行星的质量，如练习 2.2.10 所示。下表显示了太阳系中八大行星的值（数据由 Joshua Hendrickson 于 2019 年收集）。\n\n|\
  \ 行星 | `m``p* | `t`[`l*] (×10⁷ *y**e**a**r**s*) |\n| --- | --- | --- |\n| **水星**\
  \ | 0.33 | 126094 |\n| **金星** | 4.87 | 578.98 |\n| **地球** | 5.97 | 385.28 |\n| **火星**\
  \ | 0.642 | 33315.9 |\n| **木星** | 1898 | 0.003812 |\n| **土星** | 568 | 0.042562 |\n\
  | **天王星** | 86.8 | 1.822561 |\n| **海王星** | 102 | 1.31984 |\n\n使用本节介绍的方法，我们可以绘制 `t`[`l`]\
  \ 对 1/**m`[`p*]² 的图表，并拟合一条通过原点的直线，其斜率即为比例系数。然而，某些数字比其他数字大得多，导致许多数据点靠得太近，以无法相互区分。为了帮助解决这个问题，我们可以对模型\
  \ `t`[`l`] = `k`/**m`[`p*]² 的两边取自然对数，并进行代数重写，得到\n\n$$\\ln\\left( t_{l} \\right)\
  \ = \\ln(k) + \\ln\\left( \\frac{1}{m_{p}^{2}} \\right).$$\n\n因此，`ln` (`t`[`l`])\
  \ 对 `ln` (1/**m`[`p*]²) 的图斜率应为 1，`y`截距为 `ln` (`k`)。这样的图被称为 `log-log plot`（双对数图）。\n\
  \n1. 计算所有行星的 `ln` (`t`[`l`]) 和 `ln` (1/**m`[`p*]²)。\n2. 绘制 `ln` (`t`[`l`]) 对 `ln` (1/**m`[`p*]²)\
  \ 的图并对数据拟合直线。\n3. 使用直线估计比例系数 `k`。\n\n**练习 2.6.11 - 2.6.13 说明：** 在本节中，我们通过适当转换数据并对转换后的数据拟合直线，找到了模型中参数的值。另一种方法是使用最小二乘判则寻找参数的公式。也就是说，如果模型是\
  \ `y` = `f`(`x`)，那么参数应该最小化以下数量\n\n$$S = \\sum\\limits_{i = 1}^{n}\\left( {y_{i}\
  \ - f(x_{i})} \\right)^{2}.$$\n\n在原理上，可以通过对 `S` 关于每个参数求偏导数、将导数等于 0 并解出参数来实现，就像我们在第\
  \ 2.4 节中所做的那样。\n\n在练习 2.6.11 - 2.6.13 中，你被给了一种线性化模型类型和参数公式。对于每个练习：\n\n1. 设计一个表格，通过示例证明给出的公式得到的参数值与通过转换数据并对转换后的数据拟合直线得到的值相同。\n\
  2. 使用上述方法推导出给出的公式。\n\n#### 2.6.11 模型：`y` = `ax`³\n\n$$a = \\frac{\\sum{y_{i}x_{i}^{3}}}{\\\
  sum x_{i}^{6}}$$\n\n#### 2.6.12 模型：`y` = `ax`² + `b`\n\n$$a = \\frac{- n\\sum{x_{i}^{2}y_{i}}\
  \ + \\sum y_{i}\\sum x_{i}}{\\left( \\sum x_{i}^{2} \\right)^{2} - n\\sum x_{i}^{4},\\\
  mspace{22mu} b = \\frac{\\sum y_{i} - a\\sum x_{i}^{2}}{n}$$\n\n#### 2.6.13 模型：`y`\
  \ = `a` + `b` ln `x`\n\n$$b = \\frac{\\sum y_{i}\\sum{\\ln\\; x_{i}} - n\\sum{y\\\
  ln\\; x_{i}}}{\\left( \\sum{\\ln\\; x_{i}} \\right)^{2} - n\\sum\\left( \\ln\\;\
  \ x_{i} \\right)^{2},\\mspace{22mu} a = \\frac{\\sum y_{i} - b\\sum{\\ln\\; x_{i}}}{n}$$\n\
  \n## 2.7 决定系数\n\n决定系数记作 `R`²，是衡量直线拟合一组数据程度的数值度量。为了说明基本概念，我们将根据关系 `y` = 3 + 2`x`\
  \ 生成一些假设数据。\n\n1. 将一个空白工作表重命名为 \"**R2**”并按照图 2.40 进行格式设置。将第 3 行复制到第 11 行以生成 10 个数据点。\n\
  \n![fig2_40.jpg](img/fig2_40.jpg)\n图 2.40\n\n2. 创建数据的图并如图 2.41 所示添加趋势线。注意，直线通过每个数据点，且该直线的方程是用于生成数据的。\n\
  \n![fig2_41.jpg](img/fig2_41.jpg)\n图 2.41\n\n对数据拟合直线的目的之一是在已知 `x` 值时预测 `y` 的值。如果我们没有数据的图表或回归方程，那么\
  \ `y` 的最佳猜测将是 `y` 值的平均值。该平均值记为 $\\overline{y}$，在本例中等于 12。\n\n![fig2_42.jpg](img/fig2_42.jpg)\n\
  图 2.42\n\n如果回归方程预测的 `y` 值记为 `ŷ`，我们通过比较偏差与 `ŷ` 和 $\\overline{y}$ 之间的差异来衡量回归方程拟合数据的程度。在本例中，回归直线通过每个数据点，因此\
  \ `ŷ` = `y`。所以，\n\n$$\\frac{\\hat{y} - \\overline{y}}{y - \\overline{y}}\\quad\\\
  Rightarrow\\quad1$$\n\n因此我们给这个回归方程一个 `R`² 的值。这个值通常被解释为回归方程“解释”了 100% 的偏差。决定系数的定义基于这种思想，通过比较偏差与\
  \ `ŷ` 和 $\\overline{y}$ 之间的差异来衡量回归方程解释的偏差百分比。\n\n该数据集是高度理想化的，因为它完全按照线性关系 `y` =\
  \ 3 + 2`x` 生成的。实际上，数据从未符合这种精确的关系。具有线性关系的真实数据满足如下形式的方程\n\n*y* = *β*[0] + *β*[1]*x* + *ε*\n\
  \n其中 *ɛ* 是某种“噪声”。这种噪声可能是由于测量误差、采样波动或我们无法控制的其他随机事件引起的。\n\n关系 *y* = *β*[0] + *β*[1]\
  \ *x* 被称为总体的“真实”线性趋势，而回归方程具有通用形式 *ŷ* = *β̂*[0] + *β̂*[1]*x。“帽子”表示参数 *β̂*[0] 和 *β̂*[1]\
  \ 是基于样本数据对总体值的估计。同样，*ŷ* 是 *y* 的估计。\n\n**示例 2.7.1（包含噪声）**\n\n\n\n\n\n要生成带有噪声的数据，请按照图\
  \ 2.43 所示修改工作表 `R2`。将单元格 `B2` 向复制到第 11 行。在这里，噪声由 `NORMINV(RAND(),0,2)` 提供，这是一个均值为\
  \ 0、标准差为 2 的正态分布伪随机变量（有关此公式如何工作的更多细节，请参见第 6 章，特别是第 6.6 节）。\n\n![fig2_43.jpg](img/fig2_43.jpg)\n\
  \n图 2.43\n\n这些噪声数据的图表类似于图 2.44。请注意，由于随机噪声，你的图表可能看起来不同。还要注意回归方程并不是 `y = 3 + 2x`。\n\
  \n![fig2_44.jpg](img/fig2_44.jpg)\n\n图 2.44\n\n为了定义拟合噪声数据的线性 `R²` 值，我们引入了三种不同类型的偏差：`explained`（解释）、`unexplained`（未解释）和\
  \ `total`（总计）偏差。图 2.45 展示了这些类型的偏差。我们从图中看到：\n\n$$\\begin{matrix} \\text{(总偏差)} &\
  \ = & \\text{(解释偏差)} & + & \\text{(未解释偏差)} \\\\ \\left( y - \\overline{y} \\right)\
  \ & = & \\left( \\hat{y} - \\overline{y} \\right) & + & {\\left( y - \\hat{y} \\\
  right).} \\end{matrix}$$\n\n![fig2_45.jpg](img/fig2_45.jpg)\n\n图 2.45\n\n如果我们对这些偏差平方并将所有数据点相加，就会得到\
  \ `variation`（变异）量（总偏差的衡量标准）。总变异被称为 `total sum of squares`（离平方和），公式为：\n\n$$SS_{Tot}\
  \ = \\sum{(y_{i} - \\overline{y})^{2}}$$\n\n解释变异被称为 `regression sum of squares`（回归平方和），公式为：\n\
  \n$$SS_{Reg} = \\sum{({\\hat{y}}_{i} - \\overline{y})^{2}}$$\n\n未解释变异被称为 `residual\
  \ sum of squares`（残差平方和），公式为：\n\n$$SS[Res] = \\sum(y[i] - \\hat{y}[i])²$$\n\n类似于偏差之间的关系，我们得到：\n\
  \n$$\\begin{matrix} \\text{(总变异)} & = & \\text{(解释变异)} & + & \\text{(未解释变异)} \\\\\
  \ {\\sum\\left( y_{i} - \\overline{y} \\right)^{2}} & = & {\\sum\\left( {\\hat{y}}_{i}\
  \ - \\overline{y} \\right)^{2}} & + & {\\sum\\left( y_{i} - {\\hat{y}}_{i} \\right)^{2}}\
  \ \\end{matrix}$$\n\n（证明这种关系的真实并不是易事）。重写这个方程，我们得到：\n\n$$\\begin{matrix} \\text{(解释变异)}\
  \ & = & \\text{(总变异)} & - & \\text{(未解释变异)} \\\\ {\\sum\\left( {\\hat{y}}_{i} -\
  \ \\overline{y} \\right)^{2}} & = & {\\sum\\left( y_{i} - \\overline{y} \\right)^{2}}\
  \ & - & {\\sum\\left( y_{i} - {\\hat{y}}_{i} \\right)^{2}} \\\\ {SS_{Reg}} & = &\
  \ {SS_{Tot}} & - & {SS_{Res}.} \\end{matrix}$$\n\n因此，回归方程解释的总变异的“百分比”为：\n\n| $$R^{2}\
  \ = \\frac{SS_{Tot} - SS_{Res}}{SS_{Tot}}.$$ | (2.16) |\n| --- | --- |\n\n这是判定系数的定义。`R²`\
  \ 越接近 1，直线对数据的拟合程度就越好。`R²` 值接近 0 表示拟合直线效果非常差。\n\n### 示例 2.7.2（计算 `R²`）\n\n使用公式 (2.16)\
  \ 计算拟合噪声数据的回归线的 `R²`，请遵循以下步骤：\n\n1. 按照图 2.46 所示修改工作表 `R2`。\n   ![fig2_46.jpg](img/fig2_46.jpg)\n\
  \   图 2.46\n\n2. 添加图 2.47 所示的公式，并将第 2 行向下复制到第 11 行。\n   ![fig2_47.jpg](img/fig2_47.jpg)\n\
  \   图 2.47\n\n3. 添加图 2.48 所示的公式。\n   ![fig2_48.jpg](img/fig2_48.jpg)\n   图 2.48\n\
  \n4. 为数据图表添加线性趋势线。在 `Options`（选项）下，选择“Display R-squared”（显示 R 平方）。\n\n5. 多次按下 `F9`\
  \ 键。每次数据都会重新生成并创建一组。注意 `E14` 中的 `R²` 值应等于我们计算的结果。\n\n6. 为了添加更多噪声，按照图 2.43 所示修改工作表\
  \ `R2`。\n   ![fig2_43.jpg](img/fig2_43.jpg)\n   图 2.43\n   注意 `R²` 值不再像之前那样是 1。\n\
  \n### 示例 2.7.3（对线性化模型应用 `R²`）\n\n考虑 2.6 节中的线性化模型数据。我们现在可以通过比较它们的 `R²` 值来比较这些模型拟合数据的程度。计算\
  \ `R²`：\n\n1. 在第 2.6 节的 `Power` 工作表中，通过右键点击趋势线并选择 `Format Trendline...`（设置趋势线格式），显示\
  \ `L` 与 `P` 图表中趋势线的 `R²` 值。注意此值为 0.8152。\n\n2. 对示例 2.6.1 和 2.6.3 得出的对数和指数模型重复此过程。我们现在可以比较它们的\
  \ `R²` 值：\n\n| **对数** 0.8255 | **幂** 0.8152 | **指数** 0.6864 |\n\n我们看到幂模型和对数模型拟合良好，对数模型略好。指数模型的效果没有那么好。因此，严格根据\
  \ `R²` 值，我们可以得出对数模型拟合最好的结论。\n\n练习\n\n**2.7.1** 下数据包含若干汽车的重量（磅）和高速每加仑里程（MPG）。为拟合此数据的线性回归方程计算\
  \ `SS[Reg]`、`SS[Res]`、`SS[Tot]` 和 `R²`。\n\n| **Weight (x)** | 3250 | 3425 | 2400\
  \ | 2250 |\n| **MPG (y)** | 26 | 28 | 37 | 38 |\n\n\n\n\n\n### 2.7.2 氮肥与产量\n下方数据包含了施用于不同玉米田的氮肥量（磅/英亩）以及相应的产量（桶/英亩）。使用定义为拟合这些数据的线性回归方程计算\
  \ `SS`[`Reg*]`、`SS`[`Res*]`、`SS`[`Tot*]` 和 `R²`。\n\n| **氮 (**x**)** | 0 | 60 | 120\
  \ | 180 | 240 |\n| :--- | :--- | :--- | :--- | :--- | :--- |\n| **产量 (**y**)** |\
