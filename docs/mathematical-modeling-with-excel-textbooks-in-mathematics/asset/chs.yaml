  \n![fig6_50.jpg](img/fig6_50.jpg)\n### 示例 6.6.8 (应用于实际数据)\n\n假设我们要模拟当地超市收银台的活动。我们需要建模的一个随机事件是客户到达。为了实现这一点，我们观察\
