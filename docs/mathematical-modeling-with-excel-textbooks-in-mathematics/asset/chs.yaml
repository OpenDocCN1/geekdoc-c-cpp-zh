  \ 美元），多少人开车可以使通勤成本最低？\n\n3. 现在假设地铁想要扩展其网络，并通过将票价涨到 12 美元来为此筹资金。多少人开车可以使通勤成本最低？\n\
  \n### 8.4.9 气管收缩\nE. N. Throat 医生一直在对咳嗽时收缩的气管进行 X 射线拍摄。他发现气管似乎收缩到了其正常尺寸的 33% (1/3)。他请求数学系证实或否定他的主张。你进行了一些初步研究，发现在关于气管壁弹性以及靠近壁的空气受摩擦力减速的合理假设下，通过气管的空气平均速度\
  \ `v` 可以建模为方程\n\n`v = cr²`\n\n其中 `c` 是一个常数，`r` 是气管半径。建立一个使用 `Solver` 找到 `r` 值的表格。你的结果支持还是否定了他的主张？\n\
  \n\n\n\n这证实了 (1, 1) 是局部最小值或极大值的位置。类似的计算表明 ∇*f*(−1,  − 1) = ∇*f*(0, 0) = (0, 0)，再次证实了\
  \ (− 1, − 1) 和 (0, 0) 是局部最小值或极大值的位置。\n\n现在考虑点 (1, − 1)。该点处的梯度为：\n\n$$\\nabla f\\\
  left( {1,\\, - 1} \\right) = \\begin{bmatrix} {4(1)^{3} - 4( - 1)} \\\\ {4( - 1)^{3}\
  \ - 4(1)} \\end{bmatrix} = \\begin{bmatrix} 8 \\\\ {- 8} \\end{bmatrix}.$$\n\n非正式地说，梯度正的\
  \ `x` 坐标意味着如果我们“稍微”增加 `x`，`f` 的值就应该增加。同样，负的 `y` 坐标意味着稍微减少 `y` 应该增加 `f` 的值。`x` 和\
  \ `y` 坐标的数值相等意味着以相同的小量改变 `x` 和 `y` 最能增加 `f` 的值。这正是我们在查看图 8.27 时看到的。□\n\n二元梯度法是一种近似函数\
  \ `f` (`x`, `y`) 临界点的迭代方法。下面是二元梯度法的简化版本。\n\n### 二元梯度法\n\n要最小化二变量函数 `f` (`x`, `y`)：：\n\
  \n1. 选择一个初始点 (`x[0]`, `y[0]`)。\n2. 令 $\\left\\{ \\begin{array}{l} {x_{k + 1} = x_{k}\
  \ - \\lambda\\frac{\\partial f}{\\partial x}\\left( {x_{k},\\, y_{k}} \\right)}\
  \ \\\\ {y_{k + 1} = y_{k} - \\lambda\\frac{\\partial f}{\\partial y}\\left( {x_{k},\\\
  , y_{k}} \\right)} \\end{array} \\right.$ 其中 `λ` > 0 是某个指定的常数。\n3. 重复步骤 2 50 次迭代（50\
  \ 是任意的）。\n\n该算法可以通过将步骤 2 中的负号改为正号来变为用于最大化函数的算法。在更复杂的版本中，当梯度的范  ∥ ∇*f*(`x[k]`,`y[k]`)∥足够接近\
  \ 0 时，算法终止（参见练习 8.5.4）。\n\n### 示例 8.5.2（实现二元梯度法）\n\n考虑最小化示例 8.5.1 中的函数：\n\n`f`(`x`,\
  \ `y`) = `x`⁴ + `y`⁴ − 4`x`**`y`* +2,\n\n在定义域 −2 ≤ `x` ≤ 2，−2 ≤ `y` ≤ 2 上。使用 `λ`\
  \ = 0.02 和初始点 (0, 0.5) 实现二元梯度法，将一个空白工作表重命名为 `2-Dim` 并按照图 8.28 所示的方法进行格式化。将第 5 行向下复制到第\
