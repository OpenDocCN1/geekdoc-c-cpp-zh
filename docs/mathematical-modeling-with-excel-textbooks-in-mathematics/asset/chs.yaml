  2. 粒子在时间 `t` 的加速度为 `a(t)` = `v'(t)`。使用你在 a 部分估计 `a(t)`。\n3. 时间区间 `[a, b]` 内的总距离为\
  \ `Total distance = ∫v(t)dt`。使用你在 a 部分估计 `[0, 7.3]` 的总距离。\n\n**3.3.6** 下表包含了 Seward\
  \ 从午夜开始的一天的温度。本练习的目标是预测时间 `x` 的温度 `y`。注意温度是周期性的，因此我们将使用形式为 `y = asin(bx + c) + d`\
