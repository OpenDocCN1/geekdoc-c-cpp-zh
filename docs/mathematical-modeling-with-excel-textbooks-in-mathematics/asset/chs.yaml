  \ 时，常规军队获胜。\n\n3. 使用 b 部分的结果以及 `c = r[C]*p[C]` 和 `p[C] = A[1]/(A[2]*G[0])` 的事实（其中\
  \ `A[1]` = 单个游击队员暴露部分的面积，`A[2]` = 单个游击占据占据面积），证明当$$n > \\sqrt{\\frac{2gA_{2}}{r_{C}A_{1}}}$\
  \ 时，常规军队获胜。使用电子表格通过图形化确认此结果。\n\n## 5.8 Runge-Kutta 方法\n\n考虑估计形式微分方程解曲线的问题：\n\n$$\\\
  frac{dy}{dt} = F(t,\\, y)$$\n\n初始条件为 `y (t[0]) = y[0]`，其中 `t[0]` 和 `y[0]` 是给定的值。在第\
  \ 5.2 节 中，我们使用欧拉法来实现。欧拉法的实现相对简单，但正如我们所见，它可能会给出不准确的结果。在本节中，我们介绍了两种 20 世纪初由德国数学家卡尔·大卫·托尔梅·龙格格（Carl\
  \ David Tolmè Runge）和马丁·威廉廉·库塔（Martin Wilhelm Kutta）开发的改进方法。\n\n### **Runge-Kutta\
  \ 二阶方法**\n\n为了引入第一种 Runge-Kutta 方法，观察到如图 5.2 所示，欧拉法在区间 `[t[n], t[n+1]]` 上用常数值 `F\
  \ (t[n], y[n])` 近似 `y′ (t, y)`。那么区间内 `y` 的变化被 `h F (t[n], y[n])` 近似。换句话说，欧拉法使用区间的左端点来近似区间内\
  \ `y` 的变化。可以认为区间的的中点会提供更好的近似。\n\n这种想法引出了以下算法，称为 `Runge-Kutta 二阶方法`，或简单称为 `RK2`：\n\
  \n$$\\begin{matrix} k_{1} & {= h\\, F\\left( {t_{n},y_{n}} \\right)} \\\\ k_{2}\
  \ & {= h\\, F\\left( {t_{n} + \\frac{1}{2}h,\\, y_{n} + \\frac{1}{2}k_{1}} \\right)}\
  \ \\\\ x_{n + 1} & {= x_{n} + h} \\\\ y_{n + 1} & {= y_{i} + k_{2}} \\end{matrix}$$\n\
  \n非正式地说，`k[1]` 是区间 `[t[n], t[n+1]]` 上 `y` 的近似变化。点 $\\left( {t_{n} + \\frac{1}{2}h,\\\
  , y_{n} + \\frac{1}{2}k_{1}} \\right)$ 是区间中点处解曲线上的一个近似点。`k[2]` 是基于该点在区间内 `y` 的近似变化。希望\
  \ `k[2]` 比 `k[1]` 是更好的近似。\n\n#### **示例 5.8.1** (实现 RK2)\n\n让 `y(t)` 代表森林中第 `t` 年兔子数量（单位：千）。假设\
  \ `y` 由微分方程描述：\n\n$$\\frac{dy}{dt} = - t + 2y$$\n\n初始条件为 `y(0) = 0.3`。要使用 `h = 0.1`\
  \ 的 RK2 近似 `y(3)` 的值，将一个空白工作表重名为“**RK2**”，并按照图 5.45 进行格式化。将第 6 行向下复制到第 35 行。\n\n\
  ![fig5_45.jpg](img/fig5_45)\n图 5.45\n\n证明该问题的精确解为 `y(t) = 0.25(t + 1) + 0.05e^t`。为了比较\
  \ RK2 与精确解以及欧拉法的结果，将图 46 中的公式加入。将第 6 行向下复制到第 35 行。\n\n![fig5_46.jpg](img/fig5_46)\n\
  图 46\n\n最后，为了比较误差，加入图 47 中的图表。\n\n![fig5_47.jpg](img/fig5_47)\n图 47\n\n我们看到精确值为\
  \ `y(3) = 21.9214367`，RK2 给出 `y(3) ≈ 21.23784`，欧拉法给出 `y(3) ≈ 13.61856`。RK2 在区间 `[0,\
  \ 3]` 上产生的误差更小。因此，RK2 比欧拉法复杂，但更准确。\n\n### **Runge-Kutta 四阶方法**\n\n如上述，RK2 中的 `k[2]`\
  \ 是基于区间 `[t[n], t[n+1]]` 中点的 `y` 的近似变化。可以认为可以使用左端点、右端点然后取平均来获得更好的近似。\n\n这种想法引出了以下算法，称为\
  \ `Runge-Kutta 四阶方法`，或简单称为 `RK4`：\n\n$$\\begin{matrix} k_{1} & {= h \\cdot F\\left(\
  \ {t_{n},\\, y_{n}} \\right)} \\\\ k_{2} & {= h \\cdot F\\left( {t_{n} + \\frac{1}{2}h,\\\
  , y_{n} + \\frac{1}{2}k_{1}} \\right)} \\\\ k_{3} & {= h \\cdot F\\left( {t_{n}\
  \ + \\frac{1}{2}h,\\, y_{n} + \\frac{1}{2}k_{2}} \\right)} \\\\ k_{4} & {= h \\\
  cdot F\\left( {t_{n} + h,\\, y_{n} + k_{3}} \\right)} \\\\ t_{n + 1} & {= t_{n}\
  \ + h} \\\\ y_{n + 1} & {= y_{n} + \\frac{1}{6}k_{1} + \\frac{1}{3}k_{2} + \\frac{1}{3}k_{3}\
  \ + \\frac{1}{6}k_{4}} \\end{matrix}$$\n\n非正式地说，`k[1]` 是基于区间左端点的 `y` 变化近似，`k[2]`\
  \ 和 `k[3]` 是基于中点的近似，`k[4]` 是基于右端点的近似。$\\frac{1}{6}k_{1} + \\frac{1}{3}k_{2} + \\\
  frac{1}{3}k_{3} + \\frac{1}{6}k_{4}$ 是这些近似的加权平均值。\n\n#### **示例 5.8.2** (实现 RK4)\n\
  \n考虑示例 5.8.1。要使用 `h = 0.1` 的 RK4 近似 `y(3)`，将空白工作表重名为“**RK4**”，按照图 5.48 进行格式化并将第\
  \ 6 行向下复制到第 35 行。\n\n![fig5_48.jpg](img/fig5_48)\n图 5.48\n\n我们看到 RK4 给出 `y(3) ≈\
  \ 21.92007319`，比欧拉法或 RK2 提供的精确值 `y(3) = 21.9214367` 有更好的估计。这说明尽管 RK4 复杂，但它给出的结果准确得多。\n\
  \n### **组的 Runge-Kutta 四阶方法**\n\n考虑形式如下的微分方程组：\n\n$$\\begin{matrix} \\frac{dx}{dt}\
  \ & {= F(t,\\, x,\\, y)} \\\\ \\frac{dy}{dt} & {= G(t,\\, x,\\, y),} \\end{matrix}$$\n\
  \n初始条件为 `x (t[0]) = x[0]`，`y (t[0]) = y[0]`。我们可以根据上述 RK4 算法通过以下算法数值近似该组的解：\n\n$$\\\
  begin{matrix} k_{1} & {= h \\cdot F\\left( {t_{n},\\, x_{n},\\, y_{n}} \\right)}\
  \ & l_{1} & {= h \\cdot G\\left( {t_{n},\\, x_{n},\\, y_{n}} \\right)} \\\\ k_{2}\
  \ & {= h \\cdot F\\left( {t_{n} + \\frac{1}{2}h,\\, x_{n} + \\frac{1}{2}k_{1},\\\
  \ y_{n} + \\frac{1}{2}l_{1}} \\right)} & l_{2} & {= h \\cdot G\\left( {t_{n} + \\\
  frac{1}{2}h,\\, x_{n} + \\frac{1}{2}k_{1},\\ y_{n} + \\frac{1}{2}l_{1}} \\right)}\
  \ \\\\ k_{3} & {= h \\cdot F\\left( {t_{n} + \\frac{1}{2}h,\\, x_{n} + \\frac{1}{2}k_{2},\\\
  \ y_{n} + \\frac{1}{2}l_{2}} \\right)} & l_{3} & {= h \\cdot G\\left( {t_{n} + \\\
  frac{1}{2}h,\\, x_{n} + \\frac{1}{2}k_{2},\\ y_{n} + \\frac{1}{2}l_{2}} \\right)}\
  \ \\\\ k_{4} & {= h \\cdot F\\left( {t_{n} + h,\\, x_{n} + k_{3},\\ y_{n} + l_{3}}\
  \ \\right)} & l_{4} & {= h \\cdot G\\left( {t_{n} + h,\\, x_{n} + k_{3},\\ y_{n}\
  \ + l_{3}} \\right)} \\\\ x_{n + 1} & {= x_{n} + \\frac{1}{6}k_{1} + \\frac{1}{3}k_{2}\
  \ + \\frac{1}{3}k_{3} + \\frac{1}{6}k_{4}} & y_{n + 1} & {= y_{n} + \\frac{1}{6}l_{1}\
  \ + \\frac{1}{3}l_{2} + \\frac{1}{3}l_{3} + \\frac{1}{6}l_{4}} \\\\ t_{n + 1} &\
  \ {= t_{n} + h} & & \\end{matrix}$$\n\n#### **示例 5.8.3** (连通水箱)\n\n\n\n\n\n考虑示例\
  \ 5.4.1 中由微分方程描述的连通水箱：\n\n$$\\begin{matrix} \\frac{dx}{dt} & {= \\frac{1}{12}y -\
  \ \\frac{1}{3}x} \\\\ \\frac{dy}{dt} & {= \\frac{1}{3}x - \\frac{1}{3}y} \\end{matrix}$$\n\
  \n初始条件为 `x(0)`=4 和 `y(0)`=2。要使用步长 `h` = 0.1 的 RK4 近似 `x(5)` 和 `y(5)`，将一个空白工作表重命名为“`RK4`”并按照图\
  \ 5.49 所示进行格式化。将第 6 行复制到第 55 行。\n\n![fig5_49.jpg](img/fig5_49.jpg)\n\n图 5.49\n\n\
  从工作表中可以看出，`x(5)` ≈ 1.209623037，`y(5)` ≈ 1.926736014\n\n### 练习\n\n**5.8.1** 读者可能会好奇\
  \ RK2 和 RK4 中的“2”和“4”代表什么。为了回答这个问题，首先注意到与示例 5.8.1 和 5.8.1 中一样，RK2 和 RK4 产生函数的近似值。在这些示例中，我们得到了\
  \ `y(3)` 的近似值。现在，将*全局截断误差*（GTE）定义为\n\nGTE = |exact −��approxapproximate\n\nRK2 和\
  \ RK4 中的数字代表*收敛阶*。通俗地说，如果当 `h` “足够小”时，将步长 `h` 除以某个数 `M` 得到的 GTE 被大约除以 `M`^(*k*)，则称该数值近似方法为\
  \ `k`^(*th*) *阶收敛的*。例如对于 RK2，如果我们将 `h` 除以 2，GTE 应该被大约除以 2²。对于 RK4，GTE 应该被大约除以 2⁴。\n\
