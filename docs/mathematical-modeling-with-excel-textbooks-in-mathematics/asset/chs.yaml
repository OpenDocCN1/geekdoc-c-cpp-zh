  \ | 21.34 | 14.81 | 21.03 | 22.18 | 20.99 | 20.78 |\n\n### 6.6.9 假设一家杂货店的经理想模拟他的活动。涉及的一个随机变量是日销售额。经理查看了过去\
  \ 30 天的记录，并将日销售额汇总如下（例如，第一行表示有 5 天的销售额在 1000 到 1099 之间）。\n\n| 销售额 | 频率 |\n| :---\
  \ | --- |\n| 1000-1099 | 5 |\n| 1100-1199 | 15 |\n| 1200-1299 | 45 |\n| 1300-1399\
  \ | 100 |\n| 1400-1499 | 200 |\n| 1500-1599 | 250 |\n| 1600-1699 | 170 |\n| 1700-1799\
  \ | 80 |\n| 1800-1899 | 35 |\n| 1900-1999 | 30 |\n\n1. 该随机变量似乎具有什么类型的分布？简要说明你的理由。\n\
  2. 此类汇总数据的均值和标准差可以使用以下公式近似：\n$$\\overline{x} \\approx \\frac{1}{n}\\sum(f \\cdot\
  \ x)\\quad\\quad\\quad s \\approx \\sqrt{\\frac{n\\sum(f \\cdot x^{2}) - \\left[\
  \ \\sum(f \\cdot x) \\right]^{2}}{n(n - 1)}}$$\n其中 `n` 是数据的总数（频率和），`x` 是区间的中点，`f`\
  \ 是相应的频率。使用这些公式近似均值和标准差。\n\n### 6.6.10 在工作表中，我们使用公式 `x = - \\frac{1}{\\lambda}\\\
  ln(1 - RAND)` 生成指数随机变量的值。假设我们改用公式 `x = - \\frac{1}{\\lambda}\\ln(RAND)`。这会改变直方图的形状吗？为什么？\n\
  \n### 6.6.11 概率论中最重要的定理之一是中心极限定定理。通俗地说，该定理指出，如果我们生成若干个随机变量的值并计算这些值的均值，无论原始随机变量的分布如何，该均值都服从正态分布。该练习的目的是通过图形证明这一定理是正确的。\n\
  \n1. 生成 30 个指数分布随机变量的值（选择你自己的参数 `λ` 值），并计算这 30 个值的均值。\n2. 重复步骤 a 250 次。\n3. 为这 250\
  \ 个均值创建一个直方图。这个直方图像钟形曲线吗？\n4. 将参数值改为几个不同的值。对直方图的形状有什么发现？\n5. 对正态分布的原始变量重复步骤 a-d。然后对均匀分布重复。\n\
  6. 中心极限定理还说，均值的均值近似等于原始变量的均值。此外，均值的标准差近似等于原始变量的标准差除以样本量的平方根（本练习中样本量为 30）。检查这两点对于每个分布是否成立。\n\
  7. 这些对于中心极限定理的有效性说明了什么？\n\n### 6.6.12 如第 6.5 节（15_Chapter06.xhtml_sec6_8）所示，Diehard\
  \ 是随机数生成器的测试系列。这些测试之一被称为三维球测试。为了说明该测试背后的基本思想，考虑以下简化版本：\n\n1. 使用 `RANDBETWEEN` 函数在边长为\
  \ 100 的立方体内的 3 维空间中生成 10 个点。也就是说，生成 10 个形式为 `(x, y, z)` 的点，每个坐标都是 0 到 100 之间的整数。（真实的三维球测试在边长为\
  \ 1000 的立方体内使用 4000 个点。）\n2. 计算每对点之间的欧几里得距离。得到 45 个距离。\n3. 令 `r` = 步骤 2 中距离的最小值。计算半径为\
  \ `r` 的球体积。\n4. 重复步骤 1-3 总共 500 次，以收集 500 个体积。计算平均体积并使用 8 个分箱生成体积的直方图。\n\n步骤 4 Find\
  \ 的平均值和分布是判断伪随机数生成器的基准。如果生成器没有产生相同的平均值和分布，则未通过测试。\n\n1. 执行步骤 1-4。平均体积是多少？体积似乎具有什么类型的分布？\n\
  \n\n\n\n2. 将该测试应用于示例 6.5.1 中描述的线性同余生成器，参数分别为 `a` = 99，`b` = 3 且 `m` = 101。即执行第 1-4\
  \ 步，但使用线性同余生成器生成坐标。使用 `RANDBETWEEN` 函数生成种子值 `x[0]`。该生成器通过测试了吗？\n\n3. 现在将该测试应用于参数为\
  \ `a` = 54，`b` = 70 且 `m` = 101 的线性同余生成器。该生成器通过测试了吗？\n\n4. 尝试参数 `a` = 54，`b` = 68\
  \ 且 `m` = 101。该生成器通过测试了吗？\n\n5. 假设我们要生成更多的点（例如在真实的 3D 球体测试中生成 4,000 个）。这会增加还是减少步骤\
  \ 4 中发现的平均体积？请解释原因。\n\n## 6.7 理论排队模型](#06_Contents.xhtml_rsec6_7)\n\n简单来说，`queue`（队列）是一个等待队。一个典型的例子是人们排队买电影票。另一个例子是组装线，汽水瓶在等待填充液体。排队涉及两个重要的实体：`customers`（客户）和\
  \ `servers`（服务器）。服务器是任何用于处理客户的实体。在电影票排队队列中，客户是想要买票的人，而服务器是售票的人。\n\n假设你来到一个电影票窗口想买票，看到有一长队人在等待。你脑中可能会产生两个问题：\n\
  \n1. 我预计需要等多久？\n2. 队列中等待的平均人数是多少？\n\n在本节中，我们将构建一个单服务队列的模拟模型来帮助回答这些问题。图 6.53 展示了前三个客户的到达情况。每个客户的到达时间是随机的，服务时间也是如此。等待时间和开始服务时间是根据上一个客户的完成情况计算的。\n\
  \n![fig6_53.jpg](img/fig6_53.jpg)\n\n图 6.53\n\n我们需要对两个随机变量进行建模：(1) 到达之间的时间和 (2)\
  \ 服务时间。\n\n**到达间隔**：从理论上可以证明，指数分布是到达间隔的良好模型。因此，我们使用具有参数 `λ[1]` 的这种分布来生成到达间隔。根据指数分布的性质：\n\
  \n* `1/λ[1]` = 平均到达间隔；以及\n* `λ[1]` = 单位时间内的平均到达人数，称为 `arrival rate`（到达率）。\n\n**服务时间**：这个随机变量可以使用任何类型的分布进行建模，但通常使用指数分布。将相关参数命名为\
  \ `λ[2]`。根据指数分布的性质：\n\n* `1/λ[2]` = 平均服务时间；以及\n* `λ[2]` = 单位时间内接受服务的平均客户数，称为 `service\
  \ rate`（服务率）。\n\n**示例 6.7.1**\n\n考虑一个单服务队列，其中到达间隔和服务时间均由指数分布描述（此类队列被称为 `M/M/1 队列`），其到达率为\
  \ `λ[1]` = 每分钟 2 个客户，服务率为 `λ[2]` = 每分钟 3 个客户。在这里我们构建一个模拟来估计平均等待时间。\n\n**算法**\n\n\
  1. 对于每个客户：\n    1. 生成一个到达间隔。\n    2. 计算到达时间。\n    3. 根据上一个客户的完成时间计算开始时间。\n    4.\
  \ 生成服务时间。\n    5. 计算完成时间。\n    6. 计算在队列中等待的时间。\n    7. 计算截至目前所有客户的累计等待时间。\n    8.\
  \ 计算截至目前所有客户的平均等待时间。\n2. 对 5000 个客户重复上述操作。\n\n要实现此算法，请遵循以下步骤：\n\n1. 将一个空白工作表重命名为\
  \ `Queue`。按照图 6.54 所示所示格式化工作表。\n\n   ![fig6_54.jpg](img/fig6_54.jpg)\n\n   图 6.54\n\
