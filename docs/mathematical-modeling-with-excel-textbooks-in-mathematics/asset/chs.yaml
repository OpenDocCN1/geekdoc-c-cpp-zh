  \n![fig3_21.jpg](img/fig3_21.jpg)\n图 3.21\n\n![fig3_22.jpg](img/fig3_22.jpg)\n图\
  \ 3.22\n\n## 3.3 多项式\n\n多项式模型通常非常好用，因为它们容易求导和积分。定理 3.3.1 是代数中关于对数据拟合多项式模型的一个为人知的结论。\n\
  \n定理 3.3.1. *给定一组数据 `{(x[i], y[i]):i = 1, …, n}`，其中对于所有 `i ≠ j` 有 `x[i] ≠ x[j]`，则存在一个次数最多为\
  \ `n-1` 的唯一多项式 `p(x)`，使得对于所有 `i = 1, …, n` 都有 `p(x[i]) = y[i]`。*\n\n从图上看，这意味着图线通过所有点。\n\
  \n### 3.3.1 示例（三点）\n考虑对三个数据点 `{(1, 2), (2, 4), (3, 5)}` 拟合二次多项式 `y = ax² + bx +\
  \ c`。为了找到 `a`, `b` 和 `c`，我们希望：\n```\na(1²) + b(1) + c = 2\na(2²) + b(2) + c = 4\n\
  a(3²) + b(3) + c = 5\n```\n这组方程可以写成矩阵形式：\n```\n\\begin{bmatrix} 1 & 1 & 1 \\\\ 4\
  \ & 2 & 1 \\\\ 9 & 3 & 1 \\end{bmatrix} \\begin{bmatrix} a \\\\ b \\\\ c \\end{bmatrix}\
  \ = \\begin{bmatrix} 2 \\\\ 4 \\\\ 5 \\end{bmatrix}\n```\n通过解该方程组，我们可以得到：\n```\n\
  a = 0, b = 1, c = 1\n```\n因此，多项式模型为 `y = x + 1`。\n\n### 3.3.2 示例（四点）\n考虑对四个数据点 `{(1,\
  \ 2), (2, 3), (3, 5), (4, 4)}` 拟合二次多项式 `y = ax² + bx + c`。由于点数多于方程个数，不存在完美的拟合。此时我们使用最小二乘法。\n\
  \n![fig3_23.jpg](img/fig3_23.jpg)\n图 3.23\n\n![fig3_24.jpg](img/fig3_24.jpg)\n图\
  \ 3.24\n\n![fig3_25.jpg](img/fig3_25.jpg)\n图 3.25\n\n\n\n\n\n注意定理 3.3.2 并没有说一般的矩阵方程\
  \ `A`x = `b` 有唯一的最小二乘解。通常情况下，可能有多个最小二乘解。然而，如果 `A^(T)A` 是可逆的，则解是唯一的。在对数据进行曲线拟合时，`A^(T)A`\
  \ 通常是可逆的，因此我们可以使用公式 (3.2) 来计算 $\\hat{\\mathbf{x}}$。正如我们后面将看到的，这种技术也可以用于对数据进行拟合其他类型的模型。\n\
  \n### 示例 3.3.2（计算最小二乘解）\n\n为了在 Excel 中使用公式 (3.2) 计算 $\\hat{\\mathbf{x}}$，我们首先将计算\
  \ `A^(T)`，然后是 `A^(T)A`，紧接着是 `(A^(T)A)^(−1)`，然后是 `(A^(T)A)^(−1)A^(T)`，最后是 `(A^(T)A)^(−1)A^(T)b`。\n\
  \n1. 将一个空白工作表重命名为“Poly 4 points”，按照图 3.24 进行格式设置。\n![fig3_24.jpg](img/fig3_24.jpg)\n\
  图 3.24\n\n2. 按照图 3.25 格式电子表格，以保存所需的各种矩阵计算。\n![fig3_25.jpg](img/fig3_25.jpg)\n图 3.25\n\
  \n3. 选中区域 `A9:D11`，输入 `=TRANSPOSE(D2:F5)` 并按下 `Ctrl-Shift-Enter`。\n\n4. 选中区域 `F9:H11`，输入\
  \ `=MMULT(A9:D11,D2:F5)` 并按下 `Ctrl-Shift-Enter`。\n\n5. 选中区域 `A14:C16`，输入 `=MINVERSE(F9:H11)`\
  \ 并按下 `Ctrl-Shift-Enter`。\n\n6. 选中区域 `E14:H16`，输入 `=MMULT(A14:C16,A9:D11)` 并按下 `Ctrl-Shift-Enter`。\n\
  \n7. 选中区域 `B19:B21`，输入 `=MMULT(E14:H16,H2:H5)` 并按下 `Ctrl-Shift-Enter`。结果显示在图 3.26\
  \ 中。这意味着我们的多项式模型为 `y = −1.25 *x² + 6.35 *x − 3.25`。这种模型被称为最小二乘二次多项式模型。\n![fig3_26.jpg](img/fig3_26.jpg)\n\
  图 3.26\n\n8. 创建数据点的图，添加二次多项式趋势线，并按照图 3.27 在图表显示方程。注意，该模型与我们计算的完全相同。\n![fig3_27](img/fig3_27.jpg)\n\
  图 3.27\n\n### 示例 3.3.3（计算 R² 值）\n\n在第 2.7 节 中，我们将变异系数 $R²$ 定义为衡量直线与一组数据拟合程度的指标。随后，我们将这一思想应用于线性化模型，通过计算变换后数据直线拟合的\
  \ $R²$ 值。多项式模型不可线性化，因此为了计算这类模型的 $R²$ 值，我们必须使用定义。定义如下：\n\n$$R^{2} = \\frac{SS_{Tot}\
  \ - SS_{Res}}{SS_{Tot}}$$\n\n其中 $SS_{Tot} = \\sum{(y_{i} - \\overline{y})^{2}}$，$SS[Res]\
  \ = \\sum(y[i] − \\hat{y}[i])²$，$\\overline{y}$ 是数据集中所有 $y$ 值的平均值，而 $\\hat{y}[i]$\
  \ 是根据模型对 $y[i]$ 的预测值。这里我们使用多项式模型 `y = −1.25 *x² + 6.35 *x − 3.25` 来计算 $\\hat{y}[i]$。\n\
  \n1. 将一个空白工作表重命名为“Poly R2”，并按照图 3.28 进行格式设置。R² 值为 0.9333，表示拟合效果非常好。\n\n2. Excel\
  \ 会自动计算此 $R²$ 值。在 `Poly 4 points` 工作表的 $y$ 决 $x$ 图中，通过右键点击趋势线并选择`设置趋势线 → 选项 → 在图表上显示\
  \ R 平`将 $R²$ 值添加到多项式趋势线中。该值与我们计算的结果相等。\n![fig3_28.jpg](img/fig3_28.jpg)\n图 28\n\n\
