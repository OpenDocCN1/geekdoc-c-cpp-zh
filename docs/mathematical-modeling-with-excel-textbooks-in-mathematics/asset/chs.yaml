  \nExcel 的“求解”搜索引擎包含一种用于求解非线性程序的算法，称为 `GRG 非线性`。在本节中，我们将讨论该算法针对具有一个决策变量的无约束非线性程序的基本思想。该算法基于依赖导数的`梯度法`。\n\
  \n#### 示例 8.4.1 (使用求解器)\n\n考虑以下具有一个决策变量的无约束非线性程序：\n\n`最小化 f(x) = x⁴ − 8x³ + 20x²\
  \ − 16.5x + 7`\n\n该函数 `f(x)` 的图如图图 8.17 所示。我们看到 `f` 在 0.6 附近有一个局部最小值，在 3.4 附近有一个全局最小值。在这个问题中，我们要求找到全局最小值的位置。\n\
  \n![fig8_17.jpg](img/fig8_17.jpg)\n\n图 8.17\n\n要使用求解器解决此问题，将一个空白工作表重命名为“**Solver**”，按照图\
  \ 8.18 所示进行格式设置。\n\n![fig8_18.jpg](img/fig8_18.jpg)\n\n图 8.18\n\n设置求解器参数，通过更改单元格\
  \ `A2` 来最小化单元格 `B2`。不要添加任何约束，也不让无约束变量非负。选择求解方法 `GRG Nonlinear`。它给出的解如图图 8.19 所示。注意它找到了局部最小值。这被称为*陷入局部最小值*。\n\
  \n![fig8_19.jpg](img/fig8_19.jpg)\n\n图 8.19\n\n接下来，将 `x` 的值设置为 4（即在单元格 `A2` 中输入\
  \ 4）并求解。结果如图图 8.20 所示。这次求解器找到了全局最小值。□\n\n![fig8_20.jpg](img/fig8_20.jpg)\n\n图 8.20\n\
  \n为了理解为什么求解器并不总是找到全局最小值，我们需要检查梯度法的工作原理。梯度法是一种寻找函数临界点的迭代方法（即 `f′ (x) = 0` 的 `x` 值）。下面是梯度法的简化版本。\n\
  \n**一元梯度法**：为了最小化单变量可微函数 `f(x)`：\n\n1. 选择一个初始值 `x[0]`。\n2. 令 `x[k+1] = x[k] − λf'(k])`，其中\
  \ `λ > 0` 是某个指定的常数。\n3. 重复步骤 2 50 次迭代（50 次迭代是任意的）。\n\n梯度法的基本思想是，如果导数 `f'(k])` 为正，则函数是递增的，因此我们希望减小\
  \ `x[k]`。如果 `f'(k])` 为负，则函数是递减的，因此我们希望增加 `x[k]`。常数 `λ` 影响 `x[k]` 的变化量。在更复杂的版本中，算法在\
  \ `f'(k])` 足够接近 0 时停止，而不是任意执行 50 次（见练习 8.4）。理想情况下，当算法停止时，`x[k]` 位于临界点。我们可以通过将步骤\
  \ 2 中的减号改为加号来最大化函数。\n\n#### 示例 8.4.2 (实现梯度法)\n\n为了实现非线性程序，请遵循以下步骤：\n\n1. 创建一个如图图\
  \ 8.21 所示的 `f(x)` 图，范围在 `0 ≤ x ≤ 4` 上。将一个空白工作表重命名为 `1-Dim` 并按照图 8.22 所示进行格式设置。添加公式到第\
  \ 5。\n\n![fig8_21.jpg](img/fig8_21.jpg)\n\n图 8.21\n\n2. 创建如图图 8.23 所示的图。\n\n![fig8_22.jpg](img/fig8_22.jpg)\n\
  \n图 8.22\n\n3. 将公式添加如图图 8.24 所示并复制到第 5。\n\n![fig8_23.jpg](img/fig8_23.jpg)\n\n图\
  \ 8.23\n\n4. 为了可视化该算法的工作原理，添加一个滚动条并链接到单元格 `J2`，范围为 0 到 9。\n\n![fig8_24.jpg](img/fig8_24.jpg)\n\
  \n图 8.24\n\n5. 将 `K2:L2` 添加为图中的点，并将其格式设置为类似于图 8.25。\n\n![fig8_25.jpg](img/fig8_25.jpg)\n\
  \n图 8.25\n\n来移动滚动条，观察图上的点最终如何稳定在两个最小值之一。改变初始值 `x` 和 `λ` 的值，并观察它们如何影响搜索。注意，如果 `λ`\
  \ 很大（例如 `λ = 0.2`），点会跳动且不会稳定在局部最小值。\n\n### 练习\n\n**8.4.1** 在我们的简单梯度算法中，我们任意执行了 50\
