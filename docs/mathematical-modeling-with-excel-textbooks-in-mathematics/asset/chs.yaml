  ## 2.5 几何相似性\n圆形和矩形等形状很容易处理。我们可以使用非常简单的公式计算这些形状的面积和体积。现实世界的物体很少以这些简单的形式出现。这需要一些简化假设。几何相似就是其中一种假设。\n\
  \n**定义 2.5.1.** 如果满足以下两个条件，则两个物体是*几何相似的*：\n\n1. 物体的点之间存在一一对应关系（即两个物体具有相同的“形状”）。\n\
  2. 对应点之间距离的比例对于所有点对都是相同的。\n\n\n\n\n\n$$6 = \\frac{6}{3^{2}}\\left( 3^{2} \\right)\
  \ = \\frac{2}{3}\\left( 3^{2} \\right)$$\n\n现在考虑另一个长为 5 cm、高为 4 cm 的矩形。它的面积为 20\
  \ cm²，这与长度的平方正比，因为\n\n$$20 = \\frac{20}{5^{2}}\\left( 5^{2} \\right) = \\frac{4}{5}\\\
  left( 5^{2} \\right)$$\n\n考虑第三个长为 6 cm、高为 4 cm 的矩形。这个矩形是第一个矩形的放大版本（它的尺寸仅仅是第一个矩形的\
  \ 2 倍）。换句话说，这两个矩形在几何上是相似的。它的面积为 24 cm²，这与长度的平方正比，因为\n\n$$24 = \\frac{24}{6^{2}}\\\
  left( 6^{2} \\right) = \\frac{2}{3}\\left( 6^{2} \\right)$$\n\n注意，这两个几何相似矩形的比例常数是相同的。第二个矩形与另外两个矩形在几何上不相似，它的比例常数与其他不同。\n\
  \n让我们推广这个例子。假设我们有一个长为 `3k` cm、宽为 `2k` cm 的矩形，其中 `k` 是某个正数。这个矩形与第一个矩形在几何上相似。它的面积为\
  \ `6k²` cm²，与长度的平方正比，因为\n\n$$6k^{2} = \\frac{6k^{2}}{(3k)^{2}}(3k)^{2} = \\frac{2}{3}(3k)^{2}$$\n\
  \n再次注意，比例常数与其他几何相似矩形相同。这意味着什么？假设我们有一袋矩形，每个形长为 `3k` cm、宽为 `2k` cm，其中 `k > 0` 对于每个矩形都不同。如果我们从袋子里拿出一个矩形并想知道它的面积，我们不需要同时测量长度和高度。只需要测量长度，将其平方，然后乘以\
  \ `2/3`。这简化了寻找面积的过程。\n\n长度是一个*特征维度*的例子。特征维度简单来说就是易于测量的尺寸。我们可以选择高度作为特征维度并进行上述相同的分析，但比例常数将会是不同的。\n\
  \n这种推广说明了几何相似对象的第一个重要特性。\n\n**定理 2.5.1.** 假设 `H` 是一个几何相似对象的集合。让 `A` 表示对象的表面积，`l`\
  \ 表示特征维度。那么\n\n$A ∝ l^{2},$\n\n且 `H` 中每个对象的比例常数都是相同的。\n\n注意，定理 2.5.1 并没有假设对象的任何特定形状或维度。这一特性允许我们简化复杂形状面积的建模。\n\
  \n**示例 2.5.1 (羊毛)**\n\n一个牧羊人想预测他从羊身上获得的羊毛体积 `V`，相对于羊的周长（肚子最肥处的距离）。体积是羊毛的厚度乘以剪羊毛的面积。这个面积不是简单的形状，因此我们将使用几何相似性来简化模型。考虑以下假设：\n\
  \n1. 每只羊的羊毛厚度是相同的。\n2. 每只羊身上剪羊毛的区域在几何上是相似的。\n\n第一个假设允许我们建模\n\n| $V ∝ A$ | (2.8)\
  \ |\n| --- | --- |\n\n其中 `A` 是剪羊毛的面积。第二个假设允许我们建模\n\n| $A ∝ l^{2}$ | (2.9) |\n| ---\
  \ | --- |\n\n其中 `l` 是某个特征维度。我们将选择周长（肚子的周）作为这个维度。通过传递性结合 (2.8 和 (2.9，我们得到\n\n| $V ∝ l^{2}$\
  \ | (2.10) |\n| --- | --- |\n\n为了找到比例常数并测试假设，我们需要收集体积和周长的数据。现在考虑一个三维对象。具体考虑一个宽 4\
  \ cm、高 3 cm、深 2 cm 的立方体。它的体积是 24 cm³，与高度的立方正比，因为\n\n$$24 = \\frac{24}{3^{3}}\\left(\
  \ 3^{3} \\right).$$\n\n考虑一个宽为 `4k` cm、高为 `3k` cm、深为 `2k` cm 的几何相似立方体，其中 `k > 0`。它的体积是\
  \ `24k³` cm³，再次与高度的立方正比，因为\n\n$$24k^{3} = \\frac{24k^{3}}{(3k)^{3}}\\left(3k\\right).$$\n\
  \n注意比例常数是相同的。这种推广说明了第二个性质。\n\n**定理 2.5.2.** 假设 `H` 是几何相似对象的集合。让 `V` 表示对象的体积，`l`\
  \ 表示特征维度。那么\n\n$V ∝ l^{3},$\n\n且 `H` 中每个对象的比例常数都是相同的。\n\n**示例 2.5.2 (土豆的表面积)**\n\
  \n假设我们在超市准备一批“脆皮”，有两种尺寸可选：买 8 个 0.25 磅的小豆，还是买 4 个 0.5 磅的大豆？为了回答这个问题，我们需要建立表面积与重量的关系。由于土豆按重量出售，原始问题中的每种选择成本相同，因此我们想要表面积最大的。等等，土豆按重量出售，所以第一个假设允许我们建模\n\
  \n| $W ∝ V$ | (2.11) |\n| --- | --- |\n\n其中 `W` 是重量，`V` 是体积。第二个假设允许我们建模\n\n| $V ∝ l^{3}$\
  \ | (2.12) |\n| --- | --- |\n\n其中 `l` 是某个特征维度。结合 (2.11 和 (2.12，我们得到\n\n| $W ∝ l^{3}$\
  \ | (2.13) |\n| --- | --- |\n\n注意比例常数与其他几何相似矩形相同。第二个假设允许我们建模\n\n| $A ∝ l^{2}$ |\
  \ (2.14) |\n| --- | --- |\n\n其中 `A` 是表面积，`l` 是特征维度。重写 (2.13 并将其结合 (2.14，我们得到\n\n\
  | $l ∝ W^{1/3} \\quad\\to\\��A ∝ $(W^{1/3})^{2} == A ∝ W^{2/3}$ | (2.15) |\n| ---\
  \ | --- |\n\n由于土豆按重量出售，原始问题中的每种选择成本相同，因此我们想要表面积最大的。如果 $A[S]$ 和 $A[L]$ 分别代表小豆和大豆的总体表面积，那么\
  \ (2.15 给出\n\n$A[S] = 8k(0.25)^{2/3}$  $A[L] = 4k(0.5)^{2/3}$\n\n其中 $k$ 是某个常数（注意\
  \ $k$ 对于 $A[S]$ 和 $A[L]$ 都是相同的）。因此\n\n$$\\frac{A_{S}}{A_{L}} = \\frac{8k(0.25)^{2/3}}{4k(0.5)^{2/3}}\
  \ \\approx 1.26\\quad\\Rightarrow\\quad A_{S} \\approx 1.26A_{L}$$\n\n因此，小土豆的表面积比大土豆的表面积大约大\
  \ 26%。所以我们应该买小土豆。\n\n练习题\n\n\n\n\n\n### 2.5.1 回答以下与几何相似和比例相关的问题：\n\n1. 如果水瓶在几何上是相似的，那么高\
  \ 30 厘米的水瓶装水量比高 10 厘米的水瓶多多少？\n\n2. 如果空气阻力与给定速度下下落体的表面积成正比，那么直径 5 厘米的球体受到的空气阻力比直径\
  \ 1 厘米的球体多少？\n\n3. 如果运动员的密度恒，则重量与体积成正比。如果我们进一步假设他们在几何上是相似的，那么身高 5 英尺的运动员比身高 5.5\
  \ 英尺的运动员轻多少？\n\n4. 如果心脏在几何上是相似的，且每次跳动泵出的血液与心脏体积成正比，那么宽 4 厘米的心脏每次泵出的血液比宽 1 厘米的心脏多多少？\n\
  \n5. 如果潜艇单位时间内流失的热量与其表面积成正比，那么长 50 英尺的潜艇在给定时间内流失的热量比长 10 英尺的模型多多少？\n\n6. 如果物体在几何上相似的且具有恒定密度，我们在示例\
  \ 2.5.2 中看到 `A` ∝ `W`^(2/3)，其中 `A` = 表面积，`W` = 重量。如果一个对象的重量是另一个对象的 5 倍，表面积是多少？\n\
  \n7. 假设冰块在融化，使得在任何时间点，剩余的立方体与初始立方体（即开始融化之前）几何相似。在某一时刻，长度是初始长度的一半。初始体积的比例是多少？\n\n\
  8. 假设两只大象在几何上相似且具有恒定密度。如果一只大象重 3,500 磅，另一只重 7,000 磅，大象的表面积比小大象大多少？\n\n### 2.5.2\
  \ 在以下场景中推导比例模型。确保在每个模型中定义变量。\n\n1. 如果纸上画的某些直角三角形在几何上相似，请用直角边的长度对三角形面积进行建模。\n\n2.\
  \ 如果袋里的某些立方体在几何上相似，请用对角线距离对立方体的体积进行建模。\n\n3. 如果袋里的某些石头在几何上相似且具有恒定密度，请用重量对石头的表面积进行建模。\n\
  \n4. 如果某些空心铝管的侧壁厚为 1 mm，且管子外表面在几何上相似，请用长度对制造管子所需的铝体积进行建模。\n\n5. 如果某些货机在几何上相似，机翼的升力与机翼表面积成正比，飞机的载量与其机翼升力直接正比，请用翼展对飞机的载量进行建模。\n\
  \n6. 如果架上的某些书在几何上相似且密度恒定，且书的厚度与页数成正比，请用页数对书的重量进行建模。\n\n### 2.5.3 考虑两个几何相似的对象，对应点距离比例为常数\
