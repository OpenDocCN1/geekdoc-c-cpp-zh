  \n## 优化\n\n### 目标\n\n*   讨论优化概念\n*   介绍线性规划\n*   讨论运输问题\n*   讨论单纯形法\n\n### 7.1 引言\n\
  \n在微积分中，我们通过对函数\n\n```f(x) = -2x² + 3x\n```\n\n求导并设为 0 来解决问题。这是一个非常简单的优化问题（简称 OP）。实际情况通常涉及更复杂的优化，例如企业试图决定生产多少产品以实现利润最大化。\n\
  \n每个 OP 都包含两个部分：决策变量(s) 和目标函数。目标函数是被最大化的函数。决策变量是涉及的变量。OP 的基本目标是找到使目标函数最大的变量值。\n\n\
  优化问题通常分为两大类：约束和无约束。约束 OP 是决策变量的值有限制。无约束 OP 则没有这些限制。这些限制有多种形式，包括：\n\n1.  非负性（决策变量必须是非负的）\n\
  2.  整数性（决策变量必须是整数）\n3.  二元性（决策变量必须为 0 或 1）\n4.  等式（例如 `x + y = 5`）\n5.  不等式（例如 `x\
  \ + y ≥ 6`）\n\n### 7.2 线性规划\n\n在本章关注的优化问题类型被称为线性规划（LP），它是一种线性约束 OP。具体来说，如果一个优化问题满足以下五个属性，则它被称为线性规划：\n\
  \n1.  有一个唯一的目标函数。\n2.  当决策变量出现在目标函数或约束函数时，它的指数必须为 1，可能乘以一个常数。\n\n\n\n\n3. 没有项包含决策变量的乘积。\n\
  \n4. 决策变量的所有系数均为常数。\n\n5. 决策变量允许取小数或整数值。\n\n一个线性规划（LP）的示例是：\n\n| $$\\begin{matrix}\
  \ \\textbf{Maximize} & Z & = & {25x_{1}} & + & {30x_{2}} & & \\\\ \\textbf{Subject\
  \ to} & & & {20x_{1}} & + & {30x_{2}} & \\leq & 600 \\\\ & & & {5x_{1}} & - & {4x_{2}}\
  \ & \\leq & 4 \\\\ & & & x_{1} & \\geq & {4,\\, x_{2}} & \\geq & 2. \\end{matrix}$$\
  \ | (7.1) |\n\n| --- | --- |\n\n在这种情况下，目标函数为 `25*x*[1] + 30 *x*[2]`，其值用 `Z` 表示。LP\
  \ 的`solution`（也称为`schedule`或`feasible solution`）是任何满足约束条件的决策变量值集合。例如，LP (7.1)的`solution`为`x*[1]\
  \ = 5`，`x*[2] = 6`。`optimal solution`是在所有可能的解中使目标函数获得最大（或最小）值的解。找到解相对容易。找到`optimal`解并不容易。\n\
  \n用于求解线性规划问题最优解的算法称为`Simplex method`。Excel 将此算法作为其`Solver`工具的一部分。在第 7.6 节中我们将讨论单纯形的工作原理。在本节中，我们将使用`Solver`求解一些简单的线性规划。\n\
  \n**示例 7.2.1**（制作果篮）\n\n某社区超市水果部门的经理正在为忙碌的假期期间制作果篮。他销售两种尺寸的果篮：大和小号。他只剩下 200 个苹果和\
  \ 100 个橙子，正试图决定每种尺寸应该制作多少。每个小果篮的利润为 3 美元，需要 3 个苹果和 1 个橙子；而每个大果篮的利润为 4 美元，需要 2 个苹果和\
  \ 2 个橙子。假设他能卖掉制作的所有产品，他应该制作多少种尺寸的以实现利润最大化？\n\n建模此类问题的第一步是将所有给定信息整理成`mixture chart`，如表\
  \ 7.1 所示。两种尺寸的果篮通称为`products`，苹果和橙子称为`resources`。\n\n表 7.1\n\n|  | **Products**\
  \ |  |  |\n| --- | --- | --- | --- |\n| **Resources** | **Small** | **Large** |\
  \ **Amount Available** |\n| --- | --- | --- | --- |\n| **Apples** | 3 | 2 | 200\
  \ |\n| **Oranges** | 1 | 2 | 100 |\n| **Profit** | 3 | 4 |  |\n\n下一步是定义变量并编写一组不等式对该情况进行建模。如果`s`表示要生产的小果篮数量，`l`表示要生产的大果篮数量，则模型为：\n\
  \n$$\\begin{matrix} \\textbf{Maximize} & P & = & {3s} & + & {4l} & & \\\\ \\textbf{Subject\
  \ to} & & & {3s} & + & {2l} & \\leq & 200 \\\\ & & & {1s} & + & {2l} & \\leq & 100\
  \ \\\\ & & & & & {s,\\, l} & \\geq & 0 \\end{matrix}$$\n\n目标函数`3*s + 4*l`给出总利润。第一个约束说明我们使用的苹果不能超过\
  \ 200 个，第二个约束说明我们使用的橙子不能超过 100 个。最后两个约束是非负约束，说明我们不能生产负数数量的果篮。\n\n要解此 LP，将空白工作表重命名为“Fruit\
  \ Baskets”，并按照图 7.1 进行格式设置。`B2:C2`范围内的数字是`s`和`l`的值（这些还不是最优值）。\n\n![fig7_1.jpg](img/fig7_1.jpg)\n\
