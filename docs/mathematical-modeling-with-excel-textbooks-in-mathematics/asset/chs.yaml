  \n![fig4_33.jpg](img/fig4_3.jpg)\n\n图 4.33\n\n### 项目主意\n1. 尝试使用简单的流行模型对美国糖尿病随时间变化的传播进行建模。\n\
  2. 使用流行模型对假设的僵尸入侵进行建模。\n3. 研究在流行模型建模疫苗接种的不同方法。\n4. 模拟一个涉及隔离和疫苗接种的流行。\n5. 使用流行模型模拟山松虫对扭叶松树的侵害。\n\
