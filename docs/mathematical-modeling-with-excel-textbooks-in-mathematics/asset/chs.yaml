  \n## 7.2.3 一家援助机构正在发送食物和衣服箱以帮助飓风灾民。\n\n1. 军提议运输这些箱子，前提是它们能装进可用的货物空间。每个 `20-ft³`\
  \ 的食物箱重量为 `40 lbs`，每个 `30-ft³` 的衣服箱重量为 `20 lbs`。总重量不能超过 `16,000 lbs`，总体积不能超过 `18,000\
  \ ft³`。每箱食物可以供 10 个人食用，每箱衣服可以帮助 8 个人穿衣。为了使受援助总人数最大化，应该发送多少箱食物和多少箱衣服？将援助多少人？\n\n\
  2. 假设一家卡车公司提供免费运送 550 箱衣服和 165 箱食物。他们声称可以比军队更快地完成交货。你会建议接受他们的提议吗？简要说明理由或不理由。\n\n\
