  图 8.58\n\n### 练习\n\n**8.8.1** 求解 TSP 的一种简单启发式方法是最近邻算法，它认为在回路的每一步，销售员应该访问尚未访问过的最近城市。应用此算法，从城市\
  \ 1 开始求解示例 8.8.1。将生成的回路与 `Solver` 找到的回路进行比较。\n\n**8.8.2** 关于 TSP 最优解的一个事实是回路不应该自交叉。作为该事实成立的例子，考虑来自示例\
