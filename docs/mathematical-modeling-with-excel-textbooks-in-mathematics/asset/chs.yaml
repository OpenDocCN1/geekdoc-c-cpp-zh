  \ − 1 + 1 - 1 + \\dots = 1/2$。他通过考虑部分和序列来实现这一点的：\n\n   `1, 0, 1, …`\n\n   根据微积分\
  \ II 中收敛级数的定义，当且仅当部分和序列收敛于数值 `S` 时，级数收敛于 `S`。这个部分和序列收敛于 $1/2$ 吗？这对于 $1 − 1 + 1 -\
  \ 1 + \\dots = 1/2$ 假设的有效性意味着什么？\n\n2. 证明的其余基于 $1 − 1 + 1 - 1 + \\dots = 1/2$ 假设。在不考虑证明其余细节的情况下，我们对于\
  \ $1 + 2 + 3 + \\dots = -1/12$ 这一最终结论的有效性可以说什么？\n\n### 延伸阅读\n\n- 关于建模过程及相关问题的进一步讨论，请参阅\
  \ Frank. R. Giordano, M. D. Weir, and W. P. Fox, *A First Course in Mathematical\
  \ Modeling*, Third ed., Thomson Brooks/Cole, 2003, pg. 52–63.\n- 关于建模方法的更多信息、报告写作技巧以及大量的示例题，请参阅\
  \ Dilwyn Edwards and Mike Hamson, *Guide to Mathematical Modelling*, CRC Press,\
  \ 1990.\n- 关于数学建模益处的讨论，请参阅 Lucas, William F., The Impact and Benefits of Mathematical\
  \ Modeling, in *Applied Mathematical Modeling* (D.R Shier and K.T. Wallenius eds.),\
  \ Chapman and Hall/CRC, 1999, pg. 1–25， 以及包含的参考文献。\n- 关于假设如何影响环境模型的详细讨论，请参阅 Orrin\
  \ H. Pilkey and Linda Pilkey–Jarvis, *Useless Arithmetic: Why Environmental Scientists\
  \ Can’t Predict the Future*, Columbia University Press, 2007.\n- 关于全球变暖模型背后某些假设的简要讨论，请参阅\
