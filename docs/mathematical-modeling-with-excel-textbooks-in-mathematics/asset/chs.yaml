- "# Excel 数学建模（数学教材）\n\n\n\n![](img/9780429945052.jpg)\n\n\n\n\n\n\n\n\n\n# 序言\n\n\
  本书书的主要目标是介绍构建和分析数学模型的不同方法，其格式适用于学生而非仅仅是教师阅读。这并不是一本关于如何使用 Excel 的书籍。相反，Excel 被视为实现构建和分析数学模型目标的工具。使用本文不需要预先具备\
  \ Excel 知识或经验。\n\n选择 Excel 作为实施和分析模型的唯一软件主要有两个原因：\n\n1. 易于使用且大多数人熟悉它，因此只需很短就能熟悉该软件。\n\
  2. 无处不在。学生在学术领域内外遇到的每一个数学建模项目中都会使用 Excel。\n\n每个章节都包含了在 Excel 中构建模型的逐步操作说明。这些说明最初是为\
  \ Office Excel 2016 编写的。对于其他版本的 Excel，某些说明可能会略有不同。\n\n## 教学方法\n\n\n\n\n本文介绍了在其他数学建模书籍中常见的多种模型类型，以及一些新类型。然而，这些模型的呈现方式非常独特。一个典型的章节开头会对比待建模的场景进行通俗描述。然后使用适当的数学工具建立模型。接着，通过分步骤说明在\
  \ Excel 中对模型进行实现和分析。在练习题中，我们要求学生修改或完善现有模型、对其进行进一步分析，或将其应用到类似的场景。\n\n在每个章节中，我们都尝试关注所阐述的主要数学建模概念，而不是过度陷入细节中。我们还关注对模型的分析，并在每个案例中都尝试回答“这意味着什么？”这个问题。\n\
  \n这不是一本“套用硬套”的教科书。我们不要求学生简单地将数字代入某些“黑箱”Excel 公式并直接接受结果。相反，我们讨论了模型分析背后的数学原理，并在适当的情况下，从零在\
  \ Excel 中构建分析工具。\n\n每个章节都结束于几个难度不一的练习。此外，每章的末尾都有一个“延伸阅读”部分，其中包含额外信息的资源。\n\n## 读者群/先修要求\n\
  \n本书适合数学专业的学生（包括中学数学教育专业），他们需要一门入门数学建模课程。某些章节需要微积分、线性代数、微分方程或基础统计学，因此本书适用于大三或大四学生。然而，许多其他章节只需要数学成熟度，因此本书也适用于大二学生。\n\
  \n## 内容流程\n\n本书包含了多种建模技术、数学概念和应用类型。在这里我们简要概述每章的重点。\n\n*   **第 1 章 – 什么是数学建模？** 本章从`model`和`mathematical\
  \ modeling`术的定义开始。然后讨论了数学建模涉及的步骤，并以讨论假设在数学建模过程中的性结束。\n*   **第 2 章 – 比例与几何相似性** 本章从介绍在\
  \ Excel 中绘制图表和处理数据开始，包括对数据进行线性拟合的讨论。然后利用比例和相似性等几何概念来对自由落体物体等系统进行建模。我们强调数据被用于测试模型的有效性。本章最后介绍了数据线性合拟合、经验建模和决定系数。\n\
  *   **第 3 章 – 线性代数** 本章简要介绍了书中处处使用的线性代数主题，包括矩阵、向量和线性方程组。我们提供了几个使用线性方程创建模型的示例。然后我们使用线性方程对数据进行多项式拟合、多元回归和样条模型建模。\n\
  *   **第 4 章 – 离散动力系统** 本章从离散动力系统、解和平衡值的定义开始。我们强调，我们通常感兴趣的是系统的长期行为，而不是某一个特定时间点的数值，以及平衡值在分析中的重要性。本章包含了用离散动力系统建模的几种不同应用，包括人口增长、捕食者-猎物系统和简单的流行病。\n\
  *   **第 5 章 – 微分方程** 本章开始讨论这样一个事实：描述量如何随时间变化往往描述该量在任何特定时刻的值更容易。这促成了使用微分方程对动力系统进行建模。我们关注的是寻找微分方程的近似数值解，而不是精确的解析解。为此，我们讨论了用于近似微分方程解的欧拉法，并将其应用于微分方程系统的几个应用中。我们还介绍了用于近似微分方程解的\
  \ Runge-Kutta 方法。\n*   **第 6 章 – 仿真** 我们比大多数其他数学建模书籍更广泛地涵盖仿真主题。本章的主要目标是说明几种不同类型的仿真模型，包括概率游戏、排队模型、库存模型和调度模型。我们还讨论了伪随机数生成器的工作原理以及如何使用密度函数对随机变量进行建模。\n\
  *   **第 7 章 – 线性优化** 本章重点是线性规划和单纯形法。我们没有讨论理论；而是试图让学生概述单纯形法背后的基本思想。我们介绍了分配问题和运输问题作为线性规划的示例，以及如何使用线性规划进行建模。\n\
  *   **第 8 章 – 非线性优化** 在这一章中，我们涵盖了几种近似非线性优化解的数值技术，包括牛顿法、梯度法和拉格朗日乘子法。我们还讨论了解决非线性问题的固有困难。\n\
  \n## 材料选择\n\n本书中的材料超过了一个学期的量。教师可以很容易地挑选适合学生的章节。大多数章节可以在一个 50 分钟的课时间内轻松涵盖。我们为选择材料提供了三条建议：\n\
  \n1.  我们建议从第 1 章、第 2 章和第 3 章开始。第 1 章提供了数学建模过程的本质概述，可以在一节课内完成。我们在整个第 2 章中穿插了使用 Excel\
  \ 的介绍。第 2 章还介绍了书中其他地方使用的许多概念。第 3 章是第 2 章关于线性代数的延续。如果学生有坚实的线性代数基础，可以跳过第 3.1 节](#10_Chapter03.xhtml)和第\
  \ 3.2 节](#10_Chapter03.xhtml)。第 3.5 节](#10_Chapter03.xhtml)可以跳过而不影响连续性。\n\n2.  如果教师希望关注动力系统，我们建议涵盖第\
  \ 4 章和第 5 章。在第 4 章中，我们使用离散时间增量对系统建模，在第 5 章中，我们对连续时间进行建模。第 4.6 节](#11_Chapter04.xhtml)、第\
  \ 5.6 节](#14_Chapter05.xhtml)、第 5.7 节](#14_Chapter05.xhtml)和第 5.8 节](#14_Chapter05.xhtml)可以跳过而不影响连续性。第\
  \ 6 章和第 7 章中的选定主题可以完善整个学期的内容。\n\n3.  如果教师想关注运筹学的主题，我们建议涵盖第 6 章、第 7 章和第 8 章。这些章节不依赖于第\
  \ 4 章](#11_Chapter04.xhtml)和第 5 章](#14_Chapter05.xhtml)。第 7.7 节](#16_Chapter07.xhtml)、第\
  \ 8.6 节](#17_Chapter08.xhtml)、第 8.7 节](#17_Chapter08.xhtml)和第 8.8 节](#17_Chapter08.xhtml)可以跳过而不影响连续性。\n\
  \n\n\n第二版在第一版出版后就开始着手制作。作者感谢他们的学生发现错误并提出改进建议和新练习。相比第一版的更改包括：\n\n*   所有关于`Excel`的使用说明均已更新至`Excel\
  \ 2016`。\n*   全文新增了许多新练习。\n*   新增了关于线性代数的第 3 章。该章节包含了第一版中第 2 章和第 3 章的内容，以及新材料。\n\
  *   扩展了关于微分方程的第 5 章，涵盖了混合问题和对`Runge-Kutta` 算术法的介绍。\n*   修订了关于模拟模型的第 6 章。\n*   新增了关于非线性优化的第\
  \ 8 章。\n*   许多章节都包含一个含有项目构思的小节。项目被定义为学生设计的问题，其结果是一份描述问题、分析和结论的短报告。这些项目构思的灵感源自真实的学生项目，可以为未来的学生提供灵感核心。\n\
  \n1\n\n## 什么是数学建模？\n\n## 章节目标\n\n*   定义术语 `model`（模型）、`mathematical model`（数学模型）和数学建模\n\
  *   理解数学建模的目的和过程\n*   理解数学模型背后假设的重要性和意义\n\n每一位数学专业的学生在教育生涯中都做过一些“数学建模”。这些建模实例通常被称为“应用”，用于说明数学是如何在“现实世界”中实施的。\n\
  \n在大多数数学课上，主要目标是学习某个特定数学学科的理论。应用通过提供一个更具体的背景来帮助学习和理解理论，从而实现这一目标。例如，在`Calculus I`中，真正的目标是理解极限和导数的概念。一个应用型极大化问题被用来激发导数概念，并为计算和解释导数提供练习。\n\
  \n在数学建模中，情况恰相反。我们将从一些“现实世界”的问题开始，利用数学理论和技术来更好地理解问题背后的现象。\n\n### 1.1 定义\n\n为了定义`mathematical\
  \ modeling`这个短语，我们首先定义`model`一词。`model`一词在日常语言中经常使用。我们谈论模型飞机、模型房屋、跑道上的模型等。在数学意义上，这个词是什么意思？\n\
  \nLucas (Lucas, William F., The Impact and Benefits of Mathematical Modeling, in\
  \ *Applied Mathematical Modeling* (D.R Shier and K.T. Wallenius eds.), Chapman and\
  \ Hall/CRC, 1999, pg. 5) 将`model`定义为“对某些复杂现实的简单的实现或理想化”。现实世界是一个非常复杂的地方。为了更好地理解它，我们需要尝试将其简化到合理的程度，用我们能够理解和处理的方式描述这种简化，然后研究这种简化。这就是我们所说的`modeling`。\n\
  \n那么，`mathematical model`可以定义为使用数学术语、符号和思想构建的`model`。Giordano 等人 (Frank. R. Giordano,\
  \ M. D. Weir, and W. P. Fox, *A First Course in Mathematical Modeling*, Third ed.,\
  \ Thomson Brooks/Cole, 2003, pg. 54) 将`mathematical model`定义为“用于研究特定现实世界系统或现象的数学构结构”。`Mathematical\
  \ models`可以有许多不同的形式。它们可能涉及方程、不等式、微分方程、矩阵、逻辑或任何其他的“数学”思想。\n\n核心思想是我们使用数学来描述现实世界的一部分。因此，数学建模`process`（过程）的一个非常简单但通用的定义是：\n\
  \n**定义 1.1.1.** `Mathematical modeling`是将数学应用于现实世界问题。\n\n### 1.2 目的 Purpose\n\n\
  我们为什么要进行数学建模？既然我们要回答关于现实世界现象的问题，我们完全可以坐在一儿观察并做笔记。假设我们在培养皿中放入 500 个细菌。第二天我们在培养皿中数到\
  \ 525 个，再后的一天数到 551 个。\n\n显然，细菌数量正在增长。根据这一观察，我们可能会问这些问题：\n\n1. 培养皿中达到 600 个细菌需要多久？\n\
  2. 如果我们在 3 天后的实验中需要 900 个细菌，我们今天必须在培养皿中放入多少个？\n\n我们可以这样回答每个问题：\n\n1. 等到培养皿中数到 600\
  \ 个细菌。\n2. 在一个培养皿中放 1 个细菌，第二个培养皿放 2 个，第三个放 3 个，以此类推直到 900 个，等待 3 天，然后确定哪一个培养皿含有\
  \ 900 个细菌。\n\n这些解决方案只需要我们对培养皿中细菌生长这一现实世界现象进行简单的观察。然而，这些解决方案显然是不切实际的，因为它们可能需要过多的时间或资源（第二种方案需要\
  \ 900 个培养皿和总共`1 + 2 + · · · + 900 = 405, 450`个细菌）。\n\n回答这些问题的更实用的方法是构建一个关于时间的培养皿中细菌数量的函数（即建立细菌增长的数学模型）。\n\
  \n在其他情况下，进行观察本身可能是一项苦差。例如，假设我们想为医院急诊室寻找（即医生和护士的数量）最优化的人员配置。“最优”的概念可能考虑几个因素，包括：\n\
  \n1. 医疗护理质量。（他们得到了所需的护理吗？）\n2. 患者候诊时间。（他们需要等很久吗？）\n3. 与患者互动的时间。（医生和护士是否过度工作，还是他们有太多空闲时间？）\n\
  4. 资源。（空间足够吗，还是人们会碰撞？）\n\n寻找最优数量的一种方法是选择某种医生和护士的组合（例如 3 名医生和 8 名护士），让他们工作，并让团队人员记录几周或几个月的数据。然后选择另一种组合（例如\
  \ 2 名医生和 7 名护士）并重复该过程。直到尝试所有可能的医生护士组合，分析数据并选出最优组合。\n\n这种方法与细菌增长问题有许多共同点。它会花费太多时间且成本过高。此外还有额外的问题。如果配备的医生和护士太少，患者可能会不必要的死亡。此外，我们可能无法观察不同的组合如何处理稀发事件，例如公交车祸导致数十患者同时涌入急诊室。\n\
  \n更实用的解决方案是尝试在计算机上复制急诊室的行为（即创建一种称为模拟的数学模型），在那里可以更改医生和护士的数量。每种组合可以在多种情况下模拟长时间，且成本很低。此外，没有人会死亡。\n\
  \n### 1.3 过程 The Process\n\n我们将通过培养皿中细菌建模的示例来说明数学建模的过程，如 1.2 节所示。\n\n**第 1 步**：陈述要回答的问题\n\
  \n\n\n\n在许多情况下，这一步几乎是微不足道的；而在其他情况下，它是整个过程中最困难的部分。问题应该足够窄，使得问题易于处理，但又不能太窄导致问题变得显而易见。起初，我们可能想关注一个窄的问题，然后利用所获得的知识在以后扩大该问题。问题还应该用精确的数学术语表述，以便能够容易地转换为数学符号。\n\
  \n在这个示例中，我们将回答这个问题：“培养皿中的细菌数量达到 600 需要多长时间？”\n\n## 第 2 步：选择建模方法\n\n在这一步中，我们确定模型的形状。在某些情况下，这很容易做到；在其他情况下，我们可能有几个合理的选择。做出正确的选择至少需要对所有可能性有一定的了解。这还取决于所做假设的性质。\n\
  \n通常情况下，这一步从一些简单的观察开始。注意我们开始时有 500 只细菌。1 天后，数量增加了 25 只，是 500 的 5%。第二天增加了 26 只，大约是\
  \ 525 的 5%。增长率（或每天的变化）似乎是相对恒定的。这表明连续日期的种群数量之间存在简单的关系：\n\n某一天的数量 = 前一天的数量  5%\n\n\
  这种关系表明，我们可能推导出一个简单的方程为种群建模。\n\n## 第 3 步：定义变量和参数\n\n`Variables` 是问题内部可能会变化的数量。`Parameters`\
  \ 是问题内部保持不变、但在相同类型的问题之间可能会的数量。这一步的第一部分是确定涉及哪些变量和参数。这可能简单而显而，也可能非常复杂。通常涉及数数百个数量。为了使模型易于处理，我们需要假设哪些是最重要的，哪些是可以忽略的。在以后，我们可以添加额外的变量和参数来完善模型。\n\
  \n在这个示例中，变量包括：\n1. 时间\n2. 种群数量\n3. 温度\n4. 现有的食物量\n5. 培养皿可用空间\n\n这些都是随着种群增长而改变的值。由于初始观察没有提供任何关于温度、食物或空间的信息，我们将忽略这些变量，只关注时间和种群数量。\n\
  \n要考虑的可能参数包括：\n1. 初始种群数量\n2. 增长率（我们假设它是恒定的）\n3. 培养皿的大小\n4. 初始食物量\n\n一旦我们将细菌放入培养皿并让它们生长，这些值都是不变的。但如果我们考虑具有不同细菌种群的另一个培养皿，它们可能会改变。同样，由于我们对培养皿的大小或食物量并不了解，我们将忽略这些参数。\n\
  \n这一步的第二部分是选择符号来表示变量和参数。对于这个示例，我们设\n\n$$\\begin{matrix} n & {= \\text{从现在起的天数}\\\
  left( n = 0,1,... \\right)} \\\\ r & {= \\text{增长率（小数形式）}} \\\\ a_{n} & {= \\text{第~n\
  \ 天初的种群数量}} \\\\ a_{0} & {= \\text{初始种群数量}} \\end{matrix}$$\n\n## 第 4 步：陈述假设\n\n\
  做出假设是创建一个有效且易于处理模型的关键方面。假设分为许多不同的类别。有些用于简化模型，例如用于选择重要变量的假设。有些是用于定义变量之间的关系，因为精确的关系是未知的。还有一些在确切值未知时需要用来确定参数的值。\n\
  \n清晰地陈述假设是解释和展示结果的重要部分。模型的有效性完全取决于底层假设的合理性。如果假设是不合理的，那么无论数学分析有多精确，结论都将是不合理的。\n\n\
  在这个问题中，我们已经选择忽略温度、培养皿的大小以及许多其他可能的变量和参数。这是一种简化。此外，我们假设种群增长是恒定的（即种群每天增加 5%）。\n\n##\
  \ 第 5 步：建立模型\n\n这是“数学”开始开始的地方。我们观察到，第 1 天的细菌数量等于第 0 天的数量加上 5%。第 2 天的数量等于第 1 天的数量加上\
  \ 5%，以此此类推。在利用我们的变量和参数的数学符号中，我们有：\n\n$$\\begin{matrix} a_{1} & {= a_{0} + r\\; a_{0}\
  \ = (1 + r)\\; a_{0}} \\\\ a_{2} & {= a_{1} + r\\; a_{1} = (1 + r)\\; a_{1}} \\\\\
  \ & {\\; \\vdots} \\\\ a_{n + 1} & {= a_{n} + r\\; a_{n} = (1 + r)\\; a_{n}} \\\
  end{matrix}$$\n\n这形成了一个递归定义的序列。为了用 `n` 表示 `a[n]` 的显式描述，请注意\n\n$$\\begin{matrix}\
  \ a_{1} & {= (1 + r)\\; a_{0}} \\\\ a_{2} & {= (1 + r)\\; a_{1} = (1 + r)(1 + r)\\\
  ; a_{0} = (1 + r)^{2}a_{0}} \\\\ a_{3} & {= (1 + r)\\; a_{2} = (1 + r)(1 + r)^{2}\\\
  ; a_{0} = (1 + r)^{3}a_{0}} \\\\ & {\\; \\vdots} \\\\ a_{n} & {= (1 + r)^{n}a_{0}}\
  \ \\end{matrix}$$\n\n这个方程就是我们的模型。\n\n## 第 6 步：求解模型并陈述结果\n\n这里我们模糊地使用“求解”一词。求解模型可能涉及求解方程，在本示例中，它可能涉及构建图形并定性地描述其行为，或者涉及运行模拟。在这个示例中，问题是“种群数量何时达到\
  \ 600？”根据我们的变量，这可以表述为“找到 `n` 使得 `a[n]` = 600。”这产生方程\n\n600 = (1 + r)^{n}500\n\n\
  使用对数求解方程得到 `n` ≈ 3.7。这意味着在第 4 天初，种群数量将达到 600。这就是我们的结果。相对于模型类型，求解是相对的。\n\n通常情况下，模型的结果用于指导决策。在许多实际情况下，例如商业或军事领域，进行建模的人不是最终的决策者。因此，结果应该尽可能用非技术性的语言来陈述。\n\
  \n## 第 7 步：验证模型\n\n验证对于测试假设的合理性是必要的。通常我们通过与真实数据比较来验证模型。假设我们让细菌生长共 7 天并将数据收集在表 1.1\
  \ 中。\n\n表 1.1\n\n| 天数 | 实际种群数量 | 预测种群数量 |\n| --- | --- | --- |\n| 0 | 500 | 500\
  \ |\n| 1 | 525 | 525 |\n| 2 | 551 | 551 |\n| 3 | 575 | 579 |\n| 4 | 598 | 608 |\n\
  | 5 | 610 | 638 |\n| 6 | 620 | 670 |\n\n我们看到在第 4 天，实际种群数量略低于 600。虽然预测种群数量不等于实际数量，但我们\
  \ 4 天的结论是合理的。\n\n注意，在第 5 天和第 6 天，实际和预测数量之间差异很大。数据表明增长率放缓慢。这意味着我们对恒定增长率的假设是错误的。\n\
  \n我们的模型在第 4 天之前是准确的，但在之后不准确。\n\n## 第 8 步：完善模型\n\n完善是以某种方式改进模型。一种方法是添加第 3 步中忽略的变量以建立更准确的模型。另一种方法是泛化模型，使其用于解决其他类似的问题。任何一种方法都需要我们在某种程度上重复第\
  \ 3 到第 7 步。\n\n\n\n我们已经注意到，数据表明增长率随时间推移而放缓。这可能是食物供应或增长空间减少的结果。这是我们选择忽略的两个变量。\n\n\
  一种可能的改进方法是重新建立模型并将这两个变量纳入考虑。这需要额外的观测和数据来确定这些变量与其他变量之间的关系。另一种可能的改进方法是使用可用数据对递减的增长率进行建模。我们将在第\
  \ 2 章中阐明如何这样做。\n\n图 1.1 给出了一个阐明数学建模基本过程的简单图表。该过程从左上角的观测（或数据）开始。从这里，我们得到了想要解决的基本问题。然后我们提出假设，构建模型，使用适当的数学工具进行求解，并得到数学结果。接着，我们必须根据假设来解释这一数学结果以得出结论。最后，我们通过更多的观测来验证模型。\n\
  \n![fig1_1.jpg](img/fig1_1.jpg)\n\n图 1.1\n\n该图还说明了数学建模的循环本质。一旦回答了原始问题，我们很少停止。我们不断重复这一过程，在某种程度上是为了测试、完善和实施模型。\n\
  \n该图的右半部分在“数学世界”完成，左半部分在“现实世界”完成。在数学世界中，我们使用数学的绝对确定性。现实世界并不包含这种确定性。做出假设和解释是在这两个世界之间移动的必要步骤。\n\
  \n## 1.4 假设 (#06_Contents.xhtml_rsec1_4)\n\n*每一个*模型都基于一组假设。有时这些假设是相当微不足且显而易见的，但大多数时候它们足够重要，可能会影响模型的有效性。我们永远无法准确地描述现实世界的每个组件。需要假设来填补这些空白，并且只要可能，就应该假设的合理性。事实上，假设如此重要，任何对模型的描述都应该包含其背后的假设。\n\
  \n以下是一些知名模型及其一些基础假设的示例\n\n### 示例 1.4.1（电动汽车的续航）\n\n在考虑购买电动汽车时，大多数消费者提出的第一个问题是：“续航是多少？”准确答案取决于许多因素，包括电池尺寸和状况、驾驶风格、车速、风速和风向、温度以及海拔变化。对这个问题的任何数值回答都必须带有对这些因素的许多假设。□\n\
  \n### 示例 1.4.2（碳-14 定年）\n\n碳-14 定年法用于对有机材料进行计时，例如考古遗址发现的骨骼。基础数学模型需要知道样本中最初存在的碳-14\
  \ 比例。显然，我们无法精确测量这一点，因此我们假设该比例与现代骨骼中的相同。这一假设无法直接测试，但如果能通过独立手段确认日期，将表明该假设是正确的。□\n\n\
  ### 示例 1.4.3（牛顿力学）\n\n牛顿第二定律认为，作用在物体上的力等于它的静止质量乘以加速度，即 `F = ma`。这被假设在任何速度下都成立。在\
  \ 20 世纪(*th*) 世纪，人们发现对于接近光速的速度，这种静止质量必须被相对论质量取代，后者更大。□\n\n### 示例 1.4.4（相对论）\n\n\
  爱因斯坦的狭义相对论实际上是一个数学模型。它基于几个公理（一种假设），其中之一是真空中的光速对于任何惯性参考系中的观测者都是恒定的。这些假设无法在想象的每种情况下进行测试，但爱因斯坦理论的结果是可以测试的。这些结果已被证明是正确的，因此表明基础假设也是正确的。□\n\
  \n### 练习题\n\n### **1.4.1** 下面每个部分描述了一个计算出的数字。思考这个数字是如何计算的，并识别出计算背后的至少一个假设。\n\n1.\
  \ 一本消费者杂志报告说，洗衣液每次清洗的为 0.31 美元。\n2. 一辆健身车显示消耗的卡路里数。\n3. 跑步计步器测量跑步距离。\n4. 汽车仪表盘显示，根据油箱内剩余燃料，可以行驶\
  \ 220 英里。\n5. 一小企业主预测他的公司明年将花费 500,000 美元的电话费。\n6. 一本烹饪杂志列出食谱中的一种成分是 1-2 杯切碎的切达奶士。它声称每份食物有\
  \ 320 卡路里。\n\n### **1.4.2** 在以下每个模型中识别至少两个可能的变量和两个参数。明确区分哪个是变量，哪个是参数。\n\n1. 一位生物学家想对一段时间内森林中狐狸和兔子的人口进行建模。\n\
  2. 一个消费者想对其信用卡的每月余额进行建模。\n3. 一位公共卫生研究人员想对大学生在派对期间血液中的酒精含量进行建模。\n4. 一位生态学家想对一段时间内湖泊的污染量进行建模。\n\
  5. 一位市场研究人员想对整个季节电视节目的观众人数进行建模。\n\n### **1.4.3** 为了预测第 1.3 节中细菌数量达到 600 的时间，我们解决了方程\
  \ `600 = (1.05)^n`。\n\n1. 显示如何求解方程得到 `n`。\n2. 一个学生认为我们应该更精确。她认为应该说“第 3.73685062\
  \ 天会有 600”，因为这是计算器给出的值。你会向她解释这种精确度是不合适的？\n\n### **1.4.4** 超市收银员平均每分钟可以结账 3 名顾客（这称为\
  \ `服务率`）。顾客平均每分钟到达 2 名（这称为 `到达率`）。经理认为，由于服务率大于到达率，顾客不需要排队。经理做了哪些假设？这些假设合理吗？这对结论的有效性说明了什么？\n\
  \n### **1.4.5** 一个大学生计划约 100 个女孩。他通过以下逻辑计算同意的人数：\n\n由于每个女孩要么同意要么拒绝，所以有一半会同意。因为 100\
  \ 的一半是 50，所以会有 50 个女孩同意。\n\n模型有什么缺陷吗？请解释。\n\n### **1.4.6** 1800 年至 1960 年美国人口（百万计）的模型为：\n\
  \n```\nP(t) = 0.0063t² + 0.0719t + 5.0747\n```\n\n其中 `t` 是自 1800 年以来的年份。一个学生预测 2050\
  \ 年的人口将是 `P(250) ≈ 416.8` 百万。该学生在进行此计算时做了什么假设？你认为这个假设合理吗？这对预测的有效性说明了什么？\n\n### **1.4.7**\
