  \ 考虑两个由薄半渗透膜隔开的盐水箱，盐可以通过该膜扩散。让 `x1` 和 `x2` 表示两个水箱中盐的质量。如果我们假设盐通过膜扩散的速率与两种溶液浓度差成正比，我们得到微分方程组：\n\
