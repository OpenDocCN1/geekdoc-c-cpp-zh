  | --- | --- | --- | --- | --- | --- | --- |\n| **1** | 119 | 253 | 321 | 402 | 1,000\
  \ | 21 |\n| **2** | 205 | 198 | 348 | 365 | 0 | 18 |\n| **3** | 432 | 351 | 195\
  \ | 248 | 0 | 18 |\n| **分配** | 13 | 10 | 12 | 19 | 3 | |\n\n解决这个问题只需要我们对修改后的电子表格\
  \ `Bread` 中更改这一个成本值。解决方案如图 7.10 所示。注意，按照要求，没有卡车从 1 号面包店送到虚拟仓库。在该解决方案中，2 号面包店应该只生产\
  \ 15 卡车面包。\n\n![fig7_10.jpg](img/fig7_10.jpg)\n\n#### 图 7.10\n\n### 练习题\n\n**方向：**\
