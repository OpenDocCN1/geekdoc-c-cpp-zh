  \ | 4.4 | 5.1 | 0.244 | 0.65 | 4.85 | 0.983 |\n\n## 3.5 样条模型\n\n考虑表 3.8 中的数据，该数据给出了奶牛在开始产奶后不同天数的产奶量。这些数据的图如图\
  \ 3.43 所示。我们的目标是根据 `Day` 对 `Liters` 建模，以便我们预测未列出日期的产量。\n\n#### 表 3.8\n\n| 天 | 5\
  \ | 13 | 25 | 42 | 50 | 62 | 75 | 90 | 100 | 120 |\n| --- | --- | --- | --- | ---\
  \ | --- | --- | --- | --- | --- | --- |\n| 升 (Liters) | 10 | 19 | 30 | 25 | 22 |\
  \ 35 | 50 | 55 | 40 | 35 |\n\n### 示例 3.5.1 线性样条模型\n\n线性样条模型的图很容易形成。\n\n1. 将一个空白工作表重命名为“**Linear**”，如图\
  \ 3.44 所示进行格式化。将表 3.8 的其余数据输入 `A` 列和 `B` 列。\n2. 创建一个与图 3.45 类似的图表。直线构成了线性样条模型的图。\n\
  3. 为了使用此模型进行预测，我们需要知道每个线段的斜率和 *y* 截距。我们知道每个线段两个点，分别称为 (`x`[*n*], `y`[*n*]) 和 (`x`[*n*+1],\
  \ `y`[*n*+1])，其中 *x*[*n*] < *x*[*n*+1]，所以我们可以很容易地找到斜率：\n\n$$\\text{斜率} = m = \\\
  frac{y_{n + 1} - y_{n}}{x_{n + 1} - x_{n}}$$\n\n一旦我们知道了斜率 `m`，就可以利用直线的斜截方程找到 *y*\
  \ 截距 `b`：\n\n$$y = mx + b \\Rightarrow b = y - mx$$\n\n\n\n\n要实现这些公式，请按照图 3.46 所示格式化电子表格。将第\
  \ 2 行向下复制到第 10 行。\n\n![fig3_46](img/fig3_46.jpg)\n\n图 3.46\n\n观察`Slope`（斜率）列，我们可以发现牛奶产量平均在第\
  \ 62 到 75 天之间增长最快，在第 90 到 100 天之间减少最快。\n\n4. 现在我们已经知道了每个样条段的斜率和 `y`截距，可以通过以下公式轻松根据\
  \ `Day`（天）的值计算出 `Liters`（升）的预测值：\n\nLiters = *m*(Days) + *b*\n\n其中 `m` 和 `b` 分别是对应样条段的斜率和\
  \ `y`截距。要执行此操作，请在图 3.47 中添加公式。（**注意**：图 3.47 中的`VLOOKUP` 函数将查找区域 `A2:D11` 左侧列，并找到小于或等于\
  \ `F2` 单元格值的最大值。它将返回该区域第 3(*rd*) 或第 4(*th*) 列的值，即斜率或 `y`截距。为了使之正常工作，`x`值必须按升序排列。）\n\
  \n![fig3_47](img/fig3_47.jpg)\n\n图 3.47\n\n**示例 3.5.2 (立方样条模型)**\n\n线性样条模型很容易计算，但它们无法形成光滑曲线。事实上，曲线在任何数据点处都是不可微的。这种模型预测每个数据点处都有剧烈变化，这看起来并不合理。为了解决，我们将用三次多项式而不是直线来连接点，并对每个段的导数设定条件。\n\
  \n为了说明这一过程，我们将考虑一组包含 3 个数据点\n\n{(*x*[1], *y*[1]), (*x*[2], *y*[2]), (*x*[3], *y*[3])}\n\
  \n其中 `x*[1]` < `x*[2]` < `x*[3]`。每个 `x`值被称为*节点*（knot）。我们将使用 2 个三次多项式来连接它们：\n\n$$\\\
  begin{matrix} {p_{1}(x) = a_{1} + b_{1}x + c_{1}x^{2} + d_{1}x^{3}} & {\\text{对于~}x_{1}\
  \ \\leq x < x_{2}} \\\\ {p_{2}(x) = a_{2} + b_{2}x + c_{2}x^{2} + d_{2}x^{3}} &\
  \ {\\text{对于~}x_{2} \\leq x \\leq x_{3}} \\end{matrix}$$\n\n我们现在需要找到 8 个参数 `a*[1]``,`b*[1]``,`c*[1]``,`d*[1]``,`a*[2]``,`b*[2]``,`c*[2]`\
  \ 和 `d*[2]` 的值。为了使模型形成一条通过每个数据点的光滑曲线，我们需要满足以下三个条件：\n\n1. 每个多项式必须通过其定义区间两端的两个数据点。\n\
  2. 两个相交多项式的一阶导数在它们的交点必须相等。\n3. 两个相交多项式的二阶导数在它们的交点必须相等。\n\n第一个条件为我们提供了以下四个方程：\n\n\
  | $$\\begin{matrix} {p_{1}\\left( x_{1} \\right)} & {= a_{1} + b_{1}x_{1} + c_{1}x_{1}^{2}\
  \ + d_{1}x_{1}^{3} = y_{1}} \\end{matrix}$$ | (3.5) |\n| --- | --- |\n| $$\\begin{matrix}\
  \ {p_{1}\\left( x_{2} \\right)} & {= a_{1} + b_{1}x_{2} + c_{1}x_{2}^{2} + d_{1}x_{2}^{3}\
  \ = y_{2}} \\end{matrix}$$ | (3.6) |\n| --- | --- |\n| $$\\begin{matrix} {p_{2}\\\
  left( x_{2} \\right)} & {= a_{2} + b_{2}x_{2} + c_{2}x_{2}^{2} + d_{2}x_{2}^{3}\
  \ = y_{2}} \\end{matrix}$$ | (3.7) |\n| --- | --- |\n| $$\\begin{matrix} {p_{2}\\\
  left( x_{3} \\right)} & {= a_{2} + b_{2}x_{3} + c_{2}x_{3}^{2} + d_{2}x_{3}^{3}\
  \ = y_{3}} \\end{matrix}$$ | (3.8) |\n| --- | --- |\n\n多项式的一阶导数是：\n\n`p*[1]'′(*x*)` = `b*[1]` + 2*c*[1]*x*`,\
  \ `p*[2]'′(*x*)` = `b*[2]` + 2*c*[2]*x*\n\n第二个条件为我们提供了方程：\n\n| $$\\begin{matrix}\
  \ {p*[1]'′(*x*)` & {= 2*c*[1]*x + 3*d*[1]*x} \\\\ {p*[2]'′(*x*)` & {= 2*c*[2]*x\
  \ + 3*d*[2]*x} \\end{matrix}$$ | (3.9) |\n| --- | --- |\n多项式的二阶导数是：\n\n`p*[1]'″(*x*)` = `2*c*[1]\
  \ + 6*d*[1]*x`, `p*[2]'″(*x*)` = `2*c*[2] + 6*d*[2]*x` \n\n第三个条件为我们提供了方程：\n\n| $$\\\
  begin{matrix} {p*[1]'″(*x*)` & {= 2*c*[1]*x + 6*d*[1]*x} \\\\ {p*[2]'″(*x*)` & {=\
  \ 2*c*[2]*x + 6*d*[2]*x} \\end{matrix}$$ | (3.10) |\n| --- | --- |\n\n方程 (3.5) -\
  \ (3.10) 提供了六个未知数的方程。为了唯一确定这些未知数的值，还需要两个方程。为此，我们将指定数据末的二阶导数（即 `x*[1]` 和 `x*[3]`）。\n\
  \n如果我们希望这些二阶导数为某些已知值，例如 `m*[1]` 和 `m*[2]`，我们将添加方程：\n\n$$\\begin{matrix} {p_{1}^{''}\\\
  left( x_{1} \\right)} & {= 2c_{1} + 6d_{1}x_{1} = m_{1}} \\\\ {p_{2}^{''}\\left(\
  \ x_{3} \\right)} & {= 2c_{2} + 6d_{2}x_{3} = m_{2}} \\end{matrix}$$\n\n所得模型被称为*固定样条*（clamped\
  \ spline）。然而，如果我们不知道二阶导数的值，只需将其设置为 0 并得到方程：\n\n$$\\begin{matrix} {p_{1}^{''}\\left(\
  \ x_{1} \\right)} & {= 2c_{1} + 6d_{1}x_{1} = 0} \\end{matrix}$$ (3.11)\n$$\\begin{matrix}\
  \ {p_{2}^{''}\\left( x_{3} \\right)} & {= 2c_{2} + 6d_{2}x_{3} = 0} \\end{matrix}$$\
  \ (3.12)\n\n我们将采用的方法。所得模型被称为*自然样条*（natural spline）。将方程 (3.5) - (3.12) 重写使得常数移到右侧，得到方程组：\n\
  \n$$\\begin{matrix} a_{1} & + {x_{1}b_{1}} & + {x_{1}^{2}c_{1}} & + {x_{1}^{3}d_{1}}\
  \ & & & & & & & = y_{1} \\\\ a_{1} & + {x_{2}b_{1}} & + {x_{2}^{2}c_{1}} & + {x_{2}^{3}d_{1}}\
  \ & & & & & & & = y_{2} \\\\ & & & & & & a_{2} & + {x_{2}b_{2}} & + {x_{2}^{2}c_{2}}\
  \ & + {x_{2}^{3}d_{2}} & = y_{2} \\\\ & & & & & & a_{2} & + {x_{3}b_{2}} & + {x_{3}^{2}c_{2}}\
  \ & + {x_{3}^{3}d_{2}} & = y_{3} \\\\ b_{1} & + {2x_{2}c_{1}} & + {3x_{2}^{2}d_{1}}\
  \ & & & - & b_{2} & - {2x_{2}c_{2}} & - {3x_{2}^{2}d_{2}} & = 0 \\\\ & & {2c_{1}}\
  \ & + {6x_{2}d_{1}} & & & & - & {2c_{2}} & - {6x_{2}d_{2}} & = 0 \\end{matrix}$$\n\
  \n将该方程组写成矩阵得到：\n\n$$\\begin{matrix} a_{1} & + {x_{1}b_{1}} & + {x_{1}^{2}c_{1}}\
  \ & + {x_{1}^{3}d_{1}} & & & & & & & & = y_{1} \\\\ a_{1} & + {x_{2}b_{1}} & + {x_{2}^{2}c_{1}}\
  \ & + {x_{2}^{3}d_{1}} & & & & & & & & = y_{2} \\\\ & & & & & & a_{2} & + {x_{2}b_{2}}\
  \ & + {x_{2}^{2}c_{2}} & + {x_{2}^{3}d_{2}} & = y_{2} \\\\ & & & & & & a_{2} & +\
  \ {x_{3}b_{2}} & + {x_{3}^{2}c_{2}} & + {x_{3}^{3}d_{2}} & = y_{3} \\\\ b_{1} &\
  \ + {2x_{2}c_{1}} & + {3x_{2}^{2}d_{1}} & & & - & b_{2} & - {2x_{2}c_{2}} & - {3x_{2}^{2}d_{2}}\
  \ & = 0 \\\\ & & {2c_{1}} & + {6x_{2}d_{1}} & & & & - & {2c_{2}} & - {6x_{2}d_{2}}\
  \ & = 0 \\end{matrix}$$ (3.13)\n\n具有一般形式 `A***x**=`**b**，其中 **x**(`a*[1]``,`b*[1]``,`c*[1]``,`d*[1]``,`a*[2]``,`b*[2]``,`c*[2]``,`d*[2]`）是未知数向量。我们可以通过逆来求解该方程组，**x**=`A*^(−1)**b**。（注意矩阵\
  \ *A* 具有独特的结构并且有很多零。这些事实可以被用来寻找更高效求解该方程组的方法。）\n\n要对数据点 {(75,50), (95,55), (100,40)}\
