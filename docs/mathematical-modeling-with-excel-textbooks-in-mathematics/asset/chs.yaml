  \ `t`，但这对我们的分析来说并不重要。\n\n对于 `n` = 12，当 `G` (`t`) = 0 时，`C` (`t`) ≈ 1,000。这意味着军队\
  \ `C` 胜利了。对于 `n` = 10，`C` = 0 = `G` 大约在同一时间（也就是说它们在同一时间被完全消灭，没有人获胜）。使用滚动条改变 `n`\
  \ 的值，我们看到当 `n` > 10 时军队 `C` 胜利，当 `n` < 10 时失败。\n\n为了对模型进行敏感性分析，我们每次改变一个初始条件或参数，并找到军队\
  \ `C` 胜利的 `n` 的近似最小值。改变 `G[0]` 或射击频率（Firing Rate）得到与上述相同的结果。表 5.1 显示了其他参数的值范围以及相关的\
