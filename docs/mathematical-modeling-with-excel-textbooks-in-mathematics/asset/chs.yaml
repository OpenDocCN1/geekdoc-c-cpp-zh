  \ = 2` 成立。\n3. 在什么时间重量增长迅速？请用数值支持你的答案。\n\n**5.2.4** 设 `y(t)` 表示时间 `t` 某森林中的兔子数量（以千计）。假设其由以下方程描述：\n\
