  图 6.39\n\n[图 6.40]显示了 `x[n]` 与 *n* 的图表。再次注意似乎没有任何模式。\n\n![fig6_40.jpg](img/fig6_40.jpg)\n\
  图 6.40\n\n### 练习\n\n**6.5.1** 假设我们要生成一个伪随机数列表，每个数字的值为 *a*、*b* 或 *c*，其中 *a* 出现 `p[1]`\
  \ × 100% 的时间，*b* 出现 `p[2]` × 100% 的时间，*c* 出现 `p[3]` × 100% 的时间，其中 `p[1] + p[2] +\
  \ p[3] = 1`。\n\n\n\n\n1. 设计一个电子表格来生成此列表。你可以使用 `RAND` 函数。确保用户能够输入 `a`、`b`、`c`、`p[1]`、`p[2]`\
  \ 和 `p[3]` 的值。\n2. 使用 `COUNTIF` 函数验证列表是否包含每个数字 `a`、`b` 和 `c` 的适当百分比。\n\n### 6.5.2\n\
  \n在下面的每个部分中，使用 `RANDBETWEEN` 函数生成一组符合给定规格的等概率伪随机数列表。\n\n1. 0 到 20 之间（包含）的偶数。\n2.\
  \ 0 到 20 之间（包含）的两位小数的数字。\n3. 集合 { − 1, 1} 中的数字。（**提示**：使用 `RANDBETWEEN` 在两个数字之间进行选择。使用\
  \ `IF` 函数为其中一个数字输出 −1，为另一个输出 1。）\n4. 集合 [−10,  − −5] ∪ [5, 10] 中的数字，保留两位小数。\n\n\
  ### 6.5.3\n\n考虑以下用于生成整数 `a` 和 `b` 之间伪随机整数的函数，其中 `a` < `b`：\n\n`x = [RAND ⋅��eps(*b* − *a*) + *a*]`\
  \ 四舍五入到最近整数。\n\n1. 使用此函数生成包含 1000 个整数的列表。允许用户输入 `a` 和 `b` 的值。\n2. 统计列表中 `a` 到 `b`（包含）每个整数出现的次数。所有整数出现的频率几乎相等吗？\n\
  3. 对此函数提出修改建议，使其生成的列表中 `a` 到 `b` 之间（包含）的整数出现频率几乎相等。使用你的修改方案生成另一个包含 1000 个整数的列表。该修改是否生成了频率几乎相等的列表？不要使用\
  \ `RANDBETWEEN` 函数。\n\n### 6.5.4\n\n另一种伪随机数生成器是*中间平方法*（*middle-square method*）。其基本算法如下：\n\
  \n1. 从一个 *n* 位的数字 `x[0]` 开始，称为*种子*（*n* 通常为偶数）。\n2. 将 `x[0]` 平方以得到一个 2*n* 位的数字（必要时在前面导补零）。\n\
  3. 取中间的 *n* 位数字作为下一个随机数。\n\n实现这种方法来生成一个包含 100 个 4 位伪随机数的列表。使用 `RANDBETWEEN` 生成种子。这个生成器工作效果如何？（**建议**：在\
  \ `x` 平方后，先“切掉”前两位，再“切掉”后两位。）\n\n### 6.5.5\n\n假设一个伪随机数生成器提供 0 到 9 之间的整数。测试该生成器提供的整数频率是否相等的一种方法是应用\
  \ `χ²` *拟合优度检验*（*Goodness–of–fit test*）。这可以通过生成一个长整数列表（例如 500 个），然后统计列表中每个整数出现的次数来完成。这些被称为*观测频率*（*observed\
  \ frequencies*），记为 `O`。我们然后计算*期望频率*（*expected frequencies*），记为 `E`，即如果它们确实以相等频率出现，我们预计每个整数在列表中出现的次数。如果在\
  \ 500 个数字的列表中有 10 个不同的整数，我们预计每个整数会出现 50 次。\n\n然后我们通过以下公式计算统计量 `χ²`：\n\n$$\\chi^{2}\
  \ = \\sum\\frac{\\left( {O - E} \\right)^{2}}{E}$$\n\n如果该统计量是“较小的”（对于 10 个不同的整数，小小于\
  \ 16.9），那么我们就可以有 95% 的确定该生成器提供的整数频率相等。如果它很大，则我们拒绝其提供的整数频率相等的断假设。（关于此检验的更详细描述，请参见任何入门统计学教材。）\n\
  \n1. Excel 函数 `RANDBETWEEN` 提供两个指定值之间的伪随机整数。使用它生成一个 0 到 9 之间的 500 个整数的列表。按照上述描述计算\
  \ `χ²` 统计量，并多次按下 `F9` 以获得几个不同的整数列表。`RANDBETWEEN` 看起来提供了的是频率相等的整数吗？\n2. 使用线性同余算法，参数\
  \ `a` = 6, `b` = 9, `m` = 10 和 `x[0]` = 2 生成一个 0 到 9 之间的 500 个整数的列表。计算 `χ²` 统计量。该线性同余算法看起来提供了频率相等的整数吗？尝试不同的\
  \ `a`、`b` 和 `x[0]` 值。你观察到了什么？\n\n## 6.6 随机变量建模\n\n仿真是建模*随机事件*（random events）交互的有用工具。随机事件是在结果发生之前我们不知道结果的活动。构建仿真涉及对随机事件进行建模。建模随机事件时最重要的概念之一是*随机变量*（*random\
  \ variable*）。\n\n**定义 6.6.1（随机变量）** *随机变量*是一种为随机事件的观测值分配实数的规则。*离散变量*（*discrete variable*）可以取某些值。*连续变量*（*continuous\
  \ variable*）可以取某个区间内的任何值。\n\n在大多数情况下，我们定义随机变量。例如，假设我们掷一个六面骰子。我们将随机变量 `X` 定义为点点数。在另一个例子中，我们观察顾客到达商店。我们将随机变量\
  \ `Y` 定义为到达的时间。\n\n建模随机事件时最重要的工具之一是*密度函数*（*density function*）。如果任何函数 `f(x)` 满足以下两个属性，则它是密度函数：\n\
  \n1. 对于所有 `x` ∈ *R*，`f(x)` ≥ 0\n2. $\\int_{-\\infty}^{\\infty}f(x)dx = 1$\n\n对于给定的随机变量\
  \ *X*，其密度函数 `f(x)` 用于通过以下公式计算 *X* 的概率：\n\n$$P\\left( {X \\leq a} \\right) = \\int_{-\\\
  infty}^{a}f(t)$$\n\n这意味着概率与密度函数图像下的面积有关。与密度函数相关的是*累积分布函数*（*cumulative distribution\
  \ function*，*cdf*）`F(x)`，其定义为：\n\n$$F(x) = \\int_{-\\infty}^{x}f(t)$$\n\n从图像来看，`F(x)`\
  \ 是曲线 `y = f(t)` 在 `x` 左侧的面积。\n\n许多函数都可能是密度函数。我们挑选三种常见的密度函数类型。\n\n**示例 6.6.1（均匀密度函数）**\n\
  \n如果随机变量 *X*，*a* ≤ *X* ≤ *b* 具有均匀密度函数（我们说 X 是*均匀分布*的），则值在 *a* 到 *b* 之间“分布均匀”。`RAND`\
  \ 函数产生在 0 到 1 之间均匀分布的伪随机变量值。均匀分布随机变量的密度函数为：\n\n$$f(x) = \\left\\{ \\begin{matrix}\
  \ \\frac{1}{b - a} & {\\text{如果~}a \\leq x \\leq b} \\\\ 0 & \\text{否则.} \\end{matrix}\
  \ \\right.$$\n\n该密度函数的图像所示图 6.41。\n\n![fig6_41.jpg](img/fig6_41.jpg)\n\n图 6.41\n\
  \n均匀分布随机变量 *X* 的均值为 (*b* + *a)/2，标准差为 $(b - a)/\\sqrt{12}$。□\n\n\n\n\n其中 `μ` 是均值，`σ`\
  \ 是标准差。该密度函数的图是图 6.42 中所示熟悉的钟形曲线。在图中我们看到变量 `X` 取接近均值 `μ` 的值的概率高于远离均值的概率。\n\n![fig6_42.jpg](img/fig6_42.jpg)\n\
  图 6.42\n\n### 示例 6.6.3 (指数密度函数)\n\n指数密度函数通常用于对事件之间的等待时间建模。它的形式为\n\n$$f(x) = \\left\\\
  { \\begin{matrix} {\\lambda e^{- \\lambda x}} & {\\text{if~}x \\geq 0} \\\\ 0 &\
  \ \\text{otherwise.} \\end{matrix} \\right.$$\n\n其中 `λ` > 0 是一个参数。该密度函数的图所示图 6.43。在图中我们看到变量\
  \ `X` 取接近 0 的值的概率高于取大得多数值的概率。\n\n![fig6_43.jpg](img/fig6_43.jpg)\n图 6.43\n\n指数分布随机变量的均值和标准差均等于\
  \ `1/λ`。\n\n一旦我们知道了随机变量 `X` 的密度函数 `f (x)`，我们就可以以下通用算法使用 `RAND` 函数生成它的值：\n\n1. 找到累积分布函数\
  \ (cdf) `y = F(x) = \\int\\limits_{- \\infty}^{x}{f(t)dt}`\n2. 找到 cdf 的逆函数 `x =\
  \ F^(−1) (y)`\n3. 使用 `RAND` 函数生成 `y` 的值，并通过 `x = F^(−1) (y)` 计算出 `X` 的值。\n\n###\
  \ 示例 6.6.4 (生成指数分布的值)\n\n为了说明该算法，考虑生成指数分布随机变量 `X` 的值。\n\n*   **步骤 1：** 找到累积分布函数$$F(x)\
  \ = \\int\\limits_{- \\infty}^{x}{f(t)dt} = \\int\\limits_{0}^{x}{\\lambda\\; e^{-\
  \ \\lambda\\; t}dt} = 1 - e^{- \\lambda\\; x}$$\n*   **步骤 2：** 设置 `F (x) = y` 并求解\
  \ `x`.$$y = 1 - e^{- \\lambda x}\\quad\\Rightarrow\\quad x = - \\frac{1}{\\lambda}\\\
  ln\\left( {1 - y} \\right)\\quad\\Rightarrow\\quad F^{- 1}(y) = - \\frac{1}{\\lambda}\\\
  ln\\left( {1 - y} \\right)$$\n*   **步骤 3：** 令 `y = RAND`，因此公式为：\n\n    | $$x = -\
  \ \\frac{1}{\\lambda}\\ln\\left( {1 - \\textbf{RAND}} \\right)$$ | ((6.3)) |\n \
  \   | --- | --- |\n\n公式 (6.3) 可以很容易地在 Excel 中实现。将一个空白工作表重命名为 \"**Exponential**”并按照图\
  \ 6.44 所示进行格式设置。将第 3 行向下填充到第 1002 行，以生成该随机变量的 1000 个值列表。\n\n![fig6_44.jpg](img/fig6_44.jpg)\n\
  图 6.44\n\n在示例 6.6.4 中，我们生成了 1000 个指数分布随机变量的值。计算相当容易，但它们引出了至少两个问题：\n\n1. 生成指数分布随机变量的值到底意味着什么？\n\
  2. 我们如何检查这些计算是否按照我们的预期方式工作？\n\n我们可以通过创建一种非常重要的图表——*直方图*来回答这些问题。\n\n### 示例 6.6.5\
  \ (生成直方图)\n\n在较新版本的 Excel 中生成直方图非常容易。在这里我们创建并分析示例 6.6.4 中生成的 1000 个值的直方图。按照以下步骤操作：\n\
  \n1. 在 **Exponential** 工作表中，选择区域 B3:B1003。\n2. 在**插入** (Insert) 选项卡中，选择**插入统计图**并选择如图\
  \ 6.45 所示的**直方图**。\n3. 右键点击生成图表的水平轴。选择**设置坐标轴格式**。在**坐标轴选项**下，将**箱数** (Number of\
  \ bins) 更改为 8。在**数字**下，选择**类别**和**数字**，并将位数设置为 2。生成的图表应类似于图 6.46。\n\n![fig6_45.jpg](img/fig6_45.jpg)\n\
  图 6.45\n![fig6_46.jpg](img/fig6_46.jpg)\n图 6.46\n\nExcel 通过将值范围划分为 8 个 `bins`（箱，也称为\
  \ `subintervals`（子区间）或 `classes`（类），然后计算每个箱中的值数量来生成此直方图。图显示，例如有 275 个值在 0 到 0.27\
  \ 之间。较大的值频率较低。最重要的是，注意直方图的“形状”类似于图 6.43 中的密度函数。\n\n直方图回答了两个问题：\n\n1. 生成指数分布随机变量的值意味着我们有很多接近\
  \ 0 的值。\n2. 如果直方图的形状类似于密度函数，则计算是有效的。\n\n### 示例 6.6.6 (生成均匀分布的值)\n\n可以证明均匀分布变量的逆\
  \ CDF 为 `F^(−1) = a + (b − a)*y`（见练习 6.6.1），`F^(−1) = a+(b−a)y`。将一个空白工作表重命名为 \"\
  **Uniform**”并按照图 6.33 所示进行格式设置。将第 4 行向下填充到第 1003 行，生成该随机变量的 1000 个值。如图 6.48 所示生成这些值的直方图。注意所有值的出现频率相等，且直方图的形状类似于图\
  \ 6.41 中的密度函数。\n\n![fig6_47.jpg](img/fig6_47.jpg)\n图 6.47\n![fig6_48.jpg](img/fig6_48.jpg)\n\
  图 6.48\n\n### 示例 6.6.7 (生成正态分布的值)\n\n我们可以通过计算 `F` 和 `F^(−1)` 推导出生成正态分布变量公式，但这些计算非常复杂。幸运的是，Excel\
  \ 内置了 `F^(−1)`。将一个空白工作表重命名为 \"**Normal**”并按照图 6.49 所示进行格式设置。将第 4 行向下填充到第 1003 行，生成该随机变量的\
