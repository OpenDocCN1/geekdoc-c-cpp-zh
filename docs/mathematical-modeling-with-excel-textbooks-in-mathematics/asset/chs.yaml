  \ 0 开始。这个最优解是否与 b 部分找到解相等？\n\n## 8.6 拉格朗日乘数\n\n本章目前为止涵盖的优化问题都是相对无约束的，这意味着除了变量取值的范围限制外，没有其他约束。在本节中，我们引入了一种求解受约束非线性优化规划的技术，称为`拉格朗日乘数法`，它利用了梯度。我们将讨论限制在涉及两个决策变量和一个约束的规划，尽管这些思想可以扩展到任意数量的变量和约束。第一个示例是非线性受约束优化问题的几何应用。\n\
  \n### 示例 8.6.1（最小化距离）\n\n在双曲线 `xy = 2` 的图上找到距离原点最近的点。\n\n[图 8.31] 显示了曲线 `xy = 2`\
  \ 的图像。从图形上看，我们正在寻找这条曲线上距离原点最近的点（由曲线上的点表示）。点必须在该曲线上的这一事实可以写为约束 `xy - 2 = 0`。\n\n\
  ![fig8_31.jpg](img/fig8_31.jpg)\n\n图 8.31\n\n我们要最小化到原点的距离。从原点到一般点 `(x, y)` 的距离为\
  \ $\\sqrt{x^{2} + y^{2}}$。为了简化代数，我们将最小化距离的平方 `x² + y²`。因此，我们将规划写为：\n\n$$\\begin{matrix}\
  \ {\\mathbf{M}\\mathbf{i}\\mathbf{n}\\mathbf{i}\\mathbf{m}\\mathbf{i}\\mathbf{z}\\\
  mathbf{e}\\,} & {f(x,\\, y) = x^{2} + y^{2}} \\\\ {\\mathbf{S}\\mathbf{u}\\mathbf{b}\\\
  mathbf{j}\\mathbf{e}\\mathbf{c}\\mathbf{t}\\,\\mathbf{t}\\mathbf{o}\\,} & {xy -\
  \ 2 = 0.} \\end{matrix}$$\n\n[图 8.31] 显示了所有满足 `f(x, y) = 1` 的点，这些点被称为 `f(x, y)`\
  \ 的`等值线`。我们看到这条曲线没有与曲线 `xy = 2` 相交。因此，`f(x, y)` 不可能等于 1。[图 8.31] 还显示了等值 `f(x, y)\
  \ = 9`。我们看到这条曲线确实与曲线 `xy = 2` 相交。因此，`f(x, y)` 可能小到 9。然而，似乎存在比 9 更小的 `f(x, y)` 值。下面的定理（我们不作证明直接给出）是求解此类本示例所示规划的关键。\n\
  \n**定理 8.6.1.** 对于规划：\n\n$$\\begin{matrix} {\\mathbf{M}\\mathbf{i}\\mathbf{n}\\\
  mathbf{i}\\mathbf{m}\\mathbf{i}\\mathbf{z}\\mathbf{e}\\,} & {f(x,\\, y)} \\\\ {\\\
  mathbf{S}\\mathbf{u}\\mathbf{b}\\mathbf{j}\\mathbf{e}\\mathbf{c}\\mathbf{t}\\,\\\
  mathbf{t}\\mathbf{o}\\,} & {g(x,\\, y) = 0,} \\end{matrix}$$\n\n如果最优解位于 `∇g(a, b)\
  \ ≠ 0` 的点 `(a, b)` 处，则：\n\n| `∇f(a, b) = λ∇g(a, b)` | (8.3) |\n| --- | --- |\n\n\
  *对于某些称为`拉格朗日乘数`的常数 `λ`。*\n\n[定理 8.6.1] 为点 `(a, b)` 处存在最优解提供了必要条件。该定理表明方程 ([8.3])\
  \ 的解是最优解位置的候选。与梯度法一样，这种解不能保证是全局最优解。\n\n### 示例 8.6.2（使用拉格朗日乘数）\n\n让我们使用[定理 8.6.1]来求解[示例\
  \ 8.6.1]。我们有 `f(x, y) = x² + y²` 和 `g(x, y) = xy - 2`。梯度为：\n\n$$\\nabla f(x,\\,\
  \ y) = \\begin{bmatrix} {2x} \\\\ {2y} \\end{bmatrix}\\quad\\text{and}\\quad\\nabla\
  \ g(x,\\, y) = \\begin{bmatrix} x \\\\ y \\end{bmatrix}.$$\n\n要求 `∇f(x, y) = λ∇g(x,\
  \ y)` 导致了方程组：\n\n$$\\begin{matrix} {2x} &= \\lambda y} \\\\ {2y} &= \\lambda x.}\
  \ \\end{matrix}$$\n\n将第一个方程乘以 `x`，第二个方程乘以 `y`，得到：\n\n$$\\begin{matrix} {2x^{2}}\
  \ &= \\lambda xy} \\\\ {2y^{2}} &= \\lambda xy.} \\end{matrix}$$\n\n因此我们看到 `2x²\
  \ = 2y²`。现在约束 `xy - 2 = 0` 意味着 `xy = 2`，因此 `x` 和 `y` 具有相同的符号。这结合 `x² = y²` 的事实意味着\
  \ `x = y`。结合 `xy = 2` 的事实得到 $x^{2} = 2 \\Rightarrow x = \\pm \\sqrt{2}$。\n\n因此，最小距离出现在\
  \ `(-√2, -√2)` 和 `(√2, √2)` 处。`2² = λxy` 意味着 `λ=2`。正如我们所看到的，这涉及到拉格朗日乘数。\n\n### 示例\
  \ 8.6.3（使用 Excel）\n\n为了求解[示例 8.6.1]，重命名空白工作表为 `Min Dist` 并将其格式化如图 8.32 所示。\n\n![fig8_32.jpg](img/fig8_32.jpg)\n\
  \n等待，在求解器中，将目标设置为 `$C2`，更改单元格为 `$A2:$B2`，添加约束 `$D2=0`，选择 GRG 非线性。点击**求解**后，在**报告**下选择**敏感性**并点击**确定**。结果如[图\
  \ 8.33]所示。\n\n![fig8_33.jpg](img/fig8_33.jpg)\n\n图 8.33\n\n求解得到了与代数法相同的 `x` 和 `y`\
  \ 解以及相同的 `λ` 值。求解器还显示了“减少梯度”，这在我们的目的中没有实际意义。\n\n### 示例 8.6.4（生产手机）\n\n某公司正在计划生产新型手机，旨在席卷市场。新型手机的两个主要组件是电路板和使手机更快、更智能且内存更大的开关。预计可以生产的数量为：\n\
  \n`E(a, b) = 200a^{1/2}b^{1/4}`\n\n其中 `E(a, b)` 是手机数量，`a` 是生产电路板的时间（千小时），`b` 是生产开关的时间（千小时）。这种函数被经济学家称为`柯布-道格斯`。假设电路板生产每小时成本为\
  \ 5 美元，开关生产每小时成本为 10 美元，且公司有 15 万美元资金用于动力。应该生产多少电路板和开关以使手机产量最大化？\n\n约束是可用资金。这很容易被建模为\
  \ $5a + 10b = 150 \\Rightarrow 5a + 10b - 150 = 0$。\n\n因此我们的规划为：\n\n$$\\begin{matrix}\
  \ {\\mathbf{M}\\mathbf{a}\\mathbf{x}\\mathbf{i}\\mathbf{m}\\mathbf{i}\\mathbf{z}\\\
  mathbf{e}\\,} & {E(a,\\, b) = 200a^{1/2}b^{1/4}} \\\\ {\\mathbf{S}\\mathbf{u}\\\
  mathbf{b}\\mathbf{j}\\mathbf{e}\\mathbf{c}\\mathbf{t}\\,\\mathbf{t}\\mathbf{o}\\\
  ,} & {g(a,\\, b) = 5a + 10b - 150 = 0.} \\end{matrix}$$\n\n我们将让 Excel 完成所有工作。重命名空白工作表为\
  \ `E-phone` 并将其格式化如图 8.34 所示。\n\n![fig8_34.jpg](img/fig8_34.jpg)\n\n图 8.34\n\n\n\
  \n\n将 `Solver` 设置与示例 8.6.3 相同，只需选择最大化单元格 `$E$2`。敏感性报告见图 8.35。这些结果显示，我们应该花费 2 万小时生产电路板和\
  \ 5 千 小时生产继电器，且拉格朗日乘数为 `λ` = `6.687`。工作表 `E-phones` 显示，该解决方案将产生 1337.481 台 `E-phones`（实际上，这个数字将被四舍入为整数）。\n\
  \n![fig8_35.jpg](img/fig8_35.jpg)\n\n图 8.35\n\n为了理解拉格朗日乘数 `λ` = `6.687` 在实际中的意义，假设我们将可用劳动力资金增加\
