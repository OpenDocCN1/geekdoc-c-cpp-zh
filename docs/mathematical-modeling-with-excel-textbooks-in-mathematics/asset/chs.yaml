  \n\n\n\n\n# 引言\n\n关于比例关系的一个重要观察结果是：如果一个变量增加，另一个也会随之增加；如果一个变量减少，另一个也会随之减少。这可以在图 2.2\
  \ 和图 2.10 中看到每当我们遇到两个变量同时增加或减少的情况时，都应该考虑比例关系。\n\n### **示例 2.3.1**（人口增长）\n\n在许多涉及人口的情况下，人口数量越大，增长得越快。这表明人口与增长率之间存在比例关系。表\
  \ 2.3 显示了不同时间点培养皿中细菌的人口（以千为单位）。第三列包含不同时间段之间人口的变化。\n\n表 2.3\n\n| 天数 *n* | 实际人口 *p*[*n*]\
  \ | 人口变化 *Δ**p*[*n*] = *p*[*n* + 1] − *p*[*n*] |\n| --- | --- | --- |\n| 0 | 10.3\
  \ | 6.9 |\n| 1 | 17.2 | 9.8 |\n| 2 | 27 | 18.3 |\n| 3 | 45.3 | 34.9 |\n| 4 | 80.2\
  \ | 45.1 |\n| 5 | 125.3 | 50.9 |\n| 6 | 176.2 | 79.4 |\n| 7 | 255.6 |  |\n\n观察发现随着\
  \ *n* 的增加，*p*[*n*] 增加，*Δ**p*[*n*] 也是如此。这表明 *p*[*n*] 与 *Δ**p*[*n*] 成正比。*Δ**p*[*n*]\
  \ 与 *p*[*n*] 的关系图如图图 2.13 所示。\n\n![fig2_13.jpg](img/fig2_13.jpg)\n\n图 2.13\n\n我们看到这些点确实位于通过原点的直线附近，这表明比例关系是一个合理的假设。该直线的斜率约为\
  \ 0.5。这给出了模型，将某一天的人口 *p*[*n*] 与下一天的人口 *p*[*n*+1] 联系起来：\n\n```\n*Δ**p*[*n*] = *p*[*n* + 1] − *p*[*n*] = 0.5*p*[*n*] ⇒  *p*[*n* + 1] = 1.5*p*[*n*]\n\
  ```\n\n该模型预测每个时间段的人口增长约 50%，这意味着人口将无限制地增长。这似乎是不合理的，因此模型需要进行完善。我们将在第 4 章中这样做。□\n\n\
  ### **示例 2.3.2**（放射性衰变）\n\n放射性物质的数量在每个半衰期后会减少一半。放射性碳-14 (¹⁴C) 的半衰期为 5715 年。如果我们从\
  \ 10g 的 ¹⁴C 开始，表 2.4 显示了每个半衰期后剩余的量以及时间段之间的变化率。\n\n表 2.4\n\n| 时间（年） | 数量 | 变化 |\n\
  | --- | --- | --- |\n| 0 | 10 | 5 |\n| 5,715 | 5 | 2.5 |\n| 11,430 | 2.5 | 1.25\
  \ |\n| 17,145 | 1.25 | 0.625 |\n| 22,860 | 0.625 |  |\n\n注意，随着 ¹⁴C 数量的减少，其减少的速度也会发生变化。这表明\
  \ ¹⁴C 的数量与其减少的速度之间存在比例关系。\n\n如果我们让 *y*(t) 代表时间 *t* 时 ¹⁴C 的数量，这种比例关系给出了微分方程\n\n```math\n\
  \\frac{dy}{dt} = k\\mspace{180mu} y.\n```\n\n求解该微分方程可以得到增长的指数模型 *y*(t) = *Ce*^(**kt*)*)，其中\
  \ *C* 是物质的初始量。□\n\n在之前的示例中，我们使用某些类型的数据来提出比例关系。很多时候，正如下一个示例所示，我们仅仅使用逻辑来假设比例关系。\n\n\
  ### **示例 2.3.3**（自由落体物体）\n\n自由落体物体会遇到两种基本力。第一个是重力产生的重量。第二个是减慢下降速度的空气阻力。在低速下空气阻力通常忽略不计，因此通常不对其建模。如果我们忽略空气阻力，作用在物体上的力只有重力加速度。这导致了简单的微分方程\n\
  \n```math\n\\frac{dv}{dt} = g\n```\n\n其中 *v*(t) 是时间 *t* 物体的速度，*g* = 9.8 m/s²（重力加速度）。求解该微分方程得到模型\
  \ *v*(t) = *gt* + *v*[0]，其中 *v*[0] 是初始速度。该模型预测速度将无限制地增长，这显然是不合理的。（注：原文此处存在逻辑重复和断句，已根据逻辑调整）。\n\
