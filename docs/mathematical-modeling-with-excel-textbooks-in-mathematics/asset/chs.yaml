  \ `x[0]` 和 `y[0]` 为 −10 和 10 之间的随机数。\n2. 使用数据表存储 100 个初始点的结果并显示最佳解。\n3. 现在尝试使用 `λ`\
  \ = 0.2。情况如何？\n4. 现在尝试使用 `λ` = 0.0001。情况如何？\n\n**8.5.2** 考虑寻找函数 `f`(`x`, `y`) = 9`x`− 0.1`x`² + 15`y`− 0.15`y`²\
  \ 的最大值。\n\n1. 使用 100 次迭代二元梯度法，`λ` = 0.5，初始点 (0, 0) 来近似该问题的解。\n2. 现在尝试使用 `λ` = 0.1。情况如何？\n\
  \n**8.5.3** 梯度法将点 `x[k]`, `y[k]` 移动到 `x[k+1]`, `y[k+1]`，受到两个量的影响：梯度的长度  ∥ ∇*f*(`x[k]`,`y[k]`)∥\
  \ 和 `λ` 的值。随着算法的进行， ∥∇*f*(`x[k]`,`y[k]`)∥越来越小，点移动得就不那么远。正如我们看到的，如果 `λ` 太小，算法在合理的迭代次数内找不到最优解。\n\
  \n解决这个问题的一种方法是在每次迭代中增加 `λ` 的值。包含该想法的最大函数简单算法如下：\n\n1. 选择初始值 (`x[0]`, `y[0]`) 和 `λ[0]`。\n\
  2. 令 $\\left\\{ \\begin{array}{l} {x_{k + 1} = x_{k} + \\lambda_{k}\\frac{\\partial\
  \ f}{\\partial x}\\left( {x_{k},\\, y_{k}} \\right)} \\\\ {y_{k + 1} = y_{k} + \\\
  lambda_{k}\\frac{\\partial f}{\\partial y}\\left( {x_{k},\\, y_{k}} \\right)} \\\
  end{array} \\right.$\n3. 令 `λ[k+1]` = `δ``λ[k]`，其中 `δ` > 1 是某个指定的常数。\n4. 重复步骤 2\
  \ 和 3 50 次（50 是任意的）。\n\n1. 实现此算法最大化练习 8.5.2 中的函数，使用 `λ[0]` = 0.1，`δ` = 1.1 和初始点\
  \ (0, 0)。该解与练习 8.5.2 中找到的相比如何？\n2. 现在尝试使用 100 次迭代。情况如何？\n\n梯度为了足够接近 (0, 0) 到底需要多少次迭代？如果我们让算法运行过多会发生什么？\n\
  \n**8.5.4** 在我们简单的梯度算法中，我们任意地执行了 50 次迭代。在算法更复杂的版本中，重复步骤 2 直到满足某些“停止准则”。一个非常简单的停止准则是：当\
  \  ∥ ∇*f*(`x[k]`,`y[k]`)∥ < `δ` 时算法终止，其中 `δ` > 0 是某个指定的常数。修改工作表 **2-Dim** 以包含此停止准则，并输出执行的迭代次数以及找到的最小值。允许最多\
  \ 100 次迭代。\n\n\n\n\n\n### 8.5.5\n梯度法需要目标函数的导数知识。在示例 8.5.2 中，我们使用导数规则找到 `∇f(x, y)`，然后用它来计算\
  \ `∇f(x[k], y[k])`。这种方法并不总是完全可行，因为它要求用户首先找到 `∇f(x, y)`，这可能非常困难。数值近似 `∇f(x[k], y[k])`\
  \ 的一种方法是选择一个较小的 `d`，然后用以下公式近似偏导数：\n\n$$\\begin{matrix} {\\frac{\\partial f}{\\partial\
  \ x}\\left( {x_{k},\\, y_{k}} \\right)} & {\\approx \\frac{f\\left( x_{k} + d,\\\
  , y_{k} \\right) - f\\left( x_{k},\\, y_{k} \\right)}{d},\\text{~and}} \\\\ {\\\
  frac{\\partial f}{\\partial y}\\left( {x_{k},\\, y_{k}} \\right)} & {\\approx \\\
  frac{f\\left( x_{k},\\, y_{k} + d \\right) - f\\left( x_{k},\\, y_{k} \\right)}{d}.}\
  \ \\end{matrix}$$\n\n1. 在 **2-Dim** 工作表中，将 `f'(x[k])` 的公式替换为这种近似偏导数的方法。初始使用起始点 (0,\
  \ 0.5) 和 `d` = 0.01，但让用户指定 `d` 的值。\n2. 尝试表 8.1 中的起点。将这些结果与原始结果进行比较。\n3. 尝试不同的 `d`\
