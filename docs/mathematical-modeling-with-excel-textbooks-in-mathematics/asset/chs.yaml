  \n![fig3_32.jpg](img/fig3_32.jpg)\n\n图 3.32\n\n## 选择最佳模型的通用指南\n\n通常，在构建经验模型时，会有许多不同模型可供选择。决定哪一个最好并不是容易的，而且通常很主主观性，但这里是一些简单的准则：\n\
  \n1. 考虑 `R`² 值，但不要完全依赖它。\n2. 寻找残差中的模式。如果存在模式，则应该对模型进行改进。\n3. 考虑模型在数据值之间进行预测的效果有多好。如果它发生震荡或给出不合理的值，请寻找更好的模型。\n\
  4. 考虑“末端”行为。如果数据在最后似乎在“平稳”，但模型在增加（反之亦然），请考虑不同的模型。\n5. 考虑模型的简单性。通常情况下，项越少越好。\n\n\
  我们还必须强调，当使用经验模型（如本节和第 2 章中讨论的模型）进行预测时，预测始终是真实值的点估计。这些预测绝不应被呈现为精确的确定性。统计学和回归方面的书籍讨论了如何使用点估计来形成真实值的置信区间（可能值的范围），但这个主题超出了本书的范围。\n\
  \n### 练习\n\n**3.3.1** 使用最小二乘矩阵法对一组具有 4 个点的随机生成数据集进行线性模型拟合 `y` = `a` + `mx`。通过示例证明其结果与\
  \ 2.4 节中的公式相同。\n\n**3.3.2** 对下表数据拟合不同的多项式模型并选择最好的一个。解释如何确定哪一个是最好的。\n\n| **x** |\
  \ 1.4 | 2.4 | 7.1 | 13.8 | 34.2 | 109.3 | 134 |\n| **y** | 2.7 | 2.27 | 3.31 | 3.39\
  \ | 3.81 | 4.88 | 4.62 |\n\n**3.3.3** 计算拟合示例 3.3.5 鹿群数据的 `R`² 值。\n\n**3.3.4** 正如示例\
  \ 3.3.2 所示，考虑对 4 个数据点拟合二次多项式的问题。假设我们模型的模型的截距为值 `c0`。也就是说，我们想要拟合一个形式为 `y` = `ax`²\
  \ + `bx` + `c0` 的模型。设计一个电子表格，使用户可以输入 4 个数据点并指定 `c0` 的值。\n\n**3.3.5** 多项式的一个有用属性是易于求导和积分。假设研究人员观察到一个粒子沿直线运动，并测量表中所示的几个时间点相对于起始位置的速度。\n\
  \n| **t** | 0 | 1.2 | 2.5 | 3.2 | 4.6 | 5.4 | 7.3 |\n| **v** | 0 | 3.6 | 5.5 | 7.4\
