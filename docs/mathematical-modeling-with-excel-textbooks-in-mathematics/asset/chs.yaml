  \ 8.5.1）。\n\n上述讨论说明梯度法是一种近似函数临界点的简单算法。它的缺点是在没有外部知识的情况下无法判断找到解是最小值还是极大值。因此在使用时必须谨慎。为了避免梯度法的问题，尽可能将问题建模为线性（参见练习\
  \ 8.5.11）。\n\n### 练习\n\n**8.5.1** 考虑寻找函数 `f`(`x`, `y`) = 2`x`² + 6`x`**`y`* + 6`y`²\
