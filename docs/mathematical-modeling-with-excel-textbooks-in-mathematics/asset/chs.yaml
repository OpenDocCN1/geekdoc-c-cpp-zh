  \ `Quadratic` 以计算平衡点并绘制轨迹图。\n2. 使用滚动条将 `λ` 在 0 到 2 之间变化。在 `λ` 的哪些值下物种会共存？对于其他 `λ`\
  \ 的值会发生什么？\n3. 现在假设 `a[1]` = 0.2 且 `a[2]` = 0.1。即假设内增长率交换了。重复 b 部分。\n4. 现在假设 `a[1]`\
  \ = `a[2]` = 0.1。重复 b 部分。\n5. 推广你的结果。在初始种群相等的情况下，哪种物种更有可能生存？内增长率较高的物种，还是增长率较低的物种？\n\
  \n## 5.6 沃尔特拉原理\n\n以下场景由 Braun 描述（Braun, Martin, “第一次世界大战期间地中海捕获鲨鱼比例为何剧增，”见 *Modules\
  \ in Applied Mathematics* Volume 1 *Differential Equation Models*, ed. William F.\
  \ Lucas, Springer-Verlag, 1983, p. 221，经许可使用）：\n\n20 世纪 20 年代中期，意大利生物学家 Umberto\
  \ D’Ancona 正在研究相互作用的多种鱼类种种群数量的变化。在研究过程中，他发现了在第一次世界大战期间进入不同地中海港口的几种鱼类种类占总捕获量百分比的数据。特别是，这些数据给出了软骨鱼类（鲨鱼、鳐、鱼鱼等）占总捕获量的百分比，它们作为食用鱼并不理想。1914\
  \ 年至 1923 年间，意大利菲乌梅（Fiume）港的数据如下：\n\n| 1914 | 1915 | 1916 | 1918 | 1919 | 1920 |\
  \ 1921 | 1922 | 1923 |\n| :--- | :--- | :--- | :--- | :--- | :--- | :--- | :---\
  \ | :--- |\n| 11.9% | 21.4% | 22.1% | 36.4% | 27.3% | 16.0% | 15.9% | 14.8% | 10.7%\
  \ |\n\nD’Ancona 对战争期间软骨鱼类百分比的大增感到困惑。显然，他推理认为，软骨鱼类百分比的增加由于这段时期捕鱼水平的大幅降低，但捕鱼强度如何影响鱼类种群呢……这对渔业来说也是一个担忧，因为它对捕鱼作业的方式产生明显的影响。\n\
  \nD’Ancona 将这个问题交给了著名的意大利数学家 Vito Volterra。Volterra 注意到软骨鱼类是捕食者，而食用鱼是它们的猎物。因此，他设计了一个简单的捕食者-猎物模型：\n\
  \n$$\\begin{matrix} \\frac{dx}{dt} & {= a_{1}x - b_{1}xy} \\\\ \\frac{dy}{dt} &\
  \ {= - a_{2}y + b_{2}xy} \\end{matrix}$$\n其中 `x(t)` 和 `y(t)` 分别是猎物（食用鱼）和捕食者（软骨鱼类）的种群，且\
  \ `a[1]`, `a[2]`, `b[1]`, `b[2]` > 0。为了模拟捕鱼的影响，Volterra 在每个方程中增加了一个额外项：\n\n| $$\\\
  begin{matrix} \\frac{dx}{dt} & {= a_{1}x - b_{1}xy - cx} \\end{matrix}$$ | (5.11)\
  \ |\n| :--- | :--- |\n| $$\\begin{matrix} \\frac{dy}{dt} & {= - a_{2}y + b_{2}xy\
  \ - cy} \\end{matrix}$$ | (5.12) |\n| --- | :--- |\n\n参数 `c` > 0 可以被认为是单位时间内捕获的每个种群的比例。重写\
  \ `[5.11]` 和 `[5.12]` 得到：\n\n$$\\begin{matrix} \\frac{dx}{dt} & {= a_{1}x - b_{1}xy\
  \ - cx} \\\\ \\frac{dy}{dt} & {= - a_{2}y + b_{2}xy - cy} \\end{matrix}$$\n\n我们看到这个模型是\
  \ 5.5 节研究的种群模型的一个特例。通过 5.5 导出的公式，我们计算出平衡点在\n\n$$\\left( \\frac{a_{2} + c}{b_{2}},\\\
  frac{a_{1} - c}{b_{1}} \\right)$$\n\n让我们通过图表检查这样一个系统：\n\n1. 重命名一个空白工作表为 `Volterra`，并按照\
  \ [Figure 35] 进行格式设置。注意，这些值并非来自数据，它们只是我们想要说明的观点。\n2. 按照 [Figure 36] 添加公式，使用欧拉法计算。将第\
  \ 13 行复制到第 10 行。与参数一样，这些初始种群是任意的。\n3. 使用滚动条在 [Figure 37] 中绘制轨迹，以近似该模型的 `T` 值。注意到我们得到了一个类似于狐和兔子捕食者-猎物模型的循环。这意味着种群是周期性的（类似于正弦或余弦曲线）。数学上，这意味着存在一个时间\
  \ `T` 使得\n\n`x(T) = y(T)`\n\n\n\n\n\n定理 5.6.1 解释了 D’Ancona 的观察结果。我们看到，适度的捕捞（`*c*\
  \ < *a*[1]`）会增加 $\\overline{x}$（猎物的平均数量，或食鱼鱼）并减少 $\\overline{y}$（捕食者的平均数量，或鲨鱼）。相反，捕捞数量的减少（如第一次世界大战期间发生）平均会增加鲨鱼的数量并减少食鱼鱼的数量。某些捕捞会增加食鱼鱼数量的事实被称为*沃尔特原理*（Volterra’s\
  \ Principle）。\n\n### 练习\n\n**5.6.1** 在原始的“捕鱼”模型中，我们假设捕食者和猎物被捕的速率相同。现在考虑一个改进的“杀虫剂”模型，其中捕食者和猎物被杀的速率不同：\n\
