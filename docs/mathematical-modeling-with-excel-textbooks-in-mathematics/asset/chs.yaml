  \ 1000 只兔子。在这个模型中，我们使用了 `a[1]` 和 `a[2]` 的常数值（数字 -0.08 和 0.04）。在 `第 4 章` 的术语中，它们分别是狐狸的死亡因子和兔子的出生因子。现在假设这些因素随季节变化。假设在“夏季”，这些因素分别为\
  \ -0.08 和 0.04；但在“冬季”，它们分别为 -0.1 和 0.01。\n\n1. 使用欧拉法在 `h` = 1 的情况下估计从 0 月到 250 月的种群数量。创建一个狐狸种群随月份变化的图，另一个是兔子种群的图。让冬季发生在\
  \ 0 月到 5 月，然后 12 月到 17 月，以此类推。\n2. 比较因素恒定与变化时种群的情况。变化的因素是导致种群范围扩大还是缩小？\n\n**5.5.11**\
  \ 我们原始的狐-狼二次群体模型具有一般形式\n\n\n\n\n\n$$\\begin{matrix} \\frac{dx}{dt} & {= a_{1}x -\
  \ \\frac{a_{1}}{L_{1}}x^{2} - \\lambda\\frac{a_{1}}{L_{1}}xy} \\\\ \\frac{dy}{dt}\
  \ & {= a_{2}y - \\frac{a_{2}}{L_{2}}y^{2} - \\lambda\\frac{a_{2}}{L_{2}}xy} \\end{matrix}$$\n\
  \n其中 `a[1]` 和 `a[2]` 是内增长率，`L[1]` 和 `L[2]` 是各自物种的载容量量，`λ` 衡量物种间竞争相对于物种内竞争的影响（`λ`\
