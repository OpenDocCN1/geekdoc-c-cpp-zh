  \n图 A.9\n\n以下这些标签页都是非常有用的：\n\n-   `Number`（数字）：标签允许你更改显示方式。例如，设置小数位数。\n-   `Font`（字体）：标签允许你更改字体样式和大小。\n\
  -   `Border`（边框）：标签允许你更改边框。\n-   `Patterns`（图案）：标签允许你更改背景。\n\n## A.3 创建图表和图形\n\n\
  为了说明创建图表和图形的过程，请按照 图 A.10 所示对空白工作表进行格式设置。\n\n![fig9_10.jpg](img/fig9_10.jpg)\n\n\
  图 A.10\n\n要创建一个简单的 `y` 与 `x` 的图，请遵循以下步骤：\n\n1.  选择范围 `A1:B6` 并点击 `Insert`（插入）选项卡。在\
  \ `Charts` 部分选择如 图 A.11 所示的 `Scatter`（散点图）。生成的图表如 图 A.12。\n2.  左键点击图表任意位置，右上会出现一个大加号。点击此加号允许你选择和取消选择图元素。例如，选择\
  \ `Axis Titles`（轴标题）和 `Chart Title`（图标题）会出现文本框，你可以在其中输入标题。取消 `Gridlines`（网格线）可以去掉水平和垂直网格线。在输入一些标题后，你的图表可以像\
  \ 图 A.13 那样。给图表起一个有意义的标题是一个好习惯。通过双击图表任意位置可以修改图表的其他方面，例如颜色和线宽。\n3.  通过双击轴可以更改 x 轴和\
  \ y 轴的格式。\n\n![fig9_11.jpg](img/fig9_11.jpg)\n\n![fig9_12.jpg](img/fig9_12.jpg)\n\
  \n![fig9_13.jpg](img/fig9_13.jpg)\n\n### A.3.1 向图表添加数据\n\n假设我们将 图 A.14 中的数据在 图 A.13\
  \ 的同一 `x` − `y` 平面上绘制，请遵循以下步骤：\n\n1.  将 图 A.14 中的数据添加到工作表中。\n2.  右键点击图表任意位置，选择 `Select\
  \ Data...`（选择数据...）。\n3.  点击 `Add`（添加）按钮。对出现的窗口进行如 图 A.15 所示的格式设置。\n\n\n\n\n\n#\
  \ 生成的图表如图图 A.16 所示。你可以通过双击其中一个标记并使用屏幕右侧出现的窗口来更改每个系列的选项，例如标记的颜色和形状。\n\n5. 在绘制多组数据的图表时，我们通常需要图例来识别每组数据。我们可以通过点击图表任意位置、点击图表右上角出现的加号并选择`图例`来轻松添加图例。结果如图图\
  \ A.17 所示。可以通过左点击图表、选择`选择数据...`、选择所需的系列、点击`编辑`、在`系列名称`下输入所需的名称并点击`确定`来更改系列的名称。\n\
  \n![fig9_14.jpg](img/fig9_14.jpg)\n图 A.14\n\n![fig9_15.jpg](img/fig9_15.jpg)\n图\
  \ A.15\n\n![fig9_16.jpg](img/fig9_16.jpg)\n图 A.16\n\n![fig9_17.jpg](img/fig9_17.jpg)\n\
  图 A.17\n\n## A.3.2 绘制函数\n\nExcel 没有内置用于绘制函数的工具，但我们可以轻松地创建一个 `x` − `y` 表格然后绘制这些点。例如，要在区间\
  \ [− 2, 2] 上绘制函数 `f (x) = x²`，请按照图 A.18 所示的方法格式空白工作表。将第 3 行向下复制到第 42 行。\n\n![fig9_18.jpg](img/fig9_18.jpg)\n\
  图 A.18\n\n通过左点击并按住列 `A` 标题拖动到列 `B` 来选择列 `A` 和 `B`。插入类型为`平滑线条散点`的图表。创建图表后，取消网格线。\n\
  \n现在我们将调整 `x` 轴和 `y` 轴。双击 `x` 轴。在`轴选项`下将`最小值`和`最大值` 设置为 −2 和 +2。对 `y` 轴执行相同操作，将最小和最大值设置为\
  \ 0 和 4。更改图表标题后，结果应该看起来如图图 A.19 所示。\n\n![fig9_19.jpg](img/fig9_19.jpg)\n图 A.19\n\
  \n## A.4 滚动条\n\n滚动条允许我们通过图形界面更改单元格的值。这允许我们动态地更改模型中的参数值并分析结果。在空白工作表中，选择`视图` → `工具栏`\
  \ → `控件工具箱`。应该会出现一个与图 A.20 类似的的窗口。\n\n![fig9_20.jpg](img/fig9_20.jpg)\n图 A.20\n\n\
  对于我们的目的，此窗口中只有两个按钮：`设计模式`和`滚动条`。当你按下滚动条按钮时，光标会变成一个小十字。使用它画一个长条形矩形。右键点击生成的滚动条并选择`属性`。应该会出现一个与图\
  \ A.21 类似的的窗口。\n\n![fig9_21.jpg](img/fig9_21.jpg)\n图 A.21\n\n有三个我们需要更改的属性属性。`链接单元格`是我们想要更改其值的单元格。通过在旁边的框中输入\
  \ `A1`将其设置为 `A1`。`最小值`和`最大值`是单元格的最小最大值。将这些分别设置为 0 和 1,000。关闭属性窗口并点击`设计模式`按钮。滚动条现在可以使用了。前后移动滚动条上的滑块，注意单元格\
  \ `A1` 中的数字会在 0 到 1,000 之间以 1 为增量变化。可以通过点击`设计模式`按钮并右键点击滚动条来更改滚动条属性。\n\n在大多数情况下，我们可能希望单元格的值以除\
  \ 1 以外的增量变化。这可以使用引用链接单元格的公式来实现。例如，输入如图 A.22 所示的公式。前后移动滑块，注意单元格 `A2` 中的数字会在 0 到 100\
  \ 之间以 0.1 为增量变化。\n\n![fig9_22.jpg](img/fig9_22.jpg)\n图 A.22\n\n**注意**：使用`表单`工具栏创建滚动条有一种稍微简单的方法。然而，这些滚动条与图表的配合得并不好。使用上述方法，如果滚动条更改了图表上的值，图表会随着滑块的移动以连续的方式变化。如果使用`表单`工具栏，图表在松开鼠标按钮之前不会改变。\n\
  \n## A.5 数组公式\n\nExcel 可以执行简单的矩阵运算，如加法、乘法和求逆。例如，如果 $A = \\begin{bmatrix} 1 & 2 \\\
  \\ 3 & 4 \\end{bmatrix}$ 且 $B = \\begin{bmatrix} 3 & 4 \\\\ 5 & 6 \\end{bmatrix}$，要计算\
  \ $C = A + B$，按照图 A.23 所示格式空白工作表。要在单元格 `A1` 和 `B1` 之间居中“A”，选择范围 `A1:B1` 然后点击工具栏中的`居中`图标。（如果没有该图标，选择`格式`\
  \ → `单元格...`，勾选`合并单元格`并点击`确定`）。\n\n![fig9_23.jpg](img/fig9_23.jpg)\n图 A.23\n\n接下来，选择范围\
  \ `G2:H3`，输入 `=A2:B3+D2:E3` 并按下 `Ctrl-Shift-Enter` 组合（这告诉 Excel 计算数组）。结果如图图 A.24\
  \ 所示。注意当你选择 `G2:H3` 范围内的任何单元格时，公式带有 `{}`。这表示已输入数组公式。\n\n![fig9_24.jpg](img/fig9_24.jpg)\n\
