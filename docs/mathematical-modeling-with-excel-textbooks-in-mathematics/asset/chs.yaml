  \n图 7.20\n\n### 7.4.14\n下面显示了一个指派问题的成本矩阵，其中 – 表示分配不可行。尝试使用大 M 方法求解此指派问题。你能找到一个足够大的\
  \ `M` 来防止所有不可行的分配吗？这对该指派问题的解说明了什么？\n\n| | 任务 | | | | |\n| --- | --- | --- | ---\
