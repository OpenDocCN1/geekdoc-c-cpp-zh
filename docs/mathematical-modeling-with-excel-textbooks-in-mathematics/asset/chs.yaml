  \ 1，则服务器 1 的空闲时间为客户的实际开始时间加上服务时间。该客户不影响服务器 2，因此服务器 2 的空闲时间将与上一个客户相同。\n\n2.  使用练习\
  \ 6.7.5 给出的结果，如果只有一个服务率为 6 的服务器，计算期望等待时间。服务率翻倍是否会产生与服务器数量翻倍相同的期望等待时间？\n3.  假设一家剧院有一个售票员，并希望缩短客户等待时间。假设以下两种方案成本相同，使用部分\
  \ a. 和 b. 的结果确定哪种是更好的选择：\n\n    1.  增加设备使单名售票员的服务率翻倍。\n    2.  增加第二个售票员。\n\n###\
  \ 6.8 调度模型](#06_Contents.xhtml_rsec6_8)\n\nHandyman Remodeling 公司正在考虑对一份翻新客厅和餐厅的合同进行投标。合同规定，如果未能在开始后\
  \ 3 周（21 天）的截止日期前完成，将面临巨额罚款。该工作将由 8 个独立的任务组成，具有各种先序约束，如图 6.59](#15_Chapter06.xhtml_fig6_59）所示。\n\
  \n![fig6_59.jpg](img/fig6_59.jpg)\n\n图 6.59\n\n对于每个任务，项目经理估计了*最可能*持续时间 `m`、*乐观*持续时间\
  \ `a` 以及*悲观*持续时间 `b`（以天为单位）。这些数字位于表 6.3](#15_Chapter06.xhtml_table6_3）中。\n\n表 6.3\n\
  \n| **任务** | `a` | `m` | `b` |\n| --- | --- | --- | --- |\n| 拆除 | 2 | 3 | 4 |\n\
  | 电气 | 2 | 3.5 | 4 |\n| 水路 | 1 | 2 | 2.5 |\n| 干燥墙板 | 5 | 6 | 8 |\n| 油漆 | 2 | 3 |\
  \ 4.5 |\n| 灯具 | 3 | 4 | 5 |\n| 地毯 | 1 | 1.25 | 1.5 |\n| 装饰线条 | 2 | 3 | 4 |\n\n管理层想知道项目的预计持续时间以及满足截止日的概率，以便他们决定是否投标。我们将创建一个仿真来帮助回答这个问题。\n\
  \n每个任务的持续时间都是具有某种分布的随机变量。问题在于，我们不知道该分布是什么，而且没有合理的方法通过收集数据来确定密度函数。因此，我们能做的就是使用一个合理的分布来对这些随机变量建模。我们将使用的分布被称为*三角形分布*。其密度函数如图\
  \ 6.60](#15_Chapter06.xhtml_fig6_60)所示。\n\n![fig6_60.jpg](img/fig6_60.jpg)\n\n图\
  \ 6.60\n\n如果我们用三角形分布来建模任务的持续时间，从图 6.60](#15_Chapter06.xhtml_fig6_60)中看到靠近 *m* 的概率远高于乐观或悲观的概率。这一观察表明三角形分布确实是一个合理的模型。可以证明三角形分布的概率密度函数为：\n\
  \n```\nf(x) = \\begin{cases} \\frac{2(x-a)}{(b-a)(m-a)} & a \\le x \\le m \\\\ \\\
  frac{2(b-x)}{(b-a)(b-m)} & m < x \\le b \\end{cases}\n```\n\n**算法**\n\n1.  对于每个任务：\n\
  \    1. 根据先序任务的完成时间确定开始时间。\n    2. 生成任务持续时间。\n    3. 计算完成时间。\n2. 确定整个项目的持续时间。\n\
  3. 确定是否满足截止日期。\n4. 重复 500 次试验。\n5. 计算平均持续时间和满足截止日的百分比。\n\n要实现此算法，请按照以下步骤操作：\n\n\
  1. 重命名空白工作表为 `Remodel`，并按照图 6.61](#15_Chapter06.xhtml_fig6_61）进行格式设置。\n2.如图 6.62](#15_Chapter06.xhtml_fig6_62）所示添加逆分布函数的公式，并将单元格\
  \ `G2` 复制到区域 `G3:G9`。\n3. 建立一个存储 500 次试验结果的表，并如图 6.63](#15_Chapter06.xhtml_fig6_63）计算平均值和成功率。将单元格\
  \ `J4` 填充到第 502 行。在区域 `J2:L502` 创建表格以存储 500 次试验的结果。选择任意空白单元格作为**列输入单元格**。\n\n**6.8.1**\n\
  “项目持续时间”是一个随机变量。\n\n1. 估计该随机变量的均值和标准差。\n2. 为仿真生成的该变量 500 个值创建直方图，并确定哪种类型的密度函数（均匀分布、指数分布或正态分布）最适合模拟该随机变量。\n\
  \n\n\n\n\n### 6.8.2\n不要将每个任务的持续时间建模为区间 `[a]`、`[b]`上的连续随机变量，而是将其建模为离散变量，其取值为 `a`、`m`\
  \ 或 `b`，且每个具有一定的概率。例如，假设它等于 `a` 的概率为 0.25，`m` 的概率为 0.5，`b` 的概率为 0.25。修改练习 6.8.1\
