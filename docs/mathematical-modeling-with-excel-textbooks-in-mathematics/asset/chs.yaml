  \ 30 | 16 | 0.577 |\n\n### 3.4.10 变量选择方法\n\n我们在本节中介绍的在多元回归模型中选择最佳预测变量组合的方法，是尝试预测变量的所有可能组合，然后选择调整后\
  \ `R²` 值最高的组合。通常情况下，如果有 `n` 个预测变量，可能的组合数量为 `2^(n) - 1`。随着 `n` 的增加，这个数字会呈指数级增长，这使得在预测变量非常多时，该过程变得不可行。一种选择最佳组合的更智能的方法被称为\
  \ `前向逐步回归` (forward stepwise regression)。以下是一个简化的算法：\n\n1. 尝试所有单个预测变量。选择调整后 `R²`\
  \ 值最高的作为最佳。\n2. 尝试所有包含步骤 1 中最佳变量的两个预测变量的组合。选择调整后 `R²` 值最高的组合作为最佳。\n3. 尝试所有包含步骤 2\
  \ 中最佳对的三个预测变量的组合。选择调整后 `R²` 值最高的三元组作为最佳。\n4. 重复此过程直到没有更多组合可以尝试，或者添加另一个变量不再增加调整后\
  \ `R²` 值。\n\n下表给出了 12 个州的平均教师薪资以及六项教育相关的统计数据（数据由 Quinn Wragge 于 2019 年收集）。使用 `前向逐步回归`\
