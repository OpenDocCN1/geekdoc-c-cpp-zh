  3. `P(1 red and 1 blue)`\n\n# 6.5 随机数生成器\n\n在本节中，我们将研究计算机如何生成“随机”数字。随机数是所有计算机模拟的重要组成部分。*随机数列表*的简单定义是：它是一个数字列表，其中*没有*模式，且所有可能的数字出现频率相等。获取真正随机数字列表的唯一方法是通过机械手段（例如：笼子里滚动的编号球、投掷骰子等）。\n\
  \n计算机通过迭代函数生成随机数列表，其中一个输出变成下一次输入。初始输入称为*种子*（seed），它是任意的（通常根据算法开始时的时时间选择），每个输出都成为列表中的一个数字。\n\
  \n由于计算机使用确定性算法，数字列表*将会有*某种模式。因此，计算机永远无法生成真正的随机数列表。它们生成的随机数被称为*伪随机*（pseudorandom）数，该算法被称为*伪随机数生成器*。一个良好的伪随机数列表至少具有一个完全不明显的模式。\n\
  \nExcel 有一个名为 `RAND` 的内置伪随机数生成器，它可以生成 0 到 1 之间的数字。首先，我们创建一个由该函数生成的数字图表，以说明我们所说的“没有模式”。将一个空白工作表重命名为“Rand”，添加[图\
  \ 6.33]中的公式，并将第 2 行向下复制到第 501 行，形成包含 500 个伪随机数的列表。\n\n![fig6_33.jpg](img/fig6_33.jpg)\n\
  图 6.33\n\n创建一个如[图 6.34]所示的随机数与 *n* 的图表。多次按下 `F9` 以创建新的伪随机数列表。注意，图表没有显示伪随机数与其在序列中的位置之间的任何关系，而且没有哪个数字（或数字范围）出现的频率比其他任何数字高（即没有模式）。有许多类型的统计测试可以用来衡量数字列表的随机性。我们不会在这里讨论这些，但我们简单的图形分析表明，`RAND`\
  \ 创建了一个良好的伪随机数列表。\n\n![fig6_34.jpg](img/fig6_34.jpg)\n图 6.34\n\n由于伪随机数生成器构成了模拟和许多安全系统的核心，在开发和测试生成器方面已经进行了大量研究。这里我们介绍一些简单的生成器算法。\n\
  \n## 示例 6.5.1 (线性同余)\n\n该方法使用模运算来生成伪随机整数。选择三个整数 *a*、*b* 和 *m*，以及一个种子 `x[0]`。然后使用函数生成随机整数：\n\
  \n```\nx[n+1] = (a ⋅ x[n] + b) mod (m)\n```\n\n该方法将在重复（或*循环*）之前产生一个从 0 到 $m - 1$（包含在内）的最多\
  \ *m* 个整数的序列。由于由于原因，*m* 通常是一个非常大的整数，例如 $2^{32}$ 或 $2^{64}$。\n\n要使用 `a = 1`、`b =\
  \ 3`、`x[0] = 9` 和 `m = 8` 的值来实现此方法，将一个空白工作表重命名为“Linear”，并添加[图 6.35]中的公式。将第 6 行向下复制到第\
  \ 25 行，创建一个包含 20 个伪随机数的列表。\n\n![fig6_35.jpg](img/fig6_35.jpg)\n图 6.35\n\n[图 6.36]显示了\
  \ `a = 1` 和 `a = 3` 的伪随机数列表图。注意列表在 `n = 8` 和 `n = 4` 之后开始重复。这*不是*我们良好的伪随机数列表所想要的。\n\
  \n![fig6_36.jpg](img/fig6_36.jpg)\n图 6.36\n\n## 示例 6.5.2 (旧版 Excel 算法)\n\n该算法被旧版本\
