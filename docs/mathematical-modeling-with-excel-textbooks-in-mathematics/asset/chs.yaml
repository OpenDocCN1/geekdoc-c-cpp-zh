  \n模拟这个游戏以估计预期收益。\n\n### 6.2.12 假设反复抛掷均匀硬币。\n\n1. 估计观察到序列 HTH 的预期抛掷次数。对 HTT 和 HHH\
  \ 重复此操作。\n2. 现在假设硬币恰好抛掷了 300 次。估计观察到序列 HTH 的预期次数。对 HTT 和 HHH 重复此操作。\n\n## 6.3 三个著名问题](#06_Contents.xhtml_rsec6_3)\n\
  \n在本节中，我们将展示如何使用模拟。\n\n### 6.3.1 蒙提霍尔问题\n\n在本节中，我们将展示如何使用模拟来解决以下三个问题：*蒙提霍尔问题、生日问题、针问题*。参赛者面临的困境是是否切换。为了帮助做出决定，我们将使用模拟来估计以下两个概率：\n\
  \n1. 切换获胜概率\n2. 不切换的获胜概率\n\n估计这些概率的关键在于意识到，如果不切换，只有在最初选中的情况下才会获胜真正的奖品。\n\n**算法**\n\
  \n1. 随机指定带有真实奖品的门。\n2. 随机选择一个门。\n3. 确定如果切换是否获得真实奖品。\n4. 确定如果不切换是否获得真实奖品。\n5. 重复\
  \ 1000 次试验。\n6. 计算 $P(\\text{win if switch}) \\approx \\frac{\\text{切换时的获胜次数}}{\\\
  text{试验次数}}$。\n7. 计算 $P(\\text{win if don't switch}) \\approx \\frac{\\text{不切换时的获胜次数}}{\\\
  text{试验次数}}$。\n\n将一个空白工作表重名为“**Monty**”并按照图 6.18 进行格式设置。将第 8 行向下复制到第 1007 行以执行 1000\
  \ 次试验。\n\n![fig6_18.jpg](img/fig6_18.jpg)\n\n图 6.18\n\n从模拟中看到切换的获胜概率为 2/3，不切换的获胜概率为\
  \ 1/3。因此参赛者应该切换。这并不能保证参赛者一定会赢，但如果切换，参赛者获胜概率是不切换时的两倍。□\n\n### 6.3.2 生日问题\n\n在一个有\
  \ *n* 个学生的班级中，至少有两个学生共享同一个生日（月份和日期）的概率是多少？这个著名的难题被称为*生日问题*。我们假设生日在全年均匀分布（即任何一天作为生日的概率都与其他任何一天相等），且我们忽略了闰年。\n\
  \n**算法**\n\n1. 为班级的每个学生随机生成一个 1 到 365 之间的整数来表示生日（1 = 1 月 1 日，2 = 1 月 2 日，以此类推）。\n\
  2. 对于一年的每一天，统计班级中在该天为生日的学生人数。\n3. 判断是否至少有两个学生共享同一个生日。这被视为一次成功。\n4. 重复 200 次试验。\n\
  5. 确定成功的次数。\n\n\n\n\n\n## 6. 计算 $P\\left( \\text{至少有两人共享生日} \\right) \\approx \\\
  frac{\\text{成功次数}}{\\text{试验次数}}$。\n\n要实现此算法，请遵循以下步骤：\n\n1.  将一个空白工作表重命名为 `Birthday`，并按照图\
  \ 6.19 所示进行格式设置。将第 3 行复制到第 102 行，以模拟一个多达 100 名学生的班级。\n2.  添加图 6.20 中的公式，并将第 4 行复制到第\
  \ 367 行。这些公式计算了每年每一天有生日的学生人数，并判断该试验是否成功。\n3.  添加图 6.21 中的公式，以建立一个表格来存储 200 次实验的结果并计算估计的概率。将第\
  \ 6 行复制到第 204 行。在区域 `G4:H204` 中创建一个表格以存储 200 次实验的结果。选择 `F1` 作为列输入单元格。按 `F9` 重复模拟几次。注意，对于一个\
  \ 23 名学生的班级，模拟给出的概率约为 0.50。\n\n![fig6_19.jpg](img/fig6_19.jpg)\n图 6.19\n\n![fig6_20.jpg](img/fig6_20.jpg)\n\
  图 6.20\n\n![fig6_21.jpg](img/fig6_21.jpg)\n图 6.21\n\n使用模拟的好处是我们可以很容易地修改它来估计更复杂的概率。例如，如果我们想估计在一个\
  \ 50 名学生的班级中至少有 3 名学生共享生日的概率，我们只需将“# Students”的值更改为 50，并修改公式以判断试验是否成功，如图 6.22 所示。\n\
  \n![fig6_22.jpg](img/fig6_22.jpg)\n图 6.22\n\n### 示例 6.3.3 (布丰针问题)\n\n该问题的一个版本由法国自然学家和数学家布丰伯爵（Comte\
  \ de Buffon, 1707-1788）首次解决。假设我们在木地板上随机丢下一根长度为 `L` $\\le$ 1 的针，木板之间的接缝间隔为 1 个。求针“击中”或交于其中一个缝隙的概率。\n\
  \n让 `x` 表示针的中点到木板间最近缝隙的距离，`θ` 表示如图 6.23 所示的角。注意 0 $\\le$ `x` $\\le$ 0.5 且 0 $\\\
  le$ `θ` $\\le$ $\\pi$/2。\n\n![fig6_23.jpg](img/fig6_23.jpg)\n图 6.23\n\n为了判断针是否与缝隙交，观察发现这只有当图\
  \ 6.23 中直角三角形的斜边小于 `L`/2 时才会发生（如果针没有与缝隙交，则针必须被“延伸”以形成三角形，使得斜边大于 `L`/2）。如果 `h` 表示斜边的长度，那么根据三角函数，我们得到：\n\
  \n$$\\cos\\;\\theta = \\frac{x}{h}\\quad\\Rightarrow\\quad h = \\frac{x}{\\cos\\\
  ;\\theta}.$$\n\n因此，当 `x`/cos`θ` < `L`/2 时，针与缝隙相交。\n\n#### 算法\n\n1.  随机生成一个 0 到 0.5\
  \ 之间的数字 `x`。\n2.  随机生成一个 0 到 $\\pi$/2 之间的数字 `θ`。\n3.  计算 `h` = `x`/cos`θ`。\n4. \
  \ 判断 `h` $\\le$ `L`/2。如果为真，则该试验成功。\n5.  重复 1000 次试验。\n6.  计算 $P\\left( \\text{交于缝隙}\
  \ \\right) \\approx \\frac{\\text{成功次数}}{\\text{试验次数}}$。\n\n将一个空白工作表重命名为 `Buffon`，并按照图\
  \ 6.24 所示进行格式设置。调整 `L` 的值并观察随着 `L` 变小，概率也之变小。\n\n![fig6_24.jpg](img/fig6_24.jpg)\n\
  图 6.24\n\n### 习题\n\n**6.3.1** 考虑蒙霍尔问题。\n\n1.  在模拟中，“选中的门”是随机的。如果参赛者总是选择 1 号门呢？这会改变获胜概率吗？如果总是选择\
  \ 2 号或 3 号门呢？\n2.  考虑以下策略：\n    初始始终选择 1 号门。如果打开了 2 号门，则切换。否则不切换。\n    创建一个模拟，估计如果每次都使用这种策略的获胜概率。假设奖品在\
  \ 1 号门后面。\n\n**6.3.2** 考虑蒙霍尔问题的推广，有 *N* 扇门，其中一个门里有奖品。假设游戏按如下方式进行：\n\n1.  参赛者总是选择\
  \ 1 号门。\n2.  如果奖品不在 1 号门，则打开 2 号门。在这种情况下，如果参赛者切换，则在 3 到 *N* 之间随机选择一个门。\n3.  设计一个模拟允许用户输入\
  \ *N* 的值并自动计算结果。\n\n1.  创建一个表格，给出 *N* 在 2 到 25 之间时切换和不切换的概率。\n2.  随着 *N* 增大，概率之间的差异发生了什么变化？参赛者切换真的重要吗？\n\
  \n**6.3.3** 考虑生日问题，让 `P[n]` 表示在一个有 *n* 名学生的班级中，至少有 2 人共享生日的概率。可以证明 `P[n]` 满足以下递归关系：\n\
  \n$$P_{n} = 1 - \\left( 1 - P_{n - 1} \\right) \\cdot \\frac{N - (n - 1)}{N}$$\n\
