  \n\n\n### 2.3.15\n当一杯热咖啡放在桌子上时，它起初的冷却速度非常快。随着温度的降低，它的冷却速度就不再那么快了。这表明存在一种比例关系。牛顿冷却定律指出，一个热物体（如一杯热咖啡）的冷却速率与环境温度与物体温度之差成正比（假设环境温度保持不变）。为物体的温度和环境温度定义变量，并建立一个微分方程对牛顿冷却定律进行建模（无需求解该方程）。\n\
