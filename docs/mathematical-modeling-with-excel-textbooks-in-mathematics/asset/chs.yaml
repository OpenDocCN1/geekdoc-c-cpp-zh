  ## 6. 模拟\n\n## 章节目标\n* 定义并阐述模型模型\n* 讨论生成伪随机数的方法\n* 使用密度函数对随机事件进行建模\n* 使用模拟模型对各种场景进行建模\n\
  \n## 6.1 引言\n\n数学建模的核心在于描述系统（系统是一组共同运行的组件集合）。系统通分为大类：`Deterministic`（确定性）和 `Probabilistic`（概率性）。确定性系统是指一旦参数设定，其行为就是确定的系统；概率性系统的行为在程度上是由随机事件决定的。同样，模型也可以分为这两类。\n\
  \n确定性系统的一个例子是区间 `[a, b]` 上曲线 `y` = `f(x)` 下的面积。该系统的参数是函数 `f(x)` 和区间 `[a, b]`。一旦设定这些参数，面积就确定了。没有其他因素影响它。我们可以使用初微积分中的确定性模型对该系统进行建模：\n\
  \n$$\\text{Area} = \\int\\limits_{a}^{b}{f(x)\\; dx}$$\n\n大多数现实系统都是概率性的。现实系统不可避免地涉及某种随机事件。概率性系统的建模更为困难，因此我们通常将它们视为确定性系统来处理，并创建一个确定性模型。到本书为止，我们创建的每一个现实系统模型都是确定性的。\n\
  \n在本章中，我们将介绍一种非常常见的概率模型类型——`simulation`（模拟）。总而言之，`simulation` 是任何使用随机数的模型。模拟通常用于模仿某种现实世界的行为，但事实并不一定总是如此。\n\
  \n人们构建模拟模型有许多原因：\n\n1. **系统过于复杂，无法通过解析分析法进行建模**。考虑一个军事空运运输网络。该系统由许多组件组成，包括不同类型的飞机、机场的停机位、机场燃料供应、不同类型的货物等。要构建一个包含所有这些组件的分析模型似乎是不可能的。这需要大量的简化，导致模型保真度极低。\n\
  2. **收集数据以创建经验模型可能很困难、昂贵或危险**。考虑医院的急诊室。如果我们对根据在职医生人数来对患者等待时间进行建模感兴趣，我们可以每周改变医生人数，收集等待时间的数据并构建一个经验模型。这种方法无疑会花费大量时间，并可能导致患者死亡。更实用的方法是在计算机上模拟急诊室的行为，并在模拟中改变医生人数。\n\
  3. **系统可能还不存在**。考虑正在设计图纸上的飞机。如果我们想研究机身的阻力，我们无法去飞行它并收集数据，因为它还不存在！我们可以根据其设计，使用计算机模拟它的行为。\n\
  4. **系统可能包含我们不希望过度简化的随机事件**。考虑超市的结账队列，客户平均每分钟到达 2 人，而收银员平均每分钟可以服务 3 个客户。如果我们想对客户的等待时间进行建模，可能会于认为他们完全不需要等待，因为服务率大于到达率。这是一种极大的简化。相反，我们将模拟客户的到达和服务过程，并分析等待时间。\n\
  \n在本章中，我们关注 `Monte Carlo Simulations`（蒙特卡洛模拟）。这些模拟之所以得名，是因为它们经常用于研究机会游戏（如在蒙特卡罗玩的游戏）。这些模拟由三个基本步骤组成：\n\
  \n1. 构建一个使用随机数的模型。\n2. 使用不同的随机数每次对模型进行多次评估或“运行”（可能几百或数千次）。\n3. 对结果进行统计分析。\n\n使用模拟研究现实世界行为的一个优势是，它允许建模者以极低的成本测试“假设”（what–if）场景。例如，在医院急诊室的模拟中，我们可以轻松改变在职医生或护士人数并观察结果。我们可以在几分钟内以极低的成本且对任何人都没有危险，模拟几个几年的时间。\n\
  \n在本章中，我们介绍了各种常见的模拟模型类型，并讨论了与模拟模型构建的一些重要课题。\n\n## 6.2 示例\n\n在本节中，我们通过三个不同的示例来说明涉及蒙特卡洛模拟的一些基本概念。\n\
  \n### 示例 6.2.1（抛硬币）\n\n在这里我们近似抛掷 10 次硬币时至少出现 7 次反面的概率。在初等概率论的术语中，抛掷 10 次硬币是一个 `random\
  \ experiment`（随机实验），至少出现 7 次反面是一个 `event`（事件）。估计事件概率的一种方法是多次进行随机实验，每次实验称为一次 `trial`（试验），并统计事件发生的次数，称为\
  \ `number of successes`（成功次数）。我们然后计算\n\n$$\\text{P(event)} \\approx \\frac{\\text{Number\
  \ of successes}}{\\text{Total trials}}.$$\n\n**算法**\n1. 模拟 10 次随机抛掷硬币，并确定得到的反面数量。这就是一次\
  \ `trial`。\n2. 重复 1000 次 `trials`。\n3. 计算获得至少 7 次反面的试验次数。这就是 `number of successes`。\n\
  4. 计算 $\\text{P(least 7 tails)} \\approx \\frac{\\text{Number of successes}}{1000}$。\n\
  \n要实施这一点，请按照以下步骤操作：\n1. 将空白工作表重命名为“**Coins**”。按照图 6.1 所示格式设置工作表。B2 公式将概率选择 0 和 1\
  \ 之间的整数。输出 1 表示反面，0 表示正面。将 B2 中的公式复制到区域 B2:K3，然后将第 3 行向下复制到 1001 行。（注意：如果 Excel\
  \ 在 B2 返回 #NAME? 错误，请安装并加载 Analysis ToolPak 插件。）\n2. 添加图 6.2 所示的公式以计算至少 7 次反面的试验次数和概率。多次按下\
  \ `F9` 键以重复这 1000 次试验。注意，每次按下 `F9` 时，你可能会得到不同的 *P*(至少 7 次反面) 的估计值。这说明这种模拟只能给出真实\
  \ *theoretical*（理论）概率的近似值。\n\n这种模拟的这种益处处是，我们可以轻松地修改它来考虑不同的假设场景。例如，如果我们使用*不均匀*硬币，单次抛掷反面的概率不是\
  \ 0.5 会怎样？添加图 6.3 中的单元格以存储单次抛掷反面的概率。\n\n接下来，如图 6.4 所示修改单元格 B2 中的公式，并将 B2 复制到区域 B2:K1001。现在我们可以轻松地将\
  \ *P*(tail) 设置为 0 到 1 之间的任何值，并估计 *P*(至少 7 次反面)。\n\n\n\n\n\n![fig6_4.jpg](img/fig6_4.jpg)\n\
  \n### 图 6.4\n\n接下来，我们创建一个表格，用于存储不同 *P*(反面) 值下 *P*（至少 7 次反面）的估计值。根据图 6.5 中的公式开始设置此表格。将第\
  \ 4 行向下复制到第 23 行，以计算从 0 到 1 之间步长为 0.05 的 *P*(反面) 值。\n\n![fig6_5.jpg](img/fig6_5.jpg)\n\
