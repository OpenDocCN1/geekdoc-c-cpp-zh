  \ 元。我们想知道现在需要存多少钱才不会用光。\n\n为了回答这个问题，我们将分析一个更通用的问题：相对于初始存款，账户金额会发生什么？首先我们构建模型。账户金额每年复利增长\
  \ 5%，但我们每年要提取 2000 元。描述这一场景的动力模型为：\n\n`a`[`n` + 1] = 1.05`a`[`n]` − 2000。\n\n与之前一样，`a`[`n]`\
  \ 是年底的账户金额。我们还假设每年提取没有罚金，并且我们在上一年利息加入后提取资金。该系统是 `affine`（仿）动力系统的例子。\n\n**定义 4.2.1**（仿离散动力系统）。`affine\
  \ discrete dynamical system`（仿离散动力系统）是一个数字序列 {a`[`n]` | `n` = 0, 1,…}，由如下形式的关系描述：\n\
  \n`a`[`n` + 1] = `b`**`a`[`n]` + `m`\n\n其中 `b` ≠ 0。\n\n任何动力系统长期行为分析的核心都是 `equilibrium\
  \ values`（平衡值，也称为 `fixed points*`）。\n\n\n\n\n\n### 定义 4.2.2 (平衡值)\n\n一个数字 `a` 被称为动力系统\
  \ `a[n+1] = f(a[n])` 的一个*平衡值*，如果当 `a[0] = a` 时，对于所有的 `n` 都有 `a[n] = a`。\n\n寻找平衡值时请注意，如果\
  \ `a` 是平衡值，我们必须满足：\n\n`a[n+1] = a[n] = a ⇒ f(a) = a`\n\n因此，寻找平衡值只需要求解方程 `f (a) =\
  \ a`。对于仿射系统，我们有：\n\n$$a = ba + m\\quad\\Rightarrow\\quad a = \\frac{m}{1 - b}$$\n\
  \n在这个例子中，`b = 1.05`，`m = −2000`，所以平衡值为 $a = \\frac{- 2000}{1 - 1.05} = 40,000$。因此，如果我们在账户中存入\
  \ 40,000 美，并在每年年底提取 2,000 美，那么每年年底账户中的金额将始终保持不变。\n\n### 示例 4.2.2 (储蓄账户)\n\n我们将采用图形方法来分析当初始值不是\
  \ 40,000 美元的平衡值时会发生的情况。\n\n1. 将空白工作表重命名为“**储蓄**”，并按照图 4.4 所示进行格式设置。将范围 `A3:B3` 复制到第\
  \ 27 行，模拟前 25 年的账户情况。\n\n    ![fig4_4.jpg](img/fig4_4.jpg)\n\n    图 4.4\n\n2. 使用\
  \ `A` 列和 `B` 列的数据形成如图 4.5 所示的图表。将 y 轴最小值和最大值分别设置为 0 和 80,000，`x` 轴最小值和最大值分别设置为 0\
  \ 和 25。注意，正如预期的那样，如果我们从 40,000 美开始，账户中的金额不会发生变化。\n\n    ![fig4_5.jpg](img/fig4_5.jpg)\n\
  \n    图 4.5\n\n3. 接下来添加一个滚动条。将链接单元设置为 `B2`，最小值和最大值分别设置为 0 和 80,000。这将允许我们以 1 美元的增量，在\
  \ 0 到 80,000 美之间改变 `a[0]` 的值。\n\n4. 左右移动滚动条上的滑块，观察系统的长期行为如何变化。具体来说，当 `a[0]` 小于 40,000\
  \ 美时，账户金额最终会减少到 0；当 `a[0]` 大于 40,000 美时，金额将无限制增长。\n\n在示例 4.2.2 中，我们看到 `a[0]` 的微小变化会导致系统长期行为发生剧烈变化。在这种情况下，我们说该系统*对初始条件敏感的*。\n\
  \n同样请注意，如果 `a[0] ≠ 40,000`，系统要么趋于 0，要么无限制增长。40,000 这个平衡值是一个*不稳定的*或*排斥的*平衡的例子。\n\n\
