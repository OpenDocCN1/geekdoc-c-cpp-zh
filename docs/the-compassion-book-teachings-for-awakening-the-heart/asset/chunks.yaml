    # 从你自己开始，开启送与取的序列。


    ### 注释

    无论你感到什么痛苦，都吸入它，祝愿所有众生脱离它。无论你感到什么快乐，都将它送给他人。通过这种方式，我们个人的问题和快乐变成了理解众生痛苦与快乐的垫脚石。


    ![11](img/Chod_9780834840645_epub3_011_r1.jpg) ![11](img/Chod_9780834840645_epub3_011_r1.jpg)


    # 当世界充满邪恶时，将所有不幸转化为菩提之路。


    ### 注释

    无论生活中发生了什么问题，与其用通常的方式对它们做出反应，你不如将它们转化为菩提之路。无论生活中发生了什么问题，与其用通常的方式对它们做出反应，你不如将它们转化为菩提之路。


