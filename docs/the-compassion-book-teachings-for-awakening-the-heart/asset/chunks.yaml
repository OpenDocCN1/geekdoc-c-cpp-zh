    当你这样做时要及时察觉，并意识到这只会增加你的痛苦（以及别人的痛苦）。


    ![57](img/Chod_9780834840645_epub3_057_r1.jpg) ![57](img/Chod_9780834840645_epub3_057_r1.jpg)


    不要嫉妒。


    ## 注释


    在嫉妒之情尚微时处理它，否则当它来袭来时，你会被它卷走。


    ![58](img/Chod_9780834840645_epub3_058_r1.jpg) ![58](img/Chod_9780834840645_epub3_058_r1.jpg)


    不要轻率。


    ## 注释


    不要浪费你宝贵的时间。你永远不知道自己还有多久寿命。


    ![59](img/Chod_9780834840645_epub3_059_r1.jpg) ![59](img/Chod_9780834840645_epub3_059_r1.jpg)


    不要期待掌声。


    ## 注释


    不要指望你的善行能获得名誉。尽管去做吧！


    # 额外资源


    ### 圣堪拉出版社出版关于“转念”(Lojong)的书籍


    Chödrön, Pema. ***从当下开始：慈悲生活的指南 (Start Where You Are: A Guide to Compassionate
    Living).*** 波士顿。在这书中，我对每一句格语提供了更详细的注释，并教授了 `tonglen`（摄受）和基础坐禅。（可以使用书末的格语字母索引来找到你正在练习的格语。）


    Kongtrül, Jamgön. ***觉醒的大之路 (The Great Path of Awakening).*** Ken McLeod 译。这是《心修七次第》(The
    Seven Points of Mind Training)的译本，包含了十九世纪著名的西藏佛教大师蒋贡尊增鲁的注释。


    Trungpa, Chögyam. ***训练心灵与培养慈心 (Training the Mind and Cultivating Loving-Kindness).***
    在书中，西藏冥想大师秋吉中巴向西方人介绍了 `lojong`（转念）练习，对每一句格语提供了精妙的注释，并告诉我们这种练习如何帮助我们克服恐惧和自我中心。


