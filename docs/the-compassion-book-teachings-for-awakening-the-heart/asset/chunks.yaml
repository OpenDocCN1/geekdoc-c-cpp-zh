    # 修持五种力量，心要要。


    ## 注释

    五种力量是：

    1. `坚定的决心`：训练去敞开与放下；

    2. `熟练`：熟悉有助于你实现这一目标的修行（如 `tonglen` 相应心）；

    3. 你内在的`正念种子`：表现为对修行和觉醒的渴望；

    4. `自责`：这对于西方学生来说比较棘手，但是一项重要的修行：意识到自我的执着会让你受苦，并乐于自我反省、诚实，并看到自己卡在哪里；以及

    5. `愿力`：帮助减轻世间痛苦的愿望，并向自己表达这一意图。


    ![18](img/Chod_9780834840645_epub3_018_r1.jpg) ![18](img/Chod_9780834840645_epub3_018_r1.jpg)


    大乘关于死亡时意识出的教法就是五种力量：你如何处事非常重要。


    ## 注释

    当你临终时，修持五种力量（基于你在活着时对它们变得非常熟悉）。

    1. `坚定的决心`：当世界的幻象开始溶解时，敞开并放下。

    2. `熟练`：在一生中练习敞开与放下，这样在死亡时一切溶解，你就不会恐慌。

    3. `正念种子`：相信你天生具有放下和对他人的慈悲的能力。

    4. `自责`：意识到这种局限的身份并非稳固且正在消融，不要沉溺于试图阻止它崩塌。

    5. `愿力`：死亡时，愿在未来的所有生中都在老师面前度过，并尽力永远利益他人。


    ![19](img/Chod_9780834840645_epub3_019_r1.jpg) ![19](img/Chod_9780834840645_epub3_019_r1.jpg)


    # 万法在一点上达成一致。


    ## 注释

    整个佛教教法（法）都是关于减少一个人的自我中心和对自我的执着。这带给你和所有众生快乐。


    ![20](img/Chod_9780834840645_epub3_020_r1.jpg) ![20](img/Chod_9780834840645_epub3_020_r1.jpg)


    # 在两个证人中，以主要的为主。


    ## 注释

    关于你行为的两个证人是他人你自己。在这两者中，只有你真正确切知道发生了什么。所以要带着慈悲心观察自己，但不带任何自欺欺人。


    ![21](img/Chod_9780834840645_epub3_021_r1.jpg) ![21](img/Chod_9780834840645_epub3_021_r1.jpg)


    # 始终保持喜悦的心。


    ## 注释

    不断运用乐观，哪怕仅仅是因为你正处于这条灵道路上。对万物保持感恩之心，即使是困难的情绪，因为它们有唤醒你的潜力。


    ![22](img/Chod_9780834840645_epub3_022_r1.jpg) ![22](img/Chod_9780834840645_epub3_022_r1.jpg)


    # 如果即使在分心时也能修行，你就训练得很好。


    ## 注释

    如果你是一个优秀的马术手，心可以游离，但你不会掉下。同样，无论你遇到什么情况，如果你在冥想上训练良好，你就不会被情绪冲垮。相反，它们会振奋你，你的意识会增强。


    ![23](img/Chod_9780834840645_epub3_023_r1.jpg) ![23](img/Chod_9780834840645_epub3_023_r1.jpg)


    # 始终遵循三个基本原则。


    ## 注释

    三个基本原则是：

    1. `守持你许下的承诺`，如果你受了出依戒和菩萨戒。当我们受出依戒时，我们发愿皈依佛，作为敞开与放下的范例；皈依法（佛的教法），作为如何做到的指导；以及皈依僧（同样在这条路上的群体）。当我们受菩萨戒时，我们发愿觉醒以帮助他人也做到同样的事。

    2. `节制过分的行为`，或不参与有时被称为“菩萨表演主义”。

    3. 在困难和愉悦的情况下都`培养耐心`。


    ![24](img/Chod_9780834840645_epub3_024_r1.jpg) ![24](img/Chod_9780834840645_epub3_024_r1.jpg)


    # 改变你的态度，但保持自然。


    ## 注释

    处理你执着的、自大的态度，并在过程中保持放松。不要总是陷入自我中心的监狱，要向万物表达温柔。


    ![25](img/Chod_9780834840645_epub3_025_r1.jpg) ![25](img/Chod_9780834840645_epub3_025_r1.jpg)


    # 不要谈论残肢。


    ## 注释

    不要通过谈论他人的缺陷来提升自己。


    ![26](img/Chod_9780834840645_epub3_026_r1.jpg) ![26](img/Chod_9780834840645_epub3_026_r1.jpg)


    # 不要纠结他人。


    ## 注释

    不要纠结他人的弱点，要为自己的成就而傲慢。


    ![27](img/Chod_9780834840645_epub3_027_r1.jpg) ![27](img/Chod_9780834840645_epub3_027_r1.jpg)


    # 处理最大的烦恼。


    ## 注释

    洞察你最大的障碍——傲慢、攻击性、自贬等——并先处理这些。带着清明和慈悲这样做。


    ![28](img/Chod_9780834840645_epub3_028_r1.jpg) ![28](img/Chod_9780834840645_epub3_028_r1.jpg)


    # 放弃任何果实。


    ## 注释

    关键教法是留在当下。不要执着于你将成就什么以及未来的处境会变得多好。你现在所做的才是重要的。


    ![29](img/Chod_9780834840645_epub3_029_r1.jpg) ![29](img/Chod_9780834840645_epub3_029_r1.jpg)


    # 放弃毒食。


    ## 注释

    你可以利用这些口号来建立自我。例如，为了让别人赞美你而谈论他人的缺陷或诋他们。通过这种方式，旨在减少自我中心的慈悲教法会变成毒害你并欺骗他的腐质。


    ![30](img/Chod_9780834840645_epub3_030_r1.jpg) ![30](img/Chod_9780834840645_epub3_030_r1.jpg)


    # 不要如此容易。


    ## 注释

    不要对伤害你的人怀恨。


    ![31](img/Chod_9780834840645_epub3_031_r1.jpg) ![31](img/Chod_9780834840645_epub3_031_r1.jpg)


    # 不要诋毁他人。


    ## 注释

    你说坏别人，认为这会让你感到优越。这只会在你心中种下卑劣的种子，导致他人不信任你并让你痛苦。


    ![32](img/Chod_9780834840645_epub3_032_r1.jpg) ![32](img/Chod_9780834840645_epub3_032_r1.jpg)


    # 不要伏击。


    ## 注释

    不要等到你不喜欢的人虚弱时去击他们。这可能带来即时的满足，但从长远来看它会毒害你。


    ![33](img/Chod_9780834840645_epub3_033_r1.jpg) ![33](img/Chod_9780834840645_epub3_033_r1.jpg)


    # 不要让事情陷入痛苦境地。


    ## 注释

    不要羞辱人。


    ![34](img/Chod_9780834840645_epub3_034_r1.jpg) ![34](img/Chod_9780834840645_epub3_034_r1.jpg)


    # 不要把牛的担转到羊身上。


    ## 注释

    不要将你的负担转嫁给他人。对自己的事负责。


    ![35](img/Chod_9780834840645_epub3_035_r1.jpg) ![35](img/Chod_9780834840645_epub3_035_r1.jpg)


    # 不要带有心机这样做。


    ## 注释

    处理你执着的、自大的态度意味着带有私利的动机。这是一种狡猾的方法。例如，为了得到你想要的东西，你可能会暂时顶罪或帮助某人。


    ![37](img/Chod_9780834840645_epub3_037_r1.jpg) ![37](img/Chod_9780834840645_epub3_037_r1.jpg)


    # 不要把神变成魔。


