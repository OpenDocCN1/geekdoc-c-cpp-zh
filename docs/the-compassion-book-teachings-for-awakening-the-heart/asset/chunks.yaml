    # 观察未生觉照的本性。


    ### 注释

    观察你的心，观察仅仅是的觉知本身。“观察”并不意味着分析。它的意思是只是看着，看看是否有任何坚固的东西可以抓住。我们的心在不断地移动和变化。就看那里吧！


    ![4](img/Chod_9780834840645_epub3_004_r1.jpg) ![4](img/Chod_9780834840645_epub3_004_r1.jpg)


    # 即使是解药也要自我解放。


    ### 注释

    不要执着任何事情——甚至是“没有任何坚固的东西可以抓住”这种体悟。


    ![5](img/Chod_9780834840645_epub3_005_r1.jpg) ![5](img/Chod_9780834840645_epub3_005_r1.jpg)


    # 息于赖识的本性，即本质。


    ### 注释

    有一个息处，一个你永远可以回去的起点。你可以一直把你的心带回家，就在这里，此时此刻，在当下、不偏颇的觉照中休息。


    ![6](img/Chod_9780834840645_epub3_006_r1.jpg) ![6](img/Chod_9780834840645_epub3_006_r1.jpg)


    # 事后后，要做幻象的孩子。


    ### 注释

    当你结束坐禅时，如果事情变得沉重而坚固，请完全临场，并意识到一切实际上都是柔软的、开放的且可处理的。这是行动中的冥想指导，让你意识到不必感到幽闭恐惧，因为总有足够的房间，足够的空间。


    ![7](img/Chod_9780834840645_epub3_007_r1.jpg) ![7](img/Chod_9780834840645_epub3_007_r1.jpg)


    # 念与取应当交替练习。这两者应随呼吸。


    ### 注释

    这是一种名为`tonglen`（观送）的冥想练习指导。在这种练习中，你向他人送快乐，并吸入他人感受到的任何痛苦。你带着开放和慈悲的感觉吸入，并以同样的精神送出。人们需要帮助，通过这种练习，我们向他们延伸自己。


    ![8](img/Chod_9780834840645_epub3_008_r1.jpg) ![8](img/Chod_9780834840645_epub3_008_r1.jpg)


    # 三事、三毒与三德种。


    ### 注释

    三事是：朋友、敌人和中立者。三毒是：贪爱、嗔恨和愚痴。当你感到贪爱时，完全拥有它，并祝愿所有众生都能脱离它。当你感到攻击性或愚痴时，也同样做。通过这种方式，通常引起痛苦的——毒害我们和他人的东西——变成了慈悲与仁爱的种子，一种德的种子。


    ![9](img/Chod_9780834840645_epub3_009_r1.jpg) ![9](img/Chod_9780834840645_epub3_009_r1.jpg)


    # 在所有活动中，用口号进行训练。


    ### 注释

    在“现场”想起这些口号中的任何一个，都可以消融我们的自我中心主义和不友善。


    ![10](img/Chod_9780834840645_epub3_010_r1.jpg) ![10](img/Chod_9780834840645_epub3_010_r1.jpg)


    # 从你自己开始，开启送与取的序列。


    ### 注释

    无论你感到什么痛苦，都吸入它，祝愿所有众生脱离它。无论你感到什么快乐，都将它送给他人。通过这种方式，我们个人的问题和快乐变成了理解众生痛苦与快乐的垫脚石。


    ![11](img/Chod_9780834840645_epub3_011_r1.jpg) ![11](img/Chod_9780834840645_epub3_011_r1.jpg)


    # 当世界充满邪恶时，将所有不幸转化为菩提之路。


    ### 注释

    无论生活中发生了什么问题，与其用通常的方式对它们做出反应，你不如将它们转化为菩提之路。无论生活中发生了什么问题，与其用通常的方式对它们做出反应，你不如将它们转化为菩提之路。无论生活中发生了什么问题，与其用通常的方式对它们做出反应，你不如将它们转化为菩提之路。无论生活中发生了什么问题，与其用通常的方式对它们做出反应，你不如将它们转化为菩提之路。无论生活中发生了什么问题，与其用通常的方式对它们做出反应，你不如将它们转化为菩提之路。无论生活中发生了什么问题，与其用通常的方式对它们做出反应，你不如将它们转化为菩提之路。


    ![12](img/Chod_9780834840645_epub3_012_r1.jpg) ![12](img/Chod_9780834840645_epub3_012_r1.jpg)
