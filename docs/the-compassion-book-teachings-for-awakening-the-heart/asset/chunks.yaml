    # Practice the five strengths, The condensed heart instructions.


    ## COMMENT

    The five strengths are:

    1. `strong determination` to train in opening the heart and mind;

    2. `familiarization` with the practices (such as `tonglen`) that help you to do
    that;

    3. the `positive seed` that is within you, experienced as a yearning to practice
    and wake up;

    4. `reproach`, which is a tricky one for Western students but is an important
    practice: realizing that ego-clinging causes you to suffer, you delight in self-reflection,
    in honesty, and in seeing where you get stuck; and

    5. the `aspiration` to help alleviate suffering in this world, expressing that
    intention to yourself.


    ![18](OEBPS/images/Chod_9780834840645_epub3_018_r1.jpg) ![18](OEBPS/images/Chod_9780834840645_epub3_018_r1.jpg)


    The mahayana instruction for the ejection of consciousness at death Is the five
    strengths: how you conduct yourself is important.


    ## COMMENT

    When you are dying, practice the five strengths (based on becoming very familiar
    with them while you are alive).

    1. `Strong determination`: Open and let go when the appearances of this world
    start to dissolve.

    2. `Familiarization`: Practice opening and letting go throughout your life so
    you will not panic as everything dissolves at death.

    3. `The positive seed`: Trust that you have the innate ability to let go and to
    feel compassion for others.

    4. `Reproach`: Realizing that this limited identity isn’t solid and is dissolving,
    do not indulge in trying to keep it from falling apart.

    5. `Aspiration`: At death, aspire to spend all your future lives in the presence
    of your teachers and to do your best to benefit others forever.


    ![19](OEBPS/images/Chod_9780834840645_epub3_019_r1.jpg) ![19](OEBPS/images/Chod_9780834840645_epub3_019_r1.jpg)


    # All dharma agrees at one point.


    ## COMMENT

    The entire Buddhist teachings (dharma) are about lessening one’s self-absorption,
    one’s ego-clinging. This is what brings happiness to you and all beings.


    ![20](OEBPS/images/Chod_9780834840645_epub3_020_r1.jpg) ![20](OEBPS/images/Chod_9780834840645_epub3_020_r1.jpg)


    # Of the two witnesses, hold the principal one.


    ## COMMENT

    The two witnesses of what you do are others and yourself. Of these two, you are
    the only one who really knows exactly what is going on. So work with seeing yourself
    with compassion but without any self-deception.


    ![21](OEBPS/images/Chod_9780834840645_epub3_021_r1.jpg) ![21](OEBPS/images/Chod_9780834840645_epub3_021_r1.jpg)


    # Always maintain only a joyful mind.


    ## COMMENT

    Constantly apply cheerfulness, if for no other reason than because you are on
    this spiritual path. Have a sense of gratitude to everything, even difficult emotions,
    because of their potential to wake you up.


    ![22](OEBPS/images/Chod_9780834840645_epub3_022_r1.jpg) ![22](OEBPS/images/Chod_9780834840645_epub3_022_r1.jpg)


    # If you can practice even when distracted, you are well trained.


    ## COMMENT

    If you are a good horseback rider, your mind can wander but you don’t fall off
    your horse. In the same way, whatever circumstances you encounter, if you are
    well trained in meditation, you don’t get swept away by emotions. Instead they
    perk you up and your awareness increases.


    ![23](OEBPS/images/Chod_9780834840645_epub3_023_r1.jpg) ![23](OEBPS/images/Chod_9780834840645_epub3_023_r1.jpg)


    # Always abide by the three basic principles.


    ## COMMENT

    The three basic principles are:

    1. `Keeping the promises you made` if you took refuge vows and bodhisattva vows.
    When we take the refuge vow, we vow to take refuge in the Buddha, as an example
    of how to open and let go, the dharma (Buddha’s teachings) as instructions on
    how to do this, and the sangha, the community of those who are also on this path.
    When we take the bodhisattva vow, we vow to awaken in order to help others to
    do the same.

    2. `Refraining from outrageous conduct` or not engaging in what is sometimes called
    “bodhisattva exhibitionism.”

    3. `Developing patience` in both difficult an delightful situations.


    ![24](OEBPS/images/Chod_9780834840645_epub3_024_r1.jpg) ![24](OEBPS/images/Chod_9780834840645_epub3_024_r1.jpg)


    # Change your attitude, but remain natural.


    ## COMMENT

    Work on your caught-up, self-important attitude and remain relaxed in this process.
    Instead of always being caught in a prison of self-absorption, look out and express
    gentleness to all things. Then relax.


    ![25](OEBPS/images/Chod_9780834840645_epub3_025_r1.jpg) ![25](OEBPS/images/Chod_9780834840645_epub3_025_r1.jpg)


    # Don’t talk about injured limbs.


    ## COMMENT

    Don’t try to build yourself up by talking about other people’s defects.


    ![26](OEBPS/images/Chod_9780834840645_epub3_026_r1.jpg) ![26](OEBPS/images/Chod_9780834840645_epub3_026_r1.jpg)


    # Don’t ponder others.


    ## COMMENT

    Don’t ponder others’ weak points, becoming arrogant about your own accomplishments.


    ![27](OEBPS/images/Chod_9780834840645_epub3_027_r1.jpg) ![27](OEBPS/images/Chod_9780834840645_epub3_027_r1.jpg)


    # Work with the greatest defilements.


    ## COMMENT

    Gain insight into your greatest obstacles—pride, aggression, self-denigration,
    and so forth—and work with those first. Do this with clarity and compassion.


    ![28](OEBPS/images/Chod_9780834840645_epub3_028_r1.jpg) ![28](OEBPS/images/Chod_9780834840645_epub3_028_r1.jpg)


    # Abandon any hope of fruition.


    ## COMMENT

    The key instruction is to stay in the present. Don’t get caught up in hopes of
    what you’ll achieve and how good your situation will be some day in the future.
    What you do right now is what matters.


    ![29](OEBPS/images/Chod_9780834840645_epub3_029_r1.jpg) ![29](OEBPS/images/Chod_9780834840645_epub3_029_r1.jpg)


    # Abandon poisonous food.


    ## COMMENT

    You can use these slogans to build up your ego. For instance, you refrain from
    talking about others’ defects or maligning them but only so people will praise
    you. In this way, compassionate teachings designed to lessen your sense of self-centeredness
    become like rotten food that poisons you and deceives others.


    ![30](OEBPS/images/Chod_9780834840645_epub3_030_r1.jpg) ![30](OEBPS/images/Chod_9780834840645_epub3_030_r1.jpg)


    # Don’t be so predictable.


    ## COMMENT

    Do not hold a grudge against those who have done you wrong.


    ![31](OEBPS/images/Chod_9780834840645_epub3_031_r1.jpg) ![31](OEBPS/images/Chod_9780834840645_epub3_031_r1.jpg)


    # Don’t malign others.


    ## COMMENT

    You speak badly of others, thinking it will make you feel superior. This only
    sows seeds of meanness in your heart, causing others not to trust you and causing
    you to suffer.


    ![32](OEBPS/images/Chod_9780834840645_epub3_032_r1.jpg) ![32](OEBPS/images/Chod_9780834840645_epub3_032_r1.jpg)


    # Don’t wait in ambush.


    ## COMMENT

    Don’t wait for the moment when someone you don’t like is weak to let them have
    it. This may bring immediate satisfaction, but in the long run it poisons you.


    ![33](OEBPS/images/Chod_9780834840645_epub3_033_r1.jpg) ![33](OEBPS/images/Chod_9780834840645_epub3_033_r1.jpg)


    # Don’t bring things to a painful point.


    ## COMMENT

    Don’t humiliate people.


    ![34](OEBPS/images/Chod_9780834840645_epub3_034_r1.jpg) ![34](OEBPS/images/Chod_9780834840645_epub3_034_r1.jpg)


    # Don’t transfer the ox’s load to the cow.


    ## COMMENT

    Don’t transfer your load to someone else. Take responsibility for what is yours.


    ![35](OEBPS/images/Chod_9780834840645_epub3_035_r1.jpg) ![35](OEBPS/images/Chod_9780834840645_epub3_035_r1.jpg)


    # Don’t act with a twist.


    ## COMMENT

    Acting with a twist means having an ulterior motive of benefiting yourself. It’s
    the sneaky approach. For instance, in order to get what you want for yourself,
    you may temporarily take the blame for something or help someone out.


    ![37](OEBPS/images/Chod_9780834840645_epub3_037_r1.jpg) ![37](OEBPS/images/Chod_9780834840645_epub3_037_r1.jpg)


    # Don’t make gods into demons.

