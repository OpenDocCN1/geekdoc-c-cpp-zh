    # Examine the nature of unborn awareness.


    ### COMMENT

    Look at your mind, at just simple awareness itself. “Examine” doesn’t mean analyze.
    It means just looking and seeing if there is anything solid to hold on to. Our
    mind is constantly shifting and changing. Just look at that!


    ![4](OEBPS/images/Chod_9780834840645_epub3_004_r1.jpg) ![4](OEBPS/images/Chod_9780834840645_epub3_004_r1.jpg)


    # Self-liberate even the antidote.


    ### COMMENT

    Do not hang on to anything—even the realization that there’s nothing solid to
    hold on to.


    ![5](OEBPS/images/Chod_9780834840645_epub3_005_r1.jpg) ![5](OEBPS/images/Chod_9780834840645_epub3_005_r1.jpg)


    # Rest in the nature of alaya, the essence.


    ### COMMENT

    There is a resting place, a starting place that you can always return to. You
    can always bring your mind back home and rest right here, right now, in present,
    unbiased awareness.


    ![6](OEBPS/images/Chod_9780834840645_epub3_006_r1.jpg) ![6](OEBPS/images/Chod_9780834840645_epub3_006_r1.jpg)


    # In postmeditation, be a child of illusion.


    ### COMMENT

    When you finish sitting meditation, if things become heavy and solid, be fully
    present and realize that everything is actually pliable, open, and workable. This
    is instruction for meditation in action, realizing that you don’t have to feel
    claustrophobic because there is always lots of room, lots of space.


    ![7](OEBPS/images/Chod_9780834840645_epub3_007_r1.jpg) ![7](OEBPS/images/Chod_9780834840645_epub3_007_r1.jpg)


    # Sending and taking should be practiced alternately. These two should ride the
    breath.


    ### COMMENT

    This is instruction for a meditation practice called `tonglen`. In this practice
    you send out happiness to others and you take in any suffering that others feel.
    You take in with a sense of openness and compassion and you send out in the same
    spirit. People need help, and with this practice we extend ourselves to them.


    ![8](OEBPS/images/Chod_9780834840645_epub3_008_r1.jpg) ![8](OEBPS/images/Chod_9780834840645_epub3_008_r1.jpg)


    # Three objects, three poisons, and three seeds of virtue.


    ### COMMENT

    The three objects are: friends, enemies, and neutrals. The three poisons are:
    craving, aversion, and indifference. When you feel craving, you own it fully and
    wish that all beings could be free of it. When you feel aggression or indifference
    you do the same. In this way what usually causes suffering—what poisons us and
    others—becomes a seed of compassion and loving-kindness, a seed of virtue.


    ![9](OEBPS/images/Chod_9780834840645_epub3_009_r1.jpg) ![9](OEBPS/images/Chod_9780834840645_epub3_009_r1.jpg)


    # In all activities, train with slogans.


    ### COMMENT

    Recalling any of these slogans “on the spot” can dissolve our self-centeredness
    and unkindness.


    ![10](OEBPS/images/Chod_9780834840645_epub3_010_r1.jpg) ![10](OEBPS/images/Chod_9780834840645_epub3_010_r1.jpg)


    # Begin the sequence of sending and taking with yourself.


    ### COMMENT

    Whatever pain you feel, take it in, wishing for all beings to be free of it. Whatever
    pleasure you feel, send it out to others. In this way, our personal problems and
    delights become a stepping-stone for understanding the suffering and happiness
    of all beings.


    ![11](OEBPS/images/Chod_9780834840645_epub3_011_r1.jpg) ![11](OEBPS/images/Chod_9780834840645_epub3_011_r1.jpg)


    # When the world is filled with evil, Transform all mishaps into the path of bodhi.


    ### COMMENT

    Whatever problems occur in your life, instead of reacting to them in the usual
    way, you could transform them into the path of `bodhi`. That is to say, you could
    awaken your compassionate and open heart. Use the `tonglen` approach and breathe
    in the pain of the situation, wishing that all beings could be free of it. Then
    breathe out and send loving-kindness to all suffering.


    ![12](OEBPS/images/Chod_9780834840645_epub3_012_r1.jpg) ![12](OEBPS/images/Chod_9780834840645_epub3_012_r1.jpg)


    # Drive all blames into one.


    ### COMMENT

    This is advice on how to work with your fellow beings. Everyone is looking for
    someone to blame and therefore aggression and neurosis keep. Instead, pause and
    look at what’s happening with `you`. When you hold on so tightly to your view
    of what `they` did, you get hooked. Your own self-righteousness causes you to
    get worked up and to suffer. So work on cooling that reactivity rather than escalating
    it. This reduces suffering—yours and everyone else’s.


    ![13](OEBPS/images/Chod_9780834840645_epub3_013_r1.jpg) ![13](OEBPS/images/Chod_9780834840645_epub3_013_r1.jpg)


    # Be grateful to everyone.


    ### COMMENT

    Others will always show you exactly where you are. They say or do something and
    you automatically get into a familiar way of reacting—shutting down, speeding
    up, or getting worked up. When you react in the habitual way, with anger, greed,
    and so forth, it gives you a chance to see your patterns and work with them honestly
    and compassionately. Without others provoking you, you remain ignorant of your
    habits and cannot train them into the path of awakening.


    ![14](OEBPS/images/Chod_9780834840645_epub3_014_r1.jpg) ![14](OEBPS/images/Chod_9780834840645_epub3_014_r1.jpg)


    # Seeing confusion as the four kayas Is unsurpassable shunyata protection.


    ### COMMENT

    Through meditation practice you begin to realize that:

    1. Your thoughts have no birthplace, they just pop up of nowhere—that is called
    `dharmakaya`.

    2. Thoughts are nevertheless unceasing—this is `sambhogakaya`.

    3. They appear but are not solid—that is `nirmanakaya`.

    4. Putting that together, there is no birth, no dwelling, no cessation—this is
    `svabhavikaya`.


    This understanding gives the unsurpassable protection of what is called `shunyata`,
    or “complete openness.” There’s nothing solid to react to. You have made much
    ado about nothing!


    ![15](OEBPS/images/Chod_9780834840645_epub3_015_r1.jpg) ![15](OEBPS/images/Chod_9780834840645_epub3_015_r1.jpg)


    # Four practices are the best of methods.


    ### COMMENT

    The four practices are:

    1. `accumulating merit` through any actions or words that lessen self-absorption
    and thus create more space in your mind and heart,

    2. `laying down evil deeds` through honest and joyful self-reflection,

    3. `offering to the döns` by welcoming mishaps because they wake you up, and

    4. `offering to the dharmapalas` by expressing your gratitude to those who protect
    the teachings that help you and your fellow beings to wake up.


    Traditionally, a `dön` is a malevolent spirit, but it was explained by my teacher
    Chögyam Trungpa Rinpoche as a sudden wake-up call. Everything is going smoothly
    and suddenly something shocking happens.

    The `dharmapalas` are the protectors. They represent our basic awareness and manifest
    as outer situations that bring us back when we stray into unkindness and confusion
    of all kinds.


    ![16](OEBPS/images/Chod_9780834840645_epub3_016_r1.jpg) ![16](OEBPS/images/Chod_9780834840645_epub3_016_r1.jpg)


    # Whatever you meet unexpectedly, join with meditation.


    ### COMMENT

    The unexpected will stop your mind. Rest in that space. When thoughts start again,
    do `tonglen`, breathing in whatever pain you may feel, thinking that others also
    feel like this, and gradually becoming more and more willing to feel this pain
    with the wish that others won’t have to suffer. If it is a “good” shock, send
    out any joy you may feel, wishing for others to feel it also. Meeting the unexpected
    is also an opportunity to practice patience and nonaggression.


    ![17](OEBPS/images/Chod_9780834840645_epub3_017_r1.jpg) ![17](OEBPS/images/Chod_9780834840645_epub3_017_r1.jpg)

