    # 格语索引


    - 放弃任何收获的希望

    - 放弃毒食

    - 所有活动都应怀一念进行

    - 一切法在一点上达成一致

    - 始终遵循三项基本原则

    - 始终保持一颗喜悦的心

    - 始终对任何引起怨恨的事冥想

    - 对每个人保持感激

    - 从自己开始开始送与受的序列

    - 改变你的态度，但保持自然

    - 用一念纠正所有错误

    - 不要别扭地行动

    - 不要轻率

    - 不要嫉妒

    - 不要如此容易被预测

    - 不要被外部环境所动动

    - 不要让事情陷入痛苦的地步

    - 不要期待掌声

    - 不要将神变为魔

    - 不要诽他他人

    - 不要误解

    - 不要思虑他人

    - 不要将他人的痛苦作为你幸福的一部分

    - 不要谈论受伤的部位

    - 不要把牛的负担转嫁给牛

    - 不要试图成为快的

    - 不要摇摆

    - 不要埋伏

    - 不要沉溺于自我

    - 将所有责备归一

    - 检查未生觉性的本质

    - 首先，修习基础课程

    - 四种练习是最好的方法

    - 如果你在心不在焉时修习，说明你训练得很好

    - 在所有活动中，用格语修习

    - 在后修中，成为幻象之子

    - 保持这三者不二

    - 通过检查和分析来解脱自己

    - 大乘关于意识出的指导是五种力量：你的行止非常重要

    - 即使冒生命危险也要观察这两者

    - 这次的重点是

    - 先处理最大的恼随

    - 无论发生两者中的哪一个，都要忍耐

    - 承担三三因

    - 送与受应当交替修习

    - 将一切法视为梦幻

    - 将混乱视为四*身*是不可胜越的*空性*`

    - 自解脱毒药

    - 安住阿赖藏的本质中

    - 修习三难

    - 全心地修习

    - 在所有领域不偏颇地修习

    - 三缘、三毒与德性的种子

    - 两项活动：开始和结束时

    - 任何偶然遇到的事，都与冥想结合

    - 当世界充满邪恶时，将所有挫折转化为菩提之路`


