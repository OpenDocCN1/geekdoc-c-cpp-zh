- fmt: '

    # COMMENTARY


    Don’t use these teachings and practices to strengthen your self-absorption.


    ![38](OEBPS/images/Chod_9780834840645_epub3_038_r1.jpg) ![38](OEBPS/images/Chod_9780834840645_epub3_038_r1.jpg)


    Don’t seek others’ pain as the limbs of your own happiness.


    # COMMENTARY


    Don’t build your happiness on the suffering of others.


    ![39](OEBPS/images/Chod_9780834840645_epub3_039_r1.jpg) ![39](OEBPS/images/Chod_9780834840645_epub3_039_r1.jpg)


    All activities should be done with one intention.


    # COMMENTARY


    Whatever you are doing, take the attitude of wanting it directly or indirectly
    to benefit others. Take the attitude of wanting it to increase your experience
    of kinship with your fellow beings.


    ![40](OEBPS/images/Chod_9780834840645_epub3_040_r1.jpg) ![40](OEBPS/images/Chod_9780834840645_epub3_040_r1.jpg)


    Correct all wrongs with one intention.


    # COMMENTARY


    “Wrongs” here refers to difficult circumstances that we encounter. Our intention
    is to use these situations to develop compassion for all the beings who also suffer
    from difficulties and to aspire to breathe in their pain with the practice of
    `tonglen`.


    ![41](OEBPS/images/Chod_9780834840645_epub3_041_r1.jpg) ![41](OEBPS/images/Chod_9780834840645_epub3_041_r1.jpg)


    Two activities: one at the beginning, one at the end.


    # COMMENTARY


    In the morning when you wake up, you reflect on the day ahead and aspire to use
    it to keep a wide-open heart and mind. At the end of the day, before going to
    sleep, you think over what you have done. If you fulfilled your aspiration, even
    once, rejoice in that. If you went against your aspiration, rejoice that you are
    able to see what you did and are no longer living in ignorance. This way you will
    be inspired to go forward with increasing clarity, confidence, and compassion
    in the days that follow.


    ![42](OEBPS/images/Chod_9780834840645_epub3_042_r1.jpg) ![42](OEBPS/images/Chod_9780834840645_epub3_042_r1.jpg)


    Whichever of the two occurs, be patient.


    # COMMENTARY


    Whatever happens in your life, joyful or painful, do not be swept away by reactivity.
    Be patient with yourself and don’t lose your sense of perspective.


    ![43](OEBPS/images/Chod_9780834840645_epub3_043_r1.jpg) ![43](OEBPS/images/Chod_9780834840645_epub3_043_r1.jpg)


    Observe these two, even at the risk of your life.


    # COMMENTARY


    The “two” referred to here are:


    1. your refuge vows (to take refuge in that which is not based on ego-gratification
    but on the open, unbiased nature of the Buddha, the dharma, and the sangha) and

    2. your bodhisattva vows (to use your life to awaken in order to help all beings
    to do the same).


    ![44](OEBPS/images/Chod_9780834840645_epub3_044_r1.jpg) ![44](OEBPS/images/Chod_9780834840645_epub3_044_r1.jpg)


    Train in the three difficulties.


    # COMMENTARY


    The three difficulties (or the three difficult practices) are:


    1. to recognize your neurosis as neurosis,

    2. then to *not* do the habitual thing, but to do something different to interrupt
    the neurotic habit, and

    3. to make this practice a way of life.


    ![45](OEBPS/images/Chod_9780834840645_epub3_045_r1.jpg) ![45](OEBPS/images/Chod_9780834840645_epub3_045_r1.jpg)


    Take on the three principal causes.


    # COMMENTARY


    The three principal causes that allow us to put these teachings into practice
    are: a qualified teacher, a mind that turns toward awakening, and supportive circumstances.


    ![46](OEBPS/images/Chod_9780834840645_epub3_046_r1.jpg) ![46](OEBPS/images/Chod_9780834840645_epub3_046_r1.jpg)


    Pay heed that the three never wane.


    # COMMENTARY


    The “three” referred to here are: gratitude toward one’s teacher, appreciation
    of the teachings, and conduct that is based on your refuge and bodhisattva vows.
    With the refuge vow, one takes refuge in the Buddha as an example, the dharma
    (Buddha’s teachings) as instruction, and the sangha as the community of practitioners
    who wholeheartedly follow these. With the bodhisattva vow, one aspires to use
    one’s life to awaken in order to help all beings to do the same.


    ![47](OEBPS/images/Chod_9780834840645_epub3_047_r1.jpg) ![47](OEBPS/images/Chod_9780834840645_epub3_047_r1.jpg)


    Keep the three inseparable.


    # COMMENTARY


    The “three” referred to here are your body, speech, and mind. Your actions, speech,
    and thoughts should be inseparable from your mind (training your mind in compassion
    and wisdom).


    ![48](OEBPS/images/Chod_9780834840645_epub3_048_r1.jpg) ![48](OEBPS/images/Chod_9780834840645_epub3_048_r1.jpg)


    Train without bias in all areas. It is crucial to do this pervasively and wholeheartedly.


    # COMMENTARY


    It is important to include everyone and everything that you meet as part of your
    practice. They become the means by which you cultivate compassion and wisdom.


    ![49](OEBPS/images/Chod_9780834840645_epub3_049_r1.jpg) ![49](OEBPS/images/Chod_9780834840645_epub3_049_r1.jpg)


    Always meditate on whatever provokes resentment.


    # COMMENTARY


    Do `tonglen` practice whenever you feel resentment. Do it with small things all
    the time. Then you will be prepared to work with the big ones when they arise.


    ![50](OEBPS/images/Chod_9780834840645_epub3_050_r1.jpg) ![50](OEBPS/images/Chod_9780834840645_epub3_050_r1.jpg)


    Don’t be swayed by external circumstances.


    # COMMENTARY


    Whether you are sick or well, rich or poor, comfortable or uncomfortable, practice
    `tonglen`. Whatever is wanted, send that out for others to enjoy. Whatever is
    unwanted, breathe that in, experiencing it directly for yourself and all the others
    who are in the same boat.


    ![51](OEBPS/images/Chod_9780834840645_epub3_051_r1.jpg) ![51](OEBPS/images/Chod_9780834840645_epub3_051_r1.jpg)


    This time, practice the main points.


    # COMMENTARY


    In this very life do not waste the opportunity to practice the main points:


    1. Seeking to help others is more important than only looking out for yourself.

    2. Practicing what your teacher has taught you is more important than scholarly
    study.

    3. Awakening compassion (and thus lessening selfishness) is more important than
    any other spiritual practice.


    ![52](OEBPS/images/Chod_9780834840645_epub3_052_r1.jpg) ![52](OEBPS/images/Chod_9780834840645_epub3_052_r1.jpg)


    Don’t misinterpret.


    # COMMENTARY


    There are six teachings that you might misinterpret: patience, yearning, excitement,
    compassion, priorities, and joy. The misinterpretations are:


    1. You’re patient when it means you’ll get your way but not when your practice
    brings up challenges.

    2. You yearn for worldly things but not for an open heart and mind.

    3. You get excited about wealth and entertainment but not about your potential
    for enlightenment.

    4. You have compassion for those you like and admire but not for those you don’t.

    5. Worldly gain is your priority rather than cultivating loving-kindness and compassion.

    6. You feel joy when your enemies suffer, but you do not rejoice in others’ good
    fortune.


    ![53](OEBPS/images/Chod_9780834840645_epub3_053_r1.jpg) ![53](OEBPS/images/Chod_9780834840645_epub3_053_r1.jpg)


    Don’t vacillate.


    # COMMENTARY


    If you train in awakening compassion only some of the time, it will slow down
    the process of giving birth to certainty. Wholeheartedly train in keeping your
    heart and mind open to everyone.


    ![54](OEBPS/images/Chod_9780834840645_epub3_054_r1.jpg) ![54](OEBPS/images/Chod_9780834840645_epub3_054_r1.jpg)


    Train wholeheartedly.


    # COMMENTARY


    Train enthusiastically in strengthening your natural capacity for compassion and
    loving-kindness.


    ![55](OEBPS/images/Chod_9780834840645_epub3_055_r1.jpg) ![55](OEBPS/images/Chod_9780834840645_epub3_055_r1.jpg)


    Liberate yourself by examining and analyzing.


    # COMMENTARY


    Know your own mind with honesty and fearlessness. See what leads to more freedom
    and what leads to more suffering. This can liberate you from continually getting
    hooked by self-centered thoughts and emotions, the root of all dissatisfaction.


    ![56](OEBPS/images/Chod_9780834840645_epub3_056_r1.jpg) ![56](OEBPS/images/Chod_9780834840645_epub3_056_r1.jpg)


    Don’t wallow in self-pity.


    COMMENTARY

