    # 注释


    不要用这些教义和实践来强化你的自我中心主义。


    ![38](img/Chod_9780834840645_epub3_038_r1.jpg) ![38](img/Chod_9780834840645_epub3_038_r1.jpg)


    不要寻求他人的痛苦作为你快乐的来源。


    # 注释


    不要在人的痛苦之上建立你的快乐。


    ![39](img/Chod_9780834840645_epub3_039_r1.jpg) ![39](img/Chod_9780834840645_epub3_039_r1.jpg)


    所有的活动都应秉持一个意图。


    # 注释


    无论你在做什么，都要持有希望直接或间接地福及他人的态度。持有希望增加你与同众之间亲情体验的态度。


    ![40](img/Chod_9780834840645_epub3_040_r1.jpg) ![40](img/Chod_9780834840645_epub3_040_r1.jpg)


    一心纠正所有错误。


    # 注释


    这里的“错误”指的是我们所遇到的困难处境。我们的意图是利用这些情况培养对所有同样遭受困难困扰的众生的慈悲心，并渴望通过`tonglen`（相应）练习练习吸入他们的痛苦。


    ![41](img/Chod_9780834840645_epub3_041_r1.jpg) ![41](img/Chod_9780834840645_epub3_041_r1.jpg)


    两个活动：一个在开始，一个在结束。


    # 注释


    早上起床时，反思即将到来的一天，并渴望利用这一天保持开放的心态。在一天结束、入睡之前，思考你所做的一切。如果你实现了你的愿望，哪怕只有一次，也为此感到高兴。如果你违背了你的愿望，要为你能看到自己的所为且不再生活在无知中感到高兴。这样，你将在随后的日子里带着增长的清醒、信心和慈悲向前努力。


    ![42](img/Chod_9780834840645_epub3_042_r1.jpg) ![42](img/Chod_9780834840645_epub3_042_r1.jpg)


    无论发生哪一种，都要耐心。


    # 注释


    无论生命中发生了什么，无论是快乐还是痛苦，都不要被反应性带走。对自己保持耐心，不要失去你的视角。


    ![43](img/Chod_9780834840645_epub3_043_r1.jpg) ![43](img/Chod_9780834840645_epub3_043_r1.jpg)


    观察这两者，即使冒着生命的危险。


    # 注释


    这里指的“两者”是：


    1. 你的出世戒（皈依于不基于自我满足，而是基于佛、法、僧之开放、无偏的本性）以及

    2. 你的菩萨戒（利用你的生命去觉醒，以帮助所有众生也这样做）。


    ![44](img/Chod_9780834840645_epub3_044_r1.jpg) ![44](img/Chod_9780834840645_epub3_044_r1.jpg)


    在三重困难中训练。


    # 注释


    三重困难（或三种困难的练习）是：


    1. 识别出你的神经症倾向就是神经症，

    2. 然后*不*去做惯性的事情，而是做一些不同的事情来中断这种神经习惯，以及

    3. 使这种练习成为一种生活方式。


    ![45](img/Chod_9780834840645_epub3_045_r1.jpg) ![45](img/Chod_9780834840645_epub3_045_r1.jpg)


    承担三个主要原因。


    # 注释


    让我们能够将这些教义付诸实践三个主要原因是：合格的导师、转向向觉醒的心，以及支持性的环境。


    ![46](img/Chod_9780834840645_epub3_046_r1.jpg) ![46](img/Chod_9780834840645_epub3_046_r1.jpg)


    注意这三者永不衰。


    # 注释


    这里指的“三者”是：对老师的感恩、对教法的赞叹，以及基于你的皈依和菩萨戒的行为。通过皈依戒，人以佛为榜范，以法（佛的教法）为指导，以僧为全心遵循这些要求的修行者群体。通过菩萨戒，人渴望利用自己的生命去觉醒，以帮助所有众生也这样做。


    ![47](img/Chod_9780834840645_epub3_047_r1.jpg) ![47](img/Chod_9780834840645_epub3_047_r1.jpg)


    保持三者不可分割。


    # 注释


    这里指的“三者”是你的身、口、意。你的行为、言语和思想应该与你的心不可分割（在你的心中训练慈悲与智慧）。


    ![48](img/Chod_9780834840645_epub3_048_r1.jpg) ![48](img/Chod_9780834840645_epub3_048_r1.jpg)


    在所有领域中训练。


    # 注释


    这。你的行为、言语和思想应该与你的心不可分割（在你的心中训练慈悲与智慧）。


    ![49](img/Chod_9780834840645_epub3_049_r1.jpg) ![49](img/Chod_9780834840645_epub3_049_r1.jpg)


    无偏地训练。这三者。


    ![50](img/Chod_9780834840645_epub3_050_r1.jpg) ![50](img/Chod_9780834840645_epub3_050_r1.jpg)


    这种全心。练习培养慈悲与智慧。


    ![51](img/Chod_9780834840645_epub3_051_r1.jpg) ![51](img/Chod_9780834840645_epub3_051_r1.jpg)


    无偏地。这全心。


    ![52](img/Chod_9780834840645_epub3_052_r1.jpg) ![52](img/Chod_9780834840645_epub3_052_r1.jpg)


    这三者不可分割的。


    ![53](img/Chod_9780834840645_epub3_053_r1.jpg) ![53](img/Chod_9780834840645_epub3_053_r1.jpg)


    保持三者不可分割。


    ![54](img/Chod_9780834840645_epub3_054_r1.jpg) ![54](img/Chod_9780834840645_epub3_054_r1.jpg)


