    Catch yourself when you do this and recognize that it just increases your suffering
    (and that of others).


    ![57](OEBPS/images/Chod_9780834840645_epub3_057_r1.jpg) ![57](OEBPS/images/Chod_9780834840645_epub3_057_r1.jpg)


    Don’t be jealous.


    ## COMMENTARY


    Work with jealousy when it’s small, otherwise when it hits full force, you’ll
    be swept away.


    ![58](OEBPS/images/Chod_9780834840645_epub3_058_r1.jpg) ![58](OEBPS/images/Chod_9780834840645_epub3_058_r1.jpg)


    Don’t be frivolous.


    ## COMMENTARY


    Don’t waste your precious time. You never know how long you have.


    ![59](OEBPS/images/Chod_9780834840645_epub3_059_r1.jpg) ![59](OEBPS/images/Chod_9780834840645_epub3_059_r1.jpg)


    Don’t expect applause.


    ## COMMENTARY


    Don’t count on receiving credit for your good deeds. Just do them anyway!


    # ADDITIONAL RESOURCES


    ### Books about Lojong from Shambhala Publications


    Chödrön, Pema. ***Start Where You Are: A Guide to Compassionate Living.*** Boston.
    In this book I offer longer commentaries on each slogan, along with instruction
    in `tonglen` and basic sitting meditation. (Use the alphabetical index of slogans
    at the end of the book to find the slogan you’re working with.)


    Kongtrül, Jamgön. ***The Great Path of Awakening.*** Translated by Ken McLeod.
    This is a translation of *The Seven Points of Mind Training* featuring the commentary
    of Jamgön Kongtrül, a renowned nineteenth-century master of Tibetan Buddhism.


    Trungpa, Chögyam. ***Training the Mind and Cultivating Loving-Kindness.*** In
    this book Tibetan meditation master Chögyam Trungpa presents the practice of `lojong`
    to Westerners, offering wonderful commentary on each slogan and showing us how
    this practice can help us to overcome fear and self-centeredness.


