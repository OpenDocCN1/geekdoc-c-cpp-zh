    # INTRODUCTION


    # Training in Loving-Kindness and Compassion


    For many years, the fifty-nine slogans that are contained in this book have been
    the primary focus of my personal practice and teaching. These Tibetan Buddhist
    slogans (called `lojong`, or “mind-training” teachings) offer pithy, powerful
    reminders on how to awaken our hearts in the midst of day-to-day life, under any
    circumstances.


    The `lojong` teachings presented in this book come from a classical Tibetan text
    called *The Root Text of the Seven Points of Training the Mind* by Chekawa Yeshe
    Dorje. When I first read these slogans, I was struck by their unusual message:
    we can use everything we encounter in our lives—pleasant or painful—to awaken
    genuine, uncontrived compassion.


    The `lojong` teachings include a very supportive meditation practice called `tonglen`
    (“taking in and sending out”). This is a powerful practice designed to help ordinary
    people like ourselves connect with the openness and softness of our hearts. Included
    with this book is a downloadable audio program in which I offer in-depth instruction
    on `tonglen` practice. You can download the program at [www.shambhala.com/openingtheheart](http://www.shambhala.com/openingtheheart).


    The basic notion of `lojong` is that we can make friends with what we reject,
    what we see as “bad” in ourselves and in other people. At the same time, we could
    learn to be generous with what we cherish, what we see as “good.” If we begin
    to live in this way, something in us that may have been buried for a long time
    begins to ripen. Traditionally, this “something” is called `bodhichitta`, or “awakened
    heart.” It’s something that we already have but usually have not yet discovered.


    It’s as if we were poor, homeless, hungry, and cold, and although we didn’t know
    it, right under the ground where we always slept was a pot of gold. That gold
    is `bodhichitta`. Our confusion and misery come from not knowing that the gold
    is right here—and from always looking somewhere else. When we talk about joy,
    enlightenment, waking up, or awakening `bodhichitta`, all that means is that we
    know the gold is right here, and we realize that it’s been here all along.


    The basic message of the `lojong` teachings is that if it’s painful, you can learn
    to hold your seat and move closer to that pain. Reverse the usual pattern, which
    is to split, to escape. Go against the grain and hold your seat. `Lojong` introduces
    a different attitude toward unwanted..


    ## Working with Lojong Slogans


    The method I suggest is one that was recommended to me by teacher Chögyam Trungpa.


    1. Each morning, pick a slogan at random from the book.

    2. Read commentary on that slogan. (In addition to my own comments, you could
    consult additional commentaries. See the [Additional Resources](#Chod_9780834840645_epub3_src_r1.xhtml)
    section for recommendations.)

    3. Try to live by the meaning of that slogan throughout your day.


    Sometimes, over the course of a day, I forget the slogan I’ve selected. Usually,
    however, if something arises, the slogan of the day, or perhaps a different one,
    will come to mind and provide me with a perspective to become less reactive and
    see things more clearly. Even the most difficult of situations become more and
    more workable.


    I hope that slogan practice will help you, as it has helped me, to transform all
    circumstances into the path.


    # THE LOJONG SLOGANS WITH COMMENTARY


    ![1](OEBPS/images/Chod_9780834840645_epub3_001_r1.jpg) ![1](OEBPS/images/Chod_9780834840645_epub3_001_r1.jpg)


    ### First, train in the preliminaries.


    The preliminaries are also known as the four reminders. In your daily life, try
    to:


    1. Maintain an awareness of the preciousness of human life.

    2. Be aware of the reality that life ends; death comes for everyone.

    3. Recall that whatever you do, whether virtuous or not, has a result; what goes
    around comes around.

    4. Contemplate that as long as you are too focused on self-importance and too
    caught up in thinking how you are good or bad, you will suffer. Obsessing about
    getting what you want and avoiding what you don’t does not result in happiness.


    ![2](OEBPS/images/Chod_9780834840645_epub3_002_r1.jpg) ![2](OEBPS/images/Chod_9780834840645_epub3_002_r1.jpg)


    ### Regard all dharmas as dreams.


    Whatever you experience in your life—pain, pleasure, heat, cold, or anything else—is
    like something happening in a dream. Although you might think things are very
    solid, they are like passing memory. You can experience this open, unfixated quality
    in sitting meditation; all that arises in your mind—hate, love, and all the rest—is
    not solid. Although the experience can get extremely vivid, it is just a product
    of your mind. Nothing solid is really happening.

