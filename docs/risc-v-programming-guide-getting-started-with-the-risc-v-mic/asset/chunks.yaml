  trans: "\n\n时间与计数是嵌入式编程中的基础，它们使微控制器能够管理延迟、测量时长并控制基于时间的事件。在 `RISC-V` 微控制器中，这些操作对于生成\
    \ PWM 信号、控制电机、LED 闪烁以及创建精确的计时机制等任务至关重要。本章将介绍基础的时间计数函数、时间相关命令的语法以及它们在嵌入式项目中的应用。\n\
    \n## 章节目标\n\n- 理解嵌入式 C 语言编程中时间函数和计数循环的使用。\n- 学习如何实现延迟、计数事件并有效管理基于时间的操作。\n- 实现一个使用时间和计数来创建具有精确计时的\
    \ LED 闪烁序列的项目。\n\n## 规则\n\n- **避免阻塞式延迟**：在关键系统中使用非阻塞延迟方法，以避免减慢其他操作的速度。\n- **考虑定时器准确性**：对于需要精确计时的应用程序，请注意定时器的准确性。\n\
    - **优化时间密集型循环**：尽量减少时间循环内的复杂计算，以保持效率。\n- **使用硬件定时器提高准确性**：为了获得更准确的计时，考虑使用微控制器的硬件定时器。\n\
    \n## 时间与计数简介绍\n\nC 语言中的时间和计数函数帮助微控制器管理延迟并执行基于时间的任务。通过使用延迟循环和定时器，微控制器可以控制事件的持续时间、创建周期动作并测量经过的时间。常用的时间函数包括\
    \ `delay`、`millis` 以及随时间增加值的计数器。\n\n## 语法表\n\n| 序号 | 主题 | 语法 | 简单示例 |\n| :---\
    \ | :--- | :--- | :--- |\n| 1 | 延迟循环 | `for loop` | `for (i=0; i<delay; i++);`\
    \ |\n| 2 | 毫秒 | `millis()` | `unsigned long time = millis();` |\n| 3 | 硬件定时器 |\
    \ `timer_init()` | `timer_init(1000);` |\n| 4 | 事件计数器 | `counter++` | `eventCounter++;`\
    \ |\n| 5 | 延迟函数 | `delay(ms)` | `delay(1000);` |\n\n## 各命令详细解析\n\n### 1. 延迟循环\
    \ (for loop)\n\n### 什么是延迟循环？\n`for loop` 可以通过计数到特定数字来创建延迟，从而在不依赖硬件定时器的情况下创建软件延迟。\n\
    \n### 用途\n- 简单延迟：在嵌入式程序中实现基础延迟。\n- 非关键延迟：适用于对时间不敏感的应用程序。\n\n### 语法\n```c\nfor\
    \ (int i = 0; i < delay; i++);\n```\n\n### 语法解释\n- `i`: 计数变量，一直迭代直到达到 `delay`\
    \ 值。\n- `delay`: 代表循环迭代次数，控制延迟持续时间。\n\n### 简单代码示例\n```c\nfor (int i = 0; i < 100000;\
    \ i++);\n```\n\n### 代码示例解释\n- 通过计数到 100000 来创建延迟，短暂暂停程序执行。\n\n### 注意事项\n- 延迟持续时间是近似的，取决于时钟频率。\n\
    \n### 警告\n- 避免在关键区域内使用大延迟，以保持程序的响应性。\n\n### 2. 毫秒 (millis)\n\n### 什么是毫秒？\n`millis`\
    \ 函数返回自程序启动以来的毫秒数。它通常用于跟踪已过时间或调度周期性任务。\n\n### 用途\n- 事件调度：跟踪重复事件的时间。\n- 已过时间测量：测量事件之间的持续时间。\n\
    \n### 语法\n```c\nmillis();\n```\n\n### 语法解释\n- `millis()`：返回一个 `unsigned long`，表示自程序启动以来的毫秒数。\n\
    \n### 简单代码示例\n```c\nunsigned long startTime = millis();\n```\n\n### 代码示例解释\n-\
    \ 将当前时间存储在 `startTime` 中，以跟踪事件的开始。\n\n### 注意事项\n- `millis()` 在达到 `unsigned long`\
    \ 最大值后通常会溢出（滚动）。\n\n### 警告\n- 如果程序运行时间很久，请注意溢出问题。\n\n### 3. 硬件定时器 (timer_init)\n\
    \n### 什么是硬件定时器？\n`timer_init` 以指定的频率初始化硬件定时器，在不阻塞 CPU 的情况下提供准确的计时。硬件定时器对于 PWM、精确延迟和周期性中断至关重要。\n\
    \n### 用途\n- 准确的计时：生成精确的时间间隔。\n- 周期性动作：触发循环性动作，例如读取传感器。\n\n### 语法\n```c\ntimer_init(frequency);\n\
    ```\n\n### 语法解释\n- `frequency`: 设置定时器的频率，定义触发的频率。\n\n### 简单代码示例\n```c\ntimer_init(1000);\
    \ // 设置定时器为 1kHz\n```\n\n### 代码示例解释\n- 配置定时器在 1kHz 触发，适用于 1ms 的周期性任务。\n\n### 注意事项\n\
    - 硬件定时器独立运行，提供准确的计时。\n\n### 警告\n- 确保正确初始化定时器，以避免与其他进程冲突。\n\n### 4. 事件计数器 (counter++)\n\
    \n### 什么是事件计数器？\n`counter++` 语法增加计数器变量的值，通常用于计算事件或次数。\n\n### 用途\n- 事件计数：统计事件发生的次数。\n\
    - 循环控制：管理循环内的迭代次数。\n\n### 语法\n```c\ncounter++;\n```\n\n### 语法解释\n- `counter`:\
    \ 每次访问时都会加 1 的变量。\n\n### 简单代码示例\n```c\nint eventCounter = 0;\neventCounter++;\n\
    ```\n\n### 代码示例解释\n- 将 `eventCounter` 加 1，用于跟踪事件数量。\n\n### 注意事项\n- 计数器变量可以根据需要重置以重新计数。\n\
    \n### 警告\n- 选择合适的数据类型（如 `unsigned int`）以防止溢出。\n\n### 5. 延迟函数 (delay(ms))\n\n###\
    \ 什么是延迟函数？\n`delay` 函数通过暂停程序执行指定的毫秒数来实现工作。\n\n### 用途\n- 固定时长延迟：暂停程序执行指定的毫秒数。\n\
    - 时间控制：如 LED 闪烁频率。\n\n### 语法\n```c\ndelay(ms);\n```\n\n### 语法解释\n- `ms`: 毫秒数。\n\
    \n### 简单代码示例\n```c\ndelay(1000);\n```\n\n### 代码示例解释\n- 暂停程序执行 1 秒。\n\n### 注意事项\n\
    - 这种延迟会阻塞程序。\n\n***\n\n***\n\n## 相关项目\n\n### 项目名称\n具有精确计时的 LED 闪烁序列\n\n### 项目目标\n\
    在 `RISC-V` 微控制器上使用时间和计数函数创建 LED 闪烁序列。该项目演示了基础延迟函数、事件计数器和定时器。\n\n### RISC-V 开发环境\n\
    此项目将使用 `Visual Studio Code` 中的 `PlatformIO`。\n\n### RISC-V 微控制器\n我们将使用 `SiFive\
    \ High1 Rev B` 微控制器。\n\n### 要求组件\n- `SiFive High1 Rev B` 微控制器\n- 连接到 GPIO 引脚的\
    \ LED\n\n### 组件连接\n| 组件 | RISC-V 引脚 | 备注 |\n| :--- | :--- | :--- |\n| LED | GPIO\
    \ 2 | 控制 LED |\n\n### 连接分析\nLED 连接到 GPIO 引脚。使用时间函数，微控制器控制 LED 的闪烁间隔，创建一个具有精确计时模式的序列。\n\
    \n### 程序软件设置\n1. 打开 `Visual Studio Code` 并创建一个新的 `PlatformIO` 项目。\n2. 设置 LED 的\
    \ GPIO 引脚。\n3. 使用延迟、计数器和定时器实现闪烁序列。\n\n### 项目代码\n```c\n#include <stdint.h>\n#include\
    \ <stdio.h>\n\n#define LED_PIN 2 // LED 引脚\n#define BLINK_INTERVAL 1000 // 1 秒闪烁间隔\n\
    \nvoid setup() {\n    GPIO_DIR |= (1 << LED_PIN); // 设置 LED 引脚为输出\n}\n\nvoid blinkLED()\
    \ {\n    GPIO_OUT ^= (1 << LED_PIN); // 切换 LED 状态\n}\n\nint main() {\n    setup();\n\
    \    unsigned long previousMillis = 0;\n    while (1) {\n        unsigned long\
    \ currentMillis = millis();\n        // 检查是否超过了间隔\n        if (currentMillis -\
    \ previousMillis >= BLINK_INTERVAL) {\n            previousMillis = currentMillis;\
    \ // 更新之前的时间\n            blinkLED(); // 切换 LED 状态\n        }\n    }\n}\n```\n\
    \n保存并运行\n\n"
