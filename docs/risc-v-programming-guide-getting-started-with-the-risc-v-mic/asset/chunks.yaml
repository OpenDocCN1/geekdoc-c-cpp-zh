    * * *


    5\. Structure Declaration


    What is Structure Declaration?


    A structure declaration groups different data types under a single variable, allowing
    related data to be managed together. Structures are useful for creating custom
    data types in embedded programming.


    Use Purpose


    ● Organize Related Data: Structures hold different data types together, simplifying
    data management.


    ● Custom Data Types: Useful for representing complex data such as sensor data,
    where each field represents a specific characteristic.


    Syntax


    struct  {


    type member;


    } structName;


    Syntax Explanation


    ●      struct: Keyword for defining a structure.


    ●      type: Data type of the structure members.


    ●      member: Each data field within the structure.


    ●      structName: The name of the structure variable.


    Simple Code Example


    struct  SensorData  {


    int id;


    float reading;


    };


    Code Example Explanation


    ● Defines a structure  SensorData with an integer field  id and a float field  reading.


    Notes


    ● Structures can be nested and used as arrays, allowing for highly flexible data
    management.


    Warnings


