- fmt: "\n# 5. Wi-Fi Disconnect (wifi_disconnect)\n\n## What is Wi-Fi Disconnect?\n\
    `wifi_disconnect` ends the Wi-Fi connection, putting the device offline, which\
    \ can save power and improve security when the connection is no longer needed.\n\
    \n### Use Purpose\n- **Save Power**: Disconnects from the network to reduce power\
    \ consumption.\n- **Enhance Security**: Prevents unwanted access when network\
    \ access is not required.\n\n### Syntax\n```c\nwifi_disconnect();\n```\n\n###\
    \ Syntax Explanation\n- No parameters; disconnects the device from the Wi-Fi network.\n\
    \n### Simple Code Example\n```c\nwifi_disconnect();\n```\n\n### Code Example Explanation\n\
    - Disconnects from the Wi-Fi network, stopping all internet communication.\n\n\
    ### Notes\n- Ensure all required data transfers are complete before disconnecting.\n\
    \n### Warnings\n- Reconnecting after a disconnect may require reinitialization\
    \ in some systems.\n\n***\n\n## Relevant Project Section\n\n### Project Name\n\
    Wi-Fi Temperature Monitoring System\n\n### Project Goal\nUse Wi-Fi communication\
    \ on a RISC-V microcontroller to monitor temperature data from a sensor and transmit\
    \ it to a cloud server. This project demonstrates setting up Wi-Fi, connecting\
    \ to a network, and sending data to a server for remote monitoring.\n\n### RISC-V\
    \ Development Environment\nThis project will use PlatformIO in Visual Studio Code.\n\
    \n### RISC-V Microcontroller\nWe will use the SiFive HiFive1 Rev B microcontroller,\
    \ with an external Wi-Fi module connected via UART.\n\n### Requirement Components\n\
    - SiFive HiFive1 Rev B Microcontroller\n- Wi-Fi Module connected via UART\n- Analog\
    \ Temperature Sensor connected to an ADC pin\n- Cloud Server Endpoint for receiving\
    \ data\n\n### Component Connection Table\n| Component | RISC-V Pin | Additional\
    \ Notes |\n| :--- | :--- | :--- |\n| Wi-Fi Module | UART Pins | Connects to Wi-Fi\
    \ for cloud data upload |\n| Temperature Sensor | ADC Pin | Provides analog temperature\
    \ data |\n\n### Connection Analysis\nThe Wi-Fi module is configured for internet\
    \ access via a specified SSID and password. Temperature data from the sensor is\
    \ read and then uploaded periodically to a cloud server, enabling remote monitoring.\n\
    \n### Program Software Setup\n1. Open Visual Studio Code and create a new PlatformIO\
    \ project.\n2. Configure the UART interface for Wi-Fi communication and ADC for\
    \ temperature data.\n3. Implement code to initialize Wi-Fi, read temperature data,\
    \ and send it to a cloud server.\n\n### Project Code\n```c\n#include <stdint.h>\n\
    #include <stdio.h>\n\n#define ADC_PIN 0               // ADC channel for temperature\
    \ sensor\n#define SSID \"MyWiFiNetwork\"   // Wi-Fi SSID\n#define PASSWORD \"\
    mypassword\" // Wi-Fi password\n#define SERVER_URL \"http://example.com/api/upload\"\
    \n\nvoid setup()  {\n    ADC_INIT();                 // Initialize ADC\n    wifi_init(SSID,\
    \ PASSWORD);     // Initialize Wi-Fi with network credentials\n    wifi_connect();\
    \             // Connect to Wi-Fi network\n}\n\n// Function to read and convert\
    \ temperature data\nfloat readTemperature()  {\n    int adcValue = ADC_READ();\
    \               // Read ADC value\n    float voltage =  (adcValue /  1023.0) \
    \ *  3.3; // Convert to voltage\n    return voltage *  100;                  \
    \ // Convert voltage to temperature\n}\n\n// Function to send temperature data\
    \ to server\nvoid sendTemperature(float temperature)  {\n    char data[50];\n\
    \    sprintf(data,  \"{\\\"temperature\\\": %.2f}\", temperature);\n    http_post(SERVER_URL,\
    \ data);\n}\n\nint main()  {\n    setup();\n    while  (1)  {\n        float temperature\
    \ = readTemperature();  // Read temperature from sensor\n        sendTemperature(temperature);\
    \           // Send temperature over Wi-Fi\n        for  (volatile  int i =  0;\
    \ i <  1000000; i++);  // Simple delay for testing\n    }\n}\n```\n\n### Save\
    \ and Run\n1. Save, compile, and upload the code to the SiFive HiFive1 Rev B board\
    \ using PlatformIO.\n2. Monitor the server to see temperature data updates.\n\n\
    ### Check Output\n- Verify that the temperature data is uploaded to the server\
    \ as JSON, showing up periodically in the specified endpoint.\n"
