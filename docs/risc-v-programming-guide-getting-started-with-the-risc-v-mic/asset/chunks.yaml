    GPIO_DIR &=  ~(1  <<  3);


    Code Example Explanation


    ● Sets pin 3 as an INPUT, allowing it to receive and read signals from external
    devices, such as detecting a button press.


    Notes


    ● When reading button states, consider using a pull-up or pull-down resistor to
    avoid unreliable or floating input values.


    Warnings


    ● An input pin left unconnected or “floating” may pick up electrical noise, resulting
    in unpredictable readings.


    * * *


    3\. Write HIGH to Pin


    What is Writing HIGH to a Pin?


    Writing HIGH to a pin that is set as OUTPUT makes it supply a voltage level, typically
    equivalent to the microcontroller’s supply voltage (e.g., 3.3V or 5V). This can
    activate or turn on the connected device.


    Use Purpose


    ● Turn ON External Devices: Sets connected devices, such as LEDs or relays, to
    an active state.


    ● Signal HIGH in Digital Communication: Used to represent a HIGH signal in digital
    applications.


    Syntax


    GPIO_OUT |=  (1  << PIN);


    Syntax Explanation


    ● GPIO_OUT: Register for controlling the output state of GPIO pins. Each bit corresponds
    to a specific pin; setting the bit to 1 makes the pin HIGH, and setting it to
    0 makes it LOW.


    ● |=: The OR-assignment operator, which modifies only the bit for the specified
    pin, allowing other bits in  GPIO_OUT to remain unchanged.


    ● (1 << PIN): Shifts 1 to the left by the specified number of positions, aligning
    it with the bit for the desired pin. For example,  (1 << 2) would set pin 2 in  GPIO_OUT
    to HIGH.


    Simple Code Example


    GPIO_OUT |=  (1  <<  2);


    Code Example Explanation


    ● Sets pin 2 to HIGH, applying a voltage to the pin and potentially turning on
    a connected device, such as an LED.


    Notes


    ● Ensure that the pin is configured as OUTPUT before writing a HIGH signal to
    avoid potential issues.


    Warnings


    ● If a connected device draws too much current, it may damage the pin. Check the
    current ratings for safe operation.


    * * *


    4\. Write LOW to Pin


    What is Writing LOW to a Pin?


    Writing LOW to an output-configured pin pulls it to ground (0V), deactivating
    connected devices such as LEDs or relays.


    Use Purpose


    ● Turn OFF External Devices: Pulling a pin to LOW turns off devices, like setting
    an LED to off.


    ● Signal LOW in Digital Communication: Represents a LOW or 0 signal in digital
    systems.


    Syntax


    GPIO_OUT &=  ~(1  << PIN);


    Syntax Explanation


    ●      GPIO_OUT: The register controlling the output state of GPIO pins.


    ● &=: The AND-assignment operator, used to clear (set to 0) the bit associated
    with the pin.


    ● ~(1 << PIN): Shifts 1 to the left by the specified number of positions to match
    the pin, then inverts the result. For example,  ~(1 << 2) results in  0b11111011,
    clearing the 2nd bit in  GPIO_OUT and setting it LOW.


    Simple Code Example


    GPIO_OUT &=  ~(1  <<  2);


    Code Example Explanation


    ● Sets pin 2 to LOW, deactivating any connected device, such as turning off an
    LED.


    Notes


    ● To prevent unnecessary flickering or rapid switching, add delays between HIGH
    and LOW signals.


    Warnings'
