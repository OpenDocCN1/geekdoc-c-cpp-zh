  trans: "\n\n# 1. 局部变量\n\n- **临时数据存储**: 存储仅在特定函数所需的数值。\n- **避免内存浪费**: 局部变量仅在函数执行期间占用内存。\n\
    \n## 语法\n```c\ntype varName;\n```\n\n## 语法解释\n- `type`: 指定变量的数据类型，例如 `int`、`float`\
    \ 或 `char`。\n- `varName`: 变量名，仅在声明它的函数内部可见。\n\n## 简单代码示例\n```c\nvoid calculate()\
    \  {\n    int result =  0;  // 局部变量\n}\n```\n\n## 代码示例解释\n- 在 `calculate` 函数内部声明了一个局部整数变量\
    \ `result`，它只能在该函数内部访问。\n\n## 注意事项\n- 局部变量在函数结束后会自动释放，从而释放内存。\n\n## 警告\n- 在函数外部访问局部变量将导致编译错误。\n\
    \n***\n\n# 2. 全局变量\n\n## 什么是全局变量？\n全局变量声明在任何函数之外（通常在程序的开头），并可以在整个程序中访问。全局变量在程序运行期间持续存在。\n\
    \n## 用途\n- **跨函数共享数据**: 适用于多个函数需要访问的数值，例如配置数据。\n- **持久化存储**: 在程序执行过程中保留其值。\n\n\
    ## 语法\n```c\ntype varName;\n```\n\n## 语法解释\n- `type`: 指定变量的数据类型。\n- `varName`:\
    \ 变量名，可以在程序的任何地方访问。\n\n## 简单代码示例\n```c\nint total;  // 全局变量\n```\n\n## 代码示例解释\n\
    - 将 `total` 声明为全局变量，程序中的任何函数都可以访问。\n\n## 注意事项\n- 全局变量默认初始化为零。\n\n## 警告\n- 过度使用全局变量会导致内存效率低下和调试困难。\n\
    \n***\n\n# 3. 静态变量\n\n## 什么是静态变量？\n静态变量在函数调用之间保留其值，允许它在声明的函数内部充当持久化存储。\n\n## 用途\n\
    - **跨调用维持状态**: 计数器或需要在函数执行之间持久的数值的理想选择。\n- **带持久性的范围限制**: 静态变量仅限于其声明的函数，但会保留其值。\n\
    \n## 语法\n```c\nstatic type varName;\n```\n\n## 语法解释\n- `static`: 修饰符，即使在函数退出后也保留变量的值。\n\
    - `type`: 指定数据类型。\n- `varName`: 变量名，仅在声明它的函数内部可见。\n\n## 简单代码示例\n```c\nvoid track()\
    \  {\n    static int callCount =  0;  // 静态变量\n    callCount++;\n}\n```\n\n##\
    \ 代码示例解释\n- `callCount` 是一个静态变量，每次调用 `track` 时都会递增，并在多次调用之间保留其值。\n\n## 注意事项\n\
    - 静态变量只初始化一次，并在函数调用之间保留其值。\n\n## 警告\n- 静态变量存储在全局内存中，因此要谨慎使用以避免内存限制。\n\n***\n\n\
    # 4. 变量初始化\n\n## 什么是变量初始化？\n初始化在声明变量时为其分配一个初始值，确保它从已知值开始，这对于局部变量尤为重要。\n\n## 用途\n\
    - **避免不可预测的值**: 确保变量从定义好的值开始。\n- **控制初始状态**: 帮助将计数器、标志位和累加器设置为已知的起始点。\n\n## 语法\n\
    ```c\ntype varName =  value;\n```\n\n## 语法解释\n- `type`: 变量的数据类型。\n- `varName`:\
    \ 变量名。\n- `value`: 分配给变量的初始值。\n\n## 简单代码示例\n```c\nint value =  5;\n```\n\n## 代码示例解释\n\
    - 声明一个初始值为 5 的整数变量 `value`。\n\n## 注意事项\n- 始终初始化没有默认值的变量（例如局部变量）。\n\n## 警告\n- 确保值类型与变量类型匹配，以避免意外结果。\n\
    \n***\n\n# 5. Extern 关键字\n\n## 什么是 Extern 关键字？\n`extern` 关键字允许变量在多个文件中使用。它声明了一个变量但不对其进行定义，假设其定义在代码的其他地方存在。\n\
    \n## 用途\n- **跨文件共享全局变量**: 适用于需要在不同模块间访问变量的大型程序。\n- **代码模块化**: 允许将代码拆分为多个文件而无需重新定义变量。\n\
    \n## 语法\n```c\nextern type varName;\n```\n\n## 语法解释\n- `extern`: 表示该变量定义在另一个文件中。\n\
    - `type`: 变量的数据类型。\n- `varName`: 要跨文件共享的变量名。\n\n## 简单代码示例\n```c\nextern int total;\n\
    ```\n\n## 代码示例解释\n- 声明 `total` 是另一个文件中定义的变量，允许在此处访问。\n\n## 注意事项\n- 将 `extern`\
    \ 声明放在头文件中，以便在多个 C 文件之间共享变量。\n\n## 警告\n- 确保带有 `extern` 的变量只定义一次；多次定义会导致错误。\n\n\
    ***\n\n# 相关项目章节\n\n## 项目名称\n按钮控制 LED 与变量作用域管理\n\n## 项目目标\n在 RISC-V 微控制器上创建一个程序，通过按键切换\
    \ LED 状态，演示局部、全局和静态变量的使用。\n\n## RISC-V 开发环境\n该项目使用 Visual Code 中的 PlatformIO 来构建、上传和调试\
    \ SiFive Hi1 B 微控制器。\n\n## 要求组件\n在 RISC-V 微控制器上创建一个程序，通过按键切换 LED 状态，演示局部、全局和静态变量的使用。\n\
    \n## 连接表格\n| 组件 | RISC-V 引脚 | 备注 |\n| :--- | :--- | :--- |\n| 按钮 | GPIO | 输入 |\n\
    | LED | GPIO | 输出 |\n\n## 连接分析\n通过读取按钮状态来决定 LED 是开启还是关闭。全局变量管理状态，静态变量维持 LED 状态，局部变量在函数内存储值。\n\
    \n## 软件设置\n1. 使用 PlatformIO 打开 VS Code。\n2. 创建新的 PlatformIO 项目并选择 SiFive Hi1 B\
    \ 开发板。\n3. 实现根据按键切换 LED 状态的逻辑。\n\n## 项目代码\n```c\n#include <stdint.h>\n#include\
    \ \"hive1_gpio.h\" // 根据 SDK 调整\n\nconst int BUTTON_PIN = 2; // 按钮引脚\nconst int\
    \ LED_PIN = 13; // LED 引脚\n\n// 用于存储状态的全局变量\nint buttonState = 0;\n\nvoid setup()\
    \ {\n    GPIO_DIR |= (1 << LED_PIN); // 设置 LED_PIN 为输出\n    GPIO_DIR &= ~(1 <<\
    \ BUTTON_PIN); // 设置 BUTTON_PIN 为输入\n    GPIO_OUT &= ~(1 << LED_PIN); // 初始化 LED\
    \ 关闭\n}\n\nvoid toggleLED() {\n    static int ledState = 0; // 保留状态的静态变量\n   \
    \ if (ledState) {\n        GPIO_OUT &= ~(1 << LED_PIN); // 关闭 LED\n    } else\
    \ {\n        GPIO_OUT |= (1 << LED_PIN); // 开启 LED\n    }\n    ledState = !ledState;\
    \ // 为下次调用切换 ledState\n}\n\nint main() {\n    setup();\n    while (1) {\n    \
    \    int currentButtonState = (GPIO_IN & (1 << BUTTON_PIN)) != 0; // 局部变量\n  \
    \      if (currentButtonState != buttonState) {\n            if (currentButtonState\
    \ == 1) { // 按钮按下\n                toggleLED(); // 切换 LED 状态\n            }\n\
    \            buttonState = currentButtonState; // 更新全局按钮状态\n        }\n      \
    \  for (volatile int i = 0; i < 10000; i++); // 消抖延迟\n    }\n}\n```\n\n## 保存并运行\n\
    1. 使用 PlatformIO 保存、编译并上传代码到 SiFive Hi1 B 板。\n2. 按下按钮切换 LED 状态，验证变量作用域管理正确。\n\n"
