    ## Random Numbers in C for RISC-V Microcontrollers


    Chapter Overview


    Random numbers are essential for applications requiring variability, such as simulations,
    testing, games, and randomized responses. In embedded programming for RISC-V microcontrollers,
    random numbers can introduce randomness in control systems, data sampling, and
    security protocols. This chapter will cover random number generation techniques,
    their usage, and how to implement a random number-based project.


    Chapter Goal


    ●      Understand how to generate random numbers in C for RISC-V microcontrollers.


    ● Learn to seed and use random number functions for variability in embedded applications.


    ●      Implement a project that uses random numbers to control LED patterns.


    Rules


    ● Seed Random Numbers for True Randomness: Always use a unique seed to avoid repetitive
    results.


    ● Avoid Using  rand() in Time-Critical Code: Generating random numbers can take
    time; avoid excessive use in critical sections.


    ● Consider Hardware Limitations: Some microcontrollers may lack support for complex
    random number generation; use software solutions accordingly.


    ● Range Boundaries: Ensure random values fall within the desired range to avoid
    out-of-bounds issues.


    Brief Introduction to Random Numbers


    Random number generation in C uses functions such as  rand() to produce pseudo-random
    values. By default,  rand() generates the same sequence each time, but by seeding
    it with  srand(), you can create unique sequences. In embedded programming, random
    numbers add flexibility to applications, enabling varied responses, randomized
    events, and testing scenarios.


    Syntax Table


    | Serial No | Topic | Syntax |


    | 1 | Seed Randomizer | srand(seed); |


    | 2 | Generate Random | rand() |


    | 3 | Random Range | rand() % range |


    * * *


    Detailed Breakdown for Each Command


    1\. Seed Randomizer (srand)


    What is Seed Randomizer?


    The  srand function seeds the random number generator, setting the starting point
    for the sequence of random values. Without seeding,  rand() produces the same
    sequence on every run.


    Use Purpose


    ●      Ensure Variability: Seeds the random number generator for unique random
    sequences.


    ● Enhanced Randomness: Adding a seed, like a sensor reading, ensures unpredictable
    results.


    Syntax


    srand(seed);


    Syntax Explanation


    ● seed: An integer value used to initialize the random number generator. Typically,
    a dynamic value (e.g., sensor reading) is used for unique results.


    Simple Code Example


    srand(analogRead(A0)); // Use an analog sensor reading as a seed


    Code Example Explanation


    ● Seeds the random number generator with an analog sensor reading to create unique
    random values.


    Notes


    ● Seeding with the same value each time generates the same random sequence.


    Warnings


    ●      Avoid using fixed values as seeds unless repeatability is desired.


    * * *


    2\. Generate Random (rand)


    What is Generate Random?


    The  rand() function returns a pseudo-random integer between 0 and  RAND_MAX.
    It produces a sequence of values based on the initial seed.


    Use Purpose


    ●      Generate Random Values: Creates pseudo-random numbers for varied behavior.


    ●      Simulation and Testing: Useful for randomized input simulation in testing
    environments.


    Syntax


    rand();


    Syntax Explanation


    ● rand(): The function call generates a pseudo-random integer between 0 and  RAND_MAX.


    Simple Code Example


    int num = rand();


    Code Example Explanation


    ●      Generates a random integer and stores it in  num.


    Notes


    ●      For specific ranges, use modulus (%) to limit  rand() output.


    Warnings


    ●      rand() is pseudo-random; it provides predictable results without seeding.


    * * *


    3\. Random Range (rand() % range)


    What is Random Range?


    Using  rand() % range limits the output of  rand() to a specific range. This operation
    returns a value from 0 up to  range - 1.


    Use Purpose


    ● Controlled Randomization: Constrains random values within desired limits, ideal
    for LED patterns, motor speeds, or timings.


    ●      Custom Range Control: Useful for setting boundaries on random numbers.


    Syntax


    rand()  % range;


    Syntax Explanation


    ●      rand(): Generates a pseudo-random integer.


    ● % range: Limits the random integer to values between 0 and  range - 1.


    Simple Code Example


    int randomLED = rand()  %  5; // Generates a random number from 0 to 4


    Code Example Explanation


    ● Generates a random value between 0 and 4, suitable for selecting one of five
    LEDs.


    Notes


    ● Ensure that  range is greater than 0 to avoid division by zero.


    Warnings


    ● Using % on  rand() reduces randomness slightly but is generally acceptable for
    bounded values.


    * * *


    Relevant Project Section


    Project Name


    Random LED Pattern Generator


    Project Goal


    Use random numbers on a RISC-V microcontroller to control the lighting of LEDs
    in a random pattern. This project demonstrates the use of  rand() and  srand()
    to generate random values for embedded applications.


    RISC-V Development Environment


    This project will use PlatformIO in Visual Studio Code.


    RISC-V Microcontroller


    We will use the SiFive HiFive1 Rev B microcontroller for this project.


    Requirement Components


    ●      SiFive HiFive1 Rev B Microcontroller


    ●      5 LEDs connected to GPIO pins for random activation


    Component Connection Table


    | Component | RISC-V Pin | Additional Notes |


    | LED1 | GPIO Pin 2 | LED for random activation |


    | LED2 | GPIO Pin 3 | LED for random activation |


    | LED3 | GPIO Pin 4 | LED for random activation |


    | LED4 | GPIO Pin 5 | LED for random activation |


    | LED5 | GPIO Pin 6 | LED for random activation |


    Connection Analysis


    Each LED is connected to a separate GPIO pin, allowing the microcontroller to
    control individual LEDs. Random numbers determine which LEDs are activated at
    any given time, creating a random light pattern.


    Program Software Setup


    1.  Open Visual Studio Code and create a new PlatformIO project.


    2.  Set up the GPIO pins for each LED.


    3.  Implement code to seed the random number generator and activate random LEDs
    using  rand().


    Project Code


    #include  <stdint.h>


    #include  <stdio.h>


    #include  <stdlib.h>


    #include  "hifive1_gpio.h" // GPIO library for RISC-V


    #define NUM_LEDS 5


    int ledPins[NUM_LEDS]  =  {2,  3,  4,  5,  6}; // Array of LED GPIO pins


    void setup()  {


    // Initialize each LED pin as output


    for  (int i =  0; i < NUM_LEDS; i++)  {


    GPIO_DIR |=  (1  << ledPins[i]);


    }


    // Seed the random number generator


    srand(analogRead(0));  // Use an analog reading as seed


    }


    void randomLEDPattern()  {


    int randomLED = rand()  % NUM_LEDS; // Select random LED


    // Turn all LEDs off


    for  (int i =  0; i < NUM_LEDS; i++)  {


    GPIO_OUT &=  ~(1  << ledPins[i]);


    }


    // Turn on the randomly selected LED


    GPIO_OUT |=  (1  << ledPins[randomLED]);


    }


    int main()  {


    setup();


    while  (1)  {


    randomLEDPattern();  // Activate random LED pattern


    for  (volatile  int i =  0; i <  1000000; i++);  // Simple delay


    }


    }


    Save and Run


    1.  Save, compile, and upload the code to the SiFive HiFive1 Rev B board using
    PlatformIO.


    2.  Observe the LED lights activate in random patterns, controlled by the microcontroller.


    Check Output


    ● The LEDs should light up in a random sequence, with only one LED active at a
    time.


