  trans: "\n\n# 上界控制\n\n- 上界控制：防止值超过允许的最大水平。\n- 安全约束：确保参数保持在接受范围内。\n\n## 语法\n```\n\
    a <= b;\n```\n\n## 语法说明\n- `a` 和 `b`：正在进行比较的值或变量。如果 `a` 小于或等于 `b`，结果为 `true`。\n\
    \n## 简单代码示例\n```c\nint distance = 10;\n\nif (distance <= 10) {\n    GPIO_OUT &=\
    \ ~(1 << STOP_PIN);  // 如果距离小于或等于 10，则停止电机\n}\n```\n\n## 代码示例说明\n- 检查 `distance`\
    \ 是否小于或等于 `10`。如果为真，停止电机。\n\n## 注意事项\n- 对于具有上界安全约束的应用非常有帮助。\n\n## 警告\n- 由于精度问题，避免在严格比较中使用浮点值。\n\
    \n***\n\n# 相关项目章节\n\n### 项目名称\n温度控控风扇系统\n\n### 项目目标\n在 RISC-V 微控制器上使用比较运算符来监控温度读数，并根据不同的阈值控制风扇。该项目演示了如何使用比较运算符根据传感器输入管理设备状态。\n\
    \n### RISC-V 开发环境\n此项目将使用 Visual Studio Code 中的 `PlatformIO`。\n\n### RISC-V 微控制器\n\
    我们将使用 SiFive HiFive1 Rev B 微控制器进行此项目。\n\n### 组件\n- SiFive HiFive1 Rev B 微控制器\n\
    - 连接到模拟输入引脚的温度传感器\n- 连接到 GPIO 引脚的风扇或 LED，模拟根据温度控制风扇\n\n### 组件连接表\n| 组件 | RISC-V\
    \ 引脚 | 备注 |\n| :--- | :--- | :--- |\n| 温度传感器 | ADC 引脚 | 代表温度的模拟信号 |\n| 风扇/LED\
    \ | GPIO 引脚 | 根据温度开启或关闭 |\n\n### 连接分析\n温度传感器向微控制器提供模拟输入，微控制器将其转换为数字值。然后微控制器使用比较运算符评估温度，并根据预定义的阈值控制风扇或\
    \ LED。\n\n### 程序软件设置\n1. 打开 Visual Studio Code 并创建一个新的 `PlatformIO` 项目。\n2. 配置\
    \ `ADC` 从传感器读取温度数据。\n3. 使用比较运算符编写代码，根据温度阈值控制风扇或 LED。\n\n### 项目代码\n```c\n#include\
    \ <stdint.h>\n#include <stdio.h>\n#include \"hifive1_adc.h\" //  ADC 库\n\n#define\
    \ TEMP_HIGH_THRESHOLD 30 // 摄氏度高温阈值\n#define TEMP_LOW_THRESHOLD 20 // 摄氏度低温阈值\n\
    #define FAN_PIN 13             // 风扇/LED 的 GPIO 引脚\n\nvoid setup() {\n    GPIO_DIR\
    \ |= (1 << FAN_PIN);  // 设置 FAN_PIN 为输出\n    ADC_INIT();                  // 初始化\
    \ ADC\n    ADC_SELECT_CHANNEL(1);      // 选择温度传感器的 ADC 通道\n}\n\nint readTemperature()\
    \ {\n    ADC_START_CONVERSION();  // 开始 ADC 转换\n    int adcValue = ADC_READ();\
    \  // 读取 ADC 值\n    float voltage = (adcValue / 1023.0) * 3.3; // 转换为电压\n    int\
    \ temperatureC = (voltage - 0.5) * 100; // 电压转换为温度\n    return temperatureC;\n\
    }\n\nint main() {\n    setup();\n    while (1) {\n        int temp = readTemperature();\n\
    \        if (temp >= TEMP_HIGH_THRESHOLD) {\n            GPIO_OUT |= (1 << FAN_PIN);\
    \  // 如果温度高则开启风扇\n        } else if (temp <= TEMP_LOW_THRESHOLD) {\n         \
    \   GPIO_OUT &= ~(1 << FAN_PIN);  // 如果温度低则关闭风扇\n        }\n        printf(\"\
    Temperature: %d C\\n\", temp);  // 显示温度\n        for (volatile int i = 0; i <\
    \ 1000000; i++); // 简单延迟\n    }\n}\n```\n\n### 保存并运行\n1. 使用 `PlatformIO` 保存、编译并将代码上传到\
    \ SiFive HiFive1 Rev B 板。\n2. 根据当前温度监控 LED 或风扇状态。\n\n### 检查输出\n- 如果温度超过高阈值，风扇或\
    \ LED 应开启；如果低于低阈值，应关闭，这演示了比较运算符的有效使用。\n\n***\n\n# 用于 RISC-V 微控制器的 C 语言布尔运算符\n\n\
    ## 章节概述\n布尔运算符在编程中至关重要，因为它们允许对条件进行组合、评估和控制。这些运算符（`&&`、`||`、`!`）通过组合多个条件来实现逻辑决策，使嵌入式系统能够响应复杂的场景。在\
    \ RISC-V 微控制器编程中，布尔运算符用于为传感器、执行器和各种输入输出组合创建健壮的控制逻辑。\n\n## 目标\n- 理解主要的布尔运算符（`&&`、`||`、`!`）及其在嵌入式\
    \ C 编程中的应用。\n-学习使用这些运算符处理多个条件，改进控制和决策。\n- 实现一个根据两个传感器输入控制 LED 的项目。\n\n## 规则\n\
    - 避免冗余条件以保持代码高效。\n- 清晰地使用布尔运算符。\n- 确保条件易于阅读。\n\n## 布尔运算符简介\n布尔运算符使能够产生 `true`\
    \ 或 `false` 结果的逻辑决策。常用运算符包括 `&&` (与)、`||` (或) 和 `!` (非)。\n\n## 语法表\n| 序号 | 主题\
    \ | 语法 |\n| :--- | :--- | :--- |\n| 1 | 逻辑与 | `a && b` |\n| 2 | 逻辑或 | `a || b`\
    \ |\n| 3 | 逻辑非 | `!a` |\n\n***\n\n## 1. 逻辑与 (&&)\n\n### 什么是逻辑与？\n`&&` 运算符检查是否都为真。只有当两个操作数都为真时，结果才为\
    \ `true`，适用于必须满足所有条件的情况。\n\n### 用途\n- 多条件验证：确保所有条件满足。\n- 安全操作：用于前提条件。\n\n### 语法\n\
    ```\na && b;\n```\n\n### 语法说明\n- `a` 和 `b`：正在进行比较的值。只有当 `a` 和 `b` 都为真时，结果为 `true`。\n\
    \n### 简单代码示例\n```c\nint sensor1 = 1;\nint sensor2 = 1;\n\nif (sensor1 && sensor2)\
    \ {\n    GPIO_OUT |= (1 << LED_PIN);  // 如果都激活则开启 LED\n}\n```\n\n### 代码示例说明\n\
    - 检查 `sensor1` 和 `sensor2` 是否都为真。\n\n### 注意事项\n- `&&` 具有短路特性，如果第一个条件为假，则不评估第二个条件。\n\
    \n### 警告\n- 如果需要第二个条件，请务小心。\n\n***\n\n## 2. 逻辑或 (||)\n\n### 什么是逻辑或？\n`||` 运算符检查是否至少有一个条件为真。只要其中一个条件为真，结果就为\
    \ `true`，适用于只需满足一个条件的情况。\n\n### 用途\n- 备选条件检查：如果多个条件中的任何一个则激活操作。\n- 灵活控制：允许两个或多个状态之一满足要求。\n\
    \n### 语法\n```\na || b;\n```\n\n### 语法说明\n- `a` 和 `b`：正在进行比较的值。只要 `a` 或 `b` 为真，结果就为\
    \ `true`。\n\n### 简单代码示例\n```c\nint mode = 2;\n\nif (mode == 1 || mode == 2) {\n\
    \    GPIO_OUT |= (1 << MOTOR_PIN);  // 如果模式为 1 或 2 则启动电机\n}\n```\n\n### 代码示例说明\n\
    - 检查 `mode` 是否为 1 或 2。\n\n### 注意事项\n- `||` 也具有短路特性，所以如果第一个条件为真，则不评估第二个条件。\n\n\
    ### 警告\n- 在必要时确保条件是独立的，以避免意外结果。\n\n***\n\n## 3. 逻辑非 (!)\n\n### 什么是逻辑非？\n\n"
- fmt: "\nThe `!` operator inverts the result of a condition, turning `true` to `false`\
    \ and vice versa. It is useful for toggling between states or checking for false\
    \ conditions.\n\n## Use Purpose\n- **Negate Conditions**: Inverts a condition’s\
    \ value, allowing code to check for a condition being false.\n- **Error and Status\
    \ Checking**: Commonly used to ensure a flag or error is not active.\n\n## Syntax\n\
    ```c\n!a;\n```\n\n## Syntax Explanation\n- `a`: The condition being inverted.\
    \ If `a` is `true`, `!a` returns `false`, and vice versa.\n\n## Simple Code Example\n\
    ```c\nint error = 0;\n\nif (!error) {\n    GPIO_OUT |= (1 << LED_PIN);  // Turn\
    \ on LED if there is no error\n}\n```\n\n## Code Example Explanation\n- Checks\
    \ if `error` is false. If true, it turns on the LED.\n\n## Notes\n- Use `!` carefully,\
    \ as double negatives can make conditions harder to read.\n\n## Warnings\n- Avoid\
    \ excessive negation, as it can make logic difficult to understand.\n\n***\n\n\
    ## Relevant Project Section\n\n### Project Name\nDual-Sensor Controlled LED System\n\
    \n### Project Goal\nUse Boolean operators on a RISC-V microcontroller to control\
    \ an LED based on inputs from two sensors. The LED turns on if both sensors detect\
    \ an object (AND condition) or if either sensor detects an object (OR condition),\
    \ demonstrating the use of Boolean logic in control applications.\n\n### RISC-V\
    \ Development Environment\nThis project will use `PlatformIO` in Visual Studio\
    \ Code.\n\n### RISC-V Microcontroller\nWe will use the `SiFive HiFive1 Rev B`\
    \ microcontroller for this project.\n\n### Requirement Components\n- `SiFive HiFive1\
    \ Rev B` Microcontroller\n- Two Proximity Sensors connected to GPIO pins as digital\
    \ inputs\n- LED connected to a GPIO pin as a digital output\n\n### Component Connection\
    \ Table\n| Component | RISC-V Pin | Additional Notes |\n| :--- | :--- | :--- |\n\
    | Proximity Sensor 1 | GPIO Pin | Detects object presence |\n| Proximity Sensor\
    \ 2 | GPIO Pin | Detects object presence |\n| LED | GPIO Pin | Controlled based\
    \ on sensor input |\n\n### Connection Analysis\nThe proximity sensors detect objects\
    \ and provide digital input signals to the microcontroller. The LED is connected\
    \ to a GPIO pin and is controlled based on Boolean logic applied to the sensor\
    \ inputs.\n\n### Program Software Setup\n1. Open Visual Studio Code and create\
    \ a new `PlatformIO` project.\n2. Configure the GPIO pins for the proximity sensors\
    \ and LED.\n3. Implement code using Boolean operators to control the LED based\
    \ on the sensor inputs.\n\n### Project Code\n```c\n#include <stdint.h>\n#include\
    \ <stdio.h>\n\n#define LED_PIN 13              // GPIO pin for LED\n#define SENSOR1_PIN\
    \ 2           // GPIO pin for Proximity Sensor 1\n#define SENSOR2_PIN 3      \
    \     // GPIO pin for Proximity Sensor 2\n\nvoid setup() {\n    GPIO_DIR |= (1\
    \ << LED_PIN);      // Set LED pin as output\n    GPIO_DIR &= ~(1 << SENSOR1_PIN);\
    \  // Set SENSOR1 pin as input\n    GPIO_DIR &= ~(1 << SENSOR2_PIN);  // Set SENSOR2\
    \ pin as input\n}\n\nvoid controlLED(int sensor1, int sensor2) {\n    // LED ON\
    \ if both sensors detect an object\n    if (sensor1 && sensor2) {\n        GPIO_OUT\
    \ |= (1 << LED_PIN);  // Turn on LED\n    }\n    // LED ON if either sensor detects\
    \ an object\n    else if (sensor1 || sensor2) {\n        GPIO_OUT |= (1 << LED_PIN);\
    \  // Turn on LED\n    }\n    // Turn off LED if no sensor detects an object\n\
    \    else {\n        GPIO_OUT &= ~(1 << LED_PIN);  // Turn off LED\n    }\n}\n\
    \nint main() {\n    setup();\n    while (1) {\n        // Read sensor values\n\
    \        int sensor1 = (GPIO_IN & (1 << SENSOR1_PIN)) != 0;\n        int sensor2\
    \ = (GPIO_IN & (1 << SENSOR2_PIN)) != 0;\n        controlLED(sensor1, sensor2);\
    \  // Control LED based on sensor inputs\n        for (volatile int i = 0; i <\
    \ 100000; i++);  // Simple delay\n    }\n}\n```\n\n### Save and Run\n1. Save,\
    \ compile, and upload the code to the `SiFive HiFive1 Rev B` board using `PlatformIO`.\n\
    2. Use the proximity sensors to test the LED behavior under different conditions.\n\
    \n### Check Output\n- The LED should turn on when both sensors detect an object\
    \ (AND condition) or when either sensor detects an object (OR condition). If neither\
    \ sensor detects an object, the LED remains off.\n\n## Compound Operators in C\
    \ for RISC-V Microcontrollers\n\n### Chapter Overview\nCompound operators in C\
    \ combine arithmetic operations with assignment, allowing calculations and value\
    \ updates in a single statement. These operators (`+=`, `-=`, `*=`, `/=`, `%=`,\
    \ `&=`, `|=`, `^=`) provide shorthand notation for common operations, improving\
    \ code readability and efficiency. In embedded programming, compound operators\
    \ are valuable for updating variables and controlling states in loops.\n\n###\
    \ Chapter Goal\n- Understand the primary operators.\n- Learn to use compound operators.\n\
    \n### Rules\n- Use compound operators to improve readability.\n- Avoid nested\
    \ operators.\n- Ensure data types are compatible.\n\n### Brief Introduction\n\
    Compound operators simplify code by combining arithmetic and assignment.\n\n###\
    \ Notes and Warnings\n- Avoid unexpected results.\n- Ensure data types are compatible.\n\
    - Be cautious with large additions to avoid overflow.\n\n### Syntax Table\n| Serial\
    \ No | Topic | Syntax |\n| :--- | :--- | :--- |\n| 1 | Addition | `a += b` |\n\
    | 2 | Subtraction | `a -= b` |\n| 3 | Multiplication | `a *= b` |\n| 4 | Division\
    \ | `a /= b` |\n| 5 | Modulus | `a %= b` |\n| 6 | Bitwise AND | `a &= b` |\n|\
    \ 7 | Bitwise OR | `a |= b` |\n| 8 | Bitwise XOR | `a ^= b` |\n\n***\n\n## Detailed\
    \ Breakdown for Each Command\n\n### 1. Addition Compound Operator (+=)\nWhat is\
    \ the Addition Compound Operator?\nThe `+=` operator adds the right operand to\
    \ the left operand and assigns the result to the left operand. It is commonly\
    \ used for incrementing counters.\n\n#### Use Purpose\n- Increment counters.\n\
    - Accumulate totals.\n\n#### Syntax and Explanation\n- `a`: The variable being\
    \ updated.\n- `b`: The value to be added to `a`.\n\n#### Simple Code Example\n\
    ```c\nint counter = 0;\ncounter += 1;\n```\n#### Code Example Explanation\n- Adds\
    \ 1 to `counter`, which becomes 1.\n\n### 2. Subtraction Compound Operator (-=)\n\
    What is the Subtraction Compound Operator?\nThe `-=` operator subtracts the right\
    \ operand from the left operand and assigns the result to the left operand. It\
    \ is often used for decrementing values or reducing totals.\n\n#### Use Purpose\n\
    - Decrement counters.\n- Reduce totals.\n\n#### Syntax and Explanation\n- `a`:\
    \ The variable being updated.\n- `b`: The value to be subtracted from `a`.\n\n\
    #### Simple Code Example\n```c\nint count = 10;\ncount -= 2;\n```\n#### Code Example\
    \ Explanation\n- Subtracts 2 from `count`, resulting in 8.\n\n### 3. Multiplication\
    \ Compound Operator (*=)\nWhat is the Multiplication Compound Operator?\nThe `*=`\
    \ operator multiplies the left operand by the right operand and assigns the result\
    \ to the left operand. It is useful for scaling values.\n\n#### Use Purpose\n\
    - Scaling: Increases a variable by a multiplier.\n"
  raw: 'The ! operator inverts the result of a condition, turning  true to  false
    and vice versa. It is useful for toggling between states or checking for false
    conditions.


    Use Purpose


    ● Negate Conditions: Inverts a condition’s value, allowing code to check for a
    condition being false.


    ● Error and Status Checking: Commonly used to ensure a flag or error is not active.


    Syntax


    !a;


    Syntax Explanation


    ● a: The condition being inverted. If a is true,  !a returns false, and vice versa.


    Simple Code Example


    int error =  0;


    if  (!error)  {


    GPIO_OUT |=  (1  << LED_PIN);  // Turn on LED if there is no error


    }


    Code Example Explanation


    ● Checks if  error is false. If true, it turns on the LED.


    Notes


    ● Use ! carefully, as double negatives can make conditions harder to read.


    Warnings


    ●      Avoid excessive negation, as it can make logic difficult to understand.


    * * *


    Relevant Project Section


    Project Name


    Dual-Sensor Controlled LED System


    Project Goal


    Use Boolean operators on a RISC-V microcontroller to control an LED based on inputs
    from two sensors. The LED turns on if both sensors detect an object (AND condition)
    or if either sensor detects an object (OR condition), demonstrating the use of
    Boolean logic in control applications.


    RISC-V Development Environment


    This project will use PlatformIO in Visual Studio Code.


    RISC-V Microcontroller


    We will use the SiFive HiFive1 Rev B microcontroller for this project.


    Requirement Components


    ●      SiFive HiFive1 Rev B Microcontroller


    ●      Two Proximity Sensors connected to GPIO pins as digital inputs


    ●      LED connected to a GPIO pin as a digital output


    Component Connection Table


    | Component | RISC-V Pin | Additional Notes |


    | Proximity Sensor 1 | GPIO Pin | Detects object presence |


    | Proximity Sensor 2 | GPIO Pin | Detects object presence |


    | LED | GPIO Pin | Controlled based on sensor input |


    Connection Analysis


    The proximity sensors detect objects and provide digital input signals to the
    microcontroller. The LED is connected to a GPIO pin and is controlled based on
    Boolean logic applied to the sensor inputs.


    Program Software Setup


    1.  Open Visual Studio Code and create a new PlatformIO project.


    2.  Configure the GPIO pins for the proximity sensors and LED.


    3.  Implement code using Boolean operators to control the LED based on the sensor
    inputs.


    Project Code


    #include  <stdint.h>


    #include  <stdio.h>


    #define LED_PIN 13            // GPIO pin for LED


    #define SENSOR1_PIN 2         // GPIO pin for Proximity Sensor 1


    #define SENSOR2_PIN 3         // GPIO pin for Proximity Sensor 2


    void setup()  {


    GPIO_DIR |=  (1  << LED_PIN);     // Set LED pin as output


    GPIO_DIR &=  ~(1  << SENSOR1_PIN);  // Set SENSOR1 pin as input


    GPIO_DIR &=  ~(1  << SENSOR2_PIN);  // Set SENSOR2 pin as input


    }


    void controlLED(int sensor1,  int sensor2)  {


    // LED ON if both sensors detect an object


    if  (sensor1 && sensor2)  {


    GPIO_OUT |=  (1  << LED_PIN);  // Turn on LED


    }


    // LED ON if either sensor detects an object


    else  if  (sensor1 || sensor2)  {


    GPIO_OUT |=  (1  << LED_PIN);  // Turn on LED


    }


    // Turn off LED if no sensor detects an object


    else  {


    GPIO_OUT &=  ~(1  << LED_PIN);  // Turn off LED


    }


    }


    int main()  {


    setup();


    while  (1)  {


    // Read sensor values


    int sensor1 =  (GPIO_IN &  (1  << SENSOR1_PIN))  !=  0;


    int sensor2 =  (GPIO_IN &  (1  << SENSOR2_PIN))  !=  0;


    controlLED(sensor1, sensor2);  // Control LED based on sensor inputs


    for  (volatile  int i =  0; i <  100000; i++);  // Simple delay


    }


    }


    Save and Run


    1.  Save, compile, and upload the code to the SiFive HiFive1 Rev B board using
    PlatformIO.


    2.  Use the proximity sensors to test the LED behavior under different conditions.


    Check Output


    ● The LED should turn on when both sensors detect an object (AND condition) or
    when either sensor detects an object (OR condition). If neither sensor detects
    an object, the LED remains off.


    ## Compound Operators in C for RISC-V Microcontrollers


    Chapter Overview


    Compound operators in C combine arithmetic operations with assignment, allowing
    calculations and value updates in a single statement. These operators (+=,  -=,  *=,  /=,  %=,  &=,  |=,  ^=)
    provide shorthand notation for common operations, improving code readability and
    efficiency. In embedded programming, compound operators are valuable for updating
    variables and controlling states in loops or conditional checks.


    Chapter Goal


    ● Understand the primary compound operators and their functions in embedded C
    programming.


    ●      Learn to use these operators to simplify code and improve efficiency.


    ● Implement a project using compound operators to adjust brightness levels of
    an LED using PWM.


    Rules


    ● Use Compound Operators for Efficiency: Combine operations with assignment to
    minimize code length and improve readability.


    ● Avoid Nested Compound Operations: Use them in simple, clear expressions for
    better readability.


    ● Check for Data Type Compatibility: Ensure the data types are compatible with
    the operation to avoid unexpected results.


    ● Avoid Overuse in Complex Expressions: Keep compound operations straightforward
    to enhance maintainability.


    Brief Introduction to Compound Operators


    Compound operators simplify code by combining arithmetic, bitwise, and assignment
    operations. For example,  x += 5 increments x by 5\. These operators are essential
    for updating counters, toggling bits, and adjusting values in embedded systems.
    By using compound operators, programmers can make code more concise, especially
    in loops and repetitive operations.


    Syntax Table


    | Serial No | Topic | Syntax | Simple Example |


    | 1 | Addition | a += b | counter += 1 |


    | 2 | Subtraction | a -= b | count -= decrement |


    | 3 | Multiplication | a *= b | result *= factor |


    | 4 | Division | a /= b | value /= divisor |


    | 5 | Modulus | a %= b | remainder %= divisor |


    | 6 | Bitwise AND | a &= b | flags &= mask |


    | 8 | Bitwise XOR | a ^= b | toggle ^= 1 |


    * * *


    Detailed Breakdown for Each Command


    1\. Addition Compound Operator (+=)


    What is the Addition Compound Operator?


    The  += operator adds the right operand to the left operand and assigns the result
    to the left operand. It is commonly used for incrementing counters or adding values.


    Use Purpose


    ●      Increment Values: Simplifies incrementing variables in loops or counters.


    ● Accumulate Totals: Adds values to a running total, useful in data collection.


    Syntax


    a += b;


    Syntax Explanation


    ●      a: The variable being updated.


    ● b: The value to be added to a. The result is assigned back to a.


    Simple Code Example


    int counter =  0;


    counter +=  1;


    Code Example Explanation


    ●      Adds 1 to  counter, which becomes 1.


    Notes


    ●      Equivalent to  counter = counter + 1.


    Warnings


    ●      Be cautious with large additions to avoid overflow.


    * * *


    2\. Subtraction Compound Operator (-=)


    What is the Subtraction Compound Operator?


    The  -= operator subtracts the right operand from the left operand and assigns
    the result to the left operand. It is often used for decrementing values or reducing
    totals.


    Use Purpose


    ●      Decrement Counters: Efficiently decreases counters or values in loops.


    ●      Reduce Totals: Subtracts values in accumulation tasks.


    Syntax


    a -= b;


    Syntax Explanation


    ●      a: The variable being updated.


    ● b: The value to be subtracted from a. The result is assigned back to a.


    Simple Code Example


    int count =  10;


    count -=  2;


    Code Example Explanation


    ●      Subtracts 2 from  count, resulting in 8.


    Notes


    ●      Equivalent to  count = count - 2.


    Warnings


    ● Avoid subtracting more than the current value in unsigned data types to prevent
    underflow.


    * * *


    3\. Multiplication Compound Operator (*=)


    What is the Multiplication Compound Operator?


    The  *= operator multiplies the left operand by the right operand and assigns
    the result to the left operand. It is useful for scaling values.


    Use Purpose


    ●      Scaling: Increases a variable by a multiplier.'
