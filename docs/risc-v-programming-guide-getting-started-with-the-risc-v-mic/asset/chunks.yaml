    4\. Array Declaration


    What is Array Declaration?


    An array declaration creates a collection of elements of the same data type, allowing
    multiple values to be stored under a single variable name. Arrays are useful for
    grouping data, such as sensor readings or multiple characters.


    Use Purpose


    ● Store Multiple Values: Allows storage of multiple elements of the same type.


    ● Efficient Data Organization: Ideal for managing data that can be processed in
    loops.


    Syntax


    type arrayName[size];


    Syntax Explanation


    ●      type: Specifies the data type of the elements.


    ●      arrayName: The name of the array variable.


    ●      size: Number of elements the array can hold.


    Simple Code Example


    int numbers[5];


    Code Example Explanation


    ●      Declares an array  numbers with space for 5 integer elements.


    Notes


    ●      Arrays have a fixed size, which must be defined at declaration.


    Warnings


