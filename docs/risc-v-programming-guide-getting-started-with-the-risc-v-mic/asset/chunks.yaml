    ## Data Conversion in C for RISC-V Microcontrollers


    ### Chapter Overview

    Data conversion is crucial in embedded programming, enabling microcontrollers
    to transform data from one format to another, such as from integers to floating-point
    or from analog to digital values. In RISC-V microcontrollers, data conversion
    is frequently needed to process sensor data, communicate values, and perform mathematical
    operations. This chapter will cover various data conversion techniques, syntax,
    and their applications in embedded projects.


    ### Chapter Goal

    ● Understand common data conversion techniques and their usage in C programming
    for embedded applications.

    ● Learn to implement typecasting, analog-to-digital conversions, and conversions
    between different number bases.

    ● Implement a project that converts and displays sensor data in multiple formats.


    ### Rules

    ● Match Data Types Carefully: Ensure compatibility between data types during conversion
    to avoid data loss or overflow.

    ● Use Conversions for Meaningful Data: Convert data for meaningful processing,
    such as analog-to-digital conversions for sensors.

    ● Check for Overflow and Underflow: Avoid exceeding data type limits during conversion
    to maintain accuracy.

    ● Convert in a Stepwise Manner: For complex conversions, break them down into
    intermediate steps to improve readability and accuracy.


    ### Brief Introduction to Data Conversion

    Data conversion in embedded C includes techniques such as typecasting (changing
    data from one type to another), base conversion (converting values from one numeral
    system to another), and analog-to-digital conversions (transforming sensor signals
    into readable digital data). Conversions are essential in ensuring compatibility
    between different data types and formats, making the data usable in various contexts.


    ### Syntax Table

    | Serial No | Topic | Syntax | Simple Example |

    | :--- | :--- | :--- | :--- |

    | 1 | Typecasting | `(type) value` | `float f = (float) 10;` |

    | 2 | Integer to Float | `(float) intVar` | `float result = (float) num;` |

    | 3 | Float to Integer | `(int) floatVar` | `int rounded = (int) value;` |

    | 4 | ASCII to Integer | `atoi(string)` | `int num = atoi("123");` |

    | 5 | Integer to String | `itoa(int, str, base)` | `itoa(num, str, 10);` |


    ***


    ### Detailed Breakdown for Each Command


    #### 1. Typecasting `((type) value)`


    ##### What is Typecasting?

    Typecasting converts a variable from one data type to another, allowing data to
    be interpreted differently. This is especially useful when performing calculations
    that require different data types, such as converting integer sensor readings
    to floating-point for precision.


    ##### Use Purpose

    ● Data Compatibility: Ensures compatibility in operations involving different
    data types.

    ● Precision Control: Allows converting integer values to floating-point for increased
    precision.


    #### Syntax

    ```c

    (type) value;

    ```


    #### Syntax Explanation

    ● `type`: The target data type to which `value` will be converted.

    ● `value`: The variable or value being typecast.


    #### Simple Code Example

    ```c

    float f = (float) 10; // Converts integer 10 to float

    ```


    #### Code Example Explanation

    ● Converts the integer `10` to a floating-point value, storing `10.0` in `f`.


    #### Notes

    ● Typecasting allows mixing of data types within expressions.


    #### Warnings

    ● Avoid losing data through typecasting, such as truncating decimals when converting
    float to `int`.


    ***


    #### 2. Integer to Float Conversion `((float) intVar)`


    ##### What is Integer to Float Conversion?

    Converting an integer to a float enables precise calculations by adding decimal
    representation, useful when exact values are required, such as in sensor calibration.


    ##### Use Purpose

    ● Enhanced Precision: Provides decimal accuracy for mathematical operations.

    ● Sensor Data Processing: Converts integer sensor data to float for accurate processing.


    #### Syntax

    ```c

    (float) intVar;

    ```


    #### Syntax Explanation

    ● `intVar`: The integer variable being converted to float.


    #### Simple Code Example

    ```c

    int num = 7;

    float preciseNum = (float) num;

    ```


    #### Code Example Explanation

    ● Converts the integer `7` to `7.0` as a float.


    #### Notes

    ● Integer-to-float conversions are commonly used in averaging and scaling operations.


    #### Warnings

    ● Be mindful of decimal precision requirements when converting large numbers.


    ***


    #### 3. Float to Integer Conversion `((int) floatVar)`


    ##### What is Float to Integer Conversion?

    Float-to-integer conversion discards the decimal portion of a floating-point value,
    useful when only the whole number is needed, such as in counters or non-fractional
    values.


    ##### Use Purpose

    ● Whole Number Processing: Simplifies values by removing decimals.

    ● Data Formatting: Converts precise data to whole numbers for simplified display.


    #### Syntax

    ```c

    (int) floatVar;

    ```


    #### Syntax Explanation

    ● `floatVar`: The floating-point variable being converted to an integer.


    #### Simple Code Example

    ```c

    float value = 9.7;

    int rounded = (int) value; // Converts to 9

    ```


    #### Code Example Explanation

    ● Converts `9.7` to `9`, discarding the decimal part.


    #### Notes

    ● Rounding is not applied; values are truncated to integers.


    #### Warnings

    ● Be cautious when truncating values; decimals will be lost permanently.


    ***


    #### 4. ASCII to Integer Conversion `atoi`


    ##### What is ASCII to Integer Conversion?

    The `atoi` function converts a string of ASCII characters to an integer, enabling
    the use of numerical data input from character-based sources, like serial data.


    ##### Use Purpose

    ● Text-Based Input: Converts numerical text inputs to integer format.

    ● Serial Data Processing: Useful for interpreting numerical strings from serial
    communication.


    #### Syntax

    ```c

    atoi(string);

    ```


    #### Syntax Explanation

    ● `string`: A character array or string containing numeric ASCII characters to
    be converted.


    #### Simple Code Example

    ```c

    int num = atoi("123");

    ```


    #### Code Example Explanation

    ● Converts the string `"123"` to the integer `123`.


    #### Notes

    ● Ensure the string contains numeric characters.


    #### Warnings

    ● `atoi` returns 0 for invalid strings; validate inputs when necessary.


    ***


    #### 5. Integer to String Conversion `itoa`


    ##### What is Integer to String Conversion?

    The `itoa` function converts an integer to a string in a specified base, useful
    for displaying numbers or sending them as text.


    ##### Use Purpose

    ● Data Display: Formats integer values as strings.

    ● Communication: Sends integer data as strings.


    #### Syntax

    ```c

    itoa(int, str, base);

    ```


    #### Syntax Explanation

    ● `int`: The integer value to be converted.

    ● `str`: The destination character array for the resulting string.

    ● `base`: Specifies the numeral system (e.g., 10 for decimal).


    #### Simple Code Example

    ```c

    char buffer[10];

    itoa(123, buffer, 10); // Converts 123 to "123"

    ```


    #### Code Example Explanation

    ● Converts the integer `123` to the string `"123"` in decimal format.


    #### Notes

    ● Buffer size must be large enough to store the resulting string.


    #### Warnings

    ● Incorrect buffer sizes can lead to memory issues; ensure adequate storage.


