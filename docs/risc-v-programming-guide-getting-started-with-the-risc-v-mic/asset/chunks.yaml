    [content]\n● Avoid changing the output state of pins too quickly, as it may lead\
    \ to undesired behaviors, such as power spikes.\n\n***\n\n# 5. Read Pin State\n\
    \n## What is Reading Pin State?\nReading a pin’s state allows the microcontroller\
    \ to detect if an input-configured pin is `HIGH` or `LOW`, useful for button presses,\
    \ switches, or sensor signals.\n\n### Use Purpose\n● Detect Button Presses: Helps\
    \ determine if a button or switch is activated.\n● Monitor External Signals: Reads\
    \ the status of devices like digital sensors.\n\n### Syntax\n`GPIO_IN & (1 <<\
    \ PIN)`\n\n### Syntax Explanation\n● `GPIO_IN`: Register for reading the current\
    \ state of GPIO pins. Each bit represents the state of a corresponding pin.\n\
    ● `&`: Bitwise `AND` operator, which isolates the specific bit associated with\
    \ the pin, allowing for targeted state checking.\n● `(1 << PIN)`: Shifts the bit\
    \ `1` to the specified pin’s position, creating a mask to isolate the state of\
    \ that pin in `GPIO_IN`.\n\n### Simple Code Example\n```c\nif (GPIO_IN & (1 <<\
    \ 3)) {\n    // Pin 3 is HIGH\n}\n```\n\n### Code Example Explanation\n● Checks\
    \ if pin 3 is `HIGH` by isolating its state using `(1 << 3)` in combination with\
    \ `GPIO_IN`.\n\n### Notes\n● Implement debouncing to ensure accurate button state\
    \ reading.\n\n### Warnings\n● Unconnected or floating input pins may give unreliable\
    \ readings; connect them to a pull-up or pull-down resistor as needed.\n\n***\n\
    \n# Relevant Project Section\n\n## Project Name\nButton-Controlled LED\n\n## Project\
    \ Goal\nUse digital I/O on a RISC-V microcontroller to toggle an LED when a button\
    \ is pressed, demonstrating the basics of reading input and writing output.\n\n\
    ### RISC-V Development Environment\nWe will use PlatformIO with Visual Studio\
    \ Code to build, upload, and debug the program.\n\n### RISC-V Microcontroller\n\
    This example uses the SiFive HiFive1 Rev B microcontroller, based on the SiFive\
    \ Freedom E310 RISC-V core.\n\n### Requirement Components\n● SiFive HiFive1 Rev\
    \ B Microcontroller\n● Button connected to an input pin\n● LED connected to an\
    \ output pin\n\n### Component Connection Table\n| Component | RISC-V Pin | Additional\
    \ Notes |\n| Button | GPIO Pin | Used to control LED toggle functionality |\n\
    | LED | GPIO Pin | Turns on/off based on button state |\n\n### Connection Analysis\n\
    In this project, the button provides input to the microcontroller, allowing it\
    \ to detect when the button is pressed. When a press is detected, the microcontroller\
    \ toggles the state of an LED. The button is connected to a GPIO pin configured\
    \ as an `INPUT`, while the LED is connected to a GPIO pin configured as an `OUTPUT`.\n\
    \n### Program Software Setup\n1. Open Visual Studio Code with PlatformIO installed.\n\
    2. Create a new PlatformIO project and select SiFive HiFive1 Rev B as the board.\n\
    3. Write code to initialize the LED and button pins, read the button’s state,\
    \ and toggle the LED accordingly.\n\n### Project Code\n```c\n#include <stdint.h>\n\
    #include \"hifive1_gpio.h\" // Include GPIO library (adjust for your SDK)\n\n\
    const int BUTTON_PIN = 2; // Example GPIO pin for the button\nconst int LED_PIN\
    \ = 13; // Example GPIO pin for the LED\n\n// Variable to keep track of the LED\
    \ state\nint ledState = 0;\n\nvoid setup() {\n    // Set LED pin as OUTPUT\n \
    \   GPIO_DIR |= (1 << LED_PIN);\n    // Set BUTTON pin as INPUT\n    GPIO_DIR\
    \ &= ~(1 << BUTTON_PIN);\n    // Initialize LED to be OFF\n    GPIO_OUT &= ~(1\
    \ << LED_PIN);\n}\n\nvoid toggleLED() {\n    if (ledState) {\n        // Turn\
    \ off LED if it's currently on\n        GPIO_OUT &= ~(1 << LED_PIN);\n    } else\
    \ {\n        // Turn on LED if it's currently off\n        GPIO_OUT |= (1 << LED_PIN);\n\
    \    }\n    // Toggle the ledState variable to keep track\n    ledState = !ledState;\n\
    }\n\nint main() {\n    setup();\n    while (1) {\n        // Read the current\
    \ state of the button\n        int buttonState = (GPIO_IN & (1 << BUTTON_PIN))\
    \ != 0;\n        // If button is pressed, toggle LED\n        if (buttonState)\
    \ {\n            toggleLED();\n            // Debounce delay to prevent multiple\
    \ toggles on a single press\n            for (volatile int i = 0; i < 100000;\
    \ i++); // Simple delay\n        }\n        // Small delay to avoid rapid re-checking\n\
    \        for (volatile int i = 0; i < 1000; i++);\n    }\n}\n```\n\n### Save and\
    \ Run\n1. Save, compile, and upload the code to the SiFive HiFive1 Rev B board\
    \ using PlatformIO.\n2. Press the button to toggle the LED’s state, observing\
    \ it turn on or off with each press.\n\n### Check Output\n● The LED should toggle\
    \ between ON and OFF with each press of the button. This behavior confirms that\
    \ the microcontroller can successfully read the button’s state and control the\
    \ LED through digital I/O.\n\n## Analog I/O in C for RISC-V Microcontrollers\n\
    \n### Chapter Overview\nAnalog I/O (Input/Output) operations allow the microcontroller\
    \ to interact. (Note: The source text contained repetitive sentences here).\n\n\
    ### Chapter Goal\nAnalog-to-Digital Conversion (ADC) is essential for reading\
    \ analog signals.\n\n### Rules\n● Set Up ADC Correctly\n● Use Scaling\n● Consider\
    \ Signal Filtering\n● Optimize Sampling Rate\n\n### Brief Introduction to Analog/O\n\
    Analog I/O (Input/Output) operations allow the microcontroller to interact. (Note:\
    \ The source text contained repetitive sentences here).\n\n### Explanation of\
    \ ADC Calculation\nAn ADC (Analog-to-Digital Converter) converts an input voltage\
    \ into a digital value. To calculate the corresponding voltage for a given ADC\
    \ value, we use this formula:\n`V = (ADC_Value * Vref) / (2^n)`\n\n### What is\
    \ an ADC?\n* An ADC samples an analog signal (voltage) and converts it into a\
    \ digital number.\n* The range of values the ADC can output depends on its resolution,\
    \ which is defined by the number of bits it uses.\n\n### Example ADC Calculation\n\
    For a 10-bit ADC\nThe resolution of an ADC is determined by the formula:\n`Resolution\
    \ = 2^n`\nWhere:\n* `n`=Number of bits of the ADC\nFor a 10-bit ADC, the resolution\
    \ is 2^10 = 1024 levels (values from 0 to 1023).\nThis means the ADC has 1024\
    \ possible levels, ranging from 0 to 1023.\n\nFor a 12-bit ADC\nFor a 12-bit ADC,\
    \ the resolution is:\n`Resolution = 2^12`\nFor a 12-bit ADC, the resolution is\
    \ 2^12 = 4096 levels (values from 0 to 4096).\n\n### Understanding the Formula\n\
    (a) Normalized Value\nThe normalized value is calculated as:\n`Normalized_Value\
    \ = ADC_Value / (2^n)`\nThis part gives the proportion of the reference voltage\
    \ represented by the ADC value.\nFor example:\n* If the ADC Value is 512 (halfway\
    \ in a 10-bit range), this fraction would be 0.5.\nThis means the ADC value represents\
    \ 50% of the reference voltage.\n\nReference Voltage\n* The reference voltage\
    \ defines the maximum voltage the ADC can measure.\n* If the reference voltage\
    \ is 3.3V, the ADC will map:\n    * 0 to 0V\n    * 1023 (or Max ADC Value) to\
    \ 3.3\n"
