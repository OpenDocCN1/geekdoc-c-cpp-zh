  trans: "\n\n● `name`: 要禁用的外设名称，例如 `UART`、`ADC` 或 `PWM`。\n\n###简单代码示例\n```\ndisable_peripheral(UART);\n\
    ```\n\n### 代码示例解释\n● 禁用 `UART` 外设，通过关闭其电路来节省电源。\n\n### 注意事项\n● 在使用前重新启用外设。\n\n\
    ### 警告\n● 在禁用之前确保该外设未被使用，否则可能会导致运行问题。\n\n***\n\n***\n\n# 4. 启用外设 (enable_peripheral)\n\
    \n### 什么是启用外设？\n`enable_peripheral` 函数用于重新激活之前关闭的特定外设，使其恢复工作。\n\n### 用途\n● **根据需要重新激活外设**：控制外设的激活以动态管理功耗。\n\
    ● **选择性用电**：根据应用需求重新启用组件。\n\n### 语法\n```\nenable_peripheral(name);\n```\n\n###\
    \ 语法解释\n● `name`: 要启用的外设名称，例如 `UART`、`ADC` 或 `PWM`。\n\n###简单代码示例\n```\nenable_peripheral(UART);\n\
    ```\n\n### 代码示例解释\n● 启用 `UART` 外设，使其在禁用后恢复功能。\n\n### 注意事项\n● 有策略性地使用 `enable/disable`\
    \ 命令来控制功耗。\n\n### 警告\n● 仅在必要时启用外设，以避免过度耗电。\n\n***\n\n***\n\n# 5. 持续睡眠 (sleep)\n\
    \n### 什么是持续睡眠？\n`sleep` 函数让微控制器暂停运行指定的毫秒数，以便在非活动期间节省电源。\n\n### 用途\n● **定时降低功耗**：在固定时间内临时减少功耗消耗。\n\
    ● **带省电功能的简单延迟**：非常适用于低功耗应用中的非关键延迟。\n\n### 语法\n```\nsleep(duration);\n```\n\n\
    ### 语法解释\n● `duration`: 微控制器应保持在低功耗睡眠模式的时间（单位：毫秒）。\n\n###简单代码示例\n```\nsleep(500);\
    \ // 睡眠 500 毫\n```\n\n### 代码示例解释\n● 在恢复操作之前让微控制器进入睡眠模式 500 毫秒。\n\n### 注意事项\n●\
    \ 适用于固定延迟，在等待期间使用极低功率。\n\n### 警告\n● 确保关键任务不会因为 `sleep` 命令被无意延迟。\n\n***\n\n***\n\
    \n## 相关项目章节\n\n### 项目名称\n带按键唤醒的低功率 LED 控制\n\n### 项目目标\n在 RISC-V 微控制器上使用电源管理函数进入睡眠模式并在按下按钮时唤醒。该项目演示了如何使用睡眠模式和唤醒源来有效控制功耗。\n\
    \n### RISC-V 开发环境\n此项目将使用 Visual Studio Code 中的 PlatformIO。\n\n### RISC-V 微控制器\n\
    我们将使用 SiFive HiFive1 Rev B 微控制器进行此项目。\n\n### 组件\n● SiFive HiFive1 Rev B 微控制器\n\
    ● 连接到 GPIO 引脚的 LED，用于指示活动状态\n● 连接到 GPIO 引脚的按键，用于唤醒\n\n### 组件连接表\n| 组件 | RISC-V\
    \ 引脚 | 备注 |\n| :--- | :--- | :--- |\n| LED | GPIO Pin 2 | 指示微控制器活动状态 |\n| 按钮 |\
    \ GPIO Pin 3 | 作为睡眠模式的唤醒源 |\n\n### 连接分析\nLED 用于显示微控制器的活动状态，而则作为外部唤醒源。当按下按钮时，它会从睡眠模式中唤醒微控制器，LED\
    \ 会短暂亮起以指示活动状态。\n\n### 程序软件设置\n1. 打开 Visual Studio Code 并创建一个新的 PlatformIO 项目。\n\
    2. 设置 LED 和按钮的 GPIO 引脚。\n3. 实现进入睡眠模式的代码、将按键配置为唤醒源并控制 LED。\n\n### 项目代码\n```c\n\
    #include <stdint.h>\n#include <stdio.h>\n\n#define LED_PIN 2               //\
    \ LED 的 GPIO 引脚\n#define BUTTON_PIN 3             // 按钮的 GPIO 引脚\n\nvoid setup()\
    \ {\n  GPIO_DIR |= (1 << LED_PIN);      // 设置 LED 引脚为输出\n  GPIO_DIR &= ~(1 <<\
    \ BUTTON_PIN);  // 设置按钮引脚为输入\n  set_wakeup_source(BUTTON_PIN);   // 将按键配置为唤醒源\n\
    }\n\nvoid blinkLED() {\n  GPIO_OUT |= (1 << LED_PIN);      // 开启 LED\n  sleep(200);\
    \                      // 保持 LED 开启 200 毫秒\n  GPIO_OUT &= ~(1 << LED_PIN);   \
    \  // 关闭 LED\n}\n\nint main() {\n  setup();\n  while (1) {\n    enter_sleep_mode();\n\
    \  }\n}\n```\n\n*** \n\n## 内存管理与 EEPROM 使用\n\n### 章节概述\n嵌入式系统中的内存通常有限，因此高效的分配和使用至关重要。EEPROM（电可擦除可编程读存储器）提供了非易失性存储，允许数据持久化。\n\
    \n### 章节目标\n● 理解内存管理和 EEPROM。\n● 学习读写 EEPROM。\n\n### 规则\n● 高效使用内存：最小化动态分配。\n●\
    \ 存储持久性数据：在电源周期期间使用 EEPROM。\n● 清除未使用内存：使用后释放动态内存。\n\n### 简介介绍\n动态内存（`malloc`,\
    \ `free`）允许灵活的内存使用，但不当当会导致内存碎片。\n\n### 语法表\n| 序号 | 主题 | 语法 | 简单示例 |\n| :--- |\
    \ :--- | :--- | :--- |\n| 1 | 动态分配 | `malloc(size);` | `int *ptr = malloc(10);`\
    \ |\n| 2 | 释放内存 | `free(ptr);` | `free(ptr);` |\n| 3 | EEPROM 写入 | `eeprom_write(addr,\
    \ data);` | `eeprom_write(0x10, 45);` |\n| 4 | EEPROM 读取 | `eeprom_read(addr);`\
    \ | `int data = eeprom_read(0x10);` |\n| 5 | EEPROM 更新 | `eeprom_update(addr,\
    \ data);` | `eeprom_update(0x10, 45);` |\n\n***\n\n## 各命令详解\n\n### 1. 动态分配 (malloc)\n\
    \n### 什么是动态分配？\n`malloc` 用于在运行时分配内存，对于内存大小在执行过程中变化的应用程序至关重要。它返回指向分配内存的指针。\n\n\
    ### 用途\n● **灵活内存使用**：根据需要分配内存。\n● **缓冲区**：用于创建临时缓冲区或数据存储区域。\n\n### 语法\n```\nmalloc(size);\n\
    ```\n\n### 语法解释\n● `size`：要分配的内存大小（单位：字节）。\n\n###简单代码示例\n```c\nint *data = (int\
    \ *)malloc(10 * sizeof(int));\n```\n\n### 代码示例解释\n为 10 个整数分配内存并赋值给指针 `data`。\n\
    \n### 注意事项\n● 始终检查 `malloc` 是否返回 `NULL`，这表示分配失败。\n\n### 警告\n忘记释放分配的内存会导致内存泄漏，特别是在大型或复杂的程序中。\n\
    \n***\n\n### 2. 释放内存 (free)\n\n### 什么是释放内存？\n\n"
- fmt: "\nThe `free` function releases memory that was previously allocated with `malloc`,\
    \ making it available for future allocations.\n\n### Use Purpose\n\n- Memory Cleanup:\
    \ Prevents memory leaks by releasing unused memory.\n- Efficient Memory Use: Ensures\
    \ memory is available for other parts of the program.\n\n### Syntax\n\n```c\n\
    free(ptr);\n```\n\n### Syntax Explanation\n\n- `ptr`: The pointer to the memory\
    \ that needs to be freed.\n\n### Simple Code Example\n\n```c\nfree(data);\n```\n\
    \n### Code Example Explanation\n\n- Frees the memory allocated to the `data` pointer,\
    \ making it available for reuse.\n\n### Notes\n\n- Only call `free` on memory\
    \ allocated by `malloc`.\n\n### Warnings\n\n- Avoid using `free` on memory that\
    \ was not dynamically allocated, as this may cause undefined behavior.\n\n***\n\
    \n## 3. EEPROM Write (eeprom_write)\n\n### What is EEPROM Write?\n\n`eeprom_write`\
    \ writes data to a specified EEPROM address, allowing data to be stored permanently\
    \ across power cycles.\n\n### Use Purpose\n\n- Store Persistent Data: Saves data\
    \ that should be retained after a reset or power off.\n- Configuration Settings:\
    \ Useful for storing settings like thresholds or calibration values.\n\n### Syntax\n\
    \n```c\neeprom_write(addr, data);\n```\n\n### Syntax Explanation\n\n- `addr`:\
    \ The EEPROM address where data will be stored.\n- `data`: The data to be written\
    \ to the specified address.\n\n### Simple Code Example\n\n```c\neeprom_write(0x10,\
    \ 45);\n```\n\n### Code Example Explanation\n\n- Writes the value `45` to EEPROM\
    \ address `0x10`.\n\n### Notes\n\n- Writing to EEPROM is slower than regular memory\
    \ access; use it sparingly.\n\n### Warnings\n\n- EEPROM has a limited number of\
    \ write cycles. Avoid frequent writes to prolong memory lifespan.\n\n***\n\n##\
    \ 4. EEPROM Read (eeprom_read)\n\n### What is EEPROM Read?\n\n`eeprom_read` retrieves\
    \ data from a specified EEPROM address, allowing persistent data to be read back\
    \ into the program.\n\n### Use Purpose\n\n- Retrieve Persistent Data: Reads stored\
    \ settings or parameters on startup.\n- Non-volatile Data Access: Provides access\
    \ to data that remains intact after power loss.\n\n### Syntax\n\n```c\neeprom_read(addr);\n\
    ```\n\n### Syntax Explanation\n\n- `addr`: The EEPROM address from which to read\
    \ the data.\n\n### Simple Code Example\n\n```c\nint value = eeprom_read(0x10);\n\
    ```\n\n### Code Example Explanation\n\n- Reads the value stored at EEPROM address\
    \ `0x10` and stores it in `value`.\n\n### Notes\n\n- Reading from EEPROM is slower\
    \ than regular memory; use it only when necessary.\n\n### Warnings\n\n- Avoid\
    \ reading from uninitialized EEPROM addresses, as they may contain unpredictable\
    \ values.\n\n***\n\n## 5. EEPROM Update (eeprom_update)\n\n### What is EEPROM\
    \ Update?\n\n`eeprom_update` checks if the data at the specified address already\
    \ matches the new data before writing. This minimizes unnecessary writes, extending\
    \ the EEPROM’s life.\n\n### Use Purpose\n\n- Optimize EEPROM Writes: Reduces wear\
    \ on EEPROM by only writing data if it has changed.\n- Efficient Persistent Storage:\
    \ Maintains data integrity with minimal writes.\n\n### Syntax\n\n```c\neeprom_update(addr,\
    \ data);\n```\n\n### Syntax Explanation\n\n- `addr`: The EEPROM address to be\
    \ updated.\n- `data`: The new data to be written if different from the current\
    \ value.\n\n### Simple Code Example\n\n```c\neeprom_update(0x10, 45);\n```\n\n\
    ### Code Example Explanation\n\n- Updates EEPROM address `0x10` with the value\
    \ `45` if it differs from the current stored value.\n\n### Notes\n\n- `eeprom_update`\
    \ is more efficient for high-write applications.\n\n### Warnings\n\n- Use `eeprom_update`\
    \ instead of `eeprom_write` when values may frequently change.\n\n***\n\n## Relevant\
    \ Project Section\n\n### Project Name\nSettings Storage with EEPROM for a RISC-V\
    \ Microcontroller\n\n### Project Goal\nUse EEPROM and memory management functions\
    \ to store and retrieve user-defined settings (e.g., a brightness level) on a\
    \ RISC-V microcontroller. The settings persist even when the microcontroller is\
    \ powered off, demonstrating effective EEPROM use.\n\n### RISC-V Development Environment\n\
    This project will use PlatformIO in Visual Studio Code.\n\n### RISC-V Microcontroller\n\
    We will use the SiFive HiFive1 Rev B microcontroller for this project.\n\n###\
    \ Requirement Components\n\n- SiFive HiFive1 Rev B Microcontroller\n- Push Button\
    \ to adjust settings\n- LED connected to GPIO to display brightness level based\
    \ on settings\n\n### Component Connection Table\n\n| Component | RISC-V Pin |\
    \ Additional Notes |\n| :--- | :--- | :--- |\n| LED | GPIO Pin 2 | Indicates brightness\
    \ level |\n| Push Button | GPIO Pin 3 | Adjusts brightness level and stores in\
    \ EEPROM |\n\n### Connection Analysis\nThe push button is used to change the brightness\
    \ level of the LED. The brightness level is saved to EEPROM and retrieved after\
    \ a reset, allowing the system to remember the last setting. This project demonstrates\
    \ how to write, read, and update values in EEPROM, along with dynamic memory handling.\n\
    \n### Program Software Setup\n1. Use PlatformIO in Visual Studio Code.\n2. Configure\
    \ GPIO pins for LED and button.\n3. Implement code to store and retrieve brightness\
    \ level.\n\n```c\n#include <stdint.h>\n#include <stdio.h>\n\n#define LED_PIN 2\n\
    #define BUTTON_PIN 3\n#define EEPROM_ADDR 0x10\n#define MAX_BRIGHTNESS 5\n\nint\
    \ brightness;\n\nvoid setup() {\n    GPIO_DIR |= (1 << LED_PIN);\n    GPIO_DIR\
    \ &= ~(1 << BUTTON_PIN);\n\n    brightness = eeprom_read(EEPROM_ADDR);\n    if\
    \ (brightness > MAX_BRIGHTNESS || brightness < 0) {\n        brightness = 0;\n\
    \    }\n}\n\nvoid adjustBrightness() {\n    brightness = (brightness + 1) % (MAX_BRIGHTNESS\
    \ + 1);\n    eeprom_update(EEPROM_ADDR, brightness);\n\n    if (brightness > 0)\
    \ {\n        GPIO_OUT |= (1 << LED_PIN);\n    } else {\n        GPIO_OUT &= ~(1\
