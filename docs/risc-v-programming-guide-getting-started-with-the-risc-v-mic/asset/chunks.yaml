    ## Comparison Operators in C for RISC-V Microcontrollers


    Chapter Overview


    Comparison operators allow programs to evaluate relationships between values,
    enabling decision-making based on conditions. In embedded programming for RISC-V
    microcontrollers, comparison operators help assess sensor data, control devices,
    and manage flow based on criteria. This chapter covers the primary comparison
    operators, their syntax, and applications in embedded systems.


    Chapter Goal


    ● Understand how to use comparison operators (==,  !=, >, <,  >=,  <=) in embedded
    C programming.


    ● Learn to apply these operators in decision-making processes to manage tasks
    and responses based on conditions.


    ● Implement a project that uses comparison operators to evaluate sensor data and
    control an output based on conditions.


    Rules


    ● Use Meaningful Conditions: Keep conditions clear and logical for code readability
    and maintainability.


    ● Avoid Complex Expressions: Break down complex conditions into simpler expressions
    for efficiency.


    ● Check for Data Type Compatibility: Ensure that data types are compatible with
    comparison operations to avoid unexpected results.


    ● Use Parentheses for Clarity: Enclose complex expressions in parentheses to clarify
    evaluation order.


    Brief Introduction to Comparison Operators


    Comparison operators assess the relationship between two values, resulting in
    a boolean outcome (true or  false). In C programming, these operators include  ==
    (equal),  != (not equal), > (greater than), < (less than),  >= (greater than or
    equal), and  <= (less than or equal). Comparison operations are crucial for creating
    conditional statements that guide microcontroller behavior based on sensor data,
    user input, or state changes.


    Syntax Table


    | Serial No | Topic | Syntax | Simple Example |


    | 1 | Equal to | a == b | if (temp == 25) |


    | 2 | Not Equal to | a != b | if (mode != 1) |


    | 3 | Greater than | a > b | if (speed > 50) |


    | 4 | Less than | a < b | if (voltage < 3.3) |


    | 5 | Greater than or Equal | a >= b | if (score >= 100) |


    | 6 | Less than or Equal | a <= b | if (distance <= 10) |


    * * *


    Detailed Breakdown for Each Command


    1\. Equal to (==)


    What is Equal to?


    The  == operator checks if two values are equal, returning  true if they match.
    This operator is commonly used to verify conditions, such as checking if a sensor
    value equals a specified threshold.


    Use Purpose


    ● Equality Check: Verify if two values are the same, such as verifying modes or
    states.


    ● Conditional Execution: Use in  if statements to perform actions when two values
    match.


    Syntax


    a == b;


    Syntax Explanation


    ● a and b: The two values or variables being compared. If a and b are equal, the
    result is  true.


    Simple Code Example


    int temp =  25;


    if  (temp ==  25)  {


    GPIO_OUT |=  (1  << FAN_PIN);  // Turn on fan if temperature is 25


    }


    Code Example Explanation


    ● Checks if  temp equals 25\. If true, it turns on the fan.


    Notes


    ● Use  == for equality comparison; do not confuse it with = (assignment operator).


    Warnings


    ● Ensure both values are of compatible data types to avoid unexpected behavior.


    * * *


    2\. Not Equal to (!=)


    What is Not Equal to?


    The  != operator checks if two values are different, returning  true if they do
    not match. It is useful for executing code when a value deviates from an expected
    state.


    Use Purpose


    ● Inequality Check: Triggers actions if two values are not the same, such as handling
    error states.


    ● Condition for Loops: Use in loops to continue operations until values match.


    Syntax


    a != b;


    Syntax Explanation


    ● a and b: The two values or variables being compared. The result is  true if
    a and b are not equal.


    Simple Code Example


    int mode =  2;


    if  (mode !=  1)  {


    GPIO_OUT &=  ~(1  << LED_PIN);  // Turn off LED if mode is not 1


    }


    Code Example Explanation


    ● Checks if  mode is not equal to 1\. If true, it turns off the LED.


    Notes


    ● != is particularly useful in cases where an exact match is not needed.


    * * *


    3\. Greater than (>)


    What is Greater than?


    The > operator checks if one value is larger than another, commonly used in control
    systems to trigger actions when a value exceeds a limit.


    Use Purpose


    ● Threshold Checking: Monitor if values exceed specific limits, like speed or
    temperature.


    ●      Event Triggers: Execute code when a parameter surpasses a predefined value.


    Syntax


    a > b;


    Syntax Explanation


    ● a and b: Values or variables being compared. The result is  true if a is greater
    than b.


    Simple Code Example


    int speed =  60;


    if  (speed >  50)  {


    GPIO_OUT |=  (1  << ALARM_PIN);  // Trigger alarm if speed is above 50


    }


    Code Example Explanation


    ● Checks if  speed is greater than 50\. If true, it triggers an alarm.


    Notes


    ●      Ideal for control limits and thresholds in embedded systems.


    Warnings


    ●      Ensure that values are within range to avoid incorrect comparisons.


    * * *


    4\. Less than (<)


    What is Less than?


    The < operator checks if one value is smaller than another, useful for maintaining
    values within safe limits or managing low thresholds.


    Use Purpose


    ● Low-Level Checking: Triggers actions if a value falls below a minimum threshold.


    ●      Control System Limits: Ensures values remain within safe operating ranges.


    Syntax


    a < b;


    Syntax Explanation


    ● a and b: Values or variables being compared. The result is  true if a is less
    than b.


    Simple Code Example


    float voltage =  3.0;


    if  (voltage <  3.3)  {


    GPIO_OUT |=  (1  << LOW_POWER_PIN);  // Activate low power mode if voltage is
    below 3.3V


    }


    Code Example Explanation


    ● Checks if  voltage is less than 3.3V. If true, it activates low power mode.


    Notes


    ●      Useful in applications with minimum operating thresholds.


    Warnings


    ●      Always ensure reliable sensor readings to avoid false triggers.


    * * *


    5\. Greater than or Equal to (>=)


    What is Greater than or Equal to?


    The  >= operator checks if one value is greater than or equal to another. This
    operator is helpful for ensuring values meet or exceed minimum criteria.


    Use Purpose


    ●      Boundary Conditions: Ensures that values meet or exceed a minimum level.


    ● Control Logic: Triggers events when a parameter reaches or surpasses a set point.


    Syntax


    a >= b;


    Syntax Explanation


    ● a and b: Values or variables being compared. The result is  true if a is greater
    than or equal to b.


    Simple Code Example


    int score =  100;


    if  (score >=  100)  {


    GPIO_OUT |=  (1  << SUCCESS_PIN);  // Indicate success if score is 100 or more


    }


    Code Example Explanation


    ● Checks if  score is greater than or equal to 100\. If true, it indicates success.


    Notes


    ●      Ideal for handling minimum achievement criteria.


    Warnings


    ●      Ensure values are correctly initialized before comparison.


    * * *


    6\. Less than or Equal to (<=)


    What is Less than or Equal to?


    The  <= operator checks if one value is less than or equal to another. This operator
    is used for maximum limit checks, ensuring values stay below or at a set maximum.


