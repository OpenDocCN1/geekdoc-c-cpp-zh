    ## 针对 RISC-V 微控制器的 C 语言随机数\n\n### 章节概述\n\n随机数对于需要变数的应用至关重要，例如模拟、测试、游戏和随机响应。在 RISC-V\
    \ 微控制器的嵌入式编程中，随机数可以为控制系统、数据采样和安全协议引入随机性。本章将介绍随机数生成技术、其用法以及如何实现基于随机数的项目。\n\n###\
    \ 章节目标\n\n● 理解如何为 RISC-V 微控制器使用 C 语言生成随机数。\n● 学习在嵌入式应用中设置种子并使用随机数函数以实现变数。\n● 实现一个使用随机数控制\
    \ LED 模式的项目。\n\n### 规则\n\n● **设置随机数种子以实现真随机性**：始终使用唯一的种子以避免重复的结果。\n● **避免在时间敏感型代码中使用\
    \ `rand()`**：生成随机数可能需要时间；避免在关键区域内过度使用。\n● **考虑硬件限制**：某些微控制器可能不支持复杂的随机数生成；请根据情况使用软件解决方案。\n\
    ● **范围边界**：确保随机值落在目标范围内，以避免越界问题。\n\n### 随机数简要介绍\n\nC 语言中的随机数生成使用诸如 `rand()` 等函数来产生伪随机值。默认情况下，`rand()`\
    \ 每次都会生成相同的序列，但通过 `srand()` 对其进行种子，可以创建唯一的序列。在嵌入式编程中，随机数为应用程序增加了灵活性，能够实现各种响应、随机事件和测试场景。\n\
    \n### 语法表\n\n| 序号 | 主题 | 语法 |\n| :--- | :--- | :--- |\n| 1 | 随机数种子器 | `srand(seed);`\
    \ |\n| 2 | 生成随机数 | `rand()` |\n| 3 | 随机范围 | `rand() % range` |\n\n***\n\n### 每个命令的详细拆解\n\
    \n#### 1. 随机数种子器 (srand)\n\n**什么是随机数种子器？**\n\n`srand` 函数为随机数生成器设置种子，设定随机值序列的起点。如果不设置种子，`rand()`\
    \ 在每次运行时都会产生相同的序列。\n\n**用途**\n\n● **确保变数性**：为随机数生成器设置种子以产生唯一的随机序列。\n● **增强随机性**：添加种子（如传感器读取值）可以确保结果不可不可预测。\n\
    \n**语法**\n\n`srand(seed);`\n\n**语法解释**\n\n● `seed`：用于初始化随机数生成器的整数值。通常使用动态值（例如传感器读取值）产生唯一的结果。\n\
    \n**简单代码示例**\n```c\nsrand(analogRead(A0)); // 使用模拟传感器读取值作为种子\n```\n\n**代码示例解释**\n\
    \n● 使用模拟传感器读取值为随机数生成器设置种子，以创建唯一的随机值。\n\n**注意**\n\n● 每次使用相同的值设置种子将生成相同的随机序列。\n\n\
    **警告**\n\n● 除非需要重复性，否则避免使用固定值作为种子。\n\n***\n\n#### 2. 生成随机数 (rand)\n\n**什么是生成随机数？**\n\
    \n`rand()` 函数返回一个 0 到 `RAND_MAX` 之间的伪随机整数。它根据初始种子产生值序列。\n\n**用途**\n\n● **生成随机值**：创建伪随机数以实现化的行为。\n\
    ● **模拟与测试**：用于测试环境中的随机输入模拟。\n\n**语法**\n\n`rand();`\n\n**语法解释**\n\n● `rand()`：该函数调用生成一个\
    \ 0 到 `RAND_MAX` 之间的伪随机整数。\n\n**简单代码示例**\n```c\nint num = rand();\n```\n\n**代码示例解释**\n\
    \n● 生成一个随机整数并将其存储在 `num` 中。\n\n**注意**\n\n● 对于特定范围，使用取模运算符 `%` 来限制 `rand()` 的输出。\n\
    \n**警告**\n\n● `rand()` 是伪随机的；在不设置种子的情况下，它提供可预测的结果。\n\n***\n\n#### 3. 随机范围 (rand()\
    \ % range)\n\n**什么是随机范围？**\n\n使用 `rand() % range` 将 `rand()` 的输出限制在特定范围内。该操作返回一个从\
    \ 0 到 `range - 1` 的值。\n\n**用途**\n\n● **受控的随机化**：将随机值限制在所需的范围内，这对于 LED 模式、电机速度或定时非常理想。\n\
    ● **自定义范围控制**：用于为随机数设置边界。\n\n**语法**\n\n`rand() % range;`\n\n**语法解释**\n\n● `rand()`：生成一个伪随机整数。\n\
    ● `% range`：将随机整数限制在 0 到 `range - 1` 之间的值。\n\n**简单代码示例**\n```c\nint randomLED\
    \ = rand() % 5; // 生成一个 0 到 4 之间的随机数\n```\n\n**代码示例解释**\n\n● 生成一个 0 到 4 之间的随机值，适合选择五个\
    \ LED 之一。\n\n**注意**\n\n● 确保 `range` 大于 0 以避免除零错误。\n\n**警告**\n\n● 在 `rand()` 上使用\
    \ `%` 会略微降低随机性，但对于边界值来说通常是可以接受的。\n\n***\n\n### 相关项目章节\n\n#### 项目名称\n随机 LED 模式生成器\n\
    \n#### 项目目标\n\n在 RISC-V 上使用随机数控制 LED 模式。该项目展示了使用 `rand()` 和 `srand()` 的嵌入式应用。\n\
    \n#### RISC-V 开发环境\n\n该项目将在 Visual Studio 中中使用 PlatformIO。\n\n#### RISC-V 微控制器\n\
    \n我们将使用 SiFive HiFive1 Rev B 微控制器。\n\n#### 要求组件\n\n● SiFive HiFive1 Rev B 微控制器\n\
    ● 连接到 GPIO 引脚的随机 LED\n\n#### 组件连接表\n\n| 组件 | RISC-V 引脚 | 备注 |\n| :--- | :--- |\
    \ :--- |\n| LED1 | GPIO Pin 2 | 随机激活 |\n| LED2 | GPIO Pin 3 | 随机激活 |\n| LED3 |\
    \ GPIO Pin 4 | 随机激活 |\n| LED4 | GPIO Pin 5 | 随机激活 |\n| LED5 | GPIO Pin 6 | 随机激活\
    \ |\n\n#### 连接分析\n\n每个 LED 连接到独立的 GPIO 引，以便微控制器控制单个 LED。\n\n#### 程序软件设置\n\n1.\
    \ 打开 Visual Studio Code 创建新的 PlatformIO 项目。\n2. 设置每个 LED 的 GPIO 引脚。\n3. 实现设置随机数生成器并激活\
    \ LED 的。\n\n#### 项目代码\n\n```c\n#include <stdint.h>\n#include <stdio.h>\n#include\
    \ <stdlib.h>\n#include \"hifive1_gpio.h\" // RISC-V GPIO 库\n\n#define NUM_LEDS\
    \ 5\nint ledPins[NUM_LEDS] = {2, 3, 4, 5, 6}; // LED 引脚数组\n\nvoid setup() {\n\
    \  // 初始化每个 LED 引脚为输出\n  for (int i = 0; i < NUM_LEDS; i++) {\n    GPIO_DIR |=\
    \ (1 << ledPins[i]);\n  }\n  // 为随机数生成器设置种子\n  srand(analogRead(0)); // 使用模拟读取作为种子\n\
    }\n\nvoid randomLEDPattern() {\n  int randomLED = rand() % NUM_LEDS; // 选择随机 LED\n\
    \n  // 关闭所有 LED\n  for (int i = 0; i < NUM_LEDS; i++) {\n    GPIO_OUT &= ~(1 <<\
    \ ledPins[i]);\n  }\n  // 打开随机选中的 LED\n  GPIO_OUT |= (1 << ledPins[randomLED]);\n\
    }\n\nint main() {\n  setup();\n  while (1) {\n    randomLEDPattern(); // 激活随机\
    \ LED 模式\n    for (volatile int i = 0; i < 1000000; i++); // 简单延迟\n  }\n}\n```\n\
    \n"
- fmt: "\nTime and counting are fundamental in embedded programming, allowing microcontrollers\
    \ to manage delays, measure durations, and control time-based events. In `RISC-V`\
    \ microcontrollers, these operations are essential for tasks like generating PWM\
    \ signals signals, controlling motors, blinking LEDs, and creating precise timing\
    \ mechanisms. This chapter will cover basic time and counting functions, the syntax\
    \ of time-related commands, and their applications in embedded projects.\n\n##\
    \ Chapter Goal\n\n- Understand the use of time functions and counting loops in\
    \ embedded C programming.\n- Learn to implement delays, count events, and manage\
    \ time-based actions effectively.\n- Implement a project that uses time and counting\
    \ to create an LED blink sequence with precise timing.\n\n## Rules\n\n- Avoid\
    \ Blocking Delays: Use non-blocking delay methods in critical systems to avoid\
    \ slowing down other operations.\n- Consider Timer Accuracy: Be mindful of the\
    \ timer's accuracy for applications requiring precise timing.\n- Optimize Time-Intensive\
    \ Loops: Minimize complex calculations within time loops to maintain efficiency.\n\
    - Use Hardware Timers for Accuracy: For more accurate timing, consider using the\
    \ microcontroller's hardware timers.\n\n## Brief Introduction to Time and Counting\n\
    \nTime and counting functions in C help microcontrollers manage delays and execute\
    \ time-based tasks. Using delay loops and timers, microcontrollers can control\
    \ the duration of events, create periodic actions, and measure elapsed time. Common\
    \ time functions include `delay`, `millis`, and counters to increment values over\
    \ time.\n\n## Syntax Table\n\n| Serial No | Topic | Syntax | Simple Example |\n\
    | :--- | :--- | :--- | :--- |\n| 1 | Delay Loop | `for loop` | `for (i=0; i<delay;\
    \ i++);` |\n| 2 | Milliseconds | `millis()` | `unsigned long time = millis();`\
    \ |\n| 3 | Hardware Timer | `timer_init()` | `timer_init(1000);` |\n| 4 | Event\
    \ Counter | `counter++` | `eventCounter++;` |\n| 5 | Delay Function | `delay(ms)`\
    \ | `delay(1000);` |\n\n## Detailed Breakdown for Each Command\n\n### 1. Delay\
    \ Loop (for loop)\n\n### What is Delay Loop?\nA `for loop` can create a delay\
    \ by counting up to a specific number, creating a software delay without relying\
    \ on hardware timers.\n\n### Use Purpose\n- Simple Delays: Implements basic delays\
    \ in embedded programs.\n- Non-Critical Delays: Useful in non-time-sensitive applications.\n\
    \n### Syntax\n```c\nfor (int i = 0; i < delay; i++);\n```\n\n### Syntax Explanation\n\
    - `i`: Counter variable that iterates until it reaches `delay`.\n- `delay`: Represents\
    \ the number of loop iterations, controlling delay duration.\n\n### Simple Code\
    \ Example\n```c\nfor (int i = 0; i < 100000; i++);\n```\n\n### Code Example Explanation\n\
    - Creates a delay by counting up to 100000, pausing program execution momentarily.\n\
    \n### Notes\n- Delay duration is approximate and depends on the clock speed.\n\
    \n### Warnings\n- Avoid large delays within critical sections to maintain program\
    \ responsiveness.\n\n### 2. Milliseconds (millis)\n\n### What is Milliseconds?\n\
    The `millis` function returns the number of milliseconds since the program started.\
    \ It’s commonly used to track elapsed time or schedule periodic tasks.\n\n###\
    \ Use Purpose\n- Event Scheduling: Tracks time for repeating events.\n- Elapsed\
    \ Time Measurement: Measures the duration between events.\n\n### Syntax\n```c\n\
    millis();\n```\n\n### Syntax Explanation\n- `millis()`: Returns an `unsigned long`\
    \ representing the milliseconds elapsed since the program started.\n\n### Simple\
    \ Code Example\n```c\nunsigned long startTime = millis();\n```\n\n### Code Example\
    \ Explanation\n- Stores the current time in `startTime` to track the beginning\
    \ of an event.\n\n### Notes\n- `millis()` typically rolls over after reaching\
    \ the maximum `unsigned long` value.\n\n### Warnings\n- Be cautious with rollover\
    \ if the program runs for extended periods.\n\n### 3. Hardware Timer (timer_init)\n\
    \n### What is Hardware Timer?\n`timer_init` initializes a hardware timer with\
    \ a specified frequency, offering accurate timing without blocking the CPU. Hardware\
    \ timers are essential for PWM, precise delays, and periodic interrupts.\n\n###\
    \ Use Purpose\n- Accurate Timing: Generates precise time intervals.\n- Periodic\
    \ Actions: Triggers recurring actions, like reading sensors.\n\n### Syntax\n```c\n\
    timer_init(frequency);\n```\n\n### Syntax Explanation\n- `frequency`: Sets the\
    \ timer’s frequency, defining how often it triggers.\n\n### Simple Code Example\n\
    ```c\ntimer_init(1000); // Sets timer to 1kHz\n```\n\n### Code Example Explanation\n\
    - Configures the timer to trigger at 1kHz, useful for 1ms periodic tasks.\n\n\
    ### Notes\n- Hardware timers operate independently, providing accurate timing.\n\
    \n### Warnings\n- Ensure proper timer initialization to avoid conflicts with other\
    \ processes.\n\n### 4. Event Counter (counter++)\n\n### What is Event Counter?\n\
    The `counter++` syntax increments a counter variable, commonly used to count events\
    \ or occurrences.\n\n### Use Purpose\n- Event Counting: Counts the number of times\
    \ an event occurs.\n- Loop Control: Manages iterations within a loop.\n\n### Syntax\n\
    ```c\ncounter++;\n```\n\n### Syntax Explanation\n- `counter`: The variable that\
    \ increments by 1 each time it is accessed.\n\n### Simple Code Example\n```c\n\
    int eventCounter = 0;\neventCounter++;\n```\n\n### Code Example Explanation\n\
    - Increments `eventCounter` by 1, tracking the number of events.\n\n### Notes\n\
    - Counter variables can be reset as needed to restart the count.\n\n### Warnings\n\
    - Prevent overflow by choosing an appropriate data type, such as `unsigned int`.\n\
    \n### 5. Delay Function (delay)\n\n### What is Delay Function?\nThe `delay` function\
    \ pauses program execution for a specified number of milliseconds. It provides\
    \ a simple, blocking delay that’s useful in basic timing control.\n\n### Use Purpose\n\
    - Fixed Duration Delay: Pauses the program temporarily.\n- Timing Control: Controls\
    \ the duration of operations, like LED blink rate.\n\n### Syntax\n```c\ndelay(ms);\n\
    ```\n\n### Syntax Explanation\n- `ms`: The duration in milliseconds.\n\n### Simple\
    \ Code Example\n```c\ndelay(1000);\n```\n\n### Code Example Explanation\n- Pauses\
    \ program execution for 1 second.\n\n### Notes\n- Blocking delays halt program\
    \ execution; use sparingly in time-sensitive systems.\n\n***\n\n***\n\n## Relevant\
    \ Project Section\n\n### Project Name\nLED Blink Sequence with Precise Timing\n\
    \n### Project Goal\nUse time and counting functions on a `RISC-V` microcontroller\
    \ to create an LED blink sequence. This project demonstrates basic delay functions,\
    \ event counters, and timers.\n\n### RISC-V Development Environment\nThis project\
    \ will use `PlatformIO` in `Visual Studio Code`.\n\n### RISC-V Microcontroller\n\
    We will use the `SiFive HiFive1 Rev B` microcontroller for this project.\n\n###\
    \ Requirement Components\n- `SiFive HiHigh1 Rev B Microcontroller`\n- LED connected\
    \ to a GPIO pin for timing control\n\n### Component Connection Table\n| Component\
    \ | RISC-V Pin | Additional Notes |\n| :--- | :--- | :--- |\n| LED | GPIO 2 |\
    \ Controls LED timing |\n\n### Connection Analysis\nThe LED is connected to a\
    \ GPIO pin. Using time functions, the microcontroller controls the LED blink interval,\
    \ creating a sequence with a precise timing pattern.\n\n### Program Software Setup\n\
    1. Open `Visual Studio Code` and create a new `PlatformIO` project.\n2. Set up\
    \ the GPIO pin for the LED.\n3. Implement code using delays, counters, and timers\
    \ to create a blink sequence.\n\n### Project Code\n```c\n#include <stdint.h>\n\
    #include <stdio.h>\n\n#define LED_PIN 2 // GPIO pin for LED\n#define BLINK_INTERVAL\
    \ 1000 // 1-second blink interval\n\nvoid setup() {\n    GPIO_DIR |= (1 << LED_PIN);\
    \ // Set LED pin as output\n}\n\nvoid blinkLED() {\n    GPIO_OUT ^= (1 << LED_PIN);\
    \ // Toggle LED state\n}\n\nint main() {\n    setup();\n    unsigned long previousMillis\
    \ = 0;\n    while (1) {\n        unsigned long currentMillis = millis();\n   \
    \     // Check if the interval has passed\n        if (currentMillis - previousMillis\
