- fmt: "\n# Debugging and Testing in RISC-V Microcontrollers\n\n## Chapter Overview\n\
    Debugging and testing are crucial for identifying and fixing issues in embedded\
    \ programs, ensuring code reliability and performance. Effective debugging techniques\
    \ allow developers to trace issues, understand code behavior, and verify system\
    \ functionality. Testing involves systematically checking code behavior, verifying\
    \ correctness, and ensuring the system meets design requirements. In this chapter,\
    \ we will cover common debugging tools, techniques, and testing strategies for\
    \ RISC-V microcontrollers.\n\n## Chapter Goal\n- Understand debugging tools and\
    \ techniques available for RISC-V microcontrollers.\n- Learn how to set breakpoints,\
    \ step through code, and use serial debugging.\n- Implement a project that demonstrates\
    \ debugging by testing a temperature sensor’s data output and analyzing issues.\n\
    \n## Rules\n- Use Breakpoints for Step-by-Step Debugging: Breakpoints allow code\
    \ inspection without interrupting the entire program.\n- Implement Serial Debugging\
    \ Messages: Use serial output to check variable values and system states.\n- Verify\
    \ Code Logic with Unit Tests: For critical functions, create small test cases\
    \ to confirm correct functionality.\n- Record Test Results and Issues: Maintain\
    \ a log of errors and solutions to improve future debugging and development processes.\n\
    \n## Brief Introduction to Debugging and Testing\nDebugging in embedded systems\
    \ involves using tools to identify and fix errors in code. Serial debugging, breakpoints,\
    \ and watches help track variable states and execution flow. Testing involves\
    \ running the program under different conditions to check for bugs or logical\
    \ errors. Testing techniques, such as unit testing and functional testing, help\
    \ ensure that each part of the system performs as expected.\n\n## Syntax Table\n\
    | Serial No | Topic | Syntax | Simple Example |\n| :--- | :--- | :--- | :--- |\n\
    | 1 | Serial Print Debugging | `printf(\"message\");` | `printf(\"Value: %d\\\
    n\", val);` |\n| 2 | Breakpoint | `// Set breakpoint here` | `// Debug here` |\n\
    | 3 | Watch Variable | `watch variable_name;` | `watch counter;` |\n| 4 | Step\
    \ Over | `step_over();` | `step_over();` |\n| 5 | Unit Test Function | `void test_function();`\
    \ | `void test_addition();` |\n\n## Detailed Breakdown for Each Command\n\n###\
    \ 1. Serial Print Debugging (printf)\n#### What is Serial Print Debugging?\nSerial\
    \ print debugging involves sending messages or variable values over the serial\
    \ interface, allowing developers to observe code execution and inspect values\
    \ in real-time.\n\n#### Use Purpose\n- Monitor Variable Values: Provides visibility\
    \ into variable states during runtime.\n- Track Program Flow: Helps in understanding\
    \ the sequence of code execution.\n\n#### Syntax\n```c\nprintf(\"message\");\n\
    ```\n\n#### Syntax Explanation\n- `\"message\"`: The text or variable to be displayed\
    \ on the serial monitor.\n\n#### Simple Code Example\n```c\nint value = 10;\n\
    printf(\"Value: %d\\n\", value);\n```\n\n#### Code Example Explanation\n- Sends\
    \ the message `Value: 10` to the serial monitor, displaying the variable `value`.\n\
    \n#### Notes\n- Use `\\n` for a new line in the serial output to improve readability.\n\
    \n#### Warnings\n- Excessive print statements may slow down the program; use them\
    \ selectively.\n\n### 2. Breakpoint\n#### What is a Breakpoint?\nA breakpoint\
    \ is a marker in code where execution pauses, allowing developers to inspect variable\
    \ states and code behavior at a specific point.\n\n#### Use Purpose\n- Pause Execution:\
    \ Stops the program to allow code inspection.\n- Analyze Code Flow: Identifies\
    \ which parts of the code execute and helps locate errors.\n\n#### Syntax\n```c\n\
    // Set breakpoint here\n```\n\n#### Syntax Explanation\n- `// Set breakpoint here`:\
    \ Placeholder indicating where to place a breakpoint in debugging software.\n\n\
    #### Simple Code Example\n```c\nint counter = 0; // Set breakpoint here\ncounter++;\n\
    ```\n\n#### Code Example Explanation\n- Sets a breakpoint on `counter = 0;`, pausing\
    \ execution before `counter` is incremented.\n\n#### Notes\n- Breakpoints are\
    \ set in the IDE/debugging tool, not directly in code.\n\n#### Warnings\n- Ensure\
    \ breakpoints are removed in final production code to prevent interruptions.\n\
    \n### 3. Watch Variable\n#### What is Watch Variable?\nA watch allows developers\
    \ to monitor specific variables as the program executes, helping to track changes\
    \ in value.\n\n#### Use Purpose\n- Track Variable Changes: Observes how a variable’s\
    \ value changes throughout the program.\n- Identify Logic Errors: Detects unexpected\
    \ changes that may indicate bugs.\n\n#### Syntax\n```c\nwatch variable_name;\n\
    ```\n\n#### Syntax Explanation\n- `variable_name`: The variable being monitored.\n\
    \n#### Simple Code Example\n```c\nint temperature = 25; // Watch temperature\n\
    temperature += 5;\n```\n\n#### Code Example Explanation\n- Sets a watch on `temperature`,\
    \ tracking its value as it changes.\n\n#### Notes\n- Watches are often set up\
    \ in debugging software, not directly in the code.\n\n#### Warnings\n- Watches\
    \ can slow down debugging in complex programs; use only essential variables.\n\
    \n### 4. Step Over (step_over)\n#### What is Step Over?\nStep Over is a debugging\
    \ command that allows developers to execute one line of code at a time without\
    \ entering functions, useful for observing execution without diving into each\
    \ function.\n\n#### Use Purpose\n- Inspect Code Line-by-Line: Allows precise control\
    \ over code execution for detailed analysis.\n- Skip Function Details: Executes\
    \ functions without entering them, useful for large or well-tested functions.\n\
    \n#### Syntax\n```c\nstep_over();\n```\n\n#### Syntax Explanation\n- No parameters;\
    \ simply advances code execution to the next line.\n\n#### Simple Code Example\n\
    ```c\nint result = add(3, 5);\n```\n\n#### Code Example Explanation\n- Steps over\
    \ the `add` function.\n\n#### Notes\n- Step Over is used in debugging software,\
    \ not directly in the code.\n\n#### Warnings\n- Use with discretion; complex function\
    \ calls may require stepping into.\n\n### 5. Unit Test Function (void test_function)\n\
    #### What is Unit Test Function?\nA unit test function verifies the correctness\
    \ of a specific function or code segment by running predefined test cases.\n\n\
    #### Use Purpose\n- Validate Function Logic: Ensures each function performs as\
    \ expected.\n- Detect Early Errors: Helps catch issues before integrating functions\
    \ into systems.\n\n#### Syntax\n```c\nvoid test_function();\n```\n\n#### Syntax\
    \ Explanation\n- `test_function`: A self-contained function created for testing\
    \ others.\n\n#### Simple Code Example\n```c\nvoid test_addition() {\n    int result\
    \ = add(3, 5);\n    if (result == 8) {\n        printf(\"Test Passed\\n\");\n\
    \    } else {\n        printf(\"Test Failed\\n\");\n    }\n}\n```\n\n#### Code\
    \ Example Explanation\n- Tests the `add` function by checking if the result of\
    \ `add(3, 5)` is 8.\n\n#### Notes\n- Unit tests should cover edge cases to ensure\
    \ robustness.\n\n#### Warnings\n- Ensure test cases are independent and do not\
    \ rely on other tests to function correctly.\n\n## Relevant Project Section\n\n\
    ### Project Name\nDebugging a Temperature Monitoring System\n\n### Project Goal\n\
    Use debugging techniques to test and verify the accuracy of a temperature monitoring\
    \ system on a RISC-V microcontroller. This project demonstrates using serial print\
    \ statements, breakpoints, and unit tests to troubleshoot and ensure reliable\
    \ functionality.\n\n### RISC-V Development Environment\nThis project will use\
    \ PlatformIO in Visual Studio Code.\n\n### RISC-V Microcontroller\nWe will use\
    \ the SiFive HiFive1 Rev B microcontroller.\n\n### Requirement Components\n- SiFive\
    \ HiFive1 Rev B Microcontroller\n- Analog Temperature Sensor connected to an ADC\
    \ pin\n- Serial Monitor to display debug messages and values\n\n### Connection\
    \ Table\n| Component | RISC-V Pin | Additional Notes |\n| :--- | :--- | :--- |\n\
    | Temperature Sensor | ADC Pin | Analog temperature data input |\n| Serial Interface\
    \ | UART Pins | Displays debug output in terminal |\n\n### Connection Analysis\n\
    The temperature sensor provides an analog reading based on temperature. The microcontroller\
    \ reads and processes this data, using serial debugging to display values and\
    \ verify system performance.\n\n## Program Software Setup\n"
