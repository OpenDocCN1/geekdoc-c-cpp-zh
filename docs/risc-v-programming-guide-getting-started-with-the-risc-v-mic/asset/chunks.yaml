    Syntax Explanation


    ● initialization: Sets the starting value, often for a loop counter (e.g.,  int
    i = 0).


    ●      condition: Defines the loop’s stopping criterion; when false, the loop
    ends.


    ●      increment: Updates the counter after each loop iteration, such as  i++.


    Simple Code Example


    for  (int i =  0; i <  5; i++)  {


    GPIO_OUT ^=  (1  << LED_PIN);  // Toggle LED


    }


    Code Example Explanation


    ●      Loops 5 times, toggling an LED on and off each time.


    Notes


    ● for loops are ideal when the number of iterations is known beforehand.


    Warnings


    ● Avoid modifying loop counters inside the loop body, as this can cause unexpected
    behavior.


    * * *


    3\. While Loop


    What is a While Loop?


    A  while loop repeatedly executes code as long as a specified condition remains
    true. It’s suitable for tasks where the number of iterations depends on real-time
    variables or events.


    Use Purpose


    ● Continuous Monitoring: Ideal for polling a sensor or waiting for a specific
    condition.


    ●      Indefinite Repetition: Loops until an external condition changes.


    Syntax


    while  (condition)  {


    // Code to execute while condition is true


    }


    Syntax Explanation


    ●      while: Keyword for starting a loop that depends on a condition.


    ● condition: Expression evaluated before each loop iteration; if false, the loop
    ends.


    Simple Code Example


    while  (buttonPressed)  {


    GPIO_OUT ^=  (1  << LED_PIN);  // Toggle LED


    }


    Code Example Explanation


    ●      Continues toggling the LED while  buttonPressed is true.


    Notes


    ●      Ensure there is an exit condition to avoid infinite loops.


    Warnings


    ● Infinite loops may cause the microcontroller to hang if not controlled carefully.


    * * *


    4\. Do-While Loop


    What is a Do-While Loop?


    A  do-while loop executes code at least once, regardless of the condition, and
    then repeats if the condition is true. This loop is beneficial when an action
    must occur at least once before condition checking.


    Use Purpose


    ● Mandatory Single Execution: Runs code once and repeats only if conditions are
    met.


    ● User Prompts or Polling: Useful for actions that should happen at least once.


    Syntax


    do  {


    // Code to execute


    }  while  (condition);


    Syntax Explanation


    ●      do: Starts the loop body, which is executed at least once.


    ● while: Tests the condition after executing the code block, repeating if true.


    Simple Code Example


    do  {


    GPIO_OUT ^=  (1  << LED_PIN);  // Toggle LED once


    }  while  (buttonPressed);


    Code Example Explanation


    ● Toggles the LED once, and if  buttonPressed is true, continues toggling until
    false.


    Notes


    ●      Suitable when you need guaranteed single execution before checking conditions.


    * * *


    5\. Switch Case


    What is a Switch Case?


    A  switch statement allows execution of different blocks of code based on the
    value of a variable. It’s a streamlined alternative to multiple  if-else statements
    and is useful for mode selection.


    Use Purpose


    ●      Mode Selection: Executes different actions based on specific cases.


    ● Efficient Alternative to Multiple If-Else: Cleaner and easier to read when handling
    multiple values.


    Syntax


    switch  (variable)  {


    case value1:


    // Code for case value1


    break;


    case value2:


    // Code for case value2


    break;


    default:


    // Code if no cases match


    }


    Syntax Explanation


    ●      switch: Evaluates the variable and directs control to the matching case.


    ●      case: Defines specific values to compare against the variable.


    ●      break: Exits the switch after executing the matching case’s code.


    ●      default: Runs if none of the cases match.


    Simple Code Example


    switch  (sensorMode)  {


    case  1:


    GPIO_OUT |=  (1  << LED_PIN);  // Turn on LED


    break;


    case  2:


    GPIO_OUT &=  ~(1  << LED_PIN);  // Turn off LED


    break;


    default:


    GPIO_OUT ^=  (1  << LED_PIN);  // Toggle LED


    }


    Code Example Explanation


    ● Controls the LED state based on  sensorMode. For  sensorMode 1, the LED turns
    on; for 2, it turns off, and in other cases, it toggles.


    Notes


    ● switch is more efficient than multiple  if-else statements for cases with many
    possible values.


    Warnings


    ● Missing  break statements can cause unintended fall-through, where multiple
    cases are executed.


    * * *


    Relevant Project Section


    Project Name


    Temperature-Based Fan Controller


    Project Goal


    Use control structures to monitor temperature readings and control a fan’s speed
    or state based on the temperature range, demonstrating the practical application
    of  if,  while, and  switch statements.


    RISC-V Development Environment


    This project will use PlatformIO in Visual Studio Code.


    RISC-V Microcontroller


    We’ll use the SiFive HiFive1 Rev B microcontroller, compatible with external sensor
    inputs.


    Requirement Components


    ●      SiFive HiFive1 Rev B Microcontroller


    ●      Temperature Sensor connected to an analog input pin


    ● Fan (or LED) connected to a GPIO pin, indicating the fan’s operational state


    Component Connection Table


    | Component | RISC-V Pin | Additional Notes |


    | Temperature Sensor | Analog Pin | Analog signal representing temperature |


    | Fan/LED | GPIO Pin | Simulates fan operation based on temperature |


    Connection Analysis


    The temperature sensor provides input to the microcontroller. Depending on the
    temperature, the microcontroller activates the fan (or toggles an LED) to indicate
    fan operation based on specified temperature ranges.


    Program Software Setup


    1.  Open Visual Studio Code and set up a PlatformIO project.


    2.  Write code to read temperature values and implement control structures for
    fan control based on temperature ranges.


    Project Code


    #include  <stdint.h>


    #include  <stdio.h>


    #include  "hifive1_adc.h" // Replace with actual ADC library


    #define TEMP_THRESHOLD_HIGH 30 // High temperature threshold


    #define TEMP_THRESHOLD_LOW 20 // Low temperature threshold


    #define FAN_PIN 13              // GPIO pin for fan/LED


    void setup()  {


    GPIO_DIR |=  (1  << FAN_PIN);  // Set FAN_PIN as output


    ADC_INIT();                 // Initialize ADC


    ADC_SELECT_CHANNEL(1);      // Select temperature sensor channel


    }


    int readTemperature()  {


    ADC_START_CONVERSION();     // Start ADC conversion


    int adcValue = ADC_READ();   // Read ADC value


    float voltage =  (adcValue /  1023.0)  *  3.3; // Convert to voltage


    int temperatureC =  (voltage -  0.5)  *  100; // Convert voltage to temperature


    return temperatureC;


    }


    int main()  {


    setup();


    while  (1)  {


    int temp = readTemperature();


    if  (temp > TEMP_THRESHOLD_HIGH)  {


    GPIO_OUT |=  (1  << FAN_PIN);  // Turn on fan/LED if temperature is high


    }  else  if  (temp < TEMP_THRESHOLD_LOW)  {


    GPIO_OUT &=  ~(1  << FAN_PIN);  // Turn off fan/LED if temperature is low


    }


    printf("Temperature: %d C\n", temp);  // Display temperature


    for  (volatile  int i =  0; i <  1000000; i++);  // Simple delay


    }


    }


    Save and Run


    1.  Save, compile, and upload the code to the SiFive HiFive1 Rev B board.


    2.  Monitor the LED or fan state based on temperature readings.


    Check Output


    ● The fan or LED should turn on or off based on the defined temperature thresholds,
    demonstrating effective use of  if-else control structure.


    ## Arithmetic Operators in C for RISC-V Microcontrollers


    Chapter Overview


    Arithmetic operators are fundamental tools in programming that perform mathematical
    operations such as addition, subtraction, multiplication, and division. In embedded
    programming for RISC-V microcontrollers, arithmetic operations are essential for
    processing sensor data, performing calculations, controlling devices, and managing
    system states. This chapter will cover the primary arithmetic operators used in
    C programming, their syntax, and applications in embedded systems.


    Chapter Goal


    ● Understand the main arithmetic operators used in C (+, -, *, /, %) and how they
    function in RISC-V embedded programming.


    ● Learn how to use these operators for calculations, data processing, and control
    logic.'
