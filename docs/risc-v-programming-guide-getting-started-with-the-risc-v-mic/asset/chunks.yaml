  trans: "\n\n# 避免在循环中过度计算\n为了提高代码效率，请尽可能在循环外计算常量。\n\n## 数学函数简介\n\n数学函数用于执行必要的计算，例如求绝对值、幂、平方根和三角值。这些函数允许微控制器有效地处理数据，特别是在处理需要缩放、归一化或转换的传感器输入时。\n\
    \n## 语法表格\n\n| 序号 | 主题 | 语法 |\n| :--- | :--- | :--- |\n| 1 | 绝对值 | `abs(x)` |\n\
    | 2 | 幂 | `pow(x, y)` |\n| 3 | 平方根 | `sqrt(x)` |\n| 4 | 最小值 | `fmin(x, y)` |\n\
    | 5 | 最大值 | `fmax(x, y)` |\n\n***\n\n## 各命令的详细解析\n\n### 1. 绝对值 (`abs`)\n\n###\
    \ 什么是绝对值？\n`abs` 函数返回整数的非负值。它通常用于计算距离或差异，确保结果为正数。\n\n### 用途\n- **距离计算**：提供值之间的绝对差。\n\
    - **误差计算**：计算误差的幅度，而不考虑方向。\n\n### 语法\n```c\nabs(x);\n```\n\n### 语法解释\n- `x`：要返回绝对值的整数值。如果\
    \ `x` 为负数，将以正数形式返回。\n\n### 简单代码示例\n```c\nint difference = abs(-10);\n```\n\n###\
    \ 代码示例解释\n- 将 `-10` 转换为 `10`，并将结果存储在 `difference` 中。\n\n### 注意事项\n- `abs` 仅适用于整数。对于浮点值，请使用\
    \ `fabs()`。\n\n### 警告\n- 确保 `x` 在整数范围内，以防止溢出。\n\n***\n\n### 2. 幂 (`pow`)\n\n###\
    \ 什么是幂？\n`pow` 函数计算基数相对于指数的幂次方。它对于指数计算、建模和值缩放非常有用。\n\n### 用途\n- **指数级缩放**：对数据应用指数因子。\n\
    - **建模计算**：经常用于科学和工程公式。\n\n### 语法\n```c\npow(x, y);\n```\n\n### 语法解释\n- `x`：基值。\n\
    - `y`：指数。结果是 `x` 的 `y` 次方。\n\n### 简单代码示例\n```c\ndouble result = pow(2, 3);\n```\n\
    \n### 代码示例解释\n- 计算 `2` 的 `3` 次方，结果为 `8`。\n\n### 注意事项\n- `pow` 返回浮点结果，因此输出类型为 `double`。\n\
    \n### 警告\n- 避免对大基数使用高指数，因为可能会导致溢出。\n\n***\n\n### 3. 平方根 (`sqrt`)\n\n### 什么是平方根？\n\
    `sqrt` 函数返回一个数的平方根。它对于几何计算和数据归一化很有用。\n\n### 用途\n- **距离计算**：常用于距离和向量幅计算。\n- **归一化**：通过计算平方根来缩放值。\n\
    \n### 语法\n```c\nsqrt(x);\n```\n\n### 语法解释\n- `x`：要计算平方根的值。必须是非负数。\n\n### 简单代码示例\n\
    ```c\ndouble result = sqrt(16);\n```\n\n### 代码示例解释\n- 计算 `16` 的平方根，结果为 `4`。\n\n\
    ### 注意事项\n- 参数必须是非负的，否则将导致错误。\n\n### 警告\n- 避免向 `sqrt` 传递负值，因为可能会导致未定义行为。\n\n***\n\
    \n### 4. 最小值 (`fmin`)\n\n### 什么是最小值？\n`fmin` 函数返回两个浮点值中较小的一个。它通常用于限值比较以选择下限。\n\
    \n### 用途\n- **下限选择**：用于在比较中找到较小的限值。\n- **数据比较**：选择两个值中的最小值进行数据处理。\n\n### 语法\n\
    ```c\nfmin(x, y);\n```\n\n### 语法解释\n- `x` 和 `y`：两个待比较的浮点值。该函数返回 `x` 和 `y` 中较小的一个。\n\
    \n### 简单代码示例\n```c\ndouble minVal = fmin(5.5, 3.3);\n```\n\n### 代码示例解释\n- 返回 `3.3`\
    \ 作为较小值。\n\n### 注意事项\n- 对于整数值，请在自定义逻辑中使用 `min` 函数。\n\n### 警告\n- 确保输入是有效的浮点值，以避免意外结果。\n\
    \n***\n\n### 5. 最大值 (`fmax`)\n\n### 什么是最大值？\n`fmax` 函数返回两个浮点值中较大的一个。它常用于设置上限或选择两个值中较大的一个。\n\
    \n### 用途\n- **上限选择**：在控制逻辑中找到两个值的最大值。\n- **数据阈值处理**：识别用于限制控制的最大值。\n\n### 语法\n\
    ```c\nfmax(x, y);\n```\n\n### 语法解释\n- `x` 和 `y`：两个待比较的浮点值。该函数返回 `x` 和 `y` 中较大的一个。\n\
    \n### 简单代码示例\n```c\ndouble maxVal = fmax(5.5, 3.3);\n```\n\n### 代码示例解释\n（注：原文在此部分不完整，但逻辑与\
    \ `fmin` 一致）。\n\n***\n\n## 实现细节\n\n### 项目名称\n使用数学函数计算距离和速度\n\n### 项目目标\n使用数学函数计算距离和速度。\n\
    \n### 环境\nRISC-V 微控制器\n\n### 要求\n- 开源项目\n- 设置 ADC\n- 实现计算距离和速度的代码\n- 使用 sqrt 等函数\n\
    \n### 项目代码\n```c\n#include <stdint.h>\n#include <stdio.h>\n#include <math.h>\n\
    #include \"ifive1_adc.h\" // 包含 ADC 库\n\n#define SENSOR1_PIN 0\n#define SENSOR2_PIN\
    \ 1\n#define TIME_INTERVAL 0.5 // 秒\n\nvoid setup() {\n    ADC_INIT(); // 初始化\
    \ ADC\n    ADC_SELECT_CHANNEL(SENSOR1_PIN); // 设置传感器 1 通道\n}\n\ndouble calculateDistance(int\
    \ sensor1Value, int sensor2Value) {\n    // 使用勾股定理示例\n    return sqrt(pow(sensor1Value,\
    \ 2) + pow(sensor2Value, 2));\n}\n\ndouble calculateSpeed(double previousDistance,\
    \ double currentDistance) {\n    double distanceDifference = fabs(currentDistance\
    \ - previousDistance);\n    return distanceDifference / TIME_INTERVAL; // 速度 =\
    \ 距离 / 时间\n}\n\nint main() {\n    setup();\n    double previousDistance = 0;\n\
    \    while (1) {\n        int sensor1Value = ADC_READ(); // 读取传感器 1\n        ADC_SELECT_CHANNEL(SENSOR2_PIN);\
    \ // 切换到传感器 2\n        int sensor2Value = ADC_READ(); // 读取传感器 2\n\n        double\
    \ currentDistance = calculateDistance(sensor1Value, sensor2Value);\n        double\
    \ speed = calculateSpeed(previousDistance, currentDistance);\n\n        printf(\"\
    Distance: %.2f units\\n\", currentDistance);\n        printf(\"Speed: %.2f units/sec\\\
    n\", speed);\n\n        previousDistance = currentDistance; // 更新以下次计算\n     \
    \   for (volatile int i = 0; i < 1000000; i++); // 简单延迟\n    }\n    return 0;\n\
    }\n```\n\n### 保存并运行\n1. 使用 PlatformIO 将保存、编译并上传到 SiFive HiFive1 Rev B 开发板。\n2.\
    \ 观察串口监器中显示的距离和速度值。\n\n### 检查输出\n- 串口监器应根据传感器输入显示更新的距离和速度值。\n\n"
- fmt: "\n# Characters in C for RISC-V Microcontrollers\n\n## Chapter Overview\nCharacters\
    \ are fundamental data types in C that store single letters, digits, or symbols\
    \ as numeric values using ASCII encoding. In embedded programming for RISC-V microcontrollers,\
    \ characters are commonly used for processing text, displaying messages, and handling\
    \ user inputs. This chapter will cover character data types, their usage, and\
    \ how to manipulate characters in embedded applications.\n\n## Chapter Goal\n\
    ● Understand character data types and how to work with them in C programming.\n\
    ● Learn about key character functions and how to apply them in embedded applications.\n\
    ● Implement a project that uses characters to display text and respond to user\
    \ inputs.\n\n## Rules\n● Use Character Data Types for Single Symbols: Use `char`\
    \ when storing single characters rather than strings.\n● Convert Characters Appropriately:\
    \ Be mindful of uppercase and lowercase conversion when comparing characters.\n\
    ● Check ASCII Values: Remember that characters are represented as integer values\
    \ in ASCII encoding.\n● Avoid Using Characters in Mathematical Operations: Limit\
    \ characters to text handling for clarity and type safety.\n\n## Brief Introduction\
    \ to Characters\nCharacters in C are stored as `char` data types and are represented\
    \ as integers corresponding to ASCII codes. Characters are essential for handling\
    \ text, displaying messages, and managing communication with text-based protocols.\
    \ Common functions for handling characters include checking if a character is\
    \ a letter or digit, converting to uppercase or lowercase, and comparing characters.\n\
    \n## Syntax Table\n| Serial No | Topic | Syntax | Simple Example |\n| :--- | :---\
    \ | :--- | :--- |\n| 1 | Character Declaration | `char c` | `char letter = 'A';`\
    \ |\n| 2 | ASCII Value | `(int)char` | `int val = (int) 'A';` |\n| 3 | Uppercase\
    \ Conversion | `toupper(c)` | `char upper = toupper(c);` |\n| 4 | Lowercase Conversion\
    \ | `tolower(c)` | `char lower = tolower(c);` |\n| 5 | Check Digit | `isdigit(c)`\
    \ | `if (isdigit(c)) { }` |\n\n## Detailed Breakdown for Each Command\n\n### 1.\
    \ Character Declaration (char)\n### What is Character Declaration?\nThe `char`\
    \ type in C is used to store single characters. Each character corresponds to\
    \ an integer value, typically based on the ASCII standard.\n\n### Use Purpose\n\
    ● Text Storage: Store single letters, digits, or symbols.\n● Text-Based Communication:\
    \ Useful for handling character data in serial communication.\n\n### Syntax\n\
    ```c\nchar c;\n```\n\n### Syntax Explanation\n● `char`: Data type for storing\
    \ a single character.\n● `c`: Variable name representing the character.\n\n###\
    \ Simple Code Example\n```c\nchar letter = 'A';\n```\n\n### Code Example Explanation\n\
    ● Declares a character variable `letter` and initializes it to `'A'`.\n\n### Notes\n\
    ● Characters are represented by their ASCII values internally, so `'A'` corresponds\
    \ to 65.\n\n### Warnings\n● Ensure to use single quotes for character literals,\
    \ as double quotes represent strings.\n\n### 2. ASCII Value Conversion ((int)char)\n\
    ### What is ASCII Value Conversion?\nCasting a character to an integer provides\
    \ its ASCII value, enabling numeric comparisons or character manipulations based\
    \ on ASCII codes.\n\n### Use Purpose\n● Character Comparison: Allows comparison\
    \ based on ASCII codes.\n● Text-Based Calculations: Useful for offsetting or shifting\
    \ characters.\n\n### Syntax\n```c\n(int) char;\n```\n\n### Syntax Explanation\n\
    ● `(int)`: Casts the character to its integer representation.\n\n### Simple Code\
    \ Example\n```c\nint asciiValue = (int) 'A';\n```\n\n### Code Example Explanation\n\
    ● Converts `'A'` to its ASCII value (65).\n\n### Notes\n● ASCII codes for lowercase\
    \ letters start at 97, and uppercase at 65.\n\n### Warnings\n● Only valid for\
    \ characters; casting non-character data may yield results.\n\n### 3. Uppercase\
    \ Conversion (toupper)\n### What is Uppercase Conversion?\nThe `toupper` function\
    \ converts a lowercase letter to its uppercase equivalent if applicable.\n\n###\
    \ Use Purpose\n● Uniform Case Handling: Converts characters to uppercase.\n● Text\
    \ Formatting: Ensures consistency in messages.\n\n### Syntax\n```c\ntoupper(c);\n\
    ```\n\n### Syntax Explanation\n● `c`: Character to convert to uppercase.\n\n###\
    \ Simple Code Example\n```c\nchar upperLetter = toupper('b');\n```\n\n### Code\
    \ Example Explanation\n● Converts `'b'` to its uppercase version, `'B'`.\n\n###\
    \ Notes\n● Only affects alphabetic characters; other characters remain unchanged.\n\
    \n### Warnings\n● Non-alphabetic characters should not be used with `toupper`\
    \ as results are unpredictable.\n\n### 4. Lowercase Conversion (tolower)\n###\
    \ What is Lowercase Conversion?\nThe `tolower` function converts an uppercase\
    \ letter to its lowercase equivalent if applicable.\n\n### Use Purpose\n● Text\
    \ Consistency: Converts characters to lowercase for comparison.\n● User Input\
    \ Handling: Ensures user input is processed in a single case.\n\n### Syntax\n\
    ```c\ntolower(c);\n```\n\n### Syntax Explanation\n● `c`: Character to convert\
    \ to lowercase.\n\n### Simple Code Example\n```c\nchar lowerLetter = tolower('D');\n\
    ```\n\n### Code Example Explanation\n● Converts `'D'` to its lowercase version,\
    \ `'d'`.\n\n### Notes\n● Only alphabetic characters are affected.\n\n### Warnings\n\
    ● Using `tolower` on non-alphabetic characters may yield unpredictable results.\n\
    \n### 5. Check Digit (isdigit)\n### What is Check Digit?\nThe `isdigit` function\
    \ checks if a character represents a numeric digit (0-9). It is useful for input\
    \ validation.\n\n### Use Purpose\n● Validation: Ensures a character is a digit\
    \ before performing operations.\n● Error Handling: Checks user input or data from\
    \ sensors.\n\n### Syntax\n```c\nisdigit(c);\n```\n\n### Syntax Explanation\n●\
    \ `c`: Character to check if it’s a digit.\n\n### Simple Code Example\n```c\n\
    if (isdigit('5')) {\n    // Code executes if character is a digit\n}\n```\n\n\
    ### Code Example Explanation\n● Checks if `'5'` is a digit; the condition is true.\n\
    \n### Notes\n● Only returns true for characters 0-9.\n\n### Warnings\n● `isdigit`\
    \ may not recognize non-ASCII numeric characters.\n\n## Relevant Project Section\n\
    ### Project Name\nSerial Communication Text Display and Character Validation\n\
    \n### Project Goal\nUse character functions on a RISC-V microcontroller to display\
    \ messages over serial communication and validate character inputs. This project\
    \ demonstrates the practical use of character manipulation functions.\n\n### RISC-V\
    \ Development Environment\nThis project will use PlatformIO in Visual Studio Code.\n\
    \n### RISC-V Microcontroller\nWe will use the SiFive Hi1 Rev B microcontroller\
    \ for this project.\n\n### Requirement Components\n● SiFive Hi1 Rev B Microcontroller\n\
    ● Serial Communication Interface for sending and receiving characters\n\n### Component\
    \ Connection Table\n| Component | RISC-V Pin | Additional Notes |\n| :--- | :---\
    \ | :--- |\n| Serial Interface | UART Pins | Used to send and receive characters\
    \ |\n\n### Connection Analysis\nThis project will use the serial interface to\
    \ display characters and validate input. The microcontroller will receive character\
    \ input, validate if it's a digit, and convert characters to uppercase before\
    \ displaying them.\n\n### Program Software Setup\n1. Open Visual Studio Code and\
    \ create a new PlatformIO project.\n2. Set up serial communication for input and\
    \ output.\n3. Implement code that uses character functions to validate, convert,\
    \ and display characters over the serial interface.\n\n### Project Code\n```c\n\
    #include <stdint.h>\n#include <stdio.h>\n#include <ctype.h>\n\n#define BAUD_RATE\
    \ 9600 // Set appropriate baud rate\n\nvoid setupSerial() {\n    // Configure\
    \ UART for serial communication (use RISC-V UART library settings)\n    UART_INIT(BAUD_RATE);\n\
    }\n\nvoid processCharacter(char input) {\n    if (isdigit(input)) {\n        printf(\"\
    '%c' is a digit.\\n\", input);\n    } else {\n        printf(\"'%c' is not a digit.\\\
    n\", input);\n    }\n    char upper = toupper(input);\n    char lower = tolower(input);\n\
    \    printf(\"Uppercase: %c\\n\", upper);\n    printf(\"Lowercase: %c\\n\", lower);\n\
    }\n\nint main() {\n    setupSerial();\n    while (1) {\n        char receivedChar;\n\
    \        // Read a character from the serial input (simulate UART_READ)\n    \
    \    if (UART_AVAILABLE()) {\n            receivedChar = UART_READ();\n      \
    \      // Process and display character details\n            processCharacter(receivedChar);\n\
    \        }\n    }\n}\n```\n"
