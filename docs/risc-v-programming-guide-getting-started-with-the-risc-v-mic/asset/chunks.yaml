    }\n```\n\nSave and Run\n\n1. Save, compile, and upload the code to the SiFive\
    \ HiFive1 Rev B board using PlatformIO.\n\n2. Use a serial terminal to send characters\
    \ and observe the output for each character received.\n\nCheck Output\n\n● The\
    \ serial monitor should display whether each character is a digit and show its\
    \ uppercase and lowercase forms.\n\n## Random Numbers in C for RISC-V Microcontrollers\n\
    \n### Chapter Overview\n\nRandom numbers are essential for applications requiring\
    \ variability, such as simulations, testing, games, and randomized responses.\
    \ In embedded programming for RISC-V microcontrollers, random numbers can introduce\
    \ randomness in control systems, data sampling, and security protocols. This chapter\
    \ will cover random number generation techniques, their usage, and how to implement\
    \ a random number-based project.\n\n### Chapter Goal\n\n● Understand how to generate\
    \ random numbers in C for RISC-V microcontrollers.\n● Learn to seed and use random\
    \ number functions for variability in embedded applications.\n● Implement a project\
    \ that uses random numbers to control LED patterns.\n\n### Rules\n\n● **Seed Random\
    \ Numbers for True Randomness**: Always use a unique seed to avoid repetitive\
    \ results.\n● **Avoid Using `rand()` in Time-Critical Code**: Generating random\
    \ numbers can take time; avoid excessive use in critical sections.\n● **Consider\
    \ Hardware Limitations**: Some microcontrollers may lack support for complex random\
    \ number generation; use software solutions accordingly.\n● **Range Boundaries**:\
    \ Ensure random values fall within the desired range to avoid out-of-bounds issues.\n\
    \n### Brief Introduction to Random Numbers\n\nRandom number generation in C uses\
    \ functions such as `rand()` to produce pseudo-random values. By default, `rand()`\
    \ generates the same sequence each time, but by seeding it with `srand()`, you\
    \ can create unique sequences. In embedded programming, random numbers add flexibility\
    \ to applications, enabling varied responses, randomized events, and testing scenarios.\n\
    \n### Syntax Table\n\n| Serial No | Topic | Syntax |\n| :--- | :--- | :--- |\n\
    | 1 | Seed Randomizer | `srand(seed);` |\n| 2 | Generate Random | `rand()` |\n\
    | 3 | Random Range | `rand() % range` |\n\n***\n\n### Detailed Breakdown for Each\
    \ Command\n\n#### 1. Seed Randomizer (srand)\n\n**What is Seed Randomizer?**\n\
    \nThe `srand` function seeds the random number generator, setting the starting\
    \ point for the sequence of random values. Without seeding, `rand()` produces\
    \ the same sequence on every run.\n\n**Use Purpose**\n\n● **Ensure Variability**:\
    \ Seeds the random number generator for unique random sequences.\n● **Enhanced\
    \ Randomness**: Adding a seed, like a sensor reading, ensures unpredictable results.\n\
    \n**Syntax**\n\n`srand(seed);`\n\n**Syntax Explanation**\n\n● `seed`: An integer\
    \ value used to initialize the random number generator. Typically, a dynamic value\
    \ (e.g., sensor reading) is used for unique results.\n\n**Simple Code Example**\n\
    ```c\nsrand(analogRead(A0)); // Use an analog sensor reading as a seed\n```\n\n\
    **Code Example Explanation**\n\n● Seeds the random number generator with an analog\
    \ sensor reading to create unique random values.\n\n**Notes**\n\n● Seeding with\
    \ the same value each time generates the same random sequence.\n\n**Warnings**\n\
    \n● Avoid using fixed values as seeds unless repeatability is desired.\n\n***\n\
    \n#### 2. Generate Random (rand)\n\n**What is Generate Random?**\n\nThe `rand()`\
    \ function returns a pseudo-random integer between 0 and `RAND_MAX`. It produces\
    \ a sequence of values based on the initial seed.\n\n**Use Purpose**\n\n● **Generate\
    \ Random Values**: Creates pseudo-random numbers for varied behavior.\n● **Simulation\
    \ and Testing**: Useful for randomized input simulation in testing environments.\n\
    \n**Syntax**\n\n`rand();`\n\n**Syntax Explanation**\n\n● `rand()`: The function\
    \ call generates a pseudo-random integer between 0 and `RAND_MAX`.\n\n**Simple\
    \ Code Example**\n```c\nint num = rand();\n```\n\n**Code Example Explanation**\n\
    \n● Generates a random integer and stores it in `num`.\n\n**Notes**\n\n● For specific\
    \ ranges, use modulus `%` to limit `rand()` output.\n\n**Warnings**\n\n● `rand()`\
    \ is pseudo-random; it provides predictable results without seeding.\n\n***\n\n\
    #### 3. Random Range (rand() % range)\n\n**What is Random Range?**\n\nUsing `rand()\
    \ % range` limits the output of `rand()` to a specific range. This operation returns\
    \ a value from 0 up to `range - 1`.\n\n**Use Purpose**\n\n● **Controlled Randomization**:\
    \ Constrains random values within desired limits, ideal for LED patterns, motor\
    \ speeds, or timings.\n● **Custom Range Control**: Useful for setting boundaries\
    \ on random numbers.\n\n**Syntax**\n\n`rand() % range;`\n\n**Syntax Explanation**\n\
    \n● `rand()`: Generates a pseudo-random integer.\n● `% range`: Limits the random\
    \ integer to values between 0 and `range - 1`.\n\n**Simple Code Example**\n```c\n\
    int randomLED = rand() % 5; // Generates a random number from 0 to 4\n```\n\n\
    **Code Example Explanation**\n\n● Generates a random value between 0 and 4, suitable\
    \ for selecting one of five LEDs.\n\n**Notes**\n\n● Ensure that `range` is greater\
    \ than 0 to avoid division by zero.\n\n**Warnings**\n\n● Using `%` on `rand()`\
    \ reduces randomness slightly but is generally acceptable for bounded values.\n\
    \n***\n\n### Relevant Project Section\n\n#### Project Name\nRandom LED Pattern\
    \ Generator\n\n#### Project Goal\n\nUse random numbers on a RISC-V microcontroller\
    \ to control the lighting of LEDs in a random pattern. This project demonstrates\
    \ the use of `rand()` and `srand()` to generate random values for embedded applications.\n\
    \n#### RISC-V Development Environment\n\nThis project will use PlatformIO in Visual\
    \ Studio Code.\n\n#### RISC-V Microcontroller\n\nWe will use the SiFive HiFive1\
    \ Rev B microcontroller for this project.\n\n#### Requirement Components\n\n●\
    \ SiFive HiFive1 Rev B Microcontroller\n● 5 LEDs connected to GPIO pins for random\
    \ activation\n\n#### Component Connection Table\n\n| Component | RISC-V Pin |\
    \ Additional Notes |\n| :--- | :--- | :--- |\n| LED1 | GPIO Pin 2 | LED for random\
    \ activation |\n| LED2 | GPIO Pin 3 | LED for random activation |\n| LED3 | GPIO\
    \ Pin 4 | LED for random activation |\n| LED4 | GPIO Pin 5 | LED for random activation\
    \ |\n| LED5 | GPIO Pin 6 | LED for random activation |\n\n#### Connection Analysis\n\
    \nEach LED is connected to a separate GPIO pin, allowing the microcontroller to\
    \ control individual LEDs.\n\n#### Program Software Setup\n\n1. Open Visual Studio\
    \ Code and create a new PlatformIO project.\n2. Set up the GPIO pins for each\
    \ LED.\n3. Implement code to seed the random number generator and activate LEDs.\n\
    \n#### Project Code\n\n```c\n#include <stdint.h>\n#include <stdio.h>\n#include\
    \ <stdlib.h>\n#include \"hifive1_gpio.h\" // GPIO library for RISC-V\n\n#define\
    \ NUM_LEDS 5\nint ledPins[NUM_LEDS] = {2, 3, 4, 5, 6}; // Array of LED GPIO pins\n\
    \nvoid setup() {\n  // Initialize each LED pin as output\n  for (int i = 0; i\
    \ < NUM_LEDS; i++) {\n    GPIO_DIR |= (1 << ledPins[i]);\n  }\n  // Seed the random\
    \ number generator\n  srand(analogRead(0)); // Use an analog reading as seed\n\
    }\n\nvoid randomLEDPattern() {\n  int randomLED = rand() % NUM_LEDS; // Select\
    \ random LED\n\n  // Turn all LEDs off\n  for (int i = 0; i < NUM_LEDS; i++) {\n\
    \    GPIO_OUT &= ~(1 << ledPins[i]);\n  }\n  // Turn on the randomly selected\
