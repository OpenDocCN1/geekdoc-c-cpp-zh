    \ allow the microcontroller to handle events immediately, without polling. When\
    \ an interrupt occurs, the microcontroller temporarily pauses its main tasks to\
    \ execute the interrupt service routine (`ISR`).\n\n#### Use Purpose\n● **Efficient\
    \ Event Handling**: Respond to events.\n● **Minimize CPU Load**: The main program\
    \ can focus on other tasks, triggering only when an interrupt occurs.\n\n####\
    \ Syntax\n`ENABLE_INTERRUPT(channel);`\n\n#### Syntax Explanation\n● `ENABLE_INTERRUPT`:\
    \ Enables the interrupt for a specific channel.\n● `channel`: Represents the source\
    \ of the interrupt (e.g., timer, external pin).\n\n#### Simple Code Example\n\
    ```c\nENABLE_INTERRUPT(1);\n```\n\n#### Code Example Explanation\n● Enables an\
    \ interrupt on channel 1, allowing the microcontroller to respond when an event\
    \ occurs on this channel.\n\n#### Notes\n● Ensure that the `ISR` is defined for\
    \ the specific interrupt source.\n\n#### Warnings\n● Avoid lengthy `ISRs`, as\
    \ they can interfere with the main program’s timing and performance.\n\n***\n\n\
    ### 4. Initialize UART\n\n#### What is UART Initialization?\n`UART` (Universal\
    \ Asynchronous Receiver-Transmitter) is a protocol for serial communication. Initializing\
    \ `UART` configures the baud rate and other settings for serial data transmission.\n\
    \n#### Use Purpose\n● **Data Communication**: `UART` enables communication between\
    \ the microcontroller and other devices like computers or modules.\n● **Debugging**:\
    \ `UART` is commonly used for debugging through serial monitoring.\n\n#### Syntax\n\
    `UART_INIT(baudRate);`\n\n#### Syntax Explanation\n● `UART_INIT`: This function\
    \ initializes the `UART` module with the specified communication settings.\n"
  raw: 'The temperature sensor’s analog output is read by the ADC on the microcontroller.
    The microcontroller converts the reading to a temperature value, which is displayed
    through the serial monitor or display.


    Program Software Setup


    1.  Open Visual Studio Code and create a new project in PlatformIO.


    2.  Set up the ADC to read the temperature sensor’s output.


    3.  Write code to initialize the ADC, start the conversion, read the result, and
    convert it to a temperature value.


    Project Code


    #include  <stdint.h>


    #include  <stdio.h>


    #include  "hifive1_adc.h" // Replace with actual ADC library


    #define REF_VOLTAGE 3.3 // Reference voltage for ADC


    #define TEMP_PIN 1       // ADC pin for the temperature sensor


    void setupADC()  {


    ADC_INIT();               // Initialize the ADC module


    ADC_SELECT_CHANNEL(TEMP_PIN);  // Select the temperature sensor channel


    }


    float readTemperature()  {


    ADC_START_CONVERSION();   // Start ADC conversion


    int adcValue = ADC_READ();  // Read the ADC value


    // Convert ADC value to voltage


    float voltage =  (adcValue /  1023.0)  * REF_VOLTAGE;


    // Convert voltage to temperature (assumes TMP36 sensor)


    float temperatureC =  (voltage -  0.5)  *  100;


    return temperatureC;


    }


    int main()  {


    setupADC();


    while  (1)  {


    float temperature = readTemperature();


    printf("Temperature: %.2f °C\n", temperature);  // Display temperature


    for  (volatile  int i =  0; i <  1000000; i++);  // Simple delay


    }


    }


    Save and Run


    1.  Save, compile, and upload the code to the SiFive HiFive1 Rev B board.


    2.  Open the serial monitor to view the temperature output.


    Check Output


    ● The temperature in degrees Celsius should display on the serial monitor, updating
    periodically.


    ## Advanced I/O in C for RISC-V Microcontrollers


    Chapter Overview


    Advanced I/O operations expand the functionality of digital and analog I/O by
    enabling the use of timers, interrupts, and communication protocols (such as SPI,
    I2C, and UART) to manage peripherals and handle complex tasks. These advanced
    I/O functions are crucial for precise control, high-speed data transfer, and efficient
    handling of real-time events, making them essential for embedded applications
    on RISC-V microcontrollers.


    Chapter Goal


    ● Understand the basic principles of advanced I/O operations, including timers,
    interrupts, and communication protocols.


    ● Learn the syntax for configuring and using advanced I/O functions in RISC-V
    microcontrollers.


    ● Implement a project using PWM (Pulse Width Modulation) to control an LED''s
    brightness.


    Rules


    ● Use Timers for Accurate Timing: Timers offer high precision for managing time-sensitive
    tasks.


    ● Handle Interrupts Carefully: Ensure that interrupt routines are efficient to
    prevent system slowdown.


    ● Set Up Communication Protocols Correctly: Use SPI, I2C, or UART according to
    device specifications and requirements.


    ● Optimize for Speed and Efficiency: Minimize delays in I/O operations to achieve
    real-time performance.


    Brief Introduction to Advanced I/O


    Advanced I/O functionalities include timers, PWM, interrupts, and communication
    protocols. Timers allow precise timing control, PWM enables variable control of
    devices like LEDs and motors, interrupts provide efficient event handling, and
    protocols like SPI, I2C, and UART facilitate communication with sensors and other
    peripherals. Advanced I/O allows the microcontroller to handle complex tasks,
    enhancing the range of possible applications.


    Syntax Table


    | Serial No | Topic | Syntax | Simple Example |


    | 1 | Initialize Timer | TIMER_INIT(period); | TIMER_INIT(1000); |


    | 2 | Set PWM Duty Cycle | PWM_SET_DUTY(channel, dutyCycle); | PWM_SET_DUTY(1,
    50); |


    | 3 | Enable Interrupt | ENABLE_INTERRUPT(channel); | ENABLE_INTERRUPT(1); |


    | 4 | Initialize UART | UART_INIT(baudRate); | UART_INIT(9600); |


    | 5 | SPI Data Transfer | SPI_TRANSFER(data); | SPI_TRANSFER(0xFF); |


    * * *


    Detailed Breakdown for Each Command


    1\. Initialize Timer


    What is Timer Initialization?


    Initializing a timer sets up the microcontroller’s internal timer, allowing it
    to generate precise timing events. Timers are useful for managing intervals, creating
    delays, and generating PWM signals.


    Use Purpose


    ● Time-Based Control: Manage regular intervals for tasks, such as blinking LEDs
    or generating PWM signals.


    ● Precise Delays: Use timers for delays without CPU occupation, unlike software-based
    loops.


    Syntax


    TIMER_INIT(period);


    Syntax Explanation


    ● TIMER_INIT: This function initializes a timer, setting up parameters like the
    counting period.


    ● period: The desired timing interval or frequency for the timer. For example,  period
    = 1000 could represent 1000 microseconds (1 ms) based on the timer’s configuration.


    Simple Code Example


    TIMER_INIT(1000);


    Code Example Explanation


    ● This initializes a timer with a period of 1000 microseconds, allowing it to
    generate events at 1 kHz.


    Notes


    ●      Timer intervals depend on the microcontroller’s clock frequency and prescaler
    settings.


    Warnings


    ●      Incorrect timer setup can cause delays or inaccurate timing events.


    * * *


    2\. Set PWM Duty Cycle


    What is Setting PWM Duty Cycle?


    The PWM duty cycle determines the proportion of time a signal stays HIGH within
    each cycle, controlling the power delivered to devices like LEDs or motors.


    Use Purpose


    ● Control Brightness or Speed: Adjust the duty cycle to control LED brightness
    or motor speed.


    ● Efficient Power Management: PWM allows precise control of power to devices,
    improving efficiency.


    Syntax


    PWM_SET_DUTY(channel, dutyCycle);


    Syntax Explanation


    ● PWM_SET_DUTY: This function sets the PWM duty cycle on a specific channel.


    ● channel: The PWM output channel. Microcontrollers often have multiple PWM-capable
    pins, each controlled independently.


    ● dutyCycle: The desired duty cycle as a percentage (0–100%). A duty cycle of
    50% keeps the signal HIGH for half the period.


    Simple Code Example


    PWM_SET_DUTY(1,  50);


    Code Example Explanation


    ● Sets the duty cycle of PWM channel 1 to 50%, resulting in an even on-off cycle.


    Notes


    ● Higher duty cycles correspond to longer “on” times, increasing brightness or
    speed in connected devices.


    Warnings


    ● Exceeding 100% or using negative values can lead to unexpected behavior or errors.


    * * *


    3\. Enable Interrupt


    What is Enabling an Interrupt?


    Interrupts allow the microcontroller to handle events immediately, without polling.
    When an interrupt occurs, the microcontroller temporarily pauses its main tasks
    to execute the interrupt service routine (ISR).


    Use Purpose


    ●      Efficient Event Handling: Respond to events like button presses without
    polling.


    ● Minimize CPU Load: The main program can focus on other tasks, triggering only
    when an interrupt occurs.


    Syntax


    ENABLE_INTERRUPT(channel);


    Syntax Explanation


    ●      ENABLE_INTERRUPT: Enables the interrupt for a specific channel or event.


    ●      channel: Represents the source of the interrupt (e.g., timer, external
    pin).


    Simple Code Example


    ENABLE_INTERRUPT(1);


    Code Example Explanation


    ● Enables an interrupt on channel 1, allowing the microcontroller to respond when
    an event occurs on this channel.


    Notes


    ● Ensure that the ISR (Interrupt Service Routine) is defined for the specific
    interrupt source.


    Warnings


    ● Avoid lengthy ISRs, as they can interfere with the main program’s timing and
    performance.


    * * *


    4\. Initialize UART


    What is UART Initialization?


    UART (Universal Asynchronous Receiver-Transmitter) is a protocol for serial communication.
    Initializing UART configures the baud rate and other settings for serial data
    transmission.


    Use Purpose


    ● Data Communication: UART enables communication between the microcontroller and
    other devices like computers or modules.


    ●      Debugging: UART is commonly used for debugging through serial monitoring.


    Syntax


    UART_INIT(baudRate);


    Syntax Explanation


    ● UART_INIT: This function initializes the UART module with the specified communication
    settings.'
