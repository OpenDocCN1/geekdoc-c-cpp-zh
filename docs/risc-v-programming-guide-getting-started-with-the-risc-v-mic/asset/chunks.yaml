    Relevant Project Section


    Project Name


    LED Brightness Control Using PWM


    Project Goal


    Use PWM on a RISC-V microcontroller to control the brightness of an LED by varying
    the duty cycle, demonstrating the use of advanced I/O functions.


    RISC-V Development Environment


    This project uses PlatformIO in Visual Studio Code.


    RISC-V Microcontroller


    We’ll use the SiFive HiFive1 Rev B microcontroller, which includes PWM-capable
    GPIO pins.


    Requirement Components


    ●      SiFive HiFive1 Rev B Microcontroller


    ●      LED connected to a PWM-capable pin


    ●      Potentiometer (optional) to adjust the duty cycle dynamically


    Component Connection Table


    | Component | RISC-V Pin | Additional Notes |


    | LED | PWM Pin | LED brightness controlled via PWM |


    | Potentiometer | Analog Pin | (Optional) Used to adjust PWM duty cycle |


    Connection Analysis


    The LED is connected to a PWM-capable pin on the microcontroller, allowing brightness
    control by varying the PWM duty cycle. Optionally, a potentiometer can be connected
    to an analog pin to adjust the duty cycle in real time.


    Program Software Setup


    1.  Open Visual Studio Code and create a new PlatformIO project.


    2.  Initialize PWM for the LED pin and, optionally, set up ADC to read the potentiometer
    input.


    3.  Write code to adjust the PWM duty cycle and control the LED brightness.


    Project Code


    #include  <stdint.h>


    #include  "hifive1_pwm.h" // Include PWM library (adjust as per SDK)


    const  int LED_PIN =  1;  // PWM channel for LED


    void setupPWM()  {


    TIMER_INIT(1000);                // Initialize timer for 1 ms period


    PWM_SET_DUTY(LED_PIN,  50);       // Set initial duty cycle to 50%


    }


    void adjustBrightness(int dutyCycle)  {


    if  (dutyCycle >=  0  && dutyCycle <=  100)  {


    PWM_SET_DUTY(LED_PIN, dutyCycle);  // Adjust LED brightness


    }


    }


    int main()  {


    setupPWM();


    while  (1)  {


    for  (int duty =  0; duty <=  100; duty +=  10)  {


    adjustBrightness(duty);  // Increase brightness


    for  (volatile  int i =  0; i <  100000; i++);  // Simple delay


    }


    for  (int duty =  100; duty >=  0; duty -=  10)  {


    adjustBrightness(duty);  // Decrease brightness


    for  (volatile  int i =  0; i <  100000; i++);  // Simple delay


    }


    }


    }


    Save and Run


    1.  Save, compile, and upload the code to the SiFive HiFive1 Rev B board using
    PlatformIO.


    2.  Observe the LED brightness gradually increasing and decreasing, controlled
    by the PWM duty cycle.


    Check Output


    ● The LED should brighten and dim in a smooth cycle, demonstrating effective PWM
    control.


    ## Control Structures in C for RISC-V Microcontrollers


    Chapter Overview


    Control structures are essential programming constructs that dictate the flow
    of a program, allowing specific actions to be performed under given conditions
    or repeatedly. In embedded programming for RISC-V microcontrollers, control structures
    like  if,  for,  while, and  switch statements enable decision-making and looped
    operations critical for responding to sensor data, controlling actuators, or managing
    timing. This chapter covers the primary control structures, with examples relevant
    to embedded applications.


    Chapter Goal


    ● Understand the main control structures (if,  for,  while, and  switch) used
    in C programming.


    ● Learn to use these control structures for decision-making and looping to manage
    microcontroller tasks.


    ● Implement a project that uses control structures to read sensor data and perform
    actions based on conditions.


    Rules


    ● Use Clear Conditions in Loops: Ensure loops terminate appropriately to avoid
    infinite loops.


    ●      Minimize Nested Control Structures: Reduces complexity and improves readability
    and debugging.


    ● Select the Right Control Structure: Choose based on the task (e.g.,  if for
    conditions,  for for counted loops).


    ● Avoid Heavy Processing in Loops: In embedded systems, prioritize efficiency
    to maintain performance.


    Brief Introduction to Control Structures


    Control structures manage the program flow, allowing the microcontroller to make
    decisions or execute repetitive tasks.  if statements are used for conditional
    checks,  for and  while loops are for repeated operations, and  switch allows
    handling multiple cases based on a variable’s value. These structures are critical
    for managing sensor inputs, controlling peripherals, and executing tasks based
    on specific conditions.


    Syntax Table


    | Serial No | Topic | Syntax | Simple Example |


    | 1 | If Statement | if (condition) { } | if (sensorValue > 50) { } |


    | 2 | For Loop | for (init; condition; incr) | for (int i = 0; i < 10; i++) |


    | 3 | While Loop | while (condition) { } | while (sensorValue < 50) { } |


    | 4 | Do-While Loop | do { } while (condition); | do { } while (count < 5); |


    | 5 | Switch Case | switch (variable) { case: } | switch (sensorMode) { case 1:
    |


    * * *


    Detailed Breakdown for Each Command


    1\. If Statement


    What is an If Statement?


    An  if statement allows the microcontroller to evaluate a condition and execute
    code only if the condition is true. This enables decision-making, where actions
    are performed based on sensor readings or other variables.


    Use Purpose


    ● Condition-Based Actions: Executes specific code based on a condition, ideal
    for responding to sensor data or status checks.


    ●      Error Checking: Used to validate data or parameters before proceeding.


    Syntax


    if  (condition)  {


    // Code to execute if condition is true


    }


    Syntax Explanation


    ●      if: Keyword introducing the conditional statement.


    ● condition: The expression evaluated as true or false (e.g.,  sensorValue > threshold).


    ● { }: Curly braces enclose the code executed if the condition is true.


    Simple Code Example


    if  (sensorValue >  50)  {


    GPIO_OUT |=  (1  << LED_PIN);  // Turn on LED


    }


    Code Example Explanation


    ●      Checks if  sensorValue exceeds 50; if true, turns on an LED.


    Notes


    ●      Add  else for alternative actions if the condition is false.


    Warnings


    ●      Complex conditions can reduce readability; simplify where possible.


    * * *


    2\. For Loop


    What is a For Loop?


    A  for loop repeats a block of code a set number of times, making it ideal for
    tasks requiring counted iterations, such as initializing multiple outputs or sampling
    data.


    Use Purpose


    ● Counted Repetition: Performs a task a specified number of times, such as iterating
    through an array.


    ● Stepwise Processing: Useful for operations that increment or decrement values
    over each loop cycle.


    Syntax


    for  (initialization; condition; increment)  {'
