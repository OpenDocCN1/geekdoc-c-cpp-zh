    # Digital I/O in C for RISC-V Microcontrollers


    ## Chapter Overview

    Digital I/O (Input/Output) operations enable a RISC-V microcontroller to interface
    with external devices like LEDs, buttons, and sensors. Digital pins can be configured
    as either inputs or outputs, allowing the microcontroller to read digital signals
    (HIGH/LOW) or control external devices. This chapter covers configuring and using
    digital I/O on RISC-V microcontrollers, including setting pin direction and reading/writing
    values to GPIO pins.


    ## Chapter Goal

    - Understand digital I/O operations on RISC-V microcontrollers.

    - Learn how to set pins as inputs or outputs and read/write digital values.

    - Implement a practical project to control an LED with a button.


    ## Rules

    - **Configure Pin Direction Correctly**: Always set a pin as `INPUT` or `OUTPUT`
    before using it.

    - **Debounce Inputs**: Use software debouncing for buttons to prevent false triggers.

    - **Check Voltage and Current Limits**: Ensure connected devices are within the
    microcontroller’s I/O pin voltage/current ratings.

    - **Use Pull-Up/Down Resistors for Inputs**: Improves reliability when reading
    button or switch states.


    ## Brief Introduction to Digital I/O

    RISC-V microcontrollers use digital I/O pins for input or output control. In `INPUT`
    mode, the microcontroller reads external signals as `HIGH` or `LOW`. In `OUTPUT`
    mode, it controls connected devices by setting pins `HIGH` or `LOW`. Configuring
    I/O pins effectively is crucial for reliable interaction with external components.


    ## Syntax Table

    | Serial No | Topic | Syntax | Simple Example |

    | :--- | :--- | :--- | :--- |

    | 1 | Set Pin as Output | `GPIO_DIR |= (1 << PIN);` | |

    | 2 | Set Pin as Input | `GPIO_DIR &= ~(1 << PIN);` | `GPIO_DIR &= ~(1 << 3);`
    |

    | 3 | Write HIGH to Pin | `GPIO_OUT |= (1 << PIN);` | |

    | 4 | Write LOW to Pin | `GPIO_OUT &= ~(1 << PIN);` | `GPIO_OUT &= ~(1 << 2);`
    |

    | 5 | Read Pin State | `GPIO_IN & (1 << PIN)` | `GPIO_IN & (1 << 3)` |


    ---


    ## Detailed Breakdown for Each Command


    ### 1. Set Pin as Output


    #### What is Setting a Pin as Output?

    Configuring a pin as output allows the microcontroller to control the voltage
    level on that pin, enabling it to turn external devices like LEDs on or off.


    #### Use Purpose

    - **Control External Devices**: In output mode, the microcontroller can send `HIGH`
    or `LOW` signals to devices connected to the pin, such as LEDs or relays.

    - **Enable Writing Digital States**: Required before setting a pin to `HIGH` or
    `LOW` to avoid undefined behavior.


    #### Syntax

    ```c

    GPIO_DIR |= (1 << PIN);

    ```


    #### Syntax Explanation

    - `GPIO_DIR`: This register configures the direction of GPIO pins on the microcontroller.
    Each bit in this register corresponds to a specific pin; setting a bit to 1 makes
    the pin an `OUTPUT`, and setting a bit to 0 makes the pin an `INPUT`.

    - `|=`: The bitwise OR-assignment operator modifies specific bits without affecting
    other bits. It is used here to set the bit for the desired pin while leaving other
    pins’ configurations unchanged.

    - `(1 << PIN)`: This expression shifts the bit "1" to the left by the number of
    positions specified by `PIN`. For example, if `PIN` is 2, `(1 << PIN)` produces
    `0b00000100`, targeting pin 2 in the `GPIO_DIR` register and setting it as `OUTPUT`.


    #### Simple Code Example

    ```c

    GPIO_DIR |= (1 << 2);

    ```


    #### Code Example Explanation

    - Sets pin 2 as an `OUTPUT`, allowing the microcontroller to control the connected
    device by sending a `HIGH` or `LOW` signal.


    #### Notes

    - Set a pin as `OUTPUT` before writing `HIGH` or `LOW` to avoid errors or damage
    to the microcontroller.


    #### Warnings

    - Ensure the component connected to the output pin does not exceed the pin’s voltage
    and current ratings to avoid damage.


    ---


    ### 2. Set Pin as Input


    #### What is Setting a Pin as Input?

    Setting a pin as input configures it to read signals from external components
    like buttons or sensors. In this mode, the microcontroller can detect if the external
    signal is `HIGH` or `LOW`.


    #### Use Purpose

    - **Read External Signals**: Enables the microcontroller to sense the state of
    external devices such as buttons, switches, or digital sensors.

    - **Prepare for Digital Read Operations**: Setting a pin as input is necessary
    before reading its state.


    #### Syntax

    ```c

    GPIO_DIR &= ~(1 << PIN);

    ```


    #### Syntax Explanation

    - `GPIO_DIR`: Register to configure the direction of GPIO pins, where each bit
    corresponds to a pin on the microcontroller. Setting a bit to 0 makes the pin
    an `INPUT`.

    - `&=`: The bitwise AND-assignment operator is used to clear the bit without affecting
    the other bits in `GPIO_DIR`. By using `&=`, only the specified pin is modified.

    - `~(1 << PIN)`: This expression shifts 1 left by `PIN` positions, and the `~`
    (bitwise NOT) inverts the result. For example, if `PIN` is 3, `(1 << PIN)` gives
    `0b00001000`, and `~(1 << PIN)` becomes `0b11110111`, clearing the 3rd bit.


    #### Simple Code Example

    ```c

    GPIO_DIR &= ~(1 << 3);

    ```


    #### Code Example Explanation

    - Sets pin 3 as an `INPUT`, allowing the microcontroller to receive signals.


    ---


    ### 3. Write HIGH to Pin


    #### What is Writing HIGH to a Pin?

    Writing `HIGH` to a pin that is set as `OUTPUT` makes it supply voltage, typically
    3.3V or 5V. This can activate connected devices.


    #### Use Purpose

    - **Turn ON External Devices**: Pulling a pin high turns on devices like LEDs
    or relays, to an active state.

    - **Signal HIGH in Digital Communication**: Represents a `HIGH` signal in digital
    systems.


    #### Syntax

    ```c

    GPIO_OUT |= (1 << PIN);

    ```


    #### Syntax Explanation

    - `GPIO_OUT`: This register controls the output state of GPIO pins. Each bit corresponds
    to a pin; setting a bit to 1 makes the pin `HIGH`, and setting it to 0 makes it
    `LOW`.

    - `|=`: The bitwise OR-assignment operator modifies specific bits without affecting
    other bits.

    - `(1 << PIN)`: This expression shifts the bit "1" to the left by the number of
    positions specified by `PIN`, aligning it with the desired pin.


    #### Simple Code Example

    ```c

    GPIO_OUT |= (1 << 2);

    ```


    #### Code Example Explanation

    - Sets pin 2 to `HIGH`, applying voltage to the pin and potentially turning on
    a connected device.


    ---


    ### 4. Write LOW to Pin


    #### What is Writing LOW to a Pin?

    Writing `LOW` to a pin that is set as `OUTPUT` pulls it to ground (0V), deactivating
    connected devices such as LEDs or relays.


    #### Use Purpose

    - **Turn OFF External Devices**: Pulling a pin low turns off devices, like setting
    an LED to off.

    - **Signal LOW in Digital Communication**: Represents a `LOW` or 0 signal in digital
    systems.


    #### Syntax

    ```c

    GPIO_OUT &= ~(1 << PIN);

    ```


    #### Syntax Explanation

    - `GPIO_OUT`: The register controlling the output state of GPIO pins.

    - `&=`: The bitwise AND-assignment operator, used to clear (set to 0) the bit
    associated with the pin.

    - `~(1 << PIN)`: Shifts 1 left by `PIN` positions to match the pin, then inverts
    the result.


    #### Simple Code Example

    ```c

    GPIO_OUT &= ~(1 << 2);

    ```


    #### Code Example Explanation

    - Sets pin 2 to `LOW`, deactivating any connected device.

