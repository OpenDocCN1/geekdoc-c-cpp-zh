- fmt: "\n# Avoid Excessive Calculations in Loops\nFor efficient code, calculate constants\
    \ outside loops where possible.\n\n## Brief Introduction to Math Functions\n\n\
    Math functions perform essential calculations, such as finding the absolute value,\
    \ power, square root, and trigonometric values. These functions allow microcontrollers\
    \ to process data effectively, especially when working with sensor inputs that\
    \ require scaling, normalization, or transformation.\n\n## Syntax Table\n\n| Serial\
    \ No | Topic | Syntax |\n| :--- | :--- | :--- |\n| 1 | Absolute Value | `abs(x)`\
    \ |\n| 2 | Power | `pow(x, y)` |\n| 3 | Square Root | `sqrt(x)` |\n| 4 | Minimum\
    \ Value | `fmin(x, y)` |\n| 5 | Maximum Value | `fmax(x, y)` |\n\n***\n\n## Detailed\
    \ Breakdown for Each Command\n\n### 1. Absolute Value (`abs`)\n\n### What is Absolute\
    \ Value?\nThe `abs` function returns the non-negative value of an integer. It\
    \ is often used to calculate distances or differences, ensuring the result is\
    \ positive.\n\n### Use Purpose\n- **Distance Calculations**: Provides the absolute\
    \ difference between values.\n- **Error Calculation**: Computes the magnitude\
    \ of errors without regard to direction.\n\n### Syntax\n```c\nabs(x);\n```\n\n\
    ### Syntax Explanation\n- `x`: The integer value whose absolute value is to be\
    \ returned. If `x` is negative, it will be returned as positive.\n\n### Simple\
    \ Code Example\n```c\nint difference = abs(-10);\n```\n\n### Code Example Explanation\n\
    - Converts `-10` to `10`, storing the result in `difference`.\n\n### Notes\n-\
    \ `abs` only works with integer values. For floating-point values, use `fabs()`.\n\
    \n### Warnings\n- Ensure that `x` is within the range of an integer to avoid overflow.\n\
    \n***\n\n### 2. Power (`pow`)\n\n### What is Power?\nThe `pow` function calculates\
    \ a base value raised to the power of an exponent. It is useful for exponential\
    \ calculations, modeling, and scaling values.\n\n### Use Purpose\n- **Exponential\
    \ Scaling**: Applies exponential factors to data.\n- **Modeling Calculations**:\
    \ Frequently used in scientific and engineering formulas.\n\n### Syntax\n```c\n\
    pow(x, y);\n```\n\n### Syntax Explanation\n- `x`: The base value.\n- `y`: The\
    \ exponent. The result is `x` raised to the power of `y`.\n\n### Simple Code Example\n\
    ```c\ndouble result = pow(2, 3);\n```\n\n### Code Example Explanation\n- Calculates\
    \ `2` raised to the power of `3`, giving `8`.\n\n### Notes\n- `pow` returns a\
    \ floating-point result, so the output is of type `double`.\n\n### Warnings\n\
    - Avoid using high exponents with large bases, as this can lead to overflow.\n\
    \n***\n\n### 3. Square Root (`sqrt`)\n\n### What is Square Root?\nThe `sqrt` function\
    \ returns the square root of a number. It is useful for geometric calculations\
    \ and data normalization.\n\n### Use Purpose\n- **Distance Calculation**: Commonly\
    \ used in distance and vector magnitude calculations.\n- **Normalization**: Scales\
    \ values by calculating the square root.\n\n### Syntax\n```c\nsqrt(x);\n```\n\n\
    ### Syntax Explanation\n- `x`: The value whose square root is to be calculated.\
    \ It must be non-negative.\n\n### Simple Code Example\n```c\ndouble result = sqrt(16);\n\
    ```\n\n### Code Example Explanation\n- Calculates the square root of `16`, which\
    \ is `4`.\n\n### Notes\n- The argument must be non-negative; otherwise, it results\
    \ in an error.\n\n### Warnings\n- Avoid passing negative values to `sqrt`, as\
    \ it can cause undefined behavior.\n\n***\n\n### 4. Minimum Value (`fmin`)\n\n\
    ### What is Minimum Value?\nThe `fmin` function returns the smaller of two floating-point\
    \ values. It is often used in limit comparisons to select the lower bound.\n\n\
    ### Use Purpose\n- **Lower Bound Selection**: Useful in finding the smaller limit\
    \ in comparisons.\n- **Data Comparison**: Selects the minimum of two values for\
    \ data processing.\n\n### Syntax\n```c\nfmin(x, y);\n```\n\n### Syntax Explanation\n\
    - `x` and `y`: The two floating-point values being compared. The function returns\
    \ the smaller of `x` and `y`.\n\n### Simple Code Example\n```c\ndouble minVal\
    \ = fmin(5.5, 3.3);\n```\n\n### Code Example Explanation\n- Returns `3.3` as the\
    \ smaller value.\n\n### Notes\n- For integer values, use the `min` function in\
    \ custom logic.\n\n### Warnings\n- Ensure inputs are valid floating-point values\
    \ to avoid unexpected results.\n\n***\n\n### 5. Maximum Value (`fmax`)\n\n###\
    \ What is Maximum Value?\nThe `fmax` function returns the larger of two floating-point\
    \ values. It is useful for setting upper limits or selecting the larger of two\
    \ values.\n\n### Use Purpose\n- **Upper Bound Selection**: Finds the maximum of\
    \ two values in control logic.\n- **Data Thresholding**: Identifies maximum values\
    \ for limit control.\n\n### Syntax\n```c\nfmax(x, y);\n```\n\n### Syntax Explanation\n\
    - `x` and `y`: The two floating-point values being compared. The function returns\
    \ the larger of `x` and `y`.\n\n### Simple Code Example\n```c\ndouble maxVal =\
    \ fmax(5.5, 3.3);\n```\n\n### Code Example Explanation\n(Note: The original text\
    \ was incomplete in this section, but the logic follows `fmin`).\n\n***\n\n##\
    \ Implementation Details\n\n### Project Name\nDistance and Speed Calculation Using\
    \ Math Functions\n\n### Project Goal\nUse math functions to calculate distance\
    \ and speed.\n\n### Environment\nRISC-V microcontroller\n\n### Requirements\n\
    - Open-source project\n- Set up ADC\n- Implement code to calculate distance and\
    \ speed\n- Use math functions such as sqrt\n\n### Project Code\n```c\n#include\
    \ <stdint.h>\n#include <stdio.h>\n#include <math.h>\n#include \"ifive1_adc.h\"\
    \ // Include ADC library\n\n#define SENSOR1_PIN 0\n#define SENSOR2_PIN 1\n#define\
    \ TIME_INTERVAL 0.5 // Time interval in seconds\n\nvoid setup() {\n    ADC_INIT();\
    \ // Initialize ADC\n    ADC_SELECT_CHANNEL(SENSOR1_PIN); // Set ADC channel for\
    \ sensor 1\n}\n\ndouble calculateDistance(int sensor1Value, int sensor2Value)\
    \ {\n    // Using Pythagorean theorem as an example\n    return sqrt(pow(sensor1Value,\
    \ 2) + pow(sensor2Value, 2));\n}\n\ndouble calculateSpeed(double previousDistance,\
    \ double currentDistance) {\n    double distanceDifference = fabs(currentDistance\
    \ - previousDistance);\n    return distanceDifference / TIME_INTERVAL; // Speed\
    \ = Distance / Time\n}\n\nint main() {\n    setup();\n    double previousDistance\
    \ = 0;\n    while (1) {\n        int sensor1Value = ADC_READ(); // Read from sensor\
    \ 1\n        ADC_SELECT_CHANNEL(SENSOR2_PIN); // Switch to sensor 2\n        int\
    \ sensor2Value = ADC_READ(); // Read from sensor 2\n\n        double currentDistance\
    \ = calculateDistance(sensor1Value, sensor2Value);\n        double speed = calculateSpeed(previousDistance,\
    \ currentDistance);\n\n        printf(\"Distance: %.2f units\\n\", currentDistance);\n\
    \        printf(\"Speed: %.2f units/sec\\n\", speed);\n\n        previousDistance\
    \ = currentDistance; // Update for next calculation\n        for (volatile int\
    \ i = 0; i < 1000000; i++); // Simple delay\n    }\n    return 0;\n}\n```\n\n\
    ### Save and Run\n1. Save, compile, and upload the code to the SiFive HiFive1\
    \ Rev B board using PlatformIO.\n2. Observe the calculated distance and speed\
    \ values displayed in the serial monitor.\n\n### Check Output\n- The serial monitor\
    \ should display updated distance and speed values based on the sensor inputs.\n"
