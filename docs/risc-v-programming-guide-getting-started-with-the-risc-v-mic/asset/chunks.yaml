    # (c) Multiply by Reference Voltage


    Multiplying the normalized value by the reference voltage converts the proportion
    into the actual voltage.


    ## Step-by-Step Example


    Imagine a system with:


    * A 10-bit ADC (Max ADC Value = `1023`)

    * A Reference Voltage of `5.0V`

    * A raw ADC reading of `256`


    ### Step 1: Normalize the ADC Value


    ![](image_rsrc706.jpg)


    ### Step 2: Multiply by the Reference Voltage


    `Voltage=0.25×5.0=1.25V`


    So, an ADC value of `256` corresponds to `1.25V`.


    ## Visualisation


    * ADC Resolution: 10-bit

    * Reference Voltage: `3.3V`


    | ADC Value | Proportion (ADCValue/1023) | Voltage (V) |

    | :--- | :--- | :--- |

    | 0 | `0/1023=0.0` | `0.0V` |

    | 256 | `256/1023≈0.25` | `0.25×3.3=0.825V` |

    | 512 | `512/1023≈0.5` | `0.5×3.3=1.65V` |

    | 768 | `768/1023≈0.75` | `0.75×3.3=2.475V` |

    | 1023 | `1023/1023=1.0` | `1.0×3.3=3.3V` |


    ## Syntax Table


    | Serial No | Topic | Syntax | Simple Example |

    | :--- | :--- | :--- | :--- |

    | 1 | Initialize ADC | `ADC_INIT();` | `ADC_INIT();` |

    | 2 | Set ADC Channel | `ADC_SELECT_CHANNEL(channel);` | `ADC_SELECT_CHANNEL(1);`
    |

    | 3 | Start ADC Conversion | `ADC_START_CONVERSION();` | `ADC_START_CONVERSION();`
    |

    | 4 | Read ADC Result | `ADC_READ();` | `int value = ADC_READ();` |

    | 5 | Convert to Voltage | `voltage = (value / 1023.0) * ref;` | `float voltage
    = (value / 1023.0) * 3.3;` |


    ***


    ## Detailed Breakdown for Each Command


    ### 1. Initialize ADC


    #### What is ADC Initialization?

    Initializing the ADC prepares the microcontroller to perform analog-to-digital
    conversions by configuring necessary settings such as reference voltage, resolution,
    and any required internal components.


    ### Use Purpose

    * Set Up ADC Hardware: Ensures the ADC is ready for use with all necessary configurations.

    * Prepare for Accurate Readings: Ensures stable and accurate conversions by setting
    reference voltages and resolution.


    ### Syntax

    ```

    ADC_INIT();

    ```


    ### Syntax Explanation

    * `ADC_INIT`: This function typically initializes the ADC peripheral with default
    or user-defined configurations. It might include setting the ADC clock, enabling
    the ADC module, and setting the reference voltage.


    ### Simple Code Example

    ```

    ADC_INIT();

    ```


    ### Code Example Explanation

    * This code initializes the ADC module, making it ready for analog-to-digital
    conversions.


    ### Notes

    * Always initialize the ADC before starting any conversion to avoid incorrect
    results.


    ### Warnings

    * Ensure the reference voltage and resolution match the sensor requirements for
    accurate readings.


    ***


    ### 2. Set ADC Channel


    #### What is Setting ADC Channel?

    Setting the ADC channel configures which analog input pin the ADC will read from.
    Microcontrollers often support multiple analog channels, each corresponding to
    a specific pin.


    ### Use Purpose

    * Select Analog Pin for Reading: Directs the ADC to read from the correct pin.

    * Switch Between Channels: Allows multiple analog sensors to be read by selecting
    different channels.


    ### Syntax

    ```

    ADC_SELECT_CHANNEL(channel);

    ```


    ### Syntax Explanation

    * `ADC_SELECT_CHANNEL`: This function selects the specified channel for the ADC
    conversion. The argument, `channel`, corresponds to the analog pin number or channel
    number configured in the microcontroller.


    ### Simple Code Example

    ```

    ADC_SELECT_CHANNEL(1);

    ```


    ### Code Example Explanation

    * This code sets the ADC to read from channel 1, allowing the ADC to read the
    analog signal from the corresponding pin.


    ### Notes

    * Some microcontrollers may use a dedicated function or register for channel selection.


    ### Warnings

    * Switching channels during conversion may lead to incorrect results. Ensure the
    conversion is complete before changing channels.


    ***


    ### 3. Start ADC Conversion


    #### What is Starting an ADC Conversion?

    Starting an ADC conversion instructs the ADC to sample the analog input and convert
    it into a digital value. This process must be completed before reading the result.


    ### Use Purpose

    * Begin Analog Reading: Initiates the conversion process to read the analog value.

    * Capture Current Signal: Samples the input at the current signal level.


    ### Syntax

    ```

    ADC_START_CONVERSION();

    ```


    ### Syntax Explanation

    * `ADC_START_CONVERSION`: This function begins the analog-to-digital conversion
    process. When called, the ADC starts sampling the selected analog channel and
    converting the voltage into a digital value.


    ### Simple Code Example

    ```

    ADC_START_CONVERSION();

    ```


    ### Code Example Explanation

    * This code starts the ADC conversion process, beginning the reading and conversion
    of the analog signal on the selected channel.


    ### Notes

    * Conversion time may vary based on the ADC’s resolution and clock speed.


    ### Warnings

    * Starting a new conversion before the current one completes can lead to inaccurate
    data.


    ***


    ### 4. Read ADC Result


    #### What is Reading ADC Result?

    Reading the ADC result retrieves the converted digital value, which represents
    the sampled analog voltage level in digital form. The result can be used for calculations.


    ### Use Purpose

    * Access Conversion Data: Retrieves the digital value.

    * Use for Calculations: Allows processing of sampled data.


    ### Syntax

    ```

    int value = ADC_READ();

    ```


    ### Syntax Explanation

    * `ADC_READ`: This function returns the digital result from the ADC.


    ### Simple Code Example

    ```

    int value = ADC_READ();

    ```


    ### Code Example Explanation

    * This code reads the digital value, storing it in variable `value`.


    ### Notes

    * The returned value’s range depends on the ADC resolution.


    ### Warnings

    * Ensure the conversion is complete before calling this.


    ***


    ### 5. Convert to Voltage


    #### What is Converting to Voltage?

    After reading the ADC result, you may need to convert it to a voltage for meaningful
    interpretation. Using a known reference voltage and the ADC’s resolution, the
    digital value can be scaled back to a voltage.


    ### Use Purpose

    * Translate Digital Value: Converts the ADC result into a voltage.

    * Sensor Data Interpretation: Allows understanding of sensor readings.


    ### Syntax

    ```

    float voltage = (value / 1023.0) * ref;

    ```


    ### Syntax Explanation

    * `value`: The digital result from the ADC.

    * `1023.0`: The maximum value for a 10-bit ADC, used here as a scaling factor.

    * `ref`: The reference voltage of the ADC, typically 3.3V or 5V.


    ### Simple Code Example

    ```

    float voltage = (value / 1023.0) * 3.3;

    ```


    ### Code Example Explanation

    * This converts the raw ADC value to a voltage level, assuming a reference voltage
    of 3.3V and a 10-bit ADC.


    ### Notes

    * The reference voltage should match the actual reference used for the ADC to
    ensure accurate results.


    ### Warnings

    * Incorrect scaling can lead to inaccurate voltage readings.


    ***


    ## Relevant Project Section


    ### Project Name

    Temperature Sensor Reader


    ### Project Goal

    Use an ADC on a RISC-V microcontroller to read an analog temperature sensor and
    convert the reading to a temperature value in degrees Celsius.


    ### RISC-V Development Environment

    This project will be built using PlatformIO in Visual Studio Code.


    ### RISC-V Microcontroller

    The SiFive HiFive1 Rev B microcontroller, based on the SiFive Freedom E310 RISC-V
    core, is used in this project.


    ### Requirement Components

    * SiFive HiFive1 Rev B Microcontroller

    * Analog Temperature Sensor (e.g., TMP36) connected to an analog input pin

    * Display or Serial Monitor for displaying temperature readings


    ### Component Connection Table


    | Component | RISC-V Pin | Additional Notes |

    | :--- | :--- | :--- |

    | Temperature Sensor | ADC Pin | Analog sensor output connected |

    | Display/Serial Out | UART/Serial | Used to display temperature output |


    ## Connection Analysis

