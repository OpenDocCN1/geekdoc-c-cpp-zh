    \n# Boolean Operators in C for RISC-V Microcontrollers\n\n## Chapter Overview\n\
    Boolean operators are essential in programming as they allow conditions to be\
    \ combined, evaluated, and controlled. These operators (`&&`, `||`, `!`) enable\
    \ logical decision-making by combining multiple conditions, allowing embedded\
    \ systems to respond to more complex scenarios. In RISC-V microcontroller programming,\
    \ Boolean operators are used to create robust control logic for sensors, actuators,\
    \ and various input/output combinations.\n\n## Chapter Goal\n- Understand the\
    \ primary Boolean operators (`&&`, `||`, `!`) and their application in embedded\
    \ C programming.\n- Learn to use these operators to handle multiple conditions,\
    \ improving control and decision-making.\n- Implement a project to control an\
    \ LED based on two sensor inputs.\n\n## Rules\n- Avoid redundant conditions to\
    \ keep code efficient.\n- Use Boolean operators with clarity.\n- Ensure conditions\
    \ are easy to read.\n\n## Brief Introduction to Boolean Operators\nBoolean operators\
    \ enable logical decisions that result in `true` or `false`. Common operators\
    \ include `&&` (AND), `||` (OR), and `!` (NOT).\n\n## Syntax Table\n| Serial No\
    \ | Topic | Syntax |\n| :--- | :--- | :--- |\n| 1 | Logical AND | `a && b` |\n\
    | 2 | Logical OR | `a || b` |\n| 3 | Logical NOT | `!a` |\n\n***\n\n## 1. Logical\
    \ AND (&&)\n\n### What is Logical AND?\nThe `&&` operator checks if both conditions\
    \ are true. It returns `true` only if both operands are true, making it ideal\
    \ for situations where multiple conditions must be met.\n\n### Use Purpose\n-\
    \ Multiple Condition Verification: Ensures all conditions are met.\n- Safe Operations:\
    \ Useful for checking preconditions.\n\n### Syntax\n```\na && b;\n```\n\n### Syntax\
    \ Explanation\n- `a` and `b`: These are the conditions being evaluated. The result\
    \ is `true` only if both `a` and `b` are true.\n\n### Simple Code Example\n```c\n\
    int sensor1 = 1;\nint sensor2 = 1;\n\nif (sensor1 && sensor2) {\n    GPIO_OUT\
    \ |= (1 << LED_PIN);  // Turn on LED if both are active\n}\n```\n\n### Code Example\
    \ Explanation\n- Checks if `sensor1` and `sensor2` are both true. If so, it turns\
    \ on the LED.\n\n### Notes\n- `&&` short-circuits, meaning if the first condition\
    \ is false, the second is not evaluated.\n\n### Warnings\n- Be cautious with short-circuiting\
    \ if the second condition is necessary.\n\n***\n\n## 2. Logical OR (||)\n\n###\
    \ What is Logical OR?\nThe `||` operator checks if at least one of the conditions\
    \ is true. It returns `true` if either condition is true, making it useful when\
    \ only one condition must be satisfied.\n\n### Use Purpose\n- Alternate Condition\
    \ Checking: Activates an operation if any one of multiple conditions is true.\n\
    - Flexible Control: Allows either of two or more states to satisfy a requirement.\n\
    \n### Syntax\n```\na || b;\n```\n\n### Syntax Explanation\n- `a` and `b`: These\
    \ are the conditions being evaluated. The result is `true` if either `a` or `b`\
    \ is true.\n\n### Simple Code Example\n```c\nint mode = 2;\n\nif (mode == 1 ||\
    \ mode == 2) {\n    GPIO_OUT |= (1 << MOTOR_PIN);  // Activate motor if mode is\
    \ 1 or 2\n}\n```\n\n### Code Example Explanation\n- Checks if `mode` is either\
    \ 1 or 2. If true, it activates the motor.\n\n### Notes\n- `||` also short-circuits,\
    \ so if the first condition is true, the second is not evaluated.\n\n### Warnings\n\
    - Ensure conditions are independent where necessary to avoid unexpected results.\n\
    \n***\n\n## 3. Logical NOT (!)\n\n### What is Logical NOT?\n"
  raw: '●      Upper Bound Control: Prevents values from exceeding a maximum allowed
    level.


    ●      Safety Constraints: Ensures that a parameter remains within acceptable
    limits.


    Syntax


    a <= b;


    Syntax Explanation


    ● a and b: Values or variables being compared. The result is  true if a is less
    than or equal to b.


    Simple Code Example


    int distance =  10;


    if  (distance <=  10)  {


    GPIO_OUT &=  ~(1  << STOP_PIN);  // Stop motor if distance is 10 or less


    }


    Code Example Explanation


    ● Checks if  distance is less than or equal to 10\. If true, it stops the motor.


    Notes


    ●      Helpful in applications with upper safety constraints.


    Warnings


    ●      Avoid using floating-point values in strict comparisons due to precision
    issues.


    * * *


    Relevant Project Section


    Project Name


    Temperature-Controlled Fan System


    Project Goal


    Use comparison operators on a RISC-V microcontroller to monitor temperature readings
    and control a fan based on different thresholds. This project demonstrates the
    use of comparison operators to manage device states based on sensor input.


    RISC-V Development Environment


    This project will use PlatformIO in Visual Studio Code.


    RISC-V Microcontroller


    We will use the SiFive HiFive1 Rev B microcontroller for this project.


    Requirement Components


    ●      SiFive HiFive1 Rev B Microcontroller


    ●      Temperature Sensor connected to an analog input pin


    ● Fan or LED connected to a GPIO pin, simulating fan control based on temperature


    Component Connection Table


    | Component | RISC-V Pin | Additional Notes |


    | Temperature Sensor | ADC Pin | Analog signal representing temperature |


    | Fan/LED | GPIO Pin | Turns on or off based on temperature |


    Connection Analysis


    The temperature sensor provides analog input to the microcontroller, which converts
    it to a digital value. The microcontroller then uses comparison operators to evaluate
    the temperature and control the fan or LED according to predefined thresholds.


    Program Software Setup


    1.  Open Visual Studio Code and create a new PlatformIO project.


    2.  Configure the ADC to read temperature data from the sensor.


    3.  Write code using comparison operators to control the fan or LED based on temperature
    thresholds.


    Project Code


    #include  <stdint.h>


    #include  <stdio.h>


    #include  "hifive1_adc.h" // Include ADC library


    #define TEMP_HIGH_THRESHOLD 30 // High temperature threshold in Celsius


    #define TEMP_LOW_THRESHOLD 20 // Low temperature threshold in Celsius


    #define FAN_PIN 13              // GPIO pin for fan/LED


    void setup()  {


    GPIO_DIR |=  (1  << FAN_PIN);  // Set FAN_PIN as output


    ADC_INIT();                 // Initialize ADC


    ADC_SELECT_CHANNEL(1);      // Select ADC channel for temperature sensor


    }


    int readTemperature()  {


    ADC_START_CONVERSION();     // Start ADC conversion


    int adcValue = ADC_READ();  // Read ADC value


    float voltage =  (adcValue /  1023.0)  *  3.3; // Convert to voltage


    int temperatureC =  (voltage -  0.5)  *  100; // Convert voltage to temperature


    return temperatureC;


    }


    int main()  {


    setup();


    while  (1)  {


    int temp = readTemperature();


    if  (temp >= TEMP_HIGH_THRESHOLD)  {


    GPIO_OUT |=  (1  << FAN_PIN);  // Turn on fan if temperature is high


    }  else  if  (temp <= TEMP_LOW_THRESHOLD)  {


    GPIO_OUT &=  ~(1  << FAN_PIN);  // Turn off fan if temperature is low


    }


    printf("Temperature: %d C\n", temp);  // Display temperature


    for  (volatile  int i =  0; i <  1000000; i++);  // Simple delay


    }


    }


    Save and Run


    1.  Save, compile, and upload the code to the SiFive HiFive1 Rev B board using
    PlatformIO.


    2.  Monitor the LED or fan state based on the current temperature.


    Check Output


    ● The fan or LED should turn on if the temperature exceeds the high threshold
    and turn off if it falls below the low threshold, demonstrating effective use
    of comparison operators.


    ## Boolean Operators in C for RISC-V Microcontrollers


    Chapter Overview


    Boolean operators are essential in programming as they allow conditions to be
    combined, evaluated, and controlled. These operators (&&,  ||, !) enable logical
    decision-making by combining multiple conditions, allowing embedded systems to
    respond to more complex scenarios. In RISC-V microcontroller programming, Boolean
    operators are used to create robust control logic for sensors, actuators, and
    various input/output combinations.


    Chapter Goal


    ● Understand the primary Boolean operators (&&,  ||, !) and their application
    in embedded C programming.


    ● Learn to use these operators to handle multiple conditions, improving control
    and decision-making.


    ● Implement a project to control an LED based on two sensor inputs, demonstrating
    the use of Boolean operators in practical applications.


    Rules


    ● Use Boolean Operators with Clarity: Ensure that conditions are easy to read
    and understand, especially when using multiple operators.


    ●      Optimize Conditions: Avoid redundant conditions to keep code efficient.


    ●      Handle Boolean Expressions Carefully: Remember operator precedence when
    combining multiple conditions.


    ●      Minimize Nested Conditions: Keep nesting minimal to improve readability
    and maintainability.


    Brief Introduction to Boolean Operators


    Boolean operators enable logical operations that result in a  true or  false outcome,
    helping microcontrollers make complex decisions. Common Boolean operators include  &&
    (AND),  || (OR), and ! (NOT). They allow combining conditions, such as checking
    if two or more sensor values meet criteria before performing an action. Boolean
    logic is a core part of embedded system programming, ensuring that microcontrollers
    respond accurately to multiple simultaneous conditions.


    Syntax Table


    | Serial No | Topic | Syntax | Simple Example |


    | 1 | Logical AND | a && b | if (sensor1 && sensor2) |


    | 3 | Logical NOT | !a | if (!error) |


    * * *


    Detailed Breakdown for Each Command


    1\. Logical AND (&&)


    What is Logical AND?


    The  && operator checks if both conditions are true. It returns  true only if
    both operands are true, making it ideal for situations where multiple conditions
    must be met.


    Use Purpose


    ● Multiple Condition Verification: Ensures that all specified conditions are met
    before proceeding.


    ● Safe Operations: Useful for checking preconditions, such as ensuring multiple
    sensors are in a safe state.


    Syntax


    a && b;


    Syntax Explanation


    ● a and b: These are the conditions being evaluated. The result is  true only
    if both a and b are true.


    Simple Code Example


    int sensor1 =  1;


    int sensor2 =  1;


    if  (sensor1 && sensor2)  {


    GPIO_OUT |=  (1  << LED_PIN);  // Turn on LED if both sensors are active


    }


    Code Example Explanation


    ● Checks if  sensor1 and  sensor2 are both true. If so, it turns on the LED.


    Notes


    ● && short-circuits, meaning if the first condition is false, the second is not
    evaluated.


    Warnings


    ● Ensure conditions are independent where necessary to avoid unexpected results
    from short-circuiting.


    * * *


    2\. Logical OR (||)


    What is Logical OR?


    The  || operator checks if at least one of the conditions is true. It returns  true
    if either condition is true, making it useful when only one condition must be
    satisfied.


    Use Purpose


    ● Alternate Condition Checking: Activates an operation if any one of multiple
    conditions is true.


    ● Flexible Control: Allows either of two or more states to satisfy a requirement.


    Syntax


    a || b;


    Syntax Explanation


    ● a and b: These are the conditions being evaluated. The result is  true if either
    a or b is true.


    Simple Code Example


    int mode =  2;


    if  (mode ==  1  || mode ==  2)  {


    GPIO_OUT |=  (1  << MOTOR_PIN);  // Activate motor if mode is 1 or 2


    }


    Code Example Explanation


    ● Checks if  mode is either 1 or 2\. If true, it activates the motor.


    Notes


    ● || also short-circuits, so if the first condition is true, the second is not
    evaluated.


    Warnings


    ● Be cautious with short-circuiting if the second condition is necessary for the
    operation.


    * * *


    3\. Logical NOT (!)


    What is Logical NOT?'
