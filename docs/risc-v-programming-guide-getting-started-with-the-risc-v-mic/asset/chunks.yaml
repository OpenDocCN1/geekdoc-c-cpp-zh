    \ before being defined.\n- Define Interface: Provides the structure of the function.\n\
    \n**Syntax**\n`returnType functionName(parameters);`\n\n**Syntax Explanation**\n\
    - `returnType`: Specifies the data type the function returns (e.g., `int`, `float`,\
    \ `void`).\n- `functionName`: The name of the function.\n- `parameters`: Data\
    \ types the function accepts.\n\n**Simple Example**\n`int add(int, int);`\n\n\
    **Notes**\n- Declarations are usually placed at the beginning of the code or in\
    \ header files.\n\n**Warnings**\n- Ensure parameters match the definition.\n\n\
    ### 2. Function Definition\n\n**What is Function Definition?**\nA function definition\
    \ provides the actual code for a function, including the instructions executed\
    \ when called.\n\n**Use Purpose**\n- Provide Logic: Specifies the operations the\
    \ function performs.\n- Encapsulate Code: Groups a specific task.\n\n**Syntax**\n\
    `returnType functionName(parameters) { ... }`\n\n**Syntax Explanation**\n- `returnType`:\
    \ Specifies the function’s return type.\n- `functionName`: The name used to call\
    \ the function.\n- `parameters`: Data types and names.\n- Code Block: The instructions\
    \ within the function.\n\n**Simple Example**\n`int add(int a, int b) {}`\n\n**Notes**\n\
    - Functions can return data or be `void`.\n\n**Warnings**\n- Be consistent with\
    \ the declaration.\n\n### 3. Function Call\n\n**What is Function Call?**\nA function\
    \ call invokes a function by its name, passing any arguments, and executes its\
    \ code.\n\n**Use Purpose**\n- Execute Function Code: Triggers the function to\
    \ perform its task.\n- Reusability: Calls the same function multiple times with\
    \ different arguments.\n\n**Syntax**\n`functionName(arguments);`\n\n**Syntax Explanation**\n\
    - `functionName`: The name of the function to execute.\n- `arguments`: The values\
    \ passed to the parameters.\n\n**Simple Example**\n`int sum = add(5, 3);`\n\n\
    **Notes**\n- Functions can be called from other functions, including `main`.\n\
    \n**Warnings**\n- Ensure arguments match parameter types.\n\n### 4. Return Statement\n\
    \n**What is Return Statement?**\nThe `return` statement specifies the value a\
    \ function sends back to the caller. In non-void functions, it concludes the function’s\
    \ execution.\n\n**Use Purpose**\n- Provide Function Output: Delivers a result\
    \ back to the caller.\n- Exit Function: Ends the function’s execution.\n\n**Syntax**\n\
    `return value;`\n\n**Syntax Explanation**\n- `value`: The data sent back to the\
    \ caller, matching the function’s return type.\n\n**Simple Example**\n`return\
    \ a + b;`\n\n**Notes**\n- Void functions omit the `return` keyword or use `return;`\
    \ without a value.\n\n**Warnings**\n- Ensure the returned value matches the declared\
    \ return type.\n"
  raw: '●      Serial Communication Interface for displaying converted values


    Component Connection Table


    | Component | RISC-V Pin | Additional Notes |


    | Temperature Sensor | ADC Pin | Provides analog voltage based on temp |


    | Serial Interface | UART Pins | Displays converted sensor values |


    Connection Analysis


    The temperature sensor provides an analog voltage proportional to temperature.
    The microcontroller reads this analog value, converts it to digital, and applies
    data conversions to display results as integers, floats, and ASCII strings over
    serial communication.


    Program Software Setup


    1.  Open Visual Studio Code and create a new PlatformIO project.


    2.  Configure the ADC for reading sensor data and set up UART for serial output.


    3.  Implement code to read, convert, and display sensor data in various formats.


    Project Code


    #include  <stdint.h>


    #include  <stdio.h>


    #include  <stdlib.h>


    #define ADC_PIN 0 // ADC channel for temperature sensor


    void setup()  {


    ADC_INIT();                // Initialize ADC


    UART_INIT(9600);           // Initialize UART for serial output


    }


    void displaySensorData(int adcValue)  {


    float temperature =  (float)adcValue *  (3.3  /  1023.0)  *  100; // Convert ADC
    to Celsius


    int integerTemp =  (int)temperature;                          // Float to integer


    char tempString[10];


    itoa(integerTemp, tempString,  10);                           // Integer to string


    printf("Analog Value: %d\n", adcValue);


    printf("Temperature (float): %.2f°C\n", temperature);


    printf("Temperature (integer): %d°C\n", integerTemp);


    printf("Temperature (string): %s°C\n", tempString);


    }


    int main()  {


    setup();


    while  (1)  {


    int adcValue = ADC_READ();        // Read analog value from sensor


    displaySensorData(adcValue);      // Display converted values


    for  (volatile  int i =  0; i <  1000000; i++);  // Simple delay


    }


    }


    Save and Run


    1.  Save, compile, and upload the code to the SiFive HiFive1 Rev B board using
    PlatformIO.


    2.  Monitor the serial output to observe the sensor data in different formats.


    Check Output


    ● The serial monitor should display the sensor’s ADC value, floating-point temperature,
    integer temperature, and temperature as a string.


    ## Functions in C for RISC-V Microcontrollers


    Chapter Overview


    Functions are essential in C programming, allowing code to be organized, reused,
    and modularized. In embedded programming on RISC-V microcontrollers, functions
    enable efficient code management, making it easier to handle tasks like reading
    sensors, controlling outputs, and processing data. Functions improve readability,
    reduce redundancy, and simplify debugging.


    Chapter Goal


    ●      Understand the purpose and structure of functions in embedded C programming.


    ● Learn to define and use functions for various tasks, such as data processing
    and hardware control.


    ● Implement a project that uses functions to read sensor data and control an LED
    based on thresholds.


    Rules


    ● Define Functions for Reusable Code: Use functions to encapsulate repeated code,
    making it reusable and modular.


    ● Keep Functions Simple: Each function should perform one specific task to maintain
    clarity.


    ● Use Descriptive Names: Name functions based on their purpose for easy understanding.


    ● Limit Global Variables: Pass data as function arguments to reduce reliance on
    global variables and increase flexibility.


    Brief Introduction to Functions


    A function in C is a block of code designed to perform a specific task. Functions
    have a name, return type, and parameters, enabling them to operate on given inputs
    and return a result. Functions make code more readable and maintainable, which
    is crucial in embedded systems where complex tasks are broken down into smaller
    operations.


    Syntax Table


    | Serial No | Topic | Syntax | Simple Example |


    | 1 | Function Declaration | returnType functionName(parameters); | int add(int,
    int); |


    | 2 | Function Definition | returnType functionName(parameters) { ... } | int
    add(int a, int b) { return a + b; } |


    | 3 | Function Call | functionName(arguments); | int sum = add(5, 3); |


    | 4 | Return Statement | return value; | return a + b; |


    | 5 | Void Function | void functionName() | void blinkLED(); |


    * * *


    Detailed Breakdown for Each Command


    1\. Function Declaration


    What is Function Declaration?


    A function declaration specifies the function''s name, return type, and parameters
    without providing its actual code. It tells the compiler that the function exists
    and defines its usage format.


    Use Purpose


    ● Declare Functions for Later Use: Allows functions to be used before they are
    defined in the code.


    ● Define Function Interface: Provides the structure of the function, specifying
    input and output.


    Syntax


    returnType functionName(parameters);


    Syntax Explanation


    ● returnType: Specifies the data type of the value the function will return (e.g.,  int,  float,  void).


    ● functionName: The name of the function, which is used to call it.


    ●      parameters: Data types and names of the inputs the function accepts.


    Simple Code Example


    int  add(int a,  int b);


    Code Example Explanation


    ● Declares a function named  add that takes two integers as parameters and returns
    an integer.


    Notes


    ● Declarations are usually placed at the beginning of the code or in header files.


    Warnings


    ●      Ensure that parameters match between the declaration and the function definition.


    * * *


    2\. Function Definition


    What is Function Definition?


    A function definition provides the actual code for a function, including the instructions
    executed when the function is called.


    Use Purpose


    ● Provide Function Logic: Defines the operations to perform when the function
    is called.


    ●      Encapsulate Code: Allows a specific task to be grouped and reused.


    Syntax


    returnType functionName(parameters)  {


    // Code to execute


    }


    Syntax Explanation


    ●      returnType: Specifies the function’s return data type.


    ●      functionName: The name used to call the function.


    ●      parameters: Specifies input data types and names.


    ●      Code Block: The instructions executed within the function.


    Simple Code Example


    int  add(int a,  int b)  {


    return a + b;


    }


    Code Example Explanation


    ● Defines the function  add, which returns the sum of two integers, a and b.


    Notes


    ●      Functions can return data or be  void, returning no value.


    Warnings


    ●      Be consistent with the data types specified in the declaration.


    * * *


    3\. Function Call


    What is Function Call?


    A function call invokes a function by its name, passing any required arguments,
    and executes its code.


    Use Purpose


    ●      Execute Function Code: Triggers the function to perform its defined task.


    ●      Reusability: Calls the same function multiple times with different arguments.


    Syntax


    functionName(arguments);


    Syntax Explanation


    ●      functionName: The name of the function to execute.


    ●      arguments: The values passed to the function’s parameters.


    Simple Code Example


    int sum =  add(5,  3);


    Code Example Explanation


    ● Calls the  add function with arguments 5 and 3, storing the result in  sum.


    Notes


    ●      Functions can be called from other functions, including  main.


    Warnings


    ●      Ensure arguments match parameter types to avoid unexpected results.


    * * *


    4\. Return Statement


    What is Return Statement?


    The  return statement specifies the value a function sends back to the caller.
    In non-void functions, it concludes the function’s execution.


    Use Purpose


    ●      Provide Function Output: Delivers a result back to the caller.


    ●      Exit Function: Ends the function’s execution.


    Syntax


    return  value;


    Syntax Explanation


    ● value: The data sent back to the caller, matching the function’s return type.


    Simple Code Example


    return a + b;


    Code Example Explanation


    ●      Returns the sum of a and b as the function’s result.


    Notes


    ● Void functions omit the  return keyword or use  return; without a value.


    Warnings


    ●      Ensure the returned value matches the declared return type.'
