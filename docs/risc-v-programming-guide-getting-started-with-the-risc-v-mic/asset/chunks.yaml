    3. 创建新的 RISC-V 项目\n    - 点击底部工具栏上的 `PlatformIO` 主页图标。\n    - 选择“新项目（New Project）”，选择你的开发板（例如\
    \ SiFive HiFive1 Rev B），并指定项目目录。\n    - `PlatformIO` 将自动为所选板下载所需的框架和库。\n\n###\
    \ 为 HiFive1 Rev B 配置 Freedom Studio\n\n`Freedom Studio` 是 SiFive 为 RISC-V 开发定制的基于\
    \ Eclipse 的 IDE。\n\n1. 下载并安装 Freedom Studio\n    - 访问 Freedom Studio 网站并下载适用于你操作系统的安装程序。\n\
    \    - 安装软件并打开 IDE。\n2. 设置新项目\n    - 选择 `File > New > Freedom E SDK Project`。\n\
