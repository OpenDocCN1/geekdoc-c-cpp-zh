- fmt: "\nUse constants and variables to control the blink rate of an LED on a RISC-V\
    \ microcontroller. The LED blink interval will be determined by a constant, while\
    \ a variable will manage the LED’s on/off state.\n\n## RISC-V Development Environment\n\
    \nWe will use `PlatformIO` within `Visual Studio Code` for this project. `PlatformIO`\
    \ offers tools for building, uploading, and debugging code for RISC-V microcontrollers.\n\
    \n## RISC-V Microcontroller\n\nThis example uses the `SiFive HiFive1 Rev B` microcontroller,\
    \ based on the `SiFive Freedom E310`, a RISC-V core known for efficient IoT applications.\n\
    \n### Requirement Components\n\n- `SiFive HiFive1 Rev B` RISC-V Microcontroller\n\
    - LED connected to a GPIO output pin\n\n### Component Connection Table\n\n| Component\
    \ | RISC-V Pin | Additional Notes |\n| :--- | :--- | :--- |\n| LED | `GPIO Pin19`\
    \ | Controlled by software |\n\n### Connection Analysis\n\nThe LED is connected\
    \ to a GPIO pin on the `HiFive1 Rev B`, toggling on and off based on a timing\
    \ interval set by a constant. The LED state (on or off) is stored in a variable\
    \ and modified based on timing logic.\n\n## Program Software Setup\n\n1. Open\
    \ `Visual Studio Code` with `PlatformIO`.\n2. Create a new `PlatformIO` project\
    \ and select `SiFive HiFive1 Rev B` as the board.\n3. Define constants for the\
    \ LED’s blink interval and initialize the LED control variable.\n4. Write code\
    \ to toggle the LED state based on the defined interval.\n\n### Project Code\n\
    \n```c\n#include <stdint.h>\n\n// Define the pin number for the onboard LED\n\
    #define LED_PIN 19\n\n// Define GPIO control registers based on your SDK\n#define\
    \ GPIO_DIR (*(volatile uint32_t*)0x10012000) // GPIO direction register\n#define\
    \ GPIO_OUT (*(volatile uint32_t*)0x10012004) // GPIO output register\n\nconst\
    \ int BLINK_INTERVAL = 100000;  // LED blink interval in cycles\nint ledState\
    \ = 0;                   // Variable to track LED state\n\n// Function to configure\
    \ the LED pin as an output\nvoid setupLED() {\n    GPIO_DIR |= (1 << LED_PIN);\
    \     // Set LED_PIN as output\n    GPIO_OUT &= ~(1 << LED_PIN);    // Ensure\
    \ LED is initially off\n}\n\n// Simple delay function using a busy-wait loop\n\
    void delay(int interval) {\n    for (volatile int i = 0; i < interval; i++); \
    \ // Waste cycles for delay\n}\n\nint main() {\n    setupLED();  // Initialize\
    \ LED\n    while (1) {\n        if (ledState) {\n            GPIO_OUT &= ~(1 <<\
    \ LED_PIN);  // Turn off LED\n        } else {\n            GPIO_OUT |= (1 <<\
    \ LED_PIN);   // Turn on LED\n        }\n        ledState = !ledState;       \
    \   // Toggle LED state\n        delay(BLINK_INTERVAL);         // Delay between\
    \ toggles\n    }\n    return 0;  // Program will never reach here\n}\n```\n\n\
    ### Save and Run\n\n1. Save, compile, and upload the code to the `SiFive HiFive1\
    \ Rev B` board using `PlatformIO` in `Visual Studio Code`.\n2. Observe the LED\
    \ toggling on and off, with the interval controlled by the `BLINK_INTERVAL` constant.\n\
    \n### Check Output\n\n- The LED should blink at a steady rate defined by the `BLINK_INTERVAL`\
    \ constant, while the `ledState` variable manages its on/off state.\n\n## Data\
    \ Types in C for RISC-V Microcontrollers\n\n### Chapter Overview\n\nData types\
    \ are fundamental to programming, especially in embedded systems like RISC-V microcontrollers,\
    \ where memory and processing power are limited. Data types define the kind of\
    \ data a variable can hold (such as integers, characters, or floating-point numbers)\
    \ and specify how much memory that data occupies. Using data types efficiently\
    \ allows for optimal memory usage, helps prevent errors, and improves code readability\
    \ and reliability. This chapter covers data types, including basic, derived, and\
    \ user-defined types, with practical examples and guidelines.\n\n### Chapter Goal\n\
    \n- Understand the basic data types available in C programming for RISC-V microcontrollers.\n\
    - Learn to select the appropriate data types for specific applications to optimize\
    \ memory usage.\n- Implement a project demonstrating the use of various data types\
    \ in a real-world scenario.\n\n### Rules\n\n- **Choose Minimal Storage**: Use\
    \ the smallest data type necessary to store the information (e.g., `char` for\
    \ small integers).\n- **Ensure Correct Data Range**: Choose data types that match\
    \ the range of expected values to avoid overflow or underflow.\n- **Use Floating\
    \ Points Only When Necessary**: Floating-point operations consume more resources;\
    \ use them sparingly.\n- **Define Custom Types for Clarity**: When applicable,\
    \ define custom types to improve code readability and maintainability.\n\n###\
    \ Brief Introduction to Data Types\n\nIn C programming for embedded systems, data\
    \ types categorize variables by the kind and size of data they store. Primitive\
    \ data types like `int`, `char`, and `float` are used frequently, but derived\
    \ types (arrays, pointers) and user-defined types (structs, unions) are also essential\
    \ for complex data handling. In RISC-V microcontrollers, managing data types efficiently\
    \ can greatly impact system performance and resource usage.\n\n### Syntax Table\n\
    \n| Serial No | Topic | Syntax | Simple Example |\n| :--- | :--- | :--- | :---\
    \ |\n| 1 | Integer Declaration | `int varName;` | `int count;` |\n| 2 | Character\
    \ Declaration | `char varName;` | `char letter;` |\n| 3 | Floating-Point Decl.\
    \ | `float varName;` | `float temperature;` |\n| 4 | Array Declaration | `type\
    \ varName[size];` | `int numbers[5];` |\n| 5 | Structure Declaration | `struct\
    \ { type member; } varName;` | `struct { int age; };` |\n\n## Integer Declaration\n\
    \n### What is Integer Declaration?\nAn integer declaration creates a variable\
    \ to store whole numbers. Integers are commonly used in programming.\n\n### Use\
    \ Purpose\n- Store Whole Numbers: Useful for counters and representing values.\n\
    - Control Logic: Frequently used in conditions and loops.\n\n### Syntax\n`int\
    \ varName;`\n\n### Syntax Explanation\n- `int`: Specifies the variable as an integer\
    \ type, usually 2 or 4 bytes depending on the platform.\n- `varName`: The name\
    \ of the integer variable.\n\n### Simple Example\n`int count;`\n\n### Code Example\n\
    Declares an `int` variable `count`, which can hold whole-number values as 10 or\
    \ -5.\n\n### Notes\n- The range of `int` varies based on architecture (typically\
    \ -32,768 to 32,767 for 16-bit, -2,147,483,648 to 2,147,483,647 for 32-bit).\n\
    \n### Warnings\nUsing an integer for values beyond its range will cause overflow.\n\
    \n## Character Declaration\n\n### What is Character Declaration?\nCharacter declarations\
    \ define variables that can store single characters or small integers. Characters\
    \ use 1 byte of memory and are commonly used for text data.\n\n### Use Purpose\n\
    - Store Single Characters: Useful for text-based applications, such as displaying\
    \ letters.\n- Small Integer Storage: Can hold numbers from 0 to 255 (unsigned)\
    \ or -128 to 127 (signed).\n\n### Syntax\n`char varName;`\n\n### Syntax Explanation\n\
    - `char`: Specifies the variable as a character type.\n- `varName`: The name of\
    \ the character variable.\n\n### Simple Example\n`char letter;`\n\n### Code Example\n\
    Declares a `char` variable `letter`, which can store a character like 'A' or a\
    \ small integer.\n\n### Notes\n- `char` variables are frequently used in arrays\
    \ to store strings.\n\n### Warnings\nEnsure character encoding is consistent if\
    \ transferring between systems, as characters are represented in ASCII or Unicode.\n\
    \n## Floating-Point Declaration\n\n### What is Floating-Point Declaration?\nFloating-point\
    \ declarations define variables to store decimal numbers, often used for precise\
    \ measurements or fractional values in calculations.\n\n### Use Purpose\n- Store\
    \ Decimal Values: Useful for measurements, calculations, and any value requiring\
    \ precision.\n- Handle Mathematical Operations: Often used in applications requiring\
    \ multiplication or division of fractional values.\n\n### Syntax\n`float varName;`\n\
    \n### Syntax Explanation\n- `float`: Specifies the variable as a floating-point\
    \ type, requiring 4 bytes of memory.\n- `varName`: The name of the floating-point\
    \ variable.\n\n### Simple Example\n`float temperature;`\n"
  raw: 'Use constants and variables to control the blink rate of an LED on a RISC-V
    microcontroller. The LED blink interval will be determined by a constant, while
    a variable will manage the LED’s on/off state.


    RISC-V Development Environment


    We will use PlatformIO within Visual Studio Code for this project. PlatformIO
    offers tools for building, uploading, and debugging code for RISC-V microcontrollers.


    RISC-V Microcontroller


    This example uses the SiFive HiFive1 Rev B microcontroller, based on the SiFive
    Freedom E310, a RISC-V core known for efficient IoT applications.


    Requirement Components


    ●      SiFive HiFive1 Rev B RISC-V Microcontroller


    ●      LED connected to a GPIO output pin


    Component Connection Table


    | Component | RISC-V Pin | Additional Notes |


    | LED | GPIO Pin19 | Controlled by software |


    Connection Analysis


    The LED is connected to a GPIO pin on the HiFive1 Rev B, toggling on and off based
    on a timing interval set by a constant. The LED state (on or off) is stored in
    a variable and modified based on timing logic.


    Program Software Setup


    1.  Open Visual Studio Code with PlatformIO.


    2.  Create a new PlatformIO project and select SiFive HiFive1 Rev B as the board.


    3.  Define constants for the LED’s blink interval and initialize the LED control
    variable.


    4.  Write code to toggle the LED state based on the defined interval.


    Project Code


    #include  <stdint.h>


    // Define the pin number for the onboard LED


    #define LED_PIN 19


    // Define GPIO control registers based on your SDK


    #define GPIO_DIR (*(volatile  uint32_t*)0x10012000) // GPIO direction register


    #define GPIO_OUT (*(volatile  uint32_t*)0x10012004) // GPIO output register


    const  int BLINK_INTERVAL =  100000;  // LED blink interval in cycles


    int ledState =  0;                  // Variable to track LED state


    // Function to configure the LED pin as an output


    void setupLED()  {


    GPIO_DIR |=  (1  << LED_PIN);    // Set LED_PIN as output


    GPIO_OUT &=  ~(1  << LED_PIN);   // Ensure LED is initially off


    }


    // Simple delay function using a busy-wait loop


    void delay(int interval)  {


    for  (volatile  int i =  0; i < interval; i++);  // Waste cycles for delay


    }


    int main()  {


    setupLED();  // Initialize LED


    while  (1)  {


    if  (ledState)  {


    GPIO_OUT &=  ~(1  << LED_PIN);  // Turn off LED


    }  else  {


    GPIO_OUT |=  (1  << LED_PIN);  // Turn on LED


    }


    ledState =  !ledState;  // Toggle LED state


    delay(BLINK_INTERVAL);  // Delay between toggles


    }


    return  0;  // Program will never reach here


    }


    Save and Run


    1.  Save, compile, and upload the code to the SiFive HiFive1 Rev B board using
    PlatformIO in Visual Studio Code.


    2.  Observe the LED toggling on and off, with the interval controlled by the  BLINK_INTERVAL
    constant.


    Check Output


    ● The LED should blink at a steady rate defined by the  BLINK_INTERVAL constant,
    while the  ledState variable manages its on/off state.


    ## Data Types in C for RISC-V Microcontrollers


    Chapter Overview


    Data types are fundamental to programming, especially in embedded systems like
    RISC-V microcontrollers, where memory and processing power are limited. Data types
    define the kind of data a variable can hold (such as integers, characters, or
    floating-point numbers) and specify how much memory that data occupies. Using
    data types efficiently allows for optimal memory usage, helps prevent errors,
    and improves code readability and reliability. This chapter covers data types,
    including basic, derived, and user-defined types, with practical examples and
    guidelines.


    Chapter Goal


    ● Understand the basic data types available in C programming for RISC-V microcontrollers.


    ● Learn to select the appropriate data types for specific applications to optimize
    memory usage.


    ● Implement a project demonstrating the use of various data types in a real-world
    scenario.


    Rules


    ● Choose Minimal Storage: Use the smallest data type necessary to store the information
    (e.g.,  char for small integers).


    ● Ensure Correct Data Range: Choose data types that match the range of expected
    values to avoid overflow or underflow.


    ● Use Floating Points Only When Necessary: Floating-point operations consume more
    resources; use them sparingly.


    ● Define Custom Types for Clarity: When applicable, define custom types to improve
    code readability and maintainability.


    Brief Introduction to Data Types


    In C programming for embedded systems, data types categorize variables by the
    kind and size of data they store. Primitive data types like  int,  char, and  float
    are used frequently, but derived types (arrays, pointers) and user-defined types
    (structs, unions) are also essential for complex data handling. In RISC-V microcontrollers,
    managing data types efficiently can greatly impact system performance and resource
    usage.


    Syntax Table


    | Serial No | Topic | Syntax | Simple Example |


    | 1 | Integer Declaration | int varName; | int count; |


    | 2 | Character Declaration | char varName; | char letter; |


    | 3 | Floating-Point Decl. | float varName; | float temperature; |


    | 4 | Array Declaration | type arrayName[size]; | int numbers[5]; |


    | 5 | Structure Declaration | struct { type member; }; | struct Student { int
    age; }; |


    * * *


    Detailed Breakdown for Each Command


    1\. Integer Declaration


    What is Integer Declaration?


    An integer declaration creates a variable to store whole numbers. Integers are
    commonly used in embedded programming for counters, sensor values, or any whole-number
    data.


    Use Purpose


    ●      Store Whole Numbers: Ideal for counting and representing integer values.


    ●      Control Logic: Frequently used in conditions and loops.


    Syntax


    int varName;


    Syntax Explanation


    ● int: Specifies the variable as an integer type, usually requiring 2 or 4 bytes
    of memory depending on the platform.


    ●      varName: The name of the integer variable.


    Simple Code Example


    int count;


    Code Example Explanation


    ● Declares an integer variable  count, which can hold whole-number values such
    as 10, -5, etc.


    Notes


    ● The range of  int varies based on the microcontroller’s architecture (typically
    -32,768 to 32,767 for 16-bit, -2,147,483,648 to 2,147,483,647 for 32-bit).


    Warnings


    ●      Using an integer for values beyond its range will cause overflow.


    * * *


    2\. Character Declaration


    What is Character Declaration?


    Character declarations define variables that can store single characters or small
    integers. Characters use 1 byte of memory and are commonly used for text data
    or small integer values.


    Use Purpose


    ●      Store Single Characters: Useful for text-based applications, such as displaying
    letters.


    ● Small Integer Storage: Can hold numbers from 0 to 255 (unsigned) or -128 to
    127 (signed).


    Syntax


    char varName;


    Syntax Explanation


    ●      char: Specifies the variable as a character type.


    ●      varName: The name of the character variable.


    Simple Code Example


    char letter;


    Code Example Explanation


    ● Declares a  char variable  letter, which can store a character like ‘A’ or a
    small integer.


    Notes


    ●      char variables are frequently used in arrays to store strings.


    Warnings


    ● Ensure character encoding is consistent if transferring between systems, as
    characters are represented in ASCII or Unicode.


    * * *


    3\. Floating-Point Declaration


    What is Floating-Point Declaration?


    Floating-point declarations define variables to store decimal numbers, often used
    for precise measurements or fractional values in calculations.


    Use Purpose


    ● Store Decimal Values: Useful for measurements, calculations, and any value requiring
    precision.


    ● Handle Mathematical Operations: Often used in applications requiring multiplication
    or division of fractional values.


    Syntax


    float varName;


    Syntax Explanation


    ● float: Specifies the variable as a floating-point type, requiring 4 bytes of
    memory.


    ●      varName: The name of the floating-point variable.


    Simple Code Example


    float temperature;


    Code Example Explanation'
