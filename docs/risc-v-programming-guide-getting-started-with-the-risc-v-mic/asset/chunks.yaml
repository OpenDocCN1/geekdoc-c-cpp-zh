    printf("message");


    Syntax Explanation


    ● "message": The text or variable to be displayed on the serial monitor.


    Simple Code Example


    int  value  =  10;


    printf("Value: %d\n",  value);


    Code Example Explanation


    ● Sends the message  Value: 10 to the serial monitor, displaying the variable  value.


    Notes


    ● Use  \n for a new line in the serial output to improve readability.


    Warnings


    ●      Excessive print statements may slow down the program; use them selectively.


    * * *


    2\. Breakpoint


    What is a Breakpoint?


    A breakpoint is a marker in code where execution pauses, allowing developers to
    inspect variable states and code behavior at a specific point.


    Use Purpose


    ●      Pause Execution: Stops the program to allow code inspection.


    ● Analyze Code Flow: Identifies which parts of the code execute and helps locate
    errors.


    Syntax


    // Set breakpoint here


    Syntax Explanation


    ● // Set breakpoint here: Placeholder indicating where to place a breakpoint in
    debugging software.


    Simple Code Example


    int counter =  0; // Set breakpoint here


    counter++;


    Code Example Explanation


    ● Sets a breakpoint on  counter = 0;, pausing execution before  counter is incremented.


    Notes


    ●      Breakpoints are set in the IDE/debugging tool, not directly in code.


    Warnings


    ●      Ensure breakpoints are removed in final production code to prevent interruptions.


    * * *


    3\. Watch Variable


    What is Watch Variable?


    A watch allows developers to monitor specific variables as the program executes,
    helping to track changes in value.


    Use Purpose


    ● Track Variable Changes: Observes how a variable’s value changes throughout the
    program.


    ●      Identify Logic Errors: Detects unexpected changes that may indicate bugs.


    Syntax


    watch variable_name;


    Syntax Explanation


    ●      variable_name: The variable being monitored.


    Simple Code Example


    int temperature =  25; // Watch temperature


    temperature +=  5;


    Code Example Explanation


    ●      Sets a watch on  temperature, tracking its value as it changes.


    Notes


    ● Watches are often set up in debugging software, not directly in the code.


    Warnings


    ● Watches can slow down debugging in complex programs; use only essential variables.


    * * *


    4\. Step Over (step_over)


    What is Step Over?


    Step Over is a debugging command that allows developers to execute one line of
    code at a time without entering functions, useful for observing execution without
    diving into each function.


    Use Purpose


    ● Inspect Code Line-by-Line: Allows precise control over code execution for detailed
    analysis.


    ● Skip Function Details: Executes functions without entering them, useful for
    large or well-tested functions.


    Syntax


    step_over();


    Syntax Explanation


    ●      No parameters; simply advances code execution to the next line.


    Simple Code Example


    int result =  add(3,  5); // Step over this line


    Code Example Explanation


    ● Steps over the  add function call, executing it without entering the function.


    Notes


    ● Step Over is used in debugging software rather than directly in code.


    Warnings


    ● Use with discretion; complex function calls may require stepping into for detailed
    debugging.


    * * *


    5\. Unit Test Function (void test_function)


    What is Unit Test Function?


    A unit test function verifies the correctness of a specific function or code segment
    by running predefined test cases.


    Use Purpose


    ● Validate Function Logic: Ensures each function performs as expected with known
    inputs.


    ● Detect Early Errors: Helps catch issues before integrating functions into larger
    systems.


    Syntax


    void test_function();


    Syntax Explanation


    ●      test_function: A self-contained function created for testing other functions.


    Simple Code Example


    void test_addition()  {


    int result =  add(3,  5);


    if  (result ==  8)  {


    printf("Test Passed\n");


    }  else  {


    printf("Test Failed\n");


    }


    }


    Code Example Explanation


    ● Tests the  add function by checking if the result of  add(3, 5) is 8.


    Notes


    ●      Unit tests should cover edge cases to ensure robustness.


    Warnings


    ● Ensure test cases are independent and do not rely on other tests to function
    correctly.


    * * *


    Relevant Project Section


    Project Name


    Debugging a Temperature Monitoring System


    Project Goal


    Use debugging techniques to test and verify the accuracy of a temperature monitoring
    system on a RISC-V microcontroller. This project demonstrates using serial print
    statements, breakpoints, and unit tests to troubleshoot and ensure reliable functionality.


    RISC-V Development Environment


    This project will use PlatformIO in Visual Studio Code.


    RISC-V Microcontroller


    We will use the SiFive HiFive1 Rev B microcontroller for this project.


    Requirement Components


    ●      SiFive HiFive1 Rev B Microcontroller


    ●      Analog Temperature Sensor connected to an ADC pin


    ●      Serial Monitor to display debug messages and values


    Component Connection Table


    | Component | RISC-V Pin | Additional Notes |


    | Temperature Sensor | ADC Pin | Analog temperature data input |


    | Serial Interface | UART Pins | Displays debug output in terminal |


    Connection Analysis


    The temperature sensor provides an analog reading based on temperature. The microcontroller
    reads and processes this data, using serial debugging to display values and verify
    system performance.


    Program Software Setup'
