  trans: "\n\n# 5. Wi-Fi 断开 (wifi_disconnect)\n\n## 什么是 Wi-Fi 断开？\n`wifi_disconnect`\
    \ 会结束 Wi-Fi 连接，使设备离线状态，这在不再需要连接时可以节省电力并提高安全性。\n\n### 用途\n- **节省电力**：通过断开网络连接来降低功耗。\n\
    - **增强安全性**：在不需要网络访问时防止未经授权的访问。\n\n### 语法\n```c\nwifi_disconnect();\n```\n\n###\
    \ 语法解释\n- 无参数；将设备从 Wi-Fi 网络断开。\n\n### 简单代码示例\n```c\nwifi_disconnect();\n```\n\n\
    ### 代码示例说明\n- 断开 Wi-Fi 网络连接，停止所有互联网通信。\n\n### 注意事项\n- 确保在断开连接之前所有需要的数据传输已完成。\n\
    \n### 警告\n- 在某些系统中，断开后重新连接可能需要初始化。\n\n***\n\n## 相关项目章节\n\n### 项目名称\nWi-Fi 温度监控系统\n\
    \n### 项目目标\n在 RISC-V 微控制器上使用 Wi-Fi 通信监控传感器的温度数据，并将其传输到云服务器。该项目演示了设置 Wi-Fi、连接网络以及向服务器发送数据以进行远程监控的过程。\n\
    \n### RISC-V 开发环境\n该项目将使用 Visual Studio Code 中的 PlatformIO。\n\n### RISC-V 微控制器\n\
    我们将使用 SiFive HiFive1 Rev B 微控制器，并通过 UART 连接外部 Wi-Fi 模块。\n\n### 所需硬件组件\n- SiFive\
    \ HiFive1 Rev B 微控制器\n- 通过 UART 连接的 Wi-Fi 模块\n- 连接到 ADC 引脚的模拟温度传感器\n- 用于接收数据的云服务器端点\n\
    \n### 组件连接表\n| 组件 | RISC-V 引脚 | 额外备注 |\n| :--- | :--- | :--- |\n| Wi-Fi 模块 | UART\
    \ 引脚 | 连接到 Wi-Fi 以上传云端数据 |\n| 温度传感器 | ADC 引脚 | 提供模拟温度数据 |\n\n### 连接分析\nWi-Fi 模块配置为通过指定的\
    \ SSID 和密码访问互联网。读取传感器的温度数据，然后定期上传到云服务器，实现远程监控。\n\n### 程序软件设置\n1. 打开 Visual Studio\
    \ Code 并创建一个新的 PlatformIO 项目。\n2. 配置用于 Wi-Fi 通的 UART 接口和用于温度数据的 ADC。\n3. 实现初始化\
    \ Wi-Fi、读取温度数据并将其发送到云服务器的代码。\n\n### 项目代码\n```c\n#include <stdint.h>\n#include\
    \ <stdio.h>\n\n#define ADC_PIN 0               // 温度传感器的 ADC 通道\n#define SSID\
    \ \"MyWiFiNetwork\"   // Wi-Fi SSID\n#define PASSWORD \"mypassword\" // Wi-Fi\
    \ 密码\n#define SERVER_URL \"http://example.com/api/upload\"\n\nvoid setup()  {\n\
    \    ADC_INIT();                 // 初始化 ADC\n    wifi_init(SSID, PASSWORD);  \
    \   // 使用网络凭初始化 Wi-Fi\n    wifi_connect();             // 连接到 Wi-Fi 网络\n}\n\n\
    // 读取并转换温度数据的函数\nfloat readTemperature()  {\n    int adcValue = ADC_READ();  \
    \             // 读取 ADC 值\n    float voltage =  (adcValue /  1023.0)  *  3.3;\
    \ // 转换为电压\n    return voltage *  100;                   // 将电压转换为温度\n}\n\n//\
    \ 将温度数据发送到服务器的函数\nvoid sendTemperature(float temperature)  {\n    char data[50];\n\
    \    sprintf(data,  \"{\\\"temperature\\\": %.2f}\", temperature);\n    http_post(SERVER_URL,\
    \ data);\n}\n\nint main()  {\n    setup();\n    while  (1)  {\n        float temperature\
    \ = readTemperature();  // 从传感器读取温度\n        sendTemperature(temperature);   \
    \        // 通过 Wi-Fi 发送温度\n        for  (volatile  int i =  0; i <  1000000; i++);\
    \  // 测试用的简单延迟\n    }\n}\n```\n\n### 保存并运行\n1. 使用 PlatformIO 保存、编译并将代码上传到 SiFive\
    \ HiFive1 Rev B 板。\n2. 监控服务器查看温度数据更新。\n\n### 检查输出\n- 验证温度数据是否以 JSON 格式上传到服务器，并定期出现在指定的端点。\n\
    \n"
