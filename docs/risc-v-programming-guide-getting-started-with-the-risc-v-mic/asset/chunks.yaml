  raw: 'Embedded systems often need to communicate with other devices, such as sensors,
    displays, and other microcontrollers. UART (Universal Asynchronous Receiver/Transmitter)
    is a commonly used protocol that transmits data serially, ideal for simple, point-to-point
    connections. SPI (Serial Peripheral Interface) and I2C (Inter-Integrated Circuit)
    are more advanced protocols, supporting multiple devices and offering faster data
    transfer rates for complex systems.


    Syntax Table


    | Serial No | Topic | Syntax | Simple Example |


    | 1 | UART Initialization | UART_INIT(baud_rate); | UART_INIT(9600); |


    | 2 | UART Transmit | UART_WRITE(data); | UART_WRITE(''A''); |


    | 3 | UART Receive | UART_READ(); | char data = UART_READ(); |


    | 4 | SPI Initialization | SPI_INIT(); | SPI_INIT(); |


    | 5 | I2C Initialization | I2C_INIT(); | I2C_INIT(); |


    * * *


    Detailed Breakdown for Each Command


    1\. UART Initialization (UART_INIT)


    What is UART Initialization?


    UART_INIT sets up the UART module with a specific baud rate, configuring the speed
    at which data is transmitted and received. Both communicating devices must share
    the same baud rate.


    Use Purpose


    ● Establish UART Communication: Initializes UART to begin serial communication
    with external devices.


    ● Set Baud Rate: Defines the speed of communication, ensuring synchronization
    with other devices.


    Syntax


    UART_INIT(baud_rate);


    Syntax Explanation


    ● baud_rate: The communication speed, typically in bits per second (bps), such
    as 9600 or 115200.


    Simple Code Example


    UART_INIT(9600);


    Code Example Explanation


    ● Initializes UART with a baud rate of 9600 bps, configuring it for communication
    at this speed.


    Notes


    ●      Ensure the selected baud rate is compatible with the receiving device.


    Warnings


    ●      Mismatched baud rates will result in garbled or unreadable data.


    * * *


    2\. UART Transmit (UART_WRITE)


    What is UART Transmit?


    UART_WRITE sends data over the UART line, typically one byte at a time. It’s commonly
    used to transmit characters, numbers, or commands to other devices.


    Use Purpose


    ● Send Data: Allows the microcontroller to send data to another UART-enabled device,
    such as a PC or sensor.


    ●      Control Communication: Transmits commands or information to an external
    system.


    Syntax


    UART_WRITE(data);


    Syntax Explanation


    ●      data: The character or byte to be transmitted.


    Simple Code Example


    UART_WRITE(''A'');


    Code Example Explanation


    ● Transmits the character ‘A’ over UART, sending it to the connected device.


    Notes


    ●      Multiple characters or strings may require looping through each character.


    Warnings


    ● Ensure data is ready to be sent before calling  UART_WRITE to avoid transmission
    issues.


    * * *


    3\. UART Receive (UART_READ)


    What is UART Receive?


    UART_READ reads data received from another UART device, enabling the microcontroller
    to collect incoming information for processing.


    Use Purpose


    ● Receive Data: Collects data sent from external devices for processing or storage.


    ●      Serial Data Logging: Reads data from sensors or other microcontrollers.


    Syntax


    UART_READ();


    Syntax Explanation


    ●      Reads the incoming byte from the UART line.


    Simple Code Example


    char data = UART_READ();


    Code Example Explanation


    ● Reads a byte from the UART line and stores it in the variable  data.


    Notes


    ● Use in combination with checks to ensure data is available before reading.


    * * *


    4\. SPI Initialization (SPI_INIT)


    What is SPI Initialization?


    SPI_INIT initializes the SPI module for high-speed communication with SPI-compatible
    devices, such as displays and memory chips.


    Use Purpose


    ● Prepare SPI for Data Transfer: Sets up SPI for communication with multiple devices
    at high speed.


    ● Define Master/Slave Mode: Configures the microcontroller as master or slave
    in the SPI communication.


    Syntax


    SPI_INIT();


    Syntax Explanation


    ●      No parameters are typically required; initializes SPI to default settings.


    Simple Code Example


    SPI_INIT();


    Code Example Explanation


    ●      Initializes the SPI module for communication with other SPI devices.


    Notes


    ●      Ensure that each SPI device has a unique chip select line.


    Warnings


    ●      Configure clock polarity and phase correctly to avoid data corruption.


    * * *


    5\. I2C Initialization (I2C_INIT)


    What is I2C Initialization?


    I2C_INIT sets up the I2C bus for communication with I2C devices. I2C is a two-wire
    protocol, enabling multiple devices to communicate on the same bus with unique
    addresses.


    Use Purpose


    ● Prepare I2C for Multi-Device Communication: Initializes the I2C bus for connecting
    multiple devices.


    ● Define Master/Slave Roles: Sets up the microcontroller as a master or slave
    in I2C communication.


    Syntax


    I2C_INIT();


    Syntax Explanation


    ●      Typically no parameters; initializes I2C with default settings.


    Simple Code Example


    I2C_INIT();


    Code Example Explanation


    ●      Initializes the I2C bus, enabling communication with multiple I2C devices.


    Notes


    ●      Each I2C device must have a unique address.


    Warnings


    ●      Incorrect address configurations may result in communication failure.


    * * *


    Relevant Project Section


    Project Name


    Serial Communication with Temperature Sensor


    Project Goal


    Use UART communication on a RISC-V microcontroller to send temperature readings
    from a sensor to a serial monitor. This project demonstrates the setup and use
    of UART to send data to an external device, allowing remote monitoring of sensor
    data.


    RISC-V Development Environment


    This project will use PlatformIO in Visual Studio Code.


    RISC-V Microcontroller


    We will use the SiFive HiFive1 Rev B microcontroller for this project.


    Requirement Components


    ●      SiFive HiFive1 Rev B Microcontroller


    ●      Analog Temperature Sensor connected to an ADC pin


    ●      Serial Communication Interface for data display on a terminal


    Component Connection Table


    | Component | RISC-V Pin | Additional Notes |


    | Temperature Sensor | ADC Pin | Analog temperature data input |


    | Serial Interface | UART Pins | Displays temperature data in terminal |


    Connection Analysis


    The temperature sensor provides an analog reading based on temperature. The microcontroller
    converts this to a digital value, processes it, and sends it over UART to a serial
    terminal, displaying temperature data in real-time.


    Program Software Setup


    1.  Open Visual Studio Code and create a new PlatformIO project.


    2.  Set up the ADC for reading sensor data and configure UART for serial output.


    3.  Implement code to read temperature data, convert it, and transmit it via UART.


    Project Code


    #include  <stdint.h>


    #include  <stdio.h>


    #define ADC_PIN 0               // ADC channel for temperature sensor


    #define BAUD_RATE 9600          // UART baud rate


    void setup()  {


    ADC_INIT();                 // Initialize ADC


    UART_INIT(BAUD_RATE);       // Initialize UART for serial output


    }


    // Function to read and convert temperature data


    float readTemperature()  {


    int adcValue = ADC_READ();                   // Read ADC value


    float voltage =  (adcValue /  1023.0)  *  3.3; // Convert to voltage


    return voltage *  100;                        // Convert voltage to temperature


    }


    void sendTemperature(float temperature)  {


    char buffer[20];


    sprintf(buffer,  "Temp: %.2f°C\n", temperature);


    for  (int i =  0; buffer[i]  !=  ''\0''; i++)  {


    UART_WRITE(buffer[i]);  // Send each character over UART


    }


    }


    int main()  {


    setup();


    while  (1)  {


    float temperature = readTemperature();  // Read temperature from sensor


    sendTemperature(temperature);           // Send temperature over UART


    for  (volatile  int i =  0; i <  1000000; i++);  // Simple delay


    }


    }


    Save and Run


    1.  Save, compile, and upload the code to the SiFive HiFive1 Rev B board using
    PlatformIO.


    2.  Open a serial monitor in PlatformIO set to 9600 baud to observe the temperature
    data.


    Check Output


    ● The serial monitor should display temperature readings in Celsius, sent periodically
    from the microcontroller.'
