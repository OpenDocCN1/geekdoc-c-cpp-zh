  trans: "\n\n`!` 运算符会反转条件的结果，将 `true` 变为 `false`，反之亦然。它用于在状态之间切换或检查虚假条件。\n\n## 用途\n\
    - **否定条件**：反转条件的值，允许代码检查条件是否为假。\n- **错误和状态检查**：常用于确保标志位或错误处于激活状态。\n\n## 语法\n```c\n\
    !a;\n```\n\n## 语法解释\n- `a`: 被反转的条件。如果 `a` 为 `true`，则 `!a` 返回 `false`，反之亦然。\n\n\
    ## 简单代码示例\n```c\nint error = 0;\n\nif (!error) {\n    GPIO_OUT |= (1 << LED_PIN);\
    \  //如果没有错误，则开启 LED\n}\n```\n\n## 代码示例解释\n- 检查 `error` 是否为假。如果为真，则开启 LED。\n\n\
    ## 注意事项\n- 谨慎使用 `!`，因为双重否定会使条件更难以阅读。\n\n## 警告\n- 避免过度否定，因为这可能导致逻辑难以理解。\n\n***\n\
    \n## 相关项目章节\n\n### 项目名称\n双传感器控制 LED 系统\n\n### 项目目标\n在 RISC-V 微控制器上使用布尔运算符，根据来自两个传感器的输入控制\
    \ LED。当两个传感器都检测到物体（与条件）或任一传感器检测到物体（或条件）时，LED 将开启，这演示了布尔逻辑在控制应用中的用法。\n\n### RISC-V\
    \ 开发环境\n此项目将使用 Visual Studio Code 中的 `PlatformIO`。\n\n### RISC-V 微控制器\n我们将使用 `SiFive\
    \ HiFive1 Rev B` 微控制器进行此项目。\n\n### Requirement 组件\n- `SiFive HiFive1 Rev B` 微控制器\n\
    - 两个连接到 GPIO 引脚作为数字输入的接近传感器\n- 连接到 GPIO 引脚作为数字输出的 LED\n\n### 组件连接表\n| 组件 | RISC-V\
    \ 引脚 | 备注 |\n| :--- | :--- | :--- |\n| 接近传感器 1 | GPIO 引脚 | 检测物体是否存在 |\n| 接近传感器\
    \ 2 | GPIO 引脚 | 检测物体是否存在 |\n| LED | GPIO 引脚 | 根据传感器输入进行控制 |\n\n### 连接分析\n接近传感器检测物体并向微控制器提供数字输入信号。LED\
    \ 连接到 GPIO 引脚，并根据应用于传感器输入的布尔逻辑进行控制。\n\n### 程序软件设置\n1. 打开 Visual Studio Code 并创建一个新的\
    \ `PlatformIO` 项目。\n2. 配置用于接近传感器和 LED 的 GPIO 引脚。\n3. 使用布尔运算符实现代码，根据传感器输入控制 LED。\n\
    \n### 项目代码\n```c\n#include <stdint.h>\n#include <stdio.h>\n\n#define LED_PIN 13\
    \              // LED 的 GPIO 引脚\n#define SENSOR1_PIN 2           // 接近传感器 1 的\
    \ GPIO 引脚\n#define SENSOR2_PIN 3           // 接近传感器 2 的 GPIO 引脚\n\nvoid setup()\
    \ {\n    GPIO_DIR |= (1 << LED_PIN);      // 设置 LED 引脚为输出\n    GPIO_DIR &= ~(1\
    \ << SENSOR1_PIN);  // 设置 SENSOR1 引脚为输入\n    GPIO_DIR &= ~(1 << SENSOR2_PIN);\
    \  // 设置 SENSOR2 引脚为输入\n}\n\nvoid controlLED(int sensor1, int sensor2) {\n   \
    \ // 如果两个传感器都检测到物体，则 LED 开启\n    if (sensor1 && sensor2) {\n        GPIO_OUT |=\
    \ (1 << LED_PIN);  // 开启 LED\n    }\n    // 如果任一传感器检测到物体，则 LED \n    else if (sensor1\
    \ || sensor2) {\n        GPIO_OUT |= (1 << LED_PIN);  // 开启 LED\n    }\n    //\
    \ 如果没有传感器检测到物体，则关闭 LED\n    else {\n        GPIO_OUT &= ~(1 << LED_PIN);  // 关闭\
    \ LED\n    }\n}\n\nint main() {\n    setup();\n    while (1) {\n        // 读取传感器值\n\
    \        int sensor1 = (GPIO_IN & (1 << SENSOR1_PIN)) != 0;\n        int sensor2\
    \ = (GPIO_IN & (1 << SENSOR2_PIN)) != 0;\n        controlLED(sensor1, sensor2);\
    \  // 根据传感器输入控制 LED\n        for (volatile int i = 0; i < 100000; i++);  // 简单延迟\n\
    \    }\n}\n```\n\n### 保存并运行\n1. 使用 `PlatformIO` 保存、编译并将代码上传到 `SiFive HiFive1 Rev\
    \ B` 开发板。\n2. 使用接近传感器测试在不同条件下的 LED 行为。\n\n### 检查输出\n- 当两个传感器都检测到物体（与条件）或任一传感器检测到物体（或条件）时，LED\
    \ 应开启。如果两个传感器都没有检测到物体，LED 将保持关闭。\n\n## 用于 RISC-V 微控制器的 C 复合运算符\n\n### 章节概述\nC\
    \ 中的复合运算符将算术运算与赋值结合，允许在单个语句中完成计算和值更新。这些运算符（`+=`, `-=`, `*=`, `/=`, `%=`, `&=`,\
    \ `|=`, `^=`）为常用操作提供了简写，提高了代码的可读性和效率。在嵌入式编程中，复合运算符对于在循环中更新变量和控制状态非常有价值。\n\n###\
    \ 章节目标\n- 理解主要运算符。\n- 学习使用复合运算符。\n\n### 规则\n- 使用复合运算符提高可读性。\n- 避免嵌套运算符。\n- 确保数据类型兼容。\n\
    \n### 简介\n复合运算符通过结合算术运算和赋值来简化代码。\n\n### 注意事项和警告\n- 避免产生意外结果。\n- 确保数据类型兼容。\n- 小心处理大数加法以防止溢出。\n\
    \n### 语法表\n| 序号 | 主题 | 语法 |\n| :--- | :--- | :--- |\n| 1 | 加法 | `a += b` |\n|\
    \ 2 | 减法 | `a -= b` |\n| 3 | 乘法 | `a *= b` |\n| 4 | 除法 | `a /= b` |\n| 5 | 取模\
    \ | `a %= b` |\n| 6 | 位与 | `a &= b` |\n| 7 | 位或 | `a |= b` |\n| 8 | 位异或 | `a ^=\
    \ b` |\n\n***\n\n## 每个命令的详细解析\n\n### 1. 加法复合运算符 (+=)\n什么是加法复合运算符？\n`+=` 运算符将右操作数加到左操作数，并将结果赋值给左操作数。它常用于计数器的增加。\n\
    \n#### 用途\n- 增加计数器。\n- 累积总和。\n\n#### 语法和解释\n- `a`: 被更新的变量。\n- `b`: 加到 `a` 的值。\n\
    \n#### 简单代码示例\n```c\nint counter = 0;\ncounter += 1;\n```\n#### 代码示例解释\n- `counter`\
    \ 增加 1，结果变为 1。\n\n### 2. 减法复合运算符 (-=)\n什么是减法复合运算符？\n`-=` 运算符从左操作数减去右操作数，并将结果赋值给左操作数。它通常用于减少值或减少总和。\n\
    \n#### 用途\n- 减少计数器。\n- 减少总和。\n\n#### 语法和解释\n- `a`: 被更新的变量。\n- `b`: 从 `a` 中减去的值。\n\
    \n#### 简单代码示例\n```c\nint count = 10;\ncount -= 2;\n```\n#### 代码示例解释\n- `count`\
    \ 减去 2，结果为 8。\n\n### 3. 乘法复合运算符 (*=)\n什么是乘法复合运算符？\n`*=` 运算符将左操作数乘以右操作数，并将结果赋值给左操作数。它用于数值缩放。\n\
    \n#### 用途\n- 缩放：通过倍数增加变量。\n\n"
- fmt: "\n## Adjust Values (`*=`)\n\n- Adjust Values: Efficiently multiplies a variable\
    \ in embedded calculations.\n\n### Syntax\n```c\na *= b;\n```\n\n### Syntax Explanation\n\
    - `a`: The variable being updated.\n- `b`: The value by which `a` is multiplied.\
    \ The result is assigned back to `a`.\n\n### Simple Code Example\n```c\nint result\
    \ = 3;\nresult *= 4;\n```\n\n### Code Example Explanation\n- Multiplies `result`\
    \ by 4, making it 12.\n\n### Notes\n- Equivalent to `result = result * 4`.\n\n\
    ### Warnings\n- Check for overflow in multiplication, especially with large integers.\n\
    \n***\n\n## 4. Division Compound Operator (`/=`)\n\n### What is the Division Compound\
    \ Operator?\nThe `//=` operator divides the left operand by the right operand\
    \ and assigns the result to the left operand. It is commonly used to reduce values\
    \ by a divisor.\n\n### Use Purpose\n- **Scaling Down**: Reduces a value by dividing.\
    \ own- **Average Calculations**: Useful in computing averages by dividing totals.\n\
    \n### Syntax\n```c\na /= b;\n```\n\n### Syntax Explanation\n- `a`: The variable\
    \ being updated.\n- `b`: The divisor. The result is assigned back to `a`.\n\n\
    ### Simple Code Example\n```c\nint value = 20;\nvalue /= 4;\n```\n\n### Code Example\
    \ Explanation\n- Divides `value` by 4, making it 5.\n\n### Notes\n- Equivalent\
    \ to `value = value / 4`.\n\n### Warnings\n- Avoid division by zero, as it causes\
    \ runtime errors.\n\n***\n\n## 5. Modulus Compound Operator (`%=`)\n\n### What\
    \ is the Modulus Compound Operator?\nThe `%/=` operator divides the left operand\
    \ by the right operand and assigns the remainder to the left operand. It is used\
    \ to keep values within a range.\n\n### Use Purpose\n- **Cycle Management**: Keeps\
    \ values within a specified boundary.\n- **Odd/Even Checks**: Checks divisibility\
    \ by obtaining remainders.\n\n### Syntax\n```c\na %= b;\n```\n\n### Syntax Explanation\n\
    - `a`: The variable being updated.\n- `b`: The divisor. The remainder is assigned\
    \ back to `a`.\n\n### Simple Code Example\n```c\nint remainder = 10;\nremainder\
    \ %= 3;\n```\n\n### Code Example Explanation\n- Divides `remainder` by 3, setting\
    \ `remainder` to 1.\n\n### Notes\n- Equivalent to `remainder = remainder % 3`.\n\
    \n### Warnings\n- Modulus is only valid for integer types and non-zero divisors.\n\
    \n***\n\n## 6. Bitwise AND Compound Operator (`&=`)\n\n### What is the Bitwise\
    \ AND Compound Operator?\nThe `&=` operator performs a bitwise AND operation between\
    \ two values and assigns the result to the left operand. It is often used to mask\
    \ bits.\n\n### Use Purpose\n- **Masking**: Keeps specific bits in a value while\
    \ clearing others.\n- **Conditional Control**: Used in flag management in embedded\
    \ systems.\n\n### Syntax\n```c\na &= b;\n```\n\n### Syntax Explanation\n- `a`:\
    \ The variable being updated.\n- `b`: The bitmask applied to `a`. The result is\
    \ assigned back to `a`.\n\n### Simple Code Example\n```c\nint flags = 0b1101;\n\
    flags &= 0b0101;\n```\n\n### Code Example Explanation\n- Sets `flags` to `0b0101`\
    \ by masking with `0b0101`.\n\n### Notes\n- Useful for preserving specific bits\
    \ in a binary pattern.\n\n### Warnings\n- Ensure the bitmask is correctly set\
    \ to prevent unintended data loss.\n\n***\n\n## 7. Bitwise OR Compound Operator\
    \ (`|=`)\n\n### What is the Bitwise OR Compound Operator?\nThe `|=` operator performs\
    \ a bitwise OR operation, setting specific bits while keeping others unchanged.\
    \ It is commonly used for setting flags.\n\n### Use Purpose\n- **Flag Setting**:\
    \ Activates specific bits without affecting others.\n- **Feature Enabling**: Often\
    \ used in control registers to enable specific features.\n\n### Syntax\n```c\n\
    a |= b;\n```\n\n### Syntax Explanation\n- `a`: The variable being updated.\n-\
    \ `b`: The bitmask applied to `a`. The result is assigned back to `a`.\n\n###\
    \ Simple Code Example\n```c\nint control = 0b0001;\ncontrol |= 0b0100;\n```\n\n\
    ### Code Example Explanation\n- Sets `control` to `0b0101` by applying a bitwise\
    \ OR with `0b0100`.\n\n### Notes\n- Maintains existing bits.\n\n***\n\n## 8. Bitwise\
    \ XOR Compound Operator (`^=`)\n\n### What is the Bitwise XOR Compound Operator?\n\
    The `^=` operator performs a bitwise XOR operation between two values and assigns\
    \ the result to the left operand. It is often used to toggle bits.\n\n### Use\
