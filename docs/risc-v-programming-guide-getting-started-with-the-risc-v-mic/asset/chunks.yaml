  raw: 'Time and counting are fundamental in embedded programming, allowing microcontrollers
    to manage delays, measure durations, and control time-based events. In RISC-V
    microcontrollers, these operations are essential for tasks like generating PWM
    signals, controlling motors, blinking LEDs, and creating precise timing mechanisms.
    This chapter will cover basic time and counting functions, the syntax of time-related
    commands, and their applications in embedded projects.


    Chapter Goal


    ● Understand the use of time functions and counting loops in embedded C programming.


    ●      Learn to implement delays, count events, and manage time-based actions
    effectively.


    ● Implement a project that uses time and counting to create an LED blink sequence
    with precise timing.


    Rules


    ● Avoid Blocking Delays: Use non-blocking delay methods in critical systems to
    avoid slowing down other operations.


    ● Consider Timer Accuracy: Be mindful of the timer''s accuracy for applications
    requiring precise timing.


    ● Optimize Time-Intensive Loops: Minimize complex calculations within time loops
    to maintain efficiency.


    ● Use Hardware Timers for Accuracy: For more accurate timing, consider using the
    microcontroller''s hardware timers.


    Brief Introduction to Time and Counting


    Time and counting functions in C help microcontrollers manage delays and execute
    time-based tasks. Using delay loops and timers, microcontrollers can control the
    duration of events, create periodic actions, and measure elapsed time. Common
    time functions include  delay,  millis, and counters to increment values over
    time.


    Syntax Table


    | Serial No | Topic | Syntax | Simple Example |


    | 1 | Delay Loop | for loop | for (i=0; i<delay; i++); |


    | 2 | Milliseconds | millis() | unsigned long time = millis(); |


    | 3 | Hardware Timer | timer_init() | timer_init(1000); |


    | 4 | Event Counter | counter++ | eventCounter++; |


    | 5 | Delay Function | delay(ms) | delay(1000); |


    * * *


    Detailed Breakdown for Each Command


    1\. Delay Loop (for loop)


    What is Delay Loop?


    A  for loop can create a delay by counting up to a specific number, creating a
    software delay without relying on hardware timers.


    Use Purpose


    ●      Simple Delays: Implements basic delays in embedded programs.


    ●      Non-Critical Delays: Useful in non-time-sensitive applications.


    Syntax


    for  (int i =  0; i < delay; i++);


    Syntax Explanation


    ●      i: Counter variable that iterates until it reaches  delay.


    ●      delay: Represents the number of loop iterations, controlling delay duration.


    Simple Code Example


    for  (int i =  0; i <  100000; i++);


    Code Example Explanation


    ● Creates a delay by counting up to 100000, pausing program execution momentarily.


    Notes


    ●      Delay duration is approximate and depends on the clock speed.


    Warnings


    ●      Avoid large delays within critical sections to maintain program responsiveness.


    * * *


    2\. Milliseconds (millis)


    What is Milliseconds?


    The  millis function returns the number of milliseconds since the program started.
    It’s commonly used to track elapsed time or schedule periodic tasks.


    Use Purpose


    ●      Event Scheduling: Tracks time for repeating events.


    ●      Elapsed Time Measurement: Measures the duration between events.


    Syntax


    millis();


    Syntax Explanation


    ● millis(): Returns an unsigned long representing the milliseconds elapsed since
    the program started.


    Simple Code Example


    unsigned  long startTime = millis();


    Code Example Explanation


    ● Stores the current time in  startTime to track the beginning of an event.


    Notes


    ●      millis() typically rolls over after reaching the maximum unsigned long
    value.


    Warnings


    ●      Be cautious with rollover if the program runs for extended periods.


    * * *


    3\. Hardware Timer (timer_init)


    What is Hardware Timer?


    timer_init initializes a hardware timer with a specified frequency, offering accurate
    timing without blocking the CPU. Hardware timers are essential for PWM, precise
    delays, and periodic interrupts.


    Use Purpose


    ●      Accurate Timing: Generates precise time intervals.


    ●      Periodic Actions: Triggers recurring actions, like reading sensors.


    Syntax


    timer_init(frequency);


    Syntax Explanation


    ●      frequency: Sets the timer’s frequency, defining how often it triggers.


    Simple Code Example


    timer_init(1000); // Sets timer to 1kHz


    Code Example Explanation


    ● Configures the timer to trigger at 1kHz, useful for 1ms periodic tasks.


    Notes


    ●      Hardware timers operate independently, providing accurate timing.


    Warnings


    ●      Ensure proper timer initialization to avoid conflicts with other processes.


    * * *


    4\. Event Counter (counter++)


    What is Event Counter?


    The  counter++ syntax increments a counter variable, commonly used to count events
    or occurrences.


    Use Purpose


    ●      Event Counting: Counts the number of times an event occurs.


    ●      Loop Control: Manages iterations within a loop.


    Syntax


    counter++;


    Syntax Explanation


    ● counter: The variable that increments by 1 each time it is accessed.


    Simple Code Example


    int eventCounter =  0;


    eventCounter++;


    Code Example Explanation


    ●      Increments  eventCounter by 1, tracking the number of events.


    Notes


    ●      Counter variables can be reset as needed to restart the count.


    Warnings


    ● Prevent overflow by choosing an appropriate data type, such as  unsigned int.


    * * *


    5\. Delay Function (delay)


    What is Delay Function?


    The  delay function pauses program execution for a specified number of milliseconds.
    It provides a simple, blocking delay that’s useful in basic timing control.


    Use Purpose


    ●      Fixed Duration Delay: Pauses the program temporarily.


    ●      Timing Control: Controls the duration of operations, like LED blink rate.


    Syntax


    delay(ms);


    Syntax Explanation


    ●      ms: The delay duration in milliseconds.


    Simple Code Example


    delay(1000); // 1-second delay


    Code Example Explanation


    ●      Pauses program execution for 1 second.


    Notes


    ●      Delay function blocks other tasks; avoid in critical applications.


    Warnings


    ●      Blocking delays halt program execution; use sparingly in time-sensitive
    systems.


    * * *


    Relevant Project Section


    Project Name


    LED Blink Sequence with Precise Timing


    Project Goal


    Use time and counting functions on a RISC-V microcontroller to create an LED blink
    sequence with controlled timing. This project demonstrates basic delay functions,
    event counters, and hardware timers to control LED behavior.


    RISC-V Development Environment


    This project will use PlatformIO in Visual Studio Code.


    RISC-V Microcontroller


    We will use the SiFive HiFive1 Rev B microcontroller for this project.


    Requirement Components


    ●      SiFive HiFive1 Rev B Microcontroller


    ●      LED connected to a GPIO pin for timing control


    Component Connection Table


    | Component | RISC-V Pin | Additional Notes |


    | LED | GPIO Pin 2 | Controls LED timing |


    Connection Analysis


    The LED is connected to a GPIO pin. Using time functions, the microcontroller
    controls the LED blink interval, creating a sequence with a precise timing pattern.


    Program Software Setup


    1.  Open Visual Studio Code and create a new PlatformIO project.


    2.  Set up the GPIO pin for the LED.


    3.  Implement code using delays, counters, and timers to create a blink sequence.


    Project Code


    #include  <stdint.h>


    #include  <stdio.h>


    #define LED_PIN 2               // GPIO pin for LED


    #define BLINK_INTERVAL 1000     // 1-second blink interval


    void setup()  {


    GPIO_DIR |=  (1  << LED_PIN);  // Set LED pin as output


    }


    void blinkLED()  {


    GPIO_OUT ^=  (1  << LED_PIN);  // Toggle LED state


    }


    int main()  {


    setup();


    unsigned  long previousMillis =  0;


    while  (1)  {


    unsigned  long currentMillis = millis();


    // Check if the interval has passed


    if  (currentMillis - previousMillis >= BLINK_INTERVAL)  {


    previousMillis = currentMillis;  // Update previous time


    blinkLED();                      // Toggle LED state


    }


    }


    }


