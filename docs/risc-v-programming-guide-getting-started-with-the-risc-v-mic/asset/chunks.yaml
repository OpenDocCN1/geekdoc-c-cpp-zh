    C files.


    Warnings


    ● Ensure variables with  extern are defined only once; multiple definitions cause
    errors.


    * * *


    Relevant Project Section


    Project Name


    Button-Controlled LED with Variable Scope Management


    Project Goal


    Create a program on the RISC-V microcontroller to toggle an LED using a button
    press, demonstrating the use of local, global, and static variables to manage
    state and functionality efficiently.


    RISC-V Development Environment


    This project will use PlatformIO in Visual Studio Code to build, upload, and debug
    the program on the RISC-V microcontroller.


    RISC-V Microcontroller


    This example uses the SiFive HiFive1 Rev B microcontroller, based on the SiFive
    Freedom E310 RISC-V core, suitable for embedded applications.


    Requirement Components


    ●      SiFive HiFive1 Rev B RISC-V Microcontroller


    ●      Button connected to an input pin


    ●      LED connected to an output pin


    Component Connection Table


    | Component | RISC-V Pin | Additional Notes |


    | Button | GPIO Pin | Used to control LED toggle function |


    | LED | GPIO Pin | LED toggles on and off based on button |


    Connection Analysis


    The button’s state is read to determine whether the LED should toggle on or off.
    Global variables manage the button’s state, static variables maintain the LED
    state between function calls, and local variables temporarily store values within
    the function.


    Program Software Setup


    1.  Open Visual Studio Code with PlatformIO.


    2.  Create a new PlatformIO project and select SiFive HiFive1 Rev B as the board.


    3.  Implement code to toggle the LED based on button press, managing variable
    scope effectively.


    Project Code


    #include  <stdint.h>


    #include  "hifive1_gpio.h"  // Adjust for your SDK


    const  int BUTTON_PIN =  2;  // GPIO pin for button


    const  int LED_PIN =  13; // GPIO pin for LED


    // Global variable to store button state


    int buttonState =  0;


    void setup()  {


    GPIO_DIR |=  (1  << LED_PIN);      // Set LED_PIN as output


    GPIO_DIR &=  ~(1  << BUTTON_PIN); // Set BUTTON_PIN as input


    GPIO_OUT &=  ~(1  << LED_PIN);     // Initialize LED off


    }


    void toggleLED()  {


    static  int ledState =  0;  // Static variable to retain LED state


    if  (ledState)  {


    GPIO_OUT &=  ~(1  << LED_PIN);  // Turn off LED


    }  else  {


    GPIO_OUT |=  (1  << LED_PIN);  // Turn on LED


    }


    ledState =  !ledState;  // Toggle ledState for next call


    }


    int main()  {


    setup();


    while  (1)  {


    int currentButtonState =  (GPIO_IN &  (1  << BUTTON_PIN))  !=  0;  // Local variable


    if  (currentButtonState != buttonState)  {


    if  (currentButtonState ==  1)  {  // Button pressed


    toggleLED();  // Toggle LED state


    }


    buttonState = currentButtonState;  // Update global button state


    }


    for  (volatile  int i =  0; i <  10000; i++);  // Debounce delay


    }


    }


    Save and Run


    1.  Save, compile, and upload the code to the SiFive HiFive1 Rev B board using
    PlatformIO.


    2.  Press the button to toggle the LED state, verifying that variable scope is
    managed correctly.


