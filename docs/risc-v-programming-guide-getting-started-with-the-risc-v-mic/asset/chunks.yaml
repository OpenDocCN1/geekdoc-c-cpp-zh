    # (c) 乘以参考电压


    将归一化值乘以参考电压，可以将比例转换为实际电压。


    ## 逐步示例


    假设系统包含以下配置：


    * 一个 10 位 ADC（最大 ADC 值 = `1023`）

    * `5.0V` 的参考电压

    *  原始 ADC 读取数值为 `256`


    ### 第一步：归一化 ADC 值


    ![](img/image_rsrc706.jpg)


    ### 第二步：乘以参考电压


    `Voltage=0.25×5.0=1.25V`


    因此，ADC 值 `256` 对应于 `1.25V`。


    ## 可视化


    * ADC 分辨率：10 位

    * 参考电压：`3.3V`


    | ADC 值 | 比例 (ADCValue/1023) | 电压 (V) |

    | :--- | :--- | :--- |

    | 0 | `0/1023=0.0` | `0.0V` |

    | 256 | `256/1023≈0.25` | `0.25×3.3=0.825V` |

    | 512 | `512/1023≈0.5` | `0.5×3.3=1.65V` |

    | 768 | `768/1023≈0.75` | `0.75×3.3=2.475V` |

    | 1023 | `1023/1023=1.0` | `1.0×3.3=3.3V` |


    ## 语法表


    | 序号 | 主题 | 语法 | 简单示例 |

    | :--- | :--- | :--- | :--- |

    | 1 | 初始化 ADC | `ADC_INIT();` | `ADC_INIT();` |

    | 2 | 设置 ADC 通道 | `ADC_SELECT_CHANNEL(channel);` | `ADC_SELECT_CHANNEL(1);` |

    | 3 | 开始 ADC 转换 | `ADC_START_CONVERSION();` | `ADC_START_CONVERSION();` |

    | 4 | 读取 ADC 结果 | `ADC_READ();` | `int value = ADC_READ();` |

    | 5 | 转换为电压 | `voltage = (value / 1023.0) * ref;` | `float voltage = (value /
    1023.0) * 3.3;` |


    ***


    ## 每个命令的详细说明


    ### 1. 初始化 ADC


    #### 什么是 ADC 初始化？

    初始化 ADC 是通过配置必要的设置（如参考电压、分辨率和任何所需的内部组件），为微控制器执行模拟到数字的转换做好准备。


    ### 使用用途

    * 设置 ADC 硬件：确保 ADC 已通过所有必要配置准备好就绪。

    * 准备准确读取：通过设置参考电压和分辨率，确保转换的稳定和准确。


    ### 语法

    ```

    ADC_INIT();

    ```


    ### 语法解释

    * `ADC_INIT`：此函数通常使用默认或用户定义的配置初始化 ADC 外设。它可能包括设置 ADC 时钟、启用 ADC 模块以及设置参考电压。


    ### 简单代码示例

    ```

    ADC_INIT();

    ```


    ### 代码示例解释

    * 此代码初始化 ADC 模块，使其准备好进行模拟到数字转换。


    ### 注意事项

    * 在启动任何转换之前务必初始化 ADC，以避免错误结果。


    ### 警告

    * 确保参考电压和分辨率与传感器要求匹配以获得准确读取。


    ***


    ### 2. 设置 ADC 通道


    #### 什么是设置 ADC 通道？

    设置 ADC 通道用于配置 ADC 从哪个模拟输入引脚读取。微控制器通常支持多个模拟通道，每个通道对应一个特定的引脚。


    ### 使用用途

    * 选择读取模拟引脚：引导 ADC 从正确的引脚读取。

    * 在通道之间切换：允许通过选择不同的通道读取多个模拟传感器。


    ### 语法

    ```

    ADC_SELECT_CHANNEL(channel);

    ```


    ### 语法解释

    * `ADC_SELECT_CHANNEL`：此函数为 ADC 转换选择指定的通道。参数 `channel` 对应微控制器中配置的模拟引脚号或通道号。


    ### 简单代码示例

    ```

    ADC_SELECT_CHANNEL(1);

    ```


    ### 代码示例解释

    * 此代码设置 ADC 从通道 1 读取，允许 ADC 读取对应引脚的模拟信号。


    ### 注意事项

    * 部分微控制器可能使用专用的函数或寄存器进行通道选择。


    ### 警告

    * 在转换过程中切换通道可能会导致结果错误。确保在更改通道之前转换完成。


    ***


    ### 3. 开始 ADC 转换


    #### 什么是启动 ADC 转换？

    启动 ADC 转换指示 ADC 采样模拟输入将其转换为数字值。此过程必须在读取结果之前完成。


    ### 使用目的

    * 开始模拟读取：启动读取模拟值的转换过程。

    * 捕获当前信号：在当前信号电上采样输入。


    ### 语法

    ```

    ADC_START_CONVERSION();

    ```


    ### 语法解释

    * `ADC_START_CONVERSION`：此函数开始模拟到数字转换过程。调用时，ADC 开始采样选定的模拟通道并将电压转换为数字值。


    ### 简单代码示例

    ```

    ADC_START_CONVERSION();

    ```


    ### 代码示例解释

    * 此代码启动 ADC 转换过程，开始读取和转换所选通道上的模拟信号。


    ### 注意事项

    * 转换时间可能根据不同而异。


    ### 警告

    * 在转换完成前启动新的转换可能会导致数据错误。


    ***


    ### 4. 读取 ADC 结果


    #### 什么是读取 ADC 结果？

    读取 ADC 结果是获取转换后的数字值，该值代表模拟电压。


    ### 使用目的

    * 获取转换数据：检索数字值。

    * 用于计算：获取结果用于计算。


    ### 语法

    ```

    int value = ADC_READ();

    ```


    ### 语法解释

    * `ADC_READ`：此函数返回 ADC 的数字结果。


    ### 简单代码示例

    ```

    int value = ADC_READ();

    ```


    ### 代码示例解释

    * 此代码读取数字值并将其存储在变量 `value` 中。


    ### 注意事项

    * 返回值取决于 ADC 的分辨率。


    ### 警告

    * 在转换完成前调用可能会失败。


    ***


    ### 5. 转换为电压


    #### 什么是转换为电压？

    读取 ADC 结果后，可能需要将其转换为电压。使用已知参考电压和 ADC 分辨率，可以将数字值还原为电压。


    ### 使用目的

    * 数字翻译：将 ADC 结果转换为电压。

    * 传感器数据解释：允许解释读取值。


    ### 语法

    ```

    float voltage = (value / 1023.0) * ref;

    ```


    ### 语法解释

    * `value`：ADC 的数字结果。

    * `1023.0`：10 位 ADC 的最大值，此处作为缩放因子。

    * `ref`：ADC 的参考电压，通常为 3.3V 或 5V。


    ### 简单代码示例

    ```

    float voltage = (value / 1023.0) * 3.3;

    ```


    ### 代码示例解释

    * 此代码将原始 ADC 值转换为电压，假设参考电压为 3.3V 且 ADC 为 10 位。


    ### 注意事项

    * 参考电压应与 ADC 实际匹配以确保准确。


    ### 警告

    * 缩放错误会导致电压读取不准确。


    ***


    ## 相关项目


    ### 项目名称

    温度传感器读取


    ### 项目目标

    使用 RISC-V 微控制器的 ADC 读取模拟传感器，并将读取转换为摄氏度。


    ### RISC-V 开发环境

    此项目将使用 Visual Studio Code 中的 PlatformIO 进行构建。


    ### RISC-V 微控制器

    项目使用了基于 SiFive Freedom E310 RISC-V 内的 SiFive HiFive1 Rev B 微控制器。


    ### 组件

    * SiFive HiFive1 Rev B 微控制器

    * 连接到模拟输入引脚的模拟温度传感器（例如 TMP36）

    * 用于显示温度读取的显示器或串口


    ### 组件连接表


    | 组件 | RISC-V 引脚 | 备注 |

    | :--- | :--- | :--- |

    | 温度传感器 | ADC 引脚 | 模拟传感器输出已连接 |

    | 显示器/串口输出 | UART/串口 | 用于显示温度输出 |


