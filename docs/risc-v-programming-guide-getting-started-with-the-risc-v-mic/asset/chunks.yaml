- fmt: "\n* Its open-source nature eliminates licensing costs, making it more affordable\
    \ for budget-conscious applications.\n* Compared to `ARM`, `RISC-V` provides similar\
    \ performance while offering greater design flexibility.\n\n## Flexibility for\
    \ Developers\n\n`RISC-V`’s modular ISA enables custom instruction sets, reducing\
    \ power consumption and die size for specific applications like IoT sensors and\
    \ robotics.\n\n* * *\n\n## HiFive1 Rev B Pinout and Features\n\n### HiFive1 Rev\
    \ B Overview\nThe `HiFive1 Rev B` is a development board designed by SiFive for\
    \ RISC-V programming and prototyping. It features the `SiFive FE310-G002` microcontroller.\n\
    \n### Key Features\n* Clock Speed: Up to 320 MHz.\n* Memory: 16 KB instruction\
    \ cache, 8 KB SRAM.\n* GPIO Pins: 19 digital I/O pins with multi-function support.\n\
    * Peripherals: `SPI`, `I2C`, `PWM`, `UART`.\n* Connectivity: `USB` for programming\
    \ and debugging.\n\n![](image_rsrc701.jpg)\n\n### Pinout Table\n\n| Pin | Function\
    \ | Description |\n| `GPIO0-GPIO17` | Digital I/O, `PWM`, `UART`, `SPI` | General-purpose\
    \ I/O pins |\n| `A0-A3` | Analog inputs | `ADC` for reading sensor signals |\n\
    | `VIN` | Power input | Supplies voltage to the board |\n| `GND` | Ground | Common\
    \ ground |\n| `RESET` | Reset input | Resets the microcontroller |\n\n### Voltage\
    \ Levels and Alternate Functions\n* GPIO Voltage Levels: Operates at 3.3V logic\
    \ levels.\n* Alternate Functions: Many `GPIO` pins double as communication or\
    \ peripheral interfaces, such as `UART` (serial communication) or `SPI` (serial\
    \ peripherals).\n\n## RISC-V Architecture Overview\n\n* * *\n\n### Core Features\
    \ of RISC-V\n`RISC-V` is a modern implementation of the Reduced Instruction Set\
    \ Computing (`RISC`) philosophy. Its architecture prioritizes simplicity, efficiency,\
    \ and scalability, making it highly adaptable for various applications, from microcontrollers\
    \ to supercomputers.\n\n### Principles of Reduced Instruction Set Computing (RISC)\n\
    * Simplified Instruction Set: `RISC` architectures use fewer, more streamlined\
    \ instructions that can execute in a single clock cycle, improving efficiency.\n\
    * Load/Store Architecture: Arithmetic and logic operations are performed only\
    \ on registers, while memory access is limited to specific instructions, reducing\
    \ complexity.\n* Uniform Instruction Format: Fixed-length instructions simplify\
    \ decoding and pipelining in hardware, enhancing performance.\n\n### Modular Design\
    \ of RISC-V ISA\n`RISC-V`'s architecture is inherently modular, allowing developers\
    \ to select only the features they need. This approach leads to optimized designs\
    \ tailored for specific use cases.\n* Base ISA: The foundational instruction set,\
    \ required for all `RISC-V` implementations.\n* Extensions: Optional additions\
    \ that enhance functionality, such as floating-point operations or atomic instructions.\n\
    \n* * *\n\n## Instruction Set Architecture (ISA)\n\n### Base Integer Set: RV32I\n\
    The `RV32I` base instruction set is the core of `RISC-V`'s design, providing 32-bit\
    \ instructions for basic integer operations.\n* Arithmetic Operations: Add, subtract,\
    \ shift, and logical operations.\n* Control Flow: Branching and jumping instructions\
    \ for program flow.\n* Memory Access: Load and store operations for interacting\
    \ with memory.\n\n#### Example RV32I Instructions:\n* `ADD rd, rs1, rs2`: Adds\
    \ the values in registers `rs1` and `rs2`, storing the result in `rd`.\n* `LW\
    \ rd, offset(rs1)`: Loads a word from memory at the address specified by `rs1\
    \ + offset` into `rd`.\n\n### Common Extensions\n1. `M` (Multiplication/Division):\n\
    * Adds hardware support for multiply and divide operations, critical for numerical\
    \ applications like digital signal processing.\n* Example: `MUL rd, rs1, rs2`\
    \ (Multiplies values in `rs1` and `rs2`, stores the result in `rd`).\n2. `C` (Compressed\
    \ Instructions):\n* Introduces 16-bit instructions to reduce code size, ideal\
    \ for memory-constrained environments like IoT devices.\n* Example: `C.ADDI` (Compressed\
    \ version of `ADDI` instruction).\n3. `F` and `D` (Floating-Point):\n* Enables\
    \ single (`F`) and double (`D`) precision floating-point calculations for scientific\
    \ and graphical applications.\n\n* * *\n\n## Registers and Memory Layout\n\n###\
    \ General-Purpose Registers and Memory Addressing\n`RISC-V` features 32 general-purpose\
    \ registers (`x0` to `x31`), each 32 or 64 bits wide depending on the ISA.\n*\
    \ `x0`: Always holds the value 0.\n* `x1 (ra)`: Return address register for function\
    \ calls.\n* `x2 (sp)`: Stack pointer for managing local variables and function\
    \ calls.\n* `x10-x17 (a0-a7)`: Used for passing arguments to functions and returning\
    \ results.\n\n### RISC-V Memory Addressing Modes\n1. Base + Offset: The effective\
    \ address is calculated as base register + offset.\n* Example: `LW x5, 4(x10)`\
    \ (Loads a word from memory at address `x10 + 4` into `x5`).\n2. PC-Relative Addressing:\
    \ Useful for branching and jumping instructions, where the target address is relative\
    \ to the current program counter (`PC`).\n3. Register-Indirect Addressing: Allows\
    \ dynamic memory access by specifying the address in a register.\n\n### Little-Endian\
    \ Format and Addressing Schemes\n`RISC-V` uses little-endian memory representation,\
    \ where the least significant byte is stored at the lowest memory address. This\
    \ format simplifies interoperability with modern systems and peripherals.\n\n\
    * * *\n\n## SiFive E31 Core in HiFive1 Rev B\n\n### Overview of the Core Architecture\n\
    The `SiFive E31` is a high-performance, 32-bit `RISC-V` core implemented in the\
    \ `HiFive1 Rev B`, designed for embedded systems.\n\n### Key Features of the E31:\n\
    * RV32IMAC ISA: Implements the base integer set (`RV32I`) along with `M`, `A`,\
    \ and `C` extensions.\n* Pipeline: 5-stage in-order pipeline for efficient execution.\n\
    * Interrupt Controller: Supports advanced interrupt handling for real-time applications.\n\
    \n### Customization and Performance\n* Custom Instructions: Developers can add\
    \ custom instructions to optimize performance.\n* Low Power Consumption: Designed\
    \ for IoT and wearable devices.\n* Cache System: Includes 16 KB instruction cache,\
    \ reducing memory access latency.\n\n* * *\n\n## RISC-V Microcontroller Ecosystem\n\
    \n* * *\n\n### Overview of Popular RISC-V Boards\nThe growing `RISC-V` ecosystem\
    \ includes several development boards designed for prototyping, learning, and\
    \ deploying embedded applications.\n\n#### 1. SiFive HiFive1 Rev B\n* Processor:\
    \ `SiFive FE310-G002` (`RV32IMAC`).\n* Clock Speed: Up to 320 MHz.\n* Memory:\
    \ 16 KB instruction cache, 8 KB SRAM.\n* Features:\n    * 19 `GPIO` pins.\n  \
    \  * `SPI`, `I2C`, `PWM`, and `UART` peripherals.\n    * Arduino-compatible headers\
    \ for easy prototyping.\n* Applications: IoT devices, education, and general-purpose\
    \ embedded systems.\n\n#### 2. ESP32-C3\n* Processor: 32-bit `RISC-V` core with\
    \ integrated Wi-Fi and Bluetooth Low Energy (`BLE`).\n* Clock Speed: Up to 160\
    \ MHz.\n* Features:\n    * 12-bit `ADC`, `UART`, `SPI`, and `I2C` interfaces.\n\
    \    * On-chip security features like secure boot and hardware cryptography.\n\
    * Applications: IoT devices requiring wireless connectivity, such as smart home\
    \ and wearables.\n\n#### 3. GD32VF103\n* Processor: `Bumblebee` `RISC-V` core\
    \ (`RV32IMAC`).\n* Clock Speed: Up to 108 MHz.\n* Features:\n    * Rich peripheral\
    \ set, including timers, `ADC`, `DAC`, `UART`, `SPI`, and `I2C`.\n    * Low power\
    \ consumption with advanced interrupt handling.\n* Applications: Industrial automation,\
    \ robotics, and low-power consumer electronics.\n\n* * *\n\n### Development Tools\
    \ and Resources\nA robust set of tools and resources supports `RISC-V` development,\
    \ making it accessible for beginners and professionals alike.\n\nFreedom Studio\n\
    * SiFive’s Eclipse-based IDE designed for `RISC-V` development.\n* Provides integrated\
    \ debugging, code editing, and project management.\n* Preconfigured toolchains\
    \ for boards like the `HiFive1 Rev B`.\n\nPlatformIO\n* A cross-platform IDE with\
    \ `RISC-V` support via `VS Code`.\n"
