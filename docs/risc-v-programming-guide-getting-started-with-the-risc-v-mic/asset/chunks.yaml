    \ | `if (distance <= 10)` |\n\n***\n\n## 每个命令的详细分解\n\n### 1. 等于 (==)\n\n#### 什么是等于？\n\
    `==` 运算符检查两个值是否相等，如果匹配则返回 `true`。该运算符通常用于验证条件，例如检查传感器值是否等于指定的阈值。\n\n#### 用途\n\
    ● **相等性检查**：验证两个值是否相同，例如验证模式或状态。\n● **条件执行**：用在 `if` 语句中，当两个值匹配时执行操作。\n\n### 语法\n\
    ```\na == b;\n```\n\n### 语法解释\n● `a` 和 `b`：正在比较的两个值或变量。如果 `a` 和 `b` 相等，结果为 `true`。\n\
    \n### 简单代码示例\n```cpp\nint temp = 25;\nif (temp == 25) {\n  GPIO_OUT |= (1 << FAN_PIN);\
    \  // 如果温度为 25，开启风扇\n}\n```\n\n### 代码示例解释\n● 检查 `temp` 是否等于 `25`。如果是，则开启风扇。\n\n\
    ### 注意事项\n● 使用 `==` 进行相等比较；不要将其与 `=`（赋值运算符）混淆。\n\n### 警告\n● 确保两个值具有兼容的数据类型，以避免意外行为。\n\
    \n***\n\n### 2. 不等于 (!=)\n\n#### 什么是不等于？\n`!=` 运算符检查两个值是否不同，如果不匹配则返回 `true`。它对于在值偏离预期状态时执行代码非常有用。\
    \ \n\n#### 用途\n● **不等性检查**：如果两个值不相同，则触发操作，例如处理错误状态。\n● **循环条件**：用在循环中，直到值匹配为止持续继续操作。\n\
    \n### 语法\n```\na != b;\n```\n\n### 语法解释\n● `a` 和 `b`：正在比较的两个值或变量。如果 `a` 和 `b`\
    \ 不相等，则结果为 `true`。\n\n### 简单代码示例\n```cpp\nint mode = 2;\nif (mode != 1) {\n  GPIO_OUT\
    \ &= ~(1 << LED_PIN);  // 如果模式不是 1，关闭 LED\n}\n```\n\n### 代码示例解释\n● 检查 `mode` 是否等于\
    \ `1`。如果不是，则关闭 LED。\n\n***\n\n### 3. 大于 (>)\n\n#### 什么是大于？\n`>` 运算符检查一个值是否大于另一个。\n\
    \n#### 用途\n● **阈值检查**：检查值是否超过某个限值。\n● **控制逻辑**：当值超过设定值时触发操作。\n\n### 语法\n```\n\
    a > b;\n```\n\n### 语法解释\n● `a` 和 `b`：正在比较的两个值或变量。如果 `a` 大于 `b`，结果为 `true`。\n\n\
    ### 简单代码示例\n```cpp\nint speed = 60;\nif (speed > 50) {\n  GPIO_OUT |= (1 << ALARM_PIN);\
    \  // 触发报警\n}\n```\n\n### 代码示例解释\n● 检查 `speed` 是否大于 `50`。如果是，则触发报警。\n\n***\n\n\
    ### 4. 小于 (<)\n\n#### 什么是小于？\n`<` 运算符检查一个值是否小于另一个。\n\n#### 用途\n● **低位检查**：检查值是否低于某个阈值。\n\
    ● **范围限制**：确保值在特定范围内运行。\n\n### 语法\n```\na < b;\n```\n\n### 语法解释\n● `a` 和 `b`：正在比较的两个值或变量。如果\
