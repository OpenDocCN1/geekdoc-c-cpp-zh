    5\. Void Function


    What is Void Function?


    A void function performs tasks but does not return a value. It’s useful for actions
    that don''t require feedback, such as LED control or printing messages.


    Use Purpose


    ●      Perform Actions: Executes code without returning a result.


    ● Hardware Control: Ideal for tasks like blinking an LED or turning on a motor.


    Syntax


    void functionName()  {


    // Code to execute


    }


    Syntax Explanation


    ●      void: Specifies that the function does not return any value.


    Simple Code Example


    void blinkLED()  {


    // Toggle LED


    }


    Code Example Explanation


    ● Defines a function  blinkLED that controls the LED without returning a value.


    Notes


    ●      Void functions are commonly used for I/O operations in embedded systems.


    Warnings


    ●      Void functions cannot return a value.


    * * *


    Relevant Project Section


    Project Name


    Sensor-Based LED Control with Functions


    Project Goal


    Use functions on a RISC-V microcontroller to read a sensor value and control an
    LED based on thresholds. This project demonstrates how functions organize code,
    making it modular and reusable.


    RISC-V Development Environment


    This project will use PlatformIO in Visual Studio Code.


    RISC-V Microcontroller


    We will use the SiFive HiFive1 Rev B microcontroller for this project.


    Requirement Components


    ●      SiFive HiFive1 Rev B Microcontroller


    ●      Analog Temperature Sensor connected to an ADC pin


    ●      LED connected to a GPIO pin to indicate temperature range


    Component Connection Table


    | Component | RISC-V Pin | Additional Notes |


    | Temperature Sensor | ADC Pin | Provides analog temperature data |


    | LED | GPIO Pin | Turns on if temperature exceeds threshold |


    Connection Analysis


    The temperature sensor provides an analog value representing temperature. A function
    reads this value, converts it, and another function controls the LED based on
    temperature thresholds.


    Program Software Setup


    1.  Open Visual Studio Code and create a new PlatformIO project.


    2.  Set up the ADC for sensor reading and the GPIO pin for the LED.


    3.  Implement functions for reading sensor data, converting values, and controlling
    the LED.


    Project Code


    #include  <stdint.h>


    #include  <stdio.h>


    #define LED_PIN 2               // GPIO pin for LED


    #define TEMP_THRESHOLD 30       // Temperature threshold in Celsius


    void setup()  {


    GPIO_DIR |=  (1  << LED_PIN);  // Set LED pin as output


    ADC_INIT();                 // Initialize ADC for sensor reading


    }


    // Function to read the sensor and convert to Celsius


    float readTemperature()  {


    int adcValue = ADC_READ();


    float voltage =  (adcValue /  1023.0)  *  3.3;


    return voltage *  100; // Convert voltage to temperature (example)


    }


    // Function to control LED based on temperature


    void controlLED(float temperature)  {


    if  (temperature >= TEMP_THRESHOLD)  {


    GPIO_OUT |=  (1  << LED_PIN);  // Turn LED on


    }  else  {


    GPIO_OUT &=  ~(1  << LED_PIN);  // Turn LED off


    }


    }


    int main()  {


    setup();


    while  (1)  {


    float temperature = readTemperature();  // Read temperature


    controlLED(temperature);               // Control LED based on temperature


    for  (volatile  int i =  0; i <  1000000; i++);  // Simple delay


    }


    }


    Save and Run


    1.  Save, compile, and upload the code to the SiFive HiFive1 Rev B board using
    PlatformIO.


    2.  Observe the LED, which turns on when the temperature exceeds the threshold.


    Check Output


    ● The LED should turn on when the temperature is above the threshold and turn
    off when below.


    ## Power Management in RISC-V Microcontrollers


    Chapter Overview


    Power management is essential in embedded systems, particularly for applications
    that run on batteries or have strict energy constraints. By reducing power consumption,
    microcontrollers can extend battery life, lower heat production, and improve efficiency.
    RISC-V microcontrollers offer various power management features such as sleep
    modes, low-power modes, and peripheral control. This chapter will cover common
    power management techniques, their syntax, and practical applications in embedded
    projects.


    Chapter Goal


    ●      Understand power management modes and functions available in RISC-V microcontrollers.


    ●      Learn how to implement low-power techniques to optimize power consumption.


    ● Implement a project to use sleep modes and wake up the microcontroller on an
    external event.


    Rules


    ● Use Low-Power Modes When Idle: Engage sleep modes when the microcontroller is
    not performing critical tasks.


    ● Disable Unused Peripherals: Turn off peripherals that are not required to conserve
    power.


    ● Optimize Wake-Up Events: Configure the microcontroller to wake up only on essential
    events.


    ● Monitor Battery Levels: In battery-powered applications, track battery levels
    and adjust power settings accordingly.


    Brief Introduction to Power Management


    Power management functions allow the microcontroller to save energy by entering
    low-power states, such as sleep modes, where it uses minimal power. Different
    sleep modes offer various levels of power savings and operational states. Microcontrollers
    can also selectively enable or disable peripherals, ensuring that only necessary
    components consume power.


    Syntax Table


    | Serial No | Topic | Syntax |


    | 1 | Enter Sleep Mode | enter_sleep_mode(); |


    | 2 | Wake-Up Source | set_wakeup_source(pin); |


    | 3 | Disable Peripheral | disable_peripheral(name); |


    | 4 | Enable Peripheral | enable_peripheral(name); |


    | 5 | Sleep for Duration | sleep(duration); |


    * * *


    Detailed Breakdown for Each Command


    1\. Enter Sleep Mode (enter_sleep_mode)


    What is Enter Sleep Mode?


    The  enter_sleep_mode function puts the microcontroller into a low-power state,
    where it consumes minimal power but retains the ability to wake up on specific
    events.


    Use Purpose


    ●      Reduce Power Usage: Minimizes energy consumption when the system is idle.


    ●      Extend Battery Life: Critical for battery-powered applications to save
    energy.


    Syntax


    enter_sleep_mode();


    Syntax Explanation


    ● enter_sleep_mode: Function call that sends the microcontroller into its designated
    low-power sleep mode.


    Simple Code Example


    enter_sleep_mode();


    Code Example Explanation


    ● Puts the microcontroller into sleep mode, reducing power consumption until a
    wake-up event occurs.


    Notes


    ● The specific behavior depends on the configured sleep mode and wake-up sources.


    Warnings


    ● Ensure wake-up sources are configured; otherwise, the microcontroller may remain
    in sleep mode indefinitely.


    * * *


    2\. Wake-Up Source (set_wakeup_source)


    What is Wake-Up Source?


    The  set_wakeup_source function defines which external event, such as a pin change
    or timer, can wake up the microcontroller from sleep mode.


    Use Purpose


    ● Wake Up on Specific Events: Configures the microcontroller to resume activity
    when a critical event occurs.


    ● Optimized Power Use: Ensures the microcontroller only wakes up when necessary,
    saving power.


    Syntax


    set_wakeup_source(pin);


    Syntax Explanation


    ● pin: The pin or source that will act as the wake-up trigger for the microcontroller.


    Simple Code Example


    set_wakeup_source(PIN2);


    Code Example Explanation


    ● Configures PIN2 as a wake-up source so the microcontroller will exit sleep mode
    when this pin changes state.


    Notes


    ●      Different wake-up sources may be configured based on the microcontroller’s
    capabilities.


    Warnings


    ● Ensure the selected pin or event is suitable for your application to prevent
    unintended wake-ups.


    * * *


    3\. Disable Peripheral (disable_peripheral)


    What is Disable Peripheral?


    The  disable_peripheral function turns off a specific peripheral (like UART, ADC,
    or PWM) when it’s not needed, conserving power by reducing active components.


    Use Purpose


    ● Reduce Unnecessary Power Usage: Turns off components that are not actively used.


    ●      Optimize Efficiency: Minimizes power consumption by focusing only on active
    peripherals.


    Syntax


    disable_peripheral(name);


