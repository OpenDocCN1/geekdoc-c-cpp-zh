    Relevant Project Section


    Project Name


    Sensor Data Logger with Multiple Data Types


    Project Goal


    Use different data types to record and manage data from a sensor on a RISC-V microcontroller,
    storing data such as sensor ID, reading value, and status.


    RISC-V Development Environment


    The project will use PlatformIO in Visual Studio Code. PlatformIO provides tools
    for building, uploading, and debugging code for RISC-V microcontrollers.


    RISC-V Microcontroller


    This example uses the SiFive HiFive1 Rev B microcontroller, based on the SiFive
    Freedom E310 RISC-V core, ideal for embedded applications.


    Requirement Components


    ●      SiFive HiFive1 Rev B RISC-V Microcontroller


    ● Sensor (e.g., temperature sensor) connected to an analog or digital input pin


    ●      LED for indicating data logging activity


    Component Connection Table


    | Component | RISC-V Pin | Additional Notes |


    | Sensor | Analog Pin | Reads sensor data for logging |


    | LED | GPIO Pin | Indicates activity during data logging |


    Connection Analysis


    The sensor provides data that is logged by the microcontroller. The LED lights
    up to indicate logging is active, while the program stores multiple data types,
    including integer, float, and character.


    Program Software Setup


    1.  Open Visual Studio Code with PlatformIO.


    2.  Create a new PlatformIO project for the SiFive HiFive1 Rev B board.


    3.  Define a structure to represent sensor data and variables for different data
    types.


    Project Code


    #include  <stdint.h>


    #include  "hifive1_gpio.h" // Adjust for your SDK as needed


    struct  SensorData  {


    int id;


    float reading;


    char status;


    };


    const  int SENSOR_PIN =  0;  // Example analog pin for sensor


    const  int LED_PIN =  13; // Example GPIO pin for LED


