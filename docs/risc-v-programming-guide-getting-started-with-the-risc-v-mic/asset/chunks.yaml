    \ once.\n- Mode Selection: Executes different actions based on specific cases.\n\
    - Efficient Alternative to Multiple If-Else: Cleaner and easier to read when handling\
    \ multiple values.\n\n### Analysis\n- Continuous Monitoring: Ideal for polling\
    \ a sensor or waiting for a specific condition.\n- Indefinite Repetition: Loops\
    \ until an external condition changes.\n- Mandatory Single Execution: Runs code\
