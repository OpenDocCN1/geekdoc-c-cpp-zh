    \ Studio` 预配置了 RISC-V GNU 工具链。在 `Window > Preferences > C/C++ > Build > Environment`\
    \ 中验证工具链路径。\n\n***\n\n## 连接与测试 HiFive1 Rev B\n\n### 设置硬件与驱动程序\n\n1. 连接开发板\n  \
    \  - 使用 micro-USB 线将 HiFive1 Rev B 连接到电脑。\n    - 确保开发板已开电（电源 LED 灯应该亮起）。\n2. 安装驱动程序\n\
    \    - 在 Windows 上：如果提示，请安装 `FTDI` 驱动。\n    - 在 Linux/Mac 上：确保用户有权限访问串口（例如 `/dev/ttyUSB0`）。\n\
    \n### 编写并上传你的第一个 \"Hello, World\"\n\n“Hello, World!” 程序演示了配置和运行 RISC-V 应用的基本知识。\n\
    \n编写代码\n```c\n#include <stdio.h>\n\nint main() {\n    printf(\"Hello, World!\\\
    n\");\n    return 0;\n}\n```\n\n1. 编译程序\n    - 在 `src` 文件夹中编写代码。\n2. 上传程序\n  \
    \  - 使用 `PlatformIO` 烧录 HiFive1 Rev B。\n3. 查看输出\n    - 使用串口终端（例如 `minicom`）查看\
    \ \"Hello, World!\"。\n\n"
- fmt: '

    In embedded programming with RISC-V microcontrollers, constants and variables
    are foundational elements for managing data. Constants store unchanging values,
    while variables hold data that can be modified as the program runs. Proper management
    of constants and variables in code helps improve readability, efficiency, and
    stability, which are crucial for the constrained environments of embedded systems.
    This chapter will guide you through the syntax, usage, and best practices for
    constants and variables, and provide a practical project to demonstrate these
    concepts in action.


    ## Chapter Goal


    - Understand the difference between constants and variables and their specific
    roles in RISC-V programming.

    - Learn the syntax for declaring, initializing, and modifying constants and variables.

    - Apply constants and variables in a practical project that demonstrates optimal
    code efficiency and readability.


    ## Rules


    - Use Constants for Fixed Values: Define constant values for parameters that should
    not change, like mathematical constants or hardware configurations.

    - Initialize Variables Properly: Assign initial values to variables when declaring
    them to avoid errors or undefined behaviors.

    - Choose the Appropriate Data Type: Select data types based on the expected range
    of values for efficient memory use.

    - Use Descriptive Names: Naming variables and constants clearly improves code
    readability.


    ## Brief Introduction to Constants and Variables


    In C programming, variables represent storage locations in memory where data can
    be stored, retrieved, and modified. Constants, on the other hand, are fixed values
    that remain unchanged throughout the program. In embedded programming, where memory
    and processing power are limited, using constants and variables effectively can
    help improve program efficiency and prevent errors.


    ## Syntax Table


    | Serial No | Topic | Syntax | Simple Example |

    | :--- | :--- | :--- | :--- |

    | 1 | Variable Declaration | `type variableName;` | `int counter;` |

    | 2 | Variable Initialization | `type variableName = value;` | `float voltage
    = 5.0;` |

    | 3 | Constant Declaration | `const type constName = value;` | `const int MAX
    = 10;` |

    | 4 | Constant with #define | `#define CONST_NAME value` | `#define PI 3.14159`
    |

    | 5 | Modifying Variable Value | `variableName = newValue;` | `counter = 10;`
    |


    ## Detailed Breakdown for Each Command


    ### 1. Variable Declaration


    ### What is Variable Declaration?

    Declaring a variable in C allocates a storage location in memory for it and assigns
    it a specific data type. This enables the program to store and manage data that
    may change during execution.


    ### Use Purpose

    - Store Dynamic Data: Variables store values that can change throughout the program,
    such as counters or sensor readings.

    - Enable Calculations: Variables facilitate dynamic calculations by holding intermediate
    or changing values.


    ### Syntax

    ```

    type variableName;

    ```


    ### Syntax Explanation

    - `type`: Defines the data type, such as `int`, `float`, or `char`, which determines
    the kind of data the variable will store.

    - `variableName`: The name of the variable, following C’s naming conventions (start
    with a letter or underscore and avoid spaces or special characters).


    ### Simple Code Example

    ```c

    int counter;

    ```


    ### Code Example Explanation

    - This line declares an integer variable named `counter` that can store integer
    values and be modified as needed in the program.


    ### Notes

    - Choose descriptive names to clarify each variable’s purpose.

    - Declare variables close to their first use to improve readability.


    ### Warnings

    - Declaring variables without initializing them may result in unpredictable values
    stored in memory.


    ### 2. Variable Initialization


    ### What is Variable Initialization?

    Initializing a variable assigns it a starting value at the time of declaration.
    This ensures the variable has a defined, predictable value from the beginning,
    avoiding undefined states.


    ### Use Purpose

    - Ensure Consistent Initial State: Initialization prepares the variable for immediate
    use with a known value.

    - Avoid Unpredictable Values: Starting with a defined value helps prevent errors
    in calculations or logic.


    ### Syntax

    ```

    type variableName = value;

    ```


    ### Syntax Explanation

    - `type`: Defines the data type of the variable.

    - `variableName`: The name of the variable.

    - `value`: The initial value assigned to the variable, matching the data type.


    ### Simple Code Example

    ```c

    float voltage = 5.0;

    ```


    ### Code Example Explanation

    - This initializes a `float` variable named `voltage` with an initial value of
    `5.0`.


    ### Notes

    - Initialization is particularly helpful for counters or status flags.

    - Initialize variables as close to their first use as possible for better code
    organization.


    ### 3. Constant Declaration


    ### What is Constant Declaration?

    A constant declaration defines a read-only variable, meaning its value cannot
    be modified after it is assigned. Constants are useful for fixed values such as
    configuration settings, mathematical constants, or limits.


    ### Use Purpose

    - Ensure Fixed Values: Constants prevent accidental changes to critical values.

    - Improve Code Clarity: Assigning descriptive names to fixed values makes code
    easier to understand.


    ### Syntax

    ```

    const type constName = value;

    ```


    ### Syntax Explanation

    - `const`: Keyword that makes the variable read-only.

    - `type`: Defines the data type of the constant.

    - `constName`: The name of the constant, often written in uppercase to indicate
    its fixed nature.

    - `value`: The initial and final value of the constant.


    ### Simple Code Example

    ```c

    const int MAX_COUNT = 10;

    ```


    ### Code Example Explanation

    - This defines `MAX_COUNT` as a constant integer with a value of `10`.


    ### Notes

    - Constants are often declared at the beginning for easy access.

    - Using constants avoids “magic numbers” in code, improving maintainability.


    ### 4. Constant with #define


    ### What is Constant with #define?

    Using `#define` creates a symbolic constant that the compiler replaces with the
    specified value. It’s often used for global values that don’t require memory.


    ### Use Purpose

    - Memory Efficient: `#define` constants do not occupy memory.

    - Global Accessibility: Values defined with `#define` are accessible throughout
    the program.


    ### Syntax

    ```

    #define CONST_NAME value

    ```


    ### Syntax Explanation

    - `#define`: Preprocessor directive used to define a constant.

    - `CONST_NAME`: Typically uppercase to indicate it’s a constant.

    - `value`: The assigned value, which replaces every occurrence of `CONST_NAME`.


    ### Simple Code Example

    ```c

    #define PI 3.14159

    ```


    ### Code Example Explanation

    - De-ines `PI` with the value `3.14159`, replacing every instance of `PI` in the
    code during compilation.


    ### Notes

    - `#define` constants do not require memory, making them efficient for repetitive
    values.

    - Use for constants required across multiple files or modules.


    ### 5. Modifying Variable Value


    ### What is Modifying Variable Value?

    Modifying a variable’s value allows updating its content dynamically, which is
    essential for tasks involving counters, flags, or calculations.


    ### Use Purpose

    - Track Changes: Variables can store values that update based on the program’s
    needs.

    - Hold Intermediate Results: Variables can store results temporarily for calculations
    and comparisons.


    ### Syntax

    ```

    variableName = newValue;

    ```


    ### Syntax Explanation

    - `variableName`: The variable to be updated.

    - `newValue`: The new value to assign to the variable, matching the variable’s
    data type.


    ### Simple Code Example

    ```c

    counter = 10;

    ```


    ### Code Example Explanation

    - This assigns a new value of `10` to the variable `counter`, updating its content.


    ### Notes

    - Variables in loops or conditionals often get updated to reflect changing states
    or conditions.


    ### Warnings

    - Ensure the new value is within the variable’s data type range to avoid errors.


    ## Relevant Project Section


    ### Project Name

    LED Blinking with Adjustable Interval


    ### Project Goal

