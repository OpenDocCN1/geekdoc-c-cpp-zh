    Relevant Project Section


    Project Name


    PWM-Based LED Brightness Control


    Project Goal


    Use compound operators on a RISC-V microcontroller to adjust the brightness of
    an LED using PWM, demonstrating compound operators’ ability to update values and
    control hardware components.


    RISC-V Development Environment


    This project will use PlatformIO in Visual Studio Code.


    RISC-V Microcontroller


    We will use the SiFive HiFive1 Rev B microcontroller for this project.


    Requirement Components


    ●      SiFive HiFive1 Rev B Microcontroller


    ●      LED connected to a PWM-capable GPIO pin


    Component Connection Table


    | Component | RISC-V Pin | Additional Notes |


    | LED | PWM Pin | Adjusts brightness via PWM duty cycle |


    Connection Analysis


    The LED’s brightness is controlled by adjusting the PWM duty cycle. The project
    uses compound operators to increase or decrease the duty cycle, allowing dynamic
    brightness control.


    Program Software Setup


    1.  Open Visual Studio Code and create a new PlatformIO project.


    2.  Configure the PWM for LED control.


    3.  Implement code to adjust the PWM duty cycle using compound operators.


    Project Code


    #include  <stdint.h>


    #include  "hifive1_pwm.h" // Include PWM library


    #define LED_PIN 1        // PWM-capable pin for LED


    #define STEP 10          // Increment/Decrement step for duty cycle


    void setupPWM()  {


    TIMER_INIT(1000);               // Initialize timer with 1 ms period


    PWM_SET_DUTY(LED_PIN,  50);      // Start with 50% duty cycle


    }


    int main()  {


    setupPWM();


    int dutyCycle =  50;             // Starting duty cycle


    while  (1)  {


    // Increase brightness


    if  (dutyCycle <=  90)  {


    dutyCycle += STEP;


    }  else  {


    dutyCycle -= STEP;      // Reduce brightness if limit is reached


    }


    PWM_SET_DUTY(LED_PIN, dutyCycle);  // Update PWM duty cycle


    for  (volatile  int i =  0; i <  100000; i++);  // Simple delay


    }


    }


    Save and Run


    1.  Save, compile, and upload the code to the SiFive HiFive1 Rev B board using
    PlatformIO.


    2.  Observe the LED brightness increase and decrease, controlled by the PWM duty
    cycle adjustments.


    Check Output


    ● The LED should gradually brighten and dim, showing compound operator usage to
    adjust the PWM duty cycle effectively.


    ## Math Functions in C for RISC-V Microcontrollers


    Chapter Overview


    Math functions are essential in programming, enabling complex calculations, data
    processing, and manipulation of values. In embedded programming for RISC-V microcontrollers,
    math functions such as absolute value, power, square root, and trigonometric calculations
    enhance the ability to handle sensor data, perform mathematical modeling, and
    control outputs. This chapter will cover key math functions and demonstrate their
    application in an embedded project.


    Chapter Goal


    ● Understand the main math functions (abs,  pow,  sqrt, etc.) and their applications
    in embedded C programming.


    ● Learn to use these functions effectively to handle sensor data and perform calculations.


    ● Implement a project that utilizes math functions to measure and display calculated
    values.


    Rules


    ● Use Math Functions Appropriately: Select functions that match the data type
    and required precision.


    ● Optimize for Performance: Minimize the use of complex functions in time-sensitive
    code.


    ● Be Aware of Floating-Point Usage: Consider floating-point limitations, especially
    on embedded systems without hardware support.'
