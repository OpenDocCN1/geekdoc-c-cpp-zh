    #include <stdio.h>\n#include \"hive1_adc.h\"\n\n#define TEMP_THRESHOLD_HIGH 30\n\
    #define TEMP_THRESHOLD_LOW 20\n#define LED_PIN 13\n\nvoid setup() {\n    GPIO_DIR\
    \ |= (1 << LED_PIN);  // Set LED_PIN as output\n    ADC_INIT(); // Initialize\
