  raw: 'The  free function releases memory that was previously allocated with  malloc,
    making it available for future allocations.


    Use Purpose


    ●      Memory Cleanup: Prevents memory leaks by releasing unused memory.


    ● Efficient Memory Use: Ensures memory is available for other parts of the program.


    Syntax


    free(ptr);


    Syntax Explanation


    ●      ptr: The pointer to the memory that needs to be freed.


    Simple Code Example


    free(data);


    Code Example Explanation


    ● Frees the memory allocated to the  data pointer, making it available for reuse.


    Notes


    ●      Only call  free on memory allocated by  malloc.


    Warnings


    ● Avoid using  free on memory that was not dynamically allocated, as this may
    cause undefined behavior.


    * * *


    3\. EEPROM Write (eeprom_write)


    What is EEPROM Write?


    eeprom_write writes data to a specified EEPROM address, allowing data to be stored
    permanently across power cycles.


    Use Purpose


    ● Store Persistent Data: Saves data that should be retained after a reset or power
    off.


    ●      Configuration Settings: Useful for storing settings like thresholds or
    calibration values.


    Syntax


    eeprom_write(addr, data);


    Syntax Explanation


    ●      addr: The EEPROM address where data will be stored.


    ●      data: The data to be written to the specified address.


    Simple Code Example


    eeprom_write(0x10,  45);


    Code Example Explanation


    ●      Writes the value  45 to EEPROM address  0x10.


    Notes


    ● Writing to EEPROM is slower than regular memory access; use it sparingly.


    Warnings


    ● EEPROM has a limited number of write cycles. Avoid frequent writes to prolong
    memory lifespan.


    * * *


    4\. EEPROM Read (eeprom_read)


    What is EEPROM Read?


    eeprom_read retrieves data from a specified EEPROM address, allowing persistent
    data to be read back into the program.


    Use Purpose


    ●      Retrieve Persistent Data: Reads stored settings or parameters on startup.


    ● Non-volatile Data Access: Provides access to data that remains intact after
    power loss.


    Syntax


    eeprom_read(addr);


    Syntax Explanation


    ●      addr: The EEPROM address from which to read the data.


    Simple Code Example


    c


    Copy code


    int value = eeprom_read(0x10);


    Code Example Explanation


    ● Reads the value stored at EEPROM address  0x10 and stores it in  value.


    Notes


    ● Reading from EEPROM is slower than regular memory; use it only when necessary.


    Warnings


    ● Avoid reading from uninitialized EEPROM addresses, as they may contain unpredictable
    values.


    * * *


    5\. EEPROM Update (eeprom_update)


    What is EEPROM Update?


    eeprom_update checks if the data at the specified address already matches the
    new data before writing. This minimizes unnecessary writes, extending the EEPROM’s
    life.


    Use Purpose


    ● Optimize EEPROM Writes: Reduces wear on EEPROM by only writing data if it has
    changed.


    ●      Efficient Persistent Storage: Maintains data integrity with minimal writes.


    Syntax


    eeprom_update(addr, data);


    Syntax Explanation


    ●      addr: The EEPROM address to be updated.


    ● data: The new data to be written if different from the current value.


    Simple Code Example


    eeprom_update(0x10,  45);


    Code Example Explanation


    ● Updates EEPROM address  0x10 with the value  45 if it differs from the current
    stored value.


    Notes


    ●      eeprom_update is more efficient for high-write applications.


    Warnings


    ●      Use  eeprom_update instead of  eeprom_write when values may frequently
    change.


    * * *


    Relevant Project Section


    Project Name


    Settings Storage with EEPROM for a RISC-V Microcontroller


    Project Goal


    Use EEPROM and memory management functions to store and retrieve user-defined
    settings (e.g., a brightness level) on a RISC-V microcontroller. The settings
    persist even when the microcontroller is powered off, demonstrating effective
    EEPROM use.


    RISC-V Development Environment


    This project will use PlatformIO in Visual Studio Code.


    RISC-V Microcontroller


    We will use the SiFive HiFive1 Rev B microcontroller for this project.


    Requirement Components


    ●      SiFive HiFive1 Rev B Microcontroller


    ●      Push Button to adjust settings


    ●      LED connected to GPIO to display brightness level based on settings


    Component Connection Table


    | Component | RISC-V Pin | Additional Notes |


    | LED | GPIO Pin 2 | Indicates brightness level |


    | Push Button | GPIO Pin 3 | Adjusts brightness level and stores in EEPROM |


    Connection Analysis


    The push button is used to change the brightness level of the LED. The brightness
    level is saved to EEPROM and retrieved after a reset, allowing the system to remember
    the last setting. This project demonstrates how to write, read, and update values
    in EEPROM, along with dynamic memory handling.


    Program Software Setup


    1.  Open Visual Studio Code and create a new PlatformIO project.


    2.  Configure GPIO pins for the LED and button.


    3.  Implement code to store and retrieve brightness level settings using EEPROM.


    Project Code


    #include  <stdint.h>


    #include  <stdio.h>


    #define LED_PIN 2                // GPIO pin for LED


    #define BUTTON_PIN 3             // GPIO pin for button


    #define EEPROM_ADDR 0x10         // EEPROM address for brightness level


    #define MAX_BRIGHTNESS 5


    int brightness;


    void setup()  {


    GPIO_DIR |=  (1  << LED_PIN); // Set LED pin as output


    GPIO_DIR &=  ~(1  << BUTTON_PIN);  // Set button pin as input


    // Read stored brightness from EEPROM


    brightness = eeprom_read(EEPROM_ADDR);


    if  (brightness > MAX_BRIGHTNESS || brightness <  0)  {


    brightness =  0;  // Set default if out of range


    }


    }


    void adjustBrightness()  {


    // Increment brightness level


    brightness =  (brightness +  1)  %  (MAX_BRIGHTNESS +  1);


    // Update EEPROM with new brightness level


    eeprom_update(EEPROM_ADDR, brightness);


    // Display brightness on LED (simple on/off based on brightness level)


    if  (brightness >  0)  {


    GPIO_OUT |=  (1  << LED_PIN);  // Turn LED on


    }  else  {


    GPIO_OUT &=  ~(1  << LED_PIN);  // Turn LED off


    }


    }


    int main()  {


    setup();


    while  (1)  {


    // Check if button is pressed


    if  (GPIO_IN &  (1  << BUTTON_PIN))  {


    adjustBrightness();


    // Simple delay for button debounce


    for  (volatile  int i =  0; i <  100000; i++);


    }


    }


    }


    Save and Run


    1.  Save, compile, and upload the code to the SiFive HiFive1 Rev B board using
    PlatformIO.


    2.  Press the button to change the brightness level, and observe that the level
    persists after a reset.


    Check Output


    ● The LED should turn on at different brightness levels each time the button is
    pressed, storing the setting in EEPROM. After a reset, the LED should return to
    the last brightness level.


    ## Communication in RISC-V Microcontrollers


    Chapter Overview


    Communication in embedded systems allows microcontrollers to exchange data with
    other devices, sensors, or user interfaces. Common communication protocols include
    UART, SPI, and I2C, each serving specific types of applications with varying requirements
    for speed, data format, and connection topology. In this chapter, we’ll explore
    the basics of these protocols and demonstrate communication with an external device
    using UART on a RISC-V microcontroller.


    Chapter Goal


    ● Understand basic communication protocols for embedded systems, including UART,
    SPI, and I2C.


    ● Learn to set up and use UART communication on a RISC-V microcontroller.


    ● Implement a project that sends and receives data over UART to demonstrate communication
    functionality.


    Rules


    ● Choose the Right Protocol: Use UART for simple serial communication, SPI for
    high-speed data transfer, and I2C for communication with multiple devices.


    ● Configure Baud Rate Correctly: Ensure both sender and receiver share the same
    baud rate for UART communication.


    ● Use Proper Error Handling: Implement checks for data integrity, such as parity
    bits or acknowledgments.


    ● Monitor Communication Lines: Ensure communication lines are free from interference,
    especially in noisy environments.


    Brief Introduction to Communication Protocols'
