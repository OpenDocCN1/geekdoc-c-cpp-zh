    # RISC-V 编程指南


    RISC-V 微控制器与 C/C++ 入门


    第一版


    Sarful Hassan


    ## 序言


    《RISC-V 编程指南：RISC-V 微控制器与 C/C++ 入门》旨在向读者介绍 RISC-V 微控制器编程的世界，特别是使用 `SiFive HiFive1
    Rev B` 开发板。无论您是爱好者、学生还是专业开发人员，本书都为您提供了在 RISC-V 生态系统中开始开发应用程序所需的的基础知识和实践技能。


    ## 本书适合谁读


    本书主要针对以下读者：


    *   对 RISC-V 编程感兴趣的工程师和开发者。

    *   正在学习微控制器编程和嵌入式系统的学生。

    *   想要探索 `SiFive HiFive1 Rev B` 功能的创作者和爱好者。

    *   从传统微控制器（如 `ARM` 或 `AVR`）转向 `RISC-V` 的专业人士。


    假设读者已具备熟悉 `C` 或 `C++` 编程的基础知识。无需具备 `RISC-V` 微控制器的先经验。


    ## 本书的结构


    *   第 1 章：提供 `RISC-V` 微控制器、其架构及其生态系统的高层次介绍。

    *   第 2–4 章：重点介绍搭建开发环境以及基础编程概念，如常量、变量和数据类型。

    *   第 5–10 章：涵盖输入/输出编程，包括数字、模拟和高级 I/O 技术。

    *   第 11–16 章：深入探讨针对微控制器定制的 `C` 编程结构、运算符和函数。

    *   第 17–21 章：探索高级主题，如电源管理、内存使用、通信协议以及带有 `Wi-Fi` 的物联网 应用。


    ## 本书未涵盖的内容


    考虑到 `RISC-V` 和微控制器编程的广泛范围，本书特别关注：


    *   `SiFive HiFive1 Rev B` 开发板。

    *   使用 `C` 和 `C++` 进行编程。


    实时操作系统 (`RTOS`)、硬件调试或广泛的第三方库等高级主题未在书中详细介绍。这些内容计划在未来的版本或配套书中讨论。


    ## 代码风格（关于代码）


    所有代码示例均使用标准 `C` 编写，强调清晰和简单。


    *   代码片段经过格式处理以提高读性，并在 `HiFive1 Rev B` 板上通过了测试。

    *   包含了注释和文档以帮助解释功能。


    在必要时，代码遵循现代嵌入式编程实践，确保了兼容性和易用性。


    ## 更新说明


    *   第一版重点关注 `HiFive1 Rev B`。随着 `RISC-V` 生态系统的演进，未来的更新可能会包含更多开发板和增强功能。

    *   错误说明和更新将在发布后发布在 `mechatronicslab.net`。


    ## 第一版说明


    本版是致力于 `RISC-V` 编程系列书籍的第一部。读者的反馈对于提高未来版本的质量和范围至关重要。


