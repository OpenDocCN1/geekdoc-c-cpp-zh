  trans: "\n\n# 5. 空函数 (Void Function)\n\n## 什么是空函数？\n空函数执行任务但不返回任何值。它适用于不需要反馈的操作，例如\
    \ LED 控制或打印消息。\n\n## 使用目的\n- **执行操作**：执行代码而不返回结果。\n- **硬件控制**：非常适合诸如 LED 闪烁或启动电机等任务。\n\
    \n## 语法\n```c\nvoid functionName() {\n  // 要执行的代码\n}\n```\n\n## 语法解释\n- `void`:\
    \ 指定该函数不返回任何值。\n\n## 简单代码示例\n```c\nvoid blinkLED() {\n  // 切换 LED 状态\n}\n```\n\
    \n## 代码示例解释\n- 定义了一个函数 `blinkLED`，它用于控制 LED 而不返回值。\n\n## 注意事项\n- 空函数常用于嵌入式系统中的\
    \ I/O 操作。\n\n## 警告\n- 空函数不能返回值。\n\n***\n\n# 相关项目章节\n\n## 项目名称\n基于函数的传感器的 LED 控制\n\
    \n## 项目目标\n在 RISC-V 微控制器上使用函数读取传感器值并根据阈值控制 LED。该项目演示了函数如何组织代码，使其具有模块化和可用性。\n\n\
    ## RISC-V 开发环境\n此项目将在 Visual Studio Code 中使用 `PlatformIO`。\n\n## RISC-V 微控制器\n\
    我们将使用 `SiFive HiFive1 Rev B` 微控制器进行本项目。\n\n## 所需组件\n- `SiFive HiFive1 Rev B` 微控制器\n\
    - 连接到 `ADC` 引脚的 `模拟温度传感器`\n- 连接到 `GPIO` 引脚以指示温度范围的 `LED`\n\n## 组件连接表\n| 组件 | RISC-V\
    \ 引脚 | 额外备注 |\n| :--- | :--- | :--- |\n| 温度传感器 | `ADC Pin` | 提供模拟温度数据 |\n| LED\
    \ | `GPIO Pin` | 如果温度超过阈值则开启 |\n\n## 连接分析\n温度传感器提供一个代表温度的模拟值。一个函数读取此值并进行转换，另一个函数则根据温度阈值控制\
    \ LED。\n\n## 程序软件设置\n1. 打开 Visual Studio Code 并创建一个新的 `PlatformIO` 项目。\n2. 设置用于读取传感器的\
    \ `ADC` 和用于 LED 的 `GPIO` 引脚。\n3. 实现读取传感器数据、转换值以及控制 LED 的函数。\n\n## 项目代码\n```c\n\
    #include <stdint.h>\n#include <stdio.h>\n\n#define LED_PIN 2               //\
    \ LED 的 GPIO 引脚\n#define TEMP_THRESHOLD 30      // 摄氏度阈值\n\nvoid setup() {\n \
    \ GPIO_DIR |= (1 << LED_PIN);  // 将 LED 引脚设为输出\n  ADC_INIT();                \
    \  // 初始化 ADC 以读取传感器\n}\n\n// 读取传感器并转换为摄氏度的函数\nfloat readTemperature() {\n  int\
    \ adcValue = ADC_READ();\n  float voltage = (adcValue / 1023.0) * 3.3;\n  return\
    \ voltage * 100; // 将电压转换为温度（示例）\n}\n\n// 根据温度控制 LED 的函数\nvoid controlLED(float\
    \ temperature) {\n  if (temperature >= TEMP_THRESHOLD) {\n    GPIO_OUT |= (1 <<\
    \ LED_PIN);  // 开启 LED\n  } else {\n    GPIO_OUT &= ~(1 << LED_PIN);  // 关闭 LED\n\
    \  }\n}\n\nint main() {\n  setup();\n  while (1) {\n    float temperature = readTemperature();\
    \  // 读取温度\n    controlLED(temperature);               // 根据温度控制 LED\n    for\
    \ (volatile int i = 0; i < 1000000; i++);  // 简单延迟\n  }\n}\n```\n\n## 保存并运行\n\
    1. 使用 `PlatformIO` 保存、编译并将代码上传到 `SiFive HiFive1 Rev B` 开发板。\n2. 观察 `LED`，当温度超过阈值时它会开启。\n\
    \n## 输出\n- 当温度高于阈值时，LED 应开启；低于阈值时关闭。\n\n# RISC-V 微控制器中的电源管理\n\n## 章节概述\n电源管理在嵌入系统中至关重要，特别是对于电池运行或具有严格能量限制的应用。通过降低功耗，微控制器可以延长电池寿命、减少热产生并提高效率。RISC-V\
    \ 微控制器提供了多种电源管理功能，如睡眠模式、低功耗模式和外设控制。本章将涵盖常见的电源管理技术、其语法以及在嵌入式项目中的实际应用。\n\n## 章节目标\n\
    - 理解 RISC-V 微控制器中的电源管理模式和功能。\n- 学习如何实现低功耗技术以优化功耗。\n- 实现一个项目，使用睡眠模式并在外部事件上唤醒微控制器。\n\
    \n## 规则\n- **空闲时使用低功耗模式**：当微控制器未执行关键任务时，进入睡眠模式。\n- **禁用未使用的外设**：关闭不需要的外设。\n- **优化电源**：确保微控制器仅在需要时唤醒。\n\
    \n## 电源管理简介介绍\n电源管理包含各种睡眠模式，在这些模式下，其功耗最低。\n\n## 语法表\n| 序号 | 主题 | 语法 |\n| :---\
    \ | :--- | :--- |\n| 1 | 进入睡眠模式 | `sleep_mode()` |\n| 2 | 唤醒源 | `set_wakeup_source(pin)`\
    \ |\n| 3 | 禁用外设 | `disable_peripheral(name)` |\n| 4 | 启用外设 | `enable_peripheral(name)`\
    \ |\n| 5 | 睡眠时长 | `sleep(duration)` |\n\n***\n\n## 各命令详细拆解\n\n### 1. 进入睡眠模式 (`sleep_mode()`)\n\
    **什么是进入睡眠模式？**\n`sleep_mode` 功能使微控制器进入睡眠模式，此时功耗最小。\n\n**使用目的**\n- 降低功耗：当微控制器未执行关键任务时使用。\n\
    - 延长电池寿命：对于电池供电的应用。\n\n**语法**\n```c\nsleep_mode()\n```\n**语法解释**\n- `sleep_mode`:\
    \ 使微控制器进入指定睡眠模式的调用。\n\n**简单代码示例**\n```c\nsleep_mode()\n```\n**代码示例解释**\n- 在唤醒事件发生前让微控制器进入睡眠模式。\n\
    \n**注意事项**\n- 行为取决于配置的睡眠模式。\n\n**警告**\n- 必须配置唤醒源。\n\n***\n\n### 2. 唤醒源 (`set_wakeup_source(pin)`)\n\
    **什么是唤醒源？**\n`set_wakeup_source` 函数定义了哪些外部事件（如引脚变化）可以从睡眠模式唤醒微控制器。\n\n**使用目的**\n\
    - 特定事件唤醒：使微控制器在关键事件发生时恢复活动。\n- 优化电源使用：确保微控制器仅在需要时唤醒。\n\n**语法**\n```c\nset_wakeup_source(pin)\n\
    ```\n**语法解释**\n- `pin`: 作为微控制器唤醒触发器的引脚或源。\n\n**简单代码示例**\n```c\nset_wakeup_source(PIN2)\n\
    ```\n**代码示例解释**\n- 将 `PIN2` 配置为唤醒源，当该引脚变化时微控制器退出睡眠模式。\n\n**注意事项**\n- 根据微控制器的功能配置不同的唤醒源。\n\
    \n**警告**\n- 确保所选引脚或事件适用于应用程序，以防止意外唤醒。\n\n***\n\n### 3. 禁用外设 (`disable_peripheral(name)`)\n\
    **什么是禁用外设？**\n`disable_peripheral` 函数在不需要时关闭特定的外设（如 `UART`、`ADC` 或 `PWM`），通过减少活动组件来节省能量。\n\
    \n**使用目的**\n- 减少不必要的功耗：关闭未使用的组件。\n- 优化效率：通过仅关注活跃外设来最小化功耗。\n\n**语法**\n```c\ndisable_peripheral(name)\n\
    ```\n**语法解释**\n- `name`: 要禁用的外设名称。\n\n"
- fmt: "\n● `name`: The name of the peripheral to disable, such as `UART`, `ADC`,\
    \ or `PWM`.\n\n### Simple Code Example\n```\ndisable_peripheral(UART);\n```\n\n\
    ### Code Example Explanation\n● Disables the `UART` peripheral, saving power by\
    \ turning off its circuitry.\n\n### Notes\n● Re-enable peripherals before use.\n\
    \n### Warnings\n● Ensure the peripheral is not in use before disabling it, as\
    \ this may cause operational issues.\n\n***\n\n***\n\n# 4. Enable Peripheral (enable_peripheral)\n\
    \n### What is Enable Peripheral?\nThe `enable_peripheral` function reactivates\
    \ a specific peripheral that was previously turned off, allowing it to function\
    \ again.\n\n### Use Purpose\n● **Reactivate Peripherals as Needed**: Controls\
    \ peripheral activation to manage power dynamically.\n● **Selective Power Use**:\
    \ Re-enables components based on application needs.\n\n### Syntax\n```\nenable_peripheral(name);\n\
    ```\n\n### Syntax Explanation\n● `name`: The peripheral to enable, such as `UART`,\
    \ `ADC`, or `PWM`.\n\n### Simple Code Example\n```\nenable_peripheral(UART);\n\
    ```\n\n### Code Example Explanation\n● Enables the `UART` peripheral, allowing\
    \ it to function after being disabled.\n\n### Notes\n● Use `enable/disable` commands\
    \ strategically to control power.\n\n### Warnings\n● Enable peripherals only when\
    \ necessary to avoid excessive power use.\n\n***\n\n***\n\n# 5. Sleep for Duration\
    \ (sleep)\n\n### What is Sleep for Duration?\nThe `sleep` function pauses the\
    \ microcontroller for a specified time in milliseconds, saving power during inactive\
    \ periods.\n\n### Use Purpose\n● **Timed Power Reduction**: Temporarily reduces\
    \ power usage for a fixed duration.\n● **Simple Delay with Power Saving**: Ideal\
    \ for non-critical delays in low-power applications.\n\n### Syntax\n```\nsleep(duration);\n\
    ```\n\n### Syntax Explanation\n● `duration`: The time, in milliseconds, for which\
    \ the microcontroller should remain in low-power sleep mode.\n\n### Simple Code\
    \ Example\n```\nsleep(500); // Sleep for 500 ms\n```\n\n### Code Example Explanation\n\
    ● Puts the microcontroller in sleep mode for 500 milliseconds before resuming\
    \ operations.\n\n### Notes\n● Suitable for fixed delays where minimal power is\
    \ used during waiting periods.\n\n### Warnings\n● Ensure critical tasks are not\
    \ delayed unintentionally by the `sleep` command.\n\n***\n\n***\n\n## Relevant\
    \ Project Section\n\n### Project Name\nLow-Power LED Control with Wake-Up on Button\
    \ Press\n\n### Project Goal\nUse power management functions on a RISC-V microcontroller\
    \ to enter sleep mode and wake up on a button press. This project demonstrates\
    \ the use of sleep modes and wake-up sources to control power usage effectively.\n\
    \n### RISC-V Development Environment\nThis project will use PlatformIO in Visual\
    \ Studio Code.\n\n### RISC-V Microcontroller\nWe will use the SiFive HiFive1 Rev\
    \ B microcontroller for this project.\n\n### Requirement Components\n● SiFive\
    \ HiFive1 Rev B Microcontroller\n● LED connected to a GPIO pin to indicate active\
    \ state\n● Push Button connected to a GPIO pin for wake-up\n\n### Component Connection\
    \ Table\n| Component | RISC-V Pin | Additional Notes |\n| :--- | :--- | :--- |\n\
    | LED | GPIO Pin 2 | Indicates microcontroller activity |\n| Button | GPIO Pin\
    \ 3 | Acts as a wake-up source from sleep mode |\n\n### Connection Analysis\n\
    The LED is used to show the active state of the microcontroller, and the button\
    \ serves as an external wake-up source. When the button is pressed, it wakes the\
    \ microcontroller from sleep mode, and the LED turns on briefly to indicate activity.\n\
    \n### Program Software Setup\n1. Open Visual Studio Code and create a new PlatformIO\
    \ project.\n2. Set up the GPIO pins for the LED and the button.\n3. Implement\
    \ code to enter sleep mode, configure the button as a wake-up source, and control\
    \ the LED.\n\n### Project Code\n```c\n#include <stdint.h>\n#include <stdio.h>\n\
    \n#define LED_PIN 2               // GPIO pin for LED\n#define BUTTON_PIN 3  \
    \           // GPIO pin for Button\n\nvoid setup() {\n  GPIO_DIR |= (1 << LED_PIN);\
    \      // Set LED pin as output\n  GPIO_DIR &= ~(1 << BUTTON_PIN);  // Set button\
    \ pin as input\n  set_wakeup_source(BUTTON_PIN);   // Configure button as wake-up\
    \ source\n}\n\nvoid blinkLED() {\n  GPIO_OUT |= (1 << LED_PIN);      // Turn LED\
    \ on\n  sleep(200);                      // Keep LED on for 200 ms\n  GPIO_OUT\
    \ &= ~(1 << LED_PIN);     // Turn LED off\n}\n\nint main() {\n  setup();\n  while\
    \ (1) {\n    enter_sleep_mode();\n  }\n}\n```\n\n*** \n\n## Memory Management\
    \ and EEPROM Usage\n\n### Chapter Overview\nMemory in embedded systems is often\
    \ limited, so efficient allocation and usage are crucial. EEPROM (Electrically\
    \ Erasable Programmable Memory) provides non-volatile storage, allowing data to\
    \ persist.\n\n### Chapter Goal\n● Understand memory management and EEPROM.\n●\
    \ Learn to read and write EEPROM.\n\n### Rules\n● Use Memory Efficiently: Minimize\
    \ dynamic allocations.\n● Store Persistent Data: Use EEPROM across power cycles.\n\
    ● Clear Unused Memory: Release dynamic memory after use.\n\n### Brief Introduction\n\
    Dynamic memory (`malloc`, `free`) allows flexible memory use, but improper use\
    \ can lead to fragmentation. \n\n### Syntax Table\n| Serial No | Topic | Syntax\
    \ | Simple Example |\n| :--- | :--- | :--- | :--- |\n| 1 | Dynamic Allocation\
    \ | `malloc(size);` | `int *ptr = malloc(10);` |\n| 2 | Free Memory | `free(ptr);`\
    \ | `free(ptr);` |\n| 3 | EEPROM Write | `eeprom_write(addr, data);` | `eeprom_write(0x10,\
    \ 45);` |\n| 4 | EEPROM Read | `eeprom_read(addr);` | `int data = eeprom_read(0x10);`\
    \ |\n| 5 | EEPROM Update | `eeprom_update(addr, data);` | `eeprom_update(0x10,\
    \ 45);` |\n\n***\n\n## Detailed Breakdown for Each Command\n\n### 1. Dynamic Allocation\
    \ (malloc)\n\n### What is Dynamic Allocation?\n`malloc` is used to allocate memory\
    \ at runtime, which is essential in applications where the required memory size\
    \ changes during execution. It returns a pointer to the beginning of the allocated\
    \ memory.\n\n### Use Purpose\n● **Flexible Memory Use**: Allows memory to be allocated\
    \ as needed.\n● **Data Buffers**: Useful for creating temporary buffers or data\
    \ storage areas.\n\n### Syntax\n```\nmalloc(size);\n```\n\n### Syntax Explanation\n\
    ● `size`: The amount of memory (in bytes) to allocate.\n\n### Simple Code Example\n\
    ```c\nint *data = (int *)malloc(10 * sizeof(int));\n```\n\n### Code Example Explanation\n\
    ● Allocates memory for an array of 10 integers and assigns it to the pointer `data`.\n\
    \n### Notes\n● Always check if `malloc` returns `NULL`, which indicates allocation\
    \ failure.\n\n### Warnings\n● Forgetting to free allocated memory can lead to\
    \ memory leaks, especially in large or complex programs.\n\n***\n\n### 2. Free\
    \ Memory (free)\n\n### What is Free Memory?\n"
  raw: '● name: The name of the peripheral to disable, such as  UART,  ADC, or  PWM.


    Simple Code Example


    disable_peripheral(UART);


    Code Example Explanation


    ●      Disables the UART peripheral, saving power by turning off its circuitry.


    Notes


    ●      Re-enable peripherals before use.


    Warnings


    ● Ensure the peripheral is not in use before disabling it, as this may cause operational
    issues.


    * * *


    4\. Enable Peripheral (enable_peripheral)


    What is Enable Peripheral?


    The  enable_peripheral function reactivates a specific peripheral that was previously
    turned off, allowing it to function again.


    Use Purpose


    ●      Reactivate Peripherals as Needed: Controls peripheral activation to manage
    power dynamically.


    ●      Selective Power Use: Re-enables components based on application needs.


    Syntax


    enable_peripheral(name);


    Syntax Explanation


    ●      name: The peripheral to enable, such as  UART,  ADC, or  PWM.


    Simple Code Example


    enable_peripheral(UART);


    Code Example Explanation


    ●      Enables the UART peripheral, allowing it to function after being disabled.


    Notes


    ●      Use enable/disable commands strategically to control power.


    Warnings


    ●      Enable peripherals only when necessary to avoid excessive power use.


    * * *


    5\. Sleep for Duration (sleep)


    What is Sleep for Duration?


    The  sleep function pauses the microcontroller for a specified time in milliseconds,
    saving power during inactive periods.


    Use Purpose


    ●      Timed Power Reduction: Temporarily reduces power usage for a fixed duration.


    ● Simple Delay with Power Saving: Ideal for non-critical delays in low-power applications.


    Syntax


    sleep(duration);


    Syntax Explanation


    ● duration: The time, in milliseconds, for which the microcontroller should remain
    in low-power sleep mode.


    Simple Code Example


    sleep(500); // Sleep for 500 ms


    Code Example Explanation


    ● Puts the microcontroller in sleep mode for 500 milliseconds before resuming
    operations.


    Notes


    ● Suitable for fixed delays where minimal power is used during waiting periods.


    Warnings


    ●      Ensure critical tasks are not delayed unintentionally by the sleep command.


    * * *


    Relevant Project Section


    Project Name


    Low-Power LED Control with Wake-Up on Button Press


    Project Goal


    Use power management functions on a RISC-V microcontroller to enter sleep mode
    and wake up on a button press. This project demonstrates the use of sleep modes
    and wake-up sources to control power usage effectively.


    RISC-V Development Environment


    This project will use PlatformIO in Visual Studio Code.


    RISC-V Microcontroller


    We will use the SiFive HiFive1 Rev B microcontroller for this project.


    Requirement Components


    ●      SiFive HiFive1 Rev B Microcontroller


    ●      LED connected to a GPIO pin to indicate active state


    ●      Push Button connected to a GPIO pin for wake-up


    Component Connection Table


    | Component | RISC-V Pin | Additional Notes |


    | LED | GPIO Pin 2 | Indicates microcontroller activity |


    | Button | GPIO Pin 3 | Acts as a wake-up source from sleep mode |


    Connection Analysis


    The LED is used to show the active state of the microcontroller, and the button
    serves as an external wake-up source. When the button is pressed, it wakes the
    microcontroller from sleep mode, and the LED turns on briefly to indicate activity.


    Program Software Setup


    1.  Open Visual Studio Code and create a new PlatformIO project.


    2.  Set up the GPIO pins for the LED and the button.


    3.  Implement code to enter sleep mode, configure the button as a wake-up source,
    and control the LED.


    Project Code


    #include  <stdint.h>


    #include  <stdio.h>


    #define LED_PIN 2               // GPIO pin for LED


    #define BUTTON_PIN 3            // GPIO pin for Button


    void setup()  {


    GPIO_DIR |=  (1  << LED_PIN);  // Set LED pin as output


    GPIO_DIR &=  ~(1  << BUTTON_PIN);  // Set button pin as input


    set_wakeup_source(BUTTON_PIN);   // Configure button as wake-up source


    }


    void blinkLED()  {


    GPIO_OUT |=  (1  << LED_PIN);      // Turn LED on


    sleep(200);                      // Keep LED on for 200 ms


    GPIO_OUT &=  ~(1  << LED_PIN);     // Turn LED off


    }


    int main()  {


    setup();


    while  (1)  {


    enter_sleep_mode();  // Enter low-power mode


    blinkLED();          // Wake up and blink LED when button is pressed


    }


    }


    Save and Run


    1.  Save, compile, and upload the code to the SiFive HiFive1 Rev B board using
    PlatformIO.


    2.  Observe the LED turning on briefly each time the button is pressed to wake
    the microcontroller.


    Check Output


    ● The LED should blink on for 200 ms each time the button is pressed, indicating
    the microcontroller woke from sleep.


    ## Memory Management and EEPROM Usage in RISC-V Microcontrollers


    Chapter Overview


    Memory management in embedded systems involves allocating, storing, and accessing
    data efficiently to optimize performance and minimize memory usage. EEPROM (Electrically
    Erasable Programmable Read-Only Memory) is a type of non-volatile memory that
    allows microcontrollers to retain data even when powered off, making it ideal
    for storing configurations, calibration data, and persistent settings. This chapter
    covers essential memory management techniques, EEPROM usage, and a practical example
    on data storage and retrieval in RISC-V microcontrollers.


    Chapter Goal


    ● Understand memory management concepts and how to use dynamic memory in embedded
    C programming.


    ● Learn to read and write data to EEPROM for persistent storage in embedded applications.


    ● Implement a project that saves settings to EEPROM and retrieves them after a
    reset.


    Rules


    ● Use Memory Efficiently: Limit memory usage by minimizing dynamic allocations
    and using static memory wherever possible.


    ● Store Persistent Data in EEPROM: Use EEPROM for settings that need to persist
    across power cycles.


    ● Limit EEPROM Writes: EEPROM has a finite write cycle limit, so avoid frequent
    writes to prolong memory life.


    ● Clear Unused Memory: Release dynamically allocated memory after use to prevent
    memory leaks in applications with complex data handling.


    Brief Introduction to Memory Management and EEPROM


    Memory in embedded systems is often limited, so efficient memory allocation and
    usage are crucial. While dynamic memory allocation (malloc,  free) allows flexible
    memory use, excessive or improper use can lead to fragmentation. EEPROM provides
    non-volatile storage, allowing data to be retained when the microcontroller is
    powered off, making it valuable for storing configuration parameters and calibration
    data that must persist.


    Syntax Table


    | Serial No | Topic | Syntax | Simple Example |


    | 1 | Dynamic Allocation | malloc(size); | int *ptr = malloc(10); |


    | 2 | Free Memory | free(ptr); | free(ptr); |


    | 3 | EEPROM Write | eeprom_write(addr, data); | eeprom_write(0x10, 45); |


    | 4 | EEPROM Read | eeprom_read(addr); | int data = eeprom_read(0x10); |


    | 5 | EEPROM Update | eeprom_update(addr, data); | eeprom_update(0x10, 45); |


    * * *


    Detailed Breakdown for Each Command


    1\. Dynamic Allocation (malloc)


    What is Dynamic Allocation?


    malloc is used to allocate memory at runtime, which is essential in applications
    where the required memory size changes during execution. It returns a pointer
    to the beginning of the allocated memory.


    Use Purpose


    ●      Flexible Memory Use: Allows memory to be allocated as needed.


    ●      Data Buffers: Useful for creating temporary buffers or data storage areas.


    Syntax


    malloc(size);


    Syntax Explanation


    ●      size: The amount of memory (in bytes) to allocate.


    Simple Code Example


    int  *data =  (int  *)malloc(10  *  sizeof(int));


    Code Example Explanation


    ● Allocates memory for an array of 10 integers and assigns it to the pointer  data.


    Notes


    ●      Always check if  malloc returns  NULL, which indicates allocation failure.


    Warnings


    ● Forgetting to free allocated memory can lead to memory leaks, especially in
    large or complex programs.


    * * *


    2\. Free Memory (free)


    What is Free Memory?'
