    \n`PlatformIO` 是 Visual Studio Code 的一个强大扩展，简化了 RISC-V 开发。\n\n1. 安装 Visual Studio\
    \ Code\n    - 下载并安装 [VS Code](https://code.visualstudio.com/)。\n2. 添加 PlatformIO\
