    5\. Extern Keyword


    What is Extern Keyword?


    The  extern keyword allows a variable to be used across multiple files. It declares
    a variable without defining it, assuming its definition exists elsewhere in the
    code.


    Use Purpose


    ● Share Global Variables Across Files: Useful for large programs where variables
    need to be accessible across different modules.


    ●      Modularize Code: Allows breaking code into multiple files without redefining
