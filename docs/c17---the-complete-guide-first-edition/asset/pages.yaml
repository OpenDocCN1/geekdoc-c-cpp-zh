  md: '# Accessing the Value


    To access the contained value you have cast it to its type with a std::any_cast<>.
    To cast the std::any have several options:


    +   - std::any_cast<std::string>(a) // yield copy of the value


    +   - std::any_cast<const std::string&>(a); // read by reference


    Here, if the cast fails, a std::bad_any_cast exception is thrown. The type fits
    if the passed type with top-level references has the same ID. You can pass an
    address to get the nullptr if the cast fails, because the current type doesn''t
    fit:


    +   - std::any_cast<std::string&>(&a) // access via pointer


    +   - std::any_cast<const std::string&>(&a); // access via pointer


    Note that here casting to a reference results in a run-time error. std::any_cast<const
    std::string&>(&a); // RUN-TIME ERROR


    # Move Semantics


    std::any also supports move semantics. However, note that move semantics is only
    supported for type that has copy semantics. Thus, move-only types are not supported
    as contained value types. The best way to deal with move semantics is not be obvious.
    So, here is how you should do:


    ```

    std::string s("hello, world!");

    std::any a;

    a = std::move(s);

    s = std::move(std::any_cast<std::string&>(a)); // move assign string in a to s

    ```


    As usual for move-objects the contained value is unspecified after the last call.
    Thus, you can use a string as long as you don''t make any assumption about what
    the contained string value has. The output of the move operation will probably
    be the empty string, not "NIL".


    ```

    std::cout << (a.has_value() ? std::any_cast<std::string>(a) : std::string("NIL"));

    ```'
