    \ Searching Predicates\n\nWhen searching, you can use predicates, which might\
    \ be necessary for two reasons:\n\n+   1. You want to define your way to compare\
    \ elements.\n2. You want to provide a hash function, which is necessary for the\
    \ Boyer-Moore-(Horspool) searchers. You have to provide the predicates as additional\
    \ arguments to the constructor of the searchers. For example, here we search for\
    \ a substring case bmic(substr.begin(), substr.end()).\n\n```\nstd::boyer_more_searcher\
    \ bmic(substr.begin(), substr.end(),\n    [](char c) {\n        return std::hash<char>{}(std::toupper(c));\n\
    },\n    [](char c1, char c2) {\n        return std::toupper(c1)==std::toupper(c2);\n\
    \    }\n);\n```\n\nauto begend = bmic(sub.begin(), sub.end());\nDon't forget to\
    \ call toupper() before you hash the value, otherwise you violate the requirement\
    \ that the hash value must be the same for all values, where operator== yields\
    \ true.\nAnd, if we have a class Customer defined as follows:\n\n```\nclass Customer\
    \ {\npublic:\n    Customer() = default;\n    std::string getID() const {\n   \
    \     return id;\n    }\n    friend bool operator===(const Customer& c1, const\
    \ Customer& c2) {\n        return c1.id == c2.id;\n    }\n};\n```\n\nwe can search\
    \ for a subsequence of customers in a vector of customers as follows:\n\n```\n\
    std::vector<Customer> customers;\n...\nstd::vector<Customer> sub{...};\n```"
