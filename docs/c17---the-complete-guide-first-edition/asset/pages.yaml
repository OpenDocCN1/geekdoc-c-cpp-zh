    \ if we skip the else part the return type might be int or void\n\n```\nauto foo()\
    \ {\n    // return type might be int or void\n    if constexpr(sizeof(int) > 4)\
    \ {\n        return 42;\n    }\n}\n```\n\nNote that this code never compiles the\
    \ run-time if it is used here, because then both return statements are taken into\
    \ account so that the deduction of the return type is ambiguous.\n\n# else Matters\
    \ Even if then Returns\n\nFor run-time statements there is a pattern that does\
