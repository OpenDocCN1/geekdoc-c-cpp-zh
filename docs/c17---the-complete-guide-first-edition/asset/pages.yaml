    \    // list of all file paths found in file tree:\n    std::vector<std::filesystem::path>\
    \ paths;\n    try {\n        std::filesystem::recursive_directory_iterator iter(root),\
    \ endpos();\n        std::copy(std::begin(iter), endpos(), std::back_inserter(paths));\n\
    \    }} catch (const std::exception& e) {\n        std::cerr << \"EXCEPTION: \"\
    \ << e.what() << std::endl;\n        return EXIT_FAILURE;\n    }\n    // accumulate\
    \ size of all regular files:\n    auto sz = std::reduce(std::execution::par, //\
