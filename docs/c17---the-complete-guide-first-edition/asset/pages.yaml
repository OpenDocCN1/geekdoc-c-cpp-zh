    We accumulate two small floating-point sequences in different order. sum1 is the
    sum accumulating from left to right, sum2 is the accumulating from right to left
    (using reverse iterators). As a result the values look the same but aren''t:


    +   sum1: 0.40001

    sum1: 0.40001

    equal: false

    sum1: 0.400010000000003221

    sum1: 0.400009999999997669


    When passing the values to d2str2d(), you can see that the values are stored as
    different character sequences with the necessary granularity:


    +   in: 0.4000100000000003221

    str: 0.400010000000000003

    out: 0.4000100000000003221


    +   in: 0.4000099999999999769

    str: 0.40001

    out: 0.4000099999999999769


    Again note that the granularity (and therefore the necessary size of the character
    sequence) depends on the platform. The round-trip support should work for all
    floating-point numbers including NAN and INFINITY. For example, passing INFINITY
    to d2str2d() would have the following effect:


    ```

    value1: inf

    str: inf

    value2: inf

    ```


    However, note that the assertion in d2str2d() will fail for NAN because it never
    compares to anything, including itself.


    # 29.2 Afternotes


    Low-Level Conversions between character sequences and numeric values were first
    proposed by Jens Maurer at https://vg21.link/p0067r0. The finally accepted wording
