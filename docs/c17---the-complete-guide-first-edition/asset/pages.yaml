    # 19.4.3 String View Support by Other Types


    In principle, each place where a string can be passed also passing a string view
    could make sense, except when the receiver need value to be null terminated (e.g.,
    passing the value to a C function for strings) so far.


    However, so we''ve only added support for the most important parts:


    +   Strings can use or be combined with string views wherever useful. You can
    create a string from it (the constructor is explicit), assign, append, insert,
    replace, compare, or find a substring by passing a string view also.


    There is also in implicit conversion from a string to a string view.


    > ³ In principle, we could standardize an operation to concatenate string views
    yielding a new string, but so far this is not provided.'
