    # 1.2.2 Raw Arrays


    The following code initializes x and y the two elements of the raw C-style array:


    ```

    int arr[] = { 47, 11 };

    auto [x, y] = arr; // x and y are initialized by elems of arr

    auto [z] = arr; // ERROR: number of elements doesn''t fit

    ```


    This course is only possible as long as the array has a known size. For an array
    passed as argument, this is not possible because it decays to the corresponding
    pointer type.


    Note that C++ allows us to return arrays with size, but this feature also applies
    to functions returning an array size is part of the return type:


    ```

    auto getArr() -> int(&)[2]; // getArr() returns array to int array

    auto [x, y] = getArr(); // x and y are initialized by elems of returned array

    ```


    You can also use structured bindings for a std::array but this uses the tuple-like
    API approach, which is described next.


    # 1.2.3 std::pair, std::tuple, and std::array


    The structured binding mechanism is extensible, so that you can add support for
    structured bindings to any type. The standard library uses this for std::pair,
    std::tuple, and std::array.


    # std::array


    For example, the following code initializes i, j, k, and l by the four elements
    of the std::array returned by a function getArray():


    ```

    std::array<int, 4> getArray();

    ```


    ```

    auto [i, j, k, l] = getArray(); // i,j,k,l name the 4 elements of the copied return
    value

    ```


    Here, i, j, k and l are structured bindings to the elements of the std::array
    returned by getArray().\Write access is also supported, providing the value for
    initialization is not a temporary return value. For example:


    ```

    std::array<int,4> stddarr { 1, 2, 3, 4 };

    ```


    ```

    auto& [i,j,k,l] = stddarr; // modifies std::array[0]

    i += 10;

    ```'
