  md: "# Chapter 5: Mandatory Copy Elision or Passing Unmaterialized Objects\n\n}\n\
    \nAnother effect, for classes with explicitly deleted move constructors, you can\
    \ now return temporaries by value and initialize objects with them:\n\n```\nclass\
    \ CopyOnly {\npublic:\n    CopyOnly() {}\n    CopyOnly(int) {}\n    CopyOnly(const\
    \ CopyOnly&) = default;\n    CopyOnly(CopyOnly&&) = delete; // explicitly deleted\n\
    };\n```\n\n```\nCopyOnly ret() {\n    return CopyOnly(); // OK since C++17\n}\n\
    ```\n\nCopyOnly x = 42; // OK since C++17\n\nThe initialization of x was invalid\
    \ before C++17, because the copy initialization (initialization using the =) needed\
    \ the conversion of 42 to a temporary and that temporary in principle needed the\
    \ move constructor, although it was never called. (The fact that the copy constructor\
    \ serves as fallback for a move constructor only applies, if the move constructor\
    \ is not user-declared.)\n\n# 5.3 Clarified Value Categories\n\nAs side effect\
    \ of the proposed change to require copy elision for temporaries when initializing\
    \ objects, some adjustments to value categories were made.\n\n# 5.3.1 Value Categories\n\
    \nEach expression in a C++ program has a value category. The category especially\
    \ describes what can be done with an expression.\n\n# History of Value Categories\n\
    \nHistorically (taken from C), we only had lvalue and rvalue, based on an assignment:\n\
    x = 42;\n\nwhere x used as expression was an lvalue, because it could stand on\
    \ the left side of an assignment, and 42 used as an expression was an rvalue,\
    \ because it could only stand on the right side. But already with ANSI-C things\
    \ became more complicated, because an declared as const int could not stand on\
    \ the left side of an assignment but was now (nonmodifiable) lvalue."
