  md: "# 3.2 Using Inline Variables\n\n```\ntemplate<typename T = std::string>\nMyGlobalObject\
    \ = \"initial value\";\n```\n\n+   * You can derive from a base class template\
    \ for the static member(s):\n\ntemplate<typename Dummy>\nclass MyClassStatics\
    \ {\n    static std::string name;\n};\n\ntemplate<typename Dummy>\nstd::string\
    \ MyClassStatics<Dummy>::name = \"initial value\";\n\nclass MyClass :- public\
    \ MyClassStatics<void>\n{\n};\n\nBut all these approaches lead to significant\
    \ overhead, less readability and/or different ways to use the global variable.\
    \ In addition, the initialization of a global variable might be postponed until\
    \ it's first usage, which disables applications where we want to initialize objects\
    \ at program start (such as when using an object to monitor the process).\n\n\
    # 3.2 Using Inline Variables\n\nNow, with inline, you can have a single globally\
    \ available object by defining it in a header file, which might get included by\
    \ multiple CPP files.\n\n```\nclass MyClass {\n    static inline std::string name\
    \ = \"\"; // OK since C++17\n};\n```\n\ninline MyClass MyGlobalObj; // OK if included/defined\
    \ by multiple CPP units\nThe initializations are performed the first time that\
    \ a translation unit is performed if the header or contents these definitions\
    \ are generated.\n\n+   Formally the inline used here the same semantics as a\
    \ function declared inline:\n* It can be defined in multiple translation units,\
    \ provided all definitions are identical.\n* It must be defined in every translation\
    \ unit in which it is used.\nBoth is given by including the definition from the\
    \ same header file. The resulting behavior of the program is as if there is exactly\
    \ one variable.\n\nYou can even apply this to define atomic types in header files\
    \ only:\ninline std::atomic<bool> ready{false};"
