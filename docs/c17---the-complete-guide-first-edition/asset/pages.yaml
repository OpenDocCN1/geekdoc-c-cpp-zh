    For example, 0xAAp2 is a way to specify the decimal value 40 (10 times 2 to the
    power of 2). The value could also be expressed as 0x1.4p+5, which is 1.25 times
    32 (0.4 is a hexadecimal quarter and 2 to the power of 5 is 32).


    The program has the following output:


    ```

    dec: 16 hex: 0x1p+4

    dec: 10 hex: 0x1.4p+3

    dec: 40 hex: 0x1.4p+5

    dec: 5 hex: 0x1.4p+2

    dec: 5 hex: 0x1.4p+2

    dec: 100000 hex: 0x1.8ap+16

    dec: 100000 hex: 0x1.8bp+16

    dec: 49.625 hex: 0x1.8dp+5

    ```


    As you can see in the example program, for hexadecimal floating-point notation
    already exposed for output streams using the std::hexfloat manipulator (available
    since C++11).


    # 8.6 UTF-8 Character Lists


    Since C++11, C++ supports the prefix u-8 for string literals. However, the prefix
    was not enabled for character literals. C++17 fixes this path, so that you can
    write


    ```

    char c = u8''6''; // character 6 with UTF-8 encoding value

    ```


    This guarantee that your character value is the value of the character ''6'' in
    UTF-8. You can use all 7-bit US-ASCII characters, for 7-bit US-ASCII, ISO Latin-1,
    ISO-8859-15, and the basic Windows character set. 3 Usually, your source code
    interprets characters in US-ASCII/UTF-8 anyway that the prefix c will always be
    54 (hexadecimal 36).


    To give you some reason where the prefix might be necessary: For character and
    string literals in C++ standard you can use without a prefix. The values depend
    on the source character set. And when the compiler generates the executable program
    it uses the execution character set, which is the source character set and is
    always 7-bit US-ASCII and usually the execution character set in the target environment.
    So C++ program and string literals (with without u8 prefix) have the same value.


    But in many scenarios this might not be the case. For example, on IBM hosts, which
    (still) use the EBCDIC character set, the character ''6'' would have the value
    246 (hexadecimal F). In a program using an EBCDIC character set, the value of
    the character c above would be 246 instead of 54 and running the program on a
    UTF-8 encoding platform might print the character ð, which is the character with
    the value of 246 in ASCII (if available). In situations like this prefix might
    be necessary.


    > 3 ISO Latin-1 is formally named ISO-8859-1, the ISO character set with the European
    Euro symbol €, ISO-8859-15, is also named ISO Latin-9 (yes, this is not a spelling
    error).'
