  md: "# 26.3 Cache-Line Sizes\n\nSometimes for a program it is important to deal\
    \ with cache-line sizes:\n\n+   - On one hand, it is important for concurrency\
    \ that different objects accessed by different threads don't belong to the same\
    \ cache-line. Otherwise the same amount of memory has to be synchronized between\
    \ threads when they are accessed concurrently.\n- On the other hand, you might\
    \ have the goal to place multiple objects in the same cache-line so accessing\
    \ the first object gets direct access to the others instead of loading them in\
    \ the cache.\n\nFor this, C++ standard library introduces two `inline` variables\
    \ in header `<new>`:\n\n```\nnamespace std {\n  inline constexpr size_t_destructive_interference_size;\n\
    \  inline constexpr size_t_hardware_constructive_interference_size;\n}\n```\n\n\
    These objects have the following implementation-defined values:\n\n+   - `hardware_destructive_interference_size`\
    \ is the recommended minimum offset between two objects that may be accessed by\
    \ different threads to avoid worse performance because the same L1 cache line\n\
    - `hardware_constructive_interference_size` is the maximum size of contiguous\
    \ memory within two objects are placed in the same L1 cache line.\n\nBoth values\
    \ are only hints the ideal value might depend on the exact architecture. These\
    \ constants are the best hints a compiler can provide dealing with the variety\
    \ of platforms supported by the generated code. So, if you want better, use specific\
    \ values, but using these values is better than any assumed fixed size for code\
    \ supporting multiple platforms.\n\nThe values are at least `(std::max_align)`.\
    \ Usually the value is the same. However, they semantically represent different\
    \ purposes to use different objects, so you should use them as follows:\n\n+ \
    \  - If you want to access two different (atomic) objects by different threads:\n\
    struct Data {\n  alignas(std::hardware_destructive_interference_size) int valueForOneThread;\n\
    \  alignas(std::hardware_destructive_interference_size) int valueForAnotherThread;\n\
    };\n\n+   - If you want to access two different (atomic) objects by the same thread:\n\
    struct Data {\n  int valueForOneThread;\n  int valueForTheSameThread;\n};\n\n\
    // double-check we have best performance due to shared cache-line:\n\n> Accessing\
    \ multiple objects by different threads concurrently is usually safe in C++, but\
    \ the necessary synchronization might degrade the performance of the program."
