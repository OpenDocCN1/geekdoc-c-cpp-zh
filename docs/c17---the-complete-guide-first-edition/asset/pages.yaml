    and Alisair Meredith in https://wg21.link/p0220ri. Some modifications for better
    integration were added by Marshall Clow in https://wg21.link/p0254r2 and in https://wg21.link/p0403r1
    and by Nicolai Josuttis in https://wg21.link/p0392r0.


