  md: "# 2.1 Using Parallel Algorithms\n\nAgain that is not a general proof where\
    \ and when parallel algorithms are worth it. But it demonstrates that even for\
    \ non-trivial operations it can be worth to use them.\n\nThe key is, it's worth\
    \ with\n\n+   - long operations\n- many elements\n\nFor example, using a parallel\
    \ version of the algorithm count_if() counting the number of elements in a vector\
    \ of ints was never worth it; not even with 1,000,000,000 elements:\n\n```\nauto\
    \ num = std::count_if(std::par, // execution policy\n                        \
    \      coll.begin(), coll.end(), // range\n                              [](int\
    \ elem) { // criterion\n                                  return elem % 2 == 0;\n\
    \                                 });\n```\n\nIn fact, for a simple algorithm\
    \ with a predicate as fast as this running parallel probably pays off. Should\
    \ there something with each element that takes significant time and is independent\
    \ from the performance of the other elements.\n\nBut you can't predict anything\
    \ unless it's up to the implementer of the C++ standard library when and how to\
    \ use parallel threads. In, can't control how many threads are used and the implementation\
    \ might decide to use multiple threads with a certain number of elements. Measure!\
    \ With the typical scenarios on your platform(s).\n\n# 22.1.2 Using a Parallel\
    \ sort ()\n\nSorting is another example, where parallel algorithms can help. Because\
    \ sorting criteria are used way more than once for each element, you can save\
    \ significant time.\n\nConsider, for example, we initialize a vector of strings\
    \ as:\n\n```\nstd::vector<std::string> coll;\nfor (int i=0; i < numElems / 2;\
