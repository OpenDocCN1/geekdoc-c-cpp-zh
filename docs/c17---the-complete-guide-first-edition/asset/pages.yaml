    Chapter 18: std::byte


    Note that list initialization (using curly braces) is the only way you can directly
    initialize a single value of std::byte object. All other forms do not compile:


    ```

    std::byte b1{42}; // OK (as for all ones with fixed underlying type since C++17)

    std::byte b2(42);    // ERROR

    std::byte b3 = 42;   // ERROR

    std::byte b4 = {42};  // ERROR

    ```


    This is a direct consequence of the fact that std::byte is implemented as an enumeration
    type, using the new scoped conversions may be initialized with integral values,


    There is also no way to convert the byte array with an explicitly converting integral
    literal:


    ```

    std::byte b5[] {1};      // ERROR

    std::byte b6[] {std::byte(1)}; // OK

    ```


    Without any initialization, the value of std::byte is undefined for object on
    the stack:


    ```

    std::byte b; // undefined value

    ```


    As usual (except for atoms), you can perform an initialization with all bits set
    to zero by initialization:


    ```

    std::byte b{}; // same as b[0]{

    ```


    std::to_integer<>() provides the ability to use the byte object as integral value
    (including bool and char). Without the conversion, the output operator would not
    compile. Note that it is a template you must use the conversion fully qualified
    with std::


    ```

    std::cout << b; // ERROR

    std::cout << to_integer<int>(b1); // ERROR (ADL doesn''t work here)

    std::cout << std::to_integer<int>(b1); // OK

    ```


    Such a conversion is also necessary to use std::byte as a Boolean value. For example:


    ```

    if (b2) // ERROR

    if (b1 == std::byte(0)) // OK

    if (std::to_integer<bool>(b2)) // ERROR (ADL doesn''t work here)

    if (std::to_integer<bool>(b2)) // OK

    ```


    Because std::byte is defined as enumeration with unsigned char as the underlying
    type, the size of std::byte is always 1:


    ```

    std::cout << sizeof(b); // always 1

