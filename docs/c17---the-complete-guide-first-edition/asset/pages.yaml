  md: "# 16.2 Using std::variant\n\nInitializations and assignment always use the\
    \ best match to find out the new alternative. If the type doesn't fit exactly,\
    \ there might be surprises.\n\nNote that empty variants, variants with reference\
    \ members, with C-style array members, and variants with incomplete types (such\
    \ as void) are not allowed.\n\nThere is no empty state. That means for each constructed\
    \ object at least one constructor must be called. The default constructor initializes\
    \ the first type\n\n```\nstd::variant<std::string, int> v; // => v.index() ==\
    \ 0, v == \"\"\n```\n\nIf there is no default constructor defined for the first\
    \ type, calling the default constructor for the variant is a compile-time error.\n\
    \n```\nstruct NoConstr {\n    NoConstr(int i) {\n        std::cout << \"NoConstr::NoConstr\
    \ called\\n\";n    }\n};\n```\n\n```\nstd::variant<NoConstr, int> v1; // ERROR:\
    \ can't default construct first type\n```\n\nThe auxiliary std::monostate provides\
    \ the ability to deal with this situation and also provides the ability to simulate\
    \ an empty state.\n\n# std::monostate\n\nTo support variants, where the first\
    \ type has no default constructor, a helper type is provided: std::monostate.\
    \ Objects of type std::monostate always has the same state, they always compare.\
    \ Their purpose is to represent an alternative type so that the variant has no\
    \ value of any other type.\n\nThat is, std::monostate can serve as a first alternative\
    \ to make the variant type constructible.\n\n```\nstd::variant<std::monostate,\
    \ NoConstr> v2; // OK\nstd::cout << \"index\" << v2.index() << \"\\n\"; // prints\
    \ 0\n```\n\nThere are various ways to check for the monostate, which also demonstrates\
    \ some of the other operations, which can be called for variants:\n\n```\nif (v2.index()\
    \ == 0) {\n    std::cout << \"has monostate\\n\";\n}\nif (!v2.index()) {\n   \
    \ std::cout << \"has monostate\\n\";\n}\n```\n\n> 3 These features might be added\
    \ later, but for C++17 there was not enough experience to support it.\n\n> 4 In\
    \ principle, std::monostate can serve as any alternative not just the first one,\
    \ but of course, then this alternative does not help to make the variant default\
    \ constructible."
