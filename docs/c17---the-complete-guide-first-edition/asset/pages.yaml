  md: '# 22.2 Execution Policies


    You can pass different execution policies as first argument to parallel STL algorithms.
    They are defined in header <execution>. Table Execution Policies lists the standardized
    execution policies.


    | Policy | Meaning |

    | --- | --- |

    | std::execution::seq | sequential execution |

    | std::execution::par | parallel sequenced execution |

    | std::execution::par_unseq | parallel unsequenced (vectorized) execution |


    Table 22.1. Execution Policies


    Let''s discuss execution policies in detail:


    +   **Sequential execution with seq**

    means that with the non-parallel algorithms the current thread of execution sequentially
    executes the necessary operations by element. This policy should behave like using
    the non-parallel way to call algorithms without passing any execution policy at
    all. However, with the parallel algorithms taking this argument additional constraints
    might apply, such as for_each() not returning any value or all iterators to be
    at least forward iterators.

    This policy is provided to be able to request sequential execution by passing
    a different argument instead of using a different signature. Note however that
    parallel algorithms with this policy might behave slightly different than corresponding
    non-parallel algorithms.


    +   **Parallel sequenced execution with par**

    means that multiple thread sequentially execute the necessary operations for the
    elements. When an algorithm starts with the execution of the necessary operations,
    it finishes this execution before it deals with other elements.

    In contrast to par_unseq this enables to ensure that no problems or deadlocks
    occur after processing a step for one element require the call of another step
    for that element before the thread performs the first step with another element.


    +   **Parallel unsequenced execution with par_unseq**

    means that multiple thread execute the necessary operations for multiple elements
    without the guarantee that one thread executes the element without switching to
    other elements. This especially enables vectorized execution where a thread might
    first perform the first step of execution for multiple elements before it executes
    the next step.'
