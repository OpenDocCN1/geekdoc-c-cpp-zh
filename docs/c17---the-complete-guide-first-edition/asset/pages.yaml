  md: '# 5.3 Clarified Value Categories


    And in C++11 we got movable objects, which were semantically objects for the right
    side of an assignment only, but could be modified, because an assignment operator
    could steal their value. For this reason, the category *xvalue* was introduced
    and the former category *rvalue* got a new name *prvalue*.


    # Value Categories Since C++11


    Since C++11


    ![](img/3f232898efb332044c9335ea515fdd0f_60_0.png)


    Figure 5.1. Value Categories since C++11


    Examples of *lvalues*:


    +   * An expression that is just the name of a variable, function, or member

    * An expression that is just a string literal

    * The result of the built-in unary `*` operator (i.e., what dereferencing a raw
    pointer yields)

    * The result of a function returned by lvalue reference (`type&`)


    Examples of *prvalues*:


    +   * Expressions that construct a literal that is not just a string literal (or
    a user-defined literal, where the return type of the associated literal operator
    defines the category)

    * The result of the built-in unary `&` operator (i.e., what taking the address
    of an expression yields)

    * The result of built-in arithmetic operations

    * The result of a function returned by value


    Examples of *xvalues*:


    +   * The result of a function returned by rvalue reference (`type&&`, especially
    returned by `std::move()`)

    * A cast to an rvalue reference to an object type


    Roughly speaking:


    +   * All names used as expressions are *lvalues.*

    * All string literals used as expression are *lvalues.*

    * All other literals (4, 2, true, or nullptr) are *prvalues*.'
