  md: '# Chapter 20: The Filesystem Library


    For example:


    ```

    mypath.is_absolute() // check whether path is absolute or relative

    ```


    +   **Free-standing functions are expensive**, because they usually take the actual
    filesystem into account, so that no operating systems calls are necessary.

    For example:


    ```

    equivalent(path1, path2) // true if both paths refer to the same file

    ```


    Sometimes, the filesystem library provides the same functionality both lexically
    and by taking the actual filesystem into account:


    ```

    std::filesystem::path fromP, toP;

    top::lexically_relative(fromP) // yield lexical path from fromP to toP

    relative(toP, fromP); // yield actual path from fromP to toP

    ```


    Thanks to argument lookup (ADUL) you do not have to specify the full namespace
    std::filesystem, when calling free-standing functions and an argument specific
    type. Only when implicit conversions from other types are used, you have to qualify
    the call. For example:


    ```

    create_directory(std::filesystem::path("tmpdir")); // OK

    remove(std::filesystem::path("tmpdir")); // OK

    std::filesystem::create_directory("tmpdir"); // OK

    std::filesystem::remove("tmpdir"); // OK

    create_directory("tmpdir"); // ERROR

    remove("tmpdir"); // OOPS: calls C function remove()

    ```


    Note that the last call succeeds, but the C function remove() which also removes
    a specified file, does not remove directories under Windows.


    # 20.2.6 Error Handling


    As discussed with the second example filesystems are a source of errors. You have
    to take into account that necessary addition files might not exist, file operations
    are not allowed, or operations violate resource limits. In addition, while program
    run other processes may create, modify, or remove files so that even checks in
    ahead are no guarantee for them.


    The problem is that you can''t ensure that the next operation will succeed. A
    result of a check may no longer be valid when you process it. Usually, the best
    approach is to perform one or more filesystem operations and dealing with exceptions
    or errors.


    Note that when reading/writing with regular files the I/O streams library by default
    does not throw errors. It converts any operation to a no-op instead. Thus, it
    is recommended to check at least whether files could successfully get opened.


    Because dealing with exception is not always appropriate (such as when you want
    to react directly on a failed call), the filesystem library uses a mixed approach
    when dealing with the filesystem:'
