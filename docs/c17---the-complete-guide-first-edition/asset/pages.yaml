  md: "# 3.4 Inline Variables and thread_local\n\n```\nstd::cout << inc(D::n); //\
    \ usually an ERROR\n```\n\nThis code violates the one definition rule (ODR). When\
    \ built with optimizing compiler, it may work as expected or give a link error\
    \ due to the missing definition. When built without optimizations, it will almost\
    \ certainly be rejected due to the missing definition of D:n.^1\n\nThus, before\
    \ C++17, you had to define D:n in exactly one translation unit:\n\n```\nconstexpr\
    \ int D::n; \n // C++11/C++14: definition\n// since C++17: redundant declaration\
    \ (deprecated)\n```\n\nWhen built in C++17, the declaration inside the class is\
    \ a definition by itself, so the code is valid without the former definition.\
    \ The former definition is still valid but deprecated.\n\n# 3.4 Inline Variables\
    \ and thread_local\n\nUsing thread_local you can also make an inline variable\
    \ unique for each thread:\n\n```\nstruct ThreadData {\n    inline static thread_local\
    \ std::string name; // unique name per thread\n};\n```\n\n```\ninline thread_local\
    \ thread_local::std::vector<std::string> cache; // one cache per thread\n```\n\
    \nAs a complete example, consider the following header file:\n\n```\nlang/inetreadlocal.hpp\n\
    #include <string>\n#include <iostream>\n\nstruct MyData {\n    inline static std::string\
    \ gName = \"global\"; // unique in program\n    inline static thread_local std::string\
    \ tName = \"tls\"; // unique per thread\n    std::string lName = \"local\"; //\
    \ for each object\n}\n\nvoid print(const std::string& msg) const {\n    std::cout\
    \ << msg << \" - \" << gName << \"\\n\";\n    std::cout << \" - \" << tName <<\
    \ \"\\n\";\n    std::cout << \" - \" << lName << \"\\n\";\n}\n\ninline thread_local\
    \ MyData myThreadData; // one object per thread\n```\n\n> Thanks to Richard Smith\
    \ for pointing that out."
