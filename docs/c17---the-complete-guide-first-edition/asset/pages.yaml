  md: '# 86


    Chapter 9: Class Template Argument Deduction


    the two arguments are taken as elements of an initializer list (which has higher
    priority according to the overload resolution rules). That is, equivalent to to


    ```

    std::vector<std::set<float>:::iterator> v2(s.begin(), s.end());

    ```


    so that we initialize the v with two elements, referring to the first element
    and the second representing the position beyond the last element.


    On the other hand, consider:


    ```

    std::vector v3("hi", "world"); // OK, deduces std::vector<const char*>

    std::array v4("hi", "world"); // OOPS: fatal run-time error

    ```


    While the declaration of v3 also initializes the vector with two elements (both
    being C strings), the second causes a fatal runtime error, which hopefully causes
    a dump. The problem is that string literals convert to pointers, which are invalid
    iterators. Thus, we pass two iterators that do not point to the same element.
    In other words, we pass an invalid range. Depending on the elements stored, you
    get a std::vector<char*> with any arbitrary number of elements. If it is too big
    you get a bad_alloc exception, or you get a dump because there is no distance
    at all, or you get a range of undefined characters stored in between.


    Thus, using curly braces is the best, when initializing the elements of a vector.
    The only exception is when a single value is passed (where the copy constructor
    is preferred). When passing something else, using parentheses is better.


    # std::array< > Deduction


    A more interesting example provides class std::array<>. To be able to deduce both
    the element and the number of elements


    ```

    std::array a{42, 45, 77}; // OK, deduces std::array<int, 3>

    ```


    the following deduction guide is defined:

    // std::array< > deduces its number of elements (must have same type):


    ```

    namespace std {

    template<typename T, typename...> U>

    array(T, U...)

    -> array<enable_if_t<(is_same<T, U> && ...), T>,

    (1 + sizeof...(U))>;

    }

    ```


    The deduction guide uses the fold expression

    To ensure that the types of all passed arguments are the same. Thus, the following
    is not possible:


    ```

    std::array a{42, 45, 77}; // OOPS: types differ

    ```


    > 5 We discussed about implicit conversions, but we would like to be conservative
    here.'
