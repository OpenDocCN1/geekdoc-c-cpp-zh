  md: "# # Chapter 23\n\n# ## Substring and Subsequence Searchers\n\nSince C++98,\
    \ the C++ standard library provides a search algorithm to find a subsequence of\
    \ elements in a range. However, there exist different search algorithms. For example,\
    \ by pre-computing statistics about the pattern to be searched, these algorithms\
    \ can perform significantly better for special tasks such as finding a substring\
    \ in a large text.\n\nC++17 therefore introduced the Boyer-Moore and Boyer-Moore-Horspool\
