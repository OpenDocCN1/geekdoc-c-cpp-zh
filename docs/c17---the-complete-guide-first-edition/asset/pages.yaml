  md: "# 27.1 Using Standard Memory Resources\n\n```\n{\n  static std::pmr::synchronized_pool_resource\
    \ myPool;\n  return &myPool;\n}\n```\n\nThe type memory_resource is the base class\
    \ of all memory resources.\nNote that a default resource might be used when it\
    \ was replaced. Unless you know (and ensure) that this is not the case, which\
    \ for example means that static objects are created using the resource, you should\
    \ make your resource live as long as possible (again, ideally creating right at\
    \ the beginning of main(), to it is destroyed).\n\n# 27.1.3 Standard Memory Resources\
    \ in Detail\n\nLet's discuss the standard memory resources in detail.\n\n# new_delete_resource()\n\
    \nnew_delete_resource() is the default memory resource. It is returned by get_default_resource()\
    \ unless you have a different memory resource by calling set_default_resource().\n\
    It handles allocations like they are handled when using the default allocator:\n\
    \n+   - Each allocation calls memory\n- Eachallocation calls delete\n\nHowever,\
    \ note that a polymorphic allocator with this memory resource is not interchangeable\
    \ with the default allocator, because they have different types. For this reason\n\
    std::string s(\"my string with some value\");\nstd::pmr::string ps(std::move(s),\
    \ std::pmr::new_delete_resource()); // copies\nwill not move (the memory allocated\
    \ for s to ps). Instead, the memory of s will be copied to new memory of ps allocated\
    \ with.\n\n# (un)synchronized_pool_resource\n\nsynchronized_pool_resource and\
    \ unsynchronized_pool_resource are classes for memory resources that try to allocate\
    \ all memory close to each other. They thus force fragmentation of memory.\nThe\
    \ difference is that synchronized_pool_resource is thread safe (which costs more\
    \ performance) while unsynchronized_pool_resource is not. If you know that the\
    \ memory of this pool is only limited by a single thread (or that (de)allocations\
    \ are synchronized), you should prefer unsynchronized_pool_resource.\nBoth classes\
    \ use an underlying memory resource to actually perform the allocations and deallocations.\
    \ They act as a wrapper ensuring that these allocations are clustered."
