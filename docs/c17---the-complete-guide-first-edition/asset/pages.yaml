  md: "# Chapter 6: Lambda Extensions\n\nTo find out at compile time whether a lambda\
    \ is valid for a compile-time context, you can declare it as constexpr:\n\n```\n\
    auto squared3 = [](auto val) constexpr { // OK since C++17\n    return val;\n\
    };\n```\n\nWith specified return types the syntax looks as follows:\n\n```\nauto\
    \ squared3i = [](int val) constexpr -> int // OK since C++17\n    return val;\n\
    };\n```\n\nThe usual rules governing constexpr functions apply if: If the lambda\
    \ is used in a run-time context, the corresponding functionality is performed\
    \ at runtime.\n\nHowever using features in a constexpr lambda that are not valid\
    \ in a compile-time context result in a compile-time error:\n\n```\nauto squared4\
