    # 7.4 General Attribute Extensions


    The following features were enabled for attributes in general C++17:


    +   1. Attributes are now allowed to mark namespaces. For example, you can deprecate
    a namespace as follows:

    ```

    namespace [[deprecated]] DraftAPI {

    }

    ```

    This is also possible for inline and unnamed namespaces.


    +   2. Attributes are now allowed to mark enumerators (values of enumeration types).

    For example, you can introduce a new enumeration value as a replacement of an
    existing (now [deprecated]) enumeration value as follows:


    ```

    enum class City { Berlin = 0,

    York = 1,

    Mumbai = 2, Bombay [[deprecated]] = Mumbai,

    ... };

    ```


    Here, both Mumbai and Bombay represent the same numeric code for a city, but using
    Bombay is marked as deprecated. For that attribute which usually should be defined
    in its own namespace, marked behind the identifier, you can now use a prefix to
    avoid the repetition of the attribute name for each attribute. That is, instead
    of:


    ```

    [MyLib::WebService, MyLib::RestService, MyLib::doc("html")] void foo();

    ```


    you can write


    ```

    [using MyLib::WebService, RestService, doc("html")] void foo();

    ```


    Note that using with a prefix using the namespace again is an error:


    ```

    [using MyLib::MyLib::doc("html")] void foo(); // ERROR

    ```


