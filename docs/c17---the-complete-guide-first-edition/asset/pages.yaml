  md: "# # Chapter 28\n\n# # new and delete with Over-Aligned Data\n\nSince C++11\
    \ you can specify over-aligned types, having a bigger alignment than the default\
    \ alignment by using the alignas specifier. For example:\n\n```\nstruct alignas(32)\
    \ MyType32 {\n    int i;\n    char c;\n    std::string s[4];\n}\nMyType32 val1;\
    \ // 32-bytes aligned\nalignas(64) MyType32 val2; // 64-bytes aligned\n```\n\n\
    Note that the alignment value has to be a power of 2 and specifying any value\
    \ less than the default alignment for the type is an error.\nHowever, dynamic/heap\
    \ allocation of over-aligned data is not handled correctly in C++11 and C++14.\
    \ Using operator new for over-aligned types by default ignores the requested alignment,\
    \ so that a type usually 63-bytes aligned might, for example, only be 8-bytes\
    \ or 16-bytes aligned.\nThis gap was closed with C++17. The new behavior has the\
    \ consequence that new overloads with an alignment argument are provided to be\
    \ able to provide your own implementations of operator new for over-aligned data.\n\
    \n> Some compilers accept and ignore alignment values less than the default alignment\
    \ with a warning or silently."
