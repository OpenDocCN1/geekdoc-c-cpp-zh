  md: "94\n\nthe second phase (the instantiation time) so invalid function calls and\
    \ even some syntax errors might compile.\n\n# 10.2 Using Compile-Time if\n\nIn\
    \ principle, you can use the compile-time like the run-time if provided the condition\
    \ is a compile-time expression. You can also mix compile-time and run-time if:\n\
    \n```\nif constexpr(std::is_integral_v<remove_reference_t<T>>) {\n  if (val >\
    \ 10) {\n    constexpr(std::numeric_limits<char>::is_signed) {\n      \n    }\n\
    \  } else {\n    }\n  }\n} else {\n  }\n}\n```\n\nNote that you cannot use constexpr\
    \ outside function bodies. Thus, you can't use it to replace conditional preprocessor\
    \ directives.\n\n# 10.2.1 Caveats for Compile-Time if\n\nEven if it is possible\
    \ to use compile-time if there be some consequences that are not obvious, which\
    \ are discussed in the following subsections.\n\n# Compile-time if Impacts the\
    \ Return Type\n\nCompile-time if might impact the return type of a function. For\
    \ example, the following code always compiles, but the return type might differ:\n\
    \n```\nauto foo()\n```\n\n> 1 Visual C++ is on the way to fix this behavior step-by-step,\
    \ however, requires specific options such as /missive-, because it might break\
    \ existing code.\n\n> 2 Thanks to Graham Haynes, Paul Reilly, and Barry Revzin\
    \ for bringing all these aspects of compile-time if to attention."
