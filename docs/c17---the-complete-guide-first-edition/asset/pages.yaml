    The last two are formally defined undefined behavior. They, are not guaranteed
    to work, although in this case you can assume to have null terminator after the
    last character.


    You can initialize a string view having the null terminator as part of its value
    by passing the number of characters including the null terminator


    ```

    std::string_view sv("hello", 6); // NOTE: 6 to include ''\0''

    std::cout << sv.size();

    std::cout << sv.at(5);      // OK, prints the value of ''\0''

    std::cout << sv[5];         // OK, prints the value of ''\0''

    std::cout << sv.data();     // OK

    ```


    +   - To create a string view from a std::string an implicit conversion operator
    is provided in class std::string. Again, having the null terminator after the
    last character, which is usually guaranteed for a string, it is not guaranteed
    to work for the string view:


    ```

    std::string s = "hello";nstd::cout << s.size();      // 5

    std::cout << s.at(5);       // OK, prints the value of ''\0''

    std::cout << s[5];         // OK, prints the value of ''\0''


    std::string_view sv(s);

    std::cout << sv.size();      // 5

    std::cout << sv.at(5);       // throws std::out_of_range exception

    std::cout << sv[5];         // undefined behavior, HERE IT usually works

    std::cout << sv.data();      // undefined behavior, HERE IT usually works

    ```


    As the literal is defined for the suffix sv, you can also create a string view
    as follows:


    ```

    using namespace std::literals;

    auto s = "hello"sv;

    ```


    The key point is in general that you should not expect the null terminating characters
    and always use size() (unless you know specific things about the value).


    As a workaround you can make ''\0'' part of the string view, you should not use
