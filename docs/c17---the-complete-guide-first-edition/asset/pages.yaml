    | Trait | Effect |

    | --- | --- |

    | is_aggregate<T> | Is aggregate type |

    | has_unique_object_representations<T> | Any two object with same value have same
    representation in memory |

    | is_invocable<T,Args...> | Can be used as $Args$... |

    | is_nothrow_invocable<T,Args...> | Can be used as $Args$... without throwing
    |

    | is_invocable_r<T,Args...> | Can be used as $Args$... returning RT |

    | is_nothrow_invocable_r_RT<T,Args...> | Can be used as $Args$... returning RT
    without throwing |

    | invoke_result<T,Args...> | Result type if used as called for $Args$... |

    | is_swappable<T> | Can call swap() for this type |

    | is_nothrow_swappable<T> | Can call swap() for this type and operation can''t
    |

    | is_swappable_with<T,T2> | Can call swap() for these two types with specific
    value category |

    | is_nothrow_swappable_with<T,T2> | Can call swap() for these two types with specific
    value category and that operation can''t |

    | conjunction<B...> | Logical and for Boolean traits B... |

    | disjunction<B...> | Logical or for Boolean traits B... |

    | negation<B> | Logical not for Boolean trait B |


    Table 21.1. New Traits Since C++17


    ```

    using bool_constant = integral_constant<bool, B>; // since C++17

    using true_type = bool_constant<true>;

    using false_type = bool_constant<false>;

