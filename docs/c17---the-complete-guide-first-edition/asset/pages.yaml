    a constructor as a defect C++17 with https://wg21.link/p0739r:


    The shared_mutex was first proposed together with all mutexes for C++11 by Howard
    Hinnant at https://wg21.link/n4206. However, it took to convince the C++ standardization
    committee that all proposed mutexes are useful. So, the finally accepted wording
    was formulated for C++17 by Gor Nanov in https://wg21.link/n4508.


    The std::atomic<> static member std::is_always_lock_free was first proposed by
    Olivier Giroux, JF Bastien, and Jeff Snyder in https://wg21.link/n4509. The finally
    accepted wording was also formulated by Olivier Giroux, JF Bastien, and Jeff Snyder
    in https://wg21.link/p0152r1.


