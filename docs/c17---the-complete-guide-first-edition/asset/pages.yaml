  md: '# 22.7 Parallel Algorithms in Detail


    # 22.8 Afternotes


    Parallelizing the STL algorithms was first proposed in 2012 by Jared Oberck Michael
    Garland Olivier Giroux Vinov, Uyal Kapasi, and Jaydeep Marathe at https://wg21.link/n3408.
    It became a formal beta standard, the Technical Specification for C++ Extensions
    for Parallelism (see https://wg21.link/n3850). Additional algorithms were added
    by Jared Oberck, Grant Mercer, Agustin Berge, and Harmut Kaiser in https://wg21.link/n4276.
    With https://wg21.link/p0024r2 the Technical Specification for C++ Extensions
    for Parallelism was adopted to the standard library as proposed by Jared Oberck.
    The handling of exceptions was accepted as proposed by JF Bryce Adelstein Lelbach
    in https://wg21.link/p0394r4.'
