  md: "# 17.2 std::any Types and Operations\n\nThis section describes the types and\
    \ operations of std::any in detail.\n\n# 17.2.1 Any Types\n\nIn the header file\
    \ <any> the C++ standard library defines class std::any as follows:\n\n```\nnamespace\
    \ std {\n    class any;\n}\n```\n\nThat is, std::any: the following type and objects\
    \ are defined:\n\n+   Exception class std::any::bad_cast, which is derived from\
    \ std::bad_cast, which is derived from std::any::exception, if conversions fail.\n\
    \nAny objects also use the objects std::in_place_type (of type std::in_place_type_t)\
    \ defined in utility.\n\n# 17.2.2 any Operations\n\n| Operation | Effect |\n|\
    \ --- | --- |\n| constructors | Create an object (might call constructor for underlying\
    \ type) |\n| make_any() | Create an object (passing value(s) to initialize it)\
    \ |\n| destructor | Destroys an object |\n| = | Assign a new value |\n| emplace<T>()\
    \ | Assign a new value having the type T |\n| reset() | Destroys any value (makes\
    \ the object empty) |\n| has_value() | Returns whether the object has a value\
    \ |\n| type() | Return the current type as std::type_info object |\n| any_cast<T>()\
    \ | Use current value as type T (exception if other type) |\n| swap() | Swaps\
    \ values between two objects |\n\nTable 17.1. std::any Operations\n\n# Construction\n\
    \nBy default, std::any is initialized by being empty.\n\n```\nstd::any a;\n//\
    \ a is empty\n```\n\nIf a value is passed for initialization, its decayed type\
    \ is used as type of the contained value."
