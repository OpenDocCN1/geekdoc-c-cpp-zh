    # 9.2.1 Using Deduction Guides to Force Decay


    As the previous example demonstrates, a very useful application of these overloading
    rules is to ensure that template parameter T decays while it is deduced. Consider
    a typical class template:


    ```

    template<typename T>

    struct C {

    C(const T&) {

    ...

    }\};

    ```


    If we pass a string literal "hello", T is deduced as the string literal, which
    is const char[6];


    ```

    C x{"hello"}; // decays as const char[6]

    ```


    The reason is that template parameter deduction does not decay to the corresponding
    pointer type, With a simple deduction guide


    ```

    template<typename T> C(T) -> C<T>;

    ```


    we fix this problem:


    ```

    C x{"hello"}; // decays as const char*

    ```


    Now, because the deduction guide takes it argument by value, its type decays,
    so that "hello" decays to be of type const*.

    For reason, a corresponding deduction guide sounds reasonable for any class template
    having a constructor taking an object of its template parameter by reference.
    The C++ standard library provides corresponding deduction guides for pairs and
    tuples.


