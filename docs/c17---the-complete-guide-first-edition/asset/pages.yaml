    # Acknowledgments


    First I''d like to thank the C++, community, for making this book possible. The
    incredible design of new features, the helpful feedback, the curiosity is the
    base for an ever succeeding language. Especially thanks for all the issues you
    pointed out and the feedback you gave back.


    I especially like to thank everyone who reviewed drafts of this book or corresponding
    lists and provided valuable feedback and clarifications. These reviews brought
    the book to a significantly higher level of quality, and I agree that good things
    need the input of "wise guys." For this reason, so far (this list is still growing)
    thanks to Roland Bock, Marshall Clow, Matthew Dodkins, Andres Fertig, Graham Haynes,
    Austin McCartney, Billy O''Neal, Daniel Sankel, Zachary Turner, Paul Reilly, Barry
    Revzin, and Viktor Romeo.


    In addition, I''d like to thank everyone in the C++ community and on the C++ standardization
    committee. In addition to all the work to add new language and library features,
    they spent many, many hours explaining and discussing their work with, and they
    did so with patience and enthusiasm.'
