  md: "# # Chapter 21\n\n#  Type Traits Extensions\n\nRegarding type traits (standard\
    \ type functions), C++17 extends the general abilities to use them and introduces\
    \ some new type traits.\n\n# ## 21.1 Type Traits Suffix _v\n\nSince C++17 you\
    \ can use the suffix _v for all type traits yielding a value (as you can use the\
    \ suffix _t for all type traits yielding a type). For example, for any T instead\
    \ of\n\n```\nstd::is_const<T>::value\n```\n\nyou can write:\n\n```\nstd::is_const<T>::v\
    \ // since C++17\n```\n\nThis applies to all type traits. The approach is that\
    \ for each standard type trait a corresponding variable template is defined. For\
    \ example:\n\n```\nnamespace std {\n    template<typename T>\n    constexpr bool\
    \ is_const<T>::v = is_const<T>::value;\n}\n```\n\nUsually helps to formulate Boolean\
    \ conditions which you can use at runtime:\n\n```\nif (std::is_signed_v<char>)\
    \ {\n    ...\n```\n\nBut as type traits are evaluated at compile time, you can\
    \ use the result at compile time in a compile-time if:\n\n```\nif constexpr (std::is_signed_v<char>)\
    \ {\n    ...\n```"
