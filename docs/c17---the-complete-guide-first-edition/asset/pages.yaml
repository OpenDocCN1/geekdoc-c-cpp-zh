  md: "# 10.2 Using Compile-Time if\n\n```\nif constexpr(sizeof(int) > 4) {\n    return\
    \ 42;\n}\nelse {\n    return 42u;\n}\n```\n\nHere, we use auto, the return type\
    \ of the function depends on the return statements, which depend on the size of:\n\
    \n+   - If the size is greater than 4, there is only one valid return statement\
    \ 42, so that the return type is int.\n- Otherwise, there is only one return statement\
    \ returning 42u, so that the return type becomes unsigned int.\n\nThis return\
