    # 28.3 Implementing Global operator new ()


    By default, a C++ platform provides a significant number of global overloads for
    operator new() and delete() (including the array versions).


    ```

    void*::operator new(std::size_t);

    void*::operator new(std::size_t size, std::align_val_t align);

    void*::operator new(std::size_t size, const std::nothrow_t&) noexcept;

    void*::operator new(std::size_t size, std::align_val_t align, const std::nothrow_t&)
    noexcept);

    ```


    ```

    void::operator delete(void*) noexcept;

    void::operator delete(void*, std::size_t) noexcept;

    void::operator delete(void*, std::align_val_t) noexcept;

    void::operator delete(void*, std::size_t) noexcept;

    void::operator delete(void*, const std::nothrow_t&) noexcept;

    void::operator delete(void*, std::align_val_t, const std::nothrow_t&) noexcept);

    ```


    ```

    void*::operator new[](std::size_t);

    void*::operator new[](std::size_t size, std::align_val_t align);

    void*::operator new[](std::size_t size, const std::nothrow_t&) noexcept;

    void*::operator new[](std::size_t size, std::align_val_t align, const std::nothrow_t&)
    noexcept);

    ```


    ```

    void::operator delete[](void*) noexcept;

    void::operator delete[](void*, std::size_t) noexcept;

    void::operator delete[](void*, std::align_val_t) noexcept;

    void::operator delete[](void*, std::size_t) noexcept;

    void::operator delete[](void*, const std::nothrow_t&) noexcept;

    void::operator delete[](void*, std::align_val_t, const std::nothrow_t&) noexcept);

    ```


    If you want to implement your own memory management (e.g., to be able to debug
    dynamic memory calls), it is enough to implement the following basic functions:
    by default all other functions (including all array versions) call one of these
    basic:


    ```

    void*::operator new(std::size_t);

    void*::operator new(std::size_t size, std::align_val_t align);

    void::operator delete(void*) noexcept;

    void::operator delete(void*, std::size_t) noexcept;

    ```'
