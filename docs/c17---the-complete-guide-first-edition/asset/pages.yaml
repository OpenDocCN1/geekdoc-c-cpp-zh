    # Chapter 20: The Filesystem Library


    When creating a symbolic link to a directory you should prefer create_directory_symlink().
    over create_symlink(), because some operating systems require to specify explicitly
    that the target is a directory. Note that the first argument has to be the path
    where the symbolic link refers from the view of the symbolic link. Thus, create
    a symbolic link from sub/slink to sub/file.txt you have to call:


    ```

    std::filesystem::create_symlink("file.txt", "sub/slink");

    ```


    The statement


    ```

    std::filesystem::create_symlink("sub/file.txt", "sub/slink");

    ```


    would create a symbolic link to sub/sub/file.txt.

    The functions to remove have the following behavior:


    +   * remove() removes a file or an empty directory. It returns false if there
    was no file/directory or it could not be removed or no exception is thrown.

    * remove_all() removes a file or recursively. It returns uint_t value how many
    files were removed. It returns zero if there was no file and max_t(-1) if an error
    occurred and no exception is thrown.


    In both cases symbolic links are removed rather than they refer to.

    Note that you should always qualify remove() when passing a string as argument,
    otherwise the C function remove() is called.


