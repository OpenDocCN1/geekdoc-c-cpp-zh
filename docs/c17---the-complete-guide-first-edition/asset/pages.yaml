  md: "# 4.5 Afternotes\n\n```\nDerived d2;\n    // still OK (but might not initialize)\n\
    }\n```\n\nBefore C++17, Derived was not an aggregate. Thus.\nDerived d1{};\n\n\
    was calling the implicitly defined default constructor of Derived, which by default\
    \ called the default constructor of the base class Base. Although the default\
    \ constructor of the base class is private, it was valid to be called via the\
    \ default constructor of the derived class, because the derived class was deemed\
    \ to be a friend class.\n\nSince C++17, Derived in this example is an aggregate,\
    \ not having an implicit default constructor at all (the constructor is not inherited\
    \ by a using declaration). So the initialization is an aggregate initialization,\
    \ for which it is not allowed to call private constructors of bases classes. Whether\
    \ the base class is a friend doesn't matter.\n\n# 4.5 Afternotes\n\nExtended aggregate\
    \ initialization was first proposed by Oleg Smolsky in https://wg21.link/n4404.\
    \ The finally accepted wording was also formulated by Oleg Smolsky in https://wg21.link/p0017r1.\n\
    \nThe type trait std::is_aggregate<> was introduced as a US national body comment\
    \ for the standardization of C++17 (see https://wg21.link/lwg2911)."
