  md: '# 15.2 std::optional< > Types and Operations


    +   - If one operand is an object with a value operand without a value is considered
    to be less than the other operand.


    For example:


    ```

    std::optional<int> o0;

    std::optional<int> o1{42};


    00 == std::nullopt // yields true

    00 == 42 // yields false

    00 < 42 // yields true

    00 > 42 // yields false

    01 == 42 // yields true

    00 < o1 // yields true

    ```


    This means that optional objects of unsigned int there is a value less than 0
    and for optional objects of bool there is a value less than 0:


    ```

    std::optional<unsigned> u0;

    u0 < 0 // yields true

    std::optional<bool> b0;

    b0 < false // yields true

    ```


    Again, implicit type conversions for the underlying type are supported:


    ```

    std::optional<int> o1(42);

    std::optional<double> o2(42.0);

    ```


    ```

    o2 == 42 // yields true

    o1 == o2 // yields true

    ```


    Note that optional Boolean or raw pointers can result in some surprises.


    # Changing the Value


    Assignment and emplace() operations exist correspond to the initializations:


    ```

    std::optional<complex<double>> o; // has no value

    std::optional<int> ox{77}; // optional<int> with value 77

    ```


    ```

    o = 42 // value becomes complex(42.0, 0.0)

    o = {9.9, 4.4}; // value becomes complex(9.9, 4.4)

    o = ox; // OK, because it converts to complex<double>

    o = std::nullopt // o no longer has a value

    o.emplace(5.5, 7.7); // value becomes complex(5.5, 7.7)

    ```


    Assigning std::nullopt removes the value, which calls the destructor of the contained
    type if there was a value before. You can have the same effect by calling reset():


    ```

    o.reset(); // o no longer has a value

    ```


    or assigning empty braces:'
