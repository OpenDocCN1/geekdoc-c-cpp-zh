  md: '# Chapter 16


    # std::variant<>


    # 16.1 Motivation of std::variant<>


    Adopted from C, C++ provides support for unions, which are objects able to hold
    one of a list of


    +   - Objects do not know which type of value they currently hold.

    - For this reason you cannot have non-trivial members, such as std::string (without
    specific effect.).

    - You cannot draw from a union.


    With std::variant<> the C++ standard library provides a closed discriminated union
    (which means that there is a specified list of possible types and you can specify
    which type you mean), where


    +   - the type of the current value is always known,

    - that can have members of any specific type, and

    - you can draw from.


    > Since C++11, unions in principle can have non-trivial members, but you have
    to implement special member functions such as the copy-constructor and destructor
    then, because only by programming logic you know which member is active.'
