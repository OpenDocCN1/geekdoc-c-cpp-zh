  md: "# Chapter 3: Inline Variables\n\nNote that as usual for std::atomic you always\
    \ have to initialize the values when you define them.\n\nNote that you have to\
    \ ensure that types are complete before you initialize them. For example, if a\
    \ struct or class has a static member of its own type, the member can only be\
    \ inline defined after the type declaration:\n\n```\nstruct MyType {\n    int\
    \ value;\n    MyType(int i) : value{i} {\n        // one static object to hold\
    \ the maximum value of this type:\n        static MyType max; // can only be declared\
    \ here\n    }\n};\nninline MyType::max(0);\n```\n\nSee the header file to track\
    \ all channels for another example of using inline variables.\n\n# 3.3 constexpr\
    \ implies inline\n\nFor static data members, constexpr implies inline, now such\
    \ that the following declaration C++17 defines the static data member n:\n\n```\n\
    struct D {\n    static constexpr int n = 5; // C++11/C++14: declaration\n    \
    \                       // since C++17: definition\n};\n```\n\nThat is, it is\
    \ the same as:\n\n```\nstruct D {\n    inline static constexpr int n = 5;\n};\n\
    ```\n\nNote that before C++17 you already sometimes had the declaration without\
    \ a corresponding definition. Consider the following declaration:\n\n```\nstruct\
    \ D {\n    static constexpr int n = 5;\n};\n```\n\nThis was enough if no definition\
    \ of D::n was needed, which, for example, the case if D::n only passed by value:\n\
    \n```\nstd::cout << D::n; // OK (ostream::operator<<(int) gets D::n by value)\n\
    ```\n\nIf D::n was invalid passed by reference to a non-inline function or the\
    \ call was not optimized away this was was. For example:\n\n```\nint inc(const\
    \ int& i);\n```"
