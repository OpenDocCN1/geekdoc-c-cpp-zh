  md: "# Chapter 5: Mandatory Copy Elision or Passing Unmaterialized Objects\n\n+\
    \   When we return a temporary object by its type or auto:\n```cpp\nauto f() {\
    \ // return deduced type by value\n  ...\n  return MyType{...};\n}\n```\n\n+ \
    \  When we return a temporary object by decltype(auto):\n```cpp\ndecltype(auto)\
    \ f3() { // return temporary from return statement by value\n  ...\n  return MyType{...};\n\
    }\n```\n\nRemember that a declaration with decltype(auto) operates by value if\
    \ the expression used for initialization (here the return statement) is an expression\
    \ that creates a temporary (a prvalue). Because we return a prvalue in all these\
    \ cases, we don't require any copy/move support at all.\n\n# 5.5 Afternotes\n\n\
    The mandatory copy elision for initializations from temporaries was first proposed\
    \ by Richard Smith in https://wg21.link/p0135r0. The finally accepted wording\
    \ was also formulated by Richard Smith in https://wg21.link/p0135r1."
