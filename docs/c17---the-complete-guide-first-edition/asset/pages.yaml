    Beside regular files and directories the most common other type is a symbolic
    link, which is a type of files that refer to another filesystem. At that location
    there might be a file or there might not. Note that some operating systems and/or
    file systems (e.g., the FAT file system) don''t support symbolic links at all.
    Some operating systems support them only for regular files. Note that on Windows
    you need special permissions to create symbolic links, which you for example,
    can do with the link command.


    Character-special files, block-special files, FIFOs, and sockets from the UNIX
    filesystem. Currently, all four types are not used with Visual C++.¹


    As you can see, special values exist when the file doesn''t exist or its type
    is not known or detectable.


    In the remainder of this chapter I use two general categories representing a couple
    of file types:


    +   * Other files: Files with any file type other than regular file, directory,
    and symbolic link. The library function is_other() matches this term.

    * Special files: Files with any of the following file types: Character-special,
    block-special files, FIFOs, and sockets.


    The special types plus the implementation-defined file types together form the
    other file types.


