  md: '# Chapter 26: Multi-Threading and Concurrency


    // manipulate allIssues and openIssues


    }


    Note that for class template argument deduction you don''t have to specify the
    types of the mutexes

    when declaring lg.


    This example usage is equivalent to the following code, which is possible to be
    called since

    C++11:


    // lock both lists:


    ```

    {

    std::lock(allIssuesMx, openIssuesMx); // lock with deadlock avoidance

    std::lock_guard<std::mutex> lg1(allIssuesMx, std::adopt_lock);

    std::lock_guard<std::mutex> lg2(openIssuesMx, std::adopt_lock);

    // manipulate both allIssues and openIssues

    }

    ```


    Thus, if more than one mutex is passed, the constructor of scoped_lock uses the
    variadic convenience

    function lock(...), which guarantees that the call does not result in a deadlock
    (the standard

    notes: "A deadlock avoidance algorithm such as try-and-back must be used, and
    the specific

    alorithm is not specified to avoid over-constraining implementations")


    If only one mutex is passed to the constructor of a scoped_lock, it simply locks
    the mutex.

    Thus, in, scoped_lock with a single constructor argument acts like a lock_guard.
    It then even

    defines member_type, which is not defined for multiple mutexes.¹ For this reason,
    you

    can replace all usages of lock_guard by scoped_lock.


    If no mutex is passed, the lock guard has no effect.


    Note that you can also lock multiple:


    // lock both lists:


    ```

    {

    std::lock(allIssuesMx, openIssuesMx); // Note: deadlock avoidance algorithm

    std::scoped_lock lg(std::adopt_lock, allIssuesMx, openIssuesMx);

    // manipulate both allIssues and openIssues

    }

    ```


    Note however that the constructors that lock mutexes now have the adopt_lock argument

    at the front.²


    > ¹ The typical implementation is to provide a partial specialization for the
    case where only one mutex is

    passed to the scoped lock.


    > ² In the original C++17 standard the adopt_lock argument was at the end, which
    was later fixed with https:

    //wg21.link/p0739r'
