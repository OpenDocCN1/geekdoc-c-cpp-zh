  md: '# 1.2 Where Structured Bindings can be Used


    In principle, structured bindings can be used for structures with public data
    members, raw C-style arrays, and "tuple-like objects":


    +   - If in structures and classes all non-static data members are public, you
    can bind each non-static data member to exactly one name.

    - For raw arrays, you can bind a name to each element.

    - For any type you can use a tuple-like API to bind names to whatever the API
    defines as "elements". The API roughly consists of the following elements for
    a type type:


    ```

    std::tuple_size<type> = has to return the number of elements.

    std::tuple_element<idx, type> = has to return the type of the idxth element.

    A global or member get<idx>(t) = has to yield the value of the idxth element.

    ```


    The standard libraries std::pair, and std::array> already provide this API.

    If structures or classes provide the tuple-like API, the API is used.

    In all cases the number of elements or data members has to fit the number of names
    in declaration of the structured binding. However, you could use a very short
    name and you can''t use a name twice. However, this is not allowed in the global
    namespace), but this works only in the same scope:


    ```

    auto [_,val1] = getStruct(); // OK

    auto [_,val2] = getStruct(); // ERROR: _ already used

    ```


    Nested or non-flat decomposition is not supported.

    The following subclasses discuss all these cases in detail.


    # 1.2.1 Structures and Classes


    The examples introduced in the sections above demonstrate a couple of simple cases
    for structured bindings for structures and classes.

    Note that there is only limited usage of inheritance possible. All non-static
    data members must be members of the same class definition (thus, they have be
    direct members of the type or of the unambiguous base class:


    ```

    struct B {

    int a = 1;

    int b = 2;

    };

    ```


    ```

    struct D1 : B {

    };

    auto [x, y] = D1(); // OK

    ```


    ```

    struct D2 : B {

    ```'
