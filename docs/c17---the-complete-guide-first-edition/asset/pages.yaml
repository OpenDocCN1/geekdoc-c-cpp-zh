  md: "# 11.2.1 Dealing with Empty Parameter Packs\n\nIf a fold expression is used\
    \ with an empty parameter pack, the following rules apply:\n\n+   * If operator\
    \ && is used, the value is `true`.\n* If operator || is used, the value is `false`.\n\
    * If the comma operator is used, the value is `void()`.\n* For all other operators\
    \ the call is ill-formed.\n\nFor other cases (and in general) we can add an initial\
    \ value: Given a parameter pack `args`, an initial value and an operator op, C++17\
    \ allows us to write\n\n+   * a binary left fold\n  - `(value op ... args)`\n\
    \  expands to: `((value op arg1) op arg2) op arg3) op ...`\n\n+   * a binary right\
    \ fold\n  - `(args ... op value)`\n  expands to: `(arg1 op (arg2 ... (argN value)))`\n\
    \nThe operator has to be present on both sides of the ellipsis. For example, the\
    \ following definition allows to pass an empty parameter pack when adding values:\n\
    \n```\n```cpp\ntemplate<typename... T>\nauto fold(T ... args) {\n    return (0\
    \ + ... + args); // even works if sizeof...(args)==0\n}\n```\n```\n\nConceptually,\
    \ it shouldn't matter, whether we add 0 as first or last operand:\n\n```\n```cpp\n\
    template<typename... T>\nauto fold(T ... args) {\n    return (args + ... + 0);\
    \ // even works if sizeof...(args)==0\n}\n```\n```\n\nBut for unary fold expression\
    \ the different evaluation order matters more often than thought and the binary\
    \ left fold should be preceded:\n\n+   * `(val + ... + args); // preferred syntax\
    \ for binary fold expressions\n\nAlso, the first argument might be special, such\
    \ as in this example:\n\n```\n```cpp\ntemplate<typename... T>\nvoid print(const\
    \ T ... args) {\n    (std::cout << ... << args) << '\\n';\n}\n```\n```\n\nHere,\
    \ it is important that the first call is the output of the first argument passed\
    \ to print(), which returns the stream to perform the other output calls. Other\
    \ implementations might not compile or do unexpected. For example,"
