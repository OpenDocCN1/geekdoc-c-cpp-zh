  md: 'Chapter 22: Parallel STL Algorithms


    Parallel un execution need special support of the compiler/hardware to detect
    where and how operations can be vectorized.¹


    # 22.3 Exception Handling


    All parallel algorithms call std::terminate(), if element access functions exit
    via an uncaught exception.


    Note that this also applies, if the sequential execution policy is chosen. If
    this is not acceptable, using the non-parallel version of an algorithm might be
    the better choice.

    Note that parallel algorithms may still throw. In case they fail to acquire temporary
    memory resources for parallel execution they can call std::bad_alloc. However,
    nothing else may thrown.


    # 22.4 Benefit of not using Parallel Algorithms


    With the ability to call parallel algorithms and the fact that they even provide
    a sequential execution policy, the question might arise, whether we still need
    the non-parallel algorithms.

    However, beside backward compatibility a non-parallel algorithm might have significant
    benefits:


    +   * Input and output iterators can be used.

    * Algorithms do not terminate() on exceptions.

    * Algorithms may avoid side effects due to an unintended use of elements.

    * Algorithms may provide additional functionality, such as for_each() returning
    the passed callable to be able to deal with its resulting state.


    # 22.5 Overview of Parallel Algorithms


    Table Unmodified Parallel STL Algorithms lists the algorithms that are standardized
    to support parallel processing without any modification.

    Table Modified Parallel Algorithms lists the algorithms that are standardized
    to support parallel processing with some modifications.

    Table STL Algorithms Without Parallelization lists the algorithms that don''t
    support parallel processing.


    Note that accumulate() and inner_product() new parallel algorithms are provided
    with relaxed requirements.


    > ¹ For example, if a CPU supports registers of 512 Bytes, a compiler might perform
    computations by loading eight 64-Byte or four 128-Byte values at once in a register
    and perform multiple computations with them in parallel.'
