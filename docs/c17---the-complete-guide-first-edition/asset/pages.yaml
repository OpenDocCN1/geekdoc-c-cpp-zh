  md: "# 28.2 Implementing operator new() for Aligned Memory\n\nThat is, each time\
    \ you call new for a type T a corresponding call of either a type specific T::operator\
    \ new() or (if one exists) the global ::operator new() is called:\n\nThe same\
    \ each time you call delete for a type T a corresponding call of either a type\
    \ specific T::operator delete() or the global ::operator delete(T*) is called.\
    \ Arrays are allocated/deallocated, the corresponding type-specific or global\
    \ operator new[]() and operator delete[]() are called.\n\nSince C++17, a requested\
    \ alignment was not automatically passed to these functions and the default mechanisms\
    \ allocate dynamic memory without considering the alignment. An over-aligned type\
    \ always needs its own implementations of operator new() and operator delete()\
    \ to be correctly aligned on dynamic memory. Even worse, there was no portable\
    \ way to perform the request for over-aligned dynamic memory.\n\nAs a consequence,\
    \ for example, you have done something along the lines of following:\n\n```\n\
    aligned_new.cpp\n#include <cstddef> // for std::size_t\n#include <string>\n#if\
    \ _STDC_VERSION >= 201112L\n#include <stdlib.h> // for aligned_alloc()\n#else\n\
    #include <malloc.h> // for _aligned_malloc() or mem memalign()\n#endif\n\nstruct\
    \ alignas(32) MyType {\n    int i;\n    char c;\n    std::string s[4];\n}\n\n\
    void* operator new(std::size_t size) {\n    // allocate memory for requested alignment:\n\
    #if _STDC_VERSION >= 201112L\n    // use API of C11:\n    return aligned_alloc(alignof(MyType2),\
    \ size);\n#else\n#ifdef _MSC_VER\n    // use API of Windows:\n    return _aligned_malloc(size,\
    \ alignof(MyType2));\n#else\n    // use API of Linux:\n    return memalign(alignof(MyType2),\
    \ size);\n#endif\n#endif\n```"
