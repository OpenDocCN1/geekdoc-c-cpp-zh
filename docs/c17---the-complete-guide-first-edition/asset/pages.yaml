  md: "# 4.3 Definition of Aggregates\n\nTo summarize, since C++17 an *aggregate*\
    \ is defined as\n\n+   - either an array\n- or a class type (class, struct, or\
    \ union) with:\n  - no user-declared or inherited inherited by a using declaration\n\
    \  - no private or protected non-static data members\n  - no virtual functions\n\
    \  - no virtual, private, or protected base classes\n\nTo be able to initialize\
    \ it is also required that no private or protected base class members or constructors\
    \ are used during initialization.\n\n```\nC++17 introduces a *new type trait*\
    \ `is_aggregate<>` to test, whether a type is an aggregate:\n```cpp\ntemplate<typename\
    \ T>\nstruct D : std::string, std::complex<T> {\n    std::string data;\n};\nD<float>\
    \ s{{\"hello\", {4,5,6}, \"world\"}; // OK since C++17\nstd::cout << std::is_aggregate<decltype(s)>::value;\
    \ // outputs: 1 (true)\n```\n```\n\n# 4.4 Backward Incompatibilities\n\nNote that\
    \ the following example no longer compiles:\n\n```\nlang/aggr4.cpp\nstruct Base\
    \ {\n    friend struct Derived {\n    private:\n    Base() {\n    }\n};\n\nstruct\
    \ Derived : Base {\n};\n\nint main() {\n    Derived d1{}; // ERROR since C++17\n\
    ```"
