  md: "# Chapter 4\n\n# Aggregate Extensions\n\nOne way to initialize objects in C++\
    \ is **aggregate initialization**, which allows the initialization of an aggregate'\
    \ from multiple values with curly braces:\n\n```\nstruct Data {\n  std::string\
    \ name;\n  double value;\n};\n```\n\nData x(\"test1\", 6.78);\n\nSince C++17,\
    \ aggregates can have base classes, so that for such structures they are derived\
    \ from other classes/structures list initialization is allowed:\n\n```\nstruct\
    \ MoreData : Data {\n  bool done;\n};\n```\n\nMoreData y({\"test1\", 6.78, false});\n\
    \nAs you see, aggregate initialization now supports nested braces to pass values\
    \ to the derived members of the base class.\n\nAnd as initialization of subobjects\
    \ with members, you can skip the nested braces if a base type or subobject only\
    \ gets one value:\n\n```\nMoreData y({\"test1\", 6.78, false});\n```\n\n> ¹ Aggregates\
    \ are either arrays or simple, C-like classes that have no user-provided constructors,\
    \ private or protected non-static data members, no virtual functions, and before\
    \ C++17 no base classes."
  merge: -1
