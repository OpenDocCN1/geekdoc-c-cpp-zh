  md: "# 10.2 Using Compile-time\n\n}\n\nHowever, the condition for the compile-time\
    \ if the type is always constant and needs to be valid as a while, so that passing\
    \ a type that doesn't support <10 no longer compiles:\n\n```\nconstexpr auto x2\
    \ = bar(\"hi\"); //compile-time ERROR\n```\n\nSo, compile-if does not short-circuit\
    \ the instantiation. If the validity of compile-time conditions depend on earlier\
    \ compile-time conditions, you have to done as in foo(). As another example, you\
    \ have to write:\n\n```\nif constexpr (std::is_same_v<MyType, T>) {\n    if constexpr\
    \ (T::i == 42) {\n    }\n}\n```\n\ninstead of:\n\n```\nif constexpr (std::is_same_v<MyType,\
    \ T> && T::i == 42) {\n\n}\n```\n\n# 10.2.2 Other Compile-time if Examples\n\n\
    # Perfect Return of a Generic Value\n\nOne application of compile-time if is the\
    \ perfect forwarding of return values, when they have to get processed before\
    \ they can be returned. Because decltype(auto) can't be used for void (because\
    \ void is an incomplete type), you have to write something like the following:\n\
    \n```\ntmpl/perfectreturn.hpp\n```\n\n```\n#include <functional> // for std::forward()\n\
    #include <type_traits>\n#include <utility> // for std::is_same<> and std::invoke_result<\n\
    ```\n\n```\ntemplate<typename Callable, typename... Args>\ndecltype(auto) call(Callable\
    \ op, Args&&... args)\n{\n    if constexpr (std::is_void_v<std::invoke_result_t<Callable,\
    \ Args...>>) {\n        // return type is void\n        op(std::forward<Args>(args)...);\n\
    \        // do something before we return\n    }\n    return;\n}\n```\n\n> 3 For\
    \ the discussion about this example, see:\nhttps://groups.google.com/a/isocpp/forum/#!nsg/std-proposals/eIBOIynhrM/Y_iPP6aNBGAJ"
