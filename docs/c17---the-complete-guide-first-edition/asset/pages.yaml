  md: "# 16.3 std::variant<> Types and Operations\n\n# 16.3.4 Valueless by Exception\n\
    \nModifying a variant that gets a new value and this modification throws an exception,\
    \ the variant can get into a very special state: The variant already lost its\
    \ old value, but didn't get its new value. For example:\n\n```\nstruct S {\n \
    \ operator int() { throw \"EXCEPTION\"; } // any conversion to int throws\n};\n\
    \n```\n\n```\nstd::variant<double, int> var(12.2); // initialized as double\n\
    var.emplace<1>(S{}); // OPS: throws while set as int\n```\n\nIf this happens,\
    \ then:\n\n+   * var.valueless_by_exception() returns true\n* var.index() returns\
    \ std::variant_npos\nwhich signals that the variant holds no value at all.\nThe\
    \ guarantees are as follows:\n\n+   * If emplace() throws valueless_by_exception\
    \ is always true.\n* If operator() throws and the modification would not change\
    \ the alternative valueless_by_exception() and index() keeps its old state. The\
    \ state of the value depends on the exception guarantees of the value type.\n\
    * If operator() throws and the new value would set a different alternative, the\
    \ variant might hold no value (valueless_by_exception() might become true). This\
    \ depends on exactly when the exception gets thrown. If it happens during a type\
    \ conversion before the actual modification of the value started, the variant\
    \ will still hold its old value.\n\nUsually, this behavior should be no problem,\
    \ you no longer use the variant you tried to modify. If you want to use a variant\
    \ although using it caused an exception, you should better check its state.\n\n\
    ```\nstd::variant<double, int> var(12.2); // initialized as double\n```\n\n```\n\
    try {\n  var.emplace<1>(S{}); // OPS: throws while set as int\n}\ncatch (...)\
    \ {\n  if (!var.valueless_by_exception()) {\n    ...\n  }\n}\n```"
