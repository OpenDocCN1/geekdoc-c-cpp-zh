  md: '# Chapter 17


    # std::any


    In general, C++ is a language with type binding and type safety. Value objects
    are declared to have a specific type, which defines what operations are possible
    and how they behave. And the value objects can''t change their type.


    std::any is a value type that is able to change its type, while still having type
    safety. That is, objects can hold values of any arbitrary type but they know which
    type the value currently hold. There is no need to specify the possible types
    when declaring an object of this type.


    The trick is that objects contain both the contained value and the type of the
    contained value using typeid. Because the value can have any size the memory must
    be allocated on the heap. However, implementations should avoid using the use
    of heap memory for small values, such as int.


    If you assign a std::any, the object allocates memory for the value and copies
    the string, while also storing a string that was assigned. Later, run-time checks
    can be done to find out what the current value is and to use it as any type std::any_cast<T>
    is necessary.


    As for std::optional<T> and std::any, the objects have value semantics. That is,
    copying happens deeply by creating an independent object with the current contained
    value and its type in its own memory. Because heap memory is involved, copying
    std::any usually is expensive and you need to pass objects by reference or move
    values. Move semantics is partially supported.


    # 17.1 Using std::any


    The following example demonstrates the core abilities of std::any:


    ```

    std::any a; // a is empty

    std::any b = 4.3; // b has value 4.3 of type double

    a = 42; // a has value 42 of type int

    b = std::string("hi"); // b has value "hi" of type std::string


    if (a.type() == typeid(std::string)) {

    n

    ```'
