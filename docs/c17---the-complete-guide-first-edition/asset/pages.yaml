    \ collect all filesystem paths in the directory given as command-line argument:\n\
    \n```\nstd::filesystem::path root(argv[1]);\n\nstd::vector<std::filesystem::path>\
    \ paths;\nstd::filesystem::recursive_directory_iterator dirpos(root);\nstd::copy(begin(dirpos),\
    \ end(dirpos), std::back_inserter(paths));\n```\n\nNote that we might pass an\
    \ invalid path, possible (filesystem) exceptions are caught.\n\nThen, we iterate\
    \ over a collection of the filesystem paths to accumulate their sizes if they\
    \ are regular files:\n\n```\nauto sz = std::transform_reduce(\n    std::execution::par,\
    \ // parallel execution\n    paths.begin(), paths.cend(), // range\n    std::uintmax_t{0},\
    \ // initial value\n    std::plus<>{}, // accumulate\n    [](const std::filesystem::path&\
    \ p) { // file size if regular file\n        return is_regular_file(p) ? file_size(p)\
    \ : std::uintmax_t{0};\n    }\n);\n```\n\nThe new standard algorithm transform_reduce()\
    \ operates as follows:\n\n+   * The last argument is added to each element. passed\
    \ lambda is called for each path element and queries its size if it is a regular\
    \ file.\n* The second last argument is the operation that combines all the sizes.\
    \ We want to accumulate the sizes if we use the standard function std::plus<>.\n\
    * The third last argument is the initial value for the operation that combines\
    \ all the sizes. Thus, if the list of paths exists, we start with 0. We use the\
    \ same type the return value of file_size(), std::uintmax_t;\n\nNote that asking\
    \ for the size of a path is a pretty operation, because it requires an operating\
    \ system call. For this reason it pays off to use algorithms that this transformation\
    \ (from path to size) parallel with multiple threads in order and computes the\
    \ sum. First measurements demonstrate a clean win (up to doubling the speed of\
    \ the program).\n\nNote that you can't pass the paths to the directory iterator\
