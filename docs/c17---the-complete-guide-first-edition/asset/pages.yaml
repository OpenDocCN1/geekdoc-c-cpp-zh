  md: '# 20.2 Principles and Terminology


    # 20.2.4 Normalization


    A path might be get or normalized. In a normalized path:


    +   * Filenames are separated by only a single preferred directory separator.

    * The filename ". is not used when the whole path is nothing but ". (representing
    the current directory).

    * The filename does not contain ". ." filenames (we don''t go down and then up
    again) unless they are at the beginning of a path.

    * The path only ends with a directory separator if the trailing filename is a
    directory with a name other than ".." or \.".


    Note that normalization means that a path ending with a directory is different
    from a filename not ending with a separator. The reason is that on some operating
    systems the behavior differs when it is known as a directory (e.g., with a trailing
    separator symbolic links get resolved).


    Path Normalization lists some examples for normalization on POSIX and Windows
    systems. Note that on POSIX system C:bar and C: just filenames and have no special
    meaning to a partition as on Windows.


    | Path | POSIX normalized | Windows normalized |

    |---|---|---|

    | foo// /bar/.. | foo/ | foo/ |

    | //home/../foo.txt | /home/foo.txt | \host\foo.txt |

    | .f/../.f | .f | .f |

    | C:bar/.. | C: | C: |

    | C:/bar/.. | C: | C: |

    | C:\bar\.. | C:\ | C:\ |

    | /../data.txt | /data.txt | \data.txt |


    Table 20.1. Effect of Path Normalization


    Note that the C:bar.. remains the same when being normalized on a POSIX-based
    system. The reason is that the backslash is no directory separator so that the
    whole path is just one filename having a colon, two backslashes, and two dots
    as part of its name.


    The filesystem provides function for both lexical normalization (not taking the
    filesystem into account) and filesystem-dependent normalization.


    # 20.2.5 Member versus Free-Standing Functions


    The filesystem library provides several functions, which can be both member and
    free-standing functions. The general approach is:


    +   * Member functions are cheap. The reason is that they are pure lexical operations
    that do not take the actual filesystem into account, so that no operating systems
    calls are necessary.'
