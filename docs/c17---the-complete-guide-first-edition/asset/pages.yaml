  md: '# 20.5 Iterating Directories


    Directory entries contain both a path object and additional attributes such as
    hard link count, file status, size, last write time, whether it is a symbolic
    link, and where it refers to if it.


    Note that the iterators are input iterators. The reason is that iterating over
    a directory might result in different results at any time directory entries change.
    This has to be taken into account when using directory iterators in parallel algorithms.

    Directory Operations lists the operations you can call for a directory entry e.
    They are more or less the operations you can call to query file attributes, get
    the file status check permissions, and compare the paths.


    | Call | Effect |

    | e.path() | yields the filesystem path for the current entry |

    | e.exists() | yields whether the file exists |

    | e.is_regular_file() | yields whether the file exists and is a regular file |

    | e.is_directory() | yields whether the file exists and is a directory |

    | e.is_symlink() | yields whether the file exists and is a symbolic link |

    | e.is_other() | yields whether the file exists and is neither a directory nor
    a symbolic link |

    | e.is_block_file() | yields whether the file exists and is a block file |

    | e.is_character_file() | yields whether the file exists and is a character file
    |

    | e.is_fifo() | yields whether the file exists and is FIFO or pipe |

    | e.socket() | yields whether the file exists and is a socket |

    | e.file_size() | yields the size of a file |

    | e.hard_link_count() | yields the number of hard links |

    | e.last_write_time() | yields the timestamp of the last write to a file |

    | e.status() | yields the status of the file |

    | e.symlink_status() | yields the file status (following symbolic links) |

    | e1 = e2 | yields whether the two paths are equal |

    | e1 != e2 | yields whether the two paths are not equal |

    | e1 < e2 | yields whether an path is less than another |

    | e1 <= e2 | yields whether an path is less or equal than another |

    | e1 >= e2 | yields whether an path is greater or equal than another |

    | e1 > e2 | yields whether an path is greater than another |

    | e.assign(p) | replaces the path of e by p and updates all entry entries |

    | e.replace_filename(p) | replaces the filename of the current path of e by p
    and updates all entry entries |

    | e.refresh() | updates all cached attributes for this entry |


    Table 20.22 Directory Entry Operations


    assign() and replace_filename() call the corresponding modifying path operations
    but do not modify the files in the underlying filesystem.'
