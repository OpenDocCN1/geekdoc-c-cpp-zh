    operations take the filesystem into account and are free-standing functions.


    The function for the filesize type matches with the corresponding file_type values.
    However, note that function except is_symlink() also follow symbolic link. That
    is, for a symbolic link to a directory is_symlink() and is_directory() yield true.


    Note also for all files that are special files (no regular file, no directory,
    no symbolic link) is_other() also yields true according to the definition of other
    file types.


    For implementation-specific file types there is no specific convenience function
    so for them only is_other() is true (and is_symlink() if we a symbolic link to
    such a file). You can use the file status API to check against these specific
    types.


