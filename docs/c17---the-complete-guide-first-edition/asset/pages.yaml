    # 25.2 Node Handles


    By the ability to splice node out of an associative or unordered container, you
    can easily:


    +   - Modify keys or (unordered) maps or values or (unordered) sets,

    - Use move semantics in (unordered) sets and maps, and

    - Move elements between (unordered) sets and maps.

    - For example, after defining and initializing a map as:

    std::map<int, std::string> m{{1, "mango"}, {2, "papaya"}, {3, "guava"}};


    You can modify the element with the key 2 as:


    ```

    auto nh = m.extract(2); // nh has decltype(m)::node_type

    nh.key() = 4;

    m.insert(std::move(nh));

    ```


    The code takes the node for the element with the key 2 out of the container, modifies
    the key, and moves it back as described in Figure 25.1.

    Note that no memory (deallocation) is used and that pointers and references to
    the element remain valid. However, using the pointers and references while the
    element is in the node handler results in undefined behavior.

    The type of a node is container::node_type. It provides members


    +   - member value() for all (unordered) set types

    - member key() and mapped() for all (unordered) map types


    You can use node handles to move elements from a container to another. The containers
    can differ even in the following way:


    +   - one supports duplicates while another doesn''t (e.g., you can move elements
    from a multimap to a map)

    - comparison functions and hash functions might differ'
