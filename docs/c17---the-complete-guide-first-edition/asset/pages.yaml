    # 20.2 Principles and Terminology


    Before discussing the details of the filesystem library we have to introduce a
    couple of design principles and terminology. This is necessary because the standards
    cover different operating systems and maps them to a common API.


    # 20.2.1 General Portability Disclaimer


    The C++ standard does not standardize all possible operating systems have in common
    for their file systems. In many cases, it follows POSIX standards and the C++
    requests to follow POSIX as long as is possible the behavior still be there with
    some limitations. If no reasonable behavior is possible, an implementation shall
    report an error.

    Possible examples of such errors are:


    +   * Characters are used for filenames

    * File elements are created that are not supported (e.g., symbolic links)

    Still the differences of specific file systems may matter:

    * Case sensitivity:

    * "hello.txt" and "Hello.txt" might refer to the same (Windows) or three different
    files (POSIX-based).

    * Absolute relative paths:

    * On systems "/bin is an absolute path (POSIX-based), while on others it is not
    (Windows).


    # 20.2.2 Namespace


    The filesystem library has its own sub-namespace filesystem inside std. It is
    a pretty common convention to introduce the shortcut fs for:

    ```cpp

    amespace fs = std::filesystem;

    ```

    For this, example to use fs::current_path() instead of std::filesystem::current_path().

    Further examples of this chapter will use fs as the corresponding shortcut.

    Note that notifying filesystem calls sometimes results in unintended behavior.


    # 20.2.3 Paths


    The key element of the filesystem is a path. It is a name that represents the
    (potential) location of a file within a system. It consists of an optional root
    name, an optional root directory, and a sequence of filenames by directory separators.
    The path can be relative (so that the location depends on the current working
    directory) or absolute.

    Different formats are possible:


    +   * A generic format, which is portable

    * A native format, which is specific to the underlying file system'
