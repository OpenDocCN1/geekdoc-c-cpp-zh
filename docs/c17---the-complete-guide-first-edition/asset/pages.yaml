  md: '# Chapter 15


    # std::optional<>


    In programming often we have the case that we might return/pass/use an object
    of a certain type. That is, we could have a value of a certain type or we might
    not have any value at all. Thus, we need a way to simulate semantics similar to
    pointers, where we can express as no value using nullptr. The way to handle this
    is to define an object of a certain type with an additional Boolean member/flag
    signaling whether a value exists. std::optional<> provides such objects in a type-safe
    way.


    Optional objects simply have internal memory for the contained objects plus a
    Boolean flag. Thus, the size usually is one byte larger than the contained object.
    For some contained types, there might be no size overhead at all, provided the
    additional information can be placed inside the contained object. No heap memory
    is allocated. The objects use the same alignment as the contained type.


    However, optional objects are not just structures adding the functionality of
    a Boolean flag to a value member. For example if it has no value the constructor
    is called for the contained type (thus, you can get a value default state that
    does have one).


    As std::variant<> and std::any the resulting objects have value semantics. That
    is, copying is implemented as a deep copy creating an independent object with
    the flag and the contained value if in its own memory. Copying a std::optional<>
    without a contained value is cheap. Copying a std::optional<> with a contained
    value is as cheap/expensive as copying the contained type/value. Move semantics
    are supported.


    # 15.1 Using std::optional<>


    std::optional<> model a nullable instance of an arbitrary type. The instance might
    be a member, an argument, or a return value. You could also argue that a std::optional<>
    is a container for zero or one element.'
