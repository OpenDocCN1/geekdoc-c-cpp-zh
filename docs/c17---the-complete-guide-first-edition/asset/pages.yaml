  md: '# 8.2 Defined Expression Evaluation Order


    Many code bases and C++ books contain code that looks valid according to intuitive
    assumptions, strictly speaking have undefined behavior. One example is finding
    and replacing multiple substrings in a string:


    ```

    std::string s = "I hear it even if you don''t believe";

    s.replace(0,8,"even").replace(s.find("even"),4,"sometimes")

    s.replace(s.find("you don''t"),9,"I");

    ```


    The usual assumption is that I believe replacing the first 8 characters by nothing.
    "even" by "sometimes", and "you don''t" by "I" so that we get:


    it works if I believe


    However, before C++17, this is not guaranteed, because the find() calls, returning
    to start with a replacement, which might be performed at any time while the statement
    gets processed and their result is needed. In fact all find() calls, computing
    the starting index of the replacements, might be processed before any of the replacements
    happens, so that the resulting string becomes:


    it sometimes works if I believe


    But others are also possible:


    it worksDon''t believe

    it even worsetimesIdDon''t believe

    it even worsetimesfyouIllBelieve


    As another example, consider using the output operator to print values computed
    by expressions that depend on each other:


    ```

    std::cout << f() << g() << h();

    ```


    The usual assumption is that f() is called before g() and both are called before
    h(). However, this assumption is wrong. f(), g(), and h() might be called in any
    order, which might have surprising or even nasty effects when they depend on each
    other.


    As a concrete example, up to C++17 the following code has undefined behavior:


    ```

    i = 0;

    std::cout << ++i << --i << " \n";

    ```


    Before C++17, it might print 1 0; but it might also print 0 -1 or even 0 0. It
    doesn''t matter whether i is int or a user-defined type (for fundamental types,
    some compilers at least warn about this problem).


    > 1 A similar example is part of the motivation in the paper proposing the new
    feature with the comment code has been reviewed by C++ experts world-wide, and
    published (The C++ Programming Language, 4th edition.)'
