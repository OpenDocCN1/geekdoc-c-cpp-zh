  md: "# Chapter 5: Mandatory Copy Elision or Passing Unmaterialized Objects\n\n+\
    \   - All temporaries (especially objects returned by value) are prvalues.\n-\
    \ The result of std::move() is an xvalue.\n\nFor example:\n\n```\nclass X {\n\
    \  X v;\n}\nconst X c;\n```\n\n```\nvoid f(const X& k); // accepts an expression\
    \ of any value category\nvoid f(X&& k); // accepts prvalues and xvalues only\n\
    ```\n\nIt's worth emphasizing that strictly speaking glvalues, prvalues, and xvalues\
    \ are terms for expressions and not for values (which means these terms are misnomers).\
    \ For example, a variable itself is not an lvalue, unless an expression denoting\
    \ the value is an lvalue:\n\n```\nint x = 3; // x is a variable, not an lvalue\n\
    int y = x; // x is an lvalue\n```\n\nIn the first statement 3 is a prvalue initializing\
    \ the variable (the lvalue) x. In the second statement x is an lvalue (its evaluation\
    \ designates an object containing the value 3). The lvalue is converted to a prvalue,\
    \ which is what initializes the variable y.\n\n# 5.3.2 Value Categories C++17\n\
    \nC++17 didn't change these value categories but clarified their semantic meaning\
    \ (as described in Figure 5.2).\n\n![](img/3f232898efb332044c9335ea515fdd0f_61_0.png)"
