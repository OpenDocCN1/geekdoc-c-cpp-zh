  md: '# # Preface


    This book is an experiment in two ways:

    * I write a book deeply covering language features without the direct help of
    a core language expert as a co-author. I can ask and I do.

    * I publish the book myself on Leanpub. This, this book is written step-by-step
    and I will publish new versions as soon as there is a significant improvement
    worth to publish it as a new version.


    The good thing is:

    * You get the view on the language features from an experienced application programmer.
    Somebody who feel the pain a feature cause, and ask the relevant questions to
    be able to motivate and explain the design and its consequences for programming
    practice.

    * You can benefit from my experience on C++17 while I still learn and write.


    But, you are part of the experiment. So help me: Give feedback about flaws, errors,
    badly explained features, or gaps that we all can benefit from these improvements.


    # # Versions of This Book


    Because this book is incrementally written, here is the history of its "releases"
    (newest first):

    * 2019-02-14: accumulate() reduce() transform().

    * 2019-02-12: for_each(n) algorithm.

    * 2019-02-12: sample() algorithm.

    * 2019-02-11: clamp() utility function.

    * 2019-02-03: Execution policies and list of parallel algorithms.

    * 2019-02-02: Document round-trip support of to_chars() and from_chars().

    * 2019-01-11: New examples with performance measurements on parallel algorithms.

    * 2018-12-26: Polymorphism with std::variant<>..

    * 2018-12-25: Using std::tie() for structured bindings.

    * 2018-12-24: Describe Boyer-Moore-(Horspool) Searchers.'
  merge: -1
