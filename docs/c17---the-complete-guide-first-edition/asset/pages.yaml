  md: "# # Chapter 18\n# std::byte\n\nPrograms hold data in memory. std::byte C++17\
    \ introduces a type for it, which does represent the “natural” type of the elements\
    \ of memory. The key difference to types like char or int is that this type cannot\
    \ (easily) (abused) as an integral value or character type. For cases, where numeric\
    \ computing or character sequence are not the goal, this results in more type\
    \ safety. The only “computing” operations supported are bit-wise.\n\n# ## 18.1\
    \ Using std::byte\n\nThe following example demonstrates the core abilities of\
    \ std::byte:\n\n```\n#include <cstddef> // for std::byte\n\nstd::byte b1{0x3F};\n\
    std::byte b2{0b11110000};\n\nstd::byte b3[4]{b1, b2, std::byte{1}}; // 4 bytes\
    \ (last is 0)\n\nif (b1 == b3[0]) {\n    b1 <<= 1;\n}\n\nstd::cout << std::to_integer<int>(b1)\
    \ << '\\n'; // outputs: 126\n```\n\nHere, we define two bytes with different initial\
    \ values. b2 is initialized using two features available since C++14:\n\n+   -\
    \ Prefix 0b enables binary literals.\n- The digit *separator* allows making numeric\
    \ literals more readable in source code (it can be placed between any two digits\
    \ of numeric literals)."
