    \ value initialized inside an if statement is valid until the end of the then\
    \ and the else part (if any).\nFor example:\n\n```\n```cpp\\if (std::ostream strm\
    \ = getLogStrm(); coll.empty()) {\n    strm << \"no data\\n\";\n} else {\n   \
    \ for (const auto& elem : coll) {\n        strm << elem << '\\n';\n    }\n}\n\
    // strm no longer declaredn```\n```\n\nThe destructor for strm is called at the\
    \ end of the then-part or at the end of the else-part.\nAnother example would\
    \ be the use of lock while performing some tasks depending on a condition:"
