  md: "# 26.2 is_always_lock_free() for Atoms\n\n# 26.1.2 std::shared_mutex\n\nC++14\
    \ added a shared_timed_mutex to support read/write locks, where multiple threads\
    \ concurrently read a value, from time to time to update the value. Because some\
    \ platforms mutexes that do not support locks can be implemented more efficiently,\
    \ now the type shared_mutex was introduced (as std::mutex exists base std::timed_mutex\
    \ since C++11). shared_mutex is defined in header <shared_mutex> and supports\
    \ the following operations:\n\n+   * for exclusive: lock(), try_lock(), unlock()\n\
    * for shared read-access: lock_shared(), try_lock_shared(), unlock_shared()\n\
    * for native: handle()\n\nThat is, shared_times_mutex it doesn't support try_lock(),\
    \ try_lock_until(), try_lock_shared(), and try_lock_shared_until().\n\n# Using\
    \ a shared_mutex\n\nThe way to use a shared_mutex is as follows: Assume you have\
    \ a shared vector, which is usually read by multiple threads, from time to time\
    \ to modify\n\n```\n#include <shared_mutex>\n#include <mutex>\n```\n\n```\nstd::vector<double>\
    \ v; // shared resource\nstd::shared_mutex mutex; // control access to v (shared_timed_mutex\
    \ in C++14)\n```\n\nTo have read-access (so that multiple readers do not block\
    \ each other), you use a shared_lock, which is a lock guard for shared read read\
    \ access (introduced with C++14). For example:\n\n```\nif (std::shared_lock sl(mutex);\
    \ v.size() > 0) {\n    // (shared) read access to the elements of v\n}\n```\n\n\
    Only for an exclusive write you use an exclusive lock guard, which might be a\
    \ simple lock_guard or scoped_lock (as just introduced) or a sophisticated unique_lock.\
    \ For example:\n\n```\n{\n    std::scoped_lock sl(mutex);\n    // exclusive write\
    \ read access to the vector v\n}\n```\n\n# 26.2 is_always_lock_free() for Atoms\n\
    \nYou can now check with a C++ library feature whether an atomic type can always\
    \ be without locks. For example:\n\n```\nif constexpr(std::atomic<int>::is_always_lock_free)\
    \ {\n  ...\n```"
