  md: "# 27.1 Using Standard Memory Resources\n\n```\n-- check with 2000 elements:\n\
    \ 1 allocations for 300000 bytes\n-- check with 3000 elements:\n 2 allocations\
    \ for 750000 bytes\n-- check with 50000 elements:\n 8 allocations for 14777448\
    \ bytes\n-- check with 1000 elements:\n 0 allocations for 0 bytes\n```\n\nEach\
    \ time the 200000 bytes are enough we need no additional allocation (here, it\
    \ is the case for to 1000 elements). The 20000 bytes are used and available then\
    \ for the next iteration when the memory pool gets destroyed.\n\nEach time the\
    \ memory gets exceeded, the pool allocates additional memory on the heap, which\
    \ is deallocated when the memory pool gets destroyed.\n\nThis way you can easily\
    \ manage memory pools, where you allocate memory (either on the stack or on the\
    \ heap) and reuse it with every new task (service request, event, data file to\
    \ process, and so on).\n\nWe will discuss more sophisticated resources for memory\
    \ pools later on.\n\n# 27.1.2 Standard Memory Resources\n\nTo support polymorphic\
    \ allocators, the C++ standard library provides the memory resource listed in\
    \ Standard Memory Resources.\n\n| Memory Resource | Behavior |\n|---|---|\n| new_delete_resource()\
    \ | yields a pointer to a memory resource calling new and delete |\n| synchronized_pool_resource\
    \ | class to create memory resources with little fragmentation, thread-safe |\n\
    | unsynchronized_pool_resource | class to create memory resources with little\
    \ fragmentation, not thread-safe |\n| monotonic_buffer_resource | class to create\
    \ memory resources that never deallocates, optionally using a passed buffer, not\
    \ thread-safe |\n| null_memory_resource() | yields a pointer to a memory resource\
    \ where allocation fails |\n\nTable 27.1. Standard Memory Resources\n\nnew_delete_resource()\
    \ and null_memory_resource() are functions that return the pointer to a global\
    \ memory resource. which is defined as a singleton. The other three memory resources\
    \ are classes, where you have create objects and pass pointers to these objects\
    \ to the polymorphic allocators. Use some examples:\n\n```\nstd::pmr::string s(\"\
    my string\", std::pmr::new_delete_resource());\n```"
