  md: "326\n\nChapter 27: Polymorphic Memory Resources (PMR)\n\nThen, we have to specify\
    \ this type supports polymorphic allocators, which is simply done by providing\
    \ a correct declaration of type allocator_type:\n\n```\nusing allocator_type =\
    \ std::pmr::polymorphic_allocator<char>;\n```\n\nThe type passed to the polymorphic_allocator\
    \ doesn't matter (when it is used as the allocator) to rebound to the necessary\
    \ type). You could, for example, use std::byte.4 Alternatively, you can also use\
    \ the allocator_type of the string:\n\n```\nusing allocator_type = decltype(name)::allocator_type;\n\
    ```\n\nNext we define the user constructor(s) with an additional optional allocator\
    \ parameter:\n\n```\nPmrCustomer(std::pmr::string n, allocator_type alloc = {})\n\
    \    name(std::move(n), alloc);\n```\n\nYou might think about declaring constructors\
    \ like this as explicit. If at least you have a default constructor, you should\
    \ do so to avoid implicit conversions from an allocator to a customer:\n\n```\n\
    explicit PmrCustomer(allocator_type alloc = {})\n    name{alloc};\n```\n\nThen,\
    \ we have to provide the copy and move operations that are for a specific allocator.\
    \ This is the main interface of PmrCustomer to ensure that their elements are\
    \ used the allocator of:\n\n```\nPmrCustomer(const PmrCustomer& c, allocator_type\
    \ alloc)\n    : name(c.name, alloc);\nPmrCustomer(PmrCustomer&& c, allocator_type\
    \ alloc)\n    : name(std::move(c.name), alloc);\n```\n\nNote that both are not\
    \ except, because even the move constructor might have to copy a pasted if the\
    \ required allocator is not interchangeable.\n\nFinally, we implement the necessary\
    \ setters and getters, which are usually:\n\n```\nvoid setName(std::pmr::string\
    \ s)\n    name = std::move(s);\nstd::pmr::string getName() const\n    return name;\n\
    ```\n\nThere is another getter, getNameAsString(std::string), which we provide\
    \ to cheaply reap the name as std::string. We will discuss it later. For the moment,\
    \ you could also leave it out.\n\n> 4 https://wg21.link/p0339r proposed to also\
    \ allow specifying polymorphic_allocator<void> or just polymorphic_allocator<>\
    \ here, but that was rejected."
