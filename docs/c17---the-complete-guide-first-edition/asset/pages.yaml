  md: '# Requesting an Alignment in the new expression


    If you pass the alignment in the new expression, the passed alignment argument
    is always passed and has to be supported by the operator new(). In fact, alignment
    handlers are handled by any other alignment argument you can pass to new expressions:
    they are passed as they are an additional parameter to operator new().


    Thus, such as:


    ```

    std::string* p = new(std::align_val_t<64>) std::string; // 64-bytes aligned

    will always try to call:

    ```


    ```

    operator new(std::align_val_t)

    ```


    A size-only overload would not serve as a fallback here.

    If you have a specific request for an over-aligned type, the behavior is even
    more interesting. For example, if you:


    ```

    MyType32* p = new(std::align_val_t<64>) MyType32();

    and MyType32 is over-aligned, the compiler first tries to call

    ```


    ```

    operator new(std::size_t, std::align_val_t, std::align_val_t)

    with 32 as the second argument (the general over-alignment of the type) and 64
    as third argument (the requested alignment). Only as a fallback,

    ```


    ```

    operator new(std::size_t, std::align_val_t)

    is called with 64 as the requested alignment. In principle, you could provide
    an overload for the three arguments to implement specific behavior when over-aligned
    data, a specific alignment is requested.

    ```


    Again note that if you need special allocation functions for over-aligned data,
    you have to call the right location function when passing the alignment in the
    new expression:


    ```

    std::string* p1 = new(std::align_val_t<64>) std::string();

    MyType32* p2 = new(std::align_val_t<64>) MyType32();

    ```


    ```

    ::operator delete(p2, ptr, std::align_val_t<64>); // //!

    MyType32::operator delete(p1, ptr, std::align_val_t<64>); // //!

    ```


    This means that the expressions in this example will call


    ```

    operator new(std::size_t size, std::align_val_t align);

    while the delete expressions will call one of the following two for default-aligned
    data:

    ```


    ```

    operator delete(void* ptr, std::align_val_t align);

    operator delete(void* ptr, std::size_t size, std::align_val_t align);

    ```


    and one of the following functions for over-aligned data:


    ```

    operator delete(void* ptr, std::align_val_t typealign, std::align_val_t align);

    operator delete(void* ptr, std::size_t size, std::align_val_t typealign,

    std::align_val_t align);

    ```'
