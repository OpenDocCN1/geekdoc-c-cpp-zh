  md: '# 1.1 Structured Bindings in Detail


    the values of e.i and e.s, which are copies of ms.i and ms.s.


    e exists as long as the structured bindings to exist. it is destroyed when the
    structured bindings go out of scope.


    As a consequence, unless references are used, modifying the value used for initialization
    has no effect on the names initialized by a structured binding (and vice versa):


    ```

    MyStruct ms(42,"hello");

    auto [u,v] = ms;

    ms.i = 77;

    std::cout << u; // prints 42

    u = 99;

    std::cout << ms.i; // prints 77

    ```


    u and ms.i also have different addresses.

    When structured bindings return return values, the same principle applies. An
    initialization as such


    ```

    auto [u,v] = getStruct();

    ```


    behaves as if we initialize a new entity e with the return value of getStruct()
    so that the structured bindings u and v alias names for the two members/elements
    of e, similar to defining:


    ```

    auto e = getStruct();

    aliasname u = e.i;

    aliasname v = e.s;

    ```


    That is, structured bindings bind to a new entity, which is initialized from a
    return value, instead of binding to the return value directly.


    To the anonymous entity e usual address and alignment guarantee apply, so that
    the structured bindings are aligned the corresponding members they bind to.


    ```

    auto [u,v] = ms;

    assert(&((MyStruct*)ku)->s == kv); // OK

    ```


    Here, ((MyStruct*)ku) yields a pointer to the anonymous entity as a whole.


    # Using Qualifiers


    We can use qualifiers, const and references. Again, these qualifiers apply to
    the anonymous entity e as a whole. Usually, the effect is the same as applying
    the qualifiers to the structured bindings directly, but by this is not always
    the case (see below).


    For example, we can declare structured bindings to a const reference:


    ```

    const auto &[u,v] = ms; // a reference, so that u/ refers to ms.i/ms.s

    ```


    Here, the anonymous entity is declared as a const reference, which means that
    u and v are the members of i and v of the initialized const reference to ms. As
    a consequence, any change to the members of ms affect the value of u and/or v.


    ```

    ms.i = 77; // affects the value of u

    std::cout << u; // prints 77

    ```'
