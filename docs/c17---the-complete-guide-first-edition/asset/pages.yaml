  md: "# Chapter 3: Inline Variables\n\nAccording to the **one definition rule** (ODR),\
    \ a variable or entity had to be defined in exactly one translation unit.\n\n\
    Even preprocessor guards do not help:\n\n```\n#ifndef MY_HEADER_HPP\n#define MY_HEADER_HPP\n\
    \nclass MyClass {\n    static std::string name; // OK\n};\nMyClass.name = \"\"\
    ;      // Link ERROR if included by multiple CPP files\n\n#endif\n```\n\nThe problem\
    \ is not that the header file might be included multiple times, the problem is\
    \ that two different CPP files include the header so that both define MyClass.name.\n\
    \nFor the same reason, you get a link error if you define an object of your class\
    \ in a header file:\n\n```\nclass MyClass {\n    ...\n};\nMyClass myGlobalObject;\
    \ // Link ERROR if included by multiple CPP files\n```\n\n# Workarounds\n\nFor\
    \ some cases, there are workarounds:\n\n+   - You can initialize static const\
    \ data members in a class/struct:\nclass MyClass {\n    static const bool trace\
    \ = false;\n};\n- You can define an inline function returning a static local variable:\n\
    inline std::string getName() {\n    static std::string name = \"initial value\"\
    ;\n    return name;\n}\n- You can define a static member function returning the\
    \ value:\nstd::string getGlobalObject() {\n    static std::string myGlobalObject\
    \ = \"initial value\";\n    return myGlobalObject;\n}\n- You can use variable\
    \ templates (since C++14):"
