    diff: 105216

    diff: 128

    diff: 128

    diff: 128

    diff: 128

    diff: 128

    ```


    As you can see, the elements are now located close to each other. Still, they
    are not located in one chunk of memory. When the pool finds out the first chunk
    is not enough for all elements, it allocates more memory for even elements. The
    more we allocate, the larger the chunks of memory are so more elements close to
    each other. The details of this are implementation-defined.


    Of course, output is special because we create the elements in the order they
    are sorted inside the container. Thus, in practice, if you create object with
    random values, the elements will not be located one after the other (in different
    chunks of memory). However, they are still located close to each other and is
    important for good performance when dealing with the elements of this container.


    Also note that we don''t look at how memory for the element value is arranged.
    Here, usually the small string optimization causes for the elements we is not
    allocated. But as soon as we enrich our string values, the pool also tries to
    place them there. Note that the pool manages different chunks of memory for different
    allocated sizes. In general, the elements of the same string size are located
    close to each other.


    # monotonic_buffer_resource


    Class monotonic_buffer_resource also provides the ability to place all memory
    in chunks of memory. However, it has two other abilities:


    +   - You can pass a buffer to be used as memory. This, especially, can be memory
    allocated on the stack.

    - The memory resource never deallocates until the resource as a whole gets deallocated.


    That is, it is to avoid fragmentation. And it is so fast because deallocation
    is a no-op and you skip not to track allocated memory for further use. Whenever
    there is a request to allocate memory just return the next free piece of memory
    until all memory is exhausted.


    Note that objects are destroyed. Only their memory is not freed. If you delete
    objects, which usually deactivate their memory, the deallocation has no effect.'
