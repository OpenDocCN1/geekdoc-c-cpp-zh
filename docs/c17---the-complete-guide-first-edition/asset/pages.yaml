    # Chapter 20: The Filesystem Library


    POSIX-based operating systems there is not difference between the generic and
    the native format. On Windows the generic format /tmp/test.txt is a valid native
    format besides \tmp\test.txt, which is also supported (thus, /tmp/test.txt and
    \tmp\test.txt are two native versions of the same path). On OpenVMS the corresponding
    native format is [tmp]test.txt.


    Special filenames exist:


    +   * "." represents the current directory

    * ".." represents the parent directory


    The generic path format is as follows:


    ```

    [rootname][rootdir][relativepath]

    ```


    +   :

    * The optional root name is implementation specification (e.g., it can be //host
    on POSIX systems and C: on Windows systems)

    * The optional root directory is a directory separator

    * The relative path is a sequence of file names separated by directory separators


    By definition, a directory separator consists of one or multiple ''/'' or implementation-specific
    pre-ferred separator.


    Examples for portable generic paths are:


    ```

    //host1/bin/hello.txt


    tmp/

    a/b/../../../c

    ```


    Note that the last path refers to the same location as /a/c and is absolute on
    POSIX systems but relative on Windows systems (because the drive/partition is
    missing).


    On the other hand a path such as C:\bin is an absolute path on Windows systems
    (the root directory "bin" on the "C" drive/partition) but a relative path on POSIX
    (the subdirectory "bin" in the directory "C:").


    On Windows the backslash is the implementation directory separator so that the
    paths above can also be written by using the backslash as the preferred directory
    separator:


    ```

    \\host1\bin\hello.txt


    tmp\na\b\..\..\.

    ```


    The filesystem library provides function to convert paths between the native and
    generic format. This is not necessarily


    A path may be empty. This means there is no path defined. This is not necessarily
    the same as ".". What it means in the context.'
