  md: "# 27.3 Providing Memory Resources Support for Custom Types\n\npmr/pmrcustomer.hpp\n\
    \n```\n#include <string>\n#include <memory_resource>\n\n// a polymorphic allocator\
    \ type Customer\n// - the allocator is stored in the string member\nclass PmrCustomer\
    \ {\nprivate:\n    std::pmr::string name; // also used to store the allocator\n\
    public:\n    using allocator_type = std::pmr::polymorphic_allocator<char>;\n\n\
    \    // initializing constructor(n):\n    PmrCustomer(std::pmr::string n, allocator_type\
    \ alloc = {})\n        : name(std::move(n)), alloc(alloc) {}\n\n    // copy/move\
    \ allocators:\n    PmrCustomer(const PmrCustomer& c, allocator_type alloc)\n \
    \       : name(c.name), alloc(alloc) {}\n    PmrCustomer(PmrCustomer&& c, allocator_type\
    \ alloc)\n        : name(std::move(c.name)), alloc(alloc) {}\n\n    // setters/getters:\n\
    \    void setName(std::pmr::string s) {\n        name = std::move(s);\n    }\n\
    \    std::pmr::string getName() const {\n        return name;\n    }\n    std::pmr::string\
