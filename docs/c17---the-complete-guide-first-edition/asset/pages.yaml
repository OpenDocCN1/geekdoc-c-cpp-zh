  md: '# 27.4 Afternotes


    We might want to provide additional constructors, but the good thing with not
    providing them is that programmers are forced to implement the expensive conversion.
    In addition, if you overload for different types (std::string; std::pmr::string)
    you get additional ambiguities (e.g. taking a `string_view` or a string literal).


    After, we can only return one type (as we can''t overload on different types only).
    Thus, we can only provide one getter, which would usually return the "native"
    type of the API (here, std::pmr::string); and get the name as std::string; thus,
    we may gain an explicit without explicit conversion:


    ```

    PmrCustomer c4("Mr. Paul Kälkrenner"); // OK: allocates with default resource

    std::string s1 = c4.getName(); // ERROR: no implicit conversion

    std::string s2 = std::string(c4.getName()); // OOPS: two allocations

    ```


    This is not only costly, but it is also a performance issue, because in the last
    two allocations happen:


    +   - First we allocate memory for the return value

    - then the conversion from type std::pmr::string to std::string needs another
    allocation.

    - For this reason, it might be a good idea to provide an additional getter getNameAsString()
    that directly creates and returns the requested type:


    ```

    std::string s3 = c4.getNameAsString(); // OK: one allocation

    ```


    # 27.4 Afternotes


    Polymorphic allocators were first proposed by Pablo Halpern in https://wg21.link/n3525.
    This approach was adopted to become part of the Library Fundamentals TS as proposed
    by Pablo Halpern in https://wg21.link/n3916. The approach was adopted with other
    components for C++17 as proposed by Benjamin Dames and Alisdair Meredith in https://wg21.link/p0220r1.'
