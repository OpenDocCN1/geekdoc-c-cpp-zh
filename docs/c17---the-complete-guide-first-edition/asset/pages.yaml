  md: "# 20.4 Filesystem Operations\n\nYou can ask for the current permissions and\
    \ as a result check the bits of the returned perms object. To combine flags, use\
    \ the bit operators. For example:\n\n```\n// if writable:\nif ((fileStatus.permissions()\n\
    \    & (fs::perms::owner_write | fs::perms::group_write\n    | fs::perms::others_write))\n\
    \    != fs::perms::none) }\n```\n\nA shorter (but less readable) way to put the\
    \ & expressions in parentheses to initialize a bitmask was to directly use the\
    \ returning value out and relaxed enum initialization:\n\n```\n// if writable:\n\
    if ((fileStatus.permissions() & fs::perms(0222)) != fs::perms::none) { }\n```\n\
    \nNote that you have to put the & expressions in parentheses before comparing\
    \ the outcome with a specific value. Note also that you can skip the comparison\
    \ because there is no implicit conversion for bool bitmask scoped enumeration\
    \ types.\n\nAnother example, to convert the permissions of a file to string with\
    \ the notation of the UNIX ls -1 command, you can use the following function:\n\
    \n```\nfilesystem/permsString.hpp\n\n#include <string>\n#include <chrono>\n#include\
    \ <filesystem>\n\nstd::string perms(const std::filesystem::perms& pm)\n{\n   \
    \ using perms = std::filesystem::perms;\n    std::string s;\n    s.resize(9);\n\
    \    s[0] = (pm & perms::owner_read)   != perms::none ? 'r' : '-';\n    s[1] =\
    \ (pm & perms::owner_write) != perms::none ? 'w' : '-';\n    s[2] = (pm & perms::owner_exec)\
    \   != perms::none ? 'x' : '-';\n    s[3] = (pm & perms::group_read)   != perms::none\
    \ ? 'r' : '-';\n    s[4] = (pm & perms::group_write) != perms::none ? 'w' : '-';\n\
    \    s[5] = (pm & perms::group_exec)   != perms::none ? 'x' : '-';\n    s[6] =\
    \ (pm & perms::others_read)  != perms::none ? 'r' : '-';\n    s[7] = (pm & perms::others_write)\
    \ != perms::none ? 'w' : '-';\n    s[8] = (pm & perms::others_exec)  != perms::none\
    \ ? 'x' : '-';\n    return s;\n}\n```"
