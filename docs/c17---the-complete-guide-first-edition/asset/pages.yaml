    \ elem.first << '\\n';\n}\n```\n\nNote that the extension applies to the new compile-time\
    \ feature.\n\n# 2.2 switch with Initialization\n\nUsing the switch statement with\
    \ an initialization allows us to initialize an object/entity for the scope of\
    \ the switch before commencing to decide where to continue the flow.\nFor example,\
    \ we can initialize a filesystem path before deal with it according to its path\
    \ type:\n\n```\nusing namespace std::filesystem;\n\nwitch (path p(name); status(p).type())\
    \ {\n    case file_type::not_found:\n        std::cout << \"not found\\n\";\n\
    \        break;\n    case file_type::directory:\n        std::cout << \":filesystem::directory\\\
    n\";\n        for (auto& e : std::directory_iterator(p)) {\n            std::cout\
    \ << \"- \" << e.path() << '\\n';\n        }\n        break;\n    default:\n \
    \       std::cout << p << \" exists\\n\";\n        break;\n}\n```\n\nHere, the\
    \ initialized path p can used throughout the whole switch statement.\n\n# 2.3\
