  md: '# # Chapter 29


    # # Other Library Improvements for Experts


    There are some further improvements to the C++ standard library for experts such
    as foundation library programmers, which are described in this chapter.


    # ## 29.1 Low-Level Conversions between Character Sequences and Numeric Values


    Converting integral values to character sequences and versa has been an issue
    since C. While C provides sprintf() and scanf(), C++ first introduced string streams,
    which however need a lot of resources. With C++11 convenient functions such as
    std::to_string and std::stoi() which take std::string arguments only.


    C++17 introduced new elementary string conversion functions with the following
    abilities (quoted from the initial proposal):


    +   - No runtime parsing of format strings

    - No dynamic memory allocation inherently required by the interface

    - No consideration of locales

    - No indirection through function pointers required

    - Prevention of buffer overruns

    - When parsing a string, errors are distinguishable from valid numbers

    - When parsing a string, whitespaces or decorations are not silently ignored


    In addition for floating-point numbers, this feature will provide a round-trip
    guarantee that values converted to a character sequence and converted back result
    in the original value.'
