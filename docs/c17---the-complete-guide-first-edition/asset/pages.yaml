  md: "# 16.3 std::variant<> Types and Operations\n\n# Move Semantics\n\nstd::variant<>\
    \ also supports move semantics. If you move the object as a whole, the state gets\
    \ copied and the value of the current alternative is moved. As a result, a moved-from\
    \ object has the same state, but any value becomes unspecified. You can also move\
    \ a value into or out of the contained object.\n\n# Hashing\n\nThe hash value\
    \ for a variant object is enabled if and only if each member type can provide\
    \ a hash value. Note that the hash value is not the hash value of the current\
    \ alternative.\n\n# 16.3.3 Visitors\n\nThey have to unambiguously provide function\
    \ call operator for each possible type. Then, the corresponding overload is used\
    \ to deal with the current alternative.\n\n# Using Function Objects as Visitors\n\
    \nFor example:\n\n```\nlib/variant_test.cpp\n#include <variant>\n#include <string>\n\
    #include <iostream>\n\nstruct MyVisitor {\n    void operator()(int i) const {\n\
    \        std::cout << \"int: \" << i << '\\n';\n    }\n    void operator()(std::string\
    \ s) const {\n        std::cout << \"string: \" << s << '\\n';\n    }\n    void\
    \ operator()(double d) const {\n        std::cout << \"double: \" << d << '\\\
    n';\n    }\n};\n\nint main() {\n    std::variant<int, std::string, double> var(42);\n\
    \    std::visit(MyVisitor(), var); //calls operator() for int\n    var = \"hello\"\
    ;\n}\n```"
