  md: "# 10.2 Using Compile-Time if\n\n```\ntemplate<typename Iterator, typename Distance>\n\
    void advanceImpl(Iterator& pos, Distance n, std::input_iterator_tag) {\n    while\
    \ (n--) {\n        ++pos;\n    }\n}\n```\n\nwe can now implement all behavior\
    \ in one function:\n\n```\ntemplate<typename Iterator, typename Distance>\nvoid\
    \ advance(Iterator& pos, Distance n) {\n    using cat = std::traits<Iterator>::iterator_category;\n\
    \n    if const constexpr(std::is_same_v<cat, std::random_access_iterator_tag>)\
    \ {\n        pos += n;\n    }\n    else if constexpr(std::is_same_v<cat, std::directional_access_iterator_tag>)\
    \ {\n        if (n > 0) {\n            while (n--) {\n                ++pos;\n\
    \            }\n        } else {\n            while (n++) {\n                --pos;\n\
    \            }\n        }\n    } else { //input_iterator_tag\n        while (n--)\
