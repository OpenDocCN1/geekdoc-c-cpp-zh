    # Multi-Threading and Concurrency


    A couple of minor extensions and improvements were introduced in the area of multi-threading
    and concurrency.


    # ## 26.1 Supplementary Mutexes and Locks


    # ### 26.1.1 std::scoped_lock


    C++11 introduced a simple std::lock_guard to have a simple RAII-style way to lock
    a mutex:


    +   - The constructor locks

    - The destructor unlocks (which may be caused by an exception)


    Unfortunately, this was not standardized as a variadic template to be able to
    lock multiple mutexes with a single declaration.

    std::scoped_lock<> closes this gap. It allows us to lock one or more mutexes.
    The mutexes may have different mutex types.

    For example:


    ```

    #include <mutex>

    ...

    std::vector<std::string> allIssues;

    std::mutex allIssuesMx;

    std::vector<std::string> openIssues;

    std::timed_mutex openIssuesMx;

    ```


    ```

    // lock both issue lists:

    {

    std::scoped_lock lg(allIssuesMx, openIssuesMx);

    ```'
