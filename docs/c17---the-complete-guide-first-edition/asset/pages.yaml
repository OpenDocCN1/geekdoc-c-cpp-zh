  md: "# # Chapter 5\n\n# ## Mandatory Copy Elision or Passing Unmaterialized Objects\n\
    \nThe topic of this chapter can be seen from two points of view:\n- C++17 introduces\
    \ a new rule for *mandatory copy elision* under certain conditions: The former\
    \ option to eliminate temporary objects, when passing or returning them by value,\
    \ now becomes mandatory.\n- As a result we deal with passing around the values\
    \ of *unmaterialized objects* for initialization.\nI will introduce this feature\
    \ technically, coming later to the effect and terminology of *materialization*.\n\
    \n# ### 5.1 Motivation for Mandatory Copy Elision for Temporaries\n\nSince the\
    \ first standard, C++ permits certain copy operations to be omitted (*elided*)\
    \ even if this might impact the behavior of a program as a side effect that no\
    \ constructor gets called. One case is when a temporary object is used to initialize\
    \ a new object. This especially happens when a temporary is passed to or returned\
    \ from a function by value. For example:\n\n```\nclass MyClass\n{\n    ...\n};\n\
    \nvoid foo(MyClass param) { // param is initialized by passed argument\n    ...\n\
    }\n```\n\n```\nMyClass bar() {\n    return MyClass(); // returns temporary\n}\n\
    ```"
  merge: -1
