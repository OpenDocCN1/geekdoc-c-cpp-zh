    \ an output parameter, you can get an error code on error.\n\nNote that in the\
    \ latter case, you might still have special return values, signaling a specific\
    \ error that\nis not handled as an exception.\n\n# Using_system_error Exceptions\n\
    \nFor example, you can try to create a directory as follows:\n\n```\nif (!create_directory(p))\
    \ { // exception on error (unless path exists)\n    std::cout << p << \" already\
    \ exists\\n\"; // path exists\n}\n```\n\nHere, no code argument is passed so that\
    \ errors usually raise an exception. Note that the special case that the path\
