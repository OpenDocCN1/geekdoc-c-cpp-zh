  md: "# # Chapter 11\n\n# # Fold Expressions\n\nSince C++17, there is a feature to\
    \ compute the result of using a binary operator over *all* the arguments of a\
    \ parameter pack (with an optional initial value).\n\nFor example, the following\
    \ function returns the sum of all passed arguments:\n\n```\ntemplate<typename...\
    \ T>\nauto foldSum(T... args) {\n  return ((arg1 + arg2) + arg3) ...;\n}\n```\n\
    \nNote that the parentheses around the return expression are part of the fold\
    \ expression and can't be omitted.\n\nCalling the function with\nfoldSum(47, 11,\
    \ val, -1);\n\ninstantiates the template to perform:\nreturn 47 + 11 + val + -1;\n\
    \nCalling it for\nfoldSum(std::string(\"hello\\ \"world\", \"!\");\n\ninstantiates\
    \ the template for:\nreturn std::string(\"hello\") + \"world\" + \"!\";\n\nAlso\
    \ note that the order of fold expression arguments can differ and matters (and\
    \ might look a bit counter-intuitive): As written,\n\n```\n(... + args)\n```\n\
    \nresults in\n((arg1 + arg2) + arg3) ...\nwhich means it repeatedly \"post-adds\"\
    \ things. You can also add\n(args + ...)."
