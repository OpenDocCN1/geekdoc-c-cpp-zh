    # 20.4 Filesystem Operations


    This section covers the more expensive filesystem operations that take the current
    filesystem into account.


    Because these operations usually take the filesystem into account (care for existing
    files, symbolic links, etc.), they signify more expensive than pure path operations
    As a consequence, they are usually free-standing functions.


