  md: "# 5.2 Benefit of Mandatory Copy Elision for Temporaries\n\n...\nreturn obj;\
    \ // still requires copy/move support\n}\n\nWhile passing a temporary (which is\
    \ a *prvalue*) to the function is no longer a copy/move, returning the parameter\
    \ requires copy/move support, because the returned object has a name.\nAs of this\
    \ change a couple of modifications and clarifications in the terminology of categories\
    \ were made.\n\n# 5.2 Benefit of Mandatory Copy Elision for Temporaries\n\nOne\
    \ benefit of this is, of course, guaranteed better performance when returning\
    \ a value that is expensive to copy. How move semantics helps reduce copying costs\
    \ significantly, it can still become a key improvement not to perform copies even\
    \ if they are pretty cheap (e.g., if the objects have many fundamental data types\
    \ as members). This might reduce the need to use out-parameters rather simply\
    \ returning a value (provided the return value is created with the return statement).\n\
    Another benefit is the ability to define a factory function that *always* works,\
    \ because it can also return an object even when copy moving is not allowed. For\
    \ example, consider the following generic function:\n\n```\nlang/factory.hpp\n\
    \n#include <utility>\n\ntemplate <typename T, typename... Args>\nT create(Args&&...\
    \ args)\n{\n    return T(std::forward<Args>(args)...);\n}\n\n```\n\nThis function\
    \ can be used for a type such as `std::atomic<`, where neither the copy nor move\
    \ constructor is defined:\n\n```\nlang/factory.cpp\n\n#include \"factory.hpp\"\
    \n#include <memory>\n#include <atomic>\n\nint main() \n{\n    int i = create<int>(42);\n\
    \    std::unique_ptr<int> up = create<std::unique_ptr<int>>(new int{42});\n  \
    \  std::atomic<int> ai = create<std::atomic<int>>(42);\n}\n```"
