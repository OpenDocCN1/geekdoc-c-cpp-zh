    # Construction


    You can create a string view with the default constructor, as a copy, from a raw
    character array (null terminated or specified length), from a std::string, or
    with the suffix sv. However, note the following:


    +   * String views created with the default constructor nullptr as data(). Thus,
    there is no valid operator of [].


    ```

    std::string_view sv;

    // yields nullptr

    auto p = sv.data();

    std::cout << sv[0]; // ERROR: no valid character

    ```


    +   * When initializing a string view by a null terminated byte stream, the resulting
    size is the number of characters without ''\0'' and using the index of the terminating
    null character is not valid:


    ```

    std::string_view sv{"hello"};

    std::cout << sv;   // OK

    ```'
