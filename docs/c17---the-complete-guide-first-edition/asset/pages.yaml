    # 8.4 Fixed Direct Initialization with auto


    After introducing uniform initialization with braces in C++11, it turned out that
    there were some

    unfortunate and unintended inconsistencies when using auto instead of a specific
    type:


    ```

    int x(42);

    int y(1,2,3);

    // ERROR

    auto a(42);

    // initializes a std::initializer_list<int>

    auto b(1,2,3);

    // OK initializes a std::initializer_list<int>

    ```


    These inconsistencies were fixed for direct list initialization (brace initialization
    = =) so that

    we now have the following:


    ```

    int x(42);

    int y(1,2,3);

    // ERROR

    // initializes an int

    auto a(42);

    // initializes an int

    auto b(1,2,3);

    // ERROR

    ```


    Note that this is a breaking change can even result in a different program behavior

    (e.g. when printing a). For this reason, compilers that adopt this change usually
    adopt this

    change in C++11. For the major compilers, the fix was adopted for all modes with
    Visual

    Studio 2015, g++5, and clang 3.


    Note that also copy list initialization (brace initialization with =) still has
    the better initializing

    ways used: std::initializer_list<int> when auto is used:


    ```

    auto c = {42};

    auto d = {1,2,3};

    // initializes a std::initializer_list<int>

    // OK initializes a std::initializer_list<int>

    ```


    Thus we have now another significant difference between direct initialization
    (without =) and copy

    initialization (with =):


    ```

    auto a{42};

    // initializes an int

    ```'
