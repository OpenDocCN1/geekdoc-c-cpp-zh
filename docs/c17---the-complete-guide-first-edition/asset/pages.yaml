    # Conversion to Integral Types


    By using to_integer<>() you can convert std::byte to any fundamental integral
    type (bool, a character type, or an integer type). This is, for example, necessary
    to compare std::byte with a numeric value or to use it in a condition


    ```

    if (b2) // ERROR

    if (b2 != std::byte(0)) // OK

    if (to_integer<bool>(b2)) // ERROR (ADL doesn''t work here)

    if (std::to_integer<bool>(b2)) // OK

    ```


    Another example use is std::byte I/O which uses the rules for static casts from
    an unsigned char to the destination type. For example:


    ```

    std::cout << std::to_integer<unsigned int>(ff); // 255

    std::cout << std::to_integer<int>(ff); // also 255 (negative value)

    std::cout << std::static_cast<int>(std::to_integer<signed char>(ff)); // -1

    ```


    # I/O with std::byte


    There are no input and output operators for std::byte, so you have to convert
    them to an integral value:


    ```

    std::byte b;

    ...

    std::cout << std::to_integer<int>(b); // prints value as decimal value

    std::cout << std::hex std::to_integer<int>(b); // prints value as hexadecimal
    value

    ```


    By using a std::bitset<>, you can also output the value as binary (a sequence
    of bits):


    ```

    #include <bitset>

    #include <limits>

    ```'
