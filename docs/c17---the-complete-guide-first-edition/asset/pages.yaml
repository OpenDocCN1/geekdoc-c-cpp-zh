    # 9.2 Deduction Guides


    You can define deduction guides to provide additional class template argument
    deductions or fix existing deductions by constructors. For example, you can define
    whenever the types of a Pair3 are deduced, the deduction should occur as if the
    types has been passed by value:


    ```

    template<typename T1, typename T2>

    struct Pair3 {

    nT1 first;

    T2 second;

    Pair3(const T1& x, const T2& y) : first(x), second(y) {

    }

    };

    ```


    ```

    // deduction guide for the constructor:

    template<typename T1, typename T2>

    Pair3(T1, T2) -> Pair3<T1, T2>;

    ```


    Here, on the left side of the -> declare what we want to deduce. In this case,
    it is the creation of a Pair3 from two objects of arbitrary types T1 and T2. On
    the right side of the -> we define the resulting deduction. In example, Pair3
    is instantiated with T1 and T2.


    You might argue that the constructor actually decays. However, the constructor
    takes the argument by reference, which is not the case. In general, even outside
    of templates, arguments passed by decay, while arguments passed by reference do
    not decay. Decay means that arrays convert to pointers and top qualifiers, such
    as const and references, are ignored.


    Without the deduction guide, for example, by declaring the:


    ```

    Pair3 p("hi", "world");

    ```


    the type of parameter x and therefore T1 is const char [3] and the type of parameter
    y and therefore T2 is const char[6].


    Due to the deduction guide, the templates decay, which means that passed array
    or string literals decay to the corresponding pointer types. When, declaring the
    following:'
