    \  el1 ->e2\n  el1 <<e2\n  el1 >>e2\n\nel is guaranteed to get evaluated before\
    \ e2 now, so that the evaluation order is left to right.\nHowever, not that the\
    \ evaluation order of different arguments of the same function call is still undefined.\
    \ That is, in\nnel1.f(a1, a2, a3)\n\ne1 is guaranteed to get evaluated before\
    \ a1, a2, and a3. However, the evaluation order of a2, and a3 is still undefined.\n\
    \n+   * In all assignment operators\n  e2 = el\n  e2 += el\n  e2 *= el\n  ...\n\
    \n\nthe right-hand side e1 is guaranteed to get evaluated before the left-hand\
    \ side e2 now.\nFinally, in new expressions like\nnew Type (e)\n\nthe allocation\
