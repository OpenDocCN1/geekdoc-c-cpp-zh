  md: '# Chapter 19


    # String Views


    With C++17, a special string class was adopted by the C++ standard library, that
    allows us to deal with character sequences like strings, without allocating memory
    for them: std::string_view. That is, std::string_view objects refer to external
    character sequences without owning them. That is, the object can be considered
    as a reference to a character sequence.


    ![](img/3f232898efb332044c9335ea515fdd0f_196_0.png)


    Figure 19.1. String View Objects


    Using such a string view is cheap and fast (passing a string_view is always cheap).
    However, it is also potentially dangerous, similar to raw pointers it is up to
    the programmer to ensure that the referred character sequences are still valid,
    when using a string_view).


    # 19.1 Differences to std::string


    In contrast to std::string, std::string_view objects have the following properties:


    +   - The underlying character sequences are read-only. There are no operations
    that allow the modification of the characters. You can only assign a new value,
    swap values, and remove characters at the beginning or the end.'
