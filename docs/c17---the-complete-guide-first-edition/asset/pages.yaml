  md: "# 11.1 Motivation for Fold Expressions\n\nwhich repeatedly \"pre-adds\" things,\
    \ so that the resulting expression is:\n\n```\n(arg1 + (arg2 + arg3)) ...\n```\n\
    \nFold expression avoid the need to recursively instantiate templates to perform\
    \ an operation on all parameters of a template parameter. Before C++17, you had\
    \ to implement:\n\n```\ntemplate<typename T>\nauto foldSumRec(T arg) {\n    return\
    \ arg;\n}\ntemplate<typename T1, typename... Ts>\nauto foldSumRec(T1 arg1, Ts...\
    \ otherArgs) {\n    return arg1 + foldSumRec(otherArgs);\n}\n```\n\nSuch an implementation\
    \ is not only cumbersome to use, it also stresses C++ compilers. With\n\n```\n\
    template<typename... T>\nauto foldSum(T... args) {\n    return (... + args); //\
    \ arg1 + arg2 + arg3\n}\n```\n\nthe effort becomes significantly less fold for\
    \ both the programmer and the compiler.\n\n# 11.2 Using Fold Expressions\n\nGiven\
    \ a parameter args and an operator op, C++17 allows us to write\n\n+   - either\
    \ a unary left fold\n  - (... op args)\n    expands to: ((arg1 op arg2) op arg3)\
    \ op ...\n- or a unary right fold\n  - (args op ...)\n    expands to: arg1 op\
    \ (arg2 op (argN-1 op argN)) and the ellipsis (...) don't have to be separated\
    \ by whitespaces.\n\nThe parens are required. However, the difference between\
    \ left and right fold matters more often than expected. For example, even when\
    \ using operator + there might be different effects. When using the left fold\
    \ expression:\n\n```\ntemplate<typename... T>\nauto foldSumL(T... args){\n   \
    \ return (... + args); // ((arg1 + arg2) + arg3)...\n```"
