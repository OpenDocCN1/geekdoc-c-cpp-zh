  md: '# The C++17 Standard


    The original C++ standard was published in 1998 and subsequently amended by a
    *technical corrigendum in 2003*, which provided minor corrections and clarifications
    to the original standard. This “old C++ standard” is known as C++98 or C++03.


    The world of “Modern C++” was entered with C++11 and extended with C++14. The
    international C++ committee now aims at issuing a new standard roughly every 3
    years, which leaves less time for massive additions, but it brings changes more
    quickly to the broader programming community. The development of larger features,
    then, spans time and might cover multiple standards.


    C++17 is just the next step. It is not a revolution, but it brings a huge amount
    of improvements and extensions.


    At the time of this writing, C++17 is at least partially supported by major compilers.
    As usual, compilers differ greatly in their support of new language features.
    Some will compile or all of the code in this book, while others may only be able
    to handle a significant subset. However, I expect that this problem will soon
    be resolved as programmers everywhere demand standard support from their vendors.


    # Example Code and Additional Information


    You can access all programs and find more information about this book from its
    Web site, which has the following URL:


    ```

    http://www.cppstd17.com

    ```


