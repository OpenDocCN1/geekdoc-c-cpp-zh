  md: '# # Chapter 9

    # Class Template Argument Deduction


    Before C++17, you always have to explicitly specify all template parameter types
    for class templates. For example, you can''t omit the double here:


    ```

    std::complex<double> c{5,1.3.3};

    ```


    or omit the need to explicitly specify std::mutex here a second time:


    ```

    std::mutex mx;

    std::lock_guard<std::mutex> lg(mx);

    ```


    Since C++17, the constraint that you always have to specify the template arguments
    explicitly is relaxed. By using class template argument deduction (CTAD), you
    can skip defining the templates arguments explicitly to deduce all template parameters.


    +   For example:

    - You can declare now:

    std::complex c{5,1.3.3}; // OK: std::complex<double> deduced

    - You can implement now:

    std::mutex mx;

    std::lock_guard lg(mx); // OK: std::lock_guard<std::mutex> deduced

    - You can let it deduce element types:

    std::vector v1 {1, 2, 3}; // OK: std::vector<int> deduced

    std::vector v2 {"hello", "world¬"}; // OK: std::vector<const char*> deduced'
