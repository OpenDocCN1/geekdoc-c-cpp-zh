  md: "# 28.1 Using new with Alignments\n\nBy using an over-aligned type such as:\n\
    \n```\nstruct alignas(32) MyType {\n  int i;\n  char c;\n  std::string s[4];\n\
    };\n```\n\nA new expression guarantees that the requested heap memory is aligned\
    \ as requested (provided over-alignment is supported):\n\n```\nMyType* p = new\
    \ MyType32; // since C++17 guaranteed to be 32-bytes aligned\n```\n\nBefore C++17,\
    \ the request was not guaranteed to be 32-bytes aligned.\nAs usual, any value\
    \ for initialization the object is default initialized, which means that available\
    \ constructors are called, but (sub)objects of fundamental type have an undefined\
    \ value. For this reason, you use list initialization with curly braces to ensure\
    \ that the (sub)objects have their default value or O/false nullptr:\n\n```\n\
    MyType* p = new MyType32(); // aligned and initialized\n```\n\n# 28.1.1 Dynamic/Heap\
    \ Memory Arenas\n\nNote that the request for aligned memory might require a call\
    \ to the memory from a disjoint memory allocation mechanism. For this reason,\
    \ a request for aligned memory might require a specific corresponding request\
    \ to deallocate the aligned data. It is possible that the memory is allocated\
    \ with the C1 function aligned_alloc() (which is now also available in C++17).\
    \ In that case, deallocation with free() would still be fine so that there is\
    \ no difference compared to memory allocated with malloc().).\n\nOther implementations\
    \ of new and delete are used for platforms, with the requirement that different\
    \ functions deallocate-aligned and over-aligned data. On Windows aligned_malloc()\
    \ is usually used, which requires to use _aligned_free() as counterpart.\n\nIn\
    \ contrast to C, the C++ standard specifies this and therefore assumes that there\
    \ are two disjoint, non-interoperable memory arenas, one for default-aligned and\
    \ one for over-aligned data. Most of the time compilers know how to handle this\
    \ correctly:\n\n```\nstd::string* p = new std::string; // using default-aligned\
