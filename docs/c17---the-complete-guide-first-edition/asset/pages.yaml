  md: "# Glossary\n\nThis glossary is a short description of the most important non-trivial\
    \ technical terms that are used in this book.\n\n# ## B\n\n### bitmask type\n\
    An integral or scoped enumeration type (`enum class`), for which different values\
    \ represent different bits. If it is a scoped enumeration type, only the bit operators\
    \ are defined and you need `static_cast<>` to use its integral value or use it\
    \ as a Boolean value.\n\n# ## F\n\n### full specialization\n alternative definition\
    \ for a (*primary*) template, which no longer depends on any template parameter.\n\
    \n# ## I\n\n### incomplete type\nA class that is declared but not defined, an\
    \ array of unknown size, an enumeration type without the underlying type defined,\
    \ void (optionally with `const` and/or `volatile`), or an array of incomplete\
    \ element type."
