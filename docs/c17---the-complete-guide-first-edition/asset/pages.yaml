    # 20.4.3 Permissions


    The model to deal with permissions is adopted from UNIX/POSIX world. There are
    bits to

    read, write, and/or execute/search access for owners of the file, members of the
    same group,

    or all others. There are special bits for "set user ID on execution," "set group
    ID on

    execution," and the sticky bit (or another system-dependent mechanism).


    Permission Bits lists the values of the bitmask scoped enumeration type perms,
    which represent one or multiple bits.

    namespace std::filesystem;


    | Enum | Octal | POSIX | Meaning |

    |---|---|---|--|

    | none | 0 | | No permissions |

    | owner_read | 0400 | S_IRUSR | Read permission for the owner |

    | owner_write | 0200 | S_IWUSR | Write permission for the owner |

    | owner_exec | 0100 | S_IXUSR | Execute/search permission for the owner |

    | owner_all | 0700 | S_IRWXU | All permissions for the owner |

    | group_read | 040 | S_IRGRP | Read permission for the group |

    | group_write | 0200 | S_IWGRP | Write permission for the group |

    | group_exec | 0100 | S_IXGRP | Execute/search permission for the group |

    | group_all | 0700 | S_IRWXG | All permissions for the group |

    | others_read | 040 | S_IROTH | Read permission for all others |

    | others_write | 0200 | S_IWOTH | Write permission for all others |

    | others_exec | 0100 | S_IXOTH | Execute/search permission for all others |

    | others_all | 0700 | S_IRWXG | All permissions for all others |

    | all | 07777 | | All permissions for all |

    | set_uid | 04000 | S_ISUID | Set user-ID on execution |

    | set_gid | 02000 | S_ISGID | Set group-ID on execution |

    | sticky_bit | 01000 | S_ISVTX | Operating system dependent |

    | mask | 07777 | | Mask for all possible bits |

    | unknown | 0xFFFF | | Permissions not known |


    Table 20.14. Permission Bits'
