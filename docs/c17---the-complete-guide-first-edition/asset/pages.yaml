  md: "# 16.3 std::variant<> Types and Operations\n\n# 16.3.1 std::variant<> Types\n\
    \nIn the header file <variant> the C++ standard library defines class std::variant<>\
    \ as follows:\n\n```\nnamespace std {\n    template<typename Types...> class variant;\n\
    }\n```\n\nThat is, std::variant<> is a variadic template (a feature introduced\
    \ with C++11, allowing to deal with an arbitrary number of types).\n\nIn addition,\
    \ the following type and objects are defined:\n\n+   * Type std::variant_size\n\
    * Type std::variant_alternative\n* Value std::variant_npos\n* Type std::monostate\n\
    * Exception class std::bad_variant_access, derived from std::exception.\n\nVariants\
    \ also use the two objects std::in_place (of type std::in_place_type_t) and std::in_place_index\
    \ (of type std::in_place_index_t) defined in utility.\n\n# 16.3.2 std::variant<>\
    \ Operations\n\nTable std::variant Operations lists all operations that are provided\
    \ for std::variant::.\n\n# Construction\n\nBy default, the default constructor\
    \ of a variant calls the default constructor of the first alternative:\n\n```\n\
    std::variant<int, int, std::string> v1; // sets first int to 0, index()0\n```\n\
    \nThe alternative is value initialized, which means it is 0, false, nullptr, for\
    \ fundamental types.\n\nIf a value is passed for initialization, the best matching\
    \ type is used:\n\n```\nstd::variant<long, int> v2(42);\nstd::cout << v2.index()\
    \ << '\\n'; // prints 1\nstd::variant<long, long> v3(42); // ERROR: ambiguous\n\
    std::variant<int, float> v4(42.3); // ERROR: ambiguous\nstd::variant<int, double>\
    \ v5(42.3); // OK\nstd::variant<int, long double> v6(42.3); // ERROR: ambiguous\n\
    ```\n\n```\nstd::variant<std::string, std, std::string_view> v7(\"hello\"); //\
    \ ERROR: ambiguous\nstd::variant<std::string, std, std::string_view, const char*>\
    \ v8(\"hello\"); // OK\nstd::cout << v8.index() << '\\n'; // prints 2\n```"
