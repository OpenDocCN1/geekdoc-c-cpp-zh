  md: "# 5.4 Unmaterialized Return Value Passing\n\nThe key approach to explain value\
    \ categories is now that in general we have two kinds of expressions\n\n+   *\
    \ gvalues: expressions for locations of objects or functions\n* prvalues: expressions\
    \ for initializations\n\nAn xvalue is then considered a special case, representing\
    \ an object whose resources can be reused (usually because it is near the end\
    \ of its lifetime).\n\nC++17 then introduces a new term, called materialization\
    \ (of a temporary) for the moment a prvalue becomes a temporary object. Thus,\
    \ a temporary materialization conversion is a prvalue-to-xvalue conversion.\n\n\
    Any time a prvalue appears where a gvalue (ivalue or xvalue) is expected, a temporary\
    \ object is created and initialized with the prvalue (recall that prvalues are\
    \ primarily \"initializing values\"), and the prvalue is replaced by an xvalue\
    \ designating the temporary. So in the example above, we strictly speak however:\n\
    \n```\nvoid f(const X& p); // accepts an expression of any value category,\n \
    \                   // except a gvalue\n```\n\nf(X());\n\nBecause f in this example\
    \ has a reference parameter, it expects a gvalue argument. However, the expression\
    \ X() is a prvalue. The \"temporary materialization\" rule therefore kicks in,\
    \ and the expression X() is \"converted\" to an xvalue designating a temporary\
    \ object initialized with the default constructor.\n\nNote that materialization\
    \ does not mean that we create a new/different object. The value reference binds\
    \ to an xvalue and a prvalue, although the latter now always involves a conversion\
    \ to an xvalue.\n\nWith this modification (prvalues are no longer objects but\
    \ are instead expressions that can be used to initialize), the required copy elision\
    \ makes perfect sense, because the prvalues no longer need to be movable in order\
    \ to initialize a variable using assignment syntax. We only pass an initial value\
    \ that is sooner or later materialized to an object.\n\n# 5.4 Unmaterialized Return\
    \ Value Passing\n\nUnmaterialized return value passing applies to all forms of\
    \ returning a temporary object (prvalue) by value:\n\n+   * When we return a literal\
    \ that is not a string literal:\n\n```\nint f1() { // return it by value\n   \
    \ return 42;\n}\n```\n\n> 1 Thanks to Richard Smith and Graham Haynes for pointing\
    \ that out."
  merge: -1
  pgno: 62
