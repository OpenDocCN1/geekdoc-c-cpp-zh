    # Move Semantics


    Move semantics is supported following the rules introduced. In the following declarations:


    ```

    MyStruct ms = { 42, "Jim" };

    auto& [v,n] = std::move(ms); // entity is value reference to ms

    ```


    the structured bindings v and n refer to an anonymous entity by value reference
    to ms. ms still holds its value:


    ```

    std::cout << "ms.s" << ms << ''\n''; // prints "Jim"

    std::string s = std::move(ms); // moves ms to s

    std::cout << "ms.s" << ms << ''\n''; // prints unspecified value

    std::cout << "n" << n << ''\n''; // prints unspecified value

    std::cout << "s" << s << ''\n''; // prints "Jim"

    ```


    but you can move assign n, which refers to ms.s:

    As, moved-from objects are objects in a valid state with an unspecified value.
    Thus, it is fine to print the value but not to make assumptions about what is
    printed.


    This is slightly different from initializing the new entity with the moved values
    of ms:


    ```

    MyStruct ms = { 42, "Jim" };

    auto [v,n] = std::move(ms); // new entity with moved-from values from ms

    ```


    Here, the initialized entity is a new object initialized with moved values from
    ms. ms already lost its value:


    ```

    std::cout << "ms.s" << ms << ''\n''; // prints unspecified value

    std::cout << "n" << n << ''\n''; // prints "Jim"

    ```


    You can move assign n or assign a new value, but this does not affect ms.s:


    ```

    std::string s = std::move(n); // moves n to s

    n = "Lara";

    std::cout << "ms.s" << ms << ''\n''; // prints unspecified value

    std::cout << "n" << n << ''\n''; // prints "Lara"

    std::cout << "s" << s << ''\n''; // prints "Jim"

    ```


    > 3 For strings, moved-from objects are valid unspecified, but this is not guaranteed.'
