  md: '# # Chapter 7


    # # New Attributes and Attribute Features


    C++11 can specify attributes (formal annotations that enable or disable warnings).
    With C++17, new attributes were introduced. In addition, attributes can now be
    used at a few more places and with some additional convenience.


    # ## 7.1 Attribute [[nodiscard]]


    The new attribute [[nodiscard]] can be used to encourage warnings by the compiler
    if a return value of a function is not used (issuing a warning is not required,
    though).


    Usually, this can be used to signal misbehavior when return values are not used.
    The misbehavior might be:


    +   * memory leaks, such as not returning allocated memory,

    * unexpected or non-intuitive behavior, such as getting different/unexpected behavior
    when not using the return value,

    * unnecessary overhead, such as calling something that is a no-op if the return
    value is not used.


    Functions allocating that have to get freed by another function should be marked
    with [[nodiscard]]. A typical example would be to allocate memory, such as malloc()
    or the member function allocate() of allocators.


    Note however, some function might return a value that not compensating is necessary.
    For example, programmers call the C function realloc() with a size of zero bytes
    to free memory, so that the return value is not used to call free().


    +   * A good example of a function managing its behavior non-intuitively when
    not using the return value is std::async() (introduced with C++11). It has the
    purpose to start a functionality asynchronously and return a handle to wait for
    its end (and use any outcome). When the return value is not used the call becomes
    a synchronous call, the destructor of the unused return'
