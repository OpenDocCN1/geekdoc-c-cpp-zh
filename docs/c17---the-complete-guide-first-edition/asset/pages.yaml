    # 8.3 Relaxed Enum Initialization from Integral Values


    For enumerations with a keyed underlying type, since C++17 you can use an integral
    value of that type for direct list initialization. This applies to unscoped enumerations
    with a specified type and all scoped enumerations, which always have an unchanging
    default type:


    // unscoped enum with defaulting type:


    ```

    enum MyInt : char { };


    MyInt i11(42);              // OK since C++17 (ERROR before C++17)

    MyInt i12 = 42;             // still ERROR

    MyInt i13(42);              // still ERROR

    MyInt i14 = {42};           // still ERROR

    ```


    // scoped enum with defaulting underlying type:


    ```

    enum class Weekday { mon, tue, wed, thu, fri, sat, sun };

    Weekday s1(0);               // OK since C++17 (ERROR before C++17)

    Weekday s2 = 0;              // still ERROR

    Weekday s3(0);              // still ERROR

    Weekday s4 = {0};           // still ERROR

    ```


    The same applies if Weekday has a specified underlying type:


    // scoped enum with specified underlying type:


    ```

    enum class Weekday : char { mon, tue, wed, thu, fri, sat, sun };

    Weekday s1(0);               // OK since C++17 (ERROR before C++17)

    Weekday s2 = 0;              // still ERROR

    Weekday s3(0);              // still ERROR

    Weekday s4 = {0};           // still ERROR

    ```


    > ² This was, for example, the behavior of older GCC or Visual C++ versions.'
