- img_proc: true
  md: "Josuttis: C++17 2019/02/16 18:57 page 38\n\n# 38 Chapter 5: Mandatory Copy\
    \ Elision or Passing Unmaterialized Objects\n\n```\nint main() {\n  foo(MyClass());\
    \ // pass temporary to initialize param\n  MyClass x = bar(); // use returned\
    \ temporary to initialize x\n  foo(bar()); // use returned temporary to initialize\
    \ param\n}\n```\n\nHowever, because these optimizations were not mandatory, copying\
    \ the objects had to be possible by providing an implicit or explicit copy or\
    \ move constructor. That is, although the copy/move constructor was never called,\
    \ it had to be defined. This didn't compile when no copy/move constructor was\
    \ defined.\n\nThus, with the following definition of class MyClass the code above\
    \ not compile:\n\n```\nclass MyClass {\npublic:\n // no copy/move constructor\
    \ defined:\n  MyClass(const MyClass&&) = delete;\n  MyClass(MyClass&&) = delete;\n\
    };\n```\n\nIt was enough not to have the copy constructor, because the move constructor\
    \ is only implicitly available, when no copy (or assignment operator or destructor)\
    \ is user-declared.\n\nThe copy elision to initialize objects from temporaries\
    \ is mandatory since C++17. In fact, what we will later is that we simply pass\
    \ a value for initialization as argument or return value that is used to initialize\
    \ a new object.\n\nThis means that even with a definition of class MyClass not\
    \ enabling copying at all, the example above compiles.\n\nHowever, note that all\
    \ other copy elisions are optional and require a callable copy or move constructor.\
    \ For example:\n\n```\nMyClass foo() {\n  MyClass obj;\n  return obj; // still\
    \ requires copy/move support\n}\n```\n\nHere, foo() obj is a variable with a name\
    \ (which is anvalue). So the named return value optimization (NRVO) is used, which\
    \ still requires copy/move support. This would be the case if obj is a parameter.\n\
    \n```\nMyClass bar(MyClass obj) // copy elision for passed temporaries\n{\n```"
