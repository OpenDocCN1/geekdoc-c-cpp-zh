    # 9.2.3 Deduction Guides via various Constructors


    Deduction guides compete with the constructors of a class. Class template argument
    deduction uses the constructor/guide that has the highest priority according to
    overload resolution. If a constructor and a deduction guide match equally, the
    deduction guide is preferred.


    Consider have the following definition:


    ```

    template<typename T>

    struct C1 {

    C1(const T&) {

    }

    C1(int) -> C1<long>;

    ```


    When passing an int, the deduction guide is used, because it is preferred by overload
    resolution.³ Thus, T is deduced as:


    ```

    C1 x1(42); // T deduced as long

    ```


    But if we pass a char, the constructor is a better match (because no type conversion
    is necessary), so we deduce T to be:


    ```

    C1 x3{''x''}; // T deduced as char

    ```


    Because taking argument by value matches equally well as taking arguments by references
    and deduction guides are preferred for equally well matches


    > ³ A non-template function is preferred over a template unless other aspects
    of overload resolution matter more.'
