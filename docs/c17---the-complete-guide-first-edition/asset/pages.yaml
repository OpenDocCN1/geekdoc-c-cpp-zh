  md: "# 9.1 Usage of Class Template Argument Deduction\n\nClass template argument\
    \ deduction can be used whenever the arguments passed to a constructor can be\
    \ used to deduce the class template parameters. The deduction supports all ways\
    \ of initialization (provided the initialization is valid):\n\n```\nstd::complex\
    \ c1(1, 2.2);    // deduces std::complex<double>\nstd::complex c2(2.2, 3.3); \
    \   // deduces std::complex<double>\nstd::complex c3 = 3.3;             // deduces\
    \ std::complex<double>\nstd::complex c4 = (4.4);          // deduces std::complex<double>\n\
    ```\n\nThe initialization of c3 and c4 is possible, because you can initialize\
    \ a std::complex by passing only one argument, which is enough to deduce the template\
    \ parameter T, which is then used for both real and the imaginary part:\n\n```\n\
    namespace std {\n    template<typename T>\n    class complex {\n        constexpr\
    \ complex(const T& re = T(), const T& im = T());\n\n        ...\n    };\n};\n\
    ```\n\nWith a declaration such as\nstd::complex c1(1.1, 2.2);\n\nthe compiler\
    \ finds the constructor\nconstexpr complex(const T& re = T(), const T& im = T());\n\
    asas possible function call. Because for both arguments T is double, the compiler\
    \ deduces T to be double and compiles corresponding code for:\n\n```\ncomplex<double>:::complex(const\
    \ double& re = double(),\n             const double& im = double());\n```\n\n\
    Note that the template function cannot be unambiguously deduced. Thus, the following\
    \ initializations won't work:\nstd::complex c5(5,3.3);    // ERROR: attempts to\
    \ int and double as T\n\nAs usual for templates there are no conversions used\
    \ to deduce template parameters.\nClass template argument deduction for variadic\
    \ templates is also supported. For example, for\nstd::tuple which is defined as:\n\
    \n```\nnamespace std {\n    template<typename... Types>\n    class tuple {\n \
    \       public:\n            constexpr tuple(const Types&...);\n\n    };\n};\n\
    ```"
