  md: 'The trick is that both directory_iterator and recursive_directory_iterator
    are classes for which global overloads of begin() and end() are provided:


    +   - begin() yields the iterator itself


    +   - end() yields the end iterator, which you can also create with the default
    constructor


    For this reason, you can also iterate as follows:


    ```

    std::filesystem::directory_iterator di{p};

    for (auto pos = begin(di); pos != end(di); ++pos) {

    std::cout << pos->path() << ''\n'';

    }

    ```


    Or as follows:


    ```

    for (std::filesystem::directory_iterator pos{p};

    !pos != std::filesystem::directory_iterator{});

    ++pos) {

    std::cout << pos->path() << ''\n'';

    }

    ```


    # Directory Iterator Options


    When iterating over directories you can pass values of type directory_options,
    which are listed in table Directory Iterator Options. The type is a bitmask scoped
    enumeration, defined in namespace std::filesystem.


    | directory_options | Effect |

    |---|---|

    | none | Default (value 0) |

    | follow_directory_symlink | Follow symbolic links (rather than skipping them)
    |

    | skip_permission_denied | Skip directories where permission is denied |


    Table 20.1. Directory Iterator Options


    The default is not to follow symbolic links and to skip directories are not allowed
    to iterate over. With skip_permission_denied iterating over a denied directory,
    results in an exception. createfiles.cpp shows an application of follow_directory_symlink.


    # 20.5.1 Directory Entries


    The elements directory iterators iterate over of type std::filesystem::directory_entry.
    Thus, if a directory is valid operator() yields that type. Which means that the
    correct types of the range-based loop are as follows:


    ```

    for (const std::filesystem::directory_entry& e

    : std::filesystem::directory_iterator(p)) {

    std::cout << e.path() << ''\n'';

    }

    ```'
