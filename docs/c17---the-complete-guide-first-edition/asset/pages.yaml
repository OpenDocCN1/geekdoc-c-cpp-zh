  md: '# 19.6 Afternotes


    Beside the optimization to get the passed string value for the prefix as the std::string_view
    by value, we can also use a string here internally. But only because the C-string
    returned by ctime() is valid for a while (it is valid until the next call of ctime()
    or asctime()). Note that we can remove the trailing newline from the string, but
    that we can''t concatenate string views by simply calling operator+. Instead,
    we have to convert one of the operands to a std::string (which unfortunately unnecessarily
    might allocate additional memory).


    # 19.6 Afternotes


    The first string class with reference semantics was proposed by Jeffrey Yassin
    in https://wg21.link/n3334 (using the name string_ref). This class was adopted
    as part of the Library Fundamentals TS as proposed by Jeffrey Yassin in https://wg21.link/n3921.


