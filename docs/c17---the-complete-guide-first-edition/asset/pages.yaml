  md: "# 1.3 Providing a Tuple-Like API for Structured Bindings\n\n```\nreturn c.value();\n\
    }\n```\n\nNote that you should have three overloads, to be able to deal with constant,\
    \ non-constant, and movable objects.⁵ To enable the return value to be a reference,\
    \ you should use decltype(auto).⁶\n\nAgain, we use the new compile-time feature,\
    \ which makes the implementation much simpler if we have different return types.\
    \ Without this, we would need full specializations such as:\n\n```\ntemplate<std::size_t>\
    \ decltype(auto) get(const Constructor& c);\ntemplate<decltype(auto)> get(const\
    \ Constructor& c) { return c.first(); }\ntemplate<decltype(auto)> get(const Constructor&\
    \ c) { return c.last(); }\ntemplate<decltype(auto)> get(const Constructor& c)\
    \ { return c.value(); }\n```\n\nAgain, note that the primary function declaration\
    \ and the full specializations have the same signature (including the return type).\
    \ This will not compile:\n\n```\ntemplate<std::size_t> decltype(auto) get(const\
    \ Constructor& c);\ntemplate<std::string> get<0>(const Constructor& c) { return\
    \ c.first(); }\ntemplate<std::string> get<1>(const Constructor& c) { return c.last();\
    \ }\ntemplate<long> get<2>(const Constructor& c) { return c.value(); }\n```\n\n\
    Now, you can use structured bindings to access and modify the members of a Customer:\n\
    \n```\n#include \"structbind2.hpp\"\n#include <iostream>\n\nint main() {\n   \
    \ Customer c(\"Tim\", \"Starr\", 42);\n    auto [f, l, v] = c;\n    std::cout\
    \ << \"f/l/v: \" << f << \" / \" << l << \" / \" << v << \"\\n\";\n\n    // modified\
    \ structured bindings via references:\n    auto& f2, & v2 = c;\n    std::string&\
    \ s = std::move(f2);\n    f2 = \"Ringo\";\n    v2 = 10;\n    std::cout << \"f2/v2:\
    \ \" << f2 << \" / \" << v2 << \"\\n\";\n}\n/structbind2.cpp\n```\n\n> ⁵ The standard\
    \ library provides a fourth get<>() overload for const T&, which is provided for\
    \ other reasons (see https://cppreference.com/w/cpp/tuple/get) and is not necessary\
    \ here to support structured bindings.\n\n> ⁶ decltype(auto) was introduced with\
    \ C++14 to be able to deduce a (reference) type from the value category of an\
    \ expression. By using this as a return type, roughly speaking, references are\
    \ returned by reference, but temporaries are returned by value."
