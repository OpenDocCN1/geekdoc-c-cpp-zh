    # 20.5 Iterating Over Directories


    One key application of the filesystem library is to iterate over directories or
    all files of a filesystem (subtree).



    The most convenient way to do it is to use a range-based loop. Loop you iterate
    over all file in a directory:


    ```

    for (const auto& e : std::filesystem::directory_iterator(dir)) {

    std::cout << e.path() << ''\n'';

    ```


    or recursively over all files in a filesystem (subtree):


    ```

    for (const auto& e : std::filesystem::recursive_directory_iterator(dir)) {

    std::cout << e.path() << ''\n'';

    }

    ```


    The passed argument dir can be a path or anything implicitly convertible to a
    path (especially all of strings);

    Note that e.path() yields the filename including the directory the iteration was
    started from. Thus, if we iterate over "*", a filename.txt becomes "/file.txt.

    In addition, this path is quoted to a string, so that the output for this filename
    becomes "/file.txt" or "\file.txt", as discussed in an initial example, the following
    loop is more portable:


    ```

    for (const auto& e : std::filesystem::directory_iterator(dir)) {

    std::cout << e.path().lexically_normal().string() << ''\n'';

    }

    ```


    To iterate over your current directory you pass "." as current directory index
    of "". Passing an empty path on Windows is but not portable.


    # Directory Iterators are Ranges


    It might looks surprising that you can pass an iterator to a range-based loop,
    because you usually need a range.'
