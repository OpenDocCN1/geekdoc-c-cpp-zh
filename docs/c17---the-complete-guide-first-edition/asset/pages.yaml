  md: '# P


    # partial specialization


    An alternative definition for a (primary) template, which still depends on one
    or more template parameters.


    # S


    # small/short string optimization (SSO)


    An approach to allocating memory for short strings by always reserving memory
    for a certain number of characters. A typical value by standard library implementations
    is to always reserve 16 bytes of memory so that the string can have 15 characters
    (plus 1 byte for the null terminator) without allocating memory. This makes all
    string objects larger but usually saves a lot of running time, because in practice
    strings are often shorter than 16 characters and allocating memory on the heap
    is a pretty expensive operation.


    # V


    # variable template


    A amplified variable. It allows us to define variables or static members by substituting
    the template parameters by specific types or values.


    # variadic template


    A template with a template parameter that represents an arbitrary number of types
    or values.'
