  md: "Josuttis: C++17 2019/02/16 18:57\n\n# Structured Bindings\n\nThe benefit is\
    \ direct access and the ability to make the code more readable by binding the\
    \ value directly to names that carry semantic meaning about their purpose.\n\n\
    The following code demonstrates how code can significantly improve with structured\
    \ bindings. To iterate the elements of a std::map<> without structured bindings\
    \ you'd have to program:\n\n```\nfor (const auto& elem : map) {\n  std::cout <<\
    \ elem.first << \" : \" << elem.second << '\\\\n';\n}\n```\n\nThe elements are\
    \ std::pair of the key and value type as the members of a std::pair first, and\
    \ you have to use the key to access the key and the value. By using structured\
    \ bindings the code gets more readable\n\n```\nfor (const auto& [key,val] : map)\
    \ {\n  std::cout << key << \" : \" << val << '\\\\n';\n}\n```\n\nWe can directly\
    \ use the key and value member of each element, names that clearly demonstrate\
    \ their semantic meaning.\n\n# 1.1 Structured Bindings in Detail\n\nIn order to\
    \ understand structured bindings, it is important to be aware that there is a\
    \ new anonymous variable introduced. The new names introduced as structure bindings\
    \ refer to members/elements of this anonymous variable.\n\n# Binding to an Anonymous\
    \ Entity\n\nThe exact behavior of an initialization\n\n```\nauto [u,v] = ms;\n\
    ```\n\nbehaves as if we initialize a new entity e with and let the structured\
    \ bindings u and v become alias names for the members of this new object, similar\
    \ to:\n\n```\nauto e = ms;\naliasname u = e.i;\naliasname v = e.s;\n```\n\nNote\
    \ that u and v are not references to e.i and e.s, respectively. They are just\
    \ other names for the members. Thus, decltype(u) is the type of the member i and\
    \ decltype(v) is the type of the member s. We also do not have a name for e, so\
    \ that we cannot access the initialized entity directly by name.\n\nAs a result,\n\
    \n```\nstd::cout << u << \" : \" << v << '\\\\n';\n```\n\n> 1 Thanks to Zachary\
    \ Turner for pointing that out."
