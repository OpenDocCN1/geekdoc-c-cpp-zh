  md: "# Chapter 22: Parallel STL Algorithms\n\nPassing sequential execution as parameter\
    \ can be useful if the decision whether to run sequentially\nor in parallel is\
    \ at runtime and you don't want to have different function calls.\nRequesting\
    \ a parallel sorting instead is easy:\n\n```\nsort(std::execution::par,\ncoll.begin(),\
    \ coll.end());\n```\n\nNote that there is also another parallel execution policy:\n\
    \n```\nsort(std::execution::par_seq,\ncoll.begin(), coll.end());\n```\n\nI will\
    \ later explain the difference.\nSo, again the question is, (when) is using parallel\
    \ sorting? On my laptop with over 10,000\nstring, you could see that the sorting\
    \ took half of the time of a sequential sorting. And even sorting\n1000 was slightly\
    \ better with parallel execution.\n\n# Combining with other Improvements\n\nNote\
    \ that still other modifications might give you more or additional benefits. For\
    \ example, if we sort\nby the numbers, using substrings without the two leading\
    \ characters, we could use strings\ninside and see an improvement of a factor\
    \ of 2 with parallel execution:\n\n```\nsort(std::execution::par,\ncoll.begin(),\
    \ coll.end(),\n[](const auto& a, const auto& b) {\n    return a.substr(2) < b.substr(2);\n\
    });\n```\n\nHowever, substr is a pretty expensive member function for strings\
    \ because it creates and returns\na new temporary string. By using string_view,\
    \ we become a factor of 3 better even with\nsequential execution:\n\n```\nsort(coll.begin(),\
    \ coll.end(),\n[](const auto& a, const auto& b) {\n    return std::string_view(a).substr(2)\
    \ < std::string_view(b).substr(2);\n});\n```\n\nAnd combined with parallel algorithms\
    \ we become faster by a factor of up to 10:\n\n```\nsort(std::execution::par,\n\
    coll.begin(), coll.end(),\n[](const auto& a, const auto& b) {\n    return std::string_view(a).substr(2)\
    \ < std::string_view(b).substr(2);\n});\n```\n\ncompared to a sequential execution\
    \ with string's substr() members:\n\n```\nsort(coll.begin(), coll.end(),\n[](const\
    \ auto& a, const auto& b) {\n    return a.substr(2) < b.substr(2);\n});\n```"
