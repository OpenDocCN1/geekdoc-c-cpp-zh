  md: "# Chapter 21: Type Traits Extensions\n\nBut now you can define your own trait\
    \ by deriving from bool_constant<...> if you are able to formulate the corresponding\
    \ compile-time expression as Boolean constant. For example:\n\n```\ntemplate<typename\
    \ T>\nstruct IsLargerThanInt {\n    std::bool_constant<sizeof(T) > sizeof(int)>::\n\
    };\n```\n\nso that you can use such a trait to compile depending on whether a\
    \ type is larger than an int:\n\n```\ntemplate<typename T>\nvoid foo(T x)\n{\n\
    \    if constexpr(IsLargerThanInt<T>::value) {\n        ...\n    }\n```\n\nBy\
    \ adding the corresponding variable template for suffix _v as inline variable:\n\
    \n```\ntemplate<typename T>\ninline static constexpr auto IsLargerThanInt_v =\
    \ IsLargerThanInt<T>::value;\n```\n\nyou can also shorten the usage of the trait\
    \ as follows:\n\n```\ntemplate<typename T>\nvoid foo(T x)\n{\n    if constexpr(IsLargerThanInt_v<T>)\
    \ {\n    }\n}\n```\n\nAs another example, we can define a trait that checks whether\
    \ the move constructor for a type T guarantees not to throw exception as follows:\n\
    \n```\ntemplate<typename T>\nstruct IsNotrowMoveConstructibleT {\n    std::bool_constant<noexcept(std::declval<T>())>>\n\
    };\n```\n\n# 21.4 std::void_t<\n\nA little, incredible useful helper to define\
    \ type traits was standardized in C++17: std::void_t<>. It is simply defined as:\n\
    \n```\nnamespace std {\n    template<typename...> using void_t = void;\n}\n```"
