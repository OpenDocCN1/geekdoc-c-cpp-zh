  md: "# # Chapter 6\n\n# ## Lambda Extensions\n\nLambdas, introduced with C++11,\
    \ and generic lambdas, introduced with C++14, are a success story. They allow\
    \ us to specify functionality as arguments, which makes it a lot easier to specify\
    \ behavior right where it is needed.\n\n+   - C++17 improved their abilities to\
    \ use of lambdas in even more places:\n  - in constant expressions (i.e., at compile\
    \ time)\n  - in places you need a copy of the current object (e.g., when calling\
    \ lambdas in threads)\n\n# ### 6.1 constexpr Lambdas\n\nSince C++17, lambdas are\
    \ implicitly constexpr if. That is, any lambda can be used in compile-time contexts\
    \ the features it uses are valid for compile-time contexts (e.g., only literal\
    \ types, static variables, virtual, no try/catch, no new/delete).\n\nFor example,\
    \ you can use the result of calling a lambda computing the square of a passed\
    \ value as compile-time argument to the declaration of the size of a std::array<>;\n\
    \n```\nauto squared = [] (auto val) { // implicitly constexpr C++17\n    return\
    \ val*val;\n}\nstd::array<int,squared(5)> a;             // OK since C++17 =>\
    \ std::array<int,25>\n```\n\nUsing features that are not allowed in constexpr\
    \ contexts disable this ability, but you can still use the lambda in run-time\
    \ contexts:\n\n```\nauto squared2 = [] (auto val) { // implicitly constexpr C++17\n\
    \    static int calls = 0;             // OK, but disables lambda for constexpr\
    \ contexts\n...\n    return val*val;\n}\nstd::array<int,squared2(5)>;        \
    \       // ERROR: static variable in compile-time context\nstd::cout << squared2(5)\
    \ << '\\n';\n// OK\n```"
