  md: "# 4.2 Using Aggregate Initialization\n\nNote that you can skip initial values.\
    \ In that case the elements are zero initialized (calling the default constructor\
    \ or initializing fundamental data types with 0, false, or nullptr). For example:\n\
    \n```\nPData a{};\n// initialize-all elements\nPData b(\"msg\");\n// as if ({\"\
    msg\", 0.0},false)\nPData c{true};\n// as if ({nullptr, 0.0},true)\n// / values\
    \ of fundamental types are unspecified\nPData d;\n```\n\nNote the difference between\
    \ using curly braces and no braces at:\n\n+   - The definition of a zero-initialized\
    \ all members so that the string name is constructed, the double value is initialized\
    \ by 0.0, and the bool flag is initialized by false.\n- The definition of d only\
    \ initializes the string name by calling the default constructor; all members\
    \ are not initialized and have a unspecified value.\n\nYou can also derive aggregates\
    \ from non-aggregate classes. For example:\n\n```\nstruct String : std::string\
    \ {\n    void print() const {\n        if (empty()) {\n            std::cout <<\
    \ \"undefined\\n\";\n        } else {\n            std::cout << c_str() << '\\\
    n';\n        }\n    }\n};\n\nMyString x{\"hello\"};\nMyString y{\"world\"};\n\
    ```\n\nYou can derive aggregates from multiple base classes and/or aggregates:\n\
    \n```\ntemplate<typename T>\nstruct D : std::string, std::complex<T>\n{\n    std::string\
    \ data;\n};\n```\n\nwhich you can then use and initialize as:\n\n```\nD float{\"\
    hello\", {4, 5, 6}}; // OK since C++17\nD float{\"hello\", {4.5, 6}, \"world\"\
    }; // OK since C++17\nstd::cout << f.data; // outputs: \"world\"\nstd::cout <<\
    \ static_cast<std::string>(f); // outputs: \"hello\"\nstd::cout << static_cast<std::complex<float>>(f);\
    \ // outputs: (4,5,6)\n```\n\nThe inner initializer lists are passed to the base\
    \ classes in the order of the base class declarations.\nThe new feature also helps\
    \ defining an overload of lambdas with very little code."
