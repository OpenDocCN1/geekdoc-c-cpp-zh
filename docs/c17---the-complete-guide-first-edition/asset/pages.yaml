  md: "# Directory Entry Caching\n\nImplementations are encouraged to cache additional\
    \ file attributes to avoid additional filesystem when using the entries. However,\
    \ implementations are not required to cache the data, which means that these usually\
    \ cheap operations might become more expensive.^9\n\nBecause all the values are\
    \ usually cached, these calls are usually cheap and therefore member functions:\n\
    \n```\nfor (const auto& e : std::filesystem::directory_iterator(\".\")) {\n  \
    \  auto t = e.last_write_time(); // usually cheap\n}\n```\n\nWhether cached or\
    \ not, in a multi-user or multi-process operating system all these iterations\
    \ might yield data about files that is no longer valid. File contents and therefore\
    \ sizes might change, file might be removed or replaced (thus, file types change),\
    \ and permissions might get modified. In that case you can request to refresh\
    \ the directory entry holds:\n\n```\nfor (const auto& e : std::filesystem::directory_iterator(\"\
    .\")) {\n    // data data becomes old\n    e.refresh(); // cache data for the\
    \ file\n    if (e.exists()) {\n        auto t = e.last_write_time();\n    }\n\
    }\n```\n\nAlternatively, you might always ask for the current situation:\n\n```\n\
    for (const auto& e : std::filesystem::directory_iterator(\".\")) {\n    // data\
    \ data becomes old\n    if (exists(e.path())) {\n        auto t = last_write_time(e.path());\n\
    \    }\n}\n```\n\n> ^9 In fact, the beta implementation of the C++17 filesystem\
    \ library in g++ v9 only caches the file type, not the file size (this might change\
    \ until the library is released)."
