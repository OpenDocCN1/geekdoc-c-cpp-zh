  md: '# # Chapter 27


    # # Polymorphic Memory Resources (PMR)


    Since C++98 the standard library has supported the ability to configure the way
    classes allocate their internal (heap) memory. For that reason, almost all types
    in the standard library that allocate memory have an allocator parameter. Thus,
    you can configure the containers, strings, and other types allocate their internal
    memory if they need more space than the one allocated on the stack.


    The default way to allocate memory is to allocate it from the heap. But there
    are different ways to modify this default behavior:


    +   - You can use your own way of allocating memory to reduce the number of system
    calls.

    - You can ensure that allocated memory is located next to each other to benefit
    from CPU caching.

    - You can place containers and their elements in shared memory available for multiple
    processes.

    - You can even redirect these heap memory calls to use memory earlier allocated
    on the stack.


    However, using allocators (right) until C++17 was in ways both tricky and clunky
    (due to flaws, too much complexity, and modifications with backward compatibility).\nC++17
    now provides a pretty easy-to-use approach for predefined and user-defined ways
    of memory allocation, which can be used for standard types and user-defined types.


    For this reason, this chapter will discuss:


    +   - Using standard memory resources provided by the standard library

    - Defining custom memory resources

    - Providing memory resource support for custom types


    This chapter would not have been possible without the significant help of Pablo
    Halpern, Arthur O''Dwyer, Daniel Sankel, and Jonathan Wakely. A few views explains
    the features provided here:


    > ¹ The initial reason for allocators was to be deal with pointers of different
    size (“near” and “far” pointers).'
