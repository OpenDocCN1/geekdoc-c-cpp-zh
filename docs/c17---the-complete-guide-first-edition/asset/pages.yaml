  md: '# 8.7 Exception Specifications as Part of the Type


    Note that u8 can only be used for single characters and characters that have a
    single byte (code unit) in UTF-8. An initialization such as:


    ```

    char c = u8''ö'';


    is not allowed because the value of the German umlaut in UTF-8 is a sequence of
    two bytes, 195\and 182 (hexadecimal C3 B6).

    ```


    As a result both character and string literals now accept the following prefixes:


    +   * u8 for single-byte US-ASCH and UTF-16 encoding.

    * u for two-byte UTF-16 encoding.

    * U for four-byte UTF-32 encoding.

    * 1 for wide characters without encoding, which might have two or four bytes.


    # 8.7 Exception Specifications as Part of the Type


    Since C++17 exception handling specifications became part of the type of a function.
    That is, the following two functions have two different types:


    ```

    void f1();

    void f2() noexcept; // different type

    ```


    Before C++17, both functions would have had the same type.

    as a consequence, at compiler no longer detect if you use a function throwing
    an exception where a function not throwing an exception is required:


    ```

    void (*fp)() noexcept; // pointer to function that doesn''t throw

    fp = f2; // OK

    fp = f1; // ERROR since C++17

    ```


    Using that function that doesn''t throw functions are still valid, of course:


    ```

    void (*fp2)(); // pointer to function that might throw

    fp2 = f2; // OK

    fp = f1; // OK

    ```


    So, the new feature does not break programs that use noexcept for function pointers,
    yet ensures that we no longer violate noexcept requirements in function pointers
    (which might be extra problems for a good year).

    is is not allowed to overload a function name for the same signature with a different
    exception specification (as it is not allowed to overload functions with different
    types only):


    ```

    void f3();

    void f3() noexcept; // ERROR

    ```


    Note that other rules are not affected. For example, it is still the case that
    you are not allowed to ignore a noexcept specification of a base class:


    ```

    class Base {

    public:

    virtual void foo() noexcept;

    ```'
