  md: "# # Chapter 3\n\n# ## Inline Variables\n\nOne strength of C++ is its ability\
    \ to support the development of header-only libraries. However, up to C++17, this\
    \ was only possible if no global variables/objects were needed or provided by\
    \ such a library.\n\nSince C++17 you can define a variable/object in a header\
    \ file as inline and if this definition is used by multiple translation units,\
    \ they all refer to the same unique object:\n\n```\nclass MyClass {\n    static\
    \ inline std::string name = \"\"; // OK since C++17\n    ...\n};\n```\n\n```\n\
    inline MyClass myGlobalObj; // OK even if included/defined by multiple CPP files\n\
    ```\n\n# 3.1 Motivation of Inline Variables\n\nIn C++, it is not allowed to initialize\
    \ a non-static static member inside the class structure:\n\n```\nclass MyClass\
    \ {\n    static std::string name = \"\"; // Compile-Time ERROR\n    ...\n};\n\
    ```\n\nDefining the variable outside the class structure is also an error, if\
    \ these definitions are part of a header file, included by multiple CPP files:\n\
    \n```\nclass MyClass {\n    static std::string name;      // OK\n};\n\n```\n\n\
    ```\nMyClass::name = \"\"; // Link ERROR if included by multiple CPP files\n```"
