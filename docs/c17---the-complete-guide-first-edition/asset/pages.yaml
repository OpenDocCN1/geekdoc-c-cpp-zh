    # 20.5 Path Modifications


    Path Modifications lists the operations that allow us to modify paths directly.

    While += and concat just append new characters to a path, /, ~, and add a sub
    path with the current directory separator:


    ```

    std::filesystem::path p("myfile");

    p += ".git";                                // p: myfile.git

    pp /= ".git";                              // p: myfile.git/.git

    pp.concat("/git1");                        // p: myfile.git/git1

    pp.append("/git1");                         // p: myfile.git/git1

    std::cout << p << p << ''\n'';

    std::cout << '' << << p << p << ''\n'';

    ```


    On POSIX based systems the output is:


    ```

    "myfile.git/git1/git1"

    "myfile.git/git1/myfile.git/.git1/git1"

    ```


    On Windows systems the output is:


    ```

    "myfile.git\git1\git1"

    "myfile.git\git1\\myfile.git\git1\git1"

    ```


    Note that appending an absolute-path means replacing an existing path. For example,
    after:


    ```

    namespace fs = std::filesystem;

    auto p1 = fs::path("/usr/") / "/tmp";      // path is /usr/tmp or usr\tmp

    auto p2 = fs::path("/usr/") / "/tmp";      // path is /usr/tmp

    auto p3 = fs::path("/usr/") / "/tmp";      // path is /tmp

    ```'
