  md: "# 21.4 std::void_t\n\nThat is, it yields void for a variadic list of template\
    \ parameters. This is helpful, where we only want to deal with types solely in\
    \ an argument list.\n\nThe major advantage is the ability to check for conditions\
    \ when defining new type traits. The following example demonstrates the application\
    \ of this:\n\n```\n#include <utility> // for declval\n#include <type_traits> //\
    \ for true_type, false_type, and void_t\n\n// primary template:\ntemplate<typename\
    \ typename, typename = std::void_t>\nstruct HasVariable : std::false_type\n};\n\
    \n// partial specialization (may be SFINAE'd away):\ntemplate<typename T>\nstruct\
    \ HasVariable<T, std::void_t<decltype(declval<T>().begin()),\n               \
    \                      typename T::difference_type,\n                        \
    \             typename T::iterator>>\n    : std::true_type\n;\n```\n\nHere, we\
    \ define a new type trait HasarrayT<>, which checks for three things:\n\n+   *\
    \ Does the type have a member function begin()?\n* Does the type have a member\
    \ difference_type?\n* Does the type have a member iterator?\n\nThe partial specialization\
    \ is only used, when all the corresponding expressions are valid for a type T.\
    \ It is more specific than the primary template and we derive from std::true_type,\
    \ a check against the value of this type yields true:\n\n```\nif constexpr(HasVariable<T>::value)\
    \ {\n}\n```\n\nIf any of the expressions in invalid code (i.e., T has no begin(),\
    \ or no type difference_type, or no type iterator), the partial specialization\
    \ is SFINAE away, which means that it is ignored due to the rule that substitution\
    \ failure is not an error. Then, only the primary template is available, which\
    \ derives from std::false_type, so that a check against the value of this type\
    \ yields false.\n\nThe same way, you can use std::void_t to easily define other\
    \ traits checking for one or multiple conditions, where the existence/ability\
    \ of a member or operation matters."
