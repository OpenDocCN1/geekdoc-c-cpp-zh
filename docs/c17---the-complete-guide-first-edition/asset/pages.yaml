    \ than the full specialization). The types specified here are the dec type yields\
    \ for structured bindings.\n\nFinally, we define the corresponding overloads of\
    \ a function get<>() in the same name-space as Customer:4\n\n```\ntemplate<std::size_t>\
    \ auto get(const Customer& c);\ntemplate<auto> auto get<0>(const Customer& c)\
    \ { return c.getFirst(); }\ntemplate<auto> auto get<1>(const Customer& c) { return\
    \ c.getLast(); }\ntemplate<auto> auto get<2>(const Customer& c) { return c.getValue();\
    \ }\n```\n\nNote that all full specializations of function templates have the\
    \ same signature (including the exact return type). The reason is that we only\
