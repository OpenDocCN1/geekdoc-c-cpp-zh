  md: '# 19.4 String View Types and Operations


    # Hashing


    The C++ standard library guarantees that hash values for strings and strings views
    are equal.


    # Modifying String View


    There are only a few operations provided to modify a string view:


    +   You can assign a new value or swap the values of the two string views:


    ```

    std::string_view sv1 = "hey";nstd::string_view sv2 = "world";

    sv1.swap(sv2);

    sv2 = sv1;

    ```


    +   You can skip leading or trailing character (i.e., move the beginning to a
    character behind the character or move the end to a character before the last
    character):


    ```

    std::string_view sv = "I like my kindergarten";nsv.remove_prefix(2);

    sv.remove_suffix(8);

    std::cout << sv; // prints like my kind

    ```


    Note that there is no support for operator+.


    ```

    ```

    std::string_view sv1 = "hello";

    std::string_view sv2 = "world"

