    \    if constexpr(sizeof(int) > 4) {\n        return 42;\n    }\n    return 42u;\n\
    }\n```\n\nIf the condition is true (the size of int is greater than 4), the compiler\
    \ deduces two different return types, which is not valid. Otherwise we have one\
    \ return statement that matters, so the code compiles.\n\n# Short-Circuit Compile-Time\
    \ Conditions\n\nConsider the following code:\n\n```\ntemplate<typename T>\nconstexpr\
    \ auto foo(const T& val) -> auto {\n    if constexpr(std::is_integral<T>::value)\
    \ {\n        if constexpr(T{} < 10) {\n            return val * 2;\n        }\n\
    \    }\n    return val;\n}\n```\n\nHere we have two compile-time conditions to\
    \ decide whether the return value as it is or doubled.\n\nThis compiles for:\n\
    \n```\nconstexpr auto x1 = foo(42); // yields 84\nconstexpr auto x2 = foo(\"hi\"\
    ); // OK, yields \"hi\"\n```\n\nConditions in run-time if short-circuiting (evaluating\
    \ conditions with && only until the first false and conditions with || only until\
    \ the first true) might result in the expectation that this is also the case for\
    \ compile-time if:\n\n```\ntemplate<typename T>\nconstexpr auto bar(const T& val)\
    \ {\n    if constexpr(std::is_integral<T>::value && T{} < 10) {\n        return\
    \ val * 2;\n    }\n    return val;\n}\n```"
