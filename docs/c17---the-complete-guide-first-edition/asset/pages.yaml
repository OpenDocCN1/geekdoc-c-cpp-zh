    # 24.2 as_const ()


    The new helper function `as_const()` converts values to the corresponding const
    values without using static_cast<const> or the add_const<t> type trait.

    It allows us to call the const overload of a function for a non-const object in
    case this makes a difference:


    ```

    std::vector<std::string> coll;

    ```


    ```

    foo(coll);

    foo(const coll); // prefers a non-const overload

    foo(std::as_const(coll)); // forces to use the const overload

    ```


    If `foo()` is a template function, this would also force the template to be instantiated
    for a const type rather than the original non-const type.


    # 24.2.1 Capturing by Const Reference


    One application of `as_const()` is the ability to capture lambda parameters by
    const reference. example:


    ```

    std::vector<int> coll{8, 15, 7, 42};

    ```


    ```

    auto printColl = [&coll = std::as_const(coll)] {

