  md: "# 4.1 Motivation for Extended Aggregate Initialization\n\nWithout this feature,\
    \ deriving a structure from another disabled aggregate initialization, so that\
    \ you had to define a constructor:\n\n```\nstruct Cpp14Data : Data {\n    bool\
    \ done;\n    Cpp14Data(const std::string& s, double d, bool b)\n        : Data(s,d),\
    \ done(b) {\n}\n```\n\nCpp14Data y{\"test1\", 6.778, false};\nNow we have the\
    \ freedom to use the syntax using nested braces, which can be omitted if only\
    \ one value is passed:\n\n```\nMoreData x(\"test1\", 6.778, false); // OK since\
    \ C++17\nMoreData y(\"test1\", 6.778, false);    // OK\n```\n\nNote that this\
    \ is an aggregate now, other initializations are possible:\n\n```\nMoreData u;\n\
    // OOP: value/done are uninitialized\nMoreData z();\n// OK: value/done has values\
    \ 0/false\n```\n\nIf this is too dangerous, you still better provide a constructor.\n\
    \n# 4.2 Using Extended Aggregate Initialization\n\nOne typical application is\
    \ the ability to list initialize members of a C style structure derived by class\
    \ to add additional data members or operations. For example:\n\n```\nstruct Data\
    \ {\n    const char* name;\n    double value;\n};\n```\n\n```\nstruct PData :\
    \ Data {\n    bool critical;\n    void print() const {\n        std::cout << '['\
    \ << name << \",\\' << value << \"]\\n\"\n    }\n};\n```\n\n```\nPData y{\"test1\"\
    , 6.778, false};\ny.print();\n```\n\nHere, the arguments in the inner parents\
    \ are passed to the base type Data."
