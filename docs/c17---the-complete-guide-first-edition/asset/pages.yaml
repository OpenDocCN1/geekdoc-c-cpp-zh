    # 27.3.3 Dealing with the Different Types


    While using Pmr with pmr types becomes pretty nice, we have a problem: In general,
    programs use type std::string. So how would we do using both: std::string and
    std::pmr::string?


    First, there is an explicit but no implicit conversion between different string
    types:


    ```

    std::string s;

    std::pmr::string t1(s); // ERROR

    std::pmr::string t2 = s; // ERROR

    s = t1;

    s = std::string(t1); // OK

    ```


    The explicit conversion is supported, because any string implicitly converts to
    a std::string_view, which has an explicit conversion to any string type. The further
    is cheap, but the latter needs to allocate memory (the small string optimization
    does not apply).


    In our example means:


    ```

    std::string s("Paul Kalkbrener"); // ERROR: no implicit conversion

    PmrCustomer c1 = s; // ERROR: no implicit conversion

    PmrCustomer c2{s};

    PmrCustomer c3{std(s)}; // OK (implicitly converts s to string_view)

    ```'
