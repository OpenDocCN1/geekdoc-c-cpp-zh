  md: "# 16.4 Polymorphism and Inhomogeneous Collections with std::variant\n\nstd::variant\
    \ enables a new form of polymorphism and dealing with inhomogeneous collections.\
    \ It is a form of compile-time polymorphism with a close set of data types.\n\n\
    That is, by using a variant<> you can define that an object is one of multiple\
    \ possible types. This object then has value semantics and you can insert these\
    \ objects into inhomogeneous collections. Because each variant knows, which alternative\
    \ it holds, and due to the visitor interface, we can program at runtime for different\
    \ functions/methods are called (without any need for virtual functions, references,\
    \ and pointers).\n\n# 16.4.1 Geometric Objects with std:::variant\n\nFor example,\
    \ let's assume we have to program a system of geometric objects:\n\n```\nlib/variant1.cpp\n\
    #include <iostream>\n#include <variant>\n#include <vector>\n#include \"coord.hpp\"\
    \n#include \"line.hpp\"\n#include \"circle.hpp\"\n#include \"rectangle.hpp\"\n\
    ```\n\n```\n// common type of all geometric objects types:\nusing GeoObj = std::variant<Line,\
    \ Circle, Rectangle>;\n\n// create and initialize a collection of geometric objects:\n\
    st::vector<GeoObj> createGeoObj() {\n    std::vector<GeoObj> f;\n    f.push_back(Line(Coord(1,2),Coord(3,4)));\n\
    \    f.push_back(Circle(Coord(5,5),Coord(2,2)));\n    f.push_back(Rectangle(Coord(3,3),Coord(6,4)));\n\
    \    return f;\n}\n\nint main() {\n    std::vector<GeoObj> figure = createGeoObj();\n\
    \    for (const GeoObj& geobj : figure) {\n        std::visit([](const auto& obj)\
    \ {\n            obj.draw(); // polymorphic call of draw\n        }, geobj);\n\
    \    }\n```"
