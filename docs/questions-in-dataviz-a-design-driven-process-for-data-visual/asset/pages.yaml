  md: '# Chapter 3.2: What alternative ways are there for visualising timelines? 203


    I chose to replicate this Lexis chart using the longevity of English Premier League
    football managers. Note, this chart was from 2018 – the short-term nature of football
    manager jobs in England means that this may now look very different now! (Figure
    3.2.2).


    ![](img/b909e9b4298ba430102dc44c70463458_233_0.png)


    FIGURE 3.2.2 Longevity of Premier League managers.


    In some ways, a Lexis chart could to represent a number of individual timelines
    within one timeline. I love the aesthetic of parallel diagonal lines – every diagonal
    line being read, by definition, from bottom left to top right, as time passes
    (X-axis increases) and length of tenure increases (Y-axis increases) until it
    reaches its abrupt end.


    And so, shortly I wanted to try another Lexis chart, this time looking at lifespans
    and presidential spans of US presidents. In this case, the time from the birth
    of George Washington to the present day was only a little shy of 300 years, in
    excess of the 26-year timeline I used in my Premier League football visualization.
    This resulted out a horizontal design to me, there just would not have been enough
    room to fit everything into a standard screen size without seriously compromising
    readability. It seemed that the main design choice to made was to go long-form,
    hence using a vertical timeline, especially given that this was going to be consumed
    online (Figure 3.2.3).'
