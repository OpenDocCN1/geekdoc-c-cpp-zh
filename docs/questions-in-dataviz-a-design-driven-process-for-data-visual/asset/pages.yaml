  md: '# What is the third wave of data visualisation?


    I''ve partly structured the chapters of this book around the concept of waves
    of data visualisation, and the idea that in the current perceived “third wave”,
    business intelligence tools can be much more custom. It''s that mindset which
    is behind, if not, all of the visualisations I create (certainly those that feature
    in this book), and hence each of the visualisations in the Flood project too.


    I''m keen that this book is agnostic – there are unavoidable mentions of Tableau
    which is the tool I''ve learned, using profession-ally, and the tool that I take
    enjoyment in creating the unconventional with. Twenty-six of the 31 visualisations
    used Tableau, either exclusively or predominantly, and the wide variety of outputs
    show that the ability of a tool to be “more custom” comes not just from the capability
    of the tool itself, but just as importantly from the design mentality of the user
    and their willingness to stretch creatively and technically.


    And that said, it''s important to emphasise during the course of this project,
    to fulfil some of my ideas and ensure that the full complement of 31 visualisations
    used, there were several occasions where I used a different tool to get the result.
    A suite of visualisations showing a variety of outputs across the same data is
    a perfect opportunity to take advantage of the capabilities of different tools,
    and there will always be examples where a different tool has better, faster capabilities
    for the specific output that you''re interested in. Day 14''s stream graph was
    generated using RAWGraphs (Figure 3.11.11).


    There were potential examples for inclusion in this section linking different
    images to different chapter questions: day 18 represented another example of using
    an album cover as inspiration for data visualisation, and a nod to *How can I
    take inspiration from album covers*? It felt right to choose an album cover from
    the same band, not the album cover of the album I was visualising which would
    have been a design step too far and was another project to include within the
    suite.


    And day 5 was an attempt to recreate the idea introduced in “What are Data Portraits?”
    representing each track as a Data Portraits style data badge. I wasn''t overly
    happy with the end result in this instance but I enjoyed the challenge and creative
    process of using the meta-data I had to produce a data portrait output with one
    “badge” for each song.'
  merge: -1
  pgno: 359
- img_proc: true
  md: '# 330 Questions in Dataviz


    ![](img/b909e9b4298ba430102dc44c70463458_360_0.png)


    # They Might Be Giants Flood


    FIGURE 3.11.11 31 days of Flood – day 14.


    In summary, I needed three things for this project before I started in order to
    give it a chance of success and/or completion:


    +   1. Several large, curated datasets

    2. Several pre-formed design ideas

    3. An open, enquiring mind to find inspiration and develop new ideas on the fly

    4. Time


    I know that time () is very often the limiting factor. In my case, this was an
    ideal project during times of pandemic-induced lockdown, and the self-imposed
    time limit focused me to keep working and get to the end of the challenge. But
    if you haven’t timestamped your project, then time is no longer a crucial factor.'
