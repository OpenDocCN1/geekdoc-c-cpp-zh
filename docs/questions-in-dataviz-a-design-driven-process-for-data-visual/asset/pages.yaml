  md: '# Chapter 2.7: Why create unnecessary data visualisations? 161


    more likely to prioritise one or more categories at the expense of the others.


    Essentially, most books, lecturers or presenters will tell you that (2) is the
    most important. Most data visualisation rules would hone in on the principles,
    skills, tools and mindset required to maximise analytical understanding. Attention
    and beauty (1) are not important, in fact they detract from (2). That''s why we
    cut the chartjunk, I hear some of you cry! Category (3) is also important – our
    exploration and our work done in creating our charts and visualisations need to
    lead to an emotional or a rational response.


    All books, lecturers, presenters and other experts are absolutely right! But they
    are not considering the specific situation of a visualiser or designer who just
    wants to throw themselves into an unnecessary project. I would argue that the
    key element for these projects (1) – create something that grabs attention and
    looks great, with an element of (2) – understanding is important, but not so important
    because of the more trivial nature of the subject.


    For-called unnecessary visualisations, it''s (3) that''s less crucial. In fact,
    there is no follow-up, no intended call to action. We just want our readers to
    either enjoy or ignore what we have produced, in many ways the benefit has been
    to us as the producer of the visualisation.


    # Celebrate the unnecessary


    With these thoughts in mind, I have in the past presentations entitled “Celebrate
    the Unnecessary”. Since much of the focus of my book is in encouraging visualisation
    designers to challenge the status quo, do or break the rules, and not visualisation
    seriously for personal projects, it won''t surprise you to read that all these
    are related to encouraging designers to have fun, to really enjoy the process
    of creating projects and to reap the benefits of enjoyment while learning new
    skills and techniques in the process. I list a number of reasons why you might
    want to celebrate the unnecessary in your data visualisations.


    # Celebrate nostalgia


    Projects such as this are a perfect excuse to throw yourself into your favourite
    book, TV series, pastime, etc., from your childhood or years gone by – a subject
    and/or place in time that''s important to you, the creator.'
