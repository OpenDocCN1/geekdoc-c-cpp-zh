- img_proc: true
  md: 'Challenged by fellow Tableau expert as part of an online “Sports Viz Sunday”
    community visualisation project to produce a snooker-themed visualisation, I realised
    that snooker data was quite scarce. This was another example where it soon became
    obvious that rather than look for data to visualise, having decided what I wanted
    to visualise, I would need to create the data myself.


    In deciding to tell the story of every shot in the final frame from 1985, and
    most British people of a certain age will remember exactly what I''m referring
    to, I had one option. I found the match on YouTube, watched it and recorded the
    details and outcome of every shot. I''m not sure if shot by shot data exists with
    detailed metrics in the world of snooker, but I am sure that if it does, it didn''t
    in 1985! The result, not shown here, was a visualisation walking through every
    shot of what was a memorable moment in British sporting history.


    # Personal data


    Another category of visualisation belongs squarely in this category is that of
    personal data. I''m not talking address or bank accounts, data about you and your
    actions, feeling, interactions and surroundings on a daily basis. If you''re undecided
    on the next dataset to use for a project, you can do much worse than recording
    your own personal data – data that hasn’t“happened” yet. And obviously that falls
    into the “impossible to find” category!


    In Chapter 2.4 we mentioned Dear Data – of course, each of the visualisations
    is beautifully designed and created, but less entirely obvious is the fact that
    every one of the datasets used for award-winning project was also hand curated.
    Giorgia Lupi and Stefanie Possibleac'' follow-up book encouraged readers to “Observe,
    Collect, Draw” in order that readers might create their own Dear style visualisations.
    The key to this is the “Collect” stage. If you need data, collect it yourself!


    # Conclusion


    All datasets you obtain from regular sources were collected by a human at one
    point – either directly or indirectly via a program, device or app initially programmed
    and designed by a human.'
