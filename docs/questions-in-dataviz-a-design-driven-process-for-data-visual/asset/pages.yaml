  md: '# Move beyond standards


    This observation feels worth emphasising and is again probably essential to the
    philosophy of data humanism. I interpret this as looking past the standard chart
    types, or not being restricted to depict data visually in the most conventionally
    accepted ways. In circumstances where data is becoming less perfect, and more
    aggregated and personal, we have opportunities to be more creative and less conventional
    in how we show the data. After all, if we accept that we want our audience to
    spend more time with the data, then perhaps gives us the green light to move away
    from bar charts?


    I don’t intentionally malign bar charts, by the way, I simply use them as an example
    of the simplest, most conventional and easiest understand charts – I wouldn’t
    disagree that they are often the clearest and best choice. But, in a quote from
    Amanda Cox, now editor of the New York Times journalism section The Upshot, that
    would be criminal of me not to include it in this book somewhere given my approach
    to data visualisation:


    > There’s a strand of the viz world that argues everything could be a bar chart.
    That’s possibly true but also possibly a world without joy.


    # Sketch with data


    This could be interpreted in different ways – in the most literal sense, moving
    to human-based data visualisation allows us to consider non-digital output, why
    not?! The human-centred, imperfect, individual nature of data is a perfect candidate
    for pen, pencil and paper for your output: sketching data in its traditional sense.
    And we’ll see some inspirational examples of this later in the chapter.


    # Data sketches


    However, I don’t think this has to necessarily mean that the process of data visualisation
    should start, or even finish, with a traditional sketch, though there are many
    times this is great advice to gain an early understanding of your data and intended
    process. Generally, it’s more of a concept I would tie in with the message above,
