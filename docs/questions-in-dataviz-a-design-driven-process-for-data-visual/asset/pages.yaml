  md: '# Preface


    I worked for over 20 years in a Market Research data processing career.


    Now I''ve started with what might be the most soul-destroying sentence I write
    in this whole book, so if you''ve made it past that first sentence, I hope you
    stay! I did enjoy those days, to a point, even though were many of them – the
    meticulous and logical process of collecting data, processing data and handing
    over vast printed decks of numbers to internal clients suited my analytical and
    introverted nature. And the limited programming knowledge needed to write online
    surveys was just about my technical level.


    But I would never see the results of my labours. I knew how survey results were
    interpreted or reacted upon, or even whether they were genuinely understood. I
    saw a load of numbers printed in black on a lot of paper. A mathematician by trade
    I might have been, even if I didn''t get inspired by, the numbers told no story
    and held no attention. My limited interest in what I did for a living ended each
    day the second I logged off or left the office.


    But then a few things happened around the year 2015. First, I began to be more
    aware of data visualisation in the media world around me. I''d seen really engaging
    charts online or in print in the'
  merge: -1
  pgno: 9
- img_proc: true
  md: '# x Preface


    Guardian, or National Geographic, or the BBC. I bought books aimed at the public
    such as David McCandless''s Information is Beautiful – I loved the fact that more
    striking versions of these kinds of visually engaging yet data-filled charts were
    made for coffee table reading for a layperson like me. I began to realise that
    it was OK to be interested in this kind of thing, that there was a whole scientific
    and creative field that existed around it. As a consumer, data visualisation really
    appealed to me – it was a visual medium I could really understand.


    Towards the end of the year, the small consultancy where I was working started
    looking at a software tool called Tableau, and I got hold of a trial version.
    We were interested in seeing results in a visual manner, not just as numbers on
    a printed deck or in an Excel spreadsheet. Tableau ticked the box as a Business
    Intelligence (BI) tool with great data visualisation capabilities, and that''s
    why we made tentative exploratory steps in its direction.


    But this book is not about any specific tool or methodology. This book is about
    a journey into data visualisation. And still in 2015, my job abruptly came to
    an end. The Tableau experiment at work had not been a success but it opened my
    eyes. What if people like me, with readily available Business Intelligence tools,
    could create these kinds of charts and visualisations that make it into the books
    I like to read and websites I like to visit? And although it didn''t apply to
    my own situation, the question could equally apply to those with other coding
    tools and libraries readily available who had the ability and willingness to code
    – could they also create these kinds of charts and visualisations?


    Is this how I could escape Market Research and get into a different field that
    was both analytical and creative? A way of creating pictures and not numbers?
    Could that be a really exciting shift from my comfort zone as a mathematics graduate.
    What if I could get paid for it, and, even better, what if we could do it for
    fun? Could I be a creator of data visualisation as well as an interested consumer?
    I was asking a lot of questions and I''d barely started!


    In my next role, I was delighted to use Tableau, this time in a social research
    field, and move my skills away from the number crunching non-visual background
    of my past experience. But, as is often the case, my tasks at my new company were
    many and varied, meaning that my chances to envisage data, though good, relatively
    limited. I knew I could improve my new data visualisation'
