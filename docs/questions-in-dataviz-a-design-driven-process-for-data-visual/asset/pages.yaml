    # ## Generative art


    The thinking behind this chapter and this question arises from the theme of generative
    art. Generative art is growing noticeably in popularity – many notable data visualisation
    practitioners and data artists are beginning to produce striking and often highly
    artistic creations.


    With my own preference for data art, creative visualisations and poster-style
    static output that would look great on display, I had been wondering if generative
    art would represent a natural progression for me. It could certainly be something
    that would be the next stage in my own personal development, or means to creating
    something new to add to my increasingly eclectic data visualisation portfolio.


    At the start of 2021, the hashtag #generuary2021 began to proliferate on Twitter,
    full of examples of generative art, with each day having a “rule” to guide participants.
    It wasn’t a new concept by any means, but this was the first time it had really
    come to me'
