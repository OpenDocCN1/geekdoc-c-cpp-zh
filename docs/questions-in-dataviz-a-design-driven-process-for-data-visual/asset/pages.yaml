  md: '# 298 Questions in Dataviz


    I wondered what insights and patterns Handel’s Water Music show. After all, I
    wasn''t very familiar with the piece and hadn''t picked it with a musical reasoning
    in mind. I picked it for no other reason than wordplay based on a word in its
    title.


    Fortunately, I knew I was choosing a Baroque classic. I did know that Baroque
    music was more systematic and melodic than its classical and romantic descendants.
    Masters of Baroque music loved to demonstrate and repeat a theme, with variations
    – in other words, there is more mathematics in Baroque music, and more regularity
    of patterns to be designed. Pachelbel certainly falls into that category, but
    so does Handel.


    Handel was born in the year (1685) as Johann Sebastian Bach, and was an exact
    contemporary of his. The seminal book, Gödel, Escher, Bach: An Eternal Golden
    Braid by Douglas Hofstadter links the themes of regularity and recursion as found
    in the works of mathematician Gödel, artist Escher and baroque musician Bach.
    It uses this as a basis for talking cognition and intelligence in computing, which
    was pretty forward-thinking for a 1979 book. But getting back on track, from my
    point of view, as a mathematician who ad the tessellating patterns of Escher,
    it''s enough of a signpost to confirm that I''m looking in the right sphere of
    music.


    The way to read Rougeux''s piece and moving is essentially the same, whether we
    are looking at a timeline, showing the timeline in circular form rather than straight,
    and then showing the pitch of each individual note on the axis. What would be
    the y-axis on a normal horizontal timeline graph becomes the radius, distance
    from the circle''s centre, on a radial timeline graph.


    We''re actually not restricted to traditional horizontal timelines either does
    anyone remember the video game Guitar Hero? Presenting a vertical moving 3D timeline
    ... this game visualised notes of different pitches moving towards you, to be
    played when the note reached the “front” of the screen. Leaving Guitar Hero to
