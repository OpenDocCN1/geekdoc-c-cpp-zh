  md: '# 48 Questions in Dataviz


    When considering storytelling:


    +   - Think what we mean by storytelling in the context of data visualisation
    – there are many interpretations on the theme: which, if any, interpretation do
    we want to follow?


    +   - Think whether the data has one obvious story you want to emphasise – are
    the “sub-plots” best left un-highlighted, or do you want your readers to be able
    to find them just as easily?


    +   - Connected to the above, think whether you want your audience to explore
    the data you are visualising to find their own insight, or to focus on the story
    you want to tell them.


    +   - Think if there is really a story – is your well-intended desire to create
    and tell a story with your data telling (at least exaggerating) a story that is
    not statistically proven or factual?


    +   - Decide if it’s really necessary to focus on storytelling – perhaps your
    pleasure is going to be from creating an exploratory (or data art style) visualisation
    and allowing your audience to consume, explore and enjoy at their leisure.


    I’ll conclude by saying that “storytelling” is enough of a buzzword to evoke a
    wide range of often diametrically opposed opinions. If you explore and understand
    your data and present it truthfully in a way that engages and intrigues your intended
    audience, then the argument as to whether you are telling a story is a moot one.
    And whatever your definition, sometimes the mantra of “Show, don’t tell” comes
    into play – you don’t always have to feel obliged to tell a story with every visualisation.


    First


    Challenging


    Idea'
