- img_proc: true
  md: '# Chapter 2.4: What is data humanism? 121


    to influence how we think about the story we want to tell, in turn making it more
    meaningful.


    # Embrace complexity


    One of the key concepts might be counter-intuitive at first, but as data has expanded
    and become larger in quantity, to reach any conclusion, the result has usually
    been an increase in simplicity. Georgia quotes the example of the US election
    predictions in 2016 where huge amounts of data were condensed into just one or
    two numbers. My UK compatriots undoubtedly be able to come up with some very high
    profile and similar election predictions!


    For example, FiveThirtyEight, a prominent American website whose name derives
    from the number of seats in the US electoral college and focuses on political
    opinion poll analysis, condensed its pre-2016 US Election results into one forecast
    giving Trump a 3% chance of winning.


    Of course, that didn''t mean Trump couldn''t win, but the simplified (arguably
    over-simplified) nature of the headline prediction, however correct, confused
    the public, including experts, and believing there was only one possible election
    result. Or at the very least, it surprised many of the public when results were
    called. This was a great example of this effect.


    We can learn so much more by introducing, visualising and explaining more levels
    of complexity, to elaborate the context, margin of error and any other attenuating
    circumstances that an over-simplified projection hides.


    # Data capture process is becoming more personal


    The data capture process is becoming more personal, and as a result, this process
    brings in empathy with it. In the so-called peak big data era, it was difficult
    to find empathy within data visualisations, but the humanisation ethos is changing
    this. The personal process of data collection also allows us to acknowledge the
    imperfection of data, and we can demonstrate this imperfection within the visualisation
    of the data.


    It’s important to acknowledge that this is also the case even when data appears
    to come from a non-human source. What if the data comes from a sensor, or a survey,
    or a systems database? All of'
