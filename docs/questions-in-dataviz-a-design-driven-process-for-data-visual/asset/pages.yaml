    # Getting your story across


    More important is to understand that the more seriously, or literally, you consider
    storytelling the more emotive the subject becomes and the livelier the debate
    becomes! It’s probably summed up by saying that data storytelling is about getting
    your point across in a clear and engaging way to your audience – this might sometimes
    be done by use of a good narrative.


    And the key thing is that a visualisation should aim to convey the message that
    it’s intended to convey. Cole’s blog then makes a distinction between a “Story”
    (with upper case S) and a story (sic), the latter lower-case definition considering
    the use of intended message of your visualisation. Perhaps the conclusion is that
    every visualisation should tell a “story” (lower case s)?


    If I had to zone in one of the opinions above, I would link the metaphor of data
    storytelling with recounting an anecdote, and then we get close to what those
    advocating storytelling are describing. Meet me and I tell you some stats/numbers,
    and you forget me too. Meet me and I tell you a great anecdote, you’re far more
    likely to remember both me and what I told you. That’s surely a key of good visualisation.


    There’s an additional principle that Cole mentions which I didn’t include earlier:
    be clear on your intent. This brings us to the concept of exploratory and explanatory
    visualisation. Regardless of what data you are using, what stories you mind and
    find are there in the data for you to visualise, or what chart types you use,
    you have two contrasting options as a designer.


    Your first option (explanatory visualisation) is to lead your reader to the conclusion
    you have found, to present the data and explain these findings clearly. This doesn’t
    mean you have necessarily come up with some ground-breaking analysis or assembled
    some data'
