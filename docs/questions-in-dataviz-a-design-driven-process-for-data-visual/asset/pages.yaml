  md: '# Chapter 2.2: Why do we visualise using triangles? 91


    Starting with the downsides – a detractor of the visualisation, and of the choice
    of triangles, in particular, might say that it’s very difficult to interpret the
    ratio of volumes. Look at the largest triangle on the map, of Lake Mead, the rightmost
    example on the map above. The dark blue triangle, representing how full the reservoir,
    looks to be a little more than half the height of the light blue triangle, from
    the bottom point to the horizontal surface. You would estimate that as 35%, without
    the prompt? I''m not sure I would. It would look around half full – maybe the
    triangles are really confusing here?


    But think the triangles work really well here. It wouldn’t make sense in a form
    without water at the bottom and emptiness at the top. And in terms of shape, we
    know that a reservoir is likely to be narrower at the bottom than the top. Of
    course, we are unlikely to be completely triangular in cross-section, and it’s
    not too much of a stretch to think that this the cross-section of a reservoir
    might look like simple two-dimensional form.


    And, crucially, for every major reservoir on the chart, we are told the percentage
    full amount. The image draws us in – maybe the triangular nature even adds to
    the impact of the image, the difference in triangle sizes tells the story – we
    are instantly shown in a visual manner how much lower levels are than their maxima,
    and then the annotation gives us the numerical detail if that''s important to
    us.


    Imagine if, instead, this was a map of California and surrounding areas with a
    couple of dozen pie charts. We might be able to visually judge the percentages
    of water in each reservoir, but we wouldn’t get nearly such a clear representation
