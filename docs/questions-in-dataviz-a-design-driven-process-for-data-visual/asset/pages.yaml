  md: '# Questions in Dataviz


    For me, this represented design-driven data in its purest form. First, I chose
    a specific design for my visualisation. Second, I found data that generated a
    visualisation that approximated, but didn''t exactly replicate, that design. And
    from that point, the process took its traditional linear form – using the data
    to generate an accurate, albeit artistic and abstract, data visualisation.


    # Design-driven data


    Before I explain the visualisation above, my inspiration for the concept of “design-driven
    data” came from the humanism slide introduced at the end of the previous chapter.
    I knew that in starting to experiment with different design ideas, such as recreating
    ridgeline plots to emulate the Joy Division album cover, for example, I found
    designing inspire to create interesting and unorthodox data visualisations, and
    finding data that enabled me to complete the output. The Data Humanism slide was
    validation for me – “design-driven data” was a new concept that had been coined
    there, I had my green light to go ahead with more designs!


    It''s important to note that by introducing the concept of design-driven data,
    I directly challenged my thoughts in the earlier chapter. In Chapter 1.1, we asked
    our very first question: Should the data drive the visualisation? I''m always
    happy to consider both sides of my experiences change. It''s often said that you
    need to know and understand the rules in order to know when to break them. This
    could certainly be said to apply to data visualisation, particularly if you replace
    “rules” with “best practices”.


    And some of the visualisations you have seen up until now, and what you will see
    in subsequent chapters, would also be classified as design-driven data. If you
    want to undertake projects that you would consider design-driven data, you need
    an appreciation of the fact that it''s the counter-intuitive way to design a visualisation.


    Is this what Giorgia had in mind when she introduced design-driven data in her
    data humanism talk? Not exactly – in subsequent and later discussions on the topic,
    I confirmed to me that she had different thoughts on its meaning and considered
    the term as the opposite of data-driven design because she was envisioning a renaissance
    where we would design the ways we collect, analyse, interpret and present data.


    ![](img/b909e9b4298ba430102dc44c70463458_164_0.png)'
