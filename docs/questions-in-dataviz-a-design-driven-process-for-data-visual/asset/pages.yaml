    # Adverse reaction to the visualisation


    When I shared the above visualisation online, it agitated some readers, and here
    are some of the reasons I think why:


    First, it''s obviously not a map. It''s perhaps unfair to use the word “obviously”
    here, because after all, I''ve chosen to make it look like a map of the United
    Kingdom. With each area seemingly represented by just one animal, each circle
    represents the most common pet in each geographical area?


    But do people really think that all dog and cat preferring areas are always diagonal
    to each other and never meet? That people who prefer to fish only live in the
    sea? It doesn''t take much to realise that this would never be the case, but that
    time is longer than many people''s attention span and longer than the time it
    can take some people to get outraged!


    It''s certainly not my intention to be derogatory here, because I include my own
    attention span in there too, specifically in the context of a visualisation published
    on social media. The medium of Twitter and fast-paced snippets of social media
    information mean that people need to understand things instantly.'
