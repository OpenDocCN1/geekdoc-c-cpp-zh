  md: 'Lupi introduced her vision for how data visualisation could, or perhaps should,
    change, after the “big data” and “peak infographics” era, by introducing the concept
    of Data Humanism.


    # Data humanism


    Now I''d never heard of the term humanism in any context – it turns out that humanism
    was a Renaissance term when scholars and artists began to consider that humans,
    not God, were at the centre of the world. Now this way of thinking led to including
    considerations such as empathy, imperfection and human qualities in their cultural
    output of the time.


    It would be unfair of me to include or give commentary on the talks and articles
    in full detail here, since to appreciate and understand the idea in full there’s
    no better way to listen or read as Giorgia intended. However, it’s true that many
    of the points raised have particularly resonated with me and influenced my way
    of thinking and personal preferences within data visualisation.


    These are my takeaways of how the way we think of data visualisation would change
    in a “post-peak infographics wave” around data humanism in my own perspective.


    # Data visualisation must be more meaningful


    Instead of simplifying and heading towards a crowd-pleasing infographic, thinking
    in a way that involves data humanism leads to visualisations being more thoughtful
    where both the data and the output are concerned. It’s up to us to question what
    the data means more. And I’m all for asking questions!


    # Data visualisation will be more about personalisation


    This reminds us that data is almost always connected to humans. To that extent,
    very often a particular record of data that we are visualising is related to a
    particular human. We might not have personal details of that individual person,
    and in the age of data protection, privacy and GDPR, this is almost certainly
    for good reason, but remembering that we are looking at data on a human level
    is likely'
  merge: -1
