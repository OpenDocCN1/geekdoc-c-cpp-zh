    Indeed, Russert and Munro describe this chart as “memorable, and experimental”
    – and for those aware of Du Bois’ work, the likelihood that this work (sometimes
    described eponymously as a Du Bois spiral) is one of the best known from the collection.
    Given my penchant for being experimental and encouraging others to question established
    methods yourself, it''s important to mention that it doesn''t necessarily follow
    that experimental means memorable, but if done well, I believe experimentation
    is one of the best ways for a more memorable visualisation.


    Inspired by what I had seen, studied and learned from Du Bois, I wanted to recreate
