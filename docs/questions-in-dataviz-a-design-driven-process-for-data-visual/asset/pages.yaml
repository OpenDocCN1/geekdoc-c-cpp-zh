  md: '# # Chapter 3.4

    What are Data Portraits?


    I got a couple of my best students and put a series of facts into charts.


    > W.E.B. Du Bois


    # ## Data visualisation as a portrait


    Sometimes there''s a term that aptly summarises a particular ethos of looking
    at data visualisation. We''ve mentioned several times here the unavoidable cliché
    of data storytelling, but we''ve also made clear that it''s a heavily used term
    which leads to varying opinions on its importance and meaning.


    But if we don''t talk about data telling a story, what about data painting a picture?
    Leaving aside the obvious cliché about painting a thousand words, I do like the
    term. Introducing the idea of a portrait emphas the visual element of data visualisation.
    Throughout this book, I have tried to encourage the thought processes and creative
    processes to produce visualisations that appeal to the aesthetics, which might
    initially create impact, with the trade-off that (intentionally) take time to
    be viewed, understood and consumed.'
  merge: -1
