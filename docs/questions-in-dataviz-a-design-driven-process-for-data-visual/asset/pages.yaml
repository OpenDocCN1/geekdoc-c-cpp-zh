  md: 'will have a section of your audience who can see no further than the usability
    of your output as a business chart. Those who will use the hashtag #shouldhavebeenabarchart
    or similar. And that''s OK.


    I bear no disrespect to this section of any audience. Indeed, it''s a perfectly
    understandable reaction to have, especially if you use what is a traditional BI
    tool to create traditional output, except that you are not designing with a business
    audience in mind. At this point, I hope you''re not – you may need to go back
    and re-read a few chapters if you are!


    Your audience consists of two cohorts of people: those who will appreciate an
    interesting, impactful and sometimes unconventional visualisation, and with, provided
    it''s not intended for business consumption, generally prefer it to the bar chart
    it could have been. The second cohort of people is yourself. If you love your
    final output, take pride in it and are generally rather chấted at the way it turned
    out, that''s every bit of important.


    That''s not to say that I want you to be our harshest critic, although there will
    inevitably be designs, charts and creations that you don''t publish because you
    don''t like the result, and that''s OK. It''s more to say that you will have greater
    success if the aim for your final design is something that you, really appreciate.
    Don''t design for yourself, your personal projects, in particular, to please others,
    but to please yourself. That way, you will enjoy the visualization process despite
    despite times when it becomes lengthy, and get most satisfaction from reaching
    the end and publishing your final creation.


    And speaking of Alberto Cairo, he writes about the Data Sketches book in an article
    in the Data Visualization Society''s Nightingale publication entitled Orthodoxy
    and Eccentricity. The inclusion of the following lines is absolutely key to why
    we celebrate the beautiful data visualisation work of Bremer and Wu (and others
    like them), as well as being crucial to the ethos of this book and our way of
    thinking:


    > The education of visualization designers, whether it''s formal or not, can''t
    be based on memorizing rules, but on learning how to justify our own choices based
    on ethics, aesthetics, and the incomplete but ever-expanding body of empirical
    evidence coming from research and academia.'
