  md: 'The two terms must represent entirely separate entities. A design-driven data
    visualisation, as described in my earlier chapter, should, absolutely, still be
    a particular type of “dataviz” – a subset of data visualisation as a whole.


    For reasons, I spent a lot of time on design. The total number of pets I had in
    the data was 55.5 million. I could represent this with 555 separate circles, 100,000
    pets for each. Considering the prime factors of 555 led me to a rectangle of 37
    by 15 giving exactly 555 squares. Could I then fashion a map of the UK so that
    350 squares were filled with alternating fish and 205 with land-based pets?


    It became a low-tech exercise using an outline map of the UK on half of my screen
    and colouring in square in Excel the other half, counting exact numbers so that
    all correspond exactly with the data. A lot of painstaking tweaking was to get
    the 350/205 ratio exactly right and the sea “coloured” in with the two types of
    fish owners before the land-based pets included.


    Yes, the placings of the land animals are completely arbitrary, with my only design
    constraint that I didn’t want to place two of the same colour circles next to
    each other. Apart from that, the visualisation includes “easter eggs” in the form
    of UK geography puns, known only to me since publishing the visualisation, at
    least until now!


    Only I know that I put one of the reptile circles on Lizard Point, the UK’s southernmost
    point in the far circles. I chose to put a caged bird, represented by a salmon
    colour circle, in London to approximate where Canary Wharf can be found, though
    London is big enough to include Isle of Dogs and Catford. This’s a black circle
    representing a rabbit approximately over the Nottingham suburb of Bunny. The reader
    knows none of these things, but I create data visisations for fun, so I’m going
    to have fun including these elements, while still adhering strictly to the correct
    corrections.


    And knowing the reasoning above, in my original blog post on the subject I challenged
