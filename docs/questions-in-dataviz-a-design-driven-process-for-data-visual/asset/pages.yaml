  md: 'Chapter 3.3: Why do I use flowers to envisage data? 213


    # Geometry of flowers


    A lot of my inspiration to create unusual visualisation forms comes from my lack
    of artistic ability. I can occasionally have a creative idea, whether in the form
    of art, music or writing, but I lack the skill to carry it out. In the case of
    music, my potential career as a musician peter out very quickly when I stopped
    practising instruments as a surly teenager. A good theoretical understanding was
    not enough when I was too physically uncoordinated to become a natural and too
    apathetic to improve on the base level of skill I had reached.


    As an artist, it''s just plainly that I have never been able to draw or paint.
    And where writing is concerned – well I''ll let you make your mind up. So, I get
    a lot of satisfaction from creating shapes, pictures and artistic versions of
    objects using data because in many cases it''s the first time I''ve ever tried
    to undertake a creative process with any degree of success.


    And if me, you''ve tried and failed to learn to draw graphics packages such as
    Illustrator or Procreate, you''ll know that very often the skill of building any
    image comes from building a series of geometric dots, lines or shapes in layers,
    until the combination of these layers on top of each other start to remember your
    intended picture.


    I''m a mathematician by training, and so the geometry needed to allow our software
    packages to draw the right constituent shapes and orientations doesn''t put me
    off – in fact it''s a plus point. It''s this process of layering shapes that is
    pretty exactly what I am doing when I create data visualisations as such flowers.


    So, to it true that there is a mathematical and geometric element to flower-themed
    visualisations and similar outputs that evolve from the creation of layers of
    shapes and polygons. If you''re not too daunted by the prospect of geometry underlying
    your final visualisations, then I hope, like me, you''ll find the aesthetic reward
    is worth the mathematical brain workout.


    A flower is an ideal example because it is both aesthetically pleasing to view,
    and usually a combination of many geometrical shapes and principles. After all,
    a flower is usually a combination of circles and radially arranged ellipses. In
    addition, the stalk of a flower can be a line chart either curved or stepped.'
  merge: -1
  pgno: 243
- img_proc: true
  md: 'Additionally, flowers are often multi-coloured, where it''s not unusual for
    the central part to be one colour, with petals being a second-colour, or even
    alternating between a second and third colour. Their circular nature, the stems
    notwithstanding, makes them perfect for a good economical use of space within
    visualisations, multiple or otherwise.


    Take the bottom right flower in Figure 3.3.1, which represents Manchester United.
    Each petal is generated by data points. Square numbers are encoded by position,
    number of matches by size, and presence in the initial team by colour. Because
    not all squad numbers are used, and some players play more regularly than others,
    all of this gives an irregularity to the flower which makes it look more natural.
    Overlapping petals give it more organic and realistic feel, and the different
    centre sizes, which are also encoded by data – the overall team score at the time
    of creating the visualisation, give a nice heterogeneity to the range of flowers.


    Were I to try and draw a flower, I would have neither the skill nor the nous to
    draw a flower that wasn''t much more symmetrical, more regular in shape and generally
    unnatural looking. And it goes without saying that it would be much less skilfully
    drawn/created.


    # Further flower examples


    Before I go further into the benefits of visualising in this format, the Premier
    League visualisation was by no means the first time I had tried something like
    this. A example was the visualisation for Operation Fistula charity, which has
    already featured in 2.4 What is data humanism? Here the flowers'' colour and position
    encode data points, as well as the curve of the stem. This also noticeably encodes
    the flowers'' roots as well, appearing to anchor each flower in place adding the
    effect to a field of flowers in the breeze.


    Another example where I have used the flower motif is in this visualisation of
    Rugby World Cup individual match results in 2019. Apart from the benefits of making
    something creative and geometrical, you might wonder why I chose a flower motif
    to represent rugby Cup scores? In this case, I wanted to emulate the look of the
    cherry blossom plant, an iconic image of the host country, Japan.'
