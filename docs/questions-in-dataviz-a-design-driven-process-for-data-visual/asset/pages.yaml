  md: '# Chapter 2.9: What can I do when data is impossible to find? 189


    Chances the devices I mention were pencil and paper – you too can do the same
    thing in order to guarantee a unique, personal dataset that allows you to be conventional
    or creative as you like in how you visualise your next project.


    And outside of personal data, the fact remains that often the best way to get
    hold of data, if there''s something very specific you want, to record, curate,
    collate and shape it yourself. If it means you to watch your favourite TV programs
    or films, or to read your favourite books, then so be it!


    # End of Section II


    The aim of the second section was to show that although there are probably a number
    of ideas or principles you have learned to follow which are deemed good practice,
    in following these guidelines, which exist in good faith to help analysts and
    data visualisation practitioners to produce the clearest and most analytical outputs,
    it can often mean missing out on alternative outputs.


    These alternatives can be more eye-catching, more aesthetically pleasing, more
    fun to create, or simply offer alternative visual perspectives. And it''s not
    always as simple as whether something is suitable or not for a business client,
    because you may be fortunate enough to have a situation where the alternative
    perspectives hit the client brief, in cases when your client genuinely wants something
    a little bit different! Remember that asking questions reminds you to consider
    your intended audience, to consider your own preferences and goals for the project,
    and to consider the balance you want to strike between the two.


    In Section III we''ll see several examples where this leads to new ideas that
    can expand your data visualisation skillset while expanding your creative portfolio.'
