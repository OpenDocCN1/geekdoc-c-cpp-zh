  md: '# Triangle grids


    Other uses of the triangle motif had more relevance to the themes alluded to in
    this chapter. Often, a visualisation, or an element of a visualisation, will take
    the form of a triangle, because a full square visualisation would leave half of
    the square unused. This is particularly the case when your visualisation is in
    the form of a grid. If the same dimension is shown on both the x and y axes, you
    can get redundancy.


    Here is no need to show a square because the data would be exactly the same. It''s
    the same distance from, say, Edinburgh to Leeds, as it would be from Leeds to
    Edinburgh. As a triangular graph results, in order to frame just the necessary
    data (Figure 2.2.7).


    Similarly, the data may only make sense in half of the grid. For my next example,
    I was inspired by a similar chart I had seen in the Financial Times when the chart
    had the year of purchasing a house on the x-axis with, perhaps unusually, most
    recent year at the top, and year of the same house''s sale in the y-axis left
    to right.


    ![](img/b909e9b4298ba430102dc44c70463458_125_0.png)


