    and non-standard visualisation about football? Quite the opposite.


    If I only cared about one story, for Leicester''s success, then with Cole''s guiding
    principles I could have created a much simpler and entirely different visualisation
    that told story. It could include some, or all, of the other data, but we would
    “grey them out” literally and/or metaphorically to guide our reader through the
    narrative of our story to reach the conclusion we wanted to share.


    You could consider that an exploratory visualisation which might be heavy on data,
    and granularity is similar to a “choose your own adventure” type story, the kind
    of which was popular when I was growing up. I have used one story, to prompt me
    into investigating, visualising and presenting data for the reader to delve further
    by themselves. We are asking the consumer to discover and enjoy their own story.
    Or perhaps endure, rather than enjoy, in the case of Aston Villa fans!


    # Storytelling caves


