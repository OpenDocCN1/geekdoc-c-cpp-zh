  md: '# Data encoding in flowers


    Flowers and their stalks give the opportunity to encode many different dimensions.
    Petals can be different shapes, sizes, colours, in different positions, as well
    as being filled or empty. The central area can also be represented by different
    shapes, sizes or colours. That''s up to eight different dimensions to encode in
    one flower, and that''s if we include just colour in the petals.


    An additional trick I have used in each of my flower visualisations is to tell
    a different story with the flowers'' stems. The football and rugby visualisations
    disguise a line chart in the form of a stem, designed so that there is a possibility
    of sloping on average to the left, right or vertically. This has the tendency
    to “sway” the flower to the left or right, adding a less regular and more organic
    look to each visualisation. The Operation Fistula visualisation also encodes slope
    into the stem, curving in relation to each woman''s age.


    The visualisation from Ivett Kovacs and Istvan Korpai, two expert data visualisation
    practitioners from Starschema in Hungary, was a great inspiration to me on two
    levels. Ivett uses flowers (arranged simply in two layers of four petals around
    a central circle) to visualize gender and ethnic diversity in tech innovations.


    Visualising an important subject in a simple and impactful way, while comparing
    the 100 companies with each other in a pleasing 10 x 10 grid was an small multiple
    grid as a means spur to me the aesthetic choice of flower data visualisation and
    as a means for showing disaggregated data. In fact, you can see my own non-flower
    version using the same data in the earlier chapter on small multiples (Figure
    3.3.3).


    ![](img/b909e9b4298ba430102dc44c70463458_246_0.png)


    FIGURE 3.3.3 Operation Fistula.'
