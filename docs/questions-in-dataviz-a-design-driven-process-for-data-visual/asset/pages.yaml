  md: '# Motivation of unnecessary visualisation


    Andy''s book is a reminder of the importance of fun elements to visualise. As
    a reader, we really get the understanding that there is a well-respected professional
    in the field who just wanted to have fun visualising his favourite TV programme
    in great detail. His intended audience, I would imagine, without wishing to speak
    on his behalf, is niche – those who love the show, those who love data visualisation
    in all its forms and those who wanted to support the charity that was benefiting
    from the profits of the print run of this particular book. For me there were two
    ticks out of three, because I don''t really know the show. But I still get great
    pleasure where the designer is really expressing his or her joy in the topic.


    And it''s visualisations like this, where we visualise our favourite topics, most
    for our own benefit, that can give me the most satisfaction, can motivate me to
    get out of creative slumps and have visualising. Even if, to the wider world,
    it might seem unnecessary. Whether it is the recipient of another designer''s
    design project, or whether you yourself are the designer of something that others
    would consider utterly unnecessary, the global data visualisation is much poorer
    without such visualisations.


    As data visualisation designers, whatever your role, for example: presenting business
    charts, being a data journalist, creating a data piece, you are focusing on three
    areas of your craft:


    +   1. Attention / Beauty: you''re interested in the aesthetic and impact of your
    visualisation and hoping that it gets attention and interest


    +   2. Analytics / Understanding: you''re using data and showing it to really
    explain your data and help your reader, whether that be your client, your audience,
    your boss, your executives, see and understand their data


    +   3. Take away message / Call to action: you''re proving or demonstrating a
    trend, summarising findings, evoking follow actions


    The merits of all the above three sections could be debated at length and could
    easily fill a whole chapter or book. Very few visualisation pieces achieve all
    of the above three categories 100%, that''s practically not possible. Our intentions
    for a given visualisation are'
