  md: 'Chapter 31.11: How do you create 31 visualisations in a month? 331


    It''s my belief that continually questioning the principles you learn and developing
    your own design questions that you have the inspiration to find and create the
    first of these things (1), as well as the confidence, the learned thought processes
    and eventual experience to have the second of these things in your data visualisation
    portfolio (2).


    And you''re very unlikely to make it far into a project without the enquiring
    mind, experimental nature and most of all the enjoyment to make it to the end
    with new ideas that you can put into practice (3).


    # Conclusion


    A month-long challenge focuses the mind to experiment, be creative and commit
    to ideas. Thirty-one visualisations is a chance to challenge every one of the
    chapters in this book and more – after all, if there is an advantage gained and
    learned from each chapter, there are 31 times the opportunity to experience that
    in projects as such.


    And if you are pleased with the results of even one of your visualisations, having
    had the opportunity to learn from the process of creating many others, you can
    count it a success – a success earned is one more of a success.


    # End of Section III


    Right from the start of the book, we''ve walked through a wide range of questions
    eventually leading to many of the ideas and projects that have influenced my own
    data visualisation projects.


    Your journey will be different - you will have different ideas and different inspirations.
    It hasn''t been my aim to provide you with a specific list of exactly the right
    questions in order to start a creative project, far from it. But my hope is that
    the book has encouraged you to challenge the status quo, to consider the consequences
    of bending, breaking or ignoring usual practices, to be inspired by designs and
    practitioners in data visualisation and further field, or to simply take your
    own curiosity further by trying ideas in visualisation you haven''t seen before.


    If your experience is anything like mine, your skills and creativity will improve,
    and you will enjoy every step of the way.'
