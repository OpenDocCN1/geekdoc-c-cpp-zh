  md: '# Questions in Dataviz


    This book takes the reader through the process of learning and creating data visualisation,
    following a unique journey with questions every step of the way, ultimately discussing
    how and when to break and bend the “rules” to come with creative, unique, and
    sometimes unconventional ideas. Each easy-to-follow chapter poses one key question
    and provides a selection of discussion points and relevant visualisation examples
    throughout.


    Structured in three parts: Section I poses questions around some fundamental data
    visualisation principles, while Section II introduces more advanced questions,
    challenging perceived best practices and suggesting that when rules are open to
    interpretation or there to be broken. The questions in Section III introduce further
    themes leading on to specific ideas and visualisation projects in more detail.


    **Questions in Dataviz: A Design-Driven Process for Data Visualisation** will
    appeal to any reader with an interest in creative or unconventional data visualisation
    and will be especially useful for those at a beginner or intermediate level looking
    for inspiration and alternative ways to deploy their data visualisation skills
    outside of conventional business charts.'
