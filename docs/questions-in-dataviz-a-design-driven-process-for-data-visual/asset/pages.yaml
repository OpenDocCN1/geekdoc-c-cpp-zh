  md: '# # Introduction


    > For me, there are no answers, only questions, and I am grateful that the questions
    go on and on. I don''t look for an answer because I don''t think there is one.
    I''m very glad to be the bearer of a question.


    # ## What are best principles?


    Data visualisation has a number of best practices but very few rules. A good visualisation,
    or a good chart, is often considered “good” by consensus. The designer may have
    got their message expertly with just the right level of clarity and conciseness,
    an aesthetic design and a muted colour palette that conforms perfectly to accessibility
    considerations. But even then, how often do you see a chart considered good critiqued
    by those with a different opinion? Those with preferences for different colours,
    chart types or aesthetic styles, or who would prefer to see a different story
    told from within the same dataset? Or simply those who think the subject holds
    no interest to them?'
  merge: -1
  pgno: 17
- img_proc: true
  md: '# xviii Introduction


    Most would agree that the simplest of datasets in the hands of the field''s most
    respected experts would be visualised in ten different ways, all of which would
    confirm to each designer''s personal style and visualisation preferences. Yes,
    all ten would likely be considered much better than something a beginner or intermediate
    practitioner might create, but all, while conforming to best practices, would
    look different enough to each other to be identifiable as unique.


    This book is not about defining rules, principles or best practices in the field
    so much as discussing them, questioning them and being aware of when you might
    want to bend or even contradict them. It won''t tell you the best things to do,
    neither will it tell you the things to avoid. It''s not called “Answers in Dataviz”,
    for good reason!


    In fact, many of the questions posed in each chapter won''t be given a definitive
    answer, based on my own opinion, circumstance or experience. Or they may go unanswered,
    leaving the relevant elements completely open to interpretation. In some cases,
    you may well come up with your own answers and I''d would encourage you to do
    so.


    But, and I''m aware I phrasing this in the form of a question, why so many questions?


    With so many entry routes into the field of data visualisation, people will learn
    the software or the tool first. In formal training terms, self-learning terms,
    it might be that all you learn before you get straight into action creating your
    own output. We might find that a tool makes it easy to apply different colours
    to every one of our bars in a bar chart, to generate arbitrary bubble charts with
    just a few mouse clicks or drags or create pie charts with 24 segments adding
    up to 143%. But that doesn''t mean these are the charts we should create ...


    # Asking questions allows us to critique and improve


    The very first chart I produced, within minutes of data being loaded into a charting
    tool for me, looked something like this. Why did I choose to visualise it like
    this? Because it was easy to do so quickly,'
  merge: -1
  pgno: 18
- img_proc: true
  md: '# Introduction xix


    and it caught my eye – I knew no principles, guides or rules at this stage (Figure
    I.1).


    ![](img/b909e9b4298ba430102dc44c70463458_19_0.png)


    FIGURE I.1 My first data visualisation.


    There might not be anything truly incorrect or deceitful about the chart (we''re
    not truncating axes on a bar chart, for example), but a few simple questions act
    as both discussion and critique. There may be no definitive best way to show this
    simple data, but most of us would improve on it. Some questions that come to mind
    might be:


    +   * What’s the title of this chart – what do the numbers represent?

    * Can we really discern amounts and differences using circles?

    * Do we need different colours for the circles as they are labelled anyway?

    * Given that we have chosen colours, are blue and pink for male/female really
    appropriate?

    * Why have we included a colour legend which isn’t necessary?

    * Shouldn’t we use the term “Sex”, rather than “Gender”?

    * Do we really need to have two decimal places on the percentages?


    This list of questions and potential improvements is far from exhaustive, but
    it didn’t take long to come up with a few right off the bat. It certainly wouldn’t
    take long for someone with a little more experience to improve significantly on
    the above, using these questions, and potentially others, as a basis.'
  merge: -1
  pgno: 19
- img_proc: true
  md: 'Just minutes into my data visualisation journey, with no training and a freshly
    installed chart tool, I didn''t know what questions to ask. But as I gained experience,
    learned from established wisdom, and gained confidence in challenging my instincts,
    it''s likely that visualising the same data, even for a quick snapshot summary,
    would relate in something very different with a few months'' worth of experience
    down the line.


    # Asking questions allows us to develop our own philosophy


    In his introduction to the 2020 book Data Visualization in Society, Alberto Cairo
    writes that the best philosophical writing “doesn''t aspire to settle matters
    outright, but to inspire further reflection” adding “the variety of topics and
    approaches of the chapters in this book is astounding, but what most have in common
    is an open ending: they are links in a chain of reasoning – a dialogue”.


    My style of data visualisation relies heavily on inspiration from current practitioners
    who will be attributed and showed during the course of this book. But it also
    comes from many of those acknowledged to be historical pioneers in the field.
    The following standing out not just because of their output, but because of their
    unique questioning mindset that allowed their work to stand the test of time and
    inspire others as myself many decades into the future.


    # Florence Nightingale


    Florence Nightingale is arguably best known in the United Kingdom as the founder
    of modern nursing. But her Wikipedia tagline describes her as an “English Statistician”
    and indeed is well known as an important figure in data visualisation. As I write,
    Nightingale''s family growing up in Derbyshire is less than 8 miles from me at
    home. With so many connections to me, my profession and my family, it’s no wonder
    she is an inspiration to me.


    Being labelled just a statistician would be underselling Nightingale – she was
    the first woman fellow of the Royal Statistical Society. In terms of data visualisation,
    she is best known for her'
  merge: -1
  pgno: 20
- img_proc: true
  md: 'diagrams from the Crimean War, known as coxcomb diagrams or, indeed, the Nightingale
    Rose diagrams. Below is an image of her diagram of the causes of mortality, photographed
    in situ in the Science Museum in London.


    Circulated in 1858 and published earlier in 1859, Tim Harford describes the coxcomb
    thus in his book How to Make the World All Up: “What it isn''t a dry presentation
    of statistical truth. It tells a story” (Figure I.2).


    ![](img/b909e9b4298ba430102dc44c70463458_21_0.png)


    The Areas of the red and black edges measured and measured from the center as
    the common vertex

    The red represents the number of deaths which approved- for the deathbut from
    zymotic diseases and from other wounds

    The black edge measured from the deathbut includes all other causes

    The shape of each part is for each month, compared with the red,

    January & February The blue arms follow this; the black.

    Each area may be compared by following this; the red and the black having more
    within them.


    FIGURE I.2 Diagram of the causes of mortality – Florence Nightingale.


    Now we know that data visualisation was in its infancy when it was produced, certainly
    compared to today''s standards, and it''s safe to say that we have seen coxcomb
    charts like this before. Even now, almost 200 years later, many people, including
    those reading the book right now, will still not be familiar with the coxcomb
    chart, how to read it or be aware of the term itself. And that''s no criticism
    of today’s audience, reader a statement on unconventional Nightingale’s chart
    was, in the context of today’s practices.


    Nightingale would have known that this was unorthodox, it was a striking chart
    type that would need explaining to her intended audience, which was generally
    an audience of men in positions of authority. But she would have aware of this
    and known that it was a concession worthy to achieving impact.'
  merge: -1
  pgno: 21
- img_proc: true
  md: '# xxii Introduction


    And of course, Nightingale would have been looking for impact for the right reasons
    – not to gain attention for her skills and creativity, but to press home the vital
    story charts were designed to tell. By dividing the death toll in the British
    Army into two periods, she deliberately draws attention to the periods before
    and after sanitation improvements at Scutari hospital where she was posted in
    Crimea, creating a sharp break, making the importance of improved sanitation jump
    off the page.


    She was on a mission to persuade that in positions of influence to introduce sanitation
    across Britain and the Empire, to such an extent that “the visual rhetoric helped
    people to reach a conclusion that happened to be correct”. Acts of Parliament
    followed in the UK in the 1870s, and death rates in the UK began to fall.


    Furthermore, Florence Nightingale didnt invent the coxcomb chart without prior
    data visualisation. RJ Andrews stated in his article “Florence Nightingale was
    a Design Hero” published in the Data Visualisation Society’s online journal (also
    known as Nightingale), “Florence Nightingale made lots of bar charts. No one cares
    about them! Her roses gripped 1858 records and they still hold our attention today.


    So, we can assume that she would have known although to display the data in bar
    chart form would have been perfectly valid, something else was needed to get her
    point across and ultimately to save lives. Did she question whether displaying
    numbers in wedge shapes scaled by area was an acceptable alternative to the norm?
    I like to think so – and the resultant chart, with the resultant impact caused,
