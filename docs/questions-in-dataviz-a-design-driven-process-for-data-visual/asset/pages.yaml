  md: '# Dive deep


    You can get as detailed as you like – envisage things in ridiculous detail that
    nobody really needed to know. That''s not to say the outputs won''t be appreciated,
    they just won''t be life-changing!


    # Learn new stuff


    If you''re diving deep and researching your subject, you''ll learn much in the
    process. An early visualisation of mine, not shown here, was an abstract and exploratory
    visualisation based on the top 75 UK singles of every week of the 1980s. I knew
    that data was going to take me a while to collect anyway, but it took me even
    longer than it should have done, as I regularly researched, and played music I
    had either forgotten about or never in the first place – all of which was an unnecessary
    distraction but which added to the enjoyment of the experience as a whole.


    # Go light touch / be unconventional


    By this, I mean that for an unnecessary visualisation your subject can be as trivial
    as you like. I refer back to the visualisation of letters and numbers used in
    50years of Sesame Street episodes from the previous Data-Driven Design chapter.
    And as for unconventional, it''s a recurring theme throughout this book that I
    don''t need to emphas again here, except to say that if ever was a time to be
    unconventional, it would be on a visualisation that might be considered unnecessary.
    After all, you wouldn''t, for example, present COVID-19 infection rates to the
    nation in the form of a ridgeline plot, or an obscure artwork.


    # Overcome Creative Block


    If you''re struggling for ideas or inspiration, your best chance is to investigate
    a topic you love without worrying what insight you can provide. If you will enjoy
    it, you''ll hopefully regain confidence from the process of immersing yourself
    into something trivial or nostalgic, and hopefully get satisfaction from the creative
    result.'
