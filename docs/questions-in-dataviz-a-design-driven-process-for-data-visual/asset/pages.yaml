    # Showing, identically formatted visualisations in pleasing visual format


    Finally, the links, trends or comparisons may not be obvious at all, but it can
    still be the case that small multiple visualisations simply look good as a simple
    method to see, compare and contrast every individual element in your dataset.
    This is something I use a lot and is just a natural endpoint of my preference
    for showing aggregated data where possible. A small multiple chart allows the
    reader to spend time enjoying the visualisation – we can notice our own similarities
    and differences, and draw our comparisons between whichever individual elements
    we chose.'
