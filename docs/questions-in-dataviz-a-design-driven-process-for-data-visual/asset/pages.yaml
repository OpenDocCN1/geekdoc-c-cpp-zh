  md: '# Chapter 3.10: What are Truchet tiles? 313


    I know now that I have the idea on how to go about this technically – but I wanted
    to look for something with more variety than the Smith tiles, since Smith tiles
    can be placed in two different orientations. When I came across a blog page from
    Christopher Carlson, a US-based designer specialising in geometric design, that
    looked into more complex examples, then I knew I had my source of inspiration.
    Carlson designs his tiles to use multiple sizes in multiscale Truchet patterns.


    A multi-scale Truchet pattern, so that some tiles were 1×1 size, some were 2×2
    and 3×3, for example, was my initial idea and could certainly be a more advanced
    project to try in the future! But even within the constraints of using tiles of
    the same shape and size as each other, he designs 15 overlapping tiles which tile
    together in grid form, which allows for much more variety in pattern than the
    two simple Smith tiles. These individual tiles will be shown further on in this
    chapter as part of my final output.


    I mentioned above that my visualisation would remain datriven, however random
    or generative it would appear in nature. My final question was around the underlying
    data – what could generate its own Truchet tile grid? And then could we see similarities,
    differences and patterns in tile grids using different data from the same category?


    I could have chosen any manner of things – in the end, I decided on opening passages
    from famous books, poems and songs, with the idea of somehow encoding each of
    the first 64 words into a number 1–15 to select one of the Truchet tiles. The
    best, and to my mind anyway, most fun I could think of assigning a value to a
    given word in true almost-random style was to use the Scrabble score of each word
    to choose the tile. I would then have a pseudo-random generated tile for each
    work of literature. Inspired by Shakespeare, Orwell, Dr. Seuss, and the Beatles,
    others had the data needed.


    Below is my final version – starting with the “how to read” page in order to explain
    the 15 different Truchet tiles designed by Carlson and explained above (Figure
    3.10.3).


    This is followed by an example of one of my generated tiles, in both black on
    white and white on black, since I couldn''t decide which I liked best! This particular
    tile uses the first 64 words of Lewis Carroll’s Jabberwocky (Figure 3.10.4).'
