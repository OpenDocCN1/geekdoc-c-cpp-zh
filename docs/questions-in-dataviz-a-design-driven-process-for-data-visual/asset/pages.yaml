    # ## Considerations for world tile maps


    Moving on from our introduction to tile maps, the logical next step might be to
    wonder whether it''s possible to tile the world. Is it practical, or sensible?
    We''ve seen tile maps for countries, regions and continents now, but what about
    a tile map for the whole world?


    Before I go too far into this, this chapter is less a debate on the pros and cons
    of using tile maps, or world tile maps in particular. We can certainly answer
    the chapter''s question quite easily – since we know and have demonstrated that
    tile maps can be created to represent all manner of countries, regions and continents,
    it must surely be possible to extend tile maps to cover the world. I can answer
    the question without much in the way of spoiler by asserting that the answer is
    indeed "yes".'
  merge: -1
  pgno: 295
- img_proc: true
  md: 'This chapter instead assumes that we''ve already decided to con- sider displaying
    our global map-style visualisation as a tile map. We know the pros and cons of
    tile maps in general, and we might be particularly wary that they are likely to
    be large factors when it comes to including every nation of the world in a global
    map, such as the issues of geographical recognition and large varieties in area
    of different countries, but we''ve made the decision. We''re tiling the world!


    As you can imagine, including every world nation in a tile map comes with a number
    of challenges. In this chapter, we suggest three methods you might want to consider.


    # Traditional tile map


    When I came up with my first couple of projects where I wanted to visualise global
    data in tile map format, I initially didn''t consider a traditional tile map.
    The huge variation in nation size seemed too much of an obstacle to overcome,
    even for me and my love of creating my own tile maps. However, when Jonathan Schwabish,
    with the help of blog readers at polyviz.com, circulated a proposed grid via Twitter
    for use as a world map, I couldn''t resist trying it out. Accepting that the grid
    itself was a prototype, I knew it would be fun to recreate using Tableau and had
    a dataset to try it out with, looking at public holidays around the world (Figure
    3.7.1).


    Some of the limitations are clear: first of all, that the overall line of the
    land masses and continents has become un recognisable, and it''s particularly
    hard to identify individual countries. For that reason, I''ve intentionally used
    colour encoding for continent to assist in geographical recognition, as well as
    using intensity for my chosen metric, which is the number of public/national holidays
    per country.


    We can see that North America has shrivelled into one corner, and Asia is distorted
    through the great variety of country sizes, most notably Russia, and the island
    areas as Oceania and the Caribbean show more like land masses because there are
    so many small countries that need to be shown together.


    The continent colouring is, I think, a nice visual. But the feedback I got from
    this first version was understandable. How can you compare the number of holidays
    across continents? You?'
