  md: 'The chart above shows the electronic version of my two sketch options from
    the start of the chapter, and I chose the second of the two options for my combined
    chart. The Gestalt principle 1. Proximity (as well as that of 5. Enclosure from
    the light grey lines added by my charting software) means we are naturally tending
    to group the bars into objects of threes.


    But, for example (a) we can''t really see anything looking at each city''s figures
    for each year. However, (b) accentuates these groupings. Using 2. Similarity,
    we can much more easily see each city''s trends. Liverpool (green) is increasing,
    Blackpool (orange) is decreasing, Manchester (purple) has increased and then returned
    to 2013 levels.


    Finally, there is nothing wrong with example (a) per se, and if we were less interested
    in trends within each individual city and we wanted to get an idea of overall
    trends on each year, we would in fact be the better of the two options. Perhaps
    we''d rethink in this case whether we used a colour option for each city was really
    necessary, but the point remains it is an equally valid representation of our
    data.


    # Conclusion


    Our reaction in accordance with Gestalt principles as consumers of data visualisation
    is not a considered choice, but an instinctive response formed by the desires
    of our brain to consider shapes, objects, and distributions in certain ways. For
    that reason, we should consider embracing Gestalt principles rather than fighting
    against them.


    Considering Gestalt principles, even if, at the time, I didn''t realise I was
    doing so, is recommended, not just to adhere to data visualisation best practices,
    but also to give the best chance to find insight into your data.'
