  md: '# When are several visualisations better than one?


    There are different answers to this question, depending on how you interpret it.
    It’s possible that we are thinking of two or more visualisations that complement
    each other by visualising different elements of the subject. A suite of charts,
    graphs or visualisations which allows for the overall output to be greater, more
    impactful or more analytical than that of any of its individual charts.


    We’ve seen this in our discussion of “long-form” visualisations in storytelling
    and have alluded to it in examples such as Andy Kirk’s Seinfeld Chronicles in
    our “unnecessary” charts. Both of these examples add to the story they tell and
    by increasing the quantity of charts to the same project in order to give a fuller
    picture (to paint a fuller mixed metaphor with data storytelling). Indeed, this
    book will finish with a similar project from myself.


    But when I was recently asked what my favourite chart type was, I found it hard
    to come up with an answer. And the more I thought about it, the more I realised
    that I may not favour one chart over another, I know that I have a real fondness
    for a particular visualisation type, namely the “small multiple” as I will refer
    to. Incidentally, it might also be considered a visualisation strategy rather
    than a type, since the chart type of each individual element can be anything you
    like. But that’s a moot point here. You may also know it as a trellis chart, a
    panel chart or a lattice chart, among other terms.


    Small multiples represent a great way of comparing values across a discrete dimension
    that otherwise brings confusion or clutter, by showing each slice of data repeatedly
    in an individual chart. Here are four situations in which I like to use them.


    # Showing data change over time


    Geographical data is notoriously difficult to show over time, since the x and
    y axes are by definition, for longitude and latitude. With your two-dimensional
    axes used (and we don’t discuss 3D visualisations in this book!), there’s no obvious
    candidate for depicting time in a static visualisation. Here, small multiple charts
    are an ideal solution.'
  merge: -1
  pgno: 203
- img_proc: true
  md: 'It doesn''t just have to be a traditional map: Figure 2.8.3 is an example of
    mine from early in my career as I made my first explorations into the world of
    tile maps which is a good case allowing for easy comparison between years. Additionally,
    standalone copies of the same visualisation are easier to justify given that the
    time period between each map is not consistent from one to another – with the
    years we get around the problem of unevenly distributed data points which might
    have been more of an issue in something like a bar or line chart.


    It doesn''t just have to be geographical data – other data types can also be sliced
    if your x and y axes are already used and you don''t intend to make an animated
    visualisation: Figure 2.8.4 is a similar non-standard example comparing identically
    laid charts over time.


    # Showing differences across other dimensions


    Figure 2.8.5 shows the 100 companies depicted in the visualisation in a pre-determined
    order 1–100 in overall company rating. Knowing the pre-determined order of individual
    visualisations allows us to “look up” our version of choice. So, the difference
    between the example above is that we can design a visualisation allowing us to
    compare and contrast differences from one company to another, rather than from
    one period of time to another, in company ranking.


    This numbered company ranking means that we can see any trends in the data should
    be any from high to low overall company rating, although, in this case, we don’t
    see any – our takeout story is that unfortunately there is little variation among
    the top 100 rated companies with white males more likely to be in leadership roles
    across the board.


    # Showing differences across ordered categories


    It could be that the dimension for comparison and “slicing” is a discrete categorical
    dimension that isn''t numeric. In these cases, it makes sense to order the small
    multiples in an order which makes each category easier to “look up” in a different
    way. This will not show trends, so much, since you wouldn''t expect countries
    arranged alphabetically to show trends but will allow for easy comparison.'
  merge: -1
