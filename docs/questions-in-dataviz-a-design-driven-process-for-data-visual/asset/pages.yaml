    # Why visualise using triangles?


    So, let''s go back to how we visualise using triangles. My blog post of the same
    title was a deliberate nod to a previous post asking why we visualise using circles,
    and the previous post in question was very much an homage to The Book of Circles
    (Manuel Lima, 2017). In this book, Manuel Lima was able to use images throughout
    history from art, astronomy, biology, cartography as well as data visualisation.
    To distill his observations down to just two points, the use of circles comes
    down to two advantages:


    +   Firstly, the metaphor of a circle represents a number of things: infinity
    (through eternity, immensity, etc.); movement (with the concept of continual force,
    rotation, cyclality, periodicity, etc.); unity (representing wholeness, completion,
    containment, etc.) and perfection (simplicity, balance, harmony, symmetry).


    +   Secondly, there''s no doubting the aesthetics of a circle, they just look
    good. Whether a circle is the overall shape of the visualisation or graphic (encapsulating
    its contents in a pleasing circular form), or circles represent constituent elements
    of a larger visualisation, there is always a choice to be made in just how good,
    or appropriate, the circle could be.


    So how do these ideas apply to triangles?


    I briefly started down the line of goog "symbolism of triangles", but here there
    are many interpretations as there are articles, and I''m not particularly interested
    in spiritual connotations, since it''s unlikely that visualisations I might create
    or enjoy consuming are on a spiritual theme. But one recurring theme is the theme
    of strength. The triangle is a sturdy shape – of all the regular polygons it has
    the smallest internal angle, and as a result, it''s the hardest polygon to “squash".'
