  md: '# Chapter 2.9: What can I do when data is impossible to find? 185


    wanted to visualise the story. In the end I had just one option, to read the book
    and then create (or curate) my own dataset.


    Now of course this adds a significant time element to the process, but because
    this was a personal project I wanted to enjoy I didn''t mind that. The solution
    that says "Go no data? Create your own!" is not always going to be the ideal solution,
    but in situations where you want something particularly bespoke, sometimes you
    have to revisit the event or subject you plan to envisage, review it and record
    and create your own data.


    Remember the Seinfeld Chronicles? The visualisation project from Andy Kirk that
    I introduced in the chapter about unnecessary visualisation? Crucially, Andy includes
    a paragraph entitled “Notes about the data” in which he stated:


    > The data used in this study did not exist, it had to be manually captured through
    watching every episode and logging the times, categories and characteristics of
    different events each.


    My idea was to recreate the timelines of the six main characters in the book and
    display them in a similar way to Kurt Vonnegut when he displayed the “shapes of
    stories” as described here. Vonnegut’s original blackboard drawings have been
    recreated many times, and this particular version is from Jonathan Schwabish in
    his PolicyViz discussion around storytelling in data visualisation in 2017 (Figure
    2.9.1).


    # Boy Gets Girl from Kurt Vonnegut


