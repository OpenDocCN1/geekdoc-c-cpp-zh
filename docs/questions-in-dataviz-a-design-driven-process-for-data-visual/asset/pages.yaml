    Stefanie Posavec


    # ## Existing sources of data


    Often for personal visualisation projects, the hardest part can be getting hold
    of an interesting or relevant dataset. I’m not talking about the drudgery of cleaning
    or reshaping data for your chosen visualisation tool, which we know also be difficult
    and/or time-consuming, but of actually getting hold of data in the first place.


    The internet is full of excellent sources of data. Official datasets can be found
    on government websites or from statistical agencies. Websites such as Kaggle and
    data.world host community sourced data sources on a range of topics. Community
    projects as makeovermonday.co.uk or vizforsocialgood.com offer datasets which
    are freely available and perfect for personal projects – certainly the latter
    two have been hugely responsible for many of'
  merge: -1
