  md: '![](img/b909e9b4298ba430102dc44c70463458_337_0.png)


    # Pachelbel''s Canon


    Composed or before 1708, Pachelbel''s Canon is a musical piece for four parts,
    typically three violins, and a basso continuo (usually played on ''cello''). It
    consists of 20 sections which repeat 14 melodic motifs, each shown in a different
    colour. Each motif is played in turn by a different violin, across three separate
    sections, with only minor variation.


    Here we show each section as a circular representation, travelling around the
    top. Each dot represents part of each, with distance from each dot''s centre determined
    by the note''s pitch, and the length of each connecting line represents the length
    of each note.


    The fourth basso profundo part is an identical eight note bass melody which repeats
    constantly across every one of the sections.


    ![](img/b909e9b4298ba430102dc44c70463458_337_1.png)


    Figure 3.9.11 Pachelbel''s Canon.


    # Conclusion


    If you want to visualise music, there are so many options across tone, pitch,
    tempo, structure, volume and notation that there are few better sources for static
    visualisations. Then, add in real-time animation and accompanying music, and the
    possibilities just increase further. With very little consistent data visualisation
    by way of rules and convention, apart from conventional musical staves, this gives
    so much potential to the data realisation designer to create something unique.
    I certainly recommend it.'
