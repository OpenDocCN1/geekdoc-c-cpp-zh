  md: '# Chapter 2.6: Do we take data visualisation too seriously?


    The visualisation, which I''m unable to show here, got a lot of traction at the
    time, and it''s fair to assume the positive feedback sufficiently outnumbered
    the negative feedback given it received a major award. Personally, I loved it,
    and you won''t be surprised to know, but that reaction wasn''t universal. “It’s
    not a proper map.” Those areas mean anything.” Wait a minute, does this mean that
    the 100 largest landowning families owe all of Florida?” It''s deceptive if, but
    it requires you to forget geography and to spend some time understanding its unconventional
    nature. Once you, the reader, can do that, it comes into its once more.


    In the United Kingdom, it''s often joked that a large area needs to be described,
    it''s always the size of a certain number of football pitches. And when a really
    large area needs to be described, as global fires or deforestation, it''s always
    “an area size of Wales.” In this case, we can envisage areas in relation to land
    masses we are familiar with. For example, the 100 largest landowning families
    own an area roughly the size of Florida. And every other comparison can be made
    in a similar way.


    And UK Estate Savill''s did something very similar in their recent land-use survey
    published in January 2019, illustrated using the below visualisation in a report
    from Emily Norton and visualised by Joe Lloyd. To my own personal delight, it
    has even more similarities with my own pet ownership visualisation, inasmuch as
    the areas are shown as consisting of circular units. And, more obviously, it''s
    a UK-based map!


    Again, we might be led to thinking that, for example, the 20% of UK''s current
    land use, takes place exclusively in the south of England where that is the sole
    usage type, and nowhere else in the UK. But once common sense takes hold, it''s
    clear that''s not the case, neither is the intention to contest it. At least Gestalt
    principles allow us to visualise the proportions of each particular land-use type
