  md: '# Questions in Dataviz


    When I heard that in the 50th year of Sesame Street, I decided that I wanted to
    do a design-driven data tribute in some way. You''ll see, obviously, that my design
    inspiration was the character Big Bird, from Sesame Street. But this shows that
    inspiration can come from anywhere. It doesn''t have to come from an art piece,
    or a kind of diagram with two-dimensional shapes that lends itself to data visualisation.
    The inspiration can be absolutely anything two or three-dimensional.


    Some ideas that represent just a fraction of the possible range of design-driven
    data ideas: artwork, music scores, existing visualizations, wallpaper or carpet
    patterns, flowers/trees/plants, embroidery, flags or emblems, costumes, animals...
    as you can see, the first list goes on.


    There was a time, as I introduced the concept and presented it to conferences
    and user groups, that people began to send me photos of their wallpapers and carpets,
    patterns on their clothes and other things, accompanied by messages such as "Hey,
    this looks like it could be one of your visualizations!


    And sometimes design-driven data requires a bit of luck. Sesame Street themed
    data was hard to come by and by my potential design idea was obviously quite restrictive.
    But a round, feathered, face lends itself to a radial visualisation. The perfect
    quantitative measure to visualise seemed to be the "sponsor" letters and numbers
    mentioned at the end of every show. Differences in measures would lead to different
    feather lengths, but that''s OK. The organic nature of a creature''s feathers
    means that different lengths will make the face less smooth and circular. But
    how could I deal with the extra vertical tufts around the top of his face, and
    the additional white feathers underneath?


    You can see from the final visualisation that''s where I was lucky. There were
    enough additional options with larger numbers to encode than the rest (numbers
    2-12 come a lot more than letters A-Z), and enough with much smaller numbers to
    encode than the rest (0, 1 and 13-20 are featured a lot regularly).


    This led to a much simpler design in terms of the data it shows, but it is a design-driven
    data example, nonetheless. And it''s true, this really could have been a bar chart.
    In fact, I got around this by showing a simple bar chart under the tooltip for
    every feather, since again, it''s important that the analytical information is
    there'
