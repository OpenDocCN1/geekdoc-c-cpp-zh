    # How many ways can you tile the United States?


    Human nature is to need a map. If you''re brave enough to draw one, people will
    follow.


    > Seth Godin


    # ## Defining tile maps


    This chapter is one of two devoted to tile maps – a visualisation form I''ve taken
    a lot of enjoyment from recent years. I''ve chosen the United States to focus
    since US tile maps will probably be most familiar to the majority of readers,
    whether or not you hail from the United States yourself.


    I use the term tile maps – they are often termed hex maps, but I want to consider
    the wider options available, with tiles not just restricted to hexagonal tiles.
    A tile map is a map representation that shows every contingent territory of the
    map as an identically shaped tile, regardless of its actual shape and size. In
    the case of the United States, each tile represents a state. Often District of
    Columbia is shown separately if there is a separate data point for DC, usually
    as part of the main tile map, but sometimes separately. The best-known forms are
    square tiles or hexagonal tiles (Figures 3.6.1 and 3.6.2).'
  merge: -1
  pgno: 277
- img_proc: true
  md: '# 248 Questions in Dataviz


    ![](img/b909e9b4298ba430102dc44c70463458_278_0.png)


    FIGURE 3.6.1 Square US tile map example - with DC included in main tile map.


    ![](img/b909e9b4298ba430102dc44c70463458_278_1.png)


    FIGURE 3.6.2 Hexagonal US tile map example - without DC included in main tile
    map.


    First of all, since the tile question is asking “how many ways?” I should point
    out that neither of these two examples is set in stone. There may be different
    positionings of AK and HI, and there may be different arrangements around the
    Northeast, or the angle of Florida, or perhaps where the tile map designer decides
    to place DC having to include it. There isn''t a “right” or “wrong” tile arrangement
    for USA or any other tile map.


    What would be wrong would not to label each tile in some way, either on the tile
    or using another method such as an interactive tooltip or separate legend. However
    good your representation, it is, by definition, not geographically accurate and
    unlikely to be familiar to all of your audience, will so need explanation.


    If you are interested in creating tile maps for any territory at all, the possibilities
    are almost endless. But first, we should look into'
  merge: -1
  pgno: 278
- img_proc: true
  md: '# Chapter 3.6: How many ways can you tile the United States? 249


    why we might want to use a tile map. What are the advantages and disadvantages,
    and in what situations might they work better than others?


    There are always questions to ask around your choices so that you''re aware of
    issues your audience might encounter. Now you should know by that I would never
    discourage any design choice if you''ve already questioned the principles behind
    it, and in terms of tile maps, these are the main criteria I would be aware of
    that might make you consider them wise choice or otherwise. I''ll use the term
    country for the whole and regions for the constituent areas below, but for the
    constituent areas we course of talking about states, counties, territories, prefectures,
    countries themselves (if the whole map is a continent, for example) or any geographical
    area.


    # Equal prominence to unequal regions


    Every tile (usually) the same size, equal prominence will be given to every region
    within the country, regardless of size, from the tiniest to the largest.


    This is perhaps the easiest to consider in exactly these circumstances, when you
    have information about every region you want to display, regardless of each region''s
    size or shape. In other words, if all your data values are equally important,
    regardless of the geographic size of each region, then the tile map becomes an
    excellent choice. However, if you don''t want to give equal prominence to the
    data from each individual region, then the tile map is not such a good choice.


    # Skewed or unrecognisable overall shape


    Again, if the individual regions vary a lot in size, the overall shape of the
    tile map as a whole might look very skewed or unrecognisable versus the overall
    country outline which will be much more familiar to your audience. This can represent
    both the challenge and the charm of tile maps. As someone who loves to create
    these manually I can attest that, it''s a matter of minimising this effect as
    best as you can whilst acknowledging that it does exist. Every tile map with distorted'
  merge: -1
  pgno: 279
- img_proc: true
  md: 'areas is simply a function of that particular country’s demographics and geography.


    For example, the US tile maps are known for having a much more exaggerated North-eastern
    area since the states in area of the country are generally smaller than those
    in the Midwest and West. But the standard tile maps allow for that as best as
    possible, while still keeping within a simplified recognisable USA shape.


    # Geographical anomalies


    There will almost certainly be regions where you have to take fairly extreme geographical
    liberties. Unlike the above two considerations, regions which will have new neighbours
    or find themselves in unfamiliar territory significantly to the north (or east/south/west)
    of where they should normally be on the conventional map.


    For example, New York State in the USA reaches the Great Lakes to the Atlantic
    coast. It’s simply not to look at a tile map and see Niagara Falls and New York
    City both in the exact place in relation to the ocean, to Canada or to the neighbouring
    states. Something has to give!


    Of course, there are other considerations, for example, you would always consider
    your audience and be clear whether there might be issues introducing an unfamiliar
    map. But a recurring theme I have tried to encourage is to explain and annotate
    and I work under the assumption that you are now prepared for your readers to
    spend time consuming and understanding your charts.


    # Mapping further afield


    But why limit these maps to the United States? Whichever country you are from,
    the chances are you have seen more tile maps for the United States than any other
    country, region or continent. If you’re prepared to study maps and convert them
    into squares and hexagons, then you can see many areas of the world in a whole
    new light. You might have the programming skills to generate tile maps – however,
    in my case I have pencils, coloured pens and both square and hexagonal graph paper.


    Let’s show some examples of my own – starting with one of the first countries
    I attempted. France is divided into several regions called departments (or départements
    in French) and overall there'
