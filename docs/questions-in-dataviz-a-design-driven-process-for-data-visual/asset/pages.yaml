  md: '# Aesthetics and metaphors


    Flowers are sometimes emotive, but a simpler explanation for their use, on occasion,
    is in their aesthetics. In other words, they look pretty and attract the viewer''s
    attention. The sometimes metaphor is important, as that in the Operation Fistula
    example above, with growing flowers representing hope and life, and-times less
    so.


    For example, there’s no obvious connection to Premier League football, though
    you can make an argument for the organic nature of flowers with their individual
    differences representing the differences between the make-up of 20+ humans in
    each squad.


    I did wonder if our cultural preconceived stereotypes mean that we’re slightly
    more to consider the flower metaphor for visualisations that focus on women, rather
    than on man – and I must admit that it was a subconscious decision, or more likely,
    even a conscious decision, to challenge my audience and buck that by using flowers
    to visualise men’s football and rugby.


    But ultimately, I enjoy using data visualisation software, developed with the
    purpose of displaying business analytics, to create something appealing to look
    at. And it’s often seen in some of the most prominent visualisation leaders in
    the field.


    Among these are data visualisation designers Valentina d’Filippo and Shirley Wu,
    both of whom I have always cited as an influence in my flower visualisations.
    Valentina’s visualisation at https://www.poppyfield.org is a beautiful example
    of the powerful metaphor of the poppy as a flower while encoding data within shape,
    colour, size and position of the flower, as well as in the dimensions and direction
    of the stalk.


    The visualisation itself depicts deaths in global wars throughout the 20th and
    early 21st centuries, with the two largest poppies clearly denoting the number
    of fatalities. With the poppy being a symbol used to commemorate the war dead,
    it’s been chosen in the visualisation as a clear and tasteful symbol of commemoration
    (Figure 3.3.4).'
