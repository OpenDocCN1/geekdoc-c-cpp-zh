  md: '# 152 Questions in Dataviz


    with numbers that don''t add up teaches us to use flat versions with few segments
    and only when demonstrating a part to whole relationship. The misleading bar charts
    with y-axis starting at non-zero values show us the importance of never starting
    a bar chart from zero. There''s no better way to emphas the importance of a particular
    practice than by demonstrating the consequences of when practice is ignored or
    applied in a different way.


    As a final answer to the chapter''s question of whether we take data visualisation
    too seriously, my argument is this: outside of business and professional use,
    when considering a personal project outside of work, every project is an amazing
    opportunity to interact with burgeoning data visualisation community who all have
    their principles, philosophies and levels of visualisation experience. Once again,
    remember, your intended audience is key – if you have your intended audience consist
    of those who share your curiosity for an unconventional approach, in this case
    a non-serious one, you should be comfortable to explore such visisations.


    Your projects are a chance to practice new skills and to think of new design ideas,
    but only if that''s where your passion and new ambitions lie. And you can''t do
    that every week with bar charts. There''s nothing wrong with taking every data
    projection, seriously, framing every submission you might present to a client,
    but there''s also nothing wrong with not doing so, if it comes with the understanding
    of what is the better, more conventional and professional alternative (that you
    have chosen to ignore!).


