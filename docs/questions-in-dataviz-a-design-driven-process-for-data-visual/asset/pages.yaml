- img_proc: true
  md: '# 184 Questions in Dataviz


    my own visualisations in my own development. For example, in this book, where
    else would I have got multi-country whiskey sales data from?


    And often there are datasets that are freely available but just take a bit of
    work. Examples I''ve used in my own work medal tables from newspaper websites,
    demographics data that can be pasted from Wikipedia, music chart positions that
    can be curated into larger datasets and many more. The list of possibilities is
    almost endless.


    This halfway house of data will usually involve copy/pasting, a useful API, scraping
    skills or data manipulation. All of which involve time and patience. I would imagine
    that any of you reading this who are involved in data visualisation in any way,
    shape or form will be all too familiar with the idea of a dataset always needing
    extra work prior to visualisation.


    # Souring your own data


    However, in asking this, I''m referring specifically to datasets that you know
    just not exist in the form or level of detail that you want. Perhaps the question
    would have been better reframed as “What can I do if the data I want doesn''t
    exist?”


    Let''s use an example of one of these datasets in a previous personal project.
    At one point, I knew that I wanted to do something on my favourite book: The Hitchhiker''s
    Guide to the Galaxy. Initially, I couldn''t find a dataset at all relating to
    the book online. It has to be said, I''m not sure what I was expecting to find,
    but whatever it was, I couldn''t find it! Sometimes you have to be realistic enough
    to accept that not every has an easily accessed and analysed dataset, and this
    was one of those cases.


    I do, however, own the book, both in old-school paperback format and as an e-book.
    Obviously, a book in itself could be considered a dataset – consisting of a large
    number of individual words which can be analysed, aggregated and visualised in
    many different ways.


    This time, my intention was to analyse what happened in the book, in some way
    to visualise events, to tell the story. While I was considering the importance
    of data storytelling, in this case the idea was to think about data storytelling
    in its most literal case. I actually'
