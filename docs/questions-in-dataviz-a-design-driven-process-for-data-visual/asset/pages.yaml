  md: '# Questions in Dataviz


    And, once again, it is just that, a data visualisation that looks like a pre-conceived
    design. As a piece of analytics, it''s tricky, at best, to understand, although
    all the tools are provided to enjoy this at your own pace. But as an output, some
    will enjoy it, some will appreciate the wit and skill behind it, and, what''s
    more, if you''re anything like me, you''ll very much enjoy creating it and getting
    better with your technical skills as a result.


    # But is it data art?


    This, or the related question “What is data art?” would have been, you might think,
    a perfect question for this book. But the simple answer is that this is a very
    objective opinion. After all, the cliché statement from those of us are not experts
    in art usually goes something like “I don''t know what art is, but I know what
    I like”. And''s probably true of creative data visualisation. Many will like a
    given visualisation, often many more will not. Is the original piece on the wall
    in Manchester a piece of art? That''s to opinion. And that''s it Ditto.


    But I do maintain the most important word in “what is data art?” is the word “data”.
    There''s a huge trend at the moment for generative art. Because I don''t consider
    myself an expert, or even a beginner, in generative art, I''m going to take the
    lazy definition here from Wikipedia:


    > Generative art refers to that in whole or in part has been created with the
    use of an autonomous system. An autonomous system in this context is generally
    one that is non-human and can independently determine features of an artwork that
    would otherwise require decisions made directly by the artist.


    For me, the key difference between generative art and data art is that generative
    art is not necessarily generated by real data. My own creations, and any creations
    that fall under the description of design-driven data, are underpinned by data
    and are data visualisations first and foremost. Data curated and chosen by humans,
    with encoding and design decisions also taken by a human (me). I don''t consider
    myself an artist, but I do make design decisions based around the encoding of
    data. Data humanism, you might say.


    However, one thing you encounter if creating design-driven data visualisations
    is the comment that it is “artistic”, or “creative”.'
