  md: '# Chapter 3.8: Can you create visualisations using only numbers? 287


    digits for the first 768 digits of π in groupings of 3, and for each grouping
    of three number the times a digit seen was proportional to the width of the ring.


    However frivolous purely visualising a number might seem, especially an irrational
    (or transcendental) number such as π, there is always the opportunity to tell
    stories and learn – it wasn''t until I first researching and selecting this image
    for the chapter that I first learned of the Feynman point.


    The Feynman point is a point relatively early in the infinite number of decimals
    where there are six nines in a row starting at the 762nd place – a famous mathematical
    coincidence that might suggest, if you memorise and recite the numbers, that you
    could end with “nine nine nine nine and so on”, which would seem to suggest, incorrectly,
    that π is rational.


    This shows us two purple blocks in the bottom right of the image below. The design
    choice to end at the Feynman point was undoubtedly deliberate, with the number
    of digits chosen and their arrangement to highlight this. It certainly had that
    effect on when I encountered it for the first time.


    Another advantage of visualising π, or any irrational number you choose to visualise,
    is that its digits are essentially an infinite source of random numbers, with
    all 0–9 equally likely to occur. If you have any kind of random-looking data art
    you are interested in creating, then it’s a great place to start. You can take
    it further, if you want to reduce your colour palette you can choose to practise
    π in a different base instead of base 10. That might sound somewhat daunting,
    but you can easily find websites that will calculate it, at least for a manageable
    number of digits.


    Two examples of this follow – first of all online replication of a physical artwork
    at the University of Cambridge by James Hollyhead where the numbers of π in base
    seven are represented in a hexagonal grid by seven distinct colours (Figure 3.8.8).


    And it was the combination of the above: representing π in a different, non-decimal
    base and the concept of using the digits of π for a random-seeming source of numbers
    that give me the idea to replicate another classic design. A very simple in nature-driven
    data piece follows below that uses π as its source data and emulates the original
    Bidget artwork Cold Edge in form and palette (Figure 3.8.9).'
