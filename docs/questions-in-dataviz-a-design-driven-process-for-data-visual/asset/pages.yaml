  md: 'As a reader, you''ll need to appreciate how to read, interpret and understand
    a visualisation such as this. After all, we may all know how to read charts these
    days, but an unmarked and irregular visualisation is a tough data literacy challenge
    for most people and will need explanation for anyone but the author.


    A design-driven data piece, in order to most closely resemble the original influence,
    if it is a design rather than a data visual, is unlikely to contain text or annotation
    in the same way. In such cases, it''s therefore important that explanations be
    found, unless either on an accompanying page or behind the tooltip of the hover
    of a mouse.


    # Reaction to design-driven data pieces


    I feel like I need to make one last caveat here – this visualisation and other
    design-driven data examples like it are entirely for fun, and personal benefit.
    Its aim is to look nice, interesting, impactful, creative, artistic, or any similar
    adjective you might think. The intended audience may be a niche group of those
    who agree that the visualisation will be free to explore at their leisure or enjoy
    its overall look. This is a very subjective opinion.


    It''s true for everyone who applauds and appreciates it there may be many who
    roll their eyes or ignore it. And there will be more who decry it for lack of
    easy to interpret analytical takeaway. It''s a choice I''ve made, and the thought
    processes behind that choice have evolved from many of the questions we''ve raised
    and principles we''ve challenged until now.


    This probably raises a lot of questions – principally, why doesn''t it look like
    the original design? After all, if I''ve chosen the design for my visualisation,
    why stop at an approximation, why not make it exactly the same


    The answer is that the original design is the inspiration – it drives the data
    and then the final output, but the data stage can''t be omitted. And after all,
    data is real. Chances,, decided the way I want to encode every data point in the
    same manner as my design inspiration, it couldn''t possibly look identical. The
    key point in the process is to identify what I want to visualise and how I want
    to encode it. How close it gets to the actual original is a matter of luck and
    circumstance, but that''s not priority of mine at all.'
