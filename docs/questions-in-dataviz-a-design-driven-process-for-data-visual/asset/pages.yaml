    people saw Truchet tiles and thought of me and the possibilities for future visualisations.
    But what are Truchet tiles and how could I use them for my next data visualisation
    idea?


    Truchet tiles are tiles that are not fully rotationally symmetric and are designed
    so that when placed squarely in a grid they generate interconnecting patterns.
    If the tiles are placed systematically, then the new design may look equally regular,
    but when placed seemingly randomly new random patterns emerge.


    The most famous and simple Truchet tiles are known as Smith tiles – two diametrically
    opposed quarter-circles as shown below (Figure 3.10.2).


    ![](img/b909e9b4298ba430102dc44c70463458_342_0.png)


    FIGURE 3.10.2 Tessellation Truchet tiles – using Smith tiles.


    By this point I have decided that Truchet tiles are going to be my entry into
    a generative art style visualisation. I maintain that it does not qualify as generative
    art per se, as it will be designed by me and generated by data, but my graphic
    generated from Truchet tiles will definitely be inspired by it. And ideally for
    me, I can create these tiles in exactly the same way I love to create other types
    of visualisations, essentially as a small multiple grid of squares, and by designing,
    creating and positioning my own polygons.'
