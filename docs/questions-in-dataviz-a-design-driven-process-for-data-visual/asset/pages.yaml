  md: '# Chapter 3.7: Is it possible to the world? 271


    This has five different tile sizes: tiny, size 0×0 (e.g. Andorra); small, size
    1×1 (e.g. Ireland); large, size 2×2 (e.g. Mexico); very large, size 3×3 (e.g.
    Australia); and huge, size 5×5 (e.g. Russia only). This has enabled me to create
    grids of country sizes from 1×1 to 5×5, with the “tiny” countries showing as a
    dot rather than a circle, and sitting on intersections of grid lines.


    Using just these five categories feels like a nice compromise, since we sized
    every circle, square or hexagon exactly to match the country area, which is also
    perfectly possible to do, it would look like a less uniform and more chaotic.
    But more to the point we would be back to a stylised version of a more traditional
    map, where every country has the same prominence as its area. This system sits
    somewhere between the two, with a minimal number of tile sizes to be able to compare
    across countries more easily, but enough size differences to aid with familiarity
    and layout.


    The system works nicely for the “tiny” countries like Luxembourg or Burundi; since
    they can sit on corner points between territories without taking up any assigned
    grid space, and it allows small countries not to mass together too. An additional
    advantage is that countries such as Lesotho are entirely surrounded by other countries
    which can sit within the larger countries, such as South Africa in the case of
    Lesotho, instead of next to them.


    There are some pleasing design benefits to this comparison with the traditional
    world map in addition to those that the largest nations are now more visible and
    show as good placeholders (e.g., Brazil, China and Russia help us anchor our place
    in the world), and the continents are much more recognisable now. Central America/Caribbean
    and the Oceania islands are more recognisable as islands instead of appearing
    as a connected land map. Crucially, because the world map is more recognisable
    in shape underneath, we don''t need to rely so much on additional encoding for
    continents.


    A further advantage of the setup with “tiny” countries only occupying vertices
    on the grid is that if a country is not included in the dataset, chances it’s
    a “tiny” country in size, so it is less likely to affect the overall look of the
    graphic. You can see in Europe that Andorra and Luxembourg have been squeezed
    into gaps, but San Marino and Liechtenstein are not included in the dataset. But
    had they included, there is room for them to pack in the corners between the regular-sized
    circles.'
