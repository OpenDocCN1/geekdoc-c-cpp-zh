- img_proc: true
  md: '# 196 Questions in Dataviz


    But the third wave focuses on convergence. Our behaviour has changed as a consumer,
    for example, in the use of faster browsers and different ways of consuming content,
    such as mobile versus desktop. Because the tools have greater capacities, and
    audiences are becoming more used to different methods and styles of visualisation,
    we in the current third wave are in a unique position of being able to use much
    more powerful and customisable systems to rein in the over-complex second phase
    output. Taking this further, we have the opportunity to adopt a new data humanism
    way of thinking that avoids overwhelming outputs from "big data".


    This is why this resonates with me, and why I am framing the third wave of data
    visualisation as an introduction to the third section of this book. One of the
    effects of convergence is that BI (business intelligence) tools are growing more
    custom. It’s easier than ever before to break out of a tool or suite of tools
    which once focused only on simpler “out of the box” chart types, and now people
    are finding ways of leveraging BI tools to produce much more custom visualisation
    types. This is exactly the premise of this book.


    This is intentionally a tool-agnostic book, but there’s no getting away from using
    Tableau. Tableau is marketed and used as a BI tool (indeed, my business role uses
    tools exclusively for data visualisation and my role includes “BI” in its title),
    but outside of my professional role, I choose to stretch its capabilities to create
    the unconventional and the “custom” (Figure 3.1.3).


    ![](img/b909e9b4298ba430102dc44c70463458_226_0.png)


    FIGURE 3.1.3 Data visualisation third wave – Convergence – Elijah Meeks.'
  merge: -1
  pgno: 226
- img_proc: true
  md: 'And it''s great personal validation to me that the example used in Meeks''
    side to demonstrate this (on the right-hand side) was one of my own visualisations.
    A humanism-inspired visualisation in which I imitated hand-drawn disaggregated
    visualisations by Giorgia Lupi and recreated them in Tableau. The visual itself
    will feature in a little more detail later in this section.


    There are many generic examples of convergence in data visualisation, whether
    it is the ability to create more dashboard-like outputs with notebooks or create
    the illusion of more sketch-like hand-drawn visualisations in packages such as
    gg and R. As a result, there is not just more power to the elbow of data visualisation
    practitioners, but it does potentially put more emphasis on the need to design,
    or perhaps more accurately, to get better at design!


    # Community and critique


    And, of course, means the nature of online communications these days, in particular,
    means open to more critique and criticism, competing for attention with many other
    products, visualisations and creators. A final crucial point is that''s outside
    of the scope of this book cannot be ignored is that we need to be better at getting
    and receiving critique in the right. Data visualisation communities are being
    built at pace with sub-communities growing around tools, industries, libraries
    and many sub-genres.


    Blogs and social media platforms mean that the scale of exposure to our outputs
    can be far in excess of previous levels, and so as the third wave of convergence
    emerges, so the data visualisation communities merge into one and exposure increases
    even further. It is as important as to include all participants in a whole community
    – we all gain from our fellow developers and designers'' ideas.


    The “third wave” isn''t defined in terms of a particular point in time. We might
    think of ground-breaking visualisations that fit our definition that were created
    years ahead of any perceived boundary in time if we try and define it discretely.
    But thinking in these terms gives us a tool to emphas how data and the resultant
    visualisations have changed over the years and a context for our visualisation
    tools and their capabilities.'
