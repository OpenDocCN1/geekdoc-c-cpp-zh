  md: '# # Chapter 2.8

    When are several visualisations better than one?


    > Isn’t life a series of images that change as they repeat themselves?

    Andy Warhol


    This chapter looks at two questions, both of which are important considerations.
    But although the questions are very similar, the thinking behind the discussion
    and the answers are different.


    # ## When does adding an extra copy improve the original?


    At face value, this would appear to make not much sense. If we’re trying to consider
    the cognitive load of our readers, or if we’re trying to create an impactful design,
    then why would we want an extra visualisation in addition to the one we’ve already
    got? And what about if we are trying to use our white space wisely, or arrive
    at the right data-ink ratio? Why would then we have two visualisations when one
    would do?


    One situation where this could potentially come in useful is when you want to
    display the same data in two ways – you might have two variations on the same
    data visualisation when one is less familiar.'
