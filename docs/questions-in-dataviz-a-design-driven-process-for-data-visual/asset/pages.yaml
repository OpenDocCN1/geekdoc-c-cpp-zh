    # # Encoding pitch in portrait form


    But I felt that I''nt answered all the questions I was looking for. I could see
    some of the repetitions between the first and third sections, but that''s because
    I knew they were there and could point them out to the reader. It''s not at all
    easy to see this within the context of a circular timeline – like to see similar
    things next to each other or at the very well aligned at the same angle. This
    would mean breaking out of the circular visualisation structures for the first
    time in this project.


    As I looked for more inspiration, I came across the following image by Maria Tsirodimitri,
    Head of Design at the Mo Ibrahim Foundation in London. Maria visualised the different
    parts of a piece of music by assigning a colour to each note, in a horizontal
    timeline form. Crucially, the legend element used a colourful but lyrical palette.


    Since music scales repeat every thirteen notes (for piano players, that''s seven
    white and five black every octave, the thirteenth note repeating the first, an
    octave higher), this shows us the flow of the melodies regardless of octave and
    allows us to compare parts the same notes at different octaves. So, for a melody
    played on the oboe and the bassoon an octave apart will show the same. Similarly,
    the hue difference between any two notes a semitone part will be consistent if
    you have gone up from one octave to another (Figure 3.9.8).


    Maria''s work is cut into sections, partly, I think, to allow a portrait-style
    artwork to fit on one page, but I was able to use this idea to do something similar,
    looking at three sections of music, to see how similar Sections 1 and 3 were.
    Now that they are aligned and depicted by discrete colour bands, the comparisons
    come alive in a better way than we could manage in circular form (Figure 3.9.9).


    The look is a little different – there are more sustained gaps where instruments
    do not play, and there are more short gaps between notes, due to the "A/B/A" nature
    of the piece better than I''d hoped. But this shows the from listening repeatedly,
    that after the bit in the middle, the same themes returned. Until I visualised
    it this way, I didn''t know it was exactly the same, note for note, part for part!'
