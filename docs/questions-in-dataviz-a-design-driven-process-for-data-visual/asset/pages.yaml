  md: '# Chapter 3.6: How many ways can you tile the United States? 255


    My catalogue of tile maps using squares, hexagons or triangles includes the UK,
    Scotland, New Zealand, Japan, Germany and more, and I''m always delighted to see
    other examples, however much of a geographical challenge they might face (Canada,
    example!)


    # Trapezia


    From a mathematical point of view, the reason I focus on squares, hexagons and
    triangles is because these are the three regular shapes whose internal angles
    divide regularly into 360°, allowing them to meet in packed form. Regular equilateral
    triangles have 60° angles, squares and rectangles have 90° angles, and hexagons
    have 120° angles.


    However, any irregular shapes that tessellate in the same way can be used as tile
    maps. So, if you have shapes with angles that can tessellate in the same way as
    a triangle, square or hexagon by adding 360° at each intersection, you can have
    plenty of fun.


    For example, you can use trapezia. Below is a snip from a visualization from Klaus
    Schulte. Klaus''s inspiration for this was a tetrahedron tile map for Germany
    created by Heidi Kalbe, also. Because the tetrahedron''s angles are either 60°
    or a multiple of 60° (some are 120° and the straight edges are 180°), they will
    still tessellate perfectly in certain combinations. But then it solves a lot of
    geographical difficulties, for example we can see Scandinavia somewhat jumbled
    compared to its recognisable shape, but person-, I really like how tetrahedra
    bring a bit of visual unconvention- to the map, while keeping every tile to a
    uniform shape and size (Figures 3.6.8 and 3.6.9).


    As an addendum to Klaus'' map, you will undoubtedly find that no two Europe maps
    are the same, because Europe contains many small countries and city states, such
    as Andorra, San Marino, Vatican City, Liechtenstein and Luxembourg, that it''s
    unlikely that any dataset has every country included. If these aren''t included
    sense to exclude them from your map and not try and tile in the tiniest of states,
    but when they are included, it can really make your design challenging. We''ll
    come across this issue when we discuss tiling the world.'
