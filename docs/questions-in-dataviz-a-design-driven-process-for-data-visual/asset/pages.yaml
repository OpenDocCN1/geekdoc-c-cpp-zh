    learned to play an instrument can recreate the intended musical output the composer
    originally intended.


    After all, a musical score is just another example of an alphabet: a complex visual
    encoding message to practise and record the sounds, tones and patterns of individual
    languages. If a concept such as language, or music, is so detailed, varied, complex
    and beautiful to the extent of being almost infinite in its possibilities, then
    why shouldn''t our methods of visually encoding be simple but not so simple that
    they are instantly understandable without skill or practice?


    In fact, I''d argue that music is infinite – there are an infinite number of places
    you can put your finger on a violin string between the positions of C and D, for
    example, and you can play that note for an infinite amount of time – so that''s
    infinity squared already! (Figure 3.9.1).


