  md: '# 28 Questions in Dataviz


    However, these marks are not just "dots on a map" but real people who were killed
    by police officers. It’s very easy for data visualisers to overlook sensitive
    subjects focusing purely on technical issues and any finalised and completed visualisation
    should be aware of this. This acknowledgement is very important in the idea of
    Data Humanism, which we will discuss later in the book.


    First of all, a map visualisation, especially when the map is shown for background
    context, is a perfect example of 6 (Figure and Ground). When we look at just the
    marks on the visualisation elements, we do not want or expect to look at this
    and think of it as a map of the USA. Instead, we see individual states with coloured
    circle marks (our collection which, along with the background map image, forms
