  md: '# Conclusion


    In this book, I''m posing so many questions because I want to encourage creative
    and non-standard thinking. The important thing is that nothing will tell you the
    one, single, correct chart to use for any dataset, but experience, guidance and
    best principles will rule out the wrong ones. And even at that point, you may
    well make the decision to overrule those principles or have your own reason for
    producing something non-standard. In other words, you''ll have a reason for choosing
    the "wrong" one.


    After all, a personal creative project at least gets a free pass on the "especially
    for client projects" clause as mentioned by Shirley Wu. Above here, all these
    decisions are generally taken once the data has been obtained, processed, examined
    and explored. And the key thing is that your data and its structure will almost
    certainly rule out some wrong or unworkable options.


    Given the data, then it becomes your choice to determine which route you want
    to take, focusing on analytics, aesthetics, impact – if you''re really lucky you''ll
    hit the sweet spot and manage all three, that''s your intention. And as you''re
    learning your trade, there''s an advantage in going down the path of an unorthodox
    visualisation type that you haven''t tried before: the advantage of learning,
    discovery and gaining technical skills.


    The trade-off may be between the chart being less than ideal and the valuable
    lessons learned while learning these new skills – but next time these skills may
    be more useful for a more appropriate use case for something similar. And you
    won''t have found this out if you hadn''t made that initial decision. Once you
    have your data, then you can choose a myriad of design directions.'
