  md: '# Chapter 1.4: Do data visualisations have to tell a story? 47


    our findings are inconclusive or meaningless. In these cases, it''s much better
    to present them without a clear story or to make clear that we are not trying
    to lead our readers into a conclusion they can''t legitimately make.


    Another reason to be cautious around telling a story is that as a visualiser,
    we don''t always have the scientific background or access to the original resource/journalism
    which has generated our data, so we need to be careful not to overstate our conclusion.
    For example, as mentioned earlier, at time of writing, there is no bigger issue
    than the global pandemic COVID-19 which has generated many data visualisations
    all around the globe. But subjects like this will always be a difficult issue,
    and we should only tell a story if we''re absolutely confident of the underlying
    facts.


    In my case, as an analyst with a mathematical background I would consider myself
    qualified to make observations on how the data is changing. Without being a scientist
    (and certainly not an epidemiologist) I can draw conclusions from the data. I
    can''t explain the stories, which means I can''t really tell them with any authority.


    In such cases, it''s better to design your charts accurately and well enough that
    your reader can read and infer their own conclusions if they have greater subject
    knowledge than you do. As a data storyteller, we can perhaps state the basics
    (the plot points – in the case of COVID visualisations, the obvious rises and
    falls of cases, for example) but it''s important not to say no that the data is
    actually telling you, but also to say no more than you can actually tell with
    authority or certainty.


    We all need to examine the stories we tell with a critical eye. Are there biases
    or assumptions we are introducing into the narrative? Does the data itself warrant
    the claims we are making? Are they statistically valid statements? Or, better
    still, stay well away from subjects and stories we cannot confidently tell.


    # Conclusion


    In conclusion, not all of these chapters will be neatly summarised with an answer
    to the question, and this one is no exception. But I think it warrants a summary
    of some of the thought processes.'
