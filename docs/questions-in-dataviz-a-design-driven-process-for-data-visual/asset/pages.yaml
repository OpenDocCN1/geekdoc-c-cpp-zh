    tile map. Countries are closer to geographical positioning on a true map, not
    perfect. It does particularly well for Africa and South America, which are often
    the most important continents when visualising data where more significant or
    outlying results are found in developing countries.


    **Colour:** Colour is used as my main encoding for the quantity visualised, in
    this case to sanitation. I have chosen the Viridis scale for two reasons – first
    the extremes of the scale (from green to yellow) are most pronounced, highlighting
    the issue I want to focus on. And second because the low values stand out clearly,
    but the high values, against a dark background, do not. That''s what I want. Of
    course, analytically we can''t compare quantitatively, but I hope it does a good
    job comparing nation to nation and highlighting areas of concern. I''ve been to
    include a legend with scale and make to include country names and exact metrics
    on a hover tooltip for each country.


    **Size:** As mentioned above – size is just a proxy for the size of the country
    and therefore doesn''t represent the value we''re trying to highlight. This is
