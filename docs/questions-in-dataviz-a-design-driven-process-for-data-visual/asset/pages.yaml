  md: '# Chapter 3.2: What alternative ways are there for visualising timelines? 205


    This least made my decision as to whether more recent events were at the top or
    bottom a little more intuitive. My choice was to travel from bottom to top in
    time, so that the parallel diagonals which are reminiscent of a Lexis chart would
    still be shown diagonally, reading from bottom left to top right. With age being
    a proxy for tenure – it is the president''s tenure of his lifespan, after all
    – we simply swapped axes compared to the horizontal Lexis, fortunately for us,
