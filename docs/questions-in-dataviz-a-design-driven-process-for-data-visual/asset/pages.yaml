    story) had arrived and had to distribute them to the members of my team. This
    was in a time where a lot of appointments were still made and deadlines were recorded
    in good old-fashioned diaries and calendars.


    The calendars were a collection of standard issue red, black, or blue, but in
    all honesty, I never even noticed that they were different colours, until, with
    just one calendar left, I approached the last member of my team. Brian was older
    than me, quite intimidating,'
