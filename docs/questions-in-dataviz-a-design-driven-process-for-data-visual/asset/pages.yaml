    # Conclusion


    Design-driven data is a fascinating data visualisation design concept

    which unleashes creativity and imagination, allowing the designer

    to learn new skills. Without this approach, we may miss the oppor-

    tity to try a particular variation on a chart type that works for

    your data but hasn''t been tried yet. It flies against the principle we

    have already discussed, which is that the data should always come

    first before the design.


    In that sense it might be unusual and unconventional, but it''s

    been essential to my own development, both technically and cre-

    atively, and resulted in most of my favourite personal data visualisa-

    tion projects. What have you got to lose?'
