  md: '# Chapter 2.3: Does it matter if shapes overlap? 117


    Like the above Wimscale example, showing every nation''s timeline to the same
    scale without overlap just wouldn''t make sense, but here we can make the choice
    to show transparency in each layer. That way, we are not hiding information. Look
    at East Germany, for example GDR in the chart) with its huge peak from approximately
    1970–1990. Using transparent peaks means that we can still see the record of Italy
    (ITA) behind it, so no information is lost.


    This particular design gives two advantages. First of all, the lines are only
    overlapped from below if a nation has won over 12 medals in a given year. This
    means that there aren''t many overlaps, but when there are, this adds to the effect.
    Any year where the line above is a successful year, for example, Finland, though
    consistent throughout, only exceed this one, in 1984.


    The second advantage is a metaphorical advantage. Remember how I decided my overlapping
    triangles visualisation had the look of trees in a forest? The cold light blues
    of jagged, overlapping, translucent irregular shapes from foreground to background
    have a look of icebergs, adding to the cold, wintry feel. It was an effect I was
    particularly pleased with what was otherwise a very simple design.


    Sometimes your colours, shapes and positioning can give you a pleasing design
    element through luck. But you can sometimes make your own luck by experimenting,
    iterating and trying different shapes, sizes, colours and chart types, before
    the final look presents itself.


    # Conclusion


    Returning now to the original chapter question — does it matter if shapes overlap?
    To some readers and designers of charts, it will always matter if the shapes overlap.
    And that''s OK. The use of overlapping elements will always be a creative decision
    rather than an analytic decision. Be aware that it''s a question in your data
    visualisation armour it''s OK to ask, consider the response and choose your design
    accordingly. By allowing the concept of overlapping elements, you can increase
    the number of design styles and chart types in your repertoire. Then it''s up
    to you when, or, to use them.'
