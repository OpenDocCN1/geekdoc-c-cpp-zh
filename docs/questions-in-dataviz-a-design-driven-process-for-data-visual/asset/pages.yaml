  md: 'to look appealing. Once you decide on a small multiple format, it''s usually
    important to apply the same design decisions to each individual element that you
    would to a full-sized chart. Whether these are conventional design choices or
    or the kind of choices that challenge convention we''ve been discussing up to
    now, that''s up to you.


    In all cases, each individual chart needs to be readable enough on its merits
    given the smaller scale in which it''s displayed. But often sacrifices in detail
    will need to be made, such as having to omit labels and annotations, and aesthetically
    choosing to do so.


    And this is a reason why small multiple-style visualisations are almost always
    a candidate for an “extra visualisation” of the kind mentioned at the top of the
    chapter. Indeed, the examples of small multiple visualisations given in this chapter,
    the majority have an additional copy of an individual element acting as a key
    or a legend.


    # Identical visualisations with different formatting or display options


    Here''s a fifth use case for small multiplicities that I haven''t made use of
    myself yet, and in fact a use case which I only became aware of as I compiling
    the chapters for this book. Remember Chapter 2.2 where we discussed visualisations
    with triangles? The creators of the triangular ternary charts (Zan Armstrong and
    Lusann Yang) which they used for material sciences visualisations would also use
    another technique using small multiple visualisations.


    They presented a series of small charts in a visualisation that used identical
    data layouts but with different scales and colour gradients. So, unusually for
    small multiple visualisations, it is not the data that varies across each individual
    chart, in this case, from left to each chart, but colours and parameters of scale
    which vary. This allows them to determine which of the individual charts, or subset
    of charts, show the data in the best way – which charts best presented the significant
    findings that would be most of interest to their expert audience (Figure 2.8.8).'
