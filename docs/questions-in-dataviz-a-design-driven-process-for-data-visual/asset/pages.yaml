    # Visualising musical themes


    I wanted to add some more visual to my Water Music animation, so I was able to
    add some static circular timelines. The following tried to highlight repeated
    repetition, call and across sections of the music as well as across different
    instrumental parts. I think it does this reasonably at best but needs a certain
    amount of instruction to the reader to understand the significance of highlighted
    sections they are referring to (Figure 3.9.4).


    | Handel''s almost Water Music full animated intro | Full instrumental static
    score | Reuse patterns and durations | Motif, Call- and answer | Orchestration
    features | Pitch Range |


    ![](img/b909e9b4298ba430102dc44c70463458_329_0.png)


    Here we see some themes used by Handel throughout this homophone. Firstly, we
    see the use of repeated motifs. The coloured areas look almost identical, with
    the first melody played smoothly by oboe and violin just one colour shows here,
    for example). The other thing we notice is that when this motif is repeated it
    is exactly one octave higher in pitch (the oboe and violin call exactly one octave
    lower in pitch). There are a number of further instances where the same motif
    is invited across instruments. The same sequence of repetition, call and answer
    among four instruments is repeated ideally in the final third of the piece.


    However, in the middle section less repetition of musical pitch continues in a
    lively melody in a minor key without brass. Those differences, and the three-part
    nature of this homophone, reinforce the ABA structure, as the opening sections
    are repeated in the final section.


    **FIGURE 3.9.4** Handel’s Water Music – “call and answer” themes.'
