  md: 'Chapter 1.3: What does data visualisation have in common with psychology? 25


    of German psychologists in the 1920s. Immediately this interested me – the multidisciplinary
    nature of data visualisation is one of the things that fascinates me.


    When I had given short presentation at Sheffield University earlier the year,
    this was the first realisation I had that few of my audience, who were all involved
    in some way with data visualisation, had traditional data science or analysis
    routes into the field. Many came into the field from traditional or digital art
    backgrounds, some were statisticians, some students/theoretics, and some from
    altogether different backgrounds. So, there is a link to psychology, in the form
    of Gestalt theory?


    Gestalt, in German, refers to the principle of perceiving something (or, in our
    case,ising something), by considering its individual parts as having different
    characteristics to the whole.


    The word itself closely means “organised whole”. You might describe a tree by
    describing its trunk, its branches, its leaves, its blossom, its roots, not to
    mention many components of a tree we haven''t considered here. But if you were
    to step back and look at a tree, you would just do that and consider the tree
    as a whole entity, and not necessarily all of the different parts we just mentioned.


    Kurt Kofta, who, along with Max Wertheimer and Wolfgang Kohler, was considered
    one of the founding fathers of Gestalt psychology in the 1920s, summarised the
    theory of Gestalt with the assertion “The whole is other than the sum of its parts
    – in other words, the whole takes on its own form that only exists because of
    its parts. It’s this way of thinking that underpins Gestalt theory, though that
    this is quite different to the often-used phrase “the whole is greater than the
    sum of its parts” – a phrase often used when considering team performance, but
    which is a different mantra altogether.


    # Principles of gestalt theory


    I want to explain gestalt theory just a little bit here since it''s an important
    principle that underpins data visualisation and whereas this book is deliberately
    only discussing a few such hand-picked principles, from my own perspective it''s
    important to include Gestalt theory because it is quite possible to overlook it
    as you start your data'
