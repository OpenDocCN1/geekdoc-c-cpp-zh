  md: 'Chapter 2.5: What is design-driven data?


    # Process of design-driven data


    So, the process is as follows. Let''s say I have the design I want to emulate
    (the Manchester picture). What data can I potentially encode that could potentially
    look like this?


    First of all, there are 12 horizontal elements to the picture, all with up and
    down semi-circle elements, and all with their own colours. This could easily be
    tracking something over time to right for 12 different categories/regions/whatever
    – 12 different dimensions. Each of these dimensions could then have its own colour,
    using the same palette, or an approximation thereof, the original.


    So far, so good. Our main shape is the semi-circle, which is used in one of two
    places – the top or bottom of each horizontal strip, and in one of two ways –
    “sticking out” or “cutting in”. There’s no magnitude to these circles, and they
    are always the same size, so that rules out coding the magnitude of anything,
    such as sales over time, medals won for Olympics, etc., but it does mean I can
    code something that exists in three states, namely for each “in”, “out” or neither.


    At this point it’s sensible to consider that the process is iterative. What I
    needed a promising dataset with measures over time and split into different dimensions
    such as countries, with potential to encode my data in the way shown above. At
    the time of creating this visualisation, I was participating regularly in a community
    project called Makeover Monday. Every week there was an existing visualisation,
    with its dataset freely available online. Participants would then have the opportunity
    to explore the data, and create a visualisation. The initial thought behind the
    initiative was to use your data visualisation skills to improve the original image,
    but it was also a great practice opportunity to explore the creative possibilities
    with a different dataset every week and to make a more creative or unorthodox
    approach than the original visualisation. You can probably imagine which of the
    aforementioned directions I would usually take! The current data set at the time
    I was formulating this idea was looking at sales of whiskey over a number of years
    for a dozen or so countries.


    This was perfect for me. As you’ll see from the “how to read” panel, I could encode
    my circular tabs and indents with whether a country’s sales increased or decreased
    year on year (above the bar) and with a little fine-tuning and iteration: for
    example, which gives me about the right number of tabs and indents above the bar,
    a 5% change in sales? – I had my final visualisation.'
