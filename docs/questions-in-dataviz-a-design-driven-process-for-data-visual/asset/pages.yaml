    # ## Visualising the Data Visualization Society’s membership


    Data visualisation is all about presenting data in a visual manner for your readers
    to be able to understand and interpret the values you present. We already have
    a definition of data visualisation, from Andy Kirk in Chapter 2.1: “The visual
    representation and presentation of data to facilitate understanding”. This chapter
