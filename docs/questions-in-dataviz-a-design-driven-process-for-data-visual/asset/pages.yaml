  md: '# Spiral timelines


    Another radial timeline which does a great job of consolidating all previous years’
    views into one view, from 1850 to 2016, this is visualisation from UK-based climate
    scientist Ed Hawkins. Theประเทศไทย is an animated build, and it was even shown
    to an audience of billions at the opening ceremony for the Rio de Janeiro Olympics
    in 2016.


    The radial timeline allows the axis to repeat every 12 months for every year in
    the dataset. In this case, it''s a method that works well because the temperature
    increase, as is all too well known, increasing over time, leading to the radial
    elements getting larger and larger in radius over time. Again, this is not a chart
    to consult when looking for detailed analysis, or for accurate reporting of any
    given data point over the last 166 years, but it does a phenomenal job of telling
    the story of increasing global temperatures in just one chart on one page (Figure
    3.2.5).


