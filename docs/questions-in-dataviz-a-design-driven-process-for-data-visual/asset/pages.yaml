  md: '# Questions in Dataviz


    visualisation journey, as indeed was the case in my own experience. Since it''s
    not possible to go into any great detail here, I would certainly encourage you
    to read, explore or study further if anything whets your appetite following the
    introduction in this chapter.


    Having learned that Gestalt refers to visual perception, it seemed obvious that
    it must therefore have parallels in data visualisation. And, it seems, does, although
    there doesn''t seem to be a hard and fast list or more of principles especially
    when it comes to data visualisation. I''ve nine commonly stated principles which
    are listed below (it''s not a ranked list, so the numbers and order of each principle
    are not important).


    +   1. **Proximity**: we generally perceive objects that are close together as
    being grouped together.


    +   2. **Similarity**: we tend to perceive objects with the same characteristics
    as being grouped together. In data visualisation terms, colour is a good example
    of this.


    +   3. **Continuity**: we tend to consider shapes as continuous as we can, so
    the human eye will usually look for pathways in lines, curves or sequences of
    shapes.


    +   4. **Closure**: we perceive closed shapes as a grouping, or near-closed shapes
    which we perceive in a group shaped as the whole shape.


    +   5. **Enclosure**: we think of objects as belonging to a group when they are
    enclosed in a way that creates a border or boundary around them.


    +   6. **Figure and Ground**: we will usually differentiate between foreground
    (the object in the focus of our vision) and background.


    +   7. **Connectedness**: we will tend to consider connected objects as being
    in the same group, and objects that aren''t connected (or which are connected
    in a different way) as a different group.


    +   8. **Simplicity**: we tend to look for simplicity in otherwise complex shapes,
    in order to reduce our information load.


    +   9. **Common Fate**: things that move together are seen as being grouped together.
    The most common example of this seems'
