  md: 'I won''t explain all of the mathematics behind this, because I''m not sure
    that I can! But I can explain the data visualisation process behind it, which
    is no different from the creative process behind many conventional data visualisations.
    In this case, my data- was simply 100 rows again, with columns consisting solely
    of the repetend value and repeating digits for every associated fraction.


    +   - Find a dataset that you find interesting

    - Play and iterate with the data to see if any interesting developments occur

    - Find what you consider the most interesting or engaging visual story or pattern,
    even if that relies on a stroke of luck

    - Add any necessary design polish, include explanations where necessary, share,
    publish and present


    # Irrational numbers


    My layman''s definition for an irrational number would be any real number already
    defined in the two categories above (integers or rational numbers). In other words,
    numbers that are not definable as fractions. And since any number with a decimal
    that terminates can be described as a fraction, we are basically looking at numbers
    whose decimals go on infinitum.


    The most well-known of these is almost certainly π (or pi). Defined as the ratio
    of circumference to diameter of any circle, it is always the exact number 3.14159265
    ... and so on. In its simplest form, this becomes the perfect-column dataset,
    with the number of rows being the number of digits we create to process, we''re
    simply visualising digits and can do so in any way that takes her fancy, and there
    is literally no limit on the number of digits we want to include. There are many
    visualisations of π which lead to spectacular art-visualisations – typically each
    digit 0–9 will be represented by a different colour and bright, colourful visualisations
    will ensure.


    One data visualiser who regularly visualises π (on the North American version
    of Pi Day, which is March 14th, or 3/4) is Martin Krzywinski, a data visualization
    expert at the Genome Sciences Centre in British Columbia, Canada. Figure 3.87
    shows a visualisation of his from 2014, showing frequency distribution of'
