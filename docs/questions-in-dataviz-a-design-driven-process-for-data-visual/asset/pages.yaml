  md: '# Chapter 3.1

    What is the third wave of data visualisation?


    One thing is sure, we have examples of those who have optimized for past best
    practices, now we need those who epitomized a new wave of data visualization.


    Elijah Meeks


    # Defining waves of data visualisation


    In Chapter 2.4, I introduced the concept of data humanism, following the assertion
    by Giorgia Lupi that data visualisation had reached the point of “peak infographics”.
    In initial drafts of this book, this led me to that chapter “What is the second
    wave of data visualisation?” and introduce the concept on those terms.


    However, the “second wave” term is not as widely accepted as the concept of data
    humanism, and I felt it didn''t really fit the description of the chapter. Indeed,
    google “second wave” in conjunction with data visualisation, and I can pretty
    much guarantee you will only find results related to COVID-19, and although that’s
    perhaps understandable at the time of writing, as the global pandemic which'
  merge: -1
  pgno: 223
- img_proc: true
  md: 'started in 2020 enters its second wave, it confirms that it''s a less established
    concept than that of data humanism itself.


    At the Tapestry data visualisation conference in late 2018, Elijah Meeks, who
    would go to become a founding Director of the Data Visualization Society in 2020,
    gave a keynote speech which introduced waves of data visualisation in a different
    way – he said at the time that we were entering a third wave of data visualisation.


    The first wave was summarised by clarity. Visualisations were generally simpler
    chart types (bar charts and line charts), with no colour or desaturated colour.
    Focus was on titles, labelling and annotations, for all additional clarity. The
    philosophy of the first wave was very much summarised by the teachings of Few
    and Tuf (Figure 3.1.1).


    ![](img/b909e9b4298ba430102dc44c70463458_224_0.png)


    FIGURE 3.1.1 Data visualisation first wave – Clarity – Elijah Meeks.


    The second wave was summarised by systems. The introduction of charting tools
    such as Tableau and libraries such as d3 and ggplot in the previous years leading
    up to the talk had capabilities beyond the “first wave” outputs. Instead of the
    rich textual context and careful annotations, the range of output had exploded
    into a wide, colourful and geometric variety, described as “never meaningless”
    because there was always often complex data hidden within (Figure 3.1.2).'
  merge: -1
  pgno: 224
- img_proc: true
  md: 'Chapter 3.1: What is the third wave of data visualisation?


    # Wave 2 SYSTEMS


    This system is capable of producing some hideous graphics.


    This system cannot produce a meaningless graphic, however.


    ![](img/b909e9b4298ba430102dc44c70463458_225_0.png)


    FIGURE 3.1.2 Data visualisation second wave – Systems – Elijah Meeks.


    This is one of the reasons I abandoned the idea of talking about data humanism
    as symbolic of a second wave of data visualisation. If anything, it''s the endpoint
    of the second wave above which is more equivalent to the concept of "peak infographics"
    introduced by Lupi. Both are acknowledging a saturation of the data visualisation
    field with masses of data, with an abundance of tools, and with a complexity of
    outputs fighting for the attention of readers. Both have witnessed this increase
    and are calling for a change in mentality and future direction.


    The proliferation of the systems in wave two and their capacities means that potentially
    anything is possible. The inclusion of more data can lead to more and more complex
    graphics that become unreachable or intelligible. Peak infographics, may be?


    # Third wave


    Where the third wave is concerned, Meeks acknowledges that many proponents still
    teach and espouse the first wave principles. The first section of this book references
    the principles built and practised by established industry leaders such as Tufte.
    Best principles remain best principles, and many will continue to teach and encourage
    exclusively these principles and practices. So, the first wave hasn’t gone away,
    and indeed nor has this the second wave.'
