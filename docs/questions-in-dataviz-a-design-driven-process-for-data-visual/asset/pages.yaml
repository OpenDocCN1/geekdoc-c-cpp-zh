  md: 'I could state the obvious here and say that the possibilities are literally
    infinite. It''s something we might glibly say in normal conversation in circumstances
    where we want to encourage people to expand their imagination, but if there were
    a definition of an infinite dataset, it''s the set of numbers, whether they are
    whole numbers, real numbers (such as fractions) or irrational numbers.


    Don''t worry about the exact definitions of these types of numbers if you can''t
    remember them back in your school or college days. Rather, just think of the possibilities
    of visualising patterns in numbers. Thinking beyond the conventional idea of our
    numbers representing a measure, or a quantity, here we can take a step back and
    visualise them purely as numbers, nothing more. This chapter can look at a small
    selection of examples to inspire you or give you further ideas for visualising
    numbers.


    # Whole number sequences (integers)


    Let''s start by looking at number sequences, typically integers. These might well
    be infinite, in which case you''d just need to decide how many numbers you want
    to visualise. Some sequences might already be well known in public usage – for
    example the Fibonacci sequence, which starts 0, 1, 2, 3, 5, 8, 13, 21, 34, 55,
    ... with each number being calculated as the sum of the previous two. We can visualise
    the Fibonacci sequence just by considering it as a dataset with as many rows as
    we want and just one column.


    If we visualise each number in our data as a square with a circle-connecting opposite
    vertices, we can generate something like this – which is known as a Fibonacci
    spiral, demonstrating how two numbers add to the next number while generating
    a renowned geometrical shape in the process. Already we have an annotated visualisation,
    which we can further use to illustrate or explain the golden ratio if we wanted
    to take it further (Figure 3.8.1).


    But if we want to look at every whole number, or at least every number 1–100?
    If we choose to envisage properties of each of these numbers, we have a ready-made
    potential 10 × 10 small multiple grid arrangement. You should already know that
    Iget aesthetic pleasure from such grid arrangements in my visualisations!'
