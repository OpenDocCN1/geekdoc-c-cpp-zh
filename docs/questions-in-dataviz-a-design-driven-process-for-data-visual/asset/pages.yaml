    # ## Peak infographics


    In a TED talk and several articles from 2016 onwards, Georgia Lupi, who founded
    and ran data visualisation design company Accurat, and is now a partner at the
    design studio Pentagram, argued that we had reached “peak infographics”.


    The concept of big data, a term that was becoming impossible to avoid, had been
    leading to more and more vast amounts of information being collected. However,
    this didn''t necessarily translate to data visualisation, where the emphasis still
    remained on drawing conclusions that were easy to digest. Charts and visualisations
    were used to convert vast, impersonal aggregated amounts of data into a simple
    visual output for audiences to understand quickly.'
  merge: -1
