  md: '# Chapter 2.3: Does it matter if shapes overlap? 109


    # # Unknown Pleasures


    Where overlaps in visualisations are concerned, arguably the most famous (or infamous)
    examples are derived from an unlikely source, an iconic album cover from the 1979
    album Unknown Pleasures by English band Joy Division (Figure 2.3.4).


    ![](img/b909e9b4298ba430102dc44c70463458_139_0.png)


    FIGURE 2.3.4 Unknown Pleasures - Joy Division/Peter Saville.


    The album cover itself is, of course, a data visualisation. It turns out that
    the original artwork was based on radio/magnetic waves from a pulsar star, which
    was published in the Cambridge Encyclopaedia of Astronomy in the late 1960s. The
    original image consisted of a series of pulse waves, stacked and centred.


    Peter Saville, who was responsible for the artwork in question, recommended the
    image to one of the band members (which member is unclear) and subsequently recreated
    it as the album artwork. The only difference Saville made to the original scientific
    diagram was to invert the colours, so that on black gave it more of a space-like
    feel.


    As the image regained a certain amount of popularity in popular culture, a spate
    of data visualisations began to appear around 2017, when the "ggjoy" package was
    created in R. The term "joy plot" had been coined for visualisations that emulated
    the look of the Unknown Pleasures cover, although the term, originally named after
    the band Joy Division has now widely renamed the ridge plot, with the R package
    renamed to "ggrids".'
