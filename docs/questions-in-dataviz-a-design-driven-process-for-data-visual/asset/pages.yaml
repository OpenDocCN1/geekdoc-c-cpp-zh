  md: '# Chapter 3.2

    What alternative ways are there for visualising timelines?


    Time is an illusion. Lunchtime doubly so.


    Douglas Adams


    # Vertical timelines


    Let''s start with what seem like the obvious observation – a standard timeline
    would run horizontally from left to right in a data visualisation. We read from
    left to right in most cultures, and we perceive time as travelling in the same
    direction. If we watch an Olympic running race, we always see the runners travel
    from left to right across our screens as they cross the finish line. And so, the
    majority of timelines in conventional data visualisations along cultures which
    write from left to right will read horizontally from left to right. But this isn''t
    a book about conventional data visualisations.


    There are various reasons why we might not wish to visualise a timeline horizontally
    from left to right, but they would usually summed up in one of two ways. Either
    the amount of room available on the page or screen suggests that an alternative
    way of displaying a timeline would be a much better fit, or we make a choice based
    purely on aesthetics. Perhaps an alternative would look interesting, impactful
    or cool?


    DOI: 10.1201/9781003240211-20 199'
  merge: -1
  pgno: 229
- img_proc: true
  md: '# Questions in Dataviz


    The most obvious alternative, logically thinking, might be a vertical timeline.
    We Haven''t mentioned constraints of space much yet in this book but it''s generally
    accepted that the horizontal bounds of a visualisation are usually constrained
    by the width of your page or screen, yet vertical bounds of a visualisation are
    much less tightly constrained.


    In the social media age, we think nothing of scrolling vertically – long-form
    visualisations and scrolling have already been discussed in this book, and let''s
    face it, our use of many social media apps involves almost constant vertical scrolling.


    In short, if the length of our timeline is likely to lead to our visualisation
    “long and thin”, then a vertical timeline will be a better user experience than
    a horizontal timeline, not least because this is the standard rule of thumb for
    pretty much data visualisations and all online output.


    # Where do we place most recent events on a vertical timeline?


    But supposing we have a vertical timeline – where does the most recent data, or
    more accurately the most recent data, go? Is it at the top, or at the bottom?
    Of course, “better” could mean more intuitive, more aesthetic, more sensible or
    any number of definitions (Figure 3.2.1).


    ![](img/b909e9b4298ba430102dc44c70463458_230_0.png)


    Figure 3.2.1 Twitter Poll.


    I knew this was a much more contentious question, and so I put it to my Twitter
    followers. Crucially, I made a point of only offering a binary choice. There was
    no “it depends”!'
