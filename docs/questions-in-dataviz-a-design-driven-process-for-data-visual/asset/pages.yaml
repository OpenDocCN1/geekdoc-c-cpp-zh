  md: '# 318 Questions in Dataviz


    as May instead of a shorter month such as February, but the satisfaction of the
    completed project proved, as it often does in challenges like this, well worth
    it.


    My self-imposed project came from an idea of wanting to envisage an album. In
    “How do you envisage music?” I introduced the idea of visualising the actual music
    within a tune and divided everything between “music” and “everything else”. This
    was more of an attempt to look into the possibilities of the “everything else”
    to create a visual record (no pun intended) around an album.


    Straight away, the lessons from two more chapters come to mind. First, I asked
    “Why create unnecessary visualisations?” This is, absolutely, an unnecessary project.
    It’s a challenge for me, and a passion project for me. I did expect some of my
    readers to appreciate it, and many of them did, but that was almost secondary.


    It goes without saying that the work needed to create 31 visualisations, not the
    work to do, prepare and clean the data, means the project needs to be something
    that represents enjoyment for the creator. And anything that goes into this much
    detail on one subject fits our definition of an unnecessary visualisation perfectly.


    At this point, I haven''t mentioned the subject of my visualisation yet – I chose
    the album Flood by They Might Be Giants. A favourite of mine from 1990, it wasn''t
    an attempt to convert my musical taste from three decades ago, it was simply because
    the topic of the songs was light-hearted and fun, almost frivolous, so it didn''t
    seem disrespectful or out of place to convert it into 31 sets of colourful, geometric
    images based around words, syllables and letters.


    The other reason for choosing it was because I knew that one song had just two
    words and another song was less than thirty seconds. The quirky album had quirky
    metadata to accompany it I hoped would be seen in the various outputs – I’d see
    some unusual findings and noticeable differences from track to track.


    Second, I asked “What can I do when data is impossible to find?” Here we discussed
    that if data isn''t out there on a particular topic, you’ll probably need to record
    and create it yourself. In this case, most was available, having been fan sourced
    and published on the'
