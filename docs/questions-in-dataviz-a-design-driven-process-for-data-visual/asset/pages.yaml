    # Setting the challenge


    It seems appropriate to end with this chapter, in relation to a challenge I gave
    myself, during a month in 2020. I chose a music album and wondered if I could
    visualise it in a different way every day for a month. But in addition to the
    “how” it makes sense to look at lessons learned, in relation to questions we discussed
    in different chapters in the book.


    We can briefly cover the question “Why?”. It would be easy to dismiss it as madness,
    of course, and you’d probably be right. I found it was a great, ambitious target
    to set myself to force into really getting immersed in a subject and its associated
    datasets, and to impose my own tight deadlines on visualising my way out of a
    bit of a creative slump.


    Producing and publishing one visualisation deandered from being a fun project
    to sometimes a bit of a millstone, and there were certain times when I regretted
    choosing a 31 day month such'
