    ![](img/b909e9b4298ba430102dc44c70463458_211_0.png)


    FIGURE 2.8.8 Summary of ternary charts across channels – Zan Armstrong and Lucas
    Yang.


    And a few words, to, from Zan Armstrong on the colours:


    Because rainbow color schemes are so controversial, I just wanted to add a quick
    note that the rainbow used in these figures was an intentional choice for the
    analysis. There were only a very small number of specific people using these images
    to analyze the results of each experiment and we knew all had no problem discerning
    red/green. And, the primary use was on a screen (not worried about printing in
    black & white).


    Lastly, in this case perceptual differentiability was arguably the most important
    trait we needed in the color scheme, we were looking for changes in color across
    the triangle-space. And, many popular color schemes give a lot of perceptual differentiability
    while optimizing other benefits.'
