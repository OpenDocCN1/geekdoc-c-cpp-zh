  md: '# Questions in Dataviz


    Du Bois will have been aware of bar charts and their uses, but this chart stands
    out as very obviously flouting those rules. Each bar is steadily longer than the
    bar for the preceding date but instead of a stepped bar, Du Bois emphas this by
    spiralling towards the centre of the page. He would have enough understanding
    of bar chart theory to know that his conscious decision to display in this alternative
    way was in contradiction to the orthodox bar charts devised by William Playfair
    over a century earlier.


    It''s my belief that Du Bois considered two things: first, that this chart was
    for an exhibition. Spirals stand out and are noticed – they intrigue the viewer,
    and we are likely to engage with something we find intriguing, even if our speed
    of initial understanding is not so great. Du Bois had space to display these charts
    at the Paris Exhibition, but it would not have been the prime, most accessible
    area of all the displays on show – space will have been more limited than would
    have been ideal.


