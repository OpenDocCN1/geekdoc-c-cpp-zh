  md: '# Chapter 31.11: How do you create 31 visualisations in a month? 319


    internet, but the process of converting song lyrics and their sentences, words,
    syllables into several different Excel data files was a largely manual task. This
    had taken over a few weeks before I launched the visualising month of May before
    I took the plunge into the first of 31 images. It certainly requires having your
    data ready upfront.


    If you want to undertake such a project, I recommend having the vast majority
    of your data and at least 12 or so ideas ready before you start. Other ideas will
    evolve from these 12 as you get more immersed in the project, and your self-imposed
    deadline requires you to continue coming up with ideas on the fly, but you want
    to make a running start!


    I knew I wanted to focus on words, lines, syllables and letters, though I knew
    at the start that I may need to expand the scope to make it to day 31. I didn''t
    want to envisage anything per per although I think just one visualisation broke
    rule slightly as I introduced chords used in each track. Because I was looking
    at music, with lots of data per track, I knew that there would be a lot of rapid
    visualisations, and quite likely there would be a lot of small multiple visualisations,
    one for each song. Both of these scenarios suited my design preferences and visualisation
    style.


    # Prior inspiration


    The idea wasn''t entirely new. Stefanie Posevac, a UK-based designer and artist
    who we have already mentioned as co-collaborator in the Dear Data project with
    Georgia Lupi, who previously visualised Of the Blue Color of the Sky by OK Go!
    – her visualisations were commissioned to format the artwork for the album cover.
    In Figures 31.1.1 and 31.1.2 we see two of the visualisations and the full “How
    to Read” section.


    This proved to be a great spur to get started and an influence on the style of
    the overall look. My visualisations were going to be mostly black background with
    a bright colour for each song. My track listing explanation with tracks written
    in each relevant colour took a very similar look to Stefanie''s. Although at this
    point the need for one colour per song meant that I was already ruing my decision
    to choose an album with 19 tracks!'
