    # Data-ink ratio


    Crucial to the principles used in attempting to create a clean, uncluttered visualisation
    which highlights the important data elements is the data-ink ratio, introduced
    by visualisation expert Edward Tuft in his seminal publication The Visual Display
    of Quantitative Information in 1983.


    Data-ink is defined as the “ink” necessary to show the data in a given chart (which
    cannot be removed without altering the integrity of the chart). All other (non-blank)
    elements of a data visualisation are referred to as “non-data-ink”; in other words,
    the “ink” used in creating any elements of the chart deemed not absolutely necessary
    to show the data. Tuft considers this unnecessary and distracting. The data-ink
    ratio is therefore the ratio of data-ink/non-data-ink.


    Given the importance of showing the data and nothing else, we can conclude that
    a high data-ink ratio is good – the higher the better. As a result, we are encouraged
    to remove all clutter from charts. Anything considered “non-data-ink” is effectively
    thought of as clutter.'
