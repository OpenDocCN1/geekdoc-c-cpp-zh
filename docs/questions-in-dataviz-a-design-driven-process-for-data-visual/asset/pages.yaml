  md: 'So, I read the book, noted every plot point from every chapter and assigned
    it to the relevant character or characters and its position within the book. Eventually,
    this led to one brand new dataset which was perfect for my purposes. Of course,
    it also led to one visualisation designer who may have had to spend a little more
    time creating the data than initially planned for (me!), but who got to re-read
    and categorise his favourite book, albeit solely, in doing so.


    It''s also worth remembering that every dataset has to start with a human responsible
    for the collection of that data. This is an integral pillar of data humanism and
    is also a concept that leads to an assertion that all data can be considered inherently
    biased. After all, in making the decision to collect data, we have already decided
    what to collect and, crucially, what not to collect.


    When data is collected in such a personal way as in this example, then there''s
    no denying the human influence and bias. I decided exactly how I wanted my data
    to be framed and structured in order to visualise before I begun the collection
    process. And, in categorising much of the qualitative data into a quantitative
    form in which I can use it, I have put my opinions, spins and biases on the resulting
    data.


    In this case, it is an unnecessary visualisation, created purely for my own pleasure
    and for the enjoyment of my audience. But the consideration of self-introduced
    bias is always an important consideration for personally curated data.


    Here''s a still from my visualisation. The emotional highs and lows of each character
    are purely as described from my interpretation and encoded into the data as a
    value from 1 to 10. Those who know the book will understand why I chose the particular
    twists and turns for the cast members'' journeys and the resulting shape ended
    up taking!


    As a fan, both of the underlying book, and of Kurt Vonnegut''s anecdotes he describes
    the stories of, this was never more than a tongue-in-cheek bit of fun. But because
    I had invested so much time in the data curation, I got a lot of enjoyment from
    the process, as well as learning and practising technical elements of visualisation
    (Figure 2.9.2).'
