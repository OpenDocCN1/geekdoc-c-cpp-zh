  md: '# Conclusion


    The remainder of this third section will encourage you to do as I have done –
    embrace the third wave of data visualisation, focusing on design ideas, custom
    visualisations and breaking the mould of best practice and earlier styles, while
    also thinking with a design eye. I’ll introduce you to a small, finite number
    of my own ideas which have arisen from the idea of converting custom visualisations
    and BI tools, and from my practical approach of design-driven data.


    I don''t expect you to use the same examples as I do, many of which might be considered
    unique to me. But well as encouraging you to question principles and conventional
    design choices, I can also demonstrate a number of individual ideas or concept,
    there that have arisen. For every idea that has arisen in a new visualisation,
    there are many more still to be explored, invented and shared.


    Being a data visualisation practitioner in the field means that I have two great
    passions: producing data visualisations and consuming visualisations produced
