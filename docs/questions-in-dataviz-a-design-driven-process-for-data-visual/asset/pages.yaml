    # # Sourcing sport data


    It''s not the only time I have done something similar in terms of collecting and
    curating my own data. Most detailed sports data comes from increasing amounts
    of human-collected data, whether from sensors on the bodies of elite football
    or basketball players, for example, or whether from trained observers and analysts,
    categorising and quantifying every run, kick, shot, cross or tackle; every serve,
    return or volley; every punch, block or dodge, or obviously whatever metrics are
    most relevant for the particular sport.


    This is usually done while watching or re-watching a sports event and is much
    more likely to be available, given recent advances in technology and recent appetite
    for vast amounts of data, for recent contests rather than historic events. It''s
    still a finite set of data and if you don''t have data that you really want, you
    may need to curate it yourself.'
