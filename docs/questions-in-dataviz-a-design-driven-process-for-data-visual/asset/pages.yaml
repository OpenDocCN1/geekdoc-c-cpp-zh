  md: 'Chapter 1.6: Is white space always your friend? 65


    Probably the most famous iteration of the phrase is from the book by Rebecca Hagen
    and Kim Golombinsky – a book aimed at graphic, web and multimedia designers aimed
    at helping its readers to produce effective visual communication.


    Many other publications have thoughts on the concept of white space. Cole Nussbaumer
    Knaflic’s Storytelling with Data book says “We need to get more comfortable with
    white space” and mentions the “powerful effect that white space used strategically
    can have on our visual communications”. The Big Book of Dashboards authors (Messrs
    Cotgreave, Shaffer and Wexler) state that “white space subtly creates distinct
    zones on your dashboards” and highlights in a dashboard where “adequate white
    space allows the data to stand out and not be overwhelmed by complexity”. Alberto
    Cairo’s Functional Art website reiterates “White space is your friend. Empty space
    is needlessly unused space, white space has meaning.


    # Empty space


    Each of these assertions leads to one important distinction, between that of white
    space and empty space. White space is a choice. The exact placement and amount
    of white space is a strategic design choice that allows data or annotation elements
    to be more readable or allows for aesthetic design and placement of data and annotation
    elements. It reduces our cognitive load as we focus on the crucial elements of
    the visualisation.


    That leaves “empty space”. We have left areas of the chart that would be better
    used by adding more data-ink or non-data-ink? Perhaps our chart is not well-enough
    explained, and there are nonuseful blank areas that would be better served with
    an explanation, a title, a legend or a logo? Empty space might be considered any
    non-used space that isn’t by design. In other words, non-used space that isn’t
    doing any of the great things white space can do in the paragraph above.


    Back to my un-annotated chart, it’s undoubtedly clean and uncluttered, but there’s
    no context, no story, and the reader would be hard pressed to find insight from
    it. I’d be certain here that not all of the white space (in the literal sense)
    is my friend. The chart is sparser than it needs to be, and some of the non-used
    space is definitely what we have defined above as empty space.'
