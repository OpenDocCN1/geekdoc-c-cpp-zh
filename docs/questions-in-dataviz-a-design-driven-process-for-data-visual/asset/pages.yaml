    the grey lines, but even if entirely invisible, I would still consider them “present”
    because of the job they are doing!


    If you consider, in general, terms that introducing any constraint is potentially
    restricting creativity, you can always consider its corollary. What if we could
    remove a restraint, might that allow for more creativity? A restraint such as
    the need to keep all of the elements apart from each other, in a grid formation?


    Allowing my triangles to be longer and wider led to the final figure (Figure 2.3.3).
    I’ve already mentioned in the previous chapter how really really the metaphor
    of trees/forests and strong community. But you might think there’s an obvious
    downside to. So many of the triangles now overlap – it’s hard to tell which is
    which. There’s no analytical value in this, only confusion and lack of clarity,
    might you not think?


    Consider the first, non-overlapping version. The triangles may be less haphazard,
    not overlapping and easy to distinguish. The data is still anonymised so each
    individual triangle can’t be traced back to an individual member. So, does it
    matter? Each shape shows analytical value as hard-to-read triangle dimensions.


    The aim is to show the variety of self-reported skills, the geographic locations
    and the overall fact that everyone is different. In that sense, nothing has changed.
    We’re not obscuring vital – generally speaking, overlapping areas suggests a cluster
    of larger values, nothing more.


    The overlap itself didn’t matter, and it served only to emphas the design choice,
    and it’s important to emphas the element of design choice. It didn’t matter to
    me, and I also considered that it wouldn’t matter to my readers in the context
