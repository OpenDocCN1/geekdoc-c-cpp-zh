  md: 'I knew that a more traditional and predictable infographic and fact-based visualisation
    about water wouldn''t really play to my strengths, and the temporary creative
    block I had as a result meant that for a while I didn''t consider entering this
    particular feeder competition. But as I thought tangentially about my options
    and what I could do align better to my strengths and design preferences, this
    gave me the opportunity to take the word “water” and allow me to indulge myself
    in a completely different, and still loosely water-themed, way. I decided to visualise
    Handel''s *Water Music*.


    Spoiler alert – I didn''t win the qualifying contest or for the final. I wasn''t
    going to hit the brief of storytelling, design and analysis that could be better
    achieved by more traditional visualisation, but that was never my aim. After all,
    it''s hard to argue “analysis” when looking at musical notes. I stumbled across
    a new angle on visualisation, and I loved it!


    In terms of visualising music, I''ve been privileged enough to give presentations
    around the subject, and I usually make the distinction between visualising the
    actual music, for example, the notes: pitch, volume, tempo, duration, octave,
    positioning, sequencing and the instruments that they played, and visualising
    “everything else”, which could be any metadata around the music that''s not specific
    to individual notes: the performers, chart position, name, “danceability”, valence,
    words, album title and so on The combination of measurable metrics around notes
    and data around pieces of music is what leads to such a rich topic for visualisation.


    In this chapter, I''m going to be focusing on the first of the two options: how
    do we envisage music?


    Visualising music is nothing new. In much the same way that we use a small finite
    number of symbols to authorise language and communication, for example in English,
    we would use an alphabet of 26 letters, a group of ten digits and a finite collection
    of punctuation marks, we use a small finite number of symbols to practise music.


    To understand written communication we order and space the symbols in a manner
    that they will be understood, by the way we have learned and been taught to understand
    them. To understand music, the same principles apply. We might use a subset of
    the following symbols, arranged and spaced in a way that those who have been taught
    to read music will understand, and those who have'
