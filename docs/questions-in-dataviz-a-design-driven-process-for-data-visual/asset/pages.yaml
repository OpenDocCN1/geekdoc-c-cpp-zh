  md: '# Chapter 2.4: What is data humanism? 125


    could not be better summed up than by the Data Sketches project from leading data
    designers Nadieh Bremer and Shirley Wu.


    In proposing a collaboration of personal creative projects, they decided to embark
    on 12 themed visualisations each where they would gather their own data, create
    their own designs, code their visualisations from scratch and document the whole
    process, while trying new creative approaches and exploring new tools, and having
    lots of fun along the way.


    The result was an award-winning online project which has now become a book in
