  md: '# Chapter 2.2: Why do we visualise using triangles? 89


    And we know that equilateral triangles combine to make a regular hexagon, and
    hexagons can tessellate to form honeycomb structures, one of the most solid, regular
    structures known in nature (Figure 2.2.3).


    ![](img/b909e9b4298ba430102dc44c70463458_119_0.png)


    FIGURE 2.2.3 Hexagon consisting of six triangles.


    Where metaphors for the triangle are concerned, we can imagine triangles to represent
    things that are roughly triangular in shape. The strength metaphor is also considered
    when we might think of triangles to represent trees, valleys or mountain peaks,
    all natural features of great stature and endurance.


    The final relevance of the triangle is perhaps the most obvious. Whereas a circle
    might be thought of represent infinity, with its infinite number of sides, similarly
    a triangle represents the number three. May the three side lengths represent three
    metrics or measurement you''re trying to count. Or the distance from the center
    to the three outer points could also be counting three quantities. After all,
    isn''t a triangle just a radar chart with three measurements?


