  md: 'Mathematically, the effect of increasing radius in a radial chart leads to
    a spiral. And incidentally, the spiralling effect of such a radial chart can lead
    to an obvious metaphor. This chart, especially in its animated form, was presented
    often and as widely as a “climate spiral” with the context, or in some cases the
    firm assertion, that global temperatures were “spiralling out of control”.


    Yes, a powerful metaphor, which perhaps really assisted in its vital nature and
    inclusion in the Olympic Games and beyond. But it’s a metaphor added by consumers
    and journalists. In fact, Hawkins himself does not want to report on Earth’s spiralling
    out of control. On the contrary, as a data visualisation practitioner who builds
    visualisations aiming to encourage us to notice and take action, he firmly and
    rightly believes that “our global emission choices control what happens, so it
    is within our control”. A nuanced difference, perhaps, but one that is worth noting
    if our visualisations are to be published far and wide and interpreted in a crucially
    different manner to your intention.


    A final example – having looked at a radial timeline which led to a spiral shape
    to our metric that we are measuring, i.e. temperature increase, gradually increasing
    over time – to consider an intentionally spiralling timeline. A conventional radial
    timeline such as the one above will start and finish in exactly the same place
    for every repeated time period, which allows us to consider and compare differences
    each time period - in this example, each year. However, an intentionally spiralling
    timeline will increase its radius as time progresses, so that a point’s radial
    position will start further away from the centre and the timeline will not overlap
    on itself (Figure 3.2.6).


    Such a spiral could work for a small number of rotations, but note that it wouldn’t
    be a great suggestion for the climate data above. When I looked at Twitter data
    from a certain Donald Trump, I could tell from the data that he already started
    off using Twitter a lot, but as he got more politically active, usage just increased.
    I could use a much more tongue-in-cheek metaphor of “spiralling out of control”,
    by using a literal spiral timeline, rather than a spiralling line based on a static
    radial timeline, thus making my literal and metaphorical interpretation a little
    more obvious!'
  merge: -1
