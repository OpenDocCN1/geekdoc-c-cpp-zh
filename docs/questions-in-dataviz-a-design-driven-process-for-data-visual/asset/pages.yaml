  md: 'I don’t include the quote above as a “right to reply” or out of any feeling
    that the rainbow colour schemes need to be justified – from some of my colourful
    examples in this book, I would be a hypocrite to do so! But I quote it as a great
    example of questioning supposed best practice and making the design decision to
    go against it. In this case, the questioning process consisted of considering
    and choosing to ignore some of the downsides using a “rainbow” colour palette.


    In my own examples, I am eschewing some colour practice for aesthetic reasons.
    However, in this case the designers are doing so well thought out reasons with
    specific knowledge of both their audience and their intended use of the visualisations.


    # Conclusion


    Perhaps to encapsulate all the ideas where additional copies of a template chart
    are used in one chapter, I should have asked the question “When are n+1 visualisations
    better than n?” But that would just be too clever for its own sake.


    It should be no surprise that many visualisations satisfy more than one of the
    different criteria for individual discussion in this chapter, especially given
    that the examples in this chapter are constant examples of many other concepts
    introduced elsewhere in this book, such as tile maps, design-driven data, data
    humanism, unnecessary visualisations, etc.


    Any visualisation, wherever it is shown here and whomever it is created by, has
    the capacity to spark a question or inspire a new idea.'
