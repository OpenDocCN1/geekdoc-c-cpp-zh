  md: '# 104 Questions in Dataviz


    We choose to encode our data in a precise way – perhaps each dimension on a shape
    is representing a particular measure. Maybe the colour is relevant, or its position
    on the screen. If a line starts and finishes in a particular spot, then every
    twist and turn it is representing a particular data point. If we choose to cover
    up any element in part or in full, are we not obscuring vital information?


    At the end of the last chapter, I introduced a visualisation where I chose to
    visualise every member of the Data Visualization Society individually, using a
    triangle to encode the three measures of self-reported skills and experience.
    Small multiple visualisations, also known as a trellis or tiled visualisation,
    are a particular favourite of mine, and as a way of showing disaggregated data,
    a small multiple visualisation can be a great way to compare and contrast every
    element in the dataset, that represents a count, state, person, year’s data or
    anything else. To do this, you will need to clearly depict each element with enough
    white space to set each element apart so you can read, compare and interpret what
    you need.


    For example, this small multiple visualisation below, in typical trellis formation,
    holds at female representation over time across a number of world nations. Every
    country has its own non-overlapping grid square, so you can see the superior female
    political representation in Rwanda, Cuba or Bolivia, compared to the likes of
    Papua New Guinea or Vanuatu (Figure 2.3.1).


    Back to the triangle visualisation for the Data Visualization Society. Similar
    to the trellis-style small multiple grid above, my first draft looked like this
    (Figure 2.3.2).


    It was fun and colourful, and it matched my self-imposed brief of a poster-style
