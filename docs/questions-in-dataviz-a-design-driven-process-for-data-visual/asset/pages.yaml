- img_proc: true
  md: 'Scrolling past something that is designed to look like a map will lead readers
    to assume it is a map, and for the majority who then don''t spend time to consume
    and understand it, it will remain a map until the point they scroll away. Rather
    than make the leap, people told me they just assumed there was geographical relevance,
    or directly asked me if there was any geographical relevance to the placement
    of the animals.


    Second, readers aren''t able to make comparisons. Are more cats than dogs? More
    hamsters than horses? Even if there are no geographic meanings to placings of
    coloured dots, we can at least make comparisons if we, say, group the animal types
    together. My first, when I discussed this in my initial blog post, was to say
    that this example does not follow Gestalt principles. But that was incorrect.


    Gestalt principles are determined by our cognition, and not the visualisation
    – they describe how our brains instinctively collate and process information.
    For example, we are fooled by the Gestalt principle of proximity to thinking that
    the area of checkerboard light and dark blue colours represents one combined area,
    and perhaps the remaining combined predominantly green and brown area is representing
    another area. So, it''s more accurate to say that with knowledge of how Gestalt
    helps us to interpret visuals, I have chosen to go against this in asking readers
    to interpret the chart. In that sense, you could use this as a very good example
    of anti-Gestalt!


    Third''s not a bar chart.


    # In defence


    But here are my responses and why I think people may have taken this bit too seriously:


    All the points I mention, to make, it obvious enough that it''s not to be considered
    a map. I even had one response, in fairness, not from a UK reader, who didn''t
    recognise the overall shape and had no idea it was map-shaped in the first place
    until they read some of the tweets debating it.'
