    Consider filled space: Does this space really need to be filled, completely or
    all? If not, then using less space, or white space here will lead to a clearer
    and cluttered visual.


    Consider unfilled space: Is this empty space better served by adding something
    in it, such as an annotation, a legend or additional information? If so, then
    we are talking about empty space. If not, and it helps with the clarity of the
    pure visual element, leave it alone (it is your friend, perhaps?) to shape your
    design, to add context or story.


