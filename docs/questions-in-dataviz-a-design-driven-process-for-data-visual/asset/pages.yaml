  md: '# 310 Questions in Dataviz


    own attention. Though I am not in any way a coder, it did make wonder if there
    was a way that I could participate in the initiative using my own skills and software
    tools in data visualisation.


    But to further investigate this concept, or to understand what was being shared,
    I needed to understand a bit more generative art is. Wikipedia defines it as “art
    that in whole or in part has been created with the use of an autonomous system”
    – the implication that it is created by non-human, and that this process in itself
    determines features of the artwork without human intervention.


    In other words, in the context of generative art on Twitter, we are talking computer-generated
    and random/algorithm-driven art. Crucially, one word that didn''t get mentioned
    as the input or medium for generative art is “data”.


    It’s important to understand that at the time of writing the field of generative
    art is very much linked with the fields of non-fungible tokens (NFT). Digital
    art, and generative art in particular, has an early use for NFTs, because of the
    ability of blockchain technology to ensure the unique signature and ownership
    of NFTs. So, the concept of ownership of such digital art pictures can be crucial,
    and potentially also means that the field could become lucrative. And it’s a reason
    why I can’t take any example of generative art I might see online and include
    it in this publication!


    One data visualisation expert who is moving into the field of generative art is
    Nadieh Bremer. Already the holder of many Information is Beautiful Awards and
    co-participant in the Data Sketches project and book (Shirley Wu), Nadieh has
    begun to create generative art pieces. One such piece, named Genesis, from the
    Wanderlust collection, is shown in Figure 3.10.1.


    As Nadieh explains, technically the image isn''t 100% generative art either because
    she is using the data of an Ethereum block, where each shape represents a transaction
    that happened in a specific Ethereum block, and the shapes are sized and given
    shape according to their value transferred/type of transaction.


    However, the colours applied and positions are totally random, which forms the
    pure generative part of the image. And even though I may, personally, have very
    little understanding of what an Ethereum block is, I appreciate the wit of including
    it as an integral part of the image to understand the “meta” nature of that particular
    design choice.'
