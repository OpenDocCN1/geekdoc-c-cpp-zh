  md: 'That''s all very well, and it does represent a situation I''ve chosen to replicate
    a couple of times, although a better solution may be to hide the secondisation
    type in the form of a hover action or tooltip, such as my Big Bird visualisation
    seen in Chapter 2.5.


    My main example, which is a technique I use regularly, is to use a copy of part
    or whole of the visualisation as a key/legend for the whole thing. In the Figure
    2.8.1, I''ve used a larger version of the US hexagonal state map by taking a copy
    of the "$25,000-$49,999 earners" map and enlarging it slightly, so that I could
    include state labels and explanations. On the main view there is little room to
    include the labelling on every tile, and any attempt to do so would heavily detract
    from the design. The user will hopefully understand that this more readable version
    acts as a template for the rest of the versions.


    ![](img/b909e9b4298ba430102dc44c70463458_200_0.png)


    Figure 2.8.1 What if ...?


    This is something you''ve already seen in this book and will see me do again.
    Often a good way to give instructions to your readers is to take a copy of your
    visualisation, whether it''s the whole visualisation or a section, and recreate
    it in the corner or on another page entirely. This second chart then becomes fully
    annotated with instructions where needed and can be as detailed as necessary without
    distracting from the main image.


    In doing this, you have the freedom to remove labels and explanations from the
    main image, so you can focus more on the cleanness or the impact of your design
    with the story you are trying to tell.'
  merge: -1
  pgno: 200
- img_proc: true
  md: 'The reader can then refer to the second copy in their own time. Although it''s
    not the same thing, this acts in the same way that a legend would act on a simpler
    chart such as a bar or an area chart. Having the legend ready and available to
    refer to, when necessary, allows the designer to avoid labeling each particular
    colour or element on the main chart itself.


    A subtle variation on this theme, although the visualisation itself is not especially
    subtle, can be seen in this visualisation I prepared to compare the RSPB''s Big
    Garden Birdwatch scores of 2020 and 2021 in the UK (Figure 2.8.2).


    In this example, I didn''t mind that the labels for each individual areas of the
    United Kingdom were small and faint, since readers would have a good knowledge
    of where each region, even in a new and unfamiliar layout. Similarly, the colour
    of the four constituent nations, plus the Isle of Man and Channel Islands, a separation
    so clear it doesn''t need including in any explanation. But in choosing to put
    diverging bars on each tile I had no way of explaining which bird was represented
    by which bar.


    This is an example of Schneiderman''s Mantra – the elements relative to data visualisation
    can be summed up in three steps: (a) overview, (b) zoom and filter and (c) details
    on demand. Introduced in a paper “The eyes have it: a task by data taxonomy for
    information visualizations” by Ben Schneiderman in 1996, these steps loop to introduce
    a taxonomy of tasks to aid good communication with data. In other words, although
    we do to give people the opportunity to look at the details, just as importantly
    we want to give them the broader story first and most prominently.


    Similar to our first example, a larger, single tile performs this job nicely at
    the bottom right, where I am to show which bar refers to which bird in the form
    of a picture. And in fact all of these pictures are labelled with further information
    about their overall ranking beside this graphic.


    But I mentioned that this varied from our US political example – in this case
    the larger, separate copy of the graphic represented the UK overall figure. With
    no specific geographical location within the UK map, the overall figures needs
    to be displayed separately anyway, so in case the additional graphic is performing
    two jobs: that of displaying the overall data, and of acting as an explanation
    or legend.'
