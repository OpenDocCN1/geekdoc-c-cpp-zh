  md: '# Handel’s Water Music


    Back to Handel’s *Water Music*. Having decided that I wanted to envisage the score,
    I soon decided I wanted to show the music radially. This can be quite an obvious
    design decision to make when visualising music, but that doesn''t make it a bad
    or wrong decision in my opinion.


    Two reasons stand out for this choice – first, musical scores can be lengthy,
    and visualising around the diameter of a circle is one of the most efficient and
    compact ways of showing data on a timeline. After, if we have 1000 units of width
    on our screen, and we assume that each second of music will occupy 10 units, then
    we can show 100 seconds'' worth of music. If we assume we have 1000 units of height
    available too, and we can curve this timeline into a visible score up to (1000×π)=3142
    units, or 34 seconds.


    And, and perhaps more obviously, records and CDs are circular. We don''t think
    twice about that association, music is traditionally played by rotating discs,
    whether vinyl, CD or even via traditional music box, so it’s aesthetically pleasing
    to us see visualisations in that way.


    # Off the Staff


    My first influence was Chicago-based information designer Nicholas Rougeux and
    his project “Off the Staff” where he radially visualises a number of well-loved
    classical tunes. Figure 3.9.2 is his visualisation of Pachelbel’s *Canon* – a
    piece for four-stringed instruments, each instrument shown in a different colour.
    The piece runs clockwise from the top – the pleasing thing about visualising the
    Pachelbel piece in particular is the metronomic regularity of the dark blue cello
    part – its low pitch doesn''t overlap with the three melodies of the violin parts,
    and it results in a perfectly regular symmetrical pattern throughout.


    Rougeux’s website, at https://c82.net, draws the animation in time to the music,
    in much the same way I wanted to, and also gives one excellent method of converting
    midi data files to data of a format that most data visualization software packages
    or libraries will understand.'
