    # # Unconventional tile shapes


    We can take the idea of unusual shapes even further, as seen in the below example
    of tessellating wind turbine shapes. It doesn''t add to the analytic value, but
    it adds to the fun aesthetic, although arguably the shape works quite nicely for
    FL and TX at the bottom. Really these are stylised triangles, tiling in a way
    that they align top and bottom (as we saw in the more regularly aligned Africa
    triangle tile map above) (Figure 3.6.10).


    ![](img/b909e9b4298ba430102dc44c70463458_287_0.png)


    Figure 3.6.10 Wind turbine use in USA.


    The previous examples using trapezia show that you can align and tile more irregular-shaped
    polygons by rotating them to fit your overall region region. On one occasion,
    this got me thinking – since any shape that allows for interlocking pieces, that
    is to say with shapes with external angles that are divisors of 360°, could conceivably
    be used, and we can use combinations of different tile shapes that fit these criteria
    instead. Because we''re not generally trying to pack our tiles into a regular
    shaped square, rectangle or triangle, since countries themselves are not regularly
    shaped, this allows for much more irregular tiling within the “interior” of a
    tile map. The only stipulation, which we haven''t deviated from, is that tile
    areas are all the same.'
