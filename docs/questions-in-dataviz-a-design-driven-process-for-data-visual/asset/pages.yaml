  md: '# 234 Questions in Dataviz


    In researching and emulating W.E.B. Du Bois, I had found a new influence, 118
    years after his work gained prevalence. Du Bois believed that experimentation
    and unorthodox methods got results. The intrigue and the interest shown in a visualisation
    would then lead to insight. He may not have lived in the social media age with
    the “data viz police”, but if he had, he would have asserted that they are not
    always correct, or to be listened to!


    If you are willing to expand your initial learnings and question your textbook
    data visualisations, there are a wide variety of influences past and present who
    can shape and expand your portfolio of creative ideas. W.E.B. Du Bois is not likely
    to be one of the first pioneers you come across in your data visualisation journey,
    indeed I learned about him in 2018, after approximately three years of immersing
    myself into data visualisation learning, personal projects and the online community.


    Earlier this year, at the start of 2021, I felt a great feeling of warmth as many
    other visualisation practitioners relatively early in their careers also learned
    of him and his work for the first time, through diversity initiatives launched
    by Tableau and others, and highlighted by Allen Hillary who ran his Du Bois challenge
    to encourage people to find out more about him and recreate their own versions
    of his classic originals, ensuring that many more in our field continue to learn
    and be inspired by his story and ground-breaking visual representations of data.


    # Conclusion


    Both of my own Data Portrait–inspired examples here are examples where I looked
    outside of the traditional data visualisation sphere, both in terms of chart type
    and in terms of tool use. My aims in each case were to be faithful to the original,
    and to replicate the designs using my chart design tool of choice, fully citing
    and crediting my obvious inspirations.


    Such are perfect opportunities to push yourself creatively and technically while
    learning from some of the most influential and interesting examples within our
    field. In these cases, as so many others, the principles of the designers will
    inspire me to diverge further from their original creations to push the boundaries
    of creativity and unorthodox further.'
