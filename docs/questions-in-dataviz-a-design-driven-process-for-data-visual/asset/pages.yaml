  md: '# Music as data


    Essentially, visualising music is a very “data visualisation” thing to do. Traditionally,
    we are arranging data points on a series of timelines, positioning them according
    to pitch, placing them according to other dimensions such as musical instrument
    and choosing the mark type to encode the data according to the duration of a note.
    Taking this analogy further, all of the creative, non-standard questioning we
    can apply to regular data visualisation, we can apply to music visualisation.


    Some questions of the top of our head might be: I can introduce/encode colour?
    What would be the best or most innovative timeline I can use – horizontal, vertical,
    radial or something else? And if vertical, then translating upwards or downwards?
    Is there a story I can or tell? How much annotation do I need, if any? These are
    all questions we''ve asked about data visualisation in this book already, and
    would apply to music visualisation.


    And as for the concept mentioned above: that our methods of visually encoding
    might be simple but not so that they are instantly understandable without skill
    or practice – in other words it may take time to interpret, digest and appreciate
    visual encoding of music – well, if you''ll excuse the pun, that''s music to my
    ears.


    It encapsulates the ethos that I''ve mentioned a few times now in this book, that
    if you are questioning conventional methods and practices in data visualisation
    and going against such methods and practices as a result, it''s not yours to aim
    for instant gratification at the expense of impact and creativity, and have a
    simple chart understood in a matter of seconds.


    A final consideration with visualising music that''s both an inspiration and a
    caveat – there is probably no better visualisation suited to animation than visualising
    music. After all, if your visualisation moves, changes or animates along with
    the music, it''s a perfect way to tell the story of the music you are visualising,
    or to engage your reader, who in this case might also be your listener, with the
    visualisation so that the experience is enhanced and every element of the visualisation
    is obviously linked, highlighted and connected to the relevant note. The downside
    is that it''s impossible to consider that in a book, unfortunately.'
