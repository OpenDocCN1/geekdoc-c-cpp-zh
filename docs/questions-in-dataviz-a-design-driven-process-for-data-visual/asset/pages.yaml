  md: '# Chartjunk


    In discussing the issue, Tuftie introduces the principle of “chartjunk”, a phrase
    he is considered to have coined himself. Chartjunk is described, perhaps loosely,
    as visual elements of charts and graphs that are not necessary to comprehend the
    information represented on the graph, or distract the viewer from this information.


    I’m not particularly enamoured with the phrase because it’s not exactly neutral.
    Nobody wants to be thought of as producing or displaying “junk” so the term comes
    with a negative preconception. Nevertheless, it is repeatedly used by Tufte and
    thus well understood, so we will continue to use it here.


    And I’m also not 100% sure what constitutes chartjunk by definition – I would
    see this definition as being very similar, if not the same, as the definition
    of “non-data-ink”, but I know that one of the classic images often used to illustrate
    chartjunk is the chart below Nigel Holmes (incidentally, he is described by Tableau
    Research Scientist and expert Robert Kosaras as the “anti-Tufte”).


    Nigel Holmes was graphic director for Time magazine at the time of the publication
    of The Visual Display of Quantitative Information in 1983. There’s no doubt that,
    a purely analytical viewpoint, there are no unnecessary and potentially distracting
    visual elements here, and it’s this chart that Tufte launches into his follow-up
    Envisioning Information with the following diatribe (Figure 1.6.2):


    > Consider this unsavory exhibit – chockblock with cliché and stereotype, coarse
    humour, and a content-empty third dimension. [...] Everything counts, but nothing
    matters. The data-thin chart changes in the value of money with changes in diamond
    prices, a crucial fusion because the graph chronicles a time of high inflation.


    Lurking behind chartjunk is a contempt for information and for the audience. Chartjunk
    promoters imagine numbers and details are boring, dull and tedious, requiring
    ornament to enliven. [...] Credibility vanishes in clouds of chartjunk; who would
    trust a chart that looks like a video game?'
