  md: '# Chapter 2.4: What is data humanism? 127


    Each week, over the whole year, they collected and measured a particular type
    of data about their lives, used this data to make a drawing on a postcard and
    posted it to their co-collaborator. Eventually, the postcard would arrive at the
    other person’s address in a process they described as a type of “slow data” transmission.

    Fast forward to 2021 and the postcards are now exhibited in MoMA in New York,
    as well as being featured in a book of the same title, a permanent exhibition
    as a reminder of Giorgia and Stefanie’s journey of discovery. By collecting and
    reporting data in a slow, personalised and hand-drawn way, the process they made
    learn about themselves and each other in a way they would never have anticipated.
    As stated on their website:


    Instead of using data just to become more efficient, we argue we use data to become
    more humane and to connect with ourselves and others at a deeper level.


    And of course, thankfully for those of us who appreciated their unique and imaginative
    way of presenting personal data, it resulted in 104 truly unique and creative
    hand-drawn data visualisations.

    But putting data humanism to one side, this project was a “light bulb” project
    for me as it instilled a more basic realisation in me, the realisation that you
    can visualise data in any way you like. The only thing you need to be able to
    do is to sketch and draw your output. In fact, you don’t even need to be able
    to do that – your software tool or coding language of choice can do for you.


    In my case, the satisfaction comes from being able to do so in a way that’s more
    skilful and accurate than my own hand – I just need to be able to come up with
    a drawable idea, whether I can draw it or not, and then, with the appropriate
    amount of skill, precision and patience, I can create the visualisation in mind.


    # The data we don’t see


    The second of Lupi’s projects to include was a collaboration with musician Kaki
