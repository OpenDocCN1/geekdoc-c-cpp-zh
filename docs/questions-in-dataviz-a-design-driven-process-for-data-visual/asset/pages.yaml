- img_proc: true
  md: 'To take the analogy further, I''ve stated that my personal preference is to
    aim to create visualisations that would potentially look great in poster form
    – static pieces take pride of place displayed on a wall somewhere. So, to me,
    “Data Portraits” fits well for creative visualisations that paint a pleasing,
    artistic picture of data. But it''s not a term I can use to summarise this book,
    or my work, in general, it''s a term that has been prominently used not once,
    but twice that I''m aware of in data visualisation.


    # Data Portraits – Giorgia Lupi


    First of all ... Giorgia Lupi introduced the concept of personalised data-driven
    badges for attendees at the TED 2017 Target space in Vancouver. Attendees had
    answered a series of simple personal questions and she created a unique data-driven
    design based on these answers, which were then created into physical button badges.
    This was done almost instantly by generating the images, printing them, and creating
    the physical.


    These were known as Data Portraits, the intention was to consider the personal,
    human nature of data and to act as a talking point for attendees based on their
    responses – their similarities and their differences – perhaps to get know each
    other in a fun, data-driven, visual way.


    In November 2018, I wanted this for my myself. These data portraits were the inspiration
    for me to see if I could use the same ideas and principles, but rather than hand-drawn,
    or iPad drawn, I would recreate this using Tableau. So, at a Tableau gathering
    in Manchester one evening, I asked a few questions of attendees as they joined
    with the intention of creating my own Data Portraits. In this case, I didn''t
    have the whereabouts to go one step further and create physical button badges,
    and this was just an exercise to create the images digitally and display at the
    event.


    As far I know, this hasn''t been done using Tableau before. Introducing this to
    the group would fulfil three criteria: demonstrating a new skill in my chosen
    visualisation package, talking about the concept of data humanism and introducing
    this new audience of data visualisation practitioners to Giorgia''s work and concepts.
    Of course, it was clear that the concept itself absolutely wasn''t my'
