    It’s this duality of data visualisation that has had me hooked and taken me on
    a journey from the early days of 2015/2016 to where I am now, writing this book
    in late 2021. In my early days, I sought out from Tableau’s “Zen Masters”, a title
    awarded by Tableau to those most active in the user community who are at the top
    of their craft in mastery, teaching and collaboration, restricted to only a small
    number of users worldwide.


    And I’ve been honoured and fortunate to have since been awarded the title myself
    (now renamed to Tableau Visionary) four times at the time of writing - it’s a
    lite I use to promote the technical “how to” aspects of one particular tool, but
    the joy to be found in creativity, unorthodoxy, new design ideas, stretching boundaries
    and rules and visualising data for personal enjoyment.


    One of the benefits of the pleasure and recognition I gained through my journey
    into data visualisation is a genuine desire to give back and reciprocate. My journey
    started with attending talks, following blogs and reading books. And now I love
    nothing more than talking, teaching and presenting my experiences and design ideas
    at events and conferences.


    Having so much from other blogs, I soon started a blog called Questions in Dataviz
    (questionsataviz.com) where I showed and documented my journey in a series of
    blog posts. This book is the formal version of my blog and the final part of that
    puzzle – ultimately a book for people with an outlook like me who are looking
    for creative thought processes and ideas to take their visualisation to another
    creative level.


    This book details many of the things I have learned, experimented with, queried
    and created along my data visualisation journey. It’s the journey of someone who
    has learned and tried to put into practice data visualisation best practices,
    but who has then wanted to emulate the creativity, art and imagination of data
    visualisation practitioners he has encountered on the way. A nonartist who has
    found a creative outlet using data, and who continues to look for ideas and influences
    in every new project he creates.


    Walk with me along the way, encountering the principles, questions and ideas I’ve
    encountered, and encounter them in a series of chapters posing questions at every
    point. The journey might not be exactly linear in terms of how I progressed through
