    # Tiling USA by county


    So far we''ve discussed the question of different ways of tiling the United States
    with one tile per state, with or without the District of Columbia. But it is possible
    to create a tile map for the United States which includes every county?** The
    answer is yes, it is possible, I done it – at least I''ve done it for the lower
    48 states.


    Of course, the better questions to consider are “Should you ...?”, or maybe “What
    are the pros and cons of such a map type?”. Or perhaps “How on earth did you do
    it?” and the related “Why?”. Most of these questions we have covered above. US
    counties can vary significantly in size, but even more in population. It''s important
    to be aware that each individual hex tile can represent ten million people, in
    the example of Los Angeles County, California, to just 169 people at count in
    Loving County, Texas.


    For my first US county tile map, I didn''t worry about population figures – it
    was purely a celebration of pride and colour, an exercise in tiling over 3000
    counties. This map shows the number of same-sex couples in the US at county level.
    There are some trends in terms of colours – the reds and oranges, representing
    fewer same-sex couples by percentage, are concentrated around the Midwest areas;
    with pinks and purples, representing higher percentage same-sex couples, showing
    closer to the coasts and major urban areas (Figure 3.6.12).'
