  md: '# Chapter 2.4: What is data humanism?


    here the complexity is in the necessarily large amount of information display.
    We are encouraged to explore and learn about 1200 humans, rather than see, for
    example, aggregated bar charts which could be consumed more quickly and simply.
    And it enables us to see the imperfect detail of the human-collected data.


    It’s telling that my first thought was how complex the visualisation was, in my
    novice stages of learning my software tool, I had no idea how to create the above.
    The default behaviour is to aggregate or to summarise. If there are 1200 data
    points with a numerical metric attached to each, your software tools is most likely
    going to show one number that summarises, whether that’s a sum, an average or
    something else.


    This simple observation about the default behaviour of Tableau and other visualisation
    tools is a telling indication that disaggregating data is a new, non-first-wave
    behaviour that needs re-learning.


    # Promote slowness


    There’s an often-cited quote from Seth Godin, a highly influential US marketing
    author and blogger, that states:


    > I don’t think that is what graphs are for. I think you are trying to make a
    point in two seconds for people who are too lazy to read the forty words underneath.


    I’ll be honest that I can appreciate the context of the quote, it will never be
    a philosophy that aligns with the way I like to practise data. I could certainly
    have posed a question and chapter challenging this concept that wouldn’t have
    been out of place here. My takeaway, in the context of post-peak infographics
    data visualisation, and of data humanism, in particular, is that a natural result
    of data humanism is the need to encourage engagement with our visualisations.
    We actively want our readers to slow down, to explore, engage and appreciate the
    detail, the direct antithesis of Godin’s quote.


    Remember, as it is case throughout this book, that frame of reference is for the
    non-business chart, the creative data visualisation, usually the personal project.
    Godin’s quote might perfectly encapsulate the busy business exec for whom you
    are including a chart in a presentation at work, but these are not the circumstances
    we are considering here. Personally, and perhaps selfishly, if I am taking time
    to curate something creative, I want my audience to spend time appreciating it!


