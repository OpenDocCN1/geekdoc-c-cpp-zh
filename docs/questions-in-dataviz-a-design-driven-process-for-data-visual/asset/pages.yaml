  md: '# Chapter 3.7: Is it possible to tile the world? 273


    In a stubborn way, I take this as a compliment. There is no underlying geographic
    map underneath, but the suggestion that there is an underlying map that means
    my design has worked well in terms of initial shape recognition! And I''m glad
    there''s an acknowledgement that I have to make certain design decisions in order
    to incorporate soul – ultimately that''s what the above paragraphs try and consider.
    It''s a thought that permeates most of the later chapters of this book too.


    Mitigating the downsides of two approaches can result in a compromise which is
    unlikely to entirely solve either approach''s issues. The decision then becomes
    down to the designer, who must consider his/her audience and design wishes, as
    to whether a compromise is even an option for the particular scenario. I''ll continue
    to use my hybrid world map as a tool for representing metrics by country, but
    always in circumstances where I think its advantages make it a good candidate
    for the particular visualization, since it may not be the best option in every
    case.


    # Dorling Cartogram unit chart


    Here''s my third global tile map example. It''s arbitrary whether you would call
    it a global tile map, but I include it here because it''s a map of the world and
    it''s got tiles in, so there''s no need to over-think the categorisation! It''s
    never essential to be constrained by exact chart definitions and taxonomies because
    you may miss out on exactly the visualisation you''re trying to create, whether
    that''s because your inspiration is something that doesn''t confirm to a pre-set
    chart type in the first place, or whether that''s because your idea is not quite
    the same as more conventional existing types.


    A Dorling Cartogram is a type of cartogram or tile map, usually consisting of
    circles or squares, where the tile for each district is proportional to the metric
    you wish to visualise. I''ve taken this step further, so that instead of proportionally
    sized tile, I have chosen to use several tiles per country, as might be done in
    a unit chart, hence my decision to name this a Dorling Cartogram Unit Chart (Figure
    3.7.5).'
