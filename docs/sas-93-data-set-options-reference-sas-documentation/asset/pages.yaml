    # RENAME= Data Set Option


    Changes the name of a variable.


    **Valid in:** DATA step and PROC steps


    **Category:** Variable Control


    # Syntax


    ```

    RENAME=(old-name-1=new-name-1 < . old-name-n=new-name-n>

    ```


