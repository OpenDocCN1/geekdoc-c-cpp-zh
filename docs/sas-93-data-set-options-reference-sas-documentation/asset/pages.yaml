  md: "# References to SAS Libraries and External Files\n\nMany SAS statements and\
    \ other language elements refer to SAS libraries and external files. You can choose\
    \ whether to make the reference through a logical name (a libref or fileref) or\
    \ use the physical filename enclosed in quotation marks. If you use a logical\
    \ name, you usually have a choice of using a SAS statement (LIBNAME or FILENAME)\
    \ or the operating environment's control language to make the association. Several\
    \ methods of referring to SAS libraries and external files are available, and\
    \ some of these methods depend on your operating environment. \n\nIn the examples\
    \ that use external files, SAS documentation uses the italicized phrase *file-specification*.\
    \ In the examples that use SAS libraries, SAS documentation uses the italicized\
    \ phrase *SAS-library*. Note that *SAS-library* is enclosed in quotation marks:\
    \ \n\n```\ninfile file-specification obs = 100;\nlibname libref 'SAS-library';\n\
    ```"
  merge: -1
