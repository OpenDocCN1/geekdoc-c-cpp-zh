  md: '# What''s New in SAS 9.3 Data Set Options


    # Overview


    The SAS data set options documentation is no longer part of SAS Language Reference:
    Dictionary. The SAS data set options that were previously documented in SAS Language
    Reference: Dictionary are now documented here, in SAS 9.3 Data Set Options: Reference.


    # Changes to SAS Language Reference: Dictionary


    Prior to SAS 9.3, this document was part of SAS Language Reference: Dictionary.
    Starting with SAS 9.3, SAS Language Reference: Dictionary has been divided into
    seven documents:


    +   * SAS Data Set Options: Reference

    * SAS Formats and Informats: Reference

    * SAS Functions and CALL Routines: Reference

    * SAS Statements: Reference

    * SAS System Options: Reference

    * SAS Component Objects: Reference (contains the documentation for the Hash Object
    and the Java Object)

    * Base SAS Utilities: Reference (contains the documentation for the SAS DATA step
    debugger and the SAS Utility macro %DS2CSV)


    # New SAS Data Set Option


    The following data set option is new:

    EXTENDOBSCOUNTER=(p. 19)

    extends the maximum observation count in an output SAS data file.'
