- img_proc: true
  md: '# BUFSIZE= Data Set Option


    Specifies the size of a permanent buffer page for an output SAS data set.


    +   **Valid in:** DATA step and PROC steps


    +   **Category:** Data Set Control


    +   **Restriction:** Use with output data sets only.


    +   **See:** BUFSIZE= Data Set Option under UNIX, z/OS, or OpenVM in the documentation
    for your operating environment.


    # Syntax


    ```

    BUFSIZE= n | nK | nM | nG | hexX | MAX

    ```


    # Syntax Description


    **n | nK | nM** specifies the page size in multiples of 1 (bytes); 1,024 (kilobytes);
    1,048,576 (megabytes); or 1,073,741,824 (gigabytes). For example, a value of 8
    specifies a page size of 8 bytes, and a 4k specifies a page size of 4096 bytes.


    > Note: If the system option and the data set option are not set, the default
    is 0. As a result, SAS uses the minimum optimal page size for the operating environment.
    The BUFSIZE= system option is used in either of the following scenarios:


    +   - if the BUFSIZE= data set option is not set

    - if the BUFSIZE= data set option is set to zero


    Use BUFSIZE=0 in order to reset the buffer page size to the default value in your
    operating environment.


    # hexX


    specifies the page size as a hexadecimal value. You must specify the value beginning
    with a number (0-9), followed by an X. For example, the value 2dx sets the page
    size to 45 bytes.


    # MAX


    sets the page size to the maximum possible number in your operating environment,
    up to the largest four-byte, signed integer, which is 2³-1, or approximately 2
    billion bytes.


    # Details


    The page size is the amount of data that can be transferred for a single I/O operation
    to one buffer. The page size is a permanent attribute of the data set and is used
    when the data set is processed.


    A larger page size can speed up execution time by reducing the number of times
    SAS has to read from or to the storage memory. However, the improvement in execution
    time comes at the cost of increased memory consumption.


    To change the page size, use a DATA step to copy the data set and either specify
    a new page size or use the SAS default. To reset the page size to the default
    value in your operating environment, use BUFSIZE=0.'
