  md: "# Example 3: Using a Spill File with Two-Pass Access\n\nThis example creates\
    \ a DATA step view that generates a large amount of random data and uses the TRANSPOSE\
    \ procedure. The example illustrates the effects of SPILL= with a procedure that\
    \ requires two-pass processing.\n\nWhen PROC TRANSPOSE processes the procedure\
    \ must make two passes through the observations that the view generates. The first\
    \ pass counts the number of observations and the second pass performs the transposition.\
    \ With SPILL=YES, a spill file is created during the first pass, and the second\
    \ pass reads the observations from the spill file. With SPILL=NO, a spill file\
    \ is not created—after the first pass, the DATA step is restart.\n\nNote for the\
    \ first TRANSPOSE procedure, which does not include the SPILL= data set option,\
    \ even though a spill file is used by default, the informative message about the\
    \ open mode is not displayed. This action occurs to reduce the amount of messages\
    \ in the SAS log for users who are not using the data set option.\n\n```\noptions\
    \ msglevel=i;\ndata vw_transpose/view=vw_transpose;\ndrop i;\narray x[10000];\n\
    do i = 1 to 10;\n  do j = 1 to dim(x);\n    x[j] = ranuni(4);\n  end;\n  output;\n\
    end;\nrun;\nproc transpose data=vw_transpose out=transposed;\nrun;\nproc transpose\
    \ data=vw_transpose(spill=yes) out=transposed;\nrun;\nproc transpose data=vw_transpose(spill=no)\
    \ out=transposed;\nrun;\n```"
