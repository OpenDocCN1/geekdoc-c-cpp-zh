    # BUFNO= Data Set Option


    Specifies the number of buffers to be allocated for processing a SAS data set.


    | Valid in: | DATA step and PROC steps |

    | Category: | Data Set Control |

    | See: | BUFNO= Data Set Option in the documentation for your operating environment.
    |


    # Syntax


    ```

    BUFNO= n | nK | hexX | MIN | MAX

    ```


    # Syntax Description


    n nK

    sifies the number of buffers in multiples of 1 (bytes); 1,024 (kilobytes). For
    example, a value of 8 specifies 8 buffers, and a value of 1k specifies 1024 buffers.


    hexX

    sifies the number of buffers as a hexadecimal value. You must specify the value
    beginning with a number (0-9), followed by an X. For example, the value 2dx sets
    the number of buffers to 45 buffers.'
