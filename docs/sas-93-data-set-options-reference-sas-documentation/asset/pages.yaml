    # GENMAX= Data Set Options


    Requests generation for a new data set, modifies the number of generations for
    an existing data set, and specifies the maximum number of versions.


    **Valid in:** DATA step and PROC steps


    **Category:** Data Set Control


    **Restriction:** Use with output data sets only.


    # Syntax


    ```

    GENMAX=number-of-appended-generations

    ```


    # Syntax Description


    **number-of-generations**

    requests for a data set and specifies the maximum number of versions to maintain.
    The value can be from 0 to 1000. The default is GENMAX=0, which means that no
    generation data sets are requested.


    # Details


    You use GENMAX= to request generations for a new data set and for existing data.
    The first time the data set is replaced, SAS keeps the replaced version and appends
    a four-character version number to its member name, which includes # and a three-digit
    number. For example, for a data set named A, a historical version would be A#001.


    After generations of a data set are requested, the member name is limited to 28
    characters (rather than 32). The last four characters are reserved for the appended
    version number. When the GENMAX= data set option is set to 0, the member name
    can be up to 32 characters.


    If you reduce the number of generations for an existing data set, SAS deletes
    the oldest versions above the new limit.'
  merge: -1
  pgno: 35
- img_proc: true
  md: '# Examples


    Example 1: Requesting Generations When You Create a Data Set


    This example shows how to request generations for a new data set. The DATA step
    creates a data set named WORK.A can have as many as 10 generations (one current
    version and nine historical versions):


    ```

    data a(genmax=10);

    x=1;

    output;

    run;

    ```


    Example 2: Modifying the Number of Generations on an Existing Data Set


    This example shows how to change the number of generations on the data set MYLIB.A
    to 4:


    ```

    proc datasets lib=mylib;

    modify a(genmax=4);

    run;

    ```


    # See Also


    Data Set Option:


    +   - “GENNUM= Data Set Option” on page 23


    Other:


    +   - “Understanding Generation Data Sets” in Chapter 26 of SAS Language Reference:
    Concepts


    # GENNUM= Data Set Option


    Specifies a particular generation of a SAS data set.


    Valid in: DATA step and PROC steps


    Category: Data Set Control


    Restriction: Use with input data sets only.


    # Syntax


    GENNUM=integer


    # Syntax Description


    integer


    is a number that refers to a specific version from a generation group. Specifying
    a positive number is an absolute reference to a specific generation number that
    is appended to a data set''s name. Specifying a negative number is a relative
    reference to a historical version in relation to the base version, from the youngest
    to the oldest. Typically, a value of 0 refers to the current (base) version.'
  merge: -1
  pgno: 36
- img_proc: true
  md: 'DATASETS procedure provides a variety of statements for which specifying GENNUM=
    has additional functionality:


    +   * For the DATASETS and DELETE statements, GENNUM= supports the additional
    values ALL, HIST, and REVERT.

    * For the CHANGE statement, GENNUM= supports the additional value ALL.

    * For the CHANGE statement, specifying GENNUM=0 refers to all versions other than
    the base version.


    # Details


    For generations for a data set have been requested using the GENMAX= data set
    option, use GENNUM= to request a specific version. For example, specifying GENNUM=3
    refers to the historical version #003, while specifying GENNUM=-1 refers to the
    youngest historical version.


    Note after 999 replacements, the youngest version would be #999. After 1,000 replacements,
    SAS rolls over the youngest version number to #000. Therefore, if you want the
    historical version #000, specify GENNUM=1000.


    Both an absolute reference and a relative reference refer to a specific version.
    A relative reference does not skip deleted versions. Therefore, when working with
    a generation group that includes one or more deleted versions, using a relative
    reference results in an error if the version being referenced has been deleted.
    For example, if you have the base version AIR and three historical versions (AIR#001,
    AIR#002, and AIR#003) and you delete AIR#002, the following statements return
    an error, because AIR#002 does not exist. SAS does not assume you mean AIR#003:


    ```

    proc print data=air (gennum=-2);

    run;

    ```


    # Examples


    Example 1: Requesting a Version Using an Absolute Reference

    This example prints the historical version #003 for data set A, using an absolute
    reference:


    ```

    proc print data=a (gennum=3);

    run;

    ```


    Example 2: Requesting A Version Using a Relative Reference

    The following PRINT procedure prints the data set three versions back from the
    base version:


    ```

    proc print data=a (gennum=-3);

    run;

    ```


    # See Also


    Data Set Option:


    +   * “GENMAX= Data Set Option” on page 22


    Other:'
  merge: -1
