  md: '# 8 Chapter.2 Data Set Options Dictionary


    | Category | Language elements | Description |


    | | POINTOBS= Data Set Option (p. 46) | Specifies whether SAS creates compressed
    data sets whose observations can be randomly accessed or sequentially accessed.
    |


    | | WHERE= Data Set Option (p. 65) | Specifies specific conditions to use to select
    observations from a SAS data set. |


    | | WHEREUP= Data Set Option (p. 67) | Specifies whether to evaluate new observations
    and modified observations against a WHERE expression. |


