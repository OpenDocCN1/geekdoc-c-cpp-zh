  md: '# # Data Set Options by Category


    The categories for SAS data set options correspond to the SAS data set options:


    +   - Data Set Control | options that are associated with data sets

    - Observation Control | options that are associated with observations

    - User Control of SAS Index Usage | options that are associated with indexes

    - Variable Control | options that are associated with variables

    - Miscellaneous


    | Category | Language elements | Description |

    |---|---|||

    | Data Set Control | ALTER= Data Set Option (p. 8) | Assigns an ALTER password
    to a SAS file that prevents users from replacing or deleting the file, and enables
    access to a read-protected file. |

    | | BUFNO= Data Set Option (p. 9) | Specifies the number of buffers to be allocated
    for processing a SAS data set. |

    | | BUSIZE= Data Set Option (p. 11) | Specifies the size of a permanent buffer
    page for an output SAS data set. |

    | | CNTLLEV= Data Set Option (p. 12) | Specifies the level of shared access to
    a SAS data set. |

    | | COMPRESS= Data Set Option (p. 13) | Specifies how observations are compressed
    in a new output SAS data set. |

    | | DLDGACTION= Data Set Option (p. 15) | Specifies the action to take when a
    SAS data set in a SAS library is detected as damaged. |

    | | ENCRYPT= Data Set Option (p. 17) | Specifies whether to encrypt an output
    SAS data set. |

    | | EXTENOBSCOUNTER= Data Set Option (p. 19) | Specifies whether to extend the
    maximum observation count in a new output SAS data file. |

    | | GENMAX= Data Set Option (p. 22) | Requests generations for a new data set,
    modifies the number of generations for an existing data set, and specifies the
    maximum number of versions. |

    | | GENNUM= Data Set Option (p. 23) | Specifies a particular generation of a SAS
    data set. |

    | | INDEX= Data Set Option (p. 27) | Defines an index for a new output SAS data
    set. |

    | | LABEL= Data Set Option (p. 31) | Specifies a label for a SAS data set. |'
  merge: -1
  pgno: 19
- img_proc: true
  md: '# Data Set Options by Category 7


    | Category | Language elements | Description |

    | --- | --- | --- |

    | | OBSBUF= Data Set Option (p. 32) | Determines the size of the view buffer for
    processing a DATA step view. |

    | | OUTREP= Data Set Option (p. 44) | Specifies the data representation for the
    output SAS data set. |

    | | PW= Data Set Option (p. 47) | Assigns a READ, WRITE, ALTER password to a SAS
    file, and enables access to a password-protected SAS file. |

    | | PWREQ= Data Set Option (p. 48) | Specifies whether to display a dialog box
    to enter a SAS data set password. |

    | | READ= Data Set Option (p. 48) | Assigns a READ password to a SAS file that
    prevents users from reading the file, unless they enter the password. |

    | | REMEMPTY= Data Set Option (p. 51) | Specifies whether an empty data set can
    overwrite an existing SAS data set that has the same name. |

    | | REPLACE= Data Set Option (p. 52) | Specifies whether a new SAS data set contains
    data can overwrite an existing data set that has the same name. |

    | | REUSE= Data Set Option (p. 53) | Specifies whether new observations can be
    written to free space in compressed SAS data sets. |

    | | ROLE= Data Set Option (p. 54) | Identifies the fact table for a star schema
    join. |

    | | SORTEDBY= Data Set Option (p. 55) | Specifies how a data set is currently
    sorted. |

    | | SPILL= Data Set Option (p. 57) | Specifies whether to create a spill file
    for non-sequential processing of a DATA step view. |

    | | TOBSNO= Data Set Option (p. 64) | Specifies the number of observations to
    send in a client/server transfer. |

    | | TYPE= Data Set Option (p. 64) | Specifies the data type for a specially structured
    SAS data set. |

    | | WRITE= Data Set Option (p. 68) | Assigns a WRITE password to a SAS file that
    prevents users from writing to a file, unless they enter the password. |

    | Miscellaneous | CLOSE= Data Set Option (p. 19) | Specifies how a tape is positioned
    when a SAS data set is closed. |

    | Observation Control | FIRSTOBs= Data Set Option (p. 20) | Specifies the first
    observation that SAS processes in a SAS data set. |

    | | IN= Data Set Option (p. 29) | Creates a Boolean variable that indicates whether
    the data set contributed data to the current observation. |

    | | OBS= Data Set Option (p. 34) | Specifies the last observation that SAS processes
    in a data set. |'
