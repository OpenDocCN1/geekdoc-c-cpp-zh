- img_proc: true
  md: '# Syntax Description


    NO


    specifies that a new data set with a given name does not replace an existing data
    set with the same name.


    YES


    specifies that a new data set with a given name replaces an existing data set
    with the same name.


    # Details


    +   - The REPLACE= data set option overrides the REPLACE system option for the
    individual data set.


    +   - The REUSE system option only applies to permanent SAS data sets.


    # Example


    Using the REPLACE= data set option in the DATA statement prevents SAS from replacing
    a permanent SAS data set named ONE in a library referenced by MYLIB:


    ```

    data mylib.one(replace=no);

    ```


    SAS writes in the log that tells you that the file has not been replaced.


    # See Also


    System Options:


    +   - “REPLACE System Option” in SAS System Options: Reference


    # REUSE= Data Set Option


    Specifies whether new observations can be written to free space in compressed
    SAS data sets.


    | Valid in: DATA step and PROC steps


    | Category: Data Set Control


    | Restriction: Use with output data sets only.


    # Syntax


    REUSE=NO | YES


    # Syntax Description


    NO


    does not track and reuse space in compressed data sets. New observations are appended
    to the existing data set. Specifying the NO argument results in less efficient
    data storage if you delete or update many observations in the SAS data set.


    YES


    tracks and reuses space in compressed data sets. New observations are inserted
    in the space that is freed when other observations are updated or deleted.'
  merge: -1
  pgno: 66
- img_proc: true
  md: 'If you plan to use procedures that add observations to the end of SAS data
    sets (for example, the APPEND and FSEDIT procedures) with compressed data sets,
    use the REUSE=NO argument. REUSE=YES causes new observations to be added wherever
    there is space in the file, not necessarily at the end of the file.


    # Details


    By default, new observations are appended to existing compressed data sets. If
    you want to track and reuse free space by deleting or updating other observations,
    use the REUSE= data set option when you create a compressed SAS data set.


    REUSE= has meaning only when you are creating new data sets with the COMPRESS=YES
    data set option or system option. Using the REUSE= data set option when you are
    accessing an existing SAS data set has no effect.


    # Comparisons


    REUSE= data set option overrides the REUSE= system option.


    REUSE=YES takes precedence over POINTOBS=YES. For example, the following statement
    results in a data set that has POINTOBS=NO:


    ```

    data test (compress=yes pointobs=yes reuse=yes);

    ```


    Because POINTOBS=YES is the default when you use compression, REUSE=YES causes
    POINTOBS= to change to NO.


    # See Also


    Data Set Options:


    +   * “COMPRESS= Data Set Option” on page 13


    System Options:


    +   * “REUSE= System Option” in SAS System Options: Reference


    # ROLE= Data Set Option


    Identifies the fact table for a star schema join.


    | Valid in: | PROC SQL |

    | Category: | Data Set Control |

    | Restriction: | Use with input data sets only. |


    # Syntax


    ```

    ROLE= FACT | DIMENSION | DIM

    ```


    # Syntax Description


    FACT

    ifies the SAS data set as the fact table for a star schema.'
  merge: -1
  pgno: 67
- img_proc: true
  md: '# SORTEDBY= Data Set Option 55


    DIMENSION | DIM

    identifies the SAS data set as a dimension table for a star schema.


    # Details


    A star schema is an arrangement of several tables in which a large fact table
    is joined to several dimension tables. For example, you can join SAS data sets
    by using SQL syntax in order to create a star schema.


    To improve the performance of the application that processes the joined tables,
    you can specify the ROLE=data set option. For example, you can specify ROLE=FACT
    to designate the specific fact table, or you can specify ROLE=DIMENSION to designate
    each dimension table, meaning that the table not designated is the fact table.


    Because the role table can change between queries, the ROLE= specification is
    in effect for the current step only and is not stored with the data set.


    # Example: Designating the Fact Table


    In the following example, the ROLE= data set option improves the performance for

    PROC SQL ORDERS is the fact table, and PRODUCT, PERIOD, and CUSTOMER dimension
    tables.


    ```

    proc sql;

    select orders.Order_Total

    from orders (role-fact), product, period, customer

    where orders.Product_ID = product.Product_ID

    and orders.Period_ID = period.Period_ID

    and orders.Customer_ID = customer.Customer_ID

    and product.Product_Name = "camera"

