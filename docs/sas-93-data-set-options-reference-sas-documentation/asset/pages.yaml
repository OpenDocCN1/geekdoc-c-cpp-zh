  md: '# TOBSNO= Data Set Option


    Specifies the number of observations to send in a client/server transfer.


    +   **Valid in:** DATA step and PROC steps


    +   **Category:** Data Set Control


    +   **Restriction:** The TOBSNO= option is valid only for data sets that are accessed
    through a SAS server via the REMOTE engine.


    # Syntax


    TOBSNO=n


    # Syntax Description


    specifies the number of observations to be transmitted.


    # Details


    If the TOBSNO= option is not specified, its value is calculated based on the observation
    length and the size of the server''s transmission buffers, as specified by the
    PROC SERVER statement TBUFSIZE= option.


    The TOBSNO= option is valid only for data sets that are accessed through a SAS
    server via the REMOTE engine. If this option is specified for a data set opened
    for update or accessed via another engine, it is ignored.


    # See Also


    “FOPEN Function” in SAS Functions and CALL Routines: Reference


    # TYPE= Data Set Option


    Specifies the data type for a specially structured SAS data set.


    +   **Valid in:** DATA step and PROC steps


    +   **Category:** Data Set Control


    # Syntax


    TYPE=data-set-type


    # Syntax Description


    data-set-type


    specifies the special type of the data set.'
  merge: -1
  pgno: 77
- img_proc: true
  md: '# Details


    Use the TYPE= data set option in a DATA set to create a special SAS data set in
    the proper format, or to identify the specific type of the SAS data set in a procedure
    statement.


    You can use the CONTENTS procedure to determine the type of a data set.


    Most SAS data sets do not have a specified type. However, there are several structured
    SAS data sets that are used by some SAS/STAT procedures. These SAS data sets contain
    special variables and observations, and they are usually created by SAS/STAT software.
    Because most of the special SAS data sets are used with SAS/STAT software, they
    are described in the SAS/STAT User''s Guide. Some of the special data sets are
    CORR, COV, SESC, EST, or FACTOR.


    Other values are available in other SAS products and are described in the appropriate
    documentation.


    *: If you use a DATA step with a SET statement to modify a special SAS data set,
    you must specify the TYPE= option in the DATA statement. The data-set-type is
    not automatically copied to the data set that is created.


    # See Also


    +   * Chapter 12, "CONTENTS Procedure" in Base SAS Procedures Guide


    # WHERE= Data Set Option


    Specifies specific conditions to use to select observations from a SAS data set.


    Valid in: DATA step and PROC steps


    Category: Observation Control


    Restriction: Cannot be used with the POINT= option in the SET and MODIFY statements.


    # Syntax


    ```

    WHERE=(expression-1<logical-operator where-expression-n>)

    ```


    # Syntax Description


    +   * where-expression

    is an arithmetic or logical expression that consists of a sequence of operators,
    operands, and SAS functions. An operand is a variable, a SAS function, or a constant.
    An operand is a symbol that requests a comparison, logical operation, or arithmetic
    calculation. The expression must be enclosed in parentheses.


    +   * logical-operator

    can be AND, AND NOT, OR, or OR NOT.


    # Details


    +   * Use the WHERE= data option with an input data set to select observations
    that meet the condition in the WHERE expression before SAS brings them into the
    DATA or PROC step for processing. Selecting observations that meet the conditions
    of the WHERE expression is the first operation SAS performs in each iteration
    of the DATA step.'
  merge: -1
  pgno: 78
- img_proc: true
  md: 'You can also select observations that are written to an output data set. In
    general, selecting observations at the point of input is more efficient than selecting
    them at the point of input. However, there are some cases when selecting observations
    at the point of input is not practical or not possible.


    +   - You can apply OBS= and FIRSTOBS= to WHERE processing. For more information
    see "Processing a Segment of Data That Is Conditionally Selected" in Chapter 11
    of SAS Language Reference: Concepts."


    +   - You cannot use the WHERE data set option with the POINT= option in the SET
    and MODIFY statements.


    +   - If you use both the WHERE data set option and the WHERE statement in the
    same DATA step, SAS ignores the WHERE statement for data sets with the WHERE=
    However, you can use the WHERE data set option with the WHERE command in SAS/FSP
    software.


    Note: Using indexed data sets can improve performance significantly when you are
    using WHERE expressions to access a subset of the observations in a SAS data set.
    See "Understanding SAS Indexes" in Chapter 26 of SAS Language Reference: Concepts
    for a complete discussion of WHERE expression processing with indexed data sets
    and a list of guidelines to consider indexing your SAS data sets.


    # Comparisons


    +   - The WHERE statement applies to all input data sets, whereas the WHERE= data
    set option selects observations only from the data set for which it is specified.


    +   - Do not confuse the purpose of the WHERE= data set option. The DROP= and
    KEEP= data set option selects variables for processing, while the WHERE= data
    set option selects observations.


    # Examples


    # ### Example 1: Selecting Observations from an Input Data Set


    This example uses the WHERE= data set option to subset the SALES data set as it
    is read into another data set:


    ```

    data whizmo;

    set sales(where=(product=''whizmo''));

    ```


    ```

    run;

    ```


    # ### Example 2: Selecting Observations from an Output Data Set


    This example uses the WHERE= data set option to subset the SALES output data set:


    ```

    data whizmo(where=(product=''whizmo''));

    set sales;

    ```


    ```

    run;

    ```


    # See Also


    +   - "WHERE Statement" in SAS Statements: Reference


    +   - WHERE-Expression Processing'
