    # PW= Data Set Option


    Assigns a READ, WRITE, ALTER password to a SAS file, and enables access to a password-protected
    SAS file.


    Valid in: DATA step and PROC step


    Category: Data Set Control


    # Syntax


    ```

    PW=password

    ```


    # Syntax Description


    password

    must be a valid SAS name, which limits the password to eight characters and is
    case insensitive. “Words in the SAS Language” in Chapter 3 of SAS Language Reference:
    Concepts .


    # Details


    The PW= applies to all types of SAS files except catalogs. You can use this to
    assign a password to a SAS file or access a password-protected SAS file.

    When replacing a SAS data set that is protected by an ALTER password, the new
    data inherits the ALTER password. To change the ALTER password for the new data
    set, use the MODIFY statement in the DATASETS procedure.


    Operating Environment Information

    See the appropriate sections of the SAS documentation for your operating environment
    for more information about using passwords.


    Note: A SAS password does not control access to a SAS file beyond the SAS system.
    You should use the operating system-supplied utilities and file-system security
    controls in control access to SAS files outside of SAS.


    # See Also


    +   Data Set Options:

    * “ALTER= Data Set Option” on page 8

    * “ENCRYPT= Data Set Option” on page 17

    * “READ= Data Set Option” on page 48

    * “WRITE= Data Set Option” on page 56'
