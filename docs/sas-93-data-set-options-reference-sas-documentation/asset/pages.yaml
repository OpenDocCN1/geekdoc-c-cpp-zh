    # LABEL= Data Set Option


    Specifies a label for a SAS data set.


    **Valid in:** DATA step and PROC steps


    **Category:** Data Set Control


    # Syntax


    ```

    LABEL=''label’;

    ```


    # Syntax Description


    ''label’


    specifies a text string of up to 256 characters. If the label contains single
    quotation marks, use double quotation marks around the label. You can also use
    two single quotation marks in the label text and surround the string with single
    quotation marks. To remove a label from a data set, assign a label that is equal
    to a blank that is enclosed in quotation marks.'
