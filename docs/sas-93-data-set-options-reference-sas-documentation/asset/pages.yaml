  md: '# About This Book


    # Syntax Conventions for the SAS Language


    # Overview of Syntax Conventions for the SAS Language


    SAS uses standard conventions in the documentation of syntax for SAS language
    elements. These conventions enable you to easily identify the components of SAS
    syntax. The conventions can be divided into these parts:


    +   - syntax components

    - style conventions

    - special characters

    - references to SAS libraries and external files


    # Syntax Components


    The components of the syntax for most language elements include a keyword and
    arguments. For some language elements only a keyword is necessary. For other language
    elements the keyword is followed by an equal sign (=).


    keyword


    specifies the name of the SAS language element that you use when you write your
    program. Keyword is a literal that is usually the first word in the syntax. In
    a CALL routine, the first two words are keywords.


    In the following examples of SAS syntax, the keywords are the first words in the
    syntax:


    ```

    CHAR (string, position)

    CALL RANBIN (seed, n, p, x)

    ALTER (alter-password)

    BEST w.

    REMOVE <data-set-name>

    ```


    In the following example, the first two words of the CALL routine are the keywords:


    ```

    CALL RANBIN(seed, n, p, x)

    ```


    The syntax of some SAS statements consists of a single keyword without arguments:


    ```

    DO:

    ... SAS code ...

    ```'
  merge: -1
  pgno: 6
- img_proc: true
  md: 'END;


    Some system options require that one of two keyword values be specified:


    DUPLEX | NODUPLEX


    argument specifes a numeric or character constant, variable, or expression. Arguments
    follow the keyword or an equal sign after the keyword. The arguments follow SAS
    to process the language element. Arguments can be required or optional. In the
    syntax, optional arguments are enclosed between angle brackets.


    In the following example, string and position follow the keyword CHAR. These arguments
    are required for the CHAR function:


    ```

    CHAR (string, position)

    ```


    Each argument has a value. In the following example of SAS code, the argument
    string has value of ''summer'', and the argument position has a value of 4:char(''summer'',
    4);


    In the following example, string and substring are required arguments, while modifiers
    and startpos are optional.


    ```

    FIND(string, substring <modifiers>) <startpos>

    ```


    > Note: In many cases, example code in SAS documentation is written with a monospaced
    font. You can use uppercase, lowercase, or mixed case in the code that you write.


    # Style Conventions


    The style conventions that are used in documenting SAS syntax include uppercase
    bold, uppercase, and italic:


    UPPERCASE BOLD


    identifies SAS keywords such as the names of functions or statements. In the following
    example, the keyword ERROR is written in uppercase:


    ```

    ERROR<message>

    ```


    UPPERCASE


    identifies arguments that are literals.


    In the following example of the CMPMODEL= system option, the literals include
    BOTH, CATALOG, and XML:


    ```

    CMPMODEL = BOTH | CATALOG | XML

    ```


    italics


    identifies arguments or values that you supply. Items in italics represent user-supplied
    values that are either one of the following:


    +   - nonliteral arguments


    In the following example of the LINK statement, the argument label is a user-supplied
    value and is therefore written in italics:


    LINK label:


    +   - nonliteral values that are assigned to an argument


    In the following example of the FORMAT statement, the argument DEFAULT is assigned
    the variable default-format.'
  merge: -1
