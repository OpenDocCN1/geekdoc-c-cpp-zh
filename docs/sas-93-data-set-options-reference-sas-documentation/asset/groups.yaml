    # Dictionary


    # ALTER= Data Set Option


    Assigns an ALTER password to a SAS file that prevents users from replacing or
    deleting the file, and enables access to a read- and write-protected file.


    +   - **Valid in:** DATA step and PROC steps


    +   **Category:** Data Set Control


    +   **See:** ALTER= Data Set Option under OpenVMS, UNIX, or z/OS in the documentation
    for your operating environment.


    # Syntax


    ```

    ALTER=alter-password

    ```


    # Syntax Description


    alter-password

    must be a valid SAS name. See Rules for Words and Names in the SAS Language.'
- md: '

    ## Details


    The ALTER= option applies to all types of SAS files except catalogs. You can use
    this option to assign a password to a SAS file or to access a read-protected,
    write-protected, or alter-protected SAS file.


    When replacing a SAS data set that is de-protected with an ALTER password, the
    new data set inherits the ALTER password. To change the ALTER password for the
    new data set, use the MODIFY statement in the DATASETS procedure.


    Note: A SAS password does not control access to a SAS file beyond the SAS system.

    You should use the operating system-supplied utilities and file-system security
    controls in order to control access to SAS files outside of SAS.


    ## See Also


    Data Set Options:


    - “ENCRYPT= Data Set Option” on page 17

    - “PW= Data Set Option” on page 47

    - “READ= Data Set Option” on page 48

    - “WRITE= Data Set Option” on page 68


    Other:


    - “File Protection” in Chapter 34 of SAS Language Reference: Concepts

    - “Manipulating Passwords” in Chapter 15 of Base SAS Procedures Guide


    ## BUFNO= Data Set Option


    Specifies the number of buffers to be allocated for processing a SAS data set.


    | Valid in: | DATA step and PROC steps |

    | Category: | Data Set Control |

    | See: | BUFNO= Data Set Option in the documentation for your operating environment.
    |


    ## Syntax


    ```

    BUFNO= n | nK | hexX | MIN | MAX

    ```


    ## Syntax Description


    n nK

    specifies the number of buffers in multiples of 1 (bytes); 1,024 (kilobytes).
    For example, a value of 8 specifies 8 buffers, and a value of 1k specifies 1024
    buffers.


    hexX

    specifies the number of buffers as a hexadecimal value. You must specify the value
    beginning with a number (0-9), followed by an X. For example, the value 2dx sets
    the number of buffers to 45 buffers.


    ## MIN


    sets the minimum number of buffers to 0, which causes SAS to use the minimum optimal
    value for the operating environment. This is the default.


    ## MAX


    sets the number of buffers to the maximum possible number in your operating environment,
    up to the largest four-byte, signed integer, which is 2³¹-1, or approximately
    2 billion.


    ## Details


    The buffer number is not a permanent attribute of the data set; it is valid only
    for the current SAS session or job.


    BUFNO= applies to SAS data sets that are opened for input, output, or update.


    A larger number of buffers can speed up execution time by limiting the number
    of input and output (I/O) operations that are required for a particular SAS data
    set. However, the improvement in execution time comes at the expense of increased
    memory consumption.


    To reduce I/O operations on a small data set as well as speed execution time,
    allocate one buffer for each page of data to be processed. This technique is effective
    if you read the same observations several times during processing.


    Operating Environment Information


    The default value for BUFNO= is determined by your operating environment and is
    set to optimize sequential access. To improve performance for direct (random)
    access, you should change the value for BUFNO=. For the default setting and possible
    settings for direct access, see the BUFNO= data set option in the SAS documentation
    for your operating environment.


    ## Comparisons


    - If the BUFNO= data set option is not specified, then the value of the BUFNO=
    option is used. If both are specified in the same SAS session, the value specified
    for the BUFNO= data set option overrides the value specified for the BUFNO= system
    option.


    - To request SAS allocate the number of buffers based on the number of data set
    pages and index file pages, use the SASFILE global statement.


    ## See Also


    - "BUFSIZE= Data Set Option" on page 11


    ## System Options:


    - "BUFNO= System Option" in SAS System Options: Reference


    ## Statements:


    - "SASFILE Statement" in SAS Statements: Reference


    ## BUFSIZE= Data Set Option


    Specifies the size of a permanent buffer page for an output SAS data set.


    - **Valid in:** DATA step and PROC steps

    - **Category:** Data Set Control

    - **Restriction:** Use with output data sets only.

    - **See:** BUFSIZE= Data Set Option under UNIX, z/OS, or OpenVM in the documentation
    for your operating environment.


    ## Syntax


    ```

    BUFSIZE= n | nK | nM | nG | hexX | MAX

    ```


    ## Syntax Description


    **n | nK | nM** specifies the page size in multiples of 1 (bytes); 1,024 (kilobytes);
    1,048,576 (megabytes); or 1,073,741,824 (gigabytes). For example, a value of 8
    specifies a page size of 8 bytes, and a 4k specifies a page size of 4096 bytes.


    > Note: If the system option and the data set option are not set, the default
    is 0. As a result, SAS uses the minimum optimal page size for the operating environment.
    The BUFSIZE= system option is used in either of the following scenarios:


    - if the BUFSIZE= data set option is not set

    - if the BUFSIZE= data set option is set to zero


    Use BUFSIZE=0 in order to reset the buffer page size to the default value in your
    operating environment.


    ## hexX


    specifies the page size as a hexadecimal value. You must specify the value beginning
    with a number (0-9), followed by an X. For example, the value 2dx sets the page
    size to 45 bytes.


    ## MAX


    sets the page size to the maximum possible number in your operating environment,
    up to the largest four-byte, signed integer, which is 2³-1, or approximately 2
    billion bytes.


    ## Details


    The page size is the amount of data that can be transferred for a single I/O operation
    to one buffer. The page size is a permanent attribute of the data set and is used
    when the data set is processed.


    A larger page size can speed up execution time by reducing the number of times
    SAS has to read from or to the storage memory. However, the improvement in execution
    time comes at the cost of increased memory consumption.


    To change the page size, use a DATA step to copy the data set and either specify
    a new page size or use the SAS default. To reset the page size to the default
    value in your operating environment, use BUFSIZE=0.


    Note: If you use the COPY procedure to copy the data set to another library, the
    page size is not retained.


    Operating Environment Information


    The default value for BUFNO= is determined by your operating environment and is
    set to optimize sequential access. To improve performance for direct (random)
    access, you should change the value for BUFNO=. For the default setting and possible
    settings for direct access, see the BUFNO= data set option in the SAS documentation
    for your operating environment.


    ## See Also


    Data Set Options:


    - “BUFNO= Data Set Option” on page 9


    ## System Options:


    - “BUFSIZE= System Option” in SAS System Options: Reference


    ## CNTLLEV= Data Set Option


    Specifies the level of shared access to a data set.


    | Valid in: | DATA step and PROC steps |

    | Category: | Data Set Control |

    | Restriction: | Use with input data sets |


    ## Syntax


    ```

    CNTLLEV=LIB | MEM | REC

    ```


    ## Syntax Description


    LIB

    specifies that concurrent access is controlled at the library level. Library-level
    control restricts concurrent access to only one update process.


    MEM

    specifies that concurrent access is controlled at the data set (member) level.
    Member-level control restricts concurrent access to only one update or output
    process. If the data set is open for an update or output process, then no other
    operation can access the data set. If the data set is open for an input process,
    then other input processes are allowed.


    REC

    specifies that concurrent access is controlled at the observation (record) level.
    Record-level control allows more than one update access to the same data set,
    but it denies concurrent update of the same observation.


    ## Details


    CNTLLEV= specifies the level at which shared access to a data set is denied. A
    SAS data set can be opened concurrently by more than one SAS session or by more
    than one statement or procedure within a single session. By default, SAS procedures
    permit the greatest degree of concurrent access possible while they guarantee
    the integrity of the data and the data analysis. Therefore, you do not typically
    use the CNTLEV= data option.


    Use this option when


    - your application controls the access to the data, such as in SAS Component Language
    (SCL), SAS/IML software, or DATA step programming

    - you access data through an interface engine that does not provide member-level
    control


    If you use COMPRESS=REC and the SAS procedure needs member-level control for integrity
    of the data analysis, SAS prints a warning to the SAS log. The warning states
    that inaccurate or unpredictable results can occur if the data are updated by
    another process during the analysis.


    ## Example: Changing the Shared Access Level


    In the following example, the first SET statement includes the CNTLEV data set
    option in order to override the default level of shared access from member-level
    control to record-level control. The second SET statement opens the SAS data set
    with the default member-level control.


    ```

    set datilib.fuel (cntlllev=rec) point=obsnum;

    ```


    ```

    set datilib.fuel;

    by area;

    ```


    ## COMPRESS= Data Set Option


    Specifies how observations are compressed in a new output SAS data set.


    | Valid in: | DATA step and PROC steps |

    | Category: | Data Set Control |

    | Restriction: | Use with output data sets only |


    ## Syntax


    COMPRESS=NO | YES | CHAR | BINARY


    ## Syntax Description


    NO


    specifies that the observations in a newly created SAS data set are uncompressed
    (fixed-length records).

