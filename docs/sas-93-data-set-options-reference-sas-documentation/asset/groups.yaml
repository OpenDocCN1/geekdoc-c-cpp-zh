  - '[PAGE 59]


    # POINTBS= Data Set Option


    Specifies whether SAS creates compressed data sets whose observations can be randomly
    accessed sequentially.


    **Valid in:** DATA step and PROC steps


    **Category:** Observation Control


    **Restriction:** POINTBS= is effective only when creating a compressed data set.
    Otherwise it is ignored.


    # Syntax


    ```

    POINTBS=YES | NO

    ```


    # Syntax Description


    YES


    causes SAS software to produce a compressed data set that might be randomly accessed
    by observation number. This is the default.

    Examples of accessing data directly by observation number are:


    +   - the POINT= option of the MODIFY and SET statements in the DATA step

    - going directly to a specific observation number with PROC FSEDIT.


    > TIP Specifying POINTBS=YES does not affect the efficiency of retrieving information
    from a data set. It increases CPU usage by approximately 10% when creating a compressed
    data set and when updating or adding information to it.


    NO


    suppresses the ability to randomly access observations in a compressed data set
    by observation number.


    > TIP Specifying POINTBS=NO is desirable for applications where the ability to
    point directly to an observation number within a compressed data set is not important.
    If you do not need to access data by observation number, then you can improve
    performance by approximately 10% by specifying POINTBS=NO:


    +   - when creating a compressed data set

    - when updating or adding observations to it


    # Details


    Note that REUSE=YES takes precedence over POINTBS=YES. For example:

    data test(compress=yes pointsbs=yes reuse=yes);

    results in a data set that has POINTBS=NO. Because POINTBS=YES is the default
    when you use compression, REUSE=YES causes POINTBS= to change to NO.


    # See Also


    Data Set Options:'
