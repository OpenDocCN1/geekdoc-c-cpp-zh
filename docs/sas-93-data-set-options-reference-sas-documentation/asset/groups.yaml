    决定提供最佳性能的一个，或者如果预计顺序搜索更高效，则拒绝所有索引。


    由于 SAS 的选择并不总是能提供最佳优化，你可以通过指定 IDXNAME= 数据集选项来指示 SAS 使用候选索引之一。如果你指定的索引未被识别为候选索引，IDXNAME=
    将不会处理该请求。也就是说，IDXNAME= 不允许你指定可能会产生错误结果的索引。


