    # Details


    If you use the RENAME= data set option when you create a data set, the new variable
    is named in the output data set. If you use RENAME= on an input data set, the
    new name is used in DATA step programming statements.


    If you use RENAME= on an input data set that is used in a SAS procedure, SAS changes
    the name of the variable in that procedure. If you use RENAME= with WHERE processing
    as a WHERE statement or a WHERE= data set option, the new name is applied before
    the data is processed. You must use the new name in the WHERE expression.


    If you use RENAME= in the same DATA step with the DROP= or the KEEP= data set
    option, the DROP= and the KEEP= data set options are applied before RENAME=. You
    must use the old name in the DROP= and KEEP= data set options. You cannot drop
    and rename the variable in the same statement.


    Note: The RENAME= data set option has an effect only on data sets that are opened
    in output mode.


    # Comparisons


    +   - The RENAME= data set option differs from the RENAME statement in the following
    ways:

    - The RENAME= data set option can be used in PROC steps and the RENAME statement
    cannot.

    - The RENAME statement applies to all output data sets. If you want to rename
    different variables in different data sets, you must use the RENAME= data set
    option.

    - To rename variables before processing begins, you must use a RENAME= set option
    on the input data set or data sets.

    - Use the RENAME statement or the RENAME= data set option when program logic requires
    that you rename variables as two input data sets that have variables with the
    same name. To rename variables as a file management task, use the DATASETS procedure.


    # Examples


    Example 1: Renaming a Variable at Time of Output

    This example uses RENAME= in the DATA statement to show that the variable is renamed
    at the time it is written to the output data set. The variable keeps its original
    name, X, during the DATA step processing:


    ```

    data one;

    input x y z;

    datalines;

    24 595 439

    243 343 034

    ;

    ```


    Example 2: Renaming a Variable at Time of Input

    This example renames variable X to a variable named KEYS in the SET statement,
    which is a rename before DATA step processing. KEYS, not X, is the name to use
    for the variable for DATA step processing.'
