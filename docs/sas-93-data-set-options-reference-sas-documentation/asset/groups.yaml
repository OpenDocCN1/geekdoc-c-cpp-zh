    real time 1.34 seconds\ncpu time 1.32 seconds\n\nNOTE: The View.VW_TRANSPOSE was\
    \ restarted 1 times. The following view statistics\n\n# See Also\n\nData Sets:\n\
    \n# TOBSNO= Data Set Option\n\nSpecifies the number of observations to send in\
    \ a client/server transfer.\n\n- **Valid in:** DATA step and PROC steps\n- **Category:**\
    \ Data Set Control\n- **Restriction:** The TOBSNO= option is valid only for data\
    \ sets that are accessed through a SAS server via the REMOTE engine.\n\n# Syntax\n\
    \nTOBSNO=n\n\n# Syntax Description\n\nspecifies the number of observations to\
    \ be transmitted.\n\n# Details\n\nIf the TOBSNO= option is not specified, its\
    \ value is calculated based on the observation length and the size of the server's\
    \ transmission buffers, as specified by the PROC SERVER statement TBUFSIZE= option.\n\
    \nThe TOBSNO= option is valid only for data sets that are accessed through a SAS\
    \ server via the REMOTE engine. If this option is specified for a data set opened\
    \ for update or accessed via another engine, it is ignored.\n\n# See Also\n\n\
    “FOPEN Function” in SAS Functions and CALL Routines: Reference\n\n# TYPE= Data\
    \ Set Option\n\nSpecifies the data type for a specially structured SAS data set.\n\
    \n- **Valid in:** DATA step and PROC steps\n- **Category:** Data Set Control\n\
    \n# Syntax\n\nTYPE=data-set-type\n\n# Syntax Description\n\ndata-set-typespecifies\
    \ the special type of the data set.\n\n# Details\n\nUse the TYPE= data set option\
    \ in a DATA set to create a special SAS data set in the proper format, or to identify\
    \ the specific type of the SAS data set in a procedure statement.\n\nYou can use\
    \ the CONTENTS procedure to determine the type of a data set.\n\nMost SAS data\
    \ sets do not have a specified type. However, there are several structured SAS\
    \ data sets that are used by some SAS/STAT procedures. These SAS data sets contain\
    \ special variables and observations, and they are usually created by SAS/STAT\
    \ software. Because most of the special SAS data sets are used with SAS/STAT software,\
    \ they are described in the SAS/STAT User's Guide. Some of the special data sets\
    \ are CORR, COV, SESC, EST, or FACTOR.\n\nOther values are available in other\
    \ SAS products and are described in the appropriate documentation.\n\n*: If you\
    \ use a DATA step with a SET statement to modify a special SAS data set, you must\
    \ specify the TYPE= option in the DATA statement. The data-set-type is not automatically\
    \ copied to the data set that is created.\n\n# See Also\n\n- * Chapter 12, \"\
    CONTENTS Procedure\" in Base Procedures Guide\n\n# WHERE= Data Set Option\n\n\
    Specifies specific conditions to use to select observations from a SAS data set.\n\
    \n- **Valid in:** DATA step and PROC steps\n- **Category:** Observation Control\n\
    - **Restriction:** Cannot be used with the POINT= option in the SET and MODIFY\
    \ statements.\n\n# Syntax\n\n```\nWHERE=(expression-1<logical-operator where-expression-n>)\n\
    ```\n\n# Syntax Description\n\n- * where-expression\nis an arithmetic or logical\
    \ expression that consists of a sequence of operators, operands, and SAS functions.\
    \ An operand is a variable, a SAS function, or a constant. An operand is a symbol\
    \ that requests a comparison, logical operation, or arithmetic calculation. The\
    \ expression must be enclosed in parentheses.\n- * logical-operator\ncan be AND,\
    \ AND NOT, OR, or OR NOT.\n\n# Details\n\n- * Use the WHERE= data option with\
    \ an input data set to select observations that meet the condition in the WHERE\
    \ expression before SAS brings them into the DATA or PROC step for processing.\
    \ Selecting observations that meet the conditions of the WHERE expression is the\
    \ first operation SAS performs in each iteration of the DATA step.\n"
  mdcn: "\n\n# 示例 2：针对大量小 BY 组使用溢写文件\n\n此示例创建了一个生成大量随机数据的 DATA 步，并使用了带有 BY 语句的 UNIVARIATE\
