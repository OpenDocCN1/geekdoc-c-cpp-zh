    integer


    is a number that refers to a specific version from a generation group. Specifying
    a positive number is an absolute reference to a specific generation number that
    is appended to a data set''s name. Specifying a negative number is a relative
    reference to a historical version in relation to the base version, from the youngest
    to the oldest. Typically, a value of 0 refers to the current (base) version.

