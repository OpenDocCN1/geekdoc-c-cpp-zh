    # LABEL= Data Set Option


    Specifies a label for a SAS data set.


    **Valid in:** DATA step and PROC steps


    **Category:** Data Set Control


    # Syntax


    ```

    LABEL=''label’;

    ```


    # Syntax Description


    ''label’


    specifies a text string of up to 256 characters. If the label contains single
    quotation marks, use double quotation marks around the label. You can also use
    two single quotation marks in the label text and surround the string with single
    quotation marks. To remove a label from a data set, assign a label that is equal
    to a blank that is enclosed in quotation marks.'
  - "[PAGE 45]\n\n# Details\n\nYou use the LABEL= option on both input and output\
    \ data sets. When you use LABEL= on input data sets, it assigns a label for the\
    \ file for the duration of that DATA step. When it is specified for an output\
    \ data set, the label becomes a permanent part of that file. The file can be printed\
    \ using the CONTENTS or DATASETS procedure, or modified PROC DATASETS.\n\nA label\
    \ assigned to a data set remains associated with that data set when you update\
    \ a data set place, such as using the APPEND procedure or the MODIFY statement.\
    \ However, a label is lost if you use a data set with a previously assigned label\
    \ to create a new data set in the DATA step. For example, a label previously assigned\
    \ to data set ONE is lost when you create the new output data set ONE in this\
    \ DATA step:\n\n```\ndata one;\n  set one;\nrun;\n```\n\n# Comparisons\n\n+  \
    \ - The LABEL= data option enables you to specify labels only for data sets. You\
    \ can specify labels for the variables in a data set using the LABEL statement.\n\
    - The LABEL= option in the ATTRIB statement also enables you to assign labels\
    \ to variables.\n\n# Example\n\nThese examples assign labels to data sets:\ndata\
    \ w2 (label='1976 W2 Info, Hourly');\ndata new(label='Peter's List');\ndata new(label='Hillside's\
    \ Daily Account');\ndata sales(label='Sales For May(NE)');\n\n# See Also\n\n+\
