    # WHEREUP= Data Set Option


    Specifies whether to evaluate new observations and modified observations against
    a WHERE expression.


    **Valid in:** DATA step and PROC steps


    **Category:** Observation Control


    # Syntax


    WHEREUP=NO | YES


    # Syntax Description


    +   NO

    does not evaluate added observations and modified observations against a WHERE
    expression.


    +   YES

    evaluates added observations and modified observations against a WHERE expression.


    # Details


    Specify WHEREUP=YES when you want any added observations or modified observations
    to match a specified WHERE expression.


    # Examples


    # Example 1: Accepting Updates That Do Not Match the WHERE Expression


    This example shows how WHEREUP= permits observations to be updated and even though
    the modified observation does not match the WHERE expression:


    ```

    data a;

    x=1;

    output;

    x=2;

    output;

    run;

    data a;

    modify a(where(x=1) whereup=no);

    x=3;

    replace; /* Update does not match WHERE expression * */

    output; /* Add does not match WHERE expression * /

    run;

    ```


    In this example, SAS updates the observation and adds the new observation to the
    data set.'
  - '[PAGE 81]


    # Example 2: Rejecting Updates That Do Not Match the WHERE Expression


    In this example, WHEREUP does not permit observations to be updated or added when
    the update and the add do not match the WHERE expression:


    ```

    data a;

    x=1;

    output;

    x=2;

    output;

    run;

    data a;

    modify a (where=(x=1) whereup=yes);

    x=3;

    replace; * /* Update does not match WHERE expression */

    output; /* Add does not match WHERE expression */

    run;

    ```


    In this example, SAS does not update the observation nor does it add the new observation
    to the data set.


    # See Also


    Data Set Option:


    +   - WHERE= Data Set Option on page 65


    # WRITE= Data Set Option


    Assigns a WRITE password to a SAS file that prevents users from writing to a file,
    unless they enter the password.


    **Valid in:** DATA step and PROC steps


    **Category:** DATA Set Control


    # Syntax


    ```

    WRITE=write-password

    ```


    # Syntax Description


    *write-password*

    must be a valid SAS name.


    > *See:* Rules for Words and Names in the SAS Language in *SAS Language Reference:*
    Concepts


    # Details


    The WRITE= option applies to all types of SAS files except catalogs. You can use
    this to assign a password to a SAS file or to access a write-protected SAS file.


    *Note:* A SAS password does not control access to a SAS file beyond the SAS system.

    You should use the operating-supplied utilities and file-system security controls
    in order to control access to SAS files outside of SAS.'
