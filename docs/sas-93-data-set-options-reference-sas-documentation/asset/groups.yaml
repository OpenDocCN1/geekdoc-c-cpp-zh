    \ the default is the number of observations that can fit into 32K bytes. If the\
    \ observation length is larger than 32K, then only one observation can be read\
    \ into the buffer at a time.\nTip: To determine the observation length, which\
    \ is its size in bytes, PROC CONTENTS the DATA step view.\nCAUTION: The maximum\
    \ value for OBSBUF= depends on the amount of available memory. If you specify\
    \ a value so large that the memory allocation fails, an out-of-memory error results.\
    \ If you specify a value that is larger than the amount of available memory and\
    \ your operating environment allows SAS to perform the allocation using virtual\
    \ memory, the result can be a decrease in performance due to excessive paging.\n\
    \n# Details\n\nOBSBUF= data set option specifies the number of observations that\
    \ can be read into the buffer at a time. The view buffer is a segment of memory\
    \ that is allocated to hold output observations that are generated from a DATA\
    \ step view. The size of the view buffer determines how much data can be held\
    \ in memory. OBSBUF enables you to tune the performance of reading data from a\
    \ DATA step view.\n\nThe view buffer is shared between the request that opens\
    \ the DATA step view (for example, a SAS procedure) and the DATA step view itself.\
    \ Two computers coordinate between requesting data and returning the data as follows:\n\
    \n- When a request requests data, task switching occurs from the request task\
    \ to the view task in order to execute the DATA step view and generate the observations.\
    \ The DATA step view fills the view buffer with many observations as possible.\n\
    - When the view buffer is full, task switching occurs from the view task back\
