    # 可访问性


    本文档是一个基于命令的产品。对于此版本，没有添加任何解决可访问性的功能，但该产品可能完全符合可访问性标准，因为它没有图形用户界面，并且所有功能对于任何可以输入命令或其他产生命令的人都可用。如果您对
    SAS 产品的可访问性有特定问题，请发送至 accessibility@sas.com 或拨打 SAS 技术支持。


    # 数据集选项的定义


    数据集选项指定仅适用于它们所出现的 SAS 数据集的操作。它们允许您执行以下操作：


    - *重命名变量*

    - 仅选择前或最后 n 个观测值进行处理

    - 从处理过程或从输出数据集中删除变量

    - 为数据集指定密码


    # 语法


    在 SAS 数据集名称后的括号中指定数据集选项。要指定多个数据集选项，请用空格分隔它们。

    这些示例显示了 SAS 语句中的数据集选项：


    ```

    (option-i=value-<option-n=value-n>)

    ```


    这些示例显示了 SAS 语句中的数据集选项：


    - data scores (keep=team game1 game3);

    - data mydata (index=(b k) label=label for data set drop=p read=secret);

    - data new (drop=n index=combo=(xl1 a20 b1 b50)));

    - data ixdup2 (compress= index=(ok2 ssn/unique ok3);

    - proc print data (drop=year);

    - set old (rename=(date=Start_Date));


    # 使用数据集选项


    ## 在输入或输出 SAS 数据集中使用数据集选项


    大多数 SAS 数据选项都可以适用于 DATA 步或过程 (PROC) 步中的输入或输出 SAS 数据集。如果一个数据集与输入数据集关联，则该操作将适用于正在读取的数据集。如果选项出现在
    DATA 语句中或 PROC 步中的输出数据集规范之后，SAS 将该操作作用于输出数据集。在 DATA 步中，输出数据集的数据集选项可能存在于 DATA 语句中，而不是任何输出语句中。


    某些数据选项（如 COMPRESS =)）仅在创建 SAS 数据集时有效，因为它们设置了持续数据集的属性。要更改或取消数据集选项，必须重新创建数据集。其他选项如
    PW= 和 LABEL =)可以通过 PROC DATASETS 修改。更多信息，请参阅 Base SAS 过程中的第15章，“DATASETS过程”。


    当数据集选项出现在同一个步的输入和输出数据集时，SAS 首先应用于输入数据集。然后评估编程语句或将数据集选项应用于输出数据集。同样，指定创建数据集的语句在编程语句之后应用。例如，在使用
    RENAME= 数据集选项时，新名称直到 DATA 步才会关联。


    # 数据集选项与系统选项交互


    许多系统选项和数据集选项具有相同的名称和功能。系统选项在整个 SAS 作业或会话中有效。


    数据集选项会覆盖其所在步骤中的系统选项。在这种情况下，OPTIONS 语句中的 OBS= 系统选项指定仅处理 SAS 作业中任何数据集的前 100 个观测值。然而，SET
    语句中的 OBS= 数据集选项覆盖了数据集 TWO 的系统选项，并指定从数据 TWO 读取前五个观测值。PROC PRINT 步打印数据集 FINAL。该数据集包含数据
    TWO 的前 5 个观测值，随后是数据 THREE 的前 100 个观测值。


    ```

    options obs=100;


    data final;

    set two(obs=5) three;

    run;


    proc print data=final;

    run;

    ```


