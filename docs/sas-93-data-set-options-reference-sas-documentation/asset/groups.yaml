    **类别：** 观测值控制


    **限制：** POINTBS= 仅在创建压缩数据集时有效。否则将被忽略。


    # 语法


    ```

    POINTBS=YES | NO

    ```


    # 语法说明


    YES


    导致 SAS 产生一个可能被随机访问的压缩数据集。在交互式会话中，PWREQ= 选项控制在用户输入错误或缺失密码后是否显示对话框。PWREQ= 适用于读取、写入或更改密码的数据集。PWREQ=
    在 SCL 应用程序中性。


    NO


