- md: '

    # SORTEDBY= Data Set Option 55


    DIMENSION | DIM identifies the SAS data set as a dimension table for a star schema.


    ## Details


    A star schema is an arrangement of several tables in which a large fact table
    is joined to several dimension tables. For example, you can join SAS data sets
    by using SQL syntax in order to create a star schema.


    To improve the performance of the application that processes the joined tables,
    you can specify the ROLE= data set option. For example, you can specify ROLE=FACT
    to designate the specific fact table, or you can specify ROLE=DIMENSION to designate
    each dimension table, meaning that the table not designated is the fact table.


    Because the role table can change between queries, the ROLE= specification is
    in effect for the current step only and is not stored with the data set.


    ## Example: Designating the Fact Table


    In the following example, the ROLE= data set option improves the performance for
    PROC SQL ORDERS is the fact table, and PRODUCT, PERIOD, and CUSTOMER dimension
    tables.


    ```

    proc sql;

    select orders.Order_Total

    from orders (role=fact), product, period, customer

    where orders.Product_ID = product.Product_ID

    and orders.Period_ID = period.Period_ID

    and orders.Customer_ID = customer.Customer_ID

    and product.Product_Name = "camera"

    and period.Period_Name = "1997"

    and customer.Customer_Name = "Walmart";

    quit;

    ```


    ## See Also


    Chapter 7, "SQL Procedure" in SAS SQL Procedure User''s Guide


    # SORTEDBY= Data Set Option


    Specifies how a data set is currently sorted.


    Valid in: DATA step and PROC step


    Category: Data Set Control


    ## Syntax


    ### Syntax Description


    by-clause <collate-name> indicates how the data is currently sorted.


    ### by-clause


    names the variables and options that you use in a BY statement in PROC SORT step.


    ### collate-name


    names the collating sequence that is used for the sort. By default, the collating
    sequence is that of your operating environment. A slash (/) must precede the collating
    sequence.


    ## Operating Environment Information


    For details about collating sequences, see the SAS documentation for your operating
    environment.


    ## _NULL_


    removes any existing sort indicator.


    ## Details


    SAS determines whether a data set is already sorted by the key variable or variables
    in ascending order by checking the sort indicator. The sort indicator is stored
    in the data set descriptor and is set from a previous sort. For detailed information
    about how the sort indicator is used and how it improves performance, see "The
    Sort Indicator" in Chapter 25 of SAS Language Reference: Concepts and "SORTVALIDATE
    System Option" in SAS System Options: Reference.


    The following example of the CONTENTS procedure Sort Information section containing
    the Validated attribute set to NO, indicates that the data set was sorted using
    the SORTEDBY= data set option.


    ```

    Sort Information

    Sortedby var

    Validated NO

    Character Set ANSI

    ```


    ## Comparisons


    - Use the CONTENTS statement in the DATASETS procedure to see how a data set is
    sorted.

    - The SORTEDBY= option indicates how the data is sorted, but does not cause a
    data set to be set.


    ## Example


    This example uses the SORTEDBY= data set option to specify how the data are currently
    sorted. The data set is sorted by PRIORITY and by the descending values of INDATE.
    Once the data set is created, the sort indicator is stored with it. These statements
    create the data set ORDERS and record the sort indicator.


    ```

    libname mylib ''SAS-library'';

    options yearcatoutof=1920;

    data mylib.orders(sortedby=priority

    descending indate)

    input priority $ .1 office $ date7;

    +1 office code $;

    format indate date7.;

    datalines;

    03may01 CN J8U

    1 21mar01 LA M91

    1 01dec00 FW L6R

    1 27feb09 FW Q2A

    2 15jan00 FW 19U

    2 09jul99 CH P3Q

    3 08apr99 CH H5T

    3 31jan99 FW D2W

    ```


    ## See Also


    - Chapter 15, "DATASETS Procedure" in Base SAS Procedures Guide

    - Chapter 48, "SORT Procedure" in Base SAS Procedures Guide

    - Chapter 7, "SQL Procedure" in SAS SQL Procedure User''s Guide


    # SPILL= Data Set Option


    Specifies whether to create a spill file for non-sequential processing of a DATA
    step.


    | Valid in: DATA step and PROC steps |

    | Category: Data Set Control |

    | Restriction: Valid only for a DATA step view |


    ## Syntax


    SPILL=YES | NO


    ## Syntax Description


    YES

    creates a spill file for non-sequential processing of a DATA step view. This is
    the default.


    Interaction: A spill file is never created for sequential processing of a DATA
    step view.


    NO

    does not create a spill file or reduces the size of a spill file.

    Interaction: For direct (random) access


    Note: If you do not have enough disk space to accommodate a resulting spill file
    from a DATA step view that generates a large amount of data, specify SPILL=NO.


    Tip: For SAS procedures that process BY-group data, consider specifying SPILL=NO
    in order to write only the current BY group to the spill file.


    ## Details


    When a DATA step is opened for non-sequential processing, a spill file is created
    by default. The spill file contains the observations that are generated by a DATA
    step. Subsequent requests for data read the observations from the spill file rather
    than execute the DATA step view again. The spill file is a temporary file in WORK
    library.


    Non-sequential processing includes the following methods, which are supported
    by several SAS statements and procedures. How the SPILL= data set option operates
    with each of the access methods is described below:


    random access

    retrieves observations directly by observation number or the value of one more
    variables without reading all observations sequentially. Whether SPILL=YES or
    NO, a spill file is always created because processing time to restart the DATA
    step view for each observation would be costly.


    BY-group access

    uses a BY statement to process observations that are ordered, grouped, or indexed
    according to one more variables. SPILL=YES creates a spill file of all data requested
    from the DATA step view. SPILL=NO writes only the current BY group to the spill
    file.


    two-pass access

    performs multiple sequential passes through the data. With SPILL=NO, no spill
    file is created. Instead, after the first pass through the data, the DATA step
    view is restarted for each pass. If small amounts of data are returned by the
    DATA step view for each restart, the processing time to restart the view might
    become significant.


    With SPILL=NO, subsequent passes through the data could result in generating different
    data. Some processing might require a spill file; for example, results from using
    random functions and computing values based on the current day could affect the
    data.


    ## Examples


    ### Example 1: Using a Spill File for a Small Number of BY Groups


    This example creates a DATA step view that generates a large amount of random
    data and uses UNIVARI with a BY statement. The example illustrates the effects
    of SPILL= with a small number of BY groups. With SPILL=YES, all observations requested
    from the DATA step view are written to the spill file. With SPILL=NO, only the
    observations in the current BY group are written to the spill file. The information
    messages produced by this example show that the size of the spill file is reduced
    with SPILL=NO. However, the time to truncate the spill file for each group might
    add to the overall processing time for the DATA step view.


    ```

    options mlevel=i;

    data vw_few_large / view=vw_large;

    drop;

    byval = ''Group A'', ''Group B'', ''Group C'';

    do i = 1 to 500000;

    r = ranuni(4);

    output;

    end;

    run;

    proc univariate data=vw_few_large (spill=yes) noprint;

    ```


    # SPILL: Data Set Option


    ```

    var r;

    byval;

    run;

    proc univariate data=vw_few_large (spill=nc) noprint;

    var r;

    byval;

    run;

    ```


    ## Log Output


    ```

    1 options level=i;

    2 data vw_few_large / view=vw_large;

    3 drop i;

    4

    5 do byval = ''Group A'', ''Group B'', ''Group C'';

