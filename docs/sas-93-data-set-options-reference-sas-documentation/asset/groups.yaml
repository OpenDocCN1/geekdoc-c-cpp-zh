    \nRestriction: Valid only for a DATA step view\n\n# Syntax\n\nOBSBUF=n\n\n# Syntax\
    \ Description\n\nn specifies the number of observations that are read into the\
    \ view buffer at a time.\nDefault: 32K bytes of memory are allocated for the default\
    \ view buffer, which means that the default number of observations that can be\
