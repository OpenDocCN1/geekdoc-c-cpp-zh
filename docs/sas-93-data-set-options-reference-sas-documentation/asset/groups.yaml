    # PWREQ= Data Set Option


    Specifies whether to display a dialog box to enter a SAS data set password.


    +   **Valid in:** DATA and PROC steps

    **Category:** Data Set Control


    # Syntax


    PWREQ=YES | NO


    # Syntax Description


    **YES**nspecifies to display a dialog box.


    **NO**nprevents a dialog box from displaying. If a missing or invalid password
    is entered, the data set is not opened and an error message is written to the
    SAS log.


    # Details


    In an interactive SAS session, the PWREQ= option controls whether a dialog box
    appears after a user enters an incorrect or missing password for a SAS data set
    that is protected. PWREQ= applies to data sets with read, write, or alter passwords.
    PWREQ= is most useful in SCL applications.


    # See Also


    Data Set Options:


    +   - -ALTER= Data Set Option on page 8

    - -ENCRYPT= Data Set Option on page 17

    - -PW= Data Set Option on page 47

    - -READ= Data Set Option on page 48

    - -WRITE= Data Set Option on page 68


    # READ= Data Set Option


    Assigns a READ password to a SAS file that prevents users from reading the file,
    unless they enter the password.


    +   **Valid in:** DATA step and PROC steps

    **Category:** Data Set Control'
