    # About This Book


    # Syntax Conventions for the SAS Language


    # Overview of Syntax Conventions for the SAS Language


    SAS uses standard conventions in the documentation of syntax for SAS language
    elements. These conventions enable you to easily identify the components of SAS
    syntax. The conventions can be divided into these parts:


    +   - syntax components

    - style conventions

    - special characters

    - references to SAS libraries and external files


    # Syntax Components


    The components of the syntax for most language elements include a keyword and
    arguments. For some language elements only a keyword is necessary. For other language
    elements the keyword is followed by an equal sign (=).


    keyword


    specifies the name of the SAS language element that you use when you write your
    program. Keyword is a literal that is usually the first word in the syntax. In
    a CALL routine, the first two words are keywords.


    In the following examples of SAS syntax, the keywords are the first words in the
    syntax:


    ```

    CHAR (string, position)

    CALL RANBIN (seed, n, p, x)

    ALTER (alter-password)

    BEST w.

    REMOVE <data-set-name>

    ```


    In the following example, the first two words of the CALL routine are the keywords:


    ```

    CALL RANBIN(seed, n, p, x)

    ```


    The syntax of some SAS statements consists of a single keyword without arguments:


    ```

    DO:

    ... SAS code ...

    ```'
  - '[PAGE 7]


    END;


    Some system options require that one of two keyword values be specified:


    DUPLEX | NODUPLEX


    argument specifes a numeric or character constant, variable, or expression. Arguments
    follow the keyword or an equal sign after the keyword. The arguments follow SAS
    to process the language element. Arguments can be required or optional. In the
    syntax, optional arguments are enclosed between angle brackets.


    In the following example, string and position follow the keyword CHAR. These arguments
    are required for the CHAR function:


    ```

    CHAR (string, position)

    ```


    Each argument has a value. In the following example of SAS code, the argument
    string has value of ''summer'', and the argument position has a value of 4:char(''summer'',
    4);


    In the following example, string and substring are required arguments, while modifiers
    and startpos are optional.


    ```

    FIND(string, substring <modifiers>) <startpos>

    ```


    > Note: In many cases, example code in SAS documentation is written with a monospaced
    font. You can use uppercase, lowercase, or mixed case in the code that you write.


    # Style Conventions


    The style conventions that are used in documenting SAS syntax include uppercase
    bold, uppercase, and italic:


    UPPERCASE BOLD


    identifies SAS keywords such as the names of functions or statements. In the following
    example, the keyword ERROR is written in uppercase:


    ```

    ERROR<message>

    ```


    UPPERCASE


    identifies arguments that are literals.


    In the following example of the CMPMODEL= system option, the literals include
    BOTH, CATALOG, and XML:


    ```

    CMPMODEL = BOTH | CATALOG | XML

    ```


    italics


    identifies arguments or values that you supply. Items in italics represent user-supplied
    values that are either one of the following:


    +   - nonliteral arguments


    In the following example of the LINK statement, the argument label is a user-supplied
    value and is therefore written in italics:


    LINK label:


    +   - nonliteral values that are assigned to an argument


    In the following example of the FORMAT statement, the argument DEFAULT is assigned
    the variable default-format.'
  - '[PAGE 8]


    # Syntax Conventions for the SAS Language vii


    FORMAT = variable-l < ..., variable-nformat<DEFAULT = default-format>;


    Items in italics can also be the generic name for a list of arguments from which
    you can choose (for example, attribute-list). If more than one of an item can
    be used, the items are expressed as item-1, ..., item-n.


    # Special Characters


    The syntax of SAS language elements can contain the following special characters:


    = an equal sign identifies a value for a literal in some language elements such
    as system options.


    In the following example of the MAPS system option, the equal sign sets the value
    of MAPS:


    ```

    MAPS = location-of-maps

    ```


    < > brackets identify optional arguments. Any argument that is not enclosed in
    angle brackets is required.


    In the following example of the CAT function, at least one item is required:


    ```

    CAT (item-l < ..., item-n>)

    ```


    | a vertical bar indicates that you can choose one from a group of values. Values
    that are separated by the vertical bar are mutually exclusive.


    In the following example of the CMPMODEL= system option, you can choose only one
    of the arguments:


    ```

    CMPMODEL = BOTH | CATALOG | XML

    ```


    ... an ellipsis indicates that the argument or group of arguments following the
    ellipsis can be repeated. If the ellipsis and the following argument are enclosed
    in angle brackets, then the argument is optional.


    In the following example of the CAT function, the ellipsis indicates that you
    can have multiple items:


    ```

    CAT (item-l < ..., item-n>)

    ```


    ''value'' or “value” indicates an an enclosed in single or double quotation marks
    must have a value that is also enclosed in single or double quotation marks.


    In the following example of the FOOTNOTE statement, the argument text is enclosed
    in quotation marks:


    ```

    FOOTNOTE <n> <ods-format-options ''text'' | "text">;

    ```


    ; a semicolon indicates the end of a statement or CALL routine.


    In the following example each statement ends with a semicolon: data namegame;
    length color name $; color = ''black''; name = ''jack''; game = trim(color) ||
    name; run;'
- md: "\n# References to SAS Libraries and External Files\n\nMany SAS statements and\
    \ other language elements refer to SAS libraries and external files. You can choose\
    \ whether to make the reference through a logical name (a libref or fileref) or\
    \ use the physical filename enclosed in quotation marks. If you use a logical\
    \ name, you usually have a choice of using a SAS statement (LIBNAME or FILENAME)\
    \ or the operating environment's control language to make the association. Several\
    \ methods of referring to SAS libraries and external files are available, and\
    \ some of these methods depend on your operating environment.\n\nIn the examples\
    \ that use external files, SAS documentation uses the italicized phrase *file-specification*.\
    \ In the examples that use SAS libraries, SAS documentation uses the italicized\
    \ phrase *SAS-library*. Note that *SAS-library* is enclosed in quotation marks:\
    \ \n\n```\ninfile file-specification obs = 100;\nlibname libref 'SAS-library';\n\
    ```\n\n# What's New in SAS 9.3 Data Set Options\n\n## Overview\n\nThe SAS data\
    \ set options documentation is no longer part of SAS Language Reference: Dictionary.\
    \ The SAS data set options that were previously documented in SAS Language Reference:\
    \ Dictionary are now documented here, in SAS 9.3 Data Set Options: Reference.\n\
    \n## Changes to SAS Language Reference: Dictionary\n\nPrior to SAS 9.3, this document\
    \ was part of SAS Language Reference: Dictionary. Starting with SAS 9.3, SAS Language\
    \ Reference: Dictionary has been divided into seven documents:\n\n- * SAS Data\
    \ Set Options: Reference\n- SAS Formats and Informats: Reference\n- SAS Functions\
    \ and CALL Routines: Reference\n- SAS Statements: Reference\n- SAS System Options:\
    \ Reference\n- SAS Component Objects: Reference (contains the documentation for\
    \ the Hash Object and the Java Object)\n- Base SAS Utilities: Reference (contains\
    \ the documentation for the SAS DATA step debugger and the SAS Utility macro %DS2CSV)\n\
    \n## New SAS Data Set Option\n\nThe following data set option is new:\nEXTENDOBSCOUNTER=(p.\
    \ 19)\nextends the maximum observation count in an output SAS data file.\n\n#\
    \ Recommended Reading\n\n- * SAS Language Reference: Concepts\n- Base SAS Glossary\n\
    - An Array of Challenges--Test Your SAS Skills\n- Base SAS Procedures Guide\n\
    - Combining and Modifying SAS Data Sets: Examples\n- The Little SAS Book: A Primer\n\
    - SAS Programming by Example\n- Step-by-Step Programming with Base SAS Software\n\
    - Using the SAS Windowing Environment: A Quick Tutorial\n\nFor a complete list\
    \ of SAS publications, go to support.sas.com/bookstore. If you have questions\
    \ about which titles you need, please contact a SAS Publishing Sales Representative.\n\
    \nSAS Publishing Sales\nSAS Campus Drive\nCary, NC 27513-2414\nPhone: 1-800-727-3228\n\
    Fax: 1-919-677-8166\nE-mail: sasbook@sas.com\nWeb address: support.sas.com/bookstore\n\
    \n# Chapter 1: Concepts\n\n| Topic | Page |\n| :--- | :--- |\n| Accessibility\
    \ .....................................................................................................................\
    \ | 1 |\n| Definition of Data Set Options ................................................................................................\
    \ | 1 |\n| Syntax ...................................................................................................................................................................\
    \ | 2 |\n| Using Data Set Options ............................................................................................................................\
    \ | 2 |\n| Using Data Set Options with Input or Output SAS Data Sets ........................................................\
    \ | 2 |\n| How Data Set Options Interact with System Options ................................................................\
    \ | 3 |\n| Data Set Options Documented in Other SAS Publications .................................................................\
    \ . . . | 3 |\n\n# Accessibility\n\nThis document is a command-based product.\
    \ For this release, no features were added to address accessibility, but the product\
    \ might very well be compliant to accessibility standards because it does not\
    \ have a graphical user interface, and all of its features are available to anyone\
    \ who can type or otherwise produce a command. If you have specific questions\
    \ about the accessibility of SAS products, send them to accessibility@sas.com\
    \ or call SAS Technical Support.\n\n# Definition of Data Set Options\n\nData set\
    \ options specify actions that apply only to the SAS data set with which they\
    \ appear. They let you perform the following operations:\n\n- * renaming variables\n\
    - selecting only the first or last n observations for processing\n- dropping variables\
    \ from processing or from the output data set\n- specifying a password for a data\
    \ set\n\n# Syntax\n\nSpecify a data set option in parentheses after a SAS data\
    \ set name. To specify several data set options, separate them with spaces.\n\
    These examples show data set options in SAS statements:\n\n```\n(option-i=value-<option-n=value-n>)\n\
    ```\n\nThese examples show data set options in SAS statements:\n\n- data scores\
    \ (keep=team game1 game3);\n- data mydata (index=(b k) label=label for data set\
    \ drop=p read=secret);\n- data new (drop=n index=combo=(xl1 a20 b1 b50)));\n-\
    \ data ixdup2 (compress= index=(ok2 ssn/unique ok3);\n- proc print data (drop=year);\n\
    - set old (rename=(date=Start_Date));\n\n# Using Data Set Options\n\n## Using\
    \ Data Set Options with Input or Output SAS Data Sets\n\nMost SAS data options\
    \ can apply to either input or output SAS data sets in DATA steps or procedure\
    \ (PROC) steps. If a data set is associated with an input data set, the action\
    \ applies to the data set that is being read. If the option appears in the DATA\
    \ statement or after an output data set specification in a PROC step, SAS applies\
    \ the action to the output data set. In the DATA step, data set options for output\
    \ data sets may be present in the DATA set statement, not in any OUTPUT statements.\n\
    \nSome data options, such as COMPRESS =, are meaningful only when you create a\
    \ SAS data set because they set attributes that exist for the duration of the\
    \ data set. To change or cancel most data set options, you must re-create the\
    \ data set. You can change other options (such as PW= and LABEL =) with PROC DATASETS.\
    \ For more information, see Chapter 15, \"DATASETS Procedure\" in Base SAS Procedures.\n\
    \nWhen data set options appear on both input and output data sets in the same\
    \ DATA or PROC step, SAS first applies data set options to input data sets. Then\
    \ SAS evaluates programming statements or applies data set options to output data\
    \ sets. Likewise, statements specified for the data set being created are applied\
    \ after programming statements. For example, when using the RENAME= data set option,\
    \ the new names are not associated with the variables until the DATA step.\n\n\
    In some instances, data set options conflict when they are used in the same statement.\
    \ For example, you cannot specify both DROP= and KEEP= data options for the same\
    \ variable in the same statement. Timing can be an issue in some cases. For example,\
    \ if using KEEP= and RENAME= on a data set specified in the SET statement, SAS\
    \ processes KEEP= before the data set is read. The new names specified in RENAME=\
    \ apply to the programming statements that follow the SET statement.\n\n# How\
    \ Data Set Options Interact with System Options\n\nMany system options and data\
    \ set options share the same name and have the same function. System options remain\
    \ in effect for all DATA and PROC steps in a SAS job or session.\n\nThe data set\
    \ option overrides the system option for the data set in the step in which it\
    \ appears. In this case, the OBS= system option in the OPTIONS statement specifies\
    \ that only the first 100 observations are processed from any data set within\
    \ the SAS job. The OBS= data set option in the SET statement, however, overrides\
    \ the system option for data set TWO and specifies that only the first five observations\
    \ are read from data TWO. The PROC PRINT step prints the data set FINAL. This\
    \ data set contains the first 5 observations from data TWO, followed by the first\
    \ 100 observations from data THREE.\n\n```\noptions obs=100;\n\ndata final;\n\
    set two(obs=5) three;\nrun;\n\nproc print data=final;\nrun;\n```\n\n# Data Set\
    \ Options Documented in Other SAS Publications\n\nIn addition to data set options\
    \ documented in SAS Language Reference: Dictionary, data set options are also\
    \ documented in the following publications:\n\n- * SAS Companion for Windows\n\
    - SAS Companion for UNIX Environments\n- SAS Companion for z/OS\n- SAS National\
    \ Support: Reference Guide\n- SAS Scalable Performance Data Engine: Reference\n\
    - SAS/ACCESS for Relational Databases: References\n"
