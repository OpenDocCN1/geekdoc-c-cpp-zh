    DATASETS 过程提供了多种语句，通过指定 GENNUM=，可以为这些语句提供额外功能：


    - 对于 DATASETS 和 DELETE 语句，GENNUM= 支持额外的值 ALL、HIST 和 REVERT。

    - 对于 CHANGE 语句，GENNUM= 支持额外的值 ALL。

    - 对于 CHANGE 语句，指定 GENNUM=0 指代除基础版本以外的所有版本。


    ## 详情


    当使用 GENMAX= 数据集选项请求数据集的多个生成（generations）时，使用 GENNUM= 来请求特定版本。例如，指定 GENNUM=3 指代历史版本
    #003，而指定 GENNUM=-1 则指代最新（最年轻）的历史版本。


    注意：在进行 999 次替换后，最年轻的版本将是 #999。在 1,000 次替换后，SAS 将最年轻的版本号重置为 #000。因此，如果你需要历史版本 #000，请指定
    GENNUM=1000。


    绝对引用和相对引用都指向特定版本。相对引用不会跳过已删除的版本。因此，当处理包含一个或多个已删除版本的生成组时，如果引用的版本已被删除，使用相对引用将导致错误。例如，如果你有一个基础版本
    AIR 以及三个历史版本（AIR#001、AIR#002 和 AIR#003），并且删除了 AIR#002，以下语句将返回错误，因为 AIR#002 并不存在。SAS
    不会假设你指的是 AIR#003：


    ```

    proc print data=air (gennum=-2);

    run;

    ```


    ## 示例


    示例 1：使用绝对引用请求版本

    此示例使用绝对引用打印数据集 A 的历史版本 #003：


    ```

    proc print data=a (gennum=3);

    run;

    ```


    示例 2：使用相对引用请求版本

    以下 PRINT 过程打印比基础版本向前三个版本的数据集：


    ```

    proc print data=a (gennum=-3);

    run;

    ```


    ## 另另


    数据集选项：


    - 第 22 页的“GENMAX= 数据集选项”


    其他：


    ## IDXNAME= 数据集选项


    - 《SAS 语言参考》第 26 章中的“理解生成数据集”：

    - 《Base SAS 过程指南》第 15 章，“DATASETS 过程”


    IDXNAME= 数据集选项


    指示 SAS 使用特定索引来匹配 WHERE 表达式的条件。


    **有效范围：** DATA 步和 PROC 步

    **类别：** 用户控制 SAS 索引的使用

    **限制：** 仅适用于输入数据集

    与 IDXNAME= 数据集选项互斥


    ## 语法


    ```

    IDXNAME=index-name

    ```


    ## 语法说明


    - *index-name* 指定 SAS 数据集的简单或复合索引的名称（最多 32 个字符）。SAS 不尝试确定指定的索引是否为最佳索引，或者顺序搜索是否更具资源效率。


    **交互：** 该指定不是数据集的永久属性，仅在使用该数据集时有效。


    **提示：** 若要在 SAS 日志中记录 IDXNAME= 的使用情况，请指定系统参数 MSGLEVEL=I。


    ## 详情


    默认情况下，为了满足索引 SAS 数据集的 WHERE 表达式条件，SAS 会识别零或多个可用于优化 WHERE 表达式的候选索引。从候选索引列表中，SAS
    决定提供最佳性能的一个，或者如果预计顺序搜索更高效，则拒绝所有索引。


    由于 SAS 的选择并不总是能提供最佳优化，你可以通过指定 IDXNAME= 数据集选项来指示 SAS 使用候选索引之一。如果你指定的索引未被识别为候选索引，IDXNAME=
    将不会处理该请求。也就是说，IDXNAME= 不允许你指定可能会产生错误结果的索引。


    ## 比较


    IDXNAME= 允许你覆盖关于使用索引的决策。


    ## 示例：示例


    此示例使用 IDXNAME= 数据集选项来指示 SAS 使用特定索引来优化 WHERE 表达式。它忽略了顺序搜索可能更具资源效率的可能性，并不尝试确定指定的索引是否最佳。（注意，EMPNUM
    尚未创建。）


    ```

    data mydata.empnew;

    set mydata.employee (idxname=empnum);

    where empnum < 2000;

    run;

    ```


