  - '[PAGE 46]


    # Category: Data Set Control


    Restriction: Valid only for a DATA step view


    # Syntax


    OBSBUF=\eta


    # Syntax Description


    n specifies the number of observations that are read into the view buffer at a
    time.

    Default: 32K bytes of memory are allocated for the default view buffer, which
    means that the default number of observations that can be read into the view buffer
    at one time depends on the observation length. Therefore, the default is the number
    of observations that can fit into 32K bytes. If the observation length is larger
    than 32K, then only one observation can be read into the buffer at a time.

    Tip: To determine the observation length, which is its size in bytes, PROC CONTENTS
    for the DATA step view.

    CAUTION: The maximum value for the OBSBUF= option depends on the amount of available
    memory. If you specify a value so large that the memory allocation of the view
    buffer fails, an out-of-memory error results. If you specify a value that is larger
    than the amount of available memory and your operating environment allows SAS
    to perform the allocation using virtual memory, the result can be a decrease in
    performance due to excessive paging.


    # Details


    OBSBUF= data step option specifies the number of observations that can be read
    into the buffer at a time. The view buffer is a segment of memory that is allocated
    to hold output observations that are generated from a DATA step view. The size
    of the view buffer determines how much data can be held in memory at one time.
    OBSBUF enables you to tune the performance of reading data from a DATA step view.


    The view buffer is shared between the request that opens the DATA step view (for
    example, a SAS procedure) and the DATA step view itself. Two computers coordinate
    between requesting data and returning the data as follows:


    +   1. When a request (such as a PRINT procedure) requests data, task switching
    occurs from the request task to the view task in order to execute the DATA step
    view and generate the observations. The DATA step view fills the view buffer with
    many observations as possible.

    2. When the view buffer is full, task switching occurs from the view task back
    to the request task in order to return the requested data. The observations are
    cleared from the view buffer.


    The size of the view buffer determines how many generated observations can be
    held. The number of observations then determines how many times the computer must
    switch between the request task and the view task. For example, OBSBUF=1 results
    in task switching for each observation, while OBSBUF=10 results in 10 observations
    being read into the view buffer at a time. The larger the view buffer is, the
    less task switching is needed to process a DATA step view, which can speed up
    execution time.'
- md: "\nTo improve efficiency, determine how many observations fits into the default\
    \ buffer size, then set the view buffer so that it can hold more generated observations.\n\
    \n> Note: Using OBSBUF= improve processing efficiency by reducing task switching.\
    \ However, the larger the view buffer, the more time it takes to fill. This delays\
    \ the task switching from the view buffer back to the request task in order to\
    \ return the requested data. The delay is more apparent in interactive applications.\
    \ For example, when you use the Viewable window, the larger the view buffer, the\
    \ longer it takes to display the requested observations. The view buffer must\
    \ be filled before one observation is returned to the Viewable. Therefore, before\
    \ you set a very large buffer size, consider the type of application that you\
    \ are using to process the DATA step view as well as the memory of that that you\
    \ have available.\n\n## Example\n\nFor this example, the observation length is\
    \ 10K, which means the default view buffer size, which is 32K, would result in\
    \ three observations at a time to be read into the view buffer. The default view\
    \ buffer size causes the execution time to be slower, because the computer must\
    \ do task switching for every three observations that are generated.\n\nTo improve\
    \ performance, the OBSBUF= data set option is set to 100. This causes one hundred\
    \ observations at a time to be read into the view buffer. It also reduces task\
    \ switching in order to process the DATA step view with the PRINT procedure:\n\
    \n```\ndata testview / view=testview;\n... more SAS statements\nrun;\nproc print\
    \ data=testview (obsbuf=100);\nrun;\n```\n\n## See Also\n\n### Data Set Options:\n\
    \n- SPILL= Data Set Option on page 57\n\n## OBS= Data Set Option\n\nSpecifies\
    \ the last observation that SAS processes in a data set.\n\n| Valid in: DATA step\
    \ and PROC steps |\n| Category: Observation Control |\n| Default: MAX |\n| Restrictions:\
    \ Use with input data sets only |\n| Cannot use with PROC SQL views |\n\n## Syntax\n\
    \n```\nOBS= n | nK | nM | nG | nT | hexX | MIN | MAX\n```\n\n## Syntax Description\n\
    \nn | nK | nM | nG | mT\n\nspecifies a number to indicate when to stop observations,\
    \ with n being an integer. Using one of the letter notations results in multiplying\
    \ the integer by a specific value. That is, specifying K (kilo) multiplies the\
    \ integer by 1,024, M (mega) multiplies by 1,048,576, G (giga) multiplies by 1,073,741,824,\
    \ or T (tera) multiplies by 1,099,511,627,776. For example, a value of 20 specifies\
    \ 20 observations, while a value of 3m multiplies 3,145,728 observations.\n\n\
    ## hexX\n\nspecifies a number to indicate when to stop processing a hexadecimal\
    \ value. You must specify the value beginning with a number (0–9), followed by\
    \ an X. For example, the hexadecimal value F8 must be specified as 0xF8 in order\
    \ to specify the decimal equivalent of 248. The value 2dx specifies the decimal\
    \ value of 45.\n\n## MIN\n\nsets the number to indicate when to stop processing\
    \ to 0. Use OBS=0 to create empty data set that has the structure, but not the\
    \ observations, of another data set.\n\n**Interaction:** If OBS=0 the NOPLACE\
    \ option is in effect, then SAS can still take actions. SAS executes each DATA\
    \ and PROC step in the program, using no observations. For example, SAS executes\
    \ procedures, such as CONTENTS and DATASETS, which process libraries or SAS data\
    \ sets.\n\n## MAX\n\nsets the number to indicate when to stop processing to the\
    \ maximum number of observations in the data set, up to the largest 8-byte, signed\
    \ integer, which is 2⁶³-1, or approximately 9.2 quintillion. This is the default.\n\
    \n## Details\n\nOBS= tells SAS when to stop observations. To determine when to\
    \ stop processing, SAS uses the value for OBS= in a formula that includes the\
    \ value for FIRSTOBS=. The formula is\n\n```\n(obs - firstobs) + 1 = results\n\
    ```\n\nFor example, if OBS=10 and FIRSTOBS=1 (which is the default for FIRSTOBS=),\
    \ the result is ten observations, that is (10 - 1) + 1 = 10. If OBS=10 and FIRSTOBS=2,\
    \ the result is nine observations, that is (10 - 2) + 1 = 9. OBS= is valid only\
    \ when an existing SAS data set is read.\n\n## Comparisons\n\n- The OBS= data\
    \ set option overrides the OBS= system option for the individual data set.\n-\
    \ While the OBS= data set option sets an ending point for processing, the FIRSTOBS=\
    \ sets a starting point. The two options are often used to define a range of observations\
    \ to be processed.\n- The OBS= data set option enables you to select observations\
    \ from SAS data sets. You can select observations to be read from external data\
