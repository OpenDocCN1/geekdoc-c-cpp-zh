    # Details


    The ALTER= option applies to all types of SAS files except catalogs. You can use
    this option to assign a password to a SAS file or to access a read-protected,
    write-protected, or alter-protected SAS file.


    When replacing a SAS data set that is protected with an ALTER password, the new
    data set inherits the ALTER password. To change the ALTER password for the new
    data set, use the MODIFY statement in the DATASETS procedure.


    Note: A SAS password does not control access to a SAS file beyond the SAS system.

    You should use the operating system-supplied utilities and file-system security
    controls in order to control access to SAS files outside of SAS.


    # See Also


    Data Set Options:


    +   * “ENCRYPT= Data Set Option” on page 17

    * “PW= Data Set Option” on page 47

    * “READ= Data Set Option” on page 48

    * “WRITE= Data Set Option” on page 68


    Other:


    +   * “File Protection” in Chapter 34 of SAS Language Reference: Concepts

    * “Manipulating Passwords” in Chapter 15 of Base SAS Procedures Guide


    # BUFNO= Data Set Option


    Specifies the number of buffers to be allocated for processing a SAS data set.


    | Valid in: | DATA step and PROC steps |

    | Category: | Data Set Control |

    | See: | BUFNO= Data Set Option in the documentation for your operating environment.
    |


    # Syntax


    ```

    BUFNO= n | nK | hexX | MIN | MAX

    ```


    # Syntax Description


    n nK

    sifies the number of buffers in multiples of 1 (bytes); 1,024 (kilobytes). For
    example, a value of 8 specifies 8 buffers, and a value of 1k specifies 1024 buffers.


    hexX

    sifies the number of buffers as a hexadecimal value. You must specify the value
    beginning with a number (0-9), followed by an X. For example, the value 2dx sets
    the number of buffers to 45 buffers.'
  - '[PAGE 23]


    # MIN


    sets the minimum number of buffers to 0, which causes SAS to use the minimum

    optimal value for the operating environment. This is the default.


    # MAX


    sets the number of buffers to the maximum possible number in your operating

    environment, up to the largest four-byte, signed integer, which is 2³¹-1, or

    approximately 2 billion.


    # Details


    The buffer number is not a permanent attribute of the data set; it is valid only
    for

    t current SAS session or job.


    BUFNO= applies to SAS data sets that are opened for input, output, or update.


    A larger number of buffers can speed up execution time by limiting the number
    of input

    and output (I/O) operations that are required for a particular SAS data set. However,
    the

    improvement in execution time comes at the expense of increased memory consumption.


    To reduce I/O operations on a small data set as well as speed execution time,
    allocate

    one buffer for each page of data to be processed. This technique is effective
    if you

    read the same observations several times during processing.


    Operating Environment Information


    The default value for BUFNO= is determined by your operating environment and is

    sto optimize sequential access. To improve performance for direct (random)

    access, you should change the value for BUFNO=. For the default setting and

    possible settings for direct access, see the BUFNO= data set option in the SAS

    documentation for your operating environment.


    # Comparisons


    +   - If the BUFNO= data set option is not specified, then the value of the BUFNO=

    s option is used. If both are specified in the same SAS session, the value

    specified for the BUFNO= data set option overrides the value specified for the

    BUFNO= system option.


    +   - To request SAS allocate the number of buffers based on the number of data
    set

    pages and index file pages, use the SASFILE global statement.


    # See Also


    +   - "BUFSIZE= Data Set Option" on page 11


    # System Options:


    +   - "BUFNO= System Option" in SAS System Options: Reference


    # Statements:


    +   - "SASFILE Statement" in SAS Statements: Reference'
  - '[PAGE 24]


    # BUFSIZE= Data Set Option


    Specifies the size of a permanent buffer page for an output SAS data set.


    +   **Valid in:** DATA step and PROC steps


    +   **Category:** Data Set Control


    +   **Restriction:** Use with output data sets only.


    +   **See:** BUFSIZE= Data Set Option under UNIX, z/OS, or OpenVM in the documentation
    for your operating environment.


    # Syntax


    ```

    BUFSIZE= n | nK | nM | nG | hexX | MAX

    ```


    # Syntax Description


    **n | nK | nM** specifies the page size in multiples of 1 (bytes); 1,024 (kilobytes);
    1,048,576 (megabytes); or 1,073,741,824 (gigabytes). For example, a value of 8
    specifies a page size of 8 bytes, and a 4k specifies a page size of 4096 bytes.


    > Note: If the system option and the data set option are not set, the default
    is 0. As a result, SAS uses the minimum optimal page size for the operating environment.
    The BUFSIZE= system option is used in either of the following scenarios:


    +   - if the BUFSIZE= data set option is not set

    - if the BUFSIZE= data set option is set to zero


    Use BUFSIZE=0 in order to reset the buffer page size to the default value in your
    operating environment.


    # hexX


    specifies the page size as a hexadecimal value. You must specify the value beginning
    with a number (0-9), followed by an X. For example, the value 2dx sets the page
    size to 45 bytes.


    # MAX


    sets the page size to the maximum possible number in your operating environment,
    up to the largest four-byte, signed integer, which is 2³-1, or approximately 2
    billion bytes.


    # Details


    The page size is the amount of data that can be transferred for a single I/O operation
    to one buffer. The page size is a permanent attribute of the data set and is used
    when the data set is processed.


    A larger page size can speed up execution time by reducing the number of times
    SAS has to read from or to the storage memory. However, the improvement in execution
    time comes at the cost of increased memory consumption.


    To change the page size, use a DATA step to copy the data set and either specify
    a new page size or use the SAS default. To reset the page size to the default
    value in your operating environment, use BUFSIZE=0.'
  - '[PAGE 25]


    Note: If you use the COPY procedure to copy a data set to another library that
    is allocated with a different engine, the specified page size of the data set
    is not retained.


    Operating Environment Information


    The default value for BUFSIZE= is determined by your operating environment and
    is set to optimize sequential access. To improve performance for direct (random)
    access, you should change the value for BUFSIZE=. For the default setting and
    possible settings for direct access, see the BUFSIZE= data set option in the SAS
    documentation for your operating environment.


    # See Also


    Data Set Options:


    +   - “BUFNO= Data Set Option” on page 9


    System Options:


    +   - “BUFSIZE= System Option” in SAS System Options: Reference


    # CNTLLEV= Data Set Option


    Specifies the level of shared access to a SAS data set.


    | Valid in: | DATA step and PROC steps |

    | Category: | Data Set Control |

    | Restriction: | Specify for input data sets only. |


    # Syntax


    ```

    CNTLLEV=LIB | MEM | REC

    ```


    # Syntax Description


    LIB

    specifies that concurrent access is controlled at the library level. Library-level
    control restricts concurrent access to only one update process to the library.


    MEM

    specifies that concurrent access is controlled at the SAS data set (member) level.
    Member-level control restricts concurrent access to only one update or output
    process to the SAS data set. If the data set is open for an update or output process,
    then no other operation can access the data set. If the data set is open for an
    input process, then other concurrent input processes are allowed but no update
    or output process is allowed.


    REC

    specifies that concurrent access is controlled at the observation (record) level.
    Record-level control allows more than one update access to the same SAS data set,
    but it denies concurrent update of the same observation.'
  - '[PAGE 26]


    # Details


    CNTLLEV= specifies the level at which shared update access to a SAS data set is
    denied. A SAS data set can be opened concurrently by more than one SAS session
    or by more than one statement, window, or procedure within a single session. By
    default, SAS procedures permit the greatest degree of concurrent access possible
    while they guarantee the integrity of the data and the data analysis. Therefore,
    you do not typically use the CNTLEV= data option.


    Use this option when


    +   - your application controls the access to the data, such as in SAS Component
    Language (SCL), SAS/IML software, or DATA step programming

    - you access data through an interface engine that does not provide member-level
    control of the data.


    If you use COMPRESS=REC and the SAS procedure needs member-level control for integrity
    of the data analysis, SAS prints a warning to the SAS log. The warning states
    that inaccurate or unpredictable results can occur if the data are updated by
    another process during the analysis.


    # Example: Changing the Shared Access Level


    In the following example, the first SET statement includes the CNTLEV data set
    option in order to override the default level of shared access from member-level
    control to record-level control. The second SET statement opens the SAS data set
    with the default member-level control.


    ```

    set datilib.fuel (cntlllev=rec) point=obsnum;

    ```


    ```

    set datilib.fuel;

    by area;

    ```


    # COMPRESS= Data Set Option


    Specifies how observations are compressed in a new output SAS data set.


    | Valid in: | DATA step and PROC steps |

    | Category: | Data Set Control |

    | Restriction: | Use with output data sets only |


    # Syntax


    COMPRESS=NO | YES | CHAR | BINARY


    # Syntax Description


    NO


    specifies that the observations in a newly created SAS data set are uncompressed
    (fixed-length records).'
- md: "\n# YES | CHAR\n\nspecifies that the observations in a newly created SAS data\
    \ set are compressed (variable-length records) by SAS using RLE (Run Length Encoding).\
    \ RLE compresses observations by reducing repeated consecutive characters (including\
    \ blanks) to two-byte or three-byte representations.\n\nAlias: ON\n\n# BINARY\n\
    \nspecifies that the observations in a newly created SAS data set are compressed\
    \ (variable-length records) by SAS using RDC (Ross Data Compression). RDC combines\
    \ run-length encoding and sliding-window compression to compress the file.\n\n\
    Note: This method is effective for compressing medium to large (several hundred\
    \ bytes or larger) blocks of binary data (numeric variables). Because the compression\
    \ function operates on a single record at a time, the record needs to be several\
    \ hundred bytes or larger for effective compression.\n\n# Details\n\nCompressing\
    \ a file is a process that reduces the number of bytes used to represent each\
    \ observation. Advantages of compressing a file include reduced storage requirements\
    \ for the file and fewer I/O operations to read or write the data during processing.\
    \ However, more CPU resources are required to read a compressed file (because\
    \ of the overhead of compressing each observation). There are situations where\
    \ the resulting file size might increase rather than decrease.\n\nUse the COMPRESS=\
    \ data set option to compress an individual file. Specify the option output data\
    \ sets only—that is, data sets named in the DATA statement of DATA or in the OUT=\
    \ option of a SAS procedure. The COMPRESS= data set option when you are creating\
    \ a SAS file (member type DATA). You cannot compress SAS views, because they contain\
    \ no data.\n\nAfter a file is compressed, the setting is a permanent attribute\
    \ of the file, which means to change the setting, you must re-create the file.\
    \ That is, to compress a file, specify COMPRESS=NO for a DATA step that copies\
    \ the compressed file.\n\n# Comparisons\n\nThe COMPRESS= data set option overrides\
    \ the COMPRESS= option in the LIBNAME statement and the COMPRESS= system option.\n\
    \nThe data set option POINTOBS=YES, which is the default, determines that compressed\
    \ data set can be processed with random access (by observation number) rather\
    \ than sequential access. With random access, you can specify an observation in\
    \ the FESIT procedure and the POINT= in the SET and MODIFY statements.\n\nWhen\
    \ you compress a file, you can also specify REUSE=YES (as a data option or system\
    \ option) in order to track and use space. With REUSE=YES, new observations are\
    \ inserted in free speed when observations are updated or deleted. When the default\
    \ REUSE=NO is in effect, new observations are appended to the existing file.\n\
    \nPOINTOBS=YES and REUSE=YES are mutually exclusive—that is, they cannot be together.\
    \ REUSE=YES takes precedence over POINTOBS=YES. That is, if you set REUSE=YES,\
    \ SAS automatically sets POINTOBS=NO.\n\nThe TAPE engine supports the COMPRESS=\
    \ data set option, but the engine does not support the COMPRESS system option.\n\
    \nThe XPORT engine does not support compression.\n\n# See Also\n\nData Set Options:\n\
    \n- \"POINTOBS= Data Set Option\" on page 46\n- \"REUSE= Data Set Option\" on\
    \ page 53\n\nStatements:\n\n- \"LIBNAME Statement\" in SAS Statements: Reference\n\
    \nSystem Options:\n\n- \"COMPRESS= System Option\" in SAS System Options: Reference\n\
    - \"REUSE= System Option\" in SAS System Options: Reference\n\nOther:\n\n- \"\
    Compressing Data Files\" in Chapter 26 of SAS Language Reference: Concepts\n\n\
    # DLMGACTION= Data Set Option\n\nSpecifies the action to take when a data set\
    \ in a SAS library is detected as damaged.\n\nValid in: DATA step and PROC steps\n\
    \nCategory: Data Set Control\n\n# Syntax\n\nDLMGACTION=FAIL | ABORT | REPAIR |\
    \ NOINDEX | PROMPT\n\n# Syntax Description\n\nFAIL stops the step, issues an error\
    \ message to the log immediately. This is the default for batch mode.\n\nAbort\
    \ terminates the step, issues an error message to the log, and terminates the\
    \ SAS session.\n\nREPAIR automatically repairs and rebuilds indexes and integrity\
    \ constraints, unless the data is truncated. You use the REPAIR statement in PROC\
    \ DATASETS to restore a truncated data set. It issues a warning message to the\
    \ log. This is the default for interactive mode.\n\nNOINDEX automatically repairs\
    \ the data file without the indexes and integrity constraints, deletes the index\
    \ file, updates the data file to reflect the disabled indexes and integrity constraints,\
    \ and limits the data file to be opened only in INPUT mode. A warning is written\
    \ to the SAS log instructing you to execute the PROC DATASETS statement REBUILD\
    \ statement to correct or delete the disabled indexes and integrity constraints.\n\
    \nSee:\n\"DLMGACTION= Data Set Option\" on page 15\n\"Recovering Disabled Indexes\
    \ and Integrity Constraints\" in Chapter 36 of SAS Language Reference: Concepts\n\
    \nPROMPT\ndisplays a dialog box that asks you to select the FAIL, ABORT, REPAIR,\
    \ or INDEX action.\n\n# DROP= Data Set Option\n\nFor an input data set, excludes\
    \ the specified variables from processing; for an output data set, excludes the\
    \ specified variables from being writing to the data set.\n\n- Valid in: DATA\
    \ step and PROC steps\n\nCategory: Variable Control\n\n# Syntax\n\n```\nDROP=variable-1\
    \ <...variable-n>\n```\n\n# Syntax Description\n\nvariable-1 <...variable-n>\n\
    lists one or more variable names. You can list the variables in any form that\
    \ SAS allows.\n\n# Details\n\nIf the option is associated with an input data set,\
    \ the variables are not available for processing. If the DROP= data set option\
    \ is associated with an output data set, SAS does not write the variables to the\
    \ output data set, but they are available for processing.\n\n# Comparisons\n\n\
    - The DROP data set option differs from the DROP statement in these ways:\n- In\
    \ DATA steps, the DROP= data set option can apply to both input and output data\
    \ sets. The DROP statement applies only to output data sets.\n- In DATA steps,\
    \ when you create multiple output data sets, use the DROP= data set option to\
    \ write different variables to different data sets. The DROP statement lies to\
    \ all output data sets.\n- In PROC steps, you can use only the DROP= data set\
    \ option, not the DROP statement.\n- The KEEP= data set option specifies a list\
    \ of variables to be included in processing or to be written to the output data\
    \ set.\n\n# Examples\n\n# Example 1: Excluding Variables from Input\n\nIn this\
    \ example, variables SALARY and GENDER are not included in processing and they\
    \ are not written to either output data set:\n\n```\ndata plan2;\n  set payroll(drop=salary\
    \ gender);\n  if hired='oljan98'd then output plan;\n  else output plan2;\n\n\
    run;\n```\n\nYou cannot use SALARY or GENDER in any logic in the DATA step DROP=\
    \ prevents the SET statement from reading them from PAYROLL.\n\n# Example 2: Processing\
    \ Variables without Writing Them to a Data Set\n\nIn this example, SALARY and\
    \ GENDER are not written to PLAN2, but they are written to PLAN1:\n\n```\ndata\
    \ plan2(drop=salary gender);\n  set payroll;\n  if hired='oljan98'd then output\
    \ plan;\n  else output plan2;\n\nrun;\n```\n\n# See Also\n\nData Set Options:\n\
    \n- \"KEEP= Data Set Option\" on page 30\n\nStatements:\n\n- \"DROP Statement\"\
    \ in SAS Statements: Reference\n\n# ENCRYPT= Data Set Option\n\nSpecifies whether\
    \ to encrypt an output SAS data set.\n\nValid in: DATA step and PROC steps\n\n\
    Category: Data Set Control\n\nRestriction: Use with output data sets only.\n\n\
    # Syntax\n\n```\nENCRYPT=YES|NO\n```\n\n# Syntax Description\n\nYES encrypts the\
    \ file. This encryption uses passwords that are stored in the data set. At a minimum,\
    \ you must specify the READ= or PW= data set option at the same time you specify\
    \ ENCRYPT=YES. Because the encryption method uses passwords, you cannot change\
    \ any password on an data set without recreating the data set.\n\n> CAUTION:\n\
    Record all passwords using ENCRYPT=YES. If you forget the passwords, you cannot\
    \ reset it without assistance from SAS. The process is time-consuming and resource-intensive.\n\
    \nNO\ndoes encrypt the file.\n\n# Details\n\nWhen using ENCRYPT=YES, the following\
    \ rules apply:\n\n- You cannot encrypt SAS views, because they contain no data.\n\
    - To copy an encrypted data file, the output engine must support the encryption.\
    \ Otherwise, the data file is not copied.\n- Encrypted files work only in SAS\
    \ 6.11 or later.\n- If the data file is encrypted, all associated indexes are\
    \ also encrypted.\n- Encryption requires approximately the same amount of CPU\
    \ resources as compression.\n- You cannot use PROC PORT on SAS Proprietary encrypted\
    \ data files.\n\n# Example: Using the ENCRYPT=YES Option\n\nThis example creates\
    \ an encrypted SAS data set using encryption:\n\n```\ndata salary(encrypt=yes\
    \ read=green);\n  input name $ ysal bonuspct;\ndatalines\nMuriel 34567 3.2\nBjorn\
    \ 74644 2.5\nPreda 38755 4.1\nBenny 29855 3.5\nAgnetha 70998 4.1\n;\n```\n\nTo\
    \ use this data set, specify the read password:\nproc contents data=salary(read=green);\n\
    run;\n\n# See Also\n\nData Set Options:\n\n- \"ALTER= Data Set Option\" on page\
    \ 8\n- \"PW= Data Set Option\" on page 47\n- \"READ= Data Set Option\" on page\
    \ 48\n- \"WRITE= Data Set Option\" on page 68\n\nOther:\n"
  mdcn: "\n\n# YES | CHAR\n\n指定新创建的 SAS 数据集中的观测值由 SAS 使用 RLE（游程编码）进行压缩（变长记录）。RLE 通过将重复的连续字符（包括空格）缩减为双字节或三字节的表示形式来压缩观测值。\n\
    \n别名：ON\n\n# BINARY\n\n指定新创建的 SAS 数据集中的观测值由 SAS 使用 RDC（Ross  own压缩）进行压缩（变长记录）。RDC\
    \ 结合了游程编码和滑动窗口压缩来压缩文件。\n\n注意：该方法对于压缩中等到较大（几百字节或更多）的二进制数据块（数值型变量）非常有效。由于压缩函数一次处理单条记录，因此记录需要几百字节或更大才能实现有效压缩。\n\
    \n# 详情\n\n压缩文件是一个减少表示每个观测值所用字节数的过程。压缩文件的优点包括减少文件的存储需求，以及在处理过程中减少读取或写入数据时的 I/O\
    \ 操作次数。然而，读取压缩文件需要更多的 CPU 资源（因为压缩每个观测值存在额外开销）。在某些情况下，结果的文件大小可能会增加而不是减少。\n\n使用\
    \ `COMPRESS=` 数据集选项来压缩单个文件。仅指定输出数据集选项——即在 `DATA` 语句中或在 SAS 过程的 `OUT=` 选项中命名的数据集。在创建\
    \ SAS 文件（成员类型为 DATA）时使用 `COMPRESS=` 数据集选项。你无法压缩 SAS 视图，因为它们不包含数据。\n\n文件被压缩后，该设置是该文件的永久属性，这意味着要更改设置，必须重新创建文件。也就是说，要压缩文件，需要在复制压缩文件的\
    \ `DATA` 步中指定 `COMPRESS=NO`。\n\n# 比较\n\n`COMPRESS=` 数据集选项会覆盖 `LIBNAME` 语句中的 `COMPRESS=`\
    \ 选项以及 `COMPRESS=` 系统选项。\n\n数据集选项 `POINTOBS=YES`（默认值）决定压缩的数据集可以通过随机访问（通过观测值编号）而不是顺序访问来处理。通过随机访问，你可以在\
    \ `FSET` 过程中指定观测值，并在 `SET` 和 `MODIFY` 语句中使用 `POINT=`。\n\n当你压缩文件时，你还可以指定 `REUSE=YES`（作为数据选项或系统选项）来跟踪和使用空间。使用\
    \ `REUSE=YES` 时，当更新或删除观测值时，新观测值将插入空空间。当默认的 `REUSE=NO` 生效时，新观测值将追加到现有文件中。\n\n`POINTOBS=YES`\
    \ 和 `REUSE=YES` 是互斥的——也就是说不能同时使用。`REUSE=YES` 的优先级高于 `POINTOBS=YES`。也就是说，如果你设置\
    \ `REUSE=YES`，SAS 会自动设置 `POINTOBS=NO`。\n\nTAPE 引擎支持 `COMPRESS=` 数据集选项，但该引擎不支持\
    \ `COMPRESS` 系统选项。\n\nXPORT 引擎不支持压缩。\n\n# 另另\n\n数据集选项：\n\n- 第 46 页上的“POINTOBS=\
    \ 数据集选项”\n- 第 53 页上的“REUSE= 数据集选项”\n\n语句：\n\n- 《SAS 语句参考》中的“LIBNAME 语句”\n\n系统选项：\n\
    \n- 《SAS 系统选项：参考》中的“COMPRESS= 系统选项”\n- 《SAS 系统选项：参考》中的“REUSE= 系统选项”\n\n其他：\n\n\
    - 《SAS 语言参考：概念》第 26 章中的“压缩数据文件”\n\n# DLMGACTION= 数据集选项\n\n指定当 SAS 库中的数据集被检测为损坏时要采取的动作。\n\
    \n有效于：DATA 步和 PROC 步\n\n类别：数据集控制\n\n# 语法\n\nDLMGACTION=FAIL | ABORT | REPAIR |\
    \ NOINDEX | PROMPT\n\n# 语法说明\n\nFAIL 停止步骤，立即向日志发布错误消息。这是批模式下的默认值。\n\nAbort 终止步骤，向日志发布错误消息并终止\
    \ SAS 会话。\n\nREPAIR 自动修复并重建索引和完整性约束，除非数据被截断。你在 `PROC DATASETS` 中使用 `REPAIR` 语句来恢复截断的数据集。它向日志发布警告消息。这是交互模式下的默认值。\n\
    \nNOINDEX 在没有索引和完整性约束的情况下自动修复数据文件，删除索引文件，更新数据文件以反映禁用的索引和完整性约束，并将数据文件限制为仅输入模式打开。SAS\
    \ 日志中写入警告，指示你执行 `PROC DATASETS` 语句的 `REBUILD` 语句来修正或删除禁用的索引和完整性约束。\n\n参见：\n第 15\
    \ 页上的“DLMGACTION= 数据集选项”\n《SAS 语言参考：概念》第 36 章中的“恢复禁用的索引和完整性约束”\n\nPROMPT 显示一个对话框，要求你选择\
    \ FAIL、ABORT、REPAIR 或 INDEX 动作。\n\n# DROP= 数据集选项\n\n对于输入数据集，从处理中排除指定的变量；对于输出数据集，排除将指定的变量写入数据集。\n\
    \n- 有效于：DATA 步和 PROC 步\n\n类别：变量控制\n\n# 语法\n\n```\nDROP=variable-1 <...variable-n>\n\
    ```\n\n# 语法说明\n\nvariable-1 <...variable-n>\n列出一个或多个变量名。你可以以 SAS 允许的任何形式列出变量。\n\
    \n# 详情\n\n如果该选项与输入数据集关联，则这些变量将不可处理。如果 `DROP=` 数据集选项与输出数据集关联，SAS 不将这些变量写入输出数据集，但它们可用于处理。\n\
    \n# 比较\n\n- `DROP` 数据集选项与 `DROP` 语句有以下不同：\n- 在 DATA 步中，`DROP=` 数据集选项可以同时应用于输入和输出数据集。`DROP`\
    \ 语句仅适用于输出数据集。\n- 在 DATA 步中，当你创建多个输出数据集时，使用 `DROP=` 数据选项可以将不同的变量写入不同的数据集。`DROP`\
    \ 语句适用于所有输出数据集。\n- 在 PROC 步中，你只能使用 `DROP=` 数据集选项，不能使用 `DROP` 语句。\n- `KEEP=` 数据集选项指定包含在处理中或写入输出数据集的变量列表。\n\
    \n# 示例\n\n# 示例 1：从输入中排除变量\n\n在此示例中，变量 SALARY 和 GENDER 不包含在处理中，且也不会被写入任何输出数据集：\n\
    \n```\ndata plan2;\n  set payroll(drop=salary gender);\n  if hired='oljan98'd\
    \ then output plan;\n  else output plan2;\n\nrun;\n```\n\n你不能在 DATA 步的任何逻辑中使用\
    \ SALARY 或 GENDER，因为 `DROP=` 阻止了 `SET` 语句从 PAYROLL 中读取它们。\n\n# 示例 2：处理变量但不将其写入数据集\n\
    \n在此示例中，SALARY 和 GENDER 没有写入 PLAN2，但它们被写入了 PLAN：\n\n```\ndata plan2(drop=salary\
    \ gender);\n  set payroll;\n  if hired='oljan98'd then output plan;\n  else output\
    \ plan2;\n\nrun;\n```\n\n# 另另\n\n数据集选项：\n\n- 第 30 页上的“KEEP= 数据集选项”\n\n语句：\n\n\
    - 《SAS 语句参考》中的“DROP 语句”\n\n# ENCRYPT= 数据集选项\n\n指定是否加密输出 数据集。\n\n有效于：DATA 步和 PROC\
    \ 步\n\n类别：数据集控制\n\n限制：仅用于输出数据集。\n\n# 语法\n\n```\nENCRYPT=YES|NO\n```\n\n# 语法说明\n\
    \nYES 加密文件。此加密使用密码。指定 ENCRYPT=YES 的同时，必须指定 `READ=` 或 `PW=` 数据集选项。由于加密方法使用密码，你必须重新创建数据集才能更改密码。\n\
    \n> 注意：\n记录使用 ENCRYPT=YES 的密码。如果你忘记了密码，在没有 SAS 帮助的情况下无法重置。该过程耗时且耗资源。\n\nNO 不加密文件。\n\
    \n# 详情\n\n使用 `ENCRYPT=YES` 时，适用以下规则：\n\n- 你无法加密 SAS 视图，因为它们不包含数据。\n- 要拷贝加密文件，输出引擎必须支持该加密。否则，数据文件\
    \ own复制。\n- 加密文件仅在 SAS 6.11 或更高版本有效。\n- 如果数据集被加密，则所有相关的索引也会加密。\n- 加密所需的 CPU 资源与压缩相似。\n\
    - 你无法对 SAS 私有加密文件使用 PROC PORT。\n\n# 示例：使用 ENCRYPT=YES 选项\n\n此示例使用加密创建一个加密 SAS\
    \ 数据集：\n\n```\ndata salary(encrypt=yes read=green);\n  input name $ ysal bonuspct;\n\
    datalines\nMuriel 34567 3.2\nBjorn 74644 2.5\nPreda 38755 4.1\nBenny 29855 3.5\n\
    Agnetha 70998 4.1\n;\n```\n\n要使用此数据集，请指定读取密码：\nproc contents data=salary(read=green);\n\
    run;\n```\n\n# 另另\n\n数据集选项：\n\n- 第 8 页上的“ALTER= 数据集选项”\n- 第 47 页上的“PW= 数据集选项”\n\
    - 第 48 页上的“READ= 数据集选项”\n\n"
