    \n- \"File Protection\" in Chapter 34 of SAS Language Reference: Concepts\n- \"\
    Manipulating Passwords\" in Chapter 15 of Base SAS Procedures Guide\n\n# RENAME=\
    \ Data Set Option\n\nChanges the name of a variable.\n\n**Valid in:** DATA step\
