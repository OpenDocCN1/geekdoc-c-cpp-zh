    ## EXTENDBOCOUNTER= Data Set Option


    Specifies whether to extend the maximum observation count in a new output SAS
    data file.


    - Valid in: DATA step and PROC steps

    Category: Data Set Control

    Alias: EOC=

    Default: NO

    Restrictions: Use with output data files only.

    Use with the BASE engine only.


    ## Syntax


    EXTENDBOCOUNTER=NO | YES


    ## Syntax Description


    NO

    specifies that the maximum observation count in a newly created SAS data file
    is determined by the long integer size for the operating environment. In operating
    environments with a 32-bit long integer, the maximum number is 2³¹−1 or approximately
    two billion observations (2,147,483,647). In operating environments with a 64-bit
    long integer, the number is 2⁶¹−1 or approximately 9.2 quintillion.


    YES

    requests an enhanced file format in a newly created SAS data file that counts
    observations beyond the 32-bit long limitation. For a SAS data file that is created
    for an operating environment that stores the number of observations with a 32-bit
    long integer, the data file behaves like a 64-bit file with respect to counters.


    - Restrictions:

    A SAS data file that is created with EXTENDBOCOUNTER=YES is incompatible with
    releases before SAS 9.3.

    Specify EXTENDBOCOUNTER=YES only for an output SAS data file whose internal data
    representation stores the observation count as a 32-bit long integer.

    For a table that lists the operating environments and OUTREP=data representation
    values that are appropriate with EXTENDBOCOUNTER=YES, see “When to Use the EXTENDBOCOUNTER=YES
    Option” in Chapter 26 of SAS Language Reference: Concepts.


    ## See Also


    "Extending the Observation Count in a SAS Data File” in Chapter 26 of SAS Language
    Reference: Concepts


    ## FILECLOSE= Data Set Option


    Specifies whether a tape is positioned when a SAS data set is closed.


    ## DATA step and PROC steps


    Valid in: DATA step and PROC steps

    Category: Miscellaneous

    Restriction:


    See: FILECLOSE= Data Set Option in the documentation UNIX operating environment.


    CAUTION: The option values are not recognized by all operating environments. Additional
    values are available on some operating environments. The appropriate sections
    of the SAS documentation for your operating environment for more information about
    using SAS libraries are stored on tape.


    ## Syntax


    ```

    FILECLOSE=DIS | LEAVE | REREAD | REWIND

    ```


    ## Syntax Description


    DIS

    positions the tape volume according to the disposition specified in the operating
    environment''s control language.


    LEAVE

    positions the tape at the end of the file that was just processed. Use FILECLOSE=LEAVE
    if you are not repeatedly accessing the same files in a SAS program you are accessing
    one or more subsequent SAS files on the same tape.


    REREAD

    positions the tape volume at the beginning of the file that was just processed.
    Use FILECLOSE=REREAD if you are accessing the same SAS data set on tape several
    times in a SAS program.


    REWIND

    rewinds the tape volume to the beginning. Use FILECLOSE=REWIND if you are accessing
    one or more previous SAS files on the same tape, but you are not repeatedly accessing
    the same files in a SAS program.


    ## FIRSTSTOBS= Data Set Option


    Specifies the first observation that SAS processes in a SAS data set.


    Valid in: DATA step and PROC steps

    Category: Observation Control

    Restrictions: Valid for input (read) processing only.

    Cannot use with PROC SQL views.


    ## Syntax


    ```

    FIRSTSTOBS= n | nK | nM | nG | hexX | MIN | MAX

    ```


    ## Syntax Description


    n | nK | nM | nG

    specifies the number of the first observation to process in multiples of 1 (bytes);
    1,024 (kilobytes); 1,048,576 (megabytes); or 1,073,741,824 (gigabytes). For example,
    a value of 8 specifies the 8th observation, and a value of 3k


    hex

    specifies the number of the first observation to process as a hexadecimal value.
    You specify the value beginning with a number (0-9), followed by an X. example,
    the value 2dx sets the 45th observation as the first observation to process.


    MIN

    sets the number of the first observation to process to 1. This is the default.


    MAX

    sets the number of the first observation to process to the maximum number of observations
    in the data set, up to the largest eight-byte, signed integer, which is 2⁶-1,
    or approximately 9.2 quintillion observations.


    ## Details


    The FIRSTOBS= data set option affects a single, existing SAS data set. Use the
    FIRSTOBS= system option to affect all steps for the duration of your current SAS
    session.


    FIRSTOBS= is valid for input (read) processing only. Specifying FIRSTOBS= is not
    valid for output or processing processing.


    You can apply FIRSTOBS= processing to WHERE processing. For more information,
    “Processing a Segment of Data That Is Conditionally Selected” in Chapter 11 of
    SAS Language Reference: Concepts.


    ## Comparisons


    - The FIRSTOBS= data set option overrides the FIRSTOBS= system option for the
    individual data set.

    - While the FIRSTOBS= data set option specifies a starting point for processing,
    the OBS= data set option specifies an ending point. The two options are often
    used together to define a range of observations to be processed.

    - When external files are read, the FIRSTOBS= option in the INFILE statement specifies
    which record to read first.


    ## Example: Example


    This PROC step prints the data set STUDY beginning with observation 20:


    ```

    proc data=study(firstobs=20);

    run;

    ```


    This SET statement uses both FIRSTOBS= and OBS= to read-only observations 5 through
    10 from the data set STUDY. Data set NEW contains six observations.


    ```

    data new;

    set study(firstobs=5 obs=10);

    run;

    ```


    ```

    proc print data=new;

    run;

    ```


    ## See Also


    Data Set Options:


    - “OBS= Data Set Option” on page 34


    Statements:


    - “INFILE Statement” in SAS Statements: Reference

    - “WHERE Statement” in SAS Statements: Reference


    System Options:


    - “FIRSTOBS= System Option” in SAS System Options: Reference


    ## GENMAX= Data Set Options


    Requests generation for a new data set, modifies the number of generations for
    an existing data set, and specifies the maximum number of versions.


    **Valid in:** DATA step and PROC steps


    **Category:** Data Set Control


    **Restriction:** Use with output data sets only.


    ## Syntax


    ```

    GENMAX=number-of-appended-generations

    ```


    ## Syntax Description


    **number-of-generations**

    requests for a data set and specifies the maximum number of versions to maintain.
    The value can be from 0 to 1000. The default is GENMAX=0, which means that no
    generation data sets are requested.


    ## Details


    You use GENMAX= to request generations for a new data set and for existing data.
    The first time the data set is replaced, SAS keeps the replaced version and appends
    a four-character version number to its member name, which includes # and a three-digit
    number. For example, for a data set named A, a historical version would be A#001.


    After generations of a data set are requested, the member name is limited to 28
    characters (rather than 32). The last four characters are reserved for the appended
    version number. When the GENMAX= data set option is set to 0, the member name
    can be up to 32 characters.


    If you reduce the number of generations for an existing data set, SAS deletes
    the oldest versions above the limit.


    ## Examples


    Example 1: Requesting Generations When You Create a Data Set


    This example shows how to request generations for a new data set. The DATA step
    creates a data set named WORK.A can have as many as 10 generations (one current
    version and nine historical versions):


    ```

    data a(genmax=10);

    x=1;

    output;

    run;

    ```


    Example 2: Modifying the Number of Generations on an Existing Data Set


    This example shows how to change the number of generations on the data set MYLIB.A
    to 4:


    ```

    proc datasets lib=mylib;

    modify a(genmax=4);

    run;

    ```


    ## See Also


    Data Set Option:


    - “GENNUM= Data Set Option” on page 23


    Other:


    - “Understanding Generation Data Sets” in Chapter 26 of SAS Language Reference:
    Concepts


