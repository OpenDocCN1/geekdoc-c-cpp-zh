    - **类别：** 用户控制 SAS 索引的使用

    - **限制：** 仅适用于输入数据集


    与 IDXNAME= 数据集选项互斥


    ## 语法


    ```

    IDXWHERE=YES | NO

    ```


    ## 语法说明


    YES 指定 SAS 选择索引来优化 WHERE 表达式，并忽略顺序搜索更具资源效率的可能性。


    NO 指定 SAS 忽略所有索引，并通过顺序搜索满足 WHERE 表达式条件。


    注意：无法使用 IDXWHERE= 来覆盖。


