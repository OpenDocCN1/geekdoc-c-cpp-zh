- md: "\n# Example 2: Using a Spill File for a Large Number of Small BY Groups\n\n\
    This example creates a DATA step that generates a large amount of random data\
    \ and uses the UNIVARIATE procedure with a BY statement. This example illustrates\
    \ the effects of SPILL= with a large number of small BY groups.\n\nWith SPILL=YES,\
    \ all observations that are requested from the DATA step are written to the spill\
    \ file. With SPILL=NO, only the observations that are in the current BY group\
    \ are written to the spill file. The information messages that are produced by\
    \ this example show that the size of the spill file is reduced with SPILL=NO.\
    \ With small BY groups, this results in a large disk space savings.\n\n```\noptions\
    \ msglevel=1;\ndata vw_many_small / view=vw_many_small;\ndrop i;\ndo i = 1 to\
    \ 100000;\n  do i = 1 to 5;\n    r = ranuni(4);\n    output;\n  end;\nend;\nrun;\n\
    proc univariate data=vw_many_small (spill=yes) noprint;\nvar r;\nby byval;\nrun;\n\
    proc univariate data=vw_many_small (spill=no) noprint;\nvar r;\nby byval;\nrun;\n\
    ```\n\n# Log 2.2 SAS Log Output\n\n```\n1 options msglevel=i;\n2 data vw_many_small\
