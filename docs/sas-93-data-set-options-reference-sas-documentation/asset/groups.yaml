    许多 SAS 语句和其他语言元素都会引用 SAS 库和外部文件。您可以选择通过逻辑名称（库引用 libref 或文件引用 fileref）或使用引号括起的物理文件名来建立引用。如果您使用逻辑名称，通常可以选择使用
    SAS 语句（LIBNAME 或 FILENAME）或操作环境的控制语言来建立关联。有多种方法可以引用 SAS 库和外部文件，其中某些方法取决于您所在的操作环境。


    在使用外部文件的示例中，SAS 文档使用了斜体短语 *file-specification*（文件规格说明）。在使用 SAS 库的示例中，SAS 文档使用了斜体短语
    *SAS-library*（SAS 库）。注意 *SAS-library* 用引号括起：


    ```

    infile file-specification obs = 100;

    libname libref ''SAS-library'';

    ```


