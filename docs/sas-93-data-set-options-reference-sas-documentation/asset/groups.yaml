    In DATA steps, KEEP= data set option can apply to both input and output data sets.
    The KEEP statement applies only to output data sets.


    In DATA steps, when you create multiple output data sets, use the KEEP= data set
    option to write different variables to different data sets. The KEEP statement
    applies to all output data sets.


    In PROC steps, you can use only the KEEP= data set option, not the KEEP statement.


    The DROP= data set option specifies variables to omit during processing or to
    omit from the output data set.


