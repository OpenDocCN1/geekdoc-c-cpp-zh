  - '[PAGE 15]


    # Syntax


    Specify a data set option in parentheses after a SAS data set name. To specify
    several data set options, separate them with spaces.

    These examples show data set options in SAS statements:


    ```

    (option-i=value-<option-n=value-n>)

    ```


    These examples show data set options in SAS statements:


    +   - data scores (keep=team game1 game3);

    - data mydata (index=(b k) label=label for data set'' drop=p read=secret);

    - data new (drop=n index=combo=(xl1 a20 b1 b50)));

    - data ixdup2 (compress= index=(ok2 ssn/unique ok3);

    - proc print data (drop=year);

    - set old (rename=(date=Start_Date));


    # Using Data Set Options


    # Using Data Set Options with Input or Output SAS Data Sets


    Most SAS data options can apply to either input or output SAS data sets in DATA
    steps or procedure (PROC) steps. If a data set is associated with an input data
    set, the action applies to the data set that is being read. If the option appears
    in the DATA statement or after an output data set specification in a PROC step,
    SAS applies the action to the output data set. In the DATA step, data set options
    for output data sets may be present in the DATA set statement, not in any OUTPUT
    statements


    Some data options, such as COMPRESS =, are meaningful only when you create a SAS
    data set because they set attributes that exist for the duration of the data set.
    To change or cancel most data set options, you must re-create the data set. You
    can change other options (such as PW= and LABEL =) with PROC DATASETS. For more
    information, see Chapter 15, "DATASETS Procedure" in Base SAS Procedures.


    When data set options appear on both input and output data sets in the same DATA
    or PROC step, SAS first applies data set options to input data sets. Then SAS
    evaluates programming statements or applies data set options to output data sets.
    Likewise, statements specified for the data set being created are applied after
    programming statements. For example, when using the RENAME= data set option, the
    new names are not associated with the variables until the DATA step.


    In some instances, data set options conflict when they are used in the same statement.
    For example, you cannot specify both DROP= and KEEP= data options for the same
    variable in the same statement. Timing can be an issue in some cases. For example,
    if using KEEP= and RENAME= on a data set specified in the SET statement, SAS processes
    KEEP= before the data set is read. The new names specified in RENAME= apply to
    the programming statements that follow the SET statement.


    *'
  - '[PAGE 16]


    Data Set Options Documented in Other SAS Publications 3


    # How Data Set Options Interact with System Options


    Many system options and data set options share the same name and have the same
    function. System options remain in effect for all DATA and PROC steps in a SAS
    job or session.


    The data set option overrides the system option for the data set in the step in
    which it appears. In this case, the OBS= system option in the OPTIONS statement
    specifies that only the first 100 observations are processed from any data set
    within the SAS job. The OBS= data set option in the SET statement, however, overrides
    the system option for data set TWO and specifies that only the first five observations
    are read from data TWO. The PROC PRINT step prints the data set FINAL. This data
    set contains the first 5 observations from data set TWO, followed by the first
    100 observations from data set THREE.


    ```

    options obs=100;


    data final;

    set two(obs=5) three;

    run;


    proc print data=final;

    run;

    ```


    # Data Set Options Documented in Other SAS Publications


    In addition to data set options documented in SAS Language Reference: Dictionary,
    data set options are also documented in the following publications:


    +   * SAS Companion for Windows

    * SAS Companion for UNIX Environments

    * SAS Companion for z/OS

    * SAS National Support: Reference Guide

    * SAS Scalable Performance Data Engine: Reference

    * SAS/ACCESS for Relational Databases: References'
