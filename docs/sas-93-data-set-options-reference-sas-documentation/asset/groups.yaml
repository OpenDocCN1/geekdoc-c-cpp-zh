    # DLMGACTION= Data Set Option


    Specifies the action to take when a data set in a SAS library is detected as damaged.


    Valid in: DATA step and PROC steps


    Category: Data Set Control


    # Syntax


    DLMGACTION=FAIL | ABORT | REPAIR | NOINDEX | PROMPT


    # Syntax Description


    FAIL stops the step, issues an error message to the log immediately. This is the
    default for batch mode.


    Abort terminates the step, issues an error message to the log, and terminates
    the SAS session.


    REPAIR automatically repairs and rebuilds indexes and integrity constraints, unless
    the data is truncated. You use the REPAIR statement in PROC DATASETS to restore
    a truncated data set. It issues a warning message to the log. This is the default
    for interactive mode.


    NOINDEX automatically repairs the data file without the indexes and integrity
    constraints, deletes the index file, updates the data file to reflect the disabled
    indexes and integrity constraints, and limits the data file to be opened only
    in INPUT mode. A warning is written to the SAS log instructing you to execute
    the PROC DATASETS statement


    REBUILD statement to correct or delete the disabled indexes and integrity constraints.'
