    You can also select observations that are written to an output data set. In general,
    selecting observations at the point of input is more efficient than selecting
    them at the point of input. However, there are some cases when selecting observations
    at the point of input is not practical or not possible.


    +   - You can apply OBS= and FIRSTOBS= to WHERE processing. For more information
    see "Processing a Segment of Data That Is Conditionally Selected" in Chapter 11
    of SAS Language Reference: Concepts."


    +   - You cannot use the WHERE data set option with the POINT= option in the SET
    and MODIFY statements.


    +   - If you use both the WHERE data set option and the WHERE statement in the
    same DATA step, SAS ignores the WHERE statement for data sets with the WHERE=
    However, you can use the WHERE data set option with the WHERE command in SAS/FSP
    software.


    Note: Using indexed data sets can improve performance significantly when you are
    using WHERE expressions to access a subset of the observations in a SAS data set.
    See "Understanding SAS Indexes" in Chapter 26 of SAS Language Reference: Concepts
    for a complete discussion of WHERE expression processing with indexed data sets
    and a list of guidelines to consider indexing your SAS data sets.


    # Comparisons


    +   - The WHERE statement applies to all input data sets, whereas the WHERE= data
    set option selects observations only from the data set for which it is specified.


    +   - Do not confuse the purpose of the WHERE= data set option. The DROP= and
    KEEP= data set option selects variables for processing, while the WHERE= data
    set option selects observations.


    # Examples


    # ### Example 1: Selecting Observations from an Input Data Set


    This example uses the WHERE= data set option to subset the SALES data set as it
    is read into another data set:


    ```

    data whizmo;

    set sales(where=(product=''whizmo''));

    ```


    ```

    run;

    ```


    # ### Example 2: Selecting Observations from an Output Data Set


    This example uses the WHERE= data set option to subset the SALES output data set:


    ```

    data whizmo(where=(product=''whizmo''));

    set sales;

    ```


    ```

    run;

    ```


    # See Also


    +   - "WHERE Statement" in SAS Statements: Reference


    +   - WHERE-Expression Processing'
