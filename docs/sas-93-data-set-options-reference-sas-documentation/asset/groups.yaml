    # IDXWHERE= Data Set Option


    Specifies whether SAS uses an index search or a sequential search to match the
    conditions of a WHERE expression.


    +   - **Valid in:** DATA step and PROC steps


    +   - **Category:** User Control of SAS Index Usage


    +   - **Restrictions:** Use with input data sets only.


    Mutually exclusive with IDXNAME= data set option


    # Syntax


    ```

    IDXWHERE=YES | NO

    ```


    # Syntax Description


    YES tells SAS to choose the index to optimize a WHERE expression, and to disregard
    the possibility that a sequential search of the data set might be more resource-efficient.


    NO tells SAS to ignore all indexes and satisfy the conditions of a WHERE expression
    with a sequential search of the data set.


    Note: You cannot use IDXWHERE= to override the use of an index to process a statement.


    # Details


    By default, to satisfy the conditions of a WHERE expression for an indexed SAS
    data set, SAS decides whether to use an index or to read the data sequentially.
    The software estimates the relative efficiency and chooses the method that is
    more efficient.


    You might need to override the software''s decision by specifying the IDXWHERE=
    data set option because the decision is based on general rules that may occasionally
    not'
