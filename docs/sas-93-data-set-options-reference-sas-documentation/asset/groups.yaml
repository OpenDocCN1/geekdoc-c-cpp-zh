    | ALPHA_VMS_64 | | OpenVMS Alpha |

    | HP_IA64 | HP_ITANIUM | HP-UX for the Itanium Processor Family Architecture |

    | HP_UX_32 | HP_UX | HP-UX for PA-RISC |

    | HP_UX_64 | | HP-UX for PA-RISC, 64-bit |

    | INTEL_ABI | | ABI for Intel architecture |'
