    | :--- | :--- | :--- |

    | Data Set Control | ALTER= Data Set Option (p. 8) | Assigns an ALTER password
    to a SAS file that prevents users from replacing or deleting the file, and enables
    access to a read-protected file. |

    | | BUFNO= Data Set Option (p. 9) | Specifies the number of buffers to be allocated
    for processing a data set. |

    | | BUFSIZE= Data Set Option (p. 11) | Specifies the size of a permanent buffer
    for an output data set. |

    | | CNTLLEV= Data Set Option (p. 12) | Specifies the level of shared access to
    a data set. |

    | | COMPRESS= Data Set Option (p. 13) | Specifies how observations are compressed
    in a new output data set. |

    | | LDDMACSCOUNTER= Data Set Option (p. 15) | Specifies the action to take when
    a data set in a SAS library is detected as damaged. |

    | | ENCRYPT= Data Set Option (p. 17) | Specifies whether to encrypt an output
    data set. |

    | | EXTENDOBDSCOUNTER= Data Set Option (p. 19) | Specifies whether to extend the
    observation count in a new output data file. |

    | | GENMAX= Data Set Option (p. 22) | Requests generations for a new data set,
    modifies the number of generations for an existing data set, and specifies the
    maximum number of versions. |

    | | GENNUM= Data Set Option (p. 23) | Specifies a particular generation of a data
    set. |

    | | INDEX= Data Set Option (p. 27) | Defines an index for a new output data set.
    |

    | | LABEL= Data Set Option (p. 31) | Specifies a label for a data set. |


    | Category | Language elements | Description |

    | :--- | :--- | :--- |

    | | OBSBUF= Data Set Option (p. 32) | Determines the size of the view buffer for
    processing a DATA step view. |

    | | OUTREP= Data Set Option (p. 44) | Specifies the data representation for the
    output data set. |

    | | PW= Data Set Option (p. 47) | Assigns a READ, WRITE, ALTER password to a SAS
    file, and enables access to a password-protected file. |

    | | PWREQ= Data Set Option (p. 48) | Specifies whether to display a dialog box
    to enter a data set password. |

    | | READ= Data Set Option (p. 48) | Assigns a READ password to a SAS file that
    prevents users from reading the file, unless they enter the password. |

    | | REMPTY= Data Set Option (p. 51) | Specifies whether an empty data set can
