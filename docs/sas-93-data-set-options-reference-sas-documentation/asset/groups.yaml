    \ < . old-name-n=new-name-n)\n```\n\n# Syntax Description\n\nold-name\n\nthe variable\
    \ that you want to rename.\n\nnew-name\n\nthe new name of the variable. It must\
    \ be a valid SAS name.\n\n# Details\n\nIf you use the RENAME= data set option\
    \ when you create a data set, the new variable is named in the output data set.\
    \ If you use RENAME= on an input data set, the new name is used in DATA step programming\
    \ statements.\n\nIf you use RENAME= on an input data set that is used in a SAS\
    \ procedure, SAS changes the name of the variable in that procedure. If you use\
    \ RENAME= with WHERE processing as a WHERE statement or a WHERE= data set option,\
    \ the new name is applied before the data is processed. You must use the new name\
    \ in the WHERE expression.\n\nIf you use RENAME= in the same DATA step with the\
    \ DROP= or the KEEP= data set option, the DROP= and the KEEP= data set options\
    \ are applied before RENAME=. You must use the old name in the DROP= and KEEP=\
    \ data set options. You cannot drop and rename the variable in the same statement.\n\
    \nNote: The RENAME= data set option has an effect only on data sets that are opened\
    \ in output mode.\n\n# Comparisons\n\n- The RENAME= data set option differs from\
    \ the RENAME statement in the following ways:\n- The RENAME= data set option can\
    \ be used in PROC steps and the RENAME statement cannot.\n- The RENAME statement\
    \ applies to all output data sets. If you want to rename different variables in\
    \ different data sets, you must use the RENAME= data set option.\n- To rename\
    \ variables before processing begins, you must use a RENAME= set option on the\
    \ input data set or data sets.\n- Use the RENAME statement or the RENAME= data\
    \ set option when program logic requires that you rename variables as two input\
    \ data sets that have variables with the same name. To rename variables as a file\
    \ management task, use the DATASETS procedure.\n\n# Examples\n\nExample 1: Renaming\
    \ a Variable at Time of Output\nThis example uses RENAME= in the DATA statement\
    \ to show that the variable is renamed at the time it is written to the output\
    \ data set. The variable keeps its original name, X, during the DATA step processing:\n\
    \n```\ndata one;\ninput x y z;\ndatalines;\n24 595 439\n243 343 034\n;\n```\n\n\
    Example 2: Renaming a Variable at Time of Input\nThis example renames variable\
    \ X to a variable named KEYS in the SET statement, which is a rename before DATA\
    \ step processing. KEYS, not X, is the name to use for the variable for DATA step\
    \ processing.\n\n```\ndata three;\n  set one(rename=(x=keys));\n  z=keys+y;\n\
    run;\n```\n\nExample 3: Renaming a Variable for a SAS Procedure with WHERE Processing\n\
    \nThis example renames variable Score1 to a variable named Score2 for the PRINT\
