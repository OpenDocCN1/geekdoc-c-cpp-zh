    # OUTREP= Data Set Option


    Specifies the data representation for the output SAS data set.


    **Valid in:** DATA step and PROC steps


    **Category:** Data Set Control


    **See:** OUTREP= data set option in the SAS Companion for z/OS.


    # Syntax


    ```

    OUTREP=format

    ```


    # Syntax Description


    By default, SAS creates a new data set using the data representation of the CPU
    that is running SAS. Selecting the OUTREP= option enables you to create a SAS
    data set with a different representation. For example, in a UNIX environment,
    you can create a SAS data set that uses a Windows data representation. For more
    information about compatibility and data representation, see “Processing Data
    Using Cross-Environment Data Access (CEDA)” in Chapter 32 of SAS Language Reference:
    Concepts.


    Values for OUTREP= are listed in the following table:


    **Table 2.1** Data Representation Values for OUTREP= Option


