    ## IDXNAME= Data Set Option


    - “Understanding Generation Data Sets” in Chapter 26 of SAS Language Reference:

    - Chapter 15, “DATASETS Procedure” in Base SAS Procedures Guide


    IDXNAME= Data Set Option


    Directs SAS to use a specific index to match the conditions of a WHERE expression.


    **Valid in:** DATA step and PROC steps

    **Category:** User Control of SAS Index Usage

    **Restrictions:** Use with input data sets only

    Mutually exclusive with IDXNAME= data set option


    ## Syntax


    ```

    IDXNAME=index-name

    ```


    ## Syntax Description


    - *index-name* specifies the name (up to 32 characters) of a simple or composite
    index for the SAS data set. SAS does not attempt to determine whether the specified
    index is the best or whether a sequential search might be more resource efficient.


    **Interaction:** The specification is not a permanent attribute of the data set
    and is valid only for the use of the data set.


    **Tip:** To request that IDXNAME= usage be noted in the SAS log, specify the system
    MSGLEVEL=I.


    ## Details


    By default, to satisfy the conditions of a WHERE expression for an indexed SAS
    data set, SAS identifies zero or more candidate indexes that could be used to
    optimize the WHERE expression. From the list of candidate indexes, SAS determines
    the one that provides the best performance, or rejects all of the indexes if a
    sequential search is expected to be more efficient.


    Because SAS selects may not always provide the best optimization, you can direct
    SAS to use one of the candidate indexes by specifying the IDXNAME= data set option.
    If you specify an index that does not identify as a candidate index, IDXNAME=
    does not process the request. That is, IDXNAME= does not allow you to specify
    an index that would produce incorrect results.


    ## Comparisons


    IDXNAME= enables you to override the SAS decision about whether to use an index.


    ## Example: Example


    This example uses the IDXNAME= data set option in order to direct SAS to use a
    specific index to optimize the WHERE expression. SAS disregards the possibility
    that a sequential search of the data set might be more resource efficient and
    does not attempt to determine whether the specified index is the best one. (Note
    that the EMPNUM index was not created with the MISS option.)


    ```

    data mydata.empnew;

    set mydata.employee (idxname=empnum);

    where empnum < 2000;

    run;

    ```


    ## See Also


    Data Set Option:


    - “IDXWHERE= Data Set Option” on page 26


    Other:


    - “Using an Index for WHERE Processing” in Chapter 26 of SAS Language Reference:
    Concepts


    ## IDXWHERE= Data Set Option


    Specifies whether SAS uses an index search or a sequential search to match the
    conditions of a WHERE expression.


    - **Valid in:** DATA step and PROC steps

    - **Category:** User Control of SAS Index Usage

    - **Restrictions:** Use with input data sets only.


    Mutually exclusive with IDXNAME= data set option


    ## Syntax


    ```

    IDXWHERE=YES | NO

    ```


    ## Syntax Description


    YES tells SAS to choose the index to optimize a WHERE expression, and to disregard
    the possibility that a sequential search of the data set might be more resource-efficient.


    NO tells SAS to ignore all indexes and satisfy the conditions of a WHERE expression
    with a sequential search of the data set.


    Note: You cannot use IDXWHERE= to override the use of.


    ## Details


    By default, to satisfy the conditions of a WHERE expression for an indexed SAS
    data set, SAS identifies zero or more candidate indexes that could be used to
    optimize the WHERE expression. From the list of candidate indexes, SAS determines
    the one that provides the best performance, or rejects all of the indexes if a
    sequential search is expected to be more efficient.


