    # DROP= Data Set Option


    For an input data set, excludes the specified variables from processing; for an
    output data set, excludes

    t specified variables from being writing to the data set.


    +   Valid in: DATA step and PROC steps


    +   Category: Variable Control


    # Syntax


    ```

    DROP=variable-1 <...variable-n>

    ```


    # Syntax Description


    variable-1 <...variable-n>

    lists one or more variable names. You can list the variables in any form that
    SAS

    allows.


    # Details


    If the option is associated with an input data set, the variables are not available
    for

    processing. If the DROP= data set option is associated with an output data set,
    SAS does

    not write the variables to the output data set, but they are available for processing.


    # Comparisons


    +   The DROP data set option differs from the DROP statement in these ways:

    - In DATA steps, the DROP= data set option can apply to both input and output

    data sets. The DROP statement applies only to output data sets.

    - In DATA steps, when you create multiple output data sets, use the DROP= data

    set option to write different variables to different data sets. The DROP statement

    lies to all output data sets.

    - In PROC steps, you can use only the DROP= data set option, not the DROP

    statement.

    - The KEEP= data set option specifies a list of variables to be included in processing

    or to be written to the output data set.'
