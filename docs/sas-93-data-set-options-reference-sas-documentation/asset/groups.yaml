  - "[PAGE 27]\n\n# YES | CHAR\n\nspecifies that the observations in a newly created\
    \ SAS data set are compressed\n(variable-length records) by SAS using RLE (Run\
    \ Length Encoding). RLE\ncompresses observations by reducing repeated consecutive\
    \ characters (including\nblanks) to two-byte or three-byte representations.\n\n\
    Alias: ON\n\n# BINARY\n\nspecifies that the observations in a newly created SAS\
    \ data set are compressed\n(variable-length records) by SAS using RDC (Ross Data\
    \ Compression). RDC\ncombines run-length encoding and sliding-window compression\
    \ to compress the file.\n\nNote: This method is effective for compressing medium\
    \ to large (several\nhundred bytes or larger) blocks of binary data (numeric variables).\
    \ Because the\ncompression function operates on a single record at a time, the\
    \ record\nneeds to be several hundred bytes or larger for effective compression.\n\
    \n# Details\n\nCompressing a file is a process that reduces the number of bytes\
    \ used to represent\\each observation. Advantages of compressing a file include\
    \ reduced storage\nrequirements for the file and fewer I/O operations to read\
    \ or write the data\nduring processing. However, more CPU resources are required\
    \ to read a compressed file\n(because of the overhead of compressing each observation).\
    \ There are situations\nwhere the resulting file size might increase rather than\
    \ decrease.\n\nUse the COMPRESS= data set option to compress an individual file.\
    \ Specify the option\n output data sets only—that is, data sets named in the DATA\
    \ statement of DATA\nor in the OUT= option= of a SAS procedure. The COMPRESS=\
    \ data set option\nwhen you are creating a SAS file (member type DATA). You cannot\
    \ compress\nSAS views, because they contain no data.\n\nAfter a file is compressed,\
    \ the setting is a permanent attribute of the file, which means\nto change the\
    \ setting, you must re-create the file. That is, to compress a file,\nspecify\
    \ COMPRESS=NO for a DATA step that copies the compressed file.\n\n# Comparisons\n\
    \nThe COMPRESS= data set option overrides the COMPRESS= option in the LIBNAME\n\
    statement and the COMPRESS= system option.\n\nThe data set option POINTOBS=YES,\
    \ which is the default, determines that\ncompressed data set can be processed\
    \ with random access (by observation number)\nrather than sequential access. With\
    \ random access, you can specify an observation\nin the FESIT procedure and the\
    \ POINT= in the SET and MODIFY\nstatements.\n\nWhen you compress a file, you can\
    \ also specify REUSE=YES (as a data\noption or system option) in order to track\
    \ and use space. With REUSE=YES, new\nobservations are inserted in free speed\
    \ when observations are updated or deleted.\nWhen the default REUSE=NO is in effect,\
    \ new observations are appended to the\nexisting file.\n\nPOINTOBS=YES and REUSE=YES\
    \ are mutually exclusive—that is, they cannot be\ntogether. REUSE=YES takes precedence\
    \ over POINTOBS=YES. That is, if you set\nREUSE=YES, SAS automatically sets POINTOBS=NO.\n\
    \nThe TAPE engine supports the COMPRESS= data set option, but the engine does\
    \ not\nsupport the COMPRESS system option.\n\nThe XPORT engine does not support\
    \ compression."
