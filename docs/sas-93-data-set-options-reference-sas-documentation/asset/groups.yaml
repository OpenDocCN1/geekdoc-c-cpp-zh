    # SPILL= Data Set Option


    Specifies whether to create a spill file for non-sequential processing of a DATA
    step.


    | Valid in: DATA step and PROC steps |

    | Category: Data Set Control |

    | Restriction: Valid only for a DATA step view |


    # Syntax


    SPILL=YES | NO


    # Syntax Description


    YES

    creates a spill file for non-sequential processing of a DATA step view. This is
    the default.


    Interaction: A spill file is never created for sequential processing of a DATA
    step view.


    NO

    does not create a spill file or reduces the size of a spill file.

    Interaction: For direct (random) access


    Note: If you do not have enough disk space to accommodate a resulting spill file
    from a DATA step view that generates a large amount of data, specify SPILL=NO.


    Tip: For SAS procedures that process BY-group data, consider specifying SPILL=NO
    in order to write only the current BY group to the spill file.


    # Details


    When a DATA step is opened for non-sequential processing, a spill file is created
    by default. The spill file contains the observations that are generated by a DATA
    step. Subsequent requests for data read read the observations from the spill file
    rather than'
  - "[PAGE 71]\n\nexecute the DATA step view again. The spill file is a temporary\
    \ file in the WORK library.\n\nNon-sequential processing includes the following\
    \ access methods, which are supported by several SAS statements and procedures.\
    \ How the SPILL= data set option operates with each of the access methods is described\
    \ below:\n\nrandom access\n\nretrieves observations directly either by an observation\
    \ number or the value of one or more variables through an index without reading\
    \ all observations sequentially. Whether SPILL=YES or NO, a spill file is always\
    \ created, because the processing time to restart a DATA step view for each observation\
    \ would be costly.\n\nBY-group access\n\nuses a BY statement to process observations\
    \ that are ordered, grouped, or indexed according to the values of one or more\
    \ variables. SPILL=YES creates a spill file the size of all data that is requested\
    \ from the DATA step view. SPILL=NO writes only the current BY group to the spill\
    \ file. The largest size of the spill file is a size to store the largest BY group.\n\
    \ntwo-pass access\n\nperforms multiple sequential passes through the data. With\
    \ SPILL=NO, no spill file is created. Instead, after the first pass through the\
    \ data, the DATA step view is restarted for each subsequent pass through the data.\
    \ If small amounts of data are returned by the DATA step view for each restart,\
    \ the processing time to restart the view might become significant.\n\n> Note:\
    \ With SPILL=NO, subsequent passes through the data could result in generating\
    \ different data. Some processing might require a spill file; for example, results\
    \ from using random functions and computing values that are based on the current\
    \ time of day could affect the data.\n\n# Examples\n\n# Example 1: Using a Spill\
    \ File for a Small Number of Large BY Groups\n\nThis example creates a DATA step\
    \ view that generates a large amount of random data and uses the UNIVARI procedure\
    \ with a BY statement. The example illustrates the effects of SPILL= with a small\
    \ number of large BY groups.\n\nWith SPILL=YES, all observations that are requested\
    \ from the DATA step view are written to the spill file. With SPILL=NO, only the\
    \ observations that are in the current BY group are written to the spill file.\
    \ The information messages that are produced by this example show that the size\
    \ of the spill file is reduced with SPILL=NO. However, the time to truncate the\
    \ spill file for each BY group might add to the overall processing time for the\
    \ DATA step view.\n\n```\noptions mlevel=i;\ndata vw_few_large / view=vw_large;\n\
    \ drop;\n byval = 'Group A', 'Group B', 'Group C';\n do i = 1 to 500000;\n r =\
    \ ranuni(4);\n output;\n end;\n run;\nproc univariate data=vw_few_large (spill=yes)\
    \ noprint;\n```"
