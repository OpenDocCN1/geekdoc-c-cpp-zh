  trans: "\n\n要设置与其他任何段落都不同的格式，最佳方法是在外部样式表中使用 `class` 选择器。\n\n例如，我们将该类命名为 `special`\
    \ 并使用点号：\n\n```css\np.special {\n  font-size: 18px;\n}\n```\n\n当 HTML 实例中出现 `<p\
    \ class=\"special\">` 段落时，意味着该段落内的文本的字体大小将为 18 像素。\n\n**103**\n\n![](img/index-104_1.jpg)\n\
    \n**专业资格教师 - MARK GILLAN**\n\n# ID 选择器\n\nHTML 元素可以分配一个唯一的 `id`（标识符），从而允许 CSS\
    \ 能够从某种类型或类中提取出单个元素。在 CSS 代码中，元素名后紧跟哈希键 `#`，然后是位于需要格式化的元素 `id` 属性中的型 `id` 值。\n\
    \n例如，假设我们有一个 `id` 为 `\"mgr\"` 的段落，如下：\n\n```html\n<p id=\"mgr\">此段落具有标识符</p>\n\
    ```\n\n这里的示例可能有一个 CSS 声明，将任何包含属性值 `\"mgr\"` 的段落文本字体颜色更改为浅蓝色：\n\n```css\np#mgr\
    \ {\n  color: #369de1;\n}\n```\n\n如果 CSS 选择器中未指定元素类型（在上面的示例中，如果不存在段落的 `'p'`），则任何使用唯一\
    \ `id` 选择器的元素都将应用该格式，无论其类型为何。只要这些元素共享相同的 `id` 属性值，就可以格式化网站上各种类型的元素。同样，如果类选择器没有指定元素，而仅声明了一个点号并后跟类名，则该样式将应用到所述类的任何出现处。\n\
    \n任何名为 `\"center\"` 的类的 CSS 示例：\n\n```css\n.center {\n  text-align: center;\n\
    \  color: red;\n}\n```\n\n**104**\n\n![](img/index-105_1.jpg)\n\n**网页设计**\n\n\
    # 分组选择器\n\n通常情况下，可能有多个元素具有相同的样式，使用长写形式会占用空间并由于为每个具有相同样式的元素编写 CSS 而降低效率。为了尽量减少\
    \ CSS 代码不必要的冗余，建议对选择器进行分组。用逗号分隔每个选择器。\n\n例如，如果标题 1、标题 2、标题 3 需要居中对齐且字体颜色为红色，请尝试分组。与其编写所有的\
    \ CSS 代码：\n\n```css\nh1 {\n  text-align: center;\n  color: red;\n}\nh2 {\n  text-align:\
    \ center;\n  color: red;\n}\nh3 {\n  text-align: center;\n  color: red;\n}\n```\n\
    \n建议使用这段 CSS 代码：\n\n```css\nh1, h2, h3 {\n  text-align: center;\n  color: red;\n\
    }\n```\n\n**105**\n\n![](img/index-106_1.jpg)\n![](img/index-106_2.jpg)\n![](img/index-106_3.jpg)\n\
    \n**专业资格教师 - MARK GILLAN**\n\n# 注意事项与提醒\n\n最好不要以数字开头类或 id，并始终记住 HTML 和 CSS 文件之间的区别！\n\
    \nHTML 以 HTML 声明开始，文件以 `.html` 或 `.htm` 扩展名保存，而 CSS 只包含列出的样式，不需要任何文件声明或任何标签。CSS\
    \ 文件以 `.css` 扩展名保存。\n\n每个文件类型的示例（使用 CSS 文件的 HTML）：\n\n**106**\n\n![](img/index-107_1.jpg)\n\
    ![](img/index-107_2.jpg)\n![](img/index-107_3.jpg)\n\n**网页设计**\n\nMark Gillan\
    \ 网页设计\n\n# 伪类\n\n## 伪类和伪元素\n\n伪类代码允许为某些选择器添加特殊效果。伪类的一个典型例子是悬停在锚点链接上的效果、点击链接的效果以及历史访问过的链接效果，以帮助用户链接的功能。\n\
    \n### 锚点伪类\n\n锚点链接可以用各种效果显示：\n\n```css\na:link {\n  /* 超链接的默认颜色是蓝色并带下划线。 */\n\
    \  color: #FF0000; /* 这里的 CSS 用于设置为红色 */\n}\na:visited {\n  /* 以前访问过的链接，这里的 CSS\
    \ 将颜色更改为绿色。 */\n  color: #00FF00;\n}\na:hover {\n  /* 鼠标悬停——颜色：金黄色。当鼠标悬停时。 */\n\
    \  color: #FFDE00;\n}\na:active {\n  /* 激活链接 / 点击位置，颜色更改为浅蓝色。 */\n  color: #6599FF;\n\
    }\n```\n\n上述效果顺序是确保所有功能正常运行所需的。\n\n**107**\n\n注意上一个示例中的语法（在选择器和伪类名之间使用冒号），然后是用于属性和值的常用\
    \ CSS 语法。\n\n```css\nselector:pseudo-class {\n  property:value;\n}\n```\n\n伪元素遵循类似的语法，但多了一个冒号，即双冒号，然后是通用的\
    \ CSS 语法。\n\n### 伪元素\n\n用于块块级选择器的特殊效果，例如段落的第一行或段落的首字母。\n\n```css\np::first-line\
    \ {\n  color: #C0C0C0;\n  font-variant: small-caps;\n}\n```\n\n上述示例是声明段落的第一行为灰色并小型大写。练习：使用目前所涵盖的\
    \ CSS，为段落创建一个伪元素。\n\n**108**\n\n![](img/index-108_1.jpg)\n\n**专业资格教师 - MARK GILLAN**\n\
    \n# 定位\n\n## 使用 CSS 定位元素\n\nCSS 定位允许将元素放在后面、前面，使用四种主要方法。\n\n### 静态定位\n\n默认设置符合标准。\n\
    \n### 相对定位\n\n相对于文档的自然流和其他元素，发生重叠，尽管空间仍留在流中。\n\n```css\nh2.pos_left {\n  position:\
    \ relative;\n  left: -15px;\n}\nh2.pos_right {\n  position: relative;\n  left:\
    \ 15px;\n}\n```\n\n### 固定定位\n\n固定到窗口，即使窗口滚动。\n\n```css\np.pos_fixed {\n  position:\
    \ fixed;\n  top: 45px;\n  right: 15px;\n}\n```\n\n**109**\n\n![](img/index-109_1.jpg)\n\
    ![](img/index-109_2.jpg)\n![](img/index-109_3.jpg)\n![](img/index-109_4.jpg)\n\
    ![](img/index-109_5.jpg)\n![](img/index-109_6.jpg)\n![](img/index-109_7.jpg)\n\
    \n**网页设计**\n\n### 绝对定位\n\n相对于第一个非静态的父元素进行定位。如果没有分配到第一个父元素，包含块将是 `html`。\n\n```css\n\
    h2 {\n  position: absolute;\n  left: 95px;\n  top: 165px;\n}\n```\n\n**110**\n\
    \n![](img/index-110_1.jpg)\n![](img/index-110_2.jpg)\n![](img/index-110_3.jpg)\n\
    ![](img/index-110_4.jpg)\n![](img/index-110_5.jpg)\n\n**专业资格教师 - MARK GILLAN**\n\
    \n# 重叠堆叠 z-index 控制\n\n绝对定位元素从常规文档流中移除，其他部分和元素表现就像该绝对定位元素不存在一样。绝对定位元素可能会与其他元素重叠。\n\
    \n### z-index\n\n重叠元素可以使用 `z-index` 属性的堆叠顺序进行控制。\n\n```css\nimg {\n  position:\
    \ absolute;\n  left: 10px;\n  top: 0px;\n  z-index: -1;\n}\n```\n\n`z-index` 可以是负值或正值排名。`z-index`\
    \ 较大的元素在堆叠顺序中较大，并位于较小元素的前面。\n\n### 浮动\n\n元素可以水平推向右侧或左侧，允许其他元素环绕。主要用于图像，但在处理各种布局时可能有利。\n\
    \n浮动元素将移动到最可用的点，通常在一个包含元素内。浮动之前的元素...\n\n"
