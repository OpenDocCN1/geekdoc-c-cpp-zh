    ## 职业资格教师 - MARK GILLAN


    ### 组织文件夹

    文件管理练习

    - 定位一个用于网页设计的文件夹

    - `My Documents` 或任何其他文件夹

    - 创建一个名为 `websites` 的文件夹

    - 为每个网站创建一个子文件夹，我们将使用 `markweb`

    - 在网站文件夹创建一个名为 `images` 的文件夹

    - 良好的文件管理对于定位和编辑文件及相关项目至关重要

    - 常见的做法是将网页放在主文件夹中，将图像文件放在图像文件夹中，以便在整个网站重复使用。


    ### 总结

    你可能已经拥有大部分所需的物品……

    - 用于查看网页的浏览器（你可能已经用过 `Microsoft Internet Explorer` 或 `Firefox`）

    - 用于下载网页、测试你自己的网页设计、上传你的网站以上线以及的互联网连接


