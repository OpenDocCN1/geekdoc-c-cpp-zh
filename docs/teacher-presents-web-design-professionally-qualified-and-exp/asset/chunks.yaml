    # 网页设计

    另一种变通方法，与其允许所有内容，不如我们什么什么都不允许（意思相同，只是说法不同）：


    ```text

    User-agent: *

    Disallow:

    ```


    示例中的 `User-agent` 部分适用于所有机器人（注意星号表示所有机器人），但也可以通过联系组织本身或在线搜索实际机器人的名称，为特定的已知机器人定义数据。


    ### 避免爬取文件的示例—robots.txt

    某些网站可能包含用于管理目的文件夹或文件、额外的工作代码、数据库列表以及由于其他原因不供普通查看的文件。robots 文件可以包含以下内容，以指示机器人不应查看的文件：


    ```text

    User-agent: *

    Disallow: /

    ```


    因此，`User-agent` 是非限制性的，而 `disallow` 与之前的 `disallow` 示例完全相反——这次所有内容都被禁止了，并告诉所有机器人不要读取任何文件夹或文件。可以使用
    `Disallow: /foldername` 语法来禁止特定的文件夹或文件名。


