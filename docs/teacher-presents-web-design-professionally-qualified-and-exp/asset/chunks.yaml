  trans: "\n\n# 在线查看\n\n- 记事本 (Notepad)\n- 文件管理准备\n\n36\n![](img/index-37_1.jpg)\n\
    ![](img/index-37_2.jpg)\n![](img/index-37_3.jpg)\n\n# 网页设计\n由 Mark Gillan 设计\n\
    \n## HTML\n\n### 人的标准\n那么，什么是 HTML？我们为什么要使用它？\n\nHTML 代表超文本标记语言（Hyper Text Mark-up\
    \ Language）。这是一种使用“标记标签”的语言，可以被浏览器读取。HTML 是全球使用的网页语言。\n\n它遵循在网络浏览器中显示网页的规则，即：`http://`，代表超文本传输协议（HTTP）。\n\
    \n该语言可以在简单的文本编辑器（例如 `Notepad`）中编写，并使用 `.htm` 或 `.html` 扩展名将其保存为 HTML 文件，以便计算机能够识别并读取文件类型，以及与程序的任何文件关联。\n\
    \nHTML 语言多年年来不断更新，并随着新版本的不断出现而持续演进。\n\n### 提示\nHTML 是用于构建网页的标记语言，遵循网络浏览器内的 `http`\
    \ 协议，网页的计算机文件扩展名为 `.htm` 或通常更合适的 `.html`，允许机器将计算机代码与网页关联。标签提供了关于内容以及如何在网络浏览器中最佳显示的指示。\n\
    \n37\n![](img/index-38_1.jpg)\n![](img/index-38_2.jpg)\n![](img/index-38_3.jpg)\n\
    ![](img/index-38_4.jpg)\n![](img/index-38_5.jpg)\n![](img/index-38_6.jpg)\n\n\
    ## 职业资格教师 - MARK GILLAN\n\n### 快速任务——练习\n尝试这个快速练习来理解 HTML 的用法和 HTTP 协议：\n\n1.\
    \ 启动你的浏览器（例如 Microsoft Internet Explorer、Google Chrome、Firefox 或实际上任何其他浏览器）。\n\
    2. 注意地址栏显示的主页 URL（统一资源定位符），行开头为：`http://`。\n3. 如果你没有显示主页，点击地址栏并输入：`www.skooshmedia.com`\n\
    \n`http` 代表：超文本传输协议（Hyper Text Transfer Protocol）。`http` 告诉浏览器在显示文件时应遵循哪些规则（协议），例如：超文本文件——html\
    \ 编码的文件。协议意味着全世界使用这些规则的人必须遵守它们，以确保一切运行正确、顺畅且符合预期。正如大多数协议和礼仪一样……这对所有人的利益、享受和理解都有好处。\n\
    \n`www` 非常常见，但查看网页并非完全必要……`http` 确实非常重要，尽管我们不需要自己物理向地址栏输入它，但 URL 一旦连接将尝试利用相关协议。得益于协议，背后的\
    \ HTML（超文本标记语言）现在已与网络浏览器完全兼容。\n\n38\n![](img/index-39_1.jpg)\n![](img/index-39_2.jpg)\n\
    ![](img/index-39_3.jpg)\n![](img/index-39_4.jpg)\n\n# 网页设计\n\n## HTML 标签\n让我们看看\
    \ HTML 是如何编写的，并理解代码方面的选项。\n\n启动浏览器（如 Microsoft Internet Explorer、Google Chrome\
    \ 或 Firefox）并导航到一个网页。对于这个快速任务，任何网页都可以：\n\n使用浏览器工具查看网页的源代码，以快速查看背后的内容。不要担心其含义，只需知道网页背后有\
    \ HTML 和其他代码……这本书将帮助你理解更多！\n\n观察 HTML，我们看到了标签、标签的开始、内部内容以及标签的结束。每个标签都提供了关于内容以及该内容具体细节的指令。在这个阶段，充分理解网页将根据标签显示是重要的。例如，如果没有代表段落开始的标签，段落就不会出现。在文字处理或类似应用程序中通常放置的换行符对\
    \ HTML 内的布局没有影响。\n\n### 学习笔记——HTML 元素\n大多数 HTML 元素都成对标签出现：一个开始标签、内容，然后是结束标签，全部使用小写字母。\n\
    \n39\n![](img/index-40_1.jpg)\n![](img/index-40_2.jpg)\n![](img/index-40_3.jpg)\n\
    ![](img/index-40_4.jpg)\n\n## 职业资格教师 - MARK GILLAN\n\n### HTML 页面结构\n从顶部开始！尝试在脑海中记住这张看起来很奇怪的图片并永远让它离开……这意味着每次网页结构都是正确的。当你开始编写\
    \ HTML 时，只需记住你脑海中的 HTML。你是有目的地坐在这里编写 HTML 的，这是你的标题。主体（body）是万物发生的地方。只需记住哪里是开始。\n\
    \n40\n![](img/index-40_1.jpg)\n![](img/index-40_2.jpg)\n![](img/index-40_3.jpg)\n\
    ![](img/index-40_4.jpg)\n\n# 网页设计\n\n## HTML 结构\n再次观察 HTML 结构。为了让网页正确显示，我们需要理解结构。这意味着网页结构是正确的。\n\
    \n- 标签提供了部分，以便在浏览器中显示。\n\n- 网页设计\n\n\n\n  HTML 结构，以便是是编写的。。在浏览器中显示时，请注意这些标签：\n\
    - HTML 开始：`<html>`\n- 头部开始：`<head>`\n- 标题开始：`<title>`（标题出现在浏览器标题栏中）\n- 标题结束：`</title>`\n\
    - 主体开始：`<body>`（实际内容位于网页主体中）\n- 主体结束：`</body>`\n- HTML 结束：`</html>`\n\n41\n![](img/index-42_1.jpg)\n\
    ![](img/index-42_2.jpg)\n![](img/index-42_3.jpg)\n![](img/index-42_4.jpg)\n![](img/index-42_5.jpg)\n\
    \n## 职业资格教师 - MARK GILLAN\n由 Mark Gillan 设计\n\n# 第一个网页\n\n### 编写你的第一个网页\n确保你有一个名为\
    \ `markweb` 的文件夹\n打开/运行 `Notepad` 或 `Notepad++` 或类似软件。确保你有一个空白页面。输入以下内容：\n\n```html\n\
    <html>\n<head>\n  <title>我的第一个网页</title>\n</head>\n<body>\n  这是主体，文字和图片在这里\n</body>\n\
    </html>\n```\n\n现在需要保存该文件——查看下一个练习……\n\n43\n![](img/index-44_1.jpg)\n![](img/index-44_2.jpg)\n\
    ![](img/index-44_3.jpg)\n![](img/index-44_4.jpg)\n![](img/index-44_5.jpg)\n![](img/index-44_6.jpg)\n\
    \n## 职业资格教师 - MARK GILLAN\n\n### 练习——保存为网页\n有时被称为落地页，`index.html` 页面是网络服务器在网站中查找的第一个页面。根据网络服务器的不同，文件可能命名为\
    \ `welcome.html` 或使用 `.htm` 代替 `.html`，但建议使用更常见的名称保存文件：`index.html`。\n\n遵循通常保存命令，如\
    \ `文件 > 另存为`\n\n"
