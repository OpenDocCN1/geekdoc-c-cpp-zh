    \ CSS coding, the element followed by the hash `#` key then the `id` located in\
    \ the `id` attribute of the element requiring formatting.\n\nFor example, if we\
    \ had paragraphs with an `id` of `\"mgr\"` such as:\n\n```html\n<p id=\"mgr\"\
    >This paragraph has the identifier</p>\n```\n\nThe example here might have a CSS\
    \ declaration to change any paragraph text containing the attribute value of `\"\
    mgr\"` to have a font colour of a light blue:\n\n```css\np#mgr {\n  color: #369de1;\n\
    }\n```\n\nIf the element type is not stated (in the example above, if the `'p'`\
    \ for paragraph was not present) within the CSS selector, any element utilising\
    \ the unique `id` selector will have the formatting applied, irrespective of type.\
    \ It is possible to format various types of elements across a website as long\
    \ as they share the same `id` attribute value. Similarly, if a class selector\
    \ does not specify an element but only declares a dot followed by the class name,\
    \ the style will be applied to any occurrence of the stated class.\n\nExample\
    \ of CSS for any incidence of a class named `\"center\"`:\n\n```css\n.center {\n\
    \  text-align: center;\n  color: red;\n}\n```\n\n**104**\n\n![](index-105_1.jpg)\n\
    \n**WEB DESIGN**\n\n# Grouping Selectors\n\nQuite often, there might be various\
    \ elements with the same style, long-hand would occupy space and lessen efficiency\
    \ by typing out the CSS for each element with the same style. To minimise the\
    \ un-necessary bulk of CSS code, it is advisable to group the selectors. Separate\
    \ each selector with a comma.\n\nFor example, if Heading 1’s, Heading 2’s, Heading\
    \ 3’s are to be centre aligned and the font colour is to be red, try grouping.\
    \ Instead of all this CSS code:\n\n```css\nh1 {\n  text-align: center;\n  color:\
    \ red;\n}\nh2 {\n  text-align: center;\n  color: red;\n}\nh3 {\n  text-align:\
    \ center;\n  color: red;\n}\n```\n\nIt is recommended to have this CSS code:\n\
    \n```css\nh1, h2, h3 {\n  text-align: center;\n  color: red;\n}\n```\n\n**105**\n\
    \n![](index-106_1.jpg)\n![](index-106_2.jpg)\n![](index-106_3.jpg)\n\n**Professionally\
    \ Qualified Teacher - MARK GILLAN**\n\n# Notes and Reminders\n\nIt is best not\
    \ start a class or id with a number and always remember the difference between\
    \ HTML and CSS files!\n\nHTML commences with the HTML declaration and the file\
    \ is saved with a `.html` or `.htm` extension whereas CSS only contains styles\
    \ listed without the need for any file declaration or any tags. CSS files are\
    \ saved with the `.css` extension.\n\nExample for each file type (HTML using CSS\
    \ file):\n\n**106**\n\n![](index-107_1.jpg)\n![](index-107_2.jpg)\n![](index-107_3.jpg)\n\
    \n**WEB DESIGN**\n\nWeb Design by Mark Gillan\n\n# PSEUDO\n\n## Pseudo class and\
    \ Pseudo element\n\nPseudo class code allows special effects to be added to some\
    \ selectors. A prime example for a pseudo class would be the effects for hovering\
    \ over anchor hyperlinks, clicking the link and historically followed links to\
    \ aid user functionality for hyperlinks.\n\n### Anchor Pseudo-class\n\nAnchor\
    \ links can be displayed with various effects:\n\n```css\na:link {\n  /* The default\
    \ for a hyperlink is blue and underlined. */\n  color: #FF0000; /* The CSS here\
    \ is for RED colouring */\n}\na:visited {\n  /* A link that has previously been\
    \ visited, the CSS here is to change the colour to a green. */\n  color: #00FF00;\n\
    }\na:hover {\n  /* Mouse over—colour: Yellowy gold. Whilst the mouse hovers. */\n\
    \  color: #FFDE00;\n}\na:active {\n  /* Active link / clicked position, colour\
    \ change to a light blue. */\n  color: #6599FF;\n}\n```\n\nThe above order of\
    \ effects are required for everything to work.\n\n**107**\n\nNotice the syntax\
    \ from the previous example (the use of a colon between the selector and the pseudo\
    \ class name), followed by the usual CSS syntax for property and value.\n\n```css\n\
    selector:pseudo-class {\n  property:value;\n}\n```\n\nPseudo Elements follow a\
    \ similar syntax but for an additional colon, meaning double colon, followed by\
    \ the usual CSS syntax.\n\n### Pseudo Elements\n\nUseful for special effects to\
    \ block level selectors such as the first line of a paragraph or the first letter\
    \ of a paragraph.\n\n```css\np::first-line {\n  color: #C0C0C0;\n  font-variant:\
    \ small-caps;\n}\n```\n\nThe example immediately above is declaring the first\
    \ line of paragraphs to be grey in colour and small-caps.\n\nExercise: Using all\
    \ the CSS covered so far, create a pseudo-element for paragraphs.\n\n**108**\n\
    \n![](index-108_1.jpg)\n\n**Professionally Qualified Teacher - MARK GILLAN**\n\
    \n# POSITIONING\n\n## Positioning elements using CSS\n\nCSS positioning allows\
    \ the designer to place elements behind, in front, using the four main methods.\n\
    \n### Static Positioning\n\nDefault setting and conform to the standard.\n\n###\
    \ Relative Positioning\n\nRelative to the natural flow of the document and other\
    \ elements, overlapping other elements, although the space remains allocated within\
    \ the flow.\n\n```css\nh2.pos_left {\n  position: relative;\n  left: -15px;\n\
    }\nh2.pos_right {\n  position: relative;\n  left: 15px;\n}\n```\n\n### Fixed Positioning\n\
    \nFixed to the window, even if the window is scrolled.\n\n```css\np.pos_fixed\
    \ {\n  position: fixed;\n  top: 45px;\n  right: 15px;\n}\n```\n\n**109**\n\n![](index-109_1.jpg)\n\
    ![](index-109_2.jpg)\n![](index-109_3.jpg)\n![](index-109_4.jpg)\n![](index-109_5.jpg)\n\
    ![](index-109_6.jpg)\n![](index-109_7.jpg)\n\n**WEB DESIGN**\n\n### Absolute Positioning\n\
    \nPositioned relative to the first parent element with a position other than static.\
    \ If no first parent element is allocated, the containing block will be `html`.\n\
    \n```css\nh2 {\n  position: absolute;\n  left: 95px;\n  top: 165px;\n}\n```\n\n\
    **110**\n\n![](index-110_1.jpg)\n![](index-110_2.jpg)\n![](index-110_3.jpg)\n\
    ![](index-110_4.jpg)\n![](index-110_5.jpg)\n\n**Professionally Qualified Teacher\
    \ - MARK GILLAN**\n\n# Overlap stacking z-index control\n\nAbsolutely positioned\
    \ elements are removed from the normal document flow with other parts and elements\
    \ acting as if the absolutely positioned element does not exist. Absolutely positioned\
    \ elements may overlap other elements.\n\n### z-index\n\nElements overlapping\
    \ other elements can be controlled with a stacking order using the `z-index` property.\n\
    \n```css\nimg {\n  position: absolute;\n  left: 10px;\n  top: 0px;\n  z-index:\
    \ -1;\n}\n```\n\nThe `z-index` can be negative or positive in ranking. The element\
    \ with the greater `z-index` is greater within the stacking order and is placed\
    \ in front of the lesser valued.\n\n### Float\n\nElements can be pushed horizontally\
    \ to the right or left allowing other element to wrap around. Mostly used for\
    \ images but can be beneficial when working with various layouts.\n\nFloated elements\
    \ will move to the furthest available point, usually within a containing element.\
    \ Elements prior to the float...\n"
