    ## Professionally Qualified Teacher - MARK GILLAN


    ## Design Pointers


    ### Quicktime Movies

    Some websites use Quick Time `.mov` files, not very welcome on web pages due to
    the following:

    - Uncompressed video files, usually very large in file size.

    - Originally created for the Apple platform and not Microsoft or many others.

    - Need specialised plug-in to view the video.


    ### Flash Movies

    Flash movies (`.swf` file formats) can be useful, entertaining and can provide
    additional functionality but can cause problems for viewers due to the following:

    - Requires Adobe Flash Player plug-in for web browser or a separate software application
    for viewing.

    - Can cause problems for screen readers.

    - Large sized files.

    - Compatibility issues with various mobile devices and various platforms.


    Some designers over indulge in flash and just want to showcase their flash abilities
    as opposed to functionality and use of the website itself. It can also detract
    away from other information. Embedding or linking to external video is a valid
    alternative.


    **30**


    ![](index-31_1.jpg)


    ## WEB DESIGN


    ### Navigation

    Navigation must be simple

    - Screen readers need navigation at the top of the web page. It is problematic
    for screen readers if designers have navigation elsewhere on a page and wastes
    time.

    - Navigation should be easy to use, very easy to find and easy to understand for
    all users. If not … visitors get lost and move on … never to return!


    ### Readability and accessibility

    It is not only legally responsible but socially minded to ensure all visitors
    to a website can access the information. It would not be wise to exclude large
    groups of community members.

    - Black background and white text is possibly the worst combination for visually
    impaired users to read.

    - Everyone should be able to view, read and understand a web page.

    - Legal obligations are placed upon organisations to consider accessibility.

    - Screen readers require web pages to meet standards, as well as web browsers
    having the same needs.


    *Learning Note—catering for as many users as possible*


    There is a difficulty being creative with design at the same time as ensuring
    a website is available to all. The best designers are able to be creative for
    the benefit of the website and not just for their own gratification.


