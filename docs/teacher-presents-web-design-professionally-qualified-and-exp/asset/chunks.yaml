    HTML 表单包含各种控件，用于收集、查看、协调和检索数据。


    `<form>` 元素用于将表单的所有控制部分组合在一起，其中可能包括文本框、单选按钮、下拉列表、复选框，以及可能使用其他编程语言实现的交互式计算内容。


    某些网络托管服务可以协助编写语言代码，将表单内容执行并通过电子邮件发送给指定的接收者。或者，你也可以让用户打印网页、发送电子邮件或通过邮寄。


    由于表单数据使用的复杂性，我们将集中在布局和表单元素上，而不是广泛的功能，如创建账户、搜索结果、财务以及其他的“post”或“get”方法——那完全是另一本新书了！


    现在，回到手头的任务，我们仍需要知道如何为了设计目的开发表单，因此在网页内生成表单区域的第一个重要标签，你可能已经猜到了……


    ```html

    <form>With the form components within the form tags</form>

    ```


    与大多数 HTML 元素类似，`<form>` 元素有几个可以在起始表单标签内设置的不同属性，包括发送/获取数据的方法（method）和用于处理的（action）。我们将重点关注表单内的各种元素。


    用于获取用户数据最重要的表单元素是 `<input>` 标签，它有许多不同类型的变体。在练习将所有表单元素组合之前，我们先查看一些常见的输入类型。记住，所有的输入类型都将放在
    `<form>` 标签内。


    ### 文本字段


    `<input type="text">` 用于单行文本输入字段。


    #### 示例

    ```html

    <form>

    <p>This is to show the use of a text field within the form</p>

    Full Name <input type="text" name="fullname"/>

    </form>

    ```


    #### 解释

    表单标签，随后是显示在字段之前的表单内文本，接着是输入字段类型，然后是该字段的后台名称（name）。在 Web 浏览器中显示如下：


    ### 单选按钮


    `<input type="radio">` 用于在有限的可选选项中进行单选，为每个选项使用相同的名称（name）将限制每个“名称”组内只能选择一个。


    为了划分表单的一个区域，可以使用 `<fieldset>` 标签，为特定目的提供一个定义的表单区域，并配有一个 `<legend>` 标签来为该区域提供标题。


    #### 示例

    ```html

    <form>

    <fieldset>

    <legend>Select mode of delivery</legend>

    <input type="radio" name="mode" value="Class" />Classroom

    <input type="radio" name="mode" value="Home" />At Home

    <input type="radio" name="mode" value="Mixed" />Blended Mix

    </fieldset>

    </form>

    ```


    #### 解释

    表单标签，包含区域的 fieldset，对应 fieldset 的 legend，输入类型为单选按钮，随后是每个按钮相同的名称（限制该名称仅选择一个），随后是代表所点击单选按钮选择的值（value），最后是要显示的文本和标签闭合。


    Web 浏览器

    这是表单内单选按钮可能的样子。


    ### 复选框（钩选框）


    允许从框选项列表中选择多个选项。与上一页显示的单选按钮示例类似，在这种情况下输入类型将是“checkbox”。


    #### 示例

    ```html

    <fieldset>

    <legend>Service requirement</legend>

    <input type="checkbox" name="service" value="Publishing"/>Publishing

    <input type="checkbox" name="service" value="Art" />Artwork

    <input type="checkbox" name="service" value="Photo"/>Photography

    </fieldset>

    ```


    Web 浏览器

    在 Web 浏览器中可能如下：


    ### 练习


    创建一个新的网页，根据你可能向潜在客户询问的数据请求创建一个表单，例如他们的姓名、电子邮件地址、同意条款、列表中的单选、各种服务的多项选择，使用以下项目并将网页命名为
    `form.html`。

    使用 `fieldset`、`legend`、文本字段、单选按钮和复选框。


    ### 其他表单控件


    并不是所有的网络浏览器都会显示表单控件。


    ### 范围


    限制用户输入特定的最小值和最大值之间的数字。某些网络浏览器将将其显示为滑块，为用户提供额外的便利性和乐趣。


    #### 示例

    在通常的表单标签内，使用可选的 fieldset 和 legend，这里是一个范围输入的 html 示例。知识百分比<br>

    <input id="skill" type="range" min="1" max="100" value="1">


    ### 创建密码字段


    显然出于安全考虑，密码不应被别人从背后看到。因此，对密码等敏感输入在视觉上进行保护是非常关重要的。密码字段可以在输入时提供星号或圆点。


    #### 示例

    同样，在通常的表单标签内，使用任何可选属性。输入你的密码 <input type="password" name="pwd">


    ### 下拉自动文本选择列表


    在通常的输入元素中使用预定义的 `<datalist>` 元素，可以在用户点击输入字段字段时提供一个下拉列表。`<datalist>` 元素用于用户打字时进行“自动完成”，提供一个供选择的下拉列表。


    #### 示例

    输入元素的 `list` 属性将 `<datalist>` 元素内的所有内容绑定在一起。


    '
- fmt: '

    ```html

    <input list="sports">

    <datalist id="sports">

    <option value="Football">

    <option value="Baseball">

    <option value="Golf">

    <option value="Shinty">

    </datalist>

    ```


    ## Email Address Field

    A field specifically for the input of an email address, validating the data appearing
    as an email address. Mobile devices tend to change the keyboard for the user to
    include the ‘@’ symbol for the entry of an email address. Most web browsers check
    data.


    ### Example

    With the usual form tags and any optional attributes.

    ```

    Enter your email <input type="email" name="email" required>

    ```


