    **Professionally Qualified Teacher - MARK GILLAN**


    **Headings for Search Engine Robots**


    There is another very good reason … Search Engine


    Optimisation (SEO) to which we previously discussed for strong


    and bold tags. Search engines need to identify what is important


    within a web page to rank said web page for importance within


    the listings for their own clients.


    Robots / spider software utilised by search engines have


    improved over the years to gauge how headings and other SEO


    sensitive tags are used (or abused) by web designers.


    Therefore, the use of headings should concentrate upon being


    structured items for the purpose of readability first and foremost,


    helping visitors as well as screen readers (visually impaired


    visitors) to quickly identify their target requirements within the


    web page. Any SEO ambitions should adequately follow with


    the robot considering the priority of each headings in


    conjunction with other elements such as keywords, description


    and other tags throughout the page / site.


    If a web designer purposely abuses the highest order of


    headings (trying to fool the search engine rankings by placing a


    large amount of keywords into Heading 1 tags), the search


    engines might identify the tactic of “keyword stuffing” and clout,


    slap, bang, demote such attempts … the web page / website will


    possibly find itself way down the picking order within listings.


    Try to be clever with the use of headings, using words


    associated with the subject of content and similar to keywords /


    description noted within the meta tags but be careful to ensure


    the web page is definitely written with the message firmly in


    mind. It is mind over matter, as the saying goes!


