  trans: "\n\n# 有序列表 …标签为 `<ol>`，结束列表为 `</ol>`\n\n无序列表 …标签为 `<ul>`，结束列表为 `</ul>`\n\
    \n描述列表 …标签为 `<dl>`，结束列表为 `</dl>`\n\n如果我们逐一查看每一个列表：\n\n### 有序列表 `<ol>` 后接列表项目 `<li>`\n\
    在有序列表对之间结合列表项目标签使用。列表项目具有逻辑顺序，通常带有编号。\n\n### 无序列表 `<ul>` 后接列表项目 `<li>`\n同样结合列表项目标签使用，与有序列表类似。倾向于使用没有顺序的符号符号列表。\n\
    \n### 描述列表 `<dl>` 后接项目 / 描述 \n`<dt>` 标签是描述性术语（类似于列表项目），其后跟随的 `<dd>` 是定义描述。例如，一个术语\
    \ `<dt>老虎</dt>` 后面紧跟着描述 `<dd>一种牙齿非常大且准备好使用的大型猫</dd>`。\n\n**63**\n\n![](img/index-64_1.jpg)\n\
    ![](img/index-64_2.jpg)\n![](img/index-64_3.jpg)\n![](img/index-64_4.jpg)\n![](img/index-64_5.jpg)\n\
    ![](img/index-64_6.jpg)\n\n**专业资格教师 - MARK GILLAN**\n\n### 示例—列表代码\n这里是使用相关标签的有序列表、无序列表以及定义/描述项目列表示例。此代码在右侧的网络浏览器中显示\
    \ ...\n\n**64**\n\n![](img/index-65_1.jpg)\n![](img/index-65_2.jpg)\n![](img/index-65_3.jpg)\n\
    ![](img/index-65_4.jpg)\n![](img/index-65_5.jpg)\n![](img/index-65_6.jpg)\n\n\
    **网页设计**\n\n### 示例—作为网页的代码\n这是右侧页面的 HTML 代码在网页浏览器中显示为网页的形式，展示了每个列表。展示了有序列表、无序列表（项目符号）以及带有足球、棒球和高尔夫的描述列表，每个项目都有描述。\n\
    \n列表会自动提供行间距、段间距和其他适当的格式。根据需要应用额外的格式，包括使用字母代替数字的有序列表 … 见上 ...\n\n**65**\n\n![](img/index-66_1.jpg)\n\
    ![](img/index-66_2.jpg)\n![](img/index-66_3.jpg)\n![](img/index-66_4.jpg)\n![](img/index-66_5.jpg)\n\
    ![](img/index-66_6.jpg)\n![](img/index-66_7.jpg)\n![](img/index-66_8.jpg)\n![](img/index-66_9.jpg)\n\
    \n**专业资格教师 - MARK GILLAN**\n\n### 有序列表—属性\n如前所述，有序列表可以使用以下语法具有其他属性：\n\n`<ol type=\"\
    A\">` 将为我们提供大写字母，按字母表顺序排列。将大写的 `\"A\"` 替换为 `\"a\"` 将为我们提供正如你猜的那样 … 相同序列的小写字母。其他属性包括：\n\
    \n`\"5\"` 将从数字五开始计数。\n\n`\"i\"` 将是小写罗马数字（`\"I\"` 用于大写）。\n\n### 练习—创建一些列表\n列表是许多许多网站的重要部分，值得练习。介绍你自己，并说明你打算列出你的爱好、兴趣和喜爱的电视节目。\n\
    \n现在，使用项目符号列出你所有的爱好和兴趣，包括你未来想观看或参加的任何项目。\n\n现在，引入下一个有序列表，使用小写罗马数字排列你所有最喜爱的电视节目，顺序为：`i`\
    \ 最喜欢的，`ii` 次喜欢的，`iii` 第三喜欢的。最后，列出一些电视频道并使用适当的列表描述它们的特征节目。\n\n保存为：`myfavs.html`\
    \ 到名为 `listings` 的新文件夹中。\n\n**66**\n\n![](img/index-67_1.jpg)\n![](img/index-67_2.jpg)\n\
    ![](img/index-67_3.jpg)\n\n**网页设计**\nMark Gillan 网页设计\n\n# 表格\n\n### 创建和使用表格\n\
    表格由水平跨越的行和垂直定位的列组成。一些网页设计师认为表格是使用单元格对齐数据的绝佳息地，他们会用这种方便的布局填充每一页。表格非常有适应性，可以提供在舒适环境中显示各种类型数据的极佳手段\
    \ ...但它**不应该**用于设计网页的目的，因为由于两个主要原因，对其他领域的知识明显缺乏：\n\n1. 搜索引擎爬虫发现推断表格内数据的重要性，实际上读取任何实质内容都很困难。为了搜索引擎优化（SEO）以及屏幕阅读器的考虑，除了有效目标（如事实和数字）外，使用表格不是良好的做法。\n\
    2. 一个优秀的专业网页设计师应该知道如何控制、设计和掌握设计艺术，而不是向世界宣告他们的无能。表格是好的 ...但不足以掩盖网页设计师必须具备的基础知识的匮。\n\
    \n然而，表格对于各种内容非常出色，例如文本、数字、图像、多媒体、超链接 …几乎任何内容！\n\n**67**\n\n![](img/index-68_1.jpg)\n\
    ![](img/index-68_2.jpg)\n![](img/index-68_3.jpg)\n![](img/index-68_4.jpg)\n![](img/index-68_5.jpg)\n\
    ![](img/index-68_6.jpg)\n![](img/index-68_7.jpg)\n\n**专业资格教师 - MARK GILLAN**\n\
    \n### 表格结构\nHTML 文档使用嵌套元素构建。\n\n### 标签—代码\n这是一个基础表格的样式：\n\n```html\n<table>\n\
    <tr>\n  <td>第一行单元格</td>\n  <td>第一行的右侧单元格</td>\n</tr>\n<tr>\n  <td>第二行的单元格</td>\n\
    \  <td>第二行的单元格</td>\n</tr>\n</table>\n```\n\n这是一个 2x2 表格。\n\n### 跨行 (Cell Span)\n\
    让一个单元格跨越多行，形成较大的单元格。例如，跨越 2 行的单元格使用相关属性：\n\n```html\n<table>\n<tr>\n  <td rowspan=\"\
    2\">大单元格</td>\n  <td>第一行第二列</td>\n  <td>第一行第三列</td>\n</tr>\n<tr>\n  <td>第二行第二列</td>\n\
    \  <td>第二行第三列</td>\n</tr>\n</table>\n```\n\n这是一个 3x3 表格。\n\n### 跨列 (Colspan)\n\
    这次让一个单元格跨越多个列。例如，跨越 3 列的单元格：\n\n```html\n<table>\n<tr>\n  <td colspan=\"3\">跨三列的大单元格</td>\n\
    </tr>\n<tr>\n  <td>第二行第一列</td>\n  <td>第二行第二列</td>\n  <td>第二行第三列</td>\n</tr>\n\
    <tr>\n  <td>第三行第一列</td>\n  <td>第三行第二列</td>\n  <td>第三行第三列</td>\n</tr>\n</table>\n\
    ```\n\n### 表格边框\n为表格添加边框（`2` 是线宽）：\n\n```html\n<table border=\"2\">\n</table>\n\
    ```\n\n### 表格格式、布局和属性\n现在的 HTML 格式应该使用层层样式表（CSS）。CSS 编码将在本书后面的部分讨论，现在注意 CSS 是最佳方法。\n\
    \n### 表格头、表体和页脚\n与其将单个表格单元格分配为标题，可以使用表格分组来提供一些布局增强。\n\n### \n表格标题代表适用单元格的标题信息。表格数据单元格\
    \ `<td>` 可以替换为 `<th>`。默认情况下，主要的网页浏览器会将表格标题显示为加粗并居中。\n\n表格标题代码示例及其在网页浏览器中的显示方式：\n\
    \n```html\n<table>\n<tr>\n  <th>标题 1</th>\n  <th>标题 2</th>\n</tr>\n<tr>\n  <td>数据\
    \ 1</td>\n  <td>数据 2</td>\n</tr>\n</table>\n```\n\n"
- fmt: "\nThe tags `<thead>` `<tbody>` and `<tfoot>` allocate grouped areas of a table.\
    \ Another useful tag is the `<caption>` and does exactly what it says on the tin!\n\
    \n```html\n<table border = \"1\">\n  <caption>The grouping table</caption>\n \
    \ <thead>\n    <tr>\n      <td colspan=\"2\">This is the Table Header</td>\n \
    \   </tr>\n  </thead>\n  <footer>\n    <tr>\n      <td colspan=\"2\">This is the\
    \ Table Footer</td>\n    </tr>\n  </footer>\n  <tbody>\n    <tr>\n      <td>Cell\
    \ 1</td>\n      <td>Cell 2</td>\n    </tr>\n    <tr>\n      <td>Cell 3</td>\n\
    \      <td>Cell 4</td>\n    </tr>\n    <tr>\n      <td>Cell 5</td>\n      <td>Cell\
    \ 6</td>\n    </tr>\n  </tbody>\n</table>\n```\n\n## 71\n\n![](index-72_1.jpg)\n\
    ![](index-72_2.jpg)\n![](index-72_3.jpg)\n![](index-72_4.jpg)\n![](index-72_5.jpg)\n\
    \n## Professionally Qualified Teacher - MARK GILLAN\n\n### Exercise—code a league\
    \ table\n\nBringing some of the aforementioned table coding together, generate\
    \ a code set for a sports league / championship table using each of the following\
    \ features:\n\n1. Caption of: `The Contenders Compoship`\n2. Table consisting\
    \ of 3 columns with the following listed:\n   - Team Name | Bonus | Points\n \
    \  - Saorse Advance | 92 | 383\n   - Viva Broonburgers | 81 | 304\n   - Alba |\
    \ 77 | 245\n   - Panthers Paws | 54 | 188\n3. Top row shown above is to be the\
    \ headings.\n4. Table header reading: `League Status`\n5. Table footer reading:\
    \ `Officially replicated`\n6. The cells containing `Bonus` and `Points` data for\
    \ the “Alba” team needs removing and replaced with one cell across the bonus /\
    \ points cells for the team, to read: `Void total`\n7. Provide the web page with\
    \ suitable keywords, description, title and save with the file name: `compo.html`\
    \ into a new folder named: `tables`\n\n## 72\n\n![](index-73_1.jpg)\n![](index-73_2.jpg)\n\
    ![](index-73_3.jpg)\n\n## WEB DESIGN\nWeb Design by Mark Gillan\n\n### IMAGES\n\
    \n#### Inserting image files\n\nAn html file is text, to display images within\
    \ a web browser the html points to an image file location. We use the `<img>`\
    \ tag. Some knowledge feeds for this subject here:\n\n1. The `<img>` tag is not\
    \ an element but a standalone tag.\n2. There is not the usual end tag, a ‘forward\
    \ slash’ is placed at the end of the tag line.\n3. The image is displayed where\
    \ the `<img>` tag is located within the html file and points to the image file\
    \ location known as the source (`src`) followed by the name of the image file\
    \ and its location / folder.\n\nFor example:\n```html\n<img src=\"photo.jpg\"\
    />\n```\nOr, if the image file is located within an ‘images’ sub-folder within\
    \ the folder holding the html file itself:\n```html\n<img src=\"images/photo.jpg\"\
    />\n```\n\nFor reasons of Search Engine Optimisation (SEO) spiders, screen readers\
    \ and for legal implications, the image is described in words within an ‘alt’\
    \ tag:\n```html\n<img src=\"images/photo.jpg\" alt=\"worded description\"/>\n\
    ```\n\n## 73\n\n![](index-74_1.jpg)\n![](index-74_2.jpg)\n![](index-74_3.jpg)\n\
    \n## Professionally Qualified Teacher - MARK GILLAN\n\n### Image display dimensions\
    \ and file size\n\nMany image editing software arsenal of tools usually include\
    \ “Save for Web & Devices”, with some free online editors providing this same\
    \ helpful command. Some have the ability to compress images to a target or percentage\
    \ amount in conjunction with actual display dimensions in pixels.\n\nAn image\
    \ of 2 MB with dimensions of 1200 x 800 pixels might take a while to load in a\
    \ web browser via slower internet connections but it would also occupy precious\
    \ web server space when the same image reduced in actual pixel size and compressed\
    \ into less than the original 2 MB might appear similar on screen without the\
    \ need for so much time / cost / disk space.\n\nGood web design would ensure:\n\
    \n1. Correct file type for the image, using lowercase extensions and lowercase\
    \ throughout the file name.\n2. Size of file on disk is kept to a minimum for\
    \ reasons of loading time within a web browser, cost of keeping on a web server\
    \ and the website visitor requirements. Do not rely upon sizing using html code\
    \ alone, consider the image file prior to use.\n3. Copyright ownership or permission\
    \ to use images. This could prove costly in court for the web designer or their\
    \ client. Always adhere to the rule of law.\n4. Images are relevant, required,\
    \ correct and complement the overall design. Engage the services of a professional\
    \ photographer wherever possible, it might be best!\n\n## 74\n\n![](index-75_1.jpg)\n\
    ![](index-75_2.jpg)\n![](index-75_3.jpg)\n\n## WEB DESIGN\n\n### Image file types\n\
    \nFiles may require compression / reduction in file size without too much deterioration.\
    \ The main image file types for web design, acceptable by the majority of web\
    \ browsers and small enough in file size:\n\n**.jpg or .jpeg**\n\nThe acronym\
    \ is for Joint Photographic Experts Group and is the most popular file format\
    \ for photo images and is known as one of the 'Interchange Formats', being acceptable\
    \ to most applications. There are variable compression states ranging from 0 to\
    \ 12, with the lowest number providing the highest rate of compression but the\
    \ lowest quality and vice versa, this is 'lossy' compression. Lossy compression\
    \ means evident loss of quality the more compression is applied. The vast majority\
    \ of photographic images within web pages tend to be JPEG. It is important to\
    \ note html requires the file name to use the file extension of `.jpg` and everything\
    \ to be lowercase. Try not to use spaces within file names and not to long either.\n\
    \n**.gif**\n\nGraphics Interchange Format - is again one of the most popular 'Interchange\
    \ Formats' (read by almost every software available on the market today). It is\
    \ very popular for images within web pages, especially useful for logos or basic\
    \ clip art / line art work, although not as good for photos as the `.jpg` format,\
    \ due to the reduced colour range of 256 colours and increased rate. GIF supports\
    \ transparent pixels and animation.\n\n## 75\n\n![](index-76_1.jpg)\n![](index-76_2.jpg)\n\
    ![](index-76_3.jpg)\n\n## Professionally Qualified Teacher - MARK GILLAN\n\n###\
    \ Image file types continued…\n\n**.png**\n\nPortable Network Graphics was accepted\
    \ by many as the successor to the `.gif` and `.jpg` but as yet has lived up to\
    \ expectations. Saves meta data (key information for searching purposes). This\
    \ file format allows a greater amount of colours, with a provision for progressive\
    \ viewing meaning an initial image building up to form far superior without much\
    \ waiting time to view the image.\n\n### Additional html options\n\nOther options\
    \ available for images include `width` and `height` to specify the dimensions\
    \ within html. If the image is used more than once within a website but requires\
    \ different sizing each time these attributes can be useful. Not required but\
    \ can assist with CSS is the `<figure>` tag prior to the image as well as `<figcaption>`\
    \ to provide a descriptive label to an image. The `<figure>` tags can accommodate\
    \ more than one image but `<figcaption>` can only be used once.\n\n### Exercise\n\
    \nCreate a folder named: `inspics` and then create a subfolder named: `images`—placing\
    \ a JPEG and a GIF (photograph and clipart appropriately) inside the images folder.\
    \ Insert both images, referring to the images folder, into a new web page named:\
    \ `pics.html` and save within the `inspics` folder next to the images folder.\
    \ Test within a web browser. Any problems—refer to the next ‘IMG TROUBLE’ chapter.\n\
    \n## 76\n\n![](index-77_1.jpg)\n![](index-77_2.jpg)\n![](index-77_3.jpg)\n![](index-77_4.jpg)\n\
    ![](index-77_5.jpg)\n![](index-77_6.jpg)\n![](index-77_7.jpg)\n![](index-77_8.jpg)\n\
    \n## WEB DESIGN\nWeb Design by Mark Gillan\n\n### IMG TROUBLE\n\n#### Troubleshooting\
    \ for images\n\nMany learners face initial difficulties with coding and especially\
    \ involving images. Images are inserted into web pages by use of the `<img>` tag\
    \ within html and referring to an image file, either the file is resident upon\
    \ the web server or it is a URL link elsewhere. To assist with image problems,\
    \ here is a trouble shooting guide for everyone:\n\nLowercase should be used\n"
