    ## 职业资格教师 - MARK GILLAN

    ### 良好的整体设计


    #### 统一/和谐与多样性

    设计必须结合在一起，但要有足够的多样性，以确保观众不会很快失去兴趣。页面与页面之间应该保持一致性。访问者应该始终知道自己处于什么位置。


    根据要传达的信息进行设计

    考虑目标受众。字体、风格、颜色和布局必须匹配。设计必须与受众相关，并辅助呈现给观众的信息。它在大型企业的网站上可能看起来很好，但对于夜店或年轻观众并不合适。


