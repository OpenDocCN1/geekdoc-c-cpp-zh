    # Tips for web designers


    Copy and Paste is your friend. Instead of re-typing the same code over and over
    again with minor differences. Select, copy (`Ctrl+c`) and paste (`Ctrl+v`) with
    editing for differences thereafter.


    Use a markup editor, specifically designed for `html` and `css` as opposed to
    a simple text editor. Some are free but check the licence for use. It is not a
    necessity and it is advisable to learn from this book first before progressing
    onto a markup editor.


    `HTML` allows for comments to be inserted within the coding that will not appear
    or interfere in any way with the content or other coding. The purpose is to make
    notes related to the `html` for anyone requiring additional information or reasons
    for such coding. Ideal for reviewing and / or sharing with others. Use `<!--`
    followed by the actual comment itself, ensuring to end with `-->`.


    As for `CSS` comments, commence with `/*` followed by the actual comments and
    ensuring the end is with `*/`.


    Image editors often have a facility to “Save for web” and allow the user to reduce
    the file size and / or resolution.


    Padding can be used within `CSS` to provide the essential “white space” within
    web page design. `HTML` can also be used to provide blank line breaks where required
    using `<br>`.


    `RGB` colours can be defined by hexadecimal e.g. `#1111ee` or percentages e.g.
    `rgb(33%, 55%, 12%)` or indeed values e.g. `rgb(225,12,18)`.


    Most importantly, enjoy having fun designing web pages and using `html`, `css`
    along with so many other tools. You can use the following web address to access
    HTML guides and CSS guides: `www.idistancelearn.com/webdesign.html`


