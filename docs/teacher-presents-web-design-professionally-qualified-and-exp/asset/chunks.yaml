    HTML


    **The standards for everyone**


    So, what is HTML and why do we use it?


    HTML stands for Hyper Text Mark-up Language


    A language using “mark-up tags” that can be read by a web


    browser. HTML is the web page publishing language used


    around the world.


    Adheres to the rules of displaying web pages within web


    browsers, namely: http://


    which means Hyper-Text Transfer Protocol (HTTP)


    The language can be written in a simple text editor (Notepad for


    example) and saved as an HTML file using file extensions “.htm”


    or “.html” allowing computers to acknowledge and read the type


    of file and any file associations with programs.


    The HTML language has been updated over the years and


    continues to evolve with newer versions.


    Reminder


    HTML is the mark-up language used to build web pages,


    adhering to the protocol within web browsers of http, with web


    pages having a computer file extension of either .htm or usually


    a more appropriate .html allowing machines to associate the


    computer code with a web page. The tags provide indicators as


    to the content and how best to display within web browsers.


