    **WEB DESIGN**


    **Is there a common spelling error causing problems?**


    Common spelling errors include the following:


     collage.jpg instead of college.jpg


     frend.jpg instead of friend.jpg


     images.jpg instead of image.jpg


     art work.jpg instead of artwork.jpg


     scanedimg.jpg instead of scannedimg.jpg


    In other words, we can all fail to see spelling errors but it is so


    important with file names and must be checked carefully


    between the code and the actual file name itself.


    **Has the correct file extension been used?**


    tartan.gif instead of tartan.jpg makes a huge difference.


    Sometimes, a file can be incorrectly saved with file extensions.


    For example, tartan.jpeg.jpg meaning the actual name of the file


    is “tartan.jpeg” with the file extension of “jpg”.


    A common mistake with JPEG files is the use of .jpeg instead


    of .jpg within the code. A file can be shown on a computer as


    having a file extension of .jpeg but when we use html code we


    should use .jpg for the same file.


    **Is the code totally correct to enable the image to display?**


    Even the smallest of errors can make or break.


    For example:


    <imgsrc=tartan.jpg alt=incorrect code for the tartan image” />


    You might not see the error straight away – have some check


