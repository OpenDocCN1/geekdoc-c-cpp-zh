    ![](img/index-30_4.jpg)


    ## 职业资格教师 - MARK GILLAN


    ## 设计指南


    ### Quicktime 电影

    有些网站使用 Quick Time `.mov` 文件，这在网页上并不受欢迎，原因如下：

    - 未压缩的视频文件，体积通常非常大。

    - 最初为 Apple 平台创建，而非微软或其他许多平台。

    - 需要特定的插件才能查看视频。


    ### Flash 电影

    Flash 电影（`.swf` 文件格式）可能很有用、具有趣味性并能提供额外功能，但由于以下原因可能会给观众带来麻烦：

    - 浏览器需要 Adobe Flash Player 插件或独立的软件应用程序进行查看。

    - 可能会给屏幕阅读器带来问题。

    - 文件大。

    - 与各种移动设备和各种平台的兼容性问题。


    有些设计师过度沉溺于 Flash，只想展示自己的 Flash 能力，而不是网站本身的功能和用途。它还会分散其他信息的注意力。嵌入或链接到外部视频是一个有效的替代方案。


    **30**


    ![](img/index-31_1.jpg)


    ## 网页设计


    ### 导航

    导航必须简单

    - 屏幕阅读器需要在网页顶部有导航。如果设计师将导航放在页面的其他地方，会给屏幕阅读器用户浪费时间。

    - 导航应该易于使用、易于发现且让所有用户都能理解。否则……访问者会迷路并离开……再也不回来！


    ### 可读性和可访问性

    确保网站的所有访问者都能获取信息不仅是法律责任，也是社会责任。排除大群社区成员是不明智的。

    - 黑底白字可能是视觉障碍用户阅读的最糟糕的组合。

    - 每个人都应该能够查看、阅读和理解网页。

    - 机构承担着法律义务来考虑可访问性。

    - 屏幕阅读器要求网页符合标准，网络浏览器也有同样的需求。


    *学习笔记——尽可能照顾所有的用户*


    在进行设计创新的同时，确保网站对所有人都可用是一项困难。优秀的设计师能够为了网站的利益进行创意，而不仅仅是为了自己的自我满足。


    **31**


    ![](img/index-32_1.jpg)

    ![](img/index-32_2.jpg)

    ![](img/index-32_3.jpg)


    ## 职业资格教师 - MARK GILLAN


    ## 设计练习

    尝试这个练习以帮助理解网页的设计机制、优劣网页设计（此处应为“良好的网页设计 / 糟糕的网页设计”）、法律问题、用户需求以及用户可能如何判断他们使用网站的能力。


    ### 10 个网站

    浏览万维网，记录 10 个网站地址及其特征。尝试涵盖广泛的主题。


    ### 最好的五个

    根据设计、易用性、可访问性以及每个网站识别的尽可能类别，将它们分为前 5 个。


    ### 没那么好的

    将较差的 5 个网站按顺序排序，并从设计和网站可能存在的任何其他问题方面对它们进行评估。记录任何错误。


    ### 评价

    环顾网络并以设计者的视角查看每个网站，思考常见设计错误列表。你可能会对拼写错误、设计不一致、链接损坏以及更多问题感到惊讶。你甚至可能在知名网站和品牌名称中发现许多错误。你将如何确保你的网站没有这些错误？


    ### 设计师的素质

    在这个阶段，你正在像一个专业的网页设计师一样在思考。你认为网页设计师可能需要哪些素质？你考虑过网页设计原则和设计元素吗？网页最重要的素质是什么？


