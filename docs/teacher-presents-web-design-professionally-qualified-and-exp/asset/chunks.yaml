    ## CSS IN-PAGE

    ### Using CSS to format various inline and internal

    #### Inline Style

    An example for inline CSS would be the page background colour which can be different
    for each page. The background `body` colour might use “inline” style coding.


    ```html

    <body style="background-color:yellow;">

    ```


    We can also apply a CSS inline style to other elements in a similar way:


    ```html

    <h2 style="background-color: #00FF00;">Green background to heading 2 for this
    particular heading 2 on this page only.</h2>

    ```


    Other formatting can be accomplished using inline CSS, for example, font, size,
    alignment:


    ```html

    <p style="font-family:arial; font-size:18px; text-align:center;">This paragraph
    should appear in the arial family of fonts, size 18 pixels and with centre alignment
    upon the page. Other paragraphs would not be effected and default would apply.</p>

    ```


    We could apply variations to various other single occurrence of an element within
    a page. Try out the inline method for CSS.


