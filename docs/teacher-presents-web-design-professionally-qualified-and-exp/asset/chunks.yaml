    ## 网页设计


    ### 创建文件夹

    为了以节省时间、有序且正确的方式存放网页设计文件，能够创建文件夹是非常重要的。


    ### 导航

    导航到你想要新建文件夹的地方（双击将打开文件夹）。访问计算机上的任何文件夹，例如：`Documents` 文件夹或“计算机”。


    ### 快捷方式

    右键点击鼠标显示快捷菜单或使用 `File > New Folder`。示例显示了右键点击鼠标。


    ### 命令

    选择 `New > Folder`。


    ### 命名

    一个新文件夹被创建并等待文件夹名称。不需要点击任何地方，新文件夹名称已被选中并等待你的输入。


    ### 完成

    输入新的文件夹名称并按下键盘上的回车键。新文件夹已创建。


