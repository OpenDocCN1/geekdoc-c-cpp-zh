  trans: "\n\n1993 年 4 月，Mosaic 作为一种网页浏览器在上线成型，允许通过网络（互联网）查看计算机文件。尽管互联网流量中万维网数据的占比不到\
    \ 1%。\n\n然而，到 1995 年，Netscape 和微软 Internet Explorer 之间爆发了浏览器大战，见证了全球网流量的爆炸式增长。\n\
    \n![](img/index-15_1.jpg)\n![](img/index-15_2.jpg)\n![](img/index-15_3.jpg)\n\
    ![](img/index-15_4.jpg)\n![](img/index-15_5.jpg)\n\n## 网页设计\n\n1998 年，Google 开设了第一家办公室。从此，“网页”开始了了巨大的扩张，互联网上与网页相关的流量也随之增加。我们可以放心地说，网页真正始于\
    \ 20 世纪 90 年代中期，其普及速度比历史上任何其他技术都更受欢迎、更快速。到 2006 年，连接到的的服务器已超过 1 亿个。\n\n## 现代互联网——网页驱动\n\
    \n### 使用情况\n现在我们进入了 21 世纪，我们看到互联网的使用量持续增加，尤其是电子邮件和网页，尽管许多传统的互联网服务正变得基于网页，这无疑归功于网页浏览器的成功。例如，电子邮件和聊天已经演变为通过网页浏览器进行交互，视频聊天正在取代基于文本的客户端软件。\n\
    \n使用各种互联网服务不仅有趣，而且具有社会经济效益。我们可以丰富社交生活，寻找更廉价的产品，节省假期开支，进行在线调查并享受游戏，以及更多可能。在世界任何其他地方与朋友亲戚交流，或在自己舒适的家里受教育，为我们提供了几年前所没有的东西……便利、更低的成本以及尝试新技术的快感。列出在线服务的所有用途可能需要永远的时间。\n\
    \n### 优势\n除了上述优点，还有一年中每天 24 小时在自己舒适的家中购物的益处。人们选择在线购物和娱乐的原因是显而易见的。零售商本身也有许多益处，包括能够拥有全球销售渠道且几乎没有库存浪费。益处流向消费者，而实体店购物急剧减少……网页正在扩张。\n\
    \n![](img/index-16_1.jpg)\n![](img/index-16_2.jpg)\n![](img/index-16_3.jpg)\n\
    ![](img/index-16_4.jpg)\n![](img/index-16_5.jpg)\n![](img/index-16_6.jpg)\n![](img/index-16_7.jpg)\n\
    ![](img/index-16_8.jpg)\n![](img/index-16_9.jpg)\n![](img/index-16_10.jpg)\n![](img/index-16_11.jpg)\n\
    ![](img/index-16_12.jpg)\n![](img/index-16_13.jpg)\n\n## 专业资格教师 - MARK GILLAN\n\
    Mark Gillan 的网页设计\n\n## 设计原则\n\n### 设计原则与元素\n#### 设计规则\n要记住四个主要的设计原则：运动、平衡、强调和统一。每一个原则对整体设计都至关重要。在设计中找到最佳点意味着在每个过程中都必须考虑这四点。\n\
    \n- `Movement`（运动/律动）\n- `Balance`（平衡）\n- `Emphasis`（强调）\n- `Unity`（统一）\n\n![](img/index-17_1.jpg)\n\
    ![](img/index-17_2.jpg)\n![](img/index-17_3.jpg)\n![](img/index-17_4.jpg)\n![](img/index-17_5.jpg)\n\
    ![](img/index-17_6.jpg)\n![](img/index-17_7.jpg)\n![](img/index-17_8.jpg)\n![](img/index-17_9.jpg)\n\
    ![](img/index-17_10.jpg)\n![](img/index-17_11.jpg)\n![](img/index-17_12.jpg)\n\
    ![](img/index-17_13.jpg)\n![](img/index-17_14.jpg)\n![](img/index-17_15.jpg)\n\
    ![](img/index-17_16.jpg)\n![](img/index-17_17.jpg)\n\n### 设计元素\n在思考设计原则的同时，我们深入研究设计的深度和元素，开放我们的思维去接受：`Line`（线条）、`Shape`（形状）、`Texture`（纹理）、`Value\
    \ & Colour`（明度与色彩）以及最后同样重要的 `Space`（空间）。我们将在本中详细研究这些每一个元素。\n\n所以，视觉化这个列表有助于你记住它们……\n\
    - `LINE`（线条）\n- `Shape`（形状）\n- `TEXTURE`（纹理）\n- `Value & Colour`（明度与色彩）\n- `SPACE`（空间）\n\
    \n![](img/index-18_1.jpg)\n![](img/index-18_2.jpg)\n![](img/index-18_3.jpg)\n\n\
    ## 专业资格教师 - MARK GILLAN\n\n### 运动\n#### 预期运动\n我们一直在等待比萨斜塔倒下。为什么？因为我们脑海中有了预期的运动。我们经历过物体倾斜到倒下的程度。\n\
    \n#### 模糊轮廓\n具有模糊轮廓的图像被认为是正在移动的。\n\n#### 多重图像\n一种运动的过程，通过捕捉阶段来实现。开始、中间和结束。\n\n\
    #### 光学运动\n通过物体放置、颜色、策略性强调和曲线，强制眼睛从一个元素移动到另一个元素。\n\n 其他形式的光学运动\n眼睛可以从一个物体移动到另一个物体，欺骗大脑认为它正在移动。你是否曾坐在火车上觉得站台在移动？光学错觉可以做到这一点。眼睛可以从一个物体移动到另一个，欺骗大脑认为它正在移动。你是否曾坐在火车上觉得站台在移动？光学错觉可以做到这一点。眼睛可以从一个物体移动到另一个，欺骗大脑认为它正在移动。你是否曾坐在火车上觉得站台在移动？光学错觉可以做到这一点。视觉错觉可能会在整个设计中提供运动。从一个元素移动到另一个。\n\
    \n![](img/index-19_1.jpg)\n![](img/index-19_2.jpg)\n![](img/index-19_3.jpg)\n\
    ![](img/index-19_4.jpg)\n\n## 网页设计\n\n### 光学运动：不同手段\n下面的图像是光学错觉的良好例子，让眼睛在图像中移动以解释不符合我们认知的日常常态的情况。\n\
    \n黑点在哪里？你能让眼睛停在上面吗？\n\n![](img/index-20_1.jpg)\n![](img/index-20_2.jpg)\n![](img/index-20_3.jpg)\n\
    ![](img/index_20_4.jpg)\n![](img/index-20_5.jpg)\n![](img/index-20_6.jpg)\n\n\
    ## 专业资格教师 - MARK GILLAN\n\n### 更多视觉感知\n再玩玩光学错觉。有些人可能会称它们为骗术，但实际上它们只是光学错觉。它们与我们认知的现实不同的视觉感知物体和图像。正如提到的，现实只是我们对周围世界的预设、训练和有限感知。尝试理解这些——\n\
    \n花瓶还是两个脸？\n\n### 让它流动\n设计师引导的运动被称为“流”，用于确保观众的眼睛仔细看向设计师意图的地方。例如，可能会有一个立即吸引注意的图形通过视觉流引导至故事、链接、购买点或设计师希望观众查看的任何区域。\n\
    \n各种技术被用于视觉流，包括曲线、箭头、渐变、透视、图像内的运动、文本元素、指针甚至是模型的视线方向。\n\n![](img/index-21_1.jpg)\n\
    ![](img/index-21_2.jpg)\n![](img/index_3.jpg)\n\n## 网页设计\n\n### 严肃思考\n尝试思考这些问题：\n\
    - 眼睛是如何穿过网页的？\n- 图像是否有助于运动？\n- 页面的每个部分是否鼓励运动？\n- 我们移动得太快还是太慢？\n- 浏览整个页面/图像时是感到无聊还是遵循了开始、中间和结束？\n\
    - 使用了什么样的运动？\n- 设计师如何确保观众穿过网页？\n\n### 你对运动的个人意见\n下次你访问某些网站时，参考上述问题并思考你自己的答案。\n\
    \n"
- fmt: "\nAsk someone else to do the same. Now, ask them the above questions. Possibly\
    \ ask a few more people to assist your questioning. Get comfortable asking others\
    \ for their opinions … web designers need varying opinions.\n\n## 21\n![](index-22_1.jpg)\n\
    ![](index-22_2.jpg)\n![](index-22_3.jpg)\n\n## Professionally Qualified Teacher\
    \ - MARK GILLAN\n\n### Balance\n\n### Symmetrical (formal balance)\nUsing a vertical\
    \ line will highlight a mirror image. It is pleasant to the eye. Think about how\
    \ beautiful people tend to have a more symmetrical face than others. Our brains\
    \ find an immediate order and is content with looking at all other parts within\
    \ the order of appearance.\n\n### Asymmetrical (informal)\nAlthough not mirrored,\
    \ our brain can find comfort with other parts performing the function of a level\
    \ order. A balance can be found in many other ways such as lots of small objects\
    \ being offset by one large object, as well as:\n\n- **Colour balance** … we tend\
    \ to look for vibrant colours first and as long as we have a balance across the\
    \ display then our brains find comfort.\n- **Value** … balance between light and\
    \ dark.\n- **Shape** … across the whole display, offering the viewer a balance\
    \ of shapes on one side as opposed to the other.\n- **Positioning** … A sharp\
    \ object in the foreground and less distinctive objects in the background but\
    \ balancing each against each other.\n- **Texture** … using a balance of texture\
    \ can provide movement of the eye across two very different objects but providing.\n\
    \n### Radial\nAll parts of a display radiate from the centre, providing balance\
    \ outward in all directions.\n\n## 22\n![](index-23_1.jpg)\n![](index-23_2.jpg)\n\
