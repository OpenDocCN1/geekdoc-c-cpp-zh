    ## BOOK USE


    ## Introduction


    This book has been written by a professionally qualified lecturer, teaching classes
    at various levels and abilities. It is presented using short chapters consisting
    of exercises and guides similar to the delivery within a classroom. You will be
    shown, asked to perform the task, check the result and proceed from one chapter
    to the next.


    Web design is not only fun, it is a necessity for the age today. We offer products,
    services, information, statistical data, news and so much more. We depend upon
    web designers to produce websites providing functionality combined with everything
    a user requires, without error but ensuring any visitor enjoys their journey ‘hassle’
    free.


    Internet use has snowballed faster than any other technology in history. Web design
    is at the heart of any business, personal online presence and hobbies. The world
    needs web designers, now more than ever. Not only do we use the web on a regular
    basis nowadays, when moving house, we look to have a connection to gas, electricity
    and water supplies … up with these priorities is the internet broadband connection.


    **8**


    ![](index-9_1.jpg)

    ![](index-9_2.jpg)

    ![](index-9_3.jpg)


    # Introduction


    This book assists with understanding the world wide web, design concepts, building
    web pages and the power of style. It is presented using short chapters consisting
    of exercises and guides similar to the delivery within a classroom. You will be
    shown, asked to perform the task, check the result and proceed from one chapter
    to the next.


    At the end of this book, you should be able to design, code, test, review and
    upload a website. No formal knowledge of web design is required to begin this
    book. A small amount of knowledge using a computer is required. No-one is a total
    expert with the use of a computer, it is the fact some know more than others and
    we are all learning… everyone continues to learn. We should all be open to new
    experiences, new knowledge and expanding our minds. The person who shouts “I know
    how to use a computer” is the same person who finds it difficult to learn because
    they think they know it all… they don’t, believe me.


