    **Italics and other text formatting tags**


    Let’s have a look at some more handy text formatting tags.


    Italics


    Italicised text can be displayed using the <i> tag, just as basic


    as the <b> tag. Most tags are paired, such as <i> </i>


    Superscript and Subscript


    Text which is slightly elevated above or below the standard line


    of text on a page and reduced in comparable size is termed as


    Superscript (higher) and Subscript (below). Superscript tends to be


    used for footnote indicators. The tags are <sup> and <sub>


    respectively. As usual with paired tags, <sup> </sup>


    Example: strong, bold, italics, sub and superscript


