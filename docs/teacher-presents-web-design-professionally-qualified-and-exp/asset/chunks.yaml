    ## THE INTERNET


    ### Background of the internet and the web


    #### Understanding the world wide web


    #### The Net and Web


    First of all, it is important to understand what you are dealing with. The `net`
    and the `web` are NOT the same thing. So many people nowadays use the terms as
    the one, which is not entirely technically correct. In fact, put it this way,
    the internet has been around for about 7 decades in various forms whereas the
    World Wide Web is only around 4 decades in age. So, they could not possibly be
    the same.


    ##### Internet Definition


    The internet can be defined as a network of computers, a super network of networks
    with computers connected to other computers to link networks with networks. It
    is the hardware connections. The internet has a history much longer than the `World
    Wide Web` as we can see from the beginnings…


    #### History of the internet


    The reason

    Believe it or not, the internet came into existence because of the cold war and
    originally as a warfare communications master as opposed to anything friendly.
    In the late 1950’s, 4th October 1957 to be more exact, the USSR (Soviet Union
    as it was back then) launched `Sputnik`, the first earth orbiting artificial satellite
    also the first in a series within the `Sputnik Program`.


    # 11


    ![](index-12_1.jpg)

    ![](index-12_2.jpg)


    ## Professionally Qualified Teacher - MARK GILLAN


    #### Internet beginnings


    The USA (United States of America) obviously found the launch of `Sputnik` to
    be a threat and immediately brought about the inception of `DARPA` (Defense Advanced
    Research Projects Agency) to look at communication developments and in particular
    interconnecting network of information through computerisation.


    ##### Importance of a computer network


    If we imagine the importance placed upon communications within warfare, we will
    understand the USA reaction to `Sputnik`. Consider how a military coup takes place,
    whereby radio and television stations are the first targets for military operations.
    Once these installations are captured, controlled and operated, the nation is
    under the spell. Information is powerful, a very powerful tool, as it motivates,
    collaborates and dictates. Information moves troops, it analyses situations by
    gathering specific data and it distributes powerful warfare strategies.


    Communication is required for almost every action for the control of people, movement
    of troops, data collection, through to distribution of propaganda, along with
    government secrets and discussion via communication lines. The faster and more
    secure the lines of communication, the more equipped an army will be within warfare.
    Thus we can see the reasoning behind wanting a network of communication links
    that must be better than any opponent.


