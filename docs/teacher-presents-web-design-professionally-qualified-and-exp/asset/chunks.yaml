    ## CHARACTERS

    ### Correctly using code for special characters

    Special characters are displayed depending upon the language settings for either
    html or for the web browser priorities applied by the user (or the default). We
    have all come across web pages with strange appearing characters instead of apostrophes
    or currency or various other mistakenly displayed entities.


    We can attempt to ensure the character the web designer had selected for display
    is normally displayed by using the entity name recognised by html or the entity
    / character number (or hexadecimal representation). **Note: ampersand and semi-colon**


    For example, for the copyright symbol to correctly display, we have options within
    html using either `&copy;`.


    ```html

    <html>

    <head>

    <title>Special Characters</title>

    </head>

    <body>

    Copyright ©

    </body>

    </html>

    ```

    **93**

