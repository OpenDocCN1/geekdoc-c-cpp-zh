    (Uniform Resource Locator) with:


    http://


    at the start of the line.


    If you do not have a home page showing, click within the


    address bar and type: www.skooshmedia.com


    http stands for: Hyper Text Transfer Protocol


    The http tells the browser what rules (protocol) to follow for the


    display of a file, for example: Hyper Text files – html coded files.


    Protocols mean everyone around the world using these rules


    must abide by them for everything to run correctly, smoothly and


    as it is meant. As with most


    protocols and etiquette ...to


    everyone’s benefit, enjoyment


    and understanding.


    The www is very common but is not totally necessary to view a


