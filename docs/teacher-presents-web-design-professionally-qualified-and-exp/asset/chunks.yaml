    \ … the tag is `<ul>` and end list `</ul>`\n\nDescriptive List … the tag is `<dl>`\
    \ and end list `</dl>`\n\nIf we take each one in turn:\n\n### Ordered List `<ol>`\
    \ followed by items `<li>`\nUsed in combination with a list item tag in between\
    \ the Ordered List pair. List items have a logical sequence, usually numbered.\n\
    \n### Unordered List `<ul>` followed by items `<li>`\nAlso used in combination\
    \ with a list item tag, similar to the ordered list. Tends to be bullet points\
    \ with no sequential order.\n\n### Definition List `<dl>` followed by items /\
    \ description \nThe `<dt>` tag is the descriptive term (similar to a list item)\
    \ followed by `<dd>` being the definition description. For example, a term of\
    \ `<dt>Tiger</dt>` followed by the description `<dd>A large cat with very large\
    \ teeth ready to use them</dd>`.\n\n**63**\n\n![](index-64_1.jpg)\n![](index-64_2.jpg)\n\
