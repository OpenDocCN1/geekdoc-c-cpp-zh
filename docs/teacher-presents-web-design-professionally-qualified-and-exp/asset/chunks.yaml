    LAYOUT


    **Options and ideas for page layout**


    HTML now has layout tools in the form of semantic tags,


    providing a means of quickly generating code for layout


    purposes. This code can obviously be formatted using CSS and


    may assist with layout at the same time within such styling.


    Note: Semantic tags clearly describe the meaning to the


    browser and the web designer. For example, <table> or <form>


    The main semantic tags used for layout are:


    **<header>**


    Possibly self explanatory, introduction to a page or a section.


    **<nav>**


    You have guessed … navigation, for hyperlinks to other pages.


    **<article>**


    An independent piece of content, such as a blog entry or news


    story or a piece of editorial.


    **<section>**


    Defining section, often with a header of its own.


    **<aside>**


    Non essential content but relevant to the article or section.


    **<footer>**


    Again, self explanatory. End part of a page or section.


