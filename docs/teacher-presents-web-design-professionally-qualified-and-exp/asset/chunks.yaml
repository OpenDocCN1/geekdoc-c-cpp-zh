    ### 记事本

    `Notepad` 适用于 Microsoft Windows 和其他操作系统。可以在“附件”菜单中找到它，也可以通过搜索计算机上的可用程序找到它。可以使用任何文本编辑器。不需要非得
    `Notepad`。市场上的许多文本编辑器都足够处理文本。


    将文件保存为 `.html` 就会告诉计算机生成网页——不用担心！


