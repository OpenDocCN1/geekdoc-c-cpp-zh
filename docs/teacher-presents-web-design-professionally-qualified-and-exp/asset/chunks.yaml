    ## CSS

    ### Cascading Style Sheets for Web Design

    Cascading Style Sheets (CSS) consists of instructions for the display of html
    elements. External CSS can be code typed within a text file and saved as a .css
    file in a similar fashion to .html files. CSS can also be written into html files,
    although external CSS files are more powerful across the whole of website and
    saves time, effort as well as acting as a central point for the control / display
    instructions for elements. Prior to the increased usage of CSS, the formatting
    and layout for html pages consisted of a large amount of instructions duplicated
    across many pages.


    CSS syntax consists of selector and a declaration block…

    Explanation

    The selector points to the html element for the style to influence. Within curly
    brackets, declarations are separated by semicolons, each declaration consisting
    of a noted property and its designated value separated by a colon.


    ### CSS Example

    To assist with readability, CSS declarations can each be placed on separate lines.
    Common practice is to place the opening curly bracket (brace) immediately after
    the selector, next line down commencement of the declaration and the last declaration
    within the CSS coding ending with a curly bracket on an individual line to ensure
    viewing of the end is clear.


    ```css

    h1 {

    color:green;

    text-align:center;

    }

    ```

    Notice US American English spelling and the correct syntax as previously discussed.
    It is important to ensure the correct use of curly brackets, colons and semi-colons.

