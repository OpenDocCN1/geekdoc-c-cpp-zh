    ## 职业资格教师 - MARK GILLAN


    ### 强调 (Emphasis)

    通过在页面或图像内使用焦点来吸引注意力：


    ### 通过对比产生强调

    - 前景中较大的主体会成为焦点。例如颜色，绿草地中一朵孤独的红色罂粟花会立即成为一个焦点。

    - 线条配合各种水平物体，一个孤立的垂直物体会自动吸引眼球。

    - 通过不规则的形状将视线引导到任何标准的几何形状，因为大脑会在混乱中寻找秩序。


    ### 通过隔离产生强调

    - 留白中的单立项目会吸引视线。

    - 分组的对象中，将单个物体孤立地放置在侧边将成为自然的焦点，因为我们的大脑会质疑为什么某物会被孤离开群体。我们天生的社会整合提问机制会起作用。


    ### 通过位置产生强调

    - 将物体置于中央通常会被视为焦点。

    - 放置在透视线之间的物体通常会被首先注意到。


