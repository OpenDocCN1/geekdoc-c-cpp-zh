    ![](index-37_2.jpg)\n![](index-37_3.jpg)\n\n# WEB DESIGN\nWeb Design by Mark Gillan\n\
    \n## HTML\n\n### The standards for everyone\nSo, what is HTML and why do we use\
    \ it?\n\nHTML stands for Hyper Text Mark-up Language. A language using “mark-up\
    \ tags” that can be read by a web browser. HTML is the web page publishing language\
    \ used around the world.\n\nAdheres to the rules of displaying web pages within\
    \ web browsers, namely: `http://` which means Hyper-Text Transfer Protocol (HTTP)\n\
    \nThe language can be written in a simple text editor (`Notepad` for example)\
    \ and saved as an HTML file using file extensions `.htm` or `.html` allowing computers\
    \ to acknowledge and read the type of file and any file associations with programs.\n\
    \nThe HTML language has been updated over the years and continues to evolve with\
    \ newer versions.\n\n### Reminder\nHTML is the mark-up language used to build\
    \ web pages, adhering to the protocol within web browsers of `http`, with web\
    \ pages having a computer file extension of either `.htm` or usually a more appropriate\
    \ `.html` allowing machines to associate the computer code with a web page. The\
    \ tags provide indicators as to the content and how best to display within web\
    \ browsers.\n\n37\n![](index-38_1.jpg)\n![](index-38_2.jpg)\n![](index-38_3.jpg)\n\
    ![](index-38_4.jpg)\n![](index-38_5.jpg)\n![](index-38_6.jpg)\n\n## Professionally\
    \ Qualified Teacher - MARK GILLAN\n\n### Quick Task—Exercise\nTry this quick exercise\
    \ to understand the use of HTML and the protocol of HTTP:\n\n1. Launch your web\
    \ browser (for example, Microsoft Internet Explorer or Google Chrome or Firefox\
    \ or indeed any other).\n2. Notice the address bar showing the home page URL (Uniform\
    \ Resource Locator) with: `http://` at the start of the line.\n3. If you do not\
    \ have a home page showing, click within the address bar and type: `www.skooshmedia.com`\n\
    \n`http` stands for: Hyper Text Transfer Protocol. The `http` tells the browser\
    \ what rules (protocol) to follow for the display of a file, for example: Hyper\
    \ Text files – html coded files. Protocols mean everyone around the world using\
    \ these rules must abide by them for everything to run correctly, smoothly and\
    \ as it is meant. As with most protocols and etiquette...to everyone’s benefit,\
    \ enjoyment and understanding.\n\nThe `www` is very common but is not totally\
    \ necessary to view a web page… the `http` is certainly important and although\
    \ we do not have to physically type it into the address bar ourselves, the URL\
    \ once connected will attempt to utilise the relevant protocol. The HTML (Hyper\
