    ## 网页设计

    ### 设计元素

    设计的原理是我们我们如何运用元素。


    ### 线条

    线条的方向可以传达情绪，例如，水平线是镇静的，垂直线则更具动态活力。


    ### 形状

    形状可以是色彩排列或闭合的线条形成的形状。曲线是友好且具有吸引力的。


    ### 纹理

    让物体具有深度，为观众提供表面印象并可以被使用。


    ### 调值 (Value)

    区域的相对明亮或黑暗程度。增加或减少调值可以提供焦点，并营造深度。


    ### 颜色

    暖色（如红色、橙色和黄色）倾向于前进，而冷色（如蓝色和绿色）倾向于后退。


    ### 空间

    有时被称为 `white space`，是有益的。留出空间让一切看起来井然有序而不混乱。


