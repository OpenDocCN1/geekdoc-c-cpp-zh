    # 机器人


    ## 搜索引擎优化与元数据

    大多数网站设计师都希望他们的作品被看到。


    获取访问者的方法包括（但不限于）：


    1. 在每一个机会向每个人的耳边低语网站细节以及如何获取更多信息。

    2. 使用老式的钢笔或铅笔在任何可见的纸张上写下网址（在适当的情况下，对官方或业务文档要加小心）。

    3. 在每份业务文档（如名片和信头纸）上打印网址地址。

    4. 在任何公司车辆上展示网址地址。

    5. 通过任何可用的媒体（免费/付费/代理）投放广告。

    6. 强迫用户点击链接，尽管在网上定位超链接的法律要容易得多。

    7. 设计网站以协助搜索引擎对网站内页面的解释，从而进一步提高搜索引擎列表的排名次次。


    搜索引擎优化（SEO）是任何 **51** 网页设计中的重要部分，而且有许多推广网站的方法。


    ![](img/index-52_1.jpg)

    ![](img/index-52_2.jpg)


    ## 职业资格教师 - MARK GILLAN

    大型搜索引擎拥有软件定期爬取数以十计的网页，寻找新的、旧的和更新的页面以便在它们的列表中进行排名。这些软件通常被称为“机器人”（bots）或“机器人”（robots）或“网络爬虫”（web
    crawlers），或者说是“蜘蛛”（spiders）。


    一个名为 `robot.txt` 的纯文本文件可以放置在网络服务器上，供在线搜索引擎机器人访问，用于指示哪些页面是可用的，并通常帮助机器人快速浏览网站。


    ### 空的 robot.txt 文件

    默认情况下，除非另有说明，否则机器人将抓取所有内容。如果机器人无法查看每个页面且没有可用的 `robots.txt` 文件，它将返回“404 错误”，这意味着搜索引擎会认为页面离线或对客户体验不佳。这意味着搜索引擎可能会降低页面排名，或者完全不排名。


    一个空的 `robots.txt` 文件将允许机器人在立即爬取网站时访问某些内容，并将继续获取其能获取的任何信息，而不会在服务器上记录任何“404 错误”数据日志。


    字体 非限制性爬取的示例—robots.txt

    与其创建一个空文件，不如生成一个可能让人感到放心并提供帮助的文件。这并不费力，只需在一个新的空白记事本文件中输入以下内容：


    ```text

    User-agent: *

    Allow: /

    ```


