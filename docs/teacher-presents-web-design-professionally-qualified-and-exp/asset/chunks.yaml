    web design and there are so many ways to promote a website.


    Large search engines have software trawling through those


    billions of web pages on a regular basis looking for new, old and


    updated pages to rank within their listings. The


    software is often referred to as ‘bots’ or ‘robots’


    or ‘web crawlers’ or indeed spiders.


    A plain text file named robot.txt can be placed


    on the web server ready for the online search


    engine bot to pay a visit, instructing what


    pages are available and generally assisting the


    robot to quickly look over the website.


    Blank—robot.txt files


    By default, robots will crawl through everything unless otherwise


    advised. If the robot is unable to view every page and no


    robots.txt file is readily available, it will return a “404 error” which


    means the search engine will consider pages offline or


    unpleasant for their customers. This will mean the search


    engine might rank pages lower or not at all.


    A blank robots.txt file will allow the robots access to something


    upon immediate crawling of the website and will continue to


    result any information as far as it can, without any “404 error”


    data log being recorded on the server.


    Example for non restrictive crawling of files—robots.txt


    Instead of a blank file, it would be better to produce a file that is


    more likely to reassure and assist.


