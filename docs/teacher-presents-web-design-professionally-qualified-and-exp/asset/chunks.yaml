  trans: "\n不受影响，尽管浮动元素之后的元素应该环绕它浮动。这意味着，如果指令图片向右浮动，则图片后的文本应该环绕浮动元素向左排列。\n\n### 111\n\
    \n![](img/index-112_1.jpg)\n![](img/index-112_2.jpg)\n![](img/index-112_3.jpg)\n\
    \n### 职业资格教师 - MARK GILLAN\n\n#### 浮动示例\n\n```css\nimg {\n  float: right;\n}\n\
    ```\n\n如果设计要求各种元素（通常是图像）相邻浮动，只要空间足够，这是可以实现的。这对于图像缩略图库可能是需要的。\n\n#### 相邻浮动示例\n\n\
    ```css\n.thumbnails {\n  float: left;\n  width: 80px;\n  height: 70px;\n  margin:\
    \ 10px;\n}\n```\n\n有时设计需要一种情况，使得后续文本不会像之前显示的那样环绕排列。可以使用 `clear` 属性来指定其他元素不允许出现在浮动元素的哪侧。\n\
    \n#### 清除浮动示例\n\n```css\n.text_line {\n  clear: both;\n}\n```\n\n### 练习\n\n编写一个包含各种元素的新网页，包括图像和缩略图库。尝试四种方法中的每一种，并在适当控制重叠和浮动（带文本的图像）。\n\
    \n### 112\n\n![](img/index-113_1.jpg)\n![](img/index-113_2.jpg)\n![](img/index-113_3.jpg)\n\
    \n### 网页设计\nMark Gillan 网页设计\n\n## 表格格式\n\n### 使用 CSS 进行表格的高级格式\n\n表格可以是以表格形式显示所有类型数据的强大工具，使信息一目了然、易于理解，并且与大量的文本或列表相比，布局对观众更具吸引力。\n\
    \n然而，表格可能会有点无聊，除非将表格的 CSS 格式与字体大小、边框颜色和粗细等格式结合起来。\n\n在书的前面我们查看了实用的表格格式化，例如列跨、单元格拆、表头和表脚。CSS\
    \ 表格格式化可以应用于表格结构的各个方面，以更改边框、插入标题、显示单元格，而样式表格式可以提供更多可能。\n\n与任何元素一样，CSS 可以关联到页面或整个网站中任何表格的出现或任何表格所需的布局和格式。CSS\
    \ 表格的编码与任何其他元素的 CSS 编码相似，并且可以包含几乎任何其他 CSS。\n\n良好使用表格可能适用于大多数可能出现在电子表格中的表格化数据。例如：定价、财务数据、日历、事实和数字。而糟糕的表格用法则是仅用于布局——这可不是好主意！\n\
    \n### 113\n\n![](img/index-114_1.jpg)\n![](img/index-114_2.jpg)\n![](img/index-114_3.jpg)\n\
    ![](img/index-114_4.jpg)\n![](img/index-114_5.jpg)\n\n### 职业资格教师 - MARK GILLAN\n\
    \n#### 合并表格边框\n\nHTML 中的标准表格在每个单元格的四周都有内边框和外边框。合并边框提供了一种消除内外框之间间隔的方法，产生单一边框。\n\
    \n#### 示例\n\n```css\ntable {\n  border-collapse: collapse;\n}\n\ntable, th, td\
    \ {\n  border: 1px solid black;\n}\n```\n\n上述意味着使用 `border-collapse: collapse;`，单元格将具有\
    \ 1px 宽的实黑色边框。\n\n建议：返回 HTML 表格章节以获取有关控制表格行、列、头和脚的信息。\n\n#### 标题\n\n要放置标题并控制其位置，请使用\
    \ `caption-side` 属性设置为 `bottom` 或 `top`（自言自明，`top` 为默认值）。\n\n#### CSS 代码行\n\n\
    ```css\ncaption-side: bottom;\n```\n\n在 HTML 本身中——添加 `<caption>文本`</caption>`\n\
    \n### 114\n\n![](img/index-115_1.jpg)\n![](img/index-115_2.jpg)\n![](img/index-115_3.jpg)\n\
    \n### 网页设计\nMark Gillan 网页设计\n\n## 布局\n\n### 页面布局的选项和想法\n\nHTML 现在以语义化标签的形式提供了布局工具，提供快速生成布局用途代码的方法。这些代码显然可以使用\
    \ CSS 进行格式化，并可以在此类样式中辅助布局。\n\n注意：语义化标签向浏览器和网页设计师清晰地描述了含义。例如 `<table>` 或 `<form>`。\n\
    \n用于布局的主要语义化标签有：\n\n- `<header>`：可能自言自明，页面或章节的引言。\n- `<nav>`：你猜对了……导航，用于通向其他页面的超链接。\n\
    - `<article>`：独立的内容实体，例如博客文章、新闻故事或社论。\n- `<section>`：定义章节，通常有自己的标题。\n- `<aside>`：非本质内容，但与文章或章节相关。\n\
    - `<footer>`：同样，自言自明。页面或章节的结束部分。\n\n### 115\n\n![](img/index-116_1.jpg)\n![](img/index-116_2.jpg)\n\
    ![](img/index-116_3.jpg)\n\n### 职业资格教师 - MARK GILLAN\n\n#### 布局——结合 html 和 css\n\
    \n如果我们考虑上一页中提到的语义化标签如何在网页中工作。我们现在可以查看 html 编码。这里是 html 编码的示例。\n\n### 116\n\n![](img/index-117_1.jpg)\n\
    ![](img/index-117_2.jpg)\n![](img/index-117_3.jpg)\n\n"
- fmt: '

    Basic spelling mistakes can cause problems, especially when you can’t see them
    first time round. Very carefully check the spelling, check it again and keep checking.
    Just in case, ensure spaces are not used within file names. A very common issue.


    ## 120


    ![](index-121_1.jpg)


    ## WEB DESIGN


    ### Is there a common spelling error causing problems?


    Common spelling errors include the following:


    - `collage.jpg` instead of `college.jpg`

    - `frend.jpg` instead of `friend.jpg`

    - `images.jpg` instead of `image.jpg`

    - `art work.jpg` instead of `artwork.jpg`

    - `scanedimg.jpg` instead of `scannedimg.jpg`


    In other words, we can all fail to see spelling errors but it is so important
    with file names and must be checked carefully between the code and the actual
    file name itself.


    ### Has the correct file extension been used?


    `tartan.gif` instead of `tartan.jpg` makes a huge difference. Sometimes, a file
    can be incorrectly saved with file extensions. For example, `tartan.jpeg.jpg`
    meaning the actual name of the file is `tartan.jpeg` with the file extension of
    `jpg`.


    A common mistake with JPEG files is the use of `.jpeg` instead of `.jpg` within
    the code. A file can be shown on a computer as having a file extension of `.jpeg`
    but when we use html code we should use `.jpg` for the same file.


    ### Is the code totally correct to enable the image to display?


    Even the smallest of errors can make or break. For example:


    ```html

    <imgsrc=tartan.jpg alt=incorrect code for the tartan image” />

    ```


    You might not see the error straight away – have some check for you if you can
    or leave it for a while and go back to look.


    ## 121


    ![](index-122_1.jpg)

    ![](index-122_2.jpg)

    ![](index-122_3.jpg)


    ## Professionally Qualified Teacher - MARK GILLAN


    ### Web design troubleshoot and check


    - **Links**: Do they work? Are they placed appropriately?

    - **Images**: Do they appear as they should? Are the file sizes appropriate?

    - **Information**: Is it all correct? Is there anything misleading or unsure?

    - **Spelling**: Have you checked it all? Did you research correct spelling?

    - **Read**: How does it read, does it sound right? Has it been proofread?

    - **Navigation**: Is it easy to move around? Is it logical? Can others use okay?

    - **Appearance**: Do the colours work? Is the layout appropriate for the audience?

    - **Accessibility**: Are all the `alt` tags present? Would a screen reader be
    accessible? Would colour blindness be a problem?

    - **Legal**: Have you checked copyright and all legal obligations?

    - **Standards**: Does the mark-up code meet recent standards? Would the website
    be viewable cross platform / web browser?


    ## 122


    ![](index-123_1.jpg)

    ![](index-123_2.jpg)

    ![](index-123_3.jpg)


    ## WEB DESIGN


    ### User review and report


    Ask someone to review your website and have them complete a report form to ensure
    everything is correctly covered in detail. Reporting must be unbiased and based
    upon the first impressions of a visitor browsing your web design offerings. Do
    not explain anything to the user – let them come to their own conclusions.


    - What is the initial impression?

    - Is the web page pleasing to the eye?

    - Does the web page look interesting?

    - Did it load quickly?

    - Are you tempted to read or do you want to see something more interesting online?

    - Is the text easy to read?

    - Are there any mistakes: spelling, grammar, reading, visual ... Any mistakes
    at all?

    - Do you feel comfortable looking around the website?

    - Can you locate links easily enough? Do they all work?

    - Are the images interesting, do they fit into the overall feel?

    - Is there good use of colours or too many / not enough?

    - Does the web page look professional?

    - Does the whole of the website have the same feel to it?

    - Would you return to this website if it was available online?

    - How does the website make you feel – happy, sad, frustrated, disappointed, enthused,
    confused, thrilled, amused, smiley?

    - Does the browser show the website correctly or does it mention ‘Done with errors’
    or might there might be errors?

    - Would you change anything?

    - How would you improve the design?


    ## 123


    ![](index-124_1.jpg)

    ![](index-124_2.jpg)

    ![](index-124_3.jpg)


    ## Professionally Qualified Teacher - MARK GILLAN


    ### Other issues


    #### Broken links

    Check every link throughout your website to ensure the link is not broken or takes
    the user to a different place. These errors can actually have negative impact
    within search engines and might lose the trust for many visitors. Return to your
    code and fix any problems by carefully looking through each link.


    #### Missing text

    Another common issue for web pages where the code has no closing tag or is not
    coded correctly in some other way, such as incorrect layout. There could be a
    problem with the `html` or `css`.


    #### Too much scrolling

    If the visitor has to scroll horizontally back and forth or excessively down the
