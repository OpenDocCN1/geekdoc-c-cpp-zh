    ## Submit Button

    The input control can be used to produce buttons by setting the attribute `type`
    value within the `input` tag to “submit” and the web browser should display an
    applicable submit button. A submit button should automatically know how to operate
    in conjunction with the form `action` and `method` attributes for the form. The
    information for either the “post” or “get” method instructs how to submit / send
    the form data—the exact nature for these operations would be advised by the service
    provider you engage for the “form to mail”. More information for web hosting is
    provided later within this book.


    ### Example

    Using the input control within the form …

    ```html

    <input name="Submit" type="submit" value="Submit" />

    ```

    The value of “Submit” instructs the button to display the submit wording and the
    `type` instructs the web browser to calculate.


    ## Reset Button

    Similar to the submit button, the `<input />` tag can be used with the reset functionality.


    ### Example

    ```html

    <input name="Reset" type="reset" value="Reset" />

    ```

    It is advisable to clearly emphasise to the user, the clicking of the reset button
    will clear all data … to avoid frustration!


