    Create a new web page, saving the html file as: `register.html`. Request the following
    information from the user, along with the use of relevant form controls.


    **Data required:**

    | Type of data | Additional info |

    | :--- | :--- | :--- |

    | Full Name | Text | Placeholder |

    | Describe themselves | Text—multiline | Large text area |

    | Colour of eyes | Dropdown | Selection of colour within a grouped input area—with
    a legend of “Eyes” |

    | Rating for voice level | Range of 1—20 | Slider / range selector between a minimum
    voice level of 1 up to a maximum loudness of 20 |

    | Email address | Email input | Placeholder |

    | Password | Password input | Should use dots or asterisk for view |

    | Submit form | Submit button | Include reset option button |


