    # 引言


    本书帮助理解世界网、设计概念、网页构建以及样式的力量。本书采用由练习和指南组成的短章节形式，类似于课堂教学方式。你将看到、被要求执行任务、检查结果，并进入下一个章节。


    在本书结束时，你应该能够设计、编码、测试、评审和上传网站。开始本书不需要正式的网页设计知识。只需要少量的计算机使用知识。没有人是计算机使用的完全专家，事实是某些人比别人懂得多，我们都在学习……每个人都应该对新体验、新知识和扩展思维保持开放态度。那些大声说“我知道如何使用电脑”的人往往是最难学习的人，因为他们认为自己无所不知……他们并不是，相信我。


