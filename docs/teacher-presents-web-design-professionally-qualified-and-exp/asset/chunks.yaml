    FORMAT TABLES


    **Advanced formatting of tables using CSS**


    Tables can be a powerful tool for displaying all types of data in a


    tabular presentation, making the information easy upon the eye,


    understandable and a layout more inviting for the viewer as


    opposed to a large amount of text or listings.


    However, tables can be a little boring, unless CSS formatting for


    tables is combined with other formatting such as font size,


    border colour and weight.


    Earlier in the book we looked at handy table formatting for the


    likes of column span, cell splitting, table header and table footer.


    CSS table formatting can be applied to various aspects of table


    structure to alter borders, insert captions, display of cells and


    style sheet formatting can offer so much more.


    As with any element, CSS can be associated with any


    occurrence of tables or required layout and formatting of any


    table throughout the page or entire website. The coding for CSS


    tables is not only similar to any other element CSS coding but


    can have almost any other CSS incorporated.


    Good use of tables might be for most tabular data that might


    otherwise appear in a spreadsheet. For example, pricing,


    financial data, calendar, facts and figures. Whereas, poor use of


    tables would be for layout only—not a good idea!


