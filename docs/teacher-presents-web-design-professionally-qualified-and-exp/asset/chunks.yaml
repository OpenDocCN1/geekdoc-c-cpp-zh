    ## 粗体

    ### **文本的强粗粗格式化**

    为了确保读者注意到页面的某些文本或强调部分，我们将使用相关的快速格式化标签，将读者的注意力引到设计师希望的区域。


    如今，大部分格式都是使用层叠样式表（CSS）编写的，我们将在本书的后续章节对其进行详细介绍。


    同时，我们将使用根据世界维网联盟（W3C）和大多数网页浏览器的当前批准标准下允许的基本格式。


    在格式上，“strong”（强效）和“bold”（粗体）之间存在细微差别，尽管它们在网页浏览器中显示相同，但对搜索引擎的解释对 SEO（搜索引擎优化）至关重要，因为机器人/搜索引擎爬虫会将“strong”视作比单纯的“bold”文本更重要。这种解释仅仅是
    HTML 语义权重，以及文本如何被判断为比具有相同文字但语境略有不同的其他文本更重要。


    `strong` 标签简单为 `<strong>`，而 `bold` 标签更易记忆，仅为 `<b>`。


    所以，`<b>in bold</b>` 和 `<strong>also emboldened</strong>`


