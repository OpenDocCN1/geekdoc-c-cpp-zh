- fmt: "\nconform. We would like to have the following:\n\nUse the following code:\n\
    \n```html\n<p>A paragraph is born and so, it ends.</p>\n```\n\nAs it appears within\
    \ Notepad:\n\nRemember to view the finished article in a web browser.\n\n**50**\n\
    \n![](index-51_1.jpg)\n![](index-51_2.jpg)\n![](index-51_3.jpg)\n\n# WEB DESIGN\n\
    Web Design by Mark Gillan\n\n# ROBOTS\n\n## Search engine optimization and meta\
    \ data\nMost website designers want their creations to be viewed. \n\nWays of\
    \ getting visitors can be (not limited to):\n\n1. Whispering in every ear at every\
    \ opportunity the details of the website and how to locate more information.\n\
    2. Writing the web address on any viewable piece of paper using the good old fashioned\
    \ pen or pencil (care with official or business documentation where appropriate).\n\
    3. Printing the web address on every business document, such as business card\
    \ and letterhead.\n4. Presenting the web address upon any company vehicle.\n5.\
    \ Advertising via any media available, free / paid / agent.\n6. Twisting arms\
    \ up backs and forcing users to click upon links, although much easier locating\
    \ legal positioning of hyperlinks online.\n7. Designing a website to assist search\
    \ engines with their interpretation of the pages within the website to promote\
    \ the search engine listing further up the ranking.\n\nSearch Engine Optimisation\
    \ (SEO) is an important part of any **51** web design and there are so many ways\
    \ to promote a website.\n\n![](index-52_1.jpg)\n![](index-52_2.jpg)\n\n## Professionally\
    \ Qualified Teacher - MARK GILLAN\nLarge search engines have software trawling\
    \ through those billions of web pages on a regular basis looking for new, old\
    \ and updated pages to rank within their listings. The software is often referred\
    \ to as ‘bots’ or ‘robots’ or ‘web crawlers’ or indeed spiders.\n\nA plain text\
    \ file named `robot.txt` can be placed on the web server ready for the online\
    \ search engine bot to pay a visit, instructing what pages are available and generally\
    \ assisting the robot to quickly look over the website.\n\n### Blank—robot.txt\
    \ files\nBy default, robots will crawl through everything unless otherwise advised.\
    \ If the robot is unable to view every page and no `robots.txt` file is readily\
    \ available, it will return a “404 error” which means the search engine will consider\
    \ pages offline or unpleasant for their customers. This will mean the search engine\
    \ might rank pages lower or not at all.\n\nA blank `robots.txt` file will allow\
    \ the robots access to something upon immediate crawling of the website and will\
    \ continue to result any information as far as it can, without any “404 error”\
    \ data log being recorded on the server. \n\n### Example for non restrictive crawling\
    \ of files—robots.txt\nInstead of a blank file, it would be better to produce\
    \ a file that is more likely to reassure and assist. It does not take much and\
    \ typing the following into a new blank Notepad file:\n\n```text\nUser-agent:\
    \ *\nAllow: /\n```\n\n**52**\n\n![](index-53_1.jpg)\n![](index-53_2.jpg)\n![](index-53_3.jpg)\n\
    ![](index-53_4.jpg)\n![](index-53_5.jpg)\n\n# WEB DESIGN\nAn alternative, taking\
    \ a twist, instead of allowing everything we could disallow none (same thing,\
    \ different speak):\n\n```text\nUser-agent: *\nDisallow:\n```\n\nThe `User-agent`\
    \ part of the example provides for all robots (note the asterisk denoting all\
    \ bots) but it is possible to define data for specific known bots by researching\
    \ the name of the actual bot by contacting the organisation themselves or searching\
    \ online.\n\n### Example for avoiding crawling of files—robots.txt\nSome websites\
    \ might contain folders or files for administration purposes, additional working\
    \ code, database listings and files not for general view for various other reasons.\
    \ The robots file may contain the following to indicate files the robot should\
    \ not view:\n\n```text\nUser-agent: *\nDisallow: /\n```\n\nSo, the `User-agent`\
    \ is non restrictive and the disallow is the exact opposite to the previous disallow\
    \ example —this time everything is disallowed and all bots are told not to read\
    \ any folder or file. It is possible to disallow a specific folder or file name\
    \ by using the syntax `Disallow: /foldername`.\n\n## Exercise—create and save\
