    ### Email and the network


    Early 1970’s saw Ray Tomlinson (formerly of BBN) write a computer program for
    electronic mailing. He used the `@` symbol to show the address was someone at
    the host computer. By 1973, more than 75 percent of the traffic on ARPANET was
    private or personal email messages moving back and forth. Demonstrating how the
    network had evolved, with many government defence installations being dismantled
    from the network and it was handed over to the NSF (National Science Foundation)
    for further development as well as enormous growth, becoming known as NSFnet.
    Also in 1973, Vinton Cerf and Bob Kahn present basic `Internet` ideas.


    ## The World Wide Web


    #### Tim Berners-Lee


    In January of 1992, the Internet Society was born and the independence of the
    internet as we know it today came about. Soon after, Tim Berners-Lee at CERN (independent
    research centre in Switzerland) formed the idea of a program later to become a
    web browser, using hyperlinks to connect multimedia pages (computer files) between
    each other. The hyperlink is the basis of the World Wide Web.


