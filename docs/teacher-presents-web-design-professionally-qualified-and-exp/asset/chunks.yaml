  trans: "\n\n`<thead>`、`<tbody>` 和 `<tfoot>` 标签用于分配表格的分组区域。另一个实用的标签是 `<caption>`，它的功能顾如其名！\n\
    \n```html\n<table border = \"1\">\n  <caption>The grouping table</caption>\n \
    \ <thead>\n    <tr>\n      <td colspan=\"2\">This is the Table Header</td>\n \
    \   </tr>\n  </thead>\n  <footer>\n    <tr>\n      <td colspan=\"2\">This is the\
    \ Table Footer</td>\n    </tr>\n  </footer>\n  <tbody>\n    <tr>\n      <td>Cell\
    \ 1</td>\n      <td>Cell 2</td>\n    </tr>\n    <tr>\n      <td>Cell 3</td>\n\
    \      <td>Cell 4</td>\n    </tr>\n    <tr>\n      <td>Cell 5</td>\n      <td>Cell\
    \ 6</td>\n    </tr>\n  </tbody>\n</table>\n```\n\n## 71\n\n![](img/index-72_1.jpg)\n\
    ![](img/index-72_2.jpg)\n![](img/index-72_3.jpg)\n![](img/index-72_4.jpg)\n![](img/index-72_5.jpg)\n\
    \n## 专业资格教师 - MARK GILLAN\n\n### 练习——编写一个联赛表格\n\n结合上述的一些表格编码方法，使用以下每个功能为一个体育联赛/锦标赛表格生成代码：\n\
    \n1. 标题为：`The Contenders Compoship`\n2. 一个由 3 列组成的表格，列出如下：\n   - Team Name (队名)\
    \ | Bonus (奖励) | Points (积分)\n   - Saorse Advance | 92 | 383\n   - Viva Broonburgers\
    \ | 81 | 304\n   - Alba | 77 | 245\n   - Panthers Paws | 54 | 188\n3. 显示在顶行作为标题。\n\
    4. 表头显示：`League Status`\n5. 表脚显示：`Officially replicated`\n6. 删除 Alba 团队包含 `Bonus`\
    \ 和 `Points` 数据的单元格，并替换为一个跨越该团队奖励/积分单元单元格，内容为：`Void total`\n7. 提供带有适当关键词、描述、标题的网页，并以文件名\
    \ `compo.html` 保存到名为 `tables` 的新文件夹中。\n\n## 72\n\n![](img/index-73_1.jpg)\n![](img/index-73_2.jpg)\n\
    ![](img/index-73_3.jpg)\n\n## 网页设计\nMark Gillan 网页设计\n\n### 图片\n\n#### 插入图像文件\n\
    \nhtml 文件是文本，要在网页浏览器中显示图像，html 指向图像文件的位置。我们使用 `<img>` 标签。这里是此主题的一些知识点：\n\n1. `<img>`\
    \ 标签不是元素，而是一个独立标签。\n2. 它没有通常的结束标签，在标签行的末尾放置“正斜杠”。\n3. 图片显示在 html 中 `<img>` 标签所在的位置，通过图像源\
    \ (`src`) 指向图像文件的位置/文件夹。\n\n例如：\n```html\n<img src=\"photo.jpg\"/>\n```\n或者，如果图像文件位于\
    \ html 文件所在的 `images` 子文件夹中：\n```html\n<img src=\"images/photo.jpg\"/>\n```\n\n\
    出于搜索引擎优化 (SEO)、屏幕阅读器以及法律考虑，在 `alt` 标签中对图像进行描述：\n```html\n<img src=\"images/photo.jpg\"\
    \ alt=\"word description\"/>\n```\n\n## 73\n\n![](img/index-74_1.jpg)\n![](img/index-74_2.jpg)\n\
    ![](img/index-74_3.jpg)\n\n## 专业资格教师 - MARK GILLAN\n\n### 图片尺寸和文件大小\n\n许多图像编辑软件工具通常包含“为网络和设备保存\
    \ (Save for Web & Devices)”命令，一些在线编辑器提供了将图像压缩到目标百分比或实际像素尺寸的功能。\n\n尺寸为 1200 x 800\
    \ 像素的图像通过网页浏览器加载可能需要一些时间，但当像素尺寸缩小并压缩到小于原始 2 MB 时可能会占用宝贵的服务器空间。\n\n良好的网页设计应确保：\n\
    \n1. 图像使用正确的文件类型，整个文件名使用小写字母。\n2. 出于浏览器加载时间、服务器空间以及网站访问者的考虑，磁盘文件大小应保持最小。不要仅依赖\
    \ html 代码调整尺寸，在使用前考虑图像文件。\n3. 图像的版权所有权或使用许可对于网页设计师或其客户可能是昂贵的。始终遵守法律。\n4. 图像是相关的、正确的并补充了整体设计。尽可能使用专业摄影师的服务，可能是最好的！\n\
    \n## 74\n\n![](img/index-75_1.jpg)\n![](img/index-75_2.jpg)\n![](img/index-75_3.jpg)\n\
    \n## 网页设计\n\n### 图片文件类型\n\n文件可能需要压缩/减小大小而不产生过多损坏。大多数浏览器接受的图像文件类型且尺寸足够小的：\n\n**.jpg\
    \ 或 .jpeg**\n\n该缩写代表联合摄影专家组 (Joint Photographic Experts)，是照片最流行的文件格式，被称为“交换格式”，适用于大多数应用程序。压缩状态从\
    \ 0 到 12 等，数字越小压缩率越高但质量越低，反之亦然。这是“有损 (lossy)” 压缩。有损压缩意味着压缩越多，质量损失越明显。网页中的绝大多数照片倾向于\
    \ JPEG。注意 html 要求文件名使用 `.jpg` 扩展名且全部小写。\n\n**.gif**\n\n图形交换格式 - 再次是最流行的“交换格式”（市面上几乎所有可用软件都能读取）。它对于网页图像非常流行，特别适用于\
    \ Logo 或简单的剪画/线条画，虽然由于颜色范围缩小到 256 色且压缩率增加，其照片效果不如 `.jpg` 格式。GIF 支持透明像素和动画。\n\n\
    ## 75\n\n![](img/index-76_1.jpg)\n![](img/index-76_2.jpg)\n![](img/index-76_3.jpg)\n\
    \n## 专业资格教师 - MARK GILLAN\n\n### 图片文件类型继续……\n\n**.png**\n\n便网络图形被许多人视为 `.gif`\
    \ 和 `.jpg` 的继任者，并且符合预期。保存元数据（用于搜索的关键信息）。这种文件格式允许更多的颜色，并提供渐进式查看，这意味着图像会逐渐形成，而不需要很长的等待时间。\n\
    \n### 其他 html 选项\n\n图像的其他可用选项包括 `width` 和 `height`，用于指定 html 中的尺寸。如果图像在网站内多次使用且需要不同的尺寸，这些属性会很有用。不是必须的但可以辅助\
    \ CSS 的图像前的 `<figure>` 标签以及为图像提供说明的 `<figcaption>`。`<figure>` 标签可以容纳多个图像，但 `<figcaption>`\
    \ 只能使用一次。\n\n### 练习\n\n创建一个名为 `inspics` 的文件夹，然后创建一个名为 `images` 的子文件夹——在 `images`\
    \ 文件夹内放入一个 JPEG 和 GIF（分别对应照片和剪画）。引用 `images` 文件夹，将两个图像插入名为 `pics.html` 的新网页中，并保存到\
    \ `inspics` 文件夹内（位于 `images` 文件夹旁边）。在网页浏览器中测试。任何问题——参考下一章“IMG 问题 (问题)”。\n\n##\
    \ 76\n\n![](img/index-77_1.jpg)\n![](img/index-77_2.jpg)\n![](img/index-77_3.jpg)\n\
    ![](img/index-77_4.jpg)\n![](img/index-77_5.jpg)\n![](img/index-77_6.jpg)\n![](img/index-77_7.jpg)\n\
    ![](img/index-77_8.jpg)\n\n## 网页设计\nMark Gillan 网页设计\n\n### IMG 问题\n\n#### 图片排排除\n\
    \n许多学习者在编码方面遇到初始困难，尤其是涉及图像时。图像通过在 html 中 `<img>` 标签并引用图像文件插入网页，文件可能位于 Web 服务器上，或者是其他地方的\
    \ URL 。为了解决图片问题，这里有一份适用于所有人的排排除指南：\n\n应使用小写字母\n\n"
- fmt: '

    # Have you used a case sensitive file name?


    Windows based servers would not be bothered about case sensitive file names but
    this could be a problem with other servers such as Unix based servers. For example:
    `tartan.jpg` should not be coded as `Tartan.jpg`.


    ## Spelling errors

    Have you named the image file correctly? Simple spelling mistakes. Check the file
    name once again…and again…and again!


    Spaces being used – take them out. Spaces in file names confuse matters.


    ### **77**

    ![](index-78_1.jpg)

    ![](index-78_2.jpg)

    ![](index-78_3.jpg)

    ![](index-78_4.jpg)


    **Professionally Qualified Teacher - MARK GILLAN**


    ## File name errors

    Common errors with file names:

    - `collage.jpg` instead of `college.jpg`

    - `frend.jpg` instead of `friend.jpg`

    - `images.jpg` instead of `image.jpg`

    - `art work.jpg` instead of `artwork.jpg`

    - `scanedimg.jpg` instead of `scannedimg.jpg`


    In other words, we can all fail to see spelling errors but it is so important
    with file names and must be checked carefully between the code and the actual
    file name itself.


    ## Image residence

    Is the folder identified correctly?


    - `<img src="tartan.jpg">` Indicates the image file is located in the same folder
    as the web page.

    - `<img src="images/tartan.jpg">` Indicates the image file is located in the images
    folder which is one level down from the folder containing the web page.

    - `<img src="../tartan.jpg">` Means the image file is located one level up from
    the folder holding the web page.


    ## Extension

    Is the file extension totally correct for html? Common mistake with JPEG files
    is the use of `.jpeg` instead of `.jpg`. Also check the extension is `.jpg` or
    `.png` or `.gif` and ensure the extension has not been used twice!


    ### **78**

    ![](index-79_1.jpg)

    ![](index-79_2.jpg)

    ![](index-79_3.jpg)

    ![](index-79_4.jpg)


    **WEB DESIGN**

    Web Design by Mark Gillan


    ## LINKS

    ### Using hyperlinks within web pages

    Whenever the mouse pointer is moved over content within a web page and changes
    to a small hand, means a hyperlink is present. Clicking on the hyperlink provides
    a command for navigation to another file. The electronic file can be any file
    held on computer server with application required to view. Normally, a hyperlink
    to another web page will open either in the same window or new tab within the
    same browser.


    So, to define the meaning of the word ‘Hyperlink’ is as per aforementioned workings
    …a link to a computer file, place or digital resource. The file can be any type
    of digital file with application required to view. It is also possible to link
    to another place in the current file, for example, a link further down the page
    and a link to return to the top. HTML uses the `anchor` tag for hyperlinks, being
    `<a></a>`.


    ### Important note

    Near enough every web page in the world, any online resource including various
    file types and multimedia will have its own URL. These unique Resource Locators
    (`URLs`) are the main key for the use of hyperlinks / links.


    ### **79**

    ![](index-80_1.jpg)

    ![](index-80_2.jpg)

    ![](index-80_3.jpg)


    **Professionally Qualified Teacher - MARK GILLAN**


    ## Example hyperlink html

    Within the `anchor` tag, a link location is specified using the `href` (hyperlink
    reference) attribute followed by the equal sign, quotation marks, the full URL
    (including protocol and domain name) and then text (if required), ultimately finished
    with the closing of the `anchor` tag.


    Here is an example of html providing a hyperlink to an external URL of `www.skooshmedia.com`:

    ```

    <a href="http://www.skooshmedia.com">Skoosh Media</a>

    ```


    To place a hyperlink to a page within the same website, based upon the other page
    within the same server, the html refers to the page name and file type suffix:

    ```

    <a href="aboutus.html">Navigate to the About Us page</a>

    ```


    If the hyperlink is to a page within a website or within a folder, the slash can
    be used to direct the hyperlink to the correct destination. For example:

    ```

    <a href="fulldomain.com/page.html">

    ```

    As previously mentioned, it is possible to link to places within the same web
    page. A good example for linking to named ID points within the same page is for
    a return to the top of a page after a visitor has scrolled down. The first stage
    is to identify an ideal place for an anchor, adding html at this place with an
    `id`:

    ```

    <a id="top">Top of the page section</a>

    ```

    Further down the page, to enable a viewer to return to the top, using the anchor
    hyperlink reference and a hash key to the `id`:

    ```

    <a href="#top">Return to the top of the page section</a>

    ```


    ### **80**

    ![](index-81_1.jpg)

    ![](index-81_2.jpg)

    ![](index-81_3.jpg)


    **WEB DESIGN**


    ## Exercise for hyperlinks

    Imagine you have been funded by an organisation wishing to expand their services
    into web design. They wish for you to start a business for web design services.
    Design a website for yourself and your services. Each web page will require navigation
    to the other pages and the website will need some external hyperlinks. This might
    also be an opportunity to include some of the other learning from this book for
    revision / practice.


    1. Create a new folder named: `links`. All the new web pages should be saved into
    this new folder for this exercise.

    2. Create a web page named: `index.html`. The `index.html` page will obviously
    be the home page. Type a good amount describing the new web design business and
    your background including aspirations for the future, setting out a list of services
    and plenty of information to assist visitor understand what is on offer. Insert
    an anchor with an `id` of `prices` for the latter part of the page. Now, place
    an internal link to the anchor using text of “see our prices” near the top of
    the page.

    3. Create a web page named: `aboutus.html`. The `aboutus.html` page should have
    some brief information related to the ambitions, background, location and people
    behind the corporation, placing an anchor ID `name` at this list of names.

    4. Create a web page named: `design.html`. Within this `design.html` page type
    a note of the design concepts, ideas and anything else related to learning from
    this book or any other source. Also mention copyright!


    ### **81**

    ![](index-82_1.jpg)

    ![](index-82_2.jpg)

    ![](index-82_3.jpg)


    **Professionally Qualified Teacher - MARK GILLAN**


    5. Create a web page named: `wish.html`. The `wish.html` page will have relevant
    external hyperlinks with an explanation for each link therein. Maybe use the `wish.html`
    page to list some websites belonging to a wish list of prospective customers.

    6. Create a web page named: `assets.html`. Write some imaginary facts and figures
    for the new business assets, such as details of a computer, laptop, printer, monitor,
    internet connection speeds. Within the `assets.html` page, place a hyperlink with
    relevant text linking to the anchor ID `name` located within the `aboutus.html`
    page.

    '
