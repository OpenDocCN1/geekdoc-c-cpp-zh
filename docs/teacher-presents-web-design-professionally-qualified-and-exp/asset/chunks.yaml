    ![](img/index-45_6.jpg)


    **网页设计**


    ### 练习——查看文件


    打开名为 `markweb` 的文件夹。


    双击名为 `index.html` 的文件。


    文件关联意味着计算机上的默认网页浏览器将打开新创建的网页，并且标签将处于正确的位置。


    例如，注意出现在网页浏览器窗口标题栏中的标题，以及位于 `body` 标签之间的内容出现在窗口的主体内。这一切都是按照 html 指令执行的。


    如果你看到的内容不正确，或者在网页浏览器中看到了某些代码——说明你做错了……重要的是，你必须检查并重新检查你的代码，以确保一切完全正确，但不要担心，因为我们将学习如何编辑文档。


    学生们经常会感到沮丧，这很常见，他们声称“它就是不起作用，我不知道为什么不起作用”，而学生没有非常仔细地检查自己的代码。大多数时候，这只是他们犯了一个微小的错误。


    **45**


    ![](img/index-46_1.jpg)

    ![](img/index-46_2.jpg)

    ![](img/index-46_3.jpg)

    ![](img/index-46_4.jpg)

    ![](img/index-46_5.jpg)


    **专业教师 - MARK GILLAN**


    ### 故障排除——早期修复


    由于有许多学生无法识别自己的错误，这里有一份关于 html 初始运行的简短故障排除指南。


    - 检查字母顺序正确的细节，例如是 `html` 而不是 `hmtl`，或者是 `title` 而不是 `titel`。

    - 检查结束标签的斜杠方向正确，`/` 是正斜杠而不是反斜杠 `\`。

    - 确保标签的 `<` 和 `>` 顺序正确。

    - 核心结构标签有结束标签。例如，`head` 标签在 `body` 标签开始之前应该有一个结束标签。

    - 始终将首页保存为 `index.html` 并在网页浏览器中查看。

    - 保持标签为小写，例如使用 `<html>` 而不是 `<HTML>`。

    - 避免输入特殊字符，如 `©` 或 `£` 或 `$` 或任何需要授权代码的字符，例如，和符号 `&` 应该使用正确的代码 `&#38;` 插入 html，它在
    html 中被称为 `&amp;`。


    特殊字符将在书中后续部分介绍，并附有一个更大的故障排除章节，以帮助避免沮丧并辅助更高效地编写网页代码，让你专注于设计和内容。故障排除时需要记住的一点是：“如果它不起作用，说明你犯了错误，需要仔细重新检查你的工作”。


    继续建立知识，测试自己，开发你的网页设计，最重要的是……享受其中！


    **46**


    ![](img/index-47_1.jpg)

    ![](img/index-47_2.jpg)

    ![](img/index-47_3.jpg)


    **网页设计**


    Mark Gillan 著网页设计


    ### 编辑内容


    #### 编辑网页的教程


    要编辑网页，无论是添加/更改/删除内容，还是编辑标签，在你的计算机上使用记事本打开网页将提供执行此类操作的方法。


    我们将编辑上一章中编写的网页。在记事本内部——使用 `Open`（打开）命令并在位于 `markweb` 文件夹内的名为 `index` 文件。记事本能够打开许多类型的文件，包括网页
    html 页。


    在 `markweb` 文件夹内部——右键点击 快捷方式或使用长命令 `> 打开方式 > 记事本`。如果记事本没有列在可打开文件的应用程序列表中，你可以浏览计算机以将记事本添加到此列表中。


    其他选项是将文件拖到正在运行的记事本实例中，从而请求应用程序在其中打开该文件。


    **打开文件的总结：**

    - 在记事本内部……使用菜单或丝带中的 `Open` 命令。

    - 在文件夹内部——右键点击或拖放到正在运行的记事本实例上。


