    **Professionally Qualified Teacher - MARK GILLAN**


    Web Design by Mark Gillan


    TROUBLESHOOT


    **A web design troubleshooting guide**


    **Image insertion troubleshoot**


    **Have you used a case sensitive file?**


    Although the majority of computer systems do not bother too


    much about case sensitivity, depending upon the platform it


    could be a problem. Check the file name and ensure it is exactly


    the same within the coding. For example, tartan.jpg should not


    be included within code as Tartan.jpg


    **Where does the image reside? Is the folder correct?**


    <img src=“tartan.jpg”>


    Indicates the image file is located in the same folder as the web


    page file


    <img src=“images/tartan.jpg”>


    Indicates the image file is located in the images folder which is


    one level down from the folder containing the web page file


    **Have you named the file correctly?**'
