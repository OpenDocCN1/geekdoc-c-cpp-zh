    \ of design\n#### Design Rules\nThere are four main principles of design to remember:\
    \ movement, balance, emphasis and unity. Each having importance to the whole ruling\
    \ upon design. Locating the optimum point within design means all four must be\
    \ taken into consideration during each process.\n\n- `Movement`\n- `Balance`\n\
    - `Emphasis`\n- `Unity`\n\n![](index-17_1.jpg)\n![](index-17_2.jpg)\n![](index-17_3.jpg)\n\
    ![](index-17_4.jpg)\n![](index-17_5.jpg)\n![](index-17_6.jpg)\n![](index-17_7.jpg)\n\
    ![](index-17_8.jpg)\n![](index-17_9.jpg)\n![](index-17_10.jpg)\n![](index-17_11.jpg)\n\
    ![](index-17_12.jpg)\n![](index-17_13.jpg)\n![](index-17_14.jpg)\n![](index-17_15.jpg)\n\
    ![](index-17_16.jpg)\n![](index-17_17.jpg)\n\n### Elements of design\nWhilst contemplating\
    \ the principles of design, we dive into the depths and elements of such design,\
    \ opening our minds to: `Line`, `Shape`, `Texture`, `Value & Colour` and last\
    \ not least `Space`. We will look at each of these elements in detail during this\
    \ chapter.\n\nSo, visualising the list will hopefully assist you remembering them\
    \ …\n- `LINE`\n- `Shape`\n- `TEXTURE`\n- `Value & Colour`\n- `SPACE`\n\n![](index-18_1.jpg)\n\
    ![](index-18_2.jpg)\n![](index-18_3.jpg)\n\n## Professionally Qualified Teacher\
    \ - MARK GILLAN\n\n### Movement\n#### Anticipated Movement\nWe are constantly\
    \ waiting for the leaning tower of Pisa to fall. Why? Because of the anticipated\
    \ movement we have within our minds. We have experienced an object tipping to\
    \ the point topple.\n\n#### Blurred outlines\nAn image with blurred outlines is\
    \ perceived to be moving.\n\n#### Multiple images\nA process of movement whereby\
    \ stages are captured. The start, middle and end.\n\n#### Optical Movement\nThe\
    \ eye is forced to move from one element to another by using placement of objects,\
    \ colours, strategic emphasis and curves.\n\n Other forms of optical movement\n\
    The eye can move from one object to another, tricking the brain into believing\
    \ it is moving. Have you ever sat on a train and thought the platform is moving?\
    \ Optical illusions can send incorrect signals to the brain. Design can provide\
    \ the eye with movement throughout a publication. Studying how the eye moves around\
    \ objects, focussing on one thing after another and the reasons as to why we see\
    \ one object before another can assist design strategy for movement around the\
    \ publication. A flow from one element to another.\n\n![](index-19_1.jpg)\n![](index-19_2.jpg)\n\
    ![](index-19_3.jpg)\n![](index-19_4.jpg)\n\n## WEB DESIGN\n\n### Optical Movement:\
    \ Different means\nThe image below is a good example of an optical illusion, throwing\
    \ the eye around the image in an attempt to make some sense of the situation.\
    \ Anything that changes our perception of what we regard as correct everyday ‘normality’\
    \ and anything that does not fit the conditioning of our attitudes, behaviour\
    \ or our understanding of the world around us, will immediately have our brain\
    \ asking our eye to interpret in a manner we adjust our belief to fit our understanding\
    \ and pre-conditioning.\n\nWhere is the black dot? Can you stop your eye on it?\n\
    \n![](index-20_1.jpg)\n![](index-20_2.jpg)\n![](index-20_3.jpg)\n![](index-20_4.jpg)\n\
    ![](index-20_5.jpg)\n![](index-20_6.jpg)\n\n## Professionally Qualified Teacher\
    \ - MARK GILLAN\n\n### More Optical Perceptions\nA little more fun with optical\
    \ illusions. Some might call them tricks but in fact they are merely optical illusions.\
    \ They are visually perceived objects and images differing from what we regard\
    \ as reality. As mentioned, reality is only our pre-conditioned, trained and limited\
    \ perception of the world around us. Make sense of these—you might try!\n\n`A\
    \ vase or is it two faces?`\n\n### Let it flow\nDirected movement by a designer\
    \ is known as “flow” and is used to ensure a viewer has their eye carefully to\
    \ the places the designer intends. For example, there might be one immediate attention\
    \ grabbing graphic leading using a visual flow to a story, hyperlink, purchase\
    \ point or any other area to which the designer wishes the viewer to look.\n\n\
    Various technique is used for visual flow, including curves, arrows, gradients,\
    \ perspective, motion within images, text elements, pointers and even a model’s\
    \ direction stare.\n\n![](index-21_1.jpg)\n![](index-21_2.jpg)\n![](index-21_3.jpg)\n\
    \n## WEB DESIGN\n\n### Serious thought\nTry thinking about these questions:\n\
    - How does the eye move through a web page?\n- Are the images assisting movement?\n\
    - Does each section of the page encourage movement?\n- Do we move too fast or\
    \ too slow?\n- Does the visitor get bored working through each part of the page\
    \ / image or does the visitor follow through the start, middle and end?\n- What\
    \ kind of movement is used?\n- How does the designer ensure the viewer moves through\
    \ the web page?\n\n### Your own opinion of movement\nNext time you visit some\
    \ websites, refer to the above questions and think of your own answers.\n"
