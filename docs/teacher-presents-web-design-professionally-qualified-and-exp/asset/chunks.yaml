    由于记事本（Notepad）是一个基础 ASCII 文本编辑器，其默认文件类型无法满足我们的需求。


    然而，记事本没有下拉菜单可以将文件保存为网页的功能，但我们可以通过手动指定文件扩展名来解决这个问题。


    在文件名字段中，输入：`index.html`。


    包含 `.html` 会为文件名添加扩展名，并指示计算机将其保存为 HTML 文件类型。


    将文件保存到名为 `markweb` 的文件夹中。


    大多数计算机都对 HTML 文件有文件关联，并且确实会将此类文件与默认安装的网页浏览器关联。换句话说，当你打开一个网页（html 文件）时，通常使用的网页浏览器会根据
    html 代码标签所提供的指令来显示该网页。


    这在接下来的练习中将变得更加明显。现在在网络浏览器中查看原始 html 产物……


    **44**


    ![](img/index-45_1.jpg)

