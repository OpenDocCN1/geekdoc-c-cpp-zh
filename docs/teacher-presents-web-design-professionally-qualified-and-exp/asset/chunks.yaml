    基础的拼写错误可能会导致问题，尤其是当你第一次看到时无法发现它们的情况下。请非常仔细地检查拼写，反复检查并持续检查。以防万一，确保文件名中不要使用空格。这是一个非常常见的问题。


    ## 120


    ![](img/index-121_1.jpg)


    ## 网页设计


    ### 是否存在常见的拼写错误导致问题？


    常见的拼写错误包括：


    - `collage.jpg` 代替 `college.jpg`

    - `frend.jpg` 代替 `friend.jpg`

    - `images.jpg` 代替 `image.jpg`

    - `art work.jpg` 代替 `artwork.jpg`

    - `scanedimg.jpg` 代替 `scannedimg.jpg`


    换句话说，我们大家都可能忽略掉拼写错误，但对于文件名来说，这至关重要，必须在代码和实际文件名之间进行仔细检查。


    ### 是否使用了正确的文件扩展名？


    使用 `tartan.gif` 而不是 `tartan.jpg` 会产生巨大的差异。有时，文件可能会以错误的扩展扩展名保存。例如，`tartan.jpeg.jpg`
    意味着文件的实际名称是 `tartan.jpeg`，而扩展名为 `jpg`。


    JPEG 文件的一个常见错误是在代码中使用 `.jpeg` 而不是 `.jpg`。计算机上可能显示某个文件的扩展名为为 `.jpeg`，但当我们使用 HTML
    代码时，对于同一个文件应该使用 `.jpg`。


    ### 代码是否完全正确以启用图像显示？


    即使是最微小的错误也可能功亏一篑。例如：


    ```html

    <imgsrc=tartan.jpg alt=incorrect code for the tartan image” />

    ```


    你可能不会立即看到错误——如果可以的话检查一下，或者先放一会回来来看。


    ## 121


    ![](img/index-122_1.jpg)

    ![](img/index-122_2.jpg)

    ![](img/index-122_3.jpg)


    ## 职业资格教师 - MARK GILLAN


    ### 网页设计故障排除与检查


    - **链接**：它们可以用吗？位置得当吗？

    - **图片**：它们显示得如预期吗？文件大小是否合适？

    - **信息**：是否全部正确？是否有任何误导性或不确定的内容？

    - **拼写**：你都检查了吗？你查询过正确的拼写吗？

    - **阅读**：读起来如何？听起来顺吗？经过校对了吗？

    - **导航**：移动方便吗？逻辑性吗？其他人可以使用吗？

    - **外观**：颜色合适吗？布局适合目标观众吗？

    - **可访问性**：所有的 `alt` 标签都存在吗？屏幕阅读器可以访问吗？色盲会成为问题吗？

    - **法律**：你检查版权和所有的法律义务了吗？

    - **标准**：标记代码是否符合最新标准？网站是否可以在跨平台/网页浏览器中查看？


    ## 122


    ![](img/index-123_1.jpg)

    ![](img/index-123_2.jpg)

    ![](img/index-123_3.jpg)


    ## 网页设计


    ### 用户评审与报告


    请某人评审你的网站，并让他们填写报告表，以确保所有细节都被正确覆盖。报告必须是中立的，基于访问者浏览你的网页设计作品时的初印象。不要向用户解释任何内容——让他们得出自己的结论。


    - 初印象是什么？

    - 网页看起来悦目吗？

    - 网页看起来很有趣吗？

    - 加载快吗？

    - 你想读下去还是想在网上看更有趣的内容？

    - 文字易读吗？

    - 是否有任何错误：拼写、语法、阅读、视觉……有任何错误吗？

    - 浏览网站时感到舒适吗？

    - 你能轻松找到链接吗？它们都好用吗？

    - 图片有趣吗？它们符合整体感觉吗？

    - 颜色的使用恰当吗，还是太多/太少？

    - 网页看起来专业吗？

    - 整个网站的感觉相同吗？

    - 如果该网站在线可用，你还会回来访问吗？

    - 网站带给你什么感觉——开心、悲伤、沮丧、失望、兴奋、困惑、震惊、幽默、微笑？

    - 浏览器是否正确显示网站，或者是否提到了“完成错误”或可能存在错误？

    - 你会改变任何东西吗？

    - 你如何改进设计？


    ## 123


    ![](img/index-124_1.jpg)

    ![](img/index-124_2.jpg)

    ![](img/index-124_3.jpg)


    ## 职业资格教师 - MARK GILLAN


    ### 其他问题


    #### 损坏链接

    检查整个网站中的每个链接，确保链接没有损坏或没有将用户引导到不同的地方。这些错误在搜索引擎中实际上会产生负面影响，并可能失去许多访问者的信任。回到代码，通过仔细查看每个链接来修复任何问题。


    #### 缺失文本

    网页的另一个常见问题是代码没有闭合标签，或者以其他某种方式编写不正确，例如布局不正确。`html` 或 `css` 可能存在问题。


    #### 滚动过多

    如果访问者必须水平反复滚动，或在页面上过度向下滚动，这可能会很快变成他们的一种困扰，意味着他们将离开你的网站并在短期内不会返回。因此，最好是确保布局合适，过多的文本可以放在页面的其他地方。


    #### 旧链接和图片

    网页设计师经常遇到出现在相同的问题。建议尽可能在多个显示器、网页浏览器中查看。


    ## 124


    ![](img/index-125_1.jpg)

    ![](img/index-125_2.jpg)

    ![](img/index-125_3.jpg)


    ## 职业资格教师 - MARK GILLAN


    ### 网页设计

    **Mark Gillan 设计**


    ## 有用信息


    ### 附加信息


    #### 上传网站

    许多 ISP（互联网服务提供商）为客户提供网络空间，通常是免费的（尽管有其他服务费用）。一旦网站经过充分测试，下一步是将网站文件夹和文件上传到服务器。


    #### 网站地址

    网站地址/域名可以通过代理获得，或者事实上 ISP 网页托管提供商可能会提供免费域名，更定制化的网站地址需要付费。注册可以续约，甚至可以出售/转让。一旦获得了网站地址/域名，下一步是将网站上传到服务器。


    #### FTP 软件

    `FTP`（文件传输协议）是系统之间通信数据的一套可识别标准规则。许多不同的客户端软件用于 `FTP`，包括在线网页版本。为了建立网页设计师与网页托管服务之间连接所需的，由服务提供商提供，通常如下：


    - `FTP 服务器名称`，例如：`ftp.skooshwebhosting.com`

    - `用户名`，预注册账户用户名。

    - `密码`，同样与注册相关。

    - `域名`。使用的目标网页地址。

    - `端口`，通信访问的地点。例如，`FTP` 的常用端口号是 `21`。


    这是一个 FTP 客户端软件站点管理器表单示例，用于创建/编辑用于从/到 `ftp` 服务器上传/下载文件的站点访问。


