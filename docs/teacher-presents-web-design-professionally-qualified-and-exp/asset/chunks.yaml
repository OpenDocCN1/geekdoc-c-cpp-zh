    ## 职业资格教师 - MARK GILLAN


    ### 电子邮件与网络


    20 世纪 70 年代初，Ray Tomlinson（曾任职 BBN）编写了一个用于电子邮件的计算机程序。他使用 `@` 符号来表示地址是某个主机上的。到
    1973 年，ARPANET 上超过 75% 的流量是往返的私密或个人电子邮件信息。这证明了网络是如何演变的，许多政府防御设施从网络中拆除，网络被移交给 NSF（国家科学基金会）进行进一步的开发和巨大的增长，被称为
    NSFnet。同样在 1973 年，Vinton Cerf 和 Bob Kahn 提出了基本的 `Internet` 理念。


    ## 万维网


    #### Tim Berners-Lee


    1992 年 1 月，互联网学会诞生，我们今天所知的互联网的独立性也随之而来。不久后，瑞士欧洲研究中心（CERN）的 Tim Berners-Lee 构思了一个后来成为网页浏览器的程序，使用超链接连接相互之间的多媒体页面（计算机文件）。超链接是万维网的基础。


