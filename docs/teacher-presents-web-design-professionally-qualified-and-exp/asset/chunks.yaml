    **WEB DESIGN**


    Wide Web traffic. In 1998, Google opened its first office. Thus


    began the huge expansion of the ‘web’ and more traffic on the


    internet related to the web, with us safely saying the web really


    began in the mid 1990’s and has seen a more popular faster


    uptake than any other technology in history. By the year 2006,


    there had been more than 100 million web servers connected to


    the internet.


    **Modern Internet—web driven**


    Usage


    Now we have entered the 21st Century, we see a continued


    increase in internet usage, especially email and the web,


    although so many of the traditional internet services are


    becoming web based, most certainly due to the success of the


    web browser. For example, email and chat have evolved to be


    interfaced via a web browser and video chat is replacing text


    based client software.


    It is not only fun to use the various internet services but there


    are social and economic benefits. We can enhance our social


    life, locate cheaper products, save on holiday costs, investigate


    online and enjoy games plus so much more. The ability to talk


    with friends and relatives anywhere else in the world or be


    educated in the comfort of our own homes provides us with


    something we did not have years ago…convenience, less cost


    and the thrill of dabbling in new technology. Listing all the uses


    of online services would possibly take forever.


    The Advantages


    Added to the aforementioned, are the benefits of shopping from


    the comforts of your own home 24 hours a day, every day of the


    year. It is quite evident the reasons why people choose to shop


    and play online. Retailers have many benefits themselves,


    including the ability to have a global outlet with little wasted


    stock. The benefits roll forward to the consumer whilst bricks


    and mortar shopping is drastically reducing … the web expands.


