    **Professionally Qualified Teacher - MARK GILLAN**


    **Collapse Table Borders**


    Standard tables within HTML have both an inside and outside


    border around all sides of each cell.


    Collapsing the borders offers a means of removing the


    separation between the inside and outside borders, bringing


    about one single border.


    Example


    table {


    border-collapse: collapse;


    }


    table, th, td {


    border: 1px solid black;


    }


    The above would mean cells would have a 1px wide solid black


    border using the border-collapse: collapse;


    Advice: refer back to the HTML tables chapter for information


    related to the control of table rows and columns, head and foot.


    **Caption**


    To place a caption and control its location, use the caption-side


    property with bottom or top (self explanatory, top being default).


    Example CSS line


    caption-side: bottom;


    Within the HTML itself—add the <caption>Text</caption>


