    ![](index-94_2.jpg)

    ![](index-94_3.jpg)


    ### Symbol / Entity

    | | |

    | --- |

    | `&copy;` | Copyright |

    | `&amp;` | Ampersand |

    | `&deg;` | Degrees |

    | `&reg;` | Registered Trademark |

    | `&lt;` | less than |

    | `&gt;` | greater than |

    | `&frac12;` | one half |

    | `&frac34;` | three quarters |

    | `&nbsp;` | Non breaking space |

    | `&euro;` | Euro currency |

    | `~` | Tilde operator |


