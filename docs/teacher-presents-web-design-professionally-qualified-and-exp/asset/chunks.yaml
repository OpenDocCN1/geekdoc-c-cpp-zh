    BOLD


    **Strong and bold formatting of text**


    Ensuring a reader takes note of certain text or emphasis for a


    part of a web page we will use relevant quick formatting tags to


    bring the eye to the areas the designer desires.


    Nowadays, the bulk formatting is written using Cascading Style


    Sheets (CSS) to which we will cover later in the book in some


    detail.


    Meanwhile, we will use basic formatting permissible under


    current approved standards as per the World Wide Web


    Consortium and the majority of web browsers.


    There is a slight difference between “strong” and “bold” for


    formatting, although both appear the same within a web


    browser, the interpretation by search engines is important for


    SEO (Search Engine Optimisation) whereby “strong” is viewed


    by bots / search engine spiders as being more important than


    just “bold” text. The interpretation is merely HTML semantic


    weighting and how text is judged as being more important over


    other text with the same wording but used in a slightly different


    context.


    Tag for strong is simply <strong> and the tag for bold is even


    less to remember with <b>


    So, <b>in bold</b> and <strong>also emboldened</strong>


