    ## COLOUR

    ### Using colours / colors

    Before we move further into examples of CSS and start to use inline, internal
    and external style sheets, it is important colour is discussed.


    ### Use of colour:

    * Colour can be used to label or show hierarchy

    * To unify content across a page, or to separate sections of information or indeed
    to show emphasis of certain areas of a web page

    * To decorate and add interest to a page


    ### How to best use colours:

    Colours can either be analogous / similar to each other or they can be complementary
    to each other. Analogous colours are generally next to each other on the colour
    wheel, whereby complementary colours are opposite each other on the colour wheel.
    Red, Green and Blue are the primary colours, with other colours being additives
    of varying quantities of these.


    Within web design we quantify a colour by the amount of Red, Green and Blue (`RGB`)
    therein.


    ## 97

    ![](index-98_1.jpg)


    ## Professionally Qualified Teacher - MARK GILLAN

    ### Primary and Additive

    Additive colours are mixtures of the primary colours either side within the colour
    wheel. As previously mentioned, the primary colours are Red, Green and Blue (`RGB`)
    for the purposes of web design / colour screen display.


    So, `Magenta` is an additive of Red and Blue.


    ### RGB

    With 256 allowance for each primary permissible(0—255), we can note `RGB` delimited
    with commas. So, `Magenta` is an additive of Red and Blue, would be: `RGB` of
    `255,0,255` being `255` of Red, `0` of Green, `255` of Blue.


    Although colours can be written within HTML / CSS using their name (American English
    spelling), there are restrictions upon the number of colours available in this
    historical method consisting of 16 standard names being `aqua`, `black`, `blue`,
    `fuchsia`, `gray`, `green`, `lime`, `maroon`, `navy`, `olive`, `purple`, `red`,
    `silver`, `teal`, `white`, and `yellow`.


    Nowadays, the majority of graphics cards and Visual Display Units (`VDU`) offering
    millions of colours, we are able to utilise a greater amount of colours—but the
    basics remain the same.


    ### Hexadecimal (HEX)

    HTML / CSS uses hexadecimal codes to represent `RGB`, with the hash tag followed
    by the quantity of Red in double character format, followed by two characters
    for Green and the same for Blue. For example, the colour `blue` is represented
    as `#0000FF` meaning `0` Red, `0` Green and `255` Blue.


    So, how would we write the colour `Red` in Hexadecimal? You are totally correct:
    `#FF0000` and a large list of hexadecimal colours are available towards the end
    of this book to assist you.


