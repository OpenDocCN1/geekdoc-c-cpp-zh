    # The three main means of using Cascading Style Sheets:


    ## Inline

    Using the HTML element attribute styling. Enables a unique styling to one singular
    occurrence of an element.


    ## Internal

    Added to single pages, internally to that particular page using the `<style>`
    element within the `<head>` section of a page.


    ## External

    Ideal for implementing styles across many pages with the head referring to a style
    sheet file located externally to the page.


