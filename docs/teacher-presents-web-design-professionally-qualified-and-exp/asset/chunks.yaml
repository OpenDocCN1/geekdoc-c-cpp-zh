    ### Superscript and Subscript

    Text which is slightly elevated above or below the standard line of text on a
    page and reduced in comparable size is termed as Superscript (higher) and Subscript
    (below). Superscript tends to be used for footnote indicators. The tags are `<sup>`
    and `<sub>` respectively. As usual with paired tags, `<sup>` `</sup>`.


