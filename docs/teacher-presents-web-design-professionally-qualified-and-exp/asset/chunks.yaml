    **CSS Example**


    To assist with readability, CSS declarations can each be placed


    on separate lines. Common practice is to place the opening


    curly bracket (brace) immediately after the selector, next line


    down commencement of the declaration and the last declaration


    within the CSS coding ending with a curly bracket on an


    individual line to ensure viewing of the end is clear.


    h1 {


    color:green;


    text-align:center;


    }


    Notice US American English spelling and the correct syntax as


    previously discussed. It is important to ensure the correct use of


    curly brackets, colons and semi-colons.


