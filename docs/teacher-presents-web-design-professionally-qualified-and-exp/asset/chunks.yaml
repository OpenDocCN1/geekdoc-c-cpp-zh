    ## HEADINGS

    ### Formatting headings and sub-headings

    Historically, web pages had been designed and used by universities. Thus, structured
    documents with plenty of written data had been the majority of these such web
    pages, read by fellow university staff and students with one objective … to gather
    information related to their own particular subject of study.


    Although we have advanced greatly with web technologies, there remains the need
    to structure web pages to allow easier reading by the website visitor, otherwise
    with any difficulty related to speed for identifying the relevant parts of a web
    page the visitor will be navigating elsewhere online.


    We continue to use headings, sub-headings and at levels of 1 to 6 for priority
    / importance for parts of the web page. Heading 1 having more importance over
    Heading 2 which in turn has greater prominence over Heading 3 and so on to Heading
    6.


    Most modern web browsers support the `heading` tag and this example shows how
    each heading displays using a differing style.


