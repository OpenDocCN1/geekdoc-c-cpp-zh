    # 常见设计错误


    - 损坏的 HTML 代码链接

    - 页面水平滚动

    - 浏览器兼容性差

    - 多个动画图形

    - 导航不佳

    - 鼠标效果使用不当

    - 大且加载缓慢的图形、闪烁横幅

    - 图形过多

    - 背景杂乱

    - 巨大的欢迎横幅

    - 多个横幅和按钮


    **29**


