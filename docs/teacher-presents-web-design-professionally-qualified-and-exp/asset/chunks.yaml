    ### 元标签 (Meta tags)

    搜索引擎也会让机器人遍历每个文件的 html 代码，考虑所有方面以及它如何计算网站内每个页面的重要性（页面排名）。代码中应该包含元标签，为每个搜索引擎提供机器人记录的精确信息。它不仅有助于页面排名，还为列表提供了文字。最重要的元标签是关键词（keywords）、描述（description）和已经过的标题标签（title
    tag），它们都应该位于 `head` 标签内。


    - **关键词（Keywords）**应该列出与页面和描述（以及标题）相关的重要词。

    - **描述（Description）**应该是对页面元素的良好描述。描述应该结合文本、图像和主标题将重要关键词与页面内容相结合。

    - **标题标签（Title tag）**——不超过 64 个字符，并且是一个非常短的摘要。虽然这些信息不会显示在页面上，但它允许显示标题。

    - **机器人（Robots）**——就像机器人文件一样，可以在元数据中放置代码提供指令。

    - **字符集（Character set）**——字符集元数据建议网页浏览器使用哪种字符集来显示内容。


