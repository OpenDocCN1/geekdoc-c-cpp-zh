    **WEB DESIGN**


    Web Design by Mark Gillan


    VIDEO


    **Inserting video using html**


    Incorporating video into web pages not so long ago had a


    reliance upon a web browser capability to utilise various plug-ins


    and it had been very much dependent upon the video file type.


    With so many differing plug-ins heavily taxing the web browser,


    in conjunction with security issues and unsure as to bandwidth


    caused a hesitance for web designers to employ video as a tool


    to convey a message. There was no standard.


    Since those days, html and web browsers have come quite a


    distance to ease the pain of video and animation presentation.


    The <video> element has allowed a more common means for


    the more contemporary web browser to accommodate and here


    is a sample code for a some video files…


    <video width="350" height="260" controls>


    <source src="movie.mp4" type="video/mp4">


    <source src="movie.ogg" type="video/ogg">


    Your web browser may not support the video element, please


    check or use a more modern upgraded alternative.


    </video>


    Various source files can be inserted with the web browser using


    the first appropriate working version. The controls attribute


    provides for a play button, pause and volume for the video


    within the web browser. A note for older web browsers that fail


    to accommodate the video might be an idea to assist the user.


