    ## WEB DESIGN


    #### Space


    Having successfully launched a satellite into space, the USSR had the upper hand
    with communications. The speed of communication and the fact it would be near
    impossible in those days to destroy an opponent’s communication device from earth
    when it is orbiting our planet at such heights, provided the Soviet Union with
    greater communication power.


    #### Cuban Crisis


    Following the early 1960’s missile threat and USSR installations so close to mainland
    USA, known as the Cuban Crisis, most Americans prepared for nuclear war, the government
    certainly planned for a thermo-nuclear war. It was a very tense and threatening
    time in history. The USA knew how advanced the USSR had become and this made the
    threat very real. It was important for the US government to develop a technology
    for warfare more advanced than the eastern bloc had in arsenal.


    ##### Computer Network


    The way forward would be a network of computers able to communicate during warfare.
    Both sides possibly believed a nuclear war could be won, or possibly they did
    not care if it could be won as long as the other side did not! What was needed
    was a network of super computers on an information superhighway that would continue
    to operate during such a violent and disruptive war. A network whereby if one
    installation being ‘taken out’ of commission by a missile hit, it would not disrupt
    the flow of information around the rest of the network. Thus, the concept of a
    successful network of computers was brought about history.


