    Due to Notepad being a basic ASCII text editor, the default file type is insufficient
    for our requirements.


    However, there is no ability for a dropdown in Notepad to save the file as a web
    page but we work around this by manually designating the file extension.


    Within the file name field, type: `index.html`.


    The inclusion of the `.html` adds a file extension to the file name and instructs
    the computer to save as a HTML file type.


    Save the file into the folder named: `markweb`.


    Most computers will have a file association for HTML files and will indeed associate
    such files with the default installed web browser. In other words, when you open
    a web page (html file) the web browser normally used will show the web page as
    it has been instructed using the html code tags as such instructions.


    This will become more evident within the next exercise. Now to view the raw html
    product in a web browser...


    **44**


    ![](index-45_1.jpg)

    ![](index-45_2.jpg)

    ![](index-45_3.jpg)

    ![](index-45_4.jpg)

    ![](index-45_5.jpg)

    ![](index-45_6.jpg)


    **WEB DESIGN**


    ### Exercise—viewing the file


    Open the folder named: `markweb`.


    Double click the file named `index.html`.


    The file association should mean the default web browser on the computer opening
    the newly created web page and the tags will position appropriately.


    For example, notice the title appearing within the title bar of the web browser
    window and the contents of between the `body` tags appearing within the main body
    of the window. All as per html instructions.


    If you have something different or you can see some of the coding in the web browser
    – you have done something wrong...it is important you check and re-check your
    coding to ensure everything is totally correct but don’t worry as we are going
    to see how we can edit the document.


    It is quite common for students to become frustrated with them declaring “it’s
    just not working and I can’t see the reason as to why it’s not working” without
    the student very carefully checking their coding. Most times it is one tiny error
    they have made.


    **45**


    ![](index-46_1.jpg)

    ![](index-46_2.jpg)

    ![](index-46_3.jpg)

    ![](index-46_4.jpg)

    ![](index-46_5.jpg)


    **Professionally Qualified Teacher - MARK GILLAN**


    ### Troubleshooting—early fixes


    With so many students unable to identify their error, here is a short troubleshooting
    guide to initial html working.


    - Check the finer details for correct order of letters, for example `html` and
    not `hmtl` or `title` and not `titel`.

    - Check the end tag has the slash the correct way around `/` being the forward
    slash and not back slash `\`.

    - Ensure the tags have `<` and `>` in the right order.

    - The core structure tags have end tags. For example, the `head` tag should have
    an end tag prior to the start of the `body` tag.

    - Always save the home page as `index.html` and view in a web browser.

    - Keep tags lowercase, for example `<html>` and not `<HTML>`.

    - Avoid typing special characters, such as `©` or `£` or `$` or any other characters
    that require approved code, for example the ampersand `&` should be inserted into
    html using the correct code of `&#38;` and is known in html as `&amp;`.


    Special characters will be covered later in the book along with a larger troubleshooting
    section to help avoid frustration and aid more efficient coding of web pages,
