    # 使用级联样式表（CSS）的三种主要方法：


    ## 内联 (Inline)

    使用 HTML 元素属性样式。允许对单个元素进行唯一样式。


    ## 内部 (Internal)

    添加到单个页面中，通过页面 `<head>` 部分内的 `<style>` 元素在页面内部实现。


    ## 外部 (External)

    适用于在多个页面中实现样式，其头部部分引用位于页面外部的样式表文件。


    ## 96

    ![](img/index-97_1.jpg)

    ![](img/index-97_2.jpg)

    ![](img/index-97_3.jpg)

    ![](img/index-97_4.jpg)


    ## 网页设计

    Mark Gillan 设计的设计


    ## 颜色 (COLOUR)

    ### 使用颜色

    在我们进一步研究 CSS 示例并开始使用内联、内部和外部样式表之前，讨论颜色是非常重要的。


    ### 颜色的用途：

    * 颜色可用于标记或显示层级

    * 统一整个页的内容，或区分信息区域，实际上显示网页某些区域的重点

    * 装饰页面并增加趣味


    ### 如何最佳使用颜色：

    颜色可以是彼此相邻（相似）的，也可以是互补的。相似色通常在色轮上相邻，而互补色在色轮上处于相对位置。红、绿、蓝是原色，其他颜色是这些原色不同量的加色。


    在网页设计中，我们通过红、绿、蓝（`RGB`）的来量化颜色。


    ## 97

    ![](img/index-98_1.jpg)


    ## 资深教师 - MARK GILLAN

    ### 原色与加色

    加色是色轮上两侧原色的混合物。如前所述，出于网页设计 / 彩色屏幕显示的目的，原色是红、绿、蓝（`RGB`）。


    因此，`Magenta`（洋红色）是红色和蓝色的加色。


    ### RGB

    每个原色允许 256 个值（0—255），我们可以用逗号分隔记录 `RGB`。因此，`Magenta` 作为红色和蓝色的加色，应该是：`RGB` 为 `255,0,255`，即
    `255` 红色、`0` 绿色、`255` 蓝色。


    虽然可以在 HTML / CSS 中使用颜色名称（美式英语拼写）编写颜色，但这种历史方法的可用颜色数量受到限制，包含 16 个标准名称：`aqua`、`black`、`blue`、`fuchsia`、`gray`、`green`、`lime`、`maroon`、`navy`、`olive`、`purple`、`red`、`silver`、`teal`、`white`
    和 `yellow`。


    如今，大多数显卡和显示单元（`VDU`）提供百万种颜色，我们可以利用更多的颜色——基础保持不变。


    ### 六进制 (HEX)

    HTML / CSS 使用十六进制代码表示 `RGB`，以井号开头后跟双字符格式的红色数量，然后是两个字符的绿色，蓝色也是如此。例如，颜色 `blue` 表示为
    `#0000FF`，意味着 `0` 红色、`0` 绿色和 `255` 蓝色。


    那么，我们如何用十六进制写 `Red`（红色）颜色？你完全正确：`#FF0000`，书末尾提供了大量的十六进制颜色列表供你参考。


    ## 98

    ![](img/index-99_1.jpg)

    ![](img/index-99_2.jpg)

    ![](img/index-99_3.jpg)

    ![](img/index-99_4.jpg)

    ![](img/index-99_5.jpg)


    ## 网页设计

    Mark Gillan 设计的设计


    ## 页面 CSS (IN-PAGE)

    ### 使用 CSS 格式化各种内联和内部样式

    #### 内联样式 (Inline Style)

    内联 CSS 的示例可以是页面背景颜色，每个页面可以不同。`body` 背景颜色可能使用“内联”样式编码。


    ```html

    <body style="background-color:yellow;">

    ```


    我们还可以以类似的方式将 CSS 内联样式应用到其他元素上：


    ```html

    <h2 style="background-color: #00FF00;">仅此此页上的特定标题 2 设置绿色背景。</h2>

    ```


    其他格式可以使用内联 CSS 完成，例如：字体、大小、对齐方式：


    ```html

    <p style="font-family:arial; font-size:18px; text-align:center;">此段落应该以 arial
    字体族显示，大小为 18 像素并在页面上居中对齐。其他段落不受影响，并将应用默认设置。</p>

    ```


    我们可以对页面内各种其他单一元素应用变化。尝试 CSS 的内联方法。


    ## 99

    ![](img/index-100_1.jpg)

    ![](img/index-100_2.jpg)

    ![](img/index-100_3.jpg)


    ## 资深教师 - MARK GILLAN

    ### 内部样式表 (Internal Style Sheet)

    如果单个页面需要对整个页面元素应用格式，可以使用内部样式表。例如，如果单个页面内的所有标题 2 和所有段落都需要 CSS 格式，可以使用以下代码：


    ```html

    <head>

    <style>

    h2 {

    background-color:red;

    }

    p {

    color: #00FF00;

    }

    </style>

    </head>

    ```


    注意上述 CSS 是如何使用 `<style>` 放置在 `head` 标签区域的。


    ### 练习

    如果单个页面需要对整个页面元素应用格式，可以使用内部样式表。例如，如果单个页面内的所有标题 2 和所有段落都需要 CSS 格式，可以使用以下代码：


    ```html

    <head>

    <style>

    h2 {

    background-color:red;

    }

    p {

    color: #00FF00;

    }

    </style>

    </head>

    ```


    注意上述 CSS 是如何使用 `<style>` 放置在 `head` 标签区域的。


