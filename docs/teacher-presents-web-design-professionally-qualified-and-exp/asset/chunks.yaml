    CSS


    **Cascading Style Sheets for Web Design**


    Cascading Style Sheets (CSS) consists of instructions for the


    display of html elements. External CSS can be code typed


    within a text file and saved as a .css file in a similar fashion


    to .html files. CSS can also be written into html files, although


    external CSS files are more powerful across the whole of a


    website and saves time, effort, efficiency as well as acting as a


    central point for the control / display instructions for elements.


    Prior to the increased usage of CSS, the formatting and layout


    for html pages consisted of a large amount of additional


    instructions duplicated across many pages.


    CSS syntax consists of selector and a declaration block…


    Explanation


    The selector points to the html element for the style to influence.


    Within curly brackets, declarations are separated by semi-


    colons, each declaration consisting of a noted property and its


    designated value separated by a colon.


