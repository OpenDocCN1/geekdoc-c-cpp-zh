    # Professionally Qualified Teacher - MARK GILLAN

    ## Headings for Search Engine Robots

    There is another very good reason … Search Engine Optimisation (SEO) to which
    we previously discussed for strong and bold tags. Search engines need to identify
    what is important within a web page to rank said web page for importance within
    the listings for their own clients.


    Robots / spider software utilised by search engines have improved over the years
    to gauge how headings and other SEO sensitive tags are used (or abused) by web
    designers. Therefore, the use of headings should concentrate upon being structured
    items for the purpose of readability first and foremost, helping visitors as well
    as screen readers (visually impaired visitors) to quickly identify their target
    requirements within the web page. Any SEO ambitions should adequately follow with
