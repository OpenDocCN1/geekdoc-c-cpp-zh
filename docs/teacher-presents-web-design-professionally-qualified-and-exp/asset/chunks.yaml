    **Professionally Qualified Teacher - MARK GILLAN**


    ## Placeholder Text

    It is possible to have default text in a form control, offering an example or
    instructions to the user for input.


    ### Example

    Adding the `placeholder` attribute to the elements start tag using the usual double
    quotation marks enclosure for such placeholder text to instruct the web browser
    to display (noting once again, not all modern use of html is accommodated by all
    web browsers—more on this later).


    ```html

    <form>

    An example form using placeholder text

    <p>Full Name <input type="text" name="fullname" placeholder="Enter your full name"
    /> </p>

    <p>Email <input type="email" name="email" size="30" placeholder="Valid email address
    here" /> </p>

    </form>

    ```


    ### Display

    Depending upon the web browser, the above placeholders within a form might appear
    similar to this:

    Note: The `size` attribute allocates amount of characters wide.

    Multi-line larger control boxes can be arranged by rows and columns, using `<textarea
    rows="5" cols="25"></textarea>`


