    ## 本书的使用


    ## 引言


    本书由一位具有专业资质的讲师编写，适用于不同水平和能力的读者。本书采用由练习和指南组成的短章节形式，类似于课堂教学方式。你将看到、被要求执行任务、检查结果，并进入下一个章节。


    网页设计不仅很有趣，更是当今的必需。我们提供产品、服务、信息、数据、新闻等。我们依赖网页设计师来制作包含用户所需一切功能的网站，避免错误并确保访问者的之旅无忧。


    互联网的使用速度比历史上任何其他技术都要快。网页设计是任何业务、个人在线形象和爱好的核心。世界对网页设计师的需求比任何时候都大。如今我们经常使用互联网，在搬家时，我们会寻找气、电、水供应……与这些优先事项并列的是宽带连接。


    **8**


    ![](img/index-9_1.jpg)

