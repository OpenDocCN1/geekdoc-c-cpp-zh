  trans: "\n\n# 你是否使用过区分大小写的文件名？\n\n基于 Windows 的服务器不会区分文件名的大小写，但这在其他服务器（如基于 Unix 的服务器）上可能会产生问题。例如：`tartan.jpg`\
    \ 不应该被编码为 `Tartan.jpg`。\n\n## 拼写错误\n你是否正确命名了图像文件？简单的拼写错误。再次检查一遍文件名……再一遍……再一遍！\n\
    \n使用了空格——请把它们删。文件名中的空格会引起混淆。\n\n### **77**\n![](img/index-78_1.jpg)\n![](img/index-78_2.jpg)\n\
    ![](img/index-78_3.jpg)\n![](img/index-78_4.jpg)\n\n**专业资格教师 - MARK GILLAN**\n\
    \n## 文件名错误\n文件名常见的错误：\n- 使用 `collage.jpg` 而不是 `college.jpg`\n- 使用 `frend.jpg`\
    \ 而不是 `friend.jpg`\n- 使用 `images.jpg` 而不是 `image.jpg`\n- 使用 `art work.jpg` 而不是\
    \ `artwork.jpg`\n- 使用 `scanedimg.jpg` 而不是 `scannedimg.jpg`\n\n换句话说，我们可能都会忽略拼写错误，但对于文件名来说这非常重要，必须在代码和实际文件名之间进行仔细检查。\n\
    \n## 图像位置\n文件夹识别是否正确？\n\n- `<img src=\"tartan.jpg\">` 表示图像文件位于网页相同的文件夹中。\n- `<img\
    \ src=\"images/tartan.jpg\">` 表示图像文件位于 `images` 文件夹中，该文件夹是网页所在文件夹的下级。\n- `<img\
    \ src=\"../tartan.jpg\">` 表示图像文件位于网页所在文件夹的上级。\n\n## 扩展名\nHTML 扩展名是否完全正确？JPEG 文件的常见错误是使用\
    \ `.jpeg` 而不是 `.jpg`。还要检查扩展名是否为 `.jpg` 或 `.png` 或 `.gif`，并确保扩展名没有使用两次！\n\n###\
    \ **78**\n![](img/index-79_1.jpg)\n![](img/index-79_2.jpg)\n![](img/index-79_3.jpg)\n\
    ![](img/index-79_4.jpg)\n\n**网页设计**\nMark Gillan 设计设计\n\n## 链接\n### 在网页内使用超链接\n\
    每当鼠标指针移动到网页内容上并变成一个小手形状时，意味着存在超链接。点击超链接将提供一个导航到另一个文件的命令。电子文件可以是计算机服务器上的任何文件，并需要相应的应用程序来查看。通常情况下，指向另一个网页的超链接将在同一浏览器的相同窗口或新标签页中打开。\n\
    \n因此，“超链接”（Hyperlink）一词的定义正如前述的操作……一个指向计算机文件、位置或数字资源的链接。该文件可以是任何类型的数字文件，需要相应的应用程序来查看。也可以链接到当前文件中的其他位置，例如指向页面更下方的链接以及返回页面顶部的链接。HTML\
    \ 使用 `anchor` 标签作为超链接，即 `<a></a>`。\n\n### 注意事项\n世界上几乎每一个网页、包括各种文件类型和多媒体在内的任何在线资源都有自己的\
    \ URL。这些唯一的资源定位符（`URLs`）是使用超链接/链接的关键所在。\n\n### **79**\n![](img/index-80_1.jpg)\n\
    ![](img/index-80_2.jpg)\n![](img/index-80_3.jpg)\n\n**专业资格教师 - MARK GILLAN**\n\
    \n## 超链接 HTML \n在 `anchor` 标签内，使用 `href`（超链接引用）属性指定链接位置，其后是等号、引号、完整的 URL（包括协议和域名名），然后是文本（如果需要），最后以关闭\
    \ `anchor` 标签结束。\n\n这是一个提供指向外部 URL `www.skooshmedia.com` 超链接的 html 示例：\n```\n\
    <a href=\"http://www.skooshmedia.com\">Skoosh Media</a>\n```\n\n要放置指向同一网站内其他页面的超链接（基于同一服务器内的另一个页面），html\
    \ 引用文件名和文件类型后缀：\n```\n<a href=\"aboutus.html\">导航到关于我们页面</a>\n```\n\n如果超链接是指向网站内或文件夹内的某个页面，可以使用斜杠将超链接导向正确的目的地。例如：\n\
    ```\n<a href=\"fulldomain.com/page.html\">\n```\n如前所述，可以链接到同一网页内的位置。链接到同一页面内具名\
    \ ID 点的良好示例是：访问者向下滚动后返回页面顶部。第一阶段是识别锚点的理想位置，在此处添加带有 `id` 的 html：\n```\n<a id=\"\
    top\">页面顶部部分</a>\n```\n在页面下方，为了让查看者返回顶部，使用锚点超链接引用和指向 `id` 的哈希键：\n```\n<a href=\"\
    #top\">返回页面顶部部分</a>\n```\n\n### **80**\n![](img/index-81_1.jpg)\n![](img/index-81_2.jpg)\n\
    ![](img/index-81_3.jpg)\n\n**网页设计**\n\n## 超链接练习\n假设你获得了一个组织的资助，该组织希望将其服务扩展到网页设计。他们希望你开始经营一家网页设计服务业务。为你和你的服务设计一个网站。每个网页都需要导航到其他页面，并且网站需要一些外部链接。这也可以是一个包含本书书中其他学习内容的机会。\n\
    \n1. 创建一个名为 `links` 的文件夹。所有新网页都应保存在这个新文件夹中。\n2. 创建一个名为 `index.html` 的网页。`index.html`\
    \ 页面显然是首页。编写大量内容描述你的新网页设计业务，包括对未来的愿景，列出服务列表以及帮助访问者了解所提供服务的丰富信息。在页面后部插入一个带有 `id=\"\
    prices\"` 的锚点。现在，在页面顶部使用文本“查看我们的价格”放置一个内部链接。\n3. 创建一个名为 `aboutus.html` 的网页。`aboutus.html`\
    \ 页面应包含有关公司目标、背景和人员的简要信息，并在姓名处放置 ID `name`。\n4. 创建一个名为 `design.html` 的网页。在 `design.html`\
    \ 页面中，写下关于设计概念、想法以及与本书或其他任何来源相关的任何内容。还要提到版权！\n\n### **81**\n![](img/index-82_1.jpg)\n\
    ![](img/index-82_2.jpg)\n![](img/index-82_3.jpg)\n\n**专业资格教师 - MARK GILLAN**\n\
    \n5. 创建一个名为 `wish.html` 的网页。`wish.html` 页面将拥有相关的外部链接，并对其中的每个链接进行说明。也许可以使用 `wish.html`\
    \ 页面列出潜在客户愿望清单中的网站。\n6. 创建一个名为 `assets.html` 的网页。为新资产编写一些虚拟的事实和数据，例如计算机、笔记本电脑、打印机、显示器及其连接速度的详情。在\
    \ `assets.html` 页面中，放置一个相关文本链接，指向 `aboutus.html` 页面内的锚点 ID `name`。\n\n"
- fmt: "\nHTML forms contain various controls for collecting, viewing, coordinating\
    \ and retrieving data.\n\nThe `<form>` element is used to group all control parts\
    \ of a form together that might include text boxes, radio buttons, dropdowns,\
    \ check boxes and possibly other interactive calculative content using additional\
    \ programming languages.\n\nSome web hosting services can assist with programming\
    \ languages code for executing the content of forms into an email to a given recipient.\
    \ Or, you could have the user print out the web page, email or snail mail.\n\n\
    Due to the complexity of form data use, we will concentrate upon the layout and\
    \ form elements as opposed to the extensive functionality such as creating accounts,\
    \ search results, financial and other ‘post’ or ‘get’ approaches—that’s a whole\
    \ new book!\n\nNow, onto the task in hand, there is still the need to know how\
    \ to develop a form for design purposes, so the first important tag for generating\
    \ a form area within a web page, you have possibly guessed already …\n\n```html\n\
    <form>With the form components within the form tags</form>\n```\n\nSimilar to\
    \ most HTML elements, the `<form>` element has a few different attributes which\
    \ can be set within the start form tag, including method of sending / obtaining\
    \ data and the action for processing. We will concentrate upon the various elements\
    \ within a form.\n\nThe most important form element for obtaining user data is\
    \ the `<input>` tag with many variants for types of input. We will look at some\
    \ of the more common input types before putting all the form elements together\
