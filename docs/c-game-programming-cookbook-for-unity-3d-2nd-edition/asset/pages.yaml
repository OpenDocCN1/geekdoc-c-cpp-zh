- pgno: 255
  md: "Above, we use Unity's built in function FindObjectOfType() to look for a Gameobject\
    \ that has a WaypointsController Component attached to it. FindObjectOfType()\
    \ will return the first one it finds - thankfully, there should only ever be a\
    \ single WaypointsController in any of the levels for this game. The first WaypointsController\
    \ it finds will be the one we use.\n\nTo hide or show a message to the user that\
    \ the main player is driving the wrong way on the track; the UpdateWrongWay()\
    \ function:\n\n```\n```csharp\npublic void UpdateWrongWay ( bool isWrongWay )\n\
    {\n    if( isWrongWay==oldIsWrongWay )\n        return;\n```\n```\n\nTo keep a\
    \ track of changes, we have two variables: oldIsWrongWay and isWrongWay. We set\
    \ oldIsWrongWay at the end of this function. This function is called repeatedly\
    \ as the game progresses, so if isWrongWay is not equal to oldIsWrongWay we know\
    \ that something has changed between the last time this was called and this time.\
    \ When isWrongWay and oldIsWrongWay are the same, we know that the state of whether\
    \ or not the player is going the wrong way has not changed since the last time\
    \ we update the display. Above we can just drop out of this function when isWrongWay==oldIsWrongWay.\n\
    \nIf isWrongWay is not equal to oldIsWrongWay, we know that isWrongWay has changed\
    \ its state and we need to update the user interface display to reflect that.\n\
    \nIf the script execution reaches this point, the value of wrong way must have\
    \ changed so the script can go ahead and tell _uiManager what to display:\n\n\
    ```\n```csharp\n    if ( isWrongWay )\n    {\n        _uiManager.ShowWrongWay();\n\
    \    }\n    else\n    {\n        _uiManager.HideWrongWay();\n    }\n\n    oldIsWrongWay\
    \ = isWrongWay;\n}\n```\n```\n\nAbove, after dealing with the display state we\
    \ set oldIsWrongWay to isWrongWay so we can keep track of state changes. At the\
    \ bottom of the RaceGameManager class, the Spawn() function:\n\n```\n```csharp\n\
    Transform Spawn(Transform spawnObject, Vector3 spawnPosition, Quaternion spawnRotation)\n\
    {\n    return Instantiate(spawnObject, spawnPosition, spawnRotation);\n}\n```\n\
    ```\n\nWe talked a bit earlier about having our Spawn() function separated like\
    \ this so that it would be easy to switch out the call to Instantiate() with something\
    \ more performance-friendly such as an object pool manager. All that happens in\
    \ this function is that we add a GameObject to the Scene based on the parameters\
    \ passed into it and then return a reference to the new GameObject."
