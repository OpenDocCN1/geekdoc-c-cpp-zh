    public void CheckWrongWay()\n{\n    if(_currentWaypointTransform==null)\n    \
    \    return;\n    Vector3 relativeTarget =\n    myTransform.InverseTransformPoint\n\
    \    (_currentWaypointTransform.position);\n```\n\nTo ensure the player is heading\
    \ in the right direction around the track, the CheckWrongWay() function uses the\
    \ waypoints system to look ahead to the next waypoint and check the angle of the\
    \ vehicle vs. the ideal angle to reach the waypoint. When the angle goes over\
    \ a certain threshold (here, it is set to 90 degrees) then the wrong way message\
    \ is displayed, and a timer will count. When the timer reaches a certain amount,\
    \ we automatically respawn the player back on to the track.\n\nFirst, the function\
    \ checks that _currentWaypointTransform has something in it. If this reference\
    \ was at null, it would break the code, so we drop out here, if we need to.\n\n\
    The script uses the waypoint from _currentWaypointTransform to check that the\
    \ vehicle is traveling in the right direction. The first step in doing that is\
    \ to calculate a vector, relative to the vehicle, with Transform.InverseTransformPoint().\
    \ Essentially, what happens here is that the world vector provided by _currentWaypointTransform.position\
    \ is converted to the local space belonging to _TR (the vehicle), providing relativeTarget\
    \ with a vector.\n\n```\ntargetAngle = Mathf.Atan2 (relativeTarget.x,\nrelativeTarget.z);\n\
    targetAngle *= Mathf.Rad2Deg;\n```\n\nMathf.Atan2 is used to convert the x and\
    \ z values of the vector relativeTarget into an angle. The result of Mathf.Atan2\
    \ will be in radians, so a quick call to Mathf.Rad2Deg is required to convert\
    \ it to degrees. As relativeTarget is a vector relative to the vehicle, when we\
    \ convert that to an angle we know that 0 degrees will be forward along the vehicle's\
    \ forward axis and that 90 degrees will be to the right and -90 degrees to the\
    \ left. In effect, targetAngle now holds the result of how many degrees the vehicle\
    \ (along its forward vector) is out from facing the waypoint.\n\n```\nif(targetAngle<-90\
    \ || targetAngle>90){\n    goingWrongWay=true;\n} else {\n    goingWrongWay=false;\n\
    ```\n\nAbove, we see if targetAngle is -90 or 90 degrees out (outside of our wrong\
