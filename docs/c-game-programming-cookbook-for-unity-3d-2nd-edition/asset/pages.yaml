    \ that the path to the player is clear. CanSee() returns true if the line is clear,\
    \ false when there is an obstacle.\n\nAbove, we then check the distance to see\
    \ if the target is too far away from the bot – further than maxChaseDistance.\
    \ If distanceToChaseTarget is greater than maxChaseDistance, or CanSee() returned\
    \ false, we call on SetAIState() to change the state back to look for a new suitable\
    \ target in AIState.move_looking_for_target.\n\n```\nvoid BackUpLookingForTarget()\n\
    {\n    LookAroundFor();\n    MoveBack();\n    if (obstacleFinderResult == 0)\n\
    \    {\n        if (Random.Range(0, 100) > 50)\n            SetAIState(AIState.stopped_turning_left);\n\
    \        else\n            SetAIState(AIState.stopped_turning_right);\n    }\n\
    }\n```\n\nBackUpLookingForTarget() is called each frame from the UpdateCurrentState()\
    \ function. It moves the bot backward when obstacles are found on both left and"
