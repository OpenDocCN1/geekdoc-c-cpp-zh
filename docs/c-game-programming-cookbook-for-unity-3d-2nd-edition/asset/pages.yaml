- pgno: 281
  md: '# 15 Blaster Game Example


    In the late 1970s came a turn-based game called Robots for the Berkeley Software
    Distribution (BSD). In Robots, the player must escape from a swarm of enemies
    that move in closer toward the player each turn. In the original version of the
    game, the player moves around the arena to avoid contact between enemies and player,
    which would end the game.


    Robots is often referred to as the beginning of the arena shooter – a term used
    to describe a top-down shoot ''em up game with the action locked into a limited
    area like an arena. The Blaster game example from this chapter is a basic template
    for an arena shooter, which borrows heavily from its predecessors; the action
    has a single player moving around an arena fighting off hordes of killer robots.


    In this chapter, we look at the scripts used to build an arena shooter (Figure
    15.1) where bots will spawn and the goal is to destroy them all to be able to
    progress to the next level. This chapter is less of a tutorial and more of a companion
    guide to the example project. It is expected that you will open the example project
    and dig around to see how it works, using this chapter as a guide to what everything
    does in the game and how it all fits together. This chapter is mostly focused
    on the C# scripts, what they do, and how they work.


    Additions to the core framework are minimal and you can see the structure of the
    game in Figure 15.2.


    You can find the Blaster game in the example project folder Assets/Games/Blaster.
    Scenes are in the Assets/Games/Blaster/Scenes folder.'
