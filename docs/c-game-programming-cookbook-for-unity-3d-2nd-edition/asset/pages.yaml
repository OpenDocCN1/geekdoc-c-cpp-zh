    The raycasting uses the AI bot''s forward vector (_TR.forward) with an offset
    to the side. _TR.right is also multiplied by half and added to the forward vector,
    so that the angle goes diagonally out from the bot – with the ray starting at
    _TR.position.


    What we consider to be obstacles are defined as anything which is set to use one
    of the collision layers defined in the obstacleAvoidLayers LayerMask. You can
    set one or multiple collision layers as obstacle layers in the Unity editors Inspector
    on this GameObject.


    The variable obstacleAvoidDistance is used as the distance parameter for ray casting,
    which can be set in the Unity editor Inspector window.


    If a call to Physics.Raycast finds something, it returns true, and that is exactly
    what the line above is looking for. If something is found we will react to that,
    next:


