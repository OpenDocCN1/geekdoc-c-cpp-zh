- pgno: 261
  md: "Above, _tempRC is populated with a reference to a RaceController script from\
    \ another player. We use the loop's variable (b) as the index number to access\
    \ our raceControllers Hashtable.\n\n```\n```\n// if car 2 happens to be null (deleted\
    \ for example) here's a little safety to skip this iteration in the loop\nif(_tempRC==null)\n\
    \    continue;\n```\n```\n\nTo keep the function safe, _tempRC is null checked\
    \ just in case one of the players has somehow been removed from the game. If it\
    \ is null, the continue command will move the loop on to the next pass without\
    \ continuing to execute the code in subsequent lines.\n\n```\n```\nif ( focusPlayerScript.GetID()\
    \ != _tempRC )\n{ // <- make sure we're not trying to compare same objects!\n\
    ```\n```\n\nfocusPlayerScript is the main player we are interested in (passed\
    \ in as a parameter). The race controller instance held by _tempRC is taken from\
    \ the hashtable based on the value of b from the loop, which means eventually\
    \ _tempRC will hit upon the same RaceController instance as the one held by focusPlayerScript.\
    \ Before position or waypoint checking happens, we compare focusPlayerScript and\
    \ _tempRC to make sure they are not the same.\n\n```\n```\n// is the focussed\
    \ player a lap ahead?\nif ( focusPlayerScript.GetCurrentLap() >\n    _tempRC.GetCurrentLap()\
    \ )\n    isAhead = true;\n```\n```\n\nThere are several conditions we test against\
    \ to find out whether the player within focusPlayerScript is ahead of the one\
    \ that the loop is currently looking at. Above, the first condition is whether\
    \ the current lap of the focused player is higher than the lap of the race controller\
    \ in _tempRC - if it is, we know right away that focusPlayerScript is ahead of\
    \ _tempRC and we can set isAhead to true.\n\n```\n```\n// is the focussed player\
    \ on the same lap, but at a higher\nwaypoint number?\nif (focusPlayerScript.GetCurrentLap()\
    \ ==\n    _tempRC.GetCurrentLap()\n    && focusPlayerScript.GetCurrentWaypointNum()\
    \ > _tempRC.\nGetCurrentWaypointNum() && !_tempRC.IsLapOne())\n    isAhead = true;\n\
    ```\n```\n\nThe above condition checks to see whether the current lap of the focused\
    \ player is the same as the lap of the race controller in _tempRC. If they are\
    \ both on the same lap, we look to the waypoints to see if the focusPlayerScript\
    \ waypoint index number is greater than that of _tempRC. If it is, we know that\
    \ focusPlayerScript is ahead of _tempRC because its waypoint is further along\
    \ the track: in which case, isAhead gets set to true. There is also a check to\
    \ make sure that the player in _tempRC has not yet finished its current lap.\n\
    \n```\n```\n// is the focussed player on the same lap, same waypoint, but\ncloser\
    \ to it?\nif (focusPlayerScript.GetCurrentLap() ==\n    _tempRC.GetCurrentLap()\
    \ && focusPlayerScript.\nGetCurrentWaypointNum() > _tempRC.GetCurrentWaypointNum()\n\
    \    && focusPlayerScript.IsLapOne() && _tempRC.IsLapOne())\n    isAhead = true;\n\
    ```\n```"
