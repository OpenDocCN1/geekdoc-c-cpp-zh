- pgno: 258
  md: "Making each ID number unique is a case of incrementing an ID counter called\
    \ currentID whenever an ID is called for.\n\n```\n// this player will be on its\
    \ first lap\nraceLaps.Add(currentID, 1);\n```\n\nAt the start of the race, when\
    \ the RaceController is first registered with GlobalRaceManager, the raceLaps\
    \ Hashtable adds an entry for this player starting at 1 to indicate that this\
    \ is the first lap.\n\n```\n// this player will be in last position\nracePositions.Add(currentID,\
    \ racePositions.Count + 1);\n```\n\nracePositions is a hashtable for storing the\
    \ current race position of each player. There will need to be some ordering to\
    \ find out who is winning the race, so at this stage we add an entry to the hashtable\
    \ in a default position, which is calculated with by taking the current number\
    \ of entries in the hashtable and adding one (racePositions.Count +1) to it. This\
    \ will be updated later in the class when the race positions are calculated.\n\
    \n```\n// store a reference to the race controller, to talk to later\nraceControllers.Add\
    \ ( currentID, theRaceController );\n```\n\nAbove, the RaceController script Component\
    \ attached to the player requesting an ID gets added to the raceControllers Hashtable.\n\
    \n```\n// default finished state\nraceFinished[currentID]=false;\n```\n\nAs the\
    \ race is just beginning, not ending, the raceFinished state of this player is\
    \ defaulted to false above.\n\n```\n// increment our racer counter so that we\
    \ don't have to do any counting or lookup whenever we need it\nnumberOfRacers++;\n\
    ```\n\nMay as well keep a count of how many players there are here, since all\
    \ new players will have to be fed through this function. It will save having to\
    \ count anything later to find out how many players there are, as the integer\
    \ numberOfRacers will hold the count for us.\n\n```\n// pass this id back out\
    \ for the race controller to use\n}\nreturn currentID;\n```\n\nThe currentID is\
    \ finally returned to the RaceController calling this function at the end of the\
    \ function above.\n\n```\npublic int GetRacePosition(int anID)\n{\n    // just\
    \ returns the entry for this ID in the racePositions hashtable\n    return (int)racePositions[anID];\n\
    }\n```"
  merge: -1
  img_proc: true
- pgno: 259
  md: "GetRacePosition() takes an ID as a parameter and returns the race position\
    \ of that player, as stored in the racePositions Hashtable. Accessing data from\
    \ the hashtable is a straightforward exercise of providing the key inside square\
    \ brackets.\n\n```\npublic int GetLapsDone(int anID)\n{\n    // just returns the\
    \ entry for this ID in the\n    raceLaps hashtable\n    return (int)raceLaps[anID];\n\
    }\n```\n\nJust as GetRacePosition(), the GetLapsDone() function takes an ID as\
    \ a parameter and returns the current lap count of that player, as stored in the\
    \ raceLaps Hashtable.\n\n```\npublic void CompletedLap(int anID)\n{\n```\n\nCompletedLap()\
    \ is called by a RaceController when the player passes all of the waypoints and\
    \ crosses the start/finish line. The parameter it takes is an integer; the player’s\
    \ unique ID.\n\n```\n// if should already have an entry in race laps,\nlet’s just\
    \ increment it\nraceLaps[anID] = (int)raceLaps[anID] + 1;\n```\n\nThe entry for\
    \ anID in the raceLaps Hashtable is incremented by adding one to its current value.\
    \ Note that we do not shortcut with something like raceLaps[anID]++ because this\
    \ refers to a hashtable, at this stage, not a number to increment. Instead, the\
    \ first part of the statement says we want to set the entry in the hashtable,\
    \ and the second part of the statement gets a value out of the hashtable and increases\
    \ it.\n\n```\nif ((int)raceLaps[anID] == totalLaps &&\n(bool)raceFinished[anID]!=true)\n\
    {\n    raceFinished[anID] = true;\nracersFinished++;\n```\n\nAbove, we check to\
    \ see if this player has completed enough laps (by checking its entry in raceLaps\
    \ against the variable totalLaps) and not yet finished the race (its entry in\
    \ raceFinished should be false right now) then, if these conditions are met, this\
    \ player’s entry in the raceFinished Hashtable is updated to true.\n\n```\n//\
    \ tell the race controller for this ID that\nit is finished racing\n_tempRC =\
    \ (RaceController)raceControllers[anID];\n_tempRC.RaceFinished();\n}\n```\n\n\
    Above, we retrieve this player’s race controller from the raceControllers Hashtable,\
    \ so that it can call on its RaceFinished() function to let the RaceController\
    \ component know that this player’s race is over."
