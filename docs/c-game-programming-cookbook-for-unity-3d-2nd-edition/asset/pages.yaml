  md: 'Gizmos.DrawSphere draws a sphere at a set position and radius like this:


    ```

    Gizmos.DrawSphere(currentPoint,2);

    ```


    and this one


    ```

    // draw the line between the last waypoint

    Gizmos.color=Color.red;

    Gizmos.DrawLine(lastPoint, currentPoint);

    ```


    Gizmos.DrawLine is another utility provided by Unity, to draw a simple line between
    two 3d vectors. The Gizmo drawing system has a few more options available to make
    editing easier.


    According to the Unity documentation, the Gizmo interface provides;


    |  |  |

    |---|---|

    | DrawCube | Draw a solid box with center and size. |

    | DrawFrustum | Draw a camera frustum using the currently set Gizmos.matrix for
    its location and rotation. |

    | DrawGUITexture | Draw a texture in the scene. |

    | DrawIcon | Draw an icon at a position in the scene view. |

    | DrawLine | Draws a line starting at from toward to. |

    | DrawRay | Draws a ray starting at from + direction. |

    | DrawSphere | Draws a solid sphere with center and radius. |

    | DrawWireCube | Draw a wireframe box with center and size. |

    | DrawWireSphere | Draws a wireframe sphere with center and radius. |


    As stated earlier in this chapter, the waypoints are used at one stage as respawn
    points for vehicles that may be stuck or off-track. Their rotations are also used
    to ensure that the repositioned vehicle is facing in the correct direction; for
    that reason, we need the waypoints to face ''forward''. To make sure that the
    rotations of our waypoints are correct, we go through and point each one forward
    toward the next one:


    ```

    pointT.LookAt(currentPoint);

    ```


