    \ The Init() function sets default values for our enemy stats and each function\
    \ provides a way to change or enemy stat set values.\n\n# 10.4 The AIBotController\
    \ Class – Making an Enemy Bot Controller\n\nLet's talk a little about how this\
    \ AI is supposed to work. Its behavior is rather basic, but it should be a good\
    \ start for your own bots. What happens is that the AI bot will patrol around\
    \ randomly, avoiding walls, until a player comes into range. At that point, our\
    \ bot will turn to face the player and then go into chase mode, trying to head\
    \ directly for the player whenever it is in sight. Our AI will also fire its weapon\
    \ at random intervals by using the weapon control outlined in Section 10.6 of\
    \ this chapter.\n\nThe AIBotController class uses BaseAIController to move a bot\
    \ around and derives from BaseEnemyStatsController from the previous Section 10.3\
    \ to deal with enemy health.\n\n```\nusing UnityEngine;\nusing AIStates;\n\nnamespace\
    \ GPC\n{\n    public class AIBotController : BaseEnemyStatsController\n    {\n\
    \        private Vector3 moveVec;\n        private Vector3 targetMoveVec;\n  \
    \      private float distanceToChaseTarget;\n```"
