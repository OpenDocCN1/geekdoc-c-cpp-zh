- pgno: 35
  md: "of useful things to help manage your game. We will go into the script in full\
    \ detail in Chapter 3, Section 3.2.1.\n\nIn the Inspector now, there are three\
    \ dropdown menu fields for Current Game State, Target Game State, and Last Game\
    \ State. Below those, a whole lot of events that will be fired by our state machine\
    \ entering states like loaded, game started, and so forth. We will deal with game\
    \ states in full, further in this chapter in Section 2.7.1.\n\nBefore anything\
    \ else, we do need to add a few variables. Place this code just after the class\
    \ declaration, above void Start():\n\n```\npublic float runSpeed = 1f;\npublic\
    \ float distanceToSpawnPlatform = 2f;\npublic bool isRunning;\n```\n\nrunSpeed\
    \ will be used by platform movement code to determine how fast to move the platforms\
    \ across the screen to simulate running.\n\ndistanceToSpawnPlatform contains a\
    \ float value representing the gap (in 3d units) between platforms.\n\nisRunning\
    \ is a Boolean used by platforms to know whether they should be moving or not.\
    \ The main use for isRunning is at the start of the game, before the player starts\
    \ running as it sits in its idle animation state. We will use it again at the\
    \ end of the game, just to stop the platforms moving when we show the final score\
    \ game over messages.\n\nNow that we have these variables set up in the Game Manager,\
    \ we need to make this class accessible from everywhere so that other scripts\
    \ can access it. To do that, we will take a basic Singleton approach. See Chapter\
    \ 1, Section 1.4 for more information on this.\n\nBeneath the variables you just\
    \ added, right after the line:\n\n```\npublic bool isRunning;\n```\n\nAdd the\
    \ following code:\n\n```\npublic static RunMan_GameManager instance { get; private\
    \ set; }\n// set instance in this script's constructor\npublic RunMan_GameManager()\n\
    {\n    instance = this;\n}\n```\n\nWhat this does is to make a variable that is\
    \ accessible from anywhere because it's public and static. As the constructor\
    \ runs when a GameManager instance gets created, our public static variable gets\
    \ populated with a reference to 'this' instance. Other scripts can now talk to\
    \ this instance by referring to its static variable like this:\n\n```\nRunMan_GameManager.instance\n\
    ```\n\nGoing in via this instance variable, any other script in your game can\
    \ call functions on RunMan_GameManager, access public variables, or set public\
    \ variables. Just make sure that only one instance of RunMan_GameManager ever\
    \ exists at any time, otherwise you may find a script trying to access the wrong\
    \ object. If you do find yourself making more complicated scenarios that could\
    \ lead to multiple instances you may want to add check to see if the instance\
    \ variable is already populated before setting it. In the case of this game, we\
    \ only ever need this single instance to be attached to a single GameObject in\
    \ a single Scene and this is enough."
