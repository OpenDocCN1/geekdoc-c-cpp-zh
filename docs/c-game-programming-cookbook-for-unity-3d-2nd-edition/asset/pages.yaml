    RaceFinished() will be called by the GlobalRaceManager class to tell this player
    when the race has ended. Above, we set isFinished to true so that we have something
    to check against if we need to elsewhere in the script, and then a call to PlayerFinishedRace()
    is made. Below that, we can see that PlayerFinishedRace() does not contain anything.
    The intention here is that you override PlayerFinishedRace() with whatever you
    want the player to do at the end of the race – perhaps that is bring the vehicle
    to a halt or perhaps to have it play an animation or something like that. The
    default behavior is that the players will just continue driving but in the RacePlayerController.cs
    overridden version for this game example, we tell the user’s vehicle to be taken
