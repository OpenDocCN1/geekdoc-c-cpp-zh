- pgno: 283
  md: '+   3. BlasterGameManager derives from BaseGameManager and uses BaseUserManager
    to spawn when the game starts (and how many lives the player has etc.). It will
    also use the ScreenAndAudioFader class from GPC_Framework/COMMON/USER INTERFACE
    to fade the Scene in or out.

    +   4. Sound Controller – The BaseSoundController class from Chapter 9, Section
    9.1, is used to play game over and level complete sounds, with individual prefabs
    making their own sounds like firing noises or explosions.

    +   5. User Interface – The user interface for in game will derive from the CanvasManager
    script from Chapter 11, Section 11.1, to fade UI elements in or out.

    +   6. The BlasterPlayer class (the main class for the player) derives from BasePlayerStatsController,
    which also uses BaseUserManager to provide stats for the player for lives and
    score values.

    +   7. CameraThirdPerson uses BaseCameraController.


    Note that those Components already described in detail elsewhere in this book
    will not be repeated in this chapter, it is expected that you will find them in
    their respective chapters instead.


    # 15.2 Main Menu Scene Overview


    The main menu is made from the template main menu found in the GPC_Framework/TemplateScenes
    folder.


    The main menu loads another Scene that acts as a game loader. The game loading
    Scene loads two addition Scenes – a core Scene, and an additional level Scene.
    The Scene loader merges the core and level Scenes together and starts the game.


    # 15.3 The Core Scene Overview


    The main parts of the game are split between two Scenes. One contains the level
    – that is, walls and enemy spawn positions (this could be expanded out to a full
    3d environment if you wanted to) – and the second is a core Scene containing game
    logic and anything which is shared in every Scene during the game like the main
    outside walls of the arena and the Camera.


    In most cases, you would put the full 3d level into the level Scenes, but in the
    case of this game we have the Arena and Lights in the core Scene. We do this just
    because the arena (the outside walls of the play area and a ground plane) are
    shared across all levels. If you use this as a template for your own games, you
    will most likely remove Arena and Lights from the core Scene and keep all level
    objects in the level Scenes.


    # 15.3.1 The BlasterGameManager Class


    The BlasterGameManager is a central communications hub for the game. It derives
    from BaseGameManager and overrides some of its base functions as well as adding
    some of its own.'
