  img_proc: true
- pgno: 262
  md: "The third condition, above, checks that focusPlayerScript and _tempRC are on\
    \ the same lap as well as both aiming at the same waypoint. From there, it checks\
    \ to see if the distance between focusPlayerScript and its target waypoint is\
    \ less than _tempRC's distance to its waypoint. If focusPlayerScript is closer\
    \ to its waypoint (which is the same waypoint as _tempRC) and _tempRC has not\
    \ finished its lap, then we know that focusPlayerScript must be ahead and the\
    \ script can go ahead and set isAhead to true.\n\nNote that we check IsLapDone()\
    \ on the _tempRC object to make sure that this player has not yet crossed the\
    \ finish line.\n\n```\n// has the player completed a lap and is getting ready\
    \ to move onto the next one?\nif (focusPlayerScript.GetCurrentLap() ==\n_tempRC.GetCurrentLap()\
    \ && focusPlayerScript.\nGetCurrentWaypointNum() == _tempRC.GetCurrentWaypointNum()\
    \ &&\nfocusPlayerScript.GetCurrentWaypointDist() <\n_tempRC.GetCurrentWaypointDist())\n\
    isAhead = true;\n```\n\nThe fourth condition checks that both players are on the\
    \ same lap and the same waypoint, but this time looks to see whether the focus\
    \ player has registered a lap done before _tempRC has. If focusPlayerScript.IsLapDone()\
    \ is true and _tempRC.IsLapDone() is false, we know the passed in player has completed\
    \ its lap before the one we are checking against, and isAhead is set to true.\n\
    \n```\nif (focusPlayerScript.GetCurrentLap() ==\n_tempRC.GetCurrentLap() && focusPlayerScript.GetCurrentWaypointNum()\
    \ ==\n_tempRC.GetCurrentWaypointNum() && (focusPlayerScript.IsLapDone()\n== true\
    \ && _tempRC.IsLapDone() == false))\nisAhead = true;\n```\n\nAbove, a fifth condition\
    \ does a similar check to the last one, only this time omitting any waypoint distance\
    \ checking. Here, the code focuses on whether the two players are on the same\
    \ lap and, when they are on the same lap, whether the focusPlayerScript has finished\
    \ its lap or not. When focusPlayerScript.IsLapDone() is true and tempRT.IsLapDone()\
    \ is false, we know that the focused player is ahead and can go ahead and set\
    \ isAhead to true.\n\n```\nif (focusPlayerScript.GetCurrentLap() ==\n_tempRC.GetCurrentLap()\
    \ && (focusPlayerScript.IsLapDone() ==\ntrue && !_tempRC.IsLapDone()))\nisAhead\
    \ = true;\n```\n\nThe final condition (phew!) checks to see if both players are\
    \ on the same lap and that our passed in player has finished a lap before the\
    \ one in _tempRC.\n\n```\nif ( isAhead )\n{\n    myPos--;\n}\n```\n\nAt this point,\
    \ isAhead tells us whether the player represented by focusPlayerScript is ahead\
    \ of the current player represented by _tempRC. If isAhead is true, the code above\
    \ reduces the value of myPos to move the player's race position up by one."
