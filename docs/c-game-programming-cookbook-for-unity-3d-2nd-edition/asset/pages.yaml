- pgno: 184
  md: "The AI controller incorporates waypoint control into the mix, using the WaypointsController\
    \ class to manage them:\n\n```\npublic void SetWayController( WaypointsController\
    \ aControl )\n{\n    _waypointsController=aControl;\n    aControl=null;\n}\n```\n\
    \nSince the AI bot does not know which waypoints to use, another script (such\
    \ as the game controller) will call SetWayController and pass in a WaypointsController\
    \ object.\n\n```\n// grab total waypoints\ntotalWaypoints = _waypointsController.GetTotal();\n\
    ```\n\nAbove, totalWaypoints contains a cached value of the total number of waypoints\
