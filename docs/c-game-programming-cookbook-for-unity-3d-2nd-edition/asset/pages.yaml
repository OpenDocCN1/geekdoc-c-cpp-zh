  md: "reset when we start the timer, just in case the timer had previously been running.\
    \ If the timer had been running, we do this to make sure that any time 'in-between'\
    \ the timer being stopped and the timer starting up again, is not be counted.\n\
    \n```\n```\npublic void StopTimer()\n{\n    // stop the timer\n    isTimerRunning\
    \ = false;\n\n    // carry out an update to the timer\n    UpdateTimer();\n}\n\
    ```\n```\n\nIn StopTimer() above, isTimerRunning is set to false, which stops\
    \ UpdateTimer() from adding any extra time to the currentTime variable. To make\
    \ sure we count the last bit of time correctly, a quick call to UpdateTimer()\
    \ is made at the end of the function above.\n\nIf there is ever a need to reset\
    \ the timer, we need to refresh the main variables to default states. In the ResetTimer()\
    \ function; timeElapsed, lastTime and currentTime are reset:\n\n```\n```\npublic\
    \ void ResetTimer()\n{\n    // resetTimer will set the timer back to zero\n  \
    \  timeElapsed = 0.0f;\n    currentTime = 0.0f;\n    lastTime = Time.realtimeSinceStartup;\n\
    \n    // carry out an update to the timer\n    UpdateTimer();\n}\n```\n```\n\n\
    Above, we reset all the time variables to their starting states and call UpdateTimer()\
    \ to start the timer process again.\n\nWhenever we need to display the time on\
    \ the screen, there is a good chance that we will need it to be formatted in a\
    \ way like minutes: seconds: milliseconds. The GetFormattedTime function takes\
    \ this value and breaks it up into the units we need, then puts together a nicely\
    \ formatted string and returns it:\n\n```\n```\npublic string GetFormattedTime()\n\
    {\n    // carry out an update to the timer so it is 'up to date'\n    UpdateTimer();\n\
    }\n```\n```\n\nAbove, GetFormattedTime() is called first. As mentioned earlier,\
    \ the timer does not update itself – it is a lazy updater in that it only updates\
    \ when we ask it so before providing the formatted time this ensures that the\
    \ calculations are up-to-date.\n\nFrom there on we are simply doing the math to\
    \ get the minutes, seconds and milliseconds values from currentTime:\n\n```\n\
    ```\n// grab hours\naHour = (int)currentTime / 3600;\naHour = aHour % 24;\n//\
    \ grab minutes\naMinute = (int)currentTime / 60;\n```\n```"
