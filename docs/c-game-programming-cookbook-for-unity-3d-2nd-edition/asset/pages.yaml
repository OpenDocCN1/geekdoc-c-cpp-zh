    \ void ExitGame()\n{\n    // close the app down\n    Application.Quit();\n}\n\
    ```\n```\n\nExitGame() uses Application.Quit() to close the game, which will only\
    \ happen in a standalone build. It will do nothing in the editor.\n\n```\n```csharp\n\
    public virtual void OptionsBackToMainMenu()\n{\n    // return to main menu from\
    \ options\n    _canvasManager.LastCanvas();\n}\n\npublic virtual void BackToMainMenu()\n\
    {\n    // return to main menu from options\n    _canvasManager.LastCanvas();\n\
    }\n}\n```\n```\n\nThe last two functions above deal with going back to the main\
    \ menu, using the CanvasManager.LastCanvas() function which hides the current\
    \ Canvas and shows the previous one.\n\n# 11.2.3 Combining BaseMainMenuManager\
    \ to Use the ProfileManager Script for Saving and Loading Audio Settings\n\nThe\
    \ BaseMainMenuManager.cs script takes care of the menu functions, but it has no\
    \ built-in method for saving or loading audio settings. The framework in this\
    \ book includes a ProfileManager designed to deal with user profiles and the saving\
    \ and loading of game data. The class we build out in this section, MenuWithProfiles,\
    \ uses ProfileManager to save the volume amounts out as part of the user data\
    \ and derives from BaseMainMenuManager.\n\nMenusWithProfiles begins with:\n\n\
    ```\n```csharp\nusing UnityEngine;\nusing GPC;\n\n[RequireComponent(typeof(BaseProfileManager))]\n\
    ```\n```"
