- pgno: 95
  md: "# 5.3.1 Third-Person Camera\n\nA third-person camera sits behind the player.\
    \ It is not quite the same as a follow camera; a third-person camera usually orbits\
    \ around the player rather than simply following it around. To visualize this,\
    \ imagine that the camera is tied to a pole attached to the target player. As\
    \ the player moves around, the camera remains to be the length of the pole away\
    \ from it, but the camera is free to move around the player in a circle. The position\
    \ of the camera is usually somewhere behind the player, with a little damping\
    \ on its horizontal movement applied to it, to allow for a good sense of movement\
    \ when the player turns. In some third-person camera setups, the camera may be\
    \ allowed to move in or out from the target player.\n\n```\nusing UnityEngine;\n\
    using System.Collections;\n\nnamespace GPC\n{\n    [AddComponentMenu(\"CSharpBookCode/Common/Cameras/Third\n\
    Person Cam Controller\")]\n\n    public class CameraThirdPerson : BaseCameraController\n\
    \    {\n        public float distance = 20.0f;\n        public float height =\
    \ 5.0f;\n        public float heightDamping = 2.0f;\n\n        public float lookAtHeight\
    \ = 0.0f;\n\n        public float rotationSnapTime = 0.3F;\n\n        public float\
    \ distanceSnapTime;\n\n        public Vector3 lookAtAdjustVector;\n\n        private\
    \ float usedDistance;\n\n        float wantedRotationAngle;\n        float wantedHeight;\n\
    \n        float currentRotationAngle;\n        float currentHeight;\n\n      \
    \  Quaternion currentRotation;\n        Vector3 wantedPosition;\n\n        private\
    \ float yVelocity = 0.0F;\n        private float zVelocity = 0.0F;\n\n       \
    \ void Update()\n        {\n```\n\nThe main update to the camera happens in Update(),\
    \ rather than FixedUpdate(). The reason for this is that we prefer everything\
    \ physics-wise to have been updated before moving the camera – which should have\
    \ happened by Update() – and in doing so, there should be no discrepancies between\
    \ the positions of our target objects between the end of the camera update and\
    \ the drawing of the next frame. Drawing at the wrong time can cause a jittering\
    \ effect as the objects we are following are updated after the camera positioning.\n\
    At the start of Update() is a null check to make sure that we have a target:\n\
    \n```\nif ( _cameraTarget == null)\n    return;\n```"
