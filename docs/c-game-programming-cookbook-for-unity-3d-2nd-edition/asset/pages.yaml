    as you set up game elements. To hide the interface, look in the Hierarchy panel
    and find the UI_Canvases object. UI_Canvases is an empty GameObject with the actual
    user interfaces below, parented to it. If you cannot see the three Canvas GameObjects
    under UI_Canvases, click on the little arrow next to UI_Canvases to expand it
    out. Now, click the first one – the GetReadyMessageCanvas GameObject – to highlight
    it. Hold shift on the keyboard and click the GameUICanvas GameObject. This should
    select all three canvases at the same time. Over in the Inspector, find the Component
    named Canvas Group and set the value in the Alpha field to 0. All the user interface
    should now be hidden.


    In the Project panel, find the Games/RunMan/Sprites folder. In Sprites, find the
    RunMan_Platform sprite. Left click and drag it into an empty part of the Hierarchy
    panel. If all goes well, you should see the platform appear in the center of the
    Game panel.


    With RunMan_Platform GameObject selected in the Hierarchy, move the mouse so that
    it is hovering over the Scene panel. Press F on the keyboard. This will focus
    on the currently selected object, moving the Scene view to the center of the object
    to make editing easier. You may want to use the mouse wheel to zoom out a little
    at this point, too. Just enough so that there is space around the platform to
    move it around without it going off the edge of the screen.


    In the Scene view, click and hold to grab the red arrow of the Gizmo Unity overlays
    on the platform. With the red arrow selected, you will only be able to move the
