- pgno: 253
  md: "We iterate through all the players in _playerList and do two things: The first\
    \ is to set AIControlled to true, if this was our player vehicle, it will now\
    \ be taken over by the AI. Next, we use GetComponent() to find the RaceInputController\
    \ Component on this vehicle. This is all on one line, so we assume that all vehicles\
    \ will have a RaceInputController and this line will produce an error if that\
    \ is not the case. Once we've used GetComponent to find a RaceInputController,\
    \ we call SetInputType() on it. SetInputType uses the enumerator RaceInputController.InputTypes\
    \ (a List of what types of input the Component supports) and here we set the vehicles\
    \ input type to RaceInputController.InputTypes.noInput so that a user will no\
    \ longer be able to have any input into how the vehicle is driven.\n\n```\nif\
    \ (!doneFinalMessage)\n{\n    doneFinalMessage = true;\n    _soundController.PlaySoundByIndex(2);\n\
    \    // show final text\n    _uiManager.ShowFinalMessage();\n    // drop out of\
    \ the race scene completely in\n    Invoke(\"FinishRace\", 10);\n}\n```\n\nAbove,\
    \ doneFinalMessage is a Boolean we check to ensure that this code can only ever\
    \ run once in a race. A duplicate call should never happen, but just in case it\
    \ does our doneFinalMessage will make sure that the code does not get stuck in\
    \ a loop of calling and never completing.\n\nWe set doneFinalMessage to true inside\
    \ the condition's curly brackets, then play a sound through _soundController to\
    \ let the player know that the race is complete. _uiManager.ShowFinalMessage()\
    \ will display the 'race finished' message to the user, and finally we schedule\
    \ a complete shutdown of the Scene – using Invoke() to make a call to FinishRace()\
    \ in 10 seconds.\n\nWhen called, FinishRace() will load the main menu, effectively\
    \ ending the game altogether:\n\n```\nvoid FinishRace()\n{\n    SceneManager.LoadScene(mainMenuSceneName);\n\
    }\n```\n\nThe ShowCount(), ShowCount() and ShowCount() functions switch the active\
    \ states of the user interface objects used to display the numbers during the\
    \ 3,2,1 count in, at the start of the race and a sound is played via the BaseSoundController\
    \ Component for each one:\n\n```\nvoid ShowCount1()\n{\n    _uiManager.ShowCount(1);\n\
    \    _soundController.PlaySoundByIndex(0);\n}\nvoid ShowCount2()\n{\n    _uiManager.ShowCount(2);\n\
    \    _soundController.PlaySoundByIndex(0);\n}\n```"
