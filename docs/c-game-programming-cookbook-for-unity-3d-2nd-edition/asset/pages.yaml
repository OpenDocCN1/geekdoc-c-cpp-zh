- pgno: 106
  md: "Above, if spawnCounter is greater or equal to totalAmountToSpawn then we need\
    \ to end this wave of spawning and either start another wave by resetting spawnCounter\
    \ to 0, or to cancel further calls to doSpawn() entirely with CancelInvoke().\
    \ If we are dropping out entirely and ending all spawning, the this.enabled =\
    \ false line will disable the GameObject so that it no longer receives any calls\
    \ to its functions from the engine (no more FixedUpdate(), Update(), or LateUpdate()\
    \ calls and so on). We also know that enough spawns have been made, so we drop\
    \ out of the function.\n\n```\n// create an object\nSpawn(_spawnObjectPrefabs[\
    \ currentObjectNum ].transform,\n_TR.position, Quaternion.identity);\n```\n\n\
    Above, we call out to a function named Spawn() - a custom function from the ExtendedCustomMonoBehaviour\
    \ class - to instantiate the prefab into the Scene. The parameters that Spawn()\
    \ takes is a Transform for the prefab to spawn, a position, and a rotation.\n\n\
    ```\nspawnCounter++;\ncurrentObjectNum++;\n// check to see if we've reached the\
    \ end of the spawn objects array\nif (currentObjectNum > _spawnObjectPrefabs.Length\
    \ - 1)\n    currentObjectNum = 0;\nif (shouldRandomizeSpawnTime)\n{\n    // cancel\
    \ invoke for safety\n    CancelInvoke(\"doSpawn\");\n    // schedule the next\
    \ random spawn\n    Invoke(\"doSpawn\", Random.Range(minimumSpawnTimeGap,\n timeBetweenSpawns));\n\
    }\n```\n\nWith the new prefab added to the Scene, our counters spawnCounter, and\
    \ currentObjectNum are incremented. After that, we check currentObjectNum to see\
    \ if it has been incremented too far - past the end of the _spawnObjectPrefabs\
    \ array. If we tried to use this as an index number to access the prefabs array\
    \ with Unity would throw an error, so at this point if we find that currentObjectNum\
    \ is too high it gets reset to 0.\n\nEarlier in the class, we used the shouldRandomizeSpawnTime\
    \ flag to decide whether to call this function with Invoke() or call it with InvokeRepeating().\
    \ Above, if we are using a randomize spawn time, we need to schedule the next\
    \ call to doSpawn at a different, randomized period of time. For this, first any\
    \ outstanding calls to doSpawn() are cancelled with CancelInvoke() - this is just\
    \ a safety measure, as in the current state there should never be any duplicate\
    \ calls. Again, we use Invoke() and Random.Range() to choose a random period of\
    \ time. Random.Range() takes the minimum value of minimumSpawnTimeGap and the\
    \ maximum value of timeBetweenSpawns.\n\n# 5.8.2 Trigger Spawning\n\nThe TriggerSpawner\
    \ class instantiates an object when another object enters the trigger that this\
    \ script Component is attached to.\n\nThe easiest way to use this Component is\
    \ to add a cube primitive to a Scene and set its Box Collider's IsTrigger property\
    \ to true. Add this TriggerSpawner Component"
  merge: -1
  img_proc: true
- pgno: 107
  md: "to your cube and then whenever your player enters the area outlined by the\
    \ cube, it will trigger this script to spawn a prefab. Once you have the area\
    \ worked out correctly, disable the cube's Mesh Renderer Component and you have\
    \ a trigger spawn area.\n\nOne such use for this script would be to spawn an enemy\
    \ when the player reaches an area in a level.\n\n```\nusing UnityEngine;\n\nnamespace\
    \ GPC\n{\n    [AddComponentMenu(\"CSharpBookCode/Utility/Trigger Spawner\")]\n\
    \    public class TriggerSpawner : Spawner\n    {\n        public GameObject ObjectToSpawnOnTrigger;\n\
    \        public Vector3 offsetPosition;\n        public bool onlySpawnOnce;\n\
    \        public LayerMask triggerLayerMask;\n```\n\nWe add this script as a menu\
    \ item first, using Unity's AddComponentMenu tag. This class derives from the\
    \ Spawner class from Section 5.8.1 of this chapter, so we can use its Spawn()\
    \ function, have it draw a Gizmo so we can see where we will be spawning, and\
    \ to get access to its base class, ExtendedCustomMonoBehaviour.\n\n```\nvoid OnTriggerEnter(Collider\
    \ other)\n{\n    if (IsInLayerMask(other.gameObject.layer, triggerLayerMask))\n\
    \        return;\n    Spawn(ObjectToSpawnOnTrigger.transform, _TR.position + offsetPosition,\
    \ Quaternion.identity);\n    if (onlySpawnOnce)\n        Destroy(gameObject);\n\
    }\n```\n\nWhen an object with a Rigidbody and a Collider enter this GameObject's\
    \ Collider (which MUST have its IsTrigger property checked in the Inspector),\
    \ the prefab in objectToSpawnOnTrigger will be spawned at this GameObject's position.\n\
    \n# 5.8.3 Timed Spawning\n\nThis TimedSpawner Component will spawn a prefab in\
    \ a set amount of time. In an arena blaster game, this might be used to delay\
    \ the spawning of an enemy from the start of a level, using a random delay to\
    \ make the start of the level more dynamic.\n\n```\nusing UnityEngine;\n\nnamespace\
    \ GPC\n{\n    public class TimedSpawner : Spawner\n    {\n        public float\
    \ initialSpawnDelay;\n        public bool shouldRandomizeSpawnTime = true;\n \
    \       public float randomDelayMax = 0.5f;\n```"
  merge: -1
  img_proc: true
- pgno: 108
  md: "```\n    [Space]\n    public bool waitForCall;\n    private Vector3 myPos;\n\
    \    private Quaternion myRot;\n\n    [Space]\n    public Transform _prefabToSpawn;\n\
    ```\n\nThe class derives from Spawner, which provides a path to the Spawn() func-\n\
    tion in ExtendedCustomMonoBehaviour and the shouldRandomizeSpawnTime\nvariable.\
    \ Unlike the Spawner class, this script uses a single prefab rather than an\n\
    array – the prefab reference should be placed into the `_prefabToSpawn` field\
    \ via\nthe Inspector in Unity.\n\n```\n    public override void Start()\n    {\n\
    \        base.Start();\n        if (waitForCall)\n            return;\n\n    \
    \    StartSpawnTimer();\n    }\n```\n\nThe Start() function overrides the one\
    \ found in our base class, Spawner. We\nstill want to do everything that the base\
    \ class does, which is remedied with a call\nto `base.Start()`. Above, Start()\
    \ looks at `waitForCall` to see whether or not it should\njust get stuck in and\
    \ start spawning. Whenever `waitForCall` is set to true, it is\nassumed that you\
    \ will call `StartSpawnTimer()` from another script rather than\nhave it called\
    \ automatically in the Start() function above.\n\n```\n    public void StartSpawnTimer()\n\
    \    {\n        float spawnTime = initialSpawnDelay;\n\n        if (shouldRandomizeSpawnTime)\n\
    \            spawnTime += Random.Range(0, randomDelayMax);\n\n        Invoke(\"\
    SpawnAndDestroy\", spawnTime);\n    }\n```\n\nStartSpawnTimer() starts by calculating\
    \ how much time we need to wait\nbefore running our SpawnAndDestroy(). It does\
    \ this by declaring a local variable\nnamed `spawnTime` that starts out set to\
    \ the value of `initialSpawnDelay`. We then\ncheck to see if we need to add a\
    \ random amount of time to this, looking to see if\n`shouldRandomizeSpawnTime`\
    \ is true. When it is, we use Unity's random number\ngenerator in `Random.Range()`\
    \ to get a random number between 0 (the first param-\neter we pass it) and `randomDelayMax`\
    \ (the second parameter). You can adjust the\nmaximum random number by adjusting\
    \ the value in `randomDelayMax` via the\nInspector. The random number is added\
    \ to our `spawnTime` variable, which will\nnow be whatever `initialSpawnDelay`\
    \ is set to plus the random number.\n\nWith `spawnTime` calculated, all that is\
    \ left for this function to do above is to\nuse `Invoke()` to schedule a call\
    \ to SpawnAndDestroy() in `spawnTime` seconds.\n\n```\n    void SpawnAndDestroy()\n\
    \    {\n        Spawn(_prefabToSpawn, _TR.position,\n_TR.rotation);\n        Destroy(gameObject);\n\
    \    }\n}\n```"
