    \ BackToMenu()\n{\n    SceneManager.LoadScene(\"race_mainMenu\");\n}\n}\n```\n\
    ```\n\n# 14.4 The Core Scene Overview\n\nThe main parts of the game are split\
    \ into two Scenes. The first contains the level – that is, an environment (track)\
    \ with waypoints, starting points, and so forth – and the second core Scene contains\
    \ just game logic.\n\nWhen the game starts, the Game Manager in the core Scene\
    \ looks to BaseUserManager (the same one from Chapter 4, Section 4.3) to find\
    \ out which types of racers to add to the game. It adds the racers to the Scene,\
    \ instantiating their prefabs, and then we have a countdown before the race starts.\n\
    \n# 14.4.1 Game Manager – The RaceGameManager Class\n\nThe Game Manager starts:\n\
    \n```\n```csharp\nusing UnityEngine;\nusing System.Collections.Generic;\nusing\
    \ UnityEngine.SceneManagement;\nusing GPC;\n\npublic class RaceGameManager : BaseGameManager\n\
    {\n```\n```\n\nAbove, we add the System.Collections.Generic namespace so that\
    \ Lists can be used. In the previous edition of this book, storage was mostly\
    \ done in ArrayLists. Since then, ArrayLists have fallen out of favor due to problems\
    \ with memory management. The problems may have been resolved, but generic Lists\
    \ are now more commonly used and regarded to be less cumbersome.\n\nUnityEngine.SceneManagement\
    \ is there so that we can access SceneManager to load the main menu once the game\
    \ has finished, and finally, the GPC namespace you may remember from previous\
    \ chapters is the namespace for the framework in this book.\n\nThe RaceGameManager\
    \ class derives from BaseGameManager (the same one from Chapter 3, Section 3.2.1.),\
    \ which means we get access to all its game states and events right from the get-go.\
    \ This will save a considerable amount of development time in dealing with state\
    \ transitions and triggering events for them.\n\n```\n```csharp\n[Header(\"Game\
    \ Specific\")]\npublic string mainMenuSceneName = \"mainMenu\";\npublic int totalLaps\
    \ = 3;\npublic Transform _playerParent;\npublic IsoCamera _cameraScript;\npublic\
    \ GameObject _playerGO1;\npublic GameObject[] _playerPrefabList;\npublic RaceUIManager\
    \ _uiManager;\npublic BaseSoundManager _soundController;\npublic WaypointsController\
    \ _waypointController;\npublic bool didInit;\n// user // player data\npublic BaseUserManager\
    \ _baseUserManager;\npublic List<UserData> _playerInfo;\n```\n```"
