- pgno: 177
  md: "There will be times when we may need to force the state of the bot from another\
    \ script, such as telling it which state to start in when the game begins. Use\
    \ the function SetAIState() for that, passing in an AIState.\n\n```\npublic virtual\
    \ void SetChaseTarget(Transform theTransform)\n{\n    // set a target for this\
    \ AI to chase, if required\n    _followTarget= theTransform;\n}\n```\n\nAt the\
    \ end of the SetAIState() function, above, we call UpdateTargetState() to do anything\
    \ that needs to be done before we can fully switch mode to the new state. For\
    \ example, you could call out to your animation system to play an animation when\
    \ the AI changes state between patrolling and chasing. In the base version of\
    \ this script, there is no extra logic in UpdateTargetState() and the function\
    \ is there to maintain protocol of having a target state and a current state with\
    \ a good place to trigger action when the target state is changed. If chasing\
    \ is required, the SetChaseTarget() function should be used to pass in a reference\
    \ to the Transform that needs chasing. When you pass a Transform into SetChaseTarget()\
    \ the Transform will be stored in a variable named followTarget.\n\n```\npublic\
    \ virtual void Update()\n{\n    // make sure we have initialized before doing\
    \ anything\n    if (!didInit)\n        Init();\n}\n```\n\nThe Update() function\
    \ is called by Unity each frame update, but we need to be sure that the script\
    \ has properly initialized before doing anything significant with it because it\
    \ may be possible for Update() to be called before Init() has finished its run.\n\
    \n```\nif (!AIControlled)\n    return;\n\n    // do AI updates\n    UpdateCurrentState();\n\
    ```\n\nAbove, remembering that we are still in the main Update() function, if\
    \ AIControlled is not set to true this function drops out before it has chance\
    \ to do anything. The Boolean variable AIControlled makes it possible to turn\
    \ on or off AI control. For an example of where this may come in handy, it is\
    \ great for situations where we may want AI to take control of the player; such\
    \ as at the end of a racing game when the race is complete and we want the car\
    \ to continue driving but take the player out of the game. The AI script would\
    \ be attached to all players, but in the case of the user's vehicle it is only\
    \ activated after the race finishes. This is what happens in the example racing\
    \ game in this book, in Chapter 14.\n\nUpdateCurrentState() is right at the core\
    \ of the script – it is called by the Update() function and deals with coordinating\
    \ the bot to do what it should:\n\n```\npublic virtual void UpdateCurrentState()\n\
    {\n```\n\nIn some cases, the AI script does not manipulate its GameObject's physics\
    \ directly but instead acts as an input provider to another script which deals\
    \ with"
  merge: -1
  img_proc: true
- pgno: 178
  md: "the actual physics. The reason it works this way is so that AI can use the\
    \ same movement controllers as the player without having to recode movement each\
    \ time. For example, in the example racing game in Chapter 14, the AI cars use\
    \ the exact same car physics as the user. When a car is set to use AI, the car\
    \ physics controller script uses input from the AI script rather than a user input\
    \ controller.\n\n```\n// reset our inputs\nhorz=0;\nvert=0;\n```\n\nAbove, the\
    \ AI script uses horz and vert (both floats) to store horizontal and vertical\
    \ input, which are the standard variable names used in other scripts in this book.\
    \ Here in the UpdateCurrentState() function, they are reset to zero. This is centering\
    \ the inputs before other functions change them.\n\n```\nswitch (currentAIState)\n\
    {\n    case AIState.paused_no_target:\n        // do nothing\n    break;\n   \
    \ default\n        // idle (do nothing)\n    break;\n}\n```\n\nAbove, if there\
    \ is anything that needs to be done when the AI is in a particular state, this\
    \ is the place. The switch statement above takes the variable currentAIState and\
    \ we run the corresponding code for whatever the current state is.\n\nIn BaseAIController,\
    \ the UpdateCurrentState() function is a placeholder – it is assumed that you\
    \ will override this function in a derived version of this class to put your own\
    \ logic into it. You can find examples of this in the AIBotController and AISteeringController\
    \ scripts in GPC_Framework/Scripts/COMMON/AI.\n\nBefore the state is changed from\
    \ targetAIState to currentAIState, we need to go through the UpdateTargetState()\
    \ function:\n\n```\npublic virtual void UpdateTargetState()\n{\n    switch (targetAIState)\n\
    \    {\n        default:\n            // idle (do nothing)\n        break;\n \
    \   }\n    currentAIState = targetAIState;\n}\n```\n\nAs we know that this will\
    \ only happen when a new current state is about to be set, we can call code that\
    \ only needs to be called when the AI enters the new state. Just as UpdateCurrentState(),\
    \ UpdateTargetState() is a placeholder that should be overridden by your own logic.\n\
    \nNext is a collection of functions to set inputs for turning left and right or\
    \ moving forwards and backward:\n\n```\npublic virtual void TurnLeft ()\n{\n \
    \   horz= -1;\n}\n```"
  merge: -1
  img_proc: true
- pgno: 179
  md: "```\npublic virtual void TurnRight ()\n{\n    horiz= 1;\n}\n\npublic virtual\
    \ void MoveForward ()\n{\n    vert= 1;\n}\n\npublic virtual void MoveBack ()\n\
    {\n    vert= -1;\n}\n\npublic virtual void NoMove ()\n{\n    vert= 0;\n}\n```\n\
    \nEach function above is there to make it easier to interface with other types\
    \ of control systems. You can override them in a derived class or call them from\
    \ another.\n\nNext up is the LookAroundFor() function. This will be called when\
    \ we need a bot to chase a target. For an example of using it, check out the AIBotController.cs\
    \ script.\n\n```\npublic virtual void LookAroundFor()\n{\n    if (_followTarget\
    \ != null)\n    {\n        float theDist = Vector3.Distance\n        (_TR.position,\
    \ _followTarget.position);\n        bool canSee = CanSee(_followTarget);\n   \
    \     if (theDist < maxChaseDistance)\n        {\n            if (canSee == true)\n\
    \                SetAIState(AIState.\nchasing_target);\n        }\n    }\n   \
    \ else\n    {\n        GameObject potential =\nGameObject.FindGameObjectWithTag(potentialTargetTag);\n\
    \        _followTarget = potential.transform;\n    }\n}\n```\n\nThe LookAroundFor()\
    \ function, above, starts by making sure we have something in the _followTarget\
    \ variable. The target may be set by this script or another outside script. If\
    \ we have a target to follow already, we can go ahead and do a distance check\
    \ using Unity's built in function Vector3.Distance() – the result of which we\
    \ put into a local variable named theDist. We also do a test to see if our target\
    \ is visible to the AI by calling CanSee() and storing the result in the local\
    \ variable canSee. The CanSee() function is further down in the script. It will\
    \ return true if the AI has a clear line between it and the target."
  merge: -1
  img_proc: true
- pgno: 180
  md: "If the distance to the target falls within our maxChaseDistance, we make sure\
    \ that the result back from CanSee() was true (canSee==true). At this stage, we\
    \ now know several things about the target:\n\n+   1. We have a target.\n+   2.\
    \ The target is within maxChaseDistance away.\n+   3. There is a clear view of\
    \ the target from the AI.\n\nIf the above conditions are met, SetAIState() is\
    \ called to change the target state to AIState.chasing_target – making our AI\
    \ turn and move toward it.\n\nWithout a Transform in _followTarget, we have nothing\
    \ to follow and the function drops through to the else statement. Here, we will\
    \ instead try to find a suitable target using GameObject.FindGameObjectWithTag().\
    \ The new target object will be the first object (if any object is returned) from\
    \ that search.\n\nComing up next is one of the core Components of the AI controller\
    \ – the IsObstacleAhead() function. In this part, Physics.Raycast is used to raycast\
    \ out ahead (and slightly to the left or right) to check for obstacles. It returns\
    \ an integer, expressing its findings with the following values:\n\n+   0 - No\
    \ obstacles were found\n+   1 - An obstacle was detected front, left side only\n\
    +   2 - An obstacle was detected front, right side only\n+   3 - Obstacle or obstacles\
    \ detected on both sides\n\nThe IsObstacleAhead() function is used to detect other\
    \ Colliders, though in its current state it can be a little unpredictable and\
    \ it could do with some more iteration to make it work nicer. It works, but it\
    \ could work better, and I have to leave that up to you, dear reader!\n\n```\n\
    private int obstacleFinding;\n\npublic virtual int IsObstacleAhead()\n{\n    obstacleHitType=0;\n\
    \    if (_TR == null)\n    {\n        return 0;\n    }\n}\n```\n\nThe return result\
    \ for the function is stored in a variable named obstacleHitType, which starts\
    \ out getting set to a default value of 0 at the top of the function.\n\nThe beginning\
    \ of the function above checks to make sure that we have an actual Transform in\
    \ _TR. If not, we know that either this GameObject's Transform has been destroyed,\
    \ or something has gone wrong, so we return a result of 0.\n\n```\n// draw this\
    \ raycast so we can see what it is doing\nDebug.DrawRay(_TR.position, (_TR.forward\
    \ + (_TR.right * 0.5f)) * obstacleAvoidDistance);\n```"
