  md: "# 14.4.2 Race Control – The GlobalRaceManager Class\n\nYou can find GlobalRaceManager.cs\
    \ in the folder GPC_Framework/Scripts/COMMON/GAME MANAGEMENT.\n\nThe GlobalRaceManager\
    \ relies on RacePlayerController Components being attached to each player. RacePlayerController\
    \ Components register themselves with GlobalRaceManager as they initialize. Our\
    \ GlobalRaceManager class then takes care of managing the bigger picture, dealing\
    \ with comparing players positions to calculate race positions, to calculate the\
    \ number of completed laps and to provide race state.\n\nGlobalRaceManager exists\
    \ within the GPC namespace and derives from MonoBehaviour so it can be attached\
    \ to GameObjects and access some of Unity's built-in functions:\n\n```\nnamespace\
    \ GPC\n{\n    public class GlobalRaceManager : MonoBehaviour\n    {\n        public\
    \ int totalLaps;\n        public bool raceAllDone;\n        public int racersFinished;\n\
    \        private int currentID;\n        private Hashtable raceControllers;\n\
    \        private Hashtable racePositions;\n        private Hashtable raceLaps;\n\
    \        private Hashtable raceFinished;\n        private int numberOfRacers;\n\
    \        private int myPos;\n        private bool isAhead;\n        private RaceController\
    \ _tempRC;\n        public static GlobalRaceManager instance;\n    }\n}\n```\n\
    \nThis class can be accessed via its static variable instance.\n\n```\npublic\
    \ void Awake()\n{\n    if (instance != null)\n        Destroy(instance);\n   \
    \ \n    instance = this;\n    \n    // we set this to -1 so that the first returned\
    \ id will be 0 (since it gets incremented on request)\n    currentID = -1;\n}\n\
    ```\n\nIts Awake() function ensures that only one instance of the script exists\
    \ at any time, by checking to see if its static variable named instance is null.\
    \ If instance is null, we know that an instance of this script has not yet been\
    \ made. If instance is not null and already has a reference to an existing Component,\
    \ we destroy it here.\n\nAbove, we set instance to reference this instance of\
    \ GlobalRaceManager. Next, the variable currentID is set to -1.\n\ncurrentID is\
    \ an integer that will be used to generate unique IDs for each player in the game.\
    \ Whenever an ID number is requested by the RacePlayerController, currentID is\
    \ incremented so that players have ascending ID numbers in the order they are\
    \ spawned in. As the numbers are incremented"
