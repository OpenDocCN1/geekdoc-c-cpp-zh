- pgno: 183
  md: "of the value in the float followTargetMaxAngle. The maximum amount of turn\
    \ can, as a public variable of course, be changed on the Inspector on this Component.\n\
    \n```\nrotateTransform.Rotate( 0, targetAngle *\nmodelRotateSpeed * Time.deltaTime,\
    \ 0 );\n}\n```\n\nThe last line of TurnTowardTarget() above, uses Transform.Rotate\
    \ to turn the Transform. targetAngle is multiplied by modelRotateSpeed and multiplied\
    \ by Time.deltaTime to make the rotation amount time based.\n\nNext up, CanSee()\
    \ does a simple line of sight check to see if anything is between the bot and\
    \ its target. This is useful for cutting off chases when the target goes behind\
    \ a wall or somewhere unreachable by the AI:\n\n```\npublic bool CanSee(Transform\
    \ aTarget)\n{\n    // first, let's get a vector to use for\n    raycasting by\
    \ subtracting the target position from our AI position\n    tempDirVec = Vector3.Normalize(aTarget.\n\
    \    position - _TR.position);\n}\n```\n\nIt creates a normalized vector from\
    \ the two positions, then uses the new vector to cast a ray out from the bot at\
    \ the length by maxChaseDistance.\n\n```\n// let's have a debug line to check\
    \ the distance\nbetween the two manually, in case you run into trouble!\nDebug.DrawLine(_TR.position\
    \ + (visionHeightOffset *\n_TR.up), aTarget.position, Color.red);\n```\n\nAbove,\
    \ just before the actual ray cast, there is a debug line to represent what is\
    \ going on in this function so that it is easy to see what the AI is supposed\
    \ to be doing when you are in the Unity editor.\n\n```\nif (Physics.Raycast(_TR.position\
    \ +\n(visionHeightOffset * _TR.up), tempDirVec, out hit, Mathf.Infinity))\n{\n\
    \    if (IsInLayerMask(hit.transform.gameObject.\n    layer, playerLayer))\n \
    \   {\n        return true;\n    }\n}\n// nothing found, so return false\nreturn\
    \ false;\n```\n\nAbove, the ray cast starts from our Transform (_TR) position\
    \ along with a height offset. Sometimes you may not want the ray to be cast from\
    \ the point of origin on the AI – one reason for this could be that the point\
    \ of origin is at the bottom of the GameObject and may just hit the ground, so\
    \ you can adjust the height offset in the Inspector on this Component to make\
    \ this happen.\n\ntempDirVec (that vector we calculated earlier between the AI\
    \ and its target) is passed into Physics.Raycast() too, as the direction vector.\
    \ Mathf.Infinity is the limit of the ray cast, since we do not need to limit it.\
    \ When a hit occurs in the ray cast, the next line of code checks to see if the\
    \ hit object's layer is in the LayerMask playerLayer. If the target is on the\
    \ correct layer, we know that there is nothing blocking the way so we can return\
    \ true, otherwise execution falls through to return false at the end of the function."
