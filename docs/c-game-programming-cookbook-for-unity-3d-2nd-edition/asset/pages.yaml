- pgno: 205
  md: '# 11 Menus and User Interface


    In this chapter, first up is a full breakdown of the main menu used for all of
    the example games. The main menu structure should provide a perfect starting place
    for any main menu system.


    The second part of this chapter will look at in-game UI.


    # 11.1 CanvasManager Class/Canvas Management


    CanvasManager is a class devoted to switching between user interface Canvases,
    for example when you want to move from a main menu to a sub menu such as an options
    menu. It relies on a Component called CanvasGroup, which is provided by Unity
    as part of the engine. CanvasGroup lets us set an alpha transparency level of
    an entire Canvas as well as providing methods to enable or disable interactivity
    or enable or disable blocking of raycasts by a Canvas.


    CanvasManager holds an array of Canvas GameObjects in _UIcanvasGroups and you
    can then use the functions ShowCanvas(index), HideCanvas(index) and HideAll()
    to switch them around as needed. The CanvasManager class can also deal with fading
    in and out, if you provide a Canvas for it to use in its FadeCanvasGroup variable.
    For example, you can stretch out a simple UI Panel GameObject to fill a Canvas
    and then have the Canvas stretch to fill the screen. This Canvas makes up your
    FadeCanvasGroup and you can use CanvasManager''s FadeOn(), FadeOff(), FadeIn()
    and FadeOut() functions to have it cover the game view.'
