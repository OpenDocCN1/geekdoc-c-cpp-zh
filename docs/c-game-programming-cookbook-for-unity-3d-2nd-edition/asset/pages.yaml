- pgno: 254
  md: "```\n```\nvoid ShowCount3()\n{\n    _uiManager.ShowCount(3);\n    _soundController.PlaySoundByIndex(0);\n\
    }\n```\n```\n\nHideCount() hides all of the 3,2,1 count images:\n\n```\n```\n\
    void HideCount()\n{\n    _uiManager.ShowCount(0);\n}\n```\n```\n\nThe next part\
    \ of the Race Game Manager class is a function to find the player starting points\
    \ in the level Scene:\n\n```\n```\nvoid GetStartPoints()\n{\n    _startPoints\
    \ = new List<Transform>();\n}\n```\n```\n\nAs you may recall, this game is split\
    \ into two Scenes per level – the core Scene containing the game logic and the\
    \ level Scene containing level specifics like the environment itself and start\
    \ positions. As we load levels at runtime, there is no way of setting start positions\
    \ via the Inspector in the editor (as they will change from level to level) so\
    \ an automated system is necessary.\n\nAbove, GetStartPoints() kicks off by making\
    \ a new List in the variable _startPoints. This is a variable used by the SetupPlayers()\
    \ function as it creates the players, adds them to the Scene and requires a start\
    \ position for each one.\n\n```\n```\nGameObject _startParent =\nGameObject.Find(\"\
    StartPoints\");\n```\n```\n\nThe starting points for our players are parented\
    \ to an object named StartPoints. It does not matter so much what the start point\
    \ GameObjects themselves are called, just as long as they are parented to a GameObject\
    \ named StartPoints. The reason being that we use GameObject.Find() to look for\
    \ a GameObject named StartPoints in the Scene. Once we have that, we iterate through\
    \ all of its child objects like this:\n\n```\n```\nforeach (Transform sp in _startParent.transform)\n\
    {\n    _startPoints.Add(sp);\n}\n```\n```\n\nThe foreach loop above will go through\
    \ all Transforms found under our StartPoints GameObject – but it is important\
    \ to note that this method is not recursive and if any of the StartPoints are\
    \ at a level below this (i.e. children of children of StartPoints) they will be\
    \ left out.\n\nAs the loop goes through each child object, we use _startPoints.Add()\
    \ to add them to our List of start points. At the end of this function, _startPoints\
    \ should be a List populated with all the starting points from any open Scene.\n\
    \n```\n```\nvoid GetWaypointsController()\n{\n    _waypointController =\nFindObjectOfType<WaypointsController>();\n\
    }\n```\n```"
