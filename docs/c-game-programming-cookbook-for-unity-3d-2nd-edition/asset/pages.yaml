    \ the vehicle.\n\n```\npublic override void UpdateCurrentState()\n{\n    // reset\
    \ our inputs\n    horiz = 0;\n    vert = 0;\n\n    // look for obstacles\n   \
    \ obstacleFinderResult = IsObstacleAhead();\n\n    switch (currentAIState)\n \
    \   {\n        case AIState.move_along_waypoint_path:\n            SteerToWaypoint();\n\
    \            break;\n\n        case AIState.chasing_target:\n            SteerToTarget();\n\
    \            break;\n\n        case AIState.paused_no_target:\n            //\
    \ do nothing\n            break;\n\n        default:\n            // idle (do\
    \ nothing)\n            break;\n    }\n}\n```\n\nAbove, just like the placeholder\
    \ version of UpdateCurrentState in the BaseAIController class, we check each state,\
    \ and call functions to run relevant code for each one. For the steering system,\
    \ we only use three states: move_along_waypoint_path, chasing_target and paused_no_target.\n\
    \n```\nvoid SteerToWaypoint()\n{\n    if (!didInit)\n        return;\n    UpdateWaypoints();\n\
    \    if (_currentWaypointTransform == null)\n        return;\n}\n```\n\nAbove,\
    \ we check that the class has initialized (didInit is true) then make a call to\
    \ UpdateWaypoints() which is an inherited function from the BaseAIController class.\
    \ We then check that __currentWaypointTransform has a Transform in it. The UpdateWaypoints()\
    \ function takes care of updating our current waypoint, checking the distances\
    \ and so on, including setting _currentWaypointTransform to provide us with a\
    \ target to steer toward.\n\n```\nrelativeWaypointPosition = TR.InverseTransformPoint(_currentWaypointTransform.position);\n\
    // by dividing the horz position by the magnitude, we get a decimal percentage\
    \ of the turn angle that we can use to drive the wheels\nhorz = (relativeWaypointPosition.x\
