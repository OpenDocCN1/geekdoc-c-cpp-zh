  md: 'parent and be positioned in the exact same place - if we don''t do that, collisions
    won''t be happening where the sprite is and the game will make no sense.


    Click on the RunMan_Run-Sheet_0 GameObject in the Hierarchy and set all three
    X, Y and Z fields of its Position (in the Transform section at the top of the
    Inspector) to zero, if they are not already. You may find that the sprite moves
    away from the center of the Game panel, but that is okay – we will set the exact
    player position after setting up physics.


    # 2.6.2 Adding Physics and Collisions to RunMan


    By the end of this section, RunMan will be able to fall and rest on a platform.


    First, we need to add a Rigidbody to the RunMan GameObject to represent the player
    in the physics simulation. Click on the RunMan GameObject to get started. In the
    Inspector, click Add Component and find Rigidbody 2D (either scroll through to
    find it, or start typing Rigidbody into the search bar).


    The gravity value needs changing on the Rigidbody 2D Component, to help give RunMan
    a jump style suitable for this game. In the Inspector, on the Rigidbody 2D Component,
    change Gravity Scale to 0.6


    Next, find the Constraints field and click the little arrow to the left of it,
    to expand out the Constraints section. Next to Freeze Rotation, put a check into
    the Z box by clicking on it.


    RunMan now has physics, but he has no Collision Components and will fall to infinity
    until we add a Collider. With the RunMan GameObject still selected in the Hierarchy,
    click the Add Component button in the Inspector. Find and add Capsule Collider
    2D. Be careful not to add a regular Capsule Collider here, though. The standard
    Capsule Collider will only work in a 3D simulation and since Unity uses a separate
    physics engine for 2D physics than 3D, we need to be sure to use only 2D Components.


    The Capsule Collider is a good way to represent a human in a physics simulation.
    You can elongate it from the head to the feet and it has a minimal contact surface
    to keep the friction levels down as it moves along the ground. As it has width,
    you can adjust a capsule to represent the body width too. In this section, you
    can either edit the Collider manually and try to get it to look like the shape
    in Figure 2.12, or you can enter the following numbers into the Inspector:


    Offset:


    X: 0

    Y: 0.01


    Size:


    X: 0.04

    Y: 0.15


    Direction:


    Vertical


    Once you have entered in all the numbers via the Inspector, compare the shape
    of your capsule to the one in Figure 2.12 – if it looks good, move on to the next
    stage of adding player scripts.'
