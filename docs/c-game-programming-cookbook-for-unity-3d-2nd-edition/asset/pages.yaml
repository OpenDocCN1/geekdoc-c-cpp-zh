- pgno: 182
  md: 'If obstacleHitType has was not set by the first ray cast, its value will still
    be at its default of 0; this tells us that this ray is one to get a hit and that
    the function has only found an obstacle on this side – obstacleHitType gets set
    to 2.


    ```

    } else { // if we have hits on both left and right raycasts, it''s a type 3 obstacleHitType=3;
    }

    ```


    Next, we deal with the situation where obstacleHitType is not at its default 0.
    If it is not 0, we know that both this ray cast and the previous one has found
    obstacles. To represent obstacles found on both sides, obstacleHitType gets set
    to 3. All that is left to do now is to return the findings of our ray casting:


    ```

    return obstacleHitType;

    ```


    The next part of BaseAIController.cs is TurnTowardTarget(). This function will
    turn the bot (more specifically, the Transform set in the variable rotateTransform)
    toward the Transform passed to it as a parameter:


    ```

    public void TurnTowardTarget( Transform aTarget ) { if(aTarget==null) return;
    }

    ```


    If we are going to be doing anything with a target, the first step is making sure
    we have a target to turn toward (above) in the variable aTarget.


    ```

    relativeTarget = _rotateTransform.InverseTransformPoint ( aTarget.position );

    ```


    Above, we calculate a Vector3 that will represent the target position relative
    to the AI so that we can look at this vector''s values and establish the direction
    toward the target. e.g. a positive x value means the target is to the right of
    the car, negative to the left, and a positive z means the target is in front of
    the car and negative z behind.


    ```

    // Calculate the target angle targetAngle = Mathf.Atan2 ( relativeTarget.x, relativeTarget.z
    ); // Atan returns the angle in radians, convert to degrees targetAngle *= Mathf.Rad2Deg;

    ```


    The newly calculated relativeTarget is then used above with Unity''s Mathf. Atan2
    function to find an angle of rotation from the vector. Atan returns the angle
    in radians, whereas radians are preferable for this, so we use Mathf. Rad2Deg
    to convert targetAngle from radians to degrees.


    ```

    targetAngle = Mathf.Clamp(targetAngle, - _followTargetMaxTurnAngle, _followTargetMaxTurnAngle);

    ```


    Above, to enforce limits on the amount of rotation to apply in one step, Mathf.Clamp
    is used to keep the angle between the positive and negative versions'
