  md: '# 13 Loading Level Scenes


    Loading and saving Scenes in Unity is done with the built in SceneManager class.
    SceneManager offers a range of utilities for Scenes – everything from straight
    loading to combining and manipulating multiple Scenes at the same time.


    The RunMan game example from Chapter 2 used SceneManager to load the game from
    the main menu using SceneManager.LoadScene(). It is a function that will load
    a new Scene and unload the current one without you having to do anything further.
    Later in this book, the Blaster and Racing Game examples both use an alternative
    method that loads two Scenes, combines them together into one and then manually
    unloads the current Scene. This is useful in cases where the game logic remains
    the same throughout, but you want to load in different environments and/or enemies
    and so forth. Rather than copying the game logic to every Scene, you can make
    a core Scene and separate individual level Scenes which are combined at runtime
    into one. Traditionally, in Unity, this has been achieved by using a single GameObject
    containing the game logic and making it persist across Scenes with the DoNotDestroyOnLoad
    tag. Having to maintain that object and make sure that all references are correctly
    disposed of, states reset, and new objects created each time, can be messy, and
    difficult to manage.


    When you just use SceneManager''s LoadScene() function in Unity, loading locks
    everything up until the new Scene has finished loading. This may be fine if the
    delay is less than a few seconds, perhaps loading a simple Scene like the RunMan
    game from Chapter 2. On the other hand, long delays or lockups negatively impact
    the perceived polish level of your game and it can look as though something has
    gone wrong as the user waits for the Scene to update. The LevelLoader class from
    this chapter loads levels asynchronously, meaning we can'
  merge: -1
  img_proc: true
- pgno: 230
  md: "do cool things as the loading takes place such as showing a percentage complete\
    \ amount, a progress bar, or a spinning image. It is, after all, the small touches\
    \ like these that help your game appear more polished to its players.\n\nIn the\
    \ Unity editor, you can work on multiple Scenes at the same time by dragging Scenes\
    \ from the Project browser directly into the Hierarchy panel. Check out the example\
    \ Blaster and Racing games in this book for more on setting up and editing separated\
    \ core and level Scenes like this.\n\nAll of the scripts for this chapter can\
    \ be found in the folder Assets/GPC_Framework/Scripts/COMMON/LEVEL LOADING.\n\n\
    # 13.1 A Script for Loading Levels: LevelLoader.cs\n\nLevelLoader.cs starts with:\n\
    \n```\n```csharp\nusing System.Collections;\nusing UnityEngine;\nusing UnityEngine.SceneManagement;\n\
    \nnamespace GPC\n{\n    [AddComponentMenu(\"CSharpBookCode/Utility/Level Loader\"\
    )]\n    public class LevelLoader : MonoBehaviour\n    {\n```\n```\n\nAbove, something\
    \ to note is that we need to access the namespace System.Collections. Without\
    \ the using statement giving us access to those types, we would not be able to\
    \ use the IEnumerator type we need to be able to run coroutines during loading.\n\
    \nWe also need to use UnityEngine.SceneManagement to be able to access the SceneManager\
    \ class for loading.\n\nLevelLoader derives from MonoBehaviour – at some point,\
    \ if you are using co-routines you will need to derive from MonoBehaviour (even\
