    \ Vars\")]\n    public class LevelVars : MonoBehaviour\n    {\n        public\
    \ static int currentLevel;\n        public static string levelNamePrefix = \"\
    game_level_\";\n        public static string coreSceneName = \"game_core\";\n\
    \    }\n}\n```\n```"
