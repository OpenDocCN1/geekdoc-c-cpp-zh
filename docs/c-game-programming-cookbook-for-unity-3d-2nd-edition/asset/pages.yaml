- pgno: 19
  md: '# # 1 Making Games in a Modular Way


    # ## 1.1 Important Programming Concepts


    There are some things you will need to know to utilize this book fully. For a
    lot of programmers, these concepts may be something you were taught in school.
    As a self-taught coder who did not find out about a lot of these things until
    long after I had been struggling on without them, I see this section as a compilation
    of ‘things I wish I’d known earlier’ !


    # ### 1.1.1 Manager and Controller Scripts


    Sometimes, even I get confused about the difference between a manager and a controller
    script. There is no established protocol for this, and it varies depending on
    who you ask. Like some readers of the first edition of this book, I find it a
    little confusing and I will try to clear that up.


    # #### *1.1.1.1 Managers*


    Managers deal with overall management, in a similar way to how a Manager would
    work in a workplace situation.


    # #### *1.1.1.2 Controllers*


    Controllers deal with systems that the managers need to do their jobs. For example,
    in the racing game example for this book, we have race controller scripts and
    a global race manager script. The race controller scripts are attached to the
    players and track their positions on the track, waypoints, and other relevant
    player-specific race information. The global race manager script talks to all'
  merge: -1
  img_proc: true
