  md: "The last line of CreatePlayers() sets the temporary List we made, _playerInfo,\
    \ to null, just to make sure that we do not incur any garbage collection from\
    \ it at the start of the game.\n\n```\n```csharp\npublic void RegisterEnemy()\n\
    {\n    enemyCounter++;\n}\n```\n```\n\nWhen an enemy is added to the game, the\
    \ BlasterEnemyBot script will call the above RegisterEnemy() function. We keep\
    \ a count of how many enemies there are, in the variable enemyCounter, so we can\
    \ tell when they have all been destroyed and it is time to move on to the next\
    \ level.\n\n```\n```csharp\npublic void EnemyDestroyed()\n{\n    // before reacting\
    \ to a player destroyed, we should\n    check that we're still in game playing\
    \ mode\n    if (currentGameState != Game_State.gamePlaying)\n        return;\n\
    \n    enemyCounter--;\n    _thePlayerScript.AddScore(150);\n    UpdateUIScore(_thePlayerScript.GetScore());\n\
    \n    if (enemyCounter <= 0)\n        SetTargetState(Game_State.LevelEnding);\n\
    }\n```\n```\n\nEnemies hit by projectiles will call the above EnemyDestroyed()\
    \ function. We kick it off by making sure that the game is still in the Game_State.gamePlaying\
    \ state and, if we find it is in any other state than that, we drop out. This\
    \ prevents any collisions being registered either before or after the game has\
    \ started.\n\nAs mentioned above, we keep a count of how many enemies there are\
    \ in the variable enemyCounter. When one gets destroyed, we decrement enemyCounter\
    \ by one.\n\nThe next job is call a function named EnemyHit in the BlasterPlayer\
    \ class. EnemyHit() will award the player with score. With the score updated,\
    \ we then call on the function UpdateUIScore, passing in _thePlayerScript.GetScore()\
    \ as a parameter. UpdateUIScore will take that parameter and display it on screen\
    \ as a score value. BlasterPlayer.GetScore() will return an integer containing\
    \ that player's current score.\n\nNext, we check to see if the level has finished\
    \ by seeing if enemyCounter is less than or equal to zero. If it is, we know that\
    \ all of the bots have been destroyed and it must be time to move to the next\
    \ level so SetTargetState() gets called to set the new target state to Game_State.LevelEnding.\n\
    \n```\n```csharp\npublic void UpdateUIScore(int theScore)\n{\n    _uiManager.UpdateScoreUI(theScore);\n\
    }\n```\n```\n\nWe will look at the BlasterUIManager class in detail in Section\
    \ 12.2.6 of this chapter. Above, we call BlasterUIManager.UpdateScoreUI() and\
    \ pass it the score that was passed into this function as its parameter. BlasterUIManager\
    \ will update the on-screen score display."
