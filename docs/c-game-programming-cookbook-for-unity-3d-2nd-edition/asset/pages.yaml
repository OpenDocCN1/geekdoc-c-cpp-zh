    \ on the _profileManager object. This will save out the volume levels along with\
    \ the save profile whenever the save profile is saved.\n\n```\n```csharp\npublic\
    \ override void OptionsBackToMainMenu()\n{\n    // save updated settings\n   \
    \ _profileManager.SaveProfiles();\n    // return to main menu from options\n \
    \   _canvasManager.LastCanvas();\n}\n```\n```\n\nFinally, for the MenuWithProfiles\
    \ class, we override OptionsBackToMainMenu() from the base class to add saving\
    \ of the profiles whenever the user exits the options menu to go back to the main.\
    \ Calling SaveProfiles() will save out all of the profiles ProfileManager is storing\
    \ data for (default is 3 profiles).\n\n# 11.3 In-Game User Interface\n\nThe way\
    \ the example games in this book deal with user interfaces is to have a dedicated\
    \ script for UI actions (like updating the text of the score display and so on)\
    \ that the Game Manager calls to keep user interface away from other game logic.\n\
    \nThe main game interface is on its own Canvas and when we need to do things like\
    \ display a message (for example, a get ready message before gameplay starts)\
    \ the message is on its own Canvas so that we can fade out the main game Canvas\
    \ first. The CanvasManager is used to switch between them and it also provides\
    \ a nice bit of polish by fading in the main UI when the game first starts."
