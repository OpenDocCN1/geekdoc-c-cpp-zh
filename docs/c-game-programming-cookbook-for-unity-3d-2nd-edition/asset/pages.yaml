- pgno: 133
  md: "```\n```csharp\npublic virtual void GetInput()\n{\n    // calculate steering\
    \ amount\n    steer = Mathf.Clamp(_inputController.GetHorizontal(),\n    -1, 1);\n\
    \    // how much accelerator?\n    motor = Mathf.Clamp(_inputController.GetVertical(),\
    \ 0, 1);\n    // how much brake?\n    brake = -1 *\n    Mathf.Clamp(_inputController.GetVertical(),\
    \ -1, 0);\n}\n```\n```\n\nAbove, we grab input values from the Component referenced\
    \ in _inputController (in this case, an instance of BaseInputController). Rather\
    \ than relying on them being in the range we need, Mathf.Clamp is used to restrict\
    \ our values between a start and end amount. For example, steer will only ever\
    \ be between -1 and 1 thanks to the Mathf.Clamp statement above, where -1 is a\
    \ turn to the left and 1 is a turn to the right. The motor variable will always\
    \ be between 0 and 1 and brake between -1 and 0.\n\nBraking works a little differently\
    \ because it gets its input from the same axis used for the motor. The joystick\
    \ axis used goes from 1, which would be up, to -1 which is down. Using the same\
    \ axis but having two separate values for motor and brake means that we use positive\
    \ values from GetVertical() to apply to motor but we also need to filter out any\
    \ positive value coming back from GetVertical() to apply to the brakes. We only\
    \ want the negative values of GetVertical() when it comes to breaking, because\
    \ that is when the joystick is down rather than up. To do this, first of all the\
    \ values are clamped between -1 and 0 by Mathf.Clamp. This will return a negative\
    \ number, which is what we want but the WheelColliders will only take a positive\
    \ number, so we have to reverse it by subtracting it from -1. What we end up with\
    \ is that, whenever GetVertical() returns a negative value, the value of brake\
    \ will be an inversed positive value of it ready to apply to the wheels back in\
    \ the above UpdatePhysics() function.\n\n```\n```csharp\npublic virtual void UpdateEngineAudio()\n\
    {\n    _engineSoundSource.pitch = audioPitchOffset +\n    (Mathf.Abs(_frontWheelLeft.rpm)\
    \ * 0.005f);\n}\n```\n```\n\nChanging the pitch of the engine AudioSource object\
    \ makes a convincing motor sound. As it may be possible for the variable mySpeed\
    \ to be negative, Mathf.Abs is used and an arbitrary multiplier to bring the number\
    \ down to something that changes the pitch in a satisfactory manner. The number\
    \ was decided by trial and error, adjusting its value until the motor sounded\
    \ right.\n\nAs well as setting up WheelColliders, you may need a method to align\
    \ the visual models to their physics counterpart like the BaseWheelAlignment class\
    \ in the following section.\n\n# 6.3 Wheel Alignment\n\nWheelColliders will do\
