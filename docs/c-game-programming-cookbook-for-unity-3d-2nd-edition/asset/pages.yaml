  md: "It is the ideal place to put our movement code. Replace the placeholder Update\
    \ function already in your script with this:\n\n```\nvoid Update()\n{\n    //\
    \ keep move speed updated from game manager\n    moveSpeed = RunMan_GameManager.instance.runSpeed;\n\
    \n    // move the transform\n    _TR.Translate((moveVector * moveSpeed) * Time.deltaTime);\n\
    }\n```\n\nIn the code above, moveSpeed gets its value from the runSpeed variable\
    \ you made in RunMan_GameManager earlier in this chapter. It uses that Singleton\
    \ variable instance, to gain access to it.\n\nBeneath that, we use the Translate\
    \ function (part of Transform) to move the platform. moveVector is a Vector3 typed\
    \ variable which holds a direction vector used to define the direction of movement\
    \ of the object. This gets multi-plied by the moveSpeed to give us a Vector suitable\
    \ for Translate that will change with the speed in RunMan_GameManager. It is then\
    \ multiplied by Time.deltaTime. Unity provides some a helper class named Time\
    \ to help track or manipulate how the engine deals with time. deltaTime is a variable\
    \ holding the amount of time that has passed since the last frame Update, so we\
    \ can use that deltaTime amount to make movement that adapts to time rather than\
    \ being locked to framerates. This is a better idea than just move x amount each\
    \ frame, because if the system does something in the background that causes the\
    \ game to stall or if your game is running slower than it should on another system,\
    \ the movement won’t work as intended. By having movement that adapts to time\
    \ elapsed, if things run slow or there are glitches it will move the same amount\
    \ even if it needs to jump a bit.\n\nFinally, add this function below the Update()\
    \ function above the final curly bracket in the script:\n\n```\npublic void SetMoveSpeed(float\
    \ aSpeed)\n{\n    // provide method to adjust speed from other scripts\n    moveSpeed\
    \ = aSpeed;\n}\n```\n\nAbove, we just add a simple method for another script to\
    \ tell this script how fast or slow to move. This will be used a little further\
    \ in this chapter, called at the start of the game to tell the starting platforms\
    \ to move once the game begins.\n\nPress CTRL-S to save your script and go back\
    \ to Unity.\n\nWith RunMan_Platform selected in the Hierarchy, look to the Auto\
    \ Transform Move Component you made, leave Move Speed at 0 but change Move Vector\
    \ so that X is -1, leaving Y and Z at 0.\n\nFinally, we need to set up the Layer\
    \ of the platform so that it can be detected as ground. In the top right of the\
    \ Inspector, just below the name of the GameObject to the right, there is a dropdown\
    \ menu labeled Layer (Figure 2.9). Click the drop-down and choose Ground from\
    \ the list.\n\nPress Play in the editor. The platform should zip off to the left\
    \ of the screen. If it did, nice job! That is how it is supposed to behave. Stop\
    \ playback by clicking the Stop button in the editor."
