    \ Start()\n{\n    // start with audio muted and fade covering the screen\n   \
    \ _fader.SetFadedOut();\n    // schedule a fade in after a little time\n    Invoke(\"\
    StartFadeIn\", 1f);\n    SetTargetState(Game.State.Loaded);\n}\n```\n\nWhen the\
    \ Start() function runs, automatically called by Unity, the first thing we need\
