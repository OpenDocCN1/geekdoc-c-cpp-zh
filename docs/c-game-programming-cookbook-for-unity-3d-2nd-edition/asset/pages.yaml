    \ the AI takeover, we tell _AIController that it can control this player by setting\
    \ its canControl variable to true.\n\nAt the end of the race, if you ever wanted\
    \ to do something different like have the cars keep going, the PlayerFinishedRace()\
    \ function would be the place to start.\n\n```\npublic void SetLock(bool state)\n\
    {\n    if (!didInit)\n        Init();\n    _myController.canControl = !state;\n\
    }\n```\n\nAbove, SetLock is used to tell our vehicle that it cannot be controlled.\
    \ First, we make sure that Init() has completed (as this will be called when the\
    \ player first spawns to hold them in place and it may be that this script has\
    \ not yet initialized) but if has not, we call to Init() from here so that _myController\
    \ will be populated and we can access it in the next line.\n\n_myController.canControl\
    \ is a Boolean we can set to decide whether the vehicle will be allowed to receive\
