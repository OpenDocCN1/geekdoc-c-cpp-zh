    At this stage, I understand that having to set AIControlled on two separate Components
    is not ideal. The only alternative would be to have either one of the BaseAIController
    or the RacePlayerController Components look at the other one and copy its AIControlled
    value across. As the goal of this book is to make stand-alone scripts wherever
    we can, making one script reference another goes against this principle. You may
    not always decide to pair up the BaseAIController with RacePlayerController; perhaps
    replacing BaseAIController entirely with different AI code, so having to reference
    two scripts AIControlled variables here is a tradeoff that ultimately gives us
    more freedom later on.


