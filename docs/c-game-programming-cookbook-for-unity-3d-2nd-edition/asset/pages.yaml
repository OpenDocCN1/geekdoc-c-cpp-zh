  md: '# 5 Recipes


    # Common Components


    # 5.1 Introduction


    The utility scripts and commonly used systems in this chapter may come in handy
    for a range of different types of game projects. In the Assets/GPC_Framework/Scripts/COMMON
    folder you will find an eclectic bunch of reusable scripts like timers and camera
    controllers. In this chapter, we focus on those standalone scripts. You can easily
    take these and use them in any project, with or without using the GPC framework
    from this book.


    Within the COMMON folder, there are several sub-folders. Those are;


    # AI


    This contains scripts related to player or automatic control, such as a script
    to talk to the BaseAIController.cs script and act as a simple, functional bot
    moving around in a game environment.


    # CAMERA


    Scripts related to the camera should go in here, such as third-person or top-down
    camera code.


    # GAME CONTROL


    The scripts in this folder are about overall game state control. In the example
    files, you will find:


    BattleController and GlobalBattleManager – used for deathmatch-style scoring and
    game state logic)'
