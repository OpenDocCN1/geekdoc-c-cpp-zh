- pgno: 15
  md: '# Introduction


    The overall goal of this book is to provide a library of C# code with which to
    jumpstart your projects and to help you with the overall structure of your games.
    Many development cookbooks focus on only providing snippets of code, but, here,
    we take a different approach. What you are holding in your hands right now (or
    on your screen) is a cookbook for game development that has a highly flexible
    core framework designed to speed up development of just about any type of Unity
    project.


    You might think of the framework as a base soup and the scripting components as
    ingredients. We can mix and match script components and we can share the same
    core scripts in many of them. The framework takes care of the essentials and we
    add a little extra code to pull it all together the way we want it to work.


    The framework is optional, however – you can use a lot of the components individually.
    If you intend on using the components in this book for your own games, the framework
    could either serve as a base to build your games on or simply as a tutorial test
    bed for you to rip apart and see how it all works. Perhaps you can develop a better
    framework or maybe you already have a solid framework in place. If you find a
    way to develop your own framework, I say do it. The key to game development is
    to do what works for you and your game projects – whatever it takes to cross the
    finish line.


    I hope it helps you to make your games and tell your stories. I also hope you
    remember to try to have fun doing it!'
  merge: -1
  img_proc: true
