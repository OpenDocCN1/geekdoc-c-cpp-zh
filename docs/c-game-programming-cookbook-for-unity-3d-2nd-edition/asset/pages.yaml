    \ to find the Camera with. For Camera.main to work, a Camera in the Scene must\
    \ have the MainCamera tag applied to it in the Inspector. This is the easiest\
    \ way to find the Camera in a Scene, but if for whatever reason this does not\
    \ work for you, add a new Camera typed variable to the variable declarations and\
    \ use that variable here, instead of Camera.main.\n\nThe code sets doFire to false\
    \ when onlyFireWhenOnScreen is true and the Renderer is not visible on screen.\
    \ If firing is cancelled in this way, it also drops out with a return statement\
    \ since there is no value left in executing the script further on this pass.\n\
    \n```\nweapon controller\n// tell weapon control to fire, if we have a\nif (_slotWeaponController!=null)\n\
