  md: "```\nprivate List<Transform> _startPoints;\nprivate int focusPlayerID;\nprivate\
    \ List<RacePlayerController> _playerList;\nprivate List<Transform> _playerTransforms;\n\
    private bool oldIsWrongWay;\nprivate bool doneFinalMessage;\n// position checking\n\
    private int theLap;\nprivate int numberOfRacers;\n```\n\nWe will skip past the\
    \ variable declarations, as they should become clear as we make our way through\
    \ the script. Instead, jump ahead to:\n\n```\npublic static RaceGameManager instance\
    \ { get; private set; }\n\npublic RaceGameManager()\n{\n    instance = this;\n\
    }\n```\n\nAbove, technically yes that is a variable declaration, so we did not\
    \ skip them all. The variable instance is used to create a simple Singleton pattern.\
    \ It is a static variable that will refer to this instance of the script. That\
    \ is, the one instance in our Scene. By making this variable static, it is accessible\
    \ from anywhere. Since it is a reference to an instance of this class, we can\
    \ call functions on it like RaceGameManager.instance.SomeFunction().\n\nThe RaceGameManager()\
    \ function above is known as a Constructor. It will be called when this class\
    \ is instanced automatically, making it the ideal place to populate our static\
    \ instance variable with a reference to 'this' instance.\n\nNext, a call to Init()\
    \ is made:\n\n```\nvoid Start()\n{\n    Init();\n}\n```\n\nStart() is called automatically\
    \ by Unity whenever the Scene starts. As we need to do a little set up when the\
    \ Scene starts this is the place to call our Init() function. That may seem obvious,\
    \ but there will be things in Init() that need to be done after the Scene has\
    \ initialized but before the game starts, which is why we call Init() from Start()\
    \ rather than any other built in Unity functions such as Awake() or OnEnabled().\n\
    \nThe Init() function is up next:\n\n```\nvoid Init()\n{\n    // tell race manager\
    \ to prepare for the race\n    GlobalRaceManager.instance.InitNewRace( totalLaps\
    \ );\n}\n```\n\nThis game uses a global race manager script. As discussed at the\
    \ beginning of this chapter, the race manager tracks state for the race overall.\
    \ The game controller needs to tell the race manager that the race is starting,\
    \ and a new race should be initialized. As GlobalRaceManager follows the Singleton\
    \ pattern again, we can call functions on it using GlobalRaceManager.instance.\
    \ GlobalRaceManager will also need to know the total laps for the race so that\
    \ it can tell when players finish the race, so we pass that into its InitNewRace()\
    \ function."
