- pgno: 129
  md: "```\n_engineSoundSource = _GO.GetComponent<AudioSource>();\n}\n```\n\nAbove,\
    \ if no engine sound source has been set up via the Inspector window of the Unity\
    \ editor, the script tries to find it with a call to GameObject.GetComponent().\
    \ The sound source will be stored in engineSoundSource and used solely for engine\
    \ sound effects.\n\nAs with all the movement controllers, SetUserInput (next)\
    \ sets a flag to decide whether inputs should be used to drive the vehicle:\n\n\
    ```\npublic void SetUserInput( bool setInput )\n{\n    canControl= setInput;\n\
    }\n```\n\nUnlike other movement controllers from this book, this one introduces\
    \ a lock state:\n\n```\npublic void SetLock(bool lockState)\n{\n    isLocked =\
    \ lockState;\n}\n```\n\nThe lock state is for holding the vehicle in place without\
    \ affecting its y-axis. This differs from just disabling user input as it adds\
    \ physical constraints to the physics object to hold it still (its purpose being\
    \ to hold the vehicle during the counting in at the start of a race or other similar\
    \ scenario).\n\n```\npublic virtual void LateUpdate()\n{\n    if(canControl)\n\
    \        GetInput();\n    UpdateEngineAudio();\n}\n```\n\nAbove, LateUpdate()\
    \ starts by checking for input via the GetInput() function, when canControl is\
    \ set to true. Next, UpdateEngineAudio() is called to update the pitch of the\
    \ engine sound based on the engine speed.\n\n```\npublic virtual void FixedUpdate()\n\
    {\n    UpdatePhysics();\n    DoFakeBrake();\n    CheckGround();\n}\n```\n\nAll\
    \ of the physics code is called, above, from a call to UpdatePhysics() in FixedUpdate().\
    \ We call out to a braking function DoFakeBrake() and CheckGround() to check to\
    \ see if the vehicle is on the ground.\n\n```\npublic virtual void UpdatePhysics()\n\
    {\n    CheckLock();\n}\n```\n\nCheckLock() is called first, which holds the vehicle\
    \ in place when the lock is on (when isLocked is true) – ideal for holding vehicles\
    \ in place at the start of a race!"
