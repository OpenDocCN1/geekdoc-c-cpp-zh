  md: "The only variable declaration above of note is that the spawn objects are in\
    \ an array. This means you can add more than one type of prefab to spawn.\n\n\
    ```\nvoid Start()\n{\n    // cache ref to our Transform\n    _TR = transform;\n\
    \    if(_cameraTransform==null)\n        _cameraTransform = Camera.main.\ntransform;\n\
    }\n```\n\nAbove, we cache the Transform and, if one has not been set in the Inspector,\
    \ we try to find the Transform of the main Camera in the Scene with Unity's built-in\
    \ Camera.main.\n\n```\nif (shouldAutoStartSpawningOnLoad)\n    StartSpawn();\n\
    ```\n\nWe find out how many objects are in the spawn list array and store the\
    \ result in a variable named totalSpawnObjects. This just makes it easier:\n\n\
    ```\npublic void OnDrawGizmos()\n{\n    if (distanceBasedSpawnStart)\n    {\n\
    \        Gizmos.color = new Color(0, 0, 1,\n0.5f);\n        Gizmos.DrawSphere(transform.position,\n\
    distanceFromCameraToSpawnAt);\n    }\n    else\n    {\n        Gizmos.color =\
    \ new Color(0, 1, 1f);\n        Gizmos.DrawSphere(transform.position, 1f);\n \
    \   }\n}\n```\n\nA Gizmo is a shape that can be used to provide a visual aid to\
    \ your Component or GameObject – a cube or a sphere – which gets displayed in\
    \ the Scene view of the editor. Thanks to the code, whenever this Component is\
    \ attached to a GameObject, Unity will draw a Gizmo around it to show you the\
    \ distance at which our Spawner will activate. Drawing takes place in the function\
    \ above, OnDrawGizmos(), which is called automatically by the game engine both\
    \ when the game is playing and when it is idle, too.\n\nAbove, we check the Boolean\
    \ variable named distanceBasedSpawnStart to see if we are using distance-based\
    \ spawning. If it is true, we draw the sphere based on the spawn distance. If\
    \ distanceBasedSpawnStart is false, we just draw the sphere with a fixed radius.\
    \ This way, we always have a Gizmo to make it easier to see where spawning will\
    \ occur.\n\nTo set the color of the Gizmo about to be drawn, you call Gizmos.color()\
    \ with the parameters of red, green, and blue followed by an alpha value. All\
    \ should be between 0 and 1. Once you have made a call to Gizmos.color() in your\
    \ function, anything you draw after that point will be drawn with that color until\
    \ you add another Gizmos.Color() call.\n\nDrawing a sphere Gizmo is as simple\
    \ as calling Gizmos.DrawSphere() and you pass in the position to draw it followed\
    \ by the radius of the sphere. Above, we take our Transform's position, and in\
    \ the first instance, we pass"
