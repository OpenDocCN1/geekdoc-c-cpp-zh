- pgno: 48
  md: "When the game starts, the code above sets our current state to Game.State.loaded\
    \ so code can run that we need to run as soon as the Scene is done loading.\n\n\
    Below the new Start() function, add the code below:\n\n```\n```csharp\npublic\
    \ override void UpdateTargetState()\n{\n    Debug.Log(\"targetGameState=\" + targetGameState);\n\
    \n    if (targetGameState == currentGameState)\n        return;\n\n    switch\
    \ (targetGameState)\n    {\n        case Game.State.loaded:\n            Loaded();\n\
    \            break;\n\n        case Game.State.gameStarting:\n            GameStarting();\n\
    \            StartGame();\n            break;\n\n        case Game.State.gameStarted:\n\
    \            // Fire the game started event\n            GameStarted();\n    \
    \        SetTargetState(Game.State.gamePlaying);\n            break;\n\n     \
    \   case Game.State.gamePlaying:\n            break;\n\n        case Game.State.gameEnding:\n\
    \            GameEnding();\n            EndGame();\n            break;\n\n   \
    \     case Game.State.gameEnded:\n            GameEnded();\n            break;\n\
    \    }\n}\n```\n```\n\nBaseGameManager already has the above function in it, but\
    \ it was declared as a virtual function. Having a virtual function like that means\
    \ we can use the override keyword to use a new version of the function – note\
    \ that we override the original function, not swap it out, or destroy the original.\
    \ Any calls to UpdateTargetState() will just be rerouted but, if we need to, we\
    \ can always call the original function too – it still exists – some times in\
    \ this book, we will call the original function as well as the overridden version,\
    \ but not this time. Above, we simply override the original function and use that.\n\
    \nMost of what we do in each state above is to call other functions to do the\
    \ actual work. For example, in the Game.State.loaded case statement, it just calls\
    \ out to Loaded(). I try as much as possible to keep code out of the state machine\
    \ functions to make debugging easier. Calling out to separate functions is a good\
    \ way to avoid your game state code from getting out of hand – having code in\
    \ each state can soon get untruly and harder to debug, so it really is best if\
    \ you try to keep blocks of code in their own functions, instead.\n\nThere are\
    \ a couple of calls to functions that we do not have in this script, such as GameStarting()\
    \ and GameStarted(). These are inherited functions and their code can be found\
    \ in BaseGameManager.cs. The reason we call out to those is"
