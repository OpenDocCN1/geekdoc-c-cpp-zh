    move_along_waypoint_path:\n    MoveAlongWaypointPath();\n    break;\ncase AIState.paused_no_target:\n\
    \    break;\ndefault:\n    // idle (do nothing)\n    break;\n}\n```\n\nAbove,\
    \ we go through all the AIStates we want the bot to react to and call functions\
    \ to deal with each one. We only use the states chasing_target, move_looking_for_target,\
    \ stopped_turning_right, stopped_turning_left and backing_up_looking_for_target.\n\
    \nWhen we have a target, the state is chasing_target unless an obstacle is found\
    \ - if there is an obstacle, we change to either stopped_turning_left, stopped_turning_right\
    \ or backing_up_looking_for_target to avoid it. Otherwise, chasing_target aims\
    \ for the target and moves forward constantly.\n\nIf we are in any of the turning\
    \ or backing up states, we remain in those until the ObstacleFinderResult – populated\
    \ by a call to IsObstacleAhead() – reports that the path forward is clear. When\
    \ there are no obstacles in the backing_up_looking_for_target state, we choose\
    \ a random direction to turn in, to reduce the risk of getting stuck whenever\
    \ the path directly in front is blocked.\n\nNext, the functions themselves:\n\n\
    ```\npublic virtual void DoMovement()\n{\n    // move forward\n    _TR.Translate(0,\
    \ 0, vert * moveSpeed * Time.deltaTime);\n    _TR.Rotate(0, horz * modelRotateSpeed\
    \ * Time.deltaTime, 0);\n}\n```\n\nAbove, the DoMovement() function uses Transform.Translate\
    \ to move the bot around and Transform.Rotate to handle turning. We take the vert\
    \ value and multiply it by our moveSpeed and Time.deltaTime. Transform.Rotate()\
    \ takes three parameters for x, y, and z. We only need to rotate the y axis to\
    \ turn our bot, so our rotation goes in the second parameter. The actual rotation\
    \ amount comes from the variable horz, holding our horizontal input value, which\
    \ is multiplied by"
