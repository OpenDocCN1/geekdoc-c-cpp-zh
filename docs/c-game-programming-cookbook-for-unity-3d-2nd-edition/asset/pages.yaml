- pgno: 124
  md: "moveSpeed was used earlier in the function, but it only gets calculated here\
    \ because it relies on targetSpeed and curSmooth to have been worked out. moveSpeed\
    \ is the result of an interpolation (using Mathf.Lerp) between its current value\
    \ and the variable targetSpeed over an amount set by curSmooth.\n\nWhen moveSpeed\
    \ drops below the threshold set by walkSpeed (i.e. when the player releases the\
    \ move input to slow movement down) walkTimeStart gets reset to Time.time to allow\
    \ the walk to start again the next time the player moves.\n\nThe final part of\
    \ the UpdateDirectionalMovement() function deals with move direction:\n\n```\n\
    // Calculate actual motion\nVector3 movement = moveDirection * moveSpeed;\nmovement\
    \ *= Time.deltaTime;\n\n// Move the controller\ncollisionFlags = _charController.Move(movement);\n\
    ```\n\nThe variable movement takes moveDirection and multiplies it by moveSpeed,\
    \ then on the next line the result is multiplied by Time.deltaTime to provide\
    \ a time-based movement vector with magnitude suitable for passing into the character\
    \ controller. When the controller is told to Move (with the movement vector passed\
    \ in as a parameter) it will return a bitmask called CollisionFlags. When a collision\
    \ occurs with the character controller, the collisionFlags variable may be used\
    \ to tell where the collision happened; the collisionFlags mask represents None,\
    \ Sides, Above or Below. Although the collision data is not used in this version\
    \ of BaseTopDown.cs, it is implemented for future functionality.\n\n```\n// Set\
    \ rotation to the move direction\n_TR.rotation = Quaternion.LookRotation(moveDirection);\n\
    }\n```\n\nIn the last line of the function above, Quaternion.LookRotation creates\
    \ a rotation towards moveDirection and sets _TR.rotation to it – making the player\
    \ face in the correct direction for the movement.\n\n```\nvoid UpdateRotationMovement\
    \ ()\n{\n    _TR.Rotate(0, horz * rotateSpeed * Time.deltaTime, 0);\n}\n```\n\n\
    The second type of movement for this class is rotational. UpdateRotationalMovement()\
    \ uses a combination of Transform.Rotate and the character controller's SimpleMove\
    \ function to provide a control system that rotates the player on its y-axis and\
    \ moves along its z-axis (in the case of the humanoid, this is forward and backward\
    \ walking or running).\n\nFor horizontal input, the variable horz is multiplied\
    \ by the variable rotateSpeed and multiplied by Time.deltaTime to be used as the\
    \ rotation for the player's rotation around its y axis. Vertical input (stored\
    \ in vert) is dealt with next, as vert multiplied by moveSpeed makes up the speed\
    \ to traverse the player's z-axis at.\n\nNote that moveSpeed is calculated further\
    \ down in the function, so don't worry about that right away – just keep in mind\
    \ that moveSpeed is the desired speed of movement:\n\n```\ncurSpeed = moveSpeed\
    \ * vert;\n```\n\nCharacterController.SimpleMove moves a character controller;\
    \ considering the velocity set by the vector passed into it. In this line, the\
    \ vector provided to SimpleMove is the player's forward vector multiplied by curSpeed:"
