- pgno: 163
  md: '# 9 Recipe

    Sound and Audio


    In this chapter, we look at AudioMixers, build a script to act as a basic sound
    manager (BaseSoundManager) and discuss adding audio to the weapons system of the
    framework.


    # 9.1 AudioMixers and Mixing Audio in Unity


    Audio balancing is a huge part of making your game sound professional. It can
    be difficult to get the volumes of your sounds nicely balanced, so that you can
    hear everything important underneath the music or so that a laser doesn''t sound
    louder than an explosion and so forth. Unity provides a great toolkit for balancing
    audio along with some effects to help get the kind of audioscapes your work needs.


    Unity''s AudioMixers allow you to organize sounds into groups and then manage
    those groups rather than dealing with individual sounds. For example, you might
    have a group for music, one for general sound effects and perhaps a third group
    for ambient background audio. Unity gives you a basic mixing desk where you can
    adjust the volumes of each group live, during gameplay, to balance them correctly.
    Another advantage of using an Audio Mixer is that you can use effects.


    When you make an AudioMixer for your project, you can use the Audio Mixer window
    (Window>Audio>Audio Mixer) to see what is happening and adjust sliders (Figure
    9.1).


    # 9.1.1 Mixing Audio


    To access the Audio Mixer in Unity, use the menu Window/Audio/Audio Mixer. The
    Mixer shows a list of mixers, snapshots, groups, and views down the left side.
    The main part of the window will show sliders for groups within the currently
    selected Mixer.'
  merge: -1
  img_proc: true
