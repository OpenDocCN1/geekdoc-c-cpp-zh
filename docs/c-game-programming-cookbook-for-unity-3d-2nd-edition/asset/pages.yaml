    \ out correspondingGroundHit );\nif ( Mathf.Abs( correspondingGroundHit.sidewaysSlip\
    \ ) > slipAmountForTireSmoke )\n{\n```\n\nThe first task above is to fill our\
    \ GroundHit typed variable correspondingGroundHit with information from our wheel's\
    \ WheelCollider. You do this by calling GetGroundHit on the WheelCollider and\
    \ passing in a WheelHit object for it to populate on the way out.\n\nNow correspondingGroundHit\
    \ has data in it, in the next line we access that sidewaysSlip value. To always\
    \ ensure we get a positive number back from it, we use Mathf.Abs and compare that\
    \ value to the float variable slipAmountForTireSmoke.\n\n```\nif ( slipPrefab\
    \ ) {\nSpawn( slipPrefab, correspondingGroundHit.point,\nQuaternion.identity );\n\
    }\n```\n\nIf the condition above is met and sidewaysSlip is greater that slipAmountForTireSmoke,\
    \ the line above instantiates a slipPrefab object into the Scene. It is assumed\
    \ that slipPrefab contains a particle effect for tire smoke. The new prefab will\
    \ be spawned at the point where the wheel meets the ground surface.\n\nNote that\
    \ the slipPrefab will be instantiated every step (every update) that the sidewaysSlip\
    \ value is above the value of slipAmountForTireSmoke. If your tire smoke particle\
