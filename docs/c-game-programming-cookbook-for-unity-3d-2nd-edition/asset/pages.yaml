  md: "Rigidbody: This may not always be an ideal solution and can present challenges\
    \ when trying to control the turning behavior of objects floating in space or\
    \ perhaps even character controllers. To help with controlling sideways slip,\
    \ this simple PretendFriction.cs script can help.\n\n```\n```csharp\nusing UnityEngine;\n\
    namespace GPC\n{\n    [AddComponentMenu(\"CSharpBookCode/Utility/PretendFriction\"\
    )]\n    public class PretendFriction : MonoBehaviour\n    {\n        private Rigidbody\
    \ _RB;\n        private Transform _TR;\n        private float myMass;\n      \
    \  private float slideSpeed;\n        private Vector3 velo;\n        private Vector3\
    \ flatVelo;\n        private Vector3 myRight;\n        private Vector3 TEMPVec3;\n\
    \n        public float theGrip = 100f;\n    }\n}\n```\n```\n\nThe script derives\
    \ from MonoBehaviour, to tap into the Start() and FixedUpdate() system calls.\
    \ Above, note that you can change the value of the variable theGrip to alter how\
    \ much this script will control sliding.\n\n```\n```csharp\nvoid Start()\n{\n\
    \    // cache some references to our RigidBody, mass and transform\n    _RB =\
    \ GetComponent<Rigidbody>();\n    myMass = _RB.mass;\n    _TR = transform;\n}\n\
    ```\n```\n\nThe Start() function caches the RigidBody, amount of mass on the RigidBody\
    \ and the Transform.\n\n```\n```csharp\nvoid FixedUpdate()\n{\n    // grab the\
    \ values we need to calculate grip\n    myRight = _TR.right;\n\n    // calculate\
    \ flat velocity\n    velo = _RB.velocity;\n    flatVelo.x = velo.x;\n    flatVelo.y\
    \ = 0;\n    flatVelo.z = velo.z;\n\n    // calculate how much we are sliding\n\
    \    slideSpeed = Vector3.Dot(myRight, flatVelo);\n\n    // build a new vector\
    \ to compensate for the sliding\n    TEMPVec3 = myRight * (-slideSpeed * myMass\
    \ * theGrip);\n\n    // apply the correctional force to the RigidBody\n    _RB.AddForce(TEMPVec3\
    \ * Time.deltaTime);\n}\n```\n```"
  merge: -1
