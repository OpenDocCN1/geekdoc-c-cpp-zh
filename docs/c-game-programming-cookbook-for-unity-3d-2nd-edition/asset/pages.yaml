    # 9.1.2 Exposing Mixer Properties to Modify Them with Scripts


    If you want to change properties of an AudioMixer, such as its audio levels, you
    need to expose them for them to be accessible via scripts. To do this, open the
    AudioMixer via the menu Window/Audio/Audio Mixer. Choose the Mixer you want to
    edit on the left, followed by the group you want to expose properties of. In the
    Inspector, right click on the name of the field you want to expose. For example,
    in Figure 9.2, we chose the Volume property under Attenuation of the Sound Effects
    group. A menu should appear, with the top option being to expose the property
    to script. Choose this option from the menu. The property will now


    ![](img/e4b578cd512539e7261e070d87b6550a_164_1.png)


    Figure 9.2 The Inspector shows properties of the currently selected Audio Mixer.
    You can click on a field to expose it to code.'
