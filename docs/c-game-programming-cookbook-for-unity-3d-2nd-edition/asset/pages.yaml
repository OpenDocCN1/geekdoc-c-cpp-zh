- pgno: 298
  md: "# ## 15.4 Level Scenes\n\nLevel Scenes contain spawners for the enemies and\
    \ any environment for that level.\n\n# ### 15.4.1 Spawning Enemies\n\nThe Spawner\
    \ class derives from BaseTimedSpawner, which is a class used for automatically\
    \ spawning another prefab and deleting itself once the prefab has been added to\
    \ the Scene. The idea is that you add Spawner (or a derivative of it) as a Component\
    \ to a cube primitive object in your Scene. The cube acts as a visual guide, just\
    \ so you can easily gauge where your prefab will be spawning. At runtime, the\
    \ cube's Renderer is disabled by the script, making it invisible, before the prefab\
    \ is spawned and the original spawner GameObject destroyed.\n\nSpawner also allows\
    \ you to set a randomized delay time so that spawning may be staggered to avoid\
    \ everything spawning in at the exact same time. Spawner.cs was covered in Chapter\
    \ 5, Section 5.8.1, in this book but in this chapter, we will look at the derived\
    \ version of it used specifically for this game. That is, the Spawner class.\n\
    \nBlasterTimedSpawner gets its behavior from BaseTimedSpawner. Essentially, the\
    \ function of this script to register an enemy whenever one is spawned by the\
    \ regular BaseTimedSpawner code.\n\n```\n```csharp\nusing GPC;\npublic class BlasterTimedSpawner\
    \ : BaseTimedSpawner\n{\n    public override void Start()\n    {\n        // do\
    \ everything the base script does\n        base.Start();\n        // tell gamemanager\
    \ about this enemy\n        RegisterEnemy();\n    }\n\n    void RegisterEnemy()\n\
    \    {\n        // make sure we have a game manager before doing\nanything here\n\
    \        if (BlasterGameManager.instance == null)\n        {\n            Invoke(\"\
    RegisterEnemy\", 0.1f);\n            return;\n        }\n\n        // at the start\
    \ of the game, we need to register\nthis spawner as an enemy before it has spawned\n\
    \        // so that we have an initial enemy count right away\n        BlasterGameManager.instance.RegisterEnemy();\n\
    \    }\n}\n```\n```\n\nAbove, we override the Start() function of BaseTimedSpawner\
    \ so that we can call RegisterEnemy() at the start of the game. We still need\
    \ BaseTimedSpawner to do its set up, so base.Start() is called too.\n\nThe RegisterEnemy()\
    \ function starts by checking that the BlasterGameManager instance has been created\
    \ – this is to prevent our script from trying to access the Game Manager before\
    \ it has been added to the Scene and initialized properly. Since the level Scene\
    \ and core Scene is loaded separately and merged,"
