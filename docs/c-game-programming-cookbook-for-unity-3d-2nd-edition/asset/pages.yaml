  md: "at the start of each call to GetUniqueID() further in the class, we start currentID\
    \ at -1 so that the first ID issued to a player will be 0.\n\n```\npublic void\
    \ InitNewRace( int howManyLaps )\n{\n```\n\nWhen a race is started, the Game Manager\
    \ (RaceGameManager) calls this InitNewRace() function to get GlobalRaceManager\
    \ ready for the race. The parameter for this function is an integer for how many\
    \ laps the race should go on for.\n\n```\n// initialise our hashtables\nracePositions=\
    \ new Hashtable();\nraceLaps= new Hashtable();\nraceFinished= new Hashtable();\n\
    raceControllers= new Hashtable();\n```\n\nAbove, several hashtables are used to\
    \ store and access the data this script needs to use. Hashtables have a key and\
    \ a value, which makes them ideal for storing player related info or objects.\
    \ Instead of using an index number, as you do with an array, you can provide a\
    \ key and get access to its associated value. In this case, each player's unique\
    \ ID is used to store data about the state of each player, and we can use a player\
    \ ID to quickly get data back out again.\n\nIn this class, we use hashtables for:\n\
    \nRace positions – Each player's race position is stored as an integer.\n\nRace\
    \ laps – Each player's current lap number is stored as an integer.\n\nRace finished\
    \ – When a player crosses the finish line after completing the set number of laps\
    \ (held in the variable totalLaps), an entry into the raceFinished Hashtable will\
    \ be set to true. Otherwise, it will be false.\n\nRace controllers – Here, we\
    \ store references to a RaceController Component attached to each player.\n\n\
    All the above hashtables use the player ID as a key.\n\n```\nraceAllDone = false;\n\
    \ totalLaps= howManyLaps;\n```\n\nThe end of the InitNewRace() function sets a\
    \ Boolean variable raceAllDone to false – which may come as no surprise tells\
    \ the class when the race has finished – and sets our totalLaps integer variable\
    \ to the amount of laps passed in as a parameter to this function via howManyLaps.\n\
    \n```\npublic int GetUniqueID(RaceController theRaceController)\n{\n```\n\nGetUniqueID()\
    \ does more than provide a unique ID for each player of the game. When the RaceController\
    \ script (RaceController.cs – discussed earlier in this chapter) calls in, it\
    \ passes in a reference to itself (its instance) as a parameter. This function\
    \ then adds a reference to the new player's RaceController script Component to\
    \ the raceControllers Hashtable, using the player's unique ID as a key.\n\n```\n\
    currentID++;\n```"
