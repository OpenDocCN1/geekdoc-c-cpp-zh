- pgno: 104
  md: "distanceFromCameraToSpawnAt as the radius so that the Gizmo exactly represents\
    \ our spawn distance. In the second instance, when distanceBasedSpawnStart is\
    \ false, we pass an arbitrary value as the radius instead.\n\n```\n```csharp\n\
    public void Update()\n{\n    float aDist = Vector3.Distance(_TR.position,\n_cameraTransform.position);\n\
    \    if (distanceBasedSpawnStart && !spawning &&\naDist < distanceFromCameraToSpawnAt)\n\
    \    {\n        StartSpawn();\n        spawning = true;\n    }\n}\n```\n```\n\n\
    The Update() function checks the distance between our Transform and the camera,\
    \ by using Vector3.Distance(). This is not the most optimized thing to call every\
    \ single frame, so be aware of this if you use it in a complicated project that\
    \ may be impacted by this. An alternative might be to only check distance every\
    \ few frames, instead, or perhaps on a timer.\n\nOnce we have the distance value\
    \ in aDist we check that distanceBasedSpawnStart is true (indicating that we want\
    \ to do distance-based spawning) and that we are not already spawning -- spawning\
    \ is false -- then compare aDist to the distanceFromCameraToSpawnAt value. If\
    \ these conditions are met, we can call StartSpawn() to spawn the prefab(s) and\
    \ we set spawning to true to avoid any duplicate calls to spawn now that the process\
    \ is in motion.\n\n```\n```csharp\nvoid StartSpawn()\n{\n    StartWave(totalAmountToSpawn,\n\
    timeBetweenSpawns);\n}\n```\n```\n\nTo get the spawning process in motion, we\
    \ call StartSpawn() above that will then call another function StartWave(). You\
    \ will see below what StartWave() does, but note for now just that you pass in\
    \ how many prefabs you want to spawn followed by the amount of time the system\
    \ should wait before spawning another one.\n\nSpawning is a process in this function,\
    \ rather than a single action. StartWave() will continue to spawn as many objects\
    \ as you tell it to, ultimately disabling its own GameObject once all prefabs\
    \ have been added to the Scene.\n\n```\n```csharp\npublic void StartWave(int HowMany,\
    \ float\ntimeBetweenSpawns)\n{\n    spawnCounter = 0;\n    totalAmountToSpawn\
    \ = HowMany;\n\n    // reset\n    currentObjectNum = 0;\n    CancelInvoke(\"doSpawn\"\
    );\n}\n```\n```\n\nAs StartWave() is the beginning of our spawn wave, we need\
    \ to do a little set up first. spawnCounter is a variable we will use to keep\
    \ tabs on how many prefabs this Spawner has added to the Scene. The value of spawnCounter\
    \ will be compared to totalAmountToSpawn (set by the code above to the first parameter\
    \ passed into this function, howMany) to know when to stop spawning.\n\ncurrentObjectNum\
    \ is an index number we can use to refer to the array holding all the prefabs.\
    \ When there are more than one prefabs in that array (set in the"
  merge: -1
  img_proc: true
- pgno: 105
  md: "Inspector) then currentObjectNum will be increased every time a new prefab\
    \ is spawned so that we get the next item from the array next time.\n\nIf there\
    \ are more prefabs to spawn, a function named doSpawn() will be called repeatedly\
    \ – until all prefabs are made. We use Unity's Invoke() function to schedule a\
    \ call to doSpawn(), so whenever we run StartWave we make sure there are no outstanding\
    \ Invoke calls to doSpawn() by using the CancelInvoke() function. If there are\
    \ any outstanding, CancelInvoke() will flush all of them out at once.\n\n```\n\
    ```\n// the option is there to spawn at random\ntimes, or at fixed intervals...\n\
    if (shouldRandomizeSpawnTime)\n{\n    // do a randomly timed invoke call,\nbased\
    \ on the times set up in the inspector\n    Invoke(\"doSpawn\", Random.Range\n\
    (minimumSpawnTimeGap, timeBetweenSpawns));\n}\nelse\n{\n    // do a regularly\
    \ scheduled invoke\ncall based on times set in the inspector\n    InvokeRepeating(\"\
    doSpawn\",\ntimeBetweenSpawns, timeBetweenSpawns);\n}\n```\n```\n\nAbove, we look\
    \ to see if shouldRandomizeSpawnTime is true. If it is, we use a random amount\
    \ of time between minimumSpawnTimeGap and the value of timeBetweenSpawns (which\
    \ was passed into this function as a parameter). Having a randomized spawn time\
    \ can just make a game more interesting than having enemies spawning at fixed\
    \ times all the time.\n\nIf shouldRandomizeSpawnTime is false, instead of using\
    \ standard Invoke() to schedule the call to doSpawn(), the code here uses InvokeRepeating().\
    \ This will repeat call doSpawn() indefinitely – it takes two parameters, the\
    \ first is the time before we do the first spawn, and the second parameter is\
    \ the time between that and every other call after. We just use the value in timeBetweenSpawns\
    \ for timing, passing its value in to InvokeRepeating() as both parameters.\n\n\
    ```\n```\nvoid doSpawn()\n{\n    if (spawnCounter >= totalAmountToSpawn)\n   \
    \ {\n        if (shouldRepeatWaves)\n        {\n            spawnCounter = 0;\n\
    \        }\n        else\n        {\n            CancelInvoke(\"doSpawn\");\n\
    \            this.enabled = false;\n            return;\n        }\n    }\n}\n\
    ```\n```\n\nAs mentioned above earlier in the section, doSpawn() is called repeatedly\
    \ until all of the prefabs we want to spawn have been added to the Scene. To accomplish\
    \ that, spawnCounter counts up, and we compare it to totalAmountToSpawn to know\
    \ how to proceed."
