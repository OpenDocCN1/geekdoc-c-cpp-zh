    float curSmooth= speedSmoothing * Time.deltaTime;\n```\n\nThe next line of the\
    \ script caps the targetSpeed at 1. Taking the targetDirection vector from earlier,\
    \ targetSpeed takes a maximum value of 1 or, if it is less than 1, the value held\
    \ by targetDirection.magnitude:\n\n```\n// Choose target speed\n// We want to\
    \ support analog input but make sure\nyou can't walk faster diagonally than just\
