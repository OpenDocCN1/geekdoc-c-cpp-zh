  md: "```\n// if the timer is running, we add the time elapsed to the current time\
    \ (advancing the timer)\nelapsed to the current time (advancing the timer)\nif\
    \ (isTimerRunning)\n{\n    currentTime += timeElapsed *\ntimeScaleFactor;\n}\n\
    // store the current time so that we can use\nit on the next update\n    lastTime\
    \ = Time.realtimeSinceStartup;\n```\n\nAbove, the function works like this:\n\n\
    +   1. We calculate timeElapsed by taking the current time (Time.realtimeSinceStartup)\
    \ and subtracting the value of lastTime from it – lastTime is set to the value\
    \ of Time.realtimeSinceStartup at the end of this function, which means lastTime\
    \ will keep its value until the next time UpdateTimer runs. As it keeps its value,\
    \ it acts as a timestamp for the last time Unity reached the end of the function.\
    \ By subtracting this timestamp from the current time, we know exactly how much\
    \ time has gone since UpdateTimer() last ran.\n+   2. If the timer is running\
    \ (i.e. The Boolean variable isTimerRunning is set to true) then we add timeElapsed\
    \ to our currentTime variable. currentTime is the total amount of time that has\
    \ passed since the timer started. When we add timeElapsed to currentTime, we also\
    \ multiply it by a timeScaleFactor. This allows you to scale the time system,\
    \ which is useful for when your game updates are set to run at a different time\
    \ scale with Time.timeScale.\n\nrealtimeSinceStartup is used for good reason.\
    \ By using realtimeSinceStartup, the game can do whatever it likes to the Time.timeScale\
    \ value (speeding up or slowing down Unity physics updates) and realtimeSinceStartup\
    \ will still provide unscaled time values. If Time.time were used, it would be\
    \ affected by the timeScale and would fail to provide real time values if the\
    \ physics timing (Time.timeScale) were set to anything other than 1.\n\n> Note:\
    \ One commonly used method of pausing Unity games is to set Time.timeScale to\
    \ 0, which would stop a timer that didn't use Time.realtimeSinceStartup. If you\
    \ use Time.timeScale to pause the game, you will also need to be used to start\
    \ and stop the timer as it will be unaffected by Time.timeScale.\n\nNext, the\
    \ StartTimer() function is used to start the timer:\n\n```\npublic void StartTimer\
    \ ()\n{\n    // set up initial variables to start the timer\n    isTimerRunning=true;\n\
    \    lastTime=Time.realtimeSinceStartup;\n}\n```\n\nAbove, the Boolean variable\
    \ isTimerRunning is set to true when StartTimer() is called. isTimerRunning is\
    \ used to say whether or not to update currentTime in the UpdateTimer() function\
    \ earlier in the script. lastTime also needs to be"
