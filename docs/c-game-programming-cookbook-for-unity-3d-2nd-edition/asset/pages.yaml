  md: "three axis instead of two. So, the first part of this code takes the positions\
    \ of player and waypoint and copies them into variables. The copies have the y\
    \ positions set to zero, removing the y axis from the equation.\n\n```\n```csharp\n\
    // check distance from this car to the waypoint\ncurrentWaypointDist = Vector3.Distance(nodePosition,\n\
    myPosition);\n\nif (currentWaypointDist < waypointDistance) {\n    // we are close\
    \ to the current node, so let's\n    move on to the next one!\n    currentWaypointNum++;\n\
    }\n```\n```\n\nAbove, the built in Unity function Vector3.Distance() takes two\
    \ Vector3 positions and returns the distance between them. We put our distance\
