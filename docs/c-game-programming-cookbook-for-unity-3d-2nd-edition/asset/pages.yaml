- pgno: 155
  md: '# # 8 Waypoints Manager


    # ## 8.1 Waypoint System


    Waypoints can be used for more than just guiding AI objects or players around
    the game world. We can use them to guide a camera for cut scenes or a guided camera
    system, track who is winning a race, use them to make sure that the player is
    going in the right direction along a path, to reposition players in a safe location,
    for counting laps during a race and quite probably a whole other number of uses
    that don''t immediately spring to mind. Waypoints are really useful for game developers.


    For an example of this script in action, check out the racing game example in
    Chapter 14.


    Our waypoints manager needs to be flexible enough to provide the functionality
    for all of these uses and then some, without going against the componentized methodology
    we are employing for this book. The functions it should provide are:


    +   1. Produce a visual representation of the path we want our AI cars to take,
    to make manipulation of our waypoints in the editor a little easier

    +   2. Provide an interface that can allow other scripts to search for the nearest
    waypoint to a given point in 3d space

    +   3. Provide an interface that allows other scripts to get waypoint information
    from an index number: as our cars go around the track, they have a waypoint counter
    which could potentially be used with this function to establish where the current,
    next, or previous waypoints are.'
  merge: -1
  img_proc: true
- pgno: 156
  md: "4. Provide an interface that allows for other scripts to find out the total\
    \ number of waypoints: as our cars hold their own waypoint counter numbers, they\
    \ need some way to ensure that the counters stay within the boundaries of how\
    \ many waypoints there actually are.\n\nIn the racing game example in this book,\
    \ we use waypoints for the AI and for the main player;\n\n+   1. To check that\
    \ the main player is heading in the right direction: the car controller code will\
    \ track the player's position on the track (based on which waypoint has been passed)\
    \ and check its forward vector to make sure that it is facing the next waypoint\
    \ along the track. If the player's forward vector is not within a certain tolerance\
    \ angle, the game will display a wrong way message and eventually respawn the\
    \ car facing the right way.\n+   2. The respawning system uses waypoints to find\
    \ a 'safe' place along the track to respawn the player as well as using its rotation\
    \ to point the respawned car in the right direction along the track.\n+   3. To\
    \ find out how far the vehicle has traveled around the track, which is used to\
    \ compare to the other players progress amounts to calculate race positions\n\n\
    The waypoints controller script:\n\n```\nusing UnityEngine;\nusing System.Collections.Generic;\n\
    namespace GPC\n{\n    [AddComponentMenu(\"CSharpBookCode/Utility/Waypoints Controller\"\
    )]\n    public class WaypointsController : MonoBehaviour\n    {\n        [ExecuteInEditMode]\n\
    \        private List<Transform> _transforms;\n        private Vector3 firstPoint;\
    \ // store our first waypoint so we can loop the path\n        private float distance;\n\
    \        private int totalTransforms;\n        private Vector3 diff;\n       \
    \ private float curDistance;\n        private Transform closest;\n        private\
    \ Vector3 currentPos;\n        private Vector3 lastPos;\n        private Transform\
    \ _pointT;\n\n        public bool closed = true;\n        public bool shouldReverse;\n\
    \n        void Start()\n        {\n            GetTransforms();\n        }\n \
    \   }\n```\n\nAfter the variable and class declarations, above, the Start() function\
    \ calls a function called GetTransforms(). We will look at that in detail further\
    \ down in the function."
