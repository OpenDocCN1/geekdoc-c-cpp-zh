  md: "Above, helper functions above provide access to the horizontal and vertical\
    \ input variables.\n\n# 10.3 Enemy Stats\n\nThe BaseEnemyStatsController class\
    \ can be used to add stats to an enemy in a similar way to how we deal with players.\
    \ The way we use it in this book, we have it derive from BaseAIController so that\
    \ it can be layered – the Blaster game example from Chapter 15 has a blaster enemy\
    \ class that derives from BaseEnemyStatsController. This way, we get all of the\
    \ AI and stats merged together so we do not have to have any references to other\
    \ script Components to deal with things like enemy health and so on.\n\nIf you\
    \ wanted to use this script as a standalone in your own game, you can just change\
    \ the class declaration to derive from MonoBehaviour rather than BaseAIController.\
    \ You also need to remove the base.Init() from the Init() function and remove\
    \ override from the Init() function declaration. Do these things and this class\
    \ will work independently of the AI system and/or framework.\n\n```\n```csharp\n\
    using UnityEngine;\n\nnamespace GPC\n{\n    [AddComponentMenu(\"CSharpBookCode/Base/Enemy\
    \ Controller\")]\n    public class BaseEnemyStatsController : BaseAIController\n\
    \    {\n        [Header(\"Enemy stats\")]\n        public int myID;\n        private\
    \ static int enemyUniqueID;\n\n        public int defaultHealthAmount = 1;\n\n\
    \        public int enemyHealth;\n        public int enemyScore;\n        public\
    \ string enemyName;\n\n        public override void Init()\n        {\n      \
    \      base.Init();\n            myID = enemyUniqueID;\n            enemyUniqueID++;\n\
    \n            enemyScore = 0;\n            enemyHealth = defaultHealthAmount;\n\
    \        }\n\n        public virtual void AddScore(int anAmount)\n        {\n\
    \            enemyScore += anAmount;\n        }\n\n        public virtual void\
    \ AddHealth(int anAmount)\n        {\n            enemyHealth += anAmount;\n \
    \       }\n\n        public virtual void LoseScore(int anAmount)\n        {\n\
    \            enemyScore -= anAmount;\n        }\n    }\n}\n```\n```"
