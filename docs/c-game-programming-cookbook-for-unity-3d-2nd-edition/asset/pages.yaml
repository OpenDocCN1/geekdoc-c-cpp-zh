  md: 'In the Project panel, find the Games/RunMan/Prefabs folder. This folder is
    where you should find the Prefab for the platform, we made back in Section 2.5.
    Click and drag the RunMan_Platform Prefab out of the Project window and drop it
    into the Platform Prefab field of the GameManager in the Inspector. This tells
    the Game Manager which Prefab to spawn when we tell it to spawn a new platform.


    We now need to provide the Game Manager with a reference to the player. In the
    Hierarchy, find the RunMan GameObject then click and drag it into the Run Man
    Character field of the GameManager in the Inspector.


    Make sure that the values in your Game Manager match up with those in Figure 2.14.


    # ## 2.8 The Demise of RunMan


    Now that we have platforms moving and a character ready to jump over them, we
    need to add a method to detect whenever the player misses a platform and falls
    off screen. To accomplish this, we use a Collider set to be used as a trigger
    (so that it does not resolve a collision, it only reports it) scaled across the
    entire width of the screen and positioned just below the bottom of the play area.
    Whenever the player hits the trigger, it will know that it has fallen outside
    of the play area and end the game.


    When adding a trigger, I prefer to be able to see the object so that I can scale
    and place it easily. If this was a 3D game, I would just add a cube to the Scene
    and arrange it as necessary before disabling the renderer to hide it. Sadly, Unity
    does not have any 2D primitives (cubes, spheres and so on) but we can use a 3D
    primitive and add a 2D Collider to it. Bit of an odd mix, I know, but there it
    is.


    Find an empty space in the Hierarchy and right click. Choose the 3D Object sub-menu
    and, from there, choose the Cube.


    Next, click the Scale Transform button on the Toolbar (top left of the editor
    window) or press R on the keyboard to shortcut to scale mode. In the Scene panel,
    the Gizmo should now show some chunky squares instead of arrow heads. Click the
    red square and drag it to the right, to scale the cube out along its X axis. Stretch
    it so that it is about twice as wide as the Game panel area.


    Now move the cube down, below the play area so that it is out of view of the Game
    panel. To switch back into move mode, click on the Move Transform button in the
    Toolbar or press W on the keyboard to shortcut. Grab the green arrow and move
    the cube down. It should look something like the one in Figure 2.15.


    With the Cube GameObject selected in the Hierarchy, check out the Inspector. The
    Cube already has a Collider attached to it, but it is the wrong type. The Box
    Collider will only work with 3D physics, so we need to remove it and replace it
    with the 2D equivalent.


    Right click on the Box Collider Component in the Inspector. Click Remove Component.


    Click the Add Component button and start typing boxco to jump to the available
    Box Colliders. Choose the Box Collider 2D Component from the list (Figure 2.16).
    Once the new Component appears in the Inspector, check the box IsTrigger by clicking
    on it.


    If you hit Play now and make RunMan fall off the bottom of the screen, you should
    now hear the sound effect that signals RunMan''s demise. In the next section,
    we will be adding a game over screen that will go here as well as a main menu
    to return to after the game is over. Oh, and scoring. Phew! Sounds like a busy
    section.'
