    Figure 15.1 The Blaster Game Example.


    ![](img/e4b578cd512539e7261e070d87b6550a_282_1.png)


    Figure 15.2 The game structure for the Blaster game.


    # # 15.1 Ingredients


    The Blaster game uses the following ingredients:


    +   1. Main menu – The menu code is based on MenuWithProfiles.cs from Chapter
    11, Section 11.1.2. We are using the same template menu as we did in Chapter 2
    for the RunMan game menu.

    +   2. Scene loader – MultiLevelLoader.cs, derived from LevelLoader.cs (covered
    in Chapter 13, Section 13.2) is used for Scene loading. The LevelVars class is
    used to hold information about which level to load.'
