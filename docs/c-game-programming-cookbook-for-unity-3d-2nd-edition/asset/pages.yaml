  md: '![](img/e4b578cd512539e7261e070d87b6550a_239_0.png)


    Figure 14.3 The player structure for the racing game example.


    # 14.1 Ingredients


    The racing game example uses these ingredients:


    +   1. Main menu – The menu code is based on MenuWithProfiles.cs from Chapter
    11.

    +   2. Level select – The level select relies on a Scene loader using LevelVars.cs.

    +   3. Scene loader – MultiLevelLoader.cs, derived from LevelLoader.cs (covered
    in Chapter 13) is used for Scene loading.

    +   4. The Game Manager – RaceGameManager derives from BaseGameManager (from Chapter
    3).

    +   5. Race Management – Each player has a race controller script attached to
    it, which holds information relevant to its race stats (position/waypoints and
    so on). The race manager talks to all the player''s race controllers and tracks
    global information on the state of the race, such as player race positions and
    whether the race is still in progress.'
