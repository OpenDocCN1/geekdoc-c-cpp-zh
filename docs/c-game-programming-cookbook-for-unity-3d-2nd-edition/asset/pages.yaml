  md: "```\n[System.NonSerialized]\npublic float steer = 0f;\n[System.NonSerialized]\n\
    public float motor = 0f;\n[System.NonSerialized]\npublic float brake = 0f;\n\n\
    [Space]\npublic float wheelToGroundCheckHeight = 0.5f;\n\n[Space]\npublic bool\
    \ fakeBrake;\npublic float fakeBrakeDivider = 0.95f;\n\n[Space]\npublic bool turnHelp;\n\
    public float turnHelpAmount = 10f;\n\npublic bool isGrounded;\n\n[System.NonSerialized]\n\
    public float mySpeed;\n\n[System.NonSerialized]\npublic Vector3 velo;\n\n[Header(\"\
    Audio Settings\")]\npublic AudioSource _engineSoundSource;\npublic float audioPitchOffset\
    \ = 0.5f;\n```\n\nMost of the other variables in here will be covered further\
    \ on in the script, as we break it down, so we skip to the Start() function. Start()\
    \ is called by the engine automatically. It calls the Init() function, which begins\
    \ by caching references to commonly used objects:\n\n```\npublic virtual void\
    \ Start ()\n{\n    Init ();\n}\n```\n\n```\npublic virtual void Init ()\n{\n \
    \   // cache the usual suspects\n    _RB = GetComponent<Rigidbody>();\n    _GO\
    \ = gameObject;\n    _TR = transform;\n}\n```\n\nNext up, we grab a reference\
    \ to the input controller Component attached to this GameObject and then set the\
    \ center of mass of our Rigidbody:\n\n```\n_inputController = GetComponent<BaseInputController>();\n\
    _RB.centerOfMass = new Vector3(0,-0.1f,0);\n```\n\nThe center of mass can be set\
    \ on a rigidbody to change the way it behaves in the physics simulation. The further\
    \ the center of mass is from the center of the rigidbody, the more it will affect\
    \ the physics behavior. Setting the center of mass down at -1 helps make the vehicle\
    \ stable and stops the vehicle from toppling over when going around corners.\n\
    \n```\n// see if we can find an engine sound source, if we need to\nif (_engineSoundSource\
    \ == null)\n{\n```"
