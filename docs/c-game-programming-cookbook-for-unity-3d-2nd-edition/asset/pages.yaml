    \ < _spawners.Length; i++)\n{\n    _spawners[i].SendMessage(\"StartSpawnTimer\"\
    );\n}\n```\n\nOne by one, each spawner has a message sent to it in the loop above,\
    \ which runs the StartSpawnTimer() function in the Spawner class.\n\n```\n// level\
    \ is started now, so we can move on to\n'playing' state\n    SetTargetState(Game.State.gamePlaying);\n\
    }\n```\n\nThe last line of LevelStarted() sets the target game state to Game.State.gamePlaying\
    \ – signifying that the game is afoot.\n\n```\npublic override void LevelEnding()\n\
    {\n    OnLevelEnding.Invoke();\n    // play level complete sound\n    _soundComponent.PlaySoundByIndex(1);\n\
    \    Invoke(\"CallFadeOut\", 4f);\n    Invoke(\"NextLevel\", 6f);\n}\n```\n\n\
    Earlier above, the in EnemyDestroyed() function, we set the target state to Game.State.levelEnding\
