    \ this script is attached to. We also grab the Rigidbody (as this script relies\
    \ on physics to work) and stores the reference in the variable _RB. _inputController\
    \ is populated with a reference to a BaseInputController Component (or a Component\
    \ that derives from BaseInputController) so we can process input from the user.\n\
    \nThe BaseInputController class is used to provide input from the player to move\
    \ the character around and it should be attached as a Component to the same GameObject\
