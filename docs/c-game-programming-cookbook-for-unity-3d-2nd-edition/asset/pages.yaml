  md: "The Start() function is there to see if we are automatically starting the loading\
    \ process. When loadOnSceneStart is true, we call LoadLevel().\n\n```\npublic\
    \ void LoadLevel()\n{\n    LoadLevel(levelSceneToLoad);\n}\n```\n\nThe LoadLevel()\
    \ function comes in two flavors. The first, which takes no parameters, will use\
    \ the string in the variable levelSceneToLoad as the Scene to load, and load it.\
    \ This is provided mostly so that we can automatically initiate a load in the\
    \ Start() function, but you may find other uses for it. The first LoadLevel()\
    \ calls the second LoadLevel() function in our script below, requiring a Scene\
    \ name string as a parameter.\n\n```\nvoid LoadLevel(string levelSceneName)\n\
    {\n    StartCoroutine(LoadAsyncLevels(levelSceneName));\n}\n```\n\nThe second\
    \ LoadLevel above calls StartCoroutine() to start the loading process, starting\
    \ the co-routine named LoadAsyncLevels.\n\n```\nIEnumerator LoadAsyncLevels(string\
    \ whichLevel)\n{\n    Scene loaderScene = SceneManager.GetActiveScene();\n```\n\
    \nAbove, we get to the start of the LoadAsyncLevels() co-routine. Loading is handled\
    \ by a co-routine named LoadAsyncLevels and it takes the Scene name to load as\
    \ a parameter. The name we pass into LoadAsyncLevels will be used to load the\
    \ level, not the core Scene. We assume that the core Scene will remain the same\
    \ throughout the game and so we get its Scene name from the variable coreSceneName\
    \ rather than passing it in each time.\n\nThe first thing we do inside the co-routine\
    \ is to get a reference to the currently active Scene. We do this so that we know\
    \ which Scene to unload once the load process is done.\n\n```\nAsyncOperation\
    \ asyncLoad =\nSceneManager.LoadSceneAsync(whichLevel, LoadSceneMode.Additive);\n\
    ```\n\nStep 1 of our loading process is to use LoadSceneAsync to grab the level\
    \ Scene. We do this with the LoadSceneMode set to additive, meaning the Scene\
    \ will be loaded without encroaching on the currently loaded Scene. Whenever you\
    \ call SceneManager to load a Scene asynchronously, it will return an AsyncOperation\
    \ - an object we can use to check on load progress and can access to see if the\
    \ loading sequence has finished.\n\n```\n// Wait until the asynchronous scene\
    \ fully loads\nwhile (!asyncLoad.isDone)\n{\n    yield return null;\n}\n```\n\n\
    The variable asyncLoad (typed as an AsyncOperation) is used to find out when the\
    \ load sequence has finished. We do this by polling its isDone property in"
