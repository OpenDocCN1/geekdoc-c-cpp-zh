  md: '# 4 Player Structure


    A player can take on any form – humans, aliens, vehicles, and so forth. Designing
    a structure that can deal with all of them is a challenge. The way we need to
    store data, the types of data we need to store, the various types of movement
    code and weapons and so on, can soon become complicated. A basic player using
    the framework in this book would be made up of a GameObject containing Unity-specific
    physics or collision Components, then four additional script Components (as seen
    in Figure 4.1.):


    +   1. The player controller

    +      A controller specific to game requirements – this may have functions to
    deal with game-specific operations like opening doors or holding the player in
    place before the game starts and so on

    +   2. A movement controller

    +      To move the player around (depending on the type of movement required this
    could be anything, such as a vehicle, or a humanoid)

    +   3. An input controller

    +      To provide input to the player controller from the user

    +   4. A user data manager

    +      The data manager is an interface between user data and the player. It takes
    care of the manipulation of player data and how it is stored and retrieved. Score
    and health values would be stored here, and the data manager would also hook up
    with a profile system to provide saving and loading.'
  merge: -1
  img_proc: true
