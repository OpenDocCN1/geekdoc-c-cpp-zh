    \ Quaternion.\nidentity);\n    distanceCounter = Random.Range(-0.5f, 0.25f);\n\
    }\n```\n\nNew platforms are generated by the SpawnPlatform() function. The first\
    \ line of SpawnPlatform() increases runSpeed by 0.02. This means that, over time,\
    \ the game will gradually get faster and faster. It is a very simple way of increasing\
    \ the difficulty over time so that the player should eventually concede.\n\nWhen\
    \ a new platform spawns, we reset the variable distanceCounter ready to measure\
    \ the distance to the next spawn. A quick look to the Update() function you will\
    \ tell you that we check distanceCounter against the variable distanceToSpawnPlatform,\
    \ to decide how far to allow between platforms – but that's further down. Let's\
    \ get back to SpawnPlatform().\n\nThe next line uses the built-in random number\
    \ generator function Random. Range to ask the engine to come up with a number\
    \ between playAreaTopY and playAreaBottomY:\n\n```\nfloat randomY = Random.Range(playAreaTopY,\
    \ playAreaBottomY);\n```\n\nrandomY can now be used as the height to spawn the\
    \ next platform. We add it into a Vector2 on the next line:\n\n```\nVector2 startPos\
    \ = new Vector2(platformStartX, randomY);\n```\n\nNow that we have a Vector2 containing\
    \ a position to spawn the new platform out (consisting of a nice random Y position\
    \ and a start position held in platformStartX that will be off-screen to the right\
    \ of the play area), we can go ahead and spawn the platform on the next line:\n\
    \n```\nInstantiate(_platformPrefab, startPos, Quaternion.identity);\n```\n\nAbove,\
    \ Instantiate takes a reference to a Prefab (_platformPrefab) followed by the\
    \ starting position for the GameObject to be instantiated and finally a rotation\
    \ value in Quaternions. Quaternion.identity is a zero rotation value, a default,\
    \ meaning that the new platform will not be rotated.\n\nThe last line of SpawnPlatform()\
    \ adjusts the distanceCounter variable by a small random amount:\n\n```\ndistanceCounter\
    \ = Random.Range(-0.5f, 0.25f);\n```\n\nThe effect of this is that the next platform\
    \ will have a random amount of space between it because we are changing where\
    \ zero is in the distance counting system.\n\nWe finish this programming section\
    \ with an Update() function. Update() is called every frame. In RunMan_GameManager,\
    \ it is where we keep an eye on the distanceCounter to decide whether it is time\
    \ to spawn a new platform.\n\nAdd this to your script above the final curly bracket:\n\
    \n```\nvoid Update()\n{\n    if (isRunning)\n    {\n        distanceCounter +=\
    \ (runSpeed * Time.deltaTime);\n```"
