- pgno: 17
  md: '# # Prerequisites


    You can get up and running with the required software for the grand total of zero
    dollars. Everything you need can be downloaded free of charge with no catches.
    All you need is:


    +   - Unity Personal or Unity Pro version

    +   - C# programming knowledge.


    This is *not* a book about learning how to program. You will need to know some
    C# and there are several other books out there for that purpose, even if I have
    tried to make the examples as simple as possible!


    # ## What this book doesn’t cover


    This is not a book about learning to program from scratch. We assume that the
    reader has some experience of the C# programming language. Know that I am a self-taught
    programmer and I understand there may be better or alternative ways to do things.
    Techniques and concepts offered in this book are meant to provide foundation and
    ideation, not to be the final word on any subject.'
  merge: -1
  img_proc: true
