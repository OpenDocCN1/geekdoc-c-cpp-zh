    \ should mean SetWayController() has been called and set up successfully.\n\n\
    The AI controller script has the option to automatically destroy itself when the\
    \ last waypoint is reached. When destroyAtEndOfWaypoints is set to true, the GameObject\
    \ is destroyed, and this code drops out of the UpdateWaypoints() script immediately.\n\
    \n```\nif( reachedLastWaypoint && destroyAtEndOfWaypoints )\n{\n    // destroy\
    \ myself()\n    Destroy( gameObject );\n    return;\n}\nelse if( reachedLastWaypoint\
    \ )\n{\n    currentWaypointNum= 0;\n    reachedLastWaypoint= false;\n}\n```\n\n\
    When destroyAtEndOfWaypoints is false, the assumption is that waypoint following\
    \ should go back to the beginning; currentWaypointNum is set to zero, reachedLastWaypoint\
    \ is reset, and the AI is free to start over again.\n\nTo keep this function safe\
    \ (in case it is somehow called before the waypoints have been correctly set up\
    \ in the WaypointsController class) there is a check to make sure that more than\
    \ one waypoint was found. If totalWaypoints is zero, another attempt is made to\
    \ get the total from _waypointsController before it drops out of the UpdateWaypoints()\
    \ function.\n\n```\nif( totalWaypoints==0 )\n{\n    // grab total waypoints\n\
    \    totalWaypoints= _waypointsController.GetTotal();\n    return;\n}\n```\n\n\
    ```\nif( _currentWaypointTransform==null )\n{\n    // grab our transform reference\
    \ from the waypoint controller\n    _currentWaypointTransform= _waypointsController.GetWaypoint(\
    \ currentWaypointNum );\n}\n```\n\nIf no currentWaypointTransform object has been\
    \ set up at this point, _waypointsController is called upon to provide one with\
    \ the index number held in the variable _currentWaypointNum.\n\nCalculating distance\
    \ between two Transforms will consider x, y, and z coordinates. In most cases,\
