    public UnityEvent OnGameUnPause;\npublic UnityEvent OnShowLevelResults;\npublic\
    \ UnityEvent OnShowGameResults;\npublic UnityEvent OnRestartLevel;\npublic UnityEvent\
    \ OnRestartGame;\n```\n\nThe advantage of having UnityEvents is that I can set\
    \ up events in the editor, via the Inspector, to tell other scripts when state\
    \ changes happen. As these are UnityEvents, I can add as many references to other\
    \ Components via the Inspector"
