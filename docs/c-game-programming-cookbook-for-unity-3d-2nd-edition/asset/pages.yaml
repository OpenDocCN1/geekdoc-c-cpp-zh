    ```


    Above, we deal with the positioning of the wheel based on whether Physics. Raycast
    finds a hit or not. If a hit is found, the position for the visual wheel is made
    up of the hit point, plus the wheel Collider''s local up vector multiplied by
    the wheel radius. This should sit the wheel just above the hit surface.


    The second statement above calculates the wheel position at a fixed distance from
    the WheelCollider''s center, that distance made up of the Collider''s local up
    vector multiplied by the suspension distance. This is how we get to that fixed,
    fully extended suspension distance mentioned earlier in this chapter.


    ```

    ```

    _TR.rotation = _colliderTransform.rotation * Quaternion.

    Euler(RotationValue, _correspondingCollider.steerAngle, 0);

    RotationValue += _correspondingCollider.rpm * 6 * Time.

    deltaTime;

    RotationValue = RotationValue % 360;

    ```

    ```


    In the code above, a rotation is calculated encompassing the steering angle turning
    the wheel about its Y axis, and a RotationValue variable used to turn the wheel
    on its X axis. The RotationValue variable is used to make our wheel look like
    it is rolling. RotationValue is made up of the WheelCollider''s RPM (revolutions
    per minute) value multiplied by 6 – the 6 is 360 (degrees) multiplied by 60 (seconds)
    to convert RPM to radians – then again, multiplied by Time.deltaTime to make sure
    that the rotation is consistent, based on time since the last time Update() was
    called.


    We then take the RotationValue variable and force it to loop around between 0
    and 360 so that it does not keep accumulating the rotation to become a giant number.
    If a number gets too big, eventually it will cause floating point errors. Even
    though this is unlikely given that the average race does not take that much time,
    I prefer to fix it and anticipate the problem before it happens, so we just make
    RotationValue the modulus of RotationValue vs. 360 (modulus finds the remainder
    after dividing the first number by the second, giving a rotation between 0 and
    360.


