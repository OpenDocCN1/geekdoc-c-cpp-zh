- pgno: 99
  md: "# 5.5 Input\n\nYour games could take a variety of different inputs, or in some\
    \ cases you may want to implement a third-party input solution like Rewired (made\
    \ by Guaveman Enterprises) to provide extended detection of input hardware or\
    \ force feedback effects.\n\nIn Chapter 4, we saw that the main player structure\
    \ contained a single input script designed to take keyboard input. Adding input\
    \ systems is case of building custom input scripts that follow a similar format,\
    \ so that the existing player code need not be changed to accommodate different\
    \ controls.\n\nIt may be required to take input from other methods than the keyboard,\
    \ such as mouse, or joystick. You can easily set up alternate controls in the\
    \ Unity editor via the Edit > Project Settings > Input menu.\n\nInput scripts\
    \ can be found in Assets/GPC_Framework/Scripts/COMMON/INPUT.\n\n# 5.5.1 Mouse\
    \ Input\n\nMouse_Input.cs calculates movement of the mouse between each frame\
    \ and uses it for input. The script:\n\n```\n```csharp\npublic class MouseInput\
    \ : BaseInputController\n{\n    private Vector2 prevMousePos;\n    private Vector2\
    \ mouseDelta;\n    private float speedX = 0.05f;\n    private float speedY = 0.1f;\n\
    \    public void Start ()\n    {\n        prevMousePos= Input.mousePosition;\n\
    \    }\n}\n```\n```\n\nThe Start() function adds a default value to prevMousePos,\
    \ which will be used to calculate the movement between each update. If prevMousePos\
    \ was left at zero (its default) then the first time CheckInput() happens the\
    \ script will incorrectly assume that the mouse has moved from 0,0 to the current\
    \ mouse position.\n\nInput provides an interface to Unity's input systems. It\
    \ is used for everything from gyroscope input on mobile devices to keyboard presses.\
    \ Input.mousePosition delivers the current position of the mouse in pixel coordinates\
    \ as a two-dimensional vector, with the bottom left of the screen at 0,0 and top\
    \ right at Screen.width, Screen.height.\n\nThe mouse input system uses mouse delta\
    \ movement (the amount of movement since the last update) instead of mouse position.\
    \ The delta amount is converted into a percentage value (a percentage of the screen\
    \ width or height) and the resulting percentage value used as input.\n\n```\n\
    ```csharp\npublic override void CheckInput ()\n{\n    // get input data from vertical\
    \ and horizontal axis\n    and store them internally in vert and horz so we don't\n\
    \    // have to access them every time we need to relay\n    input data out\n\n\
    \    // calculate a percentage amount to use per pixel\n    float scalerX = 100f\
    \ / Screen.width;\n    float scalerY = 100f / Screen.height;\n}\n```\n```"
  merge: -1
  img_proc: true
- pgno: 100
  md: "CheckInput() starts by calculating a scale to work at. The floats scalerX and\
    \ scalerY hold the equivalent of one percent of the screen's width and height\
    \ respectively.\n\n```\n```\n// calculate and use deltas\nfloat mouseDeltaY =\
    \ Input.mousePosition.y -\nprevMousePos.y;\nfloat mouseDeltaX = Input.mousePosition.x\
    \ -\nprevMousePos.x;\n```\n```\n\nThe delta amount of mouse movement is calculated\
    \ in the code by taking the current mouse position and subtracting it from the\
    \ position that the mouse was at the end of the last update.\n\n```\n```\n// scale\
    \ based on screen size\nvert += ( mouseDeltaY * speedY ) * scalerY;\nhorz += (\
    \ mouseDeltaX * speedX ) * scalerX;\n// store this mouse position for the next\
    \ time we're\nhere\nprevMousePos= Input.mousePosition;\n```\n```\n\nWhen the mouse\
    \ position is multiplied by the scale variables (scalerX and scalerY) we end up\
    \ with a percentage amount. We say that the mouse is at a percentage amount across\
    \ the screen and use that percentage amount as input.\n\n```\n```\n// set up some\
    \ Boolean values for up, down, left and\nright\nUp = ( vert>0 );\nDown = ( vert<0\
    \ );\nLeft = ( horz<0 );\nRight = ( horz>0 );\n```\n```\n\nThe mouse-based input\
    \ script also populates the Boolean variables above, for directional movement,\
    \ if required.\n\n```\n```\n// get fire / action buttons\nFire1= Input.GetButton(\
    \ \"Fire1\" );\n}\n```\n```\n\nTo make the fire button work properly, mouse button\
    \ input must be set up correctly in the input settings of the Unity editor, under\
    \ the Fire1 entry.\n\n```\n```\npublic void LateUpdate()\n{\n    // check inputs\
    \ each LateUpdate() ready for the next\ntick\n    CheckInput();\n}\n```\n```\n\
    \nThe script calls its own update function from LateUpdate(), which is where Unity\
    \ recommends all input checking happen.\n\n> Note: To set up inputs correctly,\
    \ open Unity's Input menu Edit > Project Settings > Input\n\n# 5.6 Level Loading\n\
    \nThere are two loading systems in this book. One uses Unity's SceneManager to\
    \ just go ahead and load a Scene. Advanced level loading has its own chapter in\
    \ this book, and you can find it in Chapter 13."
  merge: -1
  img_proc: true
- pgno: 101
  md: "# 5.7 ScriptableObjects\n\nScriptableObjects are a great way to manage data\
    \ that needs to persist across the entire game. There is just one script in the\
    \ framework, ProfileScriptableObject.\n\n# 5.7.1 ProfileScriptableObject\n\nSaving\
    \ and loading is covered, in full, in Chapter 12. For save profiles, this framework\
    \ uses a ScriptableObject to store everything we want in the profile. This script\
    \ needs to be serialized, so be aware of using any variable types that may not\
    \ be easily serializable by the engine. It forms the basis of a save profile.\
    \ You can find this script in the folder Assets/GPC_Framework/Scripts/COMMON.\n\
    \nThe ProfileScriptableObject.cs script looks like this:\n\n```\nusing System.Collections;\n\
    using System.Collections.Generic;\nusing UnityEngine;\nusing System;\n\nnamespace\
    \ GPC\n{\n    [CreateAssetMenu(fileName = \"ProfileData\", menuName = \"CSharpFramework/ProfileScriptableObject\"\
    )]\n    [Serializable]\n    public class ProfileScriptableObject : ScriptableObject\n\
    \    {\n        public Profiles theProfileData;\n    }\n\n    [Serializable]\n\
    \    public class Profiles\n    {\n        public ProfileData[] profiles;\n  \
    \  }\n\n    [Serializable]\n    public class ProfileData\n    {\n        [SerializeField]\n\
    \        public int myID;\n        [SerializeField]\n        public bool inUse;\n\
    \        [SerializeField]\n        public string profileName = \"EMPTY\";\n  \
    \      [SerializeField]\n        public string playerName = \"Anonymous\";\n \
    \       [SerializeField]\n        public int highScore;\n        [SerializeField]\n\
    \        public float sfxVolume;\n        [SerializeField]\n        public float\
    \ musicVolume;\n    }\n}\n```\n\n# 5.8 Spawning\n\nIn many cases using Unity's\
    \ built-in Instantiate function would be enough for creating objects for a desktop\
    \ computer-based game, but instancing GameObjects in Unity can be an expensive\
    \ process, particularly noticeable on mobile devices."
  merge: -1
  img_proc: true
- pgno: 102
  md: "One common method of getting around the processor hit is to use pooling. Pooling\
    \ is where you have a group of objects that you use and reuse without destroying\
    \ them. Building a pool management system is beyond the scope of this book, although\
    \ centralizing the spawning system will make it easy to switch out spawning for\
    \ a better solution in the future.\n\nFind these scripts in Assets/GPC_Framework/Scripts/COMMON/SPAWNING.\n\
    \n# 5.8.1 A Spawner Component\n\nThis Spawner class can either instantiate a prefab\
    \ after an amount of time after the Scene starts, when the camera gets within\
    \ a certain distance of the spawn point, or when the script is called to spawn\
    \ by another script. It is used in this book for the example game Blaster, whereby\
    \ each wave of enemies is stored in a separate Scene. The enemy prefabs are spawned\
    \ automatically after the Scene finishes loading, and the player can get to blasting\
    \ them.\n\n```\nusing UnityEngine;\n\nnamespace GPC\n{\n    [AddComponentMenu(\"\
    SharpBookCode/Common/Spawn Prefabs (no path following)\")]\n\n    public class\
    \ Spawner : ExtendedCustomMonoBehaviour\n    {\n```\n\nThe class is added to the\
    \ GPC namespace, then a menu item is added to the Unity editor via the AddComponentMenu\
    \ tag. The class derives from ExtendedCustomMonoBehaviour so that we get access\
    \ to its IsInLayerMask() function, if needed in future. For example, the TriggerSpawner\
    \ class in Section 5.8.2 of this chapter derives from Spawner and makes use of\
    \ IsInLayerMask().\n\n```\n    // should we start spawning based on distance from\n\
    \    the camera?\n    // if distanceBased is false, we will need to call\n   \
    \ this class from elsewhere, to spawn\n    public bool distanceBasedSpawnStart;\n\
    \n    // if we're using distance based spawning, at what\n    distance should\
    \ we start?\n    public float distanceFromCameraToSpawnAt = 35f;\n    public bool\
    \ shouldAutoStartSpawningOnLoad;\n    public float timeBetweenSpawns = 1;\n  \
    \  public bool startDelay;\n    public int totalAmountToSpawn = 10;\n    public\
    \ bool shouldRepeatWaves;\n    public bool shouldRandomizeSpawnTime;\n    public\
    \ float minimumSpawnTimeGap = 0.5f;\n    public GameObject[] _spawnObjectPrefabs;\n\
    \    private int totalSpawnObjects;\n    private int spawnCounter = 0;\n    private\
    \ int currentObjectNum;\n    private Transform _cameraTransform;\n    private\
    \ bool shouldSetSpeed;\n    public bool shouldSetSpeed;\n    public float speedToSet;\n\
    \    public bool shouldSetSmoothing;\n    public float smoothingToSet;\n    public\
    \ bool shouldSetRotateSpeed;\n    public float rotateToSet;\n```"
  merge: -1
