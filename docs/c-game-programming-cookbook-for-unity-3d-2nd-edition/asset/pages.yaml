  md: "and the bulk of the work is going to be to connecting existing scripts together\
    \ to form the GameObject, logic, and physics for this game. You may be surprised\
    \ to learn that it only takes four custom scripts.\n\n# ## 2.4 The Game Manager\n\
    \nAt the core of this game is the Game Manager. This is where the state of our\
    \ game is tracked and the convergence point of all the game's objects and logic.\
    \ We will be revisiting the Game Manager throughout this chapter, but what we\
    \ need to do in this section is to set up the basic structure and a few variables\
    \ for our other objects to access and use. For example, platforms will need to\
    \ know how fast to move. We need all platforms to move at the same speed, so it\
    \ makes sense to store the speed value in the Game Manager. Storing the platform\
    \ speed also means that we can change the speed of the game easily from right\
    \ inside the script that deals with game logic.\n\nWith the `RunMan_GameManager`\
    \ scene open in Unity, click the plus sign at the top of the Hierarchy panel to\
    \ show the Add menu. Choose Create Empty from the dropdown.\n\n> > *TIP: You can\
    \ also access the Add GameObject menu by right clicking in an empty space in the\
    \ Hierarchy panel or via the menu GameObject at the top of the editor.*\n\nIn\
    \ the Inspector, with the new GameObject selected, change the name from GameObject\
    \ to GameManager.\n\nClick Add Component. In the text box that appears after clicking\
    \ that button, type `RunMan_GameManager`. Once you have finished typing, press\
    \ enter on the keyboard. The Add Component window will automatically switch to\
    \ show New Script (Figure 2.7). Click Create and Add. This creates a new C# script\
    \ Component and adds it to the GameObject you just created. After a little time\
    \ for the compiler to update, the Component should appear in the Inspector as\
    \ a Component named (Script). The next step is to open the script and add some\
    \ code to it.\n\nStill in the Inspector, double click on the Script name inside\
    \ the Component to open your default script editor (normally Visual Studio, unless\
    \ you chose something different when you installed Unity). If you have any issues\
    \ opening the script, you can get to it via the Project panel. Unity will have\
    \ automatically placed the new script in the Assets folder. Click on the Assets\
    \ folder in the Project panel and you should be able to see `RunMan_GameManager`\
    \ on the right side of the split Project pane. Double click the script file to\
    \ open it.\n\nThe default C# script Unity adds when you create new file looks\
    \ like this:\n\n```\n```csharp\nusing System.Collections;\nusing System.Collections.Generic;\n\
    using UnityEngine;\n\npublic class RunMan_GameManager : MonoBehaviour\n\n{\n \
    \   // Start is called before the first frame update\n    void Start()\n    {\n\
    \    }\n\n    // Update is called once per frame\n    void Update()\n    {\n \
    \   }\n}\n```\n```"
