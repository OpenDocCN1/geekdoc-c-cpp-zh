    out of the Hierarchy into the Final Score Text field of the RunMan_UIManager Component
    in the Inspector.


    Finally, under GameOverMessageCanvas again, click and drag NewHighScoreTextLabel
    out of the Hierarchy and into the New High Score Text field in the Inspector.


    With all the user interface references set up, we can now use some of the UnityEvents
    on the GameManager to call functions on the script you just added and show or
    hide user interface as needed. When a UnityEvent is invoked (called by code) it
    can trigger a function call to a function within a script Component on any other
    GameObject. We just need to tell it which GameObject the script is on, and which
    function to call.


    Click on GameManager in the Hierarchy, to show the GameManager''s properties and
    Components in the Inspector.


    Under the Game Events label find the OnLoaded() event. Right now, it will say
    List is Empty. Beneath that, to the right, find the little plus icon and click
    on it. The List is Empty message should now disappear to show two accessible fields
    and a grayed-out dropdown menu (Figure 2.18). The top left box reads Runtime Only
    - this refers to when this UnityEvent should be active. As we do not want it to
    do anything in any state other than when the game is running, we can leave it
    at its default state.


    Beneath that is an object box that starts with the default state of None. What
    we need to do here is to add a reference to a GameObject. In this case, however,
    we are going to be calling functions in the RunMan_UI Manager Component attached
    to the GameManager which means we need to reference the GameManager here.


    To do that, keep the OnLoaded() UnityEvent visible in the Inspector, then from
    the Hierarchy drag out the GameManager GameObject and drop it into the None(Object)
    target field. The dropdown to the right of it should now be enabled. Click the
    dropdown and choose RunMan_UIManager from the list, followed by ShowGetReadyUI.
    When the game is started, the OnLoaded event will be invoked and our call to ShowGetReadyUI
    triggered, showing the get ready message to the player.


    Let''s set up the rest of the events.


    Find the OnGameStarted() event in the Inspector. Click the plus sign (+) twice,
    to add two new events. From the Inspector, drag the GameManager GameObject and
    drop it into the target boxes for each event (currently populated by None (Object)).


    In the first dropdown, choose RunMan_UIManager followed by ShowGameUI.


    In the second dropdown, choose RunMan_UIManager followed by HideGetReadyUI.


