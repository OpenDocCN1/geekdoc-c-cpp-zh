- pgno: 46
  md: '# 2.6.6 Scoring


    The framework in this book includes something I call a User Data Manager. Essentially,
    every player manages its own data. Having score, health, lives, and so on belonging
    to the player rather than the game, we abstract out the player from the rest of
    the game code. For example, the Game Manager does not need to keep track of score
    for all the players since the players do that themselves. The Game Manager can
    tell a player to increase its score, but it does not have to do anything more
    than that. This approach makes it easier to implement things like multiplayer
    later, as the player structure is easier to switch out to different setups without
    affecting other code.


    In the Hierarchy, click the RunMan GameObject to highlight it. In the Inspector,
    you should find that Unity has already added the BaseUserManager Component. This
    happens due to there being code - in one of the scripts that our RunMan_CharacterController
    script inherits from named BasePlayerStatsController - that tells Unity we require
    this Component to be attached to our GameObject.


    The BaseUserManager contains a whole lot of helper functions to add score, reduce
    score, add health, or lives or levels. We will be looking at this system in detail
    further in this book, in Chapter 4, Section 4.3. For now, all you need to know
    is that everything we need to do with storing score for RunMan will be contained
    in that BaseUserManager Component.


    # 2.7 The Game Loop and the Game Manager


    A game loop usually refers to a recurring core of game code, where logic exists
    that needs to be updated every frame or where game states are monitored and changed
    to control a games overall flow. The RunMan_GameManager script we have so far
    has no real game logic inside it, just a few variables and an instance variable,
    and this section adds in the game loop and supporting functions around it to do
    things like spawn platforms for the player to run on.


    You might recall that when we made the RunMan_GameManager script back in Section
    2.4, we programmed it so that the RunMan_GameManager class derives from BaseGameManager.
    BaseGameManager already has code in place to help us to deal with the state of
    the game.


    # 2.7.1 Game States


    The BaseGameManager includes 17 different states for larger, more complicated
    games, though for this project we only use 5 of them:


    | State | Description |

    |---|---|

    | Game.State.loaded | This state is called when the main game Scene first loads.
    |

    | Game.State.gameStarting | After initialization and set up of anything we need
    in the main game Scene, gameStarting will be set and we use this to display a
    message that will notify the player to ''get ready'' to play. |

    | Game.State.gamePlaying | Once the game is running, the states stays in gamePlaying.
    |

    | Game.State.gameEnding | If the player falls off a platform and hits a hidden
    trigger, the game ends. The gameEnding state takes care of stopping movement and
    preventing any more score being earned. We also show the final ''game over'' user
    interface as this state begins. |

    | Game.State.gameEnded | When the gameEnded state occurs, we leave the main game
    Scene and load the main menu. |'
  merge: -1
