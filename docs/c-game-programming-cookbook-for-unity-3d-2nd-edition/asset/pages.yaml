  md: '![](img/e4b578cd512539e7261e070d87b6550a_165_0.png)


    Figure 9.3 The Exposed Parameters menu shows exposed parameters and allows you
    to rename or unexpose them from scripts.


    be exposed to script, but it will have a default name – MyExposedParam – which
    is not the most descriptive. To rename the exposed property, look to the Audio
    Mixer panel and find the Exposed Parameters button in the top right of it (Figure
    9.3) – click on Exposed Parameters and Unity should show you any exposed parameters
    for the selected Mixer. To rename, right click the property you wish to rename
    and choose Rename from the menu.


    If you ever want to unexposed a parameter, click on Exposed Parameters, and right
    click on the parameter you wish to unexposed. Choose Unexpose from the menu.


    # 9.1.3 Audio Effects


    Unity offers a variety of audio effects; you can add to AudioMixers to make your
    sounds more interesting or to help balance them dynamically. To add effects, first
    open the AudioMixer via the menu Window/Audio/ Audio Mixer. Choose the Group you
    want to add effects to. In the Audio Mixer panel, there is an Add button at the
    bottom of each audio panel. Click Add to show the effects menu. At this point,
    let me draw your attention to the Duck Volume effect. Duck Volume will take input
    from another audio group and drop the volume of the group it is attached to. You
    may have already heard this effect in action in commercial videogames and tv shows
    during dialog, as it is most often used to drop the volume of music whenever dialog
    is played. To accomplish this, you would have your music and dialog channeled
    through two audio groups. Your music group would have the Duck Volume effect on
    it. Your dialog group would have the Send effect attached. In the Inspector with
    the dialog group selected, the Send effect has a field named Receive that lets
    you choose which group should receive audio levels. Setting this to the music
    channel would mean that the Duck Volume effect could get this groups levels and
    duck the volume of the music accordingly. Using audio ducking with notification
    sounds can also make the process of highlighting important sounds easier.


    # 9.2 The BaseSoundManager Class


    In this section, we build a basic sound management class named BaseSoundManager.
    Its specifications are:


    +   - Must be able to manage multiple audio clips from a single class

    +   - Ability to play an audio clip from a set position in 3d space'
