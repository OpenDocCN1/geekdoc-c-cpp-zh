    \ =\nVector3.Distance(_TR.position, _followTarget.position);\n// check the range\n\
    if (distanceToChaseTarget > minChaseDistance)\n    MoveForward();\n```\n\nWhen\
    \ the bot is chasing, the code above calls TurnTowardTarget() to turn the bot\
    \ toward _followTarget. TurnTowardTarget() is in BaseAIController. The next step\
