  md: "MergeScenes(), the order of the parameters also affects how the Scenes are\
    \ merged, in that the first Scene is a Scene to merge and the second is the Scene\
    \ to merge the first into. That is, the new merged Scene will be referred to in\
    \ memory as the second Scene you passed in as a parameter to SceneManager.MergeScenes().\
    \ SceneManager.SetActiveScene() tells Unity that we now want to use the core Scene\
    \ already loaded into memory with the level merged into it (above, we refer to\
    \ the coreSceneName in SetActiveScene() to get to our new, merged Scene).\n\n\
    ```\n```csharp\nAsyncOperation asyncLoad3 = SceneManager.UnloadSceneAsync(loaderScene);\n\
    ```\n```\n\nWith the current Scene set to our new, merged Scene, the SceneManager.UnloadSceneAsync()\
    \ function is used to unload the Scene we were in whenever the loading started.\n\
    \n```\n```csharp\n// Wait until the asynchronous scene fully unloads\nwhile (!asyncLoad3.isDone)\n\
    {\n    yield return null;\n}\n```\n```\n\nBefore we reach the end of the co-routine,\
    \ the code chunk above checks isDone to monitor the unloading process. Once the\
    \ previous Scene has been fully unloaded, its AsyncOperation.isDone Boolean will\
    \ be true and we can move on to the end of the co-routine:\n\n```\n```csharp\n\
    yield return new WaitForSeconds(1);\n    }\n}\n```\n```\n\nThe last piece of the\
    \ puzzle is to wait for one second before the co-routine shuts down.\n\n# 13.2\
    \ Multiple Level Loading\n\nWhen you have a game that has multiple levels, you\
    \ need a method for using the LevelLoader class to load levels but how can we\
    \ set the filename if the Scene loading Scene is a different one to the main game?\
    \ The answer lies in a LevelVars class that will hold a few static variables for\
    \ the Scene loading code to pick up on and use for loading our levels during gameplay.\n\
    \nTo hold information about which Scenes to load, we have LevelVars.cs:\n\n```\n\
