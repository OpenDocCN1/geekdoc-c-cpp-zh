- pgno: 213
  md: "# 11.2.2 The BaseMainMenuManager Script\n\nBaseMainMenuManager provides basic\
    \ functionality for dealing with a main menu. The BaseMainMenuManager class requires\
    \ a few extra namespaces than usual. Those are:\n\n```\nusing UnityEngine;\nusing\
    \ UnityEngine.Audio;\nusing UnityEngine.SceneManagement;\nusing UnityEngine.UI;\n\
    ```\n\nThe volume sliders will need to access an AudioMixer object, so we need\
    \ UnityEngine.Audio to be available to us. To load different Scenes in Unity,\
    \ we use UnityEngine.SceneManagement to be able to access the SceneManager class.\
    \ Finally, above, user interface Components are only accessible when we use the\
    \ UnityEngine.UI namespace.\n\nThe class itself derives from MonoBehaviour:\n\n\
    ```\nnamespace GPC\n{\n    public class BaseMainMenuManager : MonoBehaviour\n\
    \    {\n\n```\n\nVariable declarations next:\n\n```\npublic CanvasManager _canvasManager;\n\
    public AudioMixer _theAudioMixer;\n\npublic Slider _sfxSlider;\npublic Slider\
    \ _musicSlider;\npublic string gameSceneName;\n```\n\nAbove, we start with a reference\
    \ to CanvasManager, to use to show and hide canvases. The AudioMixer needs to\
    \ be referenced in this script, too, so that we can access and set its volume\
    \ properties via the sliders. Those sliders are referenced next. The sliders themselves\
    \ use the Unity event On Value Changed() to call functions on this class that\
    \ will change volume levels on the AudioMixer. The event and its corresponding\
    \ reference to this scripts function must be set up in the Inspector on the slider's\
    \ Slider Component.\n\n```\nvoid Start()\n{\n    Init();\n}\npublic virtual void\
    \ Init()\n{\n    if (_canvasManager == null)\n        Debug.LogError(\"You need\
    \ to add a reference to a _canvasManager Component on your main menu Component!\"\
    );\n    // set the values of the UI (visible) sliders to those of the audio mixers\n\
    \    SetupSliders();\n    Invoker(\"ShowMainMenu\", 0.5f);\n}\n```"
  merge: -1
  img_proc: true
- pgno: 214
  md: "Above, Start() calls Init(). Init() checks that we have a reference in _canvas-Manager,\
    \ then calls SetupSliders() to set slider values from the current volume levels.\
    \ Finally, there is a call to show the main menu in an arbitrary amount of time.\
    \ We use a delayed call so that the menu is not transitioning as soon as the Scene\
    \ loads – it just looks a little more tidy when we are able to see what is happening\
    \ before the transition starts.\n\n```\n```csharp\nvoid SetupSliders()\n{\n  \
    \  // now set the UI sliders to match the values in the mixer\n    float value;\n\
    \    _theAudioMixer.GetFloat(\"SoundVol\", out value);\n```\n```\n\nSetupSliders()\
    \ is called by the Init() function above, and it starts by getting the current\
    \ volume level of the group named SoundVol from the AudioMixer referenced in _theAudioMixer.\
    \ By default, AudioMixers do not have any of their properties exposed to scripts\
    \ and it is something you need to set up in the editor. For instructions on how\
    \ to do this, see the earlier Chapter 9.\n\nAudioMixers store levels in decibels,\
    \ a range between a minimum of –80 up to 20db maximum, whereas sliders use arbitrary\
    \ values we can set in the Inspector. In the example for this book, we use values\
    \ between 0 and 1 representing a percentage amount. Our volume system, however,\
    \ is complicated by the fact that not only does the AudioMixer run from –80 to\
    \ 20 but decibel amounts are not linear, but instead logarithmic – essentially\
    \ what this means is that we cannot rely on the midpoint between minimum and maximum\
    \ decibels actually being a midpoint between silent and loud. If we were to use\
    \ the sliders to set the decibel values, the relationship between slider and actual\
    \ volume would be off. Certainly, it would not make a very intuitive interface.\
    \ The user expects the slider to act as a linear scale between 0 and 100% volume\
    \ levels, so we need to do a little work to make that happen. The AudioMixer value\
    \ needs to be converted to something we can use.\n\nAbove, we grabbed the volume\
    \ from the AudioMixer and put it in to the variable named value, so the next step\
    \ is to convert value to a percentage:\n\n```\n```csharp\n_sfxSlider.value = DecibelToLinear(value);\n\
    ```\n```\n\nThe next part of the code handles music volume in a similar way, except\
    \ of course it uses a different slider and a different exposed property on the\
    \ AudioMixer (MusicVol):\n\n```\n```csharp\n_theAudioMixer.GetFloat(\"MusicVol\"\
    , out value);\n_musicSlider.value = DecibelToLinear(value);\n}\n```\n```\n\nNext,\
    \ two functions used to set the volume from values in our sliders:\n\n```\n```csharp\n\
    public virtual void SetSFXVolumeLevel(float aValue)\n{\n    float dbVol = Mathf.Log10(aValue)\
    \ * 20f;\n```\n```\n\nAbove, SetSFXVolumeLevel takes the percentage amount coming\
    \ in via aValue and converts it to decibels.\n\n```\n```csharp\n_theAudioMixer.SetFloat(\"\
    SoundVol\", dbVol);\n}\n```\n```"
  merge: -1
  img_proc: true
- pgno: 215
  md: "AudioMixer.SetFloat() is used to set the volume level of our AudioMixer to\
    \ the decibel value in dbVol. Next, we do the same for the music volume:\n\n```\n\
    ```csharp\npublic virtual void SetMusicVolumeLevel(float aValue)\n{\n    float\
    \ dbVol = Mathf.Log10(aValue) * 20f;\n    _theAudioMixer.SetFloat(\"MusicVol\"\
    , dbVol);\n}\n```\n```\n\nAbove, the music volume is set the same way we did the\
    \ sounds volume above.\n\n```\n```csharp\nprivate float DecibelToLinear(float\
    \ dB)\n{\n    float linear = Mathf.Pow(10.0f, dB / 20.0f);\n    return linear;\n\
    }\n```\n```\n\nAs mentioned earlier in this section, the user interface sliders\
    \ work at a value between 0 and 1 in this example. The utility function DecibelToLinear\
    \ above will take a value in decibels and return a number from 0 to 1 depending\
    \ on how loud or quiet the volume should be – between the range of -80 to 20db.\n\
    \n```\n```csharp\nvoid ShowMainMenu()\n{\n    _canvasManager.TimedSwitchCanvas(2,0);\n\
    }\n```\n```\n\n```\n```csharp\npublic virtual void StartGame()\n{\n    _canvasManager.HideCanvas(0,\
    \ false);\n    _canvasManager.ShowCanvas(2, false);\n    Invoke(\"LoadGameScene\"\
    , 1f);\n}\n```\n```\n\nShowMainMenu() calls on the CanvasManager Component to\
    \ switch the active canvas from the loading screen (index of 2 in this example)\
    \ to the main menu which has an index of 0. The index numbers refer to the Canvases\
    \ position in the UI Canvas Groups list on the Canvas Manager Component on the\
    \ MenuManager GameObject.\n\nStartGame() starts by hiding the main menu Canvas\
    \ and then goes on to show the loading screen. We use an Invoke() call to schedule\
    \ the game to load after 1 second, which gives the CanvasManager enough time to\
    \ fade out the menu and fade in the loading screen before we jump to the next\
    \ Scene.\n\n```\n```csharp\npublic virtual void LoadGameScene()\n{\n    // Load\
    \ your game here!\n    SceneManager.LoadScene(gameSceneName);\n}\n```\n```\n\n\
    LoadGameScene() does just that, utilizing SceneManager.LoadScene() to do it. The\
    \ name of the Scene to load is stored in gameSceneName – this is a string you\
    \ can set in the Inspector, which makes it easier to use the menu for different\
    \ games without having to modify any code.\n\n```\n```csharp\npublic virtual void\
    \ ShowOptions()\n{\n    // switch to options menu\n}\n```\n```"
