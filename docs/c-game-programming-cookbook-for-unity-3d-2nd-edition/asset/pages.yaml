  md: "```\nif (faceWaypoints)\n    TurnTowardTarget(_currentWaypointTransform);\n\
    }\n```\n\nAlthough none of the examples in this book use it, the function MoveAlongWaypointPath()\
    \ is provided here should you need it. It uses the waypoints system from Chapter\
    \ 8 to move the bot along a path set by waypoints. The bool isStationary can be\
    \ used to start or stop the bot along its path. You can also set the bool faceWaypoints\
    \ to decide whether or not to have the bot face the waypoint it is moving toward,\
    \ or to just move, and keep its rotation.\n\n```\npublic void SetMoveSpeed(float\
    \ aNum)\n{\n    moveSpeed = aNum;\n}\n```\n\nFinally, in this class, we have the\
    \ SetMoveSpeed() function which can be used by other scripts to change the movement\
    \ speed of our bot.\n\n# 10.5 The AI SteeringController Class – An AI Steering\
    \ Controller\n\nAI SteeringController uses the waypoints system from Chapter 8\
    \ to provide inputs suitable for feeding into a vehicle script such as the BaseWheeledVehicle\
    \ class from Chapter 6. This class will provide the variable horz (short for horizontal)\
    \ with values between -1 and 1 suitable for steering toward waypoints and it will\
    \ detect the angle to establish acceleration amounts. This script also ensures\
    \ that the vehicle remains below a maximum speed.\n\n```\nusing UnityEngine;\n\
    using AIStates;\nnamespace GPC\n{\n    public class AI SteeringController : BaseAIController\n\
    \    {\n```\n\nThis class is derived from BaseAIController to use its state machine\
    \ system.\n\n```\npublic Vector3 relativeWaypointPosition;\npublic float turnMultiplier\
