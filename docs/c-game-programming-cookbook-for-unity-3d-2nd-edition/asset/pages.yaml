- pgno: 141
  md: '# # 7 Weapon Systems


    To be as flexible as possible, in this chapter we build a weapon management system
    that will control individual weapon controllers. Those weapon controllers, in
    turn, will deal with spawning projectiles and finally projectiles will take care
    of themselves independently. Our weapon management system should function with
    a single weapon or we should be able to add many different weapons and switch
    between them.


    The weapon controller deals with weapons and passes on messages to them. It contains
    an array containing all weapons and a method to activate and deactivate them as
    required.


    Each weapon is a prefab with a script attached that derives from BaseWeaponScript.cs.
    The weapon should be self-contained other than when it receives a call to Fire()
    it should do whatever it is supposed to do. BaseWeaponScript contains the basics
    for a weapon (ammunition, reload time, and the ability to be disabled or enabled).


    # ## 7.1 Building the Scripts


    For the weapon system, there are two main script Components and one for input:


    +   1. BaseWeaponController

    +      This is the framework for our weapon control system. It offers everything
    the system requires and it is intended to be overridden for customization.

    +   2. BaseWeaponScript

    +      This takes care of individual weapon types. If you were to think of the
    baseWeaponController as the arms of the player, the baseWeaponScript would be
    the design of the weapon it is holding.'
  merge: -1
  img_proc: true
