    \ and hidden as needed.\n\nIn the Hierarchy, click the GameManager GameObject\
    \ to highlight it. In the Inspector, scroll down to the Add Component button and\
    \ click it. Choose New Script and type RunMan_UIManager as the name of the script.\
    \ Click Create and Add to make the new template Component. Once the Component\
    \ appears, double click on the script name to open the script up in your script\
    \ editor.\n\nReplace the code with this:\n\n```\n```csharp\nusing UnityEngine.UI;\n\
    using GPC;\n\npublic class RunMan_UIManager : CanvasManager\n{\n    // we derive\
