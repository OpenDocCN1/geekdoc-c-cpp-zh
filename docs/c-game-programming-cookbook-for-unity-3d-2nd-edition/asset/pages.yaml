  md: "_rotateTransform is an optional parameter which may be set in the Unity editor\
    \ Inspector window to provide a Transform for rotation which is different to the\
    \ one that the script is attached to. This is used in cases where we do not wish\
    \ to rotate the main Transform.\n\n```\ndidInit= true;\n```\n\nAs with all of\
    \ the other scripts in this book, didInit is a Boolean variable used to determine\
    \ whether or not the Init() function has successfully completed.\n\n```\npublic\
    \ void SetAIControl( bool state )\n{\n    AIControlled= state;\n}\n```\n\nAbove,\
    \ a Boolean variable named AIControlled is used to decide whether this script\
    \ should take control. The SetAIControl() function just provides an easy way for\
    \ other scripts to enable or disable AI control.\n\n```\n// set up AI parameters\
    \ -------------------------\npublic void SetObstacleAvoidDistance(float aNum)\n\
    {\n    obstacleAvoidDistance = aNum;\n}\npublic void SetWaypointDistance(float\
    \ aNum)\n{\n    waypointDistance = aNum;\n}\npublic void SetMinChaseDistance(float\
    \ aNum)\n{\n    minChaseDistance = aNum;\n}\npublic void SetMaxChaseDistance(float\
    \ aNum)\n{\n    maxChaseDistance = aNum;\n}\n// -----------------------------------------------\n\
    ```\n\nAbove, functions to set several main parameters. Those are:\n\nobstacleAvoidDistance(float)\
    \ – In 3d units, how far the bot should look ahead in its attempts to avoid running\
    \ into obstacles when it is patrolling.\n\nwayPointDistance(float) – In 3d units,\
    \ how close the bot will be allowed to get to a waypoint before it advances to\
    \ the next waypoint.\n\nminChaseDistance (float) – In 3d units, minChaseDistance\
    \ determines how close the bot should get to its target, when chasing a target,\
    \ before it stops moving toward it. This is to prevent the bot from getting too\
    \ close and pushing the player around.\n\nmaxChaseDistance (float) – In 3d units,\
    \ how far away from its target the bot can acknowledge a target.\n\n```\npublic\
    \ virtual void SetAIState(AIState newState)\n{\n    // update AI state\n    targetAIState\
    \ = newState;\n    UpdateTargetState();\n}\n```"
