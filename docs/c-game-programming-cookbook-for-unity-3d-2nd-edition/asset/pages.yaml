    \ this function to your script next, below the StartGame function you added previously:\n\
    \n```\nvoid StartRunning()\n{\n    isRunning = true;\n    runSpeed = 1f;\n   \
    \ distanceCounter = 1f;\n\n    // start animation\n    _runManCharacter.StartRunAnimation();\n\
    \    InvokeRepeating(\"AddScore\", 0.5f, 0.5f);\n    SetTargetState(Game.State.gameStarted);\n\
    }\n```\n\nStartRunning kicks the game to life! The first line sets the Boolean\
    \ isRunning to true so that movement and animations can get started.\n\nBelow\
    \ that, runSpeed is set to 1. The platform code we added earlier will use this\
    \ variable to know how quickly to move the platforms across the screen, so now\
    \ it is set to 1 the platforms will move.\n\nThe distanceCounter variable is used\
    \ to keep a track of how far platforms move, which in turn is used to decide when\
    \ to spawn new platforms for the player to jump on. As it is the start of the\
    \ game, it is reset above to 1.\n\nA call to StartRunAnimation() on the RunManCharacter\
    \ object (an instance of the RunMan_CharacterController script Component attached\
    \ to the player) gets the running animation started.\n\nAs well as the Invoke\
    \ function, Unity provides another useful method for scheduling function calls.\
    \ InvokeRepeating will call the specified function at regular intervals until\
    \ either the Scene is unloaded or you use CancelInvoke() to stop it. In the code\
    \ above, the AddScore() function is called every 0.5 seconds where the player\
    \ will be awarded with score. The scoring system for this game is very simple,\
    \ but it will work well enough! Survive longer, get a higher score.\n\nThe last\
    \ line of StartRunning() advances the game state:\nSetTargetState(Game.State.gameStarted);\n\
    \nThe UpdateTargetState() function you added earlier will deal with this change\
    \ of state to Game.State.gameStarted, invoke the OnGameStarted() UnityEvent and\
    \ change the state to Game.State.gamePlaying. From here on, the game just sits\
    \ in Game.State.gamePlaying until the game ends.\n\nNext, we need to add a function\
    \ to deal with the end of the game. Add this code to your RunMan_GameManager class\
    \ next:\n\n```\nvoid EndGame()\n{\n    // stop running\n    isRunning = false;\n\
    \    runSpeed = 0;\n\n    // schedule return to main menu in 4 seconds\n    Invoke(\"\
    ReturnToMenu\", 4f);\n\n    // stop the repeating invoke that awards score\n \
    \   CancelInvoke(\"AddScore\");\n}\n```"
