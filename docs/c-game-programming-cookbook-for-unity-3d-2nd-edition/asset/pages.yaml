  md: "Now, we can start spawning our player prefabs:\n\n```\nfor (int i = 0; i <\
    \ numberOfRacers; i++)\n{\n    Transform _newPlayer = Spawn(_playerPrefabList[0].transform,\
    \ _startPoints[i].position, _startPoints[i].rotation);\n}\n```\n\nThis part of\
    \ the code is going to spawn all the vehicles for the race. Most of what happens\
    \ in this function takes place inside the loop above, which goes from 0 to however\
    \ many players we need to spawn – representing the variable numberOfRacers.\n\n\
    A function named Spawn() is used to deal with the instantiation of our prefabs,\
    \ rather than calling out to Instantiate here. By splitting out spawning into\
    \ its own function, we can easily replace the spawning system with something more\
    \ performance friendly should the game grow to a stage where it might need it\
    \ or if the target platform is limited by performance. If you need to improve\
    \ performance, I would recommend replacing the Instantiate call inside with Spawn()\
    \ function with some kind of pool management, whereby objects are recycled rather\
    \ than destroyed and replaced with new ones.\n\nOur Spawn() function takes a prefab\
    \ (Transform) followed by a Vector3 position and a Quaternion rotation value to\
    \ apply immediately after spawn.\n\nAs we are only ever use one prefab in this\
    \ game, for both AI and users, the _playerPrefabList array only needs to point\
    \ to one prefab. This will be the first item in the array (note that this array\
    \ is set up via the Inspector on this Component in the editor) and we get the\
    \ prefab with _playerPrefabList[0] since Lists always start at position 0. We\
    \ pass in the prefab from _playerPrefabList followed by a startpoint position\
    \ and rotation from the _startPoints List that was populated by a call to GetStartPoints()\
    \ earlier in the code.\n\n```\nRacePlayerController _raceController = _newPlayer.GetComponent<RacePlayerController>();\n\
    ```\n\nAbove, we grab a reference to the newly spawned object's RacePlayerController\
    \ script and, for now, hold it in the locally scoped variable _raceController.\
    \ This will be used throughout the SetupPlayers() function further along.\n\n\
    ```\n_newPlayer.parent = _playerParent;\n```\n\nThe line above is important. We\
    \ need to tell Unity to parent these new GameObjects to something, otherwise they\
    \ will be parented to nothing and disappear into the Unity void! I can only assume\
    \ this is a bug that occurs when you load and merge Scenes together, so to work\
    \ around it we just have to make sure anything made at Start() has a parent set.\n\
    \n```\n// assign the user's ID based on the list from baseUserManager\n_raceController.userID\
    \ = _playerInfo[i].id;\n```\n\nIn order to tie the players in the Scene to the\
    \ players in our player List together, we use an id system. Above, the RacePlayerController\
    \ Component attached to the player we just spawned will have its id value set\
    \ to the same id held by the player from BaseUserManager's player List that we\
    \ are creating the vehicle for."
