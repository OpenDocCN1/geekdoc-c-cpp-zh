    \ to lose a life as soon as they are hit not after reducing a health level first.\n\
    \nAbove, we grab a quick reference The Transform for this player and then use\
    \ GetComponent() to find the BasePlayerCharacterController Component (the script\
    \ that will be handling movement of the player) and store that into a variable\
    \ named _controller so we can access it further down.\n\n```\n```csharp\nvoid\
    \ Update()\n{\n    if (_controller._inputController.Fire())\n        _weaponControl.Fire();\n\
    }\n```\n```\n\nThe BasePlayerCharacterController class has a variable in it named\
    \ _inputController that links to a BaseInputController Component attached to the\
    \ player. BaseInputController provides the input from the user to the movement\
    \ system, but we can also tap into it for other input such as (above) the fire\
    \ button. Here, we access BaseInputController via _controller.inputController\
    \ and check to see if its Fire1 Boolean variable is true. If it is, we can pass\
    \ the message on to the weapon system. We use the ref held in _weaponControl here\
    \ to call StandardSlotWeaponController.Fire()."
