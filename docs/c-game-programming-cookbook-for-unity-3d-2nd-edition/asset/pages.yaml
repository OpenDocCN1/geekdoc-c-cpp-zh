  md: "# 10 AI Manager\n\nThe AI controller in this book is a state machine. You may\
    \ have heard of this before, but do we mean when we say state machine? Our AI\
    \ system stores the current state of the AI and runs code according to whichever\
    \ state it is. When the state changes, it runs different code. For example, when\
    \ our state is set to chase, the AI should move toward an object. When the state\
    \ is set to stopped, the AI should stand still. This is state machine AI.\n\n\
    In this book, the AI is split into several different scripts that fit together\
    \ to add functionality. You can think of our main AI class, BaseAIController,\
    \ as a class containing a set of utility functions for AI rather than a single\
    \ all-encompassing script.\n\n+   1. BaseAIController\n+   This contains base\
    \ code for AI such as chase/follow behavior.\n+   \n+   2. WaypointsController\n\
    +   The code for dealing with waypoints: this is optional, depending on whether\
    \ you want waypoint following.\n+   \n+   3. AIBotController\n+   Using BaseAIController,\
    \ this class can move a bot around, chase, and attack a target and stand on guard\
    \ to look for a target to chase and attack. This is used by the Blaster game example\
    \ in this book to move the bots around.\n+   \n+   4. AISteeringController\n+\
    \   This uses the BaseAIController and WaypointsController to provide steering\
    \ inputs that will follow a waypoint path (used in the example racing game in\
    \ this book to drive the AI cars around the track).\n\nWe will be looking at the\
    \ above scripts and breaking them down in this chapter, as well as a method for\
    \ getting the weapon system firing with AI.\nNote that this AI system is only\
    \ intended for 3D games."
  merge: -1
  img_proc: true
