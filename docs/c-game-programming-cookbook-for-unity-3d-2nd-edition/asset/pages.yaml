- pgno: 67
  md: "# # 3 Building the Core Game Framework\n\nThis chapter will give context to\
    \ the design decisions made in the core framework as well as providing a good\
    \ base for understanding how the individual code recipes work together and why\
    \ they may sometimes have dependencies on other Components.\n\nThe framework for\
    \ this book (as seen in Figure 3.1) features six main areas:\n\n+   1. Game Manager\
    \  \n+      The Game Manager acts like a central communication script for all\
    \ parts of the game and oversees game state.\n+   2. Players  \n+      Players\
    \ may already be present in the game scene or instantiated by the Game Manager.\
    \ The players structure will be explored later in Chapter 4 of this book.\n+ \
    \  3. AI and enemies  \n+      As with players, AI controlled characters, or enemies\
    \ may already be present in the scene at load time or created at runtime. We look\
    \ at AI in full in Chapter 10.\n+   4. UI Manager  \n+      The UI Manager draws\
    \ all the main in game user interface elements, such as score display, and lives.\
    \ We look at UI in Chapter 11.\n+   5. Sound Manager  \n+      The Sound Manager\
    \ handles sound playback. Sound is in Chapter 9."
  merge: -1
  img_proc: true
- pgno: 68
  md: '![](img/e4b578cd512539e7261e070d87b6550a_68_0.png)


    Figure 3.1 Diagram of the game framework.


    To maximize flexibility, the base classes need to be able to accommodate different
    configurations. For example, a player controller should allow for input to be
    passed in from another script so that control systems can easily be switched out
    if we want to use, say, a controller vs. keyboard controls. The player script
    does not need to know where the input is coming from, but it needs to provide
    a common interface for an input script to communicate with. Just as a common interface
    is used to communicate with the player controller, it should not matter to the
    player controller as to where the input comes from.


    # 3.1 Controllers and Managers


    In this book, there are two terms I use to specify types of main classes; those
    are Controllers and Managers.


    # 3.1.1 Managers


    Managers are used in this book as a term to represent a script that specifically
    manages objects or data (dealing with players, audio or other game elements in
    a similar way to how a manager might manage staff in a company). For example,
    it could be a GlobalRaceManager class used to track and get information from a
    set of RaceController script Components attached to racing vehicles. The manager
    script uses information from the RaceController Components to calculate race positions
    of players as well as informing players as to the game''s current running state,
    managing overall race logic.


    # 3.1.2 Controllers


    Controllers specialize in specific tasks such as helping scripts communicate with
    each other, holding game-specific player information or dealing with session data.
    For example, the players in this book have a player controller script. Enemies
    have an enemy controller. Controllers can be independent of other scripts or managed
    by manager scripts, depending on what it is they need to do.


    # 3.2 Core Framework Scripts


    There are several scripts in the Scripts/BASE folder that are intended to act
    as templates, or as classes to derive from, in your own games. In this section
    of the book we will be looking at the scripts that go to make up the main framework.'
  merge: -1
  img_proc: true
- pgno: 69
  md: 'Core framework classes in the BASE folder that will be covered in this chapter
    are:


    +   - 3.2.1. BaseGameManager

    +   - 3.2.2. ExtendedCustomMonoBehaviour

    +   - 3.2.3. BaseCameraController


    Other base scripts will be covered in specific parts of this book. For example,
    the scripts found in the GPC_Framework/BASE/PLAYER are covered in Chapter 4 when
    we look at the player structure.


    # 3.2.1 BaseGameManager


    The Game Manager is the core of gameplay, where overall game functions are described
    and dealt with and where current game state is held.


    Core functions of the Game Manager are:


    +   1. Tracking game state:

    +      a. Storage of the game state

    +      b. Providing functions for changing game state

    +      c. Changing the game state based on calls to functions such as EndGame(),
    StartGame(), or PauseGame()

    +   2. Creating player(s)

    +   3. Camera set up and specifics such as telling the camera what to follow

    +   4. Communicating between session manager, user manager, and game actions

    +   5. Any communications between scripts that we would like to keep as standalone
    and not have to recode to talk directly to each other


    Keeping track of game state is important, as some elements will need to change
    their behavior. If the game is paused, for example, we may want to suspend all
    input, freeze game time, and show a pop up. When the game ends, we will need to
    disable player input and so on. Tracking game states is the job of the Game Manager
    script.


    A typical game may have several different core states, such as:


    +   1. Game running

    +   2. Game paused

    +   3. Loading

    +   4. Game ended


    There may also be several custom states, such as a state for showing a cutscene
    or perhaps a state for playing a special audio clip. I recommend creating a new'
