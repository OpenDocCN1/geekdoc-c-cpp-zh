    \ WaypointsController _waypointsController;\npublic Transform _currentWaypointTransform;\n\
    public Transform _shouldFollowTarget;\npublic Transform _rotateTransform;\n\n\
    [System.NonSerialized]\npublic bool reachedLastWaypoint;\npublic float waypointDistance\
    \ = 5f;\npublic float pathSmoothing = 2f;\npublic bool pathShouldReversePathFollowing;\n\
    public bool loopPath;\npublic bool destroyAtEndOfWaypoints;\npublic bool startAtFirstWaypoint;\n\
    \n[Header(\"Layer masks and raycasting\")]\npublic LayerMask obstacleAvoidLayers;\n\
    public string potentialTargetTag = \"Player\";\npublic LayerMask targetLayer;\n\
    public int obstacleFinderResult;\n\nprivate int totalWaypoints;\nprivate int currentWaypointNum;\n\
    private RaycastHit hit;\nprivate Vector3 tempDirVec;\nprivate Vector3 relativeTarget;\n\
    private float obstacleAngle;\nprivate int obstacleHitType;\npublic int lookAheadWaypoints\
    \ = 0;\n```\n\nThere are a lot of variables to declare, so don't worry about those.\
    \ We will see how they are used later in the breakdown. Other than ExtendedCustomMonoBehaviour,\
    \ this script only uses one more script from the framework in this book – the\
    \ WaypointsController class for using waypoints. Everything else is standalone\
    \ and ready to be used in your projects regardless of whether you use the framework.\n\
    \nOnce we get past the class declaration, we kick things off with a Start() function:\n\
    \n```\npublic virtual void Start()\n{\n    Init();\n}\n```\n\nThe Init() function\
    \ takes care of making cached references to the GameObject, the Transform and\
    \ its Rigidbody (this script assumes that there will always be a Rigidbody attached\
    \ to the same GameObject it is attached to as a Component):\n\n```\npublic virtual\
    \ void Init ()\n{\n    // cache ref to gameObject\n    _GO = GetComponent<GameObject>();\n\
    \    // cache ref to transform\n    _TR = GetComponent<Transform>();\n    // cache\
    \ a ref to our rigidbody\n    _RB = _TR.GetComponent<Rigidbody>();\n}\n```\n\n\
    Above, Init() grabs references to other objects we will be needing further in\
    \ the script.\n\n```\nif( rotateTransform==null )\n    _rotateTransform= _TR;\n\
    ```"
