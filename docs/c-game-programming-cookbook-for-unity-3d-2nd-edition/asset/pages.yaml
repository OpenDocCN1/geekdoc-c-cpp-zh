- pgno: 157
  md: "Next, the OnDrawGizmos() function. If you have never dealt with Gizmos before,\
    \ they are helper objects to make editing and/or visualization easier. Unity relies\
    \ quite heavily on Gizmos for the editor and how you interact with it as well\
    \ as providing a nice interface for you to build your own custom types.\n\nAll\
    \ Gizmo drawing needs to be done in one of two functions (called automatically\
    \ by the engine):\n\n| OnDrawGizmos | Called every frame. All Gizmos are pickable.\
    \ |\n| OnDrawGizmosSelected | Called only when the object with the script attached\
    \ is selected. |\n\nThe OnDrawGizmos() function is a runtime class (called automatically\
    \ by the game engine) where we can draw our own Gizmos and do some editor-based\
    \ manipulation. In this case, the OnDrawGizmos function of WaypointsController\
    \ will render waypoint positions and draw lines between each one so that we have\
    \ a simple visual representation of the path.\n\n```\nvoid OnDrawGizmos()\n{\n\
    \    GetTransforms();\n    if (totalTransforms < 2)\n        return;\n}\n```\n\
    \nAt the start of the function, we call GetTransforms() to make sure that the\
    \ information stored about all of the Transforms that make up our path are up\
    \ to date (in case they have been moved or new ones added).\n\nWhen you first\
    \ build a path, obviously it will start with a single waypoint. With only one\
    \ point, there is no end point for rendering a line to, so this function checks\
    \ that there are enough waypoints to draw a line and drops out if the totalTransforms\
    \ count is less than 2.\n\n```\nTransform _tempTR = (Transform) _transforms[0];\n\
    lastPos = _tempTR.position;\n```\n\nAbove, we grab the first waypoint transform\
    \ from the _transforms List, at index 0, and store it in _tempTR. We do this so\
    \ that we have a starting point for drawing the lines that represent the path\
    \ in the editor.\n\nlastPos will act as the starting point for the next line,\
    \ so at this stage we just need it to have a value:\n\n```\nfirstPoint = _tempTR.position;\n\
    lastPoint = firstPoint;\n_pointT = (Transform)_transforms[0];\n\nfor (int i =\
    \ 1; i < totalTransforms; i++)\n{\n    _tempTR = (Transform)_transforms[i];\n\
    \    if (_tempTR == null)\n    {\n        GetTransforms();\n        return;\n\
    \    }\n\n    // grab the current waypoint position\n    currentPoint = _tempTR.position;\n\
    }\n```\n\nHaving all the Gizmos, lines, and editor helper graphics the same colors\
    \ would make life harder. For that reason, Unity provides the Gizmos.color function\
    \ to set their colors. It takes just one call to Gizmos.color (passing in a Color\
    \ object) and everything after that point will be rendered using it.\n\n```\n\
    Gizmos.color=Color.green;\n```"
  merge: -1
  img_proc: true
