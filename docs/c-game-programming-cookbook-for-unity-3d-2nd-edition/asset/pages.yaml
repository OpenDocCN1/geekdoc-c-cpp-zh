  md: "parameters; a String to convert followed by the index number of the character\
    \ you want to convert.\n\nWith a converted value in the local variable val, we\
    \ check that it is greater than -1 and less than _weapons.Length to be sure that\
    \ the number coming in is valid for weapon selection. If it is, we pass the value\
