- pgno: 123
  md: "Above, moveDirection will be used to move the player around. Its value comes\
    \ from an interpolation between the current value of moveDirection and the targetDirection\
    \ calculated earlier from the user inputs. This vector is then multiplied by rotateSpeed\
    \ then converted into radians and again multiplied by Time.deltaTime to make the\
    \ rotation time based. Vector3.RotateTowards is used to make the turn, which ensures\
    \ that the rotation ends in the exact specified position.\n\nThe moveDirection\
    \ vector is then normalized, to remove any magnitude from the equation.\n\nThe\
    \ next part of the BasePlayerCharacterController class deals with speed:\n\n```\n\
    // Smooth the speed based on the current target\ndirection curSmooth= speedSmoothing\
    \ * Time.deltaTime;\n```\n\nThe variable curSmooth will be used further in the\
    \ script, to decide how long it takes for the movement speed of the player to\
    \ go from zero to max speed.\n\n```\n// Choose target speed\n// We want to support\
    \ analog input but make sure you can't walk faster diagonally than just forward\
    \ or sideways\ntargetSpeed= Mathf.Min(targetDirection.magnitude, 1.0f);\n```\n\
    \nThe variable targetSpeed is capped to a maximum of 1. To do this, Mathf.Min\
    \ is fed the magnitude of the targetDirection and 1. Whichever is least will go\
    \ into targetSpeed.\n\nThis script allows for two states of movement; running\
    \ and walking. The transition between running and walking is timed – the character\
    \ will begin walking and continue walking until vertical input is applied for\
    \ more than (in seconds) the value of runAfterSeconds.\n\n```\nif (Time.time -\
    \ runAfterSeconds > walkTimeStart)\n{\n    targetSpeed *= runSpeed;\n}\nelse\n\
    {\n    targetSpeed *= walkSpeed;\n}\nmoveSpeed = Mathf.Lerp(moveSpeed, targetSpeed,\
    \ curSmooth);\n// Reset walk time start when we slow down\nif (moveSpeed < walkSpeed\
    \ * 0.3f)\n    walkTimeStart = Time.time;\n```\n\nTime.time is used above to keep\
    \ track of how long the player has been walking, which means that Time.timeScale\
    \ will affect it (if the game is paused or time is scaled, this timing will remain\
    \ relative to the time scale).\n\nwalkSpeed is a multiplier for the targetSpeed\
    \ when the player is in its walking state:"
