  md: "functionality. In this section, we look at building a script to derive from\
    \ BaseWeaponController and look for presses on the number keys 1 to 9 to choose\
    \ the currently selected weapon. You can see this script in action in the Blaster\
    \ game example from Chapter 15.\n\n```\nusing UnityEngine;\nnamespace GPC\n{\n\
    \    [AddComponentMenu(\"CSsharpBookCode/Common/Weapons/Standard Slot Controller\"\
    )]\n    public class StandardSlotWeaponController : BaseWeaponController\n   \
    \ {\n        public bool allowWeaponSwitchKeys = true;\n```\n\nAbove, our new\
    \ script derives from BaseWeaponController. We include a Boolean variable, allowWeaponSwitchKeys,\
    \ for toggling weapon switching on or off.\n\n```\npublic void Update()\n{\n \
    \   if (!allowWeaponSwitchKeys)\n        return;\n\n    // do weapon selection\
    \ / switching slots\n    // ----------------------------------------\n    if (Input.GetKey(KeyCode.Less))\n\
    \        PrevWeaponSlot(true);\n    else if (Input.GetKey(KeyCode.Greater))\n\
    \        NextWeaponSlot(true);\n}\n```\n\nUpdate() starts with a quick to check\
    \ to see if weapon switching is allowed, dropping out if it is not. Next, when\
    \ the greater than or less than keys are pressed, we call either PrevWeaponSlot()\
    \ or NextWeaponSlot() to switch weapons.\n\n```\n// keys 1-9\nstring theKey =\
    \ Input.inputString;\nif (theKey == \"\")\n    return;\n```\n\nInput.inputString\
    \ provides us with a string containing the most recent key pressed on the keyboard.\
    \ Above, we store the value of Input.inputString in theKey and then check it to\
    \ see whether it is empty. If the string is empty, no key has been pressed so\
    \ we drop out.\n\n```\nvar val = (Char.ConvertToUtf32(theKey, 0)-49);\nif(val>-1\
    \ && val < weapons.Length)\n    SetWeaponSlot(val);\n    }\n}\n```\n\nRather than\
    \ checking input for every key from 1 to 9, we take the string theKey and convert\
    \ it into a number. Char.ConvertToUtf32 will convert a string into a Unicode code.\
    \ The numbers 1-9 are represented by the numbers 49 to 58. If we take the code\
    \ from Char.ConvertToUtf32 and subtract 49 from it, we get a number between 0\
    \ and 9 – perfect numbers to pass into the SetWeaponSlot() function for choosing\
    \ which weapon slot to use. Char.ConvertToUtf32 takes two"
  merge: -1
