- pgno: 131
  md: "Just using the wheels to steer the car is sometimes enough, but if you are\
    \ working on something more arcade you will probably need to apply some extra\
    \ turning force to get the car to feel less realistic and more fun. The turnHelp\
    \ Boolean variable can be set on or off in the Inspector and you can adjust the\
    \ turnHelpAmount to get a cool effect.\n\nIn the code above, Unity's AddTorque\
    \ function is used to multiply an up vector by steer, turnHelpAmount and the rigidbody's\
    \ mass. In the example racing game for this book, a turnHelpAmount of 2 is a good\
    \ value for arcade physics.\n\nNext up, we apply regular (forward) values to the\
    \ WheelColliders:\n\n```\n// apply regular movement values to the wheels\nrearWheelLeft.motorTorque\
    \ = accelMax * motor;\nrearWheelRight.motorTorque = accelMax * motor;\nrearWheelLeft.brakeTorque\
    \ = brakeMax * brake;\nrearWheelRight.brakeTorque = brakeMax * brake;\nfrontWheelLeft.steerAngle\
    \ = steerMax * steer;\nfrontWheelRight.steerAngle = steerMax * steer;\n}\n```\n\
    \nAbove, we tell the WheelColliders how to move. The motor, brake and steer values\
    \ will be set by the GetInput() function later in this script.\n\n```\npublic\
    \ void DoFakeBrake()\n{\n    if (isGrounded && brake > 0 && fakeBrake && mySpeed\
    \ > 0)\n    {\n        tempVEC = _RB.velocity;\n        tempVEC.x = tempVEC.x\
    \ * fakeBrakeDivider;\n        tempVEC.z = tempVEC.z * fakeBrakeDivider;\n   \
    \     _RB.velocity = tempVEC;\n    }\n}\n```\n\nBraking with WheelColliders relies\
    \ on friction and the wheels relationship to the ground below them. The main issue\
    \ with this is – without a lot of work – traction is easily lost, and it can be\
    \ hard to get the vehicle to stop. Even more so if you are trying to make an arcade\
    \ racer rather than a realistic simulation. To get around that, this script includes\
    \ the DoFakeBrake() function above, which reduces the vehicles velocity values\
    \ to slow down the vehicle faster. To adjust the effect, you can change the value\
    \ of fakeBrakeDivider in the Inspector on the GameObject, or you can turn it on\
    \ or off with the setting of the fakeBrake Boolean.\n\nThis enhanced braking system\
    \ will only be applied when the vehicle is on the ground, so it relies on the\
    \ isGrounded Boolean set by the CheckGround() function coming up next:\n\n```\n\
    public void CheckGround()\n{\n    bool FLGrounded = false;\n    bool FRGrounded\
    \ = false;\n    bool RLGrounded = false;\n    bool RRGrounded = false;\n\n   \
    \ if (Physics.Raycast(transform.position, Vector3.down, wheelToGroundCheckHeight))\n\
    \        FLGrounded = true;\n```"
  merge: -1
  img_proc: true
- pgno: 132
  md: "```\nif (Physics.Raycast(_frontWheelRight.\ntransform.position, Vector3.down,\
    \ wheelToGroundCheckHeight))\n    FRGrounded = true;\n\nif (Physics.Raycast(_rearWheelLeft.transform.\n\
    position, Vector3.down, wheelToGroundCheckHeight))\n    RLGrounded = true;\n\n\
    if (Physics.Raycast(_rearWheelRight.\ntransform.position, Vector3.down, wheelToGroundCheckHeight))\n\
    \    RRGrounded = true;\n\nif (FLGrounded && FRGrounded && RLGrounded &&\nRRGrounded)\n\
    {\n    isGrounded = true;\n}\nelse\n{\n    isGrounded = false;\n}\n```\n\nWhen\
    \ wheels are off the ground, our enhanced braking and turn helper code needs to\
    \ be disabled to avoid steering or braking in mid-air. To detect the ground, the\
    \ function above uses Unity's Raycasting function to cast a ray straight down\
    \ from the center of each WheelCollider. A raycast distance value is used, held\
    \ in the float WheelToGroundCheckHeight. Individual Boolean flags are set for\
    \ each wheel's grounded state. Those flags are checked at the end of the function\
    \ to see if all of them are true – if so, we know that all four wheels are on\
    \ the ground so isGrounded gets set to true. Otherwise, isGrounded is set to false.\n\
    \n```\npublic void CheckLock()\n{\n    if (isLocked)\n    {\n        // control\
    \ is locked out and we should be stopped\n        steer = 0;\n        brake =\
    \ 0;\n        motor = 0;\n        // hold our rigidbody in place (but allow the\
    \ Y to move\n        so the car may drop to the ground if it is not exactly matched\
    \ to\n        the terrain)\n        Vector3 tempVEC = myBody.velocity;\n     \
    \   tempVEC.x = 0;\n        tempVEC.z = 0;\n        myBody.velocity = tempVEC;\n\
    \    }\n}\n```\n\nThe CheckLock() function, above, looks to see if the Boolean\
    \ variable isLocked is set to true, then when it is freezes all inputs to zero\
    \ and zeroes x and z velocities of the vehicle's rigidbody. The y velocity is\
    \ left as is, so that gravity will still apply to the vehicle when it is being\
    \ held in place. This is important at the start of a race when the vehicle is\
    \ being held until the 3,2,1 counting in finishes. If the velocity along the y-axis\
    \ were zeroed too, the car would float just above its resting place against the\
    \ ground until the race started when it would drop down some as gravity is applied.\n\
    \nsteer, motor and brake are the main float variables used for applying to the\
    \ vehicle to move it around. The function below, GetInput() gets values from the\
    \ inputs set by the default input system:"
