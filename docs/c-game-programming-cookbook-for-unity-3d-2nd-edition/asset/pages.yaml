- pgno: 122
  md: "Above, before getting input from the user we make sure that canControl is true\
    \ – meaning the user can control it – and drop out if this is not the case. Input\
    \ scripts in this book will return values in the correct range so all we need\
    \ to do is call the functions to return the input values into horz and vert.\n\
    \n```\npublic virtual void LateUpdate()\n{\n    if(canControl)\n        GetInput();\n\
    }\n```\n\nLateUpdate() is used to call for an update to the input Boolean variables\
    \ via the GetInput() script. Unity advises that LateUpdate as the best place to\
    \ check for keyboard entry, after the engine has carried out its own input updates.\n\
    \n```\nvoid UpdateSmoothedMovementDirection()\n{\n    if(moveDirectionally)\n\
    \        UpdateDirectionalMovement();\n    else\n        UpdateRotationMovement();\n\
    }\n```\n\nThis script can function both to move directionally as well as rotationally,\
    \ by setting moveDirectionally to true or false. Whenever moveDirectionally is\
    \ set to false, pressing the left or right buttons will rotate the player left\
    \ or right around its y axis. Pressing the up button will walk forwards along\
    \ the player's z-axis and pressing down will move it backwards.\n\nIn the UpdateSmoothedMovementDirection()\
    \ script, the moveDirectionally variable is checked to determine which type of\
    \ movement function to call to update player movement:\n\nThe types of movement\
    \ are split into two separate functions, which are called above depending on the\
    \ state of moveDirectionally.\n\n```\nvoid UpdateDirectionalMovement()\n{\n  \
    \  // find target direction\n    targetDirection = horz * Vector3.right;\n   \
    \ targetDirection += vert * Vector3.forward;\n}\n```\n\nDirectional movement uses\
    \ the world x and z axis to decide which way to move; that is, the player moves\
    \ along the world x or z axis based on the button pressed by the player. Above,\
    \ the UpdateDirectionalMovement() function starts by taking the horizontal and\
    \ vertical user inputs (from the variables horz and vert) and multiplying them\
    \ by either a vector that points along the axis that we want horz or vert to affect.\
    \ The targetDirection variable is a Vector3 that encompasses both vertical and\
    \ horizontal movement into a single vector representing the direction our player\
    \ will move in.\n\nThe targetDirection variable will be zero when there is no\
    \ user input, so before calculating any movement amounts, we check that movement\
    \ is intended first:\n\n```\nif (targetDirection != Vector3.zero)\n{\n    moveDirection\
    \ =\n    Vector3.RotateTowards(moveDirection, targetDirection, rotateSpeed\n \
    \   * Mathf.Deg2Rad * Time.deltaTime, 1000);\n        moveDirection = moveDirection.normalized;\n\
    }\n```"
