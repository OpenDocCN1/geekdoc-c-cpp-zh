  md: "# 14.2 Main Menu Scene Overview\n\nThe main menu is made from the template\
    \ main menu found in the GPC_Framework/TemplateScenes folder.\n\nA RaceMainMenu.cs\
    \ script, derived from the framework's MenuWithProfiles class from Chapter 12,\
    \ loads the level select Scene and adds players to the game, when the start button\
    \ is pressed. RaceMainMenu.cs:\n\n```\n```csharp\nusing GPC;\npublic class RaceMainMenu\
    \ : MenuWithProfiles\n{\n    public override void LoadGameScene()\n    {\n   \
    \     AddPlayers();\n        base.LoadGameScene();\n    }\n\n    void AddPlayers()\n\
    \    {\n        BaseUserManager _baseUserManager =\nGetComponent<BaseUserManager>();\n\
    \        _baseUserManager.ResetUsers();\n        // there's no players set up\
    \ so add default ones\n        for (int i = 0; i < 4; i++)\n        {\n      \
    \      int playerID = _baseUserManager.\nAddNewPlayer();\n            if (i ==\
    \ 0)\n                _baseUserManager.SetType(playerID,\n0);\n            else\n\
    \                _baseUserManager.SetType(playerID,\n2);\n        }\n    }\n}\n\
    ```\n```\n\n# 14.3 Level Select Scene Overview\n\nThe level select screen has\
    \ three buttons, one for each level, and a back button. Events on the buttons\
    \ point to a script Component named RaceLevelSelect, which is attached to a GameObject\
    \ named LevelMenu. RaceLevelSelect uses LevelVars (see Chapter 13, Section 13.2,\
    \ for more on this) to set the filenames and current level number for our Scene\
    \ loader to use. It can then either load the Scene loader Scene or go back to\
    \ the main menu in its BackToMenu() function.\n\nRaceLevelSelect.cs looks like\
    \ this:\n\n```\n```csharp\nusing UnityEngine;\nusing UnityEngine.SceneManagement;\n\
    using GPC;\n\npublic class RaceLevelSelect : MonoBehaviour\n{\n    public void\
    \ LoadLevel(int whichLevel)\n    {\n        LevelVars.currentLevel = whichLevel;\n\
    \        LevelVars.levelNamePrefix = \"race_level_\";\n        LevelVars.coreSceneName\
    \ = \"race_core\";\n    }\n}\n```\n```"
