    public override void Init()\n{\n    base.Init();\n    SetHealth(1);\n\n    _TR\
    \ = transform;\n    _controller = GetComponent<BasePlayerCharacterController>();\n\
    }\n```\n```\n\nWe call base.Init() to run the Init() function of BasePlayerStatsController,\
    \ the class this one derives from, so that the player data is set up and ready\
