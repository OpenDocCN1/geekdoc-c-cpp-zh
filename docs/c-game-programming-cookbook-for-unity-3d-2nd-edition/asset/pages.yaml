    \ need to extend this further or manually set which menu should display next.\n\
    \nIn LastCanvas(), notice that it is not using a coroutine this time, but instead\
    \ a function named TimedSwitchCanvas() that will coordinate the timing to switch\
    \ Canvases. TimedSwitchCanvas takes two array index values – the first, the Canvas\
    \ to hide and the second value is the Canvas to show. TimedSwitchCanvas() will\
    \ carry out a fade out, a pause (specified by WaitBetweenFadeTime variable, accessible\
    \ via the Inspector) and then fade in the new Canvas. This means to fade out a\
    \ UI Canvas and to fade in another one, we can use TimedSwitchCanvas() without\
    \ having to deal with the timing between fades.\n\nThe FadeIn() and FadeOut()\
    \ functions are next:\n\n```\n```csharp\npublic void FadeOut(float timeVal)\n\
    {\n    StartCoroutine(FadeCanvasIn(FadeCanvasGroup, timeVal));\n}\n\npublic void\
    \ FadeIn(float timeVal)\n{\n    StartCoroutine(FadeCanvasOut(FadeCanvasGroup,\
    \ timeVal));\n}\n```\n```\n\nFadeIn() and FadeOut() use the FadeCanvasIn and FadeCanvasOut\
    \ coroutines to fade in or out a specific Canvas – the reference to which is held\
    \ in the variable FadeCanvasGroup. As mentioned earlier in this section, CanvasManager\
    \ provides a method for easily fading a Scene in or out using the above code.\n\
    \nWhen a Scene first loads, the fade Canvas needs to cover the screen for a fade\
    \ out effect to work, so we also need functions to snap the fade Canvas on or\
    \ off as needed:\n\n```\n```csharp\npublic void FaderOn()\n{\n    FadeCanvasGroup.alpha\
    \ = 1;\n}\n```\n```"
