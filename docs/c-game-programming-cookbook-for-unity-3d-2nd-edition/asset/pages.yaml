- pgno: 117
  md: "```\n```csharp\naMinute = aMinute % 60;\n// grab seconds\naSecond = (int)currentTime\
    \ % 60;\n\n// grab milliseconds\naMillis = (int)(currentTime * 100) % 100;\n```\n\
    ```\n\nAfter minutes, seconds, and milliseconds values have been calculated and\
    \ stored in the integer variables aMinute, aSecond, and aMillis, three new strings\
    \ called seconds, minutes and mills are built from them:\n\n```\n```csharp\n//\
    \ format strings for individual mm/ss/mills\ntmp = (int)aSecond;\nseconds = tmp.ToString(\"\
    D2\"); // ToString()\n```\n```\n\nformats ... in this case, D followed by how\
    \ many numbers\n\n```\n```csharp\ntmp = (int)aMinute;\nminutes = tmp.ToString(\"\
    D2\");\n\ntmp = (int)aHour;\nhour = tmp.ToString(\"D2\");\n\ntmp = (int)aMillis;\n\
    mills = tmp.ToString(\"D2\");\n```\n```\n\n```\n```csharp\n// pull together a\
    \ formatted string to return\ntimeString = minutes + \":\" + seconds + \":\" +\n\
    mills;\n```\n```\n\nIn C#, you can convert numbers to strings with the ToString()\
    \ function.\nSomething great about ToString() is that you can also pass in a format\
    \ string. The\nformat string takes the form of a letter followed by an integer\
    \ number. Above, we\nuse the format string D2 to tell ToString() to use two digits,\
    \ which will convert\nour times into a neat format ready to display. Note that\
    \ you can set as many digits\nas you like, simply by changing the number in the\
    \ format string. For more infor-\nmation on format strings, you can find a full\
    \ breakdown and a full list of all of the\navailable formatting options online\
    \ at Microsoft's .NET Standard numeric for-\nmat strings page: https://docs.microsoft.com/en-us/dotnet/standard/base-types/\n\
    standard-numeric-format-strings\n\nOnce the individual parts of the formatted\
    \ time string are ready, we put them\nall together into a final timeString and\
    \ return it at the end of the function, like this:\n\n```\n```csharp\n// pull\
    \ together a formatted string to return\ntimeString=minutes+\":\"+seconds+\":\"\
    +mills;\n\nreturn timeString;\n}\n```\n```\n\nAt the very end of the script, a\
    \ GetTime() function provides a way for other\nscripts to process the value of\
    \ currentTime:\n\n```\n```csharp\npublic int GetTime ()\n{\n    // remember to\
    \ call UpdateTimer() before trying to\nuse this function, otherwise the time value\
    \ will\n    // not be up to date\n    return (int)currentTime;\n}\n```\n```"
