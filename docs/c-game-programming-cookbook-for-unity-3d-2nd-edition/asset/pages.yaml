    }\n```\n```\n\nAbove, moveDirection is a Vector3 used later in the script to tell\
    \ the character controller which direction to move in. Here in the Init() function,\
    \ it is given the world forward vector as its default value.\n\nInit() then calls\
    \ GetComponents(), which is a function in ExtendedCustomMonoBehaviour.cs (which\
