- pgno: 130
  md: "```\n// work out a flat velocity\nvelo = _RB.velocity;\nvelo = transform.InverseTransformDirection(_RB.velocity);\n\
    \n// work out our current forward speed\nmySpeed = velo.z;\n```\n\nAbove, the\
    \ variable velo is set to hold the velocity of our vehicle rigidbody. The next\
    \ line converts that velocity to local coordinate space, so that we get values\
    \ for how fast the vehicle is moving along each of its axis. Our vehicle's forward\
    \ speed is along the z axis and sideways along the x. We take that z axis velocity\
    \ and put into the variable mySpeed so that we know how fast our vehicle is moving,\
    \ mySpeed is used the next section, where we simulate a reverse gear when the\
    \ vehicle is moving below an arbitrary speed:\n\n```\n// if we're moving slow,\
    \ we reverse motorTorque and remove brakeTorque so that the car will reverse\n\
    if( mySpeed<2 )\n{\n    // that is, if we're pressing down the brake key\n   \
    \ (making brake>0)\n    if( brake>0 )\n    {\n        rearWheelLeft.motorTorque\
    \ = -brakeMax * brake;\n        rearWheelRight.motorTorque = -brakeMax * brake;\n\
    \    }\n```\n\nAbove, bear in mind that this section of code is to simulate a\
    \ reverse gear. mySpeed is checked to see if its value is less than 2. When the\
    \ speed is this slow and the brake key is held down, brakeTorque is no longer\
    \ applied to the wheels and instead of brake torque, a reverse amount of the maximum\
    \ amount of brake torque (brakeMax) is applied to make the vehicle move backwards.\n\
    \n```\nrearWheelLeft.brakeTorque = 0;\nrearWheelRight.brakeTorque = 0;\n```\n\n\
    In reverse mode, zero brakeTorque will be applied (by the code above) to the WheelColliders\
    \ so that the vehicle is free to move backward. Although braking is dealt with\
    \ above, we deal with the reverse motor further in the script.\n\n```\nfrontWheelLeft.steerAngle\
    \ = steerMax * steer;\nfrontWheelRight.steerAngle = steerMax * steer;\n```\n\n\
    When the vehicle is reversing, steering is applied in reverse too, just like a\
    \ real car.\n\n```\n// drop out of this function before applying the\n'regular'\
    \ non-reversed values to the wheels\nreturn;\n}\n```\n\nIf reverse conditions\
    \ have been applied to the WheelColliders, this function drops out before the\
    \ regular (forward) values are applied.\n\n```\nif (turnHelp)\n    _RB.AddTorque(Vector3.up\
    \ * steer * turnHelpAmount * _RB.mass);\n```"
