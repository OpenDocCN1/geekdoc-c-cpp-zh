- pgno: 21
  md: "# ### 1.1.1.5 Private Static\n\nA private static variable is accessible only\
    \ to any other instances of the *same type of class*. Other types of class will\
    \ not be able to access it.\n\nAs an example, imagine all players need to have\
    \ a unique number when they are first spawned into the game. The player class\
    \ declares a variable named uniqueNum like this:\n\n```\n```csharp\nPrivate static\
    \ int uniqueNum;\n```\n```\n\nWhen a player script is first created, it uses the\
    \ value of uniqueNum for itself and increases uniqueNum by one:\n\n```\n```csharp\n\
    myUniqueNum = uniqueNum;\nuniqueNum++;\n```\n```\n\nThe value of uniqueNum will\
    \ be shared across all player scripts. The next player to be spawned will run\
    \ the same start up function, getting uniqueNum again - only this time it has\
    \ been increased by one, thanks to the player spawned earlier. This player again\
    \ gets its own unique number and increases the static variable ready for the next\
    \ one.\n\n# ### 1.1.2 The Singleton\n\nA *singleton* is a commonly used method\
    \ for allowing access to an instance of a class, accessible to all other scripts.\
    \ This pattern is ideal for code that needs to communicate with the entire game,\
    \ such as a Game Manager.\n\n# #### 1.1.2.1 Using the Singleton in Unity\n\nThe\
    \ most straightforward way to achieve singleton-like behavior is to use a static\
    \ variable and, when Unity calls the Awake() function, set the instance variable\
    \ to become a reference to the script instance it represents. The keyword 'this'\
    \ refers to the instance of the script it is a part of.\n\nFor example:\n\n```\n\
    ```csharp\npublic class MyScript : Monobehaviour\n{\n    private static MySingleton\
    \ instance;\n    void Awake()\n    {\n        if (instance != null)\n        \
    \    Destroy(this);\n        instance = this;\n    }\n}\n```\n```\n\nThe singleton\
    \ instance of our script can be accessed anywhere, by practically any script,\
    \ with the following syntax:\n\n```\n```csharp\nMySingleton.Instance.SomeFunctionInTheSingleton();\n\
    ```\n```\n\n# ### 1.1.3 Inheritance\n\n*Inheritance* is a complex concept, which\
    \ calls for some explanation here because of its key role within the scripts provided\
    \ by this book. Have a read through this section but don't worry if you don't\
    \ pick up inheritance right away. Once we get to the programming it will probably\
    \ become clearer."
  merge: -1
  img_proc: true
- pgno: 22
  md: "The bottom line is that inheritance is used in programming to describe a method\
    \ of providing template scripts that may be overridden, or added to, by other\
    \ scripts. As a metaphor, imagine a car. All cars have four wheels and an engine.\
    \ The types of wheels may vary from car to car, as will the engine, so when we\
    \ say 'this is a car' and try to describe how our car behaves; we may also describe\
    \ the engine and wheels.\n\nThese relationships may be shown in a hierarchical\
    \ order:\n\n+   - Car\n+     - Wheels\n+     - Engine\n\nNow try to picture this\
    \ as a C# script:\n\n+   - Car class.\n+   - Wheels function\n+   - Engine function\n\
    \nIf we were building a game with lots of cars in it, having to rewrite the car\
    \ class for each type of car would be silly. A far more efficient method might\
    \ be to write a base class and populate it with virtual functions. When we need\
    \ to create a car, rather than use this base class, we build a new class, which\
    \ inherits the base class. Because our new class is inherited, it is optional\
    \ whether we choose to override wheels or engine functions to make them behave\
    \ in ways specific to our new class. That is, we can build 'default' functions\
    \ into the base class and if we only need to use a default behavior for an engine,\
    \ our new class doesn't need to override the engine function.\n\nA base class\
    \ might look something like this:\n\n```\npublic class BaseCar : MonoBehaviour\
    \ {\n    public virtual void Engine () {\n        Debug.Log(\"Vroom\");\n    }\n\
    \    public virtual void Wheels () {\n        Debug.Log(\"Four wheels\");\n  \
    \  }\n}\n```\n\nThere are two key things to notice in the above script. One is\
    \ the class declaration itself and the fact that this class derives from MonoBehaviour.\
    \ MonoBehaviour is itself a class - the Unity documentation describes it as \"\
    the base class every script derives from\" - this MonoBehaviour class contains\
    \ many engine-specific functions and methods such as Start(), Update(), FixedUpdate(),\
    \ and more. If our script didn't derive from MonoBehaviour it would not inherit\
    \ those functions and the engine wouldn't automatically call functions like Update()\
    \ for us to be able to work with. Another point to note is that MonoBehaviour\
    \ is a class that is built into the engine and not something we can access to\
    \ edit or change.\n\nThe second point to note is that our functions are both declared\
    \ as virtual functions. Both are public, both are virtual. Making virtual functions\
    \ means that the behavior in our base class may be overridden by any scripts that\
    \ derive from it. The behavior we define in this base class could be thought of\
    \ as its default behavior. We will cover overriding in full a little further on\
    \ in this section."
  merge: -1
  img_proc: true
- pgno: 23
  md: "Let's take a look at what this script actually does: if we were to call the\
    \ Engine() function of our BaseCar class, it would write to the console \"Vroom.\"\
    \ If we called Wheels, the console would read \"Four wheels.\"\n\nNow that we\
    \ have our BaseCar class, we can use this as a template and make new versions\
    \ of it like this:\n\n```\npublic class OctoCar : BaseCar {\n    public override\
    \ void Wheels () {\n        Debug.Log(\"Eight wheels\");\n    }\n}\n```\n\nThe\
    \ first thing you may notice is that the OctoCar class derives from BaseCar rather\
    \ than MonoBehaviour. This means that OctoCar inherits functions and methods belonging\
    \ to our BaseCar script. As the functions described by BaseCar were virtual, they\
    \ may be overridden. For OctoCar, we override Wheels with the line:\n\n```\npublic\
    \ override void Wheels () {\n```\n\nLet's take a look at what this script actually\
    \ does: In this case, if we were to call the Engine() function on OctoCar, it\
    \ would do the same as the BaseCar class; it would write \"Vroom\" to the console.\
    \ It would do this because we have inherited the function but have not overridden\
    \ it, which means we keep that default behavior. In OctoCar, however, we have\
    \ overridden the Wheels() function. The BaseCar behavior of Wheels would print\
    \ \"Four wheels\" to the console but if we call Wheels() on OctoCar, the overridden\
    \ behavior will write \"Eight wheels,\" instead.\n\nInheritance plays a huge part\
    \ in how our core game framework is structured. The idea is that we have basic\
    \ object types and specific elaborated versions of these objects inheriting the\
    \ base methods, properties, and functions. By building our games in this manner,\
    \ the communication between the different game components (such as game control\
    \ scripts, weapon scripts, projectile controllers, etc.) becomes universal without\
    \ having to write out the same function declarations over and over again for different\
    \ variations of script. For the core framework, our main goal is to make it as\
    \ flexible and extensible as possible and this would be a much more difficult\
    \ if we were unable to use inheritance.\n\n# 1.1.4 Coroutines\n\nUnity lets you\
    \ run a function known as a coroutine, outside of the regular built in functions\
    \ like Update, FixedUpdate, LateUpdate, and so on. A coroutine is self-contained\
    \ code that will just go off and do its own thing once you have told it to run.\
    \ As it is running on its own, you can do some cool stuff like pause it for a\
    \ set amount of time and then have it start again, and coroutines are ideally\
    \ suited to time-based actions like fade effects or animations.\n\nHere is an\
    \ example of a coroutine (this example code comes from the Unity engine documentation):\n\
    \n```\nIEnumerator Fade()\n{\n    for (float ft = 1f; ft >= 0; ft -= 0.1f)\n \
    \   {\n        Color c = renderer.material.color;\n        c.a = ft;\n       \
    \ renderer.material.color = c;\n        yield return null;\n    }\n}\n```"
  merge: -1
  img_proc: true
- pgno: 24
  md: "This code loops the value of f from 1 to 0 and sets the alpha value of a color\
    \ on a material to that value. This will fade out whatever renderer this script\
    \ is attached to, fading more as the alpha channel gets closer to 0. Notice the\
    \ strange line:\n\n```\nyield return null;\n```\n\nDo not be alarmed by this odd\
    \ code above! All it does is tell the engine that, at this point, the coroutine\
    \ is ready to end this update and go on to the next one. You need this in your\
    \ code, but don't worry too much about why at this stage. I will go into some\
    \ more detail below, but for now let us continue by looking at how you would start\
    \ this coroutine running:\n\n```\nStartCoroutine(\"Fade\");\n```\n\nStartCoroutine()\
    \ takes the name of the coroutine as a string. Once called to start, the coroutine\
    \ will do its thing and you do not need to do anything else. It will either run\
    \ until we tell it to stop, or it will run until the object is destroyed.\n\n\
    A key thing to note here is that the function is declared as type IEnumerator.\
    \ At first, I found this confusing, but it turns out that Unity coroutines use\
    \ C#'s built in system for iterator blocks. IEnumerator (Iterator Enumerator)\
    \ was intended to be a method for iterating through collections of objects. Coroutines\
    \ instead use IEnumerator to iterate through your coroutine code, starting or\
    \ stopping it between updates.\n\nAnother key point is that statement:\n\n```\n\
    yield return null;\n```\n\nYou can think of IEnumerator like a cursor making its\
    \ way through your code. When the cursor hits a yield statement, that tells the\
    \ engine that this update is done and to move the cursor on to the next block.\n\
    \nAnother thing you can do with coroutines is to pause the code inline for a certain\
    \ amount of time, like this:\n\n```\nyield return new WaitForSeconds(1.0f);\n\
    ```\n\nUsing WaitForSeconds(), you can quite literally pause the coroutine script\
    \ execution inline. For example:\n\n```\nIEnumerator DebugStuff()\n{\n    Debug.Log(\"\
    Start.\");\n    yield return new WaitForSeconds(1.0f);\n    Debug.Log(\"Now, it's\
    \ one second later!\");\n}\n```\n\nEarlier in this section, I mentioned that the\
    \ yield statement is used to tell Unity the current update is done and to move\
    \ on to the next. In the code above, rather than just telling Unity to move on\
    \ to the next bit of code, it tells Unity to wait for the specified number of\
    \ seconds first.\n\n# 1.1.5 Namespaces\n\nNamespaces compartmentalize chunks of\
    \ code away from each other. You can think of a namespace as a box to put your\
    \ own scripts in, so that they can stay separated from other code or code libraries.\
    \ This helps to prevent possible"
  merge: -1
  img_proc: true
- pgno: 25
  md: "overlaps between code libraries (APIs and so on) and your own code, such as\
    \ duplicate function names or variables.\n\nTo use namespaces, you wrap the entire\
    \ class in a namespace declaration like this:\n\n```\nnamespace MyNamespace\n\
    {\n    public class MyClass() : MonoBehaviour\n    {\n\n    }\n}\n```\n\nWhen\
    \ you want to refer to the code from another class, you need to be either wrapped\
    \ in the same namespace or to have the using keyword at the top of the script,\
    \ like:\n\n```\nusing MyNamespace;\n```\n\n# ### 1.1.6 Finite State Machines (FSM)\n\
    \nA finite state machine is a commonly used system for tracking states. In video\
    \ games, they are used to track game states. Example states might be GameLoaded,\
    \ GameStarting, LevelStarting, and so on. The term *finite state machine* sounds\
    \ a lot more complicated than it usually is. The actual code often takes the form\
    \ of a long case statement that will execute code or call functions based on the\
    \ current game state. For example:\n\n```\nSwitch(currentGameState)\n{\n    Case\
    \ GameStates.GameLoaded:\n    GameLoaded();\n    break;\n    Case GameStates.GameStarting:\n\
    \    GameStart();\n    break;\n\n}\n```\n\nHaving code in each case statement\
    \ can get unruly. To counter this, I like to split all of the code out into individual\
    \ functions. This keeps the code tidy, easier to manage, and easier to debug when\
    \ things do not go to plan.\n\n# ## 1.2 Naming Conventions\n\nNaming conventions\
    \ vary from programmer to programmer and even between companies. Some games companies\
    \ have strict guidelines on how code is constructed and how to name variables,\
    \ where they can and cannot be used, and so on, which is mostly in place to make\
    \ it easier for other programmers to be able to understand the code and pick it\
    \ up when they might need to. You may not need to take it that far, but I do feel\
    \ that some organization of your naming helps. In this book, I follow a very loose\
    \ set of rules for naming variables – just enough to make it easier for me to\
    \ know quickly what type of variable I am looking at or what its purpose might\
    \ be. Those are:\n\nObject references (Transforms, Components, GameObjects, and\
    \ so forth) are prefixed by an underscore (_) symbol. For example, a variable\
    \ to hold a"
  merge: -1
  img_proc: true
- pgno: 26
  md: 'reference to a Transform might be named `_TR`. A variable used to talk to a
    Game Manager might be named `_GameManager`.


    Most of the objects in this book (players, enemies, and more) derive from the
    ExtendedMonoBehaviour class, which contains a few variables that are used more
    commonly than others:


    +   - `_RB` — Used to reference a Rigidbody attached to this object.

    +   - `_RB2D` — For a 2D Rigidbody reference.

    +   - `_TR` — The Transform of the object.

    +   - `_GO` — The GameObject.


    Where scripts need to be initialized before they can be used, in this book we
    always use a Boolean variable named `didInit` which gets set to true after initialization.
    You can use `didInit` to make sure initialization has completed.


    Many programmers frown on the idea of declaring temporary variables, but I like
    to have `_tempVEC` and `_tempTR` variables available for whenever I need to refer
    to a quick Vector3 or another Transform inline. Having these variables already
    declared is just a little quicker than having to declare a new Vector3 each time,
    or to make a new Transform variable.


    # 1.3 Where to Now?


    Think about how your objects work together in the game world and how their scripts
    need to communicate with each other. I find it helps to make flow diagrams or
    to use mind-mapping software to work things out beforehand. A little planning
    early on can reduce a whole lot of code revisions later. That said, it is perfectly
    O.K. for your structure to grow and evolve as you develop it further. The framework
    shown in this book went through many iterations before reaching its final form.


    Try to break up your scripts into smaller components to help debugging and flexibility.
    Also try to design for re-usability; hard-coding references to other scripts reduces
    the portability of the script and increases the amount of work you will need to
    do in the future when you want to carry it over into another project.'
  merge: -1
