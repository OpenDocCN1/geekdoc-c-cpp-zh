    \nIn the script above, we deal with what happens when the game is over. This will\
    \ be called after the player falls off-screen. The first part of the script stops\
    \ running and sets runSpeed to 0 so that the platforms stop moving.\n\nThe game\
    \ is ending, so the next line schedules a call to ReturnToMenu in 4 seconds. We'll\
    \ get to this function further on in this section, but it may not come as a big\
    \ surprise that ReturnToMenu() loads the main menu.\n\nAfter setting up the call\
    \ to return to the menu, the script above uses CancelInvoke to stop the AddScore()\
    \ function from being called. Remember we set up the InvokeRepeating call for\
    \ this in the StartRunning() function? This is how we stop it.\n\nFinally, for\
    \ the EndGame() function, we set the target state to gameEnded with this line:\n\
    \n```\nSetTargetState(Game.State.gameEnded);\n```\n\nUpdateTargetState() has nothing\
    \ specific for Game.State.gameEnded other than a call to Invoke the OnGameEnded\
