  md: "modelRotateSpeed and Time.deltaTime. Time.deltaTime is used here to make sure\
    \ that the rotations and movements will be the same regardless of frame rate or\
    \ frame glitches, basing the movement amounts on time rather than relying on each\
    \ frame happening at the exact same time.\n\n```\nvoid LookForTarget()\n{\n  \
    \  // look for chase target\n    LookAroundFor();\n\n    // if there are obstacles,\
