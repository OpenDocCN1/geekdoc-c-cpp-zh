    \ + aName);\n    sourceGO.transform.parent = myParent;\n}\n```\n\nAbove, the constructor\
    \ of the SoundObject class (a function that runs automatically when SoundObject\
    \ is instantiated) contains set up code to be create a new GameObject in the Scene\
    \ for its AudioSource Component to be attached to. When playing sounds, we do\
    \ not call SoundObject directly – this is done further down, by the BaseSoundManager\
    \ class. Note that the constructor for SoundObject has 5 parameters – when a SoundObject\
    \ instance is created, each one will need these parameters passed into it. You\
    \ will see how this is done further down in the BaseSoundManager class.\n\nThe\
    \ constructor starts by creating a new GameObject with new GameObject(), which\
    \ takes a name as a parameter – naming the new GameObject based on this. To make\
    \ sure we know what this GameObject is, in the Scene's Hierarchy, it is named\
    \ AudioSource followed by a name passed into this constructor as a parameter.\
    \ Next, we set the parent of the new GameObject here, too, or more specifically\
    \ the parent of its Transform. This is all about keeping sound GameObjects together\
    \ in the Scene to keep it all neat and tidy and we get the parent Transform from\
    \ a passed in parameter named myParent.\n\n```\nsourceTR = sourceGO.transform;\n\
    source = sourceGO.AddComponent<AudioSource>();\nsource.outputAudioMixerGroup =\
    \ theMixer;\nsource.playOnAwake = false;\nsource.clip = aClip;\nsource.volume\
    \ = aVolume;\nsource.maxDistance = 2000;\n}\n```\n\nEvery time we want to set\
    \ the position of a sound, we will need to access the Transform of this GameObject\
    \ and we store a reference to the Transform in the variable sourceTR, so that\
