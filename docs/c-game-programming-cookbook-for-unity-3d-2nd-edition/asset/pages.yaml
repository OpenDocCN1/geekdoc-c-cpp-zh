    \n    TEMPVec3.x = horz;\n    TEMPVec3.y = vert;\n\n    // return the movement\
    \ vector\n    return TEMPVec3;\n}\n```\n\nFor convenience, BaseInputController\
    \ includes a simple system for returning a direction vector. The function will\
    \ return a Vector3 with its x and y axis representing the levels of input.\n\n\
    # 4.3 User Data\n\nIt is not uncommon to store player information in a game controller\
    \ or similar script removed from individual player objects. This approach may\
    \ be well suited to single player games but moving to games that have more than\
    \ one player may prove to be problematic. One solution may be for the game controller\
    \ to have an array of classes containing player stats, manipulating them when\
    \ other functions tell it to, but why not attach the player stats to each player\
    \ and make it self-sufficient?\n\nThe framework for this book uses a data manager\
    \ class for each player, consisting of everything we need to store for a single\
    \ player:\n\n+   1. Score\n+   2. High score\n+   3. Level\n+   4. Health\n+ \
    \  5. Whether or not the player is finished (no longer active)\n+   6. Name of\
    \ the player\n\nEach player has the BaseUserManager.cs script attached to its\
    \ GameObject, giving each player its own set of stats. The game controller or\
    \ other script elsewhere in the game structure can easily search for and access\
    \ a player's information.\n\nThe BaseUserManager uses a static variable named\
    \ global_userDatas to contain information about all the players in the game. As\
    \ it is static, it persists across Scene loading and we keep player data wherever\
    \ we are. The global_userDatas variable is typed as a List<UserData>, so it's\
    \ a List containing UserData objects. You can easily modify or add new variables\
    \ to the UserData class if you need to store more information about players."
  merge: -1
  img_proc: true
- pgno: 84
  md: "The way BaseUserManager is intended to work is that you add players before\
    \ the game starts - probably in the main menu when the player hits the start button.\
    \ Just before the game begins, we add empty players to the global_userData List\
    \ - however many players are going to be in the game - and that data persists\
    \ until we go back and start the game again, at which point the players are wiped\
    \ out and new ones made ready for a new game. Structuring your player data this\
    \ way means that you keep player data away from Game Managers or player manager\
    \ scripts - keeping code clean - and as an added bonus, it's easier to keep a\
    \ track of your player data or multiple players data even if you are loading multiple\
    \ Scenes along the way. Separating out the player data into a single List also\
    \ makes saving and loading players states much easier, as you only need to save\
    \ or load one List rather than each variable independently. There are some limitations\
    \ to what you can save and load easily, due to serialization, but for most variable\
    \ types - ints, strings, floats, and so on - the process for saving out the data\
    \ is relatively straightforward.\n\n# ### 4.3.1 The UserData Class\n\nYou can\
    \ find this class in the folder GPC_Framework/Scripts/DATA.\n\nUserData is a small\
    \ data class used to store everything we need to keep track of, for players during\
    \ a game. UserData is declared inside the script named UserData.cs.\n\n```\n```csharp\n\
    namespace GPC\n{\n    [System.Serializable]\n    public class UserData\n    {\n\
    \        public int id;\n        public string playerName = \"Anonymous\";\n\n\
    \        public int score;\n        public int level;\n        public int health;\n\
    \        public int lives;\n        public bool isFinished;\n    }\n}\n```\n```\n\
    \nYou can easily add (or remove) variables to the UserData class, if you need\
    \ to keep a track of other data. For ease of access, I use a class named BasePlayerStatsController\
    \ that contains all the functions needed to 'talk' to the BaseUserManager. If\
    \ you add new variables to the UserData class, you may also want to add methods\
    \ to access them via BasePlayerStatsController. See Section 4.5 of this chapter\
    \ for a full breakdown of BasePlayerStatsController.\n\n# ### 4.3.2 The BaseUserManager\
    \ Class\n\nYou can find this class in the folder GPC_Framework/Scripts/DATA.\n\
    \nThe BaseUserManager class:\n\n```\n```csharp\nusing UnityEngine;\nusing System.Collections.Generic;\n\
    \nnamespace GPC\n{\n    [AddComponentMenu(\"CSharpBookCode/Base/Base User Manager\"\
    )]\n\n    public class BaseUserManager : MonoBehaviour\n    {\n```\n```"
