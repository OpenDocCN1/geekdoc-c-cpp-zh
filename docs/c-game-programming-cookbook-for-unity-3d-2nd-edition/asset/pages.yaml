    # 2.6 Building the Player, RunMan


    Now we have platforms, we need a player. Start by creating a new GameObject in
    the Hierarchy (you can do this either by right clicking in an empty area and choosing
    Create Empty or by clicking on the + icon at the top of the Hierarchy panel).


    Name the new GameObject RunMan, by changing its name in the Inspector.


    # 2.6.1 Adding the RunMan Sprite


    So that we can see where the player is, it would be a good idea to add a visual
    representation – the RunMan sprite – to the Scene. To do this, find the Games/RunMan/Sprites
    folder in the Project panel. Click the Sprites folder so that you can see what
    is inside it. In Sprites, find the file named RunMan_Run-Sheet. Click and drag
    RunMan_Run-Sheet out of the Project panel and into a blank part of the Hierarchy.
    This should add the RunMan sprite to the Scene and make it appear in the center
    of the Game panel.


    At this point, the sprite and our RunMan GameObject are two separate objects.
    What we need to do next is to make the sprite a child of the RunMan GameObject.
    In the Hierarchy, click on the RunMan_Run-Sheet_0 GameObject and drag it on top
    of the RunMan GameObject. This should parent RunMan_Run-Sheet_0 to it, as per
    Figure 2.11.


    The problem we have at this stage is that the sprite may be offset position-wise
    from the RunMan GameObject because Unity often spawns objects away from 0,0,0
    world position. In Unity, all objects have world positions and local positions.
    You could say that a world position would be your street address and the local
    position might be where you are inside your house.


    When you parent an object to another object it will inherit the parent''s world
    position, but it will still hold whatever world position it had previously, now
    stored as a local position. That is, even though it moves with the parent GameObject
    it will be offset from it by whatever X, Y, and Z values are in its Transform
    box in the Inspector.


    The RunMan GameObject will have all of the operational Components (movement code
    and collisions and so forth) attached to it which means that the sprites local
    position needs to be set to 0,0,0. This way, it will both move with the


    ![](img/e4b578cd512539e7261e070d87b6550a_40_0.png)


    Figure 2.11 The RunMan sprite parented to a GameObject.'
