  md: 'settings or the AssetBundle has not been loaded” – and this is down to Unity
    not finding a main menu, so let’s fix that next.


    # 2.9.1 Main Menu Setup


    In the Project panel, Double click the Scenes folder. Double click the runMan_menu
    Scene to open it. To save time, this Scene is already almost ready to go. It is
    based on the MenuTemplate Scene found in the GPC_Framework/TemplateScenes folder,
    which is provided as a basic template to help you build a menu Scene quickly.
    To finish setting up the menu, we need to tell Unity where to find the menu Scene,
    by adding it to Build Settings.


    Click the File menu (top left of the editor) followed by Build Settings. With
    Build Settings open, click and drag runMan_menu out of the Project panel and drop
    it into the Scenes In Build area of Build Settings (Figure 2.19). Close the Build
    Settings window once you have done that.


    The menu template Scene that you just copied over has everything you need for
    a main menu, but we do need to tell it where to find the game so that it can load
    the game Scene when a player hits the start button.


    Find and click on the MenuManager GameObject in the Hierarchy to highlight it.
    In the Inspector, find the Menu With Profiles Component. In the Game Scene Name
    field, type runMan_core (case sensitive!).


    Hit CTRL+S to save the Scene (or File/Save menu) and hit Play in the toolbar to
    play the game. The menu should appear.


    Click the Start Game button to play the game. The main game should load, play,
    and even return to the main menu after the game ends.'
