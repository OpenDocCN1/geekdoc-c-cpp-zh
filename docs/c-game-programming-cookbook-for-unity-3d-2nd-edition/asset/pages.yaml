- pgno: 114
  md: "The FixedUpdate() function will calculate how much an object is sliding – to\
    \ do this, it finds how much sideways movement the object is making (to the right\
    \ relative to the Transform's rotation) – to find out how much slip is happening.\n\
    \n# 5.10.7 TimerClass\n\nOur timer system is named TimerClass.cs:\n\n```\nusing\
    \ UnityEngine;\nusing System.Collections;\n\nnamespace GPC\n{\n    [AddComponentMenu(\"\
    CSharpBookCode/Common/Timer class\")]\n    public class TimerClass : ScriptableObject\n\
    \    {\n        public bool isTimerRunning = false;\n        private float timeElapsed\
    \ = 0.0f;\n        private float currentTime = 0.0f;\n        private float lastTime\
    \ = 0.0f;\n        private float timeScaleFactor = 1.0f; // <-- If you need to\
    \ scale time, change this!\n        private string timeString;\n        private\
    \ string hour;\n        private string minutes;\n        private string seconds;\n\
    \        private string millis;\n        private int aHour;\n        private int\
    \ aMinute;\n        private int aSecond;\n        private int aMillis;\n     \
    \   private int tmp;\n        private int aTime;\n        private GameObject callback;\n\
    \        public void UpdateTimer()\n        {\n\n```\n\nIn this script, we will\
    \ only update time whenever the time is requested. Although there may be cases\
    \ where the timer would need to be updated constantly, we only need to do this\
    \ on demand for the games in this book. For the example games, we do not derive\
    \ the class from MonoBehaviour and we call UpdateTimer() from another script;\
    \ the Game Manager. If you want this script to update automatically, we will outline\
    \ a method to modify the script to work like that at the end of this section.\n\
    \nThe timer works by having a variable called currentTime that stores the amount\
    \ of time since the timer was started. currentTime starts at zero, then UpdateTimer()\
    \ calculates out how much time goes by between updates and adds it to currentTime.\
    \ The value of currentTime can then be parsed into minutes, seconds, and milliseconds\
    \ and returned as a nice, tidy formatted string in the GetFormattedTime() function\
    \ of the TimerClass class.\n\nUpdateTimer() will be the only function that updates\
    \ the time system:\n\n```\npublic void updateTimer()\n{\n    // calculate the\
    \ time elapsed since the last Update()\n    timeElapsed = Mathf.Abs(Time.realtimeSinceStartup\
    \ - lastTime);\n```"
