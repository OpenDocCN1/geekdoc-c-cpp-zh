  md: "```\n{\n    public LayerMask mask;\n    private Transform _TR;\n    RaycastHit\
    \ hit;\n    Quaternion targetRotation;\n\n    private int smooth = 10;\n\n   \
    \ void Start()\n    {\n        _TR = GetComponent<Transform>();\n    }\n\n   \
    \ void Update()\n    {\n        RaycastHit hit;\n        if (Physics.Raycast(_TR.position,\
    \ -Vector3.up, out hit, 2.0f))\n        {\n            targetRotation = Quaternion.FromToRotation(_TR.up,\
    \ hit.normal) * _TR.rotation;\n            _TR.rotation = Quaternion.Lerp(_TR.rotation,\
    \ targetRotation, Time.deltaTime * smooth);\n        }\n    }\n}\n```\n\nAbove,\
    \ the script starts by grabbing a reference to the Transform in the Start() function\
    \ and then we are into Update():\n\n```\nvoid Update()\n{\n    RaycastHit hit;\n\
    \    if (Physics.Raycast(_TR.position, -Vector3.up, out hit, 2.0f))\n```\n\nThe\
    \ Physics.Raycast() function requires that you pass in a RaycastHit object as\
    \ a place to put all the information it gathers, so we declare the variable hit\
    \ first for this purpose.\n\nThere are a lot of different ways you can use Physics.Raycast()\
    \ – 15 different overloads to be exact – so we will not be going through all of\
    \ them, just how this line works. The Unity documentation is the place for that!\n\
    \nIn this code, we pass in a position to say where to start the ray from, followed\
    \ by a Vector3 to state the direction that the ray should be drawn. We then pass\
    \ in that hit RaycastHit variable from above, followed by the length of raycast\
    \ we want Unity to make, and finally we pass in a LayerMask variable named mask.\n\
    \nLayerMasks are used by Unity as a filter to decide which Layers should be included.\
    \ When we pass in a LayerMask to Physics.Raycast(), the raycasting process will\
    \ filter out any GameObjects that are not on the Layers specified in the LayerMask.\
    \ In the editor, the LayerMask variable – when exposed as a public variable –\
    \ will appear as a dropdown menu in the Inspector. The dropdown contains a list\
    \ of all Layers set up via the Layers menu (at the top of the Inspector) and it\
    \ allows you to choose one or multiple Layers for the mask.\n\nNote: Using Physics.Raycast()\
    \ will only return a single Collider, but if you need to detect more than one\
    \ object along the ray you should look at RaycastAll().\n\nAfter gathering information\
    \ from Physics.Raycast(), we can align our Transform:\n\n```\ntargetRotation =\
    \ Quaternion.FromToRotation(_TR.up, hit.normal) * _TR.rotation;\n```"
