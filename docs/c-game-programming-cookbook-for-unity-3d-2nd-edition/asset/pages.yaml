    \ game manager that the player was destroyed\n        BlasterGameManager.instance.PlayerDestroyed();\n\
    \n    }\n\n}\n```\n```\n\nAbove, when PlayerDestroyed() is called we first set\
    \ a flag _controller.isRespawning to avoid registering any more projectile hits/health\
    \ losses and/or duplicate respawn calls. playerAvatarParent is a variable containing\
    \ the GameObject above our player's avatar in the Hierarchy, and here we call\
    \ SetActive() on it to make it inactive in the Scene. This will hide the parent\
    \ GameObject and any child objects, too, so the entire player should become invisible\
    \ to the player. As the player has been destroyed, we call ReduceLives() (all\
    \ stats functions like this are in that BasePlayerStatsController class, by the\
    \ way!) and finally call out to the BlasterGameManager instance to register the\
    \ player destruction with it. BlasterGameManager will then take care of reloading\
    \ the Scene to reset the game state and restart the level.\n\n# ### 15.3.3 Enemy\
    \ Bots and the BlasterEnemyBot Class\n\nWhen it comes to inheritance, there is\
    \ a three class chain leading up to BlasterEnemyBot:\n\nBlasterEnemyBot>BaseEnemyStatsController>BaseAIController>ExtendedCustomMonoBehaviour.\n\
    \nBaseAIController is a class full of utility functions for dealing with AI, such\
    \ as waypoint management, and movement. On its own, it does not do anything until\
    \ we tell it what to do. BaseEnemyStatsController is the equivalent of BasePlayerStatsController\
    \ only for enemies. It holds information about the enemy's health, score, and\
    \ name and can be expanded to hold any information you like. BlasterEnemyBot.cs\
    \ brings BaseEnemyStatsController and BaseAIController together, to form the AI\
    \ for our enemy bot.\n\nThe inherited classes means that BlasterEnemyBot is a\
    \ relatively small script which derives from AIBotController, as described in\
    \ Chapter 10, Section 10.4, of this book.\n\n```\n```csharp\nusing UnityEngine;\n\
    using GPC;\n\npublic class BlasterEnemyBot : AIBotController\n{\n    [Header(\"\
    Game specific\")]\n    public bool isRespawning;\n    public bool isBoss;\n\n\
    \    [Header(\"Weapons and hits\")]\n    public BaseEnemyWeaponController _weaponController;\n\
    \    public LayerMask projectileLayerMask;\n    public Transform _explosionPrefab;\n\
    \n    public override void Start()\n    {\n        Init();\n    }\n}\n```\n```"
