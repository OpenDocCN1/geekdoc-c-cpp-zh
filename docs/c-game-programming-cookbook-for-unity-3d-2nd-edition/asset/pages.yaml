  md: "# 10.1 AI States\n\nBefore getting to the main BaseAIController.cs script,\
    \ take a look at AIStates.cs below. It contains all of the AIStates from the previous\
    \ section stored in an enumerator list similar to the one used by the character\
    \ controller from Chapter 5 of this book. This list will be used by the AI to\
    \ determine its current required behavior. The list is in its own file (the AIStates.cs\
    \ file) and in a namespace called AIStates so that we can easily make it accessible\
    \ from any script used by the game:\n\n```\nusing UnityEngine;\nnamespace AIStates\n\
    {\n    public enum AIState\n    {\n        moving_looking_for_target,\n      \
    \  chasing_target,\n        backing_up_looking_for_target,\n        stopped_turning_left,\n\
    \        stopped_turning_right,\n        paused_looking_for_target,\n        translate_along_waypoint_path,\n\
    \        paused_no_target,\n        steer_to_waypoint,\n        steer_to_target,\n\
    \    }\n}\n```\n\n# 10.2 The BaseAIController Class – Base AI Control\n\nBaseAIController\
    \ starts with the UnityEngine namespace as well as adding AIStates, as seen in\
    \ the previous Section 10.1. By including AIStates as a namespace, it can be accessed\
    \ as though it were part of the same script. We wrap the class in the GPC namespace,\
    \ and it derives from ExtendedCustomMonoBehaviour:\n\n```\nusing UnityEngine;\n\
    using AIStates;\nnamespace GPC\n{\n    [AddComponentMenu(\"CSharpBookCode/Base/AI\
    \ Controller\")]\n    public class BaseAIController : ExtendedCustomMonoBehaviour\n\
    \    {\n        public bool AIControlled;\n\n        [Header(\"AI States\")]\n\
    \        public AIState currentAIState;\n        public AIState targetAIState;\n\
    \n        [Header(\"Enemy input\")]\n        public float horz;\n        public\
    \ float vert;\n\n        [Header(\"Enemy AI movement values\")]\n        public\
    \ float obstacleAvoidDistance = 40f;\n        public float modelRotateSpeed =\
    \ 15f;\n        public int _followTargetMaxTurnAngle = 120;\n        public float\
    \ minChaseDistance = 1f;\n        public float maxChaseDistance = 10f;\n     \
    \   public float visionHeightOffset = 1f;\n    }\n}\n```"
  merge: -1
  img_proc: true
