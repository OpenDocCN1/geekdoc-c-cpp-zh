  md: "```\nif (!canControl)\n{\n    // kill all inputs if not controllable.\n   \
    \ Input.ResetInputAxes();\n}\nUpdateSmoothedMovementDirection();\n```\n\nAbove,\
    \ Update() begins with a call to stop input when canControl is set to false. More\
    \ than anything, this is designed to bring the player to a stop when canControl\
    \ is set at the end of the game. When the game ends, rather than inputs continuing\
    \ and the player being left to run around behind the game over message, inputs\
    \ are set to zero.\n\nUpdateSmoothedMovementDirection() calls one of two movement\
    \ update scripts, based on the value of the Boolean variable moveDirectionally.\n\
    \n```\nvoid ApplyGravity()\n{\n    // apply some gravity to the character\n  \
    \  float gravity = -9.8f * Time.deltaTime;\n    _charController.Move(new Vector3(0,\
    \ gravity, 0));\n}\n```\n\nAbove, we apply gravity to the character controller\
    \ – by default, Unity does not add gravity to this type of object. We do this\
    \ just by calling Move() and passing in a Vector3 of the direction of gravity.\n\
    \nAt the end of the class, GetSpeed(), GetDirection and IsMoving() are utility\
    \ functions provided for other scripts to have access to a few of the character's\
    \ properties:\n\n```\npublic float GetSpeed ()\n{\n    return moveSpeed;\n}\n\
    public Vector3 GetDirection ()\n{\n    return moveDirection;\n}\npublic bool IsMoving\
    \ ()\n{\n    return (Mathf.Abs(vert) + Mathf.Abs(horz) > 0.5f);\n}\n```\n\nGetSpeed()\
    \ and GetDirection() return their associated variables. IsMoving() takes the absolutes\
    \ values of vert and horz to find out if the player is moving faster than 0.5f.\n\
    \n# 6.2 Wheeled Vehicle\n\nThe BaseWheeledVehicle.cs script relies on one of Unity's\
    \ built-in WheelCollider system. WheelCollider components are added to GameObjects\
    \ positioned in place of the wheels supporting the car body. The WheelCollider\
    \ components themselves do not have any visual form and meshes representing wheels\
    \ are not aligned automatically. WheelColliders are physics simulations; they\
    \ take care of the physics actions such as suspension and wheel friction."
