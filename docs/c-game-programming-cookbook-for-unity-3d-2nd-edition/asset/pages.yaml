  md: "```\nvoid UpdatePositions()\n{\n    // here we need to talk to the race controller\
    \ to\n    get what we need to display on screen\n    theLap =\n    GlobalRaceManager.instance.GetLapsDone(focusPlayerID)\
    \ + 1;\n\n    // update the display\n    UpdateLapCounter(theLap);\n}\n```\n\n\
    Above, UpdatePositions() gets the lap currently being run by the player we are\
    \ focusing on, whose ID is in focusPlayerID. This was another variable set in\
    \ the SetupPlayers() function when we first added all of the vehicles to the Scene.\
    \ The GlobalRaceManager class takes care of tracking positions and laps, and to\
    \ find out how many laps the player has completed we can call GlobalRaceManager.instance.GetLapsDone().\
    \ Passing the player ID as a parameter means that it will return the current lap\
    \ count of that player as an integer. We store that into the variable theLap,\
    \ which is used in the next line above to pass into the UpdateLapCounter() function\
    \ as a parameter. This will update the user interface lap display.\n\nTo update\
    \ the user interface's lap counter, we have the function UpdateLapCounter():\n\
    \n```\nvoid UpdateLapCounter(int theLap)\n{\n    // if we've finished all the\
    \ laps we need to finish,\n    let's cap the number so that we can\n    // have\
    \ the AI cars continue going around the track\n    without any negative implications\n\
    \    if (theLap > totalLaps)\n        theLap = totalLaps;\n\n    // now we set\
    \ the text of our GUIText object lap\n    count display\n    _uiManager.SetLaps(theLap,\
    \ totalLaps);\n}\n```\n\nThe current lap number is passed into UpdateLapCounter()\
    \ as a parameter, then it gets checked to make sure that the lap number is within\
    \ the total laps for the race. If it is too high, it will be capped at the value\
    \ of totalLaps.\n\nA class named RaceUIManager will deal with setting the Text\
    \ object in the Scene – this is added as a Component to the GameManager GameObject\
    \ in our core Scene.\n\nWe call out to _uiManager to SetLaps() above, passing\
    \ in the current lap and total number of laps as parameters. This will be displayed\
    \ as 'Lap x/x'.\n\nWhen the race is over, RaceComplete() is called to start bringing\
    \ everything to a halt:\n\n```\npublic void RaceComplete()\n{\n    // set all\
    \ players to AI so that they continue driving\n    for (int i = 0; i < _playerList.Count;\
    \ i++)\n    {\n        // set to AI\n        _playerList[i].AIControlled = true;\n\
    \        // disable the keyboard input Component for\n        AI players..\n \
    \       _playerList[i].GetComponent<RaceInputController>().SetInput\n        Type(RaceInputController.InputTypes.noInput);\n\
    \    }\n}\n```"
