    \ == 0) // <- get the type of this player from baseusermanager\n{\n    _newPlayer.GetComponent<RaceInputController>().SetInputType(\
    \ RaceInputController.InputTypes.player1 );\n}\n```\n\nAbove, _baseUserManager.GetType\
    \ is passed in the id of this player to find out what type of player it is we\
    \ are spawning. If the type is 0, this is a user-controller player, and we need\
    \ to set it up as such. The next line uses GetComponent() to find the RaceInputController\
    \ Component attached to the vehicle prefab and then calls on its SetInputType()\
    \ function to set how the player should be controlled. The input type is set to\
    \ player1, which means it will use the arrow keys for input.\n\n```\n// tell race\
    \ controller that this is an AI vehicle\n_raceController.AIControlled = false;\n\
    \n// set the skin\n_raceController.GetComponent<MaterialSetter>().SetMaterial(0);\n\
    ```\n\nThere are just two more properties to affect the player above, when it\
    \ is user controlled. The first is to set AIControlled on the RacePlayerController\
    \ class to false so that the AI does not try to drive for us. We want the player\
    \ to have full control at this point.\n\nA Component named MaterialSetter is used\
    \ to set the material of the car body. The MaterialSetter Component is attached\
    \ to the Vehicle_Player prefab and it holds an array of materials that can be\
    \ applied to the vehicle. Using SetMaterial, we pass in the array index of the\
    \ material to set and it will take care of the rest. In this game, we have two\
    \ materials – one for the user controlled player and the other for AI so that\
    \ it will be easy for the user to determine which car they are controlling.\n\n\
    ```\n}\nelse if (_baseUserManager.GetType(_playerInfo[i].id) == 2)\n{\n```\n\n\
    If the player type is not user controlled (0), in the line above we check to see\
    \ if it is AI (2).\n\n```\n_newPlayer.GetComponent<RaceInputController>().SetInputType(\
    \ RaceInputController.InputTypes.noInput );\n\n// tell race controller that this\
    \ is an AI vehicle\n_raceController.AIControlled = true;\n\n// let the AI controller\
