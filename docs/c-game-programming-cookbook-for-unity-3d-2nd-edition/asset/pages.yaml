  md: "```\nthe ground    // cast a ray down from the waypoint to try to find\nRaycastHit\
    \ hit;\nif (Physics.Raycast(tempVEC + (Vector3.up * 10), -Vector3.up, out hit))\n\
    {\n    tempVEC.y = hit.point.y + 2.5f;\n}\n```\n\nAs it is quite common for the\
    \ waypoints to be either off the ground or too close to the ground for our respawn\
    \ to work correctly, the code above deals with ray casting down to find the ground\
    \ Collider. We project a ray from tempVEC (the waypoint's position) add 10 units\
    \ upward. The ray goes straight down at -Vector3.up and we put raycast hit information\
    \ into the locally scoped variable, hit.\n\nIf the raycast was successful, it\
    \ will return true, and we run the code between the graphics. What happens there\
    \ is that tempVEC has its y position set to the ground position we just found\
    \ through the raycast (hit.point) add 2.5 units. This number (2.5f) may be adjusted\
