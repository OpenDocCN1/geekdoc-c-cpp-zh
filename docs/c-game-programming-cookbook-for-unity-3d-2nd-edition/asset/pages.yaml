    \nAbove, a variable declaration of a Boolean to hold the paused state followed\
    \ by a couple of functions to deal with the game states. That will come up later\
    \ in the script, but for now focus on the game state functions. Whenever game\
    \ state should change, a call to SetTargetState is made. This might be from a\
    \ function within the Game Manager or it could come from one of your own scripts\
    \ else-where in the project.\n\nRather than jumping in and setting a new current\
    \ state right away, we use a target state first. After a call to SetTargetState(),\
    \ the state that gets passed in goes into the variable targetGameState. By going\
    \ through this process of having a tar-get state before setting the current state,\
    \ we can run any code that needs to be run at the start of a state change and\
    \ then switch states after that code has run.\n\nHere is an example of how having\
    \ a target state before a current state is useful: Imagine the start of a game.\
    \ When the game loads, we call out to SetTargetState to change state to GameState.Loaded.\
    \ We do all the initialization needed to prepare for the game. After initialization,\
    \ the current state becomes loaded and we can call again to SetTargetState(),\
    \ to change the state to GameState.Starting. With the target state of GameState.GameStarting,\
    \ a message telling the player to get ready is displayed and a timer starts. The\
    \ current state is then set to GameState.gameStarting and we stay in that state,\
    \ until the timer fin-ishes. Once the timer finishes, we call to SetTargetState()\
    \ for a third time and this time pass in GameState.gamePlaying. When the target\
    \ state is gamePlaying, all the initialization to start the game begins (such\
    \ as enabling player input or activating AI). Once the game is all ready to go,\
    \ the current state shifts over to gamePlaying and we stay there, throughout gameplay,\
    \ until game logic says otherwise.\n\nThe next block of code contains all the\
    \ UnityEvents that will show up in the Inspector, ready to be populated with objects\
    \ and calls to Components attached to them:\n\n```\n[Header(\"Game Events\")]\n\
    public UnityEvent OnLoaded;\npublic UnityEvent OnGameStarting;\npublic UnityEvent\
    \ OnGameStarted;\npublic UnityEvent OnLevelStarting;\npublic UnityEvent OnLevelStarted;\n\
    public UnityEvent OnLevelEnding;\npublic UnityEvent OnLevelEnded;\n\npublic UnityEvent\
