- pgno: 210
  md: "currentTime can be compared with fadeDuration to end the coroutine once the\
    \ full fadeDuration has elapsed.\n\n```\nfloat newAlpha = Mathf.Lerp(currentAlpha,\
    \ 1,\ncurrentTime / fadeDuration);\ntheGroup.alpha = newAlpha;\n```\n\nAbove,\
    \ Unity's Mathf.Lerp function takes the current alpha value as a start value,\
    \ 1 as a destination and we calculate how much of a portion of that to put into\
    \ newAlpha by using currentTime divided by fadeDuration – this calculation gives\
    \ us a time value between 0 and 1, which in turn means Math.Lerp will return a\
    \ value between currentAlpha and 1 at the percentage represented by that value.\n\
    \nThe alpha property of the Canvas gets set next (to newAlpha) and the coroutine\
    \ ends with:\n\n```\nyield return null;\n```\n\nEssentially, yield return null\
    \ says to Unity that we are done running code here, for now, so wait for the next\
    \ frame update and continue execution from this line after that. The next line\
    \ is the curly bracket wrapping our while loop, so when the next frame starts,\
    \ we go back to the top of the loop and go again until currentTime is more than\
    \ fadeDuration. Once the while loop is done, the coroutine finishes.\n\nNext,\
    \ the FadeCanvasOut coroutine works the same as the coroutine we just discussed,\
    \ except we set interactable and blocksRaycasts to false and the target value\
    \ for the Mathf.Lerp is 0 instead of 1:\n\n```\npublic static IEnumerator FadeCanvasOut(CanvasGroup\
    \ theGroup, float fadeDuration)\n{\n    float currentTime = 0;\n    float currentAlpha\
    \ = theGroup.alpha;\n    theGroup.interactable = false;\n    theGroup.blocksRaycasts\
    \ = false;\n    while (currentTime < fadeDuration)\n    {\n        currentTime\
    \ += Time.deltaTime;\n        float newAlpha = Mathf.Lerp(currentAlpha, 0, currentTime\
    \ / fadeDuration);\n        theGroup.alpha = newAlpha;\n        yield return null;\n\
    \    }\n}\n```\n\nFor the StartFadeCanvasSwitch coroutine, we are essentially\
    \ molding together both the FadeCanvasOut followed by the FadeCanvasIn coroutines\
    \ into one, neat coroutine of its own:\n\n```\npublic static IEnumerator StartFadeCanvasSwitch(CanvasGroup\
    \ startGroup, CanvasGroup endGroup, float fadeDuration, float waitTime)\n{\n \
    \   // fade out old UI\n    float currentTime = 0;\n    float currentAlpha = startGroup.alpha;\n\
    ```"
