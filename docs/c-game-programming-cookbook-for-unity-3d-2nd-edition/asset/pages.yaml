    Add the following code to your RunMan_GameManager script next:\n\n```\nvoid AddScore()\n\
    {\n    _RunManCharacter.AddScore(1);\n}\n\nvoid ReturnToMenu()\n{\n    SceneManager.LoadScene(\"\
    runMan_menu\");\n}\n\npublic void PlayerFell()\n{\n    SetTargetState(Game.State.gameEnding);\n\
    }\n```\n\nAddScore() tells the player to add one(1) to its score. ReturnToMenu()\
    \ uses Unity's SceneManager to load the main menu Scene. At this stage, we don't\
    \ actually have a main menu Scene but we will be sorting that out in the user\
    \ interface Section 2.9 of this chapter.\n\nLastly in the function above, the\
    \ PlayerFell() function is where we set the target state to Game.State.gameEnding.\
    \ This function will be called by the player whenever it hits its trigger. A trigger\
