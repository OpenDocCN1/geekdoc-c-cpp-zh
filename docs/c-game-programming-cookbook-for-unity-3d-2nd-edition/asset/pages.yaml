  md: '![](img/e4b578cd512539e7261e070d87b6550a_30_0.png)


    Figure 2.3 The Transform tools.


    ![](img/e4b578cd512539e7261e070d87b6550a_30_1.png)


    Figure 2.4 The playback tools.


    # E. Inspector


    Whenever you have a GameObject selected in the Scene panel, or highlighted in
    the Hierarchy, the Inspector window shows you editable properties of the GameObject
    and any Components attached to it. Whatever you can’t do with the Scene panel,
    you can probably do here instead.


    Another point of interest in the main Unity editor are along the toolbar across
    the top of the editor, below the menus.


    In the top left, find the Transform toolbar (Figure 2.3). This toolbar is to manipulate
    objects in the Scene panel. Tools, from left to right:


    | Tool | Description |

    |---|---|

    | The Hand Tool | Allows you to pan the view around the Scene. |

    | Move | Selection and movement of GameObjects. |

    | Rotate | Selection and rotation of GameObjects. |

    | Scale | Selection and scaling of GameObjects. |

    | Rect Transform | Modify a GameObjects boundaries as a Rect. |

    | Transform | A method to manipulate scale, position, and rotation in a single,
    combined tool. |

    | Custom | This tool allows access to custom Editor tools and will not be covered
    in this book. |


    At the center of the toolbar, find the Play, Pause and Step buttons (Figure 2.4)
    which are used to preview your game and to control what happens in the Game panel.


    # 2.2.1 A Few Notes on the Example Project


    Unity uses something called packages to extend the functionality of the editor
    in an officially supported and controlled way. To facilitate editing and set up
    of the 2D (two dimensional) sprites in this project, a package named 2D Sprite
    Package had to be imported. Accessing packages is done via the Package Manager
    – found in the menu Window/Package Manager. Check in Package Manager regularly,
    for updates to any libraries you download.


    # 2.2.2 Sprites


    2D sprites may be found in the projects Assets/Games/RunMan/Sprites folder. The
    sprites were made with a sprite editing program called Aesprite and exported as
    sprite sheets. Sprite sheets are groups of sprites which are split up into individual
    sprites by the engine. We tend to use sprite sheets for animations, exporting
    multiple frames of animation in a single image to save memory and having'
  merge: -1
  img_proc: true
- pgno: 31
  md: 'the engine take care of cutting them up to display. The import settings for
    all of the game images are set to their default values, the Sprite Mode is set
    to Multiple to accommodate the sprite sheets (Multiple allows you to slice up
    those images) and the Filter Mode has been set to Point (no filter) so that Unity
    does not try to filter images to make them smooth. For this type of visual style,
    we want the pixels to be defined and visible without filtering. The only other
    deviation from the defaults is the Compression level, which is set to None just
    to be sure to avoid any artifacts or anomalies that might stem from compressing
    small images.


    # 2.2.3 Animation


    Animation is a complicated subject and outside the scope of this book, but this
    section acts as a quick guide on how the animations for this game works.


    Look out for RunMan_Animator in the Sprites folder. You can open it to view by
    double clicking on the RunMan_Animator file in the Project pane. An Animator contains
    a state machine graph (Figure 2.5) which controls the flow of animation.


    When an animated GameObject is initialized, the state machine graph begins in
    its Entry state and will transition to the default state. In Figure 2.5, you can
    see that RunMan_Animator has a default state of RunMan_Idle (that is, an arrow
    goes from Entry to RunMan_Idle) – this will play an idle animation for whenever
    RunMan is standing still. The animation is looped and there is no further flow
    (no more arrows pointing to boxes!) out from RunMan_Idle in the Animator graph;
    so, until told otherwise, the animation will stay in the idle state.


    In the graph (Figure 2.5) look for the Any State – this literally means any state
    in that this state can be triggered from any animation. The Any State has two
    arrows coming off it; one pointing to RunMan_Jump state and the other to a RunMan_Run
    state. So, how do we get the animation to change to run or jump when the Animator
    graph has no link from the endlessly looping RunMan_Idle state? Parameters are
    the answer! Parameters are variables that can be set and modified through code
    and used as Conditions by the Animator graph to control flow. In the case of Any
    State, whenever a Jump parameter is triggered the Animator will transition from
    Any State (that is, whatever state the graph is currently in) to RunMan_Jump.
    Whenever a Run parameter is triggered, the Animator will transition from Any State
    to RunMan_Run. RunMan_Run is a looping animation that, again, will play until
    the Animator graph is told to do otherwise.


    In conclusion, the animation system for this game is set up to be as straightforward
    as possible. The Animator can be controlled by two parameters: Jump and Run. In
    our code, to transition to a run animation we just set the Run parameter. To play
    a jump animation, we set the Jump parameter.


    ![](img/e4b578cd512539e7261e070d87b6550a_31_0.png)


    Figure 2.5 The Animator graph for the RunMan character.'
  merge: -1
  img_proc: true
