- pgno: 53
  md: "```\n// check to see if we need to spawn another\nplatform (based on distance\
    \ travelled)\nif ((distanceCounter >= distanceToSpawnPlatform))\n{\n    SpawnPlatform();\n\
    }\n}\n```\n\nAbove, Update() begins by checking that isRunning is true first.\
    \ If the player is not running, we will never need to spawn any new platforms,\
    \ so it makes sense not to run this code unless we are on the move.\n\ndistanceCounter\
    \ is increased next by runSpeed multiplied by Time.deltaTime. We talked about\
    \ Time.deltaTime in the platform movement script back in Section 2.5. By multiplying\
    \ the runSpeed by deltaTime, we make movement time-based rather than frame based.\
    \ This variable distanceCounter is essentially keeping stock of how far the player\
    \ has run so that we know when to spawn the next platform. The check for that\
    \ comes next in that Update() function:\n\n```\nif ((distanceCounter >= distanceToSpawnPlatform))\n\
    {\n    SpawnPlatform();\n}\n```\n\nWhenever distanceCounter goes over our set\
    \ distanceToSpawnPlatform, we make a call to spawn a new platform – remember that\
    \ SpawnPlatform() also resets distanceCounter so that another platform will be\
    \ spawned at the same distance again (give or take the small randomization adjustment\
    \ made at the end of SpawnPlatform()).\n\nAnd that's it for programming the game!\
    \ We need to jump back to Unity and set up some references on the Component via\
    \ the Inspector, but when it comes to programming, we have all the logic now to\
    \ make the gameplay work. Save the script and return to Unity to set up the Component.\n\
    \n# 2.7.3 Setting Up the RunMan_GameManager Component in the Editor\n\nIn the\
    \ Hierarchy, click on the GameManager to highlight it and show its properties\
    \ in the Inspector. In the Inspector, scroll down to the bottom of the Components\
    \ to show the groups of fields such as Run Speed, Distance to Spawn Platforms\
    \ and so on as shown in Figure 2.14.\n\n![](img/e4b578cd512539e7261e070d87b6550a_53_0.png)\n\
    \nFigure 2.14 The RunMan_GameManager fields reference other GameObjects in the\
    \ main Scene that the Game Manager needs to create instances of or communicate\
    \ with."
