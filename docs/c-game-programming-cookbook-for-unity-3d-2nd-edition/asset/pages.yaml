- pgno: 190
  md: "```\n[Header(\"Movement\")]\npublic bool isStationary;\npublic float moveSpeed\
    \ = 30f;\npublic bool faceWaypoints;\n```\n\nSkipping through the variables, the\
    \ only thing to note above is the class declaration deriving from BaseEnemyStatsController\
    \ as mentioned at the start of the section.\n\n```\npublic override void Update()\n\
    {\n    UpdateCurrentState();\n    DoMovement();\n}\n```\n\nUpdate() is called\
    \ by the engine automatically and it is where we call for main AI updates to happen.\
    \ We call out to UpdateCurrentState() and DoMovement().\n\n```\npublic override\
    \ void UpdateCurrentState()\n{\n    // reset our inputs\n    horz = 0;\n    vert\
    \ = 0;\n\n    obstacleFinderResult = IsObstacleAhead();\n}\n```\n\nUpdateCurrentState()\
    \ is at the core of our state machine. The BaseAIController had a placeholder\
    \ function, but here we override it and put it to some real use. We start by resetting\
    \ the horz and vert inputs so that they start out at zero each pass. We then call\
    \ out to IsObstacleAhead() to check the path, with its return value going into\
    \ the variable obstacleFinderResult. This variable will be used by one or more\
    \ of the functions we call from the oncoming case statement that will react to\
    \ the current state, so we populate it here to avoid having to repeat calls to\
    \ it each time further on.\n\n```\nswitch (currentAIState)\n{\n    // -------------------------\n\
    \    case AIState.move_looking_for_target:\n        LookForTarget();\n       \
    \ break;\n    case AIState.chasing_target:\n        ChasingTarget();\n       \
    \ break;\n    // -------------------------\n}\n```\n\nThis function is called\
    \ every frame, which means the logic we place in this case statement will be called\
    \ each frame too. This is, essentially, the main loop for our AI states.\n\nThe\
    \ code above is relatively straightforward – in each case, we check to see if\
    \ currentAIState matches our case and, if it does, call a function to perform\
    \ everything we want to do every frame in that state. For example, we call LookForTarget()\
    \ when the currentAIState is AIState.move_looking_for_target. When the state is\
    \ AIState.chasing_target, we call ChasingTarget().\n\nThe code for each state\
    \ has been split out into an individual function, which makes it easier to debug\
    \ later. Having big chunks of code inside a massive case statement is a recipe\
    \ for disaster, so it is better to split them out like this to save headaches!"
