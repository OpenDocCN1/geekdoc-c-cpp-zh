- pgno: 251
  md: "The last line of this function calls LockPlayers() to hold all of the players\
    \ in place at the start of the game – they will stay locked until the countdown\
    \ introduction has finished, at which point code elsewhere in this class will\
    \ call to unlock them all again.\n\n```\nvoid StartRace()\n{\n    // play start\
    \ race sound\n    _soundController.PlaySoundByIndex(1);\n\n    // the SetPlayerLocks\
    \ function tells all players to\n    LockPlayers(false);\n\n    // tell the global\
    \ race manager that we are now\n    GlobalRaceManager.instance.StartRace();\n\
    }\n```\n\nStartRace() is called when the countdown finishes, and we are ready\
    \ to actually get the race going.\n\nAbove, _soundController plays a nice sound\
    \ effect to tell the player to go. The variable _soundController points to a BaseSoundController\
    \ script attached to the GameManager in our core Scene, which is used to play\
    \ incidental sounds. When we call it with PlaySoundByIndex(), the BaseSoundController\
    \ script will play a sound at the world position 0,0,0 and with a very wide drop-off\
    \ area so that our Audio Listener will 'hear' it.\n\nWe unlock all of the players\
    \ next, passing false as a parameter into the function LockPlayers(). After that,\
    \ we need to tell the GlobalRaceManager class that we are ready to race too –\
    \ so that it will start tracking positions and so on – so there's a quick call\
    \ to GlobalRaceManager's instance (reminder: GlobalRaceManager is a Singleton!)\
    \ to StartRace().\n\nNext up is the LockPlayers() function:\n\n```\nvoid LockPlayers(bool\
    \ aState)\n{\n    // tell all the players to set their locks\n    for (int i =\
    \ 0; i < numberOfRacers; i++)\n    {\n        RacePlayerController aRaceCarController\
    \ =\n            _playerList[i];\n        aRaceCarController.SetLock(aState);\n\
    \    }\n}\n```\n\nCalled a few times by this class already, the LockPlayers()\
    \ function tells players whether or not they should be allowed to move. As discussed\
    \ in Chapter 6 (Section 6.2), locking the vehicles will constrain them along their\
    \ x and z axis but not on the y axis. This is so that the vehicle will still be\
    \ affected by gravity. If the vehicle's y axis were locked too, it would sit exactly\
    \ at its start position in the game world, possibly floating, and not in its natural\
    \ rested suspension state.\n\nThe code to lock our vehicles in place is in the\
    \ RacePlayerController class. What we do here is to iterate through all the RacePlayerController\
    \ instances held in the List playerList[] – which was populated back in the SetupPlayers()\
    \ function – and we call SetLock() on each one. SetLock() takes a Boolean as its\
    \ parameter, stating whether or not to lock the vehicle."
