    }\n```\n\nIn ShowFinalMessage() we do pass true into SetActive() on the _finalText\
    \ GameObject, to make it active in the Scene.\n\n```\npublic void HideWrongWay()\n\
    {\n    _wrongWaySign.SetActive(false);\n}\n\npublic void ShowWrongWay()\n{\n \
    \   _wrongWaySign.SetActive(true);\n}\n```\n\nBoth HideWrongWay() and ShowWrongWay()\
    \ use SetActive() to hide or show their GameObjects respectively.\n\n```\npublic\
    \ void ShowCount(int whichOne)\n{\n    switch(whichOne)\n    {\n        case 0:\n\
    \            _count1.SetActive(false);\n            _count2.SetActive(false);\n\
    \            _count3.SetActive(false);\n            break;\n        case 1:\n\
    \            _count1.SetActive(true);\n            _count2.SetActive(false);\n\
    \            _count3.SetActive(false);\n            break;\n        case 2:\n\
    \            _count1.SetActive(false);\n            _count2.SetActive(true);\n\
    \            _count3.SetActive(false);\n            break;\n        case 3:\n\
    \            _count1.SetActive(false);\n            _count2.SetActive(false);\n\
    \            _count3.SetActive(true);\n            break;\n    }\n}\n```\n\nShowCount()\
    \ takes an integer as a parameter, who represents which part of the countdown\
    \ should be shown. We could just as easily write a function using a loop that\
    \ would have avoided duplicating the SetActive statements in each case, but sometimes\
    \ it can be just as easy (and quick) to write them out. Feel free to improve this\
    \ function, if you so wish!"
