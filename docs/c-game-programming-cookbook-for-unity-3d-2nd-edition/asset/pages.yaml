- pgno: 217
  md: "The only things of note in the code above is that we use the GPC framework\
    \ namespace and Unity's RequireComponent() is used to make sure that we have a\
    \ BaseProfileManager Component attached to the same GameObject.\n\n```\npublic\
    \ class MenuWithProfiles : BaseMainMenuManager\n{\n    public BaseProfileManager\
    \ _profileManager;\n    public override void Init()\n    {\n        _profileManager\
    \ = GetComponent<BaseProfileManager>();\n    }\n}\n```\n\nAbove, as mentioned\
    \ earlier the class derives from BaseMainMenuManager to provide its menu functionality.\
    \ Next up is a variable _profileManager to store a reference to the BaseProfileManager\
    \ Component, which is set up in the Init() function using GetComponent() to find\
    \ it.\n\n```\n// init the profile manager to get preferences from\n_profileManager.Init();\n\
    ```\n\nProfileManager needs to be initialized, since it stores and accesses profile\
    \ data and if we will not be able to access data before it has either been loaded\
    \ or set up for the first time.\n\n```\n// need to grab profile volumes before\
    \ base.Init sets up the UI sliders\nLoadProfileVolumes();\n```\n\nIn this function,\
    \ we call the function LoadProfileVolumes() to grab volume information from the\
    \ ProfileManager and set volumes on the AudioMixer.\n\n```\n// now we can run\
    \ the base init - we've set up the profile info\nbase.Init();\n}\n```\n\nAs this\
    \ class derives from BaseMainMenuManager, once it has done its own additional\
    \ initialization in the Init() function we need to call Init() on the base class\
    \ so that the main menu runs through its initialization for the main menu too.\n\
    \n```\nvoid LoadProfileVolumes()\n{\n    // get volume values from profile manager\n\
    \    _theAudioMixer.SetFloat(\"SoundVol\",\n    _profileManager.GetSFXVolume());\n\
    }\n\n_theAudioMixer.SetFloat(\"MusicVol\",\n_profileManager.GetMusicVolume());\n\
    ```\n\nAbove, the LoadProfileVolumes() function uses SetFloat on the AudioMixer\
    \ to set its SoundVol property. The volume level comes in from a call to the GetSFXVolume()\
    \ function of the ProfileManager, which will either be at a level set on a previous\
    \ run and saved to the save profile or its default value of 0. This value is in\
    \ decibels, so 0 is not silent but instead Unity's default audible volume for\
    \ an AudioMixer.\n\nAbove, the process for setting the music volume is the same\
    \ as we set the sound effects only the volume comes in from GetMusicVolume() and\
    \ we set the MusicVol property on the AudioMixer this time to affect the music\
    \ levels."
