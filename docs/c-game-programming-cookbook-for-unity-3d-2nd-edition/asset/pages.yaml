  md: 'For now, that is as far as we need to take the Game Manager. There will be
    more later in the chapter, but this is enough to get going with and enough to
    provide the game platforms with the information they need to move.


    # ## 2.5 Making Platforms to Run On


    At the core of this game are platforms to run on, so that is a great starting
    point. As the platforms do not require any game specific code, we can go ahead,
    and figure out a method to spawn them and move them before adding game logic.


