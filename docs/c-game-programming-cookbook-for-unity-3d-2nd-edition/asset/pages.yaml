    \ for this book. You can use this script for input, or you could replace the input\
    \ system with whatever you need just as long as you feed the variables named horz\
    \ and vert with horizontal and vertical input values as floats.\n\n```\n```csharp\n\
    public void SetUserInput( bool setInput )\n{\n    canControl= setInput;\n}\n```\n\
    ```\n\nAbove, the SetUserInput() function is used to set the variable canControl,\
    \ which is used to check whether user input should be disabled or not. This is\
    \ just a nicer way of allowing other scripts to enable or disable user input.\n\
    \nHaving input separated into a single GetInput() function should make it easy\
    \ to customize inputs if required. We deal with calling to update the input in\
    \ the GetInput() function, next:\n\n```\n```csharp\npublic virtual void GetInput()\n\
    {\n    if (isFinished || isRespawning || !canControl)\n    {\n        horz = 0;\n\
    \        vert = 0;\n        return;\n    }\n```\n```\n\nAbove, the start of GetInput()\
    \ checks that we are supposed to be controlling the player. If not, the horizontal\
    \ and vertical inputs for the character controller are locked at zero and we drop\
    \ out of this function. Otherwise, we need to get the inputs from the BaseInputController\
    \ Component:\n\n```\n```csharp\n    if (!canControl)\n        return;\n\n    horz\
    \ = _inputController.GetHorizontal();\n    vert = _inputController.GetVertical();\n\
    }\n```\n```"
