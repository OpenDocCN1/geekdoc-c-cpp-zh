  md: '6. Vehicles – Both AI and user controlled vehicles use the exact same prefabs.
    When the prefabs are first instantiated into the Scene, properties are set on
    the prefab instances Components to make each behave differently, such as enabling
    and disabling AI control. The Components we need for the player prefabs are:


    +   - BaseUserManager from Chapter 3, Section 3.2.1

    +   - The WheeledVehicleController class from Chapter 6, Section 6.2

    +   - A Race Input Controller Component for input

    +   - Steering AI Glue to connect the AI system to the steering of a vehicle:
    the SteeringAI Glue class derives from AI SteeringController from Chapter 10.

    +   - Camera Target to make sure the Camera looks at the right GameObject

    +   - A Texture Setter Component, to set the texture of the user vehicle to on
    different to that of the AI players so that players can easily tell who they are

    +   - Race Player Controller – a Component used to communicate with the Global
    Race Manager Component

    +   - Position Graphic Setter – which shows the players current position in a
    small display above the vehicle

    +   - Car Audio – a Component for vehicle sounds and hits

    +   - Fake Friction – a helper script to increase friction and make the vehicle
    easier to drive


    7. User Interface – The user interface for in game will use a basic script to
    display the current lap and to show or hide other GameObjects and/or Canvas as
    needed.


    8. Sound Controller – The BaseSoundController class from Chapter 9, Section 9.2


    9. A RaceUIManager Component will be used to ‘pass’ information from other scripts
    into the user interface.


    10. BaseUserManager is used by both the player and the RaceGameManager class to
    access player information. RaceGameManager uses BaseUserManager at the start of
    each level, to decide which types of players to spawn into the game (AI controller
    or user).


    11. IsoCamController is a basic class for controlling a Camera suitable for isometric
    rendering. This is attached to a parent GameObject, with the Camera as a child
    object offset.


    Scripts for this chapter can be found in the folder Assets/Games/Racing Game/Scripts.'
