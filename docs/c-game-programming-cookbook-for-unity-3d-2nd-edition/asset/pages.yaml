  md: "a while loop so that it will continue to execute the code between the curly\
    \ brackets right up until the Scene has finished loading. Inside the brackets,\
    \ the line yield return null. Whenever you do not use a yield, the co-routine\
    \ will run the loop until it is done. The yield tells our code to wait until the\
    \ next frame before continuing to run. The code above checks isDone every frame\
    \ so that the load process can continue and asyncLoad can be updated. Without\
    \ continuing Unity's regular operations, asyncLoad would never update, and the\
    \ loading would never complete.\n\n```\nAsyncOperation asyncLoad2 = SceneManager.LoadSceneAsync(coreSceneName,\
    \ LoadSceneMode.Additive);\n```\n\nNow that the level Scene has finished loading,\
    \ above we start the next load with another call to SceneManager.LoadSceneAsync.\
    \ This time, we pass in the coreSceneName to tell it to load the core Scene. Again,\
    \ the LoadSceneMode is additive so that it will not interfere with the level already\
    \ in memory.\n\n```\n// Wait until the asynchronous scene fully loads\nwhile (!asyncLoad2.isDone)\n\
    {\n    yield return null;\n}\n```\n\nAbove, the same procedure as for level loading\
    \ in that we poll isDone and yield each frame until the Scene is ready to go.\
    \ Now that our two Scenes are loaded, we can move on to getting them set up and\
    \ running:\n\n```\n// disable the camera before the scene starts to avoid Unity\
    \ getting stuck in some sort of complaining loop\n// about more than one camera\
    \ in the scene :(\nCamera.main.gameObject.SetActive(false);\n```\n\nA little diversion\
    \ above, as we need to deal with a little problem that occurs when Unity detects\
    \ more than one Camera in a Scene – it reports an error to the debug log console.\
    \ At the time of writing, a bug in the engine causes the error to continue being\
    \ reported even after any additional Cameras have been removed. Although it may\
    \ be possible there is a way to rearrange this sequence of events so that Unity\
    \ does not do this, the only solution I could find was to set the current main\
    \ Camera's active state to false – effectively disabling the Camera before Scene\
    \ activation happens.\n\n```\nSceneManager.MergeScenes(SceneManager.\nGetSceneByName(whichLevel),\n\
    SceneManager.GetSceneByName(coreSceneName));\nSceneManager.SetActiveScene(SceneManager.\n\
    GetSceneByName(coreSceneName));\n```\n\nThe next part of the co-routine uses SceneManager's\
    \ MergeScenes() function to take the two Scenes loaded earlier in the code and\
    \ merge them into a single, new Scene in memory. Note that the merged Scene does\
    \ not exist on disk, only in memory. To merge the two Scenes, SceneManager.MergeScenes\
    \ takes two Scene references as parameters – which we get by using SceneManager.GetSceneByName().\
    \ Using GetSceneByName() means we can get references to the correct Scenes by\
    \ using the string passed into the co-routine (the level Scene name string) and\
    \ the string in the variable coreSceneName. When you use"
