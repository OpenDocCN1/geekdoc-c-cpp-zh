- pgno: 127
  md: "The math behind the friction system is beyond the scope of this book, though\
    \ Unity documentation has coverage of the subject on the WheelCollider page of\
    \ the online help.\n\nBaseWheeledVehicle uses four WheelColliders for drive, and\
    \ orientation of wheel meshes is dealt with by a script called BaseWheelAlignment.cs\
    \ explained later in the chapter.\n\nThe class derives from ExtendedCustomMonoBehaviour\
    \ (as discussed in Chapter 4 of this book) which adds a few commonly used variables.\n\
    \nBaseWheeledVehicle.cs starts like this:\n\n```\n```csharp\nusing UnityEngine;\n\
    namespace GPC\n{\n    [AddComponentMenu(\"CSharpBookCode/Base/Vehicles/Wheeled\
    \ Vehicle Controller\")]\n    [RequireComponent(typeof(Rigidbody))]\n}\n```\n\
    ```\n\nAbove, we start the class with the usual reference to UnityEngine, and\
    \ then add a menu item for this Component. Having a Rigidbody Component on the\
    \ same GameObject this script is attached to is important. The next tag (those\
    \ lines wrapped in square brackets are what Unity refers to as tags) is a RequireComponent.\
    \ This will check to see if a Rigidbody is attached to our GameObject and will\
    \ add one, if needed. We then set the namespace that all the framework comes under,\
    \ our GPC namespace.\n\nNow into the class:\n\n```\n```csharp\npublic class BaseWheeledVehicle\
    \ : ExtendedCustomMonoBehaviour\n{\n    public bool isLocked;\n    [Header(\"\
    Wheel Colliders\")]\n    public WheelCollider _frontWheelLeft;\n    public WheelCollider\
    \ _frontWheelRight;\n    public WheelCollider _rearWheelLeft;\n    public WheelCollider\
    \ _rearWheelRight;\n}\n```\n```\n\nWe use a Boolean variable named isLocked to\
    \ hold a vehicle in place. In the example game, this is used to stop the play\
    \ driving off before the 3,2,1 count completes at the start of the game.\n\nEach\
    \ WheelCollider variable is named based on its intended position; frontWheelLeft,\
    \ frontWheelRight, rearWheelLeft and rearWheelRight. For the script to function\
    \ correctly, WheelColliders need to be referenced (dragged and dropped) into the\
    \ correct variables in the Unity Inspector window on the vehicle script.\n\n```\n\
    ```csharp\npublic BaseInputController _inputController;\n```\n```\n\nThe default\
    \ input system is set to use the BaseInputController class from this book's framework.\
    \ You can, of course, switch out input for whatever you like. We use the _inputController\
    \ variable to talk to BaseInputController and find out what is going on with the\
    \ inputs each update, which happens further down in this class, in the GetInputs()\
    \ function.\n\n```\n```csharp\n[Header(\"Steer settings\")]\npublic float steerMax\
    \ = 30f;\npublic float accelMax = 5000f;\npublic float brakeMax = 5000f;\n```\n\
    ```"
