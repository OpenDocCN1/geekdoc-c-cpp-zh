    # Numbers


    We have seen how to do mathematical calculations with our numbers, of course:


    Python

    >>> 1 + 2 * 3

    7


    Even quite large calculations:


    Python

    >>> 1000000000 + 2000000000 * 3000000000

    6000000001000000000


    Using the _ underscore key to split up the numbers is optional, but helps with
    readability:


    Python

    >>> 1_000_000_000 + 2_000_000_000 * 3_000_000_000

    6000000001000000000


    Python reduces the mathematical expression 1 + 2 * 3 to the value 7 and then prints
    it to the screen. This expression contains the operators + and * and their operands
    1, 2, and 3.


    How does Python know to calculate 1 + 2 * 3? Following known rules, just like
    we would. We know that the multiplication here should be done before the addition,
    and so does Python. So the calculation goes like this:


    > $1+2\times3$$

    \implies 1+6$$

    \implies 7$


    The piece being processed at each stage is underlined. We say that the multiplication
    operator has higher precedence than the addition operator. Here are some of Python''s
    operators for arithmetic:'
