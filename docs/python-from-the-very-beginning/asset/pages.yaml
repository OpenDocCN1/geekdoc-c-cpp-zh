    from import ... to access definitions and functions from another module. As know,
    the functions from a module can be used by putting a period (full stop) between
    the module name and the function. As an example, the perm function in the math
    module can be used like this:


    ```

    Python

    >>> import math

    >>> math.perm(5, 2)

    20

    ```


    We can use from... import * to import all definitions from a script:


    ```

    Python

    >>> from math import *

    >>> perm(5, 2)

    20

    ```


    We would not normally do with this with Standard Library modules: names may clash
    with our own functions, leading to bugs. We can reduce this problem by importing
    only the functions we want:


    ```

    Python

    >>> from math import perm, factorial

    >>> perm(5, 2)

    20

    >>> factorial(10)

    3628800

    >>> ceil(2.3)

    Traceback (most recent call last):

    File "<stdin>", line 1, in <module>

    NameError: name ''ceil'' is not defined

    ```


    In any event, if we need to use a function with a long name several times, we
    can rename it ourselves:


    ```

    Python

    >>> import math

    >>> fac = math.factorial

    ```'
