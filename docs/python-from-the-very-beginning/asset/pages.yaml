    # Going round again


    A recursive function is one which uses itself in its own definition. Consider
    calculating the factorial of a given number - for example the factorial of 4 (written
    as 4!) is 4 x 3 x 2 x 1. Here is a recursive function to calculate the factorial
    of a positive number.


    ```

    Python

    >>> def factorial(a):

    ...    if a == 1:

    ...        return 1

    ...    else:

    ...        return a * factorial(a - 1)

    ```


    For example:'
