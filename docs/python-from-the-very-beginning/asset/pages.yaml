  md: 'Such comprehensions provide a concise readable way to produce lists of items
    meeting certain criteria, without having to iterate over them with a for loop.


    # Common problems


    The strange formulation of the join mechanism, as a method on the string which
    is used to glue the other together, can lead to confusion. Consider, for example,
    the following two strings:


    ```

    Python

    >>> x = ''marginal''

    >>> y = ''''

    ```


    We intend to write the following:


    ```

    Python

    >>> y.join(x)

    ''marginal''

    ```


    But if we get the strings in the wrong order, the operation still succeeds, but
    the result is not what we wanted:


    ```

    Python

    >>> x.join(y)

    ''''

    ```


    The find method on strings has a way of signalling failure which we have not seen
    before: instead of returning an error, it returns normally but with of -1. We
    must check for this, otherwise the -1 may be used unwittingly by the rest of the
    program without errors, for example in a slice:


    ```

    Python

    >>> ''Once'' [-1]

    ''e''

    ```


    # Summary


    We have learned about some of the connections between strings and lists, two kinds
    of ordered data structure. We have manipulated strings by splitting and joining
    them, and found strings within one another. We have introduced the important topic
    of sorting. We have seen maps and filters, which powerful mechanisms for processing
    lists. We have shown how iterators can simplify list-heavy programs. Finally,
    we have looked at list comprehensions, a way of combining one or more of these
    mechanisms together.'
