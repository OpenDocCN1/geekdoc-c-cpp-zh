    # Preface


    I have tried to write a book which has no prerequisites – and with which any intelligent
    person ought to be able to cope, whilst trying to be concise enough that a programmer
    experienced in another language might not be too annoyed by the pace or tone.


    This may not be the last book you read on Python, but one of the joys of Python
    is that substantial, useful programs can be constructed quickly from a relatively
    small set of constructs. There is enough in this book to build such useful programs,
    as we see in the four extended projects.'
