  md: 'So far, if we wished to use a sub-expression twice or more in a single expression,
    we had to type it multiple times:


    ```

    Python

    >>> 200 * 200 * 200

    8000000

    ```


    Instead, we can define our own name to stand for the result of evaluating an expression,
    and then use the name as we please:


    ```

    Python

    >>> x = 200

    >>> x * x * x

    8000000

    ```


    We can update the value associated with the name and try the calculation again:


    ```

    Python

    >>> x = 200

    >>> x * x * x

    8000000

    >>> x = 5 + 5

    >>> x * x * x

    1000

    ```


    Because of this ability to vary the value associated with the name, things like
    x are called variables. We can use any name we like for a variable, so long as
    it does not clash with any of Python''s built in keywords:


    and as assert async await break class def elif else except finally from global
    if import in lambda nonlocal not or pass return try while yield


    In Python, we use lower case letters or words for variable names. For example
    x, weight, or total. If we wish to use multiple words, we separate with underscores.
    For example first_string or total_of_subtotals.


