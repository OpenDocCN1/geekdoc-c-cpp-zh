  md: 'In chapter 11 we introduce the Python Standard Library, greatly expanding the
    pre-built components at our disposal. We learn how to look up functions in Python''s
    official documentation.


    In chapter 12 we build stand-alone programs which can be run from the command
    line, as if they were built into the computer. We are now ready to begin on larger
    projects.


    # # Projects


    In project 1 we draw all sorts of pretty pictures by giving the computer instructions
    on how to draw them line by line. We make a graph plotter and a visual clock program.


    In project 2 we write a calorie-counting program which stores its data across
    several files, and allows multiple users. We build an interface for it, with several
    different commands. We learn how to use a standard data format, so that spreadsheet
    programs can load our calorie data.


    In project 3 we investigate the childhood game of Noughts and Crosses, writing
    human and computer players, and working out some statistical properties of the
    game by building a structure containing all possible games.


    In project 4 we learn how to manipulate photographs, turning them into greyscale,
    blurring them, and making animations from them.


