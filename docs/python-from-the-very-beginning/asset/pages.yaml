- img_proc: true
  md: '| Operator | Description |

    | --- | --- |

    | a == b | true if a and b are equal |

    | a < b | true if a is less than b |

    | a <= b | true if a is less than equal to b |

    | a > b | true if a is more than b |

    | a >= b | true if a is more than equal to b |

    | a != b | true if a is not equal to b |


    There are two operators for combining boolean values (for instance, those resulting
    from the comparison operators). The expression a and b evaluates to True if expressions
    a and both evaluate to True. The expression or b evaluates to True if a evaluates
    to True or b evaluates to True, or both do. Here are some examples of these operators
    in use:


    ```

    Python

    >>> 1 == 10 > 9

    True

    >>> 1 == 1 or 9 > 10

    True

    ```


    In each case, the expression a will be tested first – the second may not need
    to be tested at all. The operator is performed before or, so a and b or c is the
    same as (a and b) or c. The expression not gives True if a is False and vice versa:


    ```

    Python

    >>> not 1 == 1

    False

    >>> 1 == 2 or not 9 > 10

    True

    ```


    The comparison operators have a higher precedence than the so-called logical operators:
    so, for example, writing not 1 == 1 is the same as writing not (1 == 1) rather
    than (not 1) == 1.


