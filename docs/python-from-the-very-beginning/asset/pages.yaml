    \ key not found |\n| NameError | The variable was not found |\n| TypeError | A\
    \ value of the wrong type was given e.g int([i]) |\n| ValueError | An invalid\
    \ value of correct type was given e.g int('fish') |\n\nHere is an example of the\
    \ NameError exception:\n\n```\nPython\n>>> add3(x, y): return x + y + z\n...\n\
    >>> add3(1, 2)\nTraceback (most recent call last):\nFile \"<stdin\", line 1, in\
    \ <module>\nFile \"<stdin\", line 1, in add3\nNameError: name 'z' is not defined\n\
    >>> z = 10\n>>> add3(1, 2)\n13\n```\n\nNotice that z does not have to be defined\
    \ after the definition of add3 – it may be supplied afterward. This is rather\
    \ bad practice through, of course.\n\n# Raising exceptions ourselves\n\nAs well\
    \ as handling the standard exceptions, we can raise ourselves with the raise construct.\
    \ Here is a function to build a list of repeated elements:\n\n```\ndef repeated(e,\
