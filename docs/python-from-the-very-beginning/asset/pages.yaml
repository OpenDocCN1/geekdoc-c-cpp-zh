  md: "First, we shall write a function that looks at a single guess calculates how\
    \ many are a) the correct number in the correct place and b) the correct number\
    \ in the incorrect place. This is surprisingly delicate, since we must make sure\
    \ not to double count anything – for example, if the code is 1441 and the guess\
    \ is 4444 we should identify two 4s as correct numbers in the correct places,\
    \ but the other two 4s are not identifying as correct numbers in the wrong place,\
    \ we have already used up all 4s in the correct place.\n\nOur function will use\
    \ two lists of four numbers each, the code and the guess. We copy them, since\
    \ we will be changing values in the lists to mark them used. We then set up two\
    \ counters, to keep track of how many numbers are correct and in the right place,\
    \ or correct or in the wrong place.\n\n```\nimport random\n\ndef check_code_guess(code,\
    \ guess):\n    code = code.copy()\n    guess = guess.copy()\n    correct = 0\n\
    \    correct_place = 0, 4\n    for x in range(0, 4):\n        if guess[x] == code[x]:\n\
    \            correct = correct + 1\n            code[x] = -1\n    for x in range(0,\
    \ 4):\n        if guess[x] > -1:\n            correct_place = correct_place +\
    \ 1\n            code.index(guess[x])] = -1\n    print('Number in correct place:\
    \ ' + str(correct))\n    print('Number in incorrect place: ' + str(correct_place))\n\
    \    return code == guess\n```\n\nThe function returns true if the code is completely\
    \ correct, and False otherwise. Now we can write the main function which the user\
    \ uses for a guess repeatedly:\n\n```\ndef code_guesser():\n    a = random.randint(1,\
    \ 9)\n    b = random.randint(1, 9)\n    c = random.randint(1, 9)\n    d = random.randint(1,\
    \ 9)\n    code = [a, b, c, d]\n    tries = 1\n    i = input()\n    guess = [int(i[0]),\
    \ int(i[1]), int(i[2]), int(i[3])]\n    while guess != code:\n        if check_code_guess(code,\
    \ guess):\n            pass\n        else:\n            tries = tries + 1\n  \
    \          i = input()\n            guess = [int(i[0]), int(i[1]), int(i[2]),\
    \ int(i[3])]]\n```\n\nprint('Correct. You took ' + str(tries) + ' guesses.')"
