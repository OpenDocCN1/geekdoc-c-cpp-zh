  md: "To flip horizontally, we range over the left hand half of the image, swapping\
    \ pixels with the equivalents on the right hand side.\n\n```\ndef hflip(i):\n\
    \    p = i.load()\nsx, sy = i.size\nfor x in range(sx // 2):\n        for y in\
    \ range(sy):\n            r = p[x, y]\n            p[x, y] = p[sx - x - 1, y]\n\
    \            p[sx - x - 1, y] = r\n```\n\nIf the image has odd width, the middle\
    \ column is not touched. As consequence of the rounding-down behaviour of the\
    \ // operator. A similar function can be written for the vertical flip:\n\n```\n\
    def vflip(i):\n    p = i.load()\nsx, sy = i.size\n    for y in range(sy // 2):\n\
    \        for x in range(sx):\n            r = p[x, y]\n            p[x, y] = p[x,\
    \ sy - y - 1]\n            p[x, sy - y - 1] = r\n```\n\nRotation by 180 degrees\
    \ is a simple combination of the two (try it with a piece of paper you have marked\
    \ the corners of):\n\n```\ndef rotate180(i):\n    hflip(i)\n    vflip(i)\n```\n\
    \n# 3\n\nThe changes are simple:\n\n```\ndef blur_in_place(i):\n    p = i.load()\n\
    sx, sy = i.size\n    for x in range(3, sx - 3):\n        for y in range(3, sy\
    \ - 3):\n            sum, sum, sum = 0, 0, 0\n            for dx in range(-1,\
    \ 2):\n                for dy in range(-1, 2):\n                    sourcer, sourcec,\
    \ sourceb = p[x + dx, y + dy]\n                    sum = sum + sourcer\n     \
    \               sum = sum + sourcec\n                    sum = sum + sourceb\n\
    p[x, y] = (int(sum / 9), int(sum / 9), int(sum / 9))\n```\n\nWe can test by blurring\
    \ three times, just like we did with our original blur function. The new (right)\
    \ and old (left) results are similar but not the same - the in-place blur is blurry."
