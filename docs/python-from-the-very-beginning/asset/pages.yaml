  md: '# 3. Again and Again


    In the previous chapter we used recursion to perform a calculation variable number
    of times, and noted its limitations in Python. In this chapter, we learn the ordinary
    Python way of handling such situations.


    # A fixed number of times


    The for in range(a, b) structure can be used to do something a number of times.
    For example, to print each of the numbers in the range in turn:


    ```

    for x in range(0, 5):

    print(x)

    ```


    The expressions inside the for construct (or loop, as we call it) will be run
    once for each number in the range. Here is what we see on the screen:


    +   0

    1

    2

    3

    4


    We can see that the two arguments to the range function specify where to start,
    and where to stop, before 5. And so, the numbers 0 to 4 inclusive are printed.
    This behaviour is useful when programming, but unintutive to humans. Let us write
    a function to print the numbers ...n as a human might expect:


    ```

    print_upto(n):

    for x in range(1, n + 1):

    print(x)

    ```


    So now, print_upto(5) will print this:


    +   1

    2

    3

    4

    5


    What if we want the numbers to be printed all on the same line? The Python print
    function moves to the next line by default. We can suppress this behaviour by
    supplying an alternative end to the line (print usually ends the line with a called
    a newline character):


    ```

    print_upto(n) =

    for x in range(1, n + 1):

    print(x, end='' ''

    ```'
