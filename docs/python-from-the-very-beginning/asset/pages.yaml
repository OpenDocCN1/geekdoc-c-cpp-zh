  md: 'Answers and Hints are at the back of the book.


    # Chapters


    In chapter 1 we begin our exploration of Python with a series of preliminaries,
    introducing ways to calculate with the whole numbers, compare them with one another,
    and print them out. We learn about truth values and the other types of simple
    data that Python supports.


    In chapter 2 we build little Python programs of our own, using functions to perform
    calculations based on changing inputs. We make decisions using conditional constructs
    to choose different courses of action.


    In chapter 3 we learn about Python constructs which perform actions repeatedly,
    for a fixed number of times or until a certain condition is met. We are to build,
    more useful programs, including interactive ones which depend upon input from
    the keyboard.


    In chapter 4 we begin to build and manipulate large pieces of data by combining
    into lists, querying and processing them. This increases considerably the scope
    of programs we can write.


    In chapter 5 we expand our work with lists to manipulate strings, splitting them
    into words, processing them, and putting them back together. We learn how to sort
    lists into order, and how to build lists from scratch using comprehensions.


    In chapter 6 we learn about printing messages and data to the screen, and use
    this knowledge to print nicely-formatted tables of data. We learn how to write
    such data to a file on the computer, instead of the screen.


    In chapter 7 we learn another way of storing data - dictionaries which allow us
    to build databases, looking up data by searching for it by name. We work with
    sets, which allow us to store collections of data without repetition, in the same
    way as mathematical sets.


    In chapter 8 we deal with the thorny problem of errors: what do we do when an
    input is unexpected? When we find a number when we were expecting a list? When
    an item is not found in a dictionary? We learn how to report, handle, and recover
    from these errors.


    In chapter 9 we return to the subject of files, learning how to read from them
    as well as write them, and illustrate with a word count program. We deal with
    errors, such as the unexpected absence of a file.


    In chapter 10 we talk about real numbers, which we have avoided thus far. We show
    how to calculate with the trigonometric functions and how to convert whole and
    real numbers by rounding.'
