    # Sorting


    Now, we leave strings and return to lists. We often need to sort a list into increasing
    order prior to further processing. This can be achieved with the sort method:


    ```

    Python

    >>> 1 = [1, 2, 3, 2, 1, 3, 2]

    >>> 1.sort()

    >>> 1

    [1, 1, 2, 2, 2, 3, 3]

    ```


    The list is sorted in-place. The sorted function, on the other hand, returns a
    new, sorted version of the list, leaving the original list alone.


    ```

    Python

    >>> 1 = [1, 2, 3, 2, 1, 3, 2]

    >>> sorted(1)

    [1, 1, 2, 2, 2, 3, 3]

    >>> 1

    [1, 2, 3, 2, 1, 3, 2]

    ```


    This is useful when we want to, for example, iterate over a list in sorted order
    but leave the original data intact for later use.'
