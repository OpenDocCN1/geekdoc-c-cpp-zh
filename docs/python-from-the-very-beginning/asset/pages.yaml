  md: '# Two useful functions: map and filter


    There are two built-in functions for producing lists by modifying other lists.
    The first is map which applies a function to each element of a list:


    Python


    ```

    >>> 1 = [1, 2, 3, 4, 5]

    >>> def square(x): return x * x

    ...

    >>> list(map(square, 1))

    [1, 4, 9, 16, 25]

    ```


    Python


    ```

    >>> 1 = [1, 2, 3, 4, 5]

    >>> def even(x): return x % 2 == 0

    ...

    >>> list(filter(even, 1))

    [2, 4]

    ```


    You can imagine how these functions can be used instead of for loops, leading
    to shorter and easier to understand programs. As programmers, we spend a lot of
    our time reading programs we have already written (or reading programs by others),
    compared with the time we spend writing new ones, so such ease of understanding
    is very important.


    # Iterators


    We have just written this fragment, making use of map:


    Python


    ```

    >>> 1 = [1, 2, 3, 4, 5]

    >>> def square(x): return x * x

    ...

    >>> list(map(square, 1))

    [1, 4, 9, 16, 25]

    ```


    Why did we need to use list to convert the result of map into a list? It is because
    map returns an iterator not a list. An iterator is something which can be used
    to range over a data structure, but does not return a list – it returns items
    one by one. This means that the individual items are not created until they are
    needed. We can use a for loop over an iterator, without needing to make a list
    of it:


    Python


    ```

    >>> 1 = [1, 2, 3, 4, 5]

    ```'
