    # Tuples


    A tuple is a fixed-length collection of values, allowing the whole structure to
    be given a name and to be passed around just like we pass around any other value.
    There are two differences with lists: tuples are of fixed length, and their elements
    may not be altered. Here are some tuples:


    ```

    Python

    >>> t = (1, ''one'')

    >>> t2 = (1, (1, 2), (1, 2, 3))

    ```


    We now have two tuples: the first, t, of length 2, and the second, t2, of length
    3, containing within it other tuples. We can take the tuples apart by assigning
    names. This is called unpacking:


    ```

    Python

    >>> a, b = t

    >>> a

    1

    >>> b

    ''one''

    >>> c, d, e = t2

    >>> c

    1

    >>> d

    (1, 2)

    >>> e

    (1, 2, 3)

    ```'
