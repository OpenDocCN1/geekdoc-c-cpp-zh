  md: '| Operator | Description |

    | --- | --- |

    | a + b | addition |

    | a - b | subtract b from a |

    | a * b | multiplication |


    In addition to our rule about * being performed before + and -, we also need a
    rule to say what is meant by 9 - 4 + 1. Is it (9 - 4) + 1 which is 6, or 9 - (4
    + 1) which is 4? As with normal arithmetic, it is the former in Python:


    ```

    Python

    >>> 9 - 4 + 1

    6

    ```


    This is known as the *associativity* of the operators.


    # Truth and falsity


    Of course, there are many more things than just numbers. Sometimes, instead of
    numbers, we would like to talk about truth: either something is true or it is
    not. For this we use *boolean values*, named after the English mathematician George
    Boole (1815–1864) who pioneered their use. There are just two booleans:


    True

    False


    How can we use these? One way is to use one of the *comparison operators*, which
    are used for comparing values to one another:


    ```

    Python

    >>> 99 > 100

    False

    >>> 4 + 3 + 2 + 1 == 10

    ```


    It is most important not to confuse == = with as the single = symbol means something
    else in Python. Here are the comparison operators:'
