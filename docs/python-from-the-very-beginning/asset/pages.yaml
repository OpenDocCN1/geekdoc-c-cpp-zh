    How does the evaluation of factorial(4) proceed?


    +   factorial(4)

    * factorial(3)

    * (3 * factorial(2))

    * (3 * (2 * factorial(1)))

    * (3 * (2 * 1))

    * (3 * 2)

    * 6

    24


    For the first three steps, the else part of the conditional expression is chosen,
    because the argument a is greater than one. When the argument is equal to one,
    we do not use factorial again, but just evaluate to 1. The expression built up
    of all the multiplications is then evaluated until a value is reached: this is
    the result of the whole evaluation. It sometimes seems possible for a recursive
    function never to finish – what if we try to evaluate factorial(-1)?


    +   factorial(-1)

    * factorial(-2)

    * (-2 * factorial(-3))

    * (-2 * (-3 * factorial(-4)))


    The expression keeps expanding, and the recursion keeps going. Luckily,

    Python tells us what is going on:


    ```

    Python

    >>> factorial(-1)

    Traceback (most recent call last):

