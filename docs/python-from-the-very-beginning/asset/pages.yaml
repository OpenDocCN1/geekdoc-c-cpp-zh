    # Mixing different kinds of number


    When we mix integers and floating-point numbers, Python will automatically convert
    the integer to a floating point so that the operation can work:


    ```

    Python

    >>> 1 + 2 * 3.0

    7.0

    ```


    The integer 2 is converted to the floating-point number 2.0 for the multiplication,
    which results in the floating-point result 6.0. Then the integer 1 must be similarly
    converted to a floating-point number to do the addition and produce the final
    result. The conversion only happens when the expression requires it:


    Sometimes an operation on two integers can produce a floating-point result, for
    integers example using the division operator:


    ```

    Python

    >>> 1 / 2

    0.5

    ```


    You can see how we introduced addition, subtraction, and multiplication in chapter
    1, but left out division. There is an integer division operator too:


    ```

    Python

    >>> 2 // 3

    0

    >>> 10 // 5

    2

    ```


    You can see that this operator calculates just the whole part. We already have
    the % modulus operator to calculate the remainder.


