    # 10. The Other Numbers


    The only numbers we have considered until now have been the whole numbers, or
    integers. For a lot of programming tasks, they are sufficient. And, except for
    their limited range and the possibility of division by zero, they are easy to
    understand and use. However, we must now consider the real numbers.


    # Introducing floating-point numbers


    It is clearly not possible to represent all numbers exactly – they might be irrational
    like e and have no numerical representation. For most uses, a representation called
    floating-point is suitable, and this is how Python’s real numbers are stored.
    Not all numbers can be represented exactly, but arithmetic operations are very
    quick.


    We can write a floating-point number by including a decimal point somewhere in
    it. For 1.6 or 2. or 386.54123. Negative floating-point numbers are preceded by
    the - character just like negative integers. Here are some floating-point numbers
    in Python:


    ```

    Python

    >>> type(1.5)

    <class ''float''>n>>> 6.

    6.0

    >>> -2.3456

    -2.3456

    >>> 1.0 + 2.5 * 3.0

    ```'
