  md: 'Inline functions are seen as a request which may or may not be respected by
    the compiler and all the inline requests are handled by the compiler. But, macro
    is handled by preprocessor and it gets expanded even before the compilation.


    **70. What is the role of a constructor in a C++ program?**


    The sole aim of a constructor is to initialize the objects and destructor stands
    exactly opposite to it.


    **71. Can any other member function of a class have `~` operator as prefix?**


    No it cannot be used. If it is used there wont be any errors, but when calling
    it errors come. It throws “expected class-name before ‘(’”. This treats the call
    as a call for destructor.


    **72. Can a subclass contain the outer class’ destructor or constructor?**


    No. Actually when trying so, it is treated as a new function without return type.
    So throws appropriate errors.


    **73. Is there any change in internally calling a destructor and explicit call
    of a destructor?**


    No. Both implicit and explicit calling of destructor de-allocates the memory of
    the associated object.


    **74. Can a variable have multiple storage classes?**


    No. It gives error “conflicting specifiers in declaration”.


    **75. What is the significance of using ‘auto’ storage class?**


    There is no significance for the ‘auto’. Actually, all local variables are by
    default ‘auto’ so it has no significance in usage. The significance of being ‘auto’
    is to release the unwanted memory held after usage.


    **76. What is ‘register’ used for?**


    Using ‘register’ in declaration requests the compiler to store the variable in
    CPU register instead of RAM. So it stays in memory even after completion of program
    and is faster. But allocating register completely depends on the processor.


    **77. How is ‘static’ significant?**


    It helps in creating a variable that acts as a common attribute for all objects
    of the class. Additionally it helps in having a ‘count’ of objects and constant
    valued attributes.


    **78. How will encapsulation of a class take place when it has ‘static’ members?**


    When an object is created, it gets initial 1 byte memory. Then the compiler allocates
    memory for all non-static members of the class and links it to the memory of the
    object. Also the remaining ‘static’ member’s memory is also associated to the
    particular object.


    **79. Can a static function use a non-static global variable?**


    Yes it can use any variable outside class scope. But inside class scope should
    use only static variables.


    **80. Can a ‘private’ static member be called outside? Will the same syntax work?**


    Consider this code:


    ```

    #include<iostream>

    using namespace std;

    class base

    {

    static int b;

    };

    int base::b = 8;

    int main()

    { cout<<base::b;}

    ```'
