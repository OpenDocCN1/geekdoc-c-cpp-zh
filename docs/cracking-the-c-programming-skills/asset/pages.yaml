  md: "# # 12 EXCEPTION HANDLING\n\nErrors and bugs are always a burden to a professional\
    \ programmer. Exception handling is an intelligent way to handle the various errors\
    \ and bypass them while programming. This chapter introduces you the art of exception\
    \ handling and increase your skill set in debugging.\n\n+   1. Which of the following\
    \ class is the parent class for any exception that may occur in a C++ program?\
    \ (L1)\n+   \n+   (a) Std::ParentException\n+   \n+   (b) Std::Exception\n+  \
    \ \n+   (c) Std::bad_Exception\n+   \n+   (d) Std::invalid_argument\n+   \n+ \
    \  **Answer:** (b) Std::Exception is the parent class of all the exception classes\
    \ present in C++\n\n+   2. Say Yes or No: Can we declare user defined exceptions\
    \ in C++? (L1)\n+   \n+   (a) Yes\n+   \n+   (b) No\n+   \n+   **Answer:** (a)\
    \ Yes. We can declare user defined exceptions by inheriting the Exception class\n\
    \n+   3. Predict the output of the following code snippet, given val1=10, val2=20\
    \ (L2)\n+   \n+   ```cpp\n+   #include <iostream>\n+   #include <exception>\n\
    +   using namespace std;\n+   struct UserDefinedException : public exception\n\
    +   {\n+       const char * what () const throw ()\n+       {\n+           return\
    \ \"Value 2 cannot be greater than value 1\";\n+       }\n+   };\n+   int main()\n\
    +   {\n\n+   ```cpp\n+       int val1,val2;\n+       std::cout<<\"Please enter\
    \ value1\";\n+       std::cin>>val1;\n+       std::cout<<\"Please enter value2\"\
    ;\n+       std::cin>>val2;\n+       try\n+       {\n+           if (val2>val1)\n\
    +               throw UserDefinedException();\n+           else\n+           \
    \    std::cout<<val1/val2;\n+       }\n+       catch(UserDefinedException& e)\n\
    +       {\n+           std::cout << e.what() << std::endl;\n+       }\n+   }\n\
    +   ```\n+   \n+   (a) No output\n+   \n+   (b) Value 2 cannot be greater than\
    \ value 1\n+   \n+   (c) 0\n+   \n+   (d) Compile error\n+   \n+   **Answer:**\
    \ (b) Value2 cannot be greater than value1. Try block compares value1 with value2.\
    \ When value2 is greater than value1, we are throwing user defined exception.\
    \ When we call What() method present in user defined exception class, it prints\
    \ the output statement, Value2 cannot be greater than value1."
