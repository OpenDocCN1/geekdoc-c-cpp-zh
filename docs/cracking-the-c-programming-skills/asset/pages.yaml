  md: '# 8 FUNCTION OVERLOADING AND OVERRIDING


    Function overloading is one of the most useful features of OOP that allows increasing
    the functionality of a program without losing readability. This chapter deals
    in detail about the nooks and corners of function overloading and leads you into
    overriding.


    +   1. Which of the object orientation concepts is used in the below piece of
    code? (L2)

    +   (a) Operator overloading

    +   (b) Function overloading


    ```

    #include <iostream>

    using namespace std;

    class function_echo

    {

    public:

    void echo(int x) {

    cout << "Output: " << x << endl;

    }

    void echo(double y) {

    cout << "Output: " << y << endl;

    }

    void echo(char* z) {

    cout << "Output: " << z << endl;

    }

    };

    int main(void)

    {

    function_echo foo;

    foo.echo(76);

    foo.echo(7878.099);

    foo.echo("Hello, Welcome to Polymorphism");

    return 0;

    }

    ```


    +   (c) Function overriding

    +   (d) None of the above


    **Answer:** (b) Function overloading is used in the code. Function name echo has
    been used for getting all data types printed.


    +   2. What is the output of the following piece of code? (L2)


    ```

    #include <iostream>

    using namespace std;

    class function_echo

    {

    public:

    void echo() {

