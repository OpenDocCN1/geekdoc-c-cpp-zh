  md: "# # 5 DYNAMIC MEMORY ALLOCATION\n\nOne of the very important and tricky parts\
    \ of code is memory allocation. A good programmer should have a keen eye over\
    \ the resources, especially the memory. Dynamic memory allocation allows us to\
    \ manage memory easily and keep the code robust. This chapter elaborates the terms\
    \ and techniques of DMA.\n\n+   1. What would be the output of the following code\
    \ snippet? (L2)\n\n```\n```cpp\n#include <iostream>\nusing namespace std;\nint\
    \ main ()\n{\n    int *pointer;\n    pointer = new int;\n    cout <<\"return value\"\
    \ <<pointer;\n    return 0;\n}\n```\n```\n\n+   - (a) No output\n+   - (b) If\
    \ memory is allotted, an address would be printed\n+   - (c) Compilation fault\n\
    +   - (d) 0\n\n**Answer:** (b) is the correct answer. If there is sufficient memory\
    \ in the store, it would allocate memory for the integer and shall return an address.\n\
    \n+   2. Assuming the memory allocation would start from 1000, what would be the\
    \ output of the following code? (Assume you are using Dev C++ or G++) (L2)\n\n\
    ```\n```cpp\n#include <iostream>\nusing namespace std;\nint main ()\n```\n```\n\
    \n```\n```cpp\n{\n    int *pointer;\n    pointer = new int [2];\n    cout <<\"\
    return value\" <<pointer<<\"\\n\";\n    cout <<\"return value\" <<pointer+1<<\"\
    \\n\";\n    return 0;\n}\n```\n```\n\n+   - (a) 1000, 1004\n+   - (b) 1000, 1000\n\
    +   - (c) Error\n+   - (d) Invalid usage of array with new\n\n**Answer:** (a)\
    \ Since the usage of new and array is proper, the allocation would start with\
    \ 1000 and would also print 1004 for second cout statement.\n\n+   3. Which of\
    \ the following is true with respect to memory allocation being done with new?\
    \ (L2)\n\n+   - (a) Memory would be allocated based on the request and new would\
    \ return an address.\n+   - (b) When sufficient memory is not available, an error\
    \ would be displayed.\n+   - (c) When sufficient memory is not available, an exception\
    \ would be thrown.\n+   - (d) If sufficient memory is not available, it would\
    \ free the already used memory and allocate memory for current request.\n\n**Answer:**\
    \ 'a' and 'c' are valid."
