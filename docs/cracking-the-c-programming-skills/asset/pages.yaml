  md: "Execution Result:\n\n![](img/5fbe80b655d61d9cfbc9f5d129b9fb45_242_0.png)\n\n\
    # **153. How is register storage qualifier deployed in any code? Identify the\
    \ situation where register can be used as the storage qualifier.**\n\nWhenever\
    \ there is a need to store the local variables in the CPU instead of RAM, register\
    \ can be used.\n\n```\n```\n{\n    register int upper;\n}\n```\n```\n\nWhenever\
    \ the faster access is required, i.e, something like embedded systems, usage of\
    \ register is appreciated. One should also understand that usage of 'register'\
    \ is a suggestion and not an order to the compiler. If no registers are available\
    \ to satisfy the query, register request may fail.\n\n# **154. How is extern used\
    \ in C++?**\n\n```\n```cpp\n#include<iostream>\nint count =10;\nint main()\n{\n\
    \    write\n}\n{return 0;}\ncode:2.cpp\n#include <iostream>\nusing namespace std;\n\
    extern int count;\nint main ()\n{\n    cout <<\"\\n\" << count;\n    return 0;\n\
    }\n```\n```\n\nThe \"extern\" qualifier defines a global variable that is visible\
    \ to all object modules, i.e., all the files in the same directory. For an instance\
    \ a.c file can get its variable's value from another file which is in the same\
    \ directory and the following small piece of code can help the reader in understanding\
    \ the concept. Also, within a file, extern can be used. Second example reveals\
    \ the way it can be done.\n\n# **155. Give a brief note on near and far pointer.**\n\
    \nAll the terms as near and far pointers were used in the olden programming days\
    \ where the memory available was not suffice. Now, it is not being used at most\
    \ of the places and in very few embedded systems it is being used. Near pointers\
    \ are 16 bits long and have capacity to address 64 KB range whereas far pointers\
    \ are 32 bits long and have capacity to address 1 MB range.\n\n![](img/5fbe80b655d61d9cfbc9f5d129b9fb45_242_1.png)"
