  md: "# # 6 INHERITANCE\n\nThis chapter goes across a very important object oriented\
    \ concept “Inheritance”. It throws light on all forms and techniques of inheritance.\
    \ At the end of this chapter you will be able to efficiently use the concept on\
    \ your programming skills. Inheritance is the concept of getting characteristics\
    \ from one class to another. Both data members and member functions may be inherited.\n\
    \n1. What is the output of the code? (L1)\n\n```\n```cpp\n#include<iostream>\n\
    using namespace std;\nclass base\n{ public:\n    int b; };\nclass dev : public\
    \ base\n{ };\nint main()\n{ dev S;\n    S.b = 9;\n    cout<<S.b; }\n```\n```\n\
    \n(a) 9        (b) 0\n(c) Unpredictable        (d) Error\n\nAnswer: (a) Here class\
    \ ‘dev’ inherits class ‘base’ functionalities in ‘public’ mode. The colon is the\
    \ operator for inheritance. ‘public’ mode of inheritance means all the ‘public’\
    \ members of base class become ‘public’ members of derived class and ‘protected’\
    \ members of base class become ‘protected’ members of derived class. This is simple\
    \ inheritance.\n\n2. What is the output of the code? (L3)\n\n```\n```cpp\n#include<iostream>\n\
    using namespace std;\nclass base\n```\n```\n\n```\n```cpp\n{ protected:\n    int\
    \ b; };\nclass dev : public base\n{ };\nint main()\n{ dev S;\n    S.b = 9;\n \
    \   cout<<S.b; }\n```\n```\n\n(a) 9        (b) 0\n(c) Unpredictable        (d)\
    \ Error\n\nAnswer: (d) ‘protected’ members of base class will be inherited as\
    \ ‘protected’ members of derived class in ‘public’ inheritance. ‘protected’ members\
    \ cannot be directly accessed by an object.\n\n3. What is the output of the code?\
    \ (L1)\n\n```\n```cpp\n#include<iostream>\nusing namespace std;\nclass base\n\
    { protected:\n    int b; };\nclass dev : public base\n{ public:\n    void play()\n\
    \    { b = 4;\n      cout<<b; }\n}S;\n```\n```"
