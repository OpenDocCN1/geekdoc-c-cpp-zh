- pgno: 10
  md: 'Polymorphism is yet another important concept of OOP. It gives multiple forms
    to an attribute or functionality. Operator overloading is adding new features
    to existing operators. Chapter 7 shows the whole picture of operator overloading
    screening its powers and abilities.


    Giving multiple definitions to same function increases the functionality. This
    is function overloading. Also if the new definition is in inherited classes it
    is function overriding. These two concepts will help in increasing the utility
    of the code making it more professional. Chapter 8 drives across the concepts
    of function overloading and overriding.


    Private members of a class can be accessed only by its friend class and friend
    functions. Chapter 9 carries you into the topics of friend class and friend function
    thereby enhancing your understanding in cracking related questions.


    Ambiguity in a multi-user scenario is quite frequent. Often a programmer encounters
    collision in memory making the program inefficient. Namespace is a brilliant feature
    in C++ that avoids this ambiguity and increases efficiency of the program. Chapter
    10 is a unique introduction to namespace where one can understand the scenarios
    where namespaces can be used.


    Yet another interesting and user-friendly feature of C++ is templates. In a nutshell
    it is a program independent of data types. Chapter 11 takes you across the usage
    of templates and making you use the best of features available in C++.


    Errors are always a backdrop in programming. It challenges the programmer in continuing
    with execution. A way to handle and by-pass the errors for further compilation
    is Exception Handling. It helps in making the code more robust. Chapter 12 increases
    your professional skills by making you handle any type of exception.


    The coding techniques can be applied to external data in files. Also, the output
    can be kept track using external files. Chapter 13 introduces file usage and helps
    you to make use of the feature increasing the robustness of the code.


    Macros are defined expressions that increase readability of code. Chapter 14 screens
    the magic performed by macros and inspires you to use it in your code.


    As a part of the interview process questioning are conceptual and theoretical
    from OOP along with codes of C++. Chapter 15 is designed to make you strong in
    all the concepts explained in the book.


