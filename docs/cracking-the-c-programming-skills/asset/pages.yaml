  md: '3. What are arithmetic operators? Name them in the order of their precedence?


    +   - Arithmetic Operators of C++ are

    +   - Addition +

    +   - Subtraction -

    +   - Multiplication *

    +   - Division /

    +   - Modulus %


    The order of precedence for arithmetic operator is given below.


    | Order of Precedence | Operators |

    |---|---|

    | Function call | ( ) |

    | Multiplication | * |

    | Division | / |

    | Modulus | % |

    | Addition | + |

    | Subtraction | - |


    4. How is type definition done?


    The *typedef* is a keyword that informs the compiler to redefine the existing
    data types in C++ program to their own terms of data types without any meaning
    change.


    Syntax: *typedef* existingdata type newdata type


    Example: *typedef* int Distances


    5. What is user defined data type? How is it useful?


    User-Define Data Types are:


    +   - Structure

    +   - Classes

    +   - Typedef

    +   - Enumeration


    *Structure:* To collect the data of various other data types and process together
    as one single entity. It starts with keyword called Struct and is followed by
    user defined type.


    *Classes:* The purpose of this data type is for reusability, the program can have
    its own class with Class Keyword. The class consists of data members and member
    function enclosed within parenthesis { }


    *Typedef:* The typedef is a keyword that informs the compiler to redefine the
    existing data types in C++ program to their own terms of data types without any
    meaning change.


    *Enumeration:* This Data Type provides the integer constant by specifying in terms
    of identifiers or variables (names), thus the integer constants referred by variables
    are called Enumeration. By default it starts at zero (0). The keyword used is
    enum.


    6. For a program with no object oriented concept involved, which language should
    be preferred C or C++?


    This is a very hypothetical question. If object orientation is required and the
    programmer is familiar with C++, it is always preferred to go with C++. It is
    by the very basic intuition, C++ is advanced than C and hence would be preferred
    by that way too.


    7. What are the three basic concepts of Object oriented programing?


    The three basic concepts of OOP


    +   i. Encapsulation

    +   ii. Inheritance

    +   iii. Polymorphism


    8. What is a class? What is the relationship between class and object?


    A class is nothing but a group of related objects aligned together. Or, multiple
    objects together form a class. An object will be an instance of a class too. Members
    of the structure are public by default whereas members of the class remain private.'
