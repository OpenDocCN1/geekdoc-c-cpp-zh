    # Success Story of C


    There are quite a lot of programming languages available, starting from the extremely
    high level language to the low level power of assembly language, and a good variety
    of specialized options in between them. C language stands out among them. Whereas
    C++ stands above C. This is mainly because of the abilities of OOP.


    C++ programming language has a lot of advantages along with most of the advantages
    of C. First, C++ has been around for the past two decades with tons of source
    codes available over the Internet which gives lot of information to learn and
    use. It''s a great language for expressing ideas in a way that most people can
    understand and where it can be compared with real world environment. Moreover,
    other than OOP the special features like namespace and templates makes the program
    robust thus making the language preferable to the target group.


    # Other Benefits of this Book


    Though many books are available in the market on C++ programming language, most
    of them are theoretical in nature or programming examples. There are not many
    books that have a series of C++ problems that can be used to build the programming
    skills. Many people understand the basics, syntax and semantics but only an objective
    type book can help hone the skills.


    It''s quite frustrating that no book in print came even close to adequately covering
    all different topics in C++ programming language with so many possible objective
    questions and we are happy that this book covers all aspects for a programmer
    to succeed in interviews as well learn the nuances of programming. Not only programming,
    but also all the technical.


    # Who Else will Find this Book Useful?


    Apart from technical interview prep, this book can be gainfully used by *developers,
    software engineers*, and aspirants of other competitive examinations like GATE,
    IES, etc.


    A good software engineer should have a basic level of comfort in coding and problem
    solving – that is, be able to comprehend code and write something nontrivial –
    in these languages:'
