  md: "144. What is the usage of the following functions? A. seekg () B. seekp ()\
    \ C. tellg () D. tellp ()\n\n+   ✓ seekg() will move the get pointer(input) to\
    \ a specified location\n+   ✓ seekp () will move the put pointer (output) to a\
    \ specified location\n+   ✓ tellg () will fetch and give the current position\
    \ of the get pointer\n+   ✓ tellp() will fetch and give the current position of\
    \ the put pointer\n\n145. Brief on the following functions related to file handling.\
    \ A. eof () B. fail () C. bad() D. good.\n\n| Function | Meaning |\n|---|---|\n\
    | eof() | Returns true with a non-zero value if end of file is encountered while\
    \ reading; otherwise return false(zero) |\n| fail() | Returns true when an input\
    \ or output operation has failed |\n| bad() | Returns true if an invalid operation\
    \ is attempted or any unrecoverable error has occurred. |\n| good() | Returns\
    \ true if no error has occurred. |\n\n146. What are the types of files one can\
    \ list when asked?\n\n+   ✓ Text file\n+   It could be a typed document which\
    \ could have series of alphanumeric characters or symbols. One thing to remember\
    \ is, every line of a text file is terminated with an EOL (End of Line) character.\n\
    +   ✓ Stream\n+   Sequence of bytes is normally referred to be a Stream.\n+  \
    \ ✓ Binary files\n+   A binary file will contain data encoded in binary form for\
    \ computer storage and processing purposes. Only the processor can understand\
    \ it and not a human. Because, it would be in 1s and 0s.\n\n147. What is the use\
    \ of Void pointer in C++?\n\nLet’s take a bottle; if you pour water into it, it\
    \ is a water bottle. If you pour juice into it, it’s a juice bottle. A pointer\
    \ is also similar. If a pointer holds the address of a float or int or char, etc.,\
    \ it is referred to be a void pointer. When it holds the address of a float only,\
    \ it becomes float pointer. When it holds the value of integer alone it becomes\
    \ an integer pointer. It is very flexible. One most important point to remember\
    \ is that casting has to be done to make the void pointer a valid data type pointer\n\
    \n```\n#include<iostream>\nusing namespace std;\nint main()\n{\n    int a = 9;\n\
    \    double b = 10.676;\n    void *p;  //void pointer\n    p = &a;\n    // Here\
    \ it is made as a integer pointer. Here p can hold integer address.\n    cout\
    \ << *p << \"Integer Pointer\" << *(int *)p;\n    // Casting becomes Invisible.\
    \ Making the void pointer as int pointer.\n    p = &b;\n    cout << *p << \"Double\
    \ Pointer\" << *(double *)p;\n    // Casting becomes Invisible. Making the void\
    \ pointer as double pointer.\n    getchar ();\n    return 0;\n}\n```\n\n148. What\
    \ is the use of Null pointer in C++?\n\nWhen an uninitialized pointer is used,\
    \ there could be a possibility that it points to some garbage value. To avoid\
    \ that it is better to initialize the pointer to 0. A pointer when initialized\
    \ to 0 is referred to a null pointer. It points to nowhere."
