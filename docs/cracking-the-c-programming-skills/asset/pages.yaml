- pgno: 6
  md: '# Preface


    # Are You at Crossroads?


    Are you tired of getting IT interviews but not offers? Are you confused between
    preparing for the different competitive exams? Are you dazed of the competition
    seen in the computer market? Are you feeling fuzzy about the future in the programming
    world? Are you desperate for a better software job, but can’t figure out what
    that is or how to get there?


    If you are under the awe of even any one of the above questions then you have
    perhaps taken the right decision -- of buying this book and preparing for the
    technical interview! I suggest that you consume the contents from the first chapter
    to the end, sequentially, and not attempt to skip any section or chapter unless
    you are confident of the topic that you would want to skip. This is because, this
    book has been *specifically* designed to *orient* you for the technical interview
    vis-à-vis the C++ programming language. This book has been prepared with a *definite*
    purpose. Please stay with the preface and read it to the end to understand *why*.
    After reading the preface you will most likely revise your prep strategy.


    # IT Job Landscape


    You should take heart if you see the plethora of job openings, and which is *growing*,
    in the IT and ITeS space. The scenario looks like this: NASSCOM, the premier trade
    body for the IT-BPM sector in India has given a press release that the Indian
    IT-BPM sector continues to be one of the largest employers in the country—directly
    employing nearly 3.5 million professionals, adding over 2,30,000 employees. They
    have also predicted that the future looks promising as the IT-BPM industry is
    gearing itself well to next phase of challenges. Digitization, disruptive technologies
    and innovation will fuel growth with new opportunities in the years ahead. They
    have also projected that the Indian IT industry would grow to about $300 billion
    by 2020, and create different verticals that would focus on specific areas such
    as the domestic IT market, software products and e-commerce which tells us there
    are and there will be more job openings in the IT sector.


    # Recruiter’s Perspective


    As a potential job hunter, your chances of success increases manifold if you understand
    what your recruiters are looking at. According to a new career builder survey,
    overwhelming majority of IT companies say soft skills such as a positive attitude
    are just as important as hard skills. Positivity comes from within when you are
    confident on your subjects. The top 10 traits employers seek out in candidates
    include hardworking, dependable, positive, self-motivated, team-oriented, organized,
    works well under pressure, effective communication, flexible and confident. If
    all of these can boil down into one thing, then it is subject matter expertise
    which will help you attain rest of all the things.'
  merge: -1
  img_proc: true
- pgno: 7
  md: '# **Technical Interview Process**


    Recruitment refers to the process of attracting, selecting and appointing suitable
    candidates for jobs within an organization. From the organization perspective,
    this includes job analysis, sourcing, screening and finally selection. Though
    every company differs in its own way of selecting the candidates, every company
    strives towards getting the “right” person for the “right” job.


    In a technical interview, applicants are likely to be asked questions that:


    +   - relate to specific skill set that is needed for the company’s technical
    activities;

    +   - relate to the basics on the subject matter to resolve complex problems;

    +   - for rookies, it will be related to the projects completed as part of a degree
    course; and

    +   - require candidates to solve actual technical problems that they would be
    likely to face if employed.


    One of the articles by Forbes, an American business magazine, talks about four
    super-common interview questions post-technical interview session which includes
    “tell me about yourself”, “what is your greatest strengths”, “why should we hire
    you” and “do you have any questions for us”. Though these are very common questions,
    giving unexpected and most relevant answers will make the interviewer sit up faster
    and listen to you.


    # **Your Personal SWOT**


    Now that you know your dream job is beckoning you (your *opportunity*) that you
    need to outpace only X competitors (your *threats*), what the recruiters would
    be looking at while interviewing, make sure you list down your areas of *strength*,
    and more importantly *weakness*. While you would have little control over the
    opportunities and threats, you can fully devote yourself to take your strengths
    to new heights and work on your weaknesses to prevail upon them. Use the SWOT
    grid given below for planning your prep.


    ![](img/5fbe80b655d61d9cfbc9f5d129b9fb45_7_0.png)'
  merge: -1
  img_proc: true
- pgno: 8
  md: '# Why C++?


    It has been seen that X% of all the technical interviews have the C++ programming
    language at heart. C++ Programming can be used to do tasks such as networking
    related, OS related, embedded systems related, etc. It is used for developing
    computer applications, embedded software network drivers, data bases, simulators,
    etc. Moreover, it is believed that if you are strong in a programming language
    like C++, you can be easily trained on multiple different languages that are derived
    based on object orientation. Knowledge of specific technologies along with experience
    and knowledge of methodologies is more important. Continuously practicing C++
    objective type questions will help you attain that state.


    # Why this Book?


    As I have mentioned in the preface, this book has been specifically designed to
    help you undertake a meticulous and *objective prep*.


    The contents have been carefully handpicked from our experience and expertise
    developed by being either direct witness to the recruitment process, mentoring
    students in our colleges, myriad discussion with our peers who are placement organizers
    in colleges, hours of studying discussions on the topics in social media, blogs
    and dedicated websites, so that the book is highly focused to the *interview prep
    for the C++ language* and almost nothing else. We have come to the conclusion
    that for effective prep everything boils down to multiple choice questions around
    coding problems along with frequently asked technical, conceptual questions. Anyone
    wishing to sharpen his skills on C++ programming language or preparing for aptitude
    tests, competitive examinations should through this book which will help them
    get the goals.


    We have combined our technical expertise to develop multiple choice questions
    that help you strengthen your weaknesses. For this, we thought that the best way
    is to grade the problems into level of difficulties (LODs). The complexity of
    the questions have been incremented with more technical challenge from L1 to L5.
    L1 has the minimal complexity which would test the basics'' like syntaxes wherein
    L5 will test your understanding of the logic and code in depth with concepts.
    Each chapter has complexities distributed evenly with focus being given at all
    levels of difficulty.


    +   1. L1: Tests the basic syntactical knowhow of the language.

    +   2. L2: First level testing on the reader''s understanding of the language
    is carried out in L2 questions. With basic knowhow getting cleared one can attempt
    L2.

    +   3. L3: Questions are aimed at testing the logical perspective of the reader.

    +   4. L4: It mostly points out of the point of occurrence of errors and the exact
    error statements and its reasons.

    +   5. L5: Tricky questions are added under this belt to test your understanding.


    # What is this Book All About?


    C++ programming questions and answers have been aimed with a distinct purpose
    of assisting students and specialists getting ready for several certification
    exams and job interviews. This book provides a useful collection of sample interview
    questions and multiple-choice questions'
  merge: -1
  img_proc: true
- pgno: 9
  md: 'and their answers with appropriate explanations. Let’s get started with the
    preface section! These C++ programming interview questions and answers have been
    intended to get you familiar with the nature of questions you may face during
    your C++ programming interview and written examinations.


    This book was engraved with two groups of readers in mind. One who is new to C++
    and wants to learn the basics of it through objective type questions, or the other
    group who wanted to master their skills in cracking the interviews. We hope that
    you will find what follows. LOD (levels of difficulty) will enable the readers
    to move step-by-step testing his understanding.


    This book reflects the growing complexity with which interviewing is being loomed
    and we have included the latest topics and questions discussed in top companies
    today while continuing to maintain the emphasis on basic problem solving skills
    for both students preparing for exams and for interviewees. We made this publication
    more student-friendly by eradicating redundant words, materials, and dated models,
    presenting detailed descriptions, providing fewer lists, and using bold print
    to call attention to important terms.


    # ## Coverage of the Book


    C++ is a considered an enhancement of C language. Chapter 1 is fully concerned
    about the differences between the C and C++. It deals with the major changes in
    characteristics of the language.


    Object oriented programming is fully relied on classes. Chapter 2 travels the
    nooks and corners of classes. It throws light on various types of classes, the
    internal structure and their usage. This chapter also explains the main concept
    of OOP, ‘ENCAPSULATION’ in detail. This will make you strong in appropriate usage
    of OOP.


    Objects or instances are classes that have specific attributes. Every time an
    object is created, all the members of the class belonging to the object will be
    initialized. Also, when the scope of the object is over it will be cleared and
    the memory will be released. This internal task of allocating and de-allocating
    the memory of an object is done by constructors and destructors. Chapter 3 discusses
    the working of constructor and destructor and their power of it. It discusses
    the various forms and modes of usage in detail.


    C++ has a special feature of changing the storage properties of variables. This
    is done using storage classes. Chapter 4 introduces you the various storage classes
    and their usage. It also explains the possibilities of using storage classes in
    class members, thus educating you in linking storage classes with OOP.


    A good programmer must always be concerned about the usage of resources. Mainly
    professionals should be concerned about the amount of memory used in the program.
    There should be any unused memory logs. So, Dynamic Memory Allocation (DMA) is
    used. It helps in dynamically allocating, reallocating and releasing the memory.
    Chapter 5 elaborates the usage of DMA in programming thus enhancing your professional
    skills.


    An important and very powerful OOP feature is inheritance. It is gaining features
    from base class to derived class. It is powerful mainly because of its ability
    to reuse the code. Chapter 6 describes their usage and various possibilities of
    inheritance.'
