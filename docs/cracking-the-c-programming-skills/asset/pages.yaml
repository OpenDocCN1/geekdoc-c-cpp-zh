- pgno: 16
  md: "# # 1 C VERSUS C++\n\nThis chapter will cite the most important differences\
    \ between C and C++. It is also to be noted that ‘C’ language is top down language\
    \ whereas ‘C++’ is a bottom up one. At the end of this chapter, you will be knowing\
    \ the important and elementary vicissitudes to be handled carefully while moving\
    \ into C++ from C language.\n\n+   1. What is the output of the code? (L2)\n+\
    \   \n+   ~~~cpp\n+   #include<iostream.h>\n+   void main()\n+   { cout<< “hello\
    \ world”;}\n+   ~~~\n+   \n+   (a) hello world\n+   (b) hello\n+   (c) Unpredictable\n\
    +   (d) Compiler dependent\n+   \n+   **Answer:** (d) ‘cout’ is the function used\
    \ for printing output in ‘C++’. The operator ‘<<’ is called extraction operator.\
    \ It is used for extracting the value from the right side, and gives it to the\
    \ console. In ‘g++’ it gives error. Whereas in other compilers and some older\
    \ versions it might give ‘hello world’.\n\n+   2. What will be error thrown by\
    \ the code? (L4)\n+   \n+   ~~~cpp\n+   #include<iostream.h>\n+   void main()\n\
    +   { cout<< “hello world”;}\n+   ~~~\n+   \n+   (a) Fatal error: iostream.h:\
    \ no such file or directory\n+   (b) ‘::main()’ must return ‘int’\n+   (c) ‘cout’\
    \ was not declared in this scope\n+   (d) All of the above\n+   \n+   **Answer:**\
    \ (a) A fatal error terminates compilation. Then no other errors will be thrown.\
    \ This is because ‘g++’ doesn’t support this way of compilation.\n\n+   3. What\
    \ will be error thrown by the code? (L3)\n+   \n+   ~~~cpp\n+   #include<iostream>\n\
    +   using namespace std;\n+   void main()\n+   { cout<< “hello world”;}\n+   ~~~\n\
    +   \n+   (a) Fatal error: iostream.h: no such file or directory\n+   (b) ‘::main()’\
    \ must return ‘int’\n+   (c) ‘cout’ was not declared in this scope\n+   (d) No\
    \ error\n+   \n+   **Answer:** (b) ‘using namespace std’ is for handling naming\
    \ collisions and adding external files and definition. This doesn’t exist in ‘C’.\
    \ It is used to prevent collisions while naming memory spaces. Initially, it was\
    \ used only on system with multiple users and shared memory, but now it has been\
    \ adapted as a mandatory syntax in ‘G++’. Also in ‘G++’ the default ‘main’ must\
    \ be of ‘int’ type and not ‘void’. Thus, the error. But it is also to be noted\
    \ that the compiler doesn’t throw any error or warning even if there is no return\
    \ statement given at the end of ‘main’.\n\n+   4. What will be error thrown by\
    \ the code? (L4)\n+   \n+   ~~~cpp\n+   #include<iostream>\n+   int main()\n+\
    \   { std::cout<< “hello world”;}\n+   ~~~"
  merge: -1
