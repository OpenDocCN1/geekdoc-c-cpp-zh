    \ << \"After Exception\";\n}\nint main()\n{\ntry\n{\n    MyFunction();\n}\ncatch(...)\n\
    {\n    std::cout<<\"Caught Rethrown Exception\";\n}\n```\n```\n\n**Answer: (b)**\
    \ There is a ‘throw’ in the catch of type int. This makes it to throw exception\
    \ in the return block of address which leads it to print “Caught Rethrown Exception”\n\
    \n+   (a) Doesn’t compile, since catch block with ellipsis should be the last\
