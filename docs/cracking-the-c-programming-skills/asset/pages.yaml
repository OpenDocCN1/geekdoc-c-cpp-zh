    +   - ✓ fstream: class to both read and write from/to files.\n\n# 143. What are\
    \ the modes a file can be opened in C++?\n\nA file can be opened in any of the\
    \ following modes:\n\n+   - ✓ ios::app\n+   - ✓ ios::ate\n+   - ✓ ios::binary\n\
    +   - ✓ ios::in\n+   - ✓ ios::out\n+   - ✓ ios::nocreate\n+   - ✓ ios::noreplace\n\
    +   - ✓ ios::trunc"
