    115. Is there any physical limit on the maximum number of classes that a class
    can inherit? (How may base classes can a derived class have?)


    No. A class can inherit any number of classes provided the memory (RAM) is available.


    116. What is polymorphism?


    Adding functionalities to the existing attributes is called polymorphism. Polymorphism
    means ‘different forms’. It involves operator overloading and functional overloading.


    117. What is operator overloading?


    Adding new functionalities to the existing operator is called operator overloading.
    But the original functionality remains unchanged.


    118. Is it possible to remove the default functionality of an operator using operator
    overloading?


    No. There is no way to remove the original functionality of the operator.


    119. Can an overloaded operator be used by its inherited classes?


    Yes. If the operator definition is in ‘public’ scope, it will be inherited by
    its derived classes also.


    120. What is function overloading?


    Giving multiple definitions to a class member function is called function overloading.


    121. What are the rules for overloading?


    +   ✓ The name of the function should not be changed.

    +   ✓ The return may or may not be varied.

    +   ✓ The number of arguments may or may not be varied.

    +   ✓ The type of the arguments may or may not be varied.

    +   ✓ Either one or multiple from the following must be varied: return type, type
    of arguments, number of arguments.


    Changing the argument name doesn’t have an effect.


    122. Does Redefining a function by just changing the name of the arguments belong
    to function overloading?


    No. Renaming the arguments doesn’t change the internal signature of the function.


    123. Does redefining a function by just changing the order of types of the arguments
    belong to function overloading?


    Yes. Changing the order of data types of the arguments creates a new signature
    of the class. Hence, it is an overloaded function.


    124. Is it necessary to vary the number of arguments for an overloaded function?


    No. If any either return type of the function or type of arguments are varied,
    then it is not necessary to change the number of arguments.


    125. Where do we use operator overloading? How is it different from function overloading?


    There are chances where a single operator may be used for two different situations
