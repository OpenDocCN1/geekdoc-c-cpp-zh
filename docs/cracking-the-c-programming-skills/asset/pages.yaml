  md: '16. How can someone identify something as an object?


    There are three basic things to be remembered about an object. It has

    - ✓ attributes

    - ✓ behavior and

    - ✓ identity.


    With these three one can identify an object.


    17. What is encapsulation?


    Enfolding of state and behavior into single unit, this process is known as encapsulation.
    Encapsulation can be achieved using a keyword called `Class`.


    18. What was the older name of ''C++''?


    C++ was originally called C with classes. Later on it got changed as C++.


    19. Name some real time-objects and give their attributes.


    A table for an instance. It has a name called Table. It will have a color. It
    will have size and behavior. Any object will have these, by default.


    20. Is there any difference between ''printf'' and ''cout''?


    `Printf ( )` is a function whereas `cout` is not a function. `Cout` depends on
    the operator overloading concept by using `<<` operator whereas `printf` is no
    way like that. `Cout` is always regarded as more extensible in nature as it is
    easier to work with any data type. Also, the formatting and related stuff remain
    very easy with respect to `cout` where it remains complex in `printf`.


    21. What is `IOSTREAM`? How is it used?


    `IOSTREAM` is like `stdio.h` in C programming. `IOSTREAM` defines the standard
    input/output services for the C++ program. One cannot use `cout` or `cin` without
    having the `iostream` header file included.


    22. Can a structure be a member of a class?


    Yes


    23. Can a structure be defined inside a class? If so what will be its scope?


    Yes the structure can be a member of the class and it should be in the public
    scope so that the return type is publicly visible. Otherwise will throw an error.


    24. Can a file object be a member of a class?


    No


    25. Can a C++ program have two main functions? If so which will be executed first?


    No. The compiler won''t compile if it has 2 main methods. It throws error saying
    "redefinition of ''int main ( ) ''".


    26. What are predefined functions? Where are they defined?


    The predefined function are some standalone functions of C++ Library (like `cmath`
    or `cstdlib`) that are declared in the header files using pre-processor directives.
    Predefined functions are listed below.

    - ✓ `sqrt`

    - ✓ `pow`

    - ✓ `abs`

    - ✓ `exit`

    - ✓ `assert`


