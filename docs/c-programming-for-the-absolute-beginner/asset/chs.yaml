  \n我向其他在准备本书出版方面发挥过作用的人表示特别感谢，包括排版的 Value Chain International；校对员 Sara Gullion 以及索引编员\
  \ Sharon Shock。你们都对这本书变成今天现在的模样发挥了巨大的作用。\n\n\n\n\n\n我们要向 BioWare Corp 的首席程序员、本书序的作者\
  \ Scott Greig 致敬。Scott，你是我们的偶像。没有你，我们还能向谁学习呢？\n\n我深表感谢 Jen Janzen 敏锐的眼光，她的编辑天赋无与伦比。她\
