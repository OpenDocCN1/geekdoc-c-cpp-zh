  \ 成员函数返回的是 `const char*` 而普通的 `char*`，因此我们必须将其拷贝到一个新字符串以便传递给 `dbLoadImage()`。\n\n\
  成员变量 `m_mapFile` 是地图位图图像的文件流。我们在 `isLandCollision()` 成员函数中使用该成员变量来确保船只不会在陆地上行驶。\n\
