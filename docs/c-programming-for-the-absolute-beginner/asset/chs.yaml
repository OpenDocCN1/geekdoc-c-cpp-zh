  \    nation2 = Nation(tempString);\n    while(nation1.takeTurn() && nation2.takeTurn())\n\
  \    {}\n    return 0;\n}\n```\n\n## 总结\n在本章中，你学习了许多关于对象的知识。理解 OOP 需要你从独特的视角来看编程。在类中隐藏数据并保护这些数据需要一些提前思考，但这在以后的可维护性和对象重用方面将获得回报。通过尝试以下挑战，并在进入下一章之前回顾本章中额外要求的部分，来测试你对\
  \ OOP 概念的理解。\n\n### 挑战\n1. **创建一个可以表示角色扮演游戏角色的类。存储角的名字、职业和种族。**\n2. **解释 OOP 的三个主要原则。**\n\
  3. **类和对象之间的区别是什么？**\n4. **如果你可以在不损失功能的情况下，在声明为公共、私有、全局或局部之间进行选择，你应该选择哪种作用域？**\n\
  5. **构造函数和析构函数中哪些属性是其他函数不存在的？**\n\n## 第 6 章：内存管理\n亲爱的读者，我们正在离开 C++ 的基础，进入未知领域。你已经准备好学习\
  \ C++ 语言一些更高级的内容了。然而，不要担心；尽管这些概念可能具有挑战性，但通过练习，你会发现它们和第 1 章“开启之旅”中的概念一样简单。\n\n在本章中，你将学习如何使用：\n\
  * 数组\n* 指针\n* C 风格字符串\n* 引用\n* 动态内存基础\n\n### 解释内存\n你可能想知道变量是如何存储在内存中的。你知道全局变量和局部变量，但它们是如何在内存中*分配*的呢？*分配*是指获取内存。你使用过的所有变量在使用之前的某个时间点都经过了分配。在这一节中，我们将更多地解释这个奇怪的概念。\n\
  \n// 144\n// C++ Programming for the Absolute Beginner, Second Edition\n\n所以，计算机有一块内存来存储所有这些东西，对吧？不完全如此。事实证明，内存中实际上有三个主要部分：静态内存、栈（stack）和堆（heap）。给定变量存储在何处很大程度上取决于它在哪里以及如何被声明。\n\
  \n静态内存是存储全局变量的地方。它们在程序启动时、`main` 开始执行之前被分配。它们贯穿整个程序过程，只有在程序退出（`main` 结束后）后才释放。因此，静态内存中的所有内容必须在程序开始内存分配之前确定。当你声明全局变量时，你必须确切知道需要以及多少个。例如，你无法根据用户的输入来决定是否有一个全局变量。到此时，程序已经在运行了，所以太晚了。\n\
  \n栈（也称为局部或自动内存）是分配所有局部变量的地方。因此，在 `main` 内部声明的整数将放在栈上。当调用函数时，其参数将放在栈上。你到目前为止学的所有非全局变量都会放在栈上。\n\
  \n当程序开始执行时，会在栈上为 `main` 的所有局部变量分配空间（见图 6.1(a)）。一旦调用了另一个函数（例如 `func1`），就会在栈上方分配更多空间给\
  \ `func1` 的局部变量和参数（见图 6.1(b)）。当 `func1` 完成执行并返回时，它在栈上的空间就会被释放（见图 6.1(c)）。因此，栈根据调用的函数而增长和收缩。这允许对内存进行更加灵活的处理。你可以根据用户输入选择是否调用某个函数，这将决定该内存是否被分配。因此，你的程序可以适应不断变化的情况。\n\
  \n**图 6.1**\n函数调用期间栈的使用序列。\n\n栈并不非常适合存储大对象。消耗大量内存的变量在每次调用函数时都必须分配和释放，这会让你的程序变慢。最好将此类大变量放在堆上。\n\
  \n// 145\n// 第 6 章 •内存管理\n\n\n\n堆（或空闲存储或动态内存）是最后一种类型的内存。有时你希望获得两者的结合：你希望在需要的时候分配内存，但又不希望它在函数结束时就消失。这就是堆的工作方式。\n\
  \n你调用一个特殊函数来分配内存，告诉它你需要多少内存，然后当你完成后，调用一个特殊函数来释放它。这带给了你完全的控制权，但也带来了完全的责任。由你来跟踪你分配的内容，并在不再需要时将其释放。\n\
  \n### 使用指针\n\n如果使用得当，指针是非常强大的工具，但它们也是 C++ 中最具有挑战性的工具之一。然而，本节将带你逐步学习如何使用。\n\n指针最简单的定义是：指针是一个存储内存地址的变量。虽然这个指针的定义非常直观，但它的影响要复杂得多。指针存储的是另一个变量的地址。因此，指针被称为“指向变量”。\n\
  \n声明指针的语法如下：\n\n```\npointer_type pointer_name;\n```\n\n在这里，`pointer_type` 是被指向变量的类型，`pointer_name`\
  \ 是指针的名字。然而，声明只是开始；使用它们才是复杂的部分。\n\n首先，你必须学习一个新的运算符，取地址运算符（`&`）。你把它放在变量前面，它的求值结果是变量的内存地址。这是一个使用地址运算符的示例：\n\
  \n```cpp\nint my_int;\nint* my_int_pointer = &my_int;\n```\n\n这段代码让 `my_int_pointer`\
  \ 指向 `my_int`。`my_int_pointer` 存储了 `my_int` 的内存地址。注意，如果一个指针被赋值为 0，它就不指向任何变量。这种情况被称为空指针。\n\
  \n**146**\n**C++入门编程第二版**\n\n如果你很难想象这些概念，尝试这个示例：\n\n```cpp\n//6.2 - 指针 - Dirk Henkem\
  \ 和 Mark Lee\n#include <iostream>\n\nint main(void)\n{\n    using std::cout;\n \
  \   int an_int = 5;\n    int* a_pointer = &an_int;\n    cout << “an_int 的值是: ” <<\
  \ an_int\n    << “\\nan_int 的地址是: ” << &an_int\n    << “\\na_pointer 的值是: ” << a_pointer\n\
  \    << “\\na_pointer 的地址是: ” << &a_pointer;\n}\n```\n\n## 间接运算符\n\n你已经学习了一部分指针。接下来，你学习间接运算符。间接运算符（`*`）用于引用指针指向的对象。你将间接运算符放在指针（或指向指针的表达式）前面，它的求值结果是指针所指向变量的值。虽然这个运算符与声明指针的\
  \ `*` 不同，但根据上下文你将能够分清哪是哪一个。在指针声明中，它并没有被解引用。\n\n**提示**\n\n在上一节中，你看到了一个使用 `*` 初始化的指针\
  \ `a_pointer`，但不要将间接运算符与指针声明混淆。例如，如果你声明一个整数和一个指针：\n\n```cpp\nint a = 78;\nint* pb\
  \ = &a;\n```\n\n你可以使用间接运算符通过 `pb` 访问 `a` 的值：`cout << “a 的值是: ” << *pb;`\n\n这段代码在屏幕上显示数字\
  \ 78。你可以将间接运算符（有时称为解引用运算符）视为取地址运算符的相反面。\n\n**第 6 章 内存管理**\n**147**\n\n为了帮助理清取地址运算符和间接运算符之间的关系，看这个示例：\n\
  \n```cpp\nint x = 5;\nint* px = &x; // px 指向 x\n*px = 7; // x 现在包含了\n```\n\n在第二行中，`&x`\
  \ 的地址赋值给了 `px`。`px` 现在指向 `x`。注意，当你改变 `*px` 的值时，你正在改变 `x` 的值。在第三行之后，`x` 的值为 7。\n\n\
  也可以指向指针。指向整数的指针的声明如下：\n\n```cpp\nint** ppi;\n```\n\n它可以这样初始化：\n\n```cpp\nint * pi;\n\
  ppi = &pi;\n```\n\n指向指针存储的是指针的地址，而指针存储变量的地址。因此，可以通过指向指针访问变量的值。要访问这个值，你需要使用两次间接运算符：\n\
  \n```cpp\ncout << **ppi;\n```\n\n这段代码显示了 `pi` 所指向的整数的值。指针指针的概念初并不总是直观的。它就像一个指向另一个路标的路标，让你知道那个路标在哪里。\n\
  \n`*ppi` 给出指针 `pi` 的值；然后再次使用间接运算符，给出了 `pi` 指向的值。你可以进一步，根据你需要的次数多次使用它，但这样做并不实际。\n\
  \n## 使用指针和对象\n\n也可以指向对象和结构体的指针。例如，你可以像这样拥有一个字符串对象的指针：\n\n```cpp\nstring* ps;\n```\n\
  \n指向对象的指针实际上与任何其他类型变量的指针相同。然而，你需要注意一些特性。首先，并没有实际创建对象，只是一个指向它的指针。\n\n正因如此，你并没有调用字符串的构造函数。（C++\
  \ 在你声明字符串时会调用构造函数，因为 `string` 是一个类，而不是内置数据类型。）\n\n**148**\n**C++入门编程第二版**\n\n为了进一步说明这一点，假设我们有一个类来存储一个二维位置，即一个点：\n\
  \n```cpp\nclass Point\n{\npublic:\n    int X,Y;\n    Point (int lX, int lY) : X(lX),\
  \ Y(lY){}\n    void print();\n};\n\nvoid Point::print()\n{\n    using std::cout;\n\
  \    cout << “X 的值是: ” << X\n    << “\\nY 的值是: ” << Y << \"\\n\";\n}\n```\n\n\n\n\
  这里的 `data_type` 是任何有效的数据类型或类。要使用这部分内存，你必须将其赋值给指针变量。在堆（heap）上跟踪内存是指针非常有用武的地方。\n\n\
  例如，在堆上创建一个 `Point` 对象，你可以执行以下操作：`Point* myPoint = new Point(2,4);`\n\n如果你正在分配一个内置类型，如\
  \ `int`，则你不需要括号：`int* myInt = new int;`\n\n其实就是这些了。`new` 运算符实际上非常易用。所有你使用 `new`\
  \ 运算符分配的内存在完成后都必须使用 `delete` 运算符释放。如果不释放所使用的内存，这部分内存在程序稍后将无法再次使用。忘记释放堆内存被称为内存泄漏，你应该始终避免它。\n\
  \n`delete` 运算符作用于指向由 `new` 运算符分配的内存区域的指针。\n\n如果对其他任何内容使用 `delete` 运算符，它将导致错误。`delete`\
  \ 运算符的语法如下：\n\n```\ndelete pointer;\n```\n\n例如，要释放前面示例中分配的内存，请执行以下操作：`delete myInt;`\n\
  \n`myInt = 0;`\n\n`delete myPoint;`\n\n`myPoint = 0;`\n\n150\n《初学者 C++ 编程》，第二版\n\
  \n一旦你释放了用 `new` 分配的内存，将指针的值设置为 0。这确保了你不会意外尝试删除已经删除的内容。在尝试运行程序时，双重删除（double delete）可能会导致各种问题。在\
  \ 0 上使用 `delete` 运算符不会产生任何作用，因此是安全的。\n\n确保你的分配和释放匹配的良好方法是让一个类来管理它们。分配将发生在构造函数中，而释放发生在析构函数中。这里是这样一个类的示例：\n\
  \n```cpp\nclass HeapPoint\n{\npublic:\nHeapPoint(int x, int y);\nPoint* get() {\
  \ return thePoint; }\n~HeapPoint();\n\nprivate:\nPoint* thePoint;\n};\n\nHeapPoint::HeapPoint(int\
  \ x, int y) : thePoint(new Point(x,y))\n{}\n\nHeapPoint::~HeapPoint()\n{\ndelete\
  \ thePoint;\nthePoint = 0;\n}\n```\n\n现在你可以像这样使用这个 `HeapPoint`：\n\n```cpp\nvoid\
  \ myFunc()\n{\nHeapPoint myHeapPoint(2,4);\nPoint* myPoint = myHeapPoint.get();\n\
  // 对 myPoint 进行操作\n// 不需要调用 delete！自动调用的！\n}\n```\n\n因为 `myHeapPoint` 是一个局部变量，它在函数结束时会自动销毁。\n\
