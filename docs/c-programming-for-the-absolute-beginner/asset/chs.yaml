  答案：\n你应该在程序的开发过程中一直使用断言，但在程序向公众发布时应该将其移除。\n\n## 附录\n\n### 使用八进制、十六进制、二进制和十进制\n对于大多数人来说，标准的数制是十进制（也称为十位）。十进制中的所有数字都是基于\
  \ 10 的幂次。每个数字有 10 种可能（1, 2, 3, 4, 5, 6, 7, 8, 9 或 0）。根据排列理论，如果你在十进制中有两个数字，你就可以有\
  \ 100 个不同的值（1 到 99 以及 0）。这个原理是所有数字系统的基础。\n\n在二进制系统（也称为二进制）中，如果你有两个二进制位，你有四种可能，如下（括号内为等值结果）：`00`\
  \ (0)、`01` (1)、`10` (2) 和 `11` (3)。\n\n十六进制系统（也称为 hex 和十六进制）在计算机中（因此，对程序员而言）非常有用。每个数字有\
  \ 16 种可能（0–9 和 A–F）。十进制只有 10 个唯一数字，所以为了表示 16 个唯一数字，使用了字母表的前五个字母。`A` 代表 10，`B` 代表\
  \ 11，`C` 代表 12，`D` 代表 13，`E` 代表 14，`F` 代表 15。十六进制数用 `0x` 前缀数字；例如，`0x3E1` 就是一个十六进制数。\n\
  \n八进制是一种八进制系统，在计算机中也有用。每个数字有八种可能（0–7）。八进制用 `x` 前缀表示数字——例如，`x95`。\n\n### 340\n**初学者\
  \ C++ 编程，第二版**\n\n### 转换为十进制\n不要被十进制以外的数字系统吓倒。你所有旧熟悉的数字还在那里；其他系统只是表示方式不同。那么，到底如何将其他系统中的数字转换为十进制数字呢？很简单。取第一个数字（最右侧的数字），乘以\
  \ `n`（系统的基数）的位数减 1 次方。也就是说，第一个数字的值乘以 `n⁰`，第二个乘以 `n¹`，第三个乘以 `n²`，依此类推。然后将所有结果数字相加。\n\
  \n例如，转换十六进制数 `0x3E1`。记住 `0x` 只是告诉你数值表示法是十六进制的，实际上对数字没有贡献。还，记住 `E` 在十六进制系统中等同于 `14`。\n\
  \n```\n1 x 16⁰ = 1\nE x 16¹ = 224\n+3 x 16² = 768\n```\n然后将它们全部相加，得到结果十进制数字 993。\n\
  \n### 从十进制转换\n从十进制系统转换为 进制系统的过程稍微困难一些。首先，取一个数字并将其除以基数的位数的幂。也就是说，第一列是 1，第二列是 2，依此类推。然后从原数中减去余数。\n\
  \n要找到列中数字的值，将余数除以基数的位数减 1 次幂。虽然这个概念可能看起来很困惑，但它并不困难。例如，将 993 转换回十六进制：\n\n第 1 列：\n\
  993 / 16² = 62 (余数: 1)\n第 2 列：\n62 / 16¹ = 3 (余数: 14，即 `E`)\n第 3 列：\n3 / 16⁰ = 0\
  \ (余数: 3)\n\n结果是 `3xE1`。\n\n\n\n\n\n你现在已经了解了使用 Xcode 的基本步骤。你应该访问 [`developer.apple.com/documentation/DeveloperTools/Xcode-date.html`](http://developer.apple.com/documentation/DeveloperTools/Xcode-date.html)\
  \ 阅读更多详细信息。\n\n# 在 Linux 上进行编程\n\nLinux 是一个功能极其强大的操作系统，从窗口环境到文本编辑器，它提供了许多不同的选择。因此，在\
