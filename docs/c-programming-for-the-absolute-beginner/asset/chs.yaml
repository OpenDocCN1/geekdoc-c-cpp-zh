  \ `m_cities` vector 中。\n\n`hide()` 和 `show()` 成员函数简单地调用 `dbShowSprite()` 和 `dbHideSprite()`，根据船只当前是否在该屏幕上来显示或隐藏地图的特定部分。\n\
  \n`isLandCollision()` 成员函数接收一个 `Point` 对象，如果地图在该位置是陆地而非水域，则返回 `true`。首先，文件流被定位到从文件中读取该确切位置。计算此位置的公式与位图的内部存储密切相关，但基本上，开头有\
  \ 54 个字节是无关的，然后每个像素有 3 个字节，即红、绿、蓝三个值。我们读取绿色和 `blue` 值，并测试 `green` 是否小于 `blue`。如果是，则是水域。否则，必须是陆地。\n\
  \n`isEnteringCity()` 成员函数接收一个 `Point` 对象，如果该 `Point` 在城市内部，则返回指向 `City` 对象的指针。否则，它返回\
  \ `0`。该函数简单地遍历所有城市并调用 `isInside()` 成员函数。\n\n析构函数遍历所有城市并释放它们，销毁精灵和图像，并关闭文件流。\n\n\
