  ## 函数声明\n向程序中引入 `function` 并定义 `function` 的返回类型、名称和参数。也称为原型。\n\n## 函数定义\n`function`\
  \ 内部代码的实现。\n\n## 函数模板\n不特定于任何单一数据类型的 `function`。它使用模板来完成此任务。\n\n## 基础类型\nC++ 语言内置的数据类型。\n\
  \n## 全局\n可以在源文件内任何地方访问的变量。\n\n## 堆\n参见动态内存。\n\n## 头文件\n在 C++ 程序中包含的文件，通常代表 C++ 标准库文件。\n\
  \n## 十六进制\n一种 16 进制系统，使用数字 0–9 和字母 A–F 创建 16 个唯一的数字。\n\n## 标识符\n赋予变量的名称，以便程序员在程序的后续部分方便地引用这些变量。\n\
  \n## 实现\n`function` 的定义。\n\n## 增运算符\n将变量加 1 的 `++` 运算符。\n\n## 索引（也称为下标）\n用于访问数组特定元素的数字。\n\
  \n## 继承\n从一个 `class` 派生另一个 `class`。\n\n## 继承链\n`class` 的继承线。\n\n## 数组初始化列表\n用逗号分隔的值列表；用于初始化数组。\n\
  \n## 对象初始化列表\n构造函数之后的值列表，用于初始化对象的成员变量。\n\n## 附录 E • 术语表\n357\n\n## 输入/输出 (I/O)\n\
  描述计算机与外部世界通信方式的术语。输入设备包括鼠标、键盘、摇杆等。输出设备包括显示器、打印机、扬声器等。\n\n## 插入器\n执行流插入的函数。\n\n##\
  \ 插入\n将字节放入 I/O 流中。\n\n## 整数\n仅存储整数的变量类型（可以是正、负和零）。\n\n## 整数溢出\n当整数达到其最大值加 1 时，它会“回绕”，从而将整数设置为最小值。\n\
  \n## 集成开发环境 (IDE)\n包含你的编译器、文件浏览器、设置和源代码编辑器的图形用户界面。\n\n## 迭代控制语句\n允许根据条件重复代码的控制语句。\n\
  \n## 跳转语句\n用于将程序流从一部分跳转到另一部分而跳过中间的所有内容的关键字。\n\n## 千字节\n由 1024 字节组成的内存单位。主要的内存度量单位之一。\n\
  \n## 库\n你可以在程序中使用的编译代码集。\n\n## 换行符\n表示新行的元字符。\n\n## 链接\n检查代码是否与程序中包含的所有文件协同工作的过程，不仅包括你的文件，还包括像\
  \ DirectX 等外部库。\n\n## 字面量\n程序中实际数据值的表示。数字用阿拉伯数字系统字面表示（1, 2, 3 等）；字符串用引号括的字母和数字表示。\n\
  \n## 局部\n在 `function` 内部声明的变量。只能在该函数内部访问。\n\n## 左值 (lvalues)\n可以赋值或位于赋值语句相等左侧的表达式。\n\
  \n## 机器语言\n程序的编译、可执行版本。\n\n## 主函数\n程序开始时第一个执行的函数。最常见的原型是 `int main(void)`。\n\n##\
  \ 操符\n以某种方式处理流的数据。例如，操符可能会将所有字符转换为大写或将十进制数转换为十六进制。\n\n358\n《初学者 C++ 编程》，第二版\n\n\
  ## 数学运算符\n执行加减等数学函数的运算符。\n\n## 内存\n计算机存储和检索数据的部分。最常见的来源是硬盘、磁盘和随机存内存 (RAM)。\n\n##\
  \ 元字符\n不在屏幕上显示但被计算机用于特殊格式或表示其他字符的字符。这些字符包括制表符、换行符等。\n\n## 取模运算符 (%)\n`x` 除以 `y`\
  \ 的余数 (`x % y`)。\n\n## 命名空间\nC++ 关键字，用于将单个作用域划分为多个子作用域。\n\n## 嵌套\n将 `if` 语句（或其他控制语句）放在其他控制语句内部。\n\
  \n## 空指针（也称为未声明指针）\n存储值为 0 且假设不指向任何数据的指针。\n\n## 空字符\n字符串的终止字符；用转义字符 `\\0` 表示。\n\n\
  ## 对象\n`class` 的特定实例。\n\n## 面向对象编程 (OOP)\n一种编程技术，通过创建同时具有特征和代码的对象来激活数据。\n\n## 操作数\n\
  运算符所操纵的值。\n\n## 操作\n包含运算符及其操作数的短语。\n\n## 运算符\n任何符号或双符号（如 `<=`——以及在某些情况下甚至是如 `sizeof()`\
  \ 这样的单词），会导致编译器执行某个操作。\n\n## 运算符重载\n为现有运算符创建新的用法。\n\n## 顺序\n算法的增长模式。\n\n## 优先级\n\
  某些运算符相对于其他运算符的优先级。例如，`+` 运算符的优先级低于 `*` 运算符。因此，除非被括号等更高运算符覆盖，否则它会在 `*` 运算符之后执行。\n\
  \n## 优先级\n参见运算优先级。\n\n## 重载\n创建多个具有相同名称 `function` 版本。计算机使用参数来确定调用哪个版本。\n\n## 重写\n\
  当派生类声明了一个与其基类中同名的方法。在使用派生类对象时，优先使用派生版本。\n\n## 附录 E • 术语表\n359\n\n## 参数\n参见参数。\n\n\
  ## 父类\n参见基类。\n\n## 指针\n存储另一个数据值地址的变量。\n\n## 实例化点\n类模板或函数模板从一组特定的模板参数生成时。\n\n## 多态\n\
  面向对象编程（OOP）的一种原则，其中每个对象可以在多个程序中使用。\n\n\n\n\n\n# 程序 计算机所执行的一系列指令。也指将源代码输入计算机以进行编译和运行的过程。\n\
