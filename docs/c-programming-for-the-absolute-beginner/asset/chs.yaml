  * **访问修饰符 (access specifiers)**: 指定类成员的作用范围。\n* **地址 (address)**: 表示内存位置的唯一数字。\n\
  * **算法 (algorithm)**: 完成特定任务的逻辑。\n* **分配 (allocate)**: 声明并保留部分内存。\n* **ANSI (美国国家标准协会)**:\
  \ 一个开发计算机行业标准的组织。\n* **参数 (argument)**: 发送到被调用函数的数据。\n* **数组 (array)**: 一个存储数据的列表，每个元素通过其下标引用。\n\
  * **多维数组 (array, multidimensional)**: 数组的数组。\n* **ASCII 码 (美国信息交换代码)**: 一种确定 256\
  \ 个字符位模式的代码。\n* **断言 (assertion)**: 一种语句（通常是宏），用于确保条件为真。\n* **自动 (automatic)**:\
  \ 默认存储所有局部变量的内存。\n* **基类 (base class)**（也称为超类和父类）: 另一个类派生的类。\n* **二进制 (binary)**:\
  \ 一使用数字 1 和 0 的计数系统。\n* **二进制文件 (binary file)**: 与文本文件不同，数据以压缩格式存储的文件。\n* **位 (bit)**:\
  \ 内存的最小单位；通常用 1 或 0 表示。\n* **块 (block)**: 由括号括起来的 C++ 代码段。\n* **布尔 (Boolean)**:\
  \ 表示两种可能值（真或假）的基础数据类型。\n* **布尔逻辑 (boolean logic)**: 对布尔数据类型之间关系的研究。\n* **错误 (bug)**:\
  \ 计算机错误。\n* **字节 (byte)**: 由 8 位表示的内存单元；可以存储 256 个值中的任何一个。\n* **调用 (calling)**:\
  \ 从程序的其他部分启动函数的行为。\n* **调用过程 (calling procedure)**: 调用另一个函数的函数。\n* **字符 (character)**:\
  \ 一个可以存储 ASCII 字符集中 256 个不同字符之一的变量。\n* **子类 (child class)**: 见派生类 (derived class)。\n\
  * **类 (class)**: 用于定义对象特征的结构，包括对象的数据成员和函数成员。\n* **类层次结构 (class hierarchy)**: 显示类与类之间继承关系的树形结构。\n\
  * **类模板 (class template)**: 一种不特定于某种数据的类；使用模板来实现这一目标。\n* **代码片段 (code fragment)**:\
  \ 程序的某个部分。\n* **命令 (command)**: 编程语言指令。\n* **注释 (comment)**: 放在源代码中的信息性代码，旨在为程序员或试图理解代码的人提供便利。编译器忽略注释。\n\
  * **编译器 (compiler)**: 将源代码转换为可执行格式。\n* **编译 (compiling)**: 将你的源代码通过编译器以将其转换为可执行格式的行为。\n\
  * **复杂度 (complexity)**: 算法效率的衡量标准。\n* **拼接 (concatenation)**:两个或多个字符串的合并。\n* **条件语句\
