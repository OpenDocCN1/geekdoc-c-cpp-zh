  **81**\n这些课程是编程不可或缺的一部分，将极大增强你程序的功能。\n\n#### 挑战\n1. 编写一个条件语句（`if` 语句），如果 `y` 不等于\
  \ 0，则将 `x/y` 赋值给 `x`。\n2. 编写一个 `while` 循环，计算从 1 到某个数字 `n` 的正整数和（如果你想检查一下，公式是 `n\
  \ (n + 1) / 2`）。\n3. 编写一个条件语句：如果 `x` 是偶数，则赋值 `x * y`；否则，如果 `x` 是奇数且 `y` 不等于 0，则将\
  \ `x / y` 赋值给 `x`；如果上述两种情况都不成立，在屏幕上输出 `y` 等于 0。\n\n### 第 4 章：使用函数结构你的代码\n如果你一直按照顺序阅读这本书，那么你已经在旅程中取得了长远进展。坐一会儿，让所有信息在大脑中过滤一遍；然后去泡杯黑咖啡，坐在你最喜欢的椅子上，做好准备。你面前有一段精彩的旅程。\n\
  \n在本章中，你将学习到以下内容：\n* 使用函数结构化你的代码\n* 创建默认参数\n* 区分变量作用域\n* `main` 函数\n\n#### 分而治之\n\
  想象你是罗马帝国军队的指挥官，正在进攻日耳曼尼亚的蛮族族群。正如你的任何一位皇家战略家会告诉你的一样，一次性进攻对手的整个军队并不具有策略性。将军队分成若干部分并分别进攻每个部分要机智得多。\n\
  \n这样做可以让你的军队处于显著的优势地位，并让罗马帝国的力量进一步增长。\n\n**84**\n**《初学者 C++ 编程》，第二版**\n在 C++ 编程中也是如此的。如果你有一个巨大的应用程序要设计，并且在时间限制内工作，解决该问题最简单的方法就是将其分解为几个编程任务，然后分别处理每个任务。正如任何数学家都会告诉你的一样，将问题分解为一组已经解决的问题，你就完成了。\n\
  \n这就是使用函数背后的思想。\n\n函数允许程序员将代码划分为许多易于管理的片段。此外，使用函数而不是多次重复代码，你可以编写一次并反复使用。有了函数，你不再需要每次遇到问题时都去想解决方案，而是让函数为你完成这项工作。然后你可以在任何需要的地方使用该解决方案。\n\
  \n例如，你可能会写一个名为 `getWindowSize` 的函数，用于计算特定窗口的大小。每当你需要知道某个窗口的大小时，只需让该函数计算大小即可。请记住，函数和请求函数执行任务的代码之间必须相互通信。在当前的示例中，`getWindowSize`\
  \ 函数需要知道讨论的是哪一个窗口，而函数必须向请求代码发送该窗口的大小。\n\n在继续之前，这里是我们在本章中将使用的一些定义（你现在可能无法理解所有的内容，但当你读完本章时就会理解了）：\n\
  * **代码块（或代码段）**：任何封装在花括号内的代码。\n* **函数**：一段代码段。\n* **调用过程**：执行特定任务的代码片段。\n* **调用函数**：使用函数名称来执行代码。\n\
  * **参数**：调用过程发送给函数的信息（数据）。\n* **参数列表/形列表**：为了调用特定函数而传递的参数列表。\n* **返回值**：函数返回给调用过程的任何值。注意，给定的函数只有一个返回值，如图\
  \ 4.1 所示。\n\n### 第 4 章 • 使用函数结构你的代码\n**85**\n**图 4.1**\n调用过程的概念\n\n### 探索函数语法\n\
  在本节中，我们将从理论层面转向实践层面，学习如何编写函数所需的代码。为了做到这一点，你必须首先学会函数语法。然而，现在你只需要关注函数的三个部分。这三个部分将是你程序与函数交互的基础：\n\
  * 函数声明\n* 函数定义\n* 函数调用\n\n在接下来的章节中，我们将讨论每一个部分。\n\n##### 函数声明\n函数声明告诉编译器某个函数的存在。你告诉编译器函数的名称、参数是什么以及函数返回什么。函数声明也称为原型（prototype），因为它是函数的模型。函数声明的通用语法如下：\n\
  \n```cpp\nreturn_type function_name(argument_list);\n```\n\n等等，文本说：“在这里 `return_type`\
  \ 是函数返回的数据类型，`function_name` 是函数的名称，`argument_list` 是函数所需的参数列表。不要忘记在声明末尾加上分号。”\n\
  \n如果你不想返回值，可以使用关键字 `void` 替换 `return_type`：\n\n```cpp\nvoid function_name(argument_list);\n\
  ```\n\n**86**\n**《初学者 C++ 编程》，第二版**\n如果没有参数，`argument_list` 可以为空：\n\n```cpp\nreturn_type\
  \ function_name();\n```\n\n否则，参数列表是一组由逗号隔开的变量声明：\n\n```cpp\nreturn_type function_name(arg1_type\
  \ arg1_name, arg2_type arg2_name, …);\n```\n注意每个参数声明都是一个简单的变量声明（你可能在第 2 章“深入理解变量”的材料中熟悉这种语法）。\n\
  \n**示例—add 函数**\n\n\n\n\n\n`add` 函数背后的思想非常直观——接收两个数字，将它们相加并返回结果。虽然在这个示例中使用了整数，但任何数值数据类型都可以胜。\n\
  \n要编写函数声明，你需要三部分信息：\n\n• 函数名\n• 函数返回类型\n• 函数参数列表\n\n函数名可以是任何有效的标识符（关于标识符的更多信息请参阅第\
  \ 2 章）。\n\n然而，一个能够描述函数用途的简洁名称是最有意义的。在这种情况下，决定名称相对容易。它被命名为 `add`。\n\n函数的返回类型需要是一个整数。你使用整数类型\
  \ `int` 是因为函数返回的是一个数字。\n\n需要的最后一部分信息是函数参数列表。由于函数接受两个参数，你必须编写两个变量声明，我们任意将它们命名为参数\
  \ `a` 和 `b`。`a` 和 `b` 都必须是整数，因为它们代表了你将相加的两个数字。生成的参数列表如下：\n\n`(int a, int b)`\n\n\
  按照通用语法，你可以将这三部分信息组合在一起形成 `add()` 函数声明：\n\n`int add(int a, int b);`\n\n在继续创建此函数之前，你需要知道如何定义一个函数。\n\
  \n## 第 4 章 使用函数结构化代码\n\n## 定义函数\n\n本节中的信息是函数的灵魂。在本节中，你编写函数包含的代码。函数定义就像一个函数声明，内部包含两个大括号\
  \ `{` 和 `}`，你在其中放置代码。这里是通用语法：\n\n```\nreturn_type function_name(argument_list)\n\
  {\n    code;\n}\n```\n\n这里的 `code` 是一个或多个语句，每条语句都以分号结尾。注意，函数定义最后不需要分号。与声明函数一样，`return_type`\
  \ 可以是 `void` 表示没有返回值，`argument_list` 可以留空表示没有参数。\n\n使用 C 和 C++ 的一个大区别在于，在 C++ 中你可以在任何需要的地方声明变量。在\
  \ C++ 中任何可以包含语句的地方，你也可以包含变量声明。\n\n尽管你几乎可以在任何地方包含变量声明，但请尝试 `T R I C K` 开发出一种使用它们的标准方法。我们只在代码块开头声明它们。这样，我们很容易地找到变量声明。\n\
  \n如果函数返回一个值，它必须有一个或多个返回语句。返回语句以关键字 `return` 开头，后跟一个评估结果与 `return_type` 相同数据类型的表达式以及一个分号。如果你写一个返回浮点数（float）的函数，这将是一个有效的返回语句：\n\
  \n```\nreturn 3.141592;\n```\n\n如果你的函数没有返回值，你可以有一个空白返回语句：`return;`\n\n然而，不返回值的函数完全不需要返回语句。在没有返回语句的情况下，它将在到达函数结束时直接终止。\n\
  \n一旦到达返回语句，函数就会终止。你可以在函数中拥有多个返回语句。这里是函数中的一种常见模式：\n\n```\nif (condition)\n    return\
  \ expression1;\nreturn expression2;\n```\n\n这段代码仅在条件评估为真时返回 `expression1`。否则，它返回\
  \ `expression2`。通常在函数末尾只保留一个返回语句是更好的主意。返回类型可以存储在变量中，如下：\n\n```cpp\nif (condition)\n\
  \    ret = expression1;\nelse\n    ret = expression2;\nreturn ret;\n```\n\n你可以在函数内部使用参数中创建的变量。这些变量会在调用函数时被传入的数据填充。\n\
  \n### 示例——add 函数的延续\n\n现在你已经准备好定义 `add` 函数了。根据函数的描述，你知道两个参数之和必须被返回。那么这个定义就变成了一个简单的任务：\n\
  \n```\nint add(int a, int b)\n{\n    return a + b;\n}\n```\n\n你可以看到，这个函数相对短且简单。在现实编程世界中，函数可能会变得非常长，尽管保持函数尽可能短是一种良好的编程习惯。每个函数应该只执行一个简单的任务。通过在其他简单函数的基础上构建简单函数，你可以在执行非常复杂任务的同时保持代码简单。\n\
  \n## 调用函数\n\n为了在代码的某部分使用函数，你必须在该代码内部调用它。\n\n当你调用函数时，你是在告诉计算机在继续当前部分之前开始执行另一部分代码（函数内部的代码）。\n\
  \n要调用函数，你编写函数名，后面跟着你要传递的参数。\n\n这里是通用语法：\n\n```\nfunction_name(data1, data2, …);\n\
  ```\n\n这里的 `data1` 和 `data2` 的数据类型必须与函数定义中的类型相同。例如，如果函数定义中的第一个参数是整数，那么 `data1` 也必须是整数，尽管当你传递的值可以轻松转换为正确的值时会发生例外情况。在前面的示例中，你可以传递一个浮点数或双精度数（例如，`3.56`），该值将会被截断以变为整数（例如，`3`）。\n\
  \n如果函数声明和函数定义中的参数列表为空，你可以使用一组空括号：\n\n`function_name();`\n\n传递给函数的值会被赋值给参数列表中的每个变量。例如，如果你的函数声明是：\n\
  \n```cpp\nint my_Function(int first, int second)\n{\n    return first;\n}\n```\n\
  \n并且你在其他地方调用该函数 `my_Function(5,3)`，那么这次函数调用的语义与这两个初始化相同：\n\n```cpp\nint first =\
  \ 5;\nint second = 3;\n```\n\n编译器首先检查你传递给函数的数据类型与函数要求的类型是否匹配。在这个示例中，C++ 检查你是否正在向\
  \ `my_Function` 传递两个整数。如果需要转换（强制类型转换）（例如从浮点数到整数），则会进行转换。如果两种数据类型不兼容，编译器将返回错误。通过这种方式，你的函数可以访问传递给它的数据。\n\
  \n返回值稍微复杂一点。当你在代码中调用函数时，该调用会被返回值替换。由于 `my_Function` 返回一个整数，因此你可以在任何通常使用整数的地方调用 `my_Function`。这里有一个示例：\n\
  \n`my_Int = 5 + my_Function(5,3);`\n\n在 `my_Function` 执行完成后，该调用会被它返回的值替换（这种替换并不是立即显见的，所以在编程时请记住这一点）：`my_Int\
  \ = 5 + 5;`\n\n### 示例——add 函数的延续\n\n现在你有了足够的信息来编写对 `add` 函数的调用。这里有一个向用户询问两个值并使用\
  \ `add` 函数输出总和的程序：\n\n```cpp\n#include <iostream>\n\nint add(int a, int b)\n{\n\
  \    return a + b;\n}\n\nint main (void)\n{\n    using std::cout;\n    using std::cin;\n\
  \n    int number1, number2;\n\n    cout << “输入要相加的第一个值: “;\n    cin >> number1;\n\
  \n    cout << “\\输入第二个值: “;\n    cin >> number2;\n\n    cout << “\\n 总和为: “ << add(number1,\
  \ number2) << “\\n”;\n}\n```\n\n## 总结整合\n\n一个包含函数的完整程序有三个基本组件：\n\n• 可选的函数声明\n• 主函数\n\
  • 函数定义\n\n\n\n\n一个函数在被调用之前必须先声明或定义。如果你将函数定义放在程序的开头，则不需要声明。然而，如果函数定义位于程序的末尾，且你在该函数定义之前调用了该函数，你就需要告诉计算机该函数的存在。你通过将函数的声明放置在程序的开头来实现这一点。\n\
  \n这里是带有 `add` 函数的完整“相加程序”。此程序需要函数声明，因为函数定义位于程序的末尾：\n\n### 第 4 章 • 使用函数结构化代码 91\n\
  \n// 4.1 - 相加程序 – Mark Lee\n\n```cpp\n#include <iostream>\n\n//add 声明\nint add(int\
  \ a, int b);\n\n// 显示 add 函数的示例用法\nint main (void)\n{\n  using std::cout;\n  using\
  \ std::cin;\n  int number1, number2;\n  cout << “输入要加的第一个数字: “;\n  cin >> number1;\n\
  \  cout << “\\n 第二个数字: “;\n  cin >> number2;\n  cout << “\\n 和为: “ << add(number1,\
  \ number2) << “\\n”;\n}\n\n// 两个数相加并返回和\nint add(int a, int b)\n{\n  return a +\
  \ b;\n}\n```\n\n目前为止，你一直将代码放在 `int main (void)` 及其闭合括号内部。这段代码被称为主函数。函数的声明和定义必须在此部分之外。如果你现在觉得这看起来很困惑，不要担心；随着时间的推移，它会变得清晰得多。\n\
  \n编写此程序的另一种方法是将 `add` 定义放在代码的开头而不是末尾。在这种情况下，你不需要函数声明，因为函数定义本身充当了声明：\n\n```cpp\n\
  #include <iostream>\n\nint add(int a, int b)\n{\n  return a + b;\n}\n```\n\n###\
  \ 92 《C++ 编程从初学者入门》，第二版\n\n```cpp\nint main (void)\n{\n  int number1, number2;\n\
  \  cout << “输入要加的第一个数字: “;\n  cin >> number1;\n  cout << “\\n 第二个数字: “;\n  cin >>\
  \ number2;\n  cout << “\\n 和为: “ << add(number1, number2) << “\\n”;\n}\n```\n\n\
  这种方法（将定义放在开头）与添加声明并将定义放在程序末尾的效果同样良好。这两种方法都没有提供特殊的优势，因此你选择哪种仅取决于喜好。\n\n## 函数重载\n\n\
  当你需要为多一种可能的数据类型编写 `add` 函数时，该怎么办？\n\n一种方法是为每种类型编写一个单独函数，并为它们使用不同的名称。你可以将其中一个函数命名为\
  \ `int_add()` 来加两个整数，另一个为 `float_add()` 来加两个浮点数。这个过程可能非常枯燥，如果你想使用该函数，必须查找对应数据类型的正确名称。\n\
  \n幸运的是，C++ 提供了一些替代方案。一种方法是此处讨论的函数重载，另一种是在第 7 章“代码复用：泛型编程”中讨论的泛型编程。对于函数重载，你不需要给每个函数不同的名称，而是给它们相同的名称。例如，`add`\
  \ 函数的每个版本都称为 `add`。但计算机如何区分它们呢？当你调用 `add` 函数时，计算机如何知道使用哪一个版本的 `add` 函数？\n\n答案其实非常简单。计算机只需查看参数类型和参数数量，并尝试将你的函数调用匹配到正确的函数。这里是一个示例：\n\
  \n```cpp\nint add (int a, int b)\n{\n  return a + b;\n}\n\ndouble add (double a,\
  \ double b)\n{\n  return a + b;\n}\n```\n\n### 第 4 章 • 使用函数结构化代码 93\n\n```cpp\n\
  int main(void)\n{\n  cout << add(5,3);\n  cout << add(5.5, 4.7);\n  return 0;\n\
  }\n```\n\n第一次调用 `add` 时调用的是 `add` 函数的整数版本（第一个），因为 `5` 和 `3` 都是整数，这与 `add` 整数版本的原型匹配。第二次调用\
  \ `add` 时调用的是函数的浮点版本。\n\n## 默认参数\n\n某些函数具有高度灵活性，提供了许多不同的选项来精确定制它们的工作方式。这转化为调用该函数时需要许多参数。然而，这些参数在大多数情况下可能是不需要的。在这种情况下，给这些参数一个默认值通常是合理的，这样调用者就不需要每次都指定它们。\n\
  \n在 C++ 中，你可以为某些参数指定默认值。如果调用过程没有传递完整的参数列表，则使用默认参数。\n\n在代码中实现参数的通用语法为：`return_type\
  \ function_name(arg_type arg_name = default_value)`\n\n这里 `default_value` 是参数的默认值。如果调用者没有为此参数提供值，则使用\
  \ `default_value`。当然，你仍然可以拥有多个参数：\n\n`return_type function_name(arg1 = value1, arg2\
  \ = value2)`\n\n这里 `arg1` 和 `arg2` 是参数的类型和名称。\n\n某些参数带有默认值，而某些参数不带，这是可能的。\n\n规则是，所有不带默认值的参数必须位于参数列表的前。换句话说，对于任何带有默认值的特定参数，参数列表中位于其后的所有参数也必须具有默认值。\n\
  \n要使用此类函数，你可以将某些参数视为不存在。如果你的函数声明是：\n\n### 94 《C++ 编程从初学者入门》，第二版\n\n```cpp\nint my_Function(int\
  \ a, int b, int c = 0);\n```\n\n你可以用两种方式调用此函数：\n\n```cpp\ncout << my_Function(5,\
  \ 3, 6);\ncout << my_Function(5, 3);\n```\n\n在第一行中，`c` 的值为 `6`，但在第二行中，`c` 的值为 `0`。\n\
  \n默认参数为你提供了一种方法，让你编写出既高度可定制、又在常见情况下调用非常简单的函数。你可以兼得两者。然而，你应该谨慎使用它们，并且仅在它们能提供真正的优势并增加清晰度时才使用。\n\
  \n## 深入理解变量作用域\n\n你目前为止学习的所有代码都可以属于四类之一，每种类型都有关于哪些变量可以访问它的规则：\n\n- `main` 函数内部的代码\n\
  - 其他函数的代码\n- 代码块，例如 `if` 语句或 `namespace`\n- 函数外部的代码\n\n在这些类别中，都有关于变量持续多久（变量寿命）以及在哪里可以访问（变量作用域）的规则。\n\
  \n变量作用域和寿命的通用规则如下：\n\n- 如果变量在代码块之外声明，被称为全局变量，它的作用域和寿命从声明处一直到文件结束。正如在本章前面提到的，代码块是任何大括号内的代码。这包括函数。\n\
  - 如果变量在代码块内部声明，被称为局部变量，它的作用域和寿命直到代码块结束。\n- 如果变量在函数的参数列表中声明，被称为参数，它的作用域和寿命直到函数结束。\n\
  \n这些规则的一个含义是，函数无法访问在 `main` 函数内部定义的变量，除非它们作为参数传递给函数。\n\n如果变量在一个嵌套在另一个块中的块中声明，则变量的作用域被限于内部块。\n\
  \n### 第 4 章 • 使用函数结构化代码 95\n\n也许这个示例有助于澄清前面的规则：\n\n// 4.2 - 变量作用域示例 - Mark Lee\n\
  \n```cpp\n#include <iostream>\n\nint subtract (int a, int b);\n\nint global = 5;\n\
  \nint main(void)\n{\n  using std::cout;\n  int a, b;\n  a = 5;\n  b = 3;\n  cout\
  \ << “main 的 a 的值为: “ << a\n  << “\\nmain 的 b 的值为: “ << b\n  << “\\nglobal 的值为:\
  \ “ << global << “\\n”; global = 2 + subtract(a,b);\n\n  cout << “main 的 a 现在的值为:\
  \ “ << a;\n}\n```\n\n\n\n\n```cpp\n<< “\\nThe value of main’s b now is: “ << b\n\
  \n<< “\\nThe value of global now is: “ << global << “\\n”; return 0;\n\n}\n\nint\
  \ subtract(int a, int b)\n\n{\n\nusing std::cout;\n\ncout << “The value of subtract’s\
  \ a is: “ << a\n\n<< “\\nThe value of subtract’s b is: “ << b << “\\n”; a = a -\
  \ b + global;\n\nreturn a;\n}\n```\n\n### 输出:\n```\nThe value of main’s a is: 5\n\
  The value of main’s b is: 3\nThe value of global is: 5\nThe value of subtract’s\
  \ a is: 5\n```\n\n96\n**C++编程：初学者教程，第二版**\n\n```\nThe value of main’s a now is:\
  \ 5\nThe value of main’s b now is: 3\nThe value of global now is: 9\n```\n\n在任何函数之前，声明了全局变量\
  \ `global`。在 `main` 的开始处，声明了两个局部变量 `a` 和 `b`。当调用 `subtract` 时，`main` 中的 `a` 和 `b`\
  \ 的值被拷贝到 `subtract` 的 `a` 和 `b` 中。然后 `subtract` 计算差值并赋值给 `a`。当这个值从 `subtract` 函数返回时，执行\
  \ `global = 2 + subtract(a,b)`，你将得到：\n\n```\nglobal = 2 + 7;\n```\n\n换句话说，因为 `subtract`\
  \ 返回了 `subtract` 中 `a` 的值，这一行代码只是在返回值上加上 2（在这种情况下返回值是 7）。\n\n请记住，这段代码中有两个独立的、不相关的\
  \ `a` 和 `b` 版本；`main` 的 `a` 与 `subtract` 的 `a` 没有任何关系。通常情况下，过度使用这样的变量名并不是好主意。它们应该清楚地表示它们在各自作用域内的用途。\n\
  \n注意，`cout` 的 `using` 声明出现了两次，每个函数一次。这是因为只作用于它出现的代码块。如果你愿意，可以将 `using` 声明放在全局范围，放在每个函数之外，如下所示：\n\
  \n```cpp\n//4.2 - 变量作用示例 - Mark Lee\n\n#include <iostream>\n\nusing std::cout;\n\
  \nint subtract (int a, int b);\n\nint global = 5;\n\nint main(void)\n\n{\n\nint\
  \ a, b;\n\na = 5;\n\nb = 3;\n\ncout << “The value of main’s a is: “ << a\n<< “\\\
  nThe value of main’s b is: “ << b\n<< “\\nThe value of global is: “ << global <<\
  \ “\\n”; global = 2 + subtract(a,b);\n\ncout << “The value of main’s a now is: “\
  \ << a\n<< “\\nThe value of main’s b now is: “ << b\n<< “\\nThe value of global\
  \ now is: “ << global << “\\n”; return 0;\n\n}\n\nint subtract(int a, int b)\n\n\
  {\n\ncout << “The value of subtract’s a is: “ << a\n<< “\\nThe value of subtract’s\
  \ b is: “ << b << “\\n”; a = a - b + global;\n\nreturn a;\n\n}\n```\n\n然而，最好将 `using`\
  \ 声明放在适用的函数内部。这有助于使情况变得清晰，让你确切知道在何处使用了。\n\n### 使用作用域解析运算符指定\n\n有时，你可能会遇到全局变量和局部变量同名的情况。这在\
  \ C++ 中是合法的，但会导致一些混淆。这是一个示例：`int intVar;`\n\n```cpp\nint main(void)\n\n{\n\nint\
  \ intVar; // 与全局变量 intVar 不同\n\nintVar = 5;\n\nreturn 0;\n\n}\n```\n\n乍眼很难看出哪一个\
  \ `intVar` 版本被赋值为值 5，但确实存在一条规则。如果局部变量与全局变量同名，则该局部变量被认为“遮蔽”（shadow）了全局变量。对该名称变量执行的所有操作都是在局部变量上进行的。\n\
  \n如果可能，最好避免这种情况。如果你的变量名发生冲突，说明设计不佳。考虑重新组织你的代码。然而，了解如何处理这种情况是有好处的。那么在这些情况下，你如何访问全局变量呢？\n\
  \n98\n**C++编程：初学者教程，第二版**\n\n答案是使用作用域解析运算符。如果你想确保使用变量的全局版本，只需在前面加上两个冒号（`::`）。例如，为了让前面的代码使用全局版本，你将之前的代码更改为如下：`int\
  \ intVar;`\n\n```cpp\nint main(void)\n\n{\n\nint intVar;\n\n::intVar = 5;\n\nreturn\
  \ 0;\n\n}\n```\n\n这种遮蔽效应也可以发生在子块中。例如，如果你在 `main` 函数内部有一个 `if` 语句，那么在 `if` 块内声明的变量可以遮蔽全局变量或\
  \ `main` 的局部变量。然而，作用域解析运算符只能指定全局变量。例如，如果 `if` 语句中的变量遮蔽了 `main` 变量，你就无法访问该变量的 `main`\
  \ 版本。这里有一个说明：\n\n```cpp\n#include <iostream>\n\n#include <string>\n\nusing std::string;\n\
  \nstring str = “Humans and elves can coexist. ”;\n\n// 示例作用域解析运算符(::)\n\nint main(void)\n\
  \n{\n\nusing std::cout;\n\nstring str = “Elves often live in the woods. ”;\n\ncout\
  \ << str.c_str() << “—-” << ::str.c_str() << “\\n”; if (true)\n\n{\n\nstring str\
  \ = “Humans often live in cities. ”;\n\ncout << str.c_str() << “—-” << ::str.c_str()\
  \ << “\\n”;\n}\n\nreturn 0;\n\n}\n```\n\n第 4 章 • 使用函数结构化代码 99\n\n输出:\n```\nElves\
  \ often live in the woods. —-Humans and elves can coexist.\nHumans often live in\
  \ cities. --Humans and elves can coexist.\n```\n\n### 使用静态变量\n\n有时，你会发现每次调用函数时在函数内部使用同一个变量是方便的。局部变量不起作用，因为它们在每次调用函数时都会重新创建。全局变量可以工作，除非你想确保该变量不在函数外部被访问或更改。解决方案之一是使用静态变量。\n\
  \n静态变量的作用域与普通变量相同，但它们的周期持续到程序结束。通过这种方式，你可以创建一个具有“记忆”的函数。\n\n你使用 `static` 关键字声明静态变量：\n\
  \n`static var_type var_name;`\n\n创建静态变量的语句对于整个程序只执行一次。这意味着如果你在同一行上初始化静态变量 `static\
  \ var_type var_name = value;`，那么该初始化将只执行一次。\n\n看下面的示例：\n\n```cpp\n//4.3 - 静态变量示例\
  \ - Dirk Henkemans and Mark Lee\n\n#include <iostream>\n\nint incrementFunction1(void);\n\
  \nint incrementFunction2(void);\n\n// 运行递增函数\n\nint main(void)\n\n{\n\nusing std::cout;\n\
  \nfor(int c = 0 ; c < 4 ; c++)\n\n{\n\ncout << ”Incrementing both variables.\\n”;\n\
  \ncout << “Value of function1 is: “ << incrementFunction1() << “\\n”; cout << “Value\
  \ of function2 is: “ << incrementFunction2() << “\\n”;\n\n}\n\nreturn 0;\n\n}\n\n\
  // 带有静态变量的递增函数\n\nint incrementFunction1(void)\n\n{\n\nstatic int x = 0;\n\nx++;\n\
  \nreturn x;\n\n}\n\n// 带有非静态变量的递增函数\n\nint incrementFunction2(void)\n\n{\n\nint\
  \ y = 0;\n\ny++;\n\nreturn y;\n}\n```\n\n输出:\n```\nIncrementing both variables.\n\
  Value of function1 is: 1\nValue of function2 is: 1\nIncrementing both variables.\n\
  Value of function1 is: 2\nValue of function2 is: 1\nIncrementing both variables.\n\
  Value of function1 is: 3\nValue of function2 is: 1\nIncrementing both variables.\n\
  Value of function1 is: 4\nValue of function2 is: 1\n```\n\n在这个示例中，`x` 和 `y` 都是局部变量。虽然\
  \ `x` 是静态的且只初始化一次，但 `y` 在每次调用 `incrementFunction2` 时都会被初始化为 0。因此，`incrementFunction2`\
  \ 总是返回 1，而 `incrementFunction1` 将继续增加 `x`。\n\n100\n**C++编程：初学者教程，第二版**\n\n第 4 章\
  \ • 使用函数结构化代码 101\n\n### 欢迎来到蜗龟赛\n\n现在，是时候尝试从本章中学获得的技能了。在“蜗龟赛游戏”中，请务必注意与以下点相关的实例：\n\
  \n• 只有一个全局变量（金钱）。它是全局的，因为它是在函数外部声明的。\n\n\n\n\n\n• `money` 在 `race()` 函数中用作局部变量，同时也作为一个全局变量使用；默认使用局部变量；然而，每当\
  \ `money` 作为全局变量使用时，都会使用作用域解析符（`::`）。\n\n• 此示例有两个版本的 `race()` 函数。它们接收不同的参数。\n\n\
  这两个 `race()` 函数是函数重载的示例。\n\n现在，让我们来营造一下氛围：你是否曾经希望时间能过得再慢一点点？去看看蜗牛比赛吧，你的愿望就会成真。别担心，最终，其中一只可爱的小家伙会获胜，但你可能在那儿等上一段时间。\n\
  \n```cpp\n//4.4 - 蜗牛赛游戏 -Dirk Henkemans and Mark Lee\n\n#include <iostream>\n#include\
  \ <ctime>\n\n//function declarations\nint race(int, int);\nvoid race(void);\nint\
  \ menu(void);\nint placeBet(int);\nvoid init(void);\n\n//variables\nint money =\
  \ 200;\n\n//the main function\nint main(void)\n{\n    using std::cout;\n    init();\n\
  \    int userResponse;\n    cout << “Welcome to the snail races!!!\\n”;\n    while(userResponse\
  \ = menu())\n    {\n        switch(userResponse)\n        {\n            case 1:\n\
  \            case 2:\n            case 3:\n                ::money += race(placeBet(userResponse),\
  \ userResponse);\n                break;\n            case 4: //the user did not\
  \ bet\n                race();\n                break;\n        }\n    }\n    return\
  \ 0;\n}\n\n//displays the main menu and returns the user’s selection\nint menu(void)\n\
  {\n    using std::cout;\n    using std::cin;\n    int userResponse;\n    cout <<\
  \ “You have “ << money << “ dollars.\\n”;\n    do\n    {\n        cout << “Races\
  \ Menu\\n”\n             << “1) Bet on snail 1\\n”\n             << “2) Bet on snail\
  \ 2\\n”\n             << “3) Bet on snail 3\\n”\n             << “4) Just Watch\\\
  n”\n             << “0) Leave the races\\n”;\n        cin >> userResponse;\n   \
  \ } while(userResponse < 0 && userResponse > 4);\n    return userResponse;\n}\n\n\
  //decides how much a person will bet on the snail\nint placeBet(int userResponse)\n\
  {\n    using std::cout;\n    using std::cin;\n    int betAmount;\n    cout << “Snail\
  \ “ << userResponse << “ is a good choice!\\n”; cout << “How much would you like\
  \ to bet on your snail “ << userResponse << ”? ”;\n    cin >> betAmount;\n    return\
  \ betAmount;\n}\n\n//if they are just watching the race\nvoid race (void)\n{\n \
  \   race(0, 0);\n}\n\n//if they are betting money\nint race (int money, int userResponse)\n\
  {\n    using std::cout;\n    using std::rand;\n    //stores the random number\n\
  \    int winner = rand() % 3 + 1;\n    cout << “And the snails are off\\n”\n   \
  \      << “Look at them GO!!!\\n”\n         << “The winner is snail “ << winner\
  \ << “\\n\";\n    if(winner == userResponse)\n    {\n        cout << “You Win!\\\
  n”;\n        return 2 * money;\n    }\n    cout << ”You lose “ << money << “ dollars.\\\
  n”;\n    return -1 * money;\n}\n\n//handles program initializations\nvoid init(void)\n\
  {\n    using std::srand;\n    using std::time;\n    srand(time(0));\n}\n```\n\n\
  哇，这真是一种放松且无压力的赌博方式！如果你输了，还可以做一份美味的开胃菜。真是双赢的局面！\n\n## 揭示 main 函数\n\n你可能已经注意到我们一直在称\
  \ `main` 为一个函数。这是有原因的：`main` 确实是一个函数。“但这不可能！”你说，“我才刚刚学了函数，而且从第 1 章‘开启旅程’开始我就一直在用\
  \ `main`！”别害怕，年轻的探险者。这个概念比你想象的要简单。\n\n你可以广义地将函数定义为将程序分解为更小、更容易管理的任务的代码段。想想你的计算机操作系统。如果它是多任务处理的，它会有许多程序同时运行。这些每个程序都有一个\
  \ `main` 函数。\n\n通常，每个程序都从 `main` 函数开始，并在 `main` 函数结束时结束。\n\n现在，把你的操作系统看作一个程序。从它调用所有其他的\
  \ `main` 函数（如图 4.2 所示）。\n\n你是否开始看到你的操作系统与你创建的程序之间存在相似之处了？`main` 函数与你创建的函数之间也存在相似之处。\n\
  \n这就是为什么 `main` 是一个函数。\n\n根据我们的经验，大多数程序员在这一点上会对程序究竟如何运行感到困惑。计算机是如何决定从哪里开始的？我们预料到了这种困惑，所以现在我们现在一步步带你了解这个过程。\n\
  \n```cpp\nmain ( )\n{\n    main\n    //some code\n}\n\nmain\na = 5, b = 3\n\nmain\
  \ ( )\nint add(int a, int b)\n{\n    {\n        add (5, 3)\n        return a + b;\n\
  \    }\n}\n```\n图 4.2\n\n## 查看执行顺序\n\n以下是执行的顺序：\n\n1. 全局变量被创建。\n2. `main` 函数开始。\n\
  3. `main` 中的每行代码顺序执行。\n4. `main` 函数退出。\n5. 所有局部变量被销毁。\n\n## 向 main 传递参数\n\n当操作系统启动程序时，有时会向程序传递信息。对于你现在创建的程序，只有一种信息可以传递：命令行参数。但在其他程序（如\
  \ Windows 程序）中，可以传递许多信息。\n\n如果你使用 Windows 作为操作系统，你可能不熟悉在命令提示符中输入命令（不像那些使用 DOS 或\
  \ UNIX 的人）。要访问 MS-DOS 提示符，从 Windows 任务栏点击开始，从出现的菜单中选择程序、MS-DOS 提示符（你的选项可能是开始、程序、命令提示符）。如果你需要更多信息，可以在网上查找。\n\
  \n在第 5 章“内存管理”中，你将学习如何响应这些命令行参数以便你的程序可以使用它们。现在，只需要意识到这是可能的。\n\n\n\n\n\n走出“黑暗操作系统森林”后，你看到远处升起了一些烟雾。\n\
  \n你走近观察，发现一个村庄正在着火。一些哥林正在攻击一个地矮人村庄！高贵的冒险者，你愿意前往哥林洞穴，为这个世界除这些邪恶的入侵者吗？\n\n# 第 4 章\
  \ • 使用函数结构化你的代码\n\n矮人们需要你的帮助，你将需要使用现在掌握的所有关于函数的知识来帮助他们！\n\n```cpp\n//4.5 - The Cave\
  \ Adventure Game - Dirk Henkemans\n\n#include <iostream>\n#include <string>\n\n\
  using std::string;\n\nbool intro(void);\n\nvoid room(bool enemy, bool treasure,\
  \ string description);\n\n//player stats\nstring name = \"\";\n\n//enemy stats\n\
  string enemyName = \"\";\n\n//treasure stats\nstring treasureName = \"\";\n\n//room\
  \ descriptions;\nconst string room1 = \"You enter the mouth of the caves.\";\nconst\
  \ string room2 = \"You adventure deeper into the caves.\";\nconst string room3 =\
  \ \"You have reached the depths of the caves.\";\n\nint main( void )\n{\nif(intro())\n\
  \    return 0; //if they choose not to do it exit the program\n\ntreasureName =\
  \ \"gold sword\";\nenemyName = \"goblin\";\nroom(true, true, room1);\n\nenemyName\
  \ = \"wombat\";\nroom(true, false, room2);\n\nenemyName = \"hobgoblin lord.\";\n\
  treasureName = \"treasure horde.\";\nroom(true, true, room3);\n\nreturn 0;\n}\n\n\
  bool intro(void)\n{\n    using std::cout;\n    using std::cin;\n    cout << \"Brave\
  \ knight!!! What is your name? \\n\";\n    cin >> name;\n    cout << \"We are in\
  \ need of your help, \" << name\n    << \". Our village is being overrun \\n\"\n\
  \    << \"by the goblins of the Northern Caves.\"\n    << \" We need you to defeat\
  \ them!\\n\";\n    << \"Will you accept the challenge?\\n\\n\";\n    cout << \"\
  1) Yes. \\n\"\n    << \"2) No. \\n\\n\";\n\n    int response;\n    cin >> response;\n\
  \    return !(response == 1);\n}\n\n//Displays the description for the room and\
  \ gives the options\nvoid room(bool enemy, bool treasure, string description)\n\
  {\n    using std::cout;\n    using std::cin;\n    while(true)\n    {\n        cout\
  \ << description.c_str() << \"\\n\\n\";\n        int response = 0;\n        do\n\
  \        {\n            cout << \"What would you like to do?\\n\";\n           \
  \ if(enemy)\n                cout << \"1) Attack the evil \" << enemyName.c_str()\
  \ << \"\\n\";\n            else if(!enemy)\n                cout << \" 1) Move to\
  \ the next room.\";\n\n            if(treasure)\n                cout << \" 2) Pick\
  \ up the \" << treasureName.c_str() << \"\\n\";\n            cin >> response;\n\
  \        } while(response < 1 || response > 2);\n\n        switch(response)\n  \
  \      {\n            case 1:\n                if(enemy)\n                {\n  \
  \                  enemy = !enemy;\n                    cout << \"You slay the deadly\
  \ \" << enemyName.c_str() << \"\\n\";\n                }\n                else if(!enemy)\n\
  \                    return;\n            break;\n            case 2:\n        \
  \        treasure = !treasure;\n                cout << \"You pick up the \" <<\
  \ treasureName.c_str() << \"\\n\";\n                break;\n        }\n    }\n}\n\
  ```\n\n花点时间。学习这段代码。弄清楚它是如何工作的。尝试编译它。然后尝试对其进行一些修改。让它属于你。看看它与本章介绍的概念有什么联系。\n\n## 总结\n\
  \n你在这一章中学习了一些重要的概念，随着每一个词的掌握，你向专业程序员迈进了一步。你学习了如何创建和使用函数以及变量作用域，并确切地发现了为什么 `main`\
  \ 是一个函数。\n\n你现在已经拥有了创建自己的程序所需的基础工具集。尝试自己独立编程并发现你可以做什么。将此书作为参考，但尽量尽可能自己记住这些内容。\n\n\
  如果你感到压力很大，只需再次快速浏览这一章。在继续之前，你希望对本章的内容了如于胸。\n\n## 挑战\n\n1. 编写一个名为 `multiply` 的函数，将两个数字相乘并返回结果。\n\
  2. 修改你在挑战 1 中编写的函数，使其记住你调用了多少次。\n3. 全局变量和静态变量之间有什么区别？在什么情况下哪种更好？为什么？\n4. 尝试重写“洞穴冒险游戏”，使其不使用函数（这一个练习将说服你函数是有多用）。\n\
  5. 如果你真的完成了最后一个问题，就去给自己买杯冰沙（Slurpee）。\n\n# 第 5 章 • 设计软件：面向对象编程\n\nC++ 允许你重用代码，这样你就不需要反复编写相同的代码。虽然大多数编程语言都允许重用代码，但在其他语言中，你通常需要对重用的代码进行大量的修改才能运行。C++\
  \ 对面向对象编程（OOP）的支持使得重用一个对象（例如游戏英雄）几乎像将该对象放入下一个程序中一样简单。你甚至可以用极少的额外代码，将英雄多次克隆成一支使用火焰的超级英雄军队。\n\
  \n在这一章中，你将学习如何实现：\n\n* 声明类\n* 创建对象\n* 为你的对象创建一个测试底座\n* 为类添加公共和私有方法及成员\n* 利用 OOP\
  \ 的基本原理\n* 构建一个多人策略游戏\n\n### 面向对象编程简介\n\n将编程对象想象成现实世界中的任何普通对象。每个现实世界中的对象都有自己的属性以及你可以对其执行的特定操作。例如，弓具有特定的属性——如颜色、箭的数量和重量——以及特定的能力——如发射能力。如果你从军械库请求一把弓，你还不知道那把弓的具体属性会是什么。然而，一旦你看到了弓，就可以确定它的颜色、重量和箭袋的大小。正如你将在后续章节中学到的，这与编程世界中对象的工作方式非常相似。\n\
  \n在继续学习 OOP 之前，你需要理解一些术语。\n\n类（Class）就像一个通用模型，你可以从它创建对象。例如，如果你创建一个狗类，你描述的是与“狗”这一通用概念相关的特征。\n\
  \n创建一个类等于创建一个新的数据类型。当你创建一个类时，你告诉计算机这种新类型可以持有的数据种类和数量。你还告诉计算机新类型可以执行的操作。然后你就可以使用创建的类来创建这种新类型的变量（正如你所看到的，这些变量被称为对象）。尽管现在看起来可能很复杂，但创建你自己的类是一个简单的过程，你将在后续章节中学习。\n\
  \n你在类内部声明所有的数据成员和方法。图 5.1 显示了一个 `Bow` 类可能性的示例。`Bow` 类描述了弓的通用属性和能力。`Bow` 类从编程的角度告诉计算机什么是弓，这样计算机在下次遇到它时就就了该做什么。\n\
  \n对象（Object）是类的特定实例。也就是说，类声明了对象的属性是什么，而对象为这些每个属性存储特定的值。例如，`Bow` 类描述了弓具有某种颜色，但它并没有识别具体的颜色。这样，每个\
  \ `Bow` 对象都可以有不同的颜色。图 5.2 显示了两个 `Bow` 对象。它们都是使用 `Bow` 类声明的，但 `Bow` 类描述的是弓的属性，而这两个\
  \ `Bow` 对象在这些属性上具有不同的值。\n\n\n\n\n另一个类比是 `Knight`（骑士）类。你知道骑士会拯救公主、斩杀巨龙、充满魅力并寻找魔法物品。以这种方式描述属性与设计类非常相似。如果你创建一个特定的骑士，例如\
  \ `Sir Lancelot`（兰斯洛特骑士），你就创建了一个对象。，`Sir Lancelot` 可以在亚瑟王的陪伴下按照其类定义的那样拯救公主、斩杀巨龙并寻找魔法物品；然而，他的实际属性，例如他剑的名字、拯救了多少公主以及他到底有多迷，是由\
  \ `SirLancelot` 对象存储的。\n\n方法（也称为成员函数或对象方法）是包含在类中的函数，定义了如何使用该类的对象。在 `Bow`（弓）类的示例中，你可能希望拥有如\
  \ `draw()` 和 `fire()` 这样的方法。方法就像我们之前使用的函数，不同之处方法是对象的一部分。方法让你了解对象能够做什么，并且它们主要关注于操作对象的数据（数据成员）。\n\
  \n类的数据成员是定义该类对象可以存储什么类型数据的变量。例如，从 `Bow` 类创建的对象可以存储颜色、重量和箭囊的大小。\n\n类的成员是包含在该类中的所有方法和数据成员。\n\
  \n例如，`Bow` 对象的成员是数据成员——颜色、重量和 `quiver_size`——以及方法——`fire()` 和 `draw()`。\n\n当你想要让对象执行某些操作时，你向它发送一条消息。这就是执行对象方法的方法。例如，如果你想让\
  \ `bow1` 射击，向它发送一个 `fire` 消息将执行 `fire()` 方法。你可以这样做是因为 `Bow` 类有一个 `fire()` 方法。\n\n\
  换句话说，`bow1` 知道如何射，因为 `Bow` 类中的所有对象都知道如何射。作为程序员，你的工作是在你想让弓射击时向 `bow1` 发送一条射击消息。\n\
  \n你将在在本章稍后的“使用对象”部分中看到如何发送消息。\n\n### 发现类\n\n你可以创建许多不同形式的类，现在是时候直接进入面向对象编程（OOP）的核心了。这起初可能有点吓，但想想你已经学了多少。一旦你开始理解这些概念，你就会发现\
  \ OOP 并没有看起来那么困难。它真的没有人们描述的那么复杂。在这一节中，我们将通过教你如何声明类、如何创建方法、如何控制对象的访问以及如何将类组织到不同的文件中，让学习类变得简单。\n\
  \n### 声明类\n\n以下代码是声明类的通用语法。我们将按照代码逐步进行，但在继续之前请仔细查看：\n\n```cpp\nclass ClassName\n\
  {\nmemberList\n};\n```\n\n在这里，`memberList` 是类成员列表，`ClassName` 是类名。注意 `ClassName`\
  \ 以大字母开头。这是最常见的惯例，我们推荐这样做，因为你的代码将具有非常的可读性。还要注意类声明以分号结束。忘记分号会导致奇怪的错误，请务必包含它。\n\n\
  `memberList` 由一系列成员声明组成。这些可以是数据成员声明或方法声明。数据成员声明是普通的变量声明。例如，在类内部 `int x;` 是一个数据成员声明。然而，你不能在声明数据成员的地方初始化它们。它们必须在方法内部或类外部进行初始化。例如，作为数据成员声明\
  \ `int x = 5;` 会导致错误。所有数据成员的作用域与从类创建的对象的作用域相同。然而，数据成员并不总是能从类外部访问。在 `Bow` 类中，这些数据成员可以存储剩余多少箭、弓的颜色以及弓是否被拉开。\n\
  \n类的数据成员定义并描述了类的属性（也称为特征）。因此，每个弓对象的颜色都是该对象的属性。\n\n方法声明和数据成员声明一样容易理解。方法声明是放置在类内部的函数声明（记住，函数声明也可以包含实现，或者你可以单独地实现它）。所有方法都只能通过类的对象进行访问（静态方法除外，我们将在本章后后的“使用静态成员”中讨论它们）。\n\
  \n类中可以有两种特殊的方法：构造函数（constructor）和析构函数（destructor）。这两者都是可选的，但它们提供了其他方法无法提供的特殊功能。\n\
  \n构造函数在每次创建类的新实例时执行——也就是说，每当你声明一个新对象时都会执行。构造函数通常用于为数据成员设置初始值。例如，在 `Bow` 类中，构造函数可能会将\
  \ `drawn` 布尔变量设置为 `false`并将箭的数量设置为 20。构造函数的名称始终与类相同，且不能有返回值（即使是 `void`也不行）。\n\n\
  **提示**：为了理解类和构造函数，你可以将你声明的类与 C++ 已经理解的内置数据类型（如 `float` 和 `int`）进行比较。所有数据都有类似构造函数的东西，即使是\
  \ C++ 的内置数据类型也是如此。例如，当你定义一个整数变量时，使用 `int` 关键字。C++ 知道整数的属性。因此，C++ 设置了一个可以接受整数值的变量。然而，当你定义一个\
  \ Bow 对象时，C++ 并不知道它应该什么样。所以你的 Bow 类告诉 C++ Bow 对象将具备哪些属性，而构造函数则创建一个带有初始值的初始 Bow 对象。\n\
  \n析构函数是构造函数的相反，并在对象销毁时执行。析构函数的命名始终与类相同，但开头有一个波浪号 `~`（`ClassName()`）。析构函数不能有参数或返回值。在\
  \ `Bow` 类示例中，析构函数将是 `~Bow()`。析构函数通常用于执行任何必要的清理任务。\n\n```cpp\nclass Bow\n{\n//data\
  \ member declarations\nstring color;\nbool drawn;\nint numOfArrows;\nBow(string\
  \ aColor); //constructor\n~Bow(); //destructor\n\n//methods\nvoid draw();\nint fire();\n\
  };\n```\n\n`Bow` 类现在有三个数据成员，描述 Bow 对象将具备的属性。此外，`Bow` 类包含了四个方法——`Bow()`、`~Bow()`、`draw()`\
  \ 和 `fire()`——但你还没有为这些方法添加代码。前面的代码片段可以编译（因为编译器假设方法的实现在其他某处），但如果你尝试使用它，程序将会崩溃，因为没有已声明方法的实现。\n\
  \n### 创建方法\n\n总的来说，你已经学习了类的声明。现在，是时候更详细地查看方法了。这一节提供了一些特殊的规则和语法，以及关于在为类设计方法时需要注意的提示。\n\
  \n首先，你可以通过两种方式声明方法。最常见的方法是在类声明内部声明方法，然后在外部实现它。第二种方法是在类声明内部同时声明并实现该方法。\n\n\n\n\n\
  你应该使用第一种方式来声明大多数方法。然而，方法的实现有特殊的语法。以下是发生在类外部的方法实现的一般语法：\n\n```cpp\nreturn_type ClassName::methodName(argumentList)\n\
  {\n    methodImplementation\n}\n```\n\n在这里，`ClassName` 是类的名称，`methodImplementation`\
  \ 是位于方法内部的代码。如你所示，这种语法与函数的定义语法非常相似。注意，这是作用域运算符（`::`）的用法。在这里，你通过将类名放在前面来告诉计算机使用该类的作用域。\n\
  \n现在，你准备好实现 `Bow` 类的 `draw()` 和 `fire()` 方法了。以下是实现代码：\n\n```cpp\n//draws the bow\n\
  void Bow::draw()\n{\n    using std::cout;\n    drawn = true;\n    cout << “The “\
  \ << color << ” bow has been drawn.\\n\";\n}\n\n//fires the bow if drawn\nint Bow::fire()\n\
  {\n    using std::cout;\n    using std::rand;\n    if(!drawn)\n    {\n        cout\
  \ << color << “ has not been drawn “\n        << “and therefore could not fire.\\\
  n\";\n        return 0;\n    }\n    int score;\n    score = rand() % (10 - 0 + 1)\
  \ + 0;\n    if(score == 0)\n        cout << color << “ missed the target!!!\\n\"\
  ;\n    else\n        cout << color << “ scored “ << score << “ points!!!\\n\";\n\
  \    return score;\n}\n```\n\n记住，这些实现必须在类声明之外。此外，它们必须放在类声明之后。\n\n声明方法的第二种方式是同时声明并实现方法。这种语法对你来说并不陌生。这是一个示例：\n\
  \n```cpp\nclass Hello\n{\n    void Display() { \n        using std::cout; \n   \
  \     cout << “Hello World.\\n”; \n    }\n};\n```\n\n用这种方式声明方法非常简单。之处在于，用这样声明的方法被定义为**内联方法**（inline\
  \ method）。因为没有关键字提醒你是内联的，所以请留意这种这样声明的方法。\n\n如果你在类外部实现一个方法，仍然可以通过在实现前面加上 `inline`\
  \ 关键字来使其成为内联方法。内联方法或函数意味着当程序编译时，编译器会将所有对该方法或函数的调用替换为方法或函数内部的代码。它们被用于提高速度，但也会增加程序文件的大小。\n\
  \n## 设计构造函数和析构函数\n\n构造函数和析构函数对于初学者来说通常难以理解的概念，但在本节中，我们将帮助你消除困惑。\n\n构造函数在对象创建时自动调用，析构函数在函数销毁时自动调用。构造函数初始化成员并执行所有其他必要的初始化任务。析构函数执行所有必要的清理任务。\n\
  \n构造函数和析构函数都像方法；它们可以同时声明和实现，也可以分开声明和实现。以下是同时声明和实现的语法：\n\n```cpp\nclass ClassName\n\
  {\n    //constructor\n    ClassName(argumentList)\n    {\n        implementation\n\
  \    }\n    //destructor\n    ~ClassName()\n    {\n        implementation\n    }\n\
  \    //other members\n};\n```\n\n以下是先声明后实现的语法：\n\n```cpp\nclass ClassName\n{\n \
  \   ClassName(argumentList);\n    ~ClassName();\n    //other Members\n};\n\nClassName::ClassName(argumentList)\n\
  {\n    implementation\n}\nClassName::~ClassName(argumentList)\n{\n    implementation\n\
  }\n```\n\n注意，构造函数可以有参数。如果你创建一个带有参数的构造函数，该类的用户在创建对象时必须为这些参数提供值。对于许多类型的对象，带有构造参数是有意义的。例如，如果你有一个\
  \ `Date` 类，参数可以指定 `Date` 对象存储哪一个日期。\n\n相反，析构函数不能有参数。它是自动调用的，所以用户没有机会提供参数。\n\n由于构造函数可以有参数，因此可能需要**重载**构造函数。这在\
  \ C++ 中是合法的，在大型类中非常常见。例如，在 `Date` 类中，你可能希望允许用户使用日期的字符串表示或整数版本来初始化 `Date` 对象。通过这种方式重载构造函数可以赋予你的类灵活性，并为类的用户提供许多选择。\n\
  \n析构函数不能被重载。由于没有返回值或参数，没有什么可以用来对析构函数进行重载。\n\n在构造函数中初始化成员的一种方便且快速的方法是使用**初始化列表**（initializer\
  \ list）。初始化列表是你想要初始化的成员列表，并在括号中显示你想要初始化它们的值。其一般语法为：`ClassName(argumentList) : dataMember1(value1),\
  \ dataMember2(value2)`\n\n```cpp\n{\n    implementation\n}\n```\n\n你可以在初始化列表中拥有任意数量的初始化，尽管大量的初始化可能会难以阅读。语法\
  \ `dataMember1(value1)` 等同于 `dataMember1 = value1`（即作用相同），但这种语法只在初始化列表中有效。\n\n以下是\
  \ `Bow` 类的构造函数和析构函数：\n\n```cpp\nBow::Bow(string aColor)\n{\n    using std::srand;\n\
  \    using std::time;\n    numOfArrows = 10;\n    drawn = false;\n    color = aColor;\n\
  \    //seeds the time\n    //(we need rand() function in the fire() method)\n  \
  \  srand(time(0));\n}\n\nBow::~Bow()\n{\n}\n```\n\n## 安全使用常量方法\n\n通常，你会创建改变成员变量值的方法。你可以让这些方法变为**常量方法**。在常量方法中更改成员变量的值是非法的（也就是说，是不可能的）。尝试这样做会导致语法错误。\n\
  \n要声明常量方法，你需要在参数列表之后放置 `const` 关键字。其语法为：`return_type methodName(argumentList) const;`\n\
  \n注意，如果你在类外部实现常量方法，则 `const` 关键字必须在声明和实现中都放置。\n\n常量方法的优势是，如果创建了常量对象（使用 `const` 关键字创建的对象），则只能访问常量方法。这种限制的访问权限确保了常量对象确实是常量的。\n\
  \n## 使用修饰符\n\nC++ 允许你控制类成员可以在何处访问。这种控制是一项强大的工具，因为它允许你保护成员免受意外更改（你将在本章稍后的“学习 OOP\
  \ 原则”部分中学习更多关于保护数据的知识）。**访问修饰符**（access specifier）是一个控制类成员访问位置的单词。访问修饰符的语法如下：\n\n\
  ```cpp\nclass ClassName\n{\n    classMembers\n    accessSpecifier:\n    classMembers\n\
  };\n```\n\n修饰符会影响其之后的所有成员（包括方法），直到遇到另一个修饰符或到达类的结尾。\n\n类有两种访问修饰符：`public` 和 `private`（实际上有三个；你将在第\
  \ 8 章“介绍继承”中学习第三个 `protected`）。这两种修饰符的作用概述如下：\n\n- `public` 成员：可以在访问该类对象的任何地方访问，也可以在类内部（即在类的方法中）访问。\n\
  - `private` 成员：只能从类内部访问。类对象无法访问私有成员，除非通过公共方法访问。如果类中没有提供访问修饰符，所有成员默认默为 `private`。\n\
  \n以下是你可能使用这些修饰符的示例：\n\n\n\n\n\n```cpp\nclass MyClass\n{\n    int x;\npublic:\n \
  \   int y;\n    int z;\nprivate:\n    int a;\n};\n```\n\n在这个示例中，`x` 和 `a` 是私有成员，而\
  \ `y` 和 `z` 是公有的。你可以在类中使用任意数量的访问修饰符，但通常情况下，将它们组织在同一个地方是比较好习惯。\n\n以下是 `Bow` 类带有访问修饰符的样子：\n\
  \n```cpp\nclass Bow\n{\n    //数据成员声明\n    string color;\n    bool drawn;\n    int\
  \ numOfArrows;\npublic:\n    Bow(string aColor); //构造函数\n    ~Bow(); //析构函数\n//方法\n\
  \    void draw();\n    int fire();\n};\n```\n\n## 将类分离到不同的文件中\n\n类通常会变得非常大，将所有代码放在一个文件中会很快变得难以管理。此外，如果你想在其他程序中重用类，必须将它们复制并粘贴到新程序中。这个过程可能会非常麻烦。\n\
  \n幸运的是，有一种将类分离到文件的惯例。通常，类声明放在一个文件中，而所有方法的实现放在另一个文件中。\n\n类声明文件通常命名为 `ClassName.h`，其中\
  \ `ClassName` 是类的名称。你可能熟悉使用 `.cpp` 作为 C++ 文件，但 `.h` 也是一种有效的 C++ 文件（不过，它只用于特殊情况，例如类声明，而不是用于程序本身）。实现文件通常命名为\
  \ `ClassName.cpp`。\n\n如果你使用这种惯例，C++ 允许你做一些非常酷的事情。因为你将类放在了与使用类的地方不同的文件中，所以你必须使用 `#include`\
  \ 指令在程序中包含它。`#include` 指令的语法如下：\n\n```cpp\n#include \"filename\"\n```\n\n然而，你不需要包含两个文件（`ClassName.h`\
  \ 和 `ClassName.cpp`），只需要包含 `ClassName.h`。只要 `.cpp` 文件也在你的项目中，Visual Studio 就会自动包含它。这不方便吗？\n\
  \n以下是 `Bow` 类分离到不同文件的样子：\n\n```cpp\n//Bow.h\n#include <string>\n#include <iostream>\n\
  using std::string;\n\nclass Bow\n{\n    //数据成员声明\n    string color;\n    bool drawn;\n\
  \    int numOfArrows;\npublic:\n    Bow(string aColor); //构造函数\n    ~Bow(); //析构函数\n\
  //方法\n    void draw();\n    int fire();\n};\n\n//Bow.cpp\nBow::Bow(string aColor)\n\
  {\n    using std::srand;\n    using std::time;\n    numOfArrows = 10;\n    drawn\
  \ = false;\n    color = aColor;\n    //为时间种子\n    //（在 fire() 方法中我们需要 rand() 函数）\n\
  \    srand((unsigned int)time(0));\n}\n\nBow::~Bow()\n{\n}\n\n//拉开弓\nvoid Bow::draw()\n\
  {\n    using std::cout;\n    drawn = true;\n    cout << \"The \" << color << \"\
  \ bow has been drawn.\\n\";\n}\n\n// 如果已拉开弓则发射\nint Bow::fire()\n{\n    using std::cout;\n\
  \    if(!drawn)\n    {\n        cout << color << \" has not been drawn \" and therefore\
  \ could not fire.\\n\";\n        return 0;\n    }\n    int score;\n    score = rand()\
  \ % (10 - 0 + 1) + 0;\n    if(score == 0)\n        cout << color << \" missed the\
  \ target!!!\\n\";\n    else\n        cout << color << \" scored \" << score << \"\
  \ points!!!\\n\";\n    return score;\n}\n```\n\n### 类策略 101\n\n本节提供了一些让 OOP（面向对象编程）变得稍微更容易的指南。你可以使用这些策略让你的代码易于调试和理解。\n\
  \n-   每个类名都以大写字母开头。这种惯例不仅用于 C++，也适用于几乎所有其他面向对象的编程语言。\n-   在每个方法和类的开头添加注释，告诉用户接下来的成员或类是的作用。\n\
  -   确保每个方法只做一件事。通用规则是，如果一个方法超过了 20 行，说明你试图在该方法中做太多事情。\n-   让每个类只建模一个概念。例如，将 `Weapon`\
  \ 类与 `Soldier` 类分开。\n-   在将类添加到项目之前，测试每个类以确保它工作正常。一旦你知道一个类可以正常工作，调试项目仅仅是确保类与类之间的交互正常工作的问题。你不需要担心类本身是否工作，因为你已经确保了它们可以工作。\n\
  \n遵循这些规则，你的效率将会高得多——而且在调试时节省时间。\n\n### 使用对象\n\n在讨论了所有关于如何创建类之后，你一定急于学习类。不久后你将从自己的类中创建自己的对象，但现在你只需要学习如何创建对象。在这一节中，你将学习对象变量、默认构造函数、如何访问类的成员、如何为你的类创建测试底座以及如何使用静态成员。\n\
  \n### 使用对象变量\n\n早些时候我们写道创建一个类非常像创建一个数据类型。当你开始学习对象时，这种关系会变得显而易见。你可以像使用原始数据类型名称（C++\
  \ 内置的数据类型）完全一样使用类的名称。对象变量是存储特定类对象的变量。\n\n按照以下三个步骤创建对象：\n\n1.  编写将成为对象模板的类。你在创建 `Bow`\
  \ 类时就已经完成了这一步。\n2.  为对象变量创建一个标识符，并确定它将存储什么种对象（从哪个类中创建）。这个过程类似于声明变量的方式。\n3.  添加构造函数所需的参数（如果需要）。\n\
  \n你可以使用两种基本语法形式创建对象：\n\n方法 1：\n`className objectIdentifier(arguments);`\n\n方法 2：\n\
  `className objectIdentifier = className(arguments);`\n\n好了，你已经等久了。现在是开始创建对象了。以下是创建两个不同\
  \ `Bow` 对象的示例：\n\n```cpp\nBow blue(\"Blue\");\nBow red = Bow(\"Red\");\n```\n\n\
  你刚刚创建了两把弓，一个命名为 `red`，另一个命名为 `blue`。每一个对象变量都存储了一个具有多个属性的对象（例如颜色和每个 20 支箭），并且它们都知道如何做两件事：拉弓和发射（使用\
  \ `draw()` 和 `fire()` 方法）。你可以使用赋值运算符 (`=`) 更改对象变量中存储的对象，就像普通变量一样。这是一个示例：\n\n```cpp\n\
  Bow b1(\"blue\");\nBow b2(\"red\");\nb1 = b2;\n```\n\n`b1` 和 `b2` 将分别存储一个红弓的独立副本。\n\
  \n### 使用默认构造函数走捷径\n\n如果在创建对象变量时没有提供任何参数，计算机将执行默认构造函数。默认构造函数可以是两种情况之一。如果类没有构造函数，则默认构造函数是一个没有参数的空白构造函数；如果你提供了一个没有参数的构造函数，那么默认构造的就是这个构造函数。\n\
  \n在你创建构造函数之前，所有类都存在一个空默认构造函数。如果每个构造函数都需要参数，则类没有默认构造函数。除非你创建自己的默认构造函数，否则默认构造函数的作用只是创建一个符合该对象类声明的新对象变量。这是一个默认构造函数的示例：\n\
  \n```cpp\nCpoint3d::Cpoint3d()\n{\n}\n```\n\n### 访问成员\n\n当成员是公有的时，你可以在访问对象的任何地方访问它。\n\
  \n你可以通过在对象标识符和成员之间使用成员访问运算符 (`.`) 来访问公有成员。要给公有数据成员赋值，使用此语法：`objectIdentifier.dataMemberName\
  \ = value;`\n\n\n\n\n要获取对象的公共数据成员的值，你可以这样切换操作数：`variable = objectidentifier.variableName;`\n\
  \n如你所见，对象与普通变量非常相似。以下是该语法的示例：\n\n```cpp\nclass S\n{\npublic:\n    int x;\n};\n\n\
  int main(void)\n{\n    S s;\n    s.x = 99;\n}\n```\n\n由于 `s` 对象的数据成员 `x` 是公共的，程序中的所有代码都可以使用或更改\
  \ `x` 成员（只要代码可以访问 `s` 对象）。只要 `s` 对象存在，程序中所有访问 `s` 的代码都可以直接更改 `s` 的数据成员 `x`。\n\n\
  公共方法的访问方式类似。调用公共方法的语法为：`object.method(arguments)`\n\n以下是调用公共方法的示例：\n\n```cpp\nclass\
  \ S {\n    int x;\n    public:\n    int getValue() { return x; }\n    void setValue\
  \ (int temp) { x = temp; }\n    S(int temp) : x(temp) {}\n    ~S() {}\n};\n\nint\
  \ main (void)\n{\n    S s(5);\n    cout << s.getValue();\n}\n```\n\n输出：\n`5`\n\n\
  你不能在类外部访问私有成员。但是，通过公共方法，你通常可以获得对私有数据成员的有限访问。由于这种限制，类的设计者可以确保数据成员不被误用。\n\n### 创建测试\n\
  \n当你创建一个类时，必须对它进行测试。面向对象编程（OOP）的优点之一就是很容易对类进行测试和调试。其思想是独立于其他类来测试每个类。如果该类符合预期，那么在理论上，它与程序的其余部分结合时不应该产生错误。要测试一个类，你需要创建一个所谓的“测试底架（test\
  \ chassis）”。测试底架是一个测试该类所有功能的程序。测试包含了所有方法、构造函数和析构函数。以下代码显示了 `Bow` 类的测试底架示例。该文件名为\
  \ `bowTest.cpp`。\n\n```cpp\n//5.1 - The Bow Class Test Chassis\n#include <iostream>\n\
  #include \"Bow.h\"\n\nvoid bowTest(void);\n\n//the main function\nint main(void)\n\
  {\n    bowTest();\n    return 0;\n}\n\n//tests the bow class\nvoid bowTest(void)\n\
  {\n    using std::cout;\n    cout << \"Yellow created.\\n\";\n    Bow(\"yellow\"\
  );\n    cout << \"Attempting to fire bow\\n\";\n    yellow.fire();\n    cout <<\
  \ \"Drawing the bow.\\n\";\n    yellow.draw();\n    cout << \"Attempting to fire\
  \ bow.\\n\";\n    yellow.fire();\n}\n```\n\n注意，有很多 `cout` 语句，这样你可以确保类运行符合预期。如果程序由于某种原因崩溃，你将根据最近的\
  \ `cout` 确切知道是在哪一行崩溃的。为你创建每个类创建一个测试底架，遵循类似的流程。这样做可以防止许多错误。\n\n## 射箭比赛\n\n国王请求举办一次射箭比赛来纪念女儿的十六岁生日。射箭比赛的胜者将获得公主的手。为了创建“射箭比赛”游戏，你需要创建一个比赛类。每个比赛将有三个参赛者和任意数量的轮次。回合将执行并宣布获胜者。学习以下代码并确保你理解了发生了什么。\n\
  \n```cpp\n//5.2 - The Archery Competition\n#include <iostream>\n#include <cstring>\n\
  #include \"bow.h\"\n\nclass ArcheryCompetition\n{\nprivate:\n    //member variables\n\
  \    int rounds;\n    float redScore;\n    Bow red;\n    float blueScore;\n    Bow\
  \ blue;\npublic:\n    //constructor\n    ArcheryCompetition(int lrounds);\n    //destructor\n\
  \    ~ArcheryCompetition();\n    //methods\n    int compete(void);\n};\n\n//constructs\
  \ an ArcheryCompetition object\nArcheryCompetition::ArcheryCompetition(int lrounds)\
  \ :\n    rounds(lrounds), red(\"red\"),\n    blue(\"blue\"), redScore(0), blueScore(0)\n\
  { }\n\n//the destructor\nArcheryCompetition::~ArcheryCompetition()\n{\n}\n\n//the\
  \ heart of the game.\n//引导玩家完成整个比赛\n//并找出谁赢了\nint ArcheryCompetition::compete()\n\
  {\n    using std::cout;\n    //遍历每一轮次，记录分数\n    for(int i = 0; i < rounds; i++)\n\
  \    {\n        cout << \"now on round \" << i+1 << \".\\n\";\n        red.draw();\n\
  \        blue.draw();\n        redScore = (red.fire() + redScore * i)/(i+1);\n \
  \       blueScore = (blue.fire() + blueScore * i)/(i+1);\n    }\n    //找出谁赢了\n \
  \   if(redScore == blueScore)\n        cout << \"We have a tie!!!\\n\";\n    else\
  \ if(redScore < blueScore)\n        cout << \"Blue wins her hand!!\\n\";\n    else\n\
  \        cout << \"red wins her hand!!\\n\";\n    return 1;\n}\n\nint main(void)\n\
  {\n    //驱动函数：构造对象并\n//调用恰当的方法\n    ArcheryCompetition plymouthSquare(2);\n    plymouthSquare.compete();\n\
  \    return 0;\n}\n```\n\n## 使用静态成员\n\n到目前，每个类的每个不同对象都有自己的成员变量副本。但如果你希望特定类的所有对象具有相同的值，会发生什么？你可以使用一个全局变量，但这样做违背了数据抽象的目标。为了声明一个跨类所有对象存在的单个变量，并使该变量具有前面讨论的\
  \ OOP 安全属性，请使用静态成员。静态成员是一个对于该类的所有实例都相同的变量。静态声明成员的语法如下：\n\n```cpp\nclass ClassName\n\
  {\n    static variableType variableIdentifier; //declaration\n    //other code…..\n\
  };\n\n//global initialization\nvariableType ClassName::variableIdentifier = initial_value;\n\
  ```\n\n请参图 5.3，关于静态变量工作工作的原理图。\n\n**图 5.3**\n静态变量在类的每个对象中都是相同的。\n\n记住，要使用静态成员，你需要在类中声明变量，并在类外初始化该变量。也就是说，它必须在类外初始化。\n\
  \n假设你有一个 `Horse` 类，所有的马都合作拉着一辆马车。所有马的速度必须相同，但速度可能会根据坡度增加或减少。`Horse` 类的代码看起来像这样：\n\
  \n```cpp\n//5.3 - The Static Variable Demonstration\n#include <iostream>\n\nclass\
  \ Horse\n{\npublic:\n    static int speed;\n    //the remainder of the class\n};\n\
  \nint Horse::speed = 3; //notice the global initialization\n\nint main(void)\n{\n\
  \    using std::cout;\n    Horse horse1;\n    Horse horse2;\n    Horse::speed =\
  \ 5;\n    cout << horse2.speed << \"\\n\" << horse1.speed << \"\\n\";\n    Horse::speed\
  \ = 6;\n    cout << horse2.speed << \"\\n\" << horse1.speed << \"\\n\"; \n    return\
  \ 0;\n}\n```\n\n输出：\n5\n5\n6\n6\n\n### 学习 OOP 原理\n\nOOP 的以下三个方面使得你的程序易于维护，并且便于复用对象：\n\
  \n• 数据抽象\n• 封装\n• 多态\n\n你已经见过前两个 OOP 术语的用法，因为当你创建包含私有数据的类时，数据抽象和封装就会发生。接下来的章节将进一步解释这些听起来很高深但相对简单的概念到底是什么。\n\
  \n\n\n当你在赛威威（Subway）购买某种特定的饼干时，你可以将其识别为白巧克力夏威果饼干。你可能无法分辨制作饼干时使用了哪个品牌的面粉，或者用了多少小苏打——而且你可能并不在乎。饼干味道很好，这就是它被设计的初衷。\n\
  \n同样，确切知道一个类是如何工作的通常并不重要，只要它能实现其设计的功能即可。这就是数据抽象（也称为数据隐藏）的原理。数据抽象是将类的数据成员和实现隐藏在接口之后的过程，以便该类的用户不会破坏数据。其核心思想是数据被隐藏在类的实现内部。你通过成员函数接口访问数据成员，从而通过实现来访问数据。也就是说，数据不是被直接操作的，而是通过公共函数进行操作。\n\
  \n通用规则是对所有变量和成员使用尽可能小的作用域。此外，尽可能少地使用全局变量。这样做，只有应该访问数据的代码才能更改该数据。如果其他代码需要使用或更改私有对象内部的数据，则该对象的成员函数可以提供允许此类访问的例程。作为类的设计者，由你来决定该类的用户究竟需要多少数据访问权限。\n\
  \n## 理解封装\n\n想象一下 19 世纪的制造过程。个人必须完成创建产品所需的所有工作。当时不存在分工。例如，一个毛衣制造者必须完成所有工作，从生产羊毛（好吧……羊负责那部分，但你懂我的意思）到对成品进行营销，这意味着制作任何东西都要花很长时间。随着专业化的出现，人们精通了某件事，并将其他工作交给其他人。\n\
  \n这与封装类似。你创建的每个类都应该代表一个特定的事物或概念。然后，多个类组合在一起代表事物或概念的组合。还记得你创建射箭比赛吗？该比赛使用了多个来自 `Bow`\
  \ 类的弓以及一个表示比赛本身的类。\n\n这里是封装的另一个例子。假设你想制造一辆汽车。在制造成品之前，你必须制造较小的子组件。每个小组件只负责一件小事，但它们组合在一起产生了一辆汽车。图\
  \ 5.4 显示了汽车的不同部分。每个部分都有独特的用途。\n\n**图 5.4**\n你可以将一个对象分为更小的对象，每个对象都有独特的用途。\n\n## 理解多态\n\
  \n多态是一个听起来很晦涩的词，它仅仅意味着“许多形式”。多态是指面向对象编程（OOP）的一种原理，其中每个对象都可以在多个程序中使用。多态的主要原理是，你的代码会分析你使用它的条件并适应这些条件。`Bow`\
  \ 类始终会执行它应该做的事，无论你是在 64 位的 alpha 计算机还是在 Cray 超级计算机上使用它。在第 8 章中，我们将更详细地介绍多态。在本章中，我们将继续奠定更多\
  \ C++ 的基础。\n\n如果你运用了这三个 OOP 概念（数据抽象、封装和多态），你的编程生活将会大大改善——你的社交生活也会随之改善，因为节省了调试时间。\n\
  \n## 调试\n\n你的代码并不总是完美的。事情总会出错。有时候，很难知道代码哪里出了问题。另一些时候，你会立即发现问题。在这一节中，我们将讨论在编程过程中可能遇到的各种错误以及如何防止它们。\n\
  \n错误有四种，每种错误都有不同的原因，并且都有不同的修复方法。\n\n以下是四种错误及其含义：\n\n- **无关紧要错误（Insignificant errors）**：不影响程序运行的错误。这些错误通常不会引起问题。如果你没有遵循约定或忘记为某部分代码添加注释，可能会发生无关紧要的错误。这些错误通常在引起明显问题之前不会被检测到。\n\
  - **编译时错误（Compile-time errors）**：编程语言语法中的错误。例如，如果你在尝试声明整数时没有包含 `int` 中的字母 `t`，你就违反了编程语言的语法，并在尝试编译时会收到那个糟糕的错误界面。\n\
  - **运行时错误（Run-time errors）**：在运行程序时才出现的错误，导致你的程序崩溃。这些错误很难调试——例如，声明了构造函数但忘记编写它的实现代码。它们通常很难发现，并会带一个不悦的小型\
  \ Windows 消息导致你的程序崩溃。编译器不会检测到这些错误；然而，编译器可能会提供警告（不会停止编译过程的错误）。我们建议你听从编译器给出的警告，并尝试消除代码中的错误。\n\
  - **逻辑错误（Logic errors）**：导致你的程序没有按照预期执行的错误。编译器不会检测到这些错误。程序可以运行且不会崩溃，但执行了错误的事。例如，想象一下你编写的兽人（Orcs）都在互相攻击。通常情况下，这些错误很容易消除，尽管有时并非如此。\n\
  \n调试是编程中最令人烦恼的部分，在某些情况下，它可能是最耗时的部分。\n\n## 黑盒\n\n面向对象编程的黑盒方法使用了本节之前列出的三个 OOP 原理：数据抽象、封装和多态。\n\
  \n黑盒方法背后的想法是，你向对象发送消息，对象总是会做正确的事，尽管你不知道它是如何做的。这是因为对象控制了它所有的数据。这种控制允许对象保护自己免受无效参数和数据的破坏。你不需要可能永远无法知道类内部的情况，但当你完成黑盒测试时，该对象已经过充分测试并按预期运行。\n\
  \n黑盒测试让调试变得简单得多。如果你调试了较小的代码并并确保在任何情况下都能工作，你可能收到的错误只有在小代码与其他已调试代码交互时产生的错误。\n\n##\
  \ 链接错误\n\n链接发生在计算机将程序使用的所有文件（包括标准库）编译成可执行文件 (.exe`)时。链接错误通常很难调试，也没有特定的公式。\n\n然而，尽管听起来很严重，通常只有两种情况会引起链接错误：\n\
  \n- 你没有正确包含库文件，包括标准库以及你在程序中使用的所有其他库。\n- 你尝试声明不存在的命令，而编译器没有检测到它。例如，如果你声明了一个对象的构造函数但没有添加代码，在尝试编译时就会产生链接错误。\n\
  \n如果你无法如何修复某个特定的错误，请尝试修复其他存在的错误。有时，这样做会让第一个错误“消失”。\n\n## 创建征服游戏\n\n\n\n\n你现在将使用面向对象编程（OOP）技能来创建一个名为“征服”（Conquest）的游戏，这是一款策略性文字冒险游戏，让你作为国王坐在王座上征服你的敌人。你为每个玩家创建一个\
