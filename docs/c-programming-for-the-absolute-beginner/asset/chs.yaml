  \ `random_iterator` 的迭代器，它使用另一个迭代器随机随机遍历容器。\n\n**答案：**\n\n```cpp\ntemplate<class\
  \ Iter> class random_iterator :\npublic iterator<iterator_traits<Iter>::iterator_category,\n\
  \               iterator_traits<Iter>::value_type,\n               iterator_traits<Iter>::difference_type,\n\
  \               iterator_traits<Iter>::pointer,\n               iterator_traits<Iter>::reference>\n\
  {\nprotected:\n//用于内部随机迭代\n//使用普通迭代器\n    Iter current;\n    int size;\n\npublic:\n\
  //给迭代器类型起一个标准名称\n    typedef Iter iterator_type;\n// 默认构造函数\n    random_iterator()\
  \ : current() {srand(time(0));}\n// 从普通迭代器的构造函数\n    random_iterator(Iter x, int\
  \ y) : current(x), size(y) {}\n// 从另一个 random_iterator 构造\n    template<class U>\
  \ random_iterator (const random_iterator<U>& x)\n    : current(x.base()) {}\n//返回此类使用的普通迭代器\n\
  \    Iter base() const {return current;}\n    reference operator* () const\n   \
  \ {\n        Iter tmp = current;\n        return *–tmp;\n    }\n// 解引用\n    pointer\
  \ operator-> () const;\n// 访问成员运算符\n    reference operator[] (difference_type n)\
  \ const;\n// 递增和减返回随机位置\n    random_iterator& operator++ () {return current[rand()%(size\
  \ + 1)] }\n    random_iterator& operator– () { return current[rand()%(size + 1)];}\n\
  \    random_iterator operator+ (difference_type n) const;\n    random_iterator operator+=\
  \ (difference_type n);\n    random_iterator operator- (difference_type n) const;\n\
  \    random_iterator operator -= (difference_type n);\n};\n```\n\n#### 4. 写出三个可以快速获取关于标准库组件信息的地方（不包括此本书）。\n\
