  ## 总结\n在本章中，我们涵盖了许多重要的主题，包括模板、字符串和 vector。请将本章视为你对 C++ 标准库的首次主要介绍，这是一个强大的工具，随着时间的推移，你可能会深入研究。你不需要记忆\
  \ `basic_string` 的每一个方法。\n\n### 挑战\n1. 创建一个存储 vector 集合的，每个 vector 存储一组整数。\n2. 创建一个名为\
  \ `Store` 的模板类，用于存储一个 `T` 数组（其中 `T` 是模板参数）。\n3. 创建一个名为 `random_iterator` 的迭代器，它使用另一个\
  \ `iterator` 以随机顺序遍历容器。\n4. 列举三个可以快速获取标准库组件信息的地方（不包括本书书）。\n\n---\n\n## 第 9 章：使用流和文件\n\
  \n流（Streams）和文件是 C++ 语言中两个复杂的课题之一。然而，在本章中，我们打算让学习这些主题变得轻松。尽管关于这些主题可以写的内容很多，但当你完成本章后，你绝对能够使用流来完成任务。\n\
  \n在本章中，你将学习到以下内容：\n- 与流和 I/O 相关的词汇\n- 各种类型的操纵符（manipulators）\n- 二进制文件和文本文件\n- 将数据类型分为更小的位域\n\
  - 位移的魔力\n- 创建加密程序\n\n### 理解 I/O 词汇\n本章的核心是 I/O（输入/输出）。I/O 指从各种硬件设备（如硬盘、调制解器和键盘）发送（输出）和接收（输入）数据。\n\
  \n尽管 C++ 并没有作为基础 HINT 语言的一部分直接支持 I/O 操作，但它将 I/O 作为标准库的一部分包含。即使 I/O 是标准库的一部分，C++\
  \ 也将流的大部分应用留给了程序员。我们的意思是，C++ 对 I/O 有非常基础的支持，因此程序员必须调整这种低级支持以满足他们的需求。\n\n为了学习 I/O，你需要了解这些术语。以下是我们在本章中使用的几个定义：\n\
  - **流对象（Stream object）**：既作为字节的源也是终点。流对象操纵一组有序的线性字节。这系列字节可以代表屏幕、文件或程序员希望字节去往的任何地方。你可以在几个库文件中找到流的类：`<fstream>`,\
  \ `<iomanip>`, `<ios>`, `<iosfwd>`, `<iostream>`, `<istream>`, `<ostream>`, `<sstream>`,\
  \ `<streambuf>`, 和 `<strstream>`。\n- **操纵符（Manipulator）**：以某种方式操纵流的数据。例如，操纵符可以将所有字符转为大写，或者将使用十进制表示法的数字转换为十六进制表示法。\n\
  - **插入（Insertion）**：将字节放入流中。执行插入的方法称为插入器（inserters）。\n- **提取（Extraction）**：从流中取出字节。执行提取的方法称为提取器（extractors）。\n\
  \n### 理解头文件\n在上一节关于流对象的项目符号中，我们列出了几个头文件。这些头文件每一个都封装了整个 C++ 流架构的一个部分。所有这些文件共同提供了\
  \ C++ 提供的完整 I/O 支持。这些每个文件都完成其特定任务，使 C++ 拥有任何编程语言中最多样化的 I/O 功能。每个头文件的目的如下：\n- `<fstream>`：包含了几个模板类的定义，这些类支持\
  \ `iostream` 头文件对存储在外部文件中序列的操作。\n- `<iomanip>`：包含了几个单参数操纵符。\n- `<ios>`：包含了 `iostream`\
  \ 头文件类基础操作所需的大多数格式操纵符。\n- `<iosfwd>`：包含了 `iostream` 头文件类的前置声明。\n- `<iostream>`：包含了标准全局流对象（如\
  \ `cin` 和 `cout`）的声明。\n- `<istream>`：包含了从流输入数据的提取器，并包含了模板类 `basic_istream`。换句话说，`<istream>`\
  \ 提供了 I/O 中的 `I`。\n- `<ostream>`：包含了输出系列字节的插入器，并包含了模板类 `basic_ostream`。基本上，`<ostream>`\
  \ 提供了 I/O 中的 `O`。\n- `<sstream>`：支持定义在字符串对象上的流。\n- `<streambuf>`：定义了 `basic_streambuf`\
  \ 模板类。\n- `<strstream>`：支持定义在数组上的流。\n\n### IOS_BASE 类\n`ios_base` 类包含了所有流共有的字节存储以及不依赖模板参数的方法。这种字节存储了正在输入和输出的字节，直到它们到达目的地。\n\
  \n`ios_base` 类包含的若干数据类型提供了控制流的基础。列表概述了用于控制流的若干数据类型的目的：\n- `event`：使用数据类型 `event`\
  \ 中的事件信息来存储回调。回调是方法的指针，当特定的重大事件发生时，操作系统注册并调用它们。\n- `fmtflags`：使用数据类型 `fmtflags`\
  \ 中的格式标志来指定有关流格式的信息。\n- `iostate`：使用数据类型 `iostate` 中的 I/O 状态信息来跟踪 I/O 操作当前状态。使用\
  \ `iostate` 数据类型检查流损坏。\n- `openmode`：使用打开模式指定流的读/写访问类型。\n- `seekdir`：使用查找方向指定流数据查找的位置，并将其存储在类型别名\
  \ `seekdir` 中。\n\n此外，你可以使用 `ios_base` 及其派生类（所有其他流类）提供的若干方法。按字母顺序排列如下：\n- `flags()`：设置或返回格式标志信息。\n\
  - `getloc()`：返回一个封装了流信息的内部本地对象。\n\n\n\n\n- `imbue()`. 存储一个封装了流信息的本地对象，并返回其之前存储的对象。\n\
  - `ios_bas()`。这是构造函数。\n- `iword()`。返回可扩展数组中指定元素的引用，该数组元素类型为 `long`。\n- `operator\
  \ =()`（重载赋值运算符）。将对象中的所有内容复制到新的流对象中，包括格式信息和可扩展数组。\n- `precision()`。决定显示精度的的小数点位数。\n\
  - `pword()`。返回 `void*` 数组中特定元素的引用。\n- `register_callback()`。为流回调事件存储回调信息。\n- `setf()`。为流设置新标志位，并返回之前设置的标志。\n\
  - `unsetf()`。清除所有标志。\n- `width()`。设置或获取流的字段宽度。\n- `xalloc()`。返回一个唯一的静态变量，用于在 `iword()`\
  \ 或 `pword()` 中作为索引。\n\n关于 `ios_base` 类还有很多内容可以写。然而，为了保持这本书的趣味性并控制在预期的页数范围内，我们决定将重点放在流的最常用用法上。但是，如果你像我们一样，是那些对流学得不够的奇特人，你可以在\
  \ MSDN 网站的 Library 部分扩展你的知识：http://www.MSDN.Microsoft.com。\n\n# 第 9 章 • 使用流和文件\n\
  \n### 文件流简介\n\n为了增加游戏的功能性，你通常需要存储数百万条数据——例如地图信息或玩家上次保存的游戏数据。你可以通过几个专门的文件 I/O 类来存储这些数据：`ofstream`、`ifstream`\
  \ 和 `fstream`，它们分别包含在 `ofstream`、`ifstream` 和 `fstream` 头文件中。\n\n### 打开文件\n\n通常，对文件流对象（例如派自\
  \ `ofstream`、`ifstream` 和 `fstream` 类的对象）的第一个操作是将其与要操作的文件关联起来。你使用 `open()` 方法或每个类的构造函数来建立这种关联。\n\
  \n`open()` 方法的原型所示：\n\n```cpp\nvoid open (const char * filename, openmode mode);\n\
  ```\n\n`filename` 是一个表示文件名的字符字符串，`mode` 是表 9.1 所示标志的组合。\n\n标志通过按位或 (`|`) 运算符连接。假设你想以二进制模式打开“level1.map”进行输出。`open`\
  \ 函数可能如下：\n\n```cpp\nofstream file;\nfile.open (“level1.map”, ios::out | ios::binary);\n\
  ```\n\n每个文件类都包含 `open()` 方法；然而，每个流都有几个默认标志来指定其用途。不过，默认值仅在不带标志位调用该方法时才会生效。默认标志见表\
  \ 9.2。\n\n### 表 9.1：打开文件的标志\n\n| 标志 | 功能 |\n| :--- | :--- |\n| `ios::in` | 打开文件进行读取。\
  \ |\n| `ios::out` | 打开文件进行写入。 |\n| `ios::ate` | 初始位置位于文件末尾。 |\n| `ios::app` | 将每次输出都追加到文件末尾。\
  \ |\n| `ios::trunc` | 如果文件已存在，则擦除文件。 |\n| `ios::binary` | 以二进制模式访问文件。 |\n\n### 表\
  \ 9.2：文件类的默认标志\n\n| 类 | 标志 |\n| :--- | :--- |\n| `ofstream` | `ios::out \\| ios::trunc`\
  \ |\n| `ifstream` | `ios::in` |\n| `fstream` | `ios::in \\| ios::out` |\n\n你也可以通过在构造函数包含文件名来打开文件。类构造函数使用与\
  \ `open()` 方法相同的参数。例如，如果你使用 `ifstream` 类，构造函数原型所示：\n\n```cpp\nifstream::ifstream(const\
  \ char * filename, openmode mode);\n```\n\n在这里，`filename` 和 `mode` 的含义与 `open()`\
  \ 方法中相同。\n\n你可以通过调用 `is_open()` 方法检查文件是否正确打开：\n\n```cpp\nbool is_open()\n```\n\n\
  如果文件正确打开，`is_open()` 返回 true，否则返回 false。\n\n以下是文件未能正确打开的常见原因：\n- 文件名不正确——例如，一个不存在的文件名。\n\
  - 文件损坏——例如位于硬盘坏扇区上的文件。\n- 另一个程序具有独占访问权限——这意味着只有具有独占访问权限的程序才能访问该文件。因此，在具有独占权限的程序释放之前，其他程序无法使用该文件。\n\
  - Windows 保护了该文件——Windows 有时会自动保护特定文件夹或特定类型的文件。如果发生这种情况，请联系你的系统管理员。\n\n### 关闭文件\n\
  \n为了让其他程序能够访问文件，你必须关闭文件。此外，一个对象一次只能打开一个文件。要关闭文件，使用 `close` 方法。对于这三个类中的每一个，使用 `close`\
  \ 成员来关闭文件，如下：\n\n```cpp\nvoid close();\n```\n\n如果文件流对象被销毁，它的析构函数会自动关闭与对象关联的文件。\n\
  \n### 处理文本文件\n\n向文件输入和输出与在屏幕上输入输出完全相同，因为 `cin` 和 `ifstream` 正如 `cout` 和 `ofstream`\
  \ 一样派自 `istream` 和 `ostream` 类，正如图 9.1 所示。以下代码阐述了这一点：\n\n```cpp\n//9.1 - 输出文本\n\
  #include <fstream>\nusing namespace std;\n\nint main(void)\n{\n    //包含默认标志 ios::out\
  \ | ios::trunc\n    ofstream dragons(“dragons.txt”\n    if(dragons.is_open())\n\
  \    {\n        dragons << “Copper Dragon” << \"\\n”\n        << “Bronze Dragon”\
  \ << \"\\n”\n        << “Silver Dragon” << \"\\n”;\n    }\n    dragons.close();\n\
  \    return 0;\n}\n```\n\n输出：\n```\nCopper Dragon\nBronze Dragon\nSilver Dragon\n\
  Gold Dragon\n```\n\n`dragons.txt` 通常位于你的项目所在的文件夹中。如果你在那里没有找到它，转到 Windows 任务栏，点击开始>查找（或搜索）>文件或文件夹。打开标题为“查找文件”的窗口。输入文件名并选择存储它的驱动器。然后点击“查找”，Windows\
  \ 会为你找到它。（注意：你的程序可能有所不同。）\n\n如果你运行两次程序，你会发现文本文件始终相同的信息。这是因为如果没有指定模式参数，隐含的 `ios::trunc`\
  \ 使用 `ofstream` 类。记住，如果文件已存在，`ios::trunc` 会重启文件。\n\n虽然可以使用重载运算符 (`>>`) 从文件输入，但无法知道何时到达文件末尾。从文本文件输入最简单的方法是使用\
  \ `istream::getline()` 方法逐行输入。这也是最有用的方法，因为大多数数据都是行存储的，你输入整行，然后将行数据分解为相应的字段。\n\n\
  你有三种方式使用 `istream::getline()` 方法：\n\n```cpp\nistream& getline(char* pch, int nCount,\
  \ char delim = ‘\\n’);\nistream& getline(unsigned char* puch, int nCount, char delim\
  \ = ‘\\n’);\nistream& getline(signed char* psch, int nCount, char delim = ‘\\n’);\n\
  ```\n\n参数占位符意味着：\n- `pch`, `puch`, `psch`：指向字符数组的指针。记住 `getline` 方法会覆盖存储在数组中的数据。\n\
  - `nCount`：`getline` 方法存储的最大数量，包括终止空字符。\n- `delim`：`getline()`到的分隔符。\n\n最后，你可能想读取到文件的末尾，但你怎么知道结尾在哪里？你使用\
  \ `ios::eof()` 方法：\n\n```cpp\nint eof();\n```\n\n当到达文件末尾时，`eof()` 方法返回一个非零整数。\n\n\
  \n\n\n你现在可以将所有内容整合起来并从 `dragon.txt` 文件中读取。这里展示了该示例实现：\n\n```cpp\n//9.2 – Inputting\
  \ Dragons - Dirk Henkemans\n\n#include <fstream>\n\n#include <iostream>\n\nusing\
  \ namespace std;\n\nint main(void)\n{\n//包含默认标志 ios::in\nifstream dragons(“dragons.txt”);\n\
  char buffer[50];\nif(!dragons.is_open())\n{\n  cout << ”Error opening file\\n”;\n\
  \  //非 0 退出表示发生了错误\n  exit(1);\n}\nwhile(!dragons.eof())\n{\n  dragons.getline(buffer,\
  \ 49);\n  cout << buffer << “\\n”;\n}\ndragons.close();\nreturn 0;\n}\n```\n\n输出：\n\
  ```\nCopper Dragon\nBronze Dragon\nSilver Dragon\nGold Dragon\n```\n\n`getline()`\
  \ 方法删除了分隔符（在此情况下为默认的换行符），因此程序通过在读取每行后添加换行符来补偿。\n\n你现在已经读取了你的第一个文件！\n\n### 验证流\n\n\
  当你向流发送请求执行某项的任务时，你如何知道流是否完成了该任务呢？流对象的接口提供了几种方法，让你能够知道流是否成功完成了其任务。表 9.3 提供了几种流验证方法。\n\
  \n为了重置所有之前的流验证方法，请使用 `ios::clear()` 方法（不带参数）。\n\n#### 表 9.3 验证方法\n\n| 方法 | 描述 |\n\
  | :--- | :--- |\n| `bad()` | 如果在尝试从文件读取或写入时发生严重错误，则返回 true。例如，这可能发生在你尝试向一个没有剩余空间的设备写入数据时。\
  \ |\n| `eof()` | 如果流到达文件末尾，则返回 true。这仅在你从文件输入时有效。 |\n| `fail()` | 如果存在格式错误，则返回 true。例如，流尝试读取一个整数，但发现了一个字母字符。\
  \ |\n| `good()` | 这是一个通用方法，如果前面的方法 `bad`、`eof` 或 `fail` 中任何一个返回 true，它则返回 false。\
  \ |\n\n### 使用二进制流操作\n\n虽然处理文本很方便，但在许多情况下效率很低。在使用 28.8 波调制调器时，你通常会发送尽可能的数据。在像暴雪开发的《星际争霸》这样的游戏中，你可以预先指定发送哪些数据类型。这允许你使用多种一种数据类型（如字符）。\n\
  \n解决方案是二进制流，它可以发送多种数据类型。程序必须知道发送的数据类型的顺序和种类以便读取数据。图 9.2 显示了一个文本流和一个二进制流。\n\n为了进行正确的解释，程序必须知道二进制流中的字节与哪个结构相关。这意味着二进制流必须应用程序化的算法（如\
  \ `int`、`char` 或 `long`）来解码数据，但文本流可以假设每个字节都是字符。在图 9.2 中，注意顶部的数据流是一个文本文件，每个字节的含义相同——一个字符。底部的流是一个数据流，其中的字节是较大结构的一部分；你的程序必须知道该结构是什么才能正确使用该字节。\n\
  \n**图 9.2**\n一个文本流和一个二进制流。\n\n### GET 和 PUT 流指针\n\n内存索引是为了方便我们而设计的，但更重要的是，它的索引是为了确保随机访问。随机访问允许你以任何顺序访问文件或流的部分。例如，你可以像正向读取文件一样容易地反向读取文件。两个指针（通常称为流指针）指示你读取或写入的位置。这些流指针是\
  \ get 指针和 put 指针。get 指针指示你正在读取的位置，而 put 指针指示你正在写入的位置。\n\n所有的 I/O 流都至少有一个流指针，具体取决于流的方法。以下是常用类的指针：\n\
  \n- `ifstream`。像 `istream` 一样，该类有 get 指针。\n- `ofstream`。像 `ostream` 一样，该类有 put 指针。\n\
  - `fstream`。由于派生自 `istream` 和 `ostream`，该类两个指针。\n\n### 与流指针交互\n\n当创建一个用于调整指针的接口时，这两个流指针就获得了功能。\n\
  \n该接口包含以下方法：\n\n- `istream::tellg()`。返回 get 指针距离文件开头的字节数（而不是 get 指针所指向的地址）。`streampos`\
  \ 数据类型实际上是整数的类型别。该方法的原型是 `streampos tellg();`。\n- `ostream::tellp()`。返回 put 指针距离文件开头的字节数。该方法的原型是\
  \ `streampos tellp();`。\n- `istream::seekg()`。设置流中 get 指针的位置。该方法的原型是 `seekg (pos_type\
  \ position);`。\n- `ostream::seekp()`。设置流中 put 指针的位置。该方法的原型是 `seekp (pos_type position);`。\n\
  - `seekg()` 和 `seekp()`。设置指针偏移的方向和偏移的量。这些方法的原型为：\n  `seekg ( off_type offset, seekdir\
  \ direction );`\n  `seekp ( off_type offset, seekdir direction );`\n\n在第二个参数 `direction`\
  \ 中指定的偏移方向如表 9.4 所示。\n\n#### 表 9.4 偏移方向\n\n| 方向 | 描述 |\n| :--- | :--- |\n| `ios::beg`\
  \ | 偏移从流的开始处指定。 |\n| `ios::cur` | 偏移从指针的当前位置向前指定。 |\n| `ios::end` | 偏移从流的末尾指定。 |\n\
  \n以下示例使用了刚刚讨论的几个方法来确定文件的大小：\n\n```cpp\n//9.3 – Binary File Size – Dirk Henkemans\n\
  #include <iostream>\n#include <fstream>\nusing namespace std;\n\nint main(void)\n\
  {\nint n1, n2;\nifstream dragons(“dragons.txt”, ios::in|ios::binary);\nn1 = dragons.tellg();\n\
  dragons.seekg(0, ios::end);\nn2 = dragons.tellg();\ncout << ”The size of dragons.txt\
  \ is “ << n2 - n1 << “n”; return 0;\n}\n```\n\n输出：\n```\nThe size of dragons.txt\
  \ is 58\n```\n\n### 写入和读取二进制流\n\n文件流引入了两个专门为数据的顺序输入输出设计：`ostream::write()` 和 `istream::read()`。这两个文件的原型如下：\n\
  `write (char * buffer, streamsize size );`\n`read( char * buffer, streamsize size\
  \ );`\n\n`write()` 将指定数量的字节放在 put 指针之后，从而写入文件。`read()` 从 get 指针获取指定数量的字节放入缓冲区。\n\
  \n为了说明这两个方法，请查看以下程序，它将 `dragons.txt` 文件复制到另一个名为 `dragons2.txt` 的文件中。\n\n```cpp\n\
  //9.4 - File Copier - Dirk Henkemans\n#include <iostream>\n#include <fstream>\n\
  using namespace std;\n\nint main(void)\n{\nchar buffer;\nint index = 0;\n//文件名\n\
  const char filename1[] = “dragons.txt”;\nconst char filename2[] = “dragons2.txt”;\n\
  //打开文件\nfstream file1(filename1, ios::in);\nfstream file2(filename2, ios::out);\n\
  //指向文件开头\nfile1.seekg(0, ios::beg);\nfile2.seekp(0, ios::beg);\n//读取第一个字符\nfile1.read(&buffer,\
  \ 1);\n//写入剩余字符\nwhile(file1.good() && file2.good())\n{\nfile2.write(&buffer, 1);\n\
  index++;\nfile1.seekp(index);\nfile2.seekg(index);\nfile1.read(&buffer, 1);\n}\n\
  //关闭文件\nfile1.close();\nfile2.close();\n\nreturn 0;\n}\n```\n\n\n\n\n当你打开 `dragons2.txt`\
  \ 时，它应该和 `dragons.txt` 相同。\n\n## 使用常用操符\n\n操符（Manipulators）用于处理流中的数据。例如，你可以使用某些操符将所有小写字母转换为大写，或调整数字的显示方式。大多数操符都包含在\
  \ `ios` 头文件中。在接下来的章节中，你将只使用 `ios` 头文件中的常用操符。\n\n虽然我们无法在书中列出所有的操符，但表 9.5 列出了其中几个最常用的操符及其功能。\n\
  \n### 表 9.5：<ios> 头文件中的常用操符\n\n| 标志 | 功能 |\n| :--- | :--- |\n| `dec()` | 以十进制显示。\
  \ |\n| `hex()` | 以十六进制显示。 |\n| `oct()` | 以八进制显示。 |\n| `fixed()` | 插入浮点数值（固定格式）。\
  \ |\n| `scientific()` | 使用科学计数法（指数形式）插入浮点数值。 |\n| `internal()` | 根据需要插入内部空白来填充到字段宽度。\
  \ |\n| `left()` | 通过在右侧填充空白使字符左对齐。 |\n| `right()` | 通过在左侧填充空白使字符右对齐。 |\n| `boolalpha()`\
  \ | 真和假的符号化表示。 |\n| `noboolalpha()` | 取消 `boolalpha()`。 |\n| `showbase()` | 显示数的基数，分别在八进制和十六进制数前加上\
  \ 0 和 0x。 |\n| `noshowbase()` | 取消 `showbase()`。 |\n| `showpoint()` | 即使没有小数部分也显示小数点点。\
  \ |\n| `noshowpoint()` | 取消 `showpoint()`。 |\n| `showpos()` | 在非负数前插入正号 (+)。 |\n\
  | `noshowpos()` | 取消 `showpos()`。 |\n| `skipws()` | 跳过空白字符。 |\n| `noskipws()` |\
  \ 取消 `skipws()`。 |\n| `unitbuf()` | 每次插入后立即刷新（刷新缓冲区）。 |\n| `nounitbuf()` | 取消 `unitbuf()`。\
  \ |\n| `uppercase()` | 插入小写字母的大写对应字符。 |\n| `nouppercase()` | 取消 `uppercase()`。 |\n\
  \n### 第 9 章 • 使用流和文件\n\n你可以通过使用 `ios::setf()` 方法并传入标志作为参数，在任何流上使用表 9.5 中的操符。接下来的程序清楚地演示了这一过程以及在\
  \ `cout` 对象上使用时的结果。\n\n```cpp\n//9.5 - Manipulators - Dirk Henkemans\n\n#include\
  \ <iostream>\n#include <ios>\n\nusing namespace std;\n\nint main(void)\n{\n    cout\
  \ << “Default True, False \\n” << true << “ “ << false << “\\n”; cout.setf(ios::boolalpha);\n\
  \    cout << ”\\nwith ios::boolalpha:\\n” << true << “ “ << false << “\\n”; cout\
  \ << ”\\n140 in hex\\n”;\n    cout.setf(ios::hex, ios::basefield);\n    cout.setf(ios::showbase);\n\
  \    cout << 140 << “\\n”;\n    float f[2] = {1.0f, 775.374f};\n    cout << “\\\
  nDefault numeric formula\\n” << f[0] << “\\n” << f[1] << “\\n”; cout.setf(ios::showpos);\n\
  \    cout<< “\\nand with showpos\\n” << f[0] << “\\n” << f[1] << “\\n”;\n    //indicates\
  \ that cout should always use 6 digit precision\n    cout.setf(ios::fixed);\n  \
  \  cout<< “\\nand with a precision of 6\\n” << f[0] << “\\n” << f[1] << “\\n”; return\
  \ 0;\n}\n```\n\n### 使用位域\n\n标准数据类型已内置在 C++ 中；然而，通常将一个标准数据类型划分为几个位域以存储多个较小的值会更高效。这些位部分被称为位域（bit\
  \ fields）。例如，假设你想将一个 `unsigned char` 划分为位域。一个 `unsigned char` 由 8 位组成。这意味着所有位域之和必须包含\
  \ 8 位。\n\n你通过在声明后放置冒号并指定位域中的位数来声明位域。你必须在结构内部声明位域，如下所示：\n\n```cpp\nstruct shortBits\n\
  {\n    short member1 : 2;\n    short member2 : 7;\n    short member3 : 7;\n};\n\
  ```\n\n`member1` 只能存储三个值：1 + 2。\n`member2` 和 `member3` 可以存储 127 个值：1 + 2 + 4 + 8\
  \ + 16 + 32 + 64。\n\n图 9.3 直观地表示了 `shortBits` 结构在内存中可能的样子。在图中，`short` 数据类型的总内存被划分为三个独立的成员。\n\
  \n## 位移的趣味\n\n`<<`（左移）和 `>>`（右移）是位移操作符。当你进行位移时，你会获取数据类型的位并将其移动 1 位。例如，如果你想将一个 `char`\
  \ 向左移动 2 位，则 `char` 的所有位将向左移动 2 位。最左侧的 2 位被截断，并在最右侧位置添加 2 个假位（false bits），如图 9.4\
  \ 所示。\n\n向右移动一位等同于乘以 2，向左移动一位等同于除以 2 并舍弃余数。\n\n### 创建加密程序\n\n特工，如果你接受这项任务，你的目标是为英国\
  \ S.A.S. 特种作战部队开发一个高安全性的加密程序。该程序必须快速且高效，让 S.A.S. 特工能够在敌方区域内快速工作。如果你被捕获，我们作者将否认对你存在的一切认知。\n\
  \n祝你好运，特工！\n\n本次作业使用的加密算法并不困难。你的程序将获取每个字节的前四位和后四位并交换它们。你可以使用位移操作符并除以 128 同时截断小数部分来实现。\n\
  \n尝试自己解决问题，但如果你卡住了，可以查看以下“加密程序”中的解决方案。\n\n```cpp\n//9.6 - Encryption Program - Dirk\
  \ Henkemans\n//一个文本数据加密程序\n#include <iostream>\n#include <fstream>\n\nusing namespace\
  \ std;\n\nclass Encryption\n{\n    fstream file1; //源文件\n    fstream file2; //目标文件\n\
  public:\n    Encryption(char* filename1, char* filename2)\n    {\n        file1.open(filename1,\
  \ ios::in | ios::out | ios::binary);\n        file2.open(filename2, ios::out|ios::binary);\n\
  \    }\n    //加密文件\n    void Encrypt(void)\n    {\n        char currentByte;\n \
  \       bool currentBit;\n        int index = 0;\n        //将指针置到文件开头\n        file1.seekg(0,\
  \ ios::beg);\n        file2.seekp(0, ios::beg);\n        //读取第一个值\n        file1.read(&currentByte,\
  \ 1);\n        while(file1.good())\n        {\n            //循环四位\n            for(int\
  \ c = 0; c < 4; c++)\n            {\n                //判断第一位是否为 1\n            \
  \    currentBit = (int)((unsigned char)currentByte / 128);\n                //移动字节\n\
  \                currentByte <<= 1;\n                //如果第一位是 1，则将其添加到末尾\n     \
  \           if(currentBit)\n                {\n                    currentByte +=\
  \ 1;\n                }\n            }\n            //写入字符\n            file2.write(&currentByte,\
  \ 1);\n            //增加指针\n            file1.seekg(index);\n            file2.seekp(index);\n\
  \            //读取下一个值\n            file1.read(&currentByte, 1);\n        }\n   \
  \ }\n    //关闭两个文件\n    void close(void)\n    {\n        file1.close();\n       \
  \ file2.close();\n    }\n};\n\nint main(void)\n{\n    cout << “Welcome to the S.A.S\
  \ encryption program.”;\n    Encryption delta(“dragons.txt”, “output1.txt”);\n \
  \   delta.Encrypt();\n    delta.close();\n    Encryption gamma(“output1.txt”, “output2.txt”);\n\
  \    gamma.Encrypt();\n    delta.close();\n    return 0;\n}\n```\n\n\n\n\n\n![](img/index-281_3.png)\n\
  \n# 262\n# 零学者 C++ 编程（第二版\n\n## 总结\n在本章开头，你查看了层级结构并学习了流的定义。\n\n然后，你以文本模式对一些文本文件使用了文件流。随后，随着知识的扩展，你继续使用文件流复制文件，并学习了\
  \ `get` 和 `put` 指针。通过使用 `<ios>` 头文件库中的常用操作符，你操纵了 `cout` 流并产生了几个酷炫的输出。最后，你开发了一个加密程序。\n\
  \n## 挑战\n\n1. **创建一个程序，将以下两行文本写入名为 `Question1.txt` 的文件中：**\n```\nProgramming is\
  \ fun.\nI love programming.\n```\n\n2. **可以使用哪种方法测试文件是否已到达末尾？可以使用哪种方法测试文件是否发生错误？可以使用哪种方法测试文件是否到达末尾且发生了错误？**\n\
  \n3. **字母 A 向左移动三位（`<<3`）的结果是什么？字母 A 向右移动二位（`>>2`）的结果是什么？**\n\n4. **解释为什么加密程序需要运行第二次才能解密放入程序中的文件。**\n\
  \n# 章节：错误与异常处理\n\n亲爱的读者，到目前为止你学习了许多 C++ 知识。现在，你准备好探索如何让你的程序更加安全且防止崩溃了。在本章中，你将学习如何确保某些条件保持为真。你将学习如何防止数组越界。简而言之，你将学习如何让程序变得非常稳定，能够处理意外情况。在本章中，你将学习：\n\
  \n* 使用断言（assertions）\n* 处理异常\n* 捕获所有异常\n\n### 断言条件\n有时，某些操作可能是危险的。它们可能会损坏内存、导致电脑死机，或者更糟。通常，你你知道为了使操作成功哪些条件必须为真。你知道某些条件必须成立。如果这些条件不成立，结果可能是灾难性的。作为程序员，你的职责是在执行操作之前测试这些条件。如果条件失败，你必须立即终止程序，否则将面临灾难。\n\
  \n好了，这听起来有点戏剧化了。某些操作确实可能导致问题，但它们造成永久性或灾难性后果的情况非常罕见。然而，为了让程序成功执行，在执行主要操作（或潜在风险操作）之前，进行测试以确保条件为真是一个好主意。如果你在测试程序时条件失败了，你只需退出程序，并让程序显示一条消息说明发生了什么以及在某一行代码发生的。\n\
  \nC++ 提供了一个特殊的宏，称为“断言”（assertion），用于在特定条件下退出程序并显示指定的消息。断言是宏，它们会测试一个条件，如果条件失败则退出程序。该宏的标准版本定义在\
  \ `<cassert>` 中。断言的原型如下：\n\n```\nvoid assert(int expression);\n```\n\n尽管 `expression`\
  \ 是一个整数，但它被视为一个布尔表达式（例如，`5 < 3`）。因此，测试条件看起来可能像这样：\n\n```\nassert (y > 0);\n```\n\
  \n如果 `y` 大于 0，此断言将什么都不做；但如果 `y` 不大于 0，程序将停止并显示错误消息。为了亲眼看到此错误消息，请尝试编译以下程序：\n\n```\n\
  //10.1 - 断言失败 - Mark Lee\n#include <cassert>\n\nint main(void)\n{\n    assert(5>6);\
  \ //始终失败\n    return 0;\n}\n```\n\n这个断言总是失败的，因为 5 永远大于 6。那么，当这个断言失败时会发生什么？首先显示这条消息：`Assertion\
  \ failed: 5>6, file C:\\Projects\\Temp\\Test13\\Test13.cpp, line 5`\n\n在我的电脑上（我使用的是\
  \ Windows Vista 专业版和 Visual Studio 2008 表达版），弹出的窗口显示程序异常终止，如图 10.1 所示。\n\n`assert`\
  \ 宏在失败时通过调用名为 `abort()` 的函数来结束程序。`abort()` 函数包含在 `<cstdlib>` 中。该函数没有参数也不返回值。它只是简单结束程序。这个函数导致了图\
  \ 10.1 中对话框的出现。该函数还会输出消息“abnormal program termination”（程序异常终止）。\n\n![](img/index-284_1.png)\n\
  \n# 第 10 章 错误与异常处理\n\n如果此断言不能满足你的需求，或者你希望程序在断言失败后继续运行，你需要定义自己的断言。然而，如果你只是使用 `assert`\
  \ 宏来调试程序，那么通常没问题。\n\n你可以使用断言来确保你没有越界访问数组。你还可以在函数开头使用它们来确保用户正确应用了函数，并使用它们来验证你不确定是否正确的代码结果。\n\
  \n**图 10.1**\n如果你的程序中出现断言失败，你将看到类似这样的对话框。它会显示执行文件的文件名和目录。\n\n记住，你使用断言是为了调试代码，因此在发布程序或将其交给他人使用之前，务必移除所有断言。（你的程序用户不需要知道代码文件第\
  \ 675 行发生了断言失败。）如果你想在发布程序时处理程序中发生的意外错误，请使用异常处理。\n\n### 处理异常\n当你编写不是完整程序的代码（例如类或一组函数）时，你的代码可能会发生意外错误。你不能总是依赖预期的值，也无法总是假设代码的用户知道自己在做什么。\n\
  \n一段优雅的代码会在这类情况发生时防止程序崩溃。让代码变得“优雅”的一种方法是使用异常处理，它使你能够管理程序中的非常规情况。\n\n通过异常处理，你实际上可以防止不可预测的发生和特殊事件。异常意味着你的代码某部分无法执行被要求的任务。异常处理允许你尝试另一种方法来完成任务，或尝试修复问题。\n\
  \n异常的发生是因为一段代码抛出了异常。意外事件（或异常）的一个例子是计算机硬盘空间不足。然而，硬盘空间不足并不意味着程序一定会崩溃或在任务上完全失败。你可以通过指定程序捕获特定异常来编写处理此类异常的代码。\n\
  \n为了捕获异常，你必须使用 `try-block`（try 块）。`try-block` 是开头带有 `try` 关键字的代码段。该关键字用于跟踪是否抛出了异常。`try-block`\
  \ 的语法如下：\n\n```\ntry { someCode }\n```\n\n使用 `try-block` 告诉计算机，该块内部的代码可能会抛出异常，所以请注意。\n\
  \n在建立 `try-block` 后，可以使用它来捕获异常。你通过使用 `catch` 语句来实现。`catch` 语句的语法如下：\n\n```\ncatch(exceptionName)\
  \ { whatToDo }\n```\n\n\n\n\n这里的 `exceptionName` 是异常的名称。当 `try` 块内部的代码抛出异常时，计算机会开始执行\
  \ `catch` 语句内部的代码。为了让 `catch` 语句与 `try` 语句连接，`catch` 语句必须紧跟在 `try` 语句之后。你不能在它们之间放置任何代码：\n\
  \n```cpp\ntry\n{\n    someCode\n}\ncatch (exceptionName)\n{\n    whatToDo\n}\n```\n\
  \n你可以在 `try` 语句后放置任意数量的 `catch` 语句：\n\n```cpp\ntry {\n    someCode\n}\ncatch (exceptionName1)\n\
  {\n    whatToDo1\n}\ncatch (exceptionName2)\n{\n    whatToDo2\n}\n```\n\n第 10 章\
  \ • 错误与异常处理\n\n当抛出异常时，相应的 `catch` 语句会被调用。\n\n异常是使用 `throw` 语句抛出的。其语法如下：`throw exception;`\n\
  \n\n\n这里的 `exception` 是异常本身。`exceptionName`（来自 `catch` 语句）是一个类型的名称——任何类型。它可以是 `int`、`char*`\
  \ 或 `string`。事实上，它非常像函数参数，不同在于它不需要变量名。\n\n`exception` 必须是一个表达式。使用 `throw` 语句就像调用函数。将所有的\
  \ `catch` 语句想象成一个重载函数。根据异常的类型，计算机可以决定哪一个 `catch` 语句是最合适的（如果有的话）。\n\n这里是一个示例：\n\n\
  ```cpp\n#include<iostream>\n\nusing namespace std;\n\nint main (void)\n{\n    try\n\
  \    {\n        int x = 10;\n        if (x == 10)\n            throw x;\n    }\n\
  \    catch(int x)\n    {\n        cerr << “Oh No! x equals “ << x << “!!!!”;\n \
  \   }\n    catch(float f)\n    {\n        cerr << “How did I get here?”;\n    }\n\
  \    return 0;\n}\n```\n\n在前面的示例中，变量 `x` 被初始化为 `10`。然后程序检查 `x` 是否等于 `10`，如果是，则抛出一个异常。这显然是一个没有意义的例子，但它说明了我们的观点。\n\
  \n`catch` 语句的 `exceptionNames` 不仅仅是类型名。它包含变量声明，因为 `catch` 语句的作用与函数完全相同。`x` 的值（`10`）被传递给\
  \ `catch` 语句，以便 `catch` 语句能够正确处理错误（如果 `catch` 语句知道错误是什么会有帮助）。\n\n此外，尽管有两个 `catch`\
  \ 语句，计算机利用函数重载的规则判断出了哪一个是正确的调用语句。\n\n使用内置数据类型作为异常通常不是一个好主意。当抛出一个整数时，你无法准确判断错误具体是什么。你可能假设错误与整数的值有关，但你无法确定。\n\
  \n幸运的是，有一种标准方法来传递此类信息。通常，你为每种异常定义一个新类型。这里是一个示例：\n\n```cpp\nclass FileError {};\n\
  ```\n\n注意这个类是完全空的吗？这是因为类内部不需要任何内容。该类仅仅是为了它的名称而使用的。这里是如何使用它的示例：\n\n```cpp\n#include\
  \ <iostream>\n#include <istream>\n#include <fstream>\n\nusing namespace std;\n\n\
  class FileError {};\n\nint main (void)\n{\n    try\n    {\n        char* filename\
  \ = “hello.txt”;\n        fstream file;\n        file.open(filename, ios::in);\n\
  \        if (!file.is_open())\n            throw FileError();\n    }\n    catch\
  \ (FileError)\n    {\n        cerr << “Error with file.”;\n    }\n    return 0;\n\
  }\n```\n\n如果你的代码抛出一个未被捕获的异常（没有相应的 `catch` 语句），计算机将决定如何处理。遗憾的是，计算机并不宽容。它认为处理异常的最佳方法是立即关闭程序。为了这样做，计算机调用\
  \ `terminate()` 或 `unexpected()` 函数；这两个函数都包含在 `<exception>` 中。\n\n此外，两者都没有参数也没有\
  \ `void` 返回类型。要查看调用这些函数时会发生什么，请编译并运行以下程序：\n\n```cpp\nint main (void)\n{\n    throw\
  \ 5; //任意值\n    return 0;\n}\n```\n\n你可能注意到显示的错误信息与 `abort()` 函数完全相同。这是因为 `terminate()`\
  \ 调用了 `abort()`。你也可以通过调用 `set_terminate()` 函数让 `terminate()` 调用一个自定义函数。其声明如下：`typedef\
  \ void (*terminate_function)();`\n\n`terminate_function set_terminate(terminate_function\
  \ term_func);`\n\n这个声明看起来非常复杂，但你只需要将函数名作为参数传递。这里是一个示例：\n\n```cpp\n#include <exception>\n\
  #include <iostream>\n\nusing namespace std;\n\nvoid error_handler()\n{\n    cerr\
  \ << “There was an uncaught error.”;\n}\n\nint main (void)\n{\n    set_terminate(error_handler);\n\
  \    throw 5;\n    return 0;\n}\n```\n\n输出：\nThere was an uncaught error.\n\n###\
  \ 构建异常层次结构\n\n如果你在一个大型程序中使用非常具体的异常，你很快就会拥有数量多到无法管理的异常。在每个 `try` 块后放置大量的 `catch`\
  \ 语句充其其量量是令人烦恼的。你很容易忘记包含其中一个，从而导致相当大的问题。坦率地说，随着编程的进行，你将发现解决这一问题的技术。\n\n然而，一种常见的方法是使用继承（更多信息请参阅第\
  \ 8 章“引入继承”）。如果你建立一个异常层次结构，你就可以处理最通用的异常，而不是具体的。或者你可以对某些异常非常具体，对另一些异常非常通用。这赋予了你灵活性来设计程序，使其适应任何情况。\n\
  \n这里是这样一种层次结构的示例：\n\n```cpp\nclass MathError {};\nclass DivideByZero : public MathError\
  \ {};\nclass Overflow : public MathError {};\n```\n\n```cpp\n#include <iostream>\n\
  using namespace std;\n\nint divide(int a, int b);\n\nint divide(int a, int b)\n\
  {\n    if (b == 0)\n    {\n        throw DivideByZero();\n        return false;\n\
  \    }\n    return a/b;\n}\n\nint main (void)\n{\n    try\n    {\n        if (!divide(5,0))\n\
  \            throw MathError();\n    }\n    catch(DivideByZero)\n    {\n       \
  \ cerr << “Whoops! You tried to divide by zero”;\n    }\n    catch (MathError)\n\
  \    {\n        cerr << “There was an math error.”;\n    }\n    return 0;\n}\n```\n\
  \n输出：\nWhoops! You tried to divide by zero\n\n在这里你可以看到，如果你尝试除零，会抛出 `DivideByZero`\
  \ 异常；如果有其他问题，就会抛出通用的 `MathError`。这个示例还说明了另一个重要点。如果你在 `try` 块中调用函数且该函数抛出错误，`try`\
  \ 块可以捕获它。\n\n### 捕获所有异常\n\n你可以捕获程序中所有可能的异常，使其几乎不会崩溃。这样做需要使用可以处理任何尚未处理异常的 `catch`\
  \ 语句。不是使用异常类型作为 `catch` 语句的参数，而是使用省略号（`...`）。当计算机搜索处理异常的 `catch` 语句时，将将其作为最后的手段（如果你包含了它的话）。其语法为：`catch(...)\
  \ { 处理异常 }`\n\n这里是如何可能使用默认 `catch` 语句的示例：\n\n```cpp\n#include <iostream>\nusing\
  \ namespace std;\n\nint main (void)\n{\n    try\n    {\n        throw 6;\n    }\n\
  \    catch(...)\n    {\n        cerr << “There was an exception, but it was caught!”;\n\
  \    }\n    return 0;\n}\n```\n\n输出：\nThere was an exception, but it was caught!\n\
  \n\n\n\n如果你将此版本的 `catch` 语句与其他 `catch` 语句一起使用，它必须位于列表的末尾。如果不是，默认 `catch` 语句之外任何后续\
  \ `catch` 语句将永远没有被调用的可能。然而，如果默认 `catch` 语句位于 `catch` 语句列表的末尾，它将仅作为最后的手段。\n\n# 第\
  \ 10 章 • 错误与异常处理\n\n273\n\n### 创建雷区游戏\n\n你是苏联精锐团队 `XJ77` 的成员。你被派往去拆除一个致命的雷区。\n\n\
  这项工作极其危险。只有最优秀、最聪明的人才能在雷区中活过一天。编译这个程序，看看你是否具备这种能力。\n\n```cpp\n//10.2 - MineField\
  \ - Mark Lee\n\n#include <iostream>\n#include <exception>\n#include <string>\n#include\
  \ <vector>\n#include <cstdlib>\n#include <ctime>\n\nusing std::string;\nusing std::vector;\n\
  using std::srand;\nusing std::time;\n\nclass StepOnMine {};\nclass FailedDisarm\
  \ {};\n\nclass MineField\n{\n    vector<bool> minefield;\n    // 存储玩家去过的地方\n   \
