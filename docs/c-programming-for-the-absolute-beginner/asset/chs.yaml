  \ == X)\ncout << “\\nPlayer one, you win!\\nGame Over.”;\nelse\ncout << “\\nPlayer\
  \ two, you win!\\nGame Over.”;\nreturn 0;\n}\n```\n\n## 总结\n\n在本章中，你学习了许多概念。你从指针开始，学习了它们是如何作为数组的基础的。然后，你学习了如何使用引用和动态内存。\n\
  \n最后，你重新回顾了字符串，学习了 C 风格字符串与你目前为止使用的 C++ 字符串之间的区别。不过，你的冒险还没有结束。现在是继续学习第 7 章“构建命名空间”的时候了。\n\
