  **提示**\n记住，你的新数据类型名称不仅应该方便，而且要有意义。\n\n## 使用常量\n\n有时候，当你创建一个变量时，你希望确保它的值不能被改变。\n\n\
  也许你有一个变量代表玩家手中的牌牌数量，或者赢得游戏所需的分数。这些是你想要定义一次后再也不更改的内容。你进入了常量的世界！\n\n你通过使用 `const`\
  \ 关键字来定义常量。语法与声明普通变量的语法完全相同，只是前面加上 `const` 关键字：`const constType CONSTNAME = value;`\n\
  \n**提示**\n你必须在声明常量的同一行给它赋值，因为在这一行之后值就不能改变了。任何尝试都会导致编译错误。这让你能够轻松确保该变量保持保持你预期的状态，而不会被意外修改。\n\
  \n使用常量有许多优势。假设你在程序中每次需要使用 Pi 的值时都输入数字，例如 `3.14`。然后你发现应用程序需要更高的精度；你必须将所有的 `3.14`\
  \ 更改为更高精度的值，如 `3.14159`。相反，如果你使用常量定义 `Pi` 为 `3.14`，稍后需要增加精度，你只需要在一个地方更改 `const`\
  \ 并重新编译程序。\n\n如果你有一个非常长的数字（例如保留 22 位小数的 Pi），每次使用时都输入它也会很麻烦——而且如果你和我们一样，很容易出错。使用常量会极大地简化这种情况。\n\
  \n最后，在任何可能的情况下使用 `const` 是一个良好的习惯。这有助于让你的意图清晰。它还能帮助编译器捕获代码中的错误。\n\n第 2 章 • 深入理解变量\n\
  39\n\n## 圆形游戏\n\n对于明天的数学作业，你必须计算圆的面积和周长。\n\n嗯，我们可以提供帮助。在下面的程序中，我们通过使用常量同时完成。你使用常量来存储\
  \ `PI` (`3.141592`)。然后用户只需向程序输入半径，程序就会计算圆的面积和周长。记住，用户的输入应该存储为 `float`，这样用户就可以输入小数作为半径。太棒了；现在是编写程序了：\n\
