  - 指针是使用动态内存的基础。\n- 指针是访问二进制文件的基础。\n- 指针是迭代器的基础。\n- 指针很有趣！\n\n#### 3. 章节末尾的“井棋”游戏有什么问题？你如何改进这个游戏？\n\
