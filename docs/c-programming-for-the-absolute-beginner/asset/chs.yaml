  \ 第 3 章\n\n## 使用控制语句做出选择\n\n在前面的章节中，你创建了从开始到结束执行的程序。每个语句只执行一次，并且每个语句都必须执行。然而，这种线性只对基础编程是可以接受的。\n\
  \n要创建高级的动态程序，你必须掌握控制语句，它们允许程序跳转到某些代码或多次执行某部分代码。在本章中，你将学习以下内容：\n\n- 选择语句\n- 布尔逻辑和运算符\n\
  - 迭代语句\n- 分支语句\n- 随机数\n\n### 使用选择语句选择代码\n\n人们通常根据某些条件做出决定。例如，如果一个人感到不适，可能会去看医生。决定是否去看医生是基于某个条件：感到不适。使用程序时也是如此。你可以设计你的程序，使其根据某些条件选择执行哪些代码。\n\
  \n**46**\n\n**《初学者 C++ 编程》，第二版**\n\nC 中的条件基于布尔值。正如你所学过的，布尔只有两个可能的值：真或假。组成条件的运算符和操作数决定了条件的值。\n\
  \n有两种类型的选择语句：`if else` 语句和 `switch` 语句。\n\n### 使用 if 语句测试条件\n\n\n\n\n\n可能最重要的选择语句是\
  \ `if` 语句。`if` 语句背后的思想是：语句中包含的一个特殊代码区域（称为受控制语句）只有在特定条件（称为控制条件，或简称为条件）为真时才会被执行。`if`\
  \ 语句的通用语法如下：\n\n```cpp\nif (condition)\ncontrolledStatements\n```\n\n在这里，`condition`\
  \ 是正在测试的条件，而 `controlledStatements` 是零或多个受控制语句。只有当 `condition` 求值为真时，才会执行这些受控制语句。请注意\
  \ `condition` 后面没有分号。此通用语法的整两行是一条语句，因此不需要分号。此外，请注意 `condition` 括在括号中，以将其与语句的其余部分隔离开。这些括号是必须的。如果\
  \ `controlledStatements` 只包含一个语句，语法如下：\n\n```cpp\nif (condition)\ntheStatement;\n\
  ```\n\n在这里，`theStatement` 是单一语句。注意末尾的分号，它告诉编译器这就是整个 `if` 语句。当 `controlledStatements`\
  \ 包含多个语句时，语法看起来如下：\n\n```cpp\nif (condition)\n{\n    statementList\n}\n```\n\n在这里，`statementList`\
  \ 是零或多个 C++ 语句，每个语句都以分号结束。请注意，最后一个大括号（`}`）末尾不需要分号。你可能从第 2 章“深入研究变量”中记忆起，代码块是任何由大括号分隔的代码段。代码块可以放在任何允许单条语句的地方。\n\
  \n这是一个示例。另一个到目前为止每个程序都使用的示例是 `main` 函数。\n\n在整个章节中，你将看到许多代码块示例。请留意它们。\n\n### 第 3\
  \ 章 • 使用控制语句进行选择\n\n这是一个示例：\n\n```cpp\nint swords = 9;\n\nif(swords < 8) //the condition\n\
  {\n    cout << ”The number or sword is less than 8”;\n}\n```\n\n`cout` 语句永远不会执行，因为条件（控制条件）`swords\
  \ < 8`（整数变量 `swords` 的值是否小于 8？）求值为假。九并不小于八。因为你想让它只执行一行代码，你可以用另一种方式显示这个示例——不使用大括号，如下所示：\n\
  \n```cpp\nint swords = 9;\n\nif(swords < 8) //the condition\ncout << ”The number\
  \ of swords is less than 8”;\n```\n\n在这个示例中，因为没有使用大括号，`if` 语句包含了直到分号（并包含分号）的所有内容。\n\
  \n正如我们之前说的，`if` 语句是最常见的控制语句。与接下来讨论的 `else if` 语句和 `else` 语句结合，`if` 语句可以成为你最强大的工具之一。\n\
  \n####  else if 和 else 语句\n\n有时，如果某个条件不成立，你可能想要采取替代方案。例如，你觉得病了。你可能会去看医生；否则，你会呆在家里。`otherwise`\
  \ 之后的语句就是替代方案。如果条件“感到不舒服”不成立，你将采取替代行动，留在家中。\n\n在 C++ 中，`otherwise` 被用 `else` 语句表示。`else`\
  \ 语句必须跟在 `if` 语句后面。`else` 语句不能单独出现。`else` 语句的语法如下：\n\n```cpp\nelse\ncontrolledStatements\n\
  ```\n\n在这里，`controlledStatements` 是一个或多个语句。如果你在 `controlledStatements` 中有多个语句，你必须使用用大括号括起来的块，如下：\n\
  \n```cpp\nelse {\n    statementList\n}\n```\n\n在前面，`statementList` 包含零或多个由分号分隔的语句。\n\
  \n如果 `controlledStatements` 只有一个语句，则不需要块：\n\n```cpp\nelse\ntheStatement;\n```\n\n\
  你通过将 `else` 语句直接放在 `if` 语句之后来将 `else` 语句与 `if` 语句连接：\n\n```cpp\nif (condition)\n\
  controlledStatements1\nelse\ncontrolledStatements2\n```\n\n关键字 `else` 必须紧跟在 `if`\
  \ 语句；如果放在任何其他地方，将发生编译错误。\n\n这是一个示例：\n\n```cpp\nint swords = 9;\n\nif (swords < 8)\n\
  \    cout << “Swords is less than 8”;\nelse\n    cout << “Swords is not less than\
  \ 8.”;\n```\n\n在这里，文本 `Swords is not less than 8` 将显示在屏幕上，因为 `if` 语句的条件为假；`else`\
  \ 语句会自动执行。如果整数变量 `swords` 初始化为 6，例如，文本 `Swords is less than 8` 将显示，并且整个 `else` 语句将被跳过。\n\
  \n由 `else` 语句控制的语句可以由另一个 `if` 语句组成。这就是著名的 `else if` 语句形成形成：\n\n```cpp\nif (condition1)\n\
  controlledStatements1\nelse if (condition2)\ncontrolledStatements2\n```\n\n在这里，`condition1`\
  \ 和 `condition2` 是两个独立的条件，`controlledStatements1` 和 `controlledStatements2` 是两组独立的受控制语句。前面的代码块执行情况如下：\n\
  \n- 如果 `condition1` 为真，则执行 `controlledStatements1`，计算机跳过 `if-else if` 结构的其余部分。\n\
  - 如果 `condition1` 为假且 `condition2` 为真，则执行 `controlledStatements2`，跳过 `if-else if`\
  \ 结构。\n- 如果 `condition1` 和 `condition2` 都为假，则一个控制语句都不会执行。\n\n将一个 `if` 语句放在另一个 `if`\
  \ 语句内部被称为**嵌套**。参见图 3.1 显示 `if-else if` 结构的工作方式。\n\n**图 3.1**\n\n这是 `if-else if`\
  \ 结构的工作方式。\n\n### 荣誉考验游戏\n\n你是一个勇敢的骑士，站在一个充满黑暗房间的迷宫前。你必须通过恶魔设置的一系列考验来拯救被绑架的公主。如果你通过了所有的荣誉考验，你和公主将幸福地生活。\n\
  \n第一个房间里满了金子。如果你拿了任何金子，就会通过测试；但是，你可以留下拿的金子。第二个房间满了宝石。如果你拿了这些宝石，就会证明了自己的贪婪并无法拯救公主。在最后一个房间，你必须帮助一个被龙攻击的农民。如果你通过了三次考验，恶魔就会释放公主。\n\
  \n以下是使用 `if` 和 `else` 语句实现的示例：\n\n```cpp\n//3.1 - Tests of Honour — Mark Lee and\
  \ Dirk Henkemans\n#include <iostream>\n\nint main(void)\n{\n    using std::cout;\n\
  \    using std::cin;\n\n    cout << “欢迎来到荣誉考验。”\n         << “\\n 一个恶魔绑架了一个公主，”\n\
  \         << “要由你来拯救她。”\n         << “\\n 他说你必须通过他的死亡迷宫”\n         << “中的三次考验。”;\n\
  \n    bool goldTaken, diamondsTaken, killedByDragon;\n\n    cout << “\\n\\你进入了第一个房间。”\n\
  \         << “\\n 里面装满了令人难以置信的金子。”\n         << “ \\n 你拿走金子吗（1 为是，0 为否）？”;\n   \
  \ cin >> goldTaken;\n\n    if(goldTaken)\n        cout << “\\n 你拿走了金子， ”\n     \
  \        << ”但你失败了第一个考验。 ”\n             << “\\n 游戏结束。\\n\\n”;\n    else {\n   \
  \     cout << “恭喜， ”\n             << “你通过了第一个荣誉考验！”\n             << “\\n\\你进入了第二个房间。”\n\
  \             << “ 里面满了闪烁的宝石”\n             << “\\n 你拿走这些宝石吗（1 为是，0 为否）？”;\n   \
  \     cin >> diamondsTaken;\n\n        if(diamondsTaken)\n            cout << “你拿走了宝石，\
  \ ”\n                 << “但你失败了第二个考验。”\n                 << “\\n 你证明了自己的贪婪。 ”\n\
  \                 << “\\n 游戏结束。\\n\\n”;\n        else {\n            cout << “恭喜，你\
  \ ”\n                 << “通过了第一个和第二个荣誉考验。”\n                 << “\\n\\你进入了第三个房间。”\n\
  \                 << “\\n 一个农民正被龙攻击！” \n                 << “\\n 你会帮助那个农民吗（1 为是，0\
  \ 为否）？”;\n            cin >> killedByDragon;\n\n            if(!killedByDragon)\
  \ {\n                cout << “\\n 你救了农民， ”\n                     << “并通过了所有荣誉考验。\
  \ ”\n                     << “\\n 恶魔释放了公主。”\n                     << “\\n 你和公主从此过上了幸福的生活。”;\n\
  \            } else {\n                cout << “\\n 你牺牲了农民， ”\n                \
  \     << “你通过了最后的考验。 ”\n                     << “\\n 游戏结束。\\n\\n”;\n           \
  \ }\n        }\n    }\n    return 0;\n}\n```\n\n\n\n\n\n```cpp\n<< “move on (1 for\
  \ yes, 0 for No)?”;\n\ncin >> killedByDragon;\n\nif (killedByDragon) {\n    cout\
  \ << “\\nAs you sneak by, “\n    **Chapter 3 • Making Choices with Control Statements\
  \ 51**\n    << “the dragon turns his attention to you.”\n    << “\\nHe burns you\
  \ to a crisp “\n    << “with one breath. You are dead.”\n    << “\\nGame Over.\\\
  n\\n”;\n} else {\n    cout << “Congratulations, you “\n    << “have passed all three\
  \ tests!\\n\\n”\n    << “You exit the labyrinth and “\n    << “confront the evil\
  \ wizard.\\n\\n”\n    << “He tries to turn you into a frog,”\n    << “ but you manage\
  \ to evade.\\n”\n    << “With one swing of your “\n    << “sword it is over.\\n\\\
  n”\n    << “You and the damsel live “\n    << “happily ever after.\\n\\n” “The End.\\\
  n\\n”;\n}\n\nreturn 0;\n```\n\n正如你在这个示例中看到的，程序的主体从一个 `if` 语句开始，该语句测试玩家是否选择了拿金子。如果玩家拿了金（通过输入数字\
  \ `1`），括号内的条件将求值为 `true`（`1` 等于值 `true`），玩家就可以保留金子。然而，如果玩家保留了金子，玩家就不会移动到下一个测试（因此不是第三个测试，即带有钻石的第二个房间）。换句话说，如果第一个条件求值为\
  \ `true`，则 `if-else` 结构的其余部分将被跳过。\n\n相反，如果玩家选择不拿金子，他就通过了第一个测试并进入下一个房间。如果玩家随后选择拿钻石，他就可以保留钻石，但在那种情况下，玩家将没有机会拯救农民或救援美少女。如果其中一个条件为\
  \ `true`，计算机将执行由该真条件控制的控制语句。因此，在这个示例中，如果玩家拿了钻石，计算机将执行让玩家保留钻石的代码，然后它将跳到整个结构的末尾。\n\
  \n第三个 `if` 语句与前两个相似。如果玩家已经拿了金子或钻石，就无法拯救农民。\n\n**52**\n\n**C++ Programming for the\
  \ Absolute Beginner, Second Edition**\n\n`if (killedByDragons)` 这一行是一个 `if` 语句的示例。注意，你不需要控制语句周围的括号。然而，如果你选择在\
  \ `cout` 语句周围加上括号，程序不会改变。\n\n最后是 `else` 语句。`else` 语句是默认语句，这意味着如果相关的 `if` 语句条件不为\
  \ `true`，则将执行 `else` 语句内部的代码。也就是说，如果玩家没有拿金或钻石并击败了龙，玩家——这位勇敢的骑士——就可以和美少女结婚并永远幸福地生活。\n\
  \n## 条件运算符\n\n有些条件非常简单，为它们编写完整的 `if` 语句会非常繁琐。观察以下内容：\n\n```cpp\nif (x > y) // x\
  \ 是否大于 y?\nz=y;\nelse\n    z=x;\n```\n\n这段代码段将 `x` 和 `y` 中的最小值赋值给 `z`。对于如此短的内容编写完整的\
  \ `if-else` 结构可能很痛苦。幸运的是，C++ 提供了另一种选择：条件运算符。当你使用这个运算符时，前面的示例要简洁得多：`z = (x>y) ? y\
  \ : x;`。\n\n条件运算符的通用语法如下：\n\n`condition ? expr1 : expr2`\n\n这里 `condition` 是一个有效条件，`expr1`\
  \ 和 `expr2` 是有效表达式。如果 `condition` 为 `true`，条件运算符求值为 `expr1`；否则，它求值为 `expr2`。条件运算符是一个表达式，可以用于任何可以使用其他表达式的地方。\n\
  \n你可以看到这与使用 `if` 语句相似。然而，请记住 `expr1` 和 `expr2` 是表达式而不是语句，而 `if` 语句不同，其控制语句是完整的语句。例如，你不能执行以下操作：`(x>y)?\
  \ cout << “x is greater than y.” : cout << “x isn’t greater than y.” //error`。这里有一个说明正确使用条件运算符的示例：\n\
  \n```cpp\nint soldiers = 5;\nint tanks = 10;\nint max = (b>a) ? b : a;\nint min\
  \ = (b<a) ? b : a;\n```\n\n**Chapter 3 • Making Choices with Control Statements\
  \ 53**\n\n```cpp\ncout << “The largest value is: “ << max << “\\n”;\ncout << “The\
  \ smallest value is : ” << min << “\\n”;\n```\nOutput:\nThe largest value is: 10\n\
  The smallest value is : 5\n\n## 使用 switch 语句\n\n第二种选择语句是 `switch` 语句。许多程序员试图避免 `switch`\
  \ 语句，但如果使用当，它可以是一个强大的工具。\n\n想象你正在编写一个显示有六个选项的游戏。响应的一种方法是连续使用六个 `if` 语句。更好的方法是使用\
  \ `if-else if-else` 结构。\n\n`switch` 语句是一个更简单的解决方案。它允许将一个变量与某些值进行测试，并对每个值做出不同的响应。这里是\
  \ `switch` 语句的通用语法：\n\n```cpp\nswitch(expression)\n{\ncase expr1:\n    controlledStatements1\n\
  \    break;\ncase expr2:\n    controlledStatements2\n    break;\ncase expr3:\n \
  \   controlledStatements3\n    break;\n}\n```\n\n这里的 `expression`、`expr1`、`expr2`\
  \ 和 `expr3` 是你想测试的变量或表达式。我们很快会讨论 `break` 语句。这种语法等同于 `if-else if` 结构，意味着：\n\n```cpp\n\
  if (expression == expr1)\n    controlledStatements1\nelse if (expression == expr2)\n\
  \    controlledStatements2\nelse if (expression == expr3)\n    controlledStatements3\n\
  ```\n\n**54**\n\n**C++ Programming for the Absolute Beginner, Second Edition**\n\
  \n你可以看到 `if-else if` 结构会有多么不便。当 `switch` 语句执行时，计算机会遍历每个 `case` 并测试 `expression`\
  \ 是否等于 `exprN`（其中 `N` 是任何数字）。如果相等，`case` 之后的内容将一直执行，直到遇到 `break` 关键字。如果没有任何测试为真，整个\
  \ `switch` 语句什么都不做。\n\n`break` 关键字对你来说是新的。它让程序离开最近的 `switch` 语句或语句。如果 `break` 关键字没有在\
  \ `switch` 语句或语句内，当你尝试编译时会发生语法错误。`break` 关键字在这里是可选的。不久你将学会遗漏它的影响，但现在，请把它放在每个 `case`\
  \ 的结尾。\n\n现在你已经通过了这些混乱的定义，是时候看一个示例了：\n\n```cpp\nint menuChoice = 3;\nswitch(menuChoice)\
  \ {\ncase 1:\n    cout << “You chose 1!\\n”;\n    break;\ncase 2:\n    cout << “You\
  \ chose 2!\\n”;\n    break;\ncase 3:\n    cout << “You chose 3!\\n”;\n    break;\n\
  case 4:\n    cout << “You chose 4!\\n”;\n    break;\n}\ncout << “You are now out\
  \ of the switch statement!\\n”;\n```\nOutput:\nYou chose 3!\nYou are now out of\
  \ the switch statement!\n\n从输出可以看出，程序选择了正确的 `case` 语句并执行了它。所有其他 `case` 语句都被忽略了。\n\
  \n注意并不是每个 `case` 语句都需要 `break` 语句（有时没有它反而有用）。观察以下示例：\n\n**Chapter 3 • Making Choices\
  \ with Control Statements 55**\n\n```cpp\nint choice;\ncout << “Please enter a number:\
  \ “;\ncin >> choice;\ncout << “\\n”;\n\nswitch (choice)\n{\ncase 1:\ncase 2:\ncase\
  \ 3:\n    cout << “You chose 1, 2, or 3.\\n”;\n    break;\ncase 4:\n    cout <<\
  \ “You chose 4!\\n”;\ncase 5:\n    cout << “You chose 4 or 5.\\n”;\n    break;\n\
  }\n```\nOutput (当用户输入 1 时):\nPlease enter a number: 1\nYou chose 1, 2, or 3.\n\n\
  Output (当用户输入 4 时):\nPlease enter a number: 4\nYou chose 4!\nYou chose 4 or 5.\n\
  \n**The default Case**\n\n\n\n\n\n在 `switch` 语句中，你可能并不总是考虑到所有可能的值，或者你可能想对许多情况执行相同的操作。C++\
  \ 为 `switch` 语句提供了一个等同 `else` 语句的机制，称为 `default` 语句。`default` 语句与 `case` 语句相似，但它没有需要测试的值。`default`\
  \ 语句的语法如下：\n\n```cpp\ndefault:\ncontrolledStatements\nbreak;\n```\n\n如果遇到 `default`\
  \ 语句，`controlledStatements` 将自动执行。`default` 语句没有 `case` 语句那样的测试。你必须将 `default` 语句放在\
  \ `case` 语句列表的末尾。这是一个示例：\n\n**56**\n\n**《C++ Programming for the Absolute Beginner,\
  \ Second Edition》**\n\n```cpp\nint choice;\ncout << “Please enter a number: “;\n\
  cin >> choice;\nswitch (choice)\n{\ndefault:\ncout << “\\nYou chose “ << choice\
  \ << “\\n”;\n}\n```\n\n输出：\n\n```\nPlease enter a number: 5\nYou chose 5\n```\n\n\
  \n## 使用布尔运算符\n\n在第 2 章中，我们注意到 `Boolean` 类型能够持有两个可能值之一：`true` (1) 和 `false` (0)，并且所有的条件语句都求值为一个\
  \ `Boolean` 值。许多操作数可以决定条件的布尔值（条件为真还是假）；这些操作数被称为布尔操作数。你可以使用这些操作数来形成条件（求值为 `true`\
  \ 或 `false` 的表达式）。在本节中，我们将逐一讨论这些操作数，以便你能够根据需要使用其中任何一个。\n\n## 等价运算符\n\n最简单的布尔运算符是等价运算符。等价运算符（`==`，即两个等号）是一个二进制运算符，这意味着它接受两个操作数，左右各一个。该运算符的通用语法为：\n\
  \n```\noperand1 == operand2\n```\n\n其中 `operand1` 和 `operand2` 是两个操作数。如果两个操作数的值（即它们包含的数据位模式）相同，则该运算符求值为\
  \ `true`。\n\n这里有一个示例可以帮助理解。如果你之前声明的变量如下：\n\n```cpp\nlong elves = 8;\nint dwarves\
  \ = 8;\n```\n\n你可以像这样在条件中使用它们：\n\n```cpp\nif (elves == dwarves) //true\nif (dwarves\
  \ == 8) //true\nif (dwarves == 0) //false\nif (dwarves == elves) //true\n```\n\n\
  **第 3 章 • 使用控制语句进行选择 57**\n\n上述条件中除第三个外，每个条件都求值为 `true`。但等一下！你可能会说 `elves` 和 `dwarves`\
  \ 是两种不同的数据类型（整型和长整型），它们的位模式不能相同，这确实如此，但 C++ 足够聪明可以考虑到这一点。在执行期间（运行时间），当遇到第一个条件时，程序会将\
  \ `dwarves` 转换（强制类型转换）为 `long` 类型（语句涉及的最大数据类型），然后比较值。例如，如果正在比较一个 `double`（8 字节）和一个\
  \ `int`（4 字节），计算机将首先将 `int` 转换为 `float`，然后比较这两个者。第三个条件求值为 `false`，因为 `dwarves` 的值不是\
  \ 0；它是 8。\n\n等价运算符是左结合的，这意味着如果一个语句中存在多个等价运算符，这些运算符将从左到右求值。例如，如果你有这样的条件：\n\n```cpp\n\
  if (dwarves == elves == dragons)\n```\n\n`dwarves` 首先与 `elves` 比较。该比较求出的值（`true`\
  \ 或 `false`）将与与变量 `dragons` 进行比较。这个比较决定了整个表达式的结果。\n\n不要将等价运算符（`==`）与赋值运算符混淆，**陷阱**，后者只有一个等号（`=`）。赋值运算符使赋值运算符左侧变量的值与右侧的值相同。等价运算符测试两个操作数是否相同，但不会改变它们。初学者混淆它们是很常见的。换句话说，不要让你对这些符号的已知知识阻碍了你正在学习的内容。\n\
  \n### 引入不等于运算符\n\n等价运算符的对面是不等于运算符（`!=`）。该运算符是二进制的，并且也是左结合的。不等于运算符的语法与等价运算符几乎相同：\n\
  \n```\nexpr1 != expr2\n```\n\n`expr1` 和 `expr2` 是有效的表达式。由该运算符形成的表达式是一个条件。\n\n如果\
  \ `expr1` 和 `expr2` 不相等，则该运算符求值为 `true`。如果两个表达式等价，则它求值为 `false`。例如，如果你声明了如下两个变量：\n\
  \n```cpp\nint plasmaGun = 50;\nint rifle = 10;\n```\n\n你可以像这里所示配合不等于运算符使用它们：\n\n\
  **58**\n\n**《C++ Programming for the Absolute Beginner, Second Edition》**\n\n```cpp\n\
  if (plasmaGun != rifle) //true\nif (plasmaGun != 50) //false\nif (rifle != 0) //true\n\
  ```\n\n## 小于和大于运算符\n\n小于（`<`）和大于（`>`）符号在计算机中的作用与它们在四年级数学中的作用几乎相同。例如，`3 < 4` 求值为\
  \ `true`，因为 `3` 小于 `4`。大于符号也是如此。查看以下变量及其求值：\n\n```cpp\nint elves = 4;\nint dwarves\
  \ = 5;\nif (elves < dwarves) //true\nif (dwarves > elves) //false\n```\n\n小于运算符和大于运算符都是二进制的，且是左结合的。\n\
  \n例如，以下代码可能并不如你认为的那样：\n\n```cpp\nif (0 < x < 99)\n```\n\n如果你数学记得很好，你可能会认为这在测试 `x`\
  \ 是否在 0 到 99 之间。然而，事实并非如此。首先，`x` 与 `0` 比较。无论该比较求值为什么（`true` 或 `false`），随后都会与 `99`\
  \ 进行比较。因为 `true` (1) 和 `false` (0) 都小于 99，因此该条件始终求值为真，无论 `x` 的值如何。\n\n## 与等价运算符合并\n\
  \n你可能也曾在数学中遇到过小于等于和大于等于符号。在 C++ 中，它们的写法略有不同，但仍然存在。不是在小于或大于符号下方，而是在后面加上一个等号。因此，大于等于运算符是\
  \ `>=`，小于等于运算符是 `<=`。\n\n这些运算符的工作与小于和大于运算符完全相同，不同在于如果被比较的两个值相等，运算符也会返回真。这里有一些示例：\n\
  \n```cpp\nif (5 <= 5) //true\nif (6 >= 7) //false\nif (1 <= 8) //true\n```\n\n就像小于和大于运算符一样，大于等于和小于等于运算符都是二进制的，且是左结合的。\n\
  \n## 逻辑或运算符\n\n逻辑或（`||`）是一个二进制运算符。如果一个操作数求值为 `true`，它将返回 `true`。在对或运算符求值之前，或语句的两边必须首先求值为布尔形式（`true`\
  \ 或 `false`）。\n\n表 3.1 显示了真值表的第一个示例（列出操作数的所有可能值，以及运算符求值的对应结果）。第一列列出第一个操作数的值（为了方便起见称为\
  \ `A`），第二列显示第二个操作数的值（称为 `B`），第三列显示 `A||B` 的值。\n\n**表 3.1**\n\n**或运算符的真值表**\n\n**A\
  \ 的值**\n\n**B 的值**\n\n**A||B 的值**\n\nTrue\n\nTrue\n\nTrue\n\nTrue\n\nFalse\n\nTrue\n\
  \nFalse\n\nTrue\n\nTrue\n\nFalse\n\nFalse\n\nFalse\n\n\n\n\n表 3.1 包含了操作数值所有可能的组合。以下是带有\
  \ `or` 语句的条件示例及其求值结果：\n\n```cpp\nif (true || false) //true\nif ((2>3) || false)\
  \ //false\nif ((3*5) < 90 || (3<5)) //true\n```\n\n`or` 运算符也是左结合的。然而，在一个语句中使用多个\
  \ `or` 运算符并不总是像使用小于和大于运算符那样简单。如果操作数中任何一个为 `true`，那么整个条件都将为 `true`。\n\n这意味着执行你代码的计算机可以进行短路运算。短路是指计算机意识到它不需要执行语句的剩余部分。例如，如果程序遇到一个包含\
  \ `or` 操作数的条件，且第一个操作数为 `true`，则程序就无需评估第二个操作数。它会跳过第二个操作数，因为它知道无论第二个操作数是什么，整个条件都将为\
  \ `true`。\n\n60\n\n《初学者 C++ 编程》（第二版）\n\n### and 运算符\n\n`and` 运算符与 `or` 运算符类似。它也是一个二元运算符，并且是左结合的。\n\
  \n为了让 `and` 操作数结果为 `true`，两个操作数都必须为 `true`。`and` 运算符用两个和符号（&&）表示。表 3.2 显示了 `and`\
  \ 运算符的真表。\n\n```cpp\nif (true && true) //true\nif ((3<4) && (3<5)) //true\nif ((99>\
  \ -32) && (-32>0.11)) //false\n```\n\n**表 3.2：and 运算符的真表**\n\n| A 的值 | B 的值 | A&&B\
  \ 的值 |\n| :--- | :--- | :--- |\n| True | True | True |\n| True | False | False |\n\
  | False | True | False |\n| False | False | False |\n\n### not 运算符\n\n`not` 运算符\
  \ (`!`) 将布尔值变为其反布尔值——例如将 `true` 变为 `false`，将 `false` 变为 `true`。它是一个一元运算符，这意味着它只接受一个操作数。\n\
  \n表 3.3 显示了 `not` 运算符的真表。\n\n以下是 `not` 运算符的一些示例：\n\n```cpp\nif ( !true) // false\n\
  if ( !(2>3)) //true\nif ( !( (2>3) || (3>2) ) ) //false\n```\n\n**表 3.3：not 运算符的真表**\n\
  \n| A 的值 | !A 的值 |\n| :--- | :--- |\n| True | False |\n| False | True |\n\n第 3 章\
  \ • 使用控制语句进行选择 61\n\n### 遵循运算顺序\n\n当一个表达式中包含多个运算符时，计算机必须确定执行它们的顺序。幸运的是，运算符是按照一种称为“运算顺序”的标准顺序执行的。\n\
  \n你可能对这个标准很熟悉。`BEDMAS` 这个术语听起来熟悉吗？它是小学教学运算顺序时使用的术语，如下所示：\n\n- 括号 (Brackets)\n- 指数\
  \ (Exponents)\n- 除法/乘法 (Division/Multiplication)\n- 加法/减法 (Addition/Subtraction)\n\
  \n这个列表被称为优先级列表。列表顶部的项目优先级最高，底部的项目优先级最低。如果两个运算符位于列表的同一层，则认为它们具有相同的优先级。例如，如果你有一个数学表达式，如\
  \ `(3+7*3)/6-2`，你可以使用优先级列表来确定如何评估该表达式。\n\n首先，所有的括号（列表顶部的操作；实际上是圆括号）被评估。这涉及评估括号内的所有内容。首先要评估的是表达式\
  \ `3+7*3`。这个表达式中有两个运算符：乘法和加法。因为乘法在列表位置较高，所以先评估它，然后是加法，得到 `24`。剩余表达式为 `24/6-2`。接下来，由于除法和乘法处于同一级，它们从左到右评估。表达式随后变为\
  \ `4-2`。最终答案是 `2`。\n\n| 运算符 | 名称 |\n| :--- | :--- |\n| `::` | | 作用域解析运算符 |\n| `lvalue++`\
  \ | 后置递增 |\n| `lvalue--` | 后置递减 |\n| `sizeof(expr)` | sizeof 运算符 |\n| `++lvalue`\
  \ | 前置递增 |\n| `--lvalue` | 前置递减 |\n| `*` | 乘法 |\n| `/` | 除法 |\n| `%` | 取模 |\n| `+`\
  \ | 加法 |\n| `-` | 减法 |\n| `<` | 小于 |\n| `<=` | 小于等于 |\n| `>` | 大于 |\n| `>=` | 大于等于\
  \ |\n| `==` | 等 |\n| `!=` | 不等于 |\n| `&&` | 逻辑与 |\n| `||` | 逻辑或 |\n| `? :` | 三元运算符\
  \ |\n\nC++ 有一个类似的优先级列表（见表 3.4）。在表 3.4 中，`expr` 是任何有效的 C++ 表达式，`lvalue` 是任何值可以改变的标识符，`global`\
  \ 是任何变量。如你所示，这些规则比简单的 `BEDMAS` 更复杂，但在很短时间内，这个列表将成为你的本能。学会喜欢它，但要避免编写依赖于此的复杂代码。\n\n\
  你可以在条件语句中使用所有上述的运算符。你甚至可以让条件语句跨多行。然而，这样做可能不是一个好主意，因为条件语句可能会变得变得可读。相反，如果你有一个长的多行条件语句，请尝试将其拆分为多行。\n\
  \n62 《初学者 C++ 编程》（第二版）\n\n**表 3.4：运算顺序**\n\n例如，以下算法计算整数 `k` 是否在两个数字之间。第一个数字是从 1\
