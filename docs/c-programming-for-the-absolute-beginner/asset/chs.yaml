  \n## 第 7 章\n\n## 类之间的关系\n\n正如我们在第 5 章“软件设计：面向对象编程”中所提到的，类倾向于对概念或事物建模。然而，我们还没有提到这些概念或事物往往具有某些关系。与其他关系一样，这些关系有助于理清并为世界提供逻辑顺序。\n\
  \n当你为程序设计类时，请务必关注这些关系，无论是为了方便还是逻辑。在本章中，你将学习如何在代码中表达这些关系：\n\n* 组合 (Composition)\n\
  * 继承 (Inheritance)\n\n## 通过组合组合类\n\n让我们假设一下，你正在设计一款电脑游戏。你决定需要的类之一是 `Weapon` 类，用于表示游戏中可能遇到的任何武器。也许\
  \ `Weapon` 类看起来像这样：\n\n```cpp\nclass Weapon\n{\nint damage;\n# 174\n**《初学者 C++ 编程（第二版）》**\n\
  int cost;\npublic:\nWeapon(int theDamage, int theCost);\n// ... 其他有用方法\n};\n```\n\
  \n这里没有什么特别兴奋的。自然，你想要的另一个类是 `Player` 类，用于表示玩家。在这一点，你意识到玩家需要一把武器。你可能已经猜到了，但我们还没有正式讨论过如何在代码中表示这种“拥有”（has-a）关系。`Player`\
  \ “拥有”一个 `Weapon`。\n\n那些花时间分析类之间不同关系的人似乎喜欢给这些关系起新名字。因如此，在代码中表示“拥有”关系的技术有很多名称：组合、聚合、分层、包含或嵌入。我们将保持简单，称之为“组合”。\n\
  \n好了，我们有了一个问题，也有了解决方案的名称。现在，我敏锐的读者，是时候学习到底什么是组合了。我们将从简单展示组合在 `Player` 类中什么样开始：\n\
  \n```cpp\nclass Player\n{\nWeapon myWeapon;\n// ... 类的其余部分\n};\n```\n\n正如你所见，`Player`\
  \ 类中包含了一个 `Weapon` 对象。`myWeapon` 是 `Player` 类的成员变量。这就是组合，简单直接。`myWeapon` 变量的生命周期和作用域局限于每个\
  \ `Player` 对象。这实际上非常简单且直观。\n\n## 引入继承\n\n随着你的游戏的扩展，仅用一个类表示所有类型的武器会很快变得不现实且笨拙。你可能有不同类型的武器，例如投射武器、近战武器和魔法武器。每种类型的功能都略有不同，因此我们在上一节中开始的简单\
  \ `Weapon` 类不再足够。\n\n你可能会想到的第一个解决方案是完全抛弃 `Weapon` 类，转而使用三个独立的武器类：\n\n# 第 7 章 • 类之间的关系\n\
  # 175\n\n```cpp\nclass ProjectileWeapon\n{\nint damage;\nint cost;\nint range;\n\
  public:\nProjectileWeapon(int theDamage, int theCost, int theRange);\n// ... 其他方法\n\
  };\n\nclass MeleeWeapon\n{\nint damage;\nint cost;\npublic:\nMeleeWeapon(int theDamage,\
  \ int theCost);\n// ... 其他方法\n};\n\nclass MagicalWeapon\n{\npublic:\nenum MagicType\
  \ { FIRE, ICE, ELECTRICAL };\nprivate:\nint damage;\nint cost;\nMagicType magicType;\n\
  public:\nMagicalWeapon(int theDamage, int theCost, MagicType theMagicType);\n//\
  \ ... 其他方法\n};\n```\n\n这初看起来看起来还可以，但存在两个主要问题。首先，有大量的重复。像 `damage` 和 `cost` 这样的成员变量在三个类中被逐字地重复。其次，现在如何进行组合？不再有一个单一的类来表示武器的概念，因此\
  \ `Player` 类必须拥有所有三种类型：\n\n```cpp\nclass Player\n{\n```\n\n\n\n\n\n```cpp\nProjectileWeapon\
  \ myProjectileWeapon;\n\nMeleeWeapon myMeleeWeapon;\n\nMagicalWeapon myMagicalWeapon;\n\
  \n// ... rest of class\n\n};\n```\n\n这种做法充其量是笨拙的。如果玩家一次只能携带一把武器，那么执行这种规定就会变得相当复杂，尤其是随着更多武器类型的加入。\n\
  \n幸运的是，`C++` 提供了一种兼得两 Solution 的方法。我们可以为每种武器类型创建一个单独的类，同时保持一个单一的武器类来表示武器的通用概念并保留所有公共代码。这种解决方案被称为继承（inheritance）。\n\
  \n继承用于表示“是一种”（kind-of）的关系。远程武器是武器的一种。当我们使用继承来实现它时，会有一个通用的 `Weapon` 类，而 `ProjectileWeapon`\
  \ 类将继承自它。`Weapon` 类被称为父类、基类或超类，而 `ProjectileWeapon` 类被称为子类、派生类或子类。\n\n## 编写继承代码\n\
  \n好了，我们有三种类型的武器，我们需要一种简洁的方法来表示它们。\n\n我们知道正确的解决方案是继承，但该如何实现呢？让我们从父类 `Weapon` 开始：\n\
  \n```cpp\nclass Weapon\n{\n\nint damage;\nint cost;\n\npublic:\nWeapon(int theDamage,\
  \ int theCost);\n// ... more methods\n};\n\nWeapon::Weapon(int theDamage, int theCost)\n\
  : damage(theDamage), cost(theCost)\n{}\n```\n\n**第 7 章 • 类之间的关系**  \n**177**\n\n\
  看起来很眼，对吧？实际上，如果你回顾组合（composition）章节，你会发现它和我们开始时的的基础 `Weapon` 类完全一样（除了增加了一个构造函数实现）。现在让我们来看看其中一个子类，`ProjectileWeapon`：\n\
  \n```cpp\nclass ProjectileWeapon : public Weapon\n{\n\nint range;\npublic:\n\nProjectileWeapon(int\
  \ theDamage, int theCost, int theRange);\n};\n```\n\n这里需要注意的关键点是代码的第一行：\n\n```cpp\n\
  class ProjectileWeapon : public Weapon\n```\n\n你之前还没有见过这种语法。这就是在 C++ 中表示继承的方式。基本上，这行代码的意思是\
  \ `ProjectileWeapon` 是 `Weapon` 的一种。这意味着 `Weapon` 类中的所有内容都自动包含在 `ProjectileWeapon`\
  \ 类中。你会发现，成员变量 `damage` 和 `cost` 没有在 `ProjectileWeapon` 类中声明，正是因为如此；它们通过继承的魔法被自动包含了！\n\
  \n现在，让我们来看 `ProjectileWeapon` 的构造函数。实现它的天真且错误的方法将如下：\n\n```cpp\n// 无法编译。ProjectileWeapon\
  \ 无法访问 Weapon 的私有成员\nProjectileWeapon:ProjectileWeapon(int theDamage, int theCost,\
  \ int theRange)\n: damage(theDamage), cost(theCost), range(theRange)\n{}\n```\n\n\
  这里的问题是 C++ 继承的一条初看起来非常奇怪的规则。子类不能访问父类的私有成员。起这似乎是一个毫无意义的规则，让事情变得复杂，但它确实有目的。通过这条规则，你可以确保\
  \ `Weapon` 类的实现细节都保留在一个地方。例如，如果你更改了 `damage` 成员的名称，就不需要搜索每个派生类中使用该成员。\n\n现在，这里是实现子类构造函数的正确方法：\n\
  \n```cpp\n// 正确的方法。调用父类的构造函数\nProjectileWeapon:ProjectileWeapon(int theDamage, int\
  \ theCost, int theRange)\n: Weapon(theDamage, theCost), range(theRange)\n{}\n```\n\
  \n**178**  \n**《初学者 C++ 编程》，第二版**\n\n如你所见，正确的方法是调用父类的构造函数，让它来处理自己私有成员的初始化。\n\n这是创建派生类的通用语法：\n\
  \n```cpp\nclass derived_class : scope_modifier base_class\n```\n\n`derived_class`\
  \ 是派生类的名称，`base_class` 是基类的名称。`scope_modifier` 可以是 `public`、`private` 或 `protected`；但对于这本书来说，你将使用\
  \ `public`。`private` 在某些非常特殊的情况下非常有用，而 `protected` 则永远不应该被使用。\n\n### 通过继承访问类成员\n\
  \n尽管派生类的成员函数可以访问内容的规则很直观，但它们对于初学者，甚至有时对于高级程序员来说也是困难的。在这一节中，我们试图尽量减少困惑并最大化你的乐趣（或至少是两者其一）。\n\
  \n首先，记住类成员有两种访问修饰符：`public` 和 `private`。实际上还有第三种访问修饰符称为 `protected`。`protected`\
  \ 只在涉及继承时起作用。如果没有继承，它和 `private` 完全一样。\n\n派生类的成员函数可以访问以下内容：\n\n- 所有全局变量。\n- 类自身的成员。\n\
  - 其基类中的所有 `public` 和 `protected` 成员。\n\n看，这没那么糟。如果你有任何疑问，只需参考这个列表。派生类对成员的访问权限几乎和基类一样多，因为派生类继承了基类的大部分功能。派生类无法访问的唯一项是基类的私有成员。\n\
  \n正如前面的列表所示，派生类可以访问基类所有的 `public` 和 `protected` 成员。然而，它不能访问私有成员。这里有一个例子：\n\n```cpp\n\
  class Base\n{\n\nint private_int;\n\nprotected:\n\nint getInt() { return private_int;\
  \ }\n};\n```\n\n**第 7 章 • 类之间的关系**  \n**179**\n\n```cpp\nclass Derived : public\
  \ Base\n{\n\n// 错误 - 无法访问 private_int\nint myFunc() { return private_int; }\n\n\
  // 正确的方法\nint myFunc() { return getInt(); }\n}\n```\n\n在这个例子中，`Derived` 类无法访问 `private_int`，因为\
  \ `private_int` 是私有的。然而，它可以访问受保护的成员函数 `getInt()`。使用基类的 `public` 和 `protected` 成员函数来访问私有数据是访问这些数据的正确方法。记住，`Derived`\
  \ 对象仍然拥有 `private_int` 成员。它只是不能直接访问它。这样你就可以更改基类的实现，而无需修改派生自它的每一个类。\n\n在几乎所有其他方面，`protected`\
  \ 访问修饰符与 `private` 完全一样。例如，如果你创建一个 `Derived` 对象，你无法访问它从基类继承的 `getInt()` 方法。这里有一个例子：\n\
  \n```cpp\nclass Base\n{\n\nint private_int;\n\nprotected:\n\nint getInt() { return\
  \ private_int; }\n};\n\nclass Derived : public Base\n{\n\nprotected:\n\nint myFunc()\
  \ { return 5; }\n\npublic:\n\nint myFunc2() { return myFunc(); }\n}\n\nint main(void)\n\
  {\n\nBase b;\n\nb.getInt(); // 错误：无法访问受保护成员\n\n**180**  \n**《初学者 C++ 编程》，第二版**\n\
  \nDerived d;\n\nd.getInt(); // 错误：无法访问受保护的继承成员\n\nd.myFunc(); // 错误\n\nd.myFunc2();\
  \ // 好的！返回 5\n\nreturn 0;\n\n}\n```\n\n### 在派生类中创建构造函数和析构函数\n\n涉及继承类的构造函数和析构函数比普通函数稍微复杂一点，因此我们将它们视为特殊情况。\n\
  \n第一条规则是：如果基类没有构造函数，或者基类的构造函数之一不需要参数，则派生类就不需要构造函数。其次，如果基类的所有的构造函数都需要参数，则派生类必须有一个构造函数，并且该构造函数必须在初始化列表中显式地调用基类的构造函数。这里有一个例子：\n\
  \n```cpp\nclass Base\n{};\n\nclass Base2\n{\n\npublic:\n\nBase2() { cout << “Hello”;\
  \ }\n};\n\nclass Base3\n{\n\npublic:\n\nBase3(int a) { cout << a; }\n};\n\nclass\
  \ Derived : public Base\n{\n\n//不需要构造函数\n};\n\nclass Derived2 : public Base2\n{\n\
  \n//不需要构造函数\n};\n\nclass Derived3 : public Base3\n{\n```\n\n\n\n\n\n```cpp\n//必须有构造函数，并且必须调用\
  \ Base3 的构造函数\n\npublic:\n\n// 正确\nDerived3() : Base3(3) {}\n\n// 错误\nDerived3()\
  \ { Base3(3); }\n\n// 错误\nDerived3() {};\n\n};\n```\n\n第三，`Derived` 类的构造函数不能在初始化列表中初始化自基类的变量，即使它具有访问这些成员的权限。它必须是使用基类的构造函数，或者在大括号（`{`\
  \ 和 `}`）中初始化相关变量。这是一个示例：\n\n```cpp\nclass Base\n{\npublic:\n    Base() : protected_int(3)\
  \ {}\n\nprotected:\n    int protected_int;\n};\n\nclass Derived : public Base\n\
  {\npublic:\n    Derived();\n};\n\n// Derived 类的构造函数\n// 正确的方法\nDerived::Derived()\
  \ : Base()\n```\n\n**182**\n**《初学者 C++ 编程指南》，第二版**\n\n{}\n\n// 也是正确的\nDerived::Derived()\
  \ : Base()\n{\n    protected_int = 2;\n}\n\n// 错误\nDerived::Derived() : Base(),\
  \ protected_int(2)\n{}\n```\n\n在 `Derived` 类构造函数的第一个版本中，基类的构造函数被调用，然后 `Derived`\
  \ 初始化它自己的变量。这是你通常会看到的写法，也是初始化派生类的正确方法。\n\n然而，第二种版本也是正确的。如果初始化在大括号内而不是初始化列表中，你就可以初始化基类的成员。\n\
  \n构造的顺序如下：首先是基类，然后是派生类。析构以相反顺序进行。派生类被销毁，然后基类被销毁。\n\n这里有一个示例说明：\n\n```cpp\n// 7.1\
  \ – 构造函数与析构函数 – Mark Lee\n#include <iostream>\nusing std::cout;\n\nclass Base\n\
  {\npublic:\n    Base() { cout << “Base’s constructor\\n”; }\n    ~Base() { cout\
  \ << “Base’s destructor\\n”; }\n};\n\nclass Derived : public Base\n{\npublic:\n\
  \    Derived() { cout << “Derived’s constructor\\n”; }\n    ~Derived() { cout <<\
  \ “Derived’s destructor\\n”; }\n};\n\nint main (void)\n{\n    Derived d;\n    return\
  \ 0;\n}\n```\n\n输出：\nBase’s constructor\nDerived’s constructor\nDerived’s destructor\n\
  Base’s destructor\n\n看，这没那么糟！如果你熟悉了所有基础知识，剩下的就很简单了。\n\n## 扩展继承\n\n**第 7 章 • 类的关系**\n\
  **183**\n**};**\n\n我们到为止所教的简单继承并不特别有用，但它是你知识成长的基础。以下概念实际上非常简单，所以如果你理解了之前的几节，接下来的内容你应该应对得游刃有余了。\n\
  \n首先，一个派生类也可以是另一个派生类的基类。通过多级派生，你可以获得继承链。继承链是派生类的序列，其中每个派生类都是其下方类的基类。这里的思想是从基类的通用概念开始，随着你在链中向下移动，变得变得越来越具体。\n\
  \n以下代码展示了这种继承结构在 C++ 中的样式：\n\n```cpp\nclass Vehicle {};\nclass LandVehicle : public\
  \ Vehicle {};\nclass Car : public LandVehicle {};\nclass HondaInsight : public Car\
  \ {};\n```\n\n与普通继承一样，构造函数从基类向下执行，析构函数则反之。例如，在之前的继承链中，顺序如下：`Vehicle` 构造函数、`LandVehicle`\
  \ 构造函数、`Car` 构造函数、`HondaInsight` 构造函数；然后是 `HondaInsight` 析构函数、`Car` 析构函数、`LandVehicle`\
  \ 析构函数和 `Vehicle` 析构函数。\n\n图 7.1 显示了 `Vehicle`继承链的概念图。注意箭头向上而不是向下。这是因为箭头显示了类访问其他类的方向。基类无法访问派生类，但派生类可以访问基类。\n\
  \n**184**\n**《初学者 C++ 编程指南》，第二版**\n\n当你调用类的方法时，计算机首先检查该类，然后是它的基类，然后是基类的基类，依此类向上一直找到，直到找到该方法。\n\
  \n一个基类下面可以有多个派生类。通过这种方式，你可以创建树状继承结构。这些结构被称为类层次结构。`MFC`（微软基金类）是一个大型高级类层次结构的示例。如果你创建高级应用程序，你将学习如何使用它。\n\
  \n**图 7.1**\n\n图中的箭头代表类访问其他类的方向。类层次结构并不极端复杂。图 7.2 显示了车辆的类层次结构如下所示。基类无法访问派生类，但派生类可以访问基类。\n\
  \n以下代码展示了这种继承结构在 C++ 中的样式：\n\n```cpp\nclass Vehicle {};\nclass LandVehicle : public\
  \ Vehicle {};\nclass WaterVehicle : public Vehicle {};\nclass Car : public LandVehicle\
  \ {};\nclass Boat : public WaterVehicle {};\nclass HondaInsight : public Car {};\n\
  ```\n\n**图 7.2**\n\n**185**\n**第 7 章 • 类的关系**\n**车辆**\n**陆地**\n**水车辆**\n**汽车**\n\
  **船**\n**HondaInsight**\n**你可以将此**\n**层次结构划分为**\n**继承链，因为**\n**7.3**\n**由许多**\n\
  **车辆组成。**\n\n## 指向基类的指针\n\n指向基类的指针可以存储任何派生对象的地址。这是一个示例：\n\n```cpp\nBase* b;\nDerived\
  \ d;\nb = &d;\n```\n\n这种能力是继承的重要部分，它使得 C++ 成为一种非常强大的语言。这种能力可能实用的一个地方是任何类型的集合。例如，你可以创建一个指向\
  \ `Vehicle` 的指针数组，这个数组可以包含任何 `Vehicle` 的子类。如果没有这个，你必须为每种类型的车辆创建一个单独的数组。\n\n你还可以编写一个接受基类指针的函数并将任何子类的地址传递给它。这是一个示例：\n\
  \n```cpp\nclass Weapon\n{\n    int cost;\n    int damage;\n\npublic:\n    Weapon(int\
  \ theCost, int damage);\n    int getCost() { return cost; }\n};\n\nWeapon::Weapon(int\
  \ theCost, int damage)\n: cost(theCost), damage(theDamage)\n{}\n\nvoid printCost(Weapon*\
  \ w)\n{\n    cout << “The cost is “ << w->getCost() << “\\n\";\n}\n\nint main(void)\n\
  {\n    ProjectileWeapon bow(5, 2, 10);\n    printCost(&bow);\n    return 0;\n}\n\
  ```\n\n输出：\nThe cost is 5\n\n**186**\n**《初学者 C++ 编程指南》，第二版**\n\n## 理解三种类型的成员函数继承\n\
  \n当你使用继承时，数据成员并不是唯一向下传递的内容。派生类还继承了基类的成员函数。然而，故事并没有就此结束。\n\n一个方法由两部分组成：接口和实现。当继承成员函数时，你可以选择继承：\n\
  \n• 接口和实现。\n\n• 接口和可选的实现。\n\n• 仅限接口。\n\n### 继承接口和实现\n\n第一种成员函数继承是最简单的：同时继承接口和实现。对于那些在所有派生类中工作方式完全相同的成员函数，你应该使用这种方法。`Weapon`\
  \ 类的 `getCost()` 成员函数就是一个很好的（虽然简单）此类函数示例。无论它是什么种类的武器，成本都以相同的方式计算。\n\n\n\n\n以下是同时继承接口和实现的方法：\n\
  \n```cpp\nclass Weapon\n{\n    int cost;\n    int damage;\npublic:\n    Weapon(int\
  \ theCost, int theDamage);\n    int getCost() { return cost; }\n};\n\nWeapon::Weapon(int\
  \ theCost, int theDamage)\n: cost(theCost), damage(theDamage)\n{}\n\nclass ProjectileWeapon\n\
  {\n    int range;\npublic:\n    ProjectileWeapon(int theCost, int theDamage, int\
  \ theRange);\n};\n```\n\n“但等一下，”你困惑地说，“这里没什么特别的！” 确实，我敏锐的读者，你说得对。同时继承接口和实现是默认的。这使其成为最简单的方法继承类型。\n\
  \n`ProjectileWeapon` 类原封不动地继承了 `getCost()` 成员函数。然后你可以像在类内部声明它的那样使用它，就像一个普通的成员函数一样：`int\
  \ main(void)`\n\n```cpp\nint main(void)\n{\n    using std::cout;\n    ProjectileWeapon\
  \ bow(5,2,10);\n    cout << “The cost is “ << bow.getCost() << “\\n”;\n    return\
  \ 0;\n}\n```\n\n### 继承接口和可选实现\n\n现在我们到了更有趣的情况。如果你希望为每个派生类为成员函数提供不同的实现，你必须将函数设为虚函数（virtual）。\n\
  \n要创建一个虚函数，请使用 `virtual` 关键字。通用语法如下：`virtual return_type function_name(argument_list);`\n\
  \n你只有在第一次声明函数时才需要在前面加上 `virtual` 关键字。如果你先声明函数稍后定义它，那么 `virtual` 关键字只需要放在声明前面。如果函数在声明的同时被定义，则将\
  \ `virtual` 关键字放在函数定义前面。\n\n你只需要在基类版本的函数前面加上 `virtual` 关键字，但你也应该在每个派生类的版本前面加上它，以便让阅读你代码的人清楚知道发生了什么。将函数设为虚会告诉计算机搜索正确的函数版本进行调用。看看下面的示例：\n\
  \n```cpp\n////7.2 - Virtual Functions - Mark Lee\n#include <iostream>\nusing std::cout;\n\
  \nclass Base\n{\npublic:\n    void Display() { cout << “Base’s Display\\n”; }\n\
  };\n\nclass Derived : public Base\n{\npublic:\n    void Display() { cout << “Derived’s\
  \ Display\\n”; }\n};\n\nclass Base2\n{\npublic:\n    virtual void Display() { cout\
  \ << “Base2’s Display\\n”; }\n    virtual void f(); // 这也是正确的\n};\n\nvoid Base2::f()\
  \ // 这里不需要 virtual\n{}\n\nclass Derived2 : public Base2\n{\npublic:\n    void Display()\
  \ { cout << “Derived2’s Display\\n”; }\n};\n\nint main ( void )\n{\n    Derived\
  \ d;\n    Base* b = &d;\n    b->Display();\n    Derived2 d2;\n    Base2* b2 = &d2;\n\
  \    b2->Display();\n    return 0;\n}\n```\n\n输出：\n```\nBase’s Display\nDerived2’s\
  \ Display\n```\n\n如从输出中可以看出，使用虚函数解决了问题。`Base` 类使用了非虚的 `Display()` 函数，所以调用了错误的函数。因为\
  \ `Base2` 的 `Display()` 是虚函数，所以对 `b2->Display()` 的调用产生了正确的输出。\n\n### 仅继承接口\n\n你在层次结构中设计的某些类作为对象时可能没有意义。例如，虽然\
  \ `Vehicle` 类作为父类来定义源自 `Vehicle` 的派生对象的通用元素效果良好，但创建一个 `Vehicle` 对象没有任何意义。\n\n另一个例子是你有一有一个形状类的层次结构，顶部有一个通用的\
  \ `Shape` 类。创建一个 `Shape` 对象是没有意义的。它是一个没有形状的形状。这些类代表了抽象概念。相比之下，`Car` 类可以表示一个实际对象。另一种可能性是创建一个\
  \ `Comparable` 类，它具有使一个对象与另一个对象进行比较所需的基础接口。如果你从这个基类派生出类，你就能保证能够比较它们。然而，从 `Comparable`\
  \ 类中创建一个对象并没有太大意义。\n\nC++ 提供了一种名为**抽象类**（abstract classes）的方法来表示这些抽象概念，而不会无意中将它们误认为是普通对象。你通过在类内部放置**纯虚函数**（pure\
  \ virtual function）来创建一个抽象类。（你不能从抽象类中创建对象。）纯虚函数是一个未实现但仅用于创建抽象类的虚函数（基类不为其提供定义）。要创建纯虚函数的语法，你只需在虚函数声明的末尾加上\
  \ `= 0`：`virtual return_type function_name(argument_list) = 0;`\n\n如果一个类的成员之一是这些纯虚函数之一（或者它没有重写来自基类的某个纯虚函数），那么该类就是一个抽象类。在\
  \ C++ 中，从抽象类创建对象是非法的。纯虚函数只是有助于确保你不会无意中尝试从该基类创建对象。基类的存在仅仅是为了为派生类提供一种结构。这里是一个示例：\n\
  \n```cpp\nclass Abstract\n{\npublic:\n    virtual void draw() = 0;\n};\n\nint main(void)\n\
  {\n    Abstract a; // 非法 - 会引起错误\n    return 0;\n}\n```\n\n如果一个类有一个抽象基类，该类可以重写所有的纯虚函数，以便它不再是抽象类。这是一个示例：\n\
  \n```cpp\n#include <iostream>\nusing std::cout;\n\nclass Abstract\n{\npublic:\n\
  \    virtual void draw() = 0;\n};\n\nclass Derived : public Abstract\n{\npublic:\n\
  \    //重写了 Abstract::draw()\n    void draw() { cout << “Hello World.”; }\n};\n\n\
  int main ( void )\n{\n    Derived d; // 合法\n    Abstract a; // 非法\n    return 0;\n\
  }\n```\n\n然而，如果派生类没有重写来自其基类的所有的纯虚函数，它就会继承这些函数并变成一个抽象类。这是一个示例：\n\n```cpp\nclass Abstract\n\
  {\n    virtual int f() = 0;\n    virtual float g(float) = 0;\n};\n\nclass Derived\
  \ : class Abstract\n{\n    int f(); // 重写了基类的纯虚函数\n    // g() 没有被重写\n};\n\nint main\
  \ (void)\n{\n    Abstract a; // 非法 - 抽象类\n    Derived d; // 也是抽象类\n    return 0;\n\
  }\n```\n\n### 创建龙王游戏\n\n当你漫游在一个巨大的王国时，一些贵族使者走了上来。“骑士，”他们说，“你必须帮助我们！”在你还没机会解释自己不是骑士之前，他们解释了情况：“一条恶龙绑架了我们的公主！你必须救她。我们太绝望了。”\n\
  \n你无法拒绝帮助，所以还没反应过来，你正骑着马去龙穴。你能击败那条龙吗？编译下面的程序就会吧。注意此程序由多个文件组成。\n\n```cpp\n8.5 - Dragon\
