  n”\n             << “[3]Run Away\\n”;\n        cin >> choice;\n    } while (choice\
  \ < 1 && choice > 3);\n    return choice;\n}\n```\n\n## 总结\n这一章是新概念的旋风。你学习了基础继承、保护访问修饰符、多重继承、虚函数和抽象类。\n\
  \n掌握并能够使用本章中的信息对于成为一名高级 C++ 程序员至关重要。如果你以后转向到其他编程语言，你会发现本章中的概念也适用于大多数此类语言。\n\n###\
  \ 挑战\n1. 创建一个武器层级结构，至少有四种武器派自一个单一父类。每个类应该包含什么数据成员？方法又呢？\n2. 设计并完全实现一个抽象的 `Shape`\
  \ 类。应该包含什么？什么又应该留给派生类？\n\n---\n\n# 第 8 章：使用模板\n如果你是从这本书的开头开始的，那么你已经走在成为专业程序员的道路上了。你已经学习了\
  \ C++ 编程的基础知识，现在准备好学习更高级的概念了。在本章中，你将学习模板，它将作为进入 C++ 标准库的跳板。你将学习标准库的一些主要组件。\n\n如果你曾经考虑过为其他程序员设计库，这一章至关重要。在本章中，你将学习如何：\n\
  * 创建类模板\n* 创建函数模板\n* 使模板的使用变得不可\n* 使用标准库\n* 使用字符串\n* 使用 vector\n\n### 创建模板\n想象你是一位著名的武器制造者，因卓越的武器闻名于世。一位国王来到你这里，要求制作一把可以射出任何种类箭的弓。你愚蠢地同意了制作这样一把弓，却没有意识到这项任务是不可能的。哪一把弓能射出每种箭呢？遗憾的是，弓明天就要交了。但在研究一些关于武器制造的古籍时，你发现了一个名为“模板”的魔法咒。“在这个武器上施此咒，”书上写道，“它将变得完全全能，能够处理任何弹药。”你得救了！\n\
  \n你将在明天之前完成弓。\n\n在 C++ 中，模板允许你泛化类或函数，使其不使用特定的数据类型，正如你可能在我们新造的故事中使用“模板”来制作一把能处理所有箭的弓一样，你可以在\
  \ C++ 中使用模板创建一个可以处理所有数据类型的函数或类。\n\n例如，我们在第四章讨论的 `add` 函数的每个版本都是针对特定数据类型的。但通过模板，无论你处理的是什么数据类型，本质上都在执行相同的操作。因此，没有理由不只编写一次这种操作。通过这种方式，模板允许你泛化操作以避免重复编程。\n\
  \n现在，让我们与你分享模板编程的基础知识。\n\n### 创建类模板\n类模板是利用模板来使类更通用的类。\n\n好吧，这并没有提供太多的启发，不是吗？\n\n\
  首先，看看这个 `Storage` 类，它存储一个整数数组（不使用模板）：\n\n```cpp\nclass Storage\n{\n    int* data;\n\
  \    int numElements;\n\npublic:\n    Storage();\n    Storage(int* array, int num)\
  \ :\n    data(array), numElements(num) {}\n    Storage(int num) { data = new int[num];\
  \ }\n    void AddElement(int newElement);\n    int ElementAt(int location);\n};\n\
  ```\n\n\n\n\n\n### 201\n\n```cpp\nint RemoveElementAt(int location);\n\n~Storage();\n\
  \n};\n```\n\n该类存储了一个整数数组，并提供了添加、查看和删除元素的方法。但如果你想存储浮点数或字符，该怎么办呢？你必须复制前面的代码并将整数改为浮点数或字符，这将是非常无效的。或者，你可能会以某种方式将想要存储的数据类型作为参数传递。\n\
  \n然后你可能需要一个 `switch` 语句来处理每种情况。这将迅速变得复杂且难以管理。\n\n解决问题的问题的方案是使用模板。`Storage` 类的模板版本可以存储任何类型的数据。模板是将数据类型作为参数传递的一种简单方法，而不会让方法变得复杂难以管理。当使用模板时，`Storage`\
  \ 类如下：\n\n```cpp\ntemplate<class T> class Storage\n{\n\nT* data;\nint numElements;\n\
  \npublic:\nStorage();\nStorage(T* array, int num) :\ndata(array), numElements(num)\
  \ {}\nStorage(int num) { data = new int[num]; }\nvoid AddElement(T newElement);\n\
  T ElementAt(int location);\nT RemoveElementAt(int location);\n~Storage();\n\n};\n\
  ```\n\n如你所见，这段代码相当不同。你现在可能觉得它有点陌生，但很快你就会变得熟悉。唯一变化的地方是将 `int` 替换为 `T`（但并不是所有的 `int`\
  \ 实例都如此），并在类之前添加了 `template<class T>`。\n\n`T` 的用法很容易解释。它们充当占位符，取决于类的用户决定存储哪种类型的数据。因此，如果用户决定存储整数，所有\
  \ `T` 的实例都将是 `int`。某些 `int` 的用法保留了，因为它们并不是所有数据的一部分。其中一些只是为了元素的数量（这应该始终是一个整数值）。\n\
  \n### 202\n\n**《C++ Programming for the Absolute Beginner, Second Edition**\n\n\
  代码模板 `template<class T>` 告诉计算机该类正在使用模板，并且 `T` 被用作存储数据类型的占位符。即使你写的是 `class T`，`T`\
  \ 也不一定是一个类。它可以是任何数据类型。\n\n另一种思考模板的方法是将其视为参数列表。前面的示例有一个参数，`class T`。当 `Storage` 类被使用时，用户将要存储的数据类型“几乎”作为一个参数传递。然后\
  \ `T` 被填充为这个数据类型。如你所见，`class T` 就像一个参数声明。在这里，关键字 `class` 以一种不同的方式使用，意为“数据类型”。由于这个原因，如果你愿意，可以使用关键字\
  \ `typename` 而不是 `class`（它们在这里的意思完全相同）。\n\n在第一行声明 `T` 之后，你可以像使用任何其他类型名（如 `int` 或\
  \ `float`）一样在类内部任何地方使用它。这意味着你可以声明新变量并创建指针、数组或任何你可能使用类型名的东西。\n\n当你从此类模板创建对象时，你必须指定你打算存储什么类型的数据。这里有一个存储整数的示例：\n\
  \n```cpp\nStorage<int> intStore;\n```\n\n如你所见，为模板指定数据类型就像传递参数一样。\n\n当创建 `intStore`\
  \ 时，`int` 替换了类中所有的 `T`。你可以像使用任何其他类的名称一样使用 `Storage<int>`。同样，你可以存储任何其他类型的数据：\n\n\
  ```cpp\nStorage<float> floatStore; //存储浮点数\nStorage<string> stringStore; //存储字符串\n\
  Storage<Shape*> shapeStore; //存储指向 Shape 的指针\n```\n\n查看创建类模板的语法：\n\n```cpp\ntemplate<class\
  \ TypeName> class ClassName\n{\nClassDeclaration\n};\n```\n\n在这里，`TypeName` 是数据类型的任意占位符，`ClassName`\
  \ 是类的名称，`ClassDeclaration` 是类的声明（就像第 5 章“与 OOP 搏斗”中的普通类一样）。请记住，`TypeName` 可以是任何有效的标识符，但它通常是一个大写单字母，例如\
  \ `T` 或 `C`。\n\n如果方法在类模板外部实现，你必须再次对其使用模板语法。以下是在类模板外部实现的方法的语法：\n\n**第 8 章 • 使用模板**\n\
  \n### 203\n\n```cpp\ntemplate<class TypeName> returnType ClassName<TypeName>::methodName(args)\n\
  {\nmethodImplementation\n}\n```\n\n在这里，`TypeName` 是参数名称（例如 `T`），`methodImplementation`\
  \ 是方法的实现。\n\n由于构造函数的实现使用了两次类的名称名称（一次用于类名，一次用于方法名），你通常需要在每次使用类名后跟上 `<TypeName>`。然而，这有点冗余，因此对于方法名，你不需要这样做（但如果你喜欢也可以这样做）。以下是在类模板外部实现构造函数的语法：\n\
  \n```cpp\ntemplate<TypeName> ClassName<TypeName>::ClassName<TypeName>(args)\n{\n\
  constructorImplementation\n}\n```\n\n或者你也可以使用这种更常见的语法：\n\n```cpp\ntemplate<TypeName>\
  \ ClassName<TypeName>::ClassName(args)\n{\nconstructorImplementation\n}\n```\n\n\
  这两种方法完全相同。这取决于个人偏好。第一种方法更正式，但第二种方法更常见。\n\n如果你正在创建一个类模板，我们建议先针对一个**注意** 特定的数据类型设计该类。然后你可以在使用模板进行泛化之前解决掉所有的\
  \ Bug 和设计缺陷。这种方法让编程变得容易得多。\n\n### 使用模板参数\n\n括号内的声明（例如 `<class T>`）是模板参数。正如你所看到的，模板参数的行为与函数参数几乎相同。与函数参数一样，你可以有多个模板参数。事实上，你可以拥有你需要的数量的模板参数。\n\
  \n多个模板参数实用的一个例子是在创建关联数组时。关联数组类似于普通数组，不同之处在于每个元素有两个不同的对象。其中两个一个可能是字符串，另一个可能是代表字符串在文本某部分出现次数的整数。将关联数组想象成具有相同元素数量的并排数组。一个关联数组类可能如下所示：\n\
  \n```cpp\ntemplate<class T, class C> class AssociativeArray;\nAssociativeArray<string,\
  \ int> wordFrequency;\n```\n\n此外，模板参数不需要是通用类型。它可以是特定的类型，例如整数或浮点数。这里有一个在模板参数中使用特定数据类型的示例：\n\
  \n```cpp\ntemplate<class T, int i> class Array\n{\nT data[i];\n//...\n};\n```\n\n\
  你可以按照如下方式使用此类模板：\n\n```cpp\nArray<int, 10> intArray;\n```\n\n这段代码片段创建了一个包含十个整数的数组。注意数组是如何根据模板参数给出的尺寸创建的。这样做可能会令人困惑。你不能从函数参数创建动态大小的数组，因为数组必须用常量大小声明（自由存储上的数组除外）。函数参数不一定是常量的；但模板参数必须是。模板参数可以是常量或指针。此外，在类内部使用的模板参数必须被视为常量（你不能更改它的值）。\n\
  \n这是一个说明这些概念的示例：\n\n```cpp\nint i = 10;\n//错误 - 模板参数使用了非常量\nArray<int, i> intArray;\n\
  //正确 - 使用了常量\nArray<int, 10> intArray;\n```\n\n编译器必须在程序实际运行之前知道所有创建数组的大小。如果你提供一个常量表达式，例如\
  \ `20 - 10`，编译器将能够计算该表达式，因此使用常量表达式是可以接受的。\n\n204\n\n**《C++ Programming for the Absolute\
  \ Beginner, Second Edition**\n\n205\n\n\n\n\n然而，编译器在编译模板时只能检查语法错误。换句话说，只有当你使用特定数据类型使用该模板时，编译器才能检查某个特定类型在模板代码中是否有效。你使用特定类型使用模板的时间被称为**实例化点**（point\
  \ of instantiation）。\n\n假设你设计了一个类模板，并在无意中假设该类型将始终是字符串，因此使用了 `c_str()` 函数。这样做可能会导致问题。如果使用\
  \ `string` 作为类型创建了对象，则不会发生任何错误。然而，如果数据类型不是字符串，就会出现问题。虽然这类假设并不总是会带来问题，但它们往往会产生，因此请务必留意这些问题。如果你设计了一个仅适用于某些类型的类模板，请务必向用户非常清晰地说明这一条件。\n\
  \n### 创建函数模板\n\n函数也可以以类似于类使用的方式使用模板。一个很好的例子是第 4 章介绍的类似 `add` 的函数。诚然，`add` 是一个微不足道的函数（因为它只相加了两个数字），但我们可以轻松地将这种函数概念扩展到更复杂的内容。\n\
  \n就像处理类模板一样，你通过在函数开头放置 `template` 关键字和参数列表来创建一个函数模板。函数模板与重载函数相似，不同之处在于你可以创建一个函数模板来处理所有情况，而不是为每种情况创建一个不同的函数。以下是\
  \ `add` 函数使用模板后的可能样子：\n\n```cpp\ntemplate<class T> T add (T a, T b)\n{\n  return\
  \ a + b;\n}\n```\n\n遗憾的是，这个 `add` 函数并不是通用的。你不能提供两个不同类型的参数。在本章稍后的“重载函数模板”一节中，你将学习提供几乎任何参数并获得所需结果的方法。\n\
  \n你可以像使用所有其他数据类型一样，在函数内部任何地方使用模板参数。这是一个示例：\n\n```cpp\ntemplate<class T> void swap(T*\
  \ a, T* b)\n{\n  T temp = *a;\n  *a = *b;\n  *b = temp;\n}\n```\n\n此函数交换两个指针的值。以下是你可能如何使用该函数的示例：\n\
  \n```cpp\nint x = 5;\nint y = 6;\nswap<int>(&x, &y);\n```\n\n`x` 现在包含值 6，而 `y` 包含值\
  \ 5。<algorithm>` 包含了此函数的标准库版本，称为 `swap`，它接受两个相同类型的参数（无论是什么类型，因为标准库的 `swap` 也是一个函数模板）。\n\
  \n## 理解参数解析\n\n函数模板与类模板并不完全相同。对于函数模板，调用函数时并不总是需要提供模板参数。有时，计算机仅可以根据你传递的参数推断出参数应该是什么。这是一个示例：\n\
  \n```cpp\nadd(5,3);\n```\n\n勇敢的读者，不要被欺骗；这不是第 4 章中的 `add` 函数。这里调用的是带有模板的版本。因为两个参数都是整数，计算机可以推断出参数（`T`）应该是\
  \ `int`。现在，你正在进入真正编程的领域；但到目前，你甚至不需要知道 `add` 函数有一个模板。你只需要像调用其他函数一样调用它即可。\n\n如果前一个函数的参数不是那么明确（例如，如果一个是整数而另一个是浮点数），编译器将返回错误。计算机的智能是有限，它们无法完全决定是将整数转换为浮点数，还是将浮点数转换为整数。如果你选择不为函数模板调用提供参数，请确保参数清晰地指定了参数应该是什么。\n\
  \n此外，如果所有参数都没有包含在参数列表中（例如，一个参数仅用于返回类型），则你必须为函数调用提供完整的参数列表。\n\n现在，作为一个案例研究，你已经准备好创建一个为你进行类型转换的函数。（在第\
  \ 2 章中，我们将类型转换定义为将数据从一种类型转换为另一种类型的行为，并保持几乎相同的值。）\n\n此函数是一个参数未在参数列表使用的示例，如下所示：\n\n\
  ```cpp\ntemplate<class C, class T> C cast(T a)\n{\n  return (C)a;\n}\n```\n\n只有当普通转换对参数有效时，此函数才起作用。以下是你可能使用此函数的的一些示例：\n\
  \n```cpp\ncout << cast<int, float>(3.5); //将 3.5 转换为 3\ncout << cast<float, int>(9);\
  \ //将 9 转换为 9.0\n//error - 无法将 int 转换为 char*\ncout << cast<char*, int>(35769);\n\
  ```\n\n在这种情况下，你可以根据函数参数推断出第二个模板参数是什么。然而，与默认函数参数一样，你只能在参数列表的末尾省略模板参数。例如，如果有三个参数，你可以漏掉最后一个、最后两个或全部三个，只要它们是可以被推断的。以下是你如何省略参数的示例：\n\
  \n```cpp\n//将 3 转换为 3.0 - 第二个参数推断为 int\ncout << cast<float>(3);\n//将 3.5 转换为 3 -\
  \ 第二个参数假设为 float\ncout << cast<int>(3.5);\n//error - 转换成什么？\ncout << cast(35);\n\
  ```\n\n## 模板特化\n\n有时，你可能希望函数模板针对特定类型的数据以特殊方式工作。某种数据类型可能是其他所有类型遵循的规则的例外。在这种情况下，你必须为该特定类型提供不同的模板版本。这个不同的版本被称为**特化**（specialization）。每当使用相关数据类型时都可以使用它。\n\
  \n在本章稍后的“使用 Vector”一节中，你学习了 vector。vector 是一个类模板。以下是 vector 类模板的基本声明：`template<class\
  \ T> class Vector;`。\n\n这个声明看起来非常简单。它只是一个普通的类模板。然而，vector 类模板除了这个更通用的声明外还有一个特化。vector\
  \ 必须以某种方式特殊处理 void 指针数组。以下是 `Vector` 类特化的声明：\n\n```cpp\ntemplate<> class Vector<void*>;\n\
  ```\n\n前面的代码本质上表示 `Vector` 的特化，每当使用 `void*` 作为参数类型时就使用它。也就是说，当你使用 `void*` 作为参数时，将使用特化版本。特化基本上接管。如果你使用任何其他类型，将使用第一个版本。以下是使用特化的示例：\n\
  \n```cpp\n#include <iostream>\n#include <string>\n\ntemplate<class T>class SayHi\n\
  {\n  T data;\n  public:\n  SayHi(T a) : data(a) {}\n  void display() { cout << data\
  \ << endl; }\n};\n\ntemplate<> class SayHi<string>\n{\n  string data;\n  public:\n\
  \  SayHi(string a) : data(a) {}\n  void display() { cout << data.c_str() << endl;\
  \ }\n};\n\nint main (void)\n{\n  SayHi<int> hi(5);\n  hi.display();\n  SayHi<string>\
  \ hs(\"Hello World\");\n  hs.display();\n  return 0;\n}\n```\n\n输出：\n```\n5\nHello\
  \ World\n```\n\n你可以以相同的方式特化函数模板。以下是其语法：\n\n```cpp\ntemplate<> returnType functionName<specialType>(args)\n\
  {\n  …\n}\n```\n\n这里 `specialType` 是你正在特化的类型。\n\n\n\n第一种且最简单的方法是使用 `typedef`。因为你可以像使用普通类名一样使用\
  \ `ClassName <parameters>`，你可以将类模板的名字 `typedef` 为一个更短的名字。例如，与其使用 `Vector<int>`，不如使用\
  \ `IntVec`。然后，当用户需要一个整数向量时，他们可以使用 `IntVec`。用户不需要意识到 `IntVec` 是模板的一部分。以下是你可能实现这种重命名的方法：\n\
  \n```cpp\ntypedef Vector<int> IntVec;\n```\n\n`typedef` 像这样用例的一个用例是在标准库的 `string`\
  \ 类中。字符串类模板的实际名称是 `basic_string`。这个类模板接受一个模板参数：所存储字符的类型。以下是该类的 `typedef` 定义：`typedef\
  \ basic_string<char> string;`\n\n这难道不很有趣吗？这意味着如果你愿意（如果你想体验那种无用的不便），你可以使用 `basic_string<char>`\
  \ 而不是 `string`。\n\n简化模板使用的第二种常见方法是使用默认模板参数。\n\n就像函数参数一样，模板参数也可以有默认值。格式完全相同：\n\n\
  ```cpp\ntemplate<class A, class B = int, class C = float> class ABC;\n```\n\n在这个示例中，如果在创建对象时没有传递类型，`B`\
  \ 和 `C` 分别默认为 `int` 和 `float`。以下是使用这个类模板的一些方法：\n\n```cpp\n//A is int, B is int,\
  \ C is float\nABC<int> a1;\n\n//A is int, B is string, C is char\nABC<int, string,\
  \ char> a2;\n\n//A is double, B is double, C is float\nABC<double, double> a3;\n\
  ```\n210\n《初学者 C++ 编程》，第二版\n\n你必须将所有默认模板参数放在列表的末尾（就像处理函数参数时必须这样做的那样）。\n\n在本章较之前的“理解参数解析”节中，我们讨论了让函数模板不那么复杂的第三种方法。\n\
  \n如果在调用函数时没有提供参数，计算机有时可以推断出它们应该是什么。通过这种方式，你可以让函数模板看起来像一个普通函数。\n\n第四种方法仅适用于函数模板，将在下一节中讨论。\n\
  \n## 重载函数模板\n\n函数模板可以被重载，就像普通函数可以重载一样。事实上，你可以创建一个同名的多个版本的函数，其中一些是函数模板，另一些只是普通函数。\n\
  \n等一下！如果我们关于模板所说的一切都是正确的（即它们让函数对每种数据类型都是通用的），那么你为什么需要重载函数模板呢？\n\n惊讶的是，这样做是有某些原因的。主要原因之一是让函数模板的行为完全像普通函数一样。你可以编写函数模板的重载版本，来处理那些在其他情况下必须显式调用模板参数的情况。这确保了总是调用正确的版本。\n\
  \n假设你将两个整数相加，并且你想返回一个浮点数（仅仅是因为这样）。\n\n这里是新的完整 `add` 函数：\n\n```cpp\ntemplate<class\
  \ T> T add (T a, T b)\n{\n    return a + b;\n}\n\nfloat add (int a, int b)\n{\n\
  \    return (float) a+b;\n}\n```\n\n现在，如果你用两个整数调用 `add` 函数，将会调用重载版本（第二个）。对于所有其他数据类型，第二个版本都会被忽略。但计算机是如何决定调用哪一个版本的呢？计算机遵循特定的规则来决定。对于对重载函数模板的每一次调用，计算机必须遵循以下步骤：\n\
  \n第 8 章 • 使用模板\n211\n\n1. 找到所有可能适用于参数的版本。对于 `add(5,3)` 调用，此规则使得两个版本都成为可能。对于 `add(75,\
  \ ‘a’)` 调用，此规则没有留下任何可能（因为两个版本都接受两个相同的数据类型）。\n2. 如果一个函数模板是另一个的特化版本，则选择特化版本。\n3. 对剩余的所有内容应用函数的普通重载规则。\n\
  4. 如果最后剩下一个函数和一个函数模板，则选择函数。对于 `add(5,3)` 调用，在这一步之前，函数和函数模板都是候选者。最终选择了函数。\n5. 如果没有剩余的可能，则该调用是一个错误。如果剩余两个或更多可能，则该调用是歧义的，并且是一个错误。\n\
  \n早些时候我们说，如果从参数列表中无法确定参数，你在调用函数时必须提供参数——例如，如果你用一个整数和一个浮点数调用 `add` 函数。幸运的是，有一些方法可以避免必须提供参数。其中一个是提供\
  \ `add` 函数的重载版本，用参数调用函数模板。这样，用户就不需要担心函数模板参数了。以下是你如何重载 `add` 函数的示例：\n\n```cpp\ninline\
  \ float add(int a, float b) { return add<float>(a,b);}\ninline float add(float a,\
  \ int b) { return add<float>(a.b); }\n```\n\n现在，如果你用一个整数和一个浮点数调用 `add` 函数且没有提供参数，计算机将能够弄出该做什么。注意前面的函数是如何声明为\
  \ `inline` 的。这样做是为了为了不不需要提供参数的便利，而不占用额外的内存。你是在告诉计算机，当你将一个整数和一个浮点数相加时，你想要这样做。\n\n\
  不要被函数模板重载所困。它真的和普通重载一样，只是你必须应用一些规则。如果你有任何疑问，只需咨询规则。\n\n## 使用标准库\n\nC++ 标准库被设计为几乎每个\
  \ C++ 用户服务。正因如此，它必须尽可能通用。\n\n212\n《初学者 C++ 编程》，第二版\n\n当 C++ 语言的设计者创建标准库时，他们设定了这些要求：\n\
  \n- 它必须对所有用户都是方便、高效、有用且安全的。\n- 用户不需要为了发现它的用途而重新编写库。\n- 库必须提供简单的接口。\n- 库在其尝试的任务上是完整的。\n\
  - 库必须与内置数据类型和关键字良好结合。\n\n在了解这些要求后，设计者随后构建了库。在我们看来，他们成功地满足了每一个要求。\n\n标准库由一组头文件，每个文件都有不同的用途。\n\
  \n它们可以分为十类：容器、通用实用、迭代器、算法、诊断、字符串、流、区域、语言支持和数值。\n\n在这一节中，我们将讨论一些容器以及自第一章“开始旅程”以来使用的字符串。容器是存储一组值的类型。字符串（你所知）存储文本。\n\
  \n由于模板被专门用于使代码更通用，标准库是使用模板的丰富来源。\n\n## 使用字符串\n\n所有的 C++ 标准字符串设施都包含在 `<string>` 中。正如我们在本章之前提到的，`string`\
  \ 是 `basic_string<char>` 的别名。`basic_string` 是一个接受任何类型字符的类模板。例如，你可以创建一个存储埃及字符的类名为\
  \ `E_char`。然后你可以使用埃及字符创建一个 `string` 对象：\n\n```cpp\nbasic_string<E_char> egyptian;\n\
  ```\n\n\n\n\n\n所有作为 `basic_string` 参数的字符，其属性都必须由另一个名为 `char_traits` 的模板类定义。`char_traits`\
  \ 的基本声明如下：\n\n```cpp\ntemplate<class Ch> struct char_traits{};\n```\n\n`struct`\
  \ 与 `class` 完全相同，区别在于它的所有成员默认是公开的（public），而不是私有的（private）。奇怪的是，这个模板类从未被直接使用过。每种类型的字符都有该模板的特化，包括此示例：\n\
  \n第 8 章 • 使用模板\n213\n\n```cpp\ntemplate<> struct char_traits<char>;\n```\n\n这段代码是\
  \ `char` 字符类型的特化。这个 `char_traits` 模板类存储了特定字符类型的属性。来看 `char_traits<char>` 实现的简化版本：\n\
  \n```cpp\ntemplate<> struct char_traits<char>\n{\ntypedef char char_type; //用标准名称调用它\n\
  // 整数表示的标准名称\ntypedef int int_type;\n// 将第二个参数拷贝到第一个参数\nstatic void assign(char_type&\
  \ a, const char_type& b);\n// 将 int 转换为 char\nstatic char_type to_char_type(const\
  \ int_type& a);\n// 将 char 转换为 int\nstatic int_type to_int_type(const char_type&\
  \ a);\n// 两个 int 是同一个字符吗？\nstatic bool eq_int_type(const int_type& i, const int_type&\
  \ j);\n// 两个字符相等吗？\nstatic bool eq(const char_type& a, const char_type& b);\n//\
  \ 第一个字符小于第二个吗？\nstatic bool lt(const char_type& a, const char_type& b);\n// 将 s2\
  \ 的 n 个拷贝移动到 s\nstatic char_type* move(char_type* s, const char_type* s2, size_t\
  \ n);\n// 将 s2 的 n 个拷贝拷贝到 s\nstatic char_type* copy(char_type* s, const char_type*\
  \ s2, size_t n);\n// 将 a 的 n 个拷贝到 s\nstatic char_type* assign(char_type* s, size_t\
  \ n, char_type a);\n\n//214\n《C++从入门到实践》，第二版\n// 比较两个字符\nstatic int compare(const\
  \ char_type* s, const char_type* s2, size_t n);\n// 返回字符数组的长度\nstatic size_t length(const\
  \ char_type* c);\n// 在 s 中查找 c\nstatic const char_type* find(const char_type* s,\
  \ int n, const char_type& c);\n};\n```\n\n你已经初略接触了库（libraries）。起初，它们看起来可能非常晦读，但通过练习，你会习惯它们的。主要的烦恼在于，大多数库使用诸如\
  \ `_E` 这样的变量名，让人很难记住它们的作用。库使用这样的名称是为了确保它们的名称与任何其他名称冲突。\n\n如你所见，`char_traits<char>`\
  \ 定义了使用 `char` 或 `char` 数组时的基本操作。\n\n你在该定义中看到的几行代码是两个 `typedef`。它们为字符类型和整数类型提供了标准名称，以便\
  \ `string` 类无论使用哪种类型的字符，都可以引用 `char_traits::char_type` 或 `char_traits::int_type`。\n\
  \n因为你之前没见过 `size_t`，你可能在好奇它是什么。你可以把它想象成无符号整数。\n\n实现此模板类中的方法非常直接。例如，这里是第一个版本 `assign`\
  \ 的实现：\n\n```cpp\ntemplate<> void char_traits<char>::assign(char_type& a, char_type&\
  \ b)\n{\na = b;\n}\n```\n\n所有用于 `basic_string` 的字符类型都必须是 `char_traits` 的特化，这个 `char_traits`\
  \ 模板类存储了特定字符类型的属性。`char_traits` 必须实现这些函数。\n\n最常见的字符类型是宽字符（`wchar_t`）。它与普通字符类似，但在\
  \ `basic_string` 的声明中，它使用了 `size_t`。因为你之前没见过 `size_t`，你可能在好奇它是什么。你可以把它想象成一个无符号整数。\n\
  \n以下是 `basic_string` 的声明：\n\n第 8 章 • 使用模板\n215\n\n```cpp\ntemplate<class C, class\
  \ T = char_traits<C>, class A = allocator<C>> class basic_string;\n```\n\n正如你所见，`char_traits<char>`\
  \ 定义了使用 `char` 或 `char` 数组时的基本操作。\n\n你在该定义中看到的几行代码是两个 `typedef`。它们为字符类型和整数类型提供了标准名称，以便\
  \ `string` 类无论使用哪种类型的字符，都可以引用 `char_traits::char_type` 或 `char_traits::int_type`。\n\
  \n实现此模板类中的方法非常直接。例如，这里是第一个版本 `assign` 的实现：\n\n```cpp\ntemplate<> void char_traits<char>::assign(char_type&\
  \ a, char_type& b)\n{\na = b;\n}\n```\n\n所有用于 `basic_string` 的字符类型都必须是 `char_traits`\
  \ 的特化，这个 `char_traits` 模板类存储了特定字符类型的属性。`char_traits` 必须实现这些函数。\n\n最常见的字符类型是宽字符（`wchar_t`）。它与普通字符类似，但在\
  \ `basic_string` 的声明中，它使用了 `size_t`。因为你之前没见过 `size_t`，你可能在好奇它是什么。你可以把它想象成无符号整数。\n\
  \n\n\n\n第一个参数 `p` 是字符数组。`n` 是要使用的字符数量，而 `a` 与字符串的分配方式有关（让它保持默认值即可，除非你想学习分配器的话）。如果你不提供\
  \ `n`，则将使用整个 C 风格字符串来构造字符串。以下是你可能使用这些构造函数的示例：\n\n```cpp\nchar* p = \"Hello World\"\
  ;\nstring s1(p); //s1 包含 \"Hello World\"\nstring s2(p, 5); //s2 包含 \"Hello\"\nstring\
  \ s3(p+6, 5); //s3 包含 \"World\"\n```\n\n# 第 8 章 使用模板\n\n**217**\n\n最后一个构造函数从字符序列创建一个字符串。你通过迭代器传递字符序列。你将在下一节中详细学习迭代器，但这里是基础知识。对于容器或字符串，你可以调用\
  \ `begin()` 和 `end()` 方法来获取存储在容器或字符串中的第一个元素和最后一个元素的指针。你可以使用这两个值将整组字符拷贝到新字符串中。构造函数定义如下：\n\
  \n```cpp\n//使用从第一个到最后一个的所有字符\ntemplate<class I> basic_string(I first, I last, const\
  \ A& a = A());\n```\n\n以下你可以使用此构造函数的方法：\n\n```cpp\nstring s = \"Hello World\";\n\
  char* c = \"Hello World\";\nstring s1(s.begin(), s.end()); //s1 包含 \"Hello World\"\
  \nstring s2(c, c+5); //s2 包含 \"Hello\"\nstring s3(c+6, c+11); //s3 包含 \"World\"\n\
  ```\n\n你可以对此构造函数使用序列中的任何两个字符指针。它们之间的每个元素都将被使用。请确保第一个参数在内存中位于第二个参数之前，并且它们之间的每个值实际上都是字符。\n\
  \n除了构造函数外，`basic_string` 类还有一个析构函数来执行所需的清理工作：\n\n```cpp\n~basic_string();\n```\n\
  \n### 遍历字符串\n\n迭代器对于所有容器和字符串都是通用的。迭代器允许你遍历存储在容器或字符串中的值。所有迭代器提供类似的接口，这是标准库的主要优势之一。如果你学习了某个容器的接口，就可以轻松地使用任何容器。对于\
  \ `basic_string`，字符串中的单个字符就是迭代器遍历的值。这些迭代器的所有代码都包含在 `<iterator>` 中。\n\n某些容器（在本文中，字符串被视为字符容器）可以高效地提供某些操作，而另一些不能。例如，`list`\
  \ 无法在任何时刻访问其存储的特定值。换句话说，`list` 不具备随机访问能力。而 `vector` 则具有。迭代器分为五类，取决于可用的访问操作类型。它们分别是输入、输出、前向、双向和随机访问。\n\
  \n**218**\n\n**初学者 C++ 编程（第二版）**\n\n输入型只能从元素中读取值并正向遍历容器（从容器到你的输入）。输出型只能向元素写入值并正向遍历容器（从你到容器的输出）。前向可以读取、写入并正向遍历容器。双向可以读取、写入并向前或向后遍历。随机访问可以读取、写入并随机跳转到任何元素。\n\
  \n每种类型迭代器的可用操作总结如表 8.1 所示。\n\n### 表 8 . 1\n**迭代器操作表**\n\n| 操作类型 | 输出 (Out) | 输入\
  \ (In) | 前向 (Forward) | 双向 (Bi) | 随机 (Rand) |\n| :--- | :---: | :---: | :---: |\
  \ :---: | :---: |\n| 前向迭代 (++) | 是 | 是 | 是 | 是 | 是 |\n| 后向迭代 (--) | 否 | 否 | 否 |\
  \ 是 | 是 |\n| 随机访问 ([], +=, -=, +, -) | 否 | 否 | 否 | 否 | 是 |\n| 读取 (`*Iterator`) |\
  \ 否 | 是 | 是 | 是 | 是 |\n| 写入 (`*Iterator = `) | 是 | 否 | 是 | 是 | 是 |\n| 成员访问 (`->`)\
  \ | 否 | 是 | 是 | 是 | 是 |\n| 比较 (`==`, `!=`) | 否 | 是 | 是 | 是 | 是 |\n| 更多比较 (`<`, `>`,\
  \ `<=`, `>=`) | 否 | 否 | 否 | 否 | 是 |\n\n如表 8.1 所示的操作所示，迭代器类似于数组指针。事实上，数组指针就是该数组的迭代器。所有迭代器都提供了与指针匹配的运算符。对于未经训练的眼睛来说，迭代器看起来就像一个指针，因为它的用法与指针完全一样。\n\
  \n迭代器的类别形成了一个层次结构：\n\n```cpp\nstruct input_iterator_tag {};\nstruct output_iterator_tag\
  \ {};\nstruct forward_iterator_tag : public input_iterator_tag {};\nstruct bidirectional_iterator_tag\
  \ : public forward_iterator_tag {}; \nstruct random_access_iterator_tag : public\
  \ bidirectional_iterator_tag {};\n```\n\n这种层次结构匹配每种类型的能力。例如，随机访问迭代器可以作为输入迭代器工作，但反之不然。输出迭代器被排除在层次结构之外，因为它们与其他并不太匹配。如果包含它，它将成为\
  \ `forward_iterator_tag` 的第二个基类，但这并没有产生任何显著优势，因此没有包含。\n\n**第 8 章 使用模板**\n\n**219**\n\
  \n现在，你准备好学习基础迭代器了。在学习几分钟后，它看起来会非常简单，如下：\n\n```cpp\ntemplate <class C, class T, class\
  \ Dist = ptrdiff_t, class Ptr = T*, class Ref = T&> struct iterator\n{\n    // 源自层次体系的类\n\
  \    typedef C iterator_category; // 正在遍历的元素类型\n    typedef T value_type; // 元素间的距离类型\n\
  \    typedef Dist difference_type;\n    typedef Ptr pointer; // 指向元素的指针类型\n    typedef\
  \ Ref reference; //元素的引用类型\n};\n```\n\n在这里，`C` 是迭代器的种类（由类型指示），`T` 是元素类型，`Dist` 是用于测量距离的类型，`Ptr`\
  \ 是用作元素指针的类型，`Ref` 是用作引用的类型。\n\n`ptrdiff_t` 定义为两个指针之间的标准距离。如你所示，这个类所做的只是定义名称，每个容器都可以从这里导出自己的版本。\n\
  \n正如每个字符类都有与其关联的 `char_traits` 一，每个迭代器都有与其关联的 `iterator_traits`。以下是 `iterator_traits`\
  \ 模板类：\n\n```cpp\ntemplate<class Iter> struct iterator_traits\n{\n    typedef typename\
  \ Iter::iterator_category iterator_category;\n    typedef typename Iter::value_type\
  \ value_type;\n    typedef typename Iter::difference_type difference_type;\n   \
  \ typedef typename Iter::pointer pointer;\n    typedef typename Iter::reference\
  \ reference;\n};\n```\n\n当程序员设计一个使用迭代器的算法时，她可以使用 `iterator_traits<Iter>::iterator_category`\
  \ 为每种不同的迭代器类型设计不同的行为。这样，代码的使用者就不需要感知迭代器。系统会自动使用最合适的代码版本。这是使实现对用户不可见的另一种更强大的方法。\n\
  \n**220**\n\n**初学者 C++ 编程（第二版）**\n\n所有字符串和容器都提供了标准方法来生成元素的迭代器。\n\n以下是 `basic_string`\
  \ 类的迭代器方法：\n\n```cpp\n//生成指向第一个元素的迭代器\niterator begin();\n// 指向最后一个元素之后的迭代器\niterator\
  \ end();\n```\n\n如果你将迭代器作为字符序列使用，通常需要这两种方法。例如，接受输入序列的字符串构造函数可以使用这两个方法的结果来产生字符串：\n\
  \n```cpp\nstring s = \"Hello World\";\nstring s1(s.begin(), s.end()); //s1 现在包含\
  \ \"Hello World\"\n```\n\n\n\n\n\n```cpp\niterator<iterator_traits<Iter>::iterator_category,\n\
  iterator_traits<Iter>::value_type,\niterator_traits<Iter>::difference_type,\niterator_traits<Iter>::pointer,\n\
  iterator_traits<Iter>::reference>\n{\nprotected:\n    // 用于使用普通迭代器内部反向迭代\n    Iter\
  \ current;\n\npublic:\n    // 给迭代器类型一个标准名称\n    typedef Iter iterator_type;\n\n\
  \    // 默认构造函数\n    reverse_iterator() : current() {}\n\n    // 从普通迭代器构造构造函数\n \
  \   reverse_iterator(Iter x) : current(x) {}\n\n    // 从另一个反向迭代器构造\n    template<class\
  \ U> reverse_iterator(const reverse_iterator<U>& x) : current(x.base()) {}\n\n \
  \   // 返回此类使用的普通迭代器\n    Iter base() const { return current; }\n\n    // 解引用\n \
  \   reference operator* () const\n    {\n        Iter tmp = current;\n        return\
  \ *—tmp;\n    }\n\n    pointer operator-> () const;\n\n    // 访问成员运算符\n    reference\
  \ operator[] (difference_type n) const;\n\n    // 向后（反向）\n    reverse_iterator&\
  \ operator++ ()\n    {\n        --current;\n        return *this;\n    }\n\n   \
  \ reverse_iterator operator++ (int)\n    {\n        reverse_iterator t = current;\n\
  \        --current;\n        return t;\n    }\n\n    // 向前（反向）\n    reverse_iterator&\
  \ operator-- ()\n    {\n        ++current;\n        return *this;\n    }\n\n   \
  \ reverse_iterator operator-- (int)\n    {\n        reverse_iterator t = current;\n\
  \        ++current;\n        return t;\n    }\n\n    reverse_iterator operator+\
  \ (difference_type n) const;\n    reverse_iterator operator+= (difference_type n);\n\
  \    reverse_iterator operator- (difference_type n) const;\n    reverse_iterator\
  \ operator -= (difference_type n);\n};\n```\n\n`reverse_iterator` 包含一个名为 `current`\
  \ 的迭代器，`reverse_iterator` 使用它进行迭代。`reverse_iterator` 在内部对该迭代器进行增和减操作，并在用户请求值时使用其值。对于迭代器，`++`\
  \ 运算符的含义是“移动到下一个元素”。然而，`reverse_iterator` 是反向遍历元素的，因此对 `reverse_iterator` 使用 `++`\
  \ 等同于对普通迭代器使用 `--`（它们在容器中的移动方向相同）。这就是为什么在 `++` 运算符函数的实现中，`current` 是被递减的。\n\n通常，当迭代器到达容器的末尾时，迭代器指向容器最后一个元素的之后的位置。然而，由于\
  \ `reverse_iterator` 是反向移动的，当迭代器指向第一个值之前的一个位置时，即为末尾。这是一个非法的访问值，可能会导致问题。为了避免这种复杂性，`current`\
  \ 指向迭代器所指向位置的后一个元素。换句话说，当迭代器位于末尾时，`current` 将指向容器的第一个元素。这种设计比指向第一个元素之前的位置要安全得多。\n\
  \n`reverse_iterator` 与所有迭代器一样，支持使其行为完全像指针指针的运算符。\n\n要从容器或字符串创建反向迭代器，你可以使用 `rbegin()`\
  \ 和 `rend()` 方法。这里是它们在 `basic_string` 类中的用法：\n\n```cpp\n// 反向迭代器从字符串末尾开始并向后移动\n\
  reverse_iterator rbegin();\n\n// 反向迭代器从字符串开始开始\nreverse_iterator rend();\n```\n\n\
  以下是一些如何使用 `reverse_iterator` 的示例：\n\n```cpp\nstring s = \"Hello World\";\ncout <<\
  \ *s.rbegin(); // 显示 \"d\"\ncout << *++s.rbegin(); // 显示 \"l\"\ncout << s.rbegin()[4];\
  \ // 显示 \"W\"\n```\n\n### 访问字符串\n\n标准库提供了许多访问字符串中包含的数据的方法。在本节中，我们将介绍每种方法，以便你对 `basic_string`\
  \ 类有一个彻底的理解。\n\n由于 `basic_string` 实际上只是一个高级字符数组，理所当然你应该能够像访问数组一样访问 `basic_string`，幸运的是你确实这样做。你可以通过两种方式访问数组的单个元素：使用下标运算符\
  \ `[]` 或 `at()` 方法。以下是这两种者的声明：\n\n```cpp\nreference operator[] (size_type n);\n\
  reference at(size_type n);\n```\n\n`n` 是这两个方法中指示字符串中位置的索引（从 0 开始，就像数组一样）。两者的区别在于\
  \ `at()` 方法会检查索引是否在字符串范围内（如果不在，则发生错误）。下标运算符则不会。它假设那里存储了一个字符，并访问内存中的该位置。以下是一些你如何使用这些方法的示例：\n\
  \n```cpp\nstring s = \"Asus Motherboards Rule!!\";\ncout << s[3]; // 第四个字符 - 's'\n\
  cout << s.at(2); // 第三个字符 - 'u'\n```\n\n如你所见，这些方法非常直观且易用。\n\n访问字符串的另一种常用方法将其转换为\
  \ C 风格字符串。在第 1 章中，你学习了实现此操作的一种方法 `c_str()`。此外还有两个方法：`data()` 和 `copy()`。以下是所有三个方法的声明：\n\
  \n```cpp\nconst C* c_str() const;\nconst C* data() const;\nsize_type copy(C* p,\
  \ size_type n, size_type pos = 0) const;\n```\n\n`data()` 方法返回一个指向常量字符数组的指针。字符串保持该数组的所有权，因此你不能以任何方式更改它。它仅用于查看。\n\
  \n`c_str()` 方法执行相同的操作，只是在数组末尾添加了一个空字符（使数组成为真正的 C 风格字符串）。你使用 `copy()` 方法将元素复制到数组中，以便随后对它们进行操作。该方法从元素\
  \ `pos` 开始将 `n` 个元素复制到数组 `p` 中。返回复制的元素数量。以下是一些如何使用这些方法的示例：\n\n```cpp\nstring s =\
  \ \"SyncMaster 3\";\nchar array[15];\ns.copy(array, 4, 7); // array 现在包含 \"ster\"\
  \narray[4] = 0; // 现在是真正的 c 风格字符串\ncout << s.c_str(); // 老喜好\nconst char* p = s.data();\n\
  p[4] = 'a'; // 错误，无法操作数组\n```\n\n除非你正在为 C 风格字符串编写，否则这些函数的用途有限。\n\n获取字符串信息的一种方法是将其与另一个字符串比较。`basic_string`\
  \ 可以与另一个字符串以及字符数组（相同类型）进行比较。你使用 `compare()` 方法来比较两个字符串。它被重载以提供许多可能性：\n\n```cpp\n\
  int compare(const basic_string& s) const;\nint compare(const C* p) const;\nint compare(size_type\
  \ pos, size_type n, const basic_string& s) const;\nint compare(size_type pos, size_type\
  \ n, const basic_string& s, size_type pos2, size_type n2 = npos) const;\n```\n\n\
  `compare()` 方法的每个版本都返回一个整数。如果比较的对象相等（由 `char_trait<C>::compare()` 定义），则该整数为 0；如果第一个小于第二个，则为负数；如果第一个大于第二个，则为正数。一个字符串大于另一个字符串的想法可能看起来很奇怪，但实际上比较的是字符的整数值（所以\
  \ a 小于 b）。\n\n前两个版本非常直观。只需提供字符串或字符数组，`compare()` 方法就会比较它们。然而，有时你只想比较字符串的一部分。这时最后两个版本派上用场了。`pos`\
  \ 是开始比较的位置，`n` 是要比较的字符数。在第三种版本中，字符串的一部分与整个 `s` 进行比较。在第四种版本中，两个字符串的部分都在进行比较。以下是一些示例：\n\
  \n```cpp\nstring s1 = \"Get the Fish\";\nstring s2 = \"Getting Started\";\nchar\
  \ array[] = \"5-Port Starter Kit\";\n\ncout << s1.compare(s2); // 显示 -1\ncout <<\
  \ s2.compare(array); // 显示 1\ncout << s1.compare(0,3,s2); // 显示 -1\ncout << s1.compare(0,3,s2,0,3);\
  \ // 显示 0\n```\n\n\n\n\n如果你想对一组字符串进行排序（例如，将名称列表按字母顺序排列），这些方法将非常重要。\n\n标准库还提供了用于标准比较运算符（`==`、`!=`、\
  \ `<`, `>`, `<=` 和 `>=`）的函数。这些函数声明在 `basic_string` 类之外。以下是其中几个声明：\n\n```cpp\ntemplate<class\
  \ C, class T, class A>\nbool operator==(const basic_string<C,T,A>&, const basic_string<C,T,A>&);\
  \ \n\ntemplate<class C, class T, class A>\nbool operator==(const C*, const basic_string<C,T,A>&);\n\
  \ntemplate<class C, class T, class A>\nbool operator==(const basic_string<C,T,A>&,\
  \ const C*);\n```\n\n通过这些函数，你可以测试两个字符串的相等性，或者测试一个字符串和一个字符数组的相等性。这里有一个测试字符串和字符数组的示例：\n\
  \n```cpp\nstring continent = \"Europe\";\nif (continent == \"Europe\") //true\n\
  cout << \"The continent is Europe!\";\n```\n\n不要过分担心计算机如何决定两个字符串是否相等。基本上，如果它们包含一组相等的字符，它们就是相等的。\n\
  \n有时，你可能需要在字符串中搜索特定的字符序列（子字符串）。`basic_string` 类提供了 24 种不同的方法来实现此功能。第一种是 `find()`\
  \ 方法。它从字符串的特定点开始搜索，如果找到了序列，则返回该位置（索引）。如果没有找到，它将返回 `npos`（表示一个非法索引）。你正在寻找的序列可以是一个字符串、字符数组或单个字符。以下是\
  \ `find()` 方法所有版本的声明：\n\n```cpp\nsize_type find(const basic_string& s, size_type\
  \ i = 0) const;\nsize_type find(const C* p, size_type i, size_type n) const;\nsize_type\
  \ find(const C* p, size_type i = 0) const;\nsize_type find(C c, size_type i = 0)\
  \ const;\n```\n\n在这里，`i` 是开始搜索的位置，`n` 是要从字符数组中搜索的字符数。这里是一些示例：\n\n```cpp\nstring\
  \ s = \"The basic_string class is extremely versatile.\"; \nstring s1 = \"basic_string\"\
  ;\n\n//displays 4\ncout << s.find(s1);\n\n//displays 4294967295 - 表示未找到字符串\ncout\
  \ << s.find(s1, 5);\n\n//displays 17 - 找到 \"class\" 的匹配\ncout << s.find(\"classes\"\
  , 17, 5);\n\n//displays 4294967295 - 无法找到 \"classes\"\ncout << s.find(\"classes\"\
  , 17);\n\n//displays 19 - 从第一个 'a' 之后开始搜索\ncout << s.find('a', 6);\n```\n\n有时从字符串的末尾反向搜索更方便（或更高效）。在这种情况下，你可以使用\
  \ `rfind()` 方法。它从指定的点开始搜索特定的字符序列，与 `find()` 类似，但它是反向搜索的。以下是 `rfind()` 函数的声明：\n\n\
  ```cpp\nsize_type rfind(const basic_string& s, size_type i = npos) const; \nsize_type\
  \ rfind(const C* p, size_type i, size_type n) const;\nsize_type rfind(const C* p,\
  \ size_type i = npos) const;\nsize_type rfind(C c, size_type i = npos) const;\n\
  ```\n\n如你所见，除了方法名外没有太大变化。参数的默认值是一个值得注意的例外。对于 `find()`，起始位置的默认值为 0（从开始开始），但对于 `rfind()`，它是\
  \ `npos`（从结束开始）。这里是一些示例：\n\n```cpp\nstring s = \"The string class sure has a lot\
  \ of methods.\"; \nstring s1 = \"of\";\n\n//displays 32\ncout << s.rfind(s1);\n\n\
  //displays 4294967295 - 没找到\ncout << s.rfind(s1, 31);\n\n//displays 35 - \"meth\"\
  \ 的位置\ncout << s.rfind(\"methane\", string::npos, 4);\n```\n\n你也可以从字符序列中搜索特定的字符。`find_first_of()`\
  \ 方法负责完成这项工作。它从给定点正向前搜索，如果遇到一个也在字符序列中的字符，函数将返回该字符的位置。\n\n`find_last_of()` 方法执行相同的操作，只是它是反向搜索的（就像\
  \ `rfind()` 一样）。以下是 `find_first_of()` 函数的声明：\n\n```cpp\nsize_type find_first_of(const\
  \ basic_string& s, size_type i = 0) const; \nsize_type find_first_of(const C* p,\
  \ size_type i, size_type n) const; \nsize_type find_first_of(const C* p, size_type\
  \ i = 0) const;\nsize_type find_first_of(C c, size_type i = 0) const;\n\nsize_type\
  \ find_last_of(const basic_string& s, size_type i = npos) const; \nsize_type find_last_of(const\
  \ C* p, size_type i, size_type n) const; \nsize_type find_last_of(const C* p, size_type\
  \ i = npos) const;\nsize_type find_last_of(C c, size_type i = npos) const;\n```\n\
  \n这里是这组函数的示例：\n\n```cpp\nstring s = \"We need a bigger gun.\";\nstring s1= \"Mercenaries.\"\
  ;\n\n//displays 1 - 'e' 的位置\ncout << s.find_first_of(s1);\n\n//displays 15 - \"\
  bigger\" 中 'r' 的位置\ncout << s.find_last_of(\"tree.\", 16);\n```\n\n有时你可能想执行相反的操作。你可以搜索字符串中不在某个特定字符序列中的第一个（或最后一个）字符。你使用\
  \ `find_first_not_of()` 和 `find_last_not_of()` 方法来实现这一点。以下是 `find_first_not_of()`\
  \ 等方法的声明：\n\n```cpp\nsize_type find_first_not_of(const basic_string& s, size_type\
  \ i = 0) const;\nsize_type find_first_not_of(const C* p, size_type i, size_type\
  \ n) const;\nsize_type find_first_not_of(const C* p, size_type i = 0) const;\nsize_type\
  \ find_first_not_of(C c, size_type i = 0) const;\n\nsize_type find_last_not_of(const\
  \ basic_string& s, size_type i = npos) const;\nsize_type find_last_not_of(const\
  \ C* p, size_type i, size_type n) const;\nsize_type find_last_not_of(const C* p,\
  \ size_type i = npos) const;\nsize_type find_last_not_of(C c, size_type i = npos)\
  \ const;\n```\n*(注：由于原文文本在 `find_first_not_of` 之后出现了逻辑断层和重复的混乱 描述，此处翻译已根据上下文补全了对应的函数逻辑逻辑。)*\n\
  \n这里是这组函数的示例：\n\n```cpp\nstring s = \"The sock is on floor.\";\nstring s1 = \"rocks\"\
  ;\n\n//displays 9 - \"is\" 的位置\ncout << s.find_first_not_of(s1);\n\n//displays 20\
  \ - \"l\" 的位置\ncout << s.find_last_not_of(\"the\", 20);\n```\n\n你可能想从字符串的各个（子字符串）创建新字符串。例如，如果你有一个存储\
  \ \"Hello World\" 的字符串，你可以创建一个存储 \"World\" 的字符串。你使用 `substr()` 方法完成此任务。通过指定位置和长度，你可以指定想要的字符串部分。这里是\
  \ `substr()` 的声明：\n\n```cpp\nbasic_string substr(size_type i = 0, size_type n =\
  \ npos) const;\n```\n\n在这里，`i` 是开始的位置，`n` 是使用的字符数。这里有一个示例：\n\n```cpp\nstring s =\
  \ \"annihilation\";\nstring s1 = s.substr(4,2);\ncout << s1.c_str(); //displays\
  \ \"hi\"\n```\n\n注意参数的默认值会创建字符串的副本。\n\n作为 `substr()` 的对应，标准库提供了将两个字符串组合形成一个新的的方法。你使用\
  \ `+` 运算符完成此任务。将两个字符串组合被称为拼接。所有的拼接函数都声明在 `basic_string` 中。以下是字符串的拼接函数：\n\n```cpp\n\
  template<class C, class T, class A>\nbasic_string<C,T,A> operator+ (const basic_string<C,T,A>&,\
  \ const basic_string<C,T,A>&);\n\ntemplate<class C, class T, class A>\nbasic_string<C,T,A>\
  \ operator+ (const C*, const basic_string<C,T,A>&);\n\ntemplate<class C, class T,\
  \ class A>\nbasic_string<C,T,A> operator+ (C, const basic_string<C,T,A>&);\n\ntemplate<class\
  \ C, class T, class A>\nbasic_string<C,T,A> operator+ (const basic_string<C,T,A>&,\
  \ const C*);\n\ntemplate<class C, class T, class A>\nbasic_string<C,T,A> operator+\
  \ (const basic_string<C,T,A>&, C);\n```\n\n通过这些函数，你可以从两个字符串、一个字符串和一个字符数组、或者一个字符串和一个字符创建一个字符串。这里是一些示例：\n\
  \n```cpp\nstring s = \"Hello\";\nstring t = \"World\";\ncout << s + ' ' + t; //displays\
  \ \"Hello World\"\ncout << s + ' ' + \"Everyone!\"; Displays \"Hello Everyone!\"\
  \n```\n\n\n\n\n`basic_string` 类还提供了一些内存函数，用于处理字符串数据和统计时使用的内存。其中一种统计方法是 `size()`\
  \ 方法。它返回存储在字符串中的字符数量。`length()` 方法的作用相同。`empty()` 方法在字符串为空时返回 `true`（否则返回 `false`）。`max_size()`\
  \ 方法返回字符串可以达到的最大可能尺寸。以下是这些方法的声明：\n\n```cpp\nsize_type size() const;\nsize_type length()\
  \ const {return size();}\nbool empty() const { return size == 0;}\nsize_type max_size()\
  \ const;\n```\n\n# 字符串操作\n\n能够以多种方式操作字符串的能力对于一个字符串类来说是关重要的。幸运的是，`basic_string` 充分满足了这一需求。当你需要操作字符串时，你有许多选择。\n\
  \n改变字符串最简单且实用的方法之一是使用赋值运算符（`=`）。`basic_string` 类重载了这些运算符，使得字符串看起来更像一种内置数据类型。以下是这些赋值方法的声明：\n\
  \n```cpp\nbasic_string& operator= (const basic_string& s);\nbasic_string& operator=\
  \ (const C* p);\nbasic_string& operator= (C c);\n```\n\n这些函数允许你将字符串、字符数组或单个字符赋值给字符串对象。请记住，在函数调用之前存储在字符串中的任何内容都会被销毁。\n\
  \n对于这些操作，一个名为 `assign()` 的普通方法在参数上提供了更大的活性。以下是 `assign()` 方法的声明：\n\n```cpp\n// 整个字符串\n\
  basic_string& assign(const basic_string&);\n// 部分字符串，从位置 pos 开始取 n 个字符\nbasic_string&\
  \ assign(const basic_string& s, size_type pos, size_type n);\n// 来自 p 的前 n 个元素\n\
  basic_string& assign(const C* p, size_type n);\n// p 的所有内容\nbasic_string& assign(const\
  \ C* p);\n// n 个 c 的拷贝\nbasic_string& assign(size_type n, C c);\n// 从第一个到最后一个的所有内容\n\
  typedef<class I> basic_string& assign(I first, I last);\n```\n\n这模仿了构造函数的多功能性。如果能以某种方式创建对象，却不能以同样的方式进行赋值，那是没有意义的。返回的\
  \ `basic_string&` 与赋值的值相同，但如果你不需要它，可以忽略它。\n\n追加（在末尾添加字符）是字符串上一个经常执行的操作。`basic_string`\
  \ 类提供了 `+=` 运算符或 `append` 方法来向字符串末尾添加内容。以下是追加函数的声明：\n\n```cpp\nbasic_string& operator+=\
  \ (const basic_string& s);\nbasic_string& operator+= (const C* p);\nbasic_string&\
  \ operator+= (C c);\nbasic_string& append(const basic_string& s);\n// 追加部分字符串\n\
  basic_string& append(const basic_string& s, size_type pos, size_type n);\n// 追加部分字符数组\n\
  basic_string& append(const C* p, size_type n);\n// 追加整个字符数组\nbasic_string& append(const\
  \ C* p);\n// 追加 n 个 c 的拷贝\nbasic_string& append(size_type n, C c);\n// 从迭代器追加值\n\
  template<class I> basic_string& append(I first, I last);\n```\n\n使用 `+=` 运算符，你可以将字符串、字符数组或字符追加到字符串中。使用\
  \ `append` 方法，你可以追加字符串、部分字符串、部分字符数组、整个字符数组、n 个字符的拷贝或来自迭代器的值。\n\n如果你想要添加的值并不一定在字符串的末尾，可以使用\
  \ `insert` 方法将它们放在中间某个位置。以下是 `insert` 方法的声明：\n\n```cpp\n// 在 pos 处的字符之前插入字符串\nbasic_string&\
  \ insert(size_type pos, const basic_string& s);\n// 在 pos 处的字符之前插入部分字符串\nbasic_string&\
  \ insert(size_type pos, const basic_string& s, size_type pos2, size_type n);\n//\
  \ 在 pos 处插入部分数组\nbasic_string& insert(size_type pos, const C* p, size_type n);\n\
  // 在 pos 处插入数组\nbasic_string& insert(size_type pos, const C* p);\n// 在 pos 处插入 n\
  \ 个 c 的拷贝\nbasic_string& insert(size_type pos, size_type n, C c);\n// 在 pos 处的字符之前插入\
  \ c - 返回 c 处的迭代器\niterator insert(iterator pos, C c);\n// 在 pos 处插入 n 个 c 的拷贝\n\
  void insert(iterator pos, size_type n, C c);\n// 在 pos 处插入序列\ntemplate<class I>\
  \ void insert(iterator pos, I first, I last);\n```\n\n`insert` 方法的每个版本都会将指定的字符插入到\
  \ `pos` 字符之前。此之后的每个字符都会向上移动以腾出空间。\n\n你可以使用 `replace()` 方法将字符串的一部分更改其他内容。以下是声明：\n\
  \n```cpp\n// 替换从 pos 到 pos+n 的字符\nbasic_string& replace(size_type pos, size_type\
  \ n, const basic_string& s); \nbasic_string& replace(size_type pos, size_type n,\
  \ const basic_string& s, size_type i2, size_type n2);\nbasic_string& replace(size_type\
  \ pos, size_type n, const C* p, size_type n2); \nbasic_string& replace(size_type\
  \ pos, size_type n, const C* p);\nbasic_string& replace(size_type pos, size_type\
  \ n, size_type n2, C c);\n// 替换从 pos 到 pos2 的字符\nbasic_string& replace(iterator\
  \ pos, iterator pos2, const basic_string& s); \nbasic_string& replace(iterator pos,\
  \ iterator pos2, const C* p, size_type n); \nbasic_string& replace(iterator pos,\
  \ iterator pos2, const C* p);\nbasic_string& replace(iterator pos, iterator pos2,\
  \ size_type n, C c); \ntemplate<class I> basic_string& replace(iterator pos, iterator\
  \ pos2, I first, I last);\n```\n\n如果你愿意，也可以直接从字符串中删除一个子串。为了这样做，你使用 `erase()` 方法。以下是声明：\n\
  \n```cpp\n// 删除从 i 到 i+n 的所有字符\nbasic_string& erase(size_type i = 0, size_type n\
  \ = npos);\n// 删除 i 处的单个字符\niterator erase(iterator i);\n// 删除从 first 到 last 的所有字符\n\
  iterator erase(iterator first, iterator last);\n```\n\n该方法的第一个版本默认会清空字符串。\n\n##\
  \ 使用 vector\n\n随着程序变得复杂，对更高级的数据存储的需求也随之产生。数组存储数据并不差，但它们非常底层。换句话说，你必须自己处理许多不便之处。\n\
  \n标准库容器为这个问题提供了优化解决方案。许多不同的容器可以适应不同的需求。在你的编程经验中，你会遇到大多数容器。为了让你入门，本节介绍了最常用的一种：`vector`。`vector`\
  \ 的属性使其在某些情况下是理想的，而在另一些情况下则效率低下。哪种容器适合你的需求取决于你自己。\n\n`vector` 与数组相似。它们包含了一系列值，每个值都可以像它自己的变量（而不是数据结构的一部分）一样被访问。事实上，`vector`\
  \ 中的数据存储在单维数组中。正因为如此，你可以通过提供索引数字轻松地访问 `vector` 中的任何元素。这种对元素的访问被称为随机访问，因为你可以轻松地访问任何随机元素。\n\
  \n当你向 `vector` 添加元素时，它会自动调整自身的大小。它通过创建一个更大的数组并将旧数组中的每个元素拷贝到新数组中来实现这一点。这一过程效率很低，是\
  \ `vector` 的主要缺点之一。\n\n\n\n\n\n如果你在 vector 的中间插入或删除元素，每个元素都必须相应向上或向下移动，以确保数组中没有空隙。所有元素的这种向上或向下移动可能是代价昂的。\n\
  \n`vector` 是一个类模板，定义在头文件 `<vector>` 中。声明看起来与 `basic_string` 非常相似：\n\n```cpp\ntemplate\
  \ <class T, class A = allocator<T>> class std::vector;\n```\n\n在现实世界中，\n\n许多程序员忽略或不知道标准库提供的所有工具。当我开始编写我的第一款电脑游戏时，我需要找到一种存储单位（units）的方法。游戏中单位的数量不是程序员可以预测的（至少在不费困难的情况下），因此我需要动态地存储这些单位，这在我当时是一个很复杂的概念。结果，我花费了大量精力来寻找方法。当我偶然在标准库中发现\
  \ `vectors` 时，我感到非常惊喜。不仅程序员们已经遇到过这个问题，而且还提供了一个深思熟虑的解决方案。毫无疑问，标准库可以为你节省无法估量的时间，非常值得仔细研究。\n\
  \n`vector` 的 `allocator` 行为与 `basic_string` 中的行为非常相似（也就是说，在大多数情况下，你不需要访问它）。`T` 是存储在\
  \ `vector` 中的数据类型。\n\n像 `basic_string` 一样，`vector` 使用 `typedef` 定义了一些标准名称：\n\n```cpp\n\
  // 存储的数据类型\ntypedef T value_type;\n\n// 内存分配器类型\ntypedef A allocator_type;\ntypedef\
  \ typename A::size_type size_type;\n\n// 遍历元素的方法\ntypedef compiler_dependent iterator;\n\
  \n// 反向迭代\ntypedef std::reverse_iterator<iterator> reverse_iterator;\n\n// 指向元素的指针\n\
  typedef typename A::pointer pointer;\n\n// 元素的引用\ntypedef typename A::reference\
  \ reference;\n```\n\n虽然这些名称可以派上用场，但它们主要用于内部实现，因此你不需要太担心它们（只要你知道每个名称指的是什么）。\n\n`vector`\
  \ 的构造函数提供了创建 vector 对象的多种方式：`vector(const A& = A())`\n\n```cpp\n// 创建一个包含 n 个 val\
  \ 拷贝的 vector\nvector(size_type n, const T& val = T(), const A& a = A());\n\n// 从输入序列拷贝的\
  \ vector\ntemplate<class I> vector(I first, I last, const A& a = A());\n\n// 从另一个\
  \ vector 创建的 vector\nvector(const vector& a);\n```\n\n第一个构造函数创建指定数量的元素。每个元素都用默认构造函数（或你选择的构造函数）初始化。第二个的作用与接收字符序列的\
  \ `basic_string` 构造函数完全相同。它接收与 `vector` 存储类型相同类型的元素序列（显然）。你使用第三个构造函数从另一个 vector\
  \ 创建 vector。以下是你可能构造 vector 的一些示例：\n\n```cpp\n// 默认构造函数 - 空 vector\nvector<float>\
  \ fv;\n\n//  10 个字符串的 vector\nvector<string> sv(10);\n\n//  10 个整数的 vector，每个初始化为\
  \ 3\nvector<int> iv(10,3);\n\nstring s = “Hello World\";\nvector<string> sv2(s.begin(),\
  \ s.end());\nvector<int> iv2(iv);\n```\n\n`vector` 类还有一个析构函数：\n\n```cpp\n~vector();\n\
  ```\n\n### 访问和操作 vector\n\n使用 vector 与使用字符串相似。大部分接口都是相同的。例如，这里是获取 vector 迭代器的方法：\n\
  \n```cpp\n// 指向第一个元素\niterator begin();\n\n// 指向最后一个元素之后的位置\niterator end();\n\n\
  // 指向最后一个元素\nreverse_iterator rbegin();\n\n// 指向第一个元素之前的位置\nreverse_iterator rend();\n\
  ```\n\n如你所见，迭代器在这里的工作方式与字符串完全相同。请注意，这些迭代器是随机访问迭代器，因为字符串和 vector 对其元素都有随机访问权限。\n\n\
  要访问 vector 中的单个元素，你可以像字符串一样使用下标运算符或 `at()` 方法。你还可以使用 `front()` 方法访问 vector 中的第一个元素，使用\
  \ `back()` 方法访问最后一个元素。以下是这两个方法的声明：\n\n```cpp\nreference front(); reference back();\n\
  ```\n\n`vector` 有两种向其赋值值的方法：使用赋值运算符或使用 `assign()` 方法。以下是声明：\n\n```cpp\n// 拷贝一个 vector\n\
  vector& operator=(const vector& x);\n\n// 从第一个到最后一个分配所有值\ntemplate<class I> void\
  \ assign (I first, I last);\n\n// 分配 n 个 val 的拷贝\nvoid assign(size_type n, const\
  \ T& val);\n```\n\n`vector` 的 `assign()` 方法与字符串的版本相似，因此非常浅俗易懂。\n\nvector 可以执行的两个操作被称为栈操作。它们是\
  \ `push_back()` 和 `pop_back()`。`push_back()` 将一个值添加到 vector 的末尾，而 `pop_back()` 则从\
  \ vector 中删除最后一个元素。以下是它们的声明：\n\n```cpp\nvoid push_back(const T& x);\nvoid pop_back();\n\
  ```\n\nvector 的三个操作被称为列表操作。它们是 `insert()`、`erase()` 和 `clear()`。`insert()` 在 vector\
  \ 的某个位置包含一组值，`erase()` 从 vector 中删除一个元素序列，而 `clear()` 删除 vector 中的所有元素。\n\n以下是声明：\n\
  \n```cpp\n// 在 pos 处插入 x\niterator insert(iterator pos, const T& x);\n\n// 在 pos\
  \ 插入 n 个 x\nvoid insert(iterator pos, size_type n, const T& x);\n\n// 在 pos 插入一个序列\n\
  template <class I> void insert(iterator pos, I first, I last);\n\n// 删除 pos 处的元素\n\
  iterator erase(iterator pos);\n\n// 删除一个元素序列\niterator erase(iterator first, iterator\
  \ last);\n\n// 删除所有元素\nvoid clear();\n```\n\n`vector` 类提供了 `size()`、`empty()` 和\
  \ `max_size()` 方法。这些方法的行为与它们在 `basic_string` 类中相同。\n\n最后，`vector` 类提供了比较运算符（`==`、`!=`,\
  \ `<`, `>`, `<=`, `>=`），就像字符串类一样。\n\n## 创建神秘的商店游戏\n\n在穿过被称为 Vector 峡谷的广阔荒野时，你遇到了一个小镇。这个镇与其他镇子不同。这个镇上的每个人似乎都有他们需要的一切。没有人短缺物资。在思考这种奇现象时，你偶然发现了一家奇怪的小商店。看着自己的物资，你决定还需要更多，于是毫不思考就进入了商店。编译以下代码看看发生了什么。\n\
  \n```cpp\n8.1 - 神秘的商店 - Mark Lee\n\n#include <iostream>\n#include <vector>\n#include\
  \ <string>\n\nusing std::string;\nusing std::vector;\n\n#define MAX(a,b) a<b ? b:\
  \ a //常用的宏\n\nstruct Item //用于存储商店中的单个物品\n{\n    string name;\n    int price;\n\
  };\n\nclass Store //用于处理与商店的一切\n{\n    vector<Item> inventory;\n    vector<Item>\
  \ forSale;\n    int money;\n\npublic:\n    Store(Item* itemList, int n);\n    ~Store()\
  \ {}\n    string BuyItem(int item);\n    string viewInventory();\n    string ListItems();\n\
  \n    int getMoney() { return MAX(money,0); }\n};\n\nStore::Store(Item* itemList,\
  \ int n)\n{\n    for(int i = 0; i < n; i++)\n        forSale.push_back(itemList[i]);\n\
  \    money = 20;\n}\n\nstring Store::BuyItem(int item)\n{\n    money -= forSale[item-1].price;\n\
  \    if (money < 0)\n        return \"\\n 对，你的钱不够。\\n\\n\";\n    inventory.push_back(forSale[item-1]);\n\
  \    return \"你买了一个 \" + forSale[item-1].name + '\\n';\n}\n\nstring Store::ListItems()\n\
  {\n    string s;\n    for(int i = 0; i < forSale.size(); i++)\n    {\n        s\
  \ += \"[\";\n        s += i + 49;\n        s+=\"]购买一个 \";\n        s+= forSale[i].name;\n\
  \        s+= \" ($\";\n        s+= forSale[i].price + 48;\n        s+= \")\\n\"\
  ;\n    }\n    return s;\n}\n\nstring Store::viewInventory()\n{\n    string s;\n\
  }\n```\n\n\n\n\n\n# 基础 C++ 编程，第二版\n\n```cpp\nfor(int i = 0; i < inventory.size();\
  \ i++)\n{\n    s += inventory[i].name + '\\n';\n    return s + '\\n';\n}\n\nint\
