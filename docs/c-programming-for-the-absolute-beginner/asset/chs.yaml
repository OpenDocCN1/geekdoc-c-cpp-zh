  ## 总结\n\n这一章虽然很短，但非常重要。即使是最高先进的程序员也经常忽略本章的概念，而且异常处理确实没有为你的程序增加功能。然而，异常处理能让你的程序更加稳定，如果你想从一名优秀的程序员变为一名卓越的程序员，我们强烈建议你养成使用它的习惯。\n\
