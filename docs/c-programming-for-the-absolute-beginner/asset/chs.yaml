  \n## C H A T E R\n\n## 创建海盗\n\n## 冒险\n\n最后一章了！如果你是从这本书的开头开始读的，亲爱的读者，你已经走了很远。这一章将向你展示如何应用前面章节中的所有信息来设计一个电脑游戏。在本章中，你将找到基础游戏引擎的代码。你将使用\
  \ GDK，这是一个随 Visual Studio Express 附带的游戏开发工具包。作为一名新程序员，由你来开发这些代码使其成为你自己的并制作出一个功能完整的游戏。祝运！\n\
  \n在本章中，你将学习到以下内容：\n\n• 声明游戏的全局变量\n• 创建表示船的 Ship 类\n• 创建游戏骨架\n• 在屏幕上移动船\n• 将游戏绘制到屏幕上\n\
  • 进入游戏中的城镇\n\n![](img/index-301_jpg)\n\n282\n\nC++ 入门级编程，第二版\n\n## 介绍 DARK GDK\n\
  \n为了编写图形化电脑游戏，一个人需要掌握许多我们没有教过的编程技能。其中许多内容的细节超出了本书的范围，但幸运的是，有一个名为 GDK 的可用库提供了我们所需的所有功能。该库可以从以下网址免费下载：`http://www.microsoft.com/express/samples/gamecreators/default.aspx`\n\
  \n[`www.microsoft.com/express/samples/gamecreators/default.aspx`](http://www.microsoft.com/express/samples/gamecreators/default.aspx)\n\
  \n**图 11.1**\n\n创建一旦你成功安装了 Dark GDK，你就可以创建 Dark GDK 项目，如图 11.1 所示。下面是“Dark GDK –\
  \ 2D Game”项目的代码：\n\n```cpp\n// Dark GDK - The Game Creators - www.thegamecreators.com(http://www.thegamecreators.com)\n\
  // 向向为你创建了一个使用 GDK 的非常简单的 2D 项目\n// 它可以作为制作你自己的 2D 游戏的起点\n// 每次使用 Dark GDK 时，你必须确保包含头文件\n\
  \n// 应用程序的主入口点是这个函数\n\n#include \"DarkGDK.h\"\n```\n\n\n\n\n\n```cpp\nvoid DarkGDK\
  \ ( void )\n{\n// 在此应用程序中，加载一个背景，然后在屏幕上显示\n// 若干个动画精灵\n// 在启动 Dark GDK 程序时，设置全局\n\
  // 应用程序属性是有用的，我们首先开始开启同步率，\n// 这意味着我们控制屏幕更新的时机，我们还设置了\n// 最大率为 60，这意味着最大帧率将\n//\
  \ 被设定为每秒 60 帧\ndbSyncOn();\n\ndbSyncRate(60);\n\n// 调用此函数是为了停止 GDK 响应 escape 键（退出键），\n\
  // 然后我们可以在主循环中添加一些代码，\n// 以便控制按下 escape 键时会发生什么 dbDisableEscapeKey();\n\n// 现在我们将随机种子值设置为计时器，这可以\n\
  // 帮助我们在每次运行程序时获得更多的随机值\ndbRandomize(dbTimer());\n\n// 我们将为该场景显示一个背景，为了做到这一点，\n\
  // 我们加载图像并赋予它一个 ID 号 1。这张特定的\n// 图像是一张带有星星的夜空\ndbLoadImage(\"backdrop.bmp\", 1);\n\
  \n// 下一步是创建一个使用该图像的精灵，这\n// 通过调用 dbSprite 并为精灵 ID 传入值 1，为 X 坐标传入 0，为 Y 坐标传入 0，\n\
  // 为图像传入值 1 来\ndbSprite(1, 0, 0, 1);\n\n// 接下来我们将加载一些动画精灵，在此之前\n// 我们需要调整图像颜色键，通过使用此函数，\n\
  // 我们可以让特定颜色变为透明。在我们的案例中，我们希望\n// 它是亮粉色\ndbSetImageColorKey(255, 0, 255);\n\n//\
  \ 在此循环中，我们将创建一些动画精灵，我们加载\n// 的图像包含了小行星的动画帧\nfor (int i = 2; i < 30; i++)\n{\n//\
  \ 创建一个动画精灵并赋予它来自变量\n// i 的 ID 号，接下来是文件名，现在我们讨论横向和\n// 向的帧数，在我们的案例中是 4，最后是\n// 精灵将使用的图像\
  \ ID，我们再次使用 i\ndbCreateAnimatedSprite(i, \"sprite.bmp\", 4, 4, i);\n\n// 将我们的精灵放置在随机位置\n\
  dbSprite(i, dbRnd(640), -dbRnd(1500), i);\n}\n\n// 现在我们进入主循环，我们调用 LoopGDK 以便 GDK\
  \ 可以\n// 执行一些内部工作\nwhile (LoopGDK())\n{\n// 遍历所有的精灵\nfor (int i = 2; i < 30; i++)\n\
  {\n// 将精灵向下并播放它的动画\n// 从第 1 帧到第 16 帧，延迟为 60 毫秒\ndbMoveSprite(i, -2);\ndbPlaySprite(i,\
  \ 1, 16, 60);\n\n// 检查精灵的位置，如果它超出了屏幕\n// 则将其重新置回顶部\nif (dbSpriteY(i) > 500)\ndbSprite(i,\
  \ dbRnd(640), -dbRnd(1500), i);\n}\n\n// 在这里我们检查是否按下了 escape 键，如果按了\n// 我们将跳出循环\n\
  if (dbEscapeKey())\nbreak;\n\n// 在这里我们调用来更新屏幕内容\ndbSync();\n}\n\n![](img/index-304_1.png)\n\
  \n// 当用户按下 escape 时，代码将跳到此位置\n// 我们可以释放任何之前分配的资源\n// 删除所有精灵\nfor (int i = 1; i <\
  \ 30; i++)\ndbDeleteSprite(i);\n\n// 删除背景图像\ndbDeleteImage(1);\n\n// 现在一切都准备好返回\
  \ Windows 了\nreturn;\n}\n```\n\n# 理解代码\n\n这段代码虽然满满了有用的注释，但初看之下可能会让人感到无从下手。但不要放弃希望！到本章结束时，这段代码看起来将会非常自然。\n\
  \n所以，勤奋的读者，你应该做的第一件事是编译并运行这段代码，看看它确切做了什么。记住要从创建一个“Dark GDK – 2D Game”项目开始。运行中的程序如图\
  \ 11.2 所示。\n\n**图 11.2**\n\n小行星示例 Dark GDK 程序。\n\n## 代码结构\n\n现在，让我们开始拆解这段代码来弄懂它。你首先会注意到的是完全缺少\
  \ `main()` 函数。在使用 Dark GDK 时，与其使用 `main()`，你必须创建一个 `DarkGDK()` 函数。该函数没有参数且返回值为 `void`。此程序中的所有代码都包含这一个函数中，这些代码可以分为三部分：初始化、主循环和清理。\n\
  \n### 初始化\n\n初始化是这三个部分中最长的。它包含了从 `DarkGDK()` 函数开始到这些行之间的内容：\n\n```cpp\n// 现在我们进入主循环，我们调用\
  \ LoopGDK 以便 GDK 可以\n// 执行一些内部工作\nwhile (LoopGDK())\n```\n\n初始化部分的第一步是以下两行：`dbSyncOn();`\
  \ `dbSyncRate(60);`。\n\nDark GDK 提供的每个函数都以前缀 `db`开头。这是为了确保函数名称不会与你自己的任何名称冲突；类似于\
  \ C++ 标准库使用 `std` 命名空间的方式。\n\n这两行代码设置了最大帧率。对于图形类电脑游戏，控制事物发生的速率是非常重要的，因为在现代计算机上，如果事物只是以尽可能快的速度运行，它们可能会变得太快。这里的帧率被设置为\
  \ 60。这意味着屏幕上的图像每秒（最多）将更新 60 次。\n\n默认情况下，Dark GDK 程序将通过立即退出来响应 escape 键。通常你希望在退出之前执行某些操作，或者你想将\
  \ escape 键用于其他用途。调用 `dbDisableEscapeKey()` 会禁用 GDK 的默认操作。\n\nC++ 标准库提供了生成随机数的功能，但\
  \ Dark GDK 提供了自己的。就像你使用 `srand()` 为标准库随机生成器种子一样，你使用 `dbRandomize()` 为 Dark GDK 随机生成器种子。使用\
  \ `dbTimer()` 作为种子值就像使用 `time()`。\n\n### 图像与精灵\n\n现在我们到了激动人心的部分！调用 `dbLoadImage()`\
  \ 从图像文件中读取背景以准备好显示。该函数接受两个参数：图像的文件名和你分配的 ID 号。你必须记住这个数字，以便在后的代码中引用该图像。\n\n![](img/index-306.jpg)\n\
  \n说到这里，加载的图像在紧接着的一行中被使用了。为了在屏幕上显示图像，我们必须先将其加载到“精灵”（sprite）中。Dark GDK 中的精灵是一个可以在屏幕上显示的二维图像。当我们创建一个精灵时，我们赋予它一个\
  \ ID 和一个位置。位置指的是图像的左上角，由于这是整个屏幕的背景，它被设置为屏幕的左上角，或 (0,0)。图像 ID 被用第四个参数来引用之前加载的图像文件。\n\
  \n使用 `dbSetImageColorKey()` 函数，你可以让某种颜色显示为透明。这是一种将方形图像文件转换为例如屏幕上小行星形状图像的方便方法。\n\n\
  ### 动画\n\n最后一步是在随机位置创建 28 个小行星精灵。这些精灵与背景的不同之处在于它们是动画的。看看图 11.3 以创建这些精灵的图像文件。如你所见，所有的动画帧都存储在同一个文件中。不要使用\
  \ `dbLoadImage()`，使用 `dbCreateAnimatedSprite()` 来加载动画精灵的图像。你必须提供每行的动画帧数和列数。尽管精灵是通过此函数调用创建的，但我们仍然必须调用\
  \ `dbSprite()` 来赋予这个精灵一个位置。`dbRnd()` 用于为精灵的位置创建随机值。\n\n**图 11.3**\n\n小行星精灵的图像文件。\n\
  \n\n\n\n\n现在一切都初始化完毕，是时候进入主循环了。该循环的结构如下：\n\n```cpp\nwhile(LoopGDK())\n{\n    ...\n\
  }\n```\n\n调用 `LoopGDK()` 会执行所有必要的内部操作，仅在程序准备退出时返回 0。此循环中包含的所有代码每帧执行一次。\n\n主循环中执行的第一件事是遍历所有的小行星精灵（sprites）并让它们向下移动。这是通过\
  \ `dbMoveSprite()` 函数实现的。此外，使用 `dbPlaySprite()` 函数以每秒 60 帧的速度自动循环所有动画帧。当某个特定的小行星精灵经过屏幕底部时，它的位置将被重置为新的随机位置。\n\
  \n每一帧，都会使用 `dbEscapeKey()` 检查是否按下了 escape 键。如果按了，我们将跳出主循环，从而有效结束程序。\n\n最后，调用 `dbSync()`\
  \ 根据主循环中之前执行的所有更改来更新屏幕。\n\n当程序结束时（无论是用户按下 escape 键还是关闭窗口），我们都会进入清理阶段。在这里，通过简单地调用\
  \ `dbDeleteSprite()` 释放所有精灵的资源。最后，通过调用 `dbDeleteImage()` 卸载加载的图像文件。\n\n表格 11.1 总结了章中我们将使用的所有\
  \ Dark GDK 函数。\n\n### 表 11.1：重要的 DARK GDK 函数\n\n| 函数名称 | 用途 |\n| :--- | :--- |\n\
  | `DarkGDK()` | 替换 `main()` 函数。 |\n| `dbSyncOn()` | 设置最大帧率。 |\n| `dbSyncRate()`\
  \ | 设置最大帧率。 |\n| `dbSetDisplayMode()` | 设置屏幕上的像素数。 |\n| `dbMaximizeWindow()` | 最大化显示。\
  \ |\n| `dbSetWindowOff()` | 退出窗口模式进行全屏显示。 |\n| `dbDisableEscapeKey()` | 禁用 Dark\
  \ GDK 对 escape 键的默认处理。 |\n| `dbRandomize()` | 为随机数生成器种子。 |\n| `dbTimer()` | 返回当前时间。\
  \ |\n| `dbSetImageColorKey()` | 设置被视为透明的颜色。 |\n| `dbLoadImage()` | 从文件加载图像。 |\n\
  | `dbCreateAnimatedSprite()` | 从文件加载一组动画帧。 |\n| `dbSprite()` | 创建精灵或赋予其一个新位置。 |\n\
  | `dbSetSpritePriority()` | 用于控制哪些精灵在屏幕上方的。 |\n| `dbHideSprite()` | 禁用精灵的可见性。 |\n\
  | `dbShowSprite()` | 启用精灵的可见性。 |\n| `dbRnd()` | 返回一个随机数。 |\n| `LoopGDK()` | 用于实现主循环。\
  \ |\n| `dbMoveSprite()` | 将指定的精灵向上或向下移动距离。 |\n| `dbPlaySprite()` | 自动循环动画帧。 |\n\
  | `dbSetSpriteFrame()` | 将精灵更改为指定的动画帧。 |\n| `dbEscapeKey()` | 如果按下 escape 键返回 true。\
  \ |\n| `dbReturnKey()` | 如果按下回车键返回 true。 |\n| `dbLeftKey()` | 如果按下左箭头键返回 true。 |\n\
  | `dbRightKey()` | 如果按下右箭头键返回 true。 |\n| `dbUpKey()` | 如果按下上箭头键返回 true。 |\n| `dbDownKey()`\
  \ | 如果按下下箭头键返回 true。 |\n| `dbSync()` | 更新显示。应每帧调用一次。 |\n| `dbDeleteSprite()` | 销毁指定的精灵。\
  \ |\n| `dbDeleteImage()` | 销毁指定的图像。 |\n\n## 游戏概述\n\n当你设计游戏时，我们建议先创建图形，因为图形有助于赋予游戏外形。毕竟，什么更令人兴奋呢？是盯着一个只运行着“在此处插入标题界面”字样的屏幕看六小时，还是看着你苦心创作的精美标题界面？一旦你准备好了几张图形，就可以用它们来测试代码是否有效。\n\
  \n在“海盗探险”游戏中，你将使用 11 个屏幕：标题界面（在游戏开始前显示）、玩家进入城市时显示的城市界面，以及 9 个用于游戏地图的屏幕。\n\n这个游戏引擎的基本思想是你沿着地图在加勒比海航行。\n\
  \n地图将分为 9 个部分（9 个正方形组成一个 3x3 的网格）。每个部分的大小都是电脑屏幕的大小（800 x 600）。这 9 个部分中的每一个都将分成一个独立的位图文件（`.bmp`），名称从\
  \ `map1.bmp` 到 `map9.bmp` 不等，分别如图 11.4 至 11.12 所示。\n\n*   **图 11.4**：地图的西北角显示美国南部，包括佛罗里达州。\n\
  *   **图 11.5**：底部带有新普罗维斯（New Providence）的大面积海域是地图的上中部分。\n*   **图 11.6**：新荷兰（一个虚构城市）位于地图右上部分的中间。\n\
  *   **图 11.7**：地图 1 正下方是地图的左左部分，显示了伯利兹。\n*   **图 11.8**：地图的正中心显示了一个繁荣的区域，有许多城市。\n\
  *   **图 11.9**：地图 3 正下方、地图 5 旁边是地图的右右部分。\n*   **图 11.10**：地图左下角有很多土地，但城市很少。\n* \
  \  **图 11.11**：在地图的中下部分你可以看到圣玛丽亚和卡塔赫纳。\n*   **图 11.12**：在地图的右下角你可以单独看到加拉加斯。\n\n\
  为了看起来像一个专业游戏，“海盗探险”需要一个标题界面。标题界面通常显示游戏的标题（在大多数游戏中，标题界面是你可以开始新游戏的地方）。标题界面（图 11.13\
  \ 显示了“海盗探险”）一直显示到按下回车键，然后“海盗探险”开始。\n\n最后，城市界面（见图 11.14）每当玩家进入城市时显示。这为游戏增加了变化。玩家并不总是处于同一个屏幕上。\n\
  \n现在你已经有了屏幕上的背景，可以将注意力转向船只的图形。在这个游戏引擎中，只有一条船（玩家），但你可以轻松地复用第一只船的图形并在屏幕上创建第二只。因为船只向四个方向移动，你只需要四张船的图像，每个方向一张。幸运的是，所有图像都足够小，可以放入一张图中。当你需要时，只需复制图像的该部分。每张船的图片称为一个动画帧。船图像文件见图\
  \ 11.15。由于船必须无缝地停留在地图屏幕上，它的背景需要是透明的。\n\n### 编写游戏引擎\n\n现在你已经处理好了所有的图形，是时候开始编程了。第一件事的是创建一个新的“Dark\
  \ GDK – 2D Game”项目，命名为“海盗探险”。你需要将所有图像复制到项目文件夹中，与你的代码放在一起。\n\n\n\n\n\n由于 `Dark GDK`\
  \ 与 C++ 标准库的兼容性良好，我们必须进行一项额外的更改。在 `Solution Explorer`（解决方案管理器）中右键点击项目名称，并选择 `Properties`（属性）。见图\
  \ 11.18。\n\n![](img/index-316_1.png)\n\n**第 11 章 • 创建海盗冒险**\n\n**297**\n\n**图 11.18**\n\
  \n编辑项目属性。\n\n接下来，在 `Configuration Properties`（配置属性）下选择 `C/C++`，然后 `Code Generation`（代码生成）。想要更改的设置是\
  \ `Runtime Library`（运行库）。你需要将其从 `Multi-threaded Debug (/MTd)` 改为 `Multi-threaded\
  \ (/MT)`。见图 11.19。\n\n![](img/index-317_1.jpg)\n\n**298**\n\n**《初学者 C++ 编程》，第二版**\n\
  \n**图 11.19**\n\n让 Dark GDK 与 C++ 标准库兼容。\n\n然后你可以继续逐个添加以下代码文件。你可以在后续章节中找到完整游戏引擎的列表。\n\
  \n### 存储位置\n\n在整个游戏引擎中，我们需要一种存储位置的方法。由于屏幕上或地图上的位置都具有水平 (x) 和垂直 (y) 分量，单单整数是不够的。我们将创建一个新类来存储位置，称为\
  \ `Point`。`Point` 类的声明存储在 `Point.h` 中，实现存储在 `Point.cpp` 中。\n\n```cpp\n//Point.h\n\
  #pragma once\n#include <istream>\nusing std::istream;\n\nclass Point\n{\nint m_x,\
  \ m_y;\npublic:\nPoint(int x, int y) : m_x(x), m_y(y) {}\nPoint(istream& input);\n\
  int x() { return m_x; }\nint y() { return m_y; }\nPoint operator+(const Point& p);\n\
  };\n```\n\n```cpp\n// Point.cpp\n#include \"Point.h\"\nPoint::Point(istream& input)\n\
  {\ninput >> m_x >> m_y;\n}\n\nPoint Point::operator+(const Point& p)\n{\nreturn\
  \ Point(m_x + p.m_x, m_y + p.m_y);\n}\n```\n\n`Point` 类有两个构造函数。一个只是直接设置 `Point`\
  \ 的 `x` 和 `y` 分量，另一个则从输入流中读取它们。使用了两个访问器方法来获取点的 `x` 和 `y` 分量，分别命名为 `x()` 和 `y()`。\n\
  \n最后，重载了加运算符以允许两个 `Point` 对象相加。显而易见，此函数仅通过相加相应的 `x` 和 `y` 分量来创建一个新的 `Point` 对象。\n\
  \n### 创建船类\n\n第一个文件是 `Ship.h`。这是 `Ship` 类的声明文件。该类的实际实现位于 `Ship.cpp` 中。\n\n```cpp\n\
  //Ship.h\n#pragma once\n#include \"DarkGDK.h\"\n#include \"Point.h\"\n\nclass Ship\n\
  {\nstatic char* m_spriteFileName;\nstatic const int m_numFramesAcross = 4;\nstatic\
  \ const int m_numFramesDown = 1;\nstatic const int m_spriteID = 1;\nstatic const\
  \ int m_imageID = 1;\npublic:\nShip();\nvoid show(Point theLoc);\nvoid hide();\n\
  void moveLeft();\nvoid moveRight();\nvoid moveUp();\nvoid moveDown();\n~Ship();\n\
  };\n```\n\n```cpp\n// Ship.cpp\n#include \"Ship.h\"\nchar* Ship::m_spriteFileName\
  \ = \"sprites.png\";\nShip::Ship()\n{\ndbCreateAnimatedSprite(m_spriteID, m_spriteFileName,\
  \ m_numFramesAcross, m_numFramesDown, m_imageID);\ndbSprite(m_spriteID,0,0,m_imageID);\n\
  dbSetSpritePriority(m_spriteID, 1);\nthis->hide();\n}\n\nvoid Ship::show(Point theLoc)\n\
  {\ndbSprite(m_spriteID, theLoc.x(), theLoc.y(), m_imageID);\ndbShowSprite(m_spriteID);\n\
  }\n\nvoid Ship::hide()\n{\ndbHideSprite(m_spriteID);\n}\n\nvoid Ship::moveLeft()\n\
  {\ndbSetSpriteFrame(m_spriteID,3);\n}\n\nvoid Ship::moveRight()\n{\ndbSetSpriteFrame(m_spriteID,1);\n\
  }\n\nvoid Ship::moveUp()\n{\ndbSetSpriteFrame(m_spriteID,4);\n}\n\nvoid Ship::moveDown()\n\
  {\ndbSetSpriteFrame(m_spriteID,2);\n}\n\nShip::~Ship()\n{\ndbDeleteSprite(m_spriteID);\n\
  }\n```\n\n该类的构造函数使用 `dbCreateAnimatedSprite()` 函数加载船的精灵，给船一个随机位置，并隐藏船以用于标题界面。`dbSetSpritePriority()`\
  \ 函数用于确保船始终绘制在前面。\n\n`show()` 成员函数使用 `dbSprite()` 将船移动到指定位置，并使用 `dbShowSprite()`\
  \ 在屏幕上显示船。`hide()` 成员函数简单调用 `dbHideSprite()` 以确保不显示船。这用于标题界面和城市界面。\n\n`moveLeft()`、`moveRight()`、`moveUp()`\
  \ 和 `moveDown()` 成员函数调用 `dbSetSpriteFrame()` 来改变船面对的方向。\n\n最后，析构函数简单调用 `dbDeleteSprite()`\
  \ 来销毁船的精灵。\n\n### 创建城市类\n\n该游戏引擎中共有 13 个城市，每个城市都有自己的名称、边界框和船的终位置。边界框定义了船必须进入以访问该城市的区域。终点位置是船离开城市后被设置的位置。`City`\
  \ 类在 `City.h` 中声明，在 `City.cpp` 中实现。\n\n```cpp\n// City.h\n#pragma once\n#include\
  \ <string>\n#include \"Point.h\"\nusing std::string;\n\nclass City\n{\nstring m_name;\n\
  Point m_topLeft;\nPoint m_bottomRight;\nPoint m_endLoc;\npublic:\nCity(string name,\
  \ Point topLeft, Point bottomRight, Point endLoc);\nbool isInside(Point thePoint);\n\
  Point endCoordinates();\nstring name();\n~City();\n};\n```\n\n```cpp\n//City.cpp\n\
  #include \"City.h\"\nCity::City(string name, Point topLeft, Point bottomRight, Point\
  \ endLoc) : m_name(name), m_topLeft(topLeft), m_bottomRight(bottomRight), m_endLoc(endLoc)\n\
  {\n}\n\nbool City::isInside(Point thePoint)\n{\nif (thePoint.x() < m_bottomRight.x()\
  \ && thePoint.x() > m_topLeft.x() && thePoint.y() < m_bottomRight.y() && thePoint.y()\
  \ > m_topLeft.y())\nreturn true;\nreturn false;\n}\n\nstring City::name()\n{\nreturn\
  \ m_name;\n}\n\nPoint City::endCoordinates()\n{\nreturn m_endLoc;\n}\n\nCity::~City()\n\
  {\n}\n```\n\n这个类非常简单。实际上唯一具有复杂的函数是 `isInside()` 成员函数，它测试一个位置是否位于城市内。如果提供的位置在 `City`\
  \ 对象的边界框内，该函数返回 true，否则返回 false。\n\n### 实现地图屏幕\n\n整个地图被分为 9 个屏幕，每个屏幕都有自己的图像文件、精灵、位置和城市集合。`Screen`\
  \ 类封装了这些屏幕的所有功能。它在 `Screen.h` 中声明，在 `Screen.cpp` 中实现。\n\n```cpp\n// Screen.h\n#pragma\
  \ once\n#include \"DarkGDK.h\"\n#include <vector>\n#include <string>\n#include <fstream>\n\
  #include \"City.h\"\nusing std::vector;\nusing std::string;\nusing std::ifstream;\n\
  \nclass Screen\n{\nint m_spriteID;\nint m_imageID;\nstring m_fileName;\nPoint m_topLeft;\n\
  vector<City*> m_cities;\nifstream m_mapFile;\npublic:\nScreen(int spriteID, int\
  \ imageID, string fileName, Point topLeft);\nvoid addCity(string cityName, Point\
  \ topLeft, Point bottomRight, Point endLoc);\nPoint topLeft() { return m_topLeft;\
  \ }\nvoid hide();\nvoid show();\nbool isLandCollision(Point thePoint);\nCity* isEnteringCity(Point\
  \ thePoint);\n~Screen();\nprivate:\nScreen(const Screen& rhs);\nScreen& operator=(const\
  \ Screen& rhs);\n};\n```\n\n```cpp\n// Screen.cpp\n#include \"Screen.h\"\nScreen::Screen(int\
  \ spriteID, int imageID, string fileName, Point topLeft) : m_spriteID(spriteID),\
  \ m_imageID(imageID), m_fileName(fileName), m_topLeft(topLeft)\n{\nchar fileNameBuffer[500];\n\
  strcpy(fileNameBuffer,m_fileName.c_str());\ndbLoadImage( fileNameBuffer, m_imageID\
  \ );\ndbSprite( m_spriteID, 0, 0, m_imageID );\nthis->hide();\nm_mapFile.open(m_fileName.c_str());\n\
  }\n```\n\n\n\n\n\n```cpp\nm_cities.push_back(new City(cityName, topLeft, bottomRight,\
  \ endLoc));\n}\n\nvoid Screen::hide()\n{\n    dbHideSprite( m_spriteID );\n}\n\n\
  void Screen::show()\n{\n    dbShowSprite( m_spriteID );\n}\n\nbool Screen::isLandCollision(Point\
  \ thePoint)\n{\n    int green;\n    int blue;\n    m_mapFile.seekg(3 * (599 - thePoint.y())\
  \ * 800 + 3 * thePoint.x() + 54);\n    // 306\n    // C++ Programming for the Absolute\
