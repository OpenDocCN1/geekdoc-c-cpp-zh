  ## 索引 - 363\n\n# 引言\n\n`C++` 是世界上最广泛使用的编程语言，是各种应用程序编程的行业标准。此外，`C++` 是一种极其高效的编程语言，比\
  \ Visual Basic 或 Delphi 等语言更有效地节省资源。\n\n事实上，由于其功能和风格，在许多方面，`C++` 是你可能唯一需要掌握的非 Web\
  \ 基础的编程语言。\n\n我们选择通过游戏编程来教你 `C++`，是因为最初许多人是通过玩电脑游戏来接触计算机的。重要的是，电脑游戏是学习编程的极佳方式，因为它们教你如何在显示器上显示界面、如何接收用户指令以及如何操纵信息。最终，游戏是艺术与科学的结合，它触及逻辑和创造力思维，为程序员和用户提供刺激性的视觉、听觉和心理体验。\n\
  \n在本书中，你将发现许多内在编程技巧，这些技巧不仅适用于 `C++`，也适用于通用编程。这些常见的编程技术将使你更容易学习使用其他语言编程，并创建游戏应用之外的应用。\n\
  \n# 本书内容\n\n本书从简单的基于文本的程序过渡到带有实际图形的更复杂的游戏。如果你是编程完全初学者，我们建议你按照自然顺序阅读章节。另一方面，如果你已经有一定的编程经验，你可能想略过涵盖基础知识的前六章，直接跳到更高级的主题。\n\
  \n本书在概念上（尽管物理结构上不是）被分为四个部分。首先，从第 1 章“开启旅程”到第 6 章“内存管理”，为你提供了使用 `C++` 编程所需的的基础知识。由于这些章节中主题的顺序性，我们建议按顺序阅读。例如，在转向第\
  \ 5 章“软件设计：面向对象编程”之前，你可能需要完成第 4 章“使用函数结构化你的代码”。\n\n# 引言\nxvii\n\n本书的第二部分（第 7 章“类关系”到第\
  \ 10 章“错误与异常处理”）由高级 `C++` 题组成。你可以按照任何顺序阅读这些章节并完全理解它们。\n\n第三部分包含第 11 章“创建海盗冒险游戏”。在这里，你将把之前章节中学到的所有知识整合起来，并将其应用于使用行业标准技术编写一个摇滚的海盗游戏。\n\
  \n第四部分包含附录，提供了对你有帮助的额外信息，从附录 A“章节挑战答案”开始，到附录 E“术语表”结束。\n\n无论你如何阅读这本书，请记住，学习 `C++`\
  \ 编程很大程度上在于实操经验。你编程得越多，在解决问题（你会发现这是编程中的一项重要技能）和检测代码中的错误方面就会越出色。\n\n谁知道呢，如果你编程得足够，你甚至可以在脑海中计算出百万位的圆周率……尽管本书作者不保证这一点）！\n\
  \n在整个章节中，你会发现一些小代码段，用于说明我们介绍的概念。\n\n在每个章节的末，你将找到一个演示章节核心思想的完整游戏、一个章节总结以及一组测试你新知识的挑战。我们希望你尝试这些游戏和挑战，因为它们将真正帮助你培养编程感。挑战的答案在附录\
  \ A 中。\n\n然而，我们强烈建议你在查看答案之前尝试挑战（即使你需要帮助）。这些挑战都非常短，所以你可以将它们输入到编译器中（这再次是获得经验的好方法）。\n\
  \n# 如何开始\n\n学习编程是利用计算机力量的极佳方式。\n\n然而，在开始编程之前，你需要准备好以下物品：\n\n- 一配备 2.0 GHz 或更快处理器的\
  \ PC。\n- 安装了 Service Pack 2 的 Windows XP 专业版、Windows Server 2003 或 Windows Vista。\n\
  - 至少 512MB 内存。\n- 至少 8GB 硬盘空间。\n- 一个编译器，如 Visual Studio 2008 Express 版。\n\n\n\n\n\
  \n• 知识、时间与耐心。书中的信息将为你提供足够的知识，让你有效利用 `C++` 和 `Visual Studio`，或者大多数其他编译器。\n\nxviii\n\
  \n《初学者 C++ 编程》，第二版\n\n在附录 C“在 Mac 和 Linux 平台上工作”中，我们将讨论如何在非 Windows 系统上进行工作。\n\n\
  ## 本书的特色\n\n除了章节末尾的完整游戏和挑战外，书中还有其他一些特别之处：\n\n### 提示 (H I N T)\n- 针对困难的话题提供额外的信息。\n\
  - 提醒你需要避免的陷阱。\n\n### 陷阱 (T R A P)\n- 让编程变得更容易更高效的技巧。\n\n### 技巧 (T R I C K)\n\n#\
  \ 第一章：开启之旅\n\n编程听起来可能是一项艰的任务，但不要担心。\n\n我们设计这一章的目的是让你能够上手，而无需深入研究编程复杂的本质。本章从讨论计算机开始。我们将向你展示它们是如何运作的。接着是创建程序的基础知识。接下来，你将学习如何使用\
  \ `Visual Studio` ——一个 `C++` 编译器。然后，你就可以玩玩一些文本和数字了。\n\n在我们的帮助和你的智慧下，你很快就能创建出自己的简单程序。我们相信，以后你的程序会变得越来越复杂，但每个人必须从某处开始这段旅程。此时，你的冒险已经开始了！\n\
  \n你冒险的开头包括：\n- 计算机是如何运作的\n- 如何编写代码\n- 如何编写你的第一个程序\n- 如何使用 `Visual Studio`\n- 编程开发周期是如何工作的\n\
  - 如何使用文本\n- 如何使用数字\n\n## 计算机基础\n\n计算机由许多组件组成。有些非常容易识别：键盘、鼠标或显示器。另一些是内部的，对新手用户是隐藏的。这些包括\
  \ `CPU`（中央处理器）和内存。\n\n`CPU` 是计算机的大脑。它是布满电路的核心，所有的决策都由此产生。如果你的计算机某天决定变成僵尸袭击你，而你需要知道从哪里下手，那里就是你要对准的地方。这样，那头恶兽就会回到它来时的地狱！\n\
  \n### 幸运的是，你可能一段时间内都不需要担心僵尸计算机，所以可以先把它放在脑后。下一个最重要的组件是内存。它通常被称为 `RAM`（随机存取存储），是存储数据和指令的地方。\n\
  \n数据和指令？显然你以前听过这些术语，但它们在这里意味着什么？嗯，数据可以指许多东西。键盘输入、文件内容、网络服务器请求，计算机使用的任何信息。指令是种特殊的数据。\n\
  \n它们“指示” `CPU` 下一步做什么。相这两个数字，将此数据移动到这里，跳转到下一条指令。这些都是 `CPU` 指令的示例。\n\n计算机的主要操作是执行这些指令。获取下一条指令。执行它。获取下一条指令。执行它。周而一遍。尽管这一切发生得非常快。一个\
  \ `1 GHz CPU` 每秒可以执行十亿次指令！没什么大不了的（尽管我不确定为什么有人想拿根棍子去戳东西……似乎缺乏动力）。\n\n## 定义源代码\n\n\
  计算机通过执行一系列简单指令来工作，但幸运的是，程序员不再需要以如此低的级别编写程序了。人们开发了被称为“编程语言”的特殊语言，使得思想可以更更容易地表达。这需要一个名为\
  \ `编译器` 的中间程序将用编程语言编写的思想翻译成计算机可以理解的一系列简单指令。\n\n### 提示 (H I N T)\n你可能会奇怪为什么你不能直接告诉计算机要做什么。“去这个网页”或“播放这首歌”就是我们希望与计算机交互的示例。问题是，英语（以及所有其他所谓的“自然”语言，如法语、德语等）太复杂了。像\
  \ `C++` 这样的编程语言更简单、更精确。尽管如此，编写良好的代码读起来几乎像英语一样简单。\n\n第 1 章 · 开启之旅\n\n就像英语有语法、标点符号和拼写规则一样，`C++`\
  \ 也是如此。区别在于 `C++` 的规则要严格得多。如果我们说“The cat run slow（猫跑得慢）”而不是“The cat is running slowly（猫正在慢慢地跑着）”，虽然基本意思仍然被传达了，但这种对\
  \ `C++` 规则的松散遵循是一个大得多的问题。不遵守 `C++` 的规则可能会导致各种错误和问题。\n\n而且，就像英语一样，语法和标点符号并不是全部。为了写出良好的代码，必须简洁、优雅地表达自己的思想。这是一门程序员不断精炼的艺术。在该领域工作了多年的专业程序员仍在努力提高他们的编码能力。\n\
  \n但，话就这么多。让我们来看代码！\n\n## 检查 Hello World\n\n现在，亲爱的读者，让我们一头进入 `C++` 的神秘世界。尽管你起初可能会被奇怪的符号和晦涩的术语所困扰，但随着时间，都会变得清晰。\n\
  \n准备好你的火炬，让我们深入这个黑暗的洞穴吧！\n\n```cpp\n//1.1 – Hello World – Mark Lee\n\n#include <iostream>\n\
  \nint main( void )\n{\n  using std::cout;\n  cout << \"Hello World!\\n\";\n  return\
  \ 0;\n}\n```\n\n上述是一个完整的 `C++` 程序。它只是在屏幕上显示“Hello World”字样。现在，让我们逐行拆解它！\n\n在研究论文中，结尾通常有一个部分被称为参考文献。正如你可能知道的，该部分用于为写论文时使用的信息提供引用。`C++`\
  \ 非常相似，只不过参考文献位于开头。程序员可以对另一段代码提供“引用”，以指示该功能来自何。第二行就是这样一个引用：\n\n```cpp\n#include\
  \ <iostream>\n```\n\n被引用的文件是 `iostream`。该文件提供了向屏幕打印所需的功能。如果你想引用不同的文件，比如 `cstdio`，它看起来像这样：\n\
  \n```cpp\n#include <cstdio>\n```\n\n那么这个 `iostream` 文件是什么？它来自哪里？嗯，我好奇的读者，这个文件是 `C++\
  \ 标准库`的一部分。`C++ 标准库`是一组 `C++` 代码，提供了许多重要功能，如在屏幕上显示文本。这个库是始终且自动可用的。在本书中，我们将引入库的新部分。在这个程序中使用\
  \ `iostream`。`iostream` 是 `C++ 标准库`的一个组件，用于向屏幕显示文本或从键盘读取输入。\n\n下一行是空的。为什么？这包含某种意义吗？必须在这里放置空行吗？答案是不可能的。空行仅仅是为了留出间隔。`C++`\
  \ 被认为“忽略空白”。这意味着你几乎可以在任何地方放置空格、制表符和空行，而不影响含义。如果删掉这个空行，程序将完全相同！那么为什么要放在那里呢？嗯，它有助于提高代码的可读性。如果所有代码都挤在一起而没有任何间距，阅读和理解它们将困难得多。\n\
  \n\n\n\n现在我们遇到了一些非常奇怪的词。`int?` `void?`。不，`void` 并不是指某个绝望深渊（尽管 `C++` 有时可能会让你有感觉）。而\
  \ `int` 只是 integer（整数）的缩写，我们将在本章稍后的部分介绍它。你会注意到这一行后面是一组用大括号 `{` 和 `}` 包围的行。这种结构非常重要。整个部分被称为\
  \ `main` 函数。每个程序必须有一个 `main` 函数。在第 4 章中，我们将更详细地介绍函数，但现在，只需将你编写的所有代码放在那些奇怪的大括号内即可。\n\
  \n`main` 函数的第一行是使用 C++ 标准库的另一个部分。它基本上是说在这个函数中我们将使用标准库（`std`）中的某些东西，而那个东西被称为 `cout`。为什么我们需要这一行呢？嗯，C++\
  \ 标准库中的所有内容都在一个所谓的命名空间（namespace）中。我们将在后面的章节中介绍它们，但目前它意味着库中的所有内容都必须带有 `std::` 前缀。将这一行放在函数的顶部就可以省去这种必要性。在下一行，我们可以直接说\
  \ `cout` 而不需要在它前面加上 `std::`。\n\n那么这个 `cout` 到底是什么？你该怎么读它呢？嗯，`cout` 用于将内容打印到屏幕上。它的读音是“See-out”。`cout`\
  \ 中的 `out` 指它的输出。输出（Output）是离开你程序的数据。而输入（Input）则是进入程序的数据。C++ 标准库中还有另一个单词 `cin`，用于从键盘读取输入。我们稍后会介绍它。\n\
  \n你会注意到 `main` 函数中的所有行都以分号 `;` 结尾。由于空格会被忽略，所有的语句都可以写在同一行。判断一个语句结束和下一个语句开始的唯一方法是使用某种东西来分隔它们。C++\
  \ 使用分号。在第 3 章“使用控制语句进行选择”中，你将学习不需要分号的语句，但在那之前，你遇到的每个语句都必须以分号结束。\n\n现在，耐心的读者，我们已经到达了这个程序的关键。这是实际上向屏幕显示文本的地方。当你第一次瞥一眼代码时，可能已经猜到了这一点。你可以看到引号中的“Hello\
  \ World!”，它似乎是指向这个 `cout` 单词的。好了，这就是你打印到屏幕的方法！末尾那个奇怪的 `\\n` 符号换行。当我们在下一节学习如何实际编译并运行这个程序时，你可以尝试删除这个换行符看看会发生什么。\n\
  \n`main` 函数的最后一行仅用于指示函数的结束。`return` 单词表示“好的，这个函数结束了”，而数字 `0` 意味着一切正常。\n\n### 注释\n\
  \nHello World 程序的第一行是一个注释。它对程序的运行方式没有影响。每当你连续输入两个正正斜杠 `//` 时，你就是在告诉编译器忽略该行的剩余部分。注释的目的是帮助使代码更易理解。注释可以用两种方式编写。单行注释（如前面的那个）只占用一行。该行中\
  \ `//` 之后的所有内容都会被忽略，如下所示：\n\n```cpp\n// I am an army of one\n```\n\nC++ 注释的另一种形式允许你将一个但很长的注释跨越你需要的任意行：\n\
  \n```cpp\n/* dragons rule the world */\n```\n\n或者\n\n```cpp\n/* dragons\n\nrule\n\
  \nthe\n\nworld */\n```\n\n虽然这通常会令人困惑，但你可以将多行注释放在代码的几乎任何位置，如下所示：\n\n```cpp\ncout\
  \ << /* prints out Hello World */ \"Hello World\\n\";\n```\n\n然而，仅仅因为存在这种可能性并不意味着你应该使用它。像这样使用注释会很快让你的代码变得不可读。一个好的原则是：仅使用注释来让你的代码更易理解。如果它们没有帮助，就把它们删掉。\n\
  \n再次，注释中的任何内容都不会影响代码。只使用注释用通俗的英语解释程序中复杂或大部分。编译器在将程序转换为机器码时会忽略注释。\n\n### 使用 Visual\
  \ Studio\n\n在本节中，你将发现如何使用 Visual Studio 创建你的第一个程序。Visual Studio 是一个集成开发环境（IDE）。程序员需要许多不同的工具来完成工作：一个编写代码的编辑器、一个组织所有文件的文件浏览器、一个将源代码转换为可执行程序的编译器，以及一个用于检查运行中程序的调试器。IDE\
  \ 将所有这些工具打包成一个应用程序。有些程序员喜欢将所有内容都整合并集成在一起，而另一些人则倾向于为每个工具使用独立的应用程序，创建他们自己的、自定义的工作环境。在附录\
  \ C 中，我们将讨论 Visual Studio 的一些替代方案。\n\n**提示**：我们编写此书的基础假设你正在使用 Visual C++ 2008 Express\
  \ 版（它是免费提供的）。然而，如果你没有使用它也没关系。本章及其他章节中的大部分信息适用于你所使用的任何编译器。有关如何下载和安装 Visual C++ 2008\
  \ Express 版的详细说明，请查看 `http://cplus.about.com/od/learnc/ss/vc2008.htm`。\n\n是时候开始你的编程世界之旅了。当我们解释如何使用\
  \ Visual Studio 创建项目并展示代码时，请在在你自己的电脑上亲自尝试。练习会让不熟悉的事变得自然。\n\n### 创建新项目\n\n第一次打开 Visual\
  \ Studio 时，它将如图 1.1 所示。正如你看到的，并没有发生魔法（嗯，也许有一点）。Visual Studio 仅仅是一个应用程序，就像 Microsoft\
  \ Word 和 Internet Explorer 一样，只是 Visual Studio 是用来创建其他应用程序的应用程序。\n\n在 Visual Studio\
  \ 运行的情况下创建一个新的 C++ 项目，请按照以下步骤操作（注意，如果你有不同版本的 Visual Studio，菜单、对话框和其他选项的名称可能会不同）：\n\
  \n1. 从 `File` 菜单中，选择 `New` 然后是 `Project`。\n2. 在 `Project Types` 下选择 `Win32`。\n3.\
  \ 在 `Templates` 下选择 `Win32 Console Application`。\n4. 在 `Name` 字段中输入 `Hello World`。你会发现随着你的输入，`Solution\
  \ Name` 也会被填充。\n5. 点击 `OK`。将出现 `Win32 Application Wizard` 对话窗口。你可以在这里进一步自定义你的项目。点击\
  \ `Next`。\n6. 在这里你可以为项目选择额外的选项。你现在需要的唯一选项是 `Empty Project`，所以勾选它。点击 `Finish`。\n\
  7. 项目现在已创建。左侧有一个标记为 `Solution Explorer` 的窗口。你可以在这里看到项目中的所有文件。现在项目是空的，让我们添加一个文件吧。在\
  \ `Solution Explorer` 中右键点击项目名称 `Hello World`。\n8. 在弹出的菜单中，选择 `Add` 然后是 `New Item`。\n\
  9. 出现 `Add New Item` 对话窗口。在这里，在 `Templates` 下选择 `C++ File (.cpp)` 并在 `Name` 字段中输入\
  \ `HelloWorld`。点击 `Add`。\n\n\n\n\n# 添加新文件\n\n向你的项目添加新文件。\n\n![](img/index-29_1.png)\n\
  ![](img/index-29_2.png)\n\n10\n面向初学者的 C++编程，第二版\n\n10. 文件现在已创建并打开进行编辑。输入上一节中的“Hello\
  \ World”程序。你会发现，为了简洁起见，我们跳过了注释的输入。\n\n参见图 1.6。\n\n**图 1.6**\n编写你的第一段代码！\n\n11. 一旦你完成代码输入，按下\
  \ `Ctrl + F5`，或者在 `Debug` 菜单下选择 `Start Without Debugging`（无调试启动）。编译结果将显示在标记为 `Output`\
  \ 的窗口中。如果存在编译错误，你将在这里看到。\n\n确保你的代码与代码列表完全一致。忘记分号或出现拼写错误是非常容易的。\n\n12. 你应该看到如图 1.7\
  \ 所示的新窗口出现。恭喜，你刚刚创建了你的第一个程序！\n\n**图 1.7**\n执行 Hello World 程序。\n\n# 第 1 章 • 开始旅程\n\
  \n11\n\n## 软件开发周期\n\n软件开发周期是所有软件在完成任务过程中必须经历的过程。随着你作为程序员的技能提高，这些阶段将对你变得越来越自然。图 1.8\
  \ 中的流程图说明了这一周期。\n\n**图 1.8**\n软件开发周期。\n\n通常情况下，为了创建一个程序，你需要遵循以下步骤：\n\n1. 规划！程序是打算做什么的？代码应该如何结构？程序是给谁用的？他们的需求是什么？这些都是你在开始编写代码之前必须回答的问题！\n\
  2. 在源代码编辑器（`Visual Studio` 或其他编辑器）中编写代码。你在之前的字节“编写你的第一个程序”中已经做了一部分这类工作，在你读完这本书时，你将会做多很多。\n\
  \n12\n3. 编译代码。想象你是一个精灵，而计算机是一个矮人。为了让计算机理解你的指令，你必须克服语言障碍。\n\n你需要一个既会说矮人语和精灵语的翻译员。在计算机世界中，这个翻译员就是编译器。正如我们之前提到的，编译器将你的语言转换为计算机可以读取的机器码。然而，这种翻译是单向的。编译器不能将机器码翻译回源代码。如果有错误，你必须回到代码并修复它们。关于使用\
  \ `Visual Studio` 编译代码的逐步信息，请参考早之前的字节“使用 Visual Studio”。\n4. 链接代码。链接代码是将组成程序的所有文件结合在一起的过程，就像许多勇敢骑士汇聚在一起以击败强大的巨龙！在这种情况下，勇敢的骑士包括你的代码，还包括你使用的所有库，例如\
  \ `C++ Standard Library`。如果你遇到错误，必须返回第 1 步来修复错误。当你构建项目时，`Visual Studio` 会自动完成链接步骤。\n\
  5. 测试程序。你测试程序以确保它运行正常。你可能会问，如果已经成功通过了编译和链接阶段，为什么测试是必要的呢？\n\n显然没有错误了，对吧？嗯，有些错误更加阴险！尽管你的代码看起来运行正常，但仍然可能存在细微的问题。这些被称为**逻辑错误**！它是所有程序员的噩梦，大量的时间被花在了寻找这些错误上。\n\
  \n彻底测试你的程序以确保一切都按照你预期的方式运行是至关重要的！\n6. 一旦你的程序通过了这些步骤，通常还有更多工作要做！\n\n需求会发生变化，你的程序可能需要适应。也许之前遗漏的错误会在之后被发现。软件开发是一个持续的过程！\n\
  \n## 处理文本\n\n在图形出现之前，文本是所有程序的基础。文本冒险游戏和文本公告板系统是我们的第一次编程体验。文本仍然是编程中一个非常重要的元素。在本节中，你将了解到如何组装和存储文本。\n\
  \n文本是显示程序输出最简单的媒介。本书从仅使用文本开始，因为文本足以显示大多数程序的输出。这种方法让我们让我们推到后面的章节再介绍图形的复杂性。\n\n在计算机世界中，一段文本的技术名称是\
  \ `string`。一个 `string` 是字符序列；通常，我们认为字符是你可以从键盘输入的符号，包括空格。例如，在“Hello World”程序中，“Hello\
  \ World\\n”就是一个 `string`。\n\n# 第 1 章 • 开始旅程\n\n13\n\n## 组装字符串\n\n计算机将“For Honor!!!”视为一系列字符，每个字符占据一个字母或空格（F\
  \ 是第一个字符，o 是第二个，以此此类推）。字符串始终包含在双引号内。例如，“a”、“ （空格）、“4”和“%”都是由一个字符组成的字符串。\n\n这些似乎看起来都很复杂，但创建字符串实际上很容易。以下是一些字符串的示例。如你所见，它们只是被引号包围的小文本。\n\
  \n“For Honor!!!”\n“Pass me my sword.”\n“Who put my staff on the wagon?”\n\n## 使用\
  \ cout 显示字符串\n\n现在你已经知道如何创建字符串，你可能想做的第一件事将其显示在屏幕上。在本节中，你将学习实现这一目标的多种方法。\n\n正如分析“Hello\
  \ World”程序时提到的，输出并不是 C++ 的原生部分。这种功能通过 `C++ Standard Library` 提供。为了使用它，你必须做一些特殊操作。\n\
  \n首先，你必须在程序的顶部引用相关文件。正如我们在 Hello World 程序中看到的，为了在屏幕上显示文本，该文件是 `iostream`。这是该引用的语法（结构）：\n\
  \n```cpp\n#include <iostream>\n```\n\n这提供了对 `C++ Standard Library` 相关部分的访问，但并不是故事的结束。库中的所有内容都在所谓的\
  \ `namespace`（命名空间）中。这意味着你从库中使用的一切都必须以 `std::` 前缀。例如，现在要使用 `cout`，你必须写 `std::cout`。这可能会很麻烦，通常将相关术语从命名空间中提取出来更容易。正如之前讨论的，你可以通过以下代码将术语从命名空间取出：\n\
  \n```cpp\nusing std::cout;\n```\n\n现在你可以自由使用 `cout` 而无需加 `std::` 前缀。\n\n最后，为了在屏幕上显示字符串，你如下使用\
  \ `cout`：\n\n```cpp\ncout << “Hello World”;\n```\n\n14\n面向初学者的 C++编程，第二版\n\n你可以使用\
  \ `cout` 显示任何字符串，例如：\n\n```cpp\ncout << “For Valour!”;\n```\n\n## 使用 cout 显示多个字符串\n\
  \n你现在可以使用 `cout` 的基础知识，但关于 `cout` 和字符串还有很多需要学习。\n\n例如，你可以同时显示多个字符串。假设你想显示两个文本，但它们在两个不同的字符串中。根据前面的技术，代码看起来像这样：\n\
  \n```cpp\ncout << ”Red\";\ncout << ” Dragon\";\n```\n\n输出：Red Dragon\n\n然而，有一种更简单的方法。你可以并排显示任意数量的字符串并用\
  \ `<<` 分隔。你可以这样创建之前的代码片段：\n\n```cpp\ncout << ”Red” << ” Dragon”;\n```\n\n输出：\nRed\
  \ Dragon\n\n两个代码片段的输出完全相同，但第二个写起来稍微简单。\n\n此外，由于 C++ 的编写方式，你可以将代码拆分到多行。例如，之前的示例也等同于以下内容：\n\
  \n```cpp\ncout << ”Red”\n\n<< ” Dragon”;\n```\n\n输出：\nRed Dragon\n\n\n\n\n这实际上是一个平凡的例子，因为你可以使用单个较大的字符串（“Red\
  \ Dragon”）。\n\n通常情况下，你组织代码结构使其易于阅读。你应该在每个短语的开头放置一个新的 `cout`。例如，为了显示一句话关于龙的句子和一句关于精灵的句子，龙句中的所有内容应该放在一个\
  \ `cout` 之后，而精灵句中的所有内容应该放在另一个 `cout` 之后。这样，你的代码会更有组织，也更容易阅读。\n\n## 使用转义字符\n\n你不能在字符串中字面地表示引号（“”）和换行符等字符。\n\
  \n如果你在字符串中包含引号，编译器会认为该引号表示字符串的结束。例如，为了创建一个引用某人说话的字符串，你可能会写：\n\n“He said, “This is\
  \ a quote”。”\n\n然而，编译器会将此解释为两个独立的字符串，“He said,”和“。”。由于 `is a quote` 这些词被假设为非字符串，你最终会遇到语法错误。换行也会出现类似的问题。所有字符串必须包含在单行内，因此如果你尝试在字符串中间放置换行符，就会得到语法错误。幸运的是，这类问题有一个解决方案。\n\
  \n解决方案是使用转义字符。转义字符（或元字符）用于表示无法字面表示的字符。要创建一个转义字符，你将一个反斜杠（`\\`）和一个特定字符结合。例如，引号的转义字符是\
  \ `\\\"`。它在代码中看起来如下：\n\n```\n“He said, \\”This is a quote.\\\\n”\n```\n\n这段代码产生了所需的字符串。如果你输出这个字符串，He\
  \ said, “This is a quote.” 将显示在屏幕上。还有许多其他转义字符。\n\n表 1.1 总结了重要的转义字符。\n\n### 表 1.1\
  \ 转义字符\n\n| 名称 | 转义字符 |\n| :--- | :--- |\n| 换行 | `\\n` |\n| 制表符 | `\\t` |\n| 反斜杠\
  \ | `\\\\` |\n| 单引号 | `\\'` |\n| 双引号 | `\\\"` |\n\n你将会熟悉大多数这些转义字符，因为它们非常有用；事实上，其中一些，例如换行符（也称为行行符），是必不可少的。\n\
  \n## 存储字符串\n\n你可以在程序中存储字符串，这样你就不需要多次编写它们。\n\n具体来说，你通过将它们放入内存来存储字符串（我们在第 2 章“深入理解变量”中详细介绍内存）。提供在屏幕上显示对象支持\
  \ C++ 标准库也提供了存储字符串的支持。字符串的代码存储在一个命名恰当的 `string` 的文件中。正如我们在“Hello World”程序中所学习的那样，你可以通过在程序顶部放置一行特殊代码来使用\
  \ C++ 标准库：\n\n```cpp\n#include <string>\n```\n\n然后，在 `main` 函数内部，你声明想要从标准命名空间引入代码的特定部分，就像我们对\
  \ `cout` 做的那样：\n\n```cpp\nusing std::string;\n```\n\n当你想要存储一个字符串时，必须为它提供一个名称，以便计算机知道你将来想要访问哪个字符串。例如，我们将“A\
  \ dragon is coming”放入内存并将字符串命名为 `yell`。\n\n不过，这里有一个小复杂之处。C++ 可以在内存中存储许多东西。例如，除了字符串外，C++\
  \ 还可以存储数字。处理数字的规则与处理字符串的规则不同。因此，你必须声明存储的是什么类型的内容。我们将在第 2 章中进一步讨论这些区别。为了存储一个字符串，你必须提供：\n\
  \n- 存储内容的类型（在本例中是字符串）\n- 字符串的名称\n- 组成字符串的字符\n\n一旦你组装好所有这些组件，就准备好在内存中存储字符串：`string\
  \ yell = “A dragon is coming”;`\n\n首先是所存储内容的类型：字符串。其次是字符串的名称：`yell`。等号告诉计算机字符串“A\
  \ dragon is coming”正在存储在 `yell` 中。最后是分号，它告诉计算机你已经完成了该语句。\n\n## 显示存储的字符串\n\n到目前，你只显示了字面量字符串。现在，你准备好显示存储的字符串了。使用字符串的名称代替字符串本身可以让你能够显示存储的字符串。这里是之前的存储字符串示例，以供快速参考：`string\
  \ yell = “A dragon is coming”;`\n\n要显示该字符串，你使用它的名称（`yell`），而不是实际文本：\n\n```cpp\n\
  cout << yell.c_str();\n```\n\n前一行代码与下面的代码的作用相同，我们之前在“存储字符串”部分中使用过后者：\n\n```cpp\n\
  cout << ”A dragon is coming”;\n```\n\n不要担心字符串名称后面的 `.c_str()`；它只是导致字符串能够正常显示的“魔法”代码。我们将在第\
  \ 6 章“迈向高级数据类型”中解释这段魔法代码。\n\n## 镇叫程序\n\n你已经学习了如何创建保存的字符串以及如何使用 `cout` 将它们显示在屏幕上。现在，该通过创建镇叫程序来测试这些知识了。\n\
  \n想象一条龙正在靠近你的村庄，你必须向每个人大喊警告。\n\n如果你连续大喊四次警告让每个人听到，村庄就能被拯救。这显然是我们英雄的任务：只有存储的字符串和\
  \ `cout` 能拯救村庄。\n\n因此，你的目标是创建一个程序，连续显示四次你的警告文本。\n\n通常，接收输入的最重要的部分是单词 `cin`（读作“see-in”）。正如\
  \ `cout` 用于向屏幕显示文本一样，`cin` 用于从键盘读取输入。`cin` 也是 C++ 标准库的一部分，因此必须包含正确的文件：\n\n```cpp\n\
  #include <iostream>\n```\n\n是的，没错。它和 `cout` 在同一个文件中。`iostream` 同时处理输入和输出能力。当然，你还需要一个\
  \ using 声明：\n\n```cpp\nusing std::cin;\n```\n\n然后你终于准备好开始接收用户的输入了！\n\n## 使用 cin\
  \ 存储字符串\n\n你可以使用 `cin` 存储字符串，就像你之前存储它们的方式一样，不同的是你现在声明名称并在稍后赋值。当你赋值这个值时，你使用 `cin`\
  \ 对象。`cin` 对象代表键盘或其他输入设备，而 `cout` 对象代表屏幕或其他输出设备（如文件）。你将在第 5 章“软件设计：面向对象编程”中学更多关于对象的知识。这里有一个存储用户输入字符串的示例：\n\
  \n```cpp\nstring name;\ncin >> name;\n```\n\n\n\n\n注意，你使用 `cin` 的方式与使用 `cout` 非常相似。注意小于号现在变成了大于号。这些符号表示计算机正在接收数据，而不是显示数据。\n\
  \n以下是一个使用 `cin` 的完整程序示例：\n\n```cpp\n//1.3 - Hello Program – Dirk Henkemans\n\n#include\
  \ <iostream>\n\n#include <string>\n\n# Chapter 1 • Starting the Journey\n\n## 19\n\
  \nint main(void)\n{\n    using std::cout;\n    using std::cin;\n    using std::string;\n\
  \    string name = \"\"; \"\" means empty string\n    cout << \"What is your name?\\\
  n\";\n    cin >> name;\n    cout << \"\\nHello \" << name.c_str() << \"\\n\";\n\
  \    return 0;\n}\n```\n\n输出（**粗体文本**为用户输入）：\n\nWhat is your name?\nJackie\nHello\
  \ Jackie\n\n在前面的代码中，`string name` 告诉计算机内存中有一个空间用于存储名为 `name` 的字符串。记住，为了使用字符串，必须包含\
  \ C++ 标准库中的字符串组件。\n\n读取下面这一行\n`cout << \"What is your name?\\n\";`\n会向用户显示提示符。这个提示要求计算机写入用户的名字。\n\
  \n下一行 `cin >> name;` 告诉计算机停止运行，以便用户输入。当用户按下 Enter 键时，计算机会将用户在按下 Enter 之前输入的所有内容赋值给名为\
  \ `name` 的字符串。为什么要按 Enter？因为默认情况下读取字符串会读取到输入行的末尾。\n\n接下来，`cout << \"\\nHello \"\
  \ << name.c_str() << \"\\n\";` 首先告诉计算机从下一行开始。然后计算机在屏幕上显示 Hello，随后跟上用户的名字。例如，如果用户输入的名字是\
  \ Joe 或 Jane，屏幕上将显示 Hello Joe 或 Hello Jane。Hello 和名字之间的空格是因为是因为在“Hello 字符串”的末尾（闭合引号之前）添加了一个空格。\n\
  \n尽管关于文本还有很多内容需要学习，但你现在已经有了基本的理解，所以我们可以把注意力转向使用数字。\n\n## 20\n\n《初学者 C++ 编程》，第二版\n\
  \n### 数字数字操作\n\n计算机完全是基于数字的。数字是计算机上发生的一切活动的基础。在计算机世界中，掌握数字至关重要。\n\n在本节中，你将了解到基础数学、取模运算符以及如何使用整数（更多关于整数的内容请参见第\
  \ 2 章）。\n\n### 引入整数\n\n计算机可以用许多方式存储信息。但目前，我们涵盖了整数的基础以及如何使用它们。整数是指所有的整数，包括零以及正负数。例如，5、0\
  \ 和 –100 都是整数，而 0.5 不是整数。如果你尝试将小数存储为整数，计算机将通过截断剩余部分来响应；也就是说，计算机将删除小数点之后的所有内容。\n\n\
  ### 使用运算符操作\n\n广义地说，运算符是任何符号或双符号（例如 `<=`，在某些情况下甚至是像 `sizeof()` 这样的项），它会导致编译器执行某项操作。加、减、除除操作都使用运算符。例如，当你要求计算机两个数字相加时，你使用加法运算符（`+`），这听起来完全合理，不是吗？\n\
  \n我们都知道 `2 + 2 = 4`。以下是如何在 C++ 代码中实现相同操作的方法：\n```cpp\ncout << 2 + 2;\n```\n这一行会在屏幕上显示\
  \ 4。\n\n这四个基本运算符是不言自明的；它们的作用完全正如你可能认为的那样，但请花一点时间回顾每个运算符的符号：\n\n- 加法：+\n- 减法：–\n\
  - 乘法：*\n- 除法：/\n\n和数学一样，这些运算符并不是从左到右执行的。乘法和除法运算符在加、减法运算符之前执行，例如：`1 + 3 * 2`。\n\n\
  先执行 `3 * 2`，然后加上 `1`，得到数字 `7`。\n\n## Chapter 1 • Starting the Journey\n\n## 21\n\
  \n括号优先级最高。这意味着括号内的公式会被优先计算。如果你对前面的公式加上括号，如下所示：\n\n```cpp\n(1 + 3) * 2\n```\n`1 +\
  \ 3` 先执行，产生 `4`，然后乘以 `2`，得到 `8`。\n\n多加一些括号。这样做会让调试变得容易得多。`T R I C K` 拇指法则如下：如果你认为你的公式可能需要括号，就把它加进去。这种做法将使你的代码易于阅读和理解。\n\
  \n### 取模运算符\n\n回回六年级时，当你做长除法且答案总是整数吗？那时你开始处理余数，因为你当时还无法处理小数。有时，知道一个数被除后的余数特别有用。你使用取模运算符（`%`）来获取这些信息。`x`\
  \ 和 `y` 的取模是 `x` 除以 `y` 的余数。要找到 5 除以 2 的余数，你可以这样写：\n\n```cpp\n5 % 2\n```\n这一行返回\
  \ `1`。这是另一个例子。假设有五个海盗和 107 枚金币。海盗们需要计算宝藏是否可以平分，或者他们是否必须发生一场大醉斗殴。\n\n### 创建海盗火兵游戏\n\
  \n```cpp\n//1.4 - Hello Program - Dirk Henkemans\n\n#include <iostream>\n\n#include\
  \ <string>\n\nint main(void)\n{\n    using std::cout;\n    using std::cin;\n   \
  \ using std::string;\n\n    int buddies;\n    int afterBattle;\n    string exit;\n\
  \n    cout << \"你是一个海盗，正走在充满犯罪的哈瓦纳城（1789 年）。\\n\";\n    cout << \"你带了几个海盗伙伴？（11\
  \ 到 115 之间的任何数字）\\n\";\n    cin >> buddies;\n\n    afterBattle = 1 + buddies - 10;\n\
  \n    cout << \"突然间，10 名火兵从当地酒馆跳出来并拔出剑。\\n\";\n    cout << \"战斗中有 10 名火兵和 10 名海盗牺牲。只剩下\
  \ \" << (buddies + 1 - 10) << \" 名海盗，包括你。\\n\\n\";\n\n    cout << \"倒下的人留下了共 107\
  \ 枚金币。\\n\";\n    cout << \"赏金平分，每个幸存者获得 \" << (107 / afterBattle) << \" 枚币，留下了\
  \ \" << (107 % afterBattle) << 枚未认领的金币。\\n\";\n    cout << \"最后的 \" << (107 % afterBattle)\
  \ << 枚币将在大醉斗殴中争夺。\\n\";\n    cout << \"最后几枚金币在斗殴过程中被用来买更多的酒。最终每个人都在酒馆地板上和平地休息了。\\\
  n\";\n    cout << \"作为海盗又成功的一天！\\n\";\n\n    return 0;\n}\n```\n\n\n\n\n将文本或数字写入屏幕并设置程序，使其能够读取用户的输入，最简单的方法是使用\
  \ `iostream` 库。你使用 `cin` 来获取和处理用户的输入，并使用 `cout` 显示在屏幕上。为了使用 `cin` 和 `cout`，你必须在程序的开头包含\
  \ `<iostream>`。你可以显示并存储字符串和整数以便反复使用它们。你可以使用这些存储的数据让你的程序更短、更高效。此外，记住你可以在一个 `cout`\
  \ 语句中同时显示许多字符串和整数，它们必须用 `<<` 分隔。目前就到这里；你的冒险将在第 2 章继续。\n\n![](img/index-43_1.jpg)\n\
  ![](img/index-43_2.jpg)\n![](img/index-43_3.jpg)\n![](img/index-43_4.jpg)\n![](img/index-43_5.png)\n\
  \n**24**\n\n**零基础 C++ 编程，第二版**\n\n### 挑战\n\n1. 创建一个程序，显示一张看起来像图 1.9 中 ASCII 房屋的图片。\n\
  \n**图 1.9**\n一个 ASCII 房屋。\n\n2. 下面程序的输出是什么？\n```cpp\n#include <iostream>\n\nint\
