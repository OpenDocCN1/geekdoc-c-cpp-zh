  **初学者 C++ 编程，第二版**\n\n#### 4. 列出使用动态内存的三个理由。\n\n**答案：**\n\n- 你可以创建一个任意长度的数组。\n-\
  \ 动态内存比系统内存更丰富。系统内存由操作系统分配给程序，而程序是从大块空内存中“借用”动态内存。\n- 程序可以决定何时获取或释放内存。\n\n### 附录\
