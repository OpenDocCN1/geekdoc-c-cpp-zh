  \n# 前言\n\n视频游戏行业的独特之处在于，它经常融合了计算机科学的每一个主要学科。从 3D 图形、人工智能到操作系统理论和数据库设计，如果你正在设计一款商业视频游戏，你最终会遇到来自这些领域的问题。其中某些领域意味着要使用专门语言，但归根结底，游戏行业中像加班、咖啡因饮料和披萨一样常见的两种语言是\
  \ `C` 和 `C++`。尽管有少数商业游戏是用 `Java`（它与 `C++` 非常相似）编写的，但你玩过的几乎每个游戏都是用 `C` 或 `C++` 编写的。无论游戏运行在\
  \ PC、游戏机甚至街机上，其核心很可能是由 `C` 或 `C++` 程序组成。即使在某些性能要求必须用汇编语言编写程序以榨取更多速度的情况下，通常的做法也是先用\
  \ `C` 或 `C++` 编写该程序。\n\n在行业工作的多年里，我面试过一百多名编程岗位的申请者，并阅读过成千上万份简历。通过这一切，我不断在优秀的候选人身上寻找三点。第一是强大的解决问题能力。随着技术的不断变化和激烈的竞争，游戏编程总是向我们抛出新问题。因此，优秀的解决问题能力不仅是一种奢侈，更是一项要求。其次，一个优秀的候选人接触过计算机科学学科的整个领域。即使程序员专攻某个领域，问题的解决方案往往在于他们专业知识之外的领域。\n\
  \n最后，我寻找的是强大的 `C/C++` 技能。对于游戏程序员来说，`C/C++` 技能就像画笔之于画家。它们是赖以生存的工具，因此需要精加磨练。\n\n尽管\
  \ `C++` 被广泛用教学语言，但过去并非如此。我仍然记得我第一次接触 `C` 编程的场景。在那之前，我所有的编程都是 `Basic`（我的第一个视频游戏就是用它写的）、`Pascal`\
  \ 和 `Fortran`。我听过 `C`；根据传闻，它是必须掌握的语言。我非常期待我的下一门计算机科学课程：“编程语言导论”。我假设这门课程会教我如何用 `C`\
  \ 编程。我错了。整门课程对 `C` 的唯一提到是：“这是你们的作业。用 `C` 写。周三交。”“好的，”我想，“至少有一本课程教材是关于 `C` 的。”结果证明，那本教科书是关于如何从\
  \ `C` 语言访问 `UNIX` 操作系统的信息的。如果你对访问进程 ID 或使用 Shell 命令感兴趣，这很有用，但如果你想知道如何读取文件或编写函数，它就没太大帮助。\n\
  \n不知怎么，我设苦完成了作业，并在过程中实际上学到了一些东西。这并不是学习新语言最好的方法，但比我第一次接触 `C++` 要好。那是我毕业后的第一份工作。我在大学体育部工作，为各种研究项目编写软件。我从上一个程序员那里继承的项目中有一个只完成了一半，并且是用\
  \ `C++` 编写的。再次，我面临着一个生死攸关的抉择。这一次，我只有一本函数参考书，它只解释语言的语法，而没有如何使用它。我简直想要得到你现在手里拿着的这本书。噢，也许不是想要，但我绝对无法低估以这样有组织且直接的方式学习\
  \ `C++` 的重要性。当你阅读这本书时，请对我们这些没有你这种精良学习工具的人表示同情。\n\nScott Greig\nBioWare 公司编程部总监\n\
  \n# 致谢\n\n出版一本书所需的时间和精力是巨大的，这本书也不例外。作为参与这一巨大努力机器中的一个齿轮，我很难充分感激所有接触过这个版本的各之手。然而，如果没有我原始合作者\
  \ Dirk Henkemans 的雄心和驱动力，这本书将只是一个未竟实现的梦想。他的驱动力和毅力教会了我，像写书这样看似不可能的事情不仅是可能的，而且是轻松实现的。\n\
  \n感谢 Course Technology PTR 让这本书成为可能，并感谢我的策划编辑 Mitzi Koontz 的所有努力。\n\n我深感激技术编辑 Keith\
