  \ 地址确实是可变的，但此处翻译忠实原文文字）。\n\n（注：由于之前的回复出现了严重的错误，以上仅提供从“使用 this 指针”开始的后续翻译。如需要全文完整翻译，请告知。）\n\
  \n\n\n\n\n在前面的章节中介绍的所有变量只能存储一种特定的数据类型。如果你想存储第二条信息，必须创建另一个变量。这些类型的变量被称为标量变量。但当你必须存储一长串相关数据时会发生什么呢？为每一条数据创建一个新变量显然是不方便的。\n\
  \n如果你必须处理成千上万条员工记录该怎么办？任务很快就会变得难以应付。\n\n幸运的是，大多数问题都有解决方案。在这种情况下，数组就是解决方案。数组是一种特殊的变量，可以包含一组具有相同类型的数据。\n\
  \n# 第 6 章 内存管理\n\n数组包含一组数据。该集合中的每个成员被称为元素（element）。每个元素都有一个与之相关的特定索引（index）。索引是一个指示你正在访问数组中哪一个元素的数字。\n\
  \n初学者往往对数组中一个看似很奇怪的事情感到困难：索引编号从 0 开始。因此，如果你有一个有五个元素的数组，索引将是 0, 1, 2, 3 和 4。在操作数组一段时间后，你就会习惯这种奇怪的编号，它会开始变得很自然。图\
  \ 6.2 将数组显示为排成一排的盒子，数组名为 `charArray[]`，每个盒子内有单独的数组元素（如 `char_array[0]`）。\n\n###\
  \ 创建数组\n\n创建数组是一个简单的过程，特别是现在你已经学习了变量。要创建一个数组，请输入数据类型，然后是变量名，最后加上下标运算符。这里是基本语法：\n\
  \n```\ndata_type array_name[number_of_elements];\n```\n\n这创建了一个名为 `array_name`、类型为\
  \ `data_type` 且包含 `number_of_elements` 个元素的数组。\n\n例如，要创建一个包含 10 个元素的名为 `int_array`\
  \ 的整数数组，你需要输入 `int int_array[10];`。\n\n记住索引从 0 开始，因此元素将标记为 0 到 9。元素 10 实际上并不存在于此数组中，尽管当你在查看声明时它看起来是存在的。\n\
  \n你可以创建所有数据类型类型的数组，包括用户定义类型。如果你有一个名为 `MyClass` 的类，你可以像这样创建一个包含 10 个 `MyClass` 对象的数组：\n\
  \n```\nMyClass my_class_array[10];\n```\n\n方括号之间的数字必须是一个常量表达式，这意味着你不能使用变量来定义数组的元素数量。正如你将在后面的章节中发现的，无法调整大小是使用数组的一个主要缺点——与其它高级数据类型相比。\n\
  \n以下是一些数组声明的示例：\n\n```\nint int_array[10];\nfloat float_array[60];\nchar char_array[6];\n\
  ```\n\n### 初始化数组\n\n你可以通过几种方式填充数组数据。首先，你可以在声明数组的同时对其初始化。你通过初始化列表（initializer list）来实现，这是一个用于填充数组的值列表列表。你使用的语法如下：\n\
  \n```\narray_type array_name[number_of_elements] = {value1, value2, value3, ...};\n\
  ```\n\n这里的 `value1`、`value2` 等都是 `array_type` 类型的值。注意，如果你以这种方式进行初始化，可以留空 `number_of_elements`。计算机将根据初始化列表中的元素数量来决定数组的大小。这里是一些示例：\n\
  \n```\nfloat float_array[3] = {0.25, .876, 3.0};\nchar char_array[5] = {'H','e','l','l','o'};\n\
  ```\n\n如果你没有包含数组将拥有的元素数量，但包含了初始化列表，则数组将默认为初始化列表中的元素数量。在接下来的代码行中，`char_array2` 将自动假设数组大小为\
  \ 6：\n\n```\nchar char_array2[] = {'d','r','a','g','o','n'};\n```\n\n如果你初始化列表中的值没有\
  \ `number_of_elements` 多，剩余的值将被假设为 0。例如，输入\n\n```cpp\nint my_array[5] = {1,2,3};\n\
  ```\n\n等同于输入\n\n```cpp\nint my_array[5] = {1,2,3,0,0};\n```\n\n初始化数组的另一种方法是使用 `for`\
  \ 循环。要这样做，首先像通常一样声明数组，然后创建一个 `for` 循环来用值填充它。这是一个示例：\n\n```cpp\nint int_array[10];\n\
  for (int i = 0; i < 10; i++)\n{\n    int_array[i] = i;\n}\n```\n\n注意循环执行了十次，每次对应数组的一个元素。在这个示例中，我们给每个元素赋值为其索引的值，但你也可以为每个元素分配任何你的值。\n\
  \n### 使用数组\n\n访问数组元素与创建数组类似。数组中的每个元素都充当一个独立的标量变量。要访问特定元素，你使用数组名，后跟下标运算符内的索引数字：\n\
  \n```\narray_name[Index_number];\n```\n\n这等同于仅使用标量变量的名字。例如，如果你声明了数组\n\n```cpp\n\
  char char_array[10];\n```\n\n这里的 `char_array2` 将自动假设数组大小为 6：\n\n```\nchar char_array2[]\
  \ = {'d','r','a','g','o','n'};\n```\n\n如果你想显示第四个元素（索引 3），你可以这样做：\n\n```\ncout <<\
  \ char_array[3];\n```\n\n### 数组与指针的关系\n\n数组和指针紧密相关。事实上，在严格定义下，数组就是指针。考虑这个数组：\n\n\
  ```\nfloat f[10];\n```\n\n`f` 指向数组的第一个元素：\n\n```\ncout << *f;\n```\n\n如果你声明一个名为\
  \ `pf` 的指针指向 `f` 的第一个元素：\n\n```cpp\nfloat* pf = f;\n```\n\n这段代码等同于以下代码：\n\n```cpp\n\
  float* pf = &f[0];\n```\n\n你可以通过增加指针遍历数组的每一个元素。等等！由于指针存储的是内存地址，增加指针会改变地址。然而，并不是增加\
  \ 1，而是增加了指针的大小。正如示例所示，这有效地移动到了下一个元素：\n\n```cpp\nfloat f[] = {5.5, 0.5, 6.7};\nfloat*\
  \ pf = f;\ncout << *pf;\ncout << \" \" << *(++pf);\ncout << \" \" << *(++pf);\n\
  ```\n\n这段代码在屏幕上显示 5.5 0.5 6.7。每次增加指针，它都会移动到数组的下一个元素。如果对指针使用递增运算符，C++ 假设指针指向数组，但它实际上并没有检查，所以要确保只对数组元素递增。\n\
  \n递减运算符 `--` 的工作方式相同（参见第 2 章，“深入研究变量”）。每次在指针上使用时，它都会将指针向后移动一个元素。注意不要超过数组的边界；这样做可能会导致许多难以发现和调试的错误。\n\
  \n你还可以对指针进行加减操作。如果 `p` 是一个数组的指针，`p+n` 将指针向前移动 `n` 个元素，而 `p-n` 将向后移动 `n` 个元素。\n\n\
  这里是使用指针遍历数组的示例：\n\n```cpp\nint n[] = {0,1,2,3,4,5};\nint* pn = n;\ncout << *(pn+3)\
  \ << \"\\n\";\ncout << *++pn << \"\\n\";\n*pn--;\ncout << *pn << \"\\n\" << *(pn+4)\
  \ << \"\\n\";\n```\n\n**输出：**\n\n```\n3\n1\n0\n4\n```\n\nC++ 不会阻止你尝试访问不再属于该数组的值。例如，如果你在先前的\
  \ `n[]` 数组中将指针增加超过 5，C++ 将乐意返回你的计算机存储在那里的所有数据。\n\n\n\n\n更糟糕的是，如果你尝试操作数据，而这些数据是 Windows\
  \ 或另一个程序所需的，你可能会导致计算机崩溃。访问不再数组中的数据被称为“越界”（walking off the array）。\n\n### 创建动态数组\n\
  \n通常，在创建数组时，你必须提供一个常量表达式作为数组中元素的个数。如果你尝试使用变量表达式，编译器将抛出错误。例如，如果你尝试创建一个数组：\n\n```cpp\n\
  int x = 5;\nchar s[x];\n```\n\n编译器将返回错误，说明需要一个常量表达式。\n\n如果你在空闲区（free store）上创建数组，你可以使用变量表达式作为元素的个数，如下所示：\n\
  \n```cpp\nint x = 5;\nchar* s = new char[x];\n```\n\n要释放前述数组的内存，你使用 `delete[]` 运算符。`delete[]`\
  \ 运算符的作用与 `delete` 运算符完全相同：\n\n\n\n```cpp\ndelete[] s;\n```\n\n这会释放整个数组，因此你不需要担心每个元素。\n\
  \n### 多维数组\n\n虽然多维数组起初可能是一个困难的概念，但将它们视为“数组的数组”是有帮助的。查看图 6.3，你可以看到数组中有五个主元素（大盒子），每个主数组元素又包含一个长度为\
  \ 4 的数组。这种形式是一个 5 × 4 的多维数组。\n\n**图 6.3**\n将二维数组想象成“盒子的盒子的”。在每个数组内部都是另一个数组。\n\n\
  要创建一个二维数组，你在声明末尾加上一个下标运算符，如下所示：\n\n`array_type array_name[number_of_elements][number_of_elements2];`\n\
  \n这段代码创建了一个包含 `number_of_elements` 个数组的数组，其中每个数组包含 `number_of_elements2` 个 `array_type`\
  \ 元素。例如：\n\n```cpp\nint my_Array[5][4];\n```\n\n创建了一个具有五个元素的数组。这五个元素中的每一个都是一个包含四个整数的数组。将多维数组元素想象成内存盒子，每个盒子都包含一个数组；同样，这个概念在图\
  \ 6.3 中得到了说明。\n\n数组可以拥有任意数量的维度。然而，过多的数组数组会迅速耗尽计算机的内存。\n\n将二维数组想象成盒子的盒子的。在较大的盒子数组内部，是一个较小盒子的数组。数组内部的数组是多维数组的基础。\n\
  \n多维数组也可以通过将所有尺寸相乘来表示为单维数组。如果你有一个二维数组，如 `char my_Array[10][10];`，你可以通过 10 乘以 10\
  \ 得到 100，从而创建一个等价单维数组。因此，数组\n\n\n\n```cpp\nchar my_Array[100];\n```\n\n其整数元素（总数）与之前的二维数组相同。\n\
  \n遍历多维数组中所有元素的常用方法是在 `for` 循环内部嵌套 `for` 循环。以下示例将初始化多维数组中的所有元素：\n\n```cpp\n//6.1\
  \ - 多维数组 - Dirk Henkemans and Mark Lee\n#include <iostream>\n\nint main(void)\n\
  {\n{\n    using std::cout;\n    int numbers[10][10];\n    for (int i = 0; i < 10;\
  \ i++)\n        for (int c = 0; c < 10; c++)\n            cout << (numbers[i][c]\
  \ = (i * 10) + c) << \"\\n\";\n    return 0;\n}\n```\n\n输出：\n0 1 ... 98 99\n\n##\
  \ 字符串复习\n\n我们在书的早期部分介绍过字符串（例如参考第 1 章）。然而，你仅接触了字符串的皮毛。在这里，你重新回顾字符串，以更详细地了解字符串的工作原理以及你可以对它们做什么。\n\
  \n在 C 中，字符串被表示为字符数组，而不是像在 C++ 中那样的对象。由于由于，你经常看到字符串被表示为字符数组。因此，我们将详细介绍 C 风格字符串的工作原理，以便你能够读懂所有的\
  \ C++ 代码。\n\n### 字符串字面量\n\n字符串字面量（如“Hello”）的官方类型是 `const char []`。字符串“Hello”的类型是\
  \ `const char [6]`。但是，等等！Hello 这个词有五个字母，而不是六个！别担心，我们没有犯错。多出来的字符是因为你必须有一个终止空空字符 `\\\
  0`（值为 0），它告诉计算机字符串的长度。\n\n每个字符串字面量末尾都有一个隐藏的空字符（`\\0`），这样某些算法就能知道字符串的长度以及何时到达字符串末尾。并不是所有算法都需要知道字符串的长度，但大多数都需要。\n\
  \n你可以将字符串字面量赋值给类型为 `char*` 的变量，如下：`char* x = \"Hello\";`。然而，`x` 指向的值不能被操作。如果它不是常量，代码将产生错误，如下例：\n\
  \n```cpp\nx = 'S';\n```\n\n这段代码会导致错误，因为你不能更改常量的值。如果你需要指向一个可以修改的字符串，必须将字符串字面量赋值给字符串对象或字符数组。这里有一个例子：\n\
  \n```cpp\nchar s[] = \"Hello\";\ns[0] = 'S';\n```\n\n这段代码是允许。许多 C 标准库函数接受 `char*`\
  \ 作为参数。\n\n### 字符数组\n\n正如你所见，字符数组是表示字符串的另一种方式。你可以用字面量初始化字符数组，如下所示：`char s[] = \"\
  Hello!\"`。由于你不需要提供数组的长度，这种方式声明字符串几乎和字符串类一样方便。字符串字面量末尾有一个空字符。如果没有它，你将无法判断字符串何时结束。\n\
  \n### 确定字符串长度\n\n要获取 `s[]`（来自“字符数组”节）的长度，你可以使用确定数组长度的方法——使用 `sizeof` 运算符。\n\n例如，为了获取前述示例中\
  \ `s` 的长度，你执行操作：\n\n```cpp\ncout << sizeof(s);\n```\n\n这段代码在屏幕上显示数字 13。我们没有除以 `char`\
  \ 的大小，因为 `char` 的大小总是 1。\n\n这种方法有一个小问题。字符串长度是 12，而不是 13。如果你通过 `sizeof` 获取大小，空字符会被包含在长度内。要获取不包含空字符的长度，你可以从得到的长度减\
  \ 1，或者使用标准库。\n\n名为 `strlen()` 的函数返回任何字符串的长度。例如，要找到之前示例中 `s[] = \"Hello!\"!\" 的长度，编写这段代码：\n\
  \n```cpp\ncout << strlen(s);\n```\n\n这段代码在屏幕上显示正确的字符串长度 12，而不是 13，因为 `strlen()`\
  \ 通过计算到第一个空字符之前的元素来确定长度。例如，对于像 `char weird_string = \"Hello\\0 World\";` 这样的字符串，`strlen()`\
  \ 返回 5。如果你通过 `sizeof` 运算符确定字符串长度，然而，你得到 14（两个空字符）。\n\n`strlen()` 函数的原型如下：\n\n```cpp\n\
  int strlen(const char*)\n```\n\n要使用此函数，你必须在程序中包含 `<string>`。\n\n\n\n\n你可以在标准库中找到许多其他\
  \ C 风格的字符串函数。本节将介绍其中几个，作为对这些众多函数的介绍。你在此节中将过的函数包括用于拷贝字符串的 `strcpy()` 和用于拼接字符串的 `strcat()`。\n\
  \n要使用这些函数，你需要包含 `<cstring>`。将一个字符串拷贝到另一个字符串中，请使用函数 `strcpy()`（string 拷贝）。函数的原型如下：`char*\
  \ strcpy(char* p, const char* q);`\n\n此函数将 `q` 中的每个元素放入 `p` 中。例如，如下所示调用函数：\n\n```\n\
  char s[6];\nstrcpy(s, \"Hello\");\n```\n\n这会导致 `s` 持有值 `\"Hello\"`（包括终止的空字符）。该函数返回的\
  \ `char*` 是 `q` 的值（即被复制的值）。\n\n此函数不会检查传递给 `p` 的数组是否足够大以容纳 `q` 中的所有值。它只是直接复制。因此，你必须确保传递给\
  \ `p` 的数组至少与 `q` 一样。\n\n**164**\n**C++ Programming for the Absolute Beginner, Second\
  \ Edition**\n\n这里是一个使用 `strcpy()` 函数拷贝字符串的示例：\n\n```\nchar s[6];\nchar t[] = \"\
  Hello\";\ncout << strcpy(s, t);\n```\n\n这段代码在屏幕上显示 Hello，并将 `s` 拷贝为字符串 `\"Hello\"\
  `。\n\n要拼接两个字符串（将一个字符串附加到另一个的末尾），你使用函数 `strcat()`。`strcat()` 函数的原型如下：\n\n`char* strcat(char*\
  \ p, const char* q);`\n\n此函数将字符串 `q` 附加到 `p` 的末尾。例如，如果你使用该函数：\n\n```\nchar s[12]\
  \ = \"Hello\";\ncout << strcat(s, \" World\");\n```\n\n`s` 持有值 `\"Hello World\"\
  `（末尾有一个空字符）。该函数返回的 `char*` 是整个拼接后的字符串。在示例中，屏幕上显示了 Hello World。\n\n函数 `strncpy()`会执行\
  \ `strcpy()`，但只会将 `q` 的特定数量字符拷贝到 `p` 中。`strncpy()` 的原型如下：\n\n`char* strncpy(char*\
  \ p, const char* q, int n);`\n\n此原型将 `q` 的 `n` 个字符拷贝到 `p` 的末尾。例如，编写：\n\n```\nchar\
  \ s [7] = \"Say \";\nchar t[] = \"Hi\";\ncout << strncpy(s, t, 2);\n```\n\n会导致 `s`\
  \ 的新值变为字符数组 `\"Say Hi\"`。这个字符串也会显示在屏幕上，因为它是 `strncpy()` 返回的值。\n\n### 将字符串转换为数字\n\
  \n你还可以使用几个函数将包含数值的字符串转换为数值（例如，将 `\"5\"` 转换为 5）。这些函数声明在 `<cstdlib>` 中。\n\n要将整数的字符串表示转换为整数，请使用\
  \ `atoi()` 函数。该函数的原型如下：\n\n`int atoi(const char* p);`\n\n**第 6 章 • 内存管理**\n**165**\n\
  \n要使用此函数，你传递一个字符串，函数返回一个整数。这里是一个示例：\n\n```\nchar s[] = \"567\";\nint x = atoi(s)\
  \ + 3;\ncout << x;\n```\n\n这段代码在屏幕上显示数字 570。\n\n你还可以使用函数将字符串转换为 double 以及将字符串转换为\
  \ long；它们分别是 `atof()` 和 `atol()`。它们的原型与 `atoi()` 的原型相似：\n\n`double atof(const char*\
  \ p);`\n`long atol(const char* p);`\n\n这些函数的工作方式与 `atoi()` 完全相同。\n\n如果字符串不包含数字（例如`\"\
  HI\"`），则返回 0。\n\n这些函数对于接收用户输入非常有用。与其假设用户会输入有效的数字，你不如让他们输入一个字符串。然后你可以检查该字符串是否可以转换为数字。这是接收用户输入的一种更安全的方法。\n\
  \n## 开始学习引用\n\n你已经走了很远了。恭喜你！现在，你准备好学习如何使用引用了。\n\n引用是变量的别名，或替代名称。你可以将引用认为是一个始终被解引的常量指针。引用与常量非常相似，因为它们必须在声明时初始化，并且之后它们的值不能更改。\n\
  \n要创建引用，你使用引用运算符 (`&`)。不要将此运算符与取地址运算符混淆。你可以根据当前的上下文判断哪是哪一个。\n\n这是声明引用的语法：\n\n`data_type&\
  \ reference_name;`\n\n这里 `data_type` 是引用所引变量的类型，`reference_name` 是引用的名称。要初始化引用（在你声明时必须这样做），你将一个\
  \ `data_type` 类型的变量赋值给引用创建：\n\n`data_type& reference_name = variable;`\n\n**166**\n\
  **C++ Programming for the Absolute Beginner, Second Edition**\n\n这里是一个创建并初始化引用的示例：\n\
  \n```\nint x;\nint& rx = x;\n```\n\n前面的代码导致 `rx` 成为变量 `x` 的引用。奇怪的是，运算符并不作用于引用本身。它们只作用于引用所引用的变量。例如，如果递增\
  \ `rx`：\n\n```\nrx++;\n```\n\n`x` 会增加 1。`rx` 只是 `x` 的另一个名字。\n\n## 在参数中使用引用\n\n你主要将引用用函数参数。例如，你可以写一个改变传递给它的参数的函数：\n\
  \n```\nvoid decrement(int& x) { x--; }\n```\n\n然后你可以如下所示使用该函数：\n\n```\nint a = 5;\n\
  decrement(a);\ncout << a;\n```\n\n输出：4\n\n因为 `x` 是一个引用，它发生了变化。\n\n## 将引用作为函数返回值\n\
  \n正如你所料的，你可以返回一个变量的引用。这看起来比使用指针干净得多。考虑示例：\n\n```cpp\nclass Point {\n    int X, Y;\n\
  public:\n    Point(int lX, int lY) : X(lX), Y(lY) {}\n    int& GetX() { return X;\
  \ }\n    int& GetY() { return Y; }\n};\n```\n\n```cpp\nPoint p(5,3);\np.GetX() =\
  \ 3;\np.GetY() = 5;\n```\n\n输出：5\n\n因为 `GetX()` 和 `GetY()` 返回成员变量 `X` 和 `Y` 的引用，你可以将这些函数调用作为*左值*（*lvalues*\
  \ 是可以更改的值或变量）。更改这些引用的值会改变成员变量。\n\n\n\n\n# 169\n\n```cpp\n{\nif(*gameBoard==X &&\
  \ *(gameBoard +1)==X && *(gameBoard +2)==X) return X;\nif(*gameBoard==O && *(gameBoard\
  \ +1)==O && *(gameBoard +2)==O) return O;\nif(*(gameBoard +3)==X && *(gameBoard\
  \ +4)==X && *(gameBoard +5)==X) return X;\nif(*(gameBoard +3)==O && *(gameBoard\
  \ +4)==O && *(gameBoard +5)==O) return O;\nif(*(gameBoard +6)==X && *(gameBoard\
  \ +7)==X && *(gameBoard +8)==X) return X;\nif(*(gameBoard +6)==O && *(gameBoard\
  \ +7)==O && *(gameBoard +8)==O) return O;\nif(*gameBoard==X && *(gameBoard +3)==X\
  \ && *(gameBoard +6)==X) return X;\nif(*gameBoard==O && *(gameBoard +3)==O && *(gameBoard\
  \ +6)==O) return O;\nif(*(gameBoard +1)==X && *(gameBoard +4)==X && *(gameBoard\
  \ +7)==X) return X;\nif(*(gameBoard +1)==O && *(gameBoard +4)==O && *(gameBoard\
  \ +7)==O) return O;\nif(*(gameBoard +2)==X && *(gameBoard +5)==X && *(gameBoard\
  \ +8)==X) return X;\nif(*(gameBoard +2)==O && *(gameBoard +5)==O && *(gameBoard\
  \ +8)==O) return O;\nif(*gameBoard==X && *(gameBoard +4)==X && *(gameBoard +8)==X)\
  \ return X;\nif(*gameBoard==O && *(gameBoard +4)==O && *(gameBoard +8)==O) return\
  \ O;\nif(*(gameBoard +2)==X && *(gameBoard +4)==X && *(gameBoard +6)==X) return\
  \ X;\nif(*(gameBoard +2)==O && *(gameBoard +4)==O && *(gameBoard +6)==O) return\
  \ O;\nreturn blank;\n}\n```\n\nvoid `GameBoard::draw()`\n\n# 170\n\n**《初学者 C++ 编程（第二版）**\n\
  \n```cpp\nusing std::cout;\ncout << “\\n”;\nfor(int i=0; i < HEIGHT; i++)\n{\n \
