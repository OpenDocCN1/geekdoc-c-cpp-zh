  Cracker Jack\";\n    f[1].price = 6;\n    f[2].name = \"Camel\";\n    f[2].price\
  \ = 9;\n    Store s = Store(f,3);\n    while(true) {\n        do {\n           \
  \ cout << \"Welcome to the store.\\n\"\n            << \"You have \" << s.getMoney()\
