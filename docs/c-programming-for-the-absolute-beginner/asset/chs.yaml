  • 封装：将每个任务封装在单个对象中。\n• 多态：每个对象可以在它使用的任何程序中完成其任务。这允许代码的可移植性和重用性。\n\n### 3. 类和对象的区别是什么？答案：类是蓝图，而对象是蓝图的实例。\n\
  \n\n\n\n类就像一个模板，它告诉计算机如何创建东西。声明一个类本质上是在告诉编译器：“这是一个新的数据类型，这就是它所能做的事情。”类类似于一个尚未调用的函数。对象是类的实例；基本上，你是取了类并根据它创建了东西。对象占用内存空间，而类不占用。\n\
  \n### 330\n**初学者 C++ 编程，第二版**\n\n#### 4. 如果在不丢失功能的情况下需要在声明公共（public）、私有（private）、全局（global）或局部（local）之间选择，你应该选择哪个作用范围？\n\
  \n**答案：**\n\n选择局部（local），因为它比任何其他范围都能在更小的作用范围内保护数据。这符合面向对象编程（OOP）的数据抽象原则。\n\n####\
