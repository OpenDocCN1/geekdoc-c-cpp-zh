    # Math Function Mania


    When keyboard characters and symbols for operators run dry, the C language resorts
    to employing various functions for mathematical operations. Those times that you''re
    desperate to find the arctangent of an angle, you can whip out the atan() function
    and, well, there you go.


    +   - Most math functions require including the math.h header file in your code.
    Some functions may also require the stdlib.h header file, where stdlib means standard
    library.

    +   - If you''re compiling at the command prompt in Linux, you may be required
    to include the math library in the command that builds the program. For example:


    ```

    clang -Wall ex1111.c -lm

    ```


    The clang compiler is used in the preceding command with the -Wall switch (all
    warnings), followed by the source code filename, ex1111.c. At the end of the command,
    the -l (little L) switch is followed by m, the name of the math library. This
    switch directs the linker to add the math library, which helps it incorporate
    various math functions.'
