    In Code::Blocks, the process of compiling and linking C language source code is
    accomplished in one step called Build.


    To build the project, click the Build button on the toolbar, as shown in the margin
    and illustrated in Figure 1-1. Any compiler warnings or errors appear on the Build
    Log tab at the bottom of the window. For Listing 1-1, no warnings or errors should
