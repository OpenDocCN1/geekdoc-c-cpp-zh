    \nint main()\n{\n    int start = 0;\n\n    printf(\"The starting value is %d.\\\
    n\",start);\n    return(0);\n}\n```\n```\n\nExercise 6-8: Build a program by using\
    \ the source code shown in Listing 6-5.\n\nExercise 6-9: Modify the source code\
