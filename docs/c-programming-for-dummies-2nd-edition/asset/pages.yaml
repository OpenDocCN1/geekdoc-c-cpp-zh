    To test-run the program, click the Run button, shown in the margin and illustrated
    in Figure 1-2. Output appears in a terminal window, as shown in Figure 1-2.


    ![](img/dcc0cd79d4a45cfce24fa49d85442884_33_0.png)


    Press the Enter key to close the output window. In Linux, you must type the exit
    command to close the window.


    Both build and run steps are combined when you click the Build and Run button,
    shown in the margin.


    When you’re done with a project, or even after you’ve changed a minor thing, save
    it. Save the source code file, but also save the project if one was created. Choose
    File, Save Everything to save both the source code and project files.


    +   Commands for building and running the code are also found on the Build menu.


    +   The keyboard shortcuts for Build, Run, and Build and Run are Ctrl+F9, Ctrl+F10,
    and F9, respectively. No need to memorize those shortcuts; they’re listed on the
