  md: '# CHANGE AN ARRAY’S SIZE, WILL YOU?


    When an array is declared in C, its size is set. After the program runs, you can
    neither add nor remove more elements. So if you code an array with 10 elements,
    as in


    ```

    int topten[10];

    ```


    you cannot add an 11th element to the array. Doing so leads to all sorts of woe
    and misery.


    To use nerdy lingo, an array in C is not dynamic: it cannot change size after
    the size has been established. Other programming languages let you resize, or
    redimension, arrays, but not C. A workaround for dynamic storage does exist in
    C, but it involves using pointers to allocate storage. This scary topic is avoided
    until Chapter 18.


    Exercise 12-15: Modify the source code from Exercise 12-14 so that the numbers
    are sorted in reverse order, from largest to smallest.


    Exercise 12-16: Write a program that sorts the text in the 21-character string
    “C Programming is fun!”




    The arrays described in the first part of this chapter are known as single-dimension
    arrays: They’re basically a series of values, one after the other. This organization
    is fine for describing items that match single file. When you need to describe
    items in the second or third dimension, you conjure forth a multidimensional type
    of array.




    It helps to think of a two-dimensional array as a grid of rows and columns. An
    example of this type of array is a chess board — a grid of eight rows and eight
    columns. Though you can declare a single 64-element array to handle the job of
    representing a chess board, a two-dimensional array works better. Such a thing
    is declared this way:


    ```

    int chess[8][8];

    ```'
