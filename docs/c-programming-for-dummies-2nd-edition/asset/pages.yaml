    # Chapter 1


    # A Quick Start for the Impatient


    You''re most likely eager to get started programming in C. I shan''t waste your
    time.


    ![](img/dcc0cd79d4a45cfce24fa49d85442884_24_0.png)


    If you already have a compiler or an IDE set up and are ready to go, skip to Chapter
    2.


    # What You Need to Program


    The two most important things you need to begin your programming adventure are


    +   » A computer

    +   » Access to the Internet'
  merge: -1
