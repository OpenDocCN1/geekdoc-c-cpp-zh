    Hint: Refer to Table 4-1, in Chapter 4.


    +   » A string "variable" in C is really a character array.

    +   » You can initialize a string to a char array when it''s created, similarly
    to the way you initialize any variable when it''s created. The format looks like
    this:


    ```

    char string[] = "text";

    ```


    In the preceding line, string is the name of the char array, and text is the string
    assigned to that array.


    +   » You cannot reassign or change a character array''s contents by using a direct
    statement later in the code, such as


    ```

    prompt = "This is just wrong.";

    ```


    Changing a string is possible in C, but you need to know more about arrays, string
    functions, and especially pointers before you make the attempt. Later chapters
    in this book cover these topics.


    +   » See Chapter 6 for an introduction to the basic C language data types. The
    full list of C language data types is found in Appendix D.


    # Introducing the scanf() function


    For the input of specific data types, the scanf() function comes in handy. It''s
    not a general-purpose input function, and it has some limitations, but it''s great
    for testing code or grabbing values.


    In a way, you could argue that scanf() is the input version of the printf() function.
    For example, it uses the same conversion characters (the % placeholder-things).
    Because of that, scanf() is quite particular about how text is input.'
