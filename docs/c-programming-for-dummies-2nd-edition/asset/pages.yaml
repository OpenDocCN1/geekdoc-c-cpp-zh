  md: 'Exercise 22-6: Type the source code from Listing 22-5 into a new project. Build
    and run.


    Most everything that goes on in Listing 22-5 is familiar to you. The problem?
    Binary data wasn''t written. Instead, the fprintf() function at Line 17 writes
    the int value to the file as a text string. To prove it, examine the contents
    of the scores.dat file and you see that the value is stored as plain text.


    # Exercise 22-7


    Replace Line 17 from the code for your solution to Exercise 22-6 with this statement:


    ```

    fwrite(&highscore, sizeof(int), 1, handle);

    ```


    Save the change. Build and run. When you try to examine the contents of the scores.dat
    file now, it isn’t plain text. That’s because binary information was written,
    thanks to the fwrite() function.


    Here’s the format for fwrite():


    ```

    fwrite(variable_ptr, sizeof(type), count, handle);

    ```


    The fwrite() function is concerned with writing chunks of information to a file.
    Unlike the fprintf() and fputs() functions, it doesn’t always write text.


    Arrays and strings need not be prefixed with the & operator when specified in
    the fwrite() function.


    size of(type) is the variable''s storage size based on the type of variable —
    int, char, and float, for example.


    count is the number of items to write. If you were writing an array of ten int
    values, you specify 10 as the size.


    handle is the file handle address, returned from an fopen() function.


    # Exercise 22-8


    Using the source code from Listing 22-5 as a start, write a program that saves
    an array of five high-score values to the file scores.dat. (It''s okay if the
    program overwrites the original scores.dat file.)


    The next section covers how to read binary data from a file.'
