    # Chapter 8


    # Decision Making


    Decision making is the part of programming that makes you think a computer is
    smart. It''s not, of course, but you can fool anyone by crafting your code to
    carry out directions based on certain conditions or comparisons. The process is
    easy to understand, but deriving that understanding from the weirdo way it looks
    in a C program is why this chapter is necessary.


    # What If?


    All human drama is based on disobedience. No matter what the rules, no matter
    how strict the guidelines, some joker breaks free and the rest is an interesting
    story. This adventure begins with the simple human concept of “what if.” It’s
    the same concept used for decision making in your programs, though in that instance
    only the word if is required.


    # Making a simple comparison


    You make comparisons all the time. What will you wear in the morning? Should you
    avoid Bill’s office because Marjorie says he’s “testy” today? And how much'
