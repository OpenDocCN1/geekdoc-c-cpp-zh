  md: '# Give Me Memory!


    Don''t tell a beginning programmer, but declaring a variable in C is in reality
    directing the program to beg for some storage space from the operating system.
    As you know (hopefully, you know), the operating system is the Lord High Master
    of the computer or whatever electronic device you''re programming. As such, it
    doles out RAM to programs that request it.


    When you declare a variable, from a lowly short int to a massive string buffer,
    you''re directing the program to beg for that much space, into which you plan
    to put something useful. In the C language, you can also allocate memory on the
    fly, as long as you have an army of pointers at hand to save the addresses.


    # Introducing the malloc() function


    The malloc() function allocates a chunk of memory; think “memory allocation,”
    malloc. You pass it a size_t (byte) value, and it returns the address — a pointer
    — for the allocated chunk. When something horrible happens, it returns the NULL
    pointer constant. Here''s the format:


    ```

    p = malloc(size);

    ```


    The size argument is a size_t value, the same data type returned by the sizeof
    operator. Unofficially, it''s a byte. Officially, programmers set this value based
    on the size of the data type they want to store in the memory chunk. More on that
    in a bit.


    The value returned is a pointer, p, a memory location. The NULL constant is returned
    otherwise, which must be checked for to confirm that memory was allocated. If
    not, your program gets into all kinds of trouble.


    ![](img/dcc0cd79d4a45cfce24fa49d85442884_321_0.png)


    The NULL constant is not the same thing as the null character, \0, marking the
    end of a string. NULL is a pointer equivalent used to test for unallocated memory.
    The null character is character code zero, a byte value.


    Most programmers use the sizeof operator to set the malloc() function''s argument.
    For example, if you need space to store five int values, you construct a malloc()
    statement like this:


    ```

    p = malloc( sizeof(int) * 5 );

    ```


    The sizeof operator obtains the storage required for a single integer value, multiplied
    by five, to allocate a 5-integer storage buffer.'
