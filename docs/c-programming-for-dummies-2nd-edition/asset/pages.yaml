  md: "# Functions and Variables\n\nI'm fond of saying that functions gotta funct.\
    \ That is, they need to do something, to work as a machine that somehow manipulates\
    \ input or generates output. To make your functions funct, you need to know how\
    \ to employ variables to, from, and within a function.\n\n# Using variables in\
    \ functions\n\nFunctions that use variables must declare those variables — just\
    \ like the main() function does. In fact, it's pretty much the same thing. The\
    \ big difference, which you must remember, is that variables declared and used\
    \ within a function are local to that function. Or, to put it in the vernacular,\
    \ what happens in a function stays within the function, as shown in Listing 10-3.\n\
    \n# LISTING 10-3: Local Variables in a Function\n\n```\n```c\n#include <stdio.h>\n\
    \nvoid vegas(void);\n\nint main()\n{\n    int a;\n\n    a = 365;\n    printf(\"\
    In the main() function, a=%d\\n\",a);\n    vegas();\n    printf(\"In the main()\
    \ function, a=%d\\n\",a);\n    return(0);\n}\n\nvoid vegas(void)\n{\n    int a;\n\
    \n    a = -10;\n    printf(\"In the vegas() function, a=%d\\n\",a);\n}\n```\n\
    ```"
