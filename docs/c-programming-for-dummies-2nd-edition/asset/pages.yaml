  md: '# IN THIS CHAPTER


    +   » Using the sizeof operator

    +   » Grabbing a variable''s memory location

    +   » Creating pointer variables

    +   » Peeking at data

    +   » Using pointers to assign values


    # Chapter 18


    # Introduction to Pointers


    It''s considered one of the most frightening topics in all of programming. Boo!


    Pointers scare a lot of beginning C programmers — and even experienced programmers
    of other languages. I believe that the reason for the dread is that no one bothers
    to explain in fun, scintillating detail how pointers really work. So clear your
    mind, crack your knuckles, and get ready to embrace one of the C language''s most
    unique and powerful features.


    # The Biggest Problem with Pointers


    It''s true that you can program in C and avoid pointers. I did it for a long time
    when I began to learn C programming. Array notation offers a quick-and-dirty workaround
    for pointers, and you can fake your way around the various pointer functions,
    hoping that you get it right. But that''s not why you bought this book!


    After working with pointers for some time and understanding the grief they cause,
    I''ve come up with a reason for the woe they induce: Pointers are misnamed.'
  merge: -1
  img_proc: true
- pgno: 285
  md: "> I can reason why a pointer is called a pointer: It points at something, a\
    \ location in memory. The problem with this description is that most pedants explain\
    \ how a pointer works by uttering the phrase, “A pointer points . . .” This explanation\
    \ is just wrong. It confuses the issue.\n> \n> Adding to the name confusion is\
    \ the fact that pointers have two personalities. One side is a variable that holds\
    \ a memory location, an address. The other side reveals the value at that address.\
    \ In this way, the pointer should be called a peeker. This chapter helps straighten\
    \ out the confusion.\n\n![](img/dcc0cd79d4a45cfce24fa49d85442884_285_0.png)\n\n\
    # Sizing Up Variable Storage\n\nDigital storage is measured in bytes. All the\
    \ information stored inside memory is simply a mass of data, bits piled upon bits,\
    \ bytes upon bytes. It's up to the software to make sense of it all.\n\n# Understanding\
    \ variable storage\n\nIn C, data is categorized by storage type (char, int, float,\
    \ or double) and further classified by keyword (long, short, signed, or unsigned).\
    \ Despite the chaos inside memory, your program's storage is organized into these\
    \ values, ready for use in your code.\n\nInside a running program, a variable\
    \ is described by these attributes:\n\n+   - Name\n+   - Type\n+   - Value\n+\
    \   - Size\n+   - Location"
  merge: -1
  img_proc: true
- pgno: 286
  md: "The name is the name you give the variable. The name is used only in your code,\
    \ not when the program runs.\n\nThe type is one of the C language's data types:\
    \ char, int, float, or double.\n\nThe value is assigned in your program. Though\
    \ data at the variable's storage location may exist beforehand, it's considered\
    \ garbage, and the variable is considered uninitialized until it's assigned a\
    \ value.\n\nThe size references the number of bytes of storage the variable occupies.\n\
    \nThe location is an address, a spot inside the device's memory. This aspect of\
    \ a variable is something you need not dictate; the program and operating system\
    \ negotiate where information is stored internally. When the program runs, it\
    \ uses the location to access a variable's data.\n\nOf these aspects, the variable's\
