  md: 'The fseek() function at Line 21 sets the file-pointer-thing position so that
    the fread() function that follows (Line 22) reads in a specific record located
    inside the database. The offset is calculated by multiplying the size of the entry
    structure. As with an array, multiplying this size by 1 yields the second record
    in the file; multiplying the value by 0 (or just specify 0 in the function) to
    read the first record. The SEEK_SET constant ensures that fseek() looks from the
    beginning of the file.


