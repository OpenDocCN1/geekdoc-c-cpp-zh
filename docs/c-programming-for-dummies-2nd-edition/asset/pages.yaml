    \ was inaugurated in 1797. Display the contents of both structures.\n\n# Making\
    \ an array of structures\n\nCreating individual structure variables, one after\
    \ the other, is boring and wasteful as creating a series of any individual variable\
    \ type. The solution for multiple structures is the same as for multiple individual\
    \ variables: array.\n\nA structure array is declared like this:\n\n```\nstruct\
    \ scores player[4];\n```\n\nThis statement declares an array of scores structures.\
    \ The array is named player, and it contains four structure variables as its elements.\n\
    \nThe structures in the array are accessed using a combination of array and structure\
    \ notation. For example:\n\n```\nplayer[2].name\n```\n\nThe variable in the preceding\
    \ line accesses the name member in the third element (2) in the player structure\
    \ array. Yes, that's the third element because the first element would be referenced\
