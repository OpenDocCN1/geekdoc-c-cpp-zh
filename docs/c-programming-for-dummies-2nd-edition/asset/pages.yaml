    # Passing a structure to a function


    As a type of variable, it''s entirely possible for a function to accept a structure
    as an argument and return it as a value. However, this process requires that the
    structure be declared externally, as a global variable. The reason is that the
    structure''s definition must be available to all functions in the source code.


    The topic of global variables is avoided until Chapter 16. It''s not that complex,
    but learning about passing and returning structures can be delayed until then.'
