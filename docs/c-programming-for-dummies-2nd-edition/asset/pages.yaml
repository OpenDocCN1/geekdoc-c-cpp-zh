  md: '# Exercise 18-5: Use Listing 18-3 to create a new source code file. Build and
    run to determine the size of the structure.


    The sizeof operator works on all variable types, but for a structure, specify
    the structure itself, as shown in Line 14. Avoid using a structure variable when
    obtaining the size of a structure.


    The size of the structure is calculated by totaling the storage requirement for
    each of its members. You might assume, given the size output from Exercise 18-5,
    that four int variables plus five char variables would give you 4: 4 × 4 + 1 ×
    5. But it doesn’t work that way.


    On my screen I see output:


    > The evil robot struct size is 24


    The reason you see a value other than 21 is that the program aligns variables
    in memory. It doesn’t stack them up, one after another. If I were to guess, I
    would say that 3 extra bytes are padded to the end of the name array to keep it
    aligned with an 8-byte offset in memory. Figure 18-1 illustrates what’s going
    on.


    +   - The sizeof operator returns the size of a C language variable, array, buffer
    or structure.

    +   - You cannot use sizeof to determine the size of your program, the amount
    of memory in the computer, or the size of anything other than a declared variable
    or buffer.

    +   - Use sizeof on a structure’s definition, not the structure variable. A problem
    occurs when writing structures to a file if you use the variable’s size (especially
    when it’s a pointer) rather than the structure’s defined size. See Chapter 22.

    +   - Most compilers today typedef the size_t value (number of bytes of member)
    returned by the sizeof operator as an unsigned long integer, placeholder %lu.
    You can also use the %zd placeholder, where z represents a byte-size value and
    d stands for decimal output.

    +   - If you’re a nerd, you can conclude that the %zx placeholder outputs a size_t
    value in hexadecimal.

    +   - The 8-byte offset used to align variables in memory keeps the CPU happy.
    The processor is much more efficient at reading memory aligned with those 8-byte
    offsets.


    ![](img/dcc0cd79d4a45cfce24fa49d85442884_289_0.png)'
