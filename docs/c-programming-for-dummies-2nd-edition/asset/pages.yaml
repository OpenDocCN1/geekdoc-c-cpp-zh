    \ 22-14:** Create a new project by using the source code from Listing 22-9. Build\
    \ and run to examine the bond.db file, which was created in Exercises 22-12 and\
    \ 22-13.\n\n![](img/dcc0cd79d4a45cfce24fa49d85442884_368_0.png)\n\nThe key to\
    \ effectively read and write structures to a file — like a database — is to keep\
    \ all structures uniform. This way, they can be read and written to the file in\
    \ chunks. They can also be read or written in any order, as long as you also use\
    \ the proper C language file functions.\n\n# Reading and rewinding\n\nAs your\
    \ program reads data from a file, it keeps track of the position from whence data\
    \ is read in the file. A file position index is maintained so that the location\
    \ at which the code is reading or writing within a file isn't lost.\n\nWhen you\
    \ first open a file, this index position is located at the beginning of the file,\
    \ the first byte. If you read a 40-byte record into memory, the file position\
    \ index is 40 bytes from the start. If you read until the end of the file, the\
    \ position index maintains that location as well."
