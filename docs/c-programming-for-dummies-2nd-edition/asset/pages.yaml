  md: "handle is a file handle, a FILE pointer representing a file that's open for\
    \ reading, offset is the number of bytes from the start, end, or current position\
    \ in a file. And whence is one of three constants: SEEK_SET, SEEK_CUR, or SEEK_END\
    \ for the start, current position, or end of a file, respectively.\n\nProviding\
    \ that the data file contains records of a constant size, you can use fseek()\
    \ to pluck out any specific record, as shown in Listing 22-11.\n\n# LISTING 22-11:\
    \ Find a Specific Record in a File\n\n```\n```c\n#include <stdio.h>\n#include\
    \ <stdlib.h>\n#include <string.h>\n\nint main()\n{\n    struct agent {\n     \
    \   char actor[32];\n        int year;\n        char title[32];\n    };\n    struct\
    \ agent bond;\n    FILE *jbdb;\n\n    jbdb = fopen(\"bond.db\", \"r\");\n    if\
    \ (!jbdb)\n    {\n        puts(\"SPECTRE wins!\");\n        exit(1);\n    }\n\
    \    /* locate the 2nd record based on the\n       size of structure agent */\n\
    \    fseek(jbdb, sizeof(struct agent)*1, SEEK_SET);\n    fread(&bond, sizeof(struct\
    \ agent), 1, jbdb);\n    printf(\"%s\\t%d\\t%s\\n\",\n           bond.actor,\n\
    \           bond.year,\n           bond.title);\n    fclose(jbdb);\n\n    return(0);\n\
    }\n```\n```"
