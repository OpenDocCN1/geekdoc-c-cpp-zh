    The same variable name is used in both functions, yet it holds a different value
    in each. That''s because variables in C are local to their functions: One function
    cannot change the value of a variable in another function, even if both variables
    sport the same type and name.


    +   - My admonition earlier in this book about not duplicating variable names
    doesn''t hold for variables in other functions. You could have 16 functions in
    your code, and each function uses the alpha variable. That''s perfectly okay.
    Even so:

    +   - You need not use the same variable names in all functions. The vegas() function
    from Listing 10-3 could have declared its variable name as pip or wambooli.

    +   - To allow multiple functions to share a variable, you specify an external
    or global variable. That topic is avoided until Chapter 16.

    +   - Variables local to their functions are determined to be of the auto storage
    class. The auto keyword could prefix variables local to a function, as in auto
    int a, though it would be considered anachronistic.


