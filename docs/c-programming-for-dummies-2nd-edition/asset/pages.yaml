    \nint main()\n{\n    char loop;\n\n    puts(\"Presenting the alphabet:\");\n \
    \   for(loop='A';loop<='Z';loop++);\n        putchar(loop);\n    return 0;\n}\n\
    ```\n```\n\n**Exercise 25-1:** Create a new project in Code::Blocks, one that\
    \ has a Debug target build. Copy the source code from Listing 25-1 into the main.c\
