- pgno: 255
  md: '# # VARIABLE KEYWORD ROUNDUP


    The C language features a few keywords that puzzle beginners and advanced users
    alike. Here''s the rundown of various variable classifier, quantifier, and what-have-you
    keywords related to variables.


    # **auto**


    The auto keyword is a storage class specifier. It''s a holdover from the ancient
    B programming language, which defines all variables used in a function that aren''t
    constants or static. Because this definition means pretty much every variable
    declaration, the auto variable classification is assumed by the compiler and,
    therefore, this keyword prefix isn''t required.


    # **const**


    The const keyword is a quantifier used to create a constant or unchanging value.
    Refer to Chapter 6.


    # **enum**


    The enum keyword creates an enumerated list of constants. See the section "Enumerating"
    later in this chapter.


    # **extern**


    Like auto, the extern keyword is a storage class specifier, referencing variables
    declared outside of a function. It''s covered in Chapter 24, though the concept
    of external variables are covered elsewhere in this chapter.


    # **register**


    Another storage class specifier, a variable declared as register (followed by
    the data type and variable name) is to be stored directly in a CPU register. Modern
    compilers are highly optimized, which makes this keyword unnecessary.


    # **static**


    The static keyword declares a storage class that isn''t discarded when a function
    terminates. It''s covered elsewhere in this chapter.


    # **union**


    A union is a complex data construction, similar to a structure. Unlike a structure,
    the union can hold a variety of data types in the same memory space, though the
    code can access only one type at a time. Unions are considered a security risk
    because they define a storage area with an inconsistent data type.


    # **volatile**


    This scary keyword is a quantifier, often called the opposite of the const keyword.
    Like register, volatile was once used to optimize code by telling the compiler
    which variables would change most often. Such optimization is no longer necessary
    with modern C compilers.'
  merge: -1
  img_proc: true
- pgno: 256
  md: 'Because the variable was declared as *static*, its value is retained between
    function calls.


    +   - As a bonus, *static* variable declarations are initialized to zero.

    +   - The keyword *static* defines a storage class. See the nearby sidebar, "Variable
    keyword roundup."

    +   - You need not declare variables as *static* unless their values must be retained
    each time the function is called. This situation crops up from time to time. Also
    refer to the later section "Using external variables."

    +   - Values returned from a function need not be declared *static*. When you
    return a value, such as


    ```

    return(a);

    ```


    only the variable''s value is returned, not the variable itself. The only challenge
    with this approach occurs when allocating memory as the buffer. The buffer''s
    data is discarded and should be declared *static* if you want the calling function
    to access it. See Chapter 19.


    # Variables, Variables Everywhere


    Sometimes, a variable must be like cellular phone service: available everywhere
    and accessed from any function. Often referred to as a *global* variable, in C
    it''s officially known as an external variable.


    # Using external variables


    External variables solve specific problems by making the variable declaration
    available to all functions in the source code file. Any function can access the
    variable. It doesn''t have to be passed to or returned from a function.


    Listing 16-6 shows how external variables are declared and used. The variables
    *age* and *feet* are external. Both are used in, and manipulated by, all functions
    in the source code.'
