    \ with records of the same size. The notion of records brings up structures, which\
    \ can easily be written to a file and then fetched back individually, selectively,\
    \ or all at once.\n\n# Writing a structure to a file\n\nAs a type of variable,\
    \ writing a structure to a file is cinchy. The process works just like writing\
    \ any variable to a file, as demonstrated in Listing 22-8.\n\n# LISTING 22-8:\
    \ Save Mr. Bond\n\n```\n```c\n#include <stdio.h>\n#include <stdlib.h>\n#include\
    \ <string.h>\n\nint main()\n{\n    struct agent {\n        char actor[32];\n \
    \       int year;\n        char title[32];\n    };\n    struct agent bond;\n \
    \   FILE *jbdb;\n\n    strcpy(bond.actor,\"Sean Connery\");\n    bond.year = 1962;\n\
    \    strcpy(bond.title,\"Dr. No\");\n\n    jbdb = fopen(\"bond.db\",\"w\");\n\
    \    if(!jbdb)\n    {\n        puts(\"SPECTRE wins!\");\n        exit(1);\n  \
    \  }\n    fwrite(&bond,sizeof(struct agent),1,jbdb);\n    fclose(jbdb);\n    puts(\"\
    Record written\");\n\n    return(0);\n}\n```\n```"
