  md: '# Suffering through trigonometry


    I won''t bother to explain trigonometry to you. If your code needs a trig function,
    you know why. But what you probably don''t yet know is that trigonometric functions
    in C — and, indeed, in all programming languages — use radians, not degrees.


    # What''s a radian?


    Glad you asked. A radian is a measurement of a circle or, specifically, an arc.
    It uses the value π (pi) instead of degrees, where π is a handy circle measurement.
    So instead of a circle having 360 degrees, it has 2π radians. That works out to
    6.2831 (which is 2 × 3.1415) radians in a circle. Figure 11-1 illustrates this
    concept.


    ![](img/dcc0cd79d4a45cfce24fa49d85442884_178_0.png)


    FIGURE 11-1:

    Degrees and radians.


    For your trigonometric woes, one radian equals 57.2957795 degrees, and one degree
    equals 0.01745329 radians. So when you do your angle math, you need to translate
    between human degrees and C language radians. Consider Listing 11-6.'
  merge: -1
  img_proc: true
