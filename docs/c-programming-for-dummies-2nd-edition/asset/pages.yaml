    \ the argv[] array.\n\n# # Time to Bail\n\nInformation can get into your program\
    \ via command–line arguments. Information gets back out thanks to the return statement.\
    \ That’s the primary, but not the only, way a program bails out when it’s done.\n\
    \n\n\nYour program quits when the main() function encounters the return statement.\
    \ Traditionally, that statement appears at the end of the function, but it doesn’t\
    \ always need to go there. Further, you can use the exit() function to leave the\
    \ program at any time, even within a function other than main().\n\nThe exit()\
    \ function gracefully quits a program, tying up any loose ends, tucking variables\
    \ into bed, and so on. In Listing 15–3, this function is used in Line 17 to leave\
    \ the program in the sub() function.\n\n\n\n```\n#include <stdio.h>\n#include\
    \ <stdlib.h>\nvoid sub(void);\n\nint main()\n{\n    puts(\"This program quits\
    \ before it’s done.\");\n    sub();\n    puts(\"Or was that on purpose?\");\n\
    \    return(0);\n}\n```"
