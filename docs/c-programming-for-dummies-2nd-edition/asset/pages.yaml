    `bshift` is shifted to the left one bit.


    # **Exercise 17-10:** Type the source code from Listing 17-5 into your editor
    and build a new program to see what it does.


    Shifting a value one bit to the left doubles the value. This rule holds true to
    a certain point: Obviously, the farther left you shift, some bits get lost and
    the value ceases to double. Also, this trick works best for unsigned values.


    # **Exercise 17-11:** Modify the source code from Listing 17-5 so that the `printf()`
    function at Line 14 also displays the decimal value of the `bshift` variable.
    You should also modify the `binbin()` function so that it displays 16 digits instead
    of 8. (Refer to Exercise 17-2 for the 16-bit `binbin()` solution.)


    Here’s the output I see when using the value 12:


    ```

    Type a value from 0 to 255: 12

    000000000001100 12

    000000000011000 24

    000000000110000 48

    000000001100000 96

    000000011000000 192

    000000110000000 384

    000001100000000 768

    000011000000000 1536

    ```


    Try the value 800,000,000 (don’t type the commas) to see how the doubling rule
    fails as the values keep shifting to the left. Also see the nearby sidebar “Negative
    binary numbers.”


    The >> shift operator works similarly to the << shift operator, though values
    are marched to the right instead of the left. Any bit that’s marched off the right
    end is discarded, and only zero bits slide in on the left. Here’s the format:


    ```

    v = int >> count;

    ```


    *int* is an integer value, and *count* is the number of places to shift the bits
    to the right. The result is stored in variable *v*.


