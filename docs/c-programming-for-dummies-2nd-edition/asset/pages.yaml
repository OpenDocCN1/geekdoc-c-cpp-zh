    # Arrays and Functions


    Creating an array for use inside a function works just like creating an array
    for use inside the main() function: The array is declared, it''s initialized,
    and its elements are used. You can also pass arrays to, and return them from,
    functions.


    # Passing an array to a function


    Sending an array off to a function is pretty straightforward. The function must
    be prototyped with the array specified as one of the arguments. It looks like
    this:


    ```

    void whatever(int nums[]);

    ```


    This statement prototypes the whatever() function. The function accepts an integer
    array as an argument, using nums to represent the array within the function. The
    entire array — every element — is passed to the function, where it''s available
    for fun and frolic.


    When you call a function with an array as an argument, you must omit the square
    brackets:


    ```

    whatever(values);

    ```


    In the preceding line, the whatever() function is called using the array values
    as an argument. If you keep the square brackets, the compiler assumes that you
    meant only to pass a single element and that you forgot to specify which one.
    So this is good:


    ```

    whatever(values);

    ```


    But this is not good:


    ```

    whatever(values[]);

    ```'
