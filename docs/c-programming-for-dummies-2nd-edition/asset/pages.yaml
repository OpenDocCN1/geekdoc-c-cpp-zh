  md: "The problem here is a common one, a mistake made by just about every C programmer:\
    \ The trailing semicolon in Listing 8-5 (Line 10) tells the program that the if\
    \ statement has nothing to do when the condition is true. That's because a single\
    \ semicolon is a complete statement in C, albeit a null statement. To wit:\n\n\
    ```\nif(condition)\n    ;\n```\n\nThis construction is basically the same as Line\
    \ 10 in Listing 8-5. Be careful not to make the same mistake — especially when\
    \ you type code a lot and you're used to ending a line with a semicolon.\n\n#\
    \ Multiple Decisions\n\nNot every decision is a clean-cut, yes-or-no proposition.\
    \ Exceptions happen all the time. C provides a few ways to deal with those exceptions,\
    \ allowing you to craft code that executes based on multiple possibilities.\n\n\
    # Making more-complex decisions\n\nFor the either-or type of comparisons, the\
    \ if keyword has a companion — else. Together, they work like this:\n\n```\nif(expression)\n\
    {\n    statement(s);\n}\nelse\n{\n    statement(s);\n}\n```\n\nWhen the expression\
    \ is true in an if-else structure, the statements belonging to if are executed;\
    \ otherwise, the statements belonging to else are executed. It's an either-or\
    \ type of decision.\n\nListing 8-6 is an update of sorts to the code shown in\
    \ Listing 8-1. The single if structure has been replaced by if-else. When the\
    \ if comparison is false, the statement belonging to else is executed."
