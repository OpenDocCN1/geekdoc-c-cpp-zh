    # Chapter 5


    # Values and Simple Math


    Back in the old days, most people thought of computers in terms of math. Computers
    calculated rocket trajectories, conducted the census, and screwed up phone bills.
    They were scary, technological things, and the people who programmed computers
    were downright geniuses.


    Ha! Fooled everyone.


    Programmers merely write the equation and punch in a few numbers, and then the
    computer does the math. That''s the genius part. Punching in the wrong numbers
    is the nongenius part. Before you can get there, you have to understand a bit
    about values and variables and how the C programming language deals with them.


    # A Venue for Various Values


    Computers deal with both numbers and text. Text comes in the form of individual
    characters or a parade of characters all tied together in a string. Numbers are
    pretty much numbers until you get into huge values and fractions. The computer
    understands everything, as long you properly inform your program of which values
    are which.'
  merge: -1
  img_proc: true
- pgno: 73
  md: '# Understanding values


    You''ve probably dealt with numbers all your life, virtually tortured by them
    throughout your schooling. You may recall terms such as *whole number*, *fraction*,
    *real number*, and *imaginary number*. Ignore them! These terms mean nothing in
    computer programming.


    When it comes to C programming, you use only two types of numbers:


    +   - Integer

    +   - Float


    An *integer* is a whole number — no fractional part. It can be positive. It can
    be negative. It can be zero, a single digit, or a humongous value such as the
    amount of money the US government spends in a week (no cents). All these numbers
    are integers in computer programming jargon.


    A *float* is a number that has a fractional part — a decimal place. It can be
    a very, very small number, like the width of a proton. It can be a very, very
    large number, like the hat size of the planet Jupiter.


    ![](img/dcc0cd79d4a45cfce24fa49d85442884_73_0.png)


    +   - Examples of integers: -13, 0, 4, and 234792.

    +   - In programming, you don''t type commas in large values.

    +   - Examples of floats are 3.14, 0.1, and 6.023e23. That last number is written
    in scientific notation, which means that it''s the value 6.023 × 10²³ — a huge
    number. (It''s Avogadro''s *number*, which is another term you''ve probably forgotten
    from school.)

    +   - Integers and floats can be either positive or negative.

    +   - Integers are judged by their size, as are floats. The size comes into play
    when you create storage places for numbers in your programs. Chapter 6 covers
    the details.

    +   - The term *float* is short for *floating point*. It refers to the method
    that''s used to store large numbers and fractions in the binary counting system
    of modern electronics.'
  merge: -1
  img_proc: true
- pgno: 74
  md: "# TO FLOAT OR NOT TO FLOAT\n\nThough it may seem logical to use all floating-point\
    \ numbers (*floats*) in your programs, the problem is that they're imprecise.\
    \ In fact, floating-point values are defined by their *precision*, or the number\
    \ of digits in the number that are truly accurate.\n\nFor example, a floating-point\
    \ value with single-precision accuracy may show from six to nine significant digits\
    \ in the number. The rest of the numbers in the value are nonsense. That seems\
    \ sloppy, but for very large or small numbers, it's good enough. When it's not\
    \ good enough, double-precision accuracy can be used, though such calculations\
    \ require more processor power.\n\nTo put it another way, the value of π as represented\
    \ using seven significant digits, or single precision, would be accurate enough\
    \ to define a circle the size of Saturn's orbit, accurate to the millimeter.\n\
    \n# Displaying values with *printf()*\n\nThe *printf()* function, introduced in\
    \ Chapter 4, is ideal for displaying not only strings of text but also values.\
    \ To make that happen, you use *conversion characters* in the function's formatting\
