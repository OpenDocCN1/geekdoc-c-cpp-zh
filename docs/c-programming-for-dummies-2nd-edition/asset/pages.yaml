    # Chapter 26


    # Ten Common Boo-Boos


    The programming adventure has its pitfalls. Many of them are common; the same
    mistakes, over and over. Even after decades of coding, I still find myself doing
    stupid, silly things. Most often they’re done in haste — usually, simple things
    that I’m not paying attention to. But isn’t that the way of everything?


    # Conditional Foul-Ups


    When you employ an if statement or initiate a while or for loop, the code makes
    a comparison. Properly expressing this comparison is an art form, especially when
    you try to do multiple things at once.'
