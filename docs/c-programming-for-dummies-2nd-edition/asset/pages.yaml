  md: "The renamed file, wambooli, is used in a later section as an example.\n\n#\
    \ Copying a file\n\nThe C library features no function that duplicates a file.\
    \ Instead, you must craft your own: Write code that reads in a file, one chunk\
    \ at a time, and then writes out that chunk to a duplicate file. This method is\
    \ how files are copied.\n\nListing 23-5 demonstrates how a file can be duplicated,\
    \ or copied. The two files are specified in Lines 9 and 10. In fact, Line 9 uses\
    \ the name of the exercise file, the source code from Listing 23-5. The destination\
    \ file, which contains the copy, is the same filename, but with a bak extension.\n\
    \n# LISTING 23-5: Duplicate That File\n\n```\n```c\n#include <stdio.h>\n#include\
    \ <stdlib.h>\n\nint main()\n{\n    FILE *original,*copy;\n    int c;\n\n    original=fopen(\"\
    ex2307.c\",\"r\");\n    copy=fopen(\"ex2307.bak\",\"w\");\n    if( !original ||\
    \ !copy)\n    {\n        puts(\"File error!\");\n        exit(1);\n    }\n   \
    \ while( (c=fgetc(original)) != EOF)\n        fputc(c,copy);\n    puts(\"File\
    \ duplicated\");\n    return(0);\n}\n```\n```\n\nThe copying work is done by the\
    \ while loop at Line 16. One character is read by the fgetc() function, and it's\
    \ immediately copied to the destination by the fputc() function in Line 17. The\
    \ loop keeps spinning until the EOF, or end-of-file, is encountered."
