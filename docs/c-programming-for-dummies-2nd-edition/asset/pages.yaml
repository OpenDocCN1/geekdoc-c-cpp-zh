    \ your coding. In the real world, however, programmers avoid using the scanf()\
    \ function for input, because it can easily be exploited.\n\n# Reading values\
    \ with scanf()\n\nThe scanf() function can do more than read strings. It can read\
    \ in any value specified by a conversion character, as demonstrated in Listing\
    \ 7-6.\n\n# LISTING 7-6: scanf() Eats an Integer\n\n```\n#include <stdio.h>\n\n\
    int main()\n{\n    int fav;\n\n    printf(\"What is your favorite number: \");\n\
    \    scanf(\"%d\",&fav);\n    printf(\"%d is my favorite number, too!\\n\",fav);\n\
    \    return(0);\n}\n```\n\nIn Listing 7-6, the scanf() function reads an integer\
    \ value from standard input. The %d conversion character is used, just like printf()\
    \ — indeed, it's used again in Line 9. This character directs scanf() to look\
    \ for an int value for variable fav.\n\nExercise 7-14: Write new source code using\
    \ Listing 7-6. Build and run. Test the program by typing various integer values,\
    \ positive and negative.\n\nThe ampersand (&) operator is used to prefix the second\
    \ argument in the scanf() function. The & is the address-of operator. It's one\
    \ of the advanced features in C, related to pointers. I avoid the topic of pointers\
    \ until Chapter 18, but for now, know that an ampersand must prefix any variable\
    \ specified in the scanf() function. The exception is an array, such as the firstname\
    \ char array in Listing 7-5.\n\nTry running the program again, but specify a decimal\
    \ value, such as 41.9, or type text instead of a number."
