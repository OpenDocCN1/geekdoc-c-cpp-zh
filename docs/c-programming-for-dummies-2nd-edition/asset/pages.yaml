  md: '# Initializing an array


    As with any variable in C, you can initialize an array when it''s declared. The
    initialization requires a special format, similar to this statement:


    ```

    int highscore[] = { 750, 699, 675 };

    ```


    The number in the square brackets isn''t necessary when you initialize an array,
    as shown in the preceding example. The reason is that the compiler is smart enough
    to count the elements and allocate the array''s storage automatically.


    **Exercise 12-6:** Write a program that displays the stock market closing numbers
    for the past five days. Use an initialized array, marketclose[], to hold the values.
    The output should look something like this:


    ```

    Stock Market Close

    Day 1: 24164.95

    Day 2: 24107.08

    Day 3: 24643.63

    Day 4: 24400.93

    Day 5: 23728.53

    ```


    **Exercise 12-7:** Write a program that uses two arrays. The first array is initialized
    to the values 10, 12, 14, 15, 16, 18, and 20. The second array is the same size
    but not initialized. In the code, fill the second array with the square root of
    each of the values from the first array. Output the results.


    # Playing with character arrays (strings)


    You can create an array using any of the C language''s data types. A char array,
    however, is a little different when it''s a string.


    As with any array, you can declare a char array initialized or not. The format
    for an initialized char array can look like this:


    ```

    char letters[] = { ''c'', ''a'', ''t'' };

    ```


    This array declaration is for a 3-element character array, containing the letters
    c, a, and t. This example is a character array, not a string.


    ```

    char pet[] = "cat";

    ```'
