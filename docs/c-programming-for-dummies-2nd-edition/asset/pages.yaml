  md: "Build and run the code. The output looks like this:\n\n```\nThe value of variable\
    \ x is 5.\n```\n\nThe following sections describe in further detail the mechanics\
    \ of creating and using variables.\n\n# Introducing data types\n\nC language variables\
    \ are designed to hold specific types of data. If C were a biological programming\
    \ language, cats and dogs would go into the animal data type, and trees and ferns\
    \ would go into the plant data type. C language variables work along these lines,\
    \ with specific values assigned to matching types of data.\n\nThe common C language\
    \ data types are listed in Table 6-1.\n\nTABLE 6-1 Basic C Language Variable Types\n\
    \n| Data Type | Description |\n|---|---|\n| char | Single-character variable;\
    \ stores one character of information |\n| int | Integer variable; stores integer\
    \ (whole number) values |\n| float | Floating-point variable; stores real numbers\
    \ |\n| double | Floating-point variable; stores very large or very small real\
    \ numbers |\n| void | No data type |\n\nWhen you need to store an integer value,\
    \ you use a variable of the integer (int) data type. Likewise, if you're storing\
    \ a letter of the alphabet, you use a variable of the character (char) data type.\
    \ The program's needs are what determine which data types are required for its\
    \ variables.\n\n> > The char and int data types store integer values. The char\
    \ data type has a shorter range, used primarily to store characters — letters\
    \ of the alphabet, numbers, and symbols — but it can also be used to store small\
    \ integer values.\n> \n> > The float and double data types are both floating-point\
    \ variables that can store a tiny or huge value or any value with a decimal portion."
