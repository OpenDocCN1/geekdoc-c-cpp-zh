- pgno: 233
  md: "# Weird Structure Concepts\n\nI'll admit that structures are perhaps the weirdest\
    \ type of variable in the C language. The two steps required to create them are\
    \ unusual, but the dot method of referencing a structure's member always seems\
    \ to throw off beginning programmers. If you think that, beyond those two issues,\
    \ structures couldn't get any odder, you're sorely mistaken.\n\n# Putting structures\
    \ within structures\n\nIt's true that a structure holds C language variables.\
    \ It's also true that a structure is a C language variable. Therefore, it follows\
    \ that a structure can hold another structure as a member. Don't let this type\
    \ of odd thinking confuse you. Instead, witness the example shown in Listing 14-4.\n\
    \n# LISTING 14-4: A Nested Structure\n\n```\n#include <stdio.h>\n#include <string.h>\n\
    \nint main()\n{\n    struct date\n    {\n        int month;\n        int day;\n\
    \        int year;\n    };\n    struct human\n    {\n        char name[45];\n\
    \        struct date birthday;\n    };\n    struct human president;\n\n    strcpy(president.name,\"\
    George Washington\");\n    president.birthday.month = 2;\n    president.birthday.day\
    \ = 22;\n    president.birthday.year = 1732;\n}\n```"
  merge: -1
  img_proc: true
