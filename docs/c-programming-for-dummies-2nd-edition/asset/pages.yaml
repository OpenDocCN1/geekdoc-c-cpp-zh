- pgno: 209
  md: 'To use the CTYPE functions, the ctype.h header file must be included in your
    source code:


    ```

    #include <ctype.h>

    ```


    I classify the CTYPE functions into two categories: is-testing and to-manipulation.
    Some of my favorite testing functions are shown in Table 13-1; manipulation functions,
    in Table 13-2.


    # TABLE 13-1


    # CTYPE Testing Functions


    | Function | Returns TRUE When ch Is |

    |---|---|

    | isalnum(ch) | A letter of the alphabet (upper- or lowercase) or a number |

    | isalpha(ch) | An upper- or lowercase letter of the alphabet |

    | iscntrl(ch) | A control code character, values 0 through 31 and 127 |

    | isdigit(ch) | A character 0 through 9 |

    | isgraph(ch) | Any printable character except for the space |

    | islower(ch) | A lowercase letter of the alphabet, a to z |

    | isprint(ch) | Any character that can be displayed, including the space |

    | ispunct(ch) | A punctuation symbol |

    | isspace(ch) | A whitespace character, space, tab, form feed, or Enter, for example
    |

    | isupper(ch) | An uppercase letter of the alphabet, A to Z |

    | isxdigit(ch) | Any hexadecimal digit, 0 through 9 or A through F (upper- or
    lowercase) |


    # TABLE 13-2


    # CTYPE Manipulation Functions


    | Function | Returns |

    |---|---|

    | tolower(ch) | The lowercase of character ch |

    | toupper(ch) | The uppercase of character ch |


    CTYPE functions are consistent: Testing functions begin with is, and manipulation
    functions begin with to.


    Every CTYPE function accepts an int value as the argument, represented by the
    variable ch in Tables 13-1 and 13-2. These are not char functions!'
