    # Memory Chunks and Linked Lists


    Another reason for having a pointer variable is to hold the address of a freshly
    allocated chunk of memory. This approach is far better than creating an array
    and guessing at its size: Memory chunks can be assigned a size on the fly, resized,
    and banished. You can''t perform such actions with an array — well, not in civilized
    society.


    Dovetailing from memory allocation comes the ultimate thrill ride in the C language
    amusement park: the linked list. It combines the mystery of structures with the
    dread of pointers to create one heart-stopping, scream-inducing, hair-blowing
