- pgno: 66
  md: '# Line 5: Error: missing terminating " character


    No, the compiler isn''t mistaken: the double quote is missing. It qualifies as
    a full-on error, which is stronger than a warning.


    # Line 6: Error: expected expression before ''return''


    This error is still related to Line 5, but it''s caught at Line 6. Again, it''s
    the missing double quote, which was expected before the return statement.


    # Line 7: Error: expected '';'' before ''}'' token


    The final error is again caused by Line 5, the missing semicolon. This error isn''t
    caught until Line 7, the closing curly bracket.


    A program doesn''t compile when errors are present; you must fix the problem.
    Warnings can happen and the code compiles — a program might even be created. Whether
    the program runs properly, however, is dubious.


    ![](img/dcc0cd79d4a45cfce24fa49d85442884_66_0.png)


    ![](img/dcc0cd79d4a45cfce24fa49d85442884_66_1.png)


    +   - A warning is something suspicious that''s spotted by the compiler, but it
    may also be something that works as you intended.

    +   - An error is a fatal flaw in the program. When an error occurs, the compiler
    doesn''t create object code or the linker fails to build the program. Either way,
    you''re required to fix the problem.

    +   - Line numbers referenced in warnings and error messages are an approximation.
    Sometimes, the issue is on the line that''s indicated, but it might also exist
    earlier in the code.

    +   - It''s possible to adjust how sensitive the compiler is regarding warnings.
    In fact, modern compilers have dozens of options designed to turn on or off various
    compiling conditions. I recommend activating all warnings, which is the default
    in Code::Blocks and is achieved at the command prompt by using the -Wall switch.


    Exercise 4-9: Fix the code from Exercise 4-8 by adding the missing double quote.
    Compile to see the difference in the error messages.


    Exercise 4-10: Fix the code again, adding the missing semicolon.


