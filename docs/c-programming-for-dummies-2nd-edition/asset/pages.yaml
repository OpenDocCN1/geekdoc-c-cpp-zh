  md: 'FIGURE 17-1:

    Base 2 values

    in a byte.


    ![](img/dcc0cd79d4a45cfce24fa49d85442884_266_0.png)


    Each bit that is set or has the value 1 in Figure 17-1 represents a power of two:
    2⁵, 2³, 2¹, and 2⁰. When you total these values, you get the decimal representation
    of binary 00101011, which is 43.


    That''s all well and good, but please don''t memorize it!


    > » Don''t concern yourself with translating binary into decimal values; the computer
    does that job for you all the time. This is because the computer sees only binary
    and then displays decimal numbers as a courtesy for your human eyeballs. But when
    you manipulate binary values, it helps to know what''s going on.

    > » Changing a bit''s value to 1 is referred to as setting a bit.

    > » Changing a bit''s value to 0 is referred to as resetting a bit.


    ![](img/dcc0cd79d4a45cfce24fa49d85442884_266_1.png)


    # Outputting binary values


    To best make sense of the C language''s binary manipulation operators, it helps
    to see a binary number in action. The printf() function lacks a binary conversion
    character, and the C library doesn''t host a binary output function. Nope, to
    view a binary number, you must craft your own function.


    Listing 17-1 presents a binary output function I''ve concocted called binbin().
    The binbin() function, at Line 15 in Listing 17-1, swallows an unsigned char value.
    Its output is a string representing that char value in binary digits.'
