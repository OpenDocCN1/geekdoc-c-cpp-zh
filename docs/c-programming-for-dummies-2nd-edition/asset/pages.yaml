  md: '# IN THIS CHAPTER


    +   » Understanding programming history

    +   » Reviewing the programming processes

    +   » Creating source code

    +   » Building a program

    +   » Testing the final program


    # Chapter 2


    # The Programming Thing


    It''s called *programming*, though the cool kids know it as *coding* — the process
    whereby a human being writes information resembling cryptic English that is then
    somehow translated into directions for an electronic gizmo. In the end, this silent
    and solitary art grants individuals the power to control electronics. It''s a
    big deal. It''s the programming thing.


    # The History of Programming


    Few books written about programming get away with not describing the thrill-a-minute
    drama of programming history. As a programmer myself, it''s difficult not to write
    about it, let alone contain my enthusiasm at cocktail parties. So consider this
    section optional reading, though a review of where programming has been and where
    it is today may help you better understand the art form.


    In a nutshell, *programming* is the process of telling a gizmo what to do. That
    gizmo is *hardware*; the program is *software*.


    # Reviewing early programming history


    The first known machine to be programmed was Charles Babbage''s analytical engine,
    back in 1822. The programming took place by physically changing the'
  merge: -1
  img_proc: true
- pgno: 37
  md: 'values represented by a column of gears. The engine computed the result of
    some dull, complex mathematical equation.


    In the 1940s, early electronic computers were programmed in a similar manner to
    Babbage’s analytical engine. A major difference was that, rather than rearrange
    physical gears, instructions were hard-wired directly into electric circuitry.
    “Programming” pretty much meant “rewiring.”


    Over time, the rewiring job was replaced by rows of switches. Computer instructions
    were input by throwing switches in a certain way.


    Professor John von Neumann pioneered the modern method of computer programming
    in the 1950s. He introduced decision making into the process, where computers
    could make if-then choices. Professor von Neumann also developed the concept of
    the repeating loop and the subroutine.


    It was Admiral Grace Hopper who developed the compiler, or a program that creates
    other programs. Her compiler would take words and phrases in English and translate
    them into computer code. Thus, the programming language was born.


    The first significant programming language was FORTRAN, born in the 1950s. Its
    name came from formula translator. Other programming languages of the period were
    COBOL, Algol, Pascal, and BASIC.


    ![](img/dcc0cd79d4a45cfce24fa49d85442884_37_0.png)


    Regardless of the form, whether it’s rewiring circuits, flipping switches, or
    writing a programming language, the result is the same: telling hardware to do
    something.


    # Introducing the C language


    The C language was developed in 1972 at AT&T Bell Labs by Dennis Ritchie. It combined
    features from the B and BCPL programming languages but also mixed in a bit of
    the Pascal language. Mr. Ritchie, along with Brian Kernighan, used C to create
    the Unix operating system. A C compiler has been part of that operating system
    ever since.


    In the early 1980s, Bjarne Stroustrup used C as the basis of the object-oriented
    C++ programming language. The ++ (plus-plus) part of the name is kind of an in-joke,
    which you’ll understand better after reading Chapter 11. Mr. Stroustrup intended
    C++ to be the successor to C. In many ways it is, yet C remains one of the most
    popular programming languages.'
  merge: -1
  img_proc: true
- pgno: 38
  md: '+   » The B programming language, upon which C is based, was named after the
    B in Bell Labs.

    +   » BCPL stands for Basic Combined Programming Language.

    +   » The C++ programming language is quite similar to C, but it''s not merely
    an extension or an add-on. It''s easier to learn C++ when you know C, but it''s
    not easy to switch between the languages.

    +   » A D programming language exists. Developed in the early 2000s, it''s not
    as popular today as other current languages, such as Python and Java.

    +   » Unfortunately, I have no idea how to pronounce "Bjarne Stroustrup."


    # The Programming Process


    No matter which language you use, certain procedures are common to the programming
    process. In this manner, learning to program is like learning to cook: You must
    take things in a certain order, whether the result is crème brûlée or a smoldering
    pile of egg glop.


    # Understanding programming


    The goal of programming is to create a program. The language is C, and the tools
    are the editor, compiler, and linker — or an IDE, which combines everything. The
    result is a program that directs the hardware to do something. That hardware can
    be a computer, tablet, phone, microcontroller, or whatever.


    Step-by-step, the programming process works like this:


    +   1. Write the source code.

    +   2. Compile and link, or build, the source code into a program.

    +   3. Run and test the program.


    A human (you) writes source code. The source code is built into a program in two
    steps: compiling it into object code and then linking the object code with C libraries
    to build the program. Finally, that program is run.'
  merge: -1
  img_proc: true
- pgno: 39
  md: "The reality goes more like this:\n\n+   1. Write the source code.\n+   2. Compile\
    \ the source code into object code.\n+   3. Fix warnings and repeat Steps 1 and\
    \ 2.\n+   4. Link the object code with libraries to build the program.\n+   5.\
    \ Fix errors and repeat Steps 1 through 4.\n+   6. Run and test the program.\n\
    +   7. Fix bugs by repeating the entire process.\n+   \n+   Or, more frequently,\
