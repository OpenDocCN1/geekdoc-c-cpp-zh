    \ programmers set the value to 1 simply to self-document that they know what’s\
    \ up.\n\nYou can see an example of an endless loop on purpose in the next section.\n\
    \n# Breaking out of a loop\n\nAny loop can be terminated instantly — including\
    \ endless loops — by using a break statement within the loop’s repeating group\
    \ of statements. When break is encountered, looping stops and program execution\
    \ picks up with the next statement after the loop’s final curly bracket. Listing\
    \ 9-9 demonstrates the process.\n\n# LISTING 9-9: Get Me Outta Here!\n\n```\n\
    #include <stdio.h>\n\nint main()\n{\n    int count;\n\n    count = 0;\n    while(1)\n\
    \    {\n        printf(\"%d \",count);\n        count = count+1;\n        if(\
    \ count > 50)\n            break;\n    }\n    putchar('\\n');\n    return(0);\n\
    }\n```\n\nThe while loop at Line 8 is configured to go on forever, but the if\
    \ test at Line 12 can stop it: When the value of count is greater than 50, the\
    \ break statement (refer to Line 13) is executed and the loop halts."
