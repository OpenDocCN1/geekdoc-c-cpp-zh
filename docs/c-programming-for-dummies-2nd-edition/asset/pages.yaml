  md: "# Understanding the ~ and ! operators\n\nTwo infrequen binary operators are\
    \ the unary ~ (or ones' complement) and the ! (or NOT). They lack the charm of\
    \ the logical bitwise operators, but I suppose that they have a place.\n\nThe\
    \ ones' complement operator flips all the bits in a value, turning a 1 into a\
    \ 0 and a 0 into a 1. For example:\n\n```\n~01010111 = 10101100\n```\n\nThe !\
    \ (NOT) operator affects the entire value — all the bits. It changes any non-zero\
    \ value to 0 and the value 0 to 1:\n\n```\n10101011 = 00000000\n10000000 = 00000001\n\
    ```\n\n> Zero and 1 are the only two results possible when using the bitwise !\
    \ operator.\n> \n> Both the ~ and ! operators are unary operators — you prefix\
    \ a value to get the results.\n\n| Operator | Name | Type | Action |\n| --- |\
    \ --- | --- | --- |\n| & | AND | Bitwise | Masks bits, resetting some bits to\
    \ 0 and leaving the rest alone |\n| | | | Sets bits, changing specific bits from\
    \ 0 to 1 |\n| ^ | XOR | Bitwise | Changes bits to 0 when they match; otherwise,\
    \ to 1 |\n| ~ | 1's complement | Unary | Reverses all bits |\n| ! | NOT | Unary\
    \ | Changes nonzero values to 0; 0 values, to 1 |\n\n# Shifting binary values\n\
    \nThe C language features two binary operators that perform the equivalent operation\
    \ of \"Everyone move one step to the left (or right).\" The << and >> operators\
    \ shift bits in value, matching them to the left or right, respectively. Here's\
    \ the format for the << operator:\n\n```\nv = int << count;\n```"
  merge: -1
  img_proc: true
