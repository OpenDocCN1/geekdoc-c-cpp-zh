- pgno: 355
  md: '# Understanding C file access


    File access in C is another form of I/O. Rather than use standard input (the keyboard)
    or standard output (the display), the input or output acts upon a file. Sounds
    simple. Happily, it is.


    A file is opened by using the fopen() function:


    ```

    ```c

    handle = fopen(filename,mode);

    ```

    ```


    The fopen() function requires two arguments, both strings. The first is a filename;
    the second is a mode. The choices for mode are listed in Table 22-1. The fopen()
    function returns a file handle, which is a pointer used to reference the file.
    This pointer is of the FILE data type, which is a structure defined in the stdio.h
    header file.


    **TABLE 22-1: Access Modes for the fopen() Function**


    | Mode | File Open for | Create File? | Notes |

    |------|---------------|--------------|-------|

    | "a" | Appending | Yes | It adds to the end of an existing file; a file is created
    if it doesn''t exist. |

    | "a+" | Appending and reading | Yes | Information is added to the end of the
    file. |

    | "r" | Reading | No | If the file doesn''t exist, fopen() returns an error. |

    | "r+" | Reading and writing | No | If the file doesn''t exist, an error is returned.
    |

    | "w" | Writing | Yes | The existing file is overwritten if the same name is used.
    |

    | "w+" | Writing and reading | Yes | The existing file is overwritten. |


    ![](img/dcc0cd79d4a45cfce24fa49d85442884_355_0.png)


    The mode is a string. Even when only one character is specified, it must be enclosed
    in double quotes.


    After the file is open, you use the handle variable to reference the file as you
    read and write. Many file I/O functions are similar to their standard I/O counterparts,
    but with an f prefix. To write to a file, you can use the fprintf(), fputs(),
    fputchar(), and similar functions. Reading from a file uses the fscanf(), fgets(),
    and so on.


    After all the reading and writing, the file is closed by using the fclose() function
    with the file handle as its argument.


    All the file I/O functions mentioned in this chapter are prototyped in the stdio.h
    header file.'
  merge: -1
  img_proc: true
- pgno: 356
  md: "# # Writing text to a file\n\nTo write text to a file, you abide by these steps:\n\
    \n+   1. Open the file.\n+   2. Check to confirm whether the file opened successfully.\n\
    +   3. Write data to the file.\n+   4. Close the file.\n\nListing 22-1 performs\
    \ these steps. The file hello.txt is created. It’s a text file, with the contents\
    \ Look what I made!.\n\n```\n## Write That File\n\n```c\n#include <stdio.h>\n\
    #include <stdlib.h>\n\nint main()\n{\n    FILE *fh;\n\n    /* open the file */\n\
    \    fh = fopen(\"hello.txt\", \"w\");\n    /* check for errors */\n    if (fh\
    \ == NULL)\n    {\n        puts(\"Can't open that file!\");\n        exit(1);\n\
    \    }\n\n    /* output text */\n    fprintf(fh, \"Look what I made!\\n\");\n\
