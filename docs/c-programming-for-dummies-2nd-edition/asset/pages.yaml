  md: '# IN THIS CHAPTER


    +   » Programming time functions

    +   » Understanding the Unix epoch

    +   » Retrieving the current time

    +   » Displaying the date and time

    +   » Pausing program execution


    # Chapter 21


    # It’s About Time


    It’s time to program! Or, to put it another way, it’s time to program time. The
    C library is bursting with various time-oriented functions, allowing you to not
    only report the current time but also display dates and times. You can even suspend
    a program’s execution — on purpose — providing you know the proper functions.


    # What Time Is It?


    Does anyone have the time? Seriously, does anyone really know what time it is
    — or was?


    Electronic devices have clocks, but this feature doesn’t make them the best time-keepers.
    In fact, most gizmos today constantly update their internal clocks by using an
    Internet time server. Otherwise, the clock on your computer, cell phone, or tablet
    would never be accurate.


    When you program the time in C, you’re relying upon the device you’re using to
    accurately report the date and time. That brings to light a whole bunch of terms
    and technology surrounding the subject of time and how it’s measured.'
  merge: -1
  img_proc: true
- pgno: 345
  md: '# Understanding the calendar


    Digital devices keep track of time by counting ones and zeros. Humans like to
    keep track of time by counting seconds, minutes, hours, days, weeks, months, and
    years. Various schemes have been developed to work between the two systems.


    The *Julian calendar* was popular for centuries. Developed by Julius Caesar and
    programmed in Latin, this calendar worked well for a long time.


    Sadly, old Julius didn''t account for fractions of a day that accumulated over
    time. In the year 1500, Pope Gregory developed the *Gregorian calendar*, which
    fixed Caesar''s oversights. This calendar was also programmed in Latin.


    Computer scientists developed something called the *Modified Julian Date (MJD)*,
    back in the 1950s. They set the date January 1, 4713 B.C. as Day 0 and numbered
    each day since. Hours are given fractional parts of the day. Noon on January 1,
    2014, was 2456239.5 MJD.


    When Unix popped onto being, two things were born: the C language and the Unix
    epoch. At midnight on January 1, 1970, Unix computers started counting the seconds.
    The *Unix epoch* is measured since that moment as a *time_t* value, which is a
    *typedef* of a *long unsigned int*. This data type''s range makes the Unix epoch
    calendar valid until January 19, 2038, at 3:14:07 a.m., when the computer suddenly
    believes that the date is December 13, 1901, all over again. And that was a Friday!


    Most Unix computers have addressed the 2038 problem, so unlike the Y2K crisis,
    nothing bad happens after January 19, 2038. The Unix epoch, however, is still
    used in time programming C functions.


    # Working with time in C


    Time functions and related matters in the C language are held in the `time.h`
    header file. In this file, you find goodies to sate your program''s timely needs.
    These items include the `time_t` data type and `tm` structure:


    | time_t | The time_t data type holds the value of the Unix epoch, or the number
    of seconds that have passed since January 1, 1970. On most systems, time_t is
    a typedef of a long signed int; use the %ld or %lu placeholder to output this
    value. |

    | struct tm | The tm structure holds definitions for storing various parts of
    a timestamp. It''s filled by the localtime() function. See the later section "Slicing
    through the time string." |'
  merge: -1
  img_proc: true
- pgno: 346
  md: 'Also defined in the `time.h` header file are these chronological functions:


    | Function | Description |

    | --- | --- |

    | *time()* | The *time()* function uses the address of the *time_t* variable as
    its argument. This function fills the *time_t* variable with the current Unix
    epoch time and it also returns a *time_t* value. |

    | *ctime()* | The *ctime()* function consumes a *time_t* variable and converts
    it into a displayable date-time string. |

    | *localtime()* | This function fills a *tm* structure with information based
    on the time value stored in a *time_t* variable. The *localtime()* function returns
    the address of the *tm* structure, so it gets all messy with structures and pointers
    and that `->` operator. |

    | *difftime()* | The *difftime()* function compares the values between two *time_t*
    values and returns a *float* value as the difference in seconds. |


    C libraries often come with other time-related functions, such as *sleep()* and
    *clock()*. These functions may not be available on all systems — which shouldn’t
    be a problem, because you can always code your own time functions.


    # # Time to Program


    I could imagine that the same Programming Lords who invented pointers and linked
    lists could really mess up your brain with time programming. Happily, they didn’t.
    Though a knowledge of pointers and structures helps you learn the ropes, time
    programming in C is straightforward.


    # ## Checking the clock


    The computer, or whichever device you’re programming, keeps a time value somewhere
    deep in its digital bosom. To access this value, you need to code a program that
    uses the *time()* function. It stuffs the current clock tick value into a *time_t*
    variable, as shown in Listing 21-1.'
