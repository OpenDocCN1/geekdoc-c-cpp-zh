  md: "# Storing strings\n\nWhen a program needs text input, it's necessary to create\
    \ a place to store that text. Right away, you'll probably say, “Golly! That would\
    \ be a string variable.” If you answered that way, I admire your thinking. You're\
    \ relying upon your knowledge that text in C programming is referred to as a string.\n\
    \nAlas, you're wrong.\n\nC lacks a string variable type. It does, however, have\
    \ character variables. Queue up enough of them and you have a string. Or, to put\
    \ it in programming lingo, you have an array of character variables.\n\nArrays\
    \ are a big topic, covered in Chapter 12. For now, be open-minded about arrays\
    \ and strings and soak in the goodness of Listing 7-4.\n\n# LISTING 7-4: Stuffing\
    \ a String into a char Array\n\n```\n#include <stdio.h>\n\nint main()\n{\n   \
    \ char prompt[] = \"Press Enter to explode:\";\n    printf(\"%s\",prompt);\n \
    \   getchar();\n    return(0);\n}\n```\n\nLine 5 creates an array of char variables.\
    \ An array is a gizmo that stores a bunch of the same data types all in a row.\
    \ The char array is named prompt, which is immediately followed by empty square\
    \ brackets. This is the Big Clue that the construction is an Array. The array\
    \ is initialized, via the equal sign, to the text enclosed in double quotes.\n\
    \nThe printf() statement in Line 7 displays the string stored in the prompt array.\
    \ The %s conversion character represents a string.\n\nIn Line 8, getchar() pauses\
    \ the program, anticipating the Enter key press. The program doesn't follow through\
    \ by exploding anything, a task I leave up to you to code at a future date."
