    # # Loopy Stuff


    I could go on and on about loops all day, repeating myself endlessly! Before moving
    on, however, I’d like to go over a few looping tips and pitfalls. These things
    you should know before you get your official *For Dummies* Looping Programmer
    certificate.


    # ## Looping endlessly


    Beware the endless loop!


    ![](img/dcc0cd79d4a45cfce24fa49d85442884_141_0.png)


    When a program enters an endless loop, it either spews output over and over without
    end or it sits there tight and does nothing. Well, it’s doing what you ordered
    it to do, which is to spin forever. Sometimes, this setup is done on purpose,
    but mostly it happens because of programmer error. And with the way loops are
    set up in C, it’s easy to unintentionally loop *ad infinitum*.'
