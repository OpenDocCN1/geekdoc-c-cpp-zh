  md: 'same values. No, it’s more like a series of cubbyholes into which you stick
    different values.


    An array is declared like any other variable. It’s given a data type and a name
    and then also a set of square brackets. The following statement declares the `highscore`
    array:


    ```

    ```

    int highscore[];

    ```

    ```


    This declaration is incomplete; the compiler doesn’t yet know how many items,
    or *elements*, are in the array. So if the `highscore` array were to hold three
    elements, it would be declared like this:


    ```

    ```

    int highscore[3];

    ```

    ```


    This array contains three elements, each of them its own `int` value. The elements
    are accessed and assigned like this:


    ```

    ```

    highscore[0] = 750;

    highscore[1] = 699;

    highscore[2] = 675;

    ```

    ```


    An array element is referenced by its index number in square brackets. The first
    item is *index 0*, which is something you must remember. In C, you start counting
    at 0, which has its advantages, so don’t think it’s stupid.


    ![](img/dcc0cd79d4a45cfce24fa49d85442884_190_0.png)


    In the preceding example, the first array element, `highscore[0]`, is assigned
    the value 750; the second element, 699; and the third, 675.


    After initialization, an array variable is used like any other variable in your
    code:


    ```

    ```

    var = highscore[0];

    ```

    ```


    This statement stores the value of array element `highscore[0]` to `int` variable
    `var`. If `highscore[0]` is equal to 750, `var` is equal to 750 after the statement
    executes.


    **Exercise 12-3:** Rewrite the source code from your solution to Exercise 12-2
    using an array as described in this section — but keep in mind that your array
    holds four values, not three.


    Many solutions exist for Exercise 12-3. The brute force solution has you stuffing
    each array variable individually, line after line, similar to the source code
    in Listing 12-1. A better, more insightful solution is offered in Listing 12-2.'
