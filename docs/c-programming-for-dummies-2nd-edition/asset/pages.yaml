  md: '![](img/dcc0cd79d4a45cfce24fa49d85442884_45_0.png)


    # PROGRAMMING LANGUAGE LEVELS


    It''s almost a tradition. Over time, hundreds of programming languages have been
    developed. Many fade away, yet new ones pop up annually. The variety is explained
    by different languages meeting specific needs.


    Generally speaking, programming languages exist on three levels:


    **High-level languages** are the easiest to read, using words and phrases found
    in human languages (mostly English). These languages are quick to learn, but are
    often limited in their flexibility.


    **Low-level languages** are the most cryptic, often containing few, if any, recognizable
    human language words. These languages, such as assembly, access hardware directly
    and therefore are extremely fast. The drawback is that development time is slow
    because pretty much everything must be done from scratch.


    **Midlevel** languages combine aspects from both high- and low-level languages.
    As such, these languages are quite versatile, and the programs can be designed
    to do just about anything. C is the prime example of a midlevel programming language.


    # Keywords


    Forget nouns, verbs, adjectives, and adverbs. The C language has *keywords*. Unlike
    human languages, where you need to know at least 2,000 or so words to be somewhat
    literate, the C language sports a scant vocabulary: Only a handful of keywords
    exist, and you may never use them all. Table 3-1 lists the 44 keywords of the
    C language.


    TABLE 3-1 C Language Keywords


    | _Alignas | break | float | signed |

    | _Alignof | case | for | sizeof |

    | _Atomic | char | goto | static |

    | _Bool | const | if | struct |

    | _Complex | continue | inline | switch |

    | _Generic | default | int | typedef |

    | _Imaginary | do | long | union |'
