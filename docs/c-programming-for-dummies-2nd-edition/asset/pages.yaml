  md: '# TABLE 13-3 String Functions


    | Function | What It Does |

    |---|---|

    | `strcat()` | Appends one string to another, creating a single string out of
    two. |

    | `strncat()` | Appends a given number of characters from one string to the end
    of another. |

    | `strchr()` | Searches for a character within a string. The function returns
    that character''s position from the start of the string as a pointer. |

    | `strcmp()` | Compares two strings in a case-sensitive way. If the strings match,
    the function returns 0. |

    | `strncmp()` | Compares the first n characters of two strings, returning 0 if
    the given number of characters match. |

    | `strcpy()` | Copies (duplicates) one string to another. |

    | `strncpy()` | Copies a specific number of characters from one string to another.
    |

    | `strlen()` | Returns the length of a string, not counting the \0 or NULL character
    at the end of the string. |

    | `strrchr()` | Searches for a character within a string, but in reverse. The
    function returns the character''s position from the end of the string as a pointer.
    |

    | `strstr()` | Searches for one string inside another string. The function returns
    a pointer to the string''s location if it''s found. |


    All the string functions in Table 13-3 require the `string.h` header file to be
    included with your source code:


    ```

    #include <string.h>

    ```


    ![](img/dcc0cd79d4a45cfce24fa49d85442884_214_0.png)


    On a Unix system, you can review all the string functions by typing the command
    `man string` in a terminal window.


    ![](img/dcc0cd79d4a45cfce24fa49d85442884_214_1.png)


    Be aware of nonstandard string functions. For example, the `strcasecmp()` function
    compares strings regardless of text case, though this function isn''t part of
    the standard C library. If you use such a function in your code, it may not compile
    on another computer system.


    # Comparing text


    Strings are compared by using the `strcmp()` function and its cousin `strncmp()`.


    The string comparison functions return an `int` value based on the result of the
    comparison: 0 for when the strings are equal, or a higher or lower `int` value
    based on whether the first string''s value is greater than (higher in the alphabet)
    or less than (lower in the alphabet) the second string. Most of the time, you
    just check for 0.'
