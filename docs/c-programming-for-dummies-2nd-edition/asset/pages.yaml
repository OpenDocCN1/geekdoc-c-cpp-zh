- pgno: 69
  md: '# Employing escape sequences


    To reference certain characters that you can''t type into your source code, the
    C language uses something called an escape sequence. The escape sequence allows
    you to direct the compiler to temporarily suspend its acceptance of what you''re
    typing and instead interpret special characters and codes.


    The standard escape sequence uses the backslash character followed by a second
    character; for example:


    ```

    \n

    ```


    This is the escape sequence for the newline character. The compiler reads both
    the backslash and the character that follows it as a single character, interpreting
    that character as one that you can''t type at the keyboard, such as the Tab key
    or Enter key or characters that may foul up the source code, such as a double
    quote.


    Table 4-1 lists the standard C language escape sequences.


    TABLE 4-1:


    # Escape Sequences


    | Escape Sequence | Character It Produces |

    |---|---|

    | \a | Bell ("beep!") |

    | \b | Backspace, non-erasing |

    | \f | Form feed or clear the screen |

    | \n | Newline |

    | \r | Carriage return |

    | \t | Tab |

    | \v | Vertical tab |

    | \\ | Backslash character |

    | \? | Question mark |

    | \'' | Single quote |

    | \" | Double quote |

    | \xnn | Hexadecimal character code nn |

    | \onn | Octal character code nn |

    | \nnn | Octal character code nn |'
