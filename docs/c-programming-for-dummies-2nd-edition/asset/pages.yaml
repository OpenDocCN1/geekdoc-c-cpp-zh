    # Exercise 6-14: Edit the code to replace the value with 5. Compile and run.


    You might think that Exercise 6-14 is cruel and requires a lot of work (unless
    your source code editor has a nifty search-and-replace command), but such changes
    occur frequently in programming. For example, I wrote a program that displays
    the top three most recent items added to a database. But then I wanted to change
    the list so that it shows the top five items. As you had to do in Exercise 6-14,
    I had to painstakingly search-and-replace throughout the entire source code, carefully
    plucking out all references to 3 and substituting 5.


    There must be a better way.


    # Constants in your code


    One solution for dealing with the problems presented in Exercises 6-13 and 6-14
    is to use a variable. However, because the variable''s value doesn''t change throughout
    the main() function, you can instead use a constant.


    Like a variable, a constant is a named value used throughout a function. Think
    of it as a substitute, something you can quickly change in one spot and have the
    effect widespread.


    Constants are created like variables, but with the keyword const prefixing the
    data type:


    ```

    const type name = value;

    ```


    type is the data type, same as a variable. It can be int, char, double, or any
    valid C language data type; refer to Table 6-2.


    name is the constant''s name, just like a variable with the same naming restrictions,
    rules, and whatnot.'
