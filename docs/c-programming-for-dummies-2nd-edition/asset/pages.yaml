- pgno: 363
  md: "![](img/dcc0cd79d4a45cfce24fa49d85442884_363_0.png)\n\nIn earlier versions\
    \ of the C standard, it was common to add a b to the fopen() function's mode string\
    \ when reading or writing binary data. This requirement is no longer the case.\
    \ A modern compiler ignores the \"b\" in a mode string if used in the fopen()\
    \ function.\n\n# Reading binary data\n\nThe fread() function reports for duty\
    \ when it comes time to read binary information from a file. Like the fwrite()\
    \ function, fread() takes in raw data and stuffs it into a C language variable\
    \ for further examination. Listing 22-6 provides a demonstration. The scores.dat\
    \ file in the listing is created in the preceding section's Exercise 22-8.\n\n\
    # LISTING 22-6: Check Those High Scores\n\n```\n```c\n#include <stdio.h>\n#include\
    \ <stdlib.h>\n\nint main()\n{\n    FILE *handle;\n    int highscore[5];\n    int\
    \ x;\n\n    handle = fopen(\"scores.dat\",\"r\");\n    if(!handle)\n    {\n  \
    \      puts(\"File error!\");\n        exit(1);\n    }\n    fread(highscore,sizeof(int),5,handle);\n\
    \    fclose(handle);\n    for(x=0;x<5;x++)\n        printf(\"High score %d: %d\\\
    n\",x+1,highscore[x]);\n    return(0);\n}\n```\n```\n\nThanks to the flexibility\
    \ of the fread() function, and its ability to devour multiple values at a time,\
    \ Line 16 in Listing 22-6 gobbles up all five int values that were previously\
    \ saved in the scores.dat file. The fread() function works just like fwrite()\
    \ and has the same arguments in the same order, but binary data is read from the\
    \ file."
