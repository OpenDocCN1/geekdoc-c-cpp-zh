  md: "# Arguments for the main() Function\n\nBack in the old days, programs featured\
    \ command-line options or switches. For example, to compile and link a C program,\
    \ you type something like this:\n\n```\ncc ex1501.c -o ex1501\n```\n\nThe three\
    \ tidbits of text after the cc command are options or switches. With the cc program,\
    \ these text tidbits are accessed as arguments to the main() function. A program\
    \ can read these arguments to perform certain actions. Even today, when the world\
    \ runs graphical operating systems, command-line arguments are relevant. All you\
    \ need to do in your code is examine the arguments to the main() function.\n\n\
    # Reading the command line\n\nPretend that it's 1987 and you're writing a program\
    \ that says “Hello” to the user by name. The way you get the user's name is to\
    \ have your code swallow the first chunk of text that appears after the program\
    \ name at the command line. That code may look something like Listing 15-1.\n\n\
    # LISTING 15-1: Well, Hello There!\n\n```\n#include <stdio.h>\n\nint main(int\
    \ argc, char *argv[])\n{\n    if(argc>1)\n        printf(\"Greetings, %s!\\n\"\
    ,argv[1]);\n    return(0);\n}\n```\n\nLine 3 in Listing 15-1 is different from\
    \ the ones you see earlier in this book. Instead of being empty, the main() function\
    \ now shows its two arguments — argc and *argv[] — in its parentheses.\n\nLine\
    \ 5 uses the int value argc to determine whether any additional items were typed\
    \ after the program name at the command prompt."
  merge: -1
  img_proc: true
