    Build errors are wonderful things, delightfully accurate yet entirely cryptic.
    Here are the warning and error messages generated by my compiler and linker, showing
    only the relevant parts of each message:


    ```

    13 warning: implicit declaration of function ''prompt''

    22 error: conflicting types for ''prompt''

    ```


    The first warning occurs at Line 13 in my source code file, where the prompt()
    function is used inside the main() function. The compiler is telling you that
    a function is called without a prototype. As the message says, you''re implicitly
    declaring a function. That''s a no-no, but not a full-on error; the compiler generates
    object code, praying that the linker can resolve the unknown function.


    The error occurs where the prompt() function dwells in the program. In my source
    code, it''s at Line 22. The prompt() function''s data type is incorrect because
    the linker assumes integer as an unknown function''s data type.


    You may draw the conclusion that prototyping is an absolute necessity in your
    C code. This assumption isn''t entirely true. You can avoid prototyping by reordering
    the functions in your source code. As long as a function is listed before it''s
    used, you don''t need a prototype.


