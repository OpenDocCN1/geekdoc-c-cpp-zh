    functions are presented automatically, along with hints for their arguments and
    options.

    +   » The editor features a tabbed interface, which lets you work on multiple
    source code files at one time.


    # Your First Program


    The traditional first program written for any programming language is called Hello
    World. It''s boring, like all traditions.'
