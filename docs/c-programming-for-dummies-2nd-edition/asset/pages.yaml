- pgno: 25
  md: 'The computer is your primary tool for writing and compiling code. Yes, even
    if you’re writing a game for the Xbox, you need a computer to be able to run Windows
    or a Macintosh. The computer can run Windows or Linux.


    Internet access is necessary to obtain the programming software. You need a text
    editor to write the code and a compiler to translate the code into a program.
    The compiler generally comes with other tools you need, such as a linker and a
    debugger. All these tools are found at no cost on the Internet.


    The software tools offer two approaches to programming: command line and IDE.


    If you want to learn C programming as I did back in the dark ages, you use a terminal
    window and traditional command-line tools: editor, compiler, and linker. The process
    is fast, but complicated because you’re using text mode commands. Still, it offers
    a spiritual connection with those who built the foundations upon which the computer
    industry roosts.


    The most common way to craft code, however, is to obtain an integrated development
    environment — called an IDE by the cool kids. It combines all the tools you need
    for programming into one compact, terrifying, and intimidating unit.


    Don’t freak! The terms compiler, linker, debugger, and terrifying are all defined
    in Chapter 2.


    # Command Prompt Programming


    To re-create the environment where the C language was born, use a Unix or Linux
    terminal window running a shell program such as bash. This environment is available
    to all major computing platforms, and the programming tools used are reliable
    and well-documented. Programming at the command prompt earns you a nerd merit
    badge and the admiration of your peers.


    For Windows 10, open the Microsoft Store app and install Ubuntu, a free Linux
    shell. Ensure that you follow the directions to install the Windows Subsystem
    for Linux, which is an extra step you’ll probably miss.


    For Linux, you’re ready to go: Open a terminal window to access the shell.'
  merge: -1
  img_proc: true
- pgno: 26
  md: 'For Mac OS X, use the Terminal app. I also recommend obtaining the Homebrew
    package manager. Visit https://brew.sh for directions. Homebrew allows you to
    install programming tools not available to OS X.


    For an editor, you can use any text mode editor available at the command prompt,
    such as vi or emacs. You can also “mix it up” and use a window-based editor. I’m
    fond of using the Windows version of the VIM editor while I simultaneously work
    at the command prompt in an Ubuntu terminal window.


    A C compiler comes native to a Unix/Linux command prompt. The standard version
    is cc or gcc, but I recommend that you use the shell’s package manager to acquire
    the LLVM clang compiler. In Ubuntu Linux for Windows 10, type this command to
    install clang:


    ```

    ```

    sudo apt-get install clang

    ```

    ```


    Type your account password to initiate the process. To verify the installation,
    type


    ```

    ```

    clang --version

    ```

    ```


    Various Linux distros offer similar package managers, which you can use to obtain
    an editor and the clang compiler.


    ![](img/dcc0cd79d4a45cfce24fa49d85442884_26_0.png)


    +   - The VIM editor can be obtained from vim.org.

    +   - Your choice to use the command prompt means you''re taking on an extra layer
    of complexity when it comes to programming. I find it fast and enjoyable, but
    if you believe it to be too much, especially when first learning the C language,
    rely instead upon an IDE, as covered in the next section.


    # IDE Programming


    Plenty of programming IDEs are available for your C coding pleasure. On the Mac,
    use Xcode, which you can install from the App Store. For Windows and Linux, I
    recommend obtaining the Code::Blocks IDE, which is found at codeblocks.org. You
    can choose any other IDE you prefer, but Code::Blocks for Windows is fairly stable
    and comes with everything you need — providing that you install the correct version.'
  merge: -1
  img_proc: true
