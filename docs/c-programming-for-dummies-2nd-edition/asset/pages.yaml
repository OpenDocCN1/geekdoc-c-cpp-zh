  md: "Exercise 8-2: Edit the source code from Listing 8-1 so that addition instead\
    \ of subtraction is performed in Line 8. Can you explain the program's output?\n\
    \n# Introducing the if keyword\n\nThe if keyword is used to make decisions in\
    \ your code based upon simple comparisons. Here's the basic format:\n\n```\nif(expression)\n\
    {\n    statement;\n}\n```\n\nThe expression is a comparison, a mathematical operation,\
    \ the result of a function, or some other condition. When the expression is true,\
    \ the statements (or statement) enclosed in braces are executed; otherwise, they're\
    \ skipped.\n\nThe if statement's expression need not be mathematical. It can be\
    \ a function that returns a true or false value, for example:\n\n```\nif( ready()\
    \ )\n```\n\nThis statement evaluates the return of the ready() function. If the\
    \ function returns a true value, the statements belonging to if are executed.\n\
    \nAny non-zero value is considered true in C. Zero is considered false. So this\
    \ statement is true:\n\n```\nif(1)\n```\n\nAnd this statement is always false:\n\
    \n```\nif(0)\n```\n\nYou know whether a function returns a true or false value\
    \ by reading the function's documentation, or you can set a true or false return\
    \ value when writing your own functions.\n\nYou cannot compare strings by using\
    \ an if comparison. Instead, you use specific string comparison functions, which\
    \ are covered in Chapter 13.\n\nWhen only one statement belongs to an if comparison,\
    \ the braces are optional.\n\n![](img/dcc0cd79d4a45cfce24fa49d85442884_114_0.png)"
