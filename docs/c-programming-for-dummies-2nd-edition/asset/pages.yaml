    You can read more about the reason fgets() is a preferred text input function
    in the nearby sidebar, “Avoid fgets()’s evil sibling gets().”


    ![](img/dcc0cd79d4a45cfce24fa49d85442884_111_0.png)


    +   - The fgets() function as presented in this section reads text from the standard
    input device, not from the keyboard directly.

    +   - The value returned by fgets() is the string that was input. In this book''s
    sample code, this return value isn''t used, although upon success, the string
    returned is identical to the information stored in the fgets() function''s first
    argument, the char array variable.

    +   - Chapter 13 offers more information about strings in C.


    ![](img/dcc0cd79d4a45cfce24fa49d85442884_111_1.png)


    # AVOID FGETS()’S EVIL SIBLING GETS()


    The original C language string-input function was gets(), for get-string. It took
    only a single argument, the character buffer or array into which text input was
    stored. The problem? No limit was set on this input, which means the buffer could
    easily overflow and wreak havoc in the computer. In fact, many early computer
    viruses were written specifically to exploit this weakness in the gets() function.


    The gets() function is still available in the C library, though the compiler scolds
    you heavily for using it. Further, many compilers add warning text to any program
    created with the gets() function included in the code.


    Bottom line: Don’t use gets() — use fgets() instead.'
