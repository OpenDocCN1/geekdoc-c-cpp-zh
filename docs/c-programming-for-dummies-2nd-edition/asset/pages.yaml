- pgno: 170
  md: 'To add one to a variable''s value, use ++, as in


    ```

    var++;

    ```


    After this statement is executed, the value of variable var is increased (incremented)
    by 1. It''s the same as writing this code:


    ```

    var=var+1;

    ```


    You''ll find ++ used all over, especially in for loops; for example:


    ```

    for (x=0;x<100;x++)

    ```


    This looping statement repeats 100 times. It''s much cleaner than writing the
    alternative:


    ```

    for (x=0;x<100;x=x+1)

    ```


    # Exercise 11-1: Code a program that outputs this phrase ten times: "Get off my
    lawn, you kids!" Use the incrementing operator ++ in the for looping statement.


    # Exercise 11-2: Rewrite your answer for Exercise 11-1 using a while loop.


    The ++ operator''s opposite is the decrementing operator --, which is two minus
    signs. This operator decreases the value of a variable by 1; for example:


    ```

    var--;

    ```


    The preceding statement is the same as


    ```

    var=var-1;

    ```


