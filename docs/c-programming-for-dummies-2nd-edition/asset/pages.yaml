    \ a single, long printf() statement. The line wraps in Listing 6-4 because of\
    \ this book's page width, and it may wrap in your editor as well. When the code\
    \ wraps, don't press the Enter key to start a new line.\n\n![](img/dcc0cd79d4a45cfce24fa49d85442884_91_1.png)\n\
    \nYou can split a long statement in C simply by escaping the Enter key press at\
    \ the end of a line. Escaping in this context doesn't mean that you're fleeing\
    \ danger (other than offending the compiler); instead, you use the backslash (the\
    \ escape character) to read the Enter key without messing up the statement in\
    \ your code. To wit:\n\n```\nprintf(\"Shad is %d\\nMesh is %d\\nAbed is %d\\n\"\
    ,\\\n    shadrach,meshach,abednego);\n```\n\nI shortened the names in the formatting\
