- pgno: 433
  md: '+   - ASCII 0 through ASCII 31 represent control code values. These characters
    are accessed by pressing the Ctrl key on the keyboard and typing the corresponding
    symbol or letter key.

    +   - Code 32 is the code for the space character.

    +   - Code 127 is the Delete character, which is different from Code 8, Backspace.
    The reason is that Code 8 is defined as nondestructive, which means that it only
    moves the cursor back a space.

    +   - Many of the control codes manipulate text on the screen, such as Ctrl+I
    for the Tab key.

    +   - A keen eye can spot three repetitions in the ASCII code lists. Look at codes
    0 through 26 and then 64 through 90. Also look at codes 97 through 122.

    +   - The difference between uppercase and lowercase characters in the table is
    32, a computer holy number. The hexadecimal difference is 0x20. Therefore, by
    using simple math, or bitwise logic, you can convert between upper- and lowercase.

    +   - The digits 0 through 9 are equal to the values 0 through 9 when you subtract
    48 (0x30) from the ASCII code values. Likewise, to convert values 0 through 9
    into their corresponding ASCII characters, add 48 or 0x30.

    +   - Any ASCII character can be represented as an escape sequence. Follow the
    backslash with the character''s code value, as in \33 for the exclamation point
    (!) character. The hexadecimal value can also be used, as in \x68 for the little
    H.'
  merge: -1
  img_proc: true
