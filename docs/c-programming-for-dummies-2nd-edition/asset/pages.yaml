  md: 'Type the pathname on your own system to visit the proper directory. If you''re
    using Code::Blocks, the project folder is named after the project you''ve saved,
    such as ex1409 for the last project in Chapter 14. To run the program that''s
    created, you must change to the project''s bin folder:


    ```

    cd ex1409/bin/release

    ```


    The current directory now contains the executable program file for your project.


    # 3. To run the program, type its name at the command prompt.


    For example, the default output name for the cc, gcc, and clang compiler is a.out.
    Type this command:


    ```

    ./a.out

    ```


    The ./ directs the shell to look for an executable file in the current directory,
    a.out. Otherwise, you follow the ./ with the program file''s name.


    Follow these steps to run any program you''ve created at the command prompt. Alternative
    ways exist to specify the arguments in an IDE. These methods are covered elsewhere
    in this chapter.


    ![](img/dcc0cd79d4a45cfce24fa49d85442884_239_0.png)


    # FINDING WINDOWS FILES IN UBUNTU


    If you''re using Ubuntu in Windows 10, be aware that it uses a separate file system
    from Windows. To access files in the Windows file system, at the bash shell you
    must use this command:


    ```

    cd /mnt/c

    ```


    The /mnt/c folder is a mount point for drive C, which is where Windows is normally
    installed. From there, you can change to the Users directory, and then to your
    user profile folder. Then you can change to the directory (folder) where you keep
    program files.


    This technique offers a good solution for using the Linux bash shell for coding,
    but be aware that you shouldn''t venture in the other direction: Don''t use Windows
    to find the Ubuntu file system and use the File Explorer to manage files there.
    If you do, the files may not synchronize properly, which leads to more problems
    you don''t want.'
