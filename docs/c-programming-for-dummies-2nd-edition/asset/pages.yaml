- pgno: 76
  md: '# Minding the extra zeros


    When you wrote the code for Exercise 5-1, you probably expected the program''s
    output to display the value 98.6, just as it''s written. The problem is that you
    directed the printf() function to output that number in the default manner. 98.00000.
    In fact, you may see more or fewer zeros, depending on your compiler.


    The value 98.00000 is a floating-point number, and it most likely represents the
    way the value is stored inside the computer. Specifically, the value is stored
    using eight digits, but human beings don''t usually write trailing zeros after
    numbers. Computers? They write as many zeros as fits eight digits (not counting
    the decimal).


    To fix the output, direct the printf function to format the floating-point number.
    That requires a more complex version of the %f placeholder, something you''re
    introduced to in Chapter 7. Specifically, change the %f placeholder to read %.2f.
    Here''s the new Line from Listing 5-1.


    ```

    printf("The value %.2f is a float.\n",98.6);

    ```


    By squeezing 2.1 between the % and the f, you direct printf() to format the output
    with two digits to the left of the decimal and one digit to the right.


    Exercise 5-3: Modify your source code from Exercise 5-2 so that the value 3.1415926535
    is displayed by using the %.1f placeholder, and the value 0.00008 is displayed
    using the %.1f placeholder.


    # The Computer Does the Math


    It should come as no surprise that computers can do math. In fact, I''d bet that
    your computer is, right now, some eager to solve some mathematical puzzles than
    it is for you to visit Facebook. More math puzzles shown earlier in this chapter
    merely bored the processor. Time to put it to work!




    Math in your C source code is brought to you by the +, -, *, and / operators.
    These are the basic math symbols, with the exception of * and /, mostly because
    the × and + characters aren''t found on the typical computer keyboard. For reference,
    Table 5-1 lists the basic C language math operators.'
