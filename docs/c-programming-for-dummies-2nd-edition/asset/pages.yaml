    \ prompt, the *cmd* program, to output its text mode programs. This environment\
    \ is rather limited, which is why I recommend obtaining the Ubuntu shell for Windows\
    \ 10.\n\n> Using the Ubuntu shell in Windows 10 involves more than just obtaining\
    \ the app from the Microsoft Store. You must also configure Windows per the directions\
    \ offered. Don't worry! If you screw up, the error message explains what to do.\n\
    \n![](img/dcc0cd79d4a45cfce24fa49d85442884_238_0.png)\n\n# Running code in text\
    \ mode\n\nThe programs you create in this book all run in Text mode. If you're\
    \ using Code::Blocks, you see an output window, but you can also run your programs\
    \ directly at the DOS command prompt. The trick is finding the program, which\
    \ requires a little command-prompt acumen.\n\nWhy do this?\n\nBecause it's the\
    \ best way to test programs that access the main() function's arguments, which\
    \ are obtained from the command prompt. Heed these directions:\n\n+   1. **Open\
    \ the terminal window.**\n+   Refer to the directions in the preceding section.\n\
    +   \n+   The command prompt or terminal window opens to your home folder, which\
    \ is called a *directory* in text mode. The home directory most likely doesn't\
    \ contain your C programs, so you must change to another directory.\n+   \n+ \
    \  2. **Use the cd, change directory, command to switch to the folder you created\
    \ for storing this book's projects.**\n+   For example, I save my C programming\
    \ projects in the prog/c directory. For this book, source code files dwell in\
    \ the cprog subdirectory. The shell command I type to visit this directory is\n\
    \n```\ncd ~/prog/c/cprog\n```\n\nType a space after the cd command and then type\
    \ the pathname, such as my ~/prog/c/cprog (where ~ is the shortcut to your account's\
    \ home directory)."
