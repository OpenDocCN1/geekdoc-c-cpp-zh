    # Chapter 23


    # File Management


    The C library features many functions that interface directly with the operating
    system, allowing you to peek, poke, and prod into the very essence of files themselves.
    You never know when you need to plow through a directory, rename a file, or delete
    a temporary file that the program created. It’s powerful stuff, but such file
    management is well within the capabilities of your C programs.


    # Directory Madness


    A directory is nothing more than a database of files stored on a device’s mass
    storage system. Also called a folder, a directory contains a list of files plus
    any subdirectories. Just as you can manipulate a directory, a directory can be
    opened, read, and then closed. And, as with the directory listing you see on a
    computer screen, you can gather information about the various files, their sizes,
    types, and more.


    # Calling up a directory


    The C library’s opendir() function examines the contents of a specific directory.
    It works similarly to the fopen() function. Here’s the format:


    ```

    dhandle = opendir(pathname);

    ```'
