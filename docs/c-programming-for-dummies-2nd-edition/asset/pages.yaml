- pgno: 149
  md: 'The name is followed by parentheses, which are then followed by a set of curly
    brackets. So, in its simplest construction, a function looks like this:


    ```

    type function() { }

    ```


    In the preceding example, type defines the function''s data type, which is related
    to the value returned from the function. Options for type include all the standard
    C data types — char, int, float, double — and also void for cheap functions that
    don''t return anything.


    function is the function''s name. It''s followed by a pair of parentheses, which
    can, optionally, contain values passed to the function. These values are called
    arguments. Not every function features arguments.


    Central to a function are its statements, enclosed in curly brackets. These statements
    are what make the function do its thing.


    Functions that return a value must use the return keyword. The return statement
    either ends the function directly or passes a value back to the statement that
    called the function. For example:


    ```

    return;

    ```


    This statement ends a function and doesn''t pass on a value. Any statements in
    the function after return are ignored.


    ```

    return(something);

    ```


    This statement passes the value of the something variable back to the statement
    that called the function. The something must be of the same data type as the function,
    an int, the float, and so on.


    Functions that don''t return values are declared of the void type. Those functions
    end with the last statement held in the curly brackets; a return statement isn''t
    required.


    One more important thing! Functions must be prototyped in your code. This is so
    that the compiler understands the function and sees to it that you use it properly.
    The prototype describes the value returned and any arguments the function requires.
    The prototype must appear in your source code before any statement calls the function.
    Listing 10-1 shows a prototype example at Line 3.


    ![](img/dcc0cd79d4a45cfce24fa49d85442884_149_0.png)'
