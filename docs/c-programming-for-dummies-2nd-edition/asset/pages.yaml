  md: "# # Pointers in Functions\n\nA pointer is a type of variable. As such, it can\
    \ easily be flung off to a function. Even more thrilling, a pointer can wander\
    \ back from a function as a return value. Oftentimes, these tricks are the only\
    \ ways to get information to or from a function.\n\n# ## Passing a pointer to\
    \ a function\n\nThe great advantage of passing a pointer to a function is that\
    \ the information that’s modified is automatically returned. That’s because the\
    \ function references a memory address, not a value directly. By using that address,\
    \ information can be manipulated directly. Listing 19–11 demonstrates.\n\n# **LISTING\
    \ 19-11: Pointing at a Discount**\n\n```\n```c\n#include <stdio.h>\n\nvoid discount(float\
    \ *);\n\nint main()\n{\n    float price = 42.99;\n\n    printf(\"The item costs\
    \ $%.2f\\n\",price);\n    discount(&price);\n    printf(\"With the discount, that's\
    \ $%.2f\\n\",price);\n    return(0);\n}\n\nvoid discount(float *a)\n{\n    *a\
    \ *= 0.90;\n}\n```\n```\n\nIn Line 3 of Listing 19–11, the *discount()* function\
    \ is prototyped. It requires a *float* pointer variable as its only argument.\n\
    \nLine 10 passes the address of the *price* variable to the *discount()* function.\
    \ The & operator obtains the memory location of the *price* variable."
