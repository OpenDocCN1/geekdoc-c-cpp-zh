    # Compiling and linking


    Traditionally, the compiler reads text from a source code file and translates
    that text — a programming language — into something called object code. The linker
    then creates the final program. It links the object code file with C language
    libraries to create a program. All this happens exactly as written — unless a
    warning or an error crops up along the way.


    You can compile and link separately in an IDE or at the command prompt. Fortunately,
    modern compilers combine both steps in a process called build.


    ![](img/dcc0cd79d4a45cfce24fa49d85442884_41_0.png)


    To build the project for Listing 2-1 in Code::Blocks, click the Build toolbar
    button (shown in the margin) or choose Build > Build from the menu. Any errors
    present themselves on the Build Log tab as well as on the Build Messages tab.


    ```

    ```

    clang -c -Wall ex0201.c

    ```

    ```


    First comes the compiler name, clang, followed by the -Wall switch to report all
    warnings. The final argument is the source code filename. Upon success, you see
    no feedback; otherwise, warnings and error messages spill on the screen like fruit
    from an upturned apple cart.


    (Running the program file is covered in the next section.)


    > The object code file has the same name as the source code file, but ends in
    .o ("dot-o"). If the source code file is named ex0201.c the object code file is
    named ex0201.o. The modern build process deletes this file unless you specifically
    direct the compiler to generate and retain the object code file.


    As the compiler translates your C code into object code, it checks for common
    mistakes, missing items, and other issues. If anything is awry, the compiler displays
    a list of warnings. To fix them, you re-edit the source code and attempt to compile
    once again.


    The linker brings in the C language library, which is how the final program is
    built. The libraries contain the actual instructions that tell the computer (or'
