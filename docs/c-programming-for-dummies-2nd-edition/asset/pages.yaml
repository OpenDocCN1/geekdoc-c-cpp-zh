    # Chapter 3


    # Anatomy of C


    All programming languages consist of instructions that tell a computer or another
    electronic device what to do. Though basic programming concepts remain the same,
    each language is different, created to fulfill a specific need or to frustrate
    a new crop of college freshmen. The C language meets both of those qualifications,
    being flexible and intimidating. To begin a relationship with C in a friendly,
    positive way, get to know the language and how it works.


    ![](img/dcc0cd79d4a45cfce24fa49d85442884_44_0.png)


    You''ll probably want to reread this chapter after you venture deep into Part
    2 of this book.


    # Parts of the C Language


    Unlike a human language, C has no declensions or cases. You''ll find no masculine,
    feminine, or neuter. And you never need to know what the words pluperfect subjunctive
    mean. You do have to understand some of the lingo, the syntax, and other mischief.
    This section provides an overview of what''s what in the C language.'
