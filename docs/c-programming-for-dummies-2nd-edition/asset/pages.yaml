  md: '+   » Inserting code to help you debug

    +   » Configuring a project for debugging

    +   » Using Code::Blocks'' GNU debugger

    +   » Stepping through a program

    +   » Checking the values of variables

    +   » Writing better error messages


    # Chapter 25


    # Out, Bugs!


    Everyone writes buggy code. Not intentionally, of course. Even the best programmers
    get lazy or sloppy and do silly things. Stray semicolons, misplaced commas, and
    missing curly brackets happen to all programmers. Fortunately, the compiler catches
    a lot of this crummy code. Fix the source code and recompile to deal with those
    annoying, typical bugs.


    For deeper problems, flaws in logic, or maybe code boo-boos that aren’t easy to
    find, it helps to have a little assistance. That assistance comes in the form
    of debugging your code, which you can do manually or with the help of a debugger.
    The goal is to see what’s gone wrong.


    # Simple Tricks to Resolve Problems


    When I can’t figure out what’s going on with a program and I’m too lazy to run
    it through a debugger, I use the printf() and puts() functions as my debugging
    friends. These tools can output helpful messages and values, assisting me in determining
    what’s buggy with the code.'
  merge: -1
  img_proc: true
- pgno: 397
  md: '# Documenting the flow


    Suppose a function receives variable x but, somehow, variable x never shows up.
    Where did it go? To find out, I insert the following statement into the code:


    ```

    printf("value of ''x'' at Line 125: %d\n",x);

    ```


    This statement may appear in several places, tracing the value of variable x as
    it moves through the code. The output clues me in to where variable x wanders
    off. Further, you can use the __LINE__ macro instead of hard-coding the line number:


    ```

    printf("value of ''x'' at Line %d: %d\n",__LINE__,x);

    ```


    The preprocessor expands the __LINE__ macro — and yes, it has two underscores
    before and after — into the current source code line number. By using this trick,
    you can set an output message and continue to edit your code without manually
    updating line numbers.


    When I''m not tracking a variable and I only want to know why a chunk of code
    isn''t executing, I insert a puts() statement, like this:


    ```

    puts("You got to here");

    ```


    When I see the preceding text in the output, I know that the code is being approached
    but still may not be executed. At this point, I examine the code nearby, looking
    for common C language boo-boos, many of which are documented in Chapter 26.


    # Talking through your code


    An excellent way to catch flaws in program flow is to talk through your code.
    The catch is that you must do so out loud. Yes, this trick can be embarrassing,
    but it''s highly effective.


    For example, some code isn''t working and you have no clue why. Pretend you''re
    speaking with a fellow programmer. Explain to the phantom person what your code
    is doing and how it works. As you talk through your code, the problem may suddenly
    appear. Believe it or not, this trick has worked for me dozens of times.


    # Writing comments for future-you


    Another thing you can do to help fix undue woe is to use comments to describe
    the problem in the code. This approach may not fix the problem now, but for'
