- pgno: 16
  md: '# # Introduction


    When I was in school, I’d open a new math textbook and look in the back, marveling
    at the problems. Someday, I thought, I would understand all this nonsense.


    You should do that with this book right now: Open it up to one of the final chapters.
    Look over the C programming code and think to yourself, “Someday soon, this will
    all make perfect sense to me.”


    Say “Hello, world” to *C Programming For Dummies*, 2nd Edition, the book that
    sets you on the path to become a computer programmer. Once despised vermin, banished
    to basement server rooms and suffering from a lack of personal hygiene, programmers
    are now valued and contributing members of society. Some are billionaires. And
    they all started their careers by learning to program.


    The C language lets you master a number of electronic gizmos. You can craft your
    own programs, dictating your every whim and desire to computers, tablets, and
    cell phones. The electronics dutifully obey. Given the information offered in
    this book, you can pass that programming class, impress your friends, be admired
    by Hollywood, or even start your own software company. Truly, learning to program
    is a worthy investment of your time.


    This book helps make learning how to program understandable and enjoyable. You
    don’t need any programming experience — you don’t even need to buy new software.
    You just need the desire to program in C and the ability to have fun while doing
    so.


    # ## Why the C Language?


    An argument surfaces every few years that learning C is a road to nowhere. Newer,
    better programming languages exist, and it''s far better to learn them than to
    waste time learning C.


    Poppycock.'
  merge: -1
  img_proc: true
- pgno: 17
  md: 'C continues to dominate the charts for best and most useful programming languages,
    often beating out the newer languages the cool programmers use. Further, C is
    like the Latin of computer languages: Just about every Johnny-come-lately programming
    language uses C syntax. C keywords and even certain functions find their way into
    other popular languages, from C++ to Java to Python to whatever the latest, trendy
    language might be.


    My point is that once you learn C programming, all those other programming languages
    come easy. In fact, many of the books that teach those other languages often assume
    that you know a little C before you start out. This assumption is frustrating
    for a beginner — but not when you already know C.


    So ignore the lofty pundits and know-it-all poohbahs. C is still relevant. Programming
    for microcontrollers, operating systems, and major software packages is still
    done using good ol'' C. You are not wasting your time.


    # The C Programming For Dummies Approach


    As a programmer, I’ve toiled through many programming books. I know what I really
    don’t like to see, and, lamentably, I see it often — that is, where the author
    writes pages-long code or boasts about what he knows, impressing his fellow nerds
    and not really teaching anything. Too much of this type of training exists, which
    is probably why you’ve picked up this book.


    My approach here is simple: Short programs. To-the-point demonstrations. Lots
    of examples. Plenty of exercises.


    The best way to learn something is by doing it. Each concept presented in this
    book is coupled with sample code. The listings are short enough that you can quickly
    type them in — and I recommend that you do so. You can then build and run the
    code to see how things work. This immediate feedback is not only gratifying, it’s
    also a marvelous learning tool.


    Sample programs are followed by exercises you can try on your own, testing your
    skills and expanding your knowledge. Suggested answers to the exercises and all
    the source code can be found on this book’s companion website:


    ```

    https://c-for-dummies.com/cprog

    ```'
  merge: -1
  img_proc: true
- pgno: 18
  md: "# How This Book Works\n\nThis book teaches the C programming language. It starts\
    \ by assuming that you know little to nothing about programming, and it finishes\
    \ by covering some of the more advanced C operations.\n\nTo program in C, you\
    \ need a computer. This book makes no assumptions about the computer you select:\
    \ It can be a Windows PC, a Macintosh, or a Linux system. You can choose to use\
    \ an integrated development environment (IDE) such as Code::Blocks, or you can\
    \ compile and run the sample programs at a command prompt.\n\nThis book also wastes\
    \ no time, getting you started immediately in Chapter 1. Nothing is introduced\
    \ without a full explanation first. Due to the nature of programming, I've made\
    \ a few exceptions; they're carefully noted in the text. Otherwise, the book flows\
    \ from front to back, which is how best to read this book.\n\nC language keywords\
