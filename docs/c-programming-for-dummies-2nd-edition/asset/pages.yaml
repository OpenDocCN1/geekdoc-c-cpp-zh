    # Chapter 6


    # A Place to Put Stuff


    Human beings have obsessed over storing stuff ever since the Garden of Eden, when
    Adam stashed a grape in his belly button. This raises the question of why Adam
    would have a belly button, but that’s not my point. My point is that people enjoy
    storing things and creating places — boxes, closets, garages, and underground
    bunkers — in which to store stuff.




    C programs use three types of values: immediate, constant, and variable. An immediate
    value is one that you specify in the source code — a value you type. Constants
    are discussed later in this chapter. Variables are storage containers for values
    where the contents can change. Their contents can vary — hence the name.'
