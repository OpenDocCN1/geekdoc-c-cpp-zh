    Ensure that the header file ex2403.h is in the same build folder as the main.c
    file when building the project in Code::Blocks. If it isn’t, the compiler belches
    up a fatal error.


    You don’t specify the header file when compiling at the command line. The command
    to build Exercise 24-3 is clang main.c -o main, where the program output is named
