    \ as are other programming editors, you may catch the erroneous semicolon at the\
    \ end of Line 9 because the following line didn't automatically indent. The compiler\
    \ may also catch the boo-boo. These are big clues, but also things you may not\
    \ notice, especially if you have 200 lines of code to look at. Regardless, the\
    \ program's output tells you something is amiss. Here's what I see:\n\n```\n```\n\
    Presenting the alphabet:\n[\n```\n```\n\nThe alphabet doesn't show up, of course.\
    \ Not only that, what's the | character for? Time to debug!"
