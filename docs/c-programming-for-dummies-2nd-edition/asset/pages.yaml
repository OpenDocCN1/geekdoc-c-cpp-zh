    # Chapter 9


    # Loops, Loops, Loops


    Programs love to do things over and over, mirthfully so. They never complain,
    they never tire. In fact, they’ll repeat things forever unless you properly code
    instructions for when to stop. Indeed, the loop is a basic programming concept.
    Do it well. Do it well. Do it well.


    # A Little Déjà Vu


    A loop is a section of code that repeats. How often? That depends on how you write
    the loop. As an overview, a loop involves three things:


    +   » Initialization

    +   » One or more statements that repeat

    +   » An exit


    The initialization sets up the loop, usually specifying a condition upon which
    the loop begins or is activated. For example, “Start the counter at 1.”


    The statements that repeat are contained as a block in curly brackets. They continue
    to be executed, one after the other, until the exit condition is met.'
  merge: -1
  img_proc: true
- pgno: 131
  md: "The exit condition determines when the loop stops. Either it’s a condition\
    \ that’s met, such as “Stop when the counter equals 10,” or the loop can stop\
    \ when a break statement is encountered. The program execution continues with\
    \ the next statement after the loop’s final curly bracket.\n\n![](img/dcc0cd79d4a45cfce24fa49d85442884_131_0.png)\n\
    \nHaving an exit condition is perhaps the most important part of a loop. Without\
    \ it, the loop repeats forever in a condition called an endless loop. See the\
    \ later section “Looping endlessly.”\n\nThe C language features two looping keywords:\
    \ for and while. Assisting the while keyword is the do keyword. The goto keyword\
    \ can also be used for looping, though it’s heavily shunned.\n\n# The Thrill of\
    \ for Loops\n\nA loop is a group of statements that repeat. You choose a set number\
    \ of iterations, or the number of repeats can be based on a value. Either way,\
    \ the for keyword helps set up a basic type of loop.\n\n# Doing something x number\
    \ of times\n\nIt’s entirely possible, and even a valid solution, to write source\
    \ code that displays the same line of text ten times. You could copy-and-paste\
    \ a printf() statement to do the job. Simple, but it’s not a loop, which is shown\
    \ in Listing 9-1.\n\n# LISTING 9-1: Write That Down Ten Times!\n\n```\n#include\
    \ <stdio.h>\n\nint main()\n{\n    int x;\n\n    for(x=0; x<10; x=x+1)\n    {\n\
    \        puts(\"Sore shoulder surgery\");\n    }\n    return(0);\n}\n```"
  merge: -1
  img_proc: true
- pgno: 132
  md: "Exercise 9-1: Create a new program using the source code from Listing 9-1.\
    \ Type everything carefully, especially Line 7. Build and run.\n\nAs output, the\
    \ program coughs up the tongue-twister Sore shoulder surgery ten times, in ten\
    \ lines of text. The key, of course, is in Line 7, the for statement. That statement\
    \ directs the program to repeat the statement(s) in curly brackets a total of\
    \ ten times.\n\nExercise 9-2: Using the source code from Listing 9-1 again, replace\
    \ the value 10 in Line 7 with the value 20. Build and run.\n\n# Introducing the\
    \ for loop\n\nThe for loop is usually the first type of loop you encounter when\
    \ you learn to program. It looks complex, but that's because it's doing everything\
    \ required of a loop in a single statement:\n\n```\nfor(initialization; exit_condition;\
    \ repeat_each)\n```\n\nHere's how it works:\n\ninitialization is a C language\
    \ expression that's evaluated at the start of the loop. Most often, it's where\
    \ the variable that counts the loop's iterations is initialized.\n\nexit_condition\
    \ is the test upon which the loop stops. In a for loop, the statements continue\
    \ to repeat until the exit condition is true. The expression used for the exit_condition\
    \ is most often a comparison, like something you'd find in an if statement.\n\n\
    repeat_each is an expression that's executed once every iteration. It's normally\
    \ an operation affecting the initialization variable at the first part of the\
    \ for statement.\n\nThe for statement is followed by a block of one or more statements\
    \ held in curly brackets:\n\n```\nfor(x=0; x<10; x=x+1)\n{\n    puts(\"Sore shoulder\
    \ surgery\");\n}\n```"
  merge: -1
  img_proc: true
- pgno: 133
  md: "You can omit the brackets when only one statement is specified:\n\n```\nfor(x=0;\
    \ x<10; x=x+1)\n    puts(\"Sore shoulder surgery\");\n```\n\nIn this for statement,\
    \ and from Listing 9-1, the first expression is initialization:\n\n```\nx=0\n\
    ```\n\nThe value of the int variable x is set to 0. In C programming, you start\
    \ counting with 0, not with 1. The advantages of doing so are presented throughout\
    \ this book.\n\nThe second expression sets the loop's exit condition:\n\n```\n\
    x<10\n```\n\nAs long as the value of variable x is less than 10, the loop repeats.\
    \ Once this expression is false, the loop stops. The result is that the loop repeats\
    \ ten times. That's because x starts at 0, not at 1.\n\nFinally, the third expression\
    \ repeats for each iteration of the loop:\n\n```\nx=x+1\n```\n\nEvery time the\
    \ loop's statements are executed, the value of variable x is increased by 1. The\
    \ preceding statement reads, “Variable x equals the value of variable x, plus\
    \ 1.” Because C evaluates the right side of the equation first, nothing is goofed\
    \ up. So if currently the value of x is 5, the new value of x would be 6.\n\n\
    All told, I read the expression this way:\n\n```\nfor(x=0; x<10; x=x+1)\n```\n\
    \n> “For x starts at 0, while x is less than 10, add 1 to x.”\n\nListing 9-2 shows\
    \ another example of a simple for loop. It displays values from −5 through 5."
