    # Exercise 12-10: Modify your source code from Exercise 12-9 so that the program
    also asks for your last name, storing this data in another array. The program
    should then greet you by using both your first and last names.


    Yes, the Enter key press is stored as part of your name when you type fewer than
    15 characters. This effect is how input is read by the fgets() function. If your
    first name is Dan, the array looks like this:


    ![](img/dcc0cd79d4a45cfce24fa49d85442884_195_0.png)


    ```

    firstname[0] == ''D''

    firstname[1] == ''a''

    firstname[2] == ''n''

    firstname[3] == ''\n''

    firstname[4] == ''\0''

    ```


    The newline lurks in the string because input in C is stream oriented and Enter
    is part of the input stream as far as the fgets() function is concerned. You can
    fix this issue by obeying Exercise 12-11.


    # Exercise 12-11: Rewrite your source code from Exercise 12-10 so that the scanf()
    function is used to read in the first and last name strings.


