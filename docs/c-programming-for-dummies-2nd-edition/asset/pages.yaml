    c = 1;          /* initialize c */\nwhile(c != EOF)\n    c=fgetc(dumpme);\n```\n\
    \nThis improvement is more readable and less error prone.\n\nThe situation grows\
    \ more hair when you use logical operators to combine conditions. I highly recommend\
    \ that you limit the expression to two choices only:\n\n```\nif( a==b || a==c)\n\
    ```\n\nThe statements belonging to if are executed when the value of variable\
    \ a is equal to either the value of variable b or variable c. Simple. But what\
    \ about this:\n\n```\nif( a==b || a==c && a==d)\n```\n\nOops. Now the order of\
    \ precedence takes over, and for the if statement to be true, a must be equal\
    \ to b, or a must be equal to both c and d. The situation can also be improved\
    \ by using parentheses:\n\n```\nif( a==b || (a==c && a==d))\n```\n\nWhen you're\
