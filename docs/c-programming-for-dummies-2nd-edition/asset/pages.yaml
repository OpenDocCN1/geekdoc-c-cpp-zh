  md: 'Here''s the warning message I saw repeated four times:


    ```

    Warning: format specifies type ''void *'' ...

    ```


    Obviously, the & is important for individual variables. But for arrays, it''s
    optional. But how could that be, unless . . . unless an array is really a pointer!


    # Working pointer math in an array


    What happens when you increment a pointer? Say that pointer variable dave references
    a variable at memory address 0x8000. If so, consider this statement:


    ```

    dave++;

    ```


    What would the new value of pointer dave be?


    Your first inclination might be to say that dave would be incremented by 1, which
    is correct. But the result of the calculation may not be 0x8001. That''s because
    the address stored in a pointer variable is incremented by one unit, not by one
    digit.


    What''s a unit?


    It depends on the pointer''s data type. If pointer dave is a char pointer, indeed
    the new address could be 0x8001. But if dave were an int or a float, the new address
    would be the same as


    ```

    0x8000 + sizeof(int)

    ```


    or


    ```

    0x8000 + sizeof(float)

    ```


    On most systems, an int is 4 bytes, so you could guess that dave would be 0x8004
    after the increment operation. But why guess when you can code?


    Listing 19-2 illustrates a simple program, something I could have directed you
    to code without using pointers: Fill an int array with values 1 through 10, and
    then display the array''s elements and their values. But in Listing 19-2, a pointer
    is used to fill the array.'
