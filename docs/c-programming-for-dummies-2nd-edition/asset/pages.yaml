- pgno: 176
  md: "# Exploring some common math functions\n\nNot everyone is going to employ their\
    \ C language programming skills to help pilot a rocket safely across space and\
    \ into orbit around Titan. No, it's more likely that you'll attempt something\
    \ far more down-to-earth. Either way, the work will most likely be done by employing\
    \ math functions. I've listed some common ones in Table 11-3.\n\n# TABLE 11-3\
    \ Common, Sane Math Functions\n\n| Function | #include | What It Does |\n|---|---|---|\n\
    | sqrt() | math.h | Calculates the square root of a floating-point value |\n|\
    \ pow() | math.h | Returns the result of a floating-point value raised to a certain\
    \ power |\n| abs() | stdlib.h | Returns the absolute value (positive value) of\
    \ an integer |\n| ceil() | math.h | Rounds up a floating-point value to the next\
    \ whole number (nonfractional) value |\n| floor() | math.h | Rounds down a floating-point\
    \ value to the next whole number |\n\nAll the functions listed in Table 11-3,\
    \ save for the abs() function, deal with floating-point values. The abs() function\
    \ works only with integers.\n\n![](img/dcc0cd79d4a45cfce24fa49d85442884_176_0.png)\n\
    \nYou can look up function references in the man pages, as described in Chapter\
    \ 1.\n\nListing 11-5 is littered with a smattering of math functions from Table\
    \ 11-3. The compiler enjoys seeing these functions, as long as you remember to\
    \ include the math.h header file at Line 2.\n\n# LISTING 11-5: Math Mania Mangled\n\
    \n```\n#include <stdio.h>\n#include <math.h>\n\nint main()\n{\n    float result,value;\n\
    \n    printf(\"Input a float value: \");\n    scanf(\"%f\",&value);\n    result\
    \ = sqrt(value);\n    printf(\"The square root of %.2f is %.2f\\n\",\n       \
    \    value,result);\n}\n```"
