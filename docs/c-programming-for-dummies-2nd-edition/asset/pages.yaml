  md: "# Declaring an initialized multidimensional array\n\nThe dark secret of multidimensional\
    \ arrays is that they don't really exist. Internally, the compiler sees things\
    \ as single dimensions — just a long array full of elements. The double (or triple)\
    \ bracket notation is used to calculate the proper offset in the array at compile\
    \ time. That's okay because the compiler does the work.\n\nYou can see how multidimensional\
    \ arrays translate into regular old boring arrays when you declare them already\
    \ initialized. For example:\n\n```\n```c\nint grid[3][4] = {\n    5, 4, 4, 5,\n\
    \    4, 4, 5, 4,\n    4, 5, 4, 5\n};\n```\n```\n\nThe grid array consists of three\
    \ rows of four items each. As just shown, it's declared as a grid and it looks\
    \ like a grid. Such a declaration works, as long as the last element doesn't have\
    \ a comma after it. In fact, you can write the whole thing like this:\n\n```\n\
    ```c\nint grid[3][4] = { 5, 4, 4, 5, 4, 4, 5, 4, 4, 5, 4, 5 };\n```\n```\n\nThis\
    \ statement still defines a multidimensional array, but you can see how it's really\
    \ just a single-dimension array with dual indexes. In fact, the compiler is smart\
    \ enough to figure out the dimensions even when you give only one of them, as\
    \ in this example:\n\n```\n```c\nint grid[][4] = { 5, 4, 4, 5, 4, 4, 5, 4, 4,\
    \ 5, 4, 5 };\n```\n```\n\nIn the preceding line, the compiler sees the 12 elements\
    \ in an array grid, so it automatically knows that it's a 3-by-4 matrix based\
    \ on the 4 in the brackets. Or you can do this:\n\n```\n```c\nint grid[][6] =\
    \ { 5, 4, 4, 5, 4, 4, 5, 4, 4, 5, 4, 5 };\n```\n```\n\nIn this example, the compiler\
    \ would figure that you have two rows of six elements. But the following example\
    \ is just wrong:\n\n```\n```c\nint grid[][] = { 5, 4, 4, 5, 4, 4, 5, 4, 4, 5,\
    \ 4, 5 };\n```\n```"
