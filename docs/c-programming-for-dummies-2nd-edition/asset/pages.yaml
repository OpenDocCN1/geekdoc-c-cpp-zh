    # Fun with Files


    The C library offers functions for making a new file, writing to that file, and
    reading data from any file. Bolstering these file I/O functions are a suite of
    file manipulation functions. They allow your programs to rename, copy, and delete
    files. The functions work on any file, not just those you create, so be careful!


    # Renaming a file


    The rename() function is not only appropriately named but also easy to figure
    out:


    ```

    x = rename(oldname, newname);

    ```'
