- pgno: 369
  md: "To keep things confusing, the position index is often referred to as a file\
    \ pointer, even though it's not a pointer variable or a FILE type of pointer.\
    \ It's just the location within a file where the next byte of data is read.\n\n\
    You can mess with the file pointer-index-thing by using several interesting functions\
    \ in C. Two of them are ftell() and rewind(). The ftell() function returns the\
    \ current position as a long int value. The rewind() function returns the file\
    \ pointer back to the start of the file.\n\nListing 22-10 reads twice through\
    \ the records in the bond.db file. After reading all the records, the rewind()\
    \ function at Line 37 resets the file pointer to the start of the file. The second\
    \ while loop repeats the process, rereading all the records.\n\nThe ftell() function\
    \ is used at Lines 26 and 42 to output the file pointer's offset each time the\
    \ code reads records from the file.\n\n# LISTING 22-10: Tell and Rewind\n\n```\n\
    ```c\n#include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\n\nint main()\n\
    {\n    struct agent {\n        char actor[32];\n        int year;\n        char\
    \ title[32];\n    };\n    struct agent bond;\n    FILE *jbdb;\n    int r;\n\n\
    \    jbdb = fopen(\"bond.db\",\"r\");\n    if(!jbdb)\n    {\n        puts(\"SPECTRE\
    \ wins!\");\n        exit(1);\n    }\n\n    puts(\"First read-through:\");\n \
    \   while( !feof(jbdb) )\n    {\n        printf(\"%ld:\\t\",ftell(jbdb));\n```\n\
    ```"
