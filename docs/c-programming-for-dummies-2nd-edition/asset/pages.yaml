  md: 'Math operators allow you to construct mathematical expressions. These are shown
    in Table 11-1. The math functions implement complex calculations for which symbols
    and characters are unavailable on the keyboard. To list all these functions in
    a table would occupy a lot of space.


    > > Chapter 5 introduces the basic math operators: +, -, *, and /. The rest aren''t
    too heavy-duty to understand — even the oddly named modulo.

    > > The C language comparison operators are used for making decisions. Refer to
    Chapter 8 for a list.

    > > Logical operators are also covered in Chapter 8.

    > > The single equal sign (=) is an operator, but not a mathematical operator.
    It''s the assignment operator, used to stuff a value into a variable.

    > > Bitwise operators manipulate individual bits in a value. They''re covered
    in Chapter 17.

    > > Appendix C lists all the C language operators.


    | Operator | Function | Example |

    |----------|----------|---------|

    | + | Addition | var=a+b |

    | - | Subtraction | var=a-b |

    | * | Multiplication | var=a*b |

    | / | Division | var=a/b |

    | % | Modulo | var=a%b |

    | ++ | Increment | var++ |

    | -- | Decrement | var-- |

    | + | Unary plus | +var |

    | - | Unary minus | -var |


    # Incrementing and decrementing


    Here''s a handy trick, especially for those loops in your code: the increment
    and decrement operators. They''re insanely useful.'
