    \n# TABLE 8-1 C Language Comparison Operators\n\n| Operator | Pronunciation |\
    \ Example | True When |\n|----------|---------------|---------|-----------|\n\
    | != | Not equal to | a != b | a is not equal to b |\n| < | Less than | a < b\
    \ | a is less than b |\n| <= | Less than or equal to | a <= b | a is less than\
