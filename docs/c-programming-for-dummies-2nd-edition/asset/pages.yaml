    # LISTING 22-7: A File Dumper\n\n```\n#include <stdio.h>\n#include <stdlib.h>\n\
    \nint main()\n{\n    char filename[255];\n    FILE *dumpme;\n    int x,c;\n\n\
    \    printf(\"File to dump: \");\n    scanf(\"%s\",filename);\n    dumpme=fopen(filename,\"\
    r\");\n    if(!dumpme)\n    {\n        printf(\"Unable to open '%s'\\n\",filename);\n\
