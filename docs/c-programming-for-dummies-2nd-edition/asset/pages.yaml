    \ a statement. It's also a common mistake made by experienced programmers!\n>\
    \ \n> The compiler is the tool that finds missing semicolons. That's because when\
    \ you forget the semicolon, the compiler assumes that two statements are really\
    \ one statement. The effect is that the compiler becomes confused and, therefore,\
    \ in a fit of panic, flags those lines of source code with a warning or error.\n\
