    \nThe time() function requires inclusion of the time.h header file, shown at Line\
    \ 3.\n\nThe (unsigned) part of the statement ensures that the value returned by\
    \ the time() function is an unsigned integer (not negative). This technique is\
    \ known as typecasting, which is covered in Chapter 16.\n\nThe bottom line is\
    \ that the srand() function is passed a seed value, courtesy of the time() function,\
