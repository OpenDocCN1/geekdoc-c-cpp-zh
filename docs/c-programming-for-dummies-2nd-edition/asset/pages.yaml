    # AVOID GOTO HELL


    The third looping statement is the most despised and the lowest-of-the-low C language
    keywords. It''s goto, which is pronounced "go to" not "got-to." It directs program
    execution to another line in the source code, a line tagged by label. Here''s
    an example:


    ```

    here:

    puts("This is a type of loop");

    goto here;

    ```


    As this chunk of code executes (from the top down), the here label is ignored.
    The puts() function comes next, and, finally, goto redirects program flow back
    up to the here label. Everything repeats. Everything works. But it''s just darn
    ugly.


    Most clever programmers can craft their code in ways that don''t require goto.
    The result is something more readable — and that''s the key. Code that contains
    lots of goto statements can be difficult to follow, leading experienced programmers
    to describe it as spaghetti code. The goto statement encourages sloppy habits.


    The only time goto might truly be necessary is when busting out of a nested loop.
    Even in this situation, an example would be contrived. So it''s probably safe
    to say that you''ll run your entire programming career and, hopefully, never have
    to deal with a goto statement in C.'
