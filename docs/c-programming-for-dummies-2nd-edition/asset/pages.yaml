  md: '# # The Hideously Complex Topic of Pointers


    Memorize this sentence:


    *A pointer is a variable that contains a memory location.*


    Or maybe this story will help:


    Once upon a time, a pointer variable met a college student enrolled in a C programming
    course. The student asked, “What do you point at?” The variable replied, “Nothing!
    But I contain a memory location.” And the freshman was severely satisfied.


    You must accept the insanity of the pointer before moving on. True, though you
    can get at a variable’s memory location, or *address*, by using the & operator,
    the pointer is a far more powerful beast.


    # ## Introducing the pointer


    A pointer is a type of variable. Like other variables, it must be declared in
    the code. Further, it must be initialized before it’s used. That last part is
    really important, but first the declaration has this format:


    ```

    type *name;

    ```


    As when you declare any variable, the *type* identifies the pointer as a *char*,
    *int*, *float*, and so on. The *name* is the pointer variable’s name, which must
    be unique, just like any other variable name. The asterisk identifies the variable
    as a pointer, not as a regular variable.


    The following statement declares a *char* pointer, sidekick:


    ```

    char *sidekick;

    ```


    And this statement creates a *double* pointer:


    ```

    double *rainbow;

    ```


    To initialize a pointer, you must assign it a value, just like any other variable.
    The big difference is that a pointer is initialized to the memory location. This
    address'
