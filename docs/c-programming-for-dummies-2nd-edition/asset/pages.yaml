  md: "Listing 7-7 shows code that uses the fgets() function to read input.\n\n# LISTING\
    \ 7-7: The fgets() Function Reads a String\n\n```\n#include <stdio.h>\n\nint main()\n\
    {\n    char name[10];\n\n    printf(\"Who are you? \");\n    fgets(name,10,stdin);\n\
    \    printf(\"Glad to meet you, %s.\\n\",name);\n    return(0);\n}\n```\n\nExercise\
    \ 7-16: Type the source code from Listing 7-7 into your editor. Build and run.\n\
    \nThe fgets() function in Line 8 reads text from standard input. The text is stored\
    \ in the name array, which is set to a maximum of ten characters in Line 5. The\
    \ value 10 is used as the second argument in the fgets() function to ensure that\
    \ only nine characters are read, one less than the number specified. The final\
    \ character in the name buffer is the null character, \\0, which terminates the\
    \ string.\n\nThe last argument in the fgets() function is stdin, the standard\
    \ input device. This is the \"file\" from which input is read.\n\n![](img/dcc0cd79d4a45cfce24fa49d85442884_110_0.png)\n\
    \nThe char array must have one extra character reserved for the \\0 at the end\
    \ of a string. Its size must equal the size of input you need — plus one.\n\n\
    Here's how the program runs on my screen:\n\n```\nWho are you? Danny Gookin\n\
    Glad to meet you, Danny Goo.\n```\n\nOnly the first nine characters of the text\
    \ I typed in the first line are displayed. Why only nine? Because the tenth character\
    \ must be the null character, \\0, terminating the string. If the fgets() function\
    \ were to read in ten characters instead of nine, the array would overflow and\
    \ the program could malfunction."
