  md: '# Sorting arrays


    Computers are designed to quickly and merrily accomplish boring tasks, such as
    sorting an array. In fact, they love doing it so much that "the sort" is a basic
    computer concept upon which many theories and algorithms have been written. It''s
    a real snoozer topic if you''re not a Mentat or a native of the planet Vulcan.


    The simplest sort is the bubble sort, which not only is easy to explain and understand
    but also has a fun name. It also shows the basic array sorting philosophy, which
    is to swap values between two elements.


    Suppose that you''re sorting an array so that the smallest values are listed first.
    If array[2] contains the value 20, and array[3] contains the value 5, these two
    elements would need to swap values. To make it happen, you use a temporary variable
    that looks like this:


    ```

    temp=array[2]; /* Save 20 in temp */

    array[2]=array[3]; /* Store 5 in array[2] */

    array[3]=temp; /* Put 20 in array[3] */

    ```


    In a bubble sort, each array element is compared with every other array element
    in an organized sequence. When one value is larger (or smaller) than another,
    the values are swapped. Otherwise, the comparison continues, plodding through
    every possible permutation of comparisons in the array. Listing 12-5 demonstrates.




    # A Bubble Sort


    ```

    #include <stdio.h>

    int main()

    {

    const int size = 6;

    int bubble[] = { 95, 60, 6, 87, 50, 24 };

    int inner,outer,temp,x;

    /* Display Original array */

    puts("Original Array:");

    for(x=0;x<size;x++)

    printf("%d\t",bubble[x]);

    putchar(''\n'');

    /* Bubble sort */

    for(outer=0;outer<size-1;outer++)

    ```'
