    \ the other, beginning at the top of the source code and working down to the bottom.\
    \ Ways exist to change that order as the program runs, which are presented elsewhere\
    \ in this book.\n\nThe paragraph–level syntax for the C language involves blocks.\
    \ These are defined by enclosing statements in a pair of curly brackets, or braces:\n\
    \n```\n{\n    if( money < 0 ) get_job();\n    party();\n    sleep(24);\n}\n```\n\
    \nThese three statements form a block, held within curly brackets, indicating\
    \ that they belong together. They're either part of a function or part of a loop\
    \ or something similar. Regardless, they all go together and are executed one\
    \ after the other.\n\nYou'll notice that the statements held within a block are\
    \ indented one tab stop. That's a tradition in C, but it's not required. The term\
    \ whitespace is used to refer to tabs, empty lines, and other empty parts of the\
    \ source code.\n\nGenerally, the C compiler ignores whitespace, looking instead\
    \ for semicolons and curly brackets. For example, you can edit the source code\
    \ from Listing 2–1 to read:\n\n```\n#include <stdio.h>\nint main(){puts(\"Greetings,\
