    # # The Old Switch Case Trick


    Piling up a tower of *if* and *if-else* statements can be effective, but it’s
    not the best way to walk through some multiple-choice decisions. An alternative
    offered in the C language is known as the *switch-case* structure.


    # ## Making a multiple-choice selection


    The *switch-case* structure allows you to code decisions in a C program based
    on a single value. It’s the multiple-choice selection statement, as shown in Listing
    8–8.'
