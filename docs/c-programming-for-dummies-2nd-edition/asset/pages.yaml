    # Fun with printf() Formatting


    The most popular output function in C has to be printf(). It''s everyone''s favorite.
    It''s one of the first functions you learn in C. And as one of the most complex,
    it''s one of the functions that no one ever fully knows.


    The power in printf() lies in its formatting string. This string can be packed
    with plain text, escape sequences, and conversion characters, which are the little
    percent goobers that insert values into the text output. It''s the conversion
    characters, or placeholders, that give printf() its real power, and they''re also
    one of the function''s least understood aspects.


    +   - The printf() function is so popular that just about every current, trendy
    programming language features its own version.

    +   - All conversion characters are listed in Appendix F.


    # Formatting floating point


    You can use more than the basic %f conversion character to format floating-point
    values. In fact, here''s the format I typically use in the printf() function''s
    formatting text:


    ```

    %w.pf

    ```


    The w sets the maximum width of the entire number, including the decimal place.
    The p sets the number of characters after the decimal. For example:


    ```

    printf("%9.2f", 12.45);

    ```


    This statement outputs four spaces and then 12.45. These four spaces plus 12.45
    (five characters total) equal the 9 in the width. Only two values are shown to
    the right of the decimal because .2 is used in the %f conversion character.'
