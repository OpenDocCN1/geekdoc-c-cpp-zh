- pgno: 412
  md: 'To get my brain to appreciate the difference, in my head I say “is equal to”
    when I type two equal signs. Despite this reminder, I still goof up, especially
    in a conditional statement.


    ![](img/dcc0cd79d4a45cfce24fa49d85442884_412_0.png)


    When you assign a value in a conditional statement, you generally create a TRUE
    condition unless the result of the assignment is zero:


    ```

    if(here=there)

    ```


    This if statement evaluates to the value of variable there. If it''s 0, the if
    condition evaluates as FALSE; otherwise, it''s true. Regardless, it''s most likely
    not what you intended. Most compilers, such as clang, catch this mistake.


    # Dangerous Loop Semicolons


    You can get into a rut when you''re typing code, using the semicolon as a prefix
    before typing the Enter key to end a line. This practice has unintended consequences!
    It''s especially toxic when you code loops:


    ```

    for(x=0;x<10;x++);

    ```


    This loop works, but its statements aren''t repeated. When it''s done, the value
    of variable x is 10. That''s it.


    The same problem exists for a while loop:


    ```

    while(c<255);

    ```


    This loop may spin endlessly, depending on the value of variable c. If the value
    is greater than or equal to 255, the loop won''t execute. Otherwise, it executes
    forever.


    These semicolons are unintentional and unwanted. They''re also perfectly legitimate;
    the compiler doesn''t flag them as errors, though you may see a warning — which
    is quite helpful: For example, the suggested resolution is to place the semicolon
    on the next line:


    ```

    while(putchar(*(ps++)))

    ;

    ```


    This sole semicolon on a line by itself shouts to the compiler, as well as to
    any programmer reading the code, that the while loop is intentionally empty.'
  merge: -1
  img_proc: true
- pgno: 413
  md: "# Commas in for Loops\n\nThe three items in a for loop's parentheses are separated\
    \ by semicolons. Both those semicolons are required, and they are not commas.\
    \ The compiler doesn't like this statement:\n\n```\nfor(a=0, a<10, a++)\n```\n\
    \nBecause commas are allowed in a for statement, the compiler merely thinks that\
    \ you've omitted the last two required items. In fact, the following is a legitimate\
    \ for statement:\n\n```\nfor(a=0, a<10, a++;)\n```\n\nThe preceding statement\
    \ assigns the value 0 to variable a, generates a TRUE comparison (which is ignored),\
    \ and increments the value of a to 1. Then, because the second and third items\
    \ are empty, the loop repeats endlessly. (Well, unless a break statement belongs\
    \ to the loop.)\n\n# Missing break in a switch Structure\n\nIt's perfectly legitimate\
    \ to write a switch structure where the execution falls through from one case\
    \ statement to the other:\n\n```\nswitch(letter)\n{\n  case 'A':\n  case 'E':\n\
    \  case 'I':\n  case 'O':\n  case 'U':\n    printf(\"Vowel\");\n    break;\n \
    \ default:\n    printf(\"Not a vowel\");\n}\n```\n\nIn this example, the first\
    \ five case conditions capture the same set of statements. When you forget the\
    \ break, however, execution falls through with more tests and, eventually, the\
    \ default. Unless this control is what you want, remember to add break statements\
    \ as necessary."
  merge: -1
  img_proc: true
- pgno: 414
  md: 'Suppose that you have a switch structure that''s several dozen lines high.
    One case condition has multiple rows of statements, so many that it scrolls up
    and off the screen. In such a setup, it''s easy to forget the break as you concentrate
    instead on crafting the proper statements. I know — I''ve done it.


    Another situation happens when you code a loop inside a switch structure and you
    use break to get out of that loop. This inner break escapes from the for loop
    only: A second break is required in order to get out of the switch structure.


    ![](img/dcc0cd79d4a45cfce24fa49d85442884_414_0.png)


    Many editors, such as the one used in Code::Blocks, let you collapse and expand
    parts of your code. To make this feature work in a switch structure, you must
    enclose the case statements in curly brackets.


    # Missing Parentheses and Curly Brackets


    Forgetting a parenthesis or two is one of the most common C coding mistakes. The
    compiler catches it, but usually the error isn''t flagged until the end of the
    function.


    For example, a missing parenthesis in the main() function causes the error to
    be flagged at the final line of the function. This warning is a good clue to a
    missing parenthesis or curly bracket, but it doesn''t help you locate it.


    Today''s editors are good at matching up parentheses and brackets. For example,
    the Code::Blocks editor inserts both characters when you type the first one. This
    feature helps keep things organized. Other editors, such as VIM, highlight both
    sets of brackets when the cursor hovers over one. Use these hints as you type
    to ensure that things match up.


    Another editor clue is that the formatting, text coloring, and indents screw up
    when you forget a parenthesis or bracket. The problem with recognizing this reminder
    is that the human brain automatically assumes that the editor has screwed up.
    So you need to train yourself to recognize improper indentation by the editor
    as a sign of a missing parenthesis or curly bracket.


    # Don''t Ignore a Warning


    When the compiler generates a warning, the program (or object code) is still created.
    This condition can be dangerous, especially when dealing with pointer errors.
    The problem is that warnings can be ignored; the code compiles anyway.'
