- pgno: 401
  md: 'Use the Debugger toolbar in Code::Blocks to help you wade into your code to
    see what''s fouled up. (Refer to Figure 25-1.) To show or hide that toolbar, choose
    View→ Toolbars→ Debugger.


    Follow these steps to work through your code to determine what''s wrong:


    +   1. **Click the cursor in your code right before the puts() statement.**

    +      This location is at Line 8.

    +   2. **Click the Run to Cursor button on the Debugging toolbar.**

    +      The Run to Cursor button is illustrated in the margin.

    +      The program runs, but only up to the cursor''s location. The output window
    appears, and debugging information shows up on the Debugging tab at the bottom
    of the Code::Blocks window.

    +   3. **Click the Next Line button.**

    +      The puts() statement executes, and its output appears in the output window.

    +   4. **Click the Next Line button again.**

    +      The for loop does its thing; no output.

    +   5. **Click the Next Line button again.**

    +      The putchar() function outputs the character lurking in the loop variable.

    +      Because the loop already went through ASCII A to Z, the next character
    is [.

    +      This is the character output.

    +      Hopefully, at this point you look closer at your code and find the stray
    semicolon at the end of Line 9.

    +   6. **Click the Stop button to halt the debugger.**

    +   7. **Remove the semicolon at the end of Line 9.**

    +   8. **Save and rebuild your code.**

    +      To determine whether you''ve fixed the problem, step through the code again:

    +   9. **Click the mouse pointer to place the cursor right before the for statement
    at Line 9.**

    +   10. **Click the Run to Cursor button.**

    +   11. **Click the Next Line button twice.**

    +      An A appears as output. Good.


    ![](img/dcc0cd79d4a45cfce24fa49d85442884_401_0.png)


    ![](img/dcc0cd79d4a45cfce24fa49d85442884_401_1.png)


    ![](img/dcc0cd79d4a45cfce24fa49d85442884_401_2.png)'
