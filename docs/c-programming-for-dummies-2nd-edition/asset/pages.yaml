    # # The Holy Order of Precedence


    Before you flee the tyranny of the Unavoidable Math Chapter, you need to know
    about the order of precedence. It’s not a religious order, and it has nothing
    to do with guessing the future. It’s about ensuring that the math equations you
    code in C represent what you intend.


    # ## Getting the order correct


    Consider the following puzzle. Can you guess the value of the variable answer?


    ```

    ```

    answer = 5 + 4 * 3;

    ```

    ```


    As a human, reading the puzzle from left to right, you’d probably answer 27: 5
    + 4 is 9 times 3 is 27. This answer is correct — for a human. The computer, however,
    would answer 17.


    The computer isn’t wrong — it just assumes that multiplication is more important
    than addition. Therefore, that part of the equation gets calculated first. To
    the computer, the order of operations is based on which operators are used. To
    put it another way, multiplication has precedence over addition.


    ![](img/dcc0cd79d4a45cfce24fa49d85442884_185_0.png)


    You can remember the basic order of precedence for the basic math operators like
    this:


    +   - First: Multiplication, Division

    +   - Second: Addition, Subtraction


    The clever mnemonic for the basic order of precedence is, “My Dear Aunt Sally.”
    For more detail on the order of precedence for all C language operators, see Appendix
    G.


    Exercise 11-22: Write a program that evaluates the following equation, displaying
    the result:


    ```

    ```

    20 - 5 * 2 + 42 / 6

    ```

    ```'
