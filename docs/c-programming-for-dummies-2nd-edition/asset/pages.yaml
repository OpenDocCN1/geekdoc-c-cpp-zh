  md: "# HOW TIME() PLAYS INTO RANDOM NUMBERS\n\nThe best way to generate random numbers\
    \ in C is to seed the randomizer. In Chapter 11, I describe how that process works\
    \ by using the time() function. Here's the format:\n\n```\nsrand((unsigned)time(NULL));\n\
    ```\n\nWhen called with a NULL value (a pointer), the time() function returns\
    \ the current time of day in the Unix epoch format. To ensure that the value returned\
    \ — the Unix epoch — isn't negative, it's typecast to an unsigned type. This step\
    \ may not be required, because the time_t value may be unsigned on certain systems.\
    \ Still, the typecast ensures that the value is always positive.\n\n# Viewing\
    \ a timestamp\n\nDisplaying the current date-and-time as an integer won't make\
    \ your users happy. In fact, I don't even know any Unix geeks who can look at\
    \ a Unix epoch number and determine which date it is. Therefore, some conversion\
    \ needs to take place. The C library function required to fulfill that duty is\
    \ ctime(), the time conversion function, shown in Listing 21-2.\n\n# LISTING 21-2:\
    \ Oh, So That's the Time!\n\n```\n#include <stdio.h>\n#include <time.h>\n\nint\
    \ main()\n{\n    time_t tictoc;\n\n    time(&tictoc);\n    printf(\"The time is\
    \ now %s\",ctime(&tictoc));\n    return(0);\n}\n```\n\nThe ctime() function eats\
    \ the address of a time_t variable. The function returns a pointer to a timestamp\
    \ string, which is the address of a char array elsewhere in memory. The string\
    \ includes a terminating newline."
