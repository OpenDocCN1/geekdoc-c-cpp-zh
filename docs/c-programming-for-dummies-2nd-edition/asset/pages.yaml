  md: '# Chapter 24


    # Beyond Mere Mortal Projects


    Not every C program you write will have only 20 or 30 lines of code. Most of the
    programs, the ones that truly do something, are much longer. Much, much longer.
    Some become so huge that it makes sense to split them into smaller modules, or
    individual source code files, with maybe 20 to 60 lines of code apiece. Not only
    do these smaller modules make it easier to write and update code, but you can
    also reuse common modules in other projects, reducing development time.


    # The Multi-Module Monster


    The C language places no limit on how long a source code file can be. Likewise,
    a source code file can consist of only a few lines — if you can pull off this
    trick. The determination of whether to use multiple source code files — modules
    — really depends on the programmer. That’s you. How easy do you want to make the
    process of writing, maintaining, and updating your code?'
  merge: -1
  img_proc: true
