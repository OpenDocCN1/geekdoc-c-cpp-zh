    # ONCE UPON A TIME, OCTAL WAS POPULAR


    Another number format available in the C language is octal, or base 8. Octal was
    quite popular around the time Unix was developed, and many of the old, grizzled
    programmers league still enjoy tossing around octal values and doing octal-this
    or octal-that. C even sports an octal conversion character, %o, and an octal prefix,
    0 (zero).


    I''ve never used octal in any of my programs. Some older code may use it, and
    occasionally a function references octal values. So my advice is to be aware of
    octal, but don''t bother to memorize anything.'
