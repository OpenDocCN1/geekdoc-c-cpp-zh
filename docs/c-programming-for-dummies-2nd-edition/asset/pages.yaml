  md: '# Installing Code::Blocks


    The Code::Blocks website will doubtless be altered over time, so follow these
    general steps to install the IDE and confirm that the C compiler is accessible:


    +   1. **On the main Code::Blocks website page, click the Downloads link.**

    +   2. **Click the binary release link.**

    +      The "binary release" means you''re installing a runnable program, not source
    code or something equally strange.

    +   3. **Choose the proper installation program for your computer''s operating
    system.**

    +      For Windows 10, I recommend that you choose the installation with the text
    *mingw-setup* appended. For example:

    +      The 20.03 part of the filename is the release number, which will change
    in the future. The *mingw-setup* choice means you''re downloading both the IDE
    and the MinGW compiler.

    +      For Linux, click the link to install the proper version for your distro,
    but keep in mind that Code::Blocks might be more easily acquired by using the
    Linux GUI package/software manager.

    +   4. **Open the downloaded archive to extract the Code::Blocks IDE installer.**

    +      In Windows, you see a User Account Control warning when you open the archive.
    Click Yes to proceed with installation.

    +   5. **Run the installation program.**

    +      Perform a default installation; you need not customize anything.

    +   6. **Choose to run Code::Blocks: Click the Yes button.**

    +      Code::Blocks appears, showing its splash screen. Don''t start coding now.
    Instead, confirm the compiler''s installation:

    +   7. **Choose Settings, Compiler.**

    +      The Compiler Settings dialog box appears.

    +   8. **With Global Compiler Settings chosen on the left, click the Toolchain
    Executables tab on the right side of the dialog box.**

    +   9. **Ensure that the Compiler''s Installation Directory text box is filled.**

    +      In a default confirmation, the following pathname is listed:


    ```

    codeblocks-20.03mingw-setup.exe

    ```


    ```

    C:\Program Files (x86)\CodeBlocks\MinGW

    ```


    ![](img/dcc0cd79d4a45cfce24fa49d85442884_27_0.png)'
