  md: '+   - **TIP**: A tip is a suggestion, a special trick, or something super fancy
    to help you out.

    +   - **WARNING**: This icon marks something you need to avoid. It’s advice that
    could also be flagged with a Tip or Remember icon but has dire consequences if
    ignored.

    +   - **TECHNICAL STUFF**: Face it: All of programming is technical. I reserve
    the use of this icon for extra-technical tidbits, asides, and anecdotes. Call
    it “nerd stuff.”


    # Parting Thoughts


    I enjoy programming. It’s a hobby, and I find it incredibly relaxing, frustrating,
    and rewarding. I assume that you share these feelings, though you may also be
    a struggling student or someone who wants a career. Regardless, enjoy programming.
    If you can imagine the program you want to write on a screen, you can make it
    happen. It may not happen as fast as you like, but it can happen.


    Please work the exercises in this book. Try some on your own, variations on a
    theme. Continue working at problems until you solve them. The amazing thing about
    programming is that no single, absolutely correct way to do something exists.
    Anytime you try, you’re learning.


    If possible, find a programming friend who can help you. Don’t make them do the
    work or explain how things run, but rely on them as a resource. Programming can
    be a solo thing, but it’s good to occasionally commiserate with others who also
    program in C — or in any language.


    This book has a few companion websites. The primary one is found here: https://c-for-dummies.com/cprog


    You can also check out my C programming blog, which is updated every Saturday
    with new lessons and offers a monthly Exercise challenge: https://c-for-dummies.com/blog


    The publisher also features a companion website, which I’m obliged to mention
    here, though it’s not updated as frequently as my own site. Visit www.dummies.com
    and type C programming into the search box to find this book’s support page and
    other goodies.'
