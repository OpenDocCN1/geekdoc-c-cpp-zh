  md: 'The value must be assigned to the constant as it''s declared in your code,
    all on one line. That''s because, once the constant is declared, its value cannot
    be altered elsewhere in the code. For example:


    ```

    ```c

    const char apple = ''a'';

    ```

    ```


    Constant `apple` is used just like a `char` variable, though its value — the lowercase
    letter `a` — never changes:


    ```

    ```c

    printf("Start with letter %c.",apple);

    ```

    ```


    The preceding statement outputs this text:


    ```

    ```

    Start with letter a.

    ```

    ```


    If the code attempts to change a constant, the compiler generates an error message
    and the program isn''t created. This error is the protection afforded by the compiler
    to the const keyword: Constants cannot be changed.


    +   - Constants must be assigned values on the same line where they''re declared.

    +   - You can define a constant of any data type.

    +   - Unlike with a variable, you cannot reassign a constant''s value. Otherwise,
    it''s used like any other variable in your code.

    +   - Like a variable declaration, a constant declaration is valid only within
    the function where it''s created. When a constant is required in multiple functions,
    use the `#define` preprocessor directive, as covered in Chapter 10.


    # ## Putting constants to use


    Anytime your code uses a single value over and over (something significant, like
    the number of rows in a table or the maximum number of items you can stick in
    a shopping cart), declare the value as a constant.


    **Exercise 6-15:** Rewrite the source code for Listing 6-8. Use a constant `v`
