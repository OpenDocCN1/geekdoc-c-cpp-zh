  md: '# Chapter 15


    # Life at the Command Prompt


    Before computers went graphical, the text screen was as high-tech as computers
    went. Visually, everything was plain and dull, and the most exciting computer
    games involved a lot of reading. If Facebook were invented back then, it would
    be all book and no face.


    Way back when, computer life centered around the command prompt. Directions were
    typed, and output was plain text. That''s the environment in which the C language
    was born, and to some extent, where it still exists today.


    # Conjure a Terminal Window


    Whether you''re using Windows, Mac OS X, Linux, or a Unix variant, you can still
    bring forth a terminal window, in which you can witness the breathtaking starkness
    of the command prompt. It''s a text-only environment, and, in fact, it''s the
    environment in which each and every program you''ve coded in this book is perfectly
    at home.'
  merge: -1
  img_proc: true
- pgno: 237
  md: '# # Starting a terminal window


    Figure 15-1 illustrates the Ubuntu Linux bash shell in Windows 10. Similar command
    prompt or terminal windows are available for other platforms: On the Macintosh,
    start the Terminal app. For Linux, start the terminal window.


    ![](img/dcc0cd79d4a45cfce24fa49d85442884_237_0.png)


    Open the Terminal app on your computer to witness its nongraphical glory.


    +   - In Windows, choose Ubuntu from the Start button menu.

    +   - On the Mac, in the Finder, press Command+Shift+U to view the Utilities folder.
    Open the Terminal app.

    +   - In a Linux or Unix GUI environment, locate and launch the Terminal, Term,
    or Xterm program.


    The command prompt is both cryptic and powerful. In fact, programmers at Microsoft
    use a command-prompt environment called PowerShell to configure Windows. For the
    configurations just mentioned in the list, you can compile and run all the programs
    presented in this book. In fact, you can use the terminal window to do everything:
    edit, build, and run — just like back in the 1980s!'
