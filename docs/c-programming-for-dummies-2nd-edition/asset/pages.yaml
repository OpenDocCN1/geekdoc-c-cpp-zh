  md: "Chapter 16.) An external variable, also called a global variable, must be declared\
    \ in only one module, usually the main module. This variable is declared outside\
    \ of any function, usually at the top of the source code file, betwixt the #include\
    \ directives and function prototypes. It works like any variable declaration:\n\
    \n```\ntype name;\n```\n\nwith type being the data type and name the assigned\
    \ name, optionally followed by an assignment or initialization. To access this\
    \ external variable from other modules, you must employ the extern keyword. This\
    \ keyword doesn't declare the variable, but rather references that it's declared\
    \ elsewhere, in another source code module. Here's the extern keyword's format:\n\
    \n```\nextern type name;\n```\n\nListing 24-3 shows an example of how an external\
    \ variable is declared, with Listing 24-4 illustrating how the extern keyword\
