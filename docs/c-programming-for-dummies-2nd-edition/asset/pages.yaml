  md: "# It’s Totally Random\n\nOne mathematical function that’s relatively easy to\
    \ grasp is the rand() function. It generates random numbers. Though such a task\
    \ may seem silly, it’s the basis for just about every computer game ever invented.\
    \ Random numbers are a big deal in programming.\n\n![](img/dcc0cd79d4a45cfce24fa49d85442884_181_0.png)\n\
    \nA computer cannot generate truly random numbers. Instead, it produces what are\
    \ known as pseudo-random numbers. The reason is that conditions inside the computer\
    \ can be replicated. Therefore, serious mathematicians scoff that any value a\
    \ computer calls random isn’t a truly random number. Can you hear them scoffing?\
    \ I can.\n\n# Spewing random numbers\n\nThe rand() function is the simplest of\
    \ C’s random-number functions. It requires the stdlib.h header file, and it coughs\
    \ up an int value that’s supposedly random. Listing 11-8 demonstrates sample code.\n\
    \n# LISTING 11-8: Now, That’s Random\n\n```\n#include <stdio.h>\n#include <stdlib.h>\n\
    \nint main()\n{\n int r,a,b;\n\n puts(\"100 Random Numbers\");\n for(a=0;a<20;a++)\n\
    \ {\n   for(b=0;b<5;b++)\n   {\n     r=rand();\n     printf(\"%d\\t\",r);\n  \
    \ }\n   putchar('\\n');\n }\n return(0);\n}\n```"
  merge: -1
  img_proc: true
- pgno: 182
  md: 'Listing 11-8 uses a nested for loop to generate 100 random values. The rand()
    function in Line 13 generates the values. The printf() function in Line 14 displays
    the values by using the %d conversion character, which outputs int values.


    Exercise 11-17: Type the source code shown in Listing 11-8 into your editor. Save,
    build, and run to behold 100 random values.


    Exercise 11-18: Modify the code so that all values displayed are in the range
    0 through 20.


    ![](img/dcc0cd79d4a45cfce24fa49d85442884_182_0.png)


    Here''s a hint for Exercise 11-18: Use the modulus assignment operator to limit
    the range of the random numbers. The format looks like this:


    ```

    r%=n;

    ```


    r is the number returned from the rand() function. %= is the modulus assignment
    operator. n is the range limit, plus 1. After the preceding statement, values
    returned are in the range 0 through n-1. So if you want to generate values between
    1 and 100, you would use this formula:


    ```

    value = (r % 100) + 1;

    ```


    # Making the numbers more random


    Just to give some credit to the snooty mathematicians who claim that computers
    generate pseudo-random numbers, run the program you generated from Exercise 11-18.
    Observe the output. Run the program again. See anything familiar?


    The rand() function is good at generating a slew of random values, but they''re
    predictable values. To make the output less predictable, you need to seed the
    random-number generator. That''s done by using the srand() function.


    Like the rand() function, the srand() function requires the stdlib.h header, shown
    at Line 2 in Listing 11-9. The function requires an unsigned int value, seed,
    which is declared at Line 6. The scanf() function at Line 10 reads in the unsigned
    value by using the %u placeholder. Then the srand() function uses the seed value
    in Line 11.'
