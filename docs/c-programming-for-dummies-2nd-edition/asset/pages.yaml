- pgno: 265
  md: '**TABLE 17-1**&nbsp;&nbsp;&nbsp;&nbsp;Binary Groupings


    | Term | C Data Type | Bits | Value Range Unsigned | Value Range Signed |

    |---|---|---|---|---|

    | Bit | _Bool | 1 | 0 to 1 | 0 to 1 |

    | Byte | char | 8 | 0 to 255 | -128 to 127 |

    | Word | short int | 16 | 0 to 65,535 | -32,768 to 32,767 |

    | Double-word | Int | 32 | 0 to 4,294,967,295 | -2,147,483,648 to 2,147,483,647
    |

    | Long | Long | 64 | 0 to 18,446,744,073,709,551,615 | -9,223,372,036,854,775,807
    to 9,223,372,036,854,775,808 |


    The advantage of grouping bits into bytes, words, and so on is that it makes them
    easier to handle. The processor best deals with information in chunks. How chunks
    get their values is based upon powers of 2, as shown in Table 17-2.


    In Table 17-1, you see the range of values that can be stored in 8 bits, or 1
    byte. It''s the same range you''d find in a C language *char* variable. Indeed,
    if you total Column 2 in Table 17-2, you get 255, which is the highest value represented
    in a byte.


    **TABLE 17-2**&nbsp;&nbsp;&nbsp;&nbsp;Powers of 2


    | Expression | Decimal Value | Binary Value |

    |---|---|---|

    | 2<sup>0</sup> | 1 | 1 |

    | 2<sup>1</sup> | 2 | 10 |

    | 2<sup>2</sup> | 4 | 100 |

    | 2<sup>3</sup> | 8 | 1000 |

    | 2<sup>4</sup> | 16 | 10000 |

    | 2<sup>5</sup> | 32 | 100000 |

    | 2<sup>6</sup> | 64 | 1000000 |

    | 2<sup>7</sup> | 128 | 10000000 |


    ![](img/dcc0cd79d4a45cfce24fa49d85442884_265_0.png)


    A byte has 256 possible values, which includes the all-zero permutation.


    Figure 17-1 illustrates how the powers of 2 map into binary storage. Just as decimal
    places in a base 10 number increase by powers of 10, bits in a binary number increase
    by powers of 2, reading from right to left.'
