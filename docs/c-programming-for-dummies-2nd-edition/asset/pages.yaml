    # ## Returning an array from a function


    In addition to being passed an array, a function in C can return an array. The
    problem is that arrays are returned only as pointers. This topic is covered in
    Chapter 19. But it’s not the worst part:


    In Chapter 19, you discover the scandalous truth that C has no arrays — that they
    are merely cleverly disguised pointers. (Sorry to save that revelation for the
    end of this chapter.) Array notation does have its place, but pointers are where
    the action is.'
