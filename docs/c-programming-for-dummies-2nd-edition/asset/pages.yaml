  md: "# Screwing up a loop\n\nI know of two common ways to mess up a loop. These\
    \ trouble spots crop up for beginners and pros alike. The only way to avoid these\
    \ spots is to keep a keen eye so that you can spot 'em quick.\n\nThe first goof-up\
    \ is specifying a condition that can never be met; for example:\n\n```\nfor(x=1;x==10;x=x+1)\n\
    ```\n\nIn the preceding line, the exit condition is false before the loop spins\
    \ once, so the loop is never executed. This error is almost as insidious as using\
    \ an assignment operator (a single equal sign) instead of the “is equal to” operator\
    \ (as just shown).\n\nAnother common mistake is misplacing the semicolon, as in\n\
    \n```\nfor(x=1;x<14;x=x+1);\n{\n    puts(\"Sore shoulder surgery\");\n}\n```\n\
    \nBecause the first line, the for statement, ends in a semicolon, the line is\
    \ the entire loop. The empty code repeats 13 times, which is what the for statement\
    \ dictates. The puts() statement is then executed once.\n\n![](img/dcc0cd79d4a45cfce24fa49d85442884_145_0.png)\n\
    \nRogue semicolons can be frustrating!\n\nThe problem is worse with while loops\
    \ because the do while structure requires a semicolon after the final while statement.\
    \ In fact, forgetting that particular semicolon is also a source of woe. For a\
    \ traditional while loop, you don’t do this:\n\n```\nwhile(x<14);\n{\n    puts(\"\
    Sore shoulder surgery\");\n}\n```\n\nMost compilers catch these rogue semicolon\
    \ issues with a warning. Still, be on the lookout, as Listing 9-11 demonstrates.\n\
    \n# LISTING 9-11: A for Loop with No Body\n\n```\n#include <stdio.h>\n\nint main()\n\
