  md: "# Exploring the directory tree\n\nMost storage media feature more than one\
    \ directory. The main directory is the root, with subdirectories organizing the\
    \ media. Using C, you can create directories of your own and flit between them\
    \ like bees upon flowers. The C library sports various functions to sate your\
    \ directory-diving desires. Here's a sampling:\n\n| Function | Description |\n\
    |----------|-------------|\n| getcwd() | Retrieve the current working directory\
    \ |\n| mkdir() | Create a new directory |\n| chdir() | Change to the directory\
    \ specified |\n| rmdir() | Obliterate the directory specified |\n\ngetcwd(), chdir(),\
    \ and rmdir() require the unistd.h header file; the mkdir() function requires\
    \ sys/stat.h.\n\nListing 23-3 makes use of three directory functions: getcwd(),\
    \ mkdir(), and chdir().\n\n# Make Me a Directory\n\n```\n```c\n#include <stdio.h>\n\
    #include <unistd.h>\n#include <sys/stat.h>\n\nint main()\n{\n\tchar curdir[255];\n\
    \n\tgetcwd(curdir,255);\n\tprintf(\"Current directory is %s\\n\",curdir);\n\t\
    mkdir(\"very_temporary\",S_IRWXU);\n\tputs(\"New directory created:\");\n\tchdir(\"\
    very_temporary\");\n\tgetcwd(curdir,255);\n\tprintf(\"Current directory is %s\\\
    n\",curdir);\n\treturn(0);\n}\n```\n```\n\nThe getcwd() function in Line 9 captures\
    \ the current directory’s name and saves it in the curdir array. The directory\
    \ name — a full pathname — is output at Line 10.\n\nLine 11 creates a new directory,\
    \ very_temporary. The defined constant S_IRWXU is the file-creation mode. This\
    \ constant sets the new directory's permissions, allowing the owner read, write,\
    \ and execute access."
