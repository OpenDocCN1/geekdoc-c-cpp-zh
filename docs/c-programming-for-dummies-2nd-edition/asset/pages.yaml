  md: '> A newer data type, _Bool, stores binary values, 1 or 0, often referred to
    as TRUE and FALSE, respectively. _Bool, a loaner word from C++, must be written
    with the initial underscore character and a capital B. You may not find _Bool
    used in many C program source code listings — most likely, to keep the code compatible
    with older compilers.


    # Using variables


    Most, if not all, of your future C language programs will employ variables. Earlier
    in this chapter, Listing 6-1 illustrates the basic three steps for using variables
    in the C language:


    +   1. Declare the variable, giving it a data type and a name.

    +   2. Initialize the variable (assign it a value).

    +   3. Use the variable.


    All three steps are required for working with variables in your code, and these
    steps must be completed in that order.


    To declare a variable, place a statement near the start of a function, such as
    the main() function in every C program. Place the declaration after the initial
    curly bracket. (Refer to Listing 6-1.) The declaration is a statement on a line
    by itself, ending with a semicolon:


    ```

    type name;

    ```


    type is the data type: char, int, and others are introduced throughout this chapter.


    name is the variable''s name. The name must not be the name of a C language keyword
    or any other variable name that was previously declared. The name is case-sensitive
    — though, traditionally, C language variable names are written in lowercase. If
    you want to be saucy, you can add numbers or underscores to the variable name,
    but always start a variable name with a letter.


    The equal operator assigns a value to a variable. The format is very specific:


    ```

    variable = value;

    ```


    Read this expression as, “The value of variable equals value.”


    variable is the variable''s name. It must be declared earlier in the source code.'
