    main.c source code file.


    # Exercise 24-4


    Split out the fillstructure() and printstructure() functions from Listing 24-6
    so that each appears in its own source code module, input.c and output.c for filenames,
    respectively. Build the multi-module program.


    # THOUGHTS ON SPLITTING UP CODE


    I divide large program modules by function. For example, all input functions go
    into a display.c module; input functions belong in input.c. I create an init.c
    module for initialization routines. Beyond that, the number of modules depends
    on what the program does.


    Putting similar functions into a module is a good idea, though having one function
    in a module is also okay. In fact, when you do, and the module works, you can
    pretty much set it aside when it comes to working out bugs and whatnot.


    No matter what the project size, I recommend creating a project header file. That
    header file keeps all function prototypes, global variables, and constants in
    one place — plus, it helps map out the entire project. For example, you can list
    function prototypes by module or add comments, development history, and other
    notes.'
