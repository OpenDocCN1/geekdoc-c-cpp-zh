  md: "# Working the debugger\n\nThe debugger operates by examining your code as it\
    \ runs, showing you what's happening, both internally to the program as well as\
    \ the output. If you've created a new Code::Blocks program with debugging information\
    \ (see the preceding section) and you have code to debug, you're ready to start.\n\
    \nI confess that the code shown in Listing 25-1 is purposefully riddled with bugs.\n\
