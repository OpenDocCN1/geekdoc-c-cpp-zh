  md: '# IN THIS CHAPTER


    +   » Getting to know binary digits

    +   » Showing binary output

    +   » Working with bitwise operators

    +   » Setting and masking bits

    +   » Shifting bits

    +   » Understanding hexadecimal


    # Chapter 17

    Binary Mania


    Computers are digital devices, bathed in the binary waters of ones and zeros.
    Everything your programs deal with — all the text, graphics, music, video, and
    whatnot — melts down to the basic digital elements of one-zero, true-false, on-off,
    yes-no. When you understand binary, you can better understand computers and all
    digital technology.


    # Binary Basics


    Happily, you don''t have to program any digital device by writing low-level code,
    flipping switches, or soldering wires. That''s because today''s programming happens
    at a higher level. But still, deep within the machine, that type of low-level
    coding continues. You''re just insulated from the primordial soup of ones and
    zeros from which all software rises.


    # Understanding binary


    The binary digits, or bits, are 1 and 0. Alone, they''re feeble; but in groups,
    they muster great power. Digital storage uses these bits in groups, as illustrated
    in Table 17-1.'
  merge: -1
