  md: '# IN THIS CHAPTER


    +   » Storing multiple variables in an array

    +   » Creating an array

    +   » Understanding character arrays

    +   » Sorting values in an array

    +   » Working with multidimensional arrays

    +   » Sending an array to a function


    # Chapter 12


    # Give Me Arrays


    When I first learned to program, I avoided the topic of arrays. They didn’t make
    sense to me. Array variables sport their own methods and madness, which is different
    from working with single variables in C. Rather than shun this topic and skip
    ahead to the next chapter (which isn’t any easier), consider embracing the array
    as a lovely, weird, and useful tool.


    # Behold the Array


    Humans enjoy grouping things, mostly done by type: People collect spoons, for
    example, or coins or husbands. These items are easily grouped because they’re
    of similar types. The C language, too, has ways to group values of similar types,
    like a row of variables in a queue. The word used in C is array.


    # Avoiding arrays


    At some point in your programming career, an array becomes painfully inevitable.
    As an example, consider Listing 12-1. The code asks for and displays your three
    top scores, presumably from a game.'
