    \ <stdlib.h>\n#include <time.h>\n\nint main()\n{\n    int r,a,b;\n\n    srand((unsigned)time(NULL));\n\
    \    for(a=0;a<20;a++)\n    {\n        for(b=0;b<5;b++)\n        {\n         \
