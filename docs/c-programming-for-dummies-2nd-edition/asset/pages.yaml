- pgno: 140
  md: "# Using the do while loop\n\nThe do while loop can be described as an upside-down\
    \ while loop. This description is true, especially when you look at the thing's\
    \ structure:\n\n```\ndo\n{\n    statement(s);\n} while (condition);\n```\n\nAs\
    \ with a while loop, the initialization must take place before entering the loop,\
    \ and one of the loop's statements should affect the condition so that the loop\
    \ exits. The while statement, however, appears after the last curly bracket. The\
    \ do statement begins the structure.\n\nBecause of its inverse structure, the\
    \ major difference between a while loop and a do while loop is that the do while\
    \ loop is always executed at least once. So you can best employ this type of loop\
    \ when you need to ensure that the statements execute. Likewise, avoid do while\
    \ when you don't want the statements to execute unless the condition is true.\
    \ An interesting do while loop is shown in Listing 9-7.\n\n# LISTING 9-7: A Fibonacci\
    \ Sequence\n\n```\n#include <stdio.h>\n\nint main()\n{\n    int fibo,nacci;\n\n\
    \    fibo=0;\n    nacci=1;\n\n    do\n    {\n        printf(\"%d \",fibo);\n \
    \       fibo=fibo+nacci;\n        printf(\"%d \",nacci);\n        nacci=nacci+fibo;\n\
    \    } while( nacci < 300 );\n\n    putchar('\\n');\n    return(0);\n}\n```"
