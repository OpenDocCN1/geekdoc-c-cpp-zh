  md: '# NEGATIVE BINARY NUMBERS


    Binary numbers are always positive, considering that the values of a bit can be
    only 1 or 0 and not –1 and 0. So how does the computer do signed integers? Easy:
    It cheats.


    The leftmost bit in a signed binary value is known as the sign bit. When that
    bit is set (equal to 1), the value is negative for a signed int. Otherwise, the
    value is read as positive.


    ![](img/dcc0cd79d4a45cfce24fa49d85442884_277_0.png)


    In this example, the sign bit is set for a signed char. The values expressed are
    negative, which is in the range of a signed char variable.


    ![](img/dcc0cd79d4a45cfce24fa49d85442884_277_1.png)


    In this example, the sign bit is ignored because the value is an unsigned char.
    The values can only be positive, which is why the positive range for an unsigned
    variable is greater than for a signed variable.'
  merge: -1
  img_proc: true
- pgno: 278
  md: '```

    Type a value from 0 to 255: 128

    0000000010000000 128

    0000000001000000 64

    0000000010100000 32

    0000000001010000 16

    0000000000101000 8

    0000000000010100 4

    0000000000001010 2

    0000000000000001 1

    ```


    Unlike the << operator, the >> is guaranteed to always cut the value in half when
    you shift one digit to the right. In fact, the >> operator is far quicker to use
    on an integer value than the / (division) operator to divide a value by 2.


    Operators looking like the C language''s bit shift operators, << and >>, are used
    in the C++ language for input and output. C++ also has bit shift operators, which
    are considered overloaded (duplicated) with the I/O operators.


    # Explaining the binbin() function


    ```

    bin[x] = n & 0x80 ? ''1'' : ''0'';

    n <<= 1;

    ```


    If you''ve worked through this chapter from front to back, I can now sanely explain
    what''s going on in the binbin() function to make it convert values into a binary
    string. Two statements do the job.


    The first statement performs an AND mask with the value n and hexadecimal value
    0x80. All but the leftmost bit in the number is discarded. If that bit is set,
    which makes it a TRUE condition, the character ''1'' is stored in the array; otherwise,
    the character ''0'' is stored. (Refer to Chapter 8 to review the ternary operator
    ? : .)


    The value 0x80 is expressed in hexadecimal notation, a type of shorthand for binary.
    (See the next section, "The Joy of Hex.") The hex value 0x80 is equal to 10000000
    binary, which is the AND mask. For wider, 16-bit values, the mask 0x8000 is used
    instead.


    The second statement shifts the bits in the value n one notch to the left. As
    the loop spins, working through the value n, another bit in the value is shifted
    to the leftmost position. That bit is evaluated, and the binary string is built
    by adding a ''1'' or ''0'' character to the string.'
  merge: -1
