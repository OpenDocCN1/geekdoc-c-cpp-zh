  md: "# Filling a structure\n\nAs with other variables, you can initialize a structure\
    \ variable when it's created. You first define the structure type and then declare\
    \ a structure variable with its member values preset. Ensure that the preset values\
    \ match the order and type of members defined in the structure, as shown in Listing\
    \ 14-2.\n\n# LISTING 14-2 Declaring an Initialized Structure\n\n```\n```c\n#include\
    \ <stdio.h>\n\nint main()\n{\n    struct president\n    {\n        char name[40];\n\
    \        int year;\n    };\n    struct president first = {\n        \"George Washington\"\
    ,\n        1789\n    };\n\n    printf(\"The first president was %s\\n\",first.name);\n\
    \    printf(\"He was inaugurated in %d\\n\",first.year);\n\n    return(0);\n}\n\
    ```\n```\n\nExercise 14-3: Create a new program by typing the source code from\
    \ Listing 14-2 into the editor. Build and run.\n\nYou can also declare a structure\
    \ and initialize it in one statement:\n\n```\n```c\nstruct president\n{\n    char\
    \ name[40];\n    int year;\n} first = {\n    \"George Washington\",\n    1789\n\
    };\n```\n```"
