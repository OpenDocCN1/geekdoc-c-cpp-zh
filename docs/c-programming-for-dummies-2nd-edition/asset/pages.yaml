- pgno: 464
  md: '# About the Author


    Dan Gookin has been writing about technology for nearly three decades. He combines
    his love of writing with his gizmo fascination to create books that are informative,
    entertaining, and not boring. Having written over 160 titles with 12 million copies
    in print translated into over 30 languages, Dan can attest that his method of
    crafting computer tomes seems to work.


    Perhaps his most famous title is the original *DOS For Dummies*, published in
    1991. It became the world''s fastest-selling computer book, at one time moving
    more copies per week than the *New York Times* number-one bestseller (though,
    as a reference, it could not be listed on the Times'' Best Sellers list). That
    book spawned the entire line of *For Dummies* books, which remains a publishing
    phenomenon to this day.


    Dan''s most popular titles include *PCs For Dummies*, *Laptops For Dummies*, and
    *Microsoft Word For Dummies*. He also maintains the vast and helpful website www.wambooli.com.


    Dan holds a degree in Communications/Visual Arts from the University of California,
    San Diego. He lives in the Pacific Northwest, where he enjoys spending time annoying
    people who deserve it.'
