    \ have you played where you're asked to seed the randomizer? None.\n\nThere must\
    \ be a better way.\n\nThe best way to write a random-number generator is not to\
    \ ask the user to type a seed, but rather to fetch a seed from elsewhere. In Listing\
    \ 11-10, the seed value is pulled from the system clock by using the time() function."
