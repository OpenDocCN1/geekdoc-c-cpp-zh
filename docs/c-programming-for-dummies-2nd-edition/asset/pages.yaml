  md: '| _Noreturn | double | register | unsigned |

    | _Static_assert | else | restrict | void |

    | _Thread_local | enum | return | volatile |

    | auto | extern | short | while |


    The keywords shown in Table 3-1 represent the C language''s basic commands. These
    simple directions are combined in various interesting ways to do wondrous things.
    But the language doesn''t stop at keywords; continue reading in the next section.


    ![](img/dcc0cd79d4a45cfce24fa49d85442884_46_0.png)


    > > Don''t bother memorizing the list of keywords. Though I still know the 23
    "to be" words in English (and in the same order as specified in my eighth grade
    English text), I''ve never memorized the C language keywords.

    > > The keywords are all case-sensitive, as shown in Table 3-1.

    > > Of the 44 keywords, 32 are original C language keywords. The C99 update (in
    1999) added 5 more, and the more recent C11 (2011) update added 7. Most of the
    newer keywords begin with an underscore, as in _Alignas.

    > > Keywords are also known as reserved words, which means that you cannot name
    functions or variables the same as keywords. The compiler moans like a drunken,
    partisan political blogger when you attempt to do so.


    # Functions


    Where you find only 44 keywords, there are hundreds (if not thousands) of functions
    in the C language, including functions you write yourself. Think of a function
    as a programming machine that accomplishes a task. Truly, functions are the workhorses
    of the C language.


    The telltale sign of the function is the appearance of parentheses, as in puts()
    for the "put string" function, which displays text. String is programming lingo
    for text that''s longer than a single character.


    Functions are used in several ways. For example, a beep() function may cause a
    computer''s speaker to beep:


    ```

    beep();

    ```'
