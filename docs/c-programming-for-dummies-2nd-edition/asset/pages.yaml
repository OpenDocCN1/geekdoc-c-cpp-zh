  md: 'See whether you can guess the output before the program runs.


    Exercise 11-23: Modify the code from Exercise 11-22 so that the program evaluates
    the equation


    ```

    12 / 3 / 2

    ```


    No, that''s not a date. It''s 12 divided by 3 divided by 2.


    # Forcing order with parentheses


    The order of precedence can be fooled by using parentheses. As far as the C language
    is concerned, anything happening within parentheses is evaluated first in any
    equation. So even when you forget the order of precedence, you can force it by
    hugging parts of an equation with parentheses.


    Math ahead!


    Exercise 11-24: Code the following equation so that the result equals 14, not
    2:


    ```

    12 - 5 * 2

    ```


    Exercise 11-25: Code the following equation (from Exercise 11-22) so that addition
    and subtraction take place before multiplication and division. If you do it correctly,
    the result is 110:


    ```

    20 * 5 + 2 + 42 / 6

    ```


    +   - The code you write may deal more with variables than with literal or immediate
    values, so you must understand the equation and what''s being evaluated. For example,
    if you need to add the number of full-time and part-time employees before you
    divide by the total payroll, put the first two values in parentheses.

    +   - Beyond the order of precedence, parentheses add a level of readability to
    the code, especially in long equations. Even when parentheses aren''t necessary,
    consider adding them if the result is more readable code.

    +   - Appendix G lists the full order of precedence for all C language operators.'
