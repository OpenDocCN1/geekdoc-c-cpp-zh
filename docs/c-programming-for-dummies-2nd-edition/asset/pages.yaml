- pgno: 314
  md: "# FIGURE 19-2:\nHow the ** thing works.\n\n```\n**(fruit+0)\n    ↓\n*fruit[]\
    \ → *(fruit+0) → watermelon\n          *(fruit+1) → banana\n          *(fruit+2)\
    \ → pear\n          *(fruit+3) → apple\n          *(fruit+4) → coconut\n     \
    \     *(fruit+5) → grape\n          *(fruit+6) → blueberry\n```\n\nIt helps to\
    \ remember that the ** operator is almost always (but not exclusively) tied to\
    \ an array of pointers; or, if you want to make it simple, to an array of strings.\
    \ So, in Figure 19-2, *fruit[] represents the address of an array of pointers.\
    \ The second column contains each address as it's referenced relative to the fruit\
    \ base address. The column on the right shows the strings at each address, with\
    \ the **(fruit+0) expression holding the first character of the first string.\
    \ Subsequent strings' first characters would be **(fruit+1),**(fruit+2), and so\
    \ on.\n\nIf you're still confused — and I don't blame you; Einstein was in knots\
    \ at this point when he read this book's first edition — consider mulling over\
    \ Table 19-3. In the table, pointer notation (using variable ptr) is compared\
    \ with the equivalent array notation (using variable array).\n\n# TABLE 19-3 \
    \ Pointer Notation and Array Notation\n\n| Pointer Notation | Array Notation |\
    \ Description |\n|---|---|---|\n| **ptr | *array[] | Declares an array of pointers\
    \ |\n| *ptr | array[0] | The address of the first pointer in the array; for a\
    \ string array, the first string |\n| *(ptr+0) | array[0] | The same as the preceding\
    \ entry |\n| **ptr | array[0][0] | The first element of the first pointer in the\
    \ array; the first character of the first string in the array |\n| **(ptr+1) |\
    \ array[1][0] | The first element of the second pointer in the array; the first\
    \ character of the second string |\n| *(*(ptr+1)) | array[1][0] | The same as\
    \ the preceding entry |\n| *(*(ptr+a)+b) | array[a][b] | Element b of pointer\
    \ a |"
