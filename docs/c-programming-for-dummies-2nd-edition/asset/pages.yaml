- pgno: 306
  md: "The output is the same. What this ugly *pa++=x+ 'A' mess does is described\
    \ here:\n\n+   - **x+'A'** This part of the statement is executed first, adding\
    \ the value of variable x to letter A. The effect is that the code marches up\
    \ the alphabet as the value of x increases.\n+   - ***pa** The result of x+ 'A'\
    \ is placed into the memory location specified by pointer pa.\n+   - **++** The\
    \ value of variable pa — the memory address — is incremented one unit. Because\
    \ the ++ appears after the variable (it's post-fixed), the value is incremented\
    \ after the value at that address is written.\n\nKeeping the two statements separate\
    \ still works, and I code my programs this way because it's easier for me to read\
    \ later. But not every programmer does so! Many of them love to stack up pointers\
    \ with the increment operator. Watch out for it!\n\nExercise 19-9: Fix up your\
    \ source code from Exercise 19-8 so that the second for loop uses the *pa++ monster.\n\
    \nHopefully, the *pa++ pointer-thing makes sense. If not, take a nap and then\
    \ come back and examine Listing 19-4.\n\n# LISTING 19-4: Head-Imploding Program\n\
    \n```\n#include <stdio.h>\n\nint main()\n{\n    char alpha = 'A';\n    int x;\n\
    \    char *pa;\n\n    pa = &alpha;    /* initialize pointer */\n\n    for(x=0;x<26;x++)\n\
    \        putchar(*(pa++));\n    putchar('\\n');\n\n    return(0);\n}\n```"
