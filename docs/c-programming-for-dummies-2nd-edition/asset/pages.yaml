    ensure that input is limited to 15 characters — that is, unless you direct it
    to do so:


    # Exercise 12-12: Modify the scanf() functions in your source code from Exercise
    12-11 so that the conversion character used is written as %15s. Build and run.


    The %15s conversion character tells the first scanf() function to read only the
    first 15 characters of input and place it into the char array (string). Any extra
    text is then read by the second scanf() function, and any extra text after that
    is discarded.


    ![](img/dcc0cd79d4a45cfce24fa49d85442884_195_1.png)


