    # Understanding main()''s arguments


    When you don''t plan on your program accepting any command-line arguments, you
    can leave the main() function''s parentheses empty. Like this:


    ```

    int main()

    ```


    When arguments are used in your code, they must be declared. Using them looks
    like this:


    ```

    int main(int argc, char *argv[])

    ```


    argc is the argument count value. It''s an integer that ranges from 1 through
    however many items were typed after the program name at the command prompt.


    *argv[] is an array of char pointers. You can think of it instead as an array
    of strings, which is how it can be used in your code.'
