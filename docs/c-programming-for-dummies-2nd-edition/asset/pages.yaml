  md: "Listing 9-8 illustrates a common endless loop, which is a programming error,\
    \ not a syntax error.\n\n# LISTING 9-8: A Common Way to Make an Endless Loop\n\
    \n```\n```c\n#include <stdio.h>\n\nint main()\n{\n    int x;\n    for(x=0;x=10;x=x+1)\n\
    \    {\n        puts(\"What are you lookin' at?\");\n    }\n    return(0);\n}\n\
    ```\n```\n\nThe problem with the code in Listing 9-8 is that the for statement's\
    \ exit condition is always true: x=10. Read it again if you didn't catch it the\
    \ first time, or just do Exercise 9-18.\n\n**Exercise 9-18:** Type the source\
    \ code for Listing 9-8. Save and build, ignoring any warnings. Run.\n\nThe program\
    \ runs — infinitely.\n\n![](img/dcc0cd79d4a45cfce24fa49d85442884_142_0.png)\n\n\
    +   - To break out of an endless loop, press Ctrl+C on the keyboard. This trick\
    \ works only for console programs, and it may not always work. If it doesn't,\
    \ you need to kill the process run amok, which is something I don't have time\
    \ to explain in this book.\n+   - Endless loops are also referred to as *infinite\
    \ loops*.\n\n# Looping endlessly but on purpose\n\nOccasionally, a program needs\
    \ an endless loop. For example, a microcontroller may load a program that runs\
    \ as long as the device is on. When you set up such a loop on purpose in C, one\
    \ of two statements is used:\n\n```\n```c\nfor(;;)\n```\n```"
