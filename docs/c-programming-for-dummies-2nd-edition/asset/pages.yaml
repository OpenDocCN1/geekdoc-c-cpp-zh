- pgno: 163
  md: "The OCTO defined constant is replaced by the text 8 when the source code is\
    \ compiled, which translates into the value 8.\n\n+   **The #define directive\
    \ is traditionally placed at the top of the source code, right after any #include\
    \ directives. See the next section for an example.**\n+   \n+   **You can define\
    \ strings as well:**\n+   \n+   ```c\n+   #define AUTHOR \"Dan Gookin\"\n+   ```\n\
    +   \n+   The string that's defined includes the double quotes. Anywhere the defined\
    \ constant AUTHOR appears in the source code file, it's replaced by the text \"\
    Dan Gookin\" — including the double quotes.\n+   \n+   **You can even define math\
    \ calculations:**\n+   \n+   ```c\n+   #define CELLS 24*80\n+   ```\n+   \n+ \
    \  The defined constant CELLS doesn't do math, but the compiler replaces its text\
    \ with the expression 24*80 everywhere CELLS appears in the source code file.\n\
    \nLike a variable name, a defined constant specified inside a string literal is\
    \ part of the string. The preprocessor doesn't expand a defined constant when\
    \ it appears in a string.\n\nA defined constant is created and managed by the\
    \ preprocessor. It's a search-and-replace operation; no variable \"storage container\"\
    \ is created, no data type is specified.\n\n# **Putting defined constants to use**\n\
    \nAnytime your code uses a single value over and over — something significant,\
    \ like the number of rows in a table or the maximum number of items you can stick\
    \ in a shopping cart — consider using a defined constant. Because this value appears\
    \ in several functions, using the #define directive makes more sense than creating\
    \ multiple const values, the same one for each function.\n\nListing 10-8 shows\
    \ an example where a defined constant helps in two of the code's functions."
