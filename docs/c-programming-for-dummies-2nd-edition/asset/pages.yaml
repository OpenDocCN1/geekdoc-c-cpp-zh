    # Returning a pointer from a function


    Functions are known by their types, such as int or char or even void. You can
    also declare pointer functions, which return a memory location as a value. For
    example:


    ```

    int *monster(void);

    ```


    In this example, the monster() function requires no arguments but returns a pointer
    to an integer value.


    Most functions that return pointers return the memory location of a buffer — a
    storage area that the function allocates. For example:


    ```

    struct person *fill_data(void);

    ```


    The preceding prototype declares the fill_data() function, which returns the address
    of a person structure. The structure is created, or allocated, within the function
    and its memory address returned.


    The address() function prototype shown on the following line returns a string
    value, either a static array declared in the function or the address of a freshly
    allocated char buffer:


    ```

    char *address(int a, int b);

    ```


    Allocating memory buffers is the job of the malloc() function. This function,
    as well as many examples of functions that return memory locations, is covered
    in Chapter 20.'
