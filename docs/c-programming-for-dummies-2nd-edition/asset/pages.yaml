  md: "The value specified by each case statement is compared with the item specified\
    \ in the switch statement. If the values are equal, the statements belonging to\
    \ case are executed. If not, they're skipped and the next case value is compared.\n\
    \nThe break keyword stops program flow through the switch-case structure. Program\
    \ flow resumes after the switch-case structure's final curly bracket, which is\
    \ Line 23 in Listing 8-8.\n\nAfter the final comparison, the switch-case structure\
    \ uses a default item, shown in Line 20. This item's statements are executed when\
    \ none of the case comparisons matches. The default item need not be specified,\
    \ though in Listing 8-8 it handles out-of-range values.\n\nExercise 8-18: Construct\
    \ a program using source code similar to Listing 8-8, but make the input the letters\
    \ A, B, and C. You might want to review Chapter 7 to see how single characters\
    \ are specified in the C language.\n\n![](img/dcc0cd79d4a45cfce24fa49d85442884_125_0.png)\n\
    \n+   » The comparison being made in a switch-case structure is between the value\
    \ specified in switch's parentheses and the values that follow each case keyword.\
    \ When the comparison is true, meaning that both values are equal to each other,\
    \ the statements belonging to case are executed.\n+   » The break keyword disrupts\
    \ program flow. It can be used in an if structure as well, but mostly it's found\
    \ in loops. See Chapter 9.\n+   » Specify a break after a case comparison's statements\
    \ so that the rest of the structure isn't executed. See the later section \"Taking\
    \ no breaks.\"\n\n# Understanding the switch-case structure\n\nAnd now — presenting\
    \ the most complex thing in C. Seriously, you'll find more rules and structure\
    \ with switch-case than just about any other construct in C. Here's the skeleton:\n\
    \n```\nswitch(expression)\n{\n    case value1:\n        statement(s);\n      \
    \  break;\n    case value2:\n        statement(s);\n        break;\n    case value3:\n\
    \        statement(s);\n}\n```"
