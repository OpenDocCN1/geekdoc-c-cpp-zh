- pgno: 405
  md: "# Improved Error Messages\n\nOne way you can better communicate your program's\
    \ goof-ups to users is to present better, more descriptive error messages. Though\
    \ too many details can confuse users, too scant an error message can frustrate\
    \ them. For example:\n\n```\nUnable to allocate 128K char buffer 'input' at location\
    \ 0xFE3958\n```\n\nThis error message may be ideal when you're debugging the code,\
    \ but a user either ignores it or \"Googles it\" to see how to fix the problem.\n\
    \nThe opposite type of error message is just as frustrating:\n\n```\nError 1202\n\
    ```\n\nFor heaven's sake, don't use numbers as error messages! Even if you've\
    \ provided documentation, no user appreciates it, especially when you can just\
    \ as easily write\n\n```\nNot enough memory available\n```\n\nTo help you craft\
    \ better error messages, many C language functions — specifically, the file access\
    \ functions — provide a consistent set of error values when a function fails.\
    \ The error value is stored in the global variable errno, which your program can\
    \ examine. Listing 25-3 provides sample source code.\n\n# LISTING 25-3: Checking\
