    # Chapter 11


    # The Unavoidable Math Chapter


    One of the reasons I shunned computers in my early life was that I feared the
    math. Eventually, I learned that math doesn’t play a central role in programming.
    On one hand, you need to know some math, especially when a program involves complex
    calculations. On the other hand, it’s the computer that does the math — you just
    punch in the formula.


    In the programming universe, math is necessary but painless. Most programs involve
    some form of simple math. Graphics programming uses a lot of math. And games wouldn’t
    be interesting if it weren’t for random numbers. All this stuff is math. I believe
    that you’ll find it more interesting than dreadful.


    # Math Operators from Beyond Infinity


    Two things make math happen in C programming: math operators and math functions.'
