  md: 'On your computer, as well as in Figure 1-1, locate the following parts of the
    workspace:


    **Toolbars:** These messy strips, adorned with various command buttons, cling
    to the top of the Code::Blocks window. The toolbars can be rearranged or hidden,
    so don''t mess with them until you get comfy with the interface.


    **Management:** The pane on the left side of the workspace features four tabs,
    though you may not see all four at one time. The window provides a handy over-sight
    of your programming endeavors.


    **Status bar:** At the bottom of the screen, you see information about the project,
    editor, and other activities that take place in Code::Blocks.


    **Editor:** The big window in the center-right area of the screen is where you
    type code.


    **Logs:** The bottom of the screen features a window with many, many tabs displaying
    various tidbits about the programming process. The tab used most often is named
    Build Log.


    The View menu controls the visibility of every item displayed in the window. Choose
    the pane name, such as Manager, from the View menu to show or hide that item.
    Control toolbars by using the View, Toolbars submenu.


