    \ function. The statement is split between Lines 17 and 18, with the arguments\
    \ for printf() on Line 18.\n\n# Understanding struct\n\nA structure is a collection.\
    \ Think of it as a frame that holds multiple variable types. In many ways, a structure\
    \ is similar to a record in a database. For example:\n\n```\nName\nAge\nGambling\
    \ debt\n```\n\nThese three items can be fields in a database record, but they\
    \ can also be members in a structure: Name would be a string; Age, an integer;\
    \ and Gambling Debt, an unsigned floating-point value. Here's how such a record\
    \ would look as a structure in C:\n\n```\nstruct record\n{\n    char name[32];\n\
    \    int age;\n    float debt;\n};\n```\n\nstruct is a C language keyword that\
    \ introduces a structure. It's a definition that says, “This structure holds the\
    \ following data types.”\n\nrecord is the name of the new structure being created.\
    \ It's not a variable — it's a structure type.\n\nWithin the curly brackets dwell\
    \ the structure's members, the variables contained in the named structure. The\
    \ record structure type contains three member variables: a string name, an int\
    \ named age, and a float value, debt.\n\nThe struct keyword only defines a structure\
    \ type, setting its contents. To use the structure, you must declare a structure\
    \ variable of the structure type you created. For instance:\n\n```\nstruct record\
    \ human;\n```\n\nThis statement declares a new variable human of the record structure\
    \ type."
