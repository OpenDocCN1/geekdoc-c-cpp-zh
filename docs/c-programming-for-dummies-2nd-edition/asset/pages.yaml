    # Chapter 7


    # Input and Output


    One of the basic functions, if not the basic function, of any computing device
    is input and output. The old I/O (say "eye oh") is also the goal of just about
    every program. Input is received and processed, and then output is generated.
    The processing is what makes the program useful. Otherwise, you''d have only input
    and output, which is essentially the same thing as plumbing.


    # Character I/O


    The simplest type of input and output takes place at the character level: One
    character goes in; one character comes out. Of course, getting to that point involves
    a wee bit of programming.


    # Understanding input and output devices


    The C language was born with the Unix operating system. As such, it follows many
    of the rules for that operating system with regard to input and output. Those
    rules are pretty solid:


    +   » Input comes from the standard input device, stdin.

    +   » Output is sent to the standard output device, stdout.'
  merge: -1
  img_proc: true
- pgno: 99
  md: "On a computer, the standard input device, stdin, is the keyboard. Input can\
    \ also be redirected by the operating system, so it can come from another device,\
    \ like a modem or a file.\n\nThe standard output device, stdout, is the display.\
    \ Output can be redirected so that it goes to another device, such as a printer\
    \ or into a file.\n\n![](img/dcc0cd79d4a45cfce24fa49d85442884_99_0.png)\n\nC language\
    \ functions that deal with input and output access the stdin and stdout devices.\
    \ They do not directly read from the keyboard or output to the screen. Well, unless\
    \ you code your program to do so. (Such coding isn't covered in this book.)\n\n\
    Bottom line: Although your programs can get input from the keyboard and send output\
    \ to the display, you need to think about C language I/O in terms of stdin and\
    \ stdout devices instead. If you forget that, you can get into trouble, which\
    \ I happily demonstrate later in this chapter.\n\n# Fetching characters with getchar()\n\
    \nIt's time for your code to become more interactive. Consider the source code\
    \ from Listing 7-1, which uses the getchar() function. This function gets (reads)\
    \ a character from standard input.\n\n# LISTING 7-1: It Eats Characters\n\n```\n\
    ```c\n#include <stdio.h>\n\nint main()\n{\n    int c;\n\n    printf(\"I'm waiting\
    \ for a character: \");\n    c = getchar();\n    printf(\"I waited for the '%c'\
    \ character.\\n\",c);\n    return(0);\n}\n```\n```\n\nThe code in Listing 7-1\
    \ uses the getchar() function at Line 8 to fetch a character from standard input.\
    \ The character returned from getchar() is stored in the c integer variable.\n\
    \nLine 9 displays the character stored in c. The printf() function uses the %c\
    \ placeholder to display single characters."
  merge: -1
  img_proc: true
