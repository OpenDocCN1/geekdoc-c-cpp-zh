    press. The standard was established in 2017.

    +   - You don''t need to memorize the C++ keywords, and not all of them are listed
    in this appendix. Still, it''s important to be aware of them. I strongly recommend
    that you not use any of them as function names or variable names in your code.

    +   - The most frequent C++ reserved word that C programmers tend to use is new.
