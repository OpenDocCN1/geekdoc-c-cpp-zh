  md: '# Exercise 17-2: Modify the binbin() function from Listing 17-1 so that it
    outputs 16 bits instead of 8. A 16-bit value is a short int, and it should be
    assigned to properly interpret the values. To help you out, change these items:


    +   - Line 9: Alter the text so that 65535 is specified instead of 255.

    +   - Line 15: Alter the binbin() function’s argument to be an unsigned int (just
    unsigned).

    +   - Line 18: Modify the size of the array to account for 16 characters in the
    output plus the \0 (null character) at the end of the string.

    +   - Line 21: Adjust the literal value 8 in the code to 16 to account for all
    16 characters in the output.

    +   - Line 23: Replace the value 0x80 with 0x8000. This change makes the bit field
    larger, which is something you’ll understand better after completing this chapter.


    Build Exercise 17-2. Run a few times to see what the bit field looks like for
    larger values.


    The binbin() function, or a variation of it, is used in the following sections
    to help describe binary programming. You will copy and paste that function frequently,
    and feel free to use it in your own code however you deem appropriate.


    # Bit Manipulation


    A smattering of C language operators provide data manipulation at the binary level.
    These operators are easy to ignore, but only when their true power and usefulness
    aren’t appreciated.


    # Using the bitwize | operator


    You’re familiar with the decision-making logical operators: && for AND and ||
    for OR. In the && evaluation, both items must be true for the statement to be
    evaluated as true; for the || evaluation, only one of the items must be true.


    At the atomic level, the operators & and | perform similar operations, though
    on a bit-by-bit basis. The net effect is that you can use the & and | operators
    to manipulate individual bits.


    The | is the bitwise OR operator, also known as the inclusive OR.


    The & is the bitwise AND operator.'
