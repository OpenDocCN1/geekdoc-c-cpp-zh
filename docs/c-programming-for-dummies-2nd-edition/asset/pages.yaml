    The switch item introduces the structure, which follows and is enclosed by a set
    of curly brackets. The structure must contain at least one case statement, though
    more than one case statement is required to make the thing useful.


    The switch statement contains an expression in parentheses. That expression must
    evaluate to a single value. It can be a variable, a value returned from a function,
    or a mathematical operation.


    A case statement is followed by an immediate value and then a colon. Following
    this statement are one or more statements. These statements are executed when
    the immediate value following case matches the switch statement’s expression.
    Otherwise, the statements are skipped and the next case statement is evaluated.


    The break keyword is used to flee the switch-case structure. Otherwise, program
    execution cascades through the structure.


    The default item ends the switch-case structure. It contains statements that are
    executed when none of the case statements match. If nothing is left to do, you
    may omit the default item from the switch-case structure.


    The case portion of a switch-case structure doesn’t make an evaluation. If the
    code needs multiple comparisons, use a multiple if-else type of structure instead.


    # Taking no breaks


    It''s possible to construct a switch-case structure with no break statements.
    Such a thing can even be useful under special circumstances, as shown in Listing
    8-9.


