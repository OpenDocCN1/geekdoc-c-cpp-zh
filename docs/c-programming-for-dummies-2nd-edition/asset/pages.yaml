- pgno: 443
  md: "# Conversion-character formatting\n\nThe options available for conversion characters\
    \ in C are extensive. The printf() man page lists many of them, with some requiring\
    \ a bit of experimentation to get them correct. Generally speaking, here's the\
    \ format for the typical conversion character:\n\n```\n%-pw .dn\n```\n\nOnly the\
    \ first and last characters are required: % is the percent sign that prefixes\
    \ all conversion characters, and n is the conversion character(s).\n\n+   - The\
    \ minus sign; works with the w option to right-justify output.\n+   \n+   p The\
    \ padding character, which is either zero or a space, when the w option is used.\
    \ The padding character is normally a space, in which case the p need not be specified.\
    \ When p is 0, however, the value is padded on the left with zeroes to match the\
    \ width set by the w option.\n+   \n+   w The width option; sets the minimum number\
    \ of positions in which the information is displayed. Output is right-justified\
    \ unless the – prefix is used. Spaces are padded to the left, unless the p value\
    \ specifies the character 0 (a zero).\n+   \n+   .d The dot, followed by a value,\
    \ d, that describes how many digits to display after the decimal in a floating-point\
    \ value. If d isn't specified, only the whole-number portion of the value appears.\n\
    +   \n+   n A conversion character, as shown in the table in this appendix. Or\
    \ it can be the percent sign (%), in which case a % appears in the output."
  merge: -1
  img_proc: true
- pgno: 444
  md: '# Appendix G


    # Order of Precedence


    +   - The order of precedence goes as shown in Table G-1 and is overridden by
    using parentheses. C always executes the portion of an equation in parentheses
    before anything else.

    +   - Incremented or decremented variables as lvalues (assigned to another value)
    operate left-to-right. So, ++var increments before its value is assigned; var++
    increments its value after it''s assigned. (See Table G-2.)

    +   - Associativity for the assignment operators moves right-to-left. For example,
    the operation on the right side of += happens first.

    +   - The order of precedence may also be referred to as the order of operations.


    TABLE G-1 Standard Operator Precedence


    | Operator(s) | Category | Description |

    |---|---|---|

    | () [] -> . (period) | Expression | Function arguments, arrays, pointer members
    |

    | ! ~ - + & ++ -- | Unary | Logical not, one''s complement, positive, negative,
    pointer, address-of, increment, decrement; operations right-to-left |

    | * / % | Math | Multiplication, division, modulo |

    | + - | Math | Addition, subtraction |

    | << >> | Binary | Shift left, shift right |

    | < > <= >= | Comparison | Less than, greater than, less than or equal to, greater
    than or equal to |

    | == != | Comparison | Is equal to, not equal to |

    | & | Binary | And |

    | ^ | Binary | Exclusive or (XOR) |

    | \| | Binary | Or |'
  merge: -1
  img_proc: true
- pgno: 445
  md: '# TABLE G-1 (continued)


    | Operator(s) | Category | Description |

    |---|---|---|

    | && | Logical | And |

    | || | Logical | Or |

    | ?: | Comparison | Ternary operator, associativity goes right-to-left |

    | = | Assignment | Variable assignment operator, including += and -= and all assignment
    operators |

    | , (comma) | (None) | Separates items in a for statement; precedence is left-to-right
    |


    # TABLE G-2 Pointers and Precedence


    | Expression | Address p | Value *p |

    |---|---|---|

    | p | Yes | No |

    | *p | No | Yes |

    | *p++ | Incremented after value is read | Unchanged |

    | *(p++) | Incremented after value is read | Unchanged |

    | (*p)++ | Unchanged | Incremented after it''s read |

    | *++p | Incremented before value is read | Unchanged |

    | *(++p) | Incremented before value is read | Unchanged |

    | ++*p | Unchanged | Incremented before it''s read |

    | ++(*p) | Unchanged | Incremented before it''s read |'
  merge: -1
