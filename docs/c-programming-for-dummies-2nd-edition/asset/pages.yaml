    # Editing a linked list


    Because a linked list is chained together by referencing memory locations, editing
    is done by modifying those memory locations. For example, in Figure 20-2, if you
    want to remove the third item from the list, you dodge around it by linking the
    second item to the fourth item. The third item is effectively removed (and lost)
    by this operation.


    Likewise, you can insert an item into the list by editing the next pointer from
    the previous structure, as illustrated in Figure 20-3.


    ![](img/dcc0cd79d4a45cfce24fa49d85442884_338_1.png)


