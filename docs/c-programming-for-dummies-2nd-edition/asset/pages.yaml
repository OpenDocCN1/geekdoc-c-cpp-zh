- pgno: 47
  md: 'Some functions are sent values, as in


    ```

    puts("Greetings, human.");

    ```


    Here, the string Greetings, human. (including the period) is sent to the puts()
    function, which sends the string to standard output (displayed on the screen).
    The double quotes define the string; they aren''t sent to standard output. The
    information in the parentheses is said to be the function''s arguments, or values.
    They are passed to the function.


    Functions can generate, or return, information as well:


    ```

    value = rand();

    ```


    The rand() function generates a random number, which is returned from the function
    and stored in the variable named value. Functions in C return only one value at
    a time. They can also return nothing. The function''s documentation explains what
    the function returns.


    Functions can also be sent information and return something:


    ```

    result = sqrt(256);

    ```


    The sqrt() function is sent the value 256. It then calculates the square root
    of that value. The calculation returned is stored in the result variable.


    ![](img/dcc0cd79d4a45cfce24fa49d85442884_47_0.png)


    +   - See the later section “Variables and values” for a discussion of what a
    variable is.

    +   - A function in C must be defined before it''s used. That definition is called
    a prototype. It''s necessary for the compiler to understand whether your code
    is properly using the function.

    +   - Lists of, and documentation for, all the C language functions is found online,
    in what are called C library references.

    +   - Library function prototypes are held in header files, which must be included
    in your source code. See the later section “Adding a function.”

    +   - The mechanics of the functions are stored in C language libraries. A library
    is a collection of functions and the code that executes those functions. When
    you link your program, the linker incorporates the functions'' object code into
    the final program.

    +   - As with keywords, function names are case-sensitive.'
