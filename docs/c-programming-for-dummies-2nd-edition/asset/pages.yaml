    # Separating files from directories


    Each file stored in a directory is classified by a file type or mode. For example,
    some entries in a directory listing are subdirectories. Other entries may be symbolic
    links or sockets. To determine which file is of which type, your code can examine
    the st_mode member of the stat structure.


    The st_mode value is a bit field — bits in this value are set depending on the
    various file type attributes and permissions applied to the file. To examine the
    bits, you use special macros made available in the dirent.h header.


    For example, the S_ISDIR macro returns TRUE when a file''s st_mode element indicates
    a directory, not a regular file. Use the S_ISDIR macro like this:


    ```

    S_ISDIR(filestat.st_mode)

    ```


    This expression evaluates TRUE for a directory, and FALSE otherwise.


    Exercise 23-4: Modify your solution to Exercise 23-3 so that any subdirectories
    listed are flagged as such. Because directories don''t generally have file sizes,
    specify the text <DIR> in the file size field for the program''s output.


    ![](img/dcc0cd79d4a45cfce24fa49d85442884_378_0.png)


    If the current directory lacks subdirectories, change the directory name in Line
    13.


    In Windows, use two backslashes when typing a path. For example:


    ```

    dhandle = opendir("\\Users\\Dan");

    ```


    Windows uses the backslash as a pathname separator. C uses the backslash as an
    escape character in a string. To specify a single backslash, you must specify
    two of them.'
