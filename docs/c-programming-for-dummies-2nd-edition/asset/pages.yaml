    # Chapter 19


    # Deep into Pointer Land


    It''s easy to accept what a pointer does, to numbly nod your head, to repeat the
    mantra, “A pointer is a variable that contains a memory location.” You can even
    memorize the difference between pointer variable p and pointer variable *p. But
    to truly know the power of the pointer, you have to discover how it''s fully exploited
    in the C language. You must eschew the old way of doing things and fully embrace
    pointers for the miraculous witchcraft they do.


    # Pointers and Arrays


    Arrays in the C language are nothing but a kettle full of lies! Truly, they don''t
    exist. As you discover the power of the pointer, you come to accept that an array
    is merely a cleverly disguised pointer. Be prepared to feel betrayed.


    # Getting the address of an array


    An array is a type of variable in C, one that you can examine for its size and
    address. Chapter 18 covers using the sizeof operator on an array. Now you uncover
    the deep, dark secret of beholding an array''s address.'
