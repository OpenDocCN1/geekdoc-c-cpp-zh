- pgno: 393
  md: '# Other Libraries to Link


    Throughout this book, your programs have linked in the standard C library. This
    process works automatically. It''s all that''s needed for the basic console applications
    in this book. When your programs require more sophistication, however, they can
    link in other libraries.


    If you''re coding something graphical, for example, you can link in a graphics
    library. Or, if you''re doing fancy console (text) programming, you can link in
    the NCurses library. These libraries, and the functions they include, greatly
    augment a program''s capabilities.


    A function''s documentation helps determine which libraries to use. For example,
    in Linux the pow() function''s man page has this note right up front:


    ```

    Link with -lm.

    ```


    This direction tells you to use the compiler''s command line -l (little L) switch
    immediately followed by m (little M) for the math library. This switch directs
    the linker to bring in the math library, without which you''d witness a flood
    of errors for unknown functions, like pow().


    Linking in a library is different from including a header file. The header file
    is handled by the #include directive. It contains prototypes, definitions, and
    other helpful information. But it''s the library that contains the gears that
    make the functions work.


    All C compilers link in the standard C library, called c. If another library needs
    to be linked in, it''s specified directly. The library must be available (on the
    local storage system), and you must know its location when using an IDE.


    For example, in Code::Blocks, a library is added by choosing Project-> Build Options
    and adding the library on the Linker Settings tab. You must know the library''s
    folder and its name to complete this task.


    At the command prompt, the -l (little L) switch is immediately followed by the
    library''s name. This switch might need to be specified as the last argument with
    certain compilers.'
  merge: -1
  img_proc: true
- pgno: 394
  md: 'The variety and purpose of the various libraries available to a C compiler
    depend on what you plan to do. C language library packages can be found for free
    and downloaded from the Internet. For example, a hardware manufacturer may provide
    a library you can use to program its specific device.


    ![](img/dcc0cd79d4a45cfce24fa49d85442884_394_0.png)


    +   - Libraries are linked in only when creating a Code::Blocks project. You cannot
    link in a library for an individual source code file.

    +   - Traditionally, C libraries are stored in the /usr/lib folder, though downloaded
    libraries might be found in /usr/local/lib or elsewhere. Command-line compilers
    automatically look in these locations.

    +   - The -L switch for a command-line compiler can be specified to direct the
    compiler to look in a specific folder for a library. For example:


    ```

    clang -L/usr/local/share/lib -lcompress main.c

    ```


    The preceding command directs the clang compiler to look in the /usr/local/share/lib
    folder for the compress library.'
  merge: -1
