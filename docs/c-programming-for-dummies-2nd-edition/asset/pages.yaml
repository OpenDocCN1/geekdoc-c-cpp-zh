  md: '# IN THIS CHAPTER


    +   - Checking for certain characters

    +   - Converting text characters

    +   - Manipulating strings

    +   - Working with conversion characters

    +   - Adjusting text output

    +   - Understanding stream input


    # Chapter 13


    # Fun with Text


    A string is a chunk of text. It''s a programming concept but also a basic part
    of all human communications. What a string isn''t, however, is a variable type
    in the C language; nope, a string is an array of char variables. This fact doesn''t
    make it less important. A lot of programming involves presenting text and manipulating
    strings. So, despite its not being invited to the official C language data type
    club, the string has lots of clout when it comes to writing programs.


    # Character Manipulation Functions


    At the heart of any string of text is the char variable. It''s a unique cubby
    hole, into which you stuff an integer from 0 through 255. This value is represented
    visually as a character — a symbol, squiggle, or whatsis, and the beloved alphabet
    you''ve been familiar with even before you learned to read.


    # Introducing the CTYPES


    The C language features a bevy of functions designed to test or manipulate individual
    characters. The functions are all defined in the ctype.h header file. Most programmers
    therefore refer to the functions as the CTYPE functions, where CTYPE is pronounced
    “see-type,” and not “stoor-ye,” which how a native Russian would read it.'
