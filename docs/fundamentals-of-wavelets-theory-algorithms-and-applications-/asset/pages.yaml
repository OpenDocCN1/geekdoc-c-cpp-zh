    # 8.5 LIFTING WAVELET TRANSFORM


    The lifting scheme [19] is an alternative approach to constructing wavelets and
    computing wavelet transform. Unlike the classical wavelet construction methods
    demonstrated in previous chapters that rely heavily on the Fourier transform,
    the lifting procedure for discrete'
  merge: -1
  img_proc: true
- pgno: 406
  md: 'wavelet transform and for wavelet construction is carried out entirely in the
    time domain. Instead of using the filter banks for decomposition and reconstruction
    of a signal, the lifting procedure uses three steps—namely, the split [S], the
    predict [P] and the update [U] to decompose a signal into approximation and wavelet
    coefficients $a_{k,S}$ and $w_{k,S}$. It eliminates the need for performing the
    convolution followed by decimation or interpolation followed by convolution in
    wavelet analysis of a signal. Instead of using the synthesis filters $g_0[k]$
    and $g_1[k]$ to derive the analysis filters $h_0[k]$ and $h_1[k]$, as shown in
    Chapter 6, the lifting algorithm can be used to construct the wavelet from coefficients
    resulting from the lifting process.


    The advantage of the lifting procedure is that the coefficients can be computed
    in place to minimize the storage requirement and the reconstruction phase can
    be carried out by running the decomposition process backward. The procedure eliminates
    the need for the Fourier transform as in the classical method for signal processing,
    and new wavelets are constructed out of the lifting process.


    In this section, we use the Haar wavelet to illustrate the decomposition of a
    signal. It proceeds in simple steps, with each step moving toward one-level lower
    in resolution. It computes the average and difference of adjacent signal values.
    Let $\{x(k)\}$ be a signal that has $2^n$ points. At some resolution $j + 1$,
    one decomposition step using Haar wavelet computes the average and difference
    of the adjacent signal value.'
