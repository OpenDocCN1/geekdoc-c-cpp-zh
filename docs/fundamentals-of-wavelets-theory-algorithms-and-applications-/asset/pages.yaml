  md: '# CHAPTER NINE


    # Digital Signal Processing Applications


    The introduction of wavelets to signal and image processing has provided engineers
    with a very flexible tool to create innovative techniques for solving various
    engineering problems. A survey of recent literature on wavelet signal processing
    shows the focus on using the wavelet algorithms for processing one-dimensional
    (1D) and two-dimensional (2D) signals. Acoustic, speech, music, and electrical
    transient signals are popular in 1D wavelet signal processing. The 2D wavelet
    signal processing mainly involves image compression and target identification.
    Problem areas include noise reduction, signature identification, target detection,
    signal and image compression, and interference suppression. We make no attempt
    to detail techniques in these areas; neither are we trying to provide the readers
    with processing techniques at the research level. Several examples are given in
    this chapter to demonstrate the advantages and flexibility of using wavelets in
    signal and image processing.


    In these examples, wavelet algorithms are working in synergy with other processing
    techniques to yield a satisfactory solution to the problem. Wavelet decomposition
    plays the vital role in separating the signal into components before other DSP
    techniques are applied. Algorithms include wavelet tree, wavelet-packet tree decomposition,
    2D wavelet or wavelet-packet tree decomposition, and pyramid or direction decomposition.
    In signature recognition and target detection, the'
  merge: -1
  img_proc: true
- pgno: 423
  md: 'corresponding reconstruction algorithm is not needed since the signal components
    are either destroyed or rendered useless after processing. In the last two examples,
    the orthogonality between wavelet packets is applied to multicarrier communication
    systems, and the wavelet algorithms are extended to the third dimension for 3D
    medical image visualization. We discuss the extension of the wavelet algorithms
    to wavelet-packet algorithms and their 2D versions before we discuss various application
    examples.


    # 9.1 WAVELET PACKET


    Because of the two-scale relation and the choice of the scale parameter $a = 2^j$,
    the hierarchical wavelet decomposition produces signal components whose spectra
    form consecutive octave bands. Figure 9.1 depicts this concept graphically. In
    certain applications, the wavelet decomposition may not generate a spectral resolution
    fine enough to meet the problem requirements. One approach is to use the CWT for
    obtaining the necessary finer resolution by changing the scale parameter $a$ with
    a smaller increment. This approach increases the computation load by orders of
    magnitude. Another approach was discussed in Chapter 8. The use of wavelet packets
    also helps avoid this problem. A wavelet packet is a generalization of a wavelet
    in that each octave frequency band of the wavelet spectrum is further subdivided
    into finer frequency bands by repeatedly using the two-scale relations. In other
    words, the development of wavelet packets is a refinement of wavelets in the frequency
    domain and is based on a mathematical theorem proven by Daubechies [1] (splitting
    trick). The theorem is stated as follows:'
  merge: -1
  img_proc: true
