    # 4.10 PROPERTIES OF WIGNER-VILLE DISTRIBUTION


    There are several general properties of WVD that are important for signal representation
    in signal processing. Some of them are discussed in this section. It has been
    shown [5] that the Wigner-Ville distribution has the highest concentration of
    signal energy in the time-frequency plane. Any other distribution that has a higher
    energy concentration than WVD will be in violation of the uncertainty principle.
    Furthermore, it cannot satisfy the so-called marginal properties discussed in
    this section.


    # 4.10.1 A Real Quantity


    The Wigner-Ville distribution is always real, regardless of whether the signal
    is real or complex. This can be seen by'
