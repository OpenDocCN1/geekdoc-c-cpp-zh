  md: 'In the previous chapters we described wavelets and scaling functions defined
    on the real line. If we use these functions directly to expand the unknown function
    of an integral equation, then some of the scaling functions and wavelets will
    have to be placed outside the domain of integration, thus necessitating the explicit
    enforcement of the boundary conditions. In signal processing, uses of these wavelets
    lead to undesirable jumps near the boundaries (see Figures 8.8-8.10). We can avoid
    this difficulty by periodizing the scaling function as [31]


    \(\phi_{k,s}^p := \sum_{\ell} \phi_{k,s}(x + \ell),\) (10.56)


    where the superscript \(p\) implies periodic case. Periodic wavelets are obtained
    similarly. It is easy to show that if \(\hat{\phi}(2\pi k) = \delta_{k,0}\), which
    is generally true for the scaling functions, then \(\sum_k \phi(x-k) = 1\). If
    we apply the last relation, which (as discussed in Chapter 5) is also known as
    the partition of unity to (10.56), we can show that \(\{\phi_{0,0}^p\} \cup \{
    \psi_{k,s}^p, s \in Z^+ := \{0, 1, 2, ...\}, k = 0, ..., 2^s - 1 \}\) generates
    \(L^2([0, 1])\).


    The idea of periodic wavelets has been used [18-20]. However, as mentioned in
    [31], unless the function that is being approximated by the periodized scaling
    functions and wavelets is already periodic, we still have edge problems at the
    boundaries. Therefore, we follow a different approach to account for the boundary
    effects. We apply the compactly supported s.o. spline wavelets [23, 32,'
