  md: 'Let us go back to Figure 5.1. Every time we go down one level by doubling the
    step size, we remove certain portions of the function, shown on the right-hand
    side plots. Then there are the "leftover" parts that are further decomposed. In
    Figure 5.1, we will assign all the functions on the left-hand side to \(\mathbf{A}_s\)
    and the ones on the right-hand side to \(\mathbf{W}_s\), where \(s\) represents
    individual scales. Let \(\mathbf{A}_s\) be generated by the bases \(\{\phi_{k,s}
    : 2^{s/2}\phi(2^st - k) ; k \in \mathbb{Z}\}\) and \(\mathbf{W}_s\) by \(\{\psi_{k,s}
    : 2^{s/2}\psi(2^st - k) ; k \in \mathbb{Z}\}\). In other words, any function \(x_s(t)\)
    and \(y_s(t)\) can be represented as the linear combinations of \(\phi_{k,s}(t)\)
    and \(\psi_{k,s}(t)\), respectively.


    Observe that both the functions \(x_{s-1}(t) \in \mathbf{A}_{s-1}\) and \(y_{s-1}(t)
    \in \mathbf{W}_{s-1}(t)\) are derived from \(x_s \in \mathbf{A}_s\). Therefore,
    we should expect that the bases \(\phi_{k,s-1}\) of \(\mathbf{A}_{s-1}\) and \(\psi_{k,s-1}\)
    of \(\mathbf{W}_{s-1}\) should somehow be related to the bases \(\phi_{k,s}\)
    of \(\mathbf{A}_s\). Such a relationship will help in devising an algorithm to
    obtain the functions \(x_{s-1}\) and \(y_{s-1}\) from \(x_s\) more efficiently.


    To achieve a multiresolution analysis of a function as shown in Figure 5.1, we
    must have a finite-energy function \(\phi(t) \in L^2(\mathbb{R})\), called a scaling
    function, that generates a nested sequence \(\{A_j\}\), namely


    \(\{0\} \leftarrow \cdots \subset \mathbf{A}_{-1} \subset \mathbf{A}_0 \subset
    \mathbf{A}_1 \subset \cdots \rightarrow L^2,\)


    and satisfies a dilation (refinement) equation


    \(\phi(t) = \sum_k g_0[k] \phi(at - k)\)'
