  md: '# 9.8.6 Generalized Self-Similarity Tree (GST)


    Based on the SOT, a generalized self-similarity tree (GST) coding algorithm has
    been constructed that can handle images of any size and any gray level [18]. In
    the GST, the wavelet decomposition/reconstruction algorithm with boundary reflection
    techniques is used so that perfect reconstruction can be achieved. Analysis of
    the GST coder shows results comparable to the original SOT coder for images of
    dyadic size, and it even outperforms the SOT for images of nondyadic size.


    # 9.9 MICROCALCIFICATION CLUSTER DETECTION


    The majority of early breast cancers are indicated by the presence of one or more
    clusters of microcalcifications on a mammogram. Although breast cancer can be
    fatal, women have one of the highest chances of survival among cancer types if
    the tumors can be detected and removed in an early stage. Thus the detection of
    microcalcifications with minimal false positive rates is critical to screening
    mammograms. Microcalcifications are small deposits of calcium phosphate hydroxyde
    in breast tissue with sizes raging from .05 to 1.0 mm in diameter that appear
    as bright specks on photonnegative x-ray film [19]. They are difficult to detect
    because they vary in size and shape and are embedded in parenchymal tissue structures
    of varying density [20].


    Screening mammograms have been one of the main thrusts in the healthcare program
    of the United States. However, even partial compliance with the rule set by the
    ACR would produce a huge volume of data to be read by a'
  merge: -1
  img_proc: true
- pgno: 487
  md: 'limited number of radiologists. Consequently, human error can run the percentages
    of false negatives (a true target missed) up to 20% [21]. If a computer-aided
    diagnostic (CAD) algorithm were designed and constructed, it could serve as a
    second opinion to help the radiologist by pointing out suspicious regions in the
    mammogram needing a more detailed diagnostic screening. This application example
    attempts to show how a 2D wavelet pyramid algorithm working in conjunction with
    other image-processing techniques can identify the microcalcifications in mammograms
    and localize the suspicious regions.


    # 9.9.1 CAD Algorithm Structure


    Success in signature recognition greatly depends on the features one can extract
    from a signature. The more distinct the features, the higher the success rate
    for making a positive identification. The most important objective in the detection
    and recognition of microcalcifications is to remove the background noise and enhance
    the object to be identified. We use several traditional image-processing techniques
    to work with the wavelet decomposition algorithm to achieve this objective. Decision-making
    rules in some of these algorithms are goal oriented and therefore are problem
    dependent. Parameter choices often depend on the data to be analyzed. The CAD
    algorithm for microcalcification cluster detection in a highly textured and cluttered
    background is illustrated in Figure 9.30. The image-processing techniques used
    in this CAD algorithm include nonlinear image enhancement, wavelet pyramidal and
    directional image decomposition and reconstruction, wavelet coefficient domain
    operations, dark pixel removal,'
  merge: -1
  img_proc: true
- pgno: 488
  md: 'constant false alarm rate (C-FAR) type adaptive thresholding, adaptive resonance
    theory clustering, and false cluster discrimination.


    # FIGURE 9.30: Block diagram of the microcalcification cluster detection algorithm.


    ![](img/f73ae67732328dc36596b27ffe8d0152_488_0.png)


    # 9.9.2 Partitioning of Image and Nonlinear Contrast Enhancement


    We partition the mammogram to be analyzed by simply dividing the image into a
    number of equal-size subimages. In this case, the size of the mammogram is 1024
    × 1024, and we divide it up in to 64 subimages of size 128 × 128. Each partitioned
    subimage is separately processed to bring out locally significant details of the
    input image with image contrast enhancement. This step provides better'
  merge: -1
  img_proc: true
- pgno: 489
  md: 'localization for detection of the targets. Since wavelet processing is known
    to handle the image boundary better than DCT, we are ensured that information
    is not lost in the partitioning. We use a cubic mapping to suppress pixels with
    low gray scale values and enhance pixels with large gray scale values.


    # 9.9.3 Wavelet Decomposition of the Subimages


    We decompose each subimage using the wavelet decomposition algorithm so that the
    high frequency components of the subimage are singled out. There are many choices
    of wavelets in this applications. We chose the Haar wavelet after examining all
    of Daubechies’ orthogonal and biorthogonal wavelets and the Coiflets’, because
    the spatial domain window of the Haar wavelet is very small for better spatial
    localization. Higher-order wavelets tend to average and blur the high-frequency
    information to produce a low-amplitude wavelet coefficient.


    Two types of wavelet MRA tree decompositions are applied simultaneously to the
    same subimage—namely, the pyramidal and directional decompositions. The pyramidal
    MRA decomposes only the subband image obtained through the LL-subband in the column
    and row direction at each level of resolution (LOR). The directional MRA, on the
    other hand, decomposes images in only one direction. The decomposition wavelet
    coefficient maps of these two MRA trees are shown in Figures 9.31 and 9.32.


    FIGURE 9.31: Hierarchical wavelet decomposition of a segmented mammogram.'
