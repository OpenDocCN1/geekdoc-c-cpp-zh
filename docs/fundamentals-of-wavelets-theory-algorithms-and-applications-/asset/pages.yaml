  md: '# Wavelet Feature Extraction


    +   1. Perform the discrete wavelet decomposition on the signal (DWT) to the 12th
    level of resolution.


    +   2. From the wavelet coefficients of each of the 12 resolution and approximation
    coefficients, compute the average energy content of the coefficients at each resolution.
    There are a total of 13 subbands (12 wavelet subbands and one approximation subband)
    from which features are extracted. The ith element of a feature vector is given
    by


    ```

    $v_i^{dwt} = \frac{1}{n_i} \sum_{j=1}^{n_i} w_{i,j}^2, \quad i=1,2,\dots, 13,$

    (9.21)

    ```


    where $n_1 = 2^{11}, n_2 = 2^{10}, n_3 = 2^9, \dots, n_{12} = 2^0, n_{13} = 2^0$;
    $v_i^{dwt}$ is the ith feature element in a DWT feature vector; $n_i$ is the number
    of samples in individual subband; and $w_{i,j}^2$ is the jth coefficient of the
    ith subband. As a result, a DWT feature vector is formed as given by


    ```

    $\Psi^{dwt} = \{v_1^{dwt}, v_2^{dwt}, \dots, v_{13}^{dwt} \}^t.$

    (9.22)

    ```


    # Wavelet Packet Feature Extraction


    +   1. Perform the wavelet packet multiresolution analysis to the fifth level
    of resolution to obtain 32 subbands.'
  merge: -1
  img_proc: true
- pgno: 448
  md: 'Each subband contains a total of 128 wavelet packet coefficients.


    +   2. From each subband at the fifth level of resolution, compute the average
    energy content in the wavelet packet coefficients such that


    (9.23) \(v_i^{wp} = \frac{1}{n_i} \sum_{j=1}^{n_i} p_{i,j}^2, \quad i = 1, 2,
    ..., 32, \text{and } n_i = 128, \quad \forall i,\)


    where \(v_i^{wp}\) is the \(i\)th feature in a wavelet packet feature vector;
    \(n_i\) is the number of sample in each subband; and \(p_{i,j}\) is the \(j\)th
    wavelet packet coefficient in the \(i\)th subband. The WP feature vector is represented
    as follows:


    (9.24) \(v^{wp} = \{v_1^{wp}, v_2^{wp}, ..., v_{13}^{wp}\}^t\)


    # Spectral Feature Extraction


    We also use the traditional FFT approach to solve this problem for the sake of
    comparison. The FFT feature vectors are constructed following the same pattern.


    +   1. From the \(2^{12}\) data points, we compute the FFT and take only the positive
    frequency information represented by \(2^{12}\) spectral coefficients.'
