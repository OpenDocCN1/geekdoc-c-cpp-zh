    # 10.2 METHOD OF MOMENTS


    Method of moments [7] is probably the most widely used technique for solving integral
    equations in electromagnetics. In conventional MoM, the boundary of integration
    is approximated by discretizing it into many segments. Then the unknown function
    is expanded in terms of known basis functions with unknown coefficients. These
    bases may be “global” (entire domain), extending the entire length [$a, b$], or
    they may be “local” (subdomain), covering only a small segment of the interval,
    or a combination of both. Finally, the resultant equation is tested with the same
    or different functions, resulting in a set of linear equations whose solution
    gives the unknown coefficients.


    The unknown function $f(x)$ can be written as


    ```

    $f(x) = \sum_n c_n \Lambda_n(x)$

    (10.15)

    ```


    where {\(\Lambda_n\)} form a complete set of basis functions. For an exact representation
    of $f(x)$ we may need an infinite number of terms in the above series. However,
    in practice,'
