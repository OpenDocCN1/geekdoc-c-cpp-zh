    is approximately analytic—that is, \(\psi_g(t)\) is approximately the Hilbert
    transform of \(\psi_h(t)\). The dual-tree approach comes very close to mirroring
    the properties of the Fourier transform.


    The filters are all real-valued so that there is no complex processing in the
