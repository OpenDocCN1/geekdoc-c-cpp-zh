    # 5.5 SPLINE FUNCTIONS AND PROPERTIES


    One of the most basic building blocks for wavelet construction involves cardinal
    B-splines. A complete coverage of spline theory is beyond the scope of this book.
    In this section, we describe briefly spline functions and their properties that
    are required to understand the topics of this book. Further details are available
    in many excellent books (e.g., [4–8]).


    Spline functions consist of piecewise polynomials (see Figure 5.5) joined together
    smoothly at the break points (knots: $t_0, t_1, \dots$), where the degree of smoothness
    depends on the order of splines. For cardinal B-splines, these break points are
    equally spaced. Unlike polynomials, these form local bases and have many useful
    properties that can be applied to function approximation.


    FIGURE 5.5: Piecewise polynomial functions.'
