- pgno: 394
  md: 'Since edges in an image are usually not straight lines, it is difficult to
    apply the ridgelet directly to an image with curvilinear objects and expect good
    detection results. However, the curve edge can be subdivided into smaller segments
    that can be approximated by straight edges. The first-generation curvelet algorithm
    starts with an overcomplete wavelet transform (that is without down-sampling)
    that produces J + 1 size n × n subimages given by


    ```

    $f(j, k) = a_J(j, k) + \sum_{m=1}^{J} w_m(j, k)$,

    ```


    where the $a_J(j, k)$ is the coarse image after being low-pass filtered $J$ times
    and $w_n(j, k)$ is the $n$th wavelet (high-pass) filtered image. That is


    ```

    $a_t(j, k) - a_{t-1}(j, k) = w_{t-1}(j, k)$.

    ```


    Each of these collection of subimages are partitioned into small block images,
    where the discrete ridgelet transform (DRT) is applied to locate the “approximately
    straight” edges. The results are then combined to obtain the curvelet transform
    of an image. Typical curvelets constructed by Starck, Candes, and Donoho [13]
    are shown in Figure 8.23.


    # **FIGURE 8.23:** Examples of curvelets at different scales, orientations, and
    locations.'
  merge: -1
