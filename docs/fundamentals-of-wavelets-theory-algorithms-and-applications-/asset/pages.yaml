- pgno: 183
  md: '# Multiresolution Analysis


    Multiresolution analysis (MRA) forms the most important building block for the
    construction of scaling functions and wavelets (Chapter 6) and the development
    of algorithms (Chapters 7 and 8). As the name suggests, in multiresolution analysis,
    a function is viewed at various levels of approximations, or resolutions. The
    idea was developed by Meyer [1] and Mallat [2, 3]. By applying the MRA we can
    divide a complicated function into several simpler ones and study them separately.
    To understand the notion of MRA, let us consider a situation in which a function
    consists of slowly varying and rapidly varying segments, as illustrated in Figure
    5.1. If we want to represent this function at a single level of approximation,
    we have to discretize it using step size (h), determined by the rapidly varying
    segment. This leads to a large number of data points. By representing the function
    using several discretization steps (resolutions) we can significantly reduce the
    number of data points required for accurate representation. The coarsest approximation
    of the function together with the details at every level completely represent
    the original function. Observe that with every level (scale), the step size is
    doubled. This corresponds to “octave level” representation, familiar in audio
    signal processing. In addition to this specific example, there are many situations
    in signal processing as well as in computational electromagnetics in which multiresolution
    analysis can be very useful.'
  merge: -1
  img_proc: true
- pgno: 184
  md: '# FIGURE 5.1: Multilevel representation of a function.


    ![](img/f73ae67732328dc36596b27ffe8d0152_184_0.png)


    In this chapter we begin with an understanding of the requirements of MRA. Two-scale
    relations and decomposition relations are explained. Cardinal B-splines, discussed
    in Section 5.5, generate an MRA and form the basis of most of the wavelets discussed
    in this book and elsewhere. Finally, in Section 5.6 we discuss how to map a given
    function into an appropriate subspace before starting an MRA.


    # 5.1 MULTIRESOLUTION SPACES'
