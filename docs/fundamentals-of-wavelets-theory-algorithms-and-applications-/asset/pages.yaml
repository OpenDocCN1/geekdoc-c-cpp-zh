  md: '2. We divide the spectrum into 32 nonoverlapping bands with equal width. From
    each band, we compute the average energy contained in the coefficients. The feature
    element becomes


    (9.25) \( v_i^{(ff)} = \frac{1}{n_i} \sum_{j=1}^{n_i} s_{i,j}^2, \quad i = 1,
