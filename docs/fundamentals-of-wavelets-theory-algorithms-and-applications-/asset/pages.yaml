    vector \(\mathbf{y} = A\mathbf{x} \in V\). The vector \(\mathbf{y}\), in general,
    is a scaled, rotated, and translated version of \(\mathbf{x}\). In particular,
    if the output vector \(\mathbf{y}\) is only a scalar multiple of the input vector,
    we call this scalar the eigenvalue and the system an *eigensystem*. Mathematically,
    we write


