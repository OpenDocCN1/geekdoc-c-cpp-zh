    # 9.10 MULTICARRIER COMMUNICATION SYSTEMS (MCCS)


    Multicarrier modulation is the principle of transmitting data by dividing the
    data stream into several parallel bitstreams, each of which has a much lower bit
    rate. Each of these substreams modulates an individual carrier. Figure 9.33 shows
    the block diagram of the transmitter of a multicarrier communication system. A
    serial-to-parallel buffer segments the information sequences into frames of \(N_f\)
    bits. The \(N_f\) bits in each frame are parsed into \(M\) groups, where the \(i\)th
    group is assigned \(n_i\) bits so that


    ```

    $$\sum_{i=0}^{M-1} n_i = N_f.$$

    (9.48)

    ```'
  merge: -1
  img_proc: true
- pgno: 498
  md: 'It is convenient to view the multicarrier modulation as having \( M \) independent
    channels, each operating at the same symbol rate \( 1/T \). The data in each channel
    are modulated by a different subcarrier. We denote the signal input to the subchannels
    by \( S_i, i = 0, \dots, M-1 \). To modulate the \( M \) subcarriers, we use an
    orthogonal basis \( \Phi = \{\phi_i^k\}_{k=0}^{M-1} \), such that


    \(\langle \phi_m, \phi_l \rangle = \epsilon \delta_{m,l}\)


    # 9.10.1 OFDM Multicarrier Communication Systems


    Orthogonal frequency division multiplexing (OFDM) is a special form of MCCS with
    densely spaced subcarriers and overlapping spectra. It abandons the use of steep
    bandpass filters that completely separate the spectra of individual subcarriers.
    Instead, OFDM time-domain waveforms are chosen such that mutual orthogonality
    is ensured, even though subcarrier spectra may overlap. OFDM is more robust against
    time-domain impulse interference due to its long symbol time, which tends to average
    out the effects. OFDM subcarriers may lose their mutual orthogonality if high-frequency
    errors occur in the channel. As shown in Figure 9.35, the operating principle
    is simple. The data are transmitted on several subcarriers. The spectra of the
    subcarriers may overlap, but the mutual orthogonality is ensured. These subcarrier
    are summed together and transmitted over the channel. On the receiver end of the
    channel, the received signal is sent in parallel to the matched filters in each
    subchannel. The output of the matched filter is sampled before the decision is
    made on'
  merge: -1
  img_proc: true
- pgno: 499
  md: 'the signal. In general, each subchannel uses the binary phase-shift key (BPSK)
    scheme [23] to represent the signal.


    # FIGURE 9.35: A multicarrier communication system: (a) transmitter, (b) receiver.


    ![](img/f73ae67732328dc36596b27ffe8d0152_499_0.png)'
  merge: -1
  img_proc: true
- pgno: 500
  md: 'When the channel behaves well and does not introduce frequency dispersion,
    the bit error rate (\(P_e\)) is very small. The imperfection may be due to noise
    in the channel. On the other hand, when frequency dispersion is present due to
    time variation of the channel parameter, the \(P_e\) increases. Phase jitters
    and receiver frequency offsets introduce interchannel interferences that degrade
    the \(P_e\).


    # 9.10.2 Wavelet Packet-Based MCCS


    Instead of sine or cosine functions used in the OFDM, the WP-based MCCS uses different
    wavelet packets as the time-domain waveforms. If the approximation function \(\phi\)
    generates an orthonormal set in the \(L^2\) space, the corresponding wavelet packets
    are guaranteed to be orthogonal. The subcarriers are now wavelet packets, and
    the matched filters in the receiver are designed accordingly (Figure 9.36). Since
    there are a large number of wavelet packets to be chosen for the subcarriers,
    our experiment chooses those whose spectra are very close to those of the OFDM.
    Under this condition, we can make a fair comparison between the results of these
    two systems.


    **FIGURE 9.36:** A WP multicarrier communication system: (a) transmitter, (b)
    receiver.'
