    # 9.12.3 Reservoir Data Analysis


    Reservoir properties are measured by many sensors and at different resolutions,
    resulting in a large volume of data that need to be analyzed. Such analysis is
    important for better reservoir characterization, management, risk'
  merge: -1
  img_proc: true
- pgno: 520
  md: 'assessment, and key business decision. Conventional Fourier-based methods such
    as spectral and geostatistical methods prove to be ineffective because they lack
    the properties for localizing the isolated discontinuities such as faults, fractures,
    high-permeability streaks, and changes in geologic facies in reservoir rocks.
    Since the wavelet transforms provide localization in spatial and spatial frequency
    domains, they are well suited for analyzing nonstationary data. A discrete data
    set may be transformed into a family of data sets at different resolutions and
    spectral bands. They provide information of the structure at different scales
    and show the locations of sharp change in the data.


    As mentioned before, rock properties are measured by different sensors and resolutions.
    One problem that is often encountered in reservoir model is estimating rock properties
    from geological data at fine scale. Reservoirs are inherently heterogeneous with
    multiphase fluid. Wavelet methods provide a computationally efficient and accurate
    approach for generating equivalent rock and fluid properties under various geological
    and flow conditions [29]. Panda et al. [32] have addressed the issues of data
    parameter estimation and scale change in reservoir characterization. They have
    considered both 1D and 2D data using the discrete wavelet transform as well as
    wavelet packet transform to compare results. Wavelet transform is applied to permeability
    data to demonstrate scaling of permeability, removal of noise, and edge detection.


    In reservoir description, history matching can lead to nonunique and geologically
    unrealistic property'
  merge: -1
  img_proc: true
- pgno: 521
  md: 'distribution. Shani and Horne [41] have proposed a wavelet-based algorithm
    that integrates information from various sources to improve reservoir description.


    # 9.12.4 Downhole Pressure Gauge Data Analysis


    Downhole gauges for pressure and temperature are commonly used in oil and gas
    wells to understand dynamic behavior of the field and to monitor reservoir condition
    and performance. Long-term data from permanent gauges are different from short-term
    pressure transient data in several aspects. Long-term data give insights on changes
    of reservoir behavior as the reservoir is produced. It provides a four-dimensional
    look at the reservoir information instead of a glimpse in time. These long-term
    data require special handling and interpretation. A number of papers [31, 34,
    36, 45, 47, 49] deal with application of wavelets to downhole pressure data. Most
    of these methods involve following major steps:


    +   1. Outlier removal. Outliers in long-term data can be detected and effectively
    removed using denoising techniques. The outlier detection framework can be applied
    to any type of data, such as geostatistical data.


    +   2. Denoising. The wavelet thresholding method is useful for data denoising.
    Data should be denoised before identifying the transients. Results using denoised
    data appear to be more reliable and robust.


    +   3. Transient identification. The transient identification algorithm can effectively
    locate the start of new transients. The approach is to identify the intermediate'
  merge: -1
  img_proc: true
- pgno: 522
  md: 'resolutions at which the noise singularities have disappeared while the signal
    singularity is still present.


    4. Data reduction. Permanent pressure gauge data are usually enormous due to the
    long recording time. The pressure data may not change for a long period of time.
    The data reduction algorithm selects only the data that exceed a predetermined
    threshold.


    5. Flow history reconstruction. Using a nonlinear regression model, the flow rate
    history is successfully reconstructed by assuming unknown model parameters and
    matching the pressure response constrained to known flow rates and production
    data.


    6. Behavioral filtering. The behavioral filtering process intends to eliminate
    aberrant transients from the data. It can be very effective in reducing the uncertainties
    in the nonlinear regression. Filtering can be carried out by comparing the variance
    aberrant transients to the average variance of the overall data.


    7. Data interpretation: Due to the variation of the reservoir properties over
    long duration of the monitoring, a constant data window for analysis may not fit
    the acquired data. A moving window analysis can account for gradual changes in
    reservoir parameters. Otherwise, the estimates of model parameters in that data
    region may not be accurate. The moving window analysis provides parameter distributions
    that capture some of the uncertainties that may be useful in assessing uncertainties
    in subsequent analysis and predictions. It can also be used in reservoir characterization.'
  merge: -1
  img_proc: true
