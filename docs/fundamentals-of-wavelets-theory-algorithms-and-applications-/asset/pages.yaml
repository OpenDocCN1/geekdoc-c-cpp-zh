  md: 'The eigenvalue method converts the two-scale relation into an eigen-equation.
    Let us consider the two-scale relation by setting x = n to yield the following
    matrix equation:


    ```

    \phi(n) = \sum_k g_0[k] \phi(2n-k)

    = \sum_m g_0[2n-m] \phi(m)

    = [g_0(n, m)] \phi(m)

    (6.98)

    ```


    where the matrix element \(g_0(n, m) = g_0(2n - m)\). In matrix form, we write
    (6.98) as


    ```

    \begin{bmatrix} \ddots & \vdots & \vdots & \vdots & & \ddots \\ \dots & g_0[0]
    & g_0[-1] & g_0[-2] & \dots & \dots \\ \dots & g_0[2] & g_0[1] & g_0[0] & \dots
    & \dots \\ \dots & g_0[4] & g_0[3] & g_0[2] & \dots & \dots \\ & \vdots & \vdots
    & \vdots & & \ddots \end{bmatrix} \begin{bmatrix} \vdots \\ \phi(0) \\ \phi(1)
    \\ \phi(2) \\ \vdots \end{bmatrix} = \begin{bmatrix} \vdots \\ \phi(0) \\ 1 \\
    \phi(1) \\ \phi(2) \\ \vdots \end{bmatrix}

    ```


    The eigenvalue of this eigenvector is 1, so we can compute \(\phi(n)\) for all
    integer n. This procedure can be repeated for a twofold increase in resolution.
    Let \(x = n/2\) , and the two-scale relation becomes


    ```

    \(\phi\left(\frac{n}{2}\right) = \sum_k g_0[k] \phi(n-k).\)

    (6.99)

    ```'
