    # 7.8.1.3 Biorthogonal Filter Bank.


    A linear phase FIR filter bank is desirable because it minimizes phase distortion
    in signal processing. On the other hand, an orthogonal FIR filter bank is also
    desirable because of its simplicity. One has to design only one filter—namely,
    \( H_0(z) \), and all other filters in the entire bank are specified. Biorthogonal
    filter banks are designed to satisfy the linear phase requirement.


    Let us recall the PR condition and the antialiasing condition on the synthesis
