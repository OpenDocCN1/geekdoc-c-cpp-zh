    The filter sets {h0(n), h1(n)} and {g0(n), g1(n)} individually satisfy the perfect
    reconstruction (PR) condition. They are the processing filters for the wavelet
    ψ(t) and ψg(t), respectively. The filters are jointly designed such that the complex
    wavelet'
