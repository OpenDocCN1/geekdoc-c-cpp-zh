    # 4.2 SHORT-TIME FOURIER TRANSFORM


    In the beginning of this chapter we indicated that we could obtain the approximate
    frequency contents of a signal \(f(t)\) in the neighborhood of some desired location
    in time, say \(t = b\), by first windowing the function using an appropriate window
    function \(\phi(t)\) to produce the windowed function \(f_b(t) = f(t)\phi(t -
    b)\) and then taking the Fourier transform of \(f_b(t)\). This is the short-time
    Fourier transform (STFT). Formally, we can define the STFT of a function \(f(t)\)
    with respect to the window function \(\phi(t)\) evaluated at the location \((b,
    \zeta)\) in the time-frequency plane as


    ```

    (4.7) \(G_\phi f(b, \zeta) := \int_{-\infty}^{\infty} f(t) \overline{\phi_{b,\zeta}}
    dt\)

    ```


