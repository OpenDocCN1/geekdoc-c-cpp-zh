  md: '33], which are specially constructed for the bounded interval [0, 1]. Other
    ways of obtaining intervalic wavelets are described in [34, 35].


    As we discussed in Chapter 5, splines for a given simple knot sequence can be
    constructed by taking piecewise polynomials between the knots and joining them
    together at the knots in such a way as to obtain a certain order of overall smoothness.
    For instance, consider a knot sequence {0, 1, 2, 3, 4}. With this sequence we
    can construct the cubic spline (m = 4) by taking polynomials of order 4 between
    knots, such as [0, 1), [1, 2), ..., and joining them together at 1, 2, and 3 so
    that the resultant function (cubic spline) is in C^2—that is, up to its second
    derivative is continuous in [0, 4]. In general, cardinal B-splines of order m
    are in C^{m-2}. However, if we have multiple knots, say for example {0, 0, 1,
    2, 3}, then the smoothness at the point with multiple knots decreases. It is easy
    to verify that the smoothness decreases by r - 1 at a point with r-tuple knots.
    Observe that at the boundary points 0 and 1, the knots coalesce and form multiple
    knots. Inside the interval, though, the knots are simple, and hence the smoothness
    remains unaffected.


