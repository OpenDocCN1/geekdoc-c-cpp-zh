- pgno: 507
  md: '# 9.11.2 Rendering Techniques


    Rendering is the process of generating images using computers. In data visualization,
    our goal is to transform numerical data into graphical data, or graphical primitives,
    for rendering.


    Traditional techniques assumed that when an object was rendered, the surfaces
    and their interactions with light were viewed. However, common objects such as
    clouds and fog are translucent and scatter light that passes through them. Therefore,
    for proper rendering, we need to consider the changing properties inside the object.


    When we render an object using surface rendering techniques, we mathematically
    model the object with a surface description such as points, lines, triangles,
    polygons, or surface splines. The interior of the object is not described or is
    only implicitly represented by the surface representation.


    One of the key developments in volume visualization of scalar data was the marching
    cubes algorithm of Lorenson and Cline [24]. The basic assumption of this technique
    and its higher-dimensional counterparts is that a contour can pass through a cell
    in only a finite number of ways. A case table is constructed that enumerates all
    possible topological states of a cell, given combinations of scalar values at
    the cell points. The number of topological states depends on the number of cell
    vertices, and the number of inside/outside relationships a vertex can have with
    respect to the contour value. A vertex is considered to be inside a contour if
    its scalar value is larger the scalar value of the'
  merge: -1
  img_proc: true
- pgno: 508
  md: 'contour line. Vertices with scalar values less than the contour value are said
    to be outside the contour. For example, if a cell has four vertices and each vertex
    can be either outside or inside the contour, there are 2^4 = 16 possible ways
    that contour lines can pass through the cell. There are 16 combinations for a
    square cell, but these can be reduced to four cases by using symmetry (Figure
    9.40). Once the proper case is selected, the location of the contour-cell edge
    intersection can be calculated using interpolation. The algorithm processes a
    cell and then moves or marches to the next cell. After all cells are visited,
    the contour will be complete. (Note: The dotted line in Figure 9.40 indicates
    a contouring ambiguity.)


    # FIGURE 9.40: Inside/outside relationship of a square whose vertices have numerical
    value either higher or lower than a set threshold.


    ![](img/f73ae67732328dc36596b27ffe8d0152_508_0.png)


    ○ = Less than iso-value of interest

    ● = Greater than iso-value of interest


    In summary, the marching algorithm proceeds as follows:


    +   1. Select a cell.

    +   2. Calculate the inside/outside state of each vertex of the cell.'
  merge: -1
  img_proc: true
- pgno: 509
  md: '+   3. Create an index by storing the binary state of each vertex in a separate
    bit.


    +   4. Use the index to look up the topological state of the cell in a case table.


    +   5. Calculate the contour locations for each edge in the case table.


    # 9.11.3 Region Of Interest


    Due to the localized nature of wavelets in frequency and space domains, Region
    of interest refinement can be achieved by adding details in only the regions required.
    Figure 9.41 shows the ROI in the original image and in the wavelet domain for
    two levels of decomposition. Thus wavelets can be useful tool for compression
    as the image can be approximated by first reconstructing the low-pass coefficients
    and the detail can be restored to the ROI solely by transmitting the appropriate
    high-pass coefficients in the ROI. The results of this volume rendering using
    a 3D wavelet algorithm are shown in Figures 9.42-9.44.


    **FIGURE 9.41:** The Region of interest (ROI) (a) in the original image and (b)
    in subimages.'
