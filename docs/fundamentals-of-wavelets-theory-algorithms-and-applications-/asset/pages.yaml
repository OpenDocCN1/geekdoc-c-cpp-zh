    # 6.6 GRAPHICAL DISPLAY OF WAVELET


    Many wavelets are mathematical functions that may not be described analytically.
    For examples, the Daubechies compactly supported wavelets are given in terms of
    two-scale sequences and the spline wavelets are described in terms of infinite
    polynomials. It is difficult for the user to visualize the scaling function and
    the wavelet based on parameters and indirect expressions. We describe three methods
    here to display the graph of the scaling function and the wavelet.


