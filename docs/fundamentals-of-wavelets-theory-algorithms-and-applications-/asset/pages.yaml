  md: 'are exactly the same. We would like to point out several fundamental differences
    between the two disciplines.


    +   1. Processing domain. Let us represent an analog signal \(f(t) \in L^2\) by
    an orthonormal wavelet series


    ```

    \(f(t) = \sum_k \sum_s w_{k,s} \Psi_{k,s}(t).\)

    ```


    The coefficients \(w_{k,s}\) are computed via the inner product


    ```

    \(w_{k,s} = \langle f(t), \Psi_{k,s}(t) \rangle.\)

    ```


    The wavelet series coefficients, much in the same way like the Fourier series
    coefficients, are time- (or analog-) domain entities. From this point of view,
    we see that the DWT is a fast algorithm to compute the CWT at a sparse set of
    points on the time-scale plane, much like the FFT is a fast algorithm to compute
    the discrete Fourier transform. The DWT is a time-domain transform for analog
    signal processing. On the other hand, the filter bank algorithms are designed
    from spectral domain consideration (i.e., the high-pass and low-pass design) for
    processing of signal samples (instead of coefficients).


    +   2. Processing goal. We have shown that the wavelet series coefficients are
    essentially the components (from projection) of the signal in the direction of
    the wavelet \(\psi\) at the scale \(a = 2^{-3}\) and at the time point \(b = k2^{-3}\).
    This concept of component is similar to the Fourier component. The magnitude of
    the wavelet series'
  merge: -1
  img_proc: true
- pgno: 342
  md: 'coefficient represents the strength of the correlation between the signal and
    the wavelet at that particular scale and point in time. The processing goal of
    the filter bank is to separate the high-frequency and low-frequency components
    of the signal so that they may be processed or refined by different DSP algorithms.
    Although the DWT algorithms inherently have the same function, the focus of DWT
    is on finding the similarity between the signal and the wavelet at a given scale.


    3. Design origin. A wavelet is designed primarily via the two scale relation to
    satisfy the MRA requirements. Once the two-scale sequences are found, the DWT
    processing sequences have been set. A wavelet can be constructed, and its time
    and scale window widths can be computed. In general, a filter bank is designed
    in the spectral domain via spectral factorization to obtain the processing filters.
    These sequences may or may not serve as the two-scale sequences for the approximation
    function and the wavelet. The time-scale or time-frequency characteristics of
    these filters may not be measurable.


    4. Application areas. Most of signal- and image-processing applications can be
    carried out either with DWT or with filter bank algorithms. In some application
    areas, such as non-Fourier magnetic resonance imaging where the processing pulse
    required is in the analog domain, wavelet is more suitable for the job because
    the data set is obtained directly via projection.'
