    \( \psi_j \) is defined by its Fourier transform


    ```

    (8.45)

    \[

    \hat{\psi}_j(\boldsymbol{r}, \theta) = 2^{-3/4} W(2^{-j}\boldsymbol{r}) V\left(
    \frac{2^{|j/2|}\theta}{2\pi} \right), \quad (\boldsymbol{r}, \theta) \in \boldsymbol{R}^2

