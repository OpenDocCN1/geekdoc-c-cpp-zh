    \(\mathbf{W}_f(t,\omega) = \frac{1}{2\pi} \left(\frac{a}{\pi}\right)^{\frac{1}{2}}
    \int_{-\infty}^{\infty} \exp \left[ \frac{-a \left(t + \frac{\tau}{2}\right)^2}{2}
    + j \frac{b \left(t + \frac{\tau}{2}\right)^2}{2} + j\omega_0 \left(t + \frac{\tau}{2}\right)
    \right] \times \exp \left[ \frac{-a \left(t - \frac{\tau}{2}\right)^2}{2} - j
    \frac{b \left(t - \frac{\tau}{2}\right)^2}{2} - j\omega_0 \left(t - \frac{\tau}{2}\right)
