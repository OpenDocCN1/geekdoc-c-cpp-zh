    # 9.9.7 Results


    We have applied this CAD algorithm to 322 mammograms obtained from the MIAS MiniMammographic
    Database of England. We found 150 truly suspicious regions and 1834 false alarms
    with 37 undeterminable regions. When we compare the results from the algorithm
