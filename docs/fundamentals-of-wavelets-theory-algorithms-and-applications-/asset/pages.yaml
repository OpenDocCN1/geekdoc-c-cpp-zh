    # 4.5.1 Inverse Wavelet Transform


    Since the purpose of the inverse transform is to reconstruct the original function
    from its integral wavelet transform, it involves a two-dimensional integration
    over the scale parameter $a > 0$ and the translation parameter $b$. The expression
    for the inverse wavelet transform is


    \( f(t) = \frac{1}{C_\psi} \int_{-\infty}^{\infty} db \int_0^{\infty} \frac{1}{a^2}
    [W_\psi f(b,a)] \psi_{b,a}(t) da, \)

    (4.36)


    where $C_\psi$ is a constant that depends on the choice of wavelet and is given
    by


    \( C_\psi = \int_{-\infty}^{\infty} \frac{|\hat{\psi}(\omega)|^2}{|\omega|} d\omega
    < \infty, \)

    (4.37)


    The condition (4.37), known as *admissibility condition*, restricts the class
    of functions that can be wavelets. In particular, it implies that all wavelets
    must have $\hat{\psi}(0) = 0$ [see (4.34)] to make the left-hand side of (4.37)
    a finite number. For a proof of (4.36) readers may refer to [2, Chap. 2].'
