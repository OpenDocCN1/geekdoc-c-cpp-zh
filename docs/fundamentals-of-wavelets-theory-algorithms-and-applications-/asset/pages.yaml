  md: 'In association with this nested sequence of spaces is a set of dual wavelet
    subspaces (not nested) \(\tilde{W}_s, s \in \mathbb{Z}\), that complements the
    nested subspaces \(A_s, s \in \mathbb{Z}\). To be more specific, the relations
    of these subspaces are


    (6.79) \(A_s + \tilde{W}_s = A_{s+1}\)


    (6.80) \(\tilde{A}_s + W_s = \tilde{A}_{s+1}.\)


    The orthogonality conditions then become


    (6.81) \(A_s \perp \tilde{W}_s\)


    (6.82) \(\tilde{A}_s \perp W_s.\)


