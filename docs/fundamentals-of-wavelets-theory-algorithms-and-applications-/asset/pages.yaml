    ```


    # 8.4 COMPLEX WAVELETS


    As mentioned in Chapter 6, continuous real-valued compactly supported orthonormal
    wavelets do not have linear phases—that is, they do not have any symmetry or antisymmetry.
    In addition, all wavelets and wavelet algorithms that we have discussed thus far
    suffer from four major drawbacks: (1) shift variance—as a result of which'
  merge: -1
  img_proc: true
- pgno: 397
  md: 'wavelet coefficients of a shifted signal differs significantly compared with
    the original one (in Fourier transform, such shifts appear simply as a phase shift
    in the transformed domain); (2) aliasing due to up- and down-sampling; (3) directional
    inflexibility of the tensor product 2D wavelets for image processing, especially
    for detecting edges and ridges; and (4) the oscillatory property of the wavelet
    complicates the detection of singularity. Complex wavelets seem to address these
    issues effectively. A detailed discussion on complex wavelets is beyond the scope
    of this book. In this section we give brief introduction of the topic; readers
    may refer to [15–18] for further details.


    Similar to the Fourier transform kernel ($e^{j\omega t} = \cos \omega t + j \sin
    \omega t$), consider a complex wavelet with real and imaginary parts as


    (8.47) $\psi_c(t) = \psi_r(t) + j\psi_i(t)$,


    where $\psi_r$ is an even and $\psi_i$ is an odd function of $t$. Complex scaling
    function is defined in a similar way.


    Let us recall from the DWT that a signal x(t) may be decomposed into components
    using the scaling function $\phi(t)$ and its associated wavelet $\psi(t)$ as


    (8.48) \(x(t) = \sum_{k=-\infty}^{\infty} a(k)\phi(t-k) + 2^{j/2} \sum_{s=0}^{\infty}
    \sum_{n=-\infty}^{\infty} w(n,s)\psi(2^s t - n),\)'
  merge: -1
  img_proc: true
- pgno: 398
  md: 'where \(a(k)\) and \(w(n, s)\) are scaling-function and wavelet coefficients,
    respectively. In complex wavelet analysis, the coefficients


    \(w(n, s) = w_r(n, s) + jw_i(n, s)\)

    \(= 2^{s/2} \int_{-\infty}^{\infty} x(t)[w_r(2^s t - n) + jw_i(2^s t - n)] dt,\)


    are complex with magnitude and phase as in the Fourier transform. To mimic the
    Fourier transform, the complex wavelet must be an analytic signal so that the
    imaginary part is the Hilbert transform of the real part. The Hilbert transform
    converts a real-valued signal into a complex signal so that it has no negative
    frequency component.


    The Hilbert transform of a signal \(s(t)\) produces a signal \(s_H(t)\) that is
    orthogonal to \(s(t)\). Let \(\hat{\tilde{s}}(\omega)\) represent the Fourier
    transform of a real-valued signal \(s(t)\). A typical magnitude spectrum of \(s(t)\)
    is shown in Figure 8.24. We can construct a signal \(s_+(t)\) that contains only
    positive frequencies of \(s(t)\) by multiplying its spectrum \(\hat{\tilde{s}}(\omega)\)
    with a unit step function as


    (8.49) \(\hat{\tilde{s}}_+(\omega) = \hat{\tilde{s}}(\omega)\hat{u}(\omega),\)


    where \(\hat{u}(\omega)\) is the unit step function, defined in the usual way
    as


    (8.50) \(\hat{u}(\omega) = \begin{cases} 1 & \omega \ge 0 \\ 0 & \text{otherwise.}
    \end{cases}\)'
