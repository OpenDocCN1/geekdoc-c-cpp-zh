    for cubic spline and 1.5 for linear spline cases. It is important to point out
    that these values of \(c\) may not be suitable for all cases. Further research
    in this direction is required. We have chosen \(c\) by taking the lower cut-off
    frequency of \(\hat{\psi}(\omega)\).'
