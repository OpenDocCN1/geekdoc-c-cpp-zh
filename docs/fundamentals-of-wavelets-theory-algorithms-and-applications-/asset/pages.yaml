- pgno: 20
  md: '# Preface to the First Edition


    This textbook on wavelets evolves from teaching undergraduate and postgraduate
    courses in the Department of Electrical Engineering at Texas A&M University and
    teaching several short courses at Texas A&M University as well as in conferences
    such as the Progress in Electromagnetic Research Symposium (PIERS), the IEEE Antenna
    and Propagation (IEEE-AP) Symposium, the IEEE Microwave Theory and Technique (IEEE-MTT)
    Conference, and the Association for Computational Electromagnetic Society (ACES).
    The participants at the short courses came from industries as well as universities
    and had backgrounds mainly in electrical engineering, physics, and mathematics
    with little or no prior understanding of wavelets. In preparing material for the
    lectures, we referred to many books on this subject; some catering to the need
    of mathematicians and physicists, while others were written for engineers with
    a signal-processing background. We felt the need for a textbook that would combine
    the theory, algorithm, and applications of wavelets and present them in such a
    way that readers can easily learn the subject and be able to apply them to practical
    problems. That being the motivation, we have tried to keep a balance between the
    mathematical rigor and practical applications of wavelet theory. Many mathematical
    concepts are elucidated through the figures.


    The book is organized as follows. Chapter 1 gives an overview of the book. The
    rest of the book is divided into four parts. In Chapters 2 and 3 we review some
    basic'
  merge: -1
  img_proc: true
- pgno: 21
  md: 'concepts of linear algebra, Fourier analysis, and discrete signal analysis.
    Chapters 4–6 are devoted to discussing theoretical aspects of time-frequency analysis,
    multiresolution analysis, and the construction of various types of wavelets; Chapters
    7 and 8 give several algorithms for computing wavelet transform and implement
    them through a filter bank approach. Part of Chapter 8 and Chapters 9 and 10 present
    many interesting application of wavelets to signal-processing and boundary value
    problems.


    In preparing this book we have benefited from a number of individuals. We learned
    a lot on wavelets from our association with Professor Charles Chui. To him we
    are very grateful. We would like to thank Professors Raj Mitra, Linda Katehi,
    and Hao Ling for inviting us to speak at the short courses in the IEEE AP and
    MTT conferences. Thanks are also due to Professor L. Tsang for inviting us to
    organize the short course at PIERS. Parts of Chapters 9 and 10 come from our collaboration
    with graduate students at Texas A&M University, notable among them are Minsen
    Wang, Howard Choe, Nai-wen Lin, Tsai-fa Yu, and Zhiwha Xu. We thank all of them
    for their contribution. We wish to express our deep sense of appreciation to Michelle
    Rubin who typed and proofread most of this book. We thank Professor Kai Chang
    and Mr. George Telecki for giving us the opportunity to write this book. Last
    but not the least, we thank Mousumi Goswami and Sophia Chan for their encouragement
    and support during the preparation of this book.


    October 1998'
