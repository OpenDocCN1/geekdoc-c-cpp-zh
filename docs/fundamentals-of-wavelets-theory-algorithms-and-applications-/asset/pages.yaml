    is some space left in \( A_{s+1} \), called \( W_s \), which when combined with
    \( A_s \) gives us \( A_{s+1} \). This space \(\{W_s\}\) is called the *wavelet
    subspace* and is complementary to \( A_s \) in \( A_{s+1} \), meaning


    ```

    (5.3) \( A_s \cap W_s = \{0\}, s \in \mathbb{Z}, \text{ and } \)

    ```


    ```

    (5.4) \( A_s \oplus W_s = A_{s+1} \).

    ```


    With the condition (5.3), the summation in (5.4) is referred to as a direct sum,
    and the decomposition in (5.4) as a *direct-sum decomposition*.


    Subspaces \(\{W_s\}\) are generated by \(\psi(t) \in L^2\), called the wavelet,
    in the same way as \(\{A_s\}\) is generated by \(\phi(t)\). In other words, any
    \( x_s(t) \in A_s \) can be written as'
