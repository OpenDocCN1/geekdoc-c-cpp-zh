    # 9.8.1.2 Differential Pulse Code Modulation (DPCM).


    The differential pulse code modulation algorithm is based on the understanding
    that for most images, the values of adjacent pixels are highly correlated. Instead
    of coding the pixel value, which may be large, the method requires a predictor
    for predicting each pixel value and a code for the difference between the actual
    and the predicted values. The user has the freedom to choose the predictor by
    some forms of linear prediction. A good predictor will result in smaller errors,
    which will increase the compression performance. The histogram of the code value
    can be used to measure the compression performance. The code value histogram for
    the DPCM on the Lena image (Figure 9.28) varies between ±25, while the code values
    for the original image are between 0 and 240.


