- pgno: 170
  md: '```

    $$\mathbf{W}_f(t, \omega) = \sum_{k=1}^m \mathbf{W}_{f_k}(t, \omega) + \sum_{k=1}^m
    \sum_{l=1, l \neq k}^m \mathbf{W}_{f_k, f_l}(t, \omega),$$

    (4.77)

    ```


    where \(\mathbf{W}_{f_k}(t, \omega)\) is called the auto-term of the WVD, while
    \(\mathbf{W}_{f_k, f_l}(t, \omega)\) is a cross-term defined by


    ```

    $$\mathbf{W}_{f_k, f_l}(t, \omega) = \frac{1}{2\pi} \int_{-\infty}^{\infty} f_k
    \left(t + \frac{\tau}{2}\right) \overline{f_l \left(t - \frac{\tau}{2}\right)}
    e^{-j\omega\tau} d\tau.$$

    (4.78)

    ```


    These cross-terms of the WVD are also called the interference terms and represent
    the cross-coupling of energy between two components of a multicomponent signal.
    These interference terms are undesirable in most signal-processing applications
    and much research effort has been devoted to reduce the contribution of these
    terms. We must remember that these cross-terms [6, 7] are necessary for perfect
    reconstruction of the signal. In signal detection and identification applications,
    we are interested in discovering only those signal components that have significant
    energy. The cross-terms are rendered unimportant since reconstruction of the signal
    is not necessary.


    In radar signal processing and radar imaging, the signals to be processed have
    a time-varying spectrum like that of a linear chirp or quadratic chirp. Using
    either the STFT or the WT to represent a chirp signal loses the resolution in
    the time-frequency plane. However, the WVDs of these signals produce a well-defined
    concentration of energy in the time-frequency plane as shown in Figure 4.10. For'
