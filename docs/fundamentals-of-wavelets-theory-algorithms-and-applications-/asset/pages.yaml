    \(\hat{f}(\omega) = \sum_{n=0}^{\infty} a^n e^{-jn\omega}\)

    \(= \sum_{n=0}^{\infty} (ae^{-j\omega})^n\)

    \(= \frac{1}{1 - ae^{-j\omega}}.\)


    We pointed out in Chapter 2 that the DTFT can be obtained from the z-transform
    by replacing the variable \(z\) with \(e^{j\omega}\). For this example, the z-transform
    is


    \(F(z) = \sum_{n=0}^{\infty} a^n z^{-n}\)

    \(= \sum_{n=0}^{\infty} (az^{-1})^n\)

    \(= \frac{1}{1 - az^{-1}}.\)


    Therefore, replacing the variable \(z\) with \(e^{j\omega}\) yields


    \(F(z)|_{z=e^{j\omega}} = \frac{1}{1 - ae^{-j\omega}} = \hat{f}(\omega).\)


    The z-transform \(F(z)\) and the DTFT, \([\hat{f}(\omega) = F(z)|_{z=e^{j\omega}}]\),
    will be used interchangeably in future derivations and discussions on wavelet
    construction.'
