  md: '# 7.5 CHANGE OF BASES


    The algorithms discussed in previous section apply to all types of scaling functions
    and wavelets, including orthonormal, semiorthogonal, and biorthogonal systems.
    We have seen in Chapter 6 that the processing sequences {g0[k], g1[k]}, and {h0[k],
    h1[k]} are finite and equilength sequences for compactly supported orthonormal
    wavelets. In the case of semiorthogonal wavelets, such as compactly supported
    B-spline wavelets, the processing sequences {h0[k], h1[k]} are infinitely long.
    Truncation of the sequences is necessary for efficient processing. To avoid using
    the infinite sequences, it is better to map the input function into the dual spline
    space and process the dual spline coefficients with g0[k] and g1[k] that have
    finite lengths. This and the next two sections are devoted to the modification
    of the algorithm via a change of bases.


    We have shown in Chapter 6 that the mth order spline \(\phi_m = N_m\) and the
    corresponding compactly supported spline wavelets \(\psi_m\) are semiorthogonal
    bases. To compute the expansion coefficients of a spline series or a spline wavelet
    series, it is necessary to make use of the dual spline \(\tilde{\phi}_m\) or the
    dual spline wavelet \(\tilde{\psi}_m\). In semiorthogonal spaces, all these bases
    span the same spline space \(S_m\). For certain real-time applications in wavelet
    signal processing, it is more desirable to use finite length decomposition sequences
    for efficiency and accuracy. Therefore, it is necessary to represent the input
    signal by dual splines of the same order before the decomposition process.'
