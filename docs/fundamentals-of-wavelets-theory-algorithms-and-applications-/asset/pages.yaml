  md: 'One sees the advantages of the lifting scheme as follows: (1) Fourier techniques
    are not required, (2) the transform can be carried out without a fixed form for
    the P and U operators, (3) the computation of the inverse transform is straightforward,
    and (4) there are many variations on the operators P and U that generate various
    wavelets.


    # 8.5.1 Linear Spline Wavelet


    The complexity of the lifting scheme is increased slightly when we use the linear
    prediction for the odd samples of the signal. The predictor (P) uses the average
    of the two adjacent even samples to predict the in-between odd sample


    ```

    (8.66)

    \(\tilde{a}_{2k+1,\ell+1} = \frac{1}{2}(a_{2k,\ell+1} + a_{2k+2,\ell+1}).\)

    ```


    The prediction error (difference) forms the wavelet coefficient


    ```

    (8.67)

    \(w_{k,\ell} = a_{2k+1,\ell+1} - \tilde{a}_{2k+1,\ell+1} = \frac{1}{2}(2a_{2k+1,\ell+1}
    - a_{2k,\ell+1} - a_{2k+2,\ell+1}).\)

    ```


    To preserve the zeroth and first order moments for all resolution, we have


    ```

    (8.68)

    \(\sum_{k=0}^{2^{n-1}-1} a_{k,n-1} = \frac{1}{2} \sum_{k=0}^{2^{n-1}} a_{k,n}.\)

    ```'
