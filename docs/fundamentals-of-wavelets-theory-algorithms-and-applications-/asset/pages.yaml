- pgno: 159
  md: '# 4.9 WIGNER-VILLE DISTRIBUTION


    We have considered in previous sections linear time-frequency representations
    of a signal. The STFT and CWT are linear transforms because they satisfy the linear
    superposition theorem:


    ```

    (4.63) \( T[\alpha_1 f_1 + \alpha_2 f_2] = \alpha_1 T[f_1] + \alpha_2 T[f_2],
    \)

    ```


    where \( T \) may represent either the STFT or the CWT, and \( f_1(t), f_2(t)
    \) are two different signals in the same class with coefficients \( \alpha_1 \)
    and \( \alpha_2 \). These transforms are important because they provide an interpretation
    to the *local spectrum* of a signal at the vicinity of time \( t \). In addition,
    easy implementation and high computation efficiency of their algorithms add to
    their advantages. On the other hand, these linear transforms do not provide instantaneous
    energy information of the signal at a specific instant of time. Intuitively, we
    want to consider a transform of the type


    ```

    \( \int_{-\infty}^{\infty} |f(\tau - t)|^2 e^{-j\sigma\tau} d\tau = \int_{-\infty}^{\infty}
    f(t - \tau) \overline{f(t + \tau)} e^{-j\sigma\tau} d\tau. \)

    ```


    Since it is not easy to determine the energy of a signal at a given time, it is
    more meaningful to consider the energy within an interval \( (t - \tau/2, t +
    \tau/2) \) that is centered around the time location \( t \). For this purpose,
    the Wigner-Ville distribution (WVD) is defined by'
  merge: -1
  img_proc: true
- pgno: 160
  md: '```

    $$\mathbf{W}_f(t, \omega) = \frac{1}{2\pi} \int_{-\infty}^{\infty} f\left(t +
    \frac{\tau}{2}\right) \overline{f\left(t - \frac{\tau}{2}\right)} e^{-j\omega\tau}
    d\tau. \tag{4.64}$$

    ```


    The constant \(1/2\pi\) is a normalization factor for simplicity of computation.
    We should note that the linearity property no longer holds for equation (4.64).
    The Wigner-Ville distribution is a nonlinear (or bilinear) time-frequency transform
    because the signal enters the integral more than once. One may also observe that
    the Wigner-Ville distribution at a given time \(t\) looks symmetrically to the
    left and right sides of the signal at a distance \(\tau/2\). Computation of \(\mathbf{W}_f(t,
    \omega)\) requires signal information at \(t \pm \tau/2\), and cannot be carried
    out in real-time.


    # 4.9.1 Gaussian Modulated Chirp


    Let us consider a chirp signal that is modulated by a Gaussian envelop


    ```

    $$f(t) = \left(\frac{a}{\pi}\right)^{\frac{1}{4}} \exp\left(\frac{-at^2}{2} +
    j\frac{bt^2}{2} + j\omega_0 t\right) \tag{4.65}$$

    ```


    where \(\exp(-at^2/2)\) is the Gaussian term, \(\exp(-jbt^2/2)\) is the chirp
    signal, and \(e^{j\omega_0 t}\) is a frequency shifting term. The Wigner-Ville
    distribution from (4.64) yields'
  merge: -1
  img_proc: true
