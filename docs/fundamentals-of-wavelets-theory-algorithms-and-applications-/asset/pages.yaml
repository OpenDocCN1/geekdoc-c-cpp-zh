    ```


    ```

    \( F_2(x) = \sum_k g_1[k] f(x - k), \)

    (9.2)

    ```


    then \(\{F_1(\cdot - 2k), F_2(\cdot - 2k); k \in \mathbb{Z}\}\) are orthonormal
    bases of \( E = \text{span}\{f(\cdot - n); n \in \mathbb{Z}\} \).'
