    \(a_{2k+1,\ell+1} = w_{k,\ell} + \frac{1}{2}(a_{2k,\ell+1} + a_{2k+2,\ell+1}).\)


    These coefficients are zipped back together by the merger to form the signal at
    the next higher resolution.


    # 8.5.2 Construction of Scaling Function and Wavelet from Lifting Scheme


    Thus far we have described the lifting algorithm as a means to obtain the average
    and the difference from a given set of data. From the DWT point of view, these
    data streams correspond to the approximation coefficients and the wavelet coefficients
    for the next lower level of resolution. However, the predicting and updating schemes
    are user designed, and therefore, there are no known scaling function and wavelet
    bases associated with the'
