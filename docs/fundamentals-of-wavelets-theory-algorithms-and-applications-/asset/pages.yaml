- pgno: 540
  md: '# CHAPTER TEN


    # Wavelets in Boundary Value Problems


    All of the applications discussed so far deal with processing a given function
    (signal, image, etc.) in the time, frequency, and time-frequency domains. We have
    seen that wavelet-based time-scale analysis of a function can provide either additional
    information that cannot be obtained by either time or frequency domain analyses.
    There is another class of problems that we quite often come across involve solving
    boundary value problems (BVPs). In BVPs functions are not known explicitly; some
    of their properties along with function values are known at a set of certain points
    in the domain of interest. In this chapter we discuss the applications of wavelets
    in solving such problems.


    Much of the phenomena studied in electrical engineering can be described mathematically
    by second-order partial differential equations (PDEs). Some examples of PDEs are
    the Laplace, Poisson, Helmholtz, and Schrödinger equations. Each of these equations
    may be solved analytically for some but not for all cases of interest. These PDEs
    can often be converted to integral equations. One of the attractive features of
    integral equations is that boundary conditions are built-in and, therefore, do
    not have to be applied externally [1]. Mathematical questions of existence and
    uniqueness of a solution may be handled with more ease with the integral form.'
  merge: -1
  img_proc: true
- pgno: 541
  md: 'Either approach, differential or integral equations, to represent a physical
    phenomenon can be viewed in terms of an operator operating on an unknown function
    to produce a known function. In this chapter we deal with the linear operators.
    The linear operator equation is converted to a system of linear equations with
    the help of a set of complete bases, which is then solved for the unknown coefficients.
    The finite element and finite difference techniques used to solve PDEs result
    in sparse and banded matrices, whereas integral equations almost always lead to
    a dense matrix. An exception is when the basis functions, chosen to represent
    the unknown functions, happen to be the eigen functions of the operator.


    Two of the main properties of wavelets vis-à-vis boundary value problems are their
    hierarchical nature and the vanishing moments properties. Because of their hierarchical
    (multiresolution) nature, wavelets at different resolutions are interrelated,
    a property that makes them suitable candidates for multigrid-type methods in solving
    PDEs. On the other hand, the vanishing moment property by virtue of which wavelets,
    when integrated against a function of certain order, make the integral zero, is
    attractive in sparsifying a dense matrix generated by an integral equation.


    A complete exposition of the application of wavelets to integral and differential
    equations is beyond the scope of this chapter. Our objective is to provide readers
    with some preliminary theory and results on the application of wavelets to boundary
    value problems and give references where more details may be found. Since most
    often in electrical engineering problems we encounter integral'
  merge: -1
  img_proc: true
- pgno: 542
  md: 'equations, we emphasize their solutions using wavelets. We give a few examples
    of commonly occurring integral equations. The first and the most important step
    in solving integral equations is to transform them into a set of linear equations.
    Both conventional and wavelet-based methods in generating matrix equations are
    discussed. Both the methods fall under the general categories of method of moments
    (MoM). We call methods with conventional bases (pulse, triangular, piecewise sinusoid,
    etc.) conventional MoM, while methods with wavelet bases will be referred to as
    wavelet MoM. Some numerical results are presented to illustrate the advantages
    of the wavelet-based technique. We also discuss wavelets on a bounded interval.
    Some of the techniques applied to solving integral equations are useful for differential
    equations as well. At the end of this chapter we briefly describe the applications
    of wavelets in PDEs, particularly the multifresolution time domain (MRTD) method,
    and provide references where readers can find further information.


    # 10.1 INTEGRAL EQUATIONS


    Consider the following first-kind integral equation


    ```

    \int_{a}^{b} f(x'') K(x, x'') dx'' = g(x), \quad (10.1)

    ```


    where f is the unknown function, and the kernel K and the function g are known.
    This equation, depending on the kernel and the limits of integration, is referred
    to by different names, such as Fredholm, Volterra, convolution, Laplace, Fourier,
    Hankel, Mellin, and Wiener-Hopf'
  merge: -1
  img_proc: true
- pgno: 543
  md: 'integral equation. Such integral equations appear frequently in practice [2];
    for instance, in inverse problems in which the objective is to reconstruct the
    function $f$ from a set of known data represented in the functional form of $g$,
    one encounters the first-kind integral equations. In some electromagnetic scattering
    problems, discussed next, the current distribution on the metallic surface is
    related to the incident field in the form of an integral equation of type (10.1),
    with Green''s function as the kernel. Observe that solving for $f$ is equivalent
    to finding the inverse transform of $g$ with respect to the kernel $K$; in particular,
    if $K(x, x'') = e^{-jKxx''}$, then $f$ is nothing but the inverse Fourier transform
    of $g$. We assume that (10.1) has a unique solution. Although we discuss solutions
    of first-kind integral equations only, the method can be extended to second-kind
    [3, 4] and higher-dimension integral equations [5] with little additional work.


    As an example of (10.1), consider that an infinitely long metallic cylinder is
    illuminated by a TM (Transverse Magnetic) plane wave, as shown in Figure 10.1.
    An integral equation relating the surface current distribution and the incident
    field can be formulated by enforcing the boundary condition


    ```

    (10.2) \(\hat{n} \times \mathbf{E}(\boldsymbol{\rho}) = \hat{n} \times [\mathbf{E}_i(\boldsymbol{\rho})
