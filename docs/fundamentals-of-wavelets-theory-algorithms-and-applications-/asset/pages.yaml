- pgno: 555
  md: 'Because of its total positivity property, the scaling function has a smoothing
    or variation diminishing effect on a function against which it is integrated.
    The smoothing effect can be understood as follows. If we convolve two pulse functions,
    both of which are discontinuous but totally positive, the resultant function is
    a linear B-spline that is continuous. Likewise, if we convolve two linear B-splines,
    we get a cubic B-spline that is twice continuously differentiable. Analogous to
    these, the function ${}_L K_{\phi, \varsigma 0}$ is smoother than the kernel $K$
    itself. Furthermore, because of the MRA properties that give


    ```

    (10.31) \(\langle \phi_{k,s}, \Psi_{k'',s''} \rangle = 0, \quad s \le s'',\)

    ```


    the integrals \(\langle \phi_{k''(\varsigma 0)}, (L_K \psi_{n,s}) \rangle\) and
    \(\langle \Psi_{n'',s''}, (L_K \phi_{k,s}) \rangle\) are quite small.


    Although diagonally dominant, the \([A_{\phi \phi}]\) portion of the matrix usually
    does not have entries that are very small compared to the diagonal entries. In
    the case of the conventional MoM, all the elements of the matrix are of the form
    \(\langle \phi_{k'',s}, (L_K \phi_{k,s}) \rangle\). Consequently, we cannot threshold
    such a matrix to sparsify it. In the case of the wavelet MoM, the entries of \([A_{\phi
    \phi}]\) occupy a very small portion (\(5 \times 5\) for linear and \(11 \times
    11\) for cubic spline cases) of the matrix, while the rest contains entries whose
    magnitudes are very small compared to the largest entry, hence a significant number
    of entries can be set to zero without affecting the solution appreciably.


