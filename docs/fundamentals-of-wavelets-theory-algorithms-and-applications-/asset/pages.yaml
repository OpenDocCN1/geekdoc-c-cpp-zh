    # 9.12 GEOPHYSICAL APPLICATIONS


    Geophysical applications include characterization of subsurface geological structure;
    location, and identification of subsurface objects; and estimation, mapping, and
    monitoring of material properties. A comprehensive discussion is beyond the scope
    of this book. We will, instead, concentrate on a few applications related to oil
    and gas exploration and production.


    The primary goal of oilfield exploration is to identify, quantify, produce, and
    monitor oil and gas (in general, hydrocarbons) reserves. Hydrocarbons reside in
    rocks that are porous in nature. Earth formation can be viewed as a layered medium
    with each layer having its own properties. Some of these properties are conductivity,
    permittivity, density, elasticity, porosity,† and permeability.‡


    Two main data acquisition techniques are seismic and well logging. A seismic source
    generates acoustic or elastic waves that propagate through the earth formation.
    Reflections from various layers are recorded in receivers (geophones for land
    seismic or hydrophones for marine). The amount of data to be processed is huge.
    Seismic images are basically maps of acoustic impedance. These images can provide
    valuable information on oilfield'
  merge: -1
  img_proc: true
- pgno: 513
  md: 'reserve. Well logging, on the other hand, gives higher spatial resolution data.
    In a typical exploration environment, a wellbore (15 to 30 cm in diameter) is
    drilled to a depth that may extend to a few kilometers. Formation properties are
    measured using a combination of sensors (electromagnetic, nuclear, acoustic, optical,
    etc.) that move along the wellbore trajectory. Material properties as a function
    of depth are known as a “log.”


    Wavelet analysis has been used extensively in seismic data analysis, fluid identification,
    well log data processing and interpretation, upscaling, denoising, detection of
    abnormalities, processing of nonstationary pressure transient signals, long-term
    downhole signals, and many others [25–50]. In fact, it was the work of Morlet
    et al. [25, 26] in 1980s on problems related to seismic signal that revived the
    interest in wavelets. A few applications of wavelets are briefly described in
    the next sections.


    # 9.12.1 Boundary Value Problems and Inversion


    Most applications of wavelets are in geophysical data analysis and interpretation.
    There are, however, some limited work in applying wavelets to boundary value problems
    and inversions in geophysics. Moridis et al. [27], for instance, have applied
    wavelets to solve the Buckley-Leverett nonlinear partial differential equation
    (PDE) arising from two-phase flow in one dimension. The equation can be represented
    as


    ```

    R(x, t) = \frac{\partial S}{\partial t} + u \frac{\partial f(S)}{\partial x} =
    0,

    (9.50)

    ```'
  merge: -1
  img_proc: true
- pgno: 514
  md: 'where \( S \) is the water saturation, \( (x, t) \) are space and time variables
    respectively, \( u \) is a parameter relating the porosity, the cross-section
    and the injection rate. The term \( f(S) \) is a nonlinear function that depends
    on the mobilities of oil and water and the corresponding irreducible saturations.


    Two classes of wavelet bases (Daubechies and Chui-Wang) and two methods (Galerkin
    and collocation) are reported in the paper by Moridis et al. [27]. (See Chapter
    10 for details on wavelets in boundary value problems.) The paper concludes that
    the Chui-Wang wavelets and a collocation method provide the optimum wavelet solution
    for the problem.


    For many inverse problems, accounting for model uncertainty is an important issue,
    and Bayesian model averaging is commonly used for such purposes. This, however,
    requires choosing many model parameterizations and computing the posterior distribution
    for each model from scratch. For a 1D seismic problem and generally for linear
    inverse problems, Bennett and Malinverno [38] show how wavelets provide a multiresolution
    family of model parameterizations and further give a fast algorithm for converting
    the posterior distribution for one model to another when changing its local resolution.
    Gholami and Siahkoohi [50] have applied wavelets to solve linear and nonlinear
    inverse problems by constraining the solution to have sparse representations in
    two appropriate transformation domains simultaneously. They verified the effectiveness
    of the method by applying it to synthetic examples as well as field data from
    seismic travel time. Lu and Horne [33] have also applied wavelets and inverse'
  merge: -1
  img_proc: true
- pgno: 515
  md: 'problem theory to many issues related to reservoir modeling and simulation,
    such as system parameterization, resolution and uncertainty tradeoff, and preservation
    of geological structures.


    # 9.12.2 Well Log Analysis


    There are numerous examples of application of wavelets to analyze individual well
    log or a combinations thereof. These applications include feature extraction,
    fluid identification, data compression, and image analysis.


    Definition and interpretation of sedimentary facies often involve examination
    of well logs to assess values, trends, cycles, and sudden changes. The detection
    of cyclicity in sedimentary strata may point to the factors controlling sediment
    deposition. Cycles in rock successions may indicate depositional processes of
    varying complexity and origin. These characteristics may vary over a wide range
    of scales and cannot be easily identified from the logs using traditional means.


    Recent developments on wavelet analysis for well logs provide a visual representation
    of signals for interpretation and good supports for stratigraphic analyses. Wavelets
    make easy detection of cyclicities, transitions, unconformities, and other sudden
    changes in sedimentary successions. The continuous wavelet transform provides
    a space-scale analysis of the signal. Revera et al. [39] have used the CWT to
    evaluate the well log and core data from the Sherwood Sandstone Group, Irish Sea.
    The wavelet features extracted from several logs are processed and combined to
    form a feature vector. As a result, one can'
  merge: -1
  img_proc: true
- pgno: 516
  md: 'automatically identify boundaries separating the sabkha, dune, and fluvial
    intervals. The cyclic behavior within each interval, representing different depositional
    episodes, can also be identified. Use of neural network and genetic algorithm
    have been applied in conjunction with wavelet analysis for zone detection and
    classification [35]. Yue et al. [43] have demonstrated that by proper depth-scale
    (similar to time-frequency) analysis of well log data, one could identify various
    zones with different types of fluid (Figure 9.45). It should be noted here that
    the vertical axis in Figure 9.45 is relative depth, not the absolute which may
    be in the thousands of feet.


