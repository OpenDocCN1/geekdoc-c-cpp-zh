    # 10.3 WAVELET TECHNIQUES


    Conventional bases (local or global) when applied directly to the integral equations,
    generally lead to a dense (fully populated) matrix $A$. As a result, the inversion
    and the final solution of such a system of linear equations are very time consuming.
    In later sections, it will be clear why conventional bases give a dense matrix
    while wavelet bases produce sparse matrices. Observe that conventional MoM is
    a single-level approximation of the unknown function in the sense that the domain
    of the function ($[a, b]$), for instance, are discretized only once, even if we
    use nonuniform discretization of the domain. Wavelet-MoM as we will discuss, on
    the other hand, is inherently multilevel in nature.


    Beylkin et al. [8] first proposed the use of wavelets in sparsifying an integral
    equation. Alpert et al. [3] used wavelet-like basis functions to solve second-kind
    integral equations. In electrical engineering, wavelets have been used to solve
    integral equations arising from electromagnetic scattering and transmission line
    problems [5, 9–28]. In the following sections, we briefly describe four ways in
    which wavelets have been used in solving integral equations.'
  merge: -1
  img_proc: true
- pgno: 551
  md: '# 10.3.1 Use of Fast Wavelet Algorithm


    In the fast wavelet algorithm method, the impedance matrix $A$ is obtained via
    the conventional method of moments using basis functions such as triangular functions,
    and then wavelets are used to transform this matrix into a sparse matrix [9, 10].
    Consider a matrix $W$ formed by wavelets. The transformation of the original MoM
    impedance matrix into the new wavelet basis is obtained as


    ```

    (10.19) $WAW^T \cdot (W^T)^{-1} c = Wb,$

    ```


    which can be written as


    ```

    (10.20) $A_w \cdot c_w = b_w,$

    ```


    where $W^T$ represents the transpose of the matrix $W$. The new set of wavelet
    transformed linear equations are


    ```

    (10.21) $A_w = WAW^T$

    $c_w = (W^T)^{-1} c$

    $b_w = Wb.$

    ```


    The solution vector $c$ is then given by


    ```

    $c = W^T(WAW^T)^{-1}Wb.$

    ```'
