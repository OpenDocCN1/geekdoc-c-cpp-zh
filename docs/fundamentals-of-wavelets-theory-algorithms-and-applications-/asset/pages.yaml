  md: '# Preface to the Second Edition


    Since the appearance of the first edition over a decade ago, several new wavelets
    and wavelet-like functions have been introduced along with many interesting applications.
    These developments have motivated us to substantially revise the book and bring
    out this second edition. The basic structure of the book remains the same. Apart
    from making a few minor additions and corrections, the first seven chapters are
    carried over from the earlier edition. In these chapters, wavelet theory and algorithms
    are gradually and systematically developed from basic linear algebra, Fourier
    analysis, and time-frequency analysis. Chapter 8 is renamed as “Special Topics
    in Wavelets and Algorithms” where four new sections on ridgelets, curvelets, complex
    wavelets, and lifting wavelet transform are introduced. Various edge detection
    techniques are summarized in a new section in Chapter 9. Another interesting addition
    in Chapter 9 is a comprehensive review of applications of wavelets to geophysical
    problems, in particular to the oilfield industry. In Chapter 10, the section on
    differential equations has been expanded by including the multiresolution time
    domain method.


    Some of the new material in the second edition is derived from our collaboration
    with students and colleagues at Texas A&M university, College Station; Indian
    Institute of Technology, Kharagpur; Georgia Institute of Technology, Atlanta;
    and Schlumberger. To them and to many readers who drew our attention to errors
    and misprints, we wish to express our gratitude. We also thank George Telecki,
    Kristen Parrish, and Lucy Hitz of John Wiley & Sons for'
  merge: -1
  img_proc: true
- pgno: 18
  md: 'their assistance during the preparation of the second edition.


    July 2010


    JAIDEVA C. GOSWAMI AND ANDREW K. CHAN'
  merge: -1
  img_proc: true
