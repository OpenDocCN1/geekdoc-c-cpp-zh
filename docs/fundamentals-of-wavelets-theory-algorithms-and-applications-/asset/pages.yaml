  md: 'and the coefficients {g0[k]} can be found from


    ```

    (6.54)

    \(\frac{1}{2} \sum_k g_0[k] z^k = G_0(e^{-j\omega/2}) = \frac{\hat{N}''_m(\omega)}{\hat{N}_m(\omega/2)}\)

    ```


    where \(z = e^{-j\omega/2}\). By combining (6.53) and (6.54), we have


    ```

    (6.55)

    \(G_0(z) = \left( \frac{1+z}{2} \right)^m \left[ \frac{\sum_{k=-m+1}^{m-1} N_{2m}(m+k)
    z^k}{\sum_{k=-m+1}^{m-1} N_{2m}(m+k) z^{2k}} \right]^{\frac{1}{2}}\)

    ```


    As an example consider the linear B-L scaling function for which \(m = 2\). For
    this case we have


    ```

    (6.56)

    \(\frac{1}{2} \sum_k g_0[k] z^k = G_0(z) = \frac{(1+z)^2}{4} \times \frac{z^2
    + 4z + 1}{z^4 + 4z^2 + 1}\)

    ```


    The coefficients {g0[k]} can be found by expanding the expression on the right-hand
    side as a polynomial in z and then comparing the coefficients of the like powers
    of z. These coefficients can also be found by computing the Fourier coefficients
    of the right-hand side expression. Observe that G0(1) = 1 is satisfied, thus giving
    the sum of all {g0[k]} to be 2. In Tables (6.3) and (6.4) we provide the coefficients
    of the linear and cubic B-L scaling functions. The linear and cubic Battle-Lemarié
    scaling functions and corresponding wavelets are shown in Figure 6.8.'
