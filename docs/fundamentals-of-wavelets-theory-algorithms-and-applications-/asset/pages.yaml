    # 9.8.5 Spatial Oriented Tree (SOT)


    Said and Pearlman [15, 16] discovered set partitioning principles to improve the
    performance up to 1.3 dB over that of the zerotree method. They observed that
    there is a spatial self-similarity between subbands, and the discrete wavelet
    coefficients (DWCs) are expected to be better magnitude ordered if one moves downward
    in the pyramid following the same spatial orientation. Based on this observation,
    a tree structure called a spatial orientation tree (SOT) is used to define the
    spatial relationship of the DWCs in the hierarchical structure. Three main concepts'
  merge: -1
  img_proc: true
- pgno: 485
  md: 'are proposed by Said and Pearlman to adapt the SOT to obtain a better performance
    in image coding: (1) partial ordering of the transformed image by magnitude and
    transmission of coordinates via a subset partitioning algorithm, (2) ordered bit-plane
    transmission of refinement bits, and (3) exploitation of the self-similarity of
    the DWCs across the different scales.


    For the SOT [15–17], only two symbols zero and one are used, and each symbol has
    a different meaning at a different part of the tree. The symbol one may represent
    (1) a significant DWC, (2) the negative sign of a significant DWC, (3) the case
    that any one of the four children is significant, or (4) the case that any of
    the grandchildren is significant. The symbol zero could indicate (1) an insignificant
    DWC, (2) the positive sign of a significant DWC, (3) the case that all four children
    are insignificant, or (4) the case that all grandchildren are insignificant. To
    maintain the SOT for the DWCs along with the different scales, three lists are
    used as follows:


    +   1. List of insignificant sets (LIS) is a list of the roots of a tree for further
    tracing, and type A and B of the roots of the tree are used interchangeably to
    obtain better adaptability.


    +   2. List of insignificant pixels (LIP) is a list of the DWCs that are not roots
    of the tree currently but are the candidates to be placed into the LSP.


    +   3. List of significant pixels (LSP) is a list of the DWCs that have been encoded
    and are to be further refined.'
  merge: -1
  img_proc: true
