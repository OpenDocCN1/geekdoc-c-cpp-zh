    # ## 9.2 WAVELET-PACKET ALGORITHMS


    The decomposition tree for wavelet packets uses the same decomposition block of
    two parallel filtering channels followed by decimation by two (|2), as in the
    wavelet algorithm. Any coefficient set in the tree may be processed by this block.
    In the wavelet decomposition tree, only the approximation coefficient sets {a}
    in Figure 7.9 are processed for different resolutions z, while the wavelet coefficient
    sets {w} are outputs of the algorithm. In wavelet packet decomposition, the wavelet
    coefficient sets {w} are also processed by the same building block to produce
    wavelet packet coefficient sets {w}. We see from Figure 9.6 that for each set
    of N coefficients, we obtain two coefficient sets of N/2 length after processing
    by the'
  merge: -1
  img_proc: true
- pgno: 431
  md: 'decomposition block. The number of coefficient sets is 2^m if the original
    coefficient set is processed for m resolutions. Figure 9.6 demonstrates the wavelet
    packet tree for m = 3.


    # FIGURE 9.6: A block diagram for the decomposition and reconstruction algorithms
    for wavelet packets.


    ![](img/f73ae67732328dc36596b27ffe8d0152_431_0.png)


    It is important to keep track of the indices of the wavelet packet coefficients
    in the decomposition algorithm. To achieve perfect reconstruction, if a coefficient
    set has been processed by h0[n] and (↓2), the result should be processed by g0[n]
    and (↑2). The same order is applicable to h1[n] and g1[n]. For example, if we
    process a set of data first by h0[n] and (↓2) followed by h1[n] and (↓2), the
    resulting signal must be processed by (↑2) and g1[n] and then followed by (↑2)
    and g0[n] to achieve perfect reconstruction. Thus signal processing using wavelet
    packets requires accurate bookkeeping of different orders of digital filtering
    and sampling rate changes.


