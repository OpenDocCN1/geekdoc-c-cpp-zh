    # 5.2 ORTHOGONAL, BIORTHOGONAL, AND SEMIIORTHOGONAL DECOMPOSITION


    In Section 5.1, the only requirement we had for the wavelet subspace \(\boldsymbol{W}_s\)
    was that it be complementary of \(\boldsymbol{A}_s\) in \(\boldsymbol{A}_{s+1}\).
    In addition to this, if we also require that \(\boldsymbol{W}_s \perp \boldsymbol{A}_s\),
    then such a decomposition is called an *orthogonal decomposition*. Let us explain
    the orthogonality of \(\boldsymbol{A}_s\) and \(\boldsymbol{W}_s\) a little further.
    For simplicity, let \(s = 0\). For this case, \(\{\phi(t - k) : k \in \mathbb{Z}\}\)
    spans \(\boldsymbol{A}_0\); likewise, \(\{\psi(t - k) : k \in \mathbb{Z}\}\) spans
    \(\boldsymbol{W}_0\). Then \(\boldsymbol{A}_0 \perp \boldsymbol{W}_0\) implies
    that


    ```

    (5.8) \(\int_{-\infty}^{\infty} \phi(t)\psi(t - \ell)dt = 0 \quad \text{for all
    } \ell \in \mathbb{Z}.\)

    ```'
