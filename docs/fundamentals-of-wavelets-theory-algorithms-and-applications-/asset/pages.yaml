    # 9.8 IMAGE COMPRESSION


    # 9.8.1 Basics of Data Compression


    Signals such as music, voice, graphics, images, and movies are either stored for
    later usage or transmitted via networks to their ultimate users. Before the digital
    era, magnetic tapes, photographs, and films were the popular means for signal
    storage. Telephone and television were the usual transmission media for voice
    and image. Since the 1980s, the digital revolution has transformed the modes and'
  merge: -1
  img_proc: true
- pgno: 470
  md: 'means of signal storage and transmission. A 2-h-long movie can easily be stored
    in a DVD that takes up about 1/5000 of the physical space of two to three reels
    of film negatives.


    Nowadays, most signals, such as computed tomography (CT), magnetic resonance imaging
    (MRI), photographs, music, and voice, are already generated in digital format.
    Analog signals from antiquated documents, photographs, and phonographs can be
    converted to digital format through powerful digitizers, quantizers, and scanners.
    The size for some of these signals may be quite larger so as to preserve the fidelity
    of the signal. The challenge is to manipulate the files in the digital domain
    to reduce the sizes for convenient storage and/or efficient transmission. Many
    1D, 2D, and 3D signal-compression schemes have been developed. We will briefly
    explain the classification and approaches of these schemes.


    Compression ratio and distortion or fidelity (the difference between the original
    and the reconstructed signal) are two main measures for evaluating a compression
    algorithm. Generally, such algorithms are either lossless, meaning perfect reconstruction,
    or lossy, in which some information is lost during reconstruction. From Shannon''s
    information theoretic approach we know that the highest achievable lossless compression
    is to encode the output of a source with an average number of bits equal to the
    entropy* of the source. The objective, therefore, is to devise a scheme that will
    reduce the entropy and increase the compression ratio. Messages made up of strings
    of English alphabets can be recovered without loss using Morse code, Huffman code,
    run-length code, bit plane coding, predictive coding,'
  merge: -1
  img_proc: true
- pgno: 471
  md: 'arithmetic coding, and dictionary techniques, such as LZ77 and LZW, are some
    of the lossless coding schemes. The compression ratio achieved through lossless
    algorithms are usually small (typically 10 or less).


    In this chapter, we discuss lossy compression in which, as mentioned before, the
    signal is not exactly recoverable. Transform coding, subband (multiresolution)
    coding, scalar quantization, and vector quantization are examples of lossy compression
    schemes.


    Several 1D signal compression schemes are available for voice and music. They
    are the pulse code modulation (PCM), differential pulse code modulation (DPCM),
    adaptive DPCM (ADPCM), audio CODEC coder-decoder (CODEC) manager (ACM), waveform
    data (WAV), and MP3. MP3 stands for MPEG-1 audio layer 3 and it is a lossy form
    of data compression. Currently, it is the most popular format for audio storage.
    Digital voice recorders and portable music players also use this format. The compression
    scheme by reducing/removing certain signal samples that are not perceptible by
    most people is known as perceptual coding. It uses psychoacoustic approach in
    discarding the unperceptible information and retaining the useful information
    in an efficient manner. For still images, JPEG format is widely used.


