    # 6.5 CONSTRUCTION OF BIORTHOGONAL WAVELETS


    In the previous sections, we have discussed the semiorthogonal and orthonormal
    wavelets. We developed the orthogonal wavelets as a special case of the semiorthogonal
    wavelets by using


    ```

    \(\tilde{\phi} = \phi\)

