- pgno: 395
  md: '(Reprinted with permission from [13], copyright © 2002 by IEEE.)


    ![](img/f73ae67732328dc36596b27ffe8d0152_395_0.png)


    The first-generation curvelet is based on the extension of ridgelet transform
    in the blocks of subband images of the original image. It requires an intricate
    combination and overlapping blocks to extract the ridges in the original image.
    As a result, it has limited application to image analysis. A second-generation
    curvelet has recently been developed to simplify the application procedure. Similar
    to a 2D scaling function, its support is approximately a curvilinear rectangle
    on a polar grid.


    Following Fadili and Starck [14], the second-generation curvelets are triple-indexed
    basis functions—namely, \(\Psi_{j,l,k}(\mathbf{x})=\Psi_j[R_{\theta_j}(\mathbf{x}-\mathbf{x}_k^{j,l})]\)
    at resolution \(j\), angular rotation \(\theta_j\), and the position


    ```

    \(\mathbf{x}_k^{j,l} = R_{\theta_j}^{-1} (2^{-j} k_1, 2^{-j/2} k_2).\)

    ```'
