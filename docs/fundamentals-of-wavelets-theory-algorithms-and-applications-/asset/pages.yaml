    # 10.8.4 Subcell Modeling in MRTD


    The method presented in the previous section allows a time and space variable
    grid to be used to model Maxwell''s equations. It is also possible to continuously
    vary the dielectric constant through a cell [59,66]. Using this method, arbitrary
    structures consisting of only dielectrics can be modeled efficiently. However,
    the addition of PEC structures adds difficulties. A novel technique has been introduced
    that allows for the intracell modeling of multiple PEC''s [68] using MRTD grids.


    The PEC boundary condition requires that electric fields tangential to PECs are
    set to zero. In (10.72)-(10.74) update equations are presented that allow the
    determination of wavelet/scaling coefficients at a future time step based on the
    wavelet/scaling coefficients of the surrounding fields at previous time steps.
    If the PEC structure is the size of an MRTD cell, all of the scaling/wavelet coefficients
    can be zeroed to apply the boundary condition. If the PEC structure is smaller
    than the cell, however, the scaling/wavelet coefficients must be modified such
    that the field values at non-PEC locations are unchanged while the field values
    at PEC locations are zeroed.


