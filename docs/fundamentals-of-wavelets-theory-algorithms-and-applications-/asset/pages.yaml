    # 4.4 DISCRETE GABOR REPRESENTATION


    Formally writing the Gabor transform given in Section 4.2.2, we obtain


    ```

    G_{g_0} f(b, \zeta) := \int_{-\infty}^{\infty} f(t) \overline{g_0(t-b)} e^{-j\zeta
    t} dt

    = \frac{1}{2a\pi} \int_{-\infty}^{\infty} f(t) e^{-(t-b)^2 / 4a} e^{-j\zeta t}
    dt

    ```


    for \(-\infty \le b, \zeta \le \infty\). The Gabor transform is dense over the
    \(t - \omega\) plane. Computation load for the Gabor transform in (4.28) is quite
    heavy. We may, instead of (4.28), compute the discretized version of (4.28). That
    is, we compute (4.28) only at a set of points on the \(t - \omega\) plane.


    ```

    G_{g_a} f(b_n, \zeta_k) = \int_{-\infty}^{\infty} f(t) \overline{g_a(t-b_n)} e^{-j\zeta_k
    t} dt

    = \langle f(t), g_a(t-b_n) e^{j\zeta_k t} \rangle

    = \langle f(t), \phi_{n,k}(t) \rangle.

    ```


    The last expression of (4.29) is the inner product of the function with the function
    \(\phi_{n,k}(t) = g_a(t-b_n) e^{j\zeta_k t}\). The function \(f(t)\) may be recovered
    under a restricted condition [3]:'
