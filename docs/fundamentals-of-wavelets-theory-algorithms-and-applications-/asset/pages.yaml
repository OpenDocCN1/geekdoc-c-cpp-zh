- pgno: 251
  md: 'One of the major difficulties with compactly supported orthonormal wavelets
    is that they lack spatial symmetry. This means the processing filters are nonsymmetric
    and do not possess linear phase property. Lacking the linear phase property results
    in severe undesirable phase distortions in signal processing. This topic will
    be dealt with in Chapter 7 in more detail. Semiorthogonal wavelets, on the other
    hand, are symmetric but suffers from the drawback that their duals do not have
    compact support. This is also undesirable since truncation of the filter coefficients
    is necessary for real-time processing. Biorthogonal wavelets may have both symmetry
    and compact support.


    Cohen, Daubechies, and Feauveau [11] extended the framework of the theory of orthonormal
    wavelets to the case of biorthogonal wavelets by a modification of the approximation
    space structure. Let us recall that in both the semiorthogonal and orthonormal
    cases, there exist only one sequence of nested approximation subspaces,


    ```

    (6.73)

    {0} <- ... < A_2 < A_1 < A_0 < A_1 < A_2 < ... -> L^2.

    ```


    The wavelet subspace, $W_s$, is the orthogonal complements to $A_s$ within $A_{s+1}$
    such that


    ```

    A_s \oplus W_s = \{0\}, s \in \mathbb{Z}, \text{ and}

    (6.74) A_s + W_s = A_{s+1}.

    ```


    This framework implies that the approximation space is orthogonal to the wavelet
    space at any given scale $s$ and the wavelet spaces are orthogonal across scales:'
  merge: -1
  img_proc: true
- pgno: 252
  md: '(6.75) \( W_s \perp W_p \quad \text{for } s \neq p. \)


    In the orthonormal case, the scaling functions and wavelets are orthogonal to
    their translates at any given scale \( s \)


    (6.76) \(\langle \phi_{k,s}(t), \phi_{m,s}(t) \rangle = \delta_{k,m} \\ \langle
    \psi_{k,s}(t), \psi_{m,s}(t) \rangle = \delta_{k,m}.\)


    In the semiorthogonal case, equation (6.76) no longer holds for \(\phi\) and \(\psi\).
    Instead, they are orthogonal to their respective duals


    (6.77) \(\langle \phi_{k,s}(t), \tilde{\phi}_{m,s}(t) \rangle = \delta_{k,m} \\
    \langle \psi_{k,s}(t), \tilde{\psi}_{m,s}(t) \rangle = \delta_{k,m}.\)


    and the duals span dual spaces in the sense that \(\widetilde{A}_s := span\{\tilde{\phi}(2^t
    - m), s, m, \in \mathbb{Z}\}\) and \(\widetilde{W}_s := span\{\tilde{\psi}(2^t
    - m), s, m, \in \mathbb{Z}\}\). As described in Chapter 5, semiorthogonality implies
    that \(\widetilde{A}_s = A_s\) and \(\widetilde{W}_s = W_s\).


    In biorthogonal system, there exist an additional dual nested space:


    (6.78) \(\{0\} \leftarrow \cdots \subset \tilde{A}_{-2} \subset \tilde{A}_{-1}
    \subset \tilde{A}_0 \subset \tilde{A}_1 \subset \tilde{A}_2 \subset \cdots \rightarrow
    L^2.\)'
