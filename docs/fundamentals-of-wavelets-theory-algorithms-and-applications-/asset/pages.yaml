    allows for an ROI transmission of data.


    # 9.11.1 Three-Dimensional Wavelets and Algorithms


    Similar to the 2D wavelet, the 3D wavelet decomposition can be performed for discrete
    volume data by a filtering operation, as shown in Figure 9.38.


    FIGURE 9.38: Block diagram of a three-dimensional hierarchical wavelet decomposition
    algorithm.'
