  md: 'Of course, the o.n. basis in (3) of \( U_0^{2^{j+m}} \) provides time-localization
    within the subband \( H_j^m \). Any function \( s(x) \in L^2(\mathbb{R}) \) has
    a representation


    ```

    \( s(t) = \sum_{j=1}^{\infty} \sum_{m=0}^{2^j-1} \sum_{n=-\infty}^{\infty} d_n^{j,m}
    \mathcal{U}_{2^j+m}(t-n) = \sum_{j,m} s_{j,m}(t), \)

    ```


    where \( d_n^{j,m} = \langle s(t), \mathcal{U}_{2^j+m}(t-n) \rangle \), and the
