    # 9.8.2 Wavelet Tree Coder


    In general, tree coders [13] use a tree structure, which takes advantage of the
    correlation between the discrete wavelet coefficients (DWCs) in each of the three
    spatial directions (HL, LH and HH), as shown in Figure 9.27. That means, if a
    DWC at a higher decomposition level is smaller than a specified threshold, there
    is a great possibility that all of its children and grandchildren are smaller
    than the threshold. Thus all of these insignificant DWCs can be encoded with one
    symbol. The encoding of a significant DWC may need more bits. Many tree'
