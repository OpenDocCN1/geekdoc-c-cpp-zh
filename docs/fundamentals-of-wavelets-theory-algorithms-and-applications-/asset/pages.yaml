    $$

    \begin{aligned}

    \overline{\mathbf{W}_s(t, \omega)} &= \frac{1}{2\pi} \int_{-\infty}^{\infty} s\left(t
    - \frac{\tau}{2}\right) \overline{s\left(t + \frac{\tau}{2}\right)} e^{j\omega\tau}
    d\tau \\

    &= \frac{1}{2\pi} \int_{-\infty}^{\infty} s\left(t + \frac{\tau}{2}\right) \overline{s\left(t
    - \frac{\tau}{2}\right)} e^{-j\omega\tau} d\tau \\

    &= \mathbf{W}_s(t, \omega).

    \end{aligned}

    $$


    (4.71)


    The Wigner-Ville distribution is always real but not always positive. Figure 4.13
    shows the WVD of a function that becomes negative near the center. Consequently,
    WVD may not be used as a measure of energy density or probability density.


