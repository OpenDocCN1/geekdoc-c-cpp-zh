    since all of the above mathematical rules apply to column matrices. We define
    the length of a vector similar to the definition of the norm of a function by


    ```

    $$|\mathbf{V}| = \sqrt{v_1^2 + v_2^2 + v_3^2}.$$

    ```


    The scalar product (inner product) of two vectors is a very important operation
    in vector algebra that we should consider here. It is defined by


    ```

    $$\begin{aligned} \mathbf{U} \cdot \mathbf{V} &:= |\mathbf{U}||\mathbf{V}| \cos
    \angle \mathbf{U}, \mathbf{V} \\ &= u_1 v_1 + u_2 v_2 + u_3 v_3 \\ &= [u_1 \ u_2
    \ u_3] \begin{bmatrix} v_1 \\ v_2 \\ v_3 \end{bmatrix} \\ &= \begin{bmatrix} u_1
    \\ u_2 \\ u_3 \end{bmatrix}^t \begin{bmatrix} v_1 \\ v_2 \\ v_3 \end{bmatrix},
    \end{aligned}$$

    ```


    where the superscript \(t\) indicates matrix transposition and \(:=\) is the symbol
    for definition. It is known that the scalar product obeys the commutative law:
    \(\mathbf{U} \cdot \mathbf{V} = \mathbf{V} \cdot \mathbf{U}\). Two vectors \(\mathbf{U}\)
    and \(\mathbf{V}\) are *orthogonal* to each other if \(\mathbf{U} \cdot \mathbf{V}
