    # 10.8.5.2 Microstrip-Line Coupling.


    Embedded transmission lines are commonly used in multilayer packages, where the
    use of noncontinuous grounds could lead to increased cross-talk effects. The FDTD
    technique is used to estimate the coupling of finite-ground microstrip lines to
    Figure 10.18 [69]. The results presented in [69] for different line spacing and
    for a ground connecting via (optimized design) are obtained by combining two simulations,
    an even and an odd mode excitation. In addition, to reduce the unwanted cross-talk,
    the electric and the magnetic field distributions are also calculated. It is shown
    that most of the coupling is through the magnetic field lines, leading to the
    design conclusion that attempts to reduce the coupling should focus on magnetic
    shielding.'
