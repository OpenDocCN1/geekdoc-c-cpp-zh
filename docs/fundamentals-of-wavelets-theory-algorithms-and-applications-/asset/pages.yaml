    # 10.7 SEMIORTHOGONAL VERSUS ORTHOGONAL WAVELETS


    Both semiorthogonal and orthogonal wavelets have been used for solving integral
    equations. A comparative study of their advantages and disadvantages has been
    reported in [14]. The orthonormal wavelet transformation, because of its unitary
    similar property, preserves the condition number (κ) of the original impedance
    matrix A; semiorthogonal wavelets do not. Consequently, the transformed matrix
    equation may require more iterations to converge to the desired solution. Some
    results comparing the condition number of matrices for different cases are given
    in Table 10.2 [17].


