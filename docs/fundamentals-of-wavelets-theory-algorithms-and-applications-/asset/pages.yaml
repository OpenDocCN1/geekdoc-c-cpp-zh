    # 8.1.1 Finer Time Resolution


    In this section, we will be concerned with maintaining the same time resolution
    on each scale by filling in the “holes” along the time axis on each scale—that
    is, we want to compute \((W_\psi x_M)(n/2^M, 1/2^s), n \in \mathbb{Z}, s < M\).
    Recall that the standard algorithms discussed in Chapter 7 gives the IWT values
    only at dyadic points \(\{n/2^s, 1/2^s; n \in \mathbb{Z}, s < M\}\). For finer
    time resolution we first observe that for each fixed \(n\), by introducing the
    notation


    ```

    x_{M,n}(t) := x_M\left(t + \frac{n}{2^M}\right),

    (8.1)

    ```


    we have


    ```

    (W_\psi x_M)\left(\frac{n}{2^M}, \frac{1}{2^s}\right) = 2^{s/2} \int_{-\infty}^\infty
    x_M(t) \overline{\psi\left(2^s\left(t - \frac{n}{2^M}\right)\right)} dt

    = 2^{s/2} \int_{-\infty}^\infty x_M\left(t + \frac{n}{2^M}\right) \overline{\psi\left(2^s
    t\right)} dt

    = (W_\psi x_{M,n})\left(0, \frac{1}{2^s}\right).

    (8.2)

    ```


