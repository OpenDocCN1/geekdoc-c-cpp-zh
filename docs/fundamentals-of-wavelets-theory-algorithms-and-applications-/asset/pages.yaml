    # 4.12 AMBIGUITY FUNCTION


    The ambiguity function (AF) is the characteristic function of the Wigner-Ville
    distribution, defined mathematically as


    ```

    $$ \mathbf{A}_f(u,v) = \int_{-\infty}^{\infty} \int_{-\infty}^{\infty} e^{jut+jv\omega}
    W_f(t,\omega) dt d\omega. $$

    (4.79)

    ```'
