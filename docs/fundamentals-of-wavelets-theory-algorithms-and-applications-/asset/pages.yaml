  md: 'In the preceding chapters, we have used wavelets in the time (space) domain.
    In previous sections, the local support and vanishing moment properties of wavelet
    bases were used to obtain a sparse matrix representation of an integral equation.
    In some applications, particularly in the spectral domain methods in the electromagnetic
    problems, wavelets in the spectral domain may be quite useful. Whenever we have
    a problem in which the unknown function is expanded in terms of the basis function
    in the time domain while the numerical computation takes place in the spectral
    domain, we should look at the time-frequency window product to determine the efficiency
    of using the particular basis function. Because of the nearly optimal time (space-frequency
    wave number) window product of the cubic spline and the corresponding semiorthogonal
    wavelet, the double integral appearing in the transmission line discontinuity
    problems can be evaluated efficiently. In this section we consider an example
    from a transmission line discontinuity to illustrate the usefulness of wavelets
    in the spectral domain.


    Transmission line configurations are shown in Figure 10.3. Formulation of the
    integral equation for these configurations is not the purpose of this section.
    Readers may refer to [5, 29, 30] for details on such formulation. The integral
    equation obtained is


    ```

    (10.32) \(\int \Lambda(k_x, k_y) \hat{f}_1(k_y) \hat{\phi}_k(-k_y) dk_x dk_y =
    0\)

    ```


    **FIGURE 10.3:** (a) Open coupled-microstrip and (b) short-circuited coupled slot
    line with uniaxial substrate.'
