    # 9.8.3 EZW Code


    Initiated by Shapiro [14], the zerotree structure combined with bit plane coding
    is an efficient compression scheme for the discrete wavelet transformation. The
    *embedded zerotree wavelet* (EZW) coding scheme has proven its efficiency and
    flexibility in still image coding in terms of image quality and computation simplicity.
    Also, the EZW image coding algorithm generates an embedded bitstream in which
    information is sent to the decoder in the order of its importance; importance
    is judged by how much the information reduces the distortion of the reconstructed
    image. This embedded technique has two important advantages. First, the bit rate
    control allows one to stop the coding process at any point. Second, the image
    can be reconstructed from a point at which the encoded bitstream has been disrupted,
    even with reduced quality.


    As an entropy coder, the zerotree coder takes advantage of the correlation between
