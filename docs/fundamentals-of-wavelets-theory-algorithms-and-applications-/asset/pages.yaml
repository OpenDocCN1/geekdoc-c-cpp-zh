    ```

    w_{k, \ell} = a_{2k+1, \ell+1} - a_{2k, \ell+1}.

    ```


    As this step is repeated, it generates the approximation coefficient (the average)
    and wavelet coefficients (the difference) of the next lower resolution.


    It is easy to see that if we wish to reconstruct the signal from level \(\ell\)
    to \((\ell + 1)\), we simply solve for the values of \(a_{2k, \ell+1}\) and \(a_{2k+1,
    \ell+1}\), using the above equations to obtain


    ```

    (8.58) \(a_{2k+1, \ell+1} = a_{k, \ell} + \frac{w_{k, \ell}}{2},\)

