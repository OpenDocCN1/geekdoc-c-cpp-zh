    # 7.8 TWO-CHANNEL PERFECT RECONSTRUCTION FILTER BANK


    Many applications in digital signal processing require multiple band-pass filters
    to separate a signal into components whose spectra occupy different segments of
    the frequency axis. Examples of these applications include filter bank for Doppler
    frequencies in radar signal processing and tonal equalizer in music signal processing.
    Figure 7.18 demonstrates the concept of multiband filtering. In this mode of multiband
    filtering, the spectral'
  merge: -1
  img_proc: true
- pgno: 314
  md: 'bands corresponding to components of the signal may be processed with a different
    algorithm to achieve a desirable effect on the signal. In the case of Doppler
    processing and tonal equalizer, there is no need to reconstruct the original signal
    from the processed components. However, there is another form of filtering that
    requires the original signal to be recovered from its components: the subband
    filter banks. The major applications of subband filtering is in signal compression
    in which the subband components are coded for archiving or transmission purpose.
    The original signal can be recovered from the coded components with various degrees
    of fidelity.


    # FIGURE 7.18: Multiband filter bank.


    ![](img/f73ae67732328dc36596b27ffe8d0152_314_0.png)


    We use a basic two-channel PR filter bank to illustrate the main features of this
    algorithm. Filter bank tree structures can be constructed using this basic two-channel
    filter bank. A two-channel filter bank consists of an analysis section and a synthesis
    section, each consists of two filters. The'
  merge: -1
  img_proc: true
- pgno: 315
  md: 'analysis section includes high-pass and low-pass filters that are complementary
    to each other so that information in the input signal is processed by either one
    of the two filters. The block diagram for a two-channel PR filter bank is shown
    in Figure 7.19.


    # FIGURE 7.19: Two-channel perfect reconstruction filter bank.


    ![](img/f73ae67732328dc36596b27ffe8d0152_315_0.png)


    The perfect reconstruction condition is an important condition in filter bank
    theory. It establishes the unique relationship between the low-pass and high-pass
    filters of the analysis section. Removal of the aliasing caused by decimation
    defines the relations between the analysis and synthesis filters. We will elaborate
    these conditions in much greater detail below.


    The filters in a two-channel PR filter bank is specially designed so that the
    component signals may be reconstructed perfectly with no loss of information.
    The output of the filter bank is simply a delayed version of the input signal.
