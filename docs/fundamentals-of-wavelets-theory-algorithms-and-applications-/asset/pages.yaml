  md: '# 9.6.1 Two-Dimensional Wavelets


    When the input signal is 2D, it is necessary to represent the signal components
    by two-dimensional wavelets and a two-dimensional approximation function. For
    any scaling function \(\phi\) with its corresponding wavelet \(\psi\), we construct
    three different 2D wavelets and one 2D approximation function using the tensor-product
    approach. We write the 2D wavelets as


    ```

    (9.27) \(\Psi_{i,j}^{[1]}(x, y) = \phi(x - i)\psi(y - j),\)

    ```


    ```

    (9.28) \(\Psi_{i,j}^{[2]}(x, y) = \psi(x - i)\phi(y - j),\)

    ```


    ```

    (9.29) \(\Psi_{i,j}^{[3]}(x, y) = \psi(x - i)\psi(y - j),\)

    ```


    and the 2D scaling function as


    ```

    (9.30) \(\Phi_{i,j}(x, y) = \phi(x - i)\phi(y - j).\)

    ```


    \(\Psi_{i,j}^{[1]}(x, y), \Psi_{i,j}^{[2]}(x, y) \text{ and } \Psi_{i,j}^{[3]}(x,
    y) \text{ are all wavelets since they satisfy}\)


    ```

    \(\int_{-\infty}^{\infty} \int_{-\infty}^{\infty} \Psi_{i,j}^{[j]}(x, y) dx dy
    = 0, \text{ for } j = 1, 2, 3.\)

    ```


