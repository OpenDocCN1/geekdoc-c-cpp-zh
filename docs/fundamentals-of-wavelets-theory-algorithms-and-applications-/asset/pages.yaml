    # 4.11 QUADRATIC SUPERPOSITION PRINCIPLE


    We recall that WVD is a nonlinear distribution where the linear superposition
    principle does not apply. For instance, let a multicomponent signal be


    ```

    (4.76) f(t) = \sum_{k=1}^m f_k(t).

