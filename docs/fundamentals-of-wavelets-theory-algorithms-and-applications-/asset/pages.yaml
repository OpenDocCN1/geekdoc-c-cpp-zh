    is


    ```

    y = \begin{cases} sgn(x)(|x|-\sigma), & \text{if } x-\sigma \ge 0, \\ 0 & \text{if
    } |x|-\sigma < 0. \end{cases} (9.7)

    ```


    # 9.4 INTERFERENCE SUPPRESSION


    The Wigner-Ville distribution and other nonlinear time-frequency distributions
    are often used in radar signal processing. Although they are not linear transformations,
    they have an advantage in that a linear chirp signal appears as a straight line
    on the time-frequency plane (see Chapter 4). However, the nonlinear distribution
    of a multicomponent signal produces interference that may have a high amplitude
    to cover up the signal. This example combines the Wigner-Ville distribution decomposition
    and the wavelet packets to suppress the interference [4]. We take the signal with
    interference and decompose it optimally into frequency bands by a best basis selection
    [2]. We then apply the WVD decomposition to each of the wavelet packet signals.
    The cross terms are deleted in the distribution before reconstruction. This approach
    keeps the high resolution of WVD yet reduces the cross-term interference to a
    minimum.


    From the viewpoint of time-frequency analysis, an orthonormal (o.n.) wavelet \(\psi\)
    generates an o.n. basis \(\{\psi_{j,k}\}\), \(j, k \in \mathbb{Z}\), of \(L^2(R)\)
    in such a way that for each \(j \in \mathbb{Z}\), the subfamily \(\{\psi_{j,k}
    : k \in \mathbb{Z}\}\) is not only an o.n. basis of \(W_j\) but is also a time-frequency
    window for extracting local information within the \(j\)th octave band'
  merge: -1
  img_proc: true
