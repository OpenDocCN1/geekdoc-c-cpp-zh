  md: '# DWT and Filter Bank Algorithms


    The discussion on multiresolution analysis in Chapter 5 prepares the readers for
    understanding of wavelet construction, and algorithms for fast computation of
    the continuous wavelet transform (CWT). The two-scale relation and the decomposition
    relation are essential for the development of the fast algorithms. The need of
    these algorithm is obvious since a straightforward evaluation of the integral
    in (4.32) puts a heavy computation load in problem solving. The CWT places redundant
    information on the time-frequency plane. To overcome these deficiencies, the CWT
    is discretized and algorithms equivalent to the two-channel filter bank have been
    developed for signal representation and processing. The perfect reconstruction
    (PR) constraint is placed on these algorithm developments. In this chapter, we
    develop these algorithms in detail. Since the semiorthogonal spline functions
    and the compactly supported spline wavelets require their duals in the dual spaces,
    signal representation and the PR condition for this case are developed along with
    the algorithms for change of bases. Before we develop the algebra of these algorithms,
    we first discuss the basic concepts of sampling rate changes through decimation
    and interpolation.


    # 7.1 DECIMATION AND INTERPOLATION


    In signal processing, we often encounter signals whose spectrum may vary with
    time. A linear chirp signal is a'
  merge: -1
  img_proc: true
- pgno: 273
  md: 'good example. To avoid aliasing, this chirp signal must be sampled at least
    twice of its highest frequency. For a chirp signal with wide bandwidth, this Nyquist
    rate may be too high for the low frequency portion of the chirp. Consequently,
    there is a lot of redundant information to be carried around if one uses a fixed
    rate for the entire chirp. There is the area of multirate signal processing which
    deals with signal representation using more than one sampling rate. The mechanisms
    for changing the sample rate are decimation and interpolation. We discuss their
    basic characteristics in the time and spectral domains here.


    # 7.1.1 Decimation


    An M-point decimation retains only every Mth sample of a given signal. In the
    time-domain, an M-point decimation of an input sequence {x(n)} is given by


    ```

    (7.1) y(n) = x(nM), for n \in \mathbb{Z}.

    ```


    Figure 7.1 depicts the system diagram of an M-point decimator. The output of the
    decimator may be written in terms of a product of x(n) and a sequence of unit
    impulses separated by M samples \sum_{k \in \mathbb{Z}} \delta(n - kM) . Let


    ```

    (7.2) u(n) = \sum_{k \in \mathbb{Z}} x(n) \delta(n - kM), \text{for } k \in \mathbb{Z}

    ```


    # FIGURE 7.1: An M-point decimator.'
