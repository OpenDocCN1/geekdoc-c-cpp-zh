  md: '$O(N \log_2 N)$ operation with the well-known algorithm of *fast Fourier transform*
    (FFT). One of the commonly used FFT algorithms is by Danielson and Lanczos, according
    to which, assuming $N$ to be such that it is continuously divisible by 2, a DFT
    of data length $N$ can be written as a sum of two discrete Fourier transforms,
    each of length $N/2$. This process can be used recursively until we arrive at
    the DFT of only two data points. This is known as the Radix-2 FFT algorithm. Without
    getting into many details of the algorithm, which the interested reader can obtain
    from many excellent books available on these topics, we simply mention here that
    by appropriately arranging the data of length $N$ where $N$ is an integer power
    of 2 (known as decimation-in-time and decimation-in-frequency arrangements), we
    can compute the discrete Fourier transform in an $O(N \log_2 N)$ operation. If
    $N$ is not an integer power of 2, we can always make it so by padding the data
    sequence with zeros.


