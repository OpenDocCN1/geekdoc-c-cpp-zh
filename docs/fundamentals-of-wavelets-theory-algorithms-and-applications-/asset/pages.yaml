    # 10.8 DIFFERENTIAL EQUATIONS


    An ordinary differential equation (ODE) can be represented as


    ```

    (10.66) \( Lf(x) = g(x); \ x \in [0,1] \)

    ```


    with


    ```

    (10.67) \( L = \sum_{j=0}^{m} a_j(x) \frac{d^j}{dx^j} \)

    ```


    and some appropriate boundary conditions. If the coefficients \(\{a_j\}\) are
    independent of x then the solution can be obtained via a Fourier method. However
    in ODE case, with nonconstant coefficients, and in PDEs, we generally use finite
    element or finite difference type methods. In this section we describe wavelet-based
    method to solve differential equations and give a few examples illustrating such
    applications.


    # 10.8.1 Multigrid Method


    In the traditional finite element method (FEM), local bases are used to represent
    the unknown function and the solution is obtained by Galerkin''s method, similar
    to the approach described in previous sections. For the differential operator,
    we get sparse and banded stiffness'
  merge: -1
  img_proc: true
- pgno: 590
  md: 'matrices that are generally solved using iterative techniques, the Jacobi method
    for instance.


    One of the disadvantages of conventional FEM is that the condition number (κ)
    of the stiffness matrix grows as O(h⁻²) where h is the discretization step. As
    a result, the convergence of the iterative technique becomes slow and the solution
    becomes sensitive to small perturbations in the matrix elements. If we study how
    the error decreases with iteration in iterative techniques, such as the Jacobi
    method, we find that the error decreases rapidly for the first few iterations.
    After that, the rate at which the error decreases slows down [39]. Such methods
    are also called high-frequency methods since these iterative procedures have a
    “smoothing” effect on the high-frequency portion of the error. Once the high-frequency
    portion of the error is eliminated, convergence becomes quite slow. After the
    first few iterations, if we could rediscretize the domain with coarser grids and
    thereby go to lower frequency, the convergence rate would be accelerated. This
    leads us to a multigrid-type method.


    Multigrid or hierarchical methods have been proposed to overcome the difficulties
    associated with the conventional method [39–55]. In this technique, one performs
    a few iterations of the smoothing method (Jacobi-type) and then the intermediate
    solution and the operator are projected to a coarse grid. The problem is then
    solved at the coarse grid and by interpolation one goes back to the finer grids.
    By going back and forth between finer and coarser grids, the convergence can be
    accelerated. It has been shown for elliptic PDEs, that for wavelet-based multilevel
    methods, the condition number is independent of discretization step,'
  merge: -1
  img_proc: true
- pgno: 591
  md: 'that is, \(\kappa = O(1)\) [50]. The multigrid method is too involved to be
    discussed in this book. Readers are encouraged to look at the references provided
    at the end of this chapter.


    Multiresolution aspects of wavelets have also been applied in evolution equations
    [54–69]. In evolution problems, the space and time discretization are interrelated
    to gain a stable numerical scheme. The time-step must be determined from the smallest
    space discretization. This makes the computation quite complex. A space-time adaptive
    method has been introduced in [55], where wavelets have been used to adjust the
    space-time discretization steps locally. The rest of the discussion and results
    in this section are primarily derived from [69].


    # 10.8.2 Multiresolution Time Domain (MRTD) Method


    The explosive growth in wireless communications (3G cellular systems, 802.11 WLANs)
    has spawned a great deal of research in electronic packaging for high-performance
    devices. In addition, advances in device processing are enabling the creation
    of increasingly compact microwave circuits. These circuits incorporate a high
    degree of functionality through the combination of many microwave components in
    close proximity. These advanced devices often use geometries with high aspect
    ratios, small feature size, and moving parts. The simulation of these complex
    devices requires the use of extremely small elements or cells, which can tax many
    simulation tools beyond their limits. This has led to the use of a combination
    of methods, such as full-wave simulation and microwave circuit simulation, or,
    if higher numerical efficiency and accuracy are required, the use of a parallel'
  merge: -1
  img_proc: true
- pgno: 592
  md: 'full-wave simulator on specialized hardware. Time-domain full-wave techniques
    demonstrate numerous advantages since they are robust and easy to program. Furthermore,
    they can use broadband excitations that allow for one simulation to cover the
    entire frequency band of interest and can be easily parallelized on relatively
    inexpensive hardware making it possible to simulate large structures.


    The finite difference time domain (FDTD) [70, 71] method is one of the most mature
    and versatile time-domain numerical techniques, and it has been used for a wide
    variety of structures. The use of variable gridding along with effective parallelization
    approaches allows fine details of large structures to be modeled. Curves and diagonal
    elements can be modeled using stair stepping. The multiresolution time-domain
    technique [54, 57] is an adaptive generalization of the FDTD technique based on
    the principles of multiresolution analysis. It makes use of wavelets to alleviate
    the computational burdens of FDTD for complex or large structures, such as multilayer
    packages or microelectromechanical systems (MEMS), where the position of the boundaries
    is time-changing and the membrane thickness is much smaller than any other detail
    in the transverse direction. The MRTD technique allows the cell resolution to
    vary with both time and position. The wavelets can be used to represent higher
    levels of detail along with higher frequency content. As fields propagate through
    the structure the resolution can be varied to allow for the rapidly changing fields.


    The multiresolution time-domain technique uses wavelet discretization of Maxwell''s
    equations to provide a time- and space-adaptive electromagnetic modeling scheme.
    The'
  merge: -1
  img_proc: true
- pgno: 593
  md: 'advantage of this method is that it can use much larger cells than similar
    methods [56], such as FDTD. The number of basis functions used in each cell can
    be varied as a function of space and time [60]. In this way, grids of complex
    structures can use high-resolution cells in areas of large field variation and
    lower-resolution cells elsewhere.


    In the application of the method, the electric and magnetic fields are expanded
    into a scaling and wavelet functions and then inserted into Maxwell''s equations.
    The method of moments is then applied to these equations. This leads to a time-marching
    scheme much like the FDTD technique. The advantage of this technique over other
    methods is that wavelets can be added or subtracted during the simulation at any
    point in the grid. In this way the grid can react to both complex geometry and
    rapid changes in the field as it propagates through the grid. The choice of wavelet
    basis functions determines the characteristics of the MRTD scheme. The Battle-Lemarié,
    Daubechies and other wavelet basis (e.g., biorthogonal wavelets [61]) have been
    successfully applied and demonstrated significant savings in memory and execution
    time requirements by one and two orders of magnitude respectively [62–66] compared
    with FDTD technique. The stability and dispersion performance of entire-domain
    (e.g., Battle-Lemarié) MRTD schemes have been investigated for different stencil
    sizes [67]. Analytical expressions for the maximum stable time step have been
    derived. Larger stencils decrease the numerical phase error, making it significantly
    lower than FDTD for low and medium discretizations. Stencil sizes greater than
    10 offer a smaller phase error than FDTD even for discretizations close to 50
    cells/ wavelength. The enhancement of wavelets further'
  merge: -1
  img_proc: true
- pgno: 594
  md: 'improves the dispersion performance for discretizations close to the Nyquist
    limit (23 cells/wavelength), making it comparable to that of much denser grids
    (10–15 cells/ wavelength), though it decreases the value of the maximum time step
    guaranteeing the stability of the scheme.


    The finite-domain Haar basis functions provide a convenient tool for the transition
    from FDTD to MRTD due to their compact support and their similarity with the FDTD
    pulse basis, thus providing an effective demonstration tool for this section.
    The Haar wavelet family is in many ways one of the simplest; however, it has many
    properties that make its application to practical structures favorable [56]. Most
    importantly, it has finite domain and when reconstructed leads to finite areas
    of constant field value (equivalent grid points [58]). Using this property, it
    is possible to apply pointwise effects in the MRTD grid when an arbitrary level
    of Haar wavelets is used. To clearly present the MRTD method, a brief derivation
    of 2D Haar-MRTD is presented. The extension to 3D and other basis functions is
    straightforward.


    # 10.8.3 Haar-MRTD Derivation


    Haar scaling functions and wavelets are based on pulses in space. As described
    in previous chapters, for this case, the inner product of any wavelet with any
    other wavelet at any resolution level, or with the scaling function, is 0. We
    assume that the highest resolution level is rmax. Electromagnetic fields are expanded
