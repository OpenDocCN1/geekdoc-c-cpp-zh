    # 2.8.5 Region of Convergence


    The variable \(z\) in the z-transform is complex valued. The z-transform, \(X(z)
    = \sum_{n=-\infty}^{\infty} x(n) z^{-n}\), may not converge for some values of
    \(z\). The region of convergence (ROC) of a z-transform indicates the region in
    the complex plane in which all values of \(z\) make the z-transform converge.
    Two sequences may have the same z-transform but with different regions of convergence.


