    representation of delta function (3.25). The delta function requires an infinite
    number of sinusoidal functions that combine constructively at t = 0 while interfering
    with one another destructively to produce zero at all points t != 0. This shows
    the extreme cumbersomeness and ineffectiveness of using global functions e^{jot}
    to represent local functions. To correct this deficiency, a local analysis is
    needed to combine both the time-domain and the frequency-domain analyses to achieve
    time-frequency analysis, by means of which we can extract the local frequency
    contents of a signal. This is very important, since in practice we may be interested
    in only some particular portion of the spectrum and, therefore, we may like to
    know which portion of the time-domain signal is primarily responsible for a given
