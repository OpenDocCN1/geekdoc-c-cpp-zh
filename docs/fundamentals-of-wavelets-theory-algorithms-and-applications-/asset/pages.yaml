  md: 'only at binary scales may not be appropriate to separate all

    the frequency contents of a function.


    An algorithm for computing the IWT with finer time

    resolution was introduced and studied by Rioul and

    Duhamel [2] and Shensa [3]. In addition, there have been

    some advances in fast computation of the IWT with finer

    frequency resolution, such as the multivoce per octave

    (mvpo) scheme, first introduced in Ref. [4] (see also [Ref.

    5]) and later improved with the help of FFT by Rioul and

    Duhamel [2]. However, the computational complexity of

    the mvpo scheme, with or without FFT, increases with

    the number of values of the scale parameter a. For example, in

    the FFT-based computational scheme, both the signal and

    the analyzing wavelet have to be sampled at the same rate,

    with the sampling rate determined by the highest

    frequency content (or the smallest scale parameter) of the

    signal, and this sampling rate cannot be changed at the

    subsequent larger scale values for any fixed signal

    discretization. Furthermore, even at the highest frequency

    level, where the width of the wavelet is the narrowest in

    the time domain, the required number of sampled data for

    the wavelet will be significantly larger than the number of

    decomposition coefficients in the pyramid algorithm.


    In this chapter, we will discuss the fast integral wavelet

    transform (FIWT). Other wavelets and algorithms such as

    ridgelets, curvelets, complex wavelets, and lifting

    algorithm are briefly described.


