    # 9.4.1 Best Basis Selection


    Equation (9.8) is actually a special case of


    $$W_j = U_{j-k}^{2^k} \oplus U_{j-k}^{2^k+1} \oplus \dots \oplus U_{j-k}^{2^{k+1}-1}$$

    (9.15)


    when \( k = j \) Equation (9.15) means that the \( j \)th frequency band \( H_j
    \) can be partitioned into \( 2^k, k=0, 1, \dots, j \), subbands


    $$H_j^{k,m}, m=0, \dots, 2^k-1.$$

    (9.16)


    The uniform division of the frequency axis and the logarithmic division for wavelets
    are just two extreme cases, when \( k \) in (9.16) takes on the values of \( j
    \) and 0, respectively. In fact, \( k \) is allowed to vary among \( H_j, j=1,
    2, \dots \), so that the subbands adapt to (or match) the local spectra of the
    signal and thereby yield the best'
  merge: -1
  img_proc: true
- pgno: 439
  md: 'representation or the best basis of the signal. The best basis can be obtained
    by minimizing the global cost functional or entropy. Specifically, the following
    algorithm is used in [2] to find the adapted frequency subband or the equivalent
    best basis


    ```

    (9.17)

    \(\tilde{H}_j^{k,m} = \begin{cases} H_j^{k,m} & \text{if } E(H_j^{k,m}) < E(H_j^{k+1,2m})
    + E(H_j^{k+1,2m+1}) \\ \tilde{H}_j^{k+1,2m} \cup \tilde{H}_j^{k+1,2m+1} & \text{otherwise,}
    \end{cases}\)

    ```


    where \(\tilde{H}_j^{k,m}\) represents the adapted frequency subband, and \(E(H_j^{k,m})\)
    denotes the entropy of the local spectrum of the signal restricted to the \(H_j^{k,m}\).


    Although the minimum entropy-based best basis is useful for applications to segmentation
    in speech processing, it is not effective in our case, since the resultant distribution
    yields interference. We modify the algorithm to yield


    ```

    \(\tilde{H}_j^{k,m} = \begin{cases} H_j^{k,m} & \text{if } Var(H_j^{k,m}) < \sigma
    \\ \tilde{H}_j^{k+1,2m} \cup \tilde{H}_j^{k+1,2m+1} & \text{otherwise,} \end{cases}\)

    ```


    where \(Var(H_j^{k,m})\) denotes the variance of the local spectrum, and \(\sigma\)
    is a preset threshold. The idea behind this algorithm is that a narrow analysis
    band should be used when the local spectrum is well concentrated or when a'
  merge: -1
  img_proc: true
- pgno: 440
  md: 'small variance is obtained, while a wide band should be used when the local
    spectrum is spread or variance is large. We note in passing that a best basis
    is usually obtained between the third layer and the fourth layer, since deeper
    layers may yield some adverse effects due to the amplitude increase in their spectral
    sidelobes.


    Once we have chosen a best basis, the signal is readily expressed as


    ```

    s(t) = \sum_{j=1}^{\infty} \sum_{m=0}^{2^k-1} \sum_{n=-\infty}^{\infty} d_n^{j,k,m}
    \mu_{s^k+m}(2^{j-k}t-n)

    = \sum_{j,m} s''_{j,m}(t),

    (9.18)

    ```


    where


    ```

    d_n^{j,m} = \langle s(t), \mu_{z^k+m}(2^{j-k}t-n) \rangle \text{ and }

    s''_{j,m}(t) = \sum_n d_n^{j,k,m} \mu_{2^k+m}(2^{j-k}t-n).

    (9.19)

    ```


    The WPCDR with a best basis selection is given by


    ```

    WPCDR_s(t, f) = \sum_{j,m} WVD_{s''_{j,m}}(t, f).

    (9.20)

    ```


