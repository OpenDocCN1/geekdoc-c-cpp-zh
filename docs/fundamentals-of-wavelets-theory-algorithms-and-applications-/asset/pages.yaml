- pgno: 505
  md: '![](img/f73ae67732328dc36596b27ffe8d0152_505_0.png)


    After a single 3D level wavelet transform, the volume data would be decomposed
    into eight blocks, as shown in Figure 9.39. The 3D volume can be approximated
    by using


    ```

    $$a^{j+1}(x, y, z) = \sum_{n,m,l} a^j_{n,m,l} \phi(2^j x - n, 2^j y - m, 2^j z
    - l)$$

    ```


    where \(\phi(x, y, z) = \phi(x)\phi(y)\phi(z)\) and \(a^j_{n,m,l}\) is the scaling
    function coefficients. We can add the _details_ by adding the 3D wavelet functions
    at the resolution \(2^j\) such as'
  merge: -1
  img_proc: true
