  md: 'compute the difference (odd-even) first and then the average:


    ```

    \begin{cases} w_{k,\ell} = a_{2k+1,l+1} - a_{2k,l+1} \\ a_{k,\ell} = a_{2k,l+1}
    + \frac{w_{k,\ell}}{2} \end{cases}

    ```


    This is the lifting approach for the Haar wavelet transform of a one-dimensional
    signal. The process can be summarized in three simple steps:


    +   1. The S-step splits (or unzips) the signal into an even and an odd sample
    paths.


    ```

    x(k) = a_{m,n} \rightarrow \begin{cases} Even path \rightarrow a_{2k,n} \\ Odd
    path \rightarrow a_{2k+1,n} \end{cases}

    ```


    Notice that each path carries only half of the total number of samples in the
    original signal.


    +   2. The P-step predicts the odd samples based on the even samples. At certain
    $(l+1)^{th}$ resolution of the Haar wavelet analysis, the lifting scheme assumes
    the predicted odd value to be the same as its preceding even value.


    ```

    \tilde{a}_{2k+1,l+1} = a_{2k,l+1}.

    ```


    At this point, the wavelet coefficients (difference) of the next lower resolution
    is computed by


    ```

    w_{k,l} = a_{2k+1,l+1} - \tilde{a}_{2k+1,l+1} = a_{2k+1,l+1} - a_{2k,l+1}.

    ```'
