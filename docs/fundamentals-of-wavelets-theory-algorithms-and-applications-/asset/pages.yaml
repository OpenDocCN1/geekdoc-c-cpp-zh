    # 2.2 VECTORS AND VECTOR SPACES


    Based on the basic concepts of functional spaces discussed in the previous section,
    we now present some fundamentals of vector spaces. We begin with a brief review
    of geometric vector analysis.


    A vector \(V\) in a three-dimensional Euclidean vector space is defined by three
    complex numbers \(\{v_1, v_2, v_3\}\) associated with three orthogonal unit vectors
    \(\{a_1, a_2, a_3\}\).


    The ordered set \(\{v_j\}_{j=1}^3\) represents the scalar components of the vector
    \(V\) where the unit vector set \(\{a_j\}_{j=1}^3\) spans the three-dimensional
    Euclidean vector space. Any vector \(U\) in this space can be decomposed into
    three vector components \(\{u_j a_j\}_{j=1}^3\) (Figure 2.1d).


