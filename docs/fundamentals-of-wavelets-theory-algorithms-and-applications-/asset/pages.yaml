    (9.26) \( \mathbf{v}^{(ff)} = \{ v_1^{(ff)} \, v_2^{(ff)} \, \dots \, v_{13}^{(ff)}
    \}^t \).


    After the feature vectors have been obtained, we apply the feature vector normalization
    to separate the vectors farther apart to improve performance of recognition. These
    vectors are used to train an ANN. There are three hidden neurons in this ANN.
    Details of construction and training of the ANN are beyond the scope of this text,
    and we refer the interested reader to Ref. 6.


    # Results:


    The recognition results obtained using the wavelet techniques combined with the
    ANN are astounding. Every fault in every class is identified using the unused
    (not for training) portion of each data set. In fact, the two mystery (unknown)
    bearings containing more than one fault are all identified. Although the traditional
    FFT approach produces'
  merge: -1
  img_proc: true
- pgno: 450
  md: 'roughly the same results as the wavelet approach, it fails to recognize the
    unknown bearing by missing one of the two faults. We conclude that the new feature
    extraction methods using DWT and WP are comparable if not superior to the FFT
    approach. The FFT lacks the time-domain information and thus misses some of the
    more localized faults.


    The feature vector normalization and conditioning play a key role in the convergence
    of the neural network while training. Without the normalization, the network does
    not converge to the desired network error. Convergence of the network produces
    the biases and the weights necessary for the testing of the real data. Three hidden
    layers are used to improve the convergence. The results are collectively given
