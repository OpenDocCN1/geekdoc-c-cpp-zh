- pgno: 414
  md: 'More sophisticated algorithms are available for interpolative subdivision.
    One can use more known values (original data values) adjacent to the desirable
    data point location to compute its value. If we use four-point values ($a_{k-1,j},
    a_{k,j}, a_{k+1,j}, a_{k+2,j}$) and use a cubic interpolation to compute the value
    of $a_{2k+1,j+1}$, the resulting value is a weighting of the 4 original values


    ```

    (8.75)


    a_{2k+1,j+1} = \frac{-1}{16}a_{k-1,j} + \frac{9}{16}a_{k,j} + \frac{9}{16}a_{k+1,j}
    + \frac{-1}{16}a_{k+2,j}.

    ```


    This is known as the four-point scheme in computer graphics.


    The interpolative subdivision is a very simple yet powerful algorithm to refine
    a set of data. A new sample value at a given location is computed via an interpolating
    polynomial constructed by using near by sample values. If the samples are equidistant,
    the weights for the polynomial need to be computed only once. Since equidistant
    sample is not a requirement for subdivision, it can be used for defining approximation
    basis and wavelet basis on irregular grid points.


    Another scheme for subdivision is the interpolating average algorithm. The simplest
    algorithm for the new value at the higher resolution is


    ```

    $a_{2k,j+1} = a_{j,k}$

    $a_{2k+1,j+1} = a_{j,k}$

    ```'
