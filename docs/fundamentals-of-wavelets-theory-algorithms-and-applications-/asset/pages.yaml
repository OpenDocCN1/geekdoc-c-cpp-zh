  md: '# 10.8.5.1 CPW-Microstrip Transition.


    The coplanar waveguide (CPW)-microstrip transition is shown in Figure 10.16. The
    loss of this transition can be optimized over a wide frequency range with the
    use of FDTD and design curves for various packaging specifications can be derived.
    The plot in Figure 10.17 shows S21 of this transition for a variety of lengths
    of the central straight section from 10 to 20 GHz. These data were obtained using
    time-domain voltage probes at the input (V1) and output (V2) of the transition,
    converting them to frequency domain through the use of a discrete Fourier transform
    and identifying the reflected voltage through the use of a reference input voltage
    (Vref) derived by the simulation of a through CPW line [69]. In addition, the
    use of the full-wave FDTD, that provides the values of all electromagnetic components
    throughout the geometry, offers a more intuitive visualization of the circuit.
    For example, in the transition zone the electric fields have to change smoothly
    from a coplanar waveguide mode to a microstrip mode, to minimize the local reflections.
    Thus in the design process it is desirable to identify where this transition takes
    place and optimize the tapering. Figure 10.16 is a plot of total electric field
    for a transverse cross-section of the transition. It can be seen that at the position
    of this cross-section, the field is mostly in a CPW mode, though a microstrip
    mode has started developing below and at the edges of the signal line there. The
    relative amplitudes of the E-field could provide an intuitive design rule for
    the spacing between the CPW ground and signal line, so as not to suppress the
    microstrip mode.'
