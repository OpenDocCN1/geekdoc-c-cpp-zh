    # 8.2 RIDGELET TRANSFORM


    One-dimensional wavelet transforms are very good in detecting point discontinuities
    (Figure 8.11) in the sense that wavelet coefficients near the discontinuity are
    significantly higher than those at the smooth region. For a two-dimensional function—an
    image, for instance—discontinuities are represented by edges. We can construct
    a two-dimensional wavelets by simply taking the tensor product (more on edges
    and two-dimensional wavelets in the next chapters) and compute wavelet coefficients.
    However, these edges, while separating smooth regions, are themselves smooth curves.
    As a result,'
  merge: -1
  img_proc: true
- pgno: 390
  md: 'a direct applications of 2D wavelets will not be able to localize coefficients
    near the edges as a 1D wavelet transform does.


    To overcome the difficulties of wavelets in effectively localizing edges in higher
    dimensions, ridgelet and curvelet transforms [11–14] have been developed. Ridgelet
    transform essentially projects a line discontinuity into a point discontinuity
    and then takes its wavelet transform. For a 2D smooth function f(x, y), the continuous
    ridgelet transform, C_f(b, a, θ), is defined by


    ```

    (8.38) $$C_f(b, a, \theta) := \int_{-\infty}^{\infty} \int_{-\infty}^{\infty}
    f(x, y) \psi_{b,a,\theta}(x, y) dx dy$$

    ```


    where the ridgelets, \(\psi_{b,a,\theta}(x, y)\), are defined in terms of wavelet
    functions as


    ```

    (8.39) $$\psi_{b,a,\theta}(x, y) := \frac{1}{\sqrt{a}} \psi \left( \frac{x \cos
    \theta + y \sin \theta - b}{a} \right).$$

    ```


    Figure 8.22 shows an example of ridgelets. The expression in (8.38) can be thought
    of as a combination of Radon transform, and the wavelet transform in 1D. Radon
    transform is an integral transform that gives projection of a 2D function along
    a straight line at a desired angle. It''s widely used in tomography. It has also
    been extended to higher-dimensional space. The Radon transform of a function f(x,
    y) is given by'
  merge: -1
  img_proc: true
- pgno: 391
  md: '```

    (8.40)

    \( R_f(t, \theta) = \int_{-\infty}^{\infty} \int_{-\infty}^{\infty} f(x, y) \delta(x
    \cos \theta + y \sin \theta - t) dx dy. \)

    ```


    # FIGURE 8.22: An example of a ridgelet using Daubechies wavelet.


    ![](img/f73ae67732328dc36596b27ffe8d0152_391_0.png)


    By combining (8.38) and (8.40) it is easy to verify that


    ```

    (8.41)

    \( C_f(b, a, \theta) = \int_{-\infty}^{\infty} R_f(t, \theta) \overline{\psi_{b,a}(t)}
    dt, \)

    ```


    where as before, \(\psi_{b,a}(t) = a^{-1/2}\psi((t-b)/a)\). Therefore, ridgelet
    transform is obtained by applying a 1D wavelet transform to the slices or projections
    of a 2D function'
  merge: -1
  img_proc: true
- pgno: 392
  md: 'obtained via Radon transform. We notice that the ridgelet is constant along
    lines that satisfy


    (8.42) \( x \cos \theta + y \sin \theta = const, \)


    whereas the direction orthogonal to the line contains a 1D wavelet \(\psi\). The
    ridgelet transform is the wavelet transform applied in the direction orthogonal
    to the lines. By setting the angle \(\theta = 0\), the ridgelet transform is reduced
    to the wavelet transform


    (8.43) \( C_f(b, a, \theta = 0) = W_\psi f(b, a) = \frac{1}{\sqrt{a}} \int_{-\infty}^{\infty}
    f(x, y_0) \overline{\psi\left(\frac{x-b}{a}\right)} dx, \)


    Hence, by varying the angle \(\theta\) and the parameter \(b\) and by applying
    the ridgelet transform over the 2D plane, the higher ridgelet coefficients indicate
    locations of line singularities of the function \(f(x,y)\).


    The 2D function \(f(x,y)\) is uniquely recovered by the inverse transform involving
    a triple integral


    (8.44) \( f(x, y) = \frac{1}{4\pi a^3} \int_{-\infty}^{\infty} \int_0^{\infty}
    \int_0^{2\pi} C_f(b, a, \theta) \times \psi\left(\frac{x \cos \theta + y \sin
    \theta - b}{a}\right) d\theta da db. \)


    Computation of the integral ridgelet transform is very cumbersome and inefficient.
    Analogous to the discrete wavelet transform (DWT) we have discrete ridgelet transform
    (DRT) to efficiently implement the continuous ridgelet transform using discrete
    samples. Several'
  merge: -1
  img_proc: true
- pgno: 393
  md: 'approaches have been proposed with different degrees of efficiency and accuracy,
    depending on the discretization of the 2D image into a polar grid for the DRT.
    We give a brief outline of a method based on projection, transformation, and FFT.


    +   1. Use 2D FFT to transform the image in frequency domain.


    +   2. Change the grid point locations into polar coordinates using rectangle-to-polar
    conversion.


    +   3. Determine the equidistance grid points along a radial line at different
    angle using an interpolation scheme. The number of angular directions give the
    number of projections; the number of points along a radial direction correspond
    to the number of shifts in the wavelet transform.


    +   4. Compute the 1D inverse FFT along the radial direction; this gives the Radon
    transform of the image along that radial direction.


    +   5. Take the 1D DWT to obtain the ridgelet transform.


    Improvements can be made in the steps of this algorithm such as choosing the rectangular
    grid points to simplify the interpolation and choosing a band-limited wavelet
    so that the ridgelet transform can be directly computed in the Fourier space instead
    of the Radon space.


    # 8.3 CURVELET TRANSFORM'
