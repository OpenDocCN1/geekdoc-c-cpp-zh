  md: '# CHAPTER FOUR


    # Time-Frequency Analysis


    We summarized rather briefly the Fourier analysis in the last chapter to refresh
    the memory of the reader and to point out a few important concepts in the analysis
    that will be useful when we discuss the time-frequency analysis. We observe from
    the definition of the Fourier transform (3.19) that the integration cannot be
    carried out until the entire waveform in the whole of the real line (-∞, ∞) is
    known. This is because the functions e^(jωt) or cos ωt and sin ωt are global functions.
    By this we mean that a small perturbation of the function at any point along the
    t-axis influences every point on the ω-axis and vice-versa. If we imagine the
    signal f(t) as the modulating function for e^(jωt), then a perturbation at any
    point on the t-axis will propagate through the entire ω-axis. Another observation
    we make on the Fourier transform is that the integral can be evaluated at only
    one frequency at a time. This is quite inconvenient from a signal-processing point
    of view. Although there are fast algorithms to compute the transform digitally,
    it cannot be carried out in real time. All necessary data must be stored in the
    memory before the discrete or fast Fourier transform can be computed.


    Although unquestionably the most versatile method, Fourier analysis becomes inadequate
    when one is interested in the local frequency contents of a signal. In other words,
    the Fourier spectrum does not provide any time-domain information about the signal.
    To demonstrate this point, let us examine the function shown in Figure'
  merge: -1
