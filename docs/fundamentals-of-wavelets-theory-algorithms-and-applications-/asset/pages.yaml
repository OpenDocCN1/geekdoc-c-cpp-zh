    by the support of \( W(2^{-j}\cdot) = [2^{-1}, 2^{1}] \) and the support of \(
    V(2^{|j/2|}\cdot) = [-2^{-|j/2|}, 2^{-|j/2|}] \). The transforms \( W \) and \(
