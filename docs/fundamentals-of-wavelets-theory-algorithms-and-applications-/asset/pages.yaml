    represents the signal content of \( s(t) \) within the \( m \)th subband of the
    \( j \)th band.


    Let us rewrite the WVD for a multicomponent signal,


    ```

    \( WVD_s(t, f) = \sum_{j,m} WVD_{s_{j,m}}(t, f) \quad + 2 \sum_{j,m,k,n: m \neq
    n; j \neq k} WVD_{s_{j,m}, s_{k,n}}(t, f). \)

