  md: '# 9.6.4 Wavelet Packet Algorithm


    The 2D wavelet packet algorithm mimics the 1D case. It simply repeats the algorithms
    first along the x direction and then the y direction. Not only is the LL component
    (the approximation function component) decomposed to obtain further details of
    the image but the other wavelet components (LH, HL, HH) are also further decomposed.
