    decomposition of this image will result in four subimages of size 128 × 128. Continuing
    the decomposition, one gets 16 2D wavelet packet subimages of size 64 × 64. The
    computational algorithm for 2D wavelet packets is no more difficult than that
    for the 2D wavelets. It requires orderly bookkeeping to keep track of the directions
    (x or y), and the filters that have been used in processing. It is necessary to
    reverse the order to reconstruct the image from its wavelet packet components.
