    # 9.7.4 Wavelet Edge Detector


    As mentioned in previous chapters, wavelets acts in some sense as differential
    operators (band-pass filters). The simplest example is the Haar wavelet, which
    gives the first difference of a function.


    Wavelet edge detection is based on two-dimension wavelet transform of the image.
    Recall from Section 9.6 that at any resolution level, 2D wavelet transform provides
    four components of an image—LL, which results from convolving with scaling functions
    (low-pass) along both x and y directions; LH (scaling function along x and wavelet
    along y); HL (wavelets along x and scaling function along y); and HH (wavelets
    along both directions). Component LL represent the image at lower resolution,
    whereas the other three combined together gives the edges.


    As described in Chapter 6, wavelets are very good in detecting point discontinuity.
    Edges, on the other hand, represent discontinuity along a line. For edge detection,
    therefore, ridgelet transforms are better suited. However evaluation of ridgelet
