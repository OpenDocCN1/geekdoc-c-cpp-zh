  md: 'schemes. They will have to be constructed based on the schemes. Unlike the
    classical wavelet construction where the Fourier analysis is used extensively,
    in lifting schemes, subdivision algorithms are often used in the literature. These
    are important techniques in computer-aided curve and surface designs. A detail
    exposition on the topic is beyond the scope of this section. We will use only
    the elementary ones to demonstrate the procedure of wavelet construction from
    lifting.


    # 8.5.3 Linear Interpolative Subdivision


    Subdivision is a method of refining a set of original data (i.e., to increase
    the number of data points by suitably inserting data in between two original data
    points). Interpolative subdivision means that the original data points are not
    changed by running the algorithm. One simple way to subdivide data is by using
    the average of the adjacent value as the new (inserted) data value. Let \(\{a_{k,0}\}\)
    be the original data set. We compute the expanded set by


    ```

    (8.73) \(a_{2k, j+1} = a_{k, j}\)

    ```


    ```

    (8.74) \(a_{2k+1, j+1} = \frac{1}{2}(a_{k, j} + a_{k+1, j}).\)

    ```


    The new data points are inserted halfway between two adjacent old data points.
    Its value is the linear interpolation of the two adjacent old values. If the original
    data values are samples from linear functions, this linear subdivision algorithm
    will reproduce the linear functions.'
