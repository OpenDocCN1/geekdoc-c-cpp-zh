    the phase condition of (8.56); however, the filters should be designed such that
    spectral amplitudes are approximately the same.


    # 8.4.2 Quarter-Shift Approach


    In the quarter-shift (q-shift) method, the filter length $N$ of $h_0(n)$ is chosen
    as even and $g_0(n)$ is set to be


    ```

    (8.57) $g_0(n) = h_0(N-1-n)$.

