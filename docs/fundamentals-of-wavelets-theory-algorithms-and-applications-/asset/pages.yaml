    The integral wavelet transform of a function gives local time-scale information.
    To get the time-frequency information, we need to map the scale parameter to frequency.
    There is no general way of doing so. However, as a first approximation, we may
    consider the following mapping,


    ```

    (8.36) \(a \mapsto f := \frac{c}{a},\)

    ```


    where \(c > 0\) is a calibration constant. In this book, the constant \(c\) has
    been determined based on the one-sided center (\(\omega_+^*\)) and one-sided radius
    (\(\Delta\hat{\Psi}_+\)) of the wavelet \(\hat{\psi}(\omega)\), which are defined
