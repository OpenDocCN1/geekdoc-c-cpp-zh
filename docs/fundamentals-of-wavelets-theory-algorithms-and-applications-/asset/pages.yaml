    # 6.4.3 Battle-Lemarié Scaling Function


    Battle-Lemarié [5, 6] scaling functions are constructed by orthonormalizing the
    \(m\)th order cardinal \(B\)-spline \(N_m(t)\) for \(m \ge 2\). As pointed out
    before, the set of basis functions \(\{N_m(t-k): k \in \mathbb{Z}\}\) is not orthogonal
    for \(m \ge 2\). The corresponding orthonormal scaling function \(N_m^\perp(t)\)
    can be obtained as


    ```

    \(\hat{N}_m^\perp(\omega) = \frac{\hat{N}_m(\omega)}{[E_{N_m}(e^{-j\omega})]^{1/2}}.\)


    **(6.53)**

    ```


    The Battle-Lemarié (B-L) scaling function \(\phi_{BL,m}(t)\) is, then,


    \(\phi_{BL,m}(t) = N_m^\perp(t),\)'
