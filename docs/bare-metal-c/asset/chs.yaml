  \ \"stm32f11.h\"\n#include \"stm32f12.h\"\n#include \"stm32f13.h\"\n#include \"\
  stm32f14.h\"\n#include \"stm32f15.h\"\n#include \"stm32f16.h\"\n#include \"stm32f17.h\"\
