  \ `ranlib` 这个名字）。\n\n现在加载组件的算法如下：\n\n1. 查看未定义符号列表（程序使用了 `b_funct`，所以它是未定义的）。\n2.\
  \ 打开归档。\n3. 我们是否有一个在目录中的未定义符号？\n4. 如果有，加载它。\n5. 重复直到我们没有更多可以由该库满足的符号。\n\n这个过程解决了顺序问题，因为目录使得一切都可访问。\n\
  \n以下命令实际上将库与我们的程序链接：\n\n```\nsquare: square.o libsquare.a\n        $(CC) $(CFLAGS)\
  \ -o square square.o -L. -lsquare\n```\n\n`-L.` 标志告诉链接器在当前目录（`.`）搜索库文件。否则，只搜索系统库目录。库本身通过\
  \ `-lsquare` 指令指定。链接器寻找名为 `libsquare.a` 的库，首先在当前目录中（因为有 `-L.`），然后在系统目录中。\n\nListing\
  \ 17-17 显示了该项目的完整 Makefile。\n\n```\nCFLAGS=-g -Wall -Wextra\n\nall: square\n\nsquare:\
  \ square.o libsquare.a\n        $(CC) $(CFLAGS) -o square square.o -L. -lsquare\n\
  \nlibsquare.a: libsquare.a(square_int.o) \\\n        libsquare.a(square_float.o)\
  \ libsquare.a(square_unsigned.o)\n        ranlib libsquare.a\n\nlibsquare.a(square_int.o):\
  \ square_int.o\n       ar crU libsquare.a square_int.o\n\nlibsquare.a(square_float.o):\
  \ square_float.o\n        ar crU libsquare.a square_float.o\n\nlibsquare.a(square_unsigned.o):\
  \ square_unsigned.o\n        ar crU libsquare.a square_unsigned.o\n```\n*Listing\
  \ 17-17: 完整的 Makefile*\n\n### 确定性 vs 非确定性库\n\n理想情况下，如果你运行 `make`，生成的二进制文件应该是相同的，无论何时何时的。由于这种原因，最初的库文件并不存储创建信息。然而，这给\
  \ `make` 程序带来了一些困难。如果归档不存储日期，它如何判断你编译的版本是新是旧？`ar` 命令被修改以存储这些信息。因为此功能破坏了现有功能，`ar`\
  \ 的维护者决定将存储信息设为可选。默认关闭。\n\n### 弱符号\n\n到为止，我们定义的模块总是加载其函数和变量。换句话之，如果一个模块定义了 `doIt`\
  \ 函数，那就是该函数的唯一定义。GCC 和大多数其他编译器提供的 C 语言扩展允许使用弱符号。弱符号告诉链接器：“如果没有人定义此符号，就使用我的。”\n\n\
  弱符号使用的一个例子是在 STM 中断表中。你必须为每个中断定义函数；硬件是要求的。所以你必须为从未发生的中断编写中断路由。由于函数永远不会被调用，这应该会让事情变得简单。\n\
  \n然而，STM 固件的设计理念是，虽然禁用的中断*应该*不被调用，但这并不意味着它们*永远不会*被调用。STM 固件定义了会导致系统崩溃的中断处理器。如果它们真的被调用，你的系统就会停止，你有机会进入调试器并找出原因。\n\
  \n只有当你开启中断但没有提供自己的中断处理程序时，才会调用默认中断处理程序。在这种情况下，默认中断知道发生了错误并一直停在那里等待你解决。\n\n来自 USART2\
  \ 中断的 STM 中断处理器是 `USART2_IRQHandler` 函数，其定义如下：\n\n```\nvoid USART2_IRQHandler(void)\
  \ {\n    while(true)\n        continue;\n}\n```\n\n然而，如果我们定义了自己的，固件库中的那个就会消失，尽管同一模块中的其他\
  \ 40 多个中断函数仍会被加载。\n\n\n\n\n让我们通过自己的代码来实际观察一下。在列表 17-18 和 17-19 中，我们有了 `sub1` 和 `sub2`，其中\
  \ `sub2` 定义了两次（一次在 `main.c` 中，一次在 `sub.c` 中）。当链接器查看这两个文件时，它会说：“这里有两个 `sub2` 函数。我应该报错吗？不。其中一个是弱符号（weak），我可以把它丢弃。”\
  \ `main.c` 中的 `sub2`会被链接进来，而 `sub.c` 中的则不会。\n\n我们首先定义一个主程序，其任务是调用我们的两个子程序（参见列表 17-18）。\n\
  \n#### main.c\n\n```c\n#include \"sub.h\"\n\nint main()\n{\n    sub1();\n    sub2();\n\
  \    return (0);\n}\n```\n\n列表 17-18：调用两个子程序的主程序\n\n在列表 17-19 中，我们通过 GCC 扩展告诉编译器\
  \ `sub.c` 中的 `sub2` 是弱符号。\n\n#### sub.c\n\n```c\n#include \"sub.h\"\n\nvoid sub2(void)\
  \ __attribute__((weak));\n\nvoid sub1(void) {}\nvoid sub2(void) {}\n```\n\n列表 17-19：告诉编译器\
  \ `sub2` 是弱符号\n\n接下来，我们需要一个头文件，所以让我们生成一个（参见列表 17-20）。\n\n#### sub.h\n\n```c\n#ifndef\
  \ __SUB_H__\n#define __SUB_H__\nextern void sub1(void);\nextern void sub2(void);\n\
  #endif // __SUB_H__\n```\n\n列表 17-20：头文件\n\n最后，我们在列表 17-21 中定义了我们自己的 `sub2` 函数。\n\
  \n#### sub2.c\n\n```c\n#include <stdio.h>\n#include \"sub.h\"\n\nvoid sub2(void)\
  \ {\n    printf(\"The non-weak sub2\\n\");\n}\n```\n\n列表 17-21：定义 `sub2` 函数\n\n\
  如果我们链接 `main.c` 和 `sub.c`，弱符号 `sub2` 将链接进来。如果我们链接 `main.c`、`sub.c` 和 `sub2.c`，将使用定义在\
  \ `sub2.c` 中的非弱版本。\n\n这对于中断程序等情况非常有用，在这些情况下，无论是否使用都必须定义一个。它允许你提供一个回退版本或默认版本。\n\n\
  ## 总结\n\n模块允许你将大型程序分成可管理的单元。良好的设计意味着大型程序不需要包含巨大的部分。多个模块可以组织成一个库。库的优势是它可以包含大量的专用模块，而链接器只会链接需要的那些。\n\
  \n良好的编程完全关乎信息的组织，而模块和库让你将巨大的编程混乱组织成易于大小的单元。\n\n## 编程问题\n\n1. 编写一个库来计算几何形状的面积（`rectangle_area`、`triangle_area`\
  \ 等）。每个函数都应该在自己的对象文件中，所有的面积函数都应该合并到一个库中。编写一个主程序对这些函数进行单元测试。\n2. 重写之前章节中创建的串口输出程序之一，使得所有与\
  \ UART 相关的代码都在自己的模块中。\n3. 测试当以下情况时会发生什么：\n    1. 你定义两个弱符号和一个强符号。\n    2. 你定义了两个弱符号且没有强符号。\n\
  \    3. 你定义了两个强符号。\n\n## 后记\n\n![](img/chapterart.png)\n\n这本书应该让你在嵌入式 C 编程有一个良好的开始，但在*裸机\
  \ C（Bare Metal C）* 之外还有一个整个世界等待你探索。最后，这里有一些关于通往专业编程道路的有用提示。\n\n## 学习如何写作\n\n到目前，专业程序员可以拥的最重要技能是能够良好写作，因为编程过程包括编写多种类型的文档，例如提案、需求文档、设计文档、用户文档和销售资料。\n\
  \n参加一个创意写作课程，你的作品将由班上的其他同学评审。从圣地亚哥写作工作坊（San Diego Writing Workshop）获得的反馈是我一生中收到最有价值的培训之一。\n\
  \n这里有一个专业提示：如果你正在为项目编写设计或需求，你对引导项目方向拥有巨大的力量。\n\n## 学习如何阅读\n\n通过“阅读”技术文档可以学习到很多东西。我给“阅读”加上了引号是因为你不会读完大部分技术文档。你通过扫描它们来找到当时需要的信息。\n\
  \n以下是我在准备这本书时使用的文档列表：\n\n* ISO/IEC9899:2017, “编程语言: C”（500 页）\n* RM0360 参考手册，“STM32F030x4/x6/x8/xC\
  \ 和 STM32F070x6/xB Advanced ARM®-based 32-bit MCUs”（800 页）\n* ARM® 汇编指南第 1 版（200\
  \ 页）\n* 开发者手册（400 页）\n* GNU 编译器（500 页）\n* GNU Make（1000 页）\n* GNU 手册（225 页）\n\n\
  ## 协作与创意借鉴\n\n无论你有多有经验，你只是一个人。通过与他人一起评审彼此的作品，你可以扩展自己的知识。这种方法运作的一个很好的例子是 Linux 内核。\n\
  \n查看公开代码以了解他人是如何做的也是有帮助的。一个例子是随 STM32 的 HAL 固件。它是提供内部文档的代码。（参见后文 Doxygen 章节。）\n\n\
  ## 有用的开源工具\n\n开源社区在开发辅助创建和编辑工具方面有着悠久的历史。这些工具是由使用它们的人开发的，而不是添加可能无用的功能的商业程序。本节介绍了一些有用的开源工具。\n\
  \n### Cppcheck\n\n`cppcheck` 程序是一个静态检查器。换句话说，它查找程序中编译器没有发现的问题，随着编译器变得复杂，这现在变得越来越困难。\n\
  \n这个程序负责发现我最喜欢的 C 代码中的问题。这是错误信息：\n\n```\n检测匹配的 'if' 和 'else if' 条件\n```\n\n换句话说，`if`\
  \ 的体和 `else` 的体包含了相同的代码。\n\n这里是涉及的代码：\n\n```c\nif (flag) {\n    //(removed) processMessage()\n\
  } else {\n    //(removed) processMessage()\n}\n```\n\n没错，`if` 的体是一个过程调用，而 `else`\
  \ 的体也是同一个过程调用！\n\n与大多数商业程序分析器相比，我更喜欢 `cppcheck`，因为它产生的误报极少。如果 `cppcheck` 标记了你代码中的某行，查看该代码是一个好主意。\n\
  \n\n\n上一节提到的 Cppcheck 程序使用 `Doxygen` 生成其内部文档。\n\n### Valgrind\nValgrind 项目是一系列设计的工具，旨在通过动态检查你的程序来发现错误。该套件中最流行的工具之一是\
  \ `memcheck`，它用于寻找内存错误，如数组溢出、释放后继续使用指针等。它在检测大多数简单的运行时错误方面非常有效。\n\n### SQLite\n`SQLite`\
  \ 是一个嵌入式数据库库，适用于小型数据库（多达 100,000 条记录）。它虽然不是世界上最快的数据库，但对于不想引入大型数据库开销的小型嵌入式系统来说，它运行良好。你需要学习\
  \ `SQL` 才能使用它，但这是一项非常有价值的技能。\n\n## 永停止学习\n计算机技术正在以惊人的速度发生变化。我们在书中使用的那块小小的 38 分美分的\
  \ STM 微芯片，其性能比 1950 年全世界所有计算机的总和还要强大。技术永远不会停止变化，因此你不应该停止学习。你永远不知道在转角处会有什么新发现。\n\n\
  # 附录\n## 项目创建清单\n\n### 原生 C 项目\n对于在 PC 上运行的程序，启动 `STM32 Workbench`，根据需要选择工作空间，然后完成以下步骤：\n\
  \n1. 在主窗口中，选择 `File`▶`New`▶`C/C++ Project`。\n2. 在 `C/C++ Project` 窗口中，选择 `C Managed\
