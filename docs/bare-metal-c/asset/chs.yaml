  \n上拉标志配置 `GPIO` 引脚，使得在输入模式下，上拉电阻是电路的一部分。这对于输出引脚无关的。\n\n### 切换 LED\n\n### 构建完整的程序\n\
  \n我们的完整程序看起来像：\n\n```\n/*\n * 闪烁板上的用户 LED。\n * 一个简单的程序，但让它工作\n * 将需要学习 很多工具。\n */\n\
  \n#include \"stm32fxx.h\"\n#include \"stm32fxx_nucleo.h\"\n\nint main(void)\n{\n\
  \    HAL_Init(); // 初始化时钟\n    LED2_GPIO_CLK_ENABLE();\n\n    // 初始化 LED\n    GPIO_InitTypeDef\
  \ GPIO_InitStruct;\n    GPIO_InitStruct.Pin = LED2_PIN;\n    GPIO_InitStruct.Mode\
  \ = GPIO_MODE_OUTPUT_PP;\n    GPIO_InitStruct.Pull = GPIO_NOPULL;\n    GPIO_InitStruct.Speed\
  \ = GPIO_SPEED_FREQ_HIGH;\n    HAL_GPIO_Init(LED2_GPIO_PORT, &GPIO_InitStruct);\n\
  \n    for(;;) {\n        // 切换 LED2\n        HAL_GPIO_TogglePin(LED2_GPIO_PORT,\
  \ LED2_PIN);\n        HAL_Delay(400); // 延迟 400 毫秒\n    }\n}\n```\n\n现在通过 **Project**▶**Build\
  \ Project** 构建项目。如果一切顺利，你应该在 Problems 窗口看不到问题。如果有问题，修复它们并重试。\n\n在 Console 窗口中，你会看到\
  \ IDE 调用了 `make`，随后调用名为 `arm-none-eabi-gcc` 的 GCC 编译器。这是我们嵌入芯片编译器。\n\n通过 **Run**▶**Run**\
  \ 程序。（确保点击主菜单上的 Run。你也可以右键点击项目，但运行的是稍不同的命令。） Run 命令隐藏了大量工作。首先，IDE 检查项目是否需要构建。然后它运行一个程序，该程序获取程序文件并与开发板上的\
  \ Flash 编程器通信，将程序烧录到内存中。最后，编程器告诉芯片复位并启动我们的程序。\n\n结果是，你应该看到绿色 LED 缓慢闪烁。\n\n## 探索构建过程\n\
  \n\n\n\n图 3-9 所示的`Console`窗口包含了构建过程的输出。（如果此窗口为空，你可以通过执行`Project`▶`Clean` 然后执行`Project`▶`Build\
  \ Project`来重新生成内容。）\n\n![f03009](img/f03009.png)\n\n图 3-9：Console 窗口\n\n让我们向上滚动查看构建过程中的一行，这是一个典型的\
  \ GCC 编译器的调用命令：\n\n```\narm-none-eabi-gcc -mcpu=cortex-m0 -mthumb -mfloat-abi=soft\
  \ \\\n-DSTM32 -DSTM32F0 -DSTM32F030R8Tx -DNUCLEOF030R8 -DDEBUG\n-DSTM32F030x8 \\\
  \ \n-DUSEHALDRIVER \\\n-I\"/home/sdo/bare/workspace/blink/HALDriver/Inc/Legacy\"\
  \ \\\n-I\"/home/sdo/bare/workspace/blink/Utilities/STM32F0xx-Nucleo\" \\\n-I\"/home/sdo/bare/workspace/blink/inc\"\
  \ \\\n-I\"/home/sdo/bare/workspace/blink/CMSIS/device\" \\\n-I\"/home/sdo/bare/workspace/blink/CMSIS/core\"\
  \ \\\n-I\"/home/sdo/bare/workspace/blink/HALDriver/Inc\" \\\n-O0 -g3 -Wall -fmessage-length=0\
  \ -ffunction-sections \\\n-c -MMD -MP -MF\"HALDriver/Src/stm32f0xxlltim.d\" \\\n\
  -MT\"HALDriver/Src/stm32f0xxlltim.o\" \\\n-o \"HALDriver/Src/stm32f0xxlltim.o\"\
  \ \"../HALDriver/Src/stm32f0xxll_tim.c\"\n```\n\n这是`Console`窗口中的单行，为了格式化进行了拆分。如你所示，编译器被给了许多额外的选项。以下是命令行中的关键项：\n\
  \n1. `arm-none-eabi-gcc` 这是一个 GCC 编译器，但与为你的电脑编译的本地 GCC 不同，它是一个为 ARM 处理器生成代码的交叉编译器。它没有底层操作系统（因此使用\
  \ `none` 选项），且系统是为嵌入式应用二进制接口 (`eabi`) 设计的，它定义了程序部分之间以及与外部通信的方式。\n\n2. `-mcpu=cortex-m0`\
  \ 为 `cortex-m0` 版本的 CPU 生成代码。ARM 有多种处理器变体，此标志告诉 GCC 使用哪一个版本。\n\n3. `-mthumb` 某些\
  \ ARM 处理器可以执行两种不同的指令集。完整的 32 位 RISC 指令集执行速度非常快但消耗大量内存，而 `thumb` 指令集速度慢但紧得多。此指令告诉\
  \ GCC 我们想要 thumb 代码（如果你正在使用内存有限的廉价芯片——我们正是如此——这是一个好主意）。\n\n4. `-mfloat-abi=soft`\
  \ 我们的处理器没有浮点硬件，因此此标志告诉 GCC 使用软件进行模拟。（关于浮点的更多信息可以参见第 16 章。）\n\n5. `-O0` 指定优化级别为 `0`（即无优化）。这关闭了编译器的一项功能，即编译器分析你的代码并执行各种技巧来提高运行速度。这些技巧会让底层代码更难理解和调试。\n\
  \n6. `-g3` 开启调试。\n\n7. `-Wall` 开启名为 `all` 的警告 set，它包含了几乎所有有用的警告。\n\n8. `-c` 将单个源文件编译为单个对象文件。\n\
  \n9. `-o\"HALDriver/Src/stm32f0xxll_tim.o\"` 将对象文件存储在指定文件中。\n\n10. `\"../HALDriver/Src/stm32f0xxll_tim.c\"\
  ` 指定文件名。\n\n其他选项告诉编译器库的包含文件在哪里，以及这些文件应该如何配置。（我们在第 12 章中讨论 `-D` 指令）。`-I` 指令告诉编译器在标准包含文件目录之外，搜索指定目录中的包含文件。\n\
  \n除了编译命令外，我们还可以看到链接器命令：\n\n```\narm-none-eabi-gcc -mcpu=cortex-m0 -mthumb -mfloat-abi=soft\
  \ \\\n-T\"/home/sdo/bare/workspace/blink/LinkerScript.ld\" \\\n-Wl,-Map=output.map\
  \ -Wl,--gc-sections \\\n-o \"blink.elf\" @\"objects.list\" -lm\n```\n\n关键指令 `-T\"\
  /home/sdo/bare/workspace/blink/LinkerScript.ld\"` 告诉链接器使用 `LinkerScript.ld` 来告诉它将程序的各个部分放在哪里。（在第\
  \ 11 章中详细讨论。）\n\n构建过程以以下两个命令结束：\n\n```\narm-none-eabi-objcopy -O binary \"blink.elf\"\
  \ \"blink.bin\"\narm-none-eabi-size \"blink.elf\"\n   text       data\t    bss\t\
  \    dec\t    hex\tfilename\n   2620       108\t    \n```\n\n\n\n\n我们的闪烁程序简单且有效，但以后我们将编写更复杂的程序，而这些程序将会出现错误。由于我们正在编程的开发板带有如此出色的调试器，我们不妨开始学习如何使用它。通过选择\
  \ `Run`▶`Debug`来启动调试器，如图图 3-10 所示。\n\n![f03010](img/f03010.png)\n\n图 3-10：启动调试器\n\
  \n随后 IDE 会询问你要运行哪种类型的调试器，如图 3-11 所示。选择 `Ac6 STM32 C/C++ Application`。\n\n![f03011](img/f03011.png)\n\
  \n图 3-11：选择调试器\n\n系统会询问你是否要“切换到调试视图（Switch to the Debug Perspective）”。回答 `Yes`。系统会自动执行若干步骤：\n\
  \n1. 它构建软件。\n2. IDE 使用闪存编程器将程序下载到芯片。\n3. 调试器通过 JTAG 接口连接到设备。\n4. 调试器在 `main` 的第一行设置一个断点。\n\
  5. 断点告诉芯片在执行 `main` 的第一行之前停止。\n6. 微处理器重位，程序运行到 `main` 处。\n7. 当程序到达 `main` 处的断点时，调试器重新获得控制权。\n\
  \n一旦调试器到达断点，你就可以准备调试程序了，如图 3-12 所示。此时，程序已执行到 `main` 函数的第一条语句，并在调用 `HAL_Init` 之前暂停。\n\
  \n![f03012](img/f03012.png)\n\n图 3-12：调试程序\n\n现在我们已经获得了控制权，让我们利用它吧。使用命令 `Run`▶`Step\
  \ Over`（逐步执行）开始逐行执行程序。我们会这样做多次，所以请记住快捷键 `F6`。继续使用 `F6` 逐行跳过，直到进入 `for` 循环。\n\n注意，每当你执行一次\
  \ `HAL_GPIO_TogglePin(LED2_GPIO_PORT, LED2_PIN)` 函数时，LED 都会开启或关闭。由于你处于 `for` 循环中，你会在切换状态和延迟之间无限地往复。如果你足够细心，你会发现执行\
  \ `HAL_Delay` 调用花费了略多 400 毫秒（秒的五之二）。如果你想更好地观察延迟，可以将此值改为一个非常大的数。\n\n## 逐行执行程序\n\n\
  现在我们将进入程序的一些细节。大多数概念在后续章节中会有更深入的介绍，但我现在会让你先略了解一下。首先，用 `Run`▶`Terminate`（终止）退出当前的调试会话。现在用\
  \ `Run`▶`Debug` 重新开始。你应该回到了调用 `HAL_Init` 的那一行。要逐行执行程序，请使用另一个命令 `Run`▶`Step Into`（逐步进入，或快捷键\
  \ `F5`）。\n\n突然，文件 `stm32f0xx_hal.c` 出现在我们的编辑窗口中（见图 3-13）。这个文件是从哪里来的？\n\n![f03013](img/f03013.png)\n\
  \n图 3-13：调试 `stm32f0xx_hal.c`\n\n嗯，我们调用了 `HAL_Init`过程。该过程定义在 `stm32f0xx_hal.c` 中，所以当我们逐步进入\
  \ `HAL_Init` 调用时，调试器自动打开了该文件。相反，`Step Over` 命令会将该语句（在此例中为 `HAL_INIT();`）视为单个单元并跳过该函数，从而隐藏所有细节。\n\
  \n`Step Into` 命令知道我们正在调用一个函数并进入其代码内部。如你所见，支持我们的小程序需要大量的额外代码。当你在 PC 上编程时，代码对你是隐藏的，很难获取其源码。STM32\
  \ Workbench 在 `HAL_Driver/Src` 目录下为你提供了所有代码。\n\n除了显示函数内部的代码外，调试器还可以向我们显示所有程序变量的状态。要看到这一效果，选择\
  \ `Run`▶`Step Over`（或按 `F6`）大约六次，直到你回到 `main.c` 中选择用引脚的那一行。在屏幕的右上角，你会看到一个标题为 Variables（变量）的面板（见图\
  \ 3-14）。\n\n![f03014](img/f03014.png)\n\n图 3-14：变量面板\n\n在我们的程序中，我们定义了一个名为 `GPIO_InitStruct`\
  \ 的变量。在变量面板中，名称前的 `+` 号表示 `GPIO_InitStruct` 是一个复杂变量，这意味着它包含的不仅仅是整数、布尔值或其他单值。要查看内部的所有组件，请点击\
  \ `+` 图标展开它（见图 3-15）。\n\n![f03015](img/f03015.png)\n\n图 3-15：展开变量\n\n## 总结\n\n我们的闪烁程序简单且有效，但以后我们将编写更复杂的程序，而这些程序将会出现错误。由于我们正在编程的开发板带有如此出色的调试器，我们不妨开始学习如何使用它。通过选择\
  \ `Run`▶`Debug`来启动调试器，如图 3-10 所示。\n\n![f03010](img/f03010.png)\n\n图 3-10：启动调试器\n\
  \n随后 IDE 会询问你要运行哪种类型的调试器，如图 3-11 所示。选择 `Ac6 STM32 C/C++ Application`。\n\n![f03011](img/f03011.png)\n\
  \n图 3-11：选择调试器\n\n系统会询问你是否要“切换到调试视图”。回答 `Yes`。系统会自动执行若干步骤：\n\n1. 它构建软件。\n2. IDE\
  \ 使用闪存编程器将程序下载到芯片。\n3. 调试器通过 JTAG 接口连接到设备。\n4. 调试器在 `main` 的第一行设置一个断点。\n5. 断点告诉芯片在执行\
  \ `main` 的第一行之前停止。\n6. 微处理器重位，程序运行到 `main`。\n7. 当程序到达 `main` 处的断点时，调试器重新获得控制权。\n\
  \n一旦调试器到达断点，你就可以准备调试程序了，如图 3-12 所示。此时，程序已执行到 `main` 函数的第一条语句，并在调用 `HAL_Init` 之前暂停。\n\
  \n![f03012](img/f03012.png)\n\n图 3-12：调试程序\n\n现在我们已经获得了控制权，让我们利用它吧。使用命令 `Run`▶`Step\
  \ Over`开始逐行执行程序。我们会这样做多次，所以请记住快捷键 `F6`。继续使用 `F6` 逐行跳过，直到进入 `for` 循环。\n\n注意，每当你执行一次\
  \ `HAL_GPIO_TogglePin(LED2_GPIO_PORT, LED2_PIN)` 函数时，LED 都会开启或关闭。由于你处于 `for` 循环中，你会在切换状态和延迟之间无限地往复。如果你足够细心，你会发现执行\
  \ `HAL_Delay` 调用花费了略多 400 毫秒（秒的五之二）。如果你想更好地观察延迟，可以将此值改为一个非常大的数。\n\n# 4\n\n数字与变量\n\
  \n![](img/chapterart.png)\n\n## 处理整数\n\n我们将从整数（或整数）开始。这些是不带小数点的小数，例如 37、45、–8 和\
  \ 256。\n\n\n\n\n[表 4-1] 列出了你在 C 语言中对数字可以的操作。\n\n| 运算符 | 描述 |\n| --- | --- |\n| `+`\
  \ | 加法 |\n| `-` | 减法 |\n| `*` | 乘法 |\n| `/` | 除法（取整） |\n| `%` | 取模（返回除法后的余数） |\n\
  \n表 4-1：C 中的数字运算符\n\n下面的代码说明了这些运算符是如何运作的：\n\n```c\n#include <stdio.h>\n\nint main()\n\
  {\n    printf(\"3 + 2 is %d\\n\", 3 + 2);\n    printf(\"3 - 2 is %d\\n\", 3 - 2);\n\
  \    printf(\"3 * 2 is %d\\n\", 3 * 2);\n    printf(\"3 / 2 is %d\\n\", 3 / 2);\n\
  \    printf(\"10 / 9 is %d\\n\", 10 / 9);\n    printf(\"3 %% 2 is %d\\n\", 3 % 2);\n\
  \    return (0);\n}\n```\n\n我们在一个 `printf` 语句内部演示了每个操作并打印出结果。要使用 `printf` 打印计算结果，可以在字符串中你想显示数字的地方放置一个\
  \ `%d`，然后将计算式作为 `printf` 的第二个参数列出。注意，如果你想打印一个表示取模操作的 `%`，你需要指定两次。\n\n要查看此程序的输出，让我们将其放入\
  \ IDE 中吧。启动 System Workbench for STM32，然后按照第 2 章中的步骤列表创建一个程序。（附录中的清单总结了这些步骤。）但是，这一次，我们不是创建一个“Hello\
  \ World”程序，而是创建一个空的原生的 C/C++ 项目，因此选择 `C Managed Build` 作为模板。\n\n在 Project Type（项目类型）下，选择\
  \ `Executable`（执行文件）▶`Empty Project`（空项目）。接下来，通过选择 `File`▶`New`▶`Source File` 创建程序文件。\n\
  \n在编辑窗口中输入程序文本并保存文件。编译二进制文件并像你在第 2 章中做的那样运行它。程序应该在 Console（控制台）窗口的底部显示其输出（参见[图 4-1]）。\n\
  \n![f04001](img/f04001.png)\n\n图 4-1：运行结果\n\n如你所见，程序应该打印它执行的每个计算的结果。\n\n### 声明变量以存储整数\n\
  \n我们的程序对固定数字进行了操作，但我们也可以使用变量来存储可以更改的信息。在使用任何变量之前，必须对其进行`declared`（声明）。变量声明的格式如下如下：\n\
  \n```c\ntype variable_name; // 解释此变量作用的注释\n```\n\n例如，使用 `int` 作为类型表示该变量是一个整数。准确地说，它是计算机最容易处理的整数类型。我们将在本章稍些时候介绍其他类型的整数。\n\
  \n变量名以字母开头，必须只包含字母、数字和下划线。STM32 固件库使用驼峰命名法（camel case），即名称中的单词首字母大写，因此为了兼容，我们在本书中处处使用驼峰命名法：\n\
  \n```c\nstartTime   currentStation  area\n```\n\n虽然名称可以以下划线开头，但此类名称被认为保留给系统函数，不应在普通编程中使用。此外，永远不要使用\
  \ `l`（小写 *L*）或 `O`（大写 *O*）作为变量名。如果理由不明，请考虑以下代码：\n\n```c\nO = l + 1 + O * 0;  //\
  \ 这种编程会让你丢命。\n```\n\n从技术上，你可以从变量声明中省略注释。然而，包含注释可以让你之后处理这些代码的人了解你为什么要声明该变量以及它的作用。换句话说，它可以帮助你创建一个微字典或词汇表。\n\
  \n### 给变量赋值\n\n一旦我们声明了变量，就可以用赋值语句给它分配一个值。赋值语句的一般形式如下：\n\n```c\nvariable = expression;\n\
  ```\n\n这告诉计算机计算表达式的值并将其存储在变量中。然后可以将变量用于任何我们放置整数的地方，例如 `printf` 语句。下面的程序演示了变量的声明、赋值和使用：\n\
  \n`var.c`\n\n```c\n/*  \n * 一个计算两个变量之和的程序\n */  \n#include <stdio.h>\n\nint main()\n\
  {\n    int aNumber;        // 某个数字\n    int otherNumber;    // 另一个数字\n\n```\n\n\
  此程序创建两个变量 `aNumber` 和 `otherNumber`，然后给它们各赋一个值并打印总和。现在将此程序输入 System Workbench for\
  \ STM32。\n\n### 初始化变量\n\n当你程序中声明一个变量时，你告诉 C 编译器为一个整数（`int`）分配内存空间。但在你为它指定值之前，该变量被认为是`uninitialized`（未初始化的）；它可能包含上一次内存使用时留下的任何随机垃圾值。\n\
  \n为了在我们刚刚编写的程序中看到这一点，请打开调试器并在单步执行时查看 Variables（变量）面板。在我们为它们赋值之前，我们的两个变量 `aNumber`\
  \ 和 `otherNumber` 的值为零。但未初始化的变量可能有任何值。我们可以在声明时为变量初始化：\n\n```c\nint aNumber = 5;\n\
  int otherNumber = 7;\n```\n\n我们可以在声明时通过赋值来初始化：\n\n```c\nint aNumber = 5;\n```\n\n\
  这在大多数情况下都是好主意，确保我们的程序正常。让我们重写程序以添加这些初始化：\n\n```c\n/*  \n * 一个计算两个变量之和的程序\n */  \n\
  #include <stdio.h>\n\nint main()\n{\n    int aNumber = 5;        // 某个数字\n    int\
  \ otherNumber = 7;    // 另一个数字\n\n    printf(\"Sum is %d\\n\", aNumber + otherNumber);\n\
  \    return (0);\n}\n```\n\n一旦我们做了该更改，就可以在程序稍后删除这些。\n\n### 整数大小与表示\n\nC 有 `int`\
  \ 以外的整数类型用于表示不同大小的数字。随着计算机的演进，人们发现组织内存最有效的方法是使用 8 位的字节组。计算机允许你将多个字节组合 2 字节、4 字节和\
  \ 8 字节，而 `int` 类型告诉 C 使用你正在使用的系统的有效字节数。我们芯片的编译器 Cortex-M0 CPU 使用 32 位（4 字节）整数。\n\
  \n为了让程序更高效，C 允许你选择所需的整数类型。例如，你可能希望存储 0 到 100 范围内的数字。你不需要一个完整的整数来这样做，因此可以使用 `short\
  \ int`，它类似于整数但占据的空间更小。（技术上，C 标准仅规定 `short int` 不比 `int` 大，但在大多数实现中它更小。）\n\n下面声明了一个\
  \ `short int`：\n\n```c\nshort int shortNumber;  // 比常短的整数\n```\n\n一个更长的整数可以使用 `long`\
  \ 修饰符声明：\n\n```c\nlong int longNumber;    // 一个更长的整数\n```\n\n当计算机获得了高效处理更长数字的能力时，人们需要一种比\
  \ `long` 包含更多位的整数类型。结果就是（有些奇怪的）`long long` 整数：\n\n```c\nlong long intLongNumber;\
  \   // 更长的整数\n```\n\nC 标准没有定义每种整数类型的大小。它们的大小可能相同，你仍然拥有标准编译器。然而，它保证了以下内容：\n\n```\n\
  sizeof(short int) <= sizeof(int) <= sizeof(long int) <= sizeof(long long int)\n\
  ```\n\n`sizeof` 运算符返回存储变量或类型所需的字节数。\n\n让我们使用一个短程序来查看在我们的系统上每种整数类型占用多少空间：\n\n`size.c`\n\
  \n\n\n\n\n```c\n/*\n * 显示不同的数字类型。\n */\n#include <stdio.h>\n\nint main()\n{\n  \
  \  short int aShortInt;        // 短整数\n    int aInteger;               // 默认整数\n\
  \    long int aLongInt;          // 长整数\n    long long int aLongLongInt; // 超长整数整数\n\
  \n    printf(\"Size of (short int) = %ld (bytes) %ld bits\\n\",\n            sizeof(aShortInt),\
  \ sizeof(aShortInt)*8);\n\n    printf(\"Size of (int) = %ld (bytes) %ld bits\\n\"\
  ,\n            sizeof(aInteger), sizeof(aInteger)*8);\n\n    printf(\"Size of (long\
  \ int) = %ld (bytes) %ld bits\\n\",\n            sizeof(aLongInt), sizeof(aLongInt)*8);\n\
  \n    printf(\"Size of (long long int) = %ld (bytes) %ld bits\\n\",\n          \
  \  sizeof(aLongLongInt), sizeof(aLongLongInt)*8);\n\n    return (0);\n}\n```\n\n\
  之前，我们使用 `%d` 来打印数字。在这个程序中，我们使用 `%ld`，因为 `sizeof` 返回的是 `long int`，而 `%ld` 用于打印 `long\
  \ int` 类型的数字。\n\n程序在我的系统上产生了以下输出：\n\n```\nSize of (short int) = 2 (bytes) 16 bits\n\
  Size of (int) = 4 (bytes) 32 bits\nSize of (long int) = 8 (bytes) 64 bits\nSize\
  \ of (long long int) = 8 (bytes) 64 bits\n```\n\n从这里我们可以看到，`long int` 的大小与 `long\
  \ long int` 相同。然而，这仅适用于该系统上的此编译器（运行在 `x86_64` 处理器上的 GNU GCC）。不同的编译器的实现方式可能有所不同。\n\
  \n### 数字表示\n\n假设我们有五头牛。在英语中，我们可以将这个数字表示为“five”、“5”或“V”。同样，在 C 中，你可以使用四种数字表示法：十进制、二进制、八进制和十六进制。\n\
  \n人们通常使用十进制（10 进制），但计算机以二进制（2 进制）存储数字，因为制造二进制电路既便宜又容易。例如，我们可能会使用十进制编写以下赋值语句：\n\n\
  ```\naNumber = 5;\n```\n\n同一个语句用二进制写可以这样：\n\n```\naNumber = 0b101;    // 二进制的 5\n\
  ```\n\n前缀 `0b` 表示后面是一个二进制数。（我们也可以用 `0B`，但更难读。）\n\n或者，我们可以使用八进制（8 进制）：\n\n```\naNumber\
  \ = 05;   // 八进制的 5\n```\n\n最后，我们可以使用十六进制（16 进制）：\n\n```\naNumber = 0x5;  // 十六进制的\
  \ 5\n```\n\n二进制数占用的书空间很大，为了让内容更紧凑，我们经常在编程中使用十六进制法来表示精确的二进制值。每个单个十六进制位对应四个二进制位，如表\
  \ 4-2 所示。\n\n| Binary | Hex | Binary | Hex |\n| --- | --- | --- | --- |\n| 0000\
  \ | 0 | 1000 | 8 |\n| 0001 | 1 | 1001 | 9 |\n| 0010 | 2 | 1010 | A |\n| 0011 | 3\
  \ | 1011 | B |\n| 0100 | 4 | 1100 | C |\n| 0101 | 5 | 1101 | D |\n| 0110 | 6 | 1110\
  \ | E |\n| 0111 | 7 | 1111 | F |\n\n表 4-2: 二进制与十六进制之间的转换\n\n如你所示，1111 1100b 等于十六进制值\
  \ `0xFC`。同样，`0xA5` 是 1010 0101b。使用此表，你可以快速方便地在二进制和十六进制之间转换。\n\n虽然计算机将数字存储为一组位，但这些位的含义完全取决于我们。例如，如果把位模式\
  \ 0000 0101 解释为二进制数，它可以代表 5。但 0000 0101 也可以代表 10,005。我是如何得到那个数字的？我胡编的。在这种情况下，我随机挑选了一个奇怪的值。其他的任意含义可能包括“May”、字母“E”以及\
  \ `LED0+LED2`。\n\n一种不常见但仍然有用的位模式映射见表 4-3。\n\n| Bit pattern | Meaning |\n| --- |\
  \ --- |\n| 000 | 0 |\n| 001 | 1 |\n| 011 | 2 |\n| 010 | 3 |\n| 110 | 4 |\n| 111\
  \ | 5 |\n| 101 | 6 |\n| 100 | 7 |\n\n表 4-3: 位模式到数字的映射\n\n一眼看去它看起来是随机的。但如果你仔细观察，你会发现每个数字之间只有一个位发生了变化。这使其成为编码器的理想选择。事实上，这是一种被称为\
  \ `Gray code`（格雷码）的标准位模式。\n\n图 4-2: 格雷编码器\n\n记住，在告诉它之前，C 并不知道如何解释位模式。\n\n### 标准整数\n\
  \n整数类型的一个大问题是标准中没有告诉它们有多大，只有它们的相对大小。如果你想写入 32 位的设备，必须猜测 `int` 的类型。猜测和编程并不兼容，因此人们发明了名为条件编译的技巧来定义具有精确位数的类型：`int8_t`、`int16_t`、`int32_t`\
  \ 和 `int64_t`。类型的名称指定了大小。例如，无论 `int` 如何，`int32_t` 类型都是 32 位。由于大多数好主意，C 标准将这些新类型加入了\
  \ `stdint` 库。它们不是内置的，所以你通过以下语句包含它们：\n\n```c\n#include <stdint.h>\n```\n\n列表 4-1\
  \ 显示了我们的新整数。\n\n```c\n/* 显示整数的大小 */\n#include <stdio.h>\n#include <stdint.h>\n\n\
  int main()\n{\n    int8_t has8bits = 0x12;               // 8 位整数\n    int16_t has16bits\
  \ = 0x1234;             // 16 位整数\n    int32_t has32bits = 0x12345678;         //\
  \ 32 位整数\n    int64_t has64bits = 0x12345678abcdef; // 64 位整数\n\n    printf(\"8\
  \ bits %x\\n\", has8bits);\n    printf(\"16 bits %x\\n\", has16bits);\n    printf(\"\
  32 bits %x\\n\", has32bits);\n    printf(\"64 bits %lx\\n\", has64bits);\n    return\
  \ (0);\n}\n```\n\n列表 4-1: 整数演示\n\n在这个程序中，我们使用格式字符 `%x` 来打印十六进制数字。具体来说，`%x` 格式打印\
  \ `int`，但由于某些底层的“参数提升”（argument promotion），我们也可以将其用于 `int8_t`、`int16_t` 和 `int32_t`。C\
  \ 是一种有点懒的语言。当你的处理器拥有 32 位寄存器时，向 `printf` 传递 16 位整数很困难，C 会将 `int16_t` 提升为 `int32_t`，这让我们可以使用\
  \ `%x` 处理 `int16_t`。同样，我们也可以对 `int8_t` 使用 `%x`，因为它也会提升为 `int32_t`。（严格来说，C 标准规定可能会发生提升，并非强制。这段代码在我们的\
  \ `x86_64` 机器上运行，但无法移植到其他系统。）现在来看 `int64_t`。如果 C 将其改为 `int` (`int32_t`)，我们将丢失一半数字。C\
  \ 对它无能为力，所以将 `int64_t` 参数作为 `int64_t` 参数传递。格式必须从 `%x` (`int`) 变为 `%lx` (`int64_t`)\
  \ 才能打印更大的值。\n\n读者思考：尝试将示例中的 `%lx` 改为 `%x` 看看得到什么。\n\n### 无符号整数类型\n\n在上节中，我们使用了带符号整数类型，它可以是正也可以是负。无符号整数类型只持有正值，并且比对应的带符号类型简单。标准的无符号类型有\
  \ `uint8_t`、`uint16_t`、`uint32_t` 和 `uint64_t`。`uint8_t` 类型是一个无符号 8 位整数，可以存放 0 (0000\
  \ 0000b) 到 255 (1111 1111b)。无符号整数类型的范围如表 4-4 所示。\n\n| Type | Low | High |\n| ---\
  \ | --- | --- |\n| uint8_t | 0000 0000 (0) | 1111 1111 (255) |\n| uint16_t | 0000\
  \ 0000 0000 0000 (0) | 1111 1111 1111 1111 (65,535) |\n| uint32_t | 0000 0000 0000\
  \ 0000 0000 0000 0000 0000 (0) | 1111 1111 1111 1111 1111 1111 1111 1111 (4,294,967,295)\
  \ |\n| uint64_t | 0000 0000 0000 0000 0000 0000 0000 0000 0000 0000 0000 0000 0000\
  \ 0000 0000 0000 (0) | 1111 1111 1111 1111 1111 1111 1111 1111 1111 1111 1111 1111\
  \ 1111 1111 1111 1111 (18,446,744,073,709,551,615) |\n\n表 4-4: 无符号整数类型范围\n\n\n\n\
  \n这是一个使用 `uint8_t` 变量的简单示例。该程序在不改变值的情况下，打印了 `smallNumber` 的三种不同的表示形式：\n\n```c\n\
  /*\n * uint8_t 的简单用法\n */\n\n#include <stdio.h>\n#include <stdint.h>\n\nint main()\n\
  {\n    uint8_t smallNumber = 0x12; // 一个小的数字\n\n    printf(\"0x12 is %u decimal\\\
  n\", smallNumber);\n    printf(\"0x12 is %o octal\\n\", smallNumber);\n    printf(\"\
  0x12 is %x hex\\n\", smallNumber);\n    return(0);\n}\n```\n\n`%u printf` 规范告诉 C\
  \ 我们想要打印一个无符号 `int`（默认无符号整数类型）。我们使用格式规范 `%o` 来打印八进制，使用 `%x` 打印十六进制。\n\n该程序的输出如下：\n\
  \n```\n0x12 is 18 decimal\n0x12 is 22 octal\n0x12 is 12 hex\n```\n\n### 溢出 (Overflow)\n\
  \n现在我们将探索机器的限制。实际上，我们将超出这些限制。最大的 `uint8_t` 数字是 255 (0b1111 1111)。当我们超过这个界值并尝试打印\
  \ 255 + 1 时会发生什么？让我们试一下：\n\n```c\n/*\n * 查看当超过最大值时发生了什么。\n * (包含一个错误)\n */\n\n#include\
  \ <stdio.h>\n#include <stdint.h>\n\nint main()\n{\n    // 非常小的整数，被设置为最大值\n    uint8_t\
  \ smallNumber = 255;\n\n  1 printf(\"255+1 is %u\\n\", smallNumber + 1);\n    return\
  \ (0);\n}\n```\n\n根据这个程序，给 8 位无符号整数 255 加 1 的结果是 256，但数字 256 在二进制中是 0b1 0000 0000，或者说是\
  \ `0x100`，这无法放入 8 位中。要么是我们扭曲了宇宙法则，要么我们的程序出了问题。\n\n为了弄清楚发生了什么，让我们看看打印语句 1。`smallNumber`\
  \ 的类型是 `uint8_t`；然而，在大多数 32 位计算机上，将两个 8 位整数相加甚至是不可能的。由于计算机的构造方式，你必须加上两个 32 位数。因此，为了计算一个表达式，C\
  \ 编译器执行了以下操作：\n\n1. 将 `shortNumber` 转换为 `unit32_t` 值\n2. 在结果（类型为 `uint32_t`）上加 1\n\
  3. 将结果 (256) 作为 `uint32_t` 打印\n\n结果是一个可以容纳 256 的 `uint32_t`，这就是打印的内容。所以，我们并没有导致\
  \ 8 位溢出（我们想要演示的）。相反，我们演示了自动提升（automatic promotion），这在本章稍早之前讨论过。\n\n为了得到想要的结果，我们需要对程序进行微调，将结果存储在\
  \ `uint8_t` 值中（我用**粗体**标记了程序中的更改）：\n\n```c\n/*\n * 查看当超过最大值时发生了什么。\n */\n\n#include\
  \ <stdio.h>\n#include <stdint.h>\n\nint main()\n{\n    uint8_t smallNumber;\n  \
  \  uint8_t result;\n\n    smallNumber = 255;\n    result = smallNumber + 1;\n  \
  \  printf(\"255+1 is %d\\n\", result);\n    return (0);\n}\n```\n\n现在结果是 0。为什么？因为我们的计算返回了\
  \ `0b1111 1111 + 0b000 0001 = 0b10000 0000`。由于存储变量的空间有限，只有**粗体**部分被存储了。\n\n*溢出*\
  \ 当当结果大到机器无法处理时就会发生。在这种情况下，9 位结果无法放入 8 位值中。想象一下汽车的里程表。它可以显示到 999,999 英里。如果有人行驶了一百万英里，会发生什么？\n\
  \n理解编译器是如何处理数字的是编写良好的嵌入式程序的关键。例如，我曾有一个 GPS 一直将高度作为无符号数。（它并不是为在潜艇上工作设计的）。我带它去死亡谷旅行，结果它坏了。那是因为当我到达坏水盆（Badwater\
  \ Basin），海拔为 -282 英尺时，它无法处理负高度。GPS 的设计者假设所有高度都大于零。毕竟，GPS 设计并不是为了在水下工作的。因此，使用无符号整数表示高度并不是不合理的决定——除了像坏水盆这样的用户，那里的海拔是负的，会导致\
  \ GPS 死机。这个错误说明了为什么了解你的数字系统的局限性很重要。\n\n### 符号整数类型中的补码表示 (Two’s Complement)\n\n符号数使用一个位（最左侧）作为符号位来表示：如果位为\
  \ 1，则数字为负数。因此，8 位符号整数 (`int8_t`) 可以表示 -128 到 127。\n\n大多数计算机使用补码来表示符号整数。在补码中，最左边的位是符号位。如果符号位为\
  \ 0，数字为正数；如果是 1，数字为负数。要将一个正数转换为补码，你需要反转所有位并加 1。例如，在 8 位符号格式中表示 -1：\n\n1. 从 1 开始：`0000\
  \ 0001`\n2. 反转位：`1111 1110`\n3. 加 1：`1111 1111`\n\n所以，`1111 1111` 是 -1。这种表示法允许使用与无符号数相同的硬件进行加减法。例如，将\
  \ 5 加 -1：\n\n```\n  0000 0101 (5)\n+ 1111 1111 (-1)\n-----------\n1 0000 0100 (4)\n\
  ```\n进位被丢弃，结果为 `0000 0100`，即 4。\n\n### 使用位操作控制内存映射 I/O 寄存器\n\n我们可以将八位组织成一个数字，但这些位也可以代表八不同的事物。例如，它们可以连接到八不同的\
  \ LED 灯上。实际上，当你将值放在称为*内存映射 I/O 寄存器*的特殊内存位置时，这些值会开启或关闭 I/O 引脚。由于寄存器的字节由八位组成，单个寄存器可以控制八个\
  \ LED。（或者在我们的案例中，一个 LED 和七个可以添加更多 LED 的引脚。）\n\n\n\n\n位通常从 7 到 0 编号，其中 7 是最左侧，即最高位。假设我们的\
  \ LED 寄存器设置如下：\n\n| Bit 7 | Bit 6 | Bit 5 | Bit 4 | Bit 3 | Bit 2 | Bit 1 | Bit\
  \ 0 |\n| :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |\n| Out 7 | Out\
  \ 6 | Out 5 | Out 4 | Out 3 | Out 2 | Out 1 | LED 0 |\n\n假设我们想要开启 LED #0。由于每个 LED\
  \ 都是关闭的，我们的寄存器中的值为 `0000 0000`。为了开启 LED #0，我们需要将最后一位翻转为 `1`。为了做到，我们只需要向寄存器加 `1`，得到\
  \ `0000 0001`。LED #0 亮起，所有所有 LED 保持关闭状态。\n\n但如果 LED 已经是开启状态呢？那么我们的寄存器将包含 `0000 0001`，当我们加上\
  \ `1` 时，会得到 `2`，其二进制表示为 `0000 0010`。因此，LED #0 关闭而 OUT #1 亮起。这并不是我们想要的。\n\n这里的问题在于，我们一直使用的算术运算符将我们的\
  \ 8 位整数视为一个单一整数。而*位运算符*将数字视为一组单独的位，每个位都可以被独立地进行开启、关闭和测试。\n\n### OR\n\n第一个位运算符是 `OR`（`|`）。单位版本的\
  \ `OR` 在其两个操作数中只要有一个被设置为 `1`，就会给出一个真（或 `1`）的结果。我将通过*真值表*来展示它是如何工作的。它就像你一年级用过的加法表和乘法表，只不过它显示的是\
  \ OR 等布尔运算符的操作。\n\n`OR` 的真值表如下：\n\n| OR (`|`) | 0 | 1 |\n| :--- | :--- | :--- |\n\
  | 0 | 0 | 1 |\n| 1 | 1 | 1 |\n\n`OR` 是一个位运算符，这意味着为了对两个 8 位值进行“或”操作，你对这两个值中的每一对位执行该操作。例如：\n\
  \n```\n 0010 0101\n| 0000 1001\n  ---------\n  0010 1101\n```\n\n要设置位 0（即开启 LED\
  \ #0），我们使用以下 C 代码：\n\n```c\nledRegister = ledRegister | 0x01;\n```\n\n或者，我们可以使用以下简写运算符：\n\
  \n```c\nledRegister |= 0x01;\n```\n\n### AND\n\n`AND`（`&`）运算符只有在当它的两个操作数都为真时，才返回真（`1`）。以下是\
  \ `AND` 真值表：\n\n| AND (`&`) | 0 | 1 |\n| :--- | :--- | :--- |\n| 0 | 0 | 0 |\n|\
  \ 1 | 0 | 1 |\n\n像 `OR` 一样，`AND` 运算符作用于每一对位：\n\n```\n 0010 0101\n& 0000 1001\n \
  \ ---------\n  0000 0001\n```\n\n要关闭 LED #0，我们可以通过以下操作将位 0 设置为 `0`：\n\n```c\nledRegister\
  \ &= 0b11111110;\n```\n\n此命令将我们的寄存器与一个除了位 0 外所有位都设置为 1 的位模式进行“与”运算，因此位 0 将清零，而所有其他位将保持不变。（与\
  \ 1 进行与运算会保持其值。）\n\n### NOT\n\n*取反*或 *NOT* 运算符（`~`）接收一个操作数并将其反转。因此，如果位是 `0`，它就会变成\
  \ `1`；如果是 `1`，它就会变成 `0`。`NOT` 运算符的真值表非常简单：\n\n| | 0 | 1 |\n| :--- | :--- | :---\
  \ |\n| `~` | 1 | 0 |\n\n下面的示例了此运算符的工作原理：\n\n```\n~ 0000 0001\n  ---------\n  1111\
  \ 1110\n```\n\n使用我们目前为止涵盖的位运算符，我们已经可以编写代码来关闭所有寄存器，然后开启和关闭 LED：\n\n```c\nconst uint8_t\
  \ LED_BIT = 0b0000001;\n\n// 关闭所有位。\nledRegister = 0;\n\n// 开启 LED。\nledRegister\
  \ |= LED_BIT;\n\n// 等待一会儿。\nsleep(5);\n\n// 关闭 LED。\nledRegister &= ~LED_BIT;\n\
  ```\n\n这正是第 3 章中闪烁程序所做的事情，只是 STM 库为我们隐藏了这些细节。\n\n### Exclusive OR (异或)\n\n位运算符*异或*（`^`）的结果如果其中一个位被设置但不同时都被设置，则为真。以下是它的真值表：\n\
  \n| Exclusive OR (`^`) | 0 | 1 |\n| :--- | :--- | :--- |\n| 0 | 0 | 1 |\n| 1 | 1\
  \ | 0 |\n\n为了查看它是如何工作的，请考虑以下示例：\n\n```\n 0010 0101\n^ 0000 1001\n  ---------\n \
  \ 0010 1100\n```\n\n如果我们想反转 `ledRegister` 中 LED 的值，异或非常有用，例如：\n\n```c\nledRegister\
  \ ^= LED_BIT;\n```\n\n### Shifting (移位)\n\n*左移*运算符（`<<`）将数字的位向左移动，右侧空位用零填充。例如，如果我们将值\
  \ `0000 0001` 向左移动两位，得到 `0000 0100`。这通常用于将数字乘以 2 的幂。\n\n*右移*运算符（`>>`）将数字的位向右移动，左侧空位用符号位或零填充。如果我们将\
  \ `0000 0100` 向右移动两位，得到 `0000 0001`。这通常用于将数字除以 2 的幂。\n\n\n\n\n请注意，这里我们也使用了在本节早期介绍的\
  \ `|=` 复合赋值运算符。\n\n### 同时设置两个位的值\n\n现在假设我们要同时设置 `POWER_FAILURE` 和 `MASTER_FAIL`\
  \ 的值。我们可以通过以下语句来实现：\n\n```\nledRegister |= MASTER_FAIL | POWER_FAILURE;\n```\n\n\
  由于 `MASTER_FAIL` 在第 7 位的值为 1，且任何非零值都会导致结果为 1，因此面板上的 `MASTER_FAIL` 位将被设置。\n\n###\
  \ 关闭一个位\n\n我们使用以下模式来关闭一个位：\n\n```\nbitSet &= ~bitToTurnOff;\n```\n\n为了理解此操作是如何工作的，让我们通过以下语句来详细分析它的过程：\n\
  \n```\nledRegister &= ~(MASTER_FAIL | POWER_FAILURE);\n```\n\n让我们先从 `(MASTER_FAIL\
  \ | POWER_FAIL)` 的结果开始：\n\n```\n1000 1000 (MASTER_FAIL | POWER_FAIL)\n```\n\n现在我们应用取反（或非\
  \ NOT，`~`）运算符：\n\n```\n0111 0111 ~(MASTER_FAIL|POWER_FAIL)\n```\n\n接下来，我们查看 `ledRegister`\
  \ 的现有值。在这个示例中，它设置了 `MASTER_FAIL` 和 `CLEAN_FILTER`。\n\n```\n1000 0001 (ledRegister:\
  \ MASTER_FAIL, CLEAN_FILTER)\n```\n\n现在我们将这些结果进行“与”（AND）运算：\n\n```\n0111 0111 ~(MASTER_FAIL|POWER_FAIL)\n\
  1000 0001 (ledRegister: MASTER_FAIL, CLEAN_FILTER)\nResult:  0000 0001 (CLEAN_FILTER)\n\
  ```\n\n### 检查位的值\n\n以下程序展示了“位带控制”（bit-banging）的典型用法，即开启和关闭单个位的艺术。它还包含了检查不同位值值的逻辑：\n\
  \n```c\n/*\n * 演示位操作用的程序\n */\n#include <stdio.h>\n#include <stdint.h>\n\n//< 主故障\
  \ -- 显示是否存在其他错误。\nconst uint8_t MASTER_FAIL       = (1 << 7);\n//< 表示接收到了不一致的数据。\n\
  const uint8_t DATA_FAIL         = (1 << 6);\n//< 油油箱低。\nconst uint8_t OIL_LOW  \
  \         = (1 << 5);\n//< 油油压力低。\nconst uint8_t OIL_PRESSURE      = (1 << 4);\n\
  //< 主电源发生故障。\nconst uint8_t POWER_FAILURE     = (1 << 3);\n//< 我们让位置移动到 x 但它没有移动。\n\
  const uint8_t POSITION_FAULT    = (1 << 2);\n//< 空压缩机停止。\nconst uint8_t AIR_PRESSURE\
  \      = (1 << 1);\n//< 空滤器已达到寿命。\nconst uint8_t CLEAN_FILTER      = (1 << 0);\n\
  /*!\n * 打印位的状态\n * (替代真实的 LCD 面板)\n *\n * \\param ledRegister 包含 LED 位的寄存器\n */\n\
  static void printLED(const uint8_t ledRegister)\n{\n    printf(\"Leds: \");\n  \
  \  if ((MASTER_FAIL & ledRegister) != 0)\n        printf(\"MASTER_FAIL \");\n  \
  \  if ((DATA_FAIL & ledRegister) != 0)\n        printf(\"DATA_FAIL \");\n    if\
  \ ((OIL_LOW & ledRegister) != 0)\n        printf(\"OIL_LOW \");\n    if ((OIL_PRESSURE\
  \ & ledRegister) != 0)\n        printf(\"OIL_PRESSURE \");\n    if ((POWER_FAILURE\
  \ & ledRegister) != 0)\n        printf(\"POWER_FAILURE \");\n    if ((POSITION_FAULT\
  \ & ledRegister) != 0)\n        printf(\"POSITION_FAULT \");\n    if ((AIR_PRESSURE\
  \ & ledRegister) != 0)\n        printf(\"AIR_PRESSURE \");\n    if ((CLEAN_FILTER\
  \ & ledRegister) != 0)\n        printf(\"CLEAN_FILTER \");\n    printf(\"\\n\");\n\
  }\n\nint main()\n{\n    uint8_t ledRegister = 0x00;         // 从全部关闭开始。\n\n    printLED(ledRegister);\n\
  \n    // 停电。\n    ledRegister |= POWER_FAILURE | MASTER_FAIL;\n    printLED(ledRegister);\n\
  \n    // 现在空气断了。\n    ledRegister |= AIR_PRESSURE;\n    printLED(ledRegister);\n\
  \n    // 电电恢复，空气断了，所以主故障位开启。\n    ledRegister &= ~POWER_FAILURE;\n    printLED(ledRegister);\n\
  \    return (0);\n}\n```\n\n让我们先看看 `printLED` 函数，它包含了许多行测试每个单独位并在该位被设置时打印消息的代码。（你将在第\
  \ 5 章中学习用于执行此操作的 `if` 语句）。为了理解测试的逻辑，请看以下语句：\n\n```c\nif ((MASTER_FAIL & ledRegister)\
  \ != 0)\n    printf(\"MASTER_FAIL \");\n```\n\n如果第一行的表达式不等于 0，则会打印消息。因为该表达式使用了 `AND`（与）运算符，`ledRegister`\
  \ 中的每个位必须与 `MASTER_FAIL` 中的对应位匹配，该位的值才为 1。如果至少有一组位的值都为 1，则会执行 `printf`。换句话说，在底层，该操作看起来像：\n\
  \n```\n 1000 0000 (MASTER_FAIL)\n& 1000 0001 (设置了 MASTER_FAIL 和 CLEAN_FILTER 的 ledRegister)\n\
  \  ---------\n= 1000 0000 (由于此值不为零，打印 \"MASTER FAIL\")\n```\n\n整个函数将执行类似的测试，并打印寄存器中设置的每一个位。在这里使用此函数是因为我们没有硬件灯面板，并且我们想看到发生了什么。\n\
  \n在程序的后面，我们对位进行操作。例如，我们通过开启 `POWER_FAILURE` 和 `MASTER_FAIL` 位来模拟断电。因此，当我们现在打印 LED\
  \ 时，会得到以下消息：\n\n```\nLeds: MASTER_FAIL POWER_FAILURE\n```\n\n程序的其余部分设置并清除各种位以产生以下消息：\n\
  \n```\nLeds:\nLeds: MASTER_FAIL POWER_FAILURE\nLeds: MASTER_FAIL POWER_FAILURE\n\
  ```\n\n\n\n\n例如，如果你想让某些代码只在变量等于 5 时执行，你可以使用等号运算符（`==`），如下所示：\n\n```c\nif (aNumber\
  \ == 5) {\n    printf(\"The number is 5\\n\");\n}\n```\n\n需要警告的是：`C` 允许在条件语句中赋值。例如，下面的代码在\
  \ `if` 语句内部为变量赋值为 7，这是合法的：\n\n```c\nif (aNumber = 7) {\n    printf(\"Something happened\\\
  n\");\n}\n```\n\n这等同于以下代码，该代码在赋值后测试变量是否等于 0：\n\n```c\naNumber = 7;        // 赋值\n\
  if (aNumber != 0) { // 与零进行测试\n    printf(\"Something happened\\n\");\n}\n```\n\n\
  它与以下条件不同，该条件测试的是变量是否等于 7：\n\n```c\nif (aNumber == 7)\n```\n\n在 `C` 语言早期，由于编译器技术不像现在，这是一个非常棘手的问题。你可能会无意中写出类似下面的代码，只不过情况要复杂得多：\n\
  \n```c\naNumber = 5;\nif (aNumber = 7) {  // 注意缺少了 '=' 字符。\n    printf(\"Something\
  \ happened\\n\");\n}\n```\n\n`if` 语句中的代码将被执行，因为变量会被重新赋值为 7，而作为一个非零值，它会立即使条件为真，即使你的本意是让\
  \ `aNumber` 为 5 而不是 7。使用现代的 `GCC` 编译器，在条件中赋值会产生一个警告：\n\n```c\nequal.c:14:5: warning:\
  \ suggest parentheses around assignment used as truth value [-Wparentheses]\n if\
  \ (aNumber = 7) {\n```\n\n在这里，`GCC` 告诉你，如果你想抑制这个警告（因为你确实想将一个赋值语句和一个 `if` 语句结合），你应该如下所示编写代码：\n\
  \n```c\nif ((aNumber = 7)) {   // 非常非常糟糕的编程\n```\n\n我添加了这条注释，是因为我认为合并语句是一种糟糕的编程习惯。让一个语句只做一件事。例如，当你需要同时进行赋值和测试时，先进行赋值，再进行测试。\n\
  \n## if/else 语句\n\n当我们使用 `if`/`else` 语句时，是为了在条件为真时执行某些语句，在条件为假时执行其他语句。例如，考虑以下内容：\n\
  \n```c\nif ((number % 2) == 0) {\n    printf(\"Number is even\\n\");\n} else {\n\
  \    printf(\"Number is odd\\n\");\n}\n```\n\n如果变量 `number` 的值除以 2 的余数为 0，这段代码将打印一条消息说明该数是偶数；否则，它将打印一条消息说明该数是奇数。\n\
  \n现在我们来到 `C` 语言另一个阴暗的小角落：你不需要在 `if` 或 `else` 之后的单个语句周围加上大括号（`{}`）。考虑下面的代码，它是故意缩缩进错误的：\n\
  \n```c\nif (a == 1)\n    if (b == 2)\n        printf(\"Condition orange\\n\");\n\
  \  else\n    printf(\"Condition pink\\n\");\n```\n\n`else` 属于哪个 `if`，是第一个 `if` 还是第二个\
  \ `if`？\n\na. 第一个 `if`：`if (a == 1)`\nb. 第二个 `if`：`if (b == 2)`\nc. 如果你不这样写代码，就不必担心这类愚蠢的问题了。\n\
  \n让我们使用答案 C 并重写代码。在下面的代码中，`else` 属于哪个 `if`？\n\n```c\nif (a == 1) {\n    if (b ==\
  \ 2) {\n        printf(\"Condition orange\\n\");\n    } else {\n        printf(\"\
  Condition pink\\n\");\n    }\n}\n```\n\n在这里，你可以看出它属于第二个 `if`。这也是对上一个问题的“官方”答案，但通过清晰地编写代码，你可以得出答案，而不需要拿着放大镜去仔细研究\
  \ `C` 语言标准。\n\n需要注意的是，某些风格指南要求始终将 `if` 的主体放在大括号内；然而，这一决定最好留给程序员决定。\n\n## 循环语句\n\n\
  `loop`（循环）是一种编程功能，只要满足条件，就会重复某些代码。`C` 有三种循环语句：`while`、`for` 和 `do/while`。我们将从最简单的\
  \ `while` 开始，然后是 `for`。我们不会涉及 `do/while`，因为它很少被使用。\n\n### while 循环\n\n`while` 语句的通用形式如下：\n\
  \n```c\nwhile (condition)\n    statement;\n```\n\n记住 `statement` 可以是一个单个 `C` 语句，也可以是封装在\
  \ `{}` 中的一系列语句。为了看到 `while` 循环如何有用，让我们写一个程序测试 1 到 10 之间的数字，看看哪些是偶数，哪些是奇数，如列表 5-1\
  \ 所示。\n\n**odd.c**\n\n```c\n/*\n * 测试数字 1 到 10 是偶数\n * 还是奇数\n */\n#include <stdio.h>\n\
  \nint main()\n{\n    int aNumber = 1;\n    while (aNumber <= 10) {\n        if (aNumber\
  \ % 2 == 0) {\n            printf(\"Number is even\\n\");\n        } else {\n  \
  \          printf(\"Number is odd\\n\");\n        }\n        aNumber++;\n    }\n\
  \    return 0;\n}\n```\n\n列表 5-1: 测试奇偶性\n\n在 `main` 函数中，我们声明一个变量 `aNumber` 并初始化为\
  \ 1。接下来，我们设置 `while` 循环在 `aNumber` 小于等于 10 时运行。循环内部（即括号内），我们使用介绍过的 `if`/else` 语句检查\
  \ `aNumber` 除以 2 的余数。然后增加 `aNumber`。当 `aNumber` 达到 11 时，循环结束。输出如下：\n\n```\nNumber\
  \ is odd\nNumber is even\nNumber is odd\nNumber is even\nNumber is odd\nNumber is\
  \ even\n...（省略省略）\n```\n\n### for 循环\n\n我们的 `while` 循环有三个主要部分：初始化语句（`aNumber = 1`）、测试语句（检查\
  \ `aNumber` 是否大于等于 10）以及增加变量的语句（`++aNumber`）。\n\n这种模式非常常见，以至于它有自己的语句：`for` 语句。我们如下编写该语句：\n\
  \n```c\nfor (initialization; condition; increment)\n```\n\n为了看到它是如何工作的，让我们把 `while`\
  \ 循环转换为 `for` 循环。下面的代码显示使用 `for` 语句相同的奇偶性程序：\n\n```c\n/*\n * 测试数字 1 到 10 是偶数\n *\
  \ 还是奇数\n */\n#include <stdio.h>\n\nint main()\n{\n    int aNumber;\n    for (aNumber\
  \ = 1; aNumber <= 10; ++aNumber) {\n        if (aNumber % 2 == 1) {\n          \
  \  printf(\"%d is odd\\n\", aNumber);\n        } else {\n            printf(\"%d\
  \ is even\\n\", aNumber);\n        }\n    }\n    return 0;\n}\n```\n\nfor 循环\n\n\
  注意 `for` 子句包含了我们的三个语句，用分号隔开。`for` 子句中的任何一个语句都可以被省略。例如，我们可以在进入循环之前初始化 `aNumber`：\n\
  \n```c\naNumber = 1;\nfor (; aNumber <= 10; ++aNumber) {\n```\n\n或者，我们可以在循环体内部增加变量的值，而不是在\
  \ `for` 子句中：\n\n```c\nfor (aNumber = 1; aNumber <= 10;) {\n    // 奇偶测试\n    ++aNumber;\n\
  }\n```\n\n然而，如果省略了条件，循环将永远不会终止。这就是为什么下面的语句无限循环：\n\n```c\nfor (;;)\n```\n\n我们在嵌入式程序中使用这种“永远”循环，因为程序不应该退出。\n\
  \n## 使用按钮\n\n现在我们已经知道了如何做决策，我们将编写一个根据开发板默认输入源（蓝色按钮）做出决策的程序。我们的程序将利用我们知道如何控制的唯一输出：LED。让我们把开发板变成一个微型的电脑灯。\n\
  \n\n\n启动 STM32 的 System Workbench 并开始一个新的嵌入式项目。`main.c` 文件应如下所示：\n\n```\n/**\n \
  \ **************************************************************\n  * @file    main.c\n\
  \  * @author  Steve Oualline\n  * @version V1.0\n  * @date    11-April-2018\n  *\
  \ @brief   按下按钮 -- 闪烁 LED\n  **************************************************************\n\
  */\n\n#include \"stm32f0xx.h\"\n#include \"stm32f0xx_nucleo.h\"\n\nint main(void)\n\
  {\n  1 GPIO_InitTypeDef GPIO_LedInit; // 初始化 LED\n    GPIO_InitTypeDef GPIO_ButtonInit;\
  \  // 初始化按键\n    GPIO_PinState result; // 读取引脚的结果\n\n    HAL_Init();\n\n    // LED\
  \ 时钟初始化\n  2 LED2_GPIO_CLK_ENABLE();\n\n    // 初始化 LED.\n  3 GPIO_LedInit.Pin =\
  \ LED2_PIN;\n    GPIO_LedInit.Mode = GPIO_MODE_OUTPUT_PP;\n    GPIO_LedInit.Pull\
  \ = GPIO_PULLUP;\n    GPIO_LedInit.Speed = GPIO_SPEED_FREQ_HIGH;\n    HAL_GPIO_Init(LED2_GPIO_PORT,\
  \ &GPIO_LedInit);\n\n    // 按键时钟初始化\n    USER_BUTTON_GPIO_CLK_ENABLE();\n\n    /*\
  \ 配置 GPIO 引脚：用于按键 */\n    GPIO_ButtonInit.Pin = USER_BUTTON_PIN;\n    GPIO_ButtonInit.Mode\
  \ = GPIO_MODE_INPUT;\n  4 GPIO_ButtonInit.Pull = GPIO_PULLDOWN;\n    GPIO_ButtonInit.Speed\
  \ = GPIO_SPEED_FREQ_HIGH;\n    HAL_GPIO_Init(USER_BUTTON_GPIO_PORT, &GPIO_ButtonInit);\n\
  \n    for(;;) {\n        // 获取按键的当前状态\n        result = HAL_GPIO_ReadPin(USER_BUTTON_GPIO_PORT,\n\
  \                                  USER_BUTTON_PIN);\n        if (result == GPIO_PIN_SET)\n\
  \            HAL_GPIO_WritePin(LED2_GPIO_PORT,\n                              LED2_PIN,\
  \ GPIO_PIN_SET);\n        else\n            HAL_GPIO_WritePin(LED2_GPIO_PORT,\n\
  \                              LED2_PIN,GPIO_PIN_RESET);\n    }\n}\n```\n\n让我们详细检查这段代码。\n\
  \n### 初始化\n\n为了开始我们的程序，我们将使用许多由硬件抽象层 (HAL) 定义的代码。在接下来的几个章节中，你将学习这些部分中的每一个一个。\n\n\
  首先，我们定义了一个名为 `GPIO_LedInit` 的新变量，类型为 `GPIO_InitTypeDef` 1。`GPIO_InitTypeDef` 类型不是标准的\
  \ C 类型：它由程序顶部引入的 HAL 头文件定义。在此时，该类型的细节并不重要。我们需要这个变量来定义 LED 引脚将如何配置。（你将在稍后的章节中学习如何定义变量类型。）\n\
  \n同样，我们定义了另一个变量 `GPIO_ButtonInit` 来定义按键 GPIO 引脚将如何配置，以及一个用于存储按键引脚状态的变量（`GPIO_PinState`）。\n\
  \n在 `main` 过程中，我们执行的第一件事是调用 `HAL_Init` 来设置硬件，就像我们在第 3 章的闪烁程序中所做的那样。你需要在每个 STM32\
  \ 程序的顶部调用 `HAL_Init`。\n\n接下来，我们开启 `LED2`（用户 LED）的时钟 2。`clock` 控制我们写入 GPIO 引脚的数据如何到达实际的引脚。如果没有这一行，写入\
  \ LED 的操作将不起作用。尽管它看起来像是对名为 `LED2_GPIO_CLK_ENABLE` 函数的调用，但它实际上是一个预处理器宏，我们稍后会学习。\n\
  \n现在我们来到为 `GPIO_LedInit` 变量赋值的部分 3，这是一个结构体类型，包含许多我们需要单独赋值的成员。稍后，你将学习这里发生的细节。\n\n\
  类似的代码初始化了用于按键的引脚，但引脚模式被设置为 `GPIO_MODE_INPUT`，因为我们将读取引脚以获取按键状态，而不是写入它。\n\n### 选择下拉电路\n\
  \n注意，我们将 `Pull` 字段设置为 `GPIO_PULLDOWN` 4，而不是 `GPIO_PULLUP`。\n\n`Pull` 字段告诉 CPU 使用何种类型的上拉/下拉电路。输入引脚可以有三种状态之一：浮空（floating）、上拉和下拉。图\
  \ 5-1 显示了浮空输入的电路。\n\n![f05001](img/f05001.png)\n\n图 5-1：浮空电路\n\n当开关 SW1 断开时，没有电压应用到\
  \ `User_Button_Pin`。因此，它可以高电平（约 3 伏或更高）、低电平（小于约 3 伏）或之间的任何值。它可能由附近浮动的杂散电噪声设定。这里的关键在于，除非该信号实际上短接到地或电源，否则无法知道此信号的值。\n\
  \n现在让我们来看带有上拉电路的输入（参见图 5-2）。\n\n\n\n\n`break` 语句允许你提前退出循环（也就是说，跳出循环）。例如，考虑下面这段短程序，它在数组中查找一个键数字。如果数字存在，程序就会打印它：\n\
  \n```c\n/*\n * 在数组中查找键数字。\n */\n#include <stdio.h>\n#include <stdbool.h>\n\n#define\
  \ ARRAY_SIZE  7   // 要搜索数组的大小\n\nint main()\n{\n    // 要搜索的数组\n    int array[ARRAY_SIZE]\
  \ = {4, 5, 23, 56, 79, 0, -5};\n    static const int KEY = 56; // 要查找的键值\n\n   \
  \ for (unsigned int index = 0; index < ARRAY_SIZE; ++index) {\n        if (array[index]\
  \ == KEY) {\n            printf(\"Key (%d) found at index %d\\n\",\n           \
  \        KEY, index);\n          break;\n        }\n    }\n    return (0);\n}\n\
  ```\n\n这个程序在数组中搜索键值。一旦我们找到了这个键值，任务就完成了。我们不想继续执行循环的剩余部分，所以为了退出，我们使用了 `break` 语句。\n\
  \n### continue 语句\n\n另一个循环控制语句 `continue` 会从循环的顶部开始执行。下面的程序打印一个命令列表，跳过那些以点开头的命令。当我们遇到其中一个这类命令时，我们使用\
  \ `continue` 命令跳转到循环顶部：\n\n```c\n/*\n * 在数组中查找键数字。\n */\n#include <stdio.h>\n\n\
  #define COMMAND_COUNT 5 // 命令数量\n\n// 命令，以 . 开头的是隐藏命令\nstatic const char commands[COMMAND_COUNT][4]\
  \ = {\n    \"help\",\n    \"exec\",\n    \".adm\",\n    \"quit\"\n};\nint main()\n\
  {\n    // 打印帮助文本\n    for (unsigned int index = 0;\n         index < COMMAND_COUNT;\n\
  \         ++index) {\n      if (commands[index][0] == '.') {\n            // 隐藏命令\n\
  \          continue;\n        }\n        printf(\"%s\\n\", commands[index]);\n \
  \   }\n    return (0);\n}\n```\n\n这个程序的关键在于测试我们是否有一个点命令，然后通过 `continue` 重新开始（从而跳过循环的其余部分和\
  \ `printf`）。\n\n## 反模式 (Anti-patterns)\n\n在你学习如何使用循环的同时，你也应该学习如何*不*使用循环。编程行业中渗透进了一些编程模式，它们对混乱问题的作用大于对促进良好编程的作用，这就是为什么它们被称为*反模式*（*anti-patterns*）。我要提醒你注意两种。\n\
  \n### 空的 while 循环\n\n第一个反模式是空的 `while` 循环。考虑以下代码：\n\n```c\nwhile (GPIO_PIN_SET ==\
  \ HAL_GPIO_ReadPin(USER_BUTTON_GPIO_PORT, USER_BUTTON_PIN));\n{\n    // ... 执行某些操作\n\
  }\n```\n\n你可能认为这段代码只要用户按住按钮，就会重复某些操作。但事实并非。不这样做的原因是 `while` 循环只影响一条语句。你可能假设 `while`\
  \ 循环内的语句是花括号括的那个，但在括号之前还有一个语句。这是一个非常短的语句，非常容易被忽略，因为它是一个空语句。我们可以断定它的存在，因为语句后面有一个分号：\n\
  \n```c\nwhile (GPIO_PIN_SET == HAL_GPIO_ReadPin(USER_BUTTON_GPIO_PORT, USER_BUTTON_PIN));\n\
  {\n    // ... 执行某些操作\n}\n```\n\n分号很容易被忽视。这就是为什么我必须用**粗体**标注它。这也是为什么这种编码被认为是很糟糕。非常糟糕。\n\
  \n`continue` 语句拯救了我们。我们可以将这个 `while` 循环重写为如下：\n\n```c\nwhile (GPIO_PIN_SET == HAL_GPIO_ReadPin(BTN_PORT,\
  \ BTN_PIN))\n    continue;\n{\n    // ... 执行某些操作\n}\n```\n\n现在我们可以看到 `while` 循环控制的是\
  \ `continue` 语句，而不是其他任何内容。缩进和那个明显的语句告诉了我们这一点。\n\n### while 中的赋值\n\n第二个反模式是在 `while`\
  \ 循环中赋值：\n\n```c\nwhile ((result = ReadPin(BTN_PORT, BTN_PIN)) == GPIO_PIN_SET)\
  \ {\n    // ... 语句\n}\n```\n\n这条语句同时做了两件事。首先，它调用 `ReadPin` 并将结果赋值给 `result`。其次，它测试\
  \ `result` 以检查它是否被设置。\n\n如果程序一次只做一些简单的小事，会更容易理解和维护。这种捷径以牺牲程序清晰度为代价，节省了几个新换行的输入时间。它完全可以写成这样：\n\
  \n```c\nwhile (1) {\n    result = ReadPin(BTN_PORT, BUTTON_PIN);\n    if (result\
  \ != GPIO_PIN_SET)\n        break;\n    // ... 语句\n}\n```\n\n我们的目标应该是让程序尽可能地简单和易读，而不是尽可能地紧凑和巧妙。\n\
  \n## 总结\n\n我们现在掌握了计算的两个关键方面：数字以及如何根据这些数字做决策。单一决策可以通过 `if` 语句完成。\n\n\n\n在 `C` 语言中，没有任何机制可以阻止你对不存在的数组元素进行索引，虽然可以使用非法索引，但结果是未定义的（这意味着可能会发生某些错误）。例如，`anArray`\
  \ 的最后一个元素是 `4`，因此以下声明是合法的：\n\n```\nanArray[4] = 0;     // 合法\n```\n\n然而，这一个是不合法的：\n\
  \n```\nanArray[5] = 9;     // 非法，5 太大了\n```\n\n该语句尝试访问数组中的元素。\n\n## 数组的实际运行\n\n\
  让我们看看数组是如何实际运行的。查看列表 6-1，这是一个计算数组元素之和并输出总数的程序。\n\n### 列表 6-1：基础数组用法\n\n```\n/*\n\
  \ * 求一系列数字之和。\n */\n#include <stdio.h>\n\nint main()\n{\n    const int NUMBER_ELEMENTS\
  \ = 5;      // 元素数量\n    int numbers[NUMBER_ELEMENTS];       // 数字\n    int sum;\
  \                            // 目前为止的和\n    int current;                       \
  \ // 我们正在加的数字\n\n    numbers[0] = 5;\n    numbers[1] = 8;\n    numbers[2] = 9;\n\
  \    numbers[3] = -5;\n    numbers[4] = 22;\n\n    sum = 0;\n    // 遍历每个元素并将它们加起来。\n\
  \    for (current = 0; current < NUMBER_ELEMENTS; ++current)\n    {\n        sum\
  \ += numbers[current];\n    }\n    printf(\"Total is %d\\n\", sum);\n    return\
  \ (0);\n}\n```\n\n我们首先定义一个变量 `NUMBER_ELEMENTS` 来存储数组中的元素数量。关键字 `const` 告诉 `C` 该变量是不允许更改的（稍后会详细介绍）。\n\
  \n我们在两个地方使用了这个常量。第一个地方声明数组；第二个地方遍历数组的每个元素。虽然我们可以在这两个地方直接使用值 `5`，但这样做会在我们的代码中引入一个“魔数”。*魔数*是指在程序多处出现，但其与代码的联系并不明确的数字。使用魔数是有风险的；在这种情况下，如果我们更改了数组声明中的\
  \ `5`，就必须记住也更改循环中的 `5`。通过使用常量声明，我们只在一个地方定义数组的大小。如果我们将常量更改为 `14`，系统会自动处理所有使用该它的地方。\n\
  \n回到代码。我们需要在数组中放入一些数字，因此我们通过给每个索引赋值来实现。接下来，我们使用 `for` 循环来访问数组的每个元素。`for` 语句展示了 `C`\
  \ 编程中遍历数组的常用短语。循环从零开始，只要索引*小于*（`<`）数组的大小就会持续。索引必须小于 `5`，因为 `number[5]` 是不存在的元素。\n\
  \n数组可以在声明时进行初始化，就像简单变量一样，通过在大括号内列出所有元素：\n\n```c\n// 定义一些要求和的数字。\nint numbers[5]\
  \ = {5, 8, 9, -5, 22};\n```\n\n在这种情况下，元素的数量必须匹配数组的大小，否则你会收到警告信息。\n\n`C` 是一种聪明的语言。它可以根据元素的数量推断出数组的大小，因此这种声明也是有效的：\n\
  \n```c\n// 定义一些要求和的数字。\nint numbers[] = {5, 8, 9, -5, 22};\n```\n\n## 内部原理：指针\n\n\
  我的父亲 C. M. Oualline 曾著名地教导：“有东西，也有指向东西的指针。”参见图 6-1 关于其含义的详细图表。尽管看起来看起来简单，但理解这张图极其重要。\n\
  \n![f06001](img/f06001.png)\n\n图 6-1：东西与指向东西的指针\n\n整数是一个东西。事实上，它是一个包含整数的东西。指针是某个东西的地址。\n\
  \n东西的大小不同。`uint64_t` 整数是一个较大的东西，而 `uint8_t` 是较小的东西。这里的关键在于东西的大小各异。指针的大小是固定的。它指向的东西可以大可以小，但指针的大小始终相同。\n\
  \n指针对于快速访问数据结构和将数据结构连接在一起非常有用。在嵌入式编程中，指针用于指向内存映射 I/O 设备，从而让程序获得对设备的控制权。\n\n指针最大的优势是它可以指向任何东西。最大的缺点是它可以指向不应该指向的东西。当这种情况发生时，程序会开始执行奇怪且意外的操作，所以请非常小心地使用指针。\n\
  \n要声明指针，在声明中使用星号（`*`）表示该变量是指针而不是东西：\n\n```c\nuint8_t* thingPtr;      // 指向整数的指针\n\
  ```\n\n取地址运算符（`&`）将一个东西转换为指向该东西的指针：\n\n```c\nuint8_t thing = 5;      // 一个东西\nthingPtr\
  \ = &thing;      // ptr 指向 thing\n```\n\n\n\n要查看指针实际指向的内容，请将此程序输入 STM32 Workbench\
  \ 并使用调试器运行它。在所有赋值完成之后设置一个断点，并运行程序到该断点处。\n\n打开 `Variables` 面板可以向展示所有的变量及其值（请参见图 6-2）。\n\
  \n![f06002](img/f06002.png)\n\n图 6-2：带有指针的 `Variables` 面板\n\n通常情况下，指针的值本身并不有趣。更有趣的是它指向的内容。点击\
  \ `+` 图标展开 `smallPtr` 条目，我们可以看到 `smallPtr` 指向 `6`（也称为字符 `'\\006'`）。同样，我们可以看到 `largePtr`\
  \ 指向 `987654321`。\n\n### 数组与指针算术\n\nC 语言处理数组变量和指针非常相似。考虑以下代码：\n\n```\nint array[5]\
  \ = {1,2,3,4,5};\nint* arrayPtr = array;\n```\n\n我们给 `arrayPtr` 赋值了 `array` 的值，而不是\
  \ `&array`，因为 C 语言在像指针一样使用数组时，会自动将其转换为指针。事实上，数组和指针几乎是互换的，只是它们的声明方式不同。\n\n现在让我们来访问数组的一个元素：\n\
  \n```\nint i = array[1];\n```\n\n这种语法与以下代码相同，后者的意思是取 `arrayPtr` 的值，对其加 1（根据所指向数据的大小进行缩放），并返回该表达式结果所指向的数据：\n\
  \n```\nint i = *(arrayPtr+1);\n```\n\n接下来的程序详细演示了数组和指针之间的关系：\n\n```\n/*\n * 演示数组和指针之间的关系。\n\
  \ */\n#include <stdio.h>\nint main()\n{\n    int array[] = {1,2,3,4,-1}; // \n \
  \   int* arrayPtr = array;      // 指向数组的指针\n\n    // 使用数组打印数组。\n    for (int index\
  \ = 0; array[index] >= 0; ++index) {\n        printf(\"Address %p Value %d\\n\"\
  ,\n               &array[index], array[index]);\n    }\n    printf(\"--------------\\\
  n\");\n    // 使用指针进行相同的操作\n    for (int index = 0; *(arrayPtr +index) >= 0; ++index)\
  \ {\n        printf(\"Address %p Value %d\\n\",\n                arrayPtr + index,\
  \ *(arrayPtr + index));\n    }\n    printf(\"--------------\\n\");\n    // 使用递增指针进行相同的操作\n\
  \    for (int* current = array; *current >= 0; ++current) {\n        printf(\"Address\
  \ %p Value %d\\n\", current, *current);\n    }\n\n}\n```\n\n该程序的第一件事是用常规方式打印每个数组元素的地址和内容：即使用\
  \ `for` 循环依次访问每个索引。\n\n在下一个循环中，我们使用指针算术进行打印。现在，我们需要确切理解我们正在处理什么。变量 `array` 是一个数组。表达式\
  \ `array[index]` 是一个整数，而 `&`（地址）运算符将整数转换为指针，因此 `&array[index]` 是一个指针。结果是，这段代码为数组中的每个元素打印了以下内存地址：\n\
  \n```\nAddress 0x7fffa22e0610 Value 1\nAddress 0x7fffa22e0614 Value 2\nAddress 0x7fffa22e0618\
  \ Value 3\nAddress 0x7fffa22e061c Value 4\n```\n\n指针值每次增加 4（一个整数的大小），因此 `array[0]`\
  \ 位于地址 `0x7fffa22e0610`，而 `array[1]` 位于大 4 字节的内存位置，即 `0x7fffa22e0614`。\n\n这种方法使用了指针算术。（实际上我们在第一种方法中也使用了指针算术，但\
  \ C 语言在背后隐藏了它。）通过这个循环，你可以看到 `arrayPtr + 1` 是 `0x7fffa22e0614`，这与 `&array[1]` 完全相同。再次注意，使用指针算术，，会自动根据所指向项的大小进行缩放。在这种情况下，所指向的数据类型是\
  \ `int`，因此表达式 `arrayPtr + 1` 实际上是 `arrayPtr + 1 * sizeof(int)`，从而 `0x7fffa22e0610\
  \ + 1` 真的是 `0x7fffa22e0610 + 1 * sizeof(int)`，结果为 `0x7fffa22e0614`。\n\n最后，我们使用递增指针以第三种方式做了相同的事情。\n\
  \n使用指针访问数组很常见，因为很多人认为这样做比使用数组索引更高效。毕竟，计算 `array[index]` 涉及地址计算，但编译器技术在多年来已经不断改进。今天的编译器非常擅长生成更高效的代码，因此使用指针进行数组索引实际上并不更高效。\n\
  \n然而，使用地址逻辑更让人困惑。目前还不清楚指向的是什么，以及数组的边界在哪里，因此应该避免使用后两种方法。我将它们包含在示例中，是因为那里有很多遗留代码使用指针算术访问数组，并且为了向你展示不要怎么做。\n\
  \n### 数组溢出\n\nC 语言不进行 `bounds checking`（边界检查），这意味着它不会检查你是否尝试访问数组边界之外的元素。五元素数组（`int\
  \ a[5]`）的合法元素是 `a[0]`、`a[1]`、`a[2]`、`a[3]`、`a[4]`。\n\n\n\n\n新手 C 程序员最常犯的错误是忘记 C\
  \ 数组从 0 开始，到 `size`-1 。例如，你可能会编写以下代码：\n\n```c\nint array[5];\n// 错误\nfor (int i\
  \ = 1; i <= 5; ++i)\n    array[i] = 0;\n```\n\n如果你在 Linux 机器上编程，`Valgrind` 和 `GCC`\
  \ 地址消毒剂等工具工具会对数组溢出进行运行时检查。在嵌入式世界中，我们没有这样的工具，所以只能小心。\n\n## 字符与字符串\n\n我们已经讨论了处理数字，但你有时可能想在程序中包含其他类型的数据，例如文本。为此，我们引入一种新的变量类型\
  \ `char`，它存储一个用单引号（`''`）括起来的字符。例如，下面的代码创建了一个名为 `stop` 的 `char` 变量来存储字符 `'S'`：\n\n\
  ```c\nchar stop = 'S'; // 表示停止的字符\n```\n\n`string` 是字符数组，以字符串结束符（`\\0`）结尾。字符 `\\\
  0` 也称为 NUL 字符（带有一个 *L*）。这是因为在原始的串口通信中，它没有任何意义。\n\n为了练习使用字符串，我们现在来看下面的程序，它会打印字符串“Hello\
  \ World”：\n\n```c\n/*\n * 使用字符串变量实现 Hello World\n */\n#include <stdio.h>\n\n// 要打印的字符\n\
  const char hello[] = {'H', 'e', 'l', 'l', 'o', ' ',\n                      'W',\
  \ 'o', 'r', 'l', 'd', '\\0'};\n\nint main()\n{\n    puts(hello); // 写入字符串并换行\n \
  \   return (0);\n}\n```\n\n我们首先定义了一个名为 `hello` 的值为 `\"Hello World\"` 的字符串。这种初始化显式地定义了字符串的每一个元素。在现实生活中，你很少看到这样的初始化，因为\
  \ C 提供了一种让事情变得简单得快捷方法。（我们很快就会看到。）这个版本让一切都一目易见，有利于学习，但不够简洁。\n\n随后，我们使用标准 C 函数 `puts`\
  \ 打印字符串。`puts` 函数打印单个字符串且非常简单，而 `printf` 可以进行格式化，是一个庞大且复杂的函数。`puts` 函数还会添加换行符，所以我们没有在原始字符串中放入它。\n\
  \nC 有一种字符串初始化的简写方式，允许我们这样写相同的声明：\n\n```c\nconst char hello[] = \"Hello World\";\
  \   // 要打印的字符\n```\n\n这两个语句都创建了一个包含 12 个字符的数组并对其进行初始化。（`\"Hello World\"` 包含 11 个字符，第\
  \ 12 个是字符串结束符 `'\\0'`，当你使用简写时系统会自动提供。）\n\n由于数组和指针非常相似，你也可以将字符串声明为指针：\n\n```c\nconst\
  \ char* const hello = \"Hello World\";   // 要打印的字符\n```\n\n你会注意到我们现在有两个 `const`\
  \ 关键字。这里的情况变得有点复杂了。第一个 `const` 影响指针；第二个影响所指向的数据。下面的程序说明了它们是如何工作的：\n\n```c\n/**\n\
  \ * @brief 演示在指针中使用 const 的程序\n */\n\nchar theData[5] = \"1234\";             //\
  \ 一些演示数据\n\nchar*       allChange;          // 指针和值都可以改变\nconst char*       dataConst\
  \ = \"abc\"   // 字符常量，指针不是\nchar* const ptrConst = theData; // 字符变量，指针常量\nconst\
  \ char* const allConst = \"abc\";   // 谁都不许改\n\nint main()\n{\n    char otherData[5]\
  \ = \"abcd\";   // 其他一些数据\n\n    allChange = otherData;        // 修改指针\n    *allChange\
  \ = 'x';             // 修改数据\n\n    dataConst = otherData;        // 修改指针\n    //\
  \ *dataConst = 'x';          // 非法修改数据\n\n    // ptrConst = otherData;      // 非法修改指针\n\
  \    *ptrConst = 'x';              // 修改数据\n\n    // allConst = otherData;     \
  \ // 非法修改指针\n    // *allConst = 'x';           // 非法修改数据\n    return (0);\n}\n```\n\
  \n这个程序展示了使用 `const` 定义字符指针的所有可能方法。我们尝试修改指针和所指向的数据。根据我们放置 `const` 修饰符的位置，这些语句中的某些将失败，某些则可以正常工作。\n\
  \n## 总结\n\n我们从这本书开始处理处理可以存储单个值的变量。数组允许我们处理一组数据。这在组织数据方面赋予了我们更大的力量。\n\n字符串是一种特殊的数组类型。它们持有字符，并有一个字符串结束标记表示它们的结束。\n\
  \n指针和数组的相似之处在于，它们都可以用于访问内存区域。数组受到大小的限制（尽管它们溢出），而指针不受限制。C 不限制指针的使用，这赋予了该语言巨大的力量。这种力量可以用于善处，例如处理内存映射\
  \ I/O 时，也可以用于坏处，例如意外破坏随机内存。\n\n正如我们看到的，C 赋予了程序员充分利用机器的能力。但这种力量是带有代价的。C 不会阻止你做愚蠢的事。C\
  \ 提供了数组和指针等工具来组织你的数据，取决于你如何明智地使用。\n\n## 编程题\n\n1. 编写一个程序找到整数数组中编号最小和最大的元素。\n2. 写一个程序扫描数组中的重复数字。\n\
  3. 编写一个程序扫描数组中可能出现在任何位置的重复数字。\n4. 创建一个程序只打印数组中的奇数。\n5. 写一个程序遍历字符串并将每个单词的首字母大大写。你需要查找标准函数\
  \ `isalpha` 和 `toupper`。\n\n\n\n\n\n```c\n/*\n * 用于演示局部变量的无程序\n */\n#include <stdio.h>\n\
  \nint global = 5;    // 一个全局变量\n\nint main()\n{\n      int localToProcedure = 3;\n\
  \      // ... 执行一些操作\n      {\n         1 int local = 6; // 一个局部变量\n\n         \
  \ {\n              int veryLocal = 7;  // 一个更局部的变量\n              // ... 执行一些操作\n\
  \        2 }\n          // veryLocal 不再有效了。\n    3 }\n      // local 不再有效了。\n  \
  \    return (0);\n  }\n```\n\n**Listing 7-1: 局部变量**\n\n局部变量的作用域从它的定义开始，到包含它的大括号（`{}`）结尾结束。变量\
  \ `localToProcedure` 在整个 `main` 函数中都是有效的。\n\n现在让我们看看较小的作用域，从 `local` 变量的定义 1 开始。该变量的作用域结束于紧随后的右大括号\
  \ 2，那个大括号属于另一个块（用大括号括起来的代码段）。相反，它延伸到 `local` 定义之前开始的那个块的结束括号 3。`veryLocal` 变量的作用域甚至更小。它从定义\
  \ `int veryLocal = 7;` 开始，并在块结束 2 时结束。\n\n当变量的作用域结束时，程序就无法再使用该变量。例如，尝试在 `main` 结束处使用\
  \ `return(veryLocal);` 语句返回 `veryLocal` 的值将是不起的。\n\n## 隐藏变量\n\n在上一个示例中，所有的局部变量除了作用域不同，还有不同的名称。然而，变量在不同的作用域也可以有相同的名称。如果多个变量具有相同的名称，C\
  \ 将使用当前作用域中变量的值，并隐藏其他变量。（请不要这样做，因为这会让代码变得令人困惑。在这里提到它是为了让你知道需要避免什么。）\n\n让我们看看 [Listing\
  \ 7-2]，它展示了一个写得非常糟糕的程序。\n\n**hidden.c**\n\n```c\n/*\n * 用于演示隐藏变量的无程序\n */\n#include\
  \ <stdio.h>\n\n1 int var = 7;            // 一个变量\n\nint main()\n{\n    // ... 执行一些操作\n\
  \    {\n      2 int var = 13;   // 隐藏了 var = 7\n\n        {\n          3 int var\
  \ = 16;     // 隐藏了 var = 7, var = 13\n\n            // ... 执行一些操作\n        }\n \
  \       // ... 执行一些操作\n    }\n    // ... 执行一些操作\n    return (0);\n}\n```\n\n**Listing\
  \ 7-2: 隐藏变量**\n\n在这个程序中，我们定义了三个都名为 `var` 的变量。当第二个被定义 2 时，它隐藏了第一个 1。同样，`int var =\
  \ 16;` 的定义隐藏了第二个变量 `var` 2，而它隐藏了第一个 1。\n\n假设我们在第三个定义之后添加以下语句：\n\n```c\nvar = 42;\n\
  ```\n\n我们正在给哪个 `var` 赋值？是在 1、2 还是 3 定义的那个？我们必须问这个问题正是这段代码令人困惑的良好指标。我不会把这个答案留给读者去寻找，因为正确的解决方案是从根本上不要这样做。\n\
  \n## 过程\n\n*procedure*（过程）是一种定义代码的方式，使其可以重复使用。让我们看看 [Listing 7-3]，它提供了一个简单的示例。\n\
  \n**hello3.c**\n\n```c\n/**\n * 打印 hello, hello, hello, world.\n */\n#include <stdio.h>\n\
  \n/**\n * 向世界你好。\n */\n1 void sayHello(void)\n{\n  2 puts(\"Hello\");\n}\n\nint\
  \ main()\n{\n  3 sayHello();\n    sayHello();\n    sayHello();\n    puts(\"World!\"\
  );\n    return (0);\n}\n```\n\n**Listing 7-3: 过程演示**\n\n这个程序打印三次 `Hello`，然后打印 `World!`。该过程以一个注释块开始，这并不是严格必须的，但如果你打算编写高质量的代码，你应该在每个过程之前放置一个注释块。注释块的开头（`/**`）表示\
  \ Doxygen 文档工具应该处理它。为了与 STM 库的格式兼容，我们使用了相同的注释规范。\n\n语句 `void sayHello(void)` 1 告诉\
  \ C 我们的过程名称是 `sayHello`。它不返回任何内容（第一个 `void`）且不接受任何参数（第二个 `void`）。紧随该语句的 `{}` 块定义了过程的主体，包含了过程执行的所有指令\
  \ 2。三行 `sayHello();` 3 是对 `sayHello` 过程调用。它们告诉处理器保存下一个语句的位置（另一个对 `sayHello` 的调用或对\
  \ `puts` 的调用），然后从 `sayHello` 的第一行开始执行。当过程完成（或遇到 `return` 语句）时，执行将在调用保存的点继续。\n\n\
  ## 栈帧\n\n过程有自己的局部变量。编译器的工作是组织内存以便容纳这些变量。对于全局变量（不在过程中的变量），编译器会说类似“我需要 4 个字节来存放名为\
  \ `Total` 的整数。”链接器随后看到并为该变量分配内存中的物理位置（例如，`0xffffec04`）。全局变量在编译时静态分配，这意味着编译器为它们分配了空间。\n\
  \n*stack*（栈）是一个用于动态分配的内存区域。当一个过程开始时，它会创建一个*stack frame*（栈帧）来存放局部变量和临时值。当过程结束时，该帧会被销毁。\n\
  \n让我们看看 [Listing 7-4]，它展示了一个示例程序。\n\n**proc.c**\n\n```c\n/**\n * @brief 演示过程和局部变量的程序\n\
  \ */\n\n/**\n * 从另一个函数调用的函数\n */\nvoid inner(void) {\n    int i = 5;     // 一个变量\n\
  \    int k = 3;     // 另一个变量\n    i = i + k;     // 执行操作\n}\n/**\n * 外层函数\n */\n\
  void outer(void) {\n    int i = 6;     // 一个变量\n    int j = 2;     // 另一个变量\n  \
  \  i = j + i;     // 使用变量\n    inner();\n}\n\nint main()\n{\n    outer();\n    return(0);\n\
  }\n```\n\n**Listing 7-4: 栈帧演示**\n\n让我们为这个程序创建一个项目并开始调试。在调试器中运行程序，然后使用 **Run**▶**Step\
  \ Into** (F5) 逐步执行，直到到达 1。你的屏幕看起来应该像图 7-1。\n\n要查看每个过程中栈的位置，点击右上面板中的 **Registers**（寄存器）选项卡，向下滚动直到看到\
  \ `rsp` 寄存器。[图 7-2 显示它包含 `0x7fffffffd0e0`。\n\n\n\n\n取决于机器的不同，栈可能从低内存地址开始并向上增长，也从高内存地址开始向下增长。在本机器（x86）上，它是从高地址开始向下增长的。\n\
  \n`outer` 帧栈位于 `0x7fffffffd0f0`。由于我们的栈是向下增长的，这个数字比 `main` 的栈帧小。`inner` 帧位于 `0x7fffffffd110`（参见表\
  \ 7-1）。\n\n| `Address` | `Procedure` | `Contents` | `Comments` |\n| --- | --- |\
  \ --- | --- |\n| `0x7fffffffd110` | `main` | <overhead> | 栈底 |\n| `0x7fffffffd0f0`\
  \ | `outer` | <overhead> `i` `j` | |\n| `0x7fffffffd0e0` | `inner` | <overhead>\
  \ `i` `k` | 栈顶 |\n\n表 7-1: 栈使用\n\n要理解的一个关键概念是，栈帧是按照后进先出（LIFO）的分配的。当我们完成 `inner`\
  \ 时，它的栈帧将被销毁，然后 `outer` 帧将被销毁。\n\n变量面板（见图 7-1，右上角）显示了 `i` 和 `k` 变量。调试器正在显示 `inner`\
  \ 栈帧中的变量，这可以通过 `inner` 栈帧在调试面板（左上角）被高亮可以看出。点击调试面板中的 `outer` 栈帧，你会看到变量面板变化并显示 `outer`\
  \ 的变量，如图 7-3 所示。\n\n![f07003](img/f07003.png)\n\n图 7-3: `outer` 栈帧\n\n让我们通过跳过 `inner`\
  \ 的最后一条指令继续调试程序。当我们退出 `inner` 时，该函数的栈帧就会消失，因为我们不再执行 `inner`，并且不需要地方存储其变量了。\n\n图\
  \ 7-4 显示了我们退出 `inner` 栈帧后的栈。\n\n![f07004](img/f07004.png)\n\n图 7-4: 退出 `inner` 栈帧后的栈\n\
  \n注意，现在栈上只有两个栈帧了。\n\n## 递归\n\n到为止，我们处理的是基础的过程调用；每个过程都有不同的名称，且调用过程非常简单。现在我们将关注*递归*，即函数调用自身。递归可以是一项强大的工具，但如果你不理解它的规则，使用起来就会很棘手。\n\
  \n经典的递归问题是计算阶乘。阶乘函数的定义如下：\n\n1. 当 `n` 为 1 时，`f(n)` = 1\n2. 否则，`f(n)` = `n` × `f(n`\
  \ – 1)\n\n将此转换为代码，我们得到了列表 7-5。\n\n**factor.c**\n\n```c\n/**\n * 递归地计算阶乘\n * (基础递归示例)\n\
  \ */\n\n#include <stdio.h>\n\n/**\n * 计算阶乘\n *\n * @param x 要计算阶乘的数字\n * @returns\
  \ 阶乘结果\n */\nint factor(const int x) {\n    if (x == 1)\n        return (1);\n \
  \   return (x * factor(x-1));\n}\n\nint main()\n{\n    int result = factor(5);\n\
  \    printf(\"5! is %d\\n\", result);\n    return (0);\n}\n```\n\n列表 7-5: 一个计算阶乘的程序\n\
  \n首先，我们调用 `factor(5)` 来获取 5 的阶乘。为了这一点，我们需要 `factor(4)`，因此在调用 `factor(4)` 时挂起 `factor(5)`。但\
  \ `factor(4)` 需要 `factor(3)`，所以我们挂工作并调用 `factor(3)`。现在 `factor(3)` 需要 `factor(2)`，同样，`factor(2)`\
  \ 需要 `factor(1)`。最后，`factor(1)` 不需要任何东西，所以它返回 1 给它的调用者 `factor(2)`。函数 `factor(2)`\
  \ 正在运行，因此它计算 2 × 1 并返回 2 给它的调用者 `factor(3)`。接下来，`factor(3)` 接收返回值 (2)，计算 2 × 3，并返回\
  \ 6 给它的调用者 `factor(4)`。接近结束时，`factor(4)` 计算 6 × 4 并返回 24。最后，`factor(5)` 计算 24 ×\
  \ 5 并返回 120。\n\n你在调试器中执行此程序时，你应该看到栈随着程序计算阶乘而增长和缩小。你还应该看到为 `factor` 过程分配了五个栈帧，每个实例一个：`factor(1)`、`factor(2)`、`factor(3)`、`factor(4)`\
  \ 和 `factor(5)`。\n\n两个规则决定了何时可以使用递归：\n\n1. 每次过程调用必须让问题变得简单。\n2. 必须有一个终点。\n\n让我们看看这些规则是如何工作的。每次过程调用必须让问题变得简单。必须有一个终点。让我们看看这些规则是如何工作的。每次过程调用必须让问题变得简单。必须有一个终点。让我们看看这些规则是如何工作的。每次过程调用必须让问题变得简单。必须有一个终点。让我们看看这些规则是如何工作的。每次过程调用必须让问题变得简单。必须有一个终点。让我们看看这些规则是如何工作的。每次过程调用必须让问题变得简单。必须有一个终点。让我们看看这些规则是如何工作的。每次过程调用必须让问题变得简单。必须有一个终点。让我们看看这些规则是如何工作的。每次过程调用必须让问题变得简单。必须有一个终点。让我们看看这些规则是如何工作的。每次过程调用必须让问题变得简单。必须有一个终点。让我们看看这些规则是如何工作的。每次过程调用必须让问题变得简单。必须有一个终点。让我们看看这些规则是如何工作的。每次过程调用必须让问题变得简单。必须有一个终点。让我们看看这些规则是如何工作的。每次过程调用必须让问题变得简单。必须有一个终点。让我们看看这些规则是如何工作的。每次过程调用必须让问题变得简单。必须有一个终点。让我们看看这些规则是如何工作的。每次过程调用必须让问题变得简单。必须有一个终点。让我们看看这些规则是如何工作的。每次过程调用必须让问题变得简单。必须有一个终点。让我们看看这些规则是如何工作的。每次过程调用必须让问题变得简单。必须有一个终点。让我们看看这些规则是如何工作的。每次过程调用必须让问题变得简单。必须有一个终点。让我们看看这些规则是如何工作的。\n\
  \n\n\n4. 创建一个函数，将数字中的各个数字相加。例如，123 的结果为 6（换句话说，即 1 + 2 + 3）。如果结果等于 10 或更大，则重复该过程，直到结果为一位数。例如，987\
  \ 是 9 + 8 + 7 = 24。这个结果比 10 大，所以 24 是 2 + 4，最终得到结果 6。\n\n# 第 8 章 复杂数据类型\n\n![](img/chapterart.png)\n\
  \n在本章中，我们将超越数组和简单类型，创建更复杂的数据类型。我们将从一个简单的 `enum` 开始，它定义了一个具名的项目列表。然后，我们将查看结构体（structures）和联合体（unions），它们持有不同类型的值，并通过名称访问（与数组不同，数组通过数字或索引访问包含单一类型的值）。为了创建一个自定义数据类型，我们将结合枚举、结构体和联合体。此外，我们还将探索结构自己在嵌入式编程中的用法。最后，我们将查看\
  \ `typedef`，它允许我们从现有类型定义自己的数据类型。\n\n## 枚举 (Enums)\n\n枚举类型（或 `enum`）是一种数据类型，允许我们定义一个具名的项目列表。例如，如果我们想在变量中存储一组有限颜色，可以输入以下内容：\n\
  \n```\nconst uint8_t COLOR_RED = 0;\nconst uint8_t COLOR_BLUE = 1;\nconst uint8_t\
  \ COLOR_GREEN = 2;\n\n#define colorType uint8_t;\n\ncolorType colorIWant = COLOR_RED\n\
  ```\n\n虽然这种方法可行，但我们仍然需要跟踪各种颜色。幸运的是，如果我们使用 `enum`，C 会为我们完成这些工作：\n\n```\nenum colorType\
  \ {\n    COLOR_RED,\n    COLOR_BLUE,\n    COLOR_GREEN\n};\n\nenum colorType colorIWant\
  \ = COLOR_RED;\n```\n\n有了 `enum`，C 会为我们进行记录工作。如果我们只有三种颜色，这并不是什么问题。然而，X Window 系统有\
  \ 750 多种具名颜色。跟踪所有这些数字是一个非易事的过程。\n\nC 在类型方面往往比较松散。在内部，C 分别为 `COLOR_RED`、`COLOR_BLUE`\
  \ 和 `COLOR_GREEN` 分配整数值 0、1 和 2。我们通常不关心这些，但有时这种赋值会暴露出来。例如，这段：\n\n```\nenum colorType\
  \ fgColor = COLOR_GREEN;\nprintf(\"The foreground color is %d\\n\", fgColor);\n\
  ```\n\n将打印以下内容：\n\n```\nThe foreground color is 2\n```\n\n此外，C 并不对 `enum` 赋值进行类型检查。例如，以下语句不会产生错误或警告：\n\
  \n```\ncolorIWant = 33;\n```\n\n我们的 `enum` 定义了三种颜色，因此颜色的合法数字是 0、1 和 2——而不是 33。这可能会导致问题。\n\
  \n假设我们写了一个函数来打印存储在 `colorIWant` 中的颜色。当用户看到以下输出时，他们会怎么想？\n\n```\nYour box color is\
  \ 33.\n```\n\n打印像这样的错误答案会给用户一个很好的提示，说明你的程序坏了。如果你使用 `enum` 值作为数组的索引，可以提供更好的提示。这里有一个例子：\n\
  \n```\nstatic const char* colorNames = {\"Red\", \"Blue\", \"Green\"};\nprintf(\"\
  Your box color is %s\\n\", colorNames[colorIWant]);\n```\n\n现在如果 `colorIWant` 是\
  \ 33，程序将打印：\n\n```\nYour box color is 33\n```\n\n## 预处理器技巧与枚举\n\n在这一节中，你将学习如何使用一些高级预处理器指令来让处理枚举变得简单一点。首先，我想说，在\
  \ 1000 次中会有 999 次，使用巧妙的技巧带来的麻烦比其价值大得多。简单清晰几乎总是比巧妙要好。这种情况是少数例外之一。\n\n让我们来看一些定义颜色及其颜色名称的代码。\n\
  \n```\n// WARNING：在不修改 colorNames 的情况下不要更改此处。\nenum colorType {\n    COLOR_RED,\n\
  \    COLOR_BLUE,\n    COLOR_GREEN\n};\n\n// WARNING：在不修改 colorType 的情况下不要更改此处。\n\
  static const char* colorNames = {\n    \"COLOR_RED\", \"COLOR_BLUE\", \"COLOR_GREEN\"\
  \n};\n```\n\n这个示例中有两个相互依赖的项目：`colorType` 和 `colorNames`。编写这段代码的程序员非常好，添加了一行注释说明这些项目是关联的，而且这两个项目实际上是紧挨着定义的。（有时相互依赖的项目可能位于不同的文件中，且没有注释说明这种关联。）\n\
  \n作为程序员，我们希望代码尽可能简单。有两个必须同时更新的不同项目并不是理想的。我们可以通过巧妙地使用预处理器来解决这个问题：\n\n```\n// 这是一个技巧的开头，用于同时定义枚举\
  \ colorType 的\n// 值和名称。下方的列表将被使用两次，\n// 一次生成值，另一次生成名称。\n\n#define COLOR_LIST \\\n\
  \        DEFINE_ITEM(COLOR_RED), \\\n        DEFINE_ITEM(COLOR_BLUE), \\\n     \
  \   DEFINE_ITEM(COLOR_GREEN)\n\n// 定义 DEFINE_ITEM，以便它为枚举生成实际值。\n#define DEFINE_ITEM(X)\
  \ X\nenum colorType {\n   COLOR_LIST\n};\n\n// 定义 DEFINE_ITEM，以便它为枚举生成名称。\n#define\
  \ DEFINE_ITEM(X) #X\nstatic const char* colorNames[] = {\n   COLOR_LIST\n};\n#undef\
  \ DEFINE_ITEM\n\n// 让我们开始定义：\n\n```\n#define COLOR_LIST \\\n        DEFINE_ITEM(COLOR_RED),\
  \ \\\n        DEFINE_ITEM(COLOR_BLUE), \\\n        DEFINE_ITEM(COLOR_GREEN)\n```\n\
  \n反斜杠（`\\`）告诉预处理器该行是延续的。当我们使用 `COLOR_LIST` 时，预处理器会将其转换为：\n\n```\nDEFINE_ITEM(COLOR_RED),\
  \ \\\nDEFINE_ITEM(COLOR_BLUE), \\\nDEFINE_ITEM(COLOR_GREEN)\n```\n\n当我们定义 `enum`\
  \ 时，我们需要我们的列表如下：\n\n```\nCOLOR_RED, COLOR_BLUE, COLOR_GREEN\n```\n\n我们通过定义 `DEFINE_ITEM`\
  \ 只输出项目名称来得到这一点：\n\n```\n#define DEFINE_ITEM(X) X\nenum colorType {\n   COLOR_LIST\n\
  };\n```\n\n这意味着下面的代码变成了：\n\n```\nenum colorType {\n    COLOR_RED, COLOR_BLUE, COLOR_GREEN\n\
  };\n```\n\n现在我们删除了 `DEFINE_ITEM` 的定义，因为枚举定义不再需要它了：\n\n```\n#undef DEFINE_ITEM\n\
  ```\n\n接下来，我们通过重新定义 `DEFINE_ITEM` 宏来定义 `colorNames` 列表：\n\n```\n#define DEFINE_ITEM(X)\
  \ #X\n```\n\n井号（`#`）告诉预处理器将后面的标记转换为字符串，因此现在 `COLOR_LIST` 将展开为：\n\n```\n\"COLOR_RED\"\
  ,\"COLOR_BLUE\",\"COLOR_GREEN\"\n```\n\n这是 `colorNames` 的完整定义：\n\n```\n#define DEFINE_ITEM(X)\
  \ #X\nstatic const char* colorNames[] = {\n   COLOR_LIST\n};\n#undef DEFINE_ITEM\n\
  ```\n\n注释是这个定义的至关重要的部分。每当你使用这种小技巧时，都要做好记录，以便维护这段代码的可士知道你做了什么。\n\n## 结构体 (Structures)\n\
  \nC 结构体（`struct`）允许我们将多个不同类型的项目组合在一起。这些被称为“字段”（fields）的项目通过名称识别。这与包含相同类型项目的数组结构不同，数组中被称为“元素”（elements）的项目通过数字进行索引。例如，考虑这个描述房屋的结构体：\n\
  \n```\nstruct house {\n    uint8_t stories;        // 房屋的层数\n    uint8_t bedrooms;\
  \       // 卧室数量\n    uint32_t squareFeet;    // 房屋面积\n};\n```\n\n要访问结构体的元素，请使用 `变量.字段`\
  \ 的格式，中间有一个点。例如：\n\n```\nstruct house myHouse;\n--snip--\nmyHouse.stories = 2;\n\
  myHouse.bedrooms = 4;\nmyHouse.squareFeet = 5000;\n```\n\n下面的程序展示了如何将所有内容整合在一起：\n\
  \n**struct.c**\n\n\n\n```c\n/**\n * 演示结构体的使用。\n */\n\n#include <stdio.h>\n#include\
  \ <stdint.h>\n\nstruct house {\n    uint8_t stories;        // 房屋层数\n    uint8_t\
  \ bedrooms;       // 卧室数量\n    uint32_t squareFeet;    // 房屋面积\n};\n\nint main()\
  \ {\n    struct house myHouse;   // 用于此演示的房屋\n\n    myHouse.stories = 2;\n    myHouse.bedrooms\
  \ = 4;\n    myHouse.squareFeet = 5000;\n    printf(\"House -- Stories: %d Bedrooms\
  \ %d Square Feet %d\\n\",\n        myHouse.stories, myHouse.bedrooms, myHouse.squareFeet);\n\
  \    printf(\"Size of the structure %ld\\n\", sizeof(myHouse));\n    return (0);\n\
  }\n```\n\n让我们在 STM32 Workbench 中调试此程序（参见图 8-1）。\n\n![f08001](img/f08001.png)\n\n\
  图 8-1：`struct` 变量显示\n\n停在第 20 行，我们现在可以在变量列表中看到结构体。点击 `+` 图标展开结构体以显示其内容。\n\n### 内存中的结构体\n\
  \n让我们看看 C 编译器如何在内存中布局这个结构体。编译器需要为 `stories` (`uint8_t`) 分配 1 字节，为 `bedrooms` (`uint8_t`)\
  \ 分配 1 字节，为 `squareFeet` (`uint32_t`) 分配 4 字节。逻辑上，布局应该如表 8-1 所示。\n\n| 偏移量 | 类型 |\
  \ 字段 |\n| --- | --- | --- |\n| 0 | `uint8_t` | `stories` |\n| 1 | `uint8_t` | `bedrooms`\
  \ |\n| 2 | `uint32_t` | `squareFeet` |\n| 3 | | |\n| 4 | | |\n| 5 | | |\n\n表 8-1：结构体布局\n\
  \n从表 8-1 看到结构体占用了 6 字节。然而，当我们运行程序时，看到了以下输出：\n\n```\nSize of the structure 8\n```\n\
  \n另外 2 字节是从哪里来的？\n\n问题在于内存设计。在 ARM 芯片（以及许多其他芯片）上，内存被为一系列在 4 字节边界对齐的 32 位整数，如下所示：\n\
  \n| `0x10000` | 32 bits |\n| `0x10004` | 32 bits |\n| `0x10008` | 32 bits |\n| `.\
  \ . .` | |\n\n假设我们要在 `0x10001` 处需要一个 8 位字节。机器从 `0x10000` 取出 32 位，然后丢弃 24 位，这是浪费的，因为获取了额外数据，尽管这不会影响性能。\n\
  \n现在，假设我们需要从 `0x10002` 开始的一个 32 位整数。尝试直接获取此数据会导致对齐异常，并终止我们的程序。计算机必须执行以下操作：\n\n1.\
  \ 从 `0x10000` 取出 16 位。\n2. 从 `0x10004` 取出 16 位。\n3. 将它们合并。\n\nARM 内部电路*不会*完成这些步骤。相反，编译器必须生成多条指令来完成这项工作，这对性能是有利的。（我们将在本章稍后详细讨论这一点。）\n\
  \n如果 `squareFeet` 对齐在 4 字节边界而不是 2 字节边界，那就好得多了，这样编译器就可以通过添加 2 字节的填充（padding）来优化结构体的布局。这使得结构体变大，但更容易处理。表\
  \ 8-2 显示了结构体实际调整后的布局。\n\n| 偏移量 | 类型 | 字段 |\n| --- | --- | --- |\n| 0 | `uint8_t`\
  \ | `stories` |\n| 1 | `uint8_t` | `bedrooms` |\n| 2 | `uint8_t` | (padding) |\n\
  | 3 | `uint8_t` | (padding) |\n| 4 | `uint32_t` | `squareFeet` |\n| 5 | | |\n| 6\
  \ | | |\n| 7 | | |\n\n表 8-2：带填充的结构体布局\n\n这种额外的填充有时是一个问题。例如，如果你有很多房屋且内存非常有限，每个房屋结构体中的填充将累积成大量的浪费空间。\n\
  \n另一个例子是嵌入式编程。我有一个老旧的、iPod 之前的音乐设备叫 Rio，它没有附带将音乐加载到设备的 Linux 工具，所以我自己写了一些工具。每个数据块都有一个类似这样的标头：\n\
  \n```c\nstruct dataBlockHeader {\n    uint32_t nextBlock;      // 这首歌中下一个块的编号\n\
  \    uint16_t timeStamp;      // 歌曲该部分的时间（秒）\n    uint32_t previousBlock;  // 这首歌中上一个块的编号\n\
  };\n```\n\n\n\n\n```assembly\n;  packedFeet = thePackedHouse.squareFeet;\n    ldr\
  \     r3, .L3+8     ; Get address of thethePackedHouse.\n    ldrh    r2, [r3, #2]\
  \  ; Get uint16_t at offset 2 (0x3344).\n                          ; (字节序将低位字节在前。)\n\
  \n    ldrh    r3, [r3, #4]  ; Get uint16_t at offset 4 (0x1122).\n             \
  \             ; (高位字节在低位之后。)\n\n    lsls    r3, r3, #16   ; r3 的低 16 位中包含 \n   \
  \                       ; squareFeet 的上半 1/2。\n                          ; 将其左移到高部分。\n\
  \n    orrs    r3, r2        ; 合并两个部分。\n\n.L3: theUnpackedHouse\n     thePackedHouse\n\
  ```\n\n非对齐获取（unaligned fetch）需要四条指令，而对齐获取（aligned fetch）仅需要一条。程序必须使用两个加载指令来获取该数字的两个部分：一次移位将上半部分移动到寄存器的顶部，以及一次逻辑或\
  \ 操作将两个数字合并。\n\n每次加载或存储非对齐的 `uint32_t` 时，都必须使用这样的代码。你可以看到为什么编译器可能想避免这样做并添加填充字节（padding）。\n\
  \n### 结构体初始化\n\n我们可以通过将初始化列表放在大括号 (`{}`) 中来初始化结构体。例如，以下语句用一条语句声明并初始化了 `myHouse`：\n\
  \n```c\nstruct house {\n    uint8_t stories;        // 房子的层数\n    uint8_t bedrooms;\
  \       // 卧室数量\n    uint32_t squareFeet;    // 房屋面积\n};\n\n// 2 层\n// 5 间卧室\n//\
  \ 2500 平英尺\nstruct house myHouse = {2, 5, 2500};\n```\n\n在语言的早期版本中，这是初始化结构的唯一方法。后来，随着\
  \ C99（1999 年确定的 C 规范）的出现，增加了一种名为`指定初始化器`（designated initializers）的新功能，允许你通过名称来初始化字段。这里是一个例子：\n\
  \n```c\nstruct house myHouse = {\n  stories: 2,\n  bedrooms: 5,\n  squareFeet: 2500\n\
  };\n```\n\n字段顺序必须与它们在结构体中声明的顺序相同。GCC 编译器有一个扩展，允许你使用不同的方法使用指定初始化器：\n\n```c\nstruct\
  \ house myHouse = {\n    .stories: 2,\n    .squareFeet: 2500,\n    .bedrooms: 5\n\
  };\n```\n\n在这种情况下，顺序不需要与字段声明的顺序匹配。\n\n### 结构体赋值\n\nC 不允许将一个数组赋值给另一个数组，但允许将一个结构体赋值给另一个。这里有一个例子：\n\
  \n```c\nint array1[5];           // 一个数组\nint array2[5];           // 另一个数组\n\n\
  array1 = array2;         // 非法操作\n\nstruct example {\n    int array[5];        //\
  \ 结构体内的数组\n};\nstruct example struct1;  // 一个结构体\nstruct example struct2;  // 另一个结构体\n\
  \n// 初始化结构体 2\n\nstruct1 = struct2;       // 允许结构体赋值\n```\n\n如果这些是数组，赋值将是非法的，但由于它们是结构体，所以可以运行。\n\
  \n### 结构体指针\n\nC 的参数传递机制使用`值传递`（call by value），这意味着如果我们向过程传递一个参数，它会将参数的值拷贝到栈上。当我们拥有像像\
  \ 2 字节整数这样较小的对象时，这种做法没有问题，但大多数结构体并不很小，实际上可能非常大。当结构体作为参数传递时，`整个结构体都会被复制到栈上`，这是一次开销很大的。这里有一个例子：\n\
  \n```c\n// 一个矩形\nstruct rectangle {\n    unsigned int width;  // 矩形的宽度\n    unsigned\
  \ int height; // 矩形的高度\n};\n\n// 低效的参数传递\nunsigned int area(const struct rectangle\
  \ aRectangle)\n{\n    return (aRectangle.width * aRectangle.height);\n}\n```\n\n\
  这里发生的是，为了执行“值传递”参数传递，编译器必须生成代码将 `aRectangle` 完整地复制到栈上。对于较大的结构体，这会消耗大量的栈空间并花费大量时间来复制数据。\n\
  \n将结构体作为指针传递更高效：\n\n```c\n// 高效的参数传递\nunsigned int area(const struct rectangle*\
  \ const aRectangle)\n{\n    return ((*aRectangle).rectangle * (*aRectangle).height);\n\
  }\n```\n\n在这种情况下，只有指针（一个小项）被作为参数传递。在 ARM 编译器的的情况下，这是通过将其放入寄存器来实现的：快速、简单，且不占用栈空间。\n\
  \n值传递的优点之一是对任何参数的任何更改都不会传回给调用者。但我们没有进行任何更改，所以这不是问题。\n\n当我们作为指针传递参数时，我们使用 `const`\
  \ 来指示不允许对参数进行更改。\n\n使用 `(*rectangle).height` 语法访问结构体指针的成员有点很别扭。正因为如此，C 增加了一些语法糖，允许我们使用快捷方式——`->`\
  \ 运算符：\n\n```c\n// 高效的参数传递\nunsigned int area(const struct rectangle* const aRectangle)\n\
  {\n    return (aRectangle->rectangle * aRectangle->height);\n}\n```\n\n### 结构体命名\n\
  \n和 C 中的许多事物一样，结构体的命名并不简单。这里是结构体的通用语法：\n\n```c\nstruct [name] {\n    field1;\n \
  \   field2;\n};\n```\n\n让我们考虑一下没有名称的情况：\n\n```c\n// 匿名结构\nstruct {\n    field1;\n\
  \    field2;\n} aBox;\n```\n\n这定义了 `aBox` 变量，但它是什么类型呢？它是一个没有的结构体，即*匿名结构体*（anonymous\
  \ structure）。匿名结构体可以在结构定义时使用。现在让我们考虑省略变量名的情况：\n\n```c\nstruct box {\n    uint32_t\
  \ width;     // 盒子的宽度\n    uint32_t height;    // 盒子的高度\n};\n```\n\n这定义了一个结构体类型但没有变量。稍后可以使用它定义变量：\n\
  \n```c\nstruct box aBox;\n```\n\n我们可以在同一个声明中放入结构体名称和变量名：\n\n```c\nstruct box {\n\
  \    uint32_t width;     // 盒子的宽度\n    uint32_t height;    // 盒子的高度\n} aBox;\n```\n\
  \n这同时定义了 `box` 结构体和变量 `aBox`。\n\nC 还有一个最后一个花招——我们可以有一个没有结构体名称也没有变量名的结构定义：\n\n```c\n\
  // 愚的定义\nstruct {\n    uint32_t width;     // 盒子的宽度\n    uint32_t height;    //\
  \ 盒子的高度\n};\n```\n\n因为没有结构体名称，我们只能访问这里定义的变量。但这里没有定义变量，所以我们无法访问任何内容，这意味着尽管它是完全合法的，但完全没用。\n\
  \n### 联合体（Unions）\n\n`union` 类似于 `struct`，区别在于每个字段不是分配不同的位置，而是所有的字段都存储在同一个位置。这里有一个例子：\n\
  \n```c\nunion value {\n    uint32_t anInteger;\n    float aFloat;\n};\n```\n\n编译器为\
  \ `uint32_t` 分配 4 个字节，并为 `float` 分配*相同的 4 个字节*。让我们来看看运行效果：\n\n```c\nunion value\
  \ theValue;   // 定义 value。\n\ntheValue.anInteger = 5; // anInteger 是 5。\ntheValue.aFloat\
  \ = 1.0;  // 赋值字段 aFloat/抹除 anInteger。\n```\n\n\n\n\n第二次赋值实际上将 `anInteger` 修改为了\
  \ 1065353216 (0x3f800000)。这是一个非常奇怪的整数，但作为浮点数，它是 1.0。\n\n良好的编程习惯是在从联合体（union）中存储和检索值时使用相同的字段名。例如：\n\
  \n```c\ntheValue.aFloat = 1.2;\nfloat someFloat = theValue.aFloat;   // 将 1.2 赋值给\
  \ someFloat\n```当你使用不同的字段时，结果在不同的机器上将会是不同的。\n\n```c\ntheValue.aFloat = 1.2;\nint\
  \ someInt = theValue.anInteger;   // 结果取决于机器\n```\n\n在这种情况下，`someInt` 的值将取决于整数的大小、浮点数的大小、浮点格式以及字节序，而这些都是依赖于处理器的。现在我们来谈谈字节序问题。假设你手里有四张卡片，编号分别为\
  \ 1、2、3 和 4。你想把它们放在你面前的一排四个盒子盒子里。于是，你拿起最上面的那张卡片放在最左侧的盒子里，把下一张卡片放在它右侧的盒子里以此此类推。你的盒子现在装有以下内容：\n\
  \n| 1 | 2 | 3 | 4 |\n\n当你拿起卡片时，你从右侧开始，将每张卡片放在堆栈的顶部。结果是你按顺序在手里拿回了 1、2、3 和 4 号卡片。\n\
  \n现在另一个人走过来，从右侧开始向左侧将卡片放入盒子里。他们的盒子看起来是：\n\n| 4 | 3 | 2 | 1 |\n\n他们从左侧开始向右侧拾取卡片。同样，这个人最终也会在手里拿到\
  \ 1、2、3 和 4 号卡片，且顺序完全相同。\n\n我刚才描述的就是两种不同的 CPU 架构在内存中存储数字的方式。在某些情况下，它是 1、2、3 和 4，而在另一些情况下\
  \ 4、3、2 和 1。只要你存储和检索的是相同大小的数据，字节序就没有区别。\n\n现在假设你想在盒子里存储四张卡片，但只检索其中两张，这意味着你的盒子看起来是这样的：\n\
  \n| 1 | 2 | 3 | 4 |\n\n当你拿起卡片时，你只拿到了 1 和 2。\n\n然而，另一个人的存储情况看起来是：\n\n| 4 | 3 | 2\
  \ | 1 |\n\n检索卡片时总是使用最左侧的 *n* 个盒子，所以这个人将从左侧开始抓取 3 和 4，这意味着他们将得到不同的结果。\n\n这种差异是由你们两个在存储和检索卡片时使用了不同的顺序造成的。同样的事情在计算机中也会发生。不同的计算机以不同的顺序存储内容。结果，如果你尝试存储一种类型的数据并检索另一种类型，你将在不同的机器上得到不同的答案。\n\
  \n因此，如果你将某些内容放入 `theValue.anInteger` 中，保证获得一致结果唯一方法是仅使用 `theValue.anInteger` 字段将其取出。\n\
  \n## 创建自定义类型\n\n现在我们将取我们所有三个新数据类型——`struct`、`union` 和 `enum`——并将它们组合成一个大的数据类型，以便在屏幕上绘制一个形状。该形状可以是方形、矩形、圆形或三角形。这些形状中的每一个都可以用不同的方式描述。\n\
  \n我们描述正方形只需要一条边：\n\n```c\nstruct square {\n    unsigned int side; // 正方形的大小\n};\n\
  ```\n\n要描述矩形，我们需要宽度和高度：\n\n```c\nstruct rectangle {\n    unsigned int width;   //\
  \ 矩形的宽度\n    unsigned int height;  // 矩形的高度\n};\n```\n\n我们可以仅通过半径画出一个圆形：\n\n```c\n\
  struct circle {\n    unsigned int radius;  // 圆形的半径\n};\n```\n\n最后，为了画三角形，我们描述底边和高度：\n\
  \n```c\nstruct triangle {\n    unsigned int base;    // 三角形的底边\n    unsigned int\
  \ height;  // 它有多高？\n};\n```\n\n通用的形状类型应该包含其中任何一个，这意味着我们需要一个 `union`。但为了绘制形状，我们不仅需要它的描述，还需要知道它是什么类型的形状。`enum`\
  \ 数据类型用于有限的简单值列表：\n\n```c\nenum shapeType {\n    SHAPE_SQUARE, SHAPE_RECTANGLE,\
  \ SHAPE_CIRCLE, SHAPE_TRIANGLE\n};\n```\n\n现在我们来定义数据结构：\n\n```c\nstruct shape {\n\
  \    enum shapeType type;   // 形状的类型\n    union {\n       struct square theSquare;\n\
  \       struct rectangle theRectangle;\n       struct circle theCircle;\n      \
  \ struct triangle theTriangle;\n    } dimensions;\n};\n```\n\n第一个字段是 `type`，它包含结构体中的形状类型。第二个字段包含形状的\
  \ `dimensions`。它是一个 `union`，因为不同的形状有不同的维度。\n\n绘制形状的代码看起来如下：\n\n```c\nvoid drawShape(const\
  \ shape* const theShape) {\n    switch (theShape->type) {\n        case SHAPE_SQUARE:\n\
  \            drawSquare(theShape->dimensions.theSquare);\n            break;\n \
  \       case RECTANGLE:\n            drawRectangle(theShape->dimensions.theRectangle);\n\
  \            break;\n        // ...\n    }\n}\n```\n\n## 结构体与嵌入式编程\n\n在本节中，我们将硬件规范转换为结构体。SCSI\
  \ 设计用于提供一种传输数据的方式。然而，由于对齐问题，我们需要小心。\n\n起初，这看起来是简单的翻译：\n\n```c\nstruct read10 {\n\
  \    uint8_t opCode;    // 读取操作码\n    uint8_t flags;     // 标志位\n    uint32_t lba;\
  \      // 逻辑地址\n    uint8_t group;     // 组\n    uint16_t transferLength;  // 读取数据的长度\n\
  \    uint8_t control;   // 控制位\n};\n```\n\n图 8-2 显示了 `read10` 命令。如果我们想从磁盘读取数据，我们需要一个\
  \ C 结构体。\n\n现在，由于我们谨慎且小心，我们在程序中的第一件事是放入一个 `assert` 语句以确保我们的定义与硬件匹配。如果条件不成立，程序将终止。如果我们预计\
  \ `read10` 控制块包含 10 个字节，而实际上不是，那么我们的程序就有大问题。我们也是如此。\n\n发生了什么？检查结构体，我们发现 `lba` 字段（`uint32`）对齐在\
  \ 2 字节边界上。编译器希望将其对齐在 4 字节边界，因此添加了填充字节。我们需要对结构体进行紧凑处理：\n\n```c\nstruct read10 {\n\
  \    uint8_t opCode;    // 读取操作码\n    uint8_t flags;     // 标志位\n    uint32_t lba;\
  \      // 逻辑地址\n    uint8_t group;     // 组\n    uint16_t transferLength;  // 读取数据的长度\n\
  \    uint8_t control;   // 控制位\n} __attribute__((packed));\n```\n\n\n\n`packed`\
  \ 属性告诉 `GCC` 不要添加任何填充（padding）。因此，我们的结构体效率较低，但它与硬件保持一致。此外，我们的 `assert` 并没有报错，说明我们的做法是正确的。\n\
  \n## typedef\n\n我们可以使用 `typedef` 语句定义自己的类型。例如，以下语句定义了一个新的 `dimension` 类型：\n\n```c\n\
  typedef unsigned int dimension;  // 用于计划的维度\n```\n\n该类型等同于 `unsigned int`，并且可以像其他任何类型一样使用：\n\
  \n```c\ndimension width;   // 以英里（furlongs）为单位的物体宽度\n```\n\n`typedef` 的语法与变量声明相似。它包含\
  \ `typedef` 关键字、初始类型的名称以及所定义的类型名称：\n\n```c\ntypedef initialtype newtypename;  //\
  \ 类型定义\n```\n\n`typedef` 的一个示例可以在 `stdint.h` 文件找到，该文件包含在我们的许多程序中：\n\n```c\n// 这些\
  \ typedef 取决于系统。\ntypedef signed char        int8_t;\ntypedef unsigned char    \
  \  uint8_t;\ntypedef signed short int   int16_t;\ntypedef unsigned short int uint16_t;\n\
  typedef signed int         int32_t;\ntypedef unsigned int       uint32_t;\n```\n\
  \n在 C 语言的早期，`int` 可以是 16 位或 32 位，取决于处理器。在编程的早期，如果用户想使用 16 位整数（旧的 C 标准不支持该类型），他们必须在代码中放入类似这样的内容：\n\
  \n```c\n#ifdef ON_16_BIT_CPU\ntypedef signed int   int16_t;\n#else // ON_32_BIT_CPU\n\
  typedef signed short int   int16_t;\n#endif\n```\n\n在多年不得不定义自己的精确数据类型之后，C 标准委员会创建了\
  \ `stdint.h` 头文件，并使其成为语言的一部分。\n\n### 函数指针和 typedef\n\nC 语言允许指向函数的指针，这在执行回调函数（callbacks）时非常有用。例如，我们可能告诉图形系统在按钮被按下时调用给定的函数。代码可能如下所示：\n\
  \n```c\nregisterButtonPressHandler(functionToHandleButtonPress);\n```\n\n`functionToHandleButtonPress`\
  \ 参数是一个指向函数的指针，该函数返回一个整数并接受一个常量事件指针作为其唯一参数。这句话非常晦乱，当我们将其翻译成 C 语言时，它并没有变得更容易：\n\n\
  ```c\nint (*ButtonCallback)(const struct event* const theEvent);\n```\n\n第一组括号是必须的，因为如果没有它们，我们定义的是一个返回整数指针的函数：\n\
  \n```c\n// 定义返回 int* 的函数\nint* getPointer(...)\n```\n\n与其记住这些复杂的语法规则，不如使用 `typedef`\
  \ 来简化语法：\n\n```c\n// 回调函数的函数类型\ntypedef int ButtonCallbackType(const struct event*\
  \ const theEvent);\n\n// 指向回调函数的指针\ntypedef ButtonCallbackType* ButtonCallbackPointer;\n\
  ```\n\n这使得 `registerButtonPressHandler` 的定义从：\n\n```c\nvoid registerButtonPressHandler(int\
  \ (*callbackPointer)\n     (const struct event* const theEvent));\n```\n\n变为：\n\n\
  ```c\nvoid registerButtonPressHandler(ButtonCallbackPointer callbackPointer);\n\
  ```\n\n`typedef` 提供了一种组织类型的方法，可以简化我们的代码，并使事情变得更加清晰。\n\n### typedef 和 struct\n\n\
  我们已经看到了如何使用 `struct` 来定义结构化数据类型。\n\n```c\nstruct rectangle {\n    uint32_t width;\
  \  // 矩形的宽度\n    uint32_t height; // 矩形的高度\n};\n```\n\n要使用这个结构体，必须使用 `struct` 关键字：\n\
  \n```c\nstruct rectangle bigRectangle;   // 大矩形\n```\n\n`typedef` 语句允许我们避免使用 `struct`\
  \ 关键字：\n\n```c\ntypedef struct{\n    uint32_t width;       // 矩形的宽度\n    uint32_t\
  \ height;      // 矩形的高度\n} rectangle;\n\nrectangle bigRectangle;   // 大矩形\n```\n\
  \n在这种情况下，`typedef` 告诉 C 我们想要定义一个新的 `rectangle` 类型。\n\n有些人认为，使用 `typedef` 定义新的结构体类型会让代码更简单整洁。另一些人倾向于使用\
  \ `struct`，因为这一眼就能看出变量是一个 `struct`。语法是可选的，所以使用最适合你的方法即可。\n\n## 总结\n\n这一章完全关于数据组织。`enum`\
  \ 类型允许你组织简单的名称列表，而无需担心哪个字段获得什么值。结构体（Structures）为组织不同类型的数据提供了强大的工具。对于嵌入式程序员来说，它们在与实际硬件设备通信时也有用。然而，请记住，硬件设计师对结构体布局的想法可能与\
  \ C 语言认为应该是样的不同。\n\n虽然结构体只能包含一组固定的数据，但联合（unions）可以包含多组数据（只是不能同时包含）。两者之间，我们对如何存储数据有很大的控制。\n\
  \n另一种组织数据的工具是 `typedef` 指令，它允许我们定义自己的类型。它让我们能够使用熟悉的类型表示数据，而不是被迫使用基础的 C 类型。\n\n存在许多复杂的数据类型，C\
  \ 提供了一套很好的工具来管理它们。\n\n## 编程题\n\n1. 创建一个结构体来存储分数。然后创建加、减、乘、除分数的函数。分数应该以归一形式存储。\n\
  2. 创建一个名为 `car` 的结构体来存储共同属性。在它上添加一个包含两个字段 `electric` 和 `gas` 的联合，这两个字段是对应特定类型的结构体。例如\
  \ `numberOfPassengers` 是所有汽车共有的。\n3. 写一个描述学生（student）的结构体。数据不仅应包含姓名和 ID 号，还应包含一个成绩数组。\n\
  4. 南加州铁路在一个交叉路口有一个 `Traffic Signal`（带臂和灯的）。为了让信号从 STOP 变为 GO，控制器必须执行：\n    1. 关闭\
  \ STOP 灯。\n    2. 开启 GO 灯。\n    3. 开启方向继电器。\n    4. 激励臂。\n    5. 等待 3 秒。\n    6.\
  \ 关闭臂。\n    7. 关闭方向继电器。我们有可用命令：(1) 将 `x` 的状态改为 `y`，其中 `x` 是 STOP 或 GO，y` 是 ON 或\
  \ OFF；(2) 设置方向继电器电源为 `x``x` 是 ON 或 OFF；(3) 睡眠 `n` 秒。为每个命令写一个结构体。然后写一个联合，包含一个 `enum`\
  \ 来标识命令以及对应命令的结构体。\n\n\n\n当 C 程序调用标准的 `puts` 函数时，它会启动一个漫长的编程过程，涉及内核调用、内部缓冲、中断调度和设备驱动程序（这些内容将在下一章详细介绍）。最终，它会到达向设备一次发送一个字符的阶段。为了模拟这一过程，我们将一次向操作系统发送一个字符。换句话说，我们将限制为仅使用标准的\
  \ `putchar` 函数来写入输出。\n\nListing 9-1 包含一个以“硬核”方式写入 `\"Hello World\\n\"` 的程序。再次，我们采用这种硬核的方法，是因为之后在使用\
  \ Nucleo 开发板时，我们不得不用*非常*硬核的方法来实现。\n\n### `putchar.c`\n\n```\n/*\n * 逐个字符地打印字符串。\n\
  \ */\n#include <stdio.h>\n\nchar hello[] = \"Hello World\\n\"; // 要打印的字符\nint curChar;\
  \    // 我们正在打印的字符计数\n\nint main()\n{\n  1 for (curChar = 0; hello[curChar] != '\\\
  0'; ++curChar)\n        putchar(hello[curChar]);\n    return (0);\n}\n```\n\n*Listing\
  \ 9-1：逐个字符地写入字符串*\n\n该程序中唯一有趣的部分是 `for` 循环 1，它在达到一定数量的字符后停止。相反，它在程序到达字符串结束（`'\\\
  0'`）时停止。这样，程序就可以输出任何长度的字符串。\n\n### 定义自己的 `putchar`\n\n为了改进此程序，首先我们将 `curChar` 改为局部变量。然后我们将定义一个名为\
  \ `myPutchar` 的函数，它将字符发送到标准输出（参见 Listing 9-2）。\n\n### `my_putchar.c`\n\n```\n/**\n\
  \ * 使用我们自己的函数\n * 逐个字符地打印字符串。\n */\n#include <stdio.h>\n\nchar hello[] = \"Hello\
  \ World\\n\"; // 要打印的字符\n\n1 /**\n * putchar 的重新实现\n *\n * @param ch 要发送的字符\n *\n\
  \ * @note 并没有看起来那么没用\n */\n2 void myPutchar(const char ch)\n{\n  3 putchar(ch);\n\
  }\n\nint main()\n{\n    int curChar;        // 我们正在打印的\n                       \
  \ // 当前字符的索引\n    for (curChar = 0; hello[curChar] != '\\0'; ++curChar)\n      4\
  \ myPutchar(hello[curChar]);\n    return (0);\n}\n```\n\n*Listing 9-2：使用自己的输出函数逐个字符输出*\n\
  \n在 `myPutchar` 的开头，我们在注释块中添加了一些额外的元素 1。`@param` 关键字表示参数，`@note` 关键字定义了一条注释。你可以在\
  \ Doxygen 风格的注释中使用许多其他关键字，但目前我们将使用基础知识，以与现有的 STM 代码兼容。\n\n实际函数从 `void myPutchar(const\
  \ char ch)` 声明 2 开始，这表示 `myPutchar` 过程没有返回值，并接受一个 `char` 类型的参数。`const` 修饰符表示我们不会在过程内部修改它。（事实上，我们无法修改它，因为如果我们尝试修改，编译器将生成错误。）\n\
  \n当执行该过程 4 时，程序会执行以下步骤：\n\n1. 它计算 `hello[curChar]` 的值。\n2. 它将此值存放在 `myPutchar` 可以找到它的位置。\n\
  3. 它记录下一条指令的地址（`for` 循环的结束）。\n4. 它开始执行 `myPutchar`。（`ch` 变量已经在步骤 2 中初始化。）\n\n当我们调用\
  \ `putchar` 3 时，也会执行类似的步骤。唯一的区别是我们必须编写 `myPutchar`，而编写标准 C 库的人提供了 `putchar`。\n\n\
  创建一个只调用另一个函数（`putchar`）的函数并没有用。Nucleo 开发板没有 `putchar` 函数，我们将在章后面编写自己的。在此之前，让我们来看串口设备的细节。\n\
  \n### 串口输出\n\n串口输出是从嵌入系统获取数据最简单的方法之一。电气接口由发送线 (TX)、接收线 (RX) 和地 (GND)组成。大多数嵌入系统将它们隐藏起来，只有那些愿意拆开外壳并连接到串口的开发者才能使用。\n\
  \n我们的芯片有一个我们可以写入的串口设备。我们只需要在我们的微控制器（开发板的下半部分）与开发板上半部分的 USB/串口设备之间连接 TX、RX 和 GND\
  \ 即可。\n\n下表显示了我们需要的连接：\n\n| 微控制器 | USB/串口及其他支持设备 |\n| --- | --- |\n| RX | CN9-1\
  \ | TX | CN3-1 |\n| TX | CN9-2 | RX | CN3-2 |\n| GND | CN6-5 | GND | CN4-3 |\n\n\
  如果我们有一个树莓派或其他没有内置串口控制器的嵌入系统，我们就必须进行这些连接。图 9-1 显示了这些组件的布局以及 STM 提供的内部布线。\n\n![f0901](img/f0901.png)\n\
  图 9-1：Nucleo 板上的串口通信\n\n### 串口通信简史\n\n串口通信的历史可以追溯到很以前，一直到电报时代。电报是当时的互联网。这项发明彻底改变了通信。\n\
  \n\n\n\n现在的计算机仍然使用电字机使用的串行通信。速度已经有所提高，但基础协议保持不变。\n\n## 行结束符\n\n事实上，我们仍在处理另一个来自电字机的遗留问题：行结束符。在输入\
  \ 80 个字符后，你可以向机器发送一个名为 `carriage return`（回车）的字符，让它回到位置 1。问题是，打印头移动需要 0.2 秒。如果你在\
  \ `carriage return` 之后立即发送字符，打印头会在移动时尝试打印，从而在行中间打印出一个模糊的墨点。\n\n电字机时代的人通过将行尾设置为两个字符来解决这个问题。第一个是\
  \ `carriage return`，将打印头移动到位置 1；第二个是 `line feed`（换行），将纸张向上移动一行。由于 `line feed` 不会在纸张上打印任何内容，因此在打印头向左移动的过程中执行这一操作并没有影响。\n\
  \n然而，当计算机出现时，存储成本非常昂贵（每字节数百美元），因此为行尾存储两个字符的成本极高。创建 Unix（Linux 的灵感来源）的人决定只使用 `line\
  \ feed`（`\\n`）字符。苹果公司决定只使用 `carriage return`（`\\r`），而微软决定同时使用 `carriage return`\
  \ 和 `line feed`（`\\r\\n`）作为其行结束符。\n\n`C` 系统库会自动处理不同类型的换行符，但只有在你使用系统库时有效。如果你是自己实现（正如我们即将要做的那样），必须编写完整的行结束序列（`\\\
  r\\n`）。\n\n## 今天的串行通信\n\n今天，几乎每个嵌入式处理器都有一个串口接口。串行设备制造简单且廉价。今天的接口与 19 世纪接口的唯一区别在于速度快了（从\
  \ 110 比/秒增加到 115,200 比/秒），且电压发生了变化。在 19 世纪，他们使用 -15 到 -3 作为位 0，使用 +3 到 +15 作为位 1。这仍然是“标准”，但大多数计算机使用电压\
  \ 0（代表 0）和 3（代表 1）。\n\n处理处理串行 I/O 的设备被称为 `universal asynchronous receiver-transmitter\
  \ (UART)`（通用异步收发传输器）。串行通信有两种主要类型：`asynchronous`（异步）和 `synchronous`（同步）。在同步通信中，发送端和接收端的时钟必须通过发送端不断发送字符来同步。接收器查看输入的字符并据此推断时钟定时。发送端必须始终发送字符，即使只是空闲字符（表示没有数据）。在异步通信中，没有共享时钟。起始位触发接收器启动时钟并寻找字符。异步通信假设发送端和接收端的时钟可以足够接近到一个字符的时间。由于不需要连续传输来保持时钟同步，因此没有空闲字符。空闲时，传输器不发送任何内容。\n\
  \n`STM` 芯片有一个允许同步和异步通信的端口，因此在 `STM` 文档中，你会看到它被称为 `universal synchronous/asynchronous\
  \ receiver-transmitter (USART)`（通用同步异步收发传输器）。本程序使用 `UART` 一词以兼容 `STM HAL` 库。\n\n\
  ## 串口 Hello World!\n\n为 `main.c` 创建一个新项目，这是一个很长的“Hello World”，但它必须完成操作系统向我们隐藏的所有操作。首先，我们包含了定义\
  \ `UART` 信息（以及许多其他设备）的头文件：\n\n```\n#include \"stm32f0xx.h\"\n#include \"stm32f0xx_nucleo.h\"\
  \n```\n\n对于代码，我们将从 `main` 函数开始：\n\n```\nint main(void)\n{\n  1 HAL_Init(); // 初始化硬件。\n\
  \    led2_Init();\n    uart2_Init();\n\n    // 长时间发送消息。\n  2 for (;;) {\n      \
  \  // 逐字符发送字符。\n        for(current = 0; hello[current] != '\\0'; ++current) {\n\
  \          3 myPutchar(hello[current]);\n        }\n      4 HAL_Delay(500);\n  \
  \  }\n}\n```\n\n`main` 函数看起来与列表 9-1 和 9-2 中的几乎一样。唯一的一点是，它必须初始化我们将使用的所有设备 1，包括硬件库（`HAL_Init`）、红色\
  \ LED（`led2_Init`）和 `UART`（`uart2_Init`）。我们的嵌入式程序不能停止，所以有一个无限循环 2，它发送字符串 3，然后睡眠半秒\
  \ 4。\n\n接下来要做的第一件事之一创建一个 `ErrorHandler` 函数，如果发生错误，`HAL` 库会调用它。我们无法打印错误信息，因为我们的打印代码刚刚出问题了，所以我们求诸于闪烁红灯。诚然，这是一个非常有限的错误指示，但你汽车上的发动机故障灯也是如此。在这两种情况下，设计师都在尽力所能。我们在这里不会详细介绍\
  \ `Error_Handler` 函数；它只是第 3 章中“闪烁”换了一个新名字。\n\n## UART 初始化\n\n串行设备的编程应该是非常简单的。然而，`STMicroelectronics`\
  \ 的工程师决定通过提供额外功能来改进简单的 `UART`。结果，我们的简单串行设备...\n\n```\nvoid uart2_Init(void)\n{\n\
  \    // UART 初始化\n    1 uartHandle.Instance = USART2;\n  2 uartHandle.Init.BaudRate\
  \ = 9600;                   // 速度 9600\n  3 uartHandle.Init.WordLength = UART_WORDLENGTH_8B;\
  \   // 8 位\n  4 uartHandle.Init.StopBits = UART_STOPBITS_1;        // 1 停止位\n  5\
  \ uartHandle.Init.Parity = UART_PARITY_NONE;         // 无校验位\n  6 uartHandle.Init.Mode\
  \ = UART_MODE_TX_RX;            // 发送与接收\n  7 uartHandle.Init.HwFlowCtl = UART_HWCONTROL_NONE;\
  \   // 无控制\n\n    // 对输入流采样。\n    uartHandle.Init.OverSampling = UART_OVERSPLING_16;\n\
  \n    // 不使用单比特采样。\n  8 uartHandle.Init.OneBitSampling = UART_ONE_BIT_SAMPLE_DISABLE;\n\
  \n    // 无高级功能\n  9 uartHandle.AdvancedInit.AdvFeatureInit = UART_ADVFEATURE_NO_INIT;\n\
  \    /*\n     * 对于那些连接终端仿真器的人，上述参数\n     * 翻译为 9600,8,N,1。\n     */\n\n    if (HAL_UART_Init(&uartHandle)\
  \ != HAL_OK)\n    {\n        Error_Handler();\n    }\n}\n```\n\n\n\n\n原始串口接口（RS-232\
  \ 标准）具有许多硬件流控线。在我们的开发板上，这些线没有接线，我们也没有使用它们 7。\n\n该 `UART` 的高级功能之一是 `oversampling`（过采样），它允许接收器在决定一个位是\
  \ 1 还是 0 之前，多次检查入入位的状态。当你处于电磁干扰较大的环境中并且长距离运行串口电缆时，此功能有时非常有用。我们的串口“电缆”由两条从板子底部运行到顶部的走线组成，距离约为\
  \ 3 英寸。我们不需要过采样，但我们必须将其关闭 8。最后，我们没有使用任何高级功能。\n\n接下来，我们调用 `HAL_UART_Init` 来初始化 `UART`\
  \ 9，它需要一些帮助来完成工作。我们处理器上的通用输入/输出 (`GPIO`) 引脚可以执行许多不同的功能，包括作为 `GPIO` 引脚。大多数引脚都具有“复用功能”（alternate\
  \ functions），这意味着你可以编写它们作为不同的设备（`GPIO` 引脚、`USART` 设备、`SPI` 总线、`I2C` 总线、`PWM` 引脚等）。注意，并非所有引脚都支持所有设备。最后，`HAL_UART_Init`\
  \ 调用 `HAL_UART_MspInit`，它为 `UART` 设置引脚：\n\n```\nHAL_StatusTypeDef HAL_UART_Init(UART_HandleTypeDef\
  \ *huart)\n{\n  /* 检查 UART 柄分配。 */\n  if(huart == NULL)\n  {\n    return HAL_ERROR;\n\
  \  }\n  // ...\n  if(huart->gState == HAL_UART_STATE_RESET)\n  {\n    /* 分配锁资源并初始化它。\
  \ */\n    huart->Lock = HAL_UNLOCKED;\n\n    /* 初始化底层硬件：GPIO, CLOCK。 */\n    HAL_UART_MspInit(huart);\n\
  \  }\n```\n\n我们需要提供 `HAL_UART_MspInit`。请记住，引脚是昂贵的，而驱动它们的晶体管是很便宜的。默认情况下，驱动我们串口设备的两个引脚（名为\
  \ `PA2` 和 `PA3`）是 `GPIO` 引脚。我们需要告诉系统使用这些引脚的复用功能，并将它们转换为串口设备引脚。\n\n我们的 `HAL_UART_MspInit`\
  \ 函数看起来与我们用于“闪烁”的 `GPIO` 引脚初始化代码非常相似，但有些细微的：\n\n```\nvoid HAL_UART_MspInit(UART_HandleTypeDef*\
  \ uart)\n{\n    GPIO_InitTypeDef GPIO_InitStruct;\n  1 if(uart->Instance == USART2)\n\
  \    {\n        /* 开启外设时钟 */\n      2 __HAL_RCC_USART2_CLK_ENABLE();\n\n       \
  \ /*\n         * USART2 GPIO 配置\n         * PA2     ------> USART2_TX\n        \
  \ * PA3     ------> USART2_RX\n         */\n        GPIO_InitStruct.Pin = GPIO_PIN_2|GPIO_PIN_3;\n\
  \        GPIO_InitStruct.Mode = GPIO_MODE_AF_PP;\n        GPIO_InitStruct.Pull =\
  \ GPIO_NOPULL;\n        GPIO_InitStruct.Speed = GPIO_SPEED_FREQ_LOW;\n        //\
  \ 复用功能 -- UART 的\n      3 GPIO_InitStruct.Alternate = GPIO_AF1_USART2;\n       \
  \ HAL_GPIO_Init(GPIOA, &GPIO_InitStruct);\n    }\n}\n```\n\n该函数首先检查我们正在使用哪个 `USART`。在这段代码中我们只设置了\
  \ `USART2` 1。然后我们启用设备的时钟 2。接下来，我们配置 `GPIO` 引脚 3（我们之前在闪烁程序中做过这个），这告诉芯片 `PA2/PA3`\
  \ 不是 `GPIO` 引脚，而是应该连接到 `USART2`。\n\n### 发送字符\n\n我们将使用 `myPutchar` 函数通过串口设备传输字符。`USART`\
  \ 是一个内存映射 I/O 设备。要发送字符，我们必须将其分配（写入）到魔术内存位置（一个 `register`），然后它就会通过线路传出去：\n\n```\n\
  uartHandle.Instance->TDR = ch;     // 将字符发送到 UART。\n```\n\n我们还需要恰好控制字符发送的时间，这需要一些额外的代码：\n\
  \n```\nvoid myPutchar(const char ch)\n{\n    // 这一行在调用时获取并保存 UART_FLAG_TXE 的值。\n\
  \    // 这个值会变化，所以如果你在下面的 \"if\"\n    // 行上停止程序，该值将设为零，因为它消失的速度\n    // 比你查看的速度快。\n\
  \    int result __attribute__((unused)) =\n        (uartHandle.Instance->ISR & UART_FLAG_TXE);\n\
  \n    // 阻塞直到发送空 (TXE) 标志被设置。\n    while ((uartHandle.Instance->ISR & UART_FLAG_TXE)\
  \ == 0)\n        continue;\n\n    uartHandle.Instance->TDR = ch;     // 将字符发送到 UART。\n\
  }\n```\n\n我们正在写入的寄存器称为 `传输数据寄存器 (TDR)`。如果在字符传输期间写入此寄存器，新字符将覆盖旧字符，导致错误和混淆。要发送 `a`、`b`、`c`，我们需要这样的代码：\n\
  \n```\nuartHandle.Instance->TDR = 'a';\nsleep_1_960_second();\nuartHandle.Instance->TDR\
  \ = 'b';\nsleep_1_960_second();\nuartHandle.Instance->TDR = 'c';\nsleep_1_960_second();\n\
  ```\n\n\n\n\n```cpp\n/**\n * @brief 在串口上打印 hello world。\n */\n#include <stdbool.h>\n\
  #include \"stm32f0xx_nucleo.h\"\n#include \"stm32f0xx.h\"\n\nconst char hello[]\
  \ = \"Hello World!\\r\\n\";   // 要发送的消息\nint current; // 我们正在发送的消息中的字符\n\nUART_HandleTypeDef\
  \ uartHandle;      // UART 初始化句\n\n/**\n  * @brief 当发生错误时执行此函数。\n  *\n  * 它所的作用是闪烁\
  \ LED。\n  */\nvoid Error_Handler(void)\n{\n    /* 开启 LED2。 */\n    HAL_GPIO_WritePin(LED2_GPIO_PORT,\
  \ LED2_PIN, GPIO_PIN_SET);\n\n    while (true)\n    {\n        // 切换 LED2 的状态。\n\
  \        HAL_GPIO_TogglePin(LED2_GPIO_PORT, LED2_PIN);\n        HAL_Delay(1000);\
  \        // 等待一秒。\n    }\n}\n/**\n * 将字符发送到 UART。\n *\n * @param ch 要发送的字符\n */\n\
  void myPutchar(const char ch)\n{\n    // 这一行在调用时获取并保存 UART_FLAG_TXE 的值。\n    //\
  \ 该值会发生变化，因此如果你在下面的 \"if\" 行停止程序，\n    // 该值将被设置为零，因为它的消失的速度比你肉眼看到的速度要快。\n    int\
  \ result __attribute__((unused)) =\n        (uartHandle.Instance->ISR & UART_FLAG_TXE);\n\
  \n    // 阻塞直到发送空 (TXE) 标志位设置。\n    while ((uartHandle.Instance->ISR & UART_FLAG_TXE)\
  \ == 0)\n        continue;\n\n    uartHandle.Instance->TDR = ch;     // 将字符发送到 UART。\n\
  }\n\n/**\n * 初始化 LED2（以便在出错时闪烁红灯）。\n */\nvoid led2_Init(void)\n{\n    // LED 时钟初始化\n\
  \    LED2_GPIO_CLK_ENABLE();\n\n    GPIO_InitTypeDef GPIO_LedInit;      // LED 的初始化\n\
  \    // 初始化 LED。\n    GPIO_LedInit.Pin = LED2_PIN;\n    GPIO_LedInit.Mode = GPIO_MODE_OUTPUT_PP;\n\
  \    GPIO_LedInit.Pull = GPIO_PULLUP;\n    GPIO_LedInit.Speed = GPIO_SPEED_FREQ_HIGH;\n\
  \    HAL_GPIO_Init(LED2_GPIO_PORT, &GPIO_LedInit);\n}\n\n/**\n * 初始化 UART2 用于输出。\n\
  \ */\nvoid uart2_Init(void)\n{\n    // UART 初始化\n    // UART2 -- 一个连接到 ST-LINK USB\n\
  \    uartHandle.Instance = USART2;\n    uartHandle.Init.BaudRate = 9600;       \
  \             // 速率 9600\n    uartHandle.Init.WordLength = UART_WORDLENGTH_8B; \
  \   // 8 位/字符\n    uartHandle.Init.StopBits = UART_STOPBITS_1;         // 1 个停止位\n\
  \    uartHandle.Init.Parity = UART_PARITY_NONE;          // 无奇偶位\n    uartHandle.Init.Mode\
  \ = UART_MODE_TX_RX;             // 发送与接收\n    uartHandle.Init.HwFlowCtl = UART_HWCONTROL_NONE;\
  \    // 无硬件流控\n\n    // 对输入流进行过采样。\n    uartHandle.Init.OverSampling = UART_OVERSAMPLING_16;\n\
  \n    // 不使用单比特采样。\n    uartHandle.Init.OneBitSampling = UART_ONE_BIT_SAMPLE_DISABLE;\n\
  \n    // 无高级配置\n    uartHandle.AdvancedInit.AdvFeatureInit = UART_ADVFEATURE_NO_INIT;\n\
  \    /*\n     * 对于那些连接了终端仿真器的人，上述参数\n     * 对应于 9600,8,N,1。\n     */\n\n    if (HAL_UART_Init(&uartHandle)\
  \ != HAL_OK)\n    {\n        Error_Handler();\n    }\n}\n\nint main(void)\n{\n \
  \   HAL_Init(); // 初始化硬件。\n    led2_Init();\n    uart2_Init();\n\n    // 长时间发送消息。\n\
  \    for (;;) {\n        // 逐个字符发送。\n        for(current = 0, hello[current] !=\
  \ '\\0'; ++current) {\n            myPutchar(hello[current]);\n        }\n     \
  \   HAL_Delay(500);\n    }\n}\n\n/**\n * 由 HAL 层调用的魔法函数，用于实际\n 初始化 UART。在这种情况下，我们需要\n\
  \ * 将 UART 引脚设置为复用模式，以便它们作为 UART 引脚\n * 而不是 GPIO 引脚工作。\n *\n * @note: 适用于 UART2，即连接到\
  \ USB 串口转换器的那个。\n *\n * @param uart UART 信息\n */\nvoid HAL_UART_MspInit(UART_HandleTypeDef*\
  \ uart)\n{\n    GPIO_InitTypeDef GPIO_InitStruct;\n    if(uart->Instance == USART2)\n\
  \    {\n        /* 外设时钟开启 */\n        __HAL_RCC_USART2_CLK_ENABLE();\n\n       \
  \ /*\n         * USART2 GPIO 配置\n         * PA2     ------> USART2_TX\n        \
  \ * PA3     ------> USART2_RX\n         */\n        GPIO_InitStruct.Pin = GPIO_PIN_2|GPIO_PIN_3;\n\
  \        GPIO_InitStruct.Mode = GPIO_MODE_AF;\n        GPIO_InitStruct.Pull = GPIO_NOPULL;\n\
  \        GPIO_InitStruct.Speed = GPIO_SPEED_FREQ_LOW;\n        HAL_GPIO_Init(USART2_GPIO_PORT,\
  \ &GPIO_InitStruct);\n    }\n}\n```\n\n\n\n\n本编程书在第 9 章涵盖了“Hello World”。为什么呢？因为我们必须自己完成一切。编写一个简单的程序来逐个字符地发送我们的消息，涉及到初始化\
  \ `UART`（一个非平凡的过程）、告诉 `GPIO` 引脚它现在是一个串口引脚，以及使用硬件寄存器（那些根据设备状态发生神奇变化的神秘内存位置）来检视 `UART`\
  \ 何时准备好发送一个字符。\n\n我们已经了巨大的飞跃。首先，我们编写了一个中等复杂的设备，并在这个过程中学习了许多关于直接低层 I/O 的知识。其次，串口是隐藏在许多嵌入式设备中主要的诊断和维护设备。尽管过去\
  \ 60 年里计算机技术取得了巨大进步，但最常用的调试技术仍然是通过串口进行 `printf`。串口是一个非常简单健壮的设备，制作成本廉且易于连接，现在我们知道如何使用它来调试我们的嵌入式系统了。\n\
  \n## 编程问题\n\n1. 针对学生：在程序正常运行后，看看如果移除 `\\r` 会发生什么。然后尝试在加回 `\\r` 但移除 `\\n` 的情况下运行。\n\
  \n2. 中等难度的谜题：尝试更改配置，使其发送 7 个数据位并采用偶校验（而不是 8 个数据位，无校验）。不要更改你的终端仿真器的配置。某些字符将会发生变化。检查字符的位模式，找出哪些字符发生了变化以及为什么。\n\
  \n3. 高级：按照目前的写法，我们的程序没有流控。无论你喜不喜欢，都会得到一个“Hello World”。更改初始化代码以使用软流控。这意味着当你输入 `XOFF`\
  \ 字符 (CTRL-S) 时，输出应该停止。当你输入 `XON` (CTRL-Q) 时，它应该恢复。\n\n4. 高级：为 Nucleo 板板一个一个读取字符的函数。它看起来非常像\
  \ `myPutchar` 函数，只不过它会检查不同的位并读取 I/O 端口而不是向其写入。你需要阅读微控制器的文档来查看 `RDR` 位的作用。\n\n# 10\
  \ 中断\n\n![](img/chapterart.png)\n\n处理 I/O 的两种主要方法是`polling`（轮询），即反复询问设备是否有数据准备就绪；以及\
  \ `interrupts`（中断），即设备中断正常工作流并通知你它已准备好。本章描述了轮询和中断之间的区别，并解释了中断如何工作，以便你更高效地使用它们向串口写入字符串（是的，又是“Hello\
  \ World”）。\n\n## 轮询与中断\n\n让我们考虑轮询和中断在电话情况下是如何工作的。在轮询的情况下，铃声被关掉，你必须每 10 秒检查一次电话，看是否有来电。你必须坐在电话旁边，不能容易感到无聊。这种方法是我们在第\
  \ 9 章之前的串口程序中所使用的，它基本上相当于以下对话：\n\n1. “你忙吗？” “忙。”\n2. “你忙吗？” “忙。”\n3. “你忙吗？” “忙。”\n\
  4. “你忙吗？” “不忙。”这是下一个字符。”\n\n计算机卡在轮询循环中，等待 `UART` 状态寄存器指示 `UART` 已准备好接收下一个字符。此时，计算机没有别的事要做，也不会感到无聊。轮询的主要优点是容易理解和实现。\n\
  \n让我们回到电话，但这次我们将使用中断方法。你不需要坐在电话旁边不断检查是否有来电。相反，你忙于自己的日常事务，直到电话响起（发生中断）。然后你放下手头工作，冲向电话并拿起它——结果发现是另一个推销电话，推销某种你百万年内都不会买的东西。\n\
  \n中断场景下的关键事件序列如下：\n\n1. 我们进行正常工作。\n2. 我们收到一个中断（电话响了）。\n3. 我们拿起电话（处理中断），大喊：“不，我不想买组合式剃须刷和水笔，”然后挂断。\n\
  4. 我们从离开的地方继续我们的正常工作。\n\n## 用于串口 I/O 的中断\n\n只有当发送数据寄存器 (`TDR`) 为空时，我们才能向 `UART`\
  \ 发送字符。图 10-1 显示了 `UART` 部分框图，以说明 `TDR` 如何工作。\n\n![f10001](img/f10001.png)\n\n图\
  \ 10-1：UART 传输硬件\n\n当我们想要发送一个字符时，将其放入 `TDR`，它持有 8 位。然后该字符被丢入发送移位寄存器 (`TSR`)，它持有\
  \ 10 位。额外的 2 位是字符开头的起始位和字符结尾的停止位。`TSR` 然后逐位通过发送串口线 `(TX)` 发送数据。\n\n当数据从 `TDR` 移动到\
  \ `TSR` 时，`TDR` 变为空并准备好接收另一个字符。\n\n我们一直在使用的轮询循环如下：\n\n```\n// Block until the transmit\
  \ empty (TXE) flag is set.\nwhile ((uartHandle.Instance->ISR & UART_FLAG_TXE) ==\
  \ 0)\n    continue;\n```\n\n\n\n\n中断的默认响应是无限循环，这使得机器几乎完全无法使用（我之所以说“几乎完全无法”，是因为机器仍然对调试器和重位信号有响应）。\n\
  \n我们将编写自己的 `USART2_IRQHandler` 来在 TDR 为空时做出响应，从而用更有用的处理程序替换默认处理程序。\n\n## 使用中断写入字符串\n\
  \n现在，让我们修改第 9 章中的串口 I/O 程序，使其使用中断而不是轮询来写入字符串。上层（主程序）与下层（中断例程）之间通信的仅有单个全局变量：\n\n\
  ```\nconst char* volatile usart2String = NULL;     // 我们正在发送的字符串\n```\n\n`const`\
  \ 修饰符告诉 C 语言该字符数据是常量，我们永远不会尝试更改它。`volatile` 修饰符告诉 C 语言，该变量可能会被正常 C 程序流之外的因素（例如中断函数）随时更改。\n\
  \n为了清楚起见，由于此时 C 的语法有点复杂，`const` 出现在 `char` 声明之前，意味着字符数据是常量。它没有出现在指针操作符（`*`）之后，因此指针不是常量。`volatile`\
  \ 修饰符出现在指针操作符之后，表示指针可能会被更改。指针操作符之后缺少 `const` 修饰符意味着程序可以更改此值。\n\n我们需要对被两个层使用的任何变量倍小心。幸运的是，对于这个示例，只有一个变量\
  \ `usart2String`。下面的列表列出了该变量的工作流：\n\n### 上层（主程序）\n\n1. 等待 `usart2String` 变为 `NULL`。\n\
  2. 将它指向我们要发送到输出的字符串。\n3. 发送第一个字符。\n4. 增加指针。\n5. 启用 UART 中断。\n\n### 下层（中断）\n\n1.\
  \ 如果到达字符串末尾，将 `usart2String` 设置为 `NULL`。\n2. 确认 UART 接收到了中断。\n3. 发送字符串指向的字符。\n4.\
  \ 增加指针。\n\n上层和下层都会增加指针。在启用中断时，我们需要非常小心，以确保两个层不会同时尝试使用该指针。上层在 `usart2String == NULL`\
  \ 之前不会执行任何操作，而下层只有在数据耗尽并禁用 UART2 中断时才会将 `usart2String` 设置为 `NULL`。上层通过在执行增加操作之后不再启用中断来保护自己。因此，中断例程无法扰乱代码。\n\
  \n这种分析极其重要。如果没有进行这种分析或执行得不当，程序将会失败，且失败会在随机时间产生随机结果。这些结果会引发一个极其困难、且难以调试的问题。\n\n我实际上花了大约三的时间才找到其中一个\
  \ Bug。该问题只出现在一个客户身上，而且大约两个月才发生一次。我们在实验室里完全无法复现它。幸运的是，客户非常随和，并愿意与我们合作寻找解决方案。在本章的稍后部分，我们将探讨如果不进行这种分析会发生什么，并考虑一些诊断中断相关\
  \ Bug 技术。\n\nListing 10-1 包含了中断驱动的串口 I/O 程序。\n\n```\n/**\n  * @brief   向串口 I/O 写入\
  \ Hello World。\n  * 使用中断代替轮询。\n*/\n\n#include <stdbool.h>\n#include \"stm32f0xx_nucleo.h\"\
  \n#include \"stm32f0xx.h\"\n\nconst char hello[] = \"Hello World!\\r\\n\";   //\
  \ 要发送的消息\nint current; // 我们正在发送的消息中的字符\n\nUART_HandleTypeDef uartHandle;      //\
  \ UART 初始化\n\n... Error_Handler 与 Listing 9-3 相同 ...\n\nconst char* volatile usart2String\
  \ = NULL;       // 我们正在发送的字符串\n/**\n * 处理 USART2 中断。\n *\n * 由芯片的中断系统神奇地调用。\n *\
  \ 名称是固定的，因为启动代码\n * 填充了中断向量。\n */\nvoid USART2_IRQHandler(void)\n{\n    if ((uartHandle.Instance->ISR\
  \ & USART_ISR_TXE) != 0) {\n        // 这不应该发生，但如果发生了，我们不希望程序崩溃。\n        if (usart2String\
  \ == NULL) {\n            // 关闭中断。\n            uartHandle.Instance->CR1 &= ~(USART_CR1_TXEIE);\n\
  \            return;\n        }\n        if (*usart2String == '\\0') {\n       \
  \     usart2String = NULL;        // 我们已经处理完字符串了。\n            // 关闭中断。\n      \
  \      uartHandle.Instance->CR1 &= ~(USART_CR1_TXEIE);\n            return;\n  \
  \      }\n        uartHandle.Instance->TDR = *usart2String; // 将字符发送到 UART。\n  \
  \      ++usart2String;              // 指向下一个字符。\n        return;\n    }\n    //\
  \ 因为我们启用的唯一中断是 TXE，我们永远不应该\n    // 到到这里。当我们启用其他中断时，我们需要在这里\n    // 放置处理它们的代码。\n\
  }\n/**\n * 我们的版本的 puts\n *\n * 将给定的精确字符串输出到输出\n *\n * @param str 要发送的字符串\n *\n *\
  \ @note 假设 str 不为\n */\nvoid myuts(const char* str)\n{\n    // 如果有人正在发送字符串，则等待。\n\
  \    while (usart2String != NULL)\n        continue;\n\n    // 告诉中断路由使用哪个字符串。\n\
  \    usart2String = str;\n\n    uartHandle.Instance->TDR = *usart2String;  // 将字符发送到\
  \ UART。\n    ++usart2String;             // 指向下一个字符。\n    // 启用中断。\n    uartHandle.Instance->CR1\
  \ |= USART_CR1_TXEIE;\n}\n```\n\n\n\n\n几个符号控制着中断的启用。`USART_CR1_TXNEIE` 位告诉 UART\
  \ 在发送数据缓冲区为空时产生中断。这里是其他一些需要注意的符号：\n\n1. `USART_CR1_IDLEIE` 空闲 (IDLE) 中断启用\n2. `USART_CR1_RXNEIE`\
  \ 接收中断启用\n3. `USART_CR1_TCIE` 传输完成中断启用（当字符发送出去时中断，而不是在我们将字符加载到传输寄存器时中断）\n4. `USART_CR1_PEIE`\
  \ 校验错误中断启用\n\n一旦发送了第一个字符，`TDR` 就会被填充。当它被传输到 `TSR` 时，`TDR` 将变为空，我们将得到中断。从这里开始，中断服务程序就开始工作。\n\
  \n实际的中断服务程序如下：\n\n```c\nvoid USART2_IRQHandler(void)\n{\n  if ((uartHandle.Instance->ISR\
  \ & USART_ISR_TXE) != 0) {\n        // 这不应该发生，但如果真的发生了，我们不希望程序崩溃。\n      if (usart2String\
  \ == NULL) {\n            // 关闭中断。\n            uartHandle.Instance->CR1 &= ~(USART_CR1_TXEIE);\n\
  \            return;\n        }\n      if (*usart2String == '\\0') {\n         \
  \   usart2String = NULL;        // 我们已经处理完字符串。\n            // 关闭中断。\n         \
  \   uartHandle.Instance->CR1 &= ~(USART_CR1_TXEIE);\n            return;\n     \
  \   }\n      uartHandle.Instance->TDR = *usart2String; // 将字符发送到 UART。\n      ++usart2String;\
  \         // 指向下一个字符。\n        return;\n    }\n    // 因为我们启用的唯一中断是 TXE，我们不应该到达这里。\n\
  \    // 当我们启用其他中断时，我们需要在这里放置\n    // 处理这些中断的代码。\n}\n```\n\n函数声明使用了特定的名称（magic name），用将其标识为中断服务程序。\n\
  \n如果该函数被调用，我们知道来自来自 `USART2` 的中断，但我们不知道它是什么类型的中断，因为 `USART` 有多种类型的中断：\n\n1. `USART_ISR_TXE`\
  \ TDR 为空\n2. `USART_ISR_CTSIF` CTS 中断\n3. `USART_ISR_TC` 传输完成\n4. `USART_ISR_RXNE`\
  \ 接收数据寄存器非空（数据准备好读取）\n5. `USART_ISR_ORE` 检测到溢出\n6. `USART_ISR_IDLE` 检测到空闲行\n7. `USART_ISR_FE`\
  \ 帧错误\n8. `USART_ISR_PE` 校验错误\n9. `USART_ISR_NE` 噪声标志\n10. `USART_ISR_CMF` 字符匹配\n\
  11. `USART_ISR_TXE` 接收超时\n\n所有这些中断都会导致调用 `USART2_IRQHandler`。\n\n首先，我们需要检查是否具有发送缓冲区空的中断。我们的中断函数不应该在\
  \ `usart2String` 设置为 `NULL` 的情况下被调用，但“应该”和“现实”之间有巨大差异，因此我们加入了一些防御性代码，以确保在出现问题时不会崩溃。在此处，变量\
  \ `usart2String` 永远不为 `NULL`，但如果是的话，我们不希望引起麻烦。\n\n如果没有那个检查，我们可能会尝试解引用一个 `NULL` 指针。解引用\
  \ `NULL` 指针是非法的，而 `STM32` 非常友好地提供了硬件来检查这种条件。当这种情况发生时，`STM32` 会产生一个*内存故障中断*。换句话说，中断处理程序被中断，控制权转移到内存故障中断处理程序。然而，我们还没有编写该程序，因此将执行默认处理程序。如之前所述，默认处理程序会锁定系统直到你对其进行重位。为了防止不正确的\
  \ `usart2String` 影响，当我们看到它时，会采取最安全的操作，即关闭中断并什么都不做。\n\n接下来，我们检查是否已经用完了字符串。如果是，我们将字符串置为\
  \ `NULL`，以向顶层信号表明我们已完成并关闭中断。否则，我们知道为 `UART` 提供了数据，且 `TDR` 是空的，因此我们向其丢入一个字符。一旦发送了字符，我们需要指向下一个字符以备下次被中断，然后返回主程序。\n\
  \n此时，`TDR` 是满的，`UART` 正在发送字符。中断例程没有别的事情可做了，因此它将返回并恢复正常执行。当字符发送且 `TDR` 为空时，我们将得到另一个中断，这将持续到我们用完字符串并关闭中断。\n\
  \nSTMicroelectronics 的硬件工程师通过图表很好地解释了这个过程（参见图 10-2）。\n\n![f10002](img/f10002.png)\n\
  \n图 10-2：USART 中断映射\n\n此图显示，如果 `TCIE`（传输字符中断启用）位开启且字符已发送（`TC`），则 AND 门的输出为真。此结果与另外三个中断的输出相结合，如果其中任何一个为真，结果即为真。\n\
  \n### 中断地狱\n\n在控制硬件以及实时处理事件方面，中断是非常强大的工具。然而，使用中断会引起许多独特的问题。首先，它们可以在任何时间中断正常流。例如，考虑以下代码：\n\
  \n```\ni = 5;\nif (i == 5) {\n```\n\n执行此语句后，`i` 的值是多少？显然是 5，除非中断刚刚执行并修改了它：\n\n```\n\
  i = 5;\nif (i == 5) { // 不再成立\n```\n\n其次，中断程序是异步执行的，这意味着它们随随地执行，因此由编写当的中断程序引起的错误很难复现。我见过在测试两周后才出现错误，因为中断恰好在执行某条指令时发生。\n\
  \n由于中断程序固有的困难，对它们保持敬畏。处理中断程序时最重要的设计规则是保持它们短小且简单，因为程序做的越少，出错的地方就越少。最好将“思考”留给高层代码，那里调试器工作良好，且复现性不是问题。\n\
  \n中断程序还需要快速执行，因为当一个中断程序执行时，其他中断会被阻塞直到该程序结束。如果你在一个从 `UART1` 读取字符的中断程序中花费长时间，另一个设备（如\
  \ `UART2`）可能会丢失数据，因为其中断无法及时处理。\n\n## 使用缓冲区增加速度\n\n我们刚刚使用的系统有一些局限性。它一次只能传输一条消息。假设我们要输出多个短消息。每个消息都必须等待上一个完成。这里有一个例子：\n\
  \n```\nmyPuts(\"There are \");\nif (messageCount == 0)\n   myPuts(\" no \");   \
  \           // 等待上一个消息完成\nelse\n   myPuts(\" some \");            // 等待上一个消息完成\n\
  myPuts(\"messages waiting\\r\\n\"); // 等待上一个消息完成\n```\n\n解决此问题的方案是创建一个*缓冲区*来保存字符数据，直到中断程序处理它们。这样做增加了应用程序的复杂性，但增加了你的顶层程序发送数据的速度。\n\
  \n使用串口 I/O 意味着要考虑速度与简单性的通用趋势。轮版本非常简单但缓慢。单字符串中断版本更快但更复杂。我们现在使用的缓冲区系统快得多，也复杂得多。这种趋势适用于大多数程序。\n\
  \n\n\n\n\n对于这个问题，让我们回到缓冲区（buffer）。我们将使用一个具有以下基本结构的`circular buffer`（循环缓冲区）：\n\n\
  ```c\nstruct circularBuffer {\n    uint32_t putIndex;      // 我们将存放下一个字符的地方\n  \
  \  uint32_t getIndex;      // 我们获取下一个字符的地方\n    uint32_t nCharacters;   // 缓冲区中的字符数量\n\
  \    char data[BUFFER_SIZE]; // 缓冲区中的数据\n}\n```\n\n它被称为`循环缓冲区`，是因为索引会回绕。换句话说，当一个字符放入\
  \ `data` 的最后一个元素后，`putIndex` 将从 7（`BUFFER_SIZE-1`）回绕到 0。\n\n从图表上看，这看起来如图图 10-3 所示。\n\
  \n![f10003](img/f10003.png)\n\n图 10-3：工作中的循环缓冲区\n\n我们的实现将包含一个故意的严重错误，这样我们就可以在一个小的、受控的程序中查看查找此类错误的技术和步骤。在分析程序的过程中，我将展示该\
  \ bug 的症状、用于定位它的诊断技术以及修复方法。\n\n我第一次遇到这样的问题是在大约 30 年前。它不是出现在一个 200 行的演示程序中，而是在 BSD\
  \ Unix 内核中一个拥有数万行的串口模块里。它大约每三到七天随机发生一次，三位工程师花了两个月才找到它。更糟糕的是它是取决于处理器的，并没有在运行原始 BSD\
  \ 的 VAX 处理器上发生。\n\n顶层程序（发送端）将数据放入缓冲区。低层中断例程序（接收端）从缓冲区中移除数据。\n\n在伪代码中，发送者的任务如下：\n\
  \n```\n如果缓冲区满了，则等待。\n在 putIndex 处向缓冲区放入一个字符。\n将 putIndex 加一，如果需要则回绕。\n增加缓冲区中字符的数量。\n\
  ```\n\n接收者的任务如下：\n\n```\n在 getIndex 处从缓冲区获取一个字符。\n将 getIndex 加一，如果需要则回绕。\n减少缓冲区中字符的数量。\n\
  ```\n\n### Sending Function\n\n为了使用循环缓冲区，我们必须回到使用另一个版本的 `myPutchar` 来次发送一个字符。让我们看看执行发送的代码：\n\
  \n```c\nvoid myPutchar(const char ch)\n{\n    // 等待直到有空间。\n  1 while (buffer.nCharacters\
  \ == BUFFER_SIZE)\n        continue;\n  2 buffer.data[buffer.putIndex] = ch;\n \
  \ 3 ++buffer.putIndex;\n    if (buffer.putIndex == BUFFER_SIZE)\n        buffer.putIndex\
  \ = 0;\n\n    // 我们又添加了一个字符。\n  4 ++buffer.nCharacters;\n    // 现在我们完成了。\n\n   \
  \ // 启用中断（或重新启用）。\n  5 uartHandle.Instance->CR1 |= USART_CR1_TXEIE;\n}\n```\n\n\
  在开始时，我们等待缓冲区中有至少容纳一个字符的空间 1。然后我们将字符存入缓冲区 2。`putIndex` 进一位，并在必要时回绕到 0 3。缓冲区中的字符数量增加了，因此我们增加了缓冲区结构体中的\
  \ `nCharacters` 计数 4。最后，我们启用中断 5。如果我们正在传输，中断可能已经启用。再次启用它不会导致问题。\n\n### Interrupt\
  \ Routine\n\n中断例程序从缓冲区读取数据并将其传输到 UART。如果缓冲区中有字符，该例程序将其移除并发送到 UART。如果缓冲区中为空，该例程序将关闭中断。\n\
  \n这里是该过程的代码：\n\n```c\nvoid USART2_IRQHandler(void)\n{\n  1 if ((uartHandle.Instance->ISR\
  \ & USART_ISR_TXE) != 0) {\n        if (buffer.nCharacters == 0) {\n           \
  \ // 关闭中断。\n            uartHandle.Instance->CR1 &= ~(USART_CR1_TXIE);\n       \
  \     return;\n        }\n      2 // 发送到 UART。\n        uartHandle.Instance->TDR\
  \ = buffer.data[buffer.getIndex];\n      3 ++buffer.getIndex;\n        if (buffer.getIndex\
  \ == BUFFER_SIZE)\n            buffer.getIndex = 0;\n\n      4 --buffer.nCharacters;\n\
  \n      5 if (buffer.nCharacters == 0)\n            uartHandle.Instance->CR1 &=\
  \ ~(USART_CR1_TXIE);\n        return;\n    }\n    // 因为只启用了 TXE，我们不应该\n    // 到这里。当我们启用其他中断时，\n\
  \    // 我们需要在这里处理它们的代码。\n}\n```\n\n首先，我们检查设备是否耗尽数据。如果是，我们就关闭中断直到从上层获取更多数据 1。然后我们发送字符\
  \ 2，将 `getIndex` 加一，如果需要则回绕 3。接下来，我们告诉上层少了一个字符 4。最后，如果是最后一个字符，我们就关闭中断 5。\n\n###\
  \ Full Program\n\nListing 10-2 显示了完整的程序。\n\n```c\n/**\n  @brief 向串口写入 Hello World\n\
