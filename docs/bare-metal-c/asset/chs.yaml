  \ `Project Type` 列中，选择 `Executable`▶`Empty Project`。\n    3. 在 `Toolchains` 列中，选择适用于你原生系统的工具链。例如，如果你在带有\
  \ `Visual C++` 的 Windows 上，你将选择 `Visual C++`。如果你在 Linux 上，将选择 Linux C 编译器 `GNU gcc`。\n\
  \    4. 点击 `Next`。\n4. 在 `Configurations` 窗口中：\n    1. 取消勾选 `Release`。\n    2. `Debug`\
