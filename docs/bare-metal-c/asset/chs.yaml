  \n现在让我们实际运行程序。选择 `Run▶Run`。结果应该出现在 `Console` 窗口中，如图 2-7 所示。\n\n![f02007](img/f02007.png)\n\
  \n图 2-7：结果\n\n左上角是 `Stack Trace`（栈跟踪）窗口，显示了正在执行的程序以及你所在的进度。当我们第 7 章讨论栈的使用时，这些信息将变得更有用。\n\
  \n旁边是 `Variables/Breakpoints/Registers/I/O Registers/Modules`窗口，包含以下内容：\n\n1.  **Variables**：程序变量的信息。（从第\
  \ 4 章开始详细介绍。）\n2.  **Breakpoints**（断点）：*断点*是程序中的一个位置，程序在此处停止并让调试器检查它。你可以通过双击程序中可执行行的行号来设置断点。我们将在第\
  \ 3 章开始使用它们。\n3.  **Registers**（寄存器）：处理器寄存器当前状态的信息。（第 10 章讨论。）\n4.  **Modules**（模块）：动态链接模块。由于此功能对嵌入式程序员不可用，我们不会讨论它。\n\
  \n屏幕中间的`Source`窗口显示了程序。高亮的代码行表示调试器已运行到这一行并停止。\n\n\n\n\n源（Source）窗口旁边是大纲（Outline）面板。这就像一个目录，指示了哪些文件进入了我们的程序。我包含了\
  \ `stdio.h` 和 `stdlib.h` 文件，这样它们就会显示在这里。\n\n底部是控制台/任务/问题/可执行文件/内存窗口（Console/Tasks/Problems/Memory）。控制台窗口显示程序的输出。所有其他标签页都包含我们不感兴趣的信息。\n\
  \n现在我们将逐行执行（`step through`）程序，这意味着我们将使用调试器一次执行一条语句。点击屏幕顶部的单步执行（Step Over）图标（参见图\
  \ 2-11）或按 `F6` 跳过当前行。\n\n![f02011](img/f02011.png)\n\n图 2-11：单步执行 (F6)\n\n源窗口中高亮的行会向下移动，控制台窗口中会出现\
  \ `!!!Hello World!!!`（参见图 2-12）。\n\n![f02012](img/f02012.png)\n\n图 2-12：单步执行结果\n\
  \n如果你继续单步执行，你会看到第二个 `puts` 执行，然后是 `return` 语句。之后，程序进入系统库进行清理工作。由于我们没有该库的源代码，调试器无法显示任何关于它的信息。\n\
  \n工具栏上还有两个重要的图标（参见图 2-13）。恢复（Resume）图标（或 `F8` 键）运行程序直到其结束或遇到断点。调试（Debug）图标重新启动调试。\n\
  \n![f02013](img/f02013.png)\n\n图 2-13：调试命令\n\n在接下来的章节中，我们将大量使用调试器。它将提供一种从运行程序中获取信息并查看运行情况非常有有用方法。要返回原始的\
  \ C/C++ 视图，选择 `Window`（窗口）▶`Perspective`（视图）▶`Open Perspective`（打开视图）▶`C++`。\n\n\
  ## IDE 为我们做了什么\n\nIDE 生成了 C 源文件，包括打印“Hello World”的 `puts` 函数。它还生成了一个名为 `Debug/makefile`\
  \ 的文件，作为 `make` 程序的输入。Listing 2-1 包含了该文件的摘。\n\n```\n###########################################################################\n\
  # 自动生成的文件。请编辑！\n###########################################################################\n\
  \n-include ../makefile.init\n\nRM := rm -rf\n\n# 所有参与构建的源文件定义在这里\n-include 1 sources.mk\n\
  -include src/subdir.mk\n-include subdir.mk\n-include 2 objects.mk\n\nifneq ($(MAKECMDGOALS),clean)\n\
  ifneq ($(strip $(C_DEPS)),)\n-include $(C_DEPS)\nendif\nendif\n\n-include ../makefile.defs\n\
  \n# 将这些工具调用的输入和输出添加到构建变量中\n\n# 所有目标\nall: 02.hello-ide\n```\n\n列表 2-1：`Debug/makefile`\
  \ 的摘。\n\n此 makefile 位于 `Debug` 目录下。IDE 支持多种构建配置，并为每种配置在不同的目录下生成一个 makefile。（对于此项目，我们只创建了一个\
  \ Debug 配置。其他项目也可以使用 Release 配置。）\n\n这个 makefile 比我们在第 1 章中自己生成的复杂，因为 IDE 使用了大量的高级\
  \ `make` 语法。IDE 还生成了 `sources.mk` 1 和 `objects.mk` 2 文件，它们被包含在 makefile 中。从这些文件中我们可以看到，计算机生成的内容的设计非常灵活，但代价是让内容几乎无法阅读。\n\
  \n目前，IDE 不生成或下载大量数据。但当我们开始进行嵌入式编程时，这种情况将发生巨大变化。\n\n## 导入书中的编程示例\n\n书中使用的编程示例可以在\
  \ [`nostarch.com/bare-metal-c.`](https://nostarch.com/bare-metal-c.) 下载。要使用下载的编程示例，你需要导入它们。（你不能直接把文件丢进工作区；那样就太简单了。）要执行导入，请使用以下步骤：\n\
  \n1. 选择 `File`（文件）▶`Import`（导入）。\n2. 在导入对话框中，选择 `General`（常规）▶`Existing Projects\
  \ into Workspace`（将现有项目导入工作区）。\n3. 点击 `Next`（下一步）。\n4. 选择单选框 `Select Archive File`（选择存档文件），然后点击空白处的\
  \ `Browse`（浏览）来选择包含项目的文件（从网站下载的）。\n5. 点击 `Finish`（完成）。\n\n## 总结\n\nIDE 是一把双刃剑。一方面，你不需要担心创建程序所需的所有工具。你不需要手动创建\
  \ makefile、手动执行构建或运行调试器。\n\n但这种无需干预的方法是有代价的。要为第 1 章中的程序添加编译时标志，你只需要将该标志添加到 makefile\
  \ 中。使用 IDE 的话，你无法这样做，因为 IDE 会自发生成 makefile。你必须在 IDE 中找到正确的配置项来操作，而且正如我们将会发现的那样，IDE\
  \ 有很多选项。\n\n在本书中，我 Try 尽量保持事情尽可能简单。\n\n## 编程题\n\n1. 找出在字符串中放入 `\\t` 会发生什么。\n2. 在这一章中，我们使用\
  \ `printf` 进行打印。\n\n## 问题\n\n1. 什么是 IDE？\n2. 我们生成的文件有哪些，它们包含什么内容？\n3. 在哪里可以获得 C\
  \ 语言的帮助？\n\n# 3 微控制器编程\n\n![](img/chapterart.png)\n\n现在我们已经在 IDE 中编写并运行了一个“Hello\
  \ World”程序，我们将在 STM32 NUCLEO-F030R8 板上执行同样的操作，它包含 STM32F030 处理器和其他几个组件。在嵌入式系统中，“Hello\
  \ World”的等效程序是一个让 LED 闪烁的程序。通过让 LED 闪烁，你将学习制作更大程序所需的步骤。\n\n在此过程中，你将学习使用 System Workbench\
  \ for STM32（我们在上一章中探索过的）来创建嵌入式程序。为了帮助我们，我们将使用 STMicroelectronics 名为硬件抽象层（HAL）的软件，它隐藏了一些令人讨厌的硬件细节。（然而，这些细节隐藏得并不深，你可以检查源代码查看详情。）我们还将探讨\
  \ IDE 在后台做了什么，详细解释它编译代码时使用的选项。\n\n最后，就像我们在第 2 章做的那样，我们将运行调试器查看程序一次执行一条语句，这开始制作更大的程序时将证明非常有用。\n\
  \n## NUCLEO-F030R8 开发板\n\n开发板*是包含处理器芯片以及开发该处理器所需的各种其他组件的电路板，包括许多用于开发程序和电路的物品。除了编程和调试支持外，开发板还包含许多连接器，允许你连接原型硬件。它还包含了一些外设，如串口、按键开关和\
  \ LED，尽管一些更高级的板子会有额外的外设。\n\n因此，开发板为你提供了一个即时原型，用于带有面包板硬件的初始开发。微处理器制造商通常销售包含所有内容的开发板，以吸引人们使用他们的芯片。\n\
  \nSTM32 NUCLEO-F030R8 板将 STM32F030 芯片与时钟电路、电源以及一些通信设备封装在一起，包括 LED、按钮和串口 I/O 设备。图\
  \ 3-1 显示了我们处理器板的基本构建模块。\n\n\n\n\n电源和时钟驱动 CPU，复位按钮重启 CPU，用户 LED 和推按按钮用于用户交互，而串口和连接器则用于编程和调试。\n\
  \n### 对开发板进行编程和调试\n\n开发板包含三个用于编程和调试芯片的设备——一个闪存器、一个 JTAG 适配器和一个串口 I/O 设备——它们都通过一根\
  \ USB 线连接到你的计算机。（一根线，三个设备。）\n\n要为芯片编程，我们使用 `flash programmer`，该设备允许我们的 PC 重新编程芯片的内存。重新编程内存是将程序导入到机器中的。\n\
  \n为了方便调试，芯片具有一个 JTAG 端口。JTAG 代表联合测试动作小组（Joint Test Action Group），是一种标准的调试接口。在这个标准出现之前，每个人都创建自己的调试接口，或者更多情况下是将其遗漏，导致程序员在调试程序时不得不极具想象力。要通过\
  \ JTAG 端口进行调试，我们需要将其连接到计算机。这是通过 `debug pod` 实现的，它的一端连接到开发板上的 JTAG 端口，另一端连接到计算机的\
  \ USB 端口。\n\n另一个非常有用的调试和维护工具是打印诊断信息。嵌入式程序面临的问题在于将信息打印在哪里。你没有屏幕，所以无法打印到屏幕上。在日志文件中打印信息是困难的，因为你没有文件系统。大多数设备设计者的做法是在板上放置一个\
  \ `serial port`，这是一种简单的三线通信接口。第 9 章将详细介绍该设备的细节。\n\n### 设置开发板\n\nNucleo 板的下半部分包含芯片和支持电路，许多引脚引出到板侧的连接器上（用于连接外围设备）。上方是支持板，包含编程器、调试器、串口转\
  \ USB 设备和一个 USB 存储设备。\n\n图 3-2 显示了板是如何组合在一起的。\n\n![f03002](img/f03002.png)\n\n图\
  \ 3-2：NUCLEO-F030R8 开发板\n\n板上还包含几个跳线帽和 LED。`Jumpers`（跳线帽）是将两个引脚短接的小塑料装置。它们用于选择硬件选项，例如启用板载调试器（ST-LINK），并应按照图\
  \ 3-3 所示所示安装。按照以下步骤操作：\n\n1. 使用两个跳线帽 (`CN2`) 安装 ST-LINK。这样做可以配置板载调试适配器（ST-LINK）来调试板载微控制器。如果你移除这两个跳线帽，则可以使用\
  \ ST-LINK 适配器来调试其他板子。\n2. 不要安装电源跳线帽 (`JP1`)。此配置允许 Nucleo 板通过 USB 端口抽取高达 300mA 的电流，让你可以使用\
  \ USB 端口为设备供电。如果你在板上连接了许多耗电外围设备，可以使用 `JP1` 启用外部电源。本书不使用任何外部硬件，因此留空 `JP1`。\n3. 不要安装\
  \ `RX-TX`，这是一个将串口输入和输出短接的调试选项。稍后我们将串口作为实际串口使用，因此不要插这个跳线。\n4. 将 `JP5` 跳线帽安装到正确位置\
  \ (`U5V`)。这样做可确保板将通过 USB 端口供电，而不是外部电源。\n5. 接通测量跳线 (`JP6`）。这是一个低功耗设备。由 `JP6` 短接的两个引脚为芯片供电。移除跳线帽并连接电流表以测量功耗。\n\
  \n`CN11` 和 `CN12` 是未使用时存放跳线帽的地方。在这些位置安装跳线不会影响电路。\n\n![f03003](img/f03003.png)\n\n\
  图 3-3：跳线帽和 LED 位置\n\n现在使用 mini USB 线将设备插入你的计算机。LD1 应该变红，表示编程器已供电。LD2 应该闪烁，因为板上预装了一个让\
  \ LD2 闪烁的程序。（前提是你买的是新板。如果你像我一样是从走廊尽头的朋友那里得到的第一块板，它将包含你朋友最后一次实验的内容。）LD3 也应该变红，表示芯片已供电。\n\
  \n### 设置嵌入式项目\n\n在开始编程之前，关闭 System Workbench for STM32 中所有打开的编辑窗口。编辑窗口识别的是文件名而不是项目名称，这会导致问题；我们所有的项目都有一个\
  \ `main.c` 文件，如果打开六个 `main.c` 编辑窗口，情况会变得非常混乱。\n\n接下来，通过选择 `File`▶`New`▶`C Project`\
  \ 创建一个嵌入式项目。（附录中有一个详细说明这些步骤清单）。将出现 C Project 对话框（见图 3-4）。\n\n![f03004](img/f03004.png)\n\
  \n图 3-4：C Project 对话框\n\n项目名称，输入 `03.blink`。对于项目类型，选择 `Ac6 STM32 MCU Project`。首次启动时，IDE\
  \ 将 GCC ARM 工具链下载到你安装 IDE 的目录，以及整个 STM32 固件库，其中一部分将复制到你的项目中。如果你想探索此库的代码以及 Linux\
  \ 下的 `~ac6` 或 Windows 下的 `C:\\Users\\<username>\\AppData\\Roaming\\ac6`，请注意。\n\n\
  \n\n你可能希望用你的名字和信息更新此注释。以 `@` 开头的关键字是为了配合 `Doxygen` 设计的，这是一个复杂且功能全系统，可以从大型程序中提取文档。我们的小型程序将不会使用这个工具，所以你可以以任何喜欢的方式编辑注释。\n\
  \n`main` 函数没有 `return` 语句，因为 `return` 语句会将控制权从程序返回给操作系统，但裸机系统（bare metal system）没有操作系统。操作系统的工作之一是启动和停止程序（以及其他）。由于我们没有操作系统，当我们的程序停止时，处理器就会停止并什么都不做。所以我们永不停止。永远不停。要看我们是如何实现这一点的，请注意第\
  \ 19 行的 `for(;;);`。这是 C 代码，表示“无限循环”（`for(;;)`）和“什么都不做”（结尾的分号）。\n\n但是如果没有操作系统，我们如何启动呢？我们的程序在处理器开启或复位时启动（因此这就是为什么开发板上需要一个大黑色的复位按钮）。\n\
  \n目前，我们的程序什么都不做，而且花费了无限的时间来执行。让我们写一些代码来做点事情。\n\n### 初始化硬件\n\n首先，我们需要初始化硬件。为了做到这一点，我们将首次使用\
  \ `HAL` 库。`HAL` 软件层的设计是为了隐藏让芯片工作所需的所有糟糕细节。例如，在使用 LED 闪烁定时之前，我们必须先初始化片上时钟。手动完成这些需要编写特定的\
  \ I/O 寄存器，这些寄存器直接控制 I/O 设备的行为。它们是硬件的一部分。\n\n尽管我们可以通过芯片 700 页的参考手册来确定编写哪些寄存器，然后进行所有的计算以确定为它们编写哪些值，但这将花费大量工作。\n\
  \n相反，我们可以使用 `HAL` 软件，特别是 `HAL_Init` 函数，来为我们完成所有工作。`HAL_Init` 函数配置系统时钟，以便我们以后可以使用它为\
  \ LED 定时。在 `main` 函数的第一个大括号之后插入对 `HAL_Init` 的调用，如下：\n\n```\nint main(void)\n{\n\
  \    HAL_Init();\n```\n\n通常情况下，最佳实践是每使用一组大括号缩进四个空格。C 语言并不要求这样做，但这会让程序变得更容易理解。（四个空格并没有神奇之处。有些程序使用两个，有些使用八个，还有少数奇怪的人使用三个。）\n\
  \n基础硬件处理好了。\n\n### 编写 GPIO 引脚\n\n芯片有许多通用输入/输出引脚，称为 `GPIO` 引脚，我们可以对它们进行编程，用于各种接收输入或发送输出。例如，我们可以编写一个引脚作为输出并将其连接到\
  \ LED（这正是在本程序中我们要做的）。或者或者，我们可以编写一个引脚作为输入并将其连接到开关（我们将在下一章中这样做）。\n\n微控制器的一些引脚可以作为模拟输入或输出。大多数\
  \ `GPIO` 引脚可以是开启或关闭的。模拟引脚可以处理开启和关闭之间的电压，例如开启时的 32765/65536。其他的引脚连接到 `USART`（串口 I/O\
  \ 控制器）或 `I2C bus`（简单 I/O 总线），以便与 `I2C` 外设芯片通信。好消息是这些引脚可以做很多事情。坏消息是，我们需要编写程序来告诉芯片：“不要做那些花哨的事情。只在我想要你开启时开启，在我想要你关闭时关闭。”\n\
  \n我们将编写连接到用户 LED (LED2) 的 `GPIO` 引脚。我们需要告诉芯片我们正在将此引脚用于输出；然后我们必须告诉它关于我们如何如何使用它的很多信息。这包括设置\
  \ `GPIO` 时钟，它控制它的反应速度。`HAL` 固件可以完成大部分这类工作，但我们必须通过向 `HAL_GPIO_Init` 函数传递一个配置信息结构来告诉\
  \ `HAL` 该做什么（C 语言的结构概念将在第 7 章中详细介绍）：\n\n```\n// LED 时钟初始化\nLED2_GPIO_CLK_ENABLE();\n\
  \n// 初始化 LED\nGPIO_InitTypeDef GPIO_InitStruct;\nGPIO_InitStruct.Pin = LED2_PIN;\n\
  GPIO_InitStruct.Mode = GPIO_MODE_OUTPUT_PP;\nGPIO_InitStruct.Pull = GPIO_PULLUP;\n\
  GPIO_InitStruct.Speed = GPIO_SPEED_FREQ_HIGH;\nHAL_GPIO_Init(LED2_GPIO_PORT, &GPIO_InitStruct);\n\
  ```\n\n我们开启引脚以便向 `LED2_PIN` 传输数据，这是连接到用户 LED 的引脚。接下来，我们指定该引脚将用于输出，因为我们正在向 LED 发送数据而不是检索数据，并将模式设置为推拉式（push/pull）。这种模式取决于你连接到输出引脚的内容。在这种情况下，我们的电路需要推拉式。此选项控制用于驱动\
  \ `GPIO` 引脚的内部硬件。STM 芯片手册向你展示了这个电路是如何组织的（或者更准确地说，它向你的硬件人员展示了芯片是如何组织的，他们可以告诉你使用哪种模式）。\n\
  \n上拉标志（pullup flags）配置 `GPIO` 引脚，使得在输入模式下，上拉电阻是电路的一部分。这对于输出引脚无关的。\n\n### 切换 LED\n\
