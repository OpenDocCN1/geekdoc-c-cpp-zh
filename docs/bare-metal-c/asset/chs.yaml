- "# 裸机 C 语言\n\n\n\n![](img/cover.png)\n![](img/cover.png)\n\n\n\n\n\n\n\n\n\n\n\n\
  \n\n\n# 简介\n\n![](img/chapterart.png)\n\n## 关于作者\n\nSteve Oualline 拥有超过 50 年编写嵌入式系统可靠、低漏洞程序的经验。他拥有美国南加州大学的科学硕士学位，并为\
  \ No Starch Press 和 O’Reilly 出版过许多部书籍。他目前是南加州铁路博物馆的一名志愿者，他最近的一个项目是为他们的 `Acme Traffic`\
  \ 信号灯计算机控制器进行调试（蚂蚁在里面筑了巢，必须将其清理）。你可以在 [`oualline.com`](http://oualline.com) 访问他的个人网站。\n\
  \n## 关于技术审阅员\n\nFrank Duignan 于 1988 年毕业成为电气工程师。从那以后，他主要工作在硬件与软件的接口领域。他目前在都柏林科技大学授授电气/电子工程课程。Frank\
  \ 的博客可以在 [`ioprog.com`](https://ioprog.com) 找到。\n\n\n\n\n这本书取名为 `Bare Metal C`（裸机\
  \ C），因为它是为那些接近硬件的人准备的。它不是给那些买来箱式电脑且从未见过其内部的人准备的。书中使用的计算机甚至没有外壳。如果你想使用它，必须将某些东西连接到电路板的“裸金属”上。\n\
  \n这本书教授的是嵌入式编程。`嵌入式计算机`是位于机器内部的计算机，你甚至不知道它的存在。它是运行你的车库门打开器、微波炉、汽车，甚至是问候卡的设备。但在执行任何这些功能之前，它需要被编程。而这正是本书要教你的：如何编写嵌入式系统。\n\
  \n为什么选择 C 语言？\n\nC 语言让你对程序执行的行为进行精确控制，而其他语言（如 `C++`）可能会在你背后执行很多事情。请考虑以下语句：\n\n```\n\
  a = b;\n```\n\n在 `C++` 中，这可能会调用类的赋值运算符函数，这可能导致堆内存的分配和释放，并抛出异常。这些这些的意义现在并不重要；重点在于，你并不确切知道会发生什么。\n\
  \n在 `C` 中，这条语句将值 `b` 赋值给变量 `a`，且没有任何副作用；它只是一个赋值，仅此而已。这个例子很简单，但在整本书中，你将看到 C 其他许多完全按照你的指令执行的操作。\n\
  \n精确控制非常重要，因为我们正在使用 C 语言为一个基于 `STM32F030x4` 处理器（一种廉价的基于 `ARM Cortex-M0` 的系统）、具有\
  \ 8KB RAM 的低端 SOC 系统编程。在 RAM 有限的情况下，内存管理非常重要，我们无法负担像 `C++` 这样的高级语言在我们背后操作内存。精确控制同样重要，因为嵌入式系统没有操作系统，你需要直接告诉硬件要做什么。高级语言并不总是能让你与硬件通信，但\
  \ C 语言可以。\n\n本书是为具有计算机和硬件基础知识，但编程知识有限的人设计的。它适用于那些想要将新硬件连接到微控制器并首次使用它的硬件设计人员。它也适用于对底层编程感兴趣并希望充分利用一个\
  \ 38 分美金芯片性能的程序员。\n\n为了让你的程序发挥最大作用，你需要了解底层到底发生了什么。书中不仅会教你如何写程序，还会教你程序是如何翻译成 `ARM`\
  \ 芯片使用的机器的。这对于最大效率至关重要。例如，你将学习将程序从使用 16 位整数改为 32 位整数会产生多大的性能损失。令人惊讶的答案是，32 位整数`更高效`且`速度更快`（32\
  \ 位是 `ARM` 的原生数值宽度，如果它被强制执行 16 位算术运算，它会执行 32 位计算然后丢弃 16 位）。\n\n为了编程和调试 `ARM` 芯片，你需要一些额外的工具：一个闪存编程器（用于将代码写入机器）、一个\
  \ USB 转串口转换器（因为我们使用串口进行调试）以及一个 JTAG 调试器。由于几乎所有开发者都需要这组工具，意法半制造了一块提供你所有所需硬件的板子，称为\
  \ `NUCLEO-F030R8`。在写本文时，由于芯片短缺，某些板子很难找到。访问 [`nostarch.com/bare-metal-c`](https://nostarch.com/bare-metal-c)\
  \ 查看替代开发板。你还需要一根小型 USB 线（那种不适合你手机的那种），以便将板子插入电脑。\n\n你的第一个任务是订购一个 `NUCLEO-F030R8`。然后开始阅读第\
  \ 1 章。等板子到达时，你已经准备就绪了。\n\n# 第一部分：嵌入式编程\n\n让我来描述一个“简单”的嵌入式系统。它是一个电池供电的处理器，位于挂在脖上的吊坠内。当终端用户遇到紧急情况时，他们按下按钮，计算机向接收器发送无线信号，由接收器拨打紧急电话。\n\
  \n听起来很简单……除非你必须向无线电发送一组精确的脉冲，这样它才能产生正确的信号。系统必须定期检查电池并将电池信息发送到基站，这有两个作用：首先，当电池电量开始变低时，报警公司会收到通知并向终端用户发送一个新的吊坠。其次，如果基站没有接收到周期性信号，报警公司就知道吊坠出了问题。\n\
  \n这种程序在嵌入式世界中非常典型。它很小、必须精确，并且不使用大量的外部资源。\n\n在本书的这一章节中，你将学习基础的 C 语法和编程。我们还详细介绍了 C\
  \ 编译器的作用，以便你能够精确控制程序的程序的行为。为了获得这种精确的控制，你需要知道编译器在你背后做了什么。\n\n嵌入式编程面临着其独特的调试挑战。幸运的是，JTAG\
  \ 调试接口等工具让事情变得简单，尽管如此，调试嵌入式系统可能非常困难。\n\n最基本、常用的调试方法之一是在代码中放置 `printf` 语句。在进行嵌入式编程时这有点困难，因为没有输出。我们将介绍如何使用串口\
  \ I/O 输出数据。\n\n最后，在本书的这一部分，你将学习中断编程。中断允许你高效地执行任务，但如果不正确，也会产生随机 Bug。\n\n# 章：Hello\
  \ World\n\n在本章中，你将创建并运行你的程序“Hello World”。这是你能编写的最简单的程序，也是所有 C 书中的程序。但你不只是创建它，还将学习背后实际上发生了什么。\n\
  \n你使用的工具旨在让过程变得快速方便。编译器 `GCC` 实际上是运行一系列其他工具的封装器。我们将查看每个工具如何将程序从代码变为执行。在此过程中，你会发现\
  \ `GCC` 优化器带给我们一个惊喜。尽管我们的程序很简单，但优化器会决定重写部分代码以提高效率——而且它不会告诉我们。\n\n安装 GCC\n\n为了运行本章中的程序，你需要在你的系统中下载并安装\
  \ GNU C 编译器（`GCC`）以及相关工具。安装方法取决于你的操作系统。\n\n在 Windows 上，安装 Minimalist GNU for Windows\
  \ (MinGW)，可以在 http://www.mingw.org 获取。访问 [`nostarch.com/bare-metal-c`](https://nostarch.com/bare-metal-c)\
  \ 查看详细说明。\n\n在 macOS 上，`GCC` 编译器包含在软件包中，可以通过以下命令访问：\n\n```\n$ xcode-select --install\n\
  ```\n\n选择**命令行工具**选项进行安装。\n\nLinux 的安装说明取决于你使用的发行版。对于 Debian 系统（如 Ubuntu 和 Linux\
  \ Mint），使用以下命令：\n\n```\n$ sudo apt-get install build-essential\n$ sudo apt-get install\
  \ manpages-dev\n```\n\n对于 Red Hat 系列的系统（如 Fedora 或 CentOS），使用以下命令：\n\n\n\n\n```\n\
  $ dnf groupinstall \"Development Tools\"\n```\n\n对于任何其他基于 Linux 的系统，请使用系统自带的包管理器或在网上搜索找到安装所需的命令。\n\
  \n安装好软件后，打开终端窗口并执行 `gcc` 命令。如果你收到“no input files”错误，说明你安装成功了。\n\n```\n$ gcc\ngcc:\
  \ fatal error: no input files\ncompilation terminated.\n```\n\n## 下载 STM32 的 System\
  \ Workbench\n\nSystem Workbench for STM32 是我们将用于为嵌入式设备编写 C 程序的 IDE。在第 2 章之前我们不会使用它，但下载需要一些时间，因此建议你现在就开始下载。当你读完这一章时，下载应该已经完成了。\n\
  \n访问 [`openstm32.org/HomePage`](http://openstm32.org/HomePage)，找到 System Workbench\
  \ for STM32 的链接并点击。注册（免费的），或者如果你已有账户请登录，然后按照链接中的安装说明操作。通过安装程序安装 IDE，而不是通过 Eclipse。下载开始后，返回此处继续阅读。\n\
  \n工具和安装步骤可能会随时间变化。如果你遇到任何问题，请访问 [`nostarch.com/bare-metal-c`](https://nostarch.com/bare-metal-c)\
  \ 查看更新后的说明。\n\n## 我们的第一个程序\n\n我们的第一个程序名为 `hello.c`。首先创建一个用于存放该程序的目录并进入该目录。导航到工作空间的根目录，打开命令行窗口并输入以下命令：\n\
  \n```\n$ mkdir hello\n$ cd hello\n```\n\n使用记事本、Vim 或 Gedit 等文本编辑器创建一个名为 `hello.c`\
  \ 的文件，并输入以下代码：\n\n```\n#include <stdio.h>\nint main()\n{\n    printf(\"Hello World!\\\
  n\");\n    return (0);\n}\n```\n\n我们将在接下来的章节中详细介绍这个程序。不过，首先我们必须运行它。\n\n### 编译程序\n\
  \n你刚刚创建的文件被称为`源文件`（source file），它包含了人类可读格式的代码。（是的，真的；这本就应该是人类可读的。）它是我们要产生的所有其他文件的源。文件的内容被称为`源代码`（source\
  \ code）。计算机不理解源代码；它只理解`机器码`（machine code），这是一组数字格式的指令。因此，我们需要将源代码转换为机器码，这个过程被称为`编译`（compiling）。\n\
  \n要做到这一点，我们在 macOS 或 Linux 上执行以下编译器命令：\n\n```\n$ gcc -o hello hello.c\n```\n\n在\
  \ Windows 上，我们执行以下命令：\n\n```\n$ gcc -o hello.exe hello.c\n```\n\n如果你没有任何输出，只有一个命令提示符，说明命令执行成功了。否则，你将收到错误信息。\n\
  \n该命令告诉程序 `GCC` 去`编译`并`链接`程序，将输出放在 macOS 和 Linux 上的 `hello` 文件或 Windows 上的 `hello.exe`\
  \ 文件中。我们现在可以使用以下命令在 macOS 或 Linux 上运行程序：\n\n```\n$ ./hello\nHello World!\n```\n\n\
  在 Windows 上，运行以下命令：\n\n```\n$ hello\nHello World!\n```\n\n### 犯错\n\n让我们引入一个错误看看会发生什么。修改第二行如下：\n\
  \n```\nintxxx main()\n```\n\n现在让我们尝试编译程序：\n\n```\n$ gcc -o hello hello.c\nhello.c:2:1:\
  \ error: unknown type name 'intxxx'\n intxxx main()\n ^\n```\n\n输出告诉我们程序第 2 行存在问题，且错误在字符位置\
  \ 1 处发现。在这种情况下，编译器预期一个类型，但它得到了不同的东西——即我们故意放进去的垃圾字符。通过将该行改回来来修复程序。\n\n接下来让我们删掉某些东西——特别是第四行的分号：\n\
  \n```\nprintf(\"Hello World!\\n\")\n```\n\n这给了我们一个不同的错误信息：\n\n```\n$ gcc -o hello\
  \ hello.c\nhello.c: In function 'main':\nhello.c:5:5: error: expected ';' before\
  \ 'return'\n return (0);\n ^\n```\n\n你会注意到编译器在发布错误信息时指向了第 5 行。这是因为虽然我们在第 4 行犯了错，但编译器直到它查看第\
  \ 5 行时才检测到它。\n\n有时前一行的错误可能在一行或多行之后才被检测到，所以不要只看错误信息指定的行，也要看看它上方的内容。\n\n### 理解程序\n\
  \n现在让我们逐行查看程序，看看它在做什么。看第一行：\n\n```\n#include <stdio.h>\n```\n\n为了构建我们的程序，我们使用了随编译器一起的组件——即标准输入/输出（I/O）包。该包中的函数定义在\
  \ `/usr/include/stdio.h` 文件。（Windows 可能使用略不同的目录。）具体来说，我们在程序后部分使用了标准 I/O 函数 `printf`。\n\
  \n接下来，我们定义了程序的起点：\n\n```\nint main()\n```\n\n`main` 名称是特殊的，它表示程序的主体。所有程序都从 `main`\
  \ 开始。之后是一组被大括号括起来的语句：\n\n```\n{\n...\n}\n```\n\n大括号表示 `main` 的主体。换句话说，它们用于分组随后的语句。我们将大括号内的语句缩进了四个空格，但你可以使用任何缩进大小。事实上，C\
  \ 编译器并不关心我们使用多少缩进。\n\n在大括号内部是我们的第一个可执行语句：\n\n```\n printf(\"Hello World!\\n\");\n\
  ```\n\n这告诉程序使用标准 I/O 函数 `printf` 将字符串输出到标准输出（我们的终端）。`\\n` 是字符串中的一个特殊字符。反斜杠\\`被称为`转义字符`。它告诉\
  \ C 随后的字符应该被视为代码。在这种情况下，`n` 告诉 C 输出“换行”，这意味着下一个字符将打印在新的一行。一些常用的转义字符所示于表 1-1](#c01_table_1)。\n\
  \n| 转义字符 | 结果 |\n| --- | --- |\n| `\\n` | 换行（也称为行符）* |\n| `\\t` | 制表符 |\n| `\\\"\
  ` | `\"` |\n| `\\\\` | `\\` |\n| `\\r` | 回车 |\n\n表 1-1：常用转义字符\n\n最后，程序以这条语句结束：\n\
  \n```\n return (0);\n```\n\n这导致程序停止并退出，向操作系统返回退出码 0，表示程序正常终止。非零退出码表示错误。\n\n### 添加注释\n\
  \n到目前为止，我们所看到的代码都是设计为计算机读取并处理的。程序还可以包含注释，编译器看不到它们；相反，它们是为查看程序的人设计的。注释通常以 `/*` 开始，以\
  \ `*/` 结束。例如，以下是一个注释：\n\n```\n/* Hello World – 一个无意义的程序 */\n```\n\n它告诉编写此程序的程序员对该程序的想法。让我们在程序的开头添加一些注释：\n\
  \n```\n/*\n * Hello World -- 不是宇宙中最复杂的程序，\n *      但可以作为一个很好的起点。\n *\n * 用法：\n *\
  \      1\\.运行程序。\n *      2\\.观察世界。\n */\n```\n\n另一种注释风格以 `//` 开始到行尾。当你看到更多程序时，你将能够自己判断哪种更好用。\n\
  \n\n\n\n编写程序时务必为代码添加注释，因为只有在那刻你才清楚自己在做什么。五分钟后，你可能会忘记。五天后，你*会*忘记。例如，我曾需要进行一次复杂的位图转换，以便将光栅图像转换为喷墨打印喷头的发射指令。该变换涉及获取一个水平光栅图像，将行数据转换为喷头所需的列数据，然后由于喷头存在偏移，将数据向左移动以匹配喷头的位置。我写了一整页注释来描述影响发射顺序的每一个因素。然后我又添加了半页\
  \ ASCII 艺术图来绘制我刚才描述的内容。只有在完成这些并确保我完全理解了问题之后，我才编写了代码。因为我为了记录文档而必须整理思路，程序第一次运行就成功了。\n\
  \n在创建书中提出的编程问题的答案时，要养成写注释的习惯。真正优秀的程序员都是注释编写的狂热者。\n\n## 改进程序和构建过程\n\n对于我们的小型“Hello\
  \ World”程序来说，手动编译它并不是问题。但对于一个包含数千个模块的程序，跟踪哪些需要编译、哪些不需要可能非常困难。我们需要自动化这一过程以提高效率并避免人为错误。\n\
  \n在本节中，我们将调整程序以改进它并自动化构建过程。理想情况下，你应该能够使用单个命令且不带带任何参数来构建程序，这表明你有一套一致且精确的构建流程。\n\n\
  ### make 程序\n\n我们的构建过程的一个问题是，每次构建程序时都必须输入编译命令。对于一个包含数千个文件的程序，这将非常枯燥，因为每个文件都需要编译。为了自动化构建过程，我们将使用\
  \ `make` 程序。它接受一个名为 `makefile` 的文件作为输入，该文件告诉 `make` 如何构建程序。\n\n在 macOS 或 Linux 上创建一个名为\
  \ `Makefile` 的文件并包含以下内容：\n\n```\nCFLAGS=-ggdb -Wall -Wextra\n\nall: hello\n\nhello:\
  \ hello.c\n       gcc $(CFLAGS) -o hello hello.c\n```\n\n在 Windows 上，makefile 应该包含以下内容：\n\
  \n```\nCFLAGS=-ggdb -Wall -Wextra\n\nall: hello.exe\n\nhello.exe: hello.c\n    \
  \   gcc $(CFLAGS) -o hello.exe hello.c\n```\n\n缩进行必须以制表符（tab）字符开头，这一点非常重要。使用八个空格是不起的。（糟糕的文件设计，但我们别无选择。）第一行定义了一个宏。由于这个定义，每当我们在\
  \ makefile 中指定 `$(CFLAGS)` 时，`make` 程序就会将其替换为 `-ggdb -Wall -Wextra`。接下来，我们定义了目标\
  \ `all`，它是按照惯例的默认目标。当不带参数运行 `make` 时，它会尝试构建看到的第一个目标。该目标的定义 `all: hello` 告诉 `make`\
  \ 程序：“当你尝试构建 `all` 时，你需要构建 `hello`。”makefile 的最后两行是 `hello`（或 Windows 上的 `hello.exe`）的规范。它们告诉\
  \ `make` 通过执行命令 `gcc $(CFLAGS) -o hello hello.c` 由 `hello.c` 产生 `hello`。该命令包含了我们定义的宏\
  \ `$(CFLAGS)`，它会展开为 `-ggdb -Wall -Wextra`。你会注意到我们在编译中添加了一些额外的标志。我们将在下一节讨论这些标志。\n\
  \n现在让我们使用 `make` 命令来构建程序：\n\n```\n$ make\ngcc -ggdb -Wall -Wextra -o hello hello.c\n\
  ```\n\n如你所见，程序运行了构建执行文件的命令。`make` 程序非常智能。它知道 `hello` 是由 `hello.c` 生成的，因此它会检查这两个文件的修改日期。如果\
  \ `hello` 是新的，则不需要重新编译，所以如果你尝试构建构建程序，将收到以下消息：\n\n```\nmake: Nothing to be done for\
  \ 'all'.\n```\n\n这并不总是正确的行为。如果我们更改了 makefile 中的标志，就意味着改变了编译过程，应该重新构建程序。然而，`make`\
  \ 并不知道这个变化，除非我们编辑了 `hello.c` 并保存文件，或者删除输出文件，否则它不会重新构建程序。\n\n### 编译器标志\n\n`GCC` 编译器有很多选项。事实上，该编译器的选项列表超过了八页。幸运的是，我们不需要担心所有的选项。让我们来看看程序中使用的那些：\n\
  \n1. `-ggdb` 编译程序以便我们进行调试。主要用于向输出文件添加调试信息，允许调试器理解正在发生什么。\n2. `-Wall` 开启一组警告，用于标记正确但可疑的代码。（本书将教你不要编写可疑的代码。）\n\
  3. `-Wextra` 开启额外的警告，力使我们的代码更加精确。\n4. `-o hello` 将程序的输出放在文件 `hello` 中。（Windows 用户的该选项是\
  \ `-o hello.exe`。）\n\n## 编译器的底层工作原理\n\n为了充分利用编译器，你需要了解运行它时背后发生了什么。这是因为当你为嵌入式设备编写软件时，通常需要绕过编译器自动执行的一些操作，这些操作包括：\n\
  \n1. 源代码通过预处理器（preprocessor），它处理所有以 `#` 开头的行，这些行被称为预处理指令（directives）。在我们的程序中，它处理\
  \ `#include` 行。\n2. 编译器本身获取预处理后的源代码并转换为汇编语言（assembly language）代码。C 代码理论上是机器无关的，并且可以做到。\n\
  3. 汇编文件通过汇编器（assembler），将其转换为目标文件（object file）。目标文件只包含我们的代码。\n4. 链接器（linker）获取目标文件中的目标代码，并将其与计算机已存在的有用代码结合（链接）。在这种情况下，就是\
  \ `printf` 函数。\n\n### 预处理器\n\n运行的第一个程序是预处理器，它是一个宏处理器（macro processor，一种自动文本编辑器），负责处理所有以\
  \ `#` 开头的行。在我们的程序中，它处理 `#include` 行。我们可以通过以下命令获取预处理器的输出：\n\n```\n$ gcc -E hello.c\
  \ >hello.i\n```\n\n该命令的输出存储在 `hello.i` 文件中。如果我们查看这个文件，会发现它超过了 850 行。这是因为 `#include\
  \ <stdio.h>` 行导致整个 *stdio.h* 文件被复制到我们的程序中，由于 *stdio.h* 文件又有自己的 `#include` 指令，被 *stdio.h*\
  \ 包含的文件也被复制进来了。\n\n\n\n\n我们需要 `stdio.h` 来使用 `printf` 函数，如果查看 `hello.i`，我们就能找到该函数的定义，它现在被包含在我们的程序中了：\n\
  \n```\nextern int printf (const char *__restrict __format, ...);\n\nextern int sprintf\
  \ (char *__restrict __s,\n      const char *__restrict __format, ...) __attribute__\
  \ ((__nothrow__));\n```\n\n预处理器还会移除所有的注释，并在文本中标记指示正在处理的是哪个文件的信息。\n\n# 编译器\n\n接下来，编译器将\
  \ C 语言代码转换为汇编语言。我们可以通过此命令查看生成的内容：\n\n```\n$ gcc -S hello.c\n```\n\n这应该产生一个以以下行开头的文件：\n\
  \n```\n .file   \"hello.c\"\n        .section        .rodata\n.LC0:\n        .string\
  \ \"Hello World!\"\n```\n\n注意，编译器将 C 字符串 `\"Hello World!\\n\"` 翻译成了汇编语言的 `.string`\
  \ 命令。如果你火眼敏锐，还会注意到 `\\n` 消失了。我们稍后会发现原因。\n\n# 汇编器\n\n汇编语言文件进入汇编器，在那里它被翻译成机器码。`gcc`\
  \ 命令有一个选项 (`-Wa`) 允许我们将标志传递给汇编器。除非你是一个机器，否则无法理解机器码，我们将使用以下命令请求汇编语言列表，以人类可读的格式打印机器码，并带有生成该代码的相应汇编语句：\n\
  \n```\n$ gcc -Wall -Wextra -g -Wextra -Wa,-a=hello.lst -c hello.c\n```\n\n`-Wa`\
  \ 选项告诉 GCC 之后的内容要传递给汇编器。`-a=hello.lst` 选项告诉汇编器生成一个名为 `hello.lst` 的列表。让我们来看这个文件。它的开头如下：\n\
  \n```\n4                            .section        .rodata\n5                 \
  \   .LC0:\n6 0000 48656C6C              .string \"Hello World!\"\n6      6F20776F\n\
  6      726C6421\n6      00\n```\n\n汇编语言在每种机器上都不同。在这个文件中，你看到的是 x86 汇编语言。它看起来可能是一团糟，即使与其他汇编语言相比也是如此。你可能无法完全理解，这没关系；本章应该让你对汇编语言的模样有个初步了解。在后面的章节中，当我们学到\
  \ ARM 处理器时，你会看到一种更理性、更容易理解的汇编语言。\n\n第一列是汇编语言文件的行号。第二列（如果存在）指示所存储数据的地址。所有的计算机内存槽都有一个数值地址。在这种情况下，字符串\
  \ `\"Hello World!\"` 存储在相对于当前使用区域（在本例中为标题为 `.rodata`）的地址 `0000`。当我们下一节讨论链接器时，我们将看到这个相对地址是如何转换为绝对地址的。\n\
  \n下一列包含要以十六进制格式存储在内存中的数值。然后是汇编语言代码本身的文本内容。在文件中，我们可以看到 `.string` 指令告诉汇编器为文本字符串生成代码。\n\
  \n在文件的后面，我们找到了 `main` 的代码：\n\n```\n15 0000 55                    pushq   %rbp\n\
  16                            .cfi_def_cfa_offset 16\n17                       \
  \     .cfi_offset 6, -16\n18 0001 4889E5                movq    %rsp, %rbp\n19 \
  \                           .cfi_def_cfa_register 6\n12:hello.c       ****     printf(\"\
  Hello World!\\n\");\n20                            .loc 1 12 0\n21 0004 BF000000\
  \              movl    $.LC0, %edi\n21      00\n22 0009 E8000000              call\
  \    puts\n22      00\n```\n\n在第 15 行，我们可以看到汇编指令 `55`，它将存储在该区域的 `0` 位置。这条指令对应 `pushq\
  \ %rbp`，它在过程开始时执行一些记录工作。还要注意某些机器指令是 1 字节长，而另一些长 5 字节。第 21 行的指令就是一个 5 字节指令。你可以看到这条指令正在对\
  \ `.LC0` 操作。如果我们查看列表的顶部，可以看到 `.LC0` 就是我们的字符串。\n\n作为一名 C 程序员，并不要求你完全理解汇编语言在做什么。完全理解需要吸收几千页的参考资料。但我们可以某种程度上理解第\
  \ 22 行的指令，它调用了函数 `puts`。这里就变得有趣了。记住我们的 C 程序并没有调用 `puts`——它调用的是 `printf`。\n\n似乎我们的代码在背后被优化了。在嵌入式编程中，“优化”可能是一个带有贬义的词，所以理解这里发生了什么非常重要。基本上，C\
  \ 编译器查看 `printf(\"Hello World!\\n\");` 这一行，并决定它与以下内容相同：\n\n```\nputs(\"Hello World!\"\
  );\n```\n\n事实上，这些函数并不是完全相同的：`puts` 是一个简单高效的函数，而 `printf` 则很大。汇编器的输出是一个包含代码的对象文件。\n\
  \n# 链接器\n\n我们的对象文件和 `libc` 的部分需要合并。链接器的工作是获取所需的文件、合并它们并为每个文件分配真实的内存地址。就像我们对汇编器做的那样，我们可以通过此命令让\
  \ `gcc` 将标志传递给链接器：\n\n```\n$ gcc -Wall -Wextra -static -Wl,-Map=hello.map -o hello.o\n\
  ```\n\n`-Wl` 告诉 GCC 将后面的选项 (`-Map=hello.map`) 传递给链接器。map 文件告诉我们链接器将东西放在内存的哪里。（稍后介绍。）我们还加入了\
  \ `-static` 指令，这会将执行文件从动态链接改为静态链接，这样内存映射就像我们在嵌入式系统中看到的那样。这样就可以避免讨论动态链接。\n\n像 `hello.o`\
  \ 这样的对象文件是可重定位的。也就是说，它们可以位于内存的任何地方。链接器的工作就是决定它们的位置。链接器的工作还遍历程序使用的库，提取任何对象文件并将其包含在最终程序中。链接映射告诉我们东西去了。例如，一个典型的链接项可能如下：\n\
  \n```\n .text          0x000000000040fa90      0x1c8 /usr/lib/gcc/x86_64-linux-gnu/5/../../../x86_64-linux-gnu/libc.a(ioputs.o)\n\
  \                0x000000000040fa90                puts\n                0x000000000040fa90\
  \                _IO_puts\n *fill*         0x000000000040fc58        0x8\n```\n\n\
  记住，我们并没有写过 `puts`，尽管它出现在这个链接项中。正如前面提到的，它来自标准 C 库文件 (*libc.a*)。我们在这里可以看到该函数的代码位于\
  \ `0x000000000040fa90`。如果，例如我们的程序在 `0x40fa90` 到 `0x40fc58` 之间崩溃了，这些信息可能非常有用。\n\n\
  \n\n\n我们也知道 `puts` 占据了 `0x1c8` 字节（`40fc58–40fa90`）。这是 456 个十进制字节，或者略小于 0.5K。当我们开始为内存有限的微处理器编程时，内存量将成为我们关注的问题。\n\
  \n现在你应该对 C 程序的每个元素以及这些各个部分的作用有了良好的了解。在大多数情况下，你可以让编译器来处理这些细节，而无必担心底层发生了什么。但当你正在为资源有限的小型芯片编程时，你确实需要担心内部发生了什么。\n\
  \n## 向你的 Makefile 中添加内容\n\n通过修改你的 makefile 来生成上一节中描述的所有文件，亲自探索 GCC 编译器、汇编器和链接器的各个方面：\n\
  \n```\nCFLAGS=-Wall -Wextra -ggdb\n\nall: hello hello.i hello.s\n\nhello.o: hello.c\n\
  \        gcc $(CFLAGS) -Wa,-a=hello.lst -c hello.c\n\nhello: hello.o\n        gcc\
  \ $(CFLAGS) -static -Wl,-Map=hello.map -o hello hello.o\n\nhello.i: hello.c\n  \
  \      gcc -E hello.c >hello.i\n\nhello.s: hello.c\n        gcc -S hello.c\n\n##\
  \ 输入 \"make verbose\" 以查看整个命令行信息\nverbose:\n        gcc -v $(CFLAGS) -Wextra -c\
  \ hello.c\n\nclean:\n        rm -f hello hello.i hello.s hello.o\n```\n\n如之前所述，第一个非空行定义了一个宏，它告诉\
  \ `make` 在文件的其余部分将 `$(CFLAGS)` 替换为 `-Wall -Wextra -ggdb`。接下来，我们定义了一个名为 `all` 的目标（一个需要构建的项目）。由于这是文件中的第一个目标，它它也是默认目标，这意味着你只需要通过输入以下命令就可以构建它：\n\
  \n```bash\n$ make\n```\n\n这个目标就是我们所说的“伪目标”（phony target），因为它不会生成一个名为 `all` 的文件。相反，每当你执行\
  \ `make all` 命令时，`make` 都会检查它是否需要重新创建它的依赖项。你可以在 makefile 中关键字 `all` 和冒号之后列出这些依赖项。为了构建\
  \ `all` 目标，我们需要构建目标 `hello`、`hello.i` 和 `hello.s`。以下几行说明了如何构建这些目标。例如，为了构建 `hello.i`\
  \ 目标，我们必须使用目标 `hello.c`。如果 `hello.i` 比 `hello.c` 新，则 `make` 将什么都不做。如果 `hello.c`\
  \ 发生了最近更改且 `hello.i` 不是最新版本，`make` 将使用以下命令生成 `hello.i`：\n\n```bash\ngcc -E hello.c\
  \ >hello.i\n```\n\n因此，如果你编辑了 `hello.c` 然后执行命令 `make hello.i`，你会看到 `make` 执行了它的工作：\n\
  \n```bash\n$ (修改 hello.c)\n$ make hello.i\ngcc -E hello.c > hello.i\n```\n\n我们 makefile\
  \ 中的另一个目标 `clean` 会删除所有生成的文件。要删除生成的文件，请执行以下命令：\n\n```bash\n$ make clean\n```\n\n\
  GNU `make` 是一个非常复杂的程序，其手册超过 300 页。好消息是，你只需要处理其中极小一部分部分的命令就能高效工作。\n\n## 总结\n\n编写一个“Hello\
  \ World”程序是 C 程序员能做的最简单的事情之一。然而，理解创建和运行该 C 程序在背后发生的所有事情要稍微困难一些。幸运的是，你不需要成为专家。虽然你不需要掌握程序生成的每一位汇编语言，但任何嵌入式程序员都应该具备足够的知识来识别潜在问题或异常行为，例如在调用\
  \ `printf` 的程序中出现 `puts`。关注这些细节将允许我们充分利用这些小型机器的性能。\n\n## 问题\n\n1. GNU `make` 的文档位于哪里？\n\
  2. C 代码在不同类型的机器之间是移植的吗？\n3. 汇编语言代码在不同类型的机器之间是移植的吗？\n4. 为什么汇编代码中的单条语句只生成一条机器指令，而\
  \ C 语言中的一条语句可以生成多条？\n\n# 2 集成开发环境简介\n\n![](img/chapterart.png)\n\n到为止，我们使用了单独的工具（如\
  \ GCC、`make` 和文本编辑器）来构建我们的程序。这让你能够看到每个工具的作用，并学习软件开发的细节。现在你将学习使用集成开发环境（IDE）。IDE 是一种程序，旨在将所有这些工具（以及其他工具）隐藏在一个集成的界面之后。\n\
  \n这种方法的主要优点是你可以使用一个基于 GUI 的工具完成所有工作。主要的缺点是，只有当你按照 IDE 预期的方式行为时，它才有效。此外，它向你隐藏了大量内容。例如，为了获取链接器\
  \ map，你必须经过几层 GUI 并在模糊的自定义框中输入 map 选项。\n\n我们在书中将使用的 IDE 是用于 STM32 的 System Workbench。从它的名字可以看出，它是为\
  \ STM32 微处理器创建的。它是一个非常流行的 IDE —— Eclipse 的增强版，包含了编辑器、调试器和编译器。它在调试方面特别强大。\n\n## 使用\
  \ System Workbench for STM32\n\n到为止，我们使用了文本编辑器、一个名为 `GCC` 的编译器以及一个名为 `make` 的程序来运行编译器。随着我们进入更复杂的程序，我们还需要一个调试器。\n\
  \nSTM32 Workbench 将所有这些工具整合在一个基于 Eclipse IDE 构建的集成开发环境中。事实上，它就是 Eclipse 加上了许多 STM32\
  \ 的功能，我在后续讨论中将这样称呼它。我们将在第 3 章深入探讨 STM32 相关的内容。现在，让我们通过编写一个“Hello World”程序来探索 IDE。\n\
  \n### 启动 IDE\n\n如果你遵循了第 1 章开头的建议，已经下载了 System Workbench for STM32。按照网站上的说明进行安装。标准安装会创建一个桌面图标和一个启动菜单项，因此你应该能够像启动其他程序一样启动\
  \ IDE。\n\n第一次启动时，Eclipse 会询问你的工作空间（workspace）位置。输入包含本书所有项目的目录。接下来 Eclipse 应该会显示欢迎界面。点击关闭图标（标签页旁边的小\
  \ X）关闭该屏幕。\n\n应该会弹出一个窗口，指示系统正在为 ARM 处理器下载额外的工具。当系统完成后，你应该得到一个空项目的 C/C++ 视图，如图 2-1\n\
  \n图 2-1：空项目屏幕\n\nEclipse 是许多工具的前端。以组织的方式显示它们是一个巨大的挑战。为了应对这个问题，Eclipse 使用了“视图”（views）的概念*视图*是一个为特定任务设计的窗口布局。例如，Java\
  \ 程序员的视图可能与 C 程序员不同。同样，调试需要的视图与编码不同。\n\n\n\n此版本的 Eclipse 默认视图是 C/C++ 项目视图。（你可以随时通过\
  \ `Window▶View` 菜单更改视图。）视图的左侧是 `Project Explorer`（项目管理器，目前为空），它允许你查看项目及其详细信息。中间是一个文本编辑器。右侧是一个带有三个标签的窗口：`Outline`（大纲）、`Build\
  \ Targets`（构建目标）和 `Task List`（任务列表）。我们在更复杂的项目时会详细介绍它们。\n\n底部是一个宽宽的小窗口，带有 `Problems`（问题）、`Tasks`（任务）、`Console`（控制台）、`Properties`（属性）和\
  \ `Call Graph`（调用图）标签。`Problems`窗口包含当前项目代码生成的错误和警告列表。`Console`窗口包含构建过程的输出。其他标签在我们开始生成更复杂的程序时再考虑。\n\
  \n### 创建 Hello World\n\n现在我们将创建另一个“Hello World”项目。每当你创建一个原生 C 项目时，都必须采取某些步骤（原生意味着程序在编译它的机器上运行；如果你在一台机器上编译并在另一台机器上运行，这被称为交叉编译），本章将详细介绍这些步骤。你将经常执行这些步骤；为了不需要记住所有它们，请参考附录中的清单。\n\
  \n从菜单栏选择 `File▶New▶C Project` 开始一个新项目。这将调出 `C Project` 对话框。\n\n我为我们的项目选择了名称 `02.hello-ide`，因为它是唯一且具有描述性的。项目名称可以包含任何字符，空格和特殊字符，例如斜杠\
  \ (`/`)）、反斜杠 (`\\`）、冒号 (`:`）以及对你的文件系统具有特殊意义的字符。字母、数字、连字符、点和下划线都是的。\n\n对于项目类型，选择\
  \ `Hello World ANSI C Project`。对于工具链，选择适用于你操作系统的工具链，如图 2-2 所示。点击**Next**。\n\n![f02002](img/f02002.png)\n\
  \n图 2-2：项目创建对话框\n\n现在我们看到了 `Basic Settings`（基本设置）对话框。保持这些设置不变并点击**Next**。\n\n下一个对话框是\
  \ `Select Configurations`（选择配置）（参见图 2-3）。\n\n![f02003](img/f02003.png)\n\n图 2-3：选择配置对话框\n\
  \n构建项目有许多不同的选项。Eclipse 将这些分组为项目配置。默认定义的两个是 `Release` 和 `Debug`。`Release` 生成高度优化的代码，很难甚至无法进行调试。`Debug`\
  \ 生成未优化的、易于调试的代码并生成调试符号。由于你正在学习，我们将坚持使用 `Debug` 配置。取消 `Release` 配置，只保留 `Debug` 选中，并点击**Finish**。\n\
  \nIDE 创建了我们的项目并生成了许多文件。其中之一是我们的源代码，已经填充了该版本的“Hello World”程序（参见图 2-4）。\n\n![f02004](img/f02004.png)\n\
