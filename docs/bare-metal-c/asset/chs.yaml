  \ `Debug` 目录。\n    3. 选择你程序的可执行文件。\n    4. 点击 `OK`。\n10. 回到 `Create, Manage, and\
  \ Run Configurations` 窗口中：\n    1. 点击 `Apply`。\n    2. 点击 `Close`。\n\n你现在可以运行并调试你的程序了。\n\
