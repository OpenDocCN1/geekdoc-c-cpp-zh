    (OpenSuse)  or  /usr/lib/cgi-bin  (Ubuntu).  You  can  run  this  from  the  terminal  where  you  compiled  it  with  ./hello4  and  you  will  see  a  long  list  of  environment  variables.  In  the  browser  when  you  enter  http://  localhost/cgi-bin/hello4
    you will a different set  altogether.


    ![](images/00010.jpeg)


    ![](images/00011.jpeg)


    We will soon find out thatQUERY_STRINGis an important environment variable for
    using communicating  with  our  program  and  in  this  case  we  see  it  has  a  value  of
    “Cerberus+” or  everything  after  the  “?”  in the  URL  we  typed.  It  is  a  valid  way  to  send  information  to  a  common  gateway  interface  (CGI)  program
    like hello4 but we should restrict this to just one string. In our case we have
    used a “+” to join up  two strings. If we typed: “Cerberus” the browser would
    translate this so we would  see:


    QUERY_STRING=Cerberus%20


    We  will  learn  later  how  complex  sets  of  input  values  can  be  transmitted  to  our  programs.


    1.5 Hello World  conclusion


    We have  seen  that  a  simple  program  with  a  tiny  bit  of  input  and  some  output  is  in  fact  extremely  powerful  in
    that it reveals and exposes the inner workings of a great deal of our computer.


    Even though we have just begun we have encountered many of the key concepts we
    will use over  and over  again:


    • functions and  arguments


    • Numbers (integers) and character strings as data  types


    • Lists or  arrays


    • Loops using “for” and  “while”


    We  have  made  a  deliberate  big  leap  from  writing  a  program  that  runs  simply  in  a  “terminal  screen”  to
    one which will be visible over the internet in a  browser.


    The  reason  for  this  is  that  the  process  of  writing  programs  that  interact  with  users  in  windowing  systems
    like  Windows,  Gnome  or  KDE  is  extremely  complex  and  not  something  you  will  be  asked  very  often  to  do.


    The  internet  browser  has  become  the  de  facto  interface  mode  for  almost  everything  we  do  these  days
    so we might as well understand using it from the  start.


    In  all  the  successive  chapters  we  will  follow  this  model:  starting  off  with  some  basic  technique  then
    applying it to a web-based  system.


    In  practice  there  is  not  much  real-world  C  common  gateway  interface  programming  going  on  but  there
    is  a  great  deal  of  C  and  C++  based  code  running  as  Apache  modules  and  Microsoft  IIS  ISAPI  Dlls.
    Perhaps  not  many  know  that  much  of  Ebay  is  written  in  C  /  C++.


    Why? It is as fast as things get and their business with the bargain snipers in
    a global real-time  market needs this lightning fast core, so there is no other
    way to get that performance.


    2 Data and  Memory


    2.1 Simple data  types?


    When we write programs we have to make decisions or assertions about the nature
    of the world as  we declare  and  describe  variables  to  represent  the  kinds  of  things  we  want  to  include  in  our  information
    processing.


    This process is deeply philosophical; we makeontologicalassertions that this or
    that thing exists  and we makeepistemologicalassertions when we select particular
    data types or collections of data  types to  use  to  describe  the  attributes  of  these  things.  Heavy  stuff  with  a  great  responsibility  and  not  to  be
    lightly  undertaken.


    As a practical example we might declare something that looks like the beginnings
    of a database  record for geography.


    ![](images/00012.jpeg)


    Here we are doing the  following:


    - asserting that all the character strings we will ever encounter in this application
    will be  255 limited  to  characters  so  we  define  this  with  a  preprocessor  statement  –  these  start  with  #.


    - assert that towns are associated with counties, and counties are associated
    with  countries some hierarchical  manner.


    - assert that the population is counted in whole numbers – no  half-people.


    - assert  the  location  is  to  be  recorded  in  a  particular  variant  (WGS84)  of  the  convention  of  describing
    spots on the surface of the world in latitude and longitude that uses a  decimal
    fraction for degrees, minutes, and  seconds.


    Each  of  these  statements  allocates  memory  within  the  scope  of  the  function  in  which  it  is  declared.  Each
    data  declaration  will  occupy  an  amount  of  memory  in  bytes  and  give  that  bit  of  memory  a  label  which
    is thevariable name. Each data type has a specified size and thesize of ()library
    function will  return this as an integer. In this case 3 × 256 characters, one
    integer, and two floats. The exact size is  machine dependent but probably it
    is 780  bytes.


    Outside  the  function  in  which  the  data  has  been  declared  this  data  is  inaccessible  –  this  is  the  scope
    of  declaration.  If  we  had  declared  outside  the  main ()  function  it  would  be  global  in  scope  and  other
    functions could access it. C lets you do this kind of dangerous stuff if you want
    to, so be careful.


    Generally,  we  keep  a  close  eye  on  the  scope  of  data,  and  pass  either  read-only  copies,  or  labelled  memory
    addresses  to  our  data  to  parts  of  the  programs  that  might  need  to  do  work  on  it  and  even  change  it.
    These  labelled  memory  addresses  are  called  pointers.


    We are using for output theprintffamily of library functions (sprintffor creating
    strings,fprintf  for writing to files etc.) which all use a commonformat stringargument
    to specify how the data is to  be represented.


    - %c  character


    - %s  string


    - %d  integer


    - %f floating point number  etc.


    The  remaining  series  of  variables  in  the  arguments  are  placed  in  sequence  into  the  format  string  as
    specified.


    In  C  it  is  a  good  idea  to  intialise  any  data  you  declare  as  the  contents  of  the  memory  allocated  for  them
    is not cleared but may contain any old  rubbish.


    Compile  with:  gcc  -o  data1  chapter2_1.c  -lc


    Output of the program when called with :  ./data1


    Town  name:  Guildford  population:66773 County:  Surrey


    Country:  Great  Britain


    Location  latitude:  51.238598  longitude:  -0.566257 char = 1 byte int = 4 bytes
    float = 4  bytes memory  used:780  bytes


    ![](images/00013.jpeg)


    2.2 What is a  string?


    Some  programming  languages  like  Java  and  C++  have  a  string  data  type  that  hides  some  of  the  complexity
    underneath what might seem a simple thing.


    An  essential  attribute  of  a  character  string  is  that  it  is  a  series  of  individual  character  elements  of
    indeterminate  length.


    Most  of  the  individual  characters  we  can  type  into  a  keyboard  are  represented  by  simple  numerical  ASCII
    codes and the C data typecharis used to store character data.


    Strings  are  stored  as  arrays  of  characters  ending  with  a  NULL  so  an  array  must  be  large  enough  to  hold
    the sequence of characters plus one. Remember array members are always counted
    from  zero.


    In  this  example  we  can  see  5  individual  characters  declared  and  initialised  with  values,  and  an  empty
    character array set to  “”.


    Take  care  to  notice  the  difference  between  single  quote  marks  ‘  used  around  characters  and  double  quote
    marks “ used around character  strings.


    ![](images/00014.jpeg)


    Compile  with:  gcc  -o  data2  chapter2_2.c  -lc


    Output of the program when called with :  ./data2


    Cerberus


    ## 2.3 What can a string “mean”


    Anything  at  all  –  name  given  to  a  variable  and  its  meaning  or  its  use  is  entirely  in  the  mind  of  the
    beholder. Try  this


    ![](images/00015.jpeg)


    Compile  with:  gcc  -o  data3  chapter2_3.c  -lc


