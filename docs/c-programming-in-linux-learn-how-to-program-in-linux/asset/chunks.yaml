    ![](images/00061.jpeg)


    C Programming in Linux: Learn how to program in Linux


                           Alif Al Emran


    Setting up your  System


    This book presumes you are using the  Linux operating system with either a  KDE
    or  Gnome desktop.  Specific  set-up instructions for common architectures are
    at [http://www.ubiubi.org/CProgrammingInLinux/](http://www.ubiubi.org/CProgrammingInLinux/)


    If you are using the KDE desktop you will have Konqueror or Dolphin as the File
    Manager and kate  or kedit for an  editor


    In Gnome you would probably use Nautilus and  gedit


    You  need  to  be  familiar  with  the  idea  of  doing  some  things  as  “super  user”  so  that  you  have  access
    permission  to  copy  or  edit  certain  files.  This  is  normally  done  by  prefacing  the  Linux  command  with
    “sudo” and providing the password, as in this  example:


    “sudo cp hello3  /srv/www/cgi-bin/hello3”


    which copies the file “hello3” to the area where the Apache server locates common
    gateway  interface or cgi  programs.


    In KDE “kdesu konqueror” would open a file manager as super  user.


    ![](images/00001.jpeg)In Gnome “gnomesu nautilus” would open a file manager as
    super  user.  You will need to have installed the following  packages:


    Throughout  the  text  you  will  see  references  to  the  folder  cgi-bin.  The  location  of  this  will  vary  between
    Linux distributions. By default, this folder used for web programs  is:


    OpenSuse:             /srv/www/cgi-bin


    Ubuntu:             /usr/lib/cgi-bin


    To  place  programs  there  you  need  superuser  rights,  so  it  may  be  better  to  create  a  folder  inside  your
    own home/*****/public_html/cgi-bin directory and change theScriptAliasand associated  Directory
    references inside the Apache configuration files (OpenSuse)/etc/apache2/default-server.conf  or
    (Ubuntu)  /etc/apache2/sites-available/default.


    1 Hello  World


    1.1 Hello Program  1


    Using  the  File  Manager  (in  KDE,  Konqueror  or  in  Gnome,  Nautilus)  create  a  new  directory  somewhere  in
    your home directory called something appropriate for all the examples in this
    book,  perhaps “Programming_In_Linux” without any spaces in the  name.


    Open  an  editor  (in  KDE,  kate,  or  in  Gnome,  gedit)  and  type  in  (or  copy  from  the  supplied  source  code  zip
    bundle) the  following:


    ![](images/00002.jpeg)


    Save  the  text  as  chapter1_1.c  in  the  new  folder  you  created  in  your  home  directory.


    Open  a  terminal  window  and  type:  gcc  -o  hello  chapter1_1.c


    to compile the program into a form that can be executed.


    Now  type  “ls  -l”  to  list  the  details  of  all  the  files  in  this  directory.  You  should  see  that  chapter1_2.c  is
    there and a file called “hello” which is the compiled C program you have just  written.


    Now  type:  ./hello


    to  execute,  or  run  the  program  and  it  should  return  the  text:  “Hello  you  are  learning  C!!”.


    If this worked, congratulations, you are now a  programmer!


    ##### ![](images/00003.jpeg)Anatomy of the  program:


    The part inside  /***              ***/ is a comment and is not compiled but just
    for information  and reference.


    The "#include..." part tells the compiler which system libraries are needed and
    which header  files are being referenced by this program.  In our case "printf"
    is used and this is defined in  the stdio.h  header.


    The "int main(int argc, char *argv[])" part is the start of the actual program.
    This is an  entry- point and most C programs have a main  function.


    The "int argc" is an argument to the function "main" which is an integer count
    of the number  of character string arguments passed in "char *argv[]" (a list
    of pointers to character strings)  that might be passed at the command line when
    we run  it.


    A pointer to some thing is a name given to a memory address for this kind of data
    type. We  can have a pointer to an integer: int *iptr, or a floating point number:
    float *fPtr. Any list of things  is described by [], and if we know exactly how
    big this list is we might declare it as [200]. In  this case we know that the
    second argument is a list of pointers to character  strings.


    Everything else in the curly brackets is the main function and in this case the
    entire  program expressed as  lines.


    Each line or statement end with a semi-colon  ";".


    We have function calls like "printf(...)" which is a call to the standard input
    / output  library defined in the header file  stdio.h.


    At the end of the program "return 0" ends the program by returning a zero to the  system.


    Return values are often used to indicate the success or status should the program
    not  run correctly.


    1.2 Hello Program  2


    Taking  this  example  a  stage  further,  examine  the  start  of  the  program  at  the  declaration  of  the  entry
    point function: int main(int argc, char  *argv[])


    In plain English this  means:


    The  function  called  “main”,  which  returns  an  integer,  takes  two  arguments,  an  integer  called  “argc”
    which is a count of the number of command arguments then *argv[] which is a list
    or array of  pointers to strings which are the actual arguments typed in when
    you run the program from the command line.


    ![](images/00004.jpeg)


    Let’s  rewrite  the  program  to  see  what  all  this  means  before  we  start  to  panic.


    ![](images/00005.jpeg)


    Save  the  text  as  chapter1_2.c  in  the  same  folder.


    Open a terminal window and  type:


    gcc  -o  hello2  chapter1_2.c  to  compile  the  program  into  a  form  that  can  be  executed.


    Now  type  ls  -l  to  list  the  details  of  all  the  files  in  this  directory.  You  should  see  that  chapter1_2.c  is  there
    and a file calledhello2which is the compiled C program you have just  written.


    Now  type  ./hello2  to  execute,  or  run  the  program  and  it  should  return  the  text:


    Hello,  you  are  still  learning  C!!


    Number  of  arguments  to  the  main  function:1 argument number 0 is  ./hello2


    We  can  see  that  the  name  of  the  program  itself  is  counted  as  a  command  line  argument  and  that  the  counting
    of things in the list or array of arguments starts at zero not at one.


    Now  type  ./hello2  my  name  is  Cerberus  to  execute  the  program  and  it  should  return  the  text:


    Hello,  you  are  still  learning  C!!


    Number  of  arguments  to  the  main  function:5 argument number 0 is  ./hello2


    argument number 1 is  my  argument number 2 is  name  argument number 3 is  is
    argument number 4 is  Cerberus


    So,  what  is  happening  here?  It  seems  we  are  reading  back  each  of  the  character  strings  (words)  that  were
    typed in to run the program.


    ![](images/00006.jpeg)


    1.3 Hello Program  3


    Let’s get real and run this in a web page. Make the extra change adding the first
    output print  statement “Content-type:text/plain\n\n”  which  tells  our  server  what  kind  of  MIME  type  is  going  to  be  transmitted.


    Compile  using  gcc  -o  hello3  chapter1_3.c  and  copy  the  compiled  file  hello3  to  your  public_html/cgi-bin
    directory (or on your own machine as superuser copy the program to /srv/www/cgi-bin
    (OpenSuse) or


    /usr/lib/cgi-bin (Ubuntu)).


    ![](images/00007.jpeg)


    Open  a  web  browser  and  type  in  the  URL  [http://localhost/cgi-bin/hello3?Cerberus+](http://localhost/cgi-bin/hello3?david%2Bhaskins)
    and  you  should see that web content can be generated by a C program.


    ![](images/00008.jpeg)


    1.4 Hello Program  4


    A seldom documented feature of the function signature for “main” is that it can
    takethree  arguments and the last one we will now look at is char *env[ ] which
    is also a list of pointers to strings, but in  this case  these  are  the  system  environment  variables  available  to  the  program  at  the  time  it  is  run


    ![](images/00009.jpeg)'
