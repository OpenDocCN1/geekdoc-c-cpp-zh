- fmt: "\n关于 Apache 模块的简明清晰的资料很少，但可以从在线文档开始：[http://httpd.apache.org/docs/2.2/developer/](http://httpd.apache.org/docs/2.2/developer/)\n\
    \n近期值得一看的书是《The Apache Modules Book》，作者 Nick Kew，Prentice Hall 出版。\n\n## The Ghost\
    \ 项目\n\n### PHP网站生成器项目\n\n能够用`C`编写简短程序来自动完成繁琐的任务，或做那些原本需要花费数小时摆弄笨拙工具（如邮件合并）的事情——这是你学会后最开心的事之一。本项目正是此类省时利器：**Ghost**是一个轻量级PHP生成器，供你定制使用。\n\
    \n如果你发现自己一直在构建PHP网站，那么一种能一步到位地生成所有参数传递、解码、表单构建和数据库管理代码的方法将会非常有用。像 Ruby on Rails\
    \ 这样的工具提供了类似功能搭建配置却复杂得多运行环境也更多变且需要再学一门语言才能继续深入研究开发过程吧？并且始终还是必须学习另一种新编程语言的麻烦来作为更深入的起点方可迈步向前推进工作进度同时你也得掌握另一门新的脚本语法才行不通路径也不一样呀！不过最好是从编译运行本工具有个更好办法入手即可快速上手使用起来呢现在就动手试试将ghost.zip源码解压到你的public_html文件夹中创建出叫做ghost的子目录内容位于该位置内包含Makefile文件里面有目标g1这个选项用于编译链接连接整个工程的所有元素整体打包形成完整可执行版本所以切换到public_html\
