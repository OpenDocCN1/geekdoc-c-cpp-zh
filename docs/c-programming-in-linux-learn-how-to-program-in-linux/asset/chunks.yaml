  raw: "This encoding occurs because certain characters are explicitly used in the\
    \ transmission protocol  itself. The&for example is used to separate portions\
    \ of the QUERY_STRING and the space cannot be  sent at all as it  is.\n\nAny \
    \ program  wishing  to  use  information  from  the  HTML  form  must  be  able\
    \  to  decode  all  this  stuff which will now attempt to  do.\n\nThe program\
    \ chapter4_2.c accomplishes what we see so far. It has a main function and a \
    \ decode_value function all in the same  file.\n\nThe decode_value function takes\
    \ three  arguments:\n\nthe name of the value we are looking for “ITEM1=” or  “ITEM2=”.\n\
    \nthe address of the variable into which we are going to put the value if  found\
    \ the maximum number of characters to copy\n\nThe  function  looks  for  the \
    \ start  and  end  positions  in  the  QUERY_STRING  of  the  value  and  then\
    \  copies the characters found one by one to the value variable, adding a NULL\
    \ charcter to terminate the string.\n\n![](images/00037.jpeg)\n\nIt  looks  like\
    \  we  are  going  to  have  to  do  some  serious  work  on  this  decode_value\
    \  package  so  as  this  is work  we  can  expect  to  do  over  and  over  again\
    \  it  makes  sense  to  write  a  function  that  can  be  reused.\n\nFirst off\
    \ we can put this function into a separate file calleddecode_value.cand create\
    \ a file for all  the functions  we  may  write  called  c_in_linux.h  and  compile\
    \  all  this  into  a  library.  In  the  Make  file  we  can  add:\n\n![](images/00038.jpeg)\n\
    \nThis looks horrible and complex but all it means is  this: typing “make all”\
    \  will:\n\ncompile  all  the  *.c  files  listed  in  the  list  OBJ_SRC  and\
    \  into  object  files  *.o compile all the object files into a library archive\
    \ called  lib_c_in_linux.a compile 4-4 using this new  archive.\n\nThis  is  the\
    \  model  we  will  use  to  keep  our  files  as  small  as  possible  and  the\
    \  share-ability  of  code  at  its maximum.\n\nWe can now have a simpler “main”\
    \ function file, and files for stuff we might want to write as  call-able functions\
    \  from  anywhere  really  which  we  do  not  yet  know  about.  All  this  is\
    \  organized  into  a  library file  (*.a  for  archive)  –  these  can  also\
    \  be  compiled  as  dynamically  loadable  shared  objects  *.so  which  are\
    \ much  like  Windows  DLLs.  This  exactly  how  all  Linux  software  is  written\
    \  and  delivered.\n\nFor example, the MySQL C Application Programmers Interface\
    \ (API)  comprises: all the header files in  /usr/include/mysql\n\nthe library\
    \ file  /usr/lib/mysql/libmysqlclient.a\n\nWhat  we  are  doing  really  is  how\
    \  all  of  Linux  is  put  together  –  we  are  simply  adding  to  it  in \
    \ the same  way.\n\nOur  main  file  now  looks  like  this:\n\n![](images/00039.jpeg)\n\
    \nThis code calls the function decode value in the same way but because the library,c_in_linux.a\
    \  was linked  in  when  it  was  compiled  and  as  it  has  access  to  the\
    \  header  file  c_in_linux.h  that  lists  all  the functions in the library\
    \ it all works  properly.\n\nTry  to  describe  the  process  in  pseudocode \
    \ of  decoding  this  QUERY  STRING:\n\nget  the  QUERY_STRING\n\nfind the search\
    \ string “ITEM1=” inside  it look for the end of the value of  “ITEM1=”\n\ncopy\
    \ the value to our “value” variable, translating funny codes such  as:\n\n%21\
    \  is  !  %23  is  #\n\nThese special codes are generated by the browser so that\
    \ whatever you put in an HTML form will get safely  transmitted  and  not  mess\
    \  about  with  the  HTTP  protocol.  There  are  lot  of  them  and  the  task\
    \  for this  chapter  is  to  finish  this  task  off  so  that  EVERY  key  on\
    \  your  keyboard  works  as  you  think  it  should!!\n\nProgram  chapter4_3.c\
    \  calls  this  unfinished  function  decode value  which  this  far  can  only\
    \  cope  with  the space  character  and  !  –  it  uses  if  and  else  and \
    \ for  and  the  library  function  getenv,  strcpy,  strlen,  ststr in a piece\
    \ ofconditional logicin which a string is analyzed to find a specific item and\
    \ this thing  then copied into a piece of memory calledvaluewhich has been passed\
    \ to  it.\n\nThe result shows the decoded value pasted into the first  field;\n\
    \n![](images/00040.jpeg)\n\n![](images/00041.jpeg)\n\n## 4.3 Logic, loops and\
    \ flow  conclusion\n\nThe most important part of controlling the flow of your\
    \ program is to have a clear idea about what it  is you  are  trying  to  do.\
    \  We  have  also  learned  to  break  our  code  up  into  manageable  lumps,\
    \  and  started  to  build and use a library and header file of our  own.\n\n\
    Being able to express a process in normal words orpseudocodeis useful and helps\
    \ you to break  the code into  steps.\n\nUsefor loopsto explicitly count through\
    \ things you know have an ending  point. Use  while  and  do…while  loops  to\
    \  do  things  until  some  condition  changes.\n\nUseswitchstatements to when\
    \ integers or single characters determine what happens  next. Use  if  and  else\
    \  if  and  else  when  mutually  exclusive  things  can  be  tested  in  a  sequence.\n\
    \nComplex sets ofifandelseand not (!) conditionals can end up  unreadable. Use\
    \ braces ({ }) to break it all up into chunks.\n\n##### Exercise:\n\nA  useful\
    \  task  now  would  be  to  complete  the  function  decode value  so  you  have\
    \  a  useful  tool  to  grab web content from HTML forms decoding all the non\
    \ alpha-numeric keys on your keyboard.\n\nYou will use this exercise again and\
    \ again so it is worth getting it  right.\n\n# 5 Database handling with  MySQL\n\
    \n## 5.1 On not reinventing the  wheel\n\nIt  is  pretty  sensible  to  not  start\
    \  from  scratch  at  every  project  so  we  build  on  work  done  by  others\
    \  who came  this  way.  All  of  the  C  libraries  we  are  using  were  written\
    \  by  someone  from  even  lower  level  bits  and pieces  and  we  can  access\
    \  and  modify  this  code  should  we  want  to.  This  is  what  Open  Systems\
    \  is  all  about. In  practice  we  simply  want  to  use  reliable  services,\
    \  and  the  first  two  we  are  going  to  use  are  ubiquitous  – databases\
    \ access and graphical image  generation.\n\n## 5.2 MySQL C  API\n\nTo  access\
    \  the  set  of  MySQL  functions  we  make  sure  our  compiler  can  access\
    \  the  header  and  libraries  of MySQL and simply call some mysql functions\
    \ we have not had to write  ourselves.\n\nIn  this  next  example  we  join  the\
    \  database  code  onto  the  last  work  we  did  and  insert  the  decoded \
    \ data into a database, and read out what we have stored there so far.\n\nIn a\
    \ new terminal window, we  type:\n\nthen:\n\n##### \n\nmysql  test\n\n##### create\
    \ table CIL (ITEM1 varchar(255),ITEM2  varchar(255));\n\nThis  creates  a  table\
    \  for  the  program  to  write  to  in  the  test  database  that  should  already\
    \  be  created  in your MySQL  setup.\n\nIt looks like this if it all works out\
    \  OK.\n\n![](images/00042.jpeg)\n\nThe data types declaredMYSQL,MYSQL_RES, andMYSQL_ROWarepreprocessor\
    \ definitions  that  stand for more complex C declarations in mysql.h and all\
    \ we need to know is how to call  them.\n\nThe  documentation  at  MySQL  provides\
    \  all  the  information  you  will  need  to  do  more  complex  operations.\n\
    \n![](images/00043.jpeg)\n\nUnderstood all  that?\n\nIn barely 10 lines (highlighted)\
    \ of C we have inserted our data into a database table and can read it  out again,\
    \  which  is  pretty  painless.  With  mysql_init  we  obtain  a  pointer  to\
    \  a  data  structure  of  type  MYSQL, we  can  then  se  this  to  connect \
    \ to  the  test  database  with  mysql_options  and  mysql_real_connect,  then\
    \ we  execute  SQL  statements  just  as  we  would  in  a  terminal  session.\
    \  The  results  of  a  query  can  be  retrieved as  a  sequence  of  MYSQL_ROW\
    \  arrays  of  strings  with  mysql_use_results.  We  free  up  the  memory  used\
    \ withmysql_free_resultand close the database with  mysql_close.\n\nAs  is  usual\
    \  with  C  libraries,  you  need  to  be  able  understand  the  usually  sparse\
    \  documentation  to understand the function calls, and for MySQL 5.1 we can find\
