    在浏览器中输入：`http://localhost/cgi-bin/data3?red`，你应该看到如下结果：


    ![](img/00016.jpeg)


    或者，如果你发送任意参数，将会得到令人惊讶的结果：


    ![](img/00017.jpeg)


    这里我们做的是将字符串参数 `argv[1]` 作为背景颜色代码嵌入到 HTML `<body>` 标签中。我们将 `Content-type` 规范修改为
    `text/html` ，奇迹般地我们的程序开始生成 HTML 内容。这是一种语言嵌套在另一种语言中的表达形式。Web 浏览器能够理解有限的颜色术语，同时也可以通过十六进制代码定义颜色，例如：#FFFFFF（白色）、#FF0000（红色）、#00FF00
    （绿色） 、#0000FF （蓝色）。


    这个有趣的练习并不仅仅是一个小技巧；一个程序能够在另一种语言中生成另一段程序的理念非常强大且支撑着整个互联网的力量。当我们像这样从一个通用网关接口程序中动态地生成了
    HTML（或 XML 或其他任何格式）时,不再只是静态的预编辑网页而是创建链接至实时变化数据源的活的内容了！实际上大部分网站都混合使用动静脉两种类型的信息展示方式——不过在这里我们可以了解到实现这一点的最简单层面的原理。


    从本书开始我们会始终把 web 端视为与所写脚本互动的首选环境;因此我们需要频繁产出 html 码或者是二进制图像流之类的网络资源——仅仅是为了能立即展现出作品所带来的影响力
    。如果只能通过黑乎乎的终端窗口查看自个儿写的字那未免太无趣了些 ;而直接搞出个视窗类应用又不像想象般那么直截了当 。


    实际操作环境中不少待完成的任务都是基于万维网运行的所以我们不妨从一开始就融入这种思维模式对么～多数站酷项目还涉及多种编程语句比如 CSS、(X)HTM、JavaScript,PHP,JAVA……这清单还可以拉很长.JSP/.ASP
    /. NET / SQL 等等 。听着吓人吧千万别慌！只要懂 C 你就会发现很多不同功能定位的语言其语法底层其实都有它打底的身影呢 .


