    `text/html` ，奇迹般地我们的程序开始生成 HTML 内容。这是一种语言嵌套在另一种语言中的表达形式。Web 浏览器能够理解有限的颜色术语，同时也可以通过十六进制代码定义颜色，例如：

    #FFFFFF（白色）、#FF0000（红色）、#00FF00 （绿色） 、#0000FF （蓝色）。


    这个有趣的练习并不仅仅是一个小技巧；一个程序能够在另一种语言中生成另一段程序的理念非常强大且支撑着整个互联网的力量。当我们像这样从一个通用网关接口程序中动态地生成了HTML(或XML或其他任何格式)时,不再只是静态的预编辑网页而是创建链接至实时变化数据源的活的内容了!实际上大部分网站都混合使用动静脉两种类型的信息展示方式—不过在这里我们可以了解到实现这一点的最简单层面的原理。


