  raw: 'In  the  browser  enter:  [http://localhost/cgi-bin/data3?red](http://localhost/cgi-bin/data3?red)
    what you should see is  this:


    ![](images/00016.jpeg)


    Or if send a parameter of anything at all you will get surprising  results:


    ![](images/00017.jpeg)


    What  we  are  doing  here  is  using  the  string  parameter  argv[1]  as  a  background  colour  code  inside  an


    HTML  body  tag.  We  change  the  Content-type  specification  to  text/html  and  miraculously  now  our
    program  is  generating  HTML  content.  A  language  being  expressed  inside  another  language.  Web  browsers
    understand  a  limited  set  of  colour  terms  and  colours  can  be  also  defined  hexadecimal  codes  such  as


    #FFFFFF  (white)  #FF0000  (red)  #00FF00  (green)  #0000FF  (blue).


    This  fun  exercise  is  not  just  a  lightweight  trick,  the  idea  that  one  program  can  generate  another  in  another  language  is  very  powerful  and  behind  the  whole  power  of  the  internet.  When  we  generate  HTML  (or
    XML  or  anything  else)  from  a  common  gateway  interface  program  like  this  we  are  creating  dynamic
    content  that  can  be  linked  to  live,  changing  data  rather  than  static  pre-edited  web  pages.  In  practice
    most  web  sites have a  mix  of  dynamic  and  static  content,  but  here  we  see  just  how  this  is  done
    at a  very simple  level.


    Throughout this book we will use the browser as the preferred interface to our
    programs hence we  will be generating HTML and binary image stream web content
    purely as a means to make immediate  the power  of  our  programs.  Writing  code  that  you  peer  at  in  a  terminal  screen  is  not  too  impressive,  and  writing
    window-type applications is not nearly so  straightforward.


    In practice most of the software you may be asked to write will be running on
    the web so we might  as well  start  with  this  idea  straight  away.  Most  web  applications  involve  multiple  languages  too  such  as  CSS,
    (X)HTML, XML, JavaScript, PHP, JAVA, JSP, ASP, .NET, SQL. If this sounds frightening,
    don’t panic. A knowledge of C will show you that many of these languages, which
    all perform different  functions, have a basis of C in their  syntax.


    ## 2.4 Parsing a  string


    The  work  involved  in  extracting  meaning  or  valuable  information  from  some  kind  of  input  string  is
    called  “parsing”.  We  will  now  build  another  fun  internet-callable  CGI  program  to  demonstrate  the  power  in
    our  hands.


    ![](images/00018.jpeg)


    Compile  with:  gcc  -o  data4  chapter2_4.c  -lc


    As superuser copy the program to /srv/www/cgi-bin (OpenSuse) or /usr/lib/cgi-bin
    (Ubuntu).


    In  the  browser  enter:


    [http://localhost/cgi-bin/data4?red:blue:5:5:](http://localhost/cgi-bin/data4?red%3Ablue%3A5%3A5)
    what you should see is  this:


    ![](images/00019.jpeg)


    In this program we take argv[1] which here isyellow:blue:5:5:andparseit using
    the library  function strtok  which  chops  the  string  into  tokens  separated  by  an  arbitrary  character  ‘:’  and  use  these  tokens  as
    strings to specify colours and integer numbers to specify the row and cell counts
    of a  table.


    The functionatoiconverts an string representation of a integer to an integer (“1”
    to  1).


    The  function  strtok  is  a  little  odd  in  that  the  first  time  you  call  it  with  the  string  name  you  want  to  parse,
    then on subsequent calls the first parameter is changed to  NULL.


    Thefor(…)loop mechanism was used to do something a set number of  times. The HTML
    terms introduced  were:


    <html>  <body>  <table>  <tr>  table  row  <td>  table  data  cell


    ## 2.5 Data and Memory –  conclusion


    We  have  used  some  simple  data  types  to  represent  some  information  and  transmit  input  to  a  program  and
    to organise and display some visual  output.


    We  have  used  HTML  embedded  in  output  strings  to  make  output  visible  in  a  web  browser.  As
    an exercise try  this:


    Write a program to put into your/public_html/cgi-binfolder which can be called
    in a browser  with the  name  of  a  sports  team  or  a  country  and  a  series  of  colours  specified  perhaps  as  hexadecimals  e.g.


    ff0000  =  red  (rrggbb)  used  for  the  team  colours  or  map  colours,  and  which  displays  something  sensible.
    My version looks like  this:


    ![](images/00020.jpeg)


    ![](images/00021.jpeg)


    # 3 Functions,  pointers  and structures


    ## 3.1 Functions


    The  entry  point  into  all  our  programs  is  called  main()  and  this  is  a  function,  or  a  piece  of  code  that  does
    something,  usually  returning  some  value.  We  structure  programs  into  functions  to  stop  them  become  long
    unreadable blocks of code than cannot be seen in one screen or page and also to
    ensure that we  do not  have  repeated  identical  chunks  of  code  all  over  the  place.  We  can  call  library  functions  like  printf
    or  strtok  which  are  part  of  the  C  language  and  we  can  call  our  own  or  other  peoples  functions  and
    libraries  of  functions.  We  have  to  ensure  that  the  appropriate  header  file  exists  and  can  be  read  by  the
    preprocessor and that the source code or compiled library exists too and is  accessible.


    As  we  learned  before,  the  scope  of  data  is  restricted  to  the  function  in  which  is  was  declared,  so  we  use
    pointersto data and blocks of data to pass to functions that we wish to do some
    work on our data.  We  have  seen  already  that  strings  are  handled  as  pointers  to  arrays  of  single  characters  terminated  with  a
    NULL  character.


    ![](images/00022.jpeg)


    In this example we can repeatedly call the function “doit” that takes two integer
    arguments and  reurns the result of some mathematical  calculation.


    Compile:  gcc  -o  func1  chapter3_1.c  -lm


    Copy  to  cgi-bin:  cp  func1  /home/Cerberus/public_html/cgi-bin/func1


    (You  should  be  using  the  Makefile  supplied  or  be  maintaining  a  Makefile  as  you  progress,  adding  targets
    to compile examples as you  go.)


    ![](images/00023.jpeg)


    The  result  in  a  browser  looks  like  this  called  with  “func1?5:5”.


    In  this  case  the  arguments  to  our  function  are  sent  as  copies  and  are  not  modified  in  the  function  but  used.  If
    we want to actual modify a variable we would have to send its pointer to a  function.


    ![](images/00024.jpeg)


    We send the address of the variable ‘result’ with&result, and in the function
    doit wede-reference  the  pointer  with  *result  to  get  at  the  float  and  change  its  value,  outside  its  scope  inside  main.  This  gives
    identical output to  chapter3_1.c.


    ## 3.2 Library  Functions


    C  contains  a  number  of  built-in  functions  for  doing  commonly  used  tasks.  So  far  we  have  used  atoi,  printf,sizeof,strtok,
    andsqrt.To get full details of any built-in library function all we have to do  is
    type for  example:


    ##### man  3  atoi


    and we will see all  this:


    ![](images/00025.jpeg)


    Which  pretty-well  tells  you  everything  you  need  to  know  about  this  function  and  how  to  use  it  and
    variants  of  it.  Most  importantly  it  tells  you  which  header  file  to  include.


    ## 3.3 A short library function reference


    Full details of all the functions available can be found  at: [http://www.gnu.org/software/libc/manual/](http://www.gnu.org/software/libc/manual/)


    ![](images/00026.jpeg)


    There  is  no  point  in  learning  about  library  functions  until  you  find  you  need  to  do  something  which
    then  leads  you  to  look  for  a  function  or  a  library  of  functions  that  has  been  written  for  this  purpose.  You  will  need  to  understand  the  function  signature  –  or  what  the  argument  list  means  and  how  to  use  it  and  what
    will be returned by the function or done to variables passed as pointers to functions.


    ## 3.4 Data Structures'
