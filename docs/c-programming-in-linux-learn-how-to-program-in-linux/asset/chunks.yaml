  trans: "\n\n有时我们希望将一组变量作为一个整体来管理，例如从数据库记录中取出所有值，并在程序中传递整条记录进行处理。为此，我们可以将数据分组为结构体。\n\
    \n该程序使用 `struct` 为一个名为 player（玩家）的对象定义了一组属性。`main()` 函数中包含一个由 5 个 player 组成的数组的声明和实例化。我们依次将每个成员的指针传递给\
    \ rank_one(Ptr) (排名一)函数 。这个函数利用 switch 语句检查名字的首字母进行任意排序 ，然后打印详细信息。\n\n![](img/00027.jpeg)\n\
    \n在通常浏览器里看到的结果如下所示：\n\n![](img/00028.jpeg)\n\n这是一种非常强大的技术 ——相当高级——但你需要了解一个重要理念：结构体直接导向类和对象\
    \ 。\n\n我们可以看到使用 struct 能够极大地简化业务任务：无需传递多个不同元素就能完成各种工作 。如果改变了定义 ，只需添加代码来处理新属性即可正常工作\
    \ ，而无需修改执行工作的函数的参数列表或签名 。\n\n结构的定义实际上并没有创建任何数据集；它只勾勒出了未来可能实例化的形式框架 。在 main()内部通过具体表达形式可以构造出符合定义的链表序列。\n\
    \n你很可能还需要额外的方法(本质上这就像 Java 中的类一样); C++也是如此;  面向对象的语言往往是从许多早期系统描述的事实基础上构建出来的,这些事实原本就内置在该编程语言之中\n\
    \n如果你看看 Apache 服务器开发过程中的那些头文件示例 ,你会找到大量的碎片片段来自 httpd.h:\n\n!( images / 00029 jpeg\
    \ )\n\n不必深究其含义——只需注意这种常见的设计模式与你核心理解内容密切相关就行:作为程序员必须充分掌握这一点!你要做出关于“世界应该如何建模”方面的哲学决策\
    \ ;这可是一份沉重的责任哦!哲学包括本体论(存在什么?)与认识论(如何知道?),估计你都从未想过自己竟然会涉及这些问题吧!\n\n##   函数指针小结\n\
    \n我们已经学会用简单类型来表示并传输输入、组织输出显示 HTML 嵌入字符串以便 Web 浏览器查看以及学习库复用知识并从网上资料及书籍中获得沟通经验.\n\
    \n#####   练习 ：运用某个库实现以下功能 :以写入方式打开文件 、写命令行信息 、关闭后再读取屏幕内容 ；尝试寻找合适素材自行搜索相关资料.\n\n\
    #    逻辑循环与控制流\n###     流程语法支持下列控制结构.当需要顺序计数时可以这样操作 ：For （初始值;继续保持条件 ;每次增量变化 ）while\
    \ 等待满足真伪判断分别对待至少执行一次测试单选另一种情况 else 多分支基于整数或者字符数值默认 break 跳出适用处.\n  \n操纵指令就像是枯燥乏味灰尘飞扬却又能解决交互复杂性的根本问题那样基础重要\
    \ .要实现典型功能可用 getParameter(“ITEM1”) PHP $_REQUEST 之类展示环境相关信息隐式可访问 arguments[]里面返回请求环境变量\
    \ QUERY_STRING 整个字符串内容包括 NAME=VALUE 成对出现并以&符号分隔提交后需解析切分成块再结合判定逻辑循环计数器对于基本理想重复处理组件区别已插入盒子抽取类似\
    \ java 编码异常空格变成%21 加号等等.\n\n\n\n"
