  trans: "\n关于 Apache 模块的简明清晰的资料很少，但可以从在线文档开始：[`httpd.apache.org/docs/2.2/developer/`](http://httpd.apache.org/docs/2.2/developer/)\n\
    \n近期值得一看的书是《The Apache Modules Book》，作者 Nick Kew，Prentice Hall 出版。\n\n## The Ghost\
    \ 项目\n\n### PHP 网站生成器项目\n\n能够用 `C`语言编写简短程序来自动完成繁琐的任务，或者做一些原本需要花费数小时摆弄笨拙工具（例如邮件合并）才能搞定的事情——这是你学会这种技能后最开心的事之一。本项目正是此类省时利器：**Ghost**是一个轻量级的\
    \ PHP 网站生成器，供你定制使用。\n\n如果你发现自己一直在构建 PHP 网站那么一种能一步到位地自动生成所有参数传递、解码代码、表单构建及数据库管理等等方面的实用的做法将会起到非常的作用进而极大方便了整个开发进程并缩减所需的时间与精力投入其中即可快速上手通过本工具你可以将一个完整的动态站点在极短的时间内搭建和整合起来从而免去重复性劳动带来的疲惫感觉同时保持架构清晰明了便于后期维护扩展功能特性更加强悍稳定运行流畅无阻兼容各种主流浏览器设备环境适应性优秀的体制下依然表现良好亮点出众无需另学新编程语法一样取得事半功倍的成果！编译非常简单只需要将\
    \ ghost.zip 源码解压到你的 public_html 文件夹中创建出名为 ghost 的子目录进入该位置后将 Makefile 文件里的目标 g1\
    \ 选项用于编译链接整个工程的所有元素最终形成一个完整可执行版本然后切换到 public_html \n\n"
