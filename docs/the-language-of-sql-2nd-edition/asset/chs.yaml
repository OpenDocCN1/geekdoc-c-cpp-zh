  \ 注册本书，以便方便地获取本书可能提供的任何更新、下载或勘误。\n\n# 引言\n\n\n在另一个平行宇宙中，这本书的标题可能是*SQL 逻辑学*。这是因为像所有计算机语言一样，SQL\
  \ 语言更多是关于冷酷的逻辑的，而不是英语词汇。尽管如此，出于多种原因，标题中仍保留了“语言”一词。首先，SQL 中某种基于语言的语法使其与其他计算机语言区分开来。与其他语言不同，SQL\
  \ 在其语法中使用许多普通单词（如 `WHERE` 和 `FROM`）作为关键字。\n\n本着 SQL 中嵌入的语言精神，我们在主题序列中强调了“语言”的重要性。通过本书，你将像学习英语一样学习\
  \ SQL。SQL 关键字按照逻辑顺序呈现，从简单到复杂。从本质上说，这是同时处理语言和逻辑的尝试。\n\n要学习任何语言，必须从听取和记忆构成其发音基础的实际单词开始。同时，这些词具有必须理解的特定含义。在\
  \ SQL 的情况下，其含义与逻辑有极大的关系。\n\n坚持使用*SQL 语言*而非*SQL 逻辑学*作为标题的最后一个原因是，它它听起来更好听。虽然在计算机语言书籍中可能不会有太多的文学辞藻，但希望“语言”一词的出现能为这个毕竟是非常有趣的领域的主题增添一些额外的热情。\n\
  ## 主题与特性\n\n即使你还不熟悉 SQL，也可以说它是一种带有许多组件和特性的复杂语言。在本书中，我们将关注一个主要主题：\n\n- 如何使用 SQL 从数据库中检索数据\n\
  在较小范围内，我们还将涵盖：\n\n- 如何更新数据库中的数据\n- 如何构建和维护数据库\n- 如何设计关系型数据库\n- 获取数据后显示数据的策略\n\n\n\
