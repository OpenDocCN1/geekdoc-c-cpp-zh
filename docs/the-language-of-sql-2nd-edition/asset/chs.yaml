  \n### 书籍计划\n\n本书以独特的顺序介绍主题。大多数 SQL 书籍的主题顺序假设你是一个需要从头创建和设计数据库，向数据库加载数据，然后开始检索数据的数据库管理员。在本书中，我们直接从数据检索开始，然后在最后的章节回到数据库设计。这样做是一种激励策略，让你在处理索引和外键等深奥的主题之前，快速进入与数据检索相关的有趣主题。\n\
  \n\n- 第 1 章 介绍了关系型数据库的介绍性材料，在接触 `SELECT` 语句之前理解这些内容是必要的。\n\n- 第 2 章 到 5 章 开始探索 `SELECT`\
  \ 语句，涵盖了计算、函数和排序的基础知识。\n\n\n\n\n- 第 6 章到第 8 章讨论了选择标准，从简单的布尔逻辑到条件逻辑。\n- 第 9 章和第 10\
  \ 章探索了数据汇总的方法，从简单的计数到复杂的聚合和小计。\n- 第 11 章到第 15 章讨论了如何通过连接、子查询、视图和集合逻辑从多个表中检索数据的方法。\n\
  - 第 16 章到第 18 章超越了`SELECT`语句，专注于关注与关系型数据库相关的更广泛的话题，例如存储过程、更新和表维护。\n- 最后，第 19 章和第\
  \ 20 章、B 和 C 提供了如何开始使用书中涵盖的三种数据库：Microsoft SQL Server、Oracle 和 MySQL 的信息。\n### 伴随网站\n\
  \n书中所有 SQL 语句的列表可以在此网站找到：\n\n- **[www.informit.com/store/language-of-sql-9780134658254](http://www.informit.com/store/language-of-sql-9780134658254)**\n\
  \n\n- 针对 Microsoft SQL Server 的 SQL 语句\n- 针对 MySQL 的 SQL 语句\n- 针对 Oracle 的 SQL 语句\n\
  \n这三个文件列出了书中针对每个数据库的所有 SQL 语句。此外，这些文件还包含一个 SQL 脚本，允许你创建书中使用的所有数据。运行设置脚本后，你就可以执行书中的语句并看到相同的输出。\n\
  \n关于如何执行设置脚本的说明包含在每个文件中。\n## 1. 关系型数据库与 SQL\n\n正如引言中提到的，SQL 是与存储在关系型数据库中的数据通信的最广泛软件工具。在这一过程中，SQL\
  \ 利用了语言和逻辑两种元素。作为一种语言，SQL 采用了一种独特的语法，包含许多英语单词，例如 `WHERE`、`FROM` 和 `HAVING`。作为逻辑的表达式，它规定了如何检索或更新关系型数据库中数据的详细信息。\n\
  \n考虑到这种双重性，我们在本书中尝试在介绍构成 SQL 的的话题时，同时强调语言组件和逻辑组件。在所有语言中，无论是计算机语言还是口语语言，都有需要学习和记忆的实际单词。因此，我们将按照逻辑顺序逐一介绍\
  \ SQL 中存在的各种关键字。随着每个章节的深入，你将在之前学到的词汇的基础上学习新的关键字以及与数据库交互的令人兴奋的可能性。\n\n除了词汇本身，还有需要考虑的逻辑。SQL\
  \ 使用的单词具有独特的逻辑含义和意图。SQL 的逻辑与语言一样重要。与所有计算机语言一样，通常有多种方法来指定任何设实现目标。可能性的细微差别涵盖了所涉及的语言和逻辑。\n\
  让我们从语言开始。一旦你熟悉了 SQL 的语法，你可能会发现自己将 SQL 命令类比为英语句子并具有特定的表达含义。\n\n例如，比较这句话：\n\n点击此处查看代码图像\n\
  \n我要一个汉堡和薯条，从你们的超值菜单里，并且带走。\n\n\n```sql\nSelect city, state\nfrom Customers\norder\
  \ by state\n```\n\n我们稍后会细节，但这条 SQL 语句意味着我们从数据库中名为 `Customers` 的表中获取 `city` 和 `state`\
  \ 字段，并且我们希望按 `state` 对结果进行排序。\n在这两种情况下，我们都指定了我们想要的项目（汉堡/薯条或城市/州）、我们想从哪里获取（超值菜单或\
  \ `Customers` 表）以及一些额外的指令（带走，或按州对结果进行排序）。\n\n在我们开始之前，让我们来解决一个微小的点：如何读 SQL 这个词。事实证明有两种选择。一种选择是简单地按字母逐读，像“S-Q-L”。另一种可能性（作者更倾向于）是将其读作单词“sequel”。这少了一个音节，读起来更容易。然而，对于这个问题并没有真正的共识。这基本上是个人喜好的问题。\n\
  \n至于 S-Q-L 字母的含义，大多数人认为它们代表“结构化查询语言”（Structured Query Language）。在这里也没有完全一致。有些人会认为\
  \ SQL 完全没有代表什么，因为这种语言源于 IBM 的一种旧语言 `sequel`，而它实际上并不代表结构化查询语言。\n\n### 什么是 SQL？\n\
  那么 SQL 是什么？简而言之，SQL 是一种用于维护和利用关系型数据库数据的标准计算机语言。简单来说，SQL 是一种让用户与关系型数据库交互的语言。它拥有悠久的发展历史，可以追溯到\
  \ 20 世纪 70 年代的各种组织。1986 年，美国国家标准学会（ANSI）发布了第一套语言标准，之后经历了多次修订。\n\n通常情况下，SQL 有三个主要组件。第一个被称为\
  \ `DML`（数据操纵语言）。该语言模块允许你检索、更新、添加或删除数据库中的数据。第二个是 `DDL`（数据定义语言）。DDL 允许你创建和修改数据库本身。例如，DDL\
  \ 提供了 `ALTER` 语句来修改表。最后，第三个组件 `DCL`（数据控制语言）维护数据库的安全性。\n\n主要的软件供应商（如微软和 Oracle）为了自己的目的调整了标准，并对语言增加了许多扩展和修改。但尽管每个供应商对\
  \ SQL 都有独特的解释，仍然有一个相同的基础语言。这种基础语言正是我们在书中涵盖的内容。\n\n作为一种计算机语言，SQL 与你熟悉的其他语言（如 Basic\
  \ 或 C++）不同。这些语言通常是过程性的，这意味着它们允许你指定特定的过程来实现所需的目标。SQL 更多的是一种声明式语言。在 SQL 中，所需的目标通常通过单个语句声明。SQL\
  \ 结构简单是因为它只关注关系数据库，而不是整个计算机系统。\n关于 SQL 语言的另一个说明是，它经常与特定的 SQL 数据库混淆。许多软件公司销售数据库管理系统（DBMS）软件。在习惯中，这类软件包中的数据库通常被称为\
  \ *SQL 数据库*，因为 SQL 语言是管理和访问这些数据库的主要手段。某些供应商将 SQL 作为数据库名称的一部分。例如，微软将其数据库命名为 `SQL\
  \ Server 2016`。但事实上，SQL 更多是一种语言而非数据库。我们在书中的重点是 SQL 语言，而不是任何特定的数据库。\n\n### Microsoft\
  \ SQL Server、MySQL 和 Oracle\n\n尽管我们的目标是涵盖适用于所有实现的 SQL 核心语言，但我们最终必须提供 SQL 语法的特定示例。由于语法在供应商之间确实存在差异，我们决定专注于这三个流行数据库所使用的\
  \ SQL 语法：\n\n- Microsoft SQL Server\n- Oracle\n\n\n\n\n\n在大多数情况下，这些数据库具有相同的语法。然而，它们偶尔存在差异。如果这些数据库之间存在任何差异，`Microsoft\
  \ SQL Server` 的语法将呈在本本书的正文中。对于 `MySQL` 或 `Oracle` 的任何差异将在标题为 `数据库差异` 的侧边栏中指出，如下所示：\n\
  ***\n\n### 数据库差异\n\n每当 `MySQL` 或 `Oracle` 存在语法差异时，就会出现这样的侧边栏。`Microsoft SQL Server`\
  \ 的语法将出现在正文中。\n\n***\n`Microsoft SQL Server` 提供多个版本和版本。最新版本被称为 `Microsoft SQL Server\
  \ 2016`。可用的版本从基础的 Express 版到功能完备的 Enterprise（企业）版。Express 版是免费的，但仍然拥有丰富的功能，允许用户开始真正的数据库开发。Enterprise\
  \ 版包含了许多复杂的数据库管理功能，以及强大的商业智能组件。\n\n尽管 `MySQL` 归 `Oracle` 所有，但它是开源数据库，这意味着没有单一组织可以控制它的开发。`MySQL`\
  \ 可用于 Windows 之外的许多平台，例如 Mac OS X 和 Linux。`MySQL` 提供社区版（Community Edition）免费下载。最新版本是\
  \ `MySQL 5.7`。\n\n`Oracle` 数据库提供多个版本。最新版本被称为 `Oracle Database 12c`。该数据库的免费版本被称为\
  \ Express 版。\n\n在开始时，下载你选择的数据库有时是有用的，这样你就有东西可以实验。然而，本书并不要求你这样做。书中的内容编写方式允许你仅通过阅读文本来学习\
  \ `SQL`。我们将在文中提供足够的数据，让你能够理解各种 `SQL` 语句的结果，而无需下载软件并亲自输入语句。\n\n尽管如此，如果你想下载这些数据库的任何一个免费版本，我们包含了三个附录，提供了关于如何操作的有用说明和提示。`附录\
  \ A` 提供了关于如何开始使用 `Microsoft SQL Server` 的完整信息。说明包含了如何安装软件和执行 `SQL` 命令的细节。同样，`附录\
  \ B` 和 `附录 C` 涵盖了 `MySQL` 和 `Oracle`。\n如引言所述，我们的辅助网站提供了补充材料，列出了书中所有三个数据库中显示的所有 `SQL`\
  \ 语句。然而，你可能会发现下载或查看辅助网站上的额外材料是没有必要的。贯穿书中所示的示例是自其义的，不需要你做任何其他事情就能理解这些内容。但是，如果你有此意，请尽管利用这些额外功能。\n\
  \n还应该提到，除了 `SQL Server`、`MySQL` 和 `Oracle` 之外，其他流行的关系型数据库也值得考虑。例如：\n\n- 来自 `IBM`\
  \ 的 `DB2`\n- 来自 `IBM` 的 `Informix`\n- `PostgreSQL`，一个开源数据库\n- 来自 `Microsoft` 的 `Microsoft\
  \ Access`\n\n在这些数据库中，`Microsoft Access` 的独特之处在于具有图形元素。从本质上说，`Access` 是关系型数据库的图形界面。换句话说，`Access`\
  \ 允许你完全通过图形手段对关系型数据库创建查询。对于初学者来说，`Access` 的优势之处是你可以轻松地以视觉方式创建查询，然后切换到 `SQL` 视图查看你刚刚创建的\
  \ `SQL` 语句。`Access` 的另一个不同在于它主要是一个桌面数据库。因此，你可以用它创建一个完全存储在 PC 单一文件中的数据库，但也允许你连接到使用其他工具（如\
  \ `Microsoft SQL Server`）创建的数据库。\n\n\n完成这些准备后，让我们来看关系型数据库的基础，看看它们是如何工作的。关系型数据库是数据集合，存储在任意数量的表中。在通常情况下，“关系”（relational）一词可以表示表通常以某种方式相互关联。然而，在更精确的术语中，“关系”指的是关系理论，与控制表关联方式的逻辑属性有关。\n\
  \n例如，让我们取一个仅包含两个表的简单情况：`Customers`（客户）和 `Orders`（订单）。`Customers` 表包含每个下过订单的客户的记录。`Orders`\
  \ 表包含每个订单的记录。每个表可以包含任意数量的字段，用于存储与每条记录相关的各种属性。例如，`Customers` 表可能包含 `FirstName`（名字）和\
  \ `LastName`（姓氏）等字段。\n\n此时，将某些表及其包含的数据视觉化是很有用的。通常的做法是将表显示为行和列组成的网格。每一行代表表中的一条记录。每一列代表表中的一个字段。顶部的标题行通常包含字段名。其余行显示实际数据。\n\
  \n\n让我们来看一个简单的关系型数据库示例。该数据库只包含两个表：`Customers` 和 `Orders`。`Customers` 表可能像这样：\n\n\
  ![Image](img/005tab01.jpg)\n\n`Orders` 表可能显示为：\n\n![Image](img/005tab02.jpg)\n在这个示例中，`Customers`\
  \ 表包含三列：`CustomerID`（客户 ID）、`FirstName` 和 `LastName`。表中目前有三行，代表 Bob Davis、Natalie\
  \ Lopez 和 Connie King。每一行代表一个不同的客户，每一列代表关于客户的另一个不同信息。同样，`Orders` 表有三列和四行。这表明数据库中有四个订单，这些订单有三个属性。\n\
  \n当然，这个示例是非常简化的，只暗示了实际数据库中可能存储的数据类型。例如，`Customers` 表通常会包含许多描述客户其他属性的列，如 `city`（城市）、`state`（州）、`zip`（邮编）和\
  \ `phone number`（电话）。同样，`Orders` 表通常会有描述订单附加属性的列，例如 `order date`（订单日期）、`sales tax`（销售税）和接订单的销售人员。\n\
  \n### 主键和外键\n\n注意每个表中的第一列：`Customers` 表中的 `CustomerID` 以及 `Orders` 表中的 `OrderID`。这些列通常被称为\
  \ `primary keys`（主键）。主键有用且必要有两个原因。首先，它们允许我们唯一地识别表中的某行。例如，如果我们想检索 Bob Davis 的行，只需使用\
  \ `CustomerID` 列即可获取数据。主键还确保了唯一性。将 `CustomerID` 列设计为主键，可以确保该列在表的每行中都具有唯一的值。即使我们在数据库中拥有两个名为\
  \ Bob Davis 的不同男人，这些行的 `CustomerID` 列中的值也是不同的。\n\n\n\n\n在这个示例中，主键列中的值没有任何特定的含义。在\
  \ `Customers` 表中，`CustomerID` 列为表中的三行分别包含了 1、2 和 3 这三个值。数据库表的设计通常设计为：在向表中添加新行时，自动为主键列生成连续的数字。这种设计特征通常被称为\
  \ `auto-increment`（自动递增）。\n\n主键的第二个原因是，它们允许我们轻松地将一个表与另一个表关联起来。在这个示例中，`Orders` 表中的\
  \ `CustomerID` 列指向 `Customers` 表中对应的行。观察 `Orders` 表的第四行，可以发现 `CustomerID` 列的值为 3。这意味着该订单属于\
  \ `CustomerID` 为 3 的客户，而该客户恰好是 Connie King。在表之间使用公共列是关系型数据库设计中的一个核心元素。\n\n\n###\
  \ 数据类型 (Datatypes)\n\n主键和外键为数据库表增加了结构。它们确保数据库中的所有表都是可访问的，并且彼此正确关联。表中每列的另一个重要属性是其数据类型。\n\
  \n数据类型只是定义该列可以包含的数据类型的一种方式。每个表中的每一列都必须指定数据类型。遗憾的是，不同关系型数据库在允许哪些数据类型及其含义方面存在很大差异。例如，Microsoft\
  \ SQL Server、MySQL 和 Oracle 均拥有超过 30 种不同的允许数据类型。\n即使仅针对这三个数据库，也不可能涵盖每种可用数据类型的细节和细微差别。然而，我们将做的是通过讨论大多数数据库通用的数据类型主要类别来总结现状。一旦你理解了这些类别中重要的数据类型，处理可能遇到的其他数据类型就不会有太大困难。通常，数据类型有三种重要类型：数值型、字符型和日期/时间型。\n\
  \n数值数据类型有多种格式，包括位（bits）、整数（integers）、小数（decimals）和实数（real numbers）。位是仅允许两个值（0 和\
  \ 1）的数值数据类型。位数据类型通常用于定义属性具有简单的“真”或“假”值。整数是不带小数的数字。小数数据类型可以包含小数。与位、整数和小数不同，实数是指那些精确值在内部仅通过近似定义的数字。所有数值数据类型的共同特征是它们可以包含在算术计算中。以下是来自\
  \ Microsoft SQL Server、MySQL 和 Oracle 的数值数据类型的代表性示例。\n\n![Image](img/007tab01.jpg)\n\
  \n字符数据类型有时被称为 `string`（字符串）或 `character string`（字符字符串）类型。与数值数据类型不同，字符数据类型不仅限于数字。它们可以包含任何字母或数字，甚至可以包含特殊字符（如星号）。在\
  \ SQL 语句中为字符数据类型提供值时，值必须始终用单引号括。相比之下，数值数据类型永远不使用引号。以下是字符数据类型的代表性示例：\n\n\n第二个示例（60601）可能是一个邮政编码。乍一看，它看起来像是一个数值数据类型，因为它由数字组成。这种情况并不罕见。尽管邮政编码只包含数字，但它们通常被定义为字符数据类型，因为不需要对邮政编码进行算术计算。\n\
  \n日期/时间数据类型用于表示日期和时间。与字符数据类型一样，日期/时间数据类型必须包含在单引号中。这些数据类型允许涉及日期的特殊计算。例如，可以使用特殊函数计算任意两个日期/时间之间的天数。以下是日期/时间数据类型的示例：\n\
  \n![Image](img/008tab01.jpg)\n\n\n表中列的另一个重要属性是该列是否允许包含 NULL 值。NULL 值意味着该特定数据元素没有数据。它字面上不包含任何数据。然而，NULL\
  \ 值不等同于空格或空白。从逻辑上讲，NULL 值和空白的处理方式是不同的。获取包含 NULL 数据的细微差别将在第 7 章“布尔逻辑”中详细讨论。\n\n许多数据库在显示带有空值的数据时会用全大字母显示\
  \ `NULL` 单词。这样做是为了让用户判断数据包含的是空值而不仅仅是空格。我们将遵循这一惯例，在书中到处显示 `NULL` 字，以强调它代表那种特殊的值。\n\
  \n数据库中的主键永远不能包含 `NULL` 值。这是因为根据定义，主键必须包含唯一值。\n\n\n在离开关系型数据库这一通用主题之前，让我们来看一个简短的历史回顾，以便理解关系型数据库的用处以及\
  \ SQL 的重要性。\n\n在 20 世纪 60 年代计算的早期，数据通常存储在磁带或磁盘驱动器上的文件中。用 `FORTRAN` 和 `COBOL` 等语言编写的计算机程序通常读取输入文件并逐条处理记录，最终将数据移动到输出文件。处理过程必然是复杂的，因为程序需要分解为许多单独步骤，涉及临时表、排序和多次遍历数据，直到产生预期的输出。\n\
  \n在 20 世纪 70 年代，随着层次数据库和网络数据库的发明和利用，技术取得了进展。这些新数据库通过复杂的内部指针系统，使得读取数据变得更加容易。例如，程序可以读取一个客户记录，自动指向该客户的所有订单，然后指向每个订单的所有细节。但基本上，这些数据仍然需要逐条记录进行处理。\n\
  \n\n与早期的数据检索方法不同，`SQL` 允许用户一次访问一组大量数据。通过一个语句，`SQL` 命令就可以从多个表中检索或更新数千条记录。这消除了大量的复杂性。计算机程序不再需要按照特殊顺序逐条读取记录，同时决定对每条记录要做什么。过去需要数百行编程代码的任务，现在只需要几行逻辑即可完成。\n\
  \n### 展望未来\n\n\n\n第一章提供了有关关系型数据库的一些背景信息，使我们能够进入从数据库检索数据的主题。我们讨论了关系型数据库的许多重要特性，例如主键、外键和数据类型。我们还讨论了数据中可能存在\
  \ NULL 值。我们将在第 7 章中的“布尔逻辑”中补充对 NULL 值的讨论，并在第 18 章”中回到数据库维护的通用话题，最后在第 19 章中的“数据库设计原则”中讨论数据库设计。\n\
  \n为什么要把数据库设计这个重要主题推迟到书的后后部分？简而言之，采取这种方法是为了让你能够投入使用 SQL，而不必在开始时担心设计的细节。事实上，数据库设计既是一门科学，也是一门艺术。希望在你对通过\
  \ SQL 检索某些数据的细节和细微差别有了更深入的认识，数据库设计的原则将会更有意义。因此，我们将暂时忽略如何设计数据库的问题，并在下一章开始学习数据检索。\n\
  \n## 2. 基础数据检索\n\n### 介绍的关键字\n`SELECT` • `FROM`\n\n在本章中，我们将开始探索 SQL 中最重要的的话题——即如何从数据库中检索数据。无论你的组织规模如何，对\
  \ SQL 开发人员提出的最常见请求就是生成报告。当然，将数据存入数据库是一项非易事的工作，但一旦数据到达那里，业务分析师的精力就会转到他们所拥有的丰富数据上，以及从所有这些数据中提取有用信息的愿望。\n\
  \n本书对数据检索的强调对应于这些现实世界的需求。你对 SQL 的知识将极大地帮助你的组织解锁存储在数据库数据中隐藏的秘密。\n\n### 简单的 SELECT\n\
  在 SQL 中，检索数据的能力通过一种被称为 `SELECT` 语句的东西来实现。在没有任何预先解释的情况下，这里是最简单的 `SELECT` 语句示例：\n\n\
  ```sql\nSELECT * FROM Customers\n```\n\n在 SQL 语言中，与所有计算机语言一样，某些单词是`keywords`（关键字）。这些单词具有特殊含义并且必须以特定的方式使用。在句条语句中，单词\
  \ `SELECT` 和 `FROM` 是关键字。`SELECT` 关键字表示 `SELECT` 语句的开始。`FROM` 关键字用于指定要从中检索数据的表。表名紧随\
  \ `FROM` 之后。在本例中，表名为 `Customers`。示例中的星号（`*`）是一个特殊符号，表示“所有列”。\n按照惯例，我们将用全大写字母打印关键字。这样做是为了确保它们显而可见。总而言之，这条语句的意思是：从\
  \ `Customers` 表中选择所有列。\n\n如果 `Customers` 表看起来所示：\n\n![Image](img/012tab01.jpg)\n\
  \n那么 `SELECT` 将返回以下数据：\n![Image](img/012tab02.jpg)\n\n换句话说，它带回了表中的所有内容。\n\n在上一章中，我们提到过为所有表指定主键是一种常见做法。在这个示例中，`CustomerID`\
  \ 列就是这样一列。我们还提到过，主键有时被设置为在向表中添加行时，自动生成数字序列中的顺序数字。在本例中正是如此。事实上，我们在全书中展示的大部分样本数据都包含一个类似的列，它既是主键又定义为自动递增。根据惯例，这通常是表中的第一列。\n\
  \n### 语法说明\n\n\n其次，SQL 语句可以写在任意数量的行，单词之间可以有任意数量的空格。例如，SQL 语句：\n\n```sql\nSELECT\
  \ * FROM Customers\n```\n\n\n```sql\nSELECT *\nFROM Customers\n```\n\n通常将每个重要的关键字另起一行开始是一个好主意。当我们遇到更复杂的\
  \ SQL 语句时，这将有助于快速理解语句的含义。\n最后，当我们在这书中介绍不同的 SQL 语句时，我们经常会展示一个具体的示例和一个更通用的格式。例如，上一个语句的通用格式将显示为：\n\
  \n```sql\nSELECT *\nFROM table\n```\n\n斜体用于表示通用表达式。斜体单词 `table` 意味着你可以在该位置替换任何表名。当你在书中任何\
  \ SQL 语句中看到斜体单词时，这只是表示在该位置可以替换任何有效的单词或短语。\n***\n\n### 数据库差异：MySQL 和 Oracle\n\n许多\
  \ SQL 实现要求在每个语句末尾加分号。MySQL 和 Oracle 都是如此，但 Microsoft SQL Server 则不是。然而，如果需要，可以在\
  \ SQL Server 中指定分号。为了简单起见，我们在书中将显示不带分号的 SQL 语句。如果你使用 MySQL 或 Oracle，则需要在每个语句的末尾添加分号。上一个语句将变为：\n\
  \n```sql\nFROM Customers;\n```\n\n***\n\n### 注释\n\n\n点击查看图像\n\n```sql\nSELECT\n\
  -- this is a comment\nFirstName,\n\nFROM Customers\n```\n\n第二种格式借自 C 编程语言，由位于 `/*`\
  \ 和 `*/` 之间的文本组成。`/*` 和 `*/` 之间的注释可以写在多行。这里是这种格式的示例：\n\n点击查看图像\n\nSELECT\n/* this\
  \ is the first comment */\nFirstName,\n\nLastName /* this is a second comment\n\
  this is still part of the second comment\nthis is the end of the second comment\
  \ */\n\n```\n\n***\n\n### 数据库差异：MySQL\n\nMySQL 支持双横线和 C 格式（/* 和 */），但有一个小区别。使用双横线格式时，MySQL\
  \ 要求在第二个横线之后有一个空格或特殊字符。\n此外，MySQL 还允许第三种插入注释的方法，类似于双横线。在 MySQL 中，你可以在行的任意位置放置数字符号（`#`）来表示注释。该行中\
  \ `#` 符号之后的所有文本都被注释。这里是这种格式的示例：\n\n```sql\nSELECT FirstName\n# this is a comment\n\
  FROM Customers;\n```\n\n\n### 指定列\n\n到目前，我们仅仅是显示了表中的所有数据。但如果我们只想选择某些列呢？从同一个表开始，例如我们可能只想显示客户的姓氏。那么\
  \ `SELECT` 语句将看起来像：\n\n```sql\nSELECT LastName\n```\n\n结果数据将是：\n\n![Image](img/014tab01.jpg)\n\
  \n如果我们想选择多个列但不是所有列，`SELECT` 可能看起来像这样：\n\nSELECT\nFirstName,\n\nLastName\nFROM Customers\n\
  ```\n\n\n![Image](img/014tab02.jpg)\n\n该语句的通用格式是：\n\n```sql\nSELECT columnlist\n\
  FROM table\n\n\n\n\n需要记住的一点是，如果你需要在 `columnlist` 中指定多个一个列，那么这些列之间必须用逗号隔开。另外注意，我们将每个列（`FirstName`、`LastName`）分别放在\
  \ `columnlist` 的不同行中。这样做是为了提高可读性。\n\n### 带有嵌入空格的列名\n如果列的名称中包含空格怎么办？例如，假设 `LastName`\
  \ 列被指定为 `Last Name`（两个单词之间有一个空格）。显然，以下代码将无法运行：\n\n```sql\nSELECT\nLast Name\nFROM\
  \ Customers\n```\n\n\n```sql\nSELECT\n[Last Name]\nFROM Customers\n```\n\n额外的语法说明：正如关键字不区分大小写一样，表名列名也不区分大小写。因此，上一个示例与以下代码等同：\n\
  ```sql\nselect\n[last name]\nfrom customers\n```\n\n为了清晰起见，我们会将所有的关键字大大写打印，并在书中也将表名和列名大写，但这并非绝对必要。\n\
  ***\n\n### 数据库差异：MySQL 和 Oracle\n\n对于 MySQL，在包含空格的列名周围使用的字符是反引号（`` ` ``）。上述示例的 MySQL\
  \ 语法为：\n\n```sql\nSELECT\nFROM Customers;\n```\n\n对于 Oracle，在包含空格的列名周围使用的字符是双引号（`\"\
  `）。示例的 Oracle 语法为：\n\n```sql\nSELECT\n\"Last Name\"\n```\n\n此外，与 Microsoft SQL Server\
  \ 和 MySQL 不同，Oracle 中由双引号括的列名区分大小写。这意味着之前的语句不等同于：\n\n```sql\nSELECT\n\"LAST NAME\"\
  \n```\n\n***\n\n### Full SELECT 预览\n\n本书的大部分内容与本章介绍的 `SELECT` 语句有关。在第 3 章到第 15 章\
  \ 中，我们将扩展该语句，引入新功能，直到充分利用并理解 `SELECT` 的全部潜力和能力。到目前，我们只引入了 `SELECT` 语句的部分：\n\nSELECT\
  \ columnlist\nFROM table\n```\n\n为了消除任何剩下的悬念，让我们看看完整 `SELECT` 语句的预览，并对其各个组件进行简要注释。包含所有子句的完整\
  \ `SELECT` 语句如下\n\n```sql\nFROM tablelist\nWHERE condition\nGROUP BY columnlist\n\
  HAVING condition\nORDER BY columnlist\n```\n\n我们已经介绍了 `SELECT` 和 `FROM` 子句。让我们稍微扩展一下这些子句并谈谈其他的。`SELECT`\
  \ 子句启动语句并列出任何将显示的列。正如在后面的章节所示，`columnlist` 不仅可以包含指定表的实际列，还可以包含计算列（通常源自表中的一个或多个列）。`columnlist`\
  \ 中的列还可以包括函数，它们代表了添加转换数据常用方法的特殊方式。\n`FROM` 子句指定提取数据的源。在大多数情况下，这些数据源是表。在随后的章节中，我们将学习这些数据源也可以是其他的\
  \ `SELECT` 语句，它们代表数据的某种虚拟 `view`（视图）。在本章中，我们的 `tablelist` 是单个表。稍后章节将讨论的 SQL 关键特性之一是通过被称为\
  \ `JOIN` 的机制通过单个 `SELECT` 语句将多个表组合在一起。因此，我们将看到许多示例，`FROM` 子句中的 `tablelist` 由多行组成，表示连接在一起的表。\n\
  \n`WHERE` 子句用于指定选择逻辑。在这里你可以精确指定要检索哪些行数据。`WHERE` 子句可以使用基本的算术运算符，如等号（`=`）和大于（`>`），以及\
  \ `OR` 和 `AND` 等布尔运算符。\n\n`GROUP BY` 子句在汇总数据方面起着关键作用。通过将数据组织成小组，分析师不仅能够对数据分组，还可以通过使用各种统计（如数据的和或计数）来汇总每组数据。\n\
  \n当数据被分组后，选择标准变得有些复杂。人们必须询问选择标准适用于单行还是整个组。例如，在按州对客户分组时，可能只想查看单个客户的行，且该州所有客户的总购买金额超过了某个金额。这就是\
  \ `HAVING` 子句派上用场的地方。`HAVING` 子句用于为整组数据指定选择逻辑。\n\n\n正如在后面的章节将会明确的，`SELECT` 语句中的各种子句（如果存在）必须按照之前通用语句所示的顺序指定。例如，如果\
  \ `SELECT` 语句中有 `GROUP BY` 子句，它必须出现在 `WHERE` 子句之后、`HAVING` 子句之前。\n\n除了上述所有子句外，我们还将讨论组织\
  \ `SELECT` 语句的若干种额外方法，包括子查询和集合逻辑。\n\n\n\n当从表中选择数据时，你并不局限于表中恰好存在的列。计算字段的概念允许了许多其他可能性。通过计算字段，你可以执行以下操作：\n\
  \n• 显示特定的单词或值\n• 对单列或多列进行计算\n• 将列与特定的单词或值组合在一起\n\n让我们来看几个示例，所有示例都源自这张 `Sales`（销售）表：\n\
  \n\n### 字面量 (Literal Values)\n\n我们的第一个计算字段示例实际上根本不是一种计算。我们将选择一个特定值作为列，尽管该值与表中的数据没有任何关系。这种类型的表达式被称为\
  \ `literal value`（字面量）。这里有一个示例：\n\n```sql\nSELECT\nFirstName\nFROM Sales\n```\n\n\
  这条语句将返回此项数据：\n\n![Image](img/020tab01.jpg)\n\n\n首先注意，字面量 `'First Name:'` 在每一行都会重复。其次，第一列没有表头信息。当在\
  \ Microsoft SQL Server 中运行时，列头显示为 `(no column name)`。没有表头的原因仅仅是因为这是一个计算字段。没有可以与此信息关联的列名。\n\
  \n### 数据库差异：MySQL 和 Oracle\n\nMySQL 和 Oracle 都会在表头行中字面量返回一个值。在 MySQL 中，上一个示例中第一列的表头将显示为：\n\
  \n\n在 Oracle 中，第一列的表头将显示为：\n\n`'FIRSTNAME:'`\n\n一个可能会被问到的是，为什么表头很重要。如果我们仅使用 `SELECT`\
  \ 语句来检索某些数据，那么表头本身似乎并不重要，只有数据本身重要。然而，如果我们使用 `SELECT` 语句是为了获取显示给用户的报告（无论是在纸质上还是在计算机屏幕上）的数据，那么表头可能非常相关。列头通常在报告环境中显示。当用户查看报告中的某列数据时，他们通常想知道该列的含义，并通过查看列头来获取这些信息。对于字面量来说，该列确实没有意义，因此表头并不是真正必要的。但在其他类型的计算字段中，可能会有一个可以应用于列的有意义的标签。在本章的后面部分，我们将讨论列别名（column\
  \ aliases）的概念，它代表了在这种情况下提供表头的方法。\n\n关于字面量的另一点。你可能从上一个示例推断出所有的字面量都需要引号，但情况并非如此。例如，以下语句：\n\
  ```sql\nSELECT\n5,\nFirstName\nFROM Sales\n```\n\n\n![Image](img/021tab01.jpg)\n\
  \n字面量值 `5` 是一个有效值，即使它完全没有意义。因为它没有引号，`5` 被解释为一个数值值。\n\n### 算术计算 (Arithmetic Calculations)\n\
  \n让我们进入一个更典型的计算字段示例。算术计算允许我们对表中的一个或多个列进行计算。例如：\n点击此处查看代码图像\n\n```sql\nSELECT\nSalesID,\n\
  QuantityPurchased,\nPricePerItem,\nFROM Sales\n```\n\n这条语句将返回此项数据：\n\n![Image](img/021tab02.jpg)\n\
  \n与字面量一样，第四列没有表头，因为它不是从单列派生出来的。上述 `SELECT` 的前三列与之前看到的并无区别。第四列是一个计算列，其算术表达式如下：\n\
  点击此处查看代码图像\n\n`QuantityPurchased * PricePerItem`\n\n在这种情况下，，星号符号 `*` 表示乘法。它并不像上一章看到的那样表示“所有列”。除了星号，计算字段中还允许几种其他算术运算符。最常见的有：\n\
  \n![Image](img/022tab01.jpg)\n一个在 Microsoft SQL Server 或 MySQL 中不可用的常用算术运算符是幂。为了在\
  \ SQL 中使用指数，你必须使用 `POWER()` 函数。将在下一章中进行演示。\n\n### 数据库差异：Oracle\n\n与 SQL Server 和\
  \ MySQL 不同，Oracle 提供了一个用于幂的算术运算符。它由两个星号 `**` 表示。\n\n### 字段连接 (Concatenating Fields)\n\
  \n\n```sql\nSELECT\nSalesID,\nFirstName,\nLastName,\nFirstName + ' ' + LastName\n\
  FROM Sales\n\n检索的数据是：\n\n![Image](img/022tab02.jpg)\n\n再次，前三列没有新内容。第四列派生自 SQL 语句中的此表达式：\n\
  \n\n加号 `+` 表示连接。由于该操作涉及字符数据，因此 SQL 知道这是连接而不是加法。\n\n### 数据库差异：MySQL 和 Oracle\n\n\
  MySQL 不使用符号（如加号 `+`）来表示连接。相反，它要求使用一个名为 `CONCAT` 的函数。我们将在下一章介绍函数，现在来看相同语句在 MySQL\
  \ 中的形式：\n\n点击此处查看代码图像\n```sql\nSELECT\nSalesID,\nFirstName,\nLastName,\nCONCAT(FirstName,\
  \ ' ', LastName)\nFROM Sales\n```\n本质上，`CONCAT` 指定了组合括号内提到的三个项。Oracle 使用两个竖线 `||`\
  \ 而不是加号 `+` 来表示连接。Oracle 的等语句为：\n\n```sql\nSELECT\nSalesID,\nFirstName,\nLastName,\n\
  FROM Sales\n```\n\n### 列别名 (Column Aliases)\n\n在本章之前的所有示例中，计算字段都是以无描述性的表头显示的。Microsoft\
  \ SQL Server 在遇到计算字段时会显示 `(no column name)`。我们现在讨论如何为这些列指定描述性表头。简而言之，解决方案是使用列别名。`alias`\
  \ 一词意味着替代名称。这里有一个上一个 SELECT 语句指定列别名的示例：\n\n点击此处查看代码图像\n```sql\nSELECT\nSalesID,\n\
  FirstName,\nLastName,\nFirstName + ' ' + LastName AS 'Name'\nFROM Sales\n\n关键字 `AS`\
  \ 用于指示列别名，它紧跟在关键字之后。注意列别名被单引号包围。输出是：\n\n![Image](img/023tab01.jpg)\n\n第四列现在有了表头。在这个示例中，我们将列别名放在了单引号内。这些引号并不是严格必要的，除非列别名包含空格。此外，`AS`\
  \ 关键字并不是必要的。然而，在本书书中我们将坚持使用 `AS` 关键字，以明确这是一个列别名。如果没有单引号或 AS 关键字，上一个 SELECT 语句将写如下，结果相同：\n\
  \n```sql\nSalesID,\n```\n\n\n\n\n`FirstName`,\n`LastName`,\n\n`FirstName + ' ' +\
  \ LastName Name`\n`FROM Sales`\n\n除了为计算字段提供表头外，当表中的列名含义晦涩且你想更改它时，列别名通常也非常有用。例如，如果一个表有一个名为“Qty”的列，你可以执行此语句将该列显示为“Quantity\
  \ Purchased”（购买数量）：\n\n```sql\nQty AS 'Quantity Purchased'\nFROM table\n```\n\n\
  ***\n\n### 数据库差异：Oracle\nOracle 使用双引号来界定列别名。上述语句在 Oracle 中的写法将如下：\n\n点击此处查看代码图片\n\
  \n```sql\nSELECT\nSalesID,\nLastName,\nFirstName || ' ' || LastName AS \"Name\"\n\
  FROM Sales;\n```\n\n***\n\n### 表别名\n除了为列提供备用名称外，还可以使用相同的 `AS` 关键字为表指定别名。使用表别名通常有三个原因。第一个原因与名称模糊或复杂的表有关。例如，如果一个表名为\
  \ `Sales123`，你可以使用以下 `SELECT` 给该表一个别名 `Sales`。\n\n```sql\nSELECT\nLastName\nFROM\
  \ Sales123 AS Sales\n```\n与列别名一样，`AS` 关键字是可选的。但与列别名不同，表别名不包含在引号内。使用表别名的第二个原因是允许你将该别名用作任何所选列的前缀。例如，上面的代码也可以写成：\n\
  \n```sql\nSELECT\nSales.LastName\nFROM Sales123 AS Sales\n```\n单词 `Sales` 现在已作为前缀添加到\
  \ `LastName` 列中，并使用句号将前缀与列名分隔。在这种情况下，使用前缀是完全可选的，且有些冗余。由于此查询中只有的一张表，因此没有必要将表名作为列的前缀。然而，当从多个表中选择数据时，前缀通常很有帮助，而且有时是必须的。当涉及多个表时，添加表名作为前缀可以帮助查看查询的人快速理解每列数据来自哪张表。此外，当多个表中的列名相同时，实际上必须使用表别名。这种列别名的用法将在第\
  \ 11 章“内连接 (#ch11.html_ch11)”中进行说明。\n\n使用表别名的第三个原因与子查询中使用表有关这将在第 14 章“子查询 (#ch14.html_ch14)”中讨论。\n\
  \n***\n\n### 数据库差异：Oracle\n虽然列别名可以使用 `AS` 关键字，但 Oracle 不允许使用 `AS` 关键字表示表别名。上述 `SELECT`\
  \ 语句在 Oracle 中的写法为：\n\n```sql\nSELECT\nSales.LastName\nFROM Sales123 Sales;\n```\n\
  ***\n\n### 展望\n\n在本章，我们讨论了在 `SELECT` 语句中创建计算字段的三种通用方法。首先，可以使用字面量来选择特定的单词或值。其次，可以在单个表达式中对一个多个列应用算术计算。第三，可以使用拼接将列和字面量组合在一起。我们还讨论了列别名的相关主题，这在使用计算字段时经常用到。最后，我们对表别名进行了预览，该主题将在后面的章节中进行更详细的介绍。\n\
  \n在下一章中，我们将转向函数主题，函数提供了更复杂、更有趣的方法来执行计算。如前所述，我们还没有到可以将选择条件应用于 SQL 语句的程度。我们仍在基于 `SELECT`\
  \ 中 `columnlist` 可以执行的基础进行构建。你对这种有条理的方法的耐心将在第 6 章获得回报，那时我们将讨论选择逻辑主题。\n## 4. 使用函数\n\
  \n### 引入的关键字\n\n`LEFT` • `RIGHT` • `SUBSTRING` • `LTRIM` • `RTRIM` • `UPPER` • `LOWER`\
  \ • `GETDATE` • `DATEPART` • `DATEDIFF` • `ROUND` • `PI` • `POWER` • `ISNULL`\n\n\
  任何熟悉 Microsoft Excel 的人可能都知道函数为典型的电子表格用户提供了巨大的功能。如果没有函数的能力，电子表格中大部分可用数据将价值有限。在 SQL\
  \ 世界中也是如此。熟悉 SQL 函数将极大地增强你为任何查看数据或 SQL 生成报告的人生成动态结果的能力。\n本章涵盖了四个不同类别中的许多常用函数：字符函数、日期/时间函数、数值函数和转换函数。此外，我们还将讨论复合函数——一种将多个函数组合成单个表达式的方法。\n\
  \n### 什么是函数？\n\n与上一章涵盖的计算类似，函数提供了处理数据的另一种方式。如所见，计算可以涉及多个字段，通过如乘法等算术运算符，或者通过拼接来实现。同样，函数可以涉及来自多个值的数据，但函数的最终结果始终是一个值。\n\
  \n什么是函数？函数仅仅是用于任意数量输入值转换为一个输出值的规则。该规则定义在函数内部且无法更改。然而，函数用户允许为输入指定任何所需的值。某些函数可能允许某些输入是可选的。这意味着特定输入的指定并不是必须的。函数也可以设计为没有输入。然而，无论输入的类型或数量，函数始终返回一个输出值。\n\
  函数有两种类型：标量和聚合。“标量”一词源于数学，指的是对单个数字的操作。在计算机使用中，这意味着函数在单行数据上执行。例如，`LTRIM` 函数删除值的左空格。\n\
  \n相反，聚合函数旨在用于更大的数据集。例如，`SUM` 函数可以计算某列所有值的和。由于聚合函数适用于更大的集合或组，我们将这类函数的讨论留到第 9 章“汇总数据\
  \ (#ch09.html_ch09)。”\n\n每个 SQL 数据库都提供许多标量函数。实际函数在名称和工作方式上之间差异很大。因此，我们仅涵盖一些常用函数的代表性示例。\n\
  \n最常见的标量函数可以归分为三类：字符、日期/时间和数值。这些是允许你操作字符、日期/时间或数值数据类型的函数。此外，我们将讨论一些实用的转换函数，可以将数据从一种数据类型转换为另一种。\n\
  ### 字符函数\n\n字符函数是能够处理字符数据的函数。正如字符数据类型有时被称为字符串数据类型，字符函数有时被称为字符串函数。我们将涵盖这七个字符函数示例：`LEFT`、`RIGHT`、`SUBSTRING`、`LTRIM`、`RTRIM`、`UPPER`\
  \ 和 `LOWER`。\n\n在本章中，我们不是从特定表中检索数据，而是简单地使用带有字面量值的 `SELECT` 语句。将没有用于指示表的 `FROM` 子句。让我们从\
  \ `LEFT` 函数的示例开始。当执行此 SQL 命令时：\n\n```sql\nLEFT('sunlight',3) AS 'The Answer'\n```\n\
  \n返回此数据：\n\n![Image](img/028tab01.jpg)\n\n\n\n\n在此 SQL 语句中包含列别名允许输出将“The Answer”显示为列标题。注意，`SELECT`\
  \ 语句中没有 `FROM` 子句。我们并不是从表中检索数据，而是从一个单一字面量（即‘sunlight’）中选择数据。在许多 SQL 实现中（包括 SQL Server\
  \ 和 MySQL）中，`SELECT` 语句并不严格需要 `FROM` 子句，尽管在实践中很少会写这样的 `SELECT` 语句。我们使用这种不带 `FROM`\
  \ 子句的格式，是为了更方便地说明函数的工作原理。\n\n现在让我们详细查看该函数的格式。`LEFT` 函数的一般格式为：\n\n\n```\nLEFT(CharacterValue,\
  \ NumberOfCharacters)\n```\n\n所有函数在括号内都有任意数量的参数。例如，`LEFT` 函数有两个参数：`CharacterValue`\
  \ 和 `NumberOfCharacters`。*argument*（参数）一词是一个常用的数学术语，用于描述函数的组成部分，与任何不悦或或不愉快的事无关。为每个函数定义的各种参数真正定义了函数的含义。在\
  \ `LEFT` 函数的情况下，`CharacterValue` 和 `NumberOfCharacters` 参数都是必要的，用于定义调用 `LEFT` 函数时会发生什么。\n\
  \n`LEFT` 函数有两个参数，且两个都是必须的。正如前面提到的，其他函数可能有更多或更少的参数。函数甚至允许没有参数。但无论参数数量多少（即使为零），所有函数在函数名后都有一组括号。括号的存在告诉你是该表达式是一个函数而不是其他东西。\n\
  `LEFT` 函数的公式是：获取指定的 `CharacterValue`，查看左侧指定的 `NumberOfCharacters`，并返回结果。在之前的例中，它查看了\
  \ `CharacterValue` ‘sunlight’ 并返回左侧三个字符。结果是“sun”。\n\n需要记住的主要点是，对于你任何想要使用的函数，你都需要在数据库参考指南中查找该函数，并确定需要多少参数以及它们的含义是什么。\n\
  \n我们将涵盖的第二个字符函数是 `RIGHT` 函数。这与 `LEFT` 函数相同，不同在于现在指定输入值右侧的字符。`RIGHT` 函数的一般格式为：\n\n\
  点击此处查看代码图像\n```\nRIGHT(CharacterValue, NumberOfCharacters)\n```\n\n例如：\n\n点击此处查看代码图像\n\
  ```\nSELECT\n\nRIGHT('sunlight',5) AS 'The Answer'\n```\n\n返回：\n![Image](img/029tab01.jpg)\n\
  \n在这种情况下，`NumberOfCharacters` 参数需要值为 5 才能返回值“light”。如果值为 3，则只会返回“ght”。\n\n使用 `RIGHT`\
  \ 函数时经常出现的一个问题是，字符数据通常在右侧包含空格。让我们来看一个示例，一个仅有一行数据的表包含一个名为 `President` 的列，该列被定义为长度\
  \ 20 个字符。表所示：\n\n![Image](img/030tab01.jpg)\n如果我们对该表执行此 `SELECT` 语句：\n\n点击此处查看代码图像\n\
  \n```\nSELECT\n\n\nFROM table1\n```\n\n我们得到了这些数据：\n\n![Image](img/030tab02.jpg)\n\
  我们预期得到“Washington”，但只得到了“hington”。问题是整个列的长度为 20 个字符。在这个示例中，值“George Washington”右侧有三个空格。因此，当我们请求最右侧的\
  \ 10 个字符时，SQL 将取三个空格，加上原始表达式中的另外七字符。正如很快看到的，在使用 `RIGHT` 函数之前，必须使用 `RTRIM` 函数来删除末尾空格。\n\
  \n你可能会好奇如何从表达式的中间选择数据。这是通过使用 `SUBSTRING` 函数实现的。该函数的一般格式为：\n\n点击此处查看代码图像\n\n```\n\
  ```\n\n例如：\n\n点击此处查看代码图像\n\n```\nSELECT\nSUBSTRING('thewhitegoat',4,5) AS 'The Answer'\n\
  ```\n\n返回此数据：\n\n![Image](img/030tab03.jpg)\n\n\n***\n\n### 数据库差异：MySQL 和 Oracle\n\
  \nMySQL 有时要求函数名和左括号之间不能有空格。这取决于所使用的特定函数。例如，MySQL 中的上一个语句必须完全按照所示编写。与 Microsoft SQL\
  \ Server 不同，你不能在 `SUBSTRING` 之后输入额外的空格。\n\n\n如所述，Oracle 不允许编写不带 `FROM` 子句的 `SELECT`\
  \ 语句。然而，Oracle 提供了一个名为 `DUAL` 的虚拟表用于这种情况。带有 `SUBSTRING` 函数的 `SELECT` 的 Oracle 等效语句为：\n\
  \n点击此处查看代码图像\n\n```\nSELECT\nSUBSTR('thewhitegoat',4,5) AS \"The Answer\"\n\nFROM\
  \ DUAL;\n```\n\n***\n\n\n点击此处查看代码图像\n\n```\nSELECT\n\nLTRIM('   apple') AS 'The\
  \ Answer'\n\n返回此数据：\n\n![Image](img/031tab01.jpg)\n\n注意 `LTRIM` 足够聪明不会消除短语中间的空格。它只移除字符最左侧的空格。与\
  \ `LTRIM` 类似，`RTRIM` 函数移除字符值右侧的任何空格。下一节将在复合函数部分给出一个示例。\n\n\n点击此处查看代码图像\n\n```\n\
  SELECT\n\nUPPER('Abraham Lincoln') AS 'Convert to Uppercase',\nLOWER('ABRAHAM LINCOLN')\
  \ AS 'Convert to Lowercase'\n```\n\n输出是：\n\n![Image](img/031tab02.jpg)\n\n\n函数的一个重要特性（无论是字符、数学还是日期/时间函数）是两个或多个函数可以组合以创建复合函数。两个函数的复合函数可以被认为是函数的函数。让我们回到\
  \ George Washington 的查询来说明。再次，我们根据这些数据操作：\n\n![Image](img/032tab01.jpg)\n\n记得 `President`\
  \ 列的长度为 20 个字符。换句话说，值“George Washington”右侧有三个空格。除了说明复合函数，接下来的示例还将涵盖上一节提到的 `RTRIM`\
  \ 函数。语句：\n\n\n```\nSELECT\n\nRIGHT(RTRIM (President),10) AS 'Last Name'\n\nFROM\
  \ table1\n\n返回此数据：\n\n![Image](img/032tab02.jpg)\n\n\n\n为什么现在它会产生正确的值？让我们检查这个复合函数是如何工作的。这里涉及两个函数：`RIGHT`\
  \ 和 `RTRIM`。在评估复合函数时，你总是从内部开始向外处理。在这个示例中，最内层的函数是：\n\n```\nRTRIM(President)\n```\n\
  \n该函数获取 `President` 列中的值并删除所有右侧的空格。完成后，将 `RIGHT` 函数应用于结果，以取回所需的值。由于 `RTRIM(President)`\
  \ 等于“George Washington”，我们可以说：\n```sql\nSELECT\nRIGHT(RTRIM (President), 10)\n```\n\
  \n等同于：\n\n\n```sql\nSELECT\nRIGHT('George Washington', 10)\n```\n\n换句话说，我们可以通过先对输入数据应用\
  \ `RTRIM` 函数，然后在表达式中添加 `RIGHT` 函数来获得所需的结果。\n### 日期/时间函数\n\n日期/时间函数允许对日期和时间值进行操作。这些函数的名称取决于所使用的数据库。在\
  \ Microsoft SQL Server 中，我们将涵盖的函数称为 `GETDATE`、`DATEPART` 和 `DATEDIFF`。\n\n日期/时间函数中最简单的是返回当前日期和时间的函数。在\
  \ Microsoft SQL Server 中，该函数名为 `GETDATE`。此函数没有参数。它仅仅返回当前的日期和时间。例如：\n\n```sql\n```\n\
  \n返回一个带有当前日期和时间的表达式。由于 `GETDATE` 函数没有参数，因此括号之间没有指定内容。记住，日期/时间字段是一种特殊的数据类型，在单个字段中同时包含日期和时间。此类值的示例是：\n\
  \n`2017-05-15 08:48:30`\n\n该值指的是 2017 年 5 月 15 日，上午 8 点过 48 分 30 秒。\n### 数据库差异：MySQL\
  \ 和 Oracle\n\n在 MySQL 中，`GETDATE` 的等价物是 `NOW`。上面的语句将写为：\n\n```sql\nSELECT NOW()\n\
  ```\n\n\n```sql\nSELECT CURRENT_DATE\n```\n\n下一个日期/时间函数允许我们分析任何指定的日期并返回一个表示此类元素（如日期的日或周）的值。同样，此函数的名称取决于数据库。在\
  \ Microsoft SQL Server 中，此函数称为 `DATEPART`。其通用格式为：\n\nDATEPART(DatePart, DateValue)\n\
  ```\n\n`DateValue` 参数可以是任何日期。`DatePart` 参数可以许多不同的值，包括年、季度、月、年中的第、日、周、星期、小时、分钟和秒。\n\
  \n下表显示了 `DATEPART` 函数如何评估日期 '5/6/2017$，带有不同的 `DatePart` 参数值：\n\n\n查看上一个表中的值，你可以看到\
  \ 5/6/2017 的月份是 5（5 月）。日期是 2（星期一）。周是 18，因为 5/6/2017 处于该年的第 18 周。星期是 7，因为 5/6/2017\
  \ 落在星期六，这是一周的第七天。\n\n### 数据库差异：MySQL 和 Oracle\n\n在 MySQL 中，`DATEPART` 函数的等价物名为 `DATE_FORMAT`，它对\
  \ `DateValue` 参数使用不同的值。例如，要返回日期 ‘5/6/2017’的日，你将在 MySQL 中执行此 `SELECT` 语句：\n\n\n```sql\n\
  SELECT DATE_FORMAT('2017-05-06', '%d');\n```\n\nOracle 没有与 `DATEPART` 的函数。\n\n\n\
  点击此处查看代码图像\n\n```\nDATEDIFF (DatePart, StartDate, EndDate)\n```\n\n该函数 `DatePart`\
  \ 参数的有效值包括年、季度、月、年中的第、日、月、小时、分钟和秒。以下图表显示了 `DATEDIFF` 函数如何评估日期 7/8/2017 和 8/14/2017\
  \ 之间的差异，带有不同的 `DatePart` 参数值：\n\n![图像](img/034tab01.jpg)\n\n上表表明，两个日期之间有 37 天、6\
  \ 周、1 个月或 0 年。\n\n### 数据库差异：MySQL 和 Oracle\n\n在 MySQL 中，`DATEDIFF` 函数仅允许你计算两个日期之间的天数，且结束日期必须先列出，以返回正值。通用格式为：\n\
  点击此处查看代码图像\n\n```sql\nDATEDIFF(EndDate, StartDate)\n```\n\n\n\n`CAST(Expression\
  \ AS DataType)`\n\n此函数的格式与之前看到的其他函数略有不同，因为它使用单词 `AS` 来分隔两个参数，而不是逗号。观察该函数的用法，可以发现在大多数情况下，`CAST`\
  \ 函数并不是必需的。让我们来看在想要执行以下语句时的情况，此时 `Quantity` 列被定义为字符数据类型：\n\n```sql\nSELECT\nFROM\
  \ table\n```\n\n你的第一印象可能是该语句会执行失败，因为 `Quantity` 没有被定义为数值列。然而，大多数 SQL 数据库都足够智能，能够自动将\
  \ `Quantity` 列转换为数值，以便能够乘以 2。\n\n这里有一个 `CAST` 函数变得必需的示例。假设我们有一个存储在字符数据类型列中的日期。我们希望将这些日期转换为真正的日期/时间列。这条语句阐述说明了\
  \ `CAST` 函数如何处理这种转换：\n\n\n```sql\nSELECT\n'2017-04-11' AS 'Original Date',\nCAST('2017-04-11'\
  \ AS DATETIME) AS 'Converted Date'\n```\n\n\n![Image](img/037tab01.jpg)\n\n`Original\
  \ Date` 列看起来像是一个日期，但它实际上只是字符数据。相比之下，`Converted Date` 列是一个真正的日期/时间列，现在显示的时间值就证明了这一点。\n\
  \n另一个有用的转换函数是将 `NULL` 值转换为有意义的值。在 Microsoft SQL Server 中，该函数被称为 `ISNULL`。正如在第 1\
  \ 章中提到的，“关系数据库与 SQL”，`NULL` 值是指那些缺失数据的值。`NULL` 值不等同于空格或零。假设我们有这样的一张产品表：\n\n\n注意打印机\
  \ A 在 `Weight` 列中的值为 `NULL`。这表示尚未提供该打印机的重量。假设我们想要生成所有产品的列表。当执行此 `SELECT` 语句时：\n\n\
  ```sql\nSELECT\nDescription,\nWeight\n```\n\n它将显示：\n\n![Image](img/038tab01.jpg)\n\
  \n这种显示并没有不准确之处。然而，用户可能更喜欢看到缺失值看到“Unknown”（未知）而不是 `NULL`。以下是解决方案：\n点击此处查看代码图片\n\n\
  ```sql\nSELECT\nDescription,\nISNULL(CAST(Weight AS VARCHAR),'Unknown') AS Weight\n\
  FROM Products\n\n显示出以下数据：\n\n![Image](img/038tab02.jpg)\n\n注意，该解决方案需要同时使用 `ISNULL`\
  \ 和 `CAST` 函数。当遇到 `NULL` 值时，`ISNULL` 函数负责将重量显示为“Unknown”。假设 `Weight` 列被定义为整数，则需要\
  \ `CAST` 函数将重量转换为 `Varchar` 数据类型，这样就可以在单列中同时显示整数值和字符值了。\n\n\n### 数据库差异：MySQL 和 Oracle\n\
  \n`ISNULL` 函数在 MySQL 中被称为 `IFNULL`。此外，MySQL 在此示例中并不需要使用 `CAST` 函数。上述语句在 MySQL 中的等效写法为：\n\
  \n点击此处查看代码图片\n\nSELECT\nDescription,\nIFNULL(Weight,'Unknown') AS Weight\nFROM Products;\n\
  ```\n\n`ISNULL` 函数在 Oracle 中被称为 `NVL`（Null Value）。Oracle 的等效语句为：\n点击此处查看代码图片\n\n\
  ```sql\nSELECT\nDescription,\nNVL(CAST(Weight AS CHAR),'Unknown') AS Weight\nFROM\
  \ Products;\n\n此外，与 Microsoft SQL Server 和 MySQL 不同，Oracle 在遇到 `NULL` 值时会显示一个折号而不是\
  \ `NULL` 单词。\n\n***\n\n### 展望\n\n\n由于可用的函数非常多且可能性各异，无法讨论每一个可用函数的每一个细微差别。需要记住的是，当需要使用函数时，可以很容易地在数据库的帮助系统或参考指南中查找。在线参考资料将提供每个函数具体如何工作以及正确语法的详细信息。\n\
  \n在下一章中，我们将暂缓 `columnlist` 问题，讨论一些更有趣的内容：如何对数据进行排序。排序可以有很多用途，并满足用户以某种顺序查看数据的基本需求。通过排序，我们将开始考虑信息呈现的整体方式，而不仅仅是单个数据项的碎片信息。\n\
  \n## 5. 数据排序\n\n`ORDER BY` • `ASC` • `DESC`\n\n以排序方式呈现数据的能力对于许多任务至关重要。`ORDER BY`\
  \ 用于指定排序，而 `ASC`（升序）和 `DESC`（降序）用于指定排序的方向。\n\n排序的想法适用于许多场景，即使数据是按字母排列的，也能快速找到特定的客户。从小到大排序，即使数据是按日期顺序排列的。\n\
  \n### 升序排序\n\n这是带有 `ORDER BY` 子句的 `SELECT` 语句的通用格式：\n\n```sql\nSELECT columnlist\n\
  FROM tablelist\nORDER BY columnlist\n\n`ORDER BY` 子句始终位于 `FROM` 子句之后，而 `FROM` 子句又位于\
  \ `SELECT` 关键字之后。`columnlist` 表示 `SELECT` 中可以列出多个列。`columnlist` 中的列可以是单个列，也可以是复杂的表达式。此外，`SELECT`\
  \ 和 `ORDER BY` 中指定的列可以是完全不同的列。`tablelist` 表示在 `FROM` 子句中可以列出多个表。列出多个表的语法将在第 11 章“内连接”以及以及第\
  \ 12 章“外连接”中介绍。\n\n对于接下来的几个排序示例，我们将从此 Salespeople 表中的数据开始：\n\n![Image](img/042tab01.jpg)\n\
  \n\n```sql\nSELECT\nFirstName,\nLastName\nFROM Salespeople\nORDER BY LastName\n\n\
  带回以下数据：\n\n![Image](img/042tab02.jpg)\n\n因为有两个 Brown（Carla 和 Gregory），我们无法预测哪一个会先列出来。这是因为我们只对\
  \ `LastName` 进行排序，而有多个行的姓氏相同。\n\n\n```sql\nSELECT\nFirstName,\nLastName\nFROM Salespeople\n\
  ORDER BY FirstName\n\n那么检索到以下数据：\n\n![Image](img/042tab03.jpg)\n\n现在的顺序完全不同了，因为排序是根据名字而不是姓氏。\n\
  \n\n\n\nSQL 提供了一个名为 `ASC` 的特殊关键字，代表 `ascending`（升序）。该关键字是完全可选的，而且很大程度上是没有必要的，因为默认情况下所有排序都按升序排列。以下使用\
  \ `ASC` 关键字的 `SELECT` 语句返回与之前相同的数据。\n\n```sql\nSELECT\nLastName\nFROM Salespeople\n\
  ORDER BY FirstName ASC\n```\n\n从本质上说，关键字 `ASC` 可以强调排序是升序而非降序。\n\n\n`DESC` 关键字按与\
  \ `ASC` 相反的顺序进行排序。这种排序的顺序不是升序，而是降序。例如：\n\n```sql\nSELECT\nFirstName,\nLastName\n\
  ORDER BY FirstName DESC\n```\n\n检索到：\n\n![Image](img/043tab01.jpg)\n\n\n### 按多列排序\n\
  \n我们现在回到如何处理 Brown 家族的问题。当有多个姓相同的相同的时，为了按姓氏排序，我们必须添加按名字的次要排序，如下：\n\n```sql\nSELECT\n\
  LastName\nFROM Salespeople\nORDER BY LastName, FirstName\n```\n\n这返回了：\n\n\n由于现在指定了第二个排序列，我们可以确定\
  \ Carla Brown 将出现在 Gregory Brown 之前。注意，在 `ORDER BY` 子句中，`LastName` 必须列在 `FirstName`\
  \ 之前。列的顺序很重要。第一个第一个列始终具有主排序值。任何列出的额外列将成为次级、三级，此类推。\n\n### 按计算字段排序\n\n我们现在把从第 3 章中中学的计算字段和别名的知识应用于说明排序的一些进一步可能性。此语句：\n\
  \n\n```sql\nSELECT\nLastName + ', ' + FirstName AS 'Name'\nFROM Salespeople\nORDER\
  \ BY Name\n```\n返回此数据：\n\n![Image](img/044tab02.jpg)\n\n如所示，我们利用字符串拼接创建了一个别名为 `Name`\
  \ 的计算字段。我们可以在 `ORDER BY` 子句中引用同一个列别名。这很好地说明了使用列别名的另一个好处。此外，注意计算字段本身的设计。我们在姓氏列和名字列之间插入了一个列和一个空格以将它们分开，并以常用的格式显示名称。方便的是，这种格式也非常适合排序。以这种格式显示名称（用逗号分隔姓和名）是一个值得记住的实用技巧。用户经常希望看到按这种方式排列的名称。\n\
  \n在 `ORDER BY` 子句中直接使用计算字段而不将其用作列别名也是也是可以的。与上述方法类似，我们还可以指定：\n```sql\nSELECT\nFirstName,\n\
  LastName\nFROM Salespeople\nORDER BY LastName + FirstName\n```\n这将显示：\n\n![Image](img/045tab01.jpg)\n\
  \n数据的排序方式与前一个示例相同（此处原文逻辑可能有误，应为与前一个示例相同）。唯一的区别是我们现在在 `ORDER BY` 子句中指定了一个计算字段，而没有使用列别名。这产生的结果与将\
  \ `LastName` 和 `FirstName` 指定为主、次排序列的结果相同。\n\n### 排序序列\n在之前的示例中，所有数据都是字符数据，由从 A\
  \ 到 Z 的字母组成。没有数字或特殊字符。此外，还没有考虑大写和小字母。\n\n每个数据库都允许用户指定或自定义排序规则（collation）设置，这些设置提供了数据如何排序的详细信息。设置在数据库之间有所异，但通常有三个事实。首先，当数据按升序排序时，任何带有\
  \ `NULL` 值的数据都会首先出现。正如之前讨论的，`NULL` 值是指缺失的数据。在任何 `NULL` 之后，数字将出现在字符之前。对于降序排序的数据，字符数据将首先显示，然后是数字，最后是\
  \ `NULL`。\n\n其次，对于字符数据，通常不区分大小写。`e` 的处理方式与 `E` 相同。第三，对于字符数据，组成值的单个字符是从左到右评估的。如果是字母，那么\
  \ `AB` 将在 `AC` 之前。让我们看一个来自表的示例，我们将其称为 `TableForSort`：\n\n![Image](img/045tab02.jpg)\n\
  在该表中，`CharacterData` 列被定义为字符列，例如 `VARCHAR`（变长数据类型）。同样，`NumericData` 列被定义为数值列，例如\
  \ `INT`（整数数据类型）。没有数据的值显示为 `NULL`。当对 `TableForSort` 表执行此 `SELECT` 语句时：\n\n```sql\n\
  SELECT\nNumericData\nFROM TableForSort\nORDER BY NumericData\n\n它将显示：\n\n![Image](img/046tab01.jpg)\n\
  \n注意 `NULL` 首先出现，然后按数字顺序排列数字。如果我们想让 `NULL` 值假设默认值为 0，我们可以使用上一章讨论的 `ISNULL` 函数并执行此\
  \ `SELECT` 语句：\n\n\n```sql\nSELECT\nISNULL(NumericData,0) AS 'NumericData'\nFROM\
  \ TableForSort\nORDER BY ISNULL(NumericData,0)\n```\n现在的结果是：\n\n![Image](img/046tab02.jpg)\n\
  \n`ISNULL` 函数将 `NULL` 值转换为 0，导致了不同的排序顺序。\n\n将 `NULL` 值显示为 `NULL` 还是 0 取决于具体情况。如果用户认为\
  \ `NULL` 是数据的缺失，那么显示 `NULL` 是恰当的。对同一表转向另一个 `ORDER BY` 子句，如果我们执行此 `SELECT`：\n```sql\n\
  SELECT\nCharacterData\nFROM TableForSort\nORDER BY CharacterData\n```\n\n\n![Image](img/047tab01.jpg)\n\
  \n如预期的，`NULL` 首先出现，然后是带有数字的值，然后是字母字符。注意 23 在 5 之前。这是因为 23 和 5 的值被评估为字符而不是数字。因为字符数据是从左到右评估的，且\
  \ 2 小于 5，所以 23 在前。\n\n### 展望\n\n\n在本章的开头，我们提到了排序的一些通用用途。主要用途是将数据放置在易理解的顺序中，从而允许用户快速找到所需的信息。另一种有趣的排序用法将在第\
  \ 6 章中的“选择标准”中介绍。在该章中，我们将引入 `TOP` 关键字以及与之结合使用的另一种排序方法。这种技术被称为 Top N 排序，允许我们执行诸如显示特定时间范围内订单前五个客户的操作。\n\
  \n\n\n\n到此为止，我们看到的 `SELECT` 语句总是会返回表中的每一行。在现实世界中，这种情况很少见。通常我们只对检索符合特定标准的数据感兴趣。例如，如果你在查询订单，你可能只想查看符合某些条件的订单。在查看产品时，你通常只想查看某些类型的产品。很少有人想简单地查看所有内容。你对数据的兴趣通常指向这些数据中的一小部分集，以便分析或查看某个特定方面。\n\
  ## 应用选择标准\n\nSQL 中的选择标准从 `WHERE` 子句开始。`WHERE` 关键字完成了选择行子集的任务。这是 `SELECT` 语句的通用格式，包含了\
  \ `WHERE` 子句以及之前讨论过的其他子句：\n\n```sql\nSELECT columnlist\nFROM tablelist\nORDER BY\
  \ columnlist\n```\n\n可见，`WHERE` 子句必须位于 `FROM` 和 `ORDER BY` 子句之间。事实上，如果使用了任何子句，它们必须按照上述所示顺序出现。\n\
  \n让我们来看一个示例，取自此 `Sales` 表中的数据：\n\n\n我们将从一个带有简单 `WHERE` 子句的语句开始：\n\n```sql\nSELECT\n\
  FirstName,\nLastName,\nFROM Sales\nWHERE LastName = 'Carpenter'\n```\n\n输出结果：\n\n\
  ![Image](img/050tab01.jpg)\n因为 `WHERE` 子句规定选择 `LastName` 等于‘Carpenter’的行，因此表中的三行中只返回了一行。注意，`LastName`\
  \ 列的预期值被括在引号中，是因为 `LastName` 是一个字符列。对于数值字段，不需要引号。例如，以下 `SELECT` 同样有效并返回相同的数据：\n\n\
  ```sql\nSELECT\nFirstName,\nLastName,\nQuantityPurchased\nWHERE QuantityPurchased\
  \ = 5\n```\n\n### WHERE 子句运算符\n\n在之前的语句中，等号（`=`）被用作 `WHERE` 子句中的运算符。等号表示相等性测试。上述所示的通用格式要求\
  \ `WHERE` 子句后跟着一个 `condition`。该条件由一个运算符以及两侧的表达式组成。\n\n\n![Image](img/050tab02.jpg)\n\
  \n更高级的运算符将在下一章中介绍。\n\n等号（`=`）和不等（`<>`）运算符的含义应该是显而易见的。这里有一个带有“大于”运算符的 `WHERE` 子句示例，取自同一个\
  \ `Sales` 表：\n\nSELECT\nFirstName,\nLastName,\nQuantityPurchased\nFROM Sales\nWHERE\
  \ QuantityPurchased > 6\n```\n结果是：\n\n![Image](img/051tab01.jpg)\n\n在这个示例中，只有一行符合\
  \ `QuantityPurchased` 列大于 6 的条件。虽然不像数值字段那么常用，但在文本列上使用“大于”运算符也是可能的。这个示例：\n\n```sql\n\
  FirstName,\nLastName\nFROM Sales\nWHERE LastName > 'K'\n```\n\n返回了：\n![Image](img/051tab02.jpg)\n\
  \n因为测试的是大于 K 的姓氏，所以它只返回了 Li 和 White，而没有返回 Carpenter。当应用于文本字段时，大于和小于运算符表示按值的字母顺序进行选择。在这种情况下，返回了\
  \ Li 和 White，因为在字母表中 L 和 W 排在 K 之后。\n\n## 限制行数\n\n我们有时可能想选择表中的一小部分行，但不在乎返回的是哪些行。假设我们有一张有\
  \ 50,000 行的表，只想看几行数据来看看它长什么样。为了这个目的使用 `WHERE` 子句是没有意义的，因为我们不在乎返回的是哪些特定的行。\n对于这种情况，解决方案是使用一个特殊的关键字来指定返回行数的数量限制。这是数据库之间语法不同的另一个实例。在\
  \ Microsoft SQL Server 中，实现此限制的关键字是 `TOP`。通用格式为：\n\n```sql\nSELECT\nTOP number columnlist\n\
  FROM tablelist\n```\n***\n\n### 数据库差异：MySQL 和 Oracle\n\nMySQL 使用关键字 `LIMIT` 而不是\
  \ `TOP`。通用格式为：\n\n```sql\nFROM tablelist\nLIMIT number\n```\n\nOracle 使用关键字 `ROWNUM`\
  \ 而不是 `TOP`。`ROWNUM` 关键字必须在 `WHERE` 子句中指定，如下：\n\n```sql\nFROM tablelist\nWHERE ROWNUM\
  \ <= number\n```\n\n***\n\n假设我们想查看表的前 10 行。实现此点的 `SELECT` 语句如下：\n```sql\nSELECT\n\
  TOP 10 *\nFROM table\n```\n\n该语句返回表中的前 10 行的所有列。与任何不带 `ORDER BY` 子句的 `SELECT` 语句一样，没有办法预测将返回哪\
  \ 10 行。这取决于数据在表中的物理存储方式。\n同样，我们可以列出要返回的特定列：\n\n```sql\nSELECT\nTOP 10\ncolumn1,\n\
  column2\n```\n\n本质上，`TOP` 关键字实现了与 `WHERE` 子句类似的功能，因为它返回了一个行的行子集。然而，请记住，使用 `TOP`\
  \ 关键字返回的行并不是统计意义上的随机样本，取决于数据的物理存储。\n\n### 结合排序限制行\n\n`TOP` 关键字的另一个用法是结合 `ORDER BY`\
  \ 子句使用，以获取指定数量的最大值。这种数据选择通常被称为 Top N 选择。这里有一个示例，取自 `Books` 表：\n![Image](img/053tab01.jpg)\n\
  \n假设我们想看本月销量最多的三本书。实现此点的 `SELECT` 语句是：\n\n```sql\nSELECT\nTOP 3\nQuantitySold AS\
  \ 'Quantity Sold'\nFROM Books\nORDER BY QuantitySold DESC\n```\n\n输出是：\n\n\n让我们详细检查此语句。第二行的\
  \ `TOP 3` 表示只返回三行数据。主要问题是它是如何确定哪三行的。答案在 `ORDER BY` 子句中。如果没有 `ORDER BY` 子句，那么 `SELECT`\
  \ 将简单地返回任意三行。然而，这并不是我们想要的。我们正在寻找销量最高三行。为了实现这一点，我们需要按 `QuantitySold` 列对行进行降序排序。为什么要降序？当数据按降序排序时，最大的数字在前。如果我们按升序排序，我们将得到销量最低的书，而不是最多的。\n\
  \n现在让我们为这个场景再增加一个转折。假设我们只想看莎士的哪本书销量最多。为了实现这一点，我们需要添加一个 `WHERE` 子句，如下：\n\n```sql\n\
  SELECT\nTitle AS 'Book Title',\nQuantitySold AS 'Quantity Sold'\nFROM Books\nWHERE\
  \ Author = 'Shakespeare'\nORDER BY QuantitySold DESC\n```\n\n\n![Image](img/054tab01.jpg)\n\
  \n`WHERE` 子句增加了仅查看莎士比亚作品的限定。我们还修改了 `TOP` 关键字以指定 `TOP 1`，表示只想看一行数据。\n\n### 模式匹配\n\
  \n\n\n现在我们想转向一种待检索数据没有精确定义的情况。我们经常希望根据对单词或短语的不精确匹配来查看数据。例如，你可能感兴趣寻找名称中包含“bank”（银行）单词的公司。通过短语内的不精确匹配选择数据通常被称为\
  \ `pattern matching`（模式匹配）。在 SQL 中，`LIKE` 运算符用于 `WHERE` 子句，使我们能够对列值的部分内容进行匹配查找。`LIKE`\
  \ 运算符要求使用特殊的通配符字符来指定匹配的具体工作方式。让我们从下面 Movies 表格中的一个示例开始。\n\n![Image](img/054tab02.jpg)\n\
  \n我们使用 `LIKE` 运算符的第一个示例是：\n点击此处查看代码图片\n\n```\nSELECT\nMovieTitle AS 'Movie'\nFROM\
  \ Movies\nWHERE MovieTitle LIKE '%LOVE%'\n\n在这个示例中，百分号（%）被用作通配符。百分号（%）通配符意味着 `any\
  \ characters`（任何字符）。任何字符包括了没有字符的情况。`LOVE` 之前的百分号（%）意味着我们将接受 `LOVE` 之前有任何（或没有）字符的短语。同样，`LOVE`\
  \ 之后的百分号（%）意味着我们将接受 `LOVE` 之后有任何（或没有）字符的短语。换句话说，我们正在寻找任何包含 `LOVE` 单词的电影标题。这里是来自\
  \ `SELECT` 返回的数据：\n\n![Image](img/055tab01.jpg)\n\n注意，`LOVE` 作为第一个单词、最后一个单词，有时出现在电影标题的中间。\n\
  \n\n### 数据库差异：Oracle\n\n与 Microsoft SQL Server 和 MySQL 不同，Oracle 在确定字面量值的匹配时是区分大小写的。在\
  \ Oracle 中，`LOVE` 不等于 `Love`。Oracle 中的等效语句是：\n\n点击此处查看代码图片\n\nSELECT\nMovieTitle\
  \ AS Movie\nFROM Movies\nWHERE MovieTitle LIKE '%LOVE%';\n```\n\n这将不会返回任何数据，因为没有一个电影标题包含全大写的\
  \ `LOVE` 单词。Oracle 中的一种解决方案是使用 `UPPER` 函数将数据转换为大写，如下所示：\n点击此处查看代码图片\n\n```\nSELECT\n\
  MovieTitle AS Movie\nFROM Movies\nWHERE UPPER(MovieTitle) LIKE '%LOVE%';\n\n***\n\
  \n现在让我们尝试只查找以 `LOVE` 开头的电影。如果我们发布：\n\n点击此处查看代码图片\n\nSELECT\nMovieTitle AS 'Movie'\n\
  FROM Movies\nWHERE MovieTitle LIKE 'LOVE%'\n```\n\n我们将只检索到这些数据：\n![Image](img/055tab02.jpg)\n\
  \n因为我们现在只在 `LOVE` 单词之后指定百分号（%）通配符，所以我们只得到以 `LOVE` 开头的电影。同样，如果我们发布：\n\n```\nSELECT\n\
  MovieTitle AS 'Movie'\nWHERE MovieTitle LIKE '%LOVE'\n```\n\n我们只得到这些数据：\n\n![Image](img/056tab01.jpg)\n\
  \n\n人们可能会问如何安排通配符，以便只看到在标题中间包含 `LOVE` 单词的电影，而不看到 `LOVE` 在开头或结尾的电影。解决方案是指定：\n\n```\n\
  SELECT\nMovieTitle AS 'Movie'\nFROM Movies\n```\n\n注意，在 `LOVE` 单词和两侧的百分号（%）通配符之间插入了一个空格。这确保了该单词的两侧至少有一个空格。从该语句带的数据是：\n\
  \n![Image](img/056tab02.jpg)\n\n### 通配符\n百分号（%）符号是与 `LIKE` 运算符最常用的通配符，但还有其他几种可能性。这些包括下划线字符（`_`）、方括号括起来的\
  \ `characterlist`（字符列表），以及脱符号（`^`）加上方括号括起来的 `characterlist`。下表列出了这些通配符及其含义：\n\n\
  ![Image](img/056tab03.jpg)\n\n我们将使用下面的 Actors 表格来说说明这些通配符的语句。\n\n![Image](img/057tab01.jpg)\n\
  这里是下划线（`_`）通配符字符如何使用的示例：\n\n```\nSELECT\nFirstName,\nLastName\nFROM Actors\n```\n\
  \n此 `SELECT` 的输出是：\n\n![Image](img/057tab02.jpg)\n\n该语句检索了这三个演员，因为他们的 First 名字都由恰好一个字符后接短语\
  \ `ARY` 组成。\n同样，如果我们发布这条语句：\n\n```\nSELECT\nFirstName,\nLastName\nFROM Actors\n\
  ```\n\n它产生了：\n\n![Image](img/057tab03.jpg)\n\n演员 John Wayne 没有被选中，因为 John 不符合 `J_N`\
  \ 模式。下划线代表仅一个字符。\n我们将讨论的最后通配符 `[characterlist]` 和 `[^*characterlist]` 允许你在单一个位置上指定多个通配符值。\n\
  \n***\n\n### 数据库差异：MySQL 和 Oracle\n\n`[characterlist]` 和 `[^*characterlist]` 通配符在\
  \ MySQL 或 Oracle 中不可用。\n***\n\n以下展示了 `[characterlist]` 通配符：\n\n点击此处查看代码图片\n\n```\n\
  FirstName,\nLastName\nFROM Actors\nWHERE FirstName LIKE '[CM]ARY'\n```\n\n这检索了任何\
  \ `FirstName` 以 `C` 或 `M` 开头并以 `ARY` 结尾的行。结果是：\n![Image](img/057tab01.jpg)\n\n\n\
  \n此 `WHERE` 子句中表达的条件非常基础。它仅仅指定返回所有 `QuantityPurchased` 列值为 5 的行。在现实世界中，数据的筛选远没有这那么简单。因此，现在让我们将注意力转向在选择标准中指定更复杂逻辑条件的方法。\n\
  \n设计复杂逻辑条件的能力被称为*布尔逻辑*（Boolean logic*）。这个术语源于数学，指的是构建复杂条件的能力，这些条件可以被评估为真（true）或假（false）。在上述示例中，表中的每一行条件\
  \ `QuantityPurchased = 5` 都会被评估为真或假。显然，我们只想看到条件被评估为真的行。\n用于创建复杂布尔逻辑的原则关键字是 `AND`、`OR`\
  \ 和 `NOT`。这三个运算符用于为 `WHERE` 子句提供额外的功能。通过适当的组合，`AND`、`OR` 和 `NOT` 运算符配合括号，可以指定几乎能够想象到的任何逻辑表达式。\n\
  \n### AND 运算符\n\n以下示例均取自此 Purchases（购买明细）表：\n\n![Image](img/062tab01.jpg)\n这是一个使用\
  \ `AND` 运算符的 `WHERE` 子句示例：\n\n```\nSELECT\nCustomerName,\nQuantityPurchased\nFROM\
  \ Purchases\nAND QuantityPurchased < 7\n```\n\n`AND` 子句意味着所有条件都评估为真，该行才会被选中。此 `SELECT`\
  \ 指定要检索的唯一行是 `QuantityPurchased` 既大于 3 且小于 7 的行。因此，只返回了这两行：\n\n![Image](img/062tab02.jpg)\n\
  \n\n### OR 运算符\n\n现在让我们来看 `OR` 运算符。`AND` 运算符意味着所有条件都评估为真，该行才能被选中。`OR` 运算符意味着如果*任何*一个条件被确定为真，该行就会被选中。\n\
  \n这是一个从同一张表中取出的示例：\n\nSELECT\nCustomerName,\nQuantityPurchased,\nPricePerItem\n\
  FROM Purchases\nWHERE QuantityPurchased > 8\nOR PricePerItem > 3\n\n此 `SELECT` 返回了这些数据：\n\
  \n![Image](img/063tab01.jpg)\n\n为什么显示了 Carol White 和 James Carpenter 的行，而没有 Andrew\
  \ Li 的行？Carol White 的行被选中是因为它满足了第一个条件的要求（`QuantityPurchased > 8`）。第二个条件（PricePricePerItem\
  \ > 3`）不真没有关系，因为 `OR` 条件只需要一个条件为真即可。\n\n\n### 使用括号\n\n假设我们对来自伊利诺伊州（Illinois）或加利福尼亚州（California）客户的订单感兴趣。此外，我们只想查看数量大于\
  \ 8 的订单。为了尝试满足这一请求，我们组合了此 `SELECT` 语句：\n\n```\nSELECT\nState,\nQuantityPurchased\n\
  FROM Purchases\nWHERE State = 'IL'\nOR State = 'CA'\nAND QuantityPurchased > 8\n\
  ```\n我们期望此语句只返回一行数据，即 Carol White 的。虽然我们在伊利诺伊州或加利福尼亚州有两个客户（Li 和 White），但只有其中一个（White）购买数量大于\
  \ 8。然而，当执行此语句时，我们得到了：\n\n![Image](img/063tab02.jpg)\n\n我们看到了两行而不是预期的一行。哪里出了问题？答案在于\
  \ SQL 如何解释 `WHERE` 子句，而该子句恰好包含了 `AND` 和 `OR` 运算符。和其他计算机语言一样，SQL 有预定的评估顺序，规定了各种运算符被解释的顺序。除非另有说明，否则\
  \ SQL 始终在 `OR` 运算符之前处理 `AND` 运算符。因此，在之前的语句中，它首先查看 `AND` 并评估条件：\n\n```\nAND QuantityPurchased\
  \ > 8\n```\n\n该条件的行是 Carol White。SQL 随后评估 `OR` 运算符，允许 State 等于 IL 的行通过。这增加了 Andrew\
  \ Li 的行。结果是 SQL 确定 Andrew Li 和 Carol White 的行都符合条件。\n\n显然，这并不是本意。这种问题在当 `AND` 和\
  \ `OR` 运算符组合在单个 `WHERE` 子句中经常出现。解决这种歧义的方法是使用括号来指定所需的评估顺序。括号中的任何内容始终会被首先评估。\n\n\n\
  ```\nSELECT\nCustomerName,\nState,\nQuantityPurchased\nFROM Purchases\nOR State\
  \ = 'CA')\nAND QuantityPurchased > 8\n```\n\n执行此语句时，我们看到了这些数据：\n\n![Image](img/064tab01.jpg)\n\
  执行此时，括号强制 `OR` 表达式（`State = 'IL' OR State = 'CA'`）先进行评估。产生了预期的结果。\n\n### 多重括号\n\n\
  假设我们要从 Purchases 表中选择两组行：首先是纽约州的客户，其次是伊利诺伊州且购买数量在 3 到 10 之间的客户。下述 `SELECT` 实现了这一点：\n\
  \n```\nCustomerName,\nState,\nQuantityPurchased\nFROM Purchases\nWHERE State = 'NY'\n\
  OR (State = 'IL'\nAND (QuantityPurchased >= 3\n```\n\n结果是：\n\n![Image](img/065tab01.jpg)\n\
  \n注意此语句中有两组括号，一组在另一组内部。这种括号的使用类似于数学中的复合函数。当有多组括号时，最内层的总是先评估。布尔表达式中的括号也是如此。在这个示例中，最内层的括号包含：\n\
  ```\nQuantityPurchased >= 3\nAND QuantityPurchased <= 10\n```\n\n在对每行评估此条件后，逻辑移动到第二组括号：\n\
  \nState = 'IL'\nAND (QuantityPurchased >= 3\nAND QuantityPurchased <= 10)\n```\n\
  \n最后，逻辑处理 `WHERE` 子句中最后（未在括号内）关于纽约州的行：\n\nWHERE State = 'NY'\nOR (State = 'IL'\n\
  AND (QuantityPurchased >= 3\nAND QuantityPurchased <= 10))\n```\n\n本质上，SQL 逻辑首先评估最内层括号中的表达式，然后是外部括号，最后是所有剩余表达式。\n\
  ### NOT 运算符\n\n除了 `AND` 和 `OR` 运算符外，`NOT` 运算符通常用于表达复杂的逻辑条件。`NOT` 表达 `NOT` 之后任何内容的否定或反面。这是一个简单的示例：\n\
  \n```\nSELECT\nCustomerName,\nQuantityPurchased\nFROM Purchases\nWHERE NOT State\
  \ = 'NY'\n```\n\n结果是：\n\n\n这指定了状态不等于 NY 的行。在这种简单的情况下，`NOT` 运算符并不是真正必要的。之前语句的逻辑也可以通过以下等效语句来实现：\n\
  \n```\nSELECT\nCustomerName,\nState,\nFROM Purchases\nWHERE State <> 'NY'\n```\n\
  \n在这里，不等于运算符（`<>`）实现了与 `NOT` 运算符相同的功能。有一个使用 `NOT` 运算符更复杂的示例：\n\n```\nCustomerName,\n\
  State,\nQuantityPurchased\nFROM Purchases\nWHERE NOT (State = 'IL'\n```\n\n\n\n\
  OR State = 'NY')\n\n结果是：\n\n![Image](img/066tab02.jpg)\n当 `NOT` 运算符用于一组括号之前时，它会否定括号内的所有内容。在这个示例中，我们正在寻找状态既不是\
  \ `not` 伊利诺伊州又不是纽约州的所有行。\n\n再次注意，在这个示例中，`NOT` 运算符并不是严格必须的。上一个查询的逻辑也可以通过以下等效语句来实现：\n\
  \n```sql\nSELECT\nCustomerName,\nQuantityPurchased\nFROM Purchases\nWHERE State\
  \ <> 'IL'\nAND State <> 'NY'\n```\n\n可能需要花一点时间思考为什么上述两个语句是等效的。第一条语句使用了 `NOT` 运算符以及一个带有\
  \ `OR` 运算符的逻辑表达式。第二个语句则将逻辑转换为一个带有 `AND` 运算符的表达式。\n这里是 `NOT` 运算符在复杂语句中使用的示例：\n\n\
  ```sql\nSELECT\nCustomerName,\nState,\nQuantityPurchased\nWHERE NOT (State = 'IL'\n\
  AND QuantityPurchased > 3)\n```\n\n此查询的意思是：选择那些“状态等于伊利诺伊州且 `QuantityPurchased` 大于\
  \ 3”的情况不成立的客户。`NOT` 运算符应用于整个逻辑表达式（即状态等于伊利诺伊州且 `QuantityPurchased` 大于 3）。结果是：\n\n\
  ![Image](img/067tab01.jpg)\n这两行被选中，是因为伊利诺伊州唯一一个 `QuantityPurchased` 大于 3 的客户是 Andrew\
  \ Li。由于我们对这整个逻辑应用了 `NOT`，最终结果是显示另外两个客户。\n\n再次，此查询可以使用不使用 `NOT` 的另一种方式表示：\n\n```sql\n\
  SELECT\nCustomerName,\nQuantityPurchased\nFROM Purchases\nWHERE State <> 'IL'\n\
  OR QuantityPurchased <= 3\n```\n\n正如这些示例所示，在包含等于（`=`）或小于（`<`）等算术运算符的复杂表达式中，逻辑上可能并不需要使用\
  \ `NOT` 运算符。然而，将 `NOT` 放在逻辑表达式前面通常比尝试将该表达式转换为不使用 `NOT` 的表达式要直观得多。换句话说，`NOT` 运算符可以为人们表达逻辑思维提供一种方便且实用的方法。\n\
  ### BETWEEN 运算符\n\n现在让我们来看两个特殊运算符：`BETWEEN` 和 `IN`，它们可以简化通常需要 `OR` 或 `AND` 运算符的表达式。`BETWEEN`\
  \ 运算符允许我们在包含单个运算符的表达式中，将带有大于等于（`>=`）和小于等于（`<=`）运算符的 `AND` 表达式简化。\n\n这里有一个示例。假设我们要选择所有购买数量在\
  \ 5 到 20 之间的行。实现这一点的方法是使用以下 `SELECT` 语句：\n\n```sql\nCustomerName,\nQuantityPurchased\n\
  FROM Purchases\nWHERE QuantityPurchased >= 5\nAND QuantityPurchased <= 20\n```\n\
  \n\n点击此处查看代码图片\n\n```sql\nSELECT\nCustomerName,\nQuantityPurchased\nWHERE QuantityPurchased\
  \ BETWEEN 5 AND 20\n```\n\n在两种情况下，`SELECT` 都返回这些数据：\n\n![Image](img/068tab01.jpg)\n\
  \n\n注意 `BETWEEN` 运算符的相对简单性。同时请注意 `BETWEEN` 包含指定的数字。在这个示例中，`BETWEEN 5 AND 20` 包含了数字\
  \ 5 和 20。因此，`BETWEEN` 仅等效于大于等于（`>=`）和小于等于（`<=`）运算符。它不能用于简单地表示大于（`>`）或小于（`<`）某范围内的数字。James\
  \ Carpenter 的那行被选中，是因为购买数量等于 5，因此在 5 到 20 之间。\n\n`NOT` 运算符可以与 `BETWEEN` 结合使用。例如，这个\
  \ `SELECT`：\n\n点击此处查看代码图片\n\nSELECT\nCustomerName,\nQuantityPurchased\nFROM Purchases\n\
  WHERE QuantityPurchased NOT BETWEEN 5 AND 20\n```\n\n\n![Image](img/069tab01.jpg)\n\
  \n### IN 运算符\n\n正如 `BETWEEN` 是 `AND` 运算符的特例一样，`IN` 运算符允许 `OR` 运算符的特例。假设我们要查看状态为伊利诺伊州或纽约州的行。如果不使用\
  \ `IN` 运算符，可以通过此语句实现：\n\nSELECT\nCustomerName,\nState\nFROM Purchases\nWHERE State\
  \ = 'IL'\nOR State = 'NY'\n```\n这是一个使用 `IN` 运算符的等效语句：\n\n```sql\nSELECT\nCustomerName,\n\
  State\nFROM Purchases\n```\n\n在任何一种情况下，检索的数据都是：\n\n![Image](img/069tab02.jpg)\n\n\
  `IN` 运算符要求在后面列出括在括号内的值列表。必须使用逗号分隔所有值。\n`IN` 运算符的用处在某些情况下并不显而易见，但在本示例中，它可以极大减少工作量。`IN`\
  \ 运算符的用处在某些情况下并不显而易见，但在本示例中，它可以极大减少工作量。`IN` 运算符的用处在某些情况下并不显而易见，但在本示例中，它可以极大减少工作量。`IN`\
