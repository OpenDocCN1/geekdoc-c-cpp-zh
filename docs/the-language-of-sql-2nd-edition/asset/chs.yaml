  \n正如 `BETWEEN` 运算符所示，`NOT` 运算符可以与 `BETWEEN` 结合使用。例如，这个 `SELECT`：\n\n点击此处查看代码图片\n\
  \n```sql\nCustomerName,\nState\nFROM Purchases\nWHERE State <> 'IL'\nOR State =\
  \ 'NY')\n```\n\n\n![Image](img/070tab01.jpg)\n\n关于 `IN` 运算符的最后一点说明。正如 `BETWEEN`\
  \ 运算符所示，`NOT` 运算符可以与 `BETWEEN` 结合使用。例如，这个 `SELECT`：\n\n点击此处查看代码图片\n\nSELECT\nCustomerName,\n\
  State\nFROM Purchases\nWHERE State <> 'IL'\nOR State = 'NY')\n```\n结果是：\n\n![Image](img/070tab01.jpg)\n\
  \n关于 `IN` 运算符的最后一点说明。正如 `BETWEEN` 运算符所示，`NOT` 运算符可以与 `BETWEEN` 结合使用。例如，这个 `SELECT`：\n\
  \n点击此处查看代码图片\n```sql\nSELECT\nCustomerName,\nState\nFROM Purchases\nWHERE State\
  \ <> 'IL'\nOR State = 'NY')\n```\n\n结果是：\n\n![Image](img/070tab01.jpg)\n\n关于 `IN`\
  \ 运算符的最后一点说明。正如 `BETWEEN` 运算符所示，`NOT` 运算符可以与 `BETWEEN` 结合使用。例如，这个 `SELECT`：\n点击此处查看代码图片\n\
  \n```sql\nSELECT\nCustomerName,\nState\nFROM Purchases\nOR State = 'NY')\n\n```\n\
  \n结果是：\n\n![Image](img/070tab01.jpg)\n（注：由于原文文本中存在大量重复和截断的片段，译文已根据逻辑结构进行了整合，确保语义通顺。）\n\
  \n### 布尔逻辑与 NULL 值\n\n在本章开始时，我们声明 SQL 中的布尔逻辑评估表达式为真或假。这一断言是不完全准确的。在评估 `WHERE` 子句中的条件时，实际上有三种可能性：真、假和未知。这种情况源于\
  \ SQL 数据库中的列允许具有 `NULL` 值。正如在第 1 章中提到的，`NULL` 值数据的缺失。\n\nSQL 提供了一个特殊的关键字来测试 `WHERE`\
  \ 子句中 `NULL` 值的存在。关键字是 `IS NULL`。让我们来看之前看到的 Products 表的一个示例：\n![Image](img/070tab02.jpg)\n\
  \n在这个示例中，我们假设当行添加到 Products 表时，最初没有赋予重量。`Weight` 列最初被赋予 `NULL` 值，随后用户为该产品分配了重量。\n\
  \n假设我们尝试使用以下 `SELECT` 来查找缺失重量的商品：\n\n```sql\nDescription,\nWeight\nFROM Purchases\n\
  WHERE Weight = 0\n```\n\n这将返回：\n![Image](img/071tab01.jpg)\n\n这并不是我们想要的。重量为零不等同于具有\
  \ `NULL` 值的重量。为了纠正这一点，我们需要执行：\n\n```sql\nSELECT\nDescription,\nFROM Purchases\n\
  WHERE Weight = 0\nOR Weight IS NULL\n```\n\n这将返回：\n\n\n`IS NULL` 关键字也可以被否定为 `IS\
  \ NOT NULL`，这允许检索指定列没有 `NULL` 值的行。\n\n注意，在第 4 章中讨论过的 `ISNULL` 函数可以作为 `IS NULL` 关键字的替代方案。之前的\
  \ `SELECT` 语句使用 `ISNULL` 函数的等效语句为：\n\n```sql\nSELECT\nWeight\nFROM Purchases\nWHERE\
  \ Weight = 0\n```\n\n\n\n\nWHERE ISNULL(Weight, 0) = 0\n\n此 `SELECT` 检索了相同的两行。`ISNULL`\
  \ 函数将 `Weight` 列中所有值为 `NULL` 的值转换为 0。这与之前的语句产生了相同的结果，之前的语句测试的是值是否为 0 或 `NULL`。\n\
  \n`ISNULL` 函数和 `IS NULL` 关键字也可以结合使用，如下语句所示：\n\nSELECT\nDescription,\nISNULL(Weight,\
  \ 0) AS 'Weight'\nFROM Products\nWHERE Weight = 0\nOR Weight IS NULL\n```\n这产生了以下数据：\n\
  \n![Image](img/072tab01.jpg)\n\n### 展望\n\n本章涵盖了如何创建复杂选择逻辑表达式的重要主题。在这项工作中，使用的基础布尔运算符有\
  \ `AND`、`OR` 和 `NOT`。我们还讨论了 `BETWEEN` 和 `IN` 运算符，它们允许在某些情况下更简洁地表示 `AND` 和 `OR` 运算符。括号是构建复杂表达式的另一个基本工具。通过使用括号，你可以创建几乎所有想象到的逻辑条件。最后，我们讨论了在选择数据时如何处理\
  \ `NULL` 值。\n在下一章中，我们将重新访问 `columnlist` 并探索一个重要的构造结构，该结构允许我们将逻辑注入到 `columnlist`\
  \ 中的单个列。这被称为`条件逻辑`。通过使用本章讨论的相同布尔逻辑运算符以及一些额外的关键字，我们能够指定决定 `columnlist` 中单个列如何显示的的逻辑。\n\
  \n## 8. 条件逻辑\n\n### 引入的关键字\n\n`CASE` • `WHEN` • `THEN` • `ELSE` • `END`\n本章的主体内容是`条件逻辑`。该术语指的是将逻辑注入到\
  \ `columnlist` 中特定列或 SQL 语句其他表达式中的值的能力。根据 SQL 语句执行时逻辑评估的方式，列可以出现不同的值。因此，出现的值取决于指定的逻辑（即条件）。更具体地说，条件逻辑由一个以\
  \ `CASE` 关键字开头的表达式表示。这通常被称为 `CASE` 表达式。本质上，`CASE` 表达式允许你根据应用于特定列或数据元素评估的逻辑条件，更改呈现给用户的输出。`CASE`\
  \ 一词的使用与大小写无关。它的意义是以条件的方式指定特定的情况或一组逻辑。\n\n作为一名初级 SQL 开发者，你应该意识到 `CASE` 表达式是一个相对高级的概念。你可以在不使用\
  \ `CASE` 表达式的情况下工作，并编写一些非常有用的查询。然而，理解和使用条件逻辑的能力可以将原始查询转换为更具升华感的内容。因此，这是读完整本书后，可能值得额外复习的主题之一，以提醒你使用这种技术可以实现一些有趣的事情。\n\
  \n### CASE 表达式\n\nSQL 中的 `CASE` 表达式允许将逻辑应用于 `columnlist` 或表达式中的单个元素。正如 第 2 章 所示，`SELECT`\
  \ 语句的完整格式如下：\n```sql\nSELECT columnlist\nFROM tablelist\nWHERE condition\nGROUP\
  \ BY columnlist\nHAVING condition\nORDER BY columnlist\n\n`CASE` 表达式可以出现在 `SELECT`\
  \ 语句的多个区域。它可以出现在紧随 `SELECT` 关键字之后的 `columnlist` 中，也可以出现在 `GROUP BY` 或 `ORDER BY`\
  \ 子句中。它还可以作为 `WHERE` 或 `HAVING` 子句条件中的元素出现。在本章中，我们将首先说明如何在 `SELECT` `columnlist`\
  \ 中使用 `CASE` 表达式。这是它最典型的用法。随后，还将展示如何在 `WHERE` 和 `ORDER BY` 子句中使用它。\n\n`CASE` 表达式替换\
  \ `columnlist` 中的任何单个列，或者 `WHERE` 或 `HAVING` 子句条件中引用的表达式。专注于其在 `columnlist` 中的用法，一个同时包含列和\
  \ `CASE` 表达式的 `SELECT` 语句可能如下：\n\n```sql\nSELECT\ncolumn2,\nCaseExpression\nFROM\
  \ table\n```\n\n`CASE` 表达式本身包含了嵌入在传统的 `IF-THEN-ELSE` 结构中的逻辑。`IF-THEN-ELSE` 一术是指过程化编程语言中常用的逻辑结构。泛而言之，这种逻辑看起来如下：\n\
  \nIF some condition is true\nTHEN do this\nELSE do that\n```\n\n`IF-THEN-ELSE` 中表示的条件可以包含上一章讨论的全范围布尔逻辑。因此，该表达式可以包含\
  \ `AND`、`OR`、`NOT`、`BETWEEN` 和 `IN` 运算符，以及括号。\n\n\n`CASE` 表达式有两种基本格式，通常称为 `simple`（简单）和\
  \ `searched`（搜索）。简单格式是：\n\n点击此处查看代码图像\n\n```sql\nCASE ColumnOrExpression\nWHEN value2\
  \ THEN result2\n(repeat WHEN-THEN any number of times)\n[ELSE DefaultResult]\nEND\n\
  ```\n\n如你所见，这个 `CASE` 表达式除了 `CASE` 外使用了多个关键字；它还包含了 `WHEN`、`THEN`、`ELSE` 和 `END`。这些额外的关键字用于完整定义\
  \ `CASE` 表达式的逻辑。`WHEN` 和 `THEN` 关键字定义了一个被评估的条件。如果 `WHEN` 之后的值为真，则使用 `THEN` 之后的结果。`WHEN`\
  \ 和 `THEN` 关键字可以重复任意次数。当有 `WHEN` 时，必须有一个对应的 `THEN`。`ELSE` 关键字用于定义在没有任何 `WHEN-THEN`\
  \ 都不为真时使用的默认值。如括号所示，`ELSE` 关键字不是必须的。但是，在每个 `CASE` 表达式中包含 `ELSE` 关键字通常是一个好习惯。`END`\
  \ 关键字终止 `CASE` 表达式。\n让我们通过这个 `Groceries` 表来看一个具体的例子：\n\n![Image](img/075tab01.jpg)\n\
  \n在该数据中，`CategoryCode` 列旨在具有以下含义：F 代表水果，S 代表香料，V 代表蔬菜，B 代表饮料。针对此表带有 `CASE` 表达式的\
  \ `SELECT` 可能如下所示：\n\n```sql\nCASE CategoryCode\nWHEN 'F' THEN 'Fruit'\nWHEN 'V'\
  \ THEN 'Vegetable'\nELSE 'Other'\nEND AS 'Category',\nDescription\nFROM Groceries\n\
  \n并产生以下输出：\n\n![Image](img/075tab02.jpg)\n\n让我们详细检查 `SELECT` 语句。第一行包含 `SELECT` 关键字。第二行带有\
  \ `CASE` 关键字指定要分析的 `CategoryCode` 列。第三行引入了第一个 `WHEN-THEN` 条件。该行说明如果 `CategoryCode`\
  \ 列等于 F，则显示“Fruit”。下一行说明如果 `CategoryCode` 是 V，则显示“Vegetable”。`ELSE` 行提供了一个在没有任何\
  \ `WHEN-THEN` 为真时使用的默认值“Other”。换句话说，如果类别不是水果或蔬菜，则可以归类为“Other”。`END` 终止了 `CASE` 表达式，并包含一个\
  \ `AS` 关键字以分配列别名。下一行 `Description` 只是另一个列，与 `CASE` 表达式无关。\n\n\n### 搜索 CASE 格式\n\n\
  `searched` `CASE` 表达式的通用格式为：\n\n点击此处查看代码图像\n\nCASE\nWHEN condition1 THEN result1\n\
  WHEN condition2 THEN result2\n(repeat WHEN-THEN any number of times)\n[ELSE DefaultResult]\n\
  END\n```\n使用此第二种格式上述 `SELECT` 语句的等效语句为：\n\n点击此处查看代码图像\n\n```sql\nSELECT\nCASE\n\
  ```\n\n\n\n\n\n```sql\nELSE 'Other'\nEND AS 'Category',\nDescription\nFROM Groceries\n\
  ```\n\n从此语句检索出的数据与第一个简单的 CASE 格式相同。然而，请注意其细微的。在简单格式中，要评估的列名放在 `CASE` 关键字之后，而 `WHEN`\
  \ 之后的表达式是一个简单的字面量值。在搜索格式中，要评估的列名并没有紧放在 `CASE` 关键字旁边。相反，这种格式允许在 `WHEN` 关键字之后指定更复杂的条件表达式。\n\
  在上一个示例中，`CASE` 子句的两种格式都可以可以使用，并且会产生相同的结果。现在让我们来看另一个示例，只有搜索 CASE 格式才能产生预期的结果。这个示例将来自以下数据：\n\
  \n![Image](img/076tab01.jpg)\n\n在这种情况下，表并不是包含单一的 `CategoryCode` 列，而是有多个列来指示产品类型。例如，`Fruit`\
  \ 列中的值 `X` 表示该产品是水果。因此，无法使用 `CASE` 表达式的简单格式来评估这些数据。简单格式仅适用于对单列的分析。使用搜索格式，处理此类数据的\
  \ `CASE` 表达式如下：\n\n点击此处查看代码图片\n```sql\nSELECT\nCASE\nWHEN Fruit = 'X' THEN 'Fruit'\n\
  WHEN Vegetable = 'X' THEN 'Vegetable'\nELSE 'Other'\nEND AS 'Category',\nFROM GroceryCategories\n\
  ```\n\n再次，结果如下：\n\n![Image](img/077tab01.jpg)\n\n\n`CASE` 表达式可以用于 `SELECT` 语句中 `columnlist`\
  \ 的许多情况。`CASE` 表达式用处的另一个常见例子是涉及除以零的情况。在制定一个可能出现除以零的计算时，你必须小心在分母为 0 时提供一些替代方案。与所有其他计算机语言一样，SQL\
  \ 在尝试除以零时会产生错误。为了解决这个问题，可以使用 `CASE` 表达式，如下面的通用示例所示：\n\n```sql\nSELECT\nCASE\nWHEN\
  \ Denominator = 0 THEN 0\nEND\nFROM table\n```\n\n在这个示例中，我们正在测试 `denominator` 值以检查它是否等于零。如果是，计算结果将设置为零。如果不是，则允许进行正常计算。因此，如果计算中的\
  \ `denominator` 恰好为 0，我们将跳过本会发生的“除以零”错误。\n\n### ORDER BY 子句中的条件逻辑\n正如本章开头提到的，`CASE`\
  \ 表达式可以用于 `SELECT` 语句中的许多地方。为了说明它在 `ORDER BY` 子句中的用法，让我们假设我们有一个包含美国和加拿大城市的表。在这种情况下，有独立的美国州（State）和加拿大省（Province）列。这些数据可能如下：\n\
  \n![Image](img/078tab01.jpg)\n\n此示例的目标是先按国家排序，然后按州或省排序，最后按城市排序。实现此目的的语句是：\n\n```sql\n\
  FROM NorthAmerica\nORDER BY\nCountry,\nCASE Country\nWHEN 'US' THEN State\nWHEN\
  \ 'CA' THEN Province\nELSE State\nCity\n```\n\n该语句的输出是：\n\n![Image](img/078tab02.jpg)\n\
  \n\n### WHERE 子句中的条件逻辑\n\n正如 `CASE` 表达式可以放置在 `columnlist` 中一样，它也可以放在 `WHERE` 条件的表达式中。在这个示例中，我们假设有如下所示的客户数据：\n\
  \n![Image](img/079tab01.jpg)\n\n\n点击此处查看代码图片\n\n```sql\nSELECT *\nFROM CustomerList\n\
  WHERE Income >\nWHEN Sex = 'M' AND Age >= 50 THEN 75000\nWHEN Sex = 'F' AND Age\
  \ >= 35 THEN 60000\nELSE 50000\nEND\n```\n\n注意，整个 `CASE` 表达式替换了 `WHERE` 子句中表达条件的某一部分。一般形式下，`WHERE`\
  \ 子句为：\n点击此处查看代码图片\n\n```sql\nWHERE Income > CASE_Expression\n```\n\n`CASE` 表达式提供了在选择逻辑中与\
  \ `Income` 进行比较的值。执行此语句时，检索的数据是：\n![Image](img/079tab02.jpg)\n\n### 展望\n\n`CASE`\
  \ 表达式是一个强大的工具，允许你将逻辑注入到各种语句的各种元素中。在本章，我们看到 `CASE` 表达式被用于 `columnlist`，以及 `ORDER\
  \ BY` 和 `WHERE` 子句。`CASE` 表达式有两种基本变体：`simple`（简单）和 `searched`（搜索）。简单变体的一种典型用法是为数据项提供翻译。搜索格式允许更复杂的陈述。\n\
  \n在我们的下一章“汇总数据”中，我们将注意力转向将数据分组并汇总值的方法。在回第 4 章”中，我们讨论了标量函数。下一章将引入另一类型的函数，称为聚合函数。这些聚合函数允许我们以许多方式汇总数据。例如，我们将查看任何订单组并确定订单数量、订单总金额和平均订单大小。这些技术将允许你超越详细数据的展示，开始真正地为你的用户增加价值。\n\
  ## 9. 汇总数据\n\n引入的关键字\n\n`DISTINCT` •  `SUM`  •  `AVG`  •  `MIN`  •  `MAX`  •  `COUNT`\
  \  •  `GROUP BY`  •  `HAVING`  •  `ROW_NUMBER`  •  `RANK`  •  `DENSE RANK`  •  `NTILE`\
  \  •  `OVER`  •  `PARTITION BY`\n\n为止，我们用过的所有计算、函数和 `CASE` 表达式只更改了单个列的值。我们检索的行对应于底层数据库表中的行。我们现在转向汇总数据的方法，通过组合多行中的值。\n\
  ### 消除重复\n\n尽管它没有提供真正的聚合，但汇总数据最基本的方法是消除重复。SQL 的 `DISTINCT` 关键字为从输出中删除重复值提供了一种简单的方法。这里是\
  \ `DISTINCT` 关键字的一个示例，用于以下 `SongTitles` 表：\n\n![Image](img/081tab01.jpg)\n\n\n\n\
  \n假设我们想在表格中查看艺术家列表。可以通过以下方式实现：\n\n```sql\nSELECT\nDISTINCT\nFROM SongTitles\nORDER\
  \ BY Artist\n```\n\n结果是：\n\n![Image](img/082tab01.jpg)\n`DISTINCT` 关键字始终跟在 `SELECT`\
  \ 关键字之后。`DISTINCT` 关键字指定仅返回后续 `columnlist`（列列表）中的唯一值。在这种情况下，只有三个艺术家，因此只返回了三行数据。如果我们想查看艺术家和专辑的唯一组合，可以执行：\n\
  \n```sql\nSELECT\nDISTINCT\nArtist,\nAlbum\nORDER BY Artist, Album\n```\n\n结果将是：\n\
  \n![Image](img/082tab02.jpg)\n\n\n### 聚合函数\n\n在第 4 章 的“使用函数””中讨论的函数都是*标量函数*。这些函数都是针对单个数字或值执行的。相比之下，*聚合函数*用于与数据组配合。最常用的聚合函数是\
  \ `COUNT`、`SUM`、`AVG`、`MIN` 和 `MAX`。这些函数为数据组提供了计数、总和、平均值以及最小值和最大值。\n\n所有的聚合函数示例将来自以下两个包含学生学费和成绩数据的表。`Fees`\
  \ 表包含：\n\n\n这是 `Grades` 表：\n\n![Image](img/083jpg)\n\n从 `SUM` 函数开始，假设我们想查看所有学生支付的健身费用总额。可以通过语句实现：\n\
  \nSELECT\nSUM(Fee) AS 'Total Gym Fees'\nFROM Fees\nWHERE FeeType = 'Gym'\n```\n\n\
  结果的数据是：\n![Image](img/083tab03.jpg)\n\n如你所见，`SUM` 函数根据 `WHERE` 子句指定的选择逻辑对 `Fee`\
  \ 列的总值求和。由于 `columnlist` 中唯一的表达式是聚合函数，因此查询只返回包含聚合金额的一列一行数据。\n\n`AVG`、`MIN` 和 `MAX`\
  \ 函数与 `SUM` 函数非常相似。这里是 `AVG` 函数的示例。在这种情况下，我们寻求获取 `Grades` 表中所有测验的平均分：\n\n点击此处查看代码图片\n\
  ```sql\nSELECT\nAVG(Grade) AS 'Average Quiz Score'\nFROM Grades\nWHERE GradeType\
  \ = 'Quiz'\n```\n\n\n![Image](img/084tab01.jpg)\n\n一个语句可以使用多个聚合函数。这里有一个 `SELECT`\
  \ 演示了如何在同一语句中利用 `AVG`、`MIN` 和 `MAX`：\n\n点击此处查看代码图片\n\nSELECT\nAVG(Grade) AS 'Average\
  \ Quiz Score',\nMIN(Grade) AS 'Minimum Quiz Score',\nMAX(Grade) AS 'Maximum Quiz\
  \ Score'\nFROM Grades\nWHERE GradeType = 'Quiz'\n```\n结果是：\n\n![Image](img/084tab02.jpg)\n\
  \n### COUNT 函数\n\n`COUNT` 函数比之前讨论的聚合函数稍复杂一些，因为它可以用三种不同的方式使用。首先，`COUNT` 函数可以用于返回所有选中行的计数，而不考虑任何特定列中的值。例如，以下语句返回了所有具有作业成绩的行计数：\n\
  \n点击此处查看代码图片\n\n```sql\nSELECT\nCOUNT(*) AS 'Count of Homework Rows'\nFROM Grades\n\
  WHERE GradeType = 'Homework'\n```\n\n结果是：\n\n![Image](img/085tab01.jpg)\n\n括号内的星号\
  \ `*` 意味着“所有列”。在后台，SQL 实际上会检索所选行所有列的数据，然后返回行数计数。\n\n在 `COUNT` 函数的第二种格式中，括号内指定了一个特定的列。这里有一个示例：\n\
  \n点击此处查看代码图片\n\n```sql\nSELECT\nCOUNT(Grade) AS 'Count of Homework Scores'\nFROM\
  \ Grades\nWHERE GradeType = 'Homework'\n```\n\n结果是：\n\n![Image](img/085tab02.jpg)\n\
  \n注意上述两个 `SELECT` 语句之间的细微区别。在第一个语句中，我们仅仅统计 `GradeType` 等于 `Homework` 的行。有三行这样的数据。在第二个语句中，我们统计当\
  \ `GradeType` 列值为 `Homework` 时 `Grade` 列的出现次数。在这种情况下，三行中有一行在 `Grade` 列中的值为 `NULL`，SQL\
  \ 足够智能，不会统计这样的行。如之前所述，`NULL` 意味着数据不存在。\n\n`COUNT` 函数的第三种变体允许在使用列的同时使用 `DISTINCT`\
  \ 关键字。这是一个示例：\n\n点击此处查看代码图片\n\n```sql\nSELECT\nCOUNT(DISTINCT FeeType) AS 'Number\
  \ of Types'\nFROM Fees\n```\n\n注意 `DISTINCT` 关键字被放在括号内。`DISTINCT` 关键字表示我们只包含 `FeeType`\
  \ 的唯一值。该语句的结果是：\n\n![Image](img/085jpg)\n\n### 数据分组\n\n之前的聚合函数示例很有趣，但价值有限。在我们引入数据分组概念后，聚合函数的威力将变得显而易见。\n\
  \n`GROUP BY` 关键字用于将 `SELECT` 语句返回的数据进行分组。例如，在查看 `Grades` 表时，我们可能感兴趣根据成绩类型分析分数。换句话说，我们想将数据分为两个组：测验和作业。让我们通过引入\
  \ `GROUP BY` 关键字的示例：\n\n```sql\nSELECT\nGradeType AS 'Grade Type',\nAVG(Grade) AS\
  \ 'Average Grade'\nFROM Grades\nGROUP BY GradeType\nORDER BY GradeType\n```\n\n\
  该语句的结果是：\n\n![Image](img/086tab01.jpg)\n\n在这个示例中，`GROUP BY` 关键字指定根据 `GradeType`\
  \ 的值创建分组。`SELECT` 列表中的两个列是 `GradeType` 和一个使用 `AVG` 函数的计算字段。`GradeType` 列被包含在列表中，是因为在创建分组时，最好包含分组依据的列。“平均分”计算字段根据每个组的行进行聚合。注意作业平均分计算为\
  \ 86。与之前一样，尽管作业 `GradeType` 有一行 `NULL` 值，SQL 足够智能可以忽略带有 `NULL` 值的行。如果我们想让 `NULL`\
  \ 值被计为 0，那么可以使用 `ISNULL` 函数将 `NULL` 转换为 0，如下：\n\n```sql\nAVG(ISNULL(Grade, 0)) AS\
  \ 'Average Grade'\n```\n\n需要注意的是，当使用 `GROUP BY` 关键字时，`columnlist` 中的所有列要么必须在 `GROUP\
  \ BY` 子句中列出，要么必须在聚合函数中使用。其他方式都不符合逻辑。例如，以下 `SELECT` 将产生语法错误：\n\n点击此处查看代码图片\n\n```sql\n\
  SELECT\nGradeType AS 'Grade Type',\nAVG(Grade) AS 'Average Grade',\nStudent AS 'Student'\n\
  FROM Grades\nGROUP BY GradeType\nORDER BY GradeType\n```\n\n该语句的问题在于 `Student` 列既不在\
  \ `GROUP BY` 中，也没有以任何方式聚合。由于所有内容都以汇总分组的形式呈现，SQL 不知道如何处理上述语句中的 `Student` 列。因此，该语句无法执行。\n\
  \n\n\n\n\n### 数据库差异：MySQL\n\n与 Microsoft SQL Server 和 Oracle 不同，之前的语句在 MySQL 中不会产生错误。尽管如此，它会产生错误的结果。\n\
  \n### 多列与排序\n\n分组的概念可以扩展，使得分组基于多个列。让我们回到上一个 `SELECT` 语句，并在 `GROUP BY` 子句和列列表（columnlist）中都添加\
  \ `Student` 列。它现在看起来是：\n\n```sql\nSELECT\nGradeType AS 'Grade Type',\nStudent AS\
  \ 'Student',\nAVG(Grade) AS 'Average Grade'\nFROM Grades\nGROUP BY GradeType, Student\n\
  ORDER BY GradeType, Student\n```\n\n得到的数据如下：\n\n![Image](img/087tab01.jpg)\n\n我们现在看到的不仅是按成绩类型的细分，还有学生的细分。平均分是在每个组上计算的。注意，Hailey\
  \ 的 `Homework` 行显示为 `NULL` 值，因为她只有一行作业记录，而该行的 `Grade`值为 `NULL`。\n\n在 `GROUP BY`\
  \ 子句中列出列的顺序没有意义。如果子句是以下内容，结果将是相同的：\n\n```sql\nGROUP BY Student, GradeType\n```\n\
  \n然而，如既往一样，在 `ORDER BY` 子句中列出列的顺序是有意义的。我们将 `ORDER BY` 子句切换为：\n\n```sql\nORDER BY\
  \ Student, GradeType\n```\n\n得到的数据如下：\n\n![Image](img/088tab01.jpg)\n\n这看起来有点奇怪，因为很难一眼看出数据实际上是按\
  \ `Student` 然后再按 `GradeType` 排序的。作为一个通用的规则，如果列从左到右列出的顺序与列排序的顺序一致，通常会有帮助。一个更易于理解的\
  \ `SELECT` 语句应该是：\n\n```sql\nSELECT\nStudent AS 'Student',\nGradeType AS 'Grade\
  \ Type',\nAVG(Grade) AS 'Average Grade'\nFROM Grades\nGROUP BY GradeType, Student\n\
  ORDER BY Student, GradeType\n```\n\n现在数据看起来是：\n\n![Image](img/088tab02.jpg)\n\n\
  这更易理解，因为列的顺序与排序顺序相对应。\n\n`GROUP BY` 和 `ORDER BY` 子句之间的区别有时会引起困惑。需要记住的主要点是，`GROUP\
  \ BY` 仅仅创建组。`ORDER BY` 仍然必须用于按有意义的顺序列出行。\n\n### 聚合结果的筛选标准\n\n在通过 `GROUP BY` 子句将数据分组成后，筛选标准变得稍微复杂了。在带有\
  \ `GROUP BY` 的 `SELECT` 中应用任何类型的筛选标准时，你必须询问这些标准是适用于单行还是适用于整个组。虽然 `WHERE` 子句处理单行的筛选标准，但\
  \ SQL 提供了一个名为 `HAVING` 的关键字，允许在组级别上应用筛选逻辑。\n\n回到 `Grades` 表，假设我们只想查看 70 分或以上的测验（quiz）成绩。我们想要查看的成绩是单个成绩，因此可以像往常一样\
  \ `WHERE` 子句。这样的 `SELECT` 语句可能如下：\n\n```sql\nSELECT\nStudent AS 'Student',\nGradeType\
  \ AS 'Grade Type',\nGrade AS 'Grade'\nFROM Grades\nWHERE GradeType = 'Quiz'\nAND\
  \ Grade >= 70\nORDER BY Student, Grade\n```\n\n得到的数据如下：\n\n![Image](img/089tab01.jpg)\n\
  \n注意，分数低于 70 分的测验没有显示。例如，我们可以看到 Peter 的 74 分测验成绩，但没有看到他的 58 分测验成绩。\n\n为了引入 `HAVING`\
  \ 子句的使用，假设我们想显示*平均*测验成绩为 70 分或以上的学生。在这种情况下，我们想根据平均值进行筛选，而不是根据单行。这就是 `HAVING` 子句出现的地方。我们需要先按学生对成绩进行分组，然后对基于整个组的聚合统计应用筛选标准。以下语句产生了所需的结果：\n\
  \n点击此处查看代码图像\n\n```sql\nSELECT\nStudent AS 'Student',\nAVG(Grade) AS 'Average Quiz\
  \ Grade'\nFROM Grades\nWHERE GradeType = 'Quiz'\nGROUP BY Student\nHAVING AVG(Grade)\
  \ >= 70\nORDER BY Student\n```\n\n输出结果：\n\n![Image](img/090tab01.jpg)\n\n这个 `SELECT`\
  \ 同时包含一个 `WHERE` 和 `HAVING` 子句。`WHERE` 确保我们只选择 `GradeType` 为“Quiz”的行。`HAVING` 则保证我们只选择平均分至少为\
  \ 70 分的学生。\n\n将这个例子更进一步，如果我们想添加一个带有 `GradeType` 值的列怎么办？如果我们尝试将 `GradeType` 添加到 `SELECT`\
  \ *列列表*中，语句将报错。这是因为所有列要么列在 `GROUP BY` 中，要么参与了聚合。因此，如果我们想显示 `GradeType` 列，就必须将其添加到\
  \ `GROUP BY` 子句中，如下：\n\n```sql\nSELECT\nStudent AS 'Student',\nGradeType AS 'Grade\
  \ Type',\nAVG(Grade) AS 'Average Grade'\nFROM Grades\nWHERE GradeType = 'Quiz'\n\
  GROUP BY Student, GradeType\nHAVING AVG(Grade) >= 70\nORDER BY Student\n```\n\n\
  得到的数据如下：\n\n![Image](img/090tab02.jpg)\n\n\n\n\n\n```sql\nGradeType AS 'Grade Type',\n\
  AVG(Grade) AS 'Average Grade',\nFROM Grades\nWHERE GradeType = 'Quiz'\nGROUP BY\
  \ Student, YearInSchool, GradeType\nHAVING AVG(Grade) >=\nCASE\nWHEN YearInSchool\
  \ = 7 THEN 70\nWHEN YearInSchool = 8 THEN 75\nELSE 80\nEND\nORDER BY Student\n```\n\
  \n`HAVING` 子句规定平均分必须大于 `CASE` 表达式返回的值。`CASE` 表达式将根据 `YearInSchool` 列的值，提供 70、75\
  \ 或 80 中的一个值。结果如下：\n\n![Image](img/092tab01.jpg)\n\nIsabella 是现在列出的唯一学生，因为她是唯一符合新标准的人。\n\
  \n### 排名函数\n\n除了本章之前讨论的分组技术外，SQL 还提供了许多特殊的*排名*函数，允许通过顺序分类的方法对行进行分类类。共有四种基本的排名函数：\n\
  \n- `Row_Number`\n- `Rank`\n- `Dense_Rank`\n- `NTile`\n\n`ROW_NUMBER` 函数根据与函数相关的另一列或表达式的指定顺序创建行号。在行按指定顺序排列后，生成的行号将从\
  \ 1 开始，按顺序递增到 2、3、4 等类推。`ROW_NUMBER` 函数不需要任何参数。\n\n`RANK` 函数与 `ROW_NUMBER` 相同，不同在于如果两个或多行的指定列或表达式具有相同的值，则它们被赋予相同的数字。例如，如果第二行和第三行的值相同，生成的排名将是\
  \ 1, 2, 2, 4 等类推。由于两个值为 2 的行值相同，SQL 会跳过数字 3。\n\n`DENSE_RANK` 函数与 `RANK` 函数相同，不同之处在于即使存在重复值，它也不会不会跳过任何数字。在前面的示例中，稠密排名将是\
  \ 1, 2, 2, 3 等类推。没有跳过数字 3。\n\n最后，`NTILE` 函数允许根据另一列或表达式的指定顺序生成百分比位数或任何其他 n 分位数。与\
  \ `RANK`、`ROW_NUMBER` 和 `DENSE_RANK` 不同，`NTILE` 需要一个参数。例如，函数 `NTILE(100)` 将分配百分位数。百分位数是从\
  \ 1 到 100 的数字，代表该值的相对排名。然而，任何其他数字都可以作为函数的参数。因此，函数 `NTILE(10)` 将创建十分分位数，而 `NTILE(4)`\
  \ 将产生四分位数。\n\n让我们通过几个示例来说说明排名，所有示例都基于下表：\n\n![Image](img/093tab01.jpg)\n\n此表列出了一些股票，显示了它们的代码、名称、交易交易所以及市盈率（PE\
  \ 比例）。例如，苹果公司（AAPL）在纳斯达克交易，市盈率为 14。\n\n在第一个示例中，我们将按市盈率对所有行进行排序，并使用 `ROW_NUMBER`\
  \ 函数为每行生成一个行号。我们希望按市盈率从低到高对行进行排序。我们先显示低 PE 的行，因为通常情况下低 PE 比比高 PE 好。实现此目的的语句是：\n\n\
  点击此处查看代码图像\n\n```sql\nSELECT\nROW_NUMBER() OVER (ORDER BY PriceEarningsRatio) AS\
  \ 'Row',\nStockSymbol AS 'Symbol',\nStockName AS 'Name',\nExchange AS 'Exchange',\n\
  PriceEarningsRatio AS 'PE Ratio'\nFROM Stocks\nORDER BY PriceEarningsRatio\n```\n\
  \n该语句的输出是：\n\n![Image](img/094tab01.jpg)\n\n让我们检查它是如何工作的。首先，注意此语句中没有选择标准或分组。除了 `columnlist`\
  \ 之外，只有一个 `FROM` 子句和一个 `ORDER BY` 子句。`ORDER BY` 子句（语句的最后一行）对于按市盈率所需顺序列行是必要的。该语句中主要的复杂之处在于\
  \ `columnlist` 中的第一个项目，它使用了 `ROW_NUMBER` 排名函数。注意，此值包含一个 `OVER` 关键字以及括号中的另一个 `ORDER\
  \ BY`。包含排名函数的 `columnlist` 元素的通用格式为：\n\n点击此处查看代码图像\n\n```sql\nRank_Function() OVER\
  \ (ORDER BY expression [[ASC]|DESC])\n```\n\n`Rank_Function` 可以是之前提到的四个函数中的任何一个。需要\
  \ `OVER` 关键字。它的目的是指定如何应用排名函数。括号中的 `expression` 表示要应用排名的列或表达式。`ORDER BY` 关键字表示该表达式将按升序或降序进行评估。如果顺序是升序，则不需要\
  \ `ASC` 关键字。\n\n在我们的示例中，我们根据对 `PriceEarningsRatio` 列的评估来分配行号。`PriceEarningsRatio`\
  \ 的值按升序评估。第一行（卡宝食品，Kraft Foods）被赋予行号 1，因为它是序列中的第一位。注意，`ROW_NUMBER` 函数仅分配行号。我们仍然需要在\
  \ `SELECT` 语句中使用 `ORDER BY` 子句，以便实际按所需的顺序显示输出。\n\n为了说明 `RANK` 和 `DENSE_RANK` 函数的使用，我们将它们作为列添加到之前的语句中。我们不费力显示股票名称或交易所。新语句是：\n\
  \n点击此处查看代码图像\n\n```sql\nSELECT\nROW_NUMBER() OVER (ORDER BY PriceEarningsRatio)\
  \ AS 'Row',\nRANK() OVER (ORDER BY PriceEarningsRatio) AS 'Rank',\nDENSE_RANK()\
  \ OVER (ORDER BY PriceEarningsRatio) AS 'Dense Rank',\nStockSymbol AS 'Symbol',\n\
  PriceEarningsRatio AS 'PE Ratio'\nFROM Stocks\nORDER BY PriceEarningsRatio\n```\n\
  \n输出是：\n\n![Image](img/095tab01.jpg)\n\n在这个示例中，MSFT 和 WMT 具有相同的 PE。结果是它们的 `RANK`\
  \ 和 `DENSE_RANK` 被赋予了相同的值。对于 `RANK`，MSFT 和 WMT 之后的下一行跳过了数字并赋予了值 5。对于 `DENSE_RANK`，没有跳过数字，ORCL\
  \ 被赋予了值 4。\n\n对于 `NTILE` 函数，我们将提供 `NTILE(4)` 和 `NTILE(10)` 的示例。如所述，`NTILE` 对行进行排名并将其分配到一个组。在这种情况下，数据分为四组。这通常被称为四分位数。`NTILE(10)`\
  \ 将数据分为十组，也称为十分分位数。为了说明，以下语句按市盈率排名股票并显示 `NTILE(4)` 和 `NTILE(10)`：\n\n点击此处查看代码图像\n\
  \n```sql\nSELECT\nNTILE(4) OVER (ORDER BY PriceEarningsRatio) AS 'Quartile',\nNTILE(10)\
  \ OVER (ORDER BY PriceEarningsRatio) AS 'Decile',\nStockSymbol AS 'Symbol',\nPriceEarningsRatio\
  \ AS 'PE Ratio'\nFROM Stocks\nORDER BY PriceEarningsRatio\n```\n\n产生的输出是：\n\n![Image](img/096tab01.jpg)\n\
  \nQuartile 列根据市盈率的排名将数据分为四组。所示，1-4 行属于第一四分位数，5-8 行属于第二四分位数，依此类推。Decile 列以类似将数据分为十组。对于较大的数据集，通常会包含一个\
  \ `NTILE(100)` 函数将数据分为 100 组。这 100 组中的每一个通常被称为百分位数。\n\n### 数据库差异：MySQL\n\n与 Microsoft\
  \ SQL Server 和 Oracle 不同，MySQL 不提供本节讨论的 `OVER` 关键字和排名函数。同样，它也不提供后续节讨论的 `PARTITION\
  \ BY` 关键字。\n\n### 分区\n\n上一节讨论的排名函数的一种实用变体是可以在应用排名函数之前将数据划分为不同的*分区*（partitions）。\n\
  \n\n\n\n\n数据分区涉及 `PARTITION BY` 关键字。通过分区，包含排名函数的 `columnlist` 元素的通用格式如下：\n\n点击此处查看代码图片\n\
  \n```\nRank_Function() OVER (PARTITION BY expression_1\nORDER BY expression_2 [[ASC]|DESC])\n\
  ```\n\n在之前的示例中，我们忽略了 `Exchange` 列的值。通过数据分区，我们能够根据 `Exchange` 列的值（其值可能是 `NYSE` 或\
  \ `NASDAQ`）将数据分离为两个独立的组，或者说对数据进行`分区`（`partition`）。在数据被分离后，将像之前的那样应用排名函数。\n\n为了说明这一点，让我们修改上一节中的第一个查询，该查询使用了\
  \ `ROW_NUMBER` 函数对数据进行排名，并根据 `PE` 比例为每行分配一个行号。原始 SQL 语句为：\n\n点击此处查看代码图片\n\n```sql\n\
  SELECT\nROW_NUMBER() OVER (ORDER BY PriceEarningsRatio) AS 'Row',\nStockSymbol AS\
  \ 'Symbol',\nStockName AS 'Name',\nExchange AS 'Exchange',\nPriceEarningsRatio AS\
  \ 'PE Ratio'\nFROM Stocks\nORDER BY PriceEarningsRatio\n```\n\n在修订中，我们将包含 `ROW_NUMBER`\
  \ 函数的 `columnlist` 元素添加了 `PARTITION BY` 关键字。我们还重新排列了列的顺序和 `ORDER BY` 子句，使数据的布局更易于理解。新语句是：\n\
  \n点击此处查看代码图片\n\n```sql\nSELECT\nExchange AS 'Exchange',\nROW_NUMBER() OVER (PARTITION\
  \ BY Exchange ORDER BY PriceEarningsRatio)\nAS 'Exchange Rank',\nStockSymbol AS\
  \ 'Symbol',\nPriceEarningsRatio AS 'PE Ratio'\nFROM Stocks\nORDER BY Exchange, PriceEarningsRatio\n\
  ```\n\n结果如下：\n\n![Image](img/098tab01.jpg)\n\n注意，我们还将 `ROW_NUMBER` 函数的列别名从“Row”更改为“Exchange\
  \ Rank”（交易所排名）。这样做是因为我们现在有了两组数据。将此列称为行号是没有意义的，因为我们有两组连续的数字。注意，`ORDER BY` 子句必须与排名函数中的\
  \ `PARTITION BY` 和 `RANKING BY` 表达式对应。如果数据以一种方式分区和排名，却以另一种方式排序，结果可能难以理解。\n\n请记住，分区与本章之前看到的\
  \ `GROUP BY` 子句不同。`GROUP BY` 子句的通常用途是对数据进行分组，然后对每个组应用聚合函数。例如，人们可能希望按 `Exchange`\
  \ 列分组，然后获取每个组的平均 `PE`。这将提供 `NASDAQ` 和 `NYSE` 交易所的平均 `PE`。相比之下，分区的概念保持了详细数据的完整性。创建分区的仅仅是为了对每个分区内的单独行进行排名。虽然为了排名目的将数据分成了组，但细节被保留，并且不涉及任何聚合。\n\
  \n前面的示例说明了 `ROW_NUMBER` 排名函数与分区的使用。分区应用于其他三个排名函数的方法方法完全相同。例如，如果我们想根据 `Exchange`\
  \ 对数据进行分区，然后显示每个分区的四分位数，语句将是：\n\n点击此处查看代码图片\n\n```sql\nSELECT\nExchange AS 'Exchange',\n\
  NTILE(4) OVER (PARTITION BY Exchange ORDER BY PriceEarningsRatio)\nAS 'Quartile',\n\
  StockSymbol AS 'Symbol',\nPriceEarningsRatio AS 'PE Ratio'\nFROM Stocks\nORDER BY\
  \ Exchange, PriceEarningsRatio\n```\n\n该语句的输出为：\n\n![Image](img/099tab01.jpg)\n\n\
  如预期所示，数据现在显示了 `NASDAQ` 和 `NYSE` 股票按四分位划分的排名。\n\n目前为止的排名函数和分区示例非常有趣，但这些技术更有用的应用将在\
  \ 第 14 章 “子查询”。将数据划分为分区并对每个分区应用排名的能力意味着我们可以为数据集中的每个分区指定 `top n` 类型的选择。例如，假设我们想为每个客户选择最大的订单。我们可以根据\
  \ `customer number` 对数据进行分区，然后根据 `order amount` 对每行进行排名。最终，我们只想每个客户选择一个订单。这可以通过在查询中包含如下行来实现：\n\
  \n点击此处查看代码图片\n\n```sql\nROW_NUMBER() OVER\n(PARTITION BY CustomerNumber ORDER BY\
  \ OrderAmount) AS TheRow\n```\n\n这将产生一个名为 `TheRow` 的计算字段，它根据 `OrderAmount` 对每个客户的订单进行排名。值最高的订单将被分配值为\
  \ 1。正如你在 第 14 章 中看到的，随后可以从初始查询的结果中选择，只选择 `TheRow` 等于 1 的行。这将为每个客户提供最大的订单。这种技术可以应用于许多类似的情况。例如，我们可能想查看每个客户最近的订单，或者可能是每个城市利润最丰的客户。\n\
  \n### 展望\n\n在本章中，我们涵盖了多种形式的聚合，从最简单的——消除重复开始。然后，我们引入了一些聚合函数，这些函数与 第 4 章 中看到的标量函数是不同类型的函数。当聚合函数与\
  \ `GROUP BY` 结合使用时，其真实威力变得显而易见，因为它允许将数据分成组。我们还查看了 `HAVING` 子句，它允许组级选择标准。\n\n我们用两个与求和相关的额外主题结束了本章。在\
  \ `GROUP BY` 和 `HAVING` 子句中使用 `CASE` 表达式允许你应用条件逻辑分组和组选择标准。最后，我们涵盖了排名函数和分区，这些是组织详细数据的有用方法。通过使用\
  \ `PARTITION BY` 关键字，数据可以结合排名函数被分成组。\n\n我们的下一章关于小计（subtotals）和交叉表（crosstabs），将为聚合值提供额外的格式支持。小计允许你在详细数据的演示中添加摘要信息。交叉表提供了一种新的数据布局方法，更有利于清晰显示聚合数据。\n\
  \n\n\n\n本章将涵盖的第二个主题与如何向用户显示汇总后的数据有关。在前一章中，数据被分组在一起并显示给用户。每行数据都表示被分组的值以及汇总后的值。这通常是显示数据的一种有效方法。但有时用户更倾向于以交叉表（crosstab）格式显示数据。交叉表格式是将组拆分为多个列的格式。这样做的效果是减少用户需要查看的行数。许多报表工具都采用交叉表布局。交叉表布局的一个典型例子是\
  \ Excel 透视表，它允许你同时在行和列上列出数据。在本章中，我们将展示如何使用 SQL 命令创建这种效果。\n\n#### 使用 ROLLUP 添加小计\n\
  \n在前一章中，我们展示了如何使用 `GROUP BY` 子句将数据分组。通常当数据被分组在一起时，某些列可能会进行聚合，以提供该列数值的和。为了重新回顾这一场景，让我们从以下数据开始，它显示了少量产品的当前库存。\n\
  \n![Image](img/102tab01.jpg)\n\n在这个示例中，每个产品都按类别和子类别细分。例如，家具（Furniture）类别包含椅子（Chair）和桌子（Desk）子类别。接下来的\
  \ `SELECT` 语句按 `Category` 和 `Subcategory` 对这些数据进行分组，并对每个组的数量求和。\n\n点击此处查看代码图片\n\n\
  ```sql\nSELECT\nCategory,\nSubcategory,\nSUM(Quantity) AS 'Quantity'\nFROM Inventory\n\
  GROUP BY Category, Subcategory\nORDER BY Category, Subcategory\n```\n\n生成的输出是：\n\
  \n![Image](img/102tab02.jpg)\n\n到为止，一切正常。但如果我们还想查看每个类别的小计并在最后显示一个最终总计呢？换句话说，除了分组数据外，我们希望在每次类别变化时都有一行小计，并在最后有一行汇总所有数量的总计。这可以通过在\
  \ `GROUP BY` 子句中使用 `ROLLUP` 关键字来实现，如下：\n\n点击此处查看代码图片\n\n```sql\nSELECT\nCategory,\n\
  Subcategory,\nSUM(Quantity) AS 'Quantity'\nFROM Inventory\nGROUP BY ROLLUP(Category,\
  \ Subcategory)\n```\n\n关键字 `ROLLUP` 是 `GROUP BY` 子句的扩展，用于创建小计行和总计行。上述语句的输出是：\n\n\
  ![Image](img/103tab01.jpg)\n\n如所示，原始的四行基础上增加了三行小计和总计行。这些行在 `Category` 或 `Subcategory`\
  \ 列中包含关键字 `NULL`。第一行小计行是第三行，它显示家具（Furniture）类别的数量为 9。`Subcategory` 显示为 `NULL`，因为我们只显示了该类别的小计。第二个小计行是第六行，它汇总了纸张（Paper）类别，表示有\
  \ 11 件纸质物品。最后一行是总计列，汇总了所有类别的所有物品，表明库存中总共有 20 件物品。\n\n注意，输出中出现的 `NULL` 与我们之前看到的 `NULL`\
  \ 值略有不同。在这种情况下，`NULL` 仅仅是一个表示已应用 `ROLLUP` 的占位符。\n\n上一个语句没有包含 `ORDER BY` 子句。没有 `ORDER\
  \ BY`，小计行和总计行始终出现在每个类别之后。现在让我们为语句添加一个 `ORDER BY` 来查看差异：\n\n点击此处查看代码图片\n\n```sql\n\
  SELECT\nCategory,\nSubcategory,\nSUM(Quantity) AS 'Quantity'\nFROM Inventory\nGROUP\
  \ BY ROLLUP(Category, Subcategory)\nORDER BY Category, Subcategory\n```\n\n输出是：\n\
  \n![Image](img/103tab02.jpg)\n\n如你所见，`ORDER BY` 子句改变了小计行和总计行的位置。它们现在出现在每个类别之前而不是之后。这是因为\
  \ `NULL` 值是可能的最低值，所以它们在排序序列中首先出现。\n\n显而易见，在上述示例中使用 `NULL` 值有些晦涩且难以解释。我们现在展示如何将这些\
  \ `NULL` 值转换为更具意义的内容。这是通过一个名为 `GROUPING` 的函数实现的。这是一个与 `ROLLUP` 关键字配合使用的特殊聚合函数。正如下一节所示，`GROUPING`\
  \ 也可以与 `CUBE` 关键字配合使用。接下来的示例添加了两个使用了 `GROUPING` 函数的列。为了简单起见，我们将删掉 `ORDER BY` 子句。\n\
  \n点击此处查看代码图片\n\n```sql\nSELECT\nCategory,\nSubcategory,\nSUM(Quantity) AS 'Quantity',\n\
  GROUPING(Category) AS 'Category Grouping',\nGROUPING(Subcategory) AS 'Subcategory\
  \ Grouping'\nFROM Inventory\nGROUP BY ROLLUP(Category, Subcategory)\n```\n\n输出是：\n\
  \n![Image](img/104tab01.jpg)\n\n让我们检查输出以看看 `GROUPING` 函数实现了什么。该函数有一个参数，即要检查的列名，它返回\
  \ 0 或 1。1 表示该行包含了 `GROUP BY` 子句中 `ROLLUP` 指定的列的小计或总计。在示例中，`ROLLUP` 作用于 `Category`\
  \ 和 `Subcategory`。因此，对于 `Subcategory` 的 `GROUPING` 函数如果该行包含小计或总计，则返回 1。`Subcategory`\
  \ 显示为 `NULL` 是因为我们只显示了类别的小计。第二个小计行是第六行，它汇总了纸张（Paper）类别，表示有 11 件纸质物品。最后一行是总计列，汇总了所有类别的所有物品，表明库存中总共有\
  \ 20 件物品。\n\n注意，输出中出现的 `NULL` 与我们之前看到的 `NULL` 值有所不同。在这种情况下，`NULL` 仅仅是表示已应用 `ROLLUP`\
  \ 的占位符。上一个语句没有包含 `ORDER BY` 子句。没有 `ORDER BY`，小计和总计行始终出现在每个类别之后。现在为语句添加 `ORDER BY`\
  \ 来查看差异：\n\n点击此处查看代码图片\n\n```sql\nSELECT\nCategory,\nSubcategory,\nSUM(Quantity)\
  \ AS 'Quantity'\nFROM Inventory\nGROUP BY ROLLUP(Category, Subcategory)\nORDER BY\
  \ Category, Subcategory\n```\n\n输出是：\n\n![Image](img/103tab02.jpg)\n\n如你所见，`ORDER\
  \ BY` 子句改变了小计行和总计行的位置。它们现在出现在每个类别之前而不是之后。这是因为 `NULL` 值是可能的最低值，所以它们在排序序列中首先出现。\n\n\
  显而易见，在上述示例中使用 `NULL` 值有些晦涩且难以解释。我们现在展示如何将这些 `NULL` 值转换为更具意义的内容。这是通过一个名为 `GROUPING`\
  \ 的函数实现的。这是一个与 `ROLLUP` 关键字配合使用的特殊聚合函数。正如下一节所示，`GROUPING` 也可以与 `CUBE` 关键字配合使用。接下来的示例添加了两个使用了\
  \ `GROUPING` 函数的列。为了简化，我们将移除 `ORDER BY` 子句。\n\n点击此处查看代码图片\n\n```sql\nSELECT\nCategory,\n\
  Subcategory,\nSUM(Quantity) AS 'Quantity',\nGROUPING(Category) AS 'Category Grouping',\n\
  GROUPING(Subcategory) AS 'Subcategory Grouping'\nFROM Inventory\nGROUP BY ROLLUP(Category,\
  \ Subcategory)\n```\n\n输出是：\n\n![Image](img/104tab01.jpg)\n\n让我们检查输出以看看 `GROUPING`\
  \ 函数实现了什么。该函数有一个参数，即要检查的列名，它返回 0 或 1。1 表示该行包含了 `GROUP BY` 子句中 `ROLLUP` 指定列的小计或总计。在示例中，`ROLLUP`\
  \ 作用于 `Category` 和 `Subcategory`。因此，对于 `Subcategory` 的 `GROUPING` 函数如果该行包含小计或总计，则返回\
  \ 1。`Subcategory` 显示为 `NULL` 是因为我们只显示了类别的小计。第二个小计行是第六行，它汇总了纸张（Paper）类别，表示有 11 件纸质物品。最后一行是总计列，汇总了所有类别的所有物品，表明库存中总共有\
  \ 20 件物品。\n\n现在我们已经知道了 `GROUPING` 函数的作用，让我们充分利用它吧。在下一个示例中，我们将引入 `CASE` 语句将 `GROUPING`\
  \ 函数的结果转换为更具意义的标签。\n\n点击此处查看代码图片\n\n```sql\nSELECT\nISNULL(Category,'') AS 'Category',\n\
  ISNULL(Subcategory, '') AS 'Subcategory',\nSUM(Quantity) AS 'Quantity',\nCASE\n\
  WHEN GROUPING(Category) = 1 THEN 'Grand Total'\nWHEN GROUPING(Subcategory) = 1 THEN\
  \ 'Subtotal'\nELSE ' ' END AS 'Subtotal/Total'\nFROM Inventory\nGROUP BY ROLLUP(Category,\
  \ Subcategory)\n```\n\n产生如下输出：\n\n![Image](img/105tab01.jpg)\n\n`Category` 和 `Subcategory`\
  \ 列中的 `ISNULL` 函数抑制了 `NULL` 单词的打印。新 `Subtotal/Total` 列中的 `CASE` 语句使用 `GROUPING`\
  \ 函数，如果数量是小计或总计，则打印“Subtotal”或“Grand Total”。\n\n还有更多方法可以使显示更易理解。在下面的示例中，我们将 `CASE`\
  \ 语句移动到了第一列。\n\n点击此处查看代码图片\n\n```sql\nSELECT\nCASE\nWHEN GROUPING(Category) = 1\
  \ THEN 'GRAND TOTAL'\nWHEN GROUPING(Subcategory) = 1 THEN 'SUBTOTAL'\nELSE ISNULL(Category,'')\
  \ END AS 'Category',\nISNULL(Subcategory, '') AS 'Subcategory',\nSUM(Quantity) AS\
  \ 'Quantity'\nFROM Inventory\nGROUP BY ROLLUP(Category, Subcategory)\n```\n\n现在的输出是：\n\
  \n![Image](img/103tab02.jpg)\n\n如你所见，`ORDER BY` 子句改变了小计行和总计行的位置。它们现在出现在每个类别之前而不是之后。这是因为\
  \ `NULL` 值是可能的最低值，所以它们在排序序列中首先出现。\n\n显而易见，在上述示例中使用 `NULL` 值有些晦涩且难以解释。我们现在展示如何将这些\
  \ `NULL` 值转换为更具意义的内容。这是通过一个名为 `GROUPING` 的函数实现的。这是一个与 `ROLLUP` 关键字配合使用的特殊聚合函数。正如下一节所示，`GROUPING`\
  \ 也可以与 `CUBE` 关键字配合使用。接下来的示例添加了两个使用了 `GROUPING` 函数的列。为了简化，我们将移除 `ORDER BY` 子句。\n\
  \n### 数据库差异：MySQL\n\nMySQL 对 `ROLLUP` 关键字的格式略有不同。此 SQL Server 代码在 MySQL 中的等效语句为：\n\
  \n点击此处查看代码图片\n\n```sql\nGROUP BY ROLLUP(Category, Subcategory)\n```\n\n点击此处查看代码图片\n\
  \n```sql\nGROUP BY Category, Subcategory WITH ROLLUP\n```\n\n如果使用了 `WITH ROLLUP`，MySQL\
  \ 不允许使用 `ORDER BY` 子句。此外，MySQL 不支持 `GROUPING` 函数。\n\n\n\nRollups 在数据具有层级结构的情况下效果良好。在之前的示例中，存在一个从类别到子类别的自然层次结构。因此，你可以将其为从类别到子类别的下钻。`ROLLUP`\
  \ 关键字提供了每个类别的小计，并在末尾提供了一个总计。\n\n然而，在其他某些情况下，数据并不是层级的，但我们仍然想要添加小计行。为了说明这种场景，让我们来看以下数据。\n\
  \n![Image](img/106tab01.jpg)\n\n这些数据显示了按客户和日期划分的销售额，指示了销售的状态和渠道。在这个例子中，只有两个状态（NY\
  \ 和 VT）和两个渠道（Internet 和 retail）。假设我们对学习按州和渠道的总销售额感兴趣。尽管我们有多个客户在多个日期的销售记录，但目前我们不需要按客户或日期进行聚合。我们可以通过此语句查看按州和渠道划分的总销售额：\n\
  \n点击此处查看代码图片\n\n```sql\nSELECT\n  State,\n  Channel,\n  SUM(SalesAmount) AS 'Sales\
  \ Amount'\nFROM SalesSummary\nGROUP BY State, Channel\nORDER BY State, Channel\n\
  ```\n\n生成的输出是：\n\n![Image](img/107tab01.jpg)\n\n到目前为止，我们只应用了简单的 `GROUP BY` 来获取每个州和渠道组合的聚合销售额。现在，假设我们想看到小计和总计行，类似于我们之前处理家具库存数据时所做的。我们面临的问题是，州和渠道之间不存在像类别和子类别那样的自然层次结构。如果我们使用小计，没有明显的方法来指示如何计算这些小计。事实上，我们希望同时看到州和渠道的小计，且它们是相互独立的。\n\
  \n为了实现这一点，我们将使用一个新的关键字 `CUBE`，类似于我们之前使用 `ROLLUP` 的方式。以下语句产生了所需的结果：\n\n点击此处查看代码图片\n\
  \n```sql\nSELECT\n  State,\n  Channel,\n  SUM(SalesAmount) AS 'Sales Amount'\nFROM\
  \ SalesSummary\nGROUP BY CUBE(State, Channel)\nORDER BY State, Channel\n```\n\n\
  输出是：\n\n![Image](img/107tab02.jpg)\n\n与之前的示例一样，`State` 和 `Channel` 列中的 `NULL` 值表示小计或总计。第一行（`State`\
  \ 和 `Channel` 均为 `NULL`）是所有数据的总计。第二行和第三行（`State` 列为 `NULL`）显示 `Channel` 列的小计。例如，第二行表示\
  \ Internet 销售额总计为 820。第四行和第七行（`Channel` 列为 `NULL`）具有 `State` 列的小计。所示，NY 的销售额总计为\
  \ 980，VT 的销售额为 340。\n\n使用关键字 `CUBE` 是为了以一种多维度的方式查看数据。`ROLLUP` 关键字让你以层级化的方式下钻数据，而\
  \ `CUBE` 关键字允许多个维度。在这个例子中，我们可以按 `State` 或按 `Channel` 查看小计。\n\n和以前一样，识别小计和总计是比较困难的。理想情况下，你希望消除所有的\
  \ `NULL` 值，并更精确地指示哪些行是小计，哪些行是总计。与 rollups 一样，我们可以使用 `GROUPING` 函数来确定哪些行是小计。以下查询添加了带有\
  \ `GROUPING` 信息的列。\n\n点击此处查看代码图片\n\n```sql\nSELECT\n  State,\n  Channel,\n  SUM(SalesAmount)\
  \ AS 'Sales Amount',\n  GROUPING(State) AS 'State Grouping',\n  GROUPING(Channel)\
  \ AS 'Channel Grouping'\nFROM SalesSummary\nGROUP BY CUBE(State, Channel)\nORDER\
  \ BY State, Channel\n```\n\n此的输出是：\n\n![Image](img/108tab01.jpg)\n\n我们还没有达到输出结果上有意义的程度，但现在我们将耍点花筋，使用\
  \ `GROUPING` 函数以及其他一些技巧来让这个输出更具可读性。我们将执行以下语句，并在看到输出后进行解释。\n\n点击此处查看代码图片\n\n```sql\n\
  SELECT\n  ISNULL(State,' ') AS 'State',\n  ISNULL(Channel, ' ') AS 'Channel',\n\
  \  SUM(SalesAmount) AS 'Sales Amount',\n  CASE \n    WHEN GROUPING(State) = 1 AND\
  \ GROUPING(Channel) = 1 THEN 'Grand Total'\n    WHEN GROUPING(State) = 1 AND GROUPING(Channel)\
  \ = 0 THEN 'Channel Subtotal'\n    WHEN GROUPING(State) = 0 AND GROUPING(Channel)\
  \ = 1 THEN 'State Subtotal'\n    ELSE ' ' END AS 'Subtotal/Total'\nFROM SalesSummary\n\
  GROUP BY CUBE(State, Channel)\nORDER BY\n  CASE\n    WHEN GROUPING(State) = 0 AND\
  \ GROUPING(Channel) = 0 THEN 1\n    WHEN GROUPING(State) = 0 AND GROUPING(Channel)\
  \ = 1 THEN 2\n    WHEN GROUPING(State) = 1 AND GROUPING(Channel) = 0 THEN 3\n  \
  \  ELSE 4\n  END\n```\n\n输出是：\n\n![Image](img/109tab01.jpg)\n\n让我们现在停一下，讨论这个输出是如何产生的。第一列使用\
  \ `CASE` 语句，仅在行不是小计或总计时才打印 State 标签。同样，第二列对 Channel 标签执行相同的操作。第三列使用 `SUM` 函数打印该行的销售额。第四列使用\
  \ `CASE` 语句产生 Subtotal/Total 标签。如你所示，它判断是 State 小计、Channel 小计还是总计。\n\n### 数据库差异：MySQL\n\
  \nMySQL 不支持 `CUBE` 关键字。\n\n### 创建交叉布局\n\n通过 `ROLLUP` 和 `CUBE` 添加的小计行为你的查询提供了更多的聚合可能性。通过显示额外的小计行，我们可以在查看详细的同时查看摘要信息。我们现在转向摘要数据的典型呈现方式。\n\
  \n\n\n交叉表的优点在于它更加紧凑，并且易于在数据中进行导航。例如，如果我们感兴趣查找 VT 州的零售销售额，只需找到 `Retail` 行和 `VT` 列，然后找到它们的交点即可。使用传统的聚合摘要表，我们需要扫描各个行，直到找到具有所需\
  \ `Channel` 和 `State` 值的行。\n\n现在让我们来看看是如何实现上述交叉表输出的。创建此输出的查询语句如下：\n\n点击此处查看代码图片\n\
  \n```sql\nSELECT * FROM\n(SELECT Channel, State, SalesAmount FROM SalesSummary)\
  \ AS mainquery\nPIVOT (SUM(SalesAmount) FOR State IN ([NY], [VT])) AS pivotquery\n\
  ```\n\n这比我们之前见过的任何内容都要复杂得多。在某种程度上，这就像是将两个查询组合在一起——这个主题将在第 13 章 和第 14 章 中进行讨论。为了破解这个语句，我们需要将它拆解为各个组成部分。查询第二行中括号内的部分是：\n\
  \n```sql\nSELECT\nChannel,\nState,\nSalesAmount\nFROM SalesSummary\n```\n\n此查询选择了\
  \ `SalesSummary` 表中感兴趣的三个列的所有数据。紧随其后的 `AS` 关键字用于为整个查询提供别名。在这种情况下，我们将其命名为 `mainquery`，这是一个任意的名称；我们可以给它起任何名字。\n\
  \n第三行引入了 `PIVOT` 运算符。该关键字表示我们将对随后的数据项进行透视（pivot）。这意味着我们希望数据以交叉表的形式出现。列出的第一个始终始终聚合函数。在这个例子中，它是：\n\
  \n`SUM(SalesAmount)`\n\n这表示我们想要对 `SalesAmount` 列中的值求和。随其后的 `FOR` 关键字将聚合函数与我们希望在透视表中作为单独列显示的字段隔开。在这个例子中，我们希望\
  \ `State` 的值作为单独列出现。`IN` 关键字将列名与我们希望作为列标题的值隔开。`PIVOT` 运算符要求我们显式列出想要作为列标题的值。在这个例子中，这些值是\
  \ `NY` 和 `VT`。注意，SQL Server 要求这些枚举值必须括在括号中，而不是普通的单引号。最后，我们为整个 `PIVOT` 表达式分配一个别名，在本例中为\
  \ `pivotquery`。和 `mainquery` 别名一样，这完全是一个任意的名称。\n\n总结一下，我们看到该语句具有如下通用结构：\n\n点击此处查看代码图片\n\
  \n```sql\nSELECT * FROM\n(a SELECT query that produces the data) AS alias_for_source_query\n\
  PIVOT (aggregation_function(column)\nFOR column_for_column_headers\nIN pivot_column_values)\n\
  AS alias_for_pivot_table\n```\n\n起初看起来，为了产生一个并不比原始输出显著更有用的结果，似乎付出了许多不必要的额外工作。为了更好地说明\
  \ `PIVOT` 运算符的价值，让我们现在向组合中添加另一层聚合，即销售日期。回到非交叉表查询，我们可以运行原始查询的这个变体：\n\n点击此处查看代码图片\n\
  \n```sql\nSELECT\nSalesDate,\nState,\nChannel,\nSUM(SalesAmount) AS Total\nFROM\
  \ SalesSummary\nGROUP BY SalesDate, State, Channel\nORDER BY SalesDate, State, Channel\n\
  ```\n\n如你所见，我们在 `GROUP BY` 和 `ORDER BY` 子句中添加了 `SalesDate`。输出如下：\n\n![Image](img/112tab01.jpg)\n\
  \n随着行的增加，这变得稍微难以解释了。例如，如果我们想找到 2017 年 4/2 `NY` 的零售销售额，我们必须扫描这些行，直到发现第五行提供了这些信息。此外，如果我们想找到\
  \ 2017 年 4/1 `VT` 的零售销售额，可能需要一些时间才能发现没有包含该信息的行。这是因为我们的底层数据在 2017 年 4/1 确实没有来自 `VT`\
  \ 的零售销售额。\n\n使用 `PIVOT` 运算符，我们可以以交叉表布局产生相同的数据，从而更容易定位所需的数据点。我们的目标是产生这种格式的数据：\n\n\
  ![Image](img/112tab02.jpg)\n\n可以通过以下 `PIVOT` 语句实现：\n\n点击此处查看代码图片\n\n```sql\nSELECT\
  \ * FROM\n(SELECT SalesDate, Channel, State, SalesAmount FROM SalesSummary)\nAS\
  \ mainquery\nPIVOT (SUM(SalesAmount) FOR State IN ([NY], [VT])) AS pivotquery\n\
  ORDER BY SalesDate\n```\n\n我们对之前的 `PIVOT` 语句只做了两处更改。首先，我们将 `SalesDate` 作为语句中 `mainquery`\
  \ 部分的被选列。其次，我们添加了 `ORDER BY` 子句，这使得行按日期排序。与以前不同，我们现在在交叉表中按日期对行进行排序。`SalesDate` 和\
  \ `Channel` 字段现在都在行区域。注意，对于 2017 年 4/1 `VT` 的销售额我们看到了 `NULL` 值。这显式地告诉我们没有这样的销售额。请注意\
  \ `mainquery` 中的字段顺序是重要的。在查询中，我们在 `Channel` 之前列出了 `SalesDate`。我们可以轻松地切换这两个列的顺序，如下所示：\n\
  \n```sql\nSELECT * FROM\n(SELECT SalesDate, State, SalesAmount FROM SalesSummary)\
  \ AS mainquery\nPIVOT (SUM(SalesAmount) FOR State IN ([NY], [VT])) AS pivotquery\n\
  ORDER BY Channel\n```\n\n如你所见，输出有所不同，但包含的信息相同。![113tab01]\n\n一旦交叉表查询中有多个数据元素，就有许多安排数据的方法。例如，我们可以选择将\
  \ `Channel` 放在列区域而不是 `State`。这将是：\n\n![Image](img/113tab02.jpg)\n\n产生这种布局的语句是：\n\
  \n点击此处查看代码图片\n\n```sql\nSELECT * FROM\n(SELECT SalesDate, Channel, State, SalesAmount\
  \ FROM SalesSummary)\nPIVOT (SUM(SalesAmount) FOR Channel IN ([Internet], [Retail]))\
  \ AS pivotquery\nORDER BY SalesDate\n```\n\n此查询中的主要更改是我们在语句的 `pivotquery` 部分指定了\
  \ `Channel` 值。这使得 `Channel` 值（`Internet` 和 `Retail`）在显示中被拆分为单独的列。\n\n记住，使用 `PIVOT`\
  \ 命令的一个主要困难是所有列值都必须显式列出。如果你在查询数据，你必须在编写查询之前知道这些值。对于小的分类数据项，这可能不是问题。但对于随时间变化的许多可能值的数据，可能会出现问题。在第\
  \ 20 章 “显示数据的策略”，我们将讨论 PIVOT 交叉查询的替代方案——即 Excel 透视表。与交叉查询不同，透视表不需要用户预先知道哪些值。透视表根据出现的值动态地显示行和列。因此，给用户原始数据并让他们通过\
  \ Excel 透视表创建交叉布局通常更为快捷。\n\n### 数据库差异：MySQL 和 Oracle\n\nMySQL 不支持 `PIVOT` 关键字。\n\
  \nOracle 的 `PIVOT` 关键字语法略有不同。此 SQL Server 语句的等语句为：\n\n点击此处查看代码图片\n\n```sql\nSELECT\
  \ * FROM\n(SELECT Channel, State, SalesAmount FROM SalesSummary) AS mainquery\n\
  PIVOT (SUM(SalesAmount) FOR State IN ([NY], [VT])) AS pivotquery\n```\n\n\n\nOracle\
  \ 中的语法为：\n\n点击此处查看代码图像\n\n```sql\nSELECT * FROM\n(SELECT Channel, State, SalesAmount\
  \ FROM SalesSummary)\nPIVOT (SUM(SalesAmount) FOR State IN ('NY', 'VT'));\n```\n\
  \n与 SQL Server 不同，Oracle 在枚举值中使用引号而不是方括号，并且不使用别名（此示例中的 mainquery 和 pivotquery）。\n\
  \n***\n\n### 展望\n\n本章在布局问题上进行了略微的转场。`ROLLUP` 和 `CUBE` 关键字允许 `GROUPING` 子句在任意数量的列上生成额外的的小计行。`ROLLUP`\
  \ 关键字对于列之间具有清晰层级关系的数据效果最好。在示例中，`Inventory` 表的 `Category` 和 `Subcategory` 列之间存在层级关系。相比之下，`CUBE`\
  \ 关键字会生成指定列的所有小计组合。正如立方体结构一样，可以从任何角度查看小计。我们还讨论了 `GROUPING` 函数，它提供了一种增加小计显示清晰度的方法。\n\
  \n我们在本章的第二个主题是交叉表（crosstabs），使用了 `PIVOT` 操作符来生成实用的交叉表布局数据。虽然 `PIVOT` 查询创建起来相当复杂，但它们有时可以为终端用户生成易于理解的格式数据。在第\
  \ 20 章中，我们将讨论 Excel 透视表，这通常是以交叉方式显示数据的更简单的方法。\n\n在下一章“内连接”中，我们将从这次转场回到本书的核心关注点。到目前为止，我们所有的查询都涉及一次从一个表中检索数据。接下来的几章将探索一次性从多个表中组合数据的方法。在计算机的现实世界中，所需的数据来自单个表。因此，学习如何在单个查询中关联并组合来自多个一个表的数据至关重要。\n\
  \n## 11. 内连接\n\n### 引入的关键字\n`INNER JOIN` • `ON`\n\n回到第 1 章，我们讨论过关系型数据库较于其前任的巨大进步。关系型数据库的重大成就是它们能够将数据组织在任意数量的表中，这些表相互相关但同时又是相互独立的。在关系型数据库出现之前，传统数据库利用内部指针链来显式定义表与表之间的关系。例如，你可能从\
  \ `Customers` 表开始，然后沿着指针找到特定客户的首笔订单，然后是下一个订单，以此此类推，直到检索到该客户的所有订单。相比之下，关系型数据库允许通过表共有的列来推断关系。这些关系有时通过主键和外键的定义被形式化，但这并不总是必要的。\n\
  \n对于关系型数据库，SQL 开发人员有责任确定并定义表与表之间的关系。这为不同数据元素的组合方式提供了极大的灵活性。关系型数据库的巨大优点在于，人们可以以满足即时业务需求的方式从各种表中抓取数据。\n\
  \n让我们从一个常见的示例开始。大多数组织都有一个名为“客户”（customer）的业务实体。因此，数据库通常包含一个 `Customers` 表来定义每个客户。这样的表通常会包含一个主键来唯一标识每个客户，以及任意数量带有进一步定义客户属性的列。常见属性可能包括电话号码、地址、城市、州等。\n\
  \n核心思想是关于客户的所有信息都存储在单个表中，且仅存储在那个表中。这简化了数据更新的任务。当客户更改电话号码时，只需要更新一个表。然而，这种设置的缺点是，每当有人需要客户的任何信息时，他们必须访问\
  \ `Customers` 表来检索数据。\n\n这引出了“连接（join）”的概念。假设有人正在分析已购买的产品。除了产品信息外，可能还需要提供购买每种产品的客户信息。例如，分析师可能希望为了地理分析获取客户的邮政编码。虽然产品信息可以在\
  \ `Products` 表中找到，但邮政编码仅存储在 `Customers` 表中。为了获取有关客户和产品的信息，分析师必须将两张表连接起来，使数据正确匹配。\n\
  \n本质上，关系型数据库的承诺是通过以任何所需方式将表连接在一起的能力实现的。这是正常情况。通过本章，我们将离开那些仅从单个表中检索数据的、有些人工的示例，遇到涉及多个表数据的更真实的场景。\n\
  \n### 连接两个表\n\n为了开始对连接过程的探索，让我们回顾一下之前在第 3 章和第 6 章中遇到的 `Sales` 表：\n\n![Image](img/116tab01.jpg)\n\
  \n在某种程度上，在前面的章节中使用该表具有某种误导性。事实上，一个胜任的数据库设计人员很少创建这样的表。问题在于它包含了关于两个独立实体——客户和订单的信息。在现实世界中，这些信息将被分成至少两个独立的表。`Customers`\
  \ 表看起来可能像下面的表，该表之前在第 2 章“基础数据检索”中出现过：\n\n![Image](img/116tab02.jpg)\n\n一个 `Orders`\
  \ 表可能如下：\n\n![Image](img/116tab03.jpg)\n\n在这个 `Orders` 表中，我们选择包含 `OrderDate` 和 `OrderAmount`\
  \ 列，而不是第一个 `Sales` 表中的 `QuantityPurchased` 和 `PricePerItem` 列。注意，`Sales` 表中的数据现在已拆分成两个独立的表。`Customers`\
  \ 表仅包含关于客户的信息。`Orders` 表仅包含关于购买物品的信息。`Orders` 表包含一个 `CustomerID` 列以指示哪个客户下了订单。正如你可能从第\
  \ 1 章“关系型数据库与 SQL”中记得的那样，这被称为外键。\n\n尽管 `Customers` 表和 `Orders` 表都有四行，但这是某种巧合。`Customers`\
  \ 表中有一个客户没有下订单。正如你可以看到的，`CustomerID` 4 的 Samuel Martinez 没有出现在 `Orders` 表中。相反，Rumi\
  \ Shah 下了两个不同的订单，正如 `Orders` 表中 `CustomerID` 为 2 的两行所证明的。\n\n\n\n\n\n在我们进入 `SELECT`\
  \ 语句本身之前，我们需要处理另一个额外问题，即如何在视觉上表示这两个表以及它们之间存在的隐含关系。之前，我们通过行来显示每个表，在顶行显示列名，在后续行显示对应的数据。现在我们有多个表需要处理，我们将引入另一种视觉表示方式。图\
  \ 11.1 显示了一个包含两个表的图表，顶行显示表名，随后的每行显示列名。此图是通常被称为 `entity-relationship`（实体-关系）关系图的简化版。`entity`（实体）一词指的是表，而\
  \ `relationship`（关系）指的是在这些表的数据元素之间绘制的线条。该图没有显示详细数据，而是指示数据的整体结构。\n\n![Image](img/11fig01.jpg)\n\
  \n图 11.1 实体关系图\n\n需要注意的重要点是，我们从 `Customers` 表中的 `CustomerID` 连线到 `Orders` 表中的 `CustomerID`。这表示这两个表之间存在关系——即这两个表共享存储在\
  \ `CustomerID` 列中的值。\n\n### 内连接 (Inner Join)\n\n我们现在准备好展示一个带有 `inner join`（内连接）的\
  \ `SELECT` 语句：\n\n点击此处查看代码图像\n\n```sql\nSELECT *\nFROM Customers\nINNER JOIN Orders\n\
  ON Customers.CustomerID = Orders.CustomerID\n```\n\n让我们逐行检查此语句。第一行的 `SELECT` 关键字仅表示我们想要两个表的所有（`*`）列。第二行带有\
  \ `FROM` 子句，表示我们想要指定的第一个表是 `Customers` 表。第三行引入了新的 `INNER JOIN` 关键字。该关键字用于指定我们想要包含在查询中的另一个表。在这种情况下，我们想要添加\
  \ `Orders` 表。\n\n最后，第四行引入了 `ON` 关键字。这个 `ON` 与 `INNER JOIN` 结合工作，并精确指定了两个表如何如何连接。在这种情况下，我们将\
  \ `Customers` 表的 `CustomerID` 列（`Customers.CustomerID`）连接到 `Orders` 表的 `CustomerID`\
  \ 列（`Orders.CustomerID`）。由于 `CustomerID` 列在 `Customers` 和 `Orders` 表中具有相同的名称，我们需要将表名作为\
  \ `CustomerID` 列名的以前缀。该前缀允许我们区分两个独立表中的这些列。\n\n之前的 `SELECT` 语句产生了此数据：\n\n![Image](img/118tab01.jpg)\n\
  \n让我们分析一下结果。`Customers` 表和 `Orders` 表都有四行。查看 `OrderID` 列，你可以发现我们拥有来自 `Orders` 表所有四行的数据。然而，查看\
  \ `CustomerID` 列，你可能会注意到只显示了三个客户。为什么这是？答案是 `CustomerID` 为 4 的客户在 `Orders` 表中不存在。由于我们根据\
  \ `CustomerID` 字段将两个表连接在一起，`Orders` 表中没有行可以匹配 `Customers` 表中 `CustomerID` 为 4。\n\
  \n这让我们引出了一个重要的观察：`inner join`（内连接）只返回两个被连接的表之间存在匹配项的数据。在下一章中，我们将讨论另一种连接表的方法，该方法允许即使该客户没有订单也能显示\
  \ `CustomerID` 为 4 的客户信息。\n\n这里是第二个重要的观察：注意 Rumi Shah 的客户数据重复两次。她在 `Customers` 表中只存在一次，因此人们可能会奇怪她为什么出现在两行中。答案是\
  \ `INNER JOIN` 导致所有可能的匹配项都被显示出来。因为 Rumi 在 `Orders` 表中有两行，这两行都与她在 `Customers` 表中的行相匹配，导致她的客户信息被显示了两次。\n\
  \n最后，你可能想知道为什么这种连接被称为内连接。事实上，连接有两种主要的变体：`inner join`（内连接）和 `outer join`（外连接）。外连接将在下一章中介绍。\n\
  \n### 内连接中的表顺序\n\n`inner join`（内连接）带回两个指定表之间存在匹配的数据。在之前的 `SELECT` 中，我们在 `FROM` 子句中指定了\
  \ `Customers` 表，在 `INNER JOIN` 子句中指定了 `Orders` 表。我们可能会问先指定哪个表是否重要。事实证明，对于内连接，列出表的顺序可以反转，而结果没有区别。以下两个\
  \ `SELECT` 语句在逻辑上是等同的并返回相同的数据：\n\n点击此处查看代码图像\n\n```sql\nSELECT *\nFROM Customers\n\
  INNER JOIN Orders\nON Customers.CustomerID = Orders.CustomerID\n\nSELECT *\nFROM\
  \ Orders\nINNER JOIN Customers\nON Orders.CustomerID = Customers.CustomerID\n```\n\
  \n唯一的区别是第一个语句会先显示 `Customers` 表的列，后显示 `Orders` 表的列。第二个语句会先显示 `Orders` 表的列，后显示 `Customers`\
  \ 表的列。尽管列的顺序不同，两个语句返回相同的数据。\n\n记住 SQL 不是一种过程化语言。它不指定如何完成任务。SQL 只指示所需的逻辑，并留给数据库内部来决定具体如何执行所需任务。因此，SQL\
  \ 并不决定数据库如何物理地检索数据。它没有定义物理上先查看哪个表。相反，数据库软件决定获取数据的最佳方法。\n\n### 内连接的另一种指定方式\n\n在之前的示例中，我们使用\
  \ `INNER JOIN` 和 `ON` 关键字来指定内连接。也可以仅通过 `FROM` 和 `WHERE` 子句来指定内连接。我们已经看过了这个连接 `Customers`\
  \ 和 `Orders` 表的语句：\n\n点击此处查看代码图像\n\n```sql\nSELECT *\nFROM Customers\nINNER JOIN\
  \ Orders\nON Customers.CustomerID = Orders.CustomerID\n```\n\n在不使用 `INNER JOIN`\
  \ 和 `ON` 关键字的情况下指定相同内连接的另一种方式是：\n\n点击此处查看代码图像\n\n```sql\nSELECT *\nFROM Customers,\
  \ Orders\nWHERE Customers.CustomerID = Orders.CustomerID\n```\n\n在这种另一种指定方式中，不再使用\
  \ `INNER JOIN` 关键字来定义要连接的新表，而是简单地在 `FROM` 子句中列出所有要连接的表。我们没有使用 `ON` 子句来说表之间的关系，而是使用\
  \ `WHERE` 子句来指定关系。\n\n尽管这种替代格式运行良好并产生相同的结果，但不建议使用它。`INNER JOIN` 和 `ON` 关键字的优势在于它们显式地展示了连接逻辑。那是它们唯一的用途。虽然可以在\
  \ `WHERE` 子句中指定关系，但当 `WHERE` 子句用于选择标准同时也指示多个表之间的关系时，SQL 语句的含义就不那么明显。\n\n### 重新回顾表别名现在让我们查看之前的\
  \ `SELECT` 语句返回的列。因为我们指定了所有（`*`）列，所以看到了两个表的所有列。`CustomerID` 列出现了两次，因为该列在两个表中都存在。实践中，我们不希望这些数据重复。这里是\
  \ `SELECT` 的另一种版本，现在指定了我们想要看到的列。在这个变体中，我们采用了表别名，`C` 代表 `Customers`，`O` 代表 `Orders`，通过插入\
  \ `AS` 关键字将它们放在 `FROM` 和 `INNER JOIN` 关键字之后。语句如下：\n\n点击此处查看代码图像\n\n```sql\nSELECT\n\
  C.CustomerID AS 'Cust ID',\nC.FirstName AS 'First Name',\nC.LastName AS 'Last Name',\n\
  O.OrderID AS 'Order ID',\nO.OrderDate AS 'Date',\nO.OrderAmount AS 'Amount'\n```\n\
  \n\n\n\n```sql\nFROM Customers AS C\nINNER JOIN Orders AS O\nON C.CustomerID = O.CustomerID\n\
  ```\n结果如下：\n\n![Image](img/120tab01.jpg)\n\n在此条语句中，我们只显示了 `Customers` 表中的 `CustomerID`，而不是\
  \ `Orders` 表中的。请注意，我们使用了 `AS` 关键字来指定列别名和表别名。请注意，`AS` 关键字是完全可选的。可以从此 `SELECT` 中移除所有的\
  \ `AS` 关键字，该语句仍然有效并返回相同的的结果。然而，为了清晰起见，我们建议使用 `AS` 关键字。\n\n***\n\n### 数据库差异：Oracle\n\
  \n正如第 3 章中提到的“计算字段和别名”所示，在 Oracle 中指定表别名时不使用 `AS` 关键字。Oracle 中等效语句的语法如下：\n\n点击此处查看代码图像\n\
  \n```sql\nSELECT\n  C.CustomerID AS \"Cust ID\",\n  C.FirstName AS \"First Name\"\
  ,\n  C.LastName AS \"Last Name\",\n  O.OrderID AS \"Order ID\",\n  O.OrderDate AS\
  \ \"Date\",\n  O.OrderAmount AS \"Amount\"\nFROM Customers C\nINNER JOIN Orders\
  \ O\nON C.CustomerID = O.CustomerID;\n```\n\n虽然我们看到列别名使用了 `AS` 关键字，但在 Oracle 中，表别名并不使用\
  \ `AS` 关键字。\n\n***\n\n### 展望\n\n在查询中连接表的能力是 SQL 的一项基本功能。如果没有连接，关系型数据库将几乎毫无用处。本章重点关注了内连接（inner\
  \ join）的构建。内连接会返回在两个连接表之间存在匹配的数据。我们还讨论了指定内连接的另一种方法，以及使用表别名的用处。\n\n在下一章中，我们将转向另一种重要的连接类型：外连接（outer\
  \ join）。正如提到的，内连接仅允许我们查看被连接表之间存在匹配的数据。因此，如果你有一个没有订单的客户，那么在对 `Customers` 表和 `Orders`\
  \ 表之间进行内连接时，你将看不到任何客户信息。外连接将允许你查看该客户信息，即使该客户没有订单。换句话说，外连接让我们能够看到其他通过内连接无法获取的数据。此外，下一章将开始介绍涉及两个以上表连接的场景。\n\
  \n## 12. 外连接\n\n### 引入的关键字\n\n`LEFT JOIN` • `RIGHT JOIN` • `FULL JOIN` • `CROSS\
  \ JOIN`\n\n我们现在从内连接进到外连接。内连接的主要限制是，它们要求所有连接的表中都存在匹配才能显示任何结果。如果你正在将 `Customers` 表与\
  \ `Orders` 表连接，如果该客户尚未下过订单，则不会显示该客户的任何数据。这似乎是一个相对不重要的问题，但在处理不同类型的数据时，它往往会变得很重要。\n\
  \n换另一个例子来说，假设我们有一个 `Orders` 表和一个 `Refunds` 表。`Refunds` 表通过 `OrderID` 与 `Orders`\
  \ 表关联。换句话说，所有的退款都与特定的订单绑定。除非订单存在，否则退款不存在。当我们想在单个查询中同时查看订单和退款时，问题就出现了。如果我们用内连接连接这两个表，如果该订单没有签发任何退款，我们将看不到任何订单。推测，这应该是订单的大多数情况。外连接允许我们在即使没有匹配的退款的情况下也查看订单，因此它是理解和使用的一项基本技术。\n\
  \n### 外连接\n\n在上一章中看到的所有连接都是内连接。由于内连接是最常见的连接类型，SQL 将它们视为默认连接。你只需要使用关键字 `JOIN` 就可以指定内连接；没有必要声明\
  \ `INNER JOIN`。\n\n与内连接相反，外连接有三种类型：`LEFT OUTER JOIN`、`RIGHT OUTER JOIN` 和 `FULL\
  \ OUTER JOIN`。这些可以简单地简称为为 `LEFT JOIN`、`RIGHT JOIN` 和 `FULL JOIN`。在这种情况下，`OUTER`\
  \ 一词是不必要的。总而言之，我们的建议将这四种连接类型称为：\n\n- `INNER JOIN`\n- `LEFT JOIN`\n- `RIGHT JOIN`\n\
  - `FULL JOIN`\n\n这保持了语法的简单和一致性。在本章的结束处，我们还将简要说明一种名为 `CROSS JOIN` 的连接，但该连接既不是内连接也不是外连接，而且很少使用。\n\
  \n我们将在外连接的示例中使用三个表。第一个是包含每个客户信息的 `Customers` 表。第二个是包含每个已订单数据的 `Orders` 表。我们将使用与上一章相同的数据来引用\
  \ `Customers` 和 `Orders` 表。最后，我们将添加一个包含已向客户签发的任何退款信息的 `Refunds` 表。\n\n图 12.1 显示了这三个表是如何关联的。\n\
  \n![Image](img/12fig01.jpg)\n\n图 12.1 三表的实体关系图\n\n与上一章看到的图形相比，连接表的线现在显示为箭头。例如，从\
  \ `Customers` 表的 `CustomerID` 字段指向 `Orders` 表的 `CustomerID` 字段的箭头所示。这种单向关系意味着，可能某些客户没有订单。同样，`Orders`\
  \ 表和 `Refunds` 表之间的箭头表示，可能某些订单没有退款。`Customers` 表和 `Orders` 表之间的连接通过 `CustomerID`\
  \ 列进行，因为这是这两个表之间的共同字段。而 `Orders` 表和 `Refunds` 表之间的连接通过 `OrderID` 列进行，因为这是这两个表之间的共同字段。换句话说，`Refunds`\
  \ 表与 `Customers` 表没有直接关联；这两个表没有共同字段。然而，通过连接所有表，我们将能够确定某个退款属于哪个客户。必须有订单才能退款。\n\n\
  让我们现在检查每个表的内容。`Customers` 表有这些值：\n\n![Image](img/124tab01.jpg)\n\n`Orders` 表有这些值：\n\
  \n![Image](img/125tab01.jpg)\n\n`Refunds` 表有这些值：\n\n![Image](img/125tab02.jpg)\n\
  \n注意四个客户中只有三个下了订单。同样，四个订单中只有两个签发了退款。\n\n### 左连接\n\n让我们现在创建一个使用 `LEFT JOIN` 连接三个表的\
  \ `SELECT` 语句：\n\n点击此处查看代码图像\n\n```sql\nSELECT\n  Customers.FirstName AS 'First\
  \ Name',\n  Customers.LastName AS 'Last Name',\n  Orders.OrderDate AS 'Order Date',\n\
  \  Orders.OrderAmount AS 'Order Amt',\n  Refunds.RefundDate AS 'Refund Date',\n\
  \  Refunds.RefundAmount AS 'Refund Amt'\nFROM Customers\nLEFT JOIN Orders\nON Customers.CustomerID\
  \ = Orders.CustomerID\nLEFT JOIN Refunds\nON Orders.OrderID = Refunds.OrderID\n\
  ORDER BY Customers.LastName, Customers.FirstName, Orders.OrderDate;\n```\n\n结果数据如下：\n\
  \n![Image](img/125tab03.jpg)\n\n\n\n\n\n在分析之前的 `SELECT` 语句之前，注意数据中两个有趣的方面。首先，Samuel\
  \ Martinez 除了名字外没有显示任何其他数据。数据缺失的原因是 `Orders` 表中没有与该客户关联的行。外连接（outer join）的威力从这一点显而易见：即使\
  \ Samuel 没有订单，我们仍然可以看到他的某些数据。如果我们指定的是 `INNER JOIN` 而不是 `LEFT JOIN`，我们将完全看不到关于 Samuel\
  \ 的任何行。\n\n同样，Rumi Shah 的 2016 年 9 月 2 日订单以及 Paul Johnson 的订单都没有退款数据。这是因为 `Refunds`\
  \ 表中没有与这些订单关联的行。如果我们指定的是 `INNER JOIN` 而不是 `LEFT JOIN`，那么这两个订单也将完全无法看到任何行。\n\n现在让我们来检查\
  \ `SELECT` 语句本身。指定列的前几行并不是我们以前没见过的。注意，我们没有使用表别名，而是选择使用完全限定名列出所有列，包括将表名作为前缀。\n\n\
  列出的第一个表是 `Customers` 表。该表显示在 `FROM` 关键字之后。第二个表是 `Orders` 表，它出现在第一个 `LEFT JOIN` 关键字之后。随后的\
  \ `ON` 子句指定了 `Orders` 表如何链接到 `Customers` 表。显示的第三个表是 `Refunds` 表，它出现在第二个 `LEFT JOIN`\
  \ 关键字之后。随后的 `ON` 子句说明了 `Refunds` 表是如何连接到 `Orders` 表的。\n\n至关重要的一点是，相对于 `LEFT JOIN`\
  \ 关键字列出表的顺序具有意义。在指定 `LEFT JOIN` 时，`LEFT JOIN` 左侧的表始终是主表（primary）。`LEFT JOIN` 右侧的表是次级表（secondary）。在将从表连接到主表时，我们希望保留主表中的所有行，即使它们与从表中的任何行都没有匹配。\n\
  \n在第一个指定的 `LEFT JOIN` 中，`Customers` 表位于 `LEFT JOIN` 的左侧，`Orders` 表位于右侧。这意味着 `Customers`\
  \ 是主表，`Orders` 是从表。换句话说，我们希望看到 `Customers` 表中的所有数据，即使该行在从表中没有对应的项。\n\n同样，在第二个 `LEFT\
  \ JOIN` 中，`Orders` 表位于 `LEFT JOIN` 关键字的左侧，`Refunds` 表位于右侧。这意味着在这次连接中我们指定 `Orders`\
  \ 为主表，`Refunds` 为从表。我们想要所有的订单，即使某些订单没有匹配的退款。\n\n与内连接（inner joins）一样，如果一个表与其连接的表之间存在多个匹配行，则来自该表的数据可能会重复。在这个示例中，Rumi\
  \ Shah 有多个订单，因此 Rumi Shah 的客户信息在两个单独的行中重复。\n\n最后，我们包含了一个 `ORDER BY` 子句。这仅仅是为了以易于理解的顺序呈现数据。\n\
  \n### 测试 NULL 值\n\n在之前的 `SELECT` 中，我们有一个没有订单的客户和有两个没有关联退款的订单。与 `INNER JOIN` 不同，`LEFT\
  \ JOIN` 允许这些带有缺失值的行出现。\n\n为了测试我们对 `LEFT JOIN` 的理解，现在让我们看看如何只列出那些*没有*发行退款的订单。解决方案涉及添加一个测试\
  \ `NULL` 值的 `WHERE` 子句如下：\n\n点击此处查看代码图像\n\n```sql\nSELECT\nCustomers.FirstName AS\
  \ 'First Name',\nCustomers.LastName AS 'Last Name',\nOrders.OrderDate AS 'Order\
  \ Date',\nOrders.OrderAmount AS 'Order Amt'\nFROM Customers\nLEFT JOIN Orders\n\
  ON Customers.CustomerID = Orders.CustomerID\nLEFT JOIN Refunds\nON Orders.OrderID\
  \ = Refunds.OrderID\nWHERE Orders.OrderID IS NOT NULL\nAND Refunds.RefundID IS NULL\n\
  ORDER BY Customers.LastName, Customers.FirstName, Orders.OrderDate\n```\n\n结果数据是：\n\
  \n![Image](img/127tab01.jpg)\n\n`WHERE` 子句首先测试 `Orders.OrderID` 以确保它不是 `NULL`。这样做确保了我们不会看到从未下过订单的客户。`WHERE`\
  \ 子句的第二行测试 `Refunds.RefundID` 以确保它是 `NULL`。这保证了我们只看到那些没有匹配退款的订单。\n\n注意，在这次 `SELECT`\
  \ 中我们没有费力显示 `Refund Date` 或 `Refund Amount` 列。这是因为根据我们的选择标准，我们知道这些列始终具有 `NULL` 值。\n\
  \n### 右连接 (Right Joins)\n\n之前的 `SELECT` 语句使用了 `LEFT JOIN` 关键字。右连接的好处是，它们在概念上与左连接是相同的。左连接和右连接之间的唯一区别是连接中两个表列出的顺序。\n\
  \n在左连接中，主表列在 `LEFT JOIN` 关键字的左侧。从表（可能包含也可能不包含匹配行）列在 `LEFT JOIN` 关键字的右侧。\n\n在右连接中，主表列在\
  \ `RIGHT JOIN` 关键字的右侧。从表列在 `RIGHT JOIN` 关键字的左侧。这是唯一的区别。\n\n之前 `SELECT` 语句中的 `FROM`\
  \ 子句和连接为：\n\n点击此处查看代码图像\n\n```sql\nFROM Customers\nLEFT JOIN Orders\nON Customers.CustomerID\
  \ = Orders.CustomerID\nLEFT JOIN Refunds\nON Orders.OrderID = Refunds.OrderID\n\
  ```\n\n使用 `RIGHT JOIN` 关键字等等逻辑为：\n\n点击此处查看代码图像\n\n```sql\nFROM Refunds\nRIGHT JOIN\
  \ Orders\nON Orders.OrderID = Refunds.OrderID\nRIGHT JOIN Customers\nON Customers.CustomerID\
  \ = Orders.CustomerID\n```\n\n注意，只有在 `RIGHT JOIN` 前列出表的顺序是有意义的。`ON` 关键字之后的列顺序没有意义。因此，上述等同于：\n\
  \n点击此处查看代码图像\n\n```sql\nFROM Refunds\nRIGHT JOIN Orders\nON Orders.OrderID = Refunds.OrderID\n\
  ```\n\n本质上，如果你习惯 `LEFT JOIN`，完全没有必要使用 `RIGHT JOIN`。任何可以使用 `RIGHT JOIN` 指定的内容都可以用\
  \ `LEFT JOIN` 来。因此，我们的建议是坚持 `LEFT JOIN`，因为从左到右阅读的习惯让我们自然地先列出更重要的（即主要的）表。\n\n\n\n\
  \n\n```sql\nON Orders.OrderID = Refunds.OrderID)\nON Customers.CustomerID = Orders.CustomerID\n\
  ```\n\n原本相当简单的语句现在变得了不必要的复杂。我们展示这种逻辑是为了说明**不应该**怎么做，而且因为这是你在审查代码时可能会遇到的某些情况。我们的建议是在设计包含多个表的复杂\
  \ `FROM` 子句时，坚持使用 `LEFT JOIN` 关键字，并避免使用括号。\n\n### 全连接 (Full Joins)\n\n除了左连接（left\
  \ joins）和右连接（right joins）之外，还有一种外连接类型，被称为 `full join`（全连接）。我们已经看到在左连接和右连接中，一张表是主要的，另一张是从属的。或者你可以说一张表是必须的，另一张是可选的，这意味着在匹配两个表时，从表（或可选表）中的行并不一定存在。\n\
  \n在内连接（inner join）中，两张表都是主要的（或必须的）。在匹配两个表时，两个表之间必须存在匹配项，才能选中某行数据。\n\n在全连接中，两张表都是从表的（或可选的）。在这种情况下，如果我们匹配\
  \ `Table A` 和 `Table B` 中的行，那么我们将显示 1) `Table A` 中的所有行，即使 `Table B` 中没有匹配行；以及 2)\
  \ `Table B` 中的所有行，即使 `Table A` 中没有匹配行。\n\n***\n\n### 数据库差异：MySQL\n\n与 SQL Server\
  \ 和 Oracle 不同，MySQL 不允许全连接。\n\n***\n\n让我们来看一个匹配这两个表中的行的示例。首先，我们有这样一张 `Movies` 表：\n\
  \n![ImageImage](img/130tab01.jpg)\n\n其次，这里是 `Ratings` 表，包含了来自美国电影制作协会（MPAA）的评级描述：\n\
  \n![Image](img/130tab02.jpg)\n\n`Movies` 表包含数据库中的电影列表，并包含了每部电影的 MPAA 评级。`Ratings`\
  \ 表包含评级列表及其描述。假设我们想找到这两个表之间所有的匹配项。我们将使用 `FULL JOIN` 来显示 `Movies` 表的所有行以及 `Ratings`\
  \ 表的所有行。全连接将显示所有行，即使在另一个表中没有找到匹配项。`SELECT` 语句看起来如下：\n\n点击此处查看代码图像\n\n```sql\nSELECT\n\
  RatingDescription AS 'Rating Description',\nMovieTitle AS 'Movie'\nFROM Movies\n\
  FULL JOIN Ratings\nON Movies.Rating = Ratings.Rating\nORDER BY RatingDescription,\
  \ MovieTitle\n```\n\n该语句的输出是：\n\n![Image](img/131tab01.jpg)\n\n注意数据中有两个 `NULL` 单元格，这是使用\
  \ `FULL JOIN` 的直接结果。在第一情况下，`North by Northwest`（《西北风云》）没有显示评级，因为在 `Ratings` 表中没有该电影的匹配行。在第二种情况下，对于“Under\
  \ 17 Not Admitted”（17 岁以下不予入内）评级描述没有显示电影，因为在 `Movies` 表中没有该评级的匹配行。\n\n顺便提一下，注意我们选择没有在\
  \ `columnlist`（列列表）中使用表别名或指定表名。例如，我们直接列出了列 `MovieTitle` 而没有完全限定名（`Movies.MovieTitle`）。这是因为这些列仅存在于一个表中，所以即使不指定表名，指定列名也不会产生混淆。\n\
  \n`FULL JOIN` 在实践中很少使用，简单原因是这种表与表之间的关系相对较不常见。本质上，全连接显示了两个表之间在两个方向都不存在匹配的数据。我们通常只对两个表之间存在完全匹配的数据（内连接），或者可能是单侧匹配（左连接或右连接）。\n\
  \n### 交叉连接 (Cross Joins)\n\n本章讨论的最后一种连接类型是交叉连接，既不是内连接也不是外连接。本质上，交叉连接是在在不指定表之间任何关系的情况下连接两个表的方法。由于没有说明关系，交叉连接会产生表之间所有行的组合。在技术术语中，这被称为\
  \ `Cartesian product`（笛卡尔积）。如果一张表有三行，另一表有四行，并且对它们进行交叉连接，结果将有 12 行。由于这种连接的冷门性质，它在实践中很少使用。\n\
  \n考虑到这一点，让我们两个交叉连接的示例。在第一个示例中，想象我们是衬衫制造商，生产三种尺寸和四种颜色的衬衫。`SizeInventory` 表持有可用尺寸，如下所示：\n\
  \n![Image](img/132tab01.jpg)\n\n`ColorInventory` 表列出了可用颜色，包含了这些数据：\n\n![Image](img/132tab02.jpg)\n\
  \n我们想要确定可以生产的衬衫尺寸和颜色的所有可能组合。可以通过以下使用交叉连接的 `SELECT` 语句来实现：\n\n```sql\nSELECT\nSize,\n\
  Color\nFROM SizeInventory\nCROSS JOIN ColorInventory\n```\n\n结果的输出是：\n\n![Image](img/132tab03.jpg)\n\
  \n如你所见，交叉连接产生了两个表中所有行的组合。注意交叉连接中没有 `ON` 关键字。这是因为没有指定表之间的关系。这些表没有共同的列。两个表中的数据是相互独立的。\n\
  \n有趣的是，交叉连接也可以用上一章讨论的“替代”格式进行指定。也就是说，可以通过在 `FROM` 子句中列出两个表来指示交叉连接，而无需使用 `CROSS JOIN`\
  \ 关键字。以下 `SELECT` 语句与之前的 `CROSS JOIN` 语句等效，并产生相同的输出：\n\n点击此处查看代码图像\n\n```sql\nSELECT\n\
  Size,\nColor\nFROM SizeInventory, ColorInventory\n```\n\n之前的交叉连接示例代表的情况并不太现实。然而，第二个示例展示了交叉连接的一种相当常见的用法。在这个示例中，我们将我们有一个仅一行数据的特殊表，包含某些关键信息。由于该表只有一行，我们可以对其进行交叉连接而不会增加结果中的行数。为了说明，我们将使用这张\
  \ `SpecialDates` 表，它包含了与组织相关的日期：\n\n![Image](img/133tab01.jpg)\n\n在这种情况下，我们想从 `Orders`\
  \ 表中选择数据。但是，我们只想查看 `SpecialDates` 表中的 `LastProcessDate`。`LastProcessDate` 是经常变化的日期，给出系统最后处理的一组数据的日期。假设存在某些延迟，所以这可能不是当前日期。这个利用交叉连接的语句实现了这一目标。\n\
  \n```sql\nSELECT\nOrderID AS 'Order ID',\nOrderDate AS 'Date',\nOrderAmount AS 'Amount'\n\
  FROM Orders\nCROSS JOIN SpecialDates\nWHERE OrderDate = LastProcessDate\n```\n\n\
  结果的输出是：\n\n![Image](img/133tab02.jpg)\n\n从 `Orders` 表中只显示了一行数据。这是因为我们使用了 `SpecialDates`\
  \ 表中的 `LastProcessDate` 作为选择逻辑的一部分。注意，由于 `SpecialDates` 表只有一行，对其进行交叉连接没有坏处。它不会影响显示的行数。\n\
  \n### 展望\n\n\n\n\n本章将对连接的讨论扩展到外连接。`left join`（左连接）允许分析师将主表和从表连接在一起，即使从表中没有匹配项也会显示主表中的所有行。`right\
  \ join`（右连接）仅仅是 `left join`的反向，交换了主表和从表的顺序。最后，`full join`（全连接）允许两个表都成为从表。`full join`\
  \ 显示任意一个表中的所有行，即使另一张表中没有匹配项。我们还讨论了 `cross join`（交叉连接），这是一种很少使用的连接类型，用于显示被连接的两个表中行的所有组合。在\
  \ `cross join` 中，表之间的关系（如果存在的话）是不说明的。\n\n在下一章“自连接与视图””中，我们将对两个相关主题进行稍作转折。首先，我们将讨论\
  \ `self joins`（自连接），这允许我们将表与其自身连接的特殊技术。这创建了表的虚拟视图，从某种意义上说，我们现在可以从两个不同的视角查看此表。下一章的第二个主要主题将\
  \ `self joins` 的概念扩展到创建多个表虚拟视图的更通用方法。\n\n## 13. 自连接与视图\n\n### 引入的关键字\n`CREATE VIEW`\
  \ • `ALTER VIEW` • `DROP VIEW`\n\n前两章的内连接和外连接处理了从多个表中组合数据的各种方式。假设始终是数据存在于数据库的物理表中。现在我们将转向两种技术，它们将让我们以更虚拟的方式查看数据。第一种技术\
  \ `self join`（自连接）允许分析师将表与其自身连接，多次引用同一张表，就像它是两个独立的表一样。因此，`self join` 创建了表的虚拟视图，使其可以被多次使用。其次我们将学习数据库视图，这是一个非常有用的概念，允许我们随心所欲地创建新的虚拟表。\n\
  \n### 自连接\n\n`self join` 允许你将表与其自身连接。`self join` 最常用的用途是处理自引用表。这些表包含一列，该列引用同一张表中的另一个列。这种关系的常见例子是包含员工信息的表。\n\
  \n在接下来的示例中，`Personnel`（人员）表中的每行都有一个指向同一表内另一行的列，代表员工的经理。在某种程度上，这类似于外键的概念。主要区别在于，外键指向另一个表中的列，而我们现在的情况是一个列指向同一张表内的另一个列。\n\
  \n让我们看看这个 `Personnel` 表中的数据：\n\n![Image](img/136tab01.jpg)\n\n该表每个员工有一行。`ManagerID`\
  \ 列指出了员工向哪个经理汇报。该列中的 `ID` 对应于 `EmployeeID` 列中的一个值。例如，李华的 `ManagerID` 为 `1`。这意味着李华的经理是\
  \ Susan Carter，她的 `EmployeeID` 为 `1`。\n\n我们可以看到向 Susan Carter 汇报的三个个人是李华、Robert\
  \ Baker 和 Scott Fielding。注意 Susan Carter 在 `ManagerID` 列中没有值。这表明她是公司的负责人，因此没有经理。\n\
  \n现在，假设我们想列出所有员工，并显示每个员工汇报的经理名称。为了实现这一点，我们将创建 `Personnel` 表到其自身的自连接。在自连接时，必须始终使用表别名，以便我们有方法区分表的每个实例。我们将\
  \ `Personnel` 表的第一个实例命名为表别名 `Employees`，将第二个实例命名为表别名 `Managers`。语句如下：\n\n点击此处查看代码图片\n\
  \n```sql\nSELECT\nEmployees.EmployeeName AS 'Employee Name',\nManagers.EmployeeName\
  \ AS 'Manager Name'\nFROM Personnel AS Employees\nINNER JOIN Personnel AS Managers\n\
  ON Employees.ManagerID = Managers.EmployeeID\nORDER BY Employees.EmployeeName\n\
  ```\n\n结果数据为：\n\n![Image](img/136tab02.jpg)\n\n此 `SELECT` 查询中最复杂的部分是连接中的 `ON` 子句。为了让自连接正常工作，我们必须使用\
  \ `ON` 在 `Personnel` 表的 `Employees` 视图的 `ManagerID` 列与该表 `Managers` 视图的 `EmployeeID`\
  \ 列之间建立关系。换句话说，指定的经理也是一名员工。\n\n注意，在之前的数据中，Susan Carter 没有作为员工显示出来。这是因为我们在语句中使用了\
  \ `inner join`（内连接）。因为 Susan Carter 没有经理，因此在表的 `Managers` 视图中没有匹配项。如果我们想包含 Susan\
  \ Carter，只需将 `inner join` 改为 `outer join`（外连接）。新语句为：\n\n点击此处查看代码图片\n\n```sql\nSELECT\n\
  Employees.EmployeeName AS 'Employee Name',\nManagers.EmployeeName AS 'Manager Name'\n\
  FROM Personnel AS Employees\nLEFT JOIN Personnel AS Managers\nON Employees.ManagerID\
  \ = Managers.EmployeeID\nORDER BY Employees.EmployeeName\n```\n\n检索到的数据如下：\n\n![Image](img/137tab01.jpg)\n\
  \n### 创建视图\n\n`self join` 允许你将表与其自身连接，创建同一表的多个视图。现在我们将扩展这一概念，允许我们创建任何表或表组合的新视图。\n\
  \n视图只是保存在数据库中的 `SELECT` 语句。一旦保存，就可以像表一样被引用。数据库表包含数据；视图不包含数据，但允许你像真实表一样进行。因此，视图可以认为是虚拟表。此外，视图是持久的，不是暂时的。一旦创建，视图将一直被引用直到被删除。\n\
  \n你可能会问为什么需要视图。我们将在本章后面讨论的优势，但简而言之，视图为数据访问提供了额外的灵活性。无论数据库存在了几天还是多年，该数据库中的数据都是以特定的方式存储在表中。随着时间的推移，访问这些数据的需求发生了变化，但重新组织表以满足新需求并非易事。视图的巨大优势在于它们允许分析师对数据库现有数据创建新视图。视图允许你在无需物理重新排列数据的情况下创建等效的新表。因此，视图通过保持数据新鲜，为数据库设计增加了动态元素。\n\
  \n视图是如何存储在数据库中的？所有关系型数据库由许多不同的对象类型组成。最重要的对象类型是表。然而，大多数数据库管理软件允许保存许多其他对象类型。最常见的是视图和存储过程。SQL\
  \ 提供了 `CREATE VIEW` 关键字允许用户创建视图。通用语法如下：\n\n```sql\nCREATE VIEW ViewName AS\nSelectStatement\n\
  ```\n\n创建视图后，使用 `ViewName` 来引用视图中 `SelectStatement` 返回的数据。这里有一个示例。在上一章中，我们查看了这个\
  \ `SELECT` 语句：\n\n点击此处查看代码图片\n\n```sql\nSELECT\nCustomers.FirstName AS 'First Name',\n\
  Customers.LastName AS 'Last Name',\nOrders.OrderDate AS 'Order Date',\nOrders.OrderAmount\
  \ AS 'Order Amt',\nRefunds.RefundDate AS 'Refund Date',\nRefunds.RefundAmount AS\
  \ 'Refund Amt'\nFROM Customers\nLEFT JOIN Orders\nON Customers.CustomerID = Orders.CustomerID\n\
  LEFT JOIN Refunds\nON Orders.OrderID = Refunds.OrderID\nORDER BY Customers.LastName,\
  \ Customers.FirstName, Orders.OrderDate\n```\n\n该语句返回了此数据：\n\n![Image](img/138tab01.jpg)\n\
  \n\n\n要将此 `SELECT` 语句设置为视图，我们只需将整个 `SELECT` 语句放入 `CREATE VIEW` 语句中，如下：\n\n点击此处查看代码图片\n\
  \n```sql\nCREATE VIEW CustomersOrdersRefunds AS\n\nSELECT\nCustomers.FirstName AS\
  \ 'First Name',\nCustomers.LastName AS 'Last Name',\nOrders.OrderDate AS 'Order\
  \ Date',\nOrders.OrderAmount AS 'Order Amt',\nRefunds.RefundDate AS 'Refund Date',\n\
  Refunds.RefundAmount AS 'Refund Amt'\nFROM Customers\nLEFT JOIN Orders\nON Customers.CustomerID\
  \ = Orders.CustomerID\nLEFT JOIN Refunds\nON Orders.OrderID = Refunds.OrderID\n\
  ```\n\n上述 `CREATE VIEW` 唯一缺失的内容是原始 `SELECT` 语句中的 `ORDER BY` 子句。由于视图并不存储为物理数据，因此永远没有理由为视图包含\
  \ `ORDER BY` 子句。\n\n### 引用视图\n\n当我们执行上述 `CREATE VIEW` 语句时，它会创建一个名为 `CustomersOrdersRefunds`\
  \ 的视图。创建视图不会返回任何数据，它只是为了以后的使用定义该视图。要像以前一样使用视图来获取数据，你需要执行此 `SELECT` 语句：\n\n```sql\n\
  SELECT *\nFROM CustomersOrdersRefunds\n```\n\n这检索了：\n\n![Image](img/139tab01.jpg)\n\
  \n请注意，这些数据的行顺序与最初检索的顺序不同。这是因为视图不包含 `ORDER BY` 子句。结果是数据按照它们在数据库中物理存储的顺序返回的。可以通过在\
  \ `SELECT` 中添加 `ORDER BY` 子句轻松地修正这一点，如下：\n\n点击此处查看代码图片\n\n```sql\nSELECT *\nFROM\
  \ CustomersOrdersRefunds\nORDER BY [Last Name], [First Name], [Order Date]\n```\n\
  \n现在按预期的顺序返回数据。记住，视图中的列必须通过创建视图时指定的列别名来引用。我们不能再引用原始列名。在这个示例中，`CustomersOrdersRefunds`\
  \ 视图对 `Customers` 表中的 `LastName` 列应用了列列别名“Last Name”。因此，我们需要在 `ORDER BY` 子句中引用该列别名。正如第\
  \ 2 章 提到的，我们需要在 `ORDER BY` 子句中为这些列名中的每一个加上括号，以便对嵌入的空格进行正确解释。\n\n***\n\n### 数据库差异：MySQL\
  \ 和 Oracle\n\nMySQL 和 Oracle 在包含空格的列周围使用不同的字符。MySQL 使用反引号（`` ` ``）。Oracle 使用双引号（`\"\
  `）。\n\n***\n\n一旦创建了视图，就可以像任何其他表一样引用和利用。例如，我们可能只想从视图中查看几列，并只选择一个特定的客户。要做到这一点，我们可以发布如下\
  \ `SELECT` 语句：\n\n```sql\nSELECT\n[First Name],\n[Last Name],\n[Order Date]\nFROM\
  \ CustomersOrdersRefunds\nWHERE [Last Name] = 'Shah'\n```\n\n输出是：\n\n![Image](img/140tab01.jpg)\n\
  \n与之前一样，我们需要在每个列名周围加上方括号，因为它们包含嵌入的空格。\n\n### 视图的优势\n\n之前的示例说明了使用视图的重要优势之一。一旦创建了视图，该视图就可以像表一样被引用。即使视图引用了多个连接的表，它现在在逻辑上看起来也只是一个表。\n\
  \n让我们总结一下使用视图的优势：\n\n- **视图可以降低复杂性。**首先，视图可以简化特别复杂的 `SELECT` 语句。例如，如果你有一个连接了六张表的\
  \ `SELECT` 语句，那么创建每个包含二三张表的视图可能是很有用的。然后你可以在一个比原始语句简单的 `SELECT` 语句中引用这些视图。\n- **视图可以增加可重用性。**在三个表总是连接在一起的情况下，你可以创建一个包含这三个表的视图。这样，你就不需要每次查询数据时都必须连接这三个表，只需简单引用预定义的视图即可。\n\
  - **视图可以正确地格式化数据。**如果数据库中的列格式不正确，你可以使用 `CAST` 或函数按照所需的格式格式化该列。例如，你可能有一个日期列在数据库中被存储为整数数据类型，格式为\
  \ YYYYMMDD。将此数据作为日期/时间列查看是有益的，这样它就可以作为真正的日期进行展示和操作。为了实现这一点，你可以在表上创建一个视图，将该列转换为正确的格式。此后对表的所有引用都可以引用新视图而不是表。\n\
  - **视图可以创建计算列。**假设表中的两列包含 `Quantity` 和 `PricePerItem`。最终用户通常对总价感兴趣，总价是通过将两列相乘计算出的。你可以为原始表创建一个视图，并包含一个带有此计算公式的新计算列。用户随后可以引用视图并始终可以使用该计算结果。\n\
  - **视图可以用于重命名列名。**如果数据库包含晦涩的列名，你可以创建带有列别名的视图，将这些名称翻译成更有意义的内容。\n- **视图可以创建数据子集。**假设数据库包含一张包含你所有客户的表。你的绝大多数用户只需要查看在过去一年下过订单的客户。你可以轻松地创建此表的视图，包含这个有用的数据子集。\n\
  - **视图可以用于实施安全限制。**通常，你希望某些用户能够访问给定表中的某些列。为了实现这一点，你可以为这些用户创建该表的视图。然后可以使用数据库的安全功能授予对新视图的访问权限，同时限制他们访问底层表。\n\
  \n### 修改和删除视图\n\n创建视图后，可以使用 `ALTER VIEW` 语句轻松地修改。以下是通用语法：\n\n```sql\nALTER VIEW\
  \ ViewName AS\nSelectStatement\n```\n\n在修改视图时，你必须指定视图中包含的整个 `SELECT` 语句。原始的 `SELECT`\
  \ 被新的 `SELECT` 替换。假设我们最初用此语句创建了一个视图：\n\n```sql\nCREATE VIEW CustomersView AS\nSELECT\n\
  FirstName AS 'First Name',\nLastName as 'Last Name'\nFROM Customers\n```\n\n为了为此视图添加一个\
  \ `CustomerID` 新列，我们将发布如下的语句：\n\n```sql\nALTER VIEW CustomersView AS\nSELECT\nFirstName\
  \ AS 'First Name',\nLastName AS 'Last Name',\nCustomerID AS 'Cust ID'\nFROM Customers\n\
  ```\n\n再次，创建或修改视图都不会返回数据。它只是创建或修改视图的定义。\n\n***\n\n### 数据库差异：Oracle\n\n与 SQL Server\
  \ 和 MySQL 不同，Oracle 中的 `ALTER VIEW` 命令更具限制性。要在 Oracle 中完成之前的 `ALTER VIEW`，你需要执行\
  \ `DROP VIEW` 然后执行带有新定义的 `CREATE VIEW`。\n\n***\n\n`DROP VIEW` 语句用于删除之前创建视图。语法为：\n\
  \n```sql\nDROP VIEW ViewName\n```\n\n要删除之前创建的 `CustomersView`，我们可以发布此语句：\n\n```sql\n\
  DROP VIEW CustomersView\n```\n\n### 展望\n\n自连接和视图是两种虚拟化查看数据的方法。自连接允许分析师将表与其自身连接。自连接对于自引用数据非常有用，即表中的一列可以与同一表中的另一列连接。\n\
  \n数据库视图灵活得多。本质上，任何 `SELECT` 语句都可以保存为视图，然后可以像物理表一样被引用。视图本身不包含任何数据。它们仅仅定义了现有数据的新虚拟视图。因此，视图服务了多种功能，从降低复杂性到格式化数据。\n\
  \n\n\n\n在下一章“[子查询]”中，我们将回到与之前讨论的如何连接表更直接相关的主题。子查询提供了一种关联表与表的方法，而无需显式地使用内连接或外连接。由于子查询的结构和使用方式非常多样，这可能是本书中最困难的主题了。然而，理解子查询将带来巨大的丰报。实际上，子查询的使用非常有灵活性。因此，这为你的查询设计提供了一定的创意空间。\n\
  \n## 14. 子查询\n\n### 介绍的关键字\n`EXISTS` • `WITH`\n\n在`第 4 章`中，我们讨论了复合函数：包含其他函数的函数。同样，SQL\
  \ 查询也可以包含其他查询。嵌套在另一个查询内部的查询被称为`子查询`。\n\n子查询的主题相当复杂，主要是因为有许多不同的使用方式。子查询可以出现在 `SELECT`\
  \ 语句的许多部分，每个部分都有不同的细微差别和要求。作为嵌套在另一个查询中的查询，子查询可以与主查询相关并依赖于主查询，也可以完全独立于主查询。同样，这种区别导致了它们在使用上的不同要求。\n\
  \n无论如何使用子查询，它们都为你编写 SQL 查询的方式增加了极大的灵活性。通常情况下，子查询提供了可以通过其他手段实现的功能。在这种情况下，当你决定是否利用子查询解决方案时，个人偏好将会发挥作用。然而，正如你将看到的，在某些情况下，子查询对于当前任务是绝对必不可少的。\n\
  \n话虽如此，让我们从子查询基本类型的概述开始讨论。\n\n### 子查询的类型\n\n子查询不仅可以用于 `SELECT` 语句，还可以用于 `INSERT`、`UPDATE`\
  \ 和 `DELETE` 语句，这些内容将在`第 17 章`中的“修改数据”中涵盖。然而，在本章中，我们将子查询的讨论限制在 `SELECT` 语句上。\n\n\
  以下是我们之前看到的通用 `SELECT` 语句：\n\n```sql\nSELECT columnlist\nFROM tablelist\nWHERE condition\n\
  GROUP BY columnlist\nHAVING condition\nORDER BY columnlist\n```\n\n子查询可以插入到 `SELECT`\
  \ 语句的几乎任何子句中。然而，子查询的陈述和使用方式略有不同，取决于它是被用于 `columnlist`、`tablelist` 还是 `condition`。\n\
  \n但子查询到底是什么？子查询仅仅是插入到另一个 SQL 语句内部的 `SELECT` 语句。从子查询返回的结果在整个 SQL 查询的上下文中使用。此外，一个\
  \ SQL 语句中可以有多个子查询。总之，子查询可以通过三种主要方式指定：\n\n*   当子查询是 `tablelist` 的部分时，它指定了一个数据源。这适用于子查询作为\
  \ `FROM` 子句一部分的情况。\n*   当子查询是 `condition` 的部分时，它成为选择标准的一部分。这适用于子查询作为 `WHERE` 或 `HAVING`\
  \ 子句一部分的情况。\n*   当子查询是 `columnlist` 的部分时，它创建了一个单一的计算列。这适用于子查询作为 `SELECT`、`GROUP\
  \ BY` 或 `ORDER BY` 子句一部分的情况。\n\n本章的剩余部分将详细解释这三种场景。\n\n### 将子查询作为数据源\n\n当子查询被指定为\
  \ `FROM` 子句的一部分时，它会立即创建一个新的数据源。这类似于创建一个视图并在 `SELECT` 中引用该视图的概念。唯一的区别是视图是永久保存在数据库中的，而作为数据源使用的子查询不会被保存。它只临时存在，作为\
  \ `SELECT` 语句的一部分。尽管如此，你完全可以将 `FROM` 子句中的子查询视为一种虚拟视图。\n\n让我们先考虑一个说明如何将子查询用数据源的示例。假设我们有如下的\
  \ `Users` 表：\n\n![Image](img/144tab01.jpg)\n\n我们还有这个 `Transactions` 表：\n\n![Image](img/145tab01.jpg)\n\
  \n这些数据实际上与我们在之前的章节中看到的 `Customers` 和 `Orders` 表非常相似。`Users` 表类似于 `Customers` 表，除了我们将名和姓合并到了单列中。`Transactions`\
  \ 表具有与订单类似的条目，但我们添加了一个 `TransactionType` 列，用指示交易是现金还是信用卡。我们还省略了通常会存在的日期列。\n\n我们想要看到用户列表，以及他们所进行的现金交易的总和。接下来的\
  \ `SELECT` 语句完成了该任务：\n\n点击此处查看代码图像\n\n```sql\nSELECT\n  UserName AS 'User Name',\n\
  \  ISNULL(CashTransactions.TotalCash, 0) AS 'Total Cash'\nFROM Users\nLEFT JOIN\n\
  \  (SELECT\n    UserID,\n    SUM(TransactionAmount) AS 'TotalCash'\n  FROM Transactions\n\
  \  WHERE TransactionType = 'Cash'\n  GROUP BY UserID) AS CashTransactions\nON Users.UserID\
  \ = CashTransactions.UserID\nORDER BY Users.UserID\n```\n\n\n\n\n我们不再看到 Rakesh Gupta\
  \ 或 April Waters 的行了，因为针对现金订单的 `WHERE` 子句排除现在位于主查询中，而不是子查询中。结果是，我们看不到那些没有下过现金订单的人的数据。\n\
  \n### 在选择标准中使用子查询\n\n在第 7 章中，我们引入了 `IN` 运算符的第一种格式。我们使用的示例是：\n\n```\nWHERE State\
  \ IN ('IL', 'NY')\n```\n\n在这种格式下，`IN` 运算符仅在括号内列出若干值。`IN` 还有第二种格式，在括号内插入了整个 `SELECT`\
  \ 语句。例如，可以这样指定一个州列表：\n\n```sql\nWHERE State IN\n(SELECT\nStates\nFROM StateTable\n\
  WHERE Region = 'Midwest')\n```\n\n这种格式不是列出单个州，而是允许我们通过更复杂的逻辑生成动态的州列表。\n\n让我们通过使用\
  \ `Users` 和 `Transactions` 表的示例来说明。在这种场景下，我们想要检索一个曾经对任何交易支付过现金的用户列表。实现此目的的 `SELECT`\
  \ 语句如下：\n\n点击此处查看代码图像\n\n```sql\nSELECT UserName AS 'User Name'\nFROM Users\nWHERE\
  \ UserID IN\n(SELECT UserID\nFROM Transactions\nWHERE TransactionType = 'Cash')\n\
  ```\n\n结果数据是：\n\n![Image](img/147tab02.jpg)\n\nRakesh Gupta 没有包含在列表中，尽管他有交易，但其中没有任何一笔是现金交易。注意子查询\
  \ `SELECT` 被完全放置在 `IN` 关键字的括号内。子查询的 `columnlist`（列列表）中只有 `UserID` 这一列。这是一项要求，因为我们希望子查询仅产生单列的等效值列表。此外请注意，`UserID`\
  \ 列用于连接两个查询。虽然我们显示的是 `UserName`，但我们使用的是 `UserID` 来定义 `Users` 表和 `Transactions` 表之间的关系。\n\
  \n再次，我们可以询问是否有必要使用子查询，这一次的答案是否定的。这里有一个返回相同数据的等效查询。\n\n点击此处查看代码图像\n\n```sql\nSELECT\
  \ UserName AS 'User Name'\nFROM Users\nINNER JOIN Transactions\nON Users.UserID\
  \ = Transactions.UserID\nWHERE TransactionType = 'Cash'\nGROUP BY Users.UserName\n\
  ```\n\n在不使用子查询的情况下，我们可以直接连接 `Users` 表和 `Transactions` 表。然而，现在需要 `GROUP BY` 子句来确保我们每个用户只返回一行。\n\
  \n### 相关子查询\n\n到目前为止我们看到的子查询都是非相关子查询。通常来说，所有子查询都可以分类为`uncorrelated`（非相关）或`correlated`（相关）。这些术语描述了子查询与其包含的查询（外部查询）之间是否存在关联。非相关子查询是无关的。当子查询与之无关时，意味着它完全独立于外部查询。非相关子查询仅作为整个\
  \ `SELECT` 语句的一部分被评估和执行一次。此外，非相关子查询可以独立存在。如果你愿意，可以将非相关子查询作为一个单独查询来执行。\n\n与此相反，相关子查询与外部查询特定相关。由于这种显式关系，相关子查询必须针对返回的每一行进行评估，并且在每次执行子查询时可能产生不同的结果。相关子查询不能独立执行，因为查询中的某些元素使其依赖于外部查询。\n\
  \n最好的解释方法是使用一个示例。回到 `Users` 和 `Transactions` 表，假设我们想要生成一个总交易金额小于 20 美元的用户列表。以下是实现该请求的语句：\n\
  \n点击此处查看代码图像\n\n```sql\nSELECT\nUserName AS 'User Name'\nFROM Users\nWHERE\n(SELECT\n\
  SUM(TransactionAmount)\nFROM Transactions\nWHERE Users.UserID = Transactions.UserID)\n\
  < 20\n```\n\n结果是：\n\n![Image](img/149tab01.jpg)\n\n什么使得这个子查询是相关的而非非相关的？通过查看子查询本身可以看到答案：\n\
  \n点击此处查看代码图像\n\n```sql\nSELECT\nSUM(TransactionAmount)\nFROM Transactions\nWHERE\
  \ Users.UserID = Transactions.UserID\n```\n\n这个子查询之所以是相关的，因为它不能独立执行。如果单独运行，该子查询将产生错误，因为\
  \ `WHERE` 子句中的 `Users.UserID` 列在子查询的上下文中并不存在。为了理解发生了什么，从更通的角度来看整个 `SELECT` 语句会有帮助：\n\
  \n```sql\nSELECT\nUserName AS 'User Name'\nFROM Users\nWHERE\nSubqueryResult < 20\n\
  ```\n\n子查询返回一个带有单值的 `columnlist`，我们称其为 `SubqueryResult`。作为一个相关子查询，该子查询必须对每个用户进行评估。此外请注意，这种类型的子查询要求它只返回一行和一个单值。如果涉及多行或多个值，则\
  \ `SubqueryResult` 将无法被评估。\n\n和之前一样，你可能会询问是否有必要子查询，答案再次是否定的。这里有一个产生相同结果的等效语句：\n\n\
  点击此处查看代码图像\n\n```sql\nSELECT\nUserName AS 'User Name'\nFROM Users\nLEFT JOIN Transactions\n\
  ON Users.UserID = Transactions.UserID\nGROUP BY Users.UserID, Users.UserName\nHAVING\
  \ SUM(TransactionAmount) < 20\n```\n\n但请注意，在不使用子查询的情况下，等效语句现在需要 `GROUP BY` 和 `HAVING`\
  \ 子句。`GROUP BY` 子句创建了用户组，而 `HAVING` 子句强制每个组必须小于 20 美元。\n\n### EXISTS 运算符\n\n与相关子查询相关的另一种技术使用了一个特殊运算符\
  \ `EXISTS`。该运算符允许你确定相关子查询中的数据是否存在。假设我们想要发现哪些用户进行过交易。这可以通过在该语句中使用 `EXISTS` 运算符来实现：\n\
  \n点击此处查看代码图像\n\n```sql\nSELECT UserName AS 'User Name'\nFROM Users\nWHERE EXISTS\n\
  (SELECT *\nFROM Transactions\nWHERE Users.UserID = Transactions.UserID)\n```\n\n\
  该语句返回：\n\n![Image](img/150tab01.jpg)\n\n这是一个相关子查询，因为它在没有引用主查询的情况下无法执行。语句中的 `EXISTS`\
  \ 关键字在子查询返回任何数据时被评估为真。注意子查询选择了所有列（`SELECT *`）。因为在子查询中选择哪些列并不重要，我们使用星号返回所有列。我们只感兴趣子查询中是否存在数据。结果是查询返回了除\
  \ April Waters 之外的所有用户。她没有出现是因为她没有进行过交易。\n\n和之前一样，此语句中的逻辑可以用其他方式表达。这里有一个使用 `IN`\
  \ 运算符配合子查询获取相同的语句：\n\n```sql\nSELECT UserName AS 'User Name'\nFROM Users\nWHERE\
  \ UserID IN\n(SELECT UserID\nFROM Transactions)\n```\n\n这个语句可能更容易理解。\n\n这里是另一个不使用子查询即可检索相同数据的语句：\n\
  \n点击此处查看代码图像\n\n```sql\nSELECT UserName AS 'User Name'\nFROM Users\nINNER JOIN Transactions\n\
  ON Users.UserID = Transactions.UserID\nGROUP BY UserName\n```\n\n在该语句中，`INNER JOIN`\
  \ 强制要求用户也必须存在于 `Transactions` 表中。此外请注意，此查询需要使用 `GROUP BY` 子句以避免每个用户返回多行。\n\n###\
  \ 使用子查询作为计算列\n\n\n\n子查询的最后一个通用用途是作为计算列。假设我们想要查看用户列表，以及他们下过的交易数量。可以使用以下语句在不使用子查询的情况下完成\n\
  \n点击此处查看代码图像\n\n```sql\nSELECT\nUserName AS 'User Name',\nCOUNT(TransactionID) AS\
  \ 'Number of Transactions'\nFROM Users\nLEFT JOIN Transactions\nON Users.UserID\
  \ = Transactions.UserID\nGROUP BY Users.UserID, Users.UserName\nORDER BY Users.UserID\n\
  ```\n\n输出结果：\n\n![Image](img/151tab01.jpg)\n\n注意，我们使用了 `LEFT JOIN` 来兼容可能没有进行过任何交易的用户。`GROUP\
  \ BY` 强制执行了每个用户只保留一行的结果。`COUNT` 函数产生了 `Transactions` 表中行数的计数。\n\n另一种获得相同结果的方法是使用子查询作为计算列。它看起来如下：\n\
  \n点击此处查看代码图像\n\n```sql\nSELECT\nUserName AS 'User Name',\n(SELECT\nCOUNT(TransactionID)\n\
  FROM Transactions\nWHERE Users.UserID = Transactions.UserID)\nAS 'Number of Transactions'\n\
  FROM Users\nORDER BY Users.UserID\n```\n\n在这个示例中，子查询是一个相关子查询。该查询无法独立执行，因为它在 `WHERE`\
  \ 子句中引用了 `Users` 表中的一列。此子查询为 `SELECT` *columnlist* 返回一个计算列。换句话说，在子查询求值后，它返回一个单一值，然后该值被包含在\
  \ *columnlist* 中。以下是上述语句的通用格式：\n\n点击此处查看代码图像\n\n```sql\nSELECT\nUserName AS 'User\
  \ Name',\nSubqueryResult AS 'Number of Transactions'\nFROM Users\nORDER BY Users.UserID\n\
  ```\n\n如所示，整个子查询返回一个单一值，用于 `Number of Transactions` 列。\n\n### 公用表表达式 (Common Table\
  \ Expressions)\n\n另一种子查询语法允许在执行主查询之前显式地定义它。这被称为*公用表表达式*。在这种语法中，整个子查询从其正常位置移除，并位于查询的顶部。使用\
  \ `WITH` 关键字来指示公用表表达式的存在。虽然它们可以与相关子查询一起使用，但公用表表达式对于不相关子查询要有用得多。为了说明，让我们回到本章介绍第一个子查询：\n\
  \n点击此处查看代码图像\n\n```sql\nSELECT\nUserName AS 'User Name',\nISNULL(CashTransactions.TotalCash,\
  \ 0) AS 'Total Cash'\nFROM Users\nLEFT JOIN\n(SELECT\nUserID,\nSUM(TransactionAmount)\
  \ AS 'TotalCash'\nFROM Transactions\nWHERE TransactionType = 'Cash'\nGROUP BY UserID)\
  \ AS CashTransactions\nON Users.UserID = CashTransactions.UserID\nORDER BY Users.UserID\n\
  ```\n\n如所示，上述语句中的子查询被赋予了别名 `CashTransactions`，并在 `UserID` 列上与 `Users` 表连接。子查询的目的是为每个用户提供现金交易的总额。该查询的输出为：\n\
  \n![Image](img/152tab01.jpg)\n\n现在我们将展示使用公用表表达式表达相同逻辑的另一种方法。查询看起来如下：\n\n点击此处查看代码图像\n\
  \n```sql\nWITH CashTransactions AS\n(SELECT\nUserID,\nSUM(TransactionAmount) as\
  \ TotalCash\nFROM Transactions\nWHERE TransactionType = 'Cash'\nGROUP BY UserID)\n\
  SELECT\nUserName AS 'User Name',\nISNULL(CashTransactions.TotalCash, 0) AS 'Total\
  \ Cash'\nFROM Users\nLEFT JOIN CashTransactions\nON Users.UserID = CashTransactions.UserID\n\
  ORDER BY Users.UserID\n```\n\n在另一种替代表达式中，整个子查询已移动到顶部，位于主 `SELECT` 查询之前。`WITH` 关键字指示后面有一个公用表表达式。第一行表示\
  \ `CashTransactions` 是公用表表达式的别名。公用表表达式紧随 `AS` 关键字并包含在括号内。\n\n我们插入了一个空行来将公用表表达式与主查询分开。主查询中的下一行：\n\
  \n`LEFT JOIN CashTransactions`\n\n启动了到公用表表达式的外连接，通过 `CashTransactions` 别名对其进行引用。公用表表达式最大的优点是它的简单性。主查询变得更容易理解了，因为子查询的细节现在作为主查询之前的独立实体出现。使用公用表表达式的查询输出与使用子查询的原始查询完全相同。\n\
  \n简而言之，这取决于个人的喜好，即你是否喜欢在查询中使用公用表表达式。子查询是嵌入在较大的查询中的，而公用表表达式则是预先声明子查询。\n\n### 数据库差异：MySQL\n\
  \n与 SQL Server 和 Oracle 不同，MySQL 不支持公用表表达式。\n\n### 展望\n\n在本章中，我们看到了子查询的三种不同用法：作为数据源、选择标准中以及作为计算列。此外，我们还看到了相关子查询和不相关子查询的示例。最后，我们简要演示了使用公用表表达式表达子查询的替代方法。因此，我们实际上只触及了子查询的一些用途。使问题变得复杂的是，子查询可以用其他方式表达。\n\
  \n## 15. 集合逻辑 (Set Logic)\n\n引入的关键字\n\n- `UNION`\n- `UNION ALL`\n- `INTERSECT`\n\
  - `EXCEPT`\n\n与 SQL Server 和 Oracle 不同，MySQL 不支持公用表表达式。\n\n之前章节中的各种连接和子查询处理了从多个表组合数据的不同方式。然而，结果始终是一个单一的\
  \ SELECT 语句。现在，我们将在多个表中组合数据的概念扩展到组合多个查询可能上。换句话说，我们将查看一种编写包含多个数据检索查询的单个 SQL 语句的方法。与子查询一样，集合逻辑技术为你的\
  \ SQL 语句提供了额外的灵活性和逻辑可能性。\n\n### 使用 `UNION` 运算符\n\nSQL 中的 `UNION` 运算符用于处理从集合 A 或集合\
  \ B 中选择数据的逻辑。这是到目前为止最常见的情况。我们从一个示例开始。假设我们的数据库中有两个表。第一个是 `Orders` 表，包含客户下达订单的数据。\n\
  \n\n\n\n第二个表名为 `Returns`（退货），包含了客户退货商品的数据。它可能像这样：\n\n![Image](img/156tab02.jpg)\n\
  \n请注意，与第 12 章和第 13 章中的`Refunds`表不同，这个`Returns`表与`Orders`表没有直接关联。换句话说，退货没有绑定特定的订单。在这种情况下，客户可能会一次退款交易中退回多个订单的商品。\n\
  \n我们想创建一个某个特定客户的所有订单和退货的报告。我们希望结果按照订单日期（如果是订单）或退货日期（如果是退货）排序。以下是一个可以实现此目的的语句。我们在语句中插入了几行额外的空行，以强调它包含两个完全独立的\
  \ `SELECT` 语句，通过 `UNION` 运算符组合：\n\n```sql\nSELECT\nOrderDate AS 'Date',\n'Order'\
  \ AS 'Type',\nOrderAmount AS 'Amount'\nFROM Orders\nWHERE CustomerID = 2\nUNION\n\
  SELECT\nReturnDate as 'Date',\n'Return' AS 'Type',\nReturnAmount AS 'Amount'\nFROM\
  \ Returns\nWHERE CustomerID = 2\nORDER BY Date\n```\n\n结果的数据是：\n\n![Image](img/157tab01.jpg)\n\
  \n如你所示，`UNION`运算符分隔了两个 `SELECT` 语句。这些 `SELECT` 语句中的每一个都可以单独运行。最后还有一个 `ORDER BY`\
  \ 子句，它适用于两个 `SELECT` 语句的结果。前一个语句的通用格式为：\n\n```\nSelectStatementOne\nUNION\nSelectStatementTwo\n\
  ORDER BY columnlist\n```\n\n为了使 `UNION` 起作用，必须遵循以下三个规则：\n\n- 所有与 `UNION` 组合的 `SELECT`\
  \ 语句在 `SELECT *columnlist` 中必须具有相同数量的列。\n- 每个 `SELECT *columnlist` 中的所有列的顺序必须相同。\n\
  - 每个 `SELECT` columnlist 中的所有对应列必须具有相同或兼容的数据类型。\n\n参考这些规则，请注意查询中的两个 `SELECT` 语句都有三列。这三列中的数据顺序相同，数据类型也相同。\n\
  \n在使用 `UNION` 时，你应该使用列别名为所有对应列提供相同的列名。在我们的示例中，第一个 `SELECT` 的第一列原始名为 `OrderDate`。第二个\
  \ `SELECT` 的第一列原始名为 `ReturnDate`。为了确保最终结果的第一列具有所需的名称，`OrderDate` 和 `ReturnDate`\
  \ 都被赋予了列别名 `Date`。这也允许在 `ORDER BY` `columnlist` 中引用该列。\n\n此外注意每个 `SELECT` 的第二列都使用了字面量。我们创建了一个名为\
  \ `Type` 的计算列，其值为 `Order` 或 `Return`。这允许我们确定每一行来自哪张表。\n\n最后，请注意 `ORDER BY` 子句适用于两个查询合并后的最终结果。这应该是这样的，因为对单个查询进行排序没有意义。\n\
  \n到此时，退一步考虑一下为什么有使用 `UNION` 运算符而不是简单地在单个 `SELECT` 语句中将 `Orders` 和 `Returns` 表连接起来是有用的。由于两张表都有\
  \ `CustomerID` 列，为什么我们不根据这一列将两个表连接起来呢？这种方法的问题在于，这两个表之间实际上只是间接关联的。客户可以下单，客户也可以发起退货，但订单和退货之间没有直接连接。\n\
  \n此外，即使两个表之间有直接连接，连接（join）也无法实现目标。通过适当连接，可以将相关信息放在同一行。但在情况下，我们感兴趣的是分开显示订单和退货。必须使用\
  \ `UNION` 运算符以此方式显示数据。\n\n本质上，`UNION`允许我们在单个语句中检索不相关或部分相关的数据。\n\n### 去重与非去重并\n\n\
  实际上，`UNION` 运算符有两种变体：`UNION` 和 `UNION ALL`。两者之间只有细微的区别。`UNION` 运算符消除所有重复行。`UNION\
  \ ALL` 运算符指定将包含所有行，即使它们是重复的。\n\n`UNION` 运算符消除重复的方式与之前看到的 `DISTINCT` 关键字类似。`DISTINCT`\
  \ 应用于单个 `SELECT`，而 `UNION` 消除的是通过 `UNION` 组合的所有 `SELECT` 语句中的重复项。\n\n在之前关于 `Orders`\
  \ 和 `Returns` 表的示例中，不存在重复的可能性，因此使用哪种 `UNION` 变体并不重要。这里有一个说明区别的例子。假设我们只对发布任何订单或退货的日期感兴趣。我们不想为同一个日期看到多行数据。以下语句完成了此任务。\n\
  \n```sql\nSELECT\nOrderDate AS 'Date'\nFROM Orders\nUNION\nSELECT\nReturnDate as\
  \ 'Date'\nFROM Returns\nORDER BY Date\n```\n\n结果的数据是：\n\n![Image](img/158tab01.jpg)\n\
  \n注意，日期为 `2016-09-15` 的只有一行。尽管 `Orders` 表中有一个 `2016-09-15`，`Returns` 表中也有一个 `2016-09-15`，但\
  \ `UNION` 运算符确保了 `2016-09-15` 只出现一次。\n\n如果由于某种原因，我们希望看到两次 `2016-09-15`，我们可以使用 `UNION\
  \ ALL` 运算符来实现：\n\n```sql\nSELECT\nOrderDate AS 'Date'\nFROM Orders\nUNION ALL\n\
  SELECT\nReturnDate as 'Date'\nFROM Returns\n```\n\n输出是：\n\n![Image](img/159tab01.jpg)\n\
  \n`UNION ALL` 允许显示重复行。\n\n### 交查询查询`UNION` 和 `UNION ALL` 运算符返回指定集合中的任何数据。这就像使用 OR\
  \ 运算符组合两个逻辑集。\n\nSQL 提供了一个名为 `INTERSECT` 的运算符，它只提取两个集合共有的数据。`INTERSECT` 类似于 `AND`\
  \ 运算符，处理章节开头提到的第二种场景：\n\n- 同时位于集合 A 和 B 中的数据\n\n### 数据库差异：MySQL\n\nMySQL 不 `INTERSECT`\
  \ 运算符。\n\n使用相同的 `Orders` 和 `Returns` 表，假设我们想看到既有订单又有退货的日期。实现此目的语句是：\n\n```sql\n\
  SELECT\nOrderDate AS 'Date'\nFROM Orders\nINTERSECT\nSELECT\nReturnDate as 'Date'\n\
  FROM Returns\nORDER BY Date\n```\n\n结果是：\n\n![Image](img/160tab01.jpg)\n\n只显示一行，因为这是\
  \ `Orders` 和 `Returns` 表中共同日期。\n\n`INTERSECT` 运算符还有一个变体，是由 `EXCEPT` 运算符提供的。`INTERSECT`\
  \ 返回两个集合中的数据，而 `EXCEPT` 返回在一个集合中但在另一个集合中的数据。相应地，这处理了章节开头提到的第三和第四种场景：\n\n- 位于集合 A\
  \ 但不在集合 B 中的数据\n- 位于集合 B 但不在集合 A 中的数据\n\n`EXCEPT` 的通用格式为：\n\n```\nSelectStatementOne\n\
  EXCEPT\nSelectStatementTwo\nORDER BY columnlist\n```\n\n该语句将显示位于 `SelectStatementOne`\
  \ 但不在 `SelectStatementTwo` 中的数据。这是一个示例：\n\n```sql\nSELECT\nOrderDate AS 'Date'\n\
  FROM Orders\nEXCEPT\nSELECT\nReturnDate as 'Date'\nFROM Returns\nORDER BY Date\n\
  ```\n\n结果是：\n\n![Image](img/161tab01.jpg)\n\n这些数据显示了发布订单但在同一日期没有退货的日期。注意 `2016-09-15`\
  \ 没有出现，因为在该日期发生了退货。\n\n### 数据库差异：MySQL 和 Oracle\n\nMySQL 不支持 `EXCEPT` 运算符。\n\nOracle\
  \ 中 `EXCEPT` 运算符的等效物是 `MINUS`。\n\n\n\n[content]\n本章阐述了使用集合逻辑将多个 SELECT 语句组合为单个语句的各种方法。常用的运算符是\
  \ `UNION`，它允许你合并两个不同集合中的任一数据。因此，`UNION` 类似于 `OR` 运算符。`UNION ALL` 是 `UNION` 的变体，允许显示重复行。同样，`INTERCEPT`\
  \ 运算符在数据同时存在于正在合并的两个数据集时允许显示该数据。`INTERCEPT` 类似于 `AND` 运算符。最后，`EXCEPT` 运算符允许选择存在于一个集合但不在另一个集合中的数据。\n\
  \n我们的下一章“存储过程与参数”将展示你如何在存储过程中保存多个 SQL 语句，并在这些过程中利用参数来为 SQL 命令增加某种程度的通用性。我们还将讨论创建自己的自定义函数的可能，并解释函数与存储过程之间的区别。与第\
  \ 13 章中讨论的视图类似，“自连接与视图”一样，存储过程和自定义函数是很有用的对象，你可以将其创建并存储在数据库中，以提供额外的润色和功能。\n\n## 16.\
  \ 存储过程与参数\n\n### 引入的关键字\n\n`CREATE PROCEDURE` • `BEGIN` • `EXEC/CALL` • `ALTER PROCEDURE`\
  \ • `DROP PROCEDURE`\n\n在此之前，我们所有的数据检索都是通过单个 SQL 语句完成的。即使是上一章看到的集合逻辑也涉及将多个 SELECT\
  \ 组合成单个语句。现在我们将讨论一个新的场景，在该场景中，多个语句可以保存到一个名为`存储过程`（stored procedure）的单个对象中。\n\n广泛来说，使用存储过程有两个主要原因：\n\
  \n-   在单个过程中保存多个 SQL 语句\n-   与 SQL 语句结合使用参数\n\n事实上，存储过程可以只包含单个 SQL 语句且不包含任何参数。但当存储过程包含多个语句或参数时，它的真实价值就会显现出来。\n\
  \n存储过程的主题相当复杂。在对主题的简要回顾中，我们将重点关注第二个原因的概述，即使用参数。这直接关系到如何从数据库中检索检索数据。正如我们所看到的，在 SELECT\
  \ 语句中添加参数的能力在日常使用中是一个非常实用的特性。\n\n使用存储过程包含多个语句超出了本书的讨论范围。基本上，在过程中存储多个语句的能力意味着你可以创建复杂的逻辑并在单个事务中一次性执行所有逻辑。例如，你可能有一个业务需求，接收客户的进来订单，并在其进入系统之前对其进行快速评估。该过程可能涉及检查商品是否有货、验证客户是否有良好的信用记录，以及获取商品何时可以发货的初步估计。这种情况需要多个\
  \ SQL 语句，并带有一些额外的逻辑，以确定如果订单出现任何问题应返回什么种的消息。所有这些逻辑都可以放在一个单一存储过程中。这增强了整个系统的模块化。由于所有内容都在一个存储过程中，该逻辑可以从任何调用程序中执行并返回相同的结果。\n\
  \n### 创建存储过程\n\n在深入介绍如何使用存储过程的细节之前，让我们先涵盖它们如何创建和维护的机制。语法在不同的数据库之间差异很大。对于 Microsoft\
  \ SQL Server，创建存储过程的通用格式如下：\n\n点击此处查看代码图像\n\n```sql\nCREATE PROCEDURE ProcedureName\n\
  AS\nOptionalParameterDeclarations\nBEGIN\nSQLStatements\nEND\n```\n\n`CREATE PROCEDURE`\
  \ 关键字允许你发布单个命令来创建该过程。过程本身可以包含任意数量的 SQL 语句，还可以包含参数声明。我们将将讨论参数声明语法。SQL 语句列在 `BEGIN`\
  \ 和 `END` 关键字之间。\n\n### 数据库差异：MySQL 和 Oracle\n\n在 MySQL 中创建存储过程的通用格式稍微复杂一些。MySQL\
  \ 的格式为：\n\n点击此处查看代码图像\n\n```sql\nDELIMITER $$\n\nCREATE PROCEDURE ProcedureName\
  \ ()\nBEGIN\nSQLStatements\nEND$$\n\nDELIMITER ;\n```\n\nMySQL 在执行多个语句时需要分隔符。普通分隔符是分号。上述代码的第一行临时将标准分隔符从分号改为两个美元符号。任何需要的参数都指定在\
  \ `CREATE PROCEDURE` 行的括号之间。然后，`BEGIN` 和 `END` 关键字之间列出的每个 SQL 语句最后必须有一个分号。美元符号写在\
  \ `END` 关键字之后，表示 `CREATE PROCEDURE` 命令已完成。最后，在末尾放置另一个 `DELIMITER` 语句将分隔符改回分号。\n\n\
  在 Oracle 中创建存储过程的过程要复杂得多，并且超出了本书的讨论范围。要在 Oracle 中为 SELECT 语句创建存储过程，你必须先创建一个名为包（package）的对象。包将包含两个基本组件：规范（specification）和体（body）。规范部分指定了如何与体部分通信。体部分包含\
  \ SQL 语句，这些语句是存储过程的核心。更多细节请参阅 Oracle 的在线文档。\n\n这是一个可以用于执行此单个 SELECT 语句的存储过程创建示例：\n\
  \n```sql\nSELECT *\nFROM Customers\n```\n\n该过程将命名为 `ProcedureOne`。在 Microsoft SQL\
  \ Server 中，创建该过程的语句为：\n\n```sql\nCREATE PROCEDURE ProcedureOne\nAS\nBEGIN\nSELECT\
  \ *\nFROM Customers\nEND\n```\n\n### 数据库差异：MySQL\n\n在 MySQL 中，之前的示例看起来如下：\n\n点击此处查看代码图像\n\
  \n```sql\nDELIMITER $$\n\nCREATE PROCEDURE ProcedureName ()\nBEGIN\nSELECT *\nFROM\
  \ Customers;\nEND$$\n\nDELIMITER ;\n```\n\n记住，创建存储过程不会执行任何操作。它只是创建了过程以便以后后执行。与表和视图一样，该过程将在数据库管理工具中可见，你可以查看其内容。\n\
  \n### 存储过程中的参数\n\n到目前为止看到的所有 SELECT 语句都有某种静态特性，因为它们是为了按特定方式检索数据而编写的。在 SELECT 语句中添加参数的能力提供了更大的灵活性。\n\
  \nSQL 语句中的参数（parameter）术语与其他计算机语言中使用的变量（variable）术语相似。参数基本上是调用程序传递给 SQL 语句的值。它可以是调用时用户指定的任何值。\n\
  \n从一个简单的示例开始，假设我们有一个从 Customers 表中检索数据的 SELECT 语句。与其选择所有客户，我们希望 SELECT 只检索一个特定 CustomerID\
  \ 的数据。然而，我们不想将数字直接硬编码在 SELECT 语句中。我们希望 SELECT 足够通用，能够接受任何提供的 CustomerID 数字并使用该值执行。不带任何参数的\
  \ SELECT 语句简单如下：\n\n```sql\nSELECT *\nFROM Customers\n```\n\n我们的目标是添加一个 WHERE 子句，以便选择特定客户的数据。在通用形式下，我们希望\
  \ SELECT 语句为：\n\n点击此处查看代码图像\n\n```sql\nSELECT *\nFROM Customers\n```\n\n[/content]\n\
  \n\n\n\n`WHERE CustomerID = ParameterValue`\n\n在 Microsoft SQL Server 中，可以通过以下方式创建此类存储过程：\n\
  \n点击此处查看代码图片\n\n```sql\nCREATE PROCEDURE CustomerProcedure\n(@CustID INT)\nAS\n\
  BEGIN\nSELECT *\nFROM Customers\nWHERE CustomerID = @CustID\nEND\n```\n\n注意添加的第二行，它指定了存储过程中的\
  \ `CustID` 参数。在 Microsoft SQL Server 中，使用 `@` 符号表示参数。`INT` 关键字放在参数之后，表示该参数将具有一个整数值。`WHERE`\
  \ 子句中使用了相同的参数名。\n\n***\n\n### 数据库差异：MySQL\n\n在 MySQL 中，创建等效存储过程的命令是：\n\n点击此处查看代码图片\n\
  \n```sql\nDELIMITER $$\n\nCREATE PROCEDURE CustomerProcedure\n(CustID INT)\nBEGIN\n\
  \nSELECT *\nFROM Customers\nWHERE CustomerID = CustID;\nEND$$\n\nDELIMITER ;\n```\n\
  \n注意 MySQL 不需要使用 `@` 符号来表示参数。\n\n***\n\n当执行存储过程时，调用程序会传递一个参数值，SQL 语句的执行就像该值是语句的一部分一样。\n\
  \n另请注意，之前讨论的参数是输入参数。因此，它们包含了传递到存储过程的值。存储过程还可以包含输出参数，输出参数可以包含传回调用程序的值。关于如何在存储过程中指定输入参数和输出参数的各种细微差别超出了本书的范围。\n\
  \n### 执行存储过程\n\n存储过程创建后，如何执行它们？语法在不同数据库之间有所。Microsoft SQL Server 提供 `EXEC` 关键字来运行存储过程。\n\
  \n在 Microsoft SQL Server 中，以下语句将执行 `ProcedureOne` 存储过程：\n\n```sql\nEXEC ProcedureOne\n\
  ```\n\n执行此语句时，它将返回存储过程中包含的 `SELECT` 语句的结果。\n\n`ProcedureOne` 没有任何参数，因此语法非常简单。为了说明运行带输入参数的存储过程，以下代码为\
  \ `CustID` 值为 2 执行 `CustomerProcedure` 存储过程：\n\n```sql\nEXEC CustomerProcedure\n\
  @CustID = 2\n```\n\n***\n\n### 数据库差异：MySQL\n\nMySQL 使用 `CALL` 关键字而不是 `EXEC` 来执行存储过程，且带参数的存储过程语法略有不同。MySQL\
  \ 中与上述两个 `EXEC` 语句等效的语句是：\n\n```sql\nCALL ProcedureOne:\nCALL CustomerProcedure\
  \ (2);\n```\n\n***\n\n### 修改和删除存储过程\n\n一旦创建存储过程，就可以对其进行修改。就像使用 `ALTER` 关键字修改视图一样，`ALTER\
  \ PROCEDURE` 关键字被用于修改存储过程。其语法与 `CREATE PROCEDURE` 命令相同，只是用 `ALTER` 替换了 `CREATE`。由于\
  \ `CREATE PROCEDURE` 在每个数据库中的语法略有不同，`ALTER PROCEDURE` 也是如此。\n\n我们已经看到过使用 Microsoft\
  \ SQL Server 创建存储过程的这个示例：\n\n点击此处查看代码图片\n\n```sql\nCREATE PROCEDURE CustomerProcedure\n\
  (@CustID INT)\nAS\nBEGIN\nSELECT *\nFROM Customers\nWHERE CustomerID = @CustID\n\
  END\n```\n\n在创建此过程后，如果你想修改该过程以仅选择 `CustomerID` 和：\n\n```sql\nALTER PROCEDURE CustomerProcedure\n\
  (@CustID INT)\nAS\nBEGIN\nSELECT CustomerID\nFROM Customers\nWHERE CustomerID =\
  \ @CustID\nEND\n```\n\n***\n\n### 数据库差异：MySQL\n\n在 MySQL 中，创建等效存储过程的命令是：\n\n点击此处查看代码图片\n\
  \n```sql\nCREATE PROCEDURE CustomerProcedure\n(@CustID INT)\nAS\nBEGIN\nSELECT *\n\
  FROM Customers\nWHERE CustomerID = @CustID\nEND\n```\n\n***\n\n### 函数\n\n当执行存储过程时，调用程序会传递一个参数值，SQL\
  \ 语句的执行就像该值是语句的一部分一样。\n\n在 Microsoft SQL Server 中，以下语句将执行 `ProcedureOne` 存储过程：\n\
  \n```sql\nEXEC ProcedureOne\n```\n\n执行此语句时，它将返回存储过程中包含的 `SELECT` 语句的结果。\n\n`ProcedureOne`\
  \ 没有任何参数，因此语法非常简单。为了说明运行带输入参数的存储过程，以下代码为 `CustID` 值为 2 执行 `CustomerProcedure` 存储过程：\n\
  \n```sql\nEXEC CustomerProcedure\n@CustID = 2\n```\n\n***\n\n### 数据库差异：MySQL\n\n\
  MySQL 使用 `CALL` 关键字而不是 `EXEC` 来执行存储过程，且带参数的存储过程语法略有不同。MySQL 中与上述两个 `EXEC` 语句等效的语句是：\n\
  \n```sql\nCALL ProcedureOne:\nCALL CustomerProcedure (2);\n```\n\n***\n\n### 修改和删除存储过程\n\
  \n一旦创建存储过程，就可以对其进行修改。就像使用 `ALTER` 关键字修改视图一样，`ALTER PROCEDURE` 关键字被用于修改存储过程。其语法与\
  \ `CREATE PROCEDURE` 命令相同，只是用 `ALTER` 替换了 `CREATE`。由于 `CREATE PROCEDURE` 在每个数据库中的语法略有不同，`ALTER\
  \ PROCEDURE` 也是如此。\n\n我们已经看到过使用 Microsoft SQL Server 创建存储过程的这个示例：\n\n点击此处查看代码图片\n\
  \n```sql\nCREATE PROCEDURE CustomerProcedure\n(@CustID INT)\nAS\nBEGIN\nSELECT *\n\
  FROM Customers\nWHERE CustomerID = @CustID\nEND\n```\n\n在创建此过程后，如果你想修改该过程以仅选择 `CustomerID`\
  \ 和：\n\n```sql\nALTER PROCEDURE CustomerProcedure\n(@CustID INT)\nAS\nBEGIN\nSELECT\
  \ CustomerID\nFROM Customers\nWHERE CustomerID = @CustID\nEND\n```\n\n***\n\n###\
  \ 函数\n\n当执行存储过程时，调用程序会传递一个参数值，SQL 语句的执行就像该值是语句的一部分一样。\n\n\n\n\n\n正如推测的那样，插入和删除行相对简单。然而，更新现有数据是一项更复杂的任务，因为它涉及识别要更新的行以及这些行中的特定列。我们将从插入和删除开始，然后转向更新。\n\
  \n### 修改策略\n\n修改数据的机制相当直观。然而，该过程的性质意味着这是一个充满风险的领域。由于是人来操作，难免会犯错。只需一个命令，你就可能会错误地删除成千上万行，或者应用可能难以撤销的错误更新。\n\
  \n在实际操作中，可以采用各种策略来帮助防止灾难性的失误。例如，从表中删除行时，你可以使用 `soft delete`（软删除）技术。这意味着你并不是实际上删除行，而是在表中指定一个特殊列，将每行标记为“活跃”或“非活跃”。与其删除某行，你只需将其标记为非活跃。这样，如果误删了，可以通过更改活跃/非活跃状态列的值来轻松撤销。\n\
  \n在进行插入时也可以使用类似的技术。在添加行时，你可以在特殊列中标记插入的确切日期和时间。如果后来确定该行是错误添加的，你可以找到所有在指定时间范围内添加的行并将其删除。\n\
  \n涉及更新数据时，问题变得更加复杂。通常，建议维护一个单独的表来存储预期更新事务的数据。如果发生了任何种的错误，你可以回到事务表查找被修改数据之前和之后的值，并利用这些值撤销之前的任何错误。\n\
  \n上述策略只是你可以采取的众多方法中的少数。这个主题已超出现本书的范围。底线原则是：在更新数据时要谨慎。与许多用户友好的桌面应用程序不同，SQL 没有 `undo`\
  \ 命令。\n\n## 插入数据\n\nSQL 提供了 `INSERT` 关键字来向表中添加数据。执行 `INSERT` 有两种基本方式：\n\n*   插入\
  \ `INSERT` 语句中列出的特定数据\n*   从 `SELECT` 语句获取数据\n\n让我们从一个示例开始，它展示了如何插入数据，其中数据值是在 `INSERT`\
  \ 语句中指定的。假设我们有一个 `Clients` 表，其中已经有了这些数据：\n\n![Image](img/172tab01.jpg)\n\n让我们假设第一列\
  \ `ClientID` 是表的主键。在第 1 章和第 2 章中，我们讨论过主键强制要求表中的每行必须是唯一标识的。我们还提到主键列通常被指定为自增列。这意味着在向表中添加行时，它们会自动被分配一个数字。\n\
  \n假设 `ClientID` 被定义为自增列，这意味着当我们向 `Clients` 表添加行时，我们不需要为 `ClientID` 列指定值。它将在每当有被添加到表时自动确定。我们只需要为其他三列指定值即可。\n\
  \n让我们继续执行一个向表中添加两个新客户的程序：来自俄亥俄州的 Claudia Davis 和来自加利福尼亚州的 Ingrid Krause。该语句执行插入：\n\
  \n```sql\nINSERT INTO Clients\n(FirstName, LastName, State)\nVALUES ('Claudia',\
  \ 'Davis', 'Ohio'), ('Ingrid', 'Krause', 'California')\n```\n\n插入后，`Clients` 表包含：\n\
  \n| ClientID | FirstName | LastName | State |\n| :--- | :--- | :--- | :--- |\n|\
  \ 1 | Claudia | Davis | Ohio |\n| 2 | Ingrid | Krause | California |\n\n```sql\n\
  INSERT INTO Clients (FirstName, LastName, State)\nVALUES ('Claudia', 'Davis', 'Ohio'),\
  \ ('Ingrid', 'Krause', 'California')\n```\n\n### 数据库差异：Oracle\n\nOracle 不以相同的方式支持自增列。使用\
  \ Oracle 时，你可能需要手动指定值或使用序列。`INSERT` 语句可能如下：\n\n```sql\nINSERT INTO Clients (FirstName,\
  \ LastName, State)\nVALUES ('Claudia', 'Davis', 'Ohio'), ('Ingrid', 'Krause', 'California')\n\
  ```\n\n此外，请注意列出的列顺序不需要与表中的顺序一致。\n\n```sql\nINSERT INTO Clients (State, LastName,\
  \ FirstName)\nVALUES ('Ohio', 'Davis', 'Claudia'), ('California', 'Krause', 'Ingrid')\n\
  ```\n\n### 删除数据\n\n删除数据比添加数据要简单得多。`DELETE` 语句用于处理删除。通用格式为：\n\n```sql\nDELETE FROM\
  \ table WHERE condition\n```\n\n\n\n\n`WHERE State = 'RI'`\n\n就是这些了。如果你想在执行之前的 `DELETE`\
  \ 之前测试其结果，可以简单地将 `DELETE` 替换为 `SELECT`，如下：\n\n```sql\nSELECT\nCOUNT(*)\nFROM Clients\n\
  WHERE State = 'RI'\n```\n\n这将提供即将被删除的行数，从而为删除操作提供某种程度的验证。\n\n删除数据还有另一种值得值得一提的方法。如果你想删除单列中的所有数据，可以使用\
  \ `TRUNCATE TABLE` 语句来删除所有内容。`TRUNCATE TABLE` 相比于 `DELETE` 语句的优势在于它的速度快得多。与 `DELETE`\
  \ 不同，`TRUNCATE TABLE` 不记录事务的结果。我们还没有讨论过数据日志进程，但这是大多数数据库都提供的一个功能，允许数据库管理员在系统崩溃或其他类似问题发生时恢复数据库。\n\
  \n如果你想删除 `Clients` 表中的所有行，可以执行此语句：\n\n```sql\nTRUNCATE TABLE Clients\n```\n\n这与以下语句的效果相同：\n\
  \n```sql\nDELETE\nFROM Clients\n```\n\n`DELETE` 和 `TRUNCATE TABLE` 之间的另一个细微差别是，`TRUNCATE\
  \ TABLE` 会重置自增列使用的值。而 `DELETE` 则不会影响这些值。\n\n### 更新数据\n\n更新数据的过程涉及指定要更新的列，以及用于选择行的逻辑。`UPDATE`\
  \ 语句的通用格式为：\n\n```sql\nUPDATE table\nSET Column1 = Expression1,\nColumn2 = Expression2\n\
  [重复任意次数]\nWHERE condition\n```\n\n此语句与基本的 `SELECT` 类似，不同之处在于 `SET` 关键字用于为指定的列分配新值。`WHERE`\
  \ 条件指定了要更新哪些行，但 `UPDATE` 语句可以同时更新多个列。如果更新了多个列，`SET` 关键字只需列出一次，但必须用逗号分隔所有的更新表达式。\n\
  \n从一个简单的例子开始，假设我们想将 Joyce Bentley 的姓改为 Barrow，并将她所在的州份从田纳西州 (TN) 更改为威斯康星州 (WI)。她在\
  \ `Clients` 表中的行目前看起来如下：\n\n![Image](img/177tab01.jpg)\n\n用于完成此修改的 `UPDATE` 语句为：\n\
  \n```sql\nUPDATE Clients\nSET LastName = 'Barrow',\nState = 'WI'\nWHERE ClientID\
  \ = 1\n```\n\n执行此语句后，`Clients` 表中的这一行已变为：\n\n![Image](img/177tab02.jpg)\n\n注意，`FirstName`\
  \ 列的值没有变化，因为该列没有包含在 `UPDATE` 语句中。另外请注意，`WHERE` 子句是至关重要的。如果没有 `WHERE`，此更改将应用到表中的每一行。\n\
  \n### 相关子查询更新\n\n之前的 `UPDATE` 示例足够简单，但并不完全符合实际情况。`UPDATE` 更常见的用法是涉及根据另一个表中的数据来更新一个表中的数据。假设我们有如下所示\
  \ `Vendors` 表：\n\n![Image](img/177tab03.jpg)\n\n此 `VendorTransactions` 表包含了现有供应商的近期更改：\n\
  \n![Image](img/177tab04.jpg)\n\n`Vendors` 表是供应商的主要数据源。要从 `VendorTransactions` 表更新\
  \ `Vendors` 表，我们需要使用在第 14 章 中讨论过的子查询技术。之所以需要相关子查询，是因为 `UPDATE` 语句只能指定一个表进行更新。我们不能简单地将多个表连接起来让其工作。我们需要在\
  \ `SET` 关键字之后使用相关子查询来指示数据的来源。\n\n以下语句可以根据 `VendorTransactions` 表中的事务更新 `Vendors`\
  \ 表中的 `State` 和 `Zip` 列。由于此语句相当复杂，我们插入了几个空行，以便随后讨论该语句的四个部分。\n\n点击此处查看代码图像\n\n```sql\n\
  UPDATE Vendors\nSET Vendors.State =\n(SELECT VendorTransactions.State\nFROM VendorTransactions\n\
  WHERE Vendors.VendorID = VendorTransactions.VendorID),\nVendors.Zip =\n(SELECT VendorTransactions.Zip\n\
  FROM VendorTransactions\nWHERE Vendors.VendorID = VendorTransactions.VendorID)\n\
  WHERE EXISTS\n(SELECT *\nFROM VendorTransactions\nWHERE Vendors.VendorID = VendorTransactions.VendorID)\n\
  ```\n\n让我们详细分析一下这个 `UPDATE` 语句。语句的第一部分（由第一行组成）表示更新将在 `Vendors` 表上进行。\n\n语句的第二部分指定了如何更新\
  \ `State` 列。更新基于此相关子查询：\n\n点击此处查看代码图像\n\n```sql\nSELECT VendorTransactions.State\n\
  FROM VendorTransactions\nWHERE Vendors.VendorID = VendorTransactions.VendorID\n\
  ```\n\n我们可以判断出这是一个相关子查询，因为如果我们尝试单独执行此 `SELECT`，它将产生错误。子查询从 `VendorTransactions`\
  \ 表获取数据，并通过 `VendorID` 在两个表之间进行匹配。\n\n语句的第三部分与第二部分相同，不同在于这些行关注的是 `Zip` 列的更新。此外注意\
  \ `SET` 关键字仅在第二部分列出过，在第三部分中不需要。\n\n最后部分包含了整个 `UPDATE` 语句的 `WHERE` 子句逻辑。`EXISTS`\
  \ 运算符配合另一个子查询，用于确定 `Vendors` 表中的每个 `VendorID` 是否于 `VendorTransactions` 表。如果没有这个\
  \ `WHERE` 子句，更新会将供应商 3 和 4 的 `State` 和 `Zip` 列更改为 `NULL`，因为这些供应商在 `VendorTransactions`\
  \ 表中没有行。`WHERE` 子句中的相关子查询确保了我们仅对那些在 `VendorTransactions` 表中确实数据的供应商进行更新。\n\n正如你所推的，使用相关子查询进行更新的操作非常复杂。因此，该主题超出了本书的范围。我们包含这个示例只是为了让你了解数据更新涉及的一些复杂性。此外，请注意相关子查询对于删除操作也同样有用。\n\
  \n### 展望\n\n\n\n\n\n在本章中，我们将关注点从数据检索和修改转向设计。到目前为止，我们一直假设表已经存在，并且可以供任何感兴趣的用户使用。然而，在正常情况下，在访问表中的数据之前，必须由某人创建表。我们现在转向如何创建和维护表的问题。\n\
  \n我们之前简要提到了将处理的一些主题，例如主键和外键，但现在我们想更深入地探讨这些领域，并引入相关的表索引主题。\n\n## 数据定义语言 (Data Definition\
  \ Language)\n\n在早前的第 1 章中，我们提到了 SQL 语言的三个主要部分：`DML`（数据操作语言）、`DDL`（数据定义语言）和 `DCL`（数据控制语言）。直到现在，我们讨论的大部分都是\
  \ `DML`。`DML` 语句允许你通过检索、插入、删除或更新来操作关系型数据库中的数据。这是通过 `SELECT`、`INSERT`、`DELETE` 和\
  \ `UPDATE` 语句来实现的。\n\n尽管重点一直是 `DML`，但我们已经看到过几次 `DDL`（数据定义语言）的实例。我们在第 13 章和第 16 章中遇到的\
  \ `CREATE VIEW` 和 `CREATE PROCEDURE` 语句就是 `DDL`，相关的 `ALTER` 和 `DROP` 版本也是如此。\n\n\
  `CREATE VIEW` 和 `CREATE PROCEDURE` 语句是 `DDL`是因为它们只允许你操作数据库的结构。它们与数据库中的数据无关。\n\n\
  在本章中，我们将要概述一些额外的 `DDL` 语句，这些语句用于创建和修改表以及索引。\n\n每个数据库组织对象的方式都不同，因此可用的 `DDL` 语句也不同。例如，MySQL\
  \ 对于这些类型的对象有 11 种不同的 `CREATE` 语句：数据库、事件、函数、索引、日志文件组、存储过程、服务器、表、表空间、触发器和视图。\n\nOracle\
  \ 对其数据库中的对象类型有 30 多种不同的 `CREATE` 命令。Microsoft SQL Server 对其对象类型有 40 多种不同的 `CREATE`\
  \ 命令。\n\n事实上，对数据库对象（如视图和表）的大多数修改都可以通过每个软件供应商提供的用于管理软件的可视 GUI（图形用户界面）完成。通常不需要学习任何\
  \ `DDL`，因为这些通常可以通过软件 GUI 处理。\n\n然而，至少意识到用于操作数据对象的几个关键语句的存在是有帮助的。我们已经看到了一些允许我们修改视图和存储过程的语句。在本章中，我们将涵盖通过\
  \ `DDL` 修改表和索引的某些可能性。\n\n## 表属性 (Table Attributes)\n\n在前两个章节中，我们简要讨论了数据库表的的一些属性，例如主键、外键、数据类型和自增列。如前所述，SQL\
  \ `DDL` 为许多类型的数据库对象提供了 `CREATE` 语句。在第 13 章和第 16 章中，我们谈讨论了处理存储过程和视图的 `CREATE PROCEDURE`\
  \ 和 `CREATE VIEW` 语句。\n\n现在我们将把注意力重新回到表上。表也许是数据库中最主要、最核心的对象类型。没有表，其他任何东西都不真的重要。数据库中的所有数据物理上都存储在表中。大多数其他对象类型都以某种方式与表相关。视图提供了表的虚拟视图。存储过程通常作用于表中的数据。函数允许对表中的数据操作设置特殊规则。\n\
  \n我们在这里将关注如何初始创建表。表定义可以关联大量的属性。我们将对一些更重要的属性进行概述，并讨论它们的含义。\n\n表属性的主题还与数据库设计这一更大的主题相关，它将在下一章中讨论。现在，我们想关注对表本身可以进行的操作机制。\n\
  \nMicrosoft SQL Server、MySQL 和 Oracle 在如何设计和更改表方面的具体细节差异很大。我们将主要讨论这三个数据库中表中通用的属性。\n\
  \n## 表列 (Table Columns)\n\n表被定义为包含任意数量的列。每列都有多种特定该列的属性。第一个最显而易见的属性是列名。每列都必须给出一个在该表中唯一的名称。\n\
  \n列的第二个属性是数据类型，这个主题在第 1 章中讨论过。我们已经描述了三个主要类中的一些显著数据类型：数值、字符和日期/时间。数据类型是决定每列可以包含什么类型数据的关键因素。\n\
  \n列的第三个属性是它是否可以被定义为自增列。我们在第 1 章和第 2 章中简要介绍了这种属性类型，并在之前的关于修改数据的章节中进行了进一步讨论。基本上，自增列意味着在向表中添加每行时，该列会自动分配一个递增的数值。自增列通常与主键一起使用，也可以分配给普通列。\n\
  \n注意 `auto-increment` 术语是 MySQL 特有的。Microsoft 使用 `identity` 指代相同类型的属性。\n\n* *\n\n\
  ### 数据库差异：Oracle\n\nOracle 没有自增类型的属性。相反，Oracle 要求你定义一个 `sequence`（序列），然后创建一个 `trigger`（触发器）来填充该列的值。这一过程超出了本书的范围。\n\
  \n* *\n\n第四个列属性是列是否允许包含 NULL 值。默认是允许 NULL 值。如果你不想允许列包含 NULL，通常通过 `NOT NULL` 关键字来指定。\n\
  \n我们将提到的最后一个列属性是该列是否被分配了默认值。如果在添加行时没有提供该列的值，则会自动为该列分配默认值。例如，如果你的大多数客户都在美国，你可能希望指定包含国家代码的列的默认值为\
  \ US。\n\n## 主键与索引 (Primary Keys and Indexes)\n\n让我们转向主键主题，并解释该属性与表索引的关系。\n\n索引是可以添加到数据库表中的任意列的物理结构。索引的作用的作用是在当该列参与\
  \ SQL 语句时，加速数据检索。索引中的实际数据是隐藏的，但基本上索引涉及一个维护列的排序顺序信息的结构，从而在请求特定值时允许更快的检索。\n\n对列索引的一个缺点是它需要数据库更多的磁盘存储。第二个负面影响是索引通常会减慢涉及该列的数据更新。这是因为每当插入或修改行时，索引都必须重新计算该列值的正确排序顺序。\n\
  \n任何列都可以被索引，但只能有一个列可以被指定为主键。将列指定为主键意味着两点：该列将被索引，且该列将保证包含唯一值。\n\n正如在第 1 章中讨论过的，主键为数据库用户实现了两个主要优势。它们允许你唯一地标识表中的某行，并允许你轻松地将表相互联结。现在，可以增加第三个优势——即通过索引，主键能够更快地检索涉及该列的行。\n\
  \n\n\n\n\n设置主键的主要目的是保证表中所有行的值都是唯一的。必须总有一种方法来标识用于更新或删除的单行，而主键确保了这种操作可以实现。\n\n此外，主键实际上可以跨多个列，并由两个或三列组成。如果主键包含多个列，仅意味着所有这些列组合在一起将包含一个唯一值。这种主键通常被称为`复合主键`（composite\
  \ primary key）。举例说明何时会使用复合主键：假设你有一个 `Movies`（电影）表。你希望有一个键能唯一标识表中的每部电影。你不想使用 `MovieID`\
  \ 整数值作为键，而是想使用电影标题作为键。然而，问题是，可能存在多个相同标题的电影。为了解决这个问题，你可能想使用两列——电影标题和发行日期——组成一个复合主键，以唯一定义每部电影。\n\
  \n由于主键必须包含唯一值，因此永远不允许包含 `NULL` 值。必须为该列指定某个值。\n\n最后，主键通常被指定为自动递增列。通过将主键设置为自增，数据库开发人员无需担心为该列分配唯一值。自动递增功能会处理这一需求。\n\
  \n### 外键\n\nSQL 数据库也可以将特定列指定为外键。外键简单来说是从一个表中的列到另一个表中的列的引用。在设置外键时，系统会被你指定两个列。正在配置的表中的外键通常称为位于`子表`（child\
  \ table）。另一个表中的被引用列则称为位于`父表`（parent table）。\n\n例如，假设你有一个 `Customers`（客户）表，其中 `CustomerID`\
  \ 列被设置为主键。你还有一个 `Orders`（订单）表，其中 `OrderID` 列被设置为主键，并有一个 `CustomerID` 列。在这种情况下，你可以将\
  \ `Orders` 表中的 `CustomerID` 列设置为外键，引用 `Customers` 表中的 `CustomerID` 列。在这种情况下，`Orders`\
  \ 表是子表，而 `Customers` 表是父表。外键的想法是确保 `Orders` 表中的 `CustomerID` 指向 `Customers` 表中存在的客户，并将两个表中的\
  \ `CustomerID` 列作为共同元素。\n\n当设置了外键后，可以针对父表中行的更新和删除设置某些特定操作。最常见的三个操作是：\n\n*   不操作\
  \ (No Action)\n*   级联 (Cascade)\n*   置空 (Set Null)\n\n这三个操作可以指定用于更新或删除。继续使用 `Customers`\
  \ 和 `Orders` 表的示例，最可能的指定操作是 `No Action`。在未指定操作的情况下，这通常是默认操作。如果 `Orders` 表中的 `CustomerID`\
  \ 列在更新时设置为 `No Action`，这意味着每每当尝试对父表中的 `CustomerID` 列进行更新时，都会进行检查。如果 SQL 尝试对 `CustomerID`\
  \ 执行更新，导致子表中的任何行指向一个已不存在的值，它将阻止该操作的发生。如果对删除指定了 `No Action`，情况也是如此。这确保了在任一幅表中使用 `CustomerID`\
  \ 列时，`Orders` 表中的所有行都正确指向 `Customers` 表中存在的行。\n\n外键指定操作的另一个可选方案是 `Cascade`（级联）。这意味着当父表中的值更新且该值影响到子表中的行时，SQL\
  \ 将自动更新子表中的所有行，以反映父表中的新值。同样，如果删除了父表中的某行，且它影响了子表中的行，SQL 将自动删除子表中的受影响行。\n\n外键指定操作的第三种可选方案是\
  \ `Set Null`（置空），有时用于删除。这意味着当父表中的某个值被删除，且该值影响到子表中的行时，SQL 将自动更新子表中的所有受影响行，使外键包含一个\
  \ `NULL` 值，表示相应的父表行不存在。\n\n### 创建表\n\n`CREATE TABLE` 语句用于在数据库中创建新表。语法和可用功能在不同数据库之间有所不同。我们将通过一个简单的示例来说说明，创建一个具有以下属性的表：\n\
  \n*   表名为 `MyTable`。\n*   表中的第一列名为 `ColumnOne`，并定义为主键。该列将被定义为 `INT`（整数）数据类型，并定义为自动递增列。\n\
  *   表中的第二列名为 `ColumnTwo`，定义为 `INT` 数据类型。该列不允许 `NULL` 值。该列还将被定义为外键，并在删除时指定为 `Set\
  \ Null`，与名为 `RelatedTable` 的另一个表中的 `FirstColumn` 列相关。\n*   第三列名为 `ColumnThree`，定义为长度为\
  \ 25 个字符的 `VARCHAR` 数据类型。该列允许 `NULL` 值。\n*   第四列名为 `ColumnFour`，定义为 `FLOAT` 数据类型，并允许\
  \ `NULL` 值。它将被赋予默认值 10。\n\n以下是在 Microsoft SQL Server 中创建此类表的 `CREATE TABLE` 语句：\n\
  \n点击此处查看代码图片\n\n```sql\nCREATE TABLE MyTable\n(\nColumnOne INT IDENTITY(1,1) PRIMARY\
  \ KEY NOT NULL,\nColumnTwo INT NULL\nREFERENCES RelatedTable (FirstColumn)\nON DELETE\
  \ SET NULL,\nColumnThree VARCHAR(25) NULL,\nColumnFour FLOAT NULL DEFAULT (10))\n\
  ```\n\n### 数据库差异：MySQL 和 Oracle\n\n在 MySQL 中，相同的 `CREATE TABLE` 语句如下：\n\n点击此处查看代码图片\n\
  \n```sql\nCREATE TABLE MyTable\n(\nColumnOne INT AUTO_INCREMENT PRIMARY KEY NOT\
  \ NULL,\nColumnTwo INT NULL,\nColumnThree VARCHAR(25) NULL,\nColumnFour FLOAT NULL\
  \ DEFAULT 10,\nCONSTRAINT FOREIGN KEY(ColumnTwo)\nREFERENCES RelatedTable (FirstColumn)\n\
  ON DELETE SET NULL);\n```\n\n在 Oracle 中相同的语句是：\n\n点击此处查看代码图片\n\n```sql\nCREATE TABLE\
  \ MyTable\n(ColumnOne INT PRIMARY KEY NOT NULL,\nColumnTwo INT NULL,\nColumnThree\
  \ VARCHAR(25) NULL,\nColumnFour FLOAT DEFAULT 10 NULL,\nCONSTRAINT \"ForeignKey\"\
  \ FOREIGN KEY (ColumnTwo)\nREFERENCES RelatedTable (FirstColumn)\nON DELETE SET\
  \ NULL);\n```\n\n如前所述，Oracle 不允许自动递增列。\n\n\n\n\n添加或修改表和索引的 SQL 语句虽然复杂，但详细学习它们并不重要。数据库软件通常提供图形化工具来修改表结构，而无需发布\
  \ SQL 语句。本章需要掌握的重要概念是了解各种表属性，包括理解索引、主键和外键之间是如何相互关联的。\n\n在下一章“数据库设计原则”中，我们将从创建表这一相对枯燥的任务转向更广泛的数据库设计主题。正如同在访问数据之前必须创建表一样，数据库的整体结构通常在创建表之前就已经设计。因此，从某种意义上说，我们正在反向学习那些通常在尝试检索数据之前就会介绍的主题。当然，数据库的特定设计是你通过\
  \ SQL 交付高质量结果的能力的核心组成。如果数据库设计得糟糕，任何访问该数据库数据的人在检索数据时都会受到阻碍。下一章将讨论的数据库设计原则的基础知识，对于确保高质量的数据检索体验非常有帮助。\n\
  \n## 19. 数据库设计原则\n\n在第一章中，我们引入了关系型数据库是数据的集合并存储在任意数量表中的概念。假设这些表以某种方式相互关联。在上一章关于维护表的章节，我们明确了数据库设计人员如果他们选择，可以分配外键以确保表之间的某些关系得到适当维护。\n\
  \n然而，即使我们了解了主键和外键，但仍然没有解决从根本上如何设计数据库的基本问题。要解决的主要问题如下：\n\n- 应该如何将数据组织成一组相关的表？\n-\
  \ 每个表中应该放置哪些数据元素？\n\n一旦定义了表及其数据元素，数据库管理员就可以开始创建外键、索引、适当的数据类型等工作。\n\n对于上述两个问题，永远没有一个唯一的正确答案。除了每个组织或企业都是独特性之外，任何特定情况也很少有确定的解决方案。这在很大程度上取决于业务希望数据设计具有多大的灵活性。另一个因素是现有数据的存在以及与这些数据保持连续性的需求。很少有组织能够在不考虑现有内容的情况下，在真空中设计他们的数据库。\n\
  \n尽管有这些规定，某些数据库设计原则随着时间的推移而演变，指导我们追求最优的设计结构。许多设计原则源于关系型数据库设计领域最具影响力的架构师 E.F. Codd，他于\
  \ 1979 年发表了开创性的论文《大型共享数据库的关系数据模型》。这篇文章为我们现在所说的`relational model`和`normalization`的概念奠定了基础。\n\
  \n### 规范化的目标\n\n`normalization` 一术语指的是一个特定的过程，该过程允许数据库架构师将非结构化数据转换为设计良好的表和数据元素集合。\n\
  \n理解规范化的最佳方法是说明它不是什么。为了做到，我们将从展示一个设计糟糕且存在许多明显问题的表开始。以下是一个名为 `Grades` 的表，它尝试展示学生参加考试后获得的所有成绩信息。每一行代表一个特定学生的成绩。\n\
  \n![Image](img/190tab01.jpg)\n\n让我们先简要描述此表中的每一列旨在提供的信息。这些列是：\n\n- **Test**: 对所提供的考试或测验的描述\n\
  - **Student**: 参加考试的学生\n- **Date**: 考试的日期\n- **TotalPoints**: 考试的可能总分\n- **Grade**:\
  \ 学生得到的分\n- **TestFormat**: 考试格式：论述、多选择或两者兼有\n- **Teacher**: 组织考试的老师\n- **Assistant**:\
  \ 被指派协助老师的人员\n\n我们假设该表的主键是一个由 `Test` 和 `Student` 列组成的复合主键。表中的每一行都表示某个特定考试和特定学生的成绩。\n\
  \n该表有两个明显的问题。首先，某些数据被不必要的重复。例如，我们可以看到在 `2017-03-02` 进行的 `Pronoun Quiz` 总分为 10 分。问题是，这些信息必须在该测验的每一行中重复。如果我们可以简单地只需查看一次特定测验的总分，会更好。\n\
  \n第二个问题是数据在某些单个单元格内存在重复。在第六行中，`TestFormat` 既是 `Multiple Choice` 又是 `Essay`。这种情况的存在是因为这次考试同时包含这两种题目。这使得数据难以使用。如果我们想检索所有带有论述题的考试，我们该如何做呢？\n\
  \n更广泛地说，该表的主要问题是它试图将所有已知信息都放在一个表中。将此表中的信息拆分为独立的实体（如学生、成绩和老师），并将每个实体表示为单独的表将要好得多。然后可以使用\
  \ SQL 的功能来根据需要将表连接起来，以检索任何所需的信息。\n\n考虑到这些讨论，让我们现在正式明确规范化过程希望实现的目标。主要有两个两个目标：\n\n\
  - **消除冗余数据**: 上面的例子清楚地说明了数据冗余的问题。但为什么这很重要？在多行中列出相同的数据到底有什么问题？嗯，除了不必要的精力重复之外，冗余还降低了灵活性。当数据被重复时，对特定值的任何更改都会影响多行，而不仅仅是一行。\n\
  - **消除插入、删除和更新异常**: 冗余数据问题也与第二个目标有关，即消除插入、删除和更新异常。例如，假设某个老师结婚并更改了姓。由于我们希望数据反映新姓，现在必须更新包含该姓名的所有行。然而，由于数据是冗余存储的，我们需要更新大量数据，而不是仅仅一行。\n\
  \n还有插入和删除异常。例如，假设我们刚刚聘请了一位教音乐的新老师。我们希望在数据库的某处记录这些信息。然而，由于该老师还没有组织考试，因此没有地方放置这些信息，因为我们没有专门针对老师实体的表。\n\
  \n同样，删除异常会发生在我们想删除某一行，但这样做就会消除某些相关信息。用另一个例子来说，如果我们有一个书籍数据库，并想删除 `George Orwell`\
  \ 的某本书的行，如果那是数据库中 `George Orwell` 的唯一一本书，那么该行的删除不仅消除了这本书，还消除了 `George Orwell` 是未来可能获取的其他书籍的作者这一事实。\n\
  \n### 如何规范化数据\n\n`normalization` 具体是指什么？\n\n\n\n\n该术语本身源于 E.F. Codd，指的是为了消除数据库设计中的冗余和更新异常而的一系列推荐步骤。规范化过程中涉及的步骤通常被称为`第一范式`、`第二范式`、`第三范式`等。尽管有些人描述了一直到第六阶范式的步骤，但通常的做法是只经过第一、第二和第三范式。当数据达到第三范式时，通常认为它已经经过了充分的规范化。\n\
  \n我们不会详细阐述将数据转换为第一、第二、第三范式的全部规则和程序。其他文本将对这一过程进行非常详尽的阐述，展示如何将数据转换为`第一范式`，然后转换为`第二范式`，最后转换为`第三范式`。\n\
  \n相反，我们将总结将数据转换为第三范式的规则。在实践中，经验丰富的数据库管理员可以直接从非结构化数据跳跃到第三范式，而无需遵循每一步中间程序。我们在这里也将这样做。\n\
  \n数据规范化的三个主要规则如下：\n\n- **消除重复数据。** 这一规则意味着不允许存在多值属性。在上一个例子中，我们不允许在单个数据单元格中存在如“单选题、申答”这样的值。单个单元格中存在多个值会给通过任何给特定值检索数据带来明显的困难。\n\
  \n该规则的推论是不允许存在重复列。在我们的示例中，数据库的设计可能是这样的：不是使用一个名为`TestFormat`的单列，而是使用两个名为`TestFormat1`和`TestFormat2`的独立列。通过这种替代方法，我们可能会将“单选题”放在\
  \ `TestFormat1`列中，将“申答”放在 `TestFormat2`列中。这是不允许的。我们不希望出现重复数据，无论它是表现为单列中的多个值，还是表现为多个列。\n\
  \n- **消除部分依赖。** 这一规则主要指表的主键是复合键的情况，即由多个列组成的键。该规则规定，表中的任何列都不能只与主键的部分相关。\n\n让我们用一个例子来说说明。如所述，`Grades`\
  \ 表中的主键是一个由 `Student` 和 `Test` 列组成的复合键。问题出现在如 `TotalPoints` 等列上。`TotalPoints` 列实际上是测试的属性，与学生无关。该规则强制表中的所有非键列都引用整个键，而不仅仅是键的一部分。本质上，部分依赖意味着表中的数据与多个实体相关。\n\
  \n- **消除传递性依赖。** 这一规则指表中的某列引用的不是主键，而是同一表中的另一个非键列的情况。在我们的示例中，`Assistant` 列实际上是 `Teacher`\
  \ 列的属性。助理与教师相关而不是与主键中的任何内容（测试或学生）相关的，这一事实表明该信息不属于这张表。\n\n我们现在已经看到了问题并讨论了修复数据的规则，但如何实际确定正确的数据库设计变更呢？这就是经验发挥作用的地方。而且，对于任何给定的问题，通常没有单一的解决方案。\n\
  \n尽管如此，以下是解决该设计问题的一种方案。在这个新设计中，从原始的一个表创建了几个新表，现在所有数据都处于规范化形式。图 19.1 使用实体关系图展示了新设计中的表。\n\
  \n![Image](img/19fig01.jpg)\n\n图 19.1 规范化设计\n\n如第 11 章所示，实体关系图不显示详细数据。相反，它们指示了数据的整体结构。每个表中的主键用粗体显示。表中添加了若干具有自动增加值的\
  \ `ID` 列，允许定义表与表之间的关系。所有其他列与之前看到的相同。\n\n需要注意的主要点是，此示例中讨论的每个实体都被拆分成了独立的表。`Students`\
  \ 表包含了关于每个学生的信息。该表中的唯一属性是学生姓名。\n\n`Grades` 表包含了每个成绩的信息。它有一个由 `StudentID` 和 `TestID`\
  \ 组成的复合主键，因为每个成绩都与一个学生和一个特定的测试绑定。\n\n`Tests` 表包含了每个测试的信息，例如日期、`TeacherID`、测试描述以及测试总分。\n\
  \n`Formats` 表包含了测试格式的信息。对于每个测试，都会向该表添加多行，以指示该测试是单选题、申答还是两者兼有。\n\n`Teachers` 表包含了每个老师的信息，包括老师的助理（如果存在）。\n\
  \n以下是这些新表中包含的数据，对应原始 `Grades` 表中的数据。\n\nStudents 表：\n\n![Image](img/193tab01.jpg)\n\
  \nTeachers 表：\n\n![Image](img/194tab01.jpg)\n\nTests 表：\n\n![Image](img/194tab02.jpg)\n\
  \nFormats 表：\n\n![Image](img/194tab03.jpg)\n\nGrades 表：\n\n![Image](img/194tab04.jpg)\n\
  \n你的第一印象可能是我们不必要地复杂了情况，而不是改进了它。例如，`Grades` 表现在是一大堆数字，其含义在快速检查时并不显而易见。\n\n然而，考虑到\
  \ `SQL` 能够轻松连接表的能力，你也可以发现这种新设计现在具有更大的灵活性。我们不仅可以自由地连接任何分析所需的表，现在还可以很方便地为这些表添加新列。\n\
  \n我们的信息变得更加模块化了。现在，如果我们决定捕获有关每个学生的额外信息（例如地址和电话号码），我们只需向 `Students` 表中添加新列即可。而且，当我们以后想修改学生的学生的地址或电话号码时，该更改将只影响一行。\n\
  \n### 数据库设计的艺术\n\n根结底，设计数据库远比仅仅通过规范化程序要复杂。数据库设计实际上更多是一门艺术而非科学，它需要询问并思考相关的业务问题。在成绩示例中，我们提供了一种可能的数据库设计，作为如何规范化数据的说明。事实上，设计这个数据库有很多可能性。很大取决于数据如何被访问和修改的现实。可以提出许多问题来确定设计是否足够灵活且有意义。例如：\n\
  \n- **是否还需要向数据库添加其他表？** 一个明显的选择是添加一个允许按科目（如英语或数学）选择测试的 `Subjects` 表。如果添加了表，就可以询问是否希望将科目与测试相关，还是与执行测试的老师相关。\n\
  - **成绩可能对多个科目计数吗？** 英语和社会科学老师可能正在进行联合教学，并希望某些测试对两个科目计数。我们该如何考虑这种情况？\n- **如果一个孩子某次成绩不及格，现在第二次参加相同的测试怎么办？**\
  \ 我们需要确定如何区分学生每次考试的成绩。\n- **我们如何允许老师可能实施的特殊规则？** 例如，老师可能想去掉特定时间段内的最低测验分数。\n\n\n\n\
  \n- **数据是否有特殊的分析要求？** 如果同一门课程有多个老师时，我们是否希望能够比较每位老师学生的平均分，以确保不会有某位老师在放高分数？\n\n可能问题的列表几乎是无尽的。点在于数据并非存在于真空之中。数据设计与现实需求之间存在着必要的交互。数据库的设计必须考虑到灵活性和易用性。然而，也存在一种危险，即数据库可能被过度设计，以至于数据变得难以理解。一个过度热的数据管理员可能会决定创建\
  \ 20 张表以涵盖每可能的情况。这同样是不明智的。数据库设计在寻找一种既足够灵活，又能让系统用户直观且易于理解的设计时，在某种程度上是一场平衡的艺术。\n\n\
  ### 规范化的替代方案\n\n我们一直强调，规范化是设计数据库时应该遵循的首要原则。然而，在某些情况下，可行的替代方案可能更有意义。\n\n例如，在数据仓库系统和软件领域，许多从业者主张使用\
  \ `star schema`（星型模型）设计而非规范化。在星型模型中，允许并鼓励某种程度的冗余。重点在于创建一个能够更直观反映业务现实的数据结构，并且一种允许特殊分析软件快速处理数据的结构。\n\
  \n简述星型模型设计，其核心思想是创建一个中心事实表（fact table），它关联到任意数量的维度表（dimension tables）。事实表包含所有本质上可相加的定量数字。在我们之前的示例中，`Grade`\
  \ 列就是这样一个数字，因为我们可以相加分数以获得一个有意义的总分。维度表包含与中心事实相关的所有实体信息，如科目、时间、老师、学生等。\n\n作为另一种可能性，可以采用特殊的分析软件，允许数据库开发人员从星型模型数据库中创建立方体（cubes）。这些立方体扩展了分析能力，允许用户通过各种维度中预定义的层级进行钻取（drill\
  \ down）。例如，此类系统的用户能够从查看学生整个学期的成绩钻取到查看具体某一周的分数。\n\n图 19.2 显示了我们的成绩示例中采用星型模型设计的数据库可能的样子。\n\
  \n![Image](img/19fig02.jpg)\n\n图 19.2 星型模型设计\n\n在这种设计中，`Grades` 表是中心事实表。所有其他表都是维度表。\n\
  \n`Grades` 表的前四列（`Date`、`TestID`、`StudentID` 和 `TeacherID`）允许事实表中的每一行与维度表中对应的行关联。例如，`Grades`\
  \ 表中的 `StudentID` 列可以与 `Students` 表中的 `StudentID` 值连接。`Grades` 表中的另外两列具有可相加的数值。请注意\
  \ `TotalPoints` 现在位于 `Grades` 表中。在我们的规范化设计中，`TotalPoints` 是 `Tests` 表的一个属性，而分数在\
  \ `Grades` 表中。通过在这一星型模型设计中将 `Grade` 和 `TotalPoints` 放在单张表中，我们可以更容易地对任何数据集求分数的总和并计算平均值（`Grade`\
  \ 除以 `TotalPoints`）。\n\n当然，这只是对数据仓库应用数据库设计这一主题的简要介绍。然而，它说明了这样一点：设计数据库有许多不同的方法，而最好的方法通常与与数据使用的软件类型有关。\n\
  \n### 展望\n\n本章涵盖了数据库设计的原则。我们讨论了规范化过程的基础知识，展示了单表数据库如何转换为具有多个表并通过额外的键列关联的更灵活结构。我们还强调，数据库设计不仅仅是一项技术练习。必须关注组织的现实情况以及对数据如何被访问和利用的考虑。最后，我们简要描述了星型模型作为传统规范化设计的替代方案，以强调通常有不止一种可行的方法。\n\
  \n在我们的最后一个章节“显示显示数据的策略”中，我们将讨论使用电子表格来补充我们对 `SQL` 知识的一些有趣可能。在追求 `SQL` 技能的道路上，我们不能忘记\
  \ `SQL` 之外还有一个世界。当底层目标可以通过其他手段更有效地实现时，我们不应该将精力耗费在 `SQL` 上。\n\n## 20. 显示数据的策略\n\n\
  在最后一个章节中，我们将回到本书的主题——即从关系型数据库中检索数据的方法。在之前的几几章中，我们离开了数据检索，转而径了讨论了更新数据、维护表和设计数据库等相关话题。现在，我们想再次关注\
  \ `SQL` 在检索数据中的作用。具体来说，我们将比较 `SQL` 的能力与其他终端用户可用的报告工具，并讨论为当前工作聘用最合适工具的策略。\n\n在广泛的商业和企业世界中，`Microsoft\
  \ Excel` 是终端用户可用且无处不在的报告工具。很难找到一个不使用或以某种方式与 `Excel` 交互的业务分析师。在本章中，我们将研究如何使用 `Excel`\
  \ 来扩展 `SQL` 的数据检索能力，以进一步处理数据并以 `SQL` 难以实现的格式呈现数据。\n\n### 回顾交叉表布局（Crosstab Layouts）\n\
  \n回到第 10 章，我们查看了使用 `PIVOT` 运算符创建交叉表格式输出的方法。在该章中，我们从如下 `SalesSummary` 表开始：\n\n![Image](img/199tab01.jpg)\n\
  \n使用 `PIVOT` 运算符，我们创建了如下交叉表格式的输出：\n\n![Image](img/200tab01.jpg)\n\n交叉表布局的关键特征是通道值的列显示。虽然数据按\
  \ `SalesDate`、`State` 和 `Channel` 分组，但在行中我们只看到 `SalesDate` 和 `State` 的组合。我们将两个通道值移动到了它们自己的列中：`Internet`\
  \ 和 `Retail`。\n\n这一切都很好，但产生交叉表格式的输出存在内在困难。正如第 10 章所示，产生上述输出的 `SQL` 语句为：\n\n点击此处查看代码图像\n\
  \n```\nSELECT * FROM\n\n(SELECT SalesDate, State, Channel, SalesAmount FROM SalesSummary)\
  \ AS mainquery\nPIVOT (SUM(SalesAmount) FOR Channel IN ([Internet], [Retail])) AS\
  \ pivotquery\n\nORDER BY SalesDate\n```\n\n注意在该 `SQL` 语句中，我们需要在语句中指定 `Channel` 列的值\
  \ `Internet` 和 `Retail`。换句话说，我们需要预先知道通道的所有可能值并将其放入语句中，以便为它们创建列。从实际操作来看，这是一个笨拙的解决方案。在这个简单的示例中，只有两个通道值，看起来并不那么困难。但在现实世界中，我们很容易遇到列可能有几十个潜在值的情况，而我们无法预先知道这些值是什么。\n\
  \n\n\n\n出于这个原因，`PIVOT` 关键字在实践中很少使用。一种简单得多且强大的解决方案是依赖报表软件自动生成交叉表（crosstab）格式的报告。大多数报告工具都提供某种形式的交叉功能。在\
  \ Microsoft Excel 中，这是通过透视表实现的。其他报告工具提供类似的功能，但名称不同。例如，Microsoft Reporting Services\
  \ 提供了 `Matrix Report`（矩阵报告），允许用户以交叉表格式列出数据。在 SAP Crystal Reports 中，交叉表报告类型被称为 `Cross-Tab`。\n\
  \n有趣的是，Reporting Services 等报告工具中的报表布局独立于用于检索数据的底层 SQL 查询。例如，在 Reporting Services\
  \ 中，你可以从一个不带 `GROUP BY` 子句的简单 SQL 查询开始，并将其放在 `Table Report`（表格报告）或 `Matrix Report`（矩阵报告）中。如果放在\
  \ `Table Report` 中，输出将是简单的数据列表。如果放在 `Matrix Report` 中，数据可以组织成行和列，然后报告将自动执行所有所需的分组并生成任何需要的列。\n\
  \n### Excel 和外部数据\n\n在本章中，我们将关注 Microsoft Excel 透视表，因为该软件应用广泛，且产生的结果与 Reporting\
  \ Services 以及其他专业报告工具类似。然而，在检查 Excel 透视表的功能之前，我们需要暂时离题一下在 Excel 中连接数据的某些可能性。由于 Excel\
  \ 在商业世界无处不在，大多数查询和报告工具都提供了将数据从其工具直接导出到 Excel 的机制。在使用 SQL 查询工具时，你通常只需要使用 `Export\
  \ to Excel`（导出到 Excel）选项将数据移动到 Excel 中。\n\n在 Excel 内部从外部源导入数据也有多种选项。我们将关注从关系型数据库获取数据，但我们也会顺带提到\
  \ Excel 也可以从文本文件中导入数据并直接连接到 OLAP 数据库。文本文件通常通过向导直接导入 Excel 工作簿中，该向导允许用户指定文本文件的布局、使用什么类型分隔符、每列的属性等。Excel\
  \ 还提供了直接连接到 OLAP 数据库（有时称为立方体）的能力。\n\n\n\n\n![Image](img/20fig06.jpg)\n\n### 图 20.6\
  \ 带有透视表字段列表的透视表\n\n此时，我们看到一个空的透视表和一个 `PivotTable` 列表，该列表显示了可以移入透视表的可用字段。将数据移动到透视表简单的方法是从列表中将字段拖到字段列表中透视表四个区域之一：`Filters`（筛选）、`Rows`（行）、`Columns`（列）或\
  \ `Values`（值）。让我们首先将 `Customer State`（客户州）移动到 `Filters`区域，将 `Sales Month`（销售月份）移动到\
  \ `Rows`区域，将 `Product Category`（产品类别）移动到 `Columns`区域，并将 `Total Sales`（销售总额）移动到 `Values`区域。结果如图\
  \ 20.7 所示。\n\n![Image](img/20fig07.jpg)\n\n### 图 20.7 四区域都包含字段的透视表\n\n让我们看看数据发生了什么变化。透视表会汇总连接到该透视表的所有详细数据。透视表显示的行和列数取决于显示这些数据所需的数量。数据以交叉表显示，其中\
  \ `Rows` 或 `Columns` 区域包含字段，而定量值在 `Values` 区域中进行汇总。`Filter` 区域可用于对透视表中的所有内容应用筛选。在示例中，我们将\
  \ `Customer State` 放置在了 `Filters` 区域，但尚未对该州应用任何筛选。\n\n当字段移动到四个区域的任何一个区域时，透视表会立即更新为与新布局相应的对应值。这是一个高度交互的设备，允许你随心所欲地操作数据。\n\
  \n与 SQL 语句不同，你不需要在透视表中指定分组。Excel 假设你想对放置在 `Rows` 或 `Columns` 区域的任何字段分组。在这个示例中，透视表已根据\
  \ `Sales Month` 和 `Product Category` 对所有数据进行了分组。因此，我们看到 2017 年 2 月的 `Tea`（茶叶）销售额总计为\
  \ 86。系统会自动添加 `Grand Total`（总计）行和列，尽管这些 `Grand Totals` 也可以很容易地关闭。\n\n如果我们想以稍微不同的方式对数据或修改演示，可以轻松实现。在下一次迭代中，我们将把\
  \ `Sales Month` 移动到 `Columns` 区域，将 `Product Category` 移动到 `Rows`，在 `Rows` 区域添加 `Product`（产品），并调整\
  \ `Customer State` 筛选器以仅选择来自伊利诺州（IL）和田纳西州（TN）的数据。结果数据如图 20.8 所示。\n\n![Image](img/20fig08.jpg)\n\
  \n### 图 20.8 应用了筛选的重新排列透视表\n\n注意，我们现在行区域看到了字段的层级结构。在每个产品类别中，我们看到了属于该类的各种产品。`Sales\
  \ Month` 值现在被分成了不同的列。由于我们按州应用了筛选，现在看到的 `Grand Total` 销售额仅为 75 美元，而不是之前的 321 美元。\n\
  \n除了允许汇总值外，透视表还允许其他选项，例如计数、平均值等。然而，请理解，只有可汇总的定量值才能放置在透视表的 `Values` 区域。从这个意义上说，透视表是\
  \ 19 章中讨论的星型架构维度设计的密切亲戚。维度数据可以放在 `Rows`、`Columns` 或 `Filters` 区域，而可汇总的数量属于 `Values`\
  \ 区域。透视表的 `Values` 区域类似于星型架构设计中事实表（Fact table）中的数据。\n\n除了允许你在透视表的区域之间随心所欲移动字段外，Excel\
  \ 还提供了一些有趣的报告布局（Report Layout）选项。透视表有三种基本的布局选项：\n\n*   紧凑形式（Compact Form）\n*   大纲形式（Outline\
  \ Form）\n*   表格形式（Tabular Form）\n\n选中透视表时，这些选项出现在功能带的 `Design`（设计）选项卡下。图 20.7 和\
  \ 20.8 中的布局是紧凑形式。将图 20.8 的布局切换为大纲形式后，透视表看起来如图 20.9 所示。\n\n![Image](img/20fig09.jpg)\n\
  \n### 图 20.9 大纲形式的透视表\n\n在大纲形式中，我们现在看到单独的列中的 `Product Category` 和 `Product`，标题区域的每个字段都有标签。这种格式清晰地列出了显示中的所有字段名称。\n\
  \n透视表还有许多其他有用功能，但我们将说明的最后一个优点是能够从透视表上的汇总值钻取回原始数据。这被称为 `drillthrough`（下钻）。在例示例中，我们将双击值为\
  \ 40 的单元格，该值显示为 2017 年 3 月份销售额的 `Grand Total`。当我们这样做时，会出现一个新工作表，看起来像图 20.10 所示。\n\
  \n![Image](img/20fig10.jpg)\n\n### 图 20.10 钻取结果\n\n此数据表显示了计算透视表中 40 之值的详细数据。表中显示了三行，代表我们之前在图\
  \ 20.5 中看到的三个行。如果我们对 `Total Sales` 列求和，就可以验证 2015 年 3 月的 `Total Sales` 确实是 40。\n\
  \n### 展望\n\n本章研究了报告工具汇总数据的方法，这些方法仅通过 SQL 语句很难实现。Excel 中的透视表使用了交叉表的基本概念并扩展了额外的灵活性功能。通过意识到报告和分析工具，SQL\
  \ 开发人员可以专注于检索数据，让终端用户处理更多的显示问题。\n\n如果你还没有这样做，可能想查看附录 A、B 和 C，获取 SQL Server、MySQL\
  \ 或 Oracle 的提示。这些附录提供了安装免费数据库的说明，还提供了有关如何使用软件执行 SQL 命令的基本信息。\n\n\n\n\n\n# 安装 SQL\
  \ Server 2016 Express\n\n安装 SQL Server 2016 Express 的步骤如下。\n\n1. 访问 [microsoft.com/en-us/server-cloud/products/sql-server-editions](http://microsoft.com/en-us/server-cloud/products/sql-server-editions)。\n\
  2. 在 `EXPRESS` 下，选择 `DOWNLOAD`。\n3. 登录您的 Microsoft 账户。如果没有账户，请创建一个。\n4. 选择您的语言，然后点击\
  \ `DOWNLOAD`。\n5. 下载完成后，运行已下载的文件。接受建议的下载位置，然后点击 `OK`。\n6. 选择安装类型 `BASIC`。\n7. 选择\
  \ `ACCEPT` 以接受许可条款。\n8. 接受安装位置并点击 `NEXT`。\n9. 下载完成后，安装将自动开始。\n10. 安装完成后，选择 `CLOSE`。\n\
  \n完成此操作后，您将安装 SQL Server 2016 安装中心（Installation Center）。\n\n# 安装 SQL Server 2016\
  \ Management Studio Express\n\n安装 SQL Server 2016 Management Studio Express 的步骤如下：\n\
  \n1. 打开随 SQL Server 2016 Express 安装的 `SQL SERVER 2016 INSTALLATION CENTER` 。\n2.\
  \ 在左窗格中选择 `INSTALLATION`，然后选择 `INSTALL SQL SERVER MANAGEMENT TOOLS`。\n3. 选择 `DOWNLOAD\
  \ SQL SERVER MANAGEMENT STUDIO (SSMS)`。\n4. 下载完成后，点击 `RUN` 然后点击 `INSTALL`。\n5. 安装完成后，点击\
  \ `CLOSE`。\n\n完成此操作后，您将安装多个新的软件程序，包括 SQL Server 2016 Management Studio。\n\n# 使用\
  \ SQL Server 2016 Management Studio Express\n\n当您打开 SQL Server 2016 Management Studio\
  \ 应用程序时，首先会看到一个 `Connect to Server`窗口。此窗口允许您与已安装的 SQL Server 2016 Express 实例建立连接。\n\
  \n`Server Name` 将显示您安装的 `SQLEXPRESS` 实例，`Authentication` 将显示 `Windows Authentication`。`Server\
  \ Type` 为 `Database Engine`。\n\n点击 `CONNECT` 按钮。\n\n连接后，您需要创建一个数据库进行操作。要执行此操作，请在窗口左侧找到\
  \ `Object Explorer` 格，右键点击 `DATABASES` 行，然后选择 `NEW DATABASE`。在 `New Database` 窗口中，在\
  \ `Database Name` 框中输入名称（例如，`FirstDatabase`）。点击 `OK` 按钮。现在您将会在 `Databases` 下看到您的新数据库。\n\
  \n要执行任何所需的 SQL 代码，突出显示您的数据库，然后点击 `NEW QUERY` 按钮。将打开一个新的查询窗口。您可以输入任何 SQL 代码，然后点击\
  \ `EXECUTE` 按钮。如果您在查询窗口中输入了多条 SQL 语句，可以突出显示任意数量的单独语句并仅执行突出显示的部分。查询执行后，结果将显示在 `Results`\
  \ 格或 `Message` 格中。如果有数据要显示，它将出现在 `Results` 格中；否则，状态消息将出现在 `Message` 格中。\n\n# B.\
  \ 开始使用 MySQL\n\n以下描述了在 Windows 或 Mac 计算机上安装 MySQL 免费版的的程序。请注意，该程序可能取决于您的计算机上已安装的内容。主要有两个软件部分需要安装：\n\
  \n1. 安装 `MySQL Community Server`。\n2. 安装 `MySQL Workbench`，版本 5.2 或更高版本。\n\n`MySQL\
  \ Community Server` 允许您创建数据库。`MySQL Workbench` 是一个图形界面，允许您发布 SQL 命令以与服务器以及您创建的任何进行交互。在本文编写时，`MySQL\
  \ Community Server` 版本为 5.7。`MySQL Workbench` 版本为 6.3。\n\n### 在 Windows 上安装 MySQL\n\
  \n此程序将在 Windows 计算机上安装 `MySQL Community Server` 和 `MySQL Workbench`。\n\n安装步骤如下：\n\
  \n1. 访问 [dev.mysql.com/downloads](http://dev.mysql.com/downloads)。\n2. 在 `MySQL\
