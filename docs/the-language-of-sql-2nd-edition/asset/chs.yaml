  \ `JUST START MY DOWNLOAD`。下载完成后，选择 `RUN` 按钮。安装向导将启动。\n5. 在 `License Agreement`\
  \ 格中，接受条款并点击 `NEXT`。\n6. 在 `Choosing a Setup Type` 格中，选择 `DEVELOPER DEFAULT` 选项，然后点击\
  \ `NEXT`。这将同时安装 `MySQL Server` 和 `MySQL Workbench`。点击 `NEXT`。\n7. 如果出现 `Check Requirements`\
  \ 格，它可能会注明为了满足要求需要额外安装的内容。点击 `EXECUTE` 安装缺失的软件。当任何缺失软件安装完成后，点击 `NEXT`。\n8. 在 `Installation`\
  \ 格中，点击 `EXECUTE`。当所有软件安装完成后，点击 `NEXT`。\n9. 在 `Product Configuration` 格中，点击 `NEXT`。\n\
  10. 在 `Type and Networking` 格中，接受所有默认值并点击 `NEXT`。\n11. 在 `Accounts and Roles` 格中，输入密码，然后点击\
  \ `NEXT`。\n12. 在 `Windows Service` 格中，接受所有默认值并点击 `NEXT`。\n13. 在 `Plugins and Extensions`\
  \ 格中，接受所有默认值并点击 `NEXT`。\n14. 在 `Service Configuration` 格中，点击 `EXECUTE`。配置完成后，点击\
  \ `NEXT`。\n15. 在 `Product Configuration` 格中，点击 `NEXT`。\n16. 在 `Connect to Server`\
  \ 窗口中，点击 `CHECK` 验证用户密码，然后点击 `NEXT`。\n17. 在 `Apply Configuration` 格中，点击 `EXECUTE`。配置完成后，点击\
  \ `NEXT`。\n18. 在 `Product Configuration` 格中，点击 `NEXT`。\n19. 在 `Installation Complete`\
  \ 格中，点击 `FINISH`。\n\n完成上述操作，您将拥有 `MySQL Community Server` 和 `MySQL Workbench`。\n\
  \n### 在 Mac 上安装 MySQL\n\n此程序将在 Mac 计算机上安装 `MySQL Community Server` 和 `MySQL Workbench`。\n\
  \n1. 访问 [dev.mysql.com/downloads](http://dev.mysql.com/downloads)。\n2. 在 `MySQL\
  \ Community Server` 标题下，点击 `DOWNLOAD`。\n3. 选择 `MAC OS X` 平台，点击 `DMG ARCHIVE` 旁的\
  \ `DOWNLOAD` 按钮。\n4. 如果需要，登录 Oracle 网页账户或创建一个新账户。否则，点击 `JUST START MY DOWNLOAD`。下载完成后，打开下载的\
  \ `DMG` 文件，然后打开它创建的 `PKG` 文件。`MySQL Server` 的安装向导将启动。在 `Introduction` 格中，点击 `CONTINUE`。\n\
  5. 在 `License` 格中，点击 `CONTINUE`，然后点击 `AGREE`。\n6. 在 `Installation Type` 格中，点击 `INSTALL`。记下给您的临时密码。\n\
  7. 在 `Summary` 格中，您将看到安装完成的消息。`MySQL Server` 现在已安装。点击 `Close`。如果需要，可以通过选择 Mac 系统偏好设置中的\
  \ `MySQL` 图标随时停止或重启此服务。\n8. 返回 [dev.mysql.com/downloads](http://dev.mysql.com/downloads)。\n\
  9. 在 `MySQL Workbench` 标题下，点击 `DOWNLOAD`。\n10. 选择 `MAC OS X` 平台，然后点击 `DMG ARCHIVE`\
  \ 旁的 `DOWNLOAD` 按钮。再次点击开始下载。下载完成后，打开下载的 `DMG` 文件。在弹出的窗口中，将 `MySQLWorkbench.app`\
  \ 图标拖入 `Applications` 文件夹。等待拷贝完成。\n11. 打开 Mac 系统偏好设置并点击 `MySQL` 图标。如果 `MySQL Server`\
  \ 尚未运行，点击按钮启动它。\n\n### 使用 MySQL Workbench\n\n当您在初始安装首次打开 `MySQL Workbench` 时，您需要与已安装的\
  \ `MySQL Server` 实例建立连接。\n\n要创建连接，选择 `Database` 菜单下的 `Connect to Database`。在 `Stored\
  \ Connection` 下拉菜单中，选择您安装的实例，然后输入您之前为用户创建的密码。\n\n\n\n\n\n创建连接后，您需要创建一个数据库进行操作。要执行此操作，点击菜单栏下方显示\
  \ `CREATE A NEW SCHEMA IN THE CONNECTED SERVER` 的图标。输入所需的数据库名称，然后点击 `APPLY`。这将生成一个创建新模式的脚本。点击\
  \ `APPLY` 运行该脚本。随后，您将会在导航器（Navigator）面板的模式列表中看到您的新数据库。此时，您应该返回到数据库（Database）菜单下的\
  \ `Manage Connections`（管理连接），并将您刚刚创建的数据库设置为默认模式。之后，您可以突出该数据库并创建一个新查询，以对该数据库运行任何所需的\
  \ SQL 语句。\n\n在查询（Query）窗格中输入 SQL 语句后，点击看起来像闪电的 `EXECUTE`（执行）按钮。如果您在窗口中输入了多个语句，可以突出显示其中一个语句并仅执行高亮部分。\n\
  \n查询执行后，结果将显示在 `Output`（输出）或 `Result`（结果）窗格下。如果有数据需要显示，将出现在 `Result` 窗格中；否则，`Output`\
  \ 窗格将显示一条状态消息。\n\n# C. 开始使用 Oracle\n\n以下说明了在运行 Windows 的计算机上安装免费版 Oracle 的步骤。除了\
  \ Windows 外，该数据库还适用于 Linux，但不适用于 Mac。请注意，操作步骤可能会根据您的计算机上已安装的内容而异。安装只有一步：\n\n* 安装\
  \ Oracle Database Express Edition（Oracle 数据库快速版）。\n\n此安装将创建一个数据库，并提供一个基于 Web 的图形界面，允许您对数据库执行\
  \ SQL 命令。\n\n## 安装 Oracle Database Express Edition\n\n此过程将安装 Oracle Database Express\
  \ Edition。安装步骤如下：\n\n1. 访问 [oracle.com/database](http://oracle.com/database)。\n\
  2. 在 `DOWNLOADS`（下载）选项卡下，选择 `Oracle Database 11g Express Edition`。\n3. 接受许可协议，然后选择适用于您计算机的适当下载版本（例如\
  \ `Windows x64`、`Windows x32` 或 `Linux x64`）。\n4. 创建 `Oracle` 账户或使用现有账户登录。\n5. 下载完成后，点击\
  \ `OPEN`（打开）查看文件。\n6. 双击 `SETUP` 应用程序开始安装。\n7. 在安装向导的 `Welcome`（欢迎）面板上，点击 `NEXT`（下一步）。\n\
  8. 在 `License Agreement`（许可协议）面板上，接受条款，然后点击 `NEXT`。\n9. 在 `Choose Destination Location`（选择目标位置）面板上，接受默认位置并点击\
  \ `NEXT`。\n10. 在 `Specify Database Passwords`（指定数据库密码）面板上，输入密码，然后点击 `NEXT`。\n11.\
  \ 在 `Summary`（摘要）面板上，点击 `INSTALL`（安装）。\n12. 安装完成后，点击 `FINISH`（完成）。\n\n完成这些步骤后，在\
  \ Windows 开始菜单的 `Oracle Database 11g Express Edition` 目录下将安装好软件，您可以通过 Web 界面访问各种功能。您在该目录下使用的主要程序是\
  \ `Get Started`（开始使用）。\n\n## 使用 Oracle Database Express Edition\n\n要访问 Oracle 数据库，请运行开始菜单中\
  \ `Oracle Database 11g Express Edition` 目录下的 `GET STARTED` 程序。这将打开一个基于 Web 的应用程序，允许您与数据库进行交互。如果出现未找到\
  \ URL 的错误消息，请检查安装 Oracle 目录中 `Get_Started` 文件中的 URL 属性，并访问到该 URL。\n\n点击 `APPLICATION\
  \ EXPRESS` 按钮。\n\n登录时，输入用户名 `SYSTEM`，输入在安装期间指定的密码，然后点击 `LOGIN`（登录）按钮。\n\n在 `CREATE\
  \ APPLICATION EXPRESS WORKSPACE`（创建 Application Express 工作空间）页面上，输入数据库用户名和密码。`Application\
  \ Express Username`（Application Express 用户名）应为 `SYSTEM`。\n\n然后登录您创建的新工作空间。\n\n您将看到四个代表不同功能的图标：`Application\
  \ Builder`（应用生成）、`SQL Workshop`（SQL 工作室）、`Team Development`（团队开发）和 `Administration`（管理）。要执行\
  \ SQL，点击 `SQL Workshop` 图标。\n\n随后您将看到五个图标：`Object Browser`（对象浏览器）、`SQL Commands`（SQL\
  \ 命令）、`SQL Scripts`（SQL 脚本）、`Query Builder`（查询生成）和 `Utilities`（工具）。\n\n要执行单个 SQL\
  \ 语句，可以使用 `SQL Commands` 图标。这将允许您执行单个命令并查看结果。如果您输入了多个 SQL 语句，可以突出显示其中一个语句并仅执行高亮部分。要在\
  \ `SQL Commands` 窗口中执行 SQL 语句，请点击 `RUN`（运行）按钮。\n\n如果您想执行多个 SQL 语句但不需要查看输出，可以使用 `SQL\
  \ Scripts` 图标。选择此图标后，您可以创建新脚本或编辑现有脚本。要创建新脚本，点击 `CREATE`（创建）按钮，然后命名脚本并输入您要在脚本中编写语句。要执行，点击\
  \ `RUN` 按钮。在输入请求后，系统会要求确认运行。再次点击 `RUN` 按钮。随后可以通过点击 `VIEW RESULTS`（查看结果）列下的图标查看脚本执行的摘要。\n\
