  \ SQL 交叉查询的接触使人们能够更好地理解透视表的价值，透视表将在书的最后介绍。\n\n- **对排名函数的涵盖**\n我们添加了关于排名函数的新材料。这一类重要的函数允许用户生成行号并计算百分比。一个相关能力是在应用排名函数之前将数据划分为分区。\n\
