    # 3. THE ROLLING HORIZON APPROACH


    The Rolling horizon approach is iterative, and at each iteration, fixing one week
    schedule obtained by solving a robust MILP. We first present the rolling horizon
    framework. Then we present the deterministic model and an adaptation of this formulation
    to obtain a robust MILP solutions more resistant to the fluctuations of the demands.


    # 3.1 Rolling horizon framework


    We propose to use a rolling horizon approach in which the surgeries are not fixed
    during the consultation, but instead define a date for the day of the surgeries,
    and are added to a waiting list. At the end of each week $t$, the new waiting
    list is generated starting from week $t+3$. We make 3 weeks as that patients have
    enough time to prepare and organize their hospitalization. In the schedule obtained,
    only week $t$ is kept, and the surgeries scheduled after are put back in the waiting
    list (see Figure 1).


