    problem that is not treated in the literature. We integrate our model in a rolling
    horizon approach to handle the dynamic version of the problem. We show that the
    obtained schedules can reduce the number of scheduled surgeries, and significantly
    improve those operationally implemented in overtime and reduce stresses on the
    surgical team.


