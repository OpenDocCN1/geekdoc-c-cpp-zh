    # 1. 引言


    手术室是医院收入的主要来源：它们创造了医院收入的三之二 (Jackson 2002)，并占医院成本的约 40% (Macario et al 1995)，主要通过设施的使用（手术室、重症监护床）以及人员成本（外科医生、麻醉师和技术人员）。针对这些问题，许多研究人员研究了择期性（正常）和非择期（紧急）背景下的调度问题
    (Zhu et al (2018))。


    该问题背后的主要因素是手术调度中的不确定性。由于在计算中使用历史数据相当有限，手术的估计时长与实际持续时间之间仍然存在巨大差异。为此，需要提出一种有效的方法来确保调度的可行性并获得实际的性能提升（在加班和设备可用性方面），同时确保调度费率的能力不受负面影响的影响。


    在本文中，我们考虑了昂日医院中心（Centre Hospitalier d''Angers, CHI），这是一个公立医院机构。该医院为该地区的多个城市服务并具有局限性。有效管理预约也非常重要。由于资源（人员、医疗器械）众多以及人口老龄化导致的需求增加，CHI
    目前实施的人工调度流程必须得到改进。我们检查了性能指标，如员工的加班小时数（平均每月约28 小时）和经过消毒的医疗器械，以遵循所提的方法。


    据我们所知，关于此类特定问题的文献和研究非常少。在 Beroule (2016) 中，作者使用了手术室调度，其中手术集合是预先知的。作者考虑了医疗设备的限制和资源数量的减少。Cardon
    (2009) 应用了分支定价法（branch-and-price）来解决日间中心的调度问题，其中日期是固定的，他们试图寻找最佳限制。他们的目标是最小化恢复小时数的使用、加班恢复以及各种患者和手术的价值，同时确保满足医疗条件。


