    # 考虑消毒约束的手术病例调度问题的滚动时界方法


    H. Al Hasan * C. Gueret ** D. Limineau ***


    +   * UCO, 44 Ru Rabelais, Angers 49000, France (邮箱: albasan@uco.fr)

    ** Univ Angels, LARS SFR Mathistic, Angers 49000, France (邮箱: e.jean@univ-angers.fr)

    *** IMT Atlantic, LS28, 4 Rue Alfred Kastler, Nantes (邮箱: david.leineau@imt-atlantic.fr)

    **** UCO, 44 Ru Rabelais, Angers 49000, France (邮箱: david.riviere@uco.fr).


    **摘要：** 在本文，我们设定了一个真实的调度问题，包括对一组随时间到达的手术病例进行调度，并考虑到持续时间的不确定性以及器械消毒的延迟。目标是尽可能多安排手术，并减少手术人员的加班时间以及消毒单元等待的器械数量。该研究是与法国的一所医院合作的，该医院还实验提供了历史数据。我们提出了一种基于迭代求解稳健混合线性规划模型的滚动时界方法，其中目标函数按字典顺序考虑。对真实数据的实验表明，加班时间减少了
    50% 以上，消毒单元的压力情况减少了约 87%。


