    在每次手术后，使用的器械包在 OSB（手术准备室）中浸泡 30 分钟。之后，它们可以被收集并发送到服务器。此类班车在固定时间计划，以收集和递送器械包。班车表按先进先出（FIFO）顺序准备。消毒后，它们通过班车被送回
    OSB 并可以再次使用。


