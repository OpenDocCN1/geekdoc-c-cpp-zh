    ## 5. 结论


    本文解决了法国某医院（CHU）骨科手术医院（OSB）的病例调度问题。我们提出了用于构建外科医生计划的建议方法，然后在 OSB 和消毒室（SU）中测试了该方法，SU
    负责 CHU 手术用所有医疗器械的消毒。这些时长包括：人员时间、未改变的术室（OR）占用率，以及消毒 SU 中所有器械的时间。我们在计划构建过程中提出了一种方法，以及一种基于稳健
    MILP 求解的滚动时界法，以便在外科医生之间进行更好的协调，并对手术不确定时长敏感的计划。我们在 CHU 提供的 10 个月界面上测试了该方法。实验显示加班减少了超过
    50%。


