    #  3. THE ROLLING HORIZON APPROACH


    The Rolling horizon approach is iterative, and at each iteration, fixing one week
    schedule obtained by solving a robust MILP. We first present the rolling horizon
    framework. Then we present the deterministic model and an adaptation of this formulation
    to obtain a robust MILP solutions more resistant to the fluctuations of the demands.


    #  3.1 Rolling horizon framework


    We propose to use a rolling horizon approach in which the surgeries are not fixed
    during the consultation, but instead define a date for the day of the surgeries,
    and are added to a waiting list. At the end of each week $t$, the new waiting
    list is generated starting from week $t+3$. We make 3 weeks as that patients have
    enough time to prepare and organize their hospitalization. In the schedule obtained,
    only week $t$ is kept, and the surgeries scheduled after are put back in the waiting
    list (see Figure 1).


    At the end of week $t$, the process follows as:


    +   (1) Add the surgeries consulted at the current week $t$ to the waiting list.


    ![](img/1aea60a3ac0fcf6e07a1360da85bf9d6_2_0.png)


    Fig.1. Rolling horizon scheme


    This procedure requires to estimate an horizon $H_s$ for each surgeon to handle
    all his/her surgeries of waiting list. The value of $H_s$ is calculated as the
    minimum number of shifts needed to cover the load $s$ (sum of the planned durations
    of his/her surgeries), plus 4 additional shifts. Each supplementary shift takes
    into account the fact that we can''t know the exact amount of shifts needed for
    each surgeon as surgeons some OR occasions because of limited quantities of times.


    At each iteration, the problem of scheduling all the surgeries in the waiting
    list from week $t+3$ is solved using a MILP. In this next, we present a formulation
    of the problem, assuming that the duration of surgeries is known with certainty.
    A robust version for the non-deterministic case will be proposed.


