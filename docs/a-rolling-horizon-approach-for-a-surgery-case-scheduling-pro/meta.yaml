    # A Rolling-Horizon Approach for a Surgery Case Scheduling Problem with Sterilizing
    Constraints


    H. Al Hasan * C. Gueret ** D. Limineau ***


    +   * UCO, 44 Ru Rabelais, Angers 49000, France (e-mail: albasan@uco.fr)

    ** Univ Angels, LARS SFR Mathistic, Angers 49000, France (e-mail: e.jean@univ-angers.fr)

    *** IMT Atlantic, LS28, 4 Rue Alfred Kastler, Nantes (e-mail: david.leineau@imt-atlantic.fr)

    **** UCO, 44 Ru Rabelais, Angers 49000, France (e-mail: david.riviere@uco.fr).


    **Abstract:** In this paper, we set a real scheduling problem which includes scheduling
    a set of surgical cases that arrive over time taking into account the uncertainties
    on their duration, and the delay to sterilize instruments. The objectives are
    to schedule as many surgeries as possible, and to minimize the overtime of the
    surgical staff and the number of instruments waiting in the sterilizing unit.
    This research was performed in collaboration with a Hospital in France, which
    has also provided historical data for the experiments. We propose a rolling horizon
    approach based on the iterative resolution of a robust mixed linear programming
    model, where the objective functions are taken into account in lexicographic order.
    The experiments on real data show a reduction of more than 50% of overtime, and
    around 87% less stress situations in sterilizing unit.


