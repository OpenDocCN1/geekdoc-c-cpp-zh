    *Keywords:* Operations Research; Surgical scheduling; Mixed-integer programming;
    Rolling horizon approach; Robust scheduling


    # 1. INTRODUCTION


    Operating rooms are the main source of income for hospitals: they generate two-thirds
    of hospital revenues (Jackson 2002), and for around 40% of hospital costs (Macario
    et al. 1995) through the use of facilities (operating rooms, intensive care beds,
    and the personnel costs (surgeons, anesthesiologists, and technicians). For these,
    a lot of researchers have studied the scheduling problems in both elective (normal)
    and non-elective (urgent) contexts (Zhu et al. (2018)).


    The main factor behind this problem, is the uncertainty when scheduling surgeries.
    Due to using somewhat limited historic data in their calculations, they still
    end up with a big difference between the estimated and actual duration of surgeries.
    For this, one needs to propose an effective approach to ensure feasible schedules
    and real performance gains (in terms of overtime and equipment availability) while
    ensuring the capacity of the rates of scheduling does not get affected by negative
    impacts.


    In this paper we consider the case of the Centre Hospitalier d''Angers (CHI),
    a public hospital service. This hospital serves multiple cities in the area and
    has limits. It is also very important to manage the appointments effectively.
    Due to the high number of resources (resources, medical instruments), and the
    increasing demand due to population aging, the current manual scheduling process
    implemented at the CHI must be improved. We examine the performance measures such
    as the number of staffs'' overtime hours (≈ 28 hours per month on average) and
    the medical instruments that are sterilized in order to respect the proposed method.


    To the best of our knowledge there are very few literature and research on such
    particular problem. In Beroule (2016) the authors used an operation room scheduling
    where the set of surgeries is known in advance. The authors included medical devices
    limits, the reduction of the number of resources. A branch-and-price approach
    is applied in Cardon (2009) to solve a scheduling problem in a day care center,
    where the dates are fixed and they try to find the best limits. Their objective
    is to minimize the use of recovery hours, the recovery of overtime and the value
    of various patients and procedures ensuring the medical conditions are met.


