    for the surgeries of the CHU. These durations are of: one for the staff, unchanged
    operating rooms (ORs) occupancy rate, one to sterilize all the instruments in
    SU. We have proposed a method in the schedule construction process and a rolling
    horizon approach based on a resolution of robust MILP in order to allow a better
