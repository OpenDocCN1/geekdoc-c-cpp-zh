  md: "# C# 1 Introduction to programming and the C# language Exception handling\n\
    \nAs mentioned, there are multiple exception types, actually many and most of\
    \ them are classes in the .NET Framework that manage a variety of exceptions.\
    \ The fundamental base class is called Exception, and belongs to the System namespace.\
    \ ApplicationException is a derived class, although a custom code may also raise\
    \ an Exception (and often do), it is the thought that the type of exception raised\
    \ by a custom method must be an ApplicationException or a type derived from it.\n\
    \nAs an example of exception handling in C#, I will use the generic class, defined\
    \ above. The class has a method Add(), and a method Remove(), both of which is\
    \ inappropriate. The problem is that for both methods it is possible they can't\
    \ perform the requested operation (an element can't be added to the set, if it\
    \ is already there, and an element can't be removed if it is not in the set),\
    \ and if it is the case happening. It is an unfortunate situation, since the user\
    \ does not receive a notification that the operation is not performed. The main\
    \ problem is that the two methods test whether the operation can be performed,\
