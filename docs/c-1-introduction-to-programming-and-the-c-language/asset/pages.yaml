  md: "# C# 1 Introduction to programming and the C# language\n\nNote in C#, every\
    \ statement ends with a semicolon – above, there is a semicolon after the WriteLine\
    \ statement. The compiler tells you when the statement ends.\n\nIn C# classes\
    \ are grouped in so-called namespaces. System is a namespace that contains many\
    \ classes including the Console. A class's full name consists of the namespace\
    \ where the class is grouped, and the name, for example System.Console. In a program\
    \ using a namespace and classes in this namespace can be referenced by the class\
    \ alone. Thus, one can write\n\n```\nConsole.WriteLine(\"Hello World\");\n```\n\
    \ninstead of the full name\n\n```\nSystem.Console.WriteLine(\"Hello World\");\n\
    ```\n\nVisual Studio automatically inserts 5 using statements in the code and\
    \ 5 namespaces. In this case, only the System namespace is needed, and you are\
    \ allowed to delete the 4 others (I have done that in the final version shown\
    \ initially of the chapter). In principle there is no particular reason to delete\
    \ unnecessary statements as they do not have any bearing on the final, so the\
    \ only reason to delete them is to make the code more readable.\n\n# Comment\n\
    \nVisual Studio will automatically place the program in its own namespace, here\
    \ called Exam01. If you wrote the program using a plain text editor, it is not\
    \ necessary to include this namespace. Actually the program can be written simpler\
    \ than the above. The following version of the program is written in Notepad and\
    \ saved as a file named Hello.cs.\n\n```\nclass Program\n{\n    static void Main()\n\
    \    {\n        System.Console.WriteLine(\"Hello World\");\n    }\n}\n```\n\n\
    If you open a .NET program, the program can be translated with the command\n\n\
    ```\ncsc Hello.cs\n```\n\nand forming an executable file that can be tested. All\
    \ program examples in this book is written in Visual Studio, since the gain from\
    \ bigger programs is considerable – in fact it is the only reasonable tool for\
    \ developing .NET applications."
