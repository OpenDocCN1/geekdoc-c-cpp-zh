  md: '# C# 1 Introduction to programming and the C# language


    # Explanation


    The method starts to declare and initialize some variables. The type double has
    two constants, and MaxValue and MinValue are respectively the largest and smallest
    occurring numbers of the type double. This means that the variable min is initialized
    with a value that is too large, while the variable max is initialized with the
    value that is too small. This is followed by a while loop. Here you must particularly
    note the condition:


    ```

    while ((number = Enter()) != 0)

    ```


    Enter() is the same input method, which I have previously looked at. It returns
    a double, which is stored in the variable number. The value of the assignment
    is the value of the variable number after the method Enter() is executed, and
    it is this value that is compared with 0. Note that it is necessary with parentheses
    around the assignment, as the comparison operator != has higher precedence than
    the assignment. The result is that the while loop is repeated until the user enters
    0.


    Inside the while loop is what happens:


    +   - the entered number is added to the sum

    - the counter count is incremented by 1

    - if the entered number is a new smallest number (less than that which was before
    the smallest), the variable min is changed

    - if the entered number is a new largest numbers (greater than that which was
    before the largest), the variable max is changed


    After the loop is completed, the Print() method are called to print the result.
    Here it is tested whether the variable count is greater than 0 to ensure that
    the program will not divide by 0.'
