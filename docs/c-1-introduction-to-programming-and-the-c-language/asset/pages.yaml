  md: '# C# 1 Introduction to programming and the C# language


    An array as above is a 1-dimensional array. One can also work with arrays of multiple
    dimensions. For example is a 2-dimensional array organized into rows and columns,
    and each element can be referenced by the array name and an index pair. You can
    define a two-dimensional array of elements of the type int having 4 rows and five
    columns in the following manner:


    ```

    int[,] t = new int[4, 5];

    t[2, 3] = 43;

    ```


    This can be illustrated in the figure below. Note that as with a 1-dimensional
    array indices starts with 0 – for both rows and columns.


    | 0 | 1 | 2 | 3 | 4 |

    |---|---|---|---|--|

    | 0 | | | | | |

    | 1 | | | | | |

    | 2 | | | 43 | | |

    | 3 | | | | | |


    It is seldom you are using arrays with more than two dimensions, but there is
    no upper limit to the number of dimensions, but for us humans it is difficult
    to give the array a geometric interpretation. For example you can define a 3-dimensional
    array as:


