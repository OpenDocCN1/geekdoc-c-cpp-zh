  md: '# C# 1 Introduction to programming and the C# language


    Variables of types such as int, double, bool, char, etc. are called variables
    of simple types. For a running program is allocated a stack, that is a memory
    area used by the application to store variables. The stack is very effective so
    it is very effective to program continuously setting up and removal of variables
    if necessary. This is known as a stack, because one can think of a stack as a
    data structure illustrated in the following manner:


    ![](img/f84352ec481fd05dc2bc853aa8989838_70_0.png)


    When the program creates a new variable, it happens at the top of the stack -
    where the arrow points, and when a variable is removed, it is the one that lies
    at the top of the stack. All of the simple data types have the property a variable
    always have the same size. For example fills an int have regardless of what value
    it has. Therefore, variables are stored directly on the stack, because the compiler
    knows how much they fill. If, for example you write as follows


    ```

    int a = 23;

    ```


    then there will on the stack be created a variable of the type int with the space
    that an int requires and the value 23 are stored there. Variables that are stored
    directly on the stack in this way are called value types, and all the built-in
    types except string are value types.


    Things are different with variables of reference types such as variables that
    have a class type. They must be explicitly created with new. For example you have
    a class named Coin (see below) and you want to create an object, you must write


    ```

    Coin c = new Coin();

    ```


    It looks like, how to create a simple variable. The variable is named c. When
    new are performed what happens is on the so-called heap there create an object
    on the base of the type Coin. One can think of the heap as a memory pool from
    which the machine can allocate memory as needed. The stack is created as usual,
    a variable with the type of Coin, but what is saved on the stack, is not the value
    of the Coin object, but instead a reference to the object on the heap. All references
    have the same size regardless of the type and can be forever stored on the stack.
    When we call it a reference type. How exactly one object is created on the heap
    is determined by a so-called heap manager, there is a program that constantly
    runs and manages the heap. It is also the heap manager, which automatically removes
    an object when there is no longer needed.


