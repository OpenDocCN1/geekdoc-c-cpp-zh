  md: '# 31 Object serialization


    Object serialization is the process by which the state of an object is converted
    into a sequence of bytes, and thus as data that can be sent to a stream, such
    as a file or over a communication line. It is possible to serialize arbitrary
    objects to a stream, and for that we can again read a serialized object, it is
    necessary together with the serialization of the object''s data to also store
    information about the type. When you read a serialized object, it is call to deserialize
    the object.


    Seen from the programmer is serialization and deserialization of objects simple
    and one should not write much, but if you think a little about it it is a relatively
    complex process. An object is defined on the basis of a class and can contain
    simple variables, arrays and references to other objects, and not only that, so
    the class can also inherit variables from a base class. When an object must be
    serializable, these elements are saved with all the information needed to build
    the structure when the object is deserialized. The conclusion is that although
    the following examples show how simple to serialize, there are going a lot behind,
    which is handled by the classes that underlie serialisation.


