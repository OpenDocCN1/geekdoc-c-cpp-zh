  md: '# 27 Dictionary<K,V> and SortedDictionary<K,V>


    A dictionary is a collection where each element is identified by a key. Therefore,
    also sometimes refers to a dictionary as a collection of key / value pairs, where
    each value is identified by a key. You could compare a dictionary with a list,
    because in a list, the elements are identified by an index. When you have to find
    an item in the list, you do not search for the item, but its position is calculated
    from the index. In the same way it is with a dictionary, when you do need to find
    an item, then one calculates the element’s position based on the key value – you
    do not search for the item. The following figure can be used to illustrate some
    of the technique, which stores key / value pair as zip code and city:


    | | | |

    |---|---|---|

    | 0 | 9500 | Hobro |

    | 1 | | |

    | 2 | 9492 | Blokhus |

    | 3 | 8883 | Gjern |

    | 4 | | |

    | 5 | 8765 | Klovborg |

    | 6 | | |

    | 7 | | |

    | 8 | 1808 | Frederiksberg |

    | 9 | | |


    There needs a function that convert a zip code to a place in the container. Such
    a function is usually called a hash, and instead of a dictionary you often refer
    to the structure as a hash table. In this case, the hash function should be simple,
    and consists simply in taking the last digit. For example are (9492, Blokhus)
    stored at position 2, since the zip code ends with 2. Similarly (8765, Klovborg)
    are stored on position 5, and (8883, Gjern) are stored on position 3.


    The above is very simplistic, but it illustrates two fundamental problems:


    +   * What to do if the structure is filled out and needs to be expanded – above,
    there’s only for 10 elements.

    * What to do if there will be a collision – with the ave hash function, (8543,
    Hornlet) are stored in the same place as Gjern.


