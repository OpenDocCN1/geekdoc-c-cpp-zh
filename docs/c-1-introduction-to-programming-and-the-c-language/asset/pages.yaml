  md: '# 25 Stack<T> and Queue<T>


    A stack is a collection which has two basic operations


    +   - one can put an item on the stack, an operation that is called push

    - one can remove the element that was last placed on the stack, an operation that
    is called pop


    For variables, I have several times mentioned the program stack. This is an example
    of a data structure that is a stack. You also sometimes call the data structure
    a LIFO (Last In First Out) structure, corresponding to that there only is access
    to the element that are last put on the stack. One typical of the structure as
    a container where you can place an element at the top, where the arrow is pointing
    and where you can only remove the item that the arrow is pointing at – it stacks
    elements on top of each other and hence the name.


    | |

    |---||

    | 7 |

    | 5 |

    | 3 |

    | 2 |


    A concrete implementation of the type and that includes the type Stack<T> in C#,
    will also define other methods. For example a method to refer to the element at
    the top of the stack without removing it, and a method in order to test whether
    the stack is empty.'
