  md: "# C# Introduction to programming and the C# language\n\n```\nprivate void Expand()\n\
    {\n    T[] temp = new T[2 * elems.Length];\n    for (int i = 0; i < count; i++)\
    \ temp[i] = elems[i];\n    elems = temp;\n}\n```\n\n# Explanation\n\nfirst, that\
    \ the interface is generic, and that an interface in the same manner as a class\
    \ can be defined generic. There is not much to explain about it, apart from that\
    \ anyone use the parameter type T as if it were a concrete type.\n\nThe implementation\
    \ has only a default constructor, which creates an empty set. In addition, the\
    \ Add() methods that test the item is not added twice, and if the item is already\
    \ there, nothing happens. The same applies to Remove(), if you try to delete an\
    \ element not found in the set, the operation is just ignored. One can discuss\
    \ these choices and you could have chosen a solution where the user is in one\
    \ or another (for example a return value) could be notified if the operation was\
    \ not performed correctly. The goal with my implementation is to make the code\
    \ simple and easy to read, but it is not very efficient algorithms.\n\nThe type\
    \ is generic, parameterized by the type T, and a set can then contain elements\
    \ of the type T. There are no requirements of the type parameter - there is no\
    \ where. That is that the type Set<T> can be used for all types of objects. However,\
    \ the method IndexOf(), which is a private method that finds the location of a\
    \ particular element in the array. It uses the method Equals() to compare elements.\
    \ That means if everything works as intended, the parameter type T must implement\
    \ the method Equals() with semantic meaning.\n\nMost of the code is directly out\
    \ of the road, but there is one thing that you should note. The type is implemented\
    \ by an array, as the container contains the elements of the set. When a set is\
    \ created, allocated space for 10 elements, which seem rather arbitrary, but this\
    \ is also what it is and the question is what would happen if you try to add more\
    \ than 10 elements to the set. Here used a principle where the capacity is doubled\
    \ if you try to add elements beyond the current capacity. It consists in create\
    \ an array of double size, and copy the old array to the new. It is handled by\
    \ the method Expand(), which possibly be called from the Add() method. It is a\
    \ simple implementation which means that a set in principle has no upper limit\
    \ on the number of elements - and which is also used by the collection classes."
