  md: "# C# Introduction to programming and the C# language\n\n```\n{\n    int[] v\
    \ = { 23, 17, 17, 19, 29, 2, 11, 5, 3, 13 };\n    Print(v);\n    Sort(v);\n  \
    \  Print(v);\n}\n\nstatic void Sort<T>(T[] arr) where T : IComparable<T>\n{\n\
    \    Stack<T> s1 = new Stack<T>();\n    Stack<T> s2 = new Stack<T>();\n    foreach\
    \ (T t in arr)\n    {\n        while (s1.Count > 0 && s1.Peek().CompareTo(t) >\
    \ 0)\n            s2.Push(s1.Pop());\n        while (s2.Count > 0 && s2.Peek().CompareTo(t)\
    \ < 0)\n            s1.Push(s2.Pop());\n        s1.Push(t);\n    }\n\n    for\
    \ (int i = 0; i < arr.Length; i++)\n        arr[i] = s1.Pop();\n}\n\nstatic void\
    \ Print<T>(T[] arr)\n{\n    Console.Write(arr[0]);\n    for (int i = 1; i < arr.Length;\
    \ i++) Console.Write(\" \" + arr[i]);\n    Console.WriteLine();\n}\n```\n\nThe\
    \ algorithm is implemented by Sort(). You should note that it is a generic method\
    \ and that the parameter type is IComparable. It is necessary that the elements\
    \ can be compared. Note that the class Stack has a Count property that indicates\
    \ the number of elements on the stack. All collection classes have this property.\
    \ In this example the Count property is used to investigate whether the stack\
    \ is empty. A stack has a method which is called Peek(). It is used to refer to\
    \ the element, which is located at the top of the stack, but without removing\
