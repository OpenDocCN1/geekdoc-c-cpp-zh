  md: "# C# Introduction to programming and the C# language The class Object\n\nit\
    \ will write False on the screen, and it was not what one would expect. The two\
    \ objects z1 and z2 have the same value, but they are two different objects, each\
    \ of which refers to their object on the heap. The method Equals() as defined\
    \ in the class Object, compares the object references, and as z1 and z2 are two\
    \ different objects Equals() returns false, even if the two objects have the same\
    \ value. It will be otherwise, it is up to the programmer to override the method\
    \ Equals(), so it compares the values rather than references. If you want to override\
    \ Equals() in the class ZipCode you can do the following:\n\n```\npublic override\
    \ bool Equals(object obj)\n{\n    if (obj is ZipCode)\n    {\n        ZipCode\
    \ z = (ZipCode)obj;\n        return code.Equals(z.code) && name.Equals(z.name);\n\
    \    }\n    return false;\n}\n```\n\nNote first is the operator that must use\
    \ to test whether an object has a particular type. For Equals() would return true,\
    \ must be at least of the type ZipCode. If so, you can cast it to a ZipCode. Then\
    \ Equals is equal to the object if both the zip code and the city name are the\
    \ same. This test is in fact based on the string classes Equals() with semantic\
    \ meaning.\n\nI will mention another method in the class Object GetHashCode().\
    \ It is a method of an code that returns an integer that can be perceived as an\
    \ identification of the code. In general, this is determined from the reference\
    \ to the object, but it is in the same manner as for ToString(), and Equals()\
    \ up to the programmer to override the method, if it has to return a code from\
    \ the value of the object. There are different guidelines for how this code to\
    \ be determined, but you can observe that it is not a requirement that different\
    \ objects return different hash codes. However, it should be the case that if\
    \ you have two objects obj1 and obj2 and obj1.Equals(obj2) is true, then must\
    \ obj1.GetHashCode() be equal to obj2.GetHashCode(). I will not at point to give\
    \ examples of applying this method, but the examples will come later. Another\
    \ reason to mention GetHashCode() on this point is if you overrides Equals() without\
    \ having to override GetHashCode(), you get a warning from the compiler. In many\
    \ cases, this warning could be ignored.\n\nConsider the following method, where\
    \ you should be especially noted that the method has an object as a parameter:\n\
    \n```\nstatic void Print(object obj)\n{\n    Console.WriteLine(obj.GetType());\n\
    \    Console.WriteLine(obj.GetHashCode());\n    Console.WriteLine(obj);\n}\n```\n\
