  md: "# C# 1 Introduction to programming and the C# language\n\n```\n[OnDeserialized]\n\
    public void InitYear(StreamingContext context)\n{\n    year = DateTime.Now.Year;\n\
    }\npublic Employee(string name, string position, DateTime date)\n{\n    base(name,\
    \ position);\n    this.date = date;\n}\npublic int Seniority()\n{\n    return\
    \ year - date.Year;\n}\n```\n\nIt provide a small problem with getting this variable\
    \ initialized when an object is deserialized. This is handled by the method InitYear(),\
    \ which is a method which is performed after the deserialization process. Here\
    \ you must note the attribute, which tells it that a method to be performed after\
    \ deserialization and the method's signature and the parameter type StreamingContext\
    \ that is an enum that is rarely used for anything.\n\nThe following program serializes\
    \ and deserializes an Employee object:\n\n```\nnamespace Exam66\n{\n    class\
    \ Program\n    {\n        static void Main(string[] args)\n        {\n       \
    \     Save();\n            Load();\n        }\n\n        public static void Save()\n\
    \        {\n            Employee employee = new Employee(\"Karlo Andersen\", \"\
    Tater\", new DateTime(2002, 03, 15));\n            Serializer(employee);\n   \
    \     }\n\n        public static void Load()\n        {\n            Employee\
    \ employee = Deserializer();\n            if (employee != null) Console.WriteLine(employee);\n\
    \        }\n\n        private static void Serializer(Employee employee)\n    \
    \    {\n            BinaryFormatter bf = new BinaryFormatter();\n            FileStream\
    \ stream = File.Create(\"Employee.dat\");\n            bf.Serialize(stream, employee,\
    \ null);\n            stream.Close();\n        }\n    }\n}\n```\n\nDownload free\
    \ eBooks at bookoon.com"
