  md: '# C# 1 Introduction to programming and the C# language


    The list contains the elements 104577, but also has 104575 slots that are not
    used. This is where a LinkedList enters the picture as a list that allocates memory
    another way. The idea is, for each element there are attached two references,
    which can refer to, respectively the foregoing and the following element. One
    can think of a linked list as the following structure


    ![](img/f84352ec481fd05dc2bc853aa8989838_205_0.png)


    where there is a reference to the start of the list and a reference to the end
    of the list. Each element (box) in the list is usually called a node. This structure
    solves the problem of insertion and deletion, as you can insert a new element
    in the middle of the list by simply changing some references, and in the same
    way you can remove an element. The figure below shows how it looked, if you insert
    an element with a value of 13 between 3 and 11 - it is necessary to change 4 references:


    ![](img/f84352ec481fd05dc2bc853aa8989838_205_1.png)


    Below is in the same manner shown how it looks if you remove the 3th element.
    It is necessary to change two references, and there are now no references to the
    3th element, so it automatic is destroyed by the garbage collector.


    ![](img/f84352ec481fd05dc2bc853aa8989838_205_2.png)


    On the other hand, the problem of space consumption is not solved. There is no
    longer allocated space for items that are not used, but to each element there
    attached two additional references, which also takes place.


    A linked list solves the problem of insertion and deletion in the middle of the
    list, but one can not directly refer to the individual elements with an index.
    There is a need to seek from the beginning (or end) of the list until you find
    the item you are interested in.


    The class LinkedList implements a linked list, and it differs from the class List
    of having other methods.


