  md: '# C# 1 Introduction to programming and the C# language


    If you run the program you get the following result:


    ![](img/f84352ec481fd05dc2bc853aa8989838_190_0.png)


    There is not much mystery in it, and you should especially notice the class Array,
    which makes a number of static methods available to manipulate arrays.


    In most cases, an array could be an alternative to a class, and the most collection
    classes are actually an encapsulation of an array. There is no problem in using
    arrays instead of collection classes, but conversely gives collection classes
    are great advantages. If an array has a fixed size and it is up to the programmer
    to keep track of where each element is and whether there is room for it. In no
    room, it is necessary to create a larger array and copy the content of the old
    array to the new one. It is all logic that is encapsulated in a collection class,
    and thus something happens automatically behind the programmer''s back. Besides,
    the collection classes make different services available that fits typical applications.


    As mentioned above, the collection classes are generic and have a strong type.
    That is, the objects as a concrete collection may contain, must be of a certain
    type. However, there is also a selection of non-generic collection classes:


    +   * ArrayList

    * Stack

    * Queue

    * SortedList

    * Hashtable


    which are collections where objects have the type object. These classes are derived
