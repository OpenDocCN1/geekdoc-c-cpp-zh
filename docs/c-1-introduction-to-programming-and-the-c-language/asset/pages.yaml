  md: 'C# 1 Introduction to programming and the C# language


    Variables


    # #3 Variables


    Applications must process data, and to do this they need a way to save or store
    the data. For these programs variables, which may have or store a value. A variable
    is characterized by


    +   - a name

    - a type

    - operators


    Variables must have a name, so you can refer to them in the program. C# is similar
    to other modern programming languages relatively flexible in regards to the naming
    of variables, but shall (should) be complied with:


    +   - the name of a variable should always start with a small letter

    - then there may follow any number of characters consisting of letters and digits

    - a name must not contain spaces


    If you follow these rules, you never have problems with names of variables, but
    some other characters are actually allowed.


    Variables have a type that indicates which values can be stored in, and how much
    a variable of the machine''s memory. The type also determines the operations that
    can be performed on a variable that is what can be done with it.


    Variables must be created or declared before they can be used. This is done by
    a statement of the form:


    ```

    type name = value;

    ```


    First you write the type, then the variable name, and finally assigned it a value,
    for example:


    ```

    int number = 23;

    ```


    Here is declared a variable called *number* that has the type *int* and the value
    23. Variables should be initialized otherwise you get an error in the translation.


    When the variables must be declared, it is because the compiler allocates space
    in the machine''s memory, and when the name appears somewhere in the code, the
    translator must know the name''s meaning in order to check if the variable is
    used in a proper context. Is it not the case, the compiler give an error message.
    The program can only be tested when it is translated without error.


