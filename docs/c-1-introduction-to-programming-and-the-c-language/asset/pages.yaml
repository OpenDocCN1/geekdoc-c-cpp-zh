  md: "# C# 1 Introduction to programming and the C# language\n\n# Nullable struct's\n\
    \nA struct is a value type, and therefore can't be null, as shown above, a simple\
    \ type may be nullable, and the same applies for a struct. If Point is the same\
    \ type as above, consider the following:\n\n```\nstatic void Test3()\\{\n    Nullable<Point>\
    \ p = null;\n    Console.WriteLine(\"\" \" + p);\n    p = new Point(3.14, 1.41);\n\
    \    Console.WriteLine(\"\" \" + p);\n    Console.WriteLine(p.Value.Length);\n\
    \    Point v = p.Value;\n    v.x = 11;\n    v.y = 12;\n    Console.WriteLine(\"\
    \" \" + p);\n}\n```\n\nHere, p is not a Point but a Nullable<Point>, which may\
    \ be null. What happens is that the type is encapsulated in a reference type.\
    \ Above, p is initially null. Next, p is set to a new Point object, but you have\
    \ hidden the properties of typeof Point. Instead, we can refer to the encapsulated\
    \ object with the property Value. Especially when you write\n\nPoint v = p.Value;\n\
    \nyou get a copy of the encapsulated object.\n\n![](img/f84352ec481fd05dc2bc853aa8989838_156_0.png)\n\
    \nOne should therefore not make nullable variables, unless you have special needs.\
    \ Note especially that\n\n```\nint? a\n```\n\nis only a short notation for\n\n\
    ```\nNullable<int> a\n```\n\nThe above examples concerning. struct's are found\
