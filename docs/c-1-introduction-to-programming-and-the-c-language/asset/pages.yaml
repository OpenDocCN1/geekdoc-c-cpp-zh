  md: "# C# 1 Introduction to programming and the C# language Generic types\n\n# Exam40\n\
    The class Set\n\nIn this example I will show you a Set that implements the mathematical\
    \ concept of a set. A set is a collection of objects which basically allows you\
    \ to ask whether an object is in the set or not. Finally, the class implement\
    \ the basic set operations such as intersection, union and set difference. Exactly\
    \ the type must have the following properties:\n\n+   - that you can get to know\
    \ how many elements the set contains\n- that you can read the element in position\
    \ n\n- that you can add an element to the set\n- that you can remove a particular\
    \ element from the set\n- that you can ask whether a certain element is in the\
    \ set\n- that you can form the union of the two sets\n- that you can form the\
    \ intersection of two sets\n\nIt should be a generic type, so that it is a set\
    \ which can be applied to arbitrary objects.\n\nHow to\nA set is defined as follows:\n\
    \n```\npublic interface ISet<T>\n{\n    int Count { get; }\n    T this[int n]\
    \ { get; }\n    void Add(T elem);\n    void Remove(T elem);\n    bool Contains(T\
    \ elem);\n    ISet<T> Union(ISet<T> set);\n    ISet<T> Intersection(ISet<T> set);\n\
    \    ISet<T> Difference(ISet<T> set);\n}\n```\n\nA set can then be defined as\
    \ a class that implements this interface:\n\n```\npublic class Set<T> : ISet<T>\n\
    {\n    private T[] elems = new T[10];\n    private int count = 0;\n\n    public\
    \ int Count\n    {\n        get { return count; }\n    }\n}\n```\n\nDownload free\
    \ eBooks at bookon.com"
