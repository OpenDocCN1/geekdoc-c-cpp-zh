  md: "# C# 1 Introduction to programming and the C# language\n\nThe method Serialiser\
    \ serialize an object of type Person to the file F:\\Temp\\Person.dat. First you\
    \ create a BinaryFormatter and then a file F:\\Temp\\Person.dat. Finally, the\
    \ formatter is used to serialize the object. It is however relatively simple to\
    \ serialize an object. One should be aware when writing to a file, the code should\
    \ usually be placed in a tri block and a possible exception should be handled.\n\
    \n# Exam62\n\nBinary deserialization\n\nThe purpose of this example is to write\
    \ a program that reads the object that is stored in the previous example and then\
    \ print the object on the screen.\n\nHow to\n\nFirst, is added in the same manner\
    \ as above, a reference to the dll with the class Person. Then the program can\
    \ be written as:\n\n```\nusing System;\nusing System.IO;\nusing System.Runtime.Serialization.Formatters.Binary;\n\
    using Datatypes;\nnamespace Exam62\n{\n    class Program\n    {\n        static\
    \ void Main(string[] args)\n        {\n            Person pers = Deserializer();\n\
    \            if (pers != null) Console.WriteLine(pers);\n        }\n\n       \
    \ private static Person Deserializer()\n        {\n            Person pers = null;\n\
    \            try\n            {\n                BinaryFormatter bf = new BinaryFormatter();\n\
    \                FileStream stream = File.OpenRead(\"F:\\Temp\\\\Person.dat\"\
    );\n                pers = (Person)bf.Deserialize(stream);\n                stream.Close();\n\
    \            }\n            catch\n            {\n            }\n            return\
    \ pers;\n        }\n    }\n}\n```"
