    Here, the programmer has to comment the method and what it does and including
    generally what the user of the method needs to know.


    +   - An explanation of the method''s parameters, including which rules (pre-conditions)
    that the parameters must satisfy.

    - An explanation of the method''s return value.


    The advantage of using this kind of documentation – not just to methods, but for
    all program elements – is


    +   - that the documentation has a standard form and that you remember to document
    all important elements as parameters and return value

    - that the documentation is used by IntelliSense in Visual Studio

    - that the documentation is in XML form, and therefore can use of a tool to form
    a complete documentation for an entire program, or as HTML


    The last type of comment is simpler and consists of everything after // and to
    the end of the line is a comment (see the method Fill() above). This is typically
    used to document the individual statements in a method, or the description of
    a variable or its equivalent.


    It is easy to write comments, but quite another thing is what you should write,
    and there are many attitudes, and the following must be mine. Generally, you should
    write what you believe that others and even you yourself needs to read and understand
    the code and thus maintain it. You should not write what is clear. You must assume
    that whoever must read the code knows the language, and you should not document
    the language itself, but the explanations for the choices made – you must explain
    how the algorithms are used and how they work. There are solutions that are difficult
    to comprehend, then you should add explanatory comments. It is also wise to always
    document the variables and what they used for – at least instance variables. It
    can also be a good idea to add a comment, telling about modification of the code,
    when changes are made, to whom and why, and of course what''s changed.'
