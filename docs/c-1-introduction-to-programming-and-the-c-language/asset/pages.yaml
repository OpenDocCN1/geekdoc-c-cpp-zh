    \        {\n            Person pers = new Person(\"Knud Andersen\",\"Skarpretter\"\
    );\n            Serializer(pers);\n        }\n        public static void Load()\n\
    \        {\n            Person pers = Deserializer();\n            if (pers !=\
    \ null) Console.WriteLine(pers);\n        }\n    }\n}\n```\n\nDownload free eBooks\
