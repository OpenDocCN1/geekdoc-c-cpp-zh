  md: "# 23 Extension methods\n\nIf you want to extend a class with new methods, the\
    \ approach is to write a derived class that adds the new methods. It is still\
    \ the \"right\" strategy, but it is not always possible, for if the class is sealed\
    \ – it is a class that you cannot inherit. One can however achieve the same thing\
    \ with an extension method.\n\nConsider the following class that defines three\
    \ static methods to integers:\n\n```\npublic static class Integer\n{\n    public\
    \ static long DiffSum(int n)\n    {\n        return (n + 1L) * n / 2;\n    }\n\
    \n    public static int Add(int n, params int[] t)\n    {\n        int s = n;\n\
    \        for (int i = 0; i < t.Length; ++i) s += t[i];\n        return s;\n  \
    \  }\n\n    public static bool IsPrim(int n)\n{\n        if (n == 2 || n == 5\
    \ || n == 7) return true;\n        if (n < 11 || n % 2 != 0) return false;\n \
    \       for (int k = 3, m = (int)Math.Sqrt(n) + 1; k <= m; k += 2)\n         \
    \   if (n % k == 0) return false;\n        return true;\n    }\n```\n\nThe first\
    \ determines of the sum of the numbers 1 + 2 + 3 + 4 + ... + N. This can be done\
    \ with a loop, but you can also use a formula as we have done above. The second\
    \ method returns the sum of a series of integers, while the latter tests whether\
    \ an integer is prime. Since all the methods are static, you may carry them out\
    \ as follows:\n\n```\nConsole.WriteLine(Integer.Add(2, 3, 5, 7, 11, 13, 17, 19));\n\
    Console.WriteLine(Integer.DiffSum(100));\nConsole.WriteLine(Integer.IsPrim(97));\n\
    ```\n\nwhich is not strange. You should note that the class is classic, and that\
    \ the first parameter to each of the three methods is of the type int, and the\
    \ declarations of these parameters are prefixed with the word this. It is the\
    \ two factors that make the methods extension methods. This means that methods\
    \ can be performed as if they were instance methods defined for type int:"
