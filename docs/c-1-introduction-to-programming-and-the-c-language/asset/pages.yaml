  md: "# C# 1 Introduction to programming and the C# language Object serialization\n\
    \nThe advantage to serialize an object as xml is everyone who can read a text\
    \ file can read and interpret it. It does not require knowledge of the binary\
    \ format which is used of a BinaryFormatter.\n\nThe content of the file Person.xml\
    \ is as follows:\n\n```\n<xml version=\"1.0\"?>\n<Person xmlns=\"http://www.w3.org/2001/XMLSchema-instance\"\
    \ xmlns:xsi=\"http://www.w3.org/2001/XMLSchema\">\n  <Name>Knud Andersen</Name>\n\
    \  <Position>Skarpretter</Position>\n</Person>\n```\n\nIf you look at the data\
    \ that is generated, you can see that it is not enough that you can deserialize\
    \ the object. If an object can be xml serializable there are a few more things\
    \ that must be be:\n\n+   - there must be a default constructor\n- there must\
    \ be get and set properties for all instance variables\n\nand both are satisfied\
    \ of the class Person. Although binary serialization (and SOAP serialization shown\
    \ below) does not require it, it is a good idea to attach both a default constructor\
    \ and the necessary properties to classes that are defined serializable.\n\n#\
    \ Exam64\n\n# SOAP serialization\n\nThis example is exactly identical to the example\
    \ above with the difference that this time the object is serialized by the SOAP\
    \ protocol.\n\nHow to\n\nIn all other examples there must be a reference to the\
    \ dll with the type Person, but this time there is a little extra observation.\
    \ The class to soap formatting is in the namespace:\n\n```\nusing System.Runtime.Serialization.Formatters.Soap;\n\
    ```\n\nbut this namespace is not included in the dlls that Visual Studio makes\
    \ references to as default. It therefore necessary to set a reference to the namespace\
    \ manually (see below). Then the code can be written:\n\n```\nusing System;\n\
    using System.IO;\nusing System.Runtime.Serialization.Formatters.Soap;\nusing Datatypes;\n\
    \nnamespace Exam64\n{\n  class Program\n{\n    static void Main(string[] args)\n\
    \  }\n```\n\nDownload free eBooks at bookbo.com"
