  md: '# C# 1 Introduction to programming and the C# language


    Here are some things to be explained. First, notice that there are two try blocks:
    An outer outside the loop, and an inner encapsulating the body of the for loop.
    So please note that you can have try blocks inside each other. In the loop, this
    things happens:


    +   1. adding a random number (between 0 and 29) the set A

    2. a random number is removed from the set


    In both cases there may be an exception. Therefore, the code is placed in a try
    block. After the block, there are three catch handlers, which are intended to
    illustrate that may be several catch handlers for a try block. If the block raises
    an exception, the program control is transferred to the catch handler that matches
    the type of the exception raised. It is, therefore, that exceptions may have a
    different type, so that multiple catch handlers can what happens in different
    situations.


    Also note that the innermost try block has an associated finally handler. This
    will – if it is what is not necessary – be performed regardless of whether there
    is an exception or not.


    Finally, there is the outer try block. This is an example of an anonymous catch
    handler that is executed when there is an exception and regardless of type – it
    catch anything.


    # SystemException


    When an application raises an exception, it should always be of type ApplicationException
    or a type that is directly derived from ApplicationException. The class, as mentioned
    derived from the class Exception and there is nothing that prevents one can raise
    an exception of the type Exception. When you should not do it, it is because there
    is another exception called SystemException that are also derived from Exception.
    Exceptions of this type are intended for exceptions raised by the runtime system
    or the basic classes from the framework, and they indicate fundamental and serious
    problems where the typical handling is terminate the program with an error message.
    The following hierarchy separates the exceptions into two categories, one category
    indicate failure, which typically results in the program exits with an error message
    while the second category indicates the error caused by the program''s environment
    or use, and thus that error should be handled by the program.


