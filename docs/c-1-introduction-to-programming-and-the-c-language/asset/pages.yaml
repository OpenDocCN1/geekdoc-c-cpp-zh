  md: "# C# 1 Introduction to programming and the C# language\n\n# Parameters\n\n\
    A method's parameters can be of any type, but there are several kinds of parameter\
    \ passing. When you define a method that you specify the parameters method should\
    \ have, and these parameters are called the formal parameters and specify the\
    \ values that the method should operate on. When you call the method, you must\
    \ specify the values (parameters) to be transferred to the method, and they are\
    \ called for the actual parameters.\n\n# Value parameters\n\nIn general the parameters\
    \ are value parameters, for example\n\n```\nstatic int Max(int a, int b)\n{\n\
    \    return a < b ? b : a;\n}\n```\n\nWhen this method is called, there must be\
    \ transmitted two actual parameters. Exactly what happens on the stack the system\
    \ creates a so-called activation block, which contains four basic things:\n\n\
    +   - the return address, so the system knows where the program will continue\
    \ after the method is terminated\n- a copy of each actual parameter\n- a place\
    \ to the return value corresponding to the method's type\n- the method's local\
    \ variables, if it has local variables\n\nOne can outline this as follows:\n\n\
    ![](img/f84352ec481fd05dc2bc853aa8989838_92_0.png)\n\nWhen the program calls the\
    \ method Max() it creates an activation block on the stack, and the return address\
    \ and the actual parameters are copied to it. Next the method takes the control\
    \ and starts its work. The method then always works on copies (a and b) located\
    \ on the stack, and it also means that if the method changes it alters its values\
    \ on the stack, and this has no effect in the program. When the method performs\
    \ its return statement, the return value is copied to the activation block, then\
    \ the control is given back to the program and it continues its work. Immediately\
    \ after the program has gained the control, it can read the return value from\
    \ the activation block, which will then be removed from the stack. Note that this\
    \ also means that the method creates local variables (which are not the case in\
    \ this example) they are also gone.\n\nDownload free eBooks at bookhoon.com"
