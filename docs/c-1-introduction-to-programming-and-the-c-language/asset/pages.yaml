  md: "# Exam38\n\n# Sorting an array\n\nIt should be written as a method which can\
    \ sort an array of objects of any type.\n\nHow to\n\nThere are many different\
    \ sorting methods, and here I will use a method that can be described as follows\n\
    \n+   loop over the array and find the smallest element\nswap the smallest element\
    \ with the element in position 0 – now the first item is correct\nloop over the\
    \ last n-1 elements and find the smallest among them\nswap that element with the\
    \ element in position 1 – now the first two elements are correct\nloop over the\
    \ last n-2 elements and find the smallest among them\nswap that element with the\
    \ element in position 2 – now the first three elements are in place\ncontinue\
    \ until the array is sorted – for each pass find the smallest of the elements\
    \ that are not already in place and swap it to the right position\n\nThe result\
    \ is after k passes the first k elements sorted while you still have to sort the\
    \ last n-k elements. It is a very simple sorting method, but it is however not\
    \ the most effective – at not for large arrays.\n\nWriting a method for sorting\
    \ an array of any type, is a large requirement, because sorting of the elements\
    \ will always include that the elements can be compared and ranked in order of\
    \ size. Many of the built-in types can be, for example the simple types and the\
    \ string type that can be compared with the comparison operators, but other types\
    \ can also be compared, and it usually happens that they implement an interface\
    \ called IComparable. This interface defines only one method called CompareTo(),\
    \ which has a return -1 if the current object is less than the parameter, 1 if\
    \ the current object is greater than the parameter and otherwise 0. The interface\
    \ is also available in a generic version and the method CompareTo() is also a\
    \ generic parameterized with the kind of elements to be compared. The sum of all\
    \ is that this sorting method can be written as:\n\n```\nstatic void Sort<T>(T[]\
    \ arr) where T : IComparable<T>\nfor (int i = 0; i < arr.Length - 1; i++)\n  int\
    \ k = i;\n  for (int j = i + 1; j < arr.Length; j++)\n    if (arr[j].CompareTo(arr[k])\
    \ < 0) k = j;\n  if (i != k) Swap(ref[i], ref arr[k]);\n```\n\nDownload free eBooks\
    \ from bookhoon.com"
