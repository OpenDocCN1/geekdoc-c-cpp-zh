    the hierarchy is partly that it allows one to write all tokens in the same way,
    and in that way it is easy to expand with new tokens, if such an expression must
    support a function.


    After the scanning, you write a list of tokens, and parsing has to investigate
    whether this list of tokens is in accordance with the syntax rules. In the code
    it corresponds to write a method corresponding to each of the above diagrams,
