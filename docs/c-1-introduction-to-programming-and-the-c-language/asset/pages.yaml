  md: "# 32 User defined serialization\n\nThe serialization process as described is\
    \ generally seen by the programmer simple and there is rarely reason to do more\
    \ than described above. However, there is the possibility to intervene in the\
    \ process if there are special needs.\n\nAs an example one can imagine that a\
    \ class has variables that you, for one reason or another, do not want to be serialized.\
    \ Below is a class Employee which inherits the class Person and expands it with\
    \ two variables, the first being the date of employment, and the second is the\
    \ current year. The class has a method Seniority(), which – somewhat simplified\
    \ – returns an employee's seniority as the number of years between employment\
    \ and the current year. The class is Serializable, but it makes no sense to serialize\
    \ the variable year, with the attribute NonSerialized, which says that it should\
    \ not be serialized.\n\n```\n[Serializable]\npublic class Employee : Person {\n\
    \    private DateTime date;\n\n[NonSerialized]\n    protected int year = DateTime.Now.Year;\n\
    ```\n\n![](img/f84352ec481fd05dc2bc853aa8989838_251_0.png)"
