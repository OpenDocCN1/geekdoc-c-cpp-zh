    \nthat seen from the programmer is the same as a SortedDictionary, but also internally\
    \ is a binary search tree. The difference is that a SortedList uses less memory\
    \ than a SortedDictionary, and vice versa a SortedDictionary more efficient at\
    \ inserting and deleting of keys.\n\n# Exam70\n\n# Cue list\n\nIn this example\
    \ I will show how to represent a cue list for a book. The purpose is mainly to\
