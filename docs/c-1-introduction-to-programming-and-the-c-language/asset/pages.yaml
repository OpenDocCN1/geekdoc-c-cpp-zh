  md: "# C# 1 Introduction to programming and the C# language\n\n# Abstract classes\n\
    \n```\npublic int X\n{\n    get { return x; }\n    set { x = value; }\n}\n\npublic\
    \ int Y\n{\n    get { return y; }\n    set { y = value; }\n}\n\npublic override\
    \ string ToString()\n{\n    return string.Format(\"{0}, {1}\", x, y);\n}\n\npublic\
    \ abstract void Dec();\npublic abstract void Inc();\n```\n\nThere are two differences.\
    \ The class has two abstract methods Dec() and Inc(). These methods have no code\
    \ and are merely definitions. This means that those who use the class Point knows\
    \ that these methods exist, but not how they work. The second difference is that\
    \ the class is defined abstract. It must be, and that means that the class cannot\
    \ be instantiated – you cannot create objects of the type Point\n\nThe class NewPoint\
    \ : Point, and must therefore implement the two abstract methods, so they are\
    \ specific methods that perform something:\n\n```\npublic class NewPoint : Point\n\
    {\n    public NewPoint(int x, int y) : base(x, y)\n}\n\npublic override void Dec()\n\
    {\n    --X;\n    --Y;\n}\n\npublic override void Inc()\n{\n    ++X;\n    ++Y;\n\
    }\n```\n\nNote that an abstract method that is implemented in a derived class\
    \ has to be preceded with the word override."
