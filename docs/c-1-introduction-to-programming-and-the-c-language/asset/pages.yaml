    # Part 5 Final examples


    If for example you must calculate the value 3 * 4 +, it works as


    ```

    23*4+

    64+

    10

    ```


    The idea is that any expression can be written in postfix form without using parentheses.
    When the expression should be evaluated, it is traversed from left to right. Every
    time you come to an operand, put it on a stack. Coming to an operator you pop
    the stack (if it is an operator with two arguments) calculates the result and
    put it on the stack. Finally the stack will contain only one element which is
    the result. The method may based on the last of the above expressions is illustrated
    in the following manner:


    | | | | | | | 6 | 7 | | 77 |

    |---|---|---|---|---|---|---|---|---||

    | | 2 | 2 | | 14 | | 5 | 11 | 11 | |

    | 1 | 1 | 1 | 1 | 15 | 15 | 15 | 15 | 0.1948 |

    | 1 | 2 | 3 | 4 | * | + | 6 | + | 7 | / |


    The conclusion is that it is much easier to evaluate an expression in postfix
    form than one in infix and it is worthwhile to set a strategy (an algorithm) to
    convert an expression from infix to postfix form. It may be done by using a stack:


    +   expression traversed left and for every element

    1. if it is a sign push on the stack

    2. if it is a function push on the stack

    3. if it is a variable push on the stack

    4. if it is a number push on the stack

    5. if it is a left parentheses push on the stack

    6. if it is a right parenthesis, pop the stack and add the top of the stack to
    the result until you get a left parentheses

    7. if it is an operator pop the stack and add the top of the stack to the result
    as long as the priority of the top of the stack is less or equal to the priority
    of the element, the element on the stack pop the stack and add the top of the
    result until the stack is empty


    As you can see, it is in the algorithm that are assigned the priorities for the
    individual elements. It is the priorities that determine when to move from the
    stack to the result, which is just a list. The two important points in the algorithm
    are 6 and 7. If you get an operator - for example a multiplication - you must
    first move everything on the stack with a better priority than multiplication
    to the result list. It will be numbers, variables and functions, and then the
    multiplication operator put on the stack. So, if the expression tokens are converted
    to postfix, it is simple to implement method() in the class Expression.


