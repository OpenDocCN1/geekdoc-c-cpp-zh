  md: "# C# Introduction to programming and the C# language\n\n# Generic types\n\n\
    ```\npublic T this[int n]\n{\n    get { return elems[n]; }\n}\n\npublic void Add(T\
    \ elem)\n{\n    if (IndexOf(elem) >= 0) return;\n    if (count == elems.Length)\
    \ Expand();\n    elems[count++] = elem;\n}\n\npublic void Remove(T elem)\n{\n\
    \    int n = IndexOf(elem);\n    if (n >= 0) elems[--count];\n}\n\npublic bool\
    \ Contains(T elem)\n{\n    return IndexOf(elem) >= 0;\n}\n\npublic ISet<T> Union(ISet<T>\
    \ set)\n{\n    Set<T> tmp = new Set<T>();\n    for (int i = 0; i < set.Count;\
    \ i++) tmp.Add(set[i]);\n    for (int i = 0; i < count; i++) if (!set.Contains(elems[i]))\
    \ tmp.Add(elems[i]);\n    return tmp;\n}\n\npublic ISet<T> Intersection(ISet<T>\
    \ set)\n{\n    Set<T> tmp = new Set<T>();\n    for (int i = 0; i < count; i++)\
    \ if (set.Contains(elems[i])) tmp.Add(elems[i]);\n    return tmp;\n}\n\npublic\
    \ ISet<T> Difference(ISet<T> set)\n{\n    Set<T> tmp = new Set<T>();\n    for\
    \ (int i = 0; i < count; i++) if (!set.Contains(elems[i])) tmp.Add(elems[i]);\n\
    \    return tmp;\n}\n\npublic override string ToString()\n{\n    StringBuilder\
    \ builder = new StringBuilder();\n    builder.Append(\"[\");\n    for (int i =\
    \ 0; i < count; i++)\n    {\n        builder.Append(\", \");\n        builder.Append(elems[i]);\n\
    \    }\n    builder.Append(\"]\");\n    return builder.ToString();\n}\n\nprivate\
    \ int IndexOf(T elem)\n{\n    for (int i = 0; i < count; i++) if (elems[i].Equals(elem))\
    \ return i;\n    return -1;\n}\n```"
