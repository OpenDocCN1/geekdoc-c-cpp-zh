  md: "# C# 1 Introduction to programming and the C# language\n\n```\nprivate static\
    \ Employee DeSerializer()\\{\n    Employee employee = null;\n    try {\n     \
    \   BinaryFormatter bf = new BinaryFormatter();\n        FileStream stream = File.OpenRead(\"\
    Employee.dat\");\n        employee = (Employee)bf.Deserialize(stream);\n     \
    \   stream.Close();\n    } catch {\n}\n    return employee;\n}\n```\n\nThere are\
    \ other corresponding attributes that can be used to decorate the methods of performing\
    \ a similar signature:\n\n+   * *OnDeserialized to provide a method that is carried\
    \ out before the serialization process\n* *OnSerialized specifies a method that\
    \ is performed immediately after the serialization process\n* *OnDeserializing\
    \ specifies a method that is carried out before the serialization process\n\n\
    In addition to as illustrated above where you can define methods which are performed\
    \ and after, respectively, serialization and deserialization, it is also possible\
    \ to directly control the process in how terms data is serialized and deserialized.\
    \ The principle is illustrated by the following class that represents a member\
    \ who is a specialization of the class Person:\n\n```\n[Serializable]\npublic\
    \ class Member : Person, ISerializable{\\{\n    private string ssn;\n    private\
    \ string phone;\n    private string email;\n\n    public Member(string ssn, string\
    \ name, string position, string phone, string email)\n        : base(name, position){\n\
    \        this.ssn = ssn;\n        this.phone = phone;\n        this.email = email;\n\
    \    }\n\n    public Member(SerializationInfo info, StreamingContext context {\n\
    \        ssn = info.GetString(\"ssn\");\n        Name = info.GetString(\"name\"\
    );\n        Position = info.GetString(\"position\");\n        phone = info.GetString(\"\
    phone\");\n        email = info.GetString(\"email\").ToLower();\n    }\n```"
