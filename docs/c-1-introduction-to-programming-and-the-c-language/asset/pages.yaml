  md: '# 17 Types


    C# has several categories of types, including class types and interface types,
    but also simple types like int and double. Characteristics of these types and
    how variables / objects of these types are allocated, are, as mentioned above,
    generally divided into value types and reference types.


    A variable of a value type allocates space on the stack, and one can see that
    the variable has its own copy of the data stored in it. The variable is automatically
    destroyed (removed from the stack) when the program finishes the block where the
    variable is declared. A variable of a value type uses then the number of bytes
    of the stack, which the type indicates.


    A variable of a reference type does not contain data itself, but contains a reference
    to data that is allocated on the heap. This means that one can have several variables
    that relate to the same data. This also means that a reference variable always
    has the same size of that that is the size of a reference (4 bytes). A reference
    can specifically have the value null, which means it does not refer to anything.
    Reference types can be classified into class types, arrays, and interface types.


    The next sections deal more on the types and value types primarily, but also dealt
    with generic types and exception handling, but I will start with a few remarks
    on the simple types.


    The simple or built-in types, are for example int, char, double, etc. Each type
    has a name that is a reserved word, but these names are really just alias for
    a struct in the System namespace. This means that there are also associated methods
    to the simple types. For example is int an alias for the System Int32, which is
    a 4 byte integer.


    The following table shows the types in the namespace System:


    | C# alias | Type I System | Betydning |

    |---|---||

    | sbyte | SByte | 8 bit signed integer |

    | byte | Byte | 8 bit unsigned integer |

    | short | Int16 | 16 bit signed integer |

    | ushort | UInt16 | 16 bit unsigned integer |

    | int | Int32 | 32 bit signed integer |

    | uint | UInt32 | 32 bit unsigned integer |

    | long | Int64 | 64 bit signed integer |

    | ulong | UInt64 | 64 bit unsigned integer |

    | char | Char | 16 Unicode character |

    | float | Float | 32 floating-point number |

    | double | Double | 64 floating-point number |

    | bool | Boolean | 8 bit that is true or false |

    | decimal | Decimal | 96 bit decimal number with 28 significant digits |'
