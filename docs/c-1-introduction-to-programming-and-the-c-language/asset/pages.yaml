    namespace:


    ```

    * This namespace contains several classes with miscellaneous methods.

    One can perceive the namespace as a custom class library.

    */

    ```


    It''s a little order of kind that has been inherited from the C programming language,
    but the characters /* start and it will continue until you meet the characters
    */ and between these two markers are all the text that you may have on a single
    line or spread over several lines. The kind of comment is not used as often, but
    there is nothing wrong with it, and if you need at the beginning of a source file
    to write a lengthy documentation, it is an excellent form of commentary.


    The most common type of comment in C# is used in front of each method. This is
    partly due that Visual Studio auto generate a skeleton, which you must complete.
    For example, if you place the cursor in front of the method FillCenter() and press
    the / * three times, Visual Studio generates the following skeleton to a comment:


