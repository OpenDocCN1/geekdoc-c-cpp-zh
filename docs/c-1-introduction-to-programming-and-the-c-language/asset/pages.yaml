    Usually you write an expression in infix form which means that one writes the
    operator between two operands, ie for example:


    ```

    2+3

    ```


    which means the sum of 2 and 3. If there are several operators, we need rules
    for how the expression must be evaluated. For example means


    ```

    2*3+4

    ```


    that you first calculate the product of 2 and 3 and adds this result to 4 – the
    result is 10. In contrast, means


    ```

    2+3*4

    ```


    that you first calculates the product of 3 and 4, since one attaches multiplication
    higher precedence addition – the result is therefore 14. If you wish to suppress
    this rule, so the addition is first performed, it is necessary to insert parentheses:


    ```

    (2+3)*4

    ```


