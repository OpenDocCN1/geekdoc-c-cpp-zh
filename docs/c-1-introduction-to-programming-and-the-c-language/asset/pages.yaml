  md: "# #21 Exception handling\n\nWhen writing a program, there may be errors. For\
    \ example you can write the code incorrectly, so the program can't be translated.\
    \ This is because the program is written with an incorrect syntax, and that kind\
    \ of mistake is rarely unproblematic, as they are caught by the compiler. One\
    \ speaks therefore obviously of a compiler. These errors must be addressed, –\
    \ until you get trained – can be difficult enough, and when I call them unproblematic,\
    \ it is because the compiler can find them, and the program cant execute before\
    \ they are corrected.\n\nAnother type of errors is logical errors that the program\
    \ can be translated and run, but when it does something else than the idea was.\
    \ It may, for example a calculation that gives a wrong result or an incorrect\
    \ value that is stored in a database. The hardest errors they can't be caught\
    \ by the compiler, and the program can actually run for a period before the error\
    \ is acknowledged, but also it may be errors that are difficult to locate. The\
    \ use of the program detects the symptom, but it is hard to find where in the\
    \ code that it goes wrong. The remedy for this kind of errors is test, and test\
    \ again. To test a program is by means simple, and it requires both time and procedures.\n\
    \nA third kind of error is caused by environmental conditions and errors as you\
    \ program can't really guard against, but conversely also errors that you in one\
    \ or might take care of. As an example, it may be a user who enters them – for\
    \ example a number – and you have no control over the user enters. Another example,\
    \ one can imagine a program that will use a file that does not exist. In those\
    \ situations, the program will handle the error, which means that it must be able\
    \ to find that there is an error and if so, decide what is to happen. Typically\
    \ it will be such that a method can capture that there an error, but the method\
    \ can't know how the error is handled, but it must instead leave the place where\
    \ it was called, know that there is error and leave the error handling to the\
    \ calling code. One way to solve the problem is to let the method return an error\
    \ code and the calling code can test the error code and take an appropriate action\
    \ determined by the error code. This strategy is really good, but it can only\
    \ be used in situations where the method would not else have a return value.\n\
    \nAnother strategy is to use *exception handling*. The idea is pretty simple.\
    \ A method, in the case of a fault throw an exception, and if it does so, the\
    \ method is immediately interrupted. The place where the method was called must\
    \ then choose the exception and take an appropriate action. Consider as an example\
    \ (labeled Exam41) the following method that calculates the ratio of two integers:\n\
    \n```\nstatic int Div(int a, int b)\n{\n    if (b == 0) throw new ApplicationException(\"\
    Division med 0...\");\n    return a / b;\n}\n```\n\nDownload free eBooks at bookhoon.com"
