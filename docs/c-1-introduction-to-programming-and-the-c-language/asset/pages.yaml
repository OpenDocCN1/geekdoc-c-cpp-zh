  md: "# C# 1 Introduction to programming and the C# language\n\n```\nstatic T[] Create<T>(int\
    \ n) where T : new()\n{\n    T[] arr = new T[n];\n    for (int i = 0; i < arr.Length;\
    \ ++i) arr[i] = new T();\n    return arr;\n\n```\n\nNote the use of where. it\
    \ means the type T must have a default constructor – if it is not the case, one\
    \ gets a translation error. The result is that the array elements are created\
    \ in the loop, you can be sure that they are properly initialized. Note that the\
    \ class Dice satisfies that and has a default constructor.\n\nBelow is a code\
    \ that creates an array with cubes, and sort it:\n\n```\nstatic void Test2()\n\
    {\n    Dice[] b = Create<Dice>(10);\n    Print(b);\n    Sort(b);\n    Print(b);\n\
    }\n```\n\nHere you should note that the method Create() is generic and that the\
    \ parameter does not depend on the type parameter. If you just write the Create(10),\
    \ the translator cannot know what Create() you wish to perform, and one must therefore\
    \ set the type parameter after the method's name. In other examples, it is unnecessary\
    \ (but legally) because the translator from the actual parameter can see what\
    \ type it is. When, for example you write\n\n```\nPrint(b);\n```\n\nthe compiler\
    \ can infer from the type of b to see what type the argument have, but it is legal\
    \ to write\n\n```\nPrint<Dice>(b);\n```\n\nComment\n\nIn the examples above, I\
    \ have shown two applications of the use of where to place restrictions on the\
    \ type parameter. There are a few other cases:\n\n+   * where T : struct\n* where\
    \ T: class\n\nwhere the first means that the type parameter must be a value type,\
    \ while the other means that the type should be a reference type. Finally I have\
    \ in the method Sort() used that the type must implement an interface, but you\
