    ```


    Another objective of an interface is to allow for the design level to work with
    multiple inheritance. As mentioned above, a class can only have a single base
    class - class inheritance from one class. It is called sometimes for linear inheritance.
    You can''t have a design as shown below:


    | A | B |

    |---|---|n| C |


    where a class inherits both the class A and the class B. There are several reasons
    why it is not possible. Firstly, there are difficulties in implementing the concept
    in a programming language in a meaningful way, and secondly, one can discuss whether
    it is an appropriate design, as it expresses that C is both an A and B. There
    are examples where it is reasonable, and in C# can inherit a single class, but
    implement all the interfaces, it may have wanted or needed. You''ll have seen
    many examples of that.


