    \ (1)\", t1, t2);\n}\n```\n\nIf you look at what Swap() creates on the stack,\
    \ it will swap the a and b\n\n| a | a | a=b | a |\n|---|---|---|---|\n| 2 | 2\
    \ | 3 | 3 |\n| 3 | 3 | 3 | 2 |\n| t | 2 | 2 | 2 |\n\n![](img/f84352ec481fd05dc2bc853aa8989838_93_0.png)"
