  md: "# C# 1 Introduction to programming and the C# language\n\n# Exam11\n\n# The\
    \ sum of the positive number less than 100\n\nAs an example is shown a program\
    \ which determines the sum of all positive integers less than or equal to 100,\
    \ that is the sum 1+2+3...+100.\n\nHow to\n\nThe program can be written as follows:\n\
    \n```\nclass Program\n{\n    const int N = 100;\n    static void Main(string[]\
    \ args)\n    {\n        long s = 0;\n        int n = 1;\n        while (n <= N)\n\
    \        {\n            s += n;\n            n++;\n        }\n        Console.WriteLine(s);\n\
    \    }\n}\n```\n\n# Explanation\n\nNote first that in the beginning of the program\
    \ there is defined a constant, which is the largest number to be included in the\
    \ sum:\n\n```\nconst int N = 100;\n```\n\nIt is not necessary, but it makes it\
    \ easy to modify the program if, for example instead it must determine the sum\
    \ of the numbers from 1 to 1000.\n\nNote the algorithm. First define a variable\
    \ s to the result. Next, define a variable n to the number to be added to the\
    \ sum and initialize it to 1, which is the first number. Repeat the subsequent\
    \ block as long as n is less than or equal to 100 (the constant N). In the block\
    \ two things happens: The value of the variable n is added to s and n is incremented\
    \ by 1. Note that the last statement means that n is 1 more for each repetition,\
    \ and thus the condition for the while, sooner or later becomes false."
