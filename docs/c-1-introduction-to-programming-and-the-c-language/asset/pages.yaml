  md: "C# 1 Introduction to programming and the C# language Generic types\n\n# 20\
    \ Generic types\n\nGeneric types are attached to the so-called collection classes\
    \ that are dealt with later, but the goal is to show how to write custom generic\
    \ types. Short it can be said the aim is to write types that are general and can\
    \ be used in many contexts. Instead of the generic type one refers to parameterized\
    \ types corresponding to that it depend on one or more parameters.\n\n# Generic\
    \ methods\n\nBefore I show how to write a custom generic type, I will look at\
    \ a related issue, namely what we mean by a generic method. An example is a shown\
    \ method to swap two integers of the int:\n\n```\nstatic void Swap(ref int a,\
    \ ref int b)\n{\n    int t = a;\n    a = b;\n    b = t;\n}\n```\n\nIt is a very\
    \ simple method but a method of great use, for example if you have to sort an\
    \ array. The method has a problem that is closely related to the type int in that\
    \ way if you also need a method that can swap two objects of the type double,\
    \ then it is necessary to write a new Swap() method acting on double and similarly\
    \ for all the other types in which there is a need for a Swap() method. It may\
    \ therefore be desirable to write a generic method that can handle all types.\
    \ There is generic methods come into play:\n\n```\nstatic void Swap<T>(ref T a,\
    \ ref T b)\n{\n    T t = a;\n    a = b;\n    b = t;\n}\n```\n\nIt's also called\
    \ a parameterized method similar to that of the method is associated with a type\
    \ parameter, here called T. In addition to that after the method name is a <T>\
    \ it is equivalent to that int everywhere is replaced with type T. For example\
    \ the method can be used as follows, where it exchanges two strings:\n\n```\n\
    string s1 = \"Svend\";\nstring s2 = \"Knud\";\nSwap(ref s1, ref s2);\nConsole.WriteLine(s1);\n\
    Console.WriteLine(s2);\n```\n\nDownload free eBooks at bookoon.com"
