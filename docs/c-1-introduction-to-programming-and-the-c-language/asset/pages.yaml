  md: "# C# 1 Introduction to programming and the C# language\n\n# Reference parameters\n\
    \nIn .NET you can also use reference parameters. For example you can change the\
    \ method Swap\nfor the following:\n\n```\npublic void Swap(ref int a, ref int\
    \ b)\n{\n    int t = a;\n    a = b;\n    b = t;\n}\n```\n\nIf you then change\
    \ the method Test2() so that the actual parameters are references\n\n```\nstatic\
    \ void Test2()\n{\n    int t1 = 2;\n    int t2 = 3;\n    Swap(ref t1, ref t2);\n\
    \    Console.WriteLine(\"{0} {1}\", t1, t2);\n}\n```\n\nit are references to the\
    \ actual parameters that are placed on the stack, and Swap() will swap the values\
    \ of\nt variables l1 and l2. That means that the changes Swap() performs, is on\
    \ the objects that the references\non the stack applies to.\n\nReference parameters\
    \ are used instead of value parameters when the changes that a method do on its\n\
    parameters must be maintained in the calling code.\n\nNote that you can combine\
    \ value parameters and reference parameters so that the method may have\nparameters\
    \ for both references and values.\n\n# out-parameters\n\nIn .NET, there is a possibility\
    \ of using out parameters, which are parameters which may not be initialized\n\
    before a method is called, and instead are assigned a value to the method. The\
    \ following method creates\ntwo Point objects assigned to references that are\
    \ passed as out parameters to the method:\n\n```\nstatic void Points2(int x1,\
    \ int y1, int x2, int y2, out Point p1, out Point p2)\n{\n    p1 = new Point(x1,\
    \ y1);\n    p2 = new Point(x2, y2);\n}\n```"
