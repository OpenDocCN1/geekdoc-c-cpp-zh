  md: "C# 1 Introduction to programming and the C# language\n\nIntroduction\n\n# #1\
    \ Introduction\n\nC# is an object-oriented programming language. The fundamental\
    \ architectural element of a program is a class, and from a programmer's perspective\
    \ a C# family of classes, that collectively define all the application's properties\
    \ and functionality. Writing a program is thus to define – design – and write\
    \ the code for the program's classes. Nothing in C# exists outside a class. A\
    \ program will operate by many other classes are not written by the programmer,\
    \ but classes that are coming from the .NET framework, and is thus available to\
    \ the programmer as finished components.\n\nOne of the classes has a special role\
    \ as the \"entry point\" and the place where the program starts, and this class\
    \ must be written with a particular naming scheme, but it is almost the only formal\
    \ requirements for the architecture of a C# program.\n\n# Exam01\n\nHello World\n\
    \nA good place to start with a new programming language is the classic Hello World\
    \ program that just prints a text on the screen. This program becomes mandatory\
    \ part of any exposition of a programming language. The program can be written\
    \ as follows:\n\n```\nusing System;\nnamespace Exam01\n{\n    class Program\n\
    \    {\n        static void Main(string[] args)\n        {\n            Console.WriteLine(\"\
    Hello World\");\n        }\n    }\n}\n```\n\nIf you run the program the result\
    \ is:\n\n![](img/f84352ec481fd05dc2bc853aa8989838_13_0.png)\n\nThe program runs\
    \ in a command window (prompt), where it prints the text Hello World on the screen.\
    \ The program is not doing much, but it is a full-fledged program."
