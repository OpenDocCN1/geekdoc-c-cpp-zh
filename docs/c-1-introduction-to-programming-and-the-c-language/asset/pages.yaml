  md: "# C# 1 Introduction to programming and the C# language    Abstract classes\n\
    \nYou can also look at an annuity, which is characterized in that the payment\
    \ is constant throughout the repayment period. This means that the relationship\
    \ between interest and repayment is so that in the beginning interest is a big\
    \ part of the payment and the repayment is only a small part, towards the end\
    \ of the period, the situation is reversed. The relationship between the loans\
    \ principal, and interest rate can be expressed in the following formula:\n\n\
