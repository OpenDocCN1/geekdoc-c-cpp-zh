  md: '# C# 1 Introduction to programming and the C# language


    # Part 4 IO


    Previously, files were a central concept in programming, and even if it does not
    play the same role as before it is still important to know how to write and read
    from a file.


    When IO and files do not play the same role as before, it is because applications
    that need to manipulate persistent data stored on disk usually use database products,
    and anything relating to files and data is thus left to the current database system.
    Nevertheless, there are still situations where there is a need to be able to access
    regular files, and it is mainly in two situations: How to read and write a plain
    file, and how to serialize and deserialize an object.


    As everywhere in .NET access to files relieved the programmer through a number
    of finished classes, which are primarily found in the System.IO namespace. It
    is a comprehensive namespace with many but fortunately it is not necessary to
    know them all, so I will concentrate on those that are a minimum required.


    From a program a file is basically a sequence of bytes, and in many ways one can
    think of a file as a 1-dimensional array with no upper limit (the size is obviously
    limited by the space available on disk). The place where the next file operation
    (reading or writing) is performed is determined by a so-called pointer, which
    is really just a counter relative to the strat of the file. Correspondingly, one
    can illustrate a file in the following manner, wherein each box is a:


    | | | | | | | | | | | |


    ![](img/f84352ec481fd05dc2bc853aa8989838_220_0.png)


    In a program, the challenge is to control where to read from and write to the
    file and interpret the result that is read and convert it to the correct data
    format. It''s actually all that the classes in the IO system and their methods
    encapsulate.'
