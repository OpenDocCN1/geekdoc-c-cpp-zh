    # Comment


    If you look at the methods for union, intersection and set difference they are
    not very effective. There are simply too many loops inside each other. It is perhaps
    not entirely obvious, but if you examine more closely what is happening, the problem
    comes to light. The problem is in fact the method IndexOf(), which consisting
    of a loop that passes through all the elements of the set. Consider as an example
    the following statement (from the method Union());


    ```

    for (int i = 0; i < count; ++i) if (!set.Contains(elems[i])) tmp.Add(elems[i]);

    ```


    It consists of a loop, which runs through the elements. In principle it is ok,
    but for each element the statement called Contains() which calls IndexOf(), which
    performs a second loop, and it gives a bad performance. It is said that the algorithm
    has a poor time complexity.


    It is possible to do it better if organizing the elements more clever than just
    adding them to an array, but overshoots the target for this book and is not the
    theme for this example. The goal here is to give an example of a generic type
    with some utility, and contains the set not too many elements, it works very well
    indeed.


