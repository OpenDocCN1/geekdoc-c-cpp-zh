  md: '# C# 1 Introduction to programming and the C# language


    # Operators


    C# has a number of operators, acts on variables or values. The above program used
    the + operator. Note that the significance of the operator is dependent on the
    type of the variables or constants the operator acts on. In the first case where
    both operands are integers, the meaning is addition and in the second case (in
    the WriteLine statement), the meaning are string concatenating. Note that the
    above program also used the = operator, called the assignment operator and is
    used to assign a variable value.


    C# has the following operators in order of priority, and with decreasing priority
    downwards:


    | 0. [] function(...) new typeof sizeof unchecked |

    | +- ! ~ ++ -- (unary operator) |

    | * % |

    | + - |

    | << >> |

    | < <= >= is as |

    | == |= |

    | & |

    | ^ |

    | | |

    | && |

    | || |

    | ?: |

    | *= /= %= += -= << >> >= ^= &= |= |


    The individual operators are explained as they are used. The priority is of importance
    in expressions that involve multiple operators. The general rule is that you evaluate
    the operators with the highest priority and in the case where there are several
    operators with the same priority they are evaluated from left. In for the expression


    ```

    a + b * c

    ```


    b * c is calculated first, since * has higher precedence than +. If that instead
    you write


    ```

    (a + b) * c

    ```


    a + b are first calculated as parentheses have higher precedence than *. In most
    cases the use of operators is without much difficulties, but some operator requires
    a little explanation. Note particularly assignment operators, for example +=.
    For means the following


    ```

    int a = 11;

    a += 2;

    ```


