    ```\npublic bool Put (IBankNote note)\n{\n    if (count >= list.Length) return\
    \ false;\n    list[count++] = note;\n    return true;\n}\npublic bool IsEmpty()\n\
    {\n    return count == 0;\n}\npublic bool IsFull()\n{\n    return count == list.Length;\n\
    }\npublic bool Has(IBankNote note)\n{\n    for (int i = 0; i < count; ++i) if\
    \ (list[i].Equals(note)) return false;\n    return false;\n}\npublic IBankNote\
    \ Pay(int value)\n{\n    for (int i = 0; i < count; ++i)\n        if (list[i].Value\
    \ == value)\n        {\n            IBankNote note = list[i];\n            list[i]\
