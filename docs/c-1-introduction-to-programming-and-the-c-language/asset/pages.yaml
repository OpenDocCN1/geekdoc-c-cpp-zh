    First, notice the condition in the while loop in Main(). It is always true, and
    it is thus an infinite loop. This means that the loop and the program must stop
    in some other way. It occurs in the input method. If the user simply keys enter
    and does not anything, the statement is executed:


    ```

    Environment.Exit(0);

    ```


    which stops the program. One can discuss whether it is the way to do it, and it
    is also primarily included here to demonstrate that it is possible.


    The check for palindrome is performed by the method IsPalindrome(). The idea is
    to have an index to both the start and the end of the string. the characters are
    compared in pairs, and an auxiliary method CharOk() is used to test whether it
    is a character that must be included.


    In case of conditions, there are three major operators, as arguments have one
    or two conditions:


    +   * && takes two arguments of type bool and is a mathematical conjunction. This
    means that it is true if both its arguments are true.

    * || takes two arguments of type bool and is a mathematical disjunction. This
    means that it is true, if at least one of its arguments is true.

    * ! has an argument of type bool and is a mathematical negation. That is, it has
    the opposite value of the argument.


    The method CharOk() is used to test whether its parameter is a character to be
    counted: Whether it is a letter or a digit. The characters are arranged in natural
    order, but the three Danish letters are for themselves, which complicates the
    control bit. You will notice how the complex expression is built using the operators
    && ||. && has higher precedence than ||, strictly speaking, the parentheses can
    be omitted, but readability can be expressed in text like:


    ```

    if (ch at least a and ch is lower than z) or

    ch at least 0 and ch is lower than 9) or

    ch is or ch is ø & then ...

    ```


    The method IsPalindrome() use the operator to test the opposite value of the CharOk(),
    for example:


    ```

    if not CharOk(text[i]) then ...

    ```


    Note when the method IsPalindrome() is called in the Main() method the text (string
    entered) are first converted to lowercase with the method ToLower(). It is therefore,
    it is sufficient to test for the small letters in the method CharOk().


