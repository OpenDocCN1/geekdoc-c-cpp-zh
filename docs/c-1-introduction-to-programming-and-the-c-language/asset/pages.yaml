  md: "# Basic program architecture\n\nThe above example shows in principle the overall\
    \ architecture of a C# program which is a class that has a Main() as a starting\
    \ point. The example was very simple, the program consisted of only a single statement\
    \ in Main(). In this section I will write a program where there are several statements,\
    \ but also several methods. In this example, there is no special justification\
    \ for splitting the code into methods - just to show how a method is called and\
    \ written in C#. Methods are useful (necessary) for many reasons, but partly methods\
    \ can be used to subdivide the code into more manageable parts.\n\n# Exam02\n\n\
    Print a book\n\nThe goal is to write a program that on the screen can print information\
    \ about a book\n\n![](img/f84352ec481fd05dc2bc853aa8989838_17_0.png)\n\nHow to\n\
    \nOpen Visual Studio and create in the same way as in Exam01 Console Application\
    \ project. This time I have called the project Exam02, but otherwise all options\
    \ are as below.\n\nVisual Studio creates a skeleton for a program, and the resulting\
    \ code is shown below:\n\n```\nusing System;\nnamespace Exam02\n{\n    class Program\n\
    \    {\n        static void Main(string[] args)\n        {\n            Title();\n\
    \            More();\n        }\n\n        private static void Title()\n     \
