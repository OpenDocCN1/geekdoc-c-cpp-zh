  md: "# C# 1 Introduction to programming and the C# language\n\n# Program control\n\
    \nWhen, as above a variable is declared in the initialization part, the variable\
    \ is not known outside the for statement and the controlling block. You can declare\
    \ multiple variables in the initialization part:\n\n```\nfor (int i = 0, j = 1;\
    \ ...\n```\n\nbut they must have the same type. As for the condition there is\
    \ no other requirement than it should be a boolean expression. That can include\
    \ boolean operators, function calls, etc. The expressions section is typically\
    \ used to control a controlling variable in the condition, but generally it can\
    \ be anything that is an expression and also function call. The expression section\
    \ can contain multiple expressions if they are separated by a comma, for example:\n\
    \n```\nfor (...; ++i, j += 7);\n```\n\nIn the cases there is no advantage in applying\
    \ for instead of while, and seen from the program, has seldom the great importance\
    \ of loop structure is. The choice is usually determined by the nature of the\
    \ task, where one of the structures may be more appropriate to the other. However,\
    \ for is the most flexible and the most frequently used.\n\n# do\n\nThere is another\
    \ variant of the while statement, called a do loop that has the form:\n\n```\n\
    do\n{\n  statement;\n  ...\n}\nwhile (condition);\n```\n\nThe significance is\
    \ that the statements in the block are performed and then the condition is tested.\
    \ Is it true, repeat the loop and it continues until the condition becomes false.\
    \ Compared with the while statement is the difference that do always will perform\
    \ the block at least once, since the condition is first after the block is executed.\
    \ The do loop is not used as often as the other loops.\n\n# switch\n\nwhile, for\
    \ and do are control structures for loops or iterations, while if is a control\
    \ structure for branching or selection. In most cases, if is used for selections,\
    \ but there is an alternative, called switch. It is best explained by an example."
