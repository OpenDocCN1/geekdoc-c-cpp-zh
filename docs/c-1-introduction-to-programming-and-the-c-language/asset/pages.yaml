  md: "# C# 1 Introduction to programming and the C# language Inheritance\n\nAs a\
    \ member of a class is protected, it can be referenced by derived classes, as\
    \ it was public while it from objects of this class looks private. protected is\
    \ a visibility between private and public, which allows derived classes to refer\
    \ to members in the base class, while the base class maintains protection against\
    \ other classes. Stated differently, then variable monthly may be referenced by\
    \ subclasses of Employee, but not from classes that do not inherit Employee. class\
    \ should not make all of its variables protected, but only those that one must\
    \ expect the derived classes need to refer to. When you make a member protected,\
    \ you are only opening up the protection in relation to derived classes.\n\nIn\
    \ this case, protected is only included to explain the concept, the problem could\
    \ be solved in another way:\n\n```\npublic override int Monthly\n{\n    get {\
    \ return base.Monthly + (int)(sale * commission / 100); }\n}\n```\n\nwhere base\
    \ refers to the property Monthly, which is defined in the base class.\n\nThere\
    \ is no definition of the property Monthly in both Employee and Consultant, and\
    \ the meaning is that in Consultant shall override the property in Employee –\
    \ give it a different meaning. For that to be, you must in Employee open up for\
    \ it by declaring the property virtual:\n\n```\npublic virtual int Monthly\n{\n\
    \    get { return Monthly; }\n}\n```\n\nWhen that is the case, a derived class\
    \ – Consultant – can choose override the property by entering the keyword override.\
    \ If you do not, you get a warning that it hides the base class version.\n\nIt\
    \ was the class Consultant, and below is a method to show all the classes:\n\n\
    ```\nstatic void Test2()\n{\n    Constant c = new Consultant(\"Gudrun\", \"Madsen\"\
    , 2000, 10);\n    c.Sale = 30000;\n    Print(c);\n}\n```\n\nIf you run the method,\
    \ you get the result:\n\n![](img/f84352ec481fd05dc2bc853aa8989838_106_0.png)\n\
