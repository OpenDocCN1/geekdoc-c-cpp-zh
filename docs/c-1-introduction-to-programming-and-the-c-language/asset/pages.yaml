  md: "# C# 1 Introduction to programming and the C# language\n\n# Methods\n\n# Exam24\n\
    \n# Function overriding\n\nThis example shows a program and a class with three\
    \ methods of the same name.\n\nHow to\n\nThe class *Program* has the following\
    \ methods, all with the same name:\n\n```\nstatic int Max(int a, int b)\n{\n \
    \ return a < b ? b : a;\n}\n```\n\n```\nstatic double Max(double a, double b)\n\
    {\n  return a < b ? b : a;\n}\n```\n\n```\nstatic int Max(int a, int b, int c)\n\
    {\n  return Max(Max(a, b), Max(b, c));\n\n```\n\n# Explanation\n\nThe compiler\
    \ compares the first two, when the two parameters are of different type, and may\
    \ also separate the last when it has three parameters.\n\nNotice how the ? operator\
    \ is used. Also note how the last method actually calls the first.\n\nNote that\
    \ methods can't be separated on return type, but only on the parameters.\n\nThe\
    \ fact that a method can't be identified by the name only, but also of its parameters,\
    \ is sometimes called function overloading. Note also that it is not something\
    \ that is special to methods, but also applies to operators. If, for you write\n\
    \n```\nc = a + b;\n```\n\nit means something different depending on which types\
    \ of variables a and b are – for instance the type is an int or a string.\n\n\
    # Comment\n\nIn this example I have used the question operator. I have previously\
