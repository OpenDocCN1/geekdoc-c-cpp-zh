  md: "# C# 1 Introduction to programming and the C# language\n\nIt is not entirely\
    \ obvious. Note that the property that is executed for Monthly, is the one in\
    \ the class Consultant, even through the parameter to the Print() method is of\
    \ type Employee. This means that the system \"remembers\" the type of the current\
    \ object, even if the object in Print() is known as an Employee. It is an extremely\
    \ important option known as polymorphism.\n\nWhen you write a class, you have\
    \ no guarantee that in the future is one inherits the class and extends it with\
    \ new features – and that is also the idea of inheritance. However, there may\
    \ be situations where you do not want and then you can declare the class sealed,\
    \ meaning that it can be inherited. If example you do not want it to be possible\
    \ to inherit the class Director, you can define it as follows:\n\n```\npublic\
    \ sealed class Director : Employee\n{\n    public Director(string firstName, string\
    \ lastName, int monthly)\n    : base(firstName, lastName, \"Director\", monthly)\n\
    }\n```\n\n# Comment\n\nInheritance is not an especially difficult concept – at\
    \ least not when you've seen it a few times – but there are certain things one\
    \ must be aware of:\n\n+   - Class – for example Employee may have one or more\
    \ derived classes, but a class can inherit only one class.\n- Polymorphism – that\
    \ the runtime system remembers the specific type of an object (the type which\
    \ is used when the new object is created – is one of the most important concepts\
    \ of object oriented programming.\n\nMoreover, there are some names associated\
    \ with inheritance, that it is important to understand:\n\n+   - base\n- protected\n\
    - virtual\n- override\n\nYou can in the above examples to see how these words\
    \ are used."
