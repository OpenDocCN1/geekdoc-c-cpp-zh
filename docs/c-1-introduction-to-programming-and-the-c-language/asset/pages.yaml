  md: '# C# 1 Introduction to programming and the C# language


    # Exam10


    # A quadratic equation


    I''ll show a program that can solve a quadratic equation, and therefore a program
    that solves a classical task from school and mathematics teaching. A quadratic
    equation is expressed as:


    ```

    ax^2 + bx + c = 0

    ```


    The solution formula is:


    Given the discriminant : $d=b^2-4ac$ :


    | Solution: | no solutions if $d < 0$ |

    | | $-b$ |

    | | $2a$ if $d = 0$ |

    | | $-b \pm\sqrt{d}$ |

    | | $2a$ if $d > 0$ |


