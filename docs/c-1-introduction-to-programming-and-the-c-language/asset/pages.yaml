  md: "# 15 Static members\n\nI would like once again to look at static members in\
    \ a class. Both variables and methods can be static, and indeed a class can be\
    \ static.\n\nWhen you create an object of a class, you create simultaneously the\
    \ data elements as simple variables and other objects the class's instance variables\
    \ define. Each object of the class has its own copy of all instance variables,\
    \ and if an object changes the value of an instance variable it only concerns\
    \ the object itself.\n\nThings are different with static variables as a static\
    \ variable is created only for the first time an object of the class is created.\
    \ This means that all objects created from the same class share a static variable,\
    \ or differently that a static variable is not tied to a particular object.\n\n\
    A good example of using a static variable is a random number generator – an object\
    \ of type Random – as in the classes Coin and Dice. Here it is important that\
    \ all objects (for example Dice objects) use the same random number generator.\
    \ The static random number generator is initialized by the declaration of the\
    \ static variable:\n\n```\nprivate static Random rand = new Random();\n```\n\n\
    It is not always possible or desirable, and one can instead initialize static\
    \ variables in a static constructor that has no other purpose than initialize\
    \ static variables. For example you could write the class Dice, as follows:\n\n\
    ```\npublic class Dice\n{\n  private static Random rand;\n  private int ojene;\n\
    \n  static Dice()\n{\n    rand = new Random();\n  }\n```\n\nThere is no justification\
    \ for it in this case, but a static constructor is executed the first time a program\
    \ creates an object of the class. You can't override a static constructor – there\
    \ are no options to transfer parameters.\n\nAlso, methods can be static. If you\
    \ have a static method, you can use it without having an object of the class,\
    \ and the method is referenced by setting the class name before method name."
