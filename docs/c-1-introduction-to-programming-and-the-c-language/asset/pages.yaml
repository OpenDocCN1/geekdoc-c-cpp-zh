  md: '# C# 1 Introduction to programming and the C# language


    using Datatypes;


    Main() there is an object


    ```

    Person pers = new Person("Valborg Kristensen", "Klog kone");

    ```


    and the task is to write this object as a file. This means that it is necessary
    to store the two member variables name and position as the objects of the string
    type. One thing is to save the object, but you must also be able to read the object
    again, and as it is mentioned above you also store information about the object''s
    type. The object is stored as raw bytes, and for it again can be loaded as a Person
    object – consisting of two objects of the string type – should this information
    be saved with the object''s data bytes. It is process that is called serialization,
    and for this to be possible, both the object''s type must be defined Serializable,
    and all the object''s instance variable must be Serializable. In this case, all
    are met, the Person class is defined Serializable, and the member variables have
    the string type, which is Serializable. The same is the case for all the simple
    types and for types of .NET framework.


    To serialize an object you must use a so-called Formatter. There are several options,
    and the different Formatter types are defined in the namespace System.Runtime.Formatters,
    but common to them is they serialize an object with the information necessary
    for the object to be deserialized. They differ, however, regarding the format
    in which the object is stored. In this case I use a binary formatter that store
    an object in a binary format.


