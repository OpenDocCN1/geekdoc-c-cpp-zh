  md: "# C# 1 Introduction to programming and the C# language Methods\n\nbut when\
    \ it happens in the activation block on the stack, the two variables t1 and t2\
    \ are unchanged after the Swap() is executed.\n\nIt should however be aware of\
    \ what it means to reference types, since the result here may be different than\
    \ expected. Consider the example of the class Point, and the following method,\
    \ which has a Point\n\n```\nstatic void Mul(Point p, int t)\n{\n  p.X *= t;\n\
    \  p.Y *= t;\n}\n```\n\nIf you execute the following statements:\n\n```\nPoint\
    \ p = new Point(2, 3);\nMul(p, 2);\nConsole.WriteLine(p);\n```\n\nyou get the\
    \ result\n\n(4,6)\n\nand thus the method Mul() changed the Point object. Just\
    \ it does not seem as the parameter is transferred as copy on the stack. The method\
    \ Mul() has two parameters, and here is the type of the first parameter Point\
    \ thus a class. The actual parameter is thus a reference, and is placed on the\
    \ stack, which means that the Mul() method refers to the same object as the program.\
    \ As a result, this object is changed.\n\nIf you change the Mul() method to the\
    \ following\n\n```\npublic void Mul(Point p, int t)\n{\n  p = new Point(p.X, p.Y);\n\
    \  p.X *= t;\n  p.Y *= t;\n}\n```\n\nthe method would create a new Point object\
    \ and the reference on the stack will refer to this object. When Mul() terminates,\
    \ its activation block is removed, and the reference to the new object is gone,\
    \ and thus the change that Mul() performs. The result is that the object to which\
    \ the program refers to is unchanged, and the program will write\n\n(2,3)\n\n\
    So there is reason to pay attention to what happens if you transfer references\
    \ as parameters to a general value parameter.\n\nDownload free eBooks at bookboom.com"
