  md: '# #28 Text files


    A text file is a file containing a number of lines, where each line is a string.
    The strings in .NET are represented as unicode sequences of characters, each character
    is written as 2 bytes to the file, but it is enclosed by IO system. Text files
    are still important. for exchanging data in the form of comma delimited files
    or similar. One should also note that, for example HTML or XML files are text
    files.


    # ## Exam51


    # ## Write and read text


    I will write a program that shows how to write and read a simple text file. When
    the program runs, the user must enter text lines, and they are saved in a file.
    The entry is terminated when the user simply presses Enter, and the program will
    then read the file and print the content on the screen.


    # How to


    To create a file and to write it can be described by the following algorithm:


    ```

    open/create the file

    get data

    as long as there are data

    write a line in the file

    get data

    close the file

    ```


    and the important thing is that it is actually happening in the same way every
    time, and it is just the operation get data which may vary. In the same way, reading
    a text file can be written as the following algorithm:


    ```

    open the file

    read a line

    as long as there is a line

    use the line

    read a line

    close the file

    ```


    and here it is again important to note that the procedure is the same regardless
    of the content of the file, and only the operation use the line varies.


    The program can be written as follows:


    ```

    using System;

    using System.IO;

    ```'
