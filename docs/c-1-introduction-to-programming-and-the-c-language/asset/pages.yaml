  md: '# C# 1 Introduction to programming and the C# language


    The program will be called lotto, and below are examples of legal commands:


    ```

    lotto -n 20

    lotto -a 1 -b 48 -r 6 -n 20 -o uge42.txt

    lotto -i uge42.txt -u 2 13 18 22 34 35

    lotto -i uge42.txt -u 2 13 18 22 34 35 -o uge42Res.txt

    ```


    Generally there are the following requirements for the command line:


    +   - All options have a default value (a, b, r, o) may be omitted.

    - Options may appear in any order.

    - There must be no conflicting options (eg. -r and -i) on the same line.


    The concept of a lottery coupon is not included in the program because it does
    not make sense – a lottery game is in principle one big coupon that can have an
    arbitrary number of rows.


    There are following requirements to the lotto rows:


    +   - The numbers in each lotto row must be sorted in ascending order.

    - The same number must not occur more than once.

    - The rows must be sorted in ascending order (the first row after the next number,
    etc.).

    - The first row define the game and contains the date, the smallest and largest
    legal lottery number and the number of lottery numbers per row.


    The result of the verification must be a file (the screen by default) that contains
    all rows, but for each row is added a number indicating the correct of correct
    lottery numbers. The result should be sorted by this number in descending order.


    A particular issue is error handling. If you enter an illegal command, for example
    because it is incorrect, missing or conflicting options, illegal lotto numbers,
    illegal files, etc., the program will terminate with an error message and the
    program''s syntax. It is standard action for commands.


    In a check of the week''s lotto there is an illegal row, the count of correct
    lottery numbers are replaced with a short error message, and possibly illegal
    rows must be placed last in the result.


