    First the program print the capacity of the list that at the start is 0. However,
    it is possible to create a list, using as a parameter to the constructor that
    sets the starting capacity. After the addition of an element, the program prints
    the capacity. It is now 4, which means the first time you add an item to the list
    it allocates space for 4 elements. After added two more elements and prints the
    capacity again and the number of elements, they are respectively 4 and 3, which
    is not surprising. As a next step the program insert two elements at the beginning
    of the list (in position 0) with the method Insert(). The capacity is then 8 (is
    doubled), and the number of elements is 5. Then the program deletes two elements,
    and the capacity is still 8. It should be noted that a list automatically shrinks.
    For last loop all elements in the list, and the important thing here is to note
    that one can use the index operator.


