    Interfaces


    There are basically two objectives for interfaces. In the first place this is
    a good programming principle to define a subject in the form of an interface,
    that is for IPurse above. It is said that one should program to an interface.
    In that the definition and implementation is separated, and the important thing
    is that the code that uses the subject only knows through the interface and is
    completely independent of the implementation. This ensures that you can change
    the implementation without the need to modify the code that use subject. Programming
    to an interface may therefore help to ensure that you get a code that is easier
    to modify. The above program is "almost" independent of the implementation of
    the interface IPurse and there is only a place where the implementation is clear,
    where the Main() creates the purse:


