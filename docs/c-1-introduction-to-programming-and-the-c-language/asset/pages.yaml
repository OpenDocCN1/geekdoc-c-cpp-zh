  md: 'C# 1 Introduction to programming and the C# language


    Part 1 Introduction to C


    # # Part 1 Introduction to C#


    A computer program is a family of commands executed in a specific order that solves
    a specific task. A program is written as a text document that contains all the
    necessary commands. This document is called the programs code or source code.
    The individual commands must be written in a very precise way, that the computer
    can understand them, and it is here a programming language comes into picture.
    A programming language provides rules for how the commands should be written.
    There are many programming languages, and although they are different, each with
    their advantages and disadvantages, the similarities outweighs the differences,
    and once you have learned one language, it is easy to learn the next. Throughout
    this book the programming language C# is used, which is a widely used language
    in the Microsoft world.


    As mentioned above, you write a program as a text document (in several or many)
    and the program is thus a simple document with commands. Commands are also called
    statements. Because these commands or statements are just text, the machine cannot
    immediately execute the commands, but they must first be translated into an internal
    format that the computer understands. This process is called translation or compilation
    and executed by a program that can convert statements written in a particular
    programming language for the computer''s internal commands. The program is usually
    called a compiler. During the translation the program is controlled for errors,
    and if there are errors, you get an error message and the error must be corrected
    before the program is translated anew. Not all errors are found during compilation,
    but only syntax errors are errors where a statement is not written in accordance
    with the programming language rules. A compiled program can easily contain other
    errors, for example a wrong calculation.


    To write a program, you naturally have to learn the programming language, but
    you must also learn how to solve a task and formulate your solution using the
    language''s statements. It is the latter that is the hardest, and there is rarely
    a unique solution. Solving a problem and formulating your solution by a program
    language is also called writing an algorithm. Programming is therefore largely
    a matter of writing algorithms, something which I will return to.


    When you have to write a program, you need a tool that can be used for entering
    the program code, and in principle one could do that with Notepad and the compiler,
    but in practice you will always use a specific development tool, because it makes
    the job much easier. In the following I will use throughout Visual Studio, that
    is Microsoft''s general development tool for a wide variety of tasks, including
    writing code in C#. It is an integrated package that contains all the tools necessary
    for the development of a number of different program types.


