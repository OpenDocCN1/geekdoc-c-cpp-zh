  md: "# C# 1 Introduction to programming and the C# language\n\n# Explanation\n\n\
    The method Deserializer() tries to deserialize an object of the type Person saved\
    \ in the F:\\Temp\\Person.dat. The first program creates a BinaryFormatter. Next,\
    \ it creates a stream to the file and the object is deserialized. The method returns\
    \ the object if it is possible to deserialize a Person object (if the file exists\
    \ and it contains a Person object). If not, the method returns null. Note that\
    \ it is necessary with a type cast to a Person object.\n\n# Comment\n\nWhen you\
    \ deserialize an object, it may be the same type as the type it is serialized\
    \ as. Here we must remember that an object's type is also identified by the namespace\
    \ that contains its type. That is why I in the above examples have placed the\
    \ class Person in a class library so that Person is the same type in both programs.\n\
    \n# Exam63\n\n# XML serialization\n\nThis example is, in principle, exactly the\
    \ same as the previous two, but instead of using a BinaryFormatter the program\
    \ use a XmlSerializer, so the object is stored as XML, instead of binary data.\n\
    \n# How to\n\nAgain, start with putting a reference to the dll with the class\
    \ Person. The code is as follows:\n\n```\nusing System;\nusing System.IO;\nusing\
    \ System.Xml.Serialization;\nusing Datatypes;\n\nnamespace Exam63\n{\n    class\
