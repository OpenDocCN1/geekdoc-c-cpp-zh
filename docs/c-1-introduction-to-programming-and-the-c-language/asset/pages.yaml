  md: "# C# 1 Introduction to programming and the C# language\n\nThis means that the\
    \ program create another variable on the stack, which is a copy of p1. Note that\
    \ p3 is a new variable, which has the same value as p1, but this is not a reference\
    \ to p1. It can be seen changing the value of p3, and that change does not affect\
    \ p1.\n\n# Comment\n\nThe syntax for a struct is as for a class other than that\
    \ the word class is replaced by the word struct. A struct can have constructors\
    \ just as a class, properties and methods, and the only difference here is that\
    \ a struct always have a default constructor, which can't be overwritten. A struct\
    \ can implement an interface, but a struct cannot inherit. Aside from that there\
    \ is no difference.\n\nThe difference between a struct and a class is that on\
    \ application. Typically, a struct is used to encapsulate a few simple data types\
    \ to achieve a better performance when it is a value type. Therefore you will\
    \ often skip properties, making variables public, as in the case the Point. When\
    \ an object is allocated on the stack, there can be only one reference to it,\
    \ and the need for data encapsulation is not the same as for heap-allocated objects.\n\
    \n# Copying struct's\n\nWhen a struct is a value type, it means that if you assign\
    \ a variable to another variable, it is a really copy\n\n```\nPoint p1 = new Point(2,3);\n\
    Point p2 = p1;\n```\n\nwhere p1 is copied to p2. You must be special aware that\
    \ if a struct has instance variables of reference type, since it is only the references\
    \ that are copied and not the objects which they refer. If you are not aware of\
    \ that, it sometimes produce unexpected results. For an example, consider the\
    \ class Dice:\n\n```\nclass Dice\n{\n    private static Random rand = new Random();\n\
    \    private int eyes;\n\n    public Dice()\n    {\n        Throw();\n    }\n\n\
    \    public int Eyes\n    {\n        get { return eyes; }\n    }\n\n    public\
    \ void Throw()\n    {\n        eyes = rand.Next(1, 7);\n    }\n}\n```"
