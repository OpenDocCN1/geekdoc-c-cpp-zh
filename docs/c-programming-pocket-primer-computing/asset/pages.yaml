  md: '# Coding Guidelines


    Simple and clear programs, with appropriately commented code blocks, are preferred
    because they will be easier to understand, debug, and enhance (as a general rule).
    Some guidelines include:


    +   1. Keep functions (discussed in Chapter 4) short and meaningful

    +   2. Each function has one primary purpose

    +   3. Avoid complex logic involving multiple nested if-blocks

    +   4. Avoid comment code blocks that are complex or non-intuitive

    +   5. Avoid commenting every line of code


    Keep in mind that the preceding rules are intended as general guidelines and they
    can be broken if it increases code clarity (but try to do so sparingly).


