  md: '`/usr/include` is included by default, so it’s unnecessary to specify this
    directory.


    On the other hand, suppose you create the header file `mytime.h` that is located
    in the `/usr/local/include` directory. Then the following code snippet will enable
    the compiler to find `mytime.h` in the correct location:


    ```

    -I/usr/local/include

    ```


    The advantage of the preceding code snippet is that you won’t need to explicitly
    reference the contents of this directory in your custom header files or custom
    C programs.


    In addition, you can use the following switch in order to instruct the compiler
    to search the current directory for header files:


    ```

    -I.

    ```


    Yet another option involves specifying a directory—relative to the current directory:


    ```

    CC=gcc

    IDIR =../include

    CFLAGS=-I$(IDIR)

    ```


    # Specifying Libraries


    The make utility allows you to specify a library in a makefile in two ways.


    The shorthand way involves 1) removing the “lib” prefix, 2) removing the suffix,
    and 3) specifying “-l” (lowercase l) as the prefix for whatever remains after
    performing steps #1 and #2.


    For example, if you want to include the library `/usr/lib/libm.a` as part of the
    process of creating an executable, specify the string “-lm” in order to include
    this library.'
