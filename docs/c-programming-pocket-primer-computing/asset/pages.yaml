  md: 'Recursion is a powerful technique that can provide an elegant solution to various
    problems, such as factorial values, Fibonacci numbers, and the GCD of two positive
    integers via the Euclidean algorithm.


    One interesting (and perhaps counterintuitive) fact: the expressive power of recursion-based
    algorithms is the same as that of iterative algorithms (i.e., neither type of
    algorithm is more “powerful” than the other one). However, there is a sort of
    asymmetry involved when working with algorithms to solve various tasks. For instance,
    the task of calculating Fibonacci numbers via recursion is straightforward, whereas
    an interactive solution is far from obvious. An even more interesting task is
    called the Tower of Hanoi, which can be solved in a very elegant manner via a
    recursive algorithm. If you feel sufficiently motivated, try implementing the
    solution via an iterative algorithm (and good luck with that!).


    Yet another task that can be solved in an elegant manner involves the recursive
    definition of Ackermann functions, which has a “two-dimensional” recursion that
    makes it more complex (more interesting?) than the typical “one-dimensional” recursion
    that you will find in common recursion-based tasks. Ackermann functions are outside
    the scope of this book, but details about Ackermann functions are available through
    an Internet search.


    However, let’s not dismiss the suitability of iterative solutions for recursion-based
    tasks. For example, the definition of the factorial value of a non-negative integer
    is recursive, yet its iterative solution is very straightforward and elegant in
    its simplicity (if we ignore storage requirements). The takeaway point is simple:
    use the algorithm that works best for your'
