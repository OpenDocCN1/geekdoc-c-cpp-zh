- pgno: 18
  md: 'If you are adequately prepared and motivated, you will learn how to write C
    programs that involve various C data types, loops, conditional logic, built-in
    functions, custom functions, and recursion.


    This book saves you the time required to search for relevant code samples, adapting
    them to your specific needs, which is a potentially time-consuming process. In
    any case, if you’re not sure whether or not you can absorb the material in this
    book, glance through the code samples to get a feel for the level of complexity.


    # WHAT ARE THE STRENGTHS OF THIS BOOK?


    The top three strengths of this book can be summarized as follows:


    +   1. This is a modern textbook with up-to-date information regarding the C11
    standard

    +   2. There are detailed explanations of the code samples because nothing is
    assumed, which means that beginners can work through the examples side-by-side
    with the explanation

    +   3. No assumptions regarding the level of programming skills of the readers


    One other point to keep in mind: as you might have noticed, many introductory
    books are written assuming a computer science background: this book arguably is
    readable without that theoretical foundation.'
  merge: -1
  img_proc: true
