  md: 'This section contains examples that reinforce the information in the previous
    section, with expanded explanations to reinforce the correct way to define pointers
    in C.


    As you saw in the preceding section, a pointer in C is declared by putting an
    asterisk (*) in front of the variable name in the declaration statement, as shown
    here:


    ```

    ```c

    int *p;

    ```

    ```


    The "*" operator dereferences a variable: this means that whenever you have a
    pointer to a memory location, use the "*" operator to obtain whatever is referenced
    by the pointer variable.


    Note that the * character has multiple meanings. When it appears in a declaration,
    it acts as part of the data type to declare a pointer. When it appears in an expression
    to the left of a pointer it is the dereference operator, which accesses the data
    that the pointer currently points to. When it appears in an expression between
    two numeric values, it acts as the multiplication operator.


    What if you want to access the value of a non-pointer variable? You can use the
    "&" operator to obtain the memory location of a non-pointer variable, after which
    you can access the value of that variable. For example, consider the following
    code snippet:


    ```

    ```c

    int x = 7;

    int *p = &x;

    ```

    ```


    As you can see, the variable x in the preceding code snippet has type int and
    has the value 7, whereas the variable p is a pointer to the memory address that
    is allocated for the variable x.'
