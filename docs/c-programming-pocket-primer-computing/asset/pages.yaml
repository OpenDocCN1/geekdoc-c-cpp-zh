  md: "The preceding C struct requires 8 bytes of memory even though the values are\
    \ either 0 or 1. Alternatively, the following C bitfield definition is more compact:\n\
    \n```\nstruct\n{\n    unsigned int validDay: 1;\n    unsigned int validMonth:\
    \ 1;\n} dateInfo;\n```\n\nOn a typical system where an int is 32 bits, the previous\
    \ C struct uses 4 bytes for the dateInfo variable, and 2 bits of memory for its\
    \ elements. If you specify up to 32 bit values, the dateInfo variable requires\
    \ 4 bytes. However, if you specify between 33 and 63 bit values, the dateInfo\
    \ variable requires 8 bytes (you can no doubt see the pattern here).\n\nNow let’s\
    \ look at Listing 7.13 that displays the contents of Bitfields.c to illustrate\
    \ how to define bitfields in C.\n\n# LISTING 7.13: Bitfields.c\n\n```\n#include\
    \ <stdio.h>\n#include <string.h>\n\n// define simple structure\nstruct\n{\n  \
    \  unsigned int widthValidated;\n    unsigned int heightValidated;\n} status1;\n\
    \n// define a structure with bit fields\nstruct\n{\n    unsigned int widthValidated\
    \ : 1;\n    unsigned int heightValidated : 1;\n} status2;\n```"
