- pgno: 25
  md: '# CHAPTER 1


    # INTRODUCTION TO C


    Since this book is for advanced beginners, the first chapter contains topics that
    will prepare you to compile and execute simple C programs. Consequently, the coverage
    of the historical details regarding C is sparse: they rarely help you to learn
    in C, and if you are really interested, you can find those details in various
    online articles. Moreover, this chapter does not contain all the minutiae of C
    because they simply are not necessary in an introductory C programming book (besides,
    you will learn those details on an as-needed basis if you become a full-time C
    programmer).


    Stated in simple terms, the goal of this chapter is to make its contents as useful
    and relevant as the other chapters in this book (i.e., no filler material just
    because it''s Chapter 1). In particular, this chapter starts with the rudimentary
    aspects of C and also shows you how to create, compile, and execute a C program,
    all of which is discussed in the first half of the chapter.


    Although this chapter contains a mixture of topics, the flow of the technical
    material is essentially sequential and logically structured. The non-sequential'
  merge: -1
  img_proc: true
- pgno: 26
  md: 'code samples contain C features before they are formally introduced. Fortunately,
    the purpose of those out-of-sequence features is clear: for example, the printf()
    function is obviously for printing things.


    So, although the code samples in this book minimize “forward referencing” technical
    details, it’s sometimes a good way to make the code samples more interesting and
    useful. For instance, the section about for loops in Chapter 2 contains conditional
    logic (even though if/else statements are discussed later in that chapter) in
    order to present more meaningful code samples that are still easy to understand.


    With all the preceding points in mind, let’s quickly go over the major sections
    of this chapter. The first part briefly discusses some of the command-line tools
    that are available for C programs, such as gcc (required), make (optional and
    discussed in the Appendix), and lint (also optional), as well as an editor for
    creating C source code. This section also discusses the location of other “standard”
    files that you will often use in your C programs.


    The second portion of this chapter contains a brief introduction to the C programming
    language, along with some advantages of C, some of the available versions of C,
    and an overview of the structure of C programs. You will also see a “hello world”
    program in C and how to compile this program from the command line.


    The third portion of this chapter discusses data types in C, binary and ternary
    operators, and naming conventions for variables in C programs. The next portion
    contains code samples with alphabetic types and how to calculate mathematical
    quantities, such as ceiling values, floor values, absolute values, and trigonometric
    values in C.'
  merge: -1
  img_proc: true
- pgno: 27
  md: 'The fourth part of this chapter contains a brief introduction to arrays in
    C and how to add the numbers in an array. This section provides a sort of segue
    into Chapter 2 (which contains details and code samples about arrays) as well
    as Chapter 5 (which contains examples of C arrays and pointers).


    After you complete the smorgasbord of topics in this chapter, you will be in a
    good position to absorb the material in the remaining chapters of this book.


    # COMMAND LINE TOOLS


    Although the lower-level details of compiling, linking, and loading a program
    are important, you can learn how to compile C programs with just a few details.
    This section describes various command line tools, some of which are optional
    (at least for now).


    # The gcc Compiler


    The gcc utility compiles C programs and generates an executable file that you
    can launch from the command line. This utility has many options, and the one that
    we need for the code samples in this book is the "-o" option. Use this option
    in order to specify the name of the executable file to create after having compiled
    the relevant C program(s).


    For example, if you have a C program called MyTest.c, you can create the executable
    MyTest with the following command: (the switch -std=c11 is discussed in Chapter
    2):


    ```

    gcc -std=c11 MyTest.c -o MyTest

    ```'
  merge: -1
  img_proc: true
- pgno: 28
