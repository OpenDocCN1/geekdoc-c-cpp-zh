    # PASS BY REFERENCE VERSUS VALUE


    In [Chapter 4](#), this topic was briefly mentioned, and in this section you will
    see an example of using a pointer to pass a data structure to a function.


    In abstract computer science terms, there is a distinction between "pass by reference"
    and "pass by value". In a pass by value function call, local copies are made of
    all the arguments so the function cannot change any data in the calling scope.
    Pass by reference means that only references to the data are passed, so any changes
    made by the function affect the actual data in the caller. There is no "pass by
    reference" mechanism in C, so this behavior is typically emulated by passing a
    pointer to the actual data. In other languages which have a pass by reference
    syntax such as C++ or C#, pointers are not used for this purpose.


    [Listing 6.4](#) displays the contents of PassByPointer.c that illustrates how
    to pass by reference and by value.


