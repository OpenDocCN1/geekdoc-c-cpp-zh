    # BIG MAKE AND LITTLE MAKE


    As you saw earlier in this Appendix, the file Makefile is called “big make” and
    the file makefile is called “little make.” If you type make on the command line,
    it will search for “big make” and execute the first target in that makefile. If
    “big make” does not exist, the make utility searches for “little make” and execute
    the first target in that makefile.'
