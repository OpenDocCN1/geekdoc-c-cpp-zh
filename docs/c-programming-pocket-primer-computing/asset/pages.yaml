    # # WORKING WITH BUILT-IN FUNCTIONS IN C


    The built-in functions in C can return any of the supported C types, such as character,
    strings, pointers, pointers to functions, and so forth. All the C programs in
    this book contain a `main()` function that always returns an `int` type. What
    is the significance of this return value? You need information (i.e., some form
    of documentation, even if it’s just a comment block) that describes the purpose
    of different values for a given return type.


    However, some C functions do not return any value, in which case they have a return
    type of `void`. Note that some languages (such as Fortran) make a distinction
    between functions that return a value (they’re called functions) and functions
    that do not return anything (they’re called subroutines), but C does not make
    such a distinction.


    Yet another scenario involves “call by reference” versus “call by value,” which
    you will sometimes see in functions that have return type of `void`. The idea
    is straightforward: the former involves passing a memory location (i.e., a reference)
    of an argument to a function, whereas the latter involves passing a complete copy
    of an argument to a function. Both options are in the next section.


    # ## Pass by Reference versus Pass by Value'
