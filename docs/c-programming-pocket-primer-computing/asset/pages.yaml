    # SYMBOLIC CONSTANTS


    Unlike languages such as Java, C supports a #define keywords that enables you
    to define a symbolic name or symbolic constant, which is often a number or a string,
    and its format is shown here:


    ```

    #define MYNAME some_text_goes_here

    ```


    For example, the following snippet assigns a number to the string PI:


    ```

    #define PI 3.1415962

    ```


    The C preprocessor (which is external to the C language) uses text substitution
    in order to replace every occurrence of the string PI in your C program with the
    value that is defined in the preceding code snippet.


    One convenient use of #define is for constants that represent escape sequences.
    For example, it’s convenient to use the following definitions for a linefeed,
    carriage return, and form feed, whose octal values are 012, 015, and 014, respectively:


    ```

    #define LF ''\012''

    #define CR ''\015''

    #define FF ''\014''

    ```


