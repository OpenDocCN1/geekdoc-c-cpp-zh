  md: 'C supports a variety of convenient built-in functions to perform various tests
    on a character, such as determining whether a character is alphanumeric, alphabetic,
    a control character, a numeric digit, or a lowercase or uppercase letter. Here
    is a list of many of those functions (all of which have a return type of int),
    along with a brief description (many functions are intuitively named functions):


    +   - int isalnum(int c): tests if c is alphanumeric

    +   - int isalpha(int c): tests if c is alphabetic

    +   - int iscntrl(int c): tests if c is a control character

    +   - int isdigit(int c): tests if c is a numeric digit

    +   - int islower(int c): tests if c is a lowercase character

    +   - int isupper(int c): tests if c is an uppercase character

    +   - int isgraph(int c): returns nonzero if c is any character for which either
    isalnum or ispunct returns nonzero.

    +   - int isprint(int c): returns nonzero if c is space or a character for which
    isgraph returns nonzero.

    +   - int ispunct(int c): returns nonzero if c is punctuation

    +   - int isspace(int c): returns nonzero if c is space character

    +   - int isxdigit(int c): returns nonzero if c is hexa digit

    +   - int tolower(int c): returns the corresponding lowercase letter if one exists
    and if isupper(c): otherwise, it returns c.

    +   - int toupper(int c): returns the corresponding uppercase letter if one exists
    and if islower(c): otherwise, it returns c.'
