  md: "contains a miscellaneous assortment of other features of the make utility.\n\
    \n# WHAT IS THE MAKE UTILITY?\n\nThe make utility is a binary executable that\
    \ reads the contents of a text-based “makefile” in order to execute commands.\
    \ The make utility searches (in the current directory) for a file named `Makefile`\
    \ and if this file does not exist, it searches for a file named `makefile`. If\
    \ neither file exists, then the make utility fails with this message:\n\n```\n\
    make: *** No targets specified and no makefile found. Stop.\n```\n\nAs you will\
    \ see later in this Appendix, you can use the `-f` switch for the make utility\
    \ in order to specify a makefile with a different name. In this Appendix the term\
    \ “makefile” will refer to the file `Makefile` (“big Make”) as the default file.\n\
    \n# What is in Makefile?\n\nThe file `Makefile` typically contains so-called rules\
    \ for executing various commands, such as compiling out-of-date C programs. Without\
    \ going into the syntax rules (we’ll discuss them later), here are the contents\
    \ of a `Makefile` that contains a single rule for creating a binary executable\
    \ called hello:\n\n```\nhello: HelloWorld.c\n\tgcc -Wall HelloWorld.c -o HelloWorld\n\
    ```\n\n*Note that the second line in the preceding code snippet starts with a\
    \ mandatory `<tab>` character that is not visible in this page.*\n\nYou can also\
    \ specify additional files that are not included by default during the compilation\
    \ process. For"
