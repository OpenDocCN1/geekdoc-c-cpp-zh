- pgno: 32
  md: 'Compiled C provides low-level access to memory and required minimal run-time
    support, and it was intended to encourage cross-platform programming. Indeed,
    portably written C programs can be compiled on a wide variety of computer platforms
    and operating systems with minor changes to the C code.


    C is a compact yet intricate low-level language that requires a non-trivial amount
    of effort to learn well. For instance, C supports different sizes of integer variables,
    along with an intricate set of low-level operators. As another example, C supports
    Unicode (discussed briefly in Chapter 7), whose rules and exceptions are more
    complex than other languages.


    # **What is Special About C?**


    C is the language of systems programming, and various operating systems have been
    written in C (albeit with portions of assembly code as well). C is also the language
    of small microcontrollers. Moreover, C provides you with a glimpse into the internal
    workings of a computer that’s not possible in other, high-level languages. You
    might be surprised to discover that the Java and Python virtual machines were
    initially implemented as C programs, and then they are compiled from C code to
    binaries.


    Incidentally, the C++ language (which is an extension of C) is also a low-level
    structured programming language. You can create a C struct (a data type that is
    discussed in Chapter 7) whose memory layout matches the physical hardware registers
    on a particular device, which is very useful when writing operating system device
    drivers (and not possible in the vast majority of other languages).'
