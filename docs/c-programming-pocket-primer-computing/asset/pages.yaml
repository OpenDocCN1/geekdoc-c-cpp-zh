- pgno: 336
  md: "checks the timestamp of a file and its dependencies in order to determine whether\
    \ a target must be invoked. In addition, when dependencies are checked, updates\
    \ are performed recursively.\n\nFor example, if a C source code file has a timestamp\
    \ that is more recent than its corresponding executable, then the associated target\
    \ in the makefile is invoked, and the associated commands are executed.\n\nIn\
    \ many cases the purpose of the makefile is to create an executable, and the associated\
    \ target is often the first target in the makefile. For example, if `FindMain2`\
    \ is the first target in a makefile, then make will execute the commands for the\
    \ target `FindMain2`.\n\n> **NOTE** By default \"make\" always runs the commands\
    \ from the first target in the makefile, but not any of the commands in other\
    \ targets.\n\nIf you do not specify the \"-o\" switch the compiler will create\
    \ the default executable whose name is `a.out`.\n\n+   In general terms, a makefile\
    \ contains one or more entries, where each entry consists of the following:\n\
    +   \n+   - a target (usually a file)\n+   - its dependencies (the files that\
    \ the target depends on)\n+   - the commands to invoke (based on the target and\
    \ dependencies)\n\nKeep in mind that dependencies are transitive. For example,\
    \ if A depends on B and B depends on C, then A depends on C. Examine your C programs\
    \ to determine the dependencies for each file and then add the appropriate target\
    \ to your makefile."
