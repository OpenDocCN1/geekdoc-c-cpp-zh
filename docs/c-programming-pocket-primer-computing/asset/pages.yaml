  md: "# What is “Short Circuiting”?\n\nIn general, if an expression contains multiple\
    \ and statements, the result is false if any of the and statements is false, and\
    \ therefore there is no need to check the remaining and terms (if any). This behavior\
    \ is called “short circuiting,” a simple example is shown here:\n\n```\nint x\
    \ = 3;\nif( (x < 4 ) && (x > 5)\n&& (x < 0))\n{\n    // do something\n}\nelse\n\
    {\n    // do something else\n}\n```\n\nIn the previous compound if expression,\
    \ (x > 5) is false, so there is no need to evaluate the other portions of the\
    \ if expression, and the else portion is executed.\n\nShort circuiting occurs\
    \ in other types of conditional logic. For example, if a compound if expression\
    \ succeeds at an intermediate point, then the remaining portion of the compound\
    \ if expression is not evaluated. Here is an example:\n\n```\nint x = 3;\nif(x\
    \ > 5)\n{\n    // do something\n}\nelse if (x < 4)\n{\n```"
  merge: -1
