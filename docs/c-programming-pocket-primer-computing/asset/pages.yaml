    # INCREMENTING POINTERS: MEMORY LOCATION VERSUS VALUE


    C supports pointer arithmetic (i.e., addition and subtraction). You need to understand
    the difference between adding (incrementing) a pointer *location* and adding (incrementing)
    the *value* of a pointer. In fact, we already saw an example of accessing the
    location of a pointer in Listing 5.2.


    In other to illustrate this difference, consider the following code snippet:


    ```

    ```cpp

    char array[5];

    char *array_ptr = &array[0];

    ```

    ```


    In the preceding code snippet, *array_ptr* is the same as array[0], and *(array_ptr+1)*
    is the same as array[1], and *(array_ptr+2)* is the same as array[1], and so on.
    Note the use of parentheses.


    However, (*array_ptr*)+1 is not the same as array[1], because the +1 is outside
    the parentheses, which means that it is added after the dereference. Consequently,
    the expression (*array_ptr*)+1 is the same as array[0]+1.


    Recall that an array consists of a block of consecutive memory locations, each
    of which holds an element of the array. For example, if the array `myarr` starts
    from the memory location `0xff001320`, then `myarr[0]` has the same address, whereas
    `myarr` occupies the memory location that—in the case of an integer—is 4 bytes
    beyond this location: `0xff001324` (for a double it would be 8 bytes).'
