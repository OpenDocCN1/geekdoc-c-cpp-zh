  md: "The bubble sort is a well-known algorithm for sorting an array of numbers.\
    \ This algorithm has O(n^2) complexity, where n is the number of items in the\
    \ array. Although this book is not about algorithms in C, this section contains\
    \ the C code for the bubble sort to familiarize you with the C syntax for such\
    \ an algorithm.\n\nListing 7.4 displays the contents of BubbleSort.c that illustrates\
    \ how to use the bubble sort in order to sort an array of integers.\n\n# LISTING\
    \ 7.4: BubbleSort.c\n\n```\n#include <stdio.h>\n\nint main()\n{\n    int numbers[]\
    \ = {5, 1, 2, 4, 3};\n    int count = sizeof(numbers)/sizeof(numbers[0]);\n  \
    \  int temp;\n\n    printf(\"Original: \");\n    for(int i=0; i<count; i++)\n\
    \    {\n        printf(\"%d \",numbers[i]);\n    }\n    printf(\"\\n\");\n\n \
    \   for(int i=0; i<count-1; i++)\n    {\n        for(int j=i; j<count; j++)\n\
    \        {\n            if(numbers[i] > numbers[j])\n            {\n         \
    \       temp = numbers[i];\n                numbers[i] = numbers[j];\n       \
    \         numbers[j] = temp;\n            }\n        }\n    }\n```"
