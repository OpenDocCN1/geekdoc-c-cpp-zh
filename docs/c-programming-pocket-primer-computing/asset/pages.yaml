  md: 'of a variable in a declaration. This variable may be used to point to any value
    of the appropriate type, or it can be set to `NULL` to indicate that it does not
    currently point to any value. Pointer can be declared for nearly any type of data,
    such as `int`, `long`, a user-defined `struct` (discussed in Chapter 6), or even
    a function. There is also a specific type of pointer: it has the syntax `void
    *` that is used to point to data whose type is not known.


    A "pointer to a pointer" is defined with two asterisks (`"**"`) and contains a
    memory address indicating where another pointer is located. One of the most common
    uses for pointer-to-a-pointer data types is simulating resizeable two-dimensional
    arrays.


    The most important thing to be aware of when using pointers is that a pointer
    must always point to data of the appropriate type before it can used. Attempting
    to access a value "through" an invalid pointer is a common cause of failure and
    must be avoided.


    There is another detail to keep in mind. When you assign a value to a pointer,
    the "thing on the right side of the equals sign" can be a hard-coded character
    string such as `"Hello"` (shown in the earlier list of examples). Why doesn''t
    this violate the rule specified in the preceding paragraph? A quoted string (known
    as a "string literal") has a data type of "pointer to `char`. Since C has no built-in
    string data type, a string literal is treated as a pointer to its first character.


    If you feel unsure of the meaning of the preceding paragraphs, the following subsections
    contain code examples that will make everything clear.


