    A compromise of sorts is to create an array to keep track of the distinct characters
    in a given string, and another array to keep track of the number of times that
    each character appears in that string. The first array would have length 52 if
    you are keeping track of uppercase and lowercase letters, and if you want to accommodate
    punctuation and special characters, you would need an array of size 100 (approximately).
    Keep in mind that this number will increase for some other languages, and it’s
    impractical for writing systems such as Kanji.


    Notice that the preceding scenario does not comprise a hash table: a hash table
    has “lookup time” O(1) for any character, whereas the lookup time for an array
    is O(n), where n is the number of elements in the array. Note that the “lookup
    time” in the previous sentence refers to the time required to find an element
    in an unsorted array. If you perform a linear search in an array, the expected
    number of searches required to find an element is n/2, and the latter is O(n).


    However, if you store the unique characters of larger documents (100K and above)
    in an array, and you also store their frequencies in another array, then the lookup
    time is no greater than the number of characters that exist for the language in
    which the document is written.


