    \ navigating into a subdirectory and invoking the make utility with the -f switch\
    \ to specify the makefile called BranchMakefile and the target goodbye.\n\nThe\
    \ third target creates the object file HelloWorld.o, and the final target is the\
    \ clean target that removes the files"
  merge: -1
  img_proc: true
- pgno: 350
  md: "HelloWorld and HelloWorld.o.\n\n# **LISTING A.14: SubBranchMakefile**\n\n```\n\
    ```makefile\nCC=gcc\nCFLAGS=-g -Wall\nRM=/bin/rm\n\n# 'goodbye' creates GoodbyeWorld\n\
    goodbye: GoodbyeWorld.c\n\t$(CC) $(CFLAGS) GoodbyeWorld.c -o GoodbyeWorld\n\n\
    # 'GoodbyeWorld.o' creates GoodbyeWorld.o\nGoodbyeWorld.o: GoodbyeWorld.c\n\t\
    $(CC) $(CFLAGS) -c GoodbyeWorld.c\n\n# removes GoodbyeWorld and GoodbyeWorld.o\n\
    clean:\n\t$(RM) GoodbyeWorld GoodbyeWorld.o\n```\n```\n\nListing A.14 starts with\
    \ several familiar macro definitions, followed by three targets whose syntax is\
    \ also familiar to you. Note that the `goodbye` target in this makefile is invoked\
    \ indirectly via one of the targets in the makefile in Listing A.13.\n\nNow type\
    \ the following command from the directory that contains the `BranchMakefile`\
    \ in Listing A.13 (and *not* from the subdirectory):\n\n```\n```text\nmake -f\
    \ BranchMakefile\n```\n```\n\nThe output from the preceding command is here:\n\
    \n```\n```text\necho top-level directory...\ntop-level directory...\ngcc -g -Wall\
    \ HelloWorld.c -o HelloWorld\necho going to branch...\ngoing to branch...\ncd\
    \ ./branch; /usr/bin/make -f BranchMakefile goodbye\ngcc -g -Wall GoodbyeWorld.c\
    \ -o GoodbyeWorld\n```\n```"
  merge: -1
  img_proc: true
- pgno: 351
  md: "Although the preceding example is somewhat artificial, you can see how to adapt\
    \ the makefiles to handle multiple subdirectories containing source code for your\
    \ project.\n\n# CREATING A LIBRARY ARCHIVE FROM OBJECT FILES\n\nListing A.15 displays\
    \ the contents of `Makefile8` that illustrates how to create a library containing\
    \ a set of object files that are located in the current directory.\n\n**LISTING\
    \ A.15** Makefile8\n\n```\n```makefile\nRM=/bin/rm -f\nAR=/usr/bin/ar\nMYLIB=mylib.a\n\
    \n# only the 'hello' target\nall: lib\n\n\n# create a library with .o files\n\
    lib: FindChar2.o FindMain2.o HelloWorld.o\n\t$(AR) r $(MYLIB) $?\n\nclean:\n\t\
    $(RM) $(MYLIB) 2>/dev/null\n```\n```\n\nListing A.15 contains familiar macro definitions,\
    \ followed by the `all` target that depends on the `lib` target. As you can see,\
    \ the `lib` target depends on three object files, and the command that is executed\
    \ is the `ar` command that updates the library `mylib.a` with the three object\
    \ files.\n\nNow type the following command in a command shell:"
  merge: -1
  img_proc: true
- pgno: 352
  md: "```\n```sh\nmake -f Makefile5 lib\n```\n```\n\nThe output is displayed here:\n\
    \n```\n```text\n/usr/bin/ar r mylib.a FindChar2.o FindMain2.o HelloWorld.o\nar:\
    \ creating archive mylib.a\n```\n```\n\nNow type the following command:\n\n```\n\
    ```sh\nmake -f Makefile5 clean\n```\n```\n\nThe output is displayed here:\n\n\
    ```\n```text\n/bin/rm -f mylib.a 2>/dev/null\n```\n```\n\n# ## CREATING AN ARCHIVE\
    \ LIBRARY IN A SHELL SCRIPT\n\nYou can also use a shell script createlib.sh to\
    \ create a library that contains all the object files in the current directory,\
    \ as shown here:\n\n```\n```sh\nmylib2=\"mylib2.a\"\n```\n```\n\n```\n```sh\n\
    for f in `ls *.o`\ndo\n    echo \"Adding object file $f\"\n    ar r $mylib2 $f\n\
    done\n```\n```\n\nOpen a command shell, navigate to the location of createlib.sh,\
    \ and enter the following commands:\n\n```\n```sh\nchmod +x createlib.sh\n./createlib.sh\n\
    ```\n```\n\nThe output is shown here:\n\n```\n```text\nAdding object file FindChar2.o\n\
    ar: creating archive mylib2.a\nAdding object file FindMain2.o\nAdding object file\
    \ HelloWorld.o\n```\n```"
