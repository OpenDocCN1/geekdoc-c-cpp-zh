- pgno: 29
  md: 'Check for C11 compliance with the -std switch:


    ```

    gcc -std=c11 -o test test.c

    ```


    Display all warning messages with the -Wall switch:


    ```

    gcc -std=c11 -Wall -o test test.c

    ```


    Create an object file with the -o switch:


    ```

    gcc -std=c11 -o test test.c

    ```


    Create an assembly file with the -s switch:


    ```

    gcc -std=c11 -S test.c

    ```


    Include debugging information with the -g switch:


    ```

    gcc -std=c11 -g test.c

    ```


    If you decide later to remove debugging information, then either recompile without
    the -g switch or use the strip command.


    Display all options applied at each compilation step with the -v switch:


    ```

    gcc -std=c11 -v test.c

    ```


    Specify the path /usr/lib/ with the -L switch:


    ```

    gcc -std=c11 -L/usr/lib test.c -o test

    ```


    Display help information for gcc:


    ```

    gcc --help

    ```


    There are also environment variables for the gcc command, such as TMPDIR, which
    specifies the location of a temporary directory. An example of the value for the
