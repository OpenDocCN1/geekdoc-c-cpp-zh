- pgno: 205
  md: "You might think that the preceding `while` loop is \"stuck\" in an infinite\
    \ loop because the value of the variable `index` *is never incremented.* In fact,\
    \ the statement `++index;` is \"attached\" to the `while` loop, and eventually\
    \ the loop will terminate.\n\nThe following code snippet is equivalent to the\
    \ preceding code snippet. However, the syntax is explicit and emphasizes the fact\
    \ that the variable `index` is incremented during each iteration in the `while`\
    \ loop:\n\n```\n```c\nwhile (array[index] != 0)\n{\n    ++index;\n}\n```\n```\n\
    \nThe preceding code block is 100% unambiguous (even to a novice). Another advantage\
    \ of the preceding code snippet is that you can easily add more code inside the\
    \ curly braces without accidentally forgetting to include the existing `++index;`\
    \ statement.\n\n# POINTERS, ARRAYS, AND ADDRESSES\n\n`Listing 5.10` displays the\
    \ contents of `PointersToNumbers2.c` that illustrates how to print the elements\
    \ (and their addresses) of a simple character array.\n\n**LISTING 5.10: PointersNumbers2.c**\n\
    \n```\n```c\n#include <stdio.h>\n\n#define ARRAY_SIZE 10\nchar array[ARRAY_SIZE\
    \ + 1] = \"0123456789\";\n\nint main()\n{\n    int index;\n```\n```"
