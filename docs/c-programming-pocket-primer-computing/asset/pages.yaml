    # Initializing Arrays


    C arrays start with an index value of 0, and the index value of the last element
    in the array is the array size minus 1. C allows you to initialize the values
    in an array in two ways: either one element at a time or via a single statement.
    An example of the latter is here:


    ```

    double balance[5] = {1.5, 2.0, 3.4, 997.0, 25.0};

    ```


    Notice that the number of values inside the pair of braces { } equals the number
    that is specified inside the square brackets [ ]. You can also omit the size of
    the array, and the compiler will handle the initialization, an example of which
    is here:


    ```

    double balance[] = {1.5, 2.0, 3.4, 997.0, 25.0, -123, 777};

    ```


    After initializing an array, you can also update the value of an element, as shown
    here:


