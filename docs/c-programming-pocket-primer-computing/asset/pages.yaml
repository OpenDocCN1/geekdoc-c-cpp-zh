  md: "The `_Thread_local` storage class is useful in multithreaded programming and\
    \ declares a variable that has a different value for each thread. The register\
    \ keyword used to be a hint to the compiler that a particular variable is used\
    \ frequently and should be placed in a processor register for fast access. Compiler\
    \ optimization has improved a great deal since the beginning of C and modern compilers\
    \ simply ignore the register hint.\n\n# Some examples of using these C specifiers\
    \ are:\n\n```\n```c\nregister int i;        // i is an int, register keyword\n\
    \                       // probably ignored\nextern int j;          // declaration\
