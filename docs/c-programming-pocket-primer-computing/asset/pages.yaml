- pgno: 20
  md: '“Four Cs”: they must be Clear, Concise, Complete, and Correct to the extent
    that it’s possible to do so, given the size of this book.


    # WHY ARE THERE TWO CHAPTERS ABOUT POINTERS IN C?


    A misunderstanding of pointers is the most common cause of crashes in C programs.
    Although C pointers can be explained quickly, code samples involving pointers
    can quickly become difficult to understand (and also error-prone). This is a difficult
    subject (even for advanced beginners) if you are unfamiliar with this functionality.
    Hence, one chapter about C pointers simply isn’t enough to become comfortable
    with this topic.


    As you will see, Chapter 5 contains basic code samples involving pointers, which
    are enough for simple C programs. If you want a deeper understanding of how to
    use pointer, read the code samples in Chapter 6, and experiment with your own
    variations of the code. If you want to become adept in a programming language,
    you need to actively practice writing code, which is especially true for C programs
    that involve pointers.


    # WHICH TOPICS ARE EXCLUDED?


    This book does not cover hashing, searching and sorting, file I/O, data structures,
    threads, sockets, IPC, pipes, shared memory, message queues, and other system-level
    functionality that are relevant for advanced and expert-level developers. These
    topics are'
  merge: -1
  img_proc: true
- pgno: 21
  md: 'excluded because they are not suitable for an introductory C book, and there
    are plenty of other concepts that you need to learn in order to write C programs.
    Note that Chapter 7 briefly covers bit manipulation and more sophisticated C operators
    that you will need to learn if you become a full-time C developer.


    # HOW DO I SET UP A COMMAND SHELL?


    If you are a Mac user, there are three ways to do so. The first method is to use
    Finder to navigate to Applications > Utilities and then double click on the Utilities
    application. Next, if you already have a command shell available, you can launch
    a new command shell by typing the following command:


    ```

    open /Applications/Utilities/Terminal.app

    ```


    A second method for Mac users is to open a new command shell on a Macbook from
    a command shell that is already visible simply by clicking command+n in that command
    shell, and your Mac will launch another command shell.


    If you are a PC user, you can install Cygwin (open source https://cygwin.com/)
    that simulates bash commands, or use another toolkit such as MKS (a commercial
    product). Please read the online documentation that describes the download and
    installation process. Note that custom aliases are not automatically set if they
    are defined in a file other than the main start-up file (such as .bash_login).'
  merge: -1
  img_proc: true
- pgno: 22
  md: '# WHAT ARE THE “NEXT STEPS” AFTER FINISHING THIS BOOK?


    The answer to this question varies widely, mainly because the answer depends heavily
    on your objectives. The best answer is to try a new tool or technique from the
    book on a problem or task you care about, professionally or personally. Precisely
    what that might be depends on who you are, as the needs of a data scientist, manager,
    student or developer are all different. In addition, keep what you learned in
    mind as you tackle new data cleaning or manipulation challenges. Sometimes knowing
    a technique is possible makes finding a solution easier, even if you have to re-read
    the section to remember exactly how the syntax works.


    If you have reached the limits of what you have learned here and want to get further
    technical depth about regarding C, there are various online resources and literature
    describing more complex features of C.'
  merge: -1
  img_proc: true
