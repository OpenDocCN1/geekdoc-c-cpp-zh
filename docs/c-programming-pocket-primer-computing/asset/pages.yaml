- pgno: 153
  md: 'A C function that invokes another function by passing an “updateable” parameter
    is known as “pass-by-reference.” This means that any changes to such an argument
    in the “called” function are reflected in the “calling” function. If a function
    contains a parameter that is a pointer to a memory location, then updates in the
    “called function” to that parameter are available in the “called function.” For
    example, passing the address of a large memory block is more efficient than either
    1) passing the contents of that memory block to a function, or 2) requiring the
    “called function” return a large modified memory block.


    On the other hand, passing arguments that cannot be modified in a “called function”
    is known as “pass-by-value.” Regardless of the calculations that are performed
    in the “called function,” the parameters that are passed to that function retain
    their original values in the “calling function.”


    In general, use pass-by-value for primitive data types or fairly small memory
    blocks. If you decide to use pass-by-value for an argument, that involves a pointer
    (discussed in Chapter 5 and Chapter 6); hence, use extra care when doing so in
    order to avoid bugs. As already mentioned in the previous section, if a “called
    function” makes various updates to a large block of memory, then pass-by-reference
    makes sense because it’s more efficient than pass-by-value.


    Except for some code samples in Chapter 7, the code samples in the other chapters
    involve pass-by-value functions. In the meantime, the following subsections contain
    lists of built-in functions according to their type.


    # Built-in Character Functions'
