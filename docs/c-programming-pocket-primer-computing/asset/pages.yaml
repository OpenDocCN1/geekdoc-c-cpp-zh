    # HANDLING USER INPUT IN C


    There are three pairs of built-in C functions for reading user input and then
    printing the result. The three input functions read a character, a single line,
    and a single line with a specified format. The first input function is getchar()
    that reads a single character from standard input (and returns an int).


    The second input function is gets() that returns a character pointer. The use
    of this method is deferred until you learn about C pointers (Chapter 5 and Chapter
    6). The third input function is scanf() that reads input from the standard input
    stream and scans that input according to format provided. The scanf() function
    also involves a pointer (so it will be deferred until after the discussion about
    pointers).


