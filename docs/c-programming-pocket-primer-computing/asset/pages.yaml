    # THE BEHAVIOR OF THE SCANF() FUNCTION (OPTIONAL)


    The behavior of the `scanf()` function in *Listing 2.21* depends on the type of
    input that is provided. Specifically, if the provided input does not match the
    format string, the variables are never initialized. The C specification is very
    clear as soon as there is a character from the input that does not match the “current
    part” of the format string that the `scanf()` function is trying to match, the
    matching process stops *immediately* without reading any more characters or assigning
    values to any more variables. In addition, anything that happens after the failure
    of the matching process is “undefined behavior.”


    For example, consider what happens when users provide the following input values
    after launching the code in *Listing 2.21*:


    ```

    Enter a string and an int: abc x y z


    Number of filled values: 1


    You entered values for the string and the int

    You entered the string abc and the number 1

    ```'
