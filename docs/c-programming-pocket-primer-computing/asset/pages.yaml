- pgno: 104
  md: 'Obviously, there is a mismatch between the input value x and the reported value
    1, which is entirely unrelated. How do you detect this scenario? One approach
    is to assign known values to the variables before calling `scanf()`. If the variable
    has a known value, and then in the process of failing `scanf()` sets it to 1,
    that would be a severe bug in the implementation of `scanf()`, which is highly
    unlikely.


    Trying to reason about “undefined behavior” is essentially a waste of time because
    absolutely *anything* can happen. However, here’s a synopsis of what might be
    happening if you want some sort of intuitive understanding. Since the variable
    `i` (in the previous invocation) has not been initialized yet, then from the point
    of view of the compiler, its “lifetime” has not begun. The variable shares a register
    with some other variable whose lifetime ends before the variable is initialized.
    The other variable happens to get the value 1 under some conditions, and since
    the variable is uninitialized, it simply gets whatever was left over in the register.
    Hence, *uninitialized variables must never be read*: the compiler is allowed to
    assume that variables are never read before they are initialized and it can and
    does make optimizations based on those assumptions.


    Note that not only does undefined behavior have no meaning, it can occur as soon
    as a compiler might be able to determine that it is inevitable. The way the code
    in Listing 2.21 is written, as soon as the `scanf()` function finishes with a
    less than complete result you have “undefined behavior.”


    In the case of the example at the beginning of this section, the “do absolutely
    anything” happens to be “on occasion under some specific circumstances, set the'
