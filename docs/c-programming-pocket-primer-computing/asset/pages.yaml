  md: "# UNIONS IN C\n\nIf you wish, you can extend the code in [Listing 7.9](#) in\
    \ order to implement a doubly linked list. If you are really ambitious, you can\
    \ modify the code in [Listing 7.9](#) in order to create other data structures\
    \ in C, such as circular lists, stacks, queues, and trees.\n\nC provides the union\
    \ data type that enables you to store different data types in the same memory\
    \ location. Although you can define a C union with multiple members, only one\
    \ member \"at a time\" can contain an actual value. The member that contains a\
    \ value can change repeatedly during the execution of a program, but there is\
    \ exactly one—at any given point in time—that contains a value.\n\nThe following\
    \ example shows you how to use the C union keyword to define a C union data type:\n\
    \n```\n```c\nunion MyData\n{\n    int i;\n    float f;\n    char str[10];\n} myunion;\n\
    ```\n```\n\nThe memory allocated to a C union equals the size of the largest member\
    \ of the union. Thus, the MyData type requires 10 bytes because the str element\
    \ occupies 10 bytes.\n\n[Listing 7.11](#) displays the contents of `Unions.c`\
    \ that illustrates how construct a C union that contains an integer, a float value,\
    \ and a character string.\n\n**LISTING 7.11: Unions.c**"
