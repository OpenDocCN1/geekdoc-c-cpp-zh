    Listing 5.10 starts with the #define directive (a preprocessor directive that\
    \ performs text substitution) that sets ARRAY_SIZE to the value 10. The next code\
    \ snippet defines the character-based variable array that is initialized with\
    \ 10 digits, which are treated as characters.\n\nRecall that characters occupy\
    \ one byte, and therefore consecutive array elements occupy consecutive memory\
    \ addresses. Next, a short int occupies two bytes, which means the memory addresses\
    \ of consecutive array elements increase by two (not by one).\n\nMoreover, C will\
    \ automatically perform the correct pointer arithmetic (i.e., increment by the\
    \ correct number). Hence, the expression array+1 is interpreted correctly: it\
    \ refers to the element with index 1 (i.e., the second element in the array).\
    \ In other words, array+1 increments the value of the index by 1 and does not\
    \ increment the address value by 1. As a result, the following code snippets are\
    \ equivalent:\n\n```\narray_ptr = &array[0];\narray_ptr = array;\n```\n\nThe output\
    \ from Listing 5.10 is here:\n\n```\n&array[index] (array+index) array[index]\n\
    0x0x1033e3020 0x0x1033e3020 0x30\n```"
