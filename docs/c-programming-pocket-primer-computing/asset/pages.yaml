- pgno: 353
  md: '# SUMMARY


    This Appendix introduced you to the make utility and how to use this utility to
    automate compilation-related steps for your C programs. You saw how to use Unix
    commands for managing object files and libraries, such as the ar command and the
    ranlib commands. Then you learned about the nm command to examine the contents
    of object files and archive libraries.


    Next, you saw how to create simple targets in a Makefile as well as how to use
    macros in a Makefile. In addition, you learned how to specify header files and
    library files in a Makefile, as well as how to invoke the make utility inside
    a Makefile. Finally, you learned how to create a shell script for creating an
    archive library.'
  merge: -1
  img_proc: true
