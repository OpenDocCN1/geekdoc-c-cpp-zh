    # Editors and IDEs


    The code samples in this book were written with the vim editor, which is available
    on all Unix/Linux machines, but you can use any text editor that’s convenient
    for you.


    In addition, there are IDEs available, but they aren’t necessary for the code
    samples in this book. If you prefer an IDE, Code::Block is a reasonable choice,
    or you can try Eclipse or NetBeans.


    Now that you have an understanding of the tools for creating and compiling C programs,
    and also some optional command-line tools, let’s look at the C programming language,
    the topic of the next section.


    # WHAT IS C?


    C is an imperative programming language with a static type system. C “maps” efficiently
    to machine instructions and is sometimes called “a high level assembly language.”
    In fact, C appears in operating systems and in computers from embedded systems
    to supercomputers.


    Dennis Ritchie developed C at Bell Labs (between 1969 and 1973), and it forms
    the foundation of the Unix operating system. In addition, C was standardized by
    the American National Standards Institute (ANSI) in 1989 (ANSI C) and subsequently
    by the International Organization for Standardization (ISO).'
