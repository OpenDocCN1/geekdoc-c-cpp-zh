  md: "# USING STRTOK() TO TOKENIZE A STRING\n\nConsider the case of a string that\
    \ has the form \"Last/First\", such as \"Smith/John\". The task is to split such\
    \ a string into two separate strings: the string on the left side of the \"/\"\
    \ symbol and the string on the right side of the \"/\" symbol. We can perform\
    \ this task via the built-in C function strtok().\n\nThe strtok() function takes\
    \ a pointer to a string (string_ptr) and a character to find (such as \"/\") as\
    \ its arguments. Next, we employ a while loop that finds subsequent tokens in\
    \ the remaining string.\n\nListing 6.2 displays the contents of Tokenize.c that\
    \ illustrates how to split a string into tokens (i.e., individual words).\n\n\
    # LISTING 6.2: Tokenize.c\n\n```\n```c\n#include <stdio.h>\n#include <string.h>\n\
    \nchar *delim = \"/\";\n\nvoid tokenizeString(char *str)\n{\n    // first token\
    \ = last name\n    char *token = strtok(str, delim);\n    char *second = token;\n\
    \    char *first;\n    int count = 0;\n\n    // print token after delimiter\n\
    \    while (token != NULL)\n    {\n        token = strtok(NULL, delim);\n```\n\
    ```"
