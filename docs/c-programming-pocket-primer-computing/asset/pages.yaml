    # SCOPE OF VARIABLES IN C


    The scope of a variable is a region of the program where a defined variable can
    be accessed. There are three types of variable scope in C programs:


    +   - Inside a function definition or code block (local variables)

    +   - Outside of any function definition (global variables)

    +   - As a parameter in a function definition (formal parameters)


    If a variable with the same name is defined globally and also as a formal parameter
    or inside a function definition, then the global variable has lower priority.
    Note that a variable cannot be defined twice, either globally or locally, which
    means that they must be defined in different scopes.


    # Global Variables in C Programs


    The rule regarding global variables is simple: avoid them as much as possible.
    One reason for the popularity of OOP (Object Oriented Programming) languages is
    the concept of encapsulation: variables are kept in the classes where they belong.
    The value of a variable is accessed and modified via "getters" and "setters" (also
    called "accessors" and "mutators").


    Although OOP languages do not remove the need for global variables in all cases,
    they enable you to vastly'
