    # WHAT ARE POINTERS?


    A variable declared with a "pointer" data type contains a memory address indicating
    where the actual data is located. With pointer data types it is common to say
    that the pointer variable "points to" the actual data rather than talking about
    a memory address. Here are some examples of data that a pointer "points to:"


    +   - a variable (such as `int x = 5;`)

    +   - the starting address of a string (such as `char *ptr = "Hello";`)

    +   - allocated via the built-in C `malloc()` function (discussed in Chapter 6)


    Variables with a pointer data type are declared by placing an asterisk ("*") immediately
    before the name'
