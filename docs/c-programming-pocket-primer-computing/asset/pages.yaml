    and download the `dmg` file in the “Command Line Tools for Xcode” option. After
    launching the `dmg` file to install `gcc`, invoke the following command from the
    command line:


    ```

    gcc -v

    ```


    If `gcc` is installed correctly, you will see output similar to the following:


    ```

    Using built-in specs.

    COLLECT_GCC=gcc

    COLLECT_LTO_WRAPPER=/opt/local/libexec/gcc/x86_64-apple-darwin16/7.2.0/lto-wrapper

