  md: "The heap and the stack are available for allocating memory in C programs, and\
    \ they are handled in slightly different ways.\n\nThe memory allocation for all\
    \ variables in the code samples in previous chapters is on the heap. The operating\
    \ system performs the memory allocation and you need not worry about freeing that\
    \ memory. On the other hand, memory that is allocated on the heap via one of the\
    \ `malloc`-related functions must be explicitly deallocated (otherwise you will\
    \ have a memory leak).\n\nFunction parameters and local variables are allocated\
    \ memory from the stack; anything that is allocated on the stack is automatically\
    \ deallocated when the associated function completes its execution.\n\n# UPPERCASE\
