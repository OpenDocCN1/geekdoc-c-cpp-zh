    # Function Prototypes


    A function prototype specifies the arguments (and their types) and the return
    type of a function. Although older versions of C did not require function prototypes,
    it’s a good idea to include them because they allow the compiler to check that
    the data types of the passed parameters are compatible with the data types of
    the declared arguments.


    An example of a function prototype is here:


    ```

    void findChar(char str[], char c);

    ```


    Function prototypes can be placed in a so-called header file that (by convention)
    has a .h suffix. The “header” file is then included (via a #include directive)
    in the C program that requires the function prototype. This technique improves
    code modularization and code re-use, which in turn enables to you create libraries
    for your projects.


    As a simple example of creating a header file and including that header file in
    a C program, suppose that the file FindMain2.h contains the following code:


    ```

    #include <ctype.h>

    #include <stdio.h>


    void findChar(char str[], char c);

    ```


