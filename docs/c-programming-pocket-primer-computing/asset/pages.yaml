    # STORAGE CLASS SPECIFIERS IN C


    There are 5 storage class specifiers in C:


    +   - auto

    +   - extern

    +   - static

    +   - register

    +   - _Thread_local


    The auto storage specifier indicates a variable has automatic storage duration.
    This is rarely used since it is the default. The extern keyword has to do with
    external linkage and is primarily used when declaring global variables in a header
    file. The static keyword has different meanings depending on context. It may declare
    a variable with static storage duration, which means its value persists over multiple
    invocations of a function. It may also declare a variable to have internal linkage.'
