  md: "# THE STRCPY() AND STRNCPY() FUNCTIONS IN C\n\nThe `strcpy(string1, string2)`\
    \ function copies `string2`, including the ending null character, to the location\
    \ that is specified by `string1` (notice that this is a right-to-left operation)\
    \ The `strcpy()` function operates on null-terminated strings. The string arguments\
    \ to the `strcpy()` function should contain a null character (\\0) that marks\
    \ the end of the string because no length checking is performed. Avoid using a\
    \ literal string for `string1`, but `string2` can be a literal string.\n\n*Listing\
    \ 2.11* displays the contents of `CopyFunction.c` that illustrates how to use\
    \ the `strcpy()` function.\n\n**LISTING 2.11: CopyFunction.c**\n\n```\n```c\n\
    #include <stdio.h>\n#include <string.h>\n\n#define BUFFER_SIZE 80\n\nint main()\n\
    {\n   char source[BUFFER_SIZE] = \"The initial string\";\n   char destination[BUFFER_SIZE]\
    \ = \"The target string\";\n   char *result;\n\n   printf(\"Before: %s\\n\", destination);\n\
    \   result = strcpy(destination, source);\n   printf(\"After:  %s\\n\", destination);\n\
    \n   return 0;\n}\n```\n```\n\n*Listing 2.11* uses the `#define` preprocessor\
    \ (discussed in more detail in *Chapter 7*) to set `BUFFER_SIZE` equal to 10."
