    The preceding line enables the `make` utility to search user-specified directories
    for header files.


    The -I option in the preceding line is actually passed to the compiler by the
    makefile; i.e., it is not passed on the command line to the make command. However,
    the make utility also supports a -I command which sets up a search path for makefiles.
