    to take into account the requirement of leaving out irrelevant variables during
    the search process, Mital and Falkenhainer (1990) introduced the concept of *dynamic
    constraint satisfaction* (DCSP), where a constraint solver is also able to reason
    about the activity states of variables. The following example shows such an activation
