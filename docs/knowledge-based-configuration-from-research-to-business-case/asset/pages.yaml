    # FIGURE 22.3


    Repair action in the PC configurator with S''UPREME.


    +   - Systems must be maintained, modernized, and updated to changed environmental
    or strategic situations. Changes in existing systems may lead to conflicts that
    must be repaired. Of course, the adapted system shall keep as many components
    and structures of the old system as possible. Also not all reconfiguration actions
    are equally costly. For instance, changing the RAM is usually less costly than
    changing the motherboard. Heuristic repair can deal with such reconfiguration
    tasks in a natural way by defining different costs for different repair actions.

    +   - It is easy to adapt the heuristics used by the solver by providing an explicit
    ordering of the constraint variables.


    The disadvantage of local search methods like heuristic repair is their incompleteness.
    If completeness is required then a complete backtracking solver can be used, although
    in practice without the right heuristic, complete methods can only be used for
    moderate problem sizes (e.g., up to a few hundred component instances).'
