  md: 'constraints on the existence and/or number of components and on the values
    of their attributes, depending on the existence and values of other components;
    for example, each electric light signal in the field requires the existence of
    an adequate hardware module, a module of type “M8” can control a maximum of eight
    lamps, the usage of LEDs excludes other lamp types on the same module, and so
    on.


    The configuration process for a specific station uses information about the field
    elements (names, track layout, speed limits imposed by properties of the environment
    such as downward slope, curve radius, etc.) and about the interfaces to neighboring
    stations and traffic controllers. From this information, all the data (parameters)
    needed by the railway interlocking system have to be derived and in some cases
    adjusted by the configuration engineer, taking into account the features provided
    by the selected technology (type of interlocking system). The engineer has to
    be informed about the alternatives in order to make an existing inconsistent configuration
    consistent (e.g., which components to add or delete, which values to change).


    Figure 16.4 shows a schematic representation of the configuration of a railway
    interlocking system. The upper left part represents the station with the railway
    tracks, points (switches), and signals (similar


