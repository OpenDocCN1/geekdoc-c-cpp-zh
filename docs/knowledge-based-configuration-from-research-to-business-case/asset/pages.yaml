- pgno: 126
  md: '**Table 8.6 Design principles of configurator user interfaces and technological
    foundations.**


    | Principle | Technological Foundations |

    |---|---|

    | Customize the Customization Process | Parameter Selection (Falkner et al., 2011)

    Adaptive Knowledge Acquisition (Burke et al., 2011) |

    | Provide Starting Points | Recommendation of Defaults

    (Falkner et al., 2011; Tiihonen and Felfernig, 2010)

    Recommendation of Knowledge Base Diagnoses (Felfernig et al., 2012) |

    | Support Incremental Refinement | Configuration Comparison

    (Felfernig et al., 2006a; Heiskala et al., 2003)

    Diagnosis Comparison (Felfernig et al., 2009) |

    | Exploit Prototypes to Avoid Surprises | Configuration Visualization (Fano and
    Kurth, 2003)

    Graphical Testing and Debugging (Felfernig, 2007) |

    | Teach the Consumer | Personalized Diagnoses (Felfernig et al., 2009)

    Explanations (Friedrich et al., 2011) |


    In such situations, diagnoses take over the role of explanations (see also Felfernig
    et al., 2014¹⁹). Beside these basic types of explanations, all the criteria for
    the development of configurator user interfaces discussed in the prior sections
    also contribute to a better understanding of the product domain and the underlying
    configuration knowledge bases. Customizing the customization process allows users
    to deal with topics they are interested in and as a consequence, to know more
    about relevant concepts of the product domain. Similarly, knowledge engineers
    can efficiently develop a basic understanding of the most relevant components
    and constraints part of the configuration knowledge base. The provision of starting
    points offers initial and reasonable settings in terms of, for example, a partial
    configuration and thus helps to reduce overheads related to the design of consistent
    configurations. Furthermore, starting points make knowledge engineering operations
    more efficient due to the availability of additional indicators of potential sources
    of inconsistencies.


    Knowledge engineers and domain experts are supported in developing a basic understanding
    of the tradeoffs with regard to alternative repair operations needed to restore
    the consistency of a knowledge base. Supporting the concept of incremental refinement,
    for example, on the basis of product comparison pages, helps the user to develop
    a clear understanding of existing tradeoffs in the space of solutions offered
    by the configuration knowledge base. Finally, prototypes that are visualizing
    alternative configurations can significantly help to develop a better understanding
    and clearer preferences regarding certain solution alternatives. In the context
    of knowledge base development, such visualizations help to understand alternative
    impacts of change operations on the next version of the knowledge base (Felfernig,
    2007).


    To summarize the discussed design principles for user interfaces of configuration
    environments, we provide an overview of these principles, including related technological
    foundations (see Table 8.6).'
  merge: -1
  img_proc: true
- pgno: 127
  md: '# ## 8.4 Usability Issues in Configurator User Interface Development


    The diversity of the configuration model has a strong influence on the design
    and structure of user interfaces—nevertheless certain commonalities can be identified.
    The *Configurator Database Project* provides a collection of online configurators
    and includes more than 800 entries. After analyzing configuration environments
    contained in this database, we detected that more than 50% of the analyzed configurators
    show the following basic characteristics:


    +   - Selected components are summarized at the end of the configuration process.

    +   - Products available for configuration are presented as images.

    +   - Process navigation, if available, is structured on a horizontal plane.

    +   - Choice fields are positioned next to and/or beneath the product picture.

    +   - Shopping cart, order button, and total price are clearly visible.


    A configurator application that takes into account the mentioned characteristics
    is depicted in Figure 8.8. It is intended as an example for developers of configurator
    applications. Important hints regarding the design of individual configurator
    user interface elements are the following:


    +   - The logo should be shown in a dominant position for a fast identification.

    +   - The navigation bar should be clearly visible and shown unfragmented.

    +   - The size of product (configuration) images should be sufficient to see details.

    +   - Selection box(es) should follow a logical clustering.

    +   - Prices (price tables) should be accessible in all steps of a session.

    +   - User preferences should be adaptable (e.g., by back/forward navigation).

    +   - Shopping cart and order-button should be available for completion purposes.


    Summarizing, a *close-to-reality approach* is recommended to reduce the uncertainties
    that a customer feels regarding a product that is not tangible yet. For a more
    detailed discussion on usability issues in configurator user interface development
    refer to Rogoll and Piller (2004).


    # ## 8.5 Conclusion


    With this chapter we provide an overview of relevant principles of developing
    user interfaces for configuration environments. In this context we focused on
    both types of user interfaces, interfaces for the end-user and interfaces for
    knowledge engineers and domain experts who are in charge of knowledge base development
    and maintenance. In addition to this discussion of design principles, we proposed
    a couple of technologies that help to achieve these principles.'
  merge: -1
  img_proc: true
