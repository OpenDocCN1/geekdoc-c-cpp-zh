  md: 'values may be introduced on lower levels. This, in combination with the closed
    world assumption³ is the basis for taxonomic inferences. For example, when any
    CPU can be fast or medium but a CPUD is always fast (refined inherited attribute
    value), and there is no other fast CPU (closed world assumption) then the system
    can infer that any fast CPU has to be a CPUD.


    +   - Partonomies define the decomposition of a configurable product. The parts
    that comprise a product are related to the composite together with a (minimum
    and maximum) multiplicity definition. For example, a HDUnit has one to four HDisk
    and one or two HDController parts. The concept of multiplicity allows for the
    specification of parts that can be either optional or required. Using the same
    component types within partonomies for different products is the key to define
    a large external variance with only a small internal variance.


    A component type describes a prototypical product or component, some sort of pattern
    of which instances are generated within a configuration process according to the
    multiplicity definition. The generated instances together with the values that
    have been selected for their attributes form the configuration result. For more
    information on this topic and structure-based configuration in general see also
    Günter (1995).


    Representing configuration knowledge for the inference engine engcon is based
    on a hybrid approach consisting of conceptual knowledge and constraint knowledge.
    Conceptual knowledge describes the products and the components from which products
    can be assembled. This means that conceptual knowledge describes the search space
    for possible configuration solutions. Constraint knowledge on the other hand narrows
    down this search space by defining situations that do not describe allowed configurations
    and thus must be avoided during the configuration process.


    A constraint defines restrictions on one or more attributes of one or more component
    types. It consists of a condition and an action. The condition describes a situation
    in which the action definition is relevant with respect to a configuration task.
    For example, constraint gc1 has the condition that an instance of component type
    CPUS is present within the configuration. The action is executed when the condition
    matches the contents of a running configuration process and thus restricts instances
    of the component types that appear within the condition. The constraint gc1, for
    example, limits the choice of motherboards to those of compatible type MBDiamond.
    This means that the component types and their relations describe the search space
    while the set of constraints restricts this space to the subset of actually buildable
    combinations (see Mailharro, 1998).


    Figure 23.1 shows a screenshot of encoway’s modeling tool K-Build. On the left
    side there are the two hierarchies: taxonomy on the top and partonomy on the bottom.
    We can see that an MBDiamond is a special MB (motherboard) that belongs to the
    component type Hardware and is part of PC. The tool K-Build uses the term “concept”
    to denote component types. On the right-hand side the attributes of MBDiamond
    are listed together with a reference to constraints that restrict its extension:
    gc1 in this example.


    engcon distinguishes different types of constraints that restrict the value assignment
    of attribute values, specialize an instance along the defined taxonomy, or decompose
    a component type according to its part definitions. A very expressive ready-to-use
    library comes along with the modeling environment'
