    +   - Proposal documentation in PDF format.


    # 17.6.5 Integration to SmartPlant 3D


    FLSmidth are introducing a plant design software called SmartPlant 3D, from Intergraph.
    This tool is used to design the plant process and layout. In order to streamline
    the process, FLSmidth have developed an add-in to SmartPlant that allows them
    to run Tacton Configurator within the SmartPlant user interface, to ensure that
    the products in the plant are correctly configured, with correct 3D models at
    the plant design level. The same configurations can then be accessed in the web-based
    configurator to generate additional documentation, mechanical CAD documents based
    on SolidWorks, and to process equipment orders into the ERP.


    # 17.7 Benefits


    The following are the main business benefits of the configurator perceived at
    FLSmidth.


    # 17.7.1 Less Time Spent on Product Configuration


    Without a configurator, it took hours to configure one product, and now it takes
    a few minutes. This applies to proposals as well as to order processing. A plant
    can contain hundreds of different configurations (many different configurable
    products and many different configurations of some of those products), so it adds
    up to a lot of time savings.


    # 17.7.2 Shorter Lead Times


    When product configuration required involvement of a few specialists, this created
    long lead times for proposals and order processing, beyond the effective time
    spent. This challenge has grown over time. FLSmidth used to have all the engineering
    specialists at the headquarters in Copenhagen, but has now acquired companies
    with different products all around the world. The product expertise is more spread
    out. Since FLSmidth sells complete plants with products from different places,
    this global distribution makes it more complicated and time consuming to generate
    proposals and process orders. Tacton Configurator eliminates this complication
    by making the expertise available anywhere. Lead times for all the product configurations
    in a project can be reduced from months to days.'
