  md: '(1/20 > 1/80). Alternative approaches to determine a preferred diagnosis for
    a set of inconsistent requirements are discussed in Felfernig et al. (2009, 2013b).


    # 13.4 Research Challenges


    The integration of personalization and recommendation technologies with configuration
    systems is still in its infancy. Next, we outline some of the primary topics for
    future research.


    **Decision phenomena.** Psychological theories identify and explain different
    types of decision biases in consumer decision-making. Consumers are influenced
    by the format of the information presented and as a consequence use different
    decision-making strategies in different contexts. This implies that the design
    of the user interface can have a major impact on the final outcome of the decision-making
    process. In the context of result pages the focus of our future work is the investigation
    of the existence of *decoy effects* (see, e.g., Huber et al., 1982). Decoy effects
    occur in situations where inferior (low-quality) *decoy configurations* are presented
    among other solutions. Effectively, decoys make other solutions ''look better''.
    Decoys can trigger a significant shift in the solution selection (purchasing)
    behavior of users. We are interested in answering questions regarding the upper
    bound for the number of products such that decoy effects still occur. Furthermore,
    we are interested in the interrelationship between solution diversity (typically
    measured by different types of similarity metrics; McSherry, 2004) and the existence
    of decoy effects. A further question is whether the positioning of the decoy solution
    in a result set has an impact on the magnitude of the decision bias (decoy effect).


    **Advanced recommendation algorithms.** Another topic for future work is to extend
    existing configuration-supporting recommendation algorithms to take into account
    structural variation of configurable products. This means to develop algorithms
    that do not rely on basic CSP representations but are also applicable with more
    complex, component-oriented product structures (see, e.g., the configuration model
    in Hotz et al., 2014). Furthermore, price and delivery time are often affected
    by numerous factors such as exact combination of options, and dynamic load of
    stakeholders such as manufacturing and supply chain. To take these aspects effectively
    into account when determining recommendations is a topic of future research.


    **Repair actions.** If no configuration can be found for a given set of user requirements,
    numerous alternative combinations of repair actions exist that can resolve the
    conflict; the number is exponential in the number of requirements (O''Sullivan
    et al., 2007). A major goal for future work is to extend the approach of Felfernig
    et al. (2009) by additionally taking into account different types of decision
    biases that potentially occur in the repair selection process. For example, Kivetz
    and Simonson (2000) investigated the impact of incomplete information on consumer
    choice. A series of studies indicates that choosing from sets with missing information
    can influence consumers'' tastes and purchase decisions (Kivetz and Simonson,
    2000). Repair actions can be regarded as incomplete information since repair alternatives
    typically include only a subset of the product attributes. In this context, we
    want to investigate whether the inclusion of additional attributes for explanation
    purposes can have an impact on the repair selection process.'
  merge: -1
  img_proc: true
- pgno: 201
  md: "**Novel approaches to solution search.** There exist two major approaches to\
    \ search a large space of possible solutions. A *query-based approach* supports\
    \ the specification of search criteria that have to be taken into account by the\
    \ final solution; this is the typical approach supported by existing configuration\
    \ environments. The other alternative to support users is to provide *navigation-based*\
    \ interfaces that allow an easy navigation in the solution space. Such a navigation\
    \ is supported by determining solutions that are similar to the currently presented\
    \ solution and present this new solution to the user. Navigation-based interfaces\
    \ are well established in the area of recommender systems (specifically critiquing-based\
    \ ones). The applicability of these recommendation approaches in configuration\
    \ scenarios is a major research issue.\n\n# 13.5 Conclusion\n\nIn this chapter,\
    \ we presented a selected set of recommendation strategies that help to personalize\
    \ the product configuration experience by supporting users in configuring products\
    \ according to their individual requirements. We discussed methods for the recommendation\
    \ of feature values and the personalized ranking of configurations. We see our\
    \ contribution as an important step on the way towards more intelligent configuration\
    \ user interfaces that help to improve the quality of applications in different\
    \ dimensions such as prediction accuracy or overall satisfaction with the configuration\
    \ environment.\n\n# References\n\n+   Bagley, C., Helferning, A., Tiihonen, J.,\
