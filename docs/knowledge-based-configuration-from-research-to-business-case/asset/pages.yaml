- pgno: 242
  md: '# 17.7.3 More Standardized Configurations


    Without the configurator, specialists tend to create special proposals that are
    more customized than necessary. The configurator enforces a standardization that
    reduces the cost of supplying the products.


    # 17.7.4 Improved Quality of Configurations


    There are an extreme number of rules to obey in configuring a cement plant. Not
    just product configuration, but also rules about the cement production process
    as well. The human element increases the risk of mistakes, and it is not feasible
    to involve specialists in every revision made in a project. The use of the configurator
    thereby reduces the risk of incorrect configurations.


    # 17.7.5 Increased Market Share


    With the drastic cuts in lead time and cost of proposals, FLSmidth can now make
    more proposals and gain a bigger share of the market.


    # 17.8 Conclusion


    This paper has presented FLSmidth and their experience of implementing Tacton
    Configurator for their cement plant products. Critical success factors are: a
    powerful constraint-solving engine supporting a high degree of interactivity and
    ease of constraint modeling, integrations to sizing calculations, integrations
    to related systems such as 3D CAD, plant design, and legacy ERP, as well as resources
    dedicated to configuration modeling who are skilled engineers knowledgeable about
    the products and their applications. A lot of resources are required for modeling
    and integration, but the benefits are very significant for the business.


