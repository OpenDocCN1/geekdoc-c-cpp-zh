- pgno: 158
  md: '**Model.** A *model* is a specific kind of work product. A work product is
    anything produced, consumed, or modified by a process. Examples for work products
    besides a model are documents and source code.


    **Finish-start.** If activity B has a *finish-start dependency* with respect to
    activity A, then B can only start after A has finished (strict sequencing, no
    parallelism). Such dependencies represent dependencies between configuration activities.


    The dependencies in Figure 10.5 are the only order aspects; the order of the other
    configuration activities, especially the acquisition of features, is not fixed,
    and, thus, must not be modeled. Furthermore, the configuration of a subsystem
    does not need to be finalized before a next subsystem is configured. Instead,
    after selecting parts for one subsystem these parts might well be changed due
    to decisions in the configuration of another subsystem in order to gain an optimal
    solution. After such changes, other parts have to be updated to get a correct
    solution. It is common for configuration tasks that a customer changes his requirements
    during the configuration process of a technical system.


    # 10.6 Characteristics of the Smarthome Model


    Compared to the working example introduced in Hotz et al. (2014), the Smarthome
    model covers two additional characteristics of configuration models, which the
    following subsections summarize:


    +   - The separation of features and realizing components through a feature model
    and a system model (see Subsection 10.6.1)

    +   - The modeling of a workflow for the configuration process (see Subsection
    10.6.2)


    # 10.6.1 Characteristics of the Separation of the Feature and System Model


    The feature model is quite simple while the system model is more complex because
    of the internal structure of the components (e.g., a sensor aggregate which composes
    sensors). For example, in the feature model, the user determines if light groups
    should be switchable or dimmable. In the system model, decisions between distinct
    devices or device categories have to be made to realize this feature. The feature
    model provides a user view of the system. It can be directly used for the configuration
    process, by acquiring the desired features from the user. Through the direct connection
    to the system model, the realizability of the selected features can be ensured
    by configuring the components directly after the features were selected.


    The feature model and the system model can easily be represented with the modeling
    facilities of a typical configuration system. For example, features can be represented
    as attributes with Boolean values or with classes and cardinalities. For a detailed
    description of modeling facilities, refer to Hotz et al. (2014).


    # 10.6.2 Characteristics of the Introduction of a Workflow


    The building automation system demonstrates the need of a workflow for structuring
    configuration activities in complex configuration tasks because the configuration
    activities depend on each other. For example, it is not possible to start the
    configuration process with an arbitrarily chosen configuration'
  merge: -1
