- pgno: 336
  md: "# 26.2.2 Compositional Structure\n\nA feature type defines its compositional\
    \ structure through a set of subfeature definitions. A subfeature definition specifies\
    \ a subfeature name, a nonempty set of possible subfeature types (allowed types\
    \ for brevity), and a cardinality indicating the valid number of subfeatures.\n\
    \nIn a configuration, subfeatures (parts) of a feature individual are realized\
    \ with feature individuals. The realizing feature individual(s) “fill the role”\
    \ created by the effective subfeature definition. An explicit empty realization\
    \ is possible, when cardinality 0 is allowed. An “optional part” common in industrial\
    \ products is modeled as a subfeature that allows an empty realization. A default\
    \ realization can include attribute values and subfeature realizations of arbitrary\
    \ depth. In addition, an empty realization (special value none) can be set as\
    \ the default realization. Inherited subfeatures can be refined by restricting\
    \ allowed types, cardinality, or by modifying or hiding default subfeature realizations.\n\
    \nThe compositional structure is shown in the subfeature hierarchy tree (lower\
    \ left-hand side of Figures 26.1 and 26.2). Drag & Drop from the feature type\
    \ tree enables adding allowed feature types, subfeature definitions, and defaults.\n\
    \nThe right-hand side of Figure 26.2 shows an overview of subfeatures of the feature\
    \ type HDUnit. Each HDUnit has as part named HD_Controllers 1 to 2 individuals\
    \ of any subtype of HDController, and as Hard_disks 1 to 4 individuals of any\
    \ subtype of HDisk. No defaults are set for the subfeatures.\n\nIn the textual\
    \ PCML presentation the corresponding part of the configuration model is expressed\
    \ as follows:\n\n```\nfeature HDUnit\n  subtype of PC_Component\n```\n\n![](img/214a17cc1f5bbf0914497c7414128438_336_0.png)\n\
    \n# FIGURE 26.2\n\nCompositional structure of HDUnit in VariSales Modeling Tool."
  merge: -1
  img_proc: true
- pgno: 337
  md: "```\nsubfeature Hard_disks\n  allowed features HDisk\n  cardinality 1 to 4\n\
    \nsubfeature HD_Controllers\n  allowed features HDController\n  cardinality 1\
    \ to 2\n```\n\n# 26.2.3 Constraints\n\nA feature type can define constraints.\
    \ In this example, we only apply hard constraints that define conditions that\
    \ a correct configuration must satisfy. A configuration is considered consistent\
    \ if and only if no hard constraint in any feature individual is violated. If\
    \ any hard constraint is broken, the purchase process cannot be completed, for\
    \ example, placing the configuration in the shopping cart is prevented.\n\nConstraints\
    \ are expressed in a constraint language and named uniquely within a feature type.\
    \ The first-level building blocks of the constraint language are references to\
    \ access subfeatures, attributes of features, and constants such as integers or\
    \ strings. References can be used in succession, for example, to access an attribute\
    \ of an individual realizing a subfeature. Tests returning Boolean values are\
    \ constructed using references, constants, and arithmetic expressions. Tests include\
    \ predicates for checking if a particular referenced individual exists or is of\
    \ a given type. Attribute references can be used with constants in arithmetic\
    \ expressions. These can be compared with the usual relational operators to create\
    \ a test. Tests can be further combined into arbitrarily complex Boolean expressions\
    \ using the standard Boolean connectives.\n\nThe VariSales Modeling Tool provides\
    \ several ways to define constraints: textually, graphically, and as table constraints.\
    \ Tab Constraints (Figure 26.1) in Feature type overview lists the constraints\
    \ of the active feature type in textual form and facilitates adding new constraints.\n\
    \nMany constraints are relatively simple, often in the form of requires- and incompatible-\
    \ relationships. To make entering and modifying simple constraints easier, VariSales\
    \ Modeling Tool has a graphical constraint editor. It is possible to use the and\
    \ and or connectives to create subexpressions. These subexpressions can be used,\
    \ for example, as requiring, required, or incompatible factors in more complex\
    \ graphical expressions.\n\nFigure 26.3 illustrates the constraint crc1 (see Table\
    \ 26.1 and Section 26.2.1 for textual PCML representations), created with the\
    \ graphical constraint editor. First, the constraint was named, and the requires\
    \ symbol was brought to the canvas. Arguments and subexpressions were brought\
    \ to place with Drag & Drop support. This freed the modeler from tedious and error-prone\
    \ typing of object names and values.\n\nTable 26.1 exemplifies the implementation\
    \ of constraints of our example PC configuration knowledge base (see Hotz et al.,\
    \ 2014²).\n\n# 26.3 Price and Hard Disk Capacity\n\nVariSales has two mechanisms\
    \ for determining prices. The basic pricing mechanism applies simple additive\
    \ prices while the advanced calculation mechanism enables freely specifiable calculations.\
    \ The price"
