  md: '# Personalized Configuration


    Juha Tiihonen*, Alexander Felfernig† and Monika Mandl†

    *Aalto University, Aalto, Finland

    †Graz University of Technology, Graz, Austria


    Abstract: The increasing size and complexity of products (or product assortments)
    triggers a demand for intelligent techniques that proactively support users of
    configurator applications in finding a solution (configuration) that fits their
    wishes and needs. Recommendation technologies are predestined to be applied in
    the configuration context, because they can find relevant items from large and
    complex item sets. In this chapter, we show how different types of basic recommendation
    technologies can be applied to recommend configurations or individual selections
    such as attribute values to the user of a configurator. This discussion is based
    on a working example from the domain of mobile phones.


    # 13.1 Introduction


    Configuration systems (configurators for short; Barker et al., 1989; Heiskala
    et al., 2007; Stumptner, 1997) have become an important instrument to implement
    the concepts of mass customization (see Piller and Blazek, 2014¹). The basic concept
    of mass customization is the production of customer-individual products with near
    Mass Production efficiency (Pine, 1993; Tseng and Jiao, 2001). Following the paradigm
    of mass customization, the intelligent customizing of products and services is
    crucial for manufacturing companies to stay competitive. Configurators support
    the idea of integrating the user in the design process by allowing the specification
    (design) of desired product features; subsequent production processes take into
    account this individualized design. Instead of choosing a product, a user of a
    configurator specifies a product by configuring the product attributes based on
    a set of available options. Example domains where configurators are applied are
    computers, cars, industrial machinery, financial services, and telecommunication
    switches.


    Configurators have many advantages such as the elimination of errors, shorter
    product delivery cycles, and increased productivity of sales representatives (see
    Bagley et al., 2014²). A major drawback of product configurators is that users
    (customers) in many cases have the problem of not fully understanding the set
    of offered options and are often overwhelmed by the complexity of these options
    (Bettman et al., 1998; Huffman and Kahn, 1998). The purpose of this chapter is
    to present a selected set of strategies to support users throughout the configuration
    process by integrating (exploiting)


    ¹Chapter 9.

    ²Chapter 4.'
