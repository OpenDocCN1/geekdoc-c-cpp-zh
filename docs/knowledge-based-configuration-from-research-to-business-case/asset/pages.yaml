- pgno: 348
  md: 'There were several implementations for processing constraints in TEX-K (Cunis
    et al., 1991). One of them was implemented for the KONEX and APLEX applications
    and is referred to as μPLAKON as it focuses only on a subset of the functionality
    envisioned for PLAKON.¹⁰ It is described in Haag (1991) and more completely in
    Haag (1995). It was later adopted by SAP and is still in use today. In short,
    it consists of three modules: the so-called dynamic database (DDB), a pattern
    matching system (PMS), and a truth maintenance system (TMS).


    The DDB is a repository of facts (predicate logic atoms) describing the configuration.
    Mainly, a fact states the assignment of either a value or a domain to an observable
    property of an instance. The PMS identifies all tuples of facts that allow a particular
    constraint to be applied. The implementation of the PMS is based on the RETE Algorithm
    used for forward chaining in XCON and part of the OPS programming languages (Forgy,
    1982).


    The TMS records justifications for all facts in the DDB, in particular those due
    to constraints. A justification is an implication f₁ … fₙ → f that states that
    the fact f is a valid part of the configuration if the facts f₁ … fₙ are valid.
    The TMS hides/screens¹¹ uninteresting facts and is able to efficiently invalidate
    all facts that depended on a revoked decision. The latter is referred to as dependency
    directed backtracking (see also Hotz and Wolter, 2013).


    # 27.3.3 Balances, Checks, and Resources


    Sometimes a dependency cannot be expressed as a constraint in the model with a
    given finite set of variables. One example would be the “constraint” that the
    summed width S of all cabinets in a kitchen should fill the allotted space W.
    The “constraining” relation is S = W. If this is violated because S > W, this
    results in an inconsistency that can only be corrected by taking something back
    (a cabinet or the specified value of W). In this way it behaves like a real constraint.
    But, if this is violated because S < W, then this merely indicates incompleteness,
    which might be corrected by adding something (another cabinet). Since (at least
    in interactive configuration) the XPS must make the distinction between inconsistency
    and incompleteness clear to the user, it is opportune to distinguish such dependencies
    from constraints; they were referred to as checks in Haag (1991).


    Dependencies involving sums are often related to the concept of resources (see
    Hotz et al., 2014b¹²). A resource (such as space or electrical power) is consumed
    by some components and provided by others. In the preceding example, each cabinet
    consumes space equal to its width and the overall kitchen provides the amount
    of available space W. SAP followed the approach of Bernhard Neumann who developed
    a concept of balances for resources and/or functionality in hierarchical configurations
    in his dissertation (Neumann, 1989). The two sides of a balance were called offers
    and requires.


    # 27.3.4 Soft Constraints


    Not all constraints are created equal. Some constraints encode physical or legal
    laws that must not be violated. These cannot be questioned and are termed hard
    constraints. Other constraints encode defaults'
  merge: -1
