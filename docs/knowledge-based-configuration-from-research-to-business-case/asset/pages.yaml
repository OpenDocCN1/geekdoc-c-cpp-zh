    # 24.6 Conclusion


    This chapter provides an overview of the hybrid configuration system KONWERK.
    By combining several knowledge representation and reasoning techniques, KONWERK
    can be used for complex configuration applications. Experiences gained with KONWERK
    can be summarized as: Quick prototype creation, high acceptance of the knowledge
    base, and no application-specific user interface.


    # Acknowledgments


    Besides the authors, main contributors for the core modules of KONWERK were Frank
    Buhr, Bernd Neumann, Manfred Kopisch, and Thomas Vietze. Project partners contributed
    in enhancement modules and applications.


