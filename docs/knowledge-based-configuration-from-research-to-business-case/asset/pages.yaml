- pgno: 265
  md: '# Configuring and Generating Technical Documents


    Rick Rabiser*, Michael Vierhauser†, Martin Lehofer†, Paul Grünbacher* and Tomi
    Männistö‡

    * Johannes Kepler University Linz, Linz, Austria

    † Siemens VAI Metals Technologies, Linz, Austria

    ‡ Aalto University, Aalto, Finland


    Abstract: In industrial software development salespeople, product managers, or
    technical writers frequently create documents such as offers, contracts, user
    manuals, or technical documentation. For products that are configured specifically
    for different customers, the documentation also needs to be adapted to match the
    product. Such adaptation of documents is tedious and error-prone and can easily
    lead to inconsistencies. Stakeholders thus need configuration support for adapting
    documents. We describe a flexible approach for automatically generating product-specific
    documents based on product line variability models. We report on an industrial
    case example of applying the approach to support configuring and generating product-specific
    documents in an automation software product line.


    # 20.1 Introduction


    Software product lines aim at providing the means for dealing with variability
    in large software systems effectively to leverage extensive reuse (Pohl et al.,
    2005; van der Linden et al., 2007). Software product line engineering (SPLE) covers
    activities such as domain scoping, modeling the variability of reusable artifacts,
    configuring and deriving individual products, and managing evolution. The tasks
    for a particular product line typically include the development of a common platform,
    the definition of the product line’s architecture, and the automated configuration
    and derivation of product artifacts.


    In this chapter, we focus on the derivation of individual products and related
    artifacts such as product-specific documentation. More specifically, we address
    a particular type of derivation: automated product configuration and artifact
    generation. The automation is based on a predesigned model that describes system
    variability accurately enough so that all desired variants can be derived from
    the product line. This principal goal makes product configuration (see Hotz et
    al., 2014a¹) perhaps the most modeling-intensive of all SPLE tasks and thus sets
    high requirements for the rigor of the modeling methods that need clear enough
    semantics to support the automation. This can be achieved, for example, by mapping
    the variability modeling concepts to a logical representation with formal semantics
    or a powerful enough decision support system (Asikainen et al., 2007; Benavides
    et al., 2010; Dhungana et al., 2011; Hotz et al., 2006). Given such a conceptualization,
    appropriate tools (see Leitner et al., 2014²), such as inference


    ¹ Chapter 2.

    ² Chapter 8.'
