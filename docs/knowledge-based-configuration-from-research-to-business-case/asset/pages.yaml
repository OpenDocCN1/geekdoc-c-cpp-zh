- pgno: 322
  md: 'current version, WEEVIS supports scenarios where user requirements can be defined
    in terms of functional requirements (Mittal and Frayman, 1989) and the corresponding
    solutions (configurations) are typically selected from a set of predefined configurations.
    User requirements are checked with regard to their consistency and, in the case
    of inconsistent requirements, WEEVIS proposes a set of possible repair alternatives.
    This way, WEEVIS does not only support product selection but also consistency
    maintenance processes on the basis of intelligent repair mechanisms (Felfernig
    et al., 2009). Currently, WEEVIS does not provide a graphical development environment
    for configuration knowledge bases but relies on a textual knowledge representation
    language. The idea is that a community of engineers (users) cooperatively contributes
    to the development of a configuration knowledge base. The inclusion of graphical
    concepts supporting community-based knowledge base development and maintenance
    is within the scope of future work. WEEVIS comes along with the following innovations:


    +   - Knowledge Acquisition. WEEVIS users are enabled to articulate their domain
    knowledge by defining the basic properties of the configuration task in a Wikipedia
    style. WEEVIS provides a set of predefined tags that can be used for creating,
    defining, and maintaining a configuration problem definition. By exploiting the
    basic functionalities of the underlying MediaWiki infrastructure, configuration
    knowledge bases can be versioned and restored in the case of the creation of unintended
    versions.

    +   - Knowledge Distribution and Collaborative Development. WEEVIS users can develop
    and publish their configuration knowledge to a community of interested users.
    Other users interested in contributing to the further development of the knowledge
    base can engage in the development and maintenance process as is the case with
    standard Wiki pages. WEEVIS and WEEVIS knowledge bases are freely available and
    accessible in the Internet.

    +   - Rapid Prototyping. By using the basic functionalities provided by Wikipedia,
    WEEVIS allows rapid prototyping processes where the result of a change can immediately
    be seen by simply switching from the edit mode to the corresponding read mode.
    This approach allows an easy understanding of the WEEVIS tags and also of the
    semantics of the provided WEEVIS language.


    The major contributions of this chapter are the following. We introduce a Wiki-based
    environment for the development and maintenance of configuration problems. In
    this context we provide an overview of the functionalities supported by the WEEVIS
    environment. This serves as a basis for further application and exploitation.


    The remainder of this chapter is organized as follows. On the basis of an example
    from the domain of personal computers (see Hotz et al., 2014²) we introduce the
    WEEVIS knowledge representation concepts (Section 25.2). In Section 25.3 we give
    an overview of how WEEVIS is embedded in the Media Wiki environment. In Section
    25.4 we discuss the limitations of the WEEVIS approach and shed light on related
    work by comparing existing engineering practices with the WEEVIS functionalities.
    With Section 25.5 we conclude the chapter.


    # 25.2 Modeling of the Working Example


    For demonstration purposes we will now show how to define the configuration model
    introduced in Hotz et al. (2014) on the basis of the WEEVIS knowledge representation
    concepts. In this context we will see'
