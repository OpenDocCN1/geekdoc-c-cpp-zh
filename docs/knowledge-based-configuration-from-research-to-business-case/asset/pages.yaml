- pgno: 210
  md: '**Table 14.5 Scoring rules for product attribute *price*.**


    | Price | Economy | Quality |

    |---|---|---|

    | ≤ 25 | 10 | 3 |

    | > 25, ≤ 50 | 6 | 5 |

    | > 50, ≤ 75 | 4 | 7 |

    | > 75, ≤ 100 | 2 | 10 |


    **Table 14.6 Scoring rules for product attribute *capacity*.**


    | Capacity | Economy | Quality |

    |---|---|---|

    | ≤ 3 | 10 | 4 |

    | > 3, ≤ 6 | 6 | 7 |

    | > 6, ≤ 10 | 4 | 10 |


    tents (Felfernig et al., 2007). Finally, the existence of serial position effects
    due to different orderings of choice alternatives (options) is shown in Li and
    Epley (2009).


    # 14.3.2 Relevance of Serial Position Effects in Product Configuration Scenarios


    Product configuration systems have been recognized as ideal tools to assist customers
    in configuring complex products according to their individual preferences (Blecker
    et al., 2004; Yang et al., 2005). In this context, serial position effects play
    an important role in the ordering choice alternatives; configuration systems must
    be aware of the fact that different rankings can trigger different selection behavior,
    and as well can increase or reduce a user’s decision-making effort. Murphy et
    al. (2006) suggest to place the most important item on the first position, and
    to place another important item on the last position of a list (the process should
    be continued with the order of importance). Felfernig et al. (2008) introduced
    an approach to calculate personalized item rankings, and to take into account
    primacy/recency effects in the presentation of result sets in the context of a
    recommendation scenario. They apply the concepts of Multi-Attribute Utility Theory
    (MAUT; Winterfeldt and Edwards, 1986) and derive the importance of interest dimensions
    from customer requirements (see also Felfernig et al., 2006, 2013).


    A simple example of the concepts presented in Felfernig et al. (2008) is the following.
    Let us assume that *economy* and *quality* have been defined as interest dimensions
    for the computer product domain introduced in Section 14.2. In Tables 14.5 and
    14.6 example scoring rules are defined, which describe the relationships between
    the computer attributes (*price* and *capacity*) and the corresponding interest
    dimensions (*economy* and *quality*). For example, Table 14.5 shows that an expensive
    computer has a low perceived value for interest dimension economy, and a high
    perceived value for interest dimension quality. Table 14.6 shows that a computer
    with a low capacity has a high valence in interest domain economy, and a low valence
    in interest dimension quality.'
