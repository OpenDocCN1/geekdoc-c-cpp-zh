- pgno: 279
  md: 'systems firms identified by Salter and Tether (2006) as typically large and
    based on detailed division of labor, sophisticated operating routines, and a heavy
    dependence on technologies, typically on information and communications technology,
    and sometimes logistics. Examples include banking, insurance, telecommunications,
    supermarkets, and airlines. Such companies potentially benefit significantly from
    service configuration due to the high volumes of potentially complex services
    in their offerings. Service delivery based on modular elements enables efficient
    processes with moderately skilled employees and relatively low provider discretion.


    Our example cases included broadband and mobile subscriptions, elevator maintenance
    contracts, and insurance. The subscriptions were managed in large quantities with
    the configurator module and telecommunications extensions of a major enterprise
    software system. Automated provisioning, installed base management, and reconfiguration
    were supported and among central business requirements for the system. Large volumes
    and desire to enable customers to configure their subscriptions necessitated a
    configurator.


    Intelligent sales configuration in the financial industries has led to significant
    improvements in several key performance indicators, such as quality of solution,
    time to quotation, and maintenance effort (Felfernig et al., 2007).


    # 21.3 Process Configuration


    # 21.3.1 What Is Process Configuration?


    Provision of configurable products and services is most effective if configuration
    is extended from the features of products and services to the supporting business
    processes. Effective delivery of configurable services requires equally configurable
    development and delivery processes in order to streamline business processes and
    manage the stakeholders’ expectations.


    In this context, process configuration can be described as the act of transforming
    a given process model into one that is specifically tailored to a given set of
    requirements. The input process model will often be a generic reference model
    that governs a wide range of activities, which must be configured to suit a given
    scenario. Typically, configuration involves selecting the tasks, subprocesses,
    and execution paths that should be retained in the custom process and eliminating
    others while maintaining the integrity of the overall process. Customization may
    be applied incrementally resulting in a sequence of process models of varying
    scope and detail.


    In general, it is not enough to restrict attention to task selection and ordering.
    Several perspectives are considered equally important: The control perspective
    focuses primarily on the tasks and the parallelism, sequencing, and synchronization
    of tasks permitted in a process. The decision tasks and their associated conditions
    selecting between alternative execution paths are included here. The resource
    perspective embodies available resources and business rules governing the assignment
    of resources to tasks. Explicit models of roles, privileges, and organizational
    structure form the basis of this perspective. The data perspective captures the
    representation and utilization of business objects and data in the process. It
    is needed to ensure all information required to support both human and automated
    tasks in a process is available at appropriate times.


    A configurable process model embodies the possible variation points and relationships
    between choices and elements in the reference model in order to ensure that the
    customization results in a correct'
  merge: -1
  img_proc: true
