    ```


    # 12.5 Evaluation


    We now compare the performance of CoreDiag with the Sequential algorithm discussed
    in Section 12.3. The worst case complexity (and best case complexity) of Sequential
    in terms of the number of needed consistency checks is c (the number of constraints
    in C_KB). Worst case and best case complexity are identical since Sequential checks
    the redundancy of each individual constraint c_i with respect to C_KB. In contrast,
    the worst case complexity of CoreDiag depends on the number of redundant constraints
    in C_KB. The worst case complexity of CoreDiag in terms of the number of needed
    consistency checks is 2c · log₂(n/c) + 2c, where n is the number of constraints
    in C_KB and c is the minimal core size. The best case complexity in terms of the
    number of needed consistency checks can be achieved if all constraint elements
    of the minimal core are positioned in one branch of the CoreD search tree: log₂(n/c)
    + 2c. Consequently, the performance of CoreDiag heavily relies on the number of
    constraints contained in the minimal core (the lower the number of constraints
    in the minimal core, the better the performance of CoreDiag).


