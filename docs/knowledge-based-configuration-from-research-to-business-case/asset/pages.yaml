- pgno: 216
  md: '(Benavides et al., 2013). To generalize this aspect, the analysis of potential
    synergies between these two research areas in a systematic fashion is a major
    issue for future research. An in-depth discussion of related research questions
    can be found, for example, in Benavides et al. (2013) and Hubaux et al. (2012).


    # Community-based Configuration


    Typically, configuration is assumed to be a process where one user interacts with
    the configuration system with the goal to identify a solution (configuration).
    A major research question in this context is how to best support configuration
    processes that include groups of users (Felfernig et al., 2012b; Jameson, 2004).
    Examples of such settings are the configuration of holiday trips, software release
    plans, and (also) car configuration. In these scenarios, users often cooperatively
    design their solutions, which requires additional configuration functionalities
    such as feature (value) recommendation for groups of users, diagnosis and repair
    recommendation for groups of users, configuration ranking for groups of users,
    and so on. From these questions we can derive the general research question that
    should be answered: In which way do we have to adapt (extend) existing user interfaces,
    algorithms, and configuration processes to be able to support groups of users?


    # Standardized Configuration Knowledge Representations


    Still a major research issue is the development of a configuration lingua franca.
    Such a language would help to make configuration knowledge interchangeable between
    different configuration environments and thus also to better protect corporate
    assets with regard to technological changes. Furthermore, such a knowledge representation
    language would help to make the empirical evaluation of new algorithmic developments
    easier since less effort has to be spent translating existing configuration knowledge
    bases into the dialect of a specific configuration environment (under the assumption
    that each environment is able to import/export standard representations). Research
    dedicated to the development of such a standardized knowledge representation focused
    on common ontologies (Soininen et al., 1998), UML (Felfernig, 2007; Felfernig
    et al., 2000), and description logics based representations (see, e.g., Felfernig
    et al., 2003). The major issue for future research is the development of a common
    representation language that (1) takes into account all relevant aspects of configuration
    knowledge (e.g., ports, composite and shared part of hierarchies) and (2) also
    provides the semantics that allows for efficient solution search. Research in
    answer set programming based configuration shows promising results that will pave
    the way for achieving the mentioned goals (Aschinger et al., 2012; Friedrich et
    al., 2011; Simons et al., 2002; Tiihonen et al., 2003, 2013).


    # Intelligent User Interfaces for Configuration Knowledge Acquisition


    The engineering of complex configuration knowledge bases is typically a cooperative
    process where different stakeholders such as product designers, marketing and
    sales experts, and knowledge engineers are engaged. Each stakeholder is familiar
    with only specific aspects of the product domain and even on the technical level
    there are different experts with different knowledge regarding the underlying
    product. Furthermore, stakeholders often have conflicting interests regarding
    the features that should be supported by a configurable product. Major questions
    to be answered in this context are the following: which components should be part
    of the knowledge base (i.e., offered to the customer)? Which constraints should
    be part of the knowledge base? How to achieve consensus among the different stakeholders?
    Another issue in this context is the accessibility of a knowledge base: highly
    experienced knowledge engineers have a different navigation behavior in the knowledge
    base compared to less experienced engineering personnel. A major research issue
    in this context is the development of intelligent techniques that support easy
    understanding and handling of configuration knowledge bases (Felfernig et al.,
    2013). Questions to be answered in this context are the following: Which constraints
    should additionally be inspected after having already inspected a specific sequence
    of constraints? Which parts of a knowledge base should not be shown to the engineer'
  merge: -1
  img_proc: true
- pgno: 217
  md: 'in certain maintenance contexts? How do we refactor ill-formed knowledge bases?
    In this context, we have to develop deep knowledge related to the cognitive complexity
    of different constraint structures and types. Initial research results related
    to this topic have been reported in Felfernig et al. (2010a).


    # Intelligent Testing and Debugging


    Besides the determination of minimal sets of user requirements that are inconsistent
    with regard to a configuration knowledge base, the concepts of model-based diagnosis
    (MBD; Reiter, 1987) can as well be applied to the testing and debugging of configuration
    knowledge bases (see Felfernig et al., 2004). If a configuration knowledge base
    is inconsistent with some (or all) of the test cases of a test suite, we are interested
    in minimal explanations in terms of minimal sets of constraints in the knowledge
    base that have to be deleted or adapted to be able to restore the consistency
    of the knowledge base with regard to the test suite. Research questions to be
    answered in the context of knowledge base testing and debugging are the following:
    How do we automatically generate test suites? How can test case generation techniques
    from software engineering be applied or extended in knowledge-based configuration
    scenarios? How can we personalize the determination of diagnoses, for example,
    on the basis of complexity metrics that provide an indicator of the quality of
    certain parts of a knowledge base? How can we increase the efficiency of debugging
    algorithms?


    # Unobtrusive Preference Elicitation


    Similar to recommender systems, the quality of user preference estimation is a
    major factor for successfully determining configurations that are of interest
    for the user (under the assumption that personalization technologies are already
    integrated in the configuration environment). In many configurators (and also
    recommender applications) preference elicitation is based on concepts such as
    directly asking the user or inferring preferences from the interaction logs of
    previous user interactions (see, e.g., Felfernig et al., 2009, 2010b). Alternative
    ways to derive preferences from user interactions are, for example, the (online)
    interpretation of eye-tracking data or the derivation of requirements and preferences
    on the basis of voice processing. These are issues for future research.


    # Processes for Intelligent Systems Development


    The widespread application of knowledge-based technologies triggers the demand
    of methodologies that support application development in a structured fashion.
    A related research question is to which extent standard software engineering methods
    are applicable or whether agile methods provide a better methodological support.
    A discussion of the application of agile methods in the context of knowledge-based
    systems development can be found, for example, in Knublauch and Rose (2003).


    # References


    Ardissono, L., Felfernig, A., Friedrich, G., Goy, A., Jannach, D., Petrone, G.,
    Schäfer, R., Zanker, M., 2003. A framework for the development of personalized,
    distributed web-based configuration systems. AI Magazine 24 (3), 93–108.


    Aschinger, M., Drescher, C., Vollmer, H., 2012. LoCo – a logic for configuration
    problems. In: 20th European Conference on Artificial Intelligence (ECAI2012).
    IOS Press, Montpellier, France, pp. 73–78.


    Asikainen, T., Soininen, T., Männistö, T., 2003. Towards managing variability
    using software product family architecture models and product configurators. In:
