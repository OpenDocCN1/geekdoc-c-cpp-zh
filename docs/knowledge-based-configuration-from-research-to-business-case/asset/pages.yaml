- pgno: 92
  md: 'often also dispose of concepts for structured rule representation. Graphical
    UML modeling supports the inclusion of advanced modularization concepts such as
    packaging and diagram contextualization (Felfernig et al., 2000b; Felfernig and
    Zanker, 2000). Techniques for easy knowledge base evolution and maintenance (C5)
    are not primarily depending on the knowledge representation itself but more on
    additional meta-functionalities that support intuitive knowledge navigation and
    adaptation; nearly all representation formalisms can be equipped with such a functionality
    (Felfernig et al., 2013b). RBS have serious maintenance problems due to the dependence
    of product domain and problem solving knowledge. With the exception of RBS, all
    other representations follow a model-based paradigm (C6) that supports a clear
    separation of domain and problem-solving knowledge. RBS and constraint satisfaction
    algorithms have proven to support efficient problem solving on an industrial scale.
    For this reason, these approaches are evaluated better with regard to performance
    (C7). GCSP allows the determination of solutions for generative configuration
    problems; ASP and HB are also able to provide such functionalities (C8). With
    the exception of FM and UML, all approaches provide basic support for explanations
    (as to why a configuration could (not) be found). Dependencies between domain
    and problem solving knowledge in RBS and encodings in SAT (see Subsection 6.2.1)
    make these approaches less accessible for explanation techniques.


    # 6.6 Conclusion


    In this chapter we provided an overview of different configuration knowledge representation
    and reasoning techniques. These techniques were discussed on the basis of a timeline
    ranging from the rule-based configuration system R1/XCON implemented in the late
    1970’s via different types of constraint representations and constraint reasoning
    approaches through to advanced knowledge representation and reasoning approaches
    that are applied nowadays for the definition and solution of configuration tasks.


