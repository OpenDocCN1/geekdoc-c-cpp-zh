    This definition is almost equivalent to the definition of the diagnosis problem
    accordingly to (Reiter (1987)) and indeed the relationship between diagnosis and
    reconfiguration has been already pointed out (e.g., Crow and Rushby, 1991; Provan
    and Chen, 1999; Stumptner and Wotawa, 1998). Unlike Crow and Rushby (1991) and
