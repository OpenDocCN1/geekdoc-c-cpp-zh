- pgno: 253
  md: '# Kapsch: Reconfiguration of Mobile Phone Networks


    Iulia Nica*, Franz Wotawa*, Roland Ochenbauer†, Christian Schober†, Harald Hofbauer‡,
    and Sanja Boltek‡


    *Graz University of Technology, Graz, Austria

    †Kapsch Business Com, Vienna, Austria

    ‡Kapsch Carrier Com, Vienna, Austria


    Abstract: Often needed together, simulation and configuration play an important
    role in industry, from the early development stages as well as after deployment
    as part of system maintenance. Changes of a system’s structure or behavior over
    time are required because of changing requirements due to new customer needs.
    For example, the current worldwide willingness to adopt smart power grid technologies
    raises new challenges regarding the necessary adaptations in the structure and
    functionality of the existing mobile phone networks. In this chapter, we motivate
    the importance of both simulation and (re) configuration of mobile phone networks
    in the context of machine-to-machine communication, in order to deal with future
    markets of intelligent transportation systems and smart metering. We discuss our
    SIMOA approach for simulation and (re) configuration that is based on a system
    model and system requirements. The approach has the following advantages: it is
    flexible and adaptable to various systems and needs, it determines the system’s
    capabilities to handle certain requirements, and suggests system adaptations in
    cases where the requirements cannot be satisfied.


    # 19.1 Introduction


    The machine-to-machine (M2M) communication market is expected to grow in the coming
    years and to become the largest customer of mobile phone network operators. The
    application scenarios of M2M communication are many faceted. Currently, the field
    of main application of M2M communication is smart metering, providing a direct
    link between power suppliers and electricity meters at home, and on tracking of
    vehicles and goods in the transportation industry. In this chapter, we focus on
    the first scenario (linking electricity meters at home).


    These smart metering application scenarios not only provide advantages for companies
    but also additional benefits for the customers. For example, smart metering solutions
    have the potential to avoid blackouts by limiting power consumption far before
    a blackout might occur. Another example is CO₂ emission reduction in the electricity
    sector. More and more people produce and consume energy independently and feed
    unspent energy into the network. One hope in this context is to reach greater
    energy efficiency through short meter-reading intervals, as these allow the customers
    to control their energy consumption throughout the day. Energy network operators
    are then able to collect consumption data more frequently and to provide this
    data to end consumers in a transparent way. To complete all these tasks, intelligent
    communication solutions are needed, which are able to handle increased data volumes
    over the wireless'
  merge: -1
  img_proc: true
- pgno: 254
  md: 'networks and especially over mobile GPRS/UMTS networks. Originally, communication
    infrastructures were not designed to fulfill the requirements of the mentioned
    M2M communication scenarios.


    The Kapsch Smart Energy Management System for metering and building automation
    offers a future-proof, open, and manufacturer-independent solution, which fits
    the needs of all the groups involved: from end consumers, building owners, and
    facility managers to network operators and energy suppliers. In this context,
    functionalities that support a detailed analysis of alternative smart metering
    scenarios are highly requested. In order to support such functionalities, simulations
    of various parts of a mobile network such as cell, backbone, and data storage
    have to be conducted. The major purpose of such a simulation is to check whether
    a network configuration can support a set of given user requirements. In order
    to simulate the dynamics of a mobile network, we treat each part of the mobile
    network, which is to be simulated, as a state machine with a predefined number
    of states. For example, in one particular state a component might be active whereas
    in another one this is not the case. Another example is a network configuration
    that may change from state to state in order to handle different communication
    requirements.


    If a simulation fails (the requirements cannot be fulfilled by the mobile network),
    a working reconfiguration of the given system has to be delivered. In particular,
    adding too many M2M devices to a cell configuration might lead to an unacceptable
    reduction of service availability, which can only be handled by changing the default
    value of the parameters in the cell (for instance, by increasing the number of
    serving frequencies) or by extending the communication network via adding new
    mobile phone cells.¹ A cell configuration contains one base station, a number
    of metering devices, and a base load value.


    The major contributions of the chapter are the following: (1) we provide important
    insights into the principles of knowledge-based reconfiguration in the domain
    of M2M communication networks, and (2) we discuss major business cases that are
    related to the application of (re) configuration technologies in the context of
    mobile phone networks and M2M applications.


    The remainder of this chapter is organized as follows. In Section 19.2 we discuss
    in more detail the major requirements regarding the support of M2M communication
    scenarios. Afterward, we introduce an application scenario and give an overview
    of the SIMOA approach (Section 19.3). In Section 19.4 we discuss relevant business
    cases that are related to the application of SIMOA technologies. With Section
    19.5 we conclude this chapter.


    # 19.2 Domain Requirements


    Unlike today’s mobile networks, the future GPRS (General Packet Radio Service)
    networks used in Automatic Meter Management (AMM) communication have to support
    the following requirements:


    +   - The GPRS networks have to be highly reliable and extensible.

    +   - There must be a large IP address pool available.

    +   - There is a required data amount specified for AMM communication.


    ¹ When adding a new mobile phone cell to a network, in fact, a new base station
    is added to the system and the transfer data is redistributed to the cells.'
  merge: -1
  img_proc: true
- pgno: 255
  md: '+   - The amount of data communicated via a GPRS network varies depending on
    the AMM readout frequency² and the used communication protocols, such as the DLMS/COSEM
    or the IEC61107 protocol.


    These requirements are of great importance for the configuration process. The
    user should be able to add a large number of devices in the network and the device
    type is either already defined in the knowledge base or a new type can be additionally
    defined. The last two requirements limit the space of possible reconfigurations
    by means of constraints stated over the data amount transferred in the network.


    Figure 19.1 illustrates a simplified cell from a smart grid,³ taking into consideration
    the GPRS data communication on the one side and the electric power transmission
    from the power generation station to smart meters on the other side (depicted
    in gray). Note that SIMOA simulation and (re) configuration focuses on GPRS data
    communication settings.


    As depicted in Figure 19.1, IP-enabled meters (Point-to-Point (P2P) individually
    addressable smart meters), which are connected directly to the WAN (Wide Area
    Network) using GPRS, communicate with the AMM application, without requiring data
    concentrators⁴ in the field. The meters connected to data concentrators are called
    PLC (Power Line Carrier) meters. The usage of P2P meters becomes inevitable when
    the connection distance between a meter and a data concentrator is too large (more
    than 300 meters). In the simulation process we have to take into account the following
    variants of M2M terminals in a specific cell: (1) only P2P meters, (2) only data
    concentrators with PLC meters, and (3) both P2P meters and data concentrators
    with PLC meters.


    In Figure 19.1, the Smart Grid (GPRS) cell comprises the following parts:


    +   - Base Transceiver Station (BTS): Facilitates the wireless communication between
    user equipment (mobile phones, smart meters, etc.) and the network. The BTS has
    the equipment for encrypting and decrypting communications, spectrum filtering
    tools, antennas, and so on. Typically a BTS has several transceivers (TRXs) that
    allow it to serve several different frequencies and allocates a number of time
    slots for the M2M communication in the cell.


    +   - P2P meters and Data Concentrators: These are described by configurable attributes
    that represent fixed or variable data amounts (derived from the chosen transfer
    protocols), network topology (determined by the distance between BTS and data
    concentrators/P2P meters), and in the case of data concentrators, the number of
    PCL meters connected to them.


    +   - GPRS base load represented by the Mobile phone in Figure 19.1 and which
    represents all the non-smart-metering traffic in the cell.


    It is worth noting that the structure of mobile phone networks varies and that
    communication requirements depend on the M2M application scenario. A typical AMM
    scenario is, for instance, the transfer


    ² The AMM readout frequency refers to the meter reading interval; i.e., for instance,
    an electricity meter can record the power consumption every 15 minutes.


    ³ A smart grid is a power transmission network, which makes use of supplier and
    consumer information and communication infrastructure to improve the overall network
    performance in terms of efficiency, reliability, and sustainability in an automated
    way.


    ⁴ A data concentrator is a device that is connected with several smart meters
    via a wire. In this case, all connected smart meters communicate to the AMM application
    over the data concentrator. Data concentrators are used, for example, in buildings
