  md: '# FIGURE 21.1


    Elevator Maintenance contract configuration model.


    Apart from modeling conceptualizations, we are aware of few specific technologies
    for core sales configuration of services. However, domain-specific extensions
    for services exist in major enterprise software suites, for example to manage
    telecommunications services.


    # 21.2.4 Achievements and Cases


    Commonalities between service sales configuration cases we witnessed include customers
    who were committed through contracts that were configured. The service providers
    exhibited characteristics of


    ![](img/214a17cc1f5bbf0914497c7414128438_278_0.png)'
  merge: -1
