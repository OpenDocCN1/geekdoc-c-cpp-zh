    \ Hotz**, **Juha Tiihonen**, and **Claire Bagley**  \n*Graz University of Technology,\
    \ Graz, Austria*  \n*HITeC e.V., University of Hamburg, Hamburg, Germany*  \n\
    *Aalto University, Aalto, Finland*  \n*Oracle Corporation, Burlington, MA, USA*\n\
    \n**Abstract:** Configuration has a number of related topics such as *mass customization,\
    \ software product lines, design, planning, recommender systems, software configuration,*\
    \ and *product data management*. For a discussion of mass customization, refer\
    \ to [Chapter 9].(Chapter 9); a discussion of software product lines can be found\
    \ in [Chapter 6].(Chapter 6). The other topics are discussed in this chapter.\n\
    \n# 3.1 Design\n\n[Sabin and Weigel (1998)](Sabin and Weigel, 1998) define configuration\
    \ as “a special case of design activity where the artifact being configured is\
    \ assembled from instances of a fixed set of well defined component types which\
    \ can be composed conforming to a set of constraints.” Following the characterization\
    \ of *synthesis tasks* ([Brown and Chandrasekaran, 1989]), configuration is often\
    \ categorized as *routine design* ([Günter and Kühn, 1999; Stumptner, 1997; see\
    \ Figure 3.1]).\n\n[Brown and Chandrasekaran (1989)] describe *routine design*\
    \ (*design class 3*) as a problem, where the specifications of objects, their\
    \ properties, and compositional structures are already given, and the discovery\
    \ of a solution is based on a known strategy. This characterization is similar\
    \ to the definition of [Sabin and Weigel (1998)]. An example of routine design\
    \ is the quote generation for technical systems on the basis of a complete description\
    \ of components, their properties, a compositional structure, and related constraints.\
    \ If the limitations of routine design are not given in the domain, other possible\
    \ categorizations are *innovative design* (*design class 2*) and *creative design*\
    \ (*design class 1 on the top of the scale*). An example of innovative design\
    \ is the creation of an upgrade version of a basic mobile phone type that—compared\
    \ to the old model—includes additional features. An example of creative design\
    \ is the artistic design of a new furniture line. From these examples, we can\
    \ infer that transitions between design classes are smooth and subcategorizations\
    \ can be introduced ([Hotz and Vietze, 1995]). For a detailed discussion of design\
    \ tasks, refer to [Brown and Chandrasekaran (1989)]."
  merge: -1
