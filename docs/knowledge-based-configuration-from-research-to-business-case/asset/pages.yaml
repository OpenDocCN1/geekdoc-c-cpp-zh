    regard to a financial service knowledge base (Felfernig et al., 2011). In addition
    to the original version (redundancy rate = ~0–10%) three knowledge bases with
    the redundancy rates 50%, 75%, and 87.5% were generated. For example, a knowledge
    base with a redundancy rate of 50% was generated by simply duplicating each constraint
    of the original knowledge base. Starting with a redundancy rate of 50% we can
