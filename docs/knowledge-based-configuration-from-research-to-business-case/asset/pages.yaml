  md: '*Defining variability models.* The product line experts use the collected information
    to define variability models using an approach and tool of their choice. This
    task involves defining variability that allows distinguishing the different products
    of a product line, for example, represented as selectable product features or
    configuration decisions. It also means modeling the relation of reusable artifacts
    to features or decisions. For instance, the selection of a feature in product
    configuration might require the inclusion of a particular software component and
    a related document in a configured product.


    *Preparing artifacts and devising domain-specific generators.* Model-based product
    line approaches rely on generators to automate the creation of product-specific
    artifacts according to a configuration description. Generators typically exploit
    variation points in the artifacts. For example, code and document formats can
    be extended using annotations, markups, or placeholders that can be used to tag
    variable parts that need to be substituted or modified later on. Therefore, generators
    need to be developed that use the choices made by the configurers during product
    configuration (e.g., the selected features) to compose and adapt the reusable
    artifacts for a specific product. Depending on the nature of a product line and
    its characteristics, different types of artifacts need to be supported at different
    levels of granularity. Generators can be developed to create parts of a system’s
    source code, configuration files for parameterizing a system, or high-level artifacts
    such as user documentations or product descriptions. Generators help to reduce
    the time-consuming and error-prone manual adoption of product artifacts. They
    are commonly developed as extensions to existing product line (configuration)
    tools.


    *Augmenting the artifacts with variability information.* Product line experts
    rigorously specify the variation points and variants in the artifacts and relate
    them to the variability models using the chosen variability mechanism. During
    product configuration generators can resolve the variation points based on the
    user choices in the configuration description to produce product-specific artifacts.


    # 20.3 Industrial Case Example: Customizing Technical Documentation


    SPLE traditionally has a strong focus on program artifacts such as code or configuration
    files. However, in practice configuring documents is a very frequent and crucial
    use case. Sales people, marketing staff, or product managers prepare customer-specific
    documents such as offers, user manuals, or contracts. Industrial experience shows
    while the configuration of products is often at least partly automated, documents
    are typically still adapted manually. For instance, at Siemens VAI the manual
    adaptation of documentation for the CC-L2 product line (see later) for each customer
    is tedious due to the size of the document (hundreds of pages). Furthermore, inconsistencies
    between the provided documentation and the deployed software need to be avoided.


    In our industrial case example we modeled document variability and applied model-driven
    SPLE to structured documents. Our approach is generic and flexible to automate
    document generation independently of the concrete type of documents and regardless
    of the maturity of the product line, the degree to which variability modeling
    and generative techniques are already applied. We have originally described the
    approach in Rabiser et al. (2010). Since then, it has been extended with generators
    for Microsoft Word documents and applied in a number of industrial product lines.
    Our approach is based on the model-driven SPLE approach DOPLER (Dhungana et al.,
    2011) and supports generating both deliverable documents and software systems
    from the same variability model. This is feasible as many decisions'
  merge: -1
