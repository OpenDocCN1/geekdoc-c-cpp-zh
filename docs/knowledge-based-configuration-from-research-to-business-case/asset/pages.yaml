- pgno: 326
  md: '# 25.3 User Interface


    The entry page of the WEEVIS Wiki environment is depicted in Figure 25.1. The
    idea of this entry page is similar to the entry page of Wikipedia to support the
    user in easily identifying the most relevant information units (in our context
    configuration-enhanced Wikipedia pages).


    After having selected (or created) a configurator application (this is done by
    simply inserting a link to a new Wiki page), the new configurator application
    can be defined where the MediaWiki Tag Extension System has been used to define
    a custom recommender tag. WEEVIS configuration knowledge bases can be defined
    on a textual level with a syntax that is similar to the syntax of standard Wiki
    pages. A screenshot that shows the definition of WEEVIS configurator applications
    is depicted in Figure 25.2.


