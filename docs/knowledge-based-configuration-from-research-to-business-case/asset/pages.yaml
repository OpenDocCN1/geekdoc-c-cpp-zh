    Activation sequence of the different QUICKXPLAIN instances (for details see Table
    7.2).


    QUICKXPLAIN determines exactly one conflict set per computation. In order to identify
    all minimal conflicts in C, this algorithm has to be combined with a HSDAG-based
    diagnosis algorithm (see Section 7.4). How QUICKXPLAIN determines a minimal conflict
    can best be explained on the basis of our working example (see Table 7.2). The
