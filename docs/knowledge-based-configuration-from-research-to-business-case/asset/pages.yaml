- pgno: 165
  md: 'based on the knowledge representation mechanism of the configuration problem
    solver, a phase which does not exist in standard software engineering processes.


    In the knowledge acquisition process, a knowledge engineer or system analyst has
    to identify the different stakeholders and sources of information. Many pieces
    of information may already exist in some other software system however. Information
    about different aspects of a component for example may be available in the company’s
    ERP system; calculations for the pricing process may be found in spreadsheet applications.
    This issue of embedding the configurator development into the organization’s processes
    will be further addressed in Section 11.4. Regarding the planning process for
    the development cycle, note that in some domains, it might be necessary that the
    configurator application has to be developed in parallel with the configurable
    product in order to support integration testing (Fleischanderl et al., 1998).
    In these situations, the knowledge to be acquired may still be unstable and continuously
    changing. Consequently, the choice of the right knowledge acquisition techniques
    is crucial. In this section, therefore we will focus on aspects of how to acquire
    the configuration model in a correct and efficient way.


    # 11.2.1 Experiences from Early Expert Systems


    One of the earliest knowledge-based, large-scale configurator applications was
    DEC’s R1 (XCON) rule-based “configurer” for VAX-11/780 computer systems (McDermott,
    1982). Besides the fact that this was also one of the first expert systems successfully
    implemented in industry, it is also one of the few applications where an experience
    report regarding engineering and implementation issues has been published after
    10 years of practical use. In their report, Barker et al. (1989) identify various
    challenges when developing a large-scale configurator, many of which still apply
    today after more than 20 years of configuration system development in industry.


    From the business and strategic perspective, one main problem then and still today
    is to establish an appropriate link between the business and the “technologists”
    (the configurator developers). This aspect is particularly important since offering
    configurable products on the market is a strategic decision and requires the coordination
    of several business functions. At DEC at that time, it was also important to have
    a strong commitment from management to build systems with then-innovative but
    immature expert systems technology, which additionally required long learning
    and training phases for newly-hired developers. Today, declarative technology
    and in particular constraint-based approaches have reached some level of maturity
    but are still far from being “standard” tools in industrial software development
    practices. Even though some approaches such as the one by Agarwal and Tanniru
    (1992) toward a structured development process for the case of rule-based systems
    have been made, the question of the proper integration of knowledge-based system
    development phases into standard software engineering processes (think, e.g.,
    of testing of such systems) is still largely open today.


    From the perspective of the application domain, Barker et al. (1989) identify
    the problems of volatility, scope expansion, and complexity. In their domain,
    about 40% of the rules changed per year. Scope expansion means that the system
    has become more and more integrated with other tools and was used by different
    business groups, so that various other systems had to be connected with the configurator
    and additional functionality was continuously required. Regarding the complexity
    aspect, Barker et al. report that the rule base comprised more than 10,000 rules
    after 10 years and that the component database contained more than 30,000 different
    parts.'
