- pgno: 235
  md: '# Tacton: Use of Tacton Configurator at FLSmidth


    Klas Orsvärn* and Morten H. Bennick†

    *Tacton, Stockholm, Sweden

    †FLSmidth, Copenhagen, Denmark


    Abstract: FLSmidth is a leading vendor of equipment for cement plants, with a
    long experience of using software to support product configuration in making proposals
    as well as in order processing. This paper describes their experience implementing
    Tacton Configurator, integrated with various other systems such as SolidWorks
    3D CAD, SmartPlant 3D, Mathcad, and legacy ERP. Integration was found to be a
    critical success factor. Other critical success factors were the use of a powerful
    constraint-solver engine as well as product experts dedicated to configuration
    modeling. We describe the identified business benefits such as improved productivity,
    shorter lead times, standardization, higher quality, and increased market share.


    # 17.1 Introduction


    FLSmidth is the world’s leading supplier of complete cement plants, as well as
    a leading supplier of plants and equipment for minerals processing. We begin by
    describing the company and its business. We briefly describe their previous experiences
    of using configurators and why Tacton Configurator was chosen to replace them.
    One critical success factor was the use of a powerful constraint-solver, thus,
    we describe the advantages and some of the important requirements of such a configurator.
    The company has appointed a dedicated team of engineers to take care of most of
    the configuration modeling. Integrations to related business and engineering systems
    are important for reaching the full benefits of configuration systems (Tiihonen
    and Soininen, 1997). We describe the integrations of FLSmidth at a high level.
    Finally, we describe the identified business benefits and draw some conclusions.


    # 17.2 FLSmidth Company Introduction


    Headquartered in Copenhagen, Denmark, FLSmidth employs approximately 14.000 people
    around the world, most of whom are engineers. Although most of the products are
    designed by FLSmidth, most of its manufacturing is outsourced to suppliers.


    FLSmidth strives continually to improve efficiency and quality. For that reason,
    the company has been at the forefront of industrial equipment vendors in using
    software to support engineering and handling of product data. FLSmidth has acquired
    a lot of companies that supply related equipment, which exemplifies a strong trend
    in the industrial equipment sector; to consolidate and become a one-source supplier
    of a complete end-to-end manufacturing process solution. This also means that
    staff'
  merge: -1
  img_proc: true
- pgno: 236
  md: 'involved in the process from customer inquiry to order fulfillment must handle
    a very wide range of products, which makes the use of product configuration tools
    essential for generating quotations—calculating the cost and price, producing
    proposal documentation that describes the proposed solution, and processing orders
    to systems for manufacturing execution and supply chain.


    # 17.3 Cement Plants


    The size of a complete cement plant is gigantic, in the order of one kilometer
    long, and the biggest product can be over a hundred meters high (Figure 17.1).
    The input to a cement production plant is raw materials such as limestone and
    clay. The process of producing thousands of tons of cement per day from this input
    consists of numerous steps including crushing, grinding, mixing, heating, and
    cooling. Each step is performed by one or several configurable products. Between
    and within all these processes, the materials are transported via various types
    of conveyors, mechanical as well as pneumatic. In total, a cement plant consists
    of hundreds of configurable products, most of them designed by FLSmidth. Each
    product is highly configurable in its own right, many of them consisting of thousands
    of components. The configurator software must be able to configure the individual
    products one by one, but also to configure the whole system of products. The equipment
    configuration depends heavily on the specific properties of the raw materials
    at hand at the customer site, choice of different techniques, capacity


    ![](img/214a17cc1f5bbf0914497c7414128438_236_0.png)


    # FIGURE 17.1


    A cement plant supplied by FLSmidth.'
  merge: -1
  img_proc: true
- pgno: 237
  md: 'requirements, available space, and so on. In all products, reducing pollution
    and energy consumption is very important. The configurator must therefore be able
    to integrate with sizing calculations to take those application requirements into
    account. Although layout decisions are made by the plant designer, by using the
    plant design software, the configurator must be able to parameterize product configurations
    so that components can be customized automatically in terms of dimensions and
    positions to comply with the spatial requirements driven by the layout.


