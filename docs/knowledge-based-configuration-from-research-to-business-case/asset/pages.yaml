- pgno: 139
  md: '# 9.4.3 Attainable Benefits and Process Satisfaction


    Choice navigation not only avoids complexity of choice and the negative effects
    of variety from the customers’ perspective; offering choice to customers in a
    meaningful way, on the contrary, can provide new profit opportunities (Franke
    and Schreier, 2010). Research has shown that up to 50% of the additional willingness
    to pay for customized (consumer) products can be explained by the positive perception
    of the co-design process itself (Franke and Piller, 2004; Franke and Schreier,
    2010; Merle et al., 2010; Schreier, 2006). Products co-designed by customers may
    also provide symbolic (intrinsic and social) benefits for them, resulting from
    the actual process of co-design rather than its outcome. Schreier (2006) quotes,
    for example, a pride-of-authorship effect. This effect relates to the desire for
    uniqueness, as discussed before, but here it is based on a unique task and not
    the outcome. In addition to enjoyment, task accomplishment has a sense of creativity.
    Participating in a co-design process may be considered a highly creative problem-solving
    process by the individuals engaged in this task, thus becoming a motivator to
    purchase a mass-customized product. Communicating this created product individuality
    is supported by a growing number of social media applications (e.g., Facebook,
    Twitter, Pinterest, YouTube, Google Plus). The integration of customers in social
    networks is consequently another field, which recent papers (Blazek et al., 2012;
    Piller et al., 2012) focus on.


    An important precondition for customer satisfaction through co-design is that
    the process itself should be successful. The customer has to be capable of performing
    the task. This competency issue involves flow, a construct often used by researchers
    to explain how customer participation in a process increases satisfaction (Csíkszentmihályi,
    1990). Flow is the process of optimal experience achieved when motivated users
    perceive a balance between their skills and the challenge at hand during an interaction
    process (Novak et al., 2000). Interacting with a co-design toolkit may lead to
    this state, as recent research in marketing indicates (Dellaert and Stremersch,
    2005; Franke et al., 2008; Fuchs et al., 2010). Accordingly, recent research has
    provided several design guidelines that should facilitate this effect of process
    satisfaction (Dellaert and Dabholkar, 2009; Franke et al., 2009; Randall et al.,
    2005).


    # 9.4.4 Learning Relationship


    The interaction between the manufacturer and the customer that is underlying a
    co-design process offers further possibilities for building loyalty and lasting
    customer relationships. Once a customer has successfully purchased an individual
    item, the knowledge acquired by the manufacturer represents a possible barrier
    against switching to other suppliers. Reordering becomes much easier for the customers.
    Consider, as an example, the case of Adidas, the large manufacturer of sporting
    goods (Berger et al., 2005). In 2001, the company introduced its mass customization
    program “mi adidas,” offering custom sport shoes with regard to fit, functionality,
    and aesthetic design. The process starts with a customer who wants to buy personalized
    running shoes for around $150. The more customers tell the vendor about their
    likes and dislikes during the integration process, the better the chance of a
    product being created that meets the customers’ exact needs at the first try.
    The manufacturer can draw on detailed information about the customer for the next
    sale, ensuring that the service provided becomes quicker, simpler, and more focused.
    The information status is increased and more finely tuned with each additional
    sale.


    When Adidas entered into a learning relationship with its customers, it increased
    the revenues from each customer because, in addition to the actual product benefits,
    it simplified the purchasing decision, so that the customer keeps coming back.
    By aggregating information from a segment of individual customers, Adidas also
    gains valuable market research knowledge. As a result, new products for the'
