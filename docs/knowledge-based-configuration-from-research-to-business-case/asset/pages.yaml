    Another approach to personalize item rankings was introduced in Felfernig et al.
    (2008). The approach utilizes Multi-Attribute Utility Theory (MAUT; Winterfeldt
    and Edwards, 1986) where products or, for example, individual attribute values
    are evaluated according to their performance on a predefined set of interest dimensions
    D and user preferences. Example dimensions in the mobile phone scenario could
    be fashion (fa), economy (eco), and functionality (fu). Contribution of a product
    p to interest dimension d is predefined and expressed as score sc_d(p). User preferences
    are expressed as interest with respect to each dimension in_d. The utility of
    a product u(p) can be determined, for example, on the basis of Formula 13.5.


    ```

    u(p) = Σ_{d∈D} sc_d(p) * in_d   (13.5)

    ```


