    | alternative (P, C₁, C₂, ..., Cₙ) | (C₁ ↔ (¬C₂ ∧ ... ∧ ¬Cₙ ∧ P)) ∧ (C₂ ↔ (¬C₁
    ∧ ¬C₃ ∧ ... ∧ ¬Cₙ ∧ P)) ∧ ... ∧ (Cₙ ↔ (¬C₁ ∧ ... ∧ ¬Cₙ₋₁ ∧ P)) |

    | requires(P,C) | P → C |

    | excludes(P,C) | ¬P ∨ ¬C |


    # Semantics of Feature Models


    The semantics of feature models can be defined using the static constraint representation
    introduced in Subsection 6.2.1. If we want to express the optional relationship
    between Mobile Phones and GPS, we can express this relationship in terms of the
    constraint GPS → Mobile Phones. If our goal is to translate a feature model into
    a static CSP representation, the rules depicted in Table 6.1 can be applied. In
    this definition, P represents the higher-level feature and C a lower-level feature
    that has a relationship to P.


    Solution search for feature models can be implemented on the basic algorithms
    that are able to solve static constraint satisfaction problems (SCSPs) or satisfiability
    (SAT) problems.


    # 6.3.2 UML Configuration Models


    We now introduce a UML-based configuration knowledge representation¹³ that can
    also be used in complex domains where size and structure of configurations are
    unknown beforehand. In this context, we introduce a configuration model of personal
    computers (PCs), which is used as a working example in this book. It consists
    of two major parts: (1) The basic structure of a PC is represented in terms of
    a partonomy with associated generalization hierarchies (see Figure 6.7) and (2)
    additional constraints that restrict the combination of individual components.
    Some basic constraints (gc1, gc2, gc3) are directly integrated in the configuration
    model of Figure 6.7; the remaining ones (prc1, prc2, resc1, resc2, crc1, crc2,
    crc3, crc4, compc1, compc2, compc3) are introduced textually in Table 6.2.¹⁴ The
    modeling facilities introduced in the following can be seen as major concepts
    needed for the design of a configuration model (Falkner and Haselböck, 2013; Felfernig,
    2007; Felfernig et al., 2000a, 2001, 2003; Soininen et al., 1998). For the representation
    of configuration models in UML we rely on the notation of class diagrams; no further
    notations such as component diagrams or sequence diagrams are needed in this context.


    ¹³ Unified Modeling Language (Booch et al., 2005).


    ¹⁴ For a detailed discussion of how to represent these constraints using the UML
    constraint language OCL (Warmer and Kleppe, 2003) refer to Felfernig (2007).'
