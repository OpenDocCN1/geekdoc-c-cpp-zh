    size of the minimal conflict and n is the number of constraints in C (Junker,
    2004). The best case complexity with regard to the number of consistency checks
    is log₂(n/k) + 2k.


    Note that both of the presented conflict detection algorithms determine conflicts
    depending on the constraint ordering. If we reverse the ordering of the constraints
    of both algorithms, we would receive the conflict set CS₂ = {c₁, c₂, c₅} first.
    For a more detailed discussion of issues related to constraint orderings and their
    role in conflict detection refer to Junker (2004).


    # 7.3.3 Runtime Performance of Conflict Detection Algorithms


    We conclude our discussion of conflict detection issues with an analysis of the
    runtime performance of the presented algorithms when executed on real-world configuration
    datasets taken from www.splot-research.org. The average runtime of the two algorithms
    was measured in milliseconds (ms) where in each setting the ordering of the constraints
    was randomized and each setting was executed 100 times. It becomes clear that
    QUICKXPLAIN clearly outperforms SIMPLECONFLICTDETECTION in all of the analyzed
    settings (see Table 7.3).


    A major influence factor for the performance of QUICKXPLAIN is the size of conflict
    sets—the more elements in the conflicts, the more consistency checks are needed
    for determining one minimal conflict set. Another factor that has an impact on
    the performance of QUICKXPLAIN is ordering of the constraints in the consideration
    set C. The more these constraints are spread over C the more consistency checks
    can be expected since less constraints can be omitted in early phases of QX execution.


    # 7.4 Determining Minimal Diagnoses


    Conflict sets help to identify areas of inconsistencies within a set of constraints.
    If we want to know the minimal set of constraints that have to be adapted (or
    deleted from the configuration knowledge base) such that a solution can be found
    for the given configuration task, we need to determine the (minimal) diagnoses
    with regard to the determined conflict sets. Based on our definition of a conflict
    set in Section 7.3, we now introduce the definition of a diagnosis task and the
    corresponding diagnosis (solution).'
