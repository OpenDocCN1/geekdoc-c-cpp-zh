    | p1 | 0 | 0.000 | 69 | 1.000 | false | 0.000 | 1.000 |

    | p2 | 7.2 | 1.000 | 149 | 0.000 | true | 1.000 | 2.000 |

    | p3 | 3.6 | 0.500 | 99 | 0.625 | false | 0.000 | 1.125 |'
