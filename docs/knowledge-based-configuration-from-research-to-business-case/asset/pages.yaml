    Besides concepts for representing component types, concept instances are used
    for representing actual components. However, instances are typically not specified
    in the configuration model but created by the reasoning system, especially by
    a task description (or by a structuring configuration step, see later). A task
    description represents user’s initial requirements (see, e.g., Mittal and Frayman,
    1989). Such a description is given in terms of an aggregate, which is to be configured:
    the goal of the configuration process. Typically, the goal is represented by the
    root node of the compositional hierarchy. A task description may also define additional
    requirements such as choices of parts, other aggregates, or prescribed properties.
    An example of a task description is the following:


    ```

    (define-construction-task

    :name construct-pc

    :goal PC

    :instances

    ((?pc :type PC :usage scientific)    ; (*)

    (?hdisk :type MaxStoreDisk))        ; (**))

    ```


    A PC should be constructed for scientific usage (*), which contains at minimum
    a harddisk of type MaxStoreDisk (**).


    Procedural Knowledge. PK = {s1, …, sw} is a set of strategies. Each strategy is
    a tuple ⟨FO, SC⟩, where FO (focus) defines a set of construction steps inferred
    from the concept definitions CO and manages those in an agenda. Each construction
    step represents one decision, for example, the setting of a property value. Each
    construction step is of type parameterization, specialization, or structuring,
    where the last determines a decision about a relation between concept instances.
    The structuring configuration step type can be of type top-down structuring or
    bottom-up structuring. Top-down structuring steps configure structural relations
    starting from a concept c to its relative concepts ri. This relation instantiates
    new concept instances of ri or uses existing ones for establishing the structural
    relation. For example, for an aggregate (a concept), the parts (the relative concepts)
    are generated, if they are not already present in the partial configuration. A
    partial configuration represents all decisions made so far and their implications.
    Bottom-up structuring steps configure structural relations starting from relative
    concepts ri to the related concepts cj. This relation instantiates new concept
    instances of cj or uses existing ones for establishing the structural relation;
    for example, for integrating parts in an aggregate, the aggregate is generated
    if it is not already present in the partial configuration.


    In general, a construction step describes a valid property value of a concept
    instance and how this value can be changed by a value determination method (see
    later).


    A focus (FO) collects construction steps according to a modeled definition, thus,
    it zooms in on a set of configuration decisions that shall be processed. An example
    of a focus is:


    ```

    (define-focus

    :name application-focus

    :concepts (PC Application)

    :cs-type (top-down-structuring parameterize)

    :property (hasParts hdcapacity))

    ```'
