- pgno: 328
  md: '# FIGURE 25.3


    WeeVis: example personal computer configurator. Users specify their requirements
    in terms of providing answers to questions. WEEVIS determines solutions and –
    in the case of inconsistent requirements – presents a set of repair actions.


    specified as a basis of the corresponding Wiki-based application. Domain ontologies
    are defined in terms of an ontology representation language. Compared to WEEVIS,
    Baumeister et al. focus on the application of ontology representation languages,
    which are less accessible to users who are not experts in the knowledge engineering
    field. Furthermore, the WEEVIS constraint representation is focused on configuration
    domain specific knowledge representations, which makes it easier to define the
    corresponding domain knowledge.


    *Configuration Knowledge Representations.* There is a long history of developing
    representation languages for configuration problems. One of the first approaches
    to a consistency-based characterization of a configuration problem has been proposed
    by Mittal and Frayman (1989). Thereafter different types of constraint-based representations
    have been developed, ranging from dynamic constraint satisfaction problems (see
    Mittal and Falkenhainer, 1990) to so-called generative constraint satisfaction
    problems (see Stumptner et al., 1998). An in-depth overview of different types
    of basic configuration knowledge representations can be found in Stumptner (1997).
    Felfernig (2007) introduced an approach to define configuration knowledge bases
    on the basis of the Unified Modeling Language (UML) and Felfernig et al. (2003)
    also show how to represent such models on the basis of description logics based
    concepts. Soininen et al. (1998) introduce a general ontology that includes relevant
    concepts needed for configuration knowledge representation.


    *Configuration Environments.* Felfernig et al. (2006) introduce an environment
    for the graphical development of knowledge-based recommender applications. This
    environment has commonalities with the basic functionalities of WEEVIS: product
    alternatives are explicitly specified and then selected and ranked on the basis
    of a given set of user requirements. Tihonen et al. (2003, 2013) introduce their
    answer-set programming based configuration environment WeCoTin, which is an environment
    dedicated to the graphical definition of large-scale configuration knowledge bases.
    Major configuration-related constraint types can be defined on a graphical level.
    More complex constraints have to be defined in a proprietary logic-based knowledge
    representation language. Other graphical development environments


    ![](img/214a17cc1f5bbf0914497c7414128438_328_0.png)'
  merge: -1
  img_proc: true
- pgno: 329
  md: 'are presented in Haselböck and Schenner (2014),⁴ Krebs (2014),⁵ and Hotz and
    Günter (2014).⁶ The major difference between WEEVIS and other configuration knowledge
    base development environments is that we can expect that more users are able to
    deal with modeling configurators in Wikipedia compared to the alternative of defining
    knowledge bases with (provider-) specific environments. However, admittedly, the
    major drawback of WEEVIS is its limited expressiveness compared to more general
    knowledge representation formalisms (see Hotz et al., 2014⁷). Furthermore, graphical
    constraint management facilities have to be integrated in order to achieve widespread
    use.


    *Anomaly Management.* Most of the existing configuration environments include
    different types of anomaly detection (see Felfernig et al., 2014⁸) or at least
    consistency management functionalities. In a similar fashion, WEEVIS includes
    a basic implementation of the FASTDIAG diagnosis algorithm (Felfernig et al.,
    2012), which supports users in situations where no solution can be found. Furthermore,
    WEEVIS allows the specification of test cases that can be exploited for the purposes
    of regression testing. The integration of further quality assurance mechanisms
    such as the automated debugging of WEEVIS knowledge bases, redundancy detection
    (Felfernig et al., 2011), and diagnosis discrimination (Shchekotykhin et al.,
    2012) is within the scope of future work.


    # 25.5 Conclusion


    In this chapter we have introduced the WEEVIS environment for the Wiki-based development
    and maintenance of simple configuration knowledge bases. WEEVIS is especially
    useful in scenarios where groups or communities of users are interested in commonly
    providing a configurator application to the whole public or to a specific group
    of users. From the technological point of view the major advantage of WEEVIS is
    the development and maintenance of configuration knowledge bases without the overhead
    of getting acquainted with a completely new technology. Major issues related to
    the further development of WEEVIS are the integration of personalization concepts
    (Ardissono et al., 2003; Tiihonen and Felfernig, 2010) that help to rank the set
    of determined solutions (configurations), the integration of additional quality
    assurance mechanisms (beside the basic versioning concept of Wikipedia), and the
    further development of the WEEVIS language itself in the sense of improving the
    understandability and reducing the cognitive complexity of the provided modeling
    concepts.


    # Acknowledgments


    The work presented in this chapter was partially funded by the Austrian research
    promotion agency (grant number: 827587).


