    Map coloring configuration model: graphical representation of a CSP where the
    nodes represent the variables and the arcs represent constraints.


    ![](img/214a17cc1f5bbf0914497c7414128438_69_0.png)


    Finally, we introduce the set of constraints C = C_KB ∪ REQ to be taken into account
    when configuring (coloring) a map. The elements of C_KB are those constraints
    that are defining the restrictions regarding the color combinations of neighborhood
    territories.


    ```

    C_KB = {WA ≠ NT, WA ≠ SA, NT ≠ SA, NT ≠ Q, SA ≠ Q, SA ≠ NSW, SA ≠ V, Q ≠ NSW,
    NSW ≠ V}

    ```


    A CSP can also be represented graphically in terms of nodes (the variables) and
    the corresponding constraints (arcs between the variables); Figure 6.2 shows a
    graphical depiction of the map coloring configuration model.


    Customer requirements in this context can be preferences (in terms of initial
    settings) regarding the coloring of the map. For example, we could introduce the
    singleton requirement REQ = {WA = r}; that is, the color of Western Australia
    (WA) should be red (r). Then REQ ∪ C_KB is consistent; that is, we are able to
    determine a solution for the map coloring (configuration) problem.


    ```

    S = {WA = r, NT = g, SA = b, Q = r, NSW = g, V = r, T = r}

    ```


    # Example: Mobile Phone Configuration


    The following configuration model of a mobile phone is based on the model of a
    mobile phone software product lines (adapted from Benavides et al., 2010). We
    will provide a formalization of this model on the basis of the definition of a
    configuration task given in Subsection 6.2.1. See Figure 6.3 for a graphical depiction
    of the mobile phone configuration model.


