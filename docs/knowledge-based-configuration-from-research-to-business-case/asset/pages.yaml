    +   - The results of sellAIR Web can be directly transferred into orders in SAP
    SD (Sales and Distribution).


    # 18.4 Conclusion


    We have shown that reusing ERP-based product configuration models in sales-oriented
    scenarios has many benefits. But additional functional requirements from the sales
    perspective have to be taken into account. Depending on their placement in the
    sales process (before, during, or after product configuration), this has different
    consequences on the configuration task. The spectrum ranges from additional search
    mechanisms for the right configurable product up to a sales-oriented model for
    a system or solution on top of the ERP-based product models. The concrete impact
    of this approach was illustrated with a sales application at the German company
    Boge.


