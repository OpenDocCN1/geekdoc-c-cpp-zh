- pgno: 356
  md: 'on the configuration, perhaps reserving materials in the chosen manufacturing
    plant. For a configurator to do this is only possible in a tight integration such
    as that of the SAP VC (another USP).


    Furthermore, it is essential that configurations, which are flagged as consistent
    and complete by the SAP VC, can be manufactured and delivered at the promised
    price and date. Again, this is greatly facilitated by having the same master data
    as source for both the configuration model and the manufacturing processes.


    Finally, it was discerned that sales configuration is a three-tier approach. At
    the bottom is the low-level BoM explosion of potentially tens of thousands of
    parts (e.g., in the MRP run). This is non-interactive and best handled with a
    separate implementation that is freed from all overhead regarding possible explanations.
    The middle level is called manufacturing completion. This, as in XCON, takes a
    sales configuration, verifies that it is correct, and completes it by deriving
    values for additional characteristics and perhaps instantiating additional components.
    The result of manufacturing completion is input to the low-level BoM explosion.
    The first tier is the sales configuration. As opposed to the other two levels,
    it normally does not depend on the manufacturing plant. The top two tiers both
    allow the use of constraints. The low-level task allows only selection conditions
    and procedures. The SAP VC actually handles the first two together. Only the low-level
    BoM explosion is implemented separately. Nevertheless, it would be a boon to formally
    separate the top-level interactive configuration from the completion configuration
    making it easier to manage the overall performance of the configuration. In XCON-like
    scenarios the SAP VC only performs the manufacturing completion task (based on
    sales orders obtained through other means) and triggers the low-level BoM explosion.


    # 27.7 The SAP IPC (Internet Pricing and Configuration)


    From the perspective of many customers that configure both in the SAP CRM (*Customer
    Relationship Management*) and the SAP ERP systems, the SAP IPC configurator is
    just a reimplementation of the SAP VC in Java with less integration and an annoying
    list of small differences (the so-called *IPC delta list*). The IPC is functionally
    part of the CRM system, can be attached to the ERP system, has a web-suitable
    interface, and can operate detached from the ERP system. It also supports customers
    who have configuration processes in CRM that do not have configuration models
    in ERP.


    The motivation for its creation was based on specific customer requirements. These
    customers wanted a standalone configurator for sales that was not as BoM-oriented
    as the SAP OS/2 and VC configurators were and that supported further relations
    between objects, such as connection relations and containment relations, among
    others.²³


    Based on these requirements, a configurator engine was designed and implemented
    in Java called the SAP SCE (*Standalone/Sales Configurator Engine*).²⁴ The SCE
    is now part of the IPC. Model data is extracted from R/3 (SAP ERP). All model
    data the SAP VC normally collects dynamically for a


    > ²³They turned to SAP because they wanted to keep the benefits of the SAP VC
    (the unity of model and master data and the assurance that correct configurations
    could be manufactured as promised). They organized in the American Configurator
    Work Group (ACWG). Since then, the group has become international and is now simply
    called the CWG. There is a section devoted to the CWG in Blumohr et al. (2012).


    > ²⁴Initially, there was no plan to create an UI, as it was thought that for sales
    all customers would prefer to create their own. However, it soon became apparent
    that without an UI nothing could be tested or demo’ed. Subsequently, the quest
    for a generic UI that could be easily customized by customers was a perennial
    topic in the further development of this configurator.'
  merge: -1
