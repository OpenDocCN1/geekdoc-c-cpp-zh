- pgno: 282
  md: 'Let us assume that the process is to be configured for a Gold contract. The
    configuration model entails that ¬t₂, ¬f₂, ¬t₅, and ¬t₆; hence tasks t₂, t₅, and
    t₆ are skipped. Task t₃, its outgoing flows, and the Rejected end state are removed,
    as they are unreachable if f₂ is blocked. Gateway g₁ is also skipped because it
    degenerates to a simple sequence. The resulting process comprises the task sequence
    t₁, t₄.


    # 21.3.4 Achievements and Cases


    Process configuration has been successful in several large projects. Gottschalk
    and La Rosa (2010) describe a case study from the Film industry using a process
    of several hundred tasks and a questionnaire model with 53 questions and 162 facts.
    Mayer et al. (2011) describe configuration and validation of a large software
    and hardware development process that comprised several thousand elements. Their
    model revealed more than 130 errors in manually created adaptations and eliminated
    unnecessary tasks from configured processes. Gottschalk et al. (2009) applied
    process configuration in Dutch municipalities and conclude that configuration
    of control aspects is beneficial but should include other perspectives as well.


    # 21.4 Conclusion


    Service and process configuration technology can deliver significant benefits
    for providers and their customers, in particular in the services sector, where
    a variety of services from different providers can be bundled together over extended
    periods of time. Configuration technologies have extended from purely technical
    compatibility to the customers’ environment and maintenance of long-term customer
    relationships. Configuration systems have themselves become configurable in order
    to accommodate customers’ preferences, where models of technical systems and product
    features have been complemented with adaptive user and dialog models. Extensible
    configuration frameworks have been devised in order to capture, configure, and
    validate process aspects related to service development and provisioning.


    Bridging the gap between the often informal use of product and process models
    in organizations and the formal precision required for automated configuration
    however remains challenging, as is supporting domain experts in the development
    of extensible configuration models from (abstract) domain concepts. Current methods
    and commercial systems for developing and validating configuration models are
    mostly focused on relatively static feature models or require expert knowledge
    in formal methods. Acquisition, testing, and validation of configuration models
    for processes, recommender systems, and reconfiguration mechanisms require further
    research in order to become applicable in mainstream configuration systems.


    # Acknowledgments


    We thank Technology Development Centre of Finland (projects WeCoTin, ConSerWe,
    and Cosmos), related companies, and Aalto University Service Factory for financial
    support.'
