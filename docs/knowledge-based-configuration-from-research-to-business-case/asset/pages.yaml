    three-day training session, the FL Smidth engineers were able to do all the required
    modeling work by themselves, using the remote product support of Tacton. The configuration
    modeling was initially done at the headquarters in Copenhagen. But since most
    of the engineering is today done at FL Smidth’s office in Chennai, India, the
    configuration modeling has mostly been taken over by a team of engineers there.
    They have very good knowledge of the products and their applications, which reduces
    the overhead of communication'
