  md: "```\nOBJECTS:\n    ?S IS_A (300)STAIRCASE\n        WHERE ?a = ANGLE; ?hr =\
    \ HEIGHT_HANDRAIL,\n    ?P IS_A (300)POST\n        WHERE ?hp = HEIGHT; ?pos =\
    \ POSITION_ON_STEP\n\nCONDITION:\n    PART_OF(?P, ?S)\n\nRESTRICTIONS:\n    ?hp\
    \ = ?hr + ?pos * TAN(2*3.14/360 * ?a)\n```\n\n**FIGURE 27.2**\n\n(Conceptual)\
    \ Constraint in SAP syntax.\n\ndiscussed here, because CSP constraints are not\
    \ explicit there. The variables of a constraint⁸ refer to entities in the model\
    \ and their properties. When the constraint is applied, its variables are bound\
    \ to the corresponding properties (values or domains) of object instances in the\
    \ configuration. The constraint can then be evaluated using those bindings.\n\n\
    # 27.3.2 Local Constraint Propagation and Arc Consistency\n\nThe approach to reasoning\
    \ with constraints taken in the TEX-K project was fairly simple. The primary inference\
    \ technique associated with constraints is *local constraint propagation* to achieve\
    \ *arc consistency* (see Hotz et al., 2014b, Chapter 6); that is, a constraint\
    \ is used to filter out nonallowable values and reduce the domains of its variables\
    \ wherever possible. The search for an actual solution, perhaps requiring the\
    \ formulation of suitable heuristics, was considered as a separate problem and\
    \ not a topic of constraints themselves.\n\nThe approach to arc consistency was\
    \ influenced by work of Hans-Werner Güsgen (Güsgen, 1988; Ho et al., 1994) in\
    \ the TEX-B project, a sister project of TEX-K devoted to developing basic techniques\
    \ useful in technical XPS for diagnosis or configuration. Local propagation can\
    \ also be applied in the case of linear numeric inequalities/equalities with real-valued\
    \ variables with interval domains (Haag, 1989).\n\nThe equality in the staircase\
    \ example is linear in the three variables *hr*, *hp*, and *pos*. Thus, assuming\
    \ the angle α is known, the constraint can be used to ensure arc consistency of\
    \ the other three variables⁹ (for all staircase/post pairs). To illustrate these\
    \ concepts: assume the angle of ascension is 45° (tan α = 1) and the height of\
    \ the handrail is 75cm, and the steps are 32cm deep, then the variable *pos* (position\
    \ of the post on the step) is restricted (without considering further constraints)\
    \ to the interval [0, 32]cm and, consequently, the constraint can restrict the\
    \ variable *hp* (the height of the post) to [75, 107]cm.\n\n> ⁸In the sequel I\
    \ shall simply use the term constraint to refer to conceptual constraint.\n> \n\
    > ⁹In SAP constraint syntax the variables that are subjects of constraint propagation\
    \ can be declared by adding the following to the constraint in Figure 27.2: INFERENCES:\
    \ ?hp, ?pos. This means that the other variables must be given before the constraint\
    \ can be applied. (?hr was consciously omitted as an inference, because it makes\
    \ business sense to specify its value up front.)"
