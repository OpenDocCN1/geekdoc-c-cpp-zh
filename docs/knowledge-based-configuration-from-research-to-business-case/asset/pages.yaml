    Note that a conceptual constraint looks like a rule (having a condition part,
    the structural situation, and an action part, the constraint calls), however,
    the constraint calls do not directly change any properties but instantiate a constraint
    relation. Thus, the constraint calls of a conceptual constraint increase a constraint
    net when the structural situation is recognized in the configuration created so
    far (similar to activation constraints; see Hotz et al., 2014b⁸).


    Constraint Relations. Each constraint relation cr ∈ CR consists of a set of constraint
    pins and an algebraic expression or a relational table relating the constraint
    pins intensionally or extensionally. A constraint pin is a reference to a property
    value of a concept instance. Typically, a constraint relation is domain-independent.
    An example of a constraint relation is the following; it implements the equation
    summand1 + summand2 = sum.


    ```

    (define-constraint-relation :name adder

    :constraint-type function

    :external-pins (summand1 summand2 sum)

    :function

    (let ((summand1 (sect summand1

