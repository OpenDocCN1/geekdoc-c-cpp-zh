- pgno: 113
  md: '# User Interfaces for Configuration Environments


    Gerhard Leitner*, Alexander Felfernig†, Paul Blazek‡, Florian Reinfank† and Gerald
    Ninaus†

    *Alpen-Adria Universität Klagenfurt, Klagenfurt, Austria

    †Graz University of Technology, Graz, Austria

    ‡cyLEDGE, Vienna, Austria


    Abstract: Configuration technologies are successfully applied in different domains
    such as telecommunication, financial services, and automotive. User interfaces
    of configuration environments play a key role with regard to two major aspects.
    First, users of a configurator application need interfaces that allow for efficient
    and intuitive configuration processes. Second, knowledge engineers and domain
    experts (developers of configurator applications) need interfaces that provide
    intelligent support of development and maintenance operations. In this chapter
    we discuss aspects that should be taken into account when developing user interfaces
    for configurator end users and application developers.


    # 8.1 Introduction


    Configuration is one of the key technologies of mass customization (Anderson and
    Pine, 1996; Pine, 1999; see also Piller and Blazek, 2014¹). It can be defined
    as a special case of design activity where the resulting artifact is composed
    from a predefined set of component types and is consistent with a given set of
    constraints (Sabin and Weigel, 1998). Configuration environments allow endusers
    to design their own individualized products and services and knowledge engineers
    and domain experts to develop configurator applications (mainly user interfaces
    and knowledge bases). For both types of users, the user interface of the configuration
    environment plays a key role. First, a major precondition for lasting acceptance
    and application is that end users can easily configure a product that fits their
    wishes and needs (Ardissono et al., 2003; Falkner et al., 2011). Second, knowledge
    engineers and domain experts need technologies that allow effective development
    and maintenance, which are a precondition for up-to-date knowledge bases (Blythe
    et al., 2001). For both scenarios we discuss properties of user interfaces that
    help to make the application of configuration technologies a success.²


    The major contributions of this chapter are the following. We provide an overview
    of important criteria to be taken into account when developing user interfaces
    for configurator applications as well as user interfaces for the corresponding
    knowledge engineering environments (see Section 8.2). For the criteria, we present
    and exemplify supporting technologies (see Section 8.3). In the following, we


    > ¹Chapter 9.

    > ²An overview of configuration tools and user interfaces can be found in Part
    V.'
  merge: -1
  img_proc: true
- pgno: 114
  md: 'discuss usability issues related to configurator user interface construction
    in industrial practice (see [Section 8.4](#)). [Section 8.5](#) concludes this
    chapter.


    # 8.2 **Design Principles for Configurator User Interfaces**


    Contrary to conventional product design where experienced product designers and
    managers are responsible for the design of product alternatives offered to a customer,
    the task of customization is now also presented to *end users*. An important aspect
    in this context is that we cannot expect end users to possess detailed technical
    product domain knowledge. Moreover, end users typically do not know their preferences
    and needs beforehand, which makes the configuration task even more challenging
    ([Simonson, 2003](#)). As analyzed by [Randall et al. (2005)](#), there are problems
    with existing configurator user interfaces that have to be tackled in order to
    increase the usability of configuration technologies. We now summarize *five key
    principles* to be taken into account when developing user interfaces for configuration
    environments (see [Randall et al., 2005](#)). In this context we focus on both
    interfaces for *users of a configurator application* as well as interfaces that
    support *knowledge engineers and domain experts* in configurator application development
    and maintenance. A discussion of relevant approaches to support the presented
    design principles is given in [Section 8.3](#).


    **Principle 1: Customize the Customization Process.** Sales persons are typically
    adapting their customer interaction style depending on the type of customer. For
    example, customers interested in technical details should be supported by in-depth
    technical information and corresponding analyses. In contrast, customers without
    expertise in the product domain should be supported by a more function-oriented
    dialog where technical details are omitted. Since we can expect different types
    of end users of a configurator application, we need technical approaches that
    help to personalize the interaction with the configuration environment depending
    on the basic characteristics of the current user (see also [Tihonen et al., 2014](#)).
    As proposed by [Randall et al. (2005)](#), a configuration environment should
    support at least two different types of user interfaces: a *needs-based interface*
    for non-experts and a *parameter-based* one for users who want to perform configuration
    primarily on the basis of the given set of technical product properties.


    Similar to end users there are also different types of *knowledge engineers and
    domain experts* responsible for the development and maintenance of a configurator
    application. There may be experts who know every technical property of the product,
    as well as novices or new employees who recently started and did not acquire enough
    expertise yet about the knowledge representation. These two types of users need
    different navigation styles.


    **Principle 2: Provide Starting Points.** Users of a configurator application
    can not only be differentiated with regard to their product preferences, they
    can also be differentiated with regard to their *preferred product properties*
    (i.e., properties of a product they are interested in and would like to specify).
    For example, one user of a car configurator prefers to start with a specification
    of the *car type* (e.g., *limousine* vs. *combi*) whereas another user prefers
    to specify the *price* as a parameter with the highest priority. In this context,
    a requirement for configurator user interfaces is the provision of so-called *starting
    points*, which can be seen as a kind of initial design from which the customer
    can continue the configuration activities.'
  merge: -1
  img_proc: true
- pgno: 115
  md: 'The important idea behind starting points is that not every user is interested
    in designing (configuring) a product from scratch but rather relies on existing
    basic settings (also known as *stereotype configurations*). Starting points should
    also be provided for *knowledge engineers and domain experts*. A knowledge engineer
    (or domain expert) with nearly no knowledge about an already existing configuration
    knowledge base clearly needs an indicator of where to best start the analysis
    of the knowledge base. Such starting points can improve the overall efficiency
    of developing a basic understanding of a knowledge base, or more generally, a
    configurator application. Another example of a starting point in the context of
    knowledge base development and maintenance are recommendations (see also Tiihonen
    et al., 2014)⁴ to inspect those parts of a knowledge base that have low understandability
    (Felfernig et al., 2013a).


    # Principle 3: Support Incremental Refinement.


    Users of a configurator application typically construct their preferences within
    the scope of a configuration session (Simonson, 2003); that is preferences are
    not known beforehand. A requirement for user interfaces in this context is that
    the configurator should actively support *sensitivity analysis* in the sense that
    tradeoffs between different properties are visualized and alternatives to the
    current configuration are shown in an intuitive fashion. An easy way to support
    such a tradeoff analysis is to include *product comparison* functionalities—a
    comparison between different alternative configurations. An important functionality
    in this context is that the configurator is able to *automatically* determine
    alternative configurations on the basis of defined user preferences.


    Similarly, there is a need for the support of *tradeoff analysis in the context
    of knowledge base development and maintenance*. In this context, a knowledge engineer
    (or domain expert) should be supported in correction and extension activities.
    For example, if a domain expert has specified examples for the intended behavior
    of a configurator in terms of which configuration should be shown in which context
    (kind of test cases; see Friedrich et al., 2014⁵) and the configurator is not
    able to fulfill these requirements, then the configurator should provide the means
    for explaining the given inconsistency (see Felfernig et al., 2014⁶ and Friedrich
    et al., 2014). In this context, the user interface should support the comparison
    of explanations for the inconsistencies (e.g., diagnoses and repair proposals
    for faulty knowledge bases) and it should provide information about the pragmatics
    of changes to the knowledge base, for example, in terms of test cases, which are
    additionally accepted by the knowledge base due to the performed repairs.


    # Principle 4: Exploit Prototypes to Avoid Surprises.


    A major obstacle for the willingness to purchase a product is the lack of *trust*
    in a given configuration (Felfernig et al., 2006b; Grabner-Kräuter and Kaluscha,
    2003). Since configurations in many cases are unique, the exploitation of product
    evaluations for decision making is often impossible. Consequently, alternative
    concepts have to be provided, which help the customer to anticipate the post-purchase
    experience (Randall et al., 2005). In this context it is important to visualize
    the impact of different decision alternatives on the final configuration outcome.
    For example, a change of the *interior color* of a car has to be immediately shown
    to the user by directly visualizing the new interior of the selected *car type*.
    Another example is the configuration of financial service portfolios: after increasing
    the level of *willingness to take risks* or after increasing the *expected yearly
    return rate* of a financial service, the configurator should immediately show
    the possible consequences of the decision. For example, in terms of *less available
    money* due to plunging *stock prices* or, on a more visual level, in terms of
    the possibility of not being able to buy the envisioned car.'
  merge: -1
  img_proc: true
