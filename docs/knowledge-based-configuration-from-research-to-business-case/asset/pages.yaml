- pgno: 117
  md: '# Customize the Customization Process.


    User interfaces of configurator applications can simply be implemented on the
    basis of explicit definitions of a configuration process. Such a process defines
    in which order parameters have to be specified by the user. For our computer configuration
    example (see Hotz et al., 2014⁸) we can specify, for example, two different types
    of user interfaces. For experts in the domain of personal computers, we could
    provide a search interface where a user (customer) can specify the requirements
    at the level of technical product properties such as type of cpu, motherboard,
    operating system, screen, hd unit, internet, and application software. For non-experts
    in the product domain, a user interface could ask questions at a more abstract
    (needs-oriented⁹) level such as primary types of use (e.g., multimedia and game
    playing, programming, video editing, complex mathematical calculations, and office
    applications). This needs-oriented view on the product assortment is known as
    the functional architecture of a configurable product (see Hotz and Wolter, 2014¹⁰).
    From the specification of preferences, the configurator application can then determine
    the corresponding technical properties. For example, video editing and complex
    mathematical applications require a multicore cpu architecture.


    At both levels (functional architectures and detailed technical product properties),
    questions asked to the customer have to be ranked. The simplest way to achieve
    this is to specify a static ordering where, for example, the question regarding
    type of cpu is asked first. However, more flexible approaches have been developed,
    which help to adapt their strategy regarding the selection of the next question
    depending on the navigation behavior of the user. One approach to support a selection
    of questions “on the fly” is to apply the concepts of collaborative filtering
    (Falkner et al., 2011; Konstan et al., 1997). The idea of collaborative filtering
    is to determine recommendations for the current user on the basis of the preferences
    of users with a similar navigation behavior as the current user. In our scenario,
    in order to determine the next question to ask the current user, we would determine
    users with a similar navigation behavior (the nearest neighbors) and on the basis
    of the preferences of the nearest neighbors try to select (recommend) the next
    question to ask the current user.


    A working example of such a collaborative dialog management is shown in Table
    8.1. Users 1 through 5 have already completed their configuration sessions; for
    example, user 1 has first specified a value for CPU, then a value for OS, then
    an assignment of HD, motherboard, Screen, Internet, and finally Applications.
    The current user has already specified values for the parameters CPU and OS and
    we would like to predict which of the remaining parameters will next be specified
    by the current user. The nearest neighbors of the current user are user1, user3,
    and user4 since all of them have first selected a CPU, followed by an assignment
    of OS. Since the majority of nearest neighbors has selected motherboard as the
    third parameter, we recommend motherboard as the next parameter to be specified
    by the current user. For a more detailed overview of parameter selection methods
    refer to Falkner et al. (2011).


    A similar approach can support the navigation of knowledge engineers (domain experts)
    in complex knowledge bases (see the example in Table 8.2). In our scenario, the
    knowledge engineers (users 1–4) have already interacted with the knowledge base;
    for example, user 1 took a look at all the constraints in the following order:
    c₅, c₂, c₃, c₁, c₄, c₆.¹¹ The current user has already inspected the constraints
    c₅'
  merge: -1
  img_proc: true
