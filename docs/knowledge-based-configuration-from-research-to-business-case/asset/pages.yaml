- pgno: 154
  md: '# ### 10.4.1 Feature Model Constraints


    The feature model defined in *Figure 10.2* specifies combinations of features.
    A reduction of these combinations is achieved by following *incompatibility* and
    *requires Feature Model Constraints*.


    **Incompatibility.** A light group of type `SwitchableLightControl` is *incompatible*
    with a light group of type `DimmableLightControl` in the same room. Thus, both
    features cannot be selected at the same time by the user.


    **Constraint for sharing classes.** Each `LightGroupFeature` with a `PresenceDependent`
    requires a *distinct* `PresenceDetection`. Thus, the feature `PresenceDetection`
    is only shared for classes and not for instances.


    # ### 10.4.2 System Model Constraints


    The system model has to fulfill the following *System Model Constraints*, which
    are divided into *System Structure Constraints (ssc)* and *System Attribute Constraints
    (sac)*. System Structure Constraints restrict component types, associations, and
    cardinalities of compositional relations and, hence, influence the type and number
    of create instances for the resulting configuration (solution). System Attribute
    Constraints restrict component attributes.


    **Requires constraint (ssc).** A `SwitchableLightGroup` of a smart room *requires*
    a `Switch` in that room. Thus, instances of both component types always occur
    together in the resulting configuration.


    **Constraint for sharing classes (ssc).** Each `LightGroup` and each `SunBlindsControl`
    *has to have its individual* `SwitchType`; that is, the `SwitchType` is only shared
    for classes and not for instances.


    **Incompatibility (ssc).** The presence and brightness sensors `PBS-A` and `PBS-B`
    are *incompatible*—they cannot be used together in a room. Thus, instances of
    those component types cannot occur in one Smarthome configuration.


    **Algebraic constraint for a compositional relation (ssc).** A `PresenceDetection`
    of a room requires a *computation* of the number of `PresenceDetectors`. This
    number depends on the size (`RoomWidth`, `RoomHeight`) of the room. Thus, the
    size of a room has to be decided by the user (customer) if presence dependency
    was selected.


    **N-ary cardinality constraint (ssc).** The number of parts of a `SmartRoom` shall
    be 1 at *minimum* and 26 at *maximum*. Thus, this constraint add a further cardinality
    restriction to the ones shown in *Figure 10.3* for the component type `SmartRoom`,
    which leads to an n-ary compositional relation.


    **Algebraic constraint for expressing a physical restriction (sac).** The `ElectricalPower`,
    `Voltage`, and `Current` attributes of `VoltageSource` have to fulfill the equation:
    `ElectricalPower = Voltage * Current`. Thus, the constraint computes the attribute
    *electrical power* (`ElectricalPower`) defined for the `VoltageSource`.


    **Resource constraint (sac).** The sum of the `PowerConsumption` of all `NetworkNodes`
    has to be less than the `ElectricalPower` of `VoltageSource`. The constraint relates
    the power consumption of the network nodes (`PowerConsumption`) to the computed
    `ElectricalPower` of `VoltageSource`.'
