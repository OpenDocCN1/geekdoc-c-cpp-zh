    | Components (instances) | pc_domain(1). mbsilver_domain(2). mbdiamond_domain(3).
    cpud_domain(4). cpud_domain(5). cpus_domain(6). cpus_domain(7). osalpha_domain(8).
    osbeta_domain(9). |

    | Domain generalizations | mb_domain(X) :- mbsilver_domain(X). mb_domain(X) :-
    mbdiamond_domain(X). cpu_domain(X) :- cpud_domain(X). cpu_domain(X) :- cpus_domain(X).
    os_domain(X) :- osalpha_domain(X). os_domain(X) :- osbeta_domain(X). |

    | Component types | mbsilver(X) :- component(X), mbsilver_domain(X). mbdiamond(X)
    :- component(X), mbdiamond_domain(X). mb(X) :- component(X), mb_domain(X). cpus(X)
    :- component(X), cpus_domain(X). cpud(X) :- component(X), cpud_domain(X). cpu(X)
    :- component(X), cpu_domain(X). osalpha(X) :- component(X), osalpha_domain(X).
    osbeta(X) :- component(X), osbeta_domain(X). os(X) :- component(X), os_domain(X).
    |

    | Attribute domains | efficiency(X,b) :- mbsilver(X). efficiency(X,a) :- mbdiamond(X).
    price(X,250) :- mbsilver(X). price(X,350) :- mbdiamond(X). clockrate(X,medium)
    :- cpus(X). clockrate(X,fast) :- cpud(X). price(X,100) :- cpus(X). price(X,150)
    :- cpud(X). hdcapacity(X,6) :- osalpha(X). hdcapacity(X,13) :- osbeta(X). price(X,100)
    :- osalpha(X). price(X,500) :- osbeta(X). |

    | Generalization hierarchies | mb(X) :- mbsilver(X). mb(X) :- mbdiamond(X). cpu(X)
    :- cpus(X). cpu(X) :- cpud(X). os(X) :- osalpha(X). os(X) :- osbeta(X). |

    | Part of relationships | 1 { mb_of_cpu(X,Y) : cpu_domain(Y) } 2 :- mb(X). 1 {
    pc_of_mb(X,Y) : mb_domain(Y) } 1 :- pc(X). 1 { pc_of_os(X,Y) : os_domain(Y) }
    1 :- pc(X). |

    | Symmetry properties | cpu_of_mb(Y,X) :- mb_of_cpu(X,Y). mb_of_pc(X,Y) :- pc_of_mb(Y,X).
    os_of_pc(X,Y) :- pc_of_os(Y,X). |

    | Component generation | component(Y) :- mb_of_cpu(X,Y). component(Y) :- pc_of_mb(X,Y).
    component(Y) :- pc_of_os(X,Y). |

    | gc1 | :- mbdiamond(X), cpus(Y), mb_of_cpu(X,Y). |

    | gc2 | :- mbsilver(X), cpud(Y), mb_of_cpu(X,Y). |

    | gc3 | :- osalpha(X), not cpud(C), pc_of_os(P,X), pc_of_mb(P,M), mb_of_cpu(M,C).
    |

    | prc2'' | pcprice(A,P) :- P = #sum [price(C,PR) = PR, pc(A)]. |

    | resc1 | :- pc(X), maxprice(X,P), pcprice(X,Q), Q > P. |'
