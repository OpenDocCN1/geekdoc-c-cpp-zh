    *Filter Constraints.* In WEEVIS, filter constraints are used for expressing the
    relationship between selected customer requirements (instantiations of customer
    properties) and the corresponding product properties. For example, the price of
    a solution must not exceed the maximum price defined by the user or the selected
    *cpu* should be contained in the configuration. The complete list of filter constraints
    used in this working example is shown in Table 25.4.


    *Includes.* This is an additional constraint type that allows the definition of
    *alternative inclusions* that are not taken into account by incompatibility and
    filter constraints. An example of such an inclusion constraint is the following:
    if the user is interested in a highly energy-efficient computer, include the'
