  md: "organizations to customize and extend reference processes and configuration\
    \ models (Becker et al., 2007; Mayer et al., 2011; Rosa et al., 2011).\n\n**Declarative\
    \ Process Constraints.** Constraint-based process configuration techniques rely\
    \ on specifications of process properties. Constraints specify what must (not)\
    \ hold in any valid customized process. Pesic et al. (2010) present a model using\
    \ linear temporal logic as constraint specification language and a method for\
    \ synthesizing conforming workflows from partial executions. Mayer et al. (2011)\
    \ discuss a hybrid approach, where a reference process is tailored to project-specific\
    \ requirements using dynamic constraint satisfaction techniques and an extensible\
    \ process and resource model.\n\nComposition and configuration of computational\
    \ processes from individual Web Services has also been addressed using various\
    \ automated planning (Baryannis and Plexousakis, 2011) and dynamic constraint\
    \ satisfaction (Thiagarajan et al., 2009) techniques. These methods rely on comprehensive\
    \ formal specification of process components and goals.\n\n# 21.3.3 Example\n\n\
    Let us revisit the elevator example and examine how process configuration can\
    \ support customized service delivery. Figure 21.2 depicts a (simplified) reference\
    \ process of our elevator service provider. It comprises six tasks (t₁, …, t₆),\
    \ a decision gateway (g₁), and two guarded flows (f₁, f₂). However, not all tasks\
    \ are relevant for all contracts: billing depends on the contract type and options,\
    \ and approval of work exceeding a preset limit (tasks t₂ and t₃) is optional\
    \ and does not apply to Gold contracts.\n\nThe possible process variants can be\
    \ captured in a configuration model like the one shown in Figure 21.3. The variables\
    \ Type, Approval_limit, Spares_included, and Repair_work_included correspond to\
    \ the service options set in the contract. We write ¬tᵢ to denote that task tᵢ\
    \ shall be skipped, and ¬fᵢ to denote that flow fᵢ shall be blocked. Tasks that\
    \ are not skipped by some rule are retained in the customized process. Once skipped\
    \ tasks and blocked flows have been determined, additional tasks and flows may\
    \ be removed to eliminate unreachable tasks and unnecessary gateways.\n\n![](img/214a17cc1f5bbf0914497c7414128438_281_0.png)\n\
    \n**FIGURE 21.2**  \nMaintenance reference process.\n\n```\nType = Gold ∨ Approval_limit\
    \ = 0  →  ¬t₂ ∧ ¬f₂\nSpares_included = true        →  ¬t₆\nRepair_work_included\
    \ = true   →  ¬t₅\n```\n\n**FIGURE 21.3**  \nElevator maintenance process configuration\
    \ model."
