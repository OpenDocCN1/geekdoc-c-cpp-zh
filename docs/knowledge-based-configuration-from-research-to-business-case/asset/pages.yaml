    our approach (the constraint solver determines reconfigurations directly, i.e.,
    without using any previously computed diagnoses). The slight difference to Stumptner
    and Wotawa (1998) is that in this work we rely purely on consistency-based reasoning
    ignoring fault models, which is sufficient for our purpose.


    As we have already seen, SIMOL can be used to describe SD, REQ, COMP, and MODES.
    The assignment of attributes/components (COMP) to functional modes (MODES) can
    be defined as follows.


    Definition (Mode assignment). Given the set of configurable attributes COMP and
    the set of all functional modes MODES. A mode assignment M is a function M : COMP
    → MODES mapping each component to one of its modes.


    A solution to the reconfiguration problem can be easily formalized using the definition
