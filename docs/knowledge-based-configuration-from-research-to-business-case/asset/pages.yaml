    The ICONE¹² knowledge acquisition prototype is an example of a graphical knowledge
    acquisition user interface that includes recommendation technologies for proactively
    supporting knowledge engineers and domain experts in their development and maintenance
    activities. The ICONE user interface is depicted in Figure 8.1. On the left-hand
    side, the user can exploit typical functionalities such as product data (component)
    management, definition and maintenance of constraints, and the definition of the
    configuration process (dialog management). In addition to these basic functionalities,
    the ICONE environment includes intelligent recommendation functionalities that
    proactively support the user in inspecting the knowledge base (e.g., the functionality
    take a look at ... on the right-hand side of Figure 8.1). From the definition
    of products (components) and constraints, the ICONE knowledge acquisition user
    interface can directly generate the corresponding configurator applications for
    different platforms (iOS, Android, and HTML). Note that the exploitation of recommender
    algorithms and machine learning approaches in knowledge acquisition and maintenance
    scenarios is a young and evolving discipline;'
