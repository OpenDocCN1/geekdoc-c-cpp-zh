    *Example of an activation constraint.* For a variable CM (the camera) with the
    domain {TypeA, TypeB, TypeC} we could define the following activation constraint:
    HighResolution (HR) = yes → active(CM). If the precondition is not fulfilled,
    there is no need for CM to get assigned a value (i.e., be activated).


    Such a reasoning about activity states in DCSPs is based on predefined activity
    constraints. A formal discussion of the properties of DCSPs can be found in Bowen
    and Bahler (1991). The concept of variable activation has also been applied in
    other approaches. For example, generative constraint satisfaction (GCSP) based
    systems (Stumptner et al., 1998) generalize the concept of variable activation
    to the concept of *component and constraint activation*. The configuration environment
    of SIEMENS is based on such a generative approach (see also Falkner and Schreiner,
