- pgno: 341
  md: '# 26.4 User Interface Modeling and Generation


    # 26.4.1 Layouts


    A web-based user interface for the end user is generated without programming.
    The user makes selections on an HTML form; for example, see the right side of
    Figure 26.4. The general idea is that each selectable attribute or subfeature
    of a feature individual being configured generates a question. The modeler creates
    a layout to define how questions related to a feature individual are divided into
    pages, the order of questions, and, optionally, the type of input control used
    for a question.


    For example, PC is divided into Requirements (usage, efficiency), software (Operating_System,
    Applications, storage (for HDUnits)), hardware (Motherboard, Screens), and Internet
    (InternetConn). These groups are reflected in the configuration tree on the left-hand
    side of Figure 26.4.


    # 26.4.2 Resources


    In principle, the language of a configuration model is independent of the language(s)
    of the end-user interface. A resource file defines display names of objects of
    the configuration model to be shown to end users and their optional descriptions.
    In addition, resources define links to web pages providing additional information,
    messages for broken constraints, and so on. Multiple resources support multiple
    languages for end users.


    Here, few resources were defined, so the names visible to the user come directly
    from those used in the configuration model (underscores in identifiers were automatically
    replaced with spaces). For the sake of demonstration, MedStoreDisk was renamed
    with resources and a descriptive text added to both hard disk types. See the right-hand
    side of Figure 26.4.


    Because the configuration model was created with suitable terminology, near-automatic
    user interface generation in the primary language was possible.


    # 26.4.3 Other User Interface Aspects


    The general appearance of the user interface is defined by web-page templates.
    Defaults were used, except that hard-disk calculation results were added to the
    status area (upper left-hand side of Figure 26.4). This separates definition of
    visual appearance from the product-dependent parts of the user interface.


    # 26.5 Conclusion


    This chapter showed how to model the example PC with VariSales. Taxonomic hierarchy
    and attributes with refinement, compositional structure, and constraints were
    applied in a straightforward manner. All aspects were not modeled: Topological
    (connection) constraints were not modeled because VariSales currently does not
    support them, and they provide no additional value in the example. Resource constraints
    were managed through the price and calculation mechanisms. VariSales was built
    to manage finite configurations. Therefore, the maximum number of Applications
    is limited, the upper bound is defined with a constant Max_Applications = 20,
    applied in the subfeature definition Applications.'
  merge: -1
  img_proc: true
- pgno: 342
