- pgno: 172
  md: 'A diagnosis S defines those sentences of KB that must be deleted such that
    all positive examples are configurations or can be extended to configurations.⁹
    However, by deleting axioms the logical theory becomes weaker such that possibly
    some negative test cases are not inconsistent with (KB − S). Consequently, on
    one hand axioms are deleted from KB such that all positive test cases are consistent
    but on the other hand axioms must be added such that all negative test cases are
    inconsistent with the resulting knowledge base (KB − S) ∪ EX. If for a diagnosis
    S such an extension EX does not exist, the diagnosis S must be rejected. However,
    how can we verify that such an extension does not exist?


    Since the negation of the negative test cases has to follow from (KB − S) ∪ EX,
    we can replace EX by the conjunction of the negated negative test cases. Note
    that we can exploit the usual formulation of constraints in logic-programming
    by employing the special symbol false to deal with negation. For example we can
    negate and generalize the negative test case of our example by:


    ```

    ¬c⁻ : CPUD(X) ∧ CPUS(Y) ∧ (MBSilver(Z) ∨ MBDiamond(Z)) ∧ cpu-of-mb(X,Z) ∧ cpu-of-mb(Y,Z)
    → false.

    ```


    If the negative test case is not considered in our example, Axiom 8 would have
    been a diagnosis. However, if the negative test case is taken into account, Axiom
    8 cannot be a diagnosis since there is no way to extend KBfaulty − {Axiom 8} such
    that c⁺ is consistent and c⁻ is inconsistent with the resulting knowledge base.
    The same argument holds for Axiom 9.


    Proposition. The set S ⊆ KB for a CKB-diagnosis problem instance ⟨KB, C⁺, C⁻⟩
    is a diagnosis iff ∀c⁺ ∈ C⁺ : (KB − S) ∪ {c⁺ ∧ ∧_{c⁻ ∈ C⁻} (¬c⁻)} is consistent.


    It follows that a diagnosis will always exist under the (reasonable) assumption
    that positive and negative test cases do not interfere with each other.


    Proposition. A diagnosis S for a CKB-diagnosis problem instance ⟨KB, C⁺, C⁻⟩ exists
    iff ∀c⁺ ∈ C⁺ : c⁺ ∧ ∧_{c⁻ ∈ C⁻} (¬c⁻) is consistent.


    Usually, when debugging knowledge bases, the knowledge engineer is interested
    in minimal changes. This can be achieved by providing minimal diagnoses. A minimal
    diagnosis for the CKB-diagnosis problem instance ⟨KB, C⁺, C⁻⟩ is a diagnosis S
    where no proper subset S′ of S is a diagnosis. In general, it is possible for
    multiple minimal diagnoses to exist, though additional criteria can be brought
    to bear to rank them in computation, as discussed next.


    # 11.3.3 Computing Diagnoses


    The previous definitions allow us to employ the standard algorithms for consistency-based
    diagnosis with appropriate extensions for the domain. In particular, Reiter’s
    Hitting Set algorithm (Reiter, 1987) can be applied, which is based on the concept
    of conflict sets. Conflict sets provide an effective mechanism for focusing the
    search for diagnoses. The basic idea is to compute minimal sets of inconsistent
    logical sentences, termed conflict sets. In order to resolve the inconsistency
    at least one sentence in each conflict set has to be changed. We assume C⁺ to
    be nonempty.


    Definition (Conflict set). A conflict set CS for ⟨KB, C⁺, C⁻⟩ is a subset of KB
    such that ∃c⁺ ∈ C⁺ : CS ∪ [c⁺ ∧ ∧_{c⁻ ∈ C⁻} (¬c⁻)] is inconsistent.'
  merge: -1
  img_proc: true
- pgno: 173
  md: 'A conflict set is minimal if it does not contain a proper subset that is a
    conflict set. The relation between diagnoses and conflict sets can be expressed
    by the concept of hitting sets. Given a set of sets \overline{C}, a set S is a
    hitting set of \overline{C} iff S \cap C_i \neq \emptyset for all C_i \in \overline{C}
    and S \subseteq \bigcup_{C_i \in \overline{C}} C_i. A hitting set is minimal if
    it does not contain a proper subset that is a hitting set. In our domain the set
    \overline{C} corresponds to the set of conflict sets and a hitting set S represents
    a diagnosis.


    # Proposition.


    The set of logical sentences S is a minimal diagnosis for the CKB-diagnosis problem
    instance \langle KB, C^+, C^- \rangle iff S is a minimal hitting set for the set
    of all minimal conflict sets of \langle KB, C^+, C^- \rangle.


    In Felfernig et al. (2004) a method for diagnosing configuration knowledge bases
    is proposed, based on a combination of Reiter’s HS-DAG algorithm (Greiner et al.,
    1989; Reiter, 1987) and a divide-and-conquer approach to compute minimal conflict
    sets (Junker, 2004). The method is generally applicable to all knowledge-representation
    paradigms, which are based on monotonic semantics such as predicate logic, description
    logic, and constraints. The approach requires a complete and correct consistency-checker,
    which is employed to compute minimal conflict sets. Reiter’s algorithm generates
    minimal diagnoses in a breadth-first manner; that is, diagnoses with smaller cardinalities
    are constructed first. This is helpful to control computation costs since, in
    practice, it is sufficient for the knowledge engineer to compute some of the most
    probable diagnoses. These diagnoses are then used to generate additional tests
    and it is therefore not necessary to compute all minimal diagnoses (Shchekotykhin
    et al., 2012). In case it is more probable that logical sentences in a knowledge
    base are correct than faulty, the set of minimal cardinality diagnoses (i.e.,
    those diagnoses where the number of elements is minimal) serves as an approximation
    for a set of the most probable diagnoses. Furthermore, if we limit the search
    for diagnoses to minimal cardinality diagnoses then the depth of the search space
    corresponds exactly to the number of elements in a minimal cardinality diagnosis.
    Since in practice the number of faulty axioms in a knowledge base is low, the
    application of a breadth-first strategy is feasible. In Felfernig et al. (2014b)
    techniques and algorithms for computing conflicts and diagnoses are presented.


    Let us now reconsider our example knowledge base. In case only c^+ is provided
    there is one minimal conflict set {7, 8, 9} comprising a minimal set of axioms
    that is inconsistent with c^+. Consequently, the minimal diagnoses are the axioms
    7, 8, and 9, which are the minimal hitting sets of the minimal conflict set. Note
    that there is only one minimal conflict set in this case. If we consider the negative
    test case c^- (i.e., add ¬c^- to the knowledge base) then there is again only
    one minimal conflict set {7}. Consequently, there is exactly one minimal single-fault
    diagnosis {7}.


    Alternatively, let us consider a different case and assume that Axiom 7 is wrongly
    defined as follows:


    ```

    (7) MB(X) → MBSilver(X) ∧ MBDiamond(X) ∧ MBUniversal(X).

    ```


    In this case the universal motherboard was not forgotten but the knowledge engineer
    mixed up ∨ and ∧. Furthermore, let us assume that only the positive example c^+
    is given. In this case the set of minimal conflict sets is {7, 4}, {7, 5}, {7,
    6}, {7, 8}, and {7, 9}. Consequently, the minimal diagnoses (or hitting sets of
    the conflict sets) are {7} and {4, 5, 6, 8, 9}.'
  merge: -1
  img_proc: true
- pgno: 174
  md: 'To summarize, we presented a generic debugging approach for a declarative representation
    of configuration knowledge that employs model-based diagnosis techniques. In analogy
    to regression testing procedures in software engineering, positive and negative
    examples for configured product instances are used to locate faults in a configurator
    application. The presented approach supports knowledge engineers by pointing them
    to minimal subsets of the knowledge base that are most probably faulty in case
    the configurator does not accept all the positive examples or does not reject
    all the negative examples.


    Overall, the test cases (examples) thus play a central role in the approach and
    the availability of a sufficient amount of test cases can help to strongly reduce
    the number of diagnosis candidates. A typical point in time when errors are introduced
    into knowledge bases is when the rules are updated or extended, which happens
    quite frequently in many application domains. In that case, all past configurations
    that have been calculated before the maintenance operation and that should be
    still valid, can thus serve as positive test cases and can therefore be used in
    regression tests. Furthermore, remember that the presented approach also supports
    the use of partial test cases, which means that the knowledge engineer can specify
    valid configuration fragments and is not required to manually check a complete
    and possibly complex configuration for correctness before defining it as a test
    case. Still, more support in the area of test case management is possible, for
    example, through the automatic generation of representative test cases. We see
    this aspect as a relevant research direction not only in the configuration domain,
    but also for knowledge-based systems in general.


    # 11.4 Organizational Challenges


    The challenge of developing a configurator application has the setup and maintenance
    of a configuration knowledge base at its heart. However, besides the technical
    issues of knowledge encoding, acquisition of configuration knowledge from domain
    experts as well as its validation and maintenance that we discussed up to now
    (i.e., the content side), a variety of further organizational, business, and process
    facets is related to configuration knowledge base development. The knowledge base
    defines the variability of the configurable product offer in question. Initially,
    a company that is in the situation of configuration knowledge base development
    can either progress from, for instance, Mass Production (see Felfernig et al.,
    2014a¹¹) or rework an already existing product configuration approach. While in
    the latter case organizational experience with mass customization (see Piller
    and Blazek, 2014¹²) and configurable product offerings is already in place, in
    the first case, knowledge base development will be accompanied by a variety of
    organizational and managerial issues. Usually, the product offering itself and
    the degree of variability that is offered for customization needs to be designed
    from scratch as the implementation of a mass customization strategy requires a
    fundamental rethinking of the product architecture itself. Mikkola (2009), for
    instance, explores the relationship between product architecture design and mass
    customization. She discusses a modularity measure for product architectures and
    the associated opportunities for mass customization strategies. Based on Mikkola’s
    recommendations, different variants of configuration models can be (partially)
    assessed with respect to their aptness for successful mass customization strategies.


    ¹¹Chapter 1.


    ¹²Chapter 9.'
  merge: -1
  img_proc: true
- pgno: 175
  md: 'The process of product development itself typically consists of the specification
    of multiple views, in particular the functional, technical, and physical view
    (Arana et al., 2007; Jiao and Tseng, 1999). Another example of structuring configuration
    models along different views comes from Malmgren et al. (2011) for the construction
    industry. Due to the two-phase construction of prefabricated buildings (production
    and assembly at the customer site) the physical view in Jiao and Tseng (1999)
    is divided into separate production and assembly views. This modularization of
    configuration models is particularly necessary in case of a graphical representation
    of the configuration model in order to reduce diagrammatic complexity and to avoid
    conceptual overload of the involved stakeholders (Moody, 2009). The functional
    view models the functionality and typically depends on the analysis of customer
    requirements in target market niches. In contrast, the technical view describes
    the product design by its modules and modular structure and ensures technological
    feasibility by enforcing design parameters and structuring mechanisms. In the
    third step—the physical view—the product design has to be mapped to physical components
    and assemblies. There, the manufacturability of the configured products as well
    as costs, volumes, and schedules are in the focus and can lead to feedback loops
    to functional and technical views. Obviously, these process steps can therefore
    only be executed in an iterative and interleaved manner where different organizational
    units like marketing and sales, design, and manufacturing and logistics collaborate
    tightly. In Jiao and Tseng (1999) a methodology for developing a product family
    architecture for mass customization based on these three process steps is proposed
    and empirical results from a case study are provided for further reading. In addition,
    Nellore et al. (1999) focus on the initial specification process in new product
    development and propose a model to manage the interaction of the different stakeholders
    in this early and vital phase.


    While the presented UML-based approach is very helpful in easing communication
    between the different stakeholders in a configurator development project, further
    means of external documentation of configuration knowledge have been explored.
    Haug (2010) generalizes the idea of configurator documentation systems and proposes
    a product model management software that constitutes a knowledge management and
    learning platform for the stakeholders involved in a product configuration development
    and maintenance project. The documentation software supports representation concepts
    such as class information cards and product variant master (PVM) that are adequately
    comprehensible to domain experts. Haug informedly argues that cutting cost on
    documentation in configurator development projects is short-sighted and leads
    to reduced or no maintainability of the developed configurator applications. Finally,
    the book of Hvam et al. (2008) discusses several case studies on the implementation
    of mass customization strategies with the help of product configuration systems
    from a practical point of view and can therefore also serve as a helpful guide.


    # 11.5 Conclusion


    Most modern and nontrivial product configuration systems rely on a knowledge base
    that restricts the solution space of potentially configured products to those
    instances that are actually valid according to technical or business-related restrictions
    and constraints. The goal of this chapter was to elaborate on the process from
    acquiring these “technical and economic restrictions and constraints” from their
    sources as well as encode, maintain, and validate it during the operational lifetime
    of the configuration system. Initially, we gave a rough overview on the development
    from the first rule-based knowledge'
  merge: -1
