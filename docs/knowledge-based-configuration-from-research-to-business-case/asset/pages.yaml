  md: '# Knowledge Engineering

    for Configuration Systems


    # CHAPTER 11


    **Gerhard Friedrich**, †Dietmar Jannach†, ‡Markus Stumptner‡, and Markus Zanker*


    *Alpen-Adria Universität Klagenfurt, Klagenfurt, Austria

    †Dortmund University of Technology, Dortmund, Germany

    ‡University of South Australia, Adelaide, SA, Australia


    **Abstract:** Developing a product configuration system is a nontrivial and challenging
    task for various reasons. First, the domain knowledge that has to be encoded into
    the system is often spread over several departments or functions within a company.
    Besides that, in many cases data from existing information systems have to be
    integrated into the configurator. Finally, the business rules or technical constraints
    that define the space of possible configurations can be relatively complex and
    also subject to frequent changes. This makes acquiring and encoding domain knowledge
    as well as testing and debugging particularly demanding tasks.


    In this chapter, we give an overview of the challenges when developing a knowledge-based
    configuration system. We will particularly focus on questions related to the knowledge
    acquisition process and will additionally show how model-based debugging techniques
    can be applied to support the knowledge engineer in the testing and debugging
    process.


    # 11.1 Introduction


    Product configurators are knowledge-intense and complex software systems whose
    design, development, and implementation within a company is a challenging and
    demanding undertaking throughout the whole software life cycle. Even if an off-the-shelf
    and generic configuration problem-solving framework or a constraint engine such
    as the one described by Mailharro (1998) is used as a basis for the configurator
    application, there are still several aspects that contribute to the complexity
    of the overall development process.


    Since we are only interested in nontrivial configuration systems, we will start
    from the premise that a knowledge-based approach is chosen. Thus, the configuration
    knowledge has to be represented by some form of logic, declarative rules, or constraints.
    In contrast to standard software development processes, a “knowledge engineering”
    phase (as an introduction to this topic, see Studer et al., 1998) has to be part
    of the life cycle. In this phase, the desired configuration logic has to be modeled
    using the given knowledge representation mechanism of the configurator framework.
    The elicitation and error-free formalization of the knowledge however requires
    the tight cooperation between the domain expert and a knowledge engineer, where
    the latter needs to establish a link between the business and technologists. One
    of the problems in that context is that there might be several departments in
    a company that have an influence on the set of configurations that can be offered
    to a customer. Beside technical restrictions due to,'
