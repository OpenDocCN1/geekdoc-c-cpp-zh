    interested in an energy class A configuration, then the item (product) energystar
    should be included.


    | Attribute | Property | pname |

    |-----------|----------|-------|

    | efficiency | A | energystar |


    Table 25.6 Excludes constraint of working example. For example, if the destination
    country is Austria then the computer hw2 is not allowed to be contained in a configuration.
    Furthermore, hw1 is currently not available.


    | Attribute | Property | pname |

    |-----------|----------|-------|

    | – | – | hw1 |

    | country | Austria | hw2 |


    Table 25.7 Supported solutions of working example.


    | pname | pcpu | pmb | pos | pprice |

    |-------|------|-----|-----|--------|

    | hw1 | CPUD | MBSilver | OSAlpha | 600 |

    | hw2 | CPUS | MBDiamond | OSBeta | 600 |

    | engergystar | CPUS | MBDiamond | OSBeta | 800 |


    newest model named energystar (even if the maximum price accepted by the user
    is lower than the price of energystar); see Table 25.5.


    Excludes. In the line of includes constraints, WEEVIS also supports the definition
    of so-called excludes constraints. A solution could be excluded because the needed
    hardware is currently not available (e.g., pname = hw1) or a solution cannot be
    delivered due to the fact that certain personal computers cannot be delivered
    to all destination countries (e.g., country = Austria and pname = hw2). An overview
    of the excludes constraints is given in Table 25.6.


    Products. In WEEVIS, possible solution alternatives can be defined in a product
    table (see Table 25.7). Using such a product table makes sense if the set of alternatives
    is low. This way, search can be made more efficient. In the case of a large search
    space, the explicit representation of solution alternatives makes knowledge engineering
    and the underlying search processes inefficient. In such a situation, WEEVIS also
    allows for the definition of the solution space in an implicit (constraint-based)
    form.'
