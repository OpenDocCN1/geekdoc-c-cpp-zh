- pgno: 181
  md: '# Redundancy Detection in Configuration Knowledge


    Alexander Felfernig*, Florian Reinfank*, Gerald Ninaus* and Paul Blazek†

    *Graz University of Technology, Graz, Austria

    †cyLEDGE, Vienna, Austria


    Abstract: Configuration systems exploit a knowledge base for determining solutions
    of interest for the user. The development and maintenance of such knowledge bases
    is a time-consuming and error-prone task. For example, redundant constraints are
    specified that often increase both the effort for calculating a solution and efforts
    related to knowledge base development and maintenance. In this chapter we present
    two alternative algorithms that can be exploited for the determination of minimal
    cores (minimal nonredundant constraint sets). The first algorithm (SEQUENTIAL)
    is the better choice for centralized scenarios where the degree of redundancy
    is low. The second one (COREDIAG) is especially useful for distributed knowledge
    engineering scenarios where the degree of redundancy can become high.


    # 12.1 Introduction


    The central element of a constraint-based application is a knowledge base (constraint
    set). When developing and maintaining constraint sets, users are often defining
    faulty constraints (the system calculates solutions that are not allowed or no
    solution can be found; (Bakker et al., 1993; Felfernig et al., 2004)) or redundant
    constraints (both also known as anomalies), which are not needed to express the
    domain knowledge in a complete fashion (Dechter and Dechter, 1987; Fahad and Qadir,
    2008; Levy and Sagiv, 1992; Liberatore, 2005; Piette, 2008; Sabin and Freuder,
    1999). In this chapter we focus on situations where users are defining redundant
    constraints that, when deleted from the constraint set, do not change the semantics
    of the remaining constraints. This might happen for performance reasons or due
    to the fact that knowledge engineers are not aware of the redundancy. We focus
    on the latter situation.


    More formally, redundancy can be described as follows: if C = {c1, c2, ..., cn}
    is a set of constraints and one constraint ci ∈ C is redundant, then (C − {ci})
    ∪ C̄ is inconsistent. In this context, C̄ is the negation¹ of C: if C = {c1, c2,
    ..., cn} then C̄ = {¬c1 ∨ ¬c2 ∨ ... ∨ ¬cn}.


    Redundancy elimination in knowledge bases is a topic extensively investigated
    by AI research. Redundant constraints play a role, for example, in the development
    and maintenance of configuration knowledge bases (Sabin and Freuder, 1999). The
    authors introduce concepts for the detection of redundant constraints in conditional
    constraint satisfaction problems (CCSPs). The approach is based on


    > ¹We denote the negation of C(C̄) also the complement of C.'
