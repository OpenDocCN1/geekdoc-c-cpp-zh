- pgno: 132
  md: 'view, co-construction would occur when customers have only a nebulous sense
    of what they want. Without a deep involvement of the customers, the manufacturer
    would be unable to cater to each individual product demand adequately.


    After this seminal publication (Udwadia and Kumar, 1991), computer technology,
    particularly the capacity to simulate potential product designs before a purchase,
    has strongly enabled co-design technologies (Haug and Hvam, 2007; Ulrich et al.,
    2003). This type of collaboration is also known as collaborative customization
    (Gilmore and Pine, 1997). In collaborative customization, the manufacturer and
    customer work together to identify and satisfy the customer’s needs via a system
    that allows easy articulation of exact requirements (i.e., design, fit, and function
    of a product). Anderson-Connell et al. (2002) used the term co-design to describe
    a collaborative relationship between consumers and manufacturers in which, via
    a process of interaction between a design manager and a consumer, a product is
    designed according to the consumer’s specification and based on the existing manufacturing
    components.


    Sophisticated configurators have been the enabling force in various domains; in
    mass customization they have been one of the efficiency drivers for the concept
    of bringing together custom manufacturing and mass production through shifting
    the time-consuming demands identification process to the customers themselves.
    Moving the responsibility of creating individualized products to the customer
    comes along with a set of requirements that have to be fulfilled in order to avoid
    confusion. To understand the nature and complexity of required configuration functionalities,
    it is necessary to take a closer look at the capabilities that play a role when
    dealing with product customization.


    Companies that successfully implemented a mass customization strategy have built
    competences around a set of three core capabilities that are driving a sustainable
    mass customization business. The key to profiting from mass customization is to
    see it as a set of organizational capabilities that can supplement and enrich
    an existing system. While specific answers on the nature and characteristics of
    these capabilities are clearly dependent on industry context or product characteristics,
    three fundamental groups of capabilities determine the ability of a company to
    mass customize. These capabilities, Solution Space Development, Robust Process
    Design, and Choice Navigation, are derived from work by Salvador et al. (2009,
    2008). The methods behind these capabilities are often not new. Some of them have
    been around for years. But successful mass customization demands that these methods
    be combined into capabilities in a meaningful and integrated way, to design a
    value chain that creates value from serving individual customers differently.


    # 9.2 Solution Space Development


    A mass customizer must first identify the idiosyncratic needs of its customers,
    specifically, those product attributes along which customer needs diverge the
    most. This is in contrast to a mass producer, who generally tries to focus on
    serving universal needs, ideally shared by all the target customers. Once that
    information is known and understood, a business can define its “solution space”
    clearly delineating what it will offer and what it will not. This space determines
    what universe of benefits an offer is intended to provide to customers and then
    what specific permutations of functionality can be provided within that universe
    (Pine, 1995).'
