    which describe how the modeling concept can be properly used. Since the proposed
    extensions and the OCL constraints are developed using the standard mechanisms
    of UML, off-the-shelf UML tools can be applied to check the syntactical validity
    of the configuration models in phase (2).


    Subsequently, in phase (3), the conceptual models should be automatically translated
    into an “executable” representation, which can be interpreted by a configuration
    problem solver. This corresponds to the ideas of model-driven software development
    and automatic code generation in standard software development processes. In analogy
    to the Model-Driven Architecture (MDA),⁴ the conceptual models can be seen as
    “platform independent models.” The translation of the models into executable code
    however means that precise semantics for the given UML modeling concepts are required.
    In Felfernig (2007) and Felfernig et al. (2000a, 2000b) this definition of the
