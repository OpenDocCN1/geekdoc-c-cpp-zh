- pgno: 349
  md: 'or relations that are nice to have. These are typically fulfilled in good solutions,
    but might be dropped if violated, and are termed *soft constraints*. Soft constraints
    are instrumental in interactive configuration in guiding the user toward good
    solutions. Generally, any constraint can be marked as soft in the model. Whether
    a constraint is deemed hard or soft may also be the result of a conscious decision:
    for example, constraints based purely on marketing decisions might be classified
    as either hard or soft, depending on a company’s policy.


    Soft constraints may arise naturally in knowledge engineering. Let us consider
    the following two constraints in the model of the APLEX application given in the
    formulation of the expert:


    +   - The operation *rough machining* must precede the operation *fine machining*
    for each feature to be machined.

    +   - (All) *rough machining* operations should precede (all) *fine machining*
    operations.


    The latter is a global statement that expresses a good strategy. When in need
    it could be violated. The former is a hard constraint. Rough machining a feature
    after fine machining it would have no point and would destroy the result of the
    fine machining.


    Another example, famous in AI, is the statement “all birds fly”: that is if an
    object instance is known to be a bird, this constraint would set its property
    of “being able to fly” to the value *true*. Obviously, an individual bird may
    not be able to fly (due to a broken wing, say). In a configuration involving birds,
    the soft constraint will apply in some situations, but may not apply in others.
    In μPLAKON it is possible to selectively remove some inferences of a soft constraint,
    while leaving others in place, because inferences due to soft constraints are
    represented as soft justifications. Resolving inconsistency is a problem of discarding
    soft justifications, not soft constraints overall.


    The question of whether birds can fly or not is a typical problem dealt with in
    the discipline of *nonmonotonic reasoning*. This was an R&D topic in the TEX-B
    project, where various versions of the *Assumption Based Truth Maintenance System*
    (ATMS; DeKleer, 1986) were developed (Dressler, 1988). The TMS in μPLAKON was
    one of these, called the ATMS* (Haag, 1991, 1995). The soft justifications were
    treated as ATMS assumptions. In the case of an inconsistent configuration the
    ATMS* can calculate minimal sets of conflicting soft justifications. This functionality
    has been incorporated in the SAP IPC configurator (see dedicated section later)
    and with further extensions also in the SAP internal “Scope Selection” application
    (Haag and Riemann, 2011).


    # 27.3.5 Problem Solving


    The question now is: What is the task of the XPS in supporting problem solving?
    If the underlying problem is equivalent to a CSP (or some extension of CSP) that
    is hard to solve because it is heavily constrained, then finding a solution using
    CSP techniques is key. On the other hand, typical interactive configuration problems
    (such as sales configuration) are usually underconstrained with regard to the
    hard constraints. This means that a multitude of solutions exists and it is not
    hard to find one. But the problem is overconstrained with respect to the overall
    set of hard and soft constraints. This means it is not possible to find a solution
    that satisfies all these constraints. Resolving the inconsistencies by deciding
    which derivations from soft constraints (and user choices) to ignore is now key
    and defines the actual search problem.'
  merge: -1
  img_proc: true
- pgno: 350
  md: 'There is another way to limit the applicable constraints besides marking them
    as soft. In an engineer-to-order scenario there may be a preferred way of configuring
    a needed component such as the core of a transformer using standard components.
    Constraints can be formulated for this task. However, if this fails, the component
    must be engineered using nonstandard components. A different set of constraints
    then applies. Thus, the set of constraints to be considered is based on the tasks
    being performed.


    The upshot is that in order to support finding a solution, the XPS may need to
    do different things in different situations. If the problem is finding one or
    more solutions that satisfy the applicable constraints, the XPS must implement
    a strategy of exploring the search space systematically and efficiently. In TEX-K
    this was not directly part of the constraint processing, but rather a topic considered
    under the heading of controlling the configuration process (Günter et al., 1990;
    see Hotz and Günter, 2014¹³).


    In the case that the problem is overconstrained due to soft constraints (and has
    no solution that satisfies everything), the sought solution takes the form of
    a maximal set of soft constraints so that the resulting overall set of constraints
    can be satisfied and provides an optimal solution. Finding this autonomously may
    be the task of the XPS. In this case, the preferences or optimality criteria need
    to be defined somehow. One way of doing this (explored with μPLAKON in APLEX)
    is to assign a numeric strength to each soft constraint and perform a best-first
    search. The complexity of this is high in practice and exponential in theory.
    Thus, the approach was not adopted by SAP.


    However, if the user or an agent on the user’s behalf performs the search interactively,
    they will make the creative decisions themselves and any complexity is their responsibility.
    The role of the XPS is then to provide decision support. This means the XPS will
    be able to calculate the root causes of inconsistency and guide the user in resolving
    them. It will also support a user in juggling alternatives; that is, let them
    switch back and forth between alternate configuration states, and aid in comparing
    the differences between these states. The ATMS* in μPLAKON supports this.


    Finally, the XPS may need to reason about which tasks to apply, and when. A PROLOG-like
    mechanism was provided in μPLAKON for KONEX that allows breaking a task into subtasks
    and formulating alternative tasks to start upon the failure of a task. Although
    the need to be able to switch to a configuration with nonstandard components is
    a common problem in engineer-to-order settings, this approach was taken up very
    late in SAP configurators and has not been completely implemented to date. Independently
    from the development in μPLAKON, reasoning about tasks also played a role in the
    XVIS application (Kühne and Meyer-Fujara, 1991).


    # 27.4 The Manufacture of Variants: A Configuration Problem


    The PLAKON applications are diverse, but by no means span the space of all business
    relevant configuration problems. One central process that is not addressed in
    TEX-K stems from the manufacture of product variants. Often many products a company
    manufactures and sells are variations on a basic scheme. For example, the same
    ballpoint pen may come in several different colors. Classically, a standard (nonconfigurable)
    product is defined for each pen/color combination. An alternate approach would
    be to treat all of these as product variants of a central product, “pen.”'
  merge: -1
