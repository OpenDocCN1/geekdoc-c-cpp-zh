- pgno: 195
  md: '*less-is-better* (LIB; e.g., price or weight) attributes. Furthermore, for
    some attributes users prefer a high similarity between their preferences and the
    corresponding product attributes. An example of such a *nearer-is-better* (NIB)
    attribute is *pGPS*: if the user expects the availability of GPS, the configuration
    should include this feature. A *default query* specifies the optimal product;
    it consists of the following preferences: the maximum values for MIB attributes,
    the minimum values for LIB attributes, and the user requirements for NIB attributes.


    For our mobile phones example (Table 13.1) the preferred value for the LIB attribute
    `pPrice` is 69 (price of the cheapest available phone). The preferred value for
    `pHSDPA` is 7.2 (MIB; the highest available data rate). Finally, the preferred
    value for NIB attribute `pGPS` is *true* assuming that the customer (user) requires
    GPS (*GPSReq = true*). The resulting default query is *Q = {pPrice = 69; pHSDPA
    = 7.2; pGPS = true}*.


    The similarity of item *I* to the default query *Q* is determined with respect
    to each attribute *a* in *Q*. Formula 13.1 is used for MIB attributes, Formula
    13.2 for LIB attributes, and Formula 13.3 for NIB attributes (McSherry, 2005).
    In these formulae, *max(a)* and *min(a)* refer to the maximum and minimum values
    of the attribute *a* in the case base. *φₐ(Q)* is the value of *a* in the (default)
    query *Q* and *φₐ(I)* is the value of *a* for the item *I*. In these formulae,
    Boolean attributes values *false* and *true* are interpreted as 0 and 1, respectively.
    The union of all attributes in the case base is *V* (the set of variables).


    sim_(MIB)(a, I, Q) = 1 - |φₐ(I) - φₐ(Q)| / [max(a) - min(a)] = [φₐ(I) - min(a)]
    / [max(a) - min(a)]   (13.1)


    sim_(LIB)(a, I, Q) = 1 - |φₐ(I) - φₐ(Q)| / [max(a) - min(a)] = [max(a) - φₐ(I)]
    / [max(a) - min(a)]   (13.2)


    sim_(NIB)(a, I, Q) = 1 - |φₐ(I) - φₐ(Q)| / [max(a) - min(a)]   (13.3)


