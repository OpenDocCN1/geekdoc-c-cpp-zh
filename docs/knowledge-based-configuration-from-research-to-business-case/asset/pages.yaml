  md: '# Table 7.2 Example of QUICKXPLAIN: Γ = {cα, cβ, cγ, cδ, cε, cφ, cι} is the
    (original) background knowledge and CS = {c1, c4, c5} is the returned conflict
    set. The sequence of the different QX activations is depicted in Figure 7.2.


    | Step | D | C | B | C1 | C2 | Return |

    |---|---|---|---|---|---|---|

    | 1 | ∅ | {c1, ..., c5} | Γ | {c1, c2, c3} | {c4, c5} | {c1, c4, c5} |

    | 2 | {c4, c5} | {c1, c2, c3} | Γ ∪ {c4, c5} | {c1, c2} | {c3} | {c1} |

    | 3 | {c3} | {c1, c2} | Γ ∪ {c3, ..., c5} | {c1} | {c2} | {c1} |

    | 4 | {c2} | {c1} | Γ ∪ {c2, ..., c5} | ∅ | ∅ | {c1} |

    | 5 | {c1} | {c2} | Γ ∪ {c1, c3, c4, c5} | ∅ | ∅ | ∅ |

    | 6 | {c1} | {c3} | Γ ∪ {c1, c4, c5} | ∅ | ∅ | ∅ |

    | 7 | {c1} | {c4, c5} | Γ ∪ {c1} | {c4} | {c5} | {c4, c5} |

    | 8 | {c5} | {c4} | Γ ∪ {c1, c5} | ∅ | ∅ | {c4} |

    | 9 | {c4} | {c5} | Γ ∪ {c1, c4} | ∅ | ∅ | {c5} |


