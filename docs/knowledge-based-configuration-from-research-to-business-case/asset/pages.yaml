  img_proc: true
- pgno: 100
  md: '```

    Algorithm 7.1 — SIMPLECONFLICTDETECTION


    1. `func SimpleConflictDetection(C ⊆ AC, B = AC − C) : CS`

    2. `CS ← ∅;`

    3. `if inconsistent(B) or consistent(B ∪ C) return(∅);`

    4. `else`

    5. `repeat`

    6. `Φ ← CS;`

    7. `repeat`

    8. `c ← element(C − Φ);`

    9. `Φ ← Φ ∪ {c};`

    10. `until inconsistent(Φ)`

    11. `CS ← CS ∪ {c};`

    12. `until inconsistent(CS)`

    13. `return(CS);`

    ```


    In order to demonstrate the functionality of SimpleConflictDetection, the basic
    steps of this algorithm are shown in Table 7.1. For this example (see also Figure
    7.1) we take the constraints of our domain description (DD) and assume that C
    = {c₁, c₂, c₃, c₄, c₅} and AC = {cα, cβ, cγ, cδ, cε, cφ, c₁, c₂, c₃, c₄, c₅} (B
    = {cα, cβ, cγ, cδ, cε, cφ, c₁}). The inner loop is responsible for checking and
    rejecting individual elements that participate in the conflict, the outer loop
    is responsible for checking whether the generated set CS is already inconsistent
    (i.e., a minimal conflict set could be found).


    *Algorithm Analysis.* If a minimal conflict set can be determined (AC − C consistent
    and AC inconsistent), SimpleConflictDetection needs O(2) additional consistency
    checks in the best case (a constraint cₐ that represents a singleton conflict
    and is located at the first position of the constraint list C).


    **Table 7.1** Example of the application of SimpleConflictDetection. CS = {c₁,
    c₄, c₅} is returned as minimal conflict set (CS) for C = {c₅, c₄, c₃, c₂, c₁}
    and B = {cα, cβ, cγ, cδ, cε, cφ, c₁}.


    | Step | CS | c | Φ |

    |---:|---|---|---|

    | 1 | ∅ | c₅ | {c₅} |

    | 2 | ∅ | c₄ | {c₅, c₄} |

    | 3 | ∅ | c₃ | {c₅, c₄, c₃} |

    | 4 | ∅ | c₂ | {c₅, c₄, c₃, c₂} |

    | 5 | ∅ | c₁ | {c₅, c₄, c₃, c₂, c₁} |

    | 6 | {c₁} | c₅ | {c₁, c₅} |

    | 7 | {c₁} | c₄ | {c₁, c₅, c₄} |

    | 8 | {c₁, c₄} | c₅ | {c₁, c₄, c₅} |

    | 9 | {c₁, c₄, c₅} | — | — |'
