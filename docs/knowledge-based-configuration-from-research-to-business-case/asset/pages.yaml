- pgno: 269
  md: "# 20.4 Modeling Document Variability\n\n![](img/214a17cc1f5bbf0914497c7414128438_269_0.png)\n\
    \n**FIGURE 20.1**  \nExtended DOPLER meta-model with Chapter, Subchapter, Process,\
    \ and Component Asset Types for modeling the CC-L2 system. The figure also depicts\
    \ how elements from the meta-model are used to support configuring and generating\
    \ variable documents; i.e., Decisions are used to customize documents (e.g., to\
    \ fill placeholders) and Assets are used to select documents or parts thereof\
    \ (e.g., a particular chapter).\n\nconfiguration, and a Decision type (Boolean,\
    \ enumeration, string, or number). A Decision can depend on other Decisions hierarchically\
    \ (if it needs to be made before other Decisions) or logically (if making the\
    \ Decision changes the answers of other Decisions or if Decisions mutually exclude\
    \ each other). The range of possible answers defined by the Decision type can\
    \ be further constrained with validity conditions. Assets represent the core product\
    \ line artifacts such as technical components or documents. They can depend on\
    \ each other functionally (e.g., one component requires another component) or\
    \ structurally (e.g., a subchapter is part of a chapter). Assets are linked to\
    \ Decisions via inclusion conditions defining when a particular Asset is included\
    \ in a configured product. Asset attributes can also depend on answers to Decisions\
    \ to enable the customization of Assets.\n\nFigure 20.1 shows the meta-model for\
    \ the CC-L2 variability model with the predefined elements Decision and Asset.\
    \ The CC-L2 specific Asset types are Chapter (representing a chapter of a document),\
    \ Subchapter (representing a part of a chapter), Component (representing a software\
    \ component), and Process (representing virtual machines executing software components).\
    \ The elements Chapter and Component have an attribute location of type URL in\
    \ addition to the default model attributes id and description. A Component is\
    \ described in a Chapter or Subchapter and a Process is described in a Subchapter\
    \ to link technical components with document Assets. A Subchapter can be part\
    \ of a Chapter.\n\nThe Asset types Chapter and Subchapter are used to model coarse-grained\
    \ variability. Explicitly representing parts of documents as Assets in a model\
    \ provides an additional level of abstraction for defining document variability\
    \ and for selecting particular chapters or sections. While it would also be possible\
    \ to describe document variability only at the level of Decisions we have learned\
    \ that this additional level of abstraction helps domain experts to better understand\
    \ coarse-grained variability of documents."
  merge: -1
