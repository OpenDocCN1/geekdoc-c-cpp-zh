    The Smarthome system model (Part 1; with root SmartHomeSystem) and its relationship
    to the feature model (with root SmartHomeFeature) through the directed association
    realize. One example for the realize association provides the inside sensor (SensorInside),
    which realizes the presence feature modeled in the feature model as PresenceDetection.


