- pgno: 134
  md: 'of the leathers, or patterns. A shoe’s functionality can be defined by its
    cushioning, heel form, or cleat structure.


    To understand the large variety of configurable products that are available online,
    we recommend a closer look at the benchmark study “The Customization 500” (Walcher
    and Piller, 2012) and at the “Configurator Database Report 2013” (Blazek et al.,
    2013).


    # 9.2.2 Methods for Solution Space Definition


    To define the solution space, the company has to identify those needs where customers
    are different, and where they care about these differences. Matching the options
    represented by the solution space with the needs of the targeted market segment
    is a major success factor of mass customization (Hvam et al., 2008). The core
    requirement at this stage is to access “customer need information”; that is information
    about preferences, needs, desires, satisfaction, and motives of customers and
    users of the product or service offering. Need information builds on an in-depth
    understanding and appreciation of the customers’ requirements, operations, and
    systems. Spotting untapped differences across customers is not an easy task, because
    information about unfulfilled customer needs is “sticky”—that is, difficult to
    access and codify for the solutions provider (von Hippel, 1998). Understanding
    heterogeneous customer needs in terms of identifying differentiating attributes,
    validating product concepts, and collecting customer feedback can be a costly
    and complex endeavor, but several approaches can help.


    The first is to engage in conventional market research techniques; that is to
    meticulously gather data from representative customers on a chosen market sector.
    To reduce the risk of failure, need-related information from customers is integrated
    iteratively at many points in the new product development process (Dahan and Hauser,
    2002; Griffin and Hauser, 1993). The manufacturer selects and surveys a group
    of customers to obtain information on needs for new products, analyzes the data,
    develops a responsive product idea, and screens this idea against customer preferences
    (needs) and purchasing decisions. This model is dominating especially in the world
    of consumer goods, where market research methodology such as focus groups, conjoint
    analysis, customer surveys, and analyses of customer complaints is used regularly
    to identify and evaluate customer needs and desires.


    A second approach companies can use to define their solution space is to provide
    customers with toolkits for user co-creation (Frank e and Piller, 2004; von Hippel
    and Katz, 2002). These are software design tools similar to CAD systems, but with
    an easy-to-use interface and a library of basic modules and functionalities. With
    these toolkits, customers can by themselves translate their preferences directly
    into a product design, highlighting unsatisfied needs during the process. The
    resulting information can then be evaluated and potentially incorporated by the
    company into its solution space.


    Third, in developing their solution space (see Table 9.1) companies can employ
    some form of “customer experience intelligence”; that is to apply methods for
    continuously collecting data on customer transactions, behaviors, or experiences
    and analyzing that information to determine customer preferences. This also includes
    incorporating data not just from customers, but also from people who might have
    taken their business elsewhere. Consider, for example, information about products
    that someone has evaluated, but did not order. Such data can be obtained from
    log files generated by the browsing behavior of people using online configurators
    (Piller et al., 2004; Rangaswamy and Pal, 2003; Squire et al., 2004). By systematically
    analyzing that information, managers can learn much about customer'
