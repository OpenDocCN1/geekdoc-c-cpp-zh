- pgno: 343
  md: '# Product Configuration in SAP: A Retrospective


    Abstract: This chapter gives a retrospective of the development of the SAP Variant
    Configurator and the concepts it is based on. The SAP OS/2 configurator that preceded
    it and the IPC configurator that followed it share this legacy and are also covered.
    As these three configurators all have their roots in expert systems development
    projects of the 1980s, the beliefs and motivation of that time are reviewed.


    # 27.1 Introduction


    The SAP Variant Configurator (SAP VC) is a prominent example of a commercially
    relevant configurator. It is part of the SAP ERP (Enterprise Resource Planning)
    systems since R/3 3.0 and thus available to all customers as part of the SAP ERP
    license. Based on analysis of consulting requests/problem reports and other available
    data it seems that around 2000 companies employ it, making it one the most used
    commercial configurators since its inception around 20 years ago. For many companies
    their business depends on it.


    There exists a dedicated book, Variant Configuration with SAP (Blumöhr et al.,
    2012), which delineates not only the features and business integration of the
    SAP VC, but also looks at the surrounding ecosystem and customer case studies,
    and has a brief look at other related SAP configurators. This chapter is not a
    condensed version of that material, but a retrospective of the development of
    the SAP VC and the principles from which it is derived. It also uses the development
    of the configurators at SAP as an example for the commercial side of the evolution
    of configuration technology, because publications about this are sparse. This
    retrospective is based on personal involvement both with SAP (since 1992), and
    before that on participation in the TEX-K and TEX-B expert systems projects mentioned
    later (for the Battelle Institute, Frankfurt, Germany).


    The retrospective covers a succession of three SAP product configurators. The
    first was a PROLOG based sales configurator with very direct roots in expert systems.
    It was called the SAP configurator at the time, being the only one. As it was
    deployed on the OS/2 platform it was also informally referred to as the SAP OS/2
    configurator, a designation used here, although not officially correct. The next
    configurator is the SAP VC, already mentioned (see also Höfling, 2014¹). The third
    SAP configurator is what is now known as the IPC configurator. Each configurator
    is based on its predecessor. Many of the'
  merge: -1
  img_proc: true
- pgno: 344
  md: 'features originally developed in the expert system paradigm are still visible
    in these configurators. Hence, understanding expert system projects is key to
    understanding how and why they operate as they do.


    # 27.2 Expert Systems (XPS)


    The XCON system (McDermott, 1982) was deemed an expert system (XPS; see also Hotz
    et al., 2014a²). Its success showed that XPS can solve real business problems
    where classical implementations fail. At the time this grounded the fact that
    XPS provide a good way of dealing with configuration problems, and this in turn
    provided for ample funding both for corresponding research and for commercial
    projects in the 1980s.


    The basic architecture of an XPS as depicted in Figure 27.1 is very simple. The
    task of implementing an application is reduced to capture and represent the knowledge
    of human experts. This knowledge is then stored in the knowledge base (KB) of
    an otherwise out-of-the-box XPS. A user may then query the XPS, which uses predefined
    inference techniques to answer the query using the expertise stored in the KB.
    The task of acquiring the expert’s knowledge and representing it adequately in
    the KB is termed knowledge engineering (as opposed to classical software engineering).


    The XPS idea has some definite conceptual advantages. Since the XPS is to emulate
    the cognitive processes of the human expert, the system ideally is able to do
    whatever the expert would have been able to do if the KB encodes the relevant
    expertise and assuming the system has adequate inference techniques. Knowledge
    engineers are freed from worrying about the exact nature of the underlying problem.
    Their task is just to encode the relevant knowledge correctly. They also don’t
    have to worry


    ![](img/214a17cc1f5bbf0914497c7414128438_344_0.png)


    FIGURE 27.1


    General architecture of an expert system (XPS).'
