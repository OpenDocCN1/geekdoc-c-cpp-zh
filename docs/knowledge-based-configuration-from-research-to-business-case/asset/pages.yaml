- pgno: 250
  md: 'A restricted number of dealers with special rights is allowed to directly transform
    a basket into an order inside sellAIR Web. The configuration data together with
    the order header data are handed over to SAP ERP and an order object is created.
    In addition, an attractive proposal document is created for the dealer, which
    may be modified and handed over to the dealer’s customer.


    In order to configure products according to ERP, the necessary high-level product
    model master data (materials, classes, characteristics, configuration profile
    with dependencies, variant tables, GUI models, and translations) is transferred
    from SAP to sellAIR (both offline and online). This is done with the help of the
    sellAIR builder environment. An update can be easily triggered by Boge whenever
    changes in the master data occur. sellAIR builder uses a standard software component
    from encoway, named *K-Connect for SAP LO-VC*. The data transfer is performed
    in two steps: (1) *extraction* and (2) *mapping*. The extraction process is technically
    based on remote function calls to SAP BAPI (Business Application Programming Interface)
    via JCo (Java-Connector). The result is stored into a database. The mapping process
    takes this database and maps the content into the different structures of the
    target system (the encoway configuration environment (see Krebs, 2014⁵)). Dependencies
    in the SAP variant configurator are available as source code in plain text (following
    the LO-VC syntax) and have to be parsed and translated from this knowledge representation
    formalism into the target formalism. A compiler-compiler is used for this task.


    In the case of Boge, the SAP product model itself has not been altered. A navigation
    and search hierarchy was added to the products to allow easier access for novice
    users. Also, additional text and media was added for enhancing the configuration
    and result visualization together with document creation. On the sales side, the
    model was enhanced with a knowledge base for configuration of compressed air systems.
    Besides a compressor, such systems contain other (configurable) components, such
    as air filters and receivers. After the necessary user decisions are taken for
    a system, a configuration is started for each relevant component of the system
    (corresponding to a product in the LO-VC, but running outside SAP in the encoway
    configuration environment). The configuration result consists of a list of line
    items each with its dedicated configuration. This list can be processed by the
    following steps (document generation and quote/order creation). The sellAIR application
    is based on standard modules of encoway and adapted to the specific needs of Boge
    and their clients.


    # 18.3.3 sellAIR: Achievements


    sellAIR was launched in 2008. sellAIR Web has been added in 2011 and is publicly
    available since 2012. The following benefits have been achieved:


    +   - sellAIR replaces an old configuration system with double maintenance of
    configuration models in SAP and external tooling.

    +   - An automatic actualization process for product configuration models is established.

    +   - Product models in sellAIR are up to date and conform to their ERP counterparts.

    +   - Sales-oriented models are added for system configuration on top of the ERP-based
    product models.

    +   - Product and system configuration are available both online and offline.

    +   - Navigation and search enable fast access to relevant products.'
  merge: -1
  img_proc: true
- pgno: 251
  md: '+   - The tooling allows fast, technically correct, and individual proposal
    creation for Boge sales representatives.

    +   - A standardized dynamic generation of multilingual and attractive Microsoft®
    Word documents in different variants for different tasks with homogeneous international
    layout is one of the major achievements.

    +   - sellAIR allows comprehensive data exchange with SalesAssistant (CRM at Boge).

    +   - With sellAIR Web, also customers and dealers profit from the configuration
