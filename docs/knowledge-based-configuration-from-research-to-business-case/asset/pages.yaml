- pgno: 145
  md: '# Smarthome Configuration Model


    Lothar Hotz and Katharina Wolter

    HITeC e.V., University of Hamburg, Hamburg, Germany


    Abstract: In this chapter, we present a configuration model taken from a building
    automation domain. It provides complex aspects of configuration models such as
    separation of features of a system from realizing system components and domain-dependent
    workflows for the configuration process.


    # 10.1 Introduction


    This chapter presents an example of a configuration model of a building automation
    system. The task in this domain is to compose functionalities of a building, such
    as controlling sun blinds, regulating air conditioning systems, and monitoring
    lift facilities. In contrast to the working example introduced in Hotz et al.
    (2014),¹ the domain of building automation systems is more complex. This is due
    to (1) the higher number of attributed technical component types, (2) a combination
    of different models representing different aspects of the domain, and (3) the
    modeling of a configuration workflow.


    Besides the various knowledge types that are needed for solving configuration
    problems, the example introduces how to model features and components of the domain.
    Features are characteristics of products that are visible to the customers (Kang
    et al., 1990). The composition of the technical components to the actual building
    automation system makes sure that the features are accomplished (we say the components
    realize the features). Distinct submodels separate features and components; constraints
    and relations relate both.


    Furthermore, the example emphasizes the aspect of modeling the workflow of a configuration
    process. A workflow takes dependencies between configuration decisions into account
    and, thus, ensures an effective configuration process.


    In summary, this complex configuration model example demonstrates the usage of
    knowledge-based configuration techniques in a technical area. We thereby concentrate
    on different representation aspects and, thus, do not focus on a complete model.²


    In the subsequent sections, we introduce the configuration model for the building
    automation domain (the Smarthome model). Section 10.2 introduces the terminology
    used in the Smarthome domain. Section 10.3 introduces the structure of the Smarthome
    model. Section 10.4 provides the constraints of


    ¹ Chapter 6.


    ² Even though the model demonstrates complex modeling aspects, we base the model
    on simple assumptions about building automation systems. Further information about
    such systems can be found in Wolter (2003) and in xinca.com, www.buildingtechnologies.siemens.com,
    www.kmccontrols.com, highperformancehvac.com.'
  merge: -1
  img_proc: true
- pgno: 146
  md: 'the Smarthome model. Section 10.5 illustrates a workflow describing the configuration
    process for composing a specific building automation system. Section 10.6 summarizes
    the modeling and representation properties of the Smarthome model. Section 10.7
    concludes the chapter.


    # 10.2 Building Automation Systems: Domain


    Building automation systems (Smarthome systems) provide the equipment for regulating,
    controlling, and monitoring functionalities of buildings. Depending on the type
    of buildings, different systems can be automated: lighting systems, solar radiation
    protection systems, sun blinds, air conditioning systems, heating systems, sanitary
    facilities, lift facilities, telecommunications systems, or safety systems.


    Traditionally, if a building contains a number of such subsystems, they are controlled
    separately. This leads to high effort in wiring and less information exchange
    between the subsystems. By using a common bus (such as a Local Operating Network,
    LON³) a comprehensive system can be realized that allows a combined control of
    the subsystems. Devices from distinct areas such as lighting, solar radiation
    protection, and heating can be controlled via such a bus system. The connected
    systems can directly communicate with each other.


    Figure 10.1 gives an example of a configuration of a Smarthome: An office consisting
    of a corridor, a main office room (e.g., for a head of an office), and a normal
    office room (e.g., for a clerk) is equipped with building automation facilities.
    The corridor has a dimmable light. The main office room has sun blinds, which
    are controlled by:


    +   - A wind sensor that triggers the movement of the sun blinds as a means of
    protecting them against storms.

    +   - A brightness sensor that triggers a lowering of the sun blinds if it becomes
    too bright in the room.

    +   - A temperature sensor that triggers a lowering of the sun blinds if the temperature
    reaches a specific threshold (it could be too warm in the room and, as a consequence,
    the sun blinds should be down).

    +   - A presence detector that activates the brightness sensor if somebody is
    in the room; that is, the sun blinds are operated solely when a sensor detects
    a presence in the room (on the premise that if the room is empty, it is not necessary
    to lower the sun blinds).

    +   - A switch for allowing manual control of the sun blinds.


    Additionally, the main office room has two light groups, one on the ceiling and
    the other above the desk. The one on the ceiling switches on if somebody is in
    the room, the one above the desk can be dimmed.


    The normal office room has one light group, which is a constant light. It ensures
    constant lighting conditions in a room by taking the natural light into account
    (i.e., the light of the light group is dimmed according to the daylight in the
    room). For offices, constant lighting conditions are thus ensured throughout the
    day. In the office building, there is a control unit that controls centrally the
    office’s sun blinds and the light groups.


    Examples of features are the detection of the presence of a person in a room or
    controlling the sun blinds depending on wind or temperature changes. The configuration
    task in this domain is to compose the various components according to given desired
    features of a building automation system.'
  merge: -1
  img_proc: true
- pgno: 147
  md: '![](img/214a17cc1f5bbf0914497c7414128438_147_0.png)


    # 10.3 Configuration Model: Structure


    For separating functional characteristics and technical components of building
    automation systems, we divide the structure of the SmartHome model (represented
    by `SmartHome`) into a *feature model* (represented by `SmartHomeFeature`; see
    Subsection 10.3.1) and a *system model* (represented by `SmartHomeSystem`; see
    Subsection 10.3.2). These models allow a clear separation of functional characteristics
    (features) of a SmartHome from the components realizing these functionalities
    (see the association `realize` in Figures 10.2 and 10.3). The use of SmartHome
    as an aggregate with two parts, `SmartHomeFeature` and `SmartHomeSystem`, combines
    both aspects in the resulting configuration of one product.


    Both models exploit configuration knowledge representations as introduced in Hotz
    et al. (2014)⁴ and beyond. In particular, the presented models cover the following
    feature and component-related representation aspects, which will be explained
    in more detail in the following sections:


    +   - *Classes* are used for representing features and component types. For example,
    the sun blinds feature is represented with the class `SunBlindsFeature` and a
    dimmer is represented with the component type `Dimmer`.

    +   - *Instances* represent selected or inferred features or components for a
    certain configuration. Instances are not represented in the configuration model
    but created during the configuration process.'
  merge: -1
  img_proc: true
- pgno: 148
  md: '![](img/214a17cc1f5bbf0914497c7414128438_148_0.png)


    # **FIGURE 10.2**


    The Smarthome feature model with root feature `SmartHomeFeature` is related to
    the system model with root component type `SmartHomeSystem` through the association
    realize, (i.e., a `SmartHomeSystem` realizes the `SmartHomeFeature`). Both roots
    are part of the overall `SmartHome` model.


    +   - *Part-of* with multiplicity is used to express feature—subfeature relations
    and aggregate—part relations. For example, if sun blinds are desired as a feature
    for a smartroom, then the user (customer) should also make a decision with respect
    to the (sub) feature controlling the sun blinds.

    +   - *Specialization* is used for structuring the model with respect to common
    attributes. For example, a dimmer is a special control unit; consequently, it
    has all attributes of a control unit.

    +   - *Attributes* are only used for components. For example, the power consumption
    of an electrical component is modeled by an attribute of a class. Features can
    typically be selected by a user and have no further attributes.

    +   - *Requires* is used for expressing dependencies between components, features,
    or components and features. For example, a switchable light group requires a switch.'
  merge: -1
  img_proc: true
