- pgno: 182
  md: 'the idea of analyzing the solution space of the given problem (on the level
    of individual solutions) in order to detect different types of redundant constraints.
    Piette (2008) provides a discussion of the role of redundancy elimination in SAT
    solving. The author introduces an (incomplete) algorithm for the elimination of
    redundant clauses and show its applicability on the basis of an empirical study.
    The role of redundancies in ontology development is analyzed by Fahad and Qadir
    (2008). The authors point out the importance of redundancy elimination and discuss
    typical modeling errors that occur during ontology development and maintenance.
    Grimm and Wissmann (2011) introduce algorithms for redundancy elimination in OWL
    ontologies. The authors propose an algorithm that computes redundant axioms by
    exploiting prior knowledge of the dispensibility of axioms. Levy and Sagiv (1992)
    analyze two types of redundancies in Datalog programs. First, they interpret redundancy
    in terms of reachability (i.e., rules and predicates are eliminated that are not
    part of any derivation tree). Second, redundancy is defined on the basis of the
    concepts of minimal derivation trees, which do not include any pair of identical
    atoms where one is the predecessor of the other one. The redundancy detection
    algorithm introduced by Chmeiss et al. (2008) corresponds to the SEQUENTIAL algorithm
    discussed in this chapter. The work of Belov et al. (2012) is in the line of the
    COREdiag algorithm originally introduced by Felfernig et al. (2011) in the sense
    of applying the idea of subformula checking to the identification of redundant
    clauses (e.g., in SAT solving).


    All the mentioned approaches focus on the identification of redundant constraints
    in centralized scenarios where one or a few knowledge engineers are interested
    in identifying redundant constraints. In such scenarios it is assumed that only
    a small subset of the given constraints is redundant (this assumption is also
    denoted as low redundancy assumption; Grimm and Wissmann, 2011). In this chapter
    we go one step further and propose an algorithm that is especially useful in distributed
    knowledge engineering scenarios where we can expect a larger number of redundant
    constraints due to the fact that different contributors add constraints that are
    related to the same topic (see, e.g., Chklovski and Gil, 2005; Richardson and
    Domingos, 2003). We denote the assumption of larger sets of redundant constraints
    the high redundancy assumption. For example, we envision a scenario where a large
    number of users propose constraints to be applied by a constraint-based configuration
    or recommendation engine (Felfernig and Burke, 2008) and the task of an underlying
    algorithm is to identify minimal sets of constraints that retain the semantics
    of the original constraint set. We denote such constraint sets as minimal cores.
    Note that the following discussions are based on the assumption of consistent
    constraint sets. Methods for consistency restoration are discussed in Bakker et
    al. (1993), Felfernig et al. (2004, 2012), Friedrich and Shchekotykhin (2005).
    Also refer to Felfernig et al. (2014)² and Friedrich et al. (2014).³


    The major contributions of this chapter are the following. First, we introduce
    the algorithms SEQUENTIAL and COREdiag which allow the determination of redundant
    constraints. COREdiag is especially applicable in the context of distributed (community-based)
    knowledge engineering scenarios whereas SEQUENTIAL should be applied in “standalone”
    scenarios where the redundancy degree of knowledge bases is rather low. Second,
    we compare the performance of SEQUENTIAL and COREdiag using a financial service
    knowledge base.'
