  md: 'association, here from the motherboard to its CPUs. The cardinality entries
    ensure that each CPU has an assigned motherboard and a motherboard has one or
    two CPUs.


    After the model is complete, S''UPREME studio can generate a Java-based S''UPREME
    configurator application for the knowledge base. For each class in the knowledge
    base a corresponding Java class is generated. The inheritance hierarchy is taken
    directly from the UML diagram; for example, the classes OSAlpha and OSBeta are
    subclasses of the class OS.


    These generated Java classes with type-safe getter/setter methods can be treated
    by application programmers like normal Java classes; they can write additional
    methods in these classes for their purposes (output generation, GUI, testing,
    etc.).


    Attributes are defined by statements like


    ```

    theKnowledgeBase.defineStringAttr(

    "PC", // component class

    "usage", // attribute name

    new String[]{"internet","scientific","multimedia"});

    ```


    In this example, the attribute usage is defined at the class PC. Associations
    are defined in a similar way; for example, the following statement defines the
    bidirectional link between a motherboard (MB) and its CPUs:


    ```

    theKnowledgeBase:defineAssoc(

    "MB", // class 1

    "mb-of-cpu",1,1, // role 1 and cardinalities

    "CPU", // class2

    "cpus-of-mb",1,2); // role 2 and cardinalities

    ```


    A configuration is an instantiation of the knowledge base. The S''UPREME configurator
    maintains one configuration at a time. Using the Standard GUI, a user can manipulate
    the current configuration by adding, deleting, and connecting components and by
    setting their attributes. From the GCSP point of view, attributes and associations
    are seen as constraint variables, which are checked and manipulated by GCSP reasoning.


    A constraint is a condition on constraint variables (i.e., attributes and associations
    of component classes) that a valid configuration must satisfy. Like attributes
    and association, constraints are inherited along the type hierarchy. After each
    change in the current configuration the affected (possibly inherited) constraints
    are checked and their status (violated/valid) is updated. When the constraint
    is violated an explanation is provided by the GUI by showing the dependencies
    of the constraint.


    Constraints can also be used for filtering out inconsistent values. For example,
    when setting the efficiency for a PC to B the value C is no longer allowed for
    the efficiency of the screen and will no longer be shown on the GUI as a possible
    value. A similar filtering occurs for the PC if the efficiency for the screen
    is set first. A constraint like the following for the class Screen achieves this
    behavior for both cases:


    ```

    constraint.post(getVar("efficiency")

    .lessOrEq(getPC().getVar("efficiency"));

    ```'
