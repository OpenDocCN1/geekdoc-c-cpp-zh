- pgno: 228
  md: 'The goal is to find a minimal solution of racks, frames, and modules for each
    station when the elements and their functions (including required bits) are given.
    The scenario is incremental: functionality (and therefore modules) may be added
    to an an existing configuration.


    # 16.3 Requirements


    # 16.3.1 Variability


    Although the previous section only gives an overview of the most important components
    of an interlocking system, it shows the variety and complexity of the problem.
    There are various subsystems with quite different characteristics, for example:


    +   - Hardware with many types of different components as well as electrical and
    spatial constraints. As output for manufacturing, CAD drawings are needed.

    +   - Software modules with thousands of configuration parameters which depend
    on other parameters and on the hardware. They must be output in various formats
    so that they can be loaded into the PROMs of the electronic interlocking.

    +   - Communication equipment configured to satisfy different network protocols
    and address spaces.

    +   - Work places for the traffic controllers comprising monitor screens, keyboards,
    and other devices.


    Because railways have a long history and are considered by operators to be a kind
    of national culture, different countries have different regulations, equipment,
    and requirements. Therefore, corresponding variants and versions of the configurator
    application must be developed, deployed, and maintained in parallel.


    The applications and use cases range from single installations (market entry in
    a country) to “mass” production (several stations for one country). In the first
    case, it is vital to keep the costs for country-specific adaptations of the configurator
    low, for example, by giving the project engineer much freedom to configure the
    system according to the country’s special requirements. In the second case, it
    is vital to keep the costs for station configuration low, for example, by increasing
    the automation degree of solution finding. This kind of semi-interactive usage
    (a combination of manual editing and automatic completion) is also important when
    regulations change and a station configuration has to be adjusted accordingly
    before the change is implemented in the configurator.


    # 16.3.2 Complexity


    The inherent structure of the model is not only a tree as supported by most of
    the tools that are based on a BOM (bill of materials) structure such as feature
    modeling (Asikainen et al., 2006). Rather, it is a network, for example, for wiring
    between hardware components, for train routes in the track diagram on the traffic
    controller’s screen, and so on. Typically, each element (e.g., signal “S1”) has
    interacting representations in different subsystems (e.g., lamps in the hardware,
    parameters in the software, menu items on the traffic controller’s monitor, etc.).
    This leads to complicated consistency and completeness conditions (e.g. that a
    train route from one signal to another must be a path of connected elements without
    loops and with a unique choice of switch positions if alternative paths exist).


    Large stations can have hundreds of tracks with a similar number of axle counters
    or track circuits, hundreds of sets of points (switches) with one or two machines
    each, hundreds of signals with a total'
  merge: -1
  img_proc: true
- pgno: 229
  md: 'of thousands of lamps, and many other devices such as level crossings and section
    blocks. All these devices are wired with the computers in the interlocking building
    where tens of thousands of pins must be connected. The number of elements is multiplied
    by the different software modules in which they occur. In addition, there are
    thousands of train routes. Taking into account the fact that all these components
    may have several attributes and relations (associations) to other components,
    the number of variables can run up to hundreds of thousands. As most of them are
    not only Boolean values, but enumerations or integer values, the number of possible
    configurations is enormous.


    The configuration task must be able to handle dynamic growth of the system. The
    number of components is not known beforehand. Depending on the number of tracks,
    points (switches), signals, and other elements at the station, hardware racks
    and modules have to be supplied. The project engineer might decide to pack the
    modules tightly, or leave a certain amount of slack for future station extensions.
    In the second case, the user is not interested in a minimal solution and therefore
    plain optimization algorithms are not useful.


    # 16.3.3 Evolution


    Railway interlocking systems have a long lifespan (20 to 40 years). During that
    time, not only the station layout may change (due to adding or removing tracks,
    signals, or other equipment) but also the spare parts of the interlocking hardware
    may be changed to newer versions with different characteristics.


    Although the knowledge base is not as volatile as for consumer products, there
    is a change rate of about 10% per year (based on the number of classes, attributes,
    and constraints). Most changes are caused by new component types or new software
    functionality. However, constraints may change as well when regulations change
    (e.g., longer braking distances required) or when experiences from the operations
    lead to new procedures for manufacturing (e.g., two modules of a certain type
    are not to be placed next to each other because the resulting increase in heat
    might reduce their lifetime). Typically, old types cannot be removed from the
    knowledge base because they are still in use in existing configurations. Constraints
    must take into account the possible interrelations between all those old and new
    components and features. Proper tools for easy maintenance of the knowledge base
    are required.


    If the interlocking system has to be changed, due to either changes of station
    layout or the replacement of damaged components, an upgrade to the current knowledge
    base may be necessary. This can lead to constraint violations because the existing
    configuration no longer complies with the new knowledge base. In some cases, the
    necessary reconfiguration can be done automatically (such as setting new properties
    to their default value); in other cases, user decisions are required (e.g., in
    case an existing hardware module is no longer allowed in its current position,
    it is either to be moved to another position or replaced by a newer version which
    is allowed there). Falkner and Haselböck (2013) describe the main issues that
    arise in such situations and Friedrich et al. (2011) summarize important theoretical
    and practical aspects of formalizing reconfiguration problems.


    # 16.3.4 Other Issues


    The preceding paragraphs concentrate on knowledge representation and reasoning
    issues of the core configuration task. Of course, the configurator application
    as a whole has to deal with much more: Sales and pricing topics play a role in
    the bidding phase, although not as prominently as in consumer products’ configurators.
    Usability is directed at serving professional engineers, thus the graphical user'
  merge: -1
  img_proc: true
- pgno: 230
  md: 'interface must be clearly understandable and functional but need not be too
    elaborate. A very important topic is interaction with other systems or data sources:
    reading information about the station, generating outputs and documentation in
    various formats for manufacturing, reviews and assessments, access to product
    data in the management system (e.g., SAP). Last but not least, there are general
    issues such as authorization, collaboration, database management, version control,
    and so on.


    # 16.4 Techniques


    A short survey of the available commercial configuration frameworks and tools
    at the beginning of the development project showed that they were either not expressive
    enough (e.g., supporting only a flat set of variables and constraint tuples) or
    not efficient enough (e.g., solvers based on backtracking, backjumping, etc.).
    It was decided to create a powerful generic framework and specialization layers
    for domain-specific requirements for railway safety systems. See Haselböck and
    Schenner (2014) for a detailed description of the generic framework (S''UPREME).


    Most of the structures and requirements are similar for different railway companies
    (e.g., tracks, signals, train routes, etc.). However, they differ in some—sometimes
    many—details. For instance, sets of available hardware elements are different
    in different countries, rules about how to connect components vary, or special
    user interface views or import/export formats are needed. Therefore, the architecture
    of a S''UPREME configurator for railway safety systems consists of three layers
    (see Figure 16.6):


    +   - The domain-independent kernel of the S''UPREME framework, providing mechanisms
    for knowledge base representation, constraint-based reasoning, and generic user
    interfaces

    +   - The basis layer, containing all railway and technology knowledge that is
    common to all configurator variants

    +   - The variant layers, representing the specialties of different countries
    and customers


    In the basis layer for railway safety systems, some domain-specific implementations
    deal with special requirements, especially concerning input/output. The configurator
    reads tables (e.g., Excel) specifying customer requirements and checks their consistency
    (including cross-references between input tables). A template-based generator
    for outputs makes it easier to create documentation in various formats (XML, PDF,
    Microsoft Word, Excel, etc.).


    ![](img/214a17cc1f5bbf0914497c7414128438_230_0.png)


    # FIGURE 16.6


    Layers of a S''UPREME configurator.'
