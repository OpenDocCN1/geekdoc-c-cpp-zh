- pgno: 15
  md: '# About the Editors


    **Alexander Felfernig** has been a full professor at the Graz University of Technology
    (Austria) since March 2009; he received his PhD in Computer Science from the University
    of Klagenfurt. Currently, he directs the Applied Software Engineering (ASE) research
    group at the Institute of Software Technology. His research interests include
    configuration systems, recommender systems, model-based diagnosis, software requirements
    engineering, different aspects of human decision-making, and knowledge acquisition
    methods. Alexander Felfernig has published numerous papers in renowned international
    conferences and journals (e.g., AI Magazine, Artificial Intelligence, IEEE Transactions
    on Engineering Management, IEEE Intelligent Systems, Journal of Electronic Commerce)
    and is a co-author of the book *Recommender Systems*, published by Cambridge University
    Press. He also acted as an organizer of international conferences and workshops
    such as the ACM International Conference on Recommender Systems and the International
    Symposium on Methodologies for Intelligent Systems. Currently, he is a member
    of the Editorial Board of Applied Intelligence and the Journal of Intelligent
    Information Systems.


    **Lothar Hotz** is a senior researcher at the Hamburg Informatics Technology Center
    (HITeC e.V.) located at the University of Hamburg, Germany; he received his PhD
    in Computer Science from the University of Hamburg. He has participated in several
    national and European projects related to topics of configuration, knowledge representation,
    constraints, diagnosis, scene interpretation, requirements engineering, parallel
    processing, syntactic and semantic search, and object-oriented programming languages.
    Lothar has published numerous scientific papers about these topics. Besides other
    books, he is co-author of *Configuration in Industrial Product Families*, published
    by IOS Press. Lothar is furthermore active in the German national knowledge-based
    configuration community (PuK) and in the international knowledge-based configuration
    community.


    **Claire Bagley** has been the Director of the Oracle Advanced Constraint Technology
    (ACT) organization since June 2009. She manages the research and development of
    the Oracle ACT product, which supplies constraint solutions for Oracle applications.
    In addition, she is the author or co-author of numerous patents in Constraint
    Programming and in the Configuration application domain. Her research and development
    interests include configuration systems, planning and scheduling systems, as well
    as all application domains that may benefit from constraint programming and mathematical
    programming solutions. Claire also acts as an organizer and committee member in
    international conferences including The European Conference on Artificial Intelligence
    (ECAI), The International Joint Conferences on Artificial Intelligence (IJCAI),
    The International Conference on Integration of Artificial Intelligence (AI) and
    Operations Research (OR) Techniques in Constraint Programming, and The International
    Conference on Principles and Practice of Constraint Programming.


    **Juha Tiihonen** is a researcher at Aalto University, School of Science. His
    research interests include product and service configuration in various forms,
    including modeling, configurators, operations management aspects of business processes
    based on product and service configuration, design for configuration, and recommendation
    of configurable offerings. He has published numerous articles on these subjects,
    and he is an active member of the scientific community of knowledge-based configuration.'
  merge: -1
  img_proc: true
