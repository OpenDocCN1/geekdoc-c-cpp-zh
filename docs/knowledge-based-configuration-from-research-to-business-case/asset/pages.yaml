- pgno: 119
  md: '![](img/214a17cc1f5bbf0914497c7414128438_119_0.png)


    # FIGURE 8.1


    ICONE Knowledge Acquisition Environment: Example of a simple *requires* relationship
    (see also Hotz et al., 2014).


    significant improvements regarding the efficiency of configurator development
    processes can be expected in the future (Burke et al., 2011).


    # Provide Starting Points.


    The basic approach to the provision of starting points is to predetermine parameter
    settings that are of interest for the user. Such starting points serve as *default
    values*, which are proposed to the user within the scope of a configuration session.
    On the one hand defaults can represent specific parameter settings, for example,
    in German-speaking countries the value for the keyboard part of the configuration
    is set to German. On the other hand, defaults can represent whole subconfigurations;
    for example, the default installation settings for a software package included
    in a computer configuration. Independent of the generic type of default (i.e.,
    specific parameter setting vs. whole subconfiguration), defaults can be distinguished
    in terms of the way that default values are determined. Three basic types of defaults
    will be discussed in the following.


    *Static Defaults.* A parameter has a fixed predefined default value that is independent
    of the current configuration context. For example, the default value of the parameter
    *internet* is set to *yes* since it is assumed that most of the users want to
    have included the corresponding network hardware. The application of this type
    of default is limited since in many cases defaults depend on the context of user
    interaction. This aspect of *contextualization* is taken into account by the following
    two types of defaults.


    *Rule-Based Defaults.* Here the determination of defaults is personalized and
    the selection of default values is performed on the basis of predefined default
    rules. An example of such a rule is the following: *if the user has selected "programming"
    as a main field of application then the default value of the parameter "memory"
    is set to xGB.* Although this default type takes into account context information
    (on the basis of rules), rules trigger knowledge acquisition and maintenance efforts.
    The following default type does not rely on an explicit specification of contexts
    but on context learning on the basis of an analysis of already completed configuration
    sessions.'
  merge: -1
  img_proc: true
