- pgno: 185
  md: "# Algorithm 12.1 SEQUENTIAL(C_KB): Δ\n\n```\n{C_KB: configuration knowledge\
    \ base}\n{\\overline{C_KB}: the complement of C_KB}\n{Δ: set of redundant constraints}\n\
    {C_KBt: copy of C_KB used for redundancy elimination}\nC_KBt ← C_KB;\nfor all\
    \ c_i in C_KBt do\n  if isInconsistent((C_KBt − {c_i}) ∪ {¬c_i}) then\n    C_KBt\
    \ ← C_KBt − {c_i};\n  end if\nend for\nΔ ← C_KB − C_KBt;\nreturn Δ;\n```\n\nThe\
    \ approach of SEQUENTIAL is straightforward (see, e.g., Boufkhad and Roussel,\
    \ 2000; Chmeiss et al., 2008; Fourdrinoy et al., 2007; Grimm and Wissmann, 2011;\
    \ Piette, 2008): each individual constraint c_i is evaluated with regard to redundancy\
    \ by checking whether C_KB − c_i is still inconsistent with \\overline{C_KB}.\
    \ Instead of checking the inconsistency of C_KB − {c_i} ∪ \\overline{C_KB}, SEQUENTIAL\
    \ systematically reduces the number of constraints to be checked in \\overline{C_KB}.\
    \ Given a configuration knowledge base C_KB and its complement \\overline{C_KB},\
    \ the (in)consistency check of C_KB − {c_i} ∪ \\overline{C_KB} can be reduced\
    \ to the inconsistency check of C_KB' − {c_i} ∪ \\overline{C_KB'} where \\overline{C_KB'}\
    \ = {¬c_i}. If we assume that C_KB = {c1 ∧ c2 ∧ ... ∧ c_m ∧ c_{m+1} ∧ ... ∧ c_n},\
    \ \\overline{C_KB} = {¬c1 ∨ ¬c2 ∨ ... ∨ ¬c_m ∨ ¬c_{m+1} ∨ ... ∨ ¬c_n}, and γ =\
    \ {c_{m+1} ∧ ... ∧ c_n} then the consistency check of C_KB − γ ∪ \\overline{C_KB}\
    \ can be reduced to {c1 ∧ c2 ∧ ... ∧ c_m} ∪ {¬c_{m+1} ∨ ... ∨ ¬c_n}. In the SEQUENTIAL\
    \ algorithm this property is exploited correspondingly.\n\nIf (C_KB − {c_i}) ∪\
    \ {¬c_i} is inconsistent, c_i can be considered redundant. If C_KB − {c_i} is\
    \ consistent with ¬c_i, c_i is a nonredundant constraint since its deletion induces\
    \ consistency with \\overline{C_KB}. Applying the algorithm SEQUENTIAL to our\
    \ example C'_KB results in Δ = {c_a} since (C_KB − {c_a}) ∪ {¬c_a} is inconsistent\
    \ and no further constraint c_i can be deleted from C_KB such that (C_KB − {c_a,\
    \ c_i}) ∪ {¬c_i} is still inconsistent. Table 12.1 shows an execution trace of\
    \ the SEQUENTIAL redundancy detection algorithm on basis of our (redundant) example\
    \ configuration knowledge base C'_KB = {c_a, c1, c2, c3, c4, c5}.\n\n# Table 12.1\
    \ Example execution trace of SEQUENTIAL. The set of redundant constraints is Δ\
    \ = {c_a}.\n\n| SEQUENTIAL Iteration | C_KBt | c_i |\n|---|---|---|\n| 1 | {c_a,\
    \ c1, c2, c3, c4, c5} | c_a |\n| 2 | {c1, c2, c3, c4, c5} | c1 |\n| 3 | {c1, c2,\
    \ c3, c4, c5} | c2 |\n| 4 | {c1, c2, c3, c4, c5} | c3 |\n| 5 | {c1, c2, c3, c4,\
    \ c5} | c4 |\n| 6 | {c1, c2, c3, c4, c5} | c5 |"
