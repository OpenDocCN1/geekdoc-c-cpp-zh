- pgno: 263
  md: 'model-based systems considering the costs of necessary maintenance activities
    are usually smaller compared to very specific solutions, for example, using rule-based
    systems methodologies.


    # 19.5 Conclusion


    The SIMOA tool has been developed as part of the project *Simulation and configuration
    of mobile networks for M2M applications (SIMOA)* that deals with the study of
    principles for the simulation, (re)configuration, and optimization of mobile networks.
    The focus of the project is to investigate and solve problems in wireless networks
    under the assumption of a future user behavior and growing M2M applications. In
    particular, we are interested in reconfiguring a mobile network in case of bottlenecks
    caused by requirements coming from future M2M applications. The result of the
    suggestions for reconfiguration coming from the tool might be changes in the structure
    or the parameters of the mobile network. It is worth noting that only a flexible
    approach like model-based configuration is capable of handling the needs and requirements
    coming from the application domain.


    Summarizing, today’s configuration technology offers a lot of benefits for the
    M2M application domain: (1) providing evidence that a certain application scenario
    can be carried out in a current mobile phone network given the system model and
    the requirements; (2) suggesting reconfigurations for changing the system’s parameters
    or structure in order to meet requirements; (3) being flexible enough for adaptation
    to different usage scenarios. The latter is of particular interest in order to
    save investments and to cope with the fast-paced M2M application domain.


    # Acknowledgments


    The work presented in this paper has been supported by the BRIDGE research project
    Simulation and Configuration of Mobile networks with M2M Applications (SIMOA),
    which is funded by the FFG.


