- pgno: 156
  md: 'The last row states that when sun-blind features aren’t selected in the configuration
    then sensors are not required.


    The constraint *fsc-3* illustrates as well that the relation between features
    and components is generally an n-to-m relation; that is, a feature may need multiple
    components for its realization and a component may realize several features. For
    example, sun blinds controlled only by wind (*WindDep.*) need a *WindSensor* and
    a *SensorAggregate* (row 4). On the other hand, a *Multisensor* can realize brightness-
    and temperature-dependent sun blinds.


    # 10.5 Configuration Model: Configuration Workflow


    A *configuration activity* describes the configuration of a certain subsystem,
    like the configuration of a control unit or a lighting system (see Section 10.2).
    A configuration activity composes several configuration decisions represented
    by *steps*. In the Smarthome example described in this chapter, a decision corresponds
    to the selection of a feature or to the setting of a component’s attribute value.
    Thus, a configuration activity for a subsystem summarizes feature selection for
    that subsystem and decisions about realizing components.


    The *configuration process* is composed of a number of configuration activities.
    The configuration activities might depend on each other and have to be in a certain
    order. For example, the configuration of a control unit implies choosing push-buttons,
    which provide for the specific regulation of the room. Therefore, the control
    units can be configured only after the room functionality is determined. Or, the
    necessary network technology depends on the number and type of the needed devices.
    Thus, the network can only be determined at the end of the configuration of a
    building automation.


    [Figure 10.5](#) provides a dependency description for these examples in the Software
    Process Engineering Metamodel Specification (SPEM).⁶ Besides others, SPEM has
    the following graphical modeling facilities (see [Hotz et al. (2006)](#) for a
    detailed description of using SPEM in conjunction with knowledge-based configuration).


    **Activity.** An *activity* describes a piece of work performed by one process
    role. An activity consists of one or more atomic elements called *steps*. Activities
    represent configuration activities, such as configuring the control unit. A number
    of classes of the feature model or system model is assigned to each activity.
    All attributes and relations of these classes are subject to configuration in
    that activity. For example, for activity *Configure ControlUnit* the class *ControlUnit*
    is assigned, indicated by model class: *ControlUnit*. The related decisions are:


    +   - To configure the association regulates to a *LightGroup*

    +   - To make sure that the *ControlUnit* is part of a *SmartRoom*

    +   - And to determine the values of the inherited attributes *PowerConsumption*
    and *Price*


    It is important to note that all necessary decisions can be computed from the
    feature and system model (see Figures 10.3 and 10.4). For an example for computing
    necessary decisions from a model, refer to the modeling of procedural knowledge
    in KONWERK (see Hotz and Günter, 2014).⁷'
