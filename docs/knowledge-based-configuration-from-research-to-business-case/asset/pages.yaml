- pgno: 358
  md: 'The advanced mode suffered from a lack of standard integration to ERP. For
    example, the multiple instances for a single BoM item had to somehow be converted
    to an order BoM. This kind of integration was done in the individual projects.
    These were increasingly costly and SAP stopped supporting them without additional
    remuneration. Recently, the SAP Solution Configurator (SSC) based on advanced
    mode functionality is being offered as a standard product.


    The SCE was incorporated into SAP mobile sales and was also adapted for use on
    the Internet. Pricing had followed suit and developed the SPE (Standalone Pricing
    Engine) also in Java. SCE and SPE were joined in a component named the SAP IPC
    (Internet Pricing and Configuration). The IPC is part of SAP CRM. It is also described
    in Blumöhr et al. (2012) as far as it is relevant for customers using the SAP
    VC.


    From the point of business integration, there were new challenges. I mention three
    examples in closing this section: purchasing configurable products, contracts
    for configurable products, and incorporating configurable products in a catalog.


    Purchasing might be considered as a sales configuration from the perspective of
    the supplier. However, the buyer is faced with the problem of having to be able
    to store the configuration in a form that is intelligible to them; for example,
    the configuration must be enriched with texts and such, that would not be stored
    with an internal configuration, because they could be read from the database.
    However, purchasing could also result in a tender, which invites competing suppliers
    to submit quotes. In this case the subject of the tender is a configuration that
    describes the product sought (a magazine to be printed, say). The buyer owns the
    model, but the suppliers must be able to understand and process the configuration.


    A contract between two companies might state what products are offered from one
    to the other. For example, a company might allow their employees to directly order
    a personal computer from another company, but only when conforming to conditions
    agreed on with the supplier in a contract. In the case of a configurable product
    like a computer, this takes the form of a partial configuration (restricted domains,
    etc.). In the SAP world nonsingleton domain restrictions are normally not stored
    in a persisted configuration. Thus, the storage and associated logic must be modified
    accordingly. Another approach might be to define a restricted model for the contract.
    In practice, the first approach proved simpler.


    An electronic catalog that contains configurable products must support configuration.
    Some customers wanted to mass distribute such an electronic catalog on a CD. The
    CD would then have to contain the configurator and the model, ideally requiring
    no installation by the users. One question is how to display the product and its
    price in the catalog before the product has been configured. An answer is to always
    display a variant with its price and then adapt the product and price as the user
    reconfigures his/her solution based on this variant.


    In all three aforementioned examples, a central question is the ownership of the
    model and the pricing data. Generally, this is sensitive proprietary information
    that is exposed when access to it is granted through use of the configurator.
    If the KB is distributed on a CD, say, it may contain only information that is
    public.


    # 27.8 Conclusion


    The SAP Variant Configurator (SAP VC) has been in stable use for two decades (the
    SAP IPC configurator for more than one). Both configurators are hybrid in that
    they allow both procedural and declarative modeling. They support both (conceptual/generic)
    constraints and BoM oriented'
