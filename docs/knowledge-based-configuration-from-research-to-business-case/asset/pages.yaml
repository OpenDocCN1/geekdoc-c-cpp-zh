- pgno: 272
  md: '# FIGURE 20.3


    The DOPLER configuration wizard shows Decisions and Assets of the CC-L2 variability
    model. End users make configuration decisions by answering questions. Based on
    the configurers’ answers to questions, the tool computes the required list of
    Document Assets for the configured product. The generator then creates customized
    documents in Microsoft Word format based on this list.


    # 20.6 Conclusion


    This chapter reported on an industrial example to develop a flexible configuration
    tool with a focus on generating documents. The approach is based on variability
    models defining the structure of documents and processing configuration descriptions
    defining end-user choices. We implemented the approach using the SPLE tool suite
    DOPLER and Microsoft Word. Our approach is flexible with regard to'
  merge: -1
  img_proc: true
- pgno: 273
  md: 'document types and types of variability. The questionnaire-like structure of
    DOPLER decision models supports configuration by end users in a configuration
    wizard.


    For the described Siemens VAI’s CC-L2 product line various documents are required,
    which can now be automatically generated during product configuration with the
    DOPLER tool suite. The supported document types (e.g., system documentation, user
    manuals) vary in size and complexity. Although the initial effort for defining
    markups and models was considerable, the resulting solution was highly appreciated
    in the company as it avoids the time-consuming and error-prone task of manually
    adapting documentation. The acceptance of the approach also relies on the use
    of word processing tools already well established in the company. Furthermore,
    the knowledge needed for the preparation of product-specific documents is now
    explicitly defined. This allows more people less familiar with the system to generate
    valid customized documents and thus reduces the workload of experts.


