    The function QX adds additional constraints (from C2) to the background knowledge
    as long as the resulting constraint set remains consistent. If it becomes inconsistent,
    the algorithm leaves out the remaining constraints. For example, in Table 7.2
    (step 5) the set {c1, c3, c4, c5} is inconsistent and the remaining constraint
    c2 can be left out. On the other hand, if the background knowledge is consistent
    and only one constraint remains that induces the inconsistency, this constraint
