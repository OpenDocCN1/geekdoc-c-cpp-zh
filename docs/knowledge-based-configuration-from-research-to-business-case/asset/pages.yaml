  md: '# encoway: From ERP-Based to Sales-Oriented Configuration


    # CHAPTER 18


    Björn Höfling


    encoway, Bremen, Germany


    Abstract: ERP-based product configuration is often used for supporting business
    execution processes in companies. Reusing the underlying product configuration
    models in sales-oriented scenarios leads to additional challenges. In this chapter
    we describe a sales application called sellAIR, which is the outcome of joint
    project work of encoway and the German company Boge. With this application, Boge
    has succeeded in closing the gap between ERP-based product configuration and sales-oriented
    configuration.


    # 18.1 Introduction: ERP-Based Configuration


    Systems for enterprise resource planning (ERP) are integrated software applications
    for the automation of business processes. Typical examples of such processes in
    ERP systems are quote and order processing or production planning. For those companies
    that produce or deal with complex products with a high number of variants, some
    ERP systems support knowledge-based configuration. Depending on the specific market
    or supported scenarios, different knowledge representation and reasoning techniques
    are implemented in these systems. One of the major challenges to be addressed
    when manufacturing complex products can be summarized by the concept of mass customization,
    which tries to combine the advantages of mass production with the flexibility
    of individual customization (see Piller and Blazek, 2014¹). Configuration systems
    are a key-enabling technology of mass customization. A simple way of categorizing
    the application areas of (knowledge-based) product configuration in ERP systems
    can be shown along with the order fulfilment process. Make to stock (MTS) is a
    build-ahead production approach that supports mass production. In contrast, individual
    customization can be done in project-oriented production. In between, the scenario
    of make to order (MTO) is placed, which can be supported with the help of product
    configuration. Here, the production process is triggered by a sales order that
    includes the specific definition of the configurable products in the order.


    The German software corporation SAP AG is a big player in the enterprise application
    software market (see also Haag, 2014²). Its enterprise resource planning application
    is called SAP ERP, which includes a variant configurator called LO-VC (module
    logistics, variant configuration). Variant configuration is a basic technique
    that can be used in different business processes inside SAP ERP. The LO-VC can
    be applied in the modules PP (Production Planning), SD (Sales and Distribution),'
  merge: -1
  img_proc: true
- pgno: 244
  md: 'MM (Materials Management), CO (Controlling), CA (Cross Application Components),
    and CRM (Customer Relationship Management).


    Concerning knowledge representation and reasoning mechanisms, the LO-VC combines
    different approaches that lead to a high expressiveness for product configuration
    models. Both declarative and procedural modeling are supported through the following
    major modeling primitives for dependencies between different kinds of objects:


    +   - Constraints for assigning or checking values in a declarative way by evaluating
    (in)equations, variant tables, or variant functions

    +   - Procedures for assigning or changing values taking into account the defined
    sequence of operations (e.g., value assignments, price calculations, visibility
    changes, and dynamic default setting)

    +   - Preconditions for (dis)allowing values with the help of Boolean expressions

    +   - Selection conditions for including parts in bills of materials


    Monotonic behavior of characteristics (a value range can only be reduced during
    configuration and not enlarged) can be modeled by choosing so-called restrictable
    characteristics in combination with reducing their values with the help of constraints.
    The full extent of variant configuration with SAP is described in Blumöhr et al.
    (2012). For a comparison between the declarative and procedural approach of variant
    configuration with SAP, see Haag (2010).


    The remainder of this chapter is organized as follows. Section 18.2 describes
    in more detail our view on sales-oriented configuration together with its product
    models and functional requirements. Section 18.3 provides a concrete case study
    named sellAIR at the German company Boge. First, requirements are discussed. Thereafter,
    we present the architecture of the application. We conclude this chapter with
    a discussion of the achievements of the deployed sellAIR application.


    # 18.2 Sales-Oriented Configuration


    Obviously, a company’s sales force would like to have access to their product
    configurations for being able to make valid statements (technical and commercial)
    toward customers. But there are many cases where this cannot be done via direct
    access to the SAP ERP. In addition the ERP product model itself might be necessary
    but is often not sufficient for the support of sales processes. Vendors of complex
    configurable products typically have invested a high amount of know-how and modeling
    time, which is frequently in the area of dozens or hundreds of person-years. This
    knowledge is manifested in the product model of SAP LO-VC, which is constantly
    maintained and kept up to date. This is also the right place because it supports
    many core business processes of the company. Duplicating this product model for
    sales force requirements would implicate all the disadvantages of redundant data
    management. Therefore, this big amount of knowledge should be made available for
    processes that are not directly integrated into the ERP processes without redundancy
    and should follow the principle of single source of data with SAP ERP as the leading
    system.


    Figure 18.1 illustrates how business execution processes in SAP ERP and sales-oriented
    processes in external applications can share models. Typically, a configuration
    model in SAP can be divided into two parts. The high-level configuration is situated
    in SD (sales and distribution). It is interactive; that is, the user makes configuration
    decisions in a quote by assigning values to product characteristics of the'
  merge: -1
  img_proc: true
- pgno: 245
  md: '# FIGURE 18.1


    Sales-oriented configuration vs. ERP-based product configuration, with the high-level
    configuration model of sales and distribution (SD) being shared.


    different line items. The result of this configuration is handed over to the low-level
    configuration, which is situated in PP (production planning). This configuration
    is not interactive but determines starting from the results of the high-level,
    the bill of material (BoM) and the routing. As the knowledge base for the low-level
    is usually not needed in a sales-oriented process, only the high-level model should
    be exported and reused.


    # 18.2.1 Product Models for Sales-Oriented Configuration


    Reusing an ERP configuration model as is (without changes) for sales scenarios
    can be very attractive. But in many cases it is only a starting point for additional
    improvements. In the following, we will call this improved model a sales-oriented
    model in contrast to the source product model from the ERP system. Some of the
    major reasons for these improvements are:


    +   - Entities such as customer applications or machines, context, and environment
    are not suited for being handled in SAP LO-VC. Only objects used in the logistic
    processes like products or services can be modelled as so-called configurable
    materials where any configuration knowledge is attached.

    +   - In the ERP system such a configurable material is also the only possible
    starting point for a configuration. But in the early phases of sales-oriented
    configuration whole ranges of products may be relevant with at least parts of
    their dependencies. In SAP inferences can only be made when the list of possible
    configurable materials has been reduced to exactly one.


