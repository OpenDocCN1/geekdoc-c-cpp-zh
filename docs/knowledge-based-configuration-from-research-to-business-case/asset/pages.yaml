- pgno: 258
  md: 'To handle simulation, reconfiguration, and optimization based on the same underlying
    information we have adopted a model-based approach. In particular, we have designed
    a modeling language (SIMOL) that allows for specifying structure and behavior
    of systems as well as (re) configuration information and requirements. It is also
    necessary that the language can be used by non-AI experts. This is due to the
    fact that both the considered network as well as the M2M application requirements
    change over time and have to be adapted.


    The SIMOA approach is model-based and capable of fulfilling all the mentioned
    requirements. The approach is based on the SIMOL programming language (Nica and
    Wotawa, 2012), which is an object-oriented language with a Java-like syntax, and
    on the MINION constraint solver (Gent et al., 2006).


    As depicted in Figure 19.2, the resulting SIMOL tool architecture comprises three
    modules that are connected and interchange information: the SIMOL compiler, which
    maps the SIMOL program to a set of constraints (the MINION program) and also generates
    a symbol table that allows for mapping the variables used in the SIMOL program
    to the variables used in the constraint representation; the CSP solver, that computes
    a solution for the CSP problem; and the Mapping module, which takes the solutions
    coming from the constraint solver and changes the variable names to the names
    used in the original SIMOL program by using the previously generated symbol table.
    In this context, the reconfiguration core is represented by the CSP representation
    (MINION program) and the constraint solver; that is, the constraint solver is
    responsible for determining reconfigurations. The CSP solutions in Figure 19.2
    are mapped to the actual reconfigurations, depicted by Solutions in Figure 19.2.
    A solution to a CSP problem is an assignment of values to variables such that
    no constraint is violated (see also Hotz et al., 2014⁷).


    Due to this architecture, the SIMOA tool is general and can be used to solve various
    tasks. The only requirement is that the domain and the case-specific knowledge
    are specified using SIMOL.


    In Figure 19.3 we depict the UML diagram for a GPRS cell used in the SIMOL model
    and thus within our current implementation. As we can see, a cell owns one BTS
    component, a limited number of P2P Meter and Data Concentrator components, and
    a Base Load component. Moreover, the GPRS Cell has one attribute that refers to
    the possible GPRS/UMTS base load (gbase) the non-smart-metering-related data transfer,
    which is in fact defined in the value attribute of the Base Load component. A
    P2P Meter component type is described by the distance between the P2P meter and
    the BTS (mdist), the used codeset (codeset; the channel encoding that influences
    the amount of data to be transferred within one second), and by the various parameters
    corresponding to the protocol suites used to retrieve data from a smart device
    (dbr billing reads, iptlogin M2M gateway logins, etc.). Many of these attributes
    are to be found in the definition of the Data Concentrator type, but mostly with
    values depending on the number of PLC meters connected to the concentrator. Both
    PLC Meter and P2P Meter types are derived from the generic type Smart Meter. A
    BTS component has two attributes: the number of frequencies (fpc) and the number
    of time slots (availableTimeSlots), which the BTS allocates for M2M communication
    in a cell. Note that, unlike the other attributes depicted in Figure 19.3, these
    two can be automatically reconfigured in case of a failed simulation. In order
    to do that, two “fake” component types FPC (Frequencies Per Cell) and ATS (Available
    Time Slots) are introduced in the model (see Figure 19.3). They are “attributes-seen-as-components”
    types and, when linked to the actual attributes fpc and availableTimeSlots, they
    are able to reconfigure the given system.'
  merge: -1
  img_proc: true
- pgno: 259
  md: '![](img/214a17cc1f5bbf0914497c7414128438_259_0.png)


    # FIGURE 19.2


    The SIMOA tool architecture.


    For defining the model depicted in Figure 19.3, SIMOL makes use of component types,
    as illustrated in Figure 19.4. Each defined component possesses a set of attributes
    and introduces constraints in the system. Besides the constraints stated inside
    the constraints{...} block definition, also depicted as general constraints (see
    Figure 19.4, lines 30–36), SIMOL is able to capture the temporal aspects of the
    real system by means of state-specific constraints and transition constraints.
    While general constraints are satisfied in all the states, state-specific constraints
    are satisfied only in a certain state. The latter ones are provided in an additional
    observations file that contains at least the initial constraints (for the cell
    in the initial state). The transition constraints between two consecutive states
    appear in the transition{...} block and are implemented by means of the next operator
    (see Figure 19.4, lines 37–42).


    In our case, the GPRS cell model will be seen as a state machine with a predefined,
    bounded, number of states, where each state corresponds to different code-sets
    (attribute codeset) assigned to P2P Meter and Data Concentrator components. Thus,
    depending on the mdist attribute, which represents the distance between the BTS
    and the current meter m, the m.codeset value can be increased or decreased by
    following the transition constraints of the GPRS Cell component, as explained
    in Nica et al. (2012). Based on these transition constraints, the SIMOL compiler
    will generate for every state the new corresponding constraints.'
