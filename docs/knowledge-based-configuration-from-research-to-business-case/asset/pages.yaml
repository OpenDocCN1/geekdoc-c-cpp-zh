    of `SensorAggregate` (i.e., `WindSensor`, `OutsideTemperatureSensor`, `BrightnessSensor`,
    and `RainfallSensor`) are modeled as further sensors. A `Multisensor` covers brightness
    and presence sensors in one component. This choice between a combination of distinct
    sensors into a sensor aggregate and the use of one multisensor, which includes
    various sensors, is one of the major system-related decisions for a Smarthome
    system. Depending on the selected features, a combination of sensors or choice
    of the multisensor is possible. The Constraint *fsc-3* represents this dependency
    (see Subsection 10.4.3 and Table 10.1). These sensors furthermore illustrate the
    use of attribute `Price`, which all basic component types have by inheriting it
    from `ProductComponent`. Thus, the attribute `Price` does not have to be modeled
    for each component type and only specific prices have to be defined for the more
    specific components.


    # 10.4 Configuration Model: Constraints


    Like the structure model, we divide the constraints for a building automation
    system into *feature model constraints* (see Subsection 10.4.1) and *system model
    constraints* (see Subsection 10.4.2). Additionally, Subsection 10.4.3 provides
    constraints between the feature model and the system model. We provide an excerpt
    of constraint examples that illustrate the following constraint types: *resource
    constraint*, *incompatibility and compatibility constraint*, *requires constraint*,
    *constraint for sharing classes*, *algebraic constraint* for computations, *n-ary
    cardinality constraint*, *all-constraint* over an arbitrary number of attributes,
    and *table constraint*, which expresses a relation extensionally by enumerating
    possible combinations of variable values.'
