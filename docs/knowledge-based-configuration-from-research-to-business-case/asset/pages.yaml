- pgno: 167
  md: 'underlying reasoning engine but also to the availability of tools for knowledge
    acquisition when deciding on the technological basis for a configuration application.


    A modern configuration framework should provide mechanisms that abstract from
    the underlying technical representation as far as possible in the modeling phase.
    Typical elements that can be found in such tools may for example include mechanisms
    such as compatibility tables that are understandable even by non-IT people, user-oriented
    rule languages including appropriate editing support, or graphical representations
    of bill-of-material structures. A framework for such mechanisms and the tool support
    that can be provided will be presented in Section 11.2.4. In addition, appropriate
    support for testing, debugging, and tracing should be included in the framework
    in order to facilitate its practical use. We describe such a framework in Section
    11.3.


    # 11.2.4 A UML-Based Approach


    Having discussed the various issues in knowledge acquisition for configurator
    applications, we will describe the method from Felfernig et al. (2000a) for configurator
    development based on the Unified Modeling Language (UML) in this subsection. Figure
    11.1 gives the general overview of the proposed development process.


    The boxes in the figure show the different steps of the development process from
    product modeling to productive use. The support with appropriate mechanisms and
    tools for the development phases (1) to (4) is at the core of Felfernig et al.’s
    (2000a) proposal.


    In phase (1), the knowledge engineer together with the domain expert uses the
    Unified Modeling Language to develop a model of the configuration problem.³ However,
    instead of using some proprietary configuration-specific representation format,
    the idea is to rely on UML as a graphical notation, which is a widely known and
    standardized language for conceptual modeling in standard software engineering
    processes. Since UML is a general language not tied to a specific application
    domain, Felfernig et al. (2000a) propose to provide the modeler with a predefined
    set of configuration-specific modeling concepts. The definition of these domain-specific
    extensions is based on profiles and stereotypes, UML’s built-in mechanism to create
    a domain-specific language.


    In Section 11.2.2 we discussed the importance of appropriate problem-solving heuristics
    when reasoning about large-scale configuration problem instances. In many cases,
    this sort of fine-tuning the search process takes place at the final stages of
    the development process and at a low technical level based on the first experiences
    of running the system in production. If knowledge about effective search strategies
    is already available in the earlier development stages however, one could try
    to incorporate this knowledge also into the conceptual model. Being oriented toward
    the domain expert and knowledge engineer, the UML-based approach of Felfernig
    et al. (2000a) does not comprise modeling concepts for such heuristics. While
    there have been some proposals in the 1990s within the fields of Knowledge Acquisition
    and Knowledge-Based Systems that aimed at supporting the domain expert in formulating
    problem-solving knowledge at a more abstract or conceptual level, we see this
    problem as still largely open in the configuration domain.


    For each domain-specific concept, such as, for instance, the concept component-type,
    a set of so-called well-formedness rules in the form of OCL (Object Constraint
    Language) constraints are provided,


    ³ See also the discussion of viewing knowledge engineering as a modeling process
    vs. knowledge engineering as a transfer process in Studer et al. (1998).'
