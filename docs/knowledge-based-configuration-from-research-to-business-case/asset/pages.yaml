- pgno: 37
  md: '1994), railway interlocking (see Falkner and Schreiner, 2014¹⁴), cabin-layouts
    (Kopisch and Günter, 1992), the automotive industry (Pargamin, 2002), and drive
    systems (Ranze et al., 2002). Most of these configuration environments do support
    generative problem solving. A screenshot of railway interlocking hardware is depicted
    in Figure 2.2; drive systems are shown in Figure 2.3.


    The increasing size and complexity of configuration models (and corresponding
    configurations) triggered the development of further technologies. Approaches
    such as binary decision diagrams (BDDs; Andersen et al., 2010) and solution automata
    (Amilhastre et al., 2002) allow efficient reasoning especially in nongenerative
    configuration settings. Diagnosis and repair algorithms help users to overcome
    inconsistent situations (Felfernig et al., 2012; Junker, 2004; Sinz et al., 2007)
    in an efficient fashion (Card et al., 1991). Increasing model complexity triggered
    the development of graphical development and test environments that helped to
    increase understandability and maintainability of configuration knowledge bases
    (Aldanondo et al., 2000; Felfernig, 2007; Felfernig et al., 2004, 2000, 2013b;
    Haug, 2010). Today’s commercial environments provide graphical notations that
    allow the formulation of partonomies, taxonomies, and related constraints (sometimes
    also denoted as business rules).


    In addition to constraint-based approaches, Answer Set Programming (ASP) became
    a paradigm for configuration knowledge representation (Aschinger et al., 2012;
    Friedrich et al., 2011; Myllyniemi et al., 2005; Simons et al., 2002; Soininen
    et al., 2001; Tiihonen et al., 2003, 2013). ASP maps a logic-based configuration
    model onto propositional logic theories and solves them with SAT-solvers (see
    Hotz et al., 2014).¹⁵ Due to a first order logic-based knowledge representation,
    ASP allows a component-oriented representation of configuration tasks, and thus
    is a potential alternative to constraint-based approaches. The configuration system
    WeCoTin (Tiihonen et al., 2013) was implemented on the basis of this technology
    and tested against several application domains. The commercial version of WeCoTin
    is VariSales—(see Tiihonen and Anderson, 2014).¹⁶


    # 2.4 Mass Customization Toolkits


    The goal of mass customization is to efficiently provide customers with what they
    want, when they want it, and at a competitive price (see Piller and Blazek, 2014).¹⁷
    This widespread business requirement triggered the demand for technologies that
    intelligently support customers (end users) in autonomously configuring (codesign)
    products and services that fit their wishes and needs. Configurators deployed
    in such application scenarios are often referred to as mass customization toolkits
    (Aldanondo and Vareilles, 2008; Franke and Piller, 2003).


    Enabling customers to configure products and services on their own triggered the
    development of personalization technologies that provide services such as the
    automated recommendation of parameter values, whole (sub-) configurations, and
    questions of interest for the user (Ardissono et al., 2003; Chevaleyre et al.,
    2007; Cöster et al., 2002; Domshlak et al., 2000; Falkner et al., 2011; Felfernig
    and Burke, 2008; Felfernig et al., 2013a; Stegmann et al., 2003; Tiihonen and
    Felfernig, 2010). Furthermore, configurators were enabled to recommend alternative
    parameter settings in situations where no solution


    ¹⁴ Chapter 16.

    ¹⁵ Chapter 6.

    ¹⁶ Chapter 26.

    ¹⁷ Chapter 9.'
