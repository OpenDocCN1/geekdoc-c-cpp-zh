    | 5 | CPUD | MBDiamond | OSAlpha | ScreenA | MedStore | No |

    | Current | CPUD | MBDiamond | ? | ? | ? | ? |


    *Adaptive Defaults.* If we want to keep knowledge base development and maintenance
    efforts as low as possible, we have to develop mechanisms that are able to automatically
    determine parameter settings of relevance for the current user. Different types
    of machine learning approaches can be applied to support such an adaptive determination
    of defaults (Ardissono et al., 2003; Cöster et al., 2002; Falkner et al., 2011;
    Tiihonen and Felfernig, 2010). An example of the application of collaborative
    filtering is given in Table 8.3. The default value for the parameter *OS* (the
    operating system) proposed to the *current user* would be *OS-Alpha* since the
    nearest neighbors of the *current user* (the users 1 and 5) have choosen *OS-Alpha*.
    An example user interface that is based on adaptive default values is depicted
    in Figure 8.2. This configurator (RecoMobile) supports the configuration of mobile
    phones (for details see Tiihonen et al., 2014¹³).


    In the context of *knowledge engineering and maintenance scenarios*, defaults
    play a major role as well. The recommendation of constraints (see Figure 8.1)
    that could be of relevance for the current user (knowledge engineer or domain
    expert) can be interpreted as a specific type of adaptive default. Similar defaults
    can be determined for diagnoses (Felfernig and Schubert, 2010) or sets of redundant
    constraints (i.e., constraints that do not change the semantics of the knowledge
    base when deleted; Felfernig et al., 2011). In this context, a default can be
    interpreted as a set of faulty or redundant constraints.


    # **Support Incremental Refinement.** An important feature to support a user in
    preference construction is to explicitly visualize the existing tradeoffs between
    different configuration alternatives in corresponding comparison tables (Felfernig
    et al., 2006a). An approach often used to support such a tradeoff analysis is
    to simply rank alternative configurations with regard to their *price* (see Figure
    8.3). Presenting configuration alternatives in such a way biases the product comparison
    toward an evaluation of the price attribute (see also Mandl et al., 2014¹⁴). Since
    *price* is in many cases the most important decision criterion, such interfaces
    are often used in commercial settings. The major drawback of this type of product
    comparison is that the interface does not take into account the real preferences
    of the user.


    If user preference information is available, it can be taken into account when
    presenting configuration alternatives. For the purpose of our example let us assume
    that the preferences of the current user regarding the importance of the different
    product properties is known (see Table 8.4). Such preferences'
