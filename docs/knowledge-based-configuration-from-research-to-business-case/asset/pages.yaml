- pgno: 65
  md: '# Configuration Knowledge

    Representation and Reasoning


    Lothar Hotz*, Alexander Helferich†, Markus Stumptner‡, Anna Ryabokon§, Claire
    Bagley¶

    and Katharina Wolter*


    * HITeC e.V., University of Hamburg, Hamburg, Germany

    † Graz, University of Technology, Graz, Austria

    ‡ University of South Australia, Adelaide, SA, Australia

    § Alpen-Adria Universität Klagenfurt, Klagenfurt, Austria

    ¶ Oracle Corporation, Burlington, MA, USA


    **Abstract:** Configuration models specify the set of possible configurations
    (solutions). A configuration model together with a defined set of (customer) requirements
    are the major elements of a configuration task (problem). In this chapter, we
    discuss different knowledge representations that can be used for the definition
    of a configuration model. We provide examples that help to further develop the
    understanding of the underlying concepts and include a UML-based personal computer
    (PC) configuration model that is used as a reference example throughout this book.


    # 6.1 Introduction


    There is quite a long history of research dedicated to the development of configuration
    knowledge representation languages (Fel­fering et al., 2003; Günter and Kühn,
    1999; Jüngst and Heinrich, 1998; Junker, 2006; Mailharro, 1998; McDermott, 1982;
    McGuinness and Wright, 1998; Mittal and Falkenhainer, 1990; Mittal and Frayman,
    1989; Soininen et al., 1998). One of the first configuration systems was R1/XCON,
    which was built upon a rule-based representation language (McDermott, 1982; Soloway
    et al., 1987). Rule-based systems operate on a working memory that stores assertions
    made by rules. Rules are represented in an if-then style. If a rule is activated
    (given that the if condition is fulfilled) it can modify the contents of the working
    memory. Experiences showed that a major problem with rule-based systems is the
    intermingling of (product) domain knowledge and problem solving knowledge (see
    also Friedrich et al., 2014). A consequence is that if product knowledge is changed,
    rules related to the sequence in which components are integrated in a configuration
    have to be adapted as well, which triggers enormous maintenance overheads. The
    shortcomings of rule-based approaches were the motivation for the development
    of model-based knowledge representations that support a clear separation of domain
    and problem solving knowledge. Mittal and Frayman (1989) introduced a model-based
    definition of a'
  merge: -1
  img_proc: true
- pgno: 66
  md: 'configuration task that is characterized by: (1) a description of generic components
    in terms of their properties and relationships and (2) user requirements and preferences
    regarding functional properties of the solution (configuration). This characterization
    is a major foundation for configuration research and industry (Junker, 2006).
    It also includes the idea of separating functional requirements (customer requirements)
    from the technical properties of a configurable product.


    A major representative of model-based approaches are constraint-based systems
    (see, e.g., Freuder, 1997; Tsang, 1993). Related knowledge representations range
    from static constraint satisfaction (variables and constraints are predefined
    and are part of the search process from the very beginning (see, for example,
    Tsang, 1993), dynamic constraint satisfaction (variables are not necessarily active
    from the very beginning but can be activated within the scope of the search process;
    Mittal and Falkenhainer, 1990), to generative constraint satisfaction where components
    and related constraints are generated on-demand within the scope of the search
    process (see Stumpfner et al., 1998). Generative approaches can also be denoted
    as component-oriented since component types (instead of variables) and meta (generic)
    constraints (instead of constraints) are taken into account as first-class entities.
    Examples of configuration knowledge representation in terms of a constraint satisfaction
    problem (CSP) will be provided in Section 6.2.


    In the following, graphical representations have been developed with the goal
    of improving the accessibility (in terms of, e.g., understandability and maintainability)
    of configuration knowledge, which is crucial especially in commercial settings.
    One approach to the graphical representation of configuration models are feature
    models (see, e.g., Kang et al., 1990). Feature models can be represented in the
    form of a static constraint satisfaction problem (CSP; Tsang, 1993) or in the
    form of a SAT problem (Gomes et al., 2008). Neumann (1988) and Soininen et al.
    (1998) introduced configuration ontologies, which define relevant modeling concepts
    for configuration knowledge representation. These ontologies include modeling
    concepts that are typically provided in today’s commercial configuration environments;
    for example, component types, ports, and constraints. Similar ontological concepts
    as introduced, for example, by Neumann (1988) and Soininen et al. (1998) in terms
    of a UML profile for configuration knowledge representation, and a formalization
    of these concepts in first-order logic as well as in description logic has been
    proposed by Felfernig (2007), and Felfernig et al. (2000a, 2003). Note that in
    this chapter we focus on the representation of product-related configuration knowledge;
    knowledge representations related to incremental configuration processes (Sabin
    and Weigel, 1998) are discussed in detail in Leitner et al. (2014), Hotz and Wolter
    (2014), and Hotz and Günter (2014).


    With this chapter, we provide an overview of modeling concepts that are relevant
    for configuration knowledge representation. In Subsection 6.2.1, we introduce
    static constraint satisfaction problems as a basic representation mechanism for
    configuration knowledge. In Subsection 6.2.2, we introduce two types of advanced
    CSP representations that are dynamic and generative constraint satisfaction problems.
    Thereafter, in Section 6.3, we discuss graphical configuration knowledge representations
    (feature models and UML models). On the basis of the latter we introduce a personal
    computer configuration model. In the other chapters of this book, this UML model
    is adapted and extended where needed. In Section 6.4,'
  merge: -1
  img_proc: true
- pgno: 67
  md: 'we give an overview of different logic-based approaches to configuration knowledge
    representation. This chapter concludes with a discussion of major advantages and
    disadvantages of different types of configuration knowledge representations.


    # ## 6.2 Constraint-Based Knowledge Representation


    # ### 6.2.1 Static Constraint Satisfaction


    “Constraint technologies are one of the closest approaches computer science has
    yet made to the Holy Grail of programming: a user states the problem, the computer
    solves it.” (Freuder, 1997). Constraint technologies are one of the most successfully
    applied technologies of Artificial Intelligence (AI) in commercial settings (Brailsford
    et al., 1999). With these technologies, the knowledge acquisition bottleneck is
    tackled by the means of an easy to understand and easy to use technology. Application
    examples are *configuration* (Fleischanderl et al., 1998; Mittal and Frayman,
    1989), *scheduling* (Pinedo, 2012), and *recommender systems* (Felnering and Burke,
    2008; Jannach et al., 2010). Constraint-based representations are widely used
    for the definition of configuration models (see, Junker and Mailharro, 2003; Mailharro,
    1998). We first focus on *static constraint satisfaction problems* (CSPs).


    # ### Constraint Satisfaction Problem and Solution


    We will now introduce a definition of a *constraint satisfaction problem* (CSP)
    and its solution. This definition will then be used as a basis for defining a
    *configuration task* (problem) and a corresponding *configuration* (solution).


    **Definition (Constraint Satisfaction Problem – CSP).** A constraint satisfaction
    problem (CSP) can be defined by a triple (V, D, C) where V is a set of finite
    domain variables {v₁, v₂, . . . , vₙ}, D represents variable domains {dom(v₁),
    dom(v₂), . . . , dom(vₙ)}, and C represents a set of constraints defining restrictions
    on the possible values of the variables {c₁, c₂, . . . , cₘ}.


    A solution for a given CSP = (V, D, C) can be defined as follows.


    **Definition (CSP Solution).** A solution for a given CSP = (V, D, C) is represented
    by an assignment *S = {ins(v₁), ins(v₂), . . . , ins(vₖ)}* where *ins(vᵢ) ∈ dom(vᵢ)*.
    *S* is required to be complete; that is each variable of the CSP definition has
    a value in *S* and is consistent (i.e., *S* fulfills the constraints in *C*).


    # ### Configuration Task and Solution


    Based on this definition of a CSP, we can now introduce the definition of a *configuration
    task* (problem) and a corresponding *configuration* (solution). We introduce two
    sets of constraints that describe (1) the configuration knowledge base (*CKB*)
    and (2) the user requirements (*REQ*).


    **Definition (Configuration Task).** A configuration task can be defined as a
    CSP (V, D, C) where *V = {v₁, v₂, . . . , vₙ}, D = {dom(v₁), dom(v₂), . . . ,
    dom(vₙ)}, and C = Cₖᵦ ∪ Rᴇǫ*. *Cₖᵦ* represents the configuration knowledge base
    (the configuration model) and *Rᴇǫ* represents a set of user (customer) requirements.'
