- pgno: 99
  md: 'We will now start with a discussion of algorithms that focus on conflict detection
    and then show how to exploit identified minimal conflict sets in order to determine
    corresponding diagnoses. Note that conflict detection and diagnosis algorithms
    discussed hereafter are a basis for the concepts explained in Friedrich et al.
    (2014)⁴ and Felfernig et al. (2014).⁵


    # 7.3 Determining Minimal Conflict Sets


    Before discussing basic conflict detection algorithms useful for (but not limited
    to) configuration scenarios, we introduce the definition of a conflict (conflict
    set) in the context of an inconsistent configuration knowledge base.


    **Definition (Minimal Conflict Set).** A conflict set CS = {cₐ, c_b, …, c_z} is
    a subset of C such that inconsistent (B ∪ CS). AC = B ∪ C represents the set of
    all constraints in the knowledge base (AC = {c₁, c₂, …, cₙ}), B represents the
    background knowledge (no conflict elements are assumed to be included in B), and
    C represents the set of constraints subject of conflict search. A conflict set
    CS is minimal if there does not exist a CS′ ⊂ CS that has the conflict property.


    Note that if we want to analyze the whole knowledge base (taking into account
    the complete set of constraints in conflict set search), we simply have to define
    C = AC and, as a consequence, B = ∅.


    In our working example we are able to identify the following minimal conflict
    sets: CS₁ = {c₁, c₄, c₅} and CS₂ = {c₁, c₂, c₅}. These sets do not allow the determination
    of a solution; inconsistent ({c₁, c₄, c₅} ∪ B) and inconsistent ({c₁, c₂, c₅}
    ∪ B). CS₁ and CS₂ are minimal since none of their subsets fulfills the conflict
    set property. Each minimal conflict set (conflict) can simply be resolved by deleting
    one of its elements. This approach is used by some of the diagnosis algorithms
    discussed in Section 7.4.


    In the remainder of this section we introduce and evaluate two basic conflict
    detection algorithms: SIMPLECONFLICTDETECTION and QUICKXPLAIN.


    # 7.3.1 Simple Conflict Detection


    The first approach to the determination of minimal conflict sets is SIMPLECONFLICTDETECTION
    (see Algorithm 7.1). Conforming with the introduced definition of a conflict set,
    the algorithm focuses the search for a minimal conflict by explicitly specifying
    the set of constraints C ⊆ AC that might induce a conflict. Note that SIMPLECONFLICTDETECTION
    determines exactly one conflict set per computation. In order to identify all
    minimal conflicts in C, this algorithm has to be combined with a HSDAG-based diagnosis
    algorithm (see Section 7.4).


    The set CS collects all relevant elements (constraints) of the minimal conflict.
    If the deletion of all constraints of C does not allow the determination of a
    solution (inconsistent(B)) or AC (B ∪ C) itself is consistent, there is no need
    for searching for a conflict (the empty set ∅ is returned). In all other cases,
    the algorithm tries to identify a minimal conflict. In order to achieve this goal,
    elements cᵢ of C are extracted and used to figure out whether they are triggering
    a conflict. If such an element has been identified, it is stored in the set CS,
    which collects the set of elements contributing to the conflict.'
