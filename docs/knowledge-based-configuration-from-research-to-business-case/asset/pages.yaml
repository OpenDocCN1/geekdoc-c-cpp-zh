- pgno: 159
  md: 'activity, such as configuring the type of a switch. Furthermore, the order
    of such configuration activities depends on domain characteristics (such as determining
    the network technology of a building automation system at the end of the configuration
    process). Therefore, such dependencies must be represented in the configuration
    model.


    This characteristic distinguishes complex configuration problems from simpler
    configuration problems that can be solved with other reasoning techniques such
    as pure constraint processing. A one-step approach (to describe a problem and
    then to solve it) can’t be followed when solving a complex configuration problem.
    For complex problems, an approach with several steps (or configuration activities)
    is required. Each activity involves one or more decisions and a computation of
    the entailments of these decisions. These again influence the possible values
    of subsequent decisions. Thus, solving a configuration problem is a sequence of
    pairs consisting of decision-making and computing influences by reasoning.


    Not all configuration systems can represent workflows like those described in
    this example. Instead the workflow is directly implemented in an application-specific
    user-interface. For a model-based representation of a workflow, refer to Hotz
    and Günter (2014).9


    # 10.7 Conclusion


    This chapter provided a configuration example that includes a complex model divided
    in user-visible features, realizing components, and relations between those. The
    example demonstrated also the need for modeling configuration workflows.


