- pgno: 293
  md: '# 22.4 Conclusion


    A configuration system must always be integrated into the ordering, pricing, configuration,
    and manufacturing process of a business unit. This integration is well-supported
    by S''UPREME due to its open architecture, its standard object-oriented model,
    and its Java API.


    S''UPREME was and is successfully used in domains like mobility (train control
    systems, interlocking systems), telecommunication, and industrial production within
    Siemens (see Falkner and Schreiner, 2014⁴). Including country-specific variants
    there exist more than 30 different configurator applications based on S''UPREME.


    Technical systems are often configured in an interactive process. The user specifies
    his/her requirements and selects components, then the configurator checks the
    inputs, shows inconsistencies, rules out options that have become invalid, and
    derives additional knowledge (e.g., additionally needed components). Then, in
    turn, the user proceeds with his/her inputs, and so on. The process stops when
    the user has specified all of his/her requirements and the configuration is complete
    and consistent. A generative constraint system like S''UPREME supports this interactive
    process in a very natural way, guiding the user through a sequence of configuration
    steps.


