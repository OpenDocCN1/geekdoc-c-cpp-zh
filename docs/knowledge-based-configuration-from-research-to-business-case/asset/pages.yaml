- pgno: 346
  md: 'formulae state “what is” rather than “what should be done,” these approaches
    are termed declarative as opposed to procedural. An XPS, which operates on a declarative
    knowledge representation in its KB, is termed a model based configurator. The
    declarative representation as such is called a (configuration) model (see Hotz
    et al., 2014a³).


    # 27.3.1 (Conceptual) Constraints


    One primary concern of the knowledge engineer is to represent dependencies known
    to the human domain expert. In a model-based XPS, this representation should be
    declarative wherever possible. A (declarative) constraint, as opposed to a (procedural)
    rule, is a relation between entities in the model and their properties.⁴


    For example, an expert might tell the knowledge engineer that for a (straight)
    staircase of equidistant steps the height of each stair post (hp) depends on the
    position of the post on the step (pos), the height of the handrail (hr), the angle
    of ascension of the staircase (α), and that it is calculated using the following
    formula:


    hp = hr + pos tan α  (27.1)


    This is a geometric constraint, which would allow calculating the value of any
    of the variables in the formula given the other three by solving for that variable.
    (Normally though, it makes no sense to solve for α.) Therefore, without changing
    anything, it could also be written in a more neutral form closer to the geometric
    meaning of the expression as:


    tan α = (hp − hr) / pos  (27.2)


    The knowledge engineer must realize that this equality shall apply for all pairs
    (S, P) of instances in the configuration, where S is a staircase, P is a stair
    post, and P is a part of S.


    The knowledge engineer may model this information in various ways. One way might
    be as a snippet of PROLOG code. Figure 27.2 shows how it could be expressed in
    the SAP constraint syntax.⁵


    The constraint in Figure 27.2 is not a CSP⁶ constraint. If there were three instances
    of staircases in the configuration of a building with 50 posts each, it would
    need to be applied to 150 staircase/post pairs. This corresponds to 150 CSP constraints.
    Moreover, it uses real numbers and is prepared for interval domains of the variables.
    This is outside the scope of classical CSP. A constraint formulated at an abstract
    level as in Figure 27.2 is referred to as a conceptual constraint⁷ in PLAKON when
    there is danger of confusion with the CSP term. But this confusion does not occur
    in the context of the configurators


    ³Chapter 2.


    ⁴In this chapter, the terms property/attribute/characteristic are used interchangeably.
    Characteristic is the preferred term in SAP ERP. Attribute is the preferred term
    in AI. The term feature used in sales would be another synonym, not used here.
    Each of these terms may refer to an actual property of an object instance in the
    configuration, such as “height = 75 cm.” Or it may refer to an observable of an
    abstract concept, such as a class. For example, all stair posts have the observable
    property height.


    ⁵See SAP documentation for details on this syntax. Examples of SAP constraints
    with explanations are also given in Haag (1998). The angle α in the equation is
    taken to be in radians whereas the variable ?a in Figure 27.2 is taken to be in
    degrees.


    ⁶See Hotz et al. (2014b), Chapter 6.


    ⁷A generic constraint is similar to a conceptual constraint (see Hotz and Günter,
    2014, Chapter 24).'
  merge: -1
