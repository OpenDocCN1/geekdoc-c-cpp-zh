- pgno: 232
  md: 'to be detected at a very early stage and, equally importantly, ensures that
    the configurations remain stable from one version to the next. This feature is
    particularly important for railway applications, where all installations—and therefore
    all changes to existing installations—must run through intensive quality assurance
    and validation procedures.


    There are two groups of regression tests: small test cases, which test partial
    configurations with respect to one constraint each (typically designed during
    development), and large test cases comprising many different features in order
    to get a high coverage of various configurations and values (typically designed
    by the integration team at the start of the project). Of course, all these tests
    must be checked and possibly adapted when change-requests are implemented in a
    new version.


    The advantages of using a standard IDE (integrated development environment) such
    as Eclipse are exploited: It supports knowledge engineering with state-of-the-art
    editors (code completion, diagrams, etc.), debugging facilities, test environment,
    and version control.


    Iterative and incremental processes for knowledge engineering are important practices
    to guarantee customer satisfaction and high quality. In particular, they are necessary
    for correctly modeling the domain and product details as information from various
    sources has to be integrated: written technical specifications for the numerous
    parts of the configurable product, (tacit) knowledge of all involved engineers,
    different languages and representations (e.g., semistructured natural language,
    logical, graphical). Thus, the early and continuous involvement of domain experts
    during development of the configurator is crucial for success.


    # 16.5 Results


    The amount of configurator code concerning the core task of knowledge representation
    and reasoning is often overestimated. In the configurator described in this chapter,
    the model and constraints comprise only about 20% of the source code. The rest
    of the code deals with the user interface (UI), the generation of outputs (BOMs,
    documents, CAD drawings, manufacturing plans, etc.), and testing of the whole
    application.


    The layered architecture facilitates reuse considerably. The code size of a typical
    variant is approximately 10% of the whole application code (a small value, considering
    that railway companies in different countries have quite different requirements).
    Standardizing the model and UI (i.e., omitting those packages in the variant layer
    or reducing them to customization via tables or only overriding certain constraints)
    has reduced the number of code lines for variants by 40%. Thus, the development
    time of variants could be significantly reduced as well.


    Constraints help the user to avoid mistakes, reducing integration cycles and system
    test time. Rules and solving steps create objects and set values automatically,
    leading to productivity increases for the user by a factor of 10 and higher, compared
    to configuration tools used earlier:


    +   - For a specific country variant, the configuration effort of the first version
    of an interlocking system could be reduced from eight to two weeks.

    +   - A similar speed-up of 70% for the core configuration process was evaluated
    in a study of the Siemens business unit responsible for a new type of interlocking
    system in a country where several stations had to be equipped. They compared the
    tool for the new technology (which included tables with customer information)
    with an existing tool for a similar technology.'
  merge: -1
  img_proc: true
- pgno: 233
  md: '+   - With the help of the configurator variant for a new axle counter system
    (developed in less than a year’s work), the degree of automation with solvable
    constraints and rules was so high that 95% of the configuration could be derived
    within a few seconds, once the station layout had been drawn in the tool (requiring
    only a few hours’ work). Although such a system is much smaller than an interlocking
    system, it still consists of 50 classes with 300 attributes and associations and
    200 constraint definitions. Average configurations consist of 2,000 instances,
    30,000 variables, and 30,000 constraint instantiations.


    Multistep upgrades have reduced development time for the upgrade by an estimated
    50% of the upgrade coding time, as well as the users’ time for upgrading configurations
    to 1/N for each upgrade, N being the difference between source and target version
    numbers (i.e., the number of single-step upgrades).


    # 16.6 Conclusion


    The sections above have presented the rationale and impacts of using product configuration
    technologies in a configurator framework for large-scale industrial systems (railway
    interlockings). All in all, development could be accelerated compared to an alternative
    where only standard object-oriented programming languages would have been used:


    +   - Multiple usage of constraints (for checking, filtering, explanation, and
    repair) as well as their compact format reduced the size of the corresponding
    code parts by approximately 30%.

    +   - Maintenance is easier due to the declarative representation of the constraints
    (separation from solving algorithms).

    +   - Schema evolution and automatic database upgrade could be implemented more
    easily.

    +   - Training time of new knowledge engineers was reduced to approximately one
    half.

    +   - Compared to an analogous rule-based system, an estimated 20% of bugs were
    avoided.


    Thus, configuration technologies can definitely help to reduce project costs.


