- pgno: 140
  md: 'mass market segment can be planned more efficiently, and market research is
    more effective because of unfiltered access to data on market trends and customers’
    needs. This is of special benefit to those companies that unite large-scale make-to-stock
    production with tailored services. Mass customization can thus become an enabling
    strategy for higher efficiency of a mass production system.


    This learning relationship may lead to new cost-saving potential (Piller et al.,
    2004), based on better access to knowledge about the needs and demands of the
    customer base (Kotha, 1995; Squire et al., 2004). This includes (1) the reduced
    need for forecasting product demand (or at least the possibility to focus forecasting),
    (2) reduced or eliminated inventory levels of finished goods, (3) reduced product
    returns, (4) reduced obsolescence or antiquated fashion risks, and (5) the prevention
    of lost sales if customers cannot find the product in a store that fits their
    requirements and, thus, allocate the purchasing budget to another item. The savings
    from these effects can be huge. Forrester Research estimated that the US automotive
    industry could save up to $3,500 per vehicle by moving from its current build-to-stock
    model to a build-to-order system (Reichwald and Piller, 2009).


    # 9.4.5 Advanced Methods of Choice Navigation


    The application of toolkits for customer co-design may be the most used approach
    to help customers navigate choice in a mass customization system. But a number
    of other approaches exist, too. One effective approach is what we labeled assortment
    matching (Salvador et al., 2009), in which software automatically builds configurations
    for customers by matching models of their needs with characteristics of existing
    sets of options. Then customers only have to evaluate the predefined configurations,
    which saves considerable effort and time in the search process. Using special
    software, for example, customers at Sears.com can build avatars of themselves
    by selecting different body types, hair styles, facial characteristics and so
    on. From that information, the system can then recommend items out of the vast
    assortment of an online merchant.


    But customers might not always be ready to make a decision after they’ve received
    recommendations (see also Tiihonen et al., 2014³). They might not be sure about
    their real preferences, or the recommendations may not appear to fit their needs.
    In such cases, combining a recommendation system with a co-design toolkit is a
    perfect solution. Consider online shoppers at 121Time.com, a leading provider
    of mass-customized Swiss watches. Customers in the watch market might have a general
    idea of what they want, but while using an online configurator to play around
    with various options, combining colors and styles, they can actually see how one
    choice influences another and affects the entire look of a watch. Through that
    iterative process, they learn about their own preferences—important information
    that is then represented in subsequent configurations.


    A number of companies are engaging in even more innovative and drastic approaches
    to choice navigation. Choice navigation has been completely automated in recent
    products that understand how they should adapt to the user and then reconfigure
    themselves accordingly. Equipped with so-called embedded configuration capability,
    the products paradoxically become standard items for the manufacturer while the
    user experiences a customized solution. This can be regarded as a postponement
    configuration strategy where the user can be enabled to modify the product after
    it has been manufactured and has reached the user domain, offering an embedded
    product “smartness.” Imagine products with'
