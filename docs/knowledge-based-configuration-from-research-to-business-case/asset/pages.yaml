    # ### 10.4.3 Constraints between Feature Model and System Model


    The `realize` association specifies the major constraints between the feature
    model and the system model (`fsc`). For each realize association a requires constraint
    is needed that ensures the existence of a component that realizes a feature. Examples
    of such constraints are:


    +   - **fsc-1** The `LightGroupFeature` *requires* a `LightGroup` in the smart
    room.

    +   - **fsc-2** The `ManualControl` of `LightGroupFeature` *requires* a `Dimmer`
    **or** a `Switch` in the smart room.

    +   - **fsc-3** `SunBlindsFeature` *requires* components for a smart room as illustrated
    in Table 10.1.


    `fsc-3` determines which combinations of sensors are required for a room, if the
    `SunBlindsFeature` is selected (see Table 10.1). Each possible selection of features
    is enumerated on the left columns *Feature Selection* and the required sensors
    are listed on the right columns *Required Components*. For example, in the third
    row the sun blinds are controlled through wind and temperature changes (i.e.,
    `WindDep` and `TemperatureDep` equal to yes). Thus, a `WindSensor` and `TemperatureSensor`
    including the integrating `SensorAggregate` must be in the resulting system. Basically,
    if a wind-dependent control is needed (feature `WindDep` equals to yes, i.e.,
    the first four rows) the `SensorAggregate` with a certain combination of sensors
    has to be selected, otherwise (row 5 to 7) the `Multisensor` can be selected.


    **Table 10.1** Certain components realize combinations of the `SunBlindsFeature`.
    An extensional table represents the constraint `fsc-3` by enumerating possible
