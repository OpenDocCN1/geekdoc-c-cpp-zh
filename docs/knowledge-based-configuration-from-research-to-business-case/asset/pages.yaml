- pgno: 38
  md: 'could be found for the given set of customer requirements (Felfernig et al.,
    2009, 2012; Junker, 2004; Sinz et al., 2007). For an overview of the application
    of recommendation technologies in configuration scenarios refer to Tiihonen et
    al. (2014).18 An example of a mass customization toolkit is mi adidas,19 which
    supports the configuration of individualized shoes (see Piller and Blazek, 2014).


    Besides supporting customers in finding products and services that fit their wishes
    and needs, mass customization toolkits are also exploited for the identification
    of new requirements emerging in the customer community. On the one hand, such
    requirements can be derived by analyzing customer interactions with the mass customization
    toolkit, and on the other hand, customers themselves can be integrated into a
    company’s new product development processes. Both of these approaches exploiting
    customer knowledge for new product development are related to the concept of open
    innovation (Chesbrough, 2003); that is to systematically integrate customers into
    a company’s value chain. A nice example of an open innovation toolkit is introduced
    by Piller et al. (2004), who present a community-based environment for the cooperative
    development of computer games. In this context, an open innovation toolkit supports
    the generation of new game components without the need of programming knowledge.


    # 2.5 Conclusion


    In this chapter, we provided an outline of configuration-related historical developments.
    These developments can be briefly characterized as follows:


    +   - From initial applications as rule-based expert systems,

    +   - Via early model-based configurators, which allow a clear separation of domain
    knowledge and problem-solving knowledge,

    +   - To mainstream model-based configuration environments integrated in supply
    chains and ERP systems,

    +   - And mass customization toolkits.


    The history of configuration reflects many different developments that ultimately
    lead to industrial strength configuration technologies. As such, configuration
    can be seen as one of the most successful application areas of Artificial Intelligence
    technologies.


    We are aware of the fact that not all configuration-related developments could
    be considered in this chapter, and refer you to further related work, for example,
    on resource-based configuration (Heinrich and Jüngst, 1991; Jüngst and Heinrich,
    1998), functional approaches (Stein, 1995), description logic-based configuration
    (McGuinness and Wright, 1998; Wright et al., 1993), hybrid configuration (Günter,
    1995; Hotz, 2009; Junker and Mailharro, 2003; McGuinness and Wright, 1998; Wright
    et al., 1993), and related topics that are discussed in Chapter 3. For further
    historical remarks, refer to overviews such as Forza and Salvador (2002), Günter
    and Kühn (1999), Jannach et al. (2007), Sabin and Weigel (1998), Soininen et al.
    (1998), and Stumptner (1997).'
