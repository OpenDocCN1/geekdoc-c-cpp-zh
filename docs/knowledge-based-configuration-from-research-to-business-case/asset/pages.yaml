- pgno: 35
  md: 'consequences of assignments to other variables and the order of variable assignments
    does not affect constraints. Nowadays, basic constraint technologies are provided
    by open source constraint libraries such as CHOCO, JACOP, and MINION.


    A major characteristic of many configuration domains is the need of component-oriented
    configuration knowledge representations (Mittal and Frayman, 1989). In order to
    assure the maintainability of the configuration model, component types and their
    relationships are treated as first class entities within an object model; that
    is component types and relationships are not represented as variables and constraints
    but as component types and generic constraints (see Hotz et al., 2014).


    Without any claim to completeness, we want to mention the following “early” environments
    that supported a component-oriented knowledge representation: COSSACK (Frayman
    and Mittal, 1987), (Wright et al., 1993), COCOS (Stumptner et al., 1994), Beologic
    (Skovgaard, 1996), Trilogy (Franke, 1996), Selectica, Caméléon (Aldanondo et al.,
    2000), SAP (Haag, 1996), and further developments of the PLAKON configurator (Cunis
    et al., 1991; Günter and Cunis, 1992; Neumann, 1988; see also Haag, 2014).


    # ## 2.3 Mainstream Configuration Environments


    Today, component-oriented technologies are widely used for the representation
    and solving of configuration tasks. Promising results with the early systems and
    a cut in prices by several orders of magnitude due to the transition from classic
    AI environments to mainstream environments triggered further developments (and
    also redevelopments), which ended in industrial-strength configuration environments
    such as Tacton (Orsvärn and Axling, 1999), ConfigIT (Moeller et al., 2001), EngCon
    (further development of KONWERK; see Hotz and Günter, 2014; Ranze et al., 2002),
    and ILOG; see Junker and Mailharro, 2003; Mailharro, 1998. At the same time, configuration
    environments were increasingly integrated into ERP (enterprise resource planning)
    solutions; examples are SAP (Haag, 1998), BAAN (Yu and Skovgaard, 1998), and ORACLE.
    ERP systems and supply chain integration made configuration a mainstream technology
    simply due to the fact that ERP systems were already widely used.


    Complex configuration tasks need *generative configuration approaches*; this is
    the generation of components (instances of component types) and corresponding
    constraints (instances of generic constraints) on demand. This capability is a
    further development of early component-oriented configuration approaches. Component-oriented
    knowledge representations and generative problem solving are crucial for complex
    domains such as telecommunication (Fleischanderl et al., 1998; Stumptner et al.,
    1998,


