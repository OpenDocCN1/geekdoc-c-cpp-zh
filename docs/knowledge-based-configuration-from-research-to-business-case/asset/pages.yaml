- pgno: 310
  md: "This focus selects top-down structuring for the property hasParts and parameterization\
    \ for parameter hdcapacity of the concepts PC and Application (i.e., two decisions\
    \ will be focused).\n\nSC is a series of selection criteria where each selects\
    \ a set of construction steps from the set defined by the focus FO. Similar to\
    \ a focus, a selection criterion uses concept and property names as well as construction\
    \ step types for selecting construction steps.\n\nExamples of two selection criteria\
    \ are the following. Each of these criteria prefers one decision. The prefer-pc\
    \ selection criteria selects the top-down structuring decision and the prefer-application\
    \ the parameterization of hdcapacity:\n\n```\n(define-agenda-selection\n:name\
    \ prefer-pc\n:concept PC\n:cs-type top-down-structuring\n:property (hasParts))\n\
    ```\n\n```\n(define-agenda-selection\n:name prefer-application\n:concept Application\n\
    :cs-type parameterize\n:property (hdcapacity))\n```\n\nThe focus and the selection\
    \ criteria are combined in a strategy as follows:\n\n```\n(define-strategy\n:name\
    \ application-selection\n:priority 2000\n:focus application-focus          ; (*)\n\
    :agenda-selection-criteria\n    (prefer-pc prefer-application)  ; (**)\n:value-determination-method\n\
    \    (default computational-function ask-user))  ; (3*)\n```\n\nIn total, this\
    \ strategy focuses on decisions that are related to PC and Application by using\
    \ the application-focus(*). This focus collects two decisions as just described.\
    \ Those decisions are ordered by the agenda selection criteria prefer-pc and prefer-application;\
    \ i.e., the hasParts top-down structuring decision is made before the parameterization\
    \ hdcapacity decision is made (**). The list of value determination methods (3*)\
    \ is used to compute the configuration steps i.e., first a default value is tried.\
    \ If it is not defined, a computation function is invoked. If also this value\
    \ determination method is not able to supply a valid value, the user is asked\
    \ (\"ask-user\"). There might be several strategies in a configuration model.\
    \ The given priorities determine their order. The user interaction (\"ask-user\"\
    ) achieves a dynamic extension of the initially given requirements.\n\nIn KONWERK,\
    \ a configuration problem (task; see also Hotz et al., 2014b⁹) consists of (1)\
    \ instances (components) and (2) a configuration model with concepts, constraint\
    \ definitions, and procedural knowledge. The task description computes the instances.\
    \ Thus, they are partially instantiated concepts and constitutes the initial partial\
    \ configuration that represent user’s requirements. The term partially emphasizes\
    \ the fact that the user typically does not provide a value for each property\
    \ of the desired instances. The configuration model is used throughout the configuration\
    \ process to infer values for instance properties and create new instances if\
    \ needed. A solution S of the problem (a configuration) is a set of instances\
    \ Sᴵ that are consistent with the concepts, conceptual constraints, and conceptual\
    \ relations. Additionally, the instances belonging to a solution have to be computed\
    \ through a configuration process"
