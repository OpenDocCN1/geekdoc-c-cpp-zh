- pgno: 169
  md: 'In order to demonstrate the applicability of the approach also for specific
    realizations of the component-port approach to configuration, a mapping of the
    conceptual models to the constraint-based representation of the commercial ILOG
    Configurator framework (Mailharro, 1998) has been implemented.


    In phase (4), the resulting knowledge base should be validated based on test cases
    and expert knowledge, before it is set into productive use in phase (5). In order
    to support the knowledge engineer in this phase, a debugging approach for declarative
    configuration knowledge bases is proposed in Felfernig et al. (2004). The proposed
    method relies on model-based diagnosis techniques that were originally developed
    for the analysis of hardware components and electronic circuits. With the help
    of this method, the knowledge engineer is pointed to potentially erroneous statements
    within the knowledge base. Since there is a close correspondence between the knowledge
    base contents and the conceptual models through the automatic generation process
    however, the engineer can use these pointers to potential errors to fix the problems
    at the conceptual level and then repeat the process of knowledge base generation.
    We will discuss more details of the employed model-based diagnosis technique in
    the next section.


    In summary, one of the key goals of the proposed approach, which is based on model-based
    development, declarative knowledge representation, and AI-based reasoning, is
    to decrease the required development, debugging, and maintenance efforts. An exact
    scientific quantification of potential cost savings when using different software
    engineering techniques or a model-based approach is hard in general. An anecdotal
    example is given in Fleischanderl et al. (1998), where the authors report that
    in their experience up to 20% of the product development cost in their domain
    usually goes into the development of the configurator software. Furthermore, they
    estimate that using a declarative, constraint-based approach helped them to reduce
    the costs for configurator development by up to 60%. A further indicator that
    the proposed concepts are valuable in practice is that some of them were implemented
    in commercial tools: The ILOG JConfigurator product of the mid-2000s, for example,
    included both a graphical modeling component similar to the UML-based structure
    diagrams from Felfernig et al. (2000b) as well as an algorithm for conflict detection
    and explanation, which are only possible in a declarative approach.


    # 11.3 Debugging Configuration Knowledge Bases


    In order to introduce the diagnosis of configuration knowledge bases, we employ
    a small part of the example introduced and illustrated in Hotz et al. (2014).⁵
    All necessary axioms are presented to make the example self-contained. We illustrate
    our approach by introducing a typical error and subsequently demonstrate the application
    of model-based diagnosis methods to locate the faulty description. Based on this
    example we describe the basic concepts of model-based diagnosis and finally show
    their application to our introductory example.


    # 11.3.1 Motivating Example


    Let us assume that besides the components that were mentioned in the introductory
    example, there is also a universal motherboard that can be part of valid PC configurations.
    This motherboard allows a CPU_D and a CPU_S to be combined on one motherboard.
    Consequently, the configuration knowledge'
  merge: -1
  img_proc: true
- pgno: 170
  md: 'base KB⁶ has to be extended by axioms⁷ that reflect these new configuration
    options. In particular, a class hierarchy formed by is-a relations between various
    types of motherboards can be modeled as follows. Every specialized motherboard
    is a motherboard (Axioms 1 to 3). The specialization is exclusive (Axioms 4 to
    6). Finally, Axiom 7 expresses that every motherboard must be of one specific
    motherboard subtype. However, in Axiom 7 the knowledge engineer forgot to extend
    the consequent of the formula by MBUniversal. We denote the faulty knowledge base
    by KB_faulty.


    +   (1) MB Silver(X) → MB(X).

    +   (2) MBDiamond(X) → MB(X).

    +   (3) MBUniversal(X) → MB(X).

    +   (4) MBSilver(X) ∧ MBDiamond(X) → false.

    +   (5) MBSilver(X) ∧ MBUniversal(X) → false.

    +   (6) MBDiamond(X) ∧ MBUniversal(X) → false.

    +   (7) MB(X) → MBSilver(X) ∨ MBDiamond(X).


    The correct Axiom 7 should read:


    ```

    (7ok) MB(X) → MBSilver(X) ∨ MBDiamond(X) ∨ MBUniversal(X).

    ```


    Furthermore, we declare that CPUD and MBSilver as well as CPUS and MBDiamond are
    incompatible, which is expressed by:


    +   (8) CPUD(C) ∧ cpu-of-mb(C,M) ∧ MBSilver(M) → false.

    +   (9) CPUS(C) ∧ cpu-of-mb(C,M) ∧ MBDiamond(M) → false.


    After specifying the knowledge base the knowledge engineer will usually try to
    validate it with the help of test cases. When debugging configuration knowledge
    bases, we can distinguish between positive and negative cases. Positive cases
    are configurations that must be consistent with KB whereas negative cases have
    to be inconsistent. Stating it differently in logical terms, the negation of a
    negative case must follow from KB. In general, test cases can be either complete
    or incomplete. A complete test case comprises all relevant parts (such as components
    and connections) of a configuration whereas an incomplete test case specifies
    only parts of a configuration, which in case of a positive test case must be expandable
    to a complete configuration. Conversely, a partial negative test case declares
    a partial configuration that cannot be expanded to a complete configuration. Configurations
    as defined in Hotz et al. (2014)⁸ are complete. A test case is a logical sentence.


    Let us consider the following example of a positive incomplete test case c⁺, which
    specifies that there must exist a configuration where a CPUD and a CPUS are on
    the same motherboard.


    ```

    c⁺: MB(m1) ∧ CPUD(c1) ∧ CPUS(c2) ∧ cpu-of-mb(c1,m1) ∧ cpu-of-mb(c2,m1).

    ```


    ⁶KB is denoted as C_KB in Chapter 6.


    ⁷We employ the usual logic-programming notation for axioms. Symbols starting with
    an uppercase letter denote logical variables. All logical variables are universally
    quantified. The symbol false expresses unsatisfiability.


    ⁸Chapter 6.'
  merge: -1
  img_proc: true
- pgno: 171
  md: "A negative test case c⁻ on the other hand specifies that a CPUD and a CPUS\
    \ must not be mixed on silver and diamond motherboards.\n\n```\nc⁻: CPUD(c1) ∧\
    \ CPUS(c2) ∧ (MBSilver(m1) ∨ MBDiamond(m1)) ∧\n    cpu-of-mb(c1,m1) ∧ cpu-of-mb(c2,m1).\n\
    ```\n\nTesting the given knowledge base with these two test cases results in an\
    \ undesired contradiction—KB_faulty ∪ c⁺ is inconsistent. In particular, Axioms\
    \ 7, 8 and 9 are unsatisfiable when combined with c⁺. Consequently, one of these\
    \ axioms must be changed when assuming that the test cases are correct. Note that\
    \ apart from the faulty Axiom 7 also the correct Axioms 8 and 9 are involved in\
    \ the contradiction. Therefore, at first sight one of these axioms might also\
    \ be faulty. However, it will turn out that if we assume either Axiom 8 or 9 to\
    \ be faulty, there must be an additional faulty axiom.\n\nLet us first assume\
    \ that Axiom 8 is faulty and all other axioms are correct. Axioms 7 and 9 combined\
    \ with c⁺ imply that motherboard m1 is of type silver. Consequently, Axioms 7\
    \ and 9 and case c⁺ imply c⁻. Remember, however, that c⁻ must be inconsistent\
    \ with the knowledge base. In other words, the knowledge base has to imply ¬c⁻.\
    \ Consequently, if we consider Axiom 8 as faulty and all other axioms of KB_faulty\
    \ as correct, there is no way to extend this set of axioms to an acceptable configuration\
    \ knowledge base given the test cases. Any change of KB_faulty where only Axiom\
    \ 8 is deleted or replaced cannot be consistent with the positive case and inconsistent\
    \ with the negative case. Similar arguments hold for Axiom 9.\n\nIt follows that\
    \ only Axiom 7 is a single fault diagnosis of KB_faulty in the sense that changing\
    \ Axiom 7 will allow the formulation of a knowledge base such that the positive\
    \ case is consistent and the negative case is inconsistent. If either Axiom 8\
    \ or 9 is subject to a revision, additional axioms must be altered.\n\n# 11.3.2\
    \ Defining Configuration and Diagnosis\n\nThe task of debugging a configuration\
    \ knowledge base is to discover those axioms of KB have to be changed. In particular,\
    \ some of the axioms of a faulty knowledge base must be removed and possibly some\
    \ axioms must be added. This extension is denoted by EX. We call such a revised\
    \ knowledge base the target knowledge base. This target knowledge base has to\
    \ be consistent with all positive test cases and must be inconsistent with all\
    \ negative test cases. We start with the definition of the instances of a configuration\
    \ knowledge base diagnosis problem (CKB-diagnosis problem).\n\nDefinition (Instances\
    \ of a CKB-diagnosis problem). A problem instance ⟨KB, C⁺, C⁻⟩ of a configuration\
    \ knowledge base diagnosis problem is defined by a set of logical sentences KB\
    \ representing the configuration knowledge base, a set of positive test cases\
    \ C⁺, and a set of negative test cases C⁻. The elements of C⁺, C⁻ are logical\
    \ sentences representing test cases.\n\nBased on the instances of a CKB-diagnosis\
    \ problem we define a diagnosis as a subset of the configuration knowledge base:\n\
    \nDefinition (Diagnosis). A set S ⊆ KB is a diagnosis for a CKB-diagnosis problem\
    \ instance ⟨KB, C⁺, C⁻⟩ iff there exists a set of logical sentences EX extending\
    \ KB such that\n\n+   - (KB − S) ∪ EX ∪ {c⁺} consistent ∀c⁺ ∈ C⁺ and\n+   - (KB\
    \ − S) ∪ EX ∪ {c⁻} inconsistent ∀c⁻ ∈ C⁻"
