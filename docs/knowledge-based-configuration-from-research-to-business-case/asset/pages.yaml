- pgno: 205
  md: '# Consumer Decision-Making and Configuration Systems


    # CHAPTER 14


    Monika Mandl*, Alexander Felfernig*, and Erich Teppan†

    *Graz University of Technology, Graz, Austria

    †Alpen Adria Universität Klagenfurt, Klagenfurt, Austria


    Abstract: Configuring complex products and services can be challenging for users.
    Due to the complexity of the underlying decision tasks, decisions are often influenced
    by different types of decision biases. Such biases can move users toward unintended
    results and are often the major reason for suboptimal decisions. In this chapter,
    we provide an overview of different types of decision biases, which can be of
    relevance for tasks related to configuration processes.


    # 14.1 Introduction


    A couple of theories that explain the existence of different types of decision
    biases in consumer decision making can be found in psychological literature. Consumers
    are influenced by the way in which the information is presented and, as a consequence,
    use different decision-making strategies (see, e.g., Asch, 1949; Bettman et al.,
    1991; Tversky and Kahneman, 1981). For example, the results of a study conducted
    by Asch illustrate the importance of an item’s position in a list. The experiment
    demonstrated that when presenting adjectives describing a person in sequence,
    the same words could result in very different ratings of that person depending
    on the order in which the words were presented. This effect is known as primacy
    effect which can also be expected in different orderings of product descriptions
    (Felfernig et al., 2007).


    The results of the research of Mandel and Johnson (1998) indicate that web page
    design can have an impact on users’ perceived importance of product attributes
    and therefore on the final product choice—this is known as priming effect. In
    their study they confronted the participants with a user interface that supported
    the selection of furniture items. One version of the interface had a “money-related”
    background (coins were shown to the user), the other interface had a fleecy cloud
    background. When using the first version of the interface, users chose furniture
    items that were significantly less expensive.


    If the user’s opinion is biased in the preference construction process,¹ this
    can lead to imprecise and erroneous preference information, and as a consequence,
    to less accurate product predictions. Another problem is that decision biases
    can lead to unscrupulous business practices since online retailers could exploit
    these biases to increase sales. This motivates the investigation of decision biases
    in the context


    > ¹In a purchasing process, users typically do not know their preferences beforehand
    but construct their preferences when interacting with the online selling application
    (e.g., with a configurator; Bettman et al., 1998; Mandel and Johnson, 1998).'
  merge: -1
  img_proc: true
- pgno: 206
  md: 'Table 14.1 Selected decision psychological theories related to decision biases.


    | Theory | Explanation |

    |---|---|

    | Decoy effects | Inferior products added to a result set can significantly change
    the outcome of the decision process (Huber et al., 1982; Simonson and Tversky,
    1992; Teppan and Felfernig, 2009b, 2012). |

    | Primacy/recency | Information units at the beginning and the end of a list are
    analyzed and recalled significantly more often than those in the middle of a list;
    this has an impact on a user''s selection behavior (Felfernig et al., 2007; Murphy
    et al., 2006). |

    | Defaults | Preselected decision alternatives have the potential to significantly
    change the outcome of a decision process (Mandl et al., 2011; Samuelson and Zeckhauser,
    1988). |


    of product configuration. An important research area is the development of user
    interfaces that either counteract these biases or exploit the effects in a way
    that improves user experience (Teppan and Felfernig, 2012).


    The major contributions of this chapter are the following. We provide an overview
    of potential decision biases that can occur when interacting with a configuration
    system. With this overview we raise the awareness of the existence of decision
    biases and also encourage researchers from the areas of computer science and decision
    psychology to focus on related research questions.


    In the remainder of this chapter we will summarize selected theories from decision
    psychology with respect to their potential impact on preference construction and
    product (configuration) choice processes—an overview of these theories is given
    in Table 14.1. First, we will present decision effects that are related to the
    inclusion of low-quality items/configurations (decoy items) to result sets (Section
    14.2).² In Section 14.3 we discuss the impact of the ordering of items on item
    selection (primacy/recency effects). Finally, we investigate decision effects
    that are related to the presentation of defaults (Section 14.4; see also Tiihonen
    et al., 2014³). This chapter is concluded with Section 14.5.


    # 14.2 Decoy Effects


    # 14.2.1 Overview


    Decoy items can be, for example, (partial) configurations that are inferior to
    others in a given set. In this context, the inferiority or superiority of products,
    respectively, is measured by simply comparing the underlying properties.⁴ For
    example, in Table 14.3 computer RAM I dominates computer D in the dimensions price
    and capacity since it has both a lower price and a higher memory capacity. The
    inclusion of decoy products (configurations) can significantly influence the outcome
    of the decision process. This effect is known as the decoy effect (Huber et al.,
    1982; Simonson and Tversky, 1992; Teppan and Felfernig, 2009b) and is of special
    relevance in the result presentation phase within a configuration process.


    ²In the configuration context, this is a set of alternative (partial) configurations
    shown to the user.


    ³Chapter 13.


    ⁴Note that we use the computer product domain in the following examples.'
  merge: -1
  img_proc: true
- pgno: 207
  md: '![](img/214a17cc1f5bbf0914497c7414128438_207_0.png)


    # **FIGURE 14.1**


    Different types of decoy items discussed in this chapter.


    In the following subsections we will discuss different types of decoy effects
    (*compromise, asymmetric dominance, and attraction*) and explain how these effects
    can influence the outcome of a decision process. **Figure 14.1** provides an overview
    of the different types of decoy effects discussed in this chapter. Note that the
    computers RAM I and RAM II appear on the Pareto line, which means that they have
    a comparable utility (computer RAM I has a higher capacity whereas RAM II has
    a lower price).


    **Compromise Effects.** Compromise effects denote one specific archetype of decoy
    effects (see **Table 14.2**). Simonson and Tversky (1992) demonstrated that adding
    an extreme alternative to a choice set will result in people favoring the “middle”
    choice where attribute values are positioned between the values of the other alternatives.
    For example, the attractiveness of computer RAM I compared to computer RAM II
    can be increased by adding computer D to the set of alternatives (see **Table
    14.2**). Since RAM I has a significantly lower price and only a marginally lower
    capacity compared to D, computer RAM I is established as a compromise between
    the alternatives RAM II and D.


    **Asymmetric Dominance Effects.** The second archetype of decoy effect is called
    asymmetric dominance (depicted in **Table 14.3**). In this scenario, computer
    RAM I dominates computer D in both attributes (price and capacity), whereas computer
    RAM II dominates D in only one dimension (the price). Therefore, the addition
    of computer D to the set can increase the share of computer RAM I. The underlying
    effect is that users interpret RAM I of being the better choice since it outperforms—in
    contrast to RAM II—D in both dimensions.'
