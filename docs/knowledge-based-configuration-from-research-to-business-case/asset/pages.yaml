    ```\n\n# FIGURE 2.1\n\nA typical rule (paraphrased) in R1/XCON (McDermott, 1982).\
    \ The *condition* part describes the current configuration context (configuration)\
    \ and the *action* part includes actions to extend this configuration.\n\nAlthough\
    \ very successful, R1/XCON had a major drawback: the chosen knowledge representation.\
    \ The rule-based implementation triggered enormous efforts in knowledge base development\
    \ and maintenance (Soloway et al., 1987). An example of a rule defined in the\
    \ R1/XCON system is given in Figure 2.1.\n\nThe main problem of R1/XCON was the\
    \ dependency between domain and problem solving knowledge; that is when domain\
    \ knowledge had to be adapted, this caused changes in the problem solving knowledge\
    \ and vice versa (Bachant and McDermott, 1984; Soloway et al., 1987). In other\
    \ words, the outcome of the configuration process strongly depended on the ordering\
    \ in which different rules were interpreted. To achieve a certain outcome (configuration),\
    \ obscure ‘tricks’ were applied to enforce a certain sequence of rule firing (Soloway\
    \ et al., 1987).\n\nThis unfortunate situation motivated new technological developments\
    \ that can be summarized with the term *model-based knowledge representations.*¹\n\
    \n# 2.2 Early Model-based Configurators\n\nThe major characteristic of model-based\
    \ configuration is a clear separation between domain knowledge and problem solving\
    \ knowledge. In the configuration context, this is realized by a separation of\
    \ product-specific knowledge and knowledge related to configuration search; that\
    \ is finding consistent solutions.\n\nConstraint satisfaction problems (CSPs)\
    \ (see Hotz et al., 2014²) are a widely used model-based knowledge representation\
    \ formalism. Early versions of CSPs were already developed in the late 1970s (Lauriere,\
    \ 1978; Mackworth, 1977). Multidirectionality can be considered the main difference\
    \ between rule-based and constraint-based problem solving.\n\nIn contrast to constraint-based\
    \ representations, rules are based on *if-then structures*, and their interpretation\
    \ presupposes a direction from the condition to the action part. Restrictions\
    \ formulated as constraints make it possible to assign a value to an arbitrary\
    \ variable. A constraint solver can propagate"
