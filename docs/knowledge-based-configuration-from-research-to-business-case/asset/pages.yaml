    # 17.5 Advantages and Requirements of Constraint-Based Configuration


    The advantages of using a constraint-based solver engine for product configuration
    are well known (DeSisto, 1997; Junker, 2006).


    A constraint-based interaction empowers the user to explore the vast space of
    configurations and find the best solution for the customers needs:


    +   - Since many input combinations are invalid, it is important that the end-user
    is able to explore the possibilities by making choices in his/her preferred sequence
    and then view how each choice affects available alternatives for other choices.

    +   - To find the best solution, it is sometimes necessary to make trade-offs
    between conflicting choices. This can be achieved by showing the user which alternatives
    are incompatible with previous choices and automatically inform the user how an
    invalid alternative can be made valid by making trade-offs with previous choices.

    +   - Since customer specifications are typically incomplete, the constraint-solver
    engine should be able to validate incomplete input and find a good solution for
    the unspecified inputs. It should be possible to optimize the solution based on
    any attribute, such as cost or lead-time, or to guide the search with soft preferences.


    Rules maintenance is another important challenge. We use the term rule here to
    denote the real-world dependency between configuration decisions, and constraint
    refers to the encoding of such a rule for processing by a constraint-based engine.
    From a rules maintenance point of view, an advantage of using a constraint-based
    engine is that each constraint is independent and does not assume a sequence of
    rules processing. This means that each configuration rule in the product can be
    encoded independently as a constraint without taking the other rules into account,
    so a rule can be added, revised, or removed without affecting the encoding of
    other rules. This is very important since the rules can usually not be documented
    from the beginning and they frequently change as the configurable product evolves
    over time. The difficulty of documenting all the rules before encoding them in
    a configurator is that it is hard for product experts to articulate all their
    knowledge. During testing and use of the configurator, they therefore realize
    that important rules have been forgotten and need to be added.


    Similarly, configuration rules are often controversial and subject to change by
    design revisions. It is therefore essential that each rule can be encoded independently.
    With a sequential rules engine, such'
  merge: -1
  img_proc: true
- pgno: 239
  md: 'changes to the rules that are relatively small at a conceptual level can require
    large changes in the encoding, due to the sequential dependencies in the encoding.
    This can become prohibitively costly and drastically delay time-to-market.


    In order to achieve these interaction requirements without additional costly and
    delaying rules programming, it is important that the constraint-based engine is
    a powerful constraint-solver, so that the interactivity is achieved automatically
    based on the constraints.


    Beyond the constraint-solver capabilities, configuration of complex industrial
    equipment has the following additional requirements on the constraint-solver,
    and the evaluation by FL Smidth concluded that Tacton Configurator meets these
    requirements.


    Many products are dynamic in nature. The number of component instances may vary
    depending on capacity requirements, and each instance may require individual configuration.
    In a cement plant, typical examples are products where the number of segments
    vary depending on length and height, such as a conveyor. This requires a constraint
    solver with the ability to dynamically generate new variables.


    For complex products, it is not always feasible for the configurator to access
    all relevant data from the beginning of the configuration session, for example
    when the relevant component data depends on capacities and decisions that are
    not known from the beginning. This requires the ability to dynamically access
    more data on demand during the configuration session. Complex product configuration
    often involves sizing calculations. The constraint solver must have the ability
    to apply complex mathematical functions and invoke external calculations at run-time,
    feeding the results into further constraint processing. Configurable products
    may have freely customizable parameters such as dimension and positions, like
    the beams and support points in a conveyor. To handle this well, the configuration
    model must be parametric throughout the product hierarchy, and variables must
    be able to range over large integer or floating point domains.


    The space of potential combinations to consider in a configurable product can
    be greater than the number of atoms in the observable universe. Although the problem
    of finding a solution tends to be manageable in products designed for configuration,
    it can for highly complex products be infeasible to solve in acceptable response
    time with a general purpose algorithm. It is important to also have mechanisms
    to guide the search heuristically in terms of the sequence of decisions without
    redundant encoding of constraints.


    # 17.6 Implementing Tacton Configurator at FL Smidth


    # 17.6.1 Configuration Modeling


