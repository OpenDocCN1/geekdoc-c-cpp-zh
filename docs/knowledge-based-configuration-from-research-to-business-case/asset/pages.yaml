    # FIGURE 22.1


    System architecture of S''UPREME.


    a type and aggregation hierarchy, their attributes and constraints (constraints
    represent propositions on which configurations are valid and complete, and which
    are not). The tool S''UPREME Studio helps the knowledge engineer to define the
    knowledge base. The resulting application is coded in Java, a big part of the
    code being generated by S''UPREME Studio.


    S''UPREME provides a standard frame-based GUI, but usually an application-specific
    GUI is designed and programmed for each new configurator. Customer-specific input
    and output interfaces usually must be implemented as well. For persisting configurations,
    S''UPREME has connectors to SQL databases, object-oriented databases, and XML
    files.


    The main and outstanding technological concept of S''UPREME is Generative Constraint
    Satisfaction (GCSP). GCSP is an extension of classical CSP designed to cope with
    dynamic aspects arising in many technical application domains, like configuration,
    design, or planning. Classical CSP represents a problem by a fixed set of variables,
    their domains, and constraints. A solution is a variable assignment where no constraint
    is violated. But this static set of variables is usually not appropriate if the
    number of components in a solution is not known at modeling time.


    The most prominent extensions of the classical CSP schema toward a more dynamic
    view are Conditional CSP (Gottlob et al., 2007; Mittal and Falkerhainer, 1990),
    Dynamic CSP (Dechter and Dechter, 1998), and as used in S''UPREME, Generative
    CSP (Felfernig et al., 2003; Fleischanderl et al., 1998).


    GCSP was designed for representing and solving large-scale complex configuration
    problems and is therefore a powerful and highly expressive framework. Besides
    constraint satisfaction, the main background of GCSP is the object-oriented paradigm
    with its clean separation of the problem model and the problem instance. This
    allows for a natural and maintainable formulation of the problem structure, a
    declarative formulation of the problem logics, and a clean handling of the dynamicity
    inherent in many configuration problems.'
