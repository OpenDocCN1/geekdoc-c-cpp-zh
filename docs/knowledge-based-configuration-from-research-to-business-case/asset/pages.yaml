  md: 'Finally, tuning the performance of solution search is typically done with basic
    strategies of *variable and value orderings* (Russel and Norvig, 2003), with advanced
    approaches such as *symmetry breaking* (Kiziltan and Hnich, 2001) and *machine
    learning based acquisition of search strategies* (Terashima–Marin et al., 2008),
    with *local search algorithms* (Leit et al., 2006), and different techniques of
    knowledge compilation such as *binary decision diagrams* (BDDs; Andersen et al.,
    2010) and *solution automata* (Amilhastre et al., 2002). For further literature
    on related algorithms and optimization approaches we refer to Brailsford et al.
    (1999); Rossi et al. (2006); Russel and Norvig (2003), and Tsang (1993).


    # Excursus: SAT Problems


    For a given propositional formula, the goal of SAT solving (see, e.g., Claessen
    et al., 2008) is the determination of a variable assignment such that the formula
    evaluates to *true*. A propositional logic formula is in a *conjunctive normal
    form* (CNF) when it is represented in the form of *conjunctions of disjunctions
    of literals*. For a Boolean variable X, a literal is defined as X or its negation
    ¬X. Each of the disjunctions is denoted as a *clause*. A SAT problem (satisfiability
    problem) is to identify an assignment to the given Boolean variables in such a
    way that the mentioned formula in CNF evaluates to *true*. This is the case if
    each clause has at least one literal that evaluates to *true*. For a more detailed
    discussion of SAT solving and related algorithms, refer to Claessen et al. (2008).
    An example of the translation of a given static CSP into a corresponding SAT representation
    follows.


    *Example: SAT encoding of a static CSP.* In order to show the basic principle
    of how to translate a static CSP into a corresponding SAT representation, we take
    the variables wA and nT from our working example (map coloring). In a static CSP
    representation the variable domains can be specified as dom(wA) = {r,g,b} and
    dom(nT) = {r,g,b}. In the corresponding SAT representation we have to introduce
    Boolean variables where each domain value of the original variables is represented
    by its own (Boolean) variable. In our example this translation results in the
    variables wA,r, wA,g, wA,b, nT,r, nT,g, and nT,b. Each of these variables has
    the domain {true, false} ({1,0}). The translation of the constraint wA ≠ nT into
    a clausal form could look like: (¬wA,r = 1 ∨ ¬nT,r = 1) ∧ (¬wA,g = 1 ∨ ¬nT,g =
    1) ∧ (¬wA,b = 1 ∨ ¬nT,b = 1) ∧ (¬wA,r = 0 ∨ ¬wA,g = 0 ∨ ¬wA,b = 0) ∧ (¬nT,r =
    0 ∨ ¬nT,g = 0 ∨ ¬nT,b = 0). With this, we assure that (1) the two territories
    do not have the same color and (2) both territories have a color assigned.


    As can easily be seen, our Mobile Phone configuration model can directly be translated
    into a corresponding SAT representation, since the variable domains in the CSP
    are already of type Boolean. For further related work refer to Janota (2008) and
    Janota et al. (2010).


    # 6.2.2 Advanced CSP Approaches


    On the basis of the static CSP approach, numerous extensions have been implemented
    in order to improve the expressiveness and the efficiency of the underlying reasoning
    algorithms. An in-depth analysis of existing CSP variants is beyond the scope
    of this book; however, we will now discuss some representative ones that have
    found their way into commercial configuration environments.


