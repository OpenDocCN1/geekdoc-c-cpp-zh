    # Description Logics


    Description Logics (DL; Baader et al., 2003) is a popular knowledge representation
    formalism in the context of the Semantic Web. DL can be used for configuration
    knowledge representation, especially for the design of component type hierarchies
    (ontologies) and for coherence analysis. A Description Logic knowledge base consists
    of two major elements: the TBox introduces concepts, relationships, and constraints
    of the (product) domain, the ABox contains assertions about individuals. Thus,
    the TBox can be used to represent the configuration model and the ABox the resulting
    configuration. Description Logics have been successfully applied for the development
    of configuration systems—for a detailed related discussion refer to Hotz et al.
    (2006) and McGuinness and Wright (1998). Felfernig et al. (2003) have analyzed
    the applicability of Description Logics for the representation of configuration
    knowledge. DL can be used to represent configuration knowledge, however, some
    specific constraint types are supported in a restricted fashion. For example,
    no aggregation functions are provided and constraints on complex connection structures
    (via ports) cannot be defined due to the lower (but decidable) expressiveness
    of many DL dialects. Furthermore, because there is no standard inference method
    that provides automatic instantiation, the DL-Reasoner has to be included in an
    architecture that creates individuals from outside. This is needed because of
    the incremental aspects of configuration processes (see Buchheit et al., 1995;
    Hotz and Neumann, 2005; Stumpfner, 1997). Beside this analysis, Felfernig et al.
    (2003) also introduce a formal definition of a configuration problem and its solution
    in Description Logic and show the equivalence of this definition with a predicate
    logic-based definition.


    # Hybrid Configuration


    Hybrid configuration exploits several representation and reasoning mechanisms
    (Stumpfner, 1997). Typically, there is an ontology-like (DL-based) representation
    (Baader et al., 2003) for representing components, their compositional relations,
    and attributes. Additionally, constraints are used for representing n-ary relations
    between components and for computing and inferring attribute values. The configuration
    process combines the related inference mechanisms, ontology inference services,
    and constraint propagation in a cyclic manner. Additionally, procedural knowledge
    (Hotz et al., 2006; McDermott, 1982) can be used for describing the order of configuration
    steps of the configuration'
