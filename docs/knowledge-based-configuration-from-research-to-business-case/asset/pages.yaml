    # 12.6 Conclusion


    Intelligent support of redundancy detection is a building block of intuitive knowledge
    engineering support. In this chapter we have discussed two algorithms that can
    be applied for the identification of minimal cores (i.e., minimal sets of constraints
    that preserve the semantics of the original knowledge base). The SEQUENTIAL algorithm
    can be applied in settings where the number of redundant constraints in the knowledge
    base is low. The second algorithm (CORE DIAG) is more efficient but restricted
    in its application to knowledge bases that contain a large number of redundant
    constraints. For an in-depth analysis of theoretical issues related to the identification
    of redundancies refer to Liberatore (2005, 2008a,b).


