  md: '# S’UPREME


    Alois Haselböck and Gottfried Schenner

    Siemens AG, Vienna, Austria


    Abstract: S’UPREME is an in-house configuration system of Siemens AG for the configuration
    of complex large-scale technical systems, for instance railway safety systems
    or industrial production systems (see also Chapter 16). This chapter gives a brief
    overview of the technological background and modeling expressiveness of S’UPREME.


    # 22.1 Introduction


    This chapter describes S’UPREME, an in-house configuration framework of Siemens.
    The technological basis of S’UPREME is an object-oriented extension of a constraint
    programming system, known as Generative Constraint Satisfaction (see also Hotz
    et al., 2014¹). It is now in productive use since around 2002, mainly in the fields
    of large-scale industrial production, telecommunication, and railroad equipment
    and safety systems.


    The remainder of this chapter is organized as follows: Section 22.2 gives an overview
    of the architecture of the framework. Section 22.3 describes the typical steps
    required to define a new S’UPREME based configurator. Finally Section 22.4 provides
    some closing remarks.


    # 22.2 System Architecture and Technological Background


    S’UPREME is a domain-independent configuration framework providing general configuration
    capabilities. Figure 22.1 sketches the main components of S’UPREME’s architecture.
    The core of S’UPREME consists of a knowledge base meta-structure (for specifying
    components, properties, and constraints of a concrete configuration domain) and
    a solving engine.


    Several built-in solvers are provided: Consistency algorithms can check configurations,
    propagate user inputs and filter configuration options; a repair-based heuristic
    search algorithm and a backtracking algorithm can complete partial configurations.


    Apart from these built-in solvers, the design of S’UPREME allows integration of
    external solvers like MILP (mixed integer linear programming) or SAT solvers (satisfiability
    of propositional formulas; see Falkner et al., 2010).


    For a concrete configuration domain, a configurator architect designs the engineering
    process and models the knowledge base structure. The knowledge base consists of
    component types, organized in


    ¹Chapter 6.'
