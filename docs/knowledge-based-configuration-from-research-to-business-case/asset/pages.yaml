    # Generative Constraint Satisfaction


    Major drawbacks of static (and dynamic) CSPs include representational limits in
    terms of dealing with variables and variable values instead of component types
    and corresponding components (instances). Another disadvantage is that static
    CSPs are limited with regard to the description of configuration problems in which
    the size and structure of configurations cannot be estimated beforehand. Generative
    constraint satisfaction (GCSP) helps to overcome these problems by moving variables
    and corresponding constraints to the level of component types and meta-constraints
    (generic constraints). Generic constraints (constraint schemata) help to identify
    and generate relevant additional components and variables that are relevant in
    the current configuration context.


    Constraints are referred to as “generic” since they apply individually to all
    components of the types on which the constraints are defined. For example, a constraint
    preventing a particular type of CPU from being placed on a particular type of
    Motherboard applies to all CPUs of that type although it is only defined in the
    knowledge base once. Components in GCSP settings are represented in terms of a
    finite domain variable (the domain of the variable corresponds to the different
    types a component can take). Activation constraints are used, for example, to
    generate new property variables based on the assignment of a type to a component
    variable. A *Generative Constraint Satisfaction Problem* (GCSP) can be defined
    as follows (Stumptner et al., 1998).


