- pgno: 353
  md: 'A standalone modeling environment was implemented also in PROLOG on OS/2. This
    allowed defining classes with characteristics (influenced by FRESKO; Cunis, 1992).
    A class could have multiple superclasses. Materials, which needed to correspond
    to materials in the host R/2 system, were assigned to classes and inherited characteristics,
    value domains, and defaults from these. Inheritance was monotonic, except for
    defaults. Touretzky’s concept of minimal inferential distance was used to control
    default inheritance (Touretzky, 1986). The partonomy was BoM-like and represented
    sales BoMs. A syntax was defined for maintaining the different forms of dependencies:
    *selection conditions*, *preconditions*, *procedures*, *balances*, and *constraints*.
    The syntax of the SAP ABAP programming language may have had an influence on the
    style of the dependency syntax with the addition of a smattering of LISP taken
    from the PLAKON constraint syntax (see Figure 27.3). An early manual mentions
    control knowledge similar to that in TEX-K, but there was never a way to maintain
    this.


    Constraint processing was based on the μPLAKON architecture. The three modules
    DDB, PMS, and TMS were implemented in PROLOG. A simpler handling of defaults than
    that of the ATMS* was implemented in the DDB. The basic distinction between inconsistency
    (something decided on needs to be revised) and incompleteness (might be fixed
    by adding something) was made. If a constraint was violated this was an inconsistency.
    Constraints were permanently active in the configuration, so the user was immediately
    alerted to an inconsistency. Completeness checks (including the calculation of
    the balances) were performed only on user demand. The other dependencies were
    executed either on demand, or automatically linked to certain events in the UI.


    Every configuration had one unique root instance. All other components had a unique
    parent instance in the configuration. Thus the set of object instances in the
    configuration was always a tree linked in a BoM structure. There were three types
    of characteristics: single-valued characteristics that can be assigned a value
    in the configuration; multivalued characteristics that can be assigned more than
    one value; and restrictable characteristics. The latter behave like single-valued
    characteristics, but are assigned domain restrictions in the configuration. A
    singleton restriction was taken as being equivalent to a value assignment. A restriction
    to the empty domain was an inconsistency. All characteristics could be declared
    *required* or *optional*. The configuration was not complete if a required characteristic
    had not been assigned a value.


    Except for singleton domains (equivalent to assigning values) the user was not
    able to formulate domain restrictions. This simplified the configuration logic
    and the UI, particularly with respect to taking user decisions back. The possible
    interactive configuration decisions a user could make were to


    +   - Assign a characteristic value (or take an assignment back)

    +   - Manually select a component from the BoM, causing an instance to be instantiated
    (or delete an instance from the configuration)

    +   - Specialize the type of an instance; for example, decide that an instance
    of the class personal computer actually is an instance of the class laptop (or
    take a specialization of an instance back)


    It was possible to search variants by their characteristic values. This was implemented
    as a *fuzzy search*, to ease finding similar variants. A facility for generating
    explanations was implemented, as'
