  img_proc: true
- pgno: 266
  md: 'engines, can be used in the configuration task to search for valid configurations.
    Researchers and practitioners in the realm of product configuration are typically
    adopting feature models (Asikainen et al., 2007; Benavides et al., 2010), component
    connection models (Asikainen et al., 2007; van Ommering et al., 2000), decision
    models (Dhungana et al., 2011), or other approaches (Pohl et al., 2005; van der
    Linden et al., 2007) to define variability. Many methods and tools for configuration
    in SPLE are similar to those in the knowledge-based configuration community (Soininen
    et al., 1998; Stumpfner, 1997); also see Hotz et al. (2014a).


    Model-based product configuration involves three main activities: (1) the definition
    of variability models, (2) the actual configuration task of producing a description
    for a valid configuration, and (3) the generation of product artifacts on the
    basis of the produced configuration description. Variability modeling for product
    configuration is demanding and costly as all possible variations need to be captured.
    The modeling method and tool support are often tightly connected as the semantics
    of the modeling concepts heavily reflect the possible tool support. During configuration,
    configurers select from the available variability, for example, by choosing features
    (see Hotz et al., 2014b³). They rely on tool support for finding an appropriate
    configuration (see Leitner et al., 2014⁴). The output of the configuration task
    is a configuration description that includes a list of the selected features.
    Generation then uses the configuration description for creating the actual product
    and related artifacts for the particular configuration. Generation can be separated
    from the configuration task. For example, in the knowledge-based community, where
    the configured artifacts typically are manufactured products, manufacturing is
    inherently a separate activity from configuration. However, in SPLE artifact creation
    can often be done with the same machinery as the configuration task, such as,
    a computer, improving the potential for integration of configuration and generation
    tasks.


    In the following, we first provide an outline of defining a model-based product
    line for supporting configuration and generation of arbitrary artifacts in SPLE
    and then present an industrial case example on supporting the generation of user
    documentation in an automation software product line. We discuss how document
    variability can be modeled; we present tool extensions for managing and configuring
    documents in a software product line; and we show how configuring and generating
    documents is supported in our industrial example.


    # 20.2 Defining Model-Based Product Lines


    Several tasks are performed in SPLE when defining a model-based product line for
    supporting the configuration and generation of arbitrary artifacts.


    # Analyzing variability in artifacts.


    An industrial product line rarely starts from scratch. Product line experts familiar
    with a system’s variability thus typically first examine existing artifacts such
    as user manuals or code. The analysis shows what can vary (the variation points)
    and how it can vary (the variants). It is challenging to find the right level
    of detail and granularity that is needed to distinguish products. Workshops conducted
    with domain experts from product management, sales, and development help to ensure
    focus.'
