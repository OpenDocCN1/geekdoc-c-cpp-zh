    preferences, ultimately leading to a refined solution space. A company could,
    for instance, eliminate options that are rarely explored or selected, and it could
    add more choices for the popular components. In addition, customer feedback can
    even be used to improve the very algorithms that a particular application deploys.


    # 9.2.3 Modular Product Architectures


    Once the relevant options to be represented in a solution space have been identified,
    these have to be transferred into a product architecture that includes the configuration
    model (Felfernig, 2007). It is important to note that mass customization does
    not mean to offer limitless choice, but to offer choice that is restricted to
    options that are already represented in the production system. In the case of
    digital goods (or components), customization possibilities may be infinite. In
    the case of physical goods, however, they are limited and may be represented by
    a modular product architecture. Modularity is an important part of many mass customization
    strategies (Duray, 2002; Gilmore and Pine, 1997; Kumar, 2005; Piller, 2005; Salvador,
    2007). Each module provides one or more well-defined functions of the product
    and is available in several options that deliver a different performance level
    for the function(s) the product is intended to serve.


    In order to manage the additional costs of variety, product families of similar
    or identical units can be formed. The product family approach has been recognized
    as an effective means to accommodate an increasing product variety across diverse
    market niches while still being able to achieve economies of scale (Tseng and
    Jiao, 2001; Zhang and Tseng, 2007). In addition to leveraging the costs of delivering
    variety, product family design can reduce development risks by reusing proven
    elements in a firm’s activities and offerings. Setting the modular product family
    structure of a mass customization system, and thus its solution space, becomes
    one of the foremost competitive capabilities of a mass customization company.'
  merge: -1
  img_proc: true
- pgno: 136
  md: '# 9.3 Robust Process Design


    A core idea of mass customization is to ensure that an increased variability in
    customers’ requirements will not significantly impair the firm’s operations and
    supply chain (Pine et al., 1993). This can be achieved through robust process
    design, which is the capability to reuse or recombine existing organizational
    and value-chain resources to deliver customized solutions with high efficiency
    and reliability. A successful mass customization system hence is characterized
    by stable, but still flexible, responsive processes that provide a dynamic flow
    of products (Badurdeen and Masel, 2007; Pine, 1995; Salvador et al., 2004; Tu
    et al., 2001). Value creation within robust processes is the major differentiation
    of mass customization versus conventional (craft) customization. Traditional (craft)
    customizers often reinvent not only their products, but also their processes for
    each individual customer. Mass customizers use stable processes to deliver high-variety
    goods (Pine et al., 1993), which allows them to achieve near mass production efficiency,
    but it also implies that the customization options are somehow limited. Customers
    are being served within a list of predefined options or components, the company’s
    solution space.


    The core objective of robust process design is to prevent or counterbalance the
    additional cost resulting from the flexibility a company needs to build in order
    to serve its customers individually. We can differentiate two sources of additional
    cost of flexibility (Su et al., 2005): (1) increased complexity and (2) increased
    uncertainty in business operations, which by implication results in higher operational
    cost.


    Methods to establish robust processes. A primary mechanism to create robust processes
    in mass customization is the application of delayed product differentiation (postponement).
    Delayed product differentiation refers to partitioning the supply chain into two
    stages (Yang and Burns, 2003; Yang et al., 2004). A standardized portion of the
    product is produced during the first stage, while the differentiated portion of
    the product is produced in the second stage, based on customer preferences that
    were expressed in an order. The success of delayed product differentiation is
    a direct manifestation of the fact that most companies offer a portfolio of products
    that consists of families of closely related products that differ from each other
    in a limited number of differentiated features. An example of delayed product
    differentiation in the automotive industry would be to send a standard version
    of the car (a stripped or partially equipped version) to dealers and then allow
    the dealer to install, on the basis of customer-specific requests, options such
    as a CD/DVD player, the interior leather or fabric, and the cruise control system.
    Prior to the point of differentiation, product parts are reengineered in such
    a way that as many parts or components as possible are common to each configuration.
    Cost savings result from the risk-pooling effect and reduction in inventory stocking
    costs (Yang et al., 2004).


    While postponement starts with the design of the offerings, another possibility
    to achieve robust processes is through flexible automation (Koste et al., 2004;
    Tu et al., 2001; Zhang et al., 2003). Although the words “flexible” and “automation”
    might have been contradictory in the past, that’s no longer the case. In the automotive
    industry, robots and automation are compatible with high levels of versatility
    and customization. Even process industries (e.g., pharmaceuticals, food, and so
    on), once synonymous with rigid automation and large batches, nowadays enjoy levels
    of flexibility once considered unattainable. Similarly, many intangible goods
    and services also lend themselves to flexible automated solutions, oftentimes
    based on the Internet.


    A complementary approach to flexible automation is process modularity, which can
    be achieved by thinking of operational and value-chain processes as segments,
    each one linked to a specific source'
  merge: -1
  img_proc: true
- pgno: 137
  md: 'of variability in the customers’ needs (Pine et al., 1993). As such, the company
    can serve different customer requirements by appropriately recombining the process
    segments, without the need to create costly ad-hoc modules (Zhang et al., 2003).
    BMW’s Mini factory, for instance, relies on individual mobile production cells
    with standardized robotic units. BMW can integrate the cells into an existing
    system in the plant within a few days, thus enabling the company to quickly adapt
    to unexpected swings in customer preferences without extensive modifications of
    its production areas.


    # 9.4 Choice Navigation


    # 9.4.1 Paradox of Choice


    A mass customizer must support customers in identifying their own needs and creating
    solutions while minimizing complexity and the burden of choice. When a customer
    is exposed to a myriad of choices, the cost of evaluating those options can easily
    outweigh the additional benefit from having so many alternatives. The resulting
    syndrome has been called the “paradox of choice” (Schwartz, 2004), in which too
    many options can actually reduce customer value instead of increasing it (Desmeules,
    2002; Huffman and Kahn, 1998). In such situations, customers might postpone their
    buying decisions and, worse, classify the vendor as difficult and undesirable.
    Research in marketing has addressed this issue in more detail and has found that
    the perceived cognitive cost is one of the largest hurdles toward a larger adaption
    of mass customization from the consumer perspective (Dellaert and Stremersch,
    2005). To avoid that, companies have to provide means of choice navigation to
    simplify the ways in which people explore their offerings.


    # 9.4.2 Effective Support of Interaction


    When looking at the interaction patterns offered by configurators it becomes obvious
    that the different types with their different goals and solution spaces must have
    specific characteristics in defining the way the interface to the customer has
    to look like (see also Leitner et al., 2014²). The range of product configurators
    spans from simple Select-to-order (STO) and Pick-to-order (PTO) configurators,
    to currently massive growing Assemble-to-order (ATO) and Configure-to-order (CTO)
    configuration systems, up to sophisticated Make-to-order (MTO) and high-end Engineer-to-order
    (ETO) solutions that bridge the field of product configurators with the field
    of user innovation configurators (see Table 9.2).


    The more complex the purpose of a configuration system is, the lower is the similarity
    between individual systems. Nevertheless a number of findings shed light on recurring
    patterns, which are the basis for more general interaction rules. It seems to
    be clear that the success of a configuration system is not only defined by its
    technological capabilities but by many more factors such as its ability to allow
    learning by doing, to add experience effects, and to initiate process satisfaction
    (Franke and Piller, 2003).


    As almost any interaction throughout the customer buying cycle might take place
    via online channels, it is important to see the information delivery aspects that
    play an enabling and an accompanying role to the configuration process itself.
    According to Totz and Riemer (2001), information has to be communicated in a clear
    and sufficient way to eliminate uncertainties when configuring products.'
  merge: -1
  img_proc: true
- pgno: 138
  md: '| Type | Description | Complexity |

    |---|---|---|

    | Table 9.2 Types of product configurators. |  |  |

    | Select-to-order (STO) | The customer selects all needed components of a product.
    There are no component dependencies. | low |

    | Pick-to-order (PTO) | The customer picks the components of a product and takes
    care himself of the dependencies without support of the configurator. | low |

    | Assemble-to-order (ATO) | The configurator matches prefabricated components
    considering component dependencies. | medium |

    | Configure-to-order (CTO) | The configurator supports the customer in selecting
    the components that fit to each other based on a modular system. | medium |

    | Make-to-order (MTO) | The configurator allows the customer to define specific
    parameters based on product rules. Manufacturing takes place after order. | medium–high
    |

    | Engineer-to-order (ETO) | Very high level of configuration freedom. New components
    and new rules might be required to satisfy the configuration needs of the customer.
    | high |


    Information on available products and services and the configuration possibilities
    has to be provided. The user has to be informed about prices, delivery, and after-sales
    conditions. The producer has to provide information on the company’s capabilities
    as well as a brand and shopping experience. Furthermore the proposition of the
    most suitable products and services can be helpful to reduce uncertainties.


    What makes information delivery tricky is that there are different ways to represent
    a product to the customer. Salvador and Forza (2007) point out that descriptions
    of the same product may focus on different degrees of abstraction, like focusing
    on the product performance, on the product functions, or on the physical product
    components. Increasing the ability of the customer to understand the offerings
    by using an approach, a language, and tone that is fitting his/her cognitive expectations
    results in the reduction of the configuration complexity; also diminishing the
    overall information load for the customer should be part of this simplification
    strategy. Rogoll and Piller (2004) state that usability is directly responsible
    for the success or failure of a configuration system. Important usability aspects
    are operability and self explanation (i.e., intuitive handling and navigation),
    orientation (i.e., transparency and traceability of the application structure),
    individual access on information (i.e., information has to be accessible in different
    ways such as textual, visual, alphabetical, etc.), loading time (i.e., the application
    must not take too long for loading or actualizing each configuration step), and
    support (i.e., the support functionality has to be able to deal with potential
    problems occurring in the configuration process).


    Besides these usability aspects there are additional parameters that strongly
    influence the perceived quality of a product configuration system: visual realism
    (i.e., how realistic is the visualization of the product configuration process),
    creativity (i.e., the degree and limitations of creational freedom while configuring
    the product), enjoyment (i.e., how much fun, delight, pleasure, entertaining and
    interesting the configuration process is), choice options (i.e., the perceived
    degree of given choice options in the solution space; Walcher and Piller, 2012).
    Convincing the customer to purchase under uncertainty and meeting the specific
    needs of each customer well enough remains the quest to be mastered.'
