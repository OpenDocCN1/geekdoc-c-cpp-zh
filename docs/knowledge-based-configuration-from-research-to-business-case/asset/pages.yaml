  md: 'enhancement modules of KONWERK. Section 24.4 provides insights in the implementation
    of the tool. Section 24.5 sketches some configurators built with the tool.


    # 24.2 Modeling of the Working Example


    In KONWERK, a configuration model consists of concepts and constraints. It represents
    the configuration knowledge in a component-oriented manner. An ontology-like representation
    enables the definition of concepts and relations such as parameters, taxonomical,
    and structural relations. Parameters depict relations between a concept and primitive
    data types such as numbers, strings, intervals, or sets of those data types. A
    taxonomical relation depicts a subset relation between two concepts. Structural
    relations are relations between concepts (in GCSP called connections and in Description
    Logics roles). An example of a structural relation is the compositional relation
    (such as hasParts). Constraint representations augment this ontological knowledge
    for defining n-ary relations and algebraic expressions. Especially the strong
    integration of concepts and constraints enables a combined use of Description
    Logic services (Baader et al., 2003) and constraint-based reasoning (Mackworth,
    1977; Rossi et al., 2006; Tsang, 1993); see also Hotz et al. (2014b)5.


    In addition to the ontological and constraint knowledge, procedural knowledge
    can be used for representing the course of configuration actions that has to be
    processed during the configuration process. Starting from a task description that
    represents the requirements that a resulting configuration should fulfill, procedural
    knowledge enables a declarative representation for ordering configuration activities,
    combining inference methods, as well as integrating external mechanisms such as
    simulating the configured system and compiling previously configured software
    components. The integration of procedural knowledge within a well-defined general
    configuration process enables the control of the used reasoning techniques, even
    in conflicting situations (Günter and Hotz, 1995; Hotz et al., 2006).


    A configuration model in KONWERK contains concepts (CO), conceptual constraints
    (CC), constraint relations (CR), and procedural knowledge (PK).


    Concepts. A concept c ∈ CO represents a component type of an application domain.
    A concept stands for a set of concept instances created during the configuration
    process. A concept instance represents a component of an application domain. Each
    c has an assigned set of properties P = {p1, …, pm} representing attributes of
    a component type. Properties related to primitive data types are called parameters,
    those related to concepts are called structural relations.


    An example of a concept used for the PC-domain (see Hotz et al., 2014b6) represented
    in the Component Description Language of KONWERK (Hotz, 2009) is:7


    ```

    (define-concept :name PC

    :super-concept Domain-Object

    :parameters ((usage {internet scientific multimedia})

    (efficiency {A B C})

    (price [0 inf]))

    ```


    4 See Hotz et al. (2014b, Chapter 6) for a detailed discussion of alternative
    configuration knowledge representations.


    5 Chapter 6.


    6 Chapter 6.


    7 *;* denote comments.'
