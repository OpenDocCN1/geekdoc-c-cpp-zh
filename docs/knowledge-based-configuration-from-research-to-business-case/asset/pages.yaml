  md: "operations. The remainder of this chapter is organized as follows. In Section\
    \ 7.2, we introduce the working example used in this chapter, a simplified version\
    \ of the example configuration knowledge base introduced in Hotz et al. (2014).³\
    \ We discuss selected conflict detection algorithms in Section 7.3 and the corresponding\
    \ diagnosis algorithms in Section 7.4. On the basis of the results of a performance\
    \ analysis, we discuss the advantages and disadvantages of the presented conflict\
    \ detection and diagnosis algorithms. Section 7.5 concludes this chapter.\n\n\
    # 7.2 Example\n\nWe introduce a working example that is based on the configuration\
    \ knowledge base introduced in Hotz et al. (2014). For the following discussions\
    \ we introduce the configuration knowledge base (C_KB) of a fragment of a personal\
    \ computer (PC), which consists of the component types MB (motherboard) and CPU\
    \ (central processing unit) and their specific subtypes {MBSilver, MBDiamond}\
    \ and {CPUS, CPUD}.\n\nThe following personal computer (PC) configuration knowledge\
    \ base (configuration model) is inconsistent, meaning that it does not allow the\
    \ calculation of a solution (configuration). Such situations often occur as a\
    \ result of maintenance operations in a knowledge base where, for example, conflicts\
    \ are introduced due to the insertion of new elements or due to the adaptation\
    \ of existing ones. In our working example we assume that constraint c2 (CPUS\
    \ requires MBSilver) has been added by the knowledge engineer in order to replace\
    \ the faulty constraint c1 (CPUS requires MBDiamond). Unfortunately, the knowledge\
    \ engineer inserted c2 without deleting c1. Our example also assumes that a constraint\
    \ c5 (instances of the component type CPUD should not be part of any configuration)\
    \ was introduced earlier for testing purpose with no intent to have it pertaining\
    \ to the configuration model. However the knowledge engineer forgot to disable\
    \ it after testing the model. Constraint c3 states that an MBSilver must not be\
    \ combined with a CPUD and constraint c4 states that an MBDiamond must not be\
    \ combined with a CPUS.\n\n```\nC_KB = {\n  c_α : ∀X : MB(X) → ∃!Y : cpu-of-mb(Y,\
    \ X).\n  c_β : ∀X : CPU(X) → ∃!Y : mb-of-cpu(Y, X).\n  c_γ : ∀X : MB(X) ↔ MBSilver(X)\
    \ ∨ MBDiamond(X).\n  c_δ : ∀X : ¬MBSilver(X) ∨ ¬MBDiamond(X).\n  c_ε : ∀X : CPU(X)\
    \ ↔ CPUD(X) ∨ CPUS(X).\n  c_φ : ∀X, Y : cpu-of-mb(X,Y) ↔ mb-of-cpu(Y,X).\n  c_ι\
    \ : ∀X : ¬CPUD(X) ∨ ¬CPUS(X).\n\n  c1 : ∀X, Y : cpu-of-mb(Y, X) ∧ CPUS(Y) → MBDiamond(X).\n\
    \  c2 : ∀X, Y : cpu-of-mb(Y, X) ∧ CPUS(Y) → MBSilver(X).\n  c3 : ∀X, Y : cpu-of-mb(Y,\
    \ X) ∧ CPUD(Y) ∧ MBSilver(X) → false.\n  c4 : ∀X, Y : cpu-of-mb(Y, X) ∧ CPUS(Y)\
    \ ∧ MBDiamond(X) → false.\n  c5 : ∀X : CPUD(X) → false.\n}\n```"
