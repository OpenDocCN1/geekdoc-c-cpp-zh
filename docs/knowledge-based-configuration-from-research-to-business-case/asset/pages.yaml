- pgno: 106
  md: 'those paths of the HSDAG which do not include the corresponding elements. In
    our working example (see Figure 7.5) there is no possibility to reuse a conflict
    set due to the fact that there is only one path to the leaf node of the HSDAG.


    A second possibility to improve the performance of diagnosis search is to close
    specific paths in the tree that have already been expanded in other parts of the
    tree. In our working example (see Figure 7.3), the path {c1} directly leads to
    a diagnosis. For this reason it does not make sense to further expand other paths
    that include c1. We can also take into account situations where two paths contain
    the same set of elements. In such a situation, one of these paths can be closed
    (i.e., does not have to be expanded further).


    # 7.4.2 FastDiag


    There are many situations where not all the existing diagnoses are of relevance
    to the user. For example, when interacting with a configurator, the user is not
    interested in having to handle a possibly huge number of alternative diagnoses.
    There is a need for algorithms that are able to determine so-called leading diagnoses
    quickly, which can then be analyzed and evaluated by the user. Since in many cases
    not all possible diagnoses can be determined (for performance reasons), diagnoses
    assumed to be relevant for the user are determined first—these diagnoses are denoted
    as leading diagnoses. FASTDIAG is an algorithm that efficiently determines leading
    diagnoses without the additional overhead of determining conflict sets. It is
    easy to implement (no conflict detection and HSDAG algorithm are needed for determining
    one diagnosis) and is specifically useful in interactive configuration settings,
    for example, to support the user in situations where no solution can be found
    (Felfernig et al., 2012).


    In the line of QUICKXPLAIN, FASTDIAG heavily relies on the concept of divide and
    conquer. Assuming that the set AC is inconsistent, the major idea is to divide
    the set of constraints C into two different subsets C1 and C2. If, for example,
    AC − C1 is consistent, we already know that the set C1 includes a diagnosis and,
    as a consequence, there is no need to further analyze C2 with regard to further
    diagnosis elements. A major advantage of FASTDIAG is that it is based on conflict-independent
    search strategies (i.e., no conflicts are needed for determining a diagnosis).
    FASTDIAG determines exactly one diagnosis at a time (if one exists). If we are
    interested in all diagnoses for a given set of constraints AC, we have to combine
    FASTDIAG with a corresponding HSDAG algorithm (see the example in Figure 7.5).


    How FASTDIAG determines minimal diagnoses can best be explained using our working
    example (see Table 7.4). The activation hierarchy for the FASTDIAG function is
    depicted in Figure 7.6. The algorithm checks whether the deletion of constraints
    (from AC) makes the remaining constraints consistent. For example, if we delete
    C2 from AC in step 1 (Table 7.4) we are able to restore the consistency. At the
    same time we also know that there must be a diagnosis in C2 since its deletion
    from AC contributed to the restoration of consistency. Furthermore, there is no
    need to search for a diagnosis in C1.


    Algorithm Analysis. When comparing the performance of HSDAG with FASTDIAG we can
    see that FASTDIAG has the potential the reduce the number of needed consistency
    checks especially in scenarios where there is a need for identifying so-called
    leading diagnoses (i.e., not the complete set of diagnoses). In the worst case,
    FASTDIAG needs 2d × log2(n/d) + 2d where d is the set size of the minimal diagnosis
    and n is the number of constraints in C (Junker, 2004). The best case complexity
    with regard to the number of consistency checks is log2(n/d) + 2d.


    The efficiency of FASTDIAG can best be documented by the fact that the number
    of consistency checks needed for determining one diagnosis is similar to the number
    of consistency checks needed by QUICKXPLAIN to determine exactly one conflict
    set. Typically, there is more than one conflict set in an'
