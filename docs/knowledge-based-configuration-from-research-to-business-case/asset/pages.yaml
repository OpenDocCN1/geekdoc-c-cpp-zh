    +   - Generalizations: This modeling facility relates two or more component types
    through a subset relation. The generalization relationship between subtypes and
    supertype (or the inverse specialization relationship between supertype and subtypes)
    can be characterized as disjoint and complete. Disjointness means that each instance
    of a component type X can be assigned to only one of the subtypes of X. For example,
    each CPU is either of type CPUS or CPUD but not both. Completeness means that
    each instance is assigned to one of the leaf nodes of the generalization hierarchy.
    Furthermore, generalization hierarchies in the configuration context typically
    do not allow multiple inheritance. Again, further modeling facilities with different
    semantics are introduced in the other chapters of this book where needed. Note
    that for reasons of simplicity no definition of specific application types is
    included in our example; it is assumed that each instance of type Application
    has the same required hdcapacity (200) and the same price, which is 50. In a complete
    model of a personal computer additional subtypes would be included or defined
    as part of a corresponding component catalog.


    # Computer Configuration Model in UML: Constraints


    Constraints represent restrictions that have to hold between attributes and/or
    component types. Constraints frequently used in configuration models are now explained
    on the basis of our PC configuration model (see Table 6.2).16


    We differentiate between the following types of constraints: (1) Constraints that
    are directly integrated into the configuration model depicted in Figure 6.7 are
    denoted as graphical constraints (gc_i ∈ GC). (2) Constraints regarding the pricing
    of a configurable product can be defined as part of the configuration model. In
    many real-world scenarios pricing constraints (policies) are not part of the configuration
    model but rather implemented as a separate pricing component. We denote the set
    of pricing constraints as PRC ≡ ∪prc_i. (3) Constraints restricting the production
    and consumption of resources are denoted as resource constraints (resc_i ∈ RESC).
    (4) Constraints that define in which context which additional components have
    to be part of a configuration (solution) are denoted as requires constraints (crc_i
    ∈ CRC). Requires constraints {crc1–crc3} are defined in addition to the ones already
    contained in GC. (5) Restrictions regarding the way in which different components
    (instances of component types) can be combined with each other are defined on
    the basis of compatibility constraints (compc_i ∈ COMPC). The compatibility constraints
    {comp1–comp3} are defined in addition to the ones already contained in GC. The
    graphical constraint gc1 describes an incompatibility, which is the complement
    of a compatibility. Compatibilities are used in cases where the number of allowed
    combinations of components (or attribute values) is low. Alternatively, if the
    number of incompatibilities is low, incompatibility constraints are used. Quite
    often, the term compatibility constraint denotes both compatibilities and incompatibilities.
    All the constraints of the configuration model C_KB = GC ∪ PRC ∪ RESC ∪ CRC ∪
    COMPC17 together with a set of customer requirements are major elements of a configuration
    task that can be solved by a configurator (configuration system).


    16 Formalizations of these constraints are introduced in Subsection 6.4.1.


    17 Note that for simplicity we take into account only these specific types of
    constraints. However, industrial configuration environments typically allow the
    definition of further constraints that are not restricted to the categorization
    used here.'
