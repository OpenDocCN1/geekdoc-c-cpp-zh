- pgno: 271
  md: '# FIGURE 20.2


    Architecture for managing and configuring documents in a product line.


    Decision dbversion. Variability within tables is enabled via the commands #table.row.visible
    and #table.col.visible. These commands are frequently used when defining configuration
    parameters, which are typically documented in tables. For example, #table.row.visible{A:WebHMI}
    is used to tag table rows that provide information on the default users for the
    WebHMI system.


    We extended the DOPLER configuration wizard (see Figure 20.3) with a generator
    that uses the configuration description (i.e., the answers to Decisions and the
    included Chapter and Subchapter Assets) to compose Microsoft Word documents. The
    generator uses a template of the document to be generated and an arbitrary number
    of document fragments to be inserted depending on Decisions. The document template
    serves as the entry point for the generator and contains the table of contents,
    indices of figures and tables, and the document structure including the comments
    for document insertions. The various subchapters (represented as fragments) can
    be inserted on arbitrary positions within the document template. During generation
    the document template is parsed and the inserted tags are resolved based on the
    configuration decisions and selected assets. After composing the document, the
    indices, tables and cross-references are updated.


    The approach presented in this chapter is currently used within more than 15 product
    lines at Siemens VAI by nearly 100 users worldwide. While the presented CC-L2
    example is combining both the generation of software artifacts and documents,
    in other Siemens VAI product lines, the usage is focusing on the configuration
    and generation of documents and also includes the calculation of roughly estimated
    costs, return on investment, and payback periods. These documents are used by
    accountants to provide information to customers or to prepare for customer meetings.


    ![](img/214a17cc1f5bbf0914497c7414128438_271_0.png)'
  merge: -1
