- pgno: 257
  md: 'Hence, a solution for showing that a communication network fulfills the requirements
    of M2M application scenarios and taking counter measures in case of detected shortcomings
    has to be flexible and adaptable.


    # 19.3 SIMOA Approach


    From the application domain we are able to derive the requirements for a tool
    that provides change operations for the given mobile network taking into account
    future usage scenarios. The future usage scenarios are determined by the communication
    needs of M2M applications (see, for example, the two scenarios discussed in the
    previous section). In the following, we discuss tool requirements with regard
    to the knowledge representation language, simulation features, reconfiguration,
    and optimization functionalities.


    +   - *Language.* In order to support the discussed scenarios, we need information
    about the structure and behavior of mobile networks and related usage scenarios.
    Due to the huge variety of networks and usage scenarios, a modeling language has
    to be provided for formalizing the information. This language has to allow for
    stating the structure of a system and the behavior of its components. Temporal
    aspects, such as changes in network access over time, have to be captured as well.
    Moreover, in case of optimization requirements, the language has to provide means
    for stating optimality criteria.

    +   - *Simulation.* The first step to evaluate whether an available mobile network
    is capable of handling all requests imposed by a future M2M application is to
    simulate the network behavior using the M2M communication requirements. Example
    requirements might be maximum delays of replies of remote machines on messages
    sent or the required amount of data to be sent at the same time. If the simulation
    returns that the network cannot handle certain requirements of the M2M application,
    someone is interested in finding a reconfiguration of the network that allows
    for fulfilling the requirements. The simulation itself should be based on the
    introduced modeling language. In the area of dynamic systems modeling and simulation,
    we mention Matlab/Simulink and Modelica. Although both of them are complex languages,
    capable of modeling a great variety of components, they are less appropriate for
    (re) configuration purposes, because they cannot handle underconstrained problems
    where a variety of solutions is possible.

    +   - *Reconfiguration.* Changing an existing network for fulfilling communication
    scenarios imposed by M2M applications can be done on several levels. Certain parameters
    of mobile phone cells can be changed in order to provide more channels. New cells
    can be added to the network, thus changing the network topology. In our application
    all such possible changes should be reported. The same modeling language that
    is used for simulation should also be used for providing configuration information.

    +   - *Optimization.* Since there is very likely more than one reconfiguration
    for handling future communication requirements, an optimal solution would be of
    great interest. Depending on who the user is, different optimality criteria are
    to be fulfilled. For instance, a mobile operator would prefer the reconfiguration
    that offers the best quality of service, whereas a customer would pick the solution
    with least costs for communication. Therefore, a requirement is that various optimality
    criteria can be specified and that it is possible to search for reconfigurations
    fulfilling the optimality criteria.'
