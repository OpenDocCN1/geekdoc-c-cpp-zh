- pgno: 186
  md: '# CHAPTER 12 Redundancy Detection in Configuration Knowledge


    The problem of checking whether a given constraint can be inferred from the remaining
    part of a constraint set has shown to be Co-NP-complete in the general case (Piette,
    2008). There exist alternative algorithms that have a better runtime performance
    compared to Sequential in situations with a large amount of redundant constraints
    in $C_{KB}$. Large amounts of redundant constraints typically occur in distributed
    knowledge engineering scenarios where a large number of users specify rules that
    in the following have to be aggregated into one consistent constraint set (see,
    e.g., Chklovski and Gil, 2005).


    In the following section we introduce the CoreDiag algorithm, which is a valuable
    alternative to Sequential in situations with a large number of redundant constraints.
    After having introduced CoreDiag we will analyze the performance of both algorithms
    (Sequential and CoreDiag) on the basis of a financial services knowledge base
    (Section 12.5).


    # 12.4 CoreDiag


    The CoreDiag algorithm (together with CoreD; Felfernig et al., 2011) is based
    on the principle of divide-and-conquer: whenever a set $S$, which is a subset
    of $C_{KB}$, is inconsistent with $\overline{C}_{KB}$, it is or contains a minimal
    core (i.e., a set of constraints that preserve the semantics of $C_{KB}$). In
    our implementation, CoreD is responsible for determining such minimal cores, CoreDiag
    returns the complement of a minimal core, which is a maximal set of redundant
    constraints in $C_{KB}$. CoreD is based on the principle of QuickXPlain (see Felfernig
    et al., 2014);⁷ as a consequence a minimal core (minimal set of constraints that
    preserve the semantics of $C_{KB}$) can be interpreted as a minimal conflict (i.e.,
    a minimal set of constraints that are inconsistent with $C_{KB}$).


    CoreD allows the determination of preferred minimal cores since the algorithm
    is based on the assumption of a strict lexicographical ordering of the constraints
    in $C_{KB}$. On an informal level, a preferred minimal core can be characterized
    as follows: if we have different options for choosing a minimal core, we would
    select the one with the most agreed-upon constraints. For more details on the
    role of strict lexicographical orderings of constraints refer to the work of Junker
    (2004) and Felfernig et al. (2012).


    The CoreDiag algorithm (see Algorithm 12.2) generates $C''_{KB}$ from $C_{KB}$.
    It then activates CoreD (see Algorithm 12.3), which determines a minimal core
    on the basis of a divide-and-conquer strategy that divides the constraints in
    $C$ into two subsets ($C_1$ and $C_2$), with the goal to figure out whether one
    of those subsets already contains a minimal core. If $C_2$ contains a minimal
    core, $C_1$ is not further taken into account. If $C$ contains only one element
    ($c_\alpha$) and $B$ is still consistent, then $c_\alpha$ is part of the minimal
    core.


    Table 12.2 shows an execution trace of the CoreDiag redundancy detection algorithm
    on basis of our (redundant) example configuration knowledge base $C''_{KB} = \{c_a,
    c_1, c_2, c_3, c_4, c_5\}$. In this context, the recursive function CoreD is responsible
    for determining a minimal core (if one exists). The basic approach of CoreD is
    to identify a minimal conflict set $CS$ for $C \cup B$ such that $CS \cup B$ is
    inconsistent. The identified conflict set represents the minimal core and $C -
    CS$ the set of redundant constraints.'
