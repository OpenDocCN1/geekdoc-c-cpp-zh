  md: "# VariSales\n\n# CHAPTER 26\n\n**Juha Tiihonen** and **Andreas Anderson** \
    \ \n*Aalto University, Aalto, Finland*  \n*Variantum, Espoo, Finland*\n\n**Abstract:**\
    \ In this chapter we outline the modeling of the PC configuration knowledge base\
    \ with VariSales. VariSales is based on object-oriented knowledge representations\
    \ with a clear underlying semantics. The VariSales environment consists of a semivisual\
    \ *Modeling Tool* and a web-based *Configuration Tool*. It applies an inference\
    \ engine that follows the logic-based Answer Set Programming (ASP) paradigm.\n\
    \n# 26.1 Introduction\n\nMany problem solving methods provide an explicit or implicit\
    \ conceptual model for representing configuration models, requirements, and configurations,\
    \ in other words configuration knowledge. In our view, a practical approach in\
    \ terms of configurator maintainability is to provide a configuration-specific\
    \ modeling conceptualization that can be applied to express configuration knowledge.\
    \ The task of the configuration system is to map this knowledge into a form that\
    \ can provide the inference required to support the configuration task.\n\nWe\
    \ believe that the configuration ontology introduced by Soininen et al. (1998)\
    \ covers a broad range of configuration problems. However, in many companies that\
    \ we visited during several research projects, order forms for sales configuration\
    \ were relatively simple, typically a page or two in A4 format. The configuration\
    \ task was straightforward, requiring only limited inference. VariSales, which\
    \ is the commercialized version of WeCoTin (Tiihonen et al., 2003, 2013), was\
    \ developed mainly to address these simpler problems.\n\nThe remainder of this\
    \ chapter is organized as follows. Section 26.2 gives an overview of the modeling\
    \ concepts of VariSales and shows how taxonomic hierarchies, attributes, compositional\
    \ structures, and constraints are defined (represented). Section 26.3 exemplifies\
    \ the modeling of resource constraints and Section 26.4 introduces user interface\
    \ modeling and the resulting VariSales interface for end-users. Finally, a brief\
    \ discussion and conclusions are provided.\n\n# 26.2 Modeling of the Working Example\n\
    \nA significantly reduced subset of the configuration ontology introduced by Soininen\
    \ et al. (1998) provides a conceptual basis for the modeling language of VariSales.\
    \ This subset is represented by the"
  merge: -1
  img_proc: true
- pgno: 334
  md: "*Product Configuration Modeling Language* (PCML). PCML was implemented under\
    \ the belief that it can support a practical and relevant set of sales configuration\
    \ tasks. It includes taxonomy, compositional structure, attributes, and constraints.\
    \ Connection-oriented concepts (ports) and even resources were left out. The main\
    \ concepts of PCML are *feature types*, their compositional structure, *attributes*,\
    \ and *constraints*. Feature types define the subfeatures (parts) and attributes\
    \ of their *individuals* that can appear in a configuration. An overview of the\
    \ PC configuration model introduced in Hotz et al. (2014)¹ is shown in Figure\
    \ 26.1.\n\nSemantics of PCML are provided by mapping PCML to Weight Constraint\
    \ Rule Language (WCRL), applying the idea of Soininen et al. (2001). The *Smodels*\
    \ system provides an efficient inference engine for WCRL (Simons et al., 2002).\
    \ Development of WCRL and *Smodels* took into account configuration as a potential\
    \ application domain.\n\n# 26.2.1 Taxonomic Hierarchy and Attributes\n\nThe *VariSales\
    \ Modeling Tool* provides editing of feature types, their class hierarchy, and\
    \ attributes. This includes creating, removing, renaming (maintaining model consistency),\
    \ and changing subclass hierarchies. The *Feature type tree* displays the class\
    \ hierarchy (see the upper left-hand corner of Figure 26.1) and serves as a starting\
    \ point for editing all aspects of the types. Editing the selected object takes\
    \ place in the right side of the display or sometimes in pop-up windows. In the\
    \ Feature type tree, colored squares differentiate between concrete (blue), abstract\
    \ (red) types, and the configuration type (green). The tree shows the complete\
    \ taxonomic hierarchy of the example. Some of these and attribute definitions\
    \ of PC are shown in textual PCML format here:\n\n```\nfeature PC\n    attribute\
    \ usage\n        value type string constrained by $\n            in list(\"internet\"\
    ,\"scientific\",\"multimedia\")\n\n    attribute efficiency\n        value type\
    \ efficiency_valueType constrained by $\n            in list(\"A\",\"B\",\"C\"\
    )\n        no default\n            constraint crc1\n    ( ( usage = \"internet\"\
    \ ) or ( usage = \"multimedia\" ) )\n        implies present (InternetConn)\n\
    \    feature PC_Component\n        abstract\n    feature InternetConn\n      \
    \  subtype of PC_Component\n```\n\nThe feature type overview (right-hand side\
    \ of Figure 26.1) allows adding or removing attributes, and changing the abstraction\
    \ level or the name of the currently selected type. The tab Attributes shows an"
