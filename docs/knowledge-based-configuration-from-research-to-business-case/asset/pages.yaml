- pgno: 357
  md: 'specific date or ECM state is stored in a repository called a *knowledge base
    run-time version* (KBRT). A KBRT can potentially store model data for more than
    one root material. For example, data for all materials under a given class could
    be combined into one KBRT. KBRTs can be transported to a local database or to
    the CRM system. For those customers using the CRM system without the ERP system
    (a definite minority), it is possible to maintain models in the form of a KBRT
    directly in CRM.


    Maintenance in R/3 (SAP ERP) was enhanced to allow advanced features such as ADT
    (*abstract data type*) characteristics, which can be assigned another object instance
    as a value at run-time (to express relations between instances). Constraints were
    enhanced to deal with ADTs and to be able to do the job of selection conditions
    and preconditions. Also, one of the limitations of the SAP VC was removed. With
    a classical BoM each instance in the configuration corresponds uniquely to a BoM
    item in the BoM of its parent instance. In the advanced models it was possible
    to specify a minimum and maximum number of allowed instances for each item in
    a BoM. Many instances could now belong to one BoM item. This feature is important
    when modeling products where the number of parts of an object instance could not
    be foreseen. An example would be the BoM of an elevator. It is tedious or impractical
    to model for the maximum number of floors an elevator may have to service.


    A nonhierarchical concept for summation was introduced, so-called *aggregating
    rules*. These were implemented using the same technology as the constraint processing.
    Non-hierarchical balances were supported. These subsumed two aggregations under
    one name, one for the *offers* side and one for the *requires* side of the balance,
    with a built-in comparison of the two sides. ATMS functionality was finally implemented
    to support the *conflict solver*, an aid to dealing with inconsistency. In its
    current state it has been improved to use a concept of *choices* adapted from
    the *Scope Selection* application (Haag and Riemann, 2011). A choice is a user
    decision to support or forego a particular property of the configuration. If they
    choose to forego such a property, then all soft justifications for this property
    are simultaneously inactivated/discarded. If they then choose to support the property
    again, all soft justifications are activated/reinstantiated.


    Further notes: A concept of tasks, similar to that in μPLAKON, was proposed in
    the design document, but has not been implemented to date. For non-monotonic inheritance
    of defaults, the notion of Touretzky’s *minimal inferential distance* (Touretzky,
    1986) was replaced by that of a *class precedence list* as defined for *Common
    LISP* (Steele, 1990). This still proved too complex and there are proposals for
    a pragmatic simplification. Hooks for integration with 2D/3D rendering of configured
    products using third-party viewers were provided, but this functionality was not
    heavily used due to its associated effort and cost.


    The first use of the SCE was in a project configuring office furniture solutions
    in 1998, which also encompassed integration with a CAD system, pioneering work.
    Such developments were not mainstream projects due to their complexity and integration
    issues. The number of customers involved in them was small.


    Meanwhile, many customers using the SAP VC wanted to profit from a standalone
    configurator without needing the new advanced functionality. For this reason,
    a *compatibility mode* was added to the SCE. Selection conditions, preconditions,
    and procedures were reintroduced. However, due to the fact that the SCE had been
    designed to improve on the specification of the SAP VC and also because its operation
    occurred outside of the ERP environment, there remained a list of differences
    between the SCE and the SAP VC (the *IPC delta list*). Efforts have been made
    to reduce this list over time, by moving the SCE closer to the SAP VC. The original
    mode, for which the SCE had been designed, was subsequently referred to as the
    *SCE advanced mode*.'
