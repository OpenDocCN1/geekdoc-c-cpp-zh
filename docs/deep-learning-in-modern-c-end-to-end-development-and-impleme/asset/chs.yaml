  \n# 第 3 章 深度学习代码测试](#contents.xhtml_ch03a)\n\n## 引言](#contents.xhtml_sc2_33a)\n\n\
  与任何通用代码一样，深度学习算法在部署到生产环境之前必须经过测试。然而，两个主要的考虑使得深度学习代码的测试变得至关重要，即：高适应性和深度学习模型中常见的随机性。在本章中，我们将理解这些问题，并学习如何使用\
  \ `GoogleTest Framework` 和 `Boost` 统计包为我们的模型构建可靠的测试套件。\n\n## 结构](#contents.xhtml_sc2_34a)\n\
  \n这是本章的路线图：\n\n* 测试深度学习代码重要性\n* 深度学习模型的随机性\n* 介绍 `GoogleTest Framework`\n* 处理深度学习代码的随机性\n\
  * 理解假设检验\n* 测试驱动开发\n\n## 目标](#contents.xhtml_sc2_35a)\n\n在本章结束时，你将理解如何使用 `GoogleTest\
  \ Framework` 和统计测试来测试你的深度学习代码。你还将了解从测试工程的角度来看，区分深度学习代码与其他传统代码的最重要方面。\n\n## 测试深度学习代码的重要性](#contents.xhtml_sc2_36a)\n\
  \n正如文献所示 [1]，调试深度学习模型并不是一项简单的任务。通常情况下，在实现算法时，很难判断性能差是因为效率低下还是实现错误。现在，让我们理解这两个主要的来源。\n\
  \n### 深度学习组件的高适应性](#contents.xhtml_sc37a)\n\n开发模型的一个显著挑战之一是它们由许多高度适应性的部分组成。事实证明，如果一个组件由于故障运行良好，其他组件可以适应并使整个模型达到次但非毁灭性的性能。虽然这种适应性使得测试性\
  \ [2] 变得困难，但解决此问题的方法非常直接：独立测试每个部分。通过单独测试单元，我们将不受其他部分的影响。这种方法将在本章后面介绍。\n\n### 深度学习模型的随机性](#contents.xhtml_sc2_38a)\n\
  \n深度学习的主要关注点在于找到执行特定任务的模型。这种搜索被称为模型训练。简而言之，训练算法执行搜索，类似于遍历不同的路径。在这个过程中，算法利用收集到的信息来决定哪条路径更有希望。在初始阶段，训练算法尚未收集任何信息。因此，无法预先知道哪条路径更有或更没有希望。为了迈出第一步，训练算法使用名为`随机初始化`的技术来决定走哪条路径。\n\
  \n`随机初始化` 是深度学习模型的随机性来源之一。事实上，随机性被广泛用于探索不同路径的替代。除了随机初始化，我们还可以引用：\n\n* 训练开始前的洗牌\n\
  * 每个轮次（epoch）期间的洗牌\n* Dropout 中的随机节点丢弃\n\n尽管随机性对于处理搜索空间的复杂性很有用，但它也为模型注入了随机行为，使其输出的结果无法预先准确预测。这种非确定性行为使得实现输出的可现变得容易。由于复现性是测试的关键方面\
  \ [2]，随机性成为评估深度学习算法正确性的重要考虑因素。\n\n因此，在评估算法实现时，我们考虑到某些特性不适用于传统方法（即通过预期精确值与特性的实际输出进行对比）。对于这种情况，我们将以统计方式评估代码的正确性。这种方法将在本章中进行说明。\n\
  \n## 介绍 GoogleTest Framework](#contents.xhtml_sc2_39a)\n\n\n\n\n在本章开始，我们讨论了测试单个模型组件的重要性，以减少高适应性对可测试性带来的负面影响。在软件工程中，我们使用单元测试来实现这一目的。`GoogleTest\
  \ Framework` [3] 是一个用于为 C++ 代码创建单元测试的流行且成熟的引擎。现在我们将介绍它。\n\n我们可以遵循 GoogleTest 文档了解如何配置我们的\
  \ cmake 构建系统：\n\n```cmake\ncmake_minimum_required(VERSION 3.8)\nset(PROJECT_NAME\
  \ googletest_example)\nproject(${PROJECT_NAME} CXX)\nset(CMAKE_CXX_STANDARD 17)\n\
  set(CMAKE_CXX_STANDARD_REQUIRED ON)\nset(CMAKE_CXX_EXTENSIONS OFF)\ninclude_directories(include)\n\
  option(BUILD_TESTS \"Build the tests\" OFF)\nif(BUILD_TESTS)\n  # using google test.\
  \ See https://github.com/google/googletest/blob/main/docs/quickstart-cmake.md\n\
  \  include(FetchContent)\n  FetchContent_Declare(\n    googletest\n    URL https://github.com/google/googletest/archive/03597a01ee50ed33e9dfd640b249b4be3799d395.zip\n\
  \  )\n  set(gtest_force_shared_crt ON CACHE BOOL \"\" FORCE)\n  FetchContent_MakeAvailable(googletest)\n\
  enable_testing()\nset(PROJECT_TEST_NAME test_${PROJECT_NAME})\nfile(GLOB_RECURSE\
  \ TEST_SRC_FILES \"${PROJECT_SOURCE_DIR}/tests/*.cpp\" \"${PROJECT_SOURCE_DIR}/src/*.cpp\"\
  )\nadd_executable(${PROJECT_TEST_NAME} ${TEST_SRC_FILES})\ntarget_compile_options(${PROJECT_TEST_NAME}\
  \ PRIVATE -Wall -Wextra -pedantic -Wno-enum-compare -Wno-maybe-uninitialized -Wno-uninitialized\
  \ -Wno-unused-parameter)\ntarget_link_libraries(${PROJECT_TEST_NAME} GTest::gtest_main)\n\
  include(GoogleTest)\ngtest_discover_tests(${PROJECT_TEST_NAME})\nendif()\n```\n\n\
  上面的 CMake 配置文件与我们在第 2 章《现代 C++深度学习编程》中使用的 `CMakeList.txt` 文件非常。。区别在于 `BUILD_TESTS`\
  \ 部分：\n\n```cmake\noption(BUILD_TESTS \"Build the tests\" OFF)\nif(BUILD_TESTS)\n\
  \  ...\nendif()\n```\n\n默认情况下，`BUILD_TESTS` 标志被设置为 `OFF`。要启用测试，我们必须将 `BUILD_TESTS`\
  \ 设置为 `ON`。可以在调用 cmake 时运行时完成：`cmake -DBUILD_TESTS=ON ..`。\n\nCMake 将下载下载 GoogleTest\
  \ 并为我们的项目配置。现在，让我们为模型创建一些测试。\n\n### 编写第一个单元测试](#contents.xhtml_sc3_40a)\n\n假设我们开发了以下函数：\n\
  \n```cpp\nfloat sigmoid(float z) {\n  float result;\n  if (z >= 45.f)\n    result\
  \ = 1.f;\n  else if (z <= -45.f)\n    result = 0.f;\n  else\n    result = 1.f /\
  \ (1.f + exp(-z));\n  return result;\n}\n```\n\n该函数是机器学习中最著名的激活函数之一，被称为 `sigmoid`\
  \ 函数。我们将在后的第 7 章《定义激活函数》中介绍 `sigmoid` 和其他激活函数。在此期间，我们将此函数仅视为必须测试的特性。\n\n在编写第一个测试之前，让我们更好地了解待测试的特性。一个简单有效的方法是观察函数图表：\n\
  \n![](img/Figure_3.1.png)\n\n图 3.1：sigmoid 函数的图\n\n通过分析这张图表，我们可以意识到该函数有两个重要的限值：当\
  \ `z ⟶ +∞` 和 `z ⟶ -∞` 时，它们分别为 1 和 0。再次查看图表，我们还可以发现 `sigmoid(0) = 0.5`。我们将使用这些信息来编写第一个单元测试：\n\
  \n```cpp\n#include <gtest/gtest.h>\n#include \"my_functions.hpp\"\n\nTEST(SigmoidTest,\
  \ BaseCases) {\n  float actual = sigmoid(-100.);\n  float expected = 0;\n  EXPECT_NEAR(actual,\
  \ expected, 1e-7f) << \"lower bound test failed\";\n  EXPECT_NEAR(sigmoid(100.),\
  \ 1., 1e-7f) << \"upper bound test failed\";\n  EXPECT_NEAR(sigmoid(0), .5, 1e-7f)\
  \ << \"center position failed\";\n}\n```\n\n这是一个非常简单的测试。我们使用 `sigmoid(z)` 计算函数在值\
  \ `z` 处的值，然后将此 `actual` 值与我们的理论值进行比较。我们使用了 GoogleTest 宏 `EXPECT_NEAR`。`EXPECT_NEAR`\
  \ 有三个参数：\n- 实际值\n- 期望值\n- 容差\n\n由于任何系统中的浮点数问题，我们绝不应该使用等等运算符直接比较浮点数，例如 `x == 0.301870532f`。相反，我们应该使用某些方法。由于任何系统中的浮点数问题，我们绝不应该使用等等运算符直接比较浮点数，例如\
  \ `x == 0.301870532f`。相反，我们应该使用某些方法。由于任何系统中的浮点数问题，我们绝不应该使用等等运算符直接比较浮点数，例如 `x ==\
  \ 0.301870532f`。相反，我们应该使用某些方法。由于任何系统中的浮点数问题，我们绝不应该使用等等运算符直接比较浮点数，例如 `x == 0.301870532f`。相反，我们应该使用某些方法。\
  \ (注：此处原文似乎存在重复内容，翻译时已按逻辑处理)\n\n此处原文存在部分重复，已遵循逻辑进行翻译。\n\n### 使用 EXPECT_EQ 和 EXPECT_THROW](#contents.xhtml_sc3_41a)\n\
  \n考虑以下未优化的函数，用于找到未排序数组的中间值：\n\n```cpp\nint find_middle(const std::vector<int> &arr)\
  \ {\n  const size_t N = arr.size();\n  if (N == 0) {\n    throw std::invalid_argument(\"\
  cannot find the middle of an empty vector\");\n  }\n  std::vector<int> copy = arr;\n\
  \  std::sort(copy.begin(), copy.end());\n  int result = copy[N/2];\n  return result;\n\
  }\n```\n\n该代码基本上执行了两个主要操作：\n- 第 9 行，对数组进行拷贝\n- 第 11 行，对后的数组\n\n事实上，`find_middle()`\
  \ 函数的实现对于生产环境来说并不理想。通过一点努力，我们可以发现更高效的替代方案。然而，目前我们不关注优化这个实现。此时，我们只对测试 `find_middle()`\
  \ 本身感兴趣。让我们考虑两种测试场景。第一种情况是数组长度为奇数时：\n\n![](img/Figure_3.7.png)\n\n图 3.7：奇数大小数组\n\
  \n现在，让我们考虑当数组长度为偶数的情况：\n\n![](img/Figure_3.8.png)\n\n图 3.8：偶数大小数组\n\n如果数组长度为偶数，我们有两个返回选择，即排序数组中间的两个数字之一。我们的\
  \ `find_middle()` 实现使用了右侧的一个。现在，是时候为这些场景编写测试了：\n\n```cpp\nTEST(OddCase, BaseCases)\
  \ {\n  std::vector<int> vec = {9, 4, 1, 11, 20, -1, 2};\n  int actual = find_middle(vec);\n\
  \  EXPECT_EQ(4, actual);\n}\n\nTEST(EvenCase, BaseCases) {\n  std::vector<int> vec\
  \ = {9, 4, 11, 20, -1, 2};\n  int actual = find_middle(vec);\n  EXPECT_EQ(9, actual);\n\
  }\n\nTEST(CheckEmptyVector, BaseCases) {\n  EXPECT_THROW({\n    std::vector<int>\
  \ vec; // 一个空向量\n    find_middle(vec);\n  }, std::invalid_argument);\n}\n```\n\n\
  \n\n\n```cpp\n23. }, std::invalid_argument);\n25. }\n```\n\n这个示例与之前测试 sigmoid 函数的示例有什么不同？这个示例使用了两个断言：`EXPECT_EQ`\
  \ 和 `EXPECT_THROW`。第一个断言检查函数是否提供了预期的输出。注意，`EXPECT_EQ` 不需要第三个参数来控制浮点数容差。由于我们比较的是整数值，因此不需要担心浮点精度问题。\n\
  \n第二个断言检查当传递一个空数组作为参数时，函数是否真的抛出了类型为 `invalid_argument` 的异常。同样地，我们可以使用 `EXPECT_NO_THROW`\
  \ 和 `EXPECT_ANY_THROW` 分别检查是否存在或不存在任何类型的异常。\n\n| 提示：GitHub 上的书籍仓库包含了目前为止所示的示例。 |\n\
  \n在 GitHub 上的 GoogleTest 仓库 [3] 中可以找到更多使用 GoogleTest 断言的示例。\n\n## 重构与回归测试套件\n\n\
  测试对于帮助我们检查变化是否以及如何影响代码行为特别有用。例如，再次以上一节的 `find_middle()` 函数为例，我们可以考虑从内存使用或处理时间两个方面提高其性能的几种方法。在不改变行为的情况下提高功能的性能被称为重构。\n\
  \n要确保重构实际上没有改变功能行为的唯一方法，是在执行重构之前之后运行大量的测试，检查输出是否受到影响。在这种背景下，这组测试组合被称为回归测试套件。\n\n\
  深度学习算法的发展始终是一个迭代过程。在工业级开发设置中，回归测试套件对于开发团队确保代码的演进或退化有充分把握至关重要。我们将在稍后的练习部分探讨这一概念。\n\
  \n## 处理深度学习代码的随机性\n\n正如我们在在本章早期讨论的那样，某些模型参数是随机初始化的。在实践中，这是通过某种随机数生成器来实现的。此操作有几种不同的方法，但通常它们属于以下两类之一：\n\
  \n* 从较小的均匀分布中生成随机值\n- 从较小的正态分布中生成随机值\n\n作为一个回顾，这是一个均匀分布的示例：\n\n![](img/Figure_3.9.png)\n\
  \n图 3.9：均匀分布示例\n\n这是一个正态分布的示例：\n\n![](img/Figure_3.10.png)\n\n图 3.10：正态分布示例\n\n\
  正态分布具有众为人知的钟形，而均匀分布几乎是矩形。\n\n尽管文献描述了几种不同的分布，但在实践中，编写深度学习算法时，均匀分布和正态分布是最常见的。例如，考虑所示\
  \ `glorot_initializer` [4]：\n\n```cpp\n1. std::vector<float> glorot_initializer(int\
  \ fan_in, int fan_out) {\n3. int size = fan_in * fan_out;\n5. float std_dev = sqrt(2.\
  \ / (fan_in + fan_out));\n7. unsigned seed = std::chrono::system_clock::now().time_since_epoch().count();\n\
  8. std::default_random_engine generator (seed);\n9. std::normal_distribution<float>\
  \ distribution(.0, std_dev);\n11. std::vector<float> result(size);\n12. std::generate(result.begin(),\
  \ result.end(), [&generator, &distribution]() { return distribution(generator);\
  \ });\n14. return result;\n15. }\n```\n\n此函数生成一个填充了随机数的向量。这些数字提取自均值为零且标准差由下所示的正态分布：\n\
  \n![](img/Figure_3.11.png)\n\n图 3.11：Glorot 标准差\n\n查看 `glorot_initializer()`，我们可能会想：由于每次调用都会得到一个不同的向量，我们该如何测试这样的函数呢？\n\
  \n一种（糟糕的）替代方案是如所示所示控制随机种子：\n\n```cpp\n1. unsigned seed = 1234;\n```\n\n这将使随机生成具有可现性。虽然这种方法对于局部评估有时是有效的，但将其应用于整个测试套件是一个方法论上的错误，违反了测试之间的独立原则。在实践中，使用这种方法会让我们的套件存在缺陷。\n\
  \n测试随机特性的正确方法是使用下一节描述的假设检验。\n\n## 理解假设检验\n\n假设检验是一种常用且简单的统计程序，帮助我们识别手头数据是否支持对一个或多个统计参数的假设。最流行的假设检验是\
  \ t 检验，或学生检验 [5]，用于验证样本均值。\n\n在假设检验中，我们定义两个互斥的假设：\n\n* 原假设（NULL hypothesis）：关于假设为真实的总体参数的陈述。\n\
  * 备择假设（alternative hypothesis），基本上是原假设的否定。\n\n假设检验建立了拒绝或不拒绝原假设的常规。注意，不拒绝假设不同于说假设是真实的。\n\
  \n| 注意：假设检验的核心思想是确定数据是否带有足够的证据来拒绝原假设。如果没有，我们不能准确地说原假设是真实的，只能说没有证据证明它是错误的。 |\n\n\
  因此，假设检验的输出是以下选项之一：\n\n* 拒绝了原假设\n* 未拒绝原假设\n\n未被拒绝的原假设并不意味着原假设是真实的。在实践中，我们可以使用足够的数据和公平的置信区间使测试尽可能可靠。让我们看看如何使用它来验证\
  \ `glorot_initializer`。\n\n## 使用假设检验检查 Glorot 初始化\n\n我们将通过两个假设检验来检查 `glorot_initializer()`。第一个提出以下原假设：\n\
  \n* 权重的标准差为 `std_dev = sqrt(2 / (fan_in + fan_out))`\n\n一旦发现该假设未被拒绝，我们可以进行第二个假设检验，检查以下假设：\n\
  \n* 结果权重的均值为零\n\n这是使用 GoogleTest 自动化这些假设检验，如所示。\n\n## 检查数据标准差和均值\n\n检查标准差的最流行的统计检验是方检验\
  \ [5]。运行此类测试的要求之一是知道如何计算概率密度函数（PDF）。如前，C++ 没有这些 PDF 的内置实现（也不应该有）。因此我们有两个选择：自己实现这些\
  \ PDF 或使用第三方库。让我们采用后者，使用 Boost 统计头文件 [6]：\n\n```cpp\n1. #include <boost/math/distributions/chi_squared.hpp>\n\
  2. #include <boost/math/distributions/students_t.hpp>\n4. using namespace boost::math;\n\
  6. /**\n* 原假设认为 sample_std 等 population_std\n* \n* 当拒绝原假设时，此函数返回 true\n*/\n11. bool\
  \ chi_squared_test(float population_std, float sample_std, int sample_size, float\
  \ confidence)\n12. {\n13. float variance_rate = sample_std / population_std;\n14.\
  \ variance_rate = variance_rate * variance_rate;\n15. float t_stat = (sample_size\
  \ - 1) * variance_rate;\n17. chi_squared distro(sample_size - 1);\n19. float upper_limit\
  \ = quantile(complement(distro, confidence / 2));\n20. float lower_limit = quantile(distro,\
  \ confidence / 2);\n22. return t_stat > upper_limit && t_stat < lower_limit;\n24.\
  \ }\n```\n\n上面的函数实现了卡方检验。输入是：\n\n\n\n\n\n-   总体标准差\n-   样本标准差\n-   样本量\n-   阈值系数，通常设置为\
  \ 0.05\n\n此函数根据提供的置信水平，在统计学意义上检查样本标准差和总体标准差是否等价。当原假设被“拒绝”（REJECTED）时，此函数返回 true。\n\
  \n同样地，我们可以使用 t 检验检查样本均值和总体均值：\n\n```cpp\n/**\n * 原假设认为 sample_mean 等于 population_mean\n\
  \ * \n * 如果原假设被拒绝，则此函数返回 true\n */\nbool t_test(float population_mean, float sample_mean,\
  \ float sample_std_dev, int sample_size, float confidence)\n{\n  float diff = sample_mean\
  \ - population_mean;\n  float t_stat = diff * sqrt(double(sample_size)) / sample_std_dev;\n\
  \  unsigned degree_of_freedom = sample_size - 1;\n  students_t distro(degree_of_freedom);\n\
  \  float q = cdf(complement(distro, fabs(t_stat)));\n  float confidence _2 = confidence\
  \ / 2.;\n  return q < confidence _2;\n}\n```\n\n一旦我们有了这两个测试，就可以使用 GoogleTest 定义一个单元测试，以检查由\
  \ `glorot_initializer()` 实现提供的标准差和均值：\n\n```cpp\nTEST(CheckGlorot, StatCases)\n\
  {\n  int fan_in = 6;\n  int fan_out = 5;\n  auto weigths = glorot_initializer(fan_in,\
  \ fan_out);\n  const int N = weigths.size();\n  EXPECT_EQ(N, fan_in * fan_out);\n\
  \  float sum = std::accumulate(weigths.begin(), weigths.end(), 0.0);\n  float weight_mean\
  \ = sum / N;\n  float acc = 0.0;\n  auto differ = &acc, &weight_mean {\n    const\
  \ float diff = val - weight_mean;\n    acc += diff * diff;\n  };\n  std::for_each(weigths.begin(),\
  \ weigths.end(), differ);\n  float actual_stdev = sqrt(acc / (N - 1));\n  float\
  \ expected_stddev = sqrt(2. / (fan_in + fan_out));\n  bool std_dev_rejected = chi_squared_test(expected_stddev,\
  \ actual_stdev, N, 0.05);\n  if (std_dev_rejected) {\n    FAIL() << \"The weights\
  \ standard deviation do not look like expected by the Glorot initializer\";\n  }\n\
  \  bool mean_rejected = t_test(0., weight_mean, actual_stdev, N, 0.05);\n  if (mean_rejected)\
  \ {\n    FAIL() << \"The weights mean do not look like expected by the Glorot initializer\"\
  ;\n  }\n}\n```\n\n编译并运行后，我们得到以下输出：\n\n![](img/Figure_3.12.png)\n图 3.12: 运行 Glorot\
  \ 初始化测试\n\n不同的统计分布需要不同的统计检验。通常情况下，使用相同的假设检验框架。两个区别在于计算 `t_test` 统计量和临界极限的方法。\n\n\
  ## 测试驱动开发\n\n此时，很明显地看出测试在深度学习开发中起着非常关键的作用。有些人对测试极度重视，以至于将其置于开发流程的最顶端。TDD 是测试驱动开发（Test-Driven\
  \ Development）[7]，实现这一概念的一系列实践。简而言之，使用 TDD 开发深度学习算法包含四个阶段：\n\n1.  **概念理解**：团队学习理论基础、文献和基准。\n\
  2.  **单元测试实现**：开发者编写单元测试来验证算法必须如何行为。由于算法本身尚未实现，测试在开始时将失败。这一步涉及将理论需求转换为软件。\n3.  **算法实现**：以测试为参考实现算法。目标是开发出满足测试中精确要求的代码。\n\
  4.  **重构**：一旦算法实现通过了所有测试，开发团队就可以将精力集中在改进和优化上。\n\n该过程在下图中进行了形象化展示：\n\n![](img/Figure_3.13.png)\n\
  图 3.13: TDD 循环\n\n每天，发现使用 TDD 作为方法论的机器学习开发变得越来越普遍，无论其成熟度或处于起步阶段。\n\n## 结论\n\n在本章中，我们讨论了测试在深度学习开发中的重要性。我们讨论了评估深度学习代码受到其组件复杂性的影响，这使得识别\
  \ bug 成了一项挑战。我们学习了如何使用 GoogleTest 构建单元测试来解决这个问题。此外，我们还讨论了随机性对深度学习代码的影响，以及这一点如何使可重复测试变得困难。我们引入了假设检验技术来克服这个问题，编写健壮且可重复的测试。\n\
  \n在下一章中，我们将开始本书的第二部分，学习实现深度学习组件，例如卷积和激活函数。\n\n## 练习\n\n1. 考虑以下名为 ReLU 的流行激活函数示例：\n\
