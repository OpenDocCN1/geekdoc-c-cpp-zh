  \ 0, -1, 1, 1},\n32.  {5, 2, 1, -1, -3},\n33.  {1, 3, 1, -1, 3},\n34.  {2, 2, 2,\
  \ 2, 3},\n35.  {3, -3, 1, 3, -1},\n36.  {2, -1, 2, -2, 1}\n37.  });\n38.  Eigen::Tensor<float,\
  \ 2> dC_dO(4, 3);\n39.  dC_dO.setValues({\n40.  {2, 2, 2},\n41.  {2, 2, 2},\n42.\
  \  {2, 2, 2},\n43.  {2, 2, 2}\n44.  });\n45.  auto dC_dK = convolution2D(X, dC_dO);\n\
  46.  std::cout << \"dC_dK:\\n\" << dC_dK << \"\\n\";\n47.  Eigen::Tensor<float,\
  \ 2> kernel(3, 3);\n48.  kernel.setValues({\n49.  {1, 0, -2},\n50.  {2, 1, -2},\n\
  51.  {-3, -2, 3}\n52.  });\n53.  auto kernel_180 = rotate180(kernel);\n54.  std::cout\
  \ << \"\\nkernel_180:\\n\" << kernel_180 << \"\\n\";\n55.  auto dC_dX = convolution2D(dC_dO,\
  \ kernel_180, 2);\n56.  std::cout << \"\\ndC_dX:\\n\" << dC_dX << \"\\n\";\n57.\
  \  return 0;\n58.  }\n```\n\n该程序产生如下输出：\n\n![](img/Figure_9.14.png)\n\n图 9.14：运行卷积梯度示例\n\
  \n在下一章中，当我们涵盖反向传播算法时，我们将使用下游梯度在网络层中传播误差。\n\n### 使用自动微分\n\n在前面的节中，我们学习了如何使用链式法则推出的公式计算卷积梯度。事实上，对函数求导并不总是容易且直观的。幸运的是，现代库（如\
  \ Eigen）具有自动微分（AD）功能，帮助我们实现任何需要导数的代码。\n\n\n\n\n\n## Eigen 中的自动微分\n\n通过使用 `Eigen::AutoDiff`\
  \ 头文件，我们可以计算如 $\\frac{\\partial F}{\\partial x}$ 和 $\\frac{\\partial F}{\\partial\
  \ y}$ 等导数，即使我们不知道 $\\frac{\\partial F}{\\partial x}$ 和 $\\frac{\\partial F}{\\partial\
  \ y}$ 的公式。为了实现这一功能，第一步是将 `F(x, y)` 定义为模板函数：\n\n```cpp\ntemplate<typename T>\nT F(const\
  \ T& x, const T& y)\n{\n  T result = x*x + 3*x*y + 4*y*y*y;\n  return result;\n\
  }\n```\n\n现在，我们不再像往常那样传递 `float` 值来调用 `F(x, y)`，而是使用特殊的 Eigen 类型 `Eigen::AutoDiffScalar`\
  \ 来传递 `X` 和 `Y`：\n\n```cpp\nint main(int, char **)\n{\n  Eigen::AutoDiffScalar<Eigen::Vector2f>\
  \ X;\n  Eigen::AutoDiffScalar<Eigen::Vector2f> Y;\n  X.derivatives() = Eigen::Vector2f::Unit(2,\
  \ 0);\n  X.value() = 2;\n  Y.derivatives() = Eigen::Vector2f::Unit(2, 1);\n  Y.value()\
  \ = 3.;\n  auto Z = F(X, Y);\n  std::cout << \"Z: \" << Z << \"\\n\\n\";\n  std::cout\
  \ << \"derivatives:\\n\" << Z.derivatives() << \"\\n\";\n  return 0;\n}\n```\n\n\
  `Z` 也是一个 `Eigen::AutoDiffScalar`，它包含了 `F(X,Y)` 的输出以及 `F` 对 `X` 和 `Y` 的导数值：\n\n![](img/Figure_9.15.png)\n\
  \n图 9.15: 简单的自动微分示例\n\n这个简单的示例说明，我们不需要自己计算 `F(x,y)` 的导数。Eigen 可以在底层使用 AD（自动微分）自动找到它们。让我们来看一下在更复杂的情况下\
  \ AD 是如何工作的。\n\n## 在卷积上使用自动微分\n\n假设我们有以下函数：\n\n```cpp\ntemplate <typename T>\nT\
  \ custom_function(const Eigen::Tensor<T, 2> &X, const Eigen::Tensor<T, 2> &K)\n\
  {\n  Eigen::array<int, 2> dims({0, 1});\n  auto conv = X.convolve(K, dims);\n  Eigen::Tensor<T,\
  \ 2> output = conv * conv;\n  auto loss = output.sum();\n  T result = ((Eigen::Tensor<T,\
  \ 0>)loss)(0);\n  return result;\n};\n```\n\n注意，我们再次将函数定义为模板。根据上一个示例，我们知道必须以 `Eigen::AutoDiffScalar`\
  \ 传递值。由于 `X` 和 `K` 是张量，第一要做的工作是将普通的 `float` Eigen 张量进行转换：\n\n```cpp\nauto convert\
  \ = [](const Eigen::Tensor<float, 2> &tensor, int offset, int size)\n{\n  const\
  \ int rows = tensor.dimension(0);\n  const int cols = tensor.dimension(1);\n  Eigen::Tensor<AutoDiff_T,\
  \ 2> result(rows, cols);\n  for (int i = 0; i < rows; ++i)\n  {\n    for (int j\
  \ = 0; j < cols; ++j)\n    {\n      int index = i * cols + j;\n      result(i, j).derivatives()\
  \ = Eigen::VectorXf::Unit(size, offset + index);\n      result(i, j).value() = tensor(i,\
  \ j);\n    }\n  }\n  return result;\n};\n```\n\n正如其名称所示，`convert` 使用类型 `Eigen::AutoDiffScalar<Eigen::VectorXf>`\
  \ 生成原始张量的副本。我们可以按照如下方式调用函数 `custom_function`：\n\n```cpp\n#include <unsupported/Eigen/CXX11/Tensor>\n\
  #include <unsupported/Eigen/AutoDiff>\ntypedef Eigen::AutoDiffScalar<Eigen::VectorXf>\
  \ AutoDiff_T;\nint main(int, char **)\n{\n  Eigen::Tensor<float, 2> x_in(6, 5);\n\
  \  x_in.setValues({{1, 0, -1, 1}, {5, 2, 1, -3}, {1, 3, 1, -3}, {2, 2, 2, 3}, {3,\
  \ -3, 1, -1}, {2, -1, 2, -2, 1}});\n  Eigen::Tensor<float, 2> k_in(3, 3);\n  k_in.setValues({{1,\
  \ 0, -2}, {2, 1, -2}, {-3, -2, 3}});\n  Eigen::Tensor<AutoDiff_T, 2> X = convert(x_in,\
  \ 0, x_in.size() + k_in.size());\n  Eigen::Tensor<AutoDiff_T, 2> K = convert(k_in,\
  \ x_in.size(), x_in.size() + k_in.size());\n  auto LOSS = custom_function(X, K);\n\
  \  auto [dY_dX, dY_dK] = gradients(LOSS, X, K);\n  std::cout << \"X:\\n\" << X <<\
  \ \"\\n\\n\";\n  std::cout << \"K:\\n\" << K << \"\\n\\n\";\n  std::cout << \"LOSS:\\\
  n\" << LOSS << \"\\n\\n\";\n  std::cout << \"dY_dX:\\n\" << dY_dX << \"\\n\\n\"\
  ;\n  std::cout << \"dY_dK:\\n\" << dY_dK << \"\\n\\n\";\n  return 0;\n}\n```\n\n\
  一旦 `custom_function` 返回输出值，我们可以通过以下函数解包梯度：\n\n```cpp\nauto gradients(const AutoDiff_T\
  \ &Y, const Eigen::Tensor<AutoDiff_T, 2> &X, const Eigen::Tensor<AutoDiff_T, 2>\
  \ &K)\n{\n  auto derivatives = Y.derivatives();\n  int index = 0;\n  Eigen::Tensor<float,\
  \ 2> dY_dX(X.dimension(0), X.dimension(1));\n  for (int i = 0; i < X.dimension(0);\
  \ ++i)\n  {\n    for (int j = 0; j < X.dimension(1); ++j)\n    {\n      float val\
  \ = derivatives[index];\n      dY_dX(i, j) = val;\n      index++;\n    }\n  }\n\
  \  Eigen::Tensor<float, 2> dY_dK(K.dimension(0), K.dimension(1));\n  for (int i\
  \ = 0; i < K.dimension(0); ++i)\n  {\n    for (int j = 0; j < K.dimension(1); ++j)\n\
  \    {\n      float val = derivatives[index];\n      dY_dK(i, j) = val;\n      index++;\n\
  \    }\n  }\n  return std::make_pair(dY_dX, dY_dK);\n}\n```\n\n在这个示例中，我们获取了卷积核梯度和下游梯度。注意，根据需要，你可以只计算其中之一。运行程序得到以下输出：\n\
  \n![](img/Figure_9.16.png)\n\n自动微分是一项奇且强大的技术。通过 Eigen，你可以在项目中使用 AD，而无需安装任何第三方依赖。\n\
  \n## 结\n\n本章展示了我们不需要自己计算 `F(x,y)` 的导数。Eigen 可以在底层使用 AD 自动找到它们。我们还讨论了如何获取输入的梯度。在下一章中，我们将扩展梯度下降算法来实现任意层数的反向传播。\n\
  \n## 练习\n\n1. 考虑以下高斯模糊：\n\n![](img/Figure_9.17.png)\n\n将此内核应用到图像上的视觉结果是什么？\n\n2.\
  \ 再次考虑使用 Eigen 计算内核的示例。\n\n3. 在梯度下降中包含一个条件，当梯度小于定义的阈值 `1e-7` 时停止算法。\n\n\n\n\n\n\
  # 第 10 章 反向传播算法的代码\n\n## 引言\n\n本章介绍了反向传播（backpropagation），这是训练深度神经网络的主要算法。为了实现简洁且类型无关的实现，本章结合了矩阵表达式、结构和微积分符号来描述该算法。在讨论了理论上的算法机制后，我们将进入实现阶段，从一个未优化的版本开始，它可以从数据中准确地拟合模型参数。然后，我们将讨论为了提高算法的时间空间利用率的考虑和决策，以达到世界级的性能。\n\
  \n## 结构\n\n这是本章的路线图：\n\n* 理解反向传播\n* 理解如何训练多层模型\n* 反向传播的伪代码\n* 实现反向传播的第一个版本\n* 优化反向传播的处理性能\n\
  \n## 目标\n\n本章将教你如何编写算法，使用反向传播来训练具有若干层的真实世界模型。你将理解导致算法收敛缓慢的主要瓶颈，并学会如何实现替代方案以实现高性能执行。本章还将教你如何在多核心上或使用\
  \ GPU 上进行张量计算。\n\n## 理解反向传播\n\nEigen Tensor API、其他库以及深度学习框架可以使用自动微分（auto differentiation）自动计算复杂表达式的梯度\
  \ [1]。事实证明，定义和实现梯度并不总是那么简单。因此，深度学习代码中的大多数 Bug 都存在梯度的计算中。因此，自动微分或 `autodiff` 真的值得，因为它降低了开发和维护代码的成本。那么，我们为什么还要学习反向传播呢？\n\
  \nAndrej Karpathy 是一位著名的计算机科学家，曾担任特斯拉的人智能总监和斯坦福大学教授，他写过的一名为《是的，你应该理解反向传播》[2]的文章。在正文中，Karpathy\
  \ 认为深度学习开发人员必须详细学习反向传播。\n\n根据 Karpathy 的观点，反向传播是一个泄漏的抽象（leaky abstraction），这意味着梯度消失、ReLU\
  \ 死亡和梯度爆炸等实际问题最终要求开发者了解底层的计算细节来修复它们。\n\n本书假设你应该在任何需要的时候自由地实现自己的算法。为了实现这一点，你需要理解反向传播是如何运作的。\n\
  \n## 理解如何训练多层模型\n\n反向传播算法由计算每个可训练模型参数的梯度组成。这种计算可以总结为对三个梯度的计算：\n\n* 模型输出成本的梯度\n*\
  \ 关于激活值的梯度以及\n* 关于该层输入的梯度\n\n为了让这些内容不那么抽象，让我们考虑以下四层网络作为一个示例：\n\n![](img/Figure_10.1.png)\n\
  图 10.1：4 层网络\n\n假设每层都有其相应的激活函数 `Act(Z)`，我们可以通过拆分步骤来描述该网络：\n\n![](img/Figure_10.2.png)\n\
