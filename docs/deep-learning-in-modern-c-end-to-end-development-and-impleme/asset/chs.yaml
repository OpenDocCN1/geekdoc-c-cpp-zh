  );\n    block1_conv2 = Conv2DLayer(device, block1_conv2_kernel, block1_conv2_bias,\
  \ ReLU<4>());\n    block1_pool = MaxPooling(device, 2);\n    Tensor_4D block2_conv1_kernel(kernel_size,\
  \ kernel_size, 64, 128);\n    load_tensor_from_file(block2_conv1_kernel, \"data/vgg16/imagenet/block2_conv1_kernel.txt\"\
  );\n    block2_conv1 = Conv2DLayer(device, block2_conv1_kernel, block2_conv1_bias,\
