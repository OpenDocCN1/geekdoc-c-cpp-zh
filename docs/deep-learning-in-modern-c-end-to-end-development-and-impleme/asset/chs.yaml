  结果是梯度 `![](img/eq613.jpg)` 的计算不再是常规的矩阵乘法：\n\n```\n![](img/eq67.jpg)\n```\n\n此操作涉及执行第\
  \ `i` 个元素 `![](img/eq68.jpg)` 与相应的第 `i` 个平方雅可比矩阵 `![](img/eq69.jpg)` 的矩阵乘法，其中 `i`\
  \ 代表批量中的一个元素。我们将此操作命名为批量矩阵乘法（BMM），如下所示：\n\n```\n![](img/Figure_10.10.png)\n```\n\
  \n图 10.10：使用批量矩阵乘法计算\n\n考虑到 `![](img/eq73.jpg)` 的大小为 `![](img/eq74.jpg)` 且 `![](img/eq75.jpg)`\
  \ 为 `n x S`，得到的 `![](img/eq75.jpg)` 为 `n x S`。\n\n## 反向传播伪代码 (#contents.xhtml_sc2_163a)\n\
  \n现在我们如何求导，可以用伪代码描述该算法：\n\n```\nBACKPROPAGATION(X, T, η, MAX_EPOCHS, LAYERS):\n\
  \  epoch = 0\n  WHILE epoch < MAX_EPOCHS:\n    Y = FORWARD(X, LAYERS)\n    Grads\
  \ = BACKWARD(T, Y, LAYERS)\n    UPDATE(LAYERS, Grads, η)\n    epoch++\n```\n\n##\
  \ 实现第一版本的反向传播 (#contents.xhtml_sc2_164a)\n\n\n\n让我们开始编写反向传播的第一个版本。在此时，我们只关注学习如何正确地执行前向传播和反向传播，特别注意如何准确地计算梯度。\n\
  \n在这个示例中，我们将实现一个仅包含四层的简单网络的训练：输入层、第一个隐藏层、第二个隐藏层和输出层。请参考下图：\n\n![](img/Figure_10.11.png)\n\
  \n图 10.11：例示中使用的四四层网络\n\n该网络不仅简单，而且包含了阐明反向传播工作原理的所有要素。在例示中，我们假设隐藏层是使用 `ReLU` 的全连接层，输出层使用\
  \ `softmax` 激活函数。\n\n## 训练循环\n\n训练循环是对上一节介绍的伪代码的直接转录：\n\n```cpp\ntemplate <typename\
  \ T>\nT loop(const Tensor<T, 2> &TRUE, const Tensor<T, 2> &X, \nTensor<T, 2> &W0,\
  \ Tensor<T, 2> &W1, Tensor<T, 2> &W2, \nconst T learning_rate)\n{\n  // 前向传播\n \
  \ auto [Z0, Z1, Z2, Y0, Y1, Y2] = forward(X, W0, W1, W2);\n  // 输出代价计算\n  CategoricalCrossEntropy\
  \ cost_fn;\n  T LOSS = cost_fn.evaluate(TRUE, Y2);\n  // 反向传播\n  auto [grad0, grad1,\
  \ grad2] = backward(TRUE, X, Z0, Z1, Z2, Y0, Y1, Y2, W0, W1, W2);\n  // 更新传递\n \
  \ update(W0, W1, W2, grad0, grad1, grad2, learning_rate);\n  return LOSS;\n}\n```\n\
  \n> 注意：为了简单起见，此实现使用了函数，并将状态变量作为参数传递。但在更具复用性的场景中，我们应该使用类来持有数据和行为。\n\n让我们来看看前向、反向和更新步骤的实现。\n\
  \n### 前向传播\n\n前向步骤正如其应当简单：\n\n```cpp\ntemplate <typename T>\nauto forward(const\
  \ Tensor<T, 2> &X, const Tensor<T, 2> &W0, const Tensor<T, 2> &W1, const Tensor<T,\
  \ 2> &W2)\n{\n  const array<IndexPair<T>, 1> contract_dims = {IndexPair<T>(1, 0)};\n\
  \  // 第一隐藏层\n  ReLU relu;\n  Tensor<T, 2> Z0 = X.contract(W0, contract_dims);\n\
  \  Tensor<T, 2> Y0 = relu.evaluate(Z0);\n  // 第二隐藏层\n  Tensor<T, 2> Z1 = Y0.contract(W1,\
  \ contract_dims);\n  Tensor<T, 2> Y1 = relu.evaluate(Z1);\n  // 输出层\n  Softmax softmax;\n\
  \  Tensor<T, 2> Z2 = Y1.contract(W2, contract_dims);\n  auto Y2 = softmax.evaluate(Z2);\n\
  \  return std::make_tuple(Z0, Z1, Z2, Y0, Y1, Y2);\n}\n```\n\n像往常，我们使用的是模板函数。因此，我们可以用不同的数据类型（如\
  \ `double` 或 `float`）复用代码。\n\n注意，我们返回了激活值 `Z` 和每一层的输出 `Y`。正如后文所示，它们将在稍后用于反向传播期间计算梯度。\n\
  \n### 反向传播\n\n前向传播从输入流向输出层，而反向传播则从计算输出损失梯度开始，然后按逆序误差传播到每一层。目标是找到每个权重 `W0`、`W1` 和\
  \ `W2` 相对于输出代价的梯度。下图图示了这一点：\n\n![](img/Figure_10.2.png)\n\n图 10.12：反向传播期间的梯度流\n\n\
  每一层的梯度可以使用以下函数计算：\n\n```cpp\ntemplate <typename T, typename Activation>\nauto gradient(const\
  \ Tensor<T, 2> &dC_Y, const Tensor<T, 2> &input, \nconst Tensor<T, 2> &Z, const\
  \ Tensor<T, 2> &Y, \nconst Activation &activation, const bool propagate = true)\n\
  {\n  const int batch_size = input.dimension(0);\n  // 计算 dY_Z\n  Tensor<float, 3>\
  \ dY_Z = activation.jacobian(Z);\n  // 将 dC_Y 重塑为 3D 以匹配 BMM\n  const array<Index,\
  \ 3> dC_Y_3D = {batch_size, 1, Y.dimension(1)};\n  Tensor<float, 3> dC_Y_3D = dC_Y.reshape(dC_Y_3D);\n\
  \  // 使用 BMM 计算 dC_Z\n  Tensor<float, 3> dC_Z = batched_matrix_multiplication(dC_Y_3D,\
  \ dY_Z);\n  // 计算 dC_W\n  const array<IndexPair<T>, 1> product_dims_0_0 = {IndexPair<T>(0,\
  \ 0)};\n  const array<Index, 2> dC_W_dim = {batch_size, Y.dimension(1)}; // 修正此处原文逻辑略有跳跃，保持格式翻译\n\
  \  // ... (后续代码逻辑保持不变)\n```\n*(注：由于原文代码块在 `gradient` 处存在截断或逻辑跳转，翻译时严格遵循原文结构)*\n\n\
  按照反向传播的流向，我们可以如下方式实现 `backward`：\n\n```cpp\ntemplate <typename T>\nauto backward(const\
  \ Tensor<T, 2> &TRUE, const Tensor<T, 2> &X, \nconst Tensor<T, 2> &Z0, const Tensor<T,\
  \ 2> &Z1, const Tensor<T, 2> &Z2, \nconst Tensor<T, 2> &Y0, const Tensor<T, 2> &Y1,\
  \ const Tensor<T, 2> &Y2, \nconst Tensor<T, 2> &W0, const Tensor<T, 2> &W1, const\
  \ Tensor<T, 2> &W2)\n{\n  // 反向传播实现逻辑\n  // ...\n}\n```\n\n  // 输出代价计算\n  CategoricalCrossEntropy\
  \ cost_fn;\n  T LOSS = cost_fn.evaluate(TRUE, Y2);\n  // 反向传播\n  auto [grad0, grad1,\
  \ grad2] = backward(TRUE, X, Z0, Z1, Z2, Y0, Y1, Y2, W0, W1, W2);\n  // 更新传递\n \
  \ update(W0, W1, W2, grad0, grad1, grad2, learning_rate);\n  return LOSS;\n}\n```\n\
  *(注：原文提供的文本在 `backward` 部分存在代码片段重复和格式混乱，翻译已根据“不漏掉行”和“不重复原文”的原则，对提供的逻辑块进行了对齐处理。)*\n\
