  \n# 第 9 章 编写梯度下降算法 (#contents.xhtml_ch09a)\n\n## 引言\n\n本章开启了本书的第三部分：训练深度学习模型。在这里，我们将介绍梯度下降算法，这是最重要、或者可能是最重要的深度学习算法之一。在本章中，我们将重新回顾梯度的主题，引入自动微分——一种自动计算梯度的技术。本章将通过一个实践实验结束，使用梯度下降和卷积训练一个小型网络。\n\
  \n## 结构\n\n这是本章的路线图：\n\n*   介绍梯度下降\n*   回顾梯度\n*   实现梯度下降算法\n*   卷积的梯度\n*   使用自动微分\n\
  \n## 目标\n\n本章是理解后续介绍的更复杂算法的基础。通过阅读本章，你将能够利用书中目前看到的概念实现梯度下降算法，并数据训练单层网络。你将理解如何计算卷积层的梯度，以及如何使用它来更新内核（kernel）。最后，你将学会如何使用\
  \ `Eigen` 实现自动微分。\n\n## 介绍梯度下降\n\n假设你正在度假，花时间爬越的一座山丘。一切都很顺利，但突然大雾笼罩了该地区。你开始对大雾感到担心，决定在山脚下和朋友集合。你不知道他们的确切位置，只知道他们在山底最低点。请参考下图：\n\
  \n![](img/Figure_9.1.png)\n\n图 9.1：下山寻找朋友的隐喻\n\n由于大雾的影响，你看不远。你决定检查附近最陡峭的下坡，希望找到你的朋友。保持这种策略，经过一段时间和运气后，你终于到达了山脚，看到了你的朋友。\n\
  \n![](img/Figure_9.2.png)\n\n图 9.2：在代价函数表面上搜索\n\n这个假设的场景与训练机器学习模型的任务非常相似。在代价曲面上搜索就像下山寻找朋友。训练算法不是在山上行走，而是在图\
  \ 9.2 所示的多维代价曲面上导航。斜率等于梯度，决策过程也是相同的：向着更大的下坡方向移动并寻找表面的最低点。实现这种搜索的算法被称为梯度下降。\n\n##\
  \ 回顾梯度\n\n梯度是函数的斜率。在给定点计算函数梯度的操作称为偏导数。我们使用一种特殊的符号来表示偏导数。例如：\n\n![](img/eq110.jpg)\n\
  \n这种符号并不表示除法或分数。在这种情况下，![](img/eq28.jpg) 表示函数 `F` 对变量 `x` 的偏导数。函数可以有多个偏导数。例如，以下函数：\n\
  \n![](img/eq31.jpg)\n\n它有两个偏导数，即 ![](img/eq41.jpg) 和 ![](img/eq52.jpg)。\n\n仅使用符号并不能提示如何求导。通过查阅微积分书籍\
  \ [1]，我们可以找到一些计算导数的规则，例如：\n\n| 常数的导数 | ![](img/eq111.jpg) |\n| :--- | :--- |\n|\
  \ 线性导数 | ![](img/eq2.png) |\n| 二次导数 | ![](img/eq32.jpg) |\n| 三次导数 | ![](img/eq42.jpg)\
  \ |\n| 和的导数 | ![](img/eq51.jpg) |\n| 链法则 | ![](img/eq62.jpg) |\n\n表 9.1：常用导数规则\n\
  \n使用这些规则，我们可以如下找到 ![](img/eq61.jpg)：\n\n![](img/eq7.png)\n\n同样，我们可以找到 ![](img/eq81.jpg)\
  \ ：\n\n![](img/eq91.jpg)\n\n| 注意：函数的导数本身也是函数。 |\n\n始终值得记住梯度的真正含义：表面的斜率。下图描述了这一点：\n\
  \n![](img/Figure_9.3.png)\n\n图 9.3：x = 2, y = 3 处的表面和梯度\n\n最后一个图说明了 `F(x,y)` 代表三维空间中的表面。表面\
  \ `F(a, b)` 的每一个点 (a, b) 都有两个斜率 ![](img/eq101.jpg) 和 ![](img/eq111.jpg)。图像分别代表了点\
  \ (a, b) 处沿 `x` 和 `y` 方向的表面斜率。\n\n对于我们这些从事机器学习的人来说，这些斜率相关，因为梯度下降使用它们来更新参数。 | 注意：我们向想要学习更多的读者推荐《Practical\
  \ Mathematics for AI and Deep Learning—Tamoghna and Shravan, 2022》。在现实问题中，`F` 通常不是两个变量\
  \ `x` 和 `y`，而是定义在 100、1000 或更多变量上。当然，在这种情况下绘制函数表面是不可能的。\n\n## 实现梯度下降算法\n\n尽管使用求导规则计算偏导数存在挑战，但梯度下降算法非常直观。我们可以通过以下伪代码描述其行为\
  \ [2]：\n\n```\nGradient-Descent (W, X, T, η, C, EPOCHS) :\n\nBEGIN:\n  for each\
  \ epoch in EPOCHS:\n    Y = forward(X)\n    ∇W = backward(Y, T, C)\n    W = W -\
  \ η ∇W\nEND\n```\n\n其中：\n\n*   `W` 是可训练参数\n*   `∇W` 是 `W` 的梯度\n*   `X` 是输入集\n* \
  \  `T` 是期望输出集\n*   `EPOCHS` 是算法运行的最大\n*   `η` 是学习率\n*   `C` 是代价函数\n\n梯度下降的目标是找到使代价函数\
  \ `C` 值最小的参数 `W`。换句话说，算法搜索使 `C(X; W)` 最小的 `W` 值。在这种背景下，参数 `W` 通常被称为可训练参数。为了找到 `W`\
  \ 的最优值，梯度下降通过以下规则不断更新 `W` 的策略：\n\n![](img/eq121.jpg)\n\n在该方程中，`η` 是一个称为学习率的标量，控制参数更新。\n\
  \n| 注意学习率 `η` 不是模型参数。事实上，`η` 是训练算法的参数。 |\n\n通常，前向传播和更新步骤是算法中最简单且计算消耗最低的部分。因此，大部分处理时间用于计算\
  \ 。\n\n下一节将通过一个具有洞察力的实用卷积实验演示梯度下降的实现。\n\n## 为数据拟合卷积内核 (#sc3_140a)\n\n在第 4 章 实现卷积]\
  \ 中，我们学习了如何使用 Sobel 内核检测图像中的边缘，如下：\n\n![](img/Figure_9.4.png)\n\n\n\n\n\n# 图 9.4：使用卷积检测边缘\n\
  \n如果我们使用梯度下降来执行逆向操作会怎样？也就是说，给定一张图像及其边缘，我们该如何估计卷积核？接下来的章节将展示如何实现这一点。\n\n## 加载图像数据集\n\
  \n该实验通过对一组图像应用已知卷积核来生成一个合成数据集。接下来，我们使用原始数据集和合成数据集来训练一个新的卷积核。我们的目标是评估训练重建原始卷积核的能力。因此，最后我们比较两个卷积核以评估它们是否相似。\n\
  \n以下代码从指定文件夹加载图像，生成一个对 `(X, T)`，其中 `T` 是 `Sobel` 滤波器对 `X` 进行卷积的结果：\n\n```cpp\n#include\
  \ <filesystem>\n\nnamespace fs = std::filesystem;\n\n#include <opencv2/opencv.hpp>\n\
  #include <opencv2/core/eigen.hpp>\n\ncv::Mat resize_image(const cv::Mat &image,\
  \ int target_rows, int target_cols)\n{\n  const int image_rows = image.rows;\n \
  \ const int image_cols = image.cols;\n  int new_rows = 0;\n  int new_cols = 0;\n\
  \n  if (image_rows > image_cols) {\n    new_rows = target_rows;\n    new_cols =\
  \ image_cols * target_rows / image_rows;\n  } else {\n    new_cols = target_cols;\n\
  \    new_rows = image_rows * target_cols / image_cols;\n  }\n  cv::Mat resized;\n\
  \  resize(image, resized, cv::Size(new_cols, new_rows), cv::INTER_LINEAR);\n  cv::Mat\
  \ result = cv::Mat::zeros(cv::Size(target_cols, target_rows), CV_8UC1);\n  resized.copyTo(result(cv::Rect((target_cols\
  \ - new_cols)/2, (target_rows - new_rows)/2, resized.cols, resized.rows)));\n  return\
  \ result;\n}\n\nauto load_dataset(const std::string data_folder, const Eigen::Tensor<float,\
  \ 2> &Gen, const Eigen::Index image_size) {\n  std::vector<std::string> files;\n\
  \  for (const auto &entry : fs::directory_iterator(data_folder)) {\n    files.push_back(data_folder\
  \ + entry.path().c_str());\n  }\n  Eigen::Tensor<float, 3> X(files.size(), image_size,\
  \ image_size);\n  Eigen::Tensor<float, 3> T(files.size(), image_size, image_size);\n\
  \  const Eigen::array<Eigen::Index, 3> extent = {1, image_size, image_size};\n \
  \ Eigen::array<std::pair<int, int>, 3> padding;\n  padding[0] = std::make_pair(1,\
  \ 1);\n  padding[1] = std::make_pair(1, 1);\n  padding[2] = std::make_pair(0, 0);\n\
  \n  for (unsigned int i = 0; i < files.size(); ++i) {\n    const auto &file = files[i];\n\
  \    cv::Mat image = cv::imread(file, cv::IMREAD_GRAYSCALE);\n    cv::Mat formatted_image\
  \ = resize_image(image, image_size, image_size);\n    cv::Mat frame32f;\n    formatted_image.convertTo(frame32f,\
  \ CV_32F);\n    frame32f /= 255.f;\n    Eigen::Tensor<float, 3> eigen_frame(image_size,\
  \ image_size);\n    cv::    eigen2frame22f, eigen_frame);\n    Eigen::Tensor<float,\
  \ 3> convolved(image_size, image_size, 1);\n    Eigen::array<int, 2> dims({0, 1});\n\
  \    convolved = eigen_frame.pad(padding).convolve(Gen, dims);\n    Eigen::array<Eigen::Index,\
  \ 3> offset = {i, 0, 0};\n    Eigen::array<Eigen::Index, 3> new_image_size, image_size,\n\
  \    };.\n(slice.slice( =, = = = =frameframe\n\n\n....(( = = = = =\n\n((\n  \n\n\
  }\n}\n\n**注意：** 我们使用 OpenCV 来加载图像。OpenCV 是一个包含计算机视觉算法和图像处理例程序的开源库。你可以从二进制发行版下载并安装。\n\
  \n`T` 的每个元素都是图像与 `Sobel` 卷积核卷积的结果，如图 9.5 所示：\n\n```cpp\nEigen::Tensor<float, 3>\
  \ convolved(image_size, image_size, 1);\nEigen::array<int, 2> dims({0, 1});\nconvolved\
  \ = eigen_frame.pad(padding).convolve(Gen, dims);\n```\n9.5：用于生成示例数据集的卷积核\n\n注意我们使用\
  \ SAME 卷积来获取与张量 `X` 维度相同的张量 `T`，如图 9.6 所示：\n\n```cpp\nEigen::array<std::pair<int,\
  \ int>, 3> padding;\npadding[0] = std::make_pair(1, 1);\npadding[1] = std::make_pair(1,\
  \ 1);\npadding[2] = std::make_pair(0, 0);\n```\n9.6：来自张量 `X` 的源图像和来自张量 `T` 的卷积图像\n\
  \n一旦我们有了数据，就是训练模型的时候了。\n\n## 训练卷积核\n\n我们的目标是用梯度下降来拟合包含 `(X, T)` 实例的数据集的卷积核。前向传播仅包括与训练卷积核的卷积：\n\
  \n```cpp\nauto convolution2D = [](const Eigen::Tensor<float, 3> &input, const Eigen::Tensor<float,\
  \ 2> &kernel) {\n  Eigen::array<std::pair<int, int>, 3> padding;\n  padding[0] =\
  \ std::make_pair(0, 0);\n  padding[1] = std::make_pair(1, 1);\n  padding[2] = std::make_pair(1,\
  \ 1);\n  auto padded = input.pad(padding);\n  Eigen::array<int, 2> dims({1, 2});\n\
  \  Eigen::Tensor<float, 3> result = padded.convolve(kernel, dims);\n  return result;\n\
  };\n\nauto forward = [](const Eigen::Tensor<float, 3> &X, const Eigen::Tensor<float,\
  \ 2> &kernel) {\n  return convolution2D(X, kernel);\n};\n```\n\n现在，我们可以使用合适的代价函数来计算输出代价。在这个实验中，我们选择使用均方代价：\n\
  \n```cpp\nauto MSE = [](const Eigen::Tensor<float, 3> &T, const Eigen::Tensor<float,\
  \ 3> &Y) {\n  auto diff = T - Y;\n  auto quadratic = diff * diff;\n  Eigen::Tensor<float,\
  \ 0> sum = quadratic.sum();\n  float result = sum(0) / Y.size();\n  return result;\n\
  };\n```\n\n在获得代价后，我们可以在反向传播中计算卷积核的梯度：\n\n```cpp\nauto BatchedConvolution = [](const\
  \ Eigen::Tensor<float, 3> &A, const Eigen::Tensor<float, 2> &B) {\n  Eigen::array<std::pair<int,\
  \ int>, 3> padding;\n  padding[0] = std::make_pair(0, 0);\n  padding[1] = std::make_pair(1,\
  \ 1);\n  padding[2] = std::make_pair(1, 1);\n  int batch_size = A.dimension(0);\n\
  \  int dim1 = A.dimension(1);\n  int dim2 = A.dimension(2);\n  Eigen::Tensor<float,\
  \ 3> output(batch_size, dim1, dim2);\n  auto padded = A.pad(padding);\n  Eigen::array<int,\
  \ 2> conv_dims({1, 2});\n  output = padded.convolve(B, conv_dims);\n  return output;\n\
  };\n\nauto backward = [](const Eigen::Tensor<float, 3> &X, Eigen::Tensor<float,\
  \ 3> &T, Eigen::Tensor<float, 3> &Y) {\n  auto DIFF = Y - T;\n  Eigen::Tensor<float,\
  \ 3> batch = BatchedConvolution(X, DIFF);\n  Eigen::array<Eigen::Index, 2> two_dims{batch.dimension(1),\
  \ batch.dimension(2)};\n  Eigen::Tensor<float, 2> result = batch.reshape(two_dims);\n\
  \  result = result.constant(2.f / X.size());\n  return result;\n};\n```\n\n在计算梯度后，我们最终更新卷积核，所示：\n\
  \n```cpp\nauto update = grad * grad.constant(learning_rate);\nkernel -= update;\n\
  ```\n\n我们可以调用这三个例程在循环中实现梯度下降，如下：\n\n```cpp\nEigen::Tensor<float, 2> kernel(3, 3);\n\
  kernel = kernel.random();\nconst int MAX_EPOCHS = 5000;\nconst double learning_rate\
  \ = .1;\nint epoch = 0;\nwhile (epoch < MAX_EPOCHS) {\n  auto output = forward(X,\
  \ kernel);\n  auto grad = backward(X, T, output);\n  auto update = grad * grad.constant(learning_rate);\n\
  \  kernel -= update;\n}\n```\n\n\n\n\n\n```cpp\n17.  std::cout << \"epoch:\\t\"\
  \ << epoch << \"\\tloss:\\t\" << loss << \"\\n\";\n18.  epoch++;\n19.  }\n21.  std::cout\
  \ << \"\\nGenerative kernel is:\\n\\n\" << std::fixed << std::setprecision(2) <<\
  \ Sobel_Gx << \"\\n\\n\";\n22.  std::cout << \"\\nTrained kernel is:\\n\\n\" <<\
  \ std::fixed << std::setprecision(2) << kernel << \"\\n\\n\";\n```\n\n运行这段代码将得到如下输出：\n\
  \n![](img/Figure_9.7.png)\n\n图 9.7：从数据重建 Sobel 卷积核\n\n如预期，得到的卷积核与原始 Sobel 卷积核相似。我们可以绘制随\
  \ epoch 变化的损失曲线，以确认算法确实在起作用\n\n![](img/Figure_9.8.png)\n\n图 9.8：训练损失曲线\n\n这种熟悉的形状表明算法正在持续地向最小成本拟合卷积核。然而，一万个\
  \ epoch 的训练时间非常长。我们可以思考如何通过多种方式改进梯度下降来缩短这段时间。将在下一节中讨论。\n\n### 扩展梯度下降\n\n我们可以将梯度下降视为一个探索和扩展旨在获得更好、更快结果方法的平台。例如：\n\
  \n*   与其传递单个 batch 的图像，不如使用一个包含少量图像的 mini-batches 列表；\n*   我们可以尝试不同的更新可训练参数的方法。例如，我们可以记住上一次更新并与当前更新结合，以获得平滑且更快的搜索。实现这种逻辑的组件被称为优化器，如\
  \ `Momentum` 和 `RMSProp`。\n*   我们可以包含回调函数来执行异步任务，例如将可训练参数的中间副本保存到文件中。\n*   我们可以使用并行计算（如多线程或\
  \ GPU 编程）来减少计算时间。\n*   我们可以实现更复杂的逻辑来提前停止训练。例如，我们可以检查损失在连续 epoch 后是否不再减少。\n*   我们可以使用备用的验证数据集（填充了未用于拟合卷积核的数据）来检查模型性能。这有助于我们区分过拟合模型和良好的模型。\n\
  \n这些许多改进将在接下来的章节中介绍。现在，让我们先理解卷积核梯度是如何计算的。\n\n### 卷积的梯度\n\n记住如何计算简单的卷积，如下图所示：\n\n\
  ![](img/Figure_9.9.png)\n\n图 9.9：计算卷积\n\n我们可以如下如下定义卷积：\n\n![](img/eq131.jpg)\n\n\
  在卷积中，每个输出系数都是卷积核与输入中相应区域之间点积的结果。卷积核是一个可训练参数。因此，在梯度下降执行期间，我们需要计算卷积核梯度 ![](img/eq141.jpg)。\n\
  \n使用链式法则，可以发现以下方程给出了成本 `C` 关于卷积核 `K` 的梯度 [5]：\n\n![](img/eq151.jpg)\n\n其中 `X` 是输入，![](img/eq161.jpg)\
  \ 是成本关于输出 `Y` 的梯度（有时称为上游梯度）。\n\n> 注意：卷积的梯度是另一个卷积，这非常奇奇（而且非常有意义）。\n\n假设 ![](img/eq171.jpg)\
  \ 是：\n\n![](img/Figure_9.10.png)\n\n图 9.10：上游梯度\n\n卷积核梯度 ![](img/eq181.jpg) 通过以下得出：\n\
  \n![](img/Figure_9.11.png)\n\n图 9.11：计算卷积核梯度\n\n### 下游梯度\n\n到本书为止，我们一直使用链式法则来寻找可训练参数的梯度，例如卷积核\
  \ `K` 或来自全连接层的权重 `W`。然而，在某些情况下，有必要计算关于输入 `X` 的梯度，表示为：\n\n![](img/eq191.jpg)\n\n\
  其中 `X` 是层输入。在这种语境下，该梯度被称为下游梯度。在卷积的情况下，下游梯度 ![](img/eq201.jpg) 由 [3]给出：\n\n![](img/eq211.jpg)\n\
  \n其中卷积核 `K` 顺时针旋转 180 度 [4]：\n\n![](img/Figure_9.12.png)\n\n图 9.12：卷积核旋转 180 度\n\
  \n除了旋转卷积核，梯度计算还使用填充值来适应 `X` 的最终尺寸：\n\n![](img/Figure_9.13.png)\n\n图 9.13：计算下游梯度\n\
  \n以下代码示例了 ![](img/eq221.jpg) 和 ![](img/eq231.jpg) 的计算：\n\n```cpp\n1.  #include <iostream>\n\
