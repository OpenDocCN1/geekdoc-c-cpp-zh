  \ kernel_size, 3, 64);\n    load_tensor_from_file(block1_conv1_kernel, \"data/vgg16/imagenet/block1_conv1_kernel.txt\"\
  );\n    block1_conv1 = Conv2DLayer(device, block1_conv1_kernel, block1_conv1_bias,\
