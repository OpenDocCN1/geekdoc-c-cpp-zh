  \n## 生成随机数 (#contents.xhtml_sc26)\n\n某些深度学习算法具有内在的随机行为。例如，我们经常使用随机生成的数字来初始化模型参数。C++11\
  \ 引入了内置随机数生成器，提供了一种更容易的方法来生成特定特定分布的随机数。这些功能在 `<random>` 头文件中。让我们从一个正态分布的直观示例开始：\n\
  \n```cpp\n#include <cmath>\n#include <iomanip>\n#include <iostream>\n#include <map>\n\
  #include <random>\n#include <string>\n\nstd::random_device rd {};\nint main(int,\
  \ char**)\n{\n  std::mt1937 random_generator {rd()};\n  std::normal_distribution<>\
  \ distro {2, 3};\n  std::map<int, int> histogram;\n\n  for (int n = 0; n < 10000;\
  \ ++n) {\n    int val = std::round(distro(random_generator));\n    histogram[val]++;\n\
  \  }\n\n  for (auto [x, y] : histogram) {\n    std::cout << std::setw(2) << x <<\
  \ ' ' << std::string(y / 20, '*') << '\\n';\n  }\n  return 0;\n}\n```\n\n此代码绘制了一个均值为\
  \ 2，标准差为 3 的正态分布简易图：\n\n![](img/Figure_2.png)\n图 2.9: 正态分布的钟形\n\n正如预期的，正态分布图具有这种特征性的钟形。如果我们替换正态分布：\n\
  \n`std::normal_distribution<> distro {2, 3};`\n\n为均匀分布：\n\n`std::uniform_real_distribution<>\
  \ distro {-10, 13};`\n\n我们得到与下面相似的结果：\n\n![](img/Figure_2.png)\n图 2.10: 均匀分布的矩形形状\n\
  \n与正态分布不同，均匀分布具有这种矩形形状，如所示。\n\n\n\n\n```cpp\n#include <iostream>\n#include <map>\n\
  #include <random>\n#include <string>\n\nstd::random_device rd {};\n\nint main(int,\
  \ char**)\n{\n  const unsigned int seed = rd();\n  std::mt19937 random_generator\
  \ {seed};\n\n  std::uniform_real_distribution<> distro {-10, 13};\n  std::uniform_real_distribution<>\
  \ distro2 {-5, 8};\n  std::uniform_real_distribution<> distro3 {3, 9};\n  std::uniform_real_distribution<>\
  \ distro4 {-8, -1};\n  std::uniform_real_distribution<> distro5 {-10, 10};\n\n \
  \ std::map<int, int> histogram;\n\n  for (int n = 0; n < 10’000; ++n) {\n    double\
  \ val = distro(random_generator);\n    val += distro2(random_generator);\n    val\
  \ += distro3(random_generator);\n    val += distro4(random_generator);\n    val\
  \ += distro5(random_generator);\n    val /= 5.;\n    histogram[std::round(val)]++;\n\
  \  }\n\n  for (auto [x, y] : histogram) {\n    std::cout << std::setw(2) << x <<\
  \ ' ' << std::string(y / 20, '*') << '\\n';\n  }\n\n  std::cout << distro(random_generator)\
  \ << \"\\n\";\n  return 0;\n}\n```\n\n这段代码如何帮助我们检查随机包是否在正常工作？根据 Rényi 的观点 [9]：\n\
  \n“…在非常通用的条件下，大量独立随机变量之和的分布趋于正态分布”。\n\n这一发现被称为中心极限定理（CLT）。中心极限定理解释了为什么正态分布在实际场景、自然现象以及\
  \ ML 模型中如此频繁地遇到。根据中心极限定理，任何类型的随机变量之和都呈现正态分布的形状。这正是代码的意图：\n\n![images/Figure_2.11.png)\n\
  \n图 2.11: 均匀分布之和的钟形\n\n这个简单的实验表明，随机包确实在执行它应该做的工作，至少在中心极限趋势方面。\n\n由于（伪）内置随机生成功能，每当我们运行此程序时，结果略有不同。如果我们需要控制随机性以获得可重复的结果怎么办？在这种情况下，我们可以静态设置种子：\n\
  \n```cpp\nint main(int, char**)\n{\n  const unsigned int seed = 1234;\n  std::mt19937\
  \ random_generator {seed};\n  ...\n}\n```\n\n现在，程序每次执行都会输出相同的的结果。\n\n值得注意的是，`<random>`\
  \ 头文件中提供的内置统计分布仅专为随机数生成而设计。在下一章中，我们将介绍 Boost 统计包，在其中我们可以找到更完整的统计分布实现。\n\n## 向量化\n\
  \n在编写任何代码时，有两个主要的关注点：\n\n*   代码必须提供正确的输出\n*   代码执行必须足够快。\n\n当然，并不总是能够同时实现这两个目标。在这里我们将讨论向量化，这是一种现代方法，允许我们充分利用\
  \ CPU 资源，在不影响算法输出质量的情况下实现更快的算法执行。\n\n向量化是一个通用术语，指的是某些处理单元 [10][11] 并行执行独立算术操作的能力，通过执行单元的数量来减少整体计算时间。\n\
  \n注意，向量化并不提供与线程提供的相同的并行类型（线程中是不同的代码序列以并发方式执行）。\n\n向量化的核心思想是并行执行顺序的独立操作。考虑以下示例：\n\
  \n```cpp\nfor (int i = 0; i < 1024; i++) {\n  A[i] = A[i] + B[i];\n}\n```\n\n支持向量化的编译器会将此代码替换为类似的内容：\n\
  \n```cpp\nfor(i=0; i < 512; i += 2) {\n  A[i] = A[i] + B[i];\n  A[i + 1] = A[i +\
  \ 1] + B[i + 1];\n}\n```\n\n如果底层硬件（CPU）也支持向量化，循环内部的两个操作将并行执行，理论上将整体处理时间减少一半。这之所以可能，是因为\
  \ CPU 拥有复制的资源，例如复制的寄存器，它们的作用类似于两个独立的执行单元。\n\n| 注意：在实践中，将数据复制到并行寄存器存在一些开销。因此，使用向量化带来的性能提升并不总是线性的。\
  \ |\n\n在具有四个执行单元的硬件上，循环将按如下展开：\n\n```cpp\nfor(i=0; i < 256; i += 4) {\n  A[i] =\
  \ A[i] + B[i];\n  A[i + 1] = A[i + 1] + B[i + 1];\n  A[i + 2] = A[i + 2] + B[i +\
  \ 2];\n  A[i + 3] = A[i + 3] + B[i + 3];\n}\n```\n*（注：原文中的展开循环是不完整的，我根据“四个执行单元”的描述进行了重构）。*\n\
  \n这组新指令使得速度快了近 4 倍。向量化非常有用，首先因为它在不影响程序输出的情况下提高了执行性能；其次，它是由编译器实现的，不需要程序员的直接干预。因此，通常情况下不需要修改源码。\n\
  \n*   确保编译器支持向量化至关重要\n*   循环边界必须在循环开始之前已知（通常通过字面量或变量）\n*   体内的指令不应引用之前的状态\n*   体内的指令必须是简单的线性代码。复杂的逻辑、子程序、嵌套循环和函数调用会阻止向量化。\n\
  \n遵循这些规则可能是困难的。确定代码是否以向量化运行的一种方法是检查编译器生成的机器码，寻找特定的向量化指令。这无疑是耗时的且并不简单。\n\n根据经验法则，使用`<algorithm>`、`<functional>`\
  \ 和 `<numeric>` 头文件的流线型代码结合 STL 容器更容易被向量化。\n\n## 深度学习中的向量化\n\n在现实世界的深度学习项目中，向量化通过减少整体训练时间或推理时间起着重要作用。例如，在训练期间，被称为“批量”的训练子集是以向量化的方式处理的。\n\
  \n本书示例使用的线性代数库 Eigen 以向量化的方式执行矩阵运算。正因如此，我们通常将行数据聚合为批量以实现更快的操作。考虑以下示例：\n\n![images/Figure_2.12.png)\n\
  \n图 2.12: 向量化操作\n\n在这个示例中，与其使用这六个输入向量（X0, X1, X2, X3, X4 和 X5）分别执行六次内积，我们更倾向于将它们堆叠成单个矩阵。然后，我们可以运行单个\
  \ `mulmat` 乘法来实现相同的结果，但速度更快。\n\n## Eigen 中的向量化\n\nEigen 拥有内置的向量化系统，如果编译器和底层硬件支持向量化，该系统默认开启。请查看文档\
  \ [14] 以了解如何在 Eigen 中设置向量化的细节。\n\n## 结论\n\n\n\n\n\n在本章中，我们介绍了一些用于编写深度学习算法的相关编程技术和\
  \ API。我们讨论了现代 C++ 特性，特别是函数式编程，这些特性允许我们以更加友的方式开发出更可靠、更快速的代码。介绍了书中示例使用的 C++ 线性代数库\
  \ `Eigen`，并简要讨论了它的某些特性。我们通过讨论向量化结束了本章，并列出了一些编写可向量化程序的指南，以实现更快的执行速度。\n\n## 练习题](#contents.xhtml_sc2_31a)\n\
  \n1. 使用 `Eigen` 编写一个程序对矩阵进行垂直或水平翻转。\n2. 使用 `Eigen` 编写一个程序将矩阵顺时针或逆时针旋转 90 度。\n3.\
  \ 使用 `lambdas` 编写一个函数，寻找任意整数向量中最小的 k 个数。\n\n## 参考文献](#contents.xhtml_sc2_32a)\n\n\
