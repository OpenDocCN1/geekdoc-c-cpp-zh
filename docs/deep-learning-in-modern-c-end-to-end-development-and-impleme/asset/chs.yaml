  \ weight_decay = (learning_rate * L2_weight_decay_lambda / batch_size);\n      \
  \  Tensor_2D decay = weight.constant(weight_decay) * this->weight;\n        weight_update\
  \ = weight_update - decay;\n    }\n    this->weight = this->weight + weight_update;\n\
  }\n```\n\n现在，我们可以这样设置 `L2_weight_decay_lambda`：\n\n```cpp\nModel(Device &device,\
  \ const int hidden_layer_size) {\n    //...\n    dense_1->set_L2_weight_decay_lambda(10);\n\
  \    dense_2->set_L2_weight_decay_lambda(10);\n    output_layer->set_L2_weight_decay_lambda(10);\n\
  }\n```\n\n在此此更改后，再次运行训练将导致：\n\n![](img/Figure_11.16.png)\n\n图 11.16：使用 L2 正则化\n\n\
  同样地，我们可以进行 `L1` 正则化：\n\n```cpp\nvoid update(const TYPE learning_rate, int epoch)\
  \ {\n    Tensor_2D weight_update = this->weight_grad * this->weight_grad.constant(-learning_rate);\n\
  \    if (this->L1_weight_decay_lambda > 0) {\n        const int batch_size = this->output.dimension(0);\n\
  \        TYPE weight_decay = (learning_rate * this->L1_weight_decay_lambda / batch_size);\n\
  \        auto signal_decay = this->weight.unaryExpr([](TYPE val){return book::utils::signal(val);});\n\
  \        Tensor_2D decay = signal_decay.constant(weight_decay) * this->weight;\n\
  \        weight_update = weight_update - decay;\n    }\n    this->weight = this->weight\
  \ + weight_update;\n    if (this->use_bias) {\n        auto bias_update = this->bias_grad\
  \ * this->bias_grad.constant(-learning_rate);\n        this->bias = this->bias +\
  \ bias_update;\n    }\n}\n```\n\n同样设置 `L1_weight_decay` 的结果如下：\n\n![](img/Figure_17.png)\n\
  \n图 11.17：使用 L1 正则化\n\n| 注意：同时使用 L1 和 L2 是没有问题的。 |\n\n`L1` 和 `L2` 的作用是强制权重接近零。正因如此，它们被称为权重衰减（weight\
  \ decay）。\n\n## 实验 4：数据增强\n\n在现实项目中，数据稀缺是过拟合最常见的来源之一。从实际角度来看，这是一个真实的问题，因为高质量数据往往难以获取。对于此类场景，即使是之前的正则化方法可能会失效。\n\
  \n| 注意：数据稀缺是过拟合最常见的原因。 |\n\n数据增强是针对只有少量数据可用的场景的替代方案。在数据增强中，我们通过包含新的副本来人工增加训练数据。这些新副本是原始数据的软克隆或硬克隆。\n\
  \n为了模拟过拟合，我们通过数据增强来增加数据集：\n\n![](img/Figure_11.15.png)\n\n图 11.15：使用早停法\n\n在实践中，早停总是被使用的。\n\
  \n为了模拟过拟合，我们通过数据增强来增加数据集：\n\n![](img/Figure_11.16.png)\n\n图 11.16：使用 L2 正则化\n\n\
  为了模拟过拟合，我们通过数据增强来增加数据集：\n\n![](img/Figure_17.png)\n\n图 11.17：使用 L1 正则化\n\n\n\n\n\
  \n```cpp\n41. // 包含原始数据+增强实例数据集\n42. auto [training_images, training_labels] = augment_dataset(training_images_original,\
  \ training_labels_original, 100);\n43. ...\n44. }\n```\n\n在此代码中，每个新副本都是通过有回抽样采样的，然后在\
  \ [-30°, 30°] 范围内的随机角度旋转。\n\n使用增强数据训练模型得到的性能如下：\n\n![](img/Figure_11.19.png)\n\n\
  图 11.19：使用增强数据进行训练\n\n在本次实验中，我们实际上通过增强实例来增加训练实例的数量。请注意，增强实例是在运行时创建的。这种方法被称为**在线数据增强**。在离线数据增强中，增强实例会被生成并保存到磁盘上供以后使用。本书后面将将介绍这两种方法的优缺点以及数据增强中的其他重要方面。\n\
  \n# DropOut\n\n`DropOut` 是一种基于断开一个或多个模型单元思想的深度学习模型正则化中最成功的拓扑方法。\n\n简单来说，在训练期间，一个或多个神经元（单元）会从网络中断开一段时间，例如一个轮（epoch）。断开的神经元使用二项分布进行采样。在\
  \ dropout 中，断开神经元的概率是一个数字 `p`，其中 `0 < p < 1`。因此，每个神经元不被断开的概率为 `1 – p`。`1 – p` 被保留概率（keep\
  \ probability）。在每一步中，断开的神经元会重新连接，并在下一次运行中可以再次被断开或保留。\n\n这种机制减少过拟合的原因有很多。最被接受的解释是\
  \ dropout 向训练注入了噪声，减少了模型记忆训练数据集的机会。\n\n## 实现 DropOut\n\n在实现方面，dropout 有两种工作场景：训练和预测。\n\
  \n在训练期间，我们并没有完全断开单元。而是生成一个由零和一构成的掩码 `M`，其中零表示断开的单元，一表示连接的神经元。该掩码同时用于正向传播和反向传播。我们可以将其公式化如下：\n\
  \n![](img/eq123.jpg)\n\n其中，\n\n![](img/eq133.jpg)\n\n因此，每个单元 `i` 有概率 `p` 被断开，有概率\
  \ `(1 - p)` 被保留。`p` 的值不需要每层都相同。对于输出层，通常 `p = 0`，这意味着 dropout 机制不在输出层作用。对于隐藏层，像任何其他超参数一样，`p`\
  \ 必须通过实验定义。`p` 的常用值为 `0.1`、`0.2`、`0.3`、`0.5` 和 `0.8`。\n\n模型训练完成后，就可以进行预测。当模型进行预测时，我们需要考虑训练阶段单元的丢弃。考虑到这一点，dropout\
  \ 的原始论文建议通过 `(1 – p)` 的值对输出进行缩放：\n\n![](img/eq143.jpg)\n\n但这并不是 dropout 实现的最常用的方法。通常，人们使用一种称为倒置\
  \ dropout（inverted dropout）的方法：\n\n![](img/eq157.jpg)\n\n因此，在预测步骤，不需要对网络进行任何更改。也就是说，我们不需要改变网络来考虑预测时的\
  \ `p` 或 `(1 – p)`。通过使用倒置 dropout，这就是我们在下一节中展示 dropout 的方式。\n\n## 实验 5：DropOut 示例\n\
  \n让我们如下实现一个 dropout 层：\n\n```cpp\n1. template <typename Device, int _RANK, typename\
  \ GEN>\n2. class DropoutLayer : public Layer<Device, _RANK, _RANK>\n{\npublic:\n\
  DropoutLayer(Device &device, TYPE drop_prob, GEN &gen) : Layer<Device, _RANK, _RANK>(\"\
  book.dropout\"), drop_prob(drop_prob), gen(gen) {}\n7. virtual ~DropoutLayer() {}\n\
  9. virtual Tensor<_RANK> predict(const Tensor<_RANK> &input) const {\n10. return\
  \ input;\n11. }\n13. // forward() and backward() 在这里定义\n15. private:\n16. Eigen::Tensor<bool,\
  \ _RANK> mask;\n17. TYPE drop_prob;\n18. GEN gen;\n19. };\n```\n\n在 `forward()`\
  \ 中，我们使用 `dropout_mask()` 设置掩码来计算层输出：\n\n```cpp\n1. virtual void forward(const Tensor<_RANK>\
  \ &input) {\n3. if (this->mask.size() != input.size()) {\n4. this->mask = Eigen::Tensor<bool,\
  \ _RANK>(input.dimensions());\n5. }\n6. if (this->output.size() != input.size())\
  \ {\n7. this->output = Tensor<_RANK>(input.dimensions());\n8. }\n9. dropout_mask(this->gen,\
  \ this->mask, drop_prob);\n10. auto zero = this->output.constant(0);\n11. TYPE keep\
  \ = TYPE(1.) - drop_prob;\n12. auto scale = this->output.constant(1.) / keep;\n\
  13. this->output.device(this->device) = input.select(mask, zero);\n14. }\n```\n\n\
  注意我们在 中存储了 mask 供后续使用。`dropout_mask()` 函数定义如下：\n\n```cpp\n1. template<typename Generator,\
  \ int _RANK>\n2. void dropout_mask(Generator& gen, Eigen::Tensor<bool, _RANK> &tensor,\
  \ TYPE drop_prob)\n{\n5. std::uniform_real_distribution<TYPE> uniform_dist(0., 1.);\n\
  6. tensor = tensor.unaryExpr&uniform_dist, &gen, &drop_prob {\n7. TYPE val = uniform_dist(gen);\n\
  8. return val >= drop_prob;\n9. });\n}\n```\n\n该函数使用均匀分布采样掩码。dropout 层没有可训练参数。因此，我们可以定义\
  \ `backward()` 将梯度反向传播到上一层：\n\n```cpp\n1. virtual void backward(const Tensor<_RANK>\
  \ &upstream, bool propagate) {\n2. if (propagate) {\n3. if (this->downstream.size()\
  \ != this->mask.size()) {\n4. this->downstream = Tensor<_RANK>(this->mask.dimensions());\n\
  5. }\n6. auto zero = upstream.constant(0);\n7. TYPE keep = TYPE(1.) - drop_prob;\n\
  8. auto scale = upstream.constant(1.) / keep;\n9. this->downstream.device(this->device)\
  \ = this->mask.select(upstream, zero) * scale;\n10. }\n11. }\n```\n\n`backward()`\
  \ 使用以下公式通过缩放 upstream 设置下游梯度：\n\n![](img/eq163.jpg)\n\n可以使用链式法则推导。一旦定义了 `DropoutLayer`，我们就可以用它来设置模型：\n\
  \n```cpp\n1. template <typename Device>\n2. class Model {\npublic:\n6. Model(Device\
  \ &device, const int hidden_layer_size) {\n8. Tensor_2D W1(28*28, hidden_layer_size);\n\
  9. glorot_uniform_initializer(rng, W1);\n10. this->dense_1 = new DenseLayer(device,\
  \ W1, new ReLU<Device, 2>(device));\n12. this->dropout_1 = new DropoutLayer<Device,\
  \ 2, GEN>(device, 0.2, rng);\n14. Tensor_2D W2(hidden_layer_size, 64);\n15. glorot_uniform_initializer(rng,\
  \ W2);\n16. this->dense_2 = new DenseLayer(device, W2, new ReLU<Device, 2>(device));\n\
  18. this->dropout_2 = new DropoutLayer<Device, 2, GEN>(device, 0.5, rng);\n20. Tensor_2D\
  \ WC(64, 10);\n21. glorot_uniform_initializer(rng, WC);\n22. this->output_layer\
  \ = new SoftmaxCrossEntropyLayer(device, WC);\n23. }\n25. //...\n27. private:\n\
  28. DenseLayer<Device> *dense_1;\n29. DropoutLayer<Device, 2, GEN> *dropout_1;\n\
  30. DenseLayer<Device> *dense_2;\n31. DropoutLayer<Device, 2, GEN> *dropout_2;\n\
  32. SoftmaxCrossEntropyLayer<Device> *output_layer;\n33. };\n```\n\n该模型与之前实验中模型的区别在于包含了两个\
  \ dropout 层：\n\n1. `DropoutLayer<Device, 2, GEN> *dropout_1;`\n2. `DropoutLayer<Device,\
  \ 2, GEN> *dropout_2;`\n\n它们的初始化方式如下：\n\n1. `this->dropout_1 = new DropoutLayer<Device,\
  \ 2, GEN>(device, 0.2, rng);`\n2. `this->dropout_2 = new DropoutLayer<Device, 2,\
  \ GEN>(device, 0.5, rng);`\n\n注意我们为每一层设置了不同的丢弃概率。我们可以如下表示该模型：\n\n![](img/Figure_11.20.png)\n\
  \n图 11.20：使用 DropOut 的模型\n\n\n\n\n我们必须重新定义模型的 `forward()` 和 `backward()` 方法，将 dropout\
  \ 层考虑入内：\n\n```cpp\nvoid forward(const Tensor_2D &input) {\n  this->dense_1->forward(input);\n\
  \  this->dropout_1->forward(this->dense_1->get_output());\n  this->dense_2->forward(this->dropout_1->get_output());\n\
  \  this->dropout_2->forward(this->dense_2->get_output());\n  this->output_layer->forward(this->dropout_2->get_output());\n\
  }\n\nvoid backward(const Tensor_2D &upstream) {\n  this->output_layer->backward(upstream,\
  \ true);\n  this->dropout_2->backward(output_layer->get_downstream(), true);\n \
  \ this->dense_2->backward(dropout_2->get_downstream(), true);\n  this->dropout_1->backward(dense_2->get_downstream(),\
  \ true);\n  this->dense_1->backward(this->dropout_1->get_downstream(), false);\n\
  }\n```\n\n由于我们使用反向传播（inverted dropout）来实现 dropout，因此 `predict()` 不需要任何更改：\n\n```cpp\n\
  Tensor_2D predict(const Tensor_2D &input) {\n  auto y0 = this->dense_1->predict(input);\n\
  \  auto y1 = this->dense_2->predict(y0);\n  auto result = this->output_layer->predict(y1);\n\
  \  return std::move(result);\n}\n```\n\n由于 dropout 层没有可训练参数，我们不需要在更新步骤中调用它们：\n\n\
  ```cpp\nvoid update(const float learning_rate, int epoch) {\n  this->dense_1->update(learning_rate,\
  \ epoch);\n  this->dense_2->update(learning_rate, epoch);\n  this->output_layer->update(learning_rate,\
  \ epoch);\n}\n```\n\n这些修改的结果如下：\n\n![](img/Figure_11.21.png)\n\n图 11.21：使用 dropout\
  \ 的训练损失和验证损失\n\n包含 dropout 层后，模型对过拟合具有更好的抑制能力。我们可以注意到，dropout 为训练引入了噪声行为。这在准确率中也可以观察到：\n\
  \n![](img/Figure_11.22.png)\n\n图 11.22：使用 dropout 的训练和验证准确率\n\n在现实世界的深度学习项目中，dropout\
  \ 经常用于对使用原始数据集训练的模型进行正则化。我们显然可以将 dropout 与本章中讨论的其他正则化技术结合使用。事实上，在开发真实模型时，我们通常会结合多种正则化方法，旨在获得一个不过拟合的最终模型。\n\
  \n## 结论\n\n在本章中，我们通过不同的实践实验学习了一些最重要的正则化技术，例如 L1 和 L2 正则化、早停、数据增强和 dropout。我们还学习了模型大小是模型容量和泛化性能的关键因素。\n\
  \n然而，这里最重要的一点是：使用验证集对模型性能进行正确评估重要性。我们讨论了仅在训练数据上评估模型性能是一个巨大的方法论错误。\n\n## 练习题\n\n\
