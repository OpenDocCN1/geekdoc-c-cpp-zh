  \  B(1, 0) = 1.;\n  B(0, 1) = 2.;\n  B(1, 1) = 2.;\n  B(0, 2) = -1.;\n  B(1, 2)\
  \ = 1.;\n\n注意我们包含了 Eigen 头文件：`#include <Eigen/Dense>` 一旦执行，此代码将输出：\n\n![](img/Figure_2.png)\n\
