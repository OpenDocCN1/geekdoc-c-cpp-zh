  \n## 反向传播的向量化 (#contents.xhtml_sc3_160a)\n\n在训练网络时，与其使用单个训练实例，我们更倾向于使用包含数百或数千个寄存器的大批量（batches）。正如书的第一章讨论的那样，我们使用向量化来实现这一点，通过同时计算多个实例来减少整体执行时间。\n\
  \n从表面上看，反向传播的向量化似乎非常精简。让我们首先定义输入 `X` 和目标 `T` 分别为为 `(n x 10)` 和 `(n x 3)` 的矩阵：\n\n\
  ```\n![](img/eq54.jpg)\n```\n\n在这里，`n` 被称为批量大小（batch size）。现在，每个 `X` 行包含单个输入的数据。`T`\
  \ 中的每一行包含 `X` 中对应行的目标。因此，数据对 `(X, T)` 包含了所有 `n` 个实例的数据。\n\n## 前向传播的向量化 (#contents.xhtml_sc4_161a)\n\
  \n前向传播的向量化是非常简单的。事实证明前向传播基本上由两个操作组成：矩阵乘法和激活函数计算：\n\n```\n![](img/eq55.jpg)\n```\n\
  \nEigen 的矩阵乘法是高度向量化的。注意，矩阵乘法的结果是一个包含相同输出序列的矩阵。例如，计算以下两个乘积：\n\n```\n![](img/eq56.jpg)\n\
  ```\n\n等同于仅执行一次乘法：\n\n```\n![](img/eq57.jpg)\n```\n\n由于矩阵乘法在向量化中经过了高度优化，将 `n` 个堆叠输入成单个矩阵并仅执行一次操作，比对单个输入运行\
  \ `n` 次要快。\n\n关于激活函数的向量化，由于激活函数的公式之前没有固定，我们无法保证每个激活函数都是可向量化的。然而，最流行的激活函数如 `sigmoid`、`ReLU`\
  \ 和 `softmax` 都是可向量化的。\n\n## 反向步骤的向量化 (#contents.xhtml_sc4_162a)\n\n反向传播中的大部分操作也是可向量化的。例如，权重梯度计算是一个常规矩阵乘法，即使\
  \ `![](img/eq59.jpg)` 和 `![](img/eq60.jpg)` 都是矩阵，也是可向量化的：\n\n```\n![](img/eq58.jpg)\n\
  ```\n\n反向传播中的大多数操作都是如此的。然而，我们在一个关键点上发现了一个不同的模式：`![](img/eq611.jpg)` 的计算。让我们回想获取\
  \ `Z` 中单个实例的 `![](img/eq612.jpg)` 的公式：\n\n```\n![](img/eq621.jpg)\n```\n\n事实证明，通过将多个实例批量处理在一个矩阵\
  \ `![](img/eq392.jpg)` 中，`![](img/eq153.jpg)` 不再是一个普通的（二维）矩阵，而是一个三阶张量：\n\n```\n\
  ![](img/eq64.jpg)\n```\n\n现在，对于来自 `![](img/eq393.jpg)` 的每个向量 `![](img/eq66.jpg)`，我们都有一个平方雅可比\
