  \n![](img/fm1.png)\n\n# 第 7 章 定义激活函数 (#contents.xhtml_ch07a)\n\n## 引言 (#contents.xhtml_sc2_99a)\n\
  \n激活函数是深度学习模型的基础构建模块，用于控制层的输出。到目前为止，我们只看到一种激活函数的示例，即 sigmoid 激活函数。然而，还有许多其他类型可用。在本章中，我们将涵盖激活函数的相关方面，介绍一些更流行的类型，例如\
  \ ReLU 和 softmax。本章还介绍了一个使用 softmax 和类别交叉熵利用鸢花数据集训练分类器的示例。\n\n## 结构 (#contents.xhtml_sc2_100a)\n\
  \n这是本章的路线图：\n\n* Sigmoid 激活函数\n* Tanh 激活函数\n* ReLU 激活函数\n* Softmax 激活函数\n* 使用链式法则梯度\n\
  * 示例：鸢花数据集分类\n\n## 目标 (#contents.xhtml_sc2_101a)\n\n通过阅读本章，你将能够实现、设计并正确使用现代尖端深度学习模型中相同的激活函数。你将学习如何使用\
  \ softmax 让网络输出离散概率分布，这是分类器非常理想的属性。\n\n## Sigmoid 激活函数 (#contents.xhtml_sc2_102a)\n\
  \nSigmoid 是我们到目前在本书中使用的激活函数。事实上，该模型是文献中发现的最早激活模型之一，用于人工神经网络的最早期示例 [1]。\n\nSigmoid\
  \ 的主要特征是：\n\n*   **可微性**：该函数对于任何输入都是可微的。这非常很重要，因为允许我们在像反向传播等基于梯度的算法中使用该函数。\n*  \
  \ **有界性**：Sigmoid 的上限为 1，下界为 0。这使得它非常适合二分类问题。\n*   **S 型形状**：Sigmoid 具有典型的 S 型形状。这种形状使得基于梯度的算法在远离饱和区时收敛更快。\n\
  \n检查函数是否可微的简单方法是查看其图表。可微函数是平滑的，如 sigmoid 所示：\n\n![](img/Figure_7.1)\n\n图 7.1：sigmoid\
  \ 激活函数\n\n有多种公式化该函数的方法，例如：\n\n![](img/eq1.jpg)\n\n或者常用的：\n\n![](img/eq2.jpg)\n\n\
  由于数值稳定性，我们倾向于使用最后这种公式来实现 sigmoid：\n\n```cpp\n#define SIGMOID_THRESHOLD 45\ntemplate\
  \ <typename T>\nT sigmoid(T z)\n{\nT result;\nif (z >= T(SIGMOID_THRESHOLD)) result\
  \ = 1.;\nelse if (z <= -T(SIGMOID_THRESHOLD)) result = 0.;\nelse result = T(1.)\
  \ / (T(1.) + std::exp(-z));\nreturn result;\n}\n```\n\n### Sigmoid 导数 (#contents.xhtml_sc2_103a)\n\
  \n现在，让我们检查它的导数。\n\n在 9 代码下降中，我们将看到梯度起着核心作用。\n\nSigmoid 导数定义为：\n\n![](img/eq3.jpg)\n\
  \n绘制 sigmoid 及其导数：\n\n![](img/Figure_7.2)\n\n图 7.2：sigmoid 激活导数\n\n### Tanh 激活函数\
  \ (#contents.xhtml_sc2_104a)\n\nTanh 基于 tanh [2]。观察 tanh 的图表，它与 sigmoid 非常相似：\n\n\
  ![](img/Figure_7.3)\n\n图 7.3：tanh 和 sigmoid 的对比图\n\n事实上，这两个函数之间存在关系：\n\n![](img/eq4.jpg)\n\
  \nsigmoid 和 tanh 之间最重要的区别是 tanh 的边界在 [-1, 1]，而 sigmoid 的边界在 [0, 1]。\n\n### Tanh\
  \ 导数 (#contents.xhtml_sc2_105a)\n\ntanh 的导数由以下公式给出：\n\n![](img/eq5.jpg)\n\n与 sigmoid\
  \ 类似，tanh 的导数也使用 tanh(z)。\n\n## ReLU 激活函数 (#contents.xhtml_sc2_106a)\n\nReLU [3]\
  \ 是一种简单强大的激活函数。它由以下公式给出：\n\n![](img/eq6.jpg)\n\n### ReLU 导数 (#contents.xhtml_sc2_107a)\n\
  \n对于我们的实际用途，ReLU 的导数定义如下：\n\n![](img/eq7.jpg)\n\n绘制此导数可以清楚看出它在原点处不连续：\n\n![](img/Figure_7.4)\n\
  \n图 7.4：ReLU 及其导数的对比图\n\n\n\n\n\n`ReLU` 克服了 `sigmoid` 和 `tanh` 在饱和问题上的局限性，是内部层中最常用的激活函数。`ReLU`\
  \ 的一个问题是负输入的平坦区域。对于每一个值 `x < 0`，`ReLU(x)` 的结果均为零。平坦曲线的梯度为零，导致神经元“死亡”。针对这个问题，人们提出了\
  \ `ReLU` 的几种变体 [4]，例如 `Leaky ReLU`、`ELU` 和 `SELU`。\n\n## Softmax 激活\n\n在第 6 章通过最小化代价函数进行学习中，我们讨论了将图像分为三类之一的任务：猫、狗或鸟：\n\
  \n![](img/Figure_7.5.png)\n\n图 7.5：将图像分为猫、鸟或狗\n\n我们可以将该系统设计为一个函数：\n\n![](img/Figure_7.6.png)\n\
  \n图 7.6：将分类器建模为离散概率函数。\n\n采用闭世界假设，上述概率之和必须为 1。当然，每个概率 `p` 必须满足 `0 ≤ p ≤ 1`。这意味着\
  \ `f(image)` 作为一个离散概率函数工作。问题是：我们如何控制层的输出以满足上述两个条件？在深度学习中，我们可以使用 `softmax` 来实现这一点。\n\
  \n这是 `softmax` [5] 公式：\n\n![](img/eq8.jpg)\n\n注意 `Z` 是一个包含 `k` 个值的数组。`softmax` 的第\
  \ `i` 个系数是通过 `Zi` 的指数幂除以所有 `k` 个系数 `Zj` 的指数幂之和而得到的。\n\n为了清晰起见，让我们尝试一个例子：\n\n![](img/Figure_7.7.png)\n\
  \n图 7.7：Softmax 示例\n\n事实上，`0.0132 + 0.2654 + 0.7214` 之和为 1，这符合之前的要求之一。另一个要求是每个值必须大于等于\
  \ 0 且小于等于 1，提供的数值显然满足了这一点。\n\n尽管这个公式是正确的，但很少使用它来计算 `softmax`。相反，我们使用以下公式：\n\n![](img/eq9.jpg)\n\
  \n注意最后一个 `softmax` 公式是通过将分子和分母同时乘以 `e-m` 得到的：\n\n![](img/eq10.jpg)\n\n使用后者的原因是前者在数值上是不稳定的。由于\
  \ `exp(x)` 即使在 `x` 取值较小时也会溢出，因此在应用指数幂之前对 `Z` 的值进行归一化。检查以下实现：\n\n```cpp\nEigen::Tensor<float,\
  \ 1> softmax(const Eigen::Tensor<float, 1> &z)\n{\n  const Eigen::Tensor<float,\
  \ 0> m = z.maximum();\n  auto normalized = z - z.constant(m(0));\n  auto expo =\
  \ normalized.exp();\n  const Eigen::Tensor<float, 0> expo_sums = expo.sum();\n \
  \ Eigen::Tensor<float, 1> result = expo / expo.constant(expo_sums(0));\n  return\
  \ result;\n}\n```\n\n我们可以如下检查此函数：\n\n```cpp\nint main(int, char **)\n{\n  Eigen::Tensor<float,\
  \ 2> input(8, 3);\n  input.setValues({\n    {0.1, 1., -2.},{10., 2., 5.},{5., -5.,\
  \ 0.},{2., 3., 2.},\n    {100., 1000., -500.},{3., 3., 3.},{-1, 1., -1.},{-11.,\
  \ -0.2, -.1}\n  });\n  const int batch_size = input.dimension(0);\n  const int output_size\
  \ = input.dimension(1);\n  Eigen::array<Eigen::Index, 2> extent = {1, output_size};\n\
  \  Eigen::array<int, 1> reshape_dim({output_size});\n  for (int i = 0; i < batch_size;\
  \ i++) {\n    Eigen::array<Eigen::Index, 2> offset = {i, 0};\n    Eigen::Tensor<float,\
  \ 1> row = input.slice(offset, extent).reshape(reshape_dim);\n    Eigen::Tensor<float,\
  \ 1> output = softmax(row);\n    std::cout << \"softmax([\" << row << \"):][\" <<\
  \ output << \"]\\n\";\n  }\n  return 0;\n}\n```\n\n这段代码输出：\n\n![](img/Figure_7.8.png)\n\
  \n图 7.8：运行 softmax 示例\n\n为一维张量实现 `softmax` 非常简单。通常，我们有一个函数来处理多维输入，这些输入代表一维输入的批次。例如，考虑以下输入：\n\
  \n![](img/Figure_7.9.png)\n\n图 7.9：示例中的张量输入\n\n这个单一的 8x3 二阶张量与我们在上一个示例中使用的张量相同。正如我们在第\
  \ 1 章深度学习引论中所讨论的，为了利用大部分底层资源，我们倾向于一次性处理这样的张量，而不是使用循环。这样做需要进行一些操作。首先，需要计算最大值：\n\n\
  ![](img/Figure_7.10.png)\n\n图 7.10：找到每个行的最大值\n\n注意这个操作是跨轴的。现在，我们可以广播最大值数组以匹配相同的维度：\n\
  \n![](img/Figure_7.11.png)\n\n图 7.11：广播最大值数组\n\n一旦两个张量具有相同的维度，我们就可以计算它们之间的差异。在下面的代码中可以看到这些思想：\n\
  \n```cpp\nEigen::Tensor<float, 2> softmax_2D(const Eigen::Tensor<float, 2> &z)\n\
  {\n  auto dimensions = z.dimensions();\n  int batch_size = dimensions.at(0);\n \
  \ int instances_size = dimensions.at(1);\n  // 找到最大值\n  Eigen::array<int, 1> depth_dim({1});\n\
  \  auto z_max = z.maximum(depth_dim);\n  // 作为二阶张量\n  Eigen::array<int, 2> reshape_dim({batch_size,\
  \ 1});\n  auto max_reshaped = z_max.reshape(reshape_dim);\n  // 广播最大值\n  Eigen::array<int,\
  \ 2> bcast({1, instances_size});\n  auto max_values = max_reshaped.broadcast(bcast);\n\
  \  // 归一化输入\n  auto normalized = z - max_values;\n  // 计算 softmax\n  auto expo =\
  \ normalized.exp();\n  auto expo_sums = expo.sum(depth_dim);\n  Eigen::array<int,\
  \ 2> reshape_dim_sums({batch_size, 1});\n  auto sums_reshaped = expo_sums.reshape(reshape_dim_sums);\n\
  \  // 广播和\n  auto sums = sums_reshaped.broadcast(bcast);\n  Eigen::Tensor<float,\
  \ 2> result = expo / sums;\n  return result;\n}\n```\n\n最后，我们可以比较这两个版本：\n\n```cpp\n\
  auto output_2D = softmax_2D(input);\nstd::cout << \"\\noutput_2D:\\n\" << output_2D\
  \ << \"\\n\\n\";\n```\n\n得到：\n\n![](img/Figure_7.12.png)\n\n图 7.12：运行向量化的 softmax\
  \ 版本\n\n这里最重要的注意的是，`softmax` 实际上像一个离散概率分布：\n\n* 每个系数值都在 [0, 1] 区间内\n* 系数之和为 1\n\n\
  这种性质在解决分类问题时，与交叉熵代价函数结合使用特别为重要。`softmax` 和分类交叉熵的使用正是本章最后示例的场景。\n\n## Softmax 导数\n\
  \n通常，激活函数是逐系数的操作。在逐系数激活函数中，每个输出系数仅取决于其相应的输入系数。`sigmoid`、`ReLU`、`tanh` 以及其他几种激活函数都是如此。正如我们所见，`softmax`\
  \ 并非如此。\n\n在 `softmax` 中，每个系数都取决于所有的输入值系数。结果是每个系数对于每个索引都有非零导数，可以通过以下公式找到：\n\n![](img/eq11.jpg)\n\
  \n其中 `S(Z)i` 是 `Zi` 的 softmax 值，`δ(i, j)` 是克罗内克 δ 函数：\n\n![](img/eq12.jpg)\n\n如果我们把此函数应用于每一对\
  \ (i, j)，就会得到下面的非对角雅可比矩阵：\n\n![](img/eq13.jpg)\n\n\n\n\n\n最后一个矩阵是 `softmax` 对其输入的雅可比矩阵。在实践中，我们以与计算\
  \ `softmax` 输出相同的方法，分批计算这个雅可比矩阵。这种方法将在本章末尾进行讨论。\n\n### 使用链式法则计算梯度\n\n在我们在更有趣示例中观察\
  \ `softmax` 的工作之前，有一非常重要的事情需要讨论：如何计算复合函数的梯度。\n\n正如你所知，像上一节介绍的 `softmax` 导数这样的导数，被基于梯度的算法用于从数据训练模型。这些算法使用更新规则迭代地更新模型权重：\n\
  \n![](img/eq14.jpg)\n\n其中 `grad` 由输出成本对权重的梯度给出：\n\n![](img/eq15.jpg)\n\n自机器学习早期以来，一个核心问题一直是：我们如何为复杂模型计算梯度？这可以通过后文解释的链式法则来解决。\n\
  \n### 寻找权重的梯度\n\n让我们从 `softmax` 的导数开始。雅可比矩阵的每个系数都代表了 `softmax` 函数相对于 `Z` 的每个系数的斜率。然而，我们知道\
  \ `Z` 是另一个函数的结果。例如，使用 `softmax` 的密集层的输出 `Out` 由下给出：\n\n![](img/eq16.jpg)\n\n上一节雅可比矩阵提供了关于\
  \ `Z` 的偏导数：\n\n![](img/eq17.jpg)\n\n然而，由于我们的目标是更新 `W` 的系数，我们感兴趣的是相对于权重矩阵 `W` 的梯度。换句话说，我们感兴趣寻找：\n\
  \n![](img/eq18.jpg)\n\n为了解决这个问题，有一种名为链式法则 [6] 的程序，它允许我们找到复合函数的导数。例如，假设复合函数 `A(x)\
  \ = B(C(x))`，我们可以使用以下规则找到 `A` 对 `x` 的导数：\n\n![](img/eq19.jpg)\n\n通过将此规则应用于我们的问题，我们得到了：\n\
  \n![](img/eq20.jpg)\n\n由于我们知道：\n\n![](img/eq21.jpg)\n\n公式变为：\n\n![](img/eq22.jpg)\n\
  \n最后，我们可以如下所示找到成本函数对权重的梯度：\n\n![](img/eq23.jpg)\n\n如果你仔细观察，可能会注意到我们拥有获得梯度所需的一切：\n\
  \n![](img/Figure_7.15.png)\n\n图 7.15：输出成本梯度的组件\n\n换句话说，为了计算权重的梯度，我们只需要知道：\n\n* 成本函数梯度\n\
  * 激活函数梯度\n* 输入\n\n我们将在下面的示例中看到此计算的应用。\n\n### 示例：鸢尾花数据集分类\n\n我们将通过使用书中目前为止介绍的所有概念的示例来结束本章：层、成本函数、激活函数和梯度。我们将使用著名的鸢尾花数据集\
  \ [7] 训练一个模型，将实例分为三类之一：setosa（组态）、versicolor（变色）或 virginica（三色）。\n\n### 鸢尾花数据集\n\
  \nIris 是机器学习中长期以来非常流行的数据集。该数据集仅包含 150 个样本的小序列，每个样本由五个字段组成：\n\n* 花萼长度（Sepal length）：一个代表花萼长度（厘米）的数值\n\
  * 花萼宽度（Sepal width）：一个代表花萼宽度（厘米）的数值\n* 花瓣长度（Petal length）：一个代表花瓣长度（厘米）的数值\n* 花瓣宽度（Petal\
  \ width）：一个代表花瓣宽度（厘米）的数值\n* 类别（Class）：以下值之一：setosa，versicolor 或 virginica\n\n在这样的分类任务中，通常前几个字段被称为特征（features），最后一个被称为类别标签（class\
  \ label）。\n\n数据以逗号分隔的值格式可用。在书籍 GitHub 仓库中，你可以找到此示例中使用的代码。在那里，你可以找到一个工具 lambda 函数：\n\
  \n```cpp\nauto load_iris_dataset = [](std::string file_path, bool shuffle = true,\
  \ float split_percentage = .8)\n```\n\n此 lambda 根据给定的本地文件路径加载数据集（你需要自己下载文件）：\n\n\
  ```cpp\nauto [training_X_ds, training_Y_ds, test_X_ds, test_Y_ds] = load_iris_dataset(\"\
  data/iris.csv\", false);\n```\n\n一旦调用，该函数会产生四个张量：\n\n* `training_X_ds`：一个大小为 (120,\
  \ 4) 的张量，包含 120 个样本的特征。\n* `training_Y_ds`：一个大小为 (120, 3) 的张量，包含 `training_X_ds`\
  \ 中相同 120 个样本的独热编码标签。\n* `test_X_ds`：格式与 `training_X_ds` 类似，包含剩余 30 个样本的特征。\n* `test_Y_ds`：格式与\
  \ `training_Y_ds` 类似，包含剩余 30 个样本的独热编码标签。\n\n标签编码如下：\n\n* Setosa => [1, 0, 0]\n*\
  \ Versicolor => [0, 1, 0]\n* Virginica => [0, 0, 1]\n\n这些张量将在后续步骤中使用。特别是，`training_X_ds`\
  \ 和 `training_Y_ds` 将用于训练我们的模型。\n\n## 定义模型\n\n模型由一个使用 `softmax` 激活函数的密集层组成。我们将使用分类交叉熵进行训练：\n\
  \n1. `Softmax<2> activation;`\n2. `Dense layer(initial_weights, &activation);`\n\
  3. `CategoricalCrossEntropy<2> loss_function;`\n\n我们将执行非常简单的模型训练。简而言之，该过程包含 3 个步骤：前向传播、反向传播和模型更新。这\
  \ 3 个步骤将持续执行，直到算法达到停止条件。\n\n### 前向传播\n\n前向传播非常简单，仅计算给定训练集的输出（预测）：\n\n```cpp\nauto\
  \ output = layer.forward(training_X_ds);\n```\n\n由于层是密集的，这一行实际上执行的是：\n\n![](img/eq24.jpg)\n\
  \n### 计算梯度\n\n相对于输出的梯度由成本函数的导数给出：\n\n```cpp\nauto dcost_doutput = loss_function.derivative(training_Y_ds,\
  \ output);\n```\n\n这一行实际上执行：\n\n![](img/eq25.jpg)\n\n一旦有了成本梯度，我们可以将其传递给层以计算权重梯度：\n\
  \n```cpp\nlayer.backward(dcost_doutput);\n```\n\n这一行执行：\n\n![](img/eq26.jpg)\n\n\
  权重梯度存储在层内部。它们将在下一步被层使用。\n\n| 注意：这里使用类是一个软件工程决策，完全不是模型的要求。我们通常倾向于使用类和有状态的对象来保持整洁。\
  \ |\n\n### 更新模型\n\n一旦层计算了权重梯度，就是更新的时候了。更新使用先知的更新规则进行。在这个规则中，有一个学习率调整更新的强度：\n\n```cpp\n\
  layer.update_state(learning_rate);\n```\n\n这一步执行更新规则：\n\n![](img/eq27.jpg)\n\n其中\
  \ `grad` 是上一步获得的。\n\n### 寻找何时停止\n\n在这个示例中，我们运行训练循环一千次：\n\n```cpp\nconst int MAX_EPOCHS\
  \ = 1000;\nint epoch = 0;\n```\n\n\n\n\n\n```cpp\nwhile (epoch++ < MAX_EPOCHS)\n\
  {\n    //...\n}\n```\n\n| 注意：我们可以改进代码以包含更复杂的停止条件。例如，当代价（cost）或代价梯度太小时，我们可以停止循环。\
  \ |\n\n### 评估结果\n\n在每个循环结束时，我们都会使用训练数据和验证数据来评估模型性能：\n\n1. `auto val_output = layer.predict(test_X_ds);`\n\
  2. `float val_loss = loss_function.evaluate(test_Y_ds, val_output);`\n3. `float\
  \ training_acc = accuracy(training_Y_ds, output);`\n4. `float validation_acc = accuracy(test_Y_ds,\
  \ val_output);`\n\n在这里，我们使用两个指标来衡量模型性能：用于训练模型时相同的代价函数，以及一个名为 `accuracy`（准确率）的指标。`Accuracy`\
  \ 是一个非常简单且为人知的指标，它提供了正确预测的百分比。\n\n模型在验证数据上的性能可以被视为生产环境中使用模型实际性能的估计器。事实上，仅在训练数据上评估模型性能是一个方法论上的错误。\n\
  \n| 注意：评估指标和训练模型的准则（包括常见陷阱）将在本书的下部分讨论。 |\n\n### 整合整体\n\n将所有部分组合在一起，循环看起来如下：\n\n\
  ```cpp\nint main(int, char **)\n{\n    srand((unsigned int) time(0));\n    auto\
  \ [training_X_ds, training_Y_ds, test_X_ds, test_Y_ds] = load_iris_dataset(\"data/iris.csv\"\
  , true);\n    auto init_weights = [](int rows, int cols, float range) {\n      \
  \  Eigen::Tensor<float, 2> result(rows, cols);\n        result = result.random()\
  \ * result.constant(range) - result.constant(range / 2.);\n        return result;\n\
  \    };\n    auto initial_weights = init_weights(4, 3, 0.1);\n    Softmax<2> activation;\n\
  \    Dense layer(initial_weights, &activation);\n    CategoricalCrossEntropy<2>\
  \ loss_function;\n    const int MAX_EPOCHS = 1000;\n    const float learning_rate\
  \ = 0.1;\n    int epoch = 0;\n    while (epoch++ < MAX_EPOCHS)\n    {\n        //\
  \ 获取训练数据集的输出\n        auto output = layer.forward(training_X_ds);\n        // 计算代价对输出的导数\n\
  \        auto dcost_doutput = loss_function.derivative(training_Y_ds, output);\n\
  \        // 计算层梯度\n        layer.backward(dcost_doutput);\n        // 在这一步中，内部\n\
  \        layer.update_state(learning_rate);\n        // 评估训练损失\n        float loss\
  \ = loss_function.evaluate(training_Y_ds, output);\n        if (epoch == 1 || epoch\
  \ % 50 == 0) {\n            // 评估验证损失\n            auto val_output = layer.predict(test_X_ds);\n\
  \            float val_loss = loss_function.evaluate(test_Y_ds, val_output);\n \
  \           float training_acc = accuracy(training_Y_ds, output);\n            float\
  \ validation_acc = accuracy(test_Y_ds, val_output);\n            std::cout << \"\
  epoch:\\t\" << epoch \n                << \"\\tloss:\\t\" << loss << \"\\tacc:\\\
  t\" << training_acc \n                << \"\\tval_loss:\\t\" << val_loss << \"\\\
  tval_acc:\\t\" << validation_acc << \"\\n\";\n        }\n    }\n    return 0;\n\
  }\n```\n\n运行此训练将产生如下输出：\n\nimages/Figure_16.png\n\n| 注意：由于随机性，每次提供的训练输出都略有不同。 |\n\
  \n如果我们绘制这些指标图，将会看到类似这样的图表：\n\nimages/Figure_17.png\n\n这种图表的形状在模型训练中非常常见。通常，代价从顶部开始，在前几个\
  \ epoch 中下降幅度最大。在某一点，代价开始渐近地减少。`Accuracy` 具有相反的行为，从低位开始增加，直到在某个水平达到饱和。训练模型的实际问题（包括使用反向传播）将在后续章节中讨论。这里最重要的点是理解如何使用到为止为止看到的组件来构建一个简单但富有洞察力的程序。\n\
  \n## 结论\n\n在本章中，我们学习了最流行的激活函数。我们学习了它们的导数，并理解了如何使用它们来计算权重梯度。我们还学习了如何使用 `softmax`\
  \ 让层工作像离散分布。为了准确理解为什么这个属性很重要，我们引入了一个使用 `Iris` 数据集训练模型的示例。在下一章中，我们将通过讨论池化层（现代架构中的一个重要组件）来完成我们的深度学习之旅。\n\
  \n## 练习题\n\n1. 考虑以下最大最小归一化：\n\nimages/Figure_18.png\n\n在将数据输入训练循环之前，将此归一化应用于 `Iris`\
  \ 数据集。这种归一化如何在质量和时间上影响训练？\n\n2. 在我们的示例中，我们使用 `softmax` 作为激活函数，分类交叉熵作为代价函数：\n   \
  \ - `Softmax<2> activation;`\n    - `Dense layer(initial_weights, &activation);`\n\
  \    - `CategoricalCrossEntropy<2> loss_function;`\n\n将这两个函数替换为 `sigmoid` 和 `MSE`，如下：\n\
  \    - `Sigmoid<2> activation;`\n    - `Dense layer(initial_weights, &activation);`\n\
  \    - `MSE<2> loss_function;`\n\n使用这些新函数运行训练并与使用 `softmax` 的结果进行比较。\n\n## 参考文献\n\
  \n1. Haykin, Neural Networks: A Comprehensive Foundation, Prentice Hall, 1999.\n\
  2. Goodfellow, Bengio & Courville, Deep Learning, MIT Press, 2016.\n3. Aggarwal,\
  \ Neural Networks and Deep Learning, Springer, 2018.\n4. Dabal Pedamonti, Comparison\
  \ of non-linear activation functions for deep neural networks on MNIST classification\
  \ task, 2018.\n5. Bishop, Pattern Recognition and Machine Learning, Springer, 2006.\n\
  6. [链法则](https://web.mit.edu/wwmath/calculus/differentiation/chain\n7. [Iris 数据集](https://archive.ics.uci.edu/dataset/53/iris)\n\
  \n# 第 8 章使用池化层 引言\n\n本章介绍了池化层，这是卷积神经网络架构中的一个重要组件。池化层通过应用汇总统计量（如最大值或平均值）来减少输入张量的大小。本章将描述并实现它们，涵盖最流行的类型：2D\
  \ 最大池化和 2D 平均池化。\n\n## 结构\n\n* 池化层\n* 实现池化层\n* 使用池化层的优缺点\n\n## 目标\n\n阅读本章后，你将能够如何实现和使用\
  \ 2D 池化层。此外，你将理解在卷积神经网络中使用该组件的优缺点。\n\n### 池化层\n\n在典型的场景下，卷积神经网络由一个或多个卷积层加上一个特殊类型的池化层组成。考虑以下示例：\n\
  \nimages/Figure_8.1.png\n\n图 8.1：CNN 网络的一个片段\n\n这种由输入-卷积-池化组成的序列是一种非常常见的策略，特别是在我们定义具有巨大输入的复杂网络时非常有用。在某些方面，池化层通过在输入层上滑动来工作。但与卷积不同，池化层没有可训练的系数。\n\
  \n\n\n\n考虑以下示例，其中在 7x7 输入网格上应用 3x3 最大池化层，步长为 2，生成 3x3 的输出：\n\n![](img/Figure_8.2.png)\n\
  \n图 8.2：2D 最大池化示例\n\n如其名所示，最大池化使用最大值来计算输出。以下公式给池化层的大小：\n\n![](img/Figure_8.3.png)\n\
  \n图 8.3：计算池化层的输出维度\n\n通常情况下，`pool_rows` 等于 `pool_cols`。让我们看看在下一节讨论的示例中如何使用这些公式。\n\
  \n## 实现池化层\n\n池化层的实现方式与卷积相同。然而，在这里我们可以使用 Eigen 的工具函数 `extract_image_patches`，这会让我们的工作变得更简单。查看以下示例：\n\
  \n```cpp\ntemplate <typename T>\nconst Eigen::Tensor<T, 2> pooling(const Eigen::Tensor<T,\
  \ 2> &X, int pool_size, int strides = 1) {\n  // 将输入重塑为 4 维形状 (深度, rows, columns,\
  \ batch)\n  Eigen::array<Eigen::DenseIndex, 4> reshaped_dims{{1, X.dimension(0),\
  \ X.dimension(1), 1}};\n  auto reshaped = X.reshape(reshaped_dims);\n  // 获取补丁 (patches)\n\
  \  Eigen::Tensor<T, 5> patches = reshaped.extract_image_patches(pool_size, pool_size,\
  \ strides, strides, Eigen::PADDING_VALID);\n  // 获取每个补丁的最大值\n  Eigen::array<Eigen::DenseIndex,\
  \ 2> dims({1, 2});\n  auto max_patches = patches.maximum(dims);\n  // 回塑以适应 2 维。注意\
  \ extract_image_patches 会访问每行/每列\n  // 因此，左侧和底部会自动填充\n  int pre_rows = X.dimension(0)\
  \ / strides;\n  int pre_cols = X.dimension(1) / strides;\n  Eigen::array<Eigen::DenseIndex,\
  \ 2> pre_dims{{pre_rows, pre_cols}};\n  auto pre = max_patches.reshape(pre_dims);\n\
  \  int rows = (X.dimension(0) - pool_size) / strides + 1;\n  int cols = (X.dimension(1)\
  \ - pool_size) / strides + 1;\n  Eigen::array<Eigen::DenseIndex, 2> offsets = {0,\
  \ 0};\n  Eigen::array<Eigen::DenseIndex, 2> extents = {rows, cols};\n  Eigen::Tensor<T,\
  \ 2> result = pre.slice(offsets, extents);\n  return result;\n}\nint main(int, char**)\
  \ {\n  Eigen::Tensor<float, 2> input(6, 8);\n  input.setValues({\n    { 0.f, 1.f,\
  \ 2.f, 3.f, 4.f, 5.f, 6.f, 7.f},\n    { 8.f, 9.f, 10.f, 11.f, 12.f, 13.f, 14.f,\
  \ 15.f},\n    { 16.f, 17.f, 18.f, 19.f, 20.f, 21.f, 22.f, 23.f},\n    { 24.f, 25.f,\
  \ 26.f, 27.f, 28.f, 29.f, 30.f, 31.f},\n    { 32.f, 33.f, 34.f, 35.f, 36.f, 37.f,\
  \ 38.f, 39.f},\n    { 40.f, 41.f, 42.f, 43.f, 44.f, 45.f, 46.f, 47.f}\n  });\n \
  \ auto res_strides_1 = pooling(input, 2);\n  std::cout << \"res_strides_1: \\n\"\
  \ << res_strides_1 << \"\\n\";\n  auto res_strides_2 = pooling(input, 2, 2);\n \
  \ std::cout << \"res_strides_2: \\n\" << res_strides_2 << \"\\n\";\n  return 0;\n\
  }\n```\n\n这段代码使用了 `maximum()`，它是 Eigen API 中内置的归约器（reducers）之一。该归约器沿指定的轴计算最大值：\n\
  \n```cpp\nEigen::array<Eigen::DenseIndex, 2> dims({1, 2});\nauto max_patches = patches.maximum(dims);\n\
  ```\n\n执行该代码后，它将生成以下内容：\n\n![](img/Figure_8.4.png)\n\n图 8.4：使用 2D 最大池化\n\n池化的另一个常见示例是\
  \ 2D 平均池化。我们可以通过更改以下行来简单地修改之前的示例以计算 2D 平均池化：\n\n```cpp\nauto max_patches = patches.maximum(dims);\n\
  ```\n\n改为：\n\n```cpp\nauto max_patches = patches.mean(dims);\n```\n\n进行此更改后，编译并运行将得到如下输出：\n\
  \n![](img/Figure_8.5.png)\n\n图 8.5：使用平均池化\n\n2D 平均池化的工作方式与 2D 最大池化非常相似：\n\n![](img/Figure_8.6.png)\n\
  \n图 8.6：2D 平均池化的示例\n\n## 池化层的优缺点\n\n尽管池化层在神经网络中很常见，其优点包括：\n\n- **局部平移不变性**：当我们使用池化时，小的平移不会影响输出。这使得网络对噪声更具鲁棒性。\n\
  - **计算效率**：池化通常会减少输出的大小。然而，池化有时也会带来一些缺点：\n\n- **像素精度损失**：由于池化使用统计操作汇总区域，信息的丢失是不可避免的。对于需要像素精度的系统，池化会增加难度。\n\
  - **序列编码器**：池化会给自编码器等架构带来额外的挑战。\n\n还需要注意的是，池化层至少包含两个超参数：池化大小和步长。这些参数的值通常通过实验确定。\n\
  \n深度学习架构中一种常见的设置是池化大小等于步长。在这种设置下，输出将比输入小 2 或 3 倍。\n\n尽管有一些理论和实践指导，但这些参数的最佳设置通常需要直觉判断。\n\
  \n## 池化层的反向传播\n\n考虑以下示例，将最大池化应用到 6x5 输入矩阵：\n\n![](img/Figure_8.7.png)\n\n图 8.7：对\
  \ 6x5 输入矩阵应用最大池化\n\n在此示例中，池化大小和步长均为 2。因此，操作结果是一个 3x2 输出矩阵。注意，由于步长的存在，领先列被跳过。在这种情况下，我们如何找到导数？\n\
  \n输出相对于输入的最大池化导数是一个与输入矩阵维度相同的稀疏矩阵。该矩阵几乎全为零，仅在局部最大值的位置为 1。例如，上一个示例中的导数所示：\n\n![](img/Figure_8.8.png)\n\
  \n图 8.8：输出相对于输入的最大池化导数\n\n该导数的用法将在后续章节中明确。\n\n## 总结\n\n在本章中，我们介绍了池化层。特别，我们涵盖了 2D\
  \ 最大池化和 2D 平均池化层，讨论了它们在卷积神经网络中的适用性。\n\n本章结束了本书的第二部分。在下一章中，我们将开始第三部分，介绍如何使用目前实现的组件来训练深度学习模型。\n\
  \n## 习题\n\n1. 考虑本章引入的模板函数：\n\n   ```cpp\n   template <typename T>\n   const Eigen::Tensor<T,\
  \ 2> pooling(const Eigen::Tensor<T, 2> &X, int pool_size, int strides = 1)\n   ```\n\
  \n   重新设计该函数以支持不同的垂直和水平步长/池化大小。也就是说，允许使用不同的行步长、列步长、行池化大小和列池化大小。\n\n\n\n\n[3] Jason\
  \ Brownlee, A Gentle Introduction to Pooling Layers for Convolutional Neural Networks,\
  \ 2019, 可 [`machinelearningmastery.com/pooling-layers-for-convolutional-neural-networks/`](https://machinelearningmastery.com/pooling-layers-for-convolutional-neural-networks/)\n\
  \n[4] Boureau, A theoretical analysis of feature pooling in visual recognition,\
  \ 2010, ACM.\n\n加入我们书籍的 Discord 空间\n\n加入书籍 Discord 工作区，获取最新更新、优惠、全球科技动态、新发布以及与作者的交流会议：\n\
