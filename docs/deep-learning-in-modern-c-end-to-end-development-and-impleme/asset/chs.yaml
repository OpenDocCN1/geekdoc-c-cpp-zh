  \n# 编写现代 C++ 程序](#contents.xhtml_sc2_19a)\n\n自标准 C++11 [6] 以来，C++ 语言引入了许多重要特性，旨在以更快、更可靠的方式开发更复杂的程序。这些特性被非正式称为“现代\
  \ C++”。在本书中，我们将密集使用其中一些特性，特别是：\n\n* 函数式特性\n* `<algorithm>`、`<functional>` 和 `<numeric>`\
  \ 头文件\n* 统计类头文件\n\n# 使用函数式编程](#contents.xhtml_sc2_20a)\n\nC++ 是一门多功能的编程语言，支持多种范式。这意味着它可以用于不同的风格创建程序，包括面向对象编程\
  \ (OOP)、过程化和函数式。参考以下示例：\n\n```cpp\n#include <algorithm> // std::for_each \n#include\
  \ <functional> // std::less, std::less_equal, std::greater, std::greater_equal\n\
  #include <iostream> // std::cout\n\nint main() \n{\n  std::vector<std::function<bool(double,\
  \ double)>> comparators \n  {\n    std::less<double>(), \n    std::less_equal<double>(),\
  \ \n    std::greater<double>(), \n    std::greater_equal<double>()\n  };\n\n  double\
  \ x = 10.;\n  double y = 10.;\n  auto compare = &x, &y> &comparator)\n  {\n    bool\
  \ b = comparator(x, y);\n    std::cout << (b?\"TRUE\": \"FALSE\") << \"\\n\";\n\
  \  };\n\n  std::for_each(comparators.begin(), comparators.end(), compare);\n\n \
  \ return 0;\n}\n```\n\n这个示例使用了我们我们想要投入时间研究的特性。让我们从引入 `<functional>` 头文件开始。`std::function`、`std::less_equal`、`std::greater`\
  \ 和 `std::greater_equal` 是不使用指针执行调用的示例。这段代码中的一个关键点是 lambda 表达式的使用：\n\n```cpp\nauto\
  \ compare = &x, &y> &comparator)\n{\n  bool b = comparator(x, y);\n  std::cout <<\
  \ (b?\"TRUE\": \"FALSE\") << \"\\n\";\n};\n```\n\n一个 lambda 表达式由三部分组成：\n* 捕获列表。在示例中，它是\
  \ `[&x, &y]`。\n* 参数列表（`const std::function<bool(double, double)> &comparator`）。\n\
  * 函数体（大括号 `{}` 之间的语句）。\n\n使用 lambda 时需要注意的事：\n* 参数列表和体体的方式与任何普通函数相同。\n* 捕获子句定义了\
  \ lambda 函数体中可以访问的外部变量。\n* 与普通函数不同，C++ 中的 lambda 没有名称。\n* 由于 lambda 本质上是匿名的，它们非常方便使用。\n\
  \n## 理解 mutable lambdas](#contents.xhtml_sc3_21a)\n\n默认情况下，lambdas 是不可变的，这意味着 lambda\
  \ 自身在调用后不会发生变化。通常情况下这种行为是足够的。例如，考虑以下 `L2` 正则表达式：\n\n```cpp\nauto L2 = [](const std::vector<double>\
  \ &V)\n{\n  double p = 0.01;\n  return std::inner_product(V.begin(), V.end(), V.begin(),\
  \ 0.0) * p;\n};\n```\n\n不要担心还不知道，我们会在书中更多讨论它们。现在考虑这个示例：\n\n```cpp\n#include <algorithm>\n\
  #include <iostream>\nusing vector = std::vector<double>;\n\nint main()\n{\n  auto\
  \ momentum_optimizer = V = vector() mutable\n  {\n    if (V.empty()) V.resize(gradient.size(),\
  \ 0.);\n    std::transform(V.begin(), V.end(), gradient.begin(), V.begin(), [](double\
  \ v, double dx)\n    {\n      double beta = 0.7;\n      return v = beta * v + dx;\n\
  \    });\n    return V;\n  };\n\n  auto print = [](double d) { std::cout << d <<\
  \ \" \"; };\n  const vector current_grads{1., 0., 1., 1., 0., 1.};\n  for (int i\
  \ = 0; i < 3; ++i)\n  {\n    vector weight_update = momentum_optimizer(current_grads);\n\
  \    std::for_each(weight_update.begin(), weight_update.end(), print);\n    std::cout\
  \ << \"\\n\";\n  }\n  return 0;\n}\n```\n\n这里的关键点是 lambda 使用了 `mutable` 关键字：\n\n\
  ```cpp\nauto momentum_optimizer = V = vector() mutable\n{\n  //...\n};\n```\n\n\
  mutable lambda 可以对按值捕获的变量执行写入操作。在示例中，捕获列表中变量是向量 `V`。因此，每次 lambda 调用都会产生不同的输出：\n\n\
  ![](img/Figure_2.5.png)\n\n图 2.5: 使用 mutable 的副作用 lambda\n\n在第 13 章 实现优化器中，我们将看到记忆化是加快算法搜索的一种非常重要的方法，例如通过实现优化器。mutable\
  \ lambda 允许我们更容易地实现记忆化。\n\n## C++ 中的矩阵编程](#contents.xhtml_sc2_22a)\n\n矩阵是网格状的数据结构，广泛应用于机器学习、统计编程、图像处理、游戏和科学计算。尽管应用广泛，但\
  \ C++ 并没有原生的矩阵数据结构实现。\n\n\n\n\n正如我们在接下来的章节中看到的，矩阵（以及它们的兄弟张量）在深度学习算法中起着核心作用。尽管我们可以（尝试）使用\
  \ STL 容器（如 `vector`、`list`、`deque` 等）来模拟矩阵，但最好的方法是使用可靠的第三方矩阵实现。在本书，我们将使用 `Eigen`\
  \ [6] 来此此。\n\n使用 `Eigen` 有许多优点。其中之一是 `Eigen` 仅头文件组成。因此，你不需要在机器上构建或安装 `Eigen`。相反，你只需要从它的\
  \ GitLab 仓库 [`gitlab.com/libeigen/eigen`](https://gitlab.com/libeigen/eigen) 下载\
  \ `Eigen` 并将其拷贝到文件夹中。告诉编译器头文件所在的位置，你就大告成了。\n\n虽然手动下载 `Eigen` 并非最优方案。你可以通过以下方式使用\
  \ `CMake` 自动化此过程来节省时间：\n\n```cmake\ncmake_minimum_required(VERSION 3.8)\nset(PROJECT_NAME\
  \ eigen_premier)\nproject(${PROJECT_NAME} CXX)\n## 默认使用 Release 构建类型\nif(NOT CMAKE_BUILD_TYPE)\n\
  set(CMAKE_BUILD_TYPE Release CACHE STRING \"Build type\" FORCE)\nendif()\nmessage(STATUS\
  \ \"Build type: ${CMAKE_BUILD_TYPE}\")\nset(CMAKE_CXX_STANDARD 17)\nset(CMAKE_CXX_STANDARD_REQUIRED\
  \ ON)\n## 下载并设置 Eigen\ninclude(FetchContent)\nFetchContent_Declare(\n  Eigen3\n\
  \  GIT_REPOSITORY https://gitlab.com/libeigen/eigen.git\n  GIT_TAG      6e4d5d4832a1736ba2f6faa7087b61227dba8e7b\n\
  )\nFetchContent_MakeAvailable(Eigen3)\nadd_executable(${PROJECT_NAME} \"${PROJECT_SOURCE_DIR}/src/main.cpp\"\
  )\ntarget_compile_options(${PROJECT_NAME} PRIVATE -Wall -Wextra -pedantic)\ntarget_link_libraries(${PROJECT_NAME}\
  \ Eigen3::Eigen)\n```\n\n然后你可以像往常一样构建项目：\n\n```bash\nmkdir build\ncd build\ncmake\
  \ ..\nmake\n```\n\n这个简单的 `Eigen` 项目可以在书的 GitHub 仓库中找到。我们使用的 `GIT_TAG` `6e4d5d4832a1736ba2f6faa7087b61227dba8e7b`\
  \ 是 `Eigen` 3.4.90 版本的最新提交。如果你想使用最新的库改进，可以将其更改为 `master`。\n\n如果你已经在机器上安装了 `Eigen`\
  \ 并想使用它，你需要做的只是让 `CMake` 寻找该库：\n\n```cmake\ncmake_minimum_required (VERSION 3.0)\n\
  project (eigen_premier)\nfind_package (Eigen3 3.4 REQUIRED NO_MODULE)\nadd_executable\
  \ (${PROJECT_NAME} main.cpp)\ntarget_link_libraries (${PROJECT_NAME} Eigen3::Eigen)\n\
  ```\n\n取决于你如何在系统上安装 `Eigen`，`CMake` 可能无法找到它。在这种情况下，请检查 `Eigen` 在线文档以了解如何操作。\n\n\
  ## 常见矩阵操作 (#contents.xhtml_sc3_23a)\n\n一旦我们在路径中拥有了 `Eigen`，让我们学习如何使用它在 C++ 中执行矩阵操作。最臭名的矩阵操作是矩阵相乘，通常称为矩阵乘积或\
  \ `mulmat`：\n\n```cpp\n#include <iostream>\n#include <Eigen/Dense>\n\nint main(int,\
  \ char ** ) \n{\n  Eigen::MatrixXd A(2, 2);\n  A(0, 0) = 2.;\n  A(1, 0) = -2.;\n\
  \  A(0, 1) = 3.;\n  A(1, 1) = 1.;\n\n  Eigen::MatrixXd B(2, 3);\n  B(0, 0) = 1.;\n\
  \  B(1, 0) = 1.;\n  B(0, 1) = 2.;\n  B(1, 1) = 2.;\n  B(0, 2) = -1.;\n  B(1, 2)\
  \ = 1.;\n\n  auto C = A*B;\n  std::cout << \"A:\\n\" << A;\n  std::cout << \"B:\\\
  n\" << B;\n  std::cout << \"C:\\n\" << C;\n  return 0;\n}\n```\n\n注意我们包含了 Eigen\
  \ 头文件：`#include <Eigen/Dense>` 一旦执行，此代码将输出：\n\n![](img/Figure_2.png)\n图 2.6: 使用\
  \ Eigen 的矩阵乘积\n\n如果你熟悉矩阵乘法，你可能知道这种操作仅适用于尺寸兼容的矩阵。限制是第一个矩阵的列数必须完全等于第二个矩阵的行数。请看下面的图：\n\
  \n![](img/Figure_2.png)\n图 2.7: 乘法示例\n\n结果矩阵的行数与第一个矩阵相同，列数与第二个矩阵相同。还有另一种乘以两个矩阵的方法。我们可以进行逐元素乘法，如图所示：\n\
  \n```cpp\nauto D = B.cwiseProduct(C);\nstd::cout << \"coefficient-wise multiplication\"\
  \ << D;\n```\n\n在逐元素乘法中，`B` 和 `C` 的系数必须匹配，如下：\n\n![](img/Figure_2.png)\n图 2.8: 乘法示例\n\
  \n## 计算矩阵的转置和求和 (#contents.xhtml_sc3_2)\n\n一旦我们在路径中拥有了 `Eigen`，让我们学习如何使用它在 C++ 中执行矩阵操作。最臭名的矩阵操作是矩阵相乘，通常称为矩阵乘积或\
  \ `mulmat`：\n\n```cpp\n#include <iostream>\n#include <Eigen/Dense>\n\nint main(int,\
