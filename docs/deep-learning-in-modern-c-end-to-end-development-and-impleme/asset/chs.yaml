  \ kernels_0.dimension(3), 32);\n    load_tensor_from_file(kernels_1, \"models/dogs_cats_augmentation/runs/87.27/39/conv2d_1.txt\"\
  );\n    this->conv2d_1 = new Conv2DLayer(device, kernels_1, new ReLU<DEVICE, 4>(device),\
  \ std::vector<int>{1, 1, 1, 1});\n    this->conv2d_1->set_optimizer(Adam<4>());\n\
  \    this->maxpooling_1 = new MaxPooling(device, 2);\n    Tensor_4D kernels_2(kernel_size,\
  \ kernel_size, kernels_1.dimension(3), 64);\n    load_tensor_from_file(kernels_2,\
  \ \"models/dogs_cats_augmentation/runs/87.27/39/conv2d_2.txt\");\n    this->conv2d_2\
  \ = new Conv2DLayer(device, kernels_2, new ReLU<DEVICE, 4>(device), std::vector<int>{1,\
  \ 1, 1, 1});\n    this->conv2d_2->set_optimizer(Adam<4>());\n    this->maxpooling_2\
  \ = new MaxPooling(device, 2);\n    this->flatten = new FlattenLayer<DEVICE, 4>(device);\n\
  \    int reduced_image_size = IMG_SIZE / 8;\n    const int flatten_size = reduced_image_size\
  \ * reduced_image_size * kernels_2.dimension(3);\n    Tensor_2D W1(flatten_size,\
  \ hidden_neurons);\n    glorot_uniform_initializer(rng, W1);\n    this->dense =\
  \ new DenseLayer(device, W1, new ReLU<DEVICE, 4>(device));\n    this->dense->set_optimizer(Adam<4>());\n\
  \    this->output_layer = new SoftmaxLayer(device);\n  }\nprivate:\n  int IMG_SIZE;\n\
