  \n## 使用梯度来最小化损失函数\n\n为了获得更深入的见解，让我们绘制上一个示例中找到的 `MSE` 损失：\n\n![](img/Figure_6.18.png)\n\
  \n图 6.18: 绘制代价曲线\n\n由于我们正在寻找最小代价，因此我们对找到此图表的最小点感兴趣。我们之前的（幼稚且贪婪的）算法基本上是计算此图表的每个值，并返回较小的一个。虽然这种方法对于我们的简单示例有效，但要广泛应用于任何实际的多维问题，它的成本太高了。换句话说，我们需要找到更好的替代方案。\n\
  \n再次查看图表，很明显我们可以利用曲线的斜率来决定算法应该向哪个方向移动代价最小值。例如，在第一步中，`a` 为 -4。我们可以计算两点之间的斜率：在 -4\
  \ 和 `(-4 + 0.01)` 处的 `a` 之间：\n\n![](img/Figure_6.19.png)\n\n图 6.19: 寻找 `a = -4`\
  \ 处的梯度\n\n该曲线的斜率由公式给出：\n\n![](img/Figure_6.20.png)\n\n图 6.20: 计算 `a = -4` 处的梯度\n\
  \n现在我们知道如何计算梯度了，我们可以用它来做决策：如果 `grad` 为正，为了向最小值移动，我们必须将参数 `a` 向左移动。如果斜率为负，我们必须将参数\
  \ `a` 向右移动。换句话说，如果斜率为负，我们应该增加 `a`。但增加多少呢？更好的选择是使用斜率本身来此此参数更新：\n\n![](img/Figure_6.21.png)\n\
  \n图 6.21: 参数更新规则\n\n如果我们反复重复这个过程，在某个一点，会发生以下一个或多个场景之一：\n\n* 代价将为零或太小\n* 斜率将为零或太小\n\
  * 步数将过多\n\n如果我们检测到至少一个这些停止条件，就可以停止算法。以下代码说明了该算法：\n\n```cpp\nint main(int, char**)\
  \ {\n  auto [X, Y] = synthetic_generator(30, 10.f, 2.f, 3.f, 2.f);\n  float Cx =\
  \ ((Eigen::Tensor<float, 0>)(X.mean()))(0);\n  float Cy = ((Eigen::Tensor<float,\
  \ 0>)(Y.mean()))(0);\n  auto cost_calc = &Cx, &Cy {\n    auto S = &a, &Cx, &Cy {\n\
  \      return a * (x - Cx) + Cy;\n    };\n    Eigen::Tensor<float, 2> pred = X.unaryExpr(S);\n\
  \    return mse(pred, Y);\n  };\n  float a = -4.f;\n  const float step = 0.01f;\n\
  \  float best_a = a;\n  float best_cost = std::numeric_limits<float>::max();\n \
  \ const int MAX_EPOCHS = 20;\n  int epoch = 0;\n  while (epoch++ < MAX_EPOCHS) {\n\
  \    float cost_init = cost_calc(a);\n    if (cost_init < best_cost) {\n      best_cost\
  \ = cost_init;\n      best_a = a;\n    }\n    if (abs(grad) < 1e-5) break; // 注意：此处原文逻辑似乎有误，但按原意翻译\n\
  \    // ... (注：原文代码块中存在逻辑跳跃，此处仅保持其原始结构，仅对可翻译的注释进行处理，但原文代码中为纯代码，故保持不变。)\n  }\n}\n\
  ```\n\n预期输出是：\n\n![](img/Figure_6.22.png)\n\n图 6.22: 使用梯度寻找近似\n\n检查此日志，我们可以注意到 `MSE`\
  \ 在前几个 epoch 中持续下降。我们可以通过图表检查这种行为：\n\n![](img/Figure_6.23.png)\n\n图 6.23: 算法收敛\n\
  \n红色箭头指示了算法在前几个 epoch 中收敛到全局最小值，正如我们梯度的概念所示。此外，与之前的算法那样通过 800 次迭代扫描搜索空间不同，基于梯度的算法\
  \ [3] 在少数几个 epoch 内找到了解决方案。\n\n\n\n\n```\nauto diff = TRUE - PRED;\nauto loss =\
  \ diff.abs();\nT sum = ((Eigen::Tensor<T, 0>)(loss.sum()))(0);\nT result = sum /\
  \ PRED.size();\nreturn result;\n```\n\nMAE 的一个优点是它的可解释性：它提供了一个与预测值单位相同的数值。例如，如果\
  \ MAE 是 50 且预测单位是米，我们可以推断出模型误差为 ± `50` 米。\n\n## 双曲对数余弦\n\n双曲对数余弦代价函数 [9]，或简称为 `LOGCOSH`，与\
  \ MAE 和 MSE 相似。像 MAE 一样，它提供了一个与预测单位相同的数值（具有良好的可解释性），并对错误预测进行线性惩罚。然而，像 MSE 一样，`LOGCOSH`\
  \ 在 `PRED = REAL` 附近是可的。\n\n检查 `LOGCOSH` 公式：\n\n![](img/Figure_6.25.png)\n\n图 6.25:\
  \ 算法收敛\n\n我们可以如下如下实现 `LOGCOSH`：\n\n```cpp\ntemplate <typename T, int _RANK>\nauto\
  \ logcosh(const Eigen::Tensor<T, _RANK> &PRED, const Eigen::Tensor<T, _RANK> &TRUE)\
  \ {\n  auto diff = TRUE - PRED;\n  auto cosh = diff.unaryExpr([](T val){return std::cosh(val);});\n\
  \  auto loss = cosh.log();\n  T sum = ((Eigen::Tensor<T, 0>)(loss.sum()))(0);\n\
  \  T result = sum / PRED.size();\n  return result;\n}\n```\n\n检查以下 `LOGCOSH` 图像图：\n\
  \n![](img/Figure_6.26.png)\n\n图 6.26: LOGCOSH 函数图\n\n## 分类问题的代价函数\n\n当模型的输出为实数时，`MSE`、`MAE`\
  \ 和 `LOGCOSH` 等代价函数是非常有用的。在我们的示例中，直线斜率 `a` 可以是任何实数。在这种情况下，我们将该任务命名为回归问题。\n\n正如本章开头讨论的，在机器学习中存在其他类型的任务。分类问题是一种非常常见的任务类型，系统必须决定为特定的输入分配哪个标签（或多个标签）。例如，考虑以下分类器：\n\
  \n![](img/Figure_6.27.png)\n\n图 6.27: 算法收敛\n\n在这个示例中，分类器必须在三种可选方案中决定图片中动物的种类：鸟、猫和狗。\n\
  \n这里的重点在于，与回归问题不同，分类器的输出是离散的、通常是无序的有限标签集。因此，通常我们不能使用之前的某种代价函数之一（如 `MSE` 或 `LOGCOSH`）来直接评估分类器。为了计算分类器的代价，我们使用专门为该任务设计的函数。其中两个——二元交叉熵和分类交叉熵将在后面进行讨论。\n\
  \n## 二元交叉熵\n\n二元分类器是分类器的一种特殊例，它只在两个标签之间做出决定。例如：\n\n![](img/Figure_6.28.png)\n\n\
  图 6.28: 用于检测猫的分类器\n\n对分类器输出的一种方法是给一个标签分配 `0`（零），给另一个标签分配 `1`（一）。如果我们遵循这一标准，就可以使用以下被称为二元交叉熵（`BCE`）的代价函数：\n\
  \n![](img/Figure_6.29.png)\n\n图 29: 二交叉公式\n\n该函数包含两个部分。如果 `REAL` 为 `1`，求和项基本上为：\n\
  \n![](img/Figure_6_30.png)\n\n图 30: 1 时的 BCE 公式\n\n另一方面，如果 `REAL` 为 `0`，这部分为零，求和项基本上为：\n\
  \n![](img/Figure_6.31.png)\n\n图 31: 0 时的 BCE 公式\n\n使用 `BCE` 需要注意的是，`log(x)` 仅在 `x\
  \ > 0` 时定义。因此，通常我们会添加一个小的因子，例如：\n\n![](img/Figure_6.32.png)\n\n图 32: 使用 log() 修复数值问题\n\
  \n其中 `ε` 是一个像 `1e-7` 的小数字。以下程序是 `BCE` 的用法：\n\n```cpp\ntemplate <typename T, int\
  \ _RANK>\nT bce(const Eigen::Tensor<T, _RANK> &PRED, const Eigen::Tensor<T, _RANK>\
  \ &TRUE) {\n  auto COMP_TRUE = TRUE.constant(1.) - TRUE;\n  auto COMP_PRED = PRED.constant(1.)\
  \ - PRED;\n  auto part1 = TRUE * (PRED + PRED.constant(1e-7)).log();\n  auto part2\
  \ = COMP_TRUE * (COMP_PRED + COMP_PRED.constant(1e-7)).log();\n  auto parts = part1\
