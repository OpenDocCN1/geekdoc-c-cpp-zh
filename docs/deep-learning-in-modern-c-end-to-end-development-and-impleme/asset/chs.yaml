  \n\n\n\n在本次实验中，我们冻结了几乎但并非所有的 VGG 层，只留下最后一个卷积层为可训练（注意 `maxpooling` 层不具有可训练状态）。因此，`backward()`\
  \ 方法简单如下：\n\n```cpp\nvoid backward(const Tensor_2D &classifier_TRUE, const Tensor_2D\
  \ &regressor_TRUE) {\n  classifier_head->backward(classifier_TRUE, true);\n  MSE\
  \ mse_fn;\n  const Tensor_2D regressor_upstream = mse_fn.derivative(regressor_TRUE,\
  \ regressor_head->get_output());\n  regressor_head->backward(regressor_upstream,\
  \ true);\n  regressor_neck_1->backward(regressor_head->get_downstream(), true);\n\
  \  regressor_neck_2->backward(regressor_neck_1->get_downstream(), true);\n  regressor_neck_3->backward(regressor_neck_2->get_downstream(),\
  \ true);\n  // combined backward\n  Tensor_2D combined_gradient = classifier_head->get_downstream()\
  \ + regressor_neck_3->get_downstream();\n  dense->backward(combined_gradient, true);\n\
  \  // Fine tunning. Backwards the last VGG layer\n  flatten->backward(dense->get_downstream(),\
  \ true);\n  block5_pool->backward(flatten->get_downstream(), true);\n  block5_conv3->backward(block5_pool->get_downstream(),\
  \ false);\n}\n```\n\n正如上一个实验所示，我们正在将两个分支（分类器头部和回归器头部）结合，在交叉层形成一个唯一的梯度。\n\n由于冻层的存在，`update`\
  \ 方法实际上只更新了四个层：\n\n```cpp\nvoid update(const TYPE learning_rate, int epoch) {\n\
  \  dense->update(learning_rate, epoch);\n  classifier_head->update(learning_rate,\
  \ epoch);\n  regressor_head->update(learning_rate, epoch);\n  regressor_neck_1->update(learning_rate,\
  \ epoch);\n  regressor_neck_2->update(learning_rate, epoch);\n  regressor_neck_3->update(learning_rate,\
  \ epoch);\n  block5_conv3->update(learning_rate, epoch);\n}\n```\n\n使用 Oxford Pet\
  \ 数据集对该模型进行五个 epoch 的训练输出如下：\n\n![](img/Figure_17.21.png)\n\n图 17.21：使用微调和 Oxford\
  \ Pets 数据库训练基于 VGG16 的模型\n\n新模型在分类准确率和回归损失方面的表现显著优于之前的模型。让我们在验证数据上采样一些边界框预测：\n\n\
