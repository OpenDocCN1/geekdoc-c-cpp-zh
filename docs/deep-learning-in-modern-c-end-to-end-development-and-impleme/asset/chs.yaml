  \        flatten = new FlattenLayer();\n        dense = new DenseLayer(device);\n\
  \        output_layer = new DenseLayer(device);\n    }\n    // ...\nprivate:\n \
  \   int IMG_SIZE;\n    Conv2DLayer<DEVICE> *conv2d_0;\n    MaxPooling<DEVICE> *maxpooling_0;\n\
  \    DropoutLayer<DEVICE, 4, GEN> *dropout_0;\n    Conv2DLayer<DEVICE> *conv2d_1;\n\
  \    MaxPooling<DEVICE> *maxpooling_1;\n    DropoutLayer<DEVICE, 4, GEN> *dropout_1;\n\
  \    Conv2DLayer<DEVICE> *conv2d_2;\n    MaxPooling<DEVICE> *maxpooling_2;\n   \
  \ DropoutLayer<DEVICE, 4, GEN> *dropout_2;\n    FlattenLayer<DEVICE, 4> *flatten;\n\
  \    DenseLayer<DEVICE> *dense;\n    DropoutLayer<DEVICE, 2, GEN> *dropout;\n  \
  \  DenseLayer<DEVICE> *output_layer;\n};\n```\n\n```cpp\nvoid forward(const Tensor_4D\
  \ &input) {\n}\n```\n\n\n\n\n2. `conv2d_0->forward(input);`\n\n3. `maxpooling_0->forward(conv2d_0->get_output());`\n\
  \n4. `dropout_0->forward(maxpooling_0->get_output());`\n\n6. `conv2d_1->forward(dropout_0->get_output());`\n\
  \n7. `maxpooling_1->forward(conv2d_1->get_output());`\n\n8. `dropout_1->forward(maxpooling_1->get_output());`\n\
  \n10. `conv2d_2->forward(dropout_1->get_output());`\n\n11. `maxpooling_2->forward(conv2d_2->get_output());`\n\
  \n12. `dropout_2->forward(maxpooling_2->get_output());`\n\n14. `flatten->forward(dropout_2->get_output());`\n\
  \n15. `dense->forward(flatten->get_output());`\n\n16. `dropout->forward(dense->get_output());`\n\
  \n17. `output_layer->forward(dropout->get_output());`\n\n18. `}`\n\n此外，反向传播：\n\n\
  1. `void backward(const Tensor_2D &upstream) {`\n\n2. `output_layer->backward(upstream,\
  \ true);`\n\n3. `dropout->backward(output_layer->get_downstream(), true);`\n\n4.\
  \ `dense->backward(dropout->get_downstream(), true);`\n\n5. `flatten->backward(dense->get_downstream(),\
  \ true);`\n\n7. `dropout_2->backward(flatten->get_downstream(), true);`\n\n8. `maxpooling_2->backward(dropout_2->get_downstream(),\
  \ true);`\n\n9. `conv2d_2->backward(maxpooling_2->get_downstream(), true);`\n\n\
  11. `dropout_1->backward(conv2d_2->get_downstream(), true);`\n\n12. `maxpooling_1->backward(dropout_1->get_downstream(),\
  \ true);`\n\n13. `conv2d_1->backward(maxpooling_1->get_downstream(), true);`\n\n\
  15. `dropout_0->backward(conv2d_1->get_downstream(), true);`\n\n16. `maxpooling_0->backward(dropout_0->get_downstream(),\
  \ true);`\n\n17. `conv2d_0->backward(maxpooling_0->get_downstream(), false);`\n\n\
  18. `}`\n\n注意，我们不应该在预测中添加 dropout。因此，预测过程保持不变：\n\n```\n1. `Tensor_2D predict(const\
  \ Tensor_4D &input) {`\n2. `auto y1 = conv2d_0->predict(input);`\n3. `auto y2 =\
  \ maxpooling_0->predict(y1);`\n5. `auto y3 = conv2d_1->predict(y2);`\n6. `auto y4\
  \ = maxpooling_1->predict(y3);`\n8. `auto y5 = conv2d_2->predict(y4);`\n9. `auto\
  \ y6 = maxpooling_2->predict(y5);`\n11. `auto y7 = flatten->predict(y6);`\n12. `auto\
  \ y8 = dense->predict(y7);`\n13. `auto result = output_layer->predict(y8);`\n14.\
  \ `return std::move(result);`\n15. `}`\n```\n\n在包含 dropout 后训练模型得到的结果如下：\n\n![](img/Figure_15.21.png)\n\
  \n图 15.21：首次尝试使用 dropout 避免过拟合\n\n这个结果看起来并不理想。训练实现的性能甚至不如第一个纯裸机模型（bare metal model）。这可能发生了什么？\n\
  \n看来模型在第 7 个 epoch 之后仍然处于过拟合状态。解决方案是增加一个或多个 dropout 层的丢弃率。问题是，哪些层呢？\n\n体积最大的层就是受\
  \ dropout 影响最大的层。在我们的模型中，最大的层是网络顶部的第一个全连接层（dense layer）。改变此之后 dropout 层的速率将产生最大的影响。\n\
  \n例如，让我们最后一个 dropout 层的速率从 0.5 改为 0.8：\n\n```\n1. `dropout = new DropoutLayer<DEVICE,\
  \ 2, GEN>(device, 0.8, rng);`\n```\n\n在此更改后再次运行训练，终于得到了更好的结果：\n\n![](img/Figure_15.22.png)\n\
  \n图 15.22：使用 dropout 避免过拟合\n\n这里要指出的是，带有 dropout 的模型需要更多的 epoch 来收敛。因此，我们用 25 个\
  \ epoch 来训练 dropout 版本，而不是 10 个。使用 dropout 的另一个重要点是，训练受到随机噪声的影响很大。因此，无法获得平滑的单调验证损失曲线。值得注意的是，验证损失在最后几个\
  \ epoch 显示出增长趋势，这意味着增加模型训练时间将无益。\n\n| 注意结果可能有所不同，因为它们取决于随机因素 |\n\n### 使用数据增强\n\n\
  上述类通过重写 `processing_image` 方法扩展了我们之前的 `Parallelches` 批处理管理器。我们使用 `uniform_real_distribution`\
  \ 来绘制 0 到 1 之间的数字，有 50% 的概率翻转图像。该分布还用于生成随机的垂直和水平平移（最大 10%）以及 [-15°, 15°] 范围旋转。\n\
  \n```cpp\n1. `template<typename Generator>`\n2. `class Data_Augmentation_Batches\
  \ : public Parallelches<Generator> {`\n3. `public:`\n4. `Data_Augmentation_Batches(Generator&\
  \ gen, int batch_size, int image_size) :`\n5. `Parallelches(gen, batch_size, image_size),`\n\
  6. `distribution(std::uniform_real_distribution<float>(0.0f, 1.0f)) {`\n7. `}`\n\
  8. `virtual void processing_image(cv::Mat &src, cv::Mat &dest) {`\n9. `cv::Mat flipped,\
  \ rotated;`\n10. `if (distribution(rng) > 0.5) {`\n11. `dest = rotate_and_translate(flipped,\
  \ angle, horizontal_delta, vertical_delta);`\n12. `} else {`\n13. `flipped = src;`\n\
  14. `}`\n15. `}`\n16. `private:`\n`std::uniform_real_distribution<float> distribution;`\n\
  };`\n```\n\n注意：旋转、缩放和其他图像变换会导致空白区域。在本研究中，我们将这些区域填充为灰色。\n\n我们可以查看以下生成的增强图像示例：\n\n\
  ![](img/Figure_15.23.png)\n\n图 15.23：增强图像示例\n\n现在，再次使用增强数据训练模型，得到了如下性能：\n\n![](img/Figure_15.24.png)\n\
  \n图 15.24：使用数据增强避免过拟合\n\n数据增强的好处在这里显而易见。模型在最后一个 epoch 达到了 87.47% 的验证准确率。有一些值得注意的点：\n\
  \n*   该数据增强示例中的模型与第一个纯裸机模型相似。也就是说，这种情况下唯一的正则化是由数据增强提供的。\n*   模型训练了 40 个 epoch 都没有出现任何过拟合迹象。训练更多\
  \ epoch 可能会获得更好的性能。\n*   使用增强数据训练模型的效果优于仅使用 dropout。不过，这一发现不应被视为通用法则。\n\n从比较来看，本案例研究中的验证性能与\
  \ Jason Brownlee 在工作中报告的结果没有显著差异，尽管他使用了 Google TensorFlow 实现了略不同的设置和模型。\n\n| 实验\
  \ | 准确率 |\n\n| 使用 Dogs x Cats 数据集训练分类器 | 81.52% |\n\n| 使用 dropout 训练 | 82.36% |\n\
  | 使用数据增强训练 | 87.47% |\n\n表 15.3：实验结果\n\n对于我们而言，这里获得的结果在加强我们使用 C++ 和 Eigen 实现复杂的计算机视觉分类器的能力方面意义重大。\n\
  \n\n\n\n\n## 结论\n\n本章介绍了一个实际案例研究，该案例使用 `C++` 和 `Eigen` 从零开始开发了一个图像分类器。我们详细讨论了在内存中加载和存储大型图像数据集的挑战，并引入了使用异步\
  \ IO 预加载数据块，旨在持续为训练算法提供数据。该图像分类器使用 `Dogs x Cats` 数据集并通过受 `VGG 16` 架构启发的网络进行了训练。\n\
  \n尽管第一次尝试达到了报道的先进性能，但结果受到过拟合的严重影响。因此，我们使用了 `dropout` 和 `data augmentation` 两种正则化技术来减少过拟合的影响，最终达到了\
  \ 87% 的验证准确率。\n\n一如既往，我们会问是否可以做得更好。答案是肯定的。然而，为了获得更高的性能，我们需要增加模型容量并复用一些之前训练过的权重，这种技术被称为`迁移学习`，将在下一章中介绍。\n\
