  \ `∂C` 除以 `∂Y`。事实上，![](img/eq210.jpg) 意味着函数 `C` 对变量 `Y` 的偏导数。 |\n\n每个网络训练的目标是计算关于权重的梯度。在我们特定的网络中，这些梯度是\
