  \n![](img/fm1.png)\n\n# 第 17 章：开发目标定位系统\n\n## 引言\n本章介绍了目标定位系统项目，这是一种特定的混合深度学习模型，能够确定图像中对象的类别和坐标。我们将讨论这些系统的本质，并开发三个实验来学习如何从零开始训练目标定位系统，从基础回归开始，然后将模型与分类器结合，获得一个混合双头模型。\n\
  \n## 结构\n本章涵盖的主题顺序如下：\n* 本章中的实验\n* 定义目标定位系统\n* 实验 1：构建回归模型\n* 实验 2：训练目标定位模型\n* 使用\
  \ `IoU` 比较边界框预测\n* 实验 3：使用带有微调的迁移学习\n\n## 目标\n本章通过实现一个混合模型，展示目标定位系统的开发，该模型使用本书为止讨论过的技术和算法来寻找并分类图像中的对象。通过阅读本章，读者将理解仅使用\
  \ `C++` 和 `Eigen` 开发真实且复杂的混合计算机视觉系统的关键挑战。读者还将学习用于比较此类系统的标准指标，并应用迁移学习通过重用预训练网络提高模型性能。\n\
  \n## 本章中的实验\n本章包含三个实验：\n\n| ID | 描述 |\n| :--- | :--- |\n| Exp-17.1 | 构建回归模型 |\n\
  | Exp-17.2 | 训练目标定位模型 |\n| Exp-17.3 | 使用迁移学习提高模型性能 |\n\n表 17.1：章节实验列表\n\n## 定义目标定位系统\n\
  生物体的核心能力之一是识别视觉区域中的物体及其位置。重现这种能力是多年深度学习中较为活跃的研究领域之一，并带来了如目标定位系统等进展。\n\n目标定位系统是一种特殊的混合模型，它结合了两个任务：物体坐标的定位和物体类别的分类。查看以下示例：\n\
  \n![](img/Figure_17.1.png)\n图 17.1：带有边界框标注的图像\n\n在前面的图中，我们识别了物体坐标及其类别。坐标以边界框的形式给出。边界框是界定对象的最小矩形区域。在上面的示例中，每张图像仅只有一个感兴趣的对象。当然，通常情况下，单张图像会描述多个对象。考虑以下示例：\n\
  \n![](img/Figure_17.2.png)\n图 17.2：具有两个语义对象的图像示例\n\n目标定位模型一次只能处理图像中的一个对象。能够识别同一张图像中多个对象的模型有一个特殊的名称，即目标检测器。\n\
  \n> 注意：为了简单起见，本章仅关注目标定位模型。\n\n边界框是使用四个数字在 2D 图像空间上定义的矩形。遗憾的是，这里并没有标准。一些流行的配置有：\n\
  * `(x, y, w, h)`：其中 `(x,y)` 是左上角点的坐标，`w` 表示矩形宽度，`h` 是矩形高度。\n* `(xc, yc, wh, hh)`：其中\
  \ `(xc, yc)` 是矩形的中心，`wh` 是半宽，`hh` 是半高。\n* `(x1, y1, x2, y2)`：`(x1, y1)` 是左上角，`(x2,\
  \ y2)` 是右下角。\n\n此外，有时以像素给出坐标，有时将其归一化为 0 到 1 之间。本质上，定位模型执行两个任务：\n* 物体的分类\n* 边界框的回归\n\
  \n## 实验 1：构建回归模型\n本实验介绍了使用回归训练一个用于检测边界框的模型。在介绍细节之前，让我们先讨论回归。回归的一个典型示例是根据特征（如面积、年龄、形状等）预测房价的系统。用于此任务的知名数据集是波士顿数据集\
  \ [[17.ref1]]。在输入变量较小时，这类问题被深入研究。\n\n使用数字图像预测边界框的任务超过了感知机的局限性，需要更先进的模型，如卷积网络。考虑以下示例：\n\
  \n![](img/Figure_17.3.png)\n图 17.3：第一个回归模型\n\n我们将使用该模型进行回归。它的实现如下：\n\n```cpp\ntemplate\
  \ <typename DEVICE, typename GEN>\nclass Model {\npublic:\n    Model(DEVICE &device,\
  \ GEN &rng, int img_size) : IMG_SIZE(img_size) {\n        const int kernel_size\
  \ = 3;\n        const int channels = 3;\n        const int hidden_neurons = 512;\n\
  \        Tensor_4D kernels_0(kernel_size, kernel_size, channels, 16);\n        lorot_uniform_initializer(rng,\
  \ kernels_0);\n        conv2d_0 = new Conv2DLayer(device, kernels_0, new ReLU<4>());\n\
  \        maxpooling_0 = new MaxPooling(device, 2);\n\n        Tensor_4D kernels_1(kernel_size,\
  \ kernel_size, kernels_0.dimension(3), 32);\n        lorot_uniform_initializer(rng,\
  \ kernels_1);\n        conv2d_1 = new Conv2DLayer(device, kernels_1, new ReLU<4>());\n\
  \        maxpooling_1 = new MaxPooling(device, 2);\n\n        Tensor_4D kernels_2(kernel_size,\
  \ kernel_size, kernels_1.dimension(3), 64);\n        lorot_uniform_initializer(rng,\
  \ kernels_2);\n        conv2d_2 = new Conv2DLayer(device, kernels_2, new ReLU<4>());\n\
  \        maxpooling_2 = new MaxPooling(device, 2);\n\n        flatten = new FlattenLayer<DEVICE,\
  \ 4>(device);\n\n        int reduced_image_size = IMG_SIZE / 8;\n        const int\
  \ flatten_size = reduced_image_size * reduced_image_size * kernels_2.dimension(3);\n\
  \    }\n};\n```\n\n\n\n\n\n```cpp\n37. Tensor_2D WD(flatten_size, hidden_neurons);\n\
  38. glorot_uniform_initializer(rng, WD);\n39. dense = new DenseLayer(device, WD,\
  \ new ReLU<2>());\n41. dropout = new DropoutLayer<DEVICE, 2, GEN>(device, 0.5, rng);\n\
  43. Tensor_2D WR(hidden_neurons, 4);\n44. glorot_uniform_initializer(rng, WR);\n\
  45. regressor_head = new DenseLayer(device, WR, new Sigmoid<2>());\n47. }\n49. private:\n\
  51. Conv2DLayer<DEVICE> *conv2d_0;\n52. MaxPooling<DEVICE> *maxpooling_0;\n54. Conv2DLayer<DEVICE>\
  \ *conv2d_1;\n55. MaxPooling<DEVICE> *maxpooling_1;\n57. Conv2DLayer<DEVICE> *conv2d_2;\n\
  58. MaxPooling<DEVICE> *maxpooling_2;\n60. FlattenLayer<DEVICE, 4> *flatten;\n61.\
  \ DenseLayer<DEVICE> *dense;\n62. DropoutLayer<DEVICE, 2, GEN> *dropout;\n64. DenseLayer<DEVICE>\
  \ *regressor_head;\n66. };\n```\n\n让我们深入研究模型的细节。\n\n### 输出层\n\n与分类器不同，回归模型不使用 `softmax`\
  \ 层作为输出。请记住 `softmax` 模拟的是离散概率分布。例如，`softmax` 的输出之和必须为 1。当然，这个限制并不适用于图像中对象的边界框（bounding\
  \ box）坐标。因此，使用如 `linear`、`sigmoid` 甚至 `ReLU` 等逐系数激活函数来定义输出层更加方便：\n\n1. `Tensor_2D\
  \ WR(hidden_neurons, 4);`\n2. `glorot_uniform_initializer(rng, WR);`\n3. `regressor_head\
  \ = new DenseLayer(device, WR, new Sigmoid<2>());`\n4. `regressor_head->set_optimizer(Adam<2>());`\n\
  \n### 反向传播\n\n同样，交叉熵损失函数更适用于分类问题。通常情况下，不同类别之间没有数值关系。事实证明，在回归中，输出是数值，这允许我们使用能够利用这种数值关系的损失函数。\n\
  \n由于其简单性和快速性，均方误差（`MSE`）是回归问题更流行的损失函数：\n\n![](img/1.jpg)\n\n其中 `TRUE` 是真值（ground\
  \ truth），`PRED` 是模型预测，`N` 是 `TRUE` 的大小。\n\n> 注意：MSE 在第 6 章“通过最小化代价函数进行学习”中介绍。\n\n\
  我们可以如下在回归模型的反向步骤中使用 `MSE`：\n\n```cpp\nvoid backward(const Tensor_2D &TRUE) {\n \
  \ MSE mse_fn;\n  auto PRED = regressor_head.get_output();\n  auto upstream_gradient\
  \ = mse_fn.derivative(TRUE, PRED);\n  regressor_head->backward(upstream_gradient,\
  \ true);\n  dropout->backward(regressor_head->get_downstream(), true);\n  dense->backward(dropout->get_downstream(),\
  \ true);\n  flatten->backward(dense->get_downstream(), true);\n  maxpooling_2->backward(flatten->get_downstream(),\
  \ true);\n  conv2d_2->backward(maxpooling_2->get_downstream(), true);\n  maxpooling_1->backward(conv2d_2->get_downstream(),\
  \ true);\n  conv2d_1->backward(maxpooling_1->get_downstream(), true);\n  maxpooling_0->backward(conv2d_1->get_downstream(),\
  \ true);\n  conv2d_0->backward(maxpooling_0->get_downstream(), false);\n}\n```\n\
  \n### 加载边界框数据\n\n用于训练模型的数据由四元组（`Xmin`, `Ymin`, `Xmax`, `Ymax`）组成：\n\n![](img/Figure_17.4.png)\n\
  \n图 17.4：本章使用的坐标系\n\n每个图像标注数据必须如下分批量（batch）馈给模型：\n\n```cpp\nfor (int i = 0; i <\
  \ batch_size; ++i) {\n  int instance = instance_indexes[begin + i];\n  const std::string\
  \ &path = (*data)(instance, 0);\n  cv::Mat src = cv::imread(path, cv::IMREAD_COLOR);\n\
  \  if (src.empty()) {\n    throw std::invalid_argument(path + \" is not a valid\
  \ image.\");\n  }\n  int width = std::stoi((*data)(instance, 2));\n  int height\
  \ = std::stoi((*data)(instance, 3));\n  int xmin = std::stoi((*data)(instance, 4));\n\
  \  int ymin = std::stoi((*data)(instance, 5));\n  int xmax = std::stoi((*data)(instance,\
  \ 6));\n  int ymax = std::stoi((*data)(instance, 7));\n  cv::Mat processed_image,\
  \ squared;\n  if (center_images) {\n    make_image_square(src, squared, xmin, ymin,\
  \ xmax, ymax);\n    int max_side = std::max(width, height);\n    width = max_side;\n\
  \    height = max_side;\n  } else {\n    squared = src;\n  }\n  processing_image(squared,\
  \ xmin, ymin, xmax, ymax);\n  convert_to_tensor(processed_image, tensor);\n  batch.X(i)\
  \ = tensor;\n  batch.Y(0) = xmin / width;\n  batch.Y(1) = ymin / height;\n  batch.Y(2)\
  \ = xmax / width;\n  batch.Y(3) = ymax / height;\n}\n```\n\n> 注意，由于数据增强，我们必须确保 `Xmin`,\
  \ `Ymin`, `Xmax` 和 `Ymax` 落在 [0..1] 区间。\n\n模型的其他部分与之前章节中的分类模型非常相似。\n\n### 训练回归模型\n\
  \n一旦完成了模型定义，我们就可以进入模型训练。为此，我们需要一个带有边界框标注的数据集。Oxford Pets 是一个提供此类标注的数据集示例。我们将在详细介绍该数据集。\n\
  \n> 注意：下载 Oxford 数据集的说明可以在在线仓库中找到。\n\n我们可以使用以下常用代码调用新模型的训练：\n\n```cpp\nint main(int,\
  \ char **) {\n  using DEVICE = Eigen::ThreadPoolDevice;\n  using GEN = std::mt19937;\n\
  \  using MODEL = Model<DEVICE, GEN>;\n  std::random_device rd{};\n  const auto seed\
  \ = rd();\n  GEN rng(seed);\n  const int threads = std::thread::hardware_concurrency();\n\
  \  Eigen::ThreadPool tp(threads);\n  DEVICE device(&tp, threads);\n  const int IMAGE_SIZE\
  \ = 224;\n  MODEL model(device, rng, IMAGE_SIZE);\n  run_experiment<DEVICE, GEN,\
  \ MODEL, Data_Augmentation_ParallelBatches<GEN>>(\n    \"../../data/Oxford-IIIT_Pet_Dataset\"\
  ,\n    model, device, rng, \n    40, // epochs\n    16, // minibatch_size\n    0.001,\
  \ // learning_rate\n    false // square_images\n  );\n  std::cout << \"success\\\
  n\";\n  return 0;\n}\n```\n\n### 实验 2：训练目标定位模型\n\n该实验由构建一个目标定位系统，该系统同时执行分类和回归任务。\n\
  \n结合这两个模型的粗暴方法是构建两个独立的模型并调用它们，将相同的输入传递给它们。当然，这样挂载目标定位会浪费资源、训练时间、内存并产生重复处理。我们可以做得更好吗？当然，可以。\n\
  \n\n\n\n在一种更好的解决方案中，我们将两个模型合并为一个，如下所示所示：\n\n![](img/Figure_17.7.png)\n\n图 17.7：实现目标定位系统的双头网络\n\
  \n在书中之前介绍的模型在某种程度上是线性的，只有一个输入和一个输出。然而，上面的模型有一个输入但两个输出。我们该如何连接这样一个模型呢？请查看以下实现：\n\n\
  ```cpp\ntemplate <typename DEVICE, typename GEN>\nclass Model {\npublic:\n  Model(DEVICE\
  \ &device, GEN &rng, int img_size): IMG_SIZE(img_size) {\n    const int kernel_size\
  \ = 3;\n    const int channels = 3;\n    const int hidden_neurons = 512;\n    const\
  \ int num_classes = NUMBER_CLASSES;\n    Tensor_4D kernels_0(kernel_size, kernel_size,\
  \ channels, 16);\n    glorot_uniform_initializer(rng, kernels_0);\n    conv2d_0\
  \ = new Conv2DLayer(device, kernels_0, new ReLU<4>());\n    maxpooling_0 = new MaxPooling(device,\
  \ 2);\n    Tensor_4D kernels_1(kernel_size, kernel_size, kernels_0.dimension(3),\
  \ 32);\n    glorot_uniform_initializer(rng, kernels_1);\n    conv2d_1 = new Conv2DLayer(device,\
  \ kernels_1, new ReLU<4>());\n    maxpooling_1 = new MaxPooling(device, 2);\n  \
  \  Tensor_4D kernels_2(kernel_size, kernel_size, kernels_1.dimension(3), 64);\n\
  \    glorot_uniform_initializer(rng, kernels_2);\n    conv2d_2 = new Conv2DLayer(device,\
  \ kernels_2, new ReLU<4>());\n    maxpooling_2 = new MaxPooling(device, 2);\n  \
  \  flatten = new FlattenLayer<DEVICE, 4>(device);\n    int reduced_image_size =\
  \ IMG_SIZE / 8;\n    const int flatten_size = reduced_image_size * reduced_image_size\
  \ * kernels_2.dimension(3);\n    Tensor_2D W1(flatten_size, hidden_neurons);\n \
  \   glorot_uniform_initializer(rng, W1);\n    dense = new DenseLayer(device, W1,\
  \ new ReLU<2>());\n    dense->set_optimizer(Adam<2>());\n    dropout = new DropoutLayer<DEVICE,\
  \ 2, GEN>(device, 0.5, rng);\n    Tensor_2D WC(hidden_neurons, num_classes);\n \
  \   glorot_uniform_initializer(rng, WC);\n    classifier_head = new SoftmaxCrossEntropyLayer(device,\
  \ WC);\n    classifier_head->set_optimizer(Adam<2>());\n    Tensor_2D WR(hidden_neurons,\
  \ 4);\n    glorot_uniform_initializer(rng, WR);\n    regressor_head = new DenseLayer(device,\
  \ WR, new Sigmoid<2>());\n  }\nprivate:\n  Conv2DLayer<DEVICE> *conv2d_0;\n  MaxPooling<DEVICE>\
  \ *maxpooling_0;\n  Conv2DLayer<DEVICE> *conv2d_1;\n  MaxPooling<DEVICE> *maxpooling_1;\n\
  \  Conv2DLayer<DEVICE> *conv2d_2;\n  MaxPooling<DEVICE> *maxpooling_2;\n  FlattenLayer<DEVICE,\
  \ 4> *flatten;\n  DenseLayer<DEVICE> *dense;\n  DropoutLayer<DEVICE, 2, GEN> *dropout;\n\
  \  DenseLayer<DEVICE> *classifier_head;\n  DenseLayer<DEVICE> *regressor_head;\n\
  };\n```\n\n这种模型就是我们所知的双头模型。该模型包含一个卷积层序列（特征提取层），紧接着是一个适配层，从该层分支出两个独立的头：\n- 一个用于分类的\
  \ softmax 层\n- 一个用于回归的密集层\n\n层的顺序并不是由构造函数规定的，而是由前向和反向过程规定的。以下代码展示了如何对该模型进行前向传播：\n\
  \n```cpp\nvoid forward(const Tensor_4D &input) {\n  conv2d_0->forward(input);\n\
  \  maxpooling_0->forward(conv2d_0->get_output());\n  conv2d_1->forward(maxpooling_0->get_output());\n\
  \  maxpooling_1->forward(conv2d_1->get_output());\n  conv2d_2->forward(maxpooling_1->get_output());\n\
  \  maxpooling_2->forward(conv2d_2->get_output());\n  flatten->forward(maxpooling_2->get_output());\n\
  \  dense->forward(flatten->get_output());\n  dropout->forward(dense->get_output());\n\
  \  classifier_head->forward(dropout->get_output());\n  regressor_head->forward(dropout->get_output());\n\
  }\n```\n\n注意，`dropout` 层的输出被发送到 `classifier_head` 和 `regressor_head`，在模型中创建了两个分支。\n\
  \n这个简单的解决方案实际上有效，它将计算从之前的层传播到模型的头部。现在，我们必须想办法执行反向计算的方法，结合来自两个头的梯度将其传播到整个共享主干。坦率地说，该解决方案也非常简单，如下所示：\n\
  \n```cpp\nvoid backward(const Tensor_2D &classifier_TRUE, const Tensor_2D &regressor_TRUE)\
  \ {\n  classifier_head->backward(classifier_TRUE);\n  mse_fn;\n  const Tensor_2D\
  \ regressor_upstream = mse_fn.derivative(regressor_TRUE, regressor_head->get_output());\n\
  \  regressor_head->backward(regressor_upstream);\n  // combined backward\n  Tensor_2D\
  \ combined_gradient = classifier_head->get_output() + regressor_head->get_output();\n\
  \  dropout->backward(combined_gradient);\n  dense->backward(dropout->get_output());\n\
  \  flatten->backward(dense->get_output());\n  maxpooling_2->backward(flatten->get_output());\n\
  \  conv2d_2->backward(maxpooling_2->get_output());\n  maxpooling_1->backward(conv2d_2->get_output());\n\
  \  conv2d_1->backward(maxpooling_1->get_output());\n  maxpooling_0->backward(conv2d_1->get_output());\n\
  \  conv2d_0->backward(maxpooling_0->get_output());\n}\n```\n\n这里的技巧非常直接：将两个头的梯度相加。来自\
  \ softmax 层的梯度和回归层的梯度形成了一个单一的合并梯度。由于链式法则，总损失是两个头损失之和，因此得到的合并梯度是两个头部梯度的之和。一旦反向传播计算出梯度，我们就可以像往常一样更新权重：\n\
  \n```cpp\nvoid update(TYPE learning_rate, int epoch) {\n  conv2d_0->update(learning_rate,\
  \ epoch);\n  conv2d_1->update(learning_rate, epoch);\n  conv2d_2->update(learning_rate,\
  \ epoch);\n  dense->update(learning_rate, epoch);\n  classifier_head->update(learning_rate,\
  \ epoch);\n  regressor_head->update(learning_rate, epoch);\n}\n```\n\n| 注意某些层（如\
  \ dropout 和 max pooling）没有需要更新的参数。 |\n\n模型终于定义。现在我们可以开始训练，如接下来所示。\n\n### 实验中使用的数据\n\
  \n在实验中，我们将使用 Oxford Pet 数据集训练目标定位模型，这就是我们在之前的实验中使用的数据集。该数据集包含超过 7 千张猫的照片。每张图片都有一个包含边界标注、对象类别和其他元数据的\
  \ XML 文件。查看以下示例：\n\n```xml\n<annotation>\n  <folder>OXIIIT</folder>\n  <filename>staffordshire_bull_terrier_177.jpg</filename>\n\
  \  <source>\n    <database>OXFORD-IIIT Pet Dataset</database>\n    <annotation>OXIIIT</annotation>\n\
  \    <image>flickr</image>\n  </source>\n  <size>\n    <width>500</width>\n    <height>375</height>\n\
  \    <depth>3</depth>\n  </size>\n  <segmented>0</segmented>\n  <object>\n    <name>dog</name>\n\
  \    <pose>Frontal</pose>\n    <truncated>0</truncated>\n    <occluded>0</occluded>\n\
  \    <bndbox>\n      <xmin>244</xmin>\n      <ymin>105</ymin>\n      <xmax>345</xmax>\n\
  \      <ymax>211</ymax>\n    </bndbox>\n    <difficult>0</difficult>\n  </object>\n\
  </annotation>\n```\n\n\n\n\n该文件中包含比我们需要的更多的信息，例如 `pose`、`difficult` 等。\n\n| 注意：使用\
  \ XML 标注数据集是陈旧且过时的做法。现代数据集使用更紧凑的格式。 |\n\n我们可以使用一个实用程序来加载数据，如下：\n\n```cpp\nstd::cout\
  \ << \"Loading the data, please wait!\\n\";\nauto [training_data, validation_data]\
  \ = load_oxford_pets_dataset(datapath, rng, 0.8);\nstd::cout << \"Data loaded!\\\
  n\";\n```\n\n| 注意：你可以在 GitHub 上的书籍仓库中找到此实验的源代码。 |\n\n一旦加载了数据，我们就可以像常一样训练模型。同样，我们将使用数据增强来实现正则化。虽然在书的目前阶段数据增强不再是一个新概念，但仍有一些重要的细节我们必须引出。\n\
  \n## 数据增强与标注\n\n这里必须强调一点：改变空间特征的增强（如平移、旋转、拉伸、裁剪、缩放、翻转等）需要相应地调整边界框（bounding box）坐标，如下图所示：\n\
  \n![](img/Figure_17.8.png)\n\n图 17.8：标注与数据增强\n\n在这个示例中，图像经过了水平翻转并在垂直方向上平移了少量像素。当然，必须更新边界框坐标以反映这些变化。\n\
  \n由于平移甚至图像缩放导致的边界框重新定义并不比线性代数练习复杂。然而，由于数据增强而旋转边界框并不是那么简单。\n\n事实证明，旋转边界框的边必须与增强后图像的边平行，如下：\n\
  \n![](img/Figure_17.9.png)\n\n图 17.9：旋转边界框\n\n下一个主题将涵盖在旋转后为边界框寻找合适旋转角度的步骤。\n\n##\
  \ 旋转边界框\n\n获取增强后的旋转边界框可以通过两个步骤完成。首先，我们使用与旋转原始图像相同的扭变变换来旋转原始边界框：\n\n![](img/Figure_17.10.png)\n\
  \n图 17.10：旋转边界框\n\n这个旋转后的边界框不适合我们训练模型的目标，因为它的边与增强后的图像边不平行。可以通过将旋转后的边界框替换为包含该旋转框的新边界框来修复它，如下所示：\n\
  \n![](img/Figure_17.11.png)\n\n图 17.11：修复边界框旋转\n\n最后一个边界框就是理想的增强边界框。该操作在以下函数中实现：\n\
  \n```cpp\nvoid processing_image(cv::Mat &src, cv::Mat &dest, int&xmin, int &ymin,\
  \ int &xmax, int &ymax) {\n  cv::Mat flipped, rotated;\n  if (distribution(rng)\
  \ > 0.5) {\n    flipped = horizontal_flip(src);\n    int temp = src.cols - xmax;\n\
  \    xmax = src.cols - xmin;\n    xmin = temp;\n  } else {\n    flipped = src;\n\
  \  }\n  int angle = static_cast<int>((2.f * distribution(rng) - 1.f) * 15);\n  int\
  \ vertical_delta = static_cast<int>((2.f * distribution(rng) - 1.f) * src.rows *\
  \ 0.1);\n  int horizontal_delta = static_cast<int>((2.f * distribution(rng) - 1.f)\
  \ * src.cols * 0.1);\n  dest = rotate_and_translate(flipped, angle, horizontal_delta,\
  \ vertical_delta);\n  // updating bounding box\n  // translating\n  xmin += horizontal_delta;\n\
  \  xmax += horizontal_delta;\n  ymin += vertical_delta;\n  ymax += vertical_delta;\n\
  \  // rotating\n  if (angle != 0) {\n    float c_x = src.cols / 2;\n    float c_y\
  \ = src.rows / 2;\n    float angle_rad = M_PI * angle / 180.;\n    float cos_a =\
  \ std::cos(angle_rad);\n    float sin_a = std::sin(angle_rad);\n    float x1 = c_x\
  \ + cos_a * (xmin - c_x) - sin_a * (ymin - c_x);\n    float y1 = c_y + sin_a * (xmin\
  \ - c_y) + cos_a * (ymin - c_y);\n    float x2 = c_x + cos_a * (xmax - c_x) - sin_a\
