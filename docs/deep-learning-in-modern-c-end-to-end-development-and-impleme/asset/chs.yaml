  \ cv::IMREAD_COLOR);\n11. if(image.empty()) {\n12. throw std::invalid_argument(\"\
  Image file not found\");\n13. }\n15. detect_face(image, face_detector);\n17. return\
  \ 0;\n18. }\n```\n\n将此程序应用于普通图像，得到如下结果：\n\n![](img/Figure_14.5.png)\n\n图 14.5：使用\
  \ Haar 级联分类器检测人脸\n\n此代码使用了一种名为 Haar 级联分类器（Haar Cascade classifier）的原始模型架构。类似于深度学习模型，Haar\
