  \n![](img/fm1.png)\n\n# 第 4 章：卷积的实现\n\n## 引言\n卷积是深度学习中最具标志性的操作。它们是每一个高性能现代机器学习（ML）系统的核心组件，允许我们构建庞大的模式识别系统，并在多种复杂任务中表现出人类的水平。在本章中，我们将介绍这种操作，从零开始实现算法，或使用\
  \ Eigen Tensor API。\n\n## 结构\n本章的路线图如下：\n\n* 卷积简介\n* 实现 2D 卷积\n* 使用填充（padding）\n\
  * 图像中的边缘检测\n* 使用张量实现卷积\n* 在 C++ 中使用张量\n* 张量卷积\n* 步长（Strides）\n* 使用 Eigen Tensor\
  \ API 进行填充\n\n## 目标\n在本章结束时，你将能够通过从零编码或使用 Eigen Tensor API 来实现 2D 卷积。你将理解填充和步长等必须掌握的概念。最后，你还将了解如何使用卷积执行复杂的模式识别任务。\n\
  \n## 卷积简介\n在深度学习领域，卷积是使用两个称为张量的网格状二操作数进行计算的二元运算。卷积的结果也是一个张量。开始卷积的一种良好方法是使用矩阵。查看以下示例（图\
  \ 4.1 和图 4.2），其中我们对一个 6x6 的输入矩阵进行 3x3 卷积核卷积，生成一个 4x4 的输出矩阵：\n\n![](img/Figure_4.1.png)\n\
  图 4.1：计算卷积（部分 1）\n\n![](img/Figure_4.2.png)\n图 4.2：计算卷积（部分 2）\n\n由于矩阵是 2D 网格，这种类型的卷积通常被称为\
  \ 2D 卷积。在这种模式下，卷积核在输入矩阵上滑动以生成输出矩阵。\n\n该示例说明了卷积的机制。在每一步中，我们计算卷积核与输入矩阵相应区域之间的点积，以获得输出矩阵的一个系数。\n\
  \n简单来说，输出矩阵的每个系数都是卷积核与输入矩阵相应子区域进行元素级相乘之和。在示例中，输出矩阵的系数 (0,0) 计算方法如下：\n\n![](img/Figure_4.3.png)\n\
  图 4.3：计算系数 (0,0)\n\n系数 (1,1) 由下式给出：\n\n![](img/Figure_4.4.png)\n图 4.4：计算系数 (1,1)\n\
  \n当按照上述方法计算完所有输出矩阵系数时，卷积完成。\n\n输出的维度由以下公式给出：\n\n![](img/Figure_4.5.png)\n图 4.5：计算输出维度\n\
  \n在该公式中，`k` 是卷积核的边长，`m` 是输入矩阵的行数，`n` 是输入矩阵的列数。卷积核总是正方形的，`k` 通常是一个小的奇数，如 3、5、7 或\
  \ 11。\n\n> 注意：正如指出的，机器学习中对“卷积”一词的使用存在一些争议。事实上，在数学和信号处理术语中，卷积是一个稍有不同的操作，CNN 中使用的操作可以被更准确地识别为互相关（cross-correlation）。尽管如此，机器学习社区仍使用卷积一词来表示本章描述的操作。\n\
  \n## 实现 2D 卷积\n实现卷积有多种方法，每种方法在计算成本和数值稳定性方面各有优劣。让我们从使用常规 `for` 循环的简单方法开始：\n\n```cpp\n\
  auto Conv_2D = [](const Eigen::MatrixXd& X, const Eigen::MatrixXd& K)\n{\n  const\
  \ int k_rows = K.rows();\n  const int k_cols = K.cols();\n  const int rows = (X.rows()\
  \ - k_rows) + 1;\n  const int cols = (X.cols() - k_cols) + 1;\n\n  Eigen::MatrixXd\
  \ res = Eigen::MatrixXd::Zero(rows, cols);\n\n  for (int i = 0; i < rows; ++i)\n\
  \  {\n    for (int j = 0; j < cols; ++j)\n    {\n      double sum = X.block(i, j,\
  \ k_rows, k_cols).cwiseProduct(K).sum();\n      res(i, j) = sum;\n    }\n  }\n \
  \ return res;\n};\n```\n\n这是我们的卷积的第一个版本。如前所述，我们将卷积核在输入矩阵上滑动，执行卷积核系数与输入矩阵相应区域之间的点积。让我们调用我们的\
  \ `Conv_2D` 函数来分析结果：\n\n```cpp\nauto Conv_2D = ...;\nint main(int, char**)\n{\n\
  \  Eigen::MatrixXd K(3, 3);\n  K << -1, 0, 1,\n       -1, 0, 1,\n       -1, 0, 1;\n\
  \  Eigen::MatrixXd X(6, 6);\n  X << 3, 1, 0, 2, 5, 6,\n       4, 2, 1, 1, 4, 7,\n\
  \       5, 4, 0, 0, 1, 3;\n  auto out = Conv_2D(X, K);\n  std::cout << \"Kernel:\\\
  n\" << K << \"\\n\";\n  std::cout << \"Input:\\n\" << X << \"\\n\";\n  std::cout\
  \ << \"Convolution:\\n\" << out << \"\\n\";\n  return 0;\n}\n```\n\n上述代码输出了结果：\n\
  \n![](img/Figure_4.6.png)\n图 4.6：调用 Conv_2D\n\n上述代码输出了预期的结果。到目前为止的一个重要细节是，输出矩阵总是比输入小。这种缩小有时并不理想。可以使用填充（padding）来避免这种行为。\n\
  \n## 使用填充\n我们可以通过在输入矩阵周围使用空白系数来避免输出矩阵缩小：\n\n![](img/Figure_4.7.png)\n图 4.7：使用填充\n\
  \n这种方法被称为填充。这种卷积被称为填充卷积。当卷积使用填充使得维度与输入矩阵完全相同时，我们称之为 SAME 填充。原始填充，即输出小于输入的卷积，被称为\
  \ VALID 卷积。以下是 SAME 填充的示例：\n\n![](img/Figure_4.8.png)\n图 4.8：SAME 填充\n\n实现填充需要一些工作。考虑以下第一个且原始的填充卷积版本：\n\
  \n```cpp\nauto naive_Padded_Conv_D = [](const Eigen::MatrixXd& X, const Eigen::MatrixXd&\
  \ K, int padding)\n{\n  int K_rows = K.rows();\n  int K_cols = K.cols();\n  int\
  \ rows = X.rows() - K_rows + 2*padding + 1;\n  int cols = X.cols() - K_cols + 2*padding\
  \ + 1;\n\n  Eigen::MatrixXd pad = Eigen::MatrixXd::Zero(X.rows() + 2*padding, X.cols()\
  \ + 2*padding);\n  pad.block(padding, padding, X.rows(), X.cols()) = X;\n\n  Eigen::MatrixXd\
  \ res = Eigen::MatrixXd::Zero(rows, cols);\n\n  for(int i = 0; i < rows; ++i)\n\
  \  {\n    for(int j = 0; j < cols; ++j)\n    {\n      double sum = pad.block(i,\
  \ j, K_rows, K_cols).cwiseProduct(K).sum();\n      res(i, j) = sum;\n    }\n  }\n\
  \  return res;\n};\n```\n\n虽然这段代码实际上完成了工作，但在继续之前必须处理一些内存方面的问题。这里的主要问题在于第 8 行和第 9\
  \ 行，我们花费大量的内存创建一个更大的空白矩阵来存储填充区域的数据。\n\n更好的实现可以使用索引来控制填充行为：\n\n```cpp\nauto Padded_Conv2D\
  \ = [](const Eigen::MatrixXd& X, const Eigen::MatrixXd& K, int padding)\n{\n  const\
  \ int X_rows = X.rows();\n  const int X_cols = X.cols();\n  const int K_rows = K.rows();\n\
  \  const int K_cols = K.cols();\n};\n```\n\n\n\n\n```cpp\nif (X_rows < K_rows) throw\
  \ std::invalid_argument(\"The input has less rows than the kernel\");\n\nif (X_cols\
  \ < K_cols) throw std::invalid_argument(\"The input has less columns than the kernel\"\
  );\n\nconst int rows = X_rows - K_rows + 2*padding + 1;\nconst int cols = X_cols\
  \ - K_cols + 2*padding + 1;\n\nauto fitting_dims = &padding {\n    int input = pos\
  \ - padding;\n    int kernel = 0;\n    int size = k;\n    if (input < 0) {\n   \
  \     kernel = -input;\n        size += input;\n        input = 0;\n    }\n    if\
  \ (input + size > length) {\n        size = length - input;\n    }\n    return std::make_tuple(input,\
  \ kernel, size);\n};\n\nEigen::MatrixXd res = Eigen::MatrixXd::Zero(rows, cols);\n\
  \nfor(int i = 0; i < rows; ++i) {\n    const auto [input_i, kernel_i, size_i] =\
  \ fitting_dims(i, K_rows, X_rows);\n    for(int j = 0; size_i > 0 && j < cols; ++j)\
  \ {\n        const auto [input_j, kernel_j, size_j] = fitting_dims(j, K_cols, X_cols);\n\
  \        if (size_j > 0) {\n            auto input_roi = X.block(input_i, input_j,\
  \ size_i, size_j);\n            auto in_kernel = K.block(kernel_i, kernel_j, size_i,\
  \ size_j);\n            result(i, j) = input_roi.cwiseProduct(in_kernel).sum();\n\
  \        }\n    }\n}\nreturn res;\n```\n\n这种新的（就地）填充 2D 卷积版本要好得多，因为我们不需要分配另一个矩阵来控制填充。让我们来看看它的运行效果：\n\
  \n```cpp\nauto Padded_Conv_2D = ...; \n\nint main(int, char **) {\n    Eigen::MatrixXd\
  \ K(3, 3);\n    K << -1, 0, 1,\n         -1, 0, 1,\n         -1, 0, 1;\n\n    Eigen::MatrixXd\
  \ X(6, 6);\n    X << 3, 1, 0, 2, 5, 6,\n         4, 2, 1, 1, 4, 7,\n         5,\
  \ 4, 0, 0, 1, 2,\n         1, 2, 2, 1, 3, 4,\n         6, 3, 1, 0, 5, 2,\n     \
  \    3, 1, 0, 1, 3, 3;\n\n    auto out = Padded_Conv_2D(X, K, 1);\n    std::cout\
  \ << \"Kernel:\\n\" << K << \"\\n\";\n    std::cout << \"Input:\\n\" << X << \"\\\
  n\";\n    std::cout << \"Convolution:\\n\" << out << \"\\n\";\n    return 0;\n}\n\
  ```\n\n这段代码输出以下结果：\n\n![](img/Figure_4.9)\n\n图 4.9: 运行 SAME 填充\n\n现在，使用 SAME 填充，我们可以注意到输入和输出矩阵的大小是相同的。此时此，人们可能会好奇卷积如何解决许多复杂的问题。事实上，尽管卷积是一个简单的操作，但它的功能极其强大。让我们使用它们来自动检测图像中的特征。\n\
  \n### 在深度学习中使用 OpenCV\n\n书中的许多示例使用图像来为深度学习模型数据。将图像作为数据使用在机器学习（ML）中起着核心作用，它有一个专门的领域称为计算机视觉。`OpenCV`\
  \ 是一个开源库，提供了一系列广泛且强大的计算机视觉算法。然而，在本书中，我们仅使用 OpenCV 执行简单任务，如加载图像、写入图像和旋转。\n\n接下来的示例展示了如何使用\
  \ OpenCV 加载彩色图像，然后对其旋转、转换为灰度模式并存储到本地：\n\n```cpp\n#include <opencv2/opencv.hpp>\n\
  int main(int, char **) {\n    cv::Mat source = cv::imread(\"../led.jpg\", cv::IMREAD_COLOR);\n\
  \    cv::Mat rotated, gray;\n    cv::rotate(source, rotated, cv::ROTATE_90_CLOCKWISE);\n\
  \    cv::cvtColor(rotated, gray, cv::COLOR_BGRGRAY);\n    cv::imshow(\"source\"\
  , source);\n    cv::imshow(\"rotated\", rotated);\n    cv::imshow(\"gray\", gray);\n\
  \    cv::imwrite(\"led_rot.jpg\", gray);\n    cv::waitKey();\n    return 0;\n}\n\
  ```\n\n执行后，该程序将输出以下结果：\n\n![](img/Figure_4.10)\n\n图 4.10: 简单的 OpenCV\n\n与 Eigen\
  \ 不同，OpenCV 必须在主机操作系统中安装。安装 OpenCV 的方法取决于系统、编译器和语言的支持。我们建议检查 OpenCV 文档以了解如何正确安装\
  \ OpenCV。\n\n### 在图像中检测边缘\n\n考虑以下将卷积应用于图像的示例：\n\n```cpp\n#include <opencv2/opencv.hpp>\n\
  #include <opencv2/core/eigen.hpp>\nint main(int, char **) {\n    auto Padded_Conv2D\
  \ = [](const Eigen::MatrixXd& X, const Eigen::MatrixXd& K, int padding) {\n    \
  \    // ...\n    };\n    Eigen::MatrixXd Gx(3, 3), Gy(3, 3);\n    Gx << 1, 0, -1,\n\
  \          2, 0, -2,\n          1, 0, -1;\n    Gy << -1, -2, -1,\n          0, 0,\
  \ 0,\n          1, 2, 1;\n    cv::Mat src = cv::imread(\"../chess.jpg\", cv::IMREAD_COLOR);\n\
  \    cv::Mat img;\n    cv::cvtColor(src, img, cv::BGR2GRAY);\n    Eigen::MatrixXd\
  \ X;\n    cv2eigen(img, X);\n    const int padding = (Gx.rows() - 1) / 2;\n    auto\
  \ Gx_conv = Padded_Conv2D(X, Gx, padding);\n    auto Gy_conv = Padded_Conv2D(X,\
  \ Gy, padding);\n    cv::Mat temp, Gx_res, Gy_res;\n    eigen2cv(Gx_conv, temp);\n\
  \    temp.convertTo(Gx_res, CV_8U);\n    eigen2cv(Gy_conv, temp);\n    temp.convertTo(Gy_res,\
  \ CV_8U);\n    cv::imshow(\"source\", src);\n    cv::imshow(\"gray\", img);\n  \
  \  cv::imshow(\"Gx\", Gx_res);\n    cv::imshow(\"Gy\", Gy_res);\n    cv::waitKey();\n\
  \    return 0;\n}\n```\n\n这段代码使用了两个著名的内核 Gx 和 Gy：\n\n![](img/Figure_4.11)\n\n图 4.11:\
  \ Sobel 算\n\n\n\n\n\n1. `Eigen::Tensor<int, 3> my_tensor(2, 3, 4);`\n\n定义并分配所需的内存以存储一个三维张量对象：\n\
  \n![](img/Figure_4.15.png)\n\n图 4.15：具有 24 个系数的 3 阶张量对象\n\n由于维度为 2、3 和 4，该张量包含 2\
  \ x 3 x 4 = 24 个内存位置。每个位置被称为一个系数。\n\n| 提示：我们建议您阅读张量模块文档 [5] 以了解更多关于如何在 Eigen 中初始化和使用张量的知识。\
  \ |\n\nEigen Tensor 模块是被广泛应用的 <unsupported/Eigen> 特性之一。根据 Eigen Gitlab 仓库日志，维护团队正在不断修复和改进该模块，该模块被用于\
  \ Google TensorFlow 框架的核心部分以及其他几个库和系统。\n\n## 张量卷积\n\n到为止，我们实现了自己版本的卷积。然而，Eigen Tensor\
  \ 模块提供了一个方便的内置实现可供使用。查看以下示例：\n\n1. `Eigen::Tensor<float, 4> X(1, 6, 6, 3);`\n2.\
  \ `X.setRandom();`\n4. `std::cout << \"input dims:\\n\\n\" << X << \"\\n\\n\";`\n\
  6. `Eigen::Tensor<float, 2> K(3, 3);`\n7. `K.setRandom();`\n9. `std::cout << \"\
  kernel dims:\\n\\n\" << K << \"\\n\\n\";`\n11. `Eigen::Tensor<float, 4> out(1, 4,\
  \ 4, 3);`\n13. `Eigen::array<int, 2> dim({1, 2});`\n14. `out = X.convolve(K, dim);`\n\
  16. `std::cout << \"output dims:\\n\\n\" << out << \"\\n\\n\";`\n\n这段代码生成了输出：\n\n\
  ![](img/Figure_4.16.png)\n\n图 4.16：在 Eigen 中使用张量卷积\n\nEigen Tensor API 允许我们使用更复杂的卷积，例如步长（stride）、填充（padding）、空洞（dilatations）等。下一节将介绍这些特征的一部分。\n\
  \n## 步长\n\n步长（Strides）是张量代码中常见的特征，提供了原始张量的简化视图。步长通过跳过预设数量的元素来工作，这个数量被称为步长。查看以下示例：\n\
  \n![](img/Figure_4.17.png)\n\n图 4.17：使用步长\n\n我们可以如下在 Eigen 中使用步长：\n\n```cpp\nint\
  \ main() {\n  Eigen::Tensor<int, 2> A(4, 5);\n  A.setValues({\n    {1, 2, -1, 0,\
  \ 1},\n    {4, 1, 2, -1, 2},\n    {3, 1, -1, 1, -2},\n    {-2, 1, 5, 4, 0}\n  });\n\
  \  Eigen::array<Eigen::DenseIndex, 2> strides({3, 2});\n  Eigen::Tensor<int, 2>\
  \ B = A.stride(strides);\n  std::cout << \"A is\\n\\n\" << A.dimensions() << \"\\\
  n\\n\" << A << \"\\n\\n\";\n  std::cout << \"B is\\n\\n\" << B.dimensions() << \"\
  \\n\\n\" << B << \"\\n\\n\";\n  return 0;\n}\n```\n\n这段代码输出：\n\n![](img/Figure_4.18.png)\n\
  \n图 4.18：运行步长示例\n\n值得注意的是，`stride()` 操作并没有实际创建另一个张量。事实上，该操作仅提供原始张量的视图。\n\n注意：大多数\
  \ Eigen Tensor 函数以延迟（eager）方式工作。这意味着它们不是返回一个实际张量，而是返回一个知道如何计算张量的对象。这种方式允许 Eigen\
  \ 通过减少执行来优化性能。缺点是代码更难调试，实现也更复杂。请查看此链接获取详情： |\n\n| [`eigen.tuxfamily.org/dox-devel/unsupported/eigen_tensors.html#title6`](https://eigen.tuxfamily.org/dox-devel/unsupported/eigen_tensors.html#title6)\
  \ |\n\n## 使用 Eigen Tensor 进行填充\n\n与步长类似，我们可以使用 Eigen 创建张量的填充视图，所示：\n\n1. `Eigen::Tensor<int,\
  \ 2> A(2, 3);`\n2. `A.setValues({{0, 100, 200}, {300, 400, 500}});`\n4. `Eigen::array<std::pair<int,\
  \ int>, 2> padding;`\n5. `padding[0] = std::make_pair(0, 1);`\n6. `padding[1] =\
  \ std::make_pair(2, 3);`\n8. `Eigen::Tensor<int, 2> B = A.pad(padding);`\n10. `std::cout\
  \ << \"A is\\n\\n\" << A.dimensions() << \"\\n\\n\" << A << \"\\n\\n\";`\n12. `std::cout\
  \ << \"B is\\n\\n\" << B.dimensions() << \"\\n\\n\" << B << \"\\n\\n\";`\n\n输出如下：\n\
  \n![](img/Figure_4.19.png)\n\n图 4.19：运行填充示例\n\nEigen Tensor API 支持多种操作，如归约（reductions）、收缩（contractions）等。\n\
  \n| 提示：查看此链接获取张量内置操作列表和示例：[`eigen.tuxfamily.org/dox-devel/unsupported/eigen_tensors.html`](https://eigen.tuxfamily.org/dox-devel/unsupported/eigen_tensors.html)\
  \ |\n\n## 总结\n\n本章介绍了卷积，这是深度学习最重要的操作之一。我们学习了如何使用矩阵实现填充版本的二维卷积，最后学习了如何使用 Tensor API\
  \ 使用高阶张量计算相同的操作。\n\n此外，我们讨论了使用 Sobel 卷积从图像检测特征的示例。这个示例为卷积在解决模式识别任务中的应用提供了宝贵的见解。\n\
  \n在下一章节中，我们将继续实现深度学习模型。特别是，我们将介绍使用 Tensors 实现全连接层。\n\n## 练习\n\n1. 写出一个公式，计算二维卷积的输出维度，给定\
