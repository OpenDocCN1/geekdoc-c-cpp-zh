  \n![](img/fm1.png)\n\n# 第 16 章 利用迁移学习提升训练性能\n\n## 引言\n\n迁移学习是深度学习领域令人瞩目的进展之一。它通过复用一个模型来构建执行不同任务的新模型。在实践中，它通过允许我们复用预训练模型促进了新模型的开发，从而减少了从零构建模型的时间和成本。本章将通过实际示例介绍这项技术。\n\
  \n## 结构\n\n本章涵盖的主题顺序如下：\n\n* 迁移学习简介\n* 加载和存储模型\n* 复用用 `Dogs x Cats` 数据集训练的模型\n*\
  \ 使用 `VGG16` 和 `ImageNet`\n\n## 目标\n\n本章介绍了如何使用`迁移学习`来开发新模型。通过阅读本章，读者将学习从磁盘加载预训练模型的细节，并使用该模型构建新的不同的模型。仅使用\
  \ `C++` 和 `Eigen`，读者将学习如何加载在 `ImageNet` 数据集上训练的 `VGG16` 网络，旨在快速开发出强大的系统。\n\n## 迁移学习简介\n\
  \n令我们惊讶的是，深度学习在几十年研究后发现某些技术和概念，与其生物系统中的对应行为如此接近。在本章中，我们将讨论这一观察的另一个真实实例。\n\n考虑在某些训练之后，你学习了一个新任务，例如学习乐器或学习另一种语言。这种新能力的获取过程可能需要学习非常不同的显性和内隐性能力，其中一些处于肌肉层面。尽管你在这个任务上没有相同的技能，但学习过程比第一项任务要容易得多。\n\
  \n迁移学习是一种建模技术，由复用以前训练过的模型来执行任务组成。例如，可以复用分类器来执行不同的任务，如回归甚至无监督学习。在另一个例子中，可以复用用强化学习训练的模型来构建一个新模型以转换输入序列。由于模型基本上代表概率分布，因此在模型之间复用知识并没有限制。\n\
  \n## 迁移学习在深度学习中的应用\n\n在大多数情况下，迁移学习的使用取决于以下一个或多个场景 [2]:\n\n* 复用预训练网络的特征提取部分来构建新模型。预训练网络的头部被一个新的头部取代，该新头部将从零开始训练。\n\
  * 然后使用新数据集训练整个模型。通常情况下，新模型的预训练部分不会重新训练。只有新头部通过新训练进行调整。因此，预训练部分被冻结，即其权重不再被修改。\n*\
  \ 有时，预训练部分顶部的几层会被取消冻结，以便对高阶特征表示进行微调。\n\n复用模型需要它们在执行之间以某种方式持久化。下节描述了如何使用原生 `C++`\
  \ 函数存储和加载模型。\n\n## 加载和存储模型\n\n在考虑存储模型时，主要有两个关注点：\n\n* 存储架构\n* 模型参数\n\n在本节中，我们将仅处理权重和内核的问题。\n\
  \n### 存储层权重\n\n本质上，权重和内核是浮点数的网格。因此，存储它们依赖于使用持久化接收器序列化浮点数的问题。事实上，以二进制格式持久化数字通常是有问题的，因为字节序（`endianness`）[3]\
  \ 表示对于每个操作系统并不是通标准的。大端序表示系统如果遇到用小端序写入的文件，将识别出不同的值。\n\n| 注意：在计算中，字节序是指数字中最高位字节的存储顺序。\
  \ |\n\n\n\n\n此外，用于表示浮点数的位数并没有标准，这引入了另一个问题的来源。\n\n解决这些问题的变方法是将数字存储为文本。考虑以下 `save_tensor_to_file()`\
  \ 函数的实现方式：\n\n```cpp\nusing TYPE = float;\n\ntemplate <int _RANK>\nvoid save_tensor_to_file(const\
  \ Tensor<_RANK> &tensor, const std::string& file_path, bool as_row_major) {\n  std::ofstream\
  \ file;\n  file.open(file_path, std::ios::out | std::ios::trunc);\n  if (!file.is_open())\
  \ {throw std::invalid_argument(\"Can't open \" + file_path);}\n  const TYPE *data\
  \ = tensor.data();\n  Eigen::Tensor<TYPE, _RANK, Eigen::RowMajor> tensor_rm;\n \
  \ if (as_row_major) {\n    Eigen::array<Eigen::Index, _RANK> suffle_dims;\n    for\
  \ (int i = 0; i < _RANK; ++i) {\n      suffle_dims[i] = _RANK - i - 1;\n    }\n\
  \    tensor_rm = Eigen::TensorLayoutSwapOp<Eigen::Tensor<TYPE, _RANK, Eigen::ColMajor>>(tensor).shuffle(suffle_dims);\n\
  \    data = tensor_rm.data();\n  }\n  const int size = tensor.size();\n  for (int\
  \ i = 0; i < size; ++i) {\n    file << data[i];\n    file << \"\\n\";\n  }\n  file.close();\n\
  }\n```\n\n张量（Tensors）是网格对象，但在内部，它们在内存中使用连续的线性存储来实现的。由于文件也是线性流，我们的工作基本上是将张量存储直接流到文件中，并包含换行符以分隔每个数字。\n\
  \n一个棘手的细节是 `Eigen` 默认使用列主序（column-major）。因此，使用列主序存储和加载数据适用于大多数情况。然而，我们包含了一个将数据作为行主序（row\
  \ major）输出的选项。如果你认为使用其他具有行主序存储方案的库来加载数据，这将非常有帮助。\n\n现在可以通过以下函数以简单的方式加载数据：\n\n```cpp\n\
  template <int _RANK>\nvoid load_tensor_from_file(Tensor<_RANK> &tensor, const std::string&\
  \ file_path, bool as_row_major = true) {\n  std::ifstream file;\n  file.open(file_path);\n\
  \  if (!file) {throw std::invalid_argument(\"Can't open \" + file_path);}\n  std::vector<TYPE>\
  \ vec;\n  vec.reserve(tensor.size());\n  TYPE val;\n  for(std::string line; std::getline(file,\
  \ line); ) {\n    std::istringstream in(line);  \n    in >> val;      \n    vec.push_back(val);\n\
  \  }\n  if (vec.size() != tensor.size()) {throw std::invalid_argument(\"Illegal\
  \ number of lines \" + std::to_string(vec.size()));}\n  auto dimensions = tensor.dimensions();\n\
  \  if (as_row_major) {\n    Eigen::array<Eigen::Index, _RANK> suffle_dims;\n   \
  \ for (int i = 0; i < _RANK; ++i) {\n      suffle_dims[i] = _RANK - i - 1;\n   \
  \ }\n    auto mapped = Eigen::TensorMap<Eigen::Tensor<TYPE, _RANK, Eigen::RowMajor>>(&vec[0],\
  \ dimensions);\n    tensor = Eigen::TensorLayoutSwapOp<Eigen::Tensor<TYPE, _RANK,\
  \ Eigen::RowMajor>>(mapped).shuffle(suffle_dims);\n  } else {\n    tensor = Eigen::TensorMap<Eigen::Tensor<TYPE,\
  \ _RANK, Eigen::RowMajor>>(&vec[0], dimensions);\n  }\n  file.close();\n}\n```\n\
  \n这里没什么好说的。我们使用 `std::istringstream` 将文件中的数据读取为浮点数数字，并在必要时将流从行主序转换为列主序。由于训练模型需要花费大量时间，找到一种存储和检索其参数的方法是非常实用的。在接下来的章节中，我们将看到这些过程的示例。\n\
  \n在上一章中，我们开发了一个模型将图像分为两类：狗和猫。在本节中，我们将使用同一个模型来构建一个分类器，对五类中的之一的图像进行分类：洋菊、蒲公英、玫瑰、向日葵和郁金花。当我们说同一个模型时，我们指的是相同的权重。也就是说，我们将使用通过\
  \ Dogs x Cats 数据集训练模型获得的相同权重来建立一个模型，分类来自 TF 数据集的花类。参考下面的图：\n\n![](img/Figure_16.1)\n\
  图 16.1：TF 花卉中洋菊的一些实例\n\n从表面上看，狗和猫的图像与花图像并不共享任何语义特征。重用这些权重真的有用吗？我们将在这个实验中尝试回答这个问题。在重用\
  \ Dogs x Cats 模型之前，让我们看看使用 TF 花卉数据集从零开始训练模型会得到什么结果。为了这个目的，我们定义了以下模型：\n\n```cpp\n\
  template <typename DEVICE, typename GEN>\nclass Model {\npublic:\n  Model(DEVICE\
  \ &device, GEN &rng, int img_size):IMG_SIZE(img_size) {\n    const int x_width =\
  \ IMG_SIZE;\n    const int x_height = IMG_SIZE;\n    const int kernel_size = 3;\n\
  \    const int channels = 3;\n    const int hidden_neurons = 128;\n    const int\
  \ num_classes = 5;\n    // ... (后续未提供的代码部分)\n```\n\n\n在本示例中，使用数据增强从零开始训练模型得到的最高性能为\
  \ 71.84% 的准确率。我们将使用此结果作为基准，比较下一个使用迁移学习模型的性能。\n\n## 重用 Dogs x Cats 模型的权重\n\n为了重用使用\
  \ Dogs x Cats 模型训练的模型权重，我们需要将模型权重存储在持久化存储中，例如文件。为此此，我们将在模型类中包含一个新方法：\n\n```cpp\n\
  void save(const std::string &folder, bool override, bool as_rowmajor) const {\n\
  \  bool fail = fs::exists(folder);\n  if (fail) {\n    if (override) {\n      fail\
  \ = fs::remove_all(folder) == 0;\n    } else {\n      std::cerr << folder << \"\
  \ already exists. Use override = true to override.\\n\";\n    }\n  }\n  fail = fail\
  \ || !fs::create_directory(folder);\n  if (!fail) {\n    fs::path dir(folder);\n\
  \    save_tensor_to_file(this->conv2d_0->get_kernels(), (dir / fs::path(\"conv2d_0.txt\"\
  )).string(), as_rowmajor);\n    save_tensor_to_file(this->conv2d_1->get_kernels(),\
  \ (dir / fs::path(\"conv2d_1.txt\")).string(), as_rowmajor);\n    save_tensor_to_file(this->conv2d_2->get_kernels(),\
  \ (dir / fs::path(\"conv2d_2.txt\")).string(), as_rowmajor);\n    save_tensor_to_file(this->dense->get_weight(),\
  \ (dir / fs::path(\"dense.txt\")).string(), as_rowmajor);\n    save_tensor_to_file(this->output_layer->get_weight(),\
  \ (dir / fs::path(\"output_layer.txt\")).string(), as_rowmajor);\n  }\n}\n```\n\n\
