  \ 使用 Google TensorFlow 训练等效模型\n\n## 提高反向传播的处理性能](#contents.xhtml_sc2_172a)\n\n尽管我们的反向传播实现成功拟合了\
  \ MNIST 数据，但每个训练 epoch 花的时间太长了。与在相同机器上使用 Google TensorFlow 训练等效网络相比，每个 epoch 大约只需\
  \ 90 毫秒，比我们的实现快了 100 倍。\n\n\n\n\n通过分析我们的实现，我们发现主要的瓶颈在于计算梯度的方式。特别是，批矩阵乘法消耗了大部分的处理时间。因此，批矩阵乘法将是我们首先改进的方面。\n\
  \n此外，人们可以发现我们的代码正在浪费获取处理时间和内存的宝贵机会。这些机会将在下一节中得到解决。\n\n## 解决批矩阵乘法\n\n正如本章早期讨论的那样，批矩阵乘法在整个算法的处理时间中起着关键作用。因此，大幅减少算法时间的一种方法就是简单的避免批矩阵乘法。在以下两种情况下，可以避免批矩阵乘法：\n\
  \n*   当激活函数是逐元素的（coefficient-wise）时，其雅可比矩阵是对角矩阵。我们可以利用这一信息来减少计算梯度的量 ![](img/eq753.jpg)。\n\
  *   即使激活函数不是逐元素的，某些代价函数的组合也可以提供 ![](img/eq754.jpg) 的快速计算。\n\n幸运的是，上述两种情况非常常见。我们接下来将介绍它们。\n\
  \n## 针对逐元素激活函数避免批矩阵乘法\n\n避免批矩阵乘法的第一种最直接的方法是激活函数是逐元素的，例如 `sigmoid` 和 `ReLU`。考虑通用激活函数的表示所示：\n\
  \n![](img/Figure_10.17.png)\n\n图 10.17：单层中的计算流\n\n红色虚线箭头表示每个 ![](img/eq76.jpg)系数对\
  \ ![](img/eq78.jpg)的系数 ![](img/eq77.jpg)的贡献。黑色实线箭头表示 ![](img/eq771.jpg)和 ![](img/eq79.jpg)\
  \ 之间的直接依赖关系。很容易看出，由于 `Z` 和 `Y` 的组合，红色虚线箭头比黑色实线箭头更多。结果，梯度 ![](img/eq154.jpg)是一个这样的矩阵：\n\
  \n![](img/eq80.jpg)\n\n幸运的是，某些激活函数存在这种情况，例如 `softmax`。让我们回想 softmax 的定义公式：\n\n![](img/eq811.jpg)\n\
  \n由于分母中的求和，每个输出 ![](img/eq772.jpg)都依赖于 `Z` 中的每一个系数。因此，具有五个单元的 softmax 层的雅可比矩阵为：\n\
  \n![](img/eq82.jpg)\n\n其中 ![](img/eq83.jpg)意味着 ![](img/eq84.jpg)。\n\n与 `softmax`\
  \ 不同，通常情况下激活函数是逐元素函数。例如，考虑 `ReLU` 的公式：\n\n![](img/eq85.jpg)\n\n由于 ![](img/eq773.jpg)\
  \ 的值仅取决于相应的系数 ![](img/eq791.jpg)，如果 ![](img/eq781.jpg)，则每个偏导数 ![](img/eq86.jpg)均为零。因此，具有五个单元的\
  \ `ReLU` 激活雅可比矩阵可以表示为：\n\n![](img/eq87.jpg)\n\n该雅可比矩阵是对角矩阵的一个示例，稀疏矩阵的一种特例。\n\n|\
  \ 注意：在稀疏矩阵中，只有少数元素具有非零值。 |\n\n当然，对角线之外大量的零会导致内存和处理时间的浪费，从而产生改进机会。例如，如果我们尝试计算梯度 ![](img/eq72.jpg)：\n\
  \n![](img/eq88.jpg)\n\n我们得到了 ![](img/eq721.jpg)的以下公式：\n\n![](img/eq89.jpg)\n\n其中该操作代表逐元素乘积。由于逐元素乘积的代价是线性的，而矩阵乘法的代价为\
  \ `O(M³)`，使用之前的公式计算批次的 ![](img/eq93.jpg)和 ![](img/eq155.jpg)比计算原始批矩阵乘法快得多。\n\n总结：\n\
  \n*   这种方法的优点是它将使用批矩阵乘法的 `O(N * M³)` 代价降低到了 `O(N * M)`。\n*   缺点是这种方法不适用于非逐元素的激活函数（如\
  \ `softmax`）。\n\n通常内部层使用 `ReLU` 或 `sigmoid` 等逐元素激活函数。应用这种优化从根本上改进了这些计算，带来了性能的巨大提升。\n\
  \n## 在使用交叉熵损失和 softmax 时避免批矩阵乘法\n\n由于 `Softmax` 的雅可比矩阵不是对角的，之前将批矩阵乘法转换为简单逐元素乘积的方法将不起。然而，如果损失代价函数是交叉熵损失，我们可以用线性计算代替批矩阵乘法。理解如何做到这一点显而易见。再次考虑\
  \ `Softmax` 雅可比矩阵 ![](img/eq156.jpg)：\n\n![](img/eq90.jpg)\n\n现在，让我们回想关于输出 ![](img/eq103.jpg)的交叉熵导数：\n\
  \n![](img/eq911.jpg)\n\n利用 `softmax` ![](img/eq921.jpg) 中的事实，我们可以意识到梯度 ![](img/eq931.jpg)\n\
  \n我们再次通过简单的线性操作减少了计算全批矩阵乘法的代价，在空间和时间上提供了巨大的收益。\n\n总结：\n\n*   这种方法的优点是它将批矩阵乘法的代价\
  \ `O(N * M³)` 减少到了 `O(N * M)`。\n*   缺点是这种方法仅适用于使用 `softmax`。\n\n在实践中，这种缺点并不致命，因为\
  \ `cross-entropy` 和 `softmax` 是标准。\n\n## 并行批矩阵乘法\n\n假设你无法避免批矩阵乘法。在这种情况下，只有一件事要做：运行矩阵乘法。例如，取以下单线程矩阵乘法的实现：\n\
  \n```cpp\nTensor<float, 2> serial_batched_multiplication(const Tensor<float, 3>\
  \ &A, const Tensor<float, 3> &B) {\n    const int batch_size = A.dimension(0);\n\
  \    const int input_size = A.dimension(1);\n    const int output_size = B.dimension(2);\n\
  \    Tensor<float, 2> result(batch_size, output_size);\n    const std::array<IndexPair<int>,\
  \ 1> contract_dims = {IndexPair<int>(1, 0)};\n    const std::array<Index, 2> A_extent\
  \ = {1, input_size};\n    const std::array<Index, 3> B_extent = {1, input_size,\
  \ output_size};\n    const std::array<Index, 2> B_i_dim = {input_size, output_size};\n\
  \    const auto mulmat_slice = & {\n        std::array<Index, 2> A_offset = {index,\
  \ 0};\n        std::array<Index, 2> B_offset = {index, 0, 0};\n        auto A_i\
  \ = A.slice(A_offset, A_extent);\n        auto B_i = B.slice(B_offset, B_extent).reshape(B_i_dim);\n\
  \        auto R_i = A_i.contract(B_i, contract_dims);\n        result.slice(offset,\
  \ output_extent) = R_i;\n    };\n    std::vector<int> batch(batch_size);\n    std::iota(batch.begin(),\
  \ batch.end(), 0);\n    std::for_each(batch.begin(), batch.end(), mulmat_slice);\n\
  \    return result;\n}\n```\n\n这种操作代价极高，因为它执行了 batch_size 次张量收缩。如果我们没有其他方法避免这种操作，可以尝试通过并行运行来缩短整体时间。这样做的一种简单方法是使用\
  \ C++ 内置并行性运行 for_each 循环：\n\n```cpp\nstd::for_each(std::execution::par, batch.begin(),\
  \ batch.end(), mulmat_slice);\n```\n\n\n\n\n这一次，我们调用了 `for_each` 并传递了一个新参数 `std::execution::par`。设置\
  \ `std::execution::par` 会使 `for_each` 并行运行，并使用底层可用的多线程后端（通常是底层的 TBB [3] 或 OpenMP\
  \ [4]）。使用 `std::execution::par` 的缺点是我们我们无法控制任务可以使用多少个线程。解决此问题的替代方案是使用 Boost Thread\
  \ Pool [5]：\n\n```cpp\n#include <boost/asio/thread_pool.hpp>\n#include <boost/asio/post.hpp>\n\
  const int threads = 4;\nboost::asio::thread_pool pool(threads);\nfor (int i = 0;\
  \ i < batch_size; ++i)\n{\n  boost::asio::post(pool, std::bind(mulmat_slice, i));\n\
  }\npool.join();\n```\n\nBoost 线程池将并行运行 `mulmat_slice`，就像运行带有 `std::execution::par`\
  \ 的 `for_each` 一样。然而，此时我们对参与的最大线程数具有了控制权：\n\n```cpp\nconst int threads = std::thread::hardware_concurrency();\n\
  boost::asio::thread_pool pool(threads);\n```\n\n这两行代码将可用线程数设置为可用处理器核心的实际数量。虽然这没有决定线程的实际数量，但它提供了一些控制。\n\
  \nEigen 还有一个一个基于 `ThreadPool` 设备的嵌入多线程机制，这是并行执行 `batched_matrix_multiplication`\
  \ 的另一种替代方案。该技术将在下一节中解释。\n\n注意：当使用并行编程时，请确保你的最终实现是无锁的，或者没有不受保护的数据依赖。如果代码不是无锁的，你需要使用\
  \ `std::lock_guard<std::mutex>` 等锁来保护共享数据。\n\n只有在没有上述其他替代方案可用时，才将批量矩阵乘法作为最后的手段。处理批量矩阵乘法对于反向传播至关重要。然而，实现高性能执行还有其他重要的考虑因素。这些内容将在后续章节中介绍。\n\
  \n## 通用张量编程优化指南\n\n本节讨论了以优化方式实现 Tensor 代码的一些准则。\n\n## 使用内置的 Eigen 并行计算\n\n反向传播主要是一个顺序算法。在正向传播中，我们必须在计算下一层的状态之前计算当前层的输出。在反向传播中，我们必须从最后一层到第一层逐个计算每个梯度。\n\
  \n因此，在运行反向传播时很难考虑到使用并行计算。然而，该算法通常会对海量数据进行大规模计算。Eigen API 具有一个内置机制来并行运行这些密集型计算：Eigen\
  \ 的 `ThreadPool` API。考虑以下示例：\n\n```cpp\n#include <unsupported/Eigen/CXX11/Tensor>\n\
  Eigen::Tensor<float, 2> A(1024, 1024);\nEigen::Tensor<float, 2> B(1024, 1024);\n\
  Eigen::array<Eigen::IndexPair<int>, 1> op_dims = {Eigen::IndexPair<int>(1, 0)};\n\
  Eigen::Tensor<float, 2> C = A.contract(B, op_dims);\n```\n\n这段代码简单地使用单个处理器执行两个大张量之间的收缩（contraction）。我们可以使用简单的语法更改这种行为：\n\
  \n```cpp\n#define EIGEN_USE_THREADS\n#include <Eigen/ThreadPool>\n#include <unsupported/Eigen/CXX11/Tensor>\n\
  Eigen::Tensor<float, 2> A(1024, 1024);\nEigen::Tensor<float, 2> B(1024, 1024);\n\
  const int threads = 4;\nEigen::ThreadPool tp(threads);\nEigen::ThreadPoolDevice\
  \ thread_pool_device(&tp, threads);\nEigen::array<Eigen::IndexPair<int>, 1> op_dims\
  \ = {Eigen::IndexPair<int>(1, 0)};\nEigen::Tensor<float, 2> C(1024, 1024);\nC.device(thread_pool_device)\
  \ = A.contract(B, op_dims);\n```\n\n这一次，收缩是通过从 Eigen 线程池获取的四个线程执行的。根据硬件的可用性，在四个处理器上执行此操作会导致执行速度提高四倍。\n\
  \n注意：必须定义 `EIGEN_USE_THREADS` 使用 Eigen 的 `ThreadPool` 头文件。\n\n`ThreadPool` 设备真正的用法是\
  \ `batched_matrix_multiplication`。之前的定义可以修改如下：\n\n```cpp\ntemplate <typename Device>\n\
  const Eigen::Tensor<float, 3> batched_matrix_multiplication(const Device &device,\
  \ const Eigen::Tensor<float, 3>& A, const Eigen::Tensor<float, 3>& B)\n{\n  typedef\
  \ Eigen::Tensor<float, 3>::DimensionPair DimPair;\n  Eigen::array<DimPair, 1> dims{DimPair(1,\
  \ 0)};\n  const int batch_size = A.dimension(0);\n  const int dim1 = A.dimension(1);\n\
  \  const int dim2 = B.dimension(2);\n  Eigen::Tensor<float, 3> output(batch_size,\
  \ dim1, dim2);\n  for (int i = 0; i < batch_size; ++i)\n  {\n    output<0>(i).device(device)\
  \ = A<0>(i).contract(B<0>(i), dims);\n  }\n  return output;\n}\n```\n\n现在，我们可以以以下方式调用\
  \ `batched_matrix_multiplication`：\n\n```cpp\nconst int threads = 4;\nEigen::ThreadPool\
  \ tp(threads);\nEigen::ThreadPoolDevice thread_pool_device(&tp, threads);\nauto\
  \ Z = batched_matrix_multiplication(thread_pool_device, X, Y);\n```\n\n其中 `X` 和\
  \ `Y` 都是秩-3 张量。使用多个核心处理大规模计算通常比单处理器更快。然而，另一种称为 GPU 编程的并行计算在过去几年获得了更多证据。在深度学习背景下使用\
  \ GPU 的情况将在下一节中解释。\n\n## 在 GPU 上运行\n\n最初，图形处理器（GPU）的设计是为了提高游戏和视频/摄影编辑的性能。然而，长期以来，机器学习社区一直在考虑这些板来缩短训练时间。\n\
  \n2012 年，Krizhevsky、Sutskever 和 Hinton [6] 开发了 AlexNet 网络，赢得了 2012 年 ILSVRC—ImageNet\
  \ 尺度识别挑战。这项工作的重大成就之一在使用 GPU 训练 AlexNet，允许训练具有大量参数的网络。从那时起，GPU 训练深度学习模型变得流行。\n\n\
  今天，在 GPU 上实现深度学习代码并非易事，但比 2012 年容易得多。让我们介绍 Eigen Tensor API 的某些功能，用于在 NVIDIA 设备上运行关键函数。\n\
  \n| 注意：CUDA 是 NVIDIA 的专利技术，允许在 NVIDIA 系列显卡上运行代码。 |\n\n查看使用 `Eigen` 和 `CUDA` 在 GPU\
  \ 上运行收缩的示例：\n\n```cpp\nEigen::Tensor<float, 2> run_gpu_contraction(const Eigen::Tensor<float,\
  \ 2> &A, const Eigen::Tensor<float, 2> &B)\n{\n  const int M = A.dimension(0);\n\
  \  const int K = A.dimension(1); // 在环境中环境中 K == B.dimension(0)\n  const int N =\
  \ B.dimension(1);\n  // 在 GPU 上分配内存\n  std::size_t A_bytes = M * K * sizeof(float);\n\
  \  std::size_t B_bytes = K * N * sizeof(float);\n  float *A_data;\n  float *B_data;\n\
  \  gpuMalloc((void **)(&A_data), A_bytes);\n  gpuMalloc((void **)(&B_data), B_bytes);\n\
  \  gpuMemcpy(A_data, A.data(), A_bytes, gpuMemcpyHostToDevice);\n  gpuMemcpy(B_data,\
  \ B.data(), B_bytes, gpuMemcpyHostToDevice);\n  auto M_array = Eigen::array<int,\
  \ 2>{M, K};\n  auto K_array = Eigen::array<int, 2>{K, N};\n  Eigen::TensorMap<Eigen::Tensor<float,\
  \ 2>> A_on_GPU(A_data, M_array);\n  Eigen::TensorMap<Eigen::Tensor<float, 2>> B_on_GPU(B_data,\
  \ K_array);\n  // 在 GPU 上运行收缩\n  Eigen::GpuStreamDevice stream;\n  Eigen::GpuDevice\
  \ gpu_device(&stream);\n}\n```\n\n\n\n\n\n```cpp\n35. Eigen::array<Eigen::IndexPair<int>,\
  \ 1> dims = {Eigen::IndexPair<int>(1, 0)};\n\n36. gpu_result.device(gpu_device)\
  \ = A_on_GPU.contract(B_on_GPU, dims);\n\n38. // 将结果数据拷贝到 CPU\n\n39. Tensor<float,\
  \ 2> result(M, N);\n\n40. gpuMemcpy(result.data(), result_data, result_bytes, gpuMemcpyDeviceToHost);\n\
  \n42. // 释放 GPU 内存\n\n43. gpuFree((void *)A_data);\n\n44. gpuFree((void *)B_data);\n\
  \n45. gpuFree((void *)result_data);\n\n47. return result;\n\n48. }\n```大致来说，在 GPU\
  \ 上运行与使用 `Eigen::ThreadPoolDevice` 进行并行运行有些相似。使用 `CUDA` 时，我们需要使用 `Eigen::GpuDevice`：\n\
  \n```cpp\n1. Eigen::GpuStreamDevice stream;\n\n2. Eigen::GpuDevice gpu_device(&stream);\n\
  \n3. Eigen::array<Eigen::IndexPair<int>, 1> dims = {Eigen::IndexPair<int>(1, 0)};\n\
  \n4. gpu_result.device(gpu_device) = A_on_GPU.contract(B_on_GPU, dims);\n```\n\n\
  明显的区别是，使用 `Eigen::GpuDevice` 时，我们还需要分配（以及释放）GPU 内存。\n\n如果你的机器上有一个带有 `CUDA` 卡的 `NVIDIA\
  \ GPU`，你可以尝试使用以下代码运行此过程：\n\n```cpp\n1. Tensor<float, 2> run_cpu_contraction(const\
  \ Tensor<float, 2> &A, const Tensor<float, 2> &B)\n\n2. {\n3. Eigen::array<Eigen::IndexPair<int>,\
  \ 1> dims = {Eigen::IndexPair<int>(1, 0)};\n\n4. Tensor<float, 2> expected = A.contract(B,\
  \ dims);\n\n5. return expected;\n\n6. }\n\n8. int main()\n\n9. {\n10. srand((unsigned\
  \ int) time(0));\n\n12. printCudaVersion();\n\n14. const int S = 256;\n\n16. Tensor<float,\
  \ 2> A(S, S);\n\n17. Tensor<float, 2> B(S, S);\n\n18. A.setRandom();\n\n19. B.setRandom();\n\
  \n21. auto expected = run_cpu_contraction(A, B);\n\n23. auto tensor = run_gpu_contraction(A,\
  \ B);\n\n25. Tensor<float, 2> diff = (expected - tensor).abs();\n\n27. Tensor<float,\
  \ 0> max_diff = diff.maximum();\n\n28. Tensor<float, 0> mean_diff = diff.mean();\n\
  \n30. std::cout << \"\\nmax_diff is « << << max_diff << \"\\n\\n\";\n\n31. std::cout\
  \ << \"mean_diff is « << << mean_diff << \"\\n\\n\";\n\n33. auto start_cpu = high_resolution_clock::now();\n\
  \n35. for (int i = 0; i < 100; ++i) {\n36. run_cpu_contraction(A, B);\n37. }\n\n\
  39. auto stop_cpu = high_resolution_clock::now();\n\n41. auto duration_cpu = duration_cast<milliseconds>(stop_cpu\
  \ - start_cpu);\n\n43. std::cout << \"Tensor size is (\" << S << \"x\" << S << \"\
  )\\n\\n\";\n\n44. std::cout << \"Running on CPU took \" << duration_cpu.count()\
  \ << \" milliseconds.\\n\";\n\n46. auto start_cuda = high_resolution_clock::now();\n\
  \n48. for (int i = 0; i < 100; ++i) {\n49. run_gpu_contraction(A, B);\n50. }\n\n\
  52. auto stop_cuda = high_resolution_clock::now();\n\n54. auto duration_cuda = duration_cast<milliseconds>(stop_cuda\
  \ - start_cuda);\n\n56. std::cout << \"Running on GPU took \" << duration_cuda.count()\
  \ << \" milliseconds.\\n\";\n\n58. return 0;\n\n59. }\n```\n\n首先让我们编译这段代码：\n\n![](img/Figure_10.18.png)\n\
  图 10.18：编译 CUDA 示例\n\n运行后，程序会输出一些内容：\n\n![](img/Figure_10.19.png)\n图 10.19：使用 256x256\
  \ 张量运行 CUDA 示例\n\n结果说明了在 GPU 上运行收缩（contraction）的巨大收益。在我的情况下，使用 RTX 3050 的执行速度大约快了\
  \ 250 倍。在 GPU 上进行密集计算远比在 CPU 上运行快。重要的是，CPU 和 GPU 之间交换数据的开销也意味着成本。例如，重新运行上一个示例但使用较小的\
  \ (8x8) 张量，会导致以下结果：\n\n![](img/Figure_10.20.png)\n图 10.20：使用 8x8 张量运行 CUDA 示例\n\n\
  注意，使用较小的 8x8 张量时，GPU 的总时间大于 CPU 时间。总之，最终性能取决于数据总线吞吐量、GPU 速度以及张量的大小。\n\n| 最终性能取决于数据总线吞吐量、GPU\
  \ 速度以及张量的大小 |\n| :--- | :--- |\n| 注意，使用较小的 8x8 张量时，GPU 的总时间大于 CPU 时间。 | 总之，最终性能取决于数据总线吞吐量、GPU\
  \ 速度以及张量的大小 |\n\n| 减少内存占用 |\n| :--- |\n| 内存拷贝在深度学习中通常是一个关注的问题。 |\n\n| 尽可能延迟计算 |\n\
  | :--- |\n| 由于 Eigen 的延迟求值机制，在需要时才计算。 |\n\n| 避免不必要的移动数据 |\n| :--- |\n| 避免移动数据，传递指针（或引用）。\
  \ |\n\n| 只分配一次数据 |\n| :--- |\n| 分配数据会消耗系统资源。 |\n\n\n\n\n\n```cpp\nreturn std::make_tuple(grad,\
  \ downstream);\n}\n```\n\n注意，我们不再调用 `batched_matrix_multiplication()`。梯度已经过计算，避免了这种昂贵的操作。此外，请注意\
  \ `gradient()` 现在有了一个参数 `dC_dZ` 而不是 `dC_dY`。因此，`dC_dZ` 是通过 `backward()` 计算的，如下所示：\n\
  \n```cpp\ntemplate <typename Device, typename T>\nauto backward(Device &device,\
  \ const Tensor<T, 2> &TRUE,\n              const Tensor<T, 2> &X,\n            \
  \  const Tensor<T, 2> &Z0, const Tensor<T, 2> &Z1, const Tensor<T, 2> &Z2,\n   \
  \           const Tensor<T, 2> &Y0, const Tensor<T, 2> &Y1, const Tensor<T, 2> &Y2,\n\
  \              const Tensor<T, 2> &W0, const Tensor<T, 2> &W1, const Tensor<T, 2>\
  \ &W2)\n{\n    const int batch_size = TRUE.dimension(0);\n    // 第一步，计算输出损失梯度 dC_dZ2\n\
  \    Tensor<T, 2> dC_dZ2 = Y2 - TRUE;\n    // 第二步：计算权重梯度\n    ReLU relu;\n    auto\
  \ [grad2, dC_dY1] = gradient(device, dC_dZ2, Y1, W2);\n    auto dY_dZ1 = relu.derivative(device,\
  \ Y1);\n    Eigen::Tensor<float, 2> dC_dZ1(dY_dZ1.dimension(0), dY_dZ1.dimension(1));\n\
  \    dC_dZ1.device(device) = dC_dY1 * dY_dZ1;\n    auto [grad1, dC_dY0] = gradient(device,\
  \ dC_dZ1, Y0, W1);\n    auto dY_dZ0 = relu.derivative(device, Y0);\n    Eigen::Tensor<float,\
  \ 2> dC_dZ0(dY_dZ0.dimension(0), dY_dZ0.dimension(1));\n    dC_dZ0.device(device)\
  \ = dC_dY0 * dY_dZ0;\n    auto [grad0, _] = gradient(device, dC_dZ0, X, W0, false);\n\
  \    return std::make_tuple(grad0, grad1, grad2);\n}\n```\n\n`dC_dZ2` 是使用 softmax-交叉熵技巧获取的：\n\
  \n```cpp\n// 第一步，计算输出损失梯度 dC_dZ2\nTensor<T, 2> dC_dZ2 = Y2 - TRUE;\n// 第二步：计算权重梯度\n\
  ReLU relu;\nauto [grad2, dC_dY1] = gradient(device, dC_dZ2, Y1, W2);\n```\n\n同样，`dC_dZ1`\
  \ 和 `dC_dZ0` 是通过激活函数的逐元素系数计算的：\n\n```cpp\nauto dY_dZ1 = relu.derivative(device,\
  \ Y1);\nEigen::Tensor<float, 2> dC_dZ1(dY_dZ1.dimension(0), dY_dZ1.dimension(1));\n\
  dC_dZ1.device(device) = dC_dY1 * dY_dZ1;\nauto [grad1, dC_dY0] = gradient(device,\
  \ dC_dZ1, Y0, W1);\nauto dY_dZ0 = relu.derivative(device, Y0);\nEigen::Tensor<float,\
  \ 2> dC_dZ0(dY_dZ0.dimension(0), dY_dZ0.dimension(1));\ndC_dZ0.device(device) =\
  \ dC_dY0 * dY_dZ0;\nauto [grad0, _] = gradient(device, dC_dZ0, X, W0, false);\n\
  ```\n\n注意：这两种策略在之前的章节中已经讨论过，重点是避免批量矩阵乘法。重新检查代码时，使用自定义设备执行计算这一点也值得注意。例如，在 `forward()`\
  \ 计算中：\n\n```cpp\nReLU relu;\nstatic Eigen::Tensor<T, 2> Z0(batch_size, W0.dimension(1));\n\
  Z0.device(device) = X.contract(W0, dims);\nEigen::Tensor<float, 2> Y0 = relu.evaluate(device,\
  \ Z0);\n```\n\n此代码意图使用高性能设备，如 CUDA 或多线程池。在我们的示例中，我们使用了线程池：\n\n```cpp\nconst int\
  \ threads = std::thread::concurrency();\nEigen::ThreadPool tp(threads);\nEigen::ThreadPool\
  \ device(&tp, threads);\n```\n\n这两项改进（即避免批量矩阵乘法和使用并行计算）极大提升了算法的吞吐量。查看以下输出：\n\n![](img/Figure_10.21)\n\
  \n图 10：运行改进后的反向传播。如预期，最终结果比之前的版本快得多，且在准确性方面没有任何性能下降。现在问题是：我们还能做得更好吗？这种训练可以通过多种方式进行改进。例如，我们可以引入动量来改进训练。使用\
  \ `Adam` 或 `RMSprop` 等优化器可以显著提升模型性能。接下来的章节将介绍模型泛化性技术。\n\n## 总结\n\n在本章中，我们通过扩展梯度下降以处理多层情况，实现了反向传播算法。我们了解到计算某些昂贵的操作（批量矩阵乘法）会影响算法效率。我们也了解到在大多数情况下我们可以解决这个问题。最后，我们将这些思想应用于\
  \ MNIST 数据集的训练。\n\n## 练习题\n\n1. 修改 MNIST 训练，使用至少六层的网络。增加层数对最终模型性能有何影响？\n2. 再次使用本文中的示例，将前两个隐藏层的\
  \ `ReLU` 激活函数替换为 `sigmoid`。这种改变的实际后果是什么？\n\n## 参考文献\n\n1. Paul Vicol, autograd 教程,\
  \ 2017。访问 https://www.cs.toronto.edu/~rgrosse/courses/csc321_2017/tut4.pdf\n2. Andrej\
  \ Karpathy, 你应该理解反向传播, 2016。访问 https://karpathy.medium.com/yes-you-understand-backprop-e2f06ab496b\n\
  3. Threading Building Blocks, 访问 https://www.intel.com/content/www/us/en/developer/tools/oneapi/onetbb.html\n\
  4. OpenMP, 访问 https://www.openmp.org/\n5. Boost Thread Pool, 访问 https://www.boost.org/doc/libs/1_77_0/doc/html/boost_asio/reference/thread_pool.html\n\
  6. Krizhevsky, Sutskever 和 Hinton - 基于深度卷积神经网络的图像分类。\n\n# 第 11 章 欠拟合、过拟合与正则化 (ch11)\n\
  \n## 引言\n\n本章介绍了正则化，这是深度学习中的一个核心课题，旨在寻找泛化良好的模型，即能够表示数据规律的模型，即使对于未训练的数据也是如此。在本章中，我们讨论了为什么仅最小化代价函数不足以实现实用的模型。通过五个可重复的实验，我们学习了两个最重要的建模问题：欠拟合和过拟合，并关注如何识别和缓解这些问题。\n\
  \n## 结构\n\n这是本章的路线图：\n\n* 本章实验\n* 理解模型选择\n* 实验 1：从数据拟合多项式\n* 理解欠拟合\n* 理解过拟合\n* 理解正则化\n\
  * 实验 2：一个过拟合模型\n* 实验 3：作为正则化的惩罚\n* 实验 4：数据增强\n* DropOut\n* 实验 5：DropOut 示例\n\n##\
  \ 目标\n\n\n\n\n阅读本章后，你将学会如何通过比较模型在训练数据和验证数据上的性能来识别优坏模型。这可以帮助你确定模型是否适合选择，以及当模型运行不符合预期时该怎么办。读完本章后，你还将了解如何实现深度学习中最重要的正则化技术。\n\
  \n## 本章实验\n\n本章包含五个实验：\n\n| ID | 描述 |\n| :--- | :--- |\n| Exp-11.1 | 从数据拟合多项式 |\n\
  | Exp-11.2 | 过拟合模型 |\n| Exp-11.3 | 作为正则化的惩罚项 |\n| Exp-11.4 | 数据增强 |\n| Exp-11.5\
  \ | Dropout 示例 |\n\n表 11.1: 本章实验列表\n\n## 理解模型选择\n\n到目前为止，在书中我们学习了如何使用代价函数最小化策略来训练模型。从那时起，我们的单一选择标准非常直观：找到在给定训练集上代价最小的模型。因此，如果我们有两个不同的模型并需要选择其中一个，我们就选择训练损失最低的那个。\n\
  \n正如我们很快看到的，仅使用代价最小化标准来选择模型往往会导致性能很差的模型，它们只会记忆训练数据，这种现象被称为过拟合。\n\n## 实验 1：从数据拟合多项式\n\
  \n这个实验介绍了一个经典示例，即对数据拟合不同阶数的多项式。这个简单但强大的例子说明了模型的大小如何影响实际模型的效用，并从模型捕捉数据规律的能力方面，为判断什么是好模型或坏模型提供了宝贵的见解。让我们简单回顾一下什么是多项式。\n\
  \n### 多项式\n\n考虑以下方程：\n\n![](img/eq114.jpg)\n\n该方程表示一个多项式函数。多项式是由形式为 ![](img/eq213.jpg)\
  \ 的项之和定义的函数，其中 `a_i` 是实数，称为系数，`n_i` 是非负整数（![](img/eq313.jpg) `n_i >= 0`），称为指数。请检查以下示例：\n\
  \n![](img/eq410.jpg)\n\n在多项式中，最大指数有一个特殊的名称。它被称为多项式次数。因此，第一个例子是 3 次多项式（因为 3 是 `x`\
  \ 的最大指数）。第二个是 5 次多项式，第三个是 1 次，最后一个是 4 次。\n\n### 从数据拟合多项式\n\n从数据拟合多项式意味着在给定一组对 `(x,\
  \ y(x))` 的情况下找到多项式的系数。注意，一个 n 阶多项式 ![](img/eq510.jpg) 有有 `n+1` 个系数 `a_i`。由于多项式的简单性，我们不需要使用迭代算法（如\
  \ `backpropagation`），而是可以通过求解以下线性方程组更直接地找到系数：\n\n![](img/eq710.jpg)\n\n由于我们有 `m`\
  \ 对 `(x, y(x))`，可以使用矩阵分解来求解该系统。幸运的是，`Eigen` 有一组内置的线性求解器，例如 `householderQr`，用于求解此类系统，所示：\n\
  \n```cpp\nEigen::VectorXd fit_polynom(Eigen::VectorXd& X, Eigen::VectorXd& Y, int\
  \ degree) {\n    Eigen::MatrixXd terms = Eigen::MatrixXd::Ones(X.size(), degree\
  \ + 1);\n    for (int i = 1; i <= degree; ++i) {\n        terms.col(i) = terms.col(i\
  \ - 1).cwiseProduct(X);\n    }\n    auto solver = terms.householderQr();\n    auto\
  \ coeffs = solver.solve(Y);\n    return coeffs;\n}\n```\n\n我们可以使用这个简单的函数为我们的数据拟合不同阶数的多项式。现在，让我们为实验定义数据。\n\
  \n### 设置实验数据\n\n在本例中，我们将使用以下合成数据：\n\n![](img/Figure_11.1.png)\n\n图 11.1: 实验使用的合成数据集\n\
  \n这些数据在区间 `x = [0, 1]` 上通过公式 ![](img/eq810.jpg) ![](img/eq8.1.jpg) 生成，其中 `N` 是正态分布。在这种情况下，`N`\
  \ 的作用类似于高斯误差。在 C++ 中，可以通过以下方式生成这些合成数据：\n\n```cpp\n#include <random>\n\nauto generate_synthetic_data\
  \ = & {\n    std::random_device rd {};\n    long seed = rd();\n    std::mt19937\
  \ rng(seed);\n    std::cout << \"seed: \" << seed << \"\\n\";\n\n    double range\
  \ = 1;\n    std::uniform_real_distribution<double> uniform_distro(0, range);\n \
  \   Eigen::VectorXd G = Eigen::VectorXd::Zero(size);\n    for (int i = 0; i < size;\
  \ ++i) {\n        G(i) = sin(M_PI * uniform_distro(rng));\n    }\n\n    std::normal_distribution<double>\
  \ normal_distro(0, noise_dev);\n    Eigen::VectorXd TRUE = Eigen::VectorXd::Zero(size);\n\
  \    for (int i = 0; i < size; ++i) {\n        TRUE(i) = G(i) + normal_distro(rng);\n\
  \    }\n    return std::make_pair(G, TRUE);\n};\n\nint main() {\n    auto [X, TRUE]\
  \ = generate_synthetic_data();\n    std::vector<int> poly_degrees = {1, 2, 3, 4,\
  \ 5, 6, 7, 8, 9};\n    Eigen::MatrixXd results(X.size(), poly_degrees.size());\n\
  \    Eigen::VectorXd input = Eigen::VectorXd::Linaced(results.rows(), 0., 1);\n\n\
  \    for (int i = 0; i < poly_degrees.size(); ++i) {\n        int degree = poly_degrees[i];\n\
  \        auto params = fit_polynom(X, TRUE, degree);\n        results.col(i) = eval(input);\n\
  \    }\n\n    Eigen::IOFormat formatter(4, 0, \"\\t\", \"\\n\", \"\");\n    for\
  \ (int degree : poly_degrees) {\n        std::cout << \"degree \" << degree << \"\
  \\t\";\n    }\n    std::cout << results.format(formatter) << \"\\n\\n\";\n\n   \
  \ return 0;\n}\n```\n\n这段代码使用生成的数据拟合九阶阶分别为 1, 2, 3, 4, 5, 6, 7, 8, 9 的多项式。注意，由于我们已经有了数据在手，让我们利用它来：\n\
  \n\n\n\n\n在真实项目中，我们会丢弃这样的模型。欠拟合的模型是无用的，它们只能作为其他模型的参考。\n\n### 过拟合\n\n另一方面，是高阶多项式，例如\
  \ 7 次、8 次和 9 次多项式，所示：\n\n![](img/Figure_11.5.png)\n\n图 11.5：高阶多项式拟合\n\n这些模型提供了极低的\
  \ `MSE` 值，实现了对训练数据的几乎完美拟合。事实上，9 次多项式能够通过每一个训练实例点。\n\n这里的陷阱在于，如果只考虑代价函数的最小化，9 次模型就是完美拟合的。然而，实际上，这个模型是表现最的模型之一。\n\
  \n由于我们知道原始的 `sin` 函数（用于生成合成训练数据的函数），我们可以很容易识别出高阶多项式无法表示原始数据分布，在原始生成曲线周围剧烈震荡。这就是过拟合。参考下图：\n\
  \n![](img/Figure_11.6.png)\n\n图 11.6：9 次多项式拟合与原始正弦曲线的对比\n\n| Note：在过拟合中，尽管模型在训练数据上实现了高性能，但它无法很好地表示数据中的规律性。\
  \ |\n\n结果，过拟合模型在未用于训练的数据上表现非常差。我们可以通过将相同的模型应用于新数据来轻松检查此问题。例如，让我们使用相同的 `sin` 函数和高斯噪声生成另一组点，并检查高阶多项式近似这些点的效果如何：\n\
  \n![](img/Figure_11.7.png)\n\n图 11.7：高阶多项式拟合与新数据的对比\n\n两幅图和相应的 `MSE` 值均显示，7、8、9\
  \ 次多项式惨败地无法表示新数据。事实上，将高阶模型与未参与其训练的数据进行比较，可以观察到它们甚至几乎不能拟合新实例。因此，使用新数据计算出的 `MSE` 值非常高。\n\
  \n最后这个结果表明，尽管高阶模型在训练数据上取得了非常好的性能，但它们对于预测未见的数据实际上是无用的。\n\n| Note：我们说过拟合模型**泛化能力差**。\
  \ |\n\n我们刻意地从极端情况开始分析，即最低次数和最高次数的多项式。现在，让我们检查中间的模型。\n\n## 选择良好的模型\n\n观察多项式的图表，我们可以发现\
  \ 3 次和 4 次多项式在训练数据上实现了较小的 `MSE` 值，并且相当近似了原始的正弦函数，所示：\n\n![](img/Figure_11.8.png)\n\
  \n图 11.8：3 次和 4 次多项式拟合\n\n事实上，它们看起来很有前景。然而，它们在新数据上的表现如何呢？让我们来看看：\n\n![](img/Figure_11.9.png)\n\
  \n图 11.9：3 次和 4 次多项式拟合与新数据的对比\n\n尽管性能有所下降，但它们在新数据（即未用于训练它们的数据）上仍然运行得良好。在现实场景中，我们应该在模型选择步骤选择这两个模型中的一个（或两者）。\n\
  \n| Note：这个例子说明了模型中的参数数量是决定模型质量的关键因素。 |\n\n如果我们使用参数过多的模型，模型可能会过拟合训练数据。由于过拟合模型只在训练数据上表现良好，因此对于进一步使用是无用的。\n\
  \n| Note：过拟合模型是无用的。 |\n\n另一方面，参数过少的模型往往会欠拟合训练数据，即使在训练数据上也无法达到最基本的性能。\n\n| Note：欠拟合模型也是无用的。\
  \ |\n\n寻找合适的模型尺寸是开发机器学习模型时最关键的步骤之一。让我们了解其他识别和避免过拟合与欠拟合的其他相关方面。\n\n## 理解欠拟合\n\n在欠拟合中，训练误差很高。这意味着建模早期的某些环节没有起作用。欠拟合的常见原因有：\n\
  \n*   **数据质量问题**：数据中的高噪声、冲突、缺失变量、离群值和其他以数据为中心的问题影响模型捕捉底层模式的能力。即使数据编码了可识别的模式，类别不平衡等问题也会增加训练的难度，导致模型欠拟合一个或多个类。特征工程和数据准备可能会有所帮助。但在某些情况下，你最终需要获取更多数据或重新思考系统。\n\
  *   **超参数调优**：由于超参数选择不当导致欠拟合的最常见例子是学习率太小。如果学习率太小，算法需要大量的迭代（epochs）才能到达最低点，通常在找到良好的近似之前就停止了，或者陷入了局部最优。另一个常见问题是参数初始化不当，这使得算法起始位置距离合适的最小值太远。事实上，所有的超参数选择都可能导致欠拟合。\n\
  *   **低容量模型**：如上一个例子所示，参数不足的模型无法充分表示数据的规律性。虽然解决方案可能很简单（增加参数数量），但在实际环境中，由于底层硬件的实际限制，这往往很难实现。\n\
  *   **实现错误**：算法开发者总是容易失败，最终会内联出从简单到复杂的 bug，例如在收缩中组合不同的维度。由于通常的操作量巨大和内在的随机性，在深度学习代码中检测\
  \ bug 通常很难。考虑再次阅读第 3 章《测试深度代码》，以理解如何减少 bug 影响模型结果。\n*   **训练方法论错误**：训练流程也可能导致欠拟合。例如，忘记洗牌数据会引入顺序偏差，影响训练方案。下一章将介绍训练流程，并探讨如何保持训练免于方法论错误。\n\
  \n## 理解过拟合\n\n过拟合模型在训练数据上表现非常好，但在未见数据上表现很差。因此，仅通过训练性能是不可能检测出过拟合的。确保模型是否过拟的唯一方法是使用另一个未用于训练模型的数据。该数据集通常验证数据。\n\
  \n模型在验证数据上的性能是对模型在新数据上性能的估计，也称为泛化能力或泛化性能。\n\n| Note：使用不同的数据集评估模型是关重要的，因为它为生产环境中的真实模型性能提供了良好的估计。\
  \ |\n\n| Note：使用验证集的数据来训练模型是最基础的方法论错误之一。 |\n\n验证模型可以检测过拟合。我们可以做什么来减少模型过拟合数据的概率？常见的过拟合来源如下：\n\
  \n\n\n\n\n*   **数据样本少**：过拟合最常见的来源是训练数据稀缺。如果模型只有少数实例用于训练，很难判断它看到的是一种模式还是仅仅是某个特定的实例。解决这个问题很简单：增加数据。在实践中，获取新数据可能涉及成本，或者如果该现象本质上非常罕见，获取数据是不可行的。在这种情况下，数据增强会有帮助。\n\
  *   **高维数据**：数据的维度越高，训练所需的数据就越多。高维数据为建模带来了多项挑战，这一问题通常被称为“数之灾”。同样，更多数据可以帮助模型避免过拟合，但不仅于此。你必须检查特征，并在可能的情况下减少数据空间。最简单的检查是属性的变化。不变化的特征（例如，图像中某个颜色始终相同的区域）是没用的。使用主成分分析（`PCA`）或自动编码器等技术可以自动提供数据的降维版本。这些压缩版本通常被称为嵌入（embeddings）。\n\
  *   **参数过多的模型**：在多项式回归示例中，我们学习到阶数过多的项式容易过拟合。层数过多或权重矩阵不必要的巨大的神经网络也会发生这种情况。如果你的模型发生了过拟合，减少模型尺寸是首要任务之一。\n\
  *   **训练时间过长**：训练模型的一个很好的比喻是烹饪。如果你烤蛋糕时间太久，可能会搞砸整个东西，最后手里只下一块毫无用的焦块，浪费了时间和原料。训练模型大同小异。对模型拟合过多轮次（epochs）会导致模型过拟合数据。在本章的后后部分，我们将学习一种早停技术来帮助我们避免这种情况。\n\
  *   **超参数调优过度**：除了总轮数外，其他超参数也可能导致模型过拟合。通常，较大的批大小（batch sizes）会减少过拟合的概率。\n\n避免过拟合的核心关注在于减少泛化误差。解决这一问题的不同方法称为正则化（regularization），将在下一节中介绍。\n\
  \n## 理解正则化\n\n本书涵盖的算法（大部分是深度学习算法）在拟合训练数据模型方面非常强大。然而，在开发新模型时，主要的关注点不是拟合，而是泛化。换句话说，开发良好模型的真正挑战是找到在未来的未见数据上表现良好的模型。\n\
  \n> 注意：这种在先未知数据上表现良好的能力正是模型真正价值的所在。\n\n实现良好的泛化并非易事。在多项式拟合实验中，我们预先知道生成函数的公式。在现实世界的问题中，我们并没有这些关键信息。事实上，这里有两个关键问题：\n\
  \n*   我们如何确定一个模型是否过拟合？\n*   一旦我们知道模型过拟合了，我们可以做什么来修复它？\n\n第一个问题的答案很简单：我们留出一小部分数据来检查模型在这些数据上的性能。这部分数据通常被称为验证集（validation\
  \ dataset），不能以任何方式用于训练模型。一个模型在训练数据上表现良好但在验证集上表现很差，说明有强烈的过拟合迹象，通常会被丢弃。如果我们所有的模型都过拟合，我们需要找到一种避免这种情况的方法。正则化有一系列方法可以帮助我们避免过拟合模型。根据《深度学习》书[2]：\n\
  \n正则化是指对学习算法所做的任何修改，其目的是减少其泛化误差而非训练误差。\n\n我们可以将正则化方法总结为四类：\n\n*   **改变代价函数以惩罚坏模型**：这是\
  \ `L1` 和 `L2` 正则化的情况，权重本身被包含在代价函数的评估中。\n*   **改变数据**：增加数据通常是解决过拟合模型的最佳方法。然而，获取更多数据往往并不容易，甚至不存在。正如本章稍后讨论的，使用数据增强会有帮助。其他数据质量问题也可以得到解决，例如删除离群值。\n\
  *   **改变网络拓扑**：这种方法通常在训练期间断开某些权重或神经元。最流行的例子是 `DropOut`。\n*   **改变训练方案**：这是一类杂多种的方法。例如，我们可以使用早停（`Early\
  \ Stopping`）在模型开始过拟合时终止训练。我们还可以使用批（batches）训练模型，这从客观上减少了过拟合。\n\n我们将在接下来的章节中讨论这些方法，届时通过实际实验说明过拟合和几种正则化方法。\n\
  \n# 实验 2：过拟合的模型\n\n第一个实验使用多项式来说明模型尺寸与其性能之间的关系。本实验使用一个真实的神经网络来说明过拟合是如何在这些模型中发生的。\n\
  \n## 定义模型\n\n下图表示了本实验中使用的模型：\n\n![](img/Figure_11.10.png)\n\n图 11.10：实验中使用的模型\n\n\
  这个简单模型仅由三个全层组成：\n\n*   输入层有 784 个输入神经元和 512 个输出神经元。\n*   隐藏层有 512 个输入神经元和 64 个输出神经元。\n\
  *   输出层是一个 `softmax` 层，有 64 个输入神经元和 10 个输出神经元。\n\n我们计划使用 `MNIST` 训练这个网络。因此，我们使输入神经元的数量与\
  \ `MNIST` 记录的大小（`28x28 = 784`）以及网络输出与类别数量（十类）匹配。\n\n以下类实现了这一点：\n\n```cpp\ntemplate\
  \ <typename Device>\nclass Model {\npublic:\nModel(Device &device, int hidden_layer_size)\
  \ {\n    Tensor_2D W1(28*28, hidden_layer_size);\n    glorot_uniform_initializer(rng,\
  \ W1);\n    dense_1 = new DenseLayer<Device>(device, W1, ReLU<2>());\n    Tensor_2D\
  \ W2(hidden_layer_size, 64);\n    glorot_uniform_initializer(rng, W2);\n    dense_2\
  \ = new DenseLayer<Device>(device, W2, ReLU<2>());\n    Tensor_2D WC(64, 10);\n\
  \    glorot_uniform_initializer(rng, WC);\n    output_layer = new SoftmaxCrossEntropyLayer(device,\
  \ WC);\n}\n//...\nprivate:\nDenseLayer<Device> *dense_1;\nDenseLayer<Device> *dense_2;\n\
  SoftmaxCrossEntropyLayer<Device> *output_layer;\n};\n```\n\n使用类来实现模型非常方便。我们可以通过实现以下三个方法来定义模型的行为：\n\
  \n```cpp\nvoid forward(const Tensor_2D &input) {\n    dense_1->forward(input);\n\
  \    dense_2->forward(dense_1->get_output());\n    output_layer->forward(dense_2->get_output());\n\
  }\n\nvoid backward(const Tensor_2D &upstream) {\n    output_layer->backward(upstream,\
  \ true);\n    dense_2->backward(output_layer->get_output(), true);\n    dense_1->backward(dense_2->get_output(),\
  \ false);\n}\n\nvoid update(const float learning_rate, int epoch) {\n    dense_1->update(learning_rate,\
  \ epoch);\n    dense_2->update(learning_rate, epoch);\n    output_layer->update(learning_rate,\
  \ epoch);\n}\n```\n\n训练这个模型涉及遍历数据集并调用 `forward()`、`backward()` 和 `update()`。这在以下代码中实现：\n\
  \n```cpp\ntemplate <typename MODEL>\nvoid training(MODEL &model, const Tensor_2D\
  \ &training_images, const Tensor_2D &training_labels, \nconst Tensor_2D &validation_images,\
  \ const Tensor_2D &validation_labels,\n```\n\n\n\n\n```cpp\nconst int MAX_EPOCHS,\
  \ float learning_rate) {\n  CategoricalCrossEntropy cost_fn;\n  int epoch = 0;\n\
  \  while (epoch < MAX_EPOCHS)\n  {\n    auto begin = high_resolution_clock::now();\n\
  \    model.forward(training_images);\n    model.backward(training_labels);\n   \
  \ model.update(learning_rate, epoch);\n    auto end = high_resolution_clock::now();\n\
  \    auto duration = duration_cast<milliseconds>(end - begin);\n    auto training_pred\
  \ = model.predict(training_images);\n    float training_loss = cost_fn.evaluate(training_labels,\
  \ training_pred);\n    float training_acc = accuracy(training_labels, training_pred);\n\
  \    auto validation_pred = model.predict(validation_images);\n    float validation_acc\
  \ = accuracy(validation_labels, validation_pred);\n    float validation_loss = cost_fn.evaluate(validation_labels,\
  \ validation_pred);\n    std::cout \n    << \"epoch:\\t\" << epoch << \"\\t\"\n\
  \    << \"took:\\t\" << duration.count() << \"mills\\t\"\n    << \"\\ttraining_loss:\\\
  t\" << training_loss\n    << \"\\ttraining_acc:\\t\" << training_acc\n    << \"\\\
  tvalidation_loss:\\t\" << validation_loss\n    << \"\\tvalidation_acc:\\t\" << validation_acc\n\
  \    << \"\\n\";\n    epoch++;\n  }\n}\n```\n\n这段代码的关键部分是在循环内部调用 `model`：\n\n```cpp\n\
  while (epoch < MAX_EPOCHS)\n{\n  model.forward(training_images);\n  model.backward(training_labels);\n\
  \  model.update(learning_rate, epoch);\n  //...\n}\n```\n\n如你所知，我们在这里使用了反向传播算法。因此，对于每个\
  \ `epoch`，我们都会执行前向传播、反向传播和更新步骤。\n\n模型已经设置好。让我们检查用于训练的数据。\n\n### 加载数据\n\n这个实验背后的意图是说明一个过拟合的模型。因此，我们将仅使用\
  \ MNIST 的极小子集来训练模型。查看下方我们是如何加载数据的：\n\n```cpp\nstd::tuple<Tensor_2D, Tensor_2D, Tensor_2D,\
  \ Tensor_2D> \nload_data(long int training_instances, long int validation_instances)\
  \ {\n  auto [training_images, training_labels, validation_images, validation_labels]\
  \ = load_mnist(\"data/mnist\", rng);\n  // 获取数据切片\n  Eigen::array<Eigen::Index,\
  \ 2> zero_offset = {0, 0};\n  Eigen::array<Eigen::Index, 2> training_x_extents =\
  \ {training_instances, 784};\n  Eigen::array<Eigen::Index, 2> training_y_extents\
  \ = {training_instances, 10};\n  Eigen::array<Eigen::Index, 2> validation_x_extents\
  \ = {validation_instances, 784};\n  Eigen::array<Eigen::Index, 2> validation_y_extents\
  \ = {validation_instances, 10};\n  Eigen::Tensor<float, 2> training_x_ds = training_images.slice(zero_offset,\
  \ training_x_extents);\n  Eigen::Tensor<float, 2> training_y_ds = training_labels.slice(zero_offset,\
  \ training_y_extents);\n  Eigen::Tensor<float, 2> validation_x_ds = validation_images.slice(zero_offset,\
  \ validation_x_extents);\n  // 注意：原文此处存在逻辑跳跃，保留原有结构\n  auto result = std::make_tuple(training_x_ds,\
  \ training_y_ds, validation_x_ds, validation_y_ds);\n  return result;\n}\n```\n\n\
  我们是这样调用这个函数的：\n\n```cpp\nauto [training_images, training_labels, validation_images,\
  \ validation_labels] = load_data(100, 2000);\n```\n\n可以看出，我们只加载了 100 个训练实例和 2000\
  \ 个验证实例。模型能够从这 100 张图片中学习学习吗？答案在下一步。\n\n### 训练模型\n\n我们可以使用以下程序执行训练：\n\n```cpp\n\
  int main(int, char**) {\n  auto [training_images, training_labels, validation_images,\
  \ validation_labels] = load_data(100, 2000);\n  std::cout << \"Data loaded!\\n\"\
  ;\n  std::cout << \"training_images dims: \" << training_images.dimensions() <<\
  \ \"\\n\";\n  std::cout << \"training_labels dims: \" << training_labels.dimensions()\
  \ << \"\\n\";\n  std::cout << \"validation_images dims: \" << validation_images.dimensions()\
  \ << \"\\n\";\n  std::cout << \"validation_labels dims: \" << validation_labels.dimensions()\
  \ << \"\\n\";\n  const int MAX_EPOCHS = 500;\n  const float learning_rate = 0.01f;\n\
  \  const int threads = std::thread::hardware_concurrency();\n  Eigen::ThreadPool\
  \ tp(threads);\n  Eigen::ThreadPoolDevice device(&tp, threads);\n  Model model(device,\
  \ 512);\n  training(training_images, training_labels, validation_images, validation_labels,\
  \ MAX_EPOCHS, learning_rate);\n  return 0;\n}\n```\n*(注：根据上下文逻辑，原文示例代码中 `training`\
  \ 调用处可能漏掉了参数，此处翻译保持代码结构一致)*\n\n运行此代码并绘制图表的结果如下：\n\n![](img/11.11.png)\n*11.11：过拟合模型的训练与验证损失*\n\
  \n这里需要注意的是，训练损失低于验证损失。模型确实出现了过拟合，但是在第 100 个 epoch 之后开始。这意味着训练得越长，结果越差。\n\n验证损失是衡量泛性能的指标。验证损失在某一点持续增加，表明模型正在失去预测新数据的泛化能力。\n\
  \n我们可以查看训练和验证准确率：\n\n![](img/11.12.png)\n*11.12：过拟合模型的训练与验证准确率*\n\n训练准确率达到了 100%，而验证准确率停在\
  \ 72% 以下。模型正在死记训练数据集，这表明了过拟合。\n\n正如我们预期的，仅使用 100 张图片导致了过拟合。过拟合的模型在部署时可能表现很差。在后续章节中，我们将介绍避免过拟合的方法。\n\
  \n### 缩小模型尺寸\n\n当我们拿到一个过拟合模型时，首先尝试的是缩小模型尺寸。让我们检查仅使用两个层且隐藏层只有 32 个单元的模型性能：\n\n```cpp\n\
  Model model(device, 32);\ntraining(training_images, training_labels, validation_images,\
  \ validation_labels, MAX_EPOCHS, learning_rate);\n```\n\n正如本章第一部分所述，模型越大越容易过拟合。再次运行此较小的模型，得到如下结果：\n\
  \n![](img/11.13.png)\n*11.13：使用 32 个隐藏神经元的训练与验证损失*\n\n这里需要注意的是，得到的验证损失低于之前的之前的模型。模型同样存在过拟合，但是在第\
  \ 150 个 epoch 之后才开始。结果是模型取得了更高的准确率，如下：\n\n![](img/11.14.png)\n*11.14：使用 32 个隐藏神经元的训练与验证准确率*\n\
  \n通过调整模型尺寸来提高模型性能是有效的。然而，对于具有多个层和参数的复杂现实深度模型，确定合适的尺寸并非容易或切实际。我们将在后续实验中探索其他类似的方法。\n\
  \n### 早停\n\n一种防止因训练过长导致性能下降的简单方法是早停。通过早停，我们可以在性能不再提升时终止训练。早停可以通过一种简单的方式实现：\n\n```cpp\n\
  float min_validation_loss = std::numeric_limits<float>::max();\nint early_stop_count\
  \ = 0;\nconst int patience = 5; // 设置最大容忍\nint epoch = 0;\nwhile (epoch++ < MAX_EPOCHS\
  \ && early_stop_count < patience)\n{\n```\n\n\n\n\n## 训练循环\n\n```cpp\n// 在此处运行训练循环\n\
  // ... \nauto validation_pred = model.predict(validation_images);\nfloat validation_loss\
  \ = cost_fn.evaluate(validation_labels, validation_pred);\n\nif (validation_loss\
  \ < min_validation_loss) {\n    min_validation_loss = validation_loss;\n    early_stop_count\
  \ = 0;\n} else {\n    early_stop_count++;\n}\n```\n\n运行此代码将得到以下性能：\n\n![](img/Figure_11.15.png)\n\
  \n图 11.15：使用早停法\n\n在实践中，早停总是被使用的。\n\n## 实验 3：作为正则化的惩罚机制\n\n惩罚（Penalization）是一种非常流行的正则化技术，它的核心概念是对比具有过多非零参数的模型进行惩罚。因此，梯度下降可以使用惩罚信号来自动决定在代价曲面上移动的方向。\n\
  \n有两种常见的基于惩罚的正则化方法：`L1` 和 `L2`。它们的工作原理相似，都是通过向代价函数值添加一个项（惩罚项）来实现。`L2` 使用每个权重平方范数之和：\n\
  \n![](img/eq94.jpg)\n\n`L1` 使用绝对系数之和：\n\n![](img/eq104.jpg)\n\n| 注意：我们可以通过使用超参数\
  \ `λ` 来控制这些正则化方法对训练的影响。 |\n\n使用本书书中目前为止讨论的微积分规则，我们可以发现使用 `L2` 正则化的权重更新可以重写如下：\n\n\
  ![](img/eq115.jpg)\n\n其中 `η` 是学习率，`λ` 是正则化超参数，是训练实例的数量，且是权重的梯度。\n\n我们可以通过修改 `Dense\
  \ Layer` 类中的 `update()` 方法来实现 `L1` 和 `L2` 正则化。考虑默认的实现：\n\n```cpp\nvoid update(const\
  \ TYPE learning_rate, int epoch) {\n    auto weight_update = weight_grad * weight_grad.constant(-learning_rate);\n\
  \    this->weight = this->weight + weight_update;\n}\n```\n\n我们可以按照如下方式修改该方法以包含\
  \ `L2` 正则化：\n\n```cpp\nvoid update(const TYPE learning_rate, int epoch) {\n    Tensor_2D\
  \ weight_update = weight_grad * weight_grad.constant(-learning_rate);\n    if (L2_weight_decay_lambda\
  \ > 0) {\n        const int batch_size = this->output.dimension(0);\n        TYPE\
  \ weight_decay = (learning_rate * L2_weight_decay_lambda / batch_size);\n      \
  \  Tensor_2D decay = weight.constant(weight_decay) * this->weight;\n        weight_update\
  \ = weight_update - decay;\n    }\n    this->weight = this->weight + weight_update;\n\
  }\n```\n\n现在，我们可以这样设置 `L2_weight_decay_lambda`：\n\n```cpp\nModel(Device &device,\
  \ const int hidden_layer_size) {\n    //...\n    dense_1->set_L2_weight_decay_lambda(10);\n\
  \    dense_2->set_L2_weight_decay_lambda(10);\n    output_layer->set_L2_weight_decay_lambda(10);\n\
  }\n```\n\n在此此更改后，再次运行训练将导致：\n\n![](img/Figure_11.16.png)\n\n图 11.16：使用 L2 正则化\n\n\
  同样地，我们可以进行 `L1` 正则化：\n\n```cpp\nvoid update(const TYPE learning_rate, int epoch)\
  \ {\n    Tensor_2D weight_update = this->weight_grad * this->weight_grad.constant(-learning_rate);\n\
  \    if (this->L1_weight_decay_lambda > 0) {\n        const int batch_size = this->output.dimension(0);\n\
  \        TYPE weight_decay = (learning_rate * this->L1_weight_decay_lambda / batch_size);\n\
  \        auto signal_decay = this->weight.unaryExpr([](TYPE val){return book::utils::signal(val);});\n\
  \        Tensor_2D decay = signal_decay.constant(weight_decay) * this->weight;\n\
  \        weight_update = weight_update - decay;\n    }\n    this->weight = this->weight\
  \ + weight_update;\n    if (this->use_bias) {\n        auto bias_update = this->bias_grad\
  \ * this->bias_grad.constant(-learning_rate);\n        this->bias = this->bias +\
  \ bias_update;\n    }\n}\n```\n\n同样设置 `L1_weight_decay` 的结果如下：\n\n![](img/Figure_17.png)\n\
  \n图 11.17：使用 L1 正则化\n\n| 注意：同时使用 L1 和 L2 是没有问题的。 |\n\n`L1` 和 `L2` 的作用是强制权重接近零。正因如此，它们被称为权重衰减（weight\
  \ decay）。\n\n## 实验 4：数据增强\n\n在现实项目中，数据稀缺是过拟合最常见的来源之一。从实际角度来看，这是一个真实的问题，因为高质量数据往往难以获取。对于此类场景，即使是之前的正则化方法可能会失效。\n\
