  \n## 引言\n\n本章讨论了改进算法搜索的策略，特别是梯度下降算法最流行的三种变体：`Momentum`（动量）、`RMSProp` 和 `Adam`。我们将看到，这些变体（通常称为\
  \ `optimizers`）允许我们利用 `gradient descent` 的性能，在收敛时间和质量方面提供最先进的水平。\n\n## 结构\n\n以下是本章的路线图：\n\
  \n* 本章的实验\n* 优化最小化过程\n* 引入动量\n* 引入 RMSProp\n* 引入 Adam\n* 实验：比较优化器\n\n## 目标\n\n读完本章后，读者将了解如何实现梯度下降最重要的变体：`Momentum`、`RMSProp`\
  \ 和 `Adam`。读者将理解这些算法的工作原理，以及如何应用它们来训练深度学习模型。\n\n## 本章的实验\n\n本章仅包含一个实验：\n\n| ID |\
  \ 描述 |\n| :--- | :--- |\n| Exp-13.1 | 比较优化器 |\n\n表 13.1：章节实验列表\n\n## 优化最小化过程\n\n\
  考虑以下假设的 2D 代价表面的表示：\n\n![](img/Figure_13.1.png)\n\n图 13.1：绘制代价函数面 `f(x,y)`\n\n现在，考虑使用等值线\
  \ [1] 表示的相同表面：\n\n![](img/Figure_13.2.png)\n\n图 13.2：使用等高线表示代价表面\n\n很多时候，由于代价表面的特殊形状，使用\
  \ `gradient descent` 训练模型会导致如下行为：\n\n![](img/Figure_13.3.png)\n\n图 13.3：梯度下降中更新的默认行为\n\
  \n黑色箭头代表算法迭代中的连续权重更新。我们可以看到它们通过在每一步中交替更新方向形成之字形路径。当然，这种之字形路径是不理想的，最终会增加收敛时间。我们能做得更好吗？是的，可以。考虑梯度下降中使用\
  \ `η` 通过梯度来更新 `W` 的常规方式：\n\n![](img/17)\n\n在本章中，我们将探索三种技术。`Momentum` [2] 是其中第一种。它利用记忆机制将规则更改如下所示\
  \ [3]：\n\n![](img/25)\n\n上面的表达式显示了如何通过包含一个初始为 0 的元素 `V` 和一个满足 `0 ≤ β ≤ 1` 的标量 `β`\
  \ 来更新。事实证明，在连续更新后，`V` 将每次更新的比例。该比例由超参数 `β` 控制。因此，使用动量后，训练收敛不再那么剧烈，如图所示：\n\n![](img/Figure_13.4.png)\n\
  \n图 13.4：使用动量改进搜索\n\n## 引入动量\n\n`Momentum` 可以通过在 `update()` 方法中包含一个钩子来轻松实现。考虑我们之前的版本：\n\
  \n```cpp\nvoid update(float learningrate) {\n    weight = weight - grad * learningrate;\n\
  }\n```\n\n现在，我们可以将其重新定义如下：\n\n```cpp\ntypedef std::function<Eigen::Tensor<float,\
  \ 2>(Eigen::Tensor<float, 2>&, float, int)> Optimizer;\nOptimizer optimizer;\nvoid\
  \ update(float learningrate, int epoch) {\n    auto update = optimizer(grad, learningrate,\
  \ epoch);\n    weight = weight + update;\n}\n```\n\n对象 `optimizer` 持有任何可对象（例如 lambda\
  \ 表达式、函数或仿函数），在其中我们可以传递梯度、学习率和当前 epoch 以获取相应的更新。我们可以将默认更新定义如下：\n\n```cpp\ntemplate\
  \ <int _RANK>\nclass DEFAULT_UPDATE {\npublic:\n    Eigen::Tensor<float, _RANK>\
  \ operator()(Eigen::Tensor<float, _RANK>& grad, float learningrate, int epoch) {\n\
  \        Eigen::Tensor<float, _RANK> result = grad * grad.constant(-learningrate);\n\
  \        return result;\n    }\n};\n```\n\n在层初始化中设置：\n\n```cpp\nDenseLayer(Device\
  \ &device, Eigen::Tensor<float, 2> weight, ActivationFunction<Device, 2>* activation_function)\
  \ \n: Layer<Device, 2, 2>(device, \"book.layers.dense\"), weight(std::move(weight)),\
  \ activation_function(activation_function)\n{\n    grad = weight.constant(0);\n\
  \    optimizer = DEFAULT_UPDATE<2>();\n}\n```\n\n| 注意：面向对象的实现并非强制。我们可以通过纯过程化的解决方案类似的结果。\
  \ |\n\n一旦设置了钩子，我们可以如下定义 Momentum 仿函数：\n\n```cpp\ntemplate <int _RANK>\nclass Momentum\
  \ {\npublic:\n```\n\n\n\n\n\n```cpp\n5. Momentum(float momentum): momentum(momentum)\
  \ { }\n\n6. Momentum(): Momentum(0.9) { }\n\n8. Eigen::Tensor<float, _RANK> operator()(Eigen::Tensor<float,\
  \ _RANK> &grad, float learning_rate, int epoch) {\n9. if (velocity.size() != grad.size())\
  \ {\n10. velocity = grad.constant(0);\n11. }\n12. velocity = velocity * grad.constant(momentum)\
  \ + grad * grad.constant(-learning_rate);\n13. return velocity;\n14. }\n16. private:\n\
  17. float momentum;\n18. Eigen::Tensor<float, _RANK> velocity;\n19. };\n```\n\n\
  最后，我们可以定义一个 setter 在构建层后设置优化器：\n\n1. `DenseLayer<Device> dense(device, initial_weight,\
  \ new ReLU<Device, 2>(device));`\n2. `dense.set_optimizer(Momentum<2>());`\n\n根据吴恩达\
  \ [4] 的说法，动量（momentum）总是是值得的。这意味着如果我们使用简单的梯度下降来训练模型，使用动量将始终会有帮助，从而更快地收敛到极值。\n\n\
  近年来，还有两种不同的优化策略赢了欢迎：RMSProp 和 Adam。让我们在下一节开始描述 RMSProp。\n\n## 介绍 RMSProp\n\n与动量一样，RMSProp\
  \ [5] 使用了保留之前更新记忆以影响下一次更新的概念。然而，记忆因子的计算方式是不同的。\n\n再次考虑在给定学习率 `η` 和权重梯度 `∇W` 的情况下权重\
  \ `W` 的更新。在 RMSProp 中，权重更新通过以下表达式获得 [6]：\n\n![](img/eq315.jpg)\n\n我们可以这样理解最后一个公式：\n\
  \n![](img/eq413.jpg)\n\n或者，甚至：\n\n![](img/eq513.jpg)\n\n最后一个公式与原始更新规则公式相似。区别在于我们使用的是修改后的学习率，而不是原始学习率\
  \ `η`。这种对修改学习率的使用使得像 `RMSProp` 等算法被称为自适应学习率算法。自适应学习率算法是非常理想的，因为选择合适的常数学习率通常是非常困难且耗时的决策。因此，使用一种可以在训练期间自适应学习率的鲁棒算法通常是一个很好的决定。\n\
  \n让我们在下一节看看如何实现 RMSProp。\n\n## RMSProp 实现\n\n与动量类似，我们可以像下面所示定义一个 `RMSProp` 函数对象：\n\
  \n```cpp\n1. template <int _RANK>\n2. class RMSProp {\n4. public:  \n6. RMSProp(float\
  \ beta): beta(beta) { }\n7. RMSProp(): RMSProp(0.9) { }\n9. Eigen::Tensor<float,\
  \ _RANK> operator()(Eigen::Tensor<float, _RANK> &grad, float learning_rate, int\
  \ epoch) {\n10. if (S.size() != grad.size()) {\n11. S = grad.constant(0);\n12. }\n\
  13. S = S * grad.constant(beta) + grad * grad * grad.constant(1.f - beta);\n14.\
  \ Eigen::Tensor<float, _RANK> result = grad * (S + S.constant(1e-5)).rsqrt() * grad.constant(-learning_rate);\n\
  15. return std::move(result);\n16. }\n18. private:\n19. float beta;\n20. Eigen::Tensor<float,\
  \ _RANK> S;\n21. };\n```\n\n`rsqrt()` 提供平方根的逐元素倒数：\n\n![](img/eq615.jpg)\n\n| 注意：我们添加了一个微小的正常数\
  \ `ε = 1e-5` 以避免除以零。 |\n\n深度学习社区发现 `RMSProp` 是一种针对各种不同应用训练真实世界模型的有效方法，其重要性仅与下一节介绍的优化器\
  \ `Adam` 可相并驱。\n\n## 介绍 Adam\n\nAdam [7] 于 2014 年引入，由于其在基准测试或实际产品开发中取得了令人深刻的结果，迅速获得了科学界和工业界的关注。由于此，人们在使用梯度下降时，通常将\
  \ `Adam` 视为默认的训练优化器，除了仍在使用的 `RMSProp` 和随机梯度下降之外。\n\n`Adam` 可以看作是 `RMSProp` 和 `Momentum`\
  \ 的结合 [8]：\n\n![](img/eq712.jpg)\n\n变量 `t` 代表第 `t` 个 epoch 计数器。`β1` 和 `β1` 是两个通常设置为\
  \ `0.9` 和 `0.999` 的超参数。`Adam` 的作者建议使用 `0.001` 的学习率。\n\n## Adam 实现\n\n我们可以以实现 RMSProp\
  \ 的相同的方式实现 `Adam` 函数对象：\n\n```cpp\n1. template <int _RANK>\n2. class Adam {\n4.\
  \ public:  \n6. Adam(float beta1, float beta2): beta1(beta1), beta2(beta2) { }\n\
  7. Adam(): Adam(0.9, 0.999) { }\n9. Eigen::Tensor<float, _RANK> operator()(Eigen::Tensor<float,\
  \ _RANK> &grad, float learning_rate, int epoch) {\n10. if (V.size() != grad.size())\
  \ {\n11. V = grad.constant(0);\n12. }\n13. if (S.size() != grad.size()) {\n14. S\
  \ = grad.constant(0);\n15. }\n16. if (epoch <= 0) {\n17. epoch = 1;\n18. }\n19.\
  \ V = V * grad.constant(beta1) + grad * grad.constant(1.f - beta1);\n20. S = S *\
  \ grad.constant(beta2) + grad * grad * grad.constant(1.f - beta2);\n22. auto _V\
  \ = V * V.constant(1.f - std::pow(beta1, epoch));\n23. auto _S = S * S.constant(1.f\
  \ - std::pow(beta2, epoch));\n25. Eigen::Tensor<float, _RANK> result = _V * (_S\
  \ + S.constant(1e-5)).rsqrt() * grad.constant(-learning_rate);\n26. return std::move(result);\n\
  27. }\n29. private:\n30. float beta1;\n31. float beta2;\n32. Eigen::Tensor<float,\
  \ _RANK> V;\n33. Eigen::Tensor<float, _RANK> S;\n34. };\n```\n\n`Adam` 引入后，由于其在基准测试或实际产品开发中取得了令人深刻的结果，迅速获得了科学界和工业界的关注。由于此，人们在使用梯度下降时，通常将\
  \ `Adam` 视为默认的训练优化器，除了仍在使用的 `RMSProp` 和随机梯度下降之外。\n\n`Adam` 可以看作是 `RMSProp` 和 `Momentum`\
  \ 的结合 [8]：\n\n变量 `t` 代表第 `t` 个 epoch 计数器。`β1` 和 `β1` 是两个通常设置为 `0.9` 和 `0.999` 的超参数。`Adam`\
  \ 的作者建议使用 `0.001` 的学习率。\n\n注意：我们添加了一个微小的正常数 `ε=1e-5` 以增加数值稳定性。\n\n`Adam` 体现了在训练期间自适应学习率的鲁棒算法。\n\
  \n实验：优化器选择\n\n在下一节中，我们将通过不同的优化器配置来模拟这种场景。\n\n模型架构\n\n对于该实验，让我们假设如下 CNN 架构：\n\n![](img/13.5)\n\
  \n图 13.5: 卷积网络\n\n该网络由七层组成，详细如下：\n\n| 层 | 输入 | 输出 | 参数 |\n| :--- | :--- | :--- |\
  \ :--- |\n| 重塑层 | 784 | 28x28x1 | 0 |\n| 卷积 2D | 28x28x1 | 26x26x32 | 288 |\n| 最大池化\
  \ | 26x26x32 | 13x13x32 | 0 |\n| Dropout | 13x13x32 | 13x13x32 | 0 |\n| 展平层 | 13x13x32\
  \ | 5408 | 0 |\n| 全连接层 | 5408 | 128 | 692,224 |\n| Softmax | 128 | 10 | 1000 |\n\
  \n表 13.2: 模型架构\n\n为了实现这个模型，我们可以定义一个 `Model` 类：\n\n```cpp\n1. template <typename\
  \ Device>\n2. class Model {\n4. public:\n6. ...\n8. private:\n9. ReshapeLayer<Device,\
  \ 2, 4> *input_layer;\n10. Conv2DLayer<Device> *conv2d;\n11. MaxPooling<Device>\
  \ *maxpooling;\n12. DropoutLayer<Device, 4, GEN> *dropout;\n13. FlattenLayer<Device,\
  \ 4> *flatten;\n14. DenseLayer<Device> *dense;\n15. SoftmaxCrossEntropyLayer<Device>\
  \ *output_layer;\n17. };\n```\n\n它的构造函数定义如下：\n\n```cpp\n1. Model(Device &device)\
  \ {\n2. const int x_width = 28;\n3. const int x_height = 28;\n5. const int kernel_size\
  \ = 3;\n6. const int filters = 32;\n7. const int channels = 1;\n9. const int hidden_neurons\
  \ = 128;\n10. const int num_classes = 10;\n11. const bool use_bias = true;\n13.\
  \ input_layer = new ReshapeLayer<Device, 2, 4>(device, std::vector<Eigen::Index>{x_width,\
  \ x_height, 1});\n15. Tensor_4D kernels(kernel_size, kernel_size, channels, filters);\n\
  16. glorot_uniform_initializer(rng, kernels);\n17. conv2d = new Conv2DLayer(device,\
  \ kernels, use_bias, new ReLU<Device, 4>(device), std::vector<int>{0, 0, 0, 0});\n\
  19. maxpooling = new MaxPooling(device, 2);\n}\n```\n\n\n\n\n\n```cpp\n21. dropout\
  \ = new DropoutLayer<DEVICE, 4, GEN>(device, 0.2, rng);\n\n23. const int half_width\
  \ = (x_width - kernel_size + 1) / 2;\n\n24. const int half_height = (x_height -\
  \ kernel_size + 1) / 2;\n\n25. const int flatten_size = half_width * half_height\
  \ * filters;\n\n27. flatten = new FlattenLayer<DEVICE, 4>(device);\n\n29. Tensor_2D\
  \ WD(flatten_size, hidden_neurons);\n\n30. glorot_uniform_initializer(rng, WD);\n\
  \n31. dense = new DenseLayer(device, WD, use_bias, new ReLU<Device, 2>(device));\n\
  \n33. Tensor_2D WC(hidden_neurons, num_classes);\n\n34. glorot_uniform_initializer(rng,\
  \ WC);\n\n35. SoftmaxCrossEntropyLayer<Device> * softmax = new SoftmaxCrossEntropyLayer(device,\
  \ WC, use_bias);\n\n36. output_layer = softmax;\n\n38. }\n```\n\n卷积层和全连接层使用 `ReLU`\
  \ 作为激活函数。输出层是一个特殊的自定义全连接层，它使用 `softmax` 作为激活函数并使用交叉熵代价函数计算梯度。\n\n> 注意：在第 10 章 编写反向传播算法”中，我们学习了\
  \ softmax 激活和交叉熵损失的组合可以简化计算，减小计算梯度的计算时间复杂度。\n\n输入层包含一个转换函数，将数据集提供的线性输入重塑为单通道的 28x28\
  \ 网格：\n\n```cpp\n1. input_layer = new ReshapeLayer<Device, 2, 4>(device, std::vector<Eigen::Index>{28,\
  \ 28, 1});\n```\n\n我们可以通过设置每个可训练层来让模型使用动量（Momentum）：\n\n```cpp\n1. void set_momentum()\
  \ {\n\n2. conv2d->set_kernels_optimizer(Momentum<4>());\n\n3. dense->set_weight_optimizer(Momentum<2>());\n\
  \n4. softmax->set_weight_optimizer(Momentum<2>());\n\n5. }\n```\n\n> 注意：即使为每个层设置使用不同类型的优化器没有问题，但通常情况下对所有可训练层使用相同的优化器类型更为常见，也更推荐。\n\
  \n现在，我们可以将 `forward()` 定义为 `Model` 类的方法：\n\n```cpp\n1. void forward(const Eigen::Tensor<float,\
  \ 2> &input) {\n\n2. input_layer->forward(input); \n\n3. conv2d->forward(input_layer->get_output());\
  \ \n\n4. maxpooling->forward(conv2d->get_output()); \n\n5. dropout->forward(maxpooling->get_output());\
  \ \n\n6. flatten->forward(dropout->get_output()); \n\n7. dense->forward(flatten->get_output());\
  \ \n\n8. output_layer->forward(dense->get_output()); \n\n9. }\n```\n\n同样地，我们可以定义\
  \ `backward()`：\n\n```cpp\n1. void backward(const Eigen::Tensor<float, 2> &upstream)\
  \ {\n\n2. output_layer->backward(upstream, true);\n\n3. dense->backward(output_layer->get_downstream(),\
  \ true);\n\n4. flatten->backward(dense->get_downstream(), true);\n\n5. dropout->backward(flatten->get_downstream(),\
  \ true);\n\n6. maxpooling->backward(dropout->get_downstream(), true);\n\n7. conv2d->backward(maxpooling->get_downstream(),\
  \ false);\n\n8. }\n```\n\n同时更新 `update()`：\n\n```cpp\n1. void update(const float\
  \ learning_rate, int epoch) {\n\n2. conv2d->update(learning_rate, epoch);\n\n3.\
  \ dense->update(learning_rate, epoch);\n\n4. output_layer->update(learning_rate,\
  \ epoch);\n\n5. }\n```\n\n> 注意，只有具有可训练参数的层必须调用 `update(…)`。\n\n现在模型已经定义，我们可以使用 MNIST\
  \ 数据集来训练它。与书中之前的示例类似，我们可以使用训练循环来训练此模型，如下所示的训练过程：\n\n```cpp\n1. template <typename\
  \ Device, typename MODEL>\n\n2. void training(MODEL &model, const Tensor_2D &training_images,\
  \ const Tensor_2D &training_labels, \n\n3. const Tensor_2D &validation_images, const\
  \ Tensor_2D &validation_labels, Device &device, \n\n4. const int MAX_EPOCHS, const\
  \ int minibatch_size, const float learning_rate) {\n\n6. CategoricalCrossEntropy\
  \ cost_fn;\n\n8. int epoch = 0;\n\n9. while (epoch < MAX_EPOCHS) {\n\n11. auto begin\
  \ = high_resolution_clock::now();\n\n13. int steps = 0;\n\n15. Batches(rng, minibatch_size,\
  \ &training_images, &training_labels);\n\n17. Batch<2, 2>* batch = batches.next();\n\
  \n19. while (batch) {\n\n21. model.forward(batch->X);\n\n22. model.backward(batch->T);\n\
  \n23. model.update(learning_rate, epoch + 1);\n\n25. batch = batches.next();\n\n\
  26. steps++;\n\n27. }\n\n29. auto end = high_resolution_clock::now();\n\n30. auto\
  \ duration = duration_cast<milliseconds>(end - begin);\n\n32. auto validation_pred\
  \ = model.predict(validation_images);\n\n33. float validation_acc = accuracy(validation_labels,\
  \ validation_pred);\n\n35. float validation_loss = cost_fn.evaluate(validation_labels,\
  \ validation_pred);\n\n36. std::cout << \"epoch:\" << epoch << \"\\t\";\n\n37. <<\
  \ validation_loss << \"\\t\";\n\n38. << validation_acc << \"\\t\";\n\n39. epoch++;\n\
  \n40. }\n```\n\n该函数将训练数据集划分为小批次（mini-batches）。对于每个小批次，`forward()`、`backward()` 和\
  \ `update()` 方法：\n\n```cpp\n1. while (batch) {\n\n3. model.forward(batch->X);\n\n\
  4. model.backward(batch->T);\n\n5. model.update(learning_rate, epoch + 1);\n\n7.\
  \ batch = batches.next();\n\n```\n\n循环次数取决于小批次的大小。在接下来的示例中，我们设置 `minibatch_size\
  \ = 32`：\n\n```cpp\n1. int main(int, char **)\n{\n3. auto [training_images, training_labels,\
  \ validation_images, validation_labels] = load_mnist(\"data/mnist\");\n4. std::cout\
  \ << \"Data loaded!\\n\";\n5. int threads = std::thread::concurrency();\n6. Eigen::ThreadPool\
  \ tp(threads);\n7. Eigen::ThreadPoolDevice device(&tp, threads);\n8. const int MAX_EPOCHS\
  \ = 10;\n9. Model model(device);\n10. model.set_momentum();\n11. training(model,\
  \ training_images, training_labels, validation_images, validation_labels, device,\
  \ MAX_EPOCHS, 32, 0.001);\n12. return 0;\n13. }\n```\n\n运行此配置，我们得到如下所示的结果：\n\n![](img/Figure_13.png)\n\
  \n图 13.6：使用动量训练模型\n\n注意，在此执行中，我们将学习率设置为 0.001 并使用动量。由于权重初始化和随机划分的随机性，每次运行的结果可能会不同。因此，为了对实际性能有信心，我们需要多次运行并在下一节中总结结果。\n\
  \n### 比较不同小批次的模型性能\n\n在机器学习中，我们常说深度学习模型的训练是一门艺术而非确定性的科学。事实证明，机器学习的训练需要调整许多超参数，其中某些相关，另一些则无关。\n\
  \n因此，如何调整超参数主要取决于直觉和经验。本实验旨在深入了解小批次大小、学习率和优化器的选择如何影响训练质量。\n\n### 使用多种小批次配置\n\n在实验的第一部分，我们将使用\
  \ 0.001 的固定学习率和不同的小批次大小：16、512 和 4096。对于每种配置，我们训练模型五并存储平均值：\n\n```cpp\n1. std::vector<int>\
  \ batch_sizes {16, 512, 4096};\n\n3. for (int i = 0; i < 5; ++i) {\n\n5. std::cout\
  \ << \"\\n=== Run #\" << i << \"\\n\\n\";\n\n7. for (int minibatch_size : batch_sizes)\
  \ {\n\n9. Model model(device);\n\n10. model.set_momentum();\n\n12. std::cout <<\
  \ \"minibatch_size:\" << minibatch_size << \"\\n\";\n\n13. training(model, training_images,\
  \ training_labels, validation_images, validation_labels, device, MAX_EPOCHS, minibatch_size,\
  \ 0.001);\n\n14. }\n\n16. }\n```\n\n\n\n\n我们可以使用 RMSProp 重复这个过程：\n\n```cpp\nfor\
  \ (int minibatch_size : batch_sizes) {\n    Model model(device);\n    model.set_rmsprop();\n\
  \    //...\n}\n```\n\n或者，使用 Adam：\n\n```cpp\nfor (int minibatch_size : batch_sizes)\
  \ {\n    Model model(device);\n    model.set_adam();\n    //...\n}\n```\n\n现在，我们可以比较每个优化器的性能。下面的图表显示了结果：\n\
  \n![](img/Figure_13.7.png)\n\n图 13.7：batch size 为 16 的模型训练\n\n当 batch size 为 16\
  \ 时，使用 Adam、`RMSProp` 或 `Momentum` 的性能大致相同。让我们看看当 mini-batch size 增加到 128 时会发生什么：\n\
  \n![](img/Figure_13.8.png)\n\n图 13.8：batch size 为 512 的模型训练\n\n当 mini-batch 为 512\
  \ 时，性能略有不同。将 batch size 增加到 4096 提供了更多证据：\n\n![](img/Figure_13.9.png)\n\n图 13.9：batch\
  \ size 为 4096 的模型训练\n\n图表表明，`Adam` 是不同 mini-batch 配置下的最佳优化器，至少在考虑验证准确率时是这样。事实上，在实验的第一部分，mini-batch\
  \ 的大小对其他模型的影响更为显著。\n\n下一节将展示使用固定 mini-batch size 和不同学习率值训练模型的平均性能。\n\n## 比较不同学习率下的模型性能\n\
  \n在实验的这部分，我们将 minibatch size 固定在 32，并使用不同的学习率训练模型：0.01、0.001 和 0.0001。\n\n```cpp\n\
  std::vector<float> learning_rates {0.01, 0.001, 0.0001};\nfor (int i = 0; i < 5;\
  \ ++i) {\n    std::cout << \"\\n=== Run #\" << i << \"\\n\\n\";\n    for (float\
  \ learning_rate : learning_rates) {\n        Model model(device);\n        model.set_momentum();\n\
  \        std::cout << \"learning_rate: \" << learning_rate << \"\\n\";\n       \
  \ training(model, training_images, training_labels, validation_images, validation_labels,\
  \ device, MAX_EPOCHS, 32, learning_rate);\n    }\n}\n```\n\n我们再次使用 `RMSProp`、`Adam`\
  \ 和不使用优化器重复该过程。下面的图表（图 13.10、图 13.11 和 图 13.12）显示了结果：\n\n![](img/Figure_13.10.png)\n\
  \n图 13.10：使用学习率 0.01 训练模型\n\n![](img/Figure_13.11.png)\n\n图 13.11：使用学习率 0.001 训练模型\n\
  \n![](img/Figure_13.12.png)\n\n图 13.12：使用学习率 0.0001 训练模型\n\n再次，`Adam` 主导了性能，尽管 `Momentum`\
  \ 和 `RMSProp` 也具有竞争力。事实上，图表表明 `Adam` 对学习率和 mini-batch size 的变化更稳健。\n\n值得注意的是，尽管\
  \ `Adam` 在此实验中获得了最佳性能，但我们不能假设 `Adam` 是我们优化器选择。在实践中，我们必须实验检查不同的配置，包括 mini-batch size、学习率、正则化、优化器等，以找到最佳设置。\n\
  \n## 结论\n\n本章介绍了梯度下降算法三个重要的变体：`Momentum`、`RMSProp` 和 `Adam`。我们学到标准的梯度下降在收敛速度方面并不是最优。因此，我们引入了\
  \ `Momentum`（利用惯性减少更新的方向变化）以及 `RMSProp` 和 `Adam`（使用自适应学习率的方法来提高算法收敛性）。\n\n本章结束了我们对主要深度学习算法和组件的概述。接下来的章节将涵盖使用计算机视觉和书中介绍的技术的案例研究。\n\
  \n## 练习题\n\n1. 考虑由下方规则 [10] 描述的 Nesterov 动量 [9]：\n\n![](img/eq813.jpg)\n\n在 `NesterovMomentum`\
  \ 优化器中实现此规则，并与标准的 `Momentum` 优化器进行性能比较。\n\n\n\n\n\n# 表 14.1：章节实验列表\n\n## 计算机视觉\n\
  \n计算机视觉是计算机科学的一个领域，专注于研究和开发获取、处理、分析、存储和生成图像、视频等数字媒体的方法 [1][2]。今天，计算机视觉因如 `DALL-E2`\
  \ 等生成式 AI 系统的成就而闻名 [3]。这些系统能够根据文本自然语言输入自动生成惊叹的图像。请参考下图：\n\n![](img/Figure_14.1.png)\n\
  \n图 14.1：由 DALL-E2 自动生成的图像\n\n尽管近期生成式 AI 的进展确实非常显著，但计算机视觉的发展已经持续了很久。例如，我们可以将旧数码相机中的人脸检测功能视为计算机视觉领域在日常生活中的一个重要里程碑。\n\
  \n本书侧重于利用计算机视觉从图像中分析和提取语义信息，这有时被称为判别式 AI（discriminant AI）。查看下图 [4]：\n\n![](img/Figure_14.2.png)\n\
  \n图 14.2：使用 YOLO v5 检测物体。\n\n在此示例中，一种名为 `YOLO v5` [5] 的算法执行了名为目标检测的任务。在目标检测中，程序寻找图像中语义对象的类型（标签）和边界框坐标。实时进行多标签目标检测是计算机视觉与深度学习成功结合后引入的现代应用之一。\n\
  \n## 计算机视觉应用示例\n\n在深度学习之前，人们开发了多种方法从图像中检测复杂结构。一种流行的替代方案是模板匹配。查看下例示例 [6]：\n\n![](img/Figure_14.3.png)\n\
  \n图 14.3：使用 OpenCV 模板匹配\n\n在此示例中，使用 `OpenCV` 实现的模板匹配检测图像中的人脸。这种方法的问题在于它需要更强的鲁棒性来处理反复出现的图像特征，如噪声、光照干扰、姿态变化、阴影、遮挡等。此时，深度学习派上了用场。\n\
  \n## 在计算机视觉中使用 ML 模型\n\n使用 ML 模型来改进计算机视觉系统的想法一点也不新。到目前为止，在书中我们使用了原生神经网络（vanilla\
  \ neural networks）通过 `MNIST` 数据集执行手写数字识别。虽然多层网络可以执行此特定任务，但我们不能认为 `MNIST` 是真实世界计算机视觉问题的真正示例。我们将列出一些使\
  \ `MNIST` 不同于真实计算机视觉任务的方面：\n\n* 在 `MNIST` 中，每张图像都是 28x28 像素的小网格，与分辨率为 640x480、1920x768\
  \ 更高的真实图像相比，这非常小。\n* 在 `MNIST` 中，每张图像都是灰色的。真实图像是具有三个或更多通道的多通道彩色图像，如 `RGB`、`HSV`\
  \ 或 `CMYK`。\n* 在 `MNIST` 中，每个数字都位于图像中心。在真实图像中，语义对象的姿态和位置各异。\n* 在 `MNIST` 中，物体是 2D\
  \ 手写数字。在真实图像中，物体通常是以 2D 透视表示的 3D 物体。\n* 在 `MNIST` 中，每个标签是十个可能的数字 0-9 之一。某些图像数据集具有\
  \ 80、1000 甚至更多不同的标签。\n\n在实践中，使用旧式神经网络解决现实世界的计算机视觉问题会导致解决方案缓慢，且性能无法达到基本良好。事实上，第一批深度学习模型正是为了解决这些问题而开发的。特别是卷积神经网络，最初是为了执行计算机视觉任务而开发的\
  \ [7]。\n\n## 从计算机视觉的老中学教训\n\n在讨论现代模型之前，让我们先谈谈驱动新技术决策的先前步骤。在这种背景下，计算机视觉旧时代的一个重要教训是：任务可以通过使用特定的应用特征（或标记）来更直接地完成。例如，以下人脸检测器\
  \ [8] 的开发考虑了人脸的拓扑标记物，如眉毛、鼻子、眼睛、脸颊等。\n\n![](img/Figure_14.4.png)\n\n图 14.4：用于检测人脸的第一、二特征（改编自原始\
  \ Viola/Jones 论文）\n\n| 注意：人脸检测是指在图像中寻找人脸。不要将其与人脸识别混淆，人脸识别是为之前检测到的人脸分配标识的任务。 |\n\n\
  在接后的代码中，我们仅使用 `OpenCV` 内置函数检测图像中的人脸：\n\n```cpp\n1. void detect_face(cv::Mat &image,\
