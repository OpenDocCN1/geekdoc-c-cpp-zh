  \n## 在 MNIST 数据集上运行我们的第一个实现](#contents.xhtml_sc3_169a)\n\n正如在第 3 章“测试深度学习代码”中所讨论的，判断一个算法实现是否正确是困难的。为了提供一些指导，建议使用已知的基准训练模型。在我们的情况下，我们将使用\
