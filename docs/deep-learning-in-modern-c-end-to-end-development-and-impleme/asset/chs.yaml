  \n![](img/fm1.png)\n\n# 第 5 章 编写全连接层](#contents.xhtml_ch05a)\n\n## 引言](#contents.xhtml_sc2_67a)\n\
  \n本章介绍了全连接（FC）层，这是任何人工神经网络的核心组件。全连接层是构建 ANN 的第一种方法，对于任何现代深度学习模型仍然至关重要，特别是在定义网络元素方面。在本章中，我们将描述全连接层并学习如何使用它们构建第一种类型的神经网络——多层感知机模型。\n\
  \n## 结构](#contents.xhtml_sc2_68a)\n\n本章的路线图如下：\n\n*   使用人工神经网络的意义\n*   实现我们的第一个神经网络\n\
  *   计算层值\n*   调用激活函数\n*   使用批量进行前传播\n*   使用多维数组作为输入\n\n\n\n\n\n# 张量展平\n\n## 目标\n\
  读完本章后，你将能够使用张量实现全连接层。你还将理解如何使用前向传播算法对神经网络进行计算，并使用 C++ lambda 实现这一操作。\n\n## 使用人工神经网络的意义\n\
  在开始之前，我们应该思考：为什么用神经网络？事实上，机器学习有许多不同的模型类型 [1]，例如决策树、贝叶斯网络、随机森林、支持向量机、遗传算法……当然还有人工神经网络。我们为什么要只讨论后者呢？\n\
  \n这个问题的答案在第 1 章《深度学习编程入门》中已经部分给出。在那里，我们讨论了深度学习在某种程度上是机器学习的一个子集。事实上，尽管机器学习领域研究广泛的不同模型，但深度学习社区主要关注于使用人工神经网络作为基础。这意味着在过去的\
  \ 15 年中开发的许多前沿技术都是传统神经网络模型——多层感知器（`MLP`）的变体——更准确地说，是更深层的扩展。\n\n`MLPs` 基本上是只有全连接层的神经网络。现在让我们更多地了解它们。\n\
  \n## 实现我们的第一个神经网络\n再次考虑我们在第 1 章《深度学习编程入门》中画出的网络示例：\n\n![](img/Figure_5.1.png)\n\n\
  图 5.1：带有全连接层的 4 层神经网络\n\n该网络仅由 `FC` 层组成，也称为 `Dense` 层。我们如何使用像这样的网络来找到给定输入 `X` 的输出？我们使用前向传播，如图所示：[2]\n\
  \n![](img/Figure_5.2.png)\n\n图 5.2：前向传播计算\n\n在前向传播中，我们首先计算输入层的值。然后，我们利用输入层的值获取第二层的值。重复这个过程，直到找到最后一层的值，这被称为输出层。最后，输出层的值就是网络对于给定输入\
  \ `X` 的输出。该流程在如下伪代码中描述：\n\n![](img/Figure_5.3.png)\n\n图 5.3：前向传播伪代码\n\n这段伪代码引入了新元素，例如偏置\
  \ `b` 和激活函数 `act`。我们将在后面讨论这些术语。\n\n## 计算层值\n为了计算输入 `X` 的网络输出，第一步是计算第一层的赋值。输入层 `L0`\
  \ 的值由给出：\n\n![](img/Figure_5.4.png)\n\n图 5.4：评估输入层\n\n该公式基本上是将 `X` 的每个系数分配给输入层中的一个神经元。当然，为了让其生效，`X`\
  \ 中的系数数量必须等于输入层中神经元的数量。\n\n一旦我们用 `X` 填充了输入层，就可以找到后续层的值。让我们将后续层中的一个命名为 `Li`。`Li`\
  \ 中神经元的赋值如下：\n\n![](img/Figure_5.5.png)\n\n图 5.5：评估层 `Li`\n\n其中：\n\n* `Li-1` 是来自上一层神经元的赋值；\n\
  * `Wi` 是表示层 `Li` 和 `Li-1` 之间连接的权重矩阵；以及\n* `b` 是偏置数组。\n\n操作 `×` 是传统的矩阵乘法，而 `act()`\
  \ 是一个激活函数。\n\n## 调用激活函数\n到目前为止，我们在书中已经看到了激活函数的以下示例 [3]：\n\n```cpp\n1. float sigmoid(float\
  \ z) {\n2. float result;\n3. if (z >= 45.f)\n4. result = 1.f;\n5. else if (z <=\
  \ -45.f)\n6. result = 0.f;\n7. else\n8. result = 1.f / (1.f + exp(-z));\n9. return\
  \ result;\n10. }\n```\n\n该实现仅适用于标量值 `z`。由于我们使用的是张量，必须按照对其对其封装：\n\n```cpp\n1. template\
  \ <typename T, int _RANK >\n2. auto sigmoid_activation(Eigen::Tensor<T, _RANK>&\
  \ Z)\n3. {\n4. auto result = Z.unaryExpr(std::ref(sigmoid));\n5. return result;\n\
  6. }\n```\n\n调用它：\n\n```cpp\n1. int main(int, char **)\n2. {\n4. Eigen::Tensor<float,\
  \ 2> A(2, 3);\n5. A.setRandom();\n7. std::cout << \"A:\\n\\n\"\n8. << A << \"\\\
  n\\n\";\n10. Eigen::Tensor<float, 2> B = sigmoid_activation(A);\n12. std::cout <<\
  \ \"B:\\n\\n\"\n13. << B << \"\\n\\n\";\n15. return 0;\n16. }\n```\n\n注意：我们使用了 `template`\
  \ 来定义 `sigmoid`。在 C++ 中，模板用于定义一组函数。实际的函数将由编译器定义。此程序输出类似的内容：\n\n![](img/Figure_5.6.png)\n\
  \n图 5.6：调用激活\n\n一旦我们准备好激活函数，就可以如下计算层输出：\n\n```cpp\n1. Eigen::Tensor<float, 1> calc_layer(const\
  \ Eigen::Tensor<float, 1>& input, \n                                       const\
  \ Eigen::Tensor<float, 2>& weights, \n                                       const\
  \ Eigen::Tensor<float, 1>& bias) {\n2. std::array<Eigen::Index, 2> dims = {0, 0};\n\
  3. Eigen::Tensor<float, 1> prod = input.contract(weights, dims);\n4. Eigen::Tensor<float,\
  \ 1> Z = prod + bias;\n5. auto result = sigmoid_activation(Z);\n6. return result;\n\
  }\n```\n\n注意使用的是 `Eigen::Tensor` 而不是 `Eigen::Matrix`。根据文档，`contract()` 方法是矩阵乘法的推广。`bias`\
  \ 是用于计算结果的标量向量。\n\n```cpp\n1. int main(int, char **)\n2. {\n4. Eigen::Tensor<float,\
  \ 2> X(2, 3);\n5. X.setRandom();\n6. Eigen::Tensor<float, 2> W(2, 3);\n7. W.setRandom();\n\
  8. Eigen::Tensor<float, 1> B(3);\n9. B.setRandom();\n10. std::cout << \"X:\\n\\\
  n\"\n11. << X << \"\\n\\n\";\n12. std::cout << \"W:\\n\\n\"\n13. << W << \"\\n\\\
  n\";\n14. std::cout << \"B:\\n\\n\"\n15. << B << \"\\n\\n\";\n16. Eigen::Tensor<float,\
  \ 2> R = calc_layer(X, W, B); // 示例逻辑\n17. std::cout << \"R:\\n\\n\"\n18. << R <<\
  \ \"\\n\\n\";\n19. return 0;\n20. }\n```\n\n此程序产生如下输出：\n\n![](img/Figure_5.7.png)\n\
  \n图 5.7：全连接层输出\n\n该实现是我们第一次尝试编写全连接层。它局限于 1 维输入。也就是说，`calc_layer()` 仅适用于向量输入。在实际程序中，我们需要一次计算多个实例的输出，这种技术被称为批量处理。\n\
  \n##在上一个示例中，我们对单个实例进行了评估。如果我们有五个不同的实例需要计算会怎样？当然，另一种方法是执行五次 `calc_layer()` 调用：\n\n\
  ![](img/Figure_5.8.png)\n\n图 5.8：顺序前向调用\n\n这种方法的问题在于我们没有利用大部分底层计算资源。事实证明，现在的硬件具有额外的寄存器，允许我们对顺序数据运行并行计算，这种技术通常被称为向量化。\n\
  \n| 提示：向量化在第 1 章《深度学习编程入门》中曾简要介绍过。 |\n\n因此，与其顺序多次调用，不如使用批量乘法来获得更好的结果，如下：\n\n![](img/Figure_5.9.png)\n\
  \n图 5.9：批量前向调用\n\n\n\n\n值得注意的是，由于 `bias` 是一个 1D 向量，我们需要对其进行广播（broadcast），以便将其加到\
  \ batch 中的每个实例：\n\n![](img/Figure_5.10.png)\n\n图 5.10：广播偏置\n\n这并不是我们编写全连接层的最后尝试。在完成之前，我们需要考虑输入为多维张量的情况。这将在下一节中介绍。\n\
  \n### 使用多维数组作为输入\n\n考虑我们使用一个 3 阶张量作为全连接层的输入的情况：\n\n![](img/Figure_5.11.png)\n\n\
  图 5.11：多维输入\n\n由于它不是一个 2D 网格，我们不能像在上一个案例那样直接使用传统的矩阵乘法。这里的解决方案是使用 `reshape` 将多维 batch\
  \ 转换为 2D 网格，同时保持输入张量的最后一个维度不变：\n\n![](img/Figure_5.12.png)\n\n图 5.12：将 n 阶输入转换为\
  \ 2 阶张量\n\n现在，输入是一个 2D 张量，最后我们终于再次可以使用它进行传统的矩阵乘法。该算法实现在以下模板中：\n\n```cpp\ntemplate\
  \ <typename T, int _RANK>\nclass Dense\n{\npublic:\n  Dense(Eigen::Tensor<T, 2>\
  \ _weights,\n        Eigen::Tensor<T, 1> _bias,\n        std::function<Eigen::Tensor<T,\
  \ 2>(const Eigen::Tensor<T, 2> &)> _activation):\n    weights(std::move(_weights)),\n\
  \    bias(std::move(_bias)),\n    activation(_activation) {}\n  virtual ~Dense()\
  \ {}\n  virtual Eigen::Tensor<T, _RANK>\n  evaluate(const Eigen::Tensor<T, _RANK>\
  \ &input)\n  {\n    const auto input_dims = input.dimensions();\n    const auto\
  \ weight_dims = this->weights.dimensions();\n    const int instance_size = input_dims[_RANK\
  \ - 1];\n    const int output_size = weight_dims[1];\n\n    // 执行一些运行时检查\n    if\
  \ (instance_size != weight_dims[0])\n      throw std::invalid_argument(\"input size\
  \ does not match the shape of the weight matrix\");\n\n    if (this->bias.dimension(0)\
  \ != output_size)\n      throw std::invalid_argument(\"bias size does not match\
  \ the shape of the weight matrix\");\n\n    int instances = input.size() / instance_size;\n\
  \n    // 将输入张量的秩调整为二\n    Eigen::array<long long int, 2> new_dim({instances, instance_size});\n\
  \    Eigen::Tensor<T, 2> reshaped = input.reshape(new_dim);\n    Eigen::array<Eigen::IndexPair<int>,\
  \ 1> contract_dims = {Eigen::IndexPair<int>(1, 0)};\n    Eigen::Tensor<T, 2> prod\
  \ = reshaped.contract(weights, contract_dims);\n\n    // 广播偏置以匹配输出维度\n    Eigen::array<long\
  \ long int, 2> bias_new_dim({1, output_size});\n    auto bias_reshaped = this->bias.reshape(bias_new_dim);\n\
  \    Eigen::array<long long int, 2> bias_bcast({instances, 1});\n    Eigen::Tensor<T,\
  \ 2> bias_broadcast = bias_reshaped.broadcast(bias_bcast);\n\n    // 相偏置\n    auto\
  \ Z = prod + bias_broadcast;\n\n    // 应用激活函数\n    auto output = this->activation(Z);\n\
  \n    // 将输出重塑为正确的 RANK\n    auto result_dims = input_dims;\n    result_dims[_RANK\
  \ - 1] = output_size;\n    auto result = output.reshape(result_dims);\n    return\
  \ result;\n  }\n  virtual Eigen::Tensor<T, _RANK>\n  operator()(const Eigen::Tensor<T,\
  \ _RANK> &input)\n  {\n    return this->evaluate(input);\n  }\nprivate:\n  Eigen::Tensor<T,\
  \ 2> weights;\n  Eigen::Tensor<T, 1> bias;\n  std::function<Eigen::Tensor<T, 2>(const\
  \ Eigen::Tensor<T, 2>)> activation;\n};\n```\n\n让我们突出这段代码的部分部分。在这里，我们将原始输入重塑以适应\
  \ 2D 张量：\n\n```cpp\nconst int instance_size = input_dims[_RANK - 1];\nint instances\
  \ = input.size() / instance_size;\nEigen::array<long long int, 2> new_dim({instances,\
  \ instance_size});\nEigen::Tensor<T, 2> reshaped = input.reshape(new_dim);\n```\n\
  \n这是将输出张量重塑以适应原始秩的代码：\n\n```cpp\nauto result_dims = input_dims;\nresult_dims[_RANK\
  \ - 1] = output_size;\nauto result = output.reshape(result_dims);\n```\n\n注意，我们再次广播了偏置以适应\
  \ 2D 网格布局：\n\n```cpp\nEigen::array<long long int, 2> bias_new_dim({1, output_size});\n\
  auto bias_reshaped = this->bias.reshape(bias_new_dim);\nEigen::array<long long int,\
  \ 2> bias_bcast({instances, 1});\nEigen::Tensor<T, 2> bias_broadcast = bias_reshaped.broadcast(bias_bcast);\n\
  ```\n\n\n\n全连接层在现代神经网络架构中随处可见，通常位于卷积层之后。由于卷积输出的是网格，因此需要进行某些转换。这种转换通常被称为 `flatten`\
  \ [4]，如图：\n\n![](img/Figure_5.15.png)\n\n图 5.15: 2D 张量的扁坦化\n\nFlatten 基本上是重塑了输入：\n\
  \n```\ntemplate <typename T, int _RANK>\nauto flatten(const Eigen::Tensor<T, _RANK>\
  \ &input) {\n  const auto input_dims = input.dimensions();\n  const int batch_size\
  \ = input_dims[0];\n  int instance_size = input.size() / batch_size;\n  Eigen::array<long\
  \ long int, 2> new_dim({batch_size, instance_size});\n  Eigen::Tensor<T, 2> result\
  \ = input.reshape(new_dim);\n  return result;\n}\n```\n\n`flatten()` 将多维网格转换为线性网格。注意，该操作将第一维度视为批大小（batch\
  \ size），对其保持不变。查看以下用法示例：\n\n```\nint main(int, char**) {\n  Eigen::Tensor<float,3>\
  \ input(10, 3, 3);\n  input.setRandom();\n  std::cout << \"Intput dimensions are:\
  \ \" << input.dimensions() << \"\\n\\n\";\n  auto output = flatten(input);\n  std::cout\
  \ << \"Output dimensions are: \" << output.dimensions() << \"\\n\\n\";\n  return\
  \ 0;\n}\n```\n\n此代码输出结果如下：\n\n![](img/Figure_5.16.png)\n\n图 5.16: 使用 `flatten` 函数的示例\n\
  \n## 结论](#contents.xhtml_sc2_79a)\n\n在本章中，我们介绍了全连接层，并利用它们构建了我们的第一个神经网络。我们已经看到神经网络是深度学习的核心概念。在类模型中，计算从初始层（输入层）持续到最后一层（输出层）。\n\
  \n我们还学习了如何使用批处理来设置输入，有助于通过向量化实现更好的处理利用率。\n\n在下一章中，我们将学习网络训练算法的基础，实现不同的代价函数，并学习如何使用它们从数据拟拟模型。\n\
  \n## 习题](#contents.xhtml_sc2_80a)\n\n1. 考虑以下 MLP 网络表示：\n\n![](img/Figure_5.17.png)\n\
  \n图 5.17: 习题 1 网络\n\n确定该网络中系数的总数（确保包含偏置）。提示：不要数连接线。请通过数神经元的数量来计算。\n\n2. 再次考虑上一个网络。但这次，输入层不再是\
  \ 12 个神经元，而是原来的 10 倍，即 120 个神经元。同时考虑第一个隐藏层现在有 100 个神经元。计算系数的总数，并将其与上一个问题中找到的数量进行比较。\n\
  \n3. 考虑以下 MLP 网络：\n\n![](img/Figure_5.18.png)\n\n图 5.18: 习题 3 网络\n\n其中，每个权重值用红色标出。假设层使用\
  \ sigmoid 作为激活函数，为输入 `X = [x0, x1, x2, x3] = [5.1, 3.5, 1.4, 0.2]` 计算网络输出 `Y = [y0,\
  \ y1]`。考虑所有偏置值均为零。\n\n## 参考文献](#contents.xhtml_sc2_81a)\n\n[1] Mitchell, Machine\
  \ Learning, McGraw-Hill, 1997.\n\n[2] Haykin, Neural Networks: A Comprehensive Foundation,\
  \ Prentice Hall, 1999.\n\n[3] Bishop, Pattern Recognition and Machine Learning,\
  \ Springer, 2006.\n\n[4] Flatten layer, Keras API, available at [`keras.io/api/layers/reshaping_layers/flatten/`](https://keras.io/api/layers/reshaping_layers/flatten/)\n\
