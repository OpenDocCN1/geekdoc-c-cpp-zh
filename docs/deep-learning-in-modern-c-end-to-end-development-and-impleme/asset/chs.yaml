  \ 演示了任何深度学习算法的关键点：\n\n1. 寻找最佳函数近似的过程通常是一个迭代的、试错的方法。\n2. 对良好近似的搜索可以简化为代价函数最小化的过程（在我们的示例中，我们使用了\
  \ `MSE` 损失函数）。\n3. 搜索的质量取决于离散步长的选择（在我们的示例中为 0.01）。\n\n值得注意的是，这个简单的过程使用了非常贪婪的方法，访问了搜索空间中\
