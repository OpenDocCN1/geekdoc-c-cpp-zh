    去上腺腺素（`战斗或逃跑化学物质`）和多巴胺（`快乐物质`）协同工作，提供能量和专注力。它们共同帮助我们保持警觉、动力，并享受生活中的乐趣。这些刺激性大脑化学物质过量或过少都可能导致截然不同的结果。过量时，它们会导致烦躁性抑郁症，特别是当缺乏足够的血清素来提供镇静平衡时。另一方面，缺乏通常会导致迟钝性抑郁症引起的精神迟钝和身体疲倦。


    稍后我们将详细研究抑郁症的三种亚型，但首先，让我们探索一些我们认为对我们所有人的韧性大脑至关重要的营养素。


    ## 基础营养支持


    我们将营养补充剂视为支持身体自然功能的手段，帮助纠正失衡或补充可能已经耗尽的必需元素。理想情况下，补充剂的使用应该是暂时的，直到完全恢复，然后天然食物来源就能为大脑提供健康和平衡所需的营养。


    有几种营养素为所有类型的抑郁症提供基础性支持。我们建议每个人在抑郁症恢复期、压力压力时期或饮食不理想时服用以下补充剂。下表概述了最重要的大脑健康营养素，以及尽量降低成本的选择。我们还列出了食物来源，帮助你在恢复韧性后继续维持对这些相同营养素的良好供应。


    所有这些补充剂随餐服用时吸收效果更好，但生菌除外，生菌最好在空腹时服用。


    ![表：补充剂/ 用法/ 低成本替代/ 食物来源，页 1](img/fig4.2.jpg)


    ![表：补充剂/ 用法/ 低成本替代/ 食物来源，页 2](img/fig4.3.jpg)


    上述基础营养本身就可以改善你的情绪，并确保针对每种抑郁症亚型的补充剂或药物有更大的机会发挥作用。现在我们将逐一查看这三种类型，并辅以额外的问卷，帮助你判断自己是否有特定的神经递质失衡。


    ## 焦虑性抑郁


    焦虑性抑郁是目前最常见的抑郁症亚型，已成为我们时代的流行病。血清素水平正受到围困，部分是因为我们压力巨大的生活，但更重要的是，我们应对这些压力的方式让压力荷尔蒙保持在高水平。在等方程式的另一侧，缺乏运动的生活和糟糕的饮食使得产生足够的血清素变得困难。


    血清素过少会导致即使是轻微的压力情况也会使你的情绪暴跌。血清素缺乏的人经常感到不安全，很难融入世界，并可能感到需要退缩或回避，即使是面对朋友。他们有时尝试通过冲动行为（如暴食或饮酒）或参与过度依赖的关系来让自己感觉好受。


    ![图表：低血清素](img/fig4.4.jpg)


    ### 莫莉的故事


    莫莉是一个十九岁的大学生。和很多同龄人一样，她对学业压力和向成年人的过渡感到压力。自从两年前父母离婚，她一直担心母亲的抑郁症。尽管莫莉在学校有朋友，但她感到孤立和退缩：“我知道这听起来很奇怪，但当我和一群在一起时也能感到孤独。”


    莫莉的情绪很低落，但她也感到焦虑和不安全。虽然她的精力很差，但身体和大脑都在不断波动中。她入睡和维持睡眠困难，经常做焦虑或困扰的梦。她感到自己无法处理即使是轻微的压力，比如写论文或参加考试。她的症状在经期前更加严重，那时她也变得异常易怒。


    莫莉有几个血清素低低的迹象。由于她的症状较轻微，我们同意从本章后面讨论的提高血清素的补充剂开始。两周后她感觉好多了，不需要药物治疗。然而，她在经期前的一周仍然存在问题，因此我们让她在每个月的那几天增加
    `5-HTP` 和 `vitamin B6` 的剂量。此后，她的经前综合征（PMS）症状改善了 80%。


    ### 你是否有血清素缺乏？


    勾选以下所有描述你目前状态（最近几天或几周）的陈述：


    *   我的情绪是焦虑或易怒的。

    *   我有失眠症。

    *   我渴望碳水化合物或暴食。

    *   我的能量很不安。

    *   我的大脑过度活跃且容易担心。

    *   我感到不安全感。

    *   我经常很冲动。

    *   我对压力的耐受力低或反应过度。

    *   我对比批评或拒绝非常敏感。

    *   我感到自尊心低。

    *   我倾向于在关系中产生依赖。

    *   我对日照时长的季节性变化敏感（季节性情感障碍，或 SAD）。

    *   我的每月经期面临强烈的情绪挑战（经前综合征）。

    *   我有滥用酒精的问题，或有酗酒家族史。

    *   我有慢性疼痛。


    ### 评分


    相加勾选的项目总数。


    *   1–5 分：轻度血清素缺乏

    *   6–10 分：中度血清素缺乏

    *   11–15 分：严重血清素缺乏


    记住，这并不代表**你本人**。它只是描述你此时此刻的状态，你可以通过后续的镇静补充方案来支持你的大脑化学，并遵循所有通往快乐的路径来改变它。


    ## 平静焦虑性抑郁的自然疗法


    如果你有轻至中度的焦虑性抑郁症状，特别是如果你看起来有血清素缺乏，你可能会发现增加以下一种或多种补充剂会有帮助。它们大致按效用顺序排列，因此请从第一种补充剂开始，仅在几周后还没有感觉好转时才添加其他的。


    `5-HTP`（5-羟色氨酸）：从每天两次 `50 mg` 开始（空腹服用）。如果没有反应，可以每三四天增加 `50 mg` 剂量，每天最高 `300 mg`。


    色氨酸是一种存在于食物中的氨基酸，它会首先转化为 `5-HTP`，然后转化为血清素。色氨酸和 `5-HTP` 都能提高大脑中的血清素水平（Nadia 等，2011），改善情绪、睡眠和记忆（Silber
    和 Schmitt，2010）。由于色氨酸更有镇静作用，主要用于睡眠，而 `5-HTP` 可能是轻微兴奋或镇静的。


    最好在空腹时服用 `5-HTP`，即饭前 30 分钟或饭后几小时。如果它引起轻微恶心或头痛，可以随餐服用。必须有足够的 B 族维生素（尤其是 `B6`）、镁和维生素
    C 来帮助辅助血清素的产生过程，因此要保持基础营养充足。


    **注意，在没有医疗指导的情况下，不要将 `5-HTP` 与抗抑郁药物一起服用。血清素过量是非常危险的。血清素过多的迹象包括出汗、肌肉痉挛、烦躁或坐立不安。**


    贯圣约翰：每次 `300 mg`，每天两次或三次随餐服用（每两到三周增加 `300 mg`，每天最高 `1,500 mg`）。它应标准化为 0.3% 的金丝提取物或
    5% 的贯叶素。


