    在整个工作本中，你将发现冥想、引导想象和其他练习，这些练习随着你练习的增加而变得越来越有效。书面说明将为你提供进行练习所需的一切，但你可能会发现通过音频版本的说明来引导自己会很有帮助。如果你希望通过这种方式获得额外的支持，请访问
    [www.partnersinresilience.com](http://www.partnersinresilience.com)，你可以在那里下载练习，还能找到录制的讲座、课程以及与其他资源的链接。


    ## 第一章总结


    *   喜悦的路径旨在是流动且整合的，每一条路径都连接并支持后一条，相互关联且相互依赖。

    *   这段旅程是灵活的，可以根据自己的需求进行调整。你可以将精力集中在最需要关注的技能上，并重新回到你曾偏离的路径以加强它们。

    *   九条喜悦之路是一项终身的追求，它能增强韧性并开启喜悦之门。


    # 第二章


    ### 开始：连接你的源泉


    > *没有人可以回到过去重新开始，但任何人都可以从今天开始，创造一个新的结局。*

    > —— 马里亚·罗宾森 (Maria Robinson)


    你可能对自己能多大改变生活以变得更加快乐感到怀疑。你可能认为这对别人是可能的，但对你不是。也许你早期创造新开始的尝试将你带回了同样的老旧困境。也许尝试一个新开始甚至变得太困难了。我们想向你保证，你`可以`创造新的生活，而且你可以从今天开始。


    你将学习的改变过程涉及你的整个全人。这是因为这个程序建立在身体、心灵和心灵变化的协同结合之上，这个过程尊重了你作为一个复杂的人的所有方面。即使这种方法对其他人没有用，这种“全人”的方法也可以对你有效。


    ## 全人改变过程


    全人改变是一个深层次的改变过程，其核心包含几项原则。


    全人改变建立在彻底的自我接纳的基础上。这不仅仅是另一个自我提升项目。它的起点是接受你自己和你的生活，就像它们此时此刻的样子。这与通常的方法背道而驰，通常的方法根植于自我批判和对“更好的自我”的追求。我们谈论的不是一种消极或无奈的接纳状态，而是一种充满活力且前瞻性的状态。`Arugamama`
    是一个日语单词，捕捉了这种动态的张力。它是对你自己和生活此时此刻的无条件接纳状态，但同时具有以积极方式行动以创造变化的意图。正如佛教导师铃木老师（Suzuki-roshi）幽默地所说：“你们每一个人按照现在的样子都是完美的……而你确实需要一点改进。”


