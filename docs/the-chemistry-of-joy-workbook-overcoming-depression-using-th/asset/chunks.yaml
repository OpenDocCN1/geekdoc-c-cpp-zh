- fmt: "\nWinter and early spring are also the times when seasonal depression occurs,\
    \ and it usually shows up as sluggish depression. Keeping your earth energy balanced\
    \ may help you avoid this. In addition to all the other recommendations, you may\
    \ want to add bright-light therapy. The idea is to trick your body into thinking\
    \ that the days are longer, with an earlier sunrise and a later sunset. So you\
    \ want to use the light early and/or late in the day. Since most people have a\
    \ hard time getting up in the morning, the most important time for light exposure\
    \ is between 7:00 and 9:00 a.m. If you find that you become really sleepy and\
    \ sluggish in the evening, you may also want to use your light for twenty to thirty\
    \ minutes in the late afternoon (between 5:00 and 7:00 p.m.). For more details\
    \ about proper use of light therapy, and for information about recommended products,\
    \ go to [www.partnersinresilience.com](http://www.partnersinresilience.com).\n\
    \n## Take Action: Create Your Energizing Tool Kit\n\nHere are a few simple, self-nurturing\
    \ activities you can take to calm yourself whenever you notice that you are becoming\
    \ more sluggish. Choose a few favorites so that you can take quick action to bring\
    \ yourself back into balance, and add to the list in the space that follows:\n\
    \n*   Enjoy time in nature, soaking up the sun, sights, and sounds.\n*   Go for\
    \ a brisk fifteen- to twenty-minute walk.\n*   Drink a warm cup of green or black\
    \ tea, or an herbal tea with ginger or ginseng.\n*   Snack on low-fat cheese,\
    \ nuts, or other high-protein foods.\n*   Enjoy an action-packed or dramatic book\
    \ or movie.\n*   Laugh with a good comedy, a book, or an amusing friend—or just\
    \ laugh.\n*   Take a warm shower or bath.\n*   Go dancing with friends.\n*   Listen\
    \ to some lively, energetic music.\n*   Get a vigorous massage.\n*   Go to an\
    \ aerobics or heated yoga class.\n*   Do five to ten minutes of the energizing\
    \ breath or right-nostril breathing.\n*   Take time for prayer or meditation.\n\
    *   ___________\n*   ___________\n*   ___________\n*   ___________\n*   ___________\n\
    \n## Summing Up Chapter 5\n\n*   We are made differently from one another, and\
    \ we feel and function best when we live according to our own nature.\n*   According\
    \ to ayurveda, there are three different energies that combine in varying degrees\
    \ to make up your mind-body constitution. That remains with you throughout your\
    \ life, but temporary imbalances in those energies throw you off so that you no\
    \ longer feel like yourself. At first, that causes discomfort, but if it is allowed\
    \ to go on, it can cause illness.\n*   By understanding your mind-body type and\
    \ noticing early signs of imbalance, you can use diet and lifestyle to restore\
    \ balance and prevent disease.\n*   Maintaining balance is a never-ending dance.\
    \ You can’t be perfect, but you can start by making healthy diet and lifestyle\
    \ choices at least 51 percent of the time!\n\n# Part 3: The Mind Pathways\n\n\
    ## Chapter 6\n\n![Symbol for Settling](Images/fig1.4.jpg)\n\n# Settling: Take\
    \ the Mindful Path to a Calm Mind\n\n> *We can teach our minds to be calm and\
    \ balanced; within this calmness is a richness and a potential, an inner knowledge\
    \ which can render our lives boundlessly satisfying and meaningful. While the\
    \ mind may be what traps us in unhealthy patterns of stress and imbalance, it\
    \ is also the mind which can free us.*\n> — Tarthang Tulku\n\nIn the rush of daily\
    \ life, in the noise of the world around and the monologue inside, the spacious\
    \ clarity and energy of the natural mind are often lost to us. Settling the mind,\
    \ being grounded in the present, allows you to work more skillfully with the thoughts,\
    \ emotions, and experiences of life.\n\n“My mind is so chaotic I can’t even hear\
    \ myself think,” Alexandra said when we first met. She was a successful corporate\
    \ executive with a high-pressure job, a twenty-year marriage, and two children.\
    \ Several years before we met, she had lost her job in a corporate takeover and\
    \ had been unemployed for over a year. Though she eventually landed a new job,\
    \ she had, in the meantime, fallen into a major depressive episode of the anxious\
    \ type. Antidepressant and antianxiety medications had been helpful for a brief\
    \ period of time, but the side effects were now creating more distress than relief.\
    \ Her best default strategy was to work harder, run ultra-marathons, and overcommit\
    \ in her personal life. In that way she silenced her ruminating mind, at least\
    \ during her daytime hours. Sleep eluded her, because whenever she slowed down\
    \ and began to get in touch with thoughts or feelings, she felt overwhelmed and\
    \ out of control. As she drove herself to exhaustion, the depression only intensified,\
    \ and was now threatening her work and even her marriage. Her strategies just\
    \ were not working.\n\nWe encouraged Alexandra to begin her inward journey with\
    \ an effort to settle her mind. We introduced her to the concept of “monkey mind,”\
    \ an ancient Buddhist metaphor likening the unsettled mind to a troop of monkeys,\
    \ shrieking and swinging wildly from branch to branch, always on the move. Unable\
    \ to settle her mind’s chaotic workings, Alexandra could not see clearly just\
    \ how her strategies for coping with life were creating much of her suffering,\
    \ feeding depression, and draining her resilience.\n\n## Just a Minute Meditation\n\
    \nEarly in our work with Alexandra, we introduced the idea of the Just a Minute\
    \ Meditation. This first step toward quieting the mind is simple, yet brings remarkable\
    \ results. Here’s how it is done, and we invite you to do it right now.\n\n* \
    \  Quiet your body and get comfortable, relaxing your body as much as you can.\
    \ Close your eyes, if you wish, or simply soften your gaze and focus on the floor\
    \ in front of you. This is a minute to completely rest.\n*   Take this minute\
    \ to simply breathe naturally, at whatever pace and depth your breath is moving\
    \ at. Place your attention consciously on each breath, following it from beginning\
    \ to end of the cycle of inhaling and exhaling. Allow your breathing to pause\
    \ a bit at the end of the exhalation, and allow your breath to begin the inhalation\
    \ on its own. You might choose to count the breaths to help focus your attention.\n\
    *   If your mind wanders, simply bring it back to counting your breaths or sensing\
    \ the movement of the breath in your body.\n\n### Reflection\n\nTake some time\
    \ to reflect on this simple experience by answering these questions.\n\n*   What\
    \ physical sensations were you most aware of? Where in your body did you most\
    \ feel your breath?\n    ___________\n    ___________\n*   How would you describe\
    \ the qualities of your breath—the pace, depth, rhythm? Was it relaxed, constricted,\
    \ rushed?\n    ___________\n    ___________\n*   What did you notice about your\
    \ thoughts? Was your mind busy, quiet, agitated, still? How was it to catch your\
    \ mind thinking and return to the breath?\n    ___________\n    ___________\n\n\
    There is no right answer to any of these questions, of course. The whole point\
    \ is simply to pause and to shift focus from the thinking mind to the breathing\
    \ body. When you focus on the breath, your central nervous system automatically\
    \ quiets down, your mind begins to settle, and the body relaxes. This activates\
    \ your natural healing potential.\n\n## The Psychology of Mindfulness\n\nAs Alexandra’s\
    \ mind began to quiet down, we introduced her to the *psych of mindfulness*, a\
    \ term we use to describe our approach to healing and transformation of suffering,\
    \ which is based in Buddhist psychology and mindfulness practices.\n\n### Suffering\
    \ and the Unsettled Mind\n"
