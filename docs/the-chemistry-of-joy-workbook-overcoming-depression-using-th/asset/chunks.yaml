    sauce and an apple. Debra noted that she was usually extremely hungry by late
    afternoon and early evening, when she arrived home from work. She frequently had
    crackers and a glass of wine while making dinner at around 7:00 p.m. “Usually
    I do so well during the day, and then I really crave foods, especially carbs,
    in the evening.”*


    *She began her recovery by including a protein-rich breakfast. She was sugar sensitive,
    so she needed to eat smaller, more frequent meals throughout the day. We suggested
    that she add protein to lunch, and identified a late-afternoon “mini-meal” that
    would blunt the effect of the energy slump and evening cravings for sugar.*


    *Four weeks later, when Debra returned for a follow-up, she reported doing very
    well and proclaimed: “My mood swings have all but disappeared—and I’ve lost five
    pounds!” She was able to reduce the caffeine and sugar she depended upon for energy.
    “I couldn’t believe how well it worked. I feel so balanced and light.”*


    Assessing Your Glucose-Insulin Balance


    Place a check mark next to all of the items that apply to you:


    *   I get headaches that are helped by eating.


    *   I feel impatient or angry between meals.


    *   I crave sweets.


    *   Once I eat sweets, I can’t seem to stop.


    *   I crash in the afternoon.


    *   I eat something sweet in the afternoon.


    *   I skip breakfast regularly.


    *   I sometimes skip lunch.


    *   I eat bagels, cereal, or pastries for breakfast.


    *   I have difficulty concentrating.


    *   I have panic attacks.


    *   I have a family history of diabetes.


    *   I have a family history of alcohol dependence.


    *   I have a family history of obesity.


    *   I feel shaky or faint when I don’t eat frequently.*


    *   I feel tired most of the time.


    *   I feel sleepy after I eat a carbohydrate-rich meal.


    *   I am especially hungry in the evening.


    *   I can’t seem to lose weight no matter what I do.


    *   I have a diagnosis of ADD or ADHD.*


    *   I have diabetes.*


    *   I am alcohol dependent.*


    *   I am obese.*


    If you checked fewer than three boxes, follow the general recommendations listed
    below. If you checked three or more boxes or if you placed a check mark next to
    *any* of the issues with an asterisk, include the supplements listed to improve
    insulin and glucose balance.


    Strategies for Improving Glucose-Insulin Balance


    Balancing blood sugar and correcting insulin resistance are among the most effective
    dietary strategies for influencing mood. It is possible to regain the correct
    balance of insulin and glucose, and thereby lift your mood and energy by what
    you eat.


    GENERAL RECOMMENDATIONS


    *   Eat every three to four hours, for example, 7:30 a.m., 11:30 a.m., 3:30 p.m.,
    6:30 p.m.


    *   Never skip a meal or a snack, even if you are not that hungry. Nibble on something
    small just to assure a steady flow of energy and avoid a blood sugar crash.


    *   Favor complex carbohydrates that are also high-fiber foods; they take longer
    to be broken down into simple sugars.


    *   Never eat grain by itself; always eat grains with protein and fat. For instance,
    if you are having a piece of toast, have an egg or put almond butter on the toast.


    FOODS TO INCLUDE


    *   High-fiber, complex carbohydrates; fruits, vegetables, legumes, and whole
    grains promote slower delivery of glucose.


    *   Quality protein and fats with each meal; they slow the delivery of glucose
    and help avoid spikes in insulin.


    *   Monounsaturated fats, such as olive oil, slow things down as well.


    *   One-fourth to half a teaspoon of cinnamon daily helps increase insulin sensitivity
    (Qin, Panickar, and Anderson 2010).


    FOODS TO REDUCE OR AVOID


    *   Simple carbohydrates and highly refined and processed foods such as white
    breads and pastries, white pastas, white potatoes, and candy.


    *   Alcohol, which is a concentrated sugar.


    *   Diet soda; artificial sweeteners cause an unhealthy insulin response (Nettleton
    et al. 2009).


    *   Avoid high-fructose corn syrup; it causes sugar cravings because it fails
    to give you a signal (via a chemical messenger called leptin) that you are full
    (Bray, Nielson, and Popkin 2004).


    SUPPLEMENTS FOR INSULIN-GLUCOSE BALANCE


    *   Magnesium: 500 mg daily


    *   Fish oil: 1,000 mg daily


    *   Alpha lipoic acid: 500 mg daily (improves insulin sensitivity)


    *   Chromium picolinate: 200 mcg twice daily (helps curb cravings)


    ## Roadblock Three: Faulty Digestion


    The job of the digestive system is to break food down into smaller substances
    that can then be absorbed into the body. Vitamins, minerals, and other compounds
    are “liberated” during digestion, making them available to do their jobs. Unfortunately,
    many people are at risk for nutrient deficiencies—even if they eat the right foods—because
    their poor digestion doesn’t allow the release and absorption of key nutrients.


    Poor digestion has several impacts on health and mood:


    Impaired immunity: The immune system—70 percent of which resides in the gut—functions
    poorly when digestion is faulty. Also, stomach acid is necessary to destroy microbes.


    Nutrient deficiencies: When stomach acid is low (for example, from acid-reducing
    medications or chronic stress), it can affect the breakdown of protein and B vitamins
    needed to make neurotransmitters.


    Inflammation: Faulty digestion creates messengers of inflammation, resulting in
    bodily pain and ineffective brain-chemical production.


    * * *


    The intestinal lining has a layer of cells that acts as a barrier, preventing
    bacteria from entering the bloodstream through the intestine. But if these cells
    weaken from exposure to toxins or from poor diet, the barrier becomes permeable,
    allowing bacteria to leak through the intestinal wall and create an inflammatory
    response. This may cause symptoms such as fatigue or a general sense of being
    unwell. It has also been linked to major depression. A 2008 study found that the
    prevalence of “leaky gut” was significantly higher in those with major depression
    than in healthy volunteers. It is recommended that patients with major depression
    be checked and, if necessary, treated for intestinal permeability (Maes, Kubera,
    and Leunis 2008).


    * * *


    *Todd’s Story*


    *Todd’s mood was deteriorating rapidly, and he felt increasingly anxious. His
    digestion was interfering with all aspects of his life: “I am so busy; I don’t
    have time for this digestive stuff. I can’t even exercise.” He had lost his appetite
    because when he ate, he developed painful acid reflux or heartburn.*


    *Todd had been diagnosed with GERD (gastrointestinal reflux disease) two years
    before and started taking Prilosec (omeprazole), an acid-reducing medication,
    which was gradually being increased due to his lack of response.*'
