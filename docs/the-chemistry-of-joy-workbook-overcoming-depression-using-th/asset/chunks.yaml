  trans: '


    敞纳你所有的的情绪对于从抑郁症中恢复和预防它也至关重要。当你处理困难情绪变得越来越熟练时，你将获得信心，相信这些情绪并不总是导致另一次抑郁发作。当你开始信任自己和自己的情绪时，你能够将正常的“忧郁情绪”与那些可能真正让你陷入抑郁的状态区分开来。这样，你就能及早采取行动，防止这种情况的发生。


    # 在开放模式下生活


    回到凯瑟琳（Kathryn）和约翰（John）的故事，让我们想象一下，如果他们对自己的情绪保持正念的开放，而不是固执于或抵触，他们的经历会是什么样的。


    ## 重新回顾凯瑟琳和约翰的故事


    在听到父亲的消息后，约翰注意到震惊和恐惧的感觉流遍全身。他告诉自己这是正常的，他可以处理。他为这些感受命名，并深呼吸几次以平复心情，然后用充满关怀的话语和提供帮助的意愿回复父亲。他倾听父亲的需求，并和父亲一起制定了一个行动计划：他会通知其他兄弟姐妹，并会给一位肿瘤科朋友打电话，帮助他们都更清楚地了解情况。他能够提问并敏锐地倾听父亲，父亲表达了感谢。约翰挂掉电话，感到离父亲很近，并为能上忙感到高兴。他意识到自己不仅感到恐惧，还为已经过过艰难生活的父亲还要遭受更多痛苦感到难伤。他意识到自己脆弱，在下次体检时应该检查`PSA`。一种对自己死亡的焦虑油然而生，他注意到了这一点，但重新专注于当下。他考虑过给姐姐凯瑟琳发`e-mail`，但还是拿起电话，因为他想和她分享感受，并知道分享这一时刻对他们两人都是一种安慰。


    他是对。凯瑟琳拿起电话，听到消息时感受到了同样的震惊和恐惧的身体感觉。泪水涌上眼眶，喉咙收紧。她记录下所有这些感受，深呼吸几次，提醒自己只需处于当下，听听约翰的话，让逻辑思维运作，以便她准确理解发生了什么。凯瑟琳能够让约翰知道她的感受，并询问他的情况。当他们分享这一时刻时，凯瑟琳和约翰都感到彼此相互联系并支持，感激他们能共同分享这一切。尽管仍然感到焦虑和悲伤，但他们都感到有些轻松，开始了新的一天。凯瑟琳和父母谈了这件事，然后重新安排了自己的工作截止日期，以便和他们待上一两天。她泡了一杯茶静静地坐着，让所有的感受简单地在意识中浮现、停留，并在自我安慰中消散。她的情绪留下了一些痕迹，她知道这些痕迹将伴随她剩下的一天，但它们是可以控的。当孩子们回家时，她能够与他们在一起，倾听他们的消息，感受他们青春活力和兴奋带给她的喜悦和安慰。


    约翰给妻子打电话，简要分享了消息，他们计划在他们喜欢的餐厅一起吃晚餐。用餐期间，他分享了消息的细节以及他自己的感受。她感到被包容并建立了联系，也能分享自己的感受。在交谈中，他们都感受到了悲伤和恐惧。约翰分享了对抑郁复发的担忧，她向他保证自己会关注并支持他。他们离开家，对彼此的爱和家庭根源深表感激。那天晚些时候，他们看着快乐的孩子在喷头间奔跑，与邻居分享当天的经历。他们看到周围到处都是善意，即使在这样的日子里也感到喜悦。


    在第二种方案中，约翰和凯瑟琳学会了正念地关注自己的情绪，没有陷入隔绝、抵触、固执或被情绪淹没的倾向中。他们能够在情绪产生时保持开放，为它们命名，并充分体验它们，让其自然流动。然而，通过熟练地面对自己的感受（无论这种感受多么痛苦），他们也能感受到连接的温暖慰藉和当天的喜悦。他们感到有能力走向未来，无论未来会带来什么。


    # 体验情绪的完整周期


    这种情感韧性始于正念地开放你的情绪体验，并顺应日常生活中情绪的自然起伏。当你培养出对情感完整周期的正念能力时，即使是极其痛苦的情绪也会更容易被。事实上，你会发现，带着正念——不评判且友善接受——充分体验一种情绪的周期可能是一种缓解，一种宣泄。


    如果你正处于严重抑郁症发作期，这种充分体验痛苦感受的想法可能会让你感到恐惧，最好等到这种发作的强度减轻后再开始。尽管如此，向日常微小情绪起伏的自然流动开放是安全的。随着你的情绪舒适区扩大，你将为未来到来的强烈情绪获得信心，并对生活更加专注和投入其中。


    在接下来的冥想中，从情绪反应模式练习中选择一个你经常回避或让你感到有些不知所措的情绪。不要选择最极端或最崩溃的情绪——只需一个普通的日常情绪即可。选择一个对你来说有些波动但又不是太强的。


    ## 引导冥想：感知身体中的情绪


    *   舒适地坐在椅子上或垫子上，调整身体姿势，处于一种警觉但放松的状态。

    *   通过有意识地关注呼吸的完整周期让自己放松几分钟，注意腹部的起伏或空气进入和离开鼻腔的感觉。在冥想的任何时候，如果你发现自己被浮出的情绪感受所淹没，可以回到简单的呼吸上，作为锚点。记得在探索体验时，使用正念、不评判的好奇心。

    *   当你准备就绪时，回想你所选择的情绪。它可能是挫败感或愤怒、悲伤、恐惧。让记忆回忆这种情绪出现的场景细节：当时的地点、人物、言语或引发这种感受的行动。

    *   当你回想这些细节时，尝试接触身体里的物理感受。情绪通常出现在喉咙到腹股之间。你现在哪里感到它？

    *   注意感受的性质？是热的冷的、紧的还是刺麻的？是轻微还是剧烈的？

    *   这种是在移动，还是在身体某个部位停留？

    *   如果关于情绪的想法或故事进入你的脑海，只需注意到这一点，并注意到这些想法对你身体感受的影响。你可能会发现，随着想法的出现，感受的质量和强度此伏。注意到情绪体验像浪潮一样，扩张又收缩。看看你是否可以简单地顺着浪潮浮，放下想法和故事线，仅仅坐在感受中起伏。

    *   你可能还会注意到情绪本身随着时间的推移而改变。也许你最初感到愤怒，然后它转化为恐惧或悲伤。情感生活的本质是复杂的，有时是多层次的。这一切都值得探索。


