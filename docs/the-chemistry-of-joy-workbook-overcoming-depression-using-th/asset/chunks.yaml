    \ lasts for several hours. They can open your heart.\n\nConnecting through the\
    \ Heart\n\nBuddhist teacher Pema Chödrön offers a beautiful way to think about\
    \ the human heart. She compares it to a sea anemone. The sea anemone has a hole\
    \ at its top, which is open to receive the food that its ocean home provides.\
    \ However, when the anemone is shocked or startled in some way, it automatically\
    \ closes its opening. This protects the tender creature within the shell, but\
    \ also means that it gets no nourishment despite being immersed in it.\n\nIn the\
    \ same way, the human heart can open to receive nurturing in the form of love\
    \ and connection. And it can shut down instinctively in response to a threat or\
    \ scare. It is particularly vulnerable to shutting down when we experience a hurt\
    \ from another person. Although it is natural to move toward self-protection,\
    \ the human heart that is habitually shut down can forget to open up again. The\
    \ following practice encourages you to remember to open.\n\nHeart-Opening Meditation\n\
    \n*   Whether your heart feels wide open or long closed off, it is possible to\
    \ invite openness into it.\n\n*   Begin by sitting quietly in a position that\
    \ supports alertness and allows ease…focus on the rhythmic inhaling and exhaling\
    \ of your breathing.\n\n*   After a few moments, invite your mind to quiet and\
    \ your breath to deepen and slow…gently filling and emptying.\n\n*   Now place\
    \ the palm of one hand over your heart center—on the chest just over the breastbone…focus\
    \ your awareness on that part of you…does it feel tight and hard like a stone…warm\
    \ and open like a sun-filled window…fluttering like a bird…or some other way?\
    \ However you find it, invite your heart to open just a bit, to warm and soften,\
    \ to relax in the warmth of the breath.\n\n*   Stay with this practice for a few\
    \ minutes, just directing the breath to the heart center, inviting feelings of\
    \ warmth deep into the heart…perhaps thinking the words, *welcome, you are welcome\
    \ here*.\n\n*   After a comfortable amount of time, thank yourself for being willing\
    \ to try this experience.\n\n*   Even if it feels as if nothing is happening,\
    \ the act of directing attention to the heart center is an invitation for it to\
    \ warm and soften, to regain its ability to welcome life in.\n\nGENEROSITY: THE\
    \ GREAT ANTIDOTE TO ISOLATION\n\nHave you ever experienced the joy of giving or\
    \ receiving just the right thing? Have you felt your heart warm and expand as\
    \ it is touched by the gift? Having been on the giving end and the receiving end,\
    \ have you noticed how similar they feel? According to the Buddha, a generous\
    \ act dissolves the small self. With no thought of reward by the giver and with\
    \ no debt incurred by the receiver, a generous act changes the world from one\
    \ of isolation to one of connection. It is a temporary world, of course, but one\
    \ that can be remembered and savored in lonely times. In the world of generosity,\
    \ your gain is my pleasure, your happiness gives me happiness. In the world of\
    \ generosity, your success doesn’t threaten or diminish mine. It is a world that\
    \ can be called into being by any act of giving.\n\nCultivating a Generous Heart\n\
    \n*   Sit quietly in a comfortable position as you focus on your breath. Allow\
    \ your mind to settle.\n\n*   Place your attention on your heart center, noticing\
    \ whatever feeling is there at this moment and accepting it just as it is.\n\n\
    *   Bring to mind someone who has recently received some very good news. When\
    \ you have created a clear image of this person, muster as much generosity as\
    \ you can.\n\n*   Silently offer this person a phrase such as:\n\n    *   *May\
    \ your happiness grow and be with you always.*\n\n    *   *May your success continue.*\n\
    \n    *   *Your joy gives me joy.*\n\n*   Notice how this feels. If you have any\
    \ resistance to this, just open to it and remember your intention to cultivate\
    \ a generous heart.\n\n*   If you’d like, you can call up the image of another\
    \ person who is experiencing some special goodness right now and repeat the same\
    \ phrases to this person.\n\n*   Be generous with yourself if this is difficult,\
    \ perhaps directing the same phrases to your own heart:\n\n    *   *May my happiness\
    \ grow and always be with me.*\n\n    *   *May my success continue.*\n\n    *\
    \   *May I share in everyone’s joy.*\n\n*   When you feel finished with this process,\
    \ bring your awareness back to the breath for a minute or two.\n\n*   Remember\
    \ these phrases and this intention throughout the day, silently offering it to\
    \ those you encounter.\n\nLISTENING WITH A WIDE-OPEN HEART\n\nOne of the key ingredients\
    \ to connection is to be able to listen deeply to others. The gift of true listening\
    \ is one of the most generous gifts you can offer someone.\n\nThere is a story\
    \ of a town that had a small-town heroes contest. Imagine the surprise of the\
    \ townspeople when the contest was won by a five-year-old boy who had been nominated\
    \ by his elderly neighbor. When he was interviewed for a story for the local newspaper\
    \ and asked what he had done, his reply was short and sweet: “Well, Mr. Larson\
    \ was sad when Mrs. Larson died, so I just sat on his lap and let him cry.”"
