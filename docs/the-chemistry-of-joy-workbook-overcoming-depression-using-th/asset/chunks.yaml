  trans: '

    有时，在你还没来得及建造一艘坚固的木筏之前，风暴就会将你推入汹急且泛滥的河流。如果你造了一半的木筏停在岸边，当你匆忙路过时看到它却无法靠近，该怎么办？


    你可能需要利用随手能抓到的树枝和小条拼成一个木筏，并紧紧抓住它，直到风暴平息。你已经学习了一些所需的技能和信念。在恶劣条件下临时制作木筏需要`RAW GRIT`（纯粹的韧性）。


    # 韧性


    ![识别正在发生的事情/意识/等待/脚踏实地/记住无常/意图/向他人寻求庇护](img/fig8.4.jpg)


    你见过龙卷风或飓风后的景象吗？尽管看起来损害似乎永远无法修复，但在风暴结束后的几小时内，人们就已经在清理碎片。当表面损坏被清理干净，剩下的就是完好无损的大地。


    同样，在你自己的风暴中，你身上有一部分是无法被破坏的。这是你的“大自我”，即你与更广的世界相连的部分——与自然界、与神性、与全人类。在接下来的章节中，你将被引导学习更多关于你大自我的知识，并学习培养与之连接的方法。


    ## 第 8 章总结


    - 每个人都会受到情绪风暴的影响。

    - 通过将正念带入体验中，可以在自我意识上成长。

    - 对小自我及其信念的认同越多，对这些风暴的脆弱性就越强。

    - 可以培养出一些技能来限制甚至避免情绪风暴造成的伤害。


    # 第 4 部分：心灵路径


    ## 第 9 章


    ![连接的符号](img/fig1.7.jpg)


    # 连接：回到自我


    *时终将到来*

    *届时，你带着欣喜*

    *将迎接自己抵达*

    *回到自己的门口，在自己的镜子前*

    *每个人都对对方的欢迎报以微笑.*

    — 德里克·沃尔科特 (Derek Walcott)


    培养一颗“善心”—一颗开放、接纳自我与他人、慷慨、爱且快乐的心——是韧性生活的核心。在本章中，我们开始走第一条心灵路径：那条引导你回到你一途中遗忘或丢失的自我的路径，那个你可能曾拒之门外的自我。


    内心的关闭可能始于一个非常被遗忘的时刻——一个被刻薄的话语或残酷的拒绝所伤害的时刻。随着时间的推移，你可能收集了许多认为自己有缺陷、不值钱、破碎且需要被修复的理由。陷入自我拒绝的陷阱后，你可能开启了许多自我提升项目，而所有这些都基于一种信念：你现在的样子并不好。


    我们邀请你思考，你现在的样子已经足够好了。我们邀请你向自己敞开心扉，开始从羞耻、自我拒绝和隔绝痛苦中深度疗愈的路径。在本章中，我们为你提供探索和修复将自己排除在心智之外模式的机会，并分享帮助你重新连接本质良性的练习。


    ### 玛丽·艾伦的故事：自我拒绝的陷阱


    玛丽·艾伦（Mary Ellen）是一位五十多岁、优雅端庄的女性，她说：“可以用两个词来总结我的一生：‘成绩单’。玛丽·艾伦的表现没有哪部分逃过她自己无情的审视和评判。她对自己的每一个方面都挑剔，设定了高到无法实现的标准，而且在她看来，从未达到过这些标准。尽管别人认为她富有创意、平易近人、聪明且有成就，但她陷入了自我拒绝的陷阱。她无法将自己看作除了能力不足、不值得爱和不值得之外的任何形象。她付出巨大的努力来补偿自己的匮乏感，在工作中努力超越预期，并为家庭和社区无私地奉献自己。她收集了一图书馆的自学书籍，试图在每一本书中寻找能让她从‘成绩单’暴政中解脱出来的自我提升之路。最终，她达到了一个临界点。由于无法继续逼迫自己，她陷入了抑郁发作，这产生了更多的自相轻视和评判。


    玛丽·艾伦自我拒绝的根源是毒性羞耻，这种阴险而强大的情感幻觉在说：`我有缺陷。我不值得钱。我不值得被爱。`


    自我拒绝将你与你自己、与他人隔离开来。我们认为，自我拒绝及其根源羞耻是不快乐的主要原因，也是导致抑郁的重要因素。我们同样相信，自我接纳和从羞耻中疗愈是可能的，它们开启了通往快乐和韧的大门。这通过治愈与自我的隔阂、通过回到自我来实现。


    ## 自我接纳路径


    自我接纳是一个过程，而不是一个事件。虽然每个人的路径都是独特的，但有几个关键阶段。你可能会发现自己在这些阶段中循环多次，因为这不是线性过程。


    ### 迈出第一步：停火


    结束自我拒绝的内心战争从要求停火开始：设定与自己做朋友的意图。玛丽·艾伦没有继续与自己斗争，而是敞开放接受一种可能：她可以与真实的自己和解，并撕掉那张成绩单。这种意图并非容易获得，随着习惯性的自我拒绝方式再次出现，它会不时淡化。通过正念的接纳，她回到了与自己做朋友的意图并重新开始。


    ### 下一步：与被拒绝的自我连接


    玛丽·艾伦像所有陷入自我拒绝陷阱的人一样，只能通过内在评判者的眼睛来看自己，那个评判者对她唯有蔑视。在理智层面，她意识到自己的轻视是极端的、不合理的，但尽管她如何努力，仍无法摆脱那些批判性的想法。


    事实上，仅仅通过思考是不可能从轻视转向自我慈悲的；只有心灵才能产生自我慈悲的疗愈力量。而在心灵产生慈悲之前，有必要真正看到正在发生的痛苦。如果你与自己的痛苦疏远，如果羞耻和轻视让你变得冷酷，那么你的心就是闭合的。


    当玛丽·艾伦思考这些想法时，她讲述了一个她自己经历的故事，这让这个过程的步骤对她来说变得清晰。她住在一个大，在上班路上，经常在红灯前经过一个女人，手里拿着一个牌子：`无家可归且绝望。请施舍。上帝保佑你。`


    从远处看她，玛丽·艾伦希望绿灯亮起以便她快速驶过。当被迫在路口停下时，她会移开目光，脑中充满了批判性的想法。尽管她的一部分意识到了自己正带有偏见，对那个女人的困境缺乏理解，但她内在的批判部分占据了她在路口的时刻。每当一次，当她快睡着时，那个女人的脸就会出现在玛丽·艾伦的脑海中。随着时间的推移，她开始幻想在无流浪者收容所工作，并开始在那里志愿者，提供食物并听那些让她对那个曾如此审判和回避的女人产生更深理解的故事。当她与收容所的人面对面交流并听到他们的故事时，她的心自然地敞开了，评判也随之消失了。

