  trans: '


    *   培养一种“观察性自我”，为思想和情感提供更广阔的视角

    *   洞察思维和行为模式，并能够自由选择习惯性、反应性模式之外的其他选项

    *   能够与经验共处的能力，承认其无常性并对未来充满希望

    *   治愈与自我（身体、心智和心灵）的断裂感

    *   更充分地接受生活的本色——包括痛苦在内

    *   由于生活在当下而非过去或未来，从而拥有更大的快乐容量


    亚历山德拉（Alexandra）用简单而喜悦的方式表达了这种转变的净收益，她说：“现在我明白，我那扭曲的思维和对自我的逃避带给我带来了比我需要的多得多的痛苦。现在，当我允许自己面对这一切时，我仍然能感受到失去工作的痛苦，但每天，我也感受到了快乐。”这种即使在生活的痛苦经历中也可能拥有快乐的意识，正是正念生活的核心。道家的表达捕捉了这一切：生活就是“万般欢喜万般哀”。


    ## 神经科学与冥想


    在技术发展的帮助下，现代科学揭示了一个惊人的事实：正念冥想练习会改变大脑的结构和功能。


    通常而言，冥想者似乎拥有更安静的边缘系统、杏仁核密度较低，以及强大且健康的前额叶。这转化到现实中意味着：情绪反应性降低、情绪自我控制能力增强、压力管理改善以及对压力反应的调节。


    这在加州大学洛杉矶分校（UCLA）神经科研究员艾琳·卢德斯（Eileen Luders，2009）的一项研究项目中得到了证实。“Luders”及其同事使用高分辨率
    MRI 对比了二十二冥想者和二十二年龄匹配的非冥想者的大脑，发现冥想者在对注意力、情绪调节和心理灵活性重要的大脑区域拥有更多的灰质。具体而言，冥想者在海马体、眶额叶皮层、丘脑和下颞回区域的体积明显更大——而这些区域都是为人知的调节情绪区域。由于这些大脑区域与情绪密切相关，`Luders`
    指出，它们可能是冥想者卓越的情绪调节能力以及应对日常生活起伏的神经学基础。


    ***


    马萨诸塞总医院和哈佛大学的一项近期研究让二十六名高压力的成年人参加了为期八周的正念减压课程。在干预前后进行了大脑扫描，并结合了参与者对压力的自我报告。报告压力减轻的参与者，其杏仁核的灰质密度也有下降。之前的研究显示，创伤和慢性压力会放大杏仁核，使其更具反应性并与大脑与其他区域联系更紧密，从而导致更大的压力和焦虑。这项研究是首批记录的发生反向变化的案例之一——大脑变得反应性降低且韧性更强（`Kilpatrick
    et al. 2011`）。


    ***


    ## 第六章总结


    *   富有韧性的心灵是一个冷静且脚踏的心灵。

    *   虽然我们无法逃避人类生活的痛苦——包括抑郁和焦虑——但我们可以学会减少由我们自己心灵所创造的额外痛苦。

    *   通过各种形式的正念练习，我们可以平静内心。在沉静心灵的宽广空间里，我们可以以平等的心态开放接受生活体验的全范围。

    *   科学研究现在证实，正念冥想是减轻压力反应、改善情绪调节和提高幸福感的一种手段。


    ## 第七章


    ![开启的符号](img/fig1.5.jpg)


    # 开启：培养情绪韧性


    *让发生在你身上的一切发生，*

    *无论是美丽还是恐怖。*

    *坚持前行。*

    *没有任何感觉是终点。*


    莱纳·马里亚·里尔


    想象一种没有情绪的生活：婴儿出生时没有快乐。失去亲人没有悲伤。面对海啸受害者的困境没有同情。没有作为关系胶合剂的爱。没有警告危险的恐惧，没有激励为正义而战的愤怒。没有清晨微小的喜悦，比如看到窗外的红雀，或是门廊台上的第一杯咖啡。


    情绪是理解你是谁的关键：你被什么吸引或排斥，什么在激励着你，什么又威胁着你的安全。情绪可以作为一种导航设备——某种内在 GPS——让你知道身处何地，建议你可能想去哪里，引导你的方向。它们是日常生活的快乐源泉，也是让你与他人建立联系的共情源泉。通过学会阅读内在的情绪语言——变得具备情绪素养——你可以更完整地理解自己，更有技巧地应对日常挑战，并更充分地欣赏生活的丰富。


    然而，情绪生活也有复杂性和困难。你可能养成了一些规则和信念，扭曲了你对情绪的看法以及表达情绪的方式。你可能学会了不信任情绪或将其视为软弱的信号。也许你把它们留在了心里，因为发现别人没有能力或不愿意听这些。你甚至可能关闭了最痛苦的情绪，以保护自己免受痛苦。不幸的是，与情绪的断裂可能会让你的内心感到空虚或对你而言未知。


    如果说抑郁遮蔽了画面，情绪可能会变成一个令人恐惧的入口——深夜里一个危险的社区。如果你一直被悲伤、内疚或绝望所吞噬（这些都是抑郁的特征），你可能已经变成了情绪恐惧：害怕经历某些情绪，以免发现自己再次陷入抑郁的束缚。


    在本章中，你将找到工具，让你能够在情绪体验内在世界自由移动，无论这个世界现在由于你的生活经历而受到多么限制。这种充分感受一切的自由，是恢复和保持韧性、防止抑郁复发以及过快乐生活的基础技能之一。


    ## 理解情绪体验的流动


    情绪自然地发挥着对日常生活中发生的事情做出即时反应的作用。它们可以被比作天气系统：到来、停留一段时间、然后离开。情绪源于边缘系统——“情绪大脑”——当边缘脑对你周围的刺激做出反应时，与各种情绪状态相关的神经递质会被释放。这些化学物质沿着神经通路旅行到皮层的前额叶——“思考大脑”——在那里你将想法和记忆加入其中。这些关于以往经历的想法和记忆使你能够描述、解释、沟通并决定如何应对你的情绪。正是在这一点上，情绪生活可能会变得复杂。


    在上一章中，我们引入了“猴子心”的概念：那种未经训练的、动不安的心灵，它往往是痛苦的源头。当你被困在猴子心中时，你很容易相信你的想法就是现实，并陷入一个叙事的网网中，导致你进入痛苦感受的深渊。这些思维的“第二支箭”会为原始的情绪体验增加层层痛苦，而这种体验本身可能已经足够艰难了。


    考虑这个日常案例。


    *凯瑟琳的故事*


