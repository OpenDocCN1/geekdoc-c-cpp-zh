    Henri Nouwen, a Catholic priest and author who suffered with depression himself,
    wrote, “Joy does not simply happen to us. We have to choose joy and keep choosing
    it every day” (Nouwen 1994, 29). This is a provocative statement. What does it
    mean to “choose joy”?


    In terms of emotional resilience, choosing joy is choosing to open fully to those
    experiences we often overlook, those that are not so threatening that they grab
    our survival-minded attention. They can be the big events of life: births, weddings,
    holidays, new beginnings of all sorts. Or they can be small happenings: the laughter
    of playing children, the call of a loon at dusk on a summer evening, a warm look
    in the eyes of a good friend across the dinner table, celebrating your favorite
    baseball team’s victory from the bleacher seats on a warm summer evening.


    Paying deliberate attention to what is pleasant requires that we choose, over
    and over again, to take the time to open to what’s happening in these moments.
    When did you last really watch the sun set—really open to the entire, amazing
    show of color rather than simply give it a quick glance? When was the last time
    you really felt your child’s hug, as you looked deeply into his face? Or tasted
    the first ripe raspberry of summer? Your busy life and your attention to what’s
    coming up next can keep you from settling deeply into the moments that bring joy.


    Mindfulness in daily life is an antidote to these natural tendencies. Developing
    the habit of looking for what’s pleasant, opening to it, and planting it firmly
    in your conscious awareness will pay great dividends. This simple “three pleasures”
    exercise takes only a few moments each day, and is one way to cultivate the habit
    of mindful attention to what you often miss seeing.


    ### Three Pleasures Exercise


    1. At the end of the day, give yourself some time for written reflection. You
    may wish to use a special notebook or journal for this practice.

    2. After sitting quietly for a few minutes, reflect on and record three pleasures
    that came your way today. At first it might be difficult, but with practice it
    will become more natural. If you have trouble beginning, you might try recalling
    your day chronologically. Or you might use the simple structure of recalling pleasant
    things that came by way of your senses: sight, sound, smell, taste, touch. Or
    scan through your interactions with people today, recalling kind words or favors
    or sharing of news.

    3. As you write, take time to recall these events in detail, and open to the sensations
    in your body and thoughts that fill your mind. Let the pleasures sink in, and
    really enjoy them. Write them down in as much detail as you can.

    4. In the morning anticipate any pleasant things the new day might bring, and
    set your intention to be open to surprises as well.

    5. During the day take time to savor the pleasures of the day by recalling them
    in a quiet moment or sharing them with a friend. Telling the stories to another
    is a way of generating more pleasure and of anchoring the experience in your awareness.


    ### Summing Up Chapter 7


    * Emotional resilience is the capacity to open fully to the daily ups and downs
    of your emotional experience with mindful, nonjudging acceptance.

    * Emotions are a fundamental human experience essential to your survival. Every
    emotional experience has a natural cycle of flow: it arrives, remains for a while,
    and passes. No emotion is permanent.

    * Due to early learning or other experiences, you might have developed patterns
    of emotional experiencing that interrupt that flow; your emotional life might
    be limited by disconnection, resistance, fixation, or flooding.

    * Working with these patterns using mindfulness skills and your own insight can
    undo them and allow you to open to all emotions in a way that makes you resilient
    and brings you fully alive.

    * Opening fully to pleasant emotional experiences will balance your perspective
    and be a source of joy.


    # Chapter 8


    ![Symbol for Knowing](Images/fig1.6.jpg)


    ## Knowing: Become a Source of Wisdom for Yourself


    *There is a great deal of unmapped country within us, which would have to be taken
    into account in an exploration of our gusts and storms.*

    *George Eliot*


    Lauren teared up as she slumped onto the couch in the therapy office. “I don’t
    know what happened,” she said. “One minute I was working on a paper for my freshman
    English class and thirty minutes later I was crying in my room. I felt just hopeless
    and I’ve been depressed ever since. But the worst thing is that I don’t know why.
    I feel like I’m going crazy.”


    Lauren isn’t going crazy but she is a stranger to herself. She must get to know
    her unmapped inner territory in order to understand what happens when she is overtaken
    by such strong emotion. She needs to understand herself more completely in order
    to work more skillfully with all that is happening within.


    Most people can identify a time when they felt taken over by a sudden, intense
    feeling that sprang from nowhere, and many regret the impulsive acts that these
    feelings prompted. Besides being unpleasant or frightening, these emotional storms
    can sometimes open the door to an episode of depression, as Lauren feared was
    happening to her.


    What happened to Lauren could be considered an emotional tsunami: the kind of
    emotionally overwhelming experience that can knock you off your feet. In this
    chapter we will guide you to take a closer look at a time when you were overtaken
    by such a storm. There are two reasons it is important to look more closely at
    these very unpleasant experiences. First, it is helpful to see that these are
    common human reactions and they do not mean that you are going crazy or are out
    of control. Second, as you learn more about your own unmapped territory, you will
    feel more confident about your ability to handle such emotionally overwhelming
    experiences and will have more courage when faced with them.


    ### The Emotional Tsunami


    It is inevitable that you are unaware of parts of your inner world. Everyone is.
    You spend most of the day dealing with the outside world: making a living, relating
    to others, navigating the streets of daily life. Naturally you are more familiar
    with the parts of yourself that you need in order to manage everyday life. You
    may even be tempted to arrange your life so you can stay within your comfort zone.
    You may want to avoid experiences that disturb you and stay away from people who
    might upset you. You may especially want to avoid the things within yourself that
    worry or confuse you. As long as you feel in control of the outside and the inside
    world, you feel pretty safe. However, none of us can maintain that kind of control
    at all times. An illness, a loss, a rejection, a threatening thought—all of these
    experiences come with the territory of being human.


    To a greater or lesser degree, emotional tsunamis happen to everyone, and when
    they arrive, they threaten your sense of predictability and control. The good
    news is that it is possible to learn from them and reduce the harm they can cause.
    With the assistance of mindful strategies, you can learn to recognize an emotional
    storm in its earliest stages, slow things down when the wind picks up, and stop
    yourself from acting in ways that add to the damage. It is even possible to learn
    enough from your storm experiences that you can avoid them in the future.


    ### Working with the Emotional Tsunami


    Recall a time when you had an overwhelming experience like Lauren’s. Maybe you
    felt a sudden hollowing in your stomach and all of your energy seemed to drain
    away, or maybe someone seemed to ignore you and you were filled with anger. Perhaps
    in the middle of a gathering, you experienced a feeling of loneliness and felt
    hopeless about ever belonging anywhere. After you read the following description
    of Lauren’s review of her experience, take some time to write about one of your
    own emotional tsunamis.


    Lauren’s Story

