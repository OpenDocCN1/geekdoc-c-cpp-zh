    * `a.` light and narrow-framed with prominent joints; if I gain weight, it tends
    to be in the midsection.

    * `b.` medium build, athletic, moderate weight; I can gain or lose weight easily
    if I put my mind to it.

    * `c.` sturdy and large-boned; I gain weight easily and have trouble taking it
    off again.


    2. **My skin tends to be:**


    * `a.` cold, dry, or rough, especially in dry climates.

    * `b.` warm and burn easily, and I tend to have freckles, moles, or rashes.

    * `c.` cool, soft, and oily.


    3. **I prefer a climate that is:**


    * `a.` warm and moist; I don’t tolerate dry, cold winds.

    * `b.` cool and dry; I don’t tolerate hot, humid weather.

    * `c.` warm and dry; I don’t tolerate cool and damp weather.


    4. **My hair tends to be:**


    * `a.` dry, frizzy, and brittle.

    * `b.` straight, light, or reddish, with early balding or graying.

    * `c.` thick, wavy, dark, oily.


    5. **My appetite tends to be:**


    * `a.` variable and irregular; I often skip meals because of my erratic schedule.

    * `b.` strong and occasionally excessive; I get crabby if I miss a meal.

    * `c.` slow and steady; I can go a long time without eating, though I prefer not
    to.


    6. **My digestion tends to be:**


    * `a.` irregular, with frequent gas or constipation.

    * `b.` quick, with occasional burning indigestion or loose stools.

    * `c.` slow and sluggish, often with oily stools.


    7. **Physically, I tend to be:**


    * `a.` highly active, moving quickly; sometimes I get restless.

    * `b.` medium active, moving purposefully; sometimes I become driven to get things
    done.

    * `c.` lower in activity, moving slowly and methodically; sometimes I get lethargic.


    8. **My mind is best described as:**


    * `a.` quick, active, restless; I am quick to learn new things.

    * `b.` sharp, intelligent, critical; I am determined to learn things well.

    * `c.` calm, slow, thoughtful; I learn slowly and steadily.


    9. **My memory is usually:**


    * `a.` quick to remember, but also quick to forget.

    * `b.` strong and distinct.

    * `c.` slow to develop but with good retention.


    10. **My sleep is usually:**


    * `a.` irregular and light, and I am easily awakened.

    * `b.` fairly sound, and I need less than average to feel rested.

    * `c.` deep and heavy, and I need more than average to feel rested.


    11. **When I feel like myself, I tend to be:**


    * `a.` lively, creative, and enthusiastic; I embrace change.

    * `b.` determined, friendly, and successful; I embrace competition.

    * `c.` calm, easygoing, and nurturing; I embrace structure.


    12. **When I feel stressed, I tend to become:**


    * `a.` anxious, insecure, or moody.

    * `b.` agitated, irritable, or impatient.

    * `c.` sluggish, complacent, or withdrawn.


    ### Scoring


    Count the number of answers that were:


    * `a`: ___________(corresponds to the air type)

    * `b`: ___________(corresponds to the fire type)

    * `c`: ___________(corresponds to the earth type)


    If your score in one category is significantly higher than in the others, then
    that is your mind-body type. However, most people score high in two categories
    (one is often slightly higher than the other).


    ### Understanding Your Scores


    The preceding questionnaire is adapted from ayurveda. If it is clear where your
    imbalance lies, you may want to go right to that section. If you are unsure where
    to begin, then work on the three in order: balance first, then fire, and finally
    earth.


    Look back at your scores; the categories with the highest scores are those most
    likely to get out of balance. The three primary patterns are outlined next, along
    with the diet and lifestyle choices that will help you regain. If you had more
    `a`, then you are likely to be lively, creative, and enthusiastic; you embrace
    change. When you become stressed, your emotions may tend toward anxiety, making
    you susceptible to anxious. If you had more `b`, then you are likely to be determined,
    friendly, and successful; you embrace competition. When you become stressed, your
    emotions may tend toward irritability, making you susceptible to agitated. If
    you had more `c`, then you are likely to be calm, easygoing, and nurturing; you
    embrace structure. When you become stressed, your emotions may tend toward sluggishness,
    making you susceptible to sluggish.


    After you have regained a greater sense of well-being, then continue with the
    measures that are best suited for your mind-body type.


    ## When You’re Out of Balance: Realign


    Staying in balance is an art. We all experience some imbalance from time to time.
    The key is to notice that we can get back into alignment. Air types, for example,
    are notorious for keeping irregular schedules. Earth types who are inactive will
    likewise find those patterns exaggerated.


    ### Realigning Air Types


    When air types are imbalanced, it may show up in the following ways:


    ![Table: Air imbalance - Physical symptoms, Mental/Emotional symptoms](Images/fig5.1.jpg)


    These can be early warning signs of depression. If you take measures to bring
    yourself back into balance quickly, you may be able to prevent it from going any
    further.


    ### Discover the Causes of Air Imbalance


    Check each of the following statements that applies to you:


    * I work long or irregular hours.

    * I don’t take regular breaks.

    * I tend to overchedule myself; my schedule is inconsistent.

    * I don’t get enough sleep.

    * I use caffeine or nicotine.

    * I eat a lot of sugar or white flour.

    * I skip breakfast or other meals.

    * There is a lot of noise or hustle and bustle around me.

    * There is a lot of stress or change in my life right now.

    * I live in a cold, dry climate (or it is winter).

