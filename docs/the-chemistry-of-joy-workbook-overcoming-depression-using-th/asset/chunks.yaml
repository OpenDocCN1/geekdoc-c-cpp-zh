    “我当时坐在图书馆里，试着写一篇关于《白比鲸》的书评。我不喜欢这本书，似乎无法下笔。我开始担心不能按时完成。我偶然听到身后桌子旁几个人的说话。那是我的室友蒂芬妮，还有宿舍的另外三个女孩。早些时候，我问过蒂芬妮不想和我一起学习，她说不想，想去健身。但现在她就在那里，和那些她越来越多在一起的女孩在一起。我感到一阵恶心，突然觉得必须离开图书馆。回宿舍的路上，我进了一家零食店买了一大包
    M&M 巧克力。回到房间时，我已经吃了一半了。我开始感觉更难受了。我哭着不停地吃糖。我记得当时在想，我在大学里永远交不到朋友了。我脑海里有一个声音说：我告诉过你；我告诉过没人喜欢你。从那以后我一直感觉糟糕极了，最后和蒂芬妮吵了一架。从那以后我们就再没说过话了，我不知道该对她说什么。”


    ### 你的经历：


    ___________


    ___________


    ___________


    ___________


    ___________


    ___________


    ___________


    ___________


    ___________


    现在回去重新读一遍洛伦（Lauren）的故事，寻找她意识中的疏漏。起初，她意识到自己对写作的想法以及对完成工作的担忧。但一旦她看到蒂芬妮和别人在一起，她感到被迫离开图书馆，去买糖果，并无意识地吃掉。在那瞬间之间发生了什么？洛伦并没有像她担的那样失去理智，但她确实失去了正念。她无法为自己的行为或对蒂芬妮产生的强烈愤怒找到理由。框框解释了大脑中可能发生的情况，这正是为什么正念如此难以维持。你会发现，洛伦的经历（也许也包括你的）听起来非常像是一种`杏仁核劫持`。


    ***


    # 大脑中的风暴


    丹尼尔·戈曼（Daniel Goleman，《情感智能：为什么它比 IQ 更重要》，1995, 18）的作者创造了“杏仁核劫持”这一术语。当大脑的情绪系统独立于大脑思考部分运行时，就会发生这种劫持。通常，感官接收的信息会被发送到`丘脑`（thalamus）。`丘脑`通常会将这些信息传递给`新皮层`（neocortex，大脑的推理部分）。从`新皮层`，信息随后被发送到`杏仁核`（amygdala），这是情绪大脑向身体其他部分发出报警的部分。


    通过这样，思考和感受是协调的。但在威胁情况下，`丘脑`会绕过`新皮层`，情绪大脑在没有思考能提供的任何调节影响的情况下做出反应。根据戈曼的说法，`杏仁核劫持`有三个特征：


    *   强烈的情绪反应

    *   突然发作

    *   事后才意识到反应是不恰当的


    ***


    情绪海发生在你的意识之外，往往在身后留下破坏性后果。如果你能将正念意识直接带入这种剧烈的负面经历中心，结果会有何不同？


    ## 绘制风暴的路径


    通过反思、视觉化和写日记相结合，洛伦能够更详细地描述她的经历。在指导下，她能够遵循从感觉到想法、再到解释最后到行动的风暴路径。她松了一口气，觉得这“合乎情理”。她到底没有疯。接下来的描述包含了洛伦对她经历的更仔细检查，以及将正念带入风暴中心的机会。


    ### 感觉的上升


    洛伦记得，当她听到蒂芬妮的声音看到那些女孩在一起时，她感到肩膀紧绷，胃部有一种空虚感。如果洛伦能够注意到这些感觉并识别出这是负面反应的开始，她或许可以利用它们作为警告信号，预示风暴可能即将到来。相反，在这些感觉发生时，她对此毫无意识。


    #### 寻找正念的可能性


    *   使用`一分钟冥想`（见第 6 章）来减慢节奏。

    *   识别并命名正在发生的情况（“肩膀紧”、“胃部坠感”）。

    *   将注意力集中在身体感觉上；它可以抵消风暴的冲击。


    ### 想法的进入


    洛伦识别出以下系列想法：`蒂芬妮和玛丽、菲奥娜在一起。我问过蒂芬妮和我一起学习，她说想去健身。现在她和她们在一起了。`


    在此时，洛伦正在客观地向自己描述事件。没有进行判断或评估；她只是在记录发生了什么。


    #### 寻找正念的可能性


    *   保持中立和客观。

    *   通过意识到想法正在产生来继续加强意识——并意识到它们*仅仅*是想法。

    *   保持对呼吸的意识。


    ### 情绪的淹没


    洛伦在回忆接下来发生的事情时非常困难。最后她想起了几个画面——她在初中独自吃午饭、周五在家里而朋友开始约会、以及太害怕而不敢参加学校戏剧选角。这些画面出现得太快，只是她脑海中的闪现。


    正是在这里`杏仁核`开始劫持她的经历。早先孤独经历的画面被洛伦当下经历的类似孤独感所触发了。


    #### 寻找正念的可能性


    *   刻意减慢呼吸。

    *   识别正在发生什么；将其命名为情绪泛滥或被淹没。

    *   保持双脚与地面的连接感；注意腿部的力量。

    *   记住风暴中心的宁静；尝试与观察者自我建立联系。


    ### 故事情线的进入


    当洛伦想起其他她感到被排挤的时候时，她的大脑开始增加她根深蒂固的信念，即她永远无法归属。她几乎听到了这些话：“没人喜欢你。他们觉得你很怪。”


    这是风暴真正腾腾起来的地方。想法、图像、信念和记忆在旋涡中结合，创造了一个关于现状以及未来将保持现状的可信故事。故事情线由感觉、想法、情绪以及对发生事情意义的内心评论组成。这条故事线加剧了本就痛苦的情绪。


    #### 寻找正念的可能性


    *   将注意力从思考移开，转向身体的感觉。

    *   与观察者自我建立联系：那个能够观察想法流且不被卷其中的部分。

    *   记住所有的经历都会流逝；这不会永远持续。


    ### 逃避情绪的冲动


    洛伦站起来离开了图书馆。她在学生会商店买了一大包 M&M 巧克力。她的一部分想拒绝吃糖果，但她似乎无法控制自己。尽管她的注意力集中在嘴里的感觉上，但她什么尝不到。她的世界似乎围绕着巧力的咀嚼声收缩了。


    在此时，风暴已经接管。洛伦对痛苦情绪做出的反应就像它们威胁到了她的实际生存。巧力的咀嚼声和巧克力融化的感觉将她从无法忍受的情绪中分心出来。


    #### 寻找正念的可能性


    *   将注意力从思考移开，转向身体的感觉。

    *   在身体中练习着陆：注意腿部的力量和脚部接触地板。

    *   记住即使这些也可以被处理的。


    # 外化或内化


