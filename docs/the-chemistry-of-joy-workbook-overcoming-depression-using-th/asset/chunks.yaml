  raw: '*   I turn to food when I feel bad, usually sweets or snack foods.


    *   There is not much activity around me.


    *   There is very little change in my life right now.


    *   I live in a cool, damp climate (or it is spring).


    * * *


    Go over all the items that you checked and deal quickly with any that you can.
    The two most common causes of earth imbalance are lack of stimulation and dealing
    ineffectively with stress by overeating or shutting down emotionally. You will
    find more on stress and emotions in part 3\. Meanwhile, the following are simple,
    commonsense measures that anyone can take to help bring earth energy back into
    balance.


    Seven Guidelines for Balancing Earth


    Live energetically through the day. A regular routine is essential. Aim to go
    to bed and get up early each day, especially during the long winter nights. Do
    not skip meals, especially breakfast. Eat an early, light supper so that you’re
    not full when you go to bed.


    Look to add stimulation to your life. Accept challenges and seek novelty both
    in work and in play: new friends, new hobbies, new places to go. Take regular
    breaks, ideally every one and a half to two hours. Try to exercise nearly every
    day.


    Remember to regularly set aside extensive time for reflection and renewal.


    Eat wisely for your type. The simplest diet advice for earth types is this: eat
    less. Like all aspects of life, food should add variety, interest, and stimulation
    to help bring earth energy back into balance. Think of the natural world in spring,
    a time to detoxify and lose the extra winter energy stored as fat. Eat more salads
    and bitter, leafy greens. Earth types do well as vegetarians. They need to be
    sure to get good-quality protein. If meat is eaten, it should be lean. Reduce
    oily foods, getting just a small amount of healthy fats. Even on a low-fat diet,
    earth types who eat a lot of sugar or grains tend to gain weight, so reduce them
    if you can (use small amounts of honey or agave syrup for sweeteners). Keep regular
    mealtimes, with a low-calorie, high-protein breakfast and a light meal at supper.
    Make your midday meal more substantial, and include a modest amount of healthy
    fat so that you don’t crave fats in the evening. Go for a short walk after eating
    to add some stimulation. Sip warm water or green tea throughout the day (a bit
    of caffeine is okay). Avoid iced or cold drinks, which imbalance earth energy.
    Make your food choices from the list below.


    Earth Balancing Foods:


    *   Overview: More protein, light foods with plenty of fresh vegetables. Minimize
    starches and sugars. Avoid artificial sweeteners; use a small amount of raw honey.


    Recommended Foods:


    *   Dairy: Skim milk, small amounts of low-fat cheese, cottage cheese, yogurt,
    or kefir.


    *   Meats: Low-fat meats, poultry, fish.


    *   Beans and legumes: All are fine.


    *   Nuts and seeds: Sunflower and pumpkin seeds.


    *   Oils: Small amounts of olive or walnut oils.


    *   Grains (small amounts): Quinoa, barley, buckwheat, corn, millet, amaranth,
    oats, rye.


    *   Vegetables: All are okay, but go easy on potatoes, sweet potatoes, and other
    starchy vegetables. Spring vegetables are best, such as leafy greens, sprouts,
    and asparagus—also the cruciferous vegetables (broccoli, cauliflower, cabbage,
    Brussels sprouts, bok choy).


    *   Fruits: Apples, pears, peaches, apricots, cranberries, cherries, all berries,
    all citrus.


    *   Snacks: Yogurt with nuts; low-fat string cheese; nonfat smoothie with added
    protein powder.


    *   Herbs and spices: Fresh basil, thyme, parsley, oregano, or mint; black or
    cayenne pepper, cardamom, celery seeds, cinnamon, cloves, ginger, lemon, mustard,
    sage.


    Move in tune with your body. Earth types need the most regular and vigorous exercise
    to stay balanced—ideally every day. Since energy and motivation can be a challenge,
    consider finding a workout partner, taking a class, or hiring a personal trainer.


    *   Ideal exercise: Interval training. With any activity you choose, go slowly
    for two to three minutes to warm up. Over the next few minutes, increase the intensity
    until you push nearly as hard as you can—but just for a minute or so. Then back
    down to a more relaxed pace for a couple of minutes, allowing yourself to recover
    before ramping up the intensity again for a minute. Repeat this cycle four to
    five times for a great energy-boosting workout.


    Competitive sports can also be a good way to get energy flowing. As your energy
    returns, aim for forty-five to sixty minutes of exercise most days. You should
    break a sweat and get your heart rate elevated.


    It is also helpful to combine aerobic and weight training. And remember, walking
    is nearly the perfect exercise!


    Being in nature and with others is a plus. Consider adventurous sports like sea
    kayaking, mountain biking, and rock climbing. Also good are vigorous biking and
    Nordic skiing.


    *   Best mind-body exercises: Martial arts like karate, tae kwon do, or tai chi;
    more vigorous forms of yoga, including heated yoga.


    Tuck yourself in properly. Earth types tend to sleep too much and often have a
    difficult time waking up and getting out of bed on time. Daytime naps are also
    a temptation, but they tend to make you even more sluggish and should be avoided
    until your energy is back to normal. If you must nap, keep it short (twenty to
    thirty minutes) and early in the day (between noon and 3:00 p.m.). It is important
    to get to bed early and then arise early, ideally before sunrise.


    Avoid alcohol before bed; it may seem to relax you but can further disrupt your
    sleep.


    Come to your senses. The physical senses that are most soothing for earth energy
    are taste and smell (which may partly explain the tendency toward weight gain).
    Rather than going for quantity, seek out stimulating flavors and aromas. Try a
    new cuisine or add a variety of interesting spices to your food.


    Massage is also healing, and it can be especially good to get a vigorous rubdown
    or a deep, invigorating massage. Use corn or calamus oil, both of which are invigorating;
    or get a dry massage, using a silk glove to stimulate the skin and the lymphatic
    system. You may want to add a few drops of a stimulating essential oil like jasmine,
    ylang ylang, citrus, or lavender. You can also use these for aromatherapy, stimulating
    your sense of smell throughout the day. If you are congested, use eucalyptus.


    Take a deep breath. You can use the energizing breath technique whenever you get
    sluggish or have difficulty waking.


    * * *


    Energizing Breath


    Breathe in and out through your nose as fast as you can, as if your chest were
    a bellows. Make the in-breath and out-breath equal in length. Do this for twenty
    to thirty seconds at first, working up to a minute or two. Stop and slow your
    breathing if you feel light-headed.


    * * *


    You might also try the yogic right-nostril breathing. Inhale through the right
    nostril and exhale through the left, covering the other side with your thumb or
    forefinger. Continue breathing in this way for a few minutes, until you feel rebalanced
    and energized.


    **Change with the seasons.** Earth energy is often aggravated in the spring, when
    the weather becomes cool and damp. If you’re an earth type, you need to stay warm
    and dry in the spring.'
