- fmt: '

    This herbal therapy has long been used to treat depression. It is often considered
    less effective for *severe* depression (Davidson et al. 2002), but researchers
    have concluded that St. John’s wort *is* helpful for mild to moderate depression,
    especially with anxiety (Linde, Berner, and Kriston 2009). Side effects are mild,
    and can include slight sedation, restlessness, or nausea. St. John’s wort may
    interfere with certain medications, including psychotropic drugs and birth control
    pills, so be sure to tell your doctor if you are taking it.


    **Do not take for bipolar depression or add to an antidepressant without medical
    supervision.**


    Passionflower: 1 to 2 capsules (or 10 to 20 drops) up to three or four times per
    day as needed for anxiety.


    Passionflower is a gently calming herb, shown to be as effective for anxiety as
    a potent antianxiety drug, but with far fewer side effects (Akhondzadeh et al.
    2001). It may not lift mood directly, but passionflower can provide much-needed
    calm during the storm of anxious depression. It may be used just occasionally,
    but if anxiety is persistent, it can be taken three or four times daily for up
    to several weeks.


    ## Agitated Depression


    Though it is less common than anxious depression, an increasing number of people
    suffer from depression characterized by states of agitation and irritability.
    Perhaps this is due to nonstop stress and fast-paced lifestyles, along with the
    stimulants used to fuel them: caffeine, energy drinks, sweeteners (either sugar
    or artificial), and drugs of all types. At the same time, many people haven’t
    the time or the ability to soothe themselves when they feel upset or overwhelmed.


    Agitation can be easily overlooked because people usually describe their moods
    as simply “depressed.” A closer look, however, will show that instead of sadness,
    there is a degree of edginess to their moods. When they say they feel “bad,” that
    means they feel angry, irritable, or aggressive. Their brains are on overdrive
    from the internal stimulants norepinephrine and dopamine.


    ![Diagram: High Norephinephrine, High Dopamine](Images/fig4.5.jpg)


    Josh’s Story


    “I’m depressed and I can’t sleep. My doctor put me on Prozac and I felt much worse!”


    Josh is a forty-two-year-old executive on the fast track. Always driven, he had
    become compulsive about both work and exercise. He put in twelve- to fourteen-hour
    days, got up at 4:30 a.m. to exercise, and fueled himself with a high-protein
    diet and tons of caffeine. Josh was depressed, but he was also physically restless,
    cranky with his kids, and critical of nearly everyone. He couldn’t sleep because
    his mind could not settle down. Faced with a failing marriage and negative feedback
    at work, he finally gave in to friends’ suggestions that he get help.


    His first move was to get on Prozac. Like many people with agitated depression,
    Josh had a paradoxical reaction—the medication made him feel more agitated and
    moody. That scared him enough that he was willing to make some significant lifestyle
    changes. He curbed his caffeine and scheduled downtime for himself and quality
    time with his family. He added the soothing supplements below, with a special
    focus on his sleep.


    His anxiety and irritability improved greatly. He was still depressed, however,
    so we added a very low dose of a less stimulating serotonin drug—just 10 mg of
    citalopram. He only needed it for a few months, and could then sustain his mood
    through lifestyle changes and supplements.


    ### DO YOU HAVE A DOPAMINE-NOREPINEPHRINE EXCESS?


    Mark each of the following statements that describes you at this time:


    *   My mood is angry or irritable.

    *   I have insomnia.

    *   I have acid indigestion.

    *   My energy is restless and excessive, but at times I may feel extremely fatigued.

    *   I have an overactive mind and am easily agitated.

    *   I have feelings of hostility.

    *   I am often driven or compulsive.

    *   I typically overreact to stress by becoming more upset or ill-tempered.

    *   I easily become critical or rejecting.

    *   I am usually unaware of feelings of low self-esteem.

    *   I tend to be rejecting in relationships.

    *   I am sensitive to changes in light, often feeling more wired or restless in
    spring or summer.

    *   I have strong emotional challenges with my monthly cycles (premenstrual syndrome).

    *   I have had problems with drug abuse or a family history of alcoholism or drug
    abuse.

    *   I have high blood pressure.


    ### Scoring


    Add the total number of items checked.


    *   1–5: mild dopamine-norepinephrine excess

    *   6–10: moderate dopamine-norepinephrine excess

    *   11–15: severe dopamine-norepinephrine excess


    Remember that this is only a reflection of your current brain chemistry, and you
    can rebalance using the soothing supplement program below and by following all
    of the pathways to joy.


    ### Natural Therapies to Soothe Agitated Depression


    If your scores suggest a norepinephrine-dopamine excess, or if you have signs
    of an agitated depression, the following supplements may help bring you back into
    balance. Start with the first supplement listed and add the others only if you
    don’t feel better within three to four weeks.


    *   **L-theanine**: 100–200 mg twice daily. The key to recovering from agitated
    depression is to focus on calming the brain. `L-theanine` is an amino acid that
    helps regulate dopamine and norepinephrine and also supports the key role of `GABA`,
    the brain’s primary calming chemical (Nathan et al. 2006). `L-theanine` can improve
    attentiveness while calming brain activity and soothing agitated emotions. It
    is well tolerated, but if you feel sedated or fuzzy-headed, you could take it
    at bedtime.

    *   **5-HTP**: 50–100 mg up to three times daily. Boosting serotonin levels can
    also soothe agitation, so adding `5-HTP` can be helpful here as well as with anxious
    depressions. Start with 50 mg daily and increase gradually, by 50 mg every three
    to days. Be careful that agitation does not get worse (as often happens with SSRI
    medications). **Do not take 5-HTP with a medication without your doctor’s supervision.**

    *   **NAC**: 600–1200 mg twice daily. N-acetyl cysteine (`NAC`) is an amino acid
    that is converted into glutathione, a potent antioxidant in the brain. It has
    a calming effect, and when added to other remedies (including medications), it
    can help relieve depression (Berk et al. 2008). It causes few side effects except
    for occasional nausea, constipation, or loose stools.


    ## Sluggish Depression


    This pattern of depression can occur at any time, but it is more common in winter,
    when the body thinks it is time to hibernate. It can also be the end result of
    prolonged stress or other types of depression if they lead to a state of depletion
    in the brain chemicals that keep you energized and motivated: dopamine and norepinephrine.


    Many people picture this pattern when they think of “clinical depression,” in
    part because the symptoms make it hard to hide sluggish depression. Mood is often
    described as sad, down, or simply dulled. Both and body seem to move slowly, as
    if shrouded by fog or carrying an extra-heavy burden. Sleep (as much as twelve
    to fourteen hours a day) is often seen as a welcome escape but is seldom restoring.
    It is common to lose interest in normal pursuits and find little pleasure in anything.


    ![Diagram: Low Norepinephrine, Low Dopamine](Images/fig4.6.jpg)


    Joanne’s Story


    Joanne is in her mid-fifties and married with two grown children. She has always
    struggled with weight, adding a few pounds each winter, and even more so with
    menopause.

