    ***


    检查你勾选的所有项目，并尝试改变任何可以改变的。火元素失衡最常见的两个原因是剧烈的、长期的压力以及忽视了表达情绪的需求。你将在第三部分找到更多关于压力和情绪的内容。同时，以下是任何人都可以采取的简单、常识性的措施，有助于帮助火能量恢复平衡。


    ## 平衡火元素的七条准则


    ### 白天保持清凉

    规律的作息至关重要。目标是每天在同一时间起床和睡觉。为了减少胃酸引起的问题，千万不要跳过餐，也不要等到极饥饿时才吃。吃吃早且清淡的晚餐，这样睡觉时就不会太饱。如果可能，避免在一天中最热的时候外出或运动。保持合理的工作心态，在工作与娱乐之间维持健康的平衡。定期休息，理想情况下每隔一个半到两小时休息。


    记住定期留出大量时间进行反思和更新。


    ### 针对你的类型明智饮食

    食物应该带来清凉和质感，以帮助火能量恢复平衡；考虑“轻盈、夏季的食物”，包括丰富的新鲜水果蔬菜。火类型的人只需要少量到中量的蛋白质，几乎或不吃红肉。尽量减少辛辣食物（如辣椒）或油腻食物（包括油炸食品）。保持规律用餐时间，如果可能，以午餐为主餐（晚餐要清淡）。适量进，既不禁食也不放纵大餐。饭后花时间放松。全天喝充足的温水（如果喜欢，可以加柠檬或青柠）。从列表中选择你的食物。


    #### 火元素平衡食物：

    *   **概述：** 含有大量新鲜水果蔬菜的轻盈食物


    #### 推荐食物：

    *   **乳制品：** 牛奶、奶油、黄油、酸奶、乡村奶士、蛋蛋白

    *   **肉类：** 较量的鸡肉、火鸡肉、虾

    *   **豆类：** 豆腐、小扁豆、鹰嘴豆、小黑豆或红豆

    *   **坚果和种子：** 杏仁、南瓜子和葵花籽

    *   **油：** 橄榄油、核桃油或椰子油；酥油油

    *   **谷物：** 大麦、燕麦、小麦、白米、藜麦

    *   **蔬菜：** 嫩的沙拉蔬菜、叶菜、芦笋、芹芹、西葫芦、豆角和豌豆；十字花科蔬菜（西兰花、花菜、卷心菜、小白菜、抱甘蓝）

    *   **避免茄科**（土豆、西红柿、辣椒、茄子）。它们经常会导致容易炎症的人关节疼痛。

    *   **水果：** 苹果、樱桃、葡萄、芒果、甜瓜、橙子、梨、桃、菠萝、椰子、石榴、梅子、葡萄、各类浆果

    *   **香草和香料：** 豆蔻、香菜、欧芹、罗勒、薄荷、肉桂、孜然、莳萝、茴香、柠檬和青柠、留荷、红红、姜黄


    ### 顺应身体运动

    你需要更规律的运动来平衡火能量——但要注意不要变得太具有竞争性。


    *   **理想运动：** 游泳（或其他水上运动或冬季活动）。无论选择什么，它应该是你喜欢的，且不会变得过分强迫或竞争。目标是每周三到五次，每次三十到四十五分钟。

    *   **亲近自然**（特别是水边）并与他人在一起是加分项。考虑划船、轻跑、骑行、滑雪或滑冰。

    *   **最佳身心运动：** 太极、瑜伽


    ### 妥善休息

    火类型的人通常比别人需要的睡眠更少，但当火能量过度时，他们往往会在半夜醒来（通常在凌晨 `2:00` 到 `4:00` 之间），并可能难以入睡。早点睡觉以确保获得良好的睡眠是非常重要的。留出三十到四十五分钟进行放松的睡前程序，就像明智的父母对待孩子一样。调暗灯光，关闭电脑或电视，读读故事或洗个凉水澡。如果你喜欢热水澡，请在睡前至少一小时洗，这样你在入睡时身体正在冷却。此外，花时间白天运动（不要在晚餐后）。如果你喜欢，睡前可以喝一杯加了少量豆蔻或肉豆蔻的热牛奶。


    睡前避免酒精；它看起来可能让你放松，但会进一步干扰你的睡眠。


    ### 回归感知

    对于火类型的人来说，最能慰藉他们的感觉是视觉。享受自然景观，眺望湖泊、山谷或落日非常好。如果没有方便，花卉、绘画或照片也可以吸引火类型的感官。


    按摩也有治愈作用，对火类型敏感的皮肤特别有效。使用葵花籽油或椰子油，两者都是清凉的。你可能想加入几滴舒缓的精油，如薄荷、玫瑰或檀香。你也可以使用这些气味进行芳香法，或全天向皮肤喷洒清凉的玫瑰水或檀香水。


    ### 深呼吸

    当你感到焦虑或在半夜醒来时，可以使用镇静呼吸法（之前为空气类型推荐的）。


    你也可以尝试瑜伽左鼻呼吸法。从左鼻吸气，从右鼻呼气，用手指遮住另一侧。以此方式持续几分钟，直到你感到平衡。


    随季节变化。火能量在夏季往往会加剧。如果你是火类型，你需要保持凉爽和干燥。


