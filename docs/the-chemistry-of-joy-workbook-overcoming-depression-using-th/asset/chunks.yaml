    亨利·陶文（Henri Nouwen）是一位曾深受抑郁症困扰的天主教神父作家，他写道：“快乐并非仅仅偶然发生。我们必须选择快乐，并且每天都坚持选择”（Nouwen
    1994, 29）。这是一个发人深省的陈述。“选择快乐”意味着什么？


    在情感韧性方面，选择快乐意味着选择完全地敞开启那些我们经常忽视的经历——那些并没有那么威胁性、不至于占据我们生存本能式注意力的经历。它们可能是生活中的大事事件：出生、婚礼、节日、各种新的开始。它们也可以是微小发生的事：孩子们玩耍的笑声、夏夜黄昏时分水鸟的鸣声、晚餐桌旁好朋友投来的温暖眼神，或者在一个温暖的夏日夜晚，在看台席上庆祝你最喜欢的棒球球队获胜。


    刻意地关注愉快的事物，需要我们一次又一次地选择花时间去敞开心这些时刻正在发生的事情。你上一次真正观察日落是什么时候？是真正完全敞开去感受那场奇妙的色彩盛宴，而不仅仅是匆匆一眼？你上一次真正感受到孩子的拥抱是什么时候，当你深情地看着他的脸时？或者是尝到夏天第一颗成熟的树莓是什么时候？你忙碌的生活以及对即将发生的事情的关注，可能会让你无法沉浸在那些带来快乐的时刻。


    日常生活中的正念是这些自然倾向的解药。培养寻找愉快事物、向其敞开心扉并将其稳固地植根于你的意识中的习惯，将将带来丰厚的回报。这个简单的“三件快乐”练习每天只需几分钟，是培养对你经常错过的事物保持正念关注习惯的方法之一。


    ### 三件快乐练习


    1. 在一天结束时，给自己留时间进行书面反思。你可能希望用一个特殊的笔记本或日记来进行这项练习。

    2. 静静坐几分钟后，反思并记录今天你遇到的三件快乐。起初可能很困难，但通过练习它会变得更加自然。如果你开始时有困难，可以尝试按时间顺序回顾你的一天。或者，你可以使用一个简单的结构，回顾通过感官感受到的愉快事物：视觉、听觉、嗅觉、味觉、触觉。或者回想你今天与人的互动，回想起友善的话语、帮助或分享的新闻。

    3. 写作时，花时间详细回忆这些事件，并敞开启身体的感受和充盈脑海的思绪。让这些快乐浸入内心，真正享受它们。尽可能详细地写下来。

    4. 早上，预判新一天可能带来的任何愉快的事情，并设定你的意图对惊喜保持开放。

    5. 白天花时间在安静的时刻回忆或与朋友分享来品味当天的快乐。将故事告诉他人是产生更多快乐的方式，并将经历锚定在你的意识中。


    ### 总结第 7 章


    * 情感韧性是指以正念、非评判的接纳，完全敞开启你情感体验中日常起伏伏能力。

    * 情感是人类的基本体验，对你的生存至关重要。每种情感经历都有自然的流动周期：它到来，停留一段时间，然后离开。没有任何一种情感是永久的。

    * 由于早期的学习或其他经历，你可能发展出了干扰这种流动的情感体验模式；你的情感生活可能受到断裂、抵抗、固着或淹没的限制。

    * 使用正念技巧和你自己的洞察来处理这些模式，可以消除它们，并让你以一种让你具有韧性并让你完全活过来的方式来敞开启所有情感。

    * 完全敞开启愉快的情感体验将平衡你的观点，并成为快乐的源泉。


    # 第 8 章


    ![认知的符号](img/fig1.6.jpg)


    ## 认知：成为自己智慧的源泉


    *在我们内心有许多未标记的区域，在探索我们的阵风和风暴时，必须考虑到这些区域。*

    *乔治·艾略奥特（George Eliot）*


    劳伦（Lauren）瘫在治疗室的沙发上，眼里流下了泪水。“我不知道发生了什么，”她说，“前一分钟我还在为我的大一英语课写论文，三十分钟后我就会在房间里哭泣。我感到非常绝望，从那以后就一直抑郁。但最糟糕的是，我不知道为什么。我觉得自己快疯了。”


    劳伦并没有疯掉，她只是对自己来说是个陌生人。她必须了解她那未标记的内心领土，以便理解在她被如此强烈的情绪占据时发生了什么。她需要更完全地理解自己，以便更熟练地处理内在发生的一切事情。


    大多数人都能识别出自己曾被一种突然、凭空产生的强烈感受所占据的时刻，并且许多人对这些感受引发的冲动行为感到遗憾。除了不愉快或恐惧之外，这些情感风暴有时会为抑郁发作开启大门，正如劳伦所担心正发生在她身上那样。


    劳伦发生的事情可以被视为一场情感海啸：那种情感压倒性的、足以让你措手无策的经历。在本章中，我们将引导你仔细审视你曾被这种风暴占据的时刻。仔细审视这些非常不愉快经历有两个原因。首先，看到这些是常见的人类反应是有帮助的，它们并不意味着你疯了或失控了。其次，当你了解更多关于自己未标记领土的知识时，你将对自己处理这种情感倒倒性经历的能力感到更有信心，并在面对它们时更有勇气。


    ### 情感海啸


    你没有意识到自己内心世界的某些部分是不可避免的。每个人都是如此。你一天的大部分时间都在处理外部世界：维持生活、与人交往、穿梭于日常生活。自然地，你对管理日常生活所需的自我部分更为熟悉。你甚至可能被诱去安排生活，让自己留在舒适区内。你可能想避免扰乱你的经历，远离可能让你不快的人。你可能特别想避免内心那些让你担忧或困惑的事情。只要你觉得能控制外部和内部世界，你就感到很安全。然而，我们没有人能一直保持那种控制。疾病、失去、拒绝、具有威胁性的想法——所有这些经历都是人类领域的一部分。


    在不同程度上，情感海啸发生在每个人身上，当它们来临时，它们会威胁到你的可预测性和控制感。好消息是，从中学习并减少它们可能造成的伤害是可能的。通过正念策略的帮助，你可以学会识别情感风暴的早期，在风力增强时放慢速度，并阻止自己做出加剧损害的行为。你甚至可能从风暴经历中学到足够的知识，从而在未来避免它们。


    ### 处理情感海啸


    回想你经历过像劳伦那样的压倒性经历时刻。也许你感到胃里空空的，所有的能量似乎都流失了；或者也许有人忽视了你，你充满了愤怒。也许在聚会中，你感受了孤独感，并对永远无法属于任何地方感到绝望。在读完下面对劳伦经历回顾的描述后，请花时间写写你自己的一个情感海啸。


    劳伦的故事


