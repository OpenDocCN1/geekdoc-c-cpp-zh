    ___________

    ___________


    品味这种体验。你在这种体验中回想起的自我就是你的黄金自我：你的本质，关于你是谁以及你可以成为谁的真相。你将使用刚刚写的短语作为与自己建立新关系的基础，这种关系的特点是与自己做朋友，并愿自己拥有所有美好。


    ## 为自己练习慈悲


    慈悲冥想是一项有 2600 年历史的练习，旨在愿自己和他人拥有我们所有人最渴望的东西：健康、幸福、快乐、内心平静等等。在传统形式中，这种练习在坐姿冥想中进行，由一系列三个或四个表达意图的陈述组成，配合呼吸反复念诵。这组传统的愿望仅仅是一个例子：


    愿我充满慈悲。


    愿我身心健康。


    愿我平和安康。


    愿我快乐。


    冥想从关注自我开始，可能需要停留很长时间。最终，愿望会扩展到我们爱的人、熟悉的人、让我们困难的人，最终是所有众生。这是一项深刻的练习，对心的慈悲能力产生巨大影响。它还能创造社交连接和支持，增加生活满意度并减少抑郁症状。


    ### 慈悲冥想的益处


    慈悲冥想的练习似乎与减少抑郁症状和提高整体生活满意度有关。2008 年，北卡罗来纳大学教堂山的 Barbara L. Fredrickson 与密歇根大学的同事发表了一项研究结果，研究中
    139 名成年参与者中约一半被随机分配练习慈悲冥想，另一半则没有。练习冥想的人报告随着时间的推移，正向情绪、正念、目标感和社会连接的增加。这些因素被证明是抑郁症状减少和整体幸福感的预测指标。


    作为从羞耻和自我拒绝中痊愈的一部分，建议你练习慈悲冥想的起始阶段：关注自我的阶段。使用你在上一个练习中确定的三个或四个关键词或短语，创造你自己的的一组愿望。例如上述给出的词，愿望将会是：


    愿我无惧。


    愿我强大。


    愿我充满活力且健康。


    愿我感到被爱与被接纳。


