    *   **Snacks**: Yogurt with nuts; low-fat string cheese; nonfat smoothie with
    added `protein powder`.

    *   **Herbs and spices**: Fresh basil, thyme, parsley, oregano, or mint; black
    or cayenne pepper, cardamom, celery seeds, cinnamon, cloves, ginger, lemon, mustard,
    sage.


    ### Move in tune with your body.

    Earth types need the most regular and vigorous exercise to stay balanced—ideally
    every day. Since energy and motivation can be a challenge, consider finding a
    workout partner, taking a class, or hiring a personal trainer.


    *   **Ideal exercise**: Interval training. With any activity you choose, go slowly
    for two to three minutes to warm up. Over the next few minutes, increase the intensity
    until you push nearly as hard as you can—but just for a minute or so. Then back
    down to a more relaxed pace for a couple of minutes, allowing yourself to recover
    before ramping up the intensity again for a minute. Repeat this cycle four to
    five times for a great energy-boosting workout.


    Competitive sports can also be a good way to get energy flowing. As your energy
    returns, aim for forty-five to sixty minutes of exercise most days. You should
    break a sweat and get your heart rate elevated.


    It is also helpful to combine aerobic and weight training. And remember, walking
    is nearly the perfect exercise!


