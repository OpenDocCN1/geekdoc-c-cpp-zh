  trans: "\n\n* 食物提供的信息会对身体产生积极或负面的影响。食物中的健康营养素能为身体提供信号，使其按照设计设计的方式运作。\n* 有五种饮食“阻碍”可能会加剧焦虑、抑郁或其他与压力相关的情绪问题：\n\
    \    * 整体饮食不健康\n    * 血糖波动\n    * 消化功能异常\n    * 过度炎症\n    * 食物过敏和不耐受\n\n# 第 4\
    \ 章\n\n![平衡符号](img/fig1.2.jpg)\n\n## 平衡：支持你的大脑\n\n*如果抑郁正悄悄袭来且必须面对，请了解这种猛兽的本质：你可能会逃脱，而不会被它撕碎。*\n\
    \nW. R. Shepherd 博士\n\n“我的朋友们建议我尝试药物，但我不知道。我听到别人抱怨副作用，或者不确定它们是否真的有效。我尝试了健康饮食和运动。难道我还能做些什么吗？”\n\
    \n当仅靠饮食和生活方式不足以维持健康的心情时，我们认为最好的办法是发现大脑失衡之处，然后尝试通过智能地补充营养补充剂来弥补。如果仍然不足，那么在谨慎和明智的情况下使用药物，可以在你追求更自然、可持续且健康的大脑功能的同时，提供症状缓解。\n\
    \n本章将为你提供创建自己的“韧性大脑计划”所需工具，以及足够的大脑科学知识，帮助你理解这些机制是如何维持你情绪的、可能会出现什么问题以及你可以如何应对。在学习本章后，你将能够：\n\
    \n* 使用问卷识别抑郁的三种亚型，帮助你确定自己是否倾向于其中一种类型。\n* 决定你可能是否存在某种特定的大脑化学物质失衡，并理解其后果。\n* 创建你自己的个性化补充剂计划，以建立坚实的营养基础并帮助恢复平衡。\n\
    * 了解何时需要药物，以及根据你的大脑化学物质失衡类型，哪些是你的最佳选择。\n\n本章包含大量信息，可能会让你感到无从从。记住，这是一个过程，你不需要一次性改变所有，也不需要做到完美。本章围绕三种截然不同的抑郁亚型进行组织，因此你可以关注与你最相关的领域。\n\
    \n### 抑郁的三种亚型\n\n如今，“抑郁”和“焦虑”等术语的使用非常广泛。你可能认为，例如，“大抑郁症”的诊断指的是一种对特定治疗有效的单一疾病。然而，许多被贴上此诊断的人在症状上可能存在巨大差异，这反映了他们大脑化学状况的不同。要记住，抑郁并不是单一的实体，如果你能精炼对它的理解，你可能找到一条更直接的出口。\n\
    \n我们发现，将抑郁分为三种亚型是有用的：\n\n* *焦虑型抑郁*（Anxious depression）：情绪低落，并伴有强烈的焦虑、不安全感和冲动。\n\
    * *躁动型抑郁*（Agitated depression）：以愤怒或易怒为主情绪，通常伴随着身体躁动，有时还会有强迫行为。\n* *迟钝型抑郁*（Sluggish\
    \ depression）：情绪迟钝或平淡，有强烈的疲倦、困意和缺乏动力。\n\n这些不同的模式通常反映了非常不同的大脑化学物质失衡。通过以下问卷，了解你是否倾向于这些抑郁亚型之一。\n\
    \n#### 你是哪种类型的抑郁？\n\n对于每个问题，请勾选最符合你情况的答案。如果多个答案似乎都符合，请勾选两个或三个：\n\n1. 我的情绪主主要是：\n\
    \    * a. 焦虑、压力大或极多变。\n    * b. 易怒、躁动或容易 upset。\n    * c. 悲伤、情绪低落或平淡。\n2. 我的思维倾向于：\n\
    \    * a. 恐惧，扫描感知到的危险。\n    * b. 充满评判或怨恨。\n    * c. 迟钝、变变慢。\n3. 大多数时候，我的体力状态是：\n\
    \    * a. 紧张、波动且容易疲劳。\n    * b. 坐立不安、躁动，并容易出现耗竭期。\n    * c. 迟钝且无精打采。\n4. 我经常在方面遇到困难：\n\
    \    * a. 入睡困难，主要是由于担心和大脑难以停止运转。\n    * b. 难以维持睡眠，因为我容易被扰醒，大脑非常活跃。\n    * c. 早上醒来困难；我觉得自己可以睡大部分时间，但从没有感到休息过。\n\
    5. 我通常通过以下方式应对压力：\n    * a. 感到心力交瘁和不知所措。\n    * b. 变得更加“亢奋”或愤怒。\n    * c. 感到被动或想要放弃。\n\
    6. 我通常对感知到的批评做出反应：\n    * a. 感到敏感或被拒绝。\n    * b. 变得具有防御性或愤怒。\n    * c. 退缩或关闭自我。\n\
    7. 在我的许多关系中，我变得：\n    * a. 有些粘人或依赖。\n    * b. 相当具有敌意或怨恨。\n    * c. 相当疏远或内向。\n\
    8. 我的食欲最近是：\n    * a. 特点是对对甜食和其他碳化合物的渴望和暴食。\n    * b. 波动，伴随频繁的消化不良或胃不适。\n    *\
    \ c. 减少，因为对食物的兴趣降低。\n9. 我的动力似乎：\n    * a. 虚弱、基于恐惧、受不安全感驱动。\n    * b. 驱动力强，可能带着一丝绝望。\n\
    \    * c. 减少、平淡、冷漠。\n10. 对于快乐，我倾向于：\n    * a. 冲动地寻找任何东西来填补空虚并让我感觉好受。\n    * b.\
    \ 强迫性地驱动，甚至是成瘾，感觉我得到了我渴望的。\n    * c. 被动的，对快乐几乎没有兴趣或享受。\n\n#### 评分\n\n统计选择以下答案的数量：\n\
    \n* a: ___________（对应焦虑型抑郁）\n* b: ___________（对应躁动型抑郁）\n* c: ___________（对应迟钝型抑郁）\n\
    \n你的得分可以帮助你决定下面的哪一组建议对你最有帮助。如果你在某一个类别中的得分显著较高，那么从针对该类型的建议开始。如果你不确定自己的结果，请一位了解你的人帮助你完成问卷可能会有帮助。此外，请填写本章稍后部分关于神经递质失衡的额外问卷。\n\
    \n### 情绪的化学物质\n\n神经细胞（也称为神经元）通过名为*神经递质*的化学物质的帮助下进行相互通信。这种大脑化学物质有很多，但提到抑郁时，大三者是血清素、多巴胺和去肾上腺素。\n\
    \n![图表：等量的血清素、多巴胺和去肾上腺素](img/fig4.1.jpg)\n\n血清素可以被认为是*幸福化学物质*。它许多许多功能，包括冷静大脑、安抚情绪和控制行为冲动。当它缺乏时，通常的结果是焦虑型抑郁，尽管血清素缺乏也可能涉及三种类型的抑郁。\n\
    \n"
