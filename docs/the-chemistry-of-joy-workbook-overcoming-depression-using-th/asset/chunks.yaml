    \ is:\n    * a. tense, fluctuating, and easily run down.\n    * b. restless, agitated,\
    \ and prone to periods of exhaustion.\n    * c. sluggish and lethargic.\n4. I\
    \ frequently have trouble:\n    * a. falling asleep, largely due to worry and\
    \ difficulty shutting down my mind.\n    * b. staying asleep, as I am easily disturbed\
    \ and my mind is very restless.\n    * c. waking up in the morning; I feel like\
    \ I could sleep most of the time yet never feel rested.\n5. I typically react\
    \ to stress by:\n    * a. feeling frazzled and overwhelmed.\n    * b. becoming\
    \ more “revved up” or angry.\n    * c. feeling passive or wanting to give up.\n\
    6. I usually respond to perceived criticism by:\n    * a. feeling sensitive or\
    \ rejected.\n    * b. becoming defensive or angry.\n    * c. pulling away or shutting\
    \ down.\n7. In many of my relationships, I have become:\n    * a. somewhat clinging\
    \ or dependent.\n    * b. rather hostile or resentful.\n    * c. fairly distant\
    \ or withdrawn.\n8. My appetite has recently been:\n    * a. marked by cravings\
    \ and binges on sweets and other carbohydrates.\n    * b. fluctuating with frequent\
    \ indigestion or stomach upset.\n    * c. reduced, as I have less interest in\
    \ food.\n9. My motivation seems:\n    * a. weak, fear based, driven by insecurity.\n\
    \    * b. driven, perhaps with an edge of desperation.\n    * c. reduced, flat,\
    \ apathetic.\n10. With regard to pleasure, I tend to be:\n    * a. impulsively\
    \ searching for anything to fill the void and make me feel better.\n    * b. compulsively\
    \ driven, even addictive, feeling that I’ve got what I desire.\n    * c. passive,\
    \ with little interest or enjoyment of pleasure.\n\n#### Scoring\n\nCount the\
    \ number of answers that were:\n\n* a: ___________ (corresponds to an anxious\
    \ type of depression)\n* b: ___________ (corresponds to an agitated type of depression)\n\
    * c: ___________ (corresponds to a sluggish type of depression)\n\nYour score\
    \ can help you decide which set of recommendations below will be most helpful\
    \ to you. If you scored significantly higher in one category, then begin with\
    \ recommendations for that type. If you’re unsure of your results, it may help\
    \ to ask someone who knows you well to help you complete the questionnaire. Also,\
    \ fill out the additional questionnaires later in this chapter on the neurotransmitter\
    \ imbalances.\n\n### The Chemicals of Mood\n\nNerve cells (also called neurons)\
    \ communicate with one another with the help of chemicals called *neurotransmitters*.\
    \ There are many such brain chemicals, but when it comes to depression, the big\
    \ three are serotonin, dopamine, and norepinephrine.\n\n![Diagram: equal amounts\
