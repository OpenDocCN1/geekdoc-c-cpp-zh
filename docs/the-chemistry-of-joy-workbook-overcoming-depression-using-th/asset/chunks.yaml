  trans: "\n远见者了解你真实的自我，认同你本性的善良，并对你怀有特定的渴望。远见者并不要求你完美，也不会将你与那些比你更优秀、更聪明、更有动力或在任何方面更出色的人进行比较。远见者是通往你潜力的桥梁。当远见者参与其中时，你会感受到更多的能量和耐力。批评者的动力源于对你如果做不好会变成什么样人的恐惧，而远见者的动力源于对你想要成为以及已经成为的人格的爱。\n\
    \n## 愿景板：与你的远见者连接\n\n与你的远见者合作的一种极方法是创建一个愿景板。制作愿景板是一项激发你的渴望、直觉和自发性的活动。一旦你收集了必要的材料，大约一小时就能完成你的板板。\n\
    \n1. 你需要的材料包括海报板、剪刀、胶棒或胶带、马克笔，以及一叠有很多图片的杂志。将这些物品摆放在四周，回想你决定买这本工作手册的那一刻。你当时在哪里？它出的什么吸引了你？它激发了你怎样的希望？现在你通过这本手册对自己又有哪些希望？将它们记录在这里。\n\
    \n   ___________\n   ___________\n   ___________\n   ___________\n\n2. 有某种重要的东西存在于抑郁的疲惫和沮丧之下。尽管你有时觉得离这种生命力很远，但它并没有离开你。从这个地方触及你对生活的渴望，并尽可能保持这种联系，随意翻阅你的杂志。剪下或撕下任何引起你注意的文字或图像——无需任何理由！\n\
    \n   当你有了充足的材料后，尝试将它们放置在你的海报板上。不要担心放得对不对；在这个项目中没有对错之分。\n\n3. 完成你自己的愿景板后，静静地看着它，欣赏它，享受它。然后开始收获它的信息；用几个词或句子写下它告诉你的关于在这段旅程中对自己的意图。\n\
    \n   这是一个例子：阳光告诉我我多么渴望远离我所感受到的黑暗，气球暗示了浮力，旅行照片告诉我我多么渴望远离生活的单调，而跑鞋告诉我是时候行动起来了！\n\
    \n你的愿景板告诉你关于在这段通往韧性的旅程中，你最深层的渴望和自我意图是什么？\n\n   ___________\n   ___________\n \
    \  ___________\n   ___________\n\n4. 最后，看看你是否可以用一两句话来明确你在完成这本工作手册时对自己的意图。你越了解自己的意图，你的目标就越清晰，它为你提供的支持也就越稳固。\n\
    \n   示例意图陈述：`我将学习如何支持和增加我的体力能量。我希望在生活中获得更多的支持。我打算少听批评者的意见，多听远见者的。`\n\n   ___________\n\
    \   ___________\n   ___________\n   ___________\n\n## 从愿景到行动\n\n从愿景到行动的过程不是线性的。如果你深信可以设定一个目标并在执行过程中绝从毫不动摇，那么这段旅程可能会失败。失败并不是因为你缺乏意志或性格软弱，而是因为人脑的某些特征使得改变具有挑战性且是渐进的。持久的改变几乎总是运动活动与休息、巩固交替的过程。\n\
    \n在改变过程中存在着强烈的悖论。你可能认为在生活中做出积极、健康的改变应该是的，但你自己的生物特性可能会让这变得困难。我们的大脑天生于保持现状：\n\n\
    *   想法随着每一次重复而加强。这使得人们很容易一次又一次产生同一个想法，直到这些想法变成自动化的。\n*   任何可以交给无意识过程都会被交出去。这不仅是指血液供氧之类的事情，还包括日常习惯。你有多少次开车上班，却发现自己不记得路程的三分之四？\n\
    *   大脑活动会受到你正处于威胁之感知的影响。改变可能会让人感到受威胁，使更难以清晰地思考。注意力更多被威胁而非可能性吸引。对未来的希望让位于生存之后。\n\
    \n大脑的物理结构本身支持了它保留旧事物的倾向。意识的改变是困难的，因为大脑的构造设计是为了保护现状，包括我们的思维和感受习惯。然而，人类大脑充满了创新。在整个工作手册中，我们将为你提供策略，让你更有技巧地应对这种倾向。\n\
    \n***\n\n## 51% 解决方案\n\n当你遇到留在旧老路数上的倾向时，你会经历所谓的“阻力”。你可能认为自自己的某部分正在蓄意破坏你改变的愿望。我们更倾向于称之为“习惯能量”。这提醒我们，反复做同一件事本质上具有强化作用。有时人们会说这样的话：“我一定从中得到了什么，否则我不会一直做下去。”在这些话中，他们听到了批评者的声音。远见者可能倾向于说：“我知道我有能力改变，但让我们现实地看看这可能需要什么。”远见者将和你谈论\
    \ `51 Percent 解决方案`。\n\n`51 Percent 解决方案`认为，如果你做某件事的频率很高，改变就会到来。会有某些天你感到 100%\
    \ 同意，另一些天你想要缩回过去。只要在 51% 的时间里你迈出了新一步，你就能到达目的地。大脑的保守倾向就会变成你的盟友，因为你每次练习新习惯时，都是在加强支持它的神经通路。随着时间的推移，51%\
    \ 会变成 60%、70%、80%……而你创造了新的常态。\n\n***\n\n## 预测陷阱\n\n哪些抑制改变的思维和感受习惯？我们想与你探讨我们识别出的若干“失败路径”。如果参与这些心理、情感和社会行为的时间超过了\
    \ 50%，将导致你的改变路径陷入死胡同。你识别出其中的某些吗？我们提供了一些替代性的想法、感受和行动，以防你的某个失败路径已经变成了深陷的，以至于你看不见其他选择。\n\
    \n批评者会让你在上述失败路径中看到自己的每一个地方感到羞愧。相反，请听远见者的，他说：“尽管看起来失败路径和成功因素之间有一条分界线，但那条线实际上是一座桥梁。”\n\
    \n与你的远见者连接，填写下表。使用表中的失败路径或添加你自己的。\n\n## 支持正在变化的自我\n\n如何在滋养最好意图的同时，也留意阻力的力量？一个古老的切罗基故事可以阐明这个问题。\n"
