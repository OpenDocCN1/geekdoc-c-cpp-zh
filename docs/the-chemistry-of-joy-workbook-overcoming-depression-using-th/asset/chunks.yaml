    “I was sitting at the library, trying to write a review of Moby Dick. I didn’t
    like the book and I couldn’t seem to get started. I was starting to worry about
    getting it done on time. I overheard some people at the table behind me. It was
    my roommate, Tiffany, and three other girls from my dorm. Earlier, I had asked
    Tiffany if she wanted to study with me, but she said no, she wanted to go work
    out. But then there she was in the library with those girls she’s been hanging
    out with more and more. I got this sick feeling in my stomach, and suddenly I
    had to get out of the library. I ran into the deli on my way back to the dorm
    and bought a big bag of M&M’s. By the time I got to my room, I had eaten half
    of it. I was starting to feel sicker. I was crying and kept eating the candy.
    I remember thinking that I was never going to make friends at college. I heard
    this voice in my head saying, I told you so; I told you nobody likes you. I’ve
    felt horrible ever since, and I ended up starting a fight with Tiffany the next
    day. We haven’t talked to each since then and I don’t know what to say to her.”


    ### Your Experience:


    ___________


    ___________


    ___________


    ___________


    ___________


    ___________


    ___________


    ___________


    ___________


    Now go back and reread Lauren’s story, looking for lapses in her awareness. At
    the beginning she was aware of her thoughts about writing and her de-orry about
    finishing. But once she saw Tiffany with the others, she felt compelled to leave
    the library, to buy the candy, and to mindlessly eat it. What happened between
    those two moments? Lauren didn’t lose her mind, as she’d feared, but she did lose
    her mindfulness. She couldn’t come up with reasons for her behavior or for the
    strong anger that she felt toward Tiffany. The box explains what can happen in
    the brain that makes mindfulness so hard to hold on to. You will see that Lauren’s
    experience (and perhaps yours) sounds suspiciously like an `amygdala hijack`.


    ***


    # A Hurricane in the Brain


    Daniel Goleman, author of *Emotional Intelligence: Why It Can Matter More Than
    IQ* (1995, 18), coined the term “amygdala hijack.” Such a hijack occurs when the
    emotional system of the brain acts independently of the thinking part of the brain.
    Normally, information that the senses take in is sent to the `thalamus`. The `thalamus`
    usually relays that information to the `neocortex` (the reasoning part of the
    brain). From the `neocortex` it is then sent to the `amygdala`, the part of the
    emotional brain that sends out alarms to the rest of the body.


    In this way, thinking and feeling are coordinated. But under conditions of threat,
    the `thalamus` bypasses the `neocortex` and the emotional brain reacts without
    any of the moderating influence that thinking can provide. According to Goleman,
    an `amygdala hijack` is characterized by three things:


    *   Strong emotional reaction

    *   Sudden onset

    *   Realizing after the fact that the reaction was inappropriate


    ***


    Emotional tsunamis happen outside of your awareness, often leaving destruction
    in their wake. How might it turn out differently if you could bring mindful awareness
    right into the middle of such an intense, negative experience?


    ## Mapping the Path of the Storm


    Using a combination of reflection, visualizing, and journaling, Lauren was able
    to describe her experience in much more detail. With guidance she was able to
    follow the path of the storm from sensation to thought to interpretation to action.
    She breathed a sigh of relief that it “made sense.” She wasn’t going crazy after
    all. The following description includes Lauren’s closer examination of her experience,
    along with opportunities for bringing mindfulness into the heart of the storm.


    ### The Rising of Sensation


    Lauren remembered that when she had heard Tiffany’s voice and seen the girls together,
    she had felt a tightening in her shoulders and a sensation of hollowness in her
    stomach. Had Lauren been able to notice these sensations and recognize them as
    the beginning of a negative reaction, she might have been able to use them as
    warning signs that a storm might be on the way. Instead, she had no awareness
    of them as they occurred.


    #### FINDING THE POSSIBILITIES FOR MINDFULNESS


    *   Use the `Just a Minute Meditation` (see chapter 6) to slow things down.

    *   Recognize and name what is happening (“tight shoulders,” “sinking feeling
    in stomach”).

    *   Focus awareness on body sensations; it can take the punch out of the storm.


    ### The Entry of Thought


    Lauren identified the following series of thoughts: `There is Tiffany with Mary
    and Fiona. I had asked Tiffany to study with me and she said she wanted to work
    out. Now she’s here with them.`


    At this point, Lauren was objectively describing events to herself. There was
    no judging or evaluating going on; she was just noting what happened.


    #### FINDING THE POSSIBILITIES FOR MINDFULNESS


    *   Stay neutral and objective.

    *   Continue to strengthen awareness by recognizing that thoughts are coming up—and
    that they are *only* thoughts.

    *   Maintain awareness of breathing.


    ### The Flooding of Emotion


    Lauren had a lot of trouble recalling what happened next. Eventually she remembered
    several images—of herself eating lunch alone in junior high, of sitting home on
    Fridays while her friends began to date, and of being too afraid to try out for
    a school play. These images came so quickly that they were merely flashes in her
    mind.


    It was here that the `amygdala` began to hijack her experience. The images of
    earlier lonely experiences were triggered by the similar aloneness that Lauren
    experienced in the present.


    #### FINDING THE POSSIBILITIES FOR MINDFULNESS


    *   Intentionally slow down the breath.

    *   Recognize what is happening; name it as flooding or overwhelmed.

    *   Keep feeling the connection of your feet to the ground; notice strength in
    your legs.

    *   Remember the stillness at the center of the storm; try to connect with the
    observing self.


    ### The Entry of Story Line


    As Lauren remembered other times she had felt excluded, her mind began to add
    to her long-standing belief that she would never belong. She practically heard
    the words “People don’t like you. They think you are weird.”


    This is where the storm really took off. Thoughts images, beliefs, and memories
    combined in a swirl to create a believable story about how things are and will
    remain. The story line is made up of sensations, thoughts, emotions, and inner
    commentary about the meaning of what is happening. This story line intensifies
    the already distressing emotions.


    #### FINDING THE POSSIBILITIES FOR MINDFULNESS


    *   Direct awareness away from thinking, toward sensations in the body.

    *   Connect with the observing self: the part that is able to watch the thought
    stream and not get caught in it.

    *   Remember that all experiences pass; this will not last forever.


    ### The Urge to Escape from Feelings


    Lauren got up and left the library. She stopped at the student union shop to buy
    a large bag of M&Ms. Part of her wanted to resist eating the candy, but she couldn’t
    seem to help herself. Although she was focused on the sensations in her mouth,
    she didn’t taste anything. Her world seemed to contract around the crunch of the
    candy.


    At this point, the storm had taken over. Lauren reacted to the painful emotions
    as if they threatened her actual survival. The crunch of the candy and the sensations
    of melting chocolate distracted her from the intolerable feelings.


    #### FINDING THE POSSIBILITIES FOR MINDFULNESS


    *   Direct awareness away from thinking to sensations in the body.

    *   Practice grounding in the body: notice strength in the legs and feet making
    contact with the floor.

    *   Remember that even this can be worked with.


    # Acting Out or Acting In

