    It sometimes happens that a storm will drop you into a raging, flooding river
    before you have had time to build a sturdy raft. What if your partially built
    raft is sitting at the side of the river, and you see it as you rush by but can’t
    get to it?


    You may need to put a raft together out of the twigs and branches you can grab
    on to, and cling to that until the storm subsides. You have already learned some
    of the skills and beliefs you need. Improvising your raft under adverse conditions
    requires `RAW GRIT`.


    # RAW GRIT


    ![Recognize what''s happening/ Awareness/ Wait it out/ Ground yourself/ Remember
    the impermanence/ Intention/ Take refuge in others](Images/fig8.4.jpg)


    Have you ever seen the aftermath of a tornado or hurricane? Although it may look
    as if the damage can never be repaired, within hours of the storm’s ending, people
    are already clearing the wreckage. When the surface damage is cleaned up, what
    remains is the unharmed earth.


    Similarly, with your own storms, there is a part of you that cannot be damaged.
    This is your “big self,” the part of you that is connected to something larger—to
    the natural world, to the divine, to all of humanity. In the next chapters you
    will be guided to learn more about your big self and to learn practices to cultivate
    connection to it.


    ## Summing Up Chapter 8


    - Everyone is vulnerable to emotional storms.

    - It is possible to grow in self-awareness by bringing mindfulness to the experience.

    - The more identification there is with the small self and its beliefs, the more
    vulnerability there is to these storms.

    - Skills can be developed that limit and even avoid the damage created by emotional
    storms.


    # Part 4: The Heart Pathways


    ## Chapter 9


    ![Symbol for Connecting](Images/fig1.7.jpg)


    # Connecting: Come Home to Yourself


    *The time will come*

    *when, with elation,*

    *you will greet yourself arriving*

    *at your own door, in your own mirror*

    *And each will smile at the other’s welcome.*

    — Derek Walcott


    The cultivation of a “good heart”—a heart that is open, accepting of self and
    others, generous, loving, and joyful—is the very core of the resilient life. In
    this chapter we begin walking the first of the heart pathways: the one that leads
    you home to the self you have forgotten or lost along the way, the self you have
    perhaps closed out of your heart.


    The closing of your heart may have begun in a very forgotten moment—one in which
    you were hurt by a critical word or a cruel rejection. Over time you may have
    collected a great many supposed reasons why you are flawed, unworthy, broken,
    and in need of being fixed. Caught in the trap of self-rejection, you may have
    embarked on many self-improvement projects, all based on the belief that you are
    not good enough as you are.


    We invite you to consider that you are good enough exactly as you are. We invite
    you to open your heart to yourself, and begin the path of deep healing from shame,
    self-rejection, and the pain of disconnection. In this chapter we offer you the
    chance to explore and repair your patterns of shutting yourself out of your own
    heart, and share practices that will help you reconnect with your essential goodness.


    ### Mary Ellen’s Story: The Trap of Self-Rejection


    Mary Ellen, a gracious and poised woman in her late fifties, said, “You could
    sum up my entire life in two words: ‘report card.’ No part of Mary Ellen’s performance
    escaped her own relentless scrutiny and judgment. She found fault with every aspect
    of herself, set impossibly high standards, and—in her eyes—never reached them.
    Though others saw her as creative, engaging, intelligent, and accomplished, she
    was caught in the trap of self-rejection. She could not see herself as anything
    other than inadequate, unlovable, and unworthy. She drove herself to great lengths
    to compensate for her sense of deficiency, striving beyond expectations at work
    and giving unselfishly of herself to her family and community. She amassed a library
    of self-help books, seeking in each one the path to self-improvement that would
    free her from the tyranny of the report card. Eventually she reached a breaking
    point. Unable to push herself any longer, she fell into a depressive episode,
    which generated more self-contempt and judgment.


    At the root of Mary Ellen’s self-rejection is toxic shame, that insidious and
    powerful emotional delusion that says `I am defective. I am not worthy. I am unlovable.`


    Self-rejection divides you from yourself and from others. We believe that self-rejection
    and the shame at its root are primary causes of unhappiness and significant contributors
    to depression. We also believe that self-acceptance and healing from shame are
    possible, and that they open the door to a life of joy and resilience. This happens
    through healing the disconnection from self, through coming home to yourself.


    ## The Pathway of Self-Acceptance


    Self-acceptance is a process, not an event. Although each person’s path is unique,
    there are several key phases. You might find yourself cycling through them multiple
    times, as this is not a linear process.


    ### Taking the First Step: Calling a Truce


    Ending the inner war of self-rejection begins with calling a truce: setting the
    intention to befriend yourself. Rather than continuing to battle against herself,
    Mary Ellen opened her mind to the possibility that she could make peace with herself
    as she was and tear up the report card. This intention did not come easily, and
    it faded from time to time as the habitual ways of self-rejection cropped up again.
    With mindful acceptance she returned to the intention to befriend herself, and
    began again.


    ### The Next Step: Connecting with the Rejected Self


    Mary Ellen, like all who are caught in the trap of self-rejection, could see herself
    only through the eyes of her inner critic, who had nothing but contempt for her.
    On an intellectual level she realized her self-contempt was extreme and undeserved,
    but try as she might, she could not rid herself of the critical thoughts.


    In fact it is impossible to shift from self-contempt to self-compassion simply
    through thinking about it; only the heart can generate the healing power of self-compassion.
    And before the heart can feel compassion, it is necessary to really see the suffering
    that is happening. If you are at a distance from your suffering, if shame and
    self-contempt have hardened you to it, your heart remains closed.


    As Mary Ellen pondered these ideas, she told a story from her own experience that
    made this step of the process clearer to her. She lived in a large city and, on
    her way to work, often passed a woman at a traffic light, holding a sign that
    said `Homeless and desperate. Please give. God bless.`


    Seeing her from a distance, Mary Ellen hoped for a green light that would mean
    she could quickly pass by. When forced to stop at the intersection, she would
    avert her eyes, and her mind was filled with critical thoughts. Although some
    part of her was aware of the fact that she was judgmental and lacked understanding
    of the woman’s plight, the critical part of her dominated those moments at the
    intersection. Every once in a while, as she was falling asleep, the woman’s face
    appeared in Mary Ellen’s mind. Over time, she began to fantasize about working
    at a homeless shelter, and eventually began volunteering, serving meals and listening
    to stories that gave her a deeper understanding of the woman she had so judged
    and turned away from. When she met the people in the shelter face to face and
    heard their stories, her heart spontaneously opened, and the judgments subsided.

