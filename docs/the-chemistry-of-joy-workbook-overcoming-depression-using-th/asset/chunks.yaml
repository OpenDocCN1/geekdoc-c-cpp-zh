    停止哭泣后，洛伦感到麻木且精疲力竭。她谩骂自己是“失败者”和“可怜虫”。她太累了，无法继续写她的论文。她开始担心自己会在这门课上不及格，但又觉得尝试并不值得努力。第二天，她依然感到羞愧，不愿和蒂芬尼说话。当蒂芬尼问她怎么了时，她没有直视蒂芬尼的眼睛，说“没没事”，转过头去。稍后，她和蒂芬尼吵了一场架。


    洛伦现在筑起了两道墙。第一道墙在她和自己的感受之间。她所经历的自我厌恶太痛苦了，因此她在情感上变得麻木。不幸的是，她仍然有足够的能量来“内耗”：她继续因为自己长串的缺陷和错误而攻击自己。第二道墙在她和外部世界之间。她与其他人的疏离如此严重，以至于对他们几乎没有感觉，只有不信任和敌意——以及更多的反感。


    # 寻找正念的可能性


    - 执行`一分钟冥想`（见第 6 章）。

    - 注意到风暴体验的强度已经过去；现在情况不同了。

    - 记住风暴会发生在每个人身上。


    ## 风暴后的反思


    通过反思，洛伦能够识别出引发风暴的诱因，以及增加其速度的思维和情感模式。当她认为蒂芬尼在排挤她时，她能够感受到那种被放大的孤独和伤害，但通过她正念回溯的视角，她并没有被这些感受所淹没。她对自己获得了一种理智的认知，随着理解的到来，产生了一种对自己未未过的慈悲感。她觉得，她在这次反思中获得的智慧将帮助她在下一次情感风暴被触发时避免如此多的痛苦。


    # 寻找正念的可能性


    - 即使是像情感海啸这样的艰难经历，也有开始、经过和结束。它们的模式是可预测的。

    - 练习每天关注感受，甚至是关注每一个时刻。

    - 承认风暴是人类体验的一部分。允许自己也是人性，并从这些风暴中学习你可以学到的。


    ## 追踪自己的风暴


    找一个可以舒服坐下写字的地方。你可能想请一位好朋友陪你一起，帮助支持你的正念。坐下几分钟，仅仅专注于你的呼吸。然后，邀请一段关于你情感海啸的记忆进入脑海。从脑海中浮现的第一件事开始。在下方相应的类别下写下它的内容。你不需要从头开始；你甚至可能发现从风暴的结束开始向回推反而容易。写作的过程也可能帮助你慢下来，并填充你意识中的某些空白。通过耐心的关注，你的记忆甚至可能为你提供更多关于该经历的细节。这种经历通常更像是寻找拼图碎片并将其组合在一起，而不是讲述一个直白的故事。


    ### 感觉的升起


    当你回想起风暴时，你能与身体建立联系吗？是否甚至可能记得身体某处发生的最初的紧绷感：也许在你的脖子或喉咙、胸部、腹部或脸上？


    ### 思绪的侵入


    关于最初的想法，你还能记得什么？这些将是在你开始解释该事件之前正在发生的事情的想法。


    还有什么？


    还有更多的想法吗？


    ### 情感的泛滥


    你能记得并描述事情似乎加速的时间吗？也许可能有图像或旧记忆的闪回，又可能只是词汇或短语。


    别的吗？


    接下来发生了什么情绪和感觉？也许有愤怒或身体里的一阵热流。也许有悲伤，泪水涌上眼眶。是否有羞愧或尴尬？它们是如何影响你的？


    ### 叙事线索切入


    对于正在发生的事情，你对自己说了什么？


    叙事线索对你当时的感受有什么影响？


    ### 逃避情感的冲动


    是否有过某个时刻你想，`我处理不了这个了`？你想做什么？


    ### 外化或内化


    你接下来做了什么？


    你接下来是否参与了任何强迫性习惯？你是点了一支烟还是开始吃冰淇淋？还是其他了什么？


    你开始批评自己了吗？


    你开始和别人吵架了吗？


    ### 风暴后的反思


    哪里存在正念的可能性？你什么时候可以放慢速度？对你或你的关系造成了伤害吗？你如何修复它？你需要原谅自己吗？向别人道歉吗？


    以几分钟的`一分钟冥想`结束（见第 6 章）。


    ## 寻找风暴的种子


    是什么让我们的情绪可能这样被触发？为什么某些经历会变得如此难以 overwhelming？通常是因为我们的“小自我”在某种程度上感受到了威胁。


    小自我是我们身上关注我们自身保护和生存的部分。它承载着我们的个人故事，包括所有我们认为自己是错的或被他人辜待的方式。这些故事是否真实区别并不大。当我们沉浸在故事中或沉浸在对小自我的感知到的威胁中时，感觉似乎其他什么都不重要了。


    小自我认为自己是孤立的、与存在的其他部分分离的，因此它完全专注于自我保护。它认为自己是虚弱且脆弱的，不接受做人意味着有时是脆弱的。相反，小自我认为脆弱性是其构造中深层缺陷的标志。它认为必须尽一切努力去隐藏那个缺陷。当你的小自我感到受到威胁时，你就面临着压倒性情感风暴的风险。


    ## 小自我的威胁


    小自我有一个关于缺陷的看似无的信念列表：`你太胖了。你没有学历。你不会像别人那样通情世故。人们了解你后不会喜欢你。你不配得到像别人那样的待遇。`你可能可以在列表中添加几个熟悉的想法。这些想法大多源于以下感知到的威胁：


    ![表格：生存/意义感/归属感/匮乏 - 第 1 页 恐惧/信念](img/fig8.1.jpg)


    ![表格：生存/意义感/归属感/匮乏 - 第 2 页 洛伦的案例](img/fig8.2.jpg)


    ### 你感到怎样的？


    回顾你的情感海啸案例，通过填写下表来加深对它的理解。以下哪些核心威胁被激活了？产生了哪些信念？它们如何适用于你案例中发生的情况？你可能会发现自己最容易受到一个核心威胁的影响，或者是其中几个。


    ![空白表格：生存/意义感/归属感/匮乏](img/fig8.3.jpg)


    ## 建造救生筏


    之前的练习通过在海啸袭击并过去之后带来好奇心和反思来支持你的正念。这些练习帮助你为下一次风暴建造一个救生筏。要为你的筏子增加内容，请回顾你的写作，并花几分钟反思以下问题。


    是否存在某些情况让你更容易陷入海啸？描述它们。


    ___________


    ___________


    ___________


    哪些人是你发现自己更容易被触发的？他们是谁？他们之间有什么共同点？


    ___________


    ___________


    ___________


    为了更好地应对这些情况或这些人，你可以做什么？


    ___________


    ___________


    ___________


    在你的经历中，哪里你本可以调用正念技能来放慢过程或减轻伤害？


    ___________


    ___________


    ___________

