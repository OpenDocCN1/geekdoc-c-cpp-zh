  raw: 'Henri Nouwen, a Catholic priest and author who suffered with depression himself,
    wrote, “Joy does not simply happen to us. We have to choose joy and keep choosing
    it every day” (Nouwen 1994, 29). This is a provocative statement. What does it
    mean to “choose joy”?


    In terms of emotional resilience, choosing joy is choosing to open fully to those
    experiences we often overlook, those that are not so threatening that they grab
    our survival-minded attention. They can be the big events of life: births, weddings,
    holidays, new beginnings of all sorts. Or they can be small happenings: the laughter
    of playing children, the call of a loon at dusk on a summer evening, a warm look
    in the eyes of a good friend across the dinner table, celebrating your favorite
    baseball team’s victory from the bleacher seats on a warm summer evening.


    Paying deliberate attention to what is pleasant requires that we choose, over
    and over again, to take the time to open to what’s happening in these moments.
    When did you last really watch the sun set—really open to the entire, amazing
    show of color rather than simply give it a quick glance? When was the last time
    you really felt your child’s hug, as you looked deeply into his face? Or tasted
    the first ripe raspberry of summer? Your busy life and your attention to what’s
    coming up next can keep you from settling deeply into the moments that bring joy.


    Mindfulness in daily life is an antidote to these natural tendencies. Developing
    the habit of looking for what’s pleasant, opening to it, and planting it firmly
    in your conscious awareness will pay great dividends. This simple “three pleasures”
    exercise takes only a few moments each day, and is one way to cultivate the habit
    of mindful attention to what you often miss seeing.


    Three Pleasures Exercise


    1.  At the end of the day, give yourself some time for written reflection. You
    may wish to use a special notebook or journal for this practice.


    2.  After sitting quietly for a few minutes, reflect on and record three pleasures
    that came your way today. At first it might be difficult, but with practice it
    will become more natural. If you have trouble beginning, you might try recalling
    your day chronologically. Or you might use the simple structure of recalling pleasant
    things that came by way of your senses: sight, sound, smell, taste, touch. Or
    scan through your interactions with people today, recalling kind words or favors
    or sharing of news.


    3.  As you write, take time to recall these events in detail, and open to the
    sensations in your body and thoughts that fill your mind. Let the pleasures sink
    in, and really enjoy them. Write them down in as much detail as you can.


    4.  In the morning anticipate any pleasant things the new day might bring, and
    set your intention to be open to surprises as well.


    5.  During the day take time to savor the pleasures of the day by recalling them
    in a quiet moment or sharing them with a friend. Telling the stories to another
    is a way of generating more pleasure and of anchoring the experience in your awareness.


    ## Summing Up Chapter 7


    *   Emotional resilience is the capacity to open fully to the daily ups and downs
    of your emotional experience with mindful, nonjudging acceptance.


    *   Emotions are a fundamental human experience essential to your survival. Every
    emotional experience has a natural cycle of flow: it arrives, remains for a while,
    and passes. No emotion is permanent.


    *   Due to early learning or other experiences, you might have developed patterns
    of emotional experiencing that interrupt that flow; your emotional life might
    be limited by disconnection, resistance, fixation, or flooding.


    *   Working with these patterns using mindfulness skills and your own insight
    can undo them and allow you to open to all emotions in a way that makes you resilient
    and brings you fully alive.


    *   Opening fully to pleasant emotional experiences will balance your perspective
    and be a source of joy.


    Chapter 8


