  trans: '

    玛丽·艾伦（Mary Ellen）发现，她对自己的反应就像她对待红灯口的那个无家可归妇女一样。她将目光移开了自己，避开了内心深处的痛苦和羞耻。她开始意识到，自己避开了多少自我，以至于这些部分在某种意义上是“无家可归”的。她邀请自己的这些部分进入自己的意识，并开始理解自我排斥背后的原因。她不再站在内心批判者的一边，也不再逃避，而是转向了她那个受苦的自我。随着她这样做，她的心开始开启，自悲之自然而然地油了。


    接下来的练习旨在帮助你开始更详细、更清晰地观察自己的处境，以便你的心门能够开始向你所排斥的任何自我开启。


    ## 引导反思：与被排斥的自我连接


    对于这项练习，请为自己留出不被打扰的时间，至少三分钟。


    *   在附近准备好笔具，舒服地坐，闭上眼睛，邀请身体放松、柔化。几分钟内，只需跟随呼吸，让思绪平静下来。

    *   当你准备好时，设定一个意图：与你最排斥、最难接纳的自我连接。留出几分钟时间，让那个被排斥自我的影像出现在你的脑海中。让它以任何方式浮现；做这件事没有完美或正确的方法。

    *   要清晰地看到你所排斥的事的一种方法是使用以下问题作为框架。你可以自由使用这些问题，也可以以自己的方式进行反思和写作，以产生那些需要你治愈关注的自我部分的意识。在反思过程中，你可能会发现大脑或内心在收缩，你想移开。如果发生这种情况，只需回到呼吸上，回到开启并清晰观察的意图上。


    我的身体中有什么部分是被我评判和排斥的？我的尺寸不对吗？颜色？年龄呢？


    ___________

    ___________

    ___________

    ___________

    ___________


    我的大脑中有什么是不可接受的？我怀疑自己的智力吗？我对自己产生抑郁或焦虑思维的倾向持批判态度吗？我会将某些想法评判为“坏”的吗？


    ___________

    ___________

    ___________

    ___________

    ___________


    我的情感自我呢？我是否排斥了部分或全部的情绪？我会因为陷入低落的情绪、恐惧或嫉妒而评判自己吗？我会为自己的情绪自责吗？还是会因为自己的愤怒或易躁而谴责自己吗？


    ___________

    ___________

    ___________

    ___________

    ___________


    我是如何评判和谴责我的选择或行为的？是否有某些我还没有原谅自己的选择或行为？


    ___________

    ___________

    ___________

    ___________

    ___________


    关于我自己，还有什么是我曾严厉评判的，我是否有哪个部分正遭受着被排斥的痛苦？


    ___________

    ___________

    ___________

    ___________

    ___________


    *   当你完成这份清单的写作后，闭上眼睛，将注意力转移到呼吸和身体的感受上。用正念察觉它们，并尽可能保持无条件的接纳和善意。你可能会开始真正感受到这种被如此严厉评判或排斥的痛苦。当你这样做时，尽可能敞开心接受这种感受，并留意任何出现的丝丝慈悯火花。

    *   让你的呼吸将温暖和治愈带到身体中感到任何痛苦的区域。邀请自己柔化，记住你想要与自己建立新关系的意图——一种充满爱和接纳的关系。

    *   请记住，这种与被排斥自我的痛苦连接的过程可能需要时间，并并且你可以反复回到这种体验中。


    ## 正念的治愈力量


    一旦你审视了自己所排斥的内容，并开始对自己的痛苦产生一些慈悯，你就准备好更深层地探索正念的治愈力量了。以下冥想是通往你深层资源的一种方式：你自身充满爱与慈悲的能量。这是鼓励你反复练习的冥想。


    ## 引导冥想：治愈被排斥的自我


    对于这个引导冥想，请从之前的练习中选择一个被排斥的、你认为已准备好开启的自我部分。第一次尝试这项冥想时，不要选择那个带有最多羞耻的部分。


    *   舒服地坐好，保持一个放松但警觉的姿势。专注于呼吸几分钟，邀请大脑平静下来。在每一次呼气时释放。

    *   察觉你现在身体的感受，不要做评判。邀请身体任何紧张的部位放松、柔化。察觉飘过的思绪，以及你此时的情绪状态。

    *   邀请一个你信任、关怀你、并完全接纳你原本模样的人进入你的意识、进入这个空间。这可能是你认识的人：老师、导师或朋友。可能是一只动物：一只可爱的宠物。甚至可以是你只听说过的人，比如一位精神导师。是一个让你感到自己本身就完全可以被接纳和被爱的生命。感知这另一个存在就在这里，就在身边，用充满真实关怀的眼睛看着你。

    *   设定一个意图，让那种关怀进来，即使你感到了阻力。尽可能地敞开心扉去接受这股爱的能量。你可能想把手放在心口，轻轻地温暖它并邀请它柔化。

    *   当你准备好时，邀请一个需要治愈的被排斥自我部分的影像出现。尽可能详细地创造这个影像，包括外表、情感以及你对它的感受和想法。也许你可以看到它出现的场景，你对这部分自我的看法，或者你认为他人是如何看待它的。与这个影像共度几分钟。如果你的注意力游离，只需将其带回呼吸和影像。

    *   在这一刻，在心中和心中设定一个意图：向这个需要慈悲的自我部分开启。

    *   当你关注这个被排斥的自我部分时，察觉身体中被激发的任何感受。你在哪里察觉到感受？它们是怎样的感受？酸痛、刺痛、沉重、冷、热、刺痒、钝痛、锐痛？它们是在移动还是留在某个地方？这些感受有名字吗：忧伤、厌恶、哀伤、恐惧、反感、羞耻、愤怒、其他的？命名和察觉是连接被正斥物的强大方式。

    *   当你注意到任何抵抗或回避倾向时，回顾正念的精神：不评判、开放、友好的好奇。对自己敞开心扉，允许所有这些感受如实地展开。在探索需要你关注和慈悲的痛苦之处时，继续开启和柔化。

    *   你可能会发现内心批判者出现了；在这种情况下，请知道，可以用不评判的方式甚至去开启那个同样带着痛苦的部分。

    *   如果痛苦变得过于剧烈，只需回到安全感，邀请那位慈悲者的爱的存在此刻与你同在。如果这很难，没关系。慢慢来，继续邀请那份爱的存在出现。

