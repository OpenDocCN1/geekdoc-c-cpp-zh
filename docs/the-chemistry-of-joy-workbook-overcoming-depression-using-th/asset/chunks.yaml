- fmt: '

    Mary Ellen saw that she had been responding to herself just as she had responded
    to the homeless woman at the traffic light. She had turned her eyes away from
    herself and from the pain and shame that were at her core. She began to realize
    how many parts of herself she had turned away so that they were, in a sense, homeless.
    She invited these parts of herself into her awareness and began to understand
    the causes behind her self-rejection. She no longer sided with her inner critic
    and looked away, but turned toward her suffering self. As she did this, her heart
    began to open, and self-compassion appeared without effort.


    The following exercise is designed to help you begin to see your own situation
    in more detail, with more clarity, so that your heart’s door can begin to open
    to whatever parts of yourself you have rejected.


    ## Guided Reflection: Connecting with Your Rejected Self


    For this exercise, allow yourself some uninterrupted time, at least thirty minutes.


    *   With writing materials nearby, seat yourself comfortably, close your eyes,
    and invite your body to relax and soften. For a few minutes simply follow your
    breath, allowing your thoughts to settle.

    *   When you are ready, set the intention of connecting with the self that you
    have most rejected, that you struggle the most to accept. Allow a few minutes
    for an image of this rejected self to come to your mind’s eye. Let it emerge in
    whatever way it does; there is no perfect or right way to do this.

    *   One way to come to see clearly what you have rejected is to use the following
    questions as a structure. Feel free to use them or to reflect and write in your
    own way to create an awareness of the parts of yourself that are in need of your
    healing attention. As you move through this reflection, you might find that your
    mind or heart contract and you want to move away. If this happens, simply return
    to your breath, and to the intention to open and see clearly.


    What is it about my body that I have judged and rejected? Am I the wrong size?
    Color? Age?


    ___________

    ___________

    ___________

    ___________

    ___________


    What is it about my mind that is not acceptable? Do I doubt my intelligence? Am
    I critical of my tendencies toward depressed or anxious thoughts? Do I judge some
    of my thoughts as “bad”?


    ___________

    ___________

    ___________

    ___________

    ___________


    What about my emotional self? Have I rejected some or all of my feelings? Do I
    judge myself for struggling with blue moods or fear or jealousy? Do I blame myself
    for my feelings? Or condemn myself because of my anger or irritability?


    ___________

    ___________

    ___________

    ___________

    ___________


    How have I judged and condemned my choices or actions? Are there choices or actions
    I have not forgiven myself for?


    ___________

    ___________

    ___________

    ___________

    ___________


    Is there anything else about myself that I have judged harshly, any part of me
    that is suffering that pain of rejection?


    ___________

    ___________

    ___________

    ___________

    ___________


    *   When you have finished writing this inventory, close your eyes and change
    your focus to the breath and the sensations in your body. Notice them with mindfulness,
    with as much unconditional acceptance and kindness as possible. You may begin
    to really feel the pain of being so harshly judged or rejected. As you do, open
    as much as you can to how this feels, and notice any spark of compassion that
    appears.

    *   Let your breath carry warmth and healing to the areas of your body that feel
    any distress. Invite yourself to soften, and remember your intention to move toward
    a new relationship with yourself—a relationship of love and acceptance.

    *   Remember that this process of connecting with the pain of your rejected self
    may take time, and know that you can return to this experience again and again.


    ## The Healing Power of Mindfulness


    Once you have taken stock of what you have rejected, and have begun to feel some
    compassion for your own suffering, you are ready to more deeply explore the healing
    power of mindfulness. The following meditation is one way to access the deeper
    resources you have access to: your own loving and compassionate energy. This is
    a meditation we encourage you to practice again and again.


    ## Guided Meditation: Healing the Rejected Self


    For this guided meditation, select from the previous exercise one of the parts
    of yourself that has been rejected and that you feel ready to open to. For your
    first experience with this meditation, don’t select the part of you that holds
    the most shame.


    *   Seat yourself comfortably, in a relaxed but alert position. Focus for several
    minutes on your breath, inviting the mind to settle. Let go with each exhalation.

    *   Be aware of the sensations in your body as they are now, without judging.
    Invite any tense parts of your body to relax, to soften. Be aware of thoughts
    as they drift through, and your emotional state at this moment.

    *   Invite into your awareness, into this space, someone you trust who cares for
    you, who completely accepts you as you are. This could be someone you know: a
    teacher, mentor, or friend. It might be an animal: a loving pet. It could even
    be someone you only know of, such as a spiritual teacher. It is some being who
    gives you a sense that you are completely acceptable and lovable, just as you
    are. Sense this other being right here, close by, looking at you with eyes that
    really express caring.

    *   Create an intention to let that caring in, even if you feel resistance. Open
    your heart as widely as you can to this loving energy. You might wish to put your
    hand over your heart, gently warming and inviting it to soften.

    *   When you are ready, invite an image of the rejected part of yourself that
    is in need of healing to appear. Create this image in as much detail as possible,
    including visual appearance, emotions and thoughts you have about it. Perhaps
    you can see the situations in which it appears, what you believe about this part
    of yourself, or the way that you think others see it. Spend several minutes with
    this image. If your attention wanders, simply bring it back to the breath and
    the image.

    *   In this moment, set an intention in your heart and mind to open to this part
    of yourself that is in need of compassion. Seek to befriend it.

    *   As you focus on this rejected part of yourself, notice any sensations in your
    body that are triggered. Where do you notice the sensations? What type of sensations
    are they? Aching, tingling, heavy, cold, hot, prickly, dull, sharp? Are they moving
    or staying in one place? Are there names for these sensations: sadness, disgust,
    grief, fear, repulsion, shame, anger, others? Naming and noticing are powerful
    ways to connect with what you have rejected.

    *   As you note any resistance, any tendency to shut down or push away these sensations,
    recall the spirit of mindfulness: nonjudging, open, and friendly curiosity. Open
    your mind and heart to yourself, allowing any and all of these sensations to unfold
    exactly as they do. Continue to open and soften as you explore the painful places
    in need of your attention and compassion.

    *   You may find that the inner critic shows up; in that case know that it’s possible
    to open in a nonjudging way even to that part of yourself, which also carries
    pain.

    *   If the suffering becomes too intense, simply return to the place of safety
    and invite the loving presence of the compassionate other to be here with you
    right now. If this is difficult, no problem. Take your time and continue to invite
    that loving presence to appear. See those eyes, looking at you with acceptance
    and love. Let this caring surround you and fill the space around you. Breathe
    it in and let it touch you in the place of deepest pain, flowing around and through
    in a soothing way.

