    \ dramatic book or movie.\n\n*   Laugh with a good comedy, a book, or an amusing\
    \ friend—or just laugh.\n\n*   Take a warm shower or bath.\n\n*   Go dancing with\
    \ friends.\n\n*   Listen to some lively, energetic music.\n\n*   Get a vigorous\
    \ massage.\n\n*   Go to an aerobics or heated yoga class.\n\n*   Do five to ten\
    \ minutes of the energizing breath or right-nostril breathing.\n\n*   Take time\
    \ for prayer or meditation.\n\n*   ___________\n\n*   ___________\n\n*   ___________\n\
    \n*   ___________\n\n*   ___________\n\n## Summing Up Chapter 5\n\n*   We are\
    \ made differently from one another, and we feel and function best when we live\
    \ according to our own nature.\n\n*   According to ayurveda, there are three different\
    \ energies that combine in varying degrees to make up your mind-body constitution.\
    \ That remains with you throughout your life, but temporary imbalances in those\
    \ energies throw you off so that you no longer feel like yourself. At first, that\
    \ causes discomfort, but if it is allowed to go on, it can cause illness.\n\n\
    *   By understanding your mind-body type and noticing early signs of imbalance,\
    \ you can use diet and lifestyle to restore balance and prevent disease.\n\n*\
    \   Maintaining balance is a never-ending dance. You can’t be perfect, but you\
    \ can start by making healthy diet and lifestyle choices at least 51 percent of\
    \ the time!\n\nPart 3\n\nThe Mind Pathways\n\nChapter 6\n\n![Symbol for Settling](Images/fig1.4.jpg)\n\
    \n# Settling:\n\nTake the Mindful Path to a Calm Mind\n\n*We can teach our minds\
    \ to be calm and balanced; within this calmness is a richness and a potential,\
    \ an inner knowledge which can render our lives boundlessly satisfying and meaningful.\
    \ While the mind may be what traps us in unhealthy patterns of stress and imbalance,\
    \ it is also the mind which can free us.*\n\nTarthang Tulku\n\nIn the rush of\
    \ daily life, in the noise of the world around and the monologue inside, the spacious\
    \ clarity and energy of the natural mind are often lost to us. Settling the mind,\
    \ being grounded in the present, allows you to work more skillfully with the thoughts,\
    \ emotions, and experiences of life.\n\n“My mind is so chaotic I can’t even hear\
    \ myself think,” Alexandra said when we first met. She was a successful corporate\
    \ executive with a high-pressure job, a twenty-year marriage, and two children.\
    \ Several years before we met, she had lost her job in a corporate takeover and\
    \ had been unemployed for over a year. Though she eventually landed a new job,\
    \ she had, in the meantime, fallen into a major depressive episode of the anxious\
    \ type. Antidepressant and antianxiety medications had been helpful for a brief\
    \ period of time, but the side effects were now creating more distress than relief.\
    \ Her best default strategy was to work harder, run ultra-marathons, and overcommit\
    \ in her personal life. In that way she silenced her ruminating mind, at least\
    \ during her daytime hours. Sleep eluded her, because whenever she slowed down\
    \ and began to get in touch with thoughts or feelings, she felt overwhelmed and\
    \ out of control. As she drove herself to exhaustion, the depression only intensified,\
    \ and was now threatening her work and even her marriage. Her strategies just\
    \ were not working.\n\nWe encouraged Alexandra to begin her inward journey with\
    \ an effort to settle her mind. We introduced her to the concept of “monkey mind,”\
    \ an ancient Buddhist metaphor likening the unsettled mind to a troop of monkeys,\
    \ shrieking and swinging wildly from branch to branch, always on the move. Unable\
    \ to settle her mind’s chaotic workings, Alexandra could not see clearly just\
    \ how her strategies for coping with life were creating much of her suffering,\
    \ feeding depression, and draining her resilience.\n\nJust a Minute Meditation\n\
    \nEarly in our work with Alexandra, we introduced the idea of the Just a Minute\
    \ Meditation. This first step toward quieting the mind is simple, yet brings remarkable\
    \ results. Here’s how it is done, and we invite you to do it right now.\n\n* \
    \  Quiet your body and get comfortable, relaxing your body as much as you can.\
    \ Close your eyes, if you wish, or simply soften your gaze and focus on the floor\
    \ in front of you. This is a minute to completely rest.\n\n*   Take this minute\
    \ to simply breathe naturally, at whatever pace and depth your breath is moving\
    \ at the moment. Place your attention consciously on each breath, following it\
    \ from beginning to end of the cycle of inhaling and exhaling. Allow your breathing\
    \ to pause a bit at the end of the exhalation, and allow your breath to begin\
    \ the inhalation on its own. You might choose to count the breaths to help focus\
    \ your attention.\n\n*   If your mind wanders, simply bring it back to counting\
    \ your breaths or sensing the movement of the breath in your body.\n\nReflection\n\
    \nTake some time to reflect on this simple experience by answering these questions.\n\
    \n*   What physical sensations were you most aware of? Where in your body did\
    \ you most feel your breath?\n\n    ___________\n\n    ___________\n\n*   How\
    \ would you describe the qualities of your breath—the pace, depth, rhythm? Was\
    \ it relaxed, constricted, rushed?\n\n    ___________\n\n    ___________\n\n*\
    \   What did you notice about your thoughts? Was your mind busy, quiet, agitated,\
    \ still? How was it to catch your mind thinking and return to the breath?\n\n\
    \    ___________\n\n    ___________\n\nThere is no right answer to any of these\
    \ questions, of course. The whole point is simply to pause and to shift focus\
    \ from the thinking mind to the breathing body. When you focus on the breath,\
    \ your central nervous system automatically quiets down, your mind begins to settle,\
    \ and the body relaxes. This activates your natural healing potential.\n\n## The\
    \ Psychology of Mindfulness\n\nAs Alexandra’s mind began to quiet down, we introduced\
    \ her to the *psychology of mindfulness*, a term we use to describe our approach\
    \ to healing and transformation of suffering, which is based in Buddhist psychology\
    \ and mindfulness practices.\n\nSuffering and the Unsettled Mind"
