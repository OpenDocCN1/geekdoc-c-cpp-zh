    *   当我心情不好时，会寻求食物，通常是甜点或零食。

    *   我周围没有太多的活动。

    *   我目前的生活变化很小。

    *   我居住在凉爽潮湿的气候中（或处于春季）。


    ***


    检查你勾选的所有项目，并快速处理任何你可以处理的问题。土元素失衡最常见的两个原因为缺乏刺激，以及通过过度进食或情感封闭来不当应对应对压力。你可以在 `part
    3` 中找到更多关于压力和情绪的信息。同时，以下是任何人都可以采取的简单常识性措施，有助于帮助土元素恢复平衡。


    ## 平衡土元素的七大指南


    ### 白天保持活力的生活。

    规律的作息至关重要。目标是每天早睡早起，特别是在漫长的冬夜。不要跳餐，尤其是早餐。吃一顿早且清淡的晚餐，这样你在睡觉时不会感到太饱。


    尝试为你的生活增加刺激。在工作和娱乐中接受挑战并寻求新奇感：新朋友、新爱好、新的去处。定期休息，理想情况下每一半到两小时休息一次。尝试几乎每天运动。


    记得定期留出大量时间进行反思和更新。


    ### 根据你的类型明智饮食。

    对土元素类型最简单的饮食建议是：少吃。和生活的各个方面一样，食物应该增加多样性、趣味和刺激，帮助土元素恢复平衡。想象春季的自然界，那是排毒和消耗冬季储在脂肪中的额外能量的季节。多吃沙拉和苦涩的叶类蔬菜。土元素类型的人吃素食效果很好。他们需要确保获得优质蛋白质。如果吃肉，应该是瘦肉。减少油腻食品，只摄入少量健康脂肪。即使在低脂饮食中，摄入大量糖或谷物的土元素也容易增加，所以如果可能请减少它们（使用少量的
    `honey` 或 `agave syrup` 作为甜味剂）。保持规律的饮食，早餐低热量高蛋白，晚餐清淡。让午餐吃得丰富一些，并包含适量的健康脂肪，这样你晚上就不会渴望脂肪。饭后散散步以增加一些刺激。整天饮用温水或绿茶（少量咖啡因是可以的）。避免冰镇或冷饮，它们会破坏土元素的平衡。从下列表中做出你的食物选择。


    #### 土元素平衡食物：

    *   **概述**：更多的蛋白质，含有大量新鲜蔬菜的轻食。尽量减少淀粉和糖分。避免人工甜味剂；使用少量的 `raw honey`。


    #### 推荐食物：

    *   **乳制品**：脱脂牛奶、少量低脂奶酪、乡村干酪、酸奶或 `kefir`。

    *   **肉类**：低脂肉类、禽类、鱼。

    *   **豆类**：都可以。

    *   **坚果和种子**：葵花籽和南瓜子。

    *   **油**：少量橄榄油或核桃油。

    *   **谷物（少量）**：藜麦、大麦、荞麦、玉米、小米、苋籽、燕麦、黑麦。

    *   **蔬菜**：都可以，但要少吃土豆、红薯和其他淀粉类蔬菜。春季蔬菜最好，如叶类蔬菜、芽菜和芦笋——以及十字花科蔬菜（西兰花、花椰、卷心菜、布鲁塞尔孢蓝、小白菜）。

    *   **水果**：苹果、梨、桃子、杏子、越莓、樱桃、所有浆果、所有柑橘类。

    *   **零食**：加坚果酸奶；低脂条奶酪；添加 `protein powder` 的无脂奶昔。

    *   **草本和香料**：新鲜罗勒、百里香、欧芹、牛至或薄荷；黑胡椒或辣椒粉、蔻、、芹籽、肉桂、丁香、姜、柠檬、芥末、鼠草。


    ### 顺应身体节律运动。

    土元素类型需要最规律且剧烈的运动来保持平衡——理想情况下每天如此。由于能量和动力可能是挑战，可以考虑找一个运动伙伴、参加课程或请一名私人教练。


    *   **理想运动**：间歇训练。无论你选择哪种活动，都缓慢进行二到三分钟的热身。在接下来的几分钟里，增加强度，直到你推得几乎全力——但仅持续一分钟左右。然后回到较放松的速度持续几分钟，让自己恢复，然后再增加强度持续一分钟。重复这个循环四到五次，即可获得一次极佳的增强能量的锻炼。


    竞技运动也是让能量流动的良好方法。随着能量的恢复，目标是大多数每天进行十五到六十分钟的运动。你应该流汗并提高心率。


    结合有氧和重量训练也有帮助。记住，走路几乎是完美的运动！


    待在自然中和他人共处是加分项。考虑冒险运动，如海划划、山地自行车和攀岩。剧烈的骑行和北式滑雪也很好。


    *   **最佳身心运动**：如空道、跆道或太拳；更有力的瑜伽形式，包括热瑜伽。


    ### 妥善休息。

    土元素类型倾向于睡眠过多，而且往往很难按时起床下床。午睡也是一种诱惑，但它们往往会让你变得更加疲倦，在能量恢复正常之前应该避免。如果你必须午睡，请保持时间简短（二十到三十分钟），并且在一天中的早些时候（中午到下午三点之间）。早睡早起是非常重要的，理想情况下是在日出前起床。


    睡前避免酒精；它看起来可能让你放松，但可能会进一步干扰你的睡眠。


    ### 回归理智。

    对土元素最安抚的感官是味觉和嗅觉（这可能部分解释了体重增加的倾向）。与其追求数量，不如寻找具有刺激性的味道和香气。尝试新的菜系，或在食物中加入各种有趣的香料。


    按摩也有治愈作用，得到一次有力的推揉或深层、提神的按摩可能特别有益。使用玉米油或菖草油，两者都能提神益脑；或者进行干按摩，使用丝质手套刺激皮肤和淋巴系统。你可能想添加几滴刺激性的精油，如茉莉、依兰、柑橘或薰衣草。你也可以用它们进行芳香疗法，整天刺激你的嗅觉。如果你鼻塞，请使用尤加树。


    深呼吸。每当你感到疲倦时，都可以使用增强能量的呼吸技巧。尽可能通过鼻子吸气和呼气，就像你的胸是风箱一样。让吸呼的长度相等。起这样做二十到三十秒，逐渐增加到一到两分钟。如果你感到头晕，请停止并减慢呼吸。


    ***


    你也可以尝试瑜伽右鼻呼吸。通过右鼻吸气，通过左鼻呼气，用拇指或食指遮住另一侧。以这种方式呼吸几分钟，直到你感到恢复平衡并精力充沛。


    **随季节变化。** 土元素在春季往往会加剧，因为天气变得凉爽潮湿。如果你是土元素类型，春季需要保持温暖干燥。


