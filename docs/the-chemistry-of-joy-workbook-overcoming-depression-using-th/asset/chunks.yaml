    When you have finished developing your own phrases, you might wish to write them
    on a small card. They will form the heart of your work with the loving-kindness
    meditation that follows.


    ## Loving-Kindness Meditation for Self


    - Begin this meditation by settling yourself in a comfortable position, alert
    yet relaxed. Take a few moments to scan your body for any sensations of tension
    and invite them to relax and soften.

    - Focus for several minutes simply on your breath as it enters and leaves the
    body, inviting your mind to settle and quiet.

    - Now focus particularly on the breath as you sense it in your heart center, perhaps
    placing your hand gently on that part of your body. Sense the coming and going
    of the breath there, and any other sensations you notice. Be aware of how open
    your heart center is at this moment, and mindfully, without judging, invite it
    to open a bit more.

    - Invite into your awareness the image of a compassionate other: a person who
    accepts you unconditionally and wishes you well. This could be someone you know
    or only know of: a teacher, mentor, friend, a spiritual teacher. It might be an
    animal: a loving pet. Sense this other being close to you, looking at you with
    eyes that really express those loving wishes for your happiness.

    - Allow your heart to open to the loving wishes this person has for you. If you
    find yourself contracting or shutting this loving energy out, simply breathe and
    open again, to whatever degree you can. Spend a few minutes just allowing your
    heart to be filled with this sense of loving care.

    - Now invite into your awareness an image of your own self. This may be yourself
    at this present time or at some earlier time in your life. Invite that self to
    sit down across from you, and observe as much detail about yourself as you can:
    your body, your posture, your face. Sense how it feels to be right here with yourself.

    - Now, moving awareness again to your heart center, open your heart and invite
    that image of yourself into the circle of loving energy that is there. Sense your
    heart holding and deeply connecting with yourself in this moment. If you find
    any sense of contraction, simply breathe and remind yourself of your loving intention
    to open.

    - Now, with heartfelt sincerity, repeat your loving-kindness phrases silently,
    again and again, in rhythm with your breathing. As you repeat your phrases, you
    might find that you wish to change them slightly, or even leave out or add some.
    Feel free to do this until you feel that they are exactly what you wish for yourself
    from your most loving heart.

    - Repeat these phrases for as long as you wish. As you move toward ending this
    meditation, return to your breath for just a few minutes, noting the feelings
    and sensations present now. Be grateful for this experience, whatever you have
    found it to be.


    It’s important to note again that the practice of loving-kindness for self is
    the foundation of a practice that eventually moves beyond the self. As you extend
    loving wishes for happiness and well-being to all, you create a powerful antidote
    to the isolation and self-absorption that depression often brings.


    Freed from ruminating on your own deficiencies, you can now give your attention
    to others and share yourself more fully with them. This is the foundation of belonging,
    which we will turn to in the next chapter.


    ## Summing Up Chapter 9


    - Self-rejection and shame are key contributors to recurrent depression.

    - Healing from the wounds of self-rejection is possible through connection with
    your own suffering and the spontaneous arising of compassion that is its natural
    outcome.

    - When cultivated intentionally, self-compassion and loving-kindness help heal
    the disconnection that self-rejection has created.

    - You have within you a self that is free and whole, perfect just as it is.


    ## Chapter 10


    ![Symbol for Belonging](Images/fig1.8.jpg)


    # Belonging: Create Circles of Connection


    *We can live without religion and meditation, but we cannot survive without human
    affection.*


    The Dalai Lama


    *“I know I sound like a typical older person when I say that things were better
    when I was a kid, but at least in this way, they were: I remember summer mornings
    when I would jump out of bed, throw on my clothes, and dash out the back door.
    I can still hear the sound of the screen door slamming behind me as I ran out
    to look for my friends. And I always found them; there was always someone to play
    with. The mornings started on the swing set and ended with hide-and-seek as nighttime
    came on. Of course, it wasn’t perfect. I remember getting into fights and being
    jealous when a friend played with someone else more than with me, but it all just
    seemed to flow from fun to fight and back to fun again.”*


    Is Mary remembering a golden age that never was? Or are these memories a resource
    for her, a time of unquestioned belonging that motivates her to continue to seek
    out meaningful connections—even though it seems harder now than it did back then?


    No matter what you are experiencing right now in your life, you can be certain
    that in your early years, there were enough people who knew you and liked you
    and cared for you. You may think that there weren’t many—but there were `enough`.
    You received enough attention and love to survive. Now you would like to do more
    than survive. You would like to `belong`. No matter how discouraging relationships
    have been for you, it is still possible to create a circle of belonging.


    ## Circles of Belonging


    *Mary’s Story*


    Mary now lives in a townhouse where she knows a few neighbors but only knows them
    well enough to nod to them. She works for a large insurance company, where she
    arrives early every morning. Once she sits down in her cube and opens her computer,
    she barely looks up till noon. Occasionally she will take a walk with a coworker
    through the corridors and staircases of her office building, but more often she
    eats a solitary lunch as she continues to work at her desk.


    On her way home from work, Mary stops at a fitness club three nights a week. She
    doesn’t know anyone at the club, and she hurries through her routine, saving her
    shower until she gets home. Once home, she turns on her TV for company and listens
    for an hour or more to news of disasters and threats from around the world.


    How can Mary not be lonely? And how much does this social starvation contribute
    to her depression? Of course, Mary is aware that she feels lonely, but the reasons
    for those feelings became much clearer to her after she made two contrasting maps.
    Called `circle of belonging` maps, they are a tool that provides a picture of
    a person’s social connections. Mary completed one for her early years and one
    for her current life. When she saw how much richer her early networks had been,
    she began to wonder how she could add to her circle in the present. Later in this
    chapter, you will be given details about completing a circle of belonging map
    for yourself.


    Mary’s Childhood Circle of Belonging


    ![Diagram: Mary''s Childhood Circle of Belonging](Images/fig10.1.jpg)


    Mary’s Current Circle of Belonging


    ![Diagram: Mary''s Current Circle of Belonging](Images/fig10.2.jpg)


    ## The Spiral of Separation


    As an infant Mary knew nothing about separation. A newborn does not experience
    a self that is inside her skin and a world that is outside of it. It is only gradually
    that humans develop a sense of individuality, of being a separate self, the belief
    that “I” exist apart from others. This awareness of being a self is what makes
    humans different from other creatures. It is what allows you to feel like “yourself.”

