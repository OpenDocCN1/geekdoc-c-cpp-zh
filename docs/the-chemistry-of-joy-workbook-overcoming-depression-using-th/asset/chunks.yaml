    当你完成这段写作后，回顾它（注：应为反思）并找到三个或四个能概括这段体验的词。你可以选择将这个故事分享给别人，让那个人在你说话时反映出他们脑海中浮现的词。例如可以是单字，如“自由”、“强大”、“勇敢”、“连接”。或者你也可以选择简单的短语，如“无惧”、“体格强壮”、“活力且健康”、“被爱与被接纳”。


