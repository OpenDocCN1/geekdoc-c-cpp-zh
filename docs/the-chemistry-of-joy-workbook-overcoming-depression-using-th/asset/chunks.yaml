    If at all possible, it is best to prevent depression before it takes hold by staying
    balanced and feeling like *you*. This includes knowing and accepting your own
    nature and creating a lifestyle that promotes it. To support this goal, this chapter
    will help you to do the following.


    *   Identify your natural mind-body type.

    *   Learn to recognize early signs of mind-body imbalance.

    *   Identify simple and effective measures to regain balance and sustain it long
    term.


