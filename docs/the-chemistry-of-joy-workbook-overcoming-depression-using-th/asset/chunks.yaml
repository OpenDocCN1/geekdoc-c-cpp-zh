    一位切罗基族的长老向他的孙子们讲述人生。他告诉他们：“我的内心正在进行一场战斗。这是一场激烈的战斗，发生在两只狼之间。一只是邪恶的：它代表恐惧、愤怒、嫉妒、悲伤、后悔、贪婪、傲慢、自怜、内疚、怨恨、自卑、谎言、虚荣、竞争、优越感和自我。另一只是善良的：它代表快乐、和平、爱、希望、分享、宁、谦卑、善良、仁慈、友谊、共情、慷慨、真实、怜和信仰。同样的战斗也发生在你们身上。”他们思考了一分钟，然后一个孩子问爷爷：“爷爷，哪只狼会赢？”老人简单地回答道：“喂得最多的那只。”


    我们可以说，一只狼是我们的恐惧、怀疑、抗拒、绝望、消极、无助或抑郁的情绪。另一只狼则承载着我们的积极意图、对改变的渴望、对自身能够创造这种改变的认知，以及无论多么微小都愿意努力让改变发生的意愿。


    以下列表提供了一些方法，可以帮助你经营那个想要改变并能够促成变化的自我：


    ### 回忆你的意图。约吉·贝拉（Yogi Berra）曾说：“如果你不知道要去去哪里，你最终会到达另一个地方！”正如你在愿景板练习中所做的那样，清晰地陈你的意图将引导你走向正确的方向。你的意图可以是一个“进行中的计划”，并定期重新回顾。


    ### 记住你已经做得很好的事情。在第一章中，你完成了韧性技能问卷。每当抗拒或气馁出现时，回想起那些进展顺利的事情以及你拥有但可能遗忘的技能是非常有益的。


    ### 培养意愿。抗拒的本质是封闭；而意愿是保持开放的本质。有时，你可能只需要“愿意去变得意愿”，去接纳新信息、采取新行动或提出你自己的需求。任何微小的开启都会开始克服抗拒的过程。


    ### 练习接纳。一个十一世纪的西藏故事说明了接纳的力量：


    有一天，米拉日巴（Milarepa）回到家，发现他的洞穴里满了魔鬼。它们是狂野而疯狂的魔鬼，扰乱了他的内心平静。为了让它们离开，他首先尝试用逻辑告诉它们出去。没有成功。在多次尝试与它们讲理无果，他发了脾气，大吼大叫。它们还是留在了那里。意识到用理智与他们注定会失败，他最终放弃了，直接坐了下来。“好吧，看来我不走，你们也不走。我想我们只能学会共处了，”他对它们说。立刻，除了最凶残和最具威胁的一只魔鬼外，其他的都离开了。在智慧的闪现中，米拉日巴走向那只凶恶魔鬼，把头直接伸进它的嘴里。“那就吃我吧，”他说，“我无力击败你。”从此，魔鬼留了他的平静。


    故事的寓理是什么？当我们简单而彻底地接纳发生的一切时，抗拒的魔鬼就会离开我们。


    ### 维持希望和信仰。有时，信仰和希望是短缺的。特别是在抑郁伴来的“艰难时期”或“虚弱之地”，向外部寻求帮助是有帮助。你的精神传统和修行、支持你的朋友、鼓舞人的故事和读物以及励志的音乐都可以成为你的盟友。


    ### 请求支持。通往更快乐生活的道路可能是漫长、崎岖、令人且美丽的。与他人分享这段旅程可以减轻困难并增加快乐。找到一个支持网络——你的旅伴——是至关重要的。


    ## 建立你的支持圈


    花几分钟静静地反思你目前的支持圈。考虑以下问题：


    *   谁最了解你？谁最完全地接纳原本本的你，并肯定你本质的良性？将这些人的名字放在下页同心圆图的中心位置。

    *   你认识的哪些人曾经走过这条路——他们理解与抑郁的斗争，但已经取得了积极的改变？将这些人的名字放在图表的下一圈中。

    *   你认识哪些可以咨询的专业人士或机构：治疗师、神职、支持小组、教育计划？将这些名字放在图表的外圈。


    ![图表：你的支持圈](img/fig2.5.jpg)


    *   查看你的图表，看看哪里已经有了强有力的支持，哪里需要加强。在下方制定一个行动计划，以邀请这些人或组织成为你即将开启的旅程中的盟友。要具体化：列出他们的名字和联系方式，并包括你计划何时以及如何联系他们以寻求帮助（直接对话、电话、电子邮件、信件）。


    ![姓名和联系信息 / 寻求支持计划](img/fig2.6.jpg)


    姓名和联系信息：寻求支持计划：


    ___________

    ___________

    ___________

    ___________

    ___________

    ___________

    ___________

    ___________

    ___________

    ___________

    ___________

    ___________

    ___________

    ___________


    ## 总结第 2 章


    *   改变改变是一个全人的过程——身体、大脑和心灵——在植根于自我接纳时最成功。通常由内在批判者发起的自我改进项目很少导致持续的改变。

    *   有效的改变源于与你内在的愿景者一致：那个看到你的善意和潜力，并与你共同创造积极改变的部分。

    *   因为你的人类大脑是为了保护和生存而演化的，所以改变习惯和模式可能是具有挑战性的；你会遇到对改变的抗拒。与其在面对抗拒时放弃，你可以与这种改变的自然属性合作。

    *   在改变的努力中并不完美。尝试新方法时，做到 51% 的比例就足够了。慢慢地，你会发现自己正走向新的事物，并熄灭旧的。改变建立在改变之上。


