    *   I often skip meals or overeat.

    *   I have very high expectations of myself (and others).

    *   I am either unaware of my feelings of anger or resentment, or I don’t express
    them.

    *   I have been under intense stress for a long time.

    *   I live in a hot, humid climate (or it is summer).


    ***


    Go over all the items that you checked and change any that you can. The two most
    common causes of fire imbalance are intense, long-term stress and ignoring the
    need to express emotions. You will find more on stress and emotion in part 3.
    Meanwhile, the following are simple, commonsense measures that anyone can take
    to help bring fire energy back into balance.


    ## Seven Guidelines for Balancing Fire


    ### Live coolly through the day

    A regular routine is essential. Aim to get up and go to bed at the same time each
    day. To reduce problems from stomach acidity, never skip meals or wait until you’re
    extremely hungry before you eat. Eat an early, light supper so that you’re not
    full when you go to bed. If possible, avoid going outdoors or exercising in the
    heat of the day. Keep work in perspective, maintaining a healthy balance between
    work and play. Take regular breaks, ideally every one and a half to two hours.


    Remember to regularly set aside extensive time for reflection and renewal.


    ### Eat wisely for your type

    Food should bring coolness and substance to help bring fire energy back into balance;
    think “light, summery foods,” including plenty of fresh fruits and vegetables.
    Fire types need only small to moderate amounts of protein, with little if any
    red meat. Minimize spicy foods like hot peppers or greasy foods, including deep-fried
    foods. Keep regular mealtimes, with the midday meal being the largest, if possible
    (and a light meal at supper). Eat moderately, neither fasting nor indulging in
    large meals. Take time to relax after eating. Drink plenty of room-temperature
    water (with lemon or lime if you like) throughout the day. Choose your foods from
    the following list.


    #### Fire Balancing Foods:

    *   **Overview:** Lighter foods with plenty of fresh fruits and vegetables


    #### Recommended Foods:

    *   **Dairy:** Milk, cream, butter, yogurt, cottage cheese, egg whites

    *   **Meats:** Smaller servings of chicken, turkey, shrimp

    *   **Beans and legumes:** Tofu, lentils, garbanzo, small black or red beans

    *   **Nuts and seeds:** Almonds, pumpkin and sunflower seeds

    *   **Oils:** Olive, walnut, or coconut oils; ghee (clarified butter)

    *   **Grains:** Barley, oats, wheat, white rice, amaranth

    *   **Vegetables:** Tender salad greens, leafy vegetables, asparagus, celery,
    zucchini, green beans, and peas; cruciferous vegetables (broccoli, cauliflower,
    cabbage, bok choy, Brussels sprouts)

    *   **Avoid nightshades** (potatoes, tomatoes, peppers, eggplant). They often
    cause joint pain in people prone to inflammation.

