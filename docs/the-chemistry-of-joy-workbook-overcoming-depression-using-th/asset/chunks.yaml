- fmt: '

    Throughout this workbook you will find meditations, guided imagery, and other
    exercises that will become more effective the more you practice them. The written
    instructions will provide everything you need to do the practices, but you may
    find it helpful to be guided through them by an audio version of the instructions.
    If you would like to receive additional support in this way, go to [www.partnersinresilience.com](http://www.partnersinresilience.com),
    where you can download the practices and also find recorded talks, courses, and
    links to other resources.


    ## Summing Up Chapter 1


    *   The pathways to joy are intended to be fluid and integrated, each one connecting
    and supporting the next, interrelated and interdependent.

    *   The journey is flexible and can be adapted to your own needs. You can focus
    your energy on the skills most in need of your attention and revisit any paths
    that you have strayed from in order to strengthen them.

    *   The nine pathways to joy are a lifelong pursuit, sure to enhance resilience
    and open the door to joy.


    # Chapter 2


    ### Beginning: Tap into Your Source


    > *Nobody can go back and start a new beginning, but anyone can start today and
    make a new ending.*

    > — Maria Robinson


    You may have doubts about how much you can change your life to become more joyful.
    You may think that it’s possible for others but not for you. Perhaps your earlier
    attempts to create a new beginning have brought you to the same old stuck place.
    Perhaps it’s even been too difficult to attempt a new start. We want to assure
    you that you `can` make a new life and that you can start today.


    The change process that you will learn engages your whole self. That’s because
    this program is built upon a synergistic combination of changes in body, mind,
    and heart, a process that honors all of who you are as a complex human being.
    This whole-person approach can work for you even if others have not.


    ## The Whole-Person Change Process


    Whole-person change is a deep change process with several principles at its core.


    Whole-person change is grounded in radical self-acceptance. This is not simply
    another self-improvement project. The starting point is acceptance of yourself
    and your life just as they are at this moment in time. This runs counter to the
    usual approach, which is rooted in self-criticism and the drive for “a better
    me.” We’re not talking about a passive or resigned state of acceptance, but one
    that is energized and forward looking. `Arugamama` is a Japanese word that captures
    this dynamic tension. It is a state of unconditional acceptance of yourself and
    your life as they are at this moment, but with the simultaneous intention to act
    in positive ways to create change. As the Buddhist teacher Suzuki-roshi humorously
    put it, “Each of you is perfect the way you are…and you could use a little improvement!”
    (Chadwick 2007, 1). Beginning with this energized self-acceptance is the ultimate
    “start where you are” stance.


    Whole-person change begins deep within. The most sustaining motivation for change
    comes from connecting mindfully and compassionately with your inner suffering
    and the desire for relief from that suffering. Change that is based on what you
    believe you should be, or based on the standards set by others, is often short-lived.
    Being willing to listen deeply and honor your desire for change in a compassionate
    way leads to sustainable change.


    Whole-person change embraces even resistance to change. Most of us become frustrated
    when we can’t seem to make life changes that we know are good for us. Yet resistance
    to change is natural. Rather than wishing it away, we must accept that resistance
    is there, look more deeply into its nature, and learn to work with it more skillfully.


    All change is a process, and not a linear one. The self-improvement model of change
    often gives the impression that, if you are doing it right, you will experience
    continuous and sequential improvement. In the whole-person change process, you
    may go on and off the path of change many times, and may even feel as if you’re
    going back to the beginning. That is normal and expected. You only need to acknowledge
    it, pick yourself up wherever you are, and return to the pathway you have set
    upon. There’s an old Japanese proverb that says it simply: “Fall down seven times,
    get up eight.” The important thing is to notice when you’ve fallen and get back
    on the path.


    Change happens in connection. In contrast to our individualistic Western culture,
    which puts the onus on the individual to initiate and accomplish change, we believe
    it is important to reach beyond yourself in the healing process—to build your
    network of connection that will feed and sustain you as you change. This network
    will include family, friends, and community, as well as connection with your own
    spirit and a source of meaning and purpose in your life.


    ## The Self-Improvement Model of Change


    Like all human beings, you have made many life changes—some more successful than
    others. Let’s take a look at a very common approach to change and see if you recognize
    any of your own change efforts. This approach is rooted in the strong drive for
    self-improvement and is fueled by a sense of self-deficiency.


    It is common to identify with the `inner critic`, who, unfortunately, believes
    that criticism, disapproval, and harshness are `required` in order to create change.
    It is the critic that drives self-improvement projects. The example below describes
    Sandy’s desired change—“to get in shape”—and the driving thoughts and actions
    as well as the types of outcomes that resulted from this self-critical approach.


    ![Table: Sandy''s Desire/ Driving thoughts and Actions/ Sandy''s Outcomes](Images/fig2.1.jpg)


    The primary problem with this approach is that it just doesn’t work; it keeps
    the cycle of self-criticism going, and you end up feeling even worse about yourself
    for failing yet again. In contrast to the critic-based self-improvement model,
    the whole-person model begins from a position of self-acceptance.


    ## The Self-Acceptance Model of Change


    The poet Walt Whitman wrote: “I am larger, better than I thought; I did not know
    I held so much goodness” (Whitman 2004).


    We share the poet’s belief that you are larger than you imagine yourself to be.
    It is when you value and engage all of yourself that you can begin to create the
    lasting changes you long for.


    Let’s look at an example of such an approach. Like Sandy, Martha felt she was
    out of shape. She often felt stiff and sluggish. She wanted to have more energy
    and feel more home in her body. But she went about changing herself in a far more
    accepting way.


    ![Table: Martha''s Desire/ Self-Accepting Thoughts and the Actions That Follow/
    Outcomes](Images/fig2.2.jpg)


    As you work through this process, you will learn to not only change your behaviors
    but also expand your view of yourself and your capacity for change.


    ## From Critic to Visionary


    Too often the loudest inner voice is that of the small self with its tone of self-criticism.
    We need to diminish that voice in favor of one that has a larger vision for our
    lives. We need to silence the inner critic and listen to the inner visionary.


    ### The Critic


    The critic whispers incessantly to you about your shortcomings, about all that
    is wrong and how hard you must work to change. Most of us have a list that includes
    such things as “sad,” “angry,” “lazy,” “fat,” “out of shape,” “selfish,” and so
    on. What’s on your list?


    ___________


    ___________


    ___________


    ___________


    ### The Visionary


    The critic creates the belief that you must strive for perfection and hide what
    is imperfect. But there is another part of you that we’d like to introduce right
    now, and we offer this part as a companion to the critic. This part is the visionary.

