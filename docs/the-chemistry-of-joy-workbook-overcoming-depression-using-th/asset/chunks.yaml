    \ may already have symptoms of depression, anxiety, or another stress-related\
    \ condition. Your subgroup scores will tell you where you are most depleted and\
    \ where to put most of your energy, but you should follow all parts of the resilience\
    \ pathway to get yourself back on track.\n\n*   A score of 27–53 means that your\
    \ resilience skills are depleted, and you very likely have symptoms of depression,\
    \ anxiety, or both. Remember that these skills can be reclaimed; they are just\
    \ waiting for you to begin building them back up by following all the steps along\
    \ the pathway to resilience.\n\nNext, place your subgroup scores in the table\
    \ below. They correspond to the nine pathways to joy. By comparing your scores\
    \ across the pathways, you can decide where to begin and where to put most of\
    \ your effort.\n\n![Table: Scoring your Resilience Skills Questionnaire](Images/fig1.10.jpg)\n\
    \n*   13–15: This resilience skill is strong. Keep up the good work and look to\
    \ see if another area is more in need of your attention.\n\n*   10–12: While still\
    \ moderately strong, this skill is beginning to weaken. If you act to shore it\
    \ up now, you may prevent future problems.\n\n*   7–9: This skill is fading, placing\
    \ you at risk. Be sure to address it quickly within the program.\n\n*   3–6: This\
    \ skill has eroded. You can still reclaim it by beginning right away with the\
    \ corresponding pathway. Doing the entire program will ensure that you are doing\
    \ all you can to rebuild your resilience.\n\nAdditional Support"
