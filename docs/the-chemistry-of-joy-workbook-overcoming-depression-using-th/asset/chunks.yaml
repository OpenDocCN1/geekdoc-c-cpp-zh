  trans: "\n\n他说他一直有胃气、胀气和肠道“蠕动缓慢”，有时连续三天不排一次便。我们怀疑是胃酸不足而非过量，于是开始让他服用补充剂来改善消化：包括益生菌、消化酶，以及尝试饮用温柠檬水。托德（Todd）开始感觉好起来，随后他进行了一次改良的排除饮食。他发现自己对茄科类植物（白土豆、西红柿、辣椒和茄子）过敏，会导致胀气、痉挛和产气。\n\
    \n托德避开了茄科类蔬菜一段时间，并在医生的指导下逐渐减少了减酸药物的剂量。我们还处理了托德的压力问题，这种压力加剧了他的消化问题和焦虑。他感觉自己一直处于高度警觉状态，因此降低压力反应（你将在本工作手册的后部分学习如何做到）对他他的转机至关重要。\n\
    \n在复诊时，托德报告说：“我再次感到很平静；我几乎已经完全恢复了正常。我回到了健身房，甚至有时间当我儿子的棒球队教练。”\n\n## 评估你的消化健康\n\
    \n在所有符合你情况的项目旁打打钩：\n\n*   我服用胃酸倒流的药物。\n*   我经常使用非处方抗酸药。\n*   我有烧心感。\n*   我有恶心感。\n\
    *   我有胃酸味。\n*   我有慢性腹泻或软便。\n*   我经历便秘或肠道蠕动缓慢。\n*   我经常感到胀气。\n*   我经常打嗝或放气。\n*\
    \   我有胃痛。\n*   我注意到自己的口臭。\n*   我有慢性真菌感染。\n*   我服用复合维生素时会感到恶心。\n*   我在过去一年中使用过超过一次抗生素。\n\
    *   我有频繁使用抗生素的历史。\n*   我使用阿司林、布洛芬或其他非甾体抗炎药（NSAIDs）。\n*   我有口腔溃疡。\n*   我有肠易激综合征。\n\
    *   我有乳糜泻。\n*   我有克罗恩病。\n\n如果你勾选少于三个框，只需按照接下来列出的策略操作。如果你勾选了三个或更多框，或者在带星号的问题上勾选了任何一项，建议你也进行排除法挑战（见障碍障碍五），以确定食物过敏是否影响了你的消化和情绪。\n\
    \n## 改善消化的策略\n\n如果你选择食用健康食物，那么关键的消化过程将决定哪些营养物质能进入血液，并最终为大脑提供保持健康和平衡所需的成分。以下建议将帮助确保你真正释放了所摄入的营养物质。\n\
    \n*   确保你喝了足够的水。脱水会使消化道陷入完全停滞。\n*   多咀嚼、多咀嚼、再多嚼几次。唾液可以分解碳水化合物，而且咀嚼时释放的荷尔蒙会增加免疫系统的活跃性。\n\
    *   如果你正在服用减酸药物，请与你的医疗提供者讨论，确定可能的减药计划，同时找出烧心或反流的根本原因。\n*   用餐时饮用苹果醋（8 司水中加 1 到\
    \ 2 茶匙）或温柠檬水，以帮助消化并促进胃肠道运动。\n*   考虑炎症可能的原因，例如食物过敏。进行排除法挑战以确定这是否是一个问题（本章后部分将详细讨论）。\n\
    *   添加益生菌补充剂来帮助重新平衡益菌，这将有助于你的排泄恢复正常。确保补充剂含有多种菌株，如嗜酸乳杆菌、双歧杆菌、乳酸杆菌和果寡糖（`FOS`，一种支持健康肠道菌群的天然甜味剂）。\n\
    *   服用含有洋壳壳的纤维补充剂。\n*   添加粉碎亚麻籽和奇亚籽。\n*   喝生姜、薄荷、肉桂和甘草根做的茶。\n*   关注以下支持消化的食物：\n\
    \    *   谷物，如荞麦、钢切燕麦、大麦、野生米\n    *   新鲜蔬菜，特别是羽甘蓝、胡萝卜、卷心菜、花椰、南瓜和西兰花\n    *   新鲜水果，特别是梨、苹果、梅、香蕉、浆果和樱桃\n\
    \    *   发酵食品，如酸奶、开菲奶和牛奶\n\n## 障碍四：过度炎症\n\n炎症是重要的；它有助于身体抵御损伤、创伤、感染、过敏原和毒素等挑战。然而，过度炎症是有害的。例如，关节过度炎症会导致关节炎；气道炎症会导致哮喘发作。当炎症发生在脑部时，它会影响血清素和多巴胺等神经递质，加剧抑郁。\n\
    \n目前的研究表明，压力生活事件会通过物理损伤大脑导致情绪低落。这种损伤会触发修复反应（与任何伤口修复类似），其中包括炎症。这些炎症信号分子引起的变化导致修复过程中的身体疼痛和正常功能的“低落”。当由于持续压力或无法完全修复而导致修复过程持续较长时间时，抑郁症状可能会变成慢性的。在体内，一切确实相互相连（Smith\
    \ 2011）。\n\n将大脑化学变化与炎症联系起来的证据正在增加。抑郁症患者炎症细胞因子（炎症的化学信号分子）水平升高，这与睡眠变化、疲劳、易怒、悲伤和注意力集中有关。细胞因子升高甚至可能降低对抗抑郁治疗的反应（Miller,\
    \ Maletic, and Raison 2010）。\n\n## 琳的故事\n\n“当我的女儿问我是否对她生气时，我知道事情必须改变了。”琳（Lynn）第一次抑郁发生在十六年前停止喝酒后。现在她感觉它复发了。在一段艰难的八年婚姻后，琳现在是一个单亲妈妈，有一个七岁的女儿。她全职工作。她睡眠过多但仍然感到非常疲劳。尽管她已经恢复了十六年，琳发现自己开始渴望糖。\n\
    \n琳也有炎症病史。她小时候患有湿疹，青少年时期患有痤疮。皮肤非常干燥。最近频繁出现头痛。\n\n作为第一步，我们进行了排除挑战，以确定琳是否有潜在的食物过敏。当她完成挑战回来时，她说感觉“好多了”。她精力更充沛，不再头痛，皮肤变透了。她不再那么易怒，她说：“甚至我七岁的女儿都发现了。”她对牛奶制品反应强烈，这些产品让她感到大脑昏沉、暴躁，并导致持续两天的头痛。乳制品还加剧了她对糖的渴望。\n\
    \n由于皮肤干燥和情绪问题，我们还让她开始服用鱼油（欧-3）和其他抗炎食物。\n\n琳十二周后回来，表示她持续没有症状。“开始很难，但非常值得。”\n\n\
    ## 评估炎症\n\n在所有符合你情况的症状旁打打钩：\n\n*   头痛\n*   痤疮\n*   荨麻或皮疹\n*   干燥或脱皮的皮肤\n*   哮喘\n\
    *   胸部充血\n*   关节疼痛\n*   肌肉疼痛\n*   频繁感染\n*   眼袋或黑眼圈\n*   鼻塞\n*   鼻窦充血\n*   粘液过多\n\
    *   经常清嗓子\n*   慢性咳嗽\n*   声音嘶哑\n*   喉痛\n*   牙龈肿\n*   关节炎\n*   口腔溃疡\n*   湿疹或银屑*\n\
    *   反复发鼻窦炎*\n*   肠易激综合征*\n*   结肠炎或克罗恩病*\n\n"
- fmt: "\n# Hypothyroidism\n# Autoimmune disease such as rheumatoid arthritis, lupus,\
    \ or Raynaud’s disease.\n\nIf you checked fewer than three boxes, follow the general\
    \ recommendations listed below. If you checked three or more boxes or if you placed\
    \ a check mark next to `any` of the issues with an asterisk, it is recommended\
    \ that you also conduct the elimination challenge (roadblock five) to determine\
    \ if a food sensitivity is causing inflammation or influencing your mood.\n\n\
    ## Strategies for Offsetting Inflammation\n\nBecause of the destructive impact\
    \ of inflammation on the brain, reducing it is a primary strategy for improving\
    \ your mood. The following recommendations include general strategies for reducing\
    \ inflammation that can be helpful for everyone. When you address roadblocks two\
    \ and five (glucose-insulin balance and food sensitivities), you are also cooling\
    \ down inflammation.\n\n### General Recommendations\n\n- Pay attention to the\
    \ types of fat in your diet. Omega-6 fats (including most cooking oils, such as\
    \ corn, sunflower, safflower, and soybean) promote inflammation, while omega-3\
    \ fats reduce it. We need both, and our ancestors had about a one-to-one ratio\
    \ between them. Now we eat so many more omega-6 fats that the ratio is closer\
    \ to twenty to one. So while we can turn inflammation on, we have trouble turning\
    \ it off again.\n\n- Reduce intake of omega-6 fats by limiting corn, safflower,\
    \ sunflower, and soybean oils. Instead, use:\n    - olive oil for most cooking\n\
    \    - grapeseed oil for high-heat cooking\n    - olive and flax oils for salad\
    \ dressings\n\n- Omega-3 fatty acids (EPA and DHA) decrease the production of\
    \ pro-inflammatory messengers (cytokines). They also help build healthy brain\
    \ membranes and allow normal communication between cells.\n\n- Increase intake\
    \ of omega-3 fatty acids by eating:\n    - cold-water fish: salmon, halibut, mackerel,\
    \ herring, tuna, and sardines; cod-liver oil or other fish-oil supplements\n \
    \   - nuts and seeds: walnuts, pumpkin seeds, and freshly ground flaxseeds or\
    \ flax oil\n    - wild game, seaweed, algae, and eggs from flax-fed chickens\n\
    \n- Vitamin C: found in citrus fruits, tomatoes, green leafy vegetables, parsley,\
    \ cabbage, asparagus, avocados, cantaloupe, currants, mangoes, kiwi, papaya, peppers,\
    \ cherries, pineapple, and strawberries.\n\n- Curcumin is a naturally occurring\
    \ yellow pigment found in the spice turmeric that has been used for thousands\
    \ of years in indigenous medicine for the management of inflammatory disorders\
    \ and wound healing. You can add it to soups, stir-fries, and rice dishes.\n\n\
    - Eat plenty of onions, garlic, and ginger—all known for their anti-inflammatory\
    \ activity.\n\n- Soy products such as tofu, miso, edamame, and tempeh may also\
    \ reduce inflammation.\n\n### Foods to Reduce\n\n- Certain fats can cause inflammation\
    \ in the body. Limit your intake of meats, poultry, whole milk, cream, butter,\
    \ and cheese. Corn-fed animals have more pro-inflammatory fatty acids than grass-fed\
    \ or free-range animals.\n\n- Trans-fatty acids and partially hydrogenated vegetable\
    \ oil also carry a pro-inflammatory message to your body’s cells. Food labels\
    \ now have to include the amount of trans fat per serving and list partially hydrogenated\
    \ vegetable oil among the ingredients. Minimize your use of:\n    - margarine\n\
    \    - processed baked goods, crackers, and deep-fried foods\n\n- Simple sugars\
    \ and refined carbohydrates can create an inflammatory environment in the body.\
    \ Do your best to limit your intake of them.\n\n## Roadblock Five: Food Sensitivities\n\
    \nThere are often hidden saboteurs in our diets that make us feel miserable. It\
    \ may even be a food that we eat frequently, but if we are sensitive to a particular\
    \ food, the body will deal with it as an “invader”: it will activate the immune\
    \ system and create inflammation throughout the body. Ironically, you may even\
    \ crave the very food to which you are sensitive, because the offending food can\
    \ give you a momentary high. Food cravings, in fact, may provide useful clues\
    \ about food sensitivities.\n\nThese are not true allergies, like those that some\
    \ people have to nuts or shellfish. Food sensitivities are subtler than allergies,\
    \ which makes them harder to discover. Sensitivity to foods can trigger joint\
    \ pain, headaches, psoriasis, sinus congestion, and digestive disorders—and depression.\n\
    \nIf you checked multiple issues when you assessed your digestion (roadblock three)\
    \ or inflammation (roadblock four), you may want to conduct an elimination challenge\
    \ to determine the potential culprit. The most common food intolerances are dairy,\
    \ wheat, nightshade vegetables, and corn. If you suspect any food sensitivity\
    \ based upon your assessment, follow the elimination-challenge diet below. You\
    \ may discover a hidden food sensitivity that could unlock your normal digestion\
    \ and dramatically reduce inflammation and depression. It is challenging but may\
    \ be well worth the effort; you might even conclude that it’s kind of fun!\n\n\
    ### The Elimination-Challenge Diet\n\nFor the initial ten days, you eliminate\
    \ the foods listed below. Beginning on day eleven, you will begin to “challenge”\
    \ one new food at a time.\n\n#### Foods to Eliminate\n\n- Dairy: We use two different\
    \ categories for dairy—those containing mostly whey protein (milk, cream, sour\
    \ cream, butter, and ice cream) and those containing mostly casein (cheese and\
    \ yogurt).\n\n- Wheat: Most bread and pasta, most flour, baked goods, durum, semolina,\
    \ and farina. It is important to note that this does not mean gluten free. Gluten\
    \ intolerance is an altogether different sensitivity. There is gluten in wheat,\
    \ but there is also gluten in rye, spelt, and barley, which are allowed. You will\
    \ simply be avoiding wheat. In fact you do not want to consume packaged gluten-free\
    \ items, as they tend to contain corn flour and potato flour.\n\n- Nightshade\
    \ vegetables: White potatoes (meaning white-fleshed potatoes, Yukon Gold and red\
    \ potatoes), tomatoes, peppers, eggplant.\n\n- Corn: Corn chips, corn tortillas,\
    \ popcorn, corn oil, corn syrup and other corn sweeteners; Splenda, sucralose,\
    \ sorbitol, and xanthan gum are all made from corn.\n\nYou should also eliminate\
    \ “white foods” (white breads, pasta, cookies, and cake), and avoid grain alcohol\
    \ and beer. Many are made with wheat and corn.\n\nYou may encounter some unpleasant\
    \ withdrawal symptoms, such as irritability, headaches, fatigue, or any of your\
    \ mood symptoms. They will resolve within the first few days. Eat every three\
    \ to four hours to avoid food cravings.\n\nKeep a journal of how you feel from\
    \ day one through the end of the challenges. Note symptoms, lack of symptoms,\
    \ sleep, and energy.\n\nA key to the challenge is to focus on foods you can have.\
    \ You are free to include any of the following foods during the challenge:\n\n\
    - Cereals: Oatmeal, oat bran, granola, cream of rye, puffed rice, puffed millet,\
    \ or crispy brown rice with almond milk, soy milk, hemp milk, or rice milk.\n\n\
    - Cheese: Goat cheeses and goat milk, goat butter, and goat yogurt; sheep cheese.\n\
    \n- Coconut milk, coconut kefir, and coconut creamer.\n\n- Grains: Rye, oat, or\
    \ spelt bread made without wheat; rice cakes, rice crackers, and rye crackers;\
    \ buckwheat or soba noodles, spelt pasta, brown rice pasta, brown rice, white\
    \ rice, wild rice, oats, barley, millet, buckwheat groats, amaranth, and quinoa.\n\
    \n- Legumes: All legumes, including black beans, white beans, lentils, chickpeas,\
    \ navy beans, and fava beans.\n\n- Vegetables: All vegetables are fine to eat\
    \ except corn, peppers, white potatoes, tomatoes, and eggplant. Sweet potatoes\
    \ and yams are fine.\n\n- Fruit: All fruit is fine.\n\n- Protein: All eggs, poultry,\
    \ fish, and meat. Beef and pork or other protein you normally eat can be included.\n\
    \n- Nuts and seeds: All nuts and seeds and nut butters unless an allergy is known.\n"
