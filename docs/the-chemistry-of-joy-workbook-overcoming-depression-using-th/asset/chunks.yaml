    life. When you do them with intention and awareness, you will be able to capture
    the magic of the present moment—and your mind will settle of its own accord.


    Mindfulness in Daily Life


    Each moment of your daily routine offers you a chance to become more mindful,
    to calm your mind and live more fully in the present moment. Here are a few simple
    ways to begin:


    *   As you wake each morning, and before you get out of bed, do the Just a Minute
    Meditation (earlier in this chapter).


    *   Eat your breakfast mindfully, without reading the newspaper, watching television,
    or otherwise distracting yourself.


    *   When driving your car, turn off the radio. Pay attention to your hands on
    the steering wheel and consciously relax your grip.


    *   At a red light, focus on taking several full breaths.


    *   Use the ordinary sounds of daily life as a reminder to stop and breathe: the
    sound of the phone, the signal of arriving e-mail, and so forth. Or set your computer
    or other device to signal you at regular intervals to take a breathing break.


    *   Consider that housekeeping chores—like washing dishes or folding laundry—can
    be a time to tune in to your senses and be truly aware of what you’re doing. If
    your mind wanders into planning or analyzing, simply return to the task at hand,
    concentrating on what you see, feel, smell, or hear.


    *   When walking from place to place, focus on the sensations in the body, like
    your feet touching the ground, the breeze on your face. Again, when the mind wanders,
    return to the body.


    *   As you prepare for bed, choose one activity to do mindfully, such as brushing
    your teeth or drinking a cup of herbal tea. Enjoy the sensations.


    *   As you drift off to sleep, practice conscious, mindful breathing.


    MINDFUL EATING


    The experience of eating a meal can be a rich exercise in fully appreciating the
    present moment. It provides several opportunities each day to strengthen your
    mindfulness skills.


    * * *


    Mindful Eating Instructions


    Set aside a mealtime to eat alone or in silence with willing others.


    *   Put some thought beforehand into what you want to eat. Since you will pay
    greater attention to the food, you may wish to choose healthier, more wholesome
    and flavorful fare.


    *   Prepare the food with awareness and attention.


    *   Sit down, close your eyes, and allow the mind to quiet for a few moments.
    Give thanks for your food if you’d like.


    *   Before you take your first bite, notice the feeling of hunger in the belly,
    the sense of anticipation, the changes occurring in the mouth as it prepares to
    receive the food.'
