    *   断联的心灵承受着外界压力，源于社会动荡、失去亲人、关系破裂带来的孤独感或孤立感；内在压力则源于我们每当感到威胁时，想要封闭和退缩的本能。


    即使是是我们中最富有韧性的人，当这些敌人中的几个同时袭来时，也可能感到恐惧或抑郁。而即使是最脆弱的人，如果他们能够在面对那些消耗能量的事物时留心修复自我，也可以保持韧性。


    本工作手册旨在引导你平衡身体、平息情绪并连接心灵，让快乐的敌人对你的影响力大大减小。它们可能很凶猛，但你在应对它们时也可以表现得同样强硬。


    ## 韧性的崩解


    韧性对于快乐的生活至关重要。当你拥有深层次的韧性来源以及维持它的技巧时，你能够适应变化、面对挑战、应对生活中不可避免的压力，并依然能够安然无事，甚至在最后变得更加强大。在这种自然的韧性状态下，快乐会自然而然地到来，就像草在春天生长，仅仅是因为生长的条件已经回归。


    韧性是你的本性，但它正处于围困之中。心理和情感疾病现在已成为流行病，造成了巨大的个人和社会痛苦：


    *   在十八岁以上的美国人中，有 26.2%（该国超过四分之一的成年人）在任何一年中都会患有某种类型可诊断的心理疾病（Kessler et al. 2005），其中近半数符合两种以上疾病的诊断标准（美国人口调查局
    2005）。

    *   情绪障碍，包括重度抑郁症、`dysthymia`（一种较轻微但慢性的抑郁）和双相情感障碍，每年影响 2000 万美国人（10%）（Kessler et
    al. 2005）。抑郁症是美国残障的首要原因，并将很快成为全球的第一名（世界卫生组织 2008）。

    *   根据国家公共广播电报道的 IMS Health 数据（Shute 2011），医生在 2010 年开具了 2.54 亿张抗抑郁药物处方，使其仅次于降胆醇药物成为第二大常用处方药。

    *   焦虑更为常见，美国每五人中就有一个（600 万）患有可诊断的焦虑症（Kessler et al. 2005）。


    还有许多其他与压力相关的状况，如失眠、高血压、心脏病、记忆障碍、胃肠问题以及药物和酒精滥用。几乎每种慢性疾病都会受到力的影响。


    这些问题的频率在过去的几十年里剧增。做什么可以扭转这种韧性的崩解？


    ## 韧性并未丢失，只是等待重新唤醒


    我们与成千上万的人进行个人和小组合作，帮助他们从抑郁症的掌控中夺回生活。这无疑需要勇气，而勇气受到一种信念的支持，即觉醒快乐是`possible`的——不仅对他人，对你也是如此。对成千上万其他人有效的方法对你同样有效。


    如果你来到我们的办公室，你会听到像这样的励志故事：


    *   *Cheryl 的生活很丰富，拥有有回报的事业、三个可爱的孩子，以及支持她的丈夫和朋友。这似乎没有理由，但尽管接受了非常好的心理健康护理，她一生中仍经历了频繁且令虚弱的抑郁发作。在我们计划开始后的那个春天，她说：“这是我成年以来的第一次，我在没有发生抑郁发作的情况下度过了冬天！”那是四年前的事了，她现在仍然保持健康、活力和活跃。她的抑郁症没有复发。*

    *   *从青少年时期就受到持续抑郁困扰的 William 说：“虽然我没有找到一直寻找的‘魔法治愈’，但我现在接纳了自己——包括抑郁在内——并感到比以前任何时候都更有希望。”他感到充满希望是因为现在他正在学习自己可以做出的选择以及可以为自己做出的显然能改善心情的事。他有了方向感和一套技能，他终于相信这些技能提供了一条走出终身抑郁的途径。*

    *   *Allison 不仅从重度抑郁中康复了，她更进一步：“这让从抑郁转变为真正的快乐变得可能，而不仅仅是到达一个没有痛苦的地方。”*


    个人能够夺回更多生活，因为这种方法整合了过上有弹性且快乐的生活所需的许多方面。我们正从几个角度着解决痛苦的根源，并通过多种途径增强韧性技巧。


    我们的整合计划之一被称为“韧性训练”。我们对该计划的研究显示，几乎每个遵循计划的人都得到了改善，大多数人甚至完全康复了这种被称为重度抑郁症的严重疾病（Dusek
    et al. 2009）。以下是我们研究中的一些亮点：


    *   抑郁评分下降了 71%。

    *   超过 60%的参与者实现了抑郁症的完全缓解。

    *   生活质量衡量指标提升了 71%。

    *   在感知压力、焦虑和工作生产力方面也发现了类似的改善。


    我们的目标是让你从痛苦中解脱，无论痛苦的原因是什么，无论它在你的生活中如何呈现。我们希望你夺回与生俱来的韧性天赋以及随之而来的快乐。


    韧性是一种可以再生的资源，它更多取决于技巧而非遗传、环境或纯粹的运气。这本书致力于帮助你恢复和维护这种资源，让快乐流回你的生活。


