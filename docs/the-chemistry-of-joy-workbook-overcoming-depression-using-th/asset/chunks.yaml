    *   The development of an “observing self” that gives a larger perspective on
    thoughts and emotions

    *   Insight into patterns of thought and behavior, and the freedom to choose options
    other than habitual, reactive patterns

    *   The ability to stay with experience, to recognize its impermanence and have
    hope for the future

    *   Healing of disconnection from self (body, heart, and mind)

    *   Fuller acceptance of life as it is—suffering and all

    *   Greater capacity for joy, as a result of living in the present moment rather
    than the past or the future


    The net gain of this transformation was simply and joyfully expressed by Alexandra
    when she said, “Now I can see just how my twisted thinking and my running away
    from myself brought me so much more suffering than I needed to have. And now,
    having allowed myself to be present with it all, I still feel the pain of losing
    my job, but every day, I feel joy, too.” This awareness of the possibility of
    joy even in the midst of life’s painful experiences is at the heart of mindful
    living. The Taoist expression captures it all: life is “ten thousand joys and
    ten thousand sorrows.”


    ## Neuroscience and Meditation


    Modern science, aided by the development of technology, has revealed the astonishing
    truth that mindfulness meditation practice changes the structure and function
    of the brain.


    In general, meditators appear to have a quieter limbic system, decreased density
    in the amygdala, and strong, robust prefrontal lobes. What this translates into
    is less emotional reactivity, increased emotional self-control, improved stress
    management, and moderation of the stress response.


    This was demonstrated in a research project conducted by Eileen Luders (2009),
    a researcher in the Department of Neurology at UCLA. Using a high-resolution MRI,
    `Luders` and her colleagues compared the brains of twenty-two meditators and twenty-two
    age-matched nonmeditators and found that the meditators had more gray matter in
    regions of the brain that are important for attention, emotion regulation, and
    mental flexibility. Specifically, meditators showed significantly larger volumes
    in the area of the hippocampus, the orbitofrontal cortex, the thalamus, and the
    inferior temporal gyrus—all of which are known for regulating emotions. Because
    these areas of the brain are closely linked to emotion, `Luders` notes that they
    might be the neuronal basis of meditators’ outstanding ability to regulate their
    emotions and respond to the ups and downs of everyday life.


    ***


    A recent study by Massachusetts General Hospital and Harvard University put twenty-six
    highly stressed adults through an eight-week mindfulness-based stress reduction
    course. Brain scans were taken before and after the intervention, along with participants’
    own reports of stress. The participants who reported decreased stress also showed
    decreases in gray matter density in the amygdala. Previous research had revealed
    that trauma and chronic stress can enlarge the amygdala and make it more reactive
    and more connected to other areas of the brain, leading to greater stress and
    anxiety. This study is one of the first documented cases showing change occurring
    in the opposite direction—with the brain instead becoming less reactive and more
    resilient (`Kilpatrick et al. 2011`).


    ***


    ## Summing Up Chapter 6


    *   The resilient mind is a calm and grounded mind.

    *   While we cannot escape the suffering of this human life—including depression
    and anxiety—we can learn to minimize the additional suffering that is created
    by our own minds.

    *   Through the practice of mindfulness in its various forms we can quiet the
    mind. In the spaciousness of the settled mind we can open to the full range of
    our life experience with equanimity.

    *   Scientific research now confirms that mindfulness meditation is a means of
    quieting the stress response, improving emotional regulation, and improving our
    sense of well-being.


    ## Chapter 7


    ![Symbol for Opening](Images/fig1.5.jpg)


    # Opening: Develop Emotional Resilience


    *Let everything happen to you,*

    *Beauty and terror.*

    *Just keep going.*

    *No feeling is final.*


    Rainer Maria Rilke


    Imagine a life without emotions: No joy at the birth of a new baby. No grief at
    the loss of a loved one. No compassion at the plight of tsunami victims. No love
    providing the glue in relationships. No fear to warn of danger or anger to motivate
    the fight for justice. No small morning delights like the sight of a cardinal
    outside the window or that first cup of coffee on the porch.


    Emotions are the key to understanding who you are: what you are attracted to or
    repelled by, what motivates you, and what threatens your safety. Emotions can
    operate as a navigational device—an inner GPS of sorts—letting you know where
    you are, suggesting where you might wish to go, guiding you on your way. They
    are a source of pleasure in daily life and a source of the empathy that enables
    you to connect with others. By learning to read your inner emotional language—becoming
    emotionally literate—you can understand yourself more completely, navigate through
    your daily challenges more skillfully, and appreciate the richness of life more
    fully.


    However, emotional life has its complications and difficulties. You may have developed
    rules and beliefs that distort your view of emotions and your ways of expressing
    them. You may have learned to distrust emotions or see them as a sign of weakness.
    Perhaps you keep them to yourself, having found that others are not able or willing
    to hear about them. You might even have shut down the most painful emotions to
    protect yourself from feeling distress. Unfortunately, disconnection from emotions
    may leave your inner life feeling empty or unknown to you.


    If depression clouds the picture, emotions can become a fearful place to enter—a
    dangerous neighborhood on a dark night. If you’ve been consumed by sadness, guilt,
    or hopelessness, the hallmarks of depression, you may have become emotionally
    phobic: afraid to experience certain emotions lest you find yourself caught again
    in the grip of depression.


    In this chapter you will find tools to enable you to move freely in your inner
    world of emotional experience, however constrained it might now be as result of
    your life experiences. This freedom to feel everything fully is one of the foundational
    skills for recovering and maintaining your resilience, preventing recurrence of
    depression, and living a joyful life.


    ## Understanding the Flow of Emotional Experience


    Emotions function naturally as the moment-to-moment response to the happenings
    of your everyday life. They might be likened to weather fronts: arriving, remaining
    for a time, and moving on. Emotions originate in the limbic system—the “emotional
    brain”—and as the limbic brain responds to stimuli around you, neurotransmitters
    linked to various emotional states are released. These chemicals travel along
    neural pathways to the frontal lobes of your cortex—the “thinking brain”—where
    you add thoughts and memories to the mix. These thoughts and memories of previous
    experience enable you to describe, interpret, communicate, and decide how to act
    on your emotions. It is at this point that emotional life can get complicated.


    In the last chapter we introduced the idea of “monkey mind”: the untrained, unsettled
    mind that is so often the source of suffering. When you are captive in monkey
    mind, you are vulnerable to believing that your thoughts are reality, and can
    become caught in a web of storytelling that can lead you into a deep morass of
    painful feelings. These “second arrows” of thought can add layers of misery to
    the original emotional experience, which might have been difficult enough as it
    was.


    Consider this everyday example.


    *Kathryn’s Story*

