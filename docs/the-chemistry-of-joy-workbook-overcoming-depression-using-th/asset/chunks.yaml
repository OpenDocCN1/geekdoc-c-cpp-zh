    *   油脂和脂肪：所有的油脂和脂肪都包含内，黄油、人黄油和玉米油除外。主要使用橄榄油、籽油、芝麻油、红花油、椰子油或花生油。


    # 挑战排除性食物


    十天后，是时候通过测试（或“挑战”）一次引入一种新食物来重新引入排除的食物了。当你测试某种食物时，你应该吃较多量（五到六份）。人们经常想，一天内吃这么多某种食物是否会引起反应。答案是否定的——食物的量并不重要。例如，你可能会觉得玉米或小麦吃得饱了，但除非你对它们敏感，否则不会产生反应。


    反应可能包括常见的熟悉症状，也可能是你从未有过的症状，例如水肿、皮肤瘙痒或皮疹。即使你认为自己的感受有其他解释（例如，“我今天很累，是因为我昨晚没睡好”），你仍然应该记录下来。你可能昨晚没睡好，是因为你前一天挑战了玉米，你的身体反应得就像体内有敌人一样。反应还包括情绪症状，如抑郁、易怒或焦虑。


    *   **第 11 天**：`乳制品（乳清)`：牛奶、冰淇淋（不含玉米糖）、酸奶油和黄油。

    *   **第 12 天**：观察日。遵循常规排除法：不吃玉米、小麦、乳制品或茄类。记录任何类型的反应。

    *   **第 13 天**：观察日。遵循常规排除法：不吃玉米、小麦、乳制品或茄类。记录任何类型的反应。

    *   **第 14 天**：`乳制品（酪蛋白）`：任何种奶酪、茅屋奶酪和天然酸奶。

    *   **第 15 天**：观察日。遵循常规排除法：不吃玉米、小麦、乳制品或茄类。记录任何类型的反应。

    *   **第 16 天**：观察日。遵循常规排除法：不吃玉米、小麦、乳制品或茄类。记录任何类型的反应。

    *   **第 17 天**：`小麦`：使用全麦谷物片、全麦饼干、全麦面条和全麦面包棒。

    *   **第 18 天**：观察日。遵循常规排除法：不吃玉米、小麦、乳制品或茄类。记录任何类型的反应。

    *   **第 19 天**：观察日。遵循常规排除法：不吃玉米、小麦、乳制品或茄类。记录任何类型的反应。

    *   **第 20 天**：`茄类`：土豆、西红柿、辣椒和茄子。（如果西红柿或辣椒让你感到胃热或消化不良，则挑战时仅使用土豆。）

    *   **第 21 天**：观察日。遵循常规排除法：不吃玉米、小麦、乳制品或茄类。记录任何类型的反应。

    *   **第 22 天**：观察日。遵循常规排除法：不吃玉米、小麦、乳制品或茄类。记录任何类型的反应。

    *   **第 23 天**：`玉米`：使用新鲜玉米、冷冻玉米、米花（天然）或玉米片。

    *   **第 24 天**：观察日。遵循常规排除法：不吃玉米、小麦、乳制品或茄类。记录任何类型的反应。

    *   **第 25 天**：观察日。遵循常规排除法：不吃玉米、小麦、乳制品或茄类。记录任何类型的反应。


    如果你对某种食物产生了反应，则应该再避免它八周。在八周之后，你可以开始缓慢将该食物重新引入饮食，找出你多久吃一次不会产生反应。从每周吃一次开始，然后是每六天一次，再是五天一次；最后固定在每四天吃一次。你可以看到，食物敏感并不意味着永远不再吃那种食物，而是提醒你要留心。


    # 跟踪你的进度


    研究表明，仅仅想要改变效果并不好。有目标也不行。研究显示，当人们制定具体的计划、跟踪进度并看到自己成功时，他们更有可能实现目标。


    例如，最近的一项研究旨在增加大学生的水果摄入量。所有 177 名参与的学生都被设定在七天内增加水果的目标。他们被随机分配到四组。一组仅有目标。另一组有目标以及对如何实施目标的想法。第三组想象自己成功。第四组被要求设定目标、制定具体的计划并写下来（何时、何地以及如何购买、准备和吃水果），并想象自己成功的画面。最后一组的水果摄入量是其他任何组的两倍（Knauper
    et al. 2011）。


    我们鼓励你在制定目标时利用这种见解，记住行动是改变过程中的关键步骤。我们建议设定几个简单但具体的目标，制定具体的计划，然后跟踪你的进度。

