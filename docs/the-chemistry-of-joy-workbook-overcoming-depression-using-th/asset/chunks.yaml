    divides people into two groups: them and us. Your thoughts and beliefs play a
    major role in how you decide which group someone new belongs to and whether or
    not you decide to pursue more contact with that person. Thoughts and beliefs that
    grow out of a sense of separation set people up to think of others as potential
    threats instead of as possible friends or allies. Cultivating thoughts that encourage
    you to see more people as potential members of your tribe can help you to be more
    open to others. The more open you are to others, the richer is your circle of
    belonging.


