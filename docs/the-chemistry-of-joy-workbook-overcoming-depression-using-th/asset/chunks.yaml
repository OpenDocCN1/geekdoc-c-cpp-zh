    * `a.` 体型轻盈，骨架窄，关节明显；如果我体重增加，往往会集中在腹部。

    * `b.` 中等身材，运动型，体重中等；只要我愿意，我可以很容易增加或减轻体重。

    * `c.` 体格结实，骨架大；我容易胖，而且很难减掉。


    2. **我的皮肤倾向于：**


    * `a.` 寒、干燥或粗糙，尤其在干燥的气候下。

    * `b.` 温暖且容易晒伤，我容易长有雀斑、痣或皮疹。

    * `c.` 凉爽、柔软且油性。


    3. **我偏好的气候是：**


    * `a.` 温暖湿润的；我不受不了干燥、冷风。

    * `b.` 凉爽干燥；我不受不了炎热潮湿的天气。

    * `c.` 温暖干燥；我不受不了凉潮湿的天气。


    4. **我的头发倾向于：**


    * `a.` 干燥、毛躁、易脆。

    * `b.` 直发、浅色或偏红，容易脱发或白发。

    * `c.` 厚实、波浪、深色、油性。


    5. **我的食欲倾向于：**


    * `a.` 多变且不规律；因为日程不稳定，我经常跳餐。

    * `b.` 旺盛且偶尔过度；如果错过一餐，我就会变得暴躁。

    * `c.` 缓慢且稳定；我可以长时间不吃东西，尽管我并不喜欢这样做。


    6. **我的消化倾向于：**


    * `a.` 不规律，经常胀气或便秘。

    * `b.` 较快，偶尔有灼热感消化不良或腹泻。

    * `c.` 缓慢且迟钝，经常有油性大便。


    7. **在身体上，我倾向于：**


    * `a.` 高度活跃，动作快；有时会感到坐立不安。

    * `b.` 中度活跃，行动有目标；有时会产生一种强烈的完成某事的动力。

    * `c.` 活动量较低，动作缓慢且有条紊；有时会感到无精打采。


    8. **我的思维最贴切的描述是：**


    * `a.` 敏捷、活跃、坐立不安；我学习新事物很快。

    * `b.` 敏锐、聪明、具有批判性；我决心学好东西。

    * `c.` 冷静、缓慢、深思；我学习缓慢而稳定。


    9. **我的记忆力通常：**


    * `a.` 记得快，但也忘得快。

    * `b.` 记忆力且清晰。

    * `c.` 形成得慢，但保持能力好。


    10. **我的睡眠通常：**


    * `a.` 不规律且浅，我容易被吵醒。

    * `b.` 相当充足，我需要的睡眠比平均水平少就能感到恢复。

    * `c.` 深沉，我需要比平均水平更多的睡眠才能感到恢复。


    11. **当我状态正佳时，我倾向于：**


    * `a.` 活泼、创意且热情；我拥抱变化。

    * `b.` 坚定、友好且成功；我拥抱竞争。

    * `c.` 冷静、随易近人且善于照顾；我拥抱结构。


    12. **当我感到压力时，我倾向于：**


    * `a.` 焦虑、缺乏安全感或情绪化。

    * `b.` 焦躁、易怒或不耐烦。

    * `c.` 迟钝、自满或退缩。


    ### 评分


    统计以下答案的数量：


    * `a`: ___________（对应风元素类型）

    * `b`: ___________（对应火元素类型）

    * `c`: ___________（对应土元素类型）


    如果你在某个类别中的得分显著高于其他类别，那么那就是你的身体质。然而，大多数人在两个类别中的得分都很高（通常一个会比另一个略高）。


    ### 理解你的得分


    上述问卷改编自阿育吠陀医学（ayurveda）。如果你清楚自己的失衡点在哪里，可以直接进入该章节。如果你不确定从哪里开始，请按顺序处理这三项：先平衡，然后是火，最后是土。


    回顾你的得分；得分最高的类别是最容易失衡的。接下来概述了三种主要的模式，以及帮助你恢复平衡的饮食和生活方式选择。如果你有更多的 `a`，那么你可能活泼、创意且热情；你拥抱变化。当你感到压力时，你的情绪可能倾向于焦虑，使你容易产生焦虑。如果你有更多的
    `b`，那么你可能坚定、友好且成功；你拥抱竞争。当你感到压力时，你的情绪可能倾向于易怒，使你容易变得焦躁。如果你有更多的 `c`，那么你可能冷静、随易近人且善于照顾；你拥抱结构。当你感到压力时，你的情绪可能倾向于迟钝，使你容易变得消沉。


    在你获得更好的健康感之后，继续最适合你身体质的措施。


    ## 当失衡时：重新调整


    保持平衡是一种艺术。我们都会偶尔经历失衡。关键在于意识到我们可以重新回到轨道。例如，风元素类型以日程不规律闻名。缺乏活动的土元素类型也会发现这些模式被放大。


    ### 调整风元素类型


    当风元素类型失衡时，可能会表现为如下：


    ![表格：风衡 - 身体症状，心理/情绪症状](img/fig5.1.jpg)


    这些可能是抑郁的早期警告信号。如果你采取措施让自己迅速回到平衡，你可能阻止其进一步恶化。


    ### 发现风元素失衡的原因


    勾选每个适用于你的陈述：


    * 我工作时间很长或不规律。

    * 我不定期休息。

    * 我倾向于安排过满行程；我的日程不稳定。

    * 我睡眠不足。

    * 我使用咖啡因或尼古丁。

    * 我吃很多糖或白面粉。

    * 我跳过早餐或其他餐点。

    * 我周围有很多噪音或忙碌的环境。

    * 我现在的生活中面临很多压力或变化。

    * 我住在寒冷干燥的气候（或现在是冬季）。


