- fmt: '

    Kathryn is sitting at her desk when an e-mail from her younger brother appears.
    The news isn’t good; her father’s cancer has returned, and the biopsy says it’s
    the aggressive type. Her first reaction is instinctual: shock and fear are felt
    as tightness in her chest, shakiness, and a cold, sinking sensation in her belly.
    Then her thinking mind adds words to the physical sensations: *This is impossible!
    He seems so well, so strong for his age. How can this be? She imagines the worst
    possible scenarios:* *This time there will be no possible treatment. He will suffer
    a painful death, and the grief and needs of my mother will be consuming.*


    Kathryn has moved into the realm of the second arrows. She is no longer in the
    present, but in the unknown future, telling herself a story created by her anxious
    mind. She begins to feel overwhelmed, despairing, and unable to handle her feelings.
    She chastises herself for being so weak, so frightened. Unable to concentrate
    on work, she spends the rest of the day preoccupied with her inner thoughts and
    feelings. She turns off her cell phone to avoid any more conversations with the
    family. When her children come home from school, they find her distant and withdrawn,
    unlike her usual self. Bewildered, they leave the house to find a friendly neighbor.


    ### John’s Story


    Her brother John has reacted to the same situation in a very different way. Although
    the news is disturbing, he bypasses the body sensations and moves directly into
    thinking mode. He clicks into action, alerting the rest of the family and contacting
    an oncologist friend to assess the prognosis. He believes that action is the best
    response, recalling his father’s mantra: “There’s nothing to be afraid of. Just
    get moving.” Determined not to feel, he notices a bit of sadness while talking
    with his wife but quickly moves away from it, distracting himself with video games
    until the early hours of the morning.


    John had experienced a major depressive episode years ago, and any sign of sadness
    is now a warning for him. He chooses to distract himself and remain comfortably
    numb, rather than feel the sadness he fears may send him into the sinkhole of
    depression. His wife feels worried about him but is shut out and unable to approach
    him. She goes to bed, alone with her feelings, wondering if they will ever connect
    around their fears or sadness.


    ## The Emotional Response Continuum


    One way to look at John’s and Kathryn’s responses (and yours as well) is to see
    them along a continuum. This continuum of emotional experience ranges from disconnected
    (unaware of emotions) to flooded (overwhelmed by them).


    ![Table: Disconnected/ Resistant/ Open/ Fixated/ Flooded](Images/fig7.1.jpg)


    ### DISCONNECTED


    When you are `disconnected` from emotional experience, there is no awareness of
    emotion in your body or thoughts. This is an extreme pattern, though it may be
    true of anyone from time to time. When you are disconnected from your experience
    of emotion, you are living at a distance from your life experience, and might
    feel empty or distant from yourself and others.


    ### RESISTANT


    In the examples above, John illustrates the `resistant` mode of response. When
    you resist your feelings, there is a conscious (or sometimes automatic) decision
    to turn away from them, to avoid feeling their pain. Resisting is based on fears
    that something bad will happen or you won’t be able to deal with the emotion.
    This may result in other distressing feelings, like tension or irritation. It
    takes energy to sustain resistance, and you miss the possibility to realize the
    wisdom of your emotions. While it’s natural to slip into this mode at times of
    great distress, resisting becomes problematic when it is your regular mode of
    dealing with emotions. If you are mindful and recognize the pattern as a problem,
    you can learn to shift your response toward the `open` mode.


    ### FIXATED


    To `fixate`—to become obsessed or preoccupied—is another common but problematic
    response and the one that Kathryn experienced. In this pattern, your felt emotion
    becomes complicated by your thinking mind. The thoughts and stories it generates
    only prolong and intensify the distress. The natural cycle of emotion—to arrive,
    stay for a time, and pass—is blocked, and it’s difficult to let the emotion pass.
    You become preoccupied and unable to engage with the things that need your attention.
    Unable to find your center, your `observing self`, you’re caught in a torrent
    of feelings and can’t determine a course of action or care for yourself. Again,
    this pattern can happen from time to time, but becomes problematic when it occurs
    regularly. Maintaining mindfulness is the key to shifting out of fixation to the
    more fluid `open` response.


    ### FLOODED


    In this extreme state you might find yourself totally incapacitated by emotion
    and possibly acting in ways that are damaging to yourself or to others. While
    this is less common, being overwhelmed emotionally this way may contribute to
    shame and self-criticism, triggers of depression. The following chapter will provide
    more detail and tools for coping with flooding.


    ### OPEN


    Remaining open, turning toward and embracing all of your feelings, is the key
    to emotional resilience. When you are able to open with mindfulness, paying attention
    to sensations in the body, noticing thoughts and their effects without being carried
    away into the past or the future, the emotion goes through its natural life cycle.
    Being present through this full cycle can enrich your life and open doors to understanding
    yourself and your situation. In the remainder of this chapter we’ll be giving
    you information and tools to help you develop this important capacity.


    ## Assessing Your Emotional Response Patterns


    One step on the path to emotional resilience is identifying your own patterns
    of experiencing emotions as they arise: your own tendencies to move to various
    positions on the emotional response continuum. Like everyone, you have developed
    your own “emotional comfort zone” that includes feelings that you welcome or seek
    out, while there are more painful or difficult emotions that you avoid or feel
    flooded by.


    To increase awareness of your own response patterns, sort the following list of
    emotions into the three categories in the table that follows it.


    ![Table: List of emotions](Images/fig7.2.jpg)


    ![Blank Table: Emotions I resist, avoid, or disconnect from/ Emotions I am open
    to and comfortable with/ Emotions I find overwhelming or get fixated on](Images/fig7.3.jpg)


    To make the best use of this information, reflect on your categories and answer
    these questions:


    *   Which emotions do I regularly resist or disconnect from? Why might that be
    the case? (What are the beliefs, rules, or actions of mine that underlie this
    pattern?)

    *   Of these emotions, which of them might I begin to open to?

    *   Which emotions do I often become fixated on or feel flooded by? Why might
    that be the case? (What are the beliefs, fears, or actions of mine that underlie
    this pattern?)

    *   Which of *these* emotions might I begin to open to?

    *   What emotions am I open to and comfortable with?


    ## Developing Emotional Flow


    The good news is that any problematic response patterns you may have learned can
    be unlearned, and you can move toward a more open mode of responding to your daily
    flow of feelings. The tools in the next sections of this chapter—along with your
    practice of mindfulness meditation as taught in the preceding chapter—are just
    what you need for beginning the change process.


    Although this might seem to be a daunting task, we encourage you to look at the
    benefits. Opening to *all* of your emotions enables you to:


    *   Attend to situations that need a response rather than ignore them until they
    get worse.

    *   Tap into your creative energy rather than shutting it down along with your
    emotions.

    *   Become more vitally alive, even in your darker moments.

