  raw: 'Because you need a solid physical foundation for brain resilience, the first
    gateway is to care for the body by feeding it properly. If additional support
    is needed, then nutritional supplements can be added, as we will describe in the
    next chapter. When even more potent support is required, as with severe symptoms
    of depression, then medications may be needed. Whatever else we do, we must remember
    that a well-nourished body provides the physical foundation for a joyful state
    of mind.


    There are five common dietary roadblocks that may be fueling depression or preventing
    recovery:


    *   Poor-quality diet


    *   Blood sugar and insulin imbalance


    *   Faulty digestion


    *   Excess inflammation


    *   Food sensitivities and intolerances


    The following pages will guide you through these potential barriers to resilience.
    You’ll find a description of each roadblock, its impact on mood, and an assessment
    to help you determine if this is happening for you. If it is, don’t worry—the
    brain is incredibly resilient, and we will give you proven strategies to remove
    these roadblocks to healing.


    ## Roadblock One: Poor-Quality Diet


    Even in the healthiest of American diets, there is room for improvement. That’s
    because the standard american diet (SAD) is sadly lacking in nutrients. Here are
    just a few examples:


    *   Many Americans have heeded the call to eat a low-fat diet, not realizing that
    the brain needs plenty of healthy fats to function well. Often those fat calories
    are replaced with sugar or refined carbohydrates that have a further negative
    impact on mood.


    *   Others eat excess amounts of fat, but still don’t get enough of the brain-healthy
    omega-3 fats. That can be hard to do today, because the grains and animal products
    widely available have far fewer omega-3 fats than the foods eaten by our ancestors.


    *   Farming practices have eroded the soil in many areas, leaching out important
    micronutrients. You may think you are eating healthy foods, yet they can be missing
    key ingredients for neurotransmitter production.


    *   Many foods contain chemicals (including fertilizers, pesticides, hormones,
    and artificial colorings or flavorings) that send harmful information to the body,
    disrupting normal cell communication and function.


    *   Nature has designed an elegant package of nutrition in the form of whole foods.
    Refining and processing these foods removes many of the core nutrients that the
    brain needs. When whole wheat is processed, for instance, it loses about 75 percent
    of its vitamins and minerals and 95 percent of its fiber and fatty acids!


    Ironically, in a country where most of us have plenty to eat, for many of us,
    our brains are starving for the nutrients they need. To find out what kind of
    information your diet is providing for a healthy brain, take this brief assessment.


    Exercise: Assessing Your Diet


    Circle the most appropriate answer. When you have finished with section A, continue
    on with section B. Then add up your numbers to get a sense of how your diet rates.


    0—Never


    1—Infrequently (almost never)


    2—Occasionally (some of the time)


    3—Frequently (most of the time)


    4—Always


    Section A


    ![Assessing your diet, Section A](Images/fig3.1.jpg)


    Select the Most Appropriate Number


    ![Number of servings of green vegetables per week, etc.](Images/fig3.2.jpg)


    Add up total for section A.


    Total ___________


    Section B


    ![I drink three or more cups of caffeinated coffee daily, etc.](Images/fig3.3.jpg)


    Select Most Appropriate Number


    ![Number of soda/pop servings daily, etc.](Images/fig3.4.jpg)


    Add numbers from section B.


    Total ___________


    Section A identifies the positive information that food provides to your body.
    The higher the total in section A, the better your body works.


    Section B highlights the parts of your diet that may have a negative influence,
    getting in the way of proper brain function. The higher your total in section
    B, the more strain you are placing on your body—and your mood.


    Strategies for Improving Your Diet


    It may seem obvious that increasing your number in section A and reducing your
    number in section B will be good for your health—and your mood. Most of us know
    what foods are healthful. But there is a gap between knowing and doing, partly
    because there is so much confusing and conflicting information about diet.


    Eating well is simpler than it seems. If you have good digestion and eat natural,
    unprocessed foods, you will get the information you need to nourish your body
    and brain. The following lists will help simplify your food choices.


    FOODS TO INCLUDE


    *   Fresh plant foods, including fruits and vegetables (5 to 13 daily)


    *   Whole-grain, high-fiber foods such as brown rice, wild rice, buckwheat, barley,
    quinoa, whole wheat, and oats


    *   Chicken, lean cuts of grass-fed red meat when available


    *   Fatty fish—especially salmon, sardines, trout, and tuna


    *   Dairy products—butter and cheeses in moderation


    *   Olive oil, flaxseeds, and avocados


    *   Legumes—especially soybeans, lentils, white beans, black beans, chickpeas


    *   Nuts such as walnuts, almonds, pecans, and Brazil nuts


    *   Fresh and dried herbs


    FOODS TO REDUCE OR AVOID


    *   Foods high in refined sugar, such as candy, soda pop, pastries


    *   Processed foods and refined products like white bread, instant potatoes, and
    chips


    *   Trans-fatty acids such as partially hydrogenated oils


    *   Omega-6 fatty-acid oils such as corn, sunflower, and soybean oils


    *   Saturated fat in animal fats


    *   Corn syrup and high-fructose corn syrup


    *   Foods containing artificial sweeteners and artificial colorings or flavorings


    *   Artificial preservatives such as MSG and BHT


    ## Roadblock Two: Blood Sugar–Insulin Imbalance


    Carbohydrates are foods that get broken down into glucose molecules, also known
    as blood sugar. A “simple carbohydrate” gets released as glucose very quickly,
    whereas a “complex carbohydrate” is released more slowly. In this case, slow is
    good; it is much easier for the body to process a steady supply of blood sugar.


    Each cell in the body has its own energy plant, and glucose is the fuel used for
    energy production. But the cells somehow have to get glucose out of the bloodstream
    and inside their cell membranes. That is the job of the pancreas and its hormone,
    insulin.


    Insulin travels to the outside of the cells and “parks” on the insulin receptor
    sites. Once there, insulin acts like a delivery truck that carries glucose into
    the cells. Because this process is so important, the body works very hard to maintain
    the balance between glucose and insulin.


    This balance is disrupted if glucose enters the bloodstream too quickly—after
    a “sugar binge,” for instance. In response to this flood of sugar, the pancreas
    sends out an excessive amount of insulin, which quickly takes glucose out of the
    bloodstream and into the cells. Now you have two problems: blood sugar has rapidly
    dropped, and there are a lot of insulin delivery trucks circulating with nothing
    to do. The crucial glucose-insulin balance has been upset, causing the brain to
    send out distress signals that say, “Get more sugar—now!” This does what any internal
    emergency would do: it sets off the alarms and raises the level of the stress
    hormones.


    ![Insulin spike/ blood sugar drop cycle](Images/fig3.5.jpg)


    Insulin Resistance


    If this imbalanced pattern of excess glucose–excess insulin continues, the insulin
    receptor sites eventually begin to shut down and glucose cannot be delivered into
    the cells. This is a longer-term problem known as *insulin resistance*.


    Insulin resistance has a much bigger impact on mood than most people realize.
    When it is present, the brain cannot efficiently make dopamine, one of the feel-good
    brain chemicals. And since it is so hard to get glucose inside the cells, they
    cannot make enough energy, leaving you feeling sluggish and lethargic.'
