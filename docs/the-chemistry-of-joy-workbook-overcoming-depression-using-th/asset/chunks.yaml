    由于胰岛素抵抗，细胞就像是在富饶的海洋中挨饿一样。你可以吃进很多食物，血液中可能含有大量的糖，但你仍然可能出现低血糖症状，包括：


    * 眩晕

    * 头痛

    * 出汗过量

    * 疲劳

    * 坐立不安

    * 难以集中注意力

    * 挫败感、愤怒和易怒


    ***


    进食高加工、高热量密度、营养缺失的食物会导致血糖和血脂剧烈波动。这种状态被称为 `postprandial dysmetabolism`（餐后代谢异常），会产生即时的氧化应激（过量的自由自由基）。自由基的增加会急性触发炎症，降低血清素，并干扰睡眠和能量——所有这些因素都会影响情绪（O’Keefe,
    Geewala, and O’Keefe 2008）。


    ***


    ### 德布拉的故事


    “我觉得自己就像是杰基尔博士和海德先生，”德布拉坐在椅子上时宣布道。她无法集中注意力，感到焦虑，而且“一点就就着”，但她最担心的是自己的情绪波动，以及食欲增加、精力低以及——以及她无法控制的糖分渴望。


    我们查看了她的饮食，发现她通常跳过早餐，因为她没法早早起床。午饭往往是意式面条配红酱和一个苹果。德布拉注意到，每当她在傍晚或傍晚下班回家时，她通常感到非常饥饿。她在晚上
    7 点左右做晚餐时，经常吃点饼干并喝一杯葡萄酒。“通常我白天的表现很好，但晚上我真的非常渴望食物，尤其是碳水化合物。”


    她通过增加富含蛋白质的早餐开始康复。她对糖敏感，因此需要全天多吃几餐小份的餐食。我们建议她在午餐中加入蛋白质，并确定了一个下午晚些时候的“小食”，以缓解能量低谷和晚上对糖糖的渴望的影响。


    四周后，当德布拉回来复检时，她报告说情况非常好，并宣布道：“我的情绪波动几乎消失了——而且我瘦了五磅！”她能够减少对能量以赖的咖啡因和糖分。“我无法相信效果这么好。我感到如此平衡和轻盈。”


    ## 评估你的血糖-胰岛素平衡


    在所有适用项目旁边打钩：


    * 我会头痛，吃东西后可以缓解。

    * 我在两餐之间感到不耐烦或愤怒。

    * 我渴望甜食。

    * 一旦吃了甜食，我似乎无法停下来。

    * 我在下午会崩溃（能量耗）。

    * 我在下午会吃甜食。

    * 我经常跳过早餐。

    * 我有时跳过午餐。

    * 我早餐吃贝果包、谷物或糕点。

    * 我难以集中注意力。

    * 我会恐恐慌发作。

    * 我有糖尿病家族史。

    * 我有酒精依赖家族史。

    * 我有肥胖家族史。

    * 当我不频繁进食时，我会感到发抖或晕厥。

    * 我大部分时间感到疲劳。

    * 吃完富碳水化合物的饭后我感到困。

    * 我晚上特别饥饿。

    * 无论我做什么，似乎都无法减轻。

    * 我有 ADD 或 ADHD 诊断。

    * 我有糖尿病。

    * 我有酒精依赖。

    * 我肥胖。


    如果你勾选的框少于三个，请遵循下方列出的通用建议。如果你勾选了三个或更多框，或者你在带有星号的 `any` 一个问题旁边打了钩，请包含列出的补充剂以改善胰岛素和血糖平衡。


    ## 改善血糖-胰岛素平衡的策略


    平衡血糖和纠正胰岛素抵抗是影响情绪最有效的饮食策略之一。通过饮食，有可能重新获得胰岛素和血糖的正确平衡，从而提升你的情绪和能量。


    ### 通用建议


    * 每三到四小时吃一次饭，例如早上 7:30、上午 11:30、下午 3:30、晚上 6:30。

    * 永远不要跳过正餐或零食，即使你并不那么饿。吃一点小东西只是为了确保能量的持续供应并避免血糖低落。

    * 偏好也是高纤维的复合碳水化合物；它们分解成简单糖的时间更长。

    * 永远不要单独吃谷物；始终将谷物与蛋白质和脂肪一起吃。例如，如果你在吃一片吐司，配一个鸡蛋或在吐司上涂上杏仁酱。


    ### 应包含的食物


    * 高纤维、复合碳水化合物；水果、蔬菜、豆类和全谷物能促进糖的缓慢释放。

    * 每餐都含有优质蛋白质和脂肪；它们能减慢糖的释放并有助于避免胰岛素飙升。

    * 单不饱和脂肪，如橄榄油，也能减缓速度。

    * 每天四分之一到半茶匙肉桂有助于增加胰岛素敏感性（Qin, Panickar, and Anderson 2010）。


    ### 应减少或避免的食物


    * 简单碳水化合物和高度精制加工的食品，如白面包和糕点、白意面条、白土豆和糖果。

    * 酒精，它是一种浓缩糖。

    * 代糖饮料；人工甜味剂会导致不健康的胰岛素反应（Nettleton et al. 2009）。

    * 避免高果糖玉米糖；它会导致糖分渴望，因为它无法向你发送信号（通过一种名为 `leptin` 的信使）告诉你你饱了（Bray, Nielson, and
    Popkin 2004）。


    ### 胰岛素-血糖平衡的补充剂


    * `Magnesium`：每天 500 mg

    * `Fish oil`：每天 1000 mg

    * `Alpha lipoic acid`：每天 500 mg（胰岛素敏感性）

    * `Chromium picolinate`：每天 200 mcg（帮助抑制渴望）


    ## 第三障碍：消化不良


    任务是将食物分解成更小的物质，以便进行吸收。维生素、矿物质和其他化合物在消化过程中被“释放”出来。不幸的是，许多人面临营养缺乏，因为他们的消化不良。


    消化不良对健康和情绪产生影响：


    * 免疫力受损：免疫系统的 70% 位于肠道，当消化不良时功能下降。

    * 营养缺乏：当胃酸不足时（例如由于使用酸酸或慢性压力），会影响产生神经递质所需的蛋白质和 B 族维生素。

    * 炎症：消化不良产生炎症因子，导致身体疼痛和大脑化学物质产生问题。


    ***


    肠内膜有一层细胞屏障，防止细菌通过肠道进入血液。但如果这些细胞由于暴露于毒素或饮食不良而变脆弱，屏障就会变得渗透性，允许细菌渗入肠壁。这可能会导致疲劳或全身不适等症状。它也与重度抑郁有关。2008
    年的一项研究发现，重度抑郁患者“肠漏”的发生率远高于健康志愿者。建议对重度抑郁症进行检查，并在必要时对肠道渗透性进行治疗（Maes, Kubera, and
    Leunis 2008）。


    ***


    ### 托德的故事


    托德的情绪正在迅速恶化，他感到日益焦虑。他的消化问题干扰了生活的方方面面：“我太忙了，没时间管这些消化问题。我甚至无法运动。”他失去了食欲，因为吃完东西后会产生疼痛性酸流或烧灼感。


    托德两年前被诊断患有 `GERD`（胃食管反流），并开始服用 `Prilosec`（奥美拉唑），这是一种抑酸药物，由于效果不佳，剂量逐渐增加。


