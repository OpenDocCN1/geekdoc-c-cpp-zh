  trans: "\n\n# 甲状腺功能减退\n# 自身免疫性疾病，如风湿性关节炎、红斑狼或雷诺病。\n\n如果您勾选的项目小于三个，请遵循下方列出的通用建议。如果您勾选了三个或更多选项，或者针对带有星号的任何问题，建议您进行排除挑战（障碍五），以确定是否是食物过敏引起了炎症或影响了您的情绪。\n\
    \n## 缓解炎症的策略\n\n由于炎症对大脑具有破坏性影响，减少炎症是改善情绪的首要策略。以下建议包含了减少炎症的通用策略，这些策略对每个人都有帮助。当你处理障碍二和五（血糖-胰岛素平衡和食物过敏）时，你也在缓解炎症。\n\
    \n### 通用建议\n\n- 注意饮食中的脂肪类型。Omega-6 脂肪（包括大多数烹饪油，如玉米油、葵花油、红花油和大豆油）会促进炎症，而 omega-3\
    \ 脂肪可以减少炎症。我们需要这两者，我们祖先这两者的比例约为 1:1。现在我们摄入的 omega-6 脂肪多得多，比例接近 20:1。因此，虽然我们可以开启炎症模式，但很难再次将其关闭。\n\
    \n- 通过限制玉米油、红花油、葵花油和大豆油来减少 omega-6 脂肪的摄入。相反，请使用：\n    - 大多数烹用的橄榄油\n    - 葡萄籽油用于高温烹饪\n\
    \    - 橄榄油和亚籽油用于沙拉酱\n\n- Omega-3 脂肪酸（EPA 和 DHA）减少促炎因子（细胞因子）的产生。它们还有助于建立健康的脑膜，允许细胞间的正常通信。\n\
    \n- 通过食用以下食物增加 omega-3 脂肪酸的摄入：\n    - 冷水鱼：鲑鱼、比目鱼、鲭鱼、青鱼、金枪鱼和沙丁鱼；鱼肝油或其他油补充剂\n  \
    \  - 坚果和种子：核桃、南瓜子和新鲜现磨的亚麻籽或亚籽油\n    - 野味、海藻、藻类以及喂亚籽鸡的蛋\n\n- 维生素 C：存在于柑橘类水果、西红柿、绿叶蔬菜、欧芹、卷心菜、芦笋、牛油果、哈密瓜、醋栗、芒果、奇异果、木瓜、辣椒、樱桃、菠萝和草莓中。\n\
    \n- 姜素是姜黄中天然存在的黄色色素，几年来一直被土医学用于管理炎症性疾病和伤口愈合。你可以将其加入汤、炒菜和米饭中。\n\n- 多吃洋葱、大蒜和生姜——它们都因抗炎活性而闻名。\n\
    \n- 豆制品（如豆腐、味噌、毛豆和天贝豆）也可以减轻炎症。\n\n### 需要减少的食物\n\n- 某些脂肪会导致身体炎症。限制肉类、禽类、全脂牛奶、奶油、黄油奶酪的摄入。玉米饲养的动物比草饲或放养的动物含有更多的促炎脂肪酸。\n\
    \n- 反式脂肪酸和部分氢化植物油也会向你的身体细胞传递促炎信号。食品标签现在必须包含每份的反式脂肪含量，并在成分中列出部分氢化植物油。尽量减少使用：\n\
    \    - 人造黄油\n    - 加工的烘焙食品、饼干和油炸食品\n\n- 简单糖和精制碳水化合物会在体内产生炎症环境。尽力限制它们的摄入。\n\n##\
    \ 障碍五：食物过敏\n\n我们的饮食中往往隐藏着让我们的破坏者，让我们感到痛苦。这甚至可能是我们经常食用的某种食物，但如果我们对特定食物敏感，身体就会将其视为“入侵者”：它会激活免疫系统并在全身产生炎症。讽刺的是，你可能甚至渴望你敏感的那种食物，因为引起不适的食物可以带来瞬间的快感。事实上，食物渴望可能提供关于食物过敏的有用线索。\n\
    \n这些不是真正的过敏（就像有些人对坚果或贝壳类过敏那样）。食物敏感比过敏更微妙，因此更难发现。对食物敏感会引发关节疼痛、头痛、银屑病、鼻窦阻塞和消化问题——以及抑郁。\n\
    \n如果你在评估消化（障碍三）或炎症（障碍四）时勾选了多个问题，你可能想要进行排除挑战来确定潜在的罪魁祸首。常见的食物不耐受是乳制品、小麦、茄科类蔬菜和玉米。如果你根据评估怀疑有任何食物过敏，请遵循下方的排除挑战饮食。你可能会发现一种隐藏的食物过敏，它可能释放你的正常消化功能并显著减少炎症和抑郁。这虽然具有挑战性，但可能非常值得；你甚至可能会觉得这很有趣！\n\
    \n### 排除挑战饮食\n\n在最初的十里，你需要排除下方列出的食物。从第十天开始，你将一次“挑战”一种新食物。\n\n#### 需要排除的食物\n\n\
    - 乳制品：我们对乳制品分为两个不同的类别——主要含乳清蛋白的（牛奶、奶油、酸酸奶油、黄油和冰淇淋）和主要含酪蛋白的（奶酪和酸奶）。\n\n- 小麦：大多数面包和面条、大多数面粉、烘焙食品、硬粒小麦、粗麦粉和细麦粉。需要注意的是，这并不意味着无麸质。麸质不耐受是完全不同的敏感。小麦中含有麸质，但黑麦、拼写麦中也有麸质，而这些是被允许的。你只是在避免小麦。事实上，你不想消耗包装的无麸质产品，因为它们往往含有玉米粉和土豆粉。\n\
    \n- 茄科类蔬菜：白土豆（指白肉土豆、育州金马和红土豆）、西红柿、辣椒、茄子。\n\n- 玉米：玉米片、玉米饼、爆米米花、玉米油、玉米糖和其他玉米甜味剂；甜菊糖（Splenda）、三氯蔗糖、山梨糖醇都是由玉米制成的。\n\
    \n你还应该排除“白色食物”（白面包、面条、饼干和蛋糕），并避免谷物酒精和啤酒。许多是用小麦和玉米制成的。\n\n你可能会遇到一些不舒服戒断症状，如易怒、头痛、疲劳或你的任何情绪症状。它们会在几天内缓解。每三到四小时吃一次饭以避免食物渴望。\n\
    \n从第一天到挑战结束，记录下你的感受。注意症状、无症状的情况、睡眠和精力。\n\n挑战的关键在于关注你可以食用的食物。在挑战期间，你可以自由包含以下任何食物：\n\
    \n- 谷物：燕麦片、燕麦糠、能量棒、黑麦粉、膨胀米、膨胀小米或脆糙米，搭配杏仁奶、豆奶、大麻奶或米奶。\n\n- 奶酪：羊奶酪和羊奶、羊奶油、羊奶酸奶；羊奶酪。\n\
    \n- 椰奶、椰子酸奶和椰子奶油。\n\n- 谷物：黑麦、燕麦或拼写麦制成的面包；米饼、米饼干和黑麦饼干；荞麦面（そば）、拼写麦面、糙米面、糙米、白米、野生米、燕麦、大麦、小米、荞麦、藜。\n\
    \n- 豆类：所有的豆类，包括黑豆、白豆、扁豆、鹰嘴豆、蚕豆。\n\n- 蔬菜：除了玉米、辣椒、白土豆、西红柿和茄子外，所有蔬菜都可以食用。红薯和山药是可以的。\n\
    \n- 水果：所有水果都可以。\n\n- 蛋白质：所有的蛋、禽类、鱼类和肉类。可以包括你正常的牛肉、猪肉或其他蛋白质。\n\n- 坚果和种子：除非已知过敏，所有的坚果、种子和坚果酱。\n\
    \n"
- fmt: "\n*   Oils and fats: All oils and fats are to be included except butter, margarine,\
    \ and corn oil. Use mainly olive oil, canola oil, sesame oil, safflower oil, coconut\
    \ oil, or peanut oil.\n\n# CHALLENGING ELIMINATED FOODS\n\nAfter ten days it is\
    \ time to reintroduce eliminated foods by testing, or “challenging,” one new food\
    \ at a time. When you test a food, you should eat relatively large amounts of\
    \ it (between five and six servings). People frequently wonder if eating so many\
    \ servings of a food in a day will cause a reaction. And the answer is no—the\
    \ amount of food does not matter. You may feel full of corn or wheat, for instance,\
    \ but no reaction will occur unless you are sensitive to it. \n\nReactions can\
    \ include common and familiar symptoms or symptoms you’ve never had before, such\
    \ as retaining water, or having itchy skin or a rash. Even if you think there\
    \ is another explanation for how you are feeling (for example, “I am so tired\
    \ today because I didn’t sleep well last night”), you should still take note.\
    \ You may not have slept well because you challenged with corn the day before\
    \ and your body reacted as if there were an enemy on board. Reactions can also\
    \ include mood symptoms like depression, irritability, or anxiety.\n\n*   **Day\
    \ 11**: `Dairy (whey)`: Milk, ice cream (without corn syrup), sour cream, and\
    \ butter.\n*   **Day 12**: Wait-and-see day. Follow regular elimination: no corn,\
    \ wheat, dairy, or nightshades. Note any type of reaction.\n*   **Day 13**: Wait-and-see\
    \ day. Follow regular elimination: no corn, wheat, dairy, or nightshades. Note\
    \ any type of reaction.\n*   **Day 14**: `Dairy (casein)`: Any kind of cheese,\
    \ cottage cheese, and natural yogurt.\n*   **Day 15**: Wait-and-see day. Follow\
    \ regular elimination: no corn, wheat, dairy, or nightshades. Note any type of\
    \ reaction.\n*   **Day 16**: Wait-and-see day. Follow regular elimination: no\
    \ corn, wheat, dairy, or nightshades. Note any type of reaction.\n*   **Day 17**:\
    \ `Wheat`: Use whole-wheat cereal, whole-wheat crackers, whole-wheat pasta, and\
    \ whole-wheat breadsticks.\n*   **Day 18**: Wait-and-see day. Follow regular elimination:\
    \ no corn, wheat, dairy, or nightshades. Note any type of reaction.\n*   **Day\
    \ 19**: Wait-and-see day. Follow regular elimination: no corn, wheat, dairy, or\
    \ nightshades. Note any type of reaction.\n*   **Day 20**: `Nightshades`: Potatoes,\
    \ tomatoes, peppers, and eggplant. (If tomatoes or peppers give you heartburn\
    \ or indigestion, only use potatoes when challenging.)\n*   **Day 21**: Wait-and-see\
    \ day. Follow regular elimination: no corn, wheat, dairy, or nightshades. Note\
    \ any type of reaction.\n*   **Day 22**: Wait-and-see day. Follow regular elimination:\
    \ no corn, wheat, dairy, or nightshades. Note any type of reaction.\n*   **Day\
    \ 23**: `Corn`: Use fresh ears of corn, frozen corn, popcorn (natural), or corn\
    \ chips.\n*   **Day 24**: Wait-and-see day. Follow regular elimination: no corn,\
    \ wheat, dairy, or nightshades. Note any type of reaction.\n*   **Day 25**: Wait-and-see\
    \ day. Follow regular elimination: no corn, wheat, dairy, or nightshades. Note\
    \ any type of reaction.\n\nIf you reacted to a food, you should avoid it for an\
    \ additional eight weeks. After the eight-week period, you can begin to rotate\
    \ the food back into your diet slowly to find out how often you can eat it without\
    \ having a reaction. Start by eating the food once a week, then once every six\
    \ days, and then five days; and finally, settle on rotating that food into your\
    \ diet once every four days. As you can see, having a food sensitivity is not\
    \ a sentence to never having that food again, but it is a message to be mindful\
    \ about it.\n\n# Tracking Your Progress\n\nResearch shows that simply intending\
    \ to change doesn’t work very well. Having a goal doesn’t do it either. What research\
    \ has shown is when people make a concrete plan, track their progress, and see\
    \ themselves as successful, they are far more likely to carry out their goal.\n\
    \nFor example, a recent study aimed to increase the consumption of fruits among\
    \ college students. All 177 participating students were asked to set the goal\
    \ of consuming more fruits for a seven-day period. They were randomly assigned\
    \ to four groups. One group simply had the goal. Another group had the goal and\
    \ some idea of how they would implement the goal. A third group imagined themselves\
    \ being successful. The fourth group was asked to set the goal, to make a concrete\
    \ plan, write it down (when, where, and how they would buy, prepare, and eat the\
    \ fruit), and visualize themselves being successful. This last group ate twice\
    \ as much fruit as any of the others (Knauper et al. 2011).\n\nWe encourage you\
    \ to make use of this insight when you make your own goals, remembering that action\
    \ is a critical step in the process of change. We suggest setting a few simple\
    \ but specific goals, developing a concrete plan, and then tracking your progress.\
    \ Be sure to make your goals both clear and achievable, and limit the number of\
    \ goals you are working on at any time. You are far more likely to reach all of\
    \ your goals if you can focus on just one or two at once. After achieving one\
    \ goal, move on to another.\n"
