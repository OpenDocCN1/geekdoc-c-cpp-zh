    “As I read through *The Chemistry of Joy Workbook*, the word heuristic repeatedly
    came to mind. A ‘heuristic’ is an experience-based technique for problem solving,
    learning, and discovery. Henry Emmons and team have written a book rich in heuristic-like
    solutions to an eternal dilemma: Why are we unhappy and how does this lack of
    joy further complicate our lives? Step by step, and through a brilliant journal-like
    design, *The Chemistry of Joy Workbook* identifies and unravels the obstacles
    to the science of satisfaction.”


    —Peter D’Adamo, ND, MIFHI, author of *Eat Right 4 Your Type* and director, Center
    of Excellence in Generative Medicine, University of Bridgeport


    “A thoughtful, user-friendly, wide-ranging guide to attitudes and practices that
    will make your journey through depression easier, faster, and more fruitful.”


    —James S. Gordon, MD, founder and director of The Center for Mind Body Medicine
    and author of *Unstuck: Your Guide to the Seven-Stage Journey Out of Depression*


