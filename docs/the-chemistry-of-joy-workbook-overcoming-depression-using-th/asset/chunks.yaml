    凯瑟琳（Kathryn）正坐在桌前，弟弟发来的一封邮件出现了。消息并不妙：她父亲的癌症复发了，活检显示是侵袭性类型。她的第一反应是本能的：震惊和恐惧表现为胸部紧闷、身体颤抖以及腹部一种冰冷、下沉的感觉。接着，她的思维大脑为这些生理感觉增添了文字：*这不可能！他看起来那么健康，对于他的年纪来说那么强壮。这怎么可能呢？*她想象了最坏的情况：*这次可能不会有任何治疗方法了。他将在痛苦中死去，我母亲的悲伤和需求将吞噬我们。*


    凯瑟琳已经进入了“第二支箭”的领域。她不再处于当下，而是处于未知的未来，对自己讲述一个由焦虑的大脑创造的故事。她开始感到不知所措、绝望，并且无法处理自己的情绪。她责备自己如此软弱、如此恐惧。由于无法集中注意力工作，她一整天都沉浸在自己的思想和情感中。她关掉了手机，以避免与家人进行任何交流。当她的孩子们从学校回家时，发现她很疏远、内向，不像平时的样子。他们感到很困惑，离开家去找了一个友好的邻居。


    ### 约翰的故事


    她的哥哥约翰（John）对同样的情况采取了完全不同的反应方式。尽管消息令人不安，但他跳过了身体感受，直接进入了思维模式。他采取行动，通知了其他其他成员，并联系了一位肿瘤科医生朋友评估预后。他认为行动是最好的回应，想起了父亲的格言：“没有什么好害怕的。动起来就好。”他决定不去感受，在和妻子说话时他注意到了一丝悲伤，但很快就移开了这种情绪，通过玩游戏来分散注意力，直到深夜。


    约翰多年前曾经历过一次重度抑郁发作，现在任何悲伤的迹象对他来说都是一个警告。他选择分散注意力并保持舒适的麻木，而不是去感受那种他担心会将自己推入抑郁深渊的悲伤。他的妻子为他感到担心，但被隔之门外，无法接近他。她独自去上床，带着自己的情绪，想着他们是否能就彼此的恐惧或悲伤达成共鸣。


    ## 情绪反应连续体


    观察约翰和凯瑟琳反应（以及你的反应）的一种方法，是将它们放在一个连续体上观察。这个情绪体验的连续体从“断联”（意识不到情绪）范围到“淹没”（被情绪所压倒）。


    ![表格：断联/抵抗/开放/固着/淹没](img/fig7.1.jpg)


    ### 断联 (DISCONNECTED)


    当你与情绪体验`disconnected`时，你的身体或思绪中没有对情绪的感知。这是一种极端的模式，尽管它可能不时时地发生在任何人身上。当你与自己的情绪体验断联时，你生活在一种疏离生活体验的状态，可能会感到空虚，或与自己及他人感到疏远。


    ### 抵抗 (RESISTANT)


    在上面的例子中，约翰展示了`resistant`的反应模式。当你抵拒自己的感受时，会有一个意识的（有时是自动的）决定避开它们，以避免感受它们的痛苦。抵抗是基于对可能发生坏事或你无法处理这种情绪的恐惧。这可能导致其他痛苦的情绪，如紧张或烦躁。维持抵抗需要能量，而且你错过了意识到情绪中智慧的机会。虽然在极大痛苦时滑入这种模式是自然的，但当它成为你处理情绪的常规模式时，就会出现问题。如果你能保持正念并意识到这种模式是一个问题，你可以学习将你的反应转向`open`模式。


    ### 固着 (FIXATED)


    `fixate`——变得痴迷或心神不安——是另一种常见但有问题的反应，也是凯瑟琳所经历的模式。在这种模式中，你感受到的情绪由于你的思维大脑而变得复杂。它产生的想法和故事只会延长并加剧痛苦。情绪的自然周期——到来、停留一段时间、然后消失——被阻塞了，很难让情绪流走。你变得心不在焉，无法参与需要你关注的事物。由于找不到你的中心，即你的`observing
    self”（观察自我），你被困在情感的洪流中，无法决定行动方案或照顾自己。同样，这种模式可能偶尔发生，但当它经常发生时就会出现问题。保持正念是从固着转向更具流动性的`open`反应的关键。


    ### 淹没 (FLOODED)


    在在这种极端状态下，你可能会发现自己完全被情绪瘫丧失了能力，并可能采取对自己或他人产生伤害的行为。虽然这并不常见，但这种被情绪淹没的感觉可能会导致羞愧和自我批判，这些都是抑郁的诱因。下一章将提供更多关于应对淹没的细节和工具。


    ### 开放 (OPEN)


    保持开放，转向并拥抱你所有的情绪，是情绪韧性的关键。当你能够带着正念保持开放，关注身体的感受，注意到想法及其产生的影响，而不被它们带入过去或未来时，这种情绪就会经历它的自然生命周期。在整个周期中保持临场，可以丰富你的生活，并为理解你自己和你的处境开启大门。在本章的剩余部分中，我们将为你提供信息和工具，帮助你培养这种重要的能力。


    ## 评估你的情绪反应模式


    通往情绪韧性道路的一一步是识别你自己在情绪产生时的体验模式：即你自己移动到情绪反应连续体上不同位置的倾向。和每个人一样，你发展了自己的“情绪舒适区”，其中包含了你欢迎或寻找的情绪，而另有一些更痛苦或困难的情绪是你避开或感到被淹没的。


    为了增加对你自己的反应模式的认知，请将以下情绪列表分类到随后的三个类别中。


    ![表格：情绪列表](img/fig7.2.jpg)


    ![空白表格：我抵抗、回避或断联的情绪/我开放且舒适的情绪/我感到难以应对或固着的绪](img/fig7.3.jpg)


    为了最好利用这些信息，请思考你的分类并回答这些问题：


    *   我经常抵抗或断联情绪？为什么会这样？（导致这种模式的信念、规则或行为是什么？）

    *   在这些情绪中，哪些我可以开始开放？

    *   我经常会对哪些情绪固着或感到被淹没？为什么会这样？（导致这种模式的信念、恐惧或行为是什么？）

    *   在*这些*情绪中，哪些我可以开始开放？

    *   我对哪些情绪是开放且舒适的？

