    *   特别关注第一口，感受你如何生动地品尝它，舌头和整个口腔是如何变得活跃的。调动所有的感官：观察食物，它的形状、颜色和分量。在入口前闻闻它。当食物触碰嘴唇并进入口时，感受它的温度、分量和质地。品尝每一口，注意口腔不同区域味觉体验有多大不同。你甚至可以留心地听身体享受美食时发出的声音。


    *   非常缓慢地咀嚼每一口，克制快速吞咽并进入下一口的冲动。让每一口都成为一次刻意的行为，一种值得品味和享受的活动。


    *   注意进食的力学，颌部和舌头的动作，身体知道如何处理食物、咀嚼并将其移向喉咙的方式。在食物被充分咀嚼、味道被完全提取之前，抵抗吞咽的冲动。然后密切关注吞咽的动作。


    *   继续这样做，每当心智带你走向别处时，就回到对吃饭的感知。


    *   将部分注意力放在腹部上，特别留意何时开始感到满足（仿佛已经吃够了）。看看这种情况是否会发生，以及你是否可以在产生饱腹感`之前`停止进食。


    *   尝试在每餐的至少部分时间这样做，并尽可能对一整顿饭这样做。


    * * *


    # 行走的冥想


    行走的冥想是一种简单的练习，即使你是那种难以坐不住的人也可以进行！行走的冥想能培养正念，同时也能注入活力并放松心情。你可以在私密区域的室内行走，也可以选择在自然界中行走。你可以持续很长时间——二十分或三十分钟——也可以将其调整到你白天进行的任何较短的步行中，例如走向饮水器或从家里走到车旁。


    * * *


    ## 行走的冥想说明


    *   注意姿态，保持警觉而放松。手臂应自然地垂在身体两侧。


    *   你的目光应该是柔和的，直视前方几英字的地面。如果你在户外行走，可能需要对周围环境保持意识，但要保持目光柔和且接纳，不要扫描或专注于你周围的事物。


    *   双脚稳稳地落在地上，将注意力集中在脚部接触地面时的感受上。你可能会发现，在脑中将每一步记为抬起、移动和落脚的序列会有帮助。


    *   有意识地关注呼吸，将其作为注意力的另一个锚点。让呼吸保持自然，你可能会发现过一段时间后，它会与你的脚步同步。


    *   你可以改变速度。如果你在室内行走，步子迈小一点，移动得慢一点。如果你在户外，以让你感到放松、从容的速度行走。


    *   享受你的行走。不需要匆忙，没有到达的压力。


    * * *


    ## 进阶练习：正念冥想练习


    关于冥想有许多误解，你可能听过其中一些。正念冥想并不是停止所有的念头。它不是反思你现状并产生创造性想法的时刻。它也不是为了达到某种奇异的愉悦状态或逃避情绪的努力。冥想，正如我们练习和教导的那样，是刻意留出时间，静静地观察自己当下的内在体验。之前描述的日常生活中的正念练习将帮助你静息身心，但只有在冥想中，你才真正地训练自己的注意力保持在当下，并最终进入处于“猴心”中心的广阔感知与寂静状态。这种这样安稳心智的能力是我们在书中后续章节中教导的其他技能的起点。


    为了培养某种持续性，我们建议你每天找一个固定时间用于冥想；当你这样做时，冥想就变成了一种习惯，就像吃早餐的习惯一样。忙碌的日程、干扰、缺乏他人支持以及你自己对沉默的不适，都是培养冥想练习的挑战。我们由心建议，如果可能的话，请找一位老师和其他人一起冥想；如果不可，请寻找一个可靠的信息来源和引导性冥想。


    获取更多资源（包括后续说明的录音版本），请访问我们的网站：`[www.partnersinresilience.com](http://www.partnersinresilience.com)。


    * * *


    ## 坐冥想说明


    *   舒适地坐在冥想垫、长凳或椅子上。你的背部应该挺直但不要僵硬，肩膀打开但保持放松。头部应与脊柱对齐，下巴微低。


    *   你可以闭上眼睛，也可以让眼睛稍微睁开，固定在前方二到三英处的地面某一点。


    *   将舌尖放在牙齿后方上方的上腭上，放松面部并松开下颌，通过鼻子呼吸。


    *   检查你的位置，看看是否需要调整以感到更舒适或更直立、更警觉。如果不适干扰了你的冥想，稍后调整身体没关系。只需缓慢、有意识地重新调整姿态。


    *   一旦你在一个舒适的位置安定，将注意力转移到呼吸。跟随呼吸几个完整的循环，注意腹部的动作或空气进入和离开鼻孔的感受。


    *   以呼吸为锚点，静静地坐着。当你意识到心智游到了思绪中时，只需注意到这一点，并在不加判断的情况下，将注意力回到呼吸。这就是正念的练习，所以不需要刻求任何东西。一次又回到当下`就是`练习本身。


    *   偶尔，你的注意力可能会扩展到身体感受。这些也可以成为你正念的对象。练习感知这些感受而不给它们贴上好坏的标签，仅仅是体验。


    *   对于周围空间的声音或活动同样如此。这些现象不是干扰，而是可以成为当下感知的另一个焦点。再次，练习体验它们而不在大心中标记。只需注意到。


    *   当然，念头会产生，有时你会发现自己深陷于正在讲述的故事或正在制定的计划。这是心智的本能，所以没问题。当你注意到这种情况发生时，只需回到你的呼吸锚点。正念冥想练习有助于培养所谓的“观察自我”：你的一部分，能够在体验的同时看到正在发生的事情。这就像坐在河岸边，观察思想和情感的流。一个接一个进入视野并消失。你不需要跟随它们，只需坐着。


    *   当你意识到自己分心且注意力减弱时，将其作为一个正念的时刻。这就是训练心智保持当下的练习，最终它会自然平静下来。


    *   在每一个正念时刻，记住这是一种基于温柔的练习，没有好坏对错之分。这不是一个自我提升计划或竞争。


    * * *


    ## 正念冥想练习的好处


    正念练习是转化性的。持续练习的人报告：


    *   更强的幸福感


