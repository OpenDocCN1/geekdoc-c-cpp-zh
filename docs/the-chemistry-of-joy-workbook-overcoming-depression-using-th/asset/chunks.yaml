  trans: '


    ![](img/cover.jpg)


    “抑郁了吗？焦虑？在寻求处方药之前，请拿起《喜悦化学工作簿》（The Chemistry of Joy Workbook）并按照指示操作。这本书就是答案，我强烈推荐它！”

    —克里斯蒂安·诺瑟普（Christiane Northrup），医学博士，妇科医生，《纽约时报》畅销书《女性身体》、《女性智慧》和《绝经期智慧》的作者


    “我向许多人推荐过亨利·埃蒙斯（Henry Emmons）的《喜悦化学》（The Chemistry of Joy）。在《喜悦化学工作簿》中，他对增强情绪韧性提供了实用且可操作的建议，这与我的整合心理健康哲学完全契合。如果你想体验更积极的心情，你会发现这本书非常有帮助。”

    —安德鲁·韦尔（Andrew Weil），医学博士，《自发幸福》、《健康老龄化》、《八周达到理想健康》及其他书籍的作者


    “这本书对抑郁症提供了一种精妙的新颖分析，将其视为积极心理和生理因素的崩溃，并为读者提供了一个强大的工具箱，用于在心智、心灵和身体中恢复这些因素。它植根于科学，极具实用性，专注于积极面且充满关怀，是感觉更好以及增强内在力量和韧性（从而从源头上防止抑郁情绪）的极佳资源。”

    —里克·汉森（Rick Hanson），博士，《佛的大脑》和《仅仅一件事》的作者


    “《喜悦化学工作簿》为任何与抑郁症斗争的人提供了丰富的实用信息和建议。通过易于获取的疗法和简单的指令，这些专家作者提供了一份全面的自我护理计划，从身体、心智和精神三个层面解决抑郁症的根源。”

    —詹姆斯·湖（James Lake），医学博士，国际整合心理健康网络主席，《整合心理健康护理教材》的作者


    “许多伟大的智慧传统告诉我们，喜悦和快乐不是需要重新创造的条件，而是每个人与生俱有的、天性的。我们的任务是消除那些阻碍我们实现生活内在快乐的障碍。《喜悦化学工作簿》是一个神奇的工具，可以帮助任何人实现这一目标。”

    —拉里·多斯西（Larry Dossey），医学博士，《预感的力量》和《重塑医学》的作者


    “《喜悦化学工作簿》温柔、慈爱且坚定为我们提供了通往我们共同追求的宁静绿洲的工具，为我们每个人提供了体验生活最佳馈赠的机会。”

    —大卫·波尔穆特（David Perlmutter），医学博士，FACN, ABIHM，《提升你的大脑》的作者


    “这是一本真正实效的工作簿！它提供了一套卓越的自我评估工具，可以帮助你更好地了解自己，以及你可能经历的任何心理挑战的成因。它既实用又易理解，并提供了获得真实洞解的机会。”

    —菲利普·莫菲特（Phillip Moffitt），生活平衡学院创始人，《从情绪混乱到清晰》和《与生命共舞》的作者


    “这本工作簿是一条真正的救命稻草。遵循它清晰、引人入胜且设计专业的步骤，你将体验前所未有的治愈与繁荣。”

    —拉拉斐尔·库什尼尔（Raphael Cushnir），阻碍你的那一件事》的作者


    “对于需要一种结合现代精神病学和替代医学最佳智慧的平衡方法的人来说，这是一个非常需要的综合。这本书以直接的方式传达了大脑化学科学，用通俗易懂的语言解释了抑郁症的医学治疗，让许多想要理解内心痛苦的人受益。我特别感激贯穿这本实用书籍的慈悲心和丰富的经验。这是一部极具专业素养且充满爱心的著作。”

    —玛丽·海耶斯·格里科（Mary Hayes Grieco），中西部宽恕训练学院主任，《无条件的宽恕》的作者


    “通过详尽的问卷、案例示例和涵盖各方面的个性化解决方案，这本用户友好型工作簿提供了基于科学的建议，帮助你重新与那与生俱来的喜悦建立联系。只需阅读并应用它——你会为自己的决定而感到高兴的！”

    —海拉·卡斯（Hyla Cass），医学博士，《八周通往活力健康》的作者


    “亨利·埃蒙斯又做到了！一种利用他带给我们的治愈力量的喜悦方式。多么伟大的工具，多么富有远见的信息！”

    —凯特琳·德斯·梅森森（Kathleen DesMaisons），博士，《土豆不要西普普林》的作者


    “这是一本组织严密、文字清晰的书，展示了一个循序渐进的过程，使读者能够创造更丰富、更有意义的内在生活。”

    —皮亚·梅洛迪（Pia Mellody，《面对依赖》和《亲密因素》的作者


    “如果我有一本书可以给每一个想要热爱他们所生活的生活并过上他们喜爱的生活的人，那将是这本。它是你与生俱有的生命力的肥料。”

    —道娜·马尔科瓦（Dawna Markova），博士，《我不会虚度此生死去》、《开阔的世界》以及《随机善行》的合编者


    “这本书是心-体-饮食关联这一新兴领域的杰出典范。它代表了一条经过临床验证的增加幸福感的路径，这种路径能转化为对生活更大的喜悦。”

    —巴里·希尔（Barry Sears），博士，《区域》的作者


    “《喜悦化学》帮助了许多深受抑郁症困扰的人不仅生存了下来，而且蓬勃发展。这本工作簿将增加这一数字，因为它引导读者进行一系列反思练习和实践，这些练习源于个人改变源于自我接纳的理念。以亨利·埃蒙斯真实的风格，这种方法既扎实又严肃，但恰当得轻快——这正是那些被自责感压垮的人所需要的。正如一位精神让我想起埃蒙斯的佛教老师所说：‘你现在的样子就是完美的——但你确实需要一点改进！’”

    —帕克·J·帕尔默（Parker J. Palmer，《治愈民主的心脏》、《让你的生命开口》和《教学的勇气》的作者


    “这本工作簿在许多方面都反映了埃蒙斯本人：它是善良、富有洞察力、支持、实用且智慧的。这是为与抑郁斗争的人提供的超级工具。作者们创造了变得更快乐、更有韧性的最佳指南。”

    —斯科特·香农（Scott Shannon），医学博士，精神科医生，科罗拉多大学精神科助理临床教授


    “《喜悦化学工作簿》不仅仅是另一本自帮助书籍。亨利·埃蒙斯、苏珊·布杰里、凯琳·丹顿和桑德拉·凯彻创造了一张发现我们内在活力和健康的卓越地图。他们提醒我们，医疗保健的下一次革命不在于发现更多的魔药，而在于支持我们的韧性潜力。这本工作簿对我的患者和我来说将是无价的资源。我期待与他们一起走健康之路。”

    —詹姆斯·杜菲（James Duffy），医学博士，FANPA，精神科医生，塞拉图斯斯森整合医学主任


    “《喜悦化学工作簿》将传统治愈方法的智慧与科学策略的严谨性相结合，充满了富有洞见的思想和赋予力量的实践。这些内容不仅有助于治愈抑郁症患者的绝望和孤独，还将作为通往意义、联系和福祉生活的个人成长与转型的指南。浸入这些治愈建议中，开启新生活方式的开端。”

    —丹尼尔·J·西格尔（Daniel J. Siegel），医学博士，心念研究所执行主任，加州大学洛杉矶分校医学院临床教授”


