  trans: "\n“我一直是一个非常喜欢‘深度’讨论的人。初中的时候，我就在问生命的意义了。我对那些沉迷于支持足球队或为舞会做装饰的人嗤之以鼻。我觉得他们很轻浮。在明尼苏达州，每个人都在谈论天气。我拒绝加入他们。同样，我觉得他们很浅薄。我只想谈论感受和意义。我想我成为一名心理学家并不意外。在职业生涯早期，我不得不从大城市搬到一个人口只有八千人的小镇。因为我在一家心理健康中心与其他治疗师一起工作，我能够进行我喜欢的深度交谈。但那里发生了一件趣事。那个小镇位于北方森林中，几乎每个人都用木柴炉取暖。我觉得这是一个浪漫的想法，所以，经历了一些小事故后，我学会了如何操作自己的炉子。这为我开启了一个新世界——木材的世界。我把那里的经历称为‘学聊木头’。我学会了谈论整担木柴、壁炉木、混合硬木以及木材干燥的合适时长。事实证明这几乎是一种通用的语言，并为我开启了许多话题。当然，这通常引发了关于其他主题的更多个人化对话。我仍然喜欢聊木头，当我在壁炉里燃烧一根处理得当的枫木时，它的香气会立刻带我回到那个社区以及我在那里建立的纽带。”\n\
    \n## 反思问题\n\n在与人交谈之前，你可能会他们施加哪些要求？___________\n\n你希望他们看起来像什么样或穿什么衣服？___________\n\
    \n他们的宗教和政治信仰必须与你一致吗？___________\n\n你对他人的教育水平和职业类型有多大的开放程度？___________\n\n根据第一印象，你最容易否定哪一类人？___________\n\
    \n写下你意识到自己对某人的最初判断是错误的经历。___________\n\n如果你愿意，你可能会从哪里开始放松你的要求？___________\n\n\
    ## 一分钟社区\n\n亲密、终身相的友谊和家庭关系为我们的生活增添了深度和丰富，但它们并不是获得愉悦且有意义连接的唯一机会。追溯到小学的友谊处于连接谱系的一端，而‘一分钟社区’则处于另一端。你可以在一分钟内体验到一个一分钟社区……它们发生在某些时刻，比如当你站在杂商店排队时，或者在书店向另一个正在浏览的人评论某本书时。它们不需要是那种会有某种发展的关系。它们已经存在了。虽然短暂，但它们可以创造出持续几小时的连接之光。它们可以开启你的心灵。\n\
    \n### 通过心灵连接\n\n佛教导师佩玛·秋卓伦（Pema Chödrön）提供了一种思考人类心灵的美妙方式。她将人心比作海葵。海葵的顶部有一个洞，它是开放的，以接收其海洋家园提供的食物。然而，当海葵因某种方式受到震惊或惊吓时，它会自动关闭开口。这保护了外壳内脆弱的生物，但也意味着尽管它沉浸其中，却无法获得任何养分。\n\
    \n同样，人类的心可以开放来接受爱和连接形式的滋养。它也可以在面对威胁或惊吓时本能地关闭。当我们受到来自他人的伤害时，心灵对关闭变得尤为脆弱。虽然趋向于自我保护是本能，但习惯性关闭的人类心灵可能会忘记再次开启。以下练习鼓励你记得开启。\n\
    \n### 开启心灵冥想\n\n*   无论你的心感到完全敞敞的还是长期关闭的，都可以邀请开放进入其中。\n*   从静静坐在一个支持警觉且允许舒适的姿势开始……专注于呼吸的节奏吸气和呼气。\n\
    *   片刻后，邀请你的心灵平静，让你的呼吸变深、变慢……轻轻地充满和排空。\n*   现在，将一只手的掌心放在你的心脏中心——胸口胸骨正上方……将你的注意力集中在你身体的部位……它是感觉像石头一样紧绷坚硬……还是像充满阳光的窗户一样温暖开放……还是像鸟一样颤动……或者其他方式？无论你发现它是怎样的，都邀请你的心灵稍微开启一点，变得温暖、变软，在呼吸的温暖中放松。\n\
    *   保持这种练习几分钟，只需将呼吸引向心脏中心，引导温暖的感觉深层进入心脏……也许在心中念着这些词：*欢迎，你在这里很受欢迎*。\n*   在舒适的一段时间后，感谢自己愿意尝试这种体验。\n\
    *   即使感觉没有发生，将注意力引向心脏中心的行为也是在邀请它温暖、变软，重新获得欢迎生命的能力。\n\n## 慷慨：孤立的伟大解药\n\n你是否经历过给予或接收恰好事物的快乐？你是否感到你的心被礼物触动时变得温暖并扩张？作为给予者也曾是接收者，你是否注意到两者的感觉是相似的？根据佛的说法，慷慨的行为会消融小我。给予者没有报答的想法，接收者没有产生负债，慷慨的行为将世界从一个孤立的世界变成一个连接的世界。当然，这是一个暂时的世界，但在孤独的时刻可以被回味和品味。在慷慨的世界里，你的收获是我的快乐，你的幸福带给我快乐。在慷慨的世界里，你的成功不会威胁或削弱我的成功。这是一个可以通过任何给予行为被召唤产生的世界。\n\
    \n### 培养慷慨的心灵\n\n*   静静地坐在一个舒适的姿势，专注于你的呼吸。让你的心灵沉淀。\n*   将你的注意力放在心脏中心，留意此时的任何感受，并接纳它。\n\
    *   回想一个最近收到好消息的人。当你脑中形成这个人的清晰形象时，尽情慷慨。\n*   默默地向此人提供这样的词句：\n    *   愿你的快乐增长并常伴左右。\n\
    \    *   愿你的成功持续。\n    *   你的快乐带给我快乐。\n*   注意这种感觉如何。如果你对此有抵触，只需敞开它，并记住你培养慷慨心灵的意图。\n\
    *   如果这很困难，对自己慷慨一点，也许将同样的词句引向自己的心灵：\n    *   愿我的快乐增长并常与我同。\n    *   愿我的成功持续。\n\
    \    *   愿我分享所有人的快乐。\n*   当你感觉这个过程结束时，将注意力带回呼吸一两分钟。\n*   在这一天中记住这些词句和意图，默默地向你遇到的每个人提供它。\n\
    \n## 用宽敞的心灵倾听\n\n连接的关键要素之一是能够深度倾听他人。真诚倾听的礼物是你可以给予他人的最慷慨的礼物之一。\n\n有一个关于小镇举办的一场小镇英雄比赛的故事。当比赛冠军由一个被老邻居提名的五岁男孩获得时，镇民们感到非常惊讶。当他接受当地报纸的采访并问及他做了什么时，他的回答简洁而有力：“嗯，拉森先生在拉森太太去世时很难过，所以我就坐在他的大腿上，让他哭吧。”"
