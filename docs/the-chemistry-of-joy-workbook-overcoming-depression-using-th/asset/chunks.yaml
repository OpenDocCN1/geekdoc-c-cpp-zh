- fmt: "\n- Give yourself as completely as you can to the flow of the emotion and\
    \ its changes. You may notice that it builds, reaches a peak, and then begins\
    \ to subside. If you’ve experienced the full cycle of the emotion, notice how\
    \ you feel after the wave of feeling has subsided. If you have not had a complete\
    \ experience of the emotion, know that you can return to this process and work\
    \ through the feeling at your own pace, and you can also do this in your everyday\
    \ life experience.\n- End this meditation with a few cycles of simple awareness\
    \ of your breath, allowing whatever emotional sensation remains in your body to\
    \ pass. It may help to send a gentle instruction to yourself to let go of these\
    \ emotions for now. Take time to allow this to happen, and for your body and mind\
    \ to return to as quiet a state as is possible right now. Appreciate your experience\
    \ for whatever awareness it has brought to you.\n\n## Reflecting on This Meditation\n\
    \nWriting your reflections on this meditation can anchor your felt experience\
    \ in your thinking mind. This may help you to transfer the learning to your daily\
    \ life experience, which is the ultimate goal of this exercise.\n\nAnswer the\
    \ following questions, and also note any other questions or observations that\
    \ come to you as you reflect.\n\n- What emotions did I experience? Did they change\
    \ during the course of the meditation? How?\n  ___________\n  ___________\n- Where\
    \ in the body did I sense each of the emotions I experienced? How would I describe\
    \ these sensations? How did they change over the course of the meditation?\n \
    \ ___________\n  ___________\n- Were my emotions easy to recognize and name, or\
    \ did I have trouble identifying what they were? How familiar were they?\n  ___________\n\
    \  ___________\n- What thoughts did I have during this experience? How did they\
    \ affect the emotions I was feeling?\n  ___________\n  ___________\n- What was\
    \ it like to be with these emotions without distracting myself or otherwise shutting\
    \ down?\n  ___________\n  ___________\n- How was it for me to let the emotion\
    \ pass?\n  ___________\n  ___________\n- In summary, what did I learn about my\
    \ way of being with these difficult emotions?\n  ___________\n  ___________\n\n\
    ## Moving Deeper: Working with Difficult Emotions\n\nAs you worked through the\
    \ meditation on sensing emotion in the body, you might have wondered, as many\
    \ do, just what to do when your emotions seem to demand some sort of response\
    \ or action. After all, these emotions can be complex and they occur in the context\
    \ of real life. Often they present you with a problem to be solved, or they leave\
    \ you with a level of distress that doesn’t seem to pass on its own. The following\
    \ six-step process will provide you with a way to work through your difficult\
    \ life experiences, using emotions as a guide to your inner wisdom.\n\n### Step\
    \ one: Simply notice. Begin with awareness of the emotion in your body and mind.\
    \ Ask, `What is happening now?` This will include body sensations, thoughts, and\
    \ perhaps memories.\n\n### Step two: Invite and open. It might seem more natural\
    \ to distract yourself from difficult feelings, but with mindful curiosity you\
    \ can say yes to everything that is coming up. It’s helpful to silently say to\
    \ yourself `yes`, or `just open`, in order to counteract the natural tendency\
    \ to contract with resistance. Remember the spirit of mindfulness, which is nonjudging\
    \ acceptance of whatever is appearing at the moment. Simply notice all your reactions,\
    \ even the resistance, and open to them. Consciously relax your body and remember\
    \ to breathe mindfully.\n\n### Step three: Explore the causes. At this point it\
    \ is helpful to ask `Why am I feeling this? What words, interactions, or other\
    \ factors came together with my own sensitivities to create this response?` This\
    \ is not done in the spirit of blaming someone or something for our responses,\
    \ but in the search for understanding in order to respond skillfully.\n\n### Step\
    \ four: Identify possible actions. Sometimes, listening to your emotional responses\
    \ and understanding their causes will suggest a course of action to be taken in\
    \ the moment. For example, if anger has been triggered by hurtful words from your\
    \ friend, an appropriate response would be to find a way to express yourself to\
    \ that friend. At other times the action may need to wait until a later time.\
    \ For example, if it is too hard to express yourself to your friend, you might\
    \ seek help to develop your own assertiveness so that the next time, you can respond\
    \ immediately. If you see actions that can be taken in the moment, take them.\
    \ If they must be postponed, just mentally note those actions and move on to the\
    \ next step in this process.\n\n### Step five: Care for yourself. Whether or not\
    \ there are constructive actions to take, you can always be aware of whether these\
    \ emotions have left you in need of some attention. You might wish to seek out\
    \ the support of a friendly listener you trust. But often the person most able\
    \ to give you exactly what you need is `you`. Perhaps it’s comfort, some expression\
    \ such as “Yes, I know, this is really painful.” Or you might need to hear some\
    \ sort of affirmation like “This is difficult, but you did a good job of handling\
    \ it.” You might need some basic self-care such as sleep, exercise, or a comforting\
    \ cup of tea. Listening carefully, you can befriend yourself.\n\n### Step six:\
    \ Allow the feelings to pass. When all is said and done, feelings sometimes linger.\
    \ Some feelings are simply more intense than others, and some situations need\
    \ to be reworked multiple times. However, it is important to know when you are\
    \ simply holding on too tight, or reigniting the flames of the emotion by replaying\
    \ the story in your mind. It’s human to hold on, and it might take a conscious\
    \ decision to be willing to let go. Some emotions have a long half-life, and while\
    \ you are waiting for them to pass, it helps to simply accept and allow, releasing\
    \ the stories you tell yourself about them.\n\n## Working Skillfully with Emotions\n\
    \nThis exercise is designed to help you use this six-step process in a real-life\
    \ situation of your own. You may choose the same experience as you did in the\
    \ previous meditation or choose another.\n\nFirst, sit quietly for a few minutes\
    \ and recall the situation in much detail as possible, noting the setting, the\
    \ situation, or interactions that triggered the feelings, words that might have\
    \ been spoken, and so forth. If you can, recall the emotions as they appeared,\
    \ as they intensified, and how the experience ended, noting your body sensations,\
    \ thoughts, and actions. Record your description below.\n\n___________\n___________\n\
    ___________\n___________\n___________\n___________\n___________\n___________\n\
    ___________\n___________\n\nNext, using the grid below, you can analyze your experience,\
    \ noting (without judgment!) what your experience was at each point in the process.\
    \ In the last column, note your insights and ideas about handling such situations\
    \ even more skillfully in the future. You’ll find that the process as described\
    \ previously will give you some ideas, and your own insights will also arise.\
    \ Remember, there are no wrong answers.\n\n![Table: Step/ My Experience/ Reflections\
    \ and Insights](Images/fig7.4.jpg)\n\n## Last but Not Least: Open to What Is Pleasant\n\
    \nAs you’ve worked through this chapter, you’ve gained insights and skills for\
    \ working with the daily emotional experiences that are difficult, that cause\
    \ distress. This is the most obvious, but not the only, pathway to becoming more\
    \ emotionally resilient.\n\nAs a human being, you are hardwired to scan the environment\
    \ for danger, for what seems potentially threatening. This is a good thing if\
    \ you’re surrounded by actual threats, but as a natural default it creates the\
    \ tendency to pay attention to only half of what’s happening. The other half is\
    \ a rich storehouse of pleasure, renewal, and joy, all of which feed emotional\
    \ resilience.\n"
