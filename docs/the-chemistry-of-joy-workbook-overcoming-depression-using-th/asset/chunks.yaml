    *   The disconnected heart is burdened from the outside by the experience of loneliness
    or isolation caused by social upheaval, loss of loved ones, ruptures in relationships—and
    from the inside by our own tendency to shut down and withdraw whenever we feel
    threatened.


    Even the most resilient among us may become fearful or depressed when visited
    by several of these enemies at once. And even those who are most vulnerable may
    remain resilient if they take care to keep restoring themselves in the face of
    that which is depleting.


    This workbook is designed to guide you toward balancing your body, settling your
    mind, and connecting your heart, so that the enemies of joy have far less power
    over you. They can be fierce, but you can be just as fierce in how you respond
    to them.


    ## The Breakdown of Resilience


    Resilience is essential to the joyful life. When you have a deep source of resilience
    and the skills to maintain it, you are able to adapt to change, to face challenges,
    and to deal with life’s inevitable stresses and still come out all right, perhaps
    even strengthened, on the other end. In this naturally resilient state, joy can
    enter of its own accord, just as the grass grows in springtime simply because
    the conditions for its growth have returned.


    Resilience is your nature, yet it is under siege. Mental and emotional disorders
    are now epidemic, creating great personal and societal suffering:


    *   Of Americans over age eighteen, 26.2 percent (more than one in four adults
    in this country) suffer from some type of diagnosable mental disorder in any given
    year (Kessler et al. 2005), and nearly half of them meet criteria for more than
    one disorder (U.S. Census Bureau 2005).

    *   Mood disorders, including major depression, `dysthymia` (a milder but chronic
    depression), and bipolar order, affect 20 million Americans (10 percent) each
    year (Kessler et al. 2005). Depression is the leading cause of disability in the
    United States, and will soon be number one throughout the world (World Health
    Organization 2008).

    *   According to IMS Health, as reported by National Public Radio (Shute 2011),
    doctors wrote 254 million prescriptions for antidepressant drugs in 2010, making
    them the second most prescribed drugs after cholesterol-lowering medications.

    *   Anxiety is even more common, with one in five (60 million) people in the United
    States suffering from a diagnosable anxiety disorder (Kessler et al. 2005).


    There are a host of other conditions that are also stress related, such as insomnia,
    hypertension, heart disease, memory disorders, gastrointestinal problems, and
    drug and alcohol abuse. Virtually every chronic illness is impacted by stress.


    The frequency of these problems has increased dramatically over the past few decades.
    What can be done to reverse this breakdown in resilience?


    ## Resilience Is Not Lost, Just Waiting to Be Reawakened


    We have worked with thousands of people, individually and in groups, to help them
    reclaim their lives from the grip of depression. Surely, this takes courage, and
    courage is aided by the belief that it is at least `possible`—not only for others,
    but also for you—to awaken to joy. What has worked for thousands of others can
    also work for you.


    If you were in our offices, you would hear stories of inspiration like these:


    *   *Cheryl has a rich life with a rewarding career, three lovely children, and
    a supportive husband and friends. There seemed to be no reason for it, yet she
    had suffered frequent and debilitating depressive episodes throughout her life,
    despite very good mental health care. In the spring following her participation
    in our program, she said, “For the first time in my adult life, I made it through
    the winter without a depressive episode!” That was four years ago, and she still
