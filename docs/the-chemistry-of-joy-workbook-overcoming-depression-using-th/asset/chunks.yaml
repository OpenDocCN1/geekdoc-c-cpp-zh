    “At first glance, my garden looks pretty barren. I feel worn out, and kind of
    beaten up by the winter I’ve been through. It’s a wonder that I could survive
    it. That tells me something about my strength. I must be more resilient than I
    thought!


    It feels hard to pick up the pieces of my life. I’ve lost so much. Still, I’m
    feeling better, and more hopeful now than I have for a long time. I can look at
    my garden and see signs of life, too.


    A lot of the dead stuff in my garden seems like it came from someone else’s life;
    it doesn’t really feel like me at all. Some of the habits I picked up—lying around
    on weekends, keeping to myself so much, eating things I know aren’t good for me—that’s
    not me! I used to be so active; friends used to be so important to me. Now I have
    some relationships that just aren’t healthy for me. I want to start paying more
    attention to how I feel when I’m with certain people.


    I’ve made some mistakes, that’s for sure, but maybe I don’t have to be so hard
    on myself. I want to be able to grow from my ‘failures’ and to remember that I’m
    always doing the best that I can at that moment. For example, I think there’s
    a disconnect between me and my job. Work is not a healthy place for me right now—too
    much pressure and people are too negative. I’m ready for something new.


    I’ve always been so busy; that was probably one of the reasons I’d get depressed,
    because I was so stressed. Now, though, my garden looks a little sparse. I want
    to add things without overdoing it. I think the two things most important to add
    right now are really quality friends—and playing more. I want to learn how to
    be a good friend and to have more fun again!


    I’m also excited about getting to know myself better, to spend more time reflecting
    or just being quiet. I didn’t think that was really important, but now I see myself
    differently. I’m someone worth knowing.”


    # Becoming Your Authentic Self


    A friend was spending time with his family, when a song reminded him of his adolescent
    dream of becoming a rock star. Specifically, he had wanted to be `Bob Dylan`.
    Upon hearing this, his four-year-old niece pointedly remarked, “Uncle Larry, you
    can only be who you really are!”


    To live with joy, it is important that you become who you really are. That sounds
    so simple—how could you be anything but yourself? Yet many people are really trying
    to be someone else, a choice that can create unhappiness no matter how good the
    other person seems to be, because it is not authentic for you.


    Dawna Markova writes: “Healing insists that you reexamine everything—all of your
    habits, ideas, beliefs, values, passions, inhibitions, assumptions—until you find
    those things that are truest at the core, discarding everything else. It demands
    that you nurture your questions until you discover how to create the kind of environment
    where you have integrity with yourself and the world on a daily basis” (`Markova
    1994, 12`).


    If that sounds like hard work, it is. But it is also one of life’s primary purposes
    and can become a source of great joy. One of your greatest aids in the search
    to become yourself is to move toward that which you deeply desire.


    Picture a swan walking toward its desire: a calm pond on a hot summer’s day. That’s
    the image in a well-known poem called “The Swan” (`Rilke 1982, 29`). The poet,
    Rilke, describes a swan moving clumsily on land, as if his legs were caught up
    in ropes. Haven’t we all had times of moving awkwardly through our days with great
    effort, held back from success or happiness as if we, too, were bound by ropes?


    But the swan just keeps moving toward the water, as if he is irresistibly drawn
    toward it. And then, when he reaches the water, all awkwardness dissolves as he
    is held effortlessly and moves gracefully, looking like a king in complete control
    of his destiny. He has found his element.


    It is easy to become focused on the struggle, on the things that seem to hold
    you back. But in Rilke’s poem, the swan doesn’t bother too much with that. He
    doesn’t try to understand or fix his problems, doesn’t need to separate them one
    by one, or name them or get rid of them. He doesn’t look outside himself for reasons
    for “what’s wrong.” Instead, he just lumbers on, unconcerned about his awkwardness,
    until he reaches the water’s edge and is transformed.


    Suddenly, there are no more ropes, no more things left undone, no more awkwardness.
    When you find your water—your true home—and enter it, the poet says that moment
    is a little bit like dying. In order to leave the familiar ground on which you
    have been standing, you have to let go of the life that you have clung to so very
    tightly. You must let go of the old, the firmness of what is known, to make room
    for the new.


    Once upon the water, the awkward bird is transformed into a thing of beauty and
    majesty, effortlessly gliding ahead toward an unknown future. Despite the uncertainty
    into which it moves, the swan is at total peace, completely at home.


    It can be like that for you, too. When you finally enter your element, when you
    let go of the striving, when you stop trying to be good or to get something that
    will fill you up, then you, too, can float effortlessly upon your own life. You
    can let yourself be guided by your life stream, neither pushing against the current
    nor grasping at the banks. Of course, you will still face pain, failure, and loss—as
    we have seen, they are part of the condition of life. But if what you want is
    joy, then you can stop fighting the flow of life. You can surrender to your life,
    becoming more and more fully yourself.


    # Finding Your Element


    Ask yourself these questions, allowing yourself time to reflect on them. Notice
    whatever comes up for you: images, memories, ideas, feelings. You may want to
    use the dialogue process described previously:


    - What is your water? What is your element? When do you feel most at home?

    - What are you like when you feel most alive?

    - When and where do you come alive like this? Who are you with, what are the activities,
    what are the conditions that bring you to life, that give you the greatest joy?


    # The Soul Was Meant for Joy


    This workbook began with the statement “Surely joy is the condition of life.”
    Hard as it is to believe that sentiment at times, we have come to see the deep
    truth in Thoreau’s words. Joy is present at all times, providing an undercurrent
    of sustenance and support, whether or not we realize it.


    Many people long for a dramatic spiritual awakening—some sort of out-of-body or
    mountop experience—in the hopes that it will be life changing and finally, once
    for all, open them to joy. But there are many ways to awaken, and other, subtler
    paths that can lead to a more sustained experience of joy.


    Charlotte Joko Beck, a pioneering Zen teacher, once said, “Joy is exactly what’s
    happening, minus our opinion of it” (`Beck 1994, 233`). In other words, it is
    simpler than we think—not easy, but simple—to access joy, because it can be present
    in anything.


    Here is how one traveler of these pathways described a recent experience of joy:


    I had had a difficult day, and I was struggling with my mood. I’d already worked
    all day and had to work that evening, but I took a little break and went for a
    walk along a busy bike path. For the first few minutes, I became absorbed in my
    thoughts, focused upon all that was going wrong. But then I noticed that my mood
    was low, so I decided to put what I had learned to the test. I placed my awareness
    on my heart, inviting it to open as best it could. Then, whenever someone passed
    by on foot or on bicycle, I silently offered a blessing as I held my heart open
    to that person.


    If they seemed preoccupied or low, I said to myself, May you be at peace. I wish
    you well. If they seemed happy or smiling, I said, I’m so glad that you are happy.
    Your joy is my joy.

