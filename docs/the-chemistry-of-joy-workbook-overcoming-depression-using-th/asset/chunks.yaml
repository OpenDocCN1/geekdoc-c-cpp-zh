    Norepinephrine (the `fight-or-flight chemical`) and dopamine (the `pleasure chemical`)
    work in tandem to provide energy and focus. Together they help keep us alert,
    motivated, and able to enjoy life’s pleasures. It is possible to have either too
    much or too little of these stimulating brain chemicals, with dramatically different
    results. In excess they can cause agitated depression, especially if there is
    too little serotonin to provide a calming balance. Deficiency, on the other hand,
    often leads to the mental dullness and physical lethargy of sluggish depression.


    We will take a closer look at the three subtypes of depression in a moment, but
    first let’s explore a few nutrients that we think are essential for a resilient
    brain in all of us.


    ## Basic Nutritional Support


    We view nutritional supplements as a means of supporting the body’s natural functions,
    helping to correct an imbalance, or replenishing essential elements that may have
    become depleted. Ideally their use can be temporary until recovery is complete,
    and then natural food sources can give the brain what it needs to remain healthy
    and balanced.


    There are a few nutrients that provide foundational support for all the subtypes
    of depression. We recommend the following supplements for everyone during recovery
    from depression, at times of heightened stress, or when one’s diet is less than
    optimal. The table below outlines the most important brain-healthy nutrients,
    along with options to minimize their cost. We also list food sources that can
    help you maintain a good supply of these same nutrients after you have regained
    your resilience.


    All of these supplements are absorbed better if taken with meals, except for the
    probiotics, which are best taken on an empty stomach.


    ![Table: Supplement/ Directions/ Less-Expensive alternatives/ Food Source, pg.1](Images/fig4.2.jpg)


    ![Table: Supplement/ Directions/ Less-Expensive alternatives/ Food Source, pg.2](Images/fig4.3.jpg)


    The foundational nutrients above may improve your mood on their own, and they
    will assure that the supplements or medications for each subtype of depression
    have a much better chance of working. We will now look at these three types one
    at a time, with additional questionnaires to help you decide if you have a specific
    neurotransmitter imbalance.


    ## Anxious Depression


    By far the most common subtype of depression, anxious depression has become an
    epidemic in our times. Serotonin levels are under siege, in part because of our
    stressful lives, but even more importantly because we react to those stresses
    in ways that keep the stress hormones elevated. On the other side of the equation,
    inactive lifestyles and poor diets make it harder to produce adequate amounts
    of serotonin.


    With too little serotonin, even mildly stressful situations can cause your mood
    to plummet. People with serotonin deficiency often feel insecure, have a hard
    time putting themselves out into the world, and may feel a need to retreat or
    withdraw, even from friends. They sometimes try to make themselves feel better
    through impulsive behaviors like binge eating or alcohol use, or engaging in overly
    dependent relationships.


    ![Diagram: Low Serotonin](Images/fig4.4.jpg)


    ### Molly’s Story


    Molly was a nineteen-year-old college student. Like many people her age, she felt
    stressed by school pressures and the transition to adulthood. She worried about
    her mother’s depression since her parents’ divorce two years ago. Though Molly
    had friends at school, she felt isolated and withdrawn: “I know it sounds weird,
    but I can feel alone even when I’m with a bunch of people.”


    Molly’s mood was depressed, but she also felt anxious and insecure. While her
    energy was poor, both her body and mind were in constant motion. She had trouble
    falling and staying asleep, and often had anxious or troubling dreams. She felt
    unable to handle even mild stresses, like having to write papers or take exams.
    Her symptoms were worse before her periods, when she also became unusually irritable.


    Molly had several signs of low serotonin. Her symptoms were mild, so we agreed
    to start with the serotonin-boosting supplements discussed later in this chapter.
    She felt so much better after two weeks that medications were not needed. However,
    she still had problems during the week before her period, so we had her increase
    her dose of `5-HTP` and `vitamin B6` for those few days each month. Her PMS symptoms
    were then 80 percent better.


    ### Do You Have a Serotonin Deficiency?


    Mark each of the following statements that describes you at this time (last few
    days or weeks):


    * My mood is anxious or irritable.

    * I have insomnia.

    * I crave carbohydrates or binge eat.

    * My energy is restless.

    * I have an overactive mind and am easily worried.

    * I have feelings of insecurity.

    * I am often impulsive.

    * I have a low tolerance or overreactivity to stress.

    * I am highly sensitive to criticism or rejection.

    * I have feelings of low self-esteem.

    * I tend to be dependent in relationships.

    * I am sensitive to seasonal changes in the amount of daylight (seasonal affective
    disorder, or SAD).

    * I have strong emotional challenges with my monthly cycles (premenstrual syndrome).

    * I have had problems with alcohol abuse or a family history of alcoholism.

    * I have chronic pain.


    ### Scoring


    Add the total number of items checked.


    * 1–5: mild serotonin deficiency

    * 6–10: moderate serotonin deficiency

    * 11–15: severe serotonin deficiency


    Remember that this is not *you*. It only describes you at this moment in time,
    and you can change it by supporting your brain chemistry with the calming supplement
    program that follows, and by following all of the pathways to joy.


    ## Natural Therapies to Calm an Anxious Depression


    If you have mild to moderate symptoms of anxious depression, especially if you
    appear to have a serotonin deficiency, you may find it helpful to add one or more
    of the following supplements. They are listed roughly in order of their usefulness,
    so start with the first supplement and add the others only if you don’t feel better
    within three to weeks.


    `5-HTP` (`5-hydroxytryptophan`): Start with `50 mg` twice daily (on an empty stomach).
    If there’s no response, you may increase the dosage by `50 mg` every three to
    four days, up to `300 mg` daily if needed.


    `Tryptophan` is an amino acid found in food that gets converted first into `5-HTP`
    and then into serotonin. Both `tryptophan` and `5-HTP` can raise serotonin levels
    in the brain (`Nadia et al. 2011`), improving mood, sleep, and memory (`Silber
    and Schmitt 2010`). Whereas `tryptophan` is more sedating and used mainly for
    sleep, `5-HTP` can be either mildly stimulating or sedating.


    It is best to take `5-HTP` on an empty stomach, about thirty minutes before or
    a couple of hours after meals. If it causes mild nausea or headache, it may be
    taken with food. There must be plenty of B vitamins (especially `B6`), `magnesium`,
    and `vitamin C` to aid in the process of serotonin production, so keep your foundational
    nutrition strong.


    **Note that `5-HTP` should not be taken with an antidepressant without medical
    supervision. It can be dangerous to get too much serotonin. Signs of excess serotonin
    include sweating, muscle cramps, agitation, or restlessness.**


    `St. John’s wort`: `300 mg` two or three times daily with meals (may increase
    by `300 mg` every two to three weeks, up to `1,500 mg` daily). It should be standardized
    to `0.3 percent hypericum` or `5 percent hyperforin`.

