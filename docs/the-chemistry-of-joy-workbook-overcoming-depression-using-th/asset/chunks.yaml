  trans: '


    *   继续呼吸，让你内心正在发生的一切都包裹在那个环绕着并流淌在你身上的、充满爱与慈悲的空间中。

    *   当你这样做时，请仔细倾听内心那个受苦的部分。为了治愈，它可能需要你提供什么？你是否可以给予自己一些善意？一个词？一个肯言？如果是的话，请带着慈悲与治愈的精神给予它。

    *   花费你所需的时间，以这种充满爱的方式与那个被你拒绝的自我建立联系。请知道，这个过程可能需要反复一次又一次，这完全没有关系。这种慈悲的源泉随时为你提供，它只需要你留念地向内心敞开放。


    ## 创造接纳自己的生活


    即使治愈过程仍在持续，你可能会创造出与自己相处的新方式，这些方式源于自我接纳，而非旧有的自我拒绝。这种接纳自己的生活始于记住自己是谁以及可以成为谁。


    ### 从愿景开始


    20 世纪 50 年代中期，在曼谷附近，一群僧侣被告知他们必须搬迁，因为一条新的高速公路将穿越他们的土地。搬迁中最挑战性的部分是寺庙佛像的运输，佛像高超过十英尺，重达数吨。这是一个泥土制成的简单塑像，并不精致，但对这些僧侣来说非常有价值，因为它已经在该社区中存在了几个世纪。于是，他们安排工人携带设备来到现场完成搬迁。


    故事说，正当佛像抬离地面时，它开始出现几处裂缝，让僧侣们感到惊恐。他们命令停止工程，直到运来更大的设备。由于开始下雨，他们用用防水布盖住佛像去睡觉了。其中一个僧侣睡不着，主动承担了夜守的任务。他每隔一小时检查一次佛像，确保裂缝没有加深。当他用手电筒照向表面时，他看到了微弱的光芒。近距离观察，他注意到泥土表面似乎有什么东西，于是他去拿锤子和凿子。他小心地凿掉泥土，令他惊讶的是，出现了一层金。他叫来同伴们，大家都带着工具过来，很快他们就发现了一尊实金佛像。


    历史学家认为，这尊佛像创作于 14 世纪或 15 世纪，它曾经被覆盖了一层石膏，以向入侵的缅甸军隐藏其价值。做这些事的人早已去世，佛像真实本质的秘密也随他们一同消失了。现在真相大白，如今今天可以在曼谷唐人街的崇提寺（Wat
    Traimit）看到它。它重五吨，由实金制成。它是无价之。


    ### 你的黄金自我


    多年来，你那在生命早期显而见的金色本质，可能已被层层“石膏”所覆盖——批评、比较、期望、关于你不够价值的故事——直到你失去了与本质自我的联系。


    这个练习旨在帮助你重新连接那个本质自我，并恢复你与它的关系。为这种体验留出足够的静心时间，至少三十分钟。


    1.  坐在一个舒适的地方，身边准备好写作材料，为对自己的生活进行一段时间反思。

    2.  从让大脑平静开始，专注于呼吸，放松身体。

    3.  几分钟后，开始开启你的记忆库。在这些记忆中寻找一个时刻——一个瞬间、几个小时或一天——在那一刻，你想起自己感到最真实的自我、最充沛的活力或完全脱了自我意识和对他人的比较。这可能是一个童年记忆，也可能是近期的过去。给自己留出充足的时间找到一个让你觉得正确的记忆。（注意：如果你觉得这样做有困难，请在另一天再次尝试这个练习，并与某个了解你的人交谈，让他们帮助你想清楚，或者以一种激发你记忆的方式分享他们自己的例子。）


    在你的脑海中用尽可能具体的细节重构那段时间。你在哪里？你在忙什么？谁和你在一起？你记得当时的情绪吗？你还记得其他什么吗？


