    chosen to offer you a gift—a lesson, an insight, a challenge, a difficulty—and
    each of these gifts shares this purpose: to remind you that you are not alone
    and to wake you up to your true nature, the part of you that is and has always
    been completely safe.*


    How would your day unfold if you knew this to be true?


    ___________


    ___________

    ___________

    ___________


    Try bringing this mind-set into your day’s first encounter with another person.


