  trans: "\n冬季和早春也是季节性抑郁症发生的时期，它通常表现为一种迟缓的抑郁。保持你的地球能量平衡可能帮助你避免这种情况。除了所有其他建议外，你可能还想尝试光疗法。其核心思想是欺骗你的身体，让认为白天变长了，日出更早，日落更晚。因此，你希望在一天中的早晨和/或晚上使用灯光。由于大多数人很难在早上起床，因此光照的最重要时间是上午\
    \ 7:00 到 9:00 之间。如果你发现自己在晚上变得非常困倦和迟钝，你可能还想在傍晚（下午 5:00 到 7:00 之间）使用灯光二到三十分钟。关于光疗法正确使用的更多细节以及推荐产品的信息，请访问\
    \ [www.partnersinresilience.com](http://www.partnersinresilience.com)。\n\n## 行动：创建你的能量工具箱\n\
    \n这里有一些当你注意到自己变得更加迟钝时可以采取的简单自我关怀活动，用来让自己冷静。选择几个你喜欢的，以便能够迅速采取行动恢复平衡，并在下方的空白处添加到列表中：\n\
    \n*   享受大自然的时光，沐浴阳光，感受风景和聆听声音。\n*   进行十五到二十分钟的快走。\n*   喝一杯温绿茶或红茶，或者含有生姜或人参的草本茶。\n\
    *   吃低脂奶酪、坚果或其他高蛋白食物。\n*   享受一部动作精彩或戏剧性的书籍或电影。\n*   和优秀的喜剧片、书或有趣朋友一起大——或者只是大笑。\n\
    *   洗个热水澡或泡澡。\n*   和朋友去跳舞。\n*   听一些活泼、充满活力的音乐。\n*   做一次有力的按摩。\n*   去上健身操或热瑜伽课程。\n\
    *   进行五到十分分钟的能量呼吸或右鼻呼吸。\n*   留时间进行祈祷或冥想。\n*   ___________\n*   ___________\n*\
    \   ___________\n*   ___________\n*   ___________\n\n## 总结第 5 章\n\n*   我们每个人各不相同，当我们按照自己的本性生活时，我们的感觉和功能才是最好的。\n\
    *   根据阿育吠陀（ayurveda），有三种不同的能量，它们以不同程度结合形成你的身心体质。这种体质伴随你一生，但这些能量的暂时失衡会让你偏离自我，让你不再感觉像自己。起初，这会导致不适，但如果任其发展，可能会导致疾病。\n\
    *   通过了解你的身心类型并察觉失衡的早期信号，你可以利用饮食和生活方式来恢复平衡并预防疾病。\n*   维持平衡是一场永不停歇的舞蹈。你无法做到完美，但你可以从至少在\
    \ 51% 的时间内做出健康的饮食和生活方式选择开始！\n\n# 第部分部分：心灵路径\n\n## 第 6 章\n\n![平定的符号](img/fig1.4.jpg)\n\
    \n# 平定：走上正念之路通往平静的心\n\n> *我们可以教导自己的心灵保持平静和平衡；在这种宁静中蕴含着丰富和潜，一种内在的知识，可以让我们的生活变得无限地满足和有意义。虽然心灵可能会将我们困在不健康的压力和失衡模式中，但能够将我们释放的也是心灵。*\n\
    > — 塔让·杜库 (Tarthang Tulku)\n\n在忙碌的日常生活中，在周围世界的喧嚣和内心的独白中，自然心灵广阔、清晰的能量往往被我们丢失。平定心灵，立足于当下，能让你更有技巧地处理生活中的思想、情感和经历。\n\
    \n“我的大脑太混乱了，我甚至听不见自己的思考，”亚历山德拉（Alexandra）在我们第一次见面时这样说。她是一位成功的企业高管，工作压力大，拥有二十年的婚姻和两个孩子。在我们相遇几年前，她在一次公司收购中失去了工作，并失业了一年多。尽管她最终找到了一份工作，在此期间，她陷入了焦虑型的严重抑郁发作。抗抑郁药和抗焦虑药物在短时间内有所帮助，但现在的副作用带来的痛苦已经比缓解的更多。她最好的缺省策略是更加努力工作、跑超马马拉松，并在个人生活中过度投入。通过这种方式，她让她反思的大脑安静下来，至少在白天是如此。睡眠与她无缘，因为每当她慢下来并开始接触思想或感受时，她就会感到不知所措和失控。随着她把自己逼得精疲力竭，抑郁愈演愈烈，现在已经威胁到了她的工作甚至她的婚姻。她的策略根本不起作用。\n\
    \n我们鼓励亚历山德拉通过努力平定心灵来开启内在之旅。我们向她引入了“猴心”（monkey mind）的概念，这是一个古老的佛教比喻，将不平静的心灵比作一群猴子，在树枝间疯狂尖叫、狂乱地跳跃，总是在忙动。由于无法平定心灵混乱的运作，亚历山德拉无法清楚地看到，她应对生活的策略是如何造成了她大部分的痛苦、滋养了抑郁并耗尽了她的韧性的。\n\
    \n## 一分钟冥想\n\n在与亚历山德拉合作初期，我们引入了“一分钟冥想”的想法。这一通向安静心灵的第一步很简单，却能带来显著的结果。方法如下，我们邀请你现在就尝试。\n\
    \n*   让身体安静并找到舒适的姿势，尽可能放松你的身体。如果你愿意，可以闭上眼睛，或者只是柔化视线看向你面前的地。这是完全休息的一分钟。\n*   花这一分钟只需自然呼吸，无论你的呼吸速度和深度如何。将注意力有意识地放在每一次呼吸上，从吸气到呼气的整个循环。在呼气结束时让呼吸停顿一下，让呼吸自主开始吸气。你可以选择通过数呼吸来帮助集中注意力。\n\
    *   如果你的心游了，只需将其带回数呼吸或感受呼吸在身体中的移动。\n\n### 反思\n\n花时间通过回答这些问题来反思这段简单的体验。\n\n*  \
    \ 你感知哪些身体感觉？在身体的哪个部位最感觉到呼吸？\n    ___________\n    ___________\n*   你会如何描述呼吸的特征——速度、深度、节奏？它是放松的、收缩的还是急促的？\n\
    \    ___________\n    ___________\n*   你注意到你的想法是什么？你的大脑是忙碌的、安静的、焦虑的还是平静的？捕捉思考并回到呼吸的感觉如何？\n\
    \    ___________\n    ___________\n\n当然，这些问题没有标准答案。整个重点在于停顿，并将注意力从思考的心灵转移到呼吸的身体。当你关注呼吸时，你的中枢神经系统会自动安静，心灵开始平定，身体得到放松。这激活了你自然的治愈潜力。\n\
    \n## 正念心理学\n\n随着亚历山德拉的心灵开始安静，我们向她引入了“正念心理”（psych of mindfulness），这是我们描述治愈和转化痛苦的方法的术语，基于佛教心理学和正念练习。\n\
    \n### 痛苦与不平静的心灵\n\n"
- fmt: '

    In Buddhist teachings, the analogy of the “first and second arrows” is used to
    explain the role of the unsettled mind in the creation of suffering. The first
    arrows of life strike us all in the form of the inevitable experiences of being
    human: illness, aging, loss of those we love, natural disasters, and the list
    goes on. The pain of these first arrows cannot be avoided. The second arrows,
    however, are within our control. The second arrows are those the mind creates
    in reaction to these painful experiences.


    When we observe the mind carefully, we see how our thoughts and stories about
    the events of our lives add layers of unnecessary suffering to the original pain.
    The unsettled mind instinctively rejects and seeks to escape what is painful by
    grasping for diversion in what is pleasant or by emotionally shutting down and
    disconnecting altogether. Doing this, we cut ourselves off from the present moment’s
    experience and engage in a futile attempt to change the reality of our experience,
    which only compounds our distress. These reactive and eventually habitual patterns
    of thoughts and feelings are the “second arrows,” which are 100 percent self-inflicted.


    In Alexandra’s case, the second arrows began with her reaction to losing her job:
    harsh self-criticism, isolating herself from colleagues and friends because of
    the shame she felt, and frenetic activity that distracted her attention. She developed
    multiple fear-based disaster scenarios about her future, which increased her anxiety
    until she was paralyzed and unable to act in her own best interest. Her strategies
    of avoidance and frantic activity kept her from clearly seeing her situation and
    taking more constructive action.


    Although it may seem paradoxical, the way out of the suffering caused by the second
    arrows is to give up the struggle to escape from what’s painful, and to train
    the mind to remain with whatever is arising, nonjudgmentally and openly. This
    is the essence of the practice of mindfulness, which is at the core of our approach
    to healing. We cannot change the events that create our distress, but we can change
    our way of relating to the experience. Rather than being caught up in strategies
    of the thinking mind, we can learn to simply be present to the fullness of each
    moment without judgment and with friendly curiosity. This radical acceptance of
    what `is` can open the door to freedom from suffering.


    If you have experienced depression, this sort of nonjudging acceptance may be
    difficult to imagine. You may have lived the reality that the mind can become
    your enemy, and may feel you have lost a few battles. The biochemistry of depression
    compounds the ordinary distress caused by the unsettled mind, leaving you feeling
    powerless over the negative rumination and anxiety. The second arrows you’ve been
    hit with may include the belief that you are defective or inadequate, or that
    if you just did it right this time, just tried harder or found the right doctor,
    program, therapist, or medication, your problems would be over. You may have a
    heavy dose of shame and the sense that you need to be fixed or to fix yourself.
    As a result of all of these mistaken beliefs, you may suffer from the illusion
    that you are separate and alone, that you don’t belong to the rest of the human
    community.


    What we want you to hear is that there is relief from your suffering. Through
    settling your mind and discovering the spacious awareness that is its nature,
    you can learn to relate even to painful experiences in a new way. You can move
    from struggle, avoidance, or disconnection to being more fully alive and aware
    in the moment, which is the only moment in which change occurs or joy can be found.
    The good medicine of mindfulness practice is the foundation of this transformation,
    and in the remaining chapters of this workbook, we will unfold the key elements
    of mindfulness practice as a pathway of healing and cultivating resilience.


    ## The Good Medicine of Mindfulness


    “I don’t see what the benefit of all this mindfulness is,” said Charles as he
    entered the room. “I’ve been excruciatingly mindful of how bad I’m feeling all
    week. It only makes things worse.”


    Charles suffers from the misconception that mindfulness is simply intensely feeling
    his emotions or paying particular attention to his thoughts. But mindfulness is
    more than that. Mindfulness is a particular `way` of noticing our experience—an
    intentional and curious way of looking at what’s happening in any given moment,
    without having to label it good or bad, acceptable or not acceptable. Mindfulness
    is opening to the present moment, just as it is.


    Mindfulness is more than an idea—it is a way of being. Living mindfully, we greet
    each experience with acceptance and give it our full attention. The unsettled
    mind, however, needs practice to develop this way of living. The remainder of
    this chapter offers tried-and-true practices that will help you begin to live
    more mindfully. We will start with activities that are already part of your everyday
    life. When you do them with intention and awareness, you will be able to capture
    the magic of the present moment—and your mind will settle of its own accord.


    ### Mindfulness in Daily Life


    Each moment of your daily routine offers you a chance to become more mindful,
    to calm your mind and live more fully in the present moment. Here are a few simple
    ways to begin:


    *   As you wake each morning, and before you get out of bed, do the `Just a Minute
    Meditation` (earlier in this chapter).

    *   Eat your breakfast mindfully, without reading the newspaper, watching television,
    or otherwise distracting yourself.

    *   When driving your car, turn off the radio. Pay attention to your hands on
    the steering wheel and consciously relax your grip.

    *   At a red light, focus on taking several full breaths.

    *   Use the ordinary sounds of daily life as a reminder to stop and breathe: the
    sound of the phone, the signal of arriving e-mail, and so forth. Or set your computer
    or other device to signal you at regular intervals to take a breathing break.

    *   Consider that housekeeping chores—like washing dishes or folding laundry—can
    be a time to tune in to your senses and be truly aware of what you’re doing. If
    your mind wanders into planning or analyzing, simply return to the task at hand,
    concentrating on what you see, feel, smell, or hear.

    *   When walking from place to place, focus on the sensations in the body, like
    your feet touching the ground, the breeze on your face. Again, when the mind wanders,
    return to the body.

    *   As you prepare for bed, choose one activity to do mindfully, such as brushing
    your teeth or drinking a cup of herbal tea. Enjoy the sensations.

    *   As you drift off to sleep, practice conscious, mindful breathing.


    ## MINDFUL EATING


    The experience of eating a meal can be a rich exercise in fully appreciating the
    present moment. It provides several opportunities each day to strengthen your
    mindfulness skills.


    ***


    ### Mindful Eating Instructions


    Set aside a mealtime to eat alone or in silence with willing others.


    *   Put some thought beforehand into what you want to eat. Since you will pay
    greater attention to the food, you may wish to choose healthier, more wholesome
    and flavorful fare.

    *   Prepare the food with awareness and attention.

    *   Sit down, close your eyes, and allow the mind to quiet for a few moments.
    Give thanks for your food if you’d like.

    *   Before you take your first bite, notice the feeling of hunger in the belly,
    the sense of anticipation, the changes occurring in the mouth as it prepares to
    receive the food.

