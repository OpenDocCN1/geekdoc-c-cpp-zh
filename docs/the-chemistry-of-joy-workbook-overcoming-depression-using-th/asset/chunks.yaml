    *   Pay special attention to that first bite, how vividly you taste it, how the
    tongue and entire mouth come alive. Engage all of the senses: Look at the food,
    the shape and color and amount of it. Smell it before putting it in your mouth.
    Feel the warmth, substance, and texture as you touch it to your lips and then
    place it in your mouth. Taste each bite, noticing how different the experience
    of taste is in different areas of the mouth. You can even listen attentively to
    the sounds of the body enjoying a good meal.


    *   Chew each bite very slowly, resisting the urge to quickly swallow and move
    on to the next bite. Make each bite a deliberate act, one to be savored and enjoyed.


    *   Pay attention to the mechanics of eating, the movement of jaw and tongue,
    the way your body knows how to handle the food, chewing and moving it back toward
    the throat. Resist the urge to swallow until the food has been thoroughly chewed
    and the taste fully extracted. Then pay close attention to the act of swallowing.


    *   Continue in this way, returning to awareness of eating whenever the mind takes
    you somewhere else.


    *   Keep some of your awareness on your belly, noticing especially when you are
    beginning to feel satisfied, as though you have had enough. See if this happens
    and if you can stop eating `before` you have the sensation of fullness.


    *   Try to do this for at least part of each meal, and do it for an entire meal
    as often as you can.


    * * *


    # Walking Meditation


    Walking meditation is a simple practice, and accessible even if you’re one of
    those people who has difficulty sitting still! Walking meditation cultivates mindfulness
    but is also energizing and relaxing. You may walk inside in privacy, or choose
    to be out in the natural world. You might do this for an extended period of time—twenty
    or thirty minutes—or you might adapt it to any shorter period of walking you do
    during the day, such as walking to the water cooler or walking from your home
    to your car.


    * * *


    ## Walking Meditation Instructions


    *   Pay attention to your posture, being alert yet relaxed. Arms should be comfortably
    at your side.


    *   Your gaze should be soft and directed at the ground a couple of feet ahead
    of you. If you are walking outside, you may need to remain aware of your surroundings,
    but keep your gaze soft and receptive, without scanning or focusing on what surrounds
    you.


    *   Plant your feet firmly on the ground and place your attention on the sensations
    in your feet as they meet the ground. You might find it helpful to mentally note
    each step as a sequence of lifting, moving, and placing the foot.


    *   Be conscious of your breath, using it as another anchor for your attention.
    Let your breath be natural, and you might find that after a time, it becomes synchronized
    with your footsteps.


    *   You may vary your pace. If you are walking indoors, take smaller steps and
    move at a slower pace. If you are out of doors, walk at a pace that feels relaxed
    and easy.


    *   Enjoy your walking. There’s no need to hurry, no pressure to arrive.


    * * *


    ## Going Deeper: Mindfulness Meditation Practice


    There are many misconceptions about meditation, some of which you might have heard.
    Mindfulness meditation is not stopping all thought. It is not a time to reflect
    on your current situation and come up with creative ideas. And it is not an effort
    to attain some rarefied state of bliss or escape from emotion. Meditation, as
    we practice and teach it, is the intentional activity of setting aside time to
    silently observe your own inner experience as it is in the moment. The daily living
    mindfulness practices described previously will help you to quiet your body and
    mind, but it’s only in meditation that you literally train your attention to stay
    focused in the present moment, and eventually enter the state of spacious awareness
    and stillness that is at the center of monkey mind. The ability to settle the
    mind in this way is the starting point for the rest of the skills we teach in
    the following chapters of this book.


    In order to develop some consistency, we suggest that you find a regular time
    of day to set aside for meditation; when you do so, meditation becomes a habit,
    like the habit of eating breakfast. Busy schedules, interruptions, lack of support
    from others, and your own discomfort with silence are all challenges to developing
    a meditation practice. We wholeheartedly suggest that, if at all possible, you
    find a teacher and others to meditate with, and, if that’s not possible, that
    you find a reliable source of information and guided meditations.


    For more resources, including a recorded version of the instructions that follow,
    visit our website: `[www.partnersinresilience.com](http://www.partnersinresilience.com).


    * * *


    ## Instructions for Seated Meditation


    *   Sit comfortably on a meditation cushion, bench, or chair. Your back should
    be upright but not rigid, and your shoulders open but relaxed. Your head should
    be aligned with your spine, chin slightly lowered.


    *   You may close your eyes or allow them to remain slightly open and fixed at
    a point on the floor two to three feet ahead of you.


    *   Place the tip of your tongue on your palate just behind and above your teeth,
    and soften your face and relax the jaw, breathing through your nose.


    *   Check your position and see if you need to shift it to be more comfortable
    or more upright and alert. It is fine to shift your body later, if discomfort
    interferes with your meditation. Simply move slowly and mindfully to rearrange
    your posture.


    *   Once you have settled into a comfortable position, shift your awareness to
    your breath. Follow the breath for a few complete cycles, noting the movement
    in the belly or the sensation of air entering and leaving your nostrils.


    *   Using your breath as anchor, simply sit in silence. When you realize that
    your mind has wandered into thought, just notice that and, without judgment, return
    your attention to your breath. This is the practice of mindfulness, so there is
    no need to strive for anything. Returning—again and again—to the present moment
    `is` the practice.


    *   From time to time, your attention may also expand to include body sensations.
    Those, too, can be the objects of your awareness. Practice noting these sensations
    without labeling them as pleasant or unpleasant, but simply experiencing them
    in the body.


    *   The same will be true for sound or movement in the space around you. Rather
    than being a distraction, these occurrences can become another focus of your awareness
    in the present moment. Again, practice experiencing them without labeling them
    in the mind. Simply notice.


    *   Of course, thought will arise, and sometimes you’ll find yourself far down
    the path into a story you’re telling or a plan you’re developing. This is what
    the mind does, so it is no problem. When you notice this has happened, simply
    return to your anchor in the breath. The practice of mindfulness meditation helps
    develop what is called the “observing self”: a part of you that can see what’s
    happening while you are experiencing it. It is as if you’re seated on the banks
    of a river, watching the stream of thought and feeling. One after another, thoughts
    flow into view and away. There’s no need to follow them; you can simply sit.


    *   When you do notice that you have become distracted and your awareness has
    weakened, use that as a moment of mindfulness. This is the practice of training
    the mind to stay present, and eventually it will naturally settle.


    *   In every moment of mindfulness, remember that this is a practice grounded
    in gentleness, with no good or bad, right or wrong. This is not a self-improvement
    project or a competition.


    * * *


    ## The Benefits of Mindfulness Meditation Practice


    The practice of mindfulness is transformational. Those who practice consistently
    report:


    *   A greater sense of well-being

