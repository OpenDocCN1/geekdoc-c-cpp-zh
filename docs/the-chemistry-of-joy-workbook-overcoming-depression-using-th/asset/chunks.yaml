    Her mood always drops in winter, too, and she no longer recovers fully over the
    summers. Twelve years ago she went on `Zoloft`, which helped dramatically at first,
    but its benefits have faded over the years. The dose kept getting increased, plus
    a stimulant was added for energy and a sedative for sleep—and she still felt miserable.
    Her mood became flat, she felt lifeless, and she could barely get herself up and
    ready for the day. She slept ten to twelve hours per night, yet never felt rested.
    She knew that she should exercise and eat better, but couldn’t muster up the motivation
    to do either.


    Joanne had sluggish depression with a seasonal pattern. Medications helped at
    first but gradually failed her, and in the end they seemed to add to her fatigue,
    weight gain, and even her depressed mood. She gradually cut back on her medication
    as the basic and energizing supplements discussed later in this chapter helped
    get them working again. As she felt better, she began to exercise and eat a lighter
    diet. By the following spring, she was able to get off the medications entirely,
    and now uses only low doses for a few months each winter.


    ## Do You Have a Norepinephrine or Dopamine Deficiency?


    Mark each of the following statements that describes you at this time:


    *   My mood is flat or depressed.

    *   I have trouble getting out of bed in the morning and tend to sleep too much.

    *   I easily put on weight even when I don’t binge eat.

    *   My energy is lethargic.

    *   I have a sluggish mind and am often inattentive.

    *   I have feelings of apathy and passivity.

    *   I may not like feeling stressed, but am slow to take action to change things.

    *   I am sensitive to criticism or rejection, and tend to turn inward as a result.

    *   I have feelings of low self-esteem, further causing me to withdraw.

    *   I tend to be isolated, with few supportive relationships.

    *   I am sensitive to changes in light, becoming excessively tired with drastic
    changes in sleep patterns in winter.

    *   I have low sex drive, or I’ve had problems with impotence.

    *   I have poor memory.

    *   I have little interest in, and derive little enjoyment from, my usual activities.

    *   If I have any addictions, they tend to involve nicotine, caffeine, or stimulant
    drugs.


    ### Scoring


    Add the total number of items checked.


    *   1–5: mild dopamine-norepinephrine deficiency

    *   6–10: moderate dopamine-norepinephrine deficiency

    *   11–15: severe dopamine-norepinephrine deficiency


    Remember that this is not permanent, but simply a reflection of how you are at
    this time. You can become reenergized using the supplement program below and by
    following all of the pathways to joy.


    ## Natural Therapies to Energize Sluggish Depression


    If you have a norepinephrine-dopamine deficiency, or feel sluggish and lethargic
    when you become depressed, consider the following supplements. You may wish to
    begin with `SAM-e`, usually the most potent of these supplements, and then add
    the others only if you don’t improve within two to three weeks.


    **SAM-e**: 400-1,600 mg daily. Take it about thirty minutes before breakfast and/or
    lunch. `S-adenosyl methionine (SAM-e)` supports the production of several key
    hormones and chemicals, including serotonin, norepinephrine, and dopamine (Williams
    et al. 2005). It has been shown to relieve depression even if prescription antidepressants
    have failed (Alpert et al. 2004).


    `SAM-e` works quickly and can be quite energizing, so start low (400 mg daily)
    and increase no sooner than once a week and no higher than 1,600 mg daily. If
    you take more than 800 mg daily, it is best to split it into two doses (before
    breakfast and lunch).


    **SAM-e has been known to trigger a manic episode in people with bipolar disorder,
    and should not be added to medications without your doctor’s supervision.**


    **L-tyrosine and/or DL-phenylalanine**: 500–1,500 mg daily. `Tyrosine` and `phenylalanine`
    are the amino acid building blocks for dopamine and norepinephrine respectively,
    and mood can become depressed if they are deficient (Ruhé, Mason, and Schene 2007).
    Taken as supplements, these amino acid precursors can give a boost to mood, motivation,
    and energy (Lakhan and Vieira 2008). Start with either of them at 500 mg daily,
    and increase by 500 mg once a week if necessary. The two may be combined with
    one another, or even with `5-HTP` if there are also signs of serotonin deficiency.
    They can be stimulating, so watch for problems with anxiety, agitation, or insomnia.


    **Be careful if you have hypertension; these supplements can elevate blood pressure.**


    **Chromium**: 200–500 mcg daily. `Chromium` is a mineral that assists with cellular
    energy production and can also stabilize blood sugar (Albarracin et al. 2008).
    It may be helpful for sluggish depression, especially with carbohydrate craving
    or binge eating (Davidson et al. 2003). When used in the amounts listed, `chromium`
    is considered safe, with few possible side effects including mild headache or
    nausea.


    ## How to Use Medication Wisely


    Natural therapies are not always effective enough on their own to treat or prevent
    depression. Prescription antidepressants are far from perfect, but they can be
    helpful and occasionally even life saving. If you need medication to help in your
    recovery, please don’t see this as a failure or a sign of weakness. It is simply
    another option to be called upon when needed.


    Antidepressant medications fall into two categories: before `Prozac` and after
    `Prozac`. The older drugs (tricyclic antidepressants and MAO inhibitors) are seldom
    used today, in part because they have many side effects and pose other risks.


    Introduced in 1987, `Prozac` changed everything about the treatment of depression.
    It was the first of the `selective serotonin reuptake inhibitors (SSRIs)`, a class
    that includes other well-known drugs like `Zoloft`, `Paxil`, `Celexa`, and `Lexapro`.
    Since they work through the serotonin system, the `SSRIs` are most helpful with
    anxious depression, but can also be used with sluggish depression. Considered
    safer and easier to tolerate, they are used much freely than the older drugs.
    But they are not without their problems.


    The term reuptake inhibitor means that after serotonin has been released into
    the gap between nerve cells, these drugs prevent its reuptake back into the neuron
    where it could be stored and used later. That keeps the serotonin molecule in
    the synapse, where it continues its important job of communicating with other
    neurons. Remember, though, that there is really no more serotonin than before;
    it just seems that way. Since the `SSRIs` prevent the recycling of serotonin,
    they can lead to even further serotonin depletion if you aren’t careful. That’s
    another reason why we put so much emphasis on exercise, diet, and nutritional
    supplements; they can create lasting conditions for a healthy brain.


    Another category of antidepressants is known as `serotonin and norepinephrine
    reuptake inhibitors (SNRIs)`. Since they work on both types of brain chemicals,
    they can be both calming (especially at low doses) and energizing (especially
    at moderate to high doses). `Effexor`, `Cymbalta`, and `Pristiq` may be good choices
    for a sluggish type of depression, or for any depression that has been severe
    or long lasting, or has not gotten better with other measures.


    `Bupropion (Wellbutrin)` is the only antidepressant that works mostly through
    dopamine. It is usually stimulating, which can be good for sluggish or winter
    depressions, but can also trigger anxiety, agitation, or insomnia, especially
    if the dose is too high.


    Besides the antidepressants, there are three other classes of drugs that are often
    used to help in the treatment of depression:


    *   Antianxiety drugs like `lorazepam (Ativan)`, `alprazolam (Xanax)`, and `clonazepam
    (Klonopin)` are effective at calming anxiety but can be sedating and are habit
    forming if used for more than a few weeks.

