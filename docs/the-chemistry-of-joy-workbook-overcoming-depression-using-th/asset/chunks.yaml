    *   Continue breathing, and allowing whatever is unfolding in you to be held in
    this space of loving presence and compassion that is flowing around and through
    you.

    *   As you do this, listen carefully to this suffering part of yourself. What
    might it need from you in order to heal? Is there a kindness you can offer yourself?
    A word? An affirmation? If so, offer it in the spirit of compassion and healing.

    *   Spend as much time as you need, connecting in this loving way with the self
    you have rejected. Know that this process may need to be repeated again and again,
    and that’s perfectly all right. This source of compassion is available to you
    at any time. It only requires you to mindfully open your heart to yourself.


    ## Creating a Self-Accepting Life


    Even as the healing process continues, you may create new ways of being with yourself
    that come from a place of self-acceptance, rather than the old ways of self-rejection.
    This self-accepting life begins with remembering who you really are and can be.


    ### Begin with a Vision


    In the mid-1950s, near Bangkok, a community of Buddhist monks was told that they
    would have to relocate because a new highway was being built through their land.
    The most challenging part of the move was the transport of their temple’s Buddha
    figure, which towered over ten feet high and weighed several tons. It was a simple
    figure made of clay, nothing elaborate, but it was of value to these monks because
    it had been in the community for centuries. So they arranged to have workmen bring
    equipment to their site to accomplish the move.


    The story goes that just as the Buddha figure was lifted from the ground, it began
    to crack in several places, alarming the monks. They ordered the project to stop
    for the day until larger equipment could be brought in, and because it was beginning
    to rain, they covered the statue with a tarp and went to sleep. One of the monks,
    unable to sleep, took it on himself to stand watch overnight. He checked on the
    statue every hour or so, wanting to make sure that the cracks were not deepening.
    As he shined his flashlight over the surface, he saw small glimmers of light.
    Moving closer, he noticed that there appeared to be something under that clay
    surface, and he went to fetch a hammer and chisel. He carefully chipped away at
    the clay, and to his amazement there appeared a layer of gold. He called his fellow
    monks, who all came with their tools, and soon they had uncovered a solid gold
    Buddha figure.


    Historians believe that this statue was created in the fourteenth or fifteenth
    century, and that it had been covered in plaster at some point to hide its value
    from the invading Burmese army. Those who had done this had died long before,
    and the secret of the true nature of the statue had died with them. Now the truth
    was revealed, and the statue can be seen today at the Wat Traimit temple in Bangkok’s
    Chinatown. It weighs five tons and is made of solid gold. It is truly priceless.


    ### Your Golden Self


    Over the years, your golden essence, so obvious early in your life, may have been
    covered with layers of “plaster”—criticism, comparisons, expectations, stories
    about your unworthiness—until you lost connection with your essential self.


    This exercise is intended to help you reconnect with that essential self and restore
    your relationship with it. Allow yourself plenty of quiet time for this experience,
    at least thirty minutes.


    1.  Seated in a comfortable place, with your writing materials nearby, prepare
    yourself for a period of reflection on your life.

    2.  Begin by quieting your mind, focusing on your breath, and relaxing your body.

    3.  After a few minutes, begin to open your storehouse of memories. Search through
    these memories to find a time—a moment, a few hours, a day—when you recall feeling
    most completely yourself, most completely alive or free from self-consciousness
    and comparison with others. This could be a childhood memory, or it could be from
    the more recent past. Give yourself plenty of time to find one that feels right
    to you. (Note: If you have difficulty doing this, try this exercise again on another
    day, and talk with someone who knows you well and can help you think it through
    or share her own examples in a way that prompts your memory.)


    Reconstruct this time in your mind’s eye with as much specific detail as you can.
    Where were you? What were you involved in doing? Who was with you? What do you
    recall about your emotions at the time? What else do you remember?


    ___________

    ___________

    ___________

    ___________

    ___________

    ___________

    ___________

    ___________

    ___________

    ___________

    ___________

    ___________

    ___________

    ___________

    ___________

    ___________

    ___________

    ___________

    ___________

    ___________


    When you’ve completed this writing, reflect back over it and find three or four
    words that capture the experience. You might choose to share this story with another,
    and have that person reflect back the words that come to mind as you talk. Examples
    might be single words, such as “free,” “strong,” “courageous,” “connected.” Or
    you might choose simple phrases, such as “free from fear,” “physically strong,”
    “alive and well,” “loved and accepted.”


    ___________

    ___________

    ___________

    ___________

    ___________

    ___________

    ___________


    Savor this experience. The self you recall in this experience is your golden self:
    your essence, the truth about who you are and can be. You will be using the phrases
    you’ve just written as the basis for creating a new relationship with yourself,
    one that is characterized by befriending and wishing all good things for yourself.


    ## Practice Loving-Kindness for Yourself


    Loving-kindness meditation is a 2,600-year-old practice of wishing for self and
    others the things we all desire most: health, well-being, happiness, peace of
    mind, and so on. In its traditional format, the practice is done during seated
    meditation, and consists of a series of three or four statements expressing these
    intentions, repeated again and again, in harmony with the breath. This traditional
    set of wishes is one example:


    May I be filled with loving-kindness.


    May I be well in body and mind.


    May I be peaceful and at ease.


    May I be happy.


    The meditation begins with the focus on self, where it may need to remain for
    a long time. Eventually the wishes are extended to those we love, those we are
    acquainted with, those we have difficulty with, and, ultimately, all beings. It
    is a profound practice that has great impact on the heart’s capacity for compassion.
    It also creates a sense of social connection and support, increasing life satisfaction
    and reducing symptoms of depression.


    ### Benefits of Loving-Kindness Meditation


    The practice of loving-kindness meditation appears to be related to the reduction
    of depressive symptoms and greater overall life satisfaction. In 2008, Barbara
    L. Fredrickson and colleagues at the University of North Carolina at Chapel Hill,
    along with colleagues from the University of Michigan, published results of a
    study in which approximately half of the 139 adult participants were randomly
    assigned to the practice of loving-kindness meditation, and half were not. Those
    who practiced the meditation reported increases over time in their experience
    of positive emotions, as well as mindfulness, sense of purpose, and social connection.
    These factors were shown to be predictive of decreased depressive symptoms and
    a greater overall degree of happiness.


    As part of healing from shame and self-rejection, we suggest that you practice
    the beginning phase of the loving-kindness meditation: the phase focused on yourself.
    Using the three or four key words or phrases you identified in the previous exercise,
    create your own set of wishes. Using the words in the example given above, for
    instance, the wishes would be:


    May I be free from fear.


    May I be strong.


    May I feel alive and well.


    May I feel loved and accepted.

