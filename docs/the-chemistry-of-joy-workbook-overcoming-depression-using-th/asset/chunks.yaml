    After she stopped crying, Lauren felt numb and drained of energy. She called herself
    names like “loser” and “pathetic.” She was too tired to get back to writing her
    paper. She began to fear that she would flunk the class but felt like it wasn’t
    worth the effort to try. The next day she still felt ashamed and wouldn’t talk
    to Tiffany. When Tiffany asked her what was wrong, she wouldn’t meet Tiffany’s
    eyes, said, “Nothing,” and turned away. Later she started a fight with Tiffany.


    Lauren had now created two walls. One wall was between herself and her feelings.
    The self-aversion that she was experiencing was just too painful, so she had gone
    numb emotionally. Unfortunately, she still had enough energy to “act in”: she
    continued to attack herself for a long list of flaws and mistakes. The second
    wall was between her and the outside world. She had become so disconnected from
    other people that she felt little for them but distrust and hostility—more aversion.


    # FIND THE POSSIBILITIES FOR MINDFULNESS


    - Do the `Just a Minute Meditation` (see chapter 6).

    - Notice that the intensity of the storm experience has passed; things are different
    now.

    - Remember that storms happen to everyone.


    ## After-the-Storm Reflection


    With reflection, Lauren was able to identify the triggers that had started the
    storm and the patterns of thought and feeling that added to its velocity. She
    was able to feel the loneliness and hurt that were magnified when she thought
    Tiffany was excluding her, but with the perspective of her mindful recollection,
    she wasn’t overwhelmed by them. She had achieved a wise knowing about herself,
    and along with understanding came an unfamiliar feeling of compassion toward herself.
    She felt that the wisdom she gained in this reflection would help her avoid so
    much suffering the next time an emotional storm is triggered.


    # FIND THE POSSIBILITIES FOR MINDFULNESS


    - Even difficult experiences like emotional tsunamis have a beginning, middle,
    and end. Their pattern is predictable.

    - Practice attending to feelings on a daily, even moment-to-moment basis.

    - Recognize that storms are part of the human experience. Allow yourself to be
    human, too, and to learn what you can from these storms.


    ## Tracking Your Own Storm


    Find a place where you can comfortably sit and write. You might want to ask a
    good friend to be with you to help support your mindfulness. Sit for a few minutes
    simply focusing on your breathing. Then invite a memory of one of your emotional
    tsunamis into your mind. Begin with the first thing that comes to mind. Write
    about it under the appropriate category below. You don’t have to begin at the
    beginning; you may even find it’s easiest to start at the end of the storm and
    work backwards. It is also possible that the process of writing will help you
    to slow down and to fill in some of the gaps in your awareness. With patient attention,
    your memory may even supply you with more details about the experience. This experience
    is usually more like finding the pieces of a puzzle and putting them together
    than telling a straightforward story.


    ### The Rising of Sensation


    As you remember the storm, can you make contact with your body? Might it even
    be possible to remember the very first moments of tightening that took place somewhere
    in your body: perhaps in your neck or throat, your chest, your gut, or your face?


    ### The Entry of Thought


    What can you remember about the first thoughts? These will be thoughts that describe
    what was happening before you began to interpret the event.


    What else?


    Any more thoughts?


    ### The Flooding of Emotion


    Can you remember and describe the time when things seemed to speed up? Maybe there
    were images or flashes of old memories or maybe just words or phrases.


    Anything else?


    What emotions and sensations happened next? Maybe there was anger or a flash of
    heat in your body. Maybe there was sadness, and tears came to your eyes. Was there
    shame or embarrassment? How did they affect you?


    ### The Entry of the Story Line


    What did you tell yourself about what was happening?


    What effect did the story line have on your feelings in the moment?


    ### The Urge to Escape from Feelings


    Was there a time when you thought, `I can’t handle this?` What did you feel like
    doing?


    ### Acting Out or Acting In


    What did you do next?


    Did you engage in any compulsive habits next? Did you light up a cigarette or
    start eating ice cream? Or something else?


    Did you start criticizing yourself?


    Did you start a fight with someone else?


    ### After-the-Storm Reflection


    Where were there possibilities for mindfulness? When might you have slowed things
    down? Was any damage done to you or your relationships? How can you repair it?
    Do you need to forgive yourself? Apologize to someone else?


    End with a few minutes of the `Just a Minute Meditation` (see chapter 6).


    ## Finding the Seeds of the Storm


    What makes it possible for our emotions to be triggered in this way? Why do some
    experiences become so overwhelming? Generally it is because our “small self” feels
    threatened in some way.


    The small self is that part of us that is concerned for our protection and survival.
    It carries our personal stories, including all the ways that we think we are wrong
    or have been wronged by others. Whether these stories are true or not makes very
    little difference. When we get caught up in the stories or in the perceived threat
    to our small selves, it feels as if nothing else matters.


    The small self believes that it is alone and separate from the rest of existence,
    so it is entirely focused on self-preservation. It believes itself to be weak
    and vulnerable and doesn’t accept that being human means being vulnerable at times.
    Instead, the small self believes vulnerability is a sign of a deep flaw in its
    makeup. It believes that it must do everything possible to hide that flaw. When
    your small self feels threatened, you are at risk for an overwhelming emotional
    storm.


    ## Small-Self Threats


    The small self has a seemingly endless list of beliefs about what is flawed: `You’re
    too fat. You don’t have a degree. You don’t know how to play politics like other
    people. People won’t like you when they get to know you. You don’t deserve as
    much as other people.` You can probably add several familiar ones to the list.
    Most of them arise from one of the following perceived threats:


    ![Table: Physical Survival/ Sense of Significance/ Sense of Belonging/ Feeling
    of Scarcity. Pg.1 - Fear / Belief](Images/fig8.1.jpg)


    ![Table: Physical Survival/ Sense of Significance/ Sense of Belonging/ Feeling
    of Scarcity. Pg.2 - Lauren''s Example](Images/fig8.2.jpg)


    ### How Do You Feel Threatened?


    Review your example of an emotional tsunami and deepen your understanding of it
    by filling in the table below. Which of the following core threats were activated?
    What beliefs arose? How do they apply to what happened in your example? You may
    find that you are most vulnerable to one of the core threats or to several of
    them.


    ![Blank Table: Physical Survival/ Sense of Significance/ Sense of Belonging/ Feeling
    of Scarcity](Images/fig8.3.jpg)


    ## Building a Raft


    The previous exercises help support your mindfulness by bringing curiosity and
    reflection *after* the tsunami has struck and passed. These exercises help you
    build a life raft for the next storm. To add to your raft, review your writing
    and take a few more minutes to reflect on the following questions.


    Are there situations where you are more likely to get caught up in a tsunami?
    Describe them.


    ___________


    ___________


    ___________


    Are there people you find yourself more easily triggered by? Who are they? Do
    they have anything in common?


    ___________


    ___________


    ___________


    What can you do to better prepare for these situations or people?


    ___________


    ___________


    ___________


    Where in your experience might you have called upon mindfulness skills to slow
    the process down or lessen the harm?


    ___________


    ___________


    ___________


    ## Improvising a Raft

    '
