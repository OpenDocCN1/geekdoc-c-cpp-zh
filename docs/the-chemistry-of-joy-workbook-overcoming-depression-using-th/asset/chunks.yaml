    当你开发完属于自己的短语后，你可能想把它们写在小卡片上。这些短语将成为你后续慈悲冥想的核心。


    ## 自慈悲冥想


    -   开始冥想时，让自己处于一个舒适的姿势，保持警觉而放松。花几分钟扫描身体，感受是否有任何紧张感，并邀请它们放松、软化。

    -   专注于几分钟，仅仅观察你的呼吸如何进入和离开身体，引导你的内心沉静、安静下来。

    -   现在，特别关注你从心脏中心感受到的呼吸，也许可以将手轻轻放在身体的那个部位。感受那里呼吸的吸入和呼出，以及你注意到的任何其他感觉。意识到此时你的心脏中心有多开放，并正念地、在不加评判的情况下，邀请它更进一步地开放一点。

    -   在你的意识中浮现出一个慈悲他人的形象：一个无条件接纳你并祝你幸福的人。这可能是你认识或仅听说过的人：老师、导师、朋友、灵性导师。也可能是一只动物：一只可爱的宠物。感受这个生物就在你身边，用一双真正表达着对你幸福祝愿的眼睛看着你。

    -   允许你的心对这个人对你的慈爱祝愿开放。如果你发现自己正在收缩或排斥这种充满爱的能量，只需呼吸并再次开放，达到你所能达到的程度。花几分钟让你的心被这种充满爱的关怀感充满。

    -   现在，在你的意识中浮现出你自己的形象。这可能是现在的你，也可能是生命中早些时候的你。邀请那个自己坐在你的对面，尽可能详细地观察你自己的细节：你的身体、姿态、脸部。感受与自己待在这里的感觉如何。

    -   现在，再次将注意力转向心脏中心，打开你的心，将那个自己的形象引入那里充满爱的能量圈。感受你的心脏在这一刻接纳着并与自己深度连接。如果你发现任何收缩感，只需呼吸并提醒自己你开放的慈悲意图。

    -   现在，带着内心的诚意，随着呼吸的节奏，重复你的慈悲短语，一遍一遍。在重复短语时，你可能会发现想稍微修改它们，甚至删掉或增加一些。随心这样做，直到你觉得这些短语完全符合你内心最深处的慈爱自我期许。

    -   根据你的意愿重复这些短语。当你准备结束冥想时，回到呼吸几分钟，留意此时的感受和感觉。对这段经历表示感谢，无论你从中发现了什么。


    再次需要说明的是，自慈悲的练习是最终超越自我的练习基础。当你向所有人延伸幸福与健康的慈爱祝愿时，你创造了一种强大的解毒剂，用来对抗抑郁症经常带来的孤立感和自我沉溺。


    从反思自己的缺陷中解脱出来，你现在可以将注意力留给他人，并更充分地与他们分享自我。这是归属感的基础，我们将在下一章讨论。


    ## 第 9 章总结


    -   自我拒绝和羞愧是复发性抑郁症的关键因素。

    -   通过与自己的痛苦建立联系，以及自发产生的慈悲（这是痛苦的自然结果），可以治愈自我拒绝带来的伤口。

    -   当有意识地培养时，自我关怀和慈心有助于修复自我拒绝所造成的断裂。

    -   你的内在存在着一个自由且完整的自我，它本身就是完美的。


    ## 第 10 章


    ![归属感的符号](img/fig1.8.jpg)


    # 归属感：建立连接圈


    *我们可以没有宗教和冥想生活，但没有人类的情感就无法生存。*


    达赖喇嘛


    *“当我说小时候比现在好时，听起来可能像个典型的老古板，但至少在那种情况下，确实是这样：我记得夏天的早晨，我会从床上跳起来，穿上衣服，冲出后门。当我跑出去找朋友时，我还能听到纱门在我身后砰地关上的声音。我总能找到他们；总有人可以一起玩。早晨从秋千上开始，随着夜色降临以捉迷藏游戏结束。当然，这并不完美。我记得打过架，当一个朋友和别人玩得比陪我多时会感到嫉妒，但这一切似乎只是从快乐流向争吵，再回到快乐的循环。”*


    玛丽是在回忆一个并不存在的黄金时代吗？还是这些记忆对她来说是一种资源，是一个无需置疑的归属时光，激励着她继续寻找有意义的连接——尽管现在看起来比那时要困难得多？


    无论你现在生活中正在经历什么，你完全可以确定，在你早年有足够的人了解你、喜欢你并照顾你。你可能认为并不多——但确实是`足够`的。你接受了足够的关注和爱来生存。现在，你想不仅仅是生存。你想`归属`。无论关系对你来说是多么沮丧，创建一个归属圈仍然是可能的。


    ## 归属圈


    *玛丽的故事*


    玛丽现在住在一间联排别墅里，她认识几个邻居，但只熟悉到可以点头致意的程度。她在一家大型保险公司工作，每天早上都早到。一旦她坐在自己的隔间并打开电脑，直到中午几乎不抬头。偶尔，她会和同事在办公大楼的走廊楼梯间散步，但更多时候，她是在办公桌边边工作边独自吃午饭。


    下班回家的路上，玛丽每周去三次健身房。她不认识健身房里的任何人，匆匆地完成训练计划，把洗澡留到家里再洗。回到家后，她打开电视作为陪伴，听一小时或更长时间关于世界各地灾难和威胁的消息。


    玛丽怎么可能不孤独呢？这种社交饥渴对她的抑郁症贡献了多少？当然，玛丽意识到自己感到孤独，但在她制作了两张对比的地图后，这些感受的原因对她来说变得清晰得多了。这些地图被称为`归属圈`地图，是提供一个人社交连接画像的工具。玛丽为自己的早年画了一张，为现在的生活画了一张。当她看到早期的网络有多丰富时，她开始思考如何增加现在的归属圈。在本章后半部分，你将获得关于为自己完成归属圈地图的细节。


    玛丽童年的归属圈


    ![图表：玛丽童年的归属圈](img/fig10.1.jpg)


    玛丽现在的归属圈


    ![图表：玛丽现在的归属圈](img/fig10.2.jpg)


    ## 分离的螺旋


    婴儿时期的玛丽对分离一无所知。新生儿不会体验到一个处于皮肤之内的自我和一个处于皮肤之外的世界。人类是逐渐发展出个体感，即作为一个分离自我的感觉，即“我”独立于他人的信念。这种对自我的意识是人类区别于其他生物的。它让你能够感觉到像“你自己”。


    '
- fmt: '

    The sense of separateness comes with both blessings and curses. It allows you
    to develop as an individual and to be uniquely yourself, but it is a limited experience
    of reality. Although you feel separate, there are many ways that you are connected
    to something larger. It is as if you were really a hand but sensed yourself to
    be only a finger. As a finger, you could point things out and you could cooperate
    with other fingers to pick things up, but there would always be a feeling of being
    apart.


    Spiritual traditions tell us that in our deepest essence, we are hands, not fingers,
    that we are in fact interconnected and unified with each other and with the larger
    universe to which we belong. Albert Einstein described our belief that we are
    separate as “an optical delusion of consciousness” (as quoted in Calaprice 2005,
    4). We are both/and: both separate individuals and interconnected parts of a whole.
    Problems arise when all we see is our separateness.


    ## What are the consequences of this delusion of separation?


    *   We identify with our small self.

    *   We feel alone.

    *   We feel threatened.

    *   We feel competitive.

    *   We feel anxious and afraid.


    This delusion is so widely shared that most people live their lives as if it were
    true. And so, for all intents and purposes, it becomes true. Under such conditions,
    many people experience a gnawing sense of insecurity that they can’t really name
    or explain.


    Fortunately, there are things you can do to challenge the delusion. You can find
    ways to create community and to participate with others in caring and generous
    ways. You can appreciate all of the ways that you are interdependent with others,
    all of the times that cooperation works. You can seek out evidence that you are
    more like than different from other people and so find ways to connect—not just
    safely, but with joy.


    ## Is My Universe Friendly?


    Einstein also said that one of the most important questions a human being can
    ask is this: “Is the universe friendly?” (as quoted in Oyle 1979, 163). Your answer
    to that question depends a great deal upon the degree to which you feel a sense
    of belonging.


    The following questionnaire will help you identify how satisfied you feel with
    the amount of social support—how much sense of belonging—you experience. It is
    important to remember that people desire different amounts of connection; one
    person may be content with a good friend or two, and another person feels alone
    unless there is daily contact with several people. It is also important to remember
    that the presence of depression has a strongly negative influence on how separate
    we perceive ourselves to be. You might want to answer these questions at two different
    times, once when depression is present and another time when you are freer from
    it.


    ### Belonging Questionnaire


    For each question below, circle the number that is most true for you:


    *   1—Hardly ever

    *   2—Some of the time

    *   3—As often as not

    *   4—Most of the time

    *   5—Nearly always


    ![Table: Belonging questionnaire](Images/fig10.3.jpg)


    ### Understanding Your Scores


    *   41–50: a strong and healthy sense of belonging.

    *   31–40: a satisfactory sense of belonging.

    *   21–30: an unsatisfactory sense of belonging.

    *   10–20: at this time in your life, you experience a very low sense of belonging.


    ### Your Circle of Belonging


    Another way to measure your quality of belonging is to fill in your current circle
    of belonging. The center represents you, of course, and the widening circles represent
    your network of social connection. First are those in your inner ring, whom you
    feel safe and at ease with. These are the people you talk to about what is important
    to you: problems, dreams, wishes, and so forth. In the next ring you can place
    people for whom you have feelings of affection and friendliness but haven’t let
    into the inner ring. The final ring should contain people you see with some regularity,
    whom you would recognize on the street, for example, but whom you interact with
    minimally. It is possible that some family members belong in this circle.


    ![Diagram: blank circle of belonging](Images/fig10.4.jpg)


    Now that you have filled in your circle, are there rings where you would like
    to have more people?


    ___________


    ___________


    Are there people you would like to move into a closer ring? ___________

    ___________


    What is one small thing you could do today to enrich your circle? ___________

    ___________


    ## The Costs of Loneliness


    “Loneliness” is the word given to the pain you feel when you are cut off from
    your relationships—when there are too few of them or when the quality of them
    disappoints you. Loneliness often intensifies when depression is present, due
    in part to lack of motivation to reach out to others. It may also be hard to believe
    that other people want to be around you if you have rejecting feelings toward
    yourself: *I don’t even want to be with myself; how can I believe that anyone
    else wants to be with me?*


    Experts agree social isolation is bad for health. An analysis of forty-eight studies
    looking at social relationships and mortality suggests that social isolation increases
    the risk of death as much as smoking or obesity. An interesting point from the
    study is that social relationships should be taken as seriously as other risk
    factors that affect mortality (Holt-Lunstad, Smith, and Layton 2010).


    We all know that loneliness is painful. Have you ever felt rejected by someone
    and felt that you were in actual physical pain? A recent study confirms your experience.
    This study looked at brain activity after rejection and made a remarkable finding:
    the part of the brain activated by rejection is the very same part that is activated
    by a burn injury, one of the most painful physical traumas one can experience
    (Kross et al. 2011).


    If you are someone who has a low sense of belonging, or who feels isolated and
    cut off, you probably don’t need to read about studies that confirm what you already
    know: loneliness hurts both the body and the spirit. What you may not realize
    is the power of connection to heal.


    There are four known factors that promote healthy, well-connected neurons: diet,
    exercise, mental stimulation, and social connection. Of these factors, it is social
    connection that has the most powerful benefits (Strasser et al. 2006). If a healthy
    sense of belonging can encourage the creation of new brain cells, and help them
    grow and connect with other brain cells, then it can help you recover from depression.
    It is a powerful means of sustaining your recovery and moving you toward an experience
    of joy.


    ## Create a Vision of Belonging


    You may be thinking, *Oh, great, another thing I’m not doing right, another way
    I’m making my life worse.* If you are having such thoughts, please invite your
    inner critic to leave the room. In fact, if you can remember back to chapter 2,
    where we talked about the inner visionary, now would be a good time to invite
    that part of yourself to join the conversation.


    In the guided imagery below, you will align with your inner visionary to begin
    creating a new vision for yourself, as if you were creating the blueprint for
    building a house of belonging.


    ### The Belonging Vision


    *   Settle into your comfortable, alert, and upright position, bringing your body
    to a position that supports your ability to direct your attention and bring awareness
    to your breath.

    *   After a few minutes of mindful breathing, direct your awareness to your body.
    Feel the connection of your feet to the floor…the contact of parts of your body
    with the chair or cushion…noticing any areas of stiffness or holding and inviting
    them to relax.

    *   Bring attention now to your heart center, that part of your chest around the
    breastbone…checking in with your heart center…inviting the heart to open…soften
    …feel warmth.

