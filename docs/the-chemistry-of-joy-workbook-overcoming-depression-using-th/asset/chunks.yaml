    A Cherokee elder was teaching his grandchildren about life. He said to them, “A
    fight is going on inside me. It is a terrible fight, and it is between two wolves.
    One wolf is evil: he is fear, anger, envy, sorrow, regret, greed, arrogance, self-pity,
    guilt, resentment, inferiority, lies, false pride, competition, superiority, and
    ego. The other is good: he is joy, peace, love, hope, sharing, serenity, humility,
    kindness, benevolence, friendship, empathy, generosity, truth, compassion, and
    faith. This same fight is going on inside you and inside every other person, too.”
    They thought about it for a minute, and then one child asked his grandfather,
    “Which wolf will win, Grandfather?” The elder simply replied, “The one you feed
    the most.”


    We could say that one wolf is our fear, our doubt, our resistance, our despair,
    our moments of passivity or helplessness or depressed mood. The other wolf carries
    our positive intention, our longing for change, our knowledge of our own abilities
    to create that change, and the willingness to make efforts, however small, to
    make change happen.


    The following list suggests a few ways that you could feed the part of yourself
    that wants to change and is capable of making change happen:


    ### Recall your intention. Yogi Berra is said to have noted, “If you don’t know
    where you’re going, you’ll end up somewhere else!” Clearly stating your intention
    as you have done in the vision board exercise will steer you in the right direction.
    Your intention can be a “work in progress,” and regularly revisited.


    ### Remember what you’re already doing well. In chapter 1 you completed the resilience
    skills questionnaire. Anytime resistance or discouragement shows up, it pays to
    remember what’s gone well and the skills you have but may have forgotten about.


    ### Cultivate willingness. Resistance is all about closing down; willingness is
    the essence of staying open. At times you may need to simply “be willing to be
    willing” to entertain new information or take a new action or ask for what you
    need. Any small opening will begin the process of moving past resistance.


    ### Practice acceptance. An eleventh-century Tibetan story illustrates the power
    of acceptance:


    One day Milarepa arrived home to find his cave filled with demons. They were wild
    and crazy demons, and disturbed his peace of mind. To get them to leave, he first
    tried telling them to get out using logic. No success. After multiple attempts
    to reason with them, he lost his temper, and ranted and raved. Still they stayed.
    Realizing his efforts to reason with them were doomed, he finally gave up and
    simply sat down. “Well, I’m not leaving and neither are you, it seems. I guess
    we’ll just have to learn to get along,” he said to them. Immediately all but the
    most vicious and threatening demon left. In a flash of wisdom, Milarepa approached
    the vicious demon and put his head directly into its mouth. “Eat me, then,” he
    said. “I’m powerless to defeat you.” With this, the demon left him in peace.


    The moral of the story? When we simply and radically accept what’s happening,
    the demon of resistance leaves us.


    ### Sustain hope and faith. At times faith and hope are in short supply. Especially
    in the “lean times” or “thin places” that come with depression, it helps to tap
    into sources outside of yourself. Your spiritual tradition and practices, your
    supportive friends, inspiring stories and readings, and uplifting music can all
    be your allies.


    ### Ask for support. The road to a more joyful life can be long, rocky, exhilarating,
    and beautiful. Sharing the trip with others can lighten the difficulties and enhance
    the joys. Finding a network of support—your travel companions—is essential.


    ## BUILD YOUR CIRCLE OF SUPPORT


    Take a few quiet moments to reflect on your current circle of support. Consider
    these questions:


    *   Who knows you best? Who is most completely accepting of you just as you are,
    and affirms your essential goodness? Place these people’s names at the center
    of the concentric circles diagram on the following page.

    *   Whom do you know who has traveled this way before—who understands the struggle
    with depression but has made positive changes? Place these people’s names in the
    next circle of the diagram.

    *   What professionals or organizations do you know of that you might consult
    with: therapists, clergy, support groups, educational programs? Place these names
    in the outside circle of the diagram.


    ![Diagram: Your circle of support](Images/fig2.5.jpg)


    *   Look over your diagram and see where you already have strong support and where
    it needs to be shored up. Create an action plan below for engaging these people
    or organizations as allies on the journey you are about to embark upon. Be specific:
    list their names and contact information, and include when and how you plan to
    contact them to enlist their help (direct conversation, phone call, e-mail, letter).


    ![Name and Contact info / Plan for Enlisting Support](Images/fig2.6.jpg)


    Name and Contact Information: Plan for Enlisting Support:


    ___________

    ___________

    ___________

    ___________

    ___________

    ___________

    ___________

    ___________

    ___________

    ___________

    ___________

    ___________

    ___________

    ___________


    ## Summing Up Chapter 2


    *   Change is a whole-person process—body, mind, and heart—and is most successful
    when grounded in self-acceptance. Self-improvement projects, often initiated by
    the inner critic, seldom lead to sustainable change.

    *   Effective change comes from aligning with your inner visionary: the part of
    yourself that sees your goodness and your potential, and works with you to make
    positive change.

    *   Because your human brain is wired for conservation and survival, changing
    habits and patterns can be challenging; you will encounter resistance to change.
    Rather than give up in the face of resistance, you can work with this natural
    component of change.

    *   It’s not necessary to be perfect in your efforts to change. When trying something
    new way, it’s good enough to go the new way 51 percent of the time. Gradually
    you will find yourself moving toward the new and extinguishing the old. Change
    builds upon change. Small, persistent, new choices lead to transformation.


    Part 2


    The Body Pathways


    Chapter 3


    ![Symbol for Nurturing](Images/fig1.1.jpg)


    # Nurturing: Care for Your Body


    *Tell me what you eat and I will tell you who you are.*

    Anthelme Brill-Savarin, 1826


    “I had no idea that what I ate could make such a difference in how I feel! Now
    I see how it all fits together.” Like most people, Jim thought he could think
    his way out of depression. He had done all the things he thought were important:
    cognitive therapy, nutritional supplements, and even medication. Yet he was still
    depressed until he realized how his eating habits were sabotaging his mood.


    Like Jim, it is common to see depression as occurring solely in the mind. The
    mind has a strong influence, of course. But there are many other factors at work
    in creating inner emotional states, whether those are states of well-being or
    of distress. A depressed mood, for instance, becomes translated into experience
    through chemical messengers such as serotonin and dopamine: chemicals that are
    produced from the nutrients in food.


    Healthy nutrients in food provide the information that the body needs to function
    as it was designed. Bad information, however, triggers destructive cascades that
    affect the whole body, eroding both physical and emotional resilience.

