    CHALLENGING ELIMINATED FOODS


    After ten days it is time to reintroduce eliminated foods by testing, or “challenging,”
    one new food at a time. When you test a food, you should eat *relatively large
    amounts* of it (between five and six servings). People frequently wonder if eating
    so many servings of a food in a day will cause a reaction. And the answer is no—the
    amount of food does not matter. You may feel full of corn or wheat, for instance,
    but no reaction will occur unless you are sensitive to it.


    Reactions can include common and familiar symptoms or symptoms you’ve never had
    before, such as retaining water, or having itchy skin or a rash. Even if you think
    there is another explanation for how you are feeling (for example, “I am so tired
    today because I didn’t sleep well last night”), you should still take note. You
    may not have slept well because you challenged with corn the day before and your
    body reacted as if there were an enemy on board. Reactions can also include mood
    symptoms like depression, irritability, or anxiety.


    *   Day 11: *Dairy (whey):* Milk, ice cream (without corn syrup), sour cream,
    and butter.


    *   Day 12: Wait-and-see day. Follow regular elimination: no corn, wheat, dairy,
    or nightshades. Note any type of reaction.


    *   Day 13: Wait-and-see day. Follow regular elimination: no corn, wheat, dairy,
    or nightshades. Note any type of reaction.


    *   Day 14: *Dairy (casein):* Any kind of cheese, cottage cheese, and natural
    yogurt.


    *   Day 15: Wait-and-see day. Follow regular elimination: no corn, wheat, dairy,
    or nightshades. Note any type of reaction.


    *   Day 16: Wait-and-see day. Follow regular elimination: no corn, wheat, dairy,
    or nightshades. Note any type of reaction.


    *   Day 17: *Wheat:* Use whole-wheat cereal, whole-wheat crackers, whole-wheat
    pasta, and whole-wheat breadsticks.


    *   Day 18: Wait-and-see day. Follow regular elimination: no corn, wheat, dairy,
    or nightshades. Note any type of reaction.


    *   Day 19: Wait-and-see day. Follow regular elimination: no corn, wheat, dairy,
    or nightshades. Note any type of reaction.


    *   Day 20: *Nightshades:* Potatoes, tomatoes, peppers, and eggplant. (If tomatoes
    or peppers give you heartburn or indigestion, only use potatoes when challenging.)


    *   Day 21: Wait-and-see day. Follow regular elimination: no corn, wheat, dairy,
    or nightshades. Note any type of reaction.


    *   Day 22: Wait-and-see day. Follow regular elimination: no corn, wheat, dairy,
    or nightshades. Note any type of reaction.


    *   Day 23: *Corn:* Use fresh ears of corn, frozen corn, popcorn (natural), or
    corn chips.


    *   Day 24: Wait-and-see day. Follow regular elimination: no corn, wheat, dairy,
    or nightshades. Note any type of reaction.


    *   Day 25: Wait-and-see day. Follow regular elimination: no corn, wheat, dairy,
    or nightshades. Note any type of reaction.


    If you reacted to a food, you should avoid it for an additional eight weeks. After
    the eight-week period, you can begin to rotate the food back into your diet slowly
    to find out how often you can eat it without having a reaction. Start by eating
    the food once a week, then once every six days, and then five days; and finally,
    settle on rotating that food into your diet once every four days. As you can see,
    having a food sensitivity is not a sentence to never having that food again, but
    it is a message to be mindful about it.


    ## Tracking Your Progress


    Research shows that simply *intending* to change doesn’t work very well. Having
    a goal doesn’t do it either. What research *has* shown is that when people make
    a concrete plan, track their progress, and see themselves as successful, they
    are far more likely to carry out their goal.


    For example, a recent study aimed to increase the consumption of fruits among
    college students. All 177 participating students were asked to set the goal of
    consuming more fruits for a seven-day period. They were randomly assigned to four
    groups. One group simply had the goal. Another group had the goal and some idea
    of how they would implement the goal. A third group imagined themselves being
    successful. The fourth group was asked to set the goal, to make a concrete plan,
    write it down (when, where, and how they would buy, prepare, and eat the fruit),
    *and* visualize themselves being successful. This last group ate twice as much
    fruit as any of the others (Knauper et al. 2011).


    We encourage you to make use of this insight when you make your own goals, remembering
    that action is a critical step in the process of change. We suggest setting a
    few simple but specific goals, developing a concrete plan, and then tracking your
    progress. Be sure to make your goals both clear and achievable, and limit the
    number of goals you are working on at any time. You are far more likely to reach
    all of your goals if you can focus on just one or two at once. After achieving
    one goal, move on to another. To give yourself an extra boost, remember to visualize
    yourself being successful.


    Recording honestly (remember, acceptance of who and where you are right now!)
    will give you a great understanding of where you succeed and where you get stuck.
    At some point down the road, you can refer to this log for insight and ideas on
    how to move forward.


    Remember, your goals should reflect where you are in the process and your skills
    so far. For instance, if you already eat balanced, frequent meals, your goal may
    be to add variety to your choices in vegetables. If, on the other hand, you are
    someone who “grazes” most of the day, your goal could be to eat breakfast daily
    and identify two to three food choices that could be rotated, so you don’t eat
    the same thing every day.


    The tracking tool below has space for you to list both your goals and the action
    steps you take toward achieving them, as well as your progress. Additional copies
    of this form can be downloaded from [nhpubs.com/22256](http://nhpubs.com/22256)
    and filled out for the chapters that follow, allowing you to add new goals for
    each pathway. (Note: If you wish, you can also photocopy the form, or develop
    a version of it that suits your needs.) *Being intentional and accountable in
    a written way can be highly motivating.*


    After the tracking tool you will find an example of how it might be filled in
    for this chapter.


