    The simplest diet advice for earth types is this: eat less. Like all aspects of
    life, food should add variety, interest, and stimulation to help bring earth energy
    back into balance. Think of the natural world in spring, a time to detoxify and
    lose the extra winter energy stored as fat. Eat more salads and bitter, leafy
    greens. Earth types do well as vegetarians. They need to be sure to get good-quality
    protein. If meat is eaten, it should be lean. Reduce oily foods, getting just
    a small amount of healthy fats. Even on a low-fat diet, earth types who eat a
    lot of sugar or grains tend to gain weight, so reduce them if you can (use small
    amounts of `honey` or `agave syrup` for sweeteners). Keep regular mealtimes, with
    a low-calorie, high-protein breakfast and a light meal at supper. Make your midday
    meal more substantial, and include a modest amount of healthy fat so that you
    don’t crave fats in the evening. Go for a short walk after eating to add some
    stimulation. Sip warm water or green tea throughout the day (a bit of caffeine
    is okay). Avoid iced or cold drinks, which imbalance earth energy. Make your food
    choices from the list below.


    #### Earth Balancing Foods:

    *   **Overview**: More protein, light foods with plenty of fresh vegetables. Minimize
    starches and sugars. Avoid artificial sweeteners; use a small amount of `raw honey`.


    #### Recommended Foods:

    *   **Dairy**: Skim milk, small amounts of low-fat cheese, cottage cheese, yogurt,
    or `kefir`.

    *   **Meats**: Low-fat meats, poultry, fish.

    *   **Beans and legumes**: All are fine.

    *   **Nuts and seeds**: Sunflower and pumpkin seeds.

    *   **Oils**: Small amounts of olive or walnut oils.

    *   **Grains (small amounts)**: Quinoa, barley, buckwheat, corn, millet, amaranth,
