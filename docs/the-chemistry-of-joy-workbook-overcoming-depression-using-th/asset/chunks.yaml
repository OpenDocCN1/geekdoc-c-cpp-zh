    *   `Mood stabilizers`（如 `lamotrigine` 即 `Lamictal` 或 `gabapentin` 即 `Neurontin`）可以平稳大脑活动，因此可以使用极低剂量治疗焦虑，或使用中等剂量治疗躁动。


    用药的决定最好由你并在医生、治疗师和家人的建议下共同做出。以下是一些指南，可以帮助药物发挥最大的作用并减少问题。


    ## 你如何判断自己是否需要药物？


    如果你有以下任何症状，请考虑用药：


    *   严重的抑郁症，导致日常生活难以正常进行，或伴有自杀或自残念头

    *   在尝试自然疗法三至四周后仍未改善的中度抑郁

    *   在尝试自然疗法六至八周后仍未改善的轻度抑郁

    *   自然疗法无法改善的严重睡眠障碍

    *   反复发作的抑郁，特别是当它们在没有特定触发因素或压力源的情况下发生时


    ## 正确的药物和剂量


    以下针对每种抑郁症亚型的药物建议是基于我们的临床经验。通常情况下，你应该服用改善症状所需的最低剂量。对于轻度至中度抑郁，尝试尽可能长时间保持在低剂量范围内，最好至少持续三至六周，给药物留出起的时间。如果在此期间改善不明显，剂量可能需要增加到中等剂量范围。对于严重抑郁，剂量可能需要更快地增加。


    有时可能需要使用比列出的更高的剂量，但这样副作用会变得更加常见。基础补充剂（之前提到的）可能帮助药物在最低剂量下保持有效。


    请记住，许多用药的人只需要暂时的支持，然后就可以过渡到其他保持健康的方法，如本练习书中建议的那些。


    ### 焦虑型抑郁症的药物支持


    ![表格：焦虑型抑郁症的药物/焦虑的每日低剂量范围/备注](img/fig4.7.jpg)


    **焦虑型抑郁症康复的关键**


    *   专注于能镇静的药物（影响血清素或 GABA 的药物）。

    *   如果可能，保持低剂量。要有耐心，给低剂量发挥作用留充足的时间。

    *   减轻压力和改善睡眠将有助于更快康复。

    *   尝试将用药时间缩短（三至九个月），并专注于减轻压力。


    ### 躁动型抑郁症的药物支持


    ![表格：躁动型抑郁症的药物/躁动的每日低剂量范围/备注](img/fig4.8.jpg)


    **躁动型抑郁症康复的关键**


    *   专注于缓解类药物（增加血清素或减少多巴胺的药物）。

    *   可能需要中等剂量，且通常耐受良好。

    *   尽可能保持低剂量，特别是开始阶段。非常注意躁动或情绪波动不要恶化。

    *   减少刺激和改善睡眠将有助于更快康复。

    *   尽量缩短用药时间，除非用药后情绪明显变得更稳定。


    ### 迟滞型抑郁症的药物支持


    ![表格：迟滞型抑郁症的药物/嗜睡的每日低剂量范围/备注](img/fig4.9.jpg)


    **迟滞型抑郁症康复的关键**


    *   专注于能量类药物（影响去甲上腺素或多巴胺的药物）。

    *   可能需要中等剂量，且通常耐受良好。

    *   增加活动（尤其是剧运动）和调节睡眠（七至九小时）将使康复持续。

    *   这种类型可能需要更长时间的药物。对于季节性抑郁，你可以在夏天停止药物，并在需要时明年秋季恢复。


    ## 何时以及如何停药


    请务必遵循医生关于何时以及如何停药的建议。如果你患有严重抑郁症或抑郁症反复，你可能需要用药时间比上述范围更长。


    如果你只用药了几个月，停药是最的。尽管如此，也可能出现戒断症状，从轻微的身体问题（包括头晕、疲劳、头痛或恶心）到严重的心理症状（如感到比用药前更加焦虑或抑郁）。尝试选择一个最适合你度过此类困难的时间。大多数人在春季和夏季、生活压力不是太大时停药效果最好。如果你仍然出现困难的戒断症状，请放慢速度，让自己稳定后再进行下一次减量，并且始终在医生监督下进行。


    ## 总结第 4 章


    *   抑郁症有不同的形式，了解你自己的模式可以帮助你选择最有帮助的治疗方法。

    *   你可以识别安全且有效的自然手段来平衡你的大脑化学并支持你的情绪。

    *   当需要药物时，请根据你的抑郁类型选择正确的药物，服用最低有效剂量，并仅在需要时维持。


