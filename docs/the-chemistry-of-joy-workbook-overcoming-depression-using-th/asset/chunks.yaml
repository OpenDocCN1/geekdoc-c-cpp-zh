    \ or loose stools.\n\n*   I experience constipation or a sluggish bowel.\n\n*\
    \   I frequently feel bloated.\n\n*   I burp or pass gas frequently.\n\n*   I\
    \ have stomach pain.\n\n*   I am aware of my breath odor.\n\n*   I have chronic\
    \ yeast infections.\n\n*   I feel nauseous when I take a multivitamin.\n\n*  \
    \ I have used antibiotics more than once in the past year.\n\n*   I have a history\
    \ of frequent antibiotic use.\n\n*   I use aspirin, ibuprofen, or other NSAIDs.\n\
    \n*   I have canker sores.\n\n*   I have irritable bowel syndrome.*\n\n*   I have\
    \ celiac disease.*\n\n*   I have Crohn’s disease.*\n\nIf you checked fewer than\
    \ three boxes, simply follow the strategies listed next. If you checked three\
    \ or more boxes or if you placed a check mark next to *any* of the issues with\
    \ an asterisk, it is recommended that you also conduct the elimination challenge\
    \ (see roadblock five) to determine if a food sensitivity is having an influence\
    \ on your digestion and mood.\n\nStrategies for Improving Digestion\n\nIf you\
    \ choose to eat healthy foods, then it is up to the crucial process of digestion\
    \ to determine which nutrients reach the bloodstream and eventually give the brain\
    \ the ingredients it needs to remain healthy and balanced. The following suggestions\
    \ will help assure that you are actually liberating the nutrients that you are\
    \ consuming.\n\n*   Be sure you are drinking enough water. Dehydration brings\
    \ the digestive tract to a screeching halt.\n\n*   Chew, chew, and chew some more.\
    \ Saliva breaks down carbohydrates, and there are hormones released when chewing\
    \ that increase the activity of the immune system.\n\n*   If you are taking acid-reducing\
    \ medication, talk with your provider to determine a possible schedule to taper\
    \ off the medication while identifying the underlying cause of the heartburn or\
    \ reflux.\n\n*   Drink apple cider vinegar (1 to 2 teaspoons in 8 ounces of water)\
    \ or warm lemon water with meals to aid in digestion and help with the movement\
    \ of the gastrointestinal tract.\n\n*   Consider possible causes of inflammation,\
    \ such as food sensitivities. Conduct an elimination challenge to determine if\
    \ this is an issue (discussed in detail later in the chapter).\n\n*   Add a probiotic\
    \ supplement to help rebalance the good bacteria, which will help normalize your\
    \ elimination. Be sure the supplement has multiple strains of bacteria such as\
    \ acidophilus, bifidobacteria, lactobacillus, and fructooligosaccharide (FOS,\
    \ a natural sweetener that supports healthy gut bacteria).\n\n*   Take a fiber\
    \ supplement containing psyllium.\n\n*   Add ground flaxseed and chia seeds.\n\
    \n*   Drink teas made from ginger, peppermint, cinnamon, and licorice root.\n\n\
    *   Focus on the following digestion-supporting foods:\n\n    *   Grains such\
    \ as buckwheat, steel-cut oats, barley, wild rice\n\n    *   Fresh vegetables,\
    \ particularly kale, carrots, cabbage, cauliflower, squash, and broccoli\n\n \
    \   *   Fresh fruit, particularly pears, apples, plums, bananas, berries, and\
    \ cherries\n\n    *   Cultured foods such as yogurt, kefir, and milk\n\n## Roadblock\
    \ Four: Excess Inflammation\n\nInflammation is important; it helps to defend the\
    \ body against challenges such as injury, trauma, infection, allergens, and toxins.\
    \ Too much inflammation, however, is harmful. Excess inflammation in the joints,\
    \ for example, can cause arthritis; inflammation in the airways leads to an asthma\
    \ attack. When the inflammation occurs in the brain, it can affect neurotransmitters\
    \ such as serotonin and dopamine, aggravating depression.\n\nCurrent research\
    \ suggests that stressful life events can bring about symptoms of a depressed\
    \ mood by physically damaging the brain. This damage triggers a repair response\
    \ (not unlike any wound repair) that includes inflammation. The changes caused\
    \ by these inflammatory messengers may lead to physical pain and a “depression”\
    \ of normal function during the repair process. When these repair processes continue\
    \ for longer periods, due to ongoing stress or an inability to fully repair, depressive\
    \ symptoms can become chronic. In the body, everything truly is connected (Smith\
    \ 2011).\n\n* * *\n\nEvidence linking alterations in brain chemistry to inflammation\
    \ is building. People with depression are shown to have increased levels of inflammatory\
    \ cytokines (the chemical messengers of inflammation), which have been linked\
    \ to changes in sleep, fatigue, irritability, sadness, and impaired concentration.\
    \ Elevated cytokines may even make it less likely that you will respond to antidepressant\
    \ treatment (Miller, Maletic, and Raison 2010).\n\n* * *\n\n*Lynn’s Story*\n\n\
    *“When my daughter asked if I was mad at her, I knew things had to change.” Lynn’s\
    \ first depression occurred after she stopped drinking sixteen years ago. Now\
    \ she felt it returning. After a difficult eight-year marriage, Lynn was now a\
    \ divorced, single parent of a seven-year-old daughter. She worked full-time.\
    \ She was sleeping too much but still felt very fatigued. Even though she had\
    \ been recovered for sixteen years and no longer craved alcohol, Lynn found herself\
    \ craving other sugars.*\n\n*Lynn also had a long history of inflammation. She\
    \ had had eczema as a child and severe acne as a teenager. Her skin was extremely\
    \ dry. Recently she was experiencing more frequent headaches.*\n\n*As a first\
    \ step, we conducted an elimination challenge to determine if Lynn had underlying\
    \ food sensitivities. When she returned after doing the challenge, she said she\
    \ felt “so much better.” She had more energy, no headaches, and clearer skin.\
    \ She was less irritable, saying, “Even my seven-year-old daughter noticed.” She\
    \ had a strong reaction to dairy products from cows, both milk and cheeses. They\
    \ caused her to feel as if she were in a fog, made her feel crabby, and gave her\
    \ a persistent two-day headache. Dairy also intensified her cravings for sugar.*\n\
    \n*Because of her dry skin and mood issues, we also started her on a fish-oil\
    \ (omega-3 fatty acid) supplement and other anti-inflammatory foods.*\n\n*Lynn\
    \ returned twelve weeks later and said she continued to be symptom free. “It was\
    \ hard at first but well worth it.”*\n\nAssessing Inflammation\n\nPlace a check\
    \ mark next to all of the symptoms that apply to you:\n\n*   Headaches\n\n*  \
    \ Acne\n\n*   Hives or rashes\n\n*   Dry or flaky skin\n\n*   Asthma\n\n*   Chest\
    \ congestion\n\n*   Joint pain\n\n*   Muscle pain\n\n*   Frequent infections\n\
    \n*   Bags or dark circles under eyes\n\n*   Stuffy nose\n\n*   Sinus congestion\n\
    \n*   Excess mucus\n\n*   Frequent need to clear throat\n\n*   Chronic cough\n\
    \n*   Hoarseness\n\n*   Sore throat\n\n*   Swollen gums\n\n*   Arthritis\n\n*\
    \   Canker sores\n\n*   Eczema or psoriasis*\n\n*   Frequent sinus infections*\n\
    \n*   Irritable bowel syndrome*\n\n*   Colitis or Crohn’s disease*"
