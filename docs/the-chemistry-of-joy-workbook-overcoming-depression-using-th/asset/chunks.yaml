  trans: "\n\n-   尽可能完全地沉浸在情绪的流动及其变化中。你可能会注意到情绪在积聚、达到顶点，然后开始消退。如果你体验了情绪的完整周期，请注意在情绪浪潮消退后你的感受。如果你还没有完整地体验这种情绪，请记住你可以回到这个过程，并按照自己的节奏处理这种感觉，你也可以在日常生活的体验中这样做。\n\
    -   通过几次简单的呼吸觉察结束这次冥想，让身体中留下的任何情绪感受自然流逝。对自己传达一个温和的指令，让现在就放下这些情绪，可能会有所帮助。花时间让这一切发生，让你的身心回到尽可能宁静的状态。感谢这次经历带给你的任何觉察。\n\
    \n## 反思这次冥想\n\n写下对这次冥想的反思，可以将你的感受体验锚定在思维大脑中。这可能帮助你将所学的内容转化为日常生活，而这正是这项练习的最终目标。\n\
    \n回答以下问题，并在反思过程中记录任何其他产生的问题或观察。\n\n-   我经历了哪些情绪？它们在冥想过程中发生变化了吗？是如何变化的？\n  ___________\n\
    \  ___________\n-   我在身体的哪个部位感受到了我经历的每种情绪？我会如何描述这些感觉？它们在冥想过程中是如何变化的？\n  ___________\n\
    \  ___________\n-   我的情绪容易识别和命名吗，还是说我在识别它们是什么时遇到了困难？它们对我来说熟悉吗？\n  ___________\n\
    \  ___________\n-   在这次经历中我有哪些想法？它们是如何影响我感受到的情绪的？\n  ___________\n  ___________\n\
    -   在不分散注意力或采取回避措施的情况下，与这些情绪相处是什么感觉？\n  ___________\n  ___________\n-   让情绪流逝对我来说如何？\n\
    \  ___________\n  ___________\n-   总之，对于我面对这些困难情绪的方式，我学到了什么？\n  ___________\n\
    \  ___________\n\n## 深层进：处理困难情绪\n\n在你完成感知身体情绪的冥想练习时，你可能像许多人一样好奇，当你的情绪似乎需要某种反应或行动时，到底该怎么办？毕竟，这些情绪可能是复杂的，而且它们发生在真实生活的背景之下。通常它们会向你呈现一个需要解决的问题，或者让你处于一种似乎不会自行消失的痛苦水平中。以下六步法将为你提供一种处理艰难生活经历的方法，将情绪作为通往内在智慧的指南。\n\
    \n### 第一步：单纯观察。从觉察身体和大脑中的情绪开始。问问自己：`现在正在发生什么？`这包括身体感觉、想法，可能还有记忆。\n\n### 第二步：邀请并开放。从困难的感觉中转移注意力似乎更符合本能，但带着正念的奇心，你可以对出现的一切都说“好”。对自己默默说“好”或“只是开启”是有帮助的，以对抗由于抗拒而收缩的自然倾向。记住正念的精神，即对此时此刻出现的任何事物进行不评判的接纳。只需观察你所有的反应，甚至是抗拒，并对它们保持开放。有意识地放松身体，并记得正念地呼吸。\n\
    \n### 第三步：探索原因。此时，问问`我为什么会有这种感觉？哪些词汇、互动或其他因素与我自己的敏感性结合在一起导致了这种反应？`这样做并不是为了指责某人或某事导致我们的反应，而是为了寻求理解，以便做出熟练的反应。\n\
    \n### 第四步：识别可能的行动。有时，倾听你的情绪反应并理解其原因会提示你当下的行动方案。例如，如果愤怒是因为朋友伤人的话而激发的，那么适当反应是找方法向那位朋友表达你的想法。在其他情况下，行动可能需要推迟到以后。例如，如果向朋友表达太困难，你可能寻求帮助来培养自己的果断力，这样下次你就能立即做出。如果你看到可以立即采取的行动，就去执行。如果必须推迟，只需在脑中记录这些行动，并进入该过程的下一步。\n\
    \n### 第五步：关爱自己。无论是否有建设性的行动可以采取，你始终可以觉察这些情绪是否让你变得需要一些关注。你可能希望寻求一位你信任的友好倾听者的支持。但通常，最能给你提供确切所需之的是`你自己`。也许是安慰，或是某种表达，比如“是的，我知道，这真的很痛苦。”或者你可能需要听到一些肯定，比如“这很难，但你处理得很好。”你可能需要一些基本的自我照顾，如睡眠、运动或一杯舒心的热茶。通过细致的倾听，你可以与自己做朋友。\n\
    \n### 第六步：允许感受流逝。当一切完成后，感受有时会徘留。某些感受比其他的更强烈，而某些情况需要反复处理多次。然而，重要的是知道你何时仅仅是抓得太紧，或者通过在脑中重演故事来重新点燃情绪的火焰。执着是人性的，而愿意放下可能需要一个意识的决定。某些情绪有很长的半衰期，当你等待它们过去时，简单地接纳并允许，释放你对自己说的关于它们的故事是有帮助的。\n\
    \n## 熟练处理情绪\n\n这项练习旨在帮助你在自己的现实生活中使用这六步法。你可以选择与之前冥想相同的经历，也可以选择其他的。\n\n首先，静静地坐几分钟，尽可能详细地回忆那个情景，记录环境、情况或触发感受的互动、可能说过的话等。如果可以，回忆情绪出现、强化以及经历结束时的状态，记录你的身体感觉、想法和行动。在下方记录你的描述。\n\
    \n___________\n___________\n___________\n___________\n___________\n___________\n\
    ___________\n___________\n___________\n___________\n\n接下来，使用下表，你可以分析你的经历，记录在过程中每个阶段（不带评判！）你的体验是什么。在最后一列，记录你对未来如何更熟练地处理此类情况的见解和想法。你会发现，之前描述的过程会为你提供一些灵感，你自己的见解也会产生。记住，没有错误。\n\
    \n![表格：步骤/ 我的经历/ 反思与见解](img/fig7.4.jpg)\n\n## 最后但同样重要：面对愉悦的事物\n\n当你完成这一章时，你为处理那些困难、痛苦的日常情绪体验获得了见解和技巧。这是变得更有情感韧性的最明显、但并非唯一的途径。\n\
    \n"
