    \ your mood. The following recommendations include general strategies for reducing\
    \ inflammation that can be helpful for everyone. When you address roadblocks two\
    \ and five (glucose-insulin balance and food sensitivities), you are also cooling\
    \ down inflammation.\n\nGENERAL RECOMMENDATIONS\n\n*   Pay attention to the types\
    \ of fat in your diet. Omega-6 fats (including most cooking oils, such as corn,\
    \ sunflower, safflower, and soybean) promote inflammation, while omega-3 fats\
    \ reduce it. We need both, and our ancestors had about a one-to-one ratio between\
    \ them. Now we eat so many more omega-6 fats that the ratio is closer to twenty\
    \ to one. So while we can turn inflammation on, we have trouble turning it off\
    \ again.\n\n*   Reduce intake of omega-6 fats by limiting corn, safflower, sunflower,\
    \ and soybean oils. Instead, use:\n\n    *   olive oil for most cooking\n\n  \
    \  *   grapeseed oil for high-heat cooking\n\n    *   olive and flax oils for\
    \ salad dressings\n\n*   Omega-3 fatty acids (EPA and DHA) decrease the production\
    \ of pro-inflammatory messengers (cytokines). They also help build healthy brain\
    \ membranes and allow normal communication between cells.\n\n*   Increase intake\
    \ of omega-3 fatty acids by eating:\n\n    *   cold-water fish: salmon, halibut,\
    \ mackerel, herring, tuna, and sardines; cod-liver oil or other fish-oil supplements\n\
    \n    *   nuts and seeds: walnuts, pumpkin seeds, and freshly ground flaxseeds\
    \ or flax oil\n\n    *   wild game, seaweed, algae, and eggs from flax-fed chickens\n\
    \n*   Vitamin C: found in citrus fruits, tomatoes, green leafy vegetables, parsley,\
    \ cabbage, asparagus, avocados, cantaloupe, currants, mangoes, kiwi, papaya, peppers,\
    \ cherries, pineapple, and strawberries.\n\n*   Curcumin is a naturally occurring\
    \ yellow pigment found in the spice turmeric that has been used for thousands\
    \ of years in indigenous medicine for the management of inflammatory disorders\
    \ and wound healing. You can add it to soups, stir-fries, and rice dishes.\n\n\
    *   Eat plenty of onions, garlic, and ginger—all known for their anti-inflammatory\
    \ activity.\n\n*   Soy products such as tofu, miso, edamame, and tempeh may also\
    \ reduce inflammation.\n\nFOODS TO REDUCE\n\n*   Certain fats can cause inflammation\
    \ in the body. Limit your intake of meats, poultry, whole milk, cream, butter,\
    \ and cheese. Corn-fed animals have more pro-inflammatory fatty acids than grass-fed\
    \ or free-range animals.\n\n*   Trans-fatty acids and partially hydrogenated vegetable\
    \ oil also carry a pro-inflammatory message to your body’s cells. Food labels\
    \ now have to include the amount of trans fat per serving and list partially hydrogenated\
    \ vegetable oil among the ingredients. Minimize your use of:\n\n    *   margarine\n\
    \n    *   processed baked goods, crackers, and deep-fried foods\n\n*   Simple\
    \ sugars and refined carbohydrates can create an inflammatory environment in the\
    \ body. Do your best to limit your intake of them.\n\n## Roadblock Five: Food\
    \ Sensitivities\n\nThere are often hidden saboteurs in our diets that make us\
    \ feel miserable. It may even be a food that we eat frequently, but if we are\
    \ sensitive to a particular food, the body will deal with it as an “invader”:\
    \ it will activate the immune system and create inflammation throughout the body.\
    \ Ironically, you may even crave the very food to which you are sensitive, because\
    \ the offending food can give you a momentary high. Food cravings, in fact, may\
    \ provide useful clues about food sensitivities.\n\nThese are not true allergies,\
    \ like those that some people have to nuts or shellfish. Food sensitivities are\
    \ subtler than allergies, which makes them harder to discover. Sensitivity to\
    \ foods can trigger joint pain, headaches, psoriasis, sinus congestion, and digestive\
    \ disorders—*and* depression.\n\nIf you checked multiple issues when you assessed\
    \ your digestion (roadblock three) or inflammation (roadblock four), you may want\
    \ to conduct an elimination challenge to determine the potential culprit. The\
    \ most common food intolerances are dairy, wheat, nightshade vegetables, and corn.\
    \ If you suspect any food sensitivity based upon your assessment, follow the elimination-challenge\
    \ diet below. You may discover a hidden food sensitivity that could unlock your\
    \ normal digestion and dramatically reduce inflammation and depression. It is\
    \ challenging but may be well worth the effort; you might even conclude that it’s\
    \ kind of fun!\n\nThe Elimination-Challenge Diet\n\nFor the initial ten days,\
    \ you eliminate the foods listed below. Beginning on day eleven, you will begin\
    \ to “challenge” one new food at a time.\n\nFOODS TO ELIMINATE\n\n*   Dairy: We\
    \ use two different categories for dairy—those containing mostly whey protein\
    \ (milk, cream, sour cream, butter, and ice cream) and those containing mostly\
    \ casein (cheese and yogurt).\n\n*   Wheat: Most bread and pasta, most flour,\
    \ baked goods, durum, semolina, and farina. It is important to note that this\
    \ does not mean gluten free. Gluten intolerance is an altogether different sensitivity.\
    \ There is gluten in wheat, but there is also gluten in rye, spelt, and barley,\
    \ which are allowed. You will simply be avoiding wheat. In fact you do not want\
    \ to consume packaged gluten-free items, as they tend to contain corn flour and\
    \ potato flour.\n\n*   Nightshade vegetables: White potatoes (meaning white-fleshed\
    \ potatoes, including Yukon Gold and red potatoes), tomatoes, peppers, eggplant.\n\
    \n*   Corn: Corn chips, corn tortillas, popcorn, corn oil, and corn syrup and\
    \ other corn sweeteners; Splenda, sucralose, sorbitol, and xanthan gum are all\
    \ made from corn.\n\nYou should also eliminate “white foods” (white breads, pasta,\
    \ cookies, and cake), and avoid grain alcohol and beer. Many are made with wheat\
    \ and corn.\n\nYou may encounter some unpleasant withdrawal symptoms, such as\
    \ irritability, headaches, fatigue, or any of your usual mood symptoms. They will\
    \ resolve within the first few days. Eat every three to four hours to avoid food\
    \ cravings.\n\nKeep a journal of how you feel from day one through to the end\
    \ of the challenges. Note symptoms, lack of symptoms, sleep, and energy.\n\nA\
    \ key to the challenge is to focus on foods you *can* have. You are free to include\
    \ any of the following foods during the challenge:\n\n*   Cereals: Oatmeal, oat\
    \ bran, granola, cream of rye, puffed rice, puffed millet, or crispy brown rice\
    \ with almond milk, soy milk, hemp milk, or rice milk.\n\n*   Cheese: Goat cheeses\
    \ and goat milk, goat butter, and goat yogurt; sheep cheese.\n\n*   Coconut milk,\
    \ coconut kefir, and coconut creamer.\n\n*   Grains: Rye, oat, or spelt bread\
    \ made without wheat; rice cakes, rice crackers, and rye crackers; buckwheat or\
    \ soba noodles, spelt pasta, brown rice pasta, brown rice, white rice, wild rice,\
    \ oats, barley, millet, buckwheat groats, amaranth, and quinoa.\n\n*   Legumes:\
    \ All legumes, including black beans, white beans, lentils, chickpeas, navy beans,\
    \ and fava beans.\n\n*   Vegetables: All vegetables are fine to eat except corn,\
    \ peppers, white potatoes, tomatoes, and eggplant. Sweet potatoes and yams are\
    \ fine.\n\n*   Fruit: All fruit is fine.\n\n*   Protein: All eggs, poultry, fish,\
    \ and meat. Beef and pork or other protein you normally eat can be included.\n\
    \n*   Nuts and seeds: All nuts and seeds and nut butters unless an allergy is\
    \ known."
