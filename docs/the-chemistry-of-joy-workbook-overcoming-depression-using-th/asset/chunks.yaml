- fmt: '

    ![](Images/cover.jpg)


    “Depressed? Anxious? Before you reach for a prescription, reach for *The Chemistry
    of Joy Workbook* and follow the instructions. This book is the answer and I highly
    recommend it!”

    —Christiane Northrup, MD, ob/gyn physician and author of the *New York Times*
    bestsellers *Women’s Bodies*, *Women’s Wisdom* and *The Wisdom of Menopause*


    “I have recommended Henry Emmons’ *The Chemistry of Joy* to many people. In *The
    Chemistry of Joy Workbook* , he gives practical, actionable advice on boosting
    emotional resilience that is completely aligned with my own philosophy of integrative
    mental health. If you want to experience more positive moods, you will find this
    book most helpful.”

    —Andrew Weil, MD, author of *Spontaneous Happiness*, *Healthy Aging*, *Eight Weeks
    to Optimum Health*, and other books


    “This book offers a brilliant new analysis of depression as a breakdown of positive
    mental and physical factors, and then gives readers a powerful toolbox of methods
    for restoring these factors in mind, heart, and body. Grounded in science, eminently
    practical, focused on the positive, and full of heart, this is a great resource
    for feeling better and for increasing the inner strength and resilience that will
    prevent depressed moods in the first place.”

    —Rick Hanson, PhD, author of *Buddha’s Brain* and *Just One Thing*


    “*The Chemistry of Joy Workbook* provides a wealth of practical information and
    advice for anyone who struggles with depression. Using readily available therapies
    and simple instructions, the expert authors offer a comprehensive self-care plan
    that addresses the causes of depression at the levels of body, mind, and spirit.”

    —James Lake, MD, chair of the International Network of Integrative Mental Health
    and author of the *Textbook of Integrative Mental Health Care*


    “Many great wisdom traditions tell us that joy and happiness are not conditions
    that have to be created anew, but are natural and innate in everyone. Our task
    is to remove the obstructions that prevent us from realizing the inherent delight
    of life. *The Chemistry of Joy Workbook* is a marvelous tool that can help anyone
    accomplish this.”

    —Larry Dossey, MD, author of *The Power of Premonitions* and *Reinventing Medicine*


    “*The Chemistry of Joy Workbook* gently, lovingly, and assuredly offers us the
    tools to reach the oasis of serenity we all seek, providing each of us with the
    opportunity to experience the best of what life has to offer.”

    —David Perlmutter, MD, FACN, ABIHM, author of *Power Up Your Brain*


    “This is a workbook that actually works! It provides an excellent set of self-assessment
    tools that can help you better understand yourself and the causes of any psychological
    challenges you may be experiencing. It’s practical and easy to understand, and
    it offers the opportunity for genuine insight.”

    —Phillip Moffitt, founder of the Life Balance Institute and author of *Emotional
    Chaos to Clarity* and *Dancing with Life*


    “This workbook is a true lifeline. Follow its clear, engaging, expertly designed
    steps and you’ll experience healing and thriving like never before.”

    —Raphael Cushnir, author of *The One Thing Holding You Back*


    “A a needed synthesis for people who need a balanced approach that incorporates
    the best wisdom of modern psychiatry and alternative medicine. This book communicates
    the science of brain chemistry in a straightforward manner, explaining the medical
    treatment of depression in plain English for the many people who want to understand
    the suffering inside them. I especially appreciate the compassion and the depth
    of experience that informs this useful book, from beginning to end. It is a work
    of great expertise and great love.”

    —Mary Hayes Grieco, director of The Midwest Institute for Forgiveness Training
    and author of *Unconditional Forgiveness*


    “With extensive questionnaires, case examples, and individualized solutions covering
    all bases, this user-friendly workbook provides scientifically based recommendations
    for helping you reconnect with the joy that is your birthright. Just read and
    apply it—you will be happy you did!”

    —Hyla Cass, MD, author of *Eight Weeks to Vibrant Health*


    “Henry Emmons has done it again! A joyful way to take advantage of the healing
    he brings to us. What a great tool and a visionary message!”

    —Kathleen DesMaisons, PhD, author of *Potatoes Not Prozac*


    “This is a well-organized and clearly written book that shows a step-by-step process
    that enables the reader to create a richer and more meaningful internal life.”

    —Pia Mellody, author of *Facing Codependence* and *The Intimacy Factor*


    “If there were one book I could give to every person who wants to love the life
    they are living and live the life they love, it would be this one. It is fertilizer
    for the life force that is your birthright.”

    —Dawna Markova, PhD, author of *I Will Not Die an Unlived Life*, *Wide Open*,
    and coeditor of *Random Acts of Kindness*


    “This book is an outstanding example of the emerging field of the mind-body-diet
    connection. It represents a clinically validated pathway to increased happiness
    that translates into a greater joy of life.”

    —Barry Sears, PhD, author of *The Zone*


    “*The Chemistry of Joy* has helped many people who suffer from depression not
    only survive, but thrive. This workbook will multiply those numbers as it leads
    the reader through a series of reflective exercises and practices that flow from
    the notion that personal change comes from self-acceptance. In true Henry Emmons
    style, the approach is well-grounded and serious but appropriately lighthearted—exactly
    what’s needed by people who are weighed down with self-reproach. In the words
    of a Buddhist teacher whose spirit reminds me of Emmons’, ‘You are perfect as
    you are—and you could use a little improvement!’”

    —Parker J. Palmer, author of *Healing the Heart of Democracy*, *Let Your Life
    Speak*, and *The Courage to Teach*


    “This workbook mirrors Emmons himself in many ways: it is kind, insightful, supportive,
    practical, and wise. Here is a fabulous tool for those struggling with depression.
    The authors have created the best guide available to become happier and more resilient.”

    —Scott Shannon, MD, psychiatrist and assistant clinical professor in the department
    of psychiatry at the University of Colorado


    “*The Chemistry of Joy Workbook* is not just another self-help workbook. Henry
    Emmons, Susan Bourgerie, Carolyn Denton, and Sandra Kacher have created a remarkable
    roadmap to rediscovering our innate potential for flourishing, optimum health.
    They remind us that the next revolution in healthcare does not lie in the discovery
    of more medical magic bullets but in supporting our potential for resilience.
    This workbook will be an invaluable resource for my patients and for me. I look
    forward to walking the pathways to health with them.”

    —James Duffy, MD, FANPA, psychiatrist and chief of integrative medicine at Sierra
    Tucson


    “Blending the wisdom of traditional healing approaches with the rigor of scientific
    strategies, *The Chemistry of Joy Workbook* is filled with insightful ideas and
    empowering practices that will not only help to heal the despair and isolation
    of individuals with depression, but will serve as a guide to personal growth and
    transformation at the heart of living a life of meaning, connection, and well-being.
    Soak in these healing suggestions and give yourself the beginnings of a new way
    of life.”

    —Daniel J. Siegel, MD, executive director of the Mindsight Institute and clinical
    professor at the University of California, Los Angeles School of Medicine

