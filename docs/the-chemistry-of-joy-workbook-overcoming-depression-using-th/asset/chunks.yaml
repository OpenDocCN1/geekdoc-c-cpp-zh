    Caring for the body provides you with the conditions to thrive. By themselves,
    these pathways will not guarantee joyfulness or resilience. Yet they are essential
    for a resilient life. The three body pathways—nurturing, balancing, and flowing—will
    help you to establish a solid foundation for resilience so that the rest of your
    journey can be deeply fruitful.


    # THE FIRST PATHWAY


    ![Nurturing Symbol](Images/fig1.1.jpg)


    ### nurturing


    In the first pathway, we examine how the information your body derives from food
    influences its functioning. You will identify any missing ingredients—or systems
    that may be out of balance—that prevent your body from naturally self-correcting.
    Questionnaires will help you discover if there are physical areas that you need
    to address, and if so, we offer specific guidance on how to do so.


    # THE SECOND PATHWAY


    ![Balancing Symbol](Images/fig1.2.jpg)


    ### balancing


    A healthy mood can only be sustained if brain chemistry is balanced in the best
    way for your individual needs. What is called “depression” is not just one thing
    that can be treated in the same way for each person. This second pathway helps
    you determine whether you may have a specific type of brain-chemical imbalance.
    We will then help you create your own plan for optimal nutritional supplementation
    so that your hard-won natural balance can last.


    # THE THIRD PATHWAY


    ![Flowing Symbol](Images/fig1.3.jpg)


    ### flowing


    This pathway reminds us that we are part of the natural world and aligning with
    it is a key to resilience. There are natural cycles that impact mood, including
    daily rhythms, sleep, and seasons. Yet each of us has our own unique lifestyle
    patterns and needs. Our questionnaire helps you discover your mind-body type,
    and we provide information that helps you design a practical and effective plan
    to flow more easily with your own nature.


    ## The Mind Pathways


    One foundation of our approach is the good medicine of mindfulness, grounded in
    2,600 years of Eastern wisdom. A mindful life can lead to a calm and joyful mind.
    By following the three pathways of settling, opening, and knowing, you will help
    the mind to become calmer, to open to your experience, and to see more clearly
    so that you will be able to face whatever arises in your life with greater wisdom
    and equanimity.


    # THE FOURTH PATHWAY


    ![Settling Symbol](Images/fig1.4.jpg)


    ### settling


    The untamed mind easily jumps from thought to thought without awareness or intention.
    Its activity is unceasing, and it seems powerfully drawn to harmful thoughts and
    painful emotions. The good news is that, like an impulsive puppy, the mind can
    learn to quiet, indeed to “Sit!” In the fourth pathway, we introduce you to the
    basics of mindfulness practice, which will enable the mind to settle and the body
    to relax.


    # THE FIFTH PATHWAY


    ![Opening Symbol](Images/fig1.5.jpg)


    ### opening


    Learning to fully experience the complete range of human emotions is a fundamental
    part of recovery from depression and of creating a joyful life. In this chapter
    you can learn to turn toward even painful emotions, grounded in mindful awareness
    of their impermanence and your capacity to feel them without being overwhelmed.
    And you’ll discover the truth that being emotionally aware leads you to discover
    life’s joys in a deeper way.


    # THE SIXTH PATHWAY


    ![Knowing Symbol](Images/fig1.6.jpg)


    ### knowing


    Grounded in mindfulness, you will gain perspective on some of your most intensely
    painful emotional experiences and learn more skillful ways of responding to them
    in the moment. These experiences offer you the chance to develop greater self-awareness
    and a sense of mastery. The tools you will learn in this chapter can dramatically
    improve your sense of well-being and help prevent the recurrence of depression.


    ## The Heart Pathways


    There is much that happens beneath the surface of awareness in every person’s
    inner life. You can lay the groundwork of good physical health, tame your wild
    mind, and expand your capacity to be with the full range of emotions. But without
    connection to the larger world, including the unseen mysteries, you lose touch
    with your deepest and most life-sustaining energies. Your taproots need to sink
    deeply into this life source in order to thrive, and that involves connection
    with the inner self, with others, and with spiritual truths and practices. Following
    the pathways of connecting, belonging, and deepening gives access to these deeper
    sources to nourish resilience and create the conditions for lasting joy.


    # THE SEVENTH PATHWAY


    ![Connecting Symbol](Images/fig1.7.jpg)


    ### connecting


    One of the most disheartening aspects of depression is the sense of separation,
    isolation, and shame that so often comes with it. Moving out of this isolation
    begins with authentic acceptance of and connection with yourself.


    In the seventh pathway, we challenge the illusion that you are isolated and defective,
    and guide you toward wholeness and connection with your basic goodness. We offer
    meditations and exercises that work to heal disconnection from self and transform
    your capacity for love of self and others.


    # THE EIGHTH PATHWAY


    ![Belonging Symbol](Images/fig1.8.jpg)


    ### belonging


    In the eighth pathway, we move further into the healing power of connection and
    explore the possibilities of creating a genuine sense of belonging and community.


    Transformation begins within. We offer powerful meditation practices that help
    you move beyond yourself to find joy in interconnection with others and the larger
    world. We follow this inner work with recommendations for actions that help you
    create a place of belonging for yourself.


    # THE NINTH PATHWAY


    ![Deepening symbol](Images/fig1.9.jpg)


    ### deepening


    One of the most disheartening enemies of joy is disconnection from your deepest,
    most authentic self. The deepening path outlined in this final pathway leads you
    to an opportunity to reclaim your own inner wisdom. We draw from depth spirituality
    and our own experience to make listening to the voice within both accessible and
    meaningful.


    ## How to Use This Workbook


    The pathways to joy are integrated, with each one supporting the next. We suggest
    that you begin by rebalancing the body, then settling the mind, and finally connecting
    with heart. Yet the pathways are also fluid and interconnected, so they can be
    done in any way that best suits your needs. You may find that a particular set
    of pathways is especially important for you. Or you may wish to revisit a pathway
    that you have strayed from in order to strengthen it. The following are examples
    of how you can make this program your own.


    *Clare’s Story: A Focus on Body*


    *Clare was a fifty-two-year-old woman who had experienced mild to moderate depression
    most of her life. While there were periods when she had felt strong and resilient,
    the past several months had become especially difficult for her. She had other
    lifelong health issues, such as migraine headaches, frequent sinus infections,
    and dermatitis. She was frustrated with herself because she has an insatiable
    sweet tooth and had gained weight during the past year. She had recently found
    out that she was vitamin D deficient. She also felt fatigued due to poor sleep,
    which made it hard for her to concentrate. After completing the resilience skills
    questionnaire, Clare found that working toward rebalancing her body would be most
    important to her overall success in this program.*


    *Paula’s Story: A Focus on Mind*

