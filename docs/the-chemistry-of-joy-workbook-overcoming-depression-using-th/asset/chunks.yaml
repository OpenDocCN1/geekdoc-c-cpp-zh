    这种草药疗法长期以来一直用于抑郁症。它通常被认为对*严重*抑郁症的效果较差（Davidson 等，2002），但研究人员得出结论认为，圣约翰草对轻中度抑郁症很有帮助，特别是伴有焦虑时（Linde,
    Berner, and Kriston，2009）。副作用轻微，可能包括轻微镇静、不安或恶心。圣约翰草可能会干扰某些药物，包括精神类药物和避孕药，因此如果你正在服用这些药物，请务必告诉医生。


    **不要在没有医疗监督的情况下用于双极性抑郁症或在抗抑郁药中加入。**


    西屈花：根据需要，每次 1 到 2 胶（或 10 到 20 滴），每天三四次。


    西屈花是一种温和的镇静草药，被证明在缓解焦虑方面与强效抗焦虑药物一样，但副作用少得多（Akhondzadeh 等，2001）。它可能无法直接提升情绪，但西屈花在焦虑性抑郁症的风暴中可以提供急需要的冷静。它可以偶尔使用，但如果焦虑持续存在，可以每天服用三四次，持续数周。


    ## 烦躁型抑郁症


    虽然比焦虑性抑郁症少见，但越来越多的人受到以烦躁和易怒为特征的抑郁症困扰。这可能是由于持续不断的压力和快节奏的生活方式，以及用于维持这些生活的刺激物：咖啡因、能量饮料、甜味剂（无论是糖还是人工甜味剂）以及各种药物。同时，许多人在感到心心或不知所措时，没有时间或能力来安慰自己。


    烦躁很容易被忽视，因为人们通常将自己的情绪描述为简单的“抑郁”。然而，仔细观察会发现，他们的情绪并非忧伤，而是有一种程度的紧张。当他们说自己感觉“不好”时，意味着他们感到愤怒、易怒或具有攻击性。由于体内刺激物去甲肾上腺素和多巴胺的作用，他们的大脑处于过载状态。


    ![图：高去甲肾上腺素，高多巴胺](img/fig4.5.jpg)


    乔什的故事


    “我很抑郁，睡不着觉。医生给我开了西普曲（Prozac），结果我感觉更糟了！”


    乔什是一位四十二岁、处于职业快速上升期的高管。他总是动力十足，对工作和运动都变得具有强迫性。他每天工作十二到十四小时，凌晨 4:30 起床锻炼，并用高蛋白饮食和大量的咖啡因来维持能量。乔什很抑郁，但身体也很烦躁不安，对孩子很坏气，对几乎每个人都很挑剔。他无法睡眠，因为他的大脑无法安静下来。面对婚姻的失败和工作中的负面反馈，他最终听从了朋友的建议去寻求帮助。


    他的第一步是服用西普曲。像许多患烦躁型抑郁症的人一样，乔什产生了矛盾性反应——药物让他感到更加烦躁和情绪化。这让他感到恐惧，足以让他做出重大的生活方式改变。他控制了咖啡因，并为自己安排了空闲时间以及与家人相处的高质量时光。他增加了下面的镇静补充剂，特别关注睡眠。


    他的焦虑和易怒得到了极大改善。然而，他仍然处于抑郁状态，因此我们增加了一种低剂量的刺激性较小的血清素药物——仅 10 毫克的西替普兰。他只需要几个月，然后就可以生活方式的改变和补充剂来维持情绪。


    ### 你是否存在多巴胺-去甲肾上腺素过剩？


    勾选以下描述你目前状况的每个陈述：


    *   我的情绪是愤怒或易怒的。

    *   我有失眠症。

    *   我有胃酸消化不良。

    *   我的能量烦躁且过剩，但有时可能会感到极度疲劳。

    *   我的大脑过度活跃，容易烦躁。

    *   我有敌意感。

    *   我经常被驱使或具有强迫性。

    *   我通常会对压力反应过度，变得更加心烦意乱或脾气不好。

    *   我很容易变得挑剔或排斥他人。

    *   我通常没有意识到低自尊的感觉。

    *   我在人际关系中倾向于排斥对方。

    *   我对光线变化很敏感，在春季或夏季经常感到更加兴奋或不安。

    *   我的经期周期面临着强烈的情绪挑战（经前综合征）。

    *   我有过药物滥用问题，或有酗酒或药物滥用的家族史。

    *   我有高血压。


    ### 评分


    相加勾选的项目总数。


    *   1–5：轻度多巴胺-去甲肾上腺素过剩

    *   6–10：中度多巴胺-去甲肾上腺素过剩

    *   11–15：严重多巴胺-去甲肾上腺素过剩


    记住，这反映反映目前的脑化学状况，你可以通过下面的镇静补充剂计划并遵循所有的快乐路径来重新平衡。


    ### 缓解烦躁型抑郁症的自然疗法


    如果你的评分表明去甲肾上腺素-多巴胺过剩，或者如果你有烦躁型抑郁症的迹象，以下补充剂可能帮助你恢复平衡。从列出的第一个补充剂开始，只有在三四周内没有感觉好转时再添加其他的。


    *   **L-茶氨**：每天两次，100–200 毫克。从烦躁型抑郁症中恢复的关键在于专注于镇静大脑。`L-theanine`是一种氨基酸，有助于调节多巴胺和去甲肾上腺素，并支持大脑主要镇静化学物质
    `GABA` 的关键作用（Nathan 等，2006）。`L-theanine`可以在镇静大脑活动的同时提高注意力并平复烦躁的情绪。它耐受性良好，但如果你感到镇静或头晕，可以在睡前服用。

    *   **5-HTP**：每天最多三次，每次 50–100 毫克。提高血清素水平也可以缓解烦躁，因此在焦虑性抑郁症中加入 5-HTP 同样有效。从每天 50
    毫克开始，每隔几天逐渐增加。注意烦躁情绪是否会加剧（这通常在服用 SSRI 药物时发生）。**在没有医生监督的情况下，不要与药物一起服用 5-HTP。**

    *   **NAC**：每天两次，600–1200 毫克。乙酰半胱氨酸（`NAC`）是一种可以转化为大脑中抗氧化剂的氨基酸。它具有镇静作用，与其他疗法（包括药物）一起使用时，可以帮助缓解抑郁（Berk
    等，2008）。它产生的副作用很少，除了偶尔恶心、便秘或腹泻。


    ## 迟缓型抑郁症


    这种模式的抑郁可以在任何时间发生，但在冬季更为常见，因为身体认为是时候冬眠了。它也可能是长期压力或其他类型抑郁症的后果，如果这些情况导致维持能量和动力的脑化学物质耗尽：多巴胺和去甲肾上腺素。


    许多人在考虑“临床抑郁症”时会想到这种模式，部分是因为症状很难隐藏迟缓型抑郁症。情绪通常被描述为悲伤、低落或简单的淡漠。大脑和身体似乎移动缓慢，仿佛被迷雾笼罩或背着额外的负担。睡眠（每天达十二到十四小时）通常被视为受欢迎的逃避，但很少能恢复精力。失去对正常活动的兴趣且从任何事情中找到乐趣是很常见的。


    ![图：低去甲肾上腺素，低多巴胺](img/fig4.6.jpg)


    乔妮的故事


    乔妮五十多岁，已婚，有两个成年的孩子。她一直受体重困扰，每年冬天都会增加几磅，绝经期后更是如此。


