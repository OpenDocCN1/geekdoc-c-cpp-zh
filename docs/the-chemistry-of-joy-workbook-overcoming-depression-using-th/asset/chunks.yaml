    # Knowing:


    Become a Source of Wisdom for Yourself


    *There is a great deal of unmapped country within us, which would have to be taken
    into account in an exploration of our gusts and storms.*


    *George Eliot*


    Lauren teared up as she slumped onto the couch in the therapy office. “I don’t
    know what happened,” she said. “One minute I was working on a paper for my freshman
    English class and thirty minutes later I was crying in my room. I felt just hopeless
    and I’ve been depressed ever since. But the worst thing is that I don’t know why.
    I feel like I’m going crazy.”


    Lauren isn’t going crazy but she *is* a stranger to herself. She must get to know
    her unmapped inner territory in order to understand what happens when she is overtaken
    by such strong emotion. She needs to understand herself more completely in order
    to work more skillfully with all that is happening within.


    Most people can identify a time when they felt taken over by a sudden, intense
    feeling that sprang from nowhere, and many regret the impulsive acts that these
    feelings prompted. Besides being unpleasant or frightening, these emotional storms
    can sometimes open the door to an episode of depression, as Lauren feared was
    happening to her.


    What happened to Lauren could be considered an emotional tsunami: the kind of
    emotionally overwhelming experience that can knock you off your feet. In this
    chapter we will guide you to take a closer look at a time when you were overtaken
    by such a storm. There are two reasons it is important to look more closely at
    these very unpleasant experiences. First, it is helpful to see that these are
    common human reactions and they do not mean that you are going crazy or are out
    of control. Second, as you learn more about your own unmapped territory, you will
    feel more confident about your ability to handle such emotionally overwhelming
    experiences and will have more courage when faced with them.


    ## The Emotional Tsunami


    It is inevitable that you are unaware of parts of your inner world. Everyone is.
    You spend most of the day dealing with the outside world: making a living, relating
    to others, navigating the streets of daily life. Naturally you are more familiar
    with the parts of yourself that you need in order to manage everyday life. You
    may even be tempted to arrange your life so you can stay within your comfort zone.
    You may want to avoid experiences that disturb you and stay away from people who
    might upset you. You may especially want to avoid the things within yourself that
    worry or confuse you. As long as you feel in control of the outside and the inside
    world, you feel pretty safe. However, none of us can maintain that kind of control
    at all times. An illness, a loss, a rejection, a threatening thought—all of these
    experiences come with the territory of being human.


    To a greater or lesser degree, emotional tsunamis happen to everyone, and when
    they arrive, they threaten your sense of predictability and control. The good
    news is that it is possible to learn from them and reduce the harm they can cause.
    With the assistance of mindful strategies, you can learn to recognize an emotional
    storm in its earliest stages, slow things down when the wind picks up, and stop
    yourself from acting in ways that add to the damage. It is even possible to learn
    enough from your storm experiences that you can avoid them in the future.


    Working with the Emotional Tsunami


    Recall a time when you had an overwhelming experience like Lauren’s. Maybe you
    felt a sudden hollowing in your stomach and all of your energy seemed to drain
    away, or maybe someone seemed to ignore you and you were filled with anger. Perhaps
    in the middle of a gathering, you experienced a feeling of loneliness and felt
    hopeless about ever belonging anywhere. After you read the following description
    of Lauren’s review of her experience, take some time to write about one of your
    own emotional tsunamis.


    Lauren’s Story'
