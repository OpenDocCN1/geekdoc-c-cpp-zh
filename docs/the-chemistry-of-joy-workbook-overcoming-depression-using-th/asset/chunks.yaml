- fmt: '

    Being open to your full range of emotions is also critical in recovering from
    and preventing depression. As you become more skillful in dealing with the difficult
    emotions, you will gain confidence that they do not always lead to another depressive
    episode. As you begin to trust yourself and your emotions, you will be able to
    distinguish normal “blue moods” from those that might really tip you into depression.
    Then you can take action early enough to prevent that from happening.


    # Living in the Open Mode


    Shifting back to look at Kathryn’s and John’s stories, let’s imagine what their
    experiences might look like had they been mindfully open to their emotions rather
    than being fixated or resisting.


    ## Kathryn’s and John’s Stories Revisited


    Upon hearing his father’s news, John notices sensations of shock and fear coursing
    through his body. He tells himself that it is normal and he can handle it. He
    names these feelings and takes a few deep breaths to get centered before he responds
    to his father with words of concern and his wish to be of help. He listens to
    his father’s needs and, together with him, begins to develop a plan of action:
    he’ll let the rest of his siblings know, and he’ll call an oncologist friend to
    help them all understand the situation more clearly. He’s able to ask questions
    and listen sensitively to his father, who expresses gratitude. John hangs up the
    phone, feeling close to his dad and happy to be of help. He realizes that he’s
    not only fearful, but also sad that his father, who’s already had a difficult
    life, will have to suffer more. He’s aware that he, too, is vulnerable and should
    have his `PSA` checked at his next physical exam. A bit of anxiety about his own
    mortality pops up, and he notices this but refocuses on the present moment. He
    thinks about sending an `e-mail` to his sister Kathryn, but picks up the phone
    instead because he wants to share his feelings with her and knows it will be comforting
    to them both to share this moment.


    He’s right about that. Kathryn picks up the phone and feels the same body sensations
    of shock and fear when she hears the news. Tears come to her eyes, and her throat
    tightens. She notes all of these feelings and, with a few deep breaths, reminds
    herself to just be present, to listen to John, to let her thinking mind come into
    play so she can understand exactly what’s happening. Kathryn is able to let John
    know how she is feeling, and to ask how he is. As they share this moment, both
    Kathryn and John feel connected and supported by each other, grateful that they
    can share this together. Feeling somewhat relieved, though still anxious and sad,
    they both move into their days. Kathryn talks with her parents about the news
    and then rearranges some of her work deadlines so she can spend a day or two with
    them. She makes a cup of tea and sits quietly, allowing all of her feelings to
    simply come up in her awareness, stay for a while, and—as she comforts herself—pass
    away. Her emotions leave some traces that she knows will be with her the rest
    of the day, but they are manageable. When her children arrive home, she’s able
    to be present with them, listening to their news and feeling the joy and comfort
    that their youthful energy and excitement bring to her.


    John calls his wife and briefly shares the news, and they plan to have dinner
    together at one of their favorite restaurants. Over the meal, he shares the details
    of the news and his own feelings about it. She feels included and connected, and
    is able to share her feelings as well. Both of them feel the presence of sadness
    and fear as they talk. John shares his concern about depression creeping back
    in, and she’s able to assure him that she’ll be watching and supporting him. They
    leave for home, feeling deeply grateful for their love for each other and their
    family roots. Later that evening they share the day’s experiences with neighbors
    while watching happy children run through the sprinklers. They see goodness all
    around them and feel joy, even on a day like this.


    John and Kathryn, in the second scenario, had learned to mindfully attend to their
    emotions and were not caught in tendencies to disconnect, resist, fixate, or be
    flooded by them. They were able to stay open to their emotions as they arose,
    name them, and experience them fully, allowing them to run their natural course.
    By turning skillfully toward their feelings, however painful, they could also
    experience the warm reassurance of connection and the joy of the day. They felt
    capable of moving into the future, regardless of what it might bring.


    # Experiencing the Full Cycle of Emotion


    This sort of emotional resilience begins by mindfully opening to your emotional
    experience and flowing with the natural emotional ups and downs of your daily
    life. As you develop mindfulness of the full cycle of feelings, even the very
    painful ones will be easier to tolerate. In fact, you will find that fully experiencing
    the cycle of an emotion with mindfulness—nonjudging and friendly acceptance—may
    be a relief, a type of catharsis.


    The idea of fully experiencing painful feelings might be frightening to you if
    you are in the middle of an episode of severe depression, and it’s best to wait
    until the intensity of such an episode has lifted. Still, it is safe to open yourself
    to the natural flow of minor daily emotional ups and downs. As your emotional
    comfort zone expands, you will gain confidence for the stronger emotions to come,
    and become more present and engaged in your life.


    For the following meditation, select an emotion from the emotional response pattern
    exercise that you often avoid or that you find somewhat overwhelming. Don’t choose
    the most extreme or overwhelming emotion—just a normal, everyday emotion. Choose
    one that has some charge for you but is not too strong.


    ## Guided Meditation: Sensing Emotion in the Body


    *   Sit comfortably, in a chair or on cushions, and align your body in a position
    that is alert but relaxed.

    *   Ground yourself for a few minutes by paying conscious attention to the full
    cycle of your breath, noticing the rise and fall of your belly or the air entering
    and leaving your nostrils. If, at any point in the meditation, you find yourself
    overwhelmed by the emotional sensations that come up, you can return to simple
    awareness of the breath as an anchor. Remember to use the spirit of mindful,judging
    curiosity as you explore your experience.

    *   When you feel ready, call to mind the emotion you have chosen to work with.
    It may be a feeling of frustration or anger, a sadness, a fear. Allow your memory
    to recall the details of the situation in which this emotion appeared: the place,
    people, words, or actions that were the triggers for this feeling.

    *   As you recall these details, try to get in touch with the physical sensations
    in your body. Emotions are most often felt in the body between your throat and
    your groin. Where are you feeling it now?

    *   Notice the quality of the sensation? Is it hot, cold, tight, tingly? Is it
    mild or intense?

    *   Is the sensation moving, or is it settling in some part of your body?

    *   If thoughts or stories about the emotion enter your mind, simply notice that,
    and notice the effect of the thoughts on the sensations you are feeling in your
    body. You might notice that the quality and intensity of the sensations wax and
    wane as thought appears. Notice that the emotional experience is like a wave,
    expanding and contracting. See if you can simply ride the wave, dropping thought
    and story line and simply sitting with the sensation as it rises and falls.

    *   You might also notice that the emotion itself will change over the course
    of time. Perhaps you began with anger, and it dissolves into fear or grief. It
    is the nature of the emotional life to be complex and sometimes multilayered.
    All of it is important to explore.

