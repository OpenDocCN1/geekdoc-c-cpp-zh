    在佛教教义中，“第一支箭与第二支箭”的类比被用来解释不安的心在产生痛苦中所扮演的角色。生命的“第一支箭”以人类不可避免的经历之形式击中我们所有人：疾病、衰老、失去所爱的人、自然灾害等等。这些第一支箭带来的痛苦是无法避免的。然而，第二支箭是在我们的控制之中的。第二支箭是内心在面对这些痛苦经历时所产生的产物。


    当我们仔细观察内心时，会发现我们对生活事件的思考和故事是如何在原始痛苦之上增添层层不必要的痛苦的。不安的心会本能地拒绝并试图逃避痛苦，通过在愉悦的事物中寻找转移，或者通过在情感上关闭自我并彻底切断联系。这样做，我们切断了与当下体验的联系，并徒劳地尝试改变体验的现实，这只会加剧我们的困扰。这些反应性的、最终变成习惯的思维和情感模式就是“第二支箭”，它们是
    100%自造成的。


    在亚历山德拉（Alexandra）的案例中，第二支箭始于她对失去工作的反应：严厉的自我批判、因为羞耻感而与同事和朋友隔绝，以及分散注意力的忙乱活动。她对未来发展了多个基于恐惧的灾难性设想，这增加了她的焦虑，直到她瘫痪并无法采取符合自身利益的行动。她回避和忙乱的策略让她无法清楚地看到自己的处境，无法采取更具建设性的行动。


    尽管这看起来可能矛盾，但解决第二支箭引起痛苦的方法，是放弃逃避痛苦的挣扎，并训练内心无论发生什么都保持非评判且开放的状态。这就是正念练习的精髓，也是我们疗愈方法的核心。我们无法改变产生困扰的事件，但我们可以改变我们与体验互动的方式。与其陷入思维大脑的策略中，我们可以学会简单地以不评判和友好的好奇心专注于每个时刻的完整。这种对“实相”（`is`）的激进接受可以开启通往自由的大门。


    如果你经历过抑郁，这种非评判的接受可能很难想象。你可能经历过内心变成你的敌人的现实，并可能自己已经输了几场战斗。抑郁的生物化学机制加剧了不安的心引起的普通困扰，让你对负面的反刍和焦虑感到无力。你所遭受的第二支箭可能包括：你认为自己是有缺陷或不完善的，或者认为只要你这次做对了，只要再努力一点，或者找到了正确的医生、计划、治疗师或药物，你的问题就会结束。你可能背负深重的羞耻感，并觉得自己需要被修复或需要去修复自己。由于所有这些错误的信念，你可能会遭受幻觉的影响，认为自己是孤立且孤独的，不属于人类社区的其他成员。


    我们想让你听到的是，你的痛苦是有解脱的。通过平复内心并发现其本性的广阔意识，你可以学习用一种新的方式来面对甚至是痛苦的经历。你可以从挣扎、回避或断绝转变为在当下活得更加充分、更有意识，而当下正是变化发生或发现快乐的唯一时刻。正念练习这一良药是这种转变为的基础，在工作本的剩余章节中，我们将展开正念练习的关键要素，将其作为通往疗愈和培养韧性的路径。


    ## 正念的良药


    “我看不出这些正念有什么用处，”查尔斯（Charles）走进房间时说道。“整周我都在极其痛苦地留意自己感觉有多糟糕。这只会让事情变得更糟。”


    查尔斯陷入了一种误区，认为正念只是强烈地感受自己的情绪，或对自己的想法格外关注。但正念远于此。正念是一种观察体验的特殊`way`（方式）——一种有意识且好奇的方式来观察任何特定时刻发生的事情，而无需将其标记为好或坏、可接受或不可接受。正念是对当下的开放，如其本身。


    正念不仅仅是一个观点——它是一种存在方式。正念地生活，我们以接受的态度迎接每种经历，并给予全部注意力。然而，不安的心需要练习来培养这种生活方式。本章的剩余部分提供了经过验证的练习，将帮助你开始更有正念地生活。我们将从已经是你日常生活部分的活动开始。当你带着意图和意识去做这些事时，你将捕捉到当下的魔力——你的内心也会自发地平静。


    ### 日常正念


    你日常生活的每个时刻都为你提供了变得更有正念、让内心平静并在当下活得更充分的机会。以下是几个简单的开始方法：


    *   每天早上醒来，在下床之前，进行`一分钟冥想`（Just a Minute Meditation，本章前文）。

    *   正念地吃早餐，不要看报纸、看电视或以其他方式分散注意力。

    *   开车时关掉收音机。注意放在方向盘上的手，并有意识地放松握力。

    *   在红灯期间时，专注于进行几次深呼吸。

    *   利用日常生活中普通的声音作为提醒，让自己停下来呼吸：电话铃声、邮件到达的提示声等。或者将你的电脑或其他设备设定为定期提醒你进行呼吸休息。

    *   考虑家务劳作——如洗碗或叠衣服——可以是一个调整感官并真正意识到你所做的事情的时间。如果你的心飘到了计划或分析上，只需回到手头的工作，专注于你看到的、感受到的、闻到的或听到的。

    *   在地方行走时，关注身体的感受，如脚接触地面、风吹过脸部。再次，当心飘走时，回到身体。

    *   在准备睡觉时，选择一项活动正念地进行，如刷牙或喝杯草本茶。享受这些感受。

    *   在进入梦乡时，练习有意识的正念呼吸。


    ## 正念饮食


    进餐的体验可以是一项充分欣赏当下的丰富练习。它每天都提供了多次机会来增强你的正念技巧。


    ***


    ### 正念饮食指南


    留出进餐时间，独自或与有情愿的人安静地用餐。


    *   预先想一下你想吃什么。由于你会更关注食物，你可能希望选择更健康、更有营养且更美味的食物。

    *   带着意识和注意力去准备食物。

    *   坐下，闭上眼睛，让内心平静片刻。如果你愿意，可以对食物表示感谢。

    *   在吃第一口之前，注意腹部的饥饿感、期待感，以及嘴巴准备接收食物时发生的变化。


