    Paula 觉得自己从小就沉浸在压力荷尔蒙中。她的父母对她进行情感虐待，并对她的成功有极高的期望。Paula 最终成为了一大公司的首席执行官，并在该职位上做了二十五年。她最近退休并回到家乡陪伴家人。在搬家之前，她的生活一直充实且节奏很快。然而，尽管外在压力减轻了，她却变得无法入眠，精神不集中。“我觉得我好像生活在自己的身体之外，”她说。她在韧性技能问卷上的得分表明，她特别强调平复心绪。


    ## 兰克的故事：关注内心


    四十岁时，兰克已经在自我接纳中挣扎了十三年，这始于他向家人出柜承认性恋后不久。他对自己非常严苛，往往是个完美主义者。最近因为工作搬到了新城市，他变得社交孤立。虽然他的工作还能正常进行，但他开始过度睡眠且进食不规律。他开始觉得自己不值得被爱。兰克在韧性技能问卷上的得分帮助他决定将大部分精力放在加强与内心的连接上。


    ## 那么，你应该如何开始？


    程序中的每一步都旨在建立在之前所有步骤的基础上。从开始并按顺序遵循通常效果良好，但我们鼓励你通过关注对你最重要的路径，让这个过程成为你自己的方式。接下来的韧性技能问卷将帮助引导你决定从哪里开始。你将发现自己在哪些方面做得很好，但也会看到哪些韧性技能面临着枯竭的风险。你的结果将帮助你决定将注意力和精力放在哪里，以便重新找回感受快乐的能力。


    请记住，这些技能是你与生拥有的，但它们需要在你一生中不断地刷新和更新，尤其是当你一路途中遇到许多快乐的敌人时。


    ## 韧性技能问卷


    请针对下面的每个问题，圈出最符合你情况的数字：


    1—很少不

    2—有时

    3—经常

    4—大多数时候

    5—几乎总是


    1. 我会花时间提供和准备有营养的食物，并带着愉快和觉察的心情用餐。1 2 3 4 5


    2. 我能注意到自己什么时候饿了或饱了，并采取相应的行动。 1 2 3 4 5


    3. 我能意识到当压力过大时身体向我发出的信号。 1 2 3 4 5


    `滋养` 分（第 3 章）——累加问题 1–3 的得分：____


    4. 我能从低落情绪中较快恢复。1 2 3 4 5


    5. 我通过针对我身体的特定营养产品来补充饮食。 1 2 3 4 5


    6. 我能识别自己情绪低落的模式，并在需要通过有效的自然疗法或处方治疗来支持自己。 1 2 3 4 5


    `平衡` 分（第 4 章）——累加问题 4–6 的得分：____


    7. 当我感到枯竭时，我知道可以做什么来恢复精力。 1 2 3 4 5


    8. 我喜欢活动身体，并且每天都会刻意地做某种运动。 1 2 3 4 5


    9. 我很少感到匆忙，并在需要时放慢速度或休息。 1 2 3 4 5


    `流淌` 分（第 5 章）——累加问题 7–9 的得分：____


    10. 我尝试一次只做一件事，并关注此时正在做的事。 1 2 3 4 5


    11. 我能感觉到思绪是否在奔忙，并停下来平静心绪。 1 2 3 4 5


    12. 我可以不加评判地接受我的想法。 1 2 3 4 5


    `沉淀` 分（第 6 章）——累加问题 10–12 的得分：____


    13. 我对我所有的情绪范围保持开放态度，并且对感受它们感到舒适。 1 2 3 4 5


    14. 我意识到所有的情感体验都是瞬时的，没有任何 string 是永远的。 1 2 3 4 5


    15. 我在身体中感受到情绪时能感知到它们，并且不会陷入过度思考它们的陷阱中。 1 2 3 4 5


    `开启` 分（第 7 章）——累加问题 13–15 的得分：____


    16. 我能看到我的想法并不是我的现实，并能够在它们对我的情绪产生很大影响之前让它们释放。 1 2 3 4 5


    17. 我知道什么样的情况可能会引发我内心负面情绪的洪水。 1 2 3 4 5


    18. 当一种压倒性的糟糕情绪来袭我时，我知道如何处理它，以最大限度地减少它给我带来的麻烦。 1 2 3 4 5


    `觉知` 分（第 8 章）——累加问题 16–18 的得分：____


    19. 我喜欢并接受现在的自己，即使我还有改进空间。 1 2 3 4 5


    20. 当我看到他人痛苦时，我很容易被打，我的心也会向他或她开放。 1 2 3 4 5


    21. 我善待他人。  1 2 3 4 5


    `连接` 分（第 9 章）——累加问题 19–21 的得分：____


    22. 我感到有身边的人让我感到慰藉。1 2 3 4 5


    23. 我知道生命中有人。 1 2 3 4 5


    24. 我感到是家庭、社区、国家和世界的一部分。 1 2 3 4 5


    `归属` 分（第 10 章）——累加问题 22–24 的得分：____


    25. 我会在白天停下来让自己静心。1 2 3 4 5


    26. 我对自己的灵性修习感到满意。1 2 3 4 5


    27. 我通常会倾听并遵循内心的声音。1 2 3 4 5


    `深耕` 分（第 11 章）——累加问题 25–27 的得分：____


    ## 评分


    将你在九个子项中圈出的数字相加。累加所有子项得分得到你的总韧性得分：


    108–135 分意味着你保持了良好的韧性状态，这很可能带给你幸福感或快乐。利用你的子项得分决定将精力放在哪里，以确保你健康快乐。


    81–107 分意味着你的韧性技能仍然尚可，但尚未达到巅峰，这可能会让你的情绪面临风险。利用你的子项得分帮助你选择最可能提高你韧性水平的领域。


    54–80 分意味着你的韧性技能较低，你处于高风险，或者可能已经出现了抑郁、焦虑或其他与压力相关的症状。你的子项得分将告诉你哪里已经枯竭，以及将大部分精力放在哪里，但你应该遵循整个韧性路径回到正轨。


    27–53 分意味着你的韧性技能已经枯竭，你极可能患有抑郁、焦虑或两者。请记住，这些技能是可以重新拾的，它们只是在等待你开始重建。


    接下来，将你的子项得分放在下面的表中。它们对应于九条快乐路径。通过比较不同路径的得分，你可以决定从哪里开始以及将大部分精力放在哪里。


    ![表格：韧性技能评分](img/fig1.10.jpg)


    * 13–15 分：这项韧性技能很强。继续保持，并看看是否有其他领域更需要你的关注。

    * 10–12 分：虽然尚可，但这项技能正在开始变弱。如果你现在采取加固，可能会防止未来的问题。

    * 7–9 分：这项技能正在流失，使你处于风险之中。务必在程序内尽快解决它。

    * 3–6 分：这项技能已经侵蚀。你可以通过立即开始相应的路径来重新获得它。完成整个程序将确保你尽所努力地重建你的韧性。


    ## 额外支持


