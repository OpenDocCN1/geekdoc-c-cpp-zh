    - Begin with a few moments of silence during which you set your intention for
    this time. You might ask for guidance and the openness to receive it.

    - Write a question in your journal; if you don’t have a question yet, sit quietly
    while you invite a question to arise. Or you could write a general question like
    “What is important for me to hear today?”

    - Once you have formed a question, close your eyes and hold the question lightly
    in your mind. You don’t need to think too hard about it, because you’re not trying
    to figure it out. Allow the thinking mind to go into the background, and see if
    you can let the question sink further into your being.

    - Continue sitting until you feel something arise in response to your question.
    It may be an image, a sensation, a feeling, a color, or a sense of movement. Or
    it may be particular words. Again, you don’t need to figure this out. Just as
    soon as you notice something arise, open your eyes and pick up your journal and
    pen.

    - Just below your question, begin writing or drawing whatever comes to you. Just
    write, uncensored, and allow it to keep flowing out of you and through the pen
    as if it had a life of its own. Keep writing until you feel finished with that
    particular question.

    - Next you may want to look at what you’ve written and reflect upon it, bringing
    your thinking mind back to the forefront. As you read and reflect, see if a new,
    clarifying question arises and write it down. Or you may want to write a response
    to what you have just read.

    - If you had an additional question come up, sit with that question for a few
    moments until you feel another response arising, and go through the same process.
    Keep writing and reflecting until you feel finished for the present time.

    - Look over what you have written and try to capture the essence of it: what are
    the kernels of wisdom, new insights or particular actions that you would like
    to take?

    - Return to this inner dialogue as often as you’d like to stay in touch with the
    ground of your being.


    Questions sometimes arise from this process, such as “How do I know if what I’m
    getting from this is real?” “What if I just made it up?” “How do I know if this
    inner guidance is worth following or not?” Discernment is a challenging part of
    the relationship with the inner life. While there are no surefire ways of validating
    this process, there are signs (listed in the box) that can help assure you that
    you are on the right track.


    ***


    ## How to Tell If Your Inner Voice Is Authentic


    - During the listening process, your thinking mind gives way to your creative
    mind.

    - There is a sense of openness and flowing as you write.

    - The words are clear and unambiguous—maybe even authoritative.

    - You have a sense of resonance with it—it just `feels` true.

    - The tone is supportive, affirming, and reassuring, even if it is saying difficult
    things that you need to hear.

    - If guidance is given, there is a sense of positive, forward movement in it.

    - The inner voice is always kind and loving, never harsh or critical.

    - During and after the dialogue, you feel peaceful, connected, and expansive.

    - You can look at it and say, “Whether this is real or not, `this` is how I’d
    like to live my life.”


    ## Depression as an Occasion for Awakening


    While the battle with depression can leave you feeling diminished, it is also
    possible to emerge from the encounter and be somehow enlarged by it. Depression
    can encourage you to listen to your inner voice. So as you come out of depression,
    we urge you neither to push the experience away nor to hold on to it too tightly.
    There is a middle way that just might help you awaken to a larger version of yourself.


    ### Opening to the Inner Life


    Poet Anita Barrows refers to depression as a “permeable darkness” (Barrows 2006)—not
    something to be escaped from, but rather as an opportunity to listen, to deepen,
    to be “ripened” through your experience. While we do not view depression as `necessary`
    for deep personal growth, we do believe that you can come out on the other side
    with new life and greater depth.


    The following exercise will invite you to look at your own experience of emergence
    from the darkness of depression. Please remember to be gentle with yourself, and
    to do this only if you feel you have enough distance from the intensity of depression
    that you feel ready to look into the experience without becoming caught up again
    in the pain of it.


    After the exercise, there is an example from Kristin’s own dialogue process. You
    may wish to read her responses first, to give you a sense of what this process
    can look like; or you can first write your responses if you think that would help
    your own voice to come forth. The choice is yours.


    ### Guided Imagery: Emerging from Depression


    Choose a quiet time and place, and give yourself at least thirty to forty-five
    minutes for this exercise. Have colored pens or watercolors with drawing paper
    at your side (or just pen and paper if you prefer to write).


    - Sit quietly, eyes closed, and enjoy a few moments of awareness of your breathing.
    Allow your mind to settle. Then place your awareness on your heart center.

    - Allow an image to arise of a garden—your garden—in the early spring. It is a
    time for the new, a time of hope. The garden may be in a place you know, like
    the garden plot in your yard now or when you were a child. Or it may be a place
    you imagine, one of your creating. See it now in full detail. How big is the garden?
    Is it surrounded by trees…hills…water? Imagine the smells, the sounds, the feel
    of springtime air.

    - Now imagine you are walking through the garden to examine it. Winter has just
    receded. Notice what you feel as you stand in the midst of debris.

    - Still on your knees, you look closer underneath the debris. Then you see what
    you had for—tender green shoots, just beginning to emerge from the dark, soil.

    - Next, see yourself as you kneel down to, clearing away some of the leaves and
    waste from winter set in. As you do so, you note that this will become valuable
    compost, providing nutrients and protection for what is soon to emerge.

    - Describe the new growth beneath the muck. What wants to emerge? What does it
    require of you in this tender stage to nurture them?

    - When you’re ready, pick up your drawing or writing materials. Remain in a meditative
    state and begin to draw (or describe) what you saw in the guided imagery. Take
    as much time as you need for, letting yourself express whatever comes up without
    evaluating or analyzing it.

    - When you have finished drawing or writing, set your materials aside and hold
    your work in front of you. Look at it closely, not trying to figure it out but
    just seeing if you are drawn to any of the images, and feeling what they bring
    up in you. Start with a question below, or one of your own, and sit quietly until
    a response begins to arise. Then write until you feel finished before doing the
    same with another question.

    - Describe the experience of standing in your garden at this moment in your life,
    surveying the effects of a long, hard winter.

    - What needs to be cleared away? What is dead and of no use? What can you save
    and use for fertilizer or compost?

    - Describe the new growth beneath the muck. What wants to emerge? What does it
    require of you in this stage?

    - How full is your garden? Is there too much, so that some needs to be thinned
    out in order for that you really want to flourish? Or do you need to add more,
    to bring newness into it? If so, what would that be?

    - When you feel finished, close your eyes once more. Bring your awareness back
    to your heart center and notice any gratitude you have for your experience.

    - End with a closing ritual, if desired.


    *Kristin’s Imagery*

