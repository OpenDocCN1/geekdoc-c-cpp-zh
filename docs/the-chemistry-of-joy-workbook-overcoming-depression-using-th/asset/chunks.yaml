    Earth types tend to sleep too much and often have a difficult time waking up and
    getting out of bed on time. Daytime naps are also a temptation, but they tend
    to make you even more sluggish and should be avoided until your energy is back
    to normal. If you must nap, keep it short (twenty to thirty minutes) and early
    in the day (between noon and 3:00 p.m.). It is important to get to bed early and
    then arise early, ideally before sunrise.


    Avoid alcohol before bed; it may seem to relax you but can further disrupt your
    sleep.


    ### Come to your senses.

    The physical senses that are most soothing for earth energy are taste and smell
    (which may partly explain the tendency toward weight gain). Rather than going
