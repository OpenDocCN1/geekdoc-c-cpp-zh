    sluggish

    Breathe in and out through your nose as fast as you can, as if your chest were
    a bellows. Make the in-breath and out-breath equal in length. Do this for twenty
    to thirty seconds at first, working up to a minute or two. Stop and slow your
    breathing if you feel light-headed.


    ***


    You might also try the yogic right-nostril breathing. Inhale through the right
    nostril and exhale through the left, covering the other side with your thumb or
    forefinger. Continue breathing in this way for a few minutes, until you feel rebalanced
    and energized.


    **Change with the seasons.** Earth energy is often aggravated in the spring, when
    the weather becomes cool and damp. If you’re an earth type, you need to stay warm
    and dry in the spring.

