    Paula felt as if she had been swimming in stress hormones since childhood. Her
    parents were emotionally abusive and had very high expectations for her success.
    Paula eventually became CEO of a large company and held the job for twenty-five
    years. She had recently retired and moved back to her hometown to be near family.
    Until the move, life had been full and fast paced. Then, despite the diminishing
    of her outward stress, she became unable to sleep and her mind was unfocused.
    “I feel like I’m living outside of myself,” she said. Her score on the resilience
    skills questionnaire suggested that she put special emphasis on settling her mind.


    ## Frank’s Story: A Focus on Heart


    At the age of forty, Frank had been struggling with self-acceptance for thirteen
    years, starting shortly after he came out to his family as gay. He was very hard
    on himself and tended to be a perfectionist. Recently transferred to a new city
    for his job, he became socially isolated. He was still able to function at work,
    but he started sleeping excessively and not eating regularly. He was beginning
    to feel as if he was not worthy of being loved. Frank’s scores on the resilience
    skills questionnaire helped him decide to put most of his energy into strengthening
    his connection with heart.


    ## So How Should You Begin?


    Each step in the program is meant to build upon all of the previous ones. It always
    works well to start at the beginning and follow them in order, but we encourage
    you to make this process your own by focusing on the pathways most important to
    you. The following resilience skills questionnaire will help guide you in deciding
    where to begin. You will discover what you are already doing well but will also
    see where your resilience skills risk becoming depleted. Your results will help
    you decide where to place your attention and energy so that you can recover your
    own access to joy.


    Remember that these are skills you naturally possess, but they need to be refreshed
    and renewed throughout your life, especially if you have encountered numerous
    enemies of joy along the way.


    ## Resilience Skills Questionnaire


    For each question below, circle the number that is most true for you:


    1—Hardly ever

    2—Some of the time

    3—As often as not

    4—Most of the time

    5—Nearly always


    1. I take time to provide and prepare nourishing foods, and I eat with enjoyment
    and awareness. 1 2 3 4 5


    2. I notice when I am hungry or when I am full, and I act accordingly. 1 2 3 4
    5


    3. I am aware of the signals my body gives me when I am under too much stress.
    1 2 3 4 5


    `Nurturing` Score (chapter 3)—add scores for questions 1–3: ____


    4. I bounce back fairly quickly from low moods. 1 2 3 4 5


    5. I supplement my diet with key nutritional products specific for my body. 1
    2 3 4 5


    6. I recognize the pattern of my down moods and support myself with effective
    natural or prescription therapies when needed. 1 2 3 4 5


    `Balancing` Score (chapter 4)—add scores for questions 4–6: ____


    7. When I feel depleted, I know what I can do to restore my energy. 1 2 3 4 5


    8. I enjoy moving my body, and I intentionally do some kind of movement every
    day. 1 2 3 4 5


    9. I seldom feel rushed, and I slow down or rest when I need to. 1 2 3 4 5


    `Flowing` Score (chapter 5)—add scores for questions 7–9: ____


    10. I try to do one thing at a time and pay attention to what I am doing in the
    here and now. 1 2 3 4 5


    11. I can sense when my thoughts are rushing, and I pause to calm my mind. 1 2
    3 4 5


    12. I can accept my thoughts without judgment. 1 2 3 4 5


    `Settling` Score (chapter 6)—add scores for questions 10–12: ____


    13. I am open to the whole range of my emotions and am comfortable feeling them.
    1 2 3 4 5


    14. I realize that all emotional experiences are impermanent, that none last forever.
    1 2 3 4 5


    15. I am aware of my emotions as I feel them in my body, and don’t get caught
    up in overthinking them. 1 2 3 4 5


    `Opening` Score (chapter 7)—add scores for questions 13–15: ____


    16. I can see that my thoughts are not my reality, and I am able to let them go
    before they have much impact on my mood. 1 2 3 4 5


    17. I know what kinds of situations are likely to trigger a flood of negative
    feelings in me. 1 2 3 4 5


    18. When an overwhelmingly bad mood hits me, I know how to work with it to minimize
    the trouble it creates for me. 1 2 3 4 5


    `Knowing` Score (chapter 8)—add scores for questions 16–18: ____


    19. I like and accept myself as I am, even if I could use some improvement. 1
    2 3 4 5


    20. I am easily moved when I see someone else suffering, and my heart opens to
    him or her. 1 2 3 4 5


    21. I treat others with kindness. 1 2 3 4 5


    `Connecting` Score (chapter 9)—add scores for questions 19–21: ____


    22. I feel comforted knowing I have people in my life. 1 2 3 4 5


    23. I have people to me. 1 2 3 4 5


    24. I feel part of larger circles, including family, community, tribe, nation,
    and world. 1 2 3 4 5


    `Belonging` Score (chapter 10)—add scores for questions 22–24: ____


    25. I pause during the day to center myself. 1 2 3 4 5


    26. I am satisfied with my spiritual practice. 1 2 3 4 5


    27. I usually listen to and heed my inner voice. 1 2 3 4 5


    `Deepening` Score (chapter 11)—add scores for questions 25–27: ____


    ## Scoring


    Add together the numbers you circled within each of the nine subgroups. Add all
    the subgroup scores to get your overall resilience score:


    A score of 108–135 means that you have kept your resilience skills in good shape
    and that is likely to pay off in giving you a sense of well-being or joy. Use
    your subgroup scores to determine where to put energy to assure that you stay
    healthy and happy.


    A score of 81–107 means that your resilience skills are still moderately strong
    but not at their peak and this may put your mood at risk. Use your subgroup scores
    to help you choose those areas most likely to raise your resilience skills back
    to a high level.


    A score of 54–80 means that your resilience skills are low and you are at high
    risk, or may already have symptoms of depression, anxiety, or another stress-related
    condition. Your subgroup scores will tell you where you are depleted and where
    to put most of your energy, but you should follow all parts of the resilience
    pathway to get yourself back on track.


    A score of 27–53 means that your resilience skills are depleted, and you very
    likely have symptoms of depression, anxiety, or both. Remember that these skills
    can be reclaimed; they are just waiting for you to begin building them back up.


    Next, place your subgroup scores in the table below. They correspond to the nine
    pathways to joy. By comparing your scores across the pathways, you can decide
    where to begin and where to put most of your effort.


    ![Table: Scoring your Resilience Skills](Images/fig1.10.jpg)


    * 13–15: This resilience skill is strong. Keep up the good work and look to see
    if another area is more in need of your attention.

    * 10–12: While still moderately strong, this skill is beginning to weaken. If
    you act to shore it up now, you may prevent future problems.

    * 7–9: This skill is fading, placing you at risk. Be sure to address it quickly
    within the program.

    * 3–6: This skill has eroded. You can still reclaim it by beginning right away
    with the corresponding pathway. Doing the entire program will ensure that you
    are doing all you can to rebuild your resilience.


    ## Additional Support

