    \ 4\n\n![Symbol for Balancing](Images/fig1.2.jpg)\n\n## Balancing: Support Your\
    \ Brain\n\n*If depression is creeping up and must be faced, learn something about\
    \ the nature of the beast: you may escape without a mauling.*\n\nDr. W. R. Shepherd\n\
    \n“My friends are telling me to try medications, but I don’t know. I hear others\
    \ complaining about side effects or not being sure that they are really helpful.\
    \ I try to eat right and exercise. Isn’t there something else I can do?”\n\nWhen\
    \ diet and lifestyle alone are not enough to sustain a healthy mood, we believe\
    \ it is best to discover where the brain imbalance lies and then try to remedy\
    \ that through the intelligent addition of nutritional supplements. If that still\
    \ falls short, then medication, used wisely and judiciously, may provide symptom\
    \ relief as you work toward more natural, sustainable, and healthy brain function.\n\
    \nThis chapter will give you all the tools you need to create your own resilient-brain\
    \ program, along with just enough brain science to help you understand how things\
    \ work to sustain your mood, what can go wrong, and what you can do about it.\
    \ After working through this chapter, you will be able to:\n\n* Identify the three\
    \ subtypes of depression, using questionnaires to help you determine whether you\
    \ tend toward one of these types.\n* Decide if you are likely to have a particular\
    \ brain-chemical imbalance and understand its consequences.\n* Create your own\
    \ personalized supplement program to establish a solid nutritional foundation\
    \ and help restore balance.\n* Know when medications are needed and which are\
    \ your best choices given your type of brain chemical imbalance.\n\nThis chapter\
    \ contains a lot of information that can feel overwhelming. Remember that this\
    \ is a process, and you don’t have to change everything at once or do things perfectly.\
    \ The chapter is organized around three distinctly different subtypes of depression,\
    \ so you can focus on the areas most relevant to you.\n\n### The Three Subtypes\
    \ of Depression\n\nTerms like “depression” and “anxiety” are used very broadly\
    \ today. You may think that the diagnosis of “major depression,” for example,\
    \ refers to a single condition that will respond to a particular treatment. Yet\
    \ various people labeled with this diagnosis can have dramatic differences in\
    \ their symptoms, reflecting what is going on with their brain chemistry. It is\
    \ important to remember that depression is not a single entity, and if you can\
    \ refine your understanding, then you may be able to find a more direct way out\
    \ of it.\n\nWe find it useful to distinguish among three subtypes of depression:\n\
    \n* *Anxious depression*, where mood is low and there are also strong feelings\
    \ of anxiety, insecurity, and impulsivity\n* *Agitated depression*, where anger\
    \ or irritability are the predominant moods, often accompanied by physical agitation\
    \ and sometimes by compulsive behaviors\n* *Sluggish depression*, with a dulled\
    \ or flat mood and strong feelings of lethargy, sleepiness, and lack of motivation\n\
    \nThese distinct patterns often reflect very different brain-chemical imbalances.\
    \ Find out if you are prone to one of these subtypes of depression by taking the\
    \ following questionnaire.\n\n#### What Type of Depression Do You Have?\n\nFor\
    \ each question, mark the answer that best describes you. If more than one answer\
    \ seems to fit, mark both, or all three:\n\n1. My mood is predominantly:\n   \
    \ * a. anxious, stressed, or highly changeable.\n    * b. irritable, agitated,\
