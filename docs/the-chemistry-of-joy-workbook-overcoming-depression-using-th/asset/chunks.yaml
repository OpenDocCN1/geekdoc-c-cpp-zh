  raw: '*   In partnership with your inner visionary, let yourself feel your desire
    to belong, to feel safe and welcome, recognized and wanted. If it has been a long
    time since you have had such an experience, there may be some grief about its
    absence. If so, that’s all right; just allow the grief, knowing it comes out of
    the deep human desire for connection.


    *   Still working with your inner visionary, call up a scene in your life where
    you felt awkward and shy, uncertain of your welcome. This could be with a group
    of strangers…or some friends that you have come to feel insecure with…or maybe
    with a partner or spouse if some distance has come between you.


    *   Now, invite your heart to open to the others in the scene. See if it’s possible
    to experience a greater sense of ease. … In this moment, for just this moment,
    letting go of the obstacles to belonging…the painful memories, the fear of rejection,
    the worry about being accepted…let them all go and feel, for just this moment,
    the delight of a heart that is open to others, that knows it can be both welcomed
    and welcoming.


    *   Allow yourself to rest in the moment…feeling the absence of stress and the
    presence of *ease*.


    *   In a few moments, thank your inner visionary for showing you what your heart
    longs for and for showing you what can be.


    ## Connecting by Engaging Body, Mind, and Heart


    The suffering of loneliness, like all suffering, can be reduced by identifying
    and working with the second arrows that intensify it. As you may recall from chapter
    6, “second arrows” refer to the ways that suffering is compounded by our resistance
    to what is, and through unhelpful ways of thinking, reacting, and acting. Just
    as the sensation of pain intensifies when muscles contract around an injury, the
    emotional pain of loneliness intensifies when the heart contracts around the pain
    of separation.


    The remainder of this chapter will offer you ways of strengthening your connections
    and thereby lessening the pain of loneliness.


    Connecting through the Body


    As you may remember from reading about the stress response at the beginning of
    this workbook, the body is exquisitely reactive to danger and responds immediately
    and thoroughly to anything it assesses as a threat. There has been a great deal
    of research done about the stress response, and no doubt you have learned a lot
    about its negative impact on health. But you have probably not heard as much about
    another brain response, one that is far more positive in its effects. This is
    called the *oxytocin response* or the tend-and-befriend response.


    Under certain conditions, the brain releases the hormone oxytocin. Also known
    as the “cuddle hormone,” it is like a wonder drug for connection. When it is released,
    people feel a sense of closeness and connection. Oxytocin is involved in all the
    processes that help us to relax and delight in the presence of others. It works
    to increase trust, reduce fear, and deepen empathy. This hormone is triggered
    when the body is most united with another person—as during childbirth, nursing,
    and sexual intimacy. However, it doesn’t take such grand experiences to benefit
    from the oxytocin response.


    As you read through the following list of activities, identify which ones are
    available to you and which ones you could add to your life. Each of them can trigger
    the oxytocin response.


    *   Greet someone with a hug.


    *   Share a sweet kiss.


    *   Stroke the fur of a pet.


    *   Remember a time when you received something that pleased you.


    *   Remember a time when you gave someone something that made them happy.


    *   Root for your team, especially with a group of other fans.


    *   Create music in a group by joining a band, choir, or orchestra.


    *   Write about your greatest values and principles.


    Another option is to start behaving like someone who is already connected to others.
    Although we usually speak of belonging as a feeling, it is also possible to practice
    belonging behaviors—to act as if you already belong. For example, you can try:


    *   Making eye contact with a person you pass in the school hallway or office
    corridor


    *   Giving someone the kind of compliment that lets him know you’ve *seen* him


    *   Letting your face and eyes soften


    *   Inviting a gentle smile to your lips


    *   Initiating a greeting


    You might have spent your life so far in the waiting role: waiting to be invited,
    waiting to be selected. It might even seem inauthentic of you to offer an invitation.
    *After all*, you might be thinking, *If I am uncomfortable doing something, doesn’t
    it mean I’m not being real?* The answer to that is a resounding no. In learning
    any new skill, it takes time to build confidence and comfort. And it’s fine to
    be a bit awkward as you learn. After all, the first time you tried to walk, you
    fell right over. Even if you have held back until now, this is something you can
    begin to alter right away.


