    path. It begins with a single step, but that alone will not make it a path. That
    first step must be followed by another and again by another. When your resilience
    is depleted, it may seem an overwhelming prospect to take that first step. There
    is a tendency to blame yourself for an inability to “snap out of it,” yet most
    people have no real guidance on how to reclaim their lives.


