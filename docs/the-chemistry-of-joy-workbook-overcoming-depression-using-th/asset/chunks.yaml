    # Live calmly through the day


    A regular routine is essential. Aim to get up and go to bed at the same time each
    day. Eat meals at regular times, and never skip meals. Try to keep work hours
    consistent and moderate. Take regular breaks, ideally every one and a half to
    two hours. Doing nothing once in a while may be your most productive use of time.


    Remember to regularly set aside extensive time for reflection and renewal.


    # Eat wisely for your type


    Food should bring warmth, moisture, and substance to return air types to balance;
    think “comfort food,” including warm soups and stews. Minimize dry foods (crackers,
    cereals) or uncooked foods (raw vegetables). Keep regular mealtimes, with the
    midday meal being the largest, if possible. Eat slowly and take a few minutes
    to relax after the meal. Drink warm water throughout the day. Use the list below
    to guide your food choices.


    ## Air Balancing Foods


    - **Overview**: Modest protein, warm foods with plenty of complex carbohydrates


    ### Recommended Foods


    - **Dairy**: Milk and cheese

    - **Meats**: Turkey, chicken, seafood

    - **Beans and legumes**: Soy, lentils, chickpeas (these may cause gas if you don’t
    have strong digestion)

    - **Nuts and seeds**: Almonds and almond butter, sesame seeds and tahini, flaxseeds

    - **Grains**: Rice, wheat, oats, amaranth, quinoa, whole-grain breads, hot cereals

    - **Root vegetables**: Carrots, onions, beets, radishes, turnips, sweet potatoes,
    squash

    - **Cooked vegetables**: Asparagus, leafy greens, green beans, okra, garlic

    - **Fruits**: Sweet, ripe fruits such as grapes, melons, oranges, mangoes, berries,
    cherries, dates, figs, pineapples, plums, nectarines, bananas

    - **Snacks**: Nuts or seeds, fruits, milk or yogurt

    - **Herbs and spices**: Anise, basil, cardamom, cinnamon, fennel, ginger, licorice,
    nutmeg, thyme


    # Move in tune with your body


    You do not need to do vigorous exercise to balance air energy; favor instead any
    type of rhythmic movement such as dance or tai chi.


    - **Ideal exercise**: Walking; aim for twenty to thirty minutes, once or twice
    daily.

    - **Being in nature and with others** is a plus. Consider biking, rowing, hiking,
    skiing, or dancing.

    - **Best mind-body exercises**: Restorative or gentle yoga, or chi gong.


    ***


    A recent study (Mota-Pereira et al. 2011) used walking to assess the effect of
    moderate exercise on treatment-resistant depression (depression lasting at least
    nine months and not responding to two different antidepressant medications). Those
    in the intervention group were asked to walk for thirty to forty-five minutes
    per day, five days a week. That group improved in all measures of depression,
    50 percent were significantly improved, and one out of four reached full remission.
    Not one member of the control group (which did not add exercise) reached remission.


    Two interesting side notes to this study are:


    - In the intervention group, those who were more heavily medicated were less likely
    to respond.

    - Participants were considered to be in compliance if they did at least 50 percent
    of the amount of walking expected of them. By those criteria, 91 percent were
    compliant. The researchers were using the `51 Percent Solution` described in chapter
    2!


    ***


    # Tuck yourself in properly


    Air types almost always need more sleep than they are getting, with potentially
    serious consequences (see sidebar). Keep regular hours and get to bed early. Set
    aside thirty to forty-five minutes for a relaxed bedtime routine, much as a wise
    parent does for a child. Set the lights low, turn off the computer or TV, read
    a story, or take a warm bath. If you like, have a cup of warm milk with a little
    cardamom or nutmeg.


    Avoid alcohol before bed; it may seem to relax you but can further disrupt your
    sleep.


    Researchers focusing on seventeen- to twenty-four-year-olds who were not getting
    enough sleep found that this was a risk factor for persistent psychological stress.
    Following nearly three thousand young people for twelve to eighteen months, they
    discovered that for each hour of lost sleep, levels of psychological stress rose
    by 5 percent. Those getting the least amount of sleep were 14 percent more likely
    to report symptoms of psychological stress. If they were already suffering from
    anxiety, the lack of sleep often led to depression. Even if they were not anxious
    to begin with, those who slept less than five hours per night tripled their odds
    of becoming psychologically stressed (Glozier et al. 2010).


    # Come to your senses


    The physical sense that is most soothing for air types is touch, and massage is
    an ideal way to calm yourself when you are stressed or anxious, and also to treat
    dry skin. Use warm almond or jojoba oil just before your bath or shower and a
    gentle moisturizer afterward. You may want to add a few drops of a calming essential
    oil, like lavender or sweet orange. You can also use these as aromatherapy.


    Sound is the second most important sense for air types. Listening to soothing,
    soft music or sounds of nature may quickly balance your mind and body.


    # Take a deep breath


    You can use the following calming breath technique whenever you get anxious or
    if you have difficulty sleeping.


    ***


    ## Calming Breath


    Slowly breathe in through your nose to the count of four. Breathe out through
    your mouth even more slowly—to the count of seven. Some people find it even more
    calming to make an audible sigh with your out-breath.


    ***


    Try the yogic alternate nostril breathing, which is highly recommended for air
    types. As you exhale, place your thumb or forefinger gently over one nostril,
    forcing you to breathe out through the other. After inhaling through the same
    nostril, switch sides. Continue alternating from right to left nostril for a few
    minutes, or until you feel rebalanced and de-stressed.


    # Change with the seasons


    Air energy is aggravated in the fall and winter, when the weather becomes dry,
    windy, and cold. If you’re an air type, you need to stay warm and keep your skin
    moist with baths, showers, saunas, and steam rooms, and use moisturizing oils
    and lotions. This is a particularly important time to follow the dietary suggestions
    mentioned earlier, sticking with favored foods and avoiding foods that are not
    recommended. When the weather is cold and windy, you need to pay particular attention
    to maintaining your exercise routines and daily schedule.


    # Take Action: Create Your Calming Tool Kit


    Here are a few simple, self-nurturing activities you can do to calm yourself whenever
    you notice that you are becoming more frenetic. Choose a few favorites so that
    you can take quick action to bring yourself back into balance, and add to the
    list in the space below:


    - Take a walk in nature—alone or with a friend.

    - Get outdoors and relax in the sun.

    - Drink a warm beverage (no caffeine!).

    - Eat a small handful of seeds and nuts (and then take a few minutes’ break).

    - Read an entertaining or inspiring book.

    - Go see a light, fun movie.

    - Take a warm bath or shower.

    - Take a twenty-minute nap.

    - Stop everything else and listen to your favorite soft or classical music.

    - Get a massage.

    - Go to a yoga class.

    - Do five to ten minutes of the calming breath or alternate-nostril breathing.

    - Take time for prayer or meditation.

    - ________

    - ________

    - ________

    - ________

    - ________


    # Realigning Fire Types


    When fire types are imbalanced, it can show up in the following ways:


    ![Table: Fire Imbalance - Physical symptoms, Mental/Emotional symptoms](Images/fig5.2.jpg)


    These can be early warning signs of agitated depression. Begin the rebalancing
    measures below right away to keep depression from taking hold.


    ***


    ## Discover the Causes of Fire Imbalance


    Check each of the following statements that applies to you:


    - I work long hours and push to meet deadlines.

    - I tend to become overly focused on tasks.

    - I don’t get enough exercise.

    - I use caffeine or nicotine.

    - I eat a lot of hot, spicy, or greasy foods.

