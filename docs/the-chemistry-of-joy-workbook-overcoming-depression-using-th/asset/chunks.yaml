    ## Introduction


    # Restoring the Elements of a Resilient Life


    *Surely joy is the condition of life.*


    Henry David Thoreau


    Resilience is natural. Even after a long, hard winter, when the proper conditions
    arrive, nature simply springs back to life of its own accord.


    Resilience may be natural, yet every day we encounter people who are enduring
    a hard inner winter, whose joy and vitality have long ago gone dormant. Many of
    them have lost heart. Having tried all the usual remedies with little success,
    they wonder if they will ever fully reclaim their lives. They come to us with
    a single question, framed in a thousand different ways: “What can I do to feel
    better, to bring myself back to life, to recover the joy that I have lost?”


    This workbook is our answer to that question, and we are so glad to share it with
    you. We are a team of healers trained in holistic psychiatry, integrative nutrition,
    and the psychology of mindfulness. We have a shared passion for blending the elements
    from these different ways of knowing into a coherent, healing whole. Our goal
    is simple: to offer insights, strategies, and skills that really work.


    ### How do we know that this approach works?


    - It is based upon the most current research in neuroscience, genetic expression,
    nutrition, and the psychological sciences.

    - The inner skills we offer come from the wisdom of mindfulness, which has been
    a powerful antidote to human suffering for over 2,500 years.

    - We have witnessed thousands of people reclaim their lives from depression, anxiety,
    and other stress-related conditions by following the pathways that we describe
    in this book.

    - We practice these skills ourselves and we know firsthand how life giving they
    can be.


    ## The of Joy


    Though it is often hard to see life as essentially joyful, we believe that it
    is. While it may be hidden, the experience of joy is natural and effortless, and
    it is available to us at all times, whether or not we are aware of its presence.


    *A man approached one of us after a workshop to say how much he appreciated this
    truth. “My son died two years ago,” he explained, “and I was devastated. I sank
    into a dark depression. Your work helped me to reconnect to the joy that was his
    short life. Now I can carry sorrow and joy at the same time, and the one no longer
    outweighs the other.”*


    This man knows that joy is not merely a feeling; it does not mean that we are
    always happy or expansive. Sadness, loss, and sorrow are not the opposite of joy,
    and they do not necessarily prevent us from accessing it. Joy involves an accepting
    stance toward life, a deep connection with that which is life giving, a sense
    of gratitude that arises spontaneously when we realize the abundance that is in
    our lives. Joy comes of its own accord when we are in our naturally healthy state.
    Yet it requires that we be resilient, and there are many forces that sabotage
    our efforts to remain resilient and so block our access to joy. These enemies
    of joy result in:


    - an imbalanced body

    - an unsettled mind

    - a disconnected heart


    All are signs that our resilience is under siege. In each of these categories,
    there are outside forces beyond our personal control, but also things we do to
    ourselves that unwittingly cause us more harm:


    - The imbalanced body is assaulted from the outside by exposure to toxins, food
    additives, radiation, and other harmful forms of energy—and from the inside by
    our own diet and lifestyle choices.

    - The unsettled mind is accosted from the outside by stresses such as emotional
    or physical trauma, the weight of others’ expectations, disturbing images or news
    items, financial uncertainty, or personal loss—and from the inside by the attachments
    of our own minds.

