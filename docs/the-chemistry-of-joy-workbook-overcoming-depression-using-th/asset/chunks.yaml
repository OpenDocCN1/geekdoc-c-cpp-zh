- fmt: "\nThe visionary knows who you really are, identifies with your basic goodness,\
    \ and has specific longings just for you. The visionary does not demand perfection\
    \ or compare you to others who are better, smarter, more motivated, or more of\
    \ anything than you are. The visionary is a bridge to your potential. When the\
    \ visionary is engaged, you experience more energy and more endurance. As the\
    \ critic is motivated by fear of who you will be if you don’t get it right, the\
    \ visionary is motivated by love of who you want to be—and are.\n\n## The Vision\
    \ Board: Connecting with Your Visionary\n\nAn excellent way to work with your\
    \ visionary is to create a vision board. Making a vision board is an activity\
    \ that engages your longings, your intuitions, and your spontaneity. Once you’ve\
    \ gathered the necessary materials, it will take you about an hour to create your\
    \ board.\n\n1. The materials you will need include poster board, scissors, glue\
    \ stick or tape, markers, and a stack of magazines with lots of pictures. Set\
    \ these items out around you and think back to the moment you decided to buy this\
    \ workbook. Where were you? What about it called to you? What hopes did it stir\
    \ for you? What hopes do you have now for yourself in going through this workbook?\
    \ Jot them down here.\n\n   ___________\n   ___________\n   ___________\n   ___________\n\
    \n2. Something vital lives under the weariness and discouragement of depression.\
    \ However distant you may sometimes feel from this vitality, it hasn’t left you.\
    \ Access your wish to live from this place and, holding on to this connection\
    \ as much as you can, take a ramble through your magazines. Cut or tear out any\
    \ words or images that capture your attention—no questions asked!\n\n   When you\
    \ have a substantial supply of materials, play with placing them on your poster\
    \ board. Don’t worry about placing them just right; with this project there is\
    \ no wrong.\n\n3. After you’ve completed your own vision board, sit with it, admire\
    \ it, enjoy it. And then begin to harvest its message; write down in a few words\
    \ or sentences what it tells you about your intentions for yourself on this journey.\n\
    \n   Here is an example: The sunlight tells me how much I want to get away from\
    \ the darkness I feel, the balloons suggest buoyancy, the travel pictures tell\
    \ me how much I want to get away from the sameness of my life, and the running\
    \ shoes show me that it’s time to get moving!\n\n   What does your vision board\
    \ tell you about your deepest longings and intentions for yourself on this journey\
    \ to resilience?\n\n   ___________\n   ___________\n   ___________\n   ___________\n\
    \n4. Finally, see if you can crystallize, in a sentence or two, what your intentions\
    \ are for yourself as you go through this workbook. The more you know your intentions,\
    \ the clearer will be your purpose and the sturdier it will be in providing you\
    \ support.\n\n   Sample intention statements: `I am going to learn how to support\
    \ and increase my physical energy. I want to experience more support in my life.\
    \ I intend to listen less to the critic and more to the visionary.`\n\n   ___________\n\
    \   ___________\n   ___________\n   ___________\n\n## From Vision to Action\n\n\
    The process of moving from vision to action is not linear. If you buy into the\
    \ belief that you can set a goal and never waver from implementing it, the journey\
    \ is likely to fail. It can fail not because you lack the will or have a weak\
    \ character, but because aspects of the human brain make change challenging and\
    \ incremental. Lasting change is almost always a process of movement and activity\
    \ alternating with rest and consolidation.\n\nThere is a strong paradox in the\
    \ change process. You may think it should be easy to make positive, healthy changes\
    \ in your life, yet your own biology can make it difficult. Our brains are wired\
    \ to keep things as they are:\n\n*   Thoughts are strengthened with every repetition.\
    \ This makes it easy to have a thought again and yet again, to the point that\
    \ thoughts can become automatic.\n*   Anything that can be delegated to unconscious\
    \ processes will be. This doesn’t refer just to things like oxygenating your blood\
    \ but also to daily habits. How many times have you driven to work only to realize\
    \ you don’t remember three-quarters of the trip?\n*   Brain activity is altered\
    \ by the perception that you are under threat. Change can feel threatening, making\
    \ it harder to think clearly. Attention is more drawn to threat than to possibility.\
    \ Hope about the future takes a backseat to survival.\n\nThe brain’s very structure\
    \ supports its tendency to conserve the old. Conscious change is difficult because\
    \ the brain is wired to preserve things as they are, including our thinking and\
    \ feeling habits. And yet the human brain is full of innovation. Throughout this\
    \ workbook we will give you strategies to work with this tendency more skillfully.\n\
    \n***\n\n## The 51 Percent Solution\n\nWhen you bump up against the tendency to\
    \ stay in old ruts, you experience what is known as “resistance.” You might think\
    \ that some part of you is willfully sabotaging your desire to change. We prefer\
    \ to refer to this as “habit energy.” This reminds us that doing the same thing\
    \ over and over again is inherently reinforcing. Sometimes people say such things\
    \ as, “I must be getting something out of it or I wouldn’t keep doing it.” In\
    \ these words they hear the voice of the critic. The visionary might be more inclined\
    \ to say, “I know that I am capable of change, but let’s take a realistic look\
    \ at what it might take.” The visionary will talk to you about the `51 Percent\
    \ Solution`.\n\nThe `51 Percent Solution` says that if you do something more often\
    \ than not, change will follow. You will have some days when you feel 100 percent\
    \ on board and others when you want to snuggle into the past. As long as, 51 percent\
    \ of the time, you take the new step, you will get to your destination. The conservative\
    \ tendency of the brain then becomes your ally because each time you practice\
    \ the new habit, you strengthen the neural pathways that support it. Over time,\
    \ 51 percent becomes 60, 70, 80 percent…and you have created a new normal.\n\n\
    ***\n\n## Predicting the Pitfalls\n\nWhat are some of the thinking and feeling\
    \ habits that inhibit change? We’d like to explore with you a number of “failure\
    \ paths” we have identified. Engaging in these mental, emotional, and social behaviors\
    \ more than 50 percent of the time will lead your change path to a dead end. Do\
    \ you recognize any of them? We offer some alternative thoughts, feelings, and\
    \ actions, in case one of your failure paths has turned into such a deep rut that\
    \ you can’t see other choices.\n\nThe critic will try to shame you for every place\
    \ you see yourself in the above failure paths. Listen instead to the visionary,\
    \ who says, “Although it looks like there is a dividing line between the failure\
    \ paths and the success factors, that line is actually a bridge.”\n\nConnecting\
    \ with your visionary, fill out the following table. Use the failure paths in\
    \ the table above or add your own.\n\n## Supporting Your Changing Self\n\nHow\
    \ can you nourish your best intentions while also being mindful of the power of\
    \ resistance? An old Cherokee story can illuminate this question.\n"
