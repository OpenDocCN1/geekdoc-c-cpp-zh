    因为你需要坚实的生理基础来增强大脑韧性，所以第一道关就是通过合理的饮食来照顾身体。如果需要额外的支持，可以添加营养补充剂，我们将在下一章中描述。当需要更强支持时（例如在抑郁症症状严重的情况下），可能需要药物治疗。无论我们其他做什么，都必须记住：营养充足的身体为愉悦的心情提供了生理基础。


    有五种常见的饮食障碍可能会加剧抑郁症或阻碍康复：


    *   低质量饮食

    *   血糖与胰岛素失衡

    *   消化功能异常

    *   过度炎症

    *   食物过敏和不耐受


    接下来的章节将引导你克服这些潜在的韧性障碍。你将看到每种障碍的描述、它对情绪的影响，以及帮助你判断这些情况是否发生在你身上的评估方法。如果是的话，不要担心——大脑具有惊人的韧性，我们将为你提供经过验证的策略来消除这些通往愈的障碍。


    ## 障碍一：低质量饮食


    即使在最健康的美国饮食中，仍有改进空间。这是因为标准的美国饮食（SAD）遗憾地缺乏营养。以下只是几个例子：


    *   许多美国人听从了低脂饮食的号召，却没有大脑需要大量的健康脂肪才能良好运作。通常这些脂肪热量会被糖或精制碳水化合物取代，这会对情绪产生进一步的负面影响。

    *   另一些人摄入过量的脂肪，但没有足够的大脑健康 omega-3 脂肪。这在今天很难做到，因为广泛供应的谷物和动物产品产生的 omega-3 脂肪远低于我们祖先所食的食物。

    *   耕作实践侵蚀了许多地区的土壤，流失了重要的微量元素。你可能认为自己正在吃健康食物，但它们可能缺少产生神经递质所需的关键成分。

    *   许多食物含有化学物质（包括化肥、农药、激素以及人工色素或调味剂），这些物质向身体发送有害信息，破坏正常的细胞通信和功能。

    *   大自然以全食物的形式设计了一种精妙的营养包装。精炼和加工这些食物会移除大脑所需的许多核心营养。例如，当全麦经过加工时，它会失去约 75% 的维生素和矿物质，以及
    95% 的纤维和脂肪酸！


    讽刺的是，在一个大多数人都有充足食物吃的国家，对我们许多人来说，的大脑正处于所需营养的饥饿状态。要了解你的饮食为健康大脑提供了什么类型的信息，请进行这项简短评估。


    ### 练习：评估你的饮食


    圈出最合适的答案。完成 A 部分后，继续 B 部分。然后相加你的数字，以了解你饮食的评分情况。


    *   0—从未

    *   1—罕见（几乎从不）

    *   2—偶尔（有时）

    *   3—经常（大部分时间）

    *   4—总是


    #### A 部分


    ![正在评估你的饮食，A 部分](img/fig3.1.jpg)


    选择最合适的数字


    ![每周绿蔬菜的份数，等](img/fig3.2.jpg)


    相加 A 部分的总和。


    总计 ___________


    #### B 部分


    ![我每天喝三杯或更多含咖啡因的咖啡等](img/fig3.3.jpg)


    选择最合适的数字


    ![每日汽水/可乐的份数，等](img/fig3.4.jpg)


    相加 B 部分的数字。


    总计 ___________


    A 部分识别了食物为你的身体提供的积极信息。A 部分的总和越高，你的身体运作得越好。


    B 部分突出了你饮食中可能产生负面影响、阻碍大脑正常功能的部分。B 部分的总和越高，你给身体以及情绪带来的压力就越大。


    ### 改善饮食的策略


    增加 A 部分的数字并减少 B 部分的数字对你的健康和情绪都有好处，这似乎显而易见。我们大多数人知道哪些食物是健康的。但在知道和做到之间存在差距，部分是因为关于饮食有太多困惑和冲突的信息。


    吃得好比看起来要简单。如果你消化良好并吃天然、未加工的食物，你就会获得滋养身体大脑所需的信息。以下列表将帮助简化你的食物选择。


    #### 应包含的食物


    *   新鲜植物食物，包括水果蔬菜（每天 5 到 13 份）

    *   全谷物、高纤维食物，如糙米、野生米、荞麦、大麦、藜、全麦和燕麦

    *   鸡肉，可用时的草饲红肉瘦肉

    *   肥性鱼类——尤其是三文鱼、沙丁鱼、鳟鱼和金枪鱼

    *   乳制品——适量的黄油和奶酪

    *   橄榄油、亚麻籽和油果

    *   豆类——特别是豆、扁豆、白豆、黑豆、鹰豆

    *   坚果，如核桃、杏仁、碧桃和巴西果

    *   新鲜和干香草


    #### 应减少或避免的食物


    *   高精制糖食物，如糖果、汽水、糕点

    *   加工食品和精制产品，如白面包、速食土豆和薯片

    *   反式脂肪酸如部分氢化油

    *   Omega-6 脂肪酸油，如玉米油、葵花油和大豆油

    *   动物脂肪中的饱和脂肪

    *   玉米糖和高果玉米糖

    *   含有人工甜味剂和人工色素或调味剂的食物

    *   人工防腐剂，如 MSG 和 BHT


    ## 障碍二：血糖–胰岛素失衡


    碳水化合物是被分解为葡萄糖分子的食物，称为血糖。`简单碳水化合物`释放非常快，而`复合碳水化合物`释放得较慢。在这种情况下，慢是好事；身体更容易处理稳定的血糖供应。


    身体的每个细胞都有自己的能量工厂，而葡萄糖是用于产生能量的燃料。但细胞必须以某种方式将葡萄糖从血液移到细胞膜内。那是胰腺及其激素胰岛素的工作。


    胰岛素旅行到细胞外并“停”在胰岛素受体位上。在那里，胰岛素像一辆将葡萄糖运入细胞的运输车。因为这个过程非常重要，身体努力维持血糖和胰岛素之间的平衡。


    当葡萄糖进入血液过快时，这种平衡会被打破——例如在`暴食糖分`之后。对这种糖冲击的反应是胰腺分泌过量的胰岛素，迅速将葡萄糖从血液中取出并进入细胞。现在你面临两个问题：血糖迅速下降，大量的胰岛素运输车在循环。关键的糖-胰岛素平衡被破坏，导致大脑发出压力信号：“要更多糖——现在！”这就像任何内部紧急情况所做的：触发警报并升高压力激素水平。


    ![胰岛素飙升/血糖下降循环](img/fig3.5.jpg)


    ### 胰岛素抵抗


    如果这种过糖–过量胰岛素的失衡模式持续，胰岛素受体位最终开始关闭，葡萄糖无法进入细胞。这是一个长期问题，被称为胰岛素抵抗。


    胰岛素抵抗对情绪的影响比大多数人意识到的要大得多。当它存在时，大脑无法有效产生多巴胺（一种让人感觉良好的大脑化学物质）。由于进入细胞非常困难，细胞无法产生足够的能量，使你感到疲软无力。


