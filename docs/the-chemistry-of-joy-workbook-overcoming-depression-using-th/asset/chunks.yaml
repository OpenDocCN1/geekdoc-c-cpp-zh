    # *I went along like this, but in a few minutes something had changed. People
    began to notice me and look over at me. Soon, more and more of the passersby were
    smiling—at me! As I continued, my heart opened further, and I felt lighter myself.*


    For about an hour after that, it felt like everything was just as it should be,
    that everything was going to be all right. I felt like I belonged, like I could
    go up to anyone and I would be accepted, just as I am. I know an hour doesn’t
    seem like much, but it filled me with hope. It reminded me of what life could
    be like. And the really great thing is that I was present for it. I was really
    there, so I could enjoy it. I would even say I felt joyful. So now the experience
    is etched in my mind. It tells me that joy is really possible—even for me!


    Throughout all the pathways to joy, we have been encouraging you to discover for
    yourself what obstacles might prevent you from accessing your own experience of
    joy. You have looked at all the body pathways that must be addressed, yet are
    not usually sufficient by themselves to open to joy. You have worked with the
    mind pathways, seeking to awaken more fully to your life in the present moment.
    But what is it you want to awaken into? What kind of world, what kind of life,
    is worth awakening for? Those are questions, we believe, that can only be answered
    by the heart.


    The one thing that you can always do is to be completely present. Be fully present
    to your life as it is, and you will find joy, at least occasionally. You may still
    choose to revisit any of the nine pathways in this workbook to further open your
    access to joy—and when you do, be assured that it will be there. Whenever and
    wherever you do find joy, be sure to notice it, drink it in, and celebrate it.


    ## Summing Up Chapter 11


    * There is within you a larger self, and it is wise to give it your attention.

    * Emerging from depression can be a time of awakening, of coming more fully to
    life.

    * Listening within, you can be guided by what you most long for, by what brings
    authentic joy.


