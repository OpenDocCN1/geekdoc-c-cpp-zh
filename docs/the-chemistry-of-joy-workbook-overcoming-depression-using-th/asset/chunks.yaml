    照顾身体能为你蓬勃成长提供条件。这些路径本身并不能保证快乐或韧性。然而，它们对于一个具有韧性的生活是至关重要的。三条身体路径——滋养、平衡与流动——将帮助你建立坚实的韧性基础，使你旅程的其余部分获得深远的果实。


    # 第一条路径


    ![滋养符号](img/fig1.1.jpg)


    ### 滋养 (nurturing)


    在第一条路径中，我们将探讨身体从食物中获取的信息如何影响其运作。你将识别出任何缺失的成分——或可能失衡的系统——这些因素阻碍了身体的自然自我纠正。问卷将帮助你发现是否有需要处理的身体部位，如果有，我们将提供关于如何做的具体指导。


    # 第二条路径


    ![平衡符号](img/fig1.2.jpg)


    ### 平衡 (balancing)


    只有当大脑化学以最符合你个人需求的方式达到平衡时，健康的情绪才能维持。所谓的“抑郁”并不是一种可以对每个人都用相同方式治疗的问题。这第二条路径帮助你判断自己是否存在特定类型的大脑化学失衡。然后，我们将帮助你制定自己的最佳营养补充计划，以便你那来之不易的自然平衡能够持续下去。


    # 第三条路径


    ![流动符号](img/fig1.3.jpg)


    ### 流动 (flowing)


    这条路径提醒我们，我们是自然界的一部分，与自然保持一致是增强韧性的关键。存在影响情绪的自然周期，包括每日节律、睡眠和季节。然而，我们每个人都有自己独特的生活模式和需求。我们的问卷帮助你发现自己的身心类型，我们提供的信息帮助你设计一个切实且有效的计划，让你顺应自己的本性更自然地流淌。


    ## 心灵路径 (The Mind Pathways)


    我们方法的基础之一是源自 2600 年东方智慧的正念良药。一个正念的生活可以带来平静和快乐的心。通过遵循沉淀、开启和知晓这三条路径，你将帮助心灵变得更加平静，对你的体验开放，并看得更清晰，这样你能够以更大的智慧和从容面对生活中发生的任何事情。


    # 第四条路径


    ![沉淀符号](img/fig1.4.jpg)


    ### 沉淀 (settling)


    未受驯养的心很容易在没有意识或意图的情况下在各种想法之间跳跃。它的活动永不停歇，并且似乎被有害的想法和痛苦的情绪强烈地吸引。好消息是，像像只冲动的小狗一样，心灵可以学会安静，甚至是学会“坐下！”。在第四条路径中，我们为你介绍正念练习的基础，这将使心灵沉淀，身体放松。


    # 第五条路径


    ![开启符号](img/fig1.5.jpg)


    ### 开启 (opening)


    学习充分体验人类情感的完整范围是从抑郁症中恢复以及创造快乐生活的根本部分。在本章中，你可以学习即使面对甚至是痛苦的情绪，也要基于对它们无常性的正念觉察，以及你感受它们而而不被其淹没的能力。你将发现一个真相：情感的觉醒将引导你以更深层发现生活的快乐。


    # 第六条路径


    ![知晓符号](img/fig1.6.jpg)


    ### 知晓 (knowing)


    基于正念，你将对一些最剧痛苦的情感体验获得视角，并学习更有技巧的方式在当下做出反应。这些经历为你提供了发展更大的自我意识和掌控感的机会。你将在章中学习的工具可以极大提高你的幸福感，并帮助预防抑郁症的复发。


    ## 心路径 (The Heart Pathways)


    在每个人的内心世界中，意识之下发生着许多事情。你可以为良好的身体健康奠基础，驯服你狂野的心，并扩展你面对全方位情感的能力。但如果没有与大世界（包括不可见的奥秘）建立联系，你就会失去最深层、最维持生命的能量。你的主根需要深植这一生命之源才能蓬勃生长，这涉及到与内在自我、他人以及精神真理和实践的连接。遵循连接、归属和深化的路径，可以获得这些更深层的来源来滋养韧性并创造持久快乐的条件。


    # 第七条路径


    ![连接符号](img/fig1.7.jpg)


    ### 连接 (connecting)


    抑郁最令人沮丧的方面之一是经常随之来的分离感、孤独和羞耻感。走出这种孤独从对自我真实的接纳和连接开始。


    在第七条路径中，我们挑战“你是孤立且有缺陷”的幻象，引导你走向完整以及与你内在良性的连接。我们提供冥想和练习，旨在修复与自我的断裂，并转化你爱自己和他人的能力。


    # 第八条路径


    ![归属符号](img/fig1.8.jpg)


    ### 归属 (belonging)


    在第八条路径中，我们进一步深入探索连接的治愈力量，并探索创造真正的归属感和社区的可能性。


    转化从内心。我们我们强大的冥想练习，帮助你超越自我，在与他人以及大世界的相互联系中找到快乐。在这些内心工作之后，我们将提供行动建议，帮助你为自己创造一个归属之地。


    # 第九条路径


    ![深化符号](img/fig1.9.jpg)


    ### 深化 (deepening)


    快乐最令人沮丧的敌人之一与你最深层、最真实的自我脱节。最后一条路径概述的深化路径引导你获得一个重回自身内在智慧的机会。我们从深度灵性和我们自己的经验中汲取，使倾听内在的声音变得既易于实现又有意义。


    ## 如何使用本手册


    快乐的路径是整合的，每一条都支持下一条。我们建议你从平衡身体开始，然后沉淀心灵，最后连接心灵。然而，这些路径也是流动的且相互关联的，因此可以用任何最适合你需求的方式进行。你可能会发现某一组路径对你来说特别重要。或者你可能希望重新回到一条你偏离过的路径以加强它。以下是你如何让这个计划属于你自己的示例。


    *克拉尔的故事：关注身体*


    *克拉尔是一位 52 岁的女性，她一生都在经历轻度到中度的抑郁。虽然也有过感到坚强和有韧性的时期，但过去的几个月对她来说格外艰难。她还有一些终身性的健康问题，如偏头痛、频繁的鼻窦炎和皮炎。她对自己感到沮丧，因为她无法控制食欲，而且过去一年体重增加了。她最近发现自己缺乏维生素
    D。她还因为睡眠差而感到疲劳，这让她很难集中注意力。在完成韧性技能问卷后，克拉尔发现，平衡身体对她在计划中的整体成功最重要。*


    *保拉的故事：关注心灵*

