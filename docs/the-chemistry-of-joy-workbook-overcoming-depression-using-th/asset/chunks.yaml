- fmt: "\n“I’ve always been someone who really likes ‘deep’ discussions. I was asking\
    \ about the meaning of life back in junior high. I scoffed at people who got into\
    \ rooting for the football team or decorating for prom. I thought they were frivolous.\
    \ In Minnesota everyone talks about the weather all the time. I refused to join\
    \ in. Again, I thought they were being shallow. I only liked to talk about feelings\
    \ and meaning. I guess it’s no surprise that I became a psychologist. Early in\
    \ my career, I had to move away from the Cities to a small town of eight thousand\
    \ people. Because I worked at a mental health center with other therapists, I\
    \ was able to have the deep talks I loved. But a funny thing happened up there.\
    \ The town is set in the north woods, and almost everyone heated with a wood-burning\
    \ stove. I decided it was a romantic idea, so after a few mishaps, I learned how\
    \ to operate my own stove. This opened up a new world for me—the world of wood.\
    \ I call what happened there learning to ‘talk wood.’ I learned to talk about\
    \ full cords and fireplace cords, mixed hardwoods and the proper length of time\
    \ to season the wood. It turned out to be a nearly universal language and opened\
    \ up so many conversations for me. And, of course, it often led to more personal\
    \ conversations about other topics. I still love to talk wood, and when I burn\
    \ a properly seasoned maple log in the fireplace, its fragrance takes me right\
    \ back to that community and the connections I made there.”\n\n## Reflection Questions\n\
    \nWhat requirements might you be imposing on people before you talk with them?\
    \ ___________\n\nHow do you want them to look or dress? ___________\n\nDo their\
    \ religious and political beliefs have to match yours? ___________\n\nHow open\
    \ are you to other people’s education level and type of employment? ___________\n\
    \nWhat people are you most likely to write off based on first impressions? ___________\n\
    \nWrite about a time when you realized that your initial judgment about someone\
    \ was incorrect. ___________\n\nIf you wanted to, where might you begin to relax\
    \ your requirements? ___________\n\n## ONE-MINUTE COMMUNITIES\n\nClose, lifelong\
    \ friendships and family relationships add depth and richness to our lives, but\
    \ they are not the only opportunities for pleasurable and meaningful connection.\
    \ Friendships that go back to grade school exist at one end of the connection\
    \ spectrum. One-minute communities exist at the other. You can experience a minute\
    \ community…in a minute. They happen in moments like when you are standing in\
    \ a grocery line or commenting about a book to someone else who is browsing in\
    \ a bookstore. They don’t have to be relationships that are going to go somewhere.\
    \ They are already here. Although brief, they can create a connection glow that\
    \ lasts for several hours. They can open your heart.\n\n### Connecting through\
    \ the Heart\n\nBuddhist teacher Pema Chödrön offers a beautiful way to think about\
    \ the human heart. She compares it to a sea anemone. The sea anemone has a hole\
    \ at its top, which is open to receive the food that its ocean home provides.\
    \ However, when the anemone is shocked or startled in some way, it automatically\
    \ closes its opening. This protects the tender creature within the shell, but\
    \ also means that it gets no nourishment despite being immersed in it.\n\nIn the\
    \ same way, the human heart can open to receive nurturing in the form of love\
    \ and connection. And it can shut down instinctively in response to a threat or\
    \ scare. It is particularly vulnerable to shutting down when we experience a hurt\
    \ from another person. Although it is natural to move toward self-protection,\
    \ the human heart that is habitually shut down can forget to open up again. The\
    \ following practice encourages you to remember to open.\n\n### Heart-Opening\
    \ Meditation\n\n*   Whether your heart feels wide open or long closed off, it\
    \ is possible to invite openness into it.\n*   Begin by sitting quietly in a position\
    \ that supports alertness and allows ease…focus on the rhythmic inhaling and exhaling\
    \ of your breathing.\n*   After a few moments, invite your mind to quiet and your\
    \ breath to deepen and slow…gently filling and emptying.\n*   Now place the palm\
    \ of one hand over your heart center—on the chest just over the breastbone…focus\
    \ your awareness on that part of you…does it feel tight and hard like a stone…warm\
    \ and open like a sun-filled window…fluttering like a bird…or some other way?\
    \ However you find it, invite your heart to open just a bit, to warm and soften,\
    \ to relax in the warmth of the breath.\n*   Stay with this practice for a few\
    \ minutes, just directing the breath to the heart center, inviting feelings of\
    \ warmth deep into the heart…perhaps thinking the words, *welcome, you are welcome\
    \ here*.\n*   After a comfortable amount of time, thank yourself for being willing\
    \ to try this experience.\n*   Even if it feels as if nothing is happening, the\
    \ act of directing attention to the heart center is an invitation for it to warm\
    \ and soften, to regain its ability to welcome life in.\n\n## GENEROSITY: THE\
    \ GREAT ANTIDOTE TO ISOLATION\n\nHave you ever experienced the joy of giving or\
    \ receiving just the right thing? Have you felt your heart warm and expand as\
    \ it is touched by the gift? Having been on the giving end and the receiving end,\
    \ have you noticed how similar they feel? According to the Buddha, a generous\
    \ act dissolves the small self. With no thought of reward by the giver and with\
    \ no debt incurred by the receiver, a generous act changes the world from one\
    \ of isolation to one of connection. It is a temporary world, of course, but one\
    \ that can be remembered and savored in lonely times. In the world of generosity,\
    \ your gain is my pleasure, your happiness gives me happiness. In the world of\
    \ generosity, your success doesn’t threaten or diminish mine. It is a world that\
    \ can be called into being by any act of giving.\n\n### Cultivating a Generous\
    \ Heart\n\n*   Sit quietly in a comfortable position as you focus on your breath.\
    \ Allow your mind to settle.\n*   Place your attention on your heart center, noticing\
    \ whatever feeling is there at this moment and accepting it just as it is.\n*\
    \   Bring to mind someone who has recently received some good news. When you have\
    \ created a clear image of this person, muster as much generosity as you can.\n\
    *   Silently offer this person a phrase such as:\n    *   `May your happiness\
    \ grow and be always.`\n    *   `May your success continue.`\n    *   `Your joy\
    \ gives me joy.`\n*   Notice how this feels. If you have any resistance to this,\
    \ just open to it and remember your intention to cultivate a generous heart.\n\
    *   If you’d like, you can call up the image of another person who is experiencing\
    \ some goodness right now and repeat the same phrases to this person.\n*   Be\
    \ generous with yourself if this is difficult, perhaps directing the same phrases\
    \ to your own heart:\n    *   `May my happiness grow and always be with me.`\n\
    \    *   `May my success continue.`\n    *   `May I share in everyone’s joy.`\n\
    *   When you feel finished with this process, bring your awareness back to the\
    \ breath for a minute or two.\n*   Remember these phrases and this intention throughout\
    \ the day, silently offering it to those you encounter.\n\n## LISTENING WITH A\
    \ WIDE-OPEN HEART\n\nOne of the key ingredients to connection is to be able to\
    \ listen deeply to others. The gift of true listening is one of the most generous\
    \ gifts you can offer someone.\n\nThere is a story of a town that had a small-town\
    \ heroes contest. Imagine the surprise of the townspeople when the contest was\
    \ won by a five-year-old boy who had been nominated by his elderly neighbor. When\
    \ he was interviewed for a story for the local newspaper and asked what he had\
    \ done, his reply was short and sweet: “Well, Mr. Larson was sad when Mrs. Larson\
    \ died, so I just sat on his lap and let him cry.”\n"
