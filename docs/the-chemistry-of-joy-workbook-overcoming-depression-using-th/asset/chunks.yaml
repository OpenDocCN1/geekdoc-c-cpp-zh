    *   `Antipsychotic medications` (including `Seroquel`, `Geodon`, `Zyprexa`, and
    `Abilify`) block the effects of dopamine and can reduce agitation and mood swings.
    Since they have potentially serious side effects, such as metabolic and movement
    problems, we suggest that they be used for depression at very low doses for short
    periods of time.

    *   `Mood stabilizers` such as `lamotrigine` (`Lamictal`) or `gabapentin` (`Neurontin`)
    calm brain activity, so they can be used in very low doses for anxiety, or in
    moderate doses for agitation.


    The decision to take medication is best made by you with input from your doctor,
    therapist, and family. Here are a few guidelines that may make medications as
    helpful and problem free as possible.


    ## How Do You Know If You Need Medications?


    Consider taking medications if you have any of the following symptoms:


    *   Severe depression that makes it hard to function in daily life, or is accompanied
    by suicidal or self-destructive thoughts

    *   Moderate depression that has not improved within three to four weeks of trying
    natural therapies

    *   Mild depression that has not improved within six to eight weeks of trying
    natural therapies

    *   A severe sleep disturbance that does not improve with natural therapies

    *   Repeated episodes of depression, especially if they occur without any particular
    trigger or stressor


    ## The Right Medication and How Much to Take


    The following suggestions about medications for each of the subtypes of depression
    are based upon our clinical experience. In general, you should take the lowest
    dose needed to improve symptoms. With mild to moderate depression, try to stay
    within the low-dose ranges as long as possible, preferably for at least three
    to six weeks to give the medications a chance to work. If there is little improvement
    within that time, the dose may need to be increased to the moderate range. With
    severe depression, the dose may need to be increased more quickly.


    Sometimes it is necessary to use higher doses than those listed, but side effects
    then become much more common. The basic supplements (mentioned earlier) may help
    medications remain effective at the lowest possible dose.


    Remember that many people who go on medications just need temporary support and
    can then transition to other means of staying healthy, like those suggested throughout
    this workbook.


    ### Medication Support for Anxious Depression


    ![Table: Medications for Anxious Depression/ Low Daily Dose Range for Anxiety/
    Comments](Images/fig4.7.jpg)


    **KEYS TO RECOVERY FROM ANXIOUS DEPRESSION**


    *   Focus on calming medications (those affecting serotonin or GABA).

    *   Keep doses low if possible. Be patient, allowing plenty of time for lower
    doses to work.

    *   Reducing stresses and improving sleep will lead to quicker recovery.

    *   Try to keep medication use short term (three to nine months) and focus on
    stress reduction.


    ### Medication Support for Agitated Depression


    ![Table: Medications for Agitated Depression/ Low Daily Dose Range for Agitation/
    Comments](Images/fig4.8.jpg)


    **KEYS TO RECOVERY FROM AGITATED DEPRESSION**


    *   Focus on soothing medications (those boosting serotonin or reducing dopamine).

    *   Keep doses as low as possible, especially at the start. Be very careful that
    agitation or mood swings do not worsen.

    *   Reducing stimulation and improving sleep will lead to quicker recovery.

    *   Try to keep medication use as short as possible, unless mood is clearly more
    stable on medication.


    ### Medication Support for Sluggish Depression


    ![Table: Medications for Sluggish Depression/ Low Daily Dose Range for Lethargy/
    Comments](Images/fig4.9.jpg)


    **KEYS TO RECOVERY FROM SLUGGISH DEPRESSION**


    *   Focus on energizing medications (those affecting norepinephrine or dopamine).

    *   Moderate doses may be needed and are typically well tolerated.

    *   Increasing activity (especially vigorous exercise) and moderating sleep (to
    seven to nine hours) will keep recovery going.

    *   Medications may be needed longer with this type. With seasonal depression,
    you may be able to stop medications during the summer months and resume the next
    fall if needed.


    ## When to Stop Your Medications, and How


    Be sure to follow your doctor’s advice as to when and how to come off medications.
    If you have suffered from severe depression or if it has been recurrent, you may
    need to stay on them longer than the ranges given above.


    It is easiest to get off medications if you have been on them for just a few months.
    Even so, there can be withdrawal symptoms ranging from mild physical problems
    (including dizziness, fatigue, headache, or nausea) to intense psychological symptoms
    (such as feeling even more anxious or depressed than before taking medication).
    Try to choose a time that is optimal for you to go through any such difficulty.
    Most people do best coming off medications in the spring and summer, and when
    life is not overly stressful. If you still develop difficult withdrawal symptoms,
    slow it down and let yourself stabilize before making another dose reduction,
    and always do this with your doctor’s supervision.


    ## Summing Up Chapter 4


    *   Depression comes in different forms, and understanding your own pattern can
    help you choose the most helpful remedies.

    *   You can identify safe and effective natural means to balance your brain chemistry
    and support your mood.

    *   When medications are needed, choose the right medication for your type of
    depression, take the lowest effective dose, and stay on it only as long as necessary.


