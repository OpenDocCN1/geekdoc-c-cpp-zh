    她的情绪在冬天总是会低落，而且在夏天也再无法完全恢复。十二年前她开始服用 `Zoloft`（西唑汀），起初效果非常显著，但随着多年推移，药效逐渐减弱。剂量不断增加，此外增加了一种兴奋剂来增加能量，一种镇静剂来帮助睡眠——但她仍然感到痛苦。她的情绪变得平淡，感觉毫无生气，几乎无法起床开始新的一天。她每晚要睡十到十二小时，却从不感到休息。她知道自己应该运动并吃得更健康，但无法鼓起动力去做其中任何一项。


    Joanne 有有季节性模式的迟缓性抑郁。药物起初有效，但逐渐失效，最后这些药物似乎加剧了她的疲劳、体重增加，甚至是抑郁情绪。随着本章后面讨论的基础性和能量类补充剂重新起作用，她逐渐减少了药量。随着感觉好起来，她开始运动并采用清淡的饮食。到次年春天，她能够完全停药，现在只是在每年冬天服用几个月的低剂量药物。


    ## 你是否存在去甲肾上腺素或多巴胺缺乏？


    请勾选每个描述你目前状况的陈述：


    *   我的情绪平淡或抑郁。

    *   我早晨起床困难，并倾向于睡眠过多。

    *   即使我不暴饮暴食，也容易增加体重。

    *   我的精力很萎靡。

    *   我思维迟钝，经常注意力不集中。

    *   我感到冷漠和被动。

    *   我可能不喜欢感到压力的感觉，但采取行动改变现状的反应很慢。

    *   我对批评或拒绝很敏感，因此倾向于向内收缩。

    *   我有自尊低下的感，这导致我更加退缩。

    *   我倾向于孤立，缺乏支持性的关系。

    *   我对光线变化敏感，冬季睡眠模式发生剧烈变化时会感到异常疲劳。

    *   我的性欲低下，或者曾有过勃起功能障碍。

    *   我的记忆力很差。

    *   对我通常的活动缺乏兴趣，从中获得的乐趣极少。

    *   如果我有任何成瘾，通常涉及尼古丁、咖啡因或兴奋性药物。


    ### 评分


    统计勾选的项目总数。


    *   1–5：轻度多巴胺-去甲肾上腺素缺乏

    *   6–10：中度多巴胺-去甲肾上腺素缺乏

    *   11–15：严重多巴胺-去甲肾上腺素缺乏


    记住，这不是永久性的，仅仅反映了你目前的状态。你可以通过下面的补充剂计划并遵循所有快乐的途径来恢复活力。


    ## 增强迟缓性抑郁能量的自然疗法


    如果你存在去甲肾上腺素-多巴胺缺乏，或者在抑郁时感到迟缓萎靡，请考虑以下补充剂。你可能希望先从 `SAM-e` 开始，它通常是这些补充剂中效果最强的，只有在两到三周内没有改善时再添加其他的。


    **SAM-e**：每天 400-1,600 毫克。早餐和/或午餐前三十分钟服用。`S-腺氨甲硫醚 (SAM-e)` 支持几种关键激素和化学物质的产生，包括血清素、去甲肾上腺素和多巴胺（Williams
    等 2005 年）。研究表明，即使处方抗抑郁药物失效，它也能缓解抑郁（Alpert 等 2004 年）。


    `SAM-e` 起效快且能增强能量，因此要从低剂量（每天 400 毫克）开始，增加频率至少每周一次，且每天不超过 1,600 毫克。如果你每天服用超过 800
    毫克，最好将其分成两次服用（早餐前和午餐前）。


    **已知 SAM-e 会导致双相情感障碍患者发躁症发作，在没有医生监督的情况下不应将其加入药物中。**


    **L-酪氨酸和/或 DL-苯氨酸**：每天 500–1,500 毫克。`酪氨酸`和`苯氨酸`分别是多巴胺和去甲肾上腺素的氨基酸构建块，如果缺乏它们，情绪可能会变得低落（Ruhé,
    Mason and Schene 2007）。作为补充剂服用，这些氨基酸前体可以提升情绪、动力和能量（Lakhan and Vieira 2008）。从每天
    500 毫克开始服用其中一种，必要时每周增加 500 毫克。两者可以结合使用，如果还有血清素缺乏迹象，甚至可以结合 `5-HTP` 使用。它们具有刺激性，因此要留意焦虑、躁动或失眠的问题。


    **如果你有高血压，请小心；这些补充剂会升高血压。**


    **铬**：每天 200–500 微克。`铬`是一种辅助细胞产生能量的矿物质，还能稳定血糖（Albarracin 等 2008 年）。它对迟缓性抑郁可能可能有帮助，特别是当伴有碳水化合物渴望或暴饮暴食时（Davidson
    等 2003 年）。按照列出的剂量使用时，`铬` 被认为是安全的，副作用很少，可能包括轻微头痛或恶心。


    ## 如何明智地使用药物


    自然疗法本身的效果并不总是足以治疗或预防抑郁症。处方类抗抑郁药物远非完美，但它们可能很有帮助，有时甚至能救命。如果你需要药物来帮助恢复，请不要将其视为失败或软弱的表现。它只是在需要时可以使用的另一种选择。


    抗抑郁药物分为两类：`西汀平` (Prozac) 之前和之后。旧的药物（三环类抗抑郁药和单胺氧化酶抑制剂）很少使用，部分原因是它们副作用很多并存在风险。


    1987 年引入的 `西汀平` 改变了抑郁症的治疗。它是第一种选择性血清素再摄取抑制剂 (SSRIs)，该类药物包括其他知名药物，如西唑汀 (Zoloft)、帕西汀
    (Paxil)、西酞普林 (Celexa) 和艾来西普 (Lexapro)。由于它们通过血清素系统起作用，SSRIs` 对焦虑性抑郁最有帮助，也可用于迟缓性抑郁。它们被认为更安全更容易耐受，比旧药物常用得多。但它们并非没有问题。


    再摄取抑制是指在血清素释放到神经细胞间隙后，这些药物阻止其重新摄回到可以储存和使用的神经元。这让血清素分子留在突触中，继续其与其他神经元交流的工作。但请记住，血清素并没有比以前多，只是感觉是如此。由于
    `SSRIs 阻止了血清素的回收，如果你不小心，会导致血清素进一步枯竭。这就是为什么我们如此强调运动、饮食和营养补充剂；它们能为健康大脑创造持久的。


    另一类抗抑郁药物被称为血清素和去甲肾上腺素再摄取抑制剂 (SNRIs)。由于它们作用于大脑中的两种化学物质，它们既能镇静（特别是低剂量时），又能增强能量（特别是中高剂量时）。`依拉西普
    (Effexor)、辛舒达 (Cymbalta) 和普瑞西 (Pristiq)` 可能是迟缓型抑郁症或任何严重、长期或对其他措施无效的抑郁的良好选择。


    `西布汀 (Wellbutrin)` 是唯一主要通过多巴胺起作用的抗抑郁药物。它通常具有刺激性，对迟缓或冬季抑郁可能有益，但也可能引发焦虑、躁动或失眠，特别是当剂量过高时。


    除了抗抑郁药物外，还有三类药物常用于辅助治疗抑郁：


    *   抗焦虑药物如 `洛拉西平 (Ativan)、阿唑西泮 (Xanax) 和氯硝西平 (Klonopin)` 在缓解焦虑方面有效，但会有镇静作用，且使用几周后会产生依赖。

