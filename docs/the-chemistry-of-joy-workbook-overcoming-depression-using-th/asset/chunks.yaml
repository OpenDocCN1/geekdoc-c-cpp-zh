    # 平静地过一天


    规律的作息至关重要。目标是每天在同一时间起床和睡觉。定时进餐，绝不跳餐。尝试保持工作时间一致且适度。定期休息，理想情况下每隔一小时半到两小时休息一次。偶尔无所事事可能是你对时间最高效的使用。


    记住要定期留出大量时间进行反思和恢复。


    # 针对你的类型明智进食


    食物应该带去温暖、水分和物质，以恢复风元素类型的平衡；考虑“舒适慰藉食物”，包括温暖的汤类和炖菜。尽量减少干燥的食物（饼干、谷物）或未煮的食物（生蔬菜）。保持规律饮食，如果可能的话，午餐是最最丰盛的一顿。慢慢吃，饭后花几分钟放松。全天喝温水。参考下列表指导你的食物选择。


    ## 风元素平衡食物


    - **概述**：适量的蛋白质，富含复合碳水化合物的热食物


    ### 推荐食物


    - **乳制品**：牛奶和奶酪

    - **肉类**：火鸡、鸡肉、海鲜

    - **豆类**：大豆、扁豆、鹰嘴豆（如果你消化功能不好，这些可能会导致气）

    - **坚果和种子**：杏仁和杏仁酱、芝麻籽和芝麻酱、亚麻籽

    - **谷物**：米饭、小麦、燕麦、苋菜、藜麦、全麦面包、热麦片

    - **根茎类蔬菜**：胡萝卜、洋葱、甜根、、萝卜、芜萝卜、红薯、南瓜

    - **熟蔬菜**：芦笋、叶叶蔬菜、豆角、秋葵葵、大蒜

    - **水果**：甜、成熟的水果，如葡萄、瓜、橙子、芒果、浆果、樱桃、枣、无花、菠萝、梅、桃子、香蕉

    - **零食**：坚果或种子、水果、牛奶或酸奶

    - **草本和香料**：茴香、罗勒、豆蔻、肉桂、茴香、姜、甘草、肉豆蔻、百香


    # 顺应身体活动


    你不需要进行剧烈运动来平衡风元素；相反，喜欢任何有节奏的运动，如舞蹈或太极。


    - **理想运动**：步行；目标是每天一次或两次，每次二三十分钟。

    - **亲近自然与他人交流**是加分项。考虑骑自行车、划船、徒足、滑雪或舞蹈。

    - **最佳整体运动**：修复性或柔和瑜伽，或气功。


    ***


    最近的一研究（Mota-Pereira 等人，2011）利用步行来评估中等运动对抗治疗性抑郁（持续至少九个月且对两种不同的抗抑郁药物无效）的影响。干预组的人被要求每天步行三十至四十五分钟，每周五天。该组在所有抑郁指标上都得到了改善，50%的人显著改善，四分之一的人达到完全康复。控制组（未增加运动量）中没有一个成员达到康复。


    这项研究有两个有趣的备注：


    - 在干预组中，用药较多的人产生反应的可能性较小。

    - 如果参与者至少完成了他们预期步行量的 50%，则被视为顺从。根据这些标准，91%的人是顺的。研究人员使用了第 2 章中描述的`51 Percent Solution`！


    ***


    # 妥善地入睡


    风元素类型几乎总是比他们得到的睡眠更多，这可能导致严重的后果（见侧边栏）。保持规律的作息并早睡。留出三十至四十五分钟进行放松的睡前程序，就像明智父母对孩子做那样。调暗灯光，关闭电脑或电视，读一个故事，或洗个热水澡。如果你喜欢，可以喝杯加了少量豆蔻或肉豆蔻的热牛奶。


    睡前避免酒精；它看起来可能让你放松，但会进一步干扰你的睡眠。


    研究人员关注 17 至 24 岁睡眠不足的青少年，发现这是持续性心理压力的一个风险因素。在对近三千名年轻人进行十二至十八个月的跟踪后，他们发现每失去一小时睡眠，心理压力水平就会上升
    5%。睡眠最少的人报告心理压力症状的可能性高出 14%。如果他们已经遭受焦虑之苦，缺乏睡眠往往会导致抑郁。即使他们最初并不焦虑，每晚睡眠于五小时的人患心理压力的几率也增加了三倍（Glozier
    等人，2010）。


    # 回归感官


    对风元素类型来说，最抚慰的身体感觉是触摸，按摩是你感到压力或焦虑时冷静自己的理想方式，也是治疗干燥皮肤的方法。在浴室或淋浴前使用温暖的杏仁油或荷荷油，之后使用温和的保湿霜。你可能想加入几滴镇静精油，如薰衣草或甜橙。你也可以将这些作为香疗。


    声音是风元素类型第二重要的感官。聆听舒缓、柔和的音乐或大自然的声音可以迅速平衡身心。


    # 深呼吸


    当你感到焦虑或睡眠困难时，可以使用以下镇静呼吸技术。


    ***


    ## 平静呼吸


    用鼻子缓慢吸气，数到四拍。用嘴呼气，速度比吸气更快——数到七拍。有些人发现，在呼气时发出可听到的叹息会感到更加平静。


    ***


    尝试瑜伽交替呼吸法，这非常推荐风元素类型使用。呼气时，用大拇指或食指轻轻按住一个鼻孔，迫使从另一个鼻孔呼气。从同一个鼻孔吸气后，换另一侧。持续左右鼻孔交替几分钟，直到你感到重新平衡。


    # 随季节变化


    风元素在秋季和冬季变得干燥、寒冷时会加剧。如果你是风元素类型，你需要保持温暖，并通过浴缸、淋浴、桑拿和蒸汽房保持皮肤湿，并使用润乳。这段时间特别需要遵循之前提到的饮食建议，避免不推荐的食物。当天气寒冷干燥时，你需要特别注意保持运动习惯和日常日程。


    # 采取行动：创建你的冷静工具包


    当你注意到自己变得越来越烦躁时，可以使用以下简单的自我抚养活动。选择几个你喜欢的，以便你可以快速采取行动恢复平衡，并添加到下面的列表中：


    - 在大自然中步行——无论是独自还是和朋友一起。

    - 到户外阳光下放松。

    - 喝杯热饮料（无咖啡因！）。

    - 吃一小手种子和坚果（然后休息几分钟）。

    - 读一本有趣或有励志的书。

    - 看一部轻松有趣的电影。

    - 洗个热水澡或淋浴。

    - 睡二十分钟午觉。

    - 停止所有事情，听你最喜欢的柔和或古典音乐。

    - 做按摩。

    - 去上瑜伽课。

    - 做五到十分钟的平静呼吸或交替呼吸。

    - 留出时间祈祷或冥想。

    - ________

    - ________

    - ________

    - ________

    - ________


    # 重新调整火元素类型


    当火元素失平衡时，可能会表现如下所示：


    ![表格：火元素失衡 - 身体症状，心理/情绪症状](img/fig5.2.jpg)


    这些可能是焦虑抑郁的早期警告。立即开始下面的平衡措施以防止抑郁发生。


    ***


    ## 发现火元素失衡的原因


    勾选每个适用于你的陈述：


    - 我工作很长时间，为了赶期限。

    - 我倾向于过度关注任务。

    - 我运动不足。

    - 我使用咖啡因或尼古丁。

    - 我吃很多热、辛辣或油腻的食物。


