    Have you ever had an experience with someone who was so completely present and
    so fully accepting of you that your shy inner self felt safe enough to come forth
    and be heard? Is this something you have been able to offer to someone else? If
    so, you’ve had an experience of deep listening, of being listened to with an unobstructed
    heart.


    ## Deep Listening Exercise


    Take a moment now to think of a time when you were listened to in this way. Close
    your eyes, allow your mind to settle, and go back in time until your memory lights
    upon a scene when someone listened deeply to you. If you can’t think of any such
    time, just imagine it, knowing that for most of us, these are rare experiences.


    What were the circumstances in your life at the time?


    ___________


    ___________


    ___________


    Who was listening to you, and what was it about them that allowed you to open
    up to them?


    ___________


    ___________


    ___________


    What did it feel like to reveal your self so fully to another?


    ___________


    ___________

    ___________


    What do you think they saw in you that you couldn’t see in yourself?


    Who are the people in your life, now or in the past, who really listen to you?


    ___________


    ___________


    ___________


    It is a great gift to be listened to so deeply. It doesn’t happen often, because
    it requires certain qualities on the part of the listener that seem to be in short
    supply: a calm mind with steady attention, an open heart with nonjudging acceptance,
    a deeply connected presence with compassionate awareness.


    Listening well comes naturally to some, but it can also be practiced. Below are
    some of the skills to practice when you listen to others, or to look for in a
    skilled listener whom you’d like to have in your life.


    ## The Skills of Deep Listening


    Focus all your attention on the speaker. See the other person as whole and innocent,
    doing the best she can at any given moment; she doesn’t need to be “fixed.” You
    don’t need to figure things out for her. Allow the other person to come to her
    own truths, trusting that she has all that she needs within.


    Let the other person speak freely. Just listen, allowing her words to sink into
    you. You don’t need to respond. If you do speak, speak from the heart, saying
    only what is true for `you`. Ask only a few open, honest questions—those that
    encourage the other person to speak more deeply—questions to which you don’t think
    you already know the answers.


    Allow emotions to arise naturally with no need to comfort or try to stop the emotion.
    Feel comfortable with silence and allow for periods in which no words are spoken.
    Hold the other person with openness, compassion, and acceptance.


    These are the very qualities that you have been developing through this workbook,
    and that you can continue to grow into throughout your life. So even if you can’t
    think of a single time when you have been deeply heard, or a single person who
    really listens to you, you can do this for others. In doing so, you are also creating
    the conditions for having more people with these qualities in `your` life.


    ## Summing Up Chapter 10


    *   Connection is a human birthright.

    *   Loneliness is a call to connection.

    *   Healthy connections can alleviate and protect against depression.

    *   No matter where you are starting from, it is possible to enhance feelings
    of belonging.


    ## Chapter 11


    ![Symbol for Deepening](Images/fig1.9.jpg)


    # Deepening: Renew Yourself from Within


    *For humankind, a growing gap between our inner selves and outer selves—an imbalance
    between how we live our lives and how we would like to live them—leaves the spirit
    thirsting for renewal.*


    From *Before Life Hurries By* by Sabra Field and J. Lingelbach


    Kristin had just described how nearly twenty years of depression had seeped into
    every corner of her life—career, hobbies, friendships, loves—and especially into
    her own relationship with her inner self. She paused and reflected for a moment.
    Then tears began streaming down her cheeks as she concluded with a heartrending
    statement: “I am more than this…my life is more than this!”


    To be sure, there was a sense of sadness and loss in her words; yet there was
    also an edge of defiance in her voice. Beneath the surface of her suffering, there
    still resided a core of strength, a well of courage, and an essence of dignity
    that had not been lost.


    Kristin herself seemed to have forgotten that she had these qualities within her.
    She had lost touch with this deeper part of herself. Yet it was clear that while
    she had been hurt, Kristin had not been defeated by depression. She was stating
    an authentic truth when she said, “I am more than this.”


    Kristin gradually emerged from her decades-long depression. She did so by following
    the same pathways that you have been taking to get to this point in the workbook.
    Still, she was left with a strong desire to become a greater version of herself,
    to discover the “more” that her life could become. How could she reclaim the elements
    of herself that she feared were lost? How could she come through on the other
    side of depression with greater clarity and vitality, firmly connected to her
    inner reservoirs of strength, wisdom, and love?


    You, too, have such reservoirs within you, just waiting to be tapped. Since they
    lie beneath the surface, the only way to discover and align with them is to go
    within. This is the pursuit of a lifetime, of course, and every spiritual tradition
    offers depth practices to encourage such inner growth. In this chapter we will
    offer you guidance on how to begin this deeply personal inward journey as you,
    too, emerge from depression.


    ## Befriending Your Deeper Self


    The deeper self within each of us goes by various names, such as true self, higher
    self, authentic self, inner voice, or simply soul. Disconnection from this vital
    part of you can be one of the most profoundly aspects of depression. It is as
    if you have lost your connection with your very essence. Yet this connection can
    never be lost—at least not permanently.


    This deep inner self, as we understand it, is constantly seeking connection. It
    is prodding us to be fully engaged in our lives, to know and accept both the highest
    and lowest aspects of ourselves, to create authentic relationships with others,
    to be embedded in community, to have meaningful work, to know what is truly important,
    to be present to that we love, to move toward that we long for, to experience
    the sacred.


    It is wise to learn how to listen to this inner voice. The following exercise
    provides guidance on how to have a conversation with your deeper self. It is something
    you can do once or any time the need arises as a regular way of staying aligned
    with your deeper needs and desires.


    If this feels unfamiliar or scary, or if you wonder, `What I find in there?` remember
    the fundamental principle that has been a thread throughout this workbook: `there
    is more right with you than wrong with you.` You need not be afraid of what you
    will find in your inner landscape.


    ### Listening to the Voice Within


    We need to approach this inner voice quietly and with patience, and invite rather
    than summon its appearance. The fundamental requirement is simply this: `attention`.
    The following exercise is one way to give attention to your deeper self.


    ### Listening to Your Inner Self


    *   Set aside enough time to do a personal reflection (at least twenty to forty
    minutes). Choose a time of day when you naturally feel drawn inward and also have
    good energy and focus

