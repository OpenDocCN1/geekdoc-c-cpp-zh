    # 流动：


    ### 顺应自然的节奏生活


    *只有在与生命流的深层本能融合中，才能找到最大的快乐。*


    ——伯特兰·罗塞尔 (Bertrand Russell)


    “我最近一直很焦虑易怒。有些不对劲，但我找不到具体原因。这感觉不不像我。”


    莎拉（Sarah）描述的是我们所有人都会遇到的经历。在早期，这可能仅仅是轻微的失衡，很容易纠正。但如果持续下去，这种失衡可能会导致上一章描述的抑郁症亚型之一。


    如果可能的话，最好在抑郁症发生之前通过平衡并感觉像*你自己*来预防它。这包括了解并接受自己的本性，并创造一种促进这种本性的生活方式。为了实现这一目标，本章将帮助你完成：


    *   识别你的自然身体类型。

    *   学会识别身心失衡的早期迹象。

    *   识别简单有效的措施来恢复平衡并长期维持这种平衡。


    ## 了解你自己：发现你的自然身体类型


    关于基本的生活方式措施存在许多矛盾的建议，让人很难知道什么对你最好。例如，我们都需要良好的睡眠，但你怎么知道你的身体需要多少睡眠才能处于最佳运行状态？吃健康自然的饮食会帮助每个人感觉更好。但同一种饮食适用于所有人真的合理吗？


    接下来的问卷将帮助你发现你的`自然`状态，即你一生大部分时间所拥有的生理心理倾向。了解这些将帮助你做出最好的饮食和生活方式选择。


    对于每个问题，请标记最符合你`常态`（即你生命中大部分时间的样子）的答案。如果多个答案似乎都适用，请标记两个或三个。为了更准确，你可能想请一位认识你很久的人来帮助填写你的答案。


    1. 我的自然体质类型是：


