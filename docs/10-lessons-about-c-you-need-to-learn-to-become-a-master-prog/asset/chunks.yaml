    #### Step 3: Derive a class from CEdit


    We create a derived instance of the CEdit class to satisfy a number of requirements:
    it needs to send the LVN_ENDLABELEDIT message and self-destruct upon completion
    of editing; expand a little to accommodate the text; and also terminate upon pressing
    the Escape or Enter keys or when the edit control loses focus.


    class CInPlaceEdit : public CEdit


    {


    public:


    CInPlaceEdit(int iItem, int iSubItem, CString sInitText);


    // ClassWizard generated virtual function overrides


    //{{AFX_VIRTUAL(CInPlaceEdit)


    public: virtual BOOL PreTranslateMessage(MSG* pMsg);


    //}}AFX_VIRTUAL


    public: virtual ~CInPlaceEdit();


    // Generated message map functions


    protected:


    //{{AFX_MSG(CInPlaceEdit)


    afx_msg void OnKillFocus(CWnd* pNewWnd);


    afx_msg void OnNcDestroy();


    afx_msg void OnChar(UINT nChar, UINT nRepCnt, UINT nFlags);


    afx_msg int OnCreate(LPCREATESTRUCT lpCreateStruct);


    //}}AFX_MSG


    DECLARE_MESSAGE_MAP()


    private:


    int m_iItem;


    int m_iSubItem;


    CString m_sInitText;


    BOOL m_bESC;


    };


    The derived CEdit control, CInPlaceEdit, is described as follows. The overridden
    PreTranslateMessage() determines whether certain key strokes make it to the edit
    control. OnKillFocus() sends the LVN_ENDLABELEDIT notification and destroys the
    edit control. The notification is sent to the parent of the list view control
    and not to the list view control itself. When sending the notification, the m_bESC
    member variable is used to determine whether to send a NULL string. OnNcDestroy()
    is the appropriate place to destroy the C++ object. The OnChar() function terminates
    editing if the Escape or the Enter key is pressed.


    Otherwise for any other character, it lets the base class function take care of
    it before it tries to determine if the control needs to be resized. The function
    gets the extent of the new string and then compares it to the dimension of the
    edit control. If the string is too long to fit within the edit control, it resizes
    the edit control after checking if there is sufficient space for it to expand.


    OnCreate() creates the edit control, initialising it with the proper values.


    Full code listing of the CInPlaceEdit control:


    CInPlaceEdit::CInPlaceEdit(int iItem, int iSubItem, CString sInitText):m_sInitText(
    sInitText )


    {


    m_iItem = iItem;


    m_iSubItem = iSubItem;


    m_bESC = FALSE;


    }


    CInPlaceEdit::~CInPlaceEdit(){}


    BEGIN_MESSAGE_MAP(CInPlaceEdit, CEdit)


    //{{AFX_MSG_MAP(CInPlaceEdit)


    ON_WM_KILLFOCUS()


    ON_WM_NCDESTROY()


    ON_WM_CHAR()


    ON_WM_CREATE()


    //}}AFX_MSG_MAP


    END_MESSAGE_MAP()


    //CInPlaceEdit message handlers


    // Translate window messages before they are dispatched to the TranslateMessage
    and DispatchMessage Windows functions.


    BOOL CInPlaceEdit::PreTranslateMessage(MSG* pMsg)


    {


    if( pMsg->message == WM_KEYDOWN )


    {


    if(pMsg->wParam == VK_RETURN ||


    pMsg->wParam == VK_DELETE ||


    pMsg->wParam == VK_ESCAPE ||


    GetKeyState( VK_CONTROL ) )


    {


    ::TranslateMessage(pMsg);


    ::DispatchMessage(pMsg);


    return TRUE;


    // DO NOT process further


    }


    }


    return CEdit::PreTranslateMessage(pMsg);


    }


    // Called immediately before losing the input focus


    void CInPlaceEdit::OnKillFocus(CWnd* pNewWnd)


    {


    CEdit::OnKillFocus(pNewWnd);


    CString str;


    GetWindowText(str);


    DestroyWindow();


    }


    // Called when nonclient area is being destroyed


    void CInPlaceEdit::OnNcDestroy()


    {


    CEdit::OnNcDestroy();


    delete this;


    }


    // Called for nonsystem character keystrokes


    void CInPlaceEdit::OnChar(UINT nChar, UINT nRepCnt, UINT nFlags)


    {


    if( nChar == VK_ESCAPE || nChar == VK_RETURN)


    {


    if( nChar == VK_ESCAPE )


    {


    m_bESC = TRUE;


    }


    GetParent()->SetFocus();


    return;


    }


    CEdit::OnChar(nChar, nRepCnt, nFlags);


    // Resize edit control if needed


    CString str;


    GetWindowText( str );


    CWindowDC dc(this);


    CFont *pFont = GetParent()->GetFont();


    CFont *pFontDC = dc.SelectObject( pFont );


    CSize size = dc.GetTextExtent( str );


    dc.SelectObject( pFontDC );


    size.cx += 5;


    // Get the client rectangle


    CRect rect, parentrect;


    GetClientRect( &rect );


    GetParent()->GetClientRect( &parentrect );


    // Transform rectangle to parent coordinates


    ClientToScreen( &rect );


    GetParent()->ScreenToClient( &rect );


    // Check whether control needs resizing and if sufficient space to grow


    if( size.cx > rect.Width() )


    {


    if( size.cx + rect.left < parentrect.right )


    {


    rect.right = rect.left + size.cx;


    }


    else


    {


    rect.right = parentrect.right;


    }


    MoveWindow( &rect );


    }


    // Construct list control item data


    LV_DISPINFO dispinfo;


    dispinfo.hdr.hwndFrom = GetParent()->m_hWnd;


    dispinfo.hdr.idFrom = GetDlgCtrlID();


    dispinfo.hdr.code = LVN_ENDLABELEDIT;


    dispinfo.item.mask = LVIF_TEXT;


    dispinfo.item.iItem = m_iItem;


    dispinfo.item.iSubItem = m_iSubItem;


    dispinfo.item.pszText = m_bESC ? NULL : LPTSTR((LPCTSTR)str);


    dispinfo.item.cchTextMax = str.GetLength();


    // Send this Notification to parent of ListView ctrl


    CWnd* pWndViewAttachmentsDlg = GetParent()->GetParent();


    if ( pWndViewAttachmentsDlg )


    {


    pWndViewAttachmentsDlg->SendMessage(


    WM_NOTIFY_DESCRIPTION_EDITED,


    GetParent()->GetDlgCtrlID(),


    (LPARAM)&dispinfo );


    }


    }


    // Called when application requests the Windows window be created by calling


    // Create/CreateEx member function.


    int CInPlaceEdit::OnCreate(LPCREATESTRUCT lpCreateStruct)


    {


    if (CEdit::OnCreate(lpCreateStruct) == -1)


    {


    return -1;


    }


    // Set the proper font


    CFont* font = GetParent()->GetFont();


    SetFont( font );


    SetWindowText( m_sInitText );


    SetFocus();


    SetSel( 0, -1 );


    return 0;


    }


