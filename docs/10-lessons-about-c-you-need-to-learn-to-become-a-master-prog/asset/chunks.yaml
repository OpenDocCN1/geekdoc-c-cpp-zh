    your programming productivity and style, allowing your code to be far more reliable
    and reusable.


    Learning C++ is no small task. I hope this ebook has proved to be a practical
    resource that you can actually read, and more importantly, put into practice.'
  toc: []
  trans: '


    当你利用标准模板库 (`STL`) 时，你的生活会变得更简单更高效。关于 `STL` 的最后一课将极大提升你的编程生产力和风格，让你的代码具有更高的可靠性和可重用性。


    学习 `C++` 并不是一项易事。我希望这本电子书已证明是一份实用的资源，你可以真正阅读它，更重要的是能够付诸实践。

