    public:

    Append() : txt("") {}

    void operator() (const Token &x)

    { txt.append( x.txt + " " ); }

    std::string Word() const

    { return txt; }

    };


    int main()

    {

    std::vector<Token> tokens;

    tokens.push_back( Token( "Hello" ) );

    tokens.push_back( Token( "and" ) );

    tokens.push_back( Token( "welcome!" ) );


