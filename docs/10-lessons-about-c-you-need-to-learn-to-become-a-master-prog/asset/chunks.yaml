    std::string stackToken = stack.top();


    stack.pop(); outputQueue.push( stackToken );


    }


    stack.push( token );


    }


    else if ( token == "(" )


    {


    stack.push(token);


    }


    else if ( token == ")" )


    {


    while ( !stack.empty() && stack.top() != "(" )


    {


    outputQueue.push( stack.top() );


    stack.pop();


    }


    if ( !stack.empty() )


    {


    std::string stackToken = stack.top();


    if ( stackToken != "(" )


    success = false;


    }


    else


    {


    return false;


    }


    stack.pop();


    if ( !stack.empty() )


    {


    std::string stackToken = stack.top();


    if ( IsFunction( stackToken ) )


    {


    outputQueue.push( stackToken );


    stack.pop();


    }


    }


    }


    }


    while ( !stack.empty() )


    {


    outputQueue.push( stack.top() );


    stack.pop();


    }


    while ( !outputQueue.empty() ) {


