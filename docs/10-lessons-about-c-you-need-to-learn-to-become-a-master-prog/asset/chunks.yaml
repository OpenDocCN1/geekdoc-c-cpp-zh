    ## 4.4 Kruskal’s Algorithm


    Now let''s look at a simple C++ implementation of Kruskal’s algorithm which is
    used for finding minimal spanning trees in networks. This algorithm employs the
    same Graph structure to model a network, insert and delete edges, and so forth.


    Consider the following 11-node example network showing the network nodes and the
    weight values of the links connecting them:


    ![](images/00116.jpeg)


    This is built using multiple calls to insert as seen here:


    graph.insert( EdgePtr( new Edge( 0, 1, 1.0 ) ) );


    Kruskal’s algorithm works by obtaining a sorted list of the network links and
    then adding each least-cost link to another set while disallowing cycles. The
    complete code is as follows:


    Graph.h


    #include <vector>


    #include <algorithm>


    #include <memory>


    // This code is from "Algorithms in C++, Third Edition,"


    // by Robert Sedgewick, Addison-Wesley, 2002.


    class Edge


    {


    public:


    int v, w;


    double wt;


    Edge(int v = -1, int w = -1, double wt = 0.0) :


    v(v), w(w), wt(wt) { }


    };


    typedef std::shared_ptr<Edge> EdgePtr;


    struct EdgeSort


    {


    bool operator() ( const EdgePtr& ep1, const EdgePtr& ep2 )


    {


    return ep1->wt < ep2->wt;


    }


    };


    template <class Edge>


    class DenseGRAPH


    {


    private:


    int Vcnt, Ecnt;


    bool digraph;


    std::vector <std::vector<EdgePtr>> adj;


    public:


    DenseGRAPH(int V, bool digraph = false) :


    adj(V),


    Vcnt(V),


    Ecnt(0),


    digraph(digraph)


    {


    for ( int i = 0; i < V; i++ ) adj[i].resize( V );


    }


    int V() const { return Vcnt; }


    int E() const { return Ecnt; }


    bool directed() const { return digraph; }


    void insert( EdgePtr e )


    {


    int v = e->v;


    int w = e->w;


    if (adj[v][w] == 0) Ecnt++;


    adj[v][w] = e;


    if (!digraph) adj[w][v] = e;


    }


    void remove(EdgePtr e)


    {


    int v = e->v;


    int w = e->w;


    if (adj[v][w] != 0)


    Ecnt--;


    adj[v][w] = 0;


    if (!digraph) adj[w][v] = 0;


    }


    EdgePtr edge(int v, int w) const


    { return adj[v][w]; }


    // Get the weighted edges


    void edges( std::vector<EdgePtr>& edges )


    {


    for( int u = 0; u < V(); ++u )


    {


    DenseGRAPH<Edge>::adjIterator A(*this, u);


    for ( EdgePtr e = A.beg(); !A.end(); e = A.nxt() )


    {


    if ( NULL != e )


    {


    edges.push_back( e );


    }


    }


    }


    }


    class adjIterator;


    friend class adjIterator;


    };


    template <class Edge>


    class DenseGRAPH<Edge>::adjIterator


    {


    private:


    const DenseGRAPH &G;


    int i, v;


    public:


    adjIterator(const DenseGRAPH<Edge> &G, int v) :


    G(G),


    v(v),


    i(0) {}


    EdgePtr beg() { i = -1; return nxt(); }


    EdgePtr nxt()


    {


    for (i++; i < G.V(); i++)


    if (G.edge(v, i))


    return G.adj[v][i];


    return 0;


    }


    bool end() const { return i >= G.V(); }


    };


    Main.cpp


    #include "Graph.h"


    #include <iostream>


    // A structure to represent a subset for union-find


    struct subset


    {


    int parent;


    int rank;


    };


    typedef subset Subset;


    // A utility function to find set of an element i


    // (uses path compression technique)


    int Find( Subset subsets[], int i )


    {


    // find root and make root as parent of i (path compression)


    if (subsets[i].parent != i)


    subsets[i].parent = Find(subsets, subsets[i].parent);


    return subsets[i].parent;


    }


    // A function that does union of two sets of x and y by rank


    void Union( Subset subsets[], int x, int y )


    {


    int xroot = Find( subsets, x );


    int yroot = Find( subsets, y );


    // Attach smaller rank tree under root of high rank tree


    // (Union by Rank)


    if ( subsets[xroot].rank < subsets[yroot].rank )


    {


    subsets[xroot].parent = yroot;


    }


    else if (subsets[xroot].rank > subsets[yroot].rank)


    {


    subsets[yroot].parent = xroot;


    }


    else


    {


    // If ranks are same, then make one as root and increment


    // its rank by one


    subsets[yroot].parent = xroot;


    subsets[xroot].rank++;


    }


    }


    // The main function to construct MST using Kruskal''s algorithm


    void KruskalMST( DenseGRAPH<Edge>* graph, std::vector<EdgePtr>& mst )


    {


    const int V = graph->V();


    // Sort edges in non-decreasing order of their weight


    std::vector<EdgePtr> edges;


    graph->edges( edges );


    std::sort(edges.begin(), edges.end(), EdgeSort() );


    // Allocate memory for creating V ssubsets


    std::unique_ptr<subset[]> subsets( new subset[ V ]() );


    // Create V subsets with single elements


    for ( int v = 0; v < V; ++v )


    {


    subsets[v].parent = v;


    subsets[v].rank = 0;


    }


    for ( std::vector<EdgePtr>::iterator it = edges.begin();


    it != edges.end(); ++it )


    {


    EdgePtr edgePtr = *it;


    int x = Find( subsets.get(), edgePtr->v );


    int y = Find( subsets.get(), edgePtr->w );


    // If including this edge does''t cause cycle, include it


    // in result and increment the index of result for next edge


    if ( x != y )


    {


    mst.push_back( edgePtr );


    Union( subsets.get(), x, y );


    }


    }


    }


