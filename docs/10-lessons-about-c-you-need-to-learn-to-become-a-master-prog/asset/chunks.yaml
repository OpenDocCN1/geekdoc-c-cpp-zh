    # Chapter 7: A Genetic Algorithm Function Optimizer


    An example is presented here on how an algorithm employing standard genetic operators
    crossover, mutation and selection can be applied to optimize a standard mathematical
    function, such as the Rosenbrock function:


    ![](images/00121.jpeg)


    The Rosenbrock function is a non-convex function used to test the efficiency and
    effectiveness of optimization algorithms introduced by Howard H. Rosenbrock in
    1960\. The Rosenbrock function is defined by:


    ![](images/00122.jpeg)


    As shown in the diagram, the global minimum lies inside a long, narrow, parabolic
    shaped flat valley. Locating the valley vicinity is fairly straightforward. Converging
    to the global minimum, located at:


    ![](images/00123.jpeg)


    is trickier. This application employs standard genetic operators crossover, mutation
    and selection as applied to chromosome representations of floating-point numbers.
    There are a number of possible ways of representing real numbers using binary
    arrays. In this application, the IEEE 754 standard is one such method, where the
    the floating-point number is represented in 32 bits. Experiments using Gray codes
    are also presented. In short, The first bit represents the sign (0 = plus, 1 =
    minus); the following 8 bits store the biased exponent (bias=127) and the remaining
    23 bits represent the fractional part (mantissa). An in-depth description of how
    these operators work is beyond the scope of this post and there there is a wealth
    of material already available. The code samples given here should be reasonably
    self-explanatory.


    The 32-bit binary encodings are implemented using the Chromosome class as a means
    of housing the binary values and performing other simple get/set tasks amd so
    forth. The Population class maintains a population of Chromosome objects and applies
    the standard genetic operators crossover, mutation and selection on them. It also
    generates an initial arbitrary population of chromosomes with random values and
    has other helper functions with which to convert between binary and decimal representations
    of the binary strings:


    The GeneticAlgorithm class runs the genetic algorithm operators and applies them
    to the population of chromosomes with the intention of progressively improving
    the overall solution fitness.


    ### Running the Genetic Algorithm using IEEE 754 encodings


    I have run a number of simple experiments to see how well the algorithm converges
    over 10,000 iterations. For the first experiment (using the IEEE 754 bit string
    representation for floating-point numbers) the algorithm parameters used were
    as follows:


    encoding_type = 1; // IEEE 754


    crossover_rate = 50;


    mutation_rate = 5;


    population_size = 100;


    tournament_size = population_size / 4;


    I use tournament selection as the preferred ‘survival of the fittest’ mechanism.
    The code has a simple logger enabling you to dump results to a text file. In this
    example I enabled it return the best fitness found so far at every generation.
    A graph showing the best value found at every 10th iteration:


    ![](images/00124.jpeg)￼


    The global minimum for this particular function is 0.0 and in this run the algorithm
    got it down to 0.02\. As you can see, no further reduction takes place for the
    next 800 or so iterations.


    Feel free to try out this code and improve upon it, or apply it to your own area
    of interest.


    ### Running the Genetic Algorithm using Gray codes


    As a follow up to this experiment, I have included an additional means of interpreting
    the binary chromosomes presented to the genetic algorithm. For the next experiment
    I used a Gray encoding, whereby two successive values differ by only one bit.
    For a 32-bit Gray code, I used the first bit as the sign bit, so that a ‘0’ corresponds
    to a plus and a ‘1’ corresponds to a minus.


    For the remaining bits, I extract the decimal value and then divide this by 2^n
    – 1 to get the real number in the interval 0 to 1.


    After doing a some experiments with parameter values I found that a nice combination
    seemed to be:


    encoding_type = 0; // Gray code


    crossover_rate = 70;


    mutation_rate = 5;


    population_size = 100;


    tournament_size = population_size / 4;


    My perception is that the algorithm performance using Gray codes seemed to converge
    somewhat more easily than those of IEEE 754.


    However, this observation is only on the basis of the few simple experiments I
    have done so far. The algorithm in this case managed to get the value of f(x,y)
    down to 0.00538112 (x = 0.932924,y = 0.873316) within the same number of iterations.
    A plot for this run is shown below.


    ![](images/00125.jpeg)


