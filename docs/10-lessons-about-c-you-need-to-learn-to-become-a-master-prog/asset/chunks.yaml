    Double click the `Download` button to automatically generate the event handling
    code when this button is clicked. On clicking the `Download` button, this routine
    will first obtain the FTP location and file path from the edit controls. Then
    it creates a new Internet session object pointer, and if successful it creates
    an FTP object pointer using the FTP location passed to it, which in this example
    is “ftp.funet.fi”.


    Finally it will attempt to download the file by passing the FTP file path location
    and writing the file to the chosen destination, which in this program has been
    hard coded to `C:\Temp`.


    ```cpp

    void CFTPDlg::OnBnClickedDownload()

    {

    CString strFtpLocation, strFilePath;

    m_FtpLocation.GetWindowTextA( strFtpLocation );

    m_FilePath.GetWindowTextA( strFilePath );

    int nPosition = strFilePath.ReverseFind( ''/'' );

    CString strFileName = nPosition == -1 ?

    strFilePath : strFilePath.Mid( nPosition + 1 );

    CString strFtpFilePath = strFtpLocation + "/" + strFilePath;

    CString strDestinationPath = "C:\\temp";

    CInternetSession* pInternetSession = new CInternetSession();

    CFtpConnection* pFTPConnection = NULL;

    if ( NULL == pInternetSession )

    {

    MessageBox( NULL, "Could not establish Internet session", MB_OK );

    }

    pFTPConnection = pInternetSession->GetFtpConnection( strFtpLocation );

    if ( NULL == pFTPConnection )

    {

    MessageBox( NULL, "Could not establish FTP connection", MB_OK );

    }

    Sleep( 5000 );

    BOOL success = pFTPConnection->GetFile(

    strFilePath,

    strDestinationPath + "\\" + strFileName,

    FALSE,

    FILE_ATTRIBUTE_NORMAL,

    FTP_TRANSFER_TYPE_ASCII,

    INTERNET_FLAG_DONT_CACHE );

    if ( TRUE == success )

    {

    m_FtpLocation.SetWindowTextA( strFtpFilePath );

    CString strDownloadMessage = strFileName +

    " successfully downloaded to " +

    strDestinationPath;

    m_StatusText.SetWindowTextA( strDownloadMessage );

    }

    else

    {

    m_StatusText.SetWindowTextA( "Download failed." );

    }

    UpdateData( FALSE );

    pFTPConnection->Close();

    pInternetSession->Close();

    }

    ```


    Running the application accesses the file from the specified FTP site and writes
    it to the chosen destination:


    ![](images/00038.jpeg)


    ## 2.3 Playing Media Files using DirectShow


    DirectShow is a framework consisting of a suite of APIs that can be used by software
    developers for media streaming on Windows platforms. Using DirectShow enables
    you to play or capture audio and video streams or edit media. This section is
    a high-level introduction to using DirectShow that shows you how to play an audio
    or a video file.


    There are some pre-requisites for using DirectShow, however. All applications
    using DirectShow must include the `Dshow.h` header file and link to the static
    library file `strmiids.lib`. These are required for all DirectShow applications:


    ```cpp

    #include <dshow.h>

    #pragma comment(lib,"Strmiids.lib")

    ```


    Given that DirectShow is based on the Component Object Model (COM), some knowledge
    of applying COM client programming is necessary to write a DirectShow application.
    (Should you at some point wish to extend DirectShow to support new formats or
    develop your own custom effects, you would need to write your own components and
    implement them as COM objects.)


    It is necessary to initialize the COM library beforehand, using `CoInitialize()`
    and then checking the result:


    ```cpp

    HRESULT hr = CoInitialize(NULL);

    if (FAILED(hr))

    {

    std::cout << "Could not initialize COM library" << std::endl;

    return;

    }

    ```


    When you are finished using COM you must also uninitialize it using `CoUninitialize()`,
    meaning that all DirectShow function calls take place between `COM` `CoInitialize()`
    and `CoUninitialize()`.


    Define the DirectShow interfaces you will need for this application by building
    the filter graph and then controlling media streaming and media event handling:


    ```cpp

    IGraphBuilder *pGraph = NULL;

    IMediaControl *pControl = NULL;

    IMediaEvent *pEvent = NULL;

    ```


    Call `CoCreateInstance()` to create the Filter Graph Manager. A filter graph in
    processing media is a directed graph whose nodes represent data processing stages
    and whose edges represent uni-directional data flow. The Filter Graph Manager
    also handles synchronization, event notification, and other aspects of the controlling
    the filter graph.


    ```cpp

    hr = CoCreateInstance(

    CLSID_FilterGraph,

    NULL,

    CLSCTX_INPROC_SERVER,

    IID_IGraphBuilder,

    (void **)&pGraph );

    ```


    Once the instance of the Filter Graph Manager is created, the real work starts.
    Use the returned `IGraphBuilder` pointer to query for the `IMediaControl` and
    `IMediaEvent` interfaces:


    ```cpp

    hr = pGraph->QueryInterface(IID_IMediaControl, (void **)&pControl);

    ```


