    # 为动态链接库添加类


    选择 `Project` 菜单 > `Add New Item`，在出现的 `Categories` 格中，在 `Installed Templates`
    的 `Visual C++` 节下选择 `Code`。选择 `Header File (.h)` 并为头文件选择名称，例如 `MathFuncsDll.h`：


    然后按 `Add`。系统将显示一个空文件。粘贴示例代码：


    ```cpp

    // MathFuncsDll.h


    namespace MathFuncs


    {


    class MyMathFuncs

    {


    public:

    // 返回 a + b

    static __declspec(dllexport) double Add(double a, double b);

    // 返回 a - b

    static __declspec(dllexport) double Subtract(double a, double b);

    // 返回 a * b

    static __declspec(dllexport) double Multiply(double a, double b);

    // 返回 a / b

    // 如果 b 为 0，则抛出 DivideByZeroException

    static __declspec(dllexport) double Divide(double a, double b);

    };


    }

    ```


    注意上述方法声明中的 `__declspec(dllexport)` 修饰符。这些修饰符允许 DLL 导出方法，以便其他应用程序可以使用。


    ## 为类创建源代码


    从 `Project` 菜单中选择 `Add New Item`。将显示 `Add New Item` 对话框。从 `Categories` 格中，在 `Visual
    C++` 下选择 `Code`。选择 `C++ File (.cpp)`。为源文件选择名称，例如 `MathFuncsDll.cpp`。


