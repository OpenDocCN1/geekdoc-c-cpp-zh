    \n## 4.2 Implementing Dijkstra’s Algorithm\n\nDijkstra’s algorithm solves the\
    \ shortest path problem for a graph with non-negative edge weights by producing\
    \ a shortest path tree. This algorithm is often used in routing and as a subroutine\
    \ in other graph algorithms such as the k-shortest paths algorithm. We build a\
    \ shortest path tree (SPT) one edge at a time by always taking the next edge that\
    \ gives a shortest path from the source to a vertex not on the SPT. In other words,\
    \ we add vertices to the SPT in order of their distance (through the SPT) to the\
    \ start vertex.\n\nThe original Dijkstra’s algorithm did not use min priority\
    \ queues and was of complexity O(|V|2), where V is the number of vertices. This\
    \ performance was later improved by the use of linked-list representations and\
    \ min priority queues. Edges that connect tree vertices to nontree vertices are\
    \ stored using a priority queue implementation that allows for the updating of\
    \ priorities.\n\nThis implementation initially finds all shortest paths within\
    \ the constructor of the `SPT` template class and uses a priority queue of vertices\
    \ held in order of their distance from the source node. This determines all the\
    \ shortest paths from the source node.\n\nThe queue is initialized with priority\
    \ 0 for the source node and priority infinity for the other nodes. The implementation\
    \ then enters a loop whereby the lowest-priority node from the queue is moved\
    \ to the SPT and relaxed along its incident edges. To relax an edge `v->w` means\
    \ to test whether the best known way to get from `s` to `w` is to go from `s`\
    \ to `v`, and then go from `v` to `w`. If so, we update our data structures.\n\
    \n```cpp\n#include \"Graph.h\"\ntemplate <class Graph, class Edge>\nclass SPT\n\
    {\nprivate:\n  const Graph &G;\n  std::vector<double> wt;\n  std::vector<EdgePtr>\
    \ spt;\npublic:\n  SPT(const Graph& G, int s) :\n    G(G),\n    spt(G.V()),\n\
    \    wt(G.V(), G.V())\n  {\n    PQi<double> pQ(G.V(), wt);\n    for (int v = 0;\
    \ v < G.V(); v++)\n    {\n      pQ.insert(v);\n    }\n    wt[s] = 0.0;\n    pQ.lower(s);\n\
    \    while (!pQ.empty())\n    {\n      int v = pQ.getmin();\n      if ( v != s\
    \ && spt[v] == 0 ) return;\n        typename Graph::adjIterator A(G, v);\n   \
    \   for ( EdgePtr e = A.beg(); !A.end(); e = A.nxt() )\n      {\n        int w\
    \ = e->w;\n        double P = wt[v] + e->wt;\n        if ( P < wt[w] )\n     \
    \   {\n          wt[w] = P;\n          pQ.lower(w);\n          spt[w] = e;\n \
    \       }\n      }\n    }\n  EdgePtr pathR(int v) const\n  {\n    return spt[v];\n\
    \  }\n  double dist(int v) const\n  {\n    return wt[v];\n  }\n};\n```\n\nSuppose\
