    ## 1.2 Creating dialogs programmatically


    Dialog boxes are Windows applications that can display messages and controls while
    allowing user interaction via events such as mouse clicks and key presses. Dialog
    boxes can be created as applications in their own right, or they can be used in
    addition to an existing application. A dialog box is created from a resource file,
    which is recognized as having the .rc extension. This file contains information
    about the dialog box and specifies parameters such as the dialog box size and
    location, its textual caption, and whether it contains controls like buttons,
    edit boxes, and so forth.


    There are two main approaches to defining Microsoft Foundation Class (MFC) dialog
    boxes for User Interface-based applications. Either use the Resource Editor (a
    tool to define the dialog appearance and generate the code associated with the
    dialog) or create (and hence later modify) dialog boxes at run time by using using
    the Win32 API directly.


    The Visual Studio Resource Editor can be used to position dialog components in
    conjunction with the Class Wizard to generate the corresponding C++ control code
    in separate .cpp and .h files. The Resource Editor is very convenient in that
    all dialog box layout information is stored in the resource (.rc) file, and all
    corresponding resource identifiers are stored in the resource.h file. To programmatically
    create a dialog box, use the **DialogBox** function. Its usage is:


    **INT_PTR DialogBox( HINSTANCE hInstance,**


    **LPCTSTR lpTemplate,**


    **HWND hWndParent,**


    **DLGPROC lpDialogFunc );**


    The first argument hInstance is the handle to the application using the dialog
    box. The lpTemplate argument specifies the dialog box template. The hWndParent
    argument is a handle to the parent window that owns the dialog box. The lpDialogFunc
    argument is a pointer to the dialog box procedure, implying the need to define
    a callback procedure whose usage is:


    **INT_PTR CALLBACK DialogProc( HWND hwndDlg,**


    **UINT uMsg,**


    **WPARAM wParam,**


    **LPARAM lParam );**


    To do this in Visual Studio first create a new Win32 application. Specify the
    desired location of your project and enter the project name, say Win32Dialog,
    and then click OK:


    ![](images/00003.jpeg)


    In the Application Wizard that appears make sure you create it as an Empty Project
    before clicking on Finish:


    ![](images/00004.jpeg)


    Now you need to actually create your dialog. Right-click the project folder that
    Visual Studio has created and select Add > Resource: Select Dialog and then select
    New:


    ![](images/00005.jpeg)


    This will generate the resource header and rc file used to define the dialog.
    In the Resource Editor, right-click on the newly created dialog box and select
    Properties. The name of the ID defaults to IDD_DIALOG1. Change this name if you
    wish.


    Then create the main source file by selecting Add > New Item. In the Name edit
    box type the name of the source file, such as main.cpp, and press Add:


    ![](images/00006.jpeg)


    In the main.cpp file, insert the following code:


    **#include <windows.h>**


    **#include "resource.h"**


    **HWND hWnd;**


    **LRESULT CALLBACK DlgProc(HWND hWnd,**


    **UINT Msg,**


    **WPARAM wParam,**


    **LPARAM lParam);**


    **INT WINAPI WinMain( HINSTANCE hInstance,**


    **HINSTANCE hPrevInstance,**


    **LPSTR lpCmdLine,**


    **int nCmdShow )**


    **{**


    **DialogBox( hInstance,**


    **MAKEINTRESOURCE( IDD_DIALOG1 ),**


    **hWnd,**


    **reinterpret_cast<DLGPROC>( DlgProc ) );**


    **return FALSE;**


    **}**


    **LRESULT CALLBACK DlgProc(HWND hWndDlg,**


    **UINT Msg,**


    **WPARAM wParam,**


    **LPARAM lParam)**


    **{**


    **switch(Msg)**


    **{**


    **case WM_INITDIALOG:**


    **return TRUE;**


    **case WM_COMMAND:**


    **switch(wParam)**


    **{**


    **case IDOK:**


    **EndDialog(hWndDlg, 0);**


    **return TRUE;**


    **}**


    **break;**


    **}**


    **return FALSE;**


    }


    This will produce the following dialog when you run the application:


    ![](images/00007.jpeg)


    ## 1.3 Creating Dialog Applications Using the MFC Application Wizard


    Alternatively you can create a Dialog application using the MFC Application Wizard
    in just a few steps. From the File menu select New > Project, and in the Installed
    Templates section of the New Project dialog select the MFC > MFC Application option.
    Give the project a name and select the location of the project folder, then click
    OK:


    ![](images/00008.jpeg)


    In the MFC Application Wizard that appears choose the Dialog option for the Application
    type and click Next:


    ![](images/00009.jpeg)


    Select the particular Main Frame styles you prefer and click Next:


    ![](images/00010.jpeg)


    Finally for our minimalist application we will uncheck any remaining options before
    clicking on Finish:


    ![](images/00011.jpeg)


    The Application Wizard will automatically generate the necessary resource files
    and the application whose user interface is a dialog box, the same as in the previous
    section:


    ![](images/00012.jpeg)


    ## 1.4 Adding Controls to Dialog Boxes: List Control


    To add controls to your dialog, select the control you want from the Toolbox Window
    and drag it to the location on your dialog box. As an example, in the Dialog Application
    you created using the MFC Application Wizard, you want to select the List Control
    and drag this onto your Dialog:


