    ### Creating Custom MFC Controls – an Editable List Control


    Sometimes you may need more than than what the Microsoft Foundation Classes provide.
    The List Control, for example, is great for displaying lists of records in various
    modes. But what if you wish to make individual grid items in the list control
    editable, for example? The answer is to override the MFC class and provide custom
    methods to implement the behaviour you desire. This example describes the steps
    necessary to do just that.


    #### Step 1: Create the MFC Project


    Start by creating a dialog-based application in Visual Studio. Select File > New
    > Project > MFC Application. When the Application Wizard is launched, select Dialog
    based as the Application Type:


