    ## 4.3 Testing for Graph Connectivity


    A frequent requirement for graphs is as an efficient means of determining whether
    it is connected - or not.


    Is it possible a selected pair of nodes to communicate with each other? Or is
    the graph disconnected in some way?


    Using the same Graph class discussed in the previous sections, this program uses
    a depth-first search algorithm to test whether all the graph nodes get visited
    during the recursive search. Here are some examples:


    1\. A disconnected un-directed graph, whereby nodes [3,4] are disconnected from
    nodes [0,1,2], thereby making it impossible for node [0] to communicate with node
    [3]:


    ![](images/00111.jpeg)


    2\. A disconnected directed graph. Node [1] can communicate with nodes [0,2,3]
    but not node [4], since a directed link exists between node [4] to node [0], but
    not node [0] to node [4]:


    ![](images/00112.jpeg)


    3\. A connected un-directed graph. All nodes can communicate with each other:


    ![](images/00113.jpeg)


    4\. A connected directed graph. All nodes can communicate with any other node.
    Though there is no link between nodes [0,3], a path between the two nodes exists
    via nodes [0,1,2,3].


    ![](images/00114.jpeg)


    Now let''s add to our Graph class the following utility functions used to test
    if the graph is strongly connected:


    // A recursive function to print DFS starting from v


    void Graph::DFSUtil(int v, bool visited[])


    {


    // Mark the current node as visited and print it


    visited[v] = true;


    typename Graph::adjIterator A(*this, v);


    for ( EdgePtr e = A.beg(); !A.end(); e = A.nxt() ) {


    int w = e->w == v ? e->v : e->w;


    if ( !visited[ w ] ) DFSUtil( w, visited );


    }


    }


    // Function that returns reverse (or transpose) of this graph


    Graph* Graph::getTranspose()


    {


    Graph<Edge>* g = new Graph<Edge>(Vcnt, digraph);


    for (int v = 0; v < Vcnt; v++)


    {


    typename Graph::adjIterator A(*this, v);


    for ( EdgePtr e = A.beg(); !A.end(); e = A.nxt() ) {


    int w = e->w;


    g->insert( EdgePtr( new Edge( w, v ) ) );


    }


    }


    return g;


    }


