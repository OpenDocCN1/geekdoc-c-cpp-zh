    ## 4.2 Implementing Dijkstra’s Algorithm


    Dijkstra’s algorithm solves the shortest path problem for a graph with non-negative
    edge weights by producing a shortest path tree. This algorithm is often used in
    routing and as a subroutine in other graph algorithms such as the k-shortest paths
    algorithm. We build a shortest path tree (SPT) one edge at a time by always taking
    the next edge that gives a shortest path from the source to a vertex not on the
    SPT. In other words, we add vertices to the SPT in order of their distance (through
    the SPT) to the start vertex.


    The original Dijkstra’s algorithm did not use min priority queues and was of complexity
    O(|V|2), where V is the number of vertices. This performance was later improved
    by the use of linked-list representations and min priority queues. Edges that
    connect tree vertices to nontree vertices are stored using a priority queue implementation
    that allows for the updating of priorities.


    This implementation initially finds all shortest paths within the constructor
    of the SPT template class and uses a priority queue of vertices held in order
    of their distance from the source node. This determines all the shortest paths
    from the source node.


    The queue is initialized with priority 0 for the source node and priority infinity
    for the other nodes. The implementation then enters a loop whereby the lowest-priority
    node from the queue is moved to the SPT and relaxed along its incident edges.
    To relax an edge v->w means to test whether the best known way to get from s to
    w is to go from s to v, and then go from v to w. If so, we update our data structures.


    #include "Graph.h"


    template <class Graph, class Edge>


    class SPT


    {


    private:


    const Graph &G;


    std::vector<double> wt;


    std::vector<EdgePtr> spt;


    public:


    SPT(const Graph& G, int s) :


    G(G),


    spt(G.V()),


    wt(G.V(), G.V())


    {


    PQi<double> pQ(G.V(), wt);


    for (int v = 0; v < G.V(); v++)


    {


    pQ.insert(v);


    }


    wt[s] = 0.0;


    pQ.lower(s);


    while (!pQ.empty())


    {


    int v = pQ.getmin();


    if ( v != s && spt[v] == 0 ) return;


    typename Graph::adjIterator A(G, v);


    for ( EdgePtr e = A.beg(); !A.end(); e = A.nxt() )


    {


    int w = e->w;


    double P = wt[v] + e->wt;


    if ( P < wt[w] )


    {


    wt[w] = P;


    pQ.lower(w);


    spt[w] = e;


    }


    }


    }


    }


    EdgePtr pathR(int v) const


    {


    return spt[v];


    }


    double dist(int v) const


    {


    return wt[v];


    }


    };


