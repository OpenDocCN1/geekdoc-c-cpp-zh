    using the `find` method to look up a single item associated with its `key`, the
    `equal_range` method is more likely to be used to obtain the range of items associated
    with the group and iterate through these:


    ```cpp

    #include <map>

    #include <string>

    #include <algorithm>

    #include <iostream>


    int main()

    {

    typedef std::multimap<std::string, int> ResultsMap;

    typedef std::multimap<std::string, int>::const_iterator ResultsIter;


    ResultsMap rmap;

    rmap.insert( ResultsMap::value_type( "Geography", 87 ) );

    rmap.insert( ResultsMap::value_type( "Physics", 57 ) );

    rmap.insert( ResultsMap::value_type( "Physics", 69 ) );

    rmap.insert( ResultsMap::value_type( "Physics", 45 ) );


    const std::string subject = "Physics";

    const std::pair<ResultsIter, ResultsIter> group =

    rmap.equal_range( subject );


    std::cout << subject << " =>";

    std::for_each( group.first, group.second,


    [](const std::pair<const std::string, int>& gr)

    {

    std::cout << gr.second << " ";

    });


    return 0;

    }

    ```


    ## 10.3 Common STL Algorithms and their Usage


    ### Replacing the traditional for loop


    Besides improved readability, there exist some nice advantages to using `std::for_each`
    in place of the traditional for loop for iterating over sequences. It will allow
    you to write an algorithm on top of the `std::for_each` that will work with any
    iterator and reduces the risk of typo-introduced bugs. Specifically it applies
    a function object (functor) to each element within a range and returns a copy
    of the function object after it has been applied to all of the elements in the
    range. Here is an example of using `std::for_each` to append a set of strings
    contained in a `std::vector` container. This collects each `txt` item stored in
    the in the `std::vector` of `Token` structs, appending them to the `txt` member
    of the `Appender` functor, which has the `Word` member function to return the
    complete concatenated string:


    ```cpp

    #include <iostream>

    #include <string>

    #include <vector>

    #include <algorithm>


    struct Token

    {

    std::string txt;

    Token( std::string s ) : txt( s ) {}

    };


    class Append

    {

    private:

    std::string txt;

    public:

    Append() : txt("") {}

    void operator() (const Token &x)

    { txt.append( x.txt + " " ); }

    std::string Word() const

    { return txt; }

    };


    int main()

    {

    std::vector<Token> tokens;

    tokens.push_back( Token( "Hello" ) );

    tokens.push_back( Token( "and" ) );

    tokens.push_back( Token( "welcome!" ) );


    std::cout << std::for_each(

    tokens.begin(),

    tokens.end(),

    Append() ).Word()

    << std::endl;


    return 0;

    }

    ```


    ### Sorting and searching


    The STL `sort` algorithm operates on a selected range of container elements, arranging
    them into order according to a user-defined predicate. Here is an example of how
    we want to sort the data and output them:


    ```cpp

    #include <iostream>

    #include <ostream>

    #include <vector>

    #include <algorithm>

    #include <memory>


    class Item

    {

    int val;

    public:

    Item( const int& val ) : val( val ) {}

    virtual char* ItemName() = 0;

    int GetVal() { return val; }

    void OutputToStream(std::ostream& os )

    {

    os << ItemName() << val;

    }

    };


    // Derived class - "old"

    class OldItem : public Item

    {

    public:

    OldItem( const int& val ) : Item( val ) {}

    char* ItemName() { return (char*) "Old: }

    };


    // Derived class - "new"

    class NewItem : public Item

    {

    public:

    NewItem( const int& val ) : Item( val ) {}

    char* ItemName() { return (char*) "New: "; }

    };


    // Auto pointer to de-allocate items

    typedef std::unique_ptr<Item> ItemPtr;


    struct Ascending

    {

    bool operator()( const ItemPtr& start, const ItemPtr& end )

    {

    return start->GetVal() < end->GetVal();

    }

    };


    int main()

    {

    std::vector<ItemPtr> itemVector;

    itemVector.push_back( std::make_unique<OldItem>( 43 ) );

    itemVector.push_back( std::make_unique<NewItem>( 34 ) );

    itemVector.push_back( std::make_unique<NewItem>( 44 ) );

    itemVector.push_back( std::make_unique<OldItem>( 33 ) );


    // Sort values in ascending order...

    std::sort(

    itemVector.begin(),

    itemVector.end(),

    Ascending() );


    std::for_each( itemVector.begin(), itemVector.end(), []( ItemPtr& item )

    {

    item->OutputToStream(std::cout );

    });


    return 0;

    }

    ```


    This gives the following output:


    ![](images/0152.jpeg)


    In fact, STL has an ample fund of algorithms to help you locate items stored in
    containers. These can be speedy, typically of order log N for `binary_search`
    or `equal_range`. And containers such as `std::map` are designed to keep the data
    sorted in a self-balancing binary search tree as they are inserted, which allows
    certain performance guarantees when it comes to looking these up.


    ### Copying, Filling, Replacing and Removing Many tasks boil down to being able
    to copy objects around or remove them. Input and output iterators are often a
    necessary means to accomplish this since we need to specify what data we want
    to work with and where to output the result.


    This example copies the elements of a `std::vector` container to a standard output
    where `ostream_iterator` is an adaptor of an output iterator type. The iterator
    operations are defined such that assigning through the iterator prints to standard
    output, with each print followed by a whitespace character:


    ```cpp

    #include <vector>

    #include <algorithm>

    #include <iterator>

    #include <iostream>


    class descending

    {

    public:

    bool operator()( int x, int y ) const

    { return x > y; }

    };


    int main()

    {

    int values[] = { 100, 101, -2, 23, 1010, 44, 55, 3 };

    const size_t size = sizeof( values ) / sizeof( values[ 0 ] );

    std::vector<int> v( values, values + size );


    std::sort( v.begin(), v.end(), descending() );


    std::copy( v.begin(),

    v.end(),

    std::ostream_iterator<int>(std::cout, '' ''));

    }

    ```

