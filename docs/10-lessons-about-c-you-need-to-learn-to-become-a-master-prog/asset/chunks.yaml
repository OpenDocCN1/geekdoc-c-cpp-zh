    ## 10.4 More STL Tips, Tricks and Examples


    ### Set Algorithms


    Here is a practical example: using union and set intersection to calculate the
    Jaccard Index, a means of measuring the similarity and/or diversity of sample
    sets.


    #include <iostream>


    #include <vector>


    #include <algorithm>


    #include <iterator>


    #include <string>


    class Token


    {


    private:


    std::string str;


    public:


    Token() {}


    Token( std::string val ) : str( val ) {}


    std::string Word() const


    { return str; }


    };


    struct Ascending


    {


    bool operator() ( const Token& start, const Token& end )


    {


    return start.Word() < end.Word();


    }


    };


    int main()


    {


    std::string str1[] = { "The", "crazy", "cat", "sat", "on", "the", "mat" };


    std::string str2[] = { "The", "cat", "sat", "on", "the", "red", "mat" };


    std::vector<Token>::iterator tok_intersect, tok_union;


    int size1 = sizeof( str1 ) / sizeof( str1[ 0 ] );


    int size2 = sizeof( str2 ) / sizeof( str2[ 0 ] );


    std::vector<Token> tokens1( str1, str1 + size1 );


    std::vector<Token> tokens2( str2, str2 + size2 );


    std::vector<Token> tokens( size1 + size2 );


    std::sort( tokens1.begin(), tokens1.end(), Ascending() );


    std::sort( tokens2.begin(), tokens2.end(), Ascending() );


    tok_intersect = std::set_intersection(


    tokens1.begin(),


    tokens1.end(),


    tokens2.begin(),


    tokens2.end(),


    tokens.begin(),


    Ascending() );


    int intersect_size = int( tok_intersect - tokens.begin() );


    tok_union = std::set_union (


    tokens1.begin(),


    tokens1.end(),


    tokens2.begin(),


    tokens2.end(),


    tokens.begin(),


    Ascending() );


    int union_size = int( tok_union - tokens.begin() );


    double JaccardIndex = (double) intersect_size / (double) union_size;


    std::cout << "Jaccard Index = "


    << JaccardIndex


    << std::endl;


    return 0;


    }


    ### Tokenizing and splitting strings


    Tokenization is the process of breaking up text into separate items (‘tokens’)
    according to some delimiter, typically a whitespace or other punctuation character.


    This example takes the sample text and inserts each tokenized word into a vector
    array:


    #include <iostream>


    #include <string>


    #include <sstream>


    #include <algorithm>


    #include <iterator>


    #include <vector>


    template<typename T, typename InputIterator>


    void Print( std::ostream& ostr,


    InputIterator itbegin,


    InputIterator itend,


    const std::string& delimiter )


    {


    std::copy( itbegin,


    itend,


    std::ostream_iterator<T>( ostr, delimiter.c_str() ) );


    }


    int main()


    {


    typedef std::vector<std::string>::iterator str_iter;


    std::string txt = "The cat sat on the mat...";


    std::istringstream iss( txt );


    std::vector<std::string> tokens;


    std::copy(


    std::istream_iterator<std::string>(iss),


    std::istream_iterator<std::string>(),


    std::back_inserter<std::vector<std::string>>( tokens ) );


    // Print the vector std::string items


    Print<std::string, str_iter>( std::cout,


    tokens.begin(),


    tokens.end(),


    " " );


    }


    This gives the tokenized output as shown:


    ![](images/00154.jpeg)


    ### Using containers as multi-dimensional arrays


    Now here is an example of how to initialize and set values from a three-dimensional
    array implemented using the std::vector  container. The STL container approach
    has the added benefit that unlike pointers to objects, the memory used in creating
    the array will be automatically removed when going out of scope. Just use standard
    array notation to retrieve array values. For example:


    #include <vector>


    #include <stdlib.h>


    const size_t HEIGHT = 5;


    const size_t WIDTH = 3;


    const size_t DEPTH = 7;


    int main()


    {


    std::vector<std::vector<std::vector<double>>> array3D;


    // Allocate array dimensions by doing the resizing: HEIGHT x WIDTH


    array3D.resize( HEIGHT );


    for ( int i = 0; i < static_cast<int>( HEIGHT ); ++i )


    {


    array3D[ i ].resize( WIDTH );


    for ( int j = 0; j < static_cast<int>( WIDTH ); ++j )


    {


    array3D[ i ][ j ].resize( DEPTH );


    }


    }


    // Initialize with some values


    array3D[ 1 ][ 2 ][ 5 ] = 3.2;


    array3D[ 2 ][ 0 ][ 3 ] = 4.1;


    return 0;


    }


    ### How to sort a std::map


    By definition you cannot sort a std::map container by value, since a std::map
    sorts its elements by key. However we can get around this by dumping std::map
    key-value pairs into a std::vector first, then sorting that std::vector  with
    a less-than functor afterwards. This is illustrated by the following example which
    creates mappings between std::pair  and double pairs. The STL map to create a
    one-to-one mapping between a pair of link node IDs (using a std::pair) and the
    weight value connecting these nodes (using a double):


    std::map<std::pair<int,int>, double> link_map;


    The first step is to physically create the mappings:


    link_map[ std::pair<int,int>(0,1) ] = 1.1;


    link_map[ std::pair<int,int>(1,2) ] = 0.1;


    link_map[ std::pair<int,int>(2,3) ] = 6.2;


    link_map[ std::pair<int,int>(3,4) ] = 3.4;


    link_map[ std::pair<int,int>(4,5) ] = 5.7;


    link_map[ std::pair<int,int>(5,6) ] = 2.2;


    link_map[ std::pair<int,int>(0,8) ] = 1.8;


    Then the std::pair  node IDs and their respective weights are printed as follows.
    Notice that since the  std::pair  is used as the map key, the std::map items are
    automatically sorted according to this, not the weight values:


    0 1 1.1


    0 8 1.8


    1 2 0.1


    2 3 6.2


    3 4 3.4


    4 5 5.7


    5 6 2.2


    Now you need some means of obtaining the mappings so they are sorted according
    to their weights, not their std::pair key values. Since you can''t sort the std::map
    itself, instead use a function to insert these mappings into a std::vector and
    then sort the std::vector  items. This involves an additional functor which defines
    how the items are sorted:


    template<class T>


    struct less_second : std::binary_function<T,T,bool>


    {


    inline bool operator()( const T& lhs, const T& rhs )


    { return lhs.second < rhs.second; }


    };


    // Initialize and sort vector with data_t items from link_map


    std::vector<data_t> sorted_edges()


    {


    std::vector< data_t > vec(link_map.begin(), link_map.end());


    std::sort(vec.begin(), vec.end(), less_second<data_t>());


    return vec;


    }


    Also required is data_t, an additional typedef used to define the mapping:


    typedef std::pair<std::pair<int,int>, double> data_t;


    So that when we print out the vector of  data_t  items, we can see that they are
    sorted according to the second map parameter (double), and not the std::pair representing
    node IDs:


    ![](images/00155.jpeg)


