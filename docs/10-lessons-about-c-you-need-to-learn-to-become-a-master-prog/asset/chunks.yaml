    ### Permanently removing STL container elements


    Like all STL algorithms, remove receives a pair of iterators to identify the range
    of container elements over which it needs to operate, as shown in its declaration:


    template< class ForwardIterator, class T >


    ForwardIterator remove( ForwardIterator first,


    ForwardIterator last,


    const T& value );


    However, remove does not know about the container that holds the iterator elements,
    only the iterators. So remove is not able to go from the iterator to the container
    holding that iterator, and therefore is not physically able to remove elements
    from that container. That remove does not actually remove in the literal sense
    is a source of confusion for many! Try it and see how removeing elements from
    a container does not actually change the total number of elements in that container:


    This gives the following output:


    ![](images/00156.jpeg)


    ### Using STL to generate permutations


    Put simply, given an input string how to we generate all of its possible permutations?
    A string permutation is found by reordering the position of its elements. We know
    that a string of length n will have n! (n factorial) permutations. For example,
    the string “xyz” will have the permutations:


    xyz


    xzy


    yxz


    yzx


    zxy


    zyx


    You can see this with the following code:


    #include <iostream>


    #include <algorithm>


    #include <iterator>


    #include <string.h>


    int main()


    {


    char str[] = "abcd";


    const size_t len = strlen( str );


    do


    {


    std::copy( str,


    str + len,


    std::ostream_iterator<char>( std::cout ) );


    std::cout << std::endl;


    }


    while ( std::next_permutation( str, str + len ) );


    }


    This gives the following output:


    ![](images/00157.jpeg)


    ### Counting the occurrences of words in a text file


    Now here is an example of the power of using STL’s associative arrays as a word
    counter. This code reads the contents of a text file while keeping a running total
    of the number of occurrences of each word. Discounting the code that outputs the
    results and strips out the punctuation characters we do not wish to count uses
    just a few lines of code. This deceptively simple line of code...


    counter[ tok ]++;


    ... is used to look up the counter value for a given word and increment its value.
    It navigates the red-black tree used by the standard map to find the appropriate
    tree node, selects the T portion of the pair <Key,T>**,** and then increments
    it.


    Note that the word counter has a default constructor to set the counter value
    to zero. Without this, the counter is set to some arbitrary value contained in
    the memory when the counter[ tok ]++ line of code is run for the first time. Not
    the zero value we want.


    #include <iostream>


    #include <iomanip>


    #include <fstream>


    #include <algorithm>


    #include <map>


    #include <string>


    #include <vector>


    #include <iterator>


    template <class T>


    struct less_second : std::binary_function<T, T, bool>


    {


    bool operator()( const T& lhs, const T& rhs )


    { return lhs.second.value < rhs.second.value; }


    };


    class WordCounter


    {


    public:


    int value;


    WordCounter() : value( 0 ) {}


    void operator++ (int) { value++; }


    };


    // Remove unwanted characters from a string


    bool filter(char c)


    {


    return isalpha( c ) == 0;


    }


    const std::string path = "Hamlet.txt";


    int main()


    {


    typedef std::pair<std::string, WordCounter > word_mapping;


    std::map<std::string, WordCounter> counter;


    std::ifstream input;


    input.open( path.c_str() );


    if ( !input )


    {


    std::cout << "Error in opening file\n";


    return 0;


    }


    std::string tok;


    while ( true )


    {


    input >> tok;


    // Remove ?, !, etc characters etc from string


    tok.resize( std::remove_if( tok.begin(),


    tok.end(),


    filter ) - tok.begin() );


    if ( tok == "" || tok == "\t" || tok == "\n" )


    continue;


    if ( input )


    {


    counter[ tok ]++;


    }


    else break;


    }


    std::map< std::string, WordCounter,std::less<std::string> >::iterator it;


    // And then sort and display the result:


    std::vector< word_mapping > result( counter.begin(), counter.end() );


    std::sort( result.begin(), result.end(), less_second<word_mapping>() );


    std::for_each( result.begin(), result.end(), []( const word_mapping& wmp )


    {


    std::cout << std::setw (20) << wmp.first << "\t"


    << wmp.second.value << std::endl;


    });


    return 0;


    }


    The console output is shown here:


    ![](images/00158.jpeg)


    # Conclusion


    I generally find programming books dense and difficult to assimilate. Though the
    content may be excellent they are frequently let down through poor presentation
    and excessive wordiness. The likelihood of successfully working through a thousand
    page tome of dry exposition within a week or two is slim. The chances are you
    will burn out within a few days. I know because I have tried and failed with this
    approach a number of times.


    This ebook attempts to present a difficult subject as a series of lessons in ways
    that are comprehensible to the intelligent layperson. A traditional ‘professional’
    book could have been about five times as big, while still missing important information.
    One could go on about how difficult Windows programming is, or how incomprehensible
    the error messages in Boost appear, but by using plenty of examples and screenshots,
    this ebook shows you some quick ways of getting to grips with such things.


    For those reasonably familiar with programming in C or C++ in the traditional
    scenario of creating console applications, the first two lessons will be effective
    in making the transition to writing Windows applications easier. You will also
    gain an understanding of how to create your own customized controls, build a dialog-based
    web browser and play back media files using DirectShow, amongst other things.


    Lesson three is an accessible introduction to getting started with the Boost libraries
    in a variety of development environments. Examples of using Boost for six different
    libraries are given. Having this valuable skill will increase your productivity
    by providing tailor-made solutions to many common programming problems.


    Also included are lessons to get you started with using graph algorithms, which
    are particularly useful in areas like telecommunications. Here we show you how
    to model networks, as well as applying techniques with which to ascertain connectivity,
    find shortest paths and determine minimal spanning trees.


    There are times when as a developer you may be asked to code a complex algorithm.
    A number of the lessons given here show you how to prototype algorithms and de-mystify
    the process. Examples include the shunting-yard algorithm used for evaluating
    mathematical expressions, the “all simple paths” problem for finding routes in
    networks and a Soduku puzzle-solver. In all these examples we verify that the
    computational results are as expected.'
