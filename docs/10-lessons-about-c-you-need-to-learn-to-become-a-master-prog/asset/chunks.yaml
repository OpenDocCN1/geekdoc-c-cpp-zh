    Click Next and make sure the Release and Debug checkboxes are set:


    ![](images/00084.jpeg)


    Click Finish.


    Now that we have created the project, right click on the ‘BoostDateTime’ project
    folder and select New > Source File.


    Fill in the fields according to your preferences, and then click Finish:


    ![](images/00085.jpeg)


    Overwrite the main.cpp file that gets created with the following code so that
    we may use this example of a header-only example of Boost Date Time:


    #include <boost/format.hpp>


    #include <boost/date_time.hpp>


    #include <iostream>


    int main()


    {


    const boost::posix_time::ptime now =


    boost::posix_time::second_clock::local_time();


    const boost::wformat f = boost::wformat( L"%02d.%02d.%s %02d:%02d" )


    % now.date().year_month_day().day.as_number()


    % now.date().year_month_day().month.as_number()


    % now.date().year_month_day().year


    % now.time_of_day().hours()


    % now.time_of_day().minutes();


