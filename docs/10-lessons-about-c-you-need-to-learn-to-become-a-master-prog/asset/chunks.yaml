    # Chapter 3: Getting Started with the Boost Libraries


    ## 3.1 Introduction


    Boost is a powerful set of libraries that can be applied to a wide range of tasks
    and application domains. If you are seeking to accomplish a C++ programming task
    in a robust and generic way, there is a strong chance that a Boost library already
    exists for this purpose. They range from threads and file processing to numerical
    analysis and graph algorithms. A comprehensive description of any more than a
    small number of these libraries is beyond the scope of this ebook. The Boost homepage
    contains extensive documentation on all of the individual components and there
    are some good books available on the subject.


    What we will focus on here is how to really get started. Knowing how to get Boost
    installed and ready on your chosen development environment and getting a feel
    for how these libraries are used is often tricky for those who are unfamiliar.
    It does not help that some of the available documentation can be sketchy.


    So this chapter is an in-depth guide to setting up Boost in a number of common
    Integrated Development Environments (IDEs) including some usage examples.


    ## 3.2 Pre-requisites


    Before getting to grips with using Boost, first make sure you have the necessary
    pre-requisites described in this chapter. If you do not already have Boost, download
    and extract the Boost zip file to a destination of your choice. Official releases
    of Boost may be obtained from [http://www.boost.org/users/download/](http://www.boost.org/users/download/)


    ![](images/00057.jpeg)


    ### Generating compiled libraries.


    As stated on the ‘Getting Started on Windows’ Boost web page, most Boost libraries
    are of the header-based type. In other words, once they are installed to your
    computer they require no further compilation or intervention to make them work.
    To use such libraries, you need only add the correct includes like this:


    #include <boost/lambda/lambda.hpp>


    There exist other Boost libraries that require additional compilation to use them,
    such as threads, file systems, regular expressions and the unit test framework.
    The following sections describe how to generate compiled libraries for the following
    Windows-based C++ compiler environments: Visual C++, MinGW and CygWin. Follow
    the instructions that are appropriate to your environment.


    ### Generating compiled libraries for Visual Studio


    Open a command prompt and navigate to the location of your boost root folder.
    Enclose the path in quotation marks if it contains white spaces:


    ![](images/00058.jpeg)


    From the command prompt run the bootstrap command bootstrap.bat:


    ![](images/00059.jpeg)


    Run .\b2 from the command prompt. This can take quite some time to finish:


    ![](images/00060.jpeg)


    And that''s all there is to it. The compiled libraries that Visual Studio uses
    get installed to the <root>/stage/lib directory:


    ![](images/00061.jpeg)


    ### Generating compiled libraries for MinGW


    MinGW (Minimalist GNU for Windows) is a free and open source alternative for developing
    Microsoft Windows applications. It contains the GNU Compiler Collection (GCC)
    and various Windows header files and static libraries to enable the use of the
    Windows API.


    Get started by setting the PATH environment variable by right-clicking My Computer
    and selecting Properties, followed by the Advanced tab, followed by the Environment
    Variables button. In the System Variables section select the PATH environment
    variable and then select the Edit button:


    ![](images/00062.jpeg)


    In the Edit control that appears, include the setting for including MinGW by appending
    “C:\mingw\bin” followed by a semi-colon as shown:


    ![](images/00063.jpeg)


    To generate the Boost compiled libraries using MinGW, open a command prompt, navigate
    to the Boost root directory and run the command bootstrap.bat mingw:


    ![](images/00064.jpeg)


    This will generate the two executables needed to compile the Boost libraries,
    b2.exe and bjam.exe. Once done execute the command b2.exe toolset=gcc


    ![](images/00065.jpeg)


    Then the compiled libraries to be used by MinGW are generated as shown:


    ![](images/00066.jpeg)


    ### Generating compiled libraries for CygWin


    The advantage of using Cygwin is that makes available many UNIX tools lacking
    in the Windows operating system. If Cygwin is your choice of compiler, set the
    Environment Variables so that your IDE can access the Cygwin tool collection.
    From the Start button, right-click ‘My Computer’ and select ‘Properties’. Select
    the ‘Advanced’ tab and then ‘Environment Variables’. Select the ‘Path’ in the
    ‘System Variables’ section and then select the ‘Edit’ button:


    ![](images/00067.jpeg)


    And then set the location of the Cygwin tool set:


    ![](images/00068.jpeg)


    To configure Boost to work with Cygwin, open the Cygwin terminal and navigate
    to the location where your Boost libraries have been installed. For Windows directories
    with white spaces enclose it in quotes like this:


    $ cd "C:\Program Files\boost_1_55_0"


    Check to see that the boost/ folder exists at this location using the ls command:


    ![](images/00069.jpeg)


    If the boost directory is present, run the bootstrap command:


    $ ./bootstrap.sh –prefix=boost/


    ![](images/00070.jpeg)


    Then run the $ ./bjam.exe command (this can take a while):


    ![](images/00071.jpeg)'
