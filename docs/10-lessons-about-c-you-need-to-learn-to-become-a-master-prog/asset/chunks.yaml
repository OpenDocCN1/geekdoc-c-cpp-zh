    graph->insert( EdgePtr( new Edge( 2, 5, 2.3) ) );


    graph->insert( EdgePtr( new Edge( 2, 6, 1.7 ) ) );


    graph->insert( EdgePtr( new Edge( 3, 4, 1.7 ) ) );


    graph->insert( EdgePtr( new Edge( 5, 6, 0.5 ) ) );'
