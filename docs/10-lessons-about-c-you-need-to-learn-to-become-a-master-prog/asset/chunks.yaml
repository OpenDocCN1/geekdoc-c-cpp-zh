    ### Mutating and Transforming


    The std::transform algorithm applies a function to each object in a given range
    and copies the result of the function to a new range which is pointed to by an
    output iterator. This example shows how to use a function adaptor that takes two
    input ranges and increases the values of the first range by the second range.


