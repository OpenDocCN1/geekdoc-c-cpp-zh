    \ 的 `OnDraw()` 方法中显示新的文本字符串。取消 `CDC*` `/*pDC*/` 并添加代码来显示文本：\n\n```cpp\nvoid CSerializeSDIexampleView::OnDraw(CDC*\
    \ pDC)\n{\n    CSerializeSDIexampleDoc* pDoc = GetDocument();\n    ASSERT_VALID(pDoc);\n\
    \    if (!pDoc) return;\n    pDC->TextOut( 0, 0, pDoc->m_strData );\n}\n```\n\n\
    注意 `CSerializeSDIexampleDoc` 类已经有一个 `Serialize()` 方法。这里就是我们序列化 `m_strData` 字符串的地方。使用传递给它的\
    \ `CArchive` 引用，就像你使用 `std::cout` 或 `std::cin` 分别读取和写入磁盘一样：\n\n```cpp\nvoid CSerializeSDIexampleDoc::Serialize(CArchive&\
    \ ar)\n{\n    if (ar.IsStoring())\n    {\n        ar << m_strData;\n    }\n  \
    \  else\n    {\n        ar >> m_strData;\n    }\n}\n```\n\n我们对项目进行的最后一次修改是确保应用程序记住用户何时向\
    \ `m_strData` 对象添加了更多数据。这意味着当用户尝试退出应用程序时，程序将向用户提示“保存文档更改”的消息。\n\n在 `CSerializeSDIexampleView::OnChar`\
    \ 中，通过设置修改标记来指示文档已更改：\n\n```cpp\nvoid CSerializeSDIexampleView::OnChar(UINT nChar,\
    \ UINT nRepCnt, UINT nFlags)\n{\n    // TODO: 在此处添加你的消息处理代码和/或调用默认函数\n    CSerializeSDIexampleDoc*\
    \ pDoc = GetDocument();\n    ASSERT_VALID(pDoc);\n    if ( nChar == 8 )\n    {\n\
    \        int length = pDoc->m_strData.GetLength();\n        CString str = pDoc->m_strData.Left(\
    \ length - 1 );\n        pDoc->m_strData = str;\n    }\n    else\n    {\n    \
    \    CString str;\n        str.Format( TEXT( \"%c\" ), nChar );\n        pDoc->m_strData\
    \ += str;\n    }\n    Invalidate();\n    pDoc->SetModifiedFlag();\n    CView::OnChar(nChar,\
    \ nRepCnt, nFlags);\n}\n```\n\n运行程序时，我们可以输入字符或使用退格键删除它们：\n\n![](img/00053.jpeg)\n\
    \n现在尝试在不保存文本的情况下关闭应用程序，这样它会提示你是否要保存：\n\n![](img/00054.jpeg)\n\n为文件命名并保存：\n\n![](img/00055.jpeg)\n\
    \n现在重启应用程序，打开 `Serialize1.txt` 文件以重新打开：\n\n![](img/00056.jpeg)\n\n## 章节总结\n\n\
    总结这节课程，你现在可以：\n\n* 创建你自己的网络浏览器。\n* 通过文件传输协议（FTP）下载文件。\n* 使用 DirectShow 播放或捕获媒体文件。\n\
    * 创建动态链接库 (DLL) 另一个应用程序中引用它。\n* 应用 MFC 提供的序列化机制在硬盘等存储介质上存储和检索应用程序的成员变量。\n\n# 第\
    \ 3 章：开始使用 Boost 库\n\n## 3.1 介绍\n\nBoost 是一个强大的库，可以应用于广泛的任务和应用领域。如果你正在寻求以健壮且通用的方式完成\
    \ C++ 编程任务，那么很有可能已经存在一个为此目的的 Boost 库。它们的范围从线程、文件处理到数值分析和图算法不等。这些库中任何超过少数几个的详细描述都出了本电子书的范围。Boost\
    \ 主页包含有关所有各个组件的详尽文档，关于该主题也有一些不错的书籍。\n\n我们在这里关注的是如何真正开始。对于不熟悉的人来说，知道如何在所选开发环境中安装并准备好\
    \ Boost，并感受这些库的使用方法通常是困难的。某些可用文档可能不够靠谱，这也没有帮助。\n\n因此，本章是关于在常用集成开发环境 (IDE) 中设置\
    \ Boost 的深度指南，并在一些用法示例。\n\n## 3.2 前提条件\n\n在熟悉使用 Boost 之前，首先确保你已具备本章描述的必要前提条件。如果你还没有\
    \ Boost，请下载并解压 Boost zip 文件到你选择的位置。Boost 的官方发布可以从 [`www.boost.org/users/download/`](http://www.boost.org/users/download/)\
    \ 获取。\n\n![](img/00057.jpeg)\n\n### 生成编译后的库。\n\n正如“在 Windows 上开始使用”Boost 网页所述，大多数\
    \ Boost 库都是基于头类型的换句话说，一旦它们安装到你的计算机上，就不需要进一步编译或干预即可工作。要使用此类库，你只需要这样添加正确的包含：\n\n\
    ```cpp\n#include <boost/lambda/lambda.hpp>\n```\n\n还存在其他 Boost 库需要额外的编译才能使用，例如线程、文件系统、正则表达式和单元测试框架。后续章节描述了如何为以下基于\
    \ Windows 的 C++ 编译器环境生成编译后的库：Visual C++、MinGW 和 CygWin。按照说明说明操作。\n\n### 为 Visual\
    \ Studio 生成编译后的库\n\n打开命令提示符并导航到你的 boost 根目录。如果包含空格，请将其括在引号内：\n\n![](img/0058.jpeg)\n\
    \n从命令提示符运行 bootstrap 命令：\n\n![](img/0059.jpeg)\n\n从命令提示符运行 `b2`。这需要一些时间：\n\n![](img/0060.jpeg)\n\
    \n然后 Visual Studio 使用的编译库安装到 `<root>/stage/lib`：\n\n![](img/0061.jpeg)\n\n###\
    \ 为 MinGW 生成编译后的库\n\nMinGW（Minimalist GNU for Windows）是开发 Windows 应用程序的免费开源替代。它包含了\
    \ GNU  (GCC) 以及各种 Windows 头文件和静态库以便使用 Windows API。通过右键点击“计算机”选择属性，然后是高级选项、环境变量。在系统变量中选择\
    \ PATH，然后点击编辑：\n\n![](img/0062.jpeg)\n\n在出现的编辑框中，通过添加 `C:\\mingw\\bin` 来包含 MinGW：\n\
    \n![](img/0063.jpeg)\n\n要使用 MinGW 生成 Boost 库，打开命令提示符，导航到 Boost 根目录并运行 `bootstrap.bat\
    \ mingw`：\n\n![](img/0064.jpeg)\n\n这将生成编译 Boost 需要的两个执行文件 `b2.exe` 和 `bjam.exe`。完成后执行命令\
    \ `b2 toolset=gcc`：\n\n![](img/0065.jpeg)\n\n然后供 MinGW 使用的编译库所示：\n\n![](img/0066.jpeg)\n\
    \n### 为 CygWin 生成编译后的库\n\n使用 Cygwin 的优势是提供了 Windows 操作系统中缺少的许多 UNIX 工具。如果 Cygwin\
    \ 是你选择的编译器，请设置环境变量以便你的 IDE 访问 Cygwin 工具集。从开始按钮右键点击“我的计算机”并选择“属性”。选择高级选项卡以及环境变量。在系统变量中选择\
    \ Path，然后点击编辑：\n\n![](img/0067.jpeg)\n\n然后设置 Cygwin 工具集的位置：\n\n![](img/0068.jpeg)\n\
    \n为了配置 Boost 使用 Cygwin，打开 Cygwin 终端并导航到安装 Boost 库的位置。对于包含空格的 Windows 目录，用引号引用：\n\
    \n`cd \"C:\\Program Files\\boost_1_55_0\"`\n\n使用 `ls` 命令检查此位置是否存在 `boost/` 文件夹：\n\
    \n![](img/0069.jpeg)\n\n如果 boost 目录，运行 bootstrap 命令：\n\n`./bootstrap.sh --prefix=boost/`\n\
    \n![](img/0070.jpeg)\n\n然后运行 `./bjam.exe` 命令（这可能需要一段时间）：\n\n![](img/0071.jpeg)\n\
    \n"
- fmt: "\nNow run the `./bjam install` command (this can take a *very* long time):\n\
    \n![](images/00072.jpeg)\n\nOnce this stage has been completed you will find that\
    \ three additional folders have been created within the `boost/` folder, namely\
    \ `bin`, `include` and `lib`.\n\nLastly, recursively copy the folders to the `/usr/local/`\
    \ destination:\n\n```bash\ncp -r boost/bin /usr/local/\ncp -r boost/include /usr/local/\n\
    cp -r boost/lib /usr/local/\n```\n\n![](images/00073.jpeg)\n\n## 3.3 Configuring\
    \ Boost in Microsoft Visual Studio\n\n### Header-only library example: Boost Format\n\
    \nTo get a feel for using Boost in Visual Studio let’s start with a library requiring\
    \ no separate compilation: `Boost Format`, a type-safe utility for formatting\
    \ arguments according to a format string. Create an empty project by selecting\
    \ `File > New > Project`.\n\nSet the ‘Create directory for solution` checkbox\
    \ and name your project:\n\n![](images/00074.jpeg)\n\nAdd the code by right-clicking\
    \ the project folder and selecting `Add > New Item`. Select `C++ File` and name\
    \ it as `main.cpp`:\n\n![](images/00075.jpeg)\n\nInsert this code snippet into\
    \ `main.cpp` as an example of how to format and output an array of hexadecimal\
    \ values:\n\n```cpp\n#include <iostream>\n#include <boost/format.hpp>\n\nint main()\n\
    {\n    unsigned int arr[ 5 ] = { 0x05, 0x04, 0xAA, 0x0F, 0x0D };\n    std::cout\
    \ << boost::format(\"%02X-%02X-%02X-%02X-%02X\")\n    % arr[0]\n    % arr[1]\n\
    \    % arr[2]\n    % arr[3]\n    % arr[4]\n    << endl;\n}\n```\n\nNotice that\
    \ build errors will occur if we try to compile the project without having first\
    \ specified the additional includes required to use the Boost libraries:\n\n`fatal\
    \ error C1083: Cannot open include file: 'boost/format.hpp': No such file or directory`\n\
    \nRight-click your project folder and select `Properties`. In the `C++ > General`\
    \ tab edit the `Additional Include Directories` section:\n\n![](images/00076.jpeg)\n\
    \nTell Visual Studio where your `Boost` include files reside:\n\n![](images/00077.jpeg)\n\
    \nAnd that’s all you need to do to use non-compiled Boost libraries. Your program\
    \ should now successfully compile.\n\nRunning the program generates the hexadecimal\
    \ output:\n\n![](images/00078.jpeg)\n\n### Compiled library example: Boost Regex\n\
    \nA Boost library requiring separate compilation is `Boost Regex`, a C++ implementation\
    \ of regular expressions, which is a form of pattern matching often used in text\
    \ processing.\n\nSelect `File > New > Project > Visual C++ > Empty Project`.\n\
    \nCall it `BoostRegex`:\n\n![](images/00079.jpeg)\n\nSelect `New > File > C++\
    \ File` and name it `main.cpp`.\n\nInto `main.cpp` copy the following code:\n\n\
    ```cpp\n#include <boost/regex.hpp>\n#include <iostream>\n#include <string>\n#include\
    \ <sstream>\n\nint main()\n{\n    // Regex to match YYYY-MM-DD dates\n    static\
    \ const boost::regex date_regex(\"([0-9][0-9][0-9][0-9])-([1-9]|0[1-9]|1[012])-([1-9]|[0-2][1-9]|3[01])\"\
    );\n    std::string input = \"2014-08-28\";\n    boost::smatch char_matches;\n\
    \    if ( boost::regex_match( input, char_matches, date_regex ) )\n    {\n   \
    \     std::stringstream ss_match;\n        ss_match << char_matches[1]\n     \
    \   << \"-\"\n        << char_matches[2]\n        << \"-\"\n        << char_matches[3];\n\
    \        std::cout << ss_match.str();\n    }\n    else\n    {\n        std::cout\
    \ << \"First example should have matched the regex.\\n\";\n    }\n}\n```\n\nSet\
    \ the include directory for `Boost Regex`. Failing to do this will generate the\
    \ following compilation error:\n\n`fatal error C1083: Cannot open include file:\
    \ 'boost/regex.hpp': No such file or directory`\n\nRight-click your project folder\
    \ and select `Properties`. In the `C/C++ > General` tab set the `Additional Include\
    \ Directories` field:\n\n![](images/00080.jpeg)\n\nFailing to set the location\
    \ of the additional library directories will generate the following link error\
    \ when you try to compile your project:\n\n`LINK : fatal error LNK1104: cannot\
    \ open file 'libboost_regex-vc100-mt-gd-1_55.lib'`\n\nRight-click your project\
    \ folder and select `Properties`.\n\n![](images/00081.jpeg)\n\nIn the `Linker\
    \ > General` tab, set the `Additional Library Directories` field to tell Visual\
    \ Studio where to obtain the required library files:\n\nAnd that’s it. Your `Boost\
    \ Regex` Visual Studio project should now compile and allow you to run the above\
    \ example:\n\n![](images/00082.jpeg)\n\n## 3.4 Configuring Boost in Eclipse\n\n\
    ### Header-only library example: Boost Date Time\n\n`Boost Date Time` is a highly\
    \ customizable library for programming with dates and times. Open Eclipse and\
    \ select `New > C++ Project`. In the ‘C++ Project’ dialog that appears, select\
    \ `Empty Project`, give the project a name such as `BoostDateTime`, and select\
    \ the desired toolchain (such as `Cygwin`):\n\n![](images/00083.jpeg)\n\nClick\
    \ next and ensure the Debug and Release checkboxes are set:\n\n![](images/00084.jpeg)\n\
    \nNow that we have created the project, right click the project folder and select\
    \ `New > Source File`.\n\n![](images/00085.jpeg)\n\nOverwrite the `main.cpp` file\
    \ with the following code, an example of Date Time:\n\n```cpp\n#include <boost/format.hpp>\n\
    #include <boost/date_time.hpp>\n#include <iostream>\n\nint main()\n{\n    boost::posix_time::ptime\
    \ now = boost::posix_time::clock::local();\n    boost::shared_ptr f = boost::format(\"\
    %02d.%02d.%s %02d:%02d\") % now;\n    std::cout << f.str() << std::endl;\n}\n\
    ```\n\nNote that when inserting this code, the Problems tab is populated with\
    \ error messages. This is because we have yet to configure our project to work\
    \ with Boost.\n\nRight-click the project and select `Properties`. In the `C++\
    \ Build` section, verify that you have toolchain selected, such as `Cygwin`:\n\
    \n![](images/00086.jpeg)\n\nSelect the `C++ General` section. In the `Paths and\
    \ Symbols` select the `Includes` tab. Now we need to tell Eclipse where to find\
    \ the Boost folder we extracted. Select the `Add` button and when the `Add directory\
    \ path’ dialog is launched, select `File system…` to set the Boost directory:\n\
    \n![](images/00087.jpeg)\n\nClick `OK` when you are returned to the project dialog:\n\
    \n![](images/00088.jpeg)\n\nRepeat by adding the same path for the `GNU C` language.\
    \ From the menu, select `Project > Clean`, making sure to check the `BoostDateTime`\
    \ checkbox:\n\n![](images/00089.jpeg)\n\nPress `OK` to clean and build the project.\
    \ To start debugging your Eclipse project, right-click the left-side of the code\
    \ window and select `Toggle breakpoint`:\n\n![](images/00090.jpeg)\n\nA small\
    \ button should appear at the point where you chose the breakpoint. To start debugging,\
    \ select `Run > Debug` from the main menu. Once the debugging process starts you\
    \ will get directed to the Debug perspective. Press `F6` to step through each\
    \ line of code, and view the results in the Console tab:\n\n![](images/00091.jpeg)\n\
    \nThis gives us the desired output via `Boost Format` and that's all you need\
    \ to do to use non-compiled libraries.\n\n### Compiled library example: Boost\
    \ Serialization\n\nUsing the compiled Boost libraries in Eclipse involves a few\
    \ additional steps to the ones described for header-only libraries.\n\nFor this\
    \ example, we will demonstrate the use of `Boost Serialization`, which is a means\
    \ of converting C++ objects into a format that can be saved and restored at a\
    \ later date.\n\nAs before, select `New > C++ Project`.\n\n![](images/00092.jpeg)\n\
    \nClick next and ensure the Debug and Release checkboxes are set as before.\n\n\
    Click `Finish`.\n\nAs with the non-compiled example, right-click the project and\
    \ select `New > Source File`.\n\n![](images/00093.jpeg)\n\nThen right click the\
    \ `src` folder just created and select `New > Source File`. We will call it `main.cpp`.\
    \ Click `Finish` and copy in the following code, an example usage of Boost Serialization:\n\
    \n```cpp\n#include <vector>\n#include <fstream>\n#include <boost/serialization.hpp>\n\
    ```\n"
