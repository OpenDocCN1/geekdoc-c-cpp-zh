    processing media is a directed graph whose nodes represent data processing stages
    and whose edges represent uni-directional data flow. The Filter Graph Manager
    also handles synchronization, event notification, and other aspects of the controlling
    the filter graph.


    hr = CoCreateInstance(


    CLSID_FilterGraph,


    NULL,


    CLSCTX_INPROC_SERVER,


    IID_IGraphBuilder,


    (void **)&pGraph );


    Once the instance of the Filter Graph Manager is created, the real work starts.
    Use the returned IGraphBuilder pointer to query for the IMediaControl and IMediaEvent
    interfaces:


    hr = pGraph->QueryInterface(IID_IMediaControl, (void **)&pControl);


    hr = pGraph->QueryInterface(IID_IMediaEvent, (void **)&pEvent);


    Then use  IGraphBuilder::RenderFile to build the filter graph automatically for
    the media supplied to it – the Filter Graph manager will connect the appropriate
    filters for the specified media file. This is otherwise known as "Intelligent
    connect" in DirectShow:


    hr = pGraph->RenderFile( L"C:\\temp\\Song.mp4", NULL );


    Use IMediaControl::Run to start the data flow in the filter graph. IMediaControl  provides
    the methods to run, pause or stop the media.


    Use IMediaEvent::WaitForCompletion to wait for it to complete (caution: using
    INFINITE in a real application could cause it to block indefinitely.)


    pControl->Run();


    pEvent->WaitForCompletion( INFINITE, &evCode );


    **Full code listing:**


    #include <dshow.h>


    #include <iostream>


    #pragma comment(lib,"Strmiids.lib")


    void main()


    {


    IGraphBuilder *pGraph = NULL;


    IMediaControl *pControl = NULL;


    IMediaEvent *pEvent = NULL;


    // Initialize the COM library.


    HRESULT hr = CoInitialize( NULL );


    if ( FAILED( hr ) )


    {


    std::cout << "Could not initialize COM library" << std::endl;


    return;


    }


    // Create the filter graph manager and query for interfaces.


    hr = CoCreateInstance(


    CLSID_FilterGraph,


    NULL,


    CLSCTX_INPROC_SERVER,


    IID_IGraphBuilder,


    (void **)&pGraph );


    if ( FAILED( hr ) )


    {


    std::cout << "Could not create the Filter Graph Manager."


    << std::endl;


    return;


    }


    hr = pGraph->QueryInterface( IID_IMediaControl, (void **)&pControl );


    hr = pGraph->QueryInterface( IID_IMediaEvent, (void **)&pEvent);


    // Build and run graph. NOTE: change path to an actual file on your system


    hr = pGraph->RenderFile( L"C:\\temp\\Song.mp4", NULL );


    if ( SUCCEEDED( hr ) )


    {


    hr = pControl->Run();


    if ( SUCCEEDED( hr ) )


    {


    long evCode;


    pEvent->WaitForCompletion( INFINITE, &evCode );


    }


    }


    pControl->Release();


    pEvent->Release();


    pGraph->Release();


    CoUninitialize();


    }


    ## 2.4 Creating a dynamic link library (DLL)


    A DLL is a code or data library that can be used by other applications or libraries.
    For example, common methods for logging, processing or working with user interface
    controls can be made available in libraries so that several applications can use
    the same functionality. This not only reduces the need to create the same code
    multiple times, but also ensures commonality (the same dialog is used across different
    applications). This section describes how to create your own DLL and utilize its
    routines from an application created elsewhere.


    ### Create a new dll project


    From the File menu, select New and then Project. In the Project types pane, under
    Visual C++, select Win32 > Win32 Console Application. In the Name field choose
    a name for the project, such as MathFuncsDll. And in the Solution name field,
    choose a name for the solution, such as DynamicLibrary. This initial creation
    is summarized by the following screenshot:


    ![](images/00039.jpeg)


    Now press OK to start the Win32 application wizard. Press Next and in the Application
    Settings page set DLL as the Application type if available or Console application
    if DLL is not available. Some versions of Visual Studio do not support creating
    a DLL project using wizards. (If so, it is possible to change this later to make
    your project compile into a DLL.) In Additional options select Empty project.
    This is summarized as follows:


    ![](images/00040.jpeg)


    Press Finish to create the project.'
