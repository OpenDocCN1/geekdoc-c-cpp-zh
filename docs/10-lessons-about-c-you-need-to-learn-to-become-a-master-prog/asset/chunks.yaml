    const std::string& start,


    const std::string& target,


    const int& max_hops,


    const int& min_hops )


    {


    int s = network->NodeIndex( start );


    int d = network->NodeIndex( target );


    startNodeId = s;


    Path visited;


    visited.push_back( s );


    DepthFirst( network, visited, d, max_hops, min_hops );


    }


