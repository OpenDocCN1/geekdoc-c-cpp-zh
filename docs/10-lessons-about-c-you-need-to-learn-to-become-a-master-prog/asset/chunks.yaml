    \ as belonging to:\n\n- Standard sequence containers (`std::vector`, `std::list`,\
    \ `std::deque` and `std::string`)\n- Standard associative containers (`std::map`,\
    \ `std::set`, `std::multimap`, `std::multiset`)\n\nGiven the number of different\
    \ STL containers at your disposal, it is worth considering some rules of thumb\
    \ for choosing a STL container appropriate to your particular scenario. If you\
    \ anticipate your collection needing to hold just a few items, then it is probably\
    \ fine to use `std::vector` regardless of what you intend to do. `std::vector`\
    \ remains a good choice if you intend to maintain a collection of items that will\
    \ change very little when compared to the number of times they are accessed. Furthermore,\
    \ the `std::vector` container will provide everything you expect from an array,\
    \ allowing for a straightforward collection of items that can be randomly accessed\
    \ or added and removed (at the back of the container) in a dynamic and type safe\
    \ way:\n\n```cpp\n#include <vector>\n#include <string>\n#include <algorithm>\n\
    #include <iostream>\n#include <iterator>\n\nint main()\n{\n    const int values[]\
    \ = { 1, 11, 111, 1111 };\n    const size_t size = sizeof( values ) / sizeof(\
    \ values[ 0 ] );\n    std::vector<int> v( values, values + size );\n    v.push_back(\
    \ 11111 );\n    std::cout << \"vector: \";\n    std::copy( v.begin(), v.end(),\
    \ std::ostream_iterator<int>( std::cout, \" \" ) );\n    return 0;\n}\n```\n\n\
    This gives the following output:\n\n![](images/00149.jpeg)\n\nSimilar in respects\
    \ to `std::vector` is `std::deque` (pronounced “deck\"), short for double-ended\
    \ queue. `std::deque` allows insertions at either end of the collection, ie `push_back`\
    \ and `push_front`, thus allowing you to model a queue as well as a stack. But\
    \ let's move on to entirely new ground. It may be the case that the need for random\
    \ access is not so important, but instead you need a container that can efficiently\
    \ insert or remove items at arbitrary positions. An associative container such\
    \ as `std::map` would be a definite no-no and `std::vector` would be more computationally\
    \ expensive for inserting data items, especially in the middle. However, `std::list`\
    \ is ideal for this kind of task. A practical application could be the tracking\
    \ of all open Windows objects, or maintaining a list of processes running in the\
    \ background, the kind of situations whereby the number of insertions and deletions\
    \ is likely to be substantial. A unique feature of `std::list` is its ability\
    \ to splice: that is, transfer elements from one `std::list` to another.\n\n```cpp\n\
    #include <list>\n#include <string>\n#include <algorithm>\n#include <iostream>\n\
    #include <iterator>\n\nint main()\n{\n    typedef std::list<std::string>::iterator\
    \ list_it;\n    std::list<std::string> list1;\n    std::list<std::string> list2;\n\
    \    list1.push_front( \"A\" );\n    list1.push_back( \"E\" );\n    list1.push_back(\
    \ \"F\" );\n    list1.insert( ++list1.begin(), \"B\" );\n    list2.push_front(\
    \ \"C\" );\n    list2.push_front( \"D\" );\n    // Transfer (splice) elements\
    \ from list2 into list1.\n    list_it it = list1.begin();\n    std::advance( it,\
    \ 2 );\n    list1.splice( it, list2 );\n    std::cout << \"list1: \";\n    std::copy(\
    \ list1.begin(), list1.end(), std::ostream_iterator<std::string>( std::cout, \"\
    \ \" ) );\n    return 0;\n}\n```\n\nThe output is as shown:\n\n![](images/00150.jpeg)\n\
    \nSo the `std::vector` and `std::list` containers are examples of sequence container\
    \ uses that implement data item storage. Other sequence containers in this category\
    \ include `std::deque`, `std::array` and `std::forward_list`. In each case, all\
    \ the container items must belong to the same data type. There can never be a\
    \ mix of data types such as `int` or `std::string` within the same container.\n\
    \nSo what other uses do we have for these containers? Well, there may be times\
    \ when you want to guarantee that the container stores unique values only and\
    \ prevents the insertion of duplicate items. In a practical setting this might\
    \ include maintaining a list of students enrolled on a course, or a collection\
    \ of unique social security numbers. Therefore an associative container such as\
    \ `std::set` would be a reliable means of guaranteeing the uniqueness of inserted\
    \ data items, provided the ordering of these unique items is of no importance.\n\
    \nThe `std::set` container permits easy insertion and lookup of unique values\
    \ by way of the `insert` and `find` methods respectively. That is because `insert`\
    \ will not add an new item if the value of that item is already in the set, and\
    \ new elements when inserted are automatically sorted in ascending order. Furthermore\
    \ `std::set`, like other associative containers, has certain performance guarantees:\
    \ the time required to both find and insert an item is proportional to `log N`,\
    \ where `N` is the number of items.\n\n```cpp\n#include <set>\n#include <string>\n\
    #include <algorithm>\n#include <iostream>\n#include <iterator>\n\nint main()\n\
    {\n    // Initialise sample sets\n    int vals1[] = { 4, 2, 1 };\n    int vals2[]\
    \ = { 1, 7, 5, 2 };\n    int size1 = sizeof( vals1 ) / sizeof ( vals1[ 0 ] );\n\
    \    int size2 = sizeof( vals2 ) / sizeof ( vals2[ 0 ] );\n    std::set<int> s1(\
    \ vals1, vals1 + size1 );\n    std::set<int> s2( vals2, vals2 + size2 );\n   \
    \ std::set<int> intersect;\n    set_intersection( s1.begin(), s1.end(), s2.begin(),\
    \ s2.end(), std::inserter(intersect,intersect.begin()) );\n    std::cout << \"\
    intersection: \";\n    std::copy( intersect.begin(), intersect.end(), std::ostream_iterator<int>(\
    \ std::cout, \" \" ) );\n    return 0;\n}\n```\n\nWait, the example code had some\
    \ extra logic flow:\n\nBut what if you care about the position of inserted items?\
    \ In this case `std::set` would not be appropriate. In cases like this, the solution\
    \ will likely involve more complex approaches as creating your own class. You\
    \ might want `std::set` for storing unique items, and `std::vector` for keeping\
    \ track of the order in which they were inserted\n\n```cpp\n#include <set>\n#include\
    \ <vector>\n#include <string>\n#include <algorithm>\n#include <iostream>\n\ntypedef\
    \ std::set<std::string>::iterator Iter;\n\nclass OrderedSet\n{\nprivate:\n   \
    \ std::set<std::string> setItems;\n    std::vector<Iter> setOrder;\n\npublic:\n\
    \    OrderedSet() {}\n    void insert( const std::string& item )\n    {\n    \
    \    setItems.insert( item );\n        Iter it = setItems.find( item );\n    \
    \    setOrder.push_back( it );\n    }\n\n    int order( const std::string& item\
    \ )\n    {\n        Iter it = setItems.find( item );\n        std::vector<Iter>::iterator\
    \ order_it = std::find( setOrder.begin(), setOrder.end(), it );\n        return\
    \ order_it - setOrder.begin();\n    }\n};\n\nint main()\n{\n    OrderedSet orderedSet;\n\
    \    orderedSet.insert( \"Bravo\" );\n    orderedSet.insert( \"Alpha\" );\n  \
    \  orderedSet.insert( \"Charlie\" );\n    orderedSet.insert( \"Delta\" );\n\n\
    \    std::cout << \"Order = \" << orderedSet.order(\"Alpha\") << std::endl;\n\n\
    \    return 0;\n}\n```\n\nMoving on now, the `std::map` class allows us to store\
    \ and obtain data items that are mapped to a key. This is useful when you need\
    \ a means of quickly looking up a data item associated with a key value. The `std::map`\
    \ container, while allowing for efficient insertion and retrieval as with `std::set`,\
    \ differs from the `std::set` in that `std::map` stores pairs, rather than single\
    \ values: `std::map<Key, T>`, where `Key` is used to reference the data object\
    \ `T`.\n"
