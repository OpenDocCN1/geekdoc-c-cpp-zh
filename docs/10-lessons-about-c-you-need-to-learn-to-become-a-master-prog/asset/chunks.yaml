    ## 3.4 Configuring Boost in Eclipse


    **Header-only library example: Boost Date Time**


    Boost Date Time is a highly customizable library for programming with dates and
    times. Open Eclipse and select New > C++ Project. In the ‘C++ Project’ dialog
    that appears, select Empty Project, give the project a name such as ‘BoostDateTime’,
    and select the desired toolchain (such as Cygwin):


