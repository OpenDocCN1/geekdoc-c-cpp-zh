- fmt: "\nRight click on your List Control and select Properties. In the Appearance\
    \ section set the `View` property to `List`. You can keep its `ID` property as\
    \ `IDC_LIST1`:\n\n![](images/00014.jpeg)\n\n![](images/00015.jpeg)\n\nRight-click\
    \ the list control and select Add Variable. Set the Variable Name to `m_Items`.\
    \ Click Finish.\n\n![](images/00016.jpeg)\n\nNow populate the list control with\
    \ items using the `CListCtrl::InsertItem` method. Use it as follows:\n\n```cpp\n\
    int InsertItem(const LVITEM* pItem );\n```\n\nThis method requires an `LVITEM`\
    \ pointer as an argument. The `LVITEM` structure is defined as follows:\n\n```cpp\n\
    typedef struct _LVITEM\n{\n    UINT mask;\n    int iItem;\n    int iSubItem;\n\
    \    UINT state;\n    UINT stateMask;\n    LPTSTR pszText;\n    int cchTextMax;\n\
    \    int iImage;\n    LPARAM lParam;\n#if (_WIN32_IE >= 0x0300)\n    int iIndent;\n\
    #endif\n} LVITEM, FAR *LPLVITEM;\n```\n\nThe `mask` parameter specifies the types\
    \ of values you want to set for the current item. `iItem` specifies the zero-based\
    \ index of the item being changed. `iSubItem` is the index of the sub item for\
    \ the current value. If the current item will be the leader, the `iSubItem` is\
    \ stored in a 0-based array. If it is a sub item, then it is stored in a 1-based\
    \ array. The `pszText` variable is the item string displayed, the length of which\
    \ can be specified by assigning a value to `cchTextMax`.\n\nAfter initializing\
    \ the `LVITEM*`, it is passed to the `InsertItem` method to add it as a new list\
    \ item. Here is an example that creates items and displays as a List view:\n\n\
    ![](images/00017.jpeg)\n\n### Creating Custom MFC Controls – an Editable List\
    \ Control\n\nSometimes you may need more than than what the Microsoft Foundation\
    \ Classes provide. The List Control, for example, is great for displaying lists\
    \ of records in various modes. But what if you wish to make individual grid items\
    \ in the list control editable, for example? The answer is to override the MFC\
    \ class and provide custom methods to implement the behaviour you desire. This\
    \ example describes the steps necessary to do just that.\n\n#### Step 1: Create\
    \ the MFC Project\n\nStart by creating a dialog-based application in Visual Studio.\
    \ Select File > New > Project > MFC Application. When the Application Wizard is\
    \ launched, select Dialog based as the Application Type:\n\n![](images/00018.jpeg)\n\
    \nAnd then select Finish. In the Resources View, notice that a new dialog is created:\n\
    \n![](images/00019.jpeg)\n\nTo get started, first delete the static control “TODO:\
    \ Place dialog controls here” that gets created automatically. Then in the Toolbox,\
    \ select the “List Control” and in the Resource View place this within your dialog\
    \ area:\n\n![](images/00020.jpeg)\n\nRight-click the List Control you just added\
    \ and select Properties. In the Properties window, make sure the View section\
    \ of Appearance is set to ‘Report’ style:\n\n![](images/00021.jpeg)\n\n#### Step\
    \ 2: Derive a class from CListCtrl\n\nCreate a new List Control class `CEditableListCtrl`,\
    \ that publicly inherits from the standard `CListCtrl`. An efficient way to do\
    \ this is to use the Class Wizard. Right click your project folder and select\
    \ Class Wizard… Then press the Add Class button that appears in the MFC Class\
    \ Wizard dialog:\n\n![](images/00022.jpeg)\n\nIn our new derived `CEditableListCtrl`\
    \ class, we need to define six new methods in order to make the List Control grid\
    \ items editable:\n\n```cpp\nclass CEditableListCtrl : public CListCtrl\n{\npublic:\n\
