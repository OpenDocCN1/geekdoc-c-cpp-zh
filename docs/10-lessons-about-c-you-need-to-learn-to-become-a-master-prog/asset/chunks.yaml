    # Chapter 6: A Mathematical Expression Parser


    When implementing your own calculator it is necessary to be able to transform
    mathematical expressions into a format that is suitable for evaluation by computers.
    Expressions like ( 1 + 8 ) – ( ( 3 * 4 ) / 2 ) (known as “infix notation“) appear
    simple and intuitive to humans, but are less straightforward to implement in a
    programming language.


    The shunting-yard algorithm is a method for parsing mathematical expressions written
    in infix notation into a format known as Reverse Polish Notation (RPN). RPN notation
    is different to infix notation in that every operator (+, -, * etc) comes after
    the operands (numbers) and there are no parentheses (brackets). This structure
    is more suited to evaluation by computers.


    The infix expression 3 * 4 for example becomes 3 4 *.


    Pseudocode for the shunting-yard algorithm to convert an infix expression into
    Reverse Polish Notation:


    **While** ( tokens exist )


    Read token.


    **If** ( token is a number}


    add token to output queue


    **If** ( token is a function )


    push token onto stack


    **If** ( token is a function argument separator eg a comma)


    **While** ( token at the top of the stack is NOT a left parenthesis )


    pop operators off stack onto output queue.


    **If** ( no left parentheses were encountered )


    Error - invalid input


    If ( token is an operator, o1)


    **While** ( operator token, o2, exists at the top of the stack **AND** ( o1 is
    left-associative and its precedence <= o2 **OR** o1 is right associative and its
    precedence < o2 )


    pop o2 off the stack onto the output queue


    push o1 onto the stack


    **If** ( token is a left parenthesis )


    push token onto the stack.


    **If** ( token is right parenthesis )


    **While**( token at the top of the stack is NOT a left parenthesis )


    pop operators off the stack onto the output queue


    Pop left parenthesis from the stack, but not onto output queue.


    **If** ( token at the top of the stack is a function token )


    pop token onto the output queue.


    **If** ( stack has run out without finding a left parenthesis )


    Error - mismatched parentheses.


    **While** ( operator tokens remain in the stack )


    If ( operator token on the top of the stack is a parenthesis )


    Error - mismatched parentheses.


    Pop the operator onto the output queue.


    When the input expression becomes available in Reverse Polish Notation, it is
    possible to employ another stack-based algorithm to evaluate the RPN expression
    and hence the arithmetic result.


    The pseudocode is as follows:


    **For** each token


    **If** ( token is a number )


    Push value onto stack


    **If** ( token is an operator )


    Pop the 2 x top values from the stack'
