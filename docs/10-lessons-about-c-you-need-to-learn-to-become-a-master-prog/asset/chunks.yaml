    received when the user inputs characters from the keyboard. You can either just
    write this code yourself, or use the Class Wizard. To use the Class Wizard, right-click
    the project folder and select Class Wizard…


    Ensure the CSerializeSDIexampleView class name is selected. Select the Message
    tab and then select the ‘Add Handler…’ button.


    ![](images/00052.jpeg)


    Then press Apply. Click the Edit Code button so we can write the code to store
    the characters the user types in.


    In addition, this handler checks to see if the user has entered backspace, in
    which case it deletes the last character by shortening the string data member
    by 1:


    void CSerializeSDIexampleView::OnChar(UINT nChar, UINT nRepCnt, UINT nFlags)


    {


    // TODO: Add your message handler code here and/or call default


    CSerializeSDIexampleDoc* pDoc = GetDocument();


    ASSERT_VALID(pDoc);


    if ( nChar == 8 )


    {


    int length = pDoc->m_strData.GetLength();


    CString str = pDoc->m_strData.Left( length - 1 );


    pDoc->m_strData = str;


    }


    else


    {


    CString str;


    str.Format( TEXT( "%c" ), nChar );


    pDoc->m_strData += str;


    }


    Invalidate();


    CView::OnChar(nChar, nRepCnt, nFlags);


    }'
