    \ 3, 7 ) ) );\ngraph->insert( EdgePtr( new Edge( 4, 0 ) ) );\ngraph->insert( EdgePtr(\
    \ new Edge( 4, 5 ) ) );\ngraph->insert( EdgePtr( new Edge( 5, 6 ) ) );\ngraph->insert(\
    \ EdgePtr( new Edge( 5, 7 ) ) );\n```\n\nTo find all the shortest paths emanating\
    \ from node 2 is a straightforward matter of creating `SPT` template class instance.\
    \ This computes the complete shortest path tree in the constructor. The following\
    \ code snippet shows how to generate shortest paths and display the shortest path\
    \ possible between nodes 2 to 7, which in this case would be `2->1->5->7`:\n\n\
    ```cpp\n// Find shortest path between nodes 2->7\nint source = 2;\nint target\
    \ = 7;\nstd::stack<int> path;\nSPT<Graph<Edge>, Edge> sp( *graph, source );\n\
    while ( true )\n{\n  EdgePtr e = sp.pathR( target );\n  path.push( target );\n\
