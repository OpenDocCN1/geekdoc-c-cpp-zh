    std::string Population::Gray2Bin( std::string gray )


    {


    int len = gray.length();


    std::string bin = gray;


    for ( int i = len - 2; i >= 0; i-- )


    **{**


    **int** bk = bin.at( i + 1 ) - ''0'';


