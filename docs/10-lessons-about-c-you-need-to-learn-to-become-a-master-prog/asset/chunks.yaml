    # Chapter 9: Path finding in networks


    A frequently occurring requirement in solving network optimization problems is
    to find all path combinations that contain no cycles between a selected pair of
    communicating end nodes. An additional factor in finding all combinations of paths
    is that the algorithm should be able to handle both directed or undirected graphs.
    The National Institute of Standards and Technology (NIST) online Dictionary of
    Algorithms and Data Structures describes this particular problem as “all simple
    paths” and recommends a depth-first seatch to find all non-cyclical paths between
    arbitrary pairs of nodes.


    **Problem definition:** Find all simple paths from a starting vertex (source)
    to a destination vertex (sink) in a directed graph. In an undirected graph, find
    all simple paths between two vertices.


    Network connectivity is modeled using a Graph class as the means to uniquely identify
    individual links, as well as add new links and check for the presence of existing
    links. It also involves setting a graph’s directed/undirected status of added
    links.


    The algorithm used for identifying and enumerating paths uses using a recursive
    depth-first search . The search avoids repeating vertices (nodes) by marking them
    with a boolean visited value as they are visited during the recursion, then unmarking
    the node just before returning from the recursive call.


    DepthFirstSearch( Graph G, vertex v )


    {


    Set vertex v as visited;


    For ( each neighbor vertex w of v )


    {


    If ( vertex w is unvisited )


    {


    DepthFirstSearch( w );


    Add edge vw to tree T


    }


    }


    }


    ### Practical application of the depth-first algorithm


    Beginning from the start node, the depth first search algorithm examines all outgoing
    links and progresses by expanding the first child node of the search tree that
    appears. It searches progressively deeper until a target node is found, or until
    it encounters a node that has no children. The search then backtracks, returning
    to the most recent node it hasn’t finished exploring.


    **Example 1: network topology with uni-directional links**


    Here is the graphical representation of a 5-node directed graph problem used in
    the example presented here:


    ![](images/00139.jpeg)


    In the main main program loop, the network was set as having directed edges which
    are inserted using calls to the Network object’s AddLink method.


    For example a directed edge exists between nodes [1,3], but not nodes [3,1], hence
    the single arrow between the node [1,3] pair. Directed edges exist between nodes
    [1,2] and nodes [2,1], hence the bi-directional link between them.


    To find all possible combinations of paths between nodes [2,5] for example, we
    simply set the start and target nodes and feed the GetAllPaths method with them.


    The -1 value passed to GetAllPaths signifies that we do not wish to filter any
    of the search results for maximum number of hops, but return all possible paths
    it finds.


    Example main.cpp usage:


    #include "Algorithm.h"


    #include <iostream>


    #include <vector>


    const Link<int> linkset[] = { Link<int>( 1, 2 ),


    Link<int>( 1, 3 ),


    Link<int>( 1, 4 ),


    Link<int>( 2, 1 ),


    Link<int>( 2, 4 ),


    Link<int>( 2, 3 ),


    Link<int>( 3, 5 ),


    Link<int>( 4, 5 ),


    Link<int>( 5, 3 ) };


    const size_t size = sizeof( linkset ) / sizeof( linkset[ 0 ] ) ;


    const std::vector<Link<int>> links (linkset, linkset + size );


    int main()


    {


    // Create network from interconnections given


    Network nw( links, false );


    // Create the algorithm object


    Algorithm algorithm( &nw );


    // Get all paths between nodes 2 and 5


    algorithm.GetAllPaths( &nw, 2, 5, -1, -1 );


    // Output the set of paths found


    nw.ShowPaths();


    return 0;


    }


