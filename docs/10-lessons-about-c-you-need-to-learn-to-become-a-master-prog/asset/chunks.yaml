    ## 2.3 使用 DirectShow 播放媒体文件


    DirectShow 是一个由一组 API 组成的框架，软件人员可以使用它在 Windows 平台上进行媒体流。使用 DirectShow 可以让你播放或捕获音频和视频流或编辑媒体。本节是对使用
    DirectShow 的高级介绍，向你展示如何播放音频或视频文件。


    然而，使用 DirectShow 有一些前提条件。所有使用 DirectShow 的应用程序必须包含 `Dshow.h` 头文件并链接到静态库文件 `strmiids.lib`。这些对于所有
    DirectShow 应用程序都是必须的：


    ```cpp

    #include <dshow.h>

    #pragma comment(lib,"Strmiids.lib")

    ```


    由于 DirectShow 基于组件对象模型 (COM)，编写 DirectShow 应用程序需要一些应用 COM 客户端编程的知识。（如果你在某时刻希望扩展
    DirectShow 以支持新格式或开发自己的自定义效果，你将需要编写自己的组件并将它们实现为 COM 对象。）


    有必要使用 `CoInitialize()` 初始化 COM 库，然后检查结果：


    ```cpp

    HRESULT hr = CoInitialize(NULL);

    if (FAILED(hr))

    {

    std::cout << "Could not initialize COM library" << std::endl;

    return;

    }

    ```


    当你完成 COM 使用后，必须使用 `CoUninitialize()` 进行取消初始化，这意味着所有的 DirectShow 函数调用都发生在 `COM`
    `CoInitialize()` 和 `CoUninitialize()` 之间。


    通过构建过滤器图来定义此应用程序所需的 DirectShow 接口，然后控制媒体流和媒体事件处理：


    ```cpp

    IGraphBuilder *pGraph = NULL;

    IMediaControl *pControl = NULL;

    IMediaEvent *pEvent = NULL;

    ```


    调用 `CoCreateInstance()` 创建过滤器图管理器。处理媒体质的过滤器图是一个有向图，其节点表示数据处理阶段，其边表示单向数据流。过滤器图管理器还处理同步、事件通知以及控制过滤器图的其他方面。


    ```cpp

    hr = CoCreateInstance(

    CLSID_FilterGraph,

    NULL,

    CLSCTX_INPROC_SERVER,

    IID_IGraphBuilder,

    (void **)&pGraph );

    ```


    一旦创建了过滤器图管理器的实例，真正的工作就开始了。使用返回的 `IGraphBuilder` 指针查询 `IMediaControl` 和 `IMediaEvent`
    接口：


    ```cpp

    hr = pGraph->QueryInterface(IID_IMediaControl, (void **)&pControl);

    ```

