    \ of a genetic algorithm by experimenting with binary encodings such as `IEEE\
    \ 754` and `Gray` and by varying the rates of genetic operator crossover, mutation\
    \ and selection.\n\n# Chapter 8: Application of 2-opt to the Traveling Salesman\
    \ Problem\n\nA `2-opt` is a simple local search algorithm for solving 'traveling\
    \ salesman' type problems. Its operation is simple: it modifies a route that crosses\
    \ over itself, reordering it so there are no longer any crossovers and therefore\
    \ a shorter overall route:\n\n![](images/00126.jpeg)\n\nThis can be a useful technique\
    \ for finding reasonable solutions to traveling salesman problems with hundreds\
    \ or even thousands of node locations.\n\nThe Mechanism by which the `2-opt` swaps\
    \ a given route between nodes `i` and `k` to create a new route:\n\n1. add `route[0]`\
    \ to `route[i-1]` in order to the new route\n2. add `route[i]` to `route[k]` in\
    \ reverse order to the new route\n3. add `route[k+1]` to end in order to the new\
    \ route;\n\nAnd as applied to the example route above, following steps 1-3:\n\n\
    `route[ 0 to 3 ]` : Glasgow > Edinburgh > Manchester > Leeds where `i = 1`; `k\
    \ = 2`. New route:\n\n1. Glasgow\n2. Glasgow > ( Manchester > Edinburgh )\n3.\
    \ Glasgow > Manchester > Edinburgh > ( Leeds )\n\nThe complete `2-opt` swap heuristic\
    \ making use of the above mechanism to search every possible valid combination:\n\
    \n```cpp\nWhile ( no further improvement made )\n{\n    start_again:\n    best_distance\
    \ = calculateTotalDistance(existing_route)\n    for (i = 0; i < number of nodes\
    \ eligible to be swapped - 1; i++) {\n        for (k = i + 1; k < number of nodes\
    \ eligible to be swapped; k++) {\n            new_route = 2optSwap(existing_route,\
    \ i, k)\n            new_distance = calculateTotalDistance(new_route)\n      \
    \      if (new_distance < best_distance) {\n                existing_route = new_route\n\
    \                goto start_again\n            }\n        }\n    }\n}\n}\n```\n\
