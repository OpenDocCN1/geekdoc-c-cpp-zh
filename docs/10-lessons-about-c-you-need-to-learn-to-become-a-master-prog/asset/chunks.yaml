    else


    {


    bin[ i ] = gi == 1 ? ''0'' : ''1'';


    }


    }


    return bin;


    }


    // Binary to int


    long Population::Bin2Dec( std::string bin )


    {


    char * ptr;


    long parsed = strtol( bin.c_str(), & ptr, 2 );


    return parsed;


    }


