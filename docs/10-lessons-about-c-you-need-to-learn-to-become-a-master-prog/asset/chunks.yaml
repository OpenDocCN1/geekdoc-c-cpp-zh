    # Chapter 8: Application of 2-opt to the Traveling Salesman Problem


    A 2-opt is a simple local search algorithm for solving ''traveling salesman''
    type problems. Its operation is simple: it modifies a route that crosses over
    itself, reordering it so there are no longer any crossovers and therefore a shorter
    overall route:


    ![](images/00126.jpeg)


    This can be a useful technique for finding reasonable solutions to traveling salesman
    problems with hundreds or even thousands of node locations.


    The Mechanism by which the 2-opt swaps a given route between nodes i and k to
    create a new route:


    1\. add route[0] to route[i-1] in order to the new route


    2\. add route[i] to route[k] in reverse order to the new route


    3\. add route[k+1] to end in order to the new route;


    And as applied to the example route above, following steps 1-3:


    route[ 0 to 3 ] : Glasgow > Edinburgh > Manchester > Leeds where i = 1; k = 2\.
    New route:


    1\. Glasgow


    2\. Glasgow > ( Manchester > Edinburgh )


    3\. Glasgow > Manchester > Edinburgh > ( Leeds )


    The complete 2-opt swap heuristic making use of the above mechanism to search
    every possible valid combination:


    While ( no further improvement made )


    {


    start_again:


    best_distance = calculateTotalDistance(existing_route)


    for (i = 0; i < number of nodes eligible to be swapped - 1; i++) {


    for (k = i + 1; k < number of nodes eligible to be swapped; k++) {


    new_route = 2optSwap(existing_route, i, k)


    new_distance = calculateTotalDistance(new_route)


    if (new_distance < best_distance) {


    existing_route = new_route


    goto start_again


    }


    }


    }


    }


