    images/0152.jpeg


    事实上，STL 拥有大量的算法来帮助你定位存储在容器中的项。这些算法速度很快，`binary_search` 或 `equal_range` 通常是对数 级的。而
    `std::map` 等容器在插入时会将数据保持在自平衡二叉搜索树中，这在查找这些项时提供了某些性能保证。


    ### 拷贝、填充、替换和删除


