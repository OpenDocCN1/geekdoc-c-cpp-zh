    list1.push_back( "F" );


    list1.insert( ++list1.begin(), "B" );


    list2.push_front( "C" );


    list2.push_front( "D" );


    // Transfer (splice) elements from list2 into list1.


    list_it it = list1.begin();


    std::advance( it, 2 );


    list1.splice( it, list2 );


    std::cout << "list1: ";


    std::copy( list1.begin(), list1.end(),


    std::ostream_iterator<std::string>( std::cout, " " ) );


    return 0;


    }


    The output is as shown:


    ![](images/00150.jpeg)


    So the std::vector and std::list containers are examples of sequence container
    uses that implement data item storage. Other sequence containers in this category
    include std::deque**,** std::array **and** std::forward_list. In each case, all
    the container items must belong to the same data type. There can never be a mix
    of data types such as int or std::string within the same container.


    So what other uses do we have for these containers? Well, there may be times when
    you want to guarantee that the container stores unique values only and prevents
    the insertion of duplicate items. In a practical setting this might include maintaining
    a list of students enrolled on a course, or a collection of unique social security
    numbers. Therefore an associative container such as std::set  would be a reliable
    means of guaranteeing the uniqueness of inserted data items, provided the ordering
    of these unique items is of no importance.


    The std::set  container permits easy insertion and lookup of unique values by
    way of the insert and find methods respectively. That is because insert will not
    add an new item if the value of that item is already in the set, and new elements
    when inserted are automatically sorted in ascending order. Furthermore std::set,
    like other associative containers, has certain performance guarantees: the time
    required to both find and insert an item is proportional to log N, where N is
    the number of items.


    #include <set>


    #include <string>


    #include <algorithm>


    #include <iostream>


    #include <iterator>


    int main()


    {


    // Initialise sample sets


    int vals1[] = { 4, 2, 1 };


    int vals2[] = { 1, 7, 5, 2 };


    int size1 = sizeof( vals1 ) / sizeof ( vals1[ 0 ] );


    int size2 = sizeof( vals2 ) / sizeof ( vals2[ 0 ] );


    std::set<int> s1( vals1, vals1 + size1 );


    std::set<int> s2( vals2, vals2 + size2 );


    // Find the intersection, providing it with an output iterator


    std::set<int> intersect;


    set_intersection( s1.begin(),


    s1.end(),


    s2.begin(),


    s2.end(),


    std::inserter(intersect,intersect.begin()) );


    std::cout << "intersection: ";


    std::copy( intersect.begin(),


    intersect.end(),


    std::ostream_iterator<int>( std::cout, " " ) );


    return 0;


    }


    The output is as shown:


    ![](images/00151.jpeg)


    But what if you care about the position of inserted items? In this case std::set
    would not be appropriate. And in fact there is no STL container that does this
    at the moment, although std::set comes the closest because one of the types used
    to parameterize the std::set template is a comparison type. This comparison type
    determines the order in which new items are inserted. When this is not specified,
    it defaults to a less-than comparison. So to maintain a set of unique integer
    items preserved in the order in which they were inserted such as { 101, 111, 110,
    001, 101 }, std::set (while ensuring the uniqueness of the numbers inserted) would
    not maintain this particular ordering. In cases like this, the solution will likely
    to involve more complex approaches such as creating your own class to combine
    container types in your own class. You might want std::set for storing unique
    items, and std::vector  for keeping track of the order in which they were inserted:


    #include <set>


    #include <vector>


    #include <string>


    #include <algorithm>


    #include <iostream>


    typedef std::set<std::string>::iterator Iter;


    class OrderedSet


    {


    private:


    std::set<std::string> setItems;


    std::vector<Iter> setOrder;


    public:


    OrderedSet() {}


    void insert( const std::string& item )


    {


    setItems.insert( item );


    Iter it = setItems.find( item );


    setOrder.push_back( it );


    }


    int order( const std::string& item )


    {


    Iter it = setItems.find( item );


    std::vector<Iter>::iterator order_it =


    std::find( setOrder.begin(), setOrder.end(), it );


    return order_it - setOrder.begin();


    }


    };


    int main()


    {


    OrderedSet orderedSet;


    orderedSet.insert( "Bravo" );


    orderedSet.insert( "Alpha" );


    orderedSet.insert( "Charlie" );


    orderedSet.insert( "Delta" );


    std::cout << "Order = "


    << orderedSet.order("Alpha")


    << std::endl;


    return 0;


    }


    Moving on now, the std::map class allows us to store and obtain data items that
    are mapped to a key. This is useful when you need a means of quickly looking up
    a data item associated with a key value. The std::map container, while allowing
    for efficient insertion and retrieval as with std::set, differs from the std::set
    in that std::map stores pairs, rather than single values: std::map<Key, T>, where
    Key is used to reference the data object T.'
