    ## Chapter Summary


    To summarize this master lesson, you have:


    *   Implemented a recursive algorithm to solve the “all simple paths” problem
    in C++.


    *   Made further refinements and enhancements to present the results in different
    ways, such as labeling nodes with meaningful names.


    *   Applied further adjustments such as finding all paths going out from and returning
    to the same node or how to constrain the paths found to a maximum number of hops.


    # Chapter 10: The Standard Template Library


    ## 10.1 Introduction


    The Standard Template Library (STL) as introduced by Hewlett Packard to the C++
    community was revolutionary. Why? Because it gave C++ a dimension and capability
    it previously did not have. Before the library''s inception, programmers focused
    on classes and Object Oriented Programming (OOP) in an attempt to model real-world
    behaviour.


    Classes and OOP helped boost the popularity of C++ immensely. But by themselves,
    classes lacked efficiency in handling algorithms and data structures in a generic
    way. And OOP was never the holy grail it was frequently made out to be – in many
    cases it did not truly promote code reuse and modularity Until template-based
    programming was incorporated into C++, developers and companies would hand-craft
    their own data structures and algorithms by writing custom libraries and routines
    from scratch.


    Now let''s fast forward to the development of a new feature to receive serious
    attention by Alexander Stepanov (see [http://en.wikipedia.org/wiki/Alexander_Stepanov](http://en.wikipedia.org/wiki/Alexander_Stepanov))
    and other researchers: templates. These facilitated a library framework that at
    last allowed algorithms and data structures (containers) to work with arbitrary
    data types.


    STL now comprises of five kinds of components: containers, iterators, algorithms,
    function objects (functors) and allocators.


    Using these components can dramatically make your programs solid and robust in
    many ways. Here are just a few examples:


    1\. Arrays of any data type which can arbitrarily grow or shrink and incorporate
    automatic memory management as needed.


    2\. Access to a large number of powerful algorithms for searching and sorting
    data.


    3\. Set operations and other numerical transformations.


    4\. Customized code that will frequently outperform code built from scratch.


    It is no exaggeration to say that STL has made possible a revolution in the way
    software tasks get done. It has become an integral part of any C++ programmer’s
    arsenal of techniques by allowing unwieldy custom code to be replaced with programs
    that can be applied across a wide range of generic tasks. STL concepts themselves
    will be discussed in more detail in the following sections.'
