    if ( IsNumber( token ) ||


    IsFloat( token ) ||


    IsPi( token ) ||


    IsE( token ) )


    {


    outputQueue.push( token );


    }


    else if ( IsFunction( token ) )


    {


    stack.push( token );


    }


    else if ( IsComma( token ) )


    {


    std::string stackToken = stack.top();


    while ( stackToken != "(" )


    {


    outputQueue.push( stackToken );


    stack.pop(); stackToken = stack.top();


    }


    if ( stackToken == "(" )


    {


    success = true;


    }


    else


    {


    success = false;


    }


    }


    else if ( IsOperator( token ) )


    {


