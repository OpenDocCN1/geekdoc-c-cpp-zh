  \n![](img/00138.jpeg)\n\n## 章节总结\n\n总结这节主课程，你学习了如何：\n\n*   在 C++ 中应用 `2-opt` 算法，为旅行销售员测试问题生成近优解。\n\
  *   创建一个 MFC 对话应用程序，并使用标准绘制对象以图形形式展示结果。\n\n# 第 9 章：网络中的路径查找\n\n在解决网络优化问题时，经常出现的需求是找到在选定的通信端节点之间不包含环的所有路径组合。寻找所有路径组合的另一个因素是，算法应该能够处理有向图或无向图。美国国家标准与技术研究院（NIST）在线《算法与数据结构字典》将这一特定问题描述为“所有简单路径”，并推荐深度优先搜索来寻找任意节点对之间的所有非环路径。\n\
  \n**问题定义：** 在有向图中找到从起始顶点（源）到终点顶点（汇）的所有简单路径。在无向图中，找到两个顶点之间的所有简单路径。\n\n网络连通性使用 `Graph`\
  \ 类进行建模，作为唯一标识单个链接、以及添加新链接和检查现有链接存在的手段。它还涉及设置所添加链接的有向/无向状态。\n\n用于识别和枚举路径的算法使用了递归深度优先搜索。搜索通过在递归过程中访问顶点（节点）时将其标记为布尔值\
  \ `visited` 来避免重复访问顶点，然后在从递归调用返回之前取消对该节点的标记。\n\n```cpp\nDepthFirstSearch( Graph\
  \ G, vertex v )\n{\n  Set vertex v as visited;\n  For ( each neighbor vertex w of\
  \ v )\n  {\n    If ( vertex w is unvisited )\n    {\n      DepthFirstSearch( w );\n\
  \      Add edge vw to tree T\n    }\n  }\n}\n```\n\n### 深度优先算法的实际应用\n\n从起始节点开始，深度优先搜索算法检查所有出站链接，并通过扩展搜索树中出现的第一个子节点继续进行。它不断深入搜索，直到找到目标节点，或者遇到没有子节点的节点。搜索随后回溯，返回到最近未完成探索的节点。\n\
  \n**示例 1：具有单向链接的网络拓扑**\n\n以下是此处示例所示的 5 节点有向图问题的图形表示：\n\n![](img/00139.jpeg)\n\n\
  在主程序循环中，网络被设置为具有有向边，这些边通过调用 `Network` 对象的 `AddLink` 方法插入。\n\n例如，节点 `[1,3]` 之间存在有向边，但节点\
  \ `[3,1]` 之间没有，因此节点对 `[1,3]` 之间有一个箭头。节点 `[1,2]` 和节点 `[2,1]` 之间存在有向边，因此它们之间存在双向链接。\n\
  \n例如，要找到节点 `[2,5]` 之间所有可能的路径组合，只需设置起始和目标节点并将它们传递给 `GetAllPaths` 方法。\n\n传递给 `GetAllPaths`\
  \ 的 `-1` 值表示我们不想为了最大跳数过滤任何搜索结果，而是返回它找到的所有可能路径。\n\n`main.cpp` 使用示例：\n\n```cpp\n#include\
  \ \"Algorithm.h\"\n#include <iostream>\n#include <vector>\n\nconst Link<int> linkset[]\
  \ = { Link<int>( 1, 2 ),\nLink<int>( 1, 3 ),\nLink<int>( 1, 4 ),\nLink<int>( 2,\
  \ 1 ),\nLink<int>( 2, 4 ),\nLink<int>( 2, 3 ),\nLink<int>( 3, 5 ),\nLink<int>( 4,\
  \ 5 ),\nLink<int>( 5, 3 ) };\n\nconst size_t size = sizeof( linkset ) / sizeof(\
  \ linkset[ 0 ] ) ;\nconst std::vector<Link<int>> links (linkset, linkset + size\
  \ );\n\nint main()\n{\n  // 根据给定的连接创建网络\n  Network nw( links, false );\n  // 创建算法对象\n\
  \  Algorithm algorithm( nw );\n  // 获取 2 和 5 之间的所有路径\n  algorithm.GetAllPaths( &nw,\
  \ 2, 5, -1, -1 );\n  // 输出路径\n  nw.ShowPaths();\n  return 0;\n}\n```\n\n```示例 2：具有双向链接的网络拓扑**\n\
  \n![](img/00140.jpeg)\n\n在主程序循环中，网络被设置为具有有向边，这些边通过调用 `Network` 对象的 `AddLink` 方法插入。例如，节点\
  \ `[1,3]` 之间存在有向边，但节点 `[3,1]` 之间没有，因此节点对 `[1,3]` 之间有一个箭头。节点 `[1,2]` 和节点 `[2,1]`\
  \ 之间存在有向边，因此它们之间存在双向链接。\n\n例如，要找到节点 `[2,5]` 之间所有可能的路径组合，只需设置起始和目标节点并将它们传递给 `GetAllPaths`\
  \ 方法。传递给 `GetAllPaths` 的 `-1` 值表示我们不想为了最大跳数过滤任何搜索结果，而是返回它找到的所有可能路径。\n\n`main.cpp`\
  \ 使用示例：\n\n```cpp\n#include \"Algorithm.h\"\n#include <iostream>\n#include <vector>\n\
  \nconst Link<int> linkset[] = { Link<int>( 1, 2 ),\nLink<int>( 1, 3 ),\nLink<int>(\
  \ 1, 4 ),\nLink<int>( 2, 1 ),\nLink<int>( 2, 4 ),\nLink<int>( 2, 3 ),\nLink<int>(\
  \ 3, 5 ),\nLink<int>( 4, 5 ),\nLink<int>( 5, 3 ) };\n\nconst size_t size = sizeof(\
  \ linkset ) / sizeof( linkset[ 0 ] ) ;\nconst std::vector<Link<int>> links (linkset,\
  \ linkset + size );\n\nint main()\n{\n  // 根据给定的连接创建网络\n  Network nw( links, false\
  \ );\n  // 创建算法对象\n  Algorithm algorithm( &nw );\n  // 获取 2 和 5 之间的所有路径\n  algorithm.GetAllPaths(\
  \ &nw, 2, 5, -1, -1 );\n  // 输出路径\n  nw.ShowPaths();\n  return 0;\n}\n```\n\n这提供了寻找\
  \ 2 和 5 之间所有路径的输出：\n\n![](img/00141.jpeg)\n\n**示例 3：按最大跳数过滤**\n\n我们可能希望限制找到的路径，其最大跳数不超过设定的\
  \ 4 跳。通过另一个简单的微调可以实现这一点。只需将传递给 `Algorithm::GetAllPaths` 的 `max_hops` 参数设置为大于 0 的值。`min_hops`\
  \ 参数保持默认值 -1：\n\nalgorithm.GetAllPaths( &nw, 2, 5, 4, -1 );\n\n使用与示例 2 相同的网络重新运行程序，得到以下路径（限制为最大\
  \ 4 跳）：\n\n![](img/00142.jpeg)\n\n**示例 4：任意标记网络节点**\n\n一种可能的改进是允许节点使用字符串变量和整数进行标记。考虑以下代表英国城镇和城市的\
  \ 9 节点网络：\n\n![](img/00143.jpeg)\n\n由于我们想要标记节点标记以提供更有意义的描述，可以在唯一标识每个创建的节点的整数与描述它的文本标签之间维护双向映射。假设我们希望构建上述网络，并在无向表示图中找到从布斯尔到爱丁堡的所有可能路径。用法如下：\n\
  \n```cpp\n#include \"Algorithm.h\"\n#include <iostream>\n#include <vector>\n```\n\
  \n\n\n\n\n```cpp\nconst Link<std::string> linkset[] =\n{\n Link<std::string>( \"\
  Bristol\", \"London\" ),\nLink<std::string>( \"Bristol\", \"Cardiff\" ),\nLink<std::string>(\
  \ \"Oxford\", \"Cardiff\" ),\nLink<std::string>( \"Glasgow\", \"Manchester\" ),\n\
  Link<std::string>( \"Manchester\", \"Leeds\" ),\nLink<std::string>( \"Manchester\"\
  , \"Cardiff\" ),\nLink<std::string>( \"Glasgow\", \"Edinburgh\" ),\nLink<std::string>(\
  \ \"Edinburgh\", \"Newcastle\" ),\nLink<std::string>( \"Leeds\", \"London\" ),\n\
  Link<std::string>( \"Newcastle\", \"Leeds\" ) };\n\nconst size_t size = sizeof(\
  \ linkset ) / sizeof( linkset[ 0 ] ) ;\n\nconst std::vector<Link<std::string>> links\
  \ (linkset, linkset + size );\n\nint main()\n{\n// 根据给定的连接创建网络\nNetwork nw( links,\
  \ true );\n// 创建算法对象\nAlgorithm algorithm( &nw );\n// 获取节点 Bristol 和 Edinburgh 之间的所有路径\n\
  algorithm.GetAllPaths( &nw, \"Bristol\", \"Edinburgh\", -1, -1 );\n// 输出找到的路径集合\n\
  nw.ShowPaths();\nreturn 0;\n}\n```\n\n这输出了以下结果：\n\n![](img/00145.jpeg)\n\n## 示例\
  \ 5：寻找同一节点之间的所有路径\n\n你可能想要找到同一个节点之间的所有路径。考虑以下具有双向链接的网络：\n\n![](img/00146.jpeg)\n\
  \n要找到从节点 2 开始并返回节点 2 的所有路径，示例所示：\n\n```cpp\n#include \"Algorithm.h\"\n#include <iostream>\n\
  #include <vector>\nconst Link<int> linkset[] = { Link<int>( 1, 2 ),\nLink<int>(\
  \ 1, 3 ),\nLink<int>( 1, 4 ),\nLink<int>( 2, 1 ),\nLink<int>( 2, 4 ),\nLink<int>(\
  \ 2, 3 ),\nLink<int>( 3, 5 ),\nLink<int>( 4, 5 ),\nLink<int>( 5, 3 ) };\n\nconst\
  \ size_t size = sizeof( linkset ) / sizeof( linkset[ 0 ] ) ;\n\nconst std::vector<Link<int>>\
  \ links (linkset, linkset + size );\n\nint main()\n{\n// 根据给定的连接创建网络\nNetwork nw(\
  \ links, true );\n// 创建算法对象\nAlgorithm algorithm( &nw );\n// 获取节点 2 和 2 之间的所有路径\n\
  algorithm.GetAllPaths( &nw, 2, 2, -1, -1 );\n// 输出找到的路径集合\nnw.ShowPaths();\nreturn\
  \ 0;\n}\n```\n\n这列出了所有通往和标记为 2 的节点的路径列表：\n\n![](img/00147.jpeg)\n\n如果你不想获得像 `2 –\
  \ 1 – 2` 这样的路径，可以指定最小跳数数为 3：\n\n```cpp\nalgorithm.GetAllPaths( &nw, 2, 2, -1, 3\
  \ );\n```\n\n这将给出以下路径列表：\n\n![](img/00148.jpeg)\n\n### 完整代码列表\n\n#### Graph.h\n\
  ```cpp\n#pragma once\n#include \"PriorityQueue.h\"\n#include <vector>\n#include\
  \ <memory>\n\nclass Edge\n{\npublic:\nint v, w;\ndouble wt;\nEdge(int v = -1, int\
  \ w = -1, double wt = 0.0) :\nv(v), w(w), wt(wt) { }\n};\n\ntypedef std::shared_ptr<Edge>\
  \ EdgePtr;\n\ntemplate <class Edge>\nclass DenseGRAPH\n{\nprivate:\nint Vcnt, Ecnt;\n\
  bool digraph;\nstd::vector <std::vector <EdgePtr>> adj;\npublic:\nDenseGRAPH(int\
  \ V, bool digraph = false) :\nadj(V), Vcnt(V), Ecnt(0), digraph(digraph)\n{\nfor\
  \ ( int i = 0; i < V; i++ ) {\nadj[ i ].resize( V );\n}\n}\nint V() const { return\
  \ Vcnt; }\nint E() const { return Ecnt; }\nbool directed() const { return digraph;\
  \ }\nvoid insert( EdgePtr e )\n{\nint v = e->v;\nint w = e->w;\nif (adj[v][w] ==\
  \ 0) Ecnt++;\nadj[v][w] = e;\nif (!digraph)\nadj[w][v] = e;\n}\nvoid remove(EdgePtr\
  \ e)\n{\nint v = e->v; int w = e->w;\nif (adj[v][w] != 0) Ecnt--;\nadj[v][w] = 0;\n\
  if (!digraph) adj[w][v] = 0;\n}\nEdgePtr edge(int v, int w) const\n{\nreturn adj[v][w];\n\
  }\nclass adjIterator;\nfriend class adjIterator;\n};\n\ntemplate <class Edge>\n\
  class DenseGRAPH<Edge>::adjIterator\n{\nprivate:\nconst DenseGRAPH &G;\nint i, v;\n\
  public:\nadjIterator(const DenseGRAPH<Edge> &G, int v) :\nG(G), v(v), i(0) {}\n\
  EdgePtr beg() { i = -1; return nxt(); }\nEdgePtr nxt()\n{\nfor (i++; i < G.V();\n\
  if (G.edge(v, i))\nreturn G.adj[v][i];\nreturn 0;\n}\nbool end() const { return\
  \ i >= G.V(); }\n};\n\n#### PriorityQueue.h\n```cpp\n#include <memory>\n#include\
  \ <vector>\ntemplate <class keyType>\nclass PriorityQueue\n{\nprivate:\nint d, N;\n\
  std::vector<int> pq, qp;\nconst std::vector<keyType> &a;\nvoid Exchange(int i, int\
  \ j)\n{\nint t = pq[i];\npq[i] = pq[j];\npq[j] = t;\nqp[i] = i;\nqp[j] = j;\n}\n\
  void fixUp(int k)\n{\nwhile (k > 1 && a[pq[(k-1)/d]] > a[pq[k]])\n{\nExchange(k,\
  \ (k-1)/d);\nk = (k-1)/d;\n}\n}\nvoid fixDown(int k, int N)\n{\nint j;\nwhile ((j\
  \ = d*(k-1)+2) <= N)\n{\nfor (int i = j+1; i < j+d; i++)\nif (a[pq[j]] > a[pq[i]])\n\
  j = i;\nif (!(a[pq[k]] > a[pq[j]]))\nbreak;\nExchange(k, j);\nk = j;\n}\n}\npublic:\n\
  PriorityQueue(int N, const std::vector<keyType> &a, int d = 2) :\na(a), pq(N+1,\
  \ 0), qp(N+1, 0), N(0), d(d) {}\nint empty() const { return N == 0; }\nvoid insert(int\
  \ v)\n{\npq[++N] = v;\nqp[N] = N;\nfixUp(N);\n}\nint getmin()\n{\nExchange(1, N);\n\
  fixDown(1, N-1);\nreturn pq[N--];\n}\nvoid lower(int k)\n{\nfixUp(k);\n}\n};\n```\n\
  \n#### Network.h\n```cpp\n#pragma once\n#include \"Graph.h\"\n#include <vector>\n\
  #include <map>\n#include <string>\ntypedef std::vector<int> Path;\ntypedef std::vector<Path>\
  \ PathSet;\ntypedef std::vector<Path>::const_iterator Paths;\ntemplate< class T\
  \ >\nclass Link\n{\nprivate:\nT from;\nT to;\ndouble weight;\npublic:\nLink( const\
  \ T& from, const T& to, const double &weight = 1.0 ) :\nfrom( from ), to( to ),\
  \ weight( weight ) {}\nconst T& From() const\n{ return from; }\nconst T& To() const\n\
  { return to; }\nconst double& Weight() const\n{ return weight; }\n};\nclass Network\n\
  {\nprivate:\nDenseGRAPH<Edge>* graph;\nPathSet pathset;\nstd::map<std::string, int\
  \ > label2index;\nstd::map<int, std::string > index2label;\npublic:\nNetwork() {}\n\
  Network( const std::vector<Link<std::string >& links,\nconst bool& bi = false );\n\
  Network( const std::vector<Link<int> >& links,\nconst bool& bi = false );\n~Network();\n\
  void AddPath( const Path& p );\nvoid ShowPaths() const;\nint NodeIndex( const std::string&\
  \ label ) const;\nstd::vector<int> GetAdjNodeIDs( const int& n ) const;\n};\n```\n\
  \n#### Network.cpp\n```cpp\n#include \"Network.h\"\n#include <iostream>\n#include\
  \ <sstream>\n#include <iterator>\n#include <algorithm>\n#include <set>\n#include\
  \ <stack>\nNetwork::~Network()\n{\nif ( graph != NULL ) {\ndelete graph;\ngraph\
  \ = NULL;\n}\n}\nNetwork::Network( const std::vector<Link<std::string>>& links,\n\
  const bool& bi_connected )\n{\ntypedef std::vector<Link<std::string>>::const_iterator\
  \ v_iter;\nlabel2index.clear();\nindex2label.clear();\nstd::set<std::string> unique_id_str;\n\
  for ( v_iter it = links.begin(); it != links.end(); ++it ) {\nconst Link<std::string>\
  \ l = (*it);\nstd::string first = l.From();\nstd::string second = l.To();\nunique_id_str.insert(\
  \ first );\nunique_id_str.insert( second );\n}\nint i = 0;\nfor ( std::set<std::string>::const_iterator\
  \ it = unique_id_str.begin();\nit != unique_id_str.end();\n++it )\n{\nstd::string\
  \ label = (*it);\nindex2label[ i ] = label;\nlabel2index[ label ] = i;\ni++;\n}\n\
  std::set<int> unique_ids;\nconst int nodes = unique_id_str.size();\ngraph = new\
  \ DenseGRAPH<Edge>( nodes + 1, !bi_connected );\nfor ( v_iter it = links.begin();\
  \ it != links.end(); ++it )\n{\nconst Link<std::string> l = (*it);\nstd::string\
  \ first = l.From();\nstd::string second = l.To();\nint s = label2index.find( first\
  \ )->second;\nint d = label2index.find( second )->second;\ndouble weight = l.Weight();\n\
  EdgePtr e( new Edge( s, d, weight ) );\ngraph->insert( e );\n}\n}\nNetwork::Network(\
  \ const std::vector<Link<int>>& links,\nconst bool& bi_connected )\n{\ntypedef std::vector<Link<int>>::const_iterator\
  \ v_iter;\nlabel2index.clear();\nindex2label.clear();\nstd::set<std::string> unique_id_str;\n\
  for ( v_iter it = links.begin(); it != links.end(); ++it )\n{\nconst Link<int> l\
  \ = (*it);\nint first = l.From();\nint second = l.To();\nstd::string strFirst =\
  \ std::to_string(first);\nstd::string strSecond = std::to_string(second);\nunique_id_str.insert(\
