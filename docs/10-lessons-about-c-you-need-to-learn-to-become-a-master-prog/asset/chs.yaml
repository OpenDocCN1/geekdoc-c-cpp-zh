  \ = (CHeaderCtrl*)GetDlgItem( 0 );\n    int nColumnCount = pHeader->GetCount();\n\
  }\n```（等等，原文在函数内部有特定的逻辑，让我根据提供的文本进行重新格式化）\n\n```cpp\nint CEditableListCtrl::GetRowFromPoint(\
  \ CPoint &point, int *col ) const\n{\n    int column = 0;\n    int row = HitTest(\
