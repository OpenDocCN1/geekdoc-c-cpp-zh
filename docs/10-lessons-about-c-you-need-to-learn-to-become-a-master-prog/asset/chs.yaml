  \ `C++` 中开发遗传算法程序的实际示例，并将其应用于困难的优化问题，以便在连续迭代中生成更好的解决方案。\n*   演示了如何通过尝试如 `IEEE 754`\
  \ 和 `Gray` 等二进制编码，以及通过改变遗传算子交叉、变异和选择的速率，来提高遗传算法的性能。\n\n# 第 8 章：2-opt 在旅行销售员问题中的应用\n\
  \n`2-opt` 是一种解决“旅行销售员”类型问题的简单局部搜索算法。它的操作非常简单：修改一条自交叉的路线，对其进行重新排序使其不再有交叉，从而获得更短的整体路线：\n\
  \n![](img/00126.jpeg)\n\n这对于具有数百甚至数千个节点节点的旅行销售员问题寻找合理的解决方案是一种有用的技术。\n\n`2-opt` 在节点\
  \ `i` 和 `k` 之间交换给定路线以创建新路线的机制：\n\n1. 将 `route[0]` 添加到 `route[i-1]` 以形成新路线\n2. 将\
  \ `route[i]` 以反序添加到 `route[k]` 以形成新路线\n3. 将 `route[k+1]` 添加到末尾以形成新路线；\n\n将上述步骤 1-3\
  \ 应用于示例路线中：\n\n`route[ 0 to 3 ]`：格拉斯哥 (Glasgow) > 爱丁堡 (Edinburgh) > 曼彻斯特 (Manchester)\
  \ > 利兹 (Leeds)，其中 `i = 1`; `k = 2`。新路线：\n\n1. 格拉斯哥\n2. 格拉斯哥 > ( 曼彻斯特 > 爱丁堡 )\n3.\
  \ 格拉斯哥 > 曼彻斯特 > 爱丁堡 > ( 利兹 )\n\n利用上述机制搜索所有可能的有效组合的完整 `2-opt` 交换启发式算法：\n\n```cpp\n\
  While ( 没有进一步改进 )\n{\n    start_again:\n    best_distance = calculateTotalDistance(existing_route)\n\
  \    for (i = 0; i < 允许交换的节点数 - 1; i++) {\n        for (k = i + 1; k < 允许交换的节点数;\
  \ k++) {\n            new_route = 2optSwap(existing_route, i, k)\n            new_distance\
  \ = calculateTotalDistance(new_route)\n            if (new_distance < best_distance)\
  \ {\n                existing_route = new_route\n                goto start_again\n\
  \            }\n        }\n    }\n}\n```\n\n文中还描述了如何创建一个 Visual Studio 2010 对话框项目来实现该优化算法并图形化展示输出，以及将程序应用于标准旅行销售员测试问题的结果。\n\
