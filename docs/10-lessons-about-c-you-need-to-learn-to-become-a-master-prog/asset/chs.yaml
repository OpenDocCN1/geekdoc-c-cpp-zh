  ```cpp\n#include \"StdAfx.h\"\n#include \"TSPalgorithm.h\"\nTSPalgorithm::TSPalgorithm(){}\n\
  TSPalgorithm::~TSPalgorithm(){}\n// 设置要运行的 TSP 问题\nvoid TSPalgorithm::Initialize(\n\
  const int& iter,\nCoordMatrix* mat )\n{\n    tour.SetMatrix( mat );\n    new_tour.SetMatrix(\
  \ mat );\n    iterations = iter;\n}\n// 执行优化算法\nvoid TSPalgorithm::Run()\n{\n  \
  \  tour.Reset();\n    tour.CreateNearestNeighbourTour();\n    TwoOpt();\n}\n// 根据索引获取路径节点\n\
  int TSPalgorithm::GetTourCity( const int& index )\n{\n    return tour.GetCity( index\
  \ );\n}\n// 通知观察者变化\nvoid TSPalgorithm::Notify( const int& dist )\n{\n    for (\
  \ std::vector<Observer*>::iterator it = ob_set.begin();\n    it != ob_set.end();\n\
  \    it++ )\n    {\n        (*it)->UpdateDisplay( dist );\n    }\n}\n// 添加观察者\n\
  void TSPalgorithm::AddObserver( Observer* ob )\n{\n    ob_set.push_back( ob );\n\
  }\n// 执行所有的 2-opt 组合\nvoid TSPalgorithm::TwoOpt()\n{\n    int size = tour.TourSize();\n\
  \    new_tour = tour;\n    bool improve = true;\n    double best_distance, new_distance;\n\
  \    while ( improve )\n    {\n        best_distance = tour.TourDistance();\n  \
  \      improve = false;\n        for ( int i = 0; i < size - 1; i++ )\n        {\n\
  \            for ( int k = i + 1; k < size; k++)\n            {\n              \
  \  TwoOptSwap( i, k );\n                new_distance = new_tour.TourDistance();\n\
  \                if ( new_distance < best_distance )\n                {\n      \
  \              improve = true;\n                    tour = new_tour;\n         \
  \           best_distance = new_distance;\n                    Notify( tour.TourDistance()\
  \ );\n                    break;\n                }\n            }\n           \
  \ if (improve) break;\n        }\n    }\n}\n\nvoid TSPalgorithm::TwoOptSwap( const\
  \ int& i, const int& k )\n{\n    for ( int c = 0; c <= i - 1; ++c )\n    {\n   \
  \     new_tour.SetCity( c, tour.GetCity( c ) );\n    }\n    int dec = 0;\n    for\
  \ ( int c = i; c <= k; ++c )\n    {\n        new_tour.SetCity( c, tour.GetCity(\
  \ k - dec ) );\n        dec++;\n    }\n    for ( int c = k + 1; c < tour.TourSize();\
  \ ++c )\n    {\n        new_tour.SetCity( c, tour.GetCity( c ) );\n    }\n}\n```\n\
