  \n## 章节总结\n\n完成本节后，你现在拥有：\n\n*   一个基于调度场算法（shunting-yard algorithm）的数学表达式解析器运行示例。\n\
  *   更好地理解了如何将伪代码（为了人类理解而非计算机编写）转换为可运行的 C++ 代码。\n\n# 第 7 章：遗传算法函数优化器\n\n这里展示了一个如何将采用标准遗传算子（交叉、变异和选择）的算法应用于优化标准数学函数，例如罗森\
  \ brock 函数（Rosenbrock function）：\n\n![](img/00121.jpeg)\n\nRosenbrock 函数是一种非凸函数，它由\
  \ Howard H. Rosenbrock 在 1960 年引入，用于测试优化算法的效率和有效性。Rosenbrock 函数定义如下：\n\n![](img/00122.jpeg)\n\
  \n如图所示，全局最小值位于一个长而窄的抛物线形状平坦山谷内部。定位山谷附近非常简单。但收敛到位于此处的全局最小值：\n\n![](img/00123.jpeg)\n\
  \n则变得更具挑战性。该应用将标准的遗传算子（交叉、变异和选择）应用于浮点数的染色体表示。使用二进制数组表示实数的方法有很多。在本应用中，IEEE 754 标准是其中一种方法，浮点数用\
  \ 32 位表示。还介绍了使用格雷码（Gray codes）的实验。简而言之，第一位表示符号（0 = 正，1 = 负）；随后的 8 位存储偏置指数（bias=127），剩余\
  \ 23 位表示小数部分（尾数）。关于这些算子如何工作的深入描述超出了本文的范围，且已有大量的资料可用。这里提供的代码示例应该具有相当的自解释性。\n\n32\
  \ 位二进制编码使用 `Chromosome` 类实现，用于存储二进制值并执行其他简单的 get/set 任务等。`Population` 类维护了一个 `Chromosome`\
  \ 对象的种群，并在它们上应用标准的遗传算子交叉、变异和选择。它还会生成一个具有随机值的初始任意染色体种群，并具有其他辅助函数，用于二进制字符串与十进制表示之间的转换：\n\
  \n`GeneticAlgorithm` 类运行遗传算法算子并将其应用于染色体种群，旨在逐步提高整体解决方案的适应度。\n\n### 使用 IEEE 754 编码运行遗传算法\n\
  \n我运行了一些简单的实验，以观察算法在 10,000 次迭代中的收敛情况。对于第一个实验（使用浮点数的 IEEE 754 位字符串表示），使用的算法参数如下：\n\
  \n```cpp\nencoding_type = 1; // IEEE 754\ncrossover_rate = 50;\nmutation_rate =\
  \ 5;\npopulation_size = 100;\ntournament_size = population_size / 4;\n```\n\n我使用锦标选择（tournament\
  \ selection）作为首选的“优胜劣汰”机制。代码包含一个简单的日志器，可以将结果导出到文本文件中。每代找到最好的：\n\n![](img/00124.jpeg)\n\
  \n### 使用格码运行遗传算法\n\n我运行了一些简单的实验，以观察算法在 10,000 次迭代中的收敛情况。对于第一个实验（使用浮点数的 IEEE 754\
  \ 位字符串表示），使用的算法参数如下：\n\n```cpp\nencoding_type = 1; // IEEE 754\ncrossover_rate =\
  \ 50;\nmutation_rate = 5;\npopulation_size = 100;\ntournament_size = population_size\
  \ / 4;\n```\n\n我使用锦标选择作为首选的“优胜劣汰”机制。代码包含一个简单的日志器，可以将结果导出到文本文件中。每代找到最好的：\n\n![](img/00125.jpeg)\n\
  \n### 完整代码列表\n\n#### Chromosome.h\n```cpp\n#pragma once\nconst int chrSize = 64;\n\
  class Chromosome\n{\npublic:\n    Chromosome();\n    ~Chromosome();\n    void SetFitness(const\
  \ double& value);\n    void SetChromosome(const int& index, const unsigned char&\
