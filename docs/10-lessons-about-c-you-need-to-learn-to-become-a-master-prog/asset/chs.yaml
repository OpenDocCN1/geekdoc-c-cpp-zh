  \n我们创建一个 `CEdit` 类的派生实例以满足若干要求：它需要发送 `LVN_ENDLABELEDIT` 消息并在编辑完成后自销毁；稍微扩展空间以容纳文本；并且在按下\
  \ Escape 或 Enter 键或编辑控件失去焦点时终止。\n\n```cpp\nclass CInPlaceEdit : public CEdit\n{\n\
  public:\n    CInPlaceEdit(int iItem, int iSubItem, CString sInitText);\n    // 类向生成的虚函数覆盖\n\
  \    //{{AFX_VIRTUAL(CInPlaceEdit)\n    public: virtual BOOL PreTranslateMessage(MSG*\
  \ pMsg);\n    //}}AFX_VIRTUAL\n    public: virtual ~CInPlaceEdit();\n    // 的的消息映射函数\n\
  protected:\n    //{{AFX_MSG(CInPlaceEdit)\n    afx_msg void OnKillFocus(CWnd* pNewWnd);\n\
  \    afx_msg void OnNcDestroy();\n    afx_msg void OnChar(UINT nChar, UINT nRepCnt,\
  \ UINT nFlags);\n    afx_msg int OnCreate(LPCREATESTRUCT lpCreateStruct);\n    //}}AFX_MSG\n\
  \    DECLARE_MESSAGE_MAP()\nprivate:\n    int m_iItem;\n    int m_iSubItem;\n  \
  \  CString m_sInitText;\n    BOOL m_bESC;\n};\n```\n\n派生的 `CEdit` 控件 `CInPlaceEdit`\
  \ 描述如下。覆盖的 `PreTranslateMessage()` 决定某些按键输入是否传递到编辑控件。`OnKillFocus()` 发送 `LVN_ENDLABELEDIT`\
  \ 通知并销毁编辑控件。该通知发送给列表视图控件的父窗口而不是发送给列表视图控件本身。在发送通知时，使用成员变量 `m_bESC` 来决定是否发送 `NULL`\
  \ 字符串。`OnNcDestroy()` 是销毁 C++ 对象的适当位置。`OnChar()` 函数在按下 Escape 或 Enter 键时终止编辑。\n\n\
  否则，对于任何其他字符，它让基类函数在尝试确定控件是否需要调整大小之前先处理。该函数获取新字符串的范围，然后将其与编辑控件的尺寸进行比较。如果字符串太长无法放入编辑控件中，则在检查是否有足够空间扩展后，调整编辑控件的大小。\n\
  \n`OnCreate()` 创建编辑控件并用正确的值对其进行初始化。\n\n`CInPlaceEdit` 控件的完整代码列表：\n\n```cpp\nCInPlaceEdit::CInPlaceEdit(int\
  \ iItem, int iSubItem, CString sInitText):m_sInitText( sInitText )\n{\n    m_iItem\
  \ = iItem;\n    m_iSubItem = iSubItem;\n    m_bESC = FALSE;\n}\n\nCInPlaceEdit::~CInPlaceEdit(){}\n\
  \nBEGIN_MESSAGE_MAP(CInPlaceEdit, CEdit)\n//{{AFX_MSG_MAP(CInPlaceEdit)\nON_WM_KILLFOCUS()\n\
  ON_WM_NCDESTROY()\nON_WM_CHAR()\nON_WM_CREATE()\n//}}AFX_MSG_MAP\nEND_MESSAGE_MAP()\n\
  \n// CInPlaceEdit 消息处理器\n// 在窗口消息分发到 TranslateMessage 和 DispatchMessage Windows\
  \ 函数之前对其进行翻译。\nBOOL CInPlaceEdit::PreTranslateMessage(MSG* pMsg)\n{\n    if( pMsg->message\
  \ == WM_KEYDOWN )\n    {\n        if(pMsg->wParam == VK_RETURN ||\n            pMsg->wParam\
  \ == VK_DELETE ||\n            pMsg->wParam == VK_ESCAPE ||\n            GetKeyState(\
  \ VK_CONTROL ) )\n        {\n            ::TranslateMessage(pMsg);\n           \
  \ ::DispatchMessage(pMsg);\n            return TRUE;\n            // 不要继续处理\n  \
  \      }\n    }\n    return CEdit::PreTranslateMessage(pMsg);\n}\n\n// 在失去输入焦点之前立即调用\n\
  void CInPlaceEdit::OnKillFocus(CWnd* pNewWnd)\n{\n    CEdit::OnKillFocus(pNewWnd);\n\
  \    CString str;\n    GetWindowText(str);\n    DestroyWindow();\n}\n\n// 在非客户区域被销毁时调用\n\
  void CInPlaceEdit::OnNcDestroy()\n{\n    CEdit::OnNcDestroy();\n    delete this;\n\
  }\n\n// 为非系统字符按键输入调用\nvoid CInPlaceEdit::OnChar(UINT nChar, UINT nRepCnt, UINT nFlags)\n\
  {\n    if( nChar == VK_ESCAPE || nChar == VK_RETURN)\n    {\n        if( nChar ==\
  \ VK_ESCAPE )\n        {\n            m_bESC = TRUE;\n        }\n        GetParent()->SetFocus();\n\
  \        return;\n    }\n    CEdit::OnChar(nChar, nRepCnt, nFlags);\n\n    // 如果需要调整编辑控件大小\n\
  \    CString str;\n    GetWindowText( str );\n    CWindowDC dc(this);\n    CFont\
  \ *pFont = GetParent()->GetFont();\n    CFont *pFontDC = dc.SelectObject( pFont\
  \ );\n    CSize size = dc.GetTextExtent( str );\n    dc.SelectObject( pFontDC );\n\
  \    size.cx += 5;\n\n    // 获取客户矩形\n    CRect rect, parentrect;\n    GetClientRect(\
  \ &rect );\n    GetParent()->GetClientRect( &parentrect );\n\n    // 将矩形转换为父窗口坐标\n\
  \    ClientToScreen( &rect );\n    GetParent()->ScreenToClient( &rect );\n\n   \
  \ // 检查控件是否需要调整大小以及是否有足够的空间\n    if( size.cx > rect.Width() )\n    {\n        if(\
  \ size.cx + rect.left )\n        {\n            // ... 调整大小逻辑\n        }\n    }\n\
  }\n```\n\n\n\n\n\n```cpp\nint l_iItem = m_EditableList.InsertItem(LVIF_TEXT|LVIF_STATE,\
  \ 0, \"Andrew\", 0, LVIS_SELECTED, 0, 0);\nm_EditableList.SetItemText( l_iItem,\
  \ 1, \"Bricklayer\" );\nm_EditableList.SetItemText( l_iItem, 2, \"Australia\" );\n\
  l_iItem = m_EditableList.InsertItem(LVIF_TEXT|LVIF_STATE, 0, \"Peter\", 0, LVIS_SELECTED,\
  \ 0, 0);\nm_EditableList.SetItemText( l_iItem, 1, \"Lecturer\" );\nm_EditableList.SetItemText(\
  \ l_iItem, 2, \"New Zealand\" );\nl_iItem = m_EditableList.InsertItem(LVIF_TEXT|LVIF_STATE,\
  \ 0, \"Richard\", 0, LVIS_SELECTED, 0, 0);\nm_EditableList.SetItemText( l_iItem,\
  \ 1, \"Dentist\" );\nm_EditableList.SetItemText( l_iItem, 2, \"Botswana\" );\nreturn\
  \ TRUE; // return TRUE unless you set the focus to a control\n}\n```\n\n#### 第 5\
  \ ：引入处理更新和 Windows 消息的通知器\n\n从 Windows 消息映射开始：\n\n```cpp\nBEGIN_MESSAGE_MAP(CEditableListControlDlg,\
  \ CDialogEx)\nON_WM_SYSCOMMAND()\nON_WM_PAINT()\nON_WM_QUERYDRAGICON()\nON_NOTIFY(NM_CLICK,\
  \ IDC_LIST1, OnNMClickList)\nON_MESSAGE(WM_NOTIFY_DESCRIPTION_EDITED, OnNotifyDescriptionEdited)\n\
  END_MESSAGE_MAP()\n```\n\n当用户特别点击编辑列表控件时：\n\n```cpp\nvoid CEditableListControlDlg::OnNMClickList(NMHDR\
  \ *pNMHDR, LRESULT *pResult)\n{\n    m_fClickedList = true;\n    m_EditableList.OnLButtonDown(\
  \ MK_LBUTTON, InterviewListCursorPosition() );\n    *pResult = 0;\n}\n```\n\n此外添加一个通知器来处理编辑控件已更新的情况：\n\
  \n```cpp\nLRESULT CEditableListControlDlg::OnNotifyDescriptionEdited(WPARAM wParam,\
  \ LPARAM lParam)\n{\n    // 通过回调获取过的 Description 字段文本\n    LV_DISPINFO* dispinfo\
  \ = reinterpret_cast<LV_DISPINFO*>(lParam);\n    // 更新文本时持久化所选的附件细节\n    m_EditableList.SetItemText(\n\
  \        dispinfo->item.iItem,\n        dispinfo->item.iSubItem,\n        dispinfo->item.pszText\
  \ );\n    return 0;\n}\n```\n\n运行示例项目查看显示的列表控件条目：\n\n![](img/00023.jpeg)\n\n然后查看左点击单个单元格时，它们如何变为可编辑，并在编辑控件周围出现轮廓：\n\
  \n![](img/00024.jpeg)\n\n以及查看如果用户选择，任何字段都可以被编辑：\n\n![](img/00025.jpeg)\n\n## 章节总结\n\
  \n总结这 10 节大师课程中的第一节，我们学习了如何：\n\n* 创建第一个带有事件处理的 Windows 应用程序。\n* 通过编程和使用 MFC 向导创建对话框应用程序。\n\
  * 在对话框应用程序中添加控件。\n* 创建自定义 MFC 控件，例如 `CListCtrl`（通常是只读的），使其单个网格项目变为可修改。\n\n# 第 2\
  \ 章：进阶 Windows 编程\n\n## 2.1 构建网页浏览器\n\n在 Visual C++ 中创建网页浏览器非常简单。这是因为 Microsoft\
  \ Internet Explorer 随 Visual C++ 提供，通过几个简单的步骤就可以像其他其他控件一样作为 Windows 控件使用。创建一个简单浏览器的过程可以总结为：为你的\
  \ Windows 程序添加 Microsoft Web Browser 控件，为它创建一个成员控件变量，并使用 `Navigate` 方法浏览你选择的在线位置。然后添加一个编辑控件来指定你想要浏览的网站\
  \ URL。\n\n使用 AppWizard 创建一个名为 `WebBrowser` 的新对话框应用程序。\n\n![](img/00026.jpeg)\n\n\
  确保你的应用程序可以使用 Microsoft Web Browser。在工具箱（Toolbox）窗口中，右键点击并选择选择项目...（Choose Items...）（对于较旧版本的\
  \ Microsoft Visual Studio，你可能需要通过选择 Project > Add to Project > Components and Controls，然后双击标记为\
  \ Registered ActiveX Controls 的项来访问此选项）。当选择工具箱项目的对话框出现时，选择 COM Components 选项卡，并选择\
  \ Microsoft Web Browser 控件：\n\n![](img/00027.jpeg)\n\n浏览器控件将出现在工具箱窗口：\n\n![](img/00028.jpeg)\n\
  \n在资源视图（Resource View）中，将此新添加的控件拖到对话框窗口上，并根据喜好调整大小。然后添加一个编辑控件以输入 URL 字符串变量，并向对话框添加一个标题为\
  \ Browse（浏览）的按钮（你可以通过设置属性来修改自动生成的 OK 按钮）。右键点击 OK 按钮，选择属性，并将标题从 OK 重命名为 Browse。将其\
  \ ID 从 `IDOK` 重命名为 `ID_BROWSE`：\n\n![](img/00029.jpeg)\n\n现在为添加的每个控件创建成员变量。对于第一个控件，右键点击它，选择添加变量（Add\
  \ Variable）并给它一个如 `m_WebBrowser` 的名称。在添加变量向导中：\n\n![](img/00030.jpeg)\n\n对于下一个控件，用于输入\
  \ URL 的控件，右键点击它，选择添加变量并给它一个如 `m_URL` 的名称：\n\n![](img/00031.jpeg)\n\n对于第三个控件，用于显示状态的只读控件，右键点击它，选择添加变量并给它一个如\
  \ `m_Status` 的名称：\n\n![](img/00032.jpeg)\n\n现在为 Browse 按钮创建一个事件处理程序。在资源视图中双击 Browse\
  \ 按钮，这将生成该方法。在此方法中，我们添加几行代码来导航浏览器：\n\n```cpp\nvoid CWebBrowserDlg::OnClickedButton()\n\
  {\n    CString l_strURL;\n    m_URL.GetWindowText(l_strURL);\n    m_WebBrowser.Navigate(l_strURL,\
  \ 0);\n}\n```\n\n如所示运行程序：\n\n![](img/00033.jpeg)\n\n## 2.2 通过文件传输协议下载\n\n文件传输协议（FTP）是一种在互联网上传输数据文件的协议。下一个示例将演示如何使用\
  \ FTP 下载文件。在许多 FTP 站点上，文件来来去，但有一个文件留了多年并似乎一直会留那里：`rfc959.txt`。\n\n`ftp://funet.fi/pub/standards/RFC/rfc959.txt`\n\
  \n我们将在示例中下载 `rfc959.txt`。创建一个名为 `FTP` 的对话框。此对话框将显示一个“Download”按钮和一个用于显示状态的只读文本框。两个编辑框是可编辑的：一个输入\
  \ FTP 站点位置，另一个输入路径。添加另一个只读编辑框来显示下载的成功状态：\n\n![](img/00034.jpeg)\n\n要设置编辑控件的只读状态，右键点击控件，选择属性，并设置\
  \ Read Only 属性。这是 FTP 地址编辑控件的 Read Only 属性：\n\n![](img/00035.jpeg)\n\n为第一个编辑控件创建成员变量。我们将使用它输入\
  \ FTP 文件位置。在资源视图中，右键点击控件，选择添加变量并给它一个如 `m_FileLocation` 的名称：\n\n![](img/00036.jpeg)\n\
  \n对下一个控件重复此操作，我们将使用它输入路径。右键点击它，选择添加变量并给它一个如 `m_FilePath` 的名称：\n\n![](img/00037.jpeg)\n\
  \n对于第三个只读编辑控件，我们也将添加一个变量，这次给它命名 `m_StatusText`：\n\n![](img/00038.jpeg)\n\n在 `OnInitDialog`\
  \ 方法中，在你提示添加自己的初始化代码的注释之后，我们将为想要下载的文件默认 FTP 地址设置一些默认值：\n\n```cpp\nBOOL CFTTP::OnInitDialog()\n\
  {\n    CDialogEx::OnInitDialog();\n    CString l_strFtpLocation = \"funet.fi\";\n\
  \    m_FileLocation.SetWindowTextA(l_strFtpLocation);\n    CString l_strFilePath\
  \ = \"pub/standards/RFC/rfc959.txt\";\n    m_FilePath.SetWindowTextA(l_strFilePath);\n\
  \    return TRUE;\n}\n```\n\n\n\n\n双击 `Download` 按钮可以在点击此按钮时自动生成事件处理代码。点击 `Download`\
  \ 按钮时，此程序将首先从编辑控件中获取 FTP 位置和文件路径。然后它将创建一个新的 Internet 会话指针，如果成功，它将使用传递它的 FTP 位置创建一个\
  \ FTP 对象指针，在示例中，该位置是“ftp.funet.fi”。\n\n最后，它将通过传递 FTP 文件路径并将文件写入选定的位置来尝试下载，在程序中，该位置被硬编码为\
  \ `C:\\Temp`。\n\n```cpp\nvoid CFTPDlg::OnBnClickedDownload()\n{\nCString strFtpLocation,\
  \ strFilePath;\nm_FtpLocation.GetWindowTextA( strFtpLocation );\nm_FilePath.GetWindowTextA(\
  \ strFilePath );\nint nPosition = strFilePath.ReverseFind( '/' );\nCString strFileName\
  \ = nPosition == -1 ?\nstrFilePath : strFilePath.Mid( nPosition + 1 );\nCString\
  \ strFtpFilePath = strFtpLocation + \"/\" + strFilePath;\nCString strDestinationPath\
  \ = \"C:\\\\temp\";\nCInternetSession* pInternetSession = new CInternetSession();\n\
  CFtpConnection* pFTPConnection = NULL;\nif ( NULL == pInternetSession )\n{\nMessageBox(\
  \ NULL, \"Could not establish Internet session\", MB_OK );\n}\npFTPConnection =\
  \ pInternetSession->GetFtpConnection( strFtpLocation );\nif ( NULL == pFTPConnection\
  \ )\n{\nMessageBox( NULL, \"Could not establish FTP connection\", MB_OK );\n}\n\
  Sleep( 5000 );\nBOOL success = pFTPConnection->GetFile(\nstrFilePath,\nstrDestinationPath\
  \ + \"\\\\\" + strFileName,\nFALSE,\nFILE_ATTRIBUTE_NORMAL,\nFTP_TRANSFER_TYPE_ASCII,\n\
  INTERNET_FLAG_DONT_CACHE );\nif ( TRUE == success )\n{\nm_FtpLocation.SetWindowTextA(\
  \ strFtpFilePath );\nCString strDownloadMessage = strFileName +\n\" successfully\
  \ downloaded to \" +\nstrDestinationPath;\nm_StatusText.SetWindowTextA( strDownloadMessage\
  \ );\n}\nelse\n{\nm_StatusText.SetWindowTextA( \"Download failed.\" );\n}\nUpdateData(\
  \ FALSE );\npFTPConnection->Close();\npInternetSession->Close();\n}\n```\n\n\n\n\
  运行应用程序将从指定的 FTP 站点访问文件并写入选定的位置：\n\n![](img/00038.jpeg)\n\n## 2.3 使用 DirectShow 播放媒体文件\n\
  \nDirectShow 是一个由一组 API 组成的框架，软件人员可以使用它在 Windows 平台上进行媒体流。使用 DirectShow 可以让你播放或捕获音频和视频流或编辑媒体。本节是对使用\
  \ DirectShow 的高级介绍，向你展示如何播放音频或视频文件。\n\n然而，使用 DirectShow 有一些前提条件。所有使用 DirectShow\
  \ 的应用程序必须包含 `Dshow.h` 头文件并链接到静态库文件 `strmiids.lib`。这些对于所有 DirectShow 应用程序都是必须的：\n\
  \n```cpp\n#include <dshow.h>\n#pragma comment(lib,\"Strmiids.lib\")\n```\n\n由于 DirectShow\
  \ 基于组件对象模型 (COM)，编写 DirectShow 应用程序需要一些应用 COM 客户端编程的知识。（如果你在某时刻希望扩展 DirectShow 以支持新格式或开发自己的自定义效果，你将需要编写自己的组件并将它们实现为\
  \ COM 对象。）\n\n有必要使用 `CoInitialize()` 初始化 COM 库，然后检查结果：\n\n```cpp\nHRESULT hr = CoInitialize(NULL);\n\
  if (FAILED(hr))\n{\nstd::cout << \"Could not initialize COM library\" << std::endl;\n\
  return;\n}\n```\n\n当你完成 COM 使用后，必须使用 `CoUninitialize()` 进行取消初始化，这意味着所有的 DirectShow\
  \ 函数调用都发生在 `COM` `CoInitialize()` 和 `CoUninitialize()` 之间。\n\n通过构建过滤器图来定义此应用程序所需的\
  \ DirectShow 接口，然后控制媒体流和媒体事件处理：\n\n```cpp\nIGraphBuilder *pGraph = NULL;\nIMediaControl\
  \ *pControl = NULL;\nIMediaEvent *pEvent = NULL;\n```\n\n调用 `CoCreateInstance()`\
  \ 创建过滤器图管理器。处理媒体质的过滤器图是一个有向图，其节点表示数据处理阶段，其边表示单向数据流。过滤器图管理器还处理同步、事件通知以及控制过滤器图的其他方面。\n\
  \n```cpp\nhr = CoCreateInstance(\nCLSID_FilterGraph,\nNULL,\nCLSCTX_INPROC_SERVER,\n\
  IID_IGraphBuilder,\n(void **)&pGraph );\n```\n\n一旦创建了过滤器图管理器的实例，真正的工作就开始了。使用返回的\
  \ `IGraphBuilder` 指针查询 `IMediaControl` 和 `IMediaEvent` 接口：\n\n```cpp\nhr = pGraph->QueryInterface(IID_IMediaControl,\
  \ (void **)&pControl);\n```\n\n\n\n\n# 为动态链接库添加类\n\n选择 `Project` 菜单 > `Add New Item`，在出现的\
  \ `Categories` 格中，在 `Installed Templates` 的 `Visual C++` 节下选择 `Code`。选择 `Header\
  \ File (.h)` 并为头文件选择名称，例如 `MathFuncsDll.h`：\n\n然后按 `Add`。系统将显示一个空文件。粘贴示例代码：\n\n\
  ```cpp\n// MathFuncsDll.h\n\nnamespace MathFuncs\n\n{\n\nclass MyMathFuncs\n{\n\n\
  public:\n// 返回 a + b\nstatic __declspec(dllexport) double Add(double a, double b);\n\
  // 返回 a - b\nstatic __declspec(dllexport) double Subtract(double a, double b);\n\
  // 返回 a * b\nstatic __declspec(dllexport) double Multiply(double a, double b);\n\
  // 返回 a / b\n// 如果 b 为 0，则抛出 DivideByZeroException\nstatic __declspec(dllexport)\
  \ double Divide(double a, double b);\n};\n\n}\n```\n\n注意上述方法声明中的 `__declspec(dllexport)`\
  \ 修饰符。这些修饰符允许 DLL 导出方法，以便其他应用程序可以使用。\n\n### 为类创建源代码\n\n从 `Project` 菜单中选择 `Add New\
  \ Item`。将显示 `Add New Item` 对话框。从 `Categories` 格中，在 `Visual C++` 下选择 `Code`。选择 `C++\
  \ File (.cpp)`。为源文件选择名称，例如 `MathFuncsDll.cpp`。\n\n![](img/00041.jpeg)\n\n按 `Add`。系统将显示一个空的\
  \ `.cpp` 文件。粘贴此示例代码：\n\n```cpp\n// MathFuncsDll.cpp\n// 编译命令：/EHsc /LD\n\n#include\
  \ \"MathFuncsDll.h\"\n#include <stdexcept>\nusing namespace std;\n\nnamespace MathFuncs\n\
  {\n\ndouble MyMathFuncs::Add(double a, double b)\n{\nreturn a + b;\n}\n\ndouble\
  \ MyMathFuncs::Subtract(double a, double b)\n{\nreturn a - b;\n}\n\ndouble MyMathFuncs::Multiply(double\
  \ a, double b)\n{\nreturn a * b;\n}\n\ndouble MyMathFuncs::Divide(double a, double\
  \ b)\n{\nif (b == 0)\n{\nthrow new invalid_argument(\"b cannot be zero!\");\n}\n\
  return a / b;\n}\n\n}\n```\n\n### 将项目生成为 DLL\n\n从 `Project` 菜单中选择 `MathFuncsDll\
  \ Properties`，在 `Configuration Properties` 下选择 `General`。在右侧格中，在 `Project Defaults`\
  \ 下，将 `Configuration Type` 改为 `Dynamic Library (.dll)`。\n\n![](img/00042.jpeg)\n\
  \n按 `OK` 保存更改。\n\n### 编译 DLL\n\n从 `Build` 菜单中选择 `Build Solution`。这将创建一个可以被其他程序使用的\
  \ DLL。\n\n### 创建引用该 DLL 的独立应用程序\n\n现在我们将演示如何在其他应用程序引用我们创建的 DLL。从 `File` 菜单中选择 `New`\
  \ 然后是 `Project`。从 `Project types` 格中，在 `Visual C++` 下选择 `Win32`。从 `Templates` 格中，选择\
  \ `Win32 Console Application`。为项目选择名称，例如 `MyExecRefsDll`，并输入到 `Name` 字段中。在 `Solution`\
  \ 旁边，从下拉列表中选择 `Add to Solution`。这将新项目添加到与动态链接库相同的解决方案中。摘要如下截图所示：\n\n![](img/00043.jpeg)\n\
  \n按 `OK` 启动 `Win32 Application Wizard`。在 `Win32 Application Wizard` 的 `Overview`\
  \ 页面，按 `Next`。在 `Win32 Application Wizard` 的 `Application Settings` 页面，在 `Application\
  \ type` 下选择 `Console application`。在 `Win32 Application Wizard` 的 `Application Settings`\
  \ 页面，在 `Additional options` 下，取消勾选 `Precompiled header`：\n\n![](img/00044.jpeg)\n\
  \n按 `Finish` 创建项目。\n\n### 开始使用 DLL 功能\n\n创建新的 `Console Application` 后，将为你创建一个空程序，其名称与你为项目选择的名称相同。在本示例中，为\
  \ `MyExecRefsDll.cpp`。\n\n要使用你在 DLL 中创建的程序，按如下方式引用它：从 `Project` 菜单中选择 `References`。在\
  \ `Property Pages` 对话框中展开 `Common Properties` 节点并选择 `Framework and References`。\n\
  \n![](img/00045.jpeg)\n\n选择 `Add New Reference` 按钮。这将显示 `Add Reference` 对话框，列出所有你可以引用的库。从\
  \ `Projects` 选项卡中选择 `MathFuncsDll`，然后按 `OK`：\n\n![](img/00046.jpeg)\n\n### 引用 DLL\
  \ 头文件\n\n从 `Property Pages` 对话框中展开 `Configuration Properties` 节点，然后选择 `C/C++` 节点下的\
  \ `General`。在 `Additional Include Directories` 旁边，输入 `MathFuncsDll.h` 头文件的位置路径：\n\
  \n![](img/00047.jpeg)\n\n### 告诉系统运行时定位 DLL 的位置\n\n从 `Property Pages` 对话框中展开 `Configuration\
  \ Properties` 节点并选择 `Debugging`。在 `Environment` 旁边输入以下内容：`PATH= `，其中空白处替换为你的 DLL\
  \ 的实际位置。\n\n### 开始使用 DLL 功能\n\n创建新的 `Console Application` 后，系统将为你创建一个空程序，其名称与你之前为项目选择的名称相同。在本示例中，为\
  \ `MyExecRefsDll.cpp`。\n\n要使用你在 DLL 中创建的程序，按如下方式引用它：从 `Project` 菜单中选择 `References`。在\
  \ `Property Pages` 对话框中，展开 `Common Properties` 节点并选择 `Framework and References`。\n\
  \n![](img/00045.jpeg)\n\n选择 `Add New Reference` 按钮。这将显示 `Add Reference` 对话框，列出所有你可以引用的库。从\
  \ `Projects` 选项卡中选择 `MathFuncsDll`，然后按 `OK`：\n\n![](img/00046.jpeg)\n\n### 引用 DLL\
  \ 头文件\n\n从 `Property Pages` 对话框中展开 `Configuration Properties` 节点，然后选择 `C/C++` 节点下的\
  \ `General`。在 `Additional Include Directories` 旁边，输入 `MathFuncsDll.h` 头文件的位置路径：\n\
  \n![](img/00047.jpeg)\n\n### 告诉系统运行时定位 DLL 的位置\n\n从 `Property Pages` 对话框中展开 `Configuration\
  \ Properties` 节点并选择 `Debugging`。在 `Environment` 旁边输入以下内容：`PATH= `，其中空白处替换为你的 DLL\
  \ 的实际位置。\n\n### 开始使用 DLL 功能\n\n创建新的 `Console Application` 后，系统将为你创建一个空程序，其名称与你之前为项目选择的名称相同。在本示例中，为\
  \ `MyExecRefsDll.cpp`。\n\n要使用你在 DLL 中创建的程序，按如下方式引用它：从 `Project` 菜单中选择 `References`。在\
  \ `Property Pages` 对话框中，展开 `Common Properties` 节点并选择 `Framework and References`。\n\
  \n![](img/00045.jpeg)\n\n选择 `Add New Reference` 按钮。这将显示 `Add Reference` 对话框，列出所有你可以引用的库。从\
  \ `Projects` 选项卡中选择 `MathFuncsDll`，然后按 `OK`：\n\n![](img/00046.jpeg)\n\n### 引用 DLL\
  \ 头文件\n\n从 `Property Pages` 对话框中展开 `Configuration Properties` 节点，然后选择 `C/C++` 节点下的\
  \ `General`。在 `Additional Include Directories` 旁边，输入 `MathFuncsDll.h` 头文件的位置路径：\n\
  \n![](img/00047.jpeg)\n\n### 告诉系统运行时定位 DLL 的位置\n\n从 `Property Pages` 对话框中展开 `Configuration\
  \ Properties` 节点并选择 `Debugging`。在 `Environment` 旁边输入以下内容：`PATH= `，其中空白处替换为你的 DLL\
  \ 的实际位置。\n\n\n\n\n\n`Invalidate()` 用于在用户输入新字符时使视图失效。然后我们添加一个消息处理程序，在自动创建的 `CSerializeSDIexampleView`\
  \ 的 `OnDraw()` 方法中显示新的文本字符串。取消 `CDC*` `/*pDC*/` 并添加代码来显示文本：\n\n```cpp\nvoid CSerializeSDIexampleView::OnDraw(CDC*\
  \ pDC)\n{\n    CSerializeSDIexampleDoc* pDoc = GetDocument();\n    ASSERT_VALID(pDoc);\n\
  \    if (!pDoc) return;\n    pDC->TextOut( 0, 0, pDoc->m_strData );\n}\n```\n\n\
  注意 `CSerializeSDIexampleDoc` 类已经有一个 `Serialize()` 方法。这里就是我们序列化 `m_strData` 字符串的地方。使用传递给它的\
  \ `CArchive` 引用，就像你使用 `std::cout` 或 `std::cin` 分别读取和写入磁盘一样：\n\n```cpp\nvoid CSerializeSDIexampleDoc::Serialize(CArchive&\
  \ ar)\n{\n    if (ar.IsStoring())\n    {\n        ar << m_strData;\n    }\n    else\n\
  \    {\n        ar >> m_strData;\n    }\n}\n```\n\n我们对项目进行的最后一次修改是确保应用程序记住用户何时向\
  \ `m_strData` 对象添加了更多数据。这意味着当用户尝试退出应用程序时，程序将向用户提示“保存文档更改”的消息。\n\n在 `CSerializeSDIexampleView::OnChar`\
  \ 中，通过设置修改标记来指示文档已更改：\n\n```cpp\nvoid CSerializeSDIexampleView::OnChar(UINT nChar,\
  \ UINT nRepCnt, UINT nFlags)\n{\n    // TODO: 在此处添加你的消息处理代码和/或调用默认函数\n    CSerializeSDIexampleDoc*\
  \ pDoc = GetDocument();\n    ASSERT_VALID(pDoc);\n    if ( nChar == 8 )\n    {\n\
  \        int length = pDoc->m_strData.GetLength();\n        CString str = pDoc->m_strData.Left(\
  \ length - 1 );\n        pDoc->m_strData = str;\n    }\n    else\n    {\n      \
  \  CString str;\n        str.Format( TEXT( \"%c\" ), nChar );\n        pDoc->m_strData\
  \ += str;\n    }\n    Invalidate();\n    pDoc->SetModifiedFlag();\n    CView::OnChar(nChar,\
  \ nRepCnt, nFlags);\n}\n```\n\n运行程序时，我们可以输入字符或使用退格键删除它们：\n\n![](img/00053.jpeg)\n\
  \n现在尝试在不保存文本的情况下关闭应用程序，这样它会提示你是否要保存：\n\n![](img/00054.jpeg)\n\n为文件命名并保存：\n\n![](img/00055.jpeg)\n\
  \n现在重启应用程序，打开 `Serialize1.txt` 文件以重新打开：\n\n![](img/00056.jpeg)\n\n## 章节总结\n\n总结这节课程，你现在可以：\n\
  \n* 创建你自己的网络浏览器。\n* 通过文件传输协议（FTP）下载文件。\n* 使用 DirectShow 播放或捕获媒体文件。\n* 创建动态链接库 (DLL)\
  \ 另一个应用程序中引用它。\n* 应用 MFC 提供的序列化机制在硬盘等存储介质上存储和检索应用程序的成员变量。\n\n# 第 3 章：开始使用 Boost\
  \ 库\n\n## 3.1 介绍\n\nBoost 是一个强大的库，可以应用于广泛的任务和应用领域。如果你正在寻求以健壮且通用的方式完成 C++ 编程任务，那么很有可能已经存在一个为此目的的\
  \ Boost 库。它们的范围从线程、文件处理到数值分析和图算法不等。这些库中任何超过少数几个的详细描述都出了本电子书的范围。Boost 主页包含有关所有各个组件的详尽文档，关于该主题也有一些不错的书籍。\n\
  \n我们在这里关注的是如何真正开始。对于不熟悉的人来说，知道如何在所选开发环境中安装并准备好 Boost，并感受这些库的使用方法通常是困难的。某些可用文档可能不够靠谱，这也没有帮助。\n\
  \n因此，本章是关于在常用集成开发环境 (IDE) 中设置 Boost 的深度指南，并在一些用法示例。\n\n## 3.2 前提条件\n\n在熟悉使用 Boost\
  \ 之前，首先确保你已具备本章描述的必要前提条件。如果你还没有 Boost，请下载并解压 Boost zip 文件到你选择的位置。Boost 的官方发布可以从\
  \ [`www.boost.org/users/download/`](http://www.boost.org/users/download/) 获取。\n\n\
  ![](img/00057.jpeg)\n\n### 生成编译后的库。\n\n正如“在 Windows 上开始使用”Boost 网页所述，大多数 Boost 库都是基于头类型的换句话说，一旦它们安装到你的计算机上，就不需要进一步编译或干预即可工作。要使用此类库，你只需要这样添加正确的包含：\n\
  \n```cpp\n#include <boost/lambda/lambda.hpp>\n```\n\n还存在其他 Boost 库需要额外的编译才能使用，例如线程、文件系统、正则表达式和单元测试框架。后续章节描述了如何为以下基于\
  \ Windows 的 C++ 编译器环境生成编译后的库：Visual C++、MinGW 和 CygWin。按照说明说明操作。\n\n### 为 Visual\
  \ Studio 生成编译后的库\n\n打开命令提示符并导航到你的 boost 根目录。如果包含空格，请将其括在引号内：\n\n![](img/0058.jpeg)\n\
  \n从命令提示符运行 bootstrap 命令：\n\n![](img/0059.jpeg)\n\n从命令提示符运行 `b2`。这需要一些时间：\n\n![](img/0060.jpeg)\n\
  \n然后 Visual Studio 使用的编译库安装到 `<root>/stage/lib`：\n\n![](img/0061.jpeg)\n\n### 为\
  \ MinGW 生成编译后的库\n\nMinGW（Minimalist GNU for Windows）是开发 Windows 应用程序的免费开源替代。它包含了\
  \ GNU  (GCC) 以及各种 Windows 头文件和静态库以便使用 Windows API。通过右键点击“计算机”选择属性，然后是高级选项、环境变量。在系统变量中选择\
  \ PATH，然后点击编辑：\n\n![](img/0062.jpeg)\n\n在出现的编辑框中，通过添加 `C:\\mingw\\bin` 来包含 MinGW：\n\
  \n![](img/0063.jpeg)\n\n要使用 MinGW 生成 Boost 库，打开命令提示符，导航到 Boost 根目录并运行 `bootstrap.bat\
  \ mingw`：\n\n![](img/0064.jpeg)\n\n这将生成编译 Boost 需要的两个执行文件 `b2.exe` 和 `bjam.exe`。完成后执行命令\
  \ `b2 toolset=gcc`：\n\n![](img/0065.jpeg)\n\n然后供 MinGW 使用的编译库所示：\n\n![](img/0066.jpeg)\n\
  \n### 为 CygWin 生成编译后的库\n\n使用 Cygwin 的优势是提供了 Windows 操作系统中缺少的许多 UNIX 工具。如果 Cygwin\
  \ 是你选择的编译器，请设置环境变量以便你的 IDE 访问 Cygwin 工具集。从开始按钮右键点击“我的计算机”并选择“属性”。选择高级选项卡以及环境变量。在系统变量中选择\
  \ Path，然后点击编辑：\n\n![](img/0067.jpeg)\n\n然后设置 Cygwin 工具集的位置：\n\n![](img/0068.jpeg)\n\
  \n为了配置 Boost 使用 Cygwin，打开 Cygwin 终端并导航到安装 Boost 库的位置。对于包含空格的 Windows 目录，用引号引用：\n\
  \n`cd \"C:\\Program Files\\boost_1_55_0\"`\n\n使用 `ls` 命令检查此位置是否存在 `boost/` 文件夹：\n\
  \n![](img/0069.jpeg)\n\n如果 boost 目录，运行 bootstrap 命令：\n\n`./bootstrap.sh --prefix=boost/`\n\
  \n![](img/0070.jpeg)\n\n然后运行 `./bjam.exe` 命令（这可能需要一段时间）：\n\n![](img/0071.jpeg)\n\
  \n\n\n\n现在运行 `./bjam install` 命令（这可能需要*非常*长的时间）：\n\n![](img/00072.jpeg)\n\n一旦完成此阶段，你会发现\
  \ `boost/` 文件夹内创建了三个额外的文件夹，即 `bin`、`include` 和 `lib`。\n\n最后，将这些文件夹递归复制到目标路径 `/usr/local/`：\n\
  \n```bash\ncp -r boost/bin /usr/local/\ncp -r boost/include /usr/local/\ncp -r boost/lib\
  \ /usr/local/\n```\n\n![](img/00073.jpeg)\n\n## 3.3 在 Microsoft Visual Studio 中配置\
  \ Boost\n\n### 头文件库示例：Boost Format\n\n为了感受在 Visual Studio 中使用 Boost 的体验，让我们从一个不需要单独编译的库开始：`Boost\
  \ Format`，这是一个类型安全的实用程序，用于根据格式字符串格式化参数。通过选择 `文件 > 新建 > 项目` 创建一个空项目。\n\n勾选“为解决方案创建目录”复选框并命名你的项目：\n\
  \n![](img/00074.jpeg)\n\n右键点击项目文件夹并选择 `添加 > 新项` 来添加代码。选择 `C++ 文件` 并将其命名为 `main.cpp`：\n\
  \n![](img/00075.jpeg)\n\n将此代码段插入到 `main.cpp` 中，作为格式化并输出十六进制值数组的示例：\n\n```cpp\n#include\
  \ <iostream>\n#include <boost/format.hpp>\n\nint main()\n{\n    unsigned int arr[\
  \ 5 ] = { 0x05, 0x04, 0xAA, 0x0F, 0x0D };\n    std::cout << boost::format(\"%02X-%02X-%02X-%02X-%02X\"\
  )\n    % arr[0]\n    % arr[1]\n    % arr[2]\n    % arr[3]\n    % arr[4]\n    <<\
  \ endl;\n}\n```\n\n注意，如果在没有指定使用 Boost 库所需的额外包含文件的情况下编译项目，将会发生构建错误：\n\n`fatal error\
  \ C1083: Cannot open include file: 'boost/format.hpp': No such file or directory`\n\
  \n右键点击你的项目文件夹并选择 `属性`。在 `C++ > 常规`选项卡中编辑`附加包含目录`部分：\n\n![](img/00076.jpeg)\n\n告诉\
  \ Visual Studio 你的 `Boost` 头文件所在位置：\n\n![](img/00077.jpeg)\n\n这就是使用非编译 Boost 库所需要的所有操作。你的程序现在应该可以成功编译。\n\
