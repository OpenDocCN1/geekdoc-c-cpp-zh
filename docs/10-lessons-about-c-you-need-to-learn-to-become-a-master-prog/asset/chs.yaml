  标准 STL 容器可以归类为以下几类：\n\n- 标准序列容器（`std::vector`、`std::list`、`std::deque` 和 `std::string`）\n\
  - 标准关联容器（`std::map`、`std::set`、`std::multimap`、`std::multiset`）\n\n考虑到可选容器有很多，值得考虑一些经验法则，以为你的特定场景选择合适的\
  \ STL 容器。如果你预预计你的集合只需要存储几个项目，那么无论你打算做什么，使用 `std::vector` 可能都是可以的。如果你打算维护一个集合，且该集合与访问次数相比，其变化非常小，那么\
  \ `std::vector` 仍然是一个很好的选择。此外，`std::vector` 容器将提供你对数组预期的所有功能，允许直观地收集项目，并能够以动态且类型安全的方式进行随机访问，或在（容器末尾）添加和删除：\n\
  \n```cpp\n#include <vector>\n#include <string>\n#include <algorithm>\n#include <iostream>\n\
  #include <iterator>\n\nint main()\n{\n    const int values[] = { 1, 11, 111, 1111\
  \ };\n    const size_t size = sizeof( values ) / sizeof( values[ 0 ] );\n    std::vector<int>\
  \ v( values, values + size );\n    v.push_back( 11111 );\n    std::cout << \"vector:\
  \ \";\n    std::copy( v.begin(), v.end(), std::ostream_iterator<int>( std::cout,\
  \ \" \" ) );\n    return 0;\n}\n```\n\n这得到了如下输出：\n\n![](img/00149.jpeg)\n\n与 `std::vector`\
  \ 在某些方面相似的是 `std::deque`（读作“deck”），它是双端队列的缩写。`std::deque` 允许在集合的两端进行插入，即 `push_back`\
  \ 和 `push_front`，因此允许你将容器建模为队列，也可以建模为栈。但让我们进入全新的领域。可能的情况对随机访问的需求并不那么重要，而是你需要一个能够在任意位置高效插入或删除项目的容器。关联容器（如\
  \ `std::map`）绝对不合适，而 `std::vector` 在插入数据项目时计算开销更大，尤其是在中间插入。然而，`std::list` 是这类任务的理想选择。一个实际应用可以是跟踪所有打开的\
  \ Windows 对象，或者维护一个后台运行的进程列表，在这些情况下，插入和删除的数量可能是巨大的。`std::list` 的独特特性是它的拆接（splice）能力：即将元素从一个\
  \ `std::list` 转移到另一个 `std::list`。\n\n```cpp\n#include <list>\n#include <string>\n\
  #include <algorithm>\n#include <iostream>\n#include <iterator>\n\nint main()\n{\n\
  \    typedef std::list<std::string>::iterator list_it;\n    std::list<std::string>\
  \ list1;\n    std::list<std::string> list2;\n    list1.push_front( \"A\" );\n  \
  \  list1.push_back( \"E\" );\n    list1.push_back( \"F\" );\n    list1.insert( ++list1.begin(),\
  \ \"B\" );\n    list2.push_front( \"C\" );\n    list2.push_front( \"D\" );\n   \
  \ // 将元素从 list2 转移（splice）到 list1。\n    list_it it = list1.begin();\n    std::advance(\
  \ it, 2 );\n    list1.splice( it, list2 );\n    std::cout << \"list1: \";\n    std::copy(\
  \ list1.begin(), list1.end(), std::ostream_iterator<std::string>( std::cout, \"\
  \ \" ) );\n    return 0;\n}\n```\n\n输出所示：\n\n![](img/00150.jpeg)\n\n因此 `std::vector`\
  \ 和 `std::list` 容器是实现数据项目存储的序列容器使用的示例。该类中的其他序列容器包括 `std::deque`、`std::array` 和 `std::forward_list`。在每情况下，所有容器项目必须属于相同的数据类型。在同一个容器内永远不能混合如\
  \ `int` 或 `std::string` 等不同的数据类型。\n\n那么我们对这些容器还有什么用途呢？嗯，可能有时你希望保证容器只存储唯一值，并防止插入重复项目。在实际设置中，这可能包括维护一个选修课程的学生列表，或者一个唯一的社会安全号码集合。因此，关联容器（如\
  \ `std::set`）是保证插入数据项目唯一性的可靠手段，只要这些唯一项目的顺序并不重要的话。\n\n`std::set` 容器允许通过 `insert`\
  \ 和 `find` 方法分别对唯一值进行 set 插入和查找。这是因为如果该项目的值已经在集合中，则 `insert` 将不会添加新项目，且插入时的新元素会自动按升序排序。此外，`std::set`\
  \ 与其他关联容器一样，具有某些性能保证：查找和插入项目所需的时间与 `log N` 成正比，其中 `N` 是项目的数量。\n\n```cpp\n#include\
  \ <set>\n#include <string>\n#include <algorithm>\n#include <iostream>\n\nint main()\n\
  {\n    int values[] = { 1, 2, 2, 3, 4, 4 };\n    int size = sizeof( values ) / sizeof(\
  \ values[ 0 ] );\n    std::set<int> s( values, values + size );\n    std::cout <<\
  \ \"set elements: \";\n    for ( int n : s ) std::cout << n << \" \";\n    std::cout\
  \ << std::endl;\n    return 0;\n}\n```\n\n输出如下：\n\n```\nset elements: 1 2 3 4 \n\
  ```\n\n那么我们对这些容器还有什么用途呢？，，可能你希望希望保证只只值值并并防止插入重复项目在在实际设置中，这可能维护一个选修课程的学生列表，或者一个唯一的社会安全号码集合。因此，关联容器（如\
