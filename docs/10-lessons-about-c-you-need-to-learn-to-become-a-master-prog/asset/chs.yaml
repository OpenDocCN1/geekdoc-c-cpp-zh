  这得到了如下输出，以确定每个图的连通状态：\n\n![](img/00115.jpeg)\n\n## 4.4 Kruskal 算法\n\n现在让我们来看 Kruskal\
  \ 算法的一个简单 C++ 实现，该算法用于在网络中寻找最小生成树。该算法使用相同的 `Graph` 结构来模拟网络、插入和删除边等。\n\n考虑以下包含 11\
  \ 个节点的示例网络，它展示了网络节点以及连接它们的链路的权重值：\n\n![](img/00116.jpeg)\n\n这是通过多次调用 `insert` 构建的，如处所示：\n\
  \n`graph.insert( EdgePtr( new Edge( 0, 1, 1.0 ) ) );`\n\nKruskal 算法的工作原理是获取网络链路的排序列表，然后将每个成本最低的链路添加到另一个集合中，同时不允许产生环。完整代码如下：\n\
  \n### Graph.h\n```cpp\n#include <vector>\n#include <algorithm>\n#include <memory>\n\
  \n// 这些代码来自 \"Algorithms in C++, Third Edition,\"\n// 作者 Robert Sedgewick, Addison-Wesley,\
  \ 2002.\nclass Edge\n{\npublic:\n  int v, w;\n  double wt;\n  Edge(int v = -1, int\
  \ w = -1, double wt = 0) : v(v), w(w), wt(wt) {}\n};\n\ntypedef std::shared_ptr<Edge>\
  \ EdgePtr;\nstruct EdgeSort\n{\n  bool operator() ( const EdgePtr& ep1, const EdgePtr&\
  \ ep2 )\n  {\n    return ep1->wt < ep2->wt;\n  }\n};\n\ntemplate <class Edge>\n\
  class DenseGRAPH\n{\nprivate:\n  int Vcnt, Ecnt;\n  bool digraph;\n  std::vector<std::vector<EdgePtr>>\
  \ adj;\n\npublic:\n  DenseGRAPH(int V, bool digraph = false) : adj(V), Vcnt(0),\
  \ digraph(digraph)\n  {\n    for (int i = 0; i < V; i ) adj[i].resize(V);\n  }\n\
  \  int V() const { return Vcnt; }\n  int E() const { return Ecnt; }\n  bool directed()\
  \ const { return digraph; }\n  void insert( EdgePtr e)\n  {\n    int v = e->v;\n\
  \    int w = e->w;\n    if (adj[v][w] == 0) Ecnt++;\n    adj[v][w] = e;\n    if\
  \ (!digraph) adj[w][v] = e;\n  }\n  void remove(EdgePtr e)\n  {\n    int v = e->v;\n\
  \    int w = e->w;\n    if (adj[v][w] != 0)\n      Ecnt--;\n    adj[v][w] = 0;\n\
  \    if (!digraph) adj[w][v] = 0;\n  }\n  EdgePtr edge(int v, int w) const { return\
  \ adj[v][w]; }\n  // 获取权重边\n  void edges( std::vector<EdgePtr>& edges )\n  {\n \
  \   for ( int u = 0; u < V(); ++u )\n    {\n      DenseGRAPH<Edge>::adjIterator\
  \ A(*this, u);\n      for ( EdgePtr e = A.beg(); !A.end(); e = A.nxt() )\n     \
  \ {\n        if ( NULL != e )\n        {\n          edges.push_back( e );\n    \
  \    }\n      }\n    }\n  }\n  class adjIterator;\n  friend class adjIterator;\n\
  };\n\ntemplate <class Edge>\nclass DenseGRAPH<Edge>::adjIterator\n{\nprivate:\n\
  \  const DenseGRAPH &G;\n  int i, v;\n\npublic:\n  adjIterator(const DenseGRAPH<Edge>\
  \ &G, int v) : G(G), v(v), i(0) {}\n  EdgePtr beg() { i = -1; return nxt(); }\n\
  \  EdgePtr nxt()\n  {\n    for (i++; i < G.V();\n      if (G.edge(v, i))\n     \
  \   return G.adj[v][i];\n    return 0;\n  }\n  bool end() const { return i >= G.V();\
  \ }\n};\n```\n\n### Main.cpp\n```cpp\n#include \"Graph.h\"\n#include <iostream>\n\
  \n// 用于并查的集合结构\nstruct subset\n{\n  int parent;\n  int rank;\n};\ntypedef subset\
  \ Subset;\n\n// 查找元素集合的辅助函数\n//（使用路径压缩）\nint Find( Subset subsets[], int i )\n{\n\
  \  // 找到根并设置为 i 的父节点（路径压缩）\n  if (subsets[i].parent != i)\n    subsets[i].parent\
  \ = Find(subsets, subsets[i].parent);\n  return subsets[i].parent;\n}\n// 按秩合并 x\
  \ 和 y 集合\nvoid Union( Subset subsets[], int x, int y )\n{\n  int xroot = Find( subsets,\
  \ x );\n  int yroot = Find( subsets, y );\n  // 将较小的树挂在高秩树的根下\n  //（按秩合并）\n  if\
  \ ( subsets[xroot].rank < subsets[yroot].rank )\n  {\n    subsets[xroot].parent\
  \ = yroot;\n  }\n  else if (subsets[xroot].rank > subsets[yroot].rank)\n  {\n  \
  \  subsets[yroot].parent = xroot;\n  }\n  else\n  {\n    // 如果秩相同，则将一个设为根并\n   \
  \ // 将秩加一\n    subsets[yroot].parent = xroot;\n    subsets[xroot].rank++;\n  }\n\
  }\n// 使用 Kruskal 算法构造 MST 主函数\nvoid KruskalMST( DenseGRAPH<Edge>* graph, std::vector<EdgePtr>&\
  \ mst )\n{\n  const int V = graph->V();\n  // 按权重非递减排序边\n  std::vector<EdgePtr>\
  \ edges;\n  graph->edges( edges );\n  std::sort(edges.begin(), edges.end(), EdgeSort()\
  \ );\n  // 为创建 V 个集合分配内存\n  std::unique_ptr<subset[]> subsets( new subset[ V ]()\
  \ );\n  // 创建带有单个元素的 V 个集合\n  for ( int v = 0; v < V; ++v )\n  {\n    subsets[v].parent\
  \ = v;\n    subsets[v].rank = 0;\n  }\n  for ( std::vector<EdgePtr>::iterator it\
  \ = edges.begin();\n  it != edges.end(); ++it )\n  {\n    EdgePtr edgePtr = *it;\n\
  \    int x = Find( subsets.get(), edgePtr->v );\n    int y = Find( subsets.get(),\
  \ edgePtr->w );\n    // 如果包含这条边不会产生环，则将其\n    // 加入结果并增加下一条边的索引\n    if ( x != y\
  \ )\n    {\n      mst.push_back( edgePtr );\n      Union( subsets.get(), x, y );\n\
  \    }\n  }\n}\n\nint main()\n{\n  DenseGRAPH<Edge>* graph = new DenseGRAPH<Edge>(\
  \ 11, true );\n  graph->insert( EdgePtr( new Edge(0, 1, 1.0 ) ) );\n  graph->insert(\
  \ EdgePtr( new Edge(0, 2, 0.6) ) );\n  graph->insert( EdgePtr( new Edge(0, 3, 1.0\
  \ ) ) );\n  graph->insert( EdgePtr( new Edge(0, 4, 1.0 ) ) );\n  graph->insert(\
  \ EdgePtr( new Edge(0, 5, 1.1 ) ) );\n  graph->insert( EdgePtr( new Edge(1, 4, 1.8\
  \ ) ) );\n  graph->insert( EdgePtr( new Edge(1, 10, 1.9 ) ) );\n  graph->insert(\
  \ EdgePtr( new Edge(2, 3, 2.1 ) ) );\n  graph->insert( EdgePtr( new Edge(2, 5, 2.3)\
  \ ) );\n  graph->insert( EdgePtr( new Edge(2, 6, 1.7 ) ) );\n  graph->insert( EdgePtr(\
  \ new Edge(3, 4, 1.7 ) ) );\n  graph->insert( EdgePtr( new Edge(5, 6, 0.5 ) ) );\n\
  }\n```\n\n\n\n\n\n```cpp\ngraph->insert( EdgePtr( new Edge( 5, 7, 0.7 ) ) );\ngraph->insert(\
  \ EdgePtr( new Edge( 5, 8, 0.9 ) ) );\ngraph->insert( EdgePtr( new Edge( 5, 9, 0.9\
  \ ) ) );\ngraph->insert( EdgePtr( new Edge( 5, 10, 1.0 ) ) );\ngraph->insert( EdgePtr(\
  \ new Edge( 6, 7, 1.9 ) ) );\ngraph->insert( EdgePtr( new Edge( 7, 8, 1.7 ) ) );\n\
  graph->insert( EdgePtr( new Edge( 8, 9, 1.6 ) ) );\ngraph->insert( EdgePtr( new\
  \ Edge( 9, 10, 2.2 ) ) );\n\nstd::vector<EdgePtr> mst;\n\nKruskalMST( graph, mst\
  \ );\n\nfor ( std::vector<EdgePtr>::const_iterator it = mst.begin(); it != mst.end();\
  \ ++it )\n{\n    std::cout << it->get()->v << \" \" << it->get()->w << \" \" <<\
  \ it->get()->wt << std::endl;\n}\n\nreturn 0;\n}\n```\n\n这产生了以下输出：\n\n![](img/00117.jpeg)\n\
  \n这反过来代表了该最小生成树：\n\n![](img/00118.jpeg)\n\n## 章节总结\n\n总结本节主课，你现在可以：\n\n*   利用 `Graph`\
  \ 类将网络建模为一组节点和互连的边\n*   使用 `Graph` 类方法来插入、删除并跟踪网络中的边和节点。\n*   应用实用的问题解决算法，用于确定最短路径、连通性和最小生成树。\n\
  \n# 第 5 章：数独谜题求解器\n\n数独是一种逻辑谜题，你被给一个范围在 1 到 9 之间的 9×9 数字网格。该网格随后被进一步划分为 9 个 3×3\
  \ 的区域。\n\n规则非常简单：在每一行、每一列和每个 3x3 区域内，1-9 的每个数字必须出现一次。在谜题开始时，分配的网格元素恰好足以根据这些规则产生唯一的解决方案。本章介绍了一个\
  \ C++ `Grid` 类，用于生成和求解数独谜题网格。\n\n该类的核心是一个用于实际求解谜题的递归回溯算法。`Solve` 函数的每次递归调用都会通过为每个空单元格分配一个可行的数字来逐步求解谜题。在分配数字之前，首先会检查其可行性：我们检查该数字是否已存在于当前行、当前列和当前\
  \ 3x3 网格中。如果这样做是安全的，则分配该数字，并递归地检查此最新分配是否解决了问题。如果仍然没有找到，我们将尝试为当前的空数独单元格尝试下一个数字。如果我们尝试过的\
  \ 1-9 数字数字没有一个是成功的，则返回 false。\n\n```cpp\n#include <vector>\n#include <set>\n#include\
  \ <algorithm>\n#include <ctime>\n#include <iostream>\n\nconst int UNASSIGNED = 0;\n\
  const int N = 9;\n\nclass Grid\n{\nprivate:\n    std::vector<unsigned> grid;\n \
  \   std::set<unsigned> locations;\n    unsigned sizeSquared;\n\npublic:\n    Grid()\n\
  \    {\n        sizeSquared = N * N;\n        grid.resize( sizeSquared );\n    }\n\
  \n    void Copy( unsigned matrix[N][N] )\n    {\n        for (int row = 0; row <\
  \ N; ++row ) {\n            for ( int col = 0; col < N; ++col ) {\n            \
  \    grid[ row + col * N ] = matrix[ row ][ col ];\n            }\n        }\n \
  \   }\n\n    void Print() const\n    {\n        for ( int row = 0; row < N; row++\
  \ ) {\n            for (int col = 0; col < N; col++)\n                std::cout\
  \ << grid[ row + col * N ] << \" \";\n            std::cout << std::endl;\n    \
  \    }\n        std::cout << std::endl;\n    }\n\n    bool Solve()\n    {\n    \
  \    int row, col;\n        if (!HasUnassignedLocations(row, col)) return true;\n\
  \        // 考虑数字 1 到 9\n        for ( int num = 1; num <= 9; num++ ) {\n       \
  \     if ( IsFeasible( row, col, num ) ) {\n                grid[ row + col * N\
  \ ] = num;\n                if (Solve())\n                {\n                  \
  \  return true;\n                }\n                // 再次尝试\n                grid[\
  \ row + col * N ] = UNASSIGNED;\n            }\n        }\n        return false;\n\
  \    }\n\nprivate:\n    bool HasUnassignedLocations( int &row, int &col )\n    {\n\
  \        for (row = 0; row < N; row++)\n            for (col = 0; col < N; col++)\n\
  \            if (grid[row + col * N] == UNASSIGNED)\n                return true;\n\
  \        return false;\n    }\n\n    bool IsFeasible(int row, int col, int num)\n\
  \    {\n        // 检查数字是否未被放在当前行、列、3x3 框\n        return !InRow(row, num) &&\n \
  \       !InColumn(col) &&\n        !In33Box(row, col, num);\n    }\n\n    bool InRow(int\
  \ row, int num)\n    {\n        // 逻辑未完整\n        return false;\n    }\n\n    bool\
  \ InColumn(int col, int num)\n    {\n        // 逻辑未完整\n        return false;\n \
  \   }\n\n    bool In33Box(int row, int col, int num)\n    {\n        // 逻辑未完整\n\
  \        return false;\n    }\n};\n// ...\n```\n（注：提供的文本在 Grid 类中包含了重复/不完整的逻辑；我根据指令关注了格式。）\n\
  \n# 第 6 章：数学表达式解析器\n\n在实现自己的计算器时，有必要将数学表达式转换为适用于计算机的格式。\n\n调度算法（shunting-yard algorithm）是一种将以中缀法编写的数学表达式转换为逆波兰表示（RPN）的方法。RPN\
  \ 表示法与中缀法的区别在于运算符（`+`、`-`、`*`、`/`）位于操作数（数字）之后，这种结构更容易评估。\n\n例如，中缀表达式 `3 * 4` 变为\
  \ `3 4 *`。\n\n将表达式转换为逆波兰法的调度算法伪代码：\n\n```\n当（令牌存在）\n    读取令牌。\n    如果（令牌是数字）\n \
  \       将值推入栈中\n    如果（令牌是函数）\n        将令牌推入栈\n    如果（令牌是参数分隔符，例如逗号）\n        当（栈顶不是左括号）\n\
  \            将运算符从栈弹出到输出队列\n        如果（未遇到左括号）\n            错误 - 输入无效\n    如果（令牌是运算符\
  \ o1）\n        当（栈顶存在运算符 o2 且（o1 是左结合的且优先级 <= o2，或 o1 是右结合的且优先级 < o2））\n       \
  \     将 o2 从栈中弹出到输出队列\n        将 o1 推入栈中\n    如果（令牌是左括号）\n        将令牌推入栈\n    如果（令牌是右括号）\n\
  \        当（栈顶不是左括号）\n            将运算符从栈弹出到输出队列\n        从栈中弹出左括号，但不推入输出队列\n    \
  \    如果（栈顶的令牌是函数令牌）\n            将令牌弹出到输出队列\n        如果（栈空且未找到左括号）\n           \
  \ 错误 - 括号不匹配\n当（栈中仍有运算符令牌）\n    如果（栈顶的运算符令牌是括号）\n        错误 - 括号不匹配\n    将运算符弹出到输出队列\n\
  ```\n\n当输入表达式以逆波兰表示可用时，可以使用另一种基于栈的算法来评估 RPN 表达式并得出算术结果。\n\n伪代码如下：\n\n```\n对于每个令牌\n\
  \    如果（令牌是数字）\n        将值推入栈\n    如果（令牌是运算符）\n        从栈中弹出 2 个顶部值\n```\n\n\n\n\
  使用弹出的值作为参数计算操作符。\n\n将结果推入栈中。\n\n栈上剩余的唯一值即为计算结果。\n\n完整的代码实现如下：\n\n`ExpressionParser.h`\n\
  \n```cpp\n#include <algorithm>\n#include <string>\n#include <vector>\n#include <list>\n\
  #include <iostream>\n#include <fstream>\n#include <iterator>\n#include <queue>\n\
  #include <stack>\n#include <sstream>\n#include <locale>\n#include <stdlib.h>\n#include\
  \ <math.h>\n\nclass ExpressionParser\n{\n\npublic:\nExpressionParser( const std::string&\
  \ input );\nbool MatchingParetheses();\nbool Evaluate( const std::vector<std::string>&\
  \ rpn, std::string& result );\nbool InfixToRPN( std::vector<std::string>& inputs\
  \ );\n\nprivate:\nvoid ReplaceAll( std::string& str,\n\nconst std::string& from,\n\
  \nconst std::string& to );\nvoid Tokenize( std::list<std::string>& tokens,\n\nconst\
  \ std::string& delimiter );\n\nprivate:\nstd::string m_strInput;\n};\n```\n\n`ExpressionParser.cpp`\n\
  \n```cpp\n#include \"ExpressionParser.h\"\nconst std::string charSet[] = { \"(\"\
  , \")\", \"%\", \"+\", \"-\", \"*\", \"/\", \"^\", \",\" };\nconst double pi = 3.1415927;\n\
  const double e = 2.71828182846;\n\ntemplate<class BidirIt>\nBidirIt Prev(BidirIt\
  \ it,\n\ntypename std::iterator_traits<BidirIt>::difference_type n = 1)\n{\nstd::advance(it,\
  \ -n);\nreturn it;\n}\n\nint Modulo(int num, int div)\n{\nint mod = num % div;\n\
  return ( num >= 0 || mod == 0 ) ? mod : div + mod;\n}\n\nunsigned int OpArgCount(\
  \ const std::string& s )\n{\nunsigned int val = 1;\nif ( s == \"*\" || s == \"/\"\
  \ || s == \"%\" ||\n\ns == \"+\" || s == \"-\" || s == \"=\" ||\n\ns == \"^\" ||\
  \ s == \"POW\" )\n{\nval = 2;\n}\nelse if ( s == \"!\" )\n{\nval = 1;\n}\nreturn\
  \ val;\n}\n\n// 返回操作符优先级\nint OpPrecedence(const std::string& s)\n{\nint precedence\
  \ = 1;\nif ( s == \"!\" )\nprecedence = 4;\nelse if ( s == \"*\" || s == \"/\" ||\
  \ s == \"%\" )\nprecedence = 3;\nelse if ( s == \"+\" || s == \"-\" )\nprecedence\
  \ = 2;\nelse if ( s == \"=\" )\nprecedence = 1;\nreturn precedence;\n}\n\n// 如果是左结合的返回\
  \ true；否则返回 false\nbool OpLeftAssoc( const std::string& s )\n{\nbool opLeftAssoc\
  \ = false;\nif ( s == \"*\" || s == \"/\" ||\n\ns == \"%\" || s == \"+\" || s ==\
  \ \"-\" )\n{\nopLeftAssoc = true;\n}\nelse if ( s == \"=\" || s == \"!\" )\n{\n\
  opLeftAssoc = false;\n}\nreturn opLeftAssoc;\n}\n\n// 标记是否为操作符\nbool IsOperator(\
  \ const std::string& s )\n{\nreturn s == \"+\" || s == \"-\" ||\n\ns == \"/\" ||\
  \ s == \"*\" ||\n\ns == \"!\" || s == \"%\" ||\n\ns == \"=\";\n}\n\n// 标记是否为函数参数分隔符，例如逗号\n\
  bool IsComma( const std::string& s )\n{\nreturn s == \",\";\n}\n\n// 将字符串转换为大写\n\
  std::string UpperCase( std::string input )\n{\nfor ( std::string::iterator it =\
  \ input.begin();\n\nit != input.end();\n\n++it )\n*it = toupper(*it);\nreturn input;\n\
  }\n\n// 标记是否为 PI\nbool IsPi( const std::string& s )\n{\nif ( UpperCase( s ) == \"\
  PI\" )\nreturn true;\nreturn false;\n}\n\n// 标记是否为欧常数\nbool IsE( const std::string&\
  \ s )\n{\nif ( UpperCase( s ) == \"E\" )\n{\nreturn true;\n}\nreturn false;\n}\n\
  \n// 标记是否为函数\nbool IsFunction( const std::string& s )\n{\nstd::string str = UpperCase(\
  \ s );\nbool isFunction = false;\nif ( str.find( \"^\" ) != std::string::npos ||\n\
  \nstr.find( \"SIN\" ) != std::string::npos ||\n\nstr.find( \"COS\" ) != std::string::npos\
  \ ||\n\nstr.find( \"TAN\" ) != std::string::npos ||\n\nstr.find( \"LN\" ) != std::string::npos\
  \ ||\n\nstr.find( \"LOG\" ) != std::string::npos ||\n\nstr.find( \"EXP\" ) != std::string::npos\
  \ ||\n\nstr.find( \"POW\" ) != std::string::npos ||\n\nstr.find( \"SQRT\" ) != std::string::npos\
  \ )\n{\nisFunction = true;\n}\nreturn isFunction;\n}\n\n// 标记是否为浮点数\nbool IsFloat(\
  \ const std::string& s )\n{\nstd::istringstream iss( s );\nfloat f;\niss >> std::noskipws\
  \ >> f;\nreturn iss.eof() && !iss.fail();\n// 标记字符串是否为数字\nbool IsNumber( const std::string&\
  \ s )\n{\nstd::string::const_iterator it = s.begin();\nwhile ( it != s.end() &&\
  \ std::isdigit(*it) )\n{\n++it;\n}\nreturn !s.empty() && it == s.end();\n}\n\nExpressionParser::ExpressionParser(\
  \ const std::string& input )\n{\nm_strInput = input;\n}\n\n// 判断括号是否匹配\nbool ExpressionParser::Matchingtheses()\n\
  {\nconst size_t nLeft = std::count( m_strInput.begin(),\n\nm_strInput.end(), '(');\n\
  const size_t nRight = std::count( m_strInput.begin(),\n\nm_strInput.end(), ')');\n\
  return nLeft == nRight && m_strInput.empty();\n}\n\n// 将选定文本分割为由分隔符的字符串\nvoid ExpressionParser::Tokenize(\
  \ std::list<std::string>& tokens,\n\nconst std::string& delimiter )\n{\n// 在特殊字符前后插入空格\n\
  size_t size = sizeof(charSet) / sizeof(std::string);\nfor ( int i = 0; i < (int)(\
  \ size );\n{\nstd::string s = charSet[i];\nReplaceAll( m_strInput, s, \" \" + s\
  \ + \" \");\n}\nsize_t next_pos = 0;\nsize_t init_pos = m_strInput.find_first_not_of(delimiter);\n\
  while ( next_pos != std::string::npos &&\n\ninit_pos != std::string::npos )\n{\n\
  next_pos = m_strInput.find(delimiter, init_pos);\nstd::string token = m_strInput.substr(init_pos,\
  \ next_pos - init_pos);\ntokens.push_back( token );\ninit_pos = m_strInput.find_first_not_of(delimiter,\
  \ next_pos);\n}\nstd::string firstToken = tokens.front();\nif ( firstToken == \"\
  -\" )\n{\nstd::list<std::string>::iterator it = tokens.begin();\nit++;\nif ( it\
  \ == tokens.end() ) return;\nstd::string nextToken = *(it);\nif ( IsNumber( nextToken\
  \ ) || IsFloat( nextToken ) )\n{\ntokens.pop_front();\ntokens.front() = firstToken\
  \ + nextToken;\n}\nelse if ( nextToken == \"(\" || IsFunction( nextToken ) )\n{\n\
  tokens.front() = firstToken + \"1\";\ntokens.insert( it, \"*\");\n}\n// 负负得加\nelse\
  \ if ( nextToken == \"-\" && firstToken == \"-\" )\n{\nstd::list<std::string>::iterator\
  \ nit = it;\nstd::advance( nit, -1);\ntokens.erase( it );\ntokens.erase( nit );\n\
  }\n// 处理左括号或运算符后的负号\ntypedef std::list<std::string>::iterator t_iter;\nstd::string\
  \ prevToken = \"\";\nfor ( t_iter it = tokens.begin(); it != Prev(tokens.end());\
  \ it++ )\n{\nstd::string token = *it;\nstd::list<std::string>::iterator nit = it;\n\
  std::advance( nit, 1 );\nif ( nit == tokens.end() ) break;\nstd::string ntoken =\
  \ *nit;\nif ( token == \"-\" && prevToken == \"(\" )\n{\nif ( IsNumber( ntoken )\
  \ || IsFloat( ntoken ) )\n{\ntokens.erase( nit );\n*it = \"-\" + ntoken;\ntoken\
  \ = *it;\n}\n}\nelse if ( token == \"-\" && ( IsOperator( prevToken ) || prevToken\
  \ == \"^\" || prevToken == \"%\" ) )\n{\n// 负负得加\nif ( token == \"-\" && prevToken\
  \ == \"-\" )\n{\nstd::list<std::string>::iterator nit = it;\nstd::list<std::string>::iterator\
  \ nnit = nit;\nnnit++;\nstd::advance( nit, -1);\ntokens.erase( it );\n*nit = \"\
  +\";\nstd::list<std::string>::iterator pnit = nit;\nstd::advance( pnit, -1 );\n\
  if ( IsOperator( *pnit ) || *pnit == \"(\" )\ntokens.erase( nit );\ntoken = *nnit;\
  \ it = nnit;\nif ( it == Prev(tokens.end() ) ) break;\n}\nelse if ( IsNumber( ntoken\
  \ ) || IsFloat( ntoken ) || IsFunction( ntoken ) )\n{\nbool exit = false;\nif (\
  \ nit == Prev(tokens.end() ) ) exit = true;\ntokens.erase( nit );\n*it = \"-\" +\
  \ ntoken;\ntoken = *it;\nif ( exit ) break;\n}\nelse if ( ntoken == \"(\" )\n{\n\
  *it = \"-1\";\ntoken = *it;\ntokens.insert( nit, \"*\");\n}\n}\nprevToken = token;\n\
  }\n// 处理左括号前的负号\nprevToken = \"\";\nt_iter prevIt;\nfor ( t_iter it = tokens.begin();\
  \ it != tokens.end(); it++ )\n{\nstd::string token = *it;\nif ( token == \"(\" &&\
  \ prevToken == \"-\" )\n{\ntokens.insert( it, \"1\");\ntokens.insert( it, \"*\"\
  );\n}\nprevToken = token;\nprevIt = it;\n}\n}\n}\n}\n\n// 将选定字符串的所有实例替换为替换字符串\n\
  void ExpressionParser::ReplaceAll( std::string& str, const std::string& from,\n\n\
  const std::string& to )\n{\nsize_t start_pos = 0;\nwhile ( (start_pos = str.find(from,\
  \ start_pos)) != std::string::npos)\n{\nstr.replace(start_pos, from.length(), to);\n\
  start_pos += to.length();\n}\n}\n```\n\n// 从传入的 RPN 字符串推导出数值结果\n\n\n\n\n\n```cpp\n\
  bool ExpressionParser::Evaluate(\nconst std::vector<std::string>& rpn,\nstd::string&\
  \ result )\n{\n  typedef std::vector<std::string>::const_iterator rpn_iter;\n  std::stack<std::string>\
  \ stack;\n  for ( rpn_iter it = rpn.begin(); it != rpn.end(); it++ )\n  {\n    std::string\
  \ token = *it;\n    if( IsNumber( token ) || IsFloat( token ) ||\n    IsPi( token\
  \ ) || IsE( token ) )\n    {\n      if ( IsPi( token ) )\n      {\n        std::stringstream\
  \ s;\n        s << pi;\n        token = s.str();\n      }\n      else if ( IsE(\
  \ token ) )\n      {\n        std::stringstream s;\n        s << e;\n        token\
  \ = s.str();\n      }\n      stack.push( token );\n    }\n    else if( IsOperator(\
  \ token ) || IsFunction( token ) )\n    {\n      double result = 0.0;\n      unsigned\
  \ int nargs = OpArgCount( UpperCase( token ) );\n      bool isUnary = false;\n \
  \     unsigned int stackArgs = stack.size();\n      std::vector<double> args;\n\
  \      if( stackArgs < nargs)\n      {\n        // For dealing with unary '-' or\
  \ unary '+'\n        if ( stackArgs == 1 &&\n        nargs == 2 && ( token == \"\
  +\" || token == \"-\" ) )\n        {\n          std::string value = stack.top();\n\
  \          result = strtod( value.c_str(), NULL );\n          stack.pop(); isUnary\
  \ = true;\n        }\n        else { // (Error) Insufficient values in the expression.\n\
  \          return false;\n        }\n      }\n      else\n      {\n        // Else,\
  \ Pop the top n values from the stack.\n        while ( nargs > 0 )\n        {\n\
  \          std::string value = stack.top();\n          double d = strtod( value.c_str(),\
  \ NULL );\n          args.push_back( d );\n          stack.pop(); nargs--;\n   \
  \     }\n      }\n      // Evaluate the operator, with the values as arguments.\n\
  \      if ( IsOperator( token ) && !isUnary )\n      {\n        double d2 = args[\
  \ 0 ];\n        double d1 = args[ 1 ];\n        if ( token == \"+\" ) {\n      \
  \    result = d1 + d2;\n        }\n        else if ( token == \"-\" ) {\n      \
  \    result = d1 - d2;\n        }\n        else if ( token == \"*\" ) {\n      \
  \    result = d1 * d2;\n        }\n        else if ( token == \"/\" ) {\n      \
  \    result = d1 / d2;\n        }\n        else if ( token == \"%\" ) {\n      \
  \    int i2 = (int) args[ 0 ];\n          int i1 = (int) args[ 1 ];\n          double\
  \ iresult = Modulo( i1, i2 );\n          result = iresult;\n        }\n      }\n\
  \      else if ( IsFunction( token ) )\n      {\n        double d0 = args[ 0 ];\n\
  \        std::string capToken = UpperCase( token );\n        double mult = token.find(\
  \ \"-\" ) != std::string::npos ? -1 : 1;\n        if ( capToken.find( \"SIN\" )\
  \ != std::string::npos ) {\n          result = sin( d0 );\n        }\n        else\
  \ if ( capToken.find( \"COS\" ) != std::string::npos ) {\n          result = cos(\
  \ d0 );\n        }\n        else if ( capToken.find( \"TAN\" ) != std::string::npos\
  \ ) {\n          result = tan( d0 );\n        }\n        else if ( capToken.find(\
  \ \"LN\" ) != std::string::npos ) {\n          result = log( d0 );\n        }\n\
  \        else if ( capToken.find( \"LOG\" ) != std::string::npos ) {\n         \
  \ result = log10( d0 );\n        }\n        else if ( capToken.find( \"EXP\" ) !=\
  \ std::string::npos ) {\n          result = exp( d0 );\n        }\n        else\
  \ if ( capToken.find( \"^\" ) != std::string::npos ) {\n          double d2 = args[\
  \ 0 ]; double d1 = args[ 1 ];\n          if ( d1 < 0 ) mult = -1.0;\n          result\
  \ = pow( (double) d1, d2);\n        }\n        else if ( capToken.find( \"POW\"\
  \ ) != std::string::npos ) {\n          double d2 = args[ 0 ]; double d1 = args[\
  \ 1 ];\n          result = pow( d1, d2);\n        }\n        else if ( capToken.find(\
  \ \"SQRT\" ) != std::string::npos ) {\n          result = sqrt( d0 );\n        }\n\
  \        result *= mult;\n      }\n      // Push the returned results, if any, back\
  \ onto the stack\n      if ( result == (long) result )\n      {\n        result\
  \ = long( result );\n      }\n      std::stringstream s; s << result;\n      stack.push(\
  \ s.str() );\n    }\n    }\n    if ( stack.size() == 1 )\n    {\n      result =\
  \ stack.top();\n      double res = strtod( result.c_str(), NULL );\n      if ( res\
  \ == (long) res )\n      {\n        long lres = (long) res;\n        std::stringstream\
  \ s;\n        s << lres;\n        result = s.str();\n      }\n      return true;\n\
  \    }\n    return false; // (Error) The user input has too many values\n  }\n}\n\
  \n// Convert infix expression format into reverse Polish notation\nbool ExpressionParser::InfixToRPN(\
  \ std::vector<std::string>& inputs )\n{\n  typedef std::list<std::string>::const_iterator\
  \ tok_iter;\n  std::list<std::string> infix;\n  std::stack<std::string> stack;\n\
  \  std::queue<std::string> outputQueue;\n  Tokenize( infix, \" \" );\n  bool success\
  \ = true;\n  for ( tok_iter it = infix.begin(); it != infix.end(); it++ )\n  {\n\
  \    std::string token = *it;\n    if ( IsNumber( token ) ||\n    IsFloat( token\
  \ ) ||\n    IsPi( token ) ||\n    IsE( token ) )\n    {\n      outputQueue.push(\
  \ token );\n    }\n    else if ( IsFunction( token ) )\n    {\n      stack.push(\
  \ token );\n    }\n    else if ( IsComma( token ) )\n    {\n      std::string stackToken\
  \ = stack.top();\n      while ( stackToken != \"(\" )\n      {\n        outputQueue.push(\
  \ stackToken );\n        stack.pop(); stackToken = stack.top();\n      }\n     \
  \ if ( stackToken == \"(\" )\n      {\n        success = true;\n      }\n      else\n\
  \      {\n        success = false;\n      }\n    }\n    else if ( IsOperator( token\
  \ ) )\n    {\n      while( !stack.empty() &&\n      IsOperator( stack.top() ) &&\n\
  \      ( Precedence( token ) < Precedence( stack.top() ) ||\n      ( Precedence(\
  \ token ) == Precedence( stack.top() ) && Associativity( token ) == Left ) )\n \
  \     {\n        outputQueue.push( stack.top() );\n        stack.pop();\n      }\n\
  \      stack.push( token );\n    }\n    else if ( token == \"(\" )\n    {\n    \
  \  stack.push( token );\n    }\n    else if ( token == \")\" )\n    {\n      while\
  \ ( !stack.empty() && stack.top() != \"(\" )\n      {\n        outputQueue.push(\
  \ stack.top() );\n        stack.pop();\n      }\n      if ( !stack.empty() )\n \
  \     {\n        stack.pop();\n      }\n    }\n    else\n    {\n      outputQueue.push(\
  \ token );\n    }\n  }\n  while ( !stack.empty() )\n  {\n    outputQueue.push( stack.top()\
  \ );\n    stack.pop();\n  }\n  while ( !outputQueue.empty() )\n  {\n    inputs.push_back(\
  \ outputQueue.front() );\n    outputQueue.pop();\n  }\n  return success;\n}\n```\n\
