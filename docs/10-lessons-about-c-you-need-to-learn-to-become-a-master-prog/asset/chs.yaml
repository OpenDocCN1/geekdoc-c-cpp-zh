  \nstd::for_each( rmap.begin(), rmap.end(),\n\n[](std::pair<const std::string, int>&\
  \ map)\n{\nstd::cout << map.first << \" \" << map.second << std::endl;\n});\n\n\
  return 0;\n}\n```\n\n现在让我们更进一阶。`std::multimap` 容器提供了一种将一组数据项映射到一个键的方法。这与 `std::map`\
  \ 是键与其关联数据项之间的一一映射形成对比。与其使用 `find` 方法查找与其 `key` 关联的单个项，更可能使用 `equal_range` 方法来获取与组关联的项范围并遍历这些项：\n\
  \n```cpp\n#include <map>\n#include <string>\n#include <algorithm>\n#include <iostream>\n\
  \nint main()\n{\ntypedef std::multimap<std::string, int> ResultsMap;\ntypedef std::multimap<std::string,\
  \ int>::const_iterator ResultsIter;\n\nResultsMap rmap;\nrmap.insert( ResultsMap::value_type(\
  \ \"Geography\", 87 ) );\nrmap.insert( ResultsMap::value_type( \"Physics\", 57 )\
  \ );\nrmap.insert( ResultsMap::value_type( \"Physics\", 69 ) );\nrmap.insert( ResultsMap::value_type(\
  \ \"Physics\", 45 ) );\n\nconst std::string subject = \"Physics\";\nconst std::pair<ResultsIter,\
  \ ResultsIter> group =\nrmap.equal_range( subject );\n\nstd::cout << subject <<\
  \ \" =>\";\nstd::for_each( group.first, group.second,\n\n[](const std::pair<const\
  \ std::string, int>& gr)\n{\nstd::cout << gr.second << \" \";\n});\n\nreturn 0;\n\
  }\n```\n\n## 10.3  STL 算法及其用法\n\n### 替换传统的 for 循环\n\n除了提高可读性外，使用 `std::for_each`\
  \ 代替传统的 for 循环来遍历序列还有一些很棒的优点。它将允许你在 `std::for_each` 之上编写算法，该算法适用于任何迭代器，并减少了因拼写错误引入\
  \ bug 的风险。具体来说，它对范围内的每个元素应用函数对象（仿器），并在将其应用于范围内的所有元素后返回该函数对象的拷贝。这里有一个使用 `std::for_each`\
  \ 追加 `std::vector` 容器中包含的一组字符串的示例。它收集存储在 `Token` 结构体的 `std::vector` 中的每个 `txt` 项，并将它们附加到\
  \ `Appender` 仿对象的 `txt` 成员中，该仿器拥有 `Word` 成员函数，用于返回完整的拼接字符串：\n\n```cpp\n#include\
  \ <iostream>\n#include <string>\n#include <vector>\n#include <algorithm>\n\nstruct\
  \ Token\n{\nstd::string txt;\nToken( std::string s ) : txt( s ) {}\n};\n\nclass\
  \ Append\n{\nprivate:\nstd::string txt;\npublic:\nAppend() : txt(\"\") {}\nvoid\
  \ operator() (const Token &x)\n{ txt.append( x.txt + \" \" ); }\nstd::string Word()\
  \ const\n{ return txt; }\n};\n\nint main()\n{\nstd::vector<Token> tokens;\ntokens.push_back(\
  \ Token( \"Hello\" ) );\ntokens.push_back( Token( \"and\" ) );\ntokens.push_back(\
  \ Token( \"welcome!\" ) );\n\nstd::cout << std::for_each(\ntokens.begin(),\ntokens.end(),\n\
  Append()).Word() // 注意：原文代码逻辑略有误，此处保持翻译意图\n\nreturn 0;\n}\n```\n\n### 替换示例\n\n除了提高可读性外，在遍历序列时使用\
  \ `std::for_each` 代替传统的 for 循环还有一些很棒的优点。它将允许你在 `std::for_each` 之上编写算法，该算法适用于任何迭代器，并减少了因拼写错误引入\
  \ bug 的风险。具体来说，它对范围内的每个元素应用函数对象（仿器），并在将其应用于范围内的所有元素后返回该函数对象的拷贝。这里有一个使用 `std::for_each`\
  \ 追加 `std::vector` 容器中包含的一组字符串的示例。它收集存储在 `Token` 结构体的 `std::vector` 中的每个 `txt` 项，并将它们附加到\
  \ `Appender` 仿对象的 `txt` 成员中，该仿器拥有 `Word` 成员函数，用于返回完整的拼接字符串：\n\n```cpp\n#include\
  \ <iostream>\n#include <string>\n#include <vector>\n#include <algorithm>\n\nstruct\
  \ Token\n{\nstd::string txt;\nToken( std::string s ) : txt( s ) {}\n};\n\nclass\
  \ Append\n{\nprivate:\nstd::string txt;\npublic:\nAppend() : txt(\"\") {}\nvoid\
  \ operator() (const Token &x)\n{ txt.append( x.txt + \" \" ); }\nstd::string Word()\
  \ const\n{ return txt; }\n};\n\nint main()\n{\nstd::vector<Token> tokens;\ntokens.push_back(\
  \ Token( \"Hello\" ) );\ntokens.push_back( Token( \"and\" ) );\ntokens.push_back(\
  \ Token( \"welcome!\" ) );\n\nstd::cout << std::for_each(\ntokens.begin(),\ntokens.end(),\n\
  Append()).Word() << std::endl;\n\nreturn 0;\n}\n```\n*(注：由于原文文本在 `std::for_each`\
  \ 处似乎截断或存在格式混乱，上述译文根据上下文进行了对齐处理)*\n\n### 排序与搜索\n\nSTL `sort` 算法作用于选定的范围元素，根据用户定义的谓词进行排列。这里有一个示例展示了如何排序并输出数据：\n\
  \n```cpp\n#include <iostream>\n#include <ostream>\n#include <vector>\n#include <algorithm>\n\
  #include <memory>\n\nclass Item\n{\nint val;\npublic:\nItem( const int& val ) :\
  \ val( val ) {}\nvirtual char* ItemName() = 0;\nint GetVal() { return val; }\nvoid\
  \ OutputToStream(std::ostream& os )\n{\nos << val;\n}\n};\n\n// 派生类 - \"old\"\n\
  class OldItem : public Item\n{\npublic:\nOldItem( const int& val ) : Item( val )\
  \ {}\nchar* ItemName() override { return (char*)\"old\"; }\n};\n\n// 派生类 - \"new\"\
  \nclass NewItem : public Item\n{\npublic:\nNewItem( const int& val ) : Item( val\
  \ ) {}\nchar* ItemName() override { return (char*)\"new\"; }\n};\n\n// 智能指针指向 Item\n\
  typedef std::unique_ptr<Item> ItemPtr;\n\nstruct Ascending\n{\nbool operator()(\
  \ const ItemPtr& start, const ItemPtr& end )\n{\nreturn start->GetVal() < end->GetVal();\n\
  }\n};\n\nint main()\n{\nint values[] = { 100, 101, -2, 23, 1010, 44, 55, 3 };\n\
  const size_t size = sizeof( values ) / sizeof( values[ 0 ] );\nstd::vector<ItemPtr>\
  \ itemVector;\nfor (size_t i = 0; i < size; ++i)\n{\nif (i % 2 == 0) itemVector.push_back(\
  \ std::make_unique<OldItem>(values[i]) );\nelse itemVector.push_back( std::make_unique<NewItem>(values[i])\
  \ );\n}\n\nstd::sort( itemVector.begin(), itemVector.end(), Ascending() );\n\nstd::for_each(\
  \ itemVector.begin(), itemVector.end(), []( ItemPtr& item )\n{\nitem->OutputToStream(std::cout\
  \ );\n});\n\nreturn 0;\n}\n```\n\n这产生了如下输出：\n\nimages/0152.jpeg\n\n事实上，STL 拥有大量的算法来帮助你定位存储在容器中的项。这些算法速度很快，`binary_search`\
  \ 或 `equal_range` 通常是对数 级的。而 `std::map` 等容器在插入时会将数据保持在自平衡二叉搜索树中，这在查找这些项时提供了某些性能保证。\n\
  \n### 拷贝、填充、替换和删除\n\n许多任务归结为能够移动对象或删除它们。输入迭代器和输出迭代器通常是完成这些任务的必要手段，因为我们需要指定处理哪些数据以及输出输出。\n\
  \n这个示例将 `std::vector` 容器的元素拷贝到标准输出，其中 `ostream_iterator` 是输出迭代器类型的适配器。迭代器操作定义为通过迭代器赋值将打印到标准输出，每次打印后都跟着一个空白字符：\n\
  \n```cpp\n#include <vector>\n#include <algorithm>\n#include <iterator>\n#include\
  \ <iostream>\n\nclass descending\n{\npublic:\nbool operator()( int x, int y ) const\n\
  { return x > y; }\n};\n\nint main()\n{\nint values[] = { 100, 101, -2, 23, 1010,\
  \ 44, 55, 3 };\nconst size_t size = sizeof( values ) / sizeof( values[ 0 ] );\n\
  std::vector<int> v( values, values + size );\n\nstd::sort( v.begin(), v.end(), descending()\
  \ );\n\nstd::copy( v.begin(),\nv.end(),\nstd::ostream_iterator<int>(std::cout, '\
  \ '));\n}\n```\n\n\n\n\n\n```cpp\nstd::ostream_iterator<int>( std::cout, \" \" )\
  \ );\n\nreturn 0;\n\n}\n```\n\n这输出了以下输出：\n\n![](img/00153.jpeg)\n\n### 变异与转换\n\n\
  `std::transform` 算法对给定范围内的每个对象应用一个函数，并将函数的结果复制到由输出迭代器指向的新范围中。此示例展示了如何使用函数适配器，它接受两个输入范围，并根据第二个范围的值增加第一个范围的值。\n\
  \n```cpp\n#include <iostream>\n#include <vector>\n#include <algorithm>\n#include\
  \ <iterator>\n\ntemplate<typename T, typename InputIterator>\nvoid Print(std::ostream&\
  \ ostr,\nInputIterator itbegin,\nInputIterator itend,\nconst std::string& delimiter)\n\
  {\n    std::copy(itbegin, itend,\n    std::ostream_iterator<T>(ostr, delimiter.c_str()));\n\
  }\n\ntemplate<class T>\nclass IncreaseByVal\n{\npublic:\n    T operator()( T a,\
  \ T b ) const\n    { return a + b; }\n};\n\nint main()\n{\n    int x[] = { 1, 2,\
  \ 3, 4, 5 };\n    int y[] = { 1, 2, 3, 4, 5 };\n    std::transform( x,\n    x +\
  \ sizeof( x ) / sizeof( x[ 0 ] ),\n    y,\n    x,\n    IncreaseByVal<int>() );\n\
  \    Print<int, int[]>( std::cout,\n    x,\n    x + sizeof( x ) / sizeof( x[ 0 ]\
  \ ),\n    \" \" );\n    return 0;\n}\n```\n\n## 10.4 更多 STL 提示、技巧与示例\n\n### 集合算法\n\
  \n这是一个实用示例：使用 `union`（并集）和 `set intersection`（交集）来计算 `Jaccard Index`（杰卡德指数），这是一种衡量样本集相似性/或多样性的的方法。\n\
  \n```cpp\n#include <iostream>\n#include <vector>\n#include <algorithm>\n#include\
  \ <iterator>\n#include <string>\n\nclass Token\n{\nprivate:\n    std::string str;\n\
  public:\n    Token() {}\n    Token( std::string val ) : str( val ) {}\n    std::string\
  \ Word() const\n    { return str; }\n};\n\nstruct Ascending\n{\n    bool operator()\
  \ ( const Token& start, const Token& end )\n    {\n        return start.Word() <\
  \ end.Word();\n    }\n};\n\nint main()\n{\n    std::string str1[] = { \"The\", \"\
  crazy\", \"cat\", \"sat\", \"on\", \"the\", \"mat\" };\n    std::string str2[] =\
  \ { \"The\", \"cat\", \"sat\", \"on\", \"the\", \"red\", \"mat\" };\n    std::vector<Token>::iterator\
  \ tok_intersect, tok_union;\n    int size1 = sizeof( str1 ) / sizeof( str1[ 0 ]\
  \ );\n    int size2 = sizeof( str2 ) / sizeof( str2[ 0 ] );\n    std::vector<Token>\
  \ tokens1( str1, str1 + size1 );\n    std::vector<Token> tokens2( str2, str2 + size2\
  \ );\n    std::vector<Token> tokens( size1 + size2 );\n    std::sort( tokens1.begin(),\
  \ tokens1.end(), Ascending() );\n    std::sort( tokens2.begin(), tokens2.end(),\
  \ Ascending() );\n    tok_intersect = std::set_intersection(\n        tokens1.begin(),\n\
  \        tokens1.end(),\n        tokens2.begin(),\n        tokens2.end(),\n    \
  \    tokens.begin(),\n        Ascending() );\n    int intersect_size = int( tok_intersect\
  \ - tokens.begin() );\n    tok_union = std::set_union (\n        tokens1.begin(),\n\
  \        tokens1.end(),\n        tokens2.begin(),\n        tokens2.end(),\n    \
  \    tokens.begin(),\n        Ascending() );\n    int union_size = int( tok_union\
  \ - tokens.begin() );\n    double JaccardIndex = (double) intersect_size / (double)\
  \ union_size;\n    std::cout << \"Jaccard Index = \"\n    << JaccardIndex\n    <<\
  \ std::endl;\n    return 0;\n}\n```\n\n### 字符串分词与分割\n\n分词（Tokenization）是根据某些分隔符（通常是空格或其他标点字符）将文本拆分为单独项目（`tokens`）的过程。\n\
  \n此示例获取示例文本并将每个分词后的单词插入 vector 数组中：\n\n```cpp\n#include <iostream>\n#include <string>\n\
  #include <sstream>\n#include <algorithm>\n#include <iterator>\n#include <vector>\n\
  \ntemplate<typename T, typename InputIterator>\nvoid Print( std::ostream& ostr,\n\
  InputIterator itbegin,\nInputIterator itend,\nconst std::string& delimiter )\n{\n\
  \    std::copy( itbegin,\n    itend,\n    std::ostream_iterator<T>( ostr, delimiter.c_str()\
  \ ) );\n}\n\nint main()\n{\n    typedef std::vector<std::string>::iterator str_iter;\n\
  \    std::string txt = \"The cat sat on the mat...\";\n    std::istringstream iss(\
  \ txt );\n    std::vector<std::string> tokens;\n    std::copy(\n        std::istream_iterator<std::string>(iss),\n\
  \        std::istream_iterator<std::string>(),\n        std::back_inserter<std::vector<std::string>>(\
  \ tokens ) );\n    // 打印 vector std::string 项\n    Print<std::string, str_iter>(\
  \ std::cout,\n    tokens.begin(),\n    tokens.end(),\n    \" \" );\n}\n```\n\n这输出了分词后的输出：\n\
  \n![](img/0154.jpeg)\n\n### 使用多维数组\n\n这里有多维数组的示例。注意 `std::vector` 可以创建动态大小的多维数组。\n\
  \n```cpp\n#include <vector>\n#include <stdlib.h>\n#include <iostream>\n\nconst size_t\
  \ HEIGHT = 5;\nconst size_t WIDTH = 3;\nconst size_t DEPTH = 7;\n\nint main()\n\
  {\n    std::vector<std::vector<std::vector<int>>> array3D(HEIGHT, std::vector<std::vector<int>>(WIDTH,\
  \ std::vector<int>(DEPTH)));\n\n    for (size_t i = 0; i < HEIGHT; ++i) {\n    \
  \    for (size_t j = 0; j < WIDTH; ++j) {\n            for (size_t k = 0; k < DEPTH;\
  \ ++k) {\n                array3D[i][j][k] = i + j + k;\n            }\n       \
  \ }\n    }\n    return 0; \n}\n```\n\n### 如何按值对 map 进行排序\n\n由于你无法按值对 `std::map`\
  \ 本身进行排序，可以将映射拷贝到 `std::vector` 中然后对 `std::vector` 进行排序。\n\n```cpp\n#include <map>\n\
  #include <vector>\n#include <algorithm>\n#include <iostream>\n\nint main()\n{\n\
  \    std::map<std::string, int> map;\n    map[\"apple\"] = 5;\n    map[\"banana\"\
  ] = 2;\n    map[\"cherry\"] = 8;\n\n    std::vector<std::pair<std::string, int>>\
  \ vec(map.begin(), map.end());\n\n    std::sort(vec.begin(), vec.end(), [](const\
  \ auto& a, const auto& b) {\n        return a.second < b.second;\n    });\n\n  \
  \  for (const auto& pair : vec) {\n        std::cout << pair.first << \": \" <<\
  \ pair.second << std::endl;\n    }\n    return 0;\n}\n```\n\n\n\n```cpp\nstd::vector<\
  \ data_t > vec(\n    link_map.begin(),\n    link_map.end()\n);\nstd::sort(\n   \
  \ vec.begin(),\n    vec.end(),\n    less_second<data_t>()\n);\nreturn vec;\n}\n\n\
  void PrintLinkMap()\n{\n    std::cout << std::endl;\n    std::for_each( link_map.begin(),\
  \ link_map.end(),\n    []( std::pair< const std::pair<int,int>, double >& lmap )\n\
  \    {\n        std::cout << lmap.first.first << \" \"\n        << lmap.first.second\
  \ << \" \"\n        << lmap.second << std::endl;\n    });\n}\n\nvoid PrintSortedEdges(\
  \ const std::vector<data_t>& vec )\n{\n    std::cout << std::endl;\n    std::for_each(\
  \ vec.begin(), vec.end(), []( const data_t& dt )\n    {\n        std::cout << dt.first.first\
  \ << \" \"\n        << dt.first.second << \" \"\n        << dt.second\n        <<\
  \ std::endl;\n    });\n}\n\nint main()\n{\n    // Create mapping between node pairs\
  \ and weights\n    link_map[ std::pair<int,int>(0,1) ] = 1.1;\n    link_map[ std::pair<int,int>(1,2)\
  \ ] = 0.1;\n    link_map[ std::pair<int,int>(2,3) ] = 6.2;\n    link_map[ std::pair<int,int>(3,4)\
  \ ] = 3.4;\n    link_map[ std::pair<int,int>(4,5) ] = 5.7;\n    link_map[ std::pair<int,int>(5,6)\
  \ ] = 2.2;\n    link_map[ std::pair<int,int>(0,8) ] = 1.8;\n    PrintLinkMap();\n\
  \    // Sort the mapping according to link weight\n    std::vector<data_t> vec =\
  \ sorted_edges();\n    PrintSortedEdges( vec );\n    return 0;\n}\n```\n\n### 永久移除\
  \ STL 容器元素\n\n与所有的 STL 算法一样，`remove` 接收一对迭代器，以确定它需要操作的容器元素范围，如其声明所示：\n\n```cpp\n\
  template< class ForwardIterator, class T >\nForwardIterator remove( ForwardIterator\
  \ first,\nForwardIterator last,\nconst T& value );\n```\n\n然而，`remove` 并不知道持有迭代器元素的容器，只知道迭代器。因此，`remove`\
  \ 无法从迭代器跳转到持有该迭代器的容器，从而在物理上无法从该容器中删除元素。`remove` 并没有在字面意义上删除元素，这是让许多人感到困惑的根源！尝试一下看看从容器中移除元素实际上并没有改变该容器中元素的总数：\n\
  \n这将产生输出：\n\n![](img/00156.jpeg)\n\n### 使用 STL 生成排列\n\n简单来说，给定一个输入字符串，我们如何生成它所有可能的排列？字符串排列是通过重新排列其元素的位置找到的。我们知道长度为\
  \ `n` 的字符串将有 `n!`（n 的阶乘）种排列。例如，字符串“xyz”有以下排列：\n\nxyz\nxzy\nyxz\nyzx\nzxy\nzyx\n\n\
  你可以通过以下代码看到这一点：\n\n```cpp\n#include <iostream>\n#include <algorithm>\n#include <iterator>\n\
  #include <string.h>\nint main()\n{\n    char str[] = \"abcd\";\n    const size_t\
  \ len = strlen( str );\n    do\n    {\n        std::copy( str, str + len, ostream_iterator<char>(std::cout\
  \ ) );\n        std::cout << std::endl;\n    }\nwhile ( std::next_permutation( str,\
  \ str + len ) );\n}\n```\n\n这产生了以下输出：\n\n![](img/157)\n\n### 统计文本文件中单词的出现次数\n\n\
  现在有一个使用 STL 关联数组作为单词计数器的示例。这段代码在读取文本文件内容的同时，每个单词出现次数的运行总计。排除输出结果和剔除我们希望计数的标点符号字符的代码只需要几行。这行具有欺骗性的、简单的代码\
  \ `counter[ tok ]++` 用于查找给定单词的计数器并增加其值。它遍历标准 `map` 使用的红黑树以找到适当节点，选择 `<Key,T>` 的部分然后对其递增。注意，单词计数器有一个默认构造函数来将值设置为零。如果没有这个，当第一次运行\
  \ `counter[ tok ]++` 这行代码时，`counter` 将设置为某个任意值。这并不是我们想要的值。\n\n```cpp\n#include <iostream>\n\
  #include <iomanip>\n#include <fstream>\n#include <algorithm>\n#include <map>\n#include\
  \ <string>\n#include <vector>\n#include <iterator>\n\ntemplate <class T>\nstruct\
  \ less_second : std::binary_function<T, T, bool>\n{\n    bool operator()( const\
  \ T& lhs, const T& rhs )\n    { return lhs.second < rhs.second; }\n};\n\nclass WordCounter\n\
  {\npublic:\n    int value;\n    WordCounter() : value( 0 ) {}\n    void operator++\
  \ (int) { value++; }\n};\n\nbool filter(char c)\n{\n    return isalpha( c ) == 0;\n\
  }\n\nconst std::string path = \"Hamlet.txt\";\nint main()\n{\n    // 创建节点对与权重之间的映射\n\
  \    typedef std::pair<std::string, WordCounter> word_mapping;\n    std::map<std::string,\
  \ WordCounter> counter;\n    std::ifstream input;\n    input.open( path.c_str()\
  \ );\n    if ( !input )\n    {\n        std::cout << \"Error in opening file\";\n\
  \        return 0;\n    }\n    std::string tok;\n    while ( true )\n    {\n   \
  \     input >> tok;\n        // 移除不需要的字符\n        tok.resize( std::remove_if( tok.begin(),\
  \ tok.end(), filter ) - tok.begin() );\n        if ( tok == \"\" || tok == \"\\\
  t\" || tok == \"\\n\" )\n            continue;\n        if ( input )\n        {\n\
  \            counter[ tok ]++;\n        }\n        else break;\n    }\n    std::map<std::string,\
  \ WordCounter,std::less<std::string> >::iterator it;\n    std::vector< word_mapping\
  \ > result( counter.begin(), counter.end() );\n    // 然后排序并显示结果：\n    std::sort(\
  \ result.begin(), result.end(), less_second<word_mapping>() );\n    std::for_each(\
  \ result.begin(), result.end(), []( const word_mapping& wmp )\n    {\n        std::cout\
  \ << std::setw(20) << wmp.first << \"\\t\"\n        << wmp.second.value << std::endl;\n\
  \    });\n    return 0;\n}\n```\n\n\n\n\n\n当你利用标准模板库 (`STL`) 时，你的生活会变得更简单更高效。关于\
