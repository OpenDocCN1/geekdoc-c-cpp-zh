  ```cpp\nDenseGRAPH(int V, bool digraph = false) :\n  adj(V),\n  Vcnt(V),\n  Ecnt(0),\n\
  \  digraph(digraph)\n{\n  for ( int i = 0; i < V; i++ ) adj[i].resize( V );\n}\n\
  int V() const { return Vcnt; }\nint E() const { return Ecnt; }\nbool directed()\
  \ const { return digraph; }\nvoid insert( EdgePtr e )\n{\n  int v = e->v;\n  int\
  \ w = e->w;\n  if (adj[v][w] == 0) Ecnt++;\n  adj[v][w] = e;\n  if (!digraph) adj[w][v]\
  \ = e;\n}\nvoid remove(EdgePtr e)\n{\n  int v = e->v;\n  int w = e->w;\n  if (adj[v][w]\
  \ != 0)\n    Ecnt--;\n  adj[v][w] = 0;\n  if (!digraph) adj[w][v] = 0;\n}\nEdgePtr\
  \ edge(int v, int w) const\n{ return adj[v][w]; }\nclass adjIterator;\nfriend class\
  \ adjIterator;\n};\ntemplate <class Edge>\nclass DenseGRAPH<Edge>::adjIterator\n\
  {\nprivate:\n  const DenseGRAPH &G;\n  int i, v;\npublic:\n  adjIterator(const DenseGRAPH<Edge>\
  \ &G, int v) :\n    G(G),\n    v(v),\n    i(0) {}\n  EdgePtr beg() { i = -1; return\
  \ nxt(); }\n  EdgePtr nxt()\n  {\n    for (i++; i < G.V(); i++)\n      if (G.edge(v,\
  \ i))\n        return G.adj[v][i];\n    return 0;\n  }\n  bool end() const { return\
  \ i >= G.V(); }\n};\n```\n\n可以通过创建 `DenseGRAPH`（重命名为 `Graph`）的实例并添加边集来创建网络拓扑表示：\n\
  \n```cpp\n#include \"Graph.h\"\n#include <iostream>\n\nint main()\n{\n  Graph<Edge>*\
  \ graph = new Graph<Edge>( 5, false );\n  graph->insert( EdgePtr( new Edge( 0, 1\
  \ ) ) );\n  graph->insert( EdgePtr( new Edge( 1, 2 ) ) );\n  graph->insert( EdgePtr(\
  \ new Edge( 2, 3 ) ) );\n  graph->insert( EdgePtr( new Edge( 3, 4 ) ) );\n  graph->insert(\
  \ EdgePtr( new Edge( 0, 4 ) ) );\n  std::cout << \"No. vertices = \" << graph->V()\
  \ << std::endl;\n  std::cout << \"No. edges = \" << graph->E() << std::endl;\n \
  \ EdgePtr edgePtr = graph->edge( 2, 3 );\n  return 0;\n}\n```\n\n## 4.2 实现 Dijkstra\
  \ 算法\n\nDijkstra 算法通过生成最短路径树来解决具有非负边权的图的最短路径问题。该算法通常用于路由，并作为其他图算法（如 k 短路径算法）的子程序。我们通过始终选择提供从源到不在\
  \ SPT 上顶点最短路径的下一条边，一次构建一条最短路径树（SPT）。换句话说，我们按照顶点（通过 SPT）到起始顶点的距离顺序将顶点添加到 SPT 中。\n\
  \n原始的 Dijkstra 算法没有使用最小优先队列，复杂度为 $O(|V|²)$，其中 $V$ 是顶点的数量。这种性能后来通过使用链表表示和最小优先队列得到了改进。连接树内顶点与树外顶点的边使用允许更新优先级的优先级队列实现进行存储。\n\
  \n此实现方案最初在 `SPT` 模板类的构造函数中寻找所有最短路径，并使用一个按照与源节点距离顺序存储的顶点优先队列。这确定了从源节点的所有最短路径。\n\n\
  队列初始化时，源节点的优先级为 0，其他节点的优先级为无穷大。然后实现进入循环，将队列中优先级最低的节点移动到 SPT 并在其相邻边上进行松弛。松弛一条边 `v->w`\
  \ 意味着测试从 `s` 到 `w` 的已知最佳方法是否先从 `s` 到 `v`，然后从 `v` 到 `w`。如果是的话，我们更新我们的数据结构。\n\n```cpp\n\
  #include \"Graph.h\"\ntemplate <class Graph, class Edge>\nclass SPT\n{\nprivate:\n\
  \  const Graph &G;\n  std::vector<double> wt;\n  std::vector<EdgePtr> spt;\npublic:\n\
  \  SPT(const Graph& G, int s) :\n    G(G),\n    spt(G.V()),\n    wt(G.V(), G.V())\n\
  \  {\n    PQi<double> pQ(G.V(), wt);\n    for (int v = 0; v < G.V(); v++)\n    {\n\
  \      pQ.insert(v);\n    }\n    wt[s] = 0.0;\n    pQ.lower(s);\n    while (!pQ.empty())\n\
  \    {\n      int v = pQ.getmin();\n      if ( v != s && spt[v] == 0 ) return;\n\
  \        typename Graph::adjIterator A(G, v);\n      for ( EdgePtr e = A.beg();\
  \ !A.end(); e = A.nxt() )\n      {\n        int w = e->w;\n        double P = wt[v]\
  \ + e->wt;\n        if ( P < wt[w] )\n        {\n          wt[w] = P;\n        \
  \  pQ.lower(w);\n          spt[w] = e;\n        }\n      }\n    }\n  EdgePtr pathR(int\
  \ v) const\n  {\n    return spt[v];\n  }\n  double dist(int v) const\n  {\n    return\
  \ wt[v];\n  }\n};\n```\n\n假设我们希望使用 `Graph` 数据结构表示以下节点和连接：\n\n!images/0109.jpeg\n\
  \n我们可以通过调用 `insert` 构建 `Graph` 结构来表示它：\n\n```cpp\nstd::auto_ptr< Graph<Edge> > graph(\
  \ new Graph<Edge>( 8, true );\ngraph->insert( EdgePtr( new Edge( 1, 6 ) ) );\ngraph->insert(\
  \ EdgePtr( new Edge( 1, 2 ) ) );\ngraph->insert( EdgePtr( new Edge( 1, 4 ) ) );\n\
  graph->insert( EdgePtr( new Edge( 1, 5 ) ) );\ngraph->insert( EdgePtr( new Edge(\
  \ 2, 3 ) ) );\ngraph->insert( EdgePtr( new Edge( 2, 4 ) ) );\ngraph->insert( EdgePtr(\
  \ new Edge( 2, 5 ) ) );\ngraph->insert( EdgePtr( new Edge( 3, 7 ) ) );\ngraph->insert(\
  \ EdgePtr( new Edge( 4, 0 ) ) );\ngraph->insert( EdgePtr( new Edge( 4, 5 ) ) );\n\
  graph->insert( EdgePtr( new Edge( 5, 6 ) ) );\ngraph->insert( EdgePtr( new Edge(\
  \ 5, 7 ) ) );\n```\n\n找到从节点 2 发出的所有路径是创建 `SPT` 模板类的一个简单问题。它在构造函数中计算完整的最短路径树。以下代码片段显示了如何生成并显示节点\
  \ 2 到 7 之间的最短路径，在这种情况下为 `2->1->5->7`：\n\n```cpp\n// 寻找节点 2->7 之间的最短路径\nint source\
  \ = 2;\nint target = 7;\nstd::stack<int> path;\nSPT<Graph<Edge>, Edge> sp( *graph,\
  \ source );\nwhile ( true )\n{\n  EdgePtr e = sp.pathR( target );\n  path.push(\
  \ target );\n  if ( target == source )\n    break;\n  target = e->v;\n}\n// 打印路径\n\
  while ( !path.empty() )\n{\n  std::cout << path.top() << \" \";\n  path.pop();\n\
  }\n```\n\n这得到了节点 2 和 7 之间的最短路径 `[2,1,5,7]`：\n\n!images/0110.jpeg\n\n## 4.3 测试图的连通性\n\
  \n图的一个频繁需求是有效判断它是否连通。选定的顶点对可以相互通信吗？或者图以某种方式是不通的？\n\n使用之前章节讨论的 `Graph` 类，该程序使用深度优先搜索算法来测试在递归搜索期间是否访问了所有的节点。以下是一些示例：\n\
  \n1. 不通的无向图，其中节点 `[3,4]` 与节点 `[0,1,2]` 断开，导致节点 `0` 无法与节点 `3` 通信：\n\n!images/0111.jpeg\n\
  \n2. 不通的有向图。节点 `1` 可以与节点 `[0,2,3]` 通信，但不能与节点 `4` 通信，因为从节点 4 到节点 0 存在有向连接，但从节点 0\
  \ 到节点 4 没有：\n\n!images/0112.jpeg\n\n3. 连接的无向图。所有节点都可以相互通信：\n\n!images/0113.jpeg\n\
  \n4. 连的有向图。所有节点都可以与其他任何节点通信。尽管节点 `[0,3]` 之间没有连接，但这两个节点之间通过节点 `[0,1,2,3]` 存在路径。\n\
  \n!images/0114.jpeg\n\n现在让我们为 `Graph` 类添加以下用于测试图是否为强连通图的实用函数：\n\n```cpp\n// 从 v\
  \ 开始打印 DFS 的递归函数\nvoid Graph::DFSUtil(int v, bool visited[])\n{\n  // 标记当前节点已访问并打印\n\
  \  visited[v] = true;\n  typename Graph::adjIterator A(*this, v);\n  for ( EdgePtr\
  \ e = A.beg(); !A.end(); e = A.nxt() ) {\n    int w = e->w == v ? e->v : e->w;\n\
  \    if ( !visited[ w ] ) DFSUtil( w, visited );\n  }\n}\n// 返回此图反转（或转置）的函数\nGraph*\
  \ Graph::getTranspose()\n{\n  Graph<Edge>* g = new Graph<Edge>(Vcnt, digraph);\n\
  \  for (int v = 0; v < Vcnt; v++)\n  {\n    typename Graph::adjIterator A(*this,\
  \ v);\n    for ( EdgePtr e = A.beg(); !A.end(); e = A.nxt() ) {\n      int w = e->w;\n\
  \      g->insert( EdgePtr( new Edge( w, v ) ) );\n    }\n  }\n  return g;\n}\n//\
  \ 如果图是强连通的则返回 true 主函数\n```\n\n\n\n\n\n```cpp\nbool Graph::isSC()\n{\n  // 步骤 1:\
  \ 将所有顶点标记为未访问（第一次 DFS）\n  for (int i = 0; i < Vcnt; i++) visited[i] = false;\n\n\
  \  // 步骤 2: 从第一个顶点开始 DFS 遍历\n  DFSUtil(0, visited);\n\n  // 如果 DFS 遍历没有访问所有顶点，则返回\
  \ false。\n  for (int i = 0; i < Vcnt; i++)\n    if (visited[i] == false) return\
  \ false;\n\n  // 步骤 3: 创建一个反转图\n  Graph* gr = getTranspose();\n\n  // 步骤 4: 将所有顶点标记为未访问（第二次\
  \ DFS）\n  for(int i = 0; i < Vcnt; i++) visited[i] = false;\n\n  // 步骤 5: 从第一个顶点开始对反转图进行\
  \ DFS\n  // 起始顶点必须与第一次 DFS 的起点相同\n  gr->DFSUtil(0, visited);\n\n  // 如果第二次 DFS 中未访问所有顶点，则返回\
  \ false\n  for (int i = 0; i < Vcnt; i++)\n    if (visited[i] == false) return false;\n\
  \n  return true;\n}\n```\n\n以下代码列表显示了如何实现上述列出的四个示例：\n\n```cpp\n#include \"Graph.h\"\
  \n#include <iostream>\n\nint main()\n{\n  // 示例 1：不连通的无向图：\n  //\n  // 0 3\n  //\
