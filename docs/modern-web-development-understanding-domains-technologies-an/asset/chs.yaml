  \n### 查看所有其他可能的错误\n\n无论你拥有哪些捕获点，错误总能找到用户。当未处理的异常到达 ASP.NET 代码的最外层外壳时，`global.asax`\
  \ 中的 `Application_Error` 方法就会被调用。它是开发者代码在出现“死亡黄屏”之前的最后一次调用。你可以在此事件处理程序程序中做一些实用的操作，例如发送电子邮件或写入事件日志：\n\
  \n点击此处查看代码图片\n\n```\nvoid Application_Error(Object sender, EventArgs e)\n{\n   \
  \ var exception = Server.GetLastError();\n    if (exception == null) return;\n \
  \   var mail = new MailMessage { From = new MailAddress(\"noreply@yourserver.com\"\
  ) };\n    mail.To.Add(new MailAddress(\"administrator@yourserver.com\"));\n    mail.Subject\
  \ = \"Site Error at \" + DateTime.Now;\n    mail.Body = \"Error Description: \"\
  \ + exception.Message;\n    var server = new SmtpClient { Host = \"your.smtp.server\"\
  \ };\n    server.Send(mail);\n    // 清除错误\n    Server.ClearError();\n    // 重定向到落地页\n\
  \    Response.Redirect(\"home/landing\");\n}\n```\n\n虽然你总是可以自己编写错误处理程序，但 ASP.NET\
  \ 开发者经常使用错误日志模块和处理器（ELMAH）。归结底，ELMAH 是一个 HTTP 模块，一旦配置，它就会在应用程序级别拦截 `Error` 事件，并根据\
  \ ASP.NET 开发者的配置进行记录。（注：原文此处有重复内容，我将保持核心流程）。\n\nASP.NET 开发者经常使用错误日志模块和处理器（ELMAH）。它是一个开源项目，位于\
  \ [`code.google.com/elmah`](http://code.google.com/elmam\n\n### 收集所有异常\n\n常见的场景是在\
  \ ASP.NET 中收集所有异常。这里有一种简单的处理方法：\n\n点击此处查看代码图片\n\n```\ntry {\n    // 步骤 1\n}\ncatch(Exception)\
  \ {\n    // 步骤 2\n}\n```\n\n### 配置身份验证\n\n在 ASP.NET 中，你通过 `web.config` 中的 `<authentication>`\
  \ 部分来选择身份验证机制。以下代码显示：\n\n点击此处查看代码图片\n\n```xml\n<authentication mode=\"Forms\">\n\
  \    <forms loginUrl=\"~/LogOn\" timeout=\"2880\" />\n</authentication>\n```\n\n\
  你可以将 `Authorize` 属性应用到单个方法或类类上。`AllowAnonymous` 属性允许方法保持公开访问。\n\n```csharp\n[Authorize]\n\
  public ActionResult Index()\n{\n}\n```\n\n### 比较验证用户的方法\n\n为了验证用户，你需要某种成员系统来提供管理账户的方法。构建成员系统意味着编写用于创建、更新或删除用户的软件和界面。最新且推荐的框架是\
  \ Microsoft ASP.NET Identity。\n\n你创建用户表并添加一个临时的存储库类以集中读写访问。\n\n点击此处查看代码图片\n\n```csharp\n\
  public ActionResult Login(LoginViewModel input, String returnUrl)\n{\n    // 获取提交的凭据并进行实际验证\n\
  \    ...\n}\n\npublic ActionResult Logout(String defaultAction=\"Index\", String\
  \ defaultController=\"Home\")\n{\n    // 注销登录并重定向到主页\n    FormsAuthentication.SignOut();\n\
  \    return RedirectToAction(defaultAction, defaultController);\n}\n```\n\n\n\n\n\
  \n`Login` 方法将直接使用存储库并执行一个简单的查询，以检查表中是否存在与用户名和密码匹配的记录。该方法会获取一个布尔（Boolean）结果，并在响应为否定时，决定向用户显示什么最合适的提示信息。如果用户存在，它将直接使用\
  \ ASP.NET（或 OWIN）API 创建身份验证 Cookie（cookie）：\n\n点击此处查看代码图片\n\n```c\nFormsAuthentication.SetAuthCookie(userName,\
  \ rememberMe);\n```\n\n出于隐私考虑，开发者需要考虑对数据库中的密码进行哈希处理，并使用该服务来检查密码。这里有一个示例：\n\n点击此处查看代码图片\n\
  \n```c\n// Check 用户是否存在以及凭据是否匹配\n\nvar found = _passwordHashingService.Validate(password,\
  \ storedPassword);\n\nif (!found)\n{\n    response.Message = Strings.AppLogin_InvalidCredentials;\n\
  \    return response;\n}\n```\n\n以下代码展示了一个密码哈希服务的示例：\n\n点击此处查看代码图片\n\n```csharp\n\
  public class DefaultPasswordHasher : IHashingService\n{\n    public bool Validate(string\
  \ clearPassword, string hashedPassword)\n    {\n        return String.Equals(HashInternal(clearPassword),\n\
  \                          hashedPassword,\n                          StringComparison.InvariantCulture);\n\
  \    }\n    public string Hash(string clearPassword)\n    {\n        return HashInternal(clearPassword);\n\
  \    }\n    private string HashInternal(string password)\n    {\n        const string\
  \ defaultSalt = \"112358\";\n        var md5 = new MD5CryptoServiceProvider();\n\
  \        var digest = md5.ComputeHash(\n                          Encoding.UTF8.GetBytes(string.Concat(password,\
  \ defaultSalt)));\n        var base64Digest = Convert.ToBase64String(digest, 0,\
  \ digest.Length);\n        return base64Digest.Substring(0, base64Digest.Length\
  \ - 2);\n    }\n}\n```\n\n这种由纯代码组成、没有任何外部框架的基础架构对于简单情况已经足够了。当你需要支持更多高级功能——例如角色、更改或重置密码、密码锁定以及双因子身份验证时——你可能越发青睐带有内置功能的框架。在这方面，ASP.NET\
  \ Identity 是事实上的标准，尽管你仍然可以使用老而可靠的 ASP.NET Web Forms 成员系统（membership system）。\n\n\
  ### 使用社交身份认证\n\n大多数社交网络使用 OAuth 协议来代表客户端应用程序执行身份验证。由于该协议的通用性和标准性，一些公司开始提供框架和服务，用于针对各种社交网络进行\
  \ OAuth 身份验证。这对开发者来说是有益的，因为你可以以声明式的方式指定想要启用哪些社交网络进行身份验证，并使用统一的 API 只编写一次身份验证代码，而无需处理\
  \ Twitter、Facebook、Instagram、LinkedIn 等平台异构的 API。\n\n尽管，在某些情况下，你只想针对单个社交网络进行身份验证。在我看来，在这种情况下，遵循特定\
  \ OAuth API 的规则是优的。以下是在 ASP.NET MVC 应用程序内部执行 Facebook 身份验证所需的代码：\n\n点击此处查看代码图片\n\
  \n```csharp\npublic class LoginController : Controller\n{\n    public ActionResult\
  \ Facebook()\n    {\n        var returnUri = new UriBuilder(Request.Url)\n     \
  \   {\n            Path = Url.Action(\"FacebookAuthenticated\", \"Login\")\n   \
  \     };\n        var client = new FacebookClient();\n        var fbLoginUri = client.GetLoginUrl(new\n\
  \        {\n            client_id = ConfigurationManager.AppSettings[\"fb_id\"]\n\
  \        });\n        return Redirect(fbLoginUri.ToString());\n    }\n\n    public\
  \ ActionResult FacebookAuthenticated(String returnUrl)\n    {\n        // Exchange\
  \ the code for access token\n        dynamic result = client.Get(\"/oauth/access_token\"\
  , new\n        {\n            client_id = ConfigurationManager.AppSettings[\"fb_id\"\
  ],\n            client_secret = ConfigurationManager.AppSettings[\"fb_secret\"],\n\
  \            redirect_uri = new UriBuilder(Request.Url).ToString,\n            code\
  \ = Request[\"code\"]\n        });\n        var token = result.access_token;\n \
  \       // Query Facebook for the user\n        dynamic user = client.Get(\"/me\"\
  , new\n        {\n            fields = \"first_name,last_name,email\",\n       \
  \     access_token = token\n        });\n        var userName = String.Format(\"\
  {0} {1}\", user.first_name, user.last_name);\n        var cookie = FormsAuthentication.GetAuthCookie(userName,\
  \ true);\n        Response.AppendCookie(cookie);\n        return Redirect(returnUrl\
  \ ?? \"/\");\n    }\n\n    public ActionResult Signout(String defaultAction = \"\
  Index\", String defaultController = \"Home\")\n    {\n        FormsAuthentication.SignOut();\n\
  \        // Delete access token cookie\n        DeleteCookieWithAccessToken(Request);\n\
  \        return RedirectToAction(defaultAction, defaultController);\n    }\n}\n\
  ```\n\n\n\n在本章中，我将首先回顾 Razor 视图的结构——用于在 ASP.NET MVC 中排列 HTML 视图的模板语言，然后讨论如何显示数据列表并对其进行分页和滚动。\n\
  \n## 构建 HTML 视图的结构\n\n正如你在第 8 章中所看到的，“ASP.NET MVC 核心”由 ASP.NET MVC 提供的视图可以通过 Razor\
  \ 模板文件来描述。Razor 模板可以以多种方式接收要显示的数据，其中最完整、最通用的方式是通过一个视图模型（view model）对象。Razor 模板通常基于主布局（master\
  \ layout），主布局可以分为若干节，这些节可以在派生视图中被重写。最后，如果将视图作为部分视图（partial view）提供，它就可以是可复用的。从纯技术角度来看，部分视图与视图没有任何区别，区别在于部分视图不基于布局。部分视图不仅可以在多个视图和布局中复用，而且由于部分视图的存在，视图和布局是可组合的，并且可以随时编辑。\n\
  \n让我们查看 ASP.NET MVC 中 HTML 视图的其他方面。\n\n### 探索视图模型\n\n`view model` 术语指的是承载了给定的 Razor\
  \ 模板将处理并显示的所有数据的类。视图模型类是一个纯粹的数据传输对象（DTO），主要由属性组成，几乎没有附带的行为。然而，是否从视图模型类中暴露方法，这取决于设计决策，在某种程度上也取决于个人偏好。\n\
  \n视图模型类及其相关类型的属性定义应主要为了适应视图的需求。这意味着任何属性都可能是字符串，且相关内容可以预先格式化为字符串。然而，这并不是强制。同时，应该明确视图模型类是一个扮演特定角色的类——即为视图承载数据。视图模型类与领域模型类（domain-model\
  \ class）或持久化模型类（persistence-model class）是不同的，尽管在某些情况下，同一个类可以用于几乎一切。区分各种模型有助于你理解事物，并更好地处理复杂的现实场景。\n\
  \n 定义一个通用基类\n\n我建议你为所有构成应用程序视图模型的类定义一个公共基类。这是一个很好的起点：\n\n点击此处查看代码图像\n\n```cs\npublic\
  \ class ViewModelBase\n{\n    public ViewModelBase()\n    {\n        Title = \"\
  Modern Web Applications\";\n    }\n    public string Title { get; set; }\n}\n```\n\
  \n至少，这样的基类将拥有一个用于视图标题的读写属性。在更符合真实的场景中，页面标题是通过组合而来反映当前路径的。这里有一个稍微复杂且更真实的版本：\n\n点击此处查看代码图像\n\
  \n```cs\npublic class ViewModelBase\n{\n    public ViewModelBase()\n    {\n    \
  \    Title = YourApplication.DefaultAppTitle;\n        Menu = new Menu();\n    }\n\
  \    public string Title { get; private set; }\n    public Menu MainMenu { get;\
  \ set; }\n    public ViewModelBase SetTitle(string extra)\n    {\n        Title\
  \ = extra.IsNullOrWhitespace()\n            ? YourApplication.DefaultAppTitle\n\
  \            : String.Format(\"{0} [{1}]\", YourApplication.DefaultAppTitle, extra);\n\
  \        return this;\n    }\n}\n```\n\n标题是通过一个方法设置的，该方法包含了将应用程序标题与特定于当前路径和状态的后缀组合逻辑。也可以添加其他属性，例如\
  \ `Menu`，它包含了要在视图中渲染的菜单项。通常情况下，视图模型的基类定义了影响应用程序提供的所有视图的属性，包括公共元素，如菜单、页脚、页眉等。\n\n\
  ### 创建视图模型类的实例\n\n每当控制器方法请求渲染视图时，它就指示了要渲染的 Razor 模板并传递了一个视图模型实例。因此，视图模型类的实例是在控制器方法的监督下创建的。由于建议保持控制器类尽可能精简，填充视图模型类是一个可以委托给工作服务类（worker-service\
  \ class）的任务，如下例所示：\n\n点击此处查看代码图像\n\n```cs\npublic class HomeController : Controller\n\
  {\n    private readonly HomeService _service = new HomeService();\n    public ActionResult\
  \ Index()\n    {\n        var model = _service.GetViewModel();\n        return View(model);\n\
  \    }\n}\n```\n\n我在第 10 章“组织 ASP.NET MVC”中讨论过工作服务类带来的好处。通常情况下，你希望每个视图都有一个视图模型，但那些类可以在多个视图之间共享的情况除外。工作服务类与控制器是配合使用的。\n\
  \n这是一个返回视图模型对象的工作服务的示例实现：\n\n点击此处查看代码图像\n\n```cs\npublic class CountryService\n\
  {\n    public CountryListViewModel GetListViewModel()\n    {\n        var repository\
  \ = new CountryRepository();\n        var model = new CountryListViewModel\n   \
  \     {\n            Countries = repository.All().ToList()\n        };\n       \
  \ return model;\n    }\n}\n```\n\n工作服务的方法通常接受控制器级别的数据类型。如果任务实现需要特定数据（例如存储在缓存或会话状态中的数据），这些数据由控制器显式传递。工作服务类必须与\
  \ HTTP 上下无关。通过这样做，你可以确保它是可测试的。\n\n点击此处查看代码图像\n\n```cs\npublic ActionResult List()\n\
  {\n    var currentPageIndex = (int)Session[\"CurrentPageIndex\"];\n    var model\
  \ = _service.GetListOfCountriesByPage(currentPageIndex);\n    return View(model);\n\
  }\n```\n\n最终，保持控制器精简高效涉及到创建一个应用层，将表示层（控制器所在地）与系统的后端（业务逻辑所在地）分离。\n\n### 检查页面布局\n\n\
  ASP.NET 应用程序的每个页面都基于固定的布局。在 ASP.NET Web Forms 中，你以前将布局称为*主页*master page）。在 ASP.NET\
  \ MVC 中，我们直接拥有*布局页面*layout pages）。\n\n#### 设置布局页面\n\n你从控制器调用的用于渲染 HTML 视图的 `View`\
  \ 方法有几个重载。你可以使用这些重载之一来指示渲染视图时使用的布局页面名称：\n\n点击此处查看代码图像\n\n```cs\n[ActionName(\"List\"\
  )]\npublic ActionResult IndexViaGet()\n{\n    var model = _service.GetCountryListViewModel();\n\
  \    return View(\"index\", model, \"layout\");\n}\n```\n\n\n\n\n`View` 方法的第一个参数是指你想作为模板使用的\
  \ Razor 文件的名称。它必须是位于 Views 项目文件夹下的 `.cshtml` 文件。如果省略，视图名称将默认为控制器操作（controller action）的名称。在刚刚显示的示例代码中，操作名称是\
  \ `List`。如果未指定 `ActionName` 特性，操作名称将默认为方法名。如果 `View` 方法显式地获取了视图名称，则该设置将覆盖任何默认值。\n\
  \n布局页面（layout page）可以按照与普通视图相同的约定通过名称指定。布局页面也必须是位于 Views 项目文件夹下的 `.cshtml` 文件。布局通常被多个视图共享。因此，它们的典型位置是\
  \ Views 下的 Shared 文件夹。你也可以使用以下约定直接在视图中设置布局：\n\n点击此处查看代码图片\n\n```html\n@{ Layout\
  \ = \"~/Views/Shared/YourLayout.cshtml\"; }\n```\n\n最后，你可以指定一个默认布局文件，它适用于所有未显式设置布局的视图。你可以通过在\
  \ Views 文件夹中添加包含以下内容的 `_viewstart.cshtml` 文件来实现：\n\n点击此处查看代码图片\n\n```html\n@{ Layout\
  \ = \"~/Views/Shared/YourDefaultLayout.cshtml\"; }\n```\n\n注意，在 Microsoft Visual\
  \ Studio 生成的代码中，默认布局文件名为 `Layout.cshtml`。名称开前的下划线是布局和部分视图（partial views）的约定。\n\n\
  ### 定义页面的 Head 部分\n\n布局页面负责视图的所有公共元素。布局引用了样式表和脚本文件，并添加了常见的 meta 标签。所有这些内容都放在 HTML\
  \ 页面的 HEAD 部分。这是一个真实的示例：\n\n点击此处查看代码图片\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n\
  \    <meta charset=\"utf-8\" />\n    <meta name=\"viewport\" content=\"width=device-width,\
  \ initial-scale=1.0\">\n    <meta http-equiv=\"X-UA-Compatible\" content=\"IE=edge\"\
  >\n    <meta name=\"description\" content=\"What your web site is for ...\">\n \
  \   <meta name=\"author\" content=\"Just you ...\">\n    <link rel=\"stylesheet\"\
  \ href=\"@Url.Content(\"~/content/styles/bootstrap.min.css\")\">\n    <link rel=\"\
  stylesheet\" href=\"@Url.Content(\"~/content/styles/font-awesome.min.css\")\">\n\
  \    <link rel=\"stylesheet\" href=\"@Url.Content(\"~/content/styles/yoursite.css\"\
  )\">\n    <link rel=\"stylesheet\" href=\"http://fonts.googleapis.com/css?family=Montserrat:400,700\"\
  >\n    ...\n</head>\n...\n</html>\n```\n\n考虑到移动浏览器的普及，现在为从网站提供的任何页面添加 `viewport`\
  \ meta 标签是强制的。此外，页面的 HEAD 部分将列出你在绑定到该布局的所有视图中想要引用的所有 CSS 文件。今天，这主要意味着引用 Bootstrap\
  \ 库和一个用于为样式按钮、菜单和链接添加精美图标的符号库。Bootstrap 自带一套符号图标，但大多数网站更倾向于添加其他图标集。一个流行的选择是来自 `[http://fortawesome.github.io/Font-Awesome]`\
  \ 的 FontAwesome。布局页的 HEAD 部分也是下载额外字体的理想位置。\n\n* *\n\n![图像](img/00004.jpeg) 注意\n\n\
  当在 URL 中时，波浪号 (`~`）指的是根路径。在 Razor 的很长一段时间内，你必须使用 `@Url.Content` 函数将波浪号扩展为网站的根路径。如果你使用比版本\
  \ 4 更新的 ASP.NET MVC 版本，就不再需要这样做。现在你只需要在各种 HTML 元素中将 URL 写为“~/...”，Razor 引擎就会为你进行转换。还要注意，只有当你将网站部署在目录中时，正确的波浪号转换才有意义，更重要的是，它不适用于\
  \ JavaScript 代码。\n\n* *\n\n### 定义网站图标\n\n一个没有图标的现代网站看起来比带有一点图形点缀的网站要少吸引力得多。拥有图标不会让网站的功能更强大，但由于添加图标的成本有限，我觉得没有理由不放一个。定义\
  \ favicon 标的标准方法如下：\n\n点击此处查看代码图片\n\n```html\n<link rel=\"icon\" href=\"~/yoursite.ico\"\
  \ type=\"image/x-icon\">\n```\n\n关于波浪号的使用，请注意只有当标记由 Razor 引擎处理时，才会发生自动转换。如果你将上所示的行添加到纯\
  \ HTML 页面并在浏览器中查看，波浪号将被忽略或以特定特定的方式被解释。\n\n如果页面中未指定图标，为了向后兼容性，几乎所有浏览器也会在根目录下查找 `favicon.ico`。该格式最初随\
  \ Internet Explorer 引入。以下内容是废弃的：\n\n点击此处查看代码图片\n\n```html\n<link rel=\"shortcut\
  \ icon\" href=\"~/yoursite.ico\" type=\"image/x-icon\">\n```\n\n然而，今天只要 `type` 属性设置为\
  \ `image/x-icon`，`rel` 属性就会被忽略。在网站图标方面，你可能还想为移动浏览器添加图标。方法如下：\n\n点击此处查看代码图片\n\n```html\n\
  <link rel=\"icon\" sizes=\"192x192\" href=\"~/yoursite-192x192.png\" type=\"image/png\"\
  >\n<link rel=\"apple-touch-icon\" sizes=\"180x180\" href=\"~/yoursite-apple-touch-icon-180x180.png\"\
  >\n```\n\n这是为了覆盖 Android 和 iOS 需要添加的最小配置。要获取完整的移动浏览器图标包，你可以去 `http://www.favicon-generator.org]`\
  \ 获取它生成的文件，并包含它建议的标记。这保证了对大多数移动场景的覆盖。\n\n### 将脚本放在正确的位置\n\n在网页中放置越来越多的脚本意味着有越来越多的脚本文件需要下载。浏览器总是同步下载脚本且并行性有限。下载所有引用的脚本文件可能是一个耗时的操作；更糟糕的是，任何\
  \ SCRIPT 标签之后的任何内容在脚本下载、解析和执行之前都是无法处理的。浏览器实现同步下载主要是为了确保安全。事实上，脚本文件始终可能包含某些指令，例如\
  \ JavaScript 立即函数或 `document.write`，可能会修改当前 DOM 的状态。\n\n加快页面加载的一个常用技巧是将所有脚本引用放在页面末尾，紧接在\
  \ `</body>` 标签之前。然而，请注意，你这样做改进的只是用户对页面加载更快的感知。它真正的意义是页面的可见元素更早显示，而不影响渲染的长时间下载被推到了最后。\n\
  \n在我看来，这种通用做法需要重新检查。重要的是清楚地布局 DOM 的哪些部分受哪些 JavaScript 文件的影响，并调整视图结构以匹配这种布局。即使你将多个脚本放在底部，下载也是同步的。因此，页面加载和显示很快，但在所有脚本有效下载之前，它可能会有几秒钟没有响应。对于复杂的页面，我将回到旧做法，将所有脚本放在\
  \ HEAD 部分，并只在底部放置执行 DOM 初始化的脚本。\n\n\n\n\n\n为了加速页面加载，你也可以利用 `SCRIPT` 属性，如 `async`\
  \ 和 `defer`，这些属性指示浏览器异步下载脚本，且其隐含假设是 DOM 元素与脚本之间不存在依赖关系。当存在此类依赖关系，且脚本文件之间也存在依赖关系时，你可以考虑使用像\
  \ RequireJS 这样的框架。（ [`requirejs.org`](http://requirejs.org)*。）\n\n## 创建布局的主体\n\n\
  布局（layout）设置了一系列视图的骨架。骨架通常包含通用元素，如菜单、导航栏、标签页、头部（header）、页脚（footer）、侧边栏以及视图除特定内容外需要向用户展示的任何内容。\n\
  \n在 ASP.NET MVC 中，每个视图每次渲染都是从头开始的，它需要的所有数据都必须为每一个请求以某种方式检索。而在 Web Forms 中，viewstate\
  \ 负责从当前显示的页面携带大部分的渲染数据。视图模型类（view-model class）是存储供页面共享的布局通用元素的理想位置。\n\n在本章较早之前，我引入了\
  \ `ViewModelBase` 类作为所有视图模型类的父类。当整个应用程序使用单个布局时，单个根类效果良好。当使用多个布局时，你最好添加第二层基础视图模型类——每个布局一个：\n\
  \n点击此处查看代码图片\n\n```php\npublic class Layout1ModelBase : ViewModelBase { ... }\n\n\
  public class Layout2ModelBase : ViewModelBase { ... }\n```\n\n至少，布局页面必须包含一个可替换的区域（section），供视图可以渲染自定义内容。该区域通过\
  \ `RenderBody` 方法调用来标识：\n\n```html\n<body>\n    <header> ... </header>\n    <div>\n\
  \        @RenderBody()\n    </div>\n    <footer> ... </footer>\n</body>\n```\n\n\
  如果在布局页面中没有找到 `RenderBody` 方法调用，则会抛出异常。\n\n### 呈现视图元素\n\n`RenderBody` 方法定义了布局中单一的注入点。虽然这是一个常见场景，但你可能需要在多于一个位置注入内容。这正是区域（sections）派上用场的地方。此外，每个区域都可以由部分视图（partial\
  \ views）组成，部分视图可以引用小型的 HTML 代码工厂，被称为 `HTML helpers`，或者在最新的 ASP.NET MVC 6 中被称为 `tag\
  \ helpers`。\n\n#### 区域\n\n在布局模板中，你通过在希望这些区域出现的位置放置 `RenderSection` 调用来定义自定义的注入点：\n\
  \n点击此处查看代码图片\n\n```html\n<body>\n    <div class=\"page\">\n        @RenderBody()\n\
  \    </div>\n    <div id=\"footer\">\n        @RenderSection(\"footer\")\n    </div>\n\
  </body>\n```\n\n每个区域都通过名称标识，除非你将其标记为可选，否则所有区域都被视为强制性的：\n\n点击此处查看代码图片\n\n```html\n\
  <div id=\"footer\">\n    @RenderSection(\"footer\", false)\n</div>\n```\n\n`RenderSection`\
  \ 方法接受一个可选的布尔参数，表示该区域是否为所需的。以下代码在功能上与前面的代码等效，但从可读性角度来看要好得多：\n\n点击此处查看代码图片\n\n```html\n\
  <div id=\"footer\">\n    @RenderSection(\"footer\", required:false)\n</div>\n```\n\
  \n每个区域都可以赋予默认内容，当该区域在派生视图中未被覆盖时将使用这些内容：\n\n点击此处查看代码图片\n\n```cshtml\n@section footer\
  \ {\n    <p>Written by Dino Esposito</p>\n}\n```\n\n你可以在 Razor 视图模板的任何地方定义区域的内容。特别地，可以在\
  \ HEAD 元素内定义自定义区域，让派生视图添加临时的 CSS 文件和顶部的脚本文件。另一个放置区域的好地方是紧在 body 元素结束标签之前，用于延迟加载的脚本文件：\n\
  \n点击此处查看代码图片\n\n```html\n<head>\n    ...\n    @RenderSection(\"adhoc_css\", required:false)\n\
  \    @RenderSection(\"adhoc_script_top\", required:false)\n</head>\n\n<body>\n \
  \   ...\n    @RenderSection(\"adhoc_script_bottom\", required:false)\n</body>\n\
  ```\n\n使用区域来拆分 CSS 和脚本依赖从性能角度来看并不十分有益，因为所有 CSS 和脚本文件很快就会被浏览器本地缓存，不会真的反复花费下载时间。使用区域确实有助于使结构更清晰。\n\
  \n### 部分视图\n\n部分视图（partial view）是不绑定到布局的 Razor 视图。由于其性质，它是一个由代码和标记组成的重用组件。你可以通过\
  \ Visual Studio 向项目添加添加一个。（参见 11-1）。如果你熟悉 Web Forms，它等同于用户控件（user control）。\n\n\
  ![图像](img/000.jpeg)\n\n**图 11-1** 向项目添加部分视图\n\n以下代码显示了简单但有效的：\n\n```html\n<hr />\n\
  <footer>\n    <p>© @DateTime.Now.Year - Modern Applications</p>\n</footer>\n```\n\
  \n如果你创建一个仅包含上述标记的文件并将其命名为 `Footer.cshtml`，你可以像下面一样调用它：\n\n点击此处查看代码图片\n\n```html\n\
  <div class=\"container body-content\">\n    @RenderBody()\n    @Html.Partial(\"\
  _Footer\")\n</div>\n```\n\n你使用 `Partial` 或 `RenderPartial` 辅助方法在视图中插入部分视图。两种方法都接受部分视图的名称作为参数。它们之间的唯一区别是\
  \ `Partial` 返回编码后的字符串，而 `RenderPartial` 写入流并返回 `void`。因此，它们的用法略有不同：\n\n点击此处查看代码图片\n\
  \n```cshtml\n@Html.Partial(\"_Footer\")\n\n@{ Html.RenderPartial(\"_Footer\"); }\n\
  ```\n\n`RenderPartial` 可能更快，但它不支持对输出进行进一步处理。\n\n#### 向部分视图传递数据\n\n默认情况下，部分视图接收引擎传递给父视图的相同模型和数据字典。这种行为可能也可能不理想。这完全取决于部分视图的意图用途。如果你将部分视图用作子程序，主要目的是保持代码的整洁和可维护性，那么你不需要限制或自定义传递给它的数据。例如，我们刚才考虑的页脚部分视图就是这种情况。但让我们考虑一个不同的场景：\n\
  \n```html\n<table class=\"table table-condensed\">\n    @foreach (var country in\
  \ Model.Countries)\n    {\n        @Html.Partial(\"_CountryItem\", country)\n  \
  \  }\n</table>\n```\n\n\n\n\n\n这里是部分视图：\n\n点击此处查看代码图像\n\n@model Mwa.Persistence.Model.Country`\n\
  \n```html\n<tr>\n    <td>@Model.CountryName</td>\n    <td>@Model.Capital</td>\n\
  \    <td>Model.Continent</td>\n</tr>\n```\n\n注意，在这种情况下你必须使用 `Partial` 来渲染视图。`RenderPartial`\
  \ 在此处不起作用，因为你需要通过迭代来构建要发送到输出流的实际标记。\n\n### 使用渲染器操作 (render actions)\n\n复杂的视图不可避免地是由各种子视图组合而成的。当控制器方法触发视图的渲染时，它必须为视图的主结构及所有部分提供所需的数据。有时，这要求控制器了解关于应用程序中该类本身未直接参与的部分的许多细节。想看个例子吗？\n\
  \n假设你有一个要在许多视图中渲染的菜单。无论你对应用程序执行了什么操作，菜单都必须渲染。因此，渲染菜单是一个与当前正在进行的请求没有直接相关的操作。你如何处理这种情况？你可以将所有数据传递给视图并使用部分视图来渲染菜单和侧边栏，或者你可以使用渲染器操作。\n\
  \n`render action` (渲染器操作) 是一种专门设计用于从视图内部调用的控制器方法。因此，渲染器操作是控制器类上的一个普通方法，你通过以下 HTML\
  \ 辅助程序之一：`Action` 或 `RenderAction` 在视图中调用它。这里有一个例子：\n\n```csharp\n@Html.Action(\"\
  action\")\n```\n\n`Action` 和 `RenderAction` 的行为大部分相同——唯一的区别是 `Action` 将标记作为字符串返回，而\
  \ `RenderAction` 则直接写入输出流。接下来显示的示例方法触发了一个特定的渲染器操作，该操作为视图中的菜单渲染提供数据：\n\n点击此处查看代码图像\n\
  \n```csharp\npublic ActionResult Menu()\n{\n    var options = new MenuOptionsViewModel();\n\
  \    options.Items.Add(new MenuOption {Url=\"...\", Image=\"...\"});\n    options.Items.Add(new\
  \ MenuOption {Url=\"...\", Image=\"...\"});\n    return PartialView(options);\n\
  }\n```\n\n菜单部分视图的内容在这里并不相关；它所做的只是获取模型对象并渲染一段适当的标记。\n\n看看你应用程序中可能有的某个页面的视图源代码：\n\n\
  点击此处查看代码图像\n\n```html\n<<div>\n    ...\n    @Html.RenderAction(\"Menu\")\n    ...\n\
  </div>\n```\n\n`RenderAction` 辅助方法调用指定控制器上的 `Menu` 方法（或在指示渲染当前视图的控制器上的 `Menu` 方法），并将任何响应重定向到输出流。通过这种方式，你的代码更具粒度。视图只接收其特定用途所需的数据，并为它需要包含的任何周围标记回调控制器。控制器仅将创建菜单和侧边栏的逻辑部分作为独立的方法暴露出来。\n\
  \n***\n\n![Image](img/00076.jpeg) **警告**\n\n使用渲染器操作可能是一个危险的工具。假设你有几个小部件要渲染——例如一个菜单、页眉、页脚、几个侧边栏和广告框。如果你使用部分视图，你通常会安排单个事务来获取所有所需数据并一次性传递。如果你为每个小部件都使用渲染器操作，你也将数据获取拆分成了多个步骤。如果处理不当，这种情况可能会导致多次事务和过载。\n\
  \n***\n\n### 显示数据项列表\n\n现在让我们看看在 ASP.NET MVC 中完成一些围绕 Web 应用程序表示层的常见任务需要什么。第一个例子是渲染经典的数据网格。\n\
  \n#### 创建网格视图\n\n作为一个框架，ASP.NET MVC 特意让你对渲染的 HTML 获得完全控制权。这不可避免地破坏了拥有丰富且智能控件（如 `GridView`\
  \ 或 `ListView`）的想法，这些控件提供了高级模板选项以及内置的分页和排序功能。获取结果需要更多工作，但同时，在模板方面可以获得更大的自由。\n\n\
  #### 将数据渲染为普通网格\n\n从本质本质，数据网格是一个数据表格。因此，在 ASP.NET MVC 中，你只需要将其创建一个普通的 HTML 表格，或许带有一些可选的\
  \ Bootstrap 样式让它看起来更好看。（参见图 11-2））\n\n点击此处查看代码图像\n\n```html\n@model GridView.Models.View.CountryListViewModel\n\
  \n<h2>世界国家\n    <span class=\"badge\">找到 @Model.Countries.Count 个</span>\n</h2>\n\
  \n<table class=\"table table-condensed\">\n    <thead>\n        <th>名称</th>\n  \
  \      <th>首都</th>\n        <th>大洲</th>\n    </thead>\n    @foreach (var country\
  \ in Model.Countries)\n    {\n        <tr>\n            <td>@country.Name</td>\n\
  \            <td>@country.Capital</td>\n            <td>@country.Continent</td>\n\
  \        </tr>\n    }\n</table>\n```\n\n![Image](img/0077.jpeg) **图 11-2** 普通且简单的网格\n\
  \n整个网格，或者只是某行，可以移动到部分视图以使解决方案更具维护性：\n\n点击此处查看代码图像\n\n```html\n@model GridView.Models.View.CountryListViewModel\n\
  \n<h2>世界国家\n    <span class=\"badge\">找到 @Model.Countries.Count 个</span>\n</h2>\n\
  \n@{ Html.Partial(\"_Grid\", Model); }\n```\n\n`Grid` 部分视图如下：\n\n```html\n<table\
  \ class=\"table table-condensed\">\n    <thead>\n        <th>名称</th>\n        <th>首都</th>\n\
  \        <th>大洲</th>\n    </thead>\n    @foreach (var country in Model)\n    {\n\
  \        <tr>\n            <td>@country.Name</td>\n            <td>@country.Capital</td>\n\
  \            <td>@country.Continent</td>\n        </tr>\n    }\n</table>\n```\n\n\
  ![Image](img/0078.jpeg) **图 11-3** 通过 DIV 元素顺序渲染的数据\n\n诀在于你对循环中的每个数据项做什么。你可以像图 11-2\
  \ 那样渲染表格，或者你可以创建浮动的 `DIV` 元素：\n\n点击此处查看代码图像\n\n```html\n<div id=\"tile-container\"\
  >\n    @foreach (var country in Model.Countries)\n    {\n        // 创建浮动 DIV\n \
  \       <div style=\"float: left; ...\">\n            ...\n        </div>\n    }\n\
  </div>\n<div class=\"clearfix\"></div>\n```\n\n每个 `DIV` 元素渲染其内容——如图像所示图像和文本——并使用\
  \ `float: left` 样式进行样式设置。`float` 属性的最终是 `DIV` 元素水平对齐，而不是以块的形式渲染。在底部 DIV 上的 `clearfix`\
  \ 类是 Bootstrap 类。如果你不使用 Bootstrap，可以按照以下方式实现 `clearRect` 类的效果：\n\n```html\n<div\
  \ style=\"clear: both\" />\n```\n\n##### 按逻辑分组渲染数据\n\n\n\n\n\n假设你需要显示的数据列表过长，导致用户无法有效消费。因此，你想将其拆分为逻辑组。例如，你想按大洲或首字母来组织国家列表。最终，这与分页类似，不同之处在于需要一些逻辑来创建和显示分组。一个可以使用的通用组件是标签页列表（tab\
  \ list）。在 Bootstrap 中，你可以找到所需的所有低级工具。\n\n让我们看看如何组织视图以获得图 11-4 所示的效果。\n\n![Image](img/00079.jpeg)\n\
  \n**图 11-4** 逻辑分组的数据\n\n为了获得如图 11-4 所示的视图，你需要控制器将即时数据（ad hoc data）传递给视图引擎。视图必须同时接收标签头列表以及每个标签页对应的国家/地区列表进行渲染：\n\
  \n点击此处查看代码图像\n\n```csharp\npublic ActionResult Pills()\n{\n    var model = _service.GetCountryGroupsViewModel();\n\
  \    return View(model);\n}\n```\n\n工作服务返回一个如下所示定义的视图模型类（ViewModel）：\n\n点击此处查看代码图像\n\
  \n```csharp\npublic class CountryGroupsViewModel : ViewModelBase\n{\n    public\
  \ CountryGroupsViewModel()\n    {\n        Groups = new List<CountryGroup>();\n\
  \    }\n    public IList<CountryGroup> Groups { get; set; }\n}\n\npublic class CountryGroup\n\
  {\n    public CountryGroup()\n    {\n        Header = \"?\";\n        Countries\
  \ = new List<Country>();\n    }\n    public string Header { get; set; }\n    public\
  \ IList<Country> Countries { get; set; }\n}\n```\n\nRazor 视图使用了几个 Bootstrap 类来设置标签页条。`UL`\
  \ 元素提供了样式为药丸形状（pills）的可选标签：\n\n点击此处查看代码图像\n\n```html\n<ul class=\"nav nav-pills\"\
  >\n    @foreach (var g in Model.Groups)\n    {\n        var isActive = (g.Header.StartsWith(\"\
  A\") ? \"active\" : \"\");\n        <li role=\"presentation\" class=\"@isActive\"\
  >\n            <a href=\"#group_@g.Header\" data-toggle=\"tab\">\n             \
  \   @g.Header\n                <span class=\"badge\">@g.Countries.Count()</span>\n\
  \            </a>\n        </li>\n    }\n</ul\n```\n\n接下来的 `DIV` 元素包含了子章节列表，每个章节提供对应标签页的详细视图：\n\
  \n点击此处查看代码图像\n\n```html\n<div class=\"tab-content\">\n    @foreach (var g in Model.Groups)\n\
  \    {\n        var isActive = (g.Header.StartsWith(\"A\") ? \"active\" : \"\");\n\
  \        <div role=\"tabpanel\" class=\"tab-pane @isActive\" id=\"group_@g.Header\"\
  >\n            <h3>@g.Header</h3>\n            @Html.Partial(\"_CountryGrid\", g.Countries)\n\
  \        </div>\n    }\n</div>\n```\n\n在较低的抽象层次上工作也意味着花费更多时间来思考要显示数据的理想组织方式，以及为用户的理想导航体验。另一方面，当你有功能强大的组件可用时，你不可避免地倾向于将数据视为工具的函数。毕竟这是一个已知的模式：当你有一把锤子时，任何东西看起来都像钉子。\n\
  \n### 添加分页功能\n\n数据分页并不复杂，但它可能会很无味，而且数据并不总是如人们预期的那样可以重用。正如你很快将看到的，数据列表分页的模式已经非常完善且成熟，并且存在一些高质量的\
  \ NuGet 包来简化大部分任务。然而，每次可能仍然需要进行一些工作，来设置用户界面、提供收集数据的即时端点（endpoints），或两者兼顾。\n\n###\
  \ 选择辅助工具\n\n分页的核心是从较大的数据集中选择出一部分数据。在此过程中，你还需要定义页码的大小并跟踪当前索引。最后，你需要一个分页工具栏，允许用户跳转到上一页或下一页，或者直接跳转到特定页面。在\
  \ Web Forms 中，分页被包含在富数据绑定控件（如 `GridView` 和 `ListView`）中。在 ASP.NET MVC 中，关于分页你有几种选择：\n\
  \n![Image](img/00003.jpeg) 使用完全的 JavaScript 解决方案。\n![Image](img/00003.jpeg) 使用一些针对\
  \ ASP.NET MVC 的第三方组件。\n![Image](img/00003.jpeg) 基于常用工具构建自己的分页解决方案。\n\n用于数据网格分页的最好的百分之百\
  \ JavaScript 解决方案之一是 jqGrid。该产品的演示版 可以在 [`www.guriddo.net/demo/guridjs`](http://www.guriddo.net/demo/guridjs)\
  \ 找到。该库完全支持 Bootstrap 并且需要许可费用。在视图中集成网格只需要一点代码。总体来说，这种工作类似于在 Web Forms 中配置 `GridView`。这里的布局：\n\
  \n点击此处查看代码图像\n\n```html\n<table id=\"grid\"></table>\n<div id=\"pager\"></div>\n\
  <script>\n$(document).ready(function() {\n    $(\"#grid\").jqGrid({\n        url:\
  \ 'http://www.guriddo.net/demo/guridjs',\n        colModel: [\n            { label:\
  \ 'Name', name: 'Name', key: true, width: 200 }\n        ],\n        rowNum: 30,\n\
  \        pager: \"#pager\"\n    });\n});\n</script>\n```\n\n该组件会查询指定的 URL 获取 JSON\
  \ 数据并填充网格。分页器也会根据下载的数据集进行填充。一旦视图完成，分页和排序开箱即用。\n\n另一种选择是查看 Telerik 等流行供应商提供的方案。提供分页功能的强大组件演示可以在这里找到：http://demos.telerik.com/aspnet-mvc/grid](http://demos.telerik.com/aspnet-mvc/grid)。我这里提出的解决方案基于名为\
  \ `PagedList` 的 NuGet 包。（参见图 11-5。）\n\n![Image](img/00080.jpeg)\n\n**图 11-5** 示例项目使用的\
  \ PagedList 包\n\n### 基于 URL 的分页\n\n要基于 `PagedList` NuGet 包安排分页方案，你最重要的工作是暴露一个可以为每个请求页面提供数据的端点。一旦端点设置，将图\
  \ 11-2 中的网格转换为分页网格只需如下：\n\n点击此处查看代码图像\n\n```html\n<div style=\"text-align:center\"\
  >\n    @Html.PagedListPager(\n        Model.CountriesInPage,\n        page => \"\
  /country/pagedgrid?p=\" + page)\n</div>\n@{ Html.RenderPartial(\"_CountryGrid\"\
  , Model.CountriesInPage.ToList()); }\n```\n\n`CountryGrid` 部分视图是我之前使用的同一个。唯一的区别是它现在只接收一页数据。`Html.PagedListPager`\
  \ 是包中的一个函数，仅渲染分页器。（参见图 11-6。）\n\n![Image](img/00081.jpeg)\n\n**图 11-6** 分页网格\n\n\
  分页器中的每个按钮都是锚点标签，并指向特定的控制器操作。控制器操作必须接受几个参数，例如页索引和页的大小：\n\n点击此处查看代码图像\n\n```csharp\n\
  public ActionResult PagedGrid(\n    [Bind(Prefix = \"p\")] int pageIndex = 1,\n\
  \    [Bind(Prefix = \"s\")] int pageSize = 20)\n{\n    var model = _service.GetPagedCountryListViewModel(pageIndex,\
  \ pageSize);\n    return View(model);\n}\n```\n\n\n\n\n示例中的 `PagedList` 是在 `NuGet`\
  \ 软件包中定义的一个即时集合类型。它封装了要渲染的数据项，以及关于页面索引和大小的信息。在示例中，视图模型类只接收了要在视图中渲染的数据项。\n\n![Image](img/00006.jpeg)\
  \ 重要提示\n\n在涉及分页时，最重要的决定是您如何获取每页的内容。缓存是实现最优性能的关键。根据整个待分页数据集的大小和存储类型，缓存可以通过两种主要方式实现。在某些情况下，一次性加载并缓存整个数据集是负担得起的。如果你这样做，任何后续的请求都将非常快。如果数据集太大，不适合单次下载，那么您就应该找到一种缓存单页内容的方法，以避免进行重复查询。\n\
  \n## 基于 Ajax 的分页\n\n`PagedList` NuGet 包也可以与 JavaScript 和 Ajax 结合使用来获取后续页面。当使用 Ajax\
  \ 对数据集进行分页时，容器的整体布局如下：\n\n点击此处查看代码图像\n\n```html\n<div id=\"pager\">\n    <img id=\"\
  loader\" style=\"display:none\" src=\"@Url.Content(\"~/content/images/loading.gif\"\
  ) />\n    <!-- 页面加载时动态填充 -->\n</div>\n<div id=\"grid\">\n    <!-- 页面加载时动态填充 -->\n\
  </div>\n<script type=\"text/javascript\">\n    <!-- 加载第一页 -->\n</script>\n```\n\n\
  控制器操作与之前的案例几乎相同。您仍然需要一个知道如何根据给定的页面索引检索视图模型的端点。在这种情况下，您还面临着一个额外的问题：使用获取到的数据刷新 DOM。在您在本的配套代码中找到的解决方案中，页面及其分页器都是在服务器上渲染的，并在单个响应中返回给浏览器。客户端页面上的一些即时的\
  \ JavaScript 代码将负责将分页器的标记与页面的标记分离，并独立地更新 DOM 段。以下是控制器代码的片段：\n\n点击此处查看代码图像\n\n```csharp\n\
  public ActionResult Page(\n    [Bind(Prefix = \"p\")] int pageIndex = 1,\n    [Bind(Prefix\
  \ = \"s\")] int pageSize = 10)\n{\n    var model = _service.GetPagedCountryListViewModel(pageIndex,\
  \ pageSize);\n    // 存储每个部分视图的视图模型（如果模型类型不同）\n    ViewData[\"_CountryGrid\"] = model.CountriesInPage.ToList();\n\
  \    ViewData[\"_CountryGridPager\"] = model;\n    return new MultipleViewResult(\n\
  \        PartialView(\"_CountryGridPager\"),\n        PartialView(\"_CountryGrid\"\
  ));\n}\n```\n\n宿主页中的 JavaScript 代码如下：\n\n点击此处查看代码图像\n\n```javascript\n// 加载第一页\n\
  _p(1, 20);\n\nfunction _p(pageIndex, pageSize) {\n    new Paginator({\n        urlBase:\
  \ \"/country/page\",\n        pageIndex: pageIndex,\n        pageSize: pageSize,\n\
  \        loaderSelector: $(\"#loader\"),\n        updater: function(chunks) {\n\
  \            $(\"#pager\").html(chunks[0]);\n            $(\"#grid\").html(chunks[1]);\n\
  \        }\n    }).select();\n}\n```\n\n`Paginator` JavaScript 对象在项目中也被定义，它是对控制器分页操作的\
  \ Ajax 调用的封装：\n\n点击此处查看代码图像\n\n```javascript\nvar PaginatorSettings = function ()\
  \ {\n    var that = {};\n    that.urlBase = false;\n    that.pageIndex = 1;\n  \
  \  that.pageSize = 10;\n    that.loaderSelector = '';\n    that.updater = '';\n\
  \    return that;\n}\n\nvar Paginator = function (options) {\n    // 合并提供的和默认设置\n\
  \    var settings = new PaginSettings();\n    jQuery.extend(settings, options);\n\
  \    this.select = function() {\n        var url = settings.urlBase + \"?p=\" +\
  \ settings.pageIndex + \"&s=\" + settings.pageSize;\n        $(settings.loaderSelector).show();\n\
  \        $.ajax({ url: url }).done(function(response) {\n            $(settings.loaderSelector).hide();\n\
  \            window.location.hash = settings.pageIndex;\n            // 刷新页面和分页器\n\
  \            var splitter = new MultipleViewResult();\n            var chunks =\
  \ splitter.split(response);\n            settings.updater(chunks);\n        });\n\
  \    };\n}\n```\n\n正如您可能注意到的，控制器分页操作合并了页的部分视图和分页器的部分视图。`CountryGridPager` 部分视图使用\
  \ `PagedList` 辅助方法来渲染分页器：\n\n点击此处查看代码图像\n\n```razor\n@Html.PagedListPager(\n   \
  \ Model.CountriesInPage,\n    page => \"javascript:_p(\" + page + \",\" + Model.CountriesInPage.PageSize\
  \ + \")\")\n```\n\n总之，手工制作分页是可能的，但为了更好的用户体验，使用现成的工具通常更好。\n\n\n\n```javascript\n\
  const int chunkSize = 10;\n}\n```\n\n<table id=\"list\" class=\"table table-condensed\"\
  \ data-last=\"@maxInitialNumber\">\n    <thead>\n        <th>名称</th>\n        <th>首都</th>\n\
  \        <th>大洲</th>\n    </thead>\n    @Html.Partial(\"_CountryTableItems\", Model.Countries.Take(maxInitialNumber).ToList())\n\
  </table>\n\n`_CountryTableItems` 局部视图（partial view）仅负责渲染表格行。视图的标记被隔离到了局部视图文件中，这是因为当用户滚动到页面底部之外时，你需要返回一个额外的行数据集合。当这段代码运行时，用户会看到第一块行数据，并可以使用浏览器的滚动条对它们进行自由滚动。\n\
  \n现在，让我们添加一些脚本代码来检测页面底部：\n\n点击此处查看代码图片\n\n```javascript\n<script type=\"text/javascript\"\
  >\n    $(window).on(\"scroll\", function () {\n        var scrollHeight = $(document).height();\n\
  \        var scrollPosition = $(window).height() + $(window).scrollTop();\n    \
  \    if ((scrollHeight - scrollPosition) / scrollHeight === 0) {\n            //\
  \ 已滚动到页面底部。加载更多数据...\n            ...\n        }\n    });\n</script>\n```\n\n按需滚动（On-demand\
  \ scrolling）通过检索指定数量的额外数据项来实现。特别是，你可能只想检索紧随当前显示的最后一个项之后的数据项。最后一项的索引作为自定义 `data-last`\
  \ 属性存储在可滚动元素中，在此处是一个 HTML `TABLE` 元素。当到达底部时运行的脚本代码将计算最后一个元素的索引并调用后端：\n\n点击此处查看代码图片\n\
  \n```javascript\nvar from = parseInt($(\"#list\").attr(\"data-last\"));\nvar size\
  \ = @chunkSize;\nvar url = \"/country/more?from=\" + from + \"&howMany=\" + size;\n\
  $.ajax({ url: url })\n    .done(function (markup) {\n        // 将下载的数据项添加到当前视图中\n\
  \    });\n```\n\n控制器操作（controller action）被用于测量，并可能接收起始索引和要检索的项目数量：\n\n点击此处查看代码图片\n\
  \n```csharp\npublic ActionResult More(int from, int howMany = 10)\n{\n    var model\
  \ = _service.GetCountryListViewModel();\n    return PartialView(\"_CountryTableItems\"\
  , model.Countries.Skip(from).Take(howMany).ToList());\n}\n```\n\n最后一步是找到一种动态向现有\
  \ DOM 附加标记的方法。实现这一方法取决于可滚动元素的性质。如果是 `TABLE` 元素，以下代码运行良好：\n\n点击此处查看代码图片\n\n```javascript\n\
  $(\"#list\").attr(\"data-last\", from + size);\n$(\"#list tr:last\").after(markup);\n\
  ```\n\n你首先更新 `data-last` 属性，然后向表格添加更多行。（参见图 11-8）。\n\n![图像](img/00083.jpeg)\n\n\
  **图 11-8** 当滚动到页面底部时添加了更多数据项\n\n### 添加详情视图\n\n主/详情视图（master/detail view）的标准实现是用户从主视图选择一个特定元素，并跳转到一个单独页面，该页面提供关于该特定记录的额外信息。这种模式多年一直有效，今天依然运行良好。这种模式唯一的问题是，如果网站非常庞大且包含丰富的图形元素，对用户来说可能会很繁琐。在这种情况下，在主页和详情页之间回跳转很快就会变成一种不快的体验。让我们探索一些替代方案。\n\
  \n#### 弹出框视图（Popover views）\n\nBootstrap 让在页面元素上添加 `popover`（或富 HTML 的提示框）变得非常简单。Popover\
  \ 包含了用于快速查看所选元素的额外信息。注意，Popover 并不能完全替代完整的详情页，但它可以作为一个有效的折中方案，并可能为服务器节省往返次数。同时，Popover\
  \ 的叠加性质不会让用户界面充斥过多的次级信息。\n\n使用 Bootstrap 安排弹出框功能需要两个步骤。首先，你的数据项列表必须包含触发弹出框的切换元素。其次，你需要用一行脚本显式选择使用弹出框功能。事实上，在\
  \ Bootstrap 中，Popover 被认为是一个相当具有侵入性的功能，因此需要显式开启。\n\n##### 添加切换功能\n\nPopover 需要一个显式的触发器，用户与之交互以显示和隐藏弹出框窗口。这通常是一个锚点或按钮。如果你希望在用户悬停在任何页面元素上时显示弹出框，最好使用富\
  \ Bootstrap 提示框。假设要进一步探索的数据项列表渲染为 HTML 表格。在这种情况下，你仅需要额外添加一列：\n\n点击此处查看代码图片\n\n```html\n\
  <td>\n    <a tabindex=\"0\"\n        class=\"btn btn-info\"\n        role=\"button\"\
  \n        data-toggle=\"popover\"\n        data-trigger=\"focus\"\n        data-placement=\"\
  left\"\n        data-content=\"\">更多信息</a>\n</td>\n```\n\n`data-trigger` 属性设置预期的交互方式。`focus`\
  \ 值表示弹出框在切换元素获得或失去焦点时出现。选项有 `hover` 或 `click`。`data-placement` 属性指示弹出框相对于切换元素的显示位置。更多信息，请参考\
  \ Bootstrap 文档。\n\n##### 启用弹出框\n\n如所述，Popover 和提示框是显式开启的（opt-in）功能。这意味着在处理以下脚本之前，什么都不会发生：\n\
  \n点击此处查看代码图片\n\n```javascript\n<script type=\"text/javascript\">\n    $[data-toggle=\"\
  popover\"]').popover({\n        html: true\n    });\n</script>\n```\n\n此脚本位于页面底部，并在页面\
  \ DOM 完全初始化后运行。不过，它必须位于 jQuery 和 Bootstrap 脚本引用之后。jQuery 选择器可以通用地捕获页面上的弹出框切换元素，也可以特定的一个。\n\
  \n考虑的最后一个方面是通过弹出框显示的内容。如果你希望包含 HTML 格式的文本，则必须像示例所示将 `html` 设置为 `true`。\n\n#####\
  \ 设置弹出框内容\n\nPopover 设计用于呈现较小的次要信息，由于某种原因，这些信息不适合主界面。换句话说，你不想在弹出框显示时动态地确定其内容。然而，Bootstrap\
  \ 在弹出框即将显示、已显示或关闭时会触发相应的事件。\n\n在我看来，使用弹出框的方法是通过宿主页面下载的定义的 HTML 文本（如果你在 ASP.NET 环境中），或者在单页应用（SPA）上下文中在页面\
  \ DOM 中设置。你可以通过切换元素的 `data-content` 属性设置弹出框内容。或者，你可以求助于弹出框插件的特定设置：\n\n\n\n很有可能，你想要显示的文本位于\
  \ DOM 中，但它是针对某个特定数据项的。你如何在插件内部获取调用泡泡框（popover）的特定数据项呢？假设你想从每个数据项都拥有的隐藏 DIV 中获取泡泡框的内容。在切换元素中，你添加一个自定义属性，其中包含任何能够唯一标识数据项的属性——例如\
  \ `data-id` 属性：\n\n点击此处查看代码图片\n\n```html\n<td>\n    <a tabindex=\"0\"\n        ...\n\
  \        data-toggle=\"popover\"\n        data-trigger=\"focus\"\n        data-id=\"\
  @Model.CountryCode\">\n        More info\n    </a>\n</td>\n```\n\n接下来，在插件配置中，你将获取该属性并为\
  \ DIV 构建选择器。接下来的示例假设你数据项的额外的 DIV 被标识为 `yourDiv_XXX`，其中 `XXX` 是数据项的 ID：\n\n点击此处查看代码图片\n\
  \n```javascript\n<script type=\"text/javascript\">\n    ('[data-toggle=\"popover\"\
  ]').popover({\n        html: true,\n        content: function() {\n            var\
  \ code = $(this).attr(\"data-id\");\n            return $(\"#yourDiv_\" + code).html();\n\
  \        }\n    });\n</script>\n```\n\n图 11-9 显示了泡泡框的运行。\n\n![Image](img/00084.jpeg)\n\
  **图 11-9** 基于 Bootstrap 的运行泡泡框\n\n### 钻取视图 (Drill-down views)\n\n详情视图另一个常见示例是点击某个项时，同一页面的隐藏部分显示，允许用户对该项进行钻取。与泡泡框相比，钻取视图通常呈现更复杂的布局，这种布局不会为每个绑定的数据项重复出现。你有一个代表查看器的\
  \ DIV，并在选择项时动态获取要显示的信息。最终，这里展示的钻取视图类似于经典的主//详情（master/details）模式，不同之处在于没有发生浏览器引导的导航。\n\
  \n### 准备列表\n\n钻取视图在一个列表中定义，该列表充当菜单，并在另一个独立的查看器中显示所选中项的详情。列表必须由可点击的元素组成。这里有一个示例：\n\
  \n点击此处查看代码图片\n\n```html\n<table class=\"table table-condensed table-hover\">\n \
  \   @foreach (var country in Model.Countries)\n    {\n        <tr id=\"tr_@country.CountryCode\"\
  \ onclick=\"expand('@country.CountryCode')\">\n            <td>@country.CountryCode</td>\n\
  \            <td>@country.CountryName</td>\n        </tr>\n    }\n</table>\n```\n\
  \n这些 `TR` 元素被赋予了唯一的 ID 和 `click` 处理程序。通过点击表格行中的任何位置，你运行脚本，该脚本将读取 ID 属性并使用它发起远程调用以获取更多详细信息。这里是一个示例脚本：\n\
  \n点击此处查看代码图片\n\n```javascript\nfunction expand(code) {\n    $(\"tr\").removeClass(\"\
  active\");\n    $(\"#tr_\" + code).addClass(\"active\");\n    var url = \"/country/details/\"\
  \ + code;\n    $.getJSON(url).done(function (data) {\n        $(\"#code\").html(code);\n\
  \        $(\"#name\").html(data.CountryName);\n        $(\"#flag\").attr(\"src\"\
  , \"/content/images/flags/\" + code + \".png\");\n        $(\"#continent\").html(data.ContinentName);\n\
  \        $(\"#population\").html(data.Population);\n        $(\"#area\").html(data.AreaInKm);\n\
  \        $(\"#languages\").html(data.Languages);\n        $(\"#currency\").html(data.CurrencyCode);\n\
  \        $(\"#drilldownViewer\").collapse('show');\n    });\n}\n```\n\n脚本的前两行只是为选中的行设置激活状态。其余代码对远程端进行调用以获取国家/地区的\
  \ JSON 数据，然后更新查看器的元素。\n\n### 设置查看器\n\n查看器是一个普通的 DIV 元素，可以可选配置为可折叠元素：\n\n点击此处查看代码图片\n\
  \n```html\n<div id=\"drilldownViewer\" class=\"collapse\">\n    <img id=\"flag\"\
  \ onerror=\"this.src='@Url.Content(\"~/content/images/flags/none.png\")'\" />\n\
  \    <dl class=\"dl-horizontal\">\n        <dt>Name</dt>\n        <dd id=\"name\"\
  ></dd>\n        <dt>Continent</dt>\n        <dd id=\"continent\"></dd>\n       \
  \ <dt>Population</dt>\n    </dl>\n</div>\n```\n\n数据检索通过 `jQuery` 进行，并利用了框架内置缓存功能。大多数情况下，对\
  \ JSON 数据的实际请求通过查看器的本地缓存解决。这一事实使得任何性能担忧都是相对的。（参见图 11-10）。\n\n![Image](img/00085.jpeg)\n\
  **图 11-10** 使用 jQuery 和 Bootstrap 构建的钻取视图\n\n**提示**：显然，作为开发者，你既可以选择禁用 `jQuery` 自动缓存，也可以在服务器端设置适当的缓存策略，使下载的内容在适当的时间后过期。\n\
  \n![Image](img/00067.jpeg)\n通常情况下，数据项列表很长，超过了页面的可视区域。这意味着当你滚动到某个给定项时，钻取查看器会被推到屏幕之外。为了避免这种情况，只需将包含查看器的\
  \ DIV 元素的 `position` CSS 属性设置为 `fixed` 即可。\n\n![Image](img/00004.jpeg)\n**注意**：实现详情视图的另一种可能方案是模态对话框（modal\
  \ dialog boxes）。对于在详情视图中使用模态对话框非常谨慎。这很大程度上取决于请求详情的预期频率。在选择另一个元素之前必须关闭模态对话框。这使得解决方案对用户来说非常烦恼且繁琐。此外，模态对话框在可用性方面并不理想。\n\
  \n\n\n\n\n## 展示表单\n\n根据 `web.config` 文件中的信息，ASP.NET 运行时会将未认证的用户重定向到登录页面。返回 URL（Return\
  \ URL）会被添加到查询字符串中。用户接下来看到的将登录页面。\n\n![Image](img/00004.jpeg) 注意\n\n如果需要身份验证、授权或两者都具备的方法也配置为支持输出缓存会怎样？输出缓存（特别是\
  \ `OutputCache` 特性）会指示 ASP.NET MVC 不要每次都真实处理请求，而是返回之前计算过且仍然有效（例如未过期）的任何缓存响应。\n\n\
  如果启用了输出缓存，用户可能会请求一个已在缓存中的受保护 URL。ASP.NET MVC 确保 `Authorize` 特性的优先级高于输出缓存。特别是，对于受\
  \ `Authorize` 限制的方法，输出缓存层只有在用户通过身份验证和授权后，才会返回该方法的任何缓存响应。\n\n## 登录表单\n\n登录页面是一个简单的\
  \ HTML 表单，包含几个输入字段，例如用于用户名或电子邮件地址的文本框、用于密码的文本框，以及可选用于确定身份验证 Cookie 过期日的复选框：\n\n\
  点击此处查看代码图像\n\n```html\n<form method=\"POST\" action=\"@Url.Action(\"login\", \"\
  account\")\">\n    <input type=\"hidden\" name=\"ReturnUrl\" value=\"...\" />\n\
  \    <label for=\"username\">Username</label>\n    <input type=\"text\" id=\"username\"\
  \ name=\"username\" />\n    <label for=\"username\">Password</label>\n    <input\
  \ type=\"password\" id=\"password\" name=\"password\" />\n    <label>\n        @Html.CheckBox(\"\
  RememberMe\")\n        Remember me\n    </label>\n</form>\n```\n\n在 Razor 视图中，你可以将\
  \ HTML 元素作为普通 HTML 输出，也可以通过提供更高级语法的预定义助手（helpers）输出它们。通常，助手和普通 HTML 代码之间没有区别，除非所需的\
  \ HTML 代码包含多个元素。`Html.CheckBox` 正是属于这种情况。类型为复选框的核心 `INPUT` 元素不会上传布尔值，且如果复选框未被选中则不会上传任何值。因此，为了保证\
  \ ASP.NET 绑定层（在第 8 章，“ASP.NET MVC 核心](#part0015.html_ch08)”中讨论）有效工作，你需要一个与复选框 ID\
  \ 相同的额外隐藏 `INPUT` 字段。这正是你使用 `Html.CheckBox` 助手时通过紧凑语法实现的功能。\n\n此外，注意表单中添加用于存储返回\
  \ URL 的隐藏字段。当 ASP.NET 运行时将用户重定向到登录表单时，返回 URL——即原始请求的 URL——会被添加到查询字符串。因此，处理 `Login`\
  \ 方法 GET 请求的控制器方法将成功捕返回 URL。通过将其存储在隐藏字段中，代码确保了返回 URL 也能处理登录页面 POST 请求的控制器方法可以使用。\n\
  \n### 从登录表单提交\n\n当登录表单提交其内容时，控制器操作方法会接收提交的数据。在第 8 章中介绍的绑定机制使得编写以下代码可能：\n\n点击此处查看代码图像\n\
  \n```csharp\n[HttpPost]\n[ActionName(\"login\")]\npublic ActionResult LoginPost(LoginInputModel\
  \ input, string returnUrl)\n{\n    // 凭据\n    ...\n    // 如果发生任何错误 ...\n    ...\n\
  \    // 跳转到下一页\n    ...\n}\n```\n\n注意，要使上述代码工作，`INPUT` 字段必须设置 `name` 属性。仅有 `id`\
  \ 属性是不够的。\n\n`LoginInputModel` 类是一个应用程序定义的类，用于收集所有从登录表单流出并成为控制器操作输入的数据。如果验证过程成功结束，用户将重定向到返回\
  \ URL 或某些预定义的 URL。否则，必须重新显示登录页面，并带有一些额外信息，如登录尝试次数和错误消息。因此，显示登录视图时流向视图的数据可能与输入模型不同。\n\
  \n### 处理提交的数据\n\n处理凭据是将用户名和密码与存储的凭据进行比较的简单操作。此操作通常涉及访问数据库表并理解给定的数据库架构。像 ASP.NET\
  \ Identity 这样的全面框架提供了固定的数据库架构，但它们也提供了抽象接口供你重写，以便在不同的存储或不同的数据库架构上提供相同的功能。\n\n通常，检查凭据是一个可能因两个原因失败的过程。失败可能是因为输入的凭据无效（例如，空、null、太短、太长或格式不正确），也可能是因为提供的凭据与存储的凭据不匹配。根据发生的失败类型，你可以实现一个计数器，在固定次数的失败尝试后锁定账户，或者仅报告这些失败尝试。\n\
  \n### 显示登录错误\n\n在验证凭据期间检测到错误时，你可能希望通过消息报告错误，并将表单恢复到用户提交无效数据之前的状态。ASP.NET MVC 有一些有趣的功能可以实现这一点，但应该明确，此功能并不像\
  \ ASP.NET Web Forms 那样是免费提供的。\n\n考虑以下登录 POST 操作的正体：\n\n点击此处查看代码图像\n\n```csharp\n\
  [HttpPost]\n[ActionName(\"login\")]\npublic ActionResult LoginPost(LoginInputModel\
  \ input, string returnUrl)\n{\n    // 验证凭据以查看是否有效\n    if (String.IsNullOrWhiteSpace(input.UserName)\
  \ ||\n        String.IsNullOrWhiteSpace(input.Password))\n    {\n        ModelState.AddModelError(\"\
  \", \"Incomplete credentials\");\n    }\n    ...   // 此处可以更多检查\n    // 验证凭据以查看它们是否匹配已知用户\n\
  \    if (ModelState.IsValid)\n    {\n        if (_service.TryAuthenticate(input))\n\
  \            return Redirect(returnUrl ?? \"/\");\n        ModelState.AddModelError(\"\
  \", \"Invalid credentials\");\n    }\n    // 发生错误\n    return RedirectToAction(\"\
  login\");\n}\n```\n\n你可以运行许多一致性检查并为检测到的每个缺陷记录错误消息。你可以将错误消息添加到 `ModelState` 系统字典中。当你完成这些操作后，只有在模型状态为空时才继续安全检查。如果安全检查失败，你在模型状态中记录另一个错误并重定向到原始页面以携带收集的反馈。\n\
  \n遗憾的是，刚刚的代码无法携带任何反馈。由于方法末尾的 `RedirectToAction` 指令。在本章的后面，我将回到建议你使用重定向调用来退出 POST\
  \ 方法而不是直接渲染视图的原因。目前，只需说明如果你调用的是 `View()` 而不是 `RedirectToAction`，一切将如预期般工作，收集的反馈也将很好地显示出来。\n\
  \n### 重定向到视图\n\n调用 `RedirectToAction` 会引入额外的 HTTP 302 请求。由于该原因，`ModelState` 的内容以及输入模型的内容丢失。为了在两次连续请求之间保留这些信息，你必须使用\
  \ `TempData` 字典：\n\n点击此处查看代码图像\n\n```csharp\n// 发生错误\nTempData[\"ModelState\"] =\
  \ ModelState;\n\nreturn RedirectToAction(\"login\");\n```\n\n\n\n\n\n`TempData`\
  \ 字典是 ASP.NET MVC 基础设施的一部分。它会在两个连续请求之间自动持久化到会话（session）状态中，然后自动删除。将该字典添加到 ASP.NET\
  \ MVC 是为了服务这种特定的编程模式——以重定向（redirect）结束 `POST` 语句。如果在 `POST` 中使用，则必须在 `GET` 中检索该字典：\n\
  \n点击此处查看代码图片\n\n```csharp\n[HttpGet]\n[ActionName(\"login\")]\npublic ActionResult\
  \ LoginGet(string returnUrl = \"/\")\n{\n    var state = TempData[\"ModelState\"\
  ] as ModelStateDictionary;\n    ModelState.Merge(state);\n    // 设置显示的默认输入模型\n \
  \   var input = LoginInputModel();\n    var model = new LoginViewModel(input) {ReturnUrl\
  \ = returnUrl};\n    return View(model);\n}\n```\n\n用于存储字典中数据项的名称是任意的。图 12-1 显示了一个提交了不完整凭据的登录表单。\n\
  \n![Image](img/00086.jpeg)\n\n**图 12-1** 显示系统反馈的登录表单\n\n***\n\n![Image](img/00004.jpeg)\
  \ 注意\n\n关于表单提交期间向用户报告系统反馈的动态机制，还有很多要说的。我将在本章剩余部分讨论。\n\n***\n\n## 输入表单\n\n尽管看起来如此，但关于登录表单和验证过程的讨论已经涵盖了用户通过输入表单与系统交互的大部分内容。你已经看到了如何设置\
  \ HTML 表单，以及当表单提交到控制器操作（action）时发生了什么。模型绑定层将请求参数（如 `querystring`、`route` 和 `form`）转换为控制器可以轻松管理的舒适\
  \ C# 类。\n\n控制器方法对输入数据执行的任何操作可能是成功的也可能是失败的。如果是失败，你需要使用系统的反馈和预存在的数据通知用户。这在登录表单和数据输入表单中的工作原理是一样的。唯一需要进一步调查的点是，为什么你可能想用重定向结束\
  \ `POST` 请求。\n\n### 后-重定向-获取（Post-Redirect-Get）模式\n\n想象用户填写了一个表单并提交。浏览器字面执行 HTML\
  \ `FORM` 元素的指令并设置一个 `POST` 请求。服务器处理该请求。除非采取计数措施，否则控制器将通过选择 Razor 视图模板并告诉视图引擎将其渲染到输出流来结束其处理。请求已处理完毕，用户收回了一些\
  \ HTML。一切都是完好的，每个人都很开心。\n\n直到用户尝试刷新页面。\n\n### F5 效应\n\n当用户点击菜单中的“刷新”或按下 `F5` 键时，浏览器会重复上一次操作。然而，在执行完\
  \ `POST` 操作后立即刷新页面可能是一个危险的场景。出于这个原因，所有浏览器都会向用户显示你在图 12-2 中看到的确认消息。\n\n![Image](img/00087.jpeg)\n\
  \n**图 12-2** 浏览器在重新提交表单时显示的确认消息\n\n如果用户执意进行并重试，上一次操作将重复，并产生非常难以预料的影响。用户可能会收到一个异常（例如，添加了具有相同唯一键的记录），或者系统状态被不一致地改变（例如，添加了现有记录的副本）。\n\
  \n通过应用后-重定向-获取 (PRG) 模式，你可以确保最后一次操作总是 `GET`，这消除了出现如图 12-2 所示对话框的问题（或烦恼）。不过，这种模式也是——而且主要是——有益的，因为它清晰地将命令操作（command\
  \ actions）与查询操作（query actions）分离开。应用程序的整个架构更接近现代模式，例如命令/查询职责分离 (CQRS)。\n\n### 应用\
  \ PRG 模式\n\n在将 PRG 应用于 ASP.NET MVC 应用程序的第一步是将 `POST` 操作与 `GET` 操作整洁地分离开。以下是重写 `Edit`\
  \ 操作的方法：\n\n点击此处查看代码图片\n\n```csharp\n[HttpGet]\n[ActionName(\"edit\")]\npublic ActionResult\
  \ EditViaGet(String id)\n{\n    // 获取数据项并显示\n    var model = _service.GetModelForEdit(id);\n\
  \    return View(\"edit\", model);\n}\n\n[HttpPost]\n[ActionName(\"edit\")]\npublic\
  \ ActionResult EditViaPost(String id)\n{\n    // 执行命令\n    ...\n    // 与其调用 View(...)，而是重定向到\n\
  \    // 负责显示数据的入口\n    return RedirectToAction(\"edit\", new {id = id});\n}\n```\n\
  \nPRG 模式的另一个令人的副作用是显示的 URL 更有意义。用户甚至可以通过简单的理解来导航到不同的页面或不同的数据项。\n\n### PRG 模式的缺点\n\
  \nPRG 模式只是模式模式。和任何其他模式一样，它有优缺点。要使用它，你必须稍微改变一些常见的习惯。至少考虑这一点，你可能需要先听听 PRG 的优点。我的经验是，PRG\
  \ 在保持代码简洁简单方面非常有帮助。\n\n使用 PRG 后，表单提交的最后一次操作总是 `GET`。然而，因为表单提交是从 `POST` 开始的，你最终处于一个中间状态。在\
  \ `GET` 操作中渲染视图时，`POST` 操作的状态不再可用。\n\n如果你通过重定向到视图而不是在控制器方法底部调用 `View`，你丢失的信息基本上是你对数据进行任何验证的结果，包括你想作为反馈返回的任何信息。除非你有静态的成功/失败页面，否则这是一个问题。官方解决方案是使用\
  \ `TempData` 字典持久化模型状态，以及其他无法在后续 `GET` 方法中检索的信息。`TempData` 字典的寿命很短，每个键只在两个连续请求之间存在。那么缺点在哪里？\n\
  \n使用 `TempData` 要求数据被序列化以生存下一个请求。`TempData` 的默认实现使用会话状态。对于单服务器应用程序来说这不是问题，但在 Web\
  \ 集集的背景下，越少使用会话状态，你的生活就越轻松。\n\n### PRG 与 Web Farm\n\n简单来说，在 Web 集群或云场景中，你需要分布式的会话存储（外部进程或\
  \ Microsoft SQL Server）。或者，你可以转向使用 Cookie 或分布式缓存。ASP.NET MVC 包含一个简单的程序机制来更改 `TempData`\
  \ 的默认实现。`TempData` 的实现是基于控制器的。你只需要在打算使用 PRG 的任何控制器类中重写以下方法：\n\n```csharp\nprotected\
  \ override ITempDataProvider CreateTempDataProvider()\n{\n    return new YourTempDataProvider();\n\
  }\n```\n\n自定义的 `TempData` 提供者是一个实现 `ITempDataProvider` 接口的类：\n\n点击此处查看代码图片\n\n```csharp\n\
  interface ITempDataProvider\n{\n    IDictionary<string, object> LoadTempData(ControllerContext\
  \ controllerContext);\n    void SaveTempData(ControllerContext controllerContext,\
  \ IDictionary<string, object> values);\n}\n```\n\n\n\n\n自定义 `TempData` 字典的一种常用方法是使用\
  \ cookie。然而，当你更改了 `TempData` 的实现并开始向请求流中添加 cookie 时，你应该确保这些 cookie 在颁发后立即过期，以便后续的任何请求都无法再次获取到它们。关于该主题的一个有趣讨论以及示例代码链接，可以在\
  \ StackOverflow 上找到：*[`bit.ly/1jfyehd`](http://bit.ly/1jfyehd)*。\n\n## 表单验证\n\n\
  当你在要求用户填写并提交表单时，，你实际上是在要求自己负责只接收有效数据。然而，在 ASP.NET 中，当验证过程结束时，你仍面临着通知用户其输入内容存在何错误的问题。此外，验证过程通常由两个阶段组成：检查结构方面（如类型、范围、长度和是否为空）以及检查输入数据的业务一致性。至少，结构方面可以通过一个支持某些声明式编程风格的框架进行检查。\n\
  \n在 ASP.NET MVC 中，这个框架被称为 `Data Annotations`（数据注解），它现在已完全整合到 Microsoft .NET Framework\
  \ 中。\n\n### 引入数据注解\n\n数据注解是一组特性，你可以使用它们来对任何 .NET 类的公共属性进行标记，以便任何感兴趣的客户端代码都能读取并使用。特性主要分为两大类：显示和验证。在本书中，我们只关注验证注解。\n\
  \n在第 8 章中，你已经看到控制器如何通过模型绑定子系统接收输入数据。模型绑定会将请求数据映射到模型类，在此过程中，它会根据模型类上设置的注解对输入值进行验证。验证通过提供程序进行。默认验证提供程序基于数据注解。默认验证提供程序是\
  \ `DataAnnotationsModelValidatorProvider` 类。让我们看看默认验证提供程序可以理解哪些特性。\n\n表 12-1 列出了最常用的数据注解属性，这些属性表达了要在模型类上验证的条件。\n\
  \n![Image](img/00088.jpeg)\n\n表 12-1 用于验证的数据注解属性\n\n所有这些属性都派自同一个基类：`ValidationAttribute`。你也可以使用这个基类来创建自定义的验证注解。你使用这些属性来装饰用于输入表单的类成员。为了使整个机制生效，你需要能够将数据绑定到此类数据类型的控制器方法：\n\
  \n点击此处查看代码图像\n\n```csharp\n[HttpPost]\npublic ActionResult Edit(CountryInputModel\
  \ input)\n{\n   ...\n}\n```\n\n对于任何映射到 `CountryInputModel` 类实例的无效提交值，绑定器会自动在系统的\
  \ `ModelState` 字典中创建一个条目。提交的值是否有效，取决于当前注册的验证提供程序返回的结果。默认验证提供程序根据你在 `CountryInputModel`\
  \ 模型类上设置的注解来返回其响应。\n\n### 装饰输入模型类\n\n下面的列表显示了一个示例类——前述的 `CountryInputModel` 类——它为了验证目的大量使用了数据注解：\n\
  \n点击此处查看代码图像\n\n```csharp\npublic class CountryInputModel : ViewModelBase\n{\n \
  \   public CountryInputModel()\n    {\n        Code = \"??\";\n        Continent\
  \ = Continent.Unknown;\n        RegistrationNumber = String.Empty;\n    }\n    [Required(ErrorMessage\
  \ = \"Country name is required.\")]\n    [StringLength(50)]\n    public String Name\
  \ { get; set; }\n    [Required(ErrorMessage = \"Country code (ISO2) is required.\"\
  )]\n    [StringLength(2, MinimumLength = 2)]\n    [RegularExpression(@\"\\b[A-Z]+\"\
  , ErrorMessage = \"ISO2 format\")]\n    public String Code { get; set; }\n    [Required]\n\
  \    public Continent Continent { get; set; }\n    public Int32 Population { get;\
  \ set; }\n    public String RegistrationNumber { get; set; }\n}\n```\n\n正如你可能猜到的，这个类只是你在第\
  \ 11 章“显示数据](#part0018.html_ch11)”中在大多数示例中看到的 `Country` 类的远亲。你可以将 `Country` 类视为一个领域类。而你为了输入目的而装饰的类只是一个辅助类，它的唯一生存就是以从接口角度反映用户偏好的方式收集数据。\n\
  \n你的下一个目标是找到一种高效的方法来编辑此数据类型实例的内容。ASP.NET MVC 通过其长长的 HTML 助手列表提供了帮助。假设你有一个 `AdminController`\
  \ 类，其中有一个 `New` 方法，通过它可以向系统添加新的国家/地区：\n\n点击此处查看代码图像\n\n```csharp\n[HttpGet]\npublic\
  \ ActionResult New()\n{\n   // 设置显示在表单中的默认值\n   var model = new CountryInputModel();\n\
  \   return View(model);\n}\n```\n\n让我们来看看用于编辑的 Razor 视图。\n\n### 显示输入表单\n\nHTML 表单具有以下布局。大多数\
  \ Bootstrap 样式和填充元素（主要是 `DIV` 元素）为了清晰起见已从列表中移除：\n\n点击此处查看代码图像\n\n```html\n<form\
  \ method=\"POST\" action=\"@Url.Action(\"new\")\">\n  <fieldset>\n    <legend>New\
  \ Country</legend>\n    @{ Html.RenderPartial(\"_Alert\"); }\n    <!-- Registration\
  \ number -->\n    <label for=\"name\">Registration</label>\n    <input type=\"text\"\
  \ name=\"registration\" id=\"registration\" class=\"form-control\" value=\"@Model.RegistrationNumber\"\
  >\n    <!-- Name -->\n    <label for=\"name\">Name</label>\n    @Html.TextBoxFor(m\
  \ => m.Name, new { placeholder = \"Name\" })\n    <span class=\"text-danger\">@Html.ValidationMessage(m\
  \ => m.Name)</span>\n    <!-- Code -->\n    <label for=\"name\">Code</label>\n \
  \   @Html.TextBoxFor(m => m.Code, new { placeholder = \"Code\" })\n    <span class=\"\
  text-danger\">@Html.ValidationMessage(m => m.Code)</span>\n    ...\n    <!-- Continent\
  \ -->\n    <label for=\"name\">Code</label>\n    @Html.DropDownListFor(m => m.Continent,\
  \ new Continent().SelectList(@Model.Continent.As<int>()))\n    <span class=\"text-danger\"\
  >@Html.ValidationMessage(m => m.Continent)</span>\n    <!-- Validation summary -->\n\
  \    <span class=\"text-danger\">@Html.ValidationSummary(true)</span>\n    <!--\
  \ Submit button -->\n    <button type=\"submit\" class=\"btn-primary\"> Save </button>\n\
  \  </fieldset>\n</form>\n```\n\n在上述代码中，最相关的注意的是使用了 HTML 助手而不是普通的 HTML5 元素。`Html.TextBoxFor`\
  \ 与下面的 HTML 和 Razor 代码混合之间的真实区别是什么？\n\n点击此处查看代码图像\n\n```html\n<input type=\"text\"\
  \ name=\"code\" id=\"code\" class=\"form-control\" placeholder=\"ISO2\" value=\"\
  @Model.Code\">\n```\n\n查看生成的纯标记，没有任何区别。（参见图 12-3）。\n\n![Image](img/00089.jpeg)\n\
  \n**FIGURE 12-3** 向系统添加新国家的表单\n\n\n\n\n\n想象以下这样一个相当经典的场景：用户输入一些数据并点击 `Submit` 按钮。控制器方法接收到提交的数据，并将匹配的数据复制到输入模型类型的属性中。然而，该输入模型类型装饰了数据注解（data\
  \ annotations），然后提交的值的值将根据这些注解进行验证。任何无效属性的错误都会被记录并保存到 `ModelState` 字典中。\n\n通过 `ModelState`\
  \ 字典的编程接口，控制器方法会检查输入模型是否处于有效状态。如果是，它将继续执行任何必要的业务操作（例如持久化）。如果输入模型不处于有效状态，控制器有两个选项可以选择：\n\
  \n![Image](img/00003.jpeg) 渲染带有某些错误信息的视图\n\n![Image](img/00003.jpeg) 重定向到另一个控制器操作，该操作将渲染下一个视图（PRG\
  \ 模式）\n\n前一种选项会将 `POST` 留在浏览器缓存的最后一个操作中，并可能使用户暴露在 F5 刷新的影响下。从设计角度来看，后者更加清晰（命令和查询被视为不同的操作），但它丢失了关于无效状态的信息以及关于提交数据的信息。\n\
  \n支持 PRG 的控制器将将模型状态存储在 `TempData` 字典并进行重定向。重定向后的方法将从同一个 `TempData` 字典加载模型状态并渲染视图。`ModelState`\
  \ 字典包含了关于错误和提交值的所有信息，但纯 HTML5 视图对此一无所知。相反，ASP.NET MVC 的 `xxxFor` 辅助方法执行了魔法操作，读取\
  \ `ModelState` 字典并设置输入字段的数值属性以反映最后已知状态：\n\n点击此处查看代码图片\n\n```csharp\n[HttpPost]\n\
  public ActionResult New(CountryInputModel data)\n{\n    if (ModelState.IsValid)\n\
  \    {\n        // 执行命令\n        var model = _service.Save(data);\n        if (model.LastActionResponse.Success)\n\
  \            return RedirectToAction(\"...\");\n    }\n    // 检测到错误\n    return\
  \ RedirectToAction(\"new\");\n}\n```\n\n结果，如果你实现了 PRG 并且希望在用户修复错误时保留表单中的任何错误输入，你必须在\
  \ Razor 视图中使用 `xxxFor` 辅助方法，而不是普通的 HTML5 元素。\n\n### 显示验证消息\n\n在 `xxxFor` HTML 辅助方法中，你会找到\
  \ `Html.ValidationMessageFor` 和 `Html.ValidationSummary`。前者显示模型状态中与指定属性相关的错误消息：\n\
  \n点击此处查看代码图片\n\n```html\n<span class=\"text-danger\">@Html.ValidationMessageFor(m\
  \ => m.Continent)</span>\n```\n\n另一方面，后者呈现存储在模型状态中的错误消息摘要。从 HTML 的角度来看，这两个辅助方法都渲染出普通的\
  \ `SPAN` 标签，可以放在表单中的任何位置。通常，你将验证消息放在特定的输入字段旁边，并将摘要放在表单顶部或底部。\n\n很棒的一点是，在你用数据注解装饰了输入模型并指示控制器方法处理模型状态后，你在\
  \ 图 12-4 中看到的内容几乎是免费获得的。\n\n![Image](img/00090.jpeg)\n\n**图 12-4** 输入表单中的错误消息处理\n\
  \n数据注解的优之处在于，在你为模型类型定义了属性后，基本上就完成了。得益于 ASP.NET MVC 基础设施对数据注解的深度理解，后续的大部分工作会自动发生。然而，在这个不完美的世界里，你真正需要的事情都不是完全免费的。因此，数据注解很好地涵盖了许多相对简单的情况，但在许多现实应用中仍留了一些额外工作需要你自己完成。让我们探索一个更高级的场景。\n\
  \n### 执行跨属性验证\n\n我目前为止涵盖的数据注解都是你用于验证单个字段内容的属性。这非常有用，但在现实场景中，帮助并不大，因为在那种你可能需要根据另一个属性存储的值来验证某个属性的内容。跨属性验证需要一些特定上下文的代码。\n\
  \n要同时验证两个或多个属性，并且其中一个基于另一个的值，你需要在类级别使用全局属性——`CustomValidation`：\n\n点击此处查看代码图片\n\n\
  ```csharp\n[CustomValidation(typeof(CountryInputModel), \"Validate\")]\npublic class\
  \ CountryInputModel : ViewModelBase\n{\n    ...\n}\n```\n\n简单来说，该属性指定了一个在过程中被调用的方法，用于执行任何需要跨属性检查的操作：\n\
  \n点击此处查看代码图片\n\n```csharp\npublic static ValidationResult Validate(CountryInputModel\
  \ data, ValidationContext context)\n{\n    if (data.Continent == Continent.Unknown\
  \ && !data.Name.IsNullOrWhitespace())\n        return new ValidationResult(\"必须指示一个大陆.\"\
  );\n    return ValidationResult.Success;\n}\n```\n\n你是否应该只定义一个全局属性而忽略单个属性？点在于，对于单个属性，你显示它们要容易得多。要显示跨属性验证相关的错误，我们需要使用摘要方法，如\
  \ 图 12-4 所示：\n\n点击此处查看代码图片\n\n```html\n<span class=\"text-danger\">@Html.ValidationSummary(true)</span>\n\
  ```\n\n`ValidationSummary` 的一个有趣特性是，如果你用布尔值 `true` 调用它（如示例所示），显示的错误列表将限于引用属性的错误。这允许你显示跨属性验证并帮助避免重复消息。（参见\
  \ 图 12-5）\n\n![Image](img/00091.jpeg)\n\n**图 12-5**\n\n到目前为止，我讨论了输入表单的验证阶段。当提交的数据满足所有要求时，`ModelState`\
  \ 字典处于有效状态，控制器继续执行操作。该操作可以成功完成，也可以失败。在两种情况下，都必须向用户反馈。\n\n一种简单方法是在基础视图模型中添加几个属性，以便在任何视图中可用。更好的是，你可以创建一个新的\
  \ `CommandResponse` 类：\n\n点击此处查看代码图片\n\n```csharp\npublic class CommandResponse\n\
  {\n    public bool Success { get; set; }\n    public string UserMessage { get; set;\
  \ }\n}\n\npublic class ViewModelBase\n{\n    public CommandResponse LastCommandResponse\
  \ { get; set; }\n}\n```\n\n由控制器调用的服务方法或控制器本身编写命令响应，它直接位于视图并始终以相同的方式显示。结果是，你现在可以轻松创建一个\
  \ HTML 小部件来显示成功或错误消息：\n\n点击此处查看代码\n\n```html\n<!-- Alert -->\n@if (Model.HasMessage())\n\
  {\n    var style = Model.LastActionResponse.Success ? \"alert-success\" : \"alert-danger\"\
  ;\n    var rnd = new Random().Next(1000000, 1000000000);\n    <div id=\"__alert__@rnd\"\
  \ class=\"alert alert-dismissable @style\">\n        <button type=\"button\" class=\"\
  close\" data-dismiss=\"alert\" aria-label=\"Close\">\n            <span aria-hidden=\"\
  true\">&times;</span>\n        </button>\n        @Model.LastActionResponse.UserMessage\n\
  \    </div>\n    <script type=\"text/javascript\">\n        $(\"#__alert__@rnd\"\
  ).delay(4000).slideUp();\n    </script>\n}\n```\n\n\n\n\n```javascript\n</script>\n\
  \n}\n```\n\n在任何视图中，你只需要添加以下行，即可获得图 12-6 所示的效果：\n\n点击此处查看代码图像\n\n```html\n@{ Html.RenderPartial(\"\
  _Alert\"); }\n```\n\n![Image](img/00092.jpeg)\n\n**图 12-6** 一个可重用的警报组件\n\n响应将在屏幕顶部以\
  \ Bootstrap 警告框的形式渲染，该框会在几秒后自动消失。\n\n***\n\n## 用于 PRG 控制器的自定义属性\n\n如果你探索书中附带源码，你会发现某些围绕输入表单的示例似乎还没有处理\
  \ `TempData` 字典，但代码产生的效果与使用该字典完全相同。秘诀在哪里呢？\n\n要实现 PRG 模式和表单验证，你只需要对 `TempData` 字典执行几个基本操作。对于每个控制器的每个提交方法，这些操作总是相同的，并且反复出现。\n\
  \nASP NET MVC 提供了一种向控制器方法中整合附加功能的机制——动作过滤器（action filters）。一旦编译，动作过滤器以属性的形式出现，你可以用它装饰控制器方法或类。在内部，动作过滤器可以重写多两个方法：`OnActionExecuting`\
  \ 和 `OnActionExecuted`。如名所示，前者重写表示在执行控制器方法正之前要执行的代码。后者方法定义了在控制器方法完成后要执行的代码。\n\n\
  动作过滤器可以访问整个控制器管道，并能够读取和修改视图模型（view model）和模型状态（model state）。注意，`OnActionExecuted`\
  \ 在控制器方法执行完毕、但在视图处理和生成之前运行。因此，对模型状态或视图模型的任何更新都将完全反映在实际视图中。\n\n你在书中配套代码中找到 `Prg`\
  \ 属性是最初属于 MvcContrib 项目的类似组件的细微变，你可以在 [`mvccontrib.codeplex.com`](http://mvccontrib.codeplex.com)\
  \ 了解更多关于它的信息。使用该属性再简单不过了：\n\n点击此处查看代码图像\n\n```html\n[Authorize]\n\n[Prg]\n\npublic\
  \ class EditorController : Controller\n{\n    [HttpPost]\n    public ActionResult\
  \ New(CountryInputModel input)\n    {\n        if (ModelState.IsValid) {\n     \
  \       DoYourTask(input);\n            return RedirectToAction(\"next-view\");\n\
  \        }\n        return RedirectToAction(\"current-view-with-errors\");\n   \
  \ }\n}\n```\n\n这里的代码展示了 POST 控制器方法的模式。\n\n***\n\n## 模态输入表单\n\n在第 11 章中，我讨论了一个下钻示例，当用户从列表中选择一个项时，数据实体的细节将显示在侧边栏中。同样的模式有时对于编辑数据也很有用。当视图的主要目的是让用户检查并审查信息，并在获得授权的情况下偶尔进行编辑时，它的效果很好。\n\
  \n长期以来，编辑数据需要跳转到不同的页面或 URL 进行数据输入。在这些视图中，输入表单围绕 `FORM` 标签和浏览器引导的内容提交而构建。这是我们目前为止处理的场景。是否有方法可以在不刷新整个页面的情况下向用户呈现输入表单？这就是模态输入表单。\n\
  \n### 配置模态表单\n\n归底，模态表单仅仅是显示在其他所有内容之上的 `DIV`，使其下方的任何内容失去响应。换句话说，这里的“模态”（modality）意味着用户的注意力被弹出用户界面捕捉。安排和显示模态表单需要内容\
  \ `DIV` 以及一些用于显示和隐藏它的 JavaScript，并注意 `z-index` 和焦点 HTML 属性。不过，手头有一个框架会让一切变得简单。Bootstrap\
  \ 为模态框提供了极佳的支持。\n\n在 Bootstrap 中，一个 `modal` 由两个元素组成：触发器（trigger）和内容（content）。内容是一个装饰有某些临时属性的稀疏\
  \ `DIV`。该 `DIV` 布局在主机视图中（通常位于底部），并以内联标记的形式注入，或者更好的是作为一个独立的局部视图（partial view）注入：\n\
  \n点击此处查看代码图像\n\n```html\n<div>\n    <!-- 这是宿主视图的模板 -->\n</div>\n```\n\n```html\n\
  @{ Html.RenderPartial(\"your_modal_view\") }\n```\n\n每个模态都有一个或多个触发器。触发器是用户操作以唤起模态框的用户界面元素。通常，触发器是一个可点击的元素，例如锚点链接或按钮。然而，由于\
  \ Bootstrap 中的模态组件有自己的编程接口和索引，你可以通过响应事件来程序化地弹出模态框。以下是典型的 Bootstrap 配置：\n\n点击此处查看代码图像\n\
  \n```html\n<!-- 触发器 -->\n<button class=\"btn btn-danger\" data-toggle=\"modal\"\
  \ data-target=\"#Editor\">\n    <span class=\"glyphicon pencil\"></span> 编辑\n</button>\n\
  \n<!-- 模态 -->\n<div id=\"Editor\" class=\"modal\">\n    <div class=\"modal-dialog\"\
  >\n        <div class=\"modal-content\">\n            <div class=\"modal-header\"\
  >\n                ...\n            </div>\n            <div class=\"modal-body\"\
  >\n                ...\n            </div>\n            <div class=\"modal-footer\"\
  >\n                ...\n            </div>\n        </div>\n    </div>\n</div>\n\
  ```\n\n在触发器元素中，关键属性是 `data-toggle` 和 `data-target`。前者告诉 Bootstrap 行为，`data-target`\
  \ 包含了要显示的 `DIV` 选择器。\n\n模态内容是一个特殊的 HTML 块。它是带有 `modal` 类的容器并包含一个 `modal-dialog`，而后者包含\
  \ `modal-content`。在模态内容中，你可以放置任何你想让用户看到的内容。通常三个子元素：头部（header）、主体（body）和页脚（footer）。不过这不是强制性的。拥有此类容器有助于边距和定位，但不会改变对话框的功能。\n\
  \n### 模态常用元素的结构\n\n给模态表单提供一些元素是好的，例如头部的关闭按钮和用于操作的按钮列表。建议在某处设置标题并为反馈留出空间。\n\n这里是典型的头部标记。元素的\
  \ ID 是任意的：\n\n点击此处查看代码图像\n\n```html\n<button type=\"button\" class=\"close\" data-dismiss=\"\
  modal\">\n    <span aria-hidden=\"true\">&times;</span>\n</button>\n<h4 class=\"\
  modal-title\" id=\"titleOfTheForm\"></h4>\n```\n\n此代码在头部添加了一个关闭按钮，就像 Microsoft Windows\
  \ 中的那样。同样，在页脚添加类似的按钮也很常见。`data-dismiss` 属性告诉 Bootstrap 在点击按钮时关闭对话框：\n\n点击此处查看代码图像\n\
  \n```html\n<button type=\"button\" class=\"btn btn-default\" data-dismiss=\"modal\"\
  >关闭</button>\n```\n\n模态可以仅用于展示信息，也可以实现模态输入表单。模态的内容可以在创建视图时静态定义，也可以在模态准备显示时更新：\n\n\
  点击此处查看代码图像\n\n```html\n<div class=\"modal-content\">\n    <div class=\"modal-header\"\
  >\n        ...\n    </div>\n    <div class=\"modal-body\">\n        @Html.Partial(\"\
  _ModalEditorForm\")\n    </div>\n    <div class=\"modal-footer\">\n        ...\n\
  \    </div>\n</div>\n```\n\n\n\n\n\n代码段中引用的 `ModalEditorForm` 指的是用于编辑所选元素的 HTML\
  \ 表单。HTML 表单的输入元素通过 JavaScript 设置，该脚本会拦截模态表单的 `show` 事件。\n\n### 初始化模态表单\n\n当包含模态表单的视图加载时，必须进行某些一次性初始化。具体来说，初始化将为\
  \ `show` 事件绑定事件处理程序，对于输入表单，它还将设置客户端 jQuery 验证的规则：\n\n点击此处查看代码图片\n\n```javascript\n\
  $(document).ready(function() {\n    // ==> 为 \"show\" 事件注册事件处理程序\n    $(\"#modalEditor\"\
  ).on(\"show.bs.modal\", function (e) {\n        // 获取点击的国家代码\n        var code =\
  \ $(e.relatedTarget).attr(\"data-id\");\n        // 设置标题\n        $(\"#titleOfTheForm\"\
  ).html(code);\n        // 下载详情\n        $.ajax({\n            url: \"/country/find/\"\
  \ + code,\n            cache: false\n        }).done(function (info) {\n       \
  \     $(\"#legend\").html(info.CountryName);\n            $(\"#code\").val(info.CountryCode);\n\
  \            $(\"#Population\").val(info.Population);\n            $(\"#AreaInKmSq\"\
  ).val(info.AreaInSqKm);\n        });\n    });\n    // ==> 注册 jQuery 验证规则（如果有）\n\
  \    ...\n});\n```\n\n其思路是从服务器下载包含编辑记录详情的 JSON 数据，并使用这些信息填充弹出 HTML 表单的输入字段。用户每触发一次模态，就会发生一次下载，并配置相同的\
  \ HTML 标记以显示动态数据。\n\n***\n\n![Image](img/00006.jpeg) 重要\n\n在这里使用 jQuery 缓存是有争议的。如果过度使用，可能会产生糟糕的影响，让用户觉得系统忽略了他们的指令。用户保存数据后系统显示一切正常，但下次编辑同一条记录时，表单提供的旧数据，尽管系统已经存储了更新后的信息。嗯，我也经历过这种情况，这确实让人心恼且沮丧。你可以像示例中禁用\
  \ jQuery 缓存来解决这个问题，但代价是每次都要重新下载。\n\n***\n\n图 12-7 展示了第 11 章 中下钻示例的修改版本，其中菜单中添加了一个按钮，弹出一个模态输入表单以编辑某些信息。\n\
  \n![Image](img/00093.jpeg)\n\n**图 12-7** 运行中的模态输入表单\n\n### 从模态表单提交数据\n\n一旦模态表单运行，用户就可以自由编辑任何内容。让我们假设用户输入和输入的所有都是可接受的输入。你如何从模态表单提交数据呢？有两种基本方法：\n\
  \n![Image](img/00003.jpeg) 常规浏览器引导的表单提交，并跳转到另一个页面，在该页面显示任何反馈（成功或错误消息）\n\n![Image](img/00003.jpeg)\
  \ 由 JavaScript 控制的表单提交，不离开表单，并将反馈（成功或错误消息）报告回同一个表单\n\n在这两种情况下，你都可以使用 jQuery 验证在表单上应用一些良好的验证效果。\n\
  \n第一种提交选项编写非常简单，在许多方面它都是默认选项。根结底，弹出窗口是一个包含标准 HTML `FORM` 元素的 `DIV`。因此，`FORM` 元素引用服务器操作并托管了一个经典的提交按钮。当用户点击提交按钮时，表单内容会被收集并通过\
  \ `POST` 请求发送。这与经典的表单实现没有任何区别。对于用户来说，效果是他们在提交后被带到了另一个页面，并需要导航回来以继续编辑。这本身并不是缺点；它只是一种常见的行为，在任何情况下可能适用也可能不适用。\n\
  \n要通过 JavaScript 提交，你需要为提交按钮绑定一个点击处理程序，并将表单内容序列化为 JSON。以下是一些示例：\n\n```javascript\n\
  function saveChanges(form) {\n    // 假设 form 是 jQuery 对象，而不是 DOM 元素！\n    var url\
  \ = \"/editor/save\";\n    var postData = form.serialize();\n    $.post(url, postData,\
  \ function (data) {\n        if (data.toLowerCase() == \"ok\") {\n            $(\"\
  #feedback\").removeClass(\"alert-danger\")\n                .html(\"数据已保存!\");\n\
  \        } else {\n            $(\"#feedback\").addClass(\"alert-danger\")\n   \
  \             .html(\"出现错误。请重试!\");\n        }\n    });\n}\n```\n\n\n\n\n客户端验证是有效的，因为它能对用户输入的内容提供相当于实时的反馈。这是一项你可以通过一些\
  \ JavaScript 和大量的事件处理器自己编写的功能。然而，正如你之前在用于服务器端验证的数据注解中看到的那样，使用现成的框架可以编写得更快且更具可用性。客户端验证的事实标准框架是\
  \ jQuery Validation。你可以将其作为 NuGet 程序包安装，并只需引用 `jquery.validate.min.js` 文件即可。或者，你也可以从\
  \ [`jqueryvalidation.org/validate`](http://jqueryvalidation.org/validate) 获取它。\n\
  \n要设置客户端验证，你需要为每个要使用的表单附加验证规则。这种操作可以在宿主页面或视图的 `ready` 处理器中进行。以下是一个示例：\n\n点击此处查看代码图像\n\
  \n```javascript\n$(\"#CountryForm\").validate({\n    rules: {\n        Population:\
  \ { required: true, min: 0 },\n        AreaInKmSq: { required: true, min: 0 }\n\
  \    },\n    messages: {\n        Population: \"Set population to 0 if not available.\"\
  ,\n        AreaInKmSq: \"Set area to 0 if not available.\"\n    },\n    errorContainer:\
  \ \"#validationSummary\",\n    errorLabelContainer: \"#validationSummary ul\",\n\
  \    wrapper: \"li\",\n    submitHandler: function (form) {\n        var $form =\
  \ $(form);    // Normalize to jQuery\n        __saveChanges($form);\n    }\n});\n\
  ```\n\n在代码段中，`CountryForm` 是要验证的 HTML FORM 元素的 ID，`rules` 和 `messages` 集合中的属性名必须与表单输入元素的\
  \ ID 匹配。你可以参考框架的网站获取有关实际用法和支持的验证表单的更多信息。\n\n验证框架还需要你指定错误消息显示的位置。`errorContainer`、`errorLabelContainer`\
  \ 和 `wrapper` 属性的组合指示了单个消息如何以及何显示。在示例中，错误消息将以 `LI` 元素框的形式出现，并附加到 `validationSummary`\
  \ 元素内的 `UL` 子元素中\n\n最后，`submitHandler` 属性可以用于为验证表单的提交按钮自动注册处理器。换句话说，如果你为表单使用并配置了\
  \ jQuery Validation，你也就省去了为提交按钮附加点击处理器的负担。图 12-9 显示了客户端验证的实际应用。\n\n![Image](img/00095.jpeg)\n\
  \n**图 12-9** 使用 jQuery 进行客户端验证\n\n### 探讨模态表单的优缺点\n\n无论专家和评论家对可用性如何说，事实证明唯一重要的是用户在处理\
  \ HTML 视图时所经历的体验。而体验是由感知组成的。在编辑或深入查看某些信息时，模态表单绝对是一个考虑的选项，而且在某些场景下它们被认为比其他方案更好。通常建议在以下场景中使用模态：\n\
  \n![Image](img/00003.jpeg) 一次性编辑多个输入字段。（这正是上一个示例的场景。）\n\n![Image](img/00003.jpeg)\
  \ 执行单步操作，如预订资源、发布评论或注册信息。（这是前一点的轻微变体。）\n\n![Image](img/00003.jpeg) 为图像、视频或数据列表创建快速预览。\n\
  \n同时，在以下情况下，模态的效果要差得多，甚至会令人反感：\n\n![Image](img/00003.jpeg) 操作结果通知（成功或失败）。如之前所示，可忽略的警报文本要理想得多，如果它在几秒钟后消失，效果更好。\n\
  \n![Image](img/00003.jpeg) 验证消息。（如果内联显示或在单个摘要中显示，会好得多。）\n\n![Image](img/00003.jpeg)\
  \ 对少量数据进行快速且特定的编辑，例如单个字段。\n\n![Image](img/00003.jpeg) 多步向导式操作。\n\n我的个人经验是，模态表单是有帮助的，但即使使用得当，它们也无法将一个可用性差的用户界面变成优秀的用户界面。换句话说，它们有帮助，但绝不是让一个用户界面变得出色的决定性因素。另一方面，如果误用模态弹出窗口，它们真的会降低优秀用户界面的有效性。\n\
  \n此外，我认为模态窗口仅是桌面视图的资源。我不会在移动设备上使用模态屏幕。\n\n\n\n\n\nModernizr（参见 [*http://modernizr.com](http://modernizr.com)*）作为一个特性检测器工作，它可以告诉你当前浏览器是否支持某个特定功能。基于此，你可以实现自己的变通方案（workaround）。这里有一个如何检查浏览器是否支持\
  \ `date` 类型输入字段的快速示例。如果不支持，你将求助于某些日期选择器插件：\n\n点击此处查看代码图像\n\n```javascript\n$(function(){\n\
  \   if(!Modernizr.inputtypes.date) {\n       $(\"#givenInputDateField\").someDatePickerPlugin();\n\
  \   }\n});\n```\n\n坦率地说，在这种特定情况下，我没有看到使用 Modernizr 的意义。其效果是：你会在所有不支持 `date` 输入字段原生支持的浏览器上使用相同的插件，而在那些提供该功能的浏览器上使用略有不同的用户界面。我希望为我的用户提供相同的体验，而目前浏览器之间的差异仍然远超文本输入框的纯图形样式差异。\n\
  \n另一个需要考虑的关键点是日期输入字段支持的自定义程度。根据具体的输入内容，你可能希望限制日期范围，并按月或按年导航。输入出生日期与输入发票日期或预订日期是不同的。虽然\
  \ HTML5 标准定义了一些额外的属性，但我发现插件做得更好，更重要的是，使用插件绕过 Modernizr 可以让所有浏览器上的体验保持一致。\n\n## Bootstrap\
  \ Datepicker\n\n你应该使用哪种插件？多年来，jQuery UI 一直是大多数开发者的首选。今天，Bootstrap 正被越来越多的网站使用，作为创建更佳布局以及最恰当视觉效果的首选工具。Bootstrap\
  \ 本身没有原生的日期选择器组件，但有几个项目支持它。其中一个是 [*http://github.com/eternicode/bootstrap-datepicker](http://github.com/eternicode/bootstrap-datepicker)*，它也可以作为\
  \ NuGet 包（Bootstrap Datepicker）来提供。以下代码段显示了你需要配置的标记和脚本：\n\n点击此处查看代码图像\n\n```html\n\
  <input type=\"text\" id=\"dateofbirth\" name=\"dateofbirth\" contenteditable=\"\
  false\" value=\"@birthDate\">\n\n<script type=\"text/javascript\">\n    $(function\
  \ () {\n        $('#dateofbirth').datepicker({\n            language: 'en',\n  \
  \          startDate: '@startBirthDate',\n            endDate: '@endBirthDate',\n\
  \            pickerPosition: \"bottom-left\",\n            autoClose: true\n   \
  \     });\n    });\n</script>\n```\n\n在 INPUT 标记中，请注意 `contenteditable` 属性被设置为 `false`，这使得字段的内容在用户界面之外是编辑的。同样重要的是，INPUT\
  \ 元素的 `type` 属性被设置为 `text`。\n\n该插件很好地支持本地化，日期格式也反映了这一点。NuGet 包包含许多依赖项，但这是现在为了实现极端自定义所付出的代价。以下是一些示例代码，它将日期范围限制在业务应用程序中出生日期合理的范围内：\n\
  \n点击此处查看代码图像\n\n```javascript\nvar startBirthDate = new DateTime(1915, 1, 1).ToString(\"\
  d\", culture);\nvar endBirthDate = DateTime.Today.AddYears(-5).ToString(\"d\", culture);\n\
  ```\n\n图 12-10 显示了插件的一个（本地化）示例。\n\n![Image](img/00096.jpeg)\n\n**图 12-10** 一个基于\
  \ bootstrap 的日期选择器组件\n\n## 将日期作为纯文本呈现\n\n这是我在一次关于移动 Web 开发模式和实践的会议上从一位著名的移动专家那里听到的：\n\
  \n*用户在移动表单中输入日期的最快方法就是顺序输入数字。DDMMYY 还是其他格式只是一个细节。*\n\n最终，我认为这非常正确。\n\n再次，如果你想或需要构建一个移动优化的视图，你可以关闭任何插件，只需将日期字段声明为数字输入字段。这种方法还会指示操作系统弹出数字键盘。作为进一步步骤，你可能希望对输入的文本进行验证，并尽可能尝试猜测日期。\n\
  \n日期选择器很棒，而且在移动设备上对日期完全支持。然而，以文本形式输入日期仍然是一个选项，这比选择日期更快，尤其是当日期距离现在很远时。\n\n### 使用自动完成代替下拉列表\n\
  \n用户在移动表单中输入日期的最快方法就是顺序输入数字。DDMMYY 还是其他格式只是一个细节。\n\n最终，我认为这非常正确。\n\n再次，如果你想或需要构建一个移动优化的视图，你可以关闭任何插件，只需将日期字段声明为数字输入字段。这种方法还会指示操作系统弹出数字键盘。作为进一步步骤，你可能希望对插入文本进行验证，并尽可能尝试猜测日期。\n\
  \n日期选择器很棒，而且在移动设备上对日期完全支持。然而，以文本形式输入日期仍然是一个选项，这比选择日期更快，尤其是当日期距离现在很远时。\n\n（注：输入文本后半部分包含大量重复/乱码内容。我已经根据“保留正文核心内容”和“删除多余空行”的指令处理了提供的内容。）\n\
  \n用户在移动表单中输入日期的最快方法就是顺序输入数字。DDMMYY 还是其他格式只是一个细节。\n\n最终，我认为这非常正确。\n\n再次，如果你想或需要构建一个移动优化的视图，你可以关闭任何插件，只需将日期字段声明为数字输入字段。这种方法还会指示操作系统弹出数字键盘。作为进一步步骤，你可能希望对插入文本进行验证，并尽可能尝试猜测日期。\n\
  \n日期选择器很棒，而且在移动设备上对日期完全支持。然而，以文本形式输入日期仍然是一个选项，这比选择日期更快，尤其是当日期距离现在很远时。\n\n## 引入 Bootstrap\
  \ Typeahead\n\n如果你计划使用自动完成，最好关闭浏览器的功能：\n\n点击此处查看代码图像\n\n```html\n<input type=\"\
  text\" autocomplete=\"off\" />\n```\n\n接下来，选择你的框架。我最喜欢的是 Typeahead，你可以通过包的形式获取。JavaScript\
  \ 库包含一个压缩文件和一个 CSS 文件。\n\n一旦你运行了 Typeahead，你需要在输入中准备以下内容：\n\n点击此处查看代码图像\n\n```javascript\n\
  $('#country).typeahead(\n    null,\n    {\n        displayKey: 'value',\n      \
  \  source: hints.ttAdapter()\n    }\n);\n```\n\nTypeahead 可以以多种方式从本地和远程源接收提示。我在这里讨论的示例假设你使用远程源。配置中看到的\
  \ `null` 指的是调用的设置。通过传递 `null`，你接受所有默认值。第二个参数定义了组件的行为，并指定了显示值和下拉数据源。\n\n这是一个完整的初始化示例：\n\
  \n点击此处查看代码图像\n\n```javascript\nvar hints = new Bloodhound({\n    datumTokenizer:\
  \ Bloodhound.tokenizers.obj('value'),\n    queryTokenizer: Bloodhound.tokenizers.whitespace,\n\
  \    remote: yourRemoteUrl + \"?query=%QUERY\"\n});\nhints.initialize();\n\n$('#country).typeahead(\n\
  \    null,\n    {\n        displayKey: 'value',\n        source: hints.ttAdapter()\n\
  \    }\n);\n```\n\n\n\n\nBloodhound 是一个为 Typeahead 提供提示（hints）的封装器。它是 Typeahead\
  \ 组合包的一部分。你只需要获取 `Bloodhound` 引擎的实例并将其设置为你选择的远程 URL。这通常是你的 URL，或者一个启用了跨源资源共享（CORS）的外部\
  \ URL。在任何情况下，必须使用 `%QUERY%` 表达式来引用文本框中当前输入的文本。只要远程 URL 返回一个 JSON 集合，且其属性名与分词器提供的字符串类似，并包含\
  \ `displayKey` 属性（示例中为 `value`），你就大功告成了。\n\n#### 将文本框作为下拉列表\n\n为了实现将文本框作为仅接受所选字符串的下拉列表的目标，必须为\
  \ Typeahead 注册更多的事件处理器。其思路是使用一个伴侣的隐藏字段来保存所选元素的唯一 ID，同时在文本框中显示元素的完整名称。接下来，对输入文本的任何编辑都会强制清空缓冲区，直到从列表中新选择一个项为止。\n\
  \n在与刚才所示相同的 `SCRIPT` 块中，你添加以下脚本：\n\n点击此处查看代码图片\n\n```javascript\n$('#country).on('typeahead:selected',\
  \ function (e, datum) {\n    $(\"#country\").attr(\"data-itemselected\", 1);\n \
  \   $(\"#countrycode\").val(datum.id);\n});\n\n$('#country).on('blur', function()\
  \ {\n    var typeaheadItemSelected = $(\"#country\").attr(\"data-itemselected\"\
  );\n    if (typeaheadItemSelected != 1) {\n        $(\"#countrycode\").val(\"\"\
  );\n        $('#country').val(\"\");\n    }\n});\n\n$('#country).on('input', function\
  \ () {\n    var typeaheadItemSelected = $(\"#country\").attr(\"data-itemselected\"\
  );\n    if (typeaheadItemSelected == 1) {\n        $(\"#country\").attr(\"data-itemselected\"\
  , 0);\n        $(\"#countrycode\").val('');\n        $('#queryString').val('');\n\
  \    }\n});\n```\n\n在示例中，伴侣隐藏字段名为 `countrycode`。当 Typeahead 触发 `selected` 事件（即从列表中选取了一个提示）时，伴侣隐藏字段将被设置为该提示的\
  \ `id` 属性。这里的 `id` 名称是任意的；它是你任何用于标识提示的唯一属性。如果是国家/地区列表，它将是国家代码或你可能拥有的任何主键。同时，你向文本框添加了一个动态属性（`data-itemselected`），以标记其包含从提示列表中选取的值。如果用户在未进行选择的情况下离开字段，或仅尝试在字段中输入自由文本，`blur`\
  \ 和 `input` DOM 事件处理器将重置文本框和隐藏字段的内容。（参见图 12-11。）\n\n![图像](img/00097.jpeg)\n\n**图\
  \ 12-11** 使用自动补全模拟下拉列表\n\n#### 关于大型输入表单的其他提示\n\n你曾多少次发现自己陷入了过于庞大且难以处理的输入表单中？作为开发者，你有时需要从用户那里收集大量数据，这是一个问题。但相信我，这对用户来说也是一个问题！我曾听一位\
  \ UX 设计人员说，让一个功能具有高度可用性的最好方法就是让它变得不。我非常赞同。\n\n以下是一些让大型输入表单稍微易用一点的主意：\n\n![图像](img/00003.jpeg)\
  \ 使用标签卡一次仅显示相关的输入字段块。一个全的 `FORM` 元素封装所有标签卡，这样无论你何时保存，无论你在哪个标签页，所有内容都会被保存。\n\n![图像](img/00003.jpeg)\
  \ 让用户能够快速方便地找到保存按钮。对于滚动表单，一种解决方案是在顶部和底部都设置按钮。一个更好的解决方案是让带有保存按钮的工具栏随着表单内容一起滚动。\n\n\
  ![图像](img/00003.jpeg) 为特殊类型的数据（例如，个人资料图片）或密码（例如，重置或更改的密码）提供它们自己的保存按钮。通常，它们是独立于整个记录常规更新执行的特殊操作。\n\
  \n![图像](img/00003.jpeg) 不要害怕使用 JavaScript 按钮在编辑字段中存储常用值。例如，在日期输入字段旁边放置“无日期”按钮，或在密码编辑字段旁边放置“建议随机密码”按钮。\n\
  \n![图像](img/00003.jpeg) 如果可能，实现自动保存功能。\n\n![图像](img/00003.jpeg) 如果可能，考虑对小块数据进行内联编辑。\n\
  \n这是一个快速列表，我可能忘记了其他提示。\n\n### 总结\n\n在 Web 应用程序中编辑数据主要是处理输入表单。在本章中，我主要通过交互模型来处理数据更改。我在章节开头开始谈论身份验证和授权。另一方面，如果不先对用户进行身份验证，你就无法进行任何编辑。我讨论了\
  \ PRG 模式和通过数据注解进行验证。我还花了一些时间介绍并说明了模态表单的优缺点以及使用智能 JavaScript 框架的情况。\n\n*先获取事实，然后你就可以随心所欲扭曲它们。*\n\
  \n*——马克·吐因*\n\n\n\n\n\n我很惊讶地发现，今天 `persistence model`（持久化模型）与 `domain model`（领域模型）之间的明确区别仍然被许多软件专业人员忽视或至少低估了。这种缺乏清晰性的原因之一是，太多声称要说明架构和设计实践的教程，使用的示例过于简单，无法在这些模型之间建立有意义的区分。例如，使用\
  \ Northwind 数据库来构建一个领域驱动设计（DDD）的良好示例完全是胡说乱道。你不能仅仅通过观察一个物理数据库就获得灵感设计出一个有一套自己业务规则的领域模型。同样，你不能仅仅用经典的音乐或电影应用程序来有效展示分层架构的重要性。\n\
  \n在这两种情况下，尽管原因不同，你最终得到的都是一个与物理数据库一一对应的单一数据模型。只要你能够有效实现所需的功能，并且意识到存在各种类型的数据模型，那么在整个技术栈中使用单一模型处理数据并没有什么坏处。\n\
  \n## 持久化模型 (The persistence model)\n\n我经常特意避免完全使用 `data model`（数据模型）这个表词。我觉得它太笼统了，因为它的真实含义往往严格取决于业务背景。如果我需要引用用于在某种持久化存储上读取和保存的数据模型，我更倾向于使用\
  \ `persistence model`（持久化模型）。\n\n为了在脑海中固定一个持久化模型的示例，可以一下 `Entity Framework`。`Entity\
  \ Framework` 从数据库为你推断出的类，或者你指定为 `Code First` 模型的类，仅仅是持久化模型的一部分。这些是用于访问数据库的类。这些类需要与所选的数据库模式一一一对应。尽管在大多数情况下，它们还需要与某些现有的、不可修改的数据库模式一一一对应。\n\
  \n如果你被迫使用一个现有的数据库，你如何声称你为业务背景建模了领域逻辑呢？\n\n到目前为止，我假设数据库是关系型数据库，例如 `Microsoft SQL\
  \ Server`。关系数据库对模型施加了一些限制，而其他类型的数据库——例如 `NoSQL` 数据存储——可能不会施加这些限制。关系数据库受关系模型规则限制，并倾向于对数据进行规范化、避免冗余并倾向于索引和类型约束。而\
  \ `NoSQL` 数据存储只是按其原样保存对象。在这方面，如果你使用 `NoSQL` 后端，持久化模型可能已经是你想要使用的唯一模型了。但是，只要你在关系环境中工作，你就应该将从数据库读取和写入数据库的类视为持久化模型。\n\
  \n持久化模型在系统基础设施之外应该具有多大的可见性？\n\n答案很简单：只要它能运行，你想让多大就有多大。如果你面临的需求允许在比基础设施更高的层级使用同一组类，请务必在那里使用它们。如果需求不允许，不要害怕在通过层级向上移动时创建一个额外的模型。\n\
  \n## 领域模型 (The domain model)\n\n领域驱动设计（DDD）中有一句经常被引用但并不经常被应用的口号是：领域模型中的类必须与数据库结构无关。在大多数情况下，这真的意味着领域层和基础设施层（持久化发生的地方）必须使用不同的类集合。\n\
  \n然而，这种必要性很大程度上取决于所设计的应用程序。如果同一组类可以适配并同时工作于领域层（业务逻辑）和基础设施层（持久化），那么你为什么要为了拥有两个不同的模型而人为地增加复杂性呢？理论上是，每一层可能都需要它自己特定的数据模型，并配有适当的适配器进行相互转换。你最终处理的代码行越少——在不排除或显著损害维护性的前提下——越好！\n\
  \n### 业务规则 (Business rules)\n\n总而言，使用领域模型的核心点是在其内部拥有一包含并暴露业务规则的类。领域模型独特地服务于实现业务规则，并通过表达业务概念、业务数据和行为的类来实现这一目标。\n\
  \n将行为视为领域模型关键部分的关注，是因为领域模型中的类表达了业务关注点和任务。因为这是唯一的关注点，显而易见，领域模型在设计上是完全与数据库无关的。\n\n\
  让领域类和持久化类通过某些适配重合只是一种捷径。它是合法且合理的，但只是条捷径。\n\n### 一个简单的领域建模练习 (A simple domain modeling\
  \ exercise)\n\n想象有人要求你为某项运动创建一个评分系统——仅仅是裁判或记分员用来跟踪比赛进展的那种微小应用：得分、犯规、暂停、节段等等所有这些事情。例如，考虑足球。你对下面这个类有什么看法？\n\
  \n点击此处查看代码图片\n\n```java\npublic class Match\n{\n    public string Team1 { get; set;\
  \ }\n    public string Team2 { get; set; }\n    public int Goals1 { get; set; }\n\
  \    public int Goals2 { get; set; }\n    public int Period { get; set; }\n    public\
  \ MatchState State { get; set; }  /* Scheduled, InProgress, Finished */\n}\n```\n\
  \n它似乎包含了你可能需要的所有内容，而且持久化也非常简单。你可能会想，所选的领域对于设计练习来说太简单了。\n\n当你设计领域模型时，你实际上是在为其他开发者（包括你自己）设计一个\
  \ API。你应该留心只允许那些符合业务规则和领域特征的合法且合规的操作。\n\n以下是对上述代码的简短反对：\n\n![Image](img/00003.jpeg)\
  \ 球数可以随意设置，导致 -3 到 400 万都是有效分数。\n\n![Image](img/00003.jpeg) 可以随意设置，导致任何人都可以分配非法值。\n\
  \n![Image](img/00003.jpeg) `MatchState` 枚举很好，但它需要一种状态机。例如，只有已安排的比赛可以取 `InProgress`\
  \ 值，且该值不能恢复。\n\n![Image](img/00003.jpeg) 进球属性只有在比赛进行期间才能设置。\n\n你可能会反对说，这些问题都是你在独立组件中处理的业务规则。这完全没有问题，而且最终，这就是我们至少\
  \ 15 年设计系统的方式。然而，在这种情况下，你不需要领域模型。你只需要数据传输对象（DTO）在规则组件之间移动数据。\n\n### 重写练习答案 (Rewriting\
  \ the solution to the exercise)\n\n另一种方法是有像 `Match` 这样的领域模型类来整合业务规则。这种设计方法的首要结果是你不想要可设置的属性——你只想要与业务动作匹配的方法，并在内部验证状态以确保其与业务一致。\n\
  \n这是 `Match` 类的另一个草稿：\n\n点击此处查看代码图片\n\n```java\npublic class Match\n{\n    // 读取状态\n\
  \    public string Team1 { get; private set; }\n    public string Team2 { get; private\
  \ set; }\n    public int Goals1 { get; private set; }\n    public int Goals2 { get;\
  \ private set; }\n    public int Period { get; private set; }\n    public MatchState\
  \ State { get; private set; }  /* Scheduled, InProgress, Finished }\n\n    // 行为（带有业务规则）\n\
  \    public Match(string team1, string team2) { ... }\n}\n```\n\n\n\n\n\n```csharp\n\
  public Match Start() { ... }\n\npublic Match Finish() { ... }\n\npublic Match StartPeriod()\
  \ { ... }\n\npublic Match EndPeriod() { ... }\n\npublic Match Goal1() { ... }\n\n\
  public Match Goal2() { ... }\n\n...\n\n}\n```\n\n列出的方法并非仅仅只读公共属性的隐式 setter（设置器）。它们现在完全遵循业务规则。例如，请看\
  \ `Goal1` 方法：\n\n点击此处查看代码图片\n\n```csharp\npublic Match Goal1()\n{\n    if (!IsInProgress())\n\
  \        throw new ArgumentException(\"Can't score a goal if match is not in progress\"\
  );\n\n    Goals1 ++;\n}\n```\n\n### 输入模型 (The input model)\n\n如果该方法看起来仍然像一个 setter，请考虑你可能需要访问多个属性来验证规则，并且考虑到我在第\
  \ 1 章中讨论的“通用语言”（Ubiquitous Language）模式，“进行彻底的领域分析”，方法的命名至关重要。\n\n输入模型和视图模型似乎是同一件事，而且大多数时候，它们的实现方式就像是同一物一样。由于一画胜胜千言言，我将使用图\
  \ 13-1 来回顾你在第 5 章中遇到过的插图。\n\n![Image](img/00098.jpeg)\n\n**图 13-1** 描述输入和输出显示界面的数据\n\
  \n视图模型和输入模型共同描述了输入和输出显示界面的数据流。在 ASP.NET MVC 中，输入模型与控制器（controller）周围的绑定层有关。输入模型是所有用于接收从\
  \ HTML 表单提交或 Ajax 调用接收数据的类的并集。相反，视图模型是所有包含要在 Razor 视图中消耗数据的类的并集。\n\n输入模型位于架构的最顶端，在现实中永远与领域模型（domain-model）或持久化模型（persistence-model）类没有任何关联。请注意，缺乏关联并不意味着使用与被持久化的相同类来收集数据是错误的。这并没有错：它只是不切合实际。如果你在现实生活中真的遇到了这种情况，那么，恭喜你了！\n\
  \n### 视图模型 (The view model)\n\n在实际编码时，输入模型和视图模型通常是同一组类。它们共同代表并表达了用户对应用程序及其必须执行的任务的感知。\n\
  \n在 ASP.NET MVC 中，视图模型和输入模型经常重合，这也是因为具有强大服务器后端的 Web 应用特殊特殊。当你执行控制器操作后生成 HTML 响应时，你将所有要在用户看到的下一个视图中的数据封装到一个视图模型对象中。但在视图在浏览器中渲染并呈现给用户的同时，视图中的某些\
  \ HTML 元素变成了输入元素。随后，同一个类恰好同时成为输入模型和视图模型的一部分。这对于用于渲染 HTML 表单的视图模型来说尤其如此。这里有一个说明性示例：\n\
  \n点击此处查看代码图片\n\n```csharp\n[HttpPost]\n[ActionName(\"login\")]\npublic ActionResult\
  \ LoginPost(LoginInputModel input, string returnUrl)\n{\n    // Validate credentials\n\
  \    ...\n    // Redirect (PRG pattern)\n    return RedirectToAction(\"login\");\n\
  }\n\n[HttpGet]\n[ActionName(\"login\")]\npublic ActionResult LoginGet(string returnUrl)\n\
  {\n    var model = new LoginViewModel() {ReturnUrl = returnUrl};\n    return View(model);\n\
  }\n```\n\n`LoginViewModel` 类用于准备和初始化登录 HTML 表单。当登录表单被提交时，相同的内容会以 ASP.NET MVC 绑定层创建的\
  \ `LoginInputModel` 类实例的形式重新呈现给系统。\n\n这里没有正当理由不尝试使用同一个物理类。然而，输入模型和视图模型在概念上是不同的模型。\n\
  \n图 13-2 总结了在分层架构背景下，每种类型的数据模型的作用，正如我在第 5 章中完整描绘的那样。此处在图中添加的循环箭头标示了转换适配器（adapters）的存在，用于将一种模型转换为另一种。\n\
  \n![Image](img/00099.jpeg)\n\n**图 13-2** 分层架构背景下的数据模型类型\n\n### 设计持久化层 (Designing\
  \ a persistence layer)\n\n在第 10 章中，“ASP.NET MVC 项目组织”，我展示了与图 13-3 所示相同的图表。\n\n![Image](img/00100.jpeg)\n\
  \n**图 13-3** 在分层架构中识别持久化层\n\n持久化是基础设施层的职责之一，通常实现为持有实际存储引用的独立程序集（assembly）。\n\n持久化层中持久化的形状和颜色主要取决于你对\
  \ API 的约束（例如 RDBMS、技能、预算、策略）。其次，它取决于你作为架构师对应用上层推广的愿景。\n\n#### 使用隐式数据模型\n\n我将介绍的第一个场景是相对过时的持久化设计方法。在这里，你没有由特定数据类组成的显式数据模型；相反，你使用通用数据容器来移动数据。\n\
  \n我之所以称这种方法为过时，仅仅是因为它追溯到十年前，那是 ASP.NET 2.0 辉煌年代的产物。今天大部分生产系统是在 2000 年代初创建或经过深度重构的。你通常不会因为发布新版本就触碰生产系统。你通常只会围绕新的业务需求更改。有时这需要进行深度更改，但大多数情况下，更改会被现有架构吸收。\n\
  \n**注意**\n\n参加我的课程并向我寻求帮助的大多数人属于一个特定类别：运行在老旧但有效的系统上的公司。这些系统有些是在 15 年或更早之前的，部分部分仍在\
  \ Microsoft Visual Basic 6 和 ASP.NET Web Forms。\n\n#### 遗留数据模型的动机\n\n当你尝试演进此类遗留系统时，你无法在短短几个月内通过用新系统替换旧系统来实现。没有公司可以合理地负担这样做并承担停止或严重限制业务以安装新生产软件的风险。\n\
  \n**总结**\n\n在这样的遗留背景下，允许更改的最后一个标记是数据库。你可以扩展它，或者可能引入多种存储技术（多语言持久化方法），但你仍然需要在持久化层中有一个隐式数据模型。\n\
  \n\n\n\n十年前，ADO.NET——.NET Framework 中第一个数据访问 API——引入了泛型数据容器对象，如 `DataSet` 和 `DataTable`。尽管最近从零开始构建的应用没有严格的业务理由来使用它们，但它们仍然存在于\
  \ .NET Framework 中。`DataSet` 对象诞生于成功的 ADO `Recordset` 对象的灰烬中，它们并不推送任何显式的数据模型。它们只是灵活地适应你底层的任何数据库架构。`DataSet`\
  \ 以及数据读取器等伴随对象可能是你的持久化层与存储层交换的某种“通货”。原生的 ADO.NET API，或者更易用的 Enterprise Library Data\
  \ Access Application Block 被用于读写数据。\n\n坦率地说，当你只需要持久化地写入数据时，使用像 `DataSet` 对象这样的泛型内存容器对于命令来说并不是什么大问题。你从上层接收到需要存储的数据，并必须将其适配到存储格式。在这种背景下，`DataSet`\
  \ 模型与任何其他对象模型没有区别。衡量这一选择有效性的唯一良好标准就是性能。\n\n### LINQ-to-DataSet\n\n对于读取栈，情况要稍微微妙一些。以\
  \ `DataSet` 对象形式获取的数据可能对于展示目的并不理想。`DataSet` 模型反映了存储模型；而展示层很可能不是。为了解决这个问题，引入了 LINQ\
  \ 的一种特殊且很少使用的变体——`LINQ-to-DataSet`。\n\n你可以对 `DataSet` 和 `DataTable` 对象内部的内容使用强大的\
  \ LINQ 查询语法，并方便地将数据提取到更灵活的 C# 类中。这是一个示例：\n\n点击此处查看代码\n\n```csharp\n// ds 是你通过某种方式获得的\
  \ DataSet 对象。例如，通过 ADO.NET\n\nvar customers = ds.Tables[0].AsEnumerable();\n\nvar\
  \ orders = ds.Tables[1].AsEnumerable();\n\nvar data = from o in orders\n       \
  \    join c in customers\n           on o.Field<string>(\"CustomerID\")\n      \
  \     equals c.Field<string>(\"CustomerID\")\n           where o.Field<DateTime>(\"\
  OrderDate\").Year == 1998 &&\n                 o.Field<DateTime>(\"OrderDate\").Month\
  \ == 1 &&\n                 o.Field<DateTime>(\"OrderDate\").Day < 10\n        \
  \   select new QuickOrderListItem {\n               OrderID=o.Field<int>(\"OrderID\"\
  ),\n               Company=c.Field<string>(\"CompanyName\")\n           };\n```\n\
  \n通过某种方式获取的 `DataSet` 构建了一个新的数据传输对象（类 `QuickOrderListItem`），这最可能是通过之前的 ADO.NET 查询或存储过程调用实现的。\n\
  \n当你重构旧系统时，这种方法的优势是显而易见的。你维护了现有的数据访问核心（无论基于存储过程还是直接数据库访问），并且仍然可以将架构的其他部分向命令查询职责分离\
  \ (CQRS) 和更现代的设计模式演进。\n\n### 使用 Entity Framework\n\n尽管听起来可能很刺耳，我认为 Entity Framework\
  \ 既不是天生就具有，也不是为了构建强大且定义良好的个性而增长。它是一个像 .NET 领域中流行的 NHibernate 那样简单的对象/关系映射 (O/RM)\
  \ 工具吗？它还是一个在你尝试表示业务领域时，创建持久化对象模型的更具野心的工具？名称中的 `Framework` 一词让我更倾向于第二种选择，我与微软开发者和产品推销者许多对话的记忆也是如此。\n\
  \n事实是，在版本 6 之前，Entity Framework 是一个具有成为领域建模工具隐含野心的 O/RM。该工具本身并不坏，它执行持久化工作非常好，很好地融入了大多数业务场景。\n\
  \n我看到的真正问题在于 Entity Framework 的营销，它模糊了领域模型和持久化模型之间的区别。作为架构师，你可能实际上认为在你正在工作的系统中，单一模型就足够了，但你可能没有看到两者之间的概念差异是阴险的。\n\
  \n### 业务领域建模是架构师的任务\n\n正如本章早期章节“领域模型”中所讨论的，建模业务领域是一项完全抽象了数据库考虑的努力。这种努力建立在在类中编写业务规则的意愿之上。此类类最终代表了业务领域中的实体和任务。\n\
  \n\n\n\n另一种解释 Entity Framework 中 `DbContext` 对象作用的良好方法是，称它充当工作单元模式（Unit-of-Work\
  \ pattern）的实现。工作单元模式指的是一种编程上下文，它持有参与到业务事务中涉及的所有对象的引用。从概念上讲，一个工作单元表达了与数据库事务相同的理念，只是它旨在在更高层次的抽象上进行操作。（如需了解更多信息，你可能想查看\
  \ *[`martinfowler.com/eaaCatalog/unitOfWork.html`](http://martinfowler.com/eaaCatalog/unitOfWork.html)*。）\n\
  \n* * *\n\nO/ORM（对象关系映射器）的设计初衷是保护开发者不受 SQL 编程复杂性的影响，并解决类与记录之间的不匹配。`DbContext` 的公共接口由数据容器组成，这些容器代表了物理数据容器（如数据库表）的内存代理。通过对此类接口的成员进行操作，你可以随心所欲地限制消费者的操作。考虑这里显示的两个类：\n\
  \n点击此处查看代码图片\n\n```csharp\npublic class ApplicationDbContext : DbContext\n{\n  \
  \  public ApplicationDbContext()\n        : base(\"SomeConnectionString\")\n   \
  \ {\n    }\n    public virtual DbSet<Order> Orders { get; set; }\n    public virtual\
  \ DbSet<Product> Products { get; set; }\n}\n\npublic class Database : IDisposable\n\
  {\n    private readonly ApplicationDbContext _context = new ApplicationDbContext();\n\
  \    public IQueryable<Order> Orders\n    {\n        get { return _context.Orders;\
  \ }\n    }\n    public void Dispose()\n    {\n        _context.Dispose();\n    }\n\
  ```\n\n第一个类是规范的 `DbContext` 类，代表了绑定到架构的指定连接字符串的任何访问 `ApplicationDbContext` 实例的操作。第二个类是一个只读封装，它完全封装了规范的\
  \ `DbContext` 类——相同的 `ApplicationDbContext` 类——并仅通过 `IQueryable` 接口暴露子集：\n\n点击此处查看代码图片\n\
  \n```csharp\nusing (var db = new Database())\n{\n    // db 实例上没有可用的 SaveChanges\
  \ 方法。\n    // Database 是底层数据库的只读上下文。\n}\n```\n\n通过围绕 `DbContext` 对象创建封装，你可以将数据库的部分暴露给代码的不同部分。\n\
  \n* * *\n\n![图片](img/00006.jpeg) 重要\n\n通过这种方式通过多个 `DbContext` 对象暴露的数据库部分有时被称为*边界上下文（bounded\
  \ contexts）*。在我看来，这太牵强。在 DDD（领域驱动设计）中，边界上下文是一个与领域相关的业务概念。正因为如此，它与数据库的设计和结构完全无关。我在这里看到了访问的相同理念，但我认为使用“边界上下文”一词只会引起混淆。更糟糕的是，在软件架构敏感的部分产生混淆是非常昂贵的。\n\
  \n* * *\n\n### Code First\n\nEntity Framework Code First 是你使用的一种功能，用于以代码为中心的方法来处理数据库的代码。本质上，它使用一组（可配置的）约定来确定模型中类的理想数据库。Code\
  \ First 主要用于新数据库，但当模型发生变化时，它支持迁移包来更新物理数据库。\n\nCode First 的方法将成为 Entity Framework\
  \ 7 以及 ASP.NET Core 1.0 之后新一代框架的主流。\n\n#### Code First 的真实目的是什么？\n\n业界有一种共识认为 Code\
  \ First 在 DDD 中是有用的。论点是，你应该关注更好地表达业务领域的类，而不是先创建数据库再匹配类。正如我在书的第一部分主要在第 1 章中解释的那样，DDD\
  \ 主要关于发现领域的行为。因此，DDD 方法可能会让你使用像本章之前讨论的第二个 `Match` 类来描述比赛。\n\n由于业务限制，该类没有可写属性，也不应该有。对于\
  \ O/RM 来说，自动填充该类的实例是非常问题的。Code First 可能是创建持久化模型的最佳方式；领域模型（以及 DDD）是完全不同的东西。\n\n*\
  \ * *\n\n![图片](img/00004.jpeg) 注意\n\n我想指出，Code First 是编程创建数据库以及轻松编写在启动时创建自己数据库程序的优秀工具。\n\
  \n#### 仓库模式（Repository pattern）\n\n今天，持久化层传统上使用仓库模式实现。*仓库*是一个类，其中每个方法都代表围绕数据源的一个操作。关于仓库模式及其优缺点有大量的文献。总结来说，我的观点是，编写仓库层没有显而错误的方法。最坏的情况下，你会得到几层透传代码，它们为了所谓的清晰度而浪费了\
  \ CPU 周期。\n\n#### 仓库是一个介于领域层和负责持久化的底层层之间的组件，并使用类似集合的接口访问领域对象。（查看 *[`martinfowler.com/eaaCatalog/repository.html`](http://martinfowler.com/eaaCatalog/repository.html)*。）这个定义似乎与大多数\
  \ O/RM 框架暴露的根对象的公共接口非常匹配——例如 Entity Framework 的 `DbContext` 对象。\n\n简而言之，仓库类提供了从数据存储读取和写入的基本原子工具。它使用特定的数据访问技术或多种技术（如\
  \ Entity Framework、NHibernate、ADO.NET 和类似产品）执行数据访问。（参见图 13-5。）\n\n![图片](img/00102.jpeg)\n\
  \n**图 13-5** 作为持久化层实现的仓库\n\n##### 仓库类的消费者\n\n仓库类有许多方式被消费，取决于你已有的其余架构。从应用层调用仓库是可以接受的。如果你在领域层实现了领域逻辑，仓库可能会被视为主要的领域服务类型。如图图\
  \ 13-5 所示，仓库是业务逻辑（无论是应用逻辑还是领域逻辑）与存储之间的接口层。\n\n\n\n\n\n![Image](img/00006.jpeg) 重要提示\n\
  \n无论模式名称是什么，这里最重要的成就是：将数据访问逻辑隔离在一个封闭的黑盒中，无论出于什么原因，它都易于替换：数据存储的更改或仅仅是不同的持久化算法。你可以以任何喜欢的方式引用这一层。只要你在项目中有一个地方专门处理连接字符串，名称其实并不重要。\n\
  \n***\n\n## 我最喜欢的存储库实现方式\n\n正如我之前提到的，我不认为在业务逻辑和存储层之间编写此类数据访问代码有任何显而易见的错误。无论如何，我猜你可能好奇知道我是如何操作的。\n\
  \n以下是我的核心规则：\n\n![Image](img/00003.jpeg) 将数据访问 API 的细节（连接字符串、`DbContext` 和配置）封装在存储库类中，使得上层只知道可以执行哪些读/写操作。\n\
  \n![Image](img/00003.jpeg) 为业务领域中的每个重要实体（或可能的实体组）创建一个存储库类。在 DDD 术语中，*重要实体*（significant\
  \ entity）被称为*聚合*（aggregate）。\n\n![Image](img/00003.jpeg) 最好为每个存储库类提供面向任务的接口。这意味着提供从业务角度看具有原子性的读和写方法。通常情况下，我看到的是存储库层面的原子行为，如\
  \ `Save`、`Delete` 和 `Get`。\n\n![Image](img/00003.jpeg) 如果你有长时间运行的任务以及跨越数据存储边界的事务，请考虑适配存储库接口，以便多个数据库操作可以在同一个\
  \ `DbContext` 之下发生。\n\n为了更好地理解这一点，请查看以下代码片段：点击查看代码\n\n```csharp\npublic class OrderRepository\
  \ : IOrderRepository\n{\n    protected ApplicationDbContext _database;\n\n    public\
  \ OrderRepository()\n    {\n        _database = new ApplicationDbContext();\n  \
  \  }\n\n    public void Save(Order order)\n    {\n        _database.Orders.Add(order);\n\
  \    }\n\n    public void Commit()\n    {\n        _database.SaveChanges();\n  \
  \  }\n\n    ...\n}\n```\n\n当你这样编写代码时，存储库对于业务操作是原子的。你可以在同一个事务中运行多个操作，但不能将订单和产品组合在同一个事务中。如果这对你至关重要，只需将外部的\
  \ `DbContext` 注入到存储库中。\n\n## 多语言持久化 (Polyglot Persistence)\n\n认为现在在某些场景下关系模型不再那么理想并不是荒谬的。这种情况可能比很多人想象的要少，受影响的应用也少得多。然而，当你目光投向关系模型之外时，似乎唯一的替代方案是使用这里的\
  \ NoSQL 数据库。\n\n在我看来，这里的重点不是简单地抛弃关系存储并用 NoSQL 产品取代它们。重点在于理解系统的机制以及所用数据的特征。基于此制定最佳架构和数据存储解决方案。\n\
  \n多语言持久化指的是为系统的每一层甚至每个操作使用最合适的存储技术。\n\n### 多语言持久化的示例\n\n随着社交网络的出现，多语言持久化进入了舞台。你能想象当有人赞了朋友发布的帖子时，更新索引以保证数十亿\
  \ Facebook 用户数据库的一性和持久性意味着什么吗？在处理社交网络时，这并不是一个问题；事实上，已经发现了不同的方法，导致了我们今天所说的*多语言持久化*。\n\
  \n### 处理多样化信息\n\n让我们回顾用于说明多语言持久化的经典示例：一个电子商务系统。在这样的系统中，你可能需要保存以下信息：\n\n![Image](img/00003.jpeg)\
  \ 客户、订单、付款、发货以及所有与业务交易相关的信息。\n\n![Image](img/00003.jpeg) 用户在浏览产品目录或在他们的交易之上运行业务智能时发现的偏好。\n\
  \n![Image](img/00003.jpeg) 代表发票的文档、帮助用户找到最近实体店的地图、路线、图片、配送收据等。\n\n![Image](img/00003.jpeg)\
  \ 任何用户活动的详细日志；用户查看、购买、评论、评价或喜欢的的产品。\n\n![Image](img/00003.jpeg) 购买了相同和相似产品的用户图谱、相似产品、用户可能感兴趣的产品以及同一地理区域的用户。\n\
  \n将任何信息保存到关系数据库中无疑是，并且是脑海中第一个出现的选项。此外，如果根据政策必须选择单一数据库技术，我敢说关系数据库仍然是推荐选项。但让我们看看持久化中的“多语言”意味着什么。\n\
  \n#### 多语言持久化的经典示例\n\n多语言持久化由混合各种存储并为每种类型的信息选择正确的存储组成：\n\n![Image](img/00003.jpeg)\
  \ 你可以将客户和订单存储到 SQL Server 数据存储中，并通过 `Entity Framework` 或任何其他 ORM 框架访问这些信息。特别是 Entity\
  \ Framework 还可以透明地访问 Azure SQL Database 实例。\n\n![Image](img/00003.jpeg) 用户偏好可以进入\
  \ Azure 表存储，并通过消费 JSON 终端的临时层进行访问。\n\n![Image](img/00003.jpeg) 文档可以进入 `RavenDB`\
  \ 或 `MongoDB` 等文档数据库，并通过专用的 .NET API 进行消费。\n\n![Image](img/00003.jpeg) 用户历史可以保存到如\
  \ `Cassandra` 等列存储中。`Cassandra` 的独特之处在于它将键值与数量变化的键值对相关联。妙的是，存储在 `Cassandra` 中的任何行都可以与其他记录具有完全不同的结构。这种效果类似于拥有一个键值字典，其值是键值对的集合。\n\
  \n![Image](img/00003.jpeg) 层级信息可以存储在图数据库中。今天极佳的选择是 `Neo4j`，你可以通过 .NET 客户端对其进行访问和编码。层级数据库的问题不在于如何访问它，而在于如何组织、创建和维护它。\n\
  \n多语言持久化的总成本有时可能不容忽视。在大多数情况下，你最终是在与易于使用的 .NET 客户端工作。但当涉及大量数据并出现性能问题时，需要异化的技能，而且技能短缺或文档缺失是常态而非例外。\n\
  \n\n\n\n\n对于一个拥有强大 SQL Server 技能的组织来说，转换管理员和 DBA 技能可能是一个问题，而且至少会非常耗时。即使你聘佣了新人，他们也必须是各自领域的真正专家，并且需要时间来熟悉系统及其可能的复杂之处。此外，你掌握的语言越多样化（polyglot），你可能需要招聘的人就越多，或者至少你需要获取的技能就越多。\n\
  \n最后，你永远不知道当使用真实数据（不仅仅是测试数据）时，系统在生产环境中会有什么反应。现有的知识库和案例研究可能会丢失。你可能会合理地预期客户支持的效率会降低。\n\
  \n### 需要考虑的点\n\n为了评估成本并做出信息丰富的权衡，这里有一份需要考虑的点列表。该视角是一个考虑 NoSQL 解决方案的 SQL Server 用户企业：\n\
  \n![Image](img/00003.jpeg) 你用于完成常用任务的工具\n\n![Image](img/00003.jpeg) 已安装数据库的维护\n\n\
  ![Image](img/00003.jpeg) 已安装数据库的自定义\n\n表 13-1、表 13-2 和 表 13-3 使用 `RavenDB` 作为 NoSQL\
  \ 家族的代表。我建议你将以下几点作为问题的示例，但需要进一步调查，以了解它们如何适用于你的特定场景。此外，这些表格中讨论的观点和特征指的是产品的快照，在你阅读这些内容时，它们可能已经演变并改进。\n\
  \n![Image](img/00103.jpeg)\n\n**表 13-1** 工具比较\n\n![Image](img/00104.jpeg)\n\n**表\
  \ 13-2** 维护操作比较\n\n![Image](img/00105.jpeg)\n\n**表 13-3** 自定义选项比较\n\n***\n\n###\
  \ CQRS 语境下的多语言持久化\n\n`CQRS` 最基本的形式是使用由命令栈和查询栈共享的单一数据库。然而，`CQRS` 的之处在于你可以单独优化每个堆栈。在这方面，你可以优化每个堆栈，使其仅使用最适合的数据库技术。\n\
  \n因此，更复杂的 `CQRS` 形式可以实现多语言持久化。命令栈专注于所发生事件的纯存储，在此过程中，它可以使用 `NoSQL` 或更可能的事件存储（event\
  \ store）来将状态仅作为事件序列进行保存。\n\n同时，查询栈可以基于 `RDBMS`，其表与命令栈同步，并提供易于查询和展示的现成数据。如果命令栈以事件的形式保存数据，那么同步就是重放事件并构建数据自定义投影（projection）以将其保存到关系模式中的问题。\n\
  \n`CQRS` 架构与多语言持久化的结合，对于必须保证高性能同时随时准备扩展（即使是突然扩展）的系统来说，是一种强大的解决方案。\n\n***\n\n###\
  \ 总结\n\n没有任何应用程序是不需要读取和或写入数据的。这些任务由持久化层执行，理想情况下，它是应用程序中唯一已知并管理连接字符串和 URL 的地方。持久化层是架构中一个较小且简单的部分，但它与系统其他部分的关系至关重要。\n\
  \n在这个示例中尝试传达的关键点是澄清持久化模型——你通过 `O/RM` 工具的服务从数据库读取和写入数据的类集合——与领域模型——即你定义的镜像系统逻辑和业务核心任务的类集合之间的区别。\n\
  \n无论你在设计分层系统时做出何种实际选择，理解这些差异对于成为架构师来说至关重要。\n\n# 第三部分：用户体验\n\n**第 14 章** 创建更具交互性的视图\n\
  \n**第 15 章** 响应式设计的优缺点\n\n**第 16 章** 让网站适应移动设备\n\n## 第 14 章 创建更具交互性的视图\n\n*没有什么能比回到一个保持不变的地方去发现你自己已经对其所作的改变。*\n\
  \n*—纳尔逊·曼德拉*\n\n自从 `HTML` 作为标记语言诞生以来，网页内容一直具有交互性。今天的痛点不在于将托管在不同来源上的相关内容连接起来，而是让产生的体验对用户来说尽可能顺畅和快速。我最喜欢的用户体验定义表达了这个概念：*用户在与你的视图交互时经历的体验*。\n\
  \n在过去的十年里，网页视图变得相当臃肿和笨重，填充了大量的图形、图像、视频和广告。此外，移动端继承的只需滚动更多内容的观点导致了页面变得越来越长，在单个视图中包含内容，而这种视图在几年前只会被拆分成多个页面。\n\
  \n在 2000 年代第一个十年的中期，`Ajax`（现在看来很奇怪的术语 *Asynchronous JavaScript and XML* 的缩写）出现，成为必不可少的技术，用于刷新视图的部分而不完全刷新它，也不需要重新加载视图及其周围的大量内容。\n\
  \n`Ajax` 最初设计用于处理 `XML`，但最终它与 `JSON`（JavaScript 对象表示法）工作得有效得多。`JSON` 是一种语言无关的文本格式，它通过约定来传输任何数据。对于\
  \ Web 开发者，特别是 ASP.NET 开发者来说，挑战在于找到最有效的方法来提供和消费 `JSON`。\n\n![Image](img/00003.jpeg)\
  \ 展示内容的基础\n\n![Image](img/00003.jpeg) 从远程数据源获取数据\n\n![Image](img/00003.jpeg) 注入当前视图的数据技术\n\
  \n![Image](img/00003.jpeg) 将远程数据推送到客户端\n\n本章涵盖了这些点。\n\n### 暴露 JSON\n\n我在第 8 章中介绍过“ASP.NET\
  \ MVC 核心”，一个通过控制器暴露 `JSON` 内容的短代码段。这是在 ASP.NET 内部暴露 `JSON` 内容的最简单方法。通常，你可以使用 HTTP\
  \ 处理程序甚至 Web Forms ASPX 页面来返回 `JSON` 数据。任何可以通过 HTTP 请求访问的代码都可以配置为返回 `JSON` 响应。\n\
  \n`JSON` 是纯文本，但不是自由文本。典型的 `JSON` 负载是根据某些规则创建的服务器对象序列化的结果。`JSON` 的妙处在于，所有类型的浏览器都可以将序列化文本转换为的\
  \ JavaScript 对象。要将 HTTP 响应标记为 `JSON` 内容，你需要使用 `application/json` MIME 类型。关于 `JSON`\
  \ 及其语法的更多信息，可以参考 [`www.json.org`](http://www.json.org)。\n\n在 Microsoft .NET 框架中，有两个流行的库可以处理\
  \ `JSON` 数据。一个是位于 `System.Web.Extensions.dll` 程序集的 `JavaScriptSerializer` 类。另一个是\
  \ `JSON.NET`，你可以在 [`www.newsoft.com/json`](http://www.newsoft.com/json) 找到或通过 NuGet\
  \ 安装。\n\n#### 创建 JSON 端点\n\n任何控制器方法都可以返回 `JSON`。它只需要获取 `JSON` 内容并将其传递给系统的操作调用器以完成请求。图\
  \ 14-1 显示了协作工作处理 ASP.NET 请求的高级部分。该图还解释了当系统被调用返回 HTML 或 `JSON` 时不同的行为。\n\n\n\n\n\n\
  **图 14-1** 返回 HTML 或 JSON 的控制器方法的变体行为\n\n### Json 助手方法\n\n所有控制器方法都要求返回一个继承自 `ActionResult`\
  \ 的类型。特别是，控制器方法可以写为返回 `JsonResult`，它只是一个继承并扩展了 `ActionResult` 的更具体的类。可以通过 `Json`\
  \ 助手方法创建 `JsonResult` 实例。\n\n这里是一个示例控制器类，它包含一个返回 JSON 数据的方法。它使用应用程序服务来获取数据，然后将获取的数据序列化为\
  \ JSON。\n\n点击此处查看代码图片\n\n```csharp\npublic class JsonController : Controller\n{\n\
  \    private readonly CountryService _countryService = new CountryService();\n\n\
  \    public JsonResult Countries([Bind(Prefix=\"q\")] string initial=\"\")\n   \
  \ {\n        var model = _countryService.GetCountryListViewModel(initial);\n   \
  \     return Json(model, JsonRequestBehavior.AllowGet);\n    }\n}\n```\n\n根据这段代码，你现在可以将浏览器指向（例如）`/json/countries?q=H`，并获取英文名称以\
  \ `H` 开头的国家/地区列表。你收到的数据的内容类型是 JSON，如 图 14-2（使用 Fiddler ）所示。\n\n![Image](img/00107.jpeg)\n\
  \n**图 14-2** 示例 JSON URL 的响应头\n\n### JSON 劫持可能性\n\n`Json` 方法接受任何 .NET 对象并尝试将其序列化为字符串。第二个参数——来自\
  \ `JsonRequestBehavior` 枚举类型的的值——指示 ASP.NET MVC 是否应该通过 HTTP GET 方法返回 JSON 数据。注意，默认情况下，ASP.NET\
  \ MVC 不通过 HTTP GET 请求返回任何 JSON 数据。这是一项安全措施，旨在减少你落入某些 JSON 劫持攻击的概率。（参见 [`haacked.com/archive/2009/06/25/json-hijacking.aspx`](http://haacked.com/archive/2009/06/25/json-hijacking.aspx)。）\n\
  \n事实上，类型为 `JsonRequestBehavior` 的额外参数并不能从任何方面保护你免受像 JSON 劫持这类可能的钓鱼攻击。然而，它的作用是引起你注意正在通过普通的\
  \ GET 暴露 JSON 数据这一事实。如果你的数据是敏感的，你想增加访问难度，请将请求限制为 HTTP POST 或非 HTTP GET 动。\n\n此外，请注意只有当原始对象的全部或部分使用数组序列化为\
  \ JSON 时，JSON 劫持才可能影响你。\n\n### JsonResult 类内部\n\n`Json` 方法只是封装在 `JsonResult` 类构造函数周围的一句句法糖。该方法在内部创建一个\
  \ `JsonResult` 类的全新实例，并将其交给操作调用器以实际生成响应。\n\n`JsonResult` 类扩展了基类 `ActionResult` 并带有两个属性：`MaxJsonLength`\
  \ 和 `RecursionLimit`。前面的属性表示控制器可能返回的 JSON 数据最大量。后一个属性指的是被序列化对象结构中允许的最大嵌套层数。它们都是\
  \ `JsonResult` 类的可空整数属性。\n\n`JsonResult` 类的内部实现使用 `JavaScriptSerializer` 实例来执行将\
  \ .NET 对象转换为 JSON 字符串的实际工作。当使用 `Json` 方法创建 `JsonResult` 类的实例时，没有为 `MaxJsonLength`\
  \ 和 `RecursionLimit` 分配特定值。因此，这两个属性都采用默认值：最大长度为 2 MB，嵌套层数为 100 层。\n\n尽管 100 层嵌套在实际上已经足够，但\
  \ 2 MB 的限制有时可能会命中你并在控制器级别抛出异常。让我们看看如何调整控制器代码，以确保在序列化 JSON 数据时永远不会引发长度异常。\n\n直接调用\
  \ `JsonResult` 构造函数可以让你对可用属性有更多的控制。通过这种方式，你可以轻松地将设置传递给内部的 `JavaScriptSerializer`\
  \ 实例：\n\n点击此处查看代码图片\n\n```csharp\npublic JsonResult Countries([Bind(Prefix=\"q\"\
  )] string initial=\"\")\n{\n    var model = _countryService.GetCountryListViewModel(initial);\n\
  \    return new JsonResult\n    {\n        MaxJsonLength = Int32.MaxValue,\n   \
  \     Data = model,\n        ContentEncoding = Encoding.UTF8,\n        JsonRequestBehavior\
  \ = JsonRequestBehavior.AllowGet\n    };\n}\n```\n\n另一种方法是使用你喜好的序列化器（无论是 `JavaScriptSerializer`\
  \ 或 JSON.NET）自己执行序列化：\n\n点击此处查看代码图片\n\n```csharp\nvar serializer = new JavaScriptSerializer\
  \ {MaxJsonLength = Int32.MaxValue };\nvar result = new {\n    Content = serializer.Serialize(model),\n\
  \    ContentType = \"application/json\"\n};\n```\n\n#### 内容协商\n\n尽管重点主要在 JSON 上，但你可能需要适应一些客户端。内容协商（negotiate\
  \ content）的能力是 ASP.NET MVC 的优势之一。然而，在普通的控制器中，提供 JSON 或 XML 并不是问题。这里是一些代码：\n\n```csharp\n\
  public ActionResult Countries([Bind(Prefix=\"q\")] string initial = \"\", [Bind(Prefix=\"\
  x\")] bool format = false)\n{\n    var model = _countryService.GetCountryListViewModel(initial);\n\
  \    if (format)\n    {\n        return Content(new XmlFormatter().Serialize(model),\
  \ \"text/xml\");\n    }\n    return new JsonResult\n    {\n        MaxJsonLength\
  \ = Int32.MaxValue,\n        Data = model,\n        ContentEncoding = Encoding.UTF8,\n\
  \        JsonRequestBehavior = JsonRequestBehavior.AllowGet\n    };\n}\n```\n\n\
  XML 格式化器是一个自定义类，可以按照你喜欢序列化 XML。这里有一个示例：\n\n点击此处查看代码图片\n\n```csharp\npublic string\
  \ Serialize(object data)\n{\n    var list = data as IList<Country>;\n    if (list\
  \ == null)\n        return String.Empty;\n    var builder = new StringBuilder();\n\
  \    builder.AppendLine(\"<?xml version=\\\"1.0\\\" encoding=\\\"utf-8\\\"?>\");\n\
  \    builder.AppendLine(\"<countries>\");\n    foreach (var c in list)\n    {\n\
  \        builder.AppendFormat(\"<country>\");\n        builder.AppendFormat(\"<name>{0}</name>\"\
  , c.CountryName);\n        builder.AppendFormat(\"<capital>{0}</capital>\", c.Capital);\n\
  \        builder.AppendFormat(\"<continent>{0}</continent>\", c.Continent);\n  \
  \      builder.AppendFormat(\"</country>\");\n    }\n    builder.AppendLine(\"</countries>\"\
  );\n    return builder.ToString();\n}\n```\n\n这里的 XML 序列化器不是通用的，但根据我的经验，这正是目的所在。今天，JSON\
  \ 在大多数情况下都有效，而当你需要 XML 时，是因为你需要某种通用 XML 序列化器无法产生的临时 架构。\n\n#### 解决跨源谜题\n\n正如你所知，浏览器会对直接处理的\
  \ JavaScript 调用应用同源策略（Same-Origin Policy）。这条规则是相对新的，其目的是将恶意用户的攻击面减少到几乎为零。此类限制的最终结果是你被禁止向与请求页面不同域的网站发送\
  \ Ajax 调用。\n\nJSON 填充（JSONP）和跨源资源共享（CORS）是解决问题的两种方法。它们的实现方式以及范围也不同。\n\n\n\n\n\n\
  * *\n\n![Image](img/00004.jpeg) 注意\n\n除了 `JSONP` 和 `CORS`，你还可以通过使用其中一个控制器作为访问所目标远程服务器的代理，来绕过同源策略的限制。代理方法非常有效，但缺点是需要在外部跨源端点与同服务器端点之间建立一一对应的映射。如果你只有一两个端点，这不是问题；但如果你有很多端点，这就会产生大量的开发开销。\n\
  \n* *\n\n### 使用 JSONP\n\n奇怪的是，浏览器会控制 Ajax 调用和 JSON 数据，但它们仍然让你完全自由地处理图像和脚本元素。无论你在\
  \ `IMG` 或 `SCRIPT` 元素中使用任何 URL，只要它是可访问的，就能顺利地下载。`JSONP` 协议的背后是 `SCRIPT` 元素的巧妙用法，可以利用它从显式允许的站点通过\
  \ Ajax 安全地下载 JSON 数据。让我们来看看在你的网站中应该做什么，以便允许来自任何站点的调用者访问公共 JSON 端点。\n\n该技巧的在于返回封装在脚本函数调用中的\
  \ JSON 内容。换句话说，当你使用这种技巧时，网站不再简单地返回纯 JSON 数据，而是返回以下字符串：\n\n点击此处查看代码图片\n\n```javascript\n\
  yourFunction(\"{plain JSON data}\");\n```\n\n在客户端，如果满足以下两个条件，你就可以调用 `JSONP` 端点：\n\
  \n![Image](img/00003.jpeg) 你知道服务器用于封装 JSON 数据的脚本函数名，并且在你的客户端页面定义了该函数。\n\n![Image](img/00003.jpeg)\
  \ 你在 `SCRIPT` 元素内部放置该调用。\n\n从 `SCRIPT` 标签内部调用网站 URL 后，浏览器会接收到一个看起来像带有固定输入字符串的普通函数调用。由于任何下载的脚本都会立即执行，因此你的本地\
  \ JavaScript 函数就有机会处理 JSON 数据。\n\n`JSONP` 端点会有文档说明，且文档中明确说明了用于封装任何返回的 JSON 数据的函数名称。以下是重写为支持\
  \ `JSONP` 的上一个端点：\n\n点击此处查看代码图片\n\n```csharp\npublic JsonpResult CountriesP([Bind(Prefix\
  \ = \"q\")] string initial = \"\")\n{\n    var model = _countryService.GetCountryListViewModel(initial);\n\
  \    return new JsonpResult()\n    {\n        MaxJsonLength = Int32.MaxValue,\n\
  \        Data = model,\n        ContentEncoding = Encoding.UTF8,\n        JsonRequestBehavior\
  \ = JsonRequestBehavior.AllowGet\n    };\n}\n```\n\n如你所见，唯一的区别是使用了 `JsonpResult`\
  \ 而不是 `JsonResult`。`JsonpResult` 类是一个扩展了原生 `JsonResult` 的自定义类，并将返回的 JSON 字符串封装在对指定\
  \ JavaScript 函数的中：\n\n点击此处查看代码图片\n\n```csharp\npublic class JsonpResult : JsonResult\n\
  {\n    private const String JsonpFunctionName = \"callback\";\n    public override\
  \ void ExecuteResult(ControllerContext context)\n    {\n        if (context == null)\n\
  \            throw new ArgumentNullException(\"context\");\n        if ((JsonRequestBehavior\
  \ == JsonRequestBehavior.DenyGet) &&\n            String.Equals(context.HttpContext.Request.HttpMethod,\
  \ \"GET\"))\n            throw new InvalidOperationException();\n        var response\
  \ = context.HttpContext.Response;\n        if (!String.IsNullOrEmpty(ContentType))\n\
  \            response.ContentType = ContentType;\n        else\n            response.ContentType\
  \ = \"application/json\";\n        if (ContentEncoding != null)\n            response.ContentEncoding\
  \ = this.ContentEncoding;\n        if (Data != null)\n        {\n            //\
  \ 为了简洁起见，省略了逻辑\n        }\n    }\n}\n```\n\n\n\n\n\n请注意，所有这些逻辑都在浏览器对 `XMLHttpRequest`\
  \ 对象的实现内部。浏览器通常无法处理多个源，因此任何覆盖此类场景的进一步逻辑都必须在服务器端实现。客户端的部分就到此为止——让我们看看服务器端为了启用 CORS\
  \ 需要什么。\n\nCORS 涉及添加响应标头。在 ASP.NET MVC 的 JSON 端点中，你可以使用操作过滤器（action filter）或像这里显示的一行代码来完成此任务：\n\
  \n点击此处查看代码图像\n\n```\nResponse.AddHeader(\"Access-Control-Allow-Origin\", \"*\");\n\
  ```\n\n更好的是，你可能想将 `*` 替换为请求源的 URL。此代码可以放在每个控制器方法中，并变得稍微复杂一些：\n\n```c\nvar origin\
  \ = Request.Headers[\"Origin\"];\n\nif (String.IsNullOrWhiteSpace(origin))\n   \
  \ return;\n\nif (Request.IsLocal || IsKnownOrigin(origin))\n{\n    Response.AddHeader(\"\
  Access-Control-Allow-Origin\", origin);\n}\n```\n\n占位符 `IsKnownOrigin` 可以简单地检查指定的\
  \ URL 是否属于某些已知且允许的站点集合。\n\n从 Internet Information Services 7 (IIS 7) 开始，你甚至可以使用配置文件的部分来实现相同的目标（但你限于选择所有站点或仅选择一个特定站点）：\n\
  \n点击此处查看代码图像\n\n```xml\n<system.webServer>\n  <httpProtocol>\n    <customHeaders>\n\
  \      <add name=\"Access-Control-Allow-Origin\" value=\"*\" />\n    </customHeaders>\n\
  \  </httpProtocol>\n</system.webServer>\n```\n\n最后，注意你还可以控制允许请求的 HTTP 动词。额外的标头是\
  \ `Access-Control-Allow-Methods`。可以通过逗号分隔来指定多个 HTTP 动词。有关 CORS 的更多信息，请参考 `[`developer.mozilla.org/en-US/docs/Web/HTTP/Access_control_CORS`](https://developer.mozilla.org/en-US/docs/Web/HTTP/Access_control_CORS)`。\n\
  \n## 设计 Web API\n\nASP.NET Web API 是一个专门设计用于支持和简化构建 HTTP 服务的框架，这些服务可以被各种客户端（特别是\
  \ HTML 页面和移动应用程序）消费。你可以使用 Web API 构建 RESTful 和远程过程调用（RPC）风格的 HTTP 服务。它交叉了 ASP.NET\
  \ MVC 的各个方面，如路由、安全、控制器和扩展性。同时，它也有一些纯 ASP.NET MVC 不直接支持的特定领域。\n\n***\n\n![Image](img/00006.jpeg)\
  \ 重要\n\n在 ASP.NET Core 1.0 之前，尽管 Web API 和 ASP.NET MVC 的类名相似且整体架构相似，但使用的是不同的运行时环境。在\
  \ ASP.NET Core 1.0 中，运行时环境将是相同的，事实上，任何对 ASP.NET MVC 和 Web API 的使用都变成了一个东西。在 ASP.NET\
  \ Core 1.0 中，将只有一种控制器类，其行为合并了 ASP.NET MVC 控制器和 Web API 控制器的特性。\n\n***\n\n### ASP.NET\
  \ Web API 的目的\n\n当世界意识到 Web 服务的力量时，一种标准协议很快被制定出来，并成为 Web 服务与调用者之间交换的货币。该协议是 `SOAP`，`Simple\
  \ Object Access Protocol` 的缩写。在此基础上，许多更深入的规范也正在进行中，统称为 `WS-* 协议`。\n\nWindows Communication\
  \ Foundation (WCF) 最初的构想是为了在各种传输层上支持 SOAP 和 `WS-*`，包括 TCP、微软消息队列 (MSMQ)、命名管道以及最后但至关重要的\
  \ HTTP。\n\n显而易见，尽管使用 WCF 有明确的动机和理由，但开发者很大程度上是将其用作通往 HTTP 端点的捷径。这导致了 WCF 基础设施需要更有效地支持非\
  \ SOAP 服务，并使其能够通过 HTTP 服务的纯 XML、文本和 JSON。多年来，我们首先拥有来自 WCF 团队的 `webHttpBinding` 绑定机制，然后是如\
  \ REST 启动器包之类的附加框架。\n\n归结底，这本质上是提供一些语法糖，以便于人们接受将 HTTP 仅作为传输层的这一“药丸”。WCF 之上的 HTTP\
  \ 功能并没有消除开发者面临的真实阻碍，例如臭名昭著的 WCF 配置过度、特性的过度使用，以及其结构并非专门为可测试性而设计。\n\n关键变化是将多传输服务与纯\
  \ HTTP 服务分离开，并移除 WCF 的所有重型设备，从而为 HTTP 服务创建一个轻量且以 HTTP 为核心的框架。这就是 Web API。\n\n***\n\
  \n![Image](img/00006.jpeg) 重要\n\n随着服务的重心从 WCF 转移，是否意味着 WCF 是一项已经没有现实应用的的死掉技术？当然，并不是。当你真正需要暴露一个可以通过\
  \ HTTP 以外的协议调用的服务时，WCF 是唯一的重大选择。当你真正需要安全和事务性等高级功能时，WCF 仍然是一个关键解决方案。\n\n***\n\n###\
  \ ASP.NET MVC 背景下的 Web API\n\n正如你到目前为止看到的，在 ASP.NET MVC 中，你只能通过添加新的控制器或特定方法来获得 HTTP\
  \ 服务。你为什么要看其他的？Web API 框架依赖于一个与 ASP.NET MVC 完全不同的运行时环境。这主要是为了让非 ASP.NET MVC 应用程序（例如\
  \ Web Forms）能够使用 Web API。显然，该运行时环境很大程度上受到了 ASP.NET MVC 的启发。总的来说，它看起来更简单、更直接，因为它预期只提供\
  \ JSON，而不是标记。\n\n从 ASP.NET 开发者的角度来看，以下三点总结了 Web API 相比 ASP.NET MVC 的优势：\n\n![Image](img/00003.jpeg)\
  \ **代码与结果序列化的分离**：这意味着 Web API 控制器只需要从方法返回数据，无需处理结果的序列化。\n\n![Image](img/00003.jpeg)\
  \ **内容协商**：一组名为格式化器（formatters）的新组件负责返回给请求设备的数据序列化。有趣的是，格式化器根据传入请求的 `Accept` 标头自动选择。提供了内置的\
  \ XML 和 JSON 格式化器；替换只是简单的配置问题。此功能简化了以多种格式返回相同原始数据（通常是 XML 和 JSON）的方法。\n\n![Image](img/00003.jpeg)\
  \ **在 IIS 之外托管**：在某种程度上，内容协商也是可以在纯 ASP.NET MVC 中完成的任务。然而，如果你选择在 ASP.NET MVC 应用程序中实现\
  \ HTTP 服务，你将被限制使用 IIS 作为服务器。换句话说，你的 API 不能在其他地方托管。这是因为 ASP.NET MVC 固有绑定到 IIS，因为它最初被设计为\
  \ Web 应用程序的框架。相反，Web API 不需要 IIS，你可以在自己的主机进程（例如 Windows 服务或控制台应用程序）中进行自托管。（这一方面也就是为什么\
  \ Web API 服务与 WCF 服务非常相似。）\n\n在 ASP.NET MVC 应用程序中使用 Web API 并没有真正增加编程能力。因此，我认为 Web\
  \ API 在以下两种情况下真正成为值得考虑的选择：\n\n![Image](img/00003.jpeg) 你需要在非 ASP.NET MVC 应用程序（例如\
  \ Web Forms 或桌面应用程序）内部需要一层 Web 服务。\n\n\n\n\n\n![Image](img/00003.jpeg) 你需要一个位于面向服务的架构中并仅提供内容的独立服务。该服务可以托管在\
  \ `IIS` 中且不提供用户界面，也可以托管在 Windows 服务或控制台应用程序中。\n\n如果你确实需要一个 API——当你有多个客户端并在业务对消费者（B2C）和企业对企业（B2B）场景下运行时，你通常需要\
  \ API——那么你可能会面临额外的问题，例如版本控制和授权。如果你确实需要 API，`ASP.NET Web API` 是极佳的选择。如果你只是需要从同一个用户界面或移动应用程序中使用某些\
  \ JSON，你可能可以轻松地避免在中间放置 Web API 带来的额外成本。\n\n在 `ASP.NET Core 1.0` 中，`ASP.NET MVC`\
  \ 和 Web API 将没有区别。\n\n## 保护独立的 Web API\n\n保护 应用程序比保护 Web API 模块更简单，原因只有一个：需要考虑的情况较少。`ASP.NET\
  \ MVC` 应用面向最终用户；因此，安全性主要意味着验证用户身份，并确保每个经过身份验证的用户只能看到其有权执行的操作。\n\n当涉及到 Web API 时，还有其他场景需要考虑。Web\
  \ API 模块只是一个为第三方开发者编写的 API。你将如何控制客户端是已知且经过授权的呢？让我们回顾几个场景和方法。\n\n### 宿主机负责安全性\n\n\
  Web API 模块最简单但不一定最常见的场景是 API 和宿主机由同一个团队管理。在这种情况下，宿主机负责验证用户身份，并避免显示任何可能调用 API 的用户界面。\n\
  \n因此，Web API 假设任何身份验证发生在宿主机中——例如，在 `IIS` 中通过 HTTP 模块（无论是内置模块还是自定义模块）。为了解决这种场景，你在\
  \ API 控制器类或单个方法上使用 `Authorize` 特性。这与你在纯 `ASP.NET MVC` 应用中遇到的场景几乎相同。\n\n### 使用 Basic\
  \ 验证\n\n除了宿主机提供身份验证和授权规则的情况外，关键在于在 Web API 模块中引入安全层。简单的方法是利用 Web 服务器内置的 Basic 验证（基础认证）。Basic\
  \ 验证的基础是：用户凭据封装在每一个请求中。\n\nBasic 验证有优缺点。它受主流浏览器支持；它是一个互联网标准；而且配置简单。缺点是凭据会随每次请求发送，更糟糕的是，它们是以明文发送的。\n\
  \nBasic 验证期望凭据被发送到服务器进行验证。只有当凭据有效时，请求才会被接受。如果请求中没有凭据，会显示交互式对话框。实际上，Basic 验证还需要一个自定义\
  \ HTTP 模块将凭据与存储在某些自定义数据库中的账户进行比对。\n\n* * *\n\n![Image](img/00004.jpeg) 注意\n\n如果\
  \ Basic 验证与执行凭据自定义验证的层相结合，它是简单且非常有效的。为了克服凭据以明文发送的局限性，你应该始终在 `HTTPS` 上实现 Basic 验证解决方案。\n\
  \n* * *\n\n### 使用访问令牌\n\n其理念是 Web API 接收一个访问令牌（通常是 GUID 或字母数字字符串）——对其进行验证，如果令牌未过期且对应用程序有效，则处理请求。发放令牌的方法有多种，随之还有不同的安全解决方案。\n\
  \n令牌最简单的场景是：当客户联系你使用你的 API 时，离线发放令牌。你创建令牌并与特定客户关联。从现在起，客户将对滥用或误用 API 负责。\n\nWeb\
  \ API 后端需要一个检查令牌的层。该层可以作为普通代码添加到任何方法中，或者更好，是配置为消息处理器（message handler）。在 Web API\
  \ 中，消息处理器是一个检查 HTTP 请求并在请求上设置 `principal` 的组件，这样 `ApiController` 上的 `User` 属性就可以被正确填充。\n\
  \n### 使用 OAuth\n\n一个复杂得场景是使用 `OAuth` 验证来限制对 Web API 模块的访问。在第 6 章 “ASP.NET 领先技术”讨论如何使用\
  \ Facebook 或 Twitter 验证网站用户时介绍过 `OAuth`。这里的重点是将你的 Web API 模块转换为类似于 Twitter 或 Facebook\
  \ 的 `OAuth` 服务器。\n\n最后，`OAuth` 是刚才讨论的令牌场景的变体。区别在于你需要一个独立的组件，在检查用户凭据后在线发放令牌。授权服务器在受保护的资源（Web\
  \ API）和潜在客户之间进行调解。图 14-3 显示了典型的 `OAuth` 会话布局。\n\n![Image](img/00108.jpeg)\n\n**图\
  \ 14-3** 客户端与 Web API 服务器之间典型的 OAuth 握手\n\n在实践中你如何编写代码？\n\n这主要取决于你，但它可能需要一个作为授权服务器的\
  \ Web 后端。它将根据经过验证的用户提供的凭据（如 Facebook）发放访问令牌。接下来，你希望在 Web API 层有一个消息处理器来处理令牌并设置主体以实际授权调用。在消息处理器中，你还可以引入任何你认为值得的机制来使令牌失效——过期、误用，或者因为调用者超过了配额。\n\
  \n\n\n\n\n```javascript\nvar xhr;\n\nif (window.XMLHttpRequest) {\n    xhr = new\
  \ XMLHttpRequest();\n} else { // 为了比 IE7 更旧的浏览器后兼容\n    xhttp = new ActiveXObject(\"\
  Microsoft.XMLHTTP\");\n}\n```\n\n值得好奇的是，尽管微软“发明”了 Ajax 的底层机制，但在 Internet Explorer\
  \ 7 之前，它仍然是以 `ActiveX` 对象的形式在 Internet Explorer 中编写的。而在那时，所有其他浏览器都提供相同的功能，且无需启用\
  \ ActiveX 支持。\n\n### 发送 HTTP 请求\n\n`XMLHttpRequest` 对象是一个代理，你在显示 Web 视图中的 JavaScript\
  \ 代码通过它建立连接并与 HTTP 监听器交换数据。准备请求和发送请求是两个不同的操作。你使用 `open` 方法准备请求，并使用 `send` 方法发送请求：\n\
  \n```javascript\nxhr.open(\"GET\", url);\nxhr.send();\n```\n\n`open` 的第一个参数是 HTTP\
  \ 动词（verb），第二个参数是目标 URL。你还可以指定第三个参数，指示请求必须同步处理还是异步处理。如果你希望它相对于页面的其余代码是异步的，请将该参数设置为\
  \ `true`：\n\n```javascript\nxhr.open(\"GET\", url, true);\n```\n\n要发送表单数据，你通常使用\
  \ `POST` 并需要设置额外的头部，如下所示：\n\n点击此处查看代码图片\n\n```javascript\nxhr.open(\"POST\", url);\n\
  xhr.setRequestHeader(\"Content-type\", \"application/x-www-form-urlencoded\");\n\
  xhr.send(\"firstname=Dino&lastname=Esposito\");\n```\n\n在 POST 请求的情况下，`send` 方法还会接收一个表示正在被发布数据的字符串。\n\
  \n### 处理 HTTP 响应\n\n当请求同步发送时，你可以在调用 `send` 方法后立即编写处理响应的代码。`responseText` 属性可以提供整个响应正体：\n\
  \n点击此处查看代码图片\n\n```javascript\nxhr.open(\"GET\", url, false);\nxhr.send();\nconsole.log(xhr.responseText);\n\
  ```\n\n请注意，默认情况下 `XMLHttpRequest` 调用是异步的。通常情况下，只有当这种方式能带来其他难以实现的真实收益时，你才应该同步调用。\n\
  \n然而，在异步调用的情况下，你的脚本代码必须等待直到完全接收响应：\n\n点击此处查看代码图片\n\n```javascript\nxhr.onreadystatechange\
  \ = function() {\n    if (xhr.readyState == 4 && xhr.status == 200) {\n        //\
  \ 安全地访问 xhr.responseText;\n    }\n}\nxhttp.open(\"GET\", url, true);  // 可以省略 true\n\
  xhttp.send();\n```\n\n你为 `onreadystatechange` 事件注册了一个处理程序，当响应准备就绪，你的代码就会被调用。你的处理程序也有机会监控调用的中间状态。当\
  \ `readyState` 属性等于 4 时，调用成功完成。`status` 属性反映了 HTTP 状态码。在成功的情况下，它被设置为 200。\n\n###\
  \ 正确解释“成功”状态码\n\n请注意，从服务器接收到 HTTP 200 状态码并不意味着你尝试的操作成功了。如果服务器端操作导致了（例如）一个未处理的异常，你会得到\
  \ HTTP 500 状态。同样，如果找不到 URL，你可能会得到 HTTP 404；如果请求未授权，你可能会得到 HTTP 401。\n\n有两种需要仔细考虑的场景。一种是服务器检测到请求存在某些问题，并在成功的网络操作上下文中返回了错误消息。事实上，将网络层面和应用层面分离是非常重要的。你通过\
  \ `XMLHttpRequest` 获取的状态码始终指的是网络操作的成功或失败。\n\n另一个有趣的场景是 CORS。当你向外部网站发送 JavaScript\
  \ 调用时，大多数情况下网络操作是成功的，但框架会将其作为错误返回。（参见图 14-4。）\n\n![Image](img/00109.jpeg)\n\n**图\
  \ 14-4** 一个在应用层面失败的 CORS 请求，尽管它在网络层面可能仍然是成功的\n\n### jQuery 工具\n\n在大多数情况下，开发者使用 jQuery\
  \ 局设施而不是 `XMLHttpRequest` 对象来发送 Ajax 调用。jQuery 库封装了浏览器基础设施，并提供了更好的编程体验。\n\n####\
  \ $$.ajax$ 函数\n\njQuery 中 Ajax 的核心元素是 `$.ajax` 函数，它对指定的端点执行异步调用。该函数接受两个参数——URL 和设置（settings），并返回一个封装了用于实际调用的底层\
  \ `XMLHttpRequest` 对象的对象。这个对象就是 `jqXHR`：\n\n```javascript\n$.ajax( url [, settings\
  \ ] )\n```\n\n设置列表很长，主要包括 `type`、`data` 和 `dataType` 属性。这些属性允许你设置 HTTP 动词、发送到服务器的数据以及调用期望从服务器接收的数据类型。有关更多信息，请参考\
  \ *[`api.jquery.com/jquery.ajax`](http://api.jquery.com/jquery.ajax)*。\n\n为了捕获 Ajax\
  \ 调用的响应，你可以使用 `done`、`fail` 和 `always`，这些是定义在 `jqXHR` 上的。在成功的情况下会调用 `done` 函数；在发生错误时会调用\
  \ `fail`；在操作完成时会调用 `always`：\n\n```javascript\n$.ajax({...}).done(function(response,\
  \ textStatus) {\n    // 成功\n}).fail(function(xhr, textStatus) {\n    // 错误\n});\n\
  ```\n\n```javascript\n$(function() {\n    $(\"#button\").on(\"click\", function()\
  \ {\n        var query = $(\"#query\").val();\n        var url = \"http://expoware.org/geo/all?q=\"\
  \ + query;\n        $.ajax({\n            url: url\n        }).done(function(json)\
  \ {\n            var buffer = \"<table class='condensed'>\";\n            buffer\
  \ += \"<thead><th>Name</th><th>Capital</th><th>Continent</th></thead>\";\n     \
  \       for (var index in json.Countries) {\n                var country = json.Countries[index];\n\
  \                buffer += \"<tr>\";\n                buffer += \"<td>\" + country.CountryName\
  \ + \"</td>\";\n                buffer += \"<td>\" + country.Capital + \"</td>\"\
  ;\n                buffer += \"<td>\" + country.Continent + \"</td>\";\n       \
  \         buffer += \"</tr>\";\n            }\n            buffer += \"</table>\"\
  ;\n            $(\"#output\").html(buffer);\n        });\n    });\n});\n```\n\n\n\
  \n\n\n![Image](img/00111.jpeg)\n\n## 表 14-1 jQuery Ajax 简写函数\n\n另一个有趣的简写函数示例是 `load`。（参见\
  \ [`api.jquery.com/load`](http://api.jquery.com/load).。）该函数从服务器加载 HTML 数据并将其插入到与选择器匹配的\
  \ DOM 元素中。这是一个示例：\n\n```\n$(\"#content\").load(url);\n```\n\n请求通常以 GET 方式发送，但如果你将数据作为函数的第二个参数传递，就会变成\
  \ POST。\n\n### Ajax 与缓存\n\n始终倾向于使用核心 `$.ajax` 函数而不是各种简写方法的原因之一是，通过使用 `$.ajax` 函数，你可以始终控制缓存。你可以指定的设置之一是\
  \ `cache`，它接受一个布尔值：\n\n点击此处查看代码图片\n\n```javascript\n$.ajax({\n    url: \"http://...\"\
  ,\n    type: \"GET\",\n    cache: false\n}).done(function(response) {\n    // 更新当前页面\n\
  \    ...\n});\n```\n\n默认情况下，`cache` 设置为 `true`，这意味着缓存是开启的，如果指定 URL 的响应仍在浏览器缓存中，则不会尝试检索更新的内容。影响所有未指定特定设置请求的默认缓存状态是通过\
  \ `$.ajaxSetup` 方法设置的。默认情况下，所有 Ajax 调用都启用了缓存。\n\n请注意，jQuery 本身实际上并没有执行任何缓存。当你在 Ajax\
  \ 请求上禁用缓存时，jQuery 所做的只是使用标头和额外的查询字符串值来防止浏览器或中间的任何代理返回它们可能拥有的任何未过期响应。\n\n缓存并不是什么问题，对于相对静态数据的普通\
  \ GET 请求来说，它确实是一个很棒的功能。如果你对不断变化的资源开启缓存，例如在某些后台应用程序的范围内，你只是在编辑数据记录，这可能会成为某些问题的根源。\n\
  \n***\n\n![Image](img/00004.jpeg) 注意\n\n当我使用一个提供通过模态窗口编辑记录的应用时，我理解了在 jQuery 境下缓存设置是多么关键。该模态窗口通过\
  \ jQuery 获取数据以初始化输入字段。第一次运行时一切都很完美，我编辑了记录并保存了。我甚至收到了一条成功消息。但一秒钟后当我尝试对同一条记录进行第二次更新时，我再次打开模态窗口，发现所有输入字段的设置就像第一次更新没有生效一样。底层数据库是没问题的；这是客户端过度缓存的副作用。\n\
  \n***\n\n### 将数据绑定到当前 DOM\n\n将成功的 Ajax 调用指向有效且设计良好的端点仅仅是构建更具交互性的 Web 应用程序的第一步。一个不容忽视的问题是如何刷新在浏览器中渲染的现有内容，以反映最新下载的数据。\n\
  \n#### 直接绑定\n\n浏览器为当前渲染的内容暴露了文档对象模型 (DOM)。这使得 JavaScript 代码能够即时编辑内容，从而显著提高用户体验。然而，更新\
  \ DOM 可能容易，也可能困难，这取决于下载数据的结构。其中一类是更新字符串或数字。而更新网格或在浏览器中也与大量标记混合在一起的某些数据的表示则是完全另一回事。\n\
  \n如果你收到的数据可以简单地附加到由 ID 标识的特定位置，你在 `$.ajax` 调用的 `done` 处理程序中需要做的就是如下所示：\n\n点击此处查看代码图片\n\
  \n```javascript\n$(\"#position\").html(freshData);\n```\n\n你可以根据需要并在整个文档中重复执行许多类似的调用。你可以使用各种类型的\
  \ jQuery 和 DOM 方法，并将新值设为 HTML 或纯文本。\n\n然而，通常情况下，你会发起一个远程调用来获取一组数据，并必须将其作为网格或在分级布局中显示。jQuery\
  \ 或任何其他框架都无法为你变这种魔法。最终，你下载的数据必须与所需的布局合并，并将最终结果插入 DOM 中：\n\n点击此处查看代码图片\n\n```javascript\n\
  // 准备标记\nvar buffer = \"<table class='table table-condensed'>\";\nbuffer += \"<thead><th>Name</th><th>Capital</th><th>Continent</th></thead>\"\
  ;\nfor (var index in json.Countries) {\n    var country = json.Countries[index];\n\
  \    buffer += \"<tr>\";\n    buffer += \"<td>\" + country.CountryName + \"</td>\"\
  ;\n    buffer += \"<td>\" + country.Capital + \"</td>\";\n    buffer += \"<td>\"\
  \ + country.Continent + \"</td>\";\n    buffer += \"</tr>\";\n}\nbuffer += \"</table>\"\
  ;\n// 显示\n$(\"#output\").html(buffer);\n```\n\n合并下载的数据和布局是一个通过程序化创建 HTML 字符串的问题。你可以像这里这样手动编写代码来实现。或者你可以从某些\
  \ JavaScript 模板库获得支持。\n\n#### JavaScript 模板库\n\n客户端数据绑定是单页应用中常见但微妙的方面，通常对于任何在在 JSON\
  \ 数据上运行的 JavaScript 密集型前端也是如此。当 ASP.NET MVC 服务器准备视图时，数据绑定在服务器端的 Razor 模板中完成。当纯数据下载到客户端时，必须通过拼接构建\
  \ HTML 字符串是可能的，但并不是可靠且易维护的方法。\n\n结果是过去几年中出现了各种基于 JavaScript 模板的数据绑定库，具有不同程度的编程力和易用性。Knockout\
  \ 是流行且强大的库之一。更多信息请参见 [`knockoutjs.com`](http://knockoutjs.com)。另一个可行的选择是 `mustache.js`，尽管它的功能没有\
  \ Knockout 丰富。然而，`mustache.js` 的占用更小，经过压缩化和 Gzip 压缩后，它仅占下载量的 10 KB。（参见 [`github.com/janl/mustache.js`](https://github.com/janl/mustache.js)。）\n\
  \n所有的客户端数据绑定库都获取填充了占位符的模板并从模型注入数据。`mustache.js` 与更流行更大的库（如 Knockout 和 AngularJS\
  \ 的数据绑定模块）之间的区别在于，`mustache.js` 要求模板作为独立的元素嵌入在 `SCRIPT` 标签中。其他库会在你想注入实际内容的页面主体查找模板。\n\
  \n`mustache.js` 模板采用如下形式：\n\n点击此处查看代码图片\n\n```html\n<script id=\"country-template\"\
  \ type=\"text/template\">\n    <table class=\"table table-condensed\">\n       \
  \ <thead>\n            <th>Name</th>\n            <th>Capital</th>\n           \
  \ <th>Continent</th>\n        </thead>\n        {{#Countries}}\n            <tr>\n\
  \                <td>{{CountryName}}</td>\n                <td>{{Capital}}</td>\n\
  \                <td>{{Continent}}</td>\n            </tr>\n        {{/Countries}}\n\
  \        {{^Countries}}\n            No countries found\n        {{/Countries}}\n\
  \    </table>\n</script>\n```\n\n数据占位符遵循 `{{ ... }}` 模式。双大括号中的名称引用作用域内最近的对象的属性。每个模板都绑定到代表根数据上下文的\
  \ JavaScript 对象。例如，`Countries` 应该是程序化绑定对象的属性。像 `{{CountryName}}` 这样的占位符引用迭代器数据元素的\
  \ `CountryName` 属性。\n\n\n\n\n属性名前前的 `#` 符号告诉运行时遍历该属性的内容，该属性被预期为某种类型的集合。最后，`^` 符号用于标识当该属性（预期为集合）为空时要显示的内容。要在模板上激活\
  \ `mustache.js`，您需要以下代码：\n\n点击此处查看代码图片\n\n```javascript\n$(function() {\n    $(\"\
  #btnFinder\").on(\"click\", function () {\n        var initial = $(\"#initial\"\
  ).val();\n        $.ajax({\n            url: \"/json/countries?q=\" + initial,\n\
  \            cache: false\n        }).done(function(json) {\n            var dataTemplate\
  \ = $(\"#country-template\").html();\n            $(\"#output\").html(Mustache.to_html(dataTemplate,\
  \ json));\n        });\n    });\n})\n```\n\n该代码首先在按钮上注册了一个点击处理程序。当按钮被点击时，它从输入字段收集首字母，准备\
  \ URL，并通过 Ajax 调用它获取 JSON 数据。最后，它获取 mustache.js 模板作为字符串并在 JSON 数据上对其进行求值。（参见图 14-6。）\n\
  \n![Image](img/00112.jpeg)\n\n**图 14-6**  mustache.js 模板的效果\n\n## 将内容推送到客户端\n\n\
  到目前为止，你是从用户从某些服务器环境拉取信息的角度来看交互式 Web 内容的。交互的另一端是通知从服务器推送到客户端。\n\n当我说“推送通知”时，你可能会立即想到，当某处发生了你声明感兴趣的事情时，信息会在你的移动设备上异步显示。推送通知仅表达了一个抽象概念，指的是在服务器上检测到并以某种方式通知的某些信息。它并没有说明该功能的实际实现。\n\
  \n事实证明，推送通知通常是客户端根据与服务器约定，定期在某些预定义位置检查新数据的结果。然而，无论网络层面的实现细节如何，已经开发了一个与 ASP.NET 相关的框架来简化从服务器到客户端的通知。它的名字是\
  \ `ASP.NET SignalR`。\n\n具体来说，ASP.NET SignalR 处理的场景包括监控服务器端任务的进度，或者在服务器端操作成功完成后刷新用户界面的多个部分。\n\
  \n### 快速了解 ASP.NET SignalR\n\n使用 SignalR 的第一步是从 NuGet 安装包。ASP.NET SignalR 包含客户端和服务器部分。客户端作为\
  \ jQuery 插件提供。服务器部分由一组程序集组成。其中一个二进制文件是 `OWIN` 库，用于启动和配置 SignalR。因此，首先您要在项目中创建一个名为\
  \ `startup.cs` 的文件：\n\n点击此处查看代码图片\n\n```csharp\nusing Microsoft.Owin;\nusing Owin;\n\
  [assembly: OwinStartup(typeof(YourProject.Startup))]\n\nnamespace YourProject\n\
  {\n    public class Startup\n    {\n        public void Configuration(IAppBuilder\
  \ app)\n        {\n            app.MapSignalR();\n        }\n    }\n}\n```\n\n当你在任何打算使用其的\
  \ Web 视图中链接 JavaScript 核心文件后，SignalR 的配置就完成了：\n\n点击此处查看代码图片\n\n```html\n<script\
  \ type=\"text/javascript\" src=\"~/content/scripts/jquery.signalR-2.2.0.min.js\"\
  ></script>\n```\n\n接下来，你添加以下脚本代码，它实际上在库的同一实例的客户端和服务器部分之间建立了连接：\n\n点击此处查看代码图片\n\n\
  ```javascript\n<script>\n$(function() {\n    // 保存 SignalR hub 的引用\n    var theHub\
  \ = $.connection.yourHub;\n    // ... (此处省略原文中重复的定义部分)\n})\n</script>\n```\n\n\n\
  \n每个 SignalR 实例都是围绕一个特定的 hub 类构建的，该类负责协调客户端与服务器之间的数据交换。换句话说，hub 是介于服务器代码和 ASP.NET\
  \ SignalR 基础设施之间的代理，它知道如何连接已连接的客户端。\n\n### Hub 的内部结构\n\nSignalR hub 类不包含任何业务逻辑。它所做的只是为服务器代码（业务代码）定义一个编程接口，以便回调原始浏览器：\n\
  \n点击此处查看代码图像\n\n```csharp\npublic class ProgressHub : Hub\n\n{\n    public void\
  \ NotifyStart(string connId)\n    {\n        var hubContext = GlobalHost.ConnectionManager.GetHubContext<ProgressHub>();\n\
  \        hubContext.Clients.Client(connId).initProgressBar();\n    }\n    public\
  \ void NotifyProgress(string connId, int percentage)\n    {\n        var hubContext\
  \ = GlobalHost.ConnectionManager.GetHubContext<ProgressHub>();\n        hubContext.Clients.Client(connId).updateProgressBar(percentage,\
  \ connId);\n    }\n    public void NotifyEnd(string connId)\n    {\n        var\
  \ hubContext = GlobalHost.ConnectionManager.GetHubContext<ProgressHub>();\n    \
  \    hubContext.Clients.Client(connId).clearProgressBar();\n    }\n}\n```\n\nhub\
  \ 中的所有方法都具有相同的结构。它们首先获取 ASP.NET SignalR 内部控制台的引用，然后对所有连接的客户端进行调用，或者仅对指定连接上的客户端进行调用。\n\
  \nASP.NET SignalR API 还允许你定义客户端组并向所有组进行广播。在这个示例中，通知仅返回给使用该 ID 打开连接的客户端。\n\n### 实时更新用户界面\n\
  \n被调用的方法（例如 `updateProgressBar`）只是客户端上定义的 JavaScript 函数的占位符。`updateProgressBar`\
  \ 和类似的方法没有服务器端实现。你可以为这些方法提供任何任意名称，只要它们与客户端 SignalR hub 上定义的 JavaScript 函数匹配即可：\n\
  \n点击此处查看代码图像\n\n```javascript\ntheHub.client.initProgressBar = function () {\n \
  \   $(\"#notification\").show();\n    theHub.client.updateProgressBar(0);\n};\n\n\
  theHub.client.updateProgressBar = function (percentage, connId) {\n    $(\"#workDone\"\
  ).text(percentage);\n    $(\"#taskId\").text(connId);\n    $('.progress-bar').css('width',\
  \ percentage + '%').attr('aria-valuenow', percentage);\n};\n\ntheHub.client.clearProgressBar\
  \ = function () {\n    theHub.client.updateProgressBar(100);\n    window.setTimeout(function()\
  \ {\n        $(\"#notification\").hide();\n    }, 2000);\n};\n```\n\n一旦控制权传回给 JavaScript\
  \ 代码，更新用户界面就像更新 DOM 一样简单。图 14-7 显示了示例应用程序如何更新使用 Bootstrap 创建的进度条。连接 ID 显示在进度条下方：\n\
  \n点击此处查看代码图像\n\n```html\n<div class=\"progress\">\n    <div class=\"progress-bar\"\
  \ role=\"progressbar\"\n             aria-valuenow=\"0\"\n             aria-valuemin=\"\
  0\"\n             aria-valuemax=\"100\">\n        <span class=\"sr-only\" id=\"\
  workDone\"></span>\n    </div>\n</div>\n```\n\n![Image](img/00113.jpeg)\n\n**图 14-7**\
  \ 使用 SignalR 监控远程任务\n\n### ASP.NET SignalR 的其他场景\n\nASP.NET SignalR 可以用于满足客户端所需的任何类型的动态变化。以下是一些其他常见场景的详细说明。\n\
  \n\n\n\n你应当如何构建一个能够让任何内容适应查看设备尺寸的网站？这就是响应式网页设计（RWD）。\n\n## 响应式网页设计的基础\n\n通常情况下，`adaptive`（自适应）和\
  \ `responsive`（响应式）可以互用，就像是同义词一样。实际上，某些字典——特别是韦伯字典字典（Merriam-Webster）——将任何具有适应能力的属性定义为“响应式”。但在\
  \ Web 开发中，`responsive` 一词有时指的是超越概念层面的特定内容，它更多的是一种实现细节。\n\n当销售人员和客户描述一个网站是`响应式`时，他们的意思是该网站在无论使用何种设备进行导航时都能良好显示。相反，对于开发者和设计师来说，一个`响应式`网站是指使用一组特定的技术和实践构建的自适应网站，这些技术统称为`响应式网页设计`（Responsive\
  \ Web Design）。\n\n在本章中，我将探讨 RWD 的优缺点，并引起对盲目采用 RWD 服务移动端视图时可能遇到的问题的关注。\n\n### RWD\
  \ 的简史\n\n直到十年前，Web 开发世界被分为两部分：一端是桌面浏览器，另一端是其他所有内容。“其他所有内容”包括手机手机和少数小型掌上设备（如 Windows\
  \ CE 设备）。`ASP.NET` 的早期版本甚至带有一套独特的控件，配有极小的浏览器检测引擎和针对移动端优化的渲染。移动端控件从未流行过，因为当时移动设备很少用于浏览网页。\n\
  \n当苹果发布 iPhone 时，一切都改变了。而 iPad 的发布让这种更加剧烈，将移动端也一分为两个部分：智能手机和平板电脑。再加上不断增加的智能手机品牌和型号，你就得到了大局。以基于表达式的用户代理字符串（user\
  \ agent strings）分析为核心的内置检测引擎已变得非常难以管理。随着用户代理字符串（及其变体）的数量达到数千个，确定为设备提供什么理想内容很容易就会变成一场地狱般的浏览器噩梦。\n\
  \n因此，需要一种截然不同的方法。\n\nEthan Marcotte 提出了一种他称为“响应式网页设计”的方法。从那时起，RWD 缩写越来越流行，RWD 方法背后的实践被认为是获取适应宿主设备的响应式网站的唯一途径。归结底，RWD\
  \ 是一种有效的方法，并得到了像 `Bootstrap` 等流行设计框架的支持。（参见第 9 章，“Bootstrap 核心](#part0016.html_ch09)”。）然而，RWD\
  \ 只是可能的方法之一——在涉及到移动设备时，可能不是最有效的方法。\n\nRWD 相对容易实现，无论是通过手动编码还是从设计师那里获取的自适应 HTML 模板。它是否也是提供移动内容的最有效方式，必须根据每个项目仔细调查。\n\
  \n### CSS 媒体查询\n\nRWD 方法的三大支柱是流式网格、弹性图像和 CSS 媒体查询。`fluid grid` 的理念是，当最外层容器尺寸变化时，其中的所有内容都会重流并适应新尺寸。RWD\
  \ 的核心在于布局内容，使其能够在新的、更小或更大的容器中轻松重新渲染。图像可以通过 HTML 属性轻松调整大小，但通过这种方式它们只是被拉伸，而不考虑艺术考量和下载大小。\n\
  \nCSS 媒体查询是组装 HTML 元素可见性和浮动样式、甚至是容器尺寸所需的胶水。\n\n#### 媒体类型\n\n`CSS media queries`\
  \ 是一个广为人知的万维网联盟（W3C）标准，已经存在多年了。`media` 一词指的是 HTML 定义的媒体类型，其中最流行和使用广泛的是 `screen`（屏幕）和\
  \ `print`（打印）。HTML 标准定义了更多媒体类型，包括 `handheld`（手持）。`handheld` 类型最初似乎非常将 CSS 样式表的应用限制在手持设备。遗憾的是，没有智能手机厂商支持该媒体类型。\n\
  \n![Image](img/00004.jpeg) 注意事项\n\n当苹果发布 iPhone 时，该公司做出了一个明智的选择，不支持 `handheld` 媒体类型，因为——它声称——W3C\
  \ 建议的手持设备分辨率远小于 iPhone。其他厂商只是效法了苹果，因此将媒体类型范围限制在不多于 `screen` 和 `print` 的范围内，并强制引入一种围绕\
  \ `screen` 媒体类型的查询语言，以区分跨设备的输出。\n\n这可能永远不会发生，但如果智能手机浏览器能重新考虑自己为手持设备，那就好了。那将完全改变定义背后的意义和数字。\n\
  \n在 `LINK` 元素中使用的 `media` 属性指示了正在下载的 CSS 文件将使用的上下文。`screen` 的默认值正如其名称所示，表示引用的 CSS\
  \ 文件在屏幕上显示页面时使用。`print` 的值则表示引用的 CSS 文件在打印页面时使用。通常，打印 CSS 与屏幕 CSS 的不同之处源于背景图像、字体和图形样式。\n\
  \n#### 针对屏幕设备的简单查询语言\n\n由于仅限于使用一个核心媒体类型——`screen`——来面对设备的爆炸，因此创建了一种基础查询语言，以便在不同场景下使用不同的样式表。这正是\
  \ CSS 媒体查询标准真正代表的意义。\n\n支持 CSS 3 的浏览器接受 `media` 属性中的布尔表达式，并且仅在表达式求值为真时才选择引用的 CSS\
  \ 文件。为了获得一个合理的布尔表达式，你需要参数与 `AND` 和 `OR` 运算符结合在一起。表 15-1 展示了 CSS 媒体查询支持的最流行和常用的关键字。\n\
  \n![Image](img/00114.jpeg)\n\n**表 15-1** CSS 3 标准中定义的属性\n\n可在 CSS 媒体查询表达式使用的属性完整列表可在\
  \ [`http://www.w3.org/TR/css3-mediaqueries`](http://www.w3.org/TR/css3-mediaqueries)\
  \ 获取。\n\n#### 即将推出的 CSS 媒体查询 4\n\n新版本的 CSS 媒体查询标准正在开发中，正在添加新属性以便根据特定的设备形态定制样式表。表\
  \ 15-2 中的特色属性正在添加到新标准中。\n\n![Image](img/00115.jpeg)\n\n**表 15-2** CSS 媒体查询 4 标准定义的定义的属性\n\
  \n新版本的好处之一是，如果你测试 `hover` 和 `pointer`，检测非桌面设备变得更容易。例如，等于“hover”的 `hover` 属性明确表示支持工具提示的桌面浏览器。设置为“on-demand”值的属性可能意味着该设备是\
  \ Android 设备，因为 Android 是长按是默认功能的平台。同时，设置为“coarse”值的 `pointer` 属性表明底层设备是触控设备，很可能是平板电脑。\n\
  \n##### 通过媒体查询使用条件样式表\n\n让我们看看如何使用媒体查询属性来动态切换 CSS 文件。这里有一个媒体查询表达式的示例：\n\n点击此处查看代码图像\n\
  \n```\n<link type=\"text/css\" rel=\"stylesheet\" href=\"view480.css\"\n      media=\"\
  only screen and (max-width: 480px)\">\n```\n\n\n\n\n只有当媒体表达式评估结果为 `true` 时，浏览器才会链接\
  \ `view480.css` 文件。在示例中，如果实际屏幕尺寸（浏览器的视口）宽度最多为 480 像素，就会发生这种情况。理想情况下，网页将托管多个 `LINK`\
  \ 元素，每个元素指向针对特定条件的不同样式表。评估过程不会在首次匹配项处停止，而是会遍历整个 CSS 引用列表。页面作者需要确保仅有一个 `LINK` 元素的媒体查询评估结果为\
  \ `true`。每当窗口大小发生变化时（无论是由于鼠标操作还是屏幕旋转导致的调整），浏览器都会重新评估链接的 CSS 文件列表。\n\n一旦浏览器检测到屏幕尺寸或方向发生变化，它就会选取最合适的\
  \ CSS 文件。页面内容将根据当前样式表中的指令进行重新渲染。媒体查询属性——如 `width`、`height` 和 `orientation`——是动态变化的。其他属性——尤其是来自\
  \ CSS 媒体查询 Level 4 标准的属性——是静态的，因为它们取决于设备的本质属性。\n\n***\n\n![Image](img/00006.jpeg)\
  \ 重要\n\nCSS 媒体查询以两种方式工作。一种让桌面用户体验更愉快的方法是，让无论浏览器窗口大小如何，显示的内容都保持可用性。另一种方法是为使用特定非桌面设备访问网站的用户提供愉快的体验。这可以在开发者无需处理复杂的用户代理字符串（user\
  \ agent strings）的情况下实现。\n\n简而言之，RWD（响应式网页设计）不区分缩放为 480 像素的桌面浏览器和在智能手机上的全屏浏览器。唯一重要的是屏幕尺寸，但智能手机和笔记本电脑可能通过不同的连接方式（Wi-Fi、3G）工作，且\
  \ CPU 性能存在显著差异。这最能代表 RWD 的本质。这既是 RWD 的主要优势，也是它最大的缺点。\n\n***\n\n### 使用媒体查询手工构建网格系统\n\
  \n如今大多数响应式网站都基于某些响应式框架——最可能是 Bootstrap。正如你在第 9 章中所看到的，Bootstrap 自带媒体查询表达式，并将屏幕分为四个主要部分。\n\
  \n你完全可以覆盖 Bootstrap 设置，或者完全不使用 Bootstrap。在这种情况下，你只会得到一组实现自制网格系统的 CSS 样式。如所述，网格系统是响应式设计的核心。这里是一个快速示例：\n\
  \n点击此处查看图片\n\n```css\n.mycontainer {\n    clear: both;\n    padding: 0;\n    margin:\
  \ 0;\n}\n\n/*  容器内列的通用设置  */\n.col {\n    display: block;\n    float: left;\n}\n\
  \n/*  根据位置的列设置: 4 个元素  */\n.span4_index4 {\n    width: 25%;\n}\n\n.span4_index3\
  \ {\n    width: 25%;\n    background: #ddd;\n}\n\n.span4_index2 {\n    width: 25%;\n\
  }\n\n.span4_index1 {\n    width: 25%;\n    background: #ddd;\n}\n\n/* 800px 以下为\
  \ 2x2 */\n@media only screen and (max-width: 800px) {\n    .span4_index4 {\n   \
  \     width: 50%;\n    }\n    .span4_index3 {\n        width: 50%;\n    }\n    .span4_index2\
  \ {\n        width: 50%;\n    }\n    .span4_index1 {\n        width: 50%;\n    }\n\
  }\n\n/* 400px 以下垂直对齐 */\n@media only screen and (max-width: 400px) {\n    .span4_index4\
  \ {\n        width: 100%;\n    }\n    .span4_index3 {\n        width: 100%;\n  \
  \  }\n    .span4_index2 {\n        width: 100%;\n    }\n    .span4_index1 {\n  \
  \      width: 100%;\n    }\n}\n```\n\n\n\n\n响应式网页设计（RWD）的基础是一条公理：你应该以**移动优先**的方式来设计模板。移动优先的方法本质上规定，你首先安排一个适用于较小屏幕的视图模板，然后随着目标屏幕增大，逐步添加越来越多的内容。\n\
  \n如果你是一个设计师，这种方法可能行之有效；但作为 Web 开发者，你最终总是要提供一个完整的内容。而这些内容总是针对该应用程序支持的最大屏幕的。\n\n总的来说，移动优先策略与移动后期策略（等同于`渐进式增强`\
  \ `progressive enhancement` 与`优雅降级` `graceful degradation`）之争，主要是设计师之间的争论，并且在很大程度上取决于个人偏好。这取决于你喜欢如何学习新系统。\n\
  \n相反，从纯开发的角度来看，移动优先策略并没有带来收益，因为它仍然需要服务器提供所有内容——除非进行了某些良好的设备检测。\n\n## 将 RWD 适配到非桌面设备\n\
  \n只要你在计算能力、图形处理和屏幕空间方面仍然保持在高端设备的范围内，RWD 都是一个极佳的资源和绝妙的解决方案。在桌面电脑上，你想要下载页面的全部内容。你只需要支付一次成本，而且这可能还不是巨大的成本，因为你可能连接到了某个快速的\
  \ Wi-Fi 网络。\n\n在这种情况下，如果你仍然能够从调整大小后的浏览器窗口获取相关信息，那就是该网站的一项很棒的功能。允许你很好地调整浏览器窗口大小的机制，显然也能让你无需额外努力就能为移动浏览器提供服务。\n\
  \n只是，调整后的桌面浏览器窗口和全屏智能手机浏览器是完全不同的东西。\n\n***\n\n![Image](img/00006.jpeg) 重要提示\n\n\
  数字不是观点，物理学中的量也是如此。一个 15 英角的屏幕（如你在笔记本电脑或桌面电脑上看到的））仍然和并排放置的几个 5 英寸手机屏幕一样大。这不是观点，甚至不是分辨率的问题。大屏幕或小屏幕对于设计甚至使用用例都有着巨大的影响。有时，如果你从移动用户的视角来看待，你对应用程序的感知就会发生变化。如果你盲目地遵循\
  \ RWD，你无法获得针对特定设备的设计和分析。\n\n***\n\n当使用 RWD 为非桌面设备提供内容时，你的开发工作中有几个领域必须经过优化。排在第一位的是你如何处理图像。\n\
  \n### 处理图像\n\n只要你能够负担得起移动几个 HTML 容器以适应较小屏幕，CSS 都是一个非常强大的工具。在 HTML 容器内部——通常是块 级元素，如\
  \ `DIV` 元素——你可以包含纯文本、标记标记文本和图像。\n\n由于各种原因，文本和图像都应该在你考虑的任何尺寸的屏幕上进行仔细的审查和测试。特别是，处理响应式网站中的图像可能会非常棘手。\n\
  \n让我们找出原因并识别出通变方案。\n\n#### 超越 `IMG` 元素\n\n从 HTML5 开始，你只有一种方法可以向网页中添加图像——使用 `IMG`\
  \ 元素。`IMG` 元素可以通过两种方式指向指定的图像：\n\n![Image](img/00003.jpeg) 单个 URL（最常见的方式）\n\n![Image](img/00003.jpeg)\
  \ 嵌入的 Base64 文本流\n\n当 URL 直接引用图像文件时，文件会被下载、缓存，然后根据 CSS 样式指示的任何 `width`（宽度）和 `height`（高度）属性的组合进行调整大小。乍看之下，这是完美的。通过操作宽度和高度并将其表示为百分比，你可以让图像很好地适应容器，同时保持页面内的纵横比和比例。\n\
  \n尽管这种方法具有功能性，但由于某些原因，这种方法通常太简单了：\n\n![Image](img/00003.jpeg) 你下载的图像在某些设备上可能比需要的尺寸大得多。\n\
  \n![Image](img/00003.jpeg) 一张大图像可能代表特写或远景，这使得读者很难理解同一张图像的小比例缩放后的含义。\n\n为什么要在小设备上下载一个\
  \ 2-MB 的图像呢，而其实它的一小部分就完全足够了？你可以节省带宽，并让设备渲染页面的速度快得多。即使下载的大小不是你首要考虑的问题，也要考虑到通常一个 2-MB\
  \ 的图像可能包含很多细节（例如，某个物品的特写），或者包含极少细节（例如，风景的远景）。\n\n当缩放为缩略图时，图像可能会变成一团混乱的像素点，或者是一片几乎是单色的平坦荒漠。在为网站调整图像大一时，你想要确保图像承载了它应该具有的精确含义。在这种情况下，设备及其屏幕宽度确实很重要。\n\
  \n#### 通向响应式图像\n\n理想情况下，你为不同的设备和屏幕宽度使用不同的图像。理想情况下，浏览器应该根据媒体类型和媒体属性，承担从一系列选择中选择并下载最合适图像的任务。类似于响应式图像。\n\
  \n事实上，在不久的将来，预计浏览器将支持一种新的图像 HTML 元素，它不再限于单一源文件。根据 W3C 对响应式图像的愿景，这是你可以在下一代网络浏览器中看到的预览：\n\
  \n点击此处查看代码图像\n\n```html\n<picture alt=\"\">\n  <source media=\"(min-width:800px)\"\
  \ srcset=\"large-jpg 1x,large-jpg 2x\">\n  <source media=\"(min-width:600px)\" srcset=\"\
  med-jpg 1x,med-jpg 2x\">\n  <source srcset=\"small-jpg 1x,small-jpg 2x\">\n  <img\
  \ src=\"small-jpg\">\n</picture>\n```\n\n\n\n最后，除非你需要支持一长串旧版浏览器，否则使用 `PICTURE` 元素绝对是一个值得考虑的选项。然而，使用\
  \ `PICTURE` 元素并非没有问题，可能包含一些隐藏成本。\n\n`PICTURE` 元素的优势在于，它允许浏览器从一系列选项中智能地选择最合适的图像。维护同一个逻辑图片的多个版本需要设计师付出额外工作，并导致在服务器上存储多张图像。对于相对静态的图像（如背景图像或偶尔更新的图像），这可能不是什么问题。使用\
  \ `PICTURE` 元素来支持动态图库的实现可能会非常贵。\n\n![Image](img/00004.jpeg) 注意\n\n一种介于 `PICTURE`\
  \ 和 `IMG` 之间的有趣替代方案是由 `ImageEngine Lite` 服务提供的。`ImageEngine Lite` 是一个服务器端工具，充当代理并自动根据设备情况调整大小并提供源图像。我将在下一章中详细介绍\
  \ `ImageEngine Lite`。欲更多信息，请访问 [`web.wurfl.io`](http://web.wurfl.io)。\n\n### 处理字体\n\
  \nRWD（响应式网页设计）是关于在不同尺寸的容器中重流内容。那么其中包含的文本大小又是呢？让我们开始回顾 Bootstrap 内部是如何处理的——这是一个常用的响应式视图框架。\n\
  \n#### 固定单位和相对单位\n\n在 `Bootstrap` 中，字体大小和行高的设置放置在 `BODY` 级别，并对 `P` 等其他文本元素进行细微调整。还提供了\
  \ CSS 类来增大或减小字体大小，例如 `small` 和 `lead`。在 `Bootstrap 3.x` 之前，所有字体大小都以像素表示。这预计在 `Bootstrap\
  \ 4` 中发生变化。\n\n在 `Bootstrap` 中使用像素的决定是有争议的，但在当时，这绝对是一个合理的决定。开发者主要以像素来思考，而像素提供了对文本的绝对控制，并确保了所有浏览器中的渲染一致性。另一种方法是使用\
  \ `EM` 或 `REM` 单位等相对测量值来表示字体大小。\n\n`EM` 和 `REM` 之间的区别非常微妙。这两个单位都将字体大小表示为某值的比例：`EM`\
  \ 将其设置为最近父级元素字体大小的比例，而 `REM` 则始终查看在 `HTML` 级别设置的字体大小。通过使用 `REM` 字体大小，你只需要在一个地方关注实际数字——即根节点——其他所有内容将自动缩放：\n\
  \n```css\nhtml { font-size: 14px; }\nh1 { font-size: 3rem; }\nh2 { font-size: 2.5rem;\
  \ }\nh3 { font-size: 2rem; }\n```\n\n注意，支持 `REM` 字体的一个主要理由是它们的可访问性（accessibility）。基于像素的字体大小在操作系统级别和浏览器级别的字体增大时（例如对于视力有问题的人来说）并不会自动缩放。相反，通过\
  \ `EM` 衡量的字体是浏览器字体大小的百分比增加的。这意味着 `EM` 单位不会影响可访问性，但在 `EM` 单位上构建可访问的解决方案需要更多工作，因为像素永远不应该出现在任何\
  \ `HTML` 级别。\n\n在像 `Bootstrap` 这样的通用框架中，从头到尾使用 `EM` 可能会在各种浏览器中引发许多问题。最后，`EM` 字体对于强烈强调可访问性的网站来说仍然是一个很好的选择。另一方面，如果你不想自己处理视觉断点（visual\
  \ breakpoints），`REM` 字体是有意义的。在这种情况下，你在 `HTML` 级别设置基于像素的字体，并忘记数字。\n\n#### 视口单位\n\n\
  表示字体大小的另一种方法是通过视口单位（viewport units）。视口单位将字体大小视为视口大小的百分比：\n\n```css\nh1 { font-size:\
  \ 5.9vw; }\n```\n\n在示例中，`H1` 元素的尺寸被设置为浏览器窗口宽的 5.9%。不言而明，随着浏览器窗口的调整，字体尺寸也会发生变化。这一切会自动发生，不需要你端进行任何其他\
  \ CSS 技巧。\n\n视口单位有几种变体（`VWs`）。\n\n你可以使用 `VW` 将字体大小设置为视口宽的百分比。或者你可以使用 `VH` 来指定视口高度。最后，你可以使用\
  \ `VMIN` 或 `VMAX` 来指定视口宽度和高度之间的最小或最大差异。\n\n![Image](img/00004.jpeg) 注意\n\n我一直对使用视口单位设置字体很感兴趣，但我一直发现使用它们非常棘手，特别是当你要在供移动和桌面设备查看的页面中使用它们时。目前，我在一个应用程序中使用了它们，但在一个非常严格的场景下：创建为托管在固定尺寸框架或容器中的屏幕的页面。\n\
  \n#### Bootstrap 4 中的变化\n\n`Bootstrap` 作者从一开始没有选择 `REM` 选项的主要原因与浏览器兼容性有关。例如，`Internet\
  \ Explorer 8` 不支持 `REM` 测量。选择 `REM` 选项将导致 `Internet Explorer 8` 不兼容 `Bootstrap`。\n\
  \n因此，`Bootstrap 3` 构建在像素之上，但这并没有阻止你在本地使用 `REM` 或 `EM` 字体。`Bootstrap 4` 将放弃对 `Internet\
  \ Explorer 8` 的支持。随后，你可以毫无约束采用采用字体大小逻辑。如果你打算保证 `Internet Explorer 8`，最好坚持使用 `Bootstrap\
  \ 3.x`。\n\n#### 处理方向\n\n拥有响应式网站的主要原因之一是设备用户能够极其轻松地消费内容。当在大平板上查看时，网站必须能够应对方向的变化（竖屏到横屏反之亦然）。\n\
  \n你如何检测方向的变化，又如何处理它？首先，这不是你可以在服务器端检测到的编程方面。这只是你只能在客户端感应到的状态。\n\n##### 使用媒体查询\n\n\
  从网站的角度来看，方向的变化只是窗口的普通缩放，设置了不同的高度和宽度。根据你拥有的内容，不同的 CSS 可能就足以处理这种变化。如果 CSS 足够处理所需的变化，你所能做的事情就是添加几个媒体查询表达式，如下所示：\n\
  \n```css\n@media screen and (orientation: portrait) {\n  /* 竖屏特定样式 */\n}\n@media\
  \ screen and (orientation: landscape) {\n  /* 横屏特定样式 */\n}\n```\n\n如果你正在使用 `Bootstrap`，大多数情况下你不需要采取措施来显式支持竖屏和横屏，因为它会被检测并视为普通的缩放。然而，在更复杂的情况下，仅仅切换\
  \ CSS 可能是不的，需要一些客户端 JavaScript。\n\n##### 检测浏览器事件\n\n你可以通过 `orientationchange` 事件程序化检测方向的变化，或者对于不提供另一种更特定事件的浏览器，直接使用\
  \ `resize` 事件。当你检测到尺寸变化时，你无法直接从中得知布局是 `portrait` 还是 `landscape`。然而，你可以通过简单的数学计算得出结果。\n\
  \n另一种方案是使用浏览器 `window` 对象上的 `matchMedia` 对象：\n\n```javascript\nvar orientation =\
  \ window.matchMedia(\"(orientation: portrait)\");\norientation.addListener(function(portrait)\
  \ {\n  if(portrait.matches) {\n    // 适配竖屏\n  }\n  else {\n    // 适配横屏\n  }\n});\n\
  ```\n\n`matchMedia` 对象在大多数现代浏览器中都支持。\n\n\n\n\n毫无疑问，响应式网页视图在如今是绝对必不可少的。响应式网页设计（Responsive\
  \ Web Design）是一种你可以遵循的编程实践，用它来创建完全响应式的网页视图。由于这种方法有 `Bootstrap` 等流行框架的支持，对于几乎所有人来说，创建响应式视图都是一项负担得起的努力。但请注意，`Bootstrap`\
  \ 并没有施展魔法——它只是提供了一些开发者和设计师可以使用来布局响应式视图的临时工具。\n\n这意味着，响应式视图并非易事，而且在所有可能的场景下表现并不相同。流式网格（Fluid\
  \ grids）是响应式网页设计的基础。流式网格本质上是可调整大小的容器，可以重流任何被编写为可重流的内容。流式网格相对简单的概念需要大量的复杂代码，并且基本上需要动态切换\
  \ `CSS` 样式表的能力。\n\n这就是 `CSS` 媒体查询大显用场的地方。媒体查询根据围绕几个浏览器属性编写的布尔表达式来选择 `CSS` 样式表。这些属性中最重要的是屏幕宽度。仅根据屏幕宽度来区分内容并没有考虑到底层设备的实际能力。事实上，RWD\
  \ 特意忽略了设备——它所做的只是根据屏幕宽度提供不同的布局。\n\n在本章中，我回顾了媒体查询的核心机制。（第 9 章 包含了更多关于如何在现实应用中创建流式网格的详细信息。）在本章的后半部分，我讨论了改进\
  \ RWD 解决方案的方面。\n\n在下一章中，我将探索包括设备检测和以移动为中心的策略的解决方案。\n\n# 第 16 章 让网站移动友好\n\n*未来属于那些今天就做好准备的人。*\n\
  \n*——马尔科·X*\n\n在软件领域，“移动”（*mobile）一词通常与特定平台的原生应用程序相关，例如 `Apple iOS`、`Microsoft Windows\
  \ Phone` 或 `Android`。一种常见的愿景是，你应该为某些平台开发应用，并确保网站可以在智能手机和（小型）平板电脑上舒适地查看。大多数最新设备都可以舒适地显示几乎任何网站。这导致许多高管仅通过几个原生应用来处理移动问题，从而完全忽略了移动网络中更微妙的问题。\n\
  \n我的愿景不同。我不争论拥有（或不拥有）移动应用，因为那个方面太取决于业务特定，无法用通用术语来讨论。但我支持提供移动友好的网站，这确实非常重要。更准确地说，我认为任何公司都不应该仅仅满足于一个在智能手机上显示并可以阅读的网站。你通过移动优化的网站设计可以提供的用户体验（UX），将远优于仅为用户提供缩指缩放功能来填写表单和阅读新闻。\n\
  \n在第 15 章中的“[响应式设计的优缺点]”中，我已经讨论了流式网格和 `CSS` 媒体查询在生成不同尺寸网站屏幕方面所起的作用。在本章中，在转向针对特定类型设备（如智能手机）优化网站的技术和方法之前，我将涉及\
  \ `HTML5` 和功能检测。\n\n## 使视图适应实际设备\n\n移动用户在从移动设备导航到网站时，往往有很高的期望。他们期望网站提供与原生 `iPhone`\
  \ 或 `Android` 应用相似的体验。例如，他们期望拥有触控控制控件以及流行的小部件，如选择列表、侧边菜单和切换开关。这些小部件（尚未？）作为 `HTML`\
  \ 的原生元素并不。它们必须通过使用富组件控件来模拟，每次都输出 `JavaScript` 和标记的混合体。\n\n底线是，通过尽可能利用 `HTML`、`CSS`\
  \ 和 `JavaScript` 创建一个纯洁的网站是一回事；而创建一个看起来像原生应用，或者至少行为像原生应用那样的引人入胜的移动网站则是另一回事。当你考虑到移动网站与完整网站相比仅包含一小部分功能集，并且有时还需要不同的用例时，实现这一目标将是更大的挑战。好消息是，通过充分利用\
  \ `HTML5`，可以减少一些开发问题。\n\n### 移动场景下的 HTML5 最佳实践\n\n平均而言，移动浏览器对 `HTML5` 元素提供了很好的支持。这意味着至少在*智能手机*或*平板电脑*范围内的设备上，你可以默认使用\
  \ `HTML5` 元素，而无需担心替代方案和垫片。`HTML5` 的两个方面与移动开发尤为相关：输入类型和地理定位。\n\n#### 新输入类型\n\n目前，`HTML`（以及后的浏览器）仅支持纯文本作为输入。日期、数字甚至电子邮件地址之间有很大区别，更不用说预定义值。今天，开发者负责通过对输入的文本进行客户端验证，以防止用户输入意外的字符。`jQuery`\
  \ 库有几个可以简化此任务的插件，但这进一步强化了这一点——输入是一个微妙的问题。\n\n`HTML5` 为 `INPUT` 元素的 `type` 属性提供了许多新值。此外，`INPUT`\
  \ 还有几个主要与这些新输入类型相关的新属性。以下是几个例子：\n\n```html\n<input type=\"date\" />\n<input type=\"\
  time\" />\n<input type=\"range\" />\n<input type=\"number\" />\n<input type=\"search\"\
  \ />\n<input type=\"color\" />\n<input type=\"email\" />\n<input type=\"url\" />\n\
  <input type=\"tel\" />\n```\n\n这些新输入类型的真实效果是什么？预期的效果（尽管尚未完全标准）是浏览器提供一个临时的 UI，以便用户可以舒适地输入日期、时间或数字。\n\
  \n桌面浏览器并不总是遵循这些新的输入类型，它们提供的体验并不总是统一。在移动领域情况要好得多。首先，在移动设备上，用户通常使用默认浏览器浏览网页。随后，体验始终是统一且针对设备的。\n\
  \n特别是，像 `email`、`url` 和 `tel` 等输入字段会让智能手机上的移动浏览器自动调整键盘的输入范围。图 16-1 显示了在 Android\
  \ 设备上在 `tel` 输入字段上输入的效果：键盘默认显示数字和手机相关符号。\n\n![Image](img/0019.jpeg)\n\n**图 16-1**\
  \ Android 智能手机上的 *tel* 输入字段\n\n如今，并非所有浏览器都提供相同的体验。尽管它们在与各种输入类型相关的用户界面上基本达成一致，但存在一些关键差异，可能需要开发者添加基于脚本的自定义补丁（polyfills）。例如，考虑\
  \ `date` 类型。任何版本的 Internet Explorer 或 Safari 都不对日期提供任何特殊支持。在这种情况下，移动设备的情况要好得多，正如图\
  \ 16-2 截图所示。\n\n![Image](img/0020.jpeg)\n\n**图 16-2** Android 智能手机上的日期输入字段\n\n通常来说，最近的智能手机上的移动浏览器对\
  \ `HTML5` 元素非常尊重；因此，开发者应该准备好正确的输入类型。\n\n#### 地理定位\n\n地理定位是一种 `HTML` 标准，被桌面和移动浏览器广泛支持。如所述，有时网站的移动版本需要一些用户在完整版本上找不到的临时用例。当这种情况发生时，很可能是用户的地理定位涉及了移动端专用用例。这里是一些示例代码：\n\
  \n点击此处查看代码图片\n\n```javascript\n<script type=\"text/javascript\"\n```\n\n\n\n\n\n\
  # 特性检测与 Modernizr\n\n```html\n<script src=\"http://maps.googleapis.com/maps/js?sensor=true\"\
  ></script>\n<script type=\"text/javascript\">\nfunction initialize() {\n    navigator.geolocation.getCurrentPosition(\n\
  \        showMap,\n        function(e) {\n            alert(e.message);\n      \
  \  },\n        {enableHighAccuracy:true, timeout:10000, maximumAge:0 }\n    );\n\
  }\n\nfunction showMap(position) {\n    var point = new google.maps.LatLng(position.coords.latitude,\
  \ position.coords.longitude);\n    var myOptions = {\n        zoom: 16,\n      \
  \  center: point,\n        mapTypeId: google.maps.MapTypeId.ROAD\n    };\n    var\
  \ map = new google.maps.Map(document.getElementById(\"map_canvas\"), myOptions);\n\
  \    var marker = new google.maps.Marker({\n        position: point,\n        map:\
  \ map,\n        title: \"You are here\"\n    });\n}\n</script>\n\n<body onload=\"\
  initialize()\">\n<div id=\"map_canvas\" style=\"width:100%; height:100%\"></div>\n\
  </body>\n```\n\n该页面会请求用户允许地理位置权限，然后在地图上显示设备的精确位置。\n\n## 特性检测\n\n响应式网页设计（RWD）源于以下发散性思维示例。检测设备很困难？那么就不要去检测。你只需获取客户端可用的几个基本信息片段（例如浏览器窗口的大小），设置即时样式表，并让浏览器相应地重流页面中的内容。这产生了特性检测的想法，并创建了一个流行的库——**Modernizr**\
  \ 以及一个同样受欢迎的网站 `http://caniuse.com`。\n\n### Modernizr 能为你做什么\n\n特性检测背后的理念非常简单，在某种程度上甚至是明智。你甚至不需要尝试去检测请求设备的实际能力，因为这种做法是繁琐且困难的。它甚至会对方案的可维护性带来严重问题。\n\
  \n配备了特性检测库后，你仅根据在设备上通过程序检测到的内容来决定显示什么。而不是通过检测用户代理（User Agent）并盲目假设此类设备不支持某个特定功能，只需让像\
  \ Modernizr 这样的即时库为你查出该功能在当前浏览器上是否可用，无论宿主机设备为何。（参见 `http://modernizr.com`。）\n\n\
  例如，与其维护一个哪些浏览器（以及相关的用户代理字符串）支持日期输入字段的列表，你只需通过 Modernizr 检查当前浏览器是否支持日期输入字段。以下是一些说明性的脚本代码：\n\
  \n点击此处查看代码图片\n\n```javascript\nModernizr.load({\n    test: Modernizr.inputtypes.date,\n\
  \    nope: ['jquery-ui.min.js', 'jquery-ui.css'],\n    complete: function () {\n\
  \        $('input[type=date]').datepicker({\n            dateFormat: 'yy-mm-dd'\n\
  \        });\n    }\n});\n```\n\n你告诉 Modernizr 测试日期输入类型。如果测试失败，你将下载 jQuery UI 文件并运行\
  \ `complete` 回调函数，为页面中所有日期类型的 `INPUT` 元素设置 jQuery UI 日期选择插件。这种方法让你能够无忧地在页面中使用 HTML5\
  \ 标记，无论对终端用户产生何影响：\n\n```html\n<input type=\"date\" />\n```\n\n特性检测提供了一个巨大的优势，即作为开发者，你只需要对站点进行设计和维护。响应式调整内容的负担被推给了视觉设计师或像\
  \ Modernizr 这样的即时库。\n\nModernizr 包含一个 JavaScript 库，其中包含的代码可以运行\n\n\n\n\n\n为了获取 `WURFL.JS`\
  \ 服务，你只需要在任何需要感知实际设备的 HTML 视图中添加以下行：\n\n点击此处查看代码图片\n\n```html\n<script type=\"text/javascript\"\
  \ src=\"//wurfl.io/wurfl.js\"></script>\n```\n\n浏览器对 `WURFL.JS` 端点的性质一无所知。浏览器只是尝试从指定的\
  \ URL 下载并执行执行它能获取的任何脚本代码。接收请求的 `WURFL` 服务器使用调用设备的用户代理（user agent）字符串来确定其实际能力。`WURFL`\
  \ 服务器依赖于 `WURFL` 框架的服务——这是一个强大的设备数据库，也是 Facebook、Google 和 PayPal 使用的跨平台 API。\n\n\
  调用上述 HTTP 端点的最终效果是在浏览器 DOM 中注入一个定制的 JavaScript 对象。以下是你将获得的内容的示例：\n\n点击此处查看代码图片\n\
  \n```javascript\nvar WURFL = {\n    \"complete_device_name\":\"iPhone 5\",\n   \
  \ \"is_mobile\":false,\n    \"form_factor\":\"Smartphone\"\n};\n```\n\n服务器端端点接收随请求发送的用户代理字符串并对其进行彻底分析。然后，它选择\
  \ 表 16-1 所示的三条信息，并排列一个 JavaScript 字符串返回。\n\n![Image](img/00121.jpeg)\n\n**表 16-1**\
  \ `WURFL.JS` 属性\n\n图 16-3 显示了 [`www.expoware.org/wjs.htm`](http://www.expoware.org/wjs.htm)\
  \ 公共测试页面上 `WURFL.JS` 的运行。\n\n![Image](img/00122.jpeg)\n\n**图 16-3** 根据 `WURFL.JS`\
  \ 进行设备检测\n\n在性能方面，`WURFL.JS` 相当高效；它进行了大量的缓存，并且不会真正检查它接收到的任何用户代理。但在开发过程中，你可以通过在 URL\
  \ 中添加 `debug=true` 来关闭缓存。\n\n***\n\n![Image](img/00006.jpeg) 重要\n\n只要网站是公开可用的，`WURFL.JS`\
  \ 框架就可以免费使用。但是，如果在生产环境中使用，在流量量巨大的情况下，它可能会成为瓶颈。在这种情况下，你可能希望考虑商业方案，该方案可以预留更多带宽，并让你访问更长的设备属性列表。更多信息，请查看\
  \ [`www.scientiamobile.com`](http://www.scientiamobile.com)。\n\n***\n\n### 客户端检测与响应式页面的混合\n\
  \n`WURFL.JS` 可用于许多场景，包括浏览器个性化、增强分析和优化广告。此外，如果你是一个前端开发者，且在服务器端实现设备检测对你来说不可，那么 `WURFL.JS`\
  \ 就是你的救星。更多示例，请查看 [`web.wurfl.io`](http://web.wurfl.io) 上的 `WURFL.JS` 文档。\n\n让我们简要考虑一些你想使用客户端设备检测的场景。其中一个是下载与设备尺寸和内容都适当的图像。你可以使用如下代码：\n\
  \n点击此处查看代码图片\n\n```html\n<script>\n    if (WURFL.form_factor == \"smartphone\")\
  \ {\n        $(\"#myImage\").attr(\"src\", \"...\");\n    }\n</script>\n```\n\n\
  同样，如果请求的设备看起来像智能手机，你可以使用 `WURFL` 对象重定向到特定的移动站点：\n\n点击此处查看代码图片\n\n```html\n<script>\n\
  \    if (WURFL.form_factor == \"smartphone\") {\n        window.location.href =\
  \ \"...\";\n    }\n</script>\n```\n\n`WURFL.JS` 为你提供了有关实际设备的线索，但目前还没有将 CSS 媒体查询与外部信息（如设备特定细节）混合的方法。由实际用户代理而非媒体查询参数驱动的响应式设计仍然是，但你必须完全自己完成。使用\
  \ `WURFL.JS` 最常见的方式是在 Bootstrap 或任何其他 RWD 解决方案的范围内。你获取设备细节，并通过 JavaScript 启用或禁用特定功能，或下载即时内容。\n\
  \n***\n\n![Image](img/00004.jpeg) 注意\n\n在随书附带的源码中，你会找到一个使用 `WURFL.JS` 来确定将用户引导到网站哪个区域的示例。该示例是一个简单的概念验证，但它可以扩大，以适用于这种场景：在该场景中，大部分站点是经典的\
  \ RWD 站点，只有少数区域根据设备表型（form factor）进行复制。\n\n***\n\n#### 展望\n\n*Client Hints*（客户端提示）是一项新兴的统一标准草案的俗名，用于浏览器和服务器之间的协作。这种模型的灵感来自广泛使用的\
  \ HTTP 头部。在每次请求中，浏览器发送一些额外的头部；服务器读取这些头部并适应内容。\n\n在目前的草案阶段，浏览器可以发送建议的宽度；服务器可以根据这些信息调整内容。这对于\
  \ 3G 连接和低分辨率设备（包括旧款 iPhone 设备）的情况是至关重要的。Client Hints 正朝着这个方向发展。关于 Client Hints 的早期文档可以在\
  \ [`igrigorik.github.io/client-hints`](http://igrigorik.github.io/client-hints)\
  \ 获取。\n\n### 设备友好型图像\n\n在上一章中，我提到了为设备提供适当图像的问题。“适当”本质上意味着两点：尺寸适当并且在使用范围内进行了适当的调整。`PICTURE`\
  \ 元素正在受到关注，随之而来的是开发者和管理员需要维护同一图像的多个版本以适应不同的屏幕尺寸。\n\n另一种不像 `PICTURE` 元素产生任何兼容性问题的选项是使用\
  \ ImageEngine 平台。\n\n#### ImageEngine 平台\n\nImageEngine 是一种服务的图像缩放工具。它特别适用于移动场景，可以显著减少视图负载，从而缩短加载时间。该平台作为内容分发网络（CDN）运行，因为它位于你的服务器应用程序和客户端浏览器之间，代表服务器向客户端提供图像（参见图\
  \ 16-4）。\n\n![Image](img/00123.jpeg)\n\n**图 16-4** ImageEngine 平台的整体架构\n\nImageEngine\
  \ 的的主要目的是减少图像产生的流量。在这方面，它表现为移动网站的理想工具。然而，ImageEngine 并不限于此。首先，你可以根据意愿为任何设备或桌面提供调整后的图像。其次，你可以将\
  \ ImageEngine 作为基于 URL 的编程接口在线缩放工具。最后，你可以将 ImageEngine 作为你的智能图像 CDN，省去维护同一图像多个版本的负担，从而提高各种屏幕尺寸上的速度。\n\
  \n#### 自动缩放图像\n\n要使用 ImageEngine，你需要一个免费账户。该账户通过名称识别你，并帮助服务器将你的流量与其他用户区分来。在创建账户之前，你可以使用测试账户。在\
  \ Razor 视图中，如下所示在网页上显示图像：\n\n```html\n<img src=\"~/content/images/autumn.jpg\">\n\
  ```\n\n\n\n\n\n当你使用 ImageEngine 时，你将其替换为以下标记：\n\n点击此处查看代码图像\n\n<img src=\"//try.imgeng.in/http://www.yoursite.com/content/images/autumn.jpg\"\
  >\n\n一旦你拥有账户，只需将 `try` 替换为你的账户名称。如果账户名称是 `contoso`，那么图片的 URL 就会变为：\n\n点击此处查看代码图像\n\
  \n<img src=\"//contoso.imgeng.in/http://www.yoursite.com/content/images/autumn.jpg\"\
  >\n\nImageEngine 支持许多参数，包括裁剪和调整到给定尺寸。它不仅可以调整到它认为认为该设备理想的大小，还可以接受特定的建议，详见表 16-2。参数被插入到生成的\
  \ URL 中。\n\n![Image](img/00124.jpeg)\n\n**表 16-2** ImageEngine 工具的 URL 参数\n\n注意\
  \ `width`、`height` 和 `percentage` 是互斥的。如果指示为 `none`，图像将调整为检测到的用户代理建议的尺寸。多个参数可以组合成\
  \ URL 的各个段。例如，以下 URL 将图像调整为 300 x 300 像素，并且在原始尺寸无法返回正方形的情况下，会从图像中心进行适当裁剪。参数的顺序并不重要。\n\
  \n点击此处查看代码图像\n\n```\n//contoso.imgeng.in/w_300/h_300/m_cropbox/IMAGE_URL\n```\n\n\
  与即将推出的 PICTURE 元素相比，ImageEngine 并不能让你提供完全不同的图像，因此如果涉及到艺术指导（art direction），你确实需要托管并提供物理不同的图像，并通过\
  \ ImageEngine 进行进一步预处理。然而，如果你不需要艺术指导，ImageEngine 为你节省了手动调整大小的负担并节省了带宽。\n\nImageEngine\
  \ 是一个免费平台，但如需更多信息，可以查看 [`web.wurfl.io`](http://web.wurfl.io)。\n\n* *\n\n![Image](img/00004.jpeg)\
  \ 注意\n\n在书中配套的代码中，你还会找到一个 jQuery 插件源码，该插件简化了为 ImageEngine 工具创建所需 URL 的过程。\n\n* *\n\
  \n#### 提供设备友好视图\n\n即使使用 `WURFL.JS` 和 ImageEngine 进行了客户端调整，如果 RWD 仍然完全符合你的预期，那么你除了尝试服务器端设备检测外别无选择。在\
  \ ASP.NET 的最初版本中，就已经通过一组 XML `.browser` 文件实现了一种相当原始的设备检测形式（实际上是浏览器检测）。\n\n如今，考虑到海量的设备、用户代理和边缘情况（edge\
  \ cases），仅仅依靠单个文件的集合已不足以进行真实且可靠的设备检测。如果这对于你的应用程序是一项资产，你需要准备好为专业服务付费。\n\n#### 提供移动内容的最佳方式是什么？\n\
  \n在开始探索 ASP.NET MVC 可用的服务器端方案之前，让我先总结一下你现在可以采取有效提供移动内容的方法。\n\n##### 选项 #1：响应式 HTML\
  \ 模板\n\n如果你从今天开始建立全新的网站，我绝对建议你使用 Bootstrap 在你的所有视图中拥有响应式模板。使用响应式 HTML 模板不仅可以确保你的视图在用户调整桌面浏览器窗口大小时显示良好，而且你还为移动用户提供了基本的覆盖。事实上，至少移动用户收到的视图与桌面用户调整浏览器大小时所收到的视图是相同的。\n\
  \n从性能角度来看，这可能不是理想的，但如果设备足够新且快，且连接不是很糟糕，这种效果是可以接受的。对于移动交互是业务核心部分的网站，我不会推荐这种路线，但在大多数情况下，它是行之有效的。\n\
  \n##### 选项 #2：添加客户端增强\n\n如果你有时间和预算，你可能希望改进响应式视图的质量并优化图像的处理方式，并在检测到适当设备时添加某些移动特定功能。这一步向着提供可能最佳的用户体验迈进，涵盖了功能检测和设备检测。\n\
  \n你在此阶段可能想要使用的大多数工具和框架并不严格要求订阅或付费许可。然而，如果你使用它们来实现某个性能目标，你可能希望确保自己没有在与全球其他地方共享带宽。如果你计划在生产环境中运行\
  \ `ImageEngine` 或 `WURFL.JS` 等产品，我建议你监控实际性能并考虑商业级服务水平协议。\n\n##### 选项 #3：创建即时移动站点\n\
  \n在移动技术的当前阶段，能够愉快显示配备 `jQuery`、`Bootstrap` 和 `AngularJS` 页面的设备数量已经相当多并且不断增长。这意味着如果整个网站是响应式的，可能可以被使用平板电脑的用户有效使用。\n\
  \n注意，这并不是自动发生的——它在很大程度上取决于你可能做出的某些设计选择。例如，模态表单和弹出窗口在平板电脑上的效果通常不好，对移动用户的满意程度不如对桌面用户的满意。此外，在触摸设备上使用的手指粗细也是一个因素。\n\
  \n#### 智能手机怎么办？\n\n即使是最现代、最尖端的智能手机，屏幕也有 5 或 6 英寸：比平板电脑小得多。你无法现实地期望为智能手机提供完整的网站。浏览器甚至可以显示它并可用，但体验将不尽人意。\n\
  \n如果这对你来说似乎是额外工作，要么你的项目不需要即时覆盖，要么你错过了某些重要的东西。对于这一点，如果你真的关心设备和移动用户，你可能需要为智能手机准备一个即时网站。\n\
  \n##### 重定向到移动网站\n\n假设你现在有两个网站——完整站点（无论是否响应式）和移动站点（文献中称为 m-site）。你如何引导它们？现实世界充满了以不同方式解决问题的例子，同时取得了良好的商业成果。\n\
  \n我相信我们可能都会同意，为网站拥有单一的公开 URL 是非常好的。用户只需要记住 `www` 相关，软件就会静静地切换到最可用的内容。\n\n\n\n\n\n\
  在较简单的场景中，你可以考虑使用某些设备检测功能将其重定向到位于不同 URL 的物理隔离网站。此外，这种方案也是可以的，因为它仍然让用户到达了他们需要的地方，但代价是始终需要输入相同的通用\
  \ www URL。\n\n从开发的角度来看，你可以将即时移动网站视为一个不同的项目。将其作为一个不同的项目是一项巨大的成就：你可以使用即时技术和框架对其进行开发，将其外包给外部公司，让不同的人来负责，并在以后任何时间完成。\n\
  \n尽管如此，在所有这些情况下，你需要一个可以在服务器端进行设备检测的库，无论使用 `ASP.NET`、`Java`、`PHP` 还是其他。\n\n## 服务端检测\n\
  \n为 `ASP.NET MVC` 应用添加服务器端检测最简单的方法是通过 `WURFL` 库，而在项目中获取该库最简单的方法是通过 `NuGet`。\n\n\
  ### 安装 WURFL 框架\n\n图 16-5 显示了该库的 `NuGet` 包列表。如你所见，有两个选项：云 API 和本地 API。\n\n![图像](img/00125.jpeg)\n\
  \n**图 16-5** WURFL NuGet 包列表\n\n如果你选择本地 API，则在进入生产环境之前需要许可。因为你与应用程序并排托管 API，本地 API\
  \ 确保了最佳性能，并且一旦建立缓存，访问时间几乎是瞬时的。包随同设备数据库一起下载，该数据库可能不是最新的。在发布新版本发布时，保持其更新是你的责任。你可以随时从\
  \ `http://wurfl.sourceforge.net` 获取最新的公共设备数据库分块。然而，一旦你设置了许可，就可以通过你的 `http://www.scientiamobile.com`\
  \ 账户获取每周更新的包。\n\n云 API 要求你设置一个免费账户，你可以使用最多五种任选功能。当你创建账户时，你将获得一个 `API key`，用于对 API\
  \ 进行的任何程序化调用。\n\n### 测试 WURFL 云 API\n\n当你配置 `WURFL` 云账户时，可以根据免费计划，从 `WURFL` 提供的\
  \ 500 多种设备能力列表中选择最多五种能力。如果你只是想将视图路由到最相关的形状因子（例如智能手机、平板电脑和大屏幕），那么表 16-3 中描述的能力就足够了。\n\
  \n![图像](img/00126.jpeg)\n\n**表 16-3** 用于路由视图的基础 WURFL 能力\n\n在获取请求设备的能力值之前，你必须将这些能力添加到你的账户中。允许添加的能力数量取决于你的订阅级别。你可以随时并按你喜欢的次数更改能力。请注意，一旦你更改了能力，由于内部缓存，请求可能需要几秒钟才能刷新结果。（参见图\
  \ 16-6）。\n\n![图像](img/00127.jpeg)\n\n**图 16-6** 用于选择能力的 WURFL 云用户仪表板\n\n以下是一些示例代码，用于在\
  \ Web 中报告所选能力的值。当调用示例网站的主页时，控制器会调用 API 并将结果封装在视图模型对象中：\n\n点击此处查看代码图像\n\n```csharp\n\
  private WurflService _service = new WurflService();\n\npublic ActionResult Index()\n\
  {\n    var model = _service.GetDataByRequest(HttpContext);\n    return View(model);\n\
  }\n```\n\n`WurflService` 类是应用程序层中的一个辅助类。（参见第 5 章）。该类将逻辑从控制器类中抽离：\n\n点击此处查看代码图像\n\
  \n```csharp\npublic class WurflService\n{\n    public DeviceInfoViewModel GetDataByRequest(HttpContextBase\
  \ context)\n    {\n        var config = new DefaultCloudCloudConfig\n        {\n\
  \            ApiKey = \"your API key here\"\n        };\n        var manager = new\
  \ CloudClientManager(config);\n        var info = manager.GetDeviceInfo(context,\
  \ new[]\n        {\n            \"is_smartphone\",\n            \"is_wireless_device\"\
  ,\n            \"is_tablet\",\n            \"complete_device_name\",\n         \
  \   \"advertised_device_os\"\n        });\n        var model = new DeviceInfoViewModel\n\
  \        {\n            DeviceId = info.Id,\n            DateOfRequest = info.WurflLastUpdate.ToString(),\n\
  \            Capabilities = info.Capabilities,\n            Errors = info.Errors,\n\
  \            Source = info.ResponseOrigin\n        };\n        return model;\n \
  \   }\n}\n```\n\n图 16-7 显示了当你通过模拟 Apple iPad 设备测试示例视图时得到的结果。\n\n![图像](img/00128.jpeg)\n\
  \n**图 16-7** WURFL Cloud 检测到的设备信息\n\n基于 基于设备路由视图\n\n\n\n\n\n```csharp\npublic static\
  \ Boolean IsDesktop(this HttpRequestBase request)\n{\n    return true;\n}\n\npublic\
  \ static Boolean IsSmartphone(this HttpRequestBase request)\n{\n    var info = MvcApplication.WurflContext.GetDeviceInfo(\n\
  \                request.UserAgent, new[] { \"is_smartphone\" });\n    return info.Capabilities[\"\
  is_smartphone\"].ToBool();\n}\n```\n\n与之前显示的 WURFL 云端 API 相比，我刚刚成功将管理器对象——`CloudClientManager`\
  \ 类的静态实例——保存到了全局对象中。我还向项目添加了一个 `index.smartphone.cshtml` 页面。当你使用智能手机导航时，你将看到类似于图\
  \ 16-8 所示的内容。\n\n![Image](img/00129.jpeg)\n\n**图 16-8** 为智能手机提供的页面。注意，URL 不会根据设备而改变，而且完全没有重定向。请求的处理是相同的：控制器获取请求，计算视图数据，识别根视图名称，并将其传递给视图引擎。但是，如果启用了显示模式，视图名称将经过预处理，并根据设置的条件附加后缀。如果检测到设备是智能手机，但没有找到特定的智能手机的\
  \ Razor 视图，则提供默认页面。\n\n***\n\n![Image](img/00006.jpeg) 重要\n\n显示模式（Display modes）是\
  \ ASP.NET MVC 中一个非常强大的功能，因为它允许你开发默认站点，然后在需要的地方（更重要的是，在需要的时候）添加智能手机视图。如果移动端站点完全不同，你可能只想拥有一个智能手机特定的首页，并让从那里的每个链接都指向智能手机唯一的页面。因此，内容的重复是非常有限的。\n\
  \n### 总结\n\n服务器端解决方案本质上比纯客户端基于 RWD（响应式 Web 设计）的解决方案更灵活。这是因为它允许你在向网络中发送任何内容之前检查设备。通过这种方式，网站可以智能地决定最合适的内容。但在实践中，提供特定设备的视图绝不是易事，核心问题不在于检测底层设备的机制，问题在于成本。\n\
  \n设备检测并不意味着为每个浏览器或设备提供不同版本的页面。更现实的意思是指为最常见的设备形状维护最多三或四组视图：桌面式、智能手机、平板电脑、旧式手机，可能还有大屏幕。处理多个页面无疑是有成本的。\n\
  \n目前听起来最合理的方法是拥有一个默认的响应式解决方案，以及一个独立的智能手机特定网站，仅包含与移动用户相关的用例。你可以通过部署两个不同的网站并使用某些客户端检测进行重定向来实现这一点。或者，你可以使用服务器端方法，这让你对行为有更多控制，并且在决定接纳更多设备形状时，可以更容易、更灵活地进行扩展。\n\
  \n无论何种，作为开发者，你不能忽略移动设备上的用户体验，不能自认为地认为一个响应式模板就是你需要的全部。响应式设计只是答案之一；而且它可能不是完全正确的。\n\
