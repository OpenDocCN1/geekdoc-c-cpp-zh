  \ : Controller\n{\n    private IHomeService _homeService = new HomeService();\n\
  \    public ActionResult Index(...)\n    {\n        var model = _homeService.GetIndexViewModel(...);\n\
  \        return View(model);\n    }\n}\n```\n\n是否将工作服务类抽象为接口取决于你的决定。如果抽象能带来具体的益处，那么抽象就是是一件很好的事情。前面的代码也没有使用任何形式的依赖注入。这里展示了一个手工编写依赖注入的示例：\n\
  \n点击此处查看代码图片\n\n```cs\npublic class HomeController : Controller\n{\n    private\
  \ IHomeService _homeService;\n    public HomeController() : this(new HomeService())\
  \ {}\n    public HomeController(IHomeService service)\n    {\n        _homeService\
  \ = service;\n    }\n    public ActionResult Index(...)\n    {\n        var model\
  \ = _homeService.GetIndexViewModel(...);\n        return View(model);\n    }\n}\n\
  ```\n\n## 确定工作服务类的位置\n\n工作服务类是表现层（例如，控制器）和中间层（例如，领域和基础设施）之间的连接点。所有工作服务类的集合构成了我在第\
  \ 5 章中讨论的应用程序层。\n\n你可以将应用程序层实现为独立的类库，但在大多数情况下，它可以轻松地保留在主 ASP.NET MVC 项目的边界内。我只是创建一个我喜欢的名为\
  \ `Application` 的新项目文件夹，并将所有工作服务类放在那里。因为工作服务类只是最终进入单个二进制 DLL 的编译类，所以你采用的任何文件夹结构都是可以的。\n\
