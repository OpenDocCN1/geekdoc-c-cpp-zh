  \n\n\n\n\n\n\n\n\n\n领域层由两部分组成：领域模型和一组领域服务。`Domain services`（领域服务）是类，负责任何不适合领域模型的任务。这些任务包括处理外部系统、遗留代码、数据库以及跨实体业务逻辑的实现。领域服务是领域层的一部分，但与领域模型类不同。然而，它们会使用并操作领域模型类。它们还可能需要对领域模型类具有`privileged`（特权）访问权限——例如，在公共行为方法之外设置属性。这种行为对于程序集来说是`internal`（内部）的，例如在\
  \ .NET 中，它是通过内部（而非私有或保护）属性设置器（setter）实现的。\n观察领域服务适用位置的一个良好例子，是判断特定客户是否达到了`gold customer`（金牌客户）状态。根据需求中对达到该状态的定义，操作可能涉及多个聚合根（aggregates）和数据库访问。例如，假设领域规定客户在选定产品范围内的订单超过给定阈值后即可获得该状态。\n\
  在这种情况下，需要向用户界面报告客户金牌状态信息的应用层方法会调用领域服务，并返回一个正确填充了最新数据的实例。`Customer`类的构造函数在内部被调用，`IsGold`\
  \ 属性通过内部设置器被设置。\n`Repositories`（存储库）是最流行且常用的领域服务类型。存储库关注聚合的持久化。当你需要从数据库中实例化一个聚合或将其保存回数据库时，就使用使用存储库。建议每个聚合根拥有一个存储库——`CustomerRepository`、`OrderRepository`等。如之前所述，每个聚合根一个存储库就足够表明你关注一致性和功能——聚合根负责子对象的持久化和级联选项。\n\
  ```java\n    // 或者在其中包含一些常用方法。\n具体的存储库类可以从基类接口派生：\n    ...\n### 与外部服务和遗留代码工作\n***\n\
  墨卡托投影是世界地图的图形表示。它的独特特性使其适用于航海，但不适用于如`Google Maps`之类的应用程序。如果你从墨卡托投影的视角看世界布局，你会说阿拉斯加和巴西一样大。事实情况是，巴西比阿拉斯加大五倍。然而，当你在墨卡托世界投影上绘制航线时，航线与赤道之间的角度在所有经线上保持不变。这使得早在\
  \ 1500 年代，通过量角器测量航线和方位就变得容易。\n***\n长期以来，DDD 的执行摘要一直是：拥有一个能够描述整个业务领域的对象模型是一个获胜计划。有些\
  \ DDD 项目成功了，有些失败了。在大多数情况下，是对对象力量的盲目信服说服许多开发者尝试那种方法。因此，关注它们听起来是个好主意——只是它在现实世界中运作并不好。在不获取持久化层、外部服务或两者兼顾的情况下处理订单是非常不实际的。将业务事务简化为数据库事务（即使是分布式数据库事务）可能是痛苦的，因为许多业务事务实际上是长运行事务。\n\
