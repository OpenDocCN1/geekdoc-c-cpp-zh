  \ Core 1.0 是一个全新的开源跨平台框架，用于使用 Microsoft .NET Framework 构建 Web 应用程序。它与 ASP.NET 并列，仅代表了开发者和架构师在选择\
  \ Microsoft 技术栈构建 Web 解决方案时可以提供的第二种选择。换句话说，选择 `ASP.NET` 是不够的：你还必须选择想要依赖的哪种版本的 `ASP.NET`\
  \ 平台。\n![Image](img/00029.jpeg)\n该图显示了 `ASP.NET Core` 框架与其他 .NET 库之间的依赖关系。特别是 `ASP.NET`\
  \ 平台包含了 `Web Forms` 和 `ASP.NET MVC` 库，开发者使用它们构建基于 HTML 的视图。该框架还涵盖了 `Web API` 模块，用于创建基于\
  \ HTTP 的 API。这里需要注意的相关点（特别是考虑到 `ASP.NET Core 1.0` 带来的变化）是 `Web Forms` 和 `ASP.NET\
  \ MVC` 运行在与 `Web API` 不同的运行时流水线中。特别是，`Web API` 可以托管在 `ASP.NET` 下，但如果需要，它也可以自托管或从其他容器运行。`Web\
  \ API` 引擎的流水线与 `ASP.NET` 和 Microsoft Internet Information Services (IIS) 紧密集成，它并不严格依赖于\
  \ `system.web` 程序集的服务。此外，经典的 `ASP.NET Core` 框架只能在完整的 .NET Framework 和通用语言运行时 (CLR)\
  \ 之上运行应用程序。\n`OWIN` 是 `Open Web Interface for .NET` 的缩写，它定义了一个标准接口，Web 服务器和 Web\
  \ 应用程序可以在其中进行交互。`OWIN` 的初衷值得赞誉，即将服务器和应用程序解耦，导致这样一个世界：同一个 Web 应用程序可以托管在仅暴露 `OWIN`\
  \ 接口的通用容器中。换句话说，`OWIN` 与那种“集成式 ASP.NET/IIS 流水线”完全相反，而后者在几年前还被视为 ASP.NET 开发的一项重大成就。\n\
  ### 查看 ASP.NET Core 1.0 中的架构依赖关系\n例如，你可以在 .NET Framework（ 4.5.2 及更高版本）之上运行 `ASP.NET\
  \ Core 1.0` 应用程序，并利用完整的 API set。这保证了你的解决方案与现有代码具有最大的兼容性。同时，你可以在最新的 .NET Core 之上运行\
  \ `ASP.NET Core 1.0`，并享受其中的新功能和更小的内存占用。最后，在未来的某个时刻，你还可以在运行于 Linux 和 Mac 的 .NET Core\
  \ 跨平台实现上运行 `ASP.NET Core 1.0`。\n![Image](img/00030.jpeg)\n`ASP.NET Core 1.0` 平台包含了用于构建\
  \ HTML 视图的 `ASP.NET MVC` 库和作为基于 HTTP API 主要构建模块的 `Web API`。如你所见，它不包含对 `Web Forms`\
  \ 的支持。因此，如果你拥抱 `ASP.NET Core 1.0` 平台，你必须处理 `Web Forms` 的缺失。\n新的 ASP.NET 栈确实比目前的栈更简洁、更不臃肿，并尝试进行一些过时的清理。配置基础设施基于\
  \ JSON 文件并是完全自定义的，因此不再有像 `web.config` 这样的单一入口点。此外，如图 4-3 所示，新的 ASP.NET 栈可以在不同版本的\
  \ .NET Framework 上运行。\n#### 从 CTO 视角看 ASP.NET Core 1.0\n\n![Image](img/00003.jpeg)\
  \ 完全忽略 ASP.NET Core 1.0，照常进行进行业务：使用相同的框架、相同的编码体验和相同的部署选项，并且不实现任何额外功能。你不会失去现在所拥有和能够做的任何东西。\n\
  ASP.NET Core 1.0 为微软在未来至少 10 年的 Web 技术栈奠定了基础。它继承了当前栈的足够特性，增加了一些破坏性更改，并设定了新的目标和方向。无论你喜不不喜欢，你都无法长时间忽视\
  \ ASP.NET Core 1.0。\n### 理解 DNX 运行时环境\n### 使用完整的 .NET Framework\n那么，如果你仍然想要或需要目标是完整的\
  \ `.NET Framework`，升级到 ASP.NET Core 1.0 的意义何在？\n![Image](img/00006.jpeg) 重要\n###\
  \ 引入 .NET Core\n选择 `.NET Core` 框架有几个关键优势。\n`.NET Core` 让你更容易只挑选你需要的功能，从而让你对占用空间和所依赖的功能拥有完全控制权。最后，`.NET\
  \ Framework` 的 `.NET Core` 版本是为了跨平台设计的。因此，当你完成应用程序时，它可以在任何托管了兼容版本的 `DNX` 运行时的平台上运行。但这种方式不仅适用于部署，开发也是如此。事实上，开发者可以在任何受支持的平台上本地编写和测试应用程序。\n\
  如果你计划目标是 `.NET Core`，首先要进入从头开始（重新）编写整个应用程序的心态——表示层、业务层和后端。这样做可能比你想象的要容易，但努力的范围接近于完全重写而不仅仅是更新。显然，对于开发新应用程序，`.NET\
  \ Core` 是一个严肃的候选者，唯一的代价是学习一种新口味的 `ASP.NET API`。\n目前计划有一天拥有一个跨平台的 `.NET Core` 运行时。开发正在大量的社区努力下进行，但在达到生产级水平之前还有很长的路要走。如果你希望以跨平台的方式使用\
  \ `.NET`，那么最好也看看 `Mono`。然而，好消息是跨平台的 `.NET Core` 将到来。\n估计通用 平台的使用量仅次于 PHP。然而，大多数\
  \ ASP.NET Web 应用程序都基于 ASP.NET Web Forms 框架。相反，新的 ASP.NET Core 1.0 框架专注于一个新的管道，其中\
  \ `ASP.NET MVC` 用于提供 HTML 视图和数据，而 Web API 作为仅数据服务的选项。\n尽管在可预见的未来 Web Forms 将获得完全支持，甚至得到一些改进，但\
  \ ASP.NET Core 1.0 的发展方向传递了一个明确的信息：只要业务允许，请尽快离开 ASP.NET Web Forms。这一策略对于任何组织及其组织周围的人来说都是正确的选择。然而，在这种背景下，有许多不同的场景可能会导致不同的决策。让我们来看看其中的一些。\n\
  这是你现在听到的最常见的用户故事之一：公司有一个几年前的 Web 应用程序，但运行良好。由于该应用程序多年来经过适当微调，其性能可以，而且没有引起任何严重的可扩展性问题。此外，团队中的人员知道如何维护和演进它。\n\
  \n如果你遇到这些场景，应该如何重构应用程序呢？你应该坚持使用 `Web Forms`，还是投资于 `ASP.NET MVC` 或 `SPA`？`Web API`\
  \ 的角色又是什么？让我们抛开任何偏见，仔细分析一下 `ASP.NET Web Forms` 的优缺点。\n`ASP.NET Web Forms` 最初设计于\
  \ 20 世纪 90 年代后期，正值浏览器战争激烈时期。当时，任何包含编写 Web 应用程序、尽可能减少学习 Web 相关知识的影响并掌握浏览器特定特性的开发方法都受到欢迎。`ASP.NET\
  \ Web Forms` 确实脱颖而出，其取胜之举是引入了服务器控件（server controls）。\n`server controls` 被证明是一个强大的范式。`Microsoft`\
  \ 打包了一系列核心控件，同时提供了创建自定义控件的 `API`。整个行业分支几乎在夜之间诞生，生产并销售日益丰富的 `server controls` 家族。对于\
  \ `Web Forms` 开发者来说，表现层从未是一个真正需要担心的问题。\n`ASP.NET Web Forms` 在 2005 年的 `2.0` 版本达到了巅峰。从那时起，该框架没有收到重大更新，除了一些微小的改进以减少\
  \ `viewstate`（回传模型的可行部分）的影响，并对 HTML 和 CSS 的生成提供更多控制之外。\n`ASP.NET Web Forms` “开箱即用”，但它确实包含了日益过时的\
  \ Web 应用程序设计原则。你仍然可以使用 `ASP.NET Web Forms` 构建 Web 应用程序，你仍然可以找到并购买大量的商业库和工具。该平台成熟且可靠，尽管它未来可能不会获得更多的关注，但它也不会一夜之间消失。\n\
  从设计角度来看，`Web Forms` 已经过时，但它仍然可以让你利用它自己的工具快速安排解决方案。如果你可以使用这些工具来实现你的业务目标，为什么要放弃它们呢？坚持使用\
  \ `Web Forms` 严格取决于你所面临的业务需求。要问的问题是：“`Web Forms` 能胜任新任务吗？”\n表现层的需求——特别是响应式、手势和触摸优先的用户体验——是其他可能的痛点。离开\
  \ `Web Forms` 可能意味着重新培训人员的成本，以及人们学习新范式（无论是 `MVC` 还是像 `AngularJS` 的新框架）并精通 `JavaScript`\
  \ 的困难。另一方面，如果你观察 `ASP.NET Core 1.0`，你会发现方向是转向 `ASP.NET MVC` 的。在这方面，我敢说，越早转换越好。\n\
  `ASP.NET Web Forms` 在设计时，对 HTML 和 `JavaScript` 的抽象被认为是一种极好的优势。现在已经如此了。因此，如果你发现 `Web\
  \ Forms` 编程模型在你面临的业务场景中遇到了局限，即使它是可行的，你也应该转向 `ASP.NET MVC` 或 `SPA`。以这种方式移动并关注 `ASP.NET\
  \ Core 1.0`，你将处于有利位置。\n总之之，离开 `Web Forms` 的主要原因并不是技术性的。现代软件的主要挑战，以及我们希望修复遗留代码的主要方面，是信息架构和后端。正如所见，这与选择\
  \ `Web Forms` 还是 `ASP.NET MVC` 关系不大。然而 `Web Forms` 鼓励（尽管不是强制）使用基于数据库驱动的编程模型，这通常预示着双层架构。\n\
  \n\n\n\n\n\n\n\n\n\n\n\n\n\n\n我所看到的问题是，一个在 Web 上通过并执行核心 `CRUD` 操作的 `REST` 接口，只有在某些真实的业务领域中才是运行良好的模型。如果你带着这种想法成长，那么当你面对一个查询堆栈与命令堆栈完全不同、且理想情况下需要完全不同的模型的领域时，可能会遇到严重的问题。抛弃\
  \ `REST` 概念并关注任务——这更像是采用远程过程调用（`RPC`）风格而非 `REST` 风格——是一个更好的方法，因为关注任务并不会阻止你在应用仅有此类需求时执行\
  \ `REST`，同时，如果存在更复杂的情况，它也能让你对更复杂的事务保持开放态度。\n## 探讨 ASP.NET Web API 的角色\n`ASP.NET\
  \ Web API` 前端通常用于为网页提供 HTTP 可达的端点，并返回原始数据（例如 `JSON`、`XML` 或纯文本）。原始数据然后在浏览器中渲染成美观格式。\n\
  ### 从 WCF 迁移 Web API\n为了以这种方式工作，`WCF` 需要一个丰富且通用的基础设施，对于只想使用单一协议的场景来说，它太复杂且昂贵了。换句话说，`WCF`\
  \ 从未关注过 `HTTP`。\n尽管 `ASP.NET Web API` 有时被认为是 `ASP.NET MVC` 的分支，但它是一个通用框架，甚至不仅限于\
  \ Web 场景。`ASP.NET Web API` 可以托管在任何类型的 `.NET` 应用程序中，包括 `Windows service` 或 `console\
  \ application`。如果它托管在 `Web Forms` 应用程序中，你会发现编写通过 `jQuery` 函数从 HTML 页面调用的 Web 服务要容易得多。事实上，你可以使用\
  \ `ASP.NET Web API` 来替代 `WCF`，停止依赖 `JavaScript` 代理并告别配置上的困难。\n***\n得益于 `ASP.NET\
  \ Web API`，在某些情况下不仅是安全的，而且是推荐的，将 `WCF` 服务的使用限制在那些需要或可能请求非 HTTP 通信的中。如果你确定继续使用 `HTTP`\
  \ 作为传输协议，请务必放弃 `WCF` 改用 `ASP.NET Web API`。使用 `ASP.NET Web API` 编写要简单快捷得多，而且由于显著减小的内存占用和工作负载，它还提供了更好的性能。\n\
  ### 比较 ASP.NET Web API 和 ASP.NET MVC\n它们也有一些重要的区别。\n![Image](img/00003.jpeg) 内容协商是不同的。\n\
  `ASP.NET Web API` 层由一组派自 `ApiController` 基类的 `controller` 类组成。定义在控制器上的 `GET` 方法可以直接返回原始数据，而不需要像\
  \ `ASP.NET MVC` 那样显式地传递 `ActionResult` 容器。这是一个示例：\n```csharp\n    // 这是请求的处理代码\n\
  \    var news = DoSomethingToParseRFeed(rss);\n```\n点击此处查看代码\n{\n    var rss = client.DownloadString(url);\n\
  }\n\n\n在 ASP.NET Web API 的底层隐藏着许多约定。例如，所有名称以 `Get` 开头的方法都会自动绑定到 HTTP GET 操作，且 URL\
  \ 将变为去掉了 `Get` 前缀后的方法名。在示例中，两个方法都是通过类似 `/news` 的 URL 用的。如果你将 ASP.NET Web API 方法重命名为\
  \ `GetAll`，那么调用它的 URL 就会变为 `/news/all`。\n如果你已经有一个 ASP.NET MVC 应用程序，你仍然可以暴露一个 HTTP\
  \ 前端，并且简单快速地编写它，只需使用与你渲染 HTML 时相同的控制器类即可。这种情况下不会发生内容协商（Content negotiation），但由控制器来决定返回数据的格式。这里有一个控制器在\
  \ JSON 和 XML 之间选择的示例：\n```csharp\n    var url = ...;\n    // 显式的 JSON 序列化步骤\n  \
  \  return Json(news, JsonBehavior.AllowGet);\n一切都在你的完全控制之下。没有任何“魔法”发生的地方，你只使用一个运行时环境。\n\
  ## 论 REST\n这是事实 true。\n无论如何，如果你喜欢以 REST 的方式编写代码——即对服务器端拥有的实体执行基础的 HTTP 操作——即使在 ASP.NET\
  \ MVC 的语境下使用 ASP.NET Web API 也是一个可以接受的选择。我只是想澄清并从某种程度上消除“如果你需要一个区别于核心站点的服务层，就需要\
  \ ASP.NET Web API”这一点的误。这还是老故事：关键在于决定如何托管 Web 服务，以及是围绕 REST 还是 RPC 接口来创建它。\n显然，如果你阅读一些关于\
  \ ASP.NET Core 1.0 的文档，它们似乎都与 图 4-3 所示的一致。在 ASP.NET Core 1.0 中，你拥有 ASP.NET MVC 和\
  \ ASP.NET Web API 的支持，它们都运行在相同的运行时环境和管道之上。然而，如果你仔细观察，你拥有的只有一个框架，它从 ASP.NET MVC 的核心功能开始，并仅通过\
  \ Web API 借用的一些特定功能对其进行扩展。具体意味着什么？\n点击此处查看代码图片\npublic class NewsController : Controller\n\
  \    {\n\n        // 删除该项\n}\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\
  \n\n\n\n\n\npublic ActionResult SignIn(string username, string password, bool rememberme)\n\
  \    ...\n{\n\n\npublic class LoginInputModel\n    public bool RememberMe { get;\
  \ set; }\n```\n## 视图模型\n在 `ASP.NET MVC` 中，有几种方法可以将数据传递给 `view engine` 并将其整合到生成的视图中。你可以使用\
  \ `public dictionary`（如 `ViewData`）、`dynamic object`（如 `ViewBag`），或者一个收集所有属性进行传递的定制类。你创建的任何用于携带数据以整合到响应中的类都贡献于创建视图模型。应用程序层是接收输入模型类并返回视图模型类的层：\n\
  ```csharp\n    return View(model);\n在未来，持久化的理想格式将与呈现的理想格式不同。表现层负责定义可接受数据的清晰边界，而应用程序层负责以这些特定格式接受和提供数据。如果你广泛采用这种方法，那么你就符合第\
  \ 3 章中概述关于 UX 驱动软件设计的原则。\n![Image](img/00004.jpeg) 备注\n***\n为了继续业务操作，表现层需要对系统后端引用。应用程序业务层中入口的形状和颜色取决于你实际上如何组织它。\n\
  在 `ASP.NET MVC` 解决方案中，你可以从 `controller` 直接调用 `infrastructure layer`。但通常，你希望在 `controller`（例如作为表现层的一部分）和\
  \ `repositories`（例如作为基础设施层的一部分）之间有一个或两个中间层。请看图 5-4](#part0011.html_ch05fig04)。\n\
  **图 5-4** 基于聚合的分层架构部分\n### 系统后端的入口\n`OrderService` 类的方法获取输入模型类并返回视图模型类。内部，该类执行任何必要的转换，以使数据能够在表现层上良好地渲染并为后端处理做好准备。\n\
  \n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n在简化领域层架构的背景下，我需要在此进一步解释两个术语：`aggregates`（聚合）和 `repositories`（仓储）。\n\
  一个 `repository`（仓储）是一个用于管理相关领域对象或领域对象聚合持久化的组件。你可以为仓储分配任何你喜欢的编程，尽管许多开发者在设计这些类时，会将类型\
  \ `T` 设计为相关的领域类型。\n在领域层中，你应该关注表达业务规则和流程的类。你不应该目标于识别要持久化的数据聚合。你识别的任何聚合都应该简单源于你的业务理解和建模。接下来，你面临持久系统状态的问题。\n\
  ### 基础设施层\n#### 当前状态存储\n仓储的结构可以是类似于 CRUD（增删改查）的，这意味着你在泛型类型 `T`上有 `Save`、`Delete`\
  \ 和 `Get` 方法，并使用谓词查询数据的即时部分。没有什么阻止你为你的仓储提供一种远程过程调用（RPC）风格的方法，其方法反映了动作——无论这些动作是读取、删除还是插入——都服务于业务目的。\n\
  #### 事件存储\n事件溯源并不对所有应用程序都有用。事实上，开发者几十年来一直愉快地忽略了它。然而，今天，越来越多的领域专家需要跟踪软件可以产生的事件序列。你无法以保存当前状态为中心的存储哲学做到这一点。当事件成为你应用程序的主要数据源时，一些事情发生了变化，对新工具的需求也随之产生。\n\
  **图 5-5** 一条表示对 ID 为 `#1` 的书籍实体更新的新记录\n在基于事件的数据存储中进行更新会立即在查询方面产生几个问题。你如何知道给定记录是否存在，或者如果它存在，它的当前状态是什么？这需要一个即时的查询层，该层在概念上选择所有匹配\
  \ ID 的记录，然后分析数据集事件。例如，它可以根据 `Created` 事件的内容创建一个新的数据实体，然后重放所有后续步骤，并返回流结束时的结果。这种技术被称为\
  \ `event replay`（事件重放）。\n事件溯源为架构师和领域专家提供了更大的力量来设计有效的解决方案，但目前它需要大量的额外工作来创建和运行必要的设施。事件溯源需要一类新工具——*event\
  \ stores*（事件存储）。事件存储是另一种数据库，具有公共 API 和为事件数据项量身定制的编程语言。\n## 缓存层\n极少有应用无法在一两秒的数据缓存中生存下来。在高流量网站中，一两秒的差异就意味着一切。因此，在许多情况下，缓存已成为构建在即时框架（实际上是内存数据库）周围的一层额外结构，例如\
  \ `Memcached`、`ScaleOut` 或 `NCache`。\n基础设施层的另一个场景是数据仅通过 Web 服务访问。这种场景的一个很好的例子是：Web\
  \ 应用程序运行在某些客户关系管理（CRM）软件之上，或者必须使用公司的专有服务。总来说，基础设施层负责适地封装外部服务。\n### 总结\n在本章中，我介绍了一种通用且灵活的架构，它可以适应你今天可能编写的任何类型的软件。它是我们从小成长的经典多层架构的一个演进阶段。尽管它显然只增加了一层，但它对我们思考和做事的方式产生了深远影响。\n\
  # 第二部分：开发\n- **第 10 章** 组织 ASP.NET MVC 项目](#part0017.html_ch10)\n\n\n\n\n\n\n\n\n\
  \n现代 Web 中一个很长一段时间内都不存在的方面是实时更新。在这方面，`ASP.NET SignalR` 绝对非常棒，而且是真正的必备品。它对你的代码完全没有侵入性，并且具有异常简单且自然的编程模型。它真的让网页看起来是活跃且实时更新的。\n\
  那么，为什么我们听到这么多关于 `ASP.NET Core 1.0` 新颖、酷炫且具有革命性的炒作呢？让我先说结论：不，`ASP.NET Core 1.0` 并没有改变\
  \ Web 的风味。此外，它甚至没有带来哪怕一点真正的新功能。然而，它有其目的，可能对公司具有某某种作用。\n最近，我参与了一个关于如何处理那些不再将接收（重大且主要）更新的技术的长时间线讨论。正如你可能猜到的那样，存在两个观点鲜明的阵营。一派认为这些技术已经死掉，并倾向于尽快放弃它们，就像跳离一艘正在沉没的船一样。另一派则倾向于只要这些技术还能满足业务需求，就继续使用它们。\n\
  ## 无物可加了\n当一项技术简单地没有更多内容可以添加，且其技术团队正在“挖底”以寻找任何可以添加的内容时，这项技术的真实健康状况如何？\n那么，有人错的吗？有人是对的吗？\n\
  ## 是潜力释放还是软件过时？\n释放释放与过时之间的界限非常模糊，而过时在表达完全部潜力之后就会到来。在软件中，过时与硬件不同，因为几乎不涉及任何物理损坏或消耗。过时的软件仍然可以运行、工作并支撑起整个公司或业务。（顺便说一下，我们通常称之为\
  \ `legacy code`遗留代码！）\n### ASP.NET Core 1.0 没有新功能\n嗯，这并不是什么新花样。我们今天经典的 `ASP.NET`\
  \ 平台上拥有完全相同的能力。`ASP.NET Core 1.0` 不会给你任何能增加你编程能力的新功能。因为它是 `Microsoft` Web 栈的重写，它在\
  \ Web 应用程序背景下你通常想做的某些事情提供了一种不同的方式。如果有升级到 `ASP.NET Core 1.0` 的理由，那么，这并不是功能性的理由。\n\
  目前的 `ASP.NET` 运行在 90 年代后期设计的相同运行时之上。在某些时刻，通过 `Internet Information Services` (`IIS`)\
  \ `7`，该运行时被集成。在短短几年内，情况发生了巨大的变化。今天，每个通过 `ASP.NET` 请求的平均内存占用约为 `20 KB`。这些数字对某些人和企业有效，但对另一些人无效。\n\
  重点在于，为了充分利用 `ASP.NET Core 1.0`，你应该针对 `.NET Framework` 的不同版本，即上述的 `.NET Core`。这个框架消除了一些不常用的\
  \ API，并重写了其他 API 以不同的方式实现相同的功能。这些是破坏性更改，不如此说。然而，如果你做了这个改变，你就能很好地体验内存占用的极大下降。如果你对\
  \ `IIS` 以及它今天对你的托管没有意见，那么，无论如何炒作，你仍然可以忽略 `ASP.NET Core 1.0` 并保持快乐。\n此时人们可能会提出的下一个问题是为什么？为什么我们需要\
  \ `ASP.NET Core 1.0`，为什么 `Microsoft` 要进行如此庞大的重构？是因为某些客户要求这样做吗？可能吧，但我认为其中还有其他原因。\n\
  \n\n\n\n\n\n\n\n\n\n\n`ASP.NET` 最初设计于 20 世纪 90 年代。今天仍在行的运行时核心追溯到十年前——这是一个非常长的时间。此外，最初\
  \ `ASP.NET` 设计为与互联网信息服务 (`IIS`) 深度集成。几年前，微软通过发布 `IIS 7` 庆祝了 `ASP.NET` 和 `IIS` 的完全合并。这被称为集成管道。\n\
  \n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\
  \n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n  \"compilationOptions\": {\n    \"Microsoft.AspNet.IISPlatformHandler\"\
  : \"1.0.0\",\n    \"web\": \"Microsoft.AspNet.Server.Kestrel\"\n    \"dnxcore50\"\
  : {}\n    \"node_modules\"\n    \"**.vspscc\"\n\n除非近期提供了特定的工具，否则大多数情况下必须手动更新。但当你代码中引用缺失包的类时，Visual\
  \ Studio 会提供添加这些包并静默编辑项目文件。\n\n### ASP.NET Core 应用的最小依赖\n\n正如你所见，ASP.NET Core 项目至少依赖于\
  \ IIS 平台和被称为 `Kestrel` 的东西。图 7-7 详细说明了 ASP.NET Core 应用在 Windows 和非 Windows 平台上的托管模型。要在\
  \ IIS 中托管，你需要安装 `IISPlatformHandler` 组件，该组件也必须从应用程序引用。该组件负责启动 DNX 并转发请求。\n\n\n\n\
  \n\n平台安装程序最终会将请求转发到应用程序 `project.json` 文件中指定的 `web command`。\n\n`DNX` 进程托管了一个通用的\
  \ `ASP.NET Core` Web 服务器（跨平台），它知道如何通过 `ASP.NET Core` 流水线处理请求。这个通用 Web 服务器被称为 `Kestrel`。\n\
  \n## 应用程序启动\n\n为了启动 Web 应用程序，托管层需要识别用户应用程序中的入口。该入口是一个名为 `Main` 的静态方法。按照惯例，该方法定义在名为\
  \ `Startup` 的类中。然而，它可以——我认为也应该——被移动到其他地方，以更好地强调它的作用，这与 `Startup` 类的作用是不同的。假设你在 Visual\
  \ Studio 2015 中调用的空项目模板中添加了如下所示类：\n\n点击此处查看代码图片\n\n```csharp\npublic class App\n\
  {\n    public static void Main(string[] args) => WebApplication.Run<Startup>(args);\n\
  }\n```\n\n`WebApplication` 类定义在托管层中，负责实例化名为 `Startup` 的类。\n\n`Startup` 类包含两个方法：`Configure`\
  \ 和 `ConfigureServices`。这两个方法都从 `ASP.NET Core` 运行时调用。前者用于配置 HTTP 请求流水线。后者用于将服务注入到\
  \ `ASP.NET Core` 请求栈中。\n\n### 配置 HTTP 流水线\n\n至少，流水线必须引用 `IIS` 平台安装程序，但很可能还需要启用静态文件服务和\
  \ `MVC` 路由支持：\n\n点击此处查看代码图片\n\n```csharp\npublic void Configure(IApplicationBuilder\
  \ app)\n{\n    app.UseIISPlatformHandler();\n    app.UseStaticFiles();\n    app.UseMvc(routes\
  \ =>\n        routes.MapRoute( name: \"default\",\n                          template:\
  \ \"{controller=Home}/{action=Index}/{id?}\")\n    );\n}\n```\n\n要启用静态文件和路由的提供，你必须添加新的包。幸运的是，Visual\
  \ Studio 会检测到缺失的包并提供点击即可恢复的建议。这种整体体验类似于在早期版本的 Visual Studio 中安装 `ReSharper`。你可能想要的另一个包是诊断程序包，以便在开发期间显示详细的异常页面。（参见图\
  \ 7-8。）\n\n点击此处查看代码图片\n\n```csharp\napp.UseDeveloperExceptionPage();\n```\n\n![Image](img/00044.jpeg)\n\
  \n**图 7-8** 在 Visual Studio 2015 ASP.NET Core 项目中添加缺失的包\n\n注意，如果没有上一行代码，你甚至无法获得你在经典\
  \ Web Forms 和 `ASP.NET MVC` 中收到无数次的经典黄色错误页面。\n\n在 `ASP.NET Core` 之前，在从头创建一个新项目后，在你安排好视图基础设施（包括控制器方法和布局）之前，你看不到任何具体的输出。在\
  \ `ASP.NET Core` 中，如果你在 Visual Studio 加载后立即运行空项目，你仍然能看到某些东西，最可能是一个 `hello-world`get。这是由于以下代码，你默认可以在\
  \ `Startup` 类的 `Configure` 方法中找到它：\n\n点击此处查看代码图片\n\n```csharp\napp.Run(async (context)\
  \ =>\n{\n    await context.Response.WriteAsync(\"Hello World!\");\n});\n```\n\n\
  当你开始添加控制器类和 Razor 视图时，就会删除这段代码。\n\n***\n\n![Image](img/00004.jpeg) 备注\n\n`Configure`\
  \ 方法必须接受至少一个 `IApplicationBuilder` 参数。然而，你可以可选地添加两个类型为 `IHostingEnvironment` 和 `ILoggerFactory`\
  \ 的参数，这些参数将由运行时传递给你。\n\n### 向 ASP.NET 请求栈添加服务\n\n仅凭应用程序构建器的唯一配置不足以让网站产生任何实质性内容。在此阶段，应用程序甚至还称不上是一个\
  \ `ASP.NET MVC` 应用程序。你需要显式注入对 `MVC core` 服务的引用：\n\n点击此处查看代码图片\n\n```csharp\npublic\
  \ void ConfigureServices(IServiceCollection services)\n{\n    services.AddMvc ();\n\
  }\n```\n\n到此时，只要你添加了控制器，就会开始获得一些可见的输出。\n\n你可能还想向 `ASP.NET` 栈添加其他一些服务，例如处理应用程序选项并在跨控制器和视图全局范围内共享对象实例的服务、额外的代码层和视图。\n\
  \n在 `ASP.NET Core` 中，`service` 是应用程序不同部分可能消费的共享组件。服务通过依赖注入提供给应用程序。`ASP.NET Core`\
  \ 自带一个集成容器，但它可以被你选择的容器所替换。与实例管理相关的服务有三种口味：\n- `transient`（瞬态）服务在每次需要时都会创建一个。\n-\
  \ `scoped`（作用域）服务仅在不存在实例时才创建。\n- 最后，`singleton`（单例）服务允许只有一个实例。\n\n### 显示主页\n\n在\
  \ `ASP.NET Core` 中，控制器和视图与你所知的没有太大。一个细微但明显的区别是方法的返回类型现在是 `IActionResult`：\n\n```csharp\n\
  public class HomeController : Controller\n{\n    public IActionResult Index()\n\
  \    {\n        ViewBag.Title = \"Hello World\";\n        return View();\n    }\n\
  }\n```\n\n视图引擎的工作方式与经典的 `ASP.NET MVC` 相同，Razor 视图文件必须以相同的方式组织——即位于 `Views` 文件夹。Razor\
  \ 有一些附加功能，如标签辅助和 `@inject` 方法，但现有代码仍然有效。\n\n## 应用程序设置\n\n在旧的 `ASP.NET` 应用程序中，开发者以前将全局设置存储在\
  \ `web.config` 文件的 `appSettings` 部分，或者在安全的全局静态成员中。这在 `ASP.NET Core` 中是不可能的。\n\n\
  ### 从持久化存储读取设置\n\n在 `ASP.NET Core` 中处理应用程序设置是从 `Startup` 类执行的两个步骤。首先从持久化文件读取信息，然后将数据复制到内存容器中并作为服务注入。\n\
  \n新的配置基础围绕构建器的概念构建，你可以为任何数据格式创建自定义构建器，无论是 `JSON`、`XML` 还是数据库架构。默认情况下，你将数据保存在 JSON\
  \ 文件中。假设项目中添加了以下 JSON 文件并命名为 `MyAppSettings.json`：\n\n```json\n{\n  \"Data\": {\n\
  \    \"Title\": \"Hello, world\",\n    \"Build\": \"1.0.0\"\n  }\n}\n```\n\n添加到\
  \ `Startup` 类构造函数的以下代码将读取它：\n\n```csharp\npublic class Startup\n{\n    private IConfigurationRoot\
  \ _appSettings;\n    public Startup(IHostingEnvironment env, IApplicationEnvironment\
  \ appEnv)\n    {\n        var builder = new ConfigurationBuilder()\n           \
  \ .AddJsonFile(\"MyAppSettings.json\");\n        _appSettings = builder.Build();\n\
  \    }\n}\n```\n\n`_appSettings` 变量仅仅 JSON 流中的一个指针，它并不包含从实际文件中提取的显式值。还需要另一个步骤将 JSON\
  \ 文件的内容映射到对象。\n\n\n\n\n\n点击此处查看代码图片\n\n```csharp\npublic class MyAppSettings\n{\n\
  \    public string Title { get; set; }\n    public string Build { get; set; }\n\
  }\n```\n\n要将 JSON 内容复制到 `MyAppSettings` 实例中，请按照以下步骤操作。在 `Startup` 类的 `ConfigureServices`\
  \ 方法中添加以下代码：\n\n点击此处查看代码图片\n\n```csharp\nservices.Configure<MyAppSettings>(settings\
  \ =>\n{\n    settings.Title = _appSettings[\"Data:Title\"];\n    settings.Build\
  \ = _appSettings[\"Data:Build\"];\n});\n```\n\n刚刚创建的 `MyAppSettings` 类的实例现在已准备好注入到\
  \ ASP.NET 应用程序堆栈中。不过，它必须被包装在一个公共接口中，并且必须为该包装接口添加服务：\n\n```csharp\nservices.AddOptions();\n\
  ```\n\n现在，对于需要使用全局应用程序设置的类（例如控制器），还需要进行一些工作。\n\n\n\n### 消费应用程序设置\n\n应用程序设置现在可以注入到由\
  \ ASP.NET 容器控制的任何组件中。这对于控制器以及注入到控制器的类来说无疑如此。以下是重写控制器类以使用从 JSON 文件配置的任何数据的方法：\n\n\
  点击此处查看代码图片\n\n```csharp\npublic class HomeController : Controller\n{\n    private\
  \ MyAppSettings _settings;\n    public HomeController(IOptions<MyAppSettings> accessor)\n\
  \    {\n        _settings = accessor.Value;\n    }\n    public IActionResult Index()\n\
  \    {\n        ViewBag.Title = String.Format(\"{0} [{1}]\", _settings.Title, _settings.Build);\n\
  \        return View();\n    }\n}\n```\n\n控制器的构造函数现在接收一个 `IOptions<T>` 参数，并将包装的内容保存到本地成员中。控制类的其他成员就可以使用注入的值了。\n\
  \n***\n\n![图像](img/00004.jpeg) 注意\n\n尽管从代码建模的角度来说，我不真正推荐这样做，但你甚至可以通过 `@inject` 命令直接将对象实例注入到\
  \ Razor 视图中。我喜欢的方法是将视图模型类（view-model）传递给视图，并在控制器中构建视图模型类的实例，传递所需的注入数据。\n\n### 身份验证\n\
  \nASP.NET Core 还对身份验证过程引入了一些更改。准确地说，引入更改并不是为了仅仅用不同的方式来实现功能，而是因为对 OWIN 标准的支持。简而言之，OWIN\
  \ 是一个抽象接口，定义了 Web 服务器与 Web 应用程序之间的交互模型。\n\n如所述，ASP.NET 最初设计于 20 世纪 90 年代，与 IIS 密耦合。后来，这种紧密耦合证明是痛苦而非收益，OWIN\
  \ 的引入是为了为相同的具体事务（如身份验证和授权）定义一个通用的交互模型。因此，在 ASP.NET Core 中，你必须明确指定你期望的身份验证形式，以及你期望身份令牌如何被保存和携带。最终，这与你要在\
  \ `web.config` 文件的 `authentication` 部分中执行的操作并没有太大区别；你只是通过不同的 API 完成这些操作。\n\n####\
  \ ASP.NET Identity 与 纯身份验证\n\n大多数 ASP.NET Core 应用程序示例使用 ASP.NET Identity 框架来实现登录表单和凭据验证。我认为\
  \ ASP.NET Identity 至少对于那些只需要检查纯用户名和密码对的简单场景来说，具有极高的复杂性。如果你有尝试 ASP.NET Identity（以及它一些更高级的功能，如双因子身份验证），你可以简单地使用\
  \ Visual Studio 2015 ASP.NET Core 模板并启用身份验证机制。如果你想学习如何在 ASP.NET Core 中一步步构建基于 Cookie\
  \ 的纯身份验证，请继续读下去。\n\n#### 启用 Cookie 身份验证\n\nCookie 身份验证是应用程序配置的一部分。你需要通过从 `Startup`\
  \ 类的 `Configure` 方法执行特定调用来启用它：\n\n点击此处查看代码图片\n\n```csharp\napp.UseCookieAuthentication(new\
  \ CookieAuthenticationOptions\n{\n    LoginPath = \"/account/login\",\n    AuthenticationScheme\
  \ = \"Cookies\"\n});\n```\n\n你看到的这些设置与经典 ASP.NET 中 `web.config` 文件中输入的典型项目并没有真正区别。你仍然使用常用的\
  \ `Authorize` 特性来限制访问特定的控制器部分，仅允许经过身份验证和授权的用户访问。\n\n要创建身份验证 Cookie，你需要使用不同的代码，这些代码是现在不再支持的旧\
  \ `FormsAuthentication` 类的功能性替代：\n\n点击此处查看代码图片\n\n```csharp\npublic async Task<IIActionResult>\
  \ Post(LoginModel input)\n{\n    // 验证凭据\n    if (!ValidateCredentials(input.Username,\
  \ input.Password))\n    {\n        return RedirectToAction(\"error\");\n    }\n\
  \    // 创建身份验证 cookie\n    var claims = new List<Claim>\n    {\n        new Claim(\"\
  username\", input.Username)\n    };\n    var id = new ClaimsIdentity(claims, \"\
  Cookies\");\n    await HttpContext.Authentication.SignInAsync(\"Cookies\", new ClaimsPrincipal(id));\n\
  \    return Redirect(\"/\");\n}\n```\n\n`LoginModel` 类仅仅是一个包装输入内容的类。`async/await`\
  \ 接口是因为 HTTP 环境中的 `Authentication` 对象而需要的。\n\n##### 检测用户\n\n要检测当前用户是否已身份验证，你使用标准的\
  \ `User.Identity` 并检查 `IsAuthenticated` 属性：\n\n点击此处查看代码图片\n\n```html\n@{\n    if\
  \ (User.Identity.IsAuthenticated)\n    {\n        <a class=\"btn btn-primary\" href=\"\
  @Url.Action(\"logout\", \"account\")\">@User.Identity.Name</a>\n    }\n    else\n\
  \    {\n        <a class=\"btn btn-primary\" href=\"@Url.Action(\"login\", \"account\"\
  )\">登录</a>\n    }\n}\n```\n\n身份验证的所有其他方面保持不变，包括返回 URL 的检测和模型状态的验证。\n\n#### Web 编程的其他方面\n\
  \nWeb 编程的其他方面也受到了 ASP.NET Core 出现的影响。如所述，ASP.NET Web Forms 不再是一个选项。因此，在加入 ASP.NET\
  \ Core 队列之前，建议你熟悉 ASP.NET MVC 编程的模式。\n\n##### Web API\n\n在 ASP.NET Core 出现之前，Web\
  \ API 和 ASP.NET MVC 是不同的框架，具有相同的类名和兼容的概念，但流水线完全不同。作为一个过去五六年里主要从事 ASP.NET MVC 编程的人，我从未认为\
  \ Web API 是一个值得认真关注的框架。我只是将 Web API 之上的 OData 功能视为加分项，这可能导致我使用基于 Web API 的独立 Web\
  \ 服务。从纯逻辑的角度来看，我无法理解为什么要有两种不同类型的控制器，尽管 Web API 是基于一个非常接近 ASP.NET Core 的更现代流水线。\n\
  \n\n\n\n\n底而言之，在 ASP.NET Core 中，你只需要接收请求并确定它们应该从服务器环境获得什么响应。你可能还会讨论 `Web API`，但主要是出于向后兼容性的考虑。从逻辑和功能上来说，`Web\
  \ API` 已经“死亡”了，因为它已经合并（并重生）在更新且全面的 ASP.NET MVC 栈中。\n\n### 中间件 (Middleware)\n\n在经典的\
  \ ASP.NET 中，你有两种组件可以用于自定义每个请求的处理方式：`HTTP handlers`（HTTP 处理程序）和 `HTTP modules`（HTTP\
  \ 模块）。`HTTP handler` 是当请求的 URL 匹配给定模式时调用的部分代码。`HTTP module` 是一个注册到运行时管道的组件，它可以挂钩任何请求并对其进行处理。\n\
  \n`HTTP handlers` 主要在 ASP.NET Web Forms 的背景下起着重要作用。这是因为在 Web Forms 中，每个请求都设计为针对特定的页面或视图；因此，`HTTP\
  \ handler` 是一种放置请求的方式，而该操作可能返回或不返回视图。在 ASP.NET MVC 中，重点转向了操作（actions），因此每个请求都是为了一个操作，并将随后处理，返回\
  \ HTML 视图或 JSON 数据。在 ASP.NET MVC 的背景下，`HTTP handlers` 失去了所有的吸引力。\n\n`HTTP modules`\
  \ 是另一回事。它们是用于预处理请求的组件。ASP.NET 管道会引发一系列应用程序事件，注册的模块挂钩一个或多个事件并执行它们自己的逻辑。\n\n在 ASP.NET\
  \ Core 中，HTTP 管道从底层开始重新设计，因此它是运行时组件的核心。`middleware`（中间件）一词现在用于表示组装到管道中处理请求和响应的组件。中间件组件按照以下模式之一运行：\n\
  \n![Image](img/00003.jpeg) 它执行某些操作，并将请求传递给管道中的下一个组件。\n\n![Image](img/00003.jpeg)\
  \ 它执行某些操作，将请求传递给管道中的下一个组件，并在之后执行更多工作。\n\n![Image](img/00003.jpeg) 它将请求传递给管道中的下一个组件，并在之后执行更多工作。\n\
  \n![Image](img/00003.jpeg) 它执行某些操作并停止链条，向调用者返回响应。\n\n中间件组件代表一个任务，而任务通过组合实际上为特定应用程序的请求组装管道。在旧的\
  \ ASP.NET 中，一组 `HTTP modules` 会自动应用，要移除它们需要一些配置微调。在 ASP.NET Core 中，管道的配置完全是程序化的，并在\
  \ `Startup` 类的 `Configure` 方法中完成。\n\n底而言之，你可能拥有的 `HTTP modules`，无论它们是独立产品还是应用程序的一部分，必须在\
  \ ASP.NET Core 应用程序中重写为中间件组件。\n\n### 数据访问 (Data access)\n\n大多数 .NET 应用程序通过 `Entity\
  \ Framework` 的服务处理数据。目前有很多版本的 `Entity Framework`。从 ASP.NET Core 的角度来看，需要考虑的版本有：`Entity\
  \ Framework 6` 和 `Entity Framework Core`（以及更新版本）。指南是使用 `Entity Framework 6` 来引入一些旧代码，并使用\
  \ `Entity Framework Core` 进行任何新开发。然而，两个版本运行良好良好，但确实存在一些差异。\n\n首先最重要的是，如果你选择使用 `Entity\
  \ Framework 6`，你的 ASP.NET Core 应用程序只能针对完整的 .NET Framework。.NET Core 框架不支持 `Entity\
  \ Framework 6`。换句话说，你没有机会将你的 `Entity Framework 6` 代码转换为跨平台代码。\n\n你像基于 Code First\
  \ 的旧 ASP.NET 项目中那样通过 `NuGet` 导入 `Entity Framework 6`。这意味着你应该拥有（或创建）通过构造函数获取连接字符串的\
  \ `DbContext` 类。同样，你应该拥有（或适配）一个 `Code First` 类，在适当且必要的地方添加数据注解属性。\n\n连接字符串将存储在 JSON\
  \ 文件中，并通过 `Options` 服务传递给数据访问类，如之前在“应用程序设置”部分中所示。这里是存储类的一些示例代码：\n\n点击此处查看代码图像\n\n\
  ```csharp\npublic class CountryRepository\n{\n    private string ConnectionString\
  \ { get; set; }\n\n    public CountryRepository(IOptions<AppConfig> accessor)\n\
  \    {\n        ConnectionString = accessor.Value.DbConnectionString;\n    }\n\n\
  \    public IList<Country> All()\n    {\n        using (var db = new CountryContext(ConnectionString))\n\
  \        {\n            var list = (from c in db.Countries select c).ToList();\n\
  \            return list;\n        }\n    }\n}\n```\n\n`Entity Framework Core` 是\
  \ `Entity Framework` 的新版本，从底层开始重写以实现跨平台。它仍然是一个 O/RM，并且在多年 Entity Framework 积累的成熟经验的基础上构建。在这方面，Entity\
  \ Framework Core 与旧版本很大程度上兼容。它还与 ASP.NET Core 的依赖注入机制完全集成，尽管通过依赖注入引擎并不是一个严格的要求。\n\
  \n`Entity Framework Core` 的最新文档可以在以下 URL 找到：`Entity Framework Core` 的最新文档。\n\n###\
  \ 总结 (Summary)\n\n对于来自 ASP.NET MVC 背景的开发者来说，新旧 ASP.NET 之间的大部分差异都在这里在这里。除了本章概述的内容之外，编程与你在传统的\
  \ ASP.NET MVC 应用程序中所做的非常相似。\n\n听起来迁移 ASP.NET Core 是一件显而易见的事？嗯，这取决于情况。\n\n在更长开发路线的第一步看来，ASP.NET\
  \ Core 在底层与 ASP.NET 完全不同，但在覆盖层大同小异。除非你真的有理由抱怨当前的 ASP.NET 提供的性能以及它消耗的内存（和资金）——除非你的业务真的需要在非\
  \ Windows 平台上提供相同的 应用程序——否则我看不到这种改变的任何巨大收益。\n\n此外，现在迁移到 ASP.NET Core 意味着你将承担迁移成本和某种学习曲线，而没有具体的收益，除非如前提到的，你正在寻找传统\
  \ ASP.NET 的替代方案。\n\n记得《谁动了我的奶酪》这本书吗？ASP.NET 的奶酪会在某时刻终止，我们都将被迫在其他地方寻找其他奶酪。我们可以今天、明天或者晚些时候开始探索，只有时间能告诉哪种方法是正确的。可以的是，在没有完整且编写良好的文档的情况下，迁移到另一个（尽管是熟悉的）平台我会感到恐惧。目前，对我来说，ASP.NET\
  \ Core 看起来像是一个进行中的工作，无论它戴着什么样的 1.0 帽子。\n\n\n\n\n\nASP.NET Web Forms 和 ASP.NET MVC\
  \ 对 HTTP 请求的构想方式有所不同，尽管在 ASP.NET Core 1.0 之前，这两个框架共享相同的运行时环境。在 ASP.NET Web Forms\
  \ 中，每个请求都指向显示一个特定的 `ASPX` 页面。作为开发者，你围绕一组页面设计网站。每个页面提供了一组可点击的元素来触发操作。没有操作是通过名称和参数被明确标识的；相反，所有操作都是页面向自身发起的回传（postbacks）。换句话说，在\
  \ ASP.NET Web Forms 中，你处理用户的点击、修改页面状态并将其渲染回。\n\n在 ASP.NET MVC 中，粒度是不同的，每个请求都会导致一个操作（action）的执行——最终，是特定\
  \ `controller` 类上的一个方法。执行操作的结果将同视图模板一起传递给视图子系统。然后使用这些结果和模板构建用于浏览器的最终响应。ASP.NET MVC\
  \ 应用的用户并不请求页面，而是向服务器发送请求执行某个操作。\n\nASP.NET Web Forms 和 ASP.NET MVC 之间的另一个巨大区别是缺少服务器控件（server\
  \ controls）——即能够根据参数值生成标记（markup）的黑盒组件。在 ASP.NET MVC 中，你使用原始 HTML 模板为浏览器生成视图。通过这种方式，你获得了对标记的完全控制权，并可以使用你最喜欢的\
  \ JavaScript 框架随心应用样式并注入脚本代码。\n\n与 Web Forms 不同，ASP.NET MVC 由多个层代码组成，这些代码连接在一起但并不交织，且没有形成单一的单体块。由于由于原因，很容易将这些层中的任何层替换为自定义组件，从而增强解决方案的可维护性和测试性。本章将引导你发现控制器（controller）的作用和结构——ASP.NET\
  \ MVC 应用的基础——并向你展示请求是如何路由到控制器并渲染回浏览器的。\n\n## 路由传入的请求\n\n尽管整个 ASP.NET 平台最初是围绕为物理页面提供请求服务的理念开发的，但它并不局限于调用由特定位置和文件标识的资源。例如，通过编写一个临时的\
  \ HTTP 处理器并将其绑定到固定的 URL，你可以让 ASP.NET 无论是否依赖于物理文件来处理请求。这正是 ASP.NET 的一个特性，允许构建一个受模型-视图-控制器（MVC）模式启发的不同编程框架。在像\
  \ ASP.NET MVC 这样强调操作作用的 Web 框架中，拥有一个将传入请求映射到某些实际类方法的路由系统是至关重要的。\n\n在探索 ASP.NET MVC\
  \ 的路由系统之前，让我们简单看看如何通过 HTTP 处理器在 ASP.NET Web Forms 中模拟 ASP.NET MVC 的行为。此示例推荐所有具有深厚\
  \ ASP.NET Web Forms 背景并尝试掌握 ASP.NET MVC 的读者阅读。如果你只是想学习 ASP.NET MVC，可以跳过下一节，直接进入“URL\
  \ 路由 HTTP 模块”节。\n\n### 模拟 ASP.NET MVC 运行时\n\n让我们构建一个简单的 ASP.NET Web Forms 应用，并使用\
  \ HTTP 处理器来了解 ASP.NET MVC 应用的内部机制。你可以从一个空 Web 项目开始，只需添加 ASP.NET Web Forms 依赖。\n\n\
  ### 定义识别 URL 的语法\n\n在一个请求的 URL 不一定与 Web 服务器上的物理文件匹配的世界中，要采取的第一步是列出哪些 URL 对应用程序是有意义的。为了过于具体，假设我们只支持几个固定的\
  \ URL，每个 URL 都映射到一个 HTTP 处理器组件。以下代码段显示了默认 `web.config` 文件需要进行的更改：\n\n点击此处查看代码图像\n\
  \n```xml\n<system.webServer>\n    <validation validateIntegratedModeConfiguration=\"\
  false\" />\n    <modules runAllManagedModulesForAllRequests=\"true\" />\n    <handlers>\n\
  \        <add name=\"MvcEmule\"\n             path=\"home/test/*\"\n           \
  \  verb=\"*\"\n             type=\"MvcEmule.MvcEmuleHandler\" />\n    </handlers>\n\
  </system.webServer>\n```\n\n每当应用程序接收到匹配指定 URL 的请求时，它将把请求传递给指定的处理器——即 `MvcEmuleHandler`\
  \ 类。\n\n### 定义 HTTP 处理器的行为\n\n在 ASP.NET 中，HTTP 处理器是实现 `IHttpHandler` 接口的组件。该接口非常简单，包含两个成员，所示：\n\
  \n点击此处查看代码图像\n\n```csharp\npublic class MvcEmuleHandler : IHttpHandler\n{\n    public\
  \ void ProcessRequest(HttpContext context)\n    {\n        // 逻辑在此处\n        ...\n\
  \    }\n    public Boolean IsReusable\n    {\n        get { return false; }\n  \
  \  }\n}\n```\n\n大多数时候，处理器仅根据某些输入具有硬编码行为。然而，没有什么阻止我们使用处理器作为抽象工厂。事实上，处理器可以使用请求中的信息来提供服务。通过这种方式，单个处理器可以处理各种请求。处理器解析\
  \ URL 以识别类。以下是它如何工作的一个示例：\n\n点击此处查看代码图像\n\n```csharp\n```public void ProcessRequest(HttpContext\
  \ context)\n{\n    // 解析出 URL、操作和参数\n    var segments = context.Url.Segments;\n\
  \    var controller = segments[1].TrimEnd('/');\n    var action = segments[2].TrimEnd('/');\n\
  \    var param1 = segments[3].TrimEnd('/');\n    // 带有命名空间的完整类名\n    var fullName\
  \ = String.Format(\"{0}.{1}Controller\", this.GetType().Namespace, controller);\n\
  \    var controllerType = Type.GetType(fullName, true);\n    // 获取控制器的实例\n    var\
  \ instance = Activator.CreateInstance(controllerType);\n    // 在控制器实例上调用操作\n   \
  \ var methodInfo = controllerType.GetMethod(action,\n        BindingFlags.Instance\
  \ | \n        BindingFlags. |\n        BindingFlags.Public);\n    string result;\n\
  \    if (methodInfo.GetParameters().Length == 0)\n    {\n        result = methodInfo.Invoke(instance,\
  \ null) as String;\n    }\n    else\n    {\n        result = methodInfo.Invoke(instance,\
  \ new Object[] { param1 }) as String;\n    }\n    // 输出结果\n    if (result != null)\n\
  \        context.Response.Write(result);\n}\n```\n\n上述代码仅假设服务器名之后的第一个令牌包含识别专门化组件的关键信息。第二个令牌指向在该组件上调用的方法。最后，第三个令牌指示要传递的参数。\n\
  \n### 调用 HTTP 处理器\n\n对于如 `home/test/**` 的 URL，`home` 识别类，`test` 识别方法，后续的是参数。类名被进一步处理并扩展以包含命名空间和后缀。根据示例，最终类类为\
  \ `MvcEmule.HomeController`。该类预计对应用程序可用。该类还预计暴露一个名为 `Test` 的方法，所示：\n\n点击此处查看代码图像\n\
  \n```csharp\nnamespace MvcEmule\n{\n    public class HomeController\n    {\n   \
  \     public String Test(Object param1)\n        {\n            var message = \"\
  <html><h1>You passed '{0}'</h1></html>\";\n        }\n    }\n}\n```\n\n\n\n\n\n\
  ```cs\nreturn String.Format(message, param1);\n}\n\n}\n\n}\n```\n\n图 8-1 显示了在 ASP.NET\
  \ Web Forms 中调用页面无关 URL 的效果。\n\n![Image](img/00045.jpeg)\n\n**图 8-1** 在 ASP.NET\
  \ Web Forms 中处理页面无关的 URL。\n\n这个简单的示例演示了 ASP.NET MVC 使用的底层机制。处理请求的专用组件是 `controller`。`controller`\
  \ 是一个只包含方法而没有状态的类。一个系统级 HTTP 处理器负责将传入的请求分发到特定的 `controller` 类，以便该类的实例执行指定的动作方法并产生响应。\n\
  \n那么 URL 的方案又是怎样的？在这个示例中，你只是使用了一个硬编码的 URL。在 ASP.NET MVC 中，你可以使用一种灵活的语法来表示应用程序识别的\
  \ URL。此外，运行时流水线中的一个新系统组件会拦截请求、处理 URL，并触发内置的 ASP.NET MVC HTTP 处理器。该组件就是 URL 路由 HTTP\
  \ 模块。\n\n### 探索 URL 路由 HTTP 模块\n\nURL 路由 HTTP 模块通过查看 URL 并将其分发给最合适的执行器来处理传入的请求。URL\
  \ 路由 HTTP 模块取代了旧版 ASP.NET 的 URL 重写功能。其核心，URL 重写包括挂接请求、解析原始 URL 以及指示 HTTP 运行时环境服务于“可能相关但不同”的\
  \ URL。\n\n### 路由请求\n\n在 ASP.NET MVC 应用的上下文中，当请求敲击 Internet 信息服务 (IIS) 的大门时，具体发生了什么呢？图\
  \ 8-2 为你提供了涉及各个步骤的概览。\n\n![Image](img/00046.jpeg)\n\n**图 8-2** URL 路由 HTTP 模块在 ASP.NET\
  \ MVC 中的作用。\n\nURL 路由 HTTP 模块拦截任何无法由托管环境（最可能是 IIS）提供服务的应用程序请求。如果 URL 指向物理文件（例如 `ASPX`\
  \ 文件），则 URL 路由 HTTP 模块将忽略该请求，除非另有配置。在任何其他情况下，URL 路由 HTTP 模块都会尝试将请求的 URL 与任何应用程序定义的路由进行匹配。如果找到匹配项，请求将进入\
  \ ASP.NET MVC 空间，并以调用 `controller` 类的方式进行处理。如果没有找到匹配项，则该请求将由标准的 ASP.NET 运行时以最佳方式提供服务，并可能导致\
  \ HTTP 404 错误。\n\n最后，只有匹配预定义 URL 模式（也称为 `routes`）的请求才被允许使用 ASP.NET MVC 运行时。所有此类请求都被路由到一个通用的\
  \ HTTP 处理器，该处理器会实例化 `controller` 类并调用其上的定义方法。接下来，`controller` 方法反过来选择一个视图组件来生成实际响应。\n\
  \n### 检查 URL 路由 HTTP 模块的内部结构\n\n从实现的角度来说，我应该注意 URL 路由引擎是一个挂接 `PostResolveRequestCache`\
  \ 事件的 HTTP 模块。该事件在检查到 ASP.NET 缓存中没有该请求的响应后立即触发。\n\nHTTP 模块将请求的 URL 与用户定义的 URL 路由之一进行匹配，并设置\
  \ HTTP 上下文使用 ASP.NET MVC 标准 HTTP 处理器来处理请求。作为开发者，你不可能直接处理 URL 路由 HTTP 模块。该模块由系统提供，不需要你执行任何特定形式的配置。相反，你负责提供你的应用程序支持且\
  \ URL 路由 HTTP 模块将实际消费的 `routes`。\n\n### 使用应用程序路由\n\n如所述，在 ASP.NET MVC 中，用户发送请求对资源执行操作。然而，框架并没有规定描述资源（resources）和动作（actions）的语法。我意识到“对资源执行操作”这一表达可能会让你想到表述状态转换\
  \ (REST)。当然，你这样想也不会太偏离目标。\n\n虽然你完全可以在 ASP.NET MVC 应用中使用纯正的 REST 方法，但 ASP.NET MVC\
  \ 是松散地面向 REST 的，因为它承认了资源和动作等概念，但它允许你自由地使用自己的语法来表示和实现资源与动作。例如，在纯 REST 解决方案中，你使用 HTTP\
  \ 动词表示动作——`GET`、`POST`、`PUT` 和 `DELETE`——并使用 URL 来识别资源。在 ASP.NET MVC 中实现纯 REST 解决方案是可能的，但需要你付出一些额外工作。\n\
  \nASP.NET MVC 的默认行为是使用自定义 URL，这让你对指定动作和资源的语法负责。这种语法通过一组 URL 模式表示，也称为 `routes`。\n\
  \n### 与 URL 模式和路由一起工作\n\n`route` 是一个模式匹配字符串，代表 URL 的绝对路径——即不包含协议、服务器和端口信息的 URL 字符串。`route`\
  \ 可能是一个常量字符串，但更有可能包含几个占位符。这是一个示例路由：\n\n`/home/test`\n\n该 `route` 是一个常量字符串，仅会被绝对路径为\
  \ `/home/test` 的 URL 匹配。然而，大多数情况下你处理的是包含一个或多个占位符的参数路由。这里是两个例子：\n\n`/{resource}/{action}`\n\
  \n`/Customer/{action}`\n\n这两个路由都被任何包含两个段的 URL 匹配。后者要求第一个段必须等于 `Customer`。而前者则没有对段的内容施加限制。\n\
  \n占位符通常被称为 `URL 参数`，它是包含在大括号 `{}` 中的名称。你可以在一个路由中拥有多个占位符，只要它们被分隔符隔开。正斜杠 `/` 是路由部分之间的分隔符。占位符的名字（例如\
  \ `action`）是你代码用于程序化检索段内容的键。\n\n这是 ASP.NET MVC 的默认路由：\n\n`{controller}/{action}/{id}`\n\
  \n在这种情况下，示例路由包含三个占位符。\n\n#### 定义应用程序路由\n\n应用程序的路由通常在 `global.asax` 文件中注册，并在应用程序启动时处理。让我们看看\
  \ `global.asax` 文件中处理路由的部分：\n\n```cs\nprotected void Application_Start()\n{\n  \
  \  RouteConfig.RegisterRoutes(RouteTable.Routes);\n}\n```````\n\n`RegisterRoutes`\
  \ 是 `RouteConfig` 类上的方法，定义在独立的文件夹中，通常是 `App_Start`。（你可以随意重命名该文件夹）。这是该类的实现：\n\n```cs\n\
  public class RouteConfig\n{\n    public static void RegisterRoutes(RouteCollection\
  \ routes)\n    {\n        // 其他代码\n        ...\n        // 列出路由\n        routes.MapRoute(\n\
  \            \"Default\",\n            \"{controller}/{action}/{id}\",\n       \
  \     new {\n                controller = \"Home\",\n                action = \"\
  Index\",\n                id = UrlParameter.Optional\n            }\n        );\n\
  \    }\n}\n```\n\n\n\n正如你所见，`Application_Start` 事件处理器调用了一个名为 `RegisterRoutes` 的公共静态方法，该方法列出了所有路由。请注意，`RegisterRoutes`\
  \ 方法名称及其原型都是任意的，如果有合理的理由，可以对其进行更改。\n\n支持的路由必须添加到由 ASP.NET MVC 管理的 `Route` 对象的静态集合中。该集合是\
  \ `RouteTable.Routes`。你通常使用方便的 `MapRoute` 方法来填充该集合。`MapRoute` 方法提供了多种重载，并且在大多数情况下运行良好。然而，它并不能让你配置路由对象的每个可能方面。如果你需要在路由上设置某些\
  \ `MapRoute` 不支持的属性，你可能需要使用以下代码：\n\n点击此处查看代码图片\n\n```csharp\n// 创建新路由并将其添加到系统集合\n\
  \nvar route = new Route(...);\n\nRouteTable.Routes.Add(\"NameOfTheRoute\", route);\n\
  ```\n\n路由的特征由几个属性决定，例如名称、URL 模式、默认值、约束条件、数据令牌和路由处理程序。你最常设置的属性是名称、URL 模式和默认值。让我们扩展一下用于默认路由的代码：\n\
  \n点击此处查看代码图片\n\n```csharp\nroutes.MapRoute(\n    \"Default\",\n    \"{controller}/{action}/{id}\"\
  ,\n    new {\n        controller = \"Home\",\n        action = \"Index\",\n    \
  \    id = UrlParameter.Optional\n    });\n```\n\n第一个参数是路由名称；每个路由都应该有一个唯一的名称。第二个参数是\
  \ URL 模式。第三个参数是一个为 URL 参数指定默认值的对象。\n\n注意，URL 即使以不完整的形式也可以匹配模式。让我们考虑根 URL——`http://yourserver.com`。乍一看，这样的\
  \ URL 不会匹配该路由。然而，如果为 URL 参数指定了默认值，该段就会被认为是可选的。因此，对于上例示例，当你请求根 URL 时，请求将通过调用 `Home`\
  \ 控制器上的 `Index` 方法来解析。\n\n### 处理路由\n\nASP.NET URL 路由 HTTP 模块在尝试将传入的请求 URL 匹配到定义的路由时，采用了多条规则。最重要的规则是，必须按照路由在\
  \ `global.asax` 中注册的顺序对它们进行检查。\n\n为了确保路由按照正确的顺序进行处理，你必须从最具体的到最不具体的顺序列出它们。在任何情况下，请记住，匹配路由的搜索始终在第一个匹配项处结束。这意味着仅仅在列表底部添加新路由可能不起作用，并且可能给你带来一些麻烦。此外，请注意，将通配符模式（catch-all\
  \ pattern）放在列表顶部会导致任何其他模式——无论其多具体——都会被忽略。\n\n除了出现顺序外，其他因素也会影响 URL 到路由的匹配过程。如提到的，其中之一是你可能为路由提供的默认值集合。默认值是指在\
  \ URL 未提供特定值时自动分配给定义占位符的值。考虑以下两个路由：\n\n`{Orders}/{Year}/{Month}`\n\n`{Orders}/{Year}`\n\
  \n如果在第一个路由中，你为 `{Year}` 和 `{Month}` 都分配了默认值，那么第二个路由永远不会被评估，因为得益于默认值，无论 URL 是否指定了年份和月份，第一个路由始终会匹配。\n\
  \n末尾的正斜杠（`/`）也是一个陷阱。路由 `{Orders}/{Year}` 和 `{Orders}/{Year}/` 是两个非常不同的东西。一个不会匹配另一个，尽管在逻辑上（至少从用户的角度来看），你会预期它们是相等的。\n\
  \n另一个影响 URL 到路由匹配的因素是你可选地为路由定义的约束列表。路由约束是一个额外条件，给定的 URL 参数必须满足该条件才能使 URL 匹配到路由。URL\
  \ 不仅应该与 URL 模式兼容，还需要包含兼容的数据。约束可以通过多种方式定义，包括通过正则表达式。这里有一个带有约束的示例路由：\n\n点击此处查看代码图片\n\
  \n```csharp\nroutes.MapRoute(\n    \"ProductInfo\",\n    \"{controller}/{productId}/{locale}\"\
  ,\n    new { controller = \"Product\", action = \"Index\", locale=\"en-us\" },\n\
  \    new { productId = @\"\\d{8}\", locale });\n```\n\n特别是，`productId` 必须恰为八位数字，而\
  \ `locale` 是一个两个字母的字符串。\n\n### 引入路由处理程序\n\nASP.NET MVC 框架没有提供许多内置路由处理程序，这可能表明使用自定义路由处理程序的需求并不常见。然而，扩展点确实存在，在需要时，你可以利用它。最终决定如何处理任何请求的组件是另一个；准确地说，它是路由处理程序。\n\
  \n从技术上讲，路由处理程序是一个实现 `IRouteHandler` 的类。该接口定义在这里：\n\n点击此处查看代码图片\n\n```csharp\npublic\
  \ interface IRouteHandler\n{\n    IHttpHandler GetHandler(RequestContext requestContext);\n\
  }\n```\n\n`RequestContext` 类定义在 `System.Web.Routing` 命名空间，它封装了请求的 HTTP 上以及任何路由特定的信息，例如路由对象本身、URL\
  \ 参数。这些数据分组在 `RouteData` 对象中。以下是 `RequestContext` 类的签名：\n\n点击此处查看代码图片\n\n```csharp\n\
  public class RequestContext\n{\n    public RequestContext(HttpContextBase httpContext,\
  \ RouteData routeData);\n\n    // Properties\n    public HttpContextBase HttpContext\
  \ { get; set; }\n    public RouteData RouteData { get; set; }\n}\n```\n\n### 处理物理文件的请求\n\
  \n路由系统的另一个有助于 URL 到路由匹配的可配置方面是，路由系统是否需要处理物理文件的请求。\n\n默认情况下，ASP.NET 路由系统会忽略 URL 可以映射到服务器上物理存在的请求。注意，如果服务器文件存在，即使请求匹配路由，路由系统也会忽略它。\n\
  \n如果你需要，可以通过将 `RouteCollection` 对象的 `RouteExistingFiles` 属性设置为 `true` 来强制路由系统处理所有请求，如下所示：\n\
  \n点击此处查看代码图片\n\n```csharp\n// 在 global.asax.cs\n\npublic static void RegisterRoutes(RouteCollection\
  \ routes)\n{\n    routes.RouteExistingFiles = true;\n    ...\n}\n```\n\n注意，通过路由处理所有请求可能会给\
  \ ASP.NET MVC 应用程序带来一些问题。例如，如果你将上述代码添加到示例 ASP.NET MVC 应用程序的 `global.asax.cs` 文件并运行它，当你访问\
  \ `default.aspx` 时将立即遇到 HTTP 404 错误。\n\n\n\n\n\nASP.NET URL 路由 HTTP 模块并不限制你维护一个接受的\
  \ URL 模式列表。它允许你将某些 URL 排除在路由机制之外。你可以通过两个步骤防止路由系统处理某些 URL。\n\n首先，你为这些 URL 定义一个模式并将其保存到路由中。其次，你将该路由链接到一个特殊的路由处理程序——`StopRoutingHandler`\
  \ 类。它所做的仅仅是在其 `GetHttpHandler` 方法被调用时抛出一个 `NotSupported` 异常。\n\n例如，以下代码指示路由系统忽略任何\
  \ `*.axd` 请求：\n\n点击查看代码图片\n\n```csharp\n// In global.asax.cs\n\npublic static void\
  \ RegisterRoutes(RouteCollection routes)\n{\n   routes.IgnoreRoute(\"{resource}.axd/{*pathInfo}\"\
  );\n   ...\n}\n```\n\n`IgnoreRoute` 所做的仅仅是将一个 `StopRoutingHandler` 路由处理程序关联到围绕指定\
  \ URL 模式构建的路由上。\n\n最后，需要对 URL 中的 `{*pathInfo}` 占位符进行简单的解释。标记 `pathInfo` 仅仅代表 `*.axd`\
  \ URL 之后任何内容的占位符。然而，星号（`*`）表示最后一个参数应该匹配 URL 的剩余部分。换句话说，`*.axd` 之后的任何内容都会进入 `pathInfo`\
  \ 参数。此类参数被称为 `catch-all parameters`（通获参数）。\n\n使用 使用特性的路由\n\n在经典路由中，每当请求进入时，URL 都会与注册路由的模板进行匹配。如果找到匹配项，将确定处理请求的相应控制器和操作方法。如果没有找到匹配，请求将被拒绝，结果通常是\
  \ 404 消息。现在，在大型应用程序中，甚至是具有强 REST 风格的中型应用程序中，路由的数量可能非常大——轻松达到数百个。\n\n你可能会很快发现，处理经典路由变得有些无从心。特性路由是路由的另一种方法，其核心是通过特性（attributes）直接在控制器操作方法上定义路由，如下：\n\
  \n点击查看代码图片\n\n```csharp\n[HttpGet(\"orders/{orderId}/show\")]\npublic ActionResult\
  \ GetOrderById(int orderId)\n{\n   ...\n}\n```\n\n该代码设置 `GetOrderById` 方法，仅当 URL\
  \ 模板匹配指定模式时，才通过 HTTP GET 调用可用。路由参数——`orderId` 标记——必须匹配方法签名中定义的参数之一。还有几个可用的特性——针对每个\
  \ HTTP 动词（verb）的——但特性路由的精髓已都在此了。\n\n更强大的特性是 `Route`、`RoutePrefix` 和 `RouteArea`。你可以在控制器-方法级别或操作-方法级别使用\
  \ `Route` 特性。如果你在控制器级别使用它，则路由定义将影响所有方法，但每个方法可以根据每个 HTTP 动词进行自定义路由，如下所示：\n\n点击查看代码图片\n\
  \n```csharp\n[Route(\"info/[controller]\")]\npublic class NewsController : Controller\n\
  {\n    [HttpGet(\"{id}\")]\n    public ActionResult Get(int id)\n    {\n       \
  \ ...\n    }\n}\n```\n\n现在，通过 URL `info/news/{id}` 调用 `Get` 方法。`RouteArea` 和 `RoutePrefix`\
  \ 通常用于加速配置。这是因为它们为每个控制器添加一次作为区域名称的字符串，以及用于由 `Route` 和其他特定动词特性进行扩展的所有方法的前缀。最后，请注意\
  \ ASP.NET MVC 中的特性路由必须显式启用。以下是实现它的常用方法：\n\n点击查看代码图片\n\n```csharp\npublic static\
  \ void RegisterRoutes(RouteCollection routes)\n{\n   routes.IgnoreRoute(\"{resource}.axd/{*pathInfo}\"\
  );\n   routes.MapMvcAttributeRoutes();\n   // Classic convention-based routes\n\
  \   ...\n}\n```\n\n如果你将特性路由与经典路由一起使用，你可以在启用基于特性的路由时的同一个地方定义路由契约。\n\n***\n\n![Image](img/00004.jpeg)\
  \ 注意\n\n在 ASP.NET MVC 中，`area`（区域）仅仅是一个标识一组控制器和视图的名称，你希望这些内容与其他区域以及应用程序的其他部分分开。在某种意义上，定义一个区域就像在应用程序内部创建一个逻辑子应用程序。我之所以说“逻辑子应用程序”，是因为你最终总是将其作为一个单一的综合应用程序部署。你通过调用\
  \ `global.asax` 中的 `RegisterAllAreas` 方法并创建一个带有自己的控制器和视图子文件夹的匹配项目文件夹来注册区域。\n\n***\n\
  \n### 探索控制器类\n\n如果说路由模块是系统理解请求的地方，那么控制器类就是开发者编写实际处理请求所需代码的地方。让我们简要探讨控制器类的一些特征。\n\
  \n#### 查看控制器的各个方面\n\n作为 ASP.NET MVC 应用的核心，控制器是设计中一个精细的部分。控制器的粒度影响着项目的组织、代码的分布、可扩展性和可测试性。\n\
  \n最后，仅仅因为 ASP.NET MVC 框架的灵感源于 MVC 模式，并不意味着你获得了一个完美的分层系统。许多工作需要你自己来完成。\n\n#### 处理控制器的粒度\n\
  \n一个 ASP.NET MVC 应用通常由各种控制器类组成。你应该拥有多少个控制器类？实际数量取决于你，并取决于你如何组织你的操作。\n\n一种常见的做法是为应用程序实现的任何重要功能拥有一个控制器类。然而，定义“重要功能”到底意味着什么是有困难的。我建议作为一种初步估计，考虑为每个用例（use-case）拥有一个控制器类。例如，在一个电子商务系统中，你可能希望为所有登录和成员操作准备一个控制器，为订单或购物车准备一个控制器，并为让客户编辑个人资料准备一个控制器。你还应该另一个处理库存产品的控制器类。观察控制器粒度的另一种方法是，你应该为预期应用程序主菜单中的每个项目拥有一个类。\n\
  \n通常情况下，控制器的粒度是用户界面粒度的函数。请为从提供的用户界面可能产生的每个重要请求源准备一个控制器。\n\n#### 处理类类的无状态性\n\n需要记住的一个重要点是\
  \ Web 固有的无状态性，随后的控制器类也是。每当新请求被路由模块捕获并映射到控制器操作时，都会创建一个所选控制器类的新实例。\n\n\n\n\n因此，你可能添加到类中的任何状态都将绑定到请求的相同生命周期内。那么，控制器类必须能够从\
  \ HTTP 请求流和 HTTP 上下文中检索工作所需的任何数据。控制器类依赖于 HTTP 上下文，因此它可以访问任何绑定到上下文的信息，无论是随请求传来的最新信息，还是存储在\
  \ ASP.NET 基础设施中的信息（例如会话状态或缓存信息）。\n\n作为一个一般原则，请考虑让控制器类依赖状态会降低应用程序的可扩展性，因为这使得在云环境中启动新服务器变得更加困难且不够即时。\n\
  \n## 决定是否使用更深的分的分\n\n通常，ASP.NET MVC 和控制器类被视为一根魔棒，挥动它就能编写出更整洁、更易阅读和维护的分层代码。控制器的无状态本质在这方面有很大帮助，但它还不够够。\n\
  \n在 ASP.NET MVC 中，控制器独立于触发请求的用户界面，也独立于为浏览器生成视图的引擎。控制器位于视图和系统后端之间。虽然这种与视图的隔离是欢迎的，并修复了\
  \ ASP.NET Web Forms 的一个弱点，但单凭它并不能确保你的代码遵循推崇的关注点分离（SoC）原则。\n\n从设计上来说，系统为你提供了与视图最小程度的分离，但其他一切取决于你。请记住，即使在\
  \ ASP.NET MVC 中，也没有什么能阻止你在控制器类中直接使用 ADO.NET 调用和纯 T-SQL 语句。控制器类不是系统的后端，也不是业务层。相反，它应该被视为\
  \ Web Forms 后置类（code-behind class）的 MVC 对应物。因此，它属于表示层，而不是业务层。\n\n## 检查控制器的测试性\n\n\
  控制器固有的无状态性和与视图的整洁分离，使得控制器类可能很容易测试。然而，控制器类的真实可测试性应该根据其有效的分层来衡量。让我们来看图 8-3。\n\n![Image](img/00047.jpeg)\n\
  \n**图 8-3** ASP.NET MVC 中的控制器和视图。\n\n虽然控制器类可以轻松接收你喜欢的任何固定输入，且其输出可以在不出现大问题的情况下进行断言，但对于操作方法（action\
  \ methods）的内部结构还无从可说。这些方法的实现与外部资源（例如数据库、服务或组件）结合得越紧密，测试控制器就越不容易快速简单。\n\n正如你将在第 10\
  \ 章中更详细地看到的“组织 MVC 项目”，构建控制器类的一种理想方法是将所有的编排逻辑放在不同的类中——应用程序层类——并保持控制器类尽可能薄。这样做的好处是控制器类是你唯一绑定到\
  \ HTTP 上下文的地方。应用层类，因此每个请求背后的工作流，可以放心进行测试，因为它们对周围环境没有依赖。\n\n测试控制器变成了可选的。除非你想要测试某些特殊的控制器功能（如响应和操作过滤器），否则你并不严格需要它。在大多数情况下，针对应用层类编写测试就能完成工作。\n\
  \n## 编写控制器类\n\n编写控制器类可以总结为两个简单的步骤：创建一个从（直接或间接继承自）`Controller` 的类，并添加一组公共方法。\n\n\
  ## 将操作映射到方法\n\nASP.NET MVC 管道线应用于传入请求的最终输出是一对元素，由要实例化的控制器类名称和要在其执行的操作名称组成。在控制器上执行操作会调用控制器类上的公共方法。然而，将操作名称映射到类方法有几种不同的方法。\n\
  \n核心规则是，控制器类上的任何公共方法都是一个具有同名的公共操作（action）。例如，名为 `Index` 的公共方法对应于名为 `Index` 的操作。有时，你需要在控制器类上有一个公共方法，但不想让它从外部作为操作被调用。在这种情况下，你只需要用\
  \ `NonAction` 特性修饰该方法即可。\n\n最后，你可以将操作名称与任何公共方法关联，从而将方法名与操作名解耦。在这种情况下，你用 `ActionName`\
  \ 特性修饰该方法。这里有一个示例：\n\n点击此处查看代码\n\n```csharp\npublic class HomeController : Controller\n\
  {\n    // 隐式操作名：Index\n    public ActionResult Index()\n    {\n        ...\n   \
  \ }\n\n    [NonAction]\n    public ActionResult About()\n    {\n        ...\n  \
  \  }\n\n    [ActionName(\"About\")]\n    public ActionResult LoveGermanShepherds()\n\
  \    {\n        ...\n    }\n}\n```\n\n因此，公共且未修饰任何特性的方法 `Index` 被隐式绑定到一个操作。相反，方法\
  \ `About` 虽然是公共的，但 `NonAction` 特性使其从外部不可见。你可以从应用程序的服务端代码中调用它。示例类中的第三个公共方法有一个华丽的名字，但\
  \ `ActionName` 特性将其显式绑定到操作 `About`。\n\n### 将操作映射到 HTTP 动词\n\n方法到操作映射的另一个级别是 HTTP\
  \ 动词。\n\nASP.NET MVC 足够灵活，可以让你仅针对特定的动词绑定方法。要将控制器方法与 HTTP 动词关联，你可以使用 `AcceptVerbs`\
  \ 特性或 `HttpGet`、`HttpPost` 等直接特性。`AcceptVerbs` 特性允许你指定执行给定方法所需的 HTTP 动词。让我们考虑以下示例：\n\
  \n点击此处查看代码\n\n```csharp\n[AcceptVerbs(HttpVerbs.Post)]\npublic ActionResult Edit(Customer\
  \ customer)\n{\n    ...\n}\n```\n\n给定该代码，结果 `Edit` 方法无法通过 GET 调用。请注意，不允许在一个方法上有多个\
  \ `AcceptVerbs` 特性。如果你在操作方法上添加多个 `AcceptVerbs` 特性（或类似的直接 HTTP 动词特性），代码将无法编译。\n\n\
  `AcceptVerbs` 特性接受 `HttpVerbs` 枚举的任何值：\n\n```csharp\npublic enum HttpVerbs\n{\n\
  \    Get = 1,\n    Post = 2,\n    Put = 4,\n    Delete = 8,\n    Head = 0x10\n}\n\
  ```\n\n`HttpVerbs` 枚举修饰了 `Flags` 特性。因此，你可以使用位或 (|) 运算符组合枚举中的多个值，并获得另一个 `HttpVerbs`\
  \ 值：\n\n点击此处查看代码\n\n```csharp\n[AcceptVerbs(HttpVerbs.Post|HttpVerbs.Put)]\npublic\
  \ ActionResult Edit(Customer customer)\n{\n    ...\n}\n```\n\n使用 `AcceptVerbs` 或多个独立的特性（如\
  \ `HttpGet` 或 `HttpPost`）完全取决于个人喜好。以下代码完全等价：\n\n点击此处查看代码\n\n```csharp\n[HttpPost]\n\
  [HttpPut]\npublic ActionResult Edit(Customer customer)\n{\n    ...\n}\n```\n\n\n\
  \n在 Web 上，当你点击链接或在地址栏中输入 URL 时，你执行了 `HTTP GET` 命令。当你提交 HTML 表单内容时，你执行了 `HTTP POST`。任何其他\
  \ HTTP 命令都只能通过 `AJAX` 从 Web 执行，或者通过向 `ASP.NET MVC` 应用程序发送请求的 Microsoft Windows 客户端执行。以下是你几乎在每个涉及\
  \ HTML 表单的 HTML 场景中都会遇到的常见场景：你需要一个方法来渲染显示表单的视图，还需要一个方法来处理提交的值。你如何处理这种情况呢？\n\n一种方案是将单个方法绑定到任何可能的\
  \ HTTP 动词：\n\n点击此处查看代码图像\n\n```csharp\npublic ActionResult Edit(Customer customer)\n\
  {\n    ...\n}\n```\n\n在方法体中，你设法判断用户是意图显示表单还是处理提交的值。没有多少可用信息可以判断这一点；你拥有的最佳来源就是从 `Request`\
  \ 对象中获取的 HTTP 动词：\n\n点击此处查看代码图像\n\n```csharp\n[HttpGet]\npublic ActionResult Edit(Customer\
  \ customer)\n{\n    ...\n}\n\n[HttpPost]\npublic ActionResult Edit(Customer customer)\n\
  {\n    ...\n}\n```\n\n现在有两个方法绑定到不同的操作。这对于 `ASP.NET MVC` 是可以的，因为它会根据动词调用适当的方法。然而，这对于\
  \ Microsoft C# 编译器来说是不允许的，因为它不允许你在同一个类中拥有两个相同名称和签名的方法。以下是重写版本：\n\n点击此处查看代码图像\n\n\
  ```csharp\n[HttpGet]\n[ActionName(\"edit\")]\npublic ActionResult DisplayEditForm(Customer\
  \ customer)\n{\n    ...\n}\n\n[HttpPost]\n[ActionName(\"edit\")]\npublic ActionResult\
  \ SaveEditForm(Customer customer)\n{\n    ...\n}\n```\n\n方法现在有了不同的名称，但它们都绑定到同一个操作，尽管是适用于不同的动词。\n\
  \n### 方法 (Action methods)\n\n让我们来看一个带有几个简单但实用的操作方法的示例控制器类：\n\n点击此处查看代码图像\n\n```csharp\n\
  public class HomeController : Controller\n{\n    public ActionResult Index()\n \
  \   {\n        // 处理输入数据\n        ...\n        // 执行预期任务\n        ...\n        //\
  \ 生成操作结果\n        return View();\n    }\n    public ActionResult About()\n    {\n\
  \        // 处理输入数据\n        ...\n        // 执行预期任务\n        var results = ...\n\
  \        // 从计算出的结果生成响应\n        return View(results);\n    }\n}\n```\n\n操作方法使用任何标准\
  \ HTTP 通道获取可用的输入数据。接下来，它安排某些操作，并可能涉及应用程序的中间层。操作方法的模板可以总结如下：\n\n![图像](img/00003.jpeg)\
  \ **处理输入数据** 操作方法可以从各种来源获取输入参数，包括由 `Request` 对象暴露的集合。`ASP.NET MVC` 并不要求操作方法具有特定的签名。然而，出于可测试性的考虑，强烈建议通过签名接收任何输入参数。如果你计划对控制器类进行测试（尽管在大多数情况下可能没有必要），你应该避免那些从\
  \ `Request` 或或其他通过程序化方式检索输入数据的方法。在这方面，你可以利用我稍后将讨论的模型绑定层服务。\n\n![图像](img/00003.jpeg)\
  \ **执行任务** 操作方法根据输入参数执行工作，并尝试获取预期的结果。在此过程中，方法可能需要与中间层交互。建议任何交互都通过临时的、专用的应用层进行。在任务结束时，任何应该包含在响应中的（计算出的或引用的）值将以适当的方式封装。如果方法返回\
  \ `JSON`，数据将组合成 `JSON`-可序列化的对象。如果方法返回 `HTML`，数据将封装进一个容器对象并发送到视图引擎。该容器对象通常称为 `view-model`（视图模型），它可以是键/值对的普通字典，也可以是视图特定的强类型类。\n\
  \n![图像](img/00003.jpeg) **生成结果** 在 `ASP.NET MVC` 中，控制器方法并不负责产生响应本身。然而，它负责触发使用不同对象（通常是视图对象）向输出流渲染内容的过程。该方法识别响应的类型（文件、纯数据、`HTML`、`JavaScript`\
  \ 或 `JSON`）并相应设置 `ActionResult` 对象。\n\n控制器方法预期返回一个 `ActionResult` 对象或任何继承自 `ActionResult`\
  \ 类的对象。但通常，控制器方法并不直接实例化 `ActionResult` 对象。相反，它使用操作辅助器（action helper），即一个在内部实例化并返回\
  \ `ActionResult` 对象的对象。\n\n### 处理输入数据\n\n控制器操作方法的签名是灵活的。如果你定义了无参数的方法，你就负责程序化地检索代码代码所需的任何输入数据。如果你为方法添加了参数，`ASP.NET\
  \ MVC` 将会自动处理。在本节中，我将首先讨论如何在操作方法内部手动检索输入数据。接下来，我将转向通过模型绑定器——这是 `ASP.NET MVC` 中常用的选择。\n\
  \n#### 手动参数绑定\n\n操作方法可以访问通过请求提交的任何输入数据，包括表单数据、查询字符串、cookie 和路由值。让我们详细介绍。\n\n#####\
  \ 从 Request 对象获取输入数据\n\n在编写操作方法体时，你可以直接访问 `Request` 及其子集合，如 `Form`、`Cookies`、`ServerVariables`\
  \ 和 `QueryString`。正如你稍后将看到的，`ASP.NET MVC` 提供了非常强大的功能（例如模型绑定器），你可能希望使用它们让代码更简洁、紧凑且易于测试。尽管如此，没有任何阻止你编写此处所示的旧式\
  \ `Request` 代码：\n\n点击此处查看代码图像\n\n```csharp\npublic ActionResult Echo()\n{\n    //\
  \ 手动获取数据\n    var data = Request.Params[\"today\"] ?? String.Empty;\n    ...\n}\n\
  ```\n\n在 `ASP.NET` 中，`Request.Params` 字典由四个不同的字典组合：`QueryString`、`Form`、`Cookies`\
  \ 和 `ServerVariables`。你也可以使用 `Request` 对象的 `Item` 索引属性，它提供了相同的功能并按以下顺序搜索匹配项。以下代码与刚刚代码完全等效：\n\
  \n点击此处查看代码图像\n\n```csharp\npublic ActionResult Echo()\n{\n    // 手动获取数据\n    var\
  \ data = Request[\"today\"] ?? String.Empty;\n    ...\n}\n```\n\n注意，匹配项的搜索是不区分大小写的。\n\
  \n##### 从路由获取输入数据\n\n在 `ASP.NET MVC` 中，你通常通过 URL 提供输入参数。这些值由路由模块捕获并供应用程序使用。路由值通过\
  \ `Request` 对象暴露给应用程序。你需要使用稍微不同的方法来程序化地检索它们：\n\n点击此处查看代码图像\n\n```csharp\npublic\
  \ ActionResult Echo()\n{\n    // 手动获取数据\n    var data = RouteData.Values[\"data\"\
  ] ?? String.Empty;\n    ...\n}\n```\n\n\n\n路由数据通过 `Controller` 类的 `RouteData` 属性暴露。在这些情况下，对匹配项的搜索是以不区分大小的方式进行的。\n\
  \n![Image](img/00004.jpeg) 注意：`RouteData.Values` 字典是一个 `String/Object` 字典。在大多数情况下，它只包含字符串。然而，如果你通过程序填充它（例如通过路由处理器），它可以包含其他类型的值。在这种情况下，你需要负责任何必要的类型转换。\n\
  \n## 模型绑定\n\n使用原生请求集合作为输入数据虽然可行，但从可读性和维护性的角度来看并不理想。使用临时模型（ad hoc model）向控制器暴露数据会更好。这种模型通常被称为“输入模型”。ASP.NET\
  \ MVC 提供了一个自动绑定层，使用内置规则将原始请求数据映射到模型类的属性。作为开发者，你很大程度上负责这些模型类的设计。\n\n![Image](img/00004.jpeg)\
  \ 注意：大多数情况下，内置的绑定规则足够让控制器接收干净且可用的数据。然而，绑定层可以在很大程度上进行自定义，从而在处理输入数据时提供了前所未有的灵活性。\n\
  \n## 默认绑定器\n\n任何请求都会通过对应 `DefaultModelBinder` 类的内置绑定器对象。图 8-4 提供了绑定过程的概述。\n\n![Image](img/00048.jpeg)\
  \ **图 8-4** 将请求值映射到控制器方法签名的过程。\n\n操作调用器（action invoker）是 ASP.NET MVC 内部流水线组件，其目标是将操作转换为控制器实例的方法调用。在此，它需要检查控制器方法的签名，并尝试匹配请求上传的任何值（无论是通过查询字符串、表单还是\
  \ Cookie）。默认绑定器使用约定逻辑来匹配参数名称。`DefaultModelBinder` 类知道如何处理基本类型以及集合和字典。因此，默认绑定器通常运行良好。\n\
  \n### 绑定基本类型\n\n诚然，这听起来有点神奇，但模型绑定背后并没有真正的魔法。模型绑定的关键在于，它让你专注于控制器方法想要接收的数据。你完全忽略了检索数据的细节，无论它是来自查询字符串还是路由。\n\
  \n假设你需要一个控制器方法重复指定次数的字符串。你需要的输入数据是一个字符串和一个数字。做法如下：\n\n点击此处查看代码图像\n\n```csharp\n\
  public class BindingController : Controller\n{\n    public ActionResult Repeat(string\
  \ text, int number)\n    {\n        ...\n    }\n}\n```\n\n这种设计使得你不需要访问 HTTP 上文来获取数据。`text`\
  \ 和 `number` 的值来自哪里？哪个组件实际上将它们读取到 `text` 和 `number` 参数中？\n\n实际值是从请求上下读取的，默认绑定器对象完成了这项工作。特别是默认绑定器尝试将请求的命名值匹配参数名称（示例中的\
  \ `text` 和 `number`）。也就是说，如果请求带有表单字段、查询字符串字段或名为 `text` 的路由参数，携带的值会自动绑定到 `text` 参数。只要参数类型和实际值兼容，映射就会成功。如果无法执行转换，将抛出参数异常。下一个\
  \ URL 运行正常：\n\n[`http://server/binding/repeat?text=Dino&number=2`](http://server/binding/repeat?text=Dino&number=2)\n\
  \n相反，以下 URL 会导致异常：\n\n[`http://server/binding/repeat?text=Dino&number=true`](http://server/binding/repeat?text=Dino&number=true)\n\
  \n查询字符串字段 `text` 包含 `Dino`，映射到 `Repeat` 方法上的字符串参数 `text` 成功。然而，查询字符串字段 `number`\
  \ 包含 `true`，无法成功映射到 `int` 参数。模型绑定器返回一个参数字典，其中 `number` 条目包含 `null`。由于参数类型是 `int`（即不可空类型），调用器抛出参数异常。\n\
  \n### 处理可选值\n\n注意，由于传递无效值而发生的参数异常在控制器级别不会被检测。异常在执行流到达控制器之前就会触发。这意味着你无法通过 `try/catch`\
  \ 块捕获它。\n\n如果默认绑定器找不到匹配必需方法参数的上传值，它会在返回给操作调用器的参数字典中放置一个 `null` 值。再次，如果 `null` 值对参数类型是不可接受的，则在调用控制器方法之前就会抛出参数异常。\n\
  \n如果方法参数必须被认为是可选的怎么办？\n\n一种可能的方法是将参数类型更改为可空类型，如下所示：\n\n点击此处查看代码图像\n\n```csharp\n\
  public ActionResult Repeat(string text, Nullable<int> number)\n{\n    var model\
  \ = new RepeatViewModel {Number = number.GetValueOrDefault(), Text = text};\n  \
  \  return View(model);\n}\n```\n\n另一种方法是对参数使用默认值：\n\n点击此处查看代码图像\n\n```csharp\npublic\
  \ ActionResult Repeat(String text, Int32 number=4)\n{\n    var model = new RepeatViewModel\
  \ {Number = number, Text = text};\n    return View(model);\n}\n```\n\n关于控制器签名的任何决定取决于你。通常，你可能希望使用与实际数据非常接近的类型。例如，使用\
  \ `Object` 参数可以避免异常，但会让你编写整洁的代码变得困难。\n\n### 绑定复杂类型\n\n方法签名中列出的参数数量没有限制。然而，使用容器类通常比列出一长串独立参数要好。对于默认绑定器来说，无论列出一系列参数还是只列出一个复杂类型的参数，结果几乎是相同的。两种情况都完全支持。示例如下：\n\
  \n点击此处查看代码图像\n\n```csharp\npublic class ComplexController : Controller\n{\n    public\
  \ ActionResult Repeat(RepeatText inputModel)\n    {\n        var model = new RepeatViewModel\n\
  \        {\n            Title = \"Repeating text\",\n            Text = inputModel.Text,\n\
  \            Number = inputModel.Number\n        };\n        return View(model);\n\
  \    }\n}\n```\n\n\n\n\n控制器方法接收一个类型为 `RepeatText` 的对象。该类是一个简单的数据传输对象（DTO），定义如下：\n\
  \n点击此处查看代码图像\n\n```csharp\npublic class RepeatText\n{\n    public String Text {\
  \ get; set; }\n    public Int32 Number { get; set; }\n}\n```\n\n如你所见，该类包含的成员与你在上一个示例中作为单独参数传递的数值相同。模型绑定器（model\
  \ binder）处理这种复杂类型的方式与处理单值一样高效。\n\n对于声明的类型中的每个公共属性（在本例中为 `RepeatText`），模型绑定器会寻找键名与属性名匹配的提交值。这种匹配是不区分大小写的。以下是一个可以与\
  \ `RepeatText` 参数类型工作的示例 URL：\n\n[`http://server/Complex/Repeat?text=ASP.NET%20MVC&number=5`](http://server/Complex/Repeat?text=ASP.NET%20MVC&number=5)\n\
  \n### 绑定集合\n\n如果控制器方法期望的参数是一个集合怎么办？例如，你能将提交的表单内容绑定到 `IList<T>` 参数吗？`DefaultModelBinder`\
  \ 类使得这成为可能，但需要你进行一些设计。请查看图 8-5。\n\n![Image](img/00049.jpeg)\n\n**图 8-5** 该页面将提交一个字符串数组。\n\
  \n当用户点击发送按钮时，表单会提交其内容。具体来说，它会发送各个文本框的内容。如果文本框具有不同的 ID，提交的内容将采取如下形式：\n\n点击此处查看代码图像\n\
  \n```text\nTextBox1=admin@contoso.com&TextBox2=info@contoso.com&TextBox3=&TextBox4=&TextBox5=\n\
  ```\n\n在经典的 ASP.NET 中，这是唯一的工作方式，因为你不能给多个控件分配相同的 ID。然而，如果你自己管理 HTML，没有任何可以阻止你为图中的五个文本框分配相同的\
  \ ID。事实上，HTML DOM 完全支持这种场景（尽管不建议这样做）。因此，以下标记在 ASP.NET MVC 中是完全合法的，并产生在所有浏览器上运行的\
  \ HTML：\n\n点击此处查看代码图像\n\n```razor\n@using (Html.BeginForm())\n{\n    <h2>列出您的电子邮件地址(们)</h2>\n\
  \    foreach(var email in Model.Emails)\n    {\n        <input type=\"text\" name=\"\
  email\" value=\"@email\" />\n        <br />\n    }\n    <input type=\"submit\" value=\"\
  Send\" />\n}\n```\n\n必须处理表单中输入的电子邮件地址的控制器方法，其预期的签名（signature）是什么样的？这里是签名：\n\n点击此处查看代码图像\n\
  \n```csharp\npublic ActionResult Emails(IList<String> email)\n{\n    ...\n}\n```\n\
  \n图 8-6 显示，得益于默认绑定器类，字符串数组被正确地传递给了方法。\n\n![Image](img/00050.jpeg)\n\n**图 8-6** 已提交了一个字符串数组。\n\
  \n最后，为了确保将值集合传递给控制器方法，你需要确保具有相同 ID 的元素被输出到响应流中。那么，该 ID 必须根据绑定器的常规规则匹配控制器方法的签名。\n\
  \n### 生成动作结果（action results）\n\n动作方法可以产生各种结果。例如，动作方法可以仅作为一个 Web 服务，并在响应请求时返回一个普通字符串或\
  \ JSON 字符串。同样，动作方法可以判断没有内容要返回，或者需要重定向到另一个 URL。在这两种情况下，浏览器将只收到一个没有实际内容的 HTTP 响应。这意味着，产生动作的原始结果（例如，从中间层收集值）是一回事，而处理该原始结果为浏览器生成实际的\
  \ HTTP 响应是另一回事。\n\n#### 包装结果（Wrapping results）\n\n动作方法通常返回一个类型为 `ActionResult` 的对象。然而，`ActionResult`\
  \ 类型并不是数据容器。更准确地说，它是一个抽象类，提供了一个公共编程接口来代表动作方法执行某些后续操作。所有这些后续操作都与为请求的浏览器生成响应有关。\n\n\
  #### 深入研究 `ActionResult` 类\n\n以下是 `ActionResult` 类在 ASP.NET MVC 框架中的定义：\n\n点击此处查看代码图像\n\
  \n```csharp\npublic abstract class ActionResult\n{\n    protected ActionResult()\n\
  \    {\n    }\n    public abstract void ExecuteResult(ControllerContext context);\n\
  }\n```\n\n表 8-1 列出了所有的 `ActionResult` 类型。\n\n![Image](img/0051.jpeg)\n\n**表 8-1**\
  \ 预定义的 ActionResult\n\n注意，`FileContentResult`、`FilePathResult` 和 `FileStreamResult`\
  \ 都派自同一个类 `FileResult`。如果你想通过下载文件甚至二进制内容来响应请求，可以使用这些动作结果。`PartialViewResult` 和 `ViewResult`\
  \ 继承自 `ViewBase` 并返回 HTML。最后，`HttpUnauthorizedResult` 和 `HttpNotFoundResult` 分别代表未授权和未未找到。它们都派自\
  \ `HttpStatusCodeResult`。\n\n##### 检查动作结果的机制\n\n为了更好地理解动作结果的机制，让我们分析其中一个类。我选择了 `JavaScriptResult`\
  \ 类，它提供了一些并不复杂的行为。`JavaScriptResult` 类代表向浏览器返回脚本。这里是一个提供 JavaScript 的可能动作方法：\n\n\
  点击此处查看代码图像\n\n```csharp\npublic JavaScriptResult GetScript()\n{\n    var script\
  \ = \"alert('Hello')\";\n    return JavaScript(script);\n}\n```\n\n在示例中，`JavaScript`\
  \ 是 `Controller` 类中的辅助方法，作为 `JavaScriptResult` 对象的工厂。它的实现如下：\n\n```csharp\nprotected\
  \ JavaScriptResult JavaScript(string script)\n{\n    return new JavaScriptResult()\
  \ { Script = script };\n}\n```\n\n`JavaScriptResult` 类提供了一个公共属性——`Script` 属性，包含要写入输出流的脚本。以下是它的实现：\n\
  \n点击此处查看代码图像\n\n```csharp\npublic class JavaScriptResult : ActionResult\n{\n   \
  \ public String Script { get; set; }\n    public override void ExecuteResult(ControllerContext\
  \ context)\n    {\n        if (context == null)\n        {\n            throw new\
  \ ArgumentNullException(\"context\");\n        }\n        // 准备响应\n        HttpResponseBase\
  \ response = context.HttpContext.Response;\n        response.ContentType = \"application/x-javascript\"\
  ;\n        if (Script != null)\n        {\n            response.Write(Script);\n\
  \        }\n    }\n}\n```\n\n如你所见，`ActionResult` 类的最终目的是准备返回给浏览器的 `HttpResponse`\
  \ 对象。这包含了设置内容类型、过期策略和头部以及内容。\n\n#### 返回 HTML 标记\n\n\n\n\n\n大多数 ASP.NET MVC 请求都需要将\
  \ HTML 标记返回给浏览器。在 ASP.NET MVC 中，操作方法（action method）生成面向用户的原始结果，视图引擎将这些原始结果组合成 HTML\
  \ 模板。最后，将最终产物组合并作为请求的响应返回。\n\n## 检查视图引擎的结构\n\n视图引擎是物理上为浏览器构建 HTML 输出的组件。对于每个最终指向返回\
  \ HTML 的控制器操作的请求，视图引擎都会启动。它通过将视图模板和控制器传递的任何数据混合在一起来准备输出。模板使用特定引擎的标记语言（例如，`Razor`）表示；数据则以字典或强类型对象的封装形式传递。图\
  \ 8-7 显示了视图引擎和控制器如何协同工作的整体概览。\n\n![Image](img/00052.jpeg)\n\n**图 8-7** 控制器和视图引擎。\n\
  \n在 ASP.NET MVC 中，视图引擎仅仅是一个实现了固定接口的类——`IViewEngine` 接口。每个应用程序可以拥有一个或多个视图引擎，并在不同的视图中使用所有它们。在\
  \ ASP.NET MVC 中，每个应用程序默认配备了两个视图引擎：`Razor` 和 `ASPX`。视图引擎对开发影响最大的方面是它支持的定义视图模板的语法。`ASPX`\
  \ 视图引擎使用与 Web Forms 相同的代码块语法。但最常用的引擎是 `Razor`。`Razor` 语法比 `ASPX` 清洁得多。\n\n## 探索\
  \ Razor 视图引擎的一特性\n\n在 `Razor` 中，视图模板本质上是一个带有几个占位符的 HTML 页面。每个占位符包含一个执行表达式——类似于代码片段。片段中的代码在视图渲染时求值，生成的标记被集成到\
  \ HTML 模板中。\n\nRazor 引擎从磁盘上的物理位置读取视图模板。路径使用 ASP.NET 虚拟路径提供程序获取。任何 ASP.NET MVC 项目都有一个根\
  \ `Views` 文件夹，视图模板存储在特定的子目录结构中。`Views` 文件夹通常有很多子文件夹——每个文件夹以现有的控制器命名。每个特定控制器的子目录包含物理文件，其文件名预期与操作名称匹配。对于\
  \ Razor 视图引擎，扩展名必须是 `.cshtml`。（如果您使用 Microsoft Visual Basic 编写 ASP.NET MVC ，扩展名必须是\
  \ `.vbhtml`。）ASP.NET MVC 要求您将每个视图模板放在使用它的控制器的目录下。如果您预计多个控制器调用同一个视图，请将视图模板文件移动到 `Shared`\
  \ 文件夹下。\n\n注意，项目级 `Views` 文件夹下的相同目录层级在部署站点时必须复制到生产服务器上。Razor 视图引擎定义了几个属性，通过这些属性您可以控制定位视图模板。对于\
  \ Razor 视图引擎的内部工作，您需要为布局、常规和部分视图提供默认位置，包括默认项目配置和使用 Area 的情况。表 8-2 显示了 Razor 视图引擎支持的带有预定义值的属性。\n\
  \n![Image](img/00053.jpeg)\n\n**表 8-2** Razor 引擎的默认位置格式\n\n如您所示，位置不是完全路径，但它们可以包含最多三个占位符。占位符\
  \ `{0}` 指视图名称，因为它是从控制器方法调用的。占位符 `{1}` 指控制器名称，因为它被用于 URL 中。最后，控制器 `{2}`（如果指定）指 Area\
  \ 的名称。\n\n## 调用视图引擎\n\n在控制器方法内部，您通过调用 `View` 方法来调用视图引擎，如下：\n\n点击此处查看代码图像\n\n```\n\
  public ActionResult Index()\n{\n   return View(); // 等同于 View(\"index\");\n}\n```\n\
  \n`View` 方法是一个负责创建 `ViewResult` 对象的辅助方法。`ViewResult` 对象需要知道视图模板、可选的布局视图以及合并到最终 HTML\
  \ 中的原始数据。仅仅因为代码片段中的 `View` 方法没有参数，并不意味着没有传递数据。以下是该方法的完整签名：\n\n点击此处查看代码图像\n\n```\n\
  protected ViewResult View(String viewName, String masterViewName, Object viewModel)\n\
  ```\n\n这里是一个更常见的控制器方法模式：\n\n点击此处查看代码图像\n\n```\npublic ActionResult Index(...)\n\
  {\n   var model = GetRawDataForTheView(...);\n   return View(model);\n}\n```\n\n\
  在这种情况下，视图名称默认为操作名称，无论它是从方法名隐式推断的还是通过 `ActionName` 属性显式设置的。布局视图默认为 `_Layout.cshtml`。最后，变量\
  \ `model` 表示要合并到最终 HTML 中的数据模型。\n\n布局视图是视图基于的通用模板。布局视图文件位于 `Shared` 文件夹中。在最简单的形式下，布局视图所示：\n\
  \n点击此处查看代码图像\n\n```\n<html>\n<head>\n  <link href=\"@Url.Content(\"~/Content/site.css\"\
  )\" rel=\"stylesheet\" type=\"text/css\" />\n  <script src=\"@Url.Content(\"~/Scripts/jquery.js\"\
  )\" type=\"text/javascript\"></script>\n</head>\n  <body>\n      @RenderBody()\n\
  \  </body>\n</html>\n```\n\n`@RenderBody` 调用指示注入到布局模板中的特定视图。`@Url.Content` 表达式是站点根路径的设施。波浪符号实际上指向站点的根。\n\
  \n在视图中使用的任何数据模型必须通过 `@model` 指令声明：\n\n点击此处查看代码图像\n\n```\n@model MySite.ViewModel\n\
  <html>\n<head>\n  <title>@Model.Title</title>\n</head>\n<body>\n  @RenderBody()\n\
  </body>\n</html>\n```\n\n在指令中声明的类型必须与您从控制器调用 `View` 方法时传递的对象类型兼容。在视图正文中，您使用 `@Model.XXX`\
  \ 语法引用对象的属性。\n\n让我们进一步了解 `@` 字符。\n\n## 使用代码片段\n\n在 Razor 模板中，可以看到普通的 HTML 标记和代码片段。`@`\
  \ 字符表示代码片段的开始。有趣在于，在 Razor 中您需要指示代码片段的开始，之后内部解析器使用 Visual Basic 或 C# 解析逻辑来确定代码行的结束。这是一个示例：\n\
  \n点击此处查看代码图像\n\n```\n<html>\n<head>\n  <title>@ViewBag.Title</title>\n</head>\n\
  <body>\n  ...\n</body>\n</html>\n```\n\n在代码片段中，`ViewBag.Title` 表达式指的是您从控制器传递数据的另一种方式。`ViewBag`\
  \ 是一个动态对象，从控制器构建而成以包含要在视图中消耗的数据：\n\n点击此处查看代码图像\n\n```\npublic ActionResult Index(...)\n\
  {\n   // 获取视图数据\n   ...\n   // 为视图封装数据\n   ViewBag.Title = ...;\n   ViewBag.Xxx\
  \ = ...;\n   ...\n   // ViewBag 隐式传递给视图引擎\n   return View();\n}\n```\n\n`ViewBag`\
  \ 是 `dynamic` 类型的对象，这意味着涉及它的任何表达式都不会预先编译，而是在运行时解释。\n\n\n\n\n\n任何 Razor 代码段都可以与纯标记混合使用，即使代码段包含\
  \ `if/else` 或 `for/foreach` 等控制流语句。这里有一个简单的示例，展示了如何构建一个 HTML 表格：\n\n点击此处查看代码图像\n\
  \n```html\n<body>\n    <h2>我最喜爱的城市</h2>\n    <hr />\n    <table>\n      <thead>\n\
  \        <tr>\n          <th>城市</th>\n          <th>国家</th>\n          <th>去过那里？</th>\n\
  \        </tr>\n      </thead>\n      <tbody>\n        @foreach (var city in ViewBag.Cities)\
  \ {\n          <tr>\n            <td>@city.Name</td>\n            <td>@city.Country</td>\n\
  \            <td>@(city.Visited == true ? \"是\" : \"否\")</td>\n          </tr>\n\
  \        }\n      </tbody>\n    </table>\n</body>\n```\n（注代码逻辑修正）\n\n请注意，放置在源代码中间的右大括号（你可以在\
  \ `@foreach` 那一行看到它）会被解析器正确地识别和解释。\n\n在 Razor 模板中，只要表达式以 `@*` 开头，你使用任何 C# 或 Visual\
  \ Basic 指令。这里有一个如何导入命名空间并创建表单块的示例：\n\n点击此处查看代码图像\n\n```csharp\n@using MyApp.Components;\n\
  \n...\n\n<body>\n    @using (Html.BeginForm()) {\n        <div class=\"editor-field\"\
  >\n            <span>...</span>\n        </div>\n    }\n</body>\n```\n\n你可以将多行代码封装在\
  \ `@{ code }` 块中，在任何地方插入一个完整的代码段，如下所示：\n\n```csharp\n@{\n    var user = \"Dino\"\
  ;\n}\n```\n\n...\n\n<p>@user</p>\n\n你创建的任何变量都可以稍后被检索和使用，就像代码属于同一个代码块一样。多个标记（例如标记和代码）可以使用圆括号在同一个表达式中组合：\n\
  \n点击此处查看代码图像\n\n```html\n<p> @(\"欢迎, \" + user) </p>\n```\n\nRazor 处理的任何内容都会自动进行编码，因此你不需要担心这一点。如果你的代码返回了\
  \ HTML 标记，且你希望原样输出它而不进行自动编码，你应该求助于 `Html.Raw` 辅助方法：\n\n点击此处查看代码图像\n\n```csharp\n\
  @Html.Raw(Strings.HtmlMessage)\n```\n\n最后，当在使用 `@{ ... }` 的多行代码段内部时，你使用 C# 或 Visual\
  \ Basic 语言语法来放置注释。你可以使用 `@* ... *@` 语法注释掉整个 Razor 代码块。操作方法如下：\n\n点击此处查看代码图像\n\n\
  ```razor\n@*\n<div> 一些 Razor 标记 </div>\n@*\n```\n\n基于 C# 的 Razor 视图与基于 Visual Basic\
  \ 语言的视图之间存在一些微差异。在 Visual Basic 中，你可以直接在源代码中编写 XML 字面量；这会导致在解析某些 Razor 标记时产生歧义。以下表达式在\
  \ C# 中是可以接受的，但它不能字面上迁移到 Visual Basic：\n\n```csharp\n@if (isHelloWorld) {\n    <h1>\
  \ Hello world </h1>\n}\n```\n\n在 Visual Basic 中，你需要在 HTML 字面量前加上一个额外的 `@` 符号，如下所示：\n\
  \n```vb\n@If (isHelloWorld) Then\n    @<h1>Hello world</h1>\nEnd If\n```\n\n正如你可能所知道的，大多数\
  \ Visual Basic 结构都需要一个结束标签。`For..Each`、`If`、`Using` 等都是如此。结束标签不需要以 `@` 符号为缀。\n\n\
  ### 部分视图 (Partial views)\n\n有时，将一些常用的 Razor 标记隔离到单独的文件并仅从主视图或视图内部引用它是很有用的。如果你熟悉\
  \ ASP.NET Web Forms 编程，这与用户控件（user controls）提供的服务。在 ASP.NET MVC 中，你通过使用 `Html` 内部对象上的\
  \ `Partial` 辅助方法来实现相同的效果：\n\n点击此处查看代码图像\n\n```csharp\n@Html.Partial(\"name_of_the_view\"\
  )\n```\n\n`Partial` 方法返回一个字符串，该字符串被包含在视图引擎处理的流中。部分视图是一个与视图或模板具有结构和语法的普通文件。部分视图的典型位置是\
  \ `Views` 下的 `Shared` 文件夹。然而，将部分视图存储在特定的文件夹下也是允许的。当部分视图在给定控制器处理的视图范围之外使用时，就会发生这种情况。\n\
  \n#### 返回 JSON 内容\n\nASP.NET MVC 非常适合实现简单的 Web 服务，供 Ajax 上下中的 jQuery 代码段回调。你只需要设置一个或多个操作方法（action\
  \ methods）返回 JSON 字符串而不是 HTML。这里有一个示例：\n\n点击此处查看代码图像\n\n```csharp\npublic JsonResult\
  \ GetCustomers()\n{\n    // 获取数据\n    var customers = _customerRepository.GetAll();\n\
  \    // 序列化返回\n    return Json(customers);\n}\n```\n\n`Json` 辅助方法获取对象并使用内置的 `JavaScriptSerializer`\
  \ 类进行序列化。\n\n*\n\n如果你的操作方法没有返回 `ActionResult` 会怎样？首先，不会抛出异常。简单，ASP.NET 将任何返回值（数字、字符串或对象）封装为\
  \ `ContentResult`。例如，`ContentResult` 向浏览器显示字符串。另一方面，返回对象将显示对象的 `ToString` 方法。如果方法返回\
  \ HTML 字符串，浏览器可能不会解析。最后，`void` 返回值实际上映射到 `EmptyResult`。\n\n* *\n\n### 控制器中的异步操作\n\
  \n控制器的主要目的是服务用户界面。你需要实现的任何服务器端函数都映射到控制器方法并从用户界面触发。在执行任务后，控制器方法选择下一个视图，打包数据并告诉它渲染。\n\
  \n这就是控制器行为的核心。然而，控制器通常需要其他特性，特别是当应用于大型应用程序时。在早期的 ASP.NET 版本中，你必须遵循特定的模式赋予控制器方法异步行为。在较版本的\
  \ ASP.NET 和 .NET Framework 中，你可以利用 `async/await` 语言设施和底层的 .NET Framework 机制。这里是如何编写带有一个或多个异步方法的类：\n\
  \n点击此处查看代码图像\n\n```csharp\npublic class HomeController : AsyncController\n{\n  \
  \  public async Task<ActionResult> Rss()\n    {\n        // 执行可能耗时的操作\n        var\
  \ client = new HttpClient();\n        var rss = await client.GetStringAsync(someRssUrl);\n\
  \        // 解析 RSS 并构建视图模型\n        var model = new HomeIndexModel();\n        model.News\
  \ = ParseRssInternal(rss);\n        return model;\n    }\n}\n```\n\n注意，使用异步控制器方法对方法本身并没有严格益处，因为它并因此因此运行得更快。相反，它对整个应用程序非常有益，因为不会为了等待某些可能耗时的任务完成而锁定任何\
  \ ASP.NET 线程。如果你使用异步控制器方法，整个应用程序将具有更高的响应能力。\n\n* * *\n\n### 总结\n\n\n\n\nASP.NET\
  \ MVC 的一个特征是它并不将 URL 对应磁盘文件；相反，它通过解析 URL 来确定下一个要执行的操作（action）。然后，该操作会被映射到控制器（controller）类中的一个方法。每个方法的执行在最后都会终止，并将结果序列化回给请求的浏览器。最常见的操作结果类型是\
  \ HTML 视图，但也可以可能的其他类型的响应，包括 JSON、纯文本、二进制数据和重定向。\n\n在本章中，我简述了构成典型 ASP.NET MVC 请求工作流的组件。首先，URL\
  \ 路由 HTTP 模块会检查传入的请求，并确定将处理该请求的控制器以及被调用的方法。接着，绑定层介入，并将提交的数据（如查询字符串、表单、cookie、标头或路由）映射到控制器方法的签名上。如果映射成功，控制器方法将运行并产生原始结果（raw\
  \ results）。原始结果是你任何想要返回给用户的数据——集合、字符串、数字、日期或任何内容。最后，视图引擎会选取一个视图模板并为浏览器生成 HTML。控制器不仅限于返回\
  \ HTML。在 ASP.NET MVC 中，控制器可以轻松地返回任何序列化为 XML、纯文本或 JSON 的数据类型。\n\n本章仅触及了 ASP.NET MVC\
  \ 的皮毛，但它提供了运作方式的概述。在下一章中，我将尝试解释 Twitter Bootstrap——这是一个 CSS 和图形库，你可以用它有效地安排 HTML\
  \ 视图的布局和用户界面。从第 11 章“展示数据](#part0018.html_ch11)”开始，我回到 Razor 并讨论在视图中展示和编辑数据的常用方法。\n\
  \n# 第 9 章 Bootstrap 核心\n\n*计算机非人性之处在于，一旦它被很好地编程并运行顺利，它就是完全诚实的。*\n\n*——艾萨克·阿西莫*\n\
  \nBootstrap 最初是为 Twitter 内部目的开发的，是一个 CSS 和 JavaScript 库，旨在简化现代网页的构建。但到底什么是“现代网页”呢？\n\
  \n简单来说，现代网页就是按照如今大多数用户喜好的方式构建的网页。HTML 语言仍然是网页的基础和核心语言。然而，HTML 标记语言的构建块已经越来越无法快速直接地表达现代页面所包含的复杂性和精致程度。例如，下拉菜单、分段选项按钮、标签页、折风琴组件和模态对话框都是大多数面的常见元素，但还没有直接的\
  \ HTML 元素可以方便地使用它们。\n\nBootstrap 提供了一种直接的方法，将 HTML 块转换为现代网站所需的更复杂的视觉元素。\n\n### Bootstrap\
  \ 概览\n\nBootstrap 是一个由 CSS 和 JavaScript 文件组成的模块化 Web 库。CSS 文件包含类类，用于重新设计常见的 HTML\
  \ 元素，使它们看起来不同且可能更漂亮。JavaScript 文件以 jQuery 插件集合的形式出现，并支持仅凭 CSS 无法实现的更复杂的功能。\n\nBootstrap\
  \ 最初是作为 LESS 文件集合开发的，你仍然可以作为 LESS 文件集合的形式获取该库的 CSS 部分。本质上，对于 Bootstrap 库组成的每个模块，你都拥有一个\
  \ LESS 或 CSS 文件：表单、按钮、导航栏、对话框等。在深入介绍 Bootstrap 库的细节之前，让我们先快速查看 LESS。\n\n### LESS\
  \ 和 Bootstrap 的基础\n\nLESS 文件是对纯 CSS 语法的抽象，它赋予了开发者声明 CSS 文件最终将如何被使用的能力。你可以将 LESS\
  \ 视为一种编程语言，它在编译后会生成 CSS。在 LESS 文件中，你可以使用变量、函数和运算符，从而极大地简化了创建和维护大型复杂 CSS 表格的过程。\n\
  \n#### 变量\n\n开发者通过 LESS 解决的最大问题之一是信息的重复。作为一名软件开发者，你可能非常熟悉“不要重复自己”（DRY）原则并每天应用它。DRY\
  \ 的主要益处是减少了存储相同信息的地方，从而减少了需要更新的地方。在纯 CSS 中，你根本没有 DRY 可言。例如，如果某个特定颜色被多个 CSS 类使用——并且在某个时刻你必须更改它——你可能没有比在每个出现的地方都更新它更好的方法了。\n\
  \nCSS 类 类的问题在于它们在语义化 HTML 元素层级上运行。在构建各种 CSS 类时，你通常必须重复小段信息，例如颜色或宽度。你无法轻松地为这些每个可重复的小片段创建一个类。即使你设法为几乎任何可重复的样式（如颜色和宽度）创建了\
  \ CSS 类，当对语义化元素（例如容器）进行样式处理时，你需要将多个 CSS 类连接在一起以实现所需效果。\n\n考虑以下 CSS 示例：\n\n```css\n\
  .container {\n    color: #111;\n}\n\n.header {\n    background-color: #111;\n}\n\
  ```\n\n`container` 和 `header` CSS 类依赖于相同的颜色。如果该颜色必须更改，你必须遍历所有使用它的地方并进行编辑。以下是你如何以\
  \ LESS 的方式重写相同的功能：\n\n```less\n@black: #111;\n\n.container {\n    color: @black;\n\
  }\n\n.header {\n    background-color: @black;\n}\n```\n\n现在，颜色定义在一个地方处，作为一个全局变量。因此，LESS\
  \ 是一种向 CSS 添加了程序员友好型概念（如变量）的语言。但它还可以做更多。\n\n#### 导入\n\n你可以将 LESS 代码拆分到多个文件中，并在需要的地方引用它们。假设，你创建一个\
  \ `container.less` 文件，内容如下：\n\n```less\n@black: #111;\n\n.container {\n    background-color:\
  \ @black;\n}\n```\n\n在另一个 LESS 文件——例如 `main.less` 中，你可以通过导入来引用整个 CSS：\n\n```less\n\
  @import \"container\";\n\n.body { .container; }\n```\n\n如果 `container.less` 文件（不需要扩展名）位于不同的文件夹中，你应该在调用\
  \ `@import` 时指定路径。\n\n#### 混合器 (Mixins)\n\n特别是网页必须适应不同屏幕尺寸的时代，适应 CSS 样式的能力至关重要。例如，当按钮在平板电脑上查看并受到粗指针（如手指）的影响时，开发者经常增加按钮周围的内边距。通常，如何让同一个类根据某些条件改变并看起来不同？这就是\
  \ LESS 混合器的用武之地。\n\n这里有两个混合器：\n\n点击此处查看代码\n\n```less\n.shadow(@color) {\n    box-shadow:\
  \ 3px 3px 2px @color;\n}\n\n.text-box(@width) {\n    .shadow(#555);\n    border:\
  \ solid 1px #000;\n    background-color: #dddd00;\n    padding: 2px;\n    width:\
  \ @width;\n}\n```\n\n从这里你可以推导出更具体的 CSS 类，如下：\n\n```less\n.text-box-mini {\n    .text-box(50px);\n\
  }\n\n.text-box-normal {\n    .text-box(100px);\n}\n\n.text-box-large {\n    .text-box(200px);\n\
  }\n```\n\n这正是 Bootstrap 在内部支持按钮和输入字段等常见元素样式的方法。\n\n### 将 LESS 转换为 CSS\n\n虽然 LESS\
  \ 可以作为 CSS 的元语言，但 LESS 并不是 CSS。它必须通过某种方式处理以生成纯 CSS。LESS 代码可以原样下载并在客户端通过 JavaScript\
  \ 代码处理，也可以在服务器上进行预处理并作为纯 CSS 下载到客户端。在前一种情况下，一切就像使用纯 CSS 文件一样：服务器端的更改将在下次刷新页面时应用到客户端。\n\
  \n\n\n\n但是，如果你有性能考量并且有大型、复杂的 CSS 文件需要处理，服务器端预处理可能是更好的选择。服务器端预处理是你每次在服务器上修改 CSS 时进行的操作。通常，你会在构建过程结束时使用命令行中的\
  \ `LESS` 编译器执行此额外步骤。像 `Gulp` 这样的工具有助于通过 JavaScript 相关的步骤来扩展构建过程。另一个流行的工具如 `Microsoft\
  \ Web Essentials`——一个 Visual Studio 插件——可以用于添加临时菜单命令，以处理 CSS 和脚本文件等网络资源。\n\n在 `ASP.NET\
  \ MVC` 中，还有另一种可能的路径。你可以将 `LESS` 框架集成到包（bundle）和最小化（minification）机制中。正如你将在下一章中详细看到的，打包是将多个不同的资源合并成单个可下载资源的过程。例如，一个包资源包可能包含多个\
  \ JavaScript 或 CSS 文件，你通过对一个临时端点发送单个 HTTP 请求将它们下载到本地机器。最小化是应用到资源的一种特殊转换。具体来说，最小化是从基于文本的资源中移除所有不必要的字符，且不更改预期的功能。这意味着移除注释、空白字符、换行符，以及通常为了可读性而添加但占用空间且不起任何实际用途的所有字符。\n\
  \n### 设置 Bootstrap\n\n你可以从 `NuGet` 或直接从 [`getbootstrap.com`](http://getbootstrap.com)\
  \ 下载 Bootstrap。在这种情况下，你可以更轻松地只获取框架中需要的部分。在整个网站中使用 Bootstrap 是很常见的。在这种情况下，所示所示从主视图（master\
  \ view）中链接它：\n\n点击此处查看代码图像\n\n```html\n<meta name=\"viewport\" content=\"width=device-width,\
  \ initial-scale=1.0\">\n<link rel=\"stylesheet\" src=\"@Url.Content(\"~/content/styles/bootstrap.min.css\"\
  )\">\n```\n\n`viewport` meta 标签将浏览器视口的宽度设置为实际设备宽度，并将缩放级别设置为“正常（Normal）”。`link` 元素仅引入了\
  \ Bootstrap 样式表的最小化版本。如果你打算使用需要 JavaScript 的更高级的 Bootstrap 功能，你还需要链接脚本文件，以及它依赖的\
  \ jQuery 文件：\n\n点击此处查看代码图像\n\n```html\n<script type=\"text/javascript\" src=\"@Url.Content(\"\
  ~/content/scripts/jquery-2.1.4.min.js\")\"></script>\n<script type=\"text/javascript\"\
  \ src=\"@Url.Content(\"~/content/scripts/bootstrap.min.js\")\"></script>\n```\n\n\
  如果你使用的是完整的 Bootstrap 库，一旦链接了 CSS 和脚本文件，你的工作就基本完成了。如果你只使用 Bootstrap 库的部分，你必须确保你所需的所有部分已正确链接。请注意，Bootstrap\
  \ 库的某些功能——例如工具提示（tooltips）和弹出框（popovers）——需要在单个页面中添加一些启动 JavaScript 代码。\n\n***\n\
  \n![Image](img/00004.jpeg) 注意事项\n\nBootstrap 不支持旧的 Internet Explorer 兼容模式。确保你的页面在\
  \ Internet Explorer 下以最佳渲染模式查看的最好方法是在你的页面中添加以下 `meta` 标签：\n\n点击此处查看代码图像\n\n```html\n\
  <meta http-equiv=\"X-UA-Compatible\" content=\"IE=edge\">\n```\n\nBootstrap 的 CSS\
  \ 类使用了最新的 CSS 特性（如圆角），这些特性在旧版浏览器上可能不可用。Bootstrap 部分支持的旧浏览器的一个良好例子是 Internet Explorer\
  \ 8。\n\n***\n\n### 从视角来看待 Bootstrap\n\nTwitter Bootstrap 如今几乎是必不可少的。其原因在于 Bootstrap\
  \ 使得为现代网站添加高级功能变得快速且简单。Bootstrap 的学习曲线相对较短，并且有许多基于它的模板可以免费获取。然而，对于任何网页设计师来说，自定义基础\
  \ Bootstrap 模板以获得独特的艺术效果并不是什么难事。\n\nBootstrap 是否完美适合你的项目取决于美性的重要性。如果你是为要求具有独特外观和感受的客户开发，Bootstrap\
  \ 可能是理想的，也可能不理想。在这种情况下，开发团队只需接收一个图形模板并直接使用它。另一方面，Bootstrap 非常适合美学重要但非根本性的快速开发项目。\n\
  \n换句话说，Bootstrap 是一项伟大的成就，但它并没有消除对优秀设计的需求。同时，它也没有消除根据每个设备定义优异用户体验的需求。很容易找到基于 Bootstrap\
  \ 的免费或付费模板网站。如果你限制自己只使用默认 Bootstrap 库的样式——而不更改 `CSS` 或 `LESS` 源代码——那么风险是所有网站最终看起来都变得一样。\n\
  \n决定是否使用 Bootstrap 是一项架构决策，必须在项目早期做出，而且这是一个在后期很难更改的决定。在正在进行中的项目中添加或移除 Bootstrap\
  \ 是非常有问题的，尽管并非不可能。最后，请考虑一下完整的 Bootstrap 库大约有 100 KB 的 `CSS` 加上 30 KB 的 `script`。它不是巨大的资源，但也不是轻量级资源——特别是对于较小的设备而言。\n\
  \nBootstrap 快速采用的关键原因之一是让不同设备查看页面的成本很低。\n\n***\n\n\n\n\n\n## 总体模板\n\n任何旨在响应屏幕尺寸变化的\
  \ Bootstrap 内容都基于行和列的矩阵。整体容器——即*矩阵*——是一个样式为 `container` 的 DIV 元素。（参见图 9-1。）\n\n\
  ![Image](img/00054.jpeg)\n\n**图 9-1** Bootstrap 中流式网格的架构图\n\n## 容器与行\n\n最外层容器处理任何必要的对齐，并负责内边距（padding）。如果你没有显式定义行（row），则假设有一个全高行。任何用户界面内容都放置在列（column）中。注意，只有列可以是行的直接子。Bootstrap\
  \ 中的任何内容通常按照以下架构布局：\n\n`container > row > column`\n\n上行代码中的每个单词都指的是你通常应用到 DIV 元素的\
  \ Bootstrap 类名。特别是，`container` 管理页面的宽度和内边距。`row` 确保内容放置在同一行内，并且多行会垂直堆叠。如果你的代码中没有行元素，容器内的任何内容将水平流动，并在到达屏幕末端时换到下一行。\n\
  \n最后，`column` 元素识别行内的单块内容块。Bootstrap 为列定义了几个实际的类。要在行中定义列，你使用遵循以下模式的类名：`col-XX-N`。在模式中，`XX`\
  \ 代表设备族的前缀，可以是表 9-1 中的任何一个值。正如你稍后将看到的，每个 XX 代码都绑定到一个特定的像素宽度，被称为*断点*（breakpoint）。\n\
  \n![Image](img/00055.jpeg)\n\n**表 9-1** 设备的 Bootstrap 代码\n\n模板中的 *N* 是介于 1 到 12\
  \ 之间的数字，它表示内容列在虚拟网格中实际上占据了多少列。让我们来看一个例子：\n\n点击此处查看代码图像\n\n```\n<div class=\"container\"\
  >\n  <div class=\"row\">\n      <div class=\"col-xs-6 col-md-4\"> First </div>\n\
  \      <div class=\"col-xs-6 col-md-4\"> Second </div>\n      <div class=\"col-xs-6\
  \ col-md-4\"> Third </div>\n  </div>\n</div>\n```\n\n在这种情况下，你希望在单行内渲染一个三列布局。所有列的尺寸将相同。在中等设备上，所有列都显示在单行中。`col-md-4`\
  \ 样式使每列的宽度在虚拟 Bootstrap 网格系统中等于四列（共 12 列中的四列）。\n\n更小和更大的设备呢？\n\n在 XS 设备上，三列内容在渲染时各将占据屏幕的一半。正如你可能猜的那样，如果每一列都必须占据屏幕的一半，那么三个布局列就无法放入屏幕。在这种情况下，第三列将溢出到下一行。在\
  \ SM 设备上也会发生这种情况。另一方面，在 LG 设备上，规则是由 MD 样式设置的。\n\n结论是，流行中的每一列都可以使用多设备属性进行宽度样式设置。这些属性在输入更具体的设置之前，对于较大的设备始终始终生效的。鉴于此，如果你不需要根据设备来区分布局，你能做的最好的办法就是始终使用\
  \ XS 样式。列样式中 *N* 的总和应最多为 12。如果超过该值，第十二列之后的任何列都将溢出到下一行。\n\n## 容器与流式容器\n\n到为止，我们只考虑了\
  \ DIV 元素的 `container` 类。在某些情况下，你可能还会考虑它的变体：`container-fluid` 类。普通容器对于每个断点都有固定宽度，只有当用户在调整浏览器大小时跨越断点时，视口宽度才会改变。\n\
  \n相反，流式容器占据父元素的全宽度，通常是可用浏览器视口的 100%。视口宽度在每次调整大小时都会重新计算并更新。使用流式容器时，用户体验更流畅，但使用流式容器主要对桌面设备有意义。\n\
  \n### 基于屏幕的渲染\n\n为什么要使用多个列设置？答案在很大程度上取决于你必须显示的实际内容。参考之前的示例，三列布局在中等大小的设备上可能是的，但列的内容可能太丰富，无法在较小屏幕的三分之一处渲染。这就是为什么我在\
  \ DIV 样式中添加了 `col-xs-6`。最终效果是 Bootstrap 将根据屏幕的实际尺寸更改最终行为。\n\n在中等和大设备上，你将有一个三列布局，而在小型和超小设备上每行只有两列。第三列在小型和超小设备上将换到下一行。如果这不是你想要的，你可以考虑在小型和超小设备上隐藏第三列。让我们看看如何操作。\n\
  \n### 虚拟测量与实际屏幕尺寸\n\nBootstrap 的整个网格系统和设备族都基于*断点*（breakpoints），如表 9-1 所示（等等，文中后面提说是表\
  \ 9-2，我将遵循原文）。每个 XX 代码对应于超小、小型、中等和大设备的预期宽度。\n\n要监控 Bootstrap 如何更改页面，可以使用以下脚本：\n\n\
  ```javascript\n<script type=\"text/javascript\">\n  updateSize();\n  $(window).resize(function()\
  \ {\n    updateSize();\n  });\n\n  function currentBootstrapClass() {\n    var screen\
  \ = \"LG\";\n    var width = $(window).width();\n    if (width <= 768) {\n     \
  \ screen = \"XS\";\n    } else if (width <= 992) {\n      screen = \"SM\";\n   \
  \ } else if (width <= 1200) {\n      screen = \"MD\";\n    }\n    return screen;\n\
  \  }\n\n  function updateSize() {\n    var info = currentBootstrapClass();\n   \
  \ $('#currentScreenWidth').text($(window).width() + \"px\");\n    $('#currentViewport').text(info);\n\
  \  }\n</script>\n```\n\n显然，网页必须具有具有匹配 ID 的元素：\n\n点击此处查看代码图像\n\n```html\n<span id=\"\
  currentScreenWidth\"></span>\n<span id=\"currentViewport\"></span>\n```\n\n图 9-2\
  \ 显示了一个示例。\n\n![Image](img/00057.jpeg)\n\n**图 9-2** 显示屏幕尺寸与 Bootstrap 类之间的关系\n\n\
  `col-xx-n` 类是 Bootstrap 提供的适应页面布局的主要工具。也存在更强大的工具可以在特定尺寸下隐藏和嵌套列。\n\n## 多分辨率视图\n\n\
  正如提到的，就列布局而言，你可以为容器和行分配多个设置。让我们来看一个有趣的例子：\n\n点击此处查看代码图像\n\n```html\n<div class=\"\
  container\">\n  <div class=\"row\">\n      <div class=\"col-xs-6 col-md-4\"> Column\
  \ #1 <br /> Column #1 <br /></div>\n      <div class=\"col-xs-6 col-md-4\"> Column\
  \ #2 </div>\n      <div class=\"col-md-4\"> Column #3 </div>\n  </div>\n</div>\n\
  ```\n\n\n\n\n第一列在 XS 和 SM 模式下占据空间的一半，在 MD 和 LG 模式下占据三分之一。然而，第一列的内容包含一些 `BR` 元素，这使得列比其他列高。在\
  \ MD 和 LG 中，显示效果完全如预期的那样——一行三列。但在 XS 和 SM 中，第三列将显示在哪里呢？请查看图 9-3。\n\n![Image](img/00058.jpeg)\n\
  \n**图 9-3** 第三列浮动在当前行的正左侧，占据任何可用空间。\n\n在 XS 和 SM 模式下，前两列由于它们的 `col-xs-6` 类而占据了整个屏幕。随后，第三列流到下一行。然而，在这个特定的示例中，第一列比其他列高，这会在右侧留出一些空间。Bootstrap\
  \ 重用这些屏幕空间来适应换行到下一行的列。\n\n通常情况下，每当你使用 `col-xx-n` 类时，你实际上是在使用设置为 `left`（或 `right`）的\
  \ CSS `float` 属性，并告诉浏览器寻找最左侧（或最右侧）的可用空间放置给定元素。注意，要右对齐，只需在所需的元素上添加 `pull-right` 类即可。\n\
  \n### 尺寸特定类\n\n如果你想强制第三列到下一行但保持在左侧怎么办？你必须显式地停止默认对齐并恢复 `DIV` 元素的块级属性。在纯 CSS 中，你通过使用带有\
  \ `clear:both` 属性的空 `DIV`来实现。Bootstrap 中等效的方法是使用 `clearfix` 类：\n\n```html\n<div\
  \ class=\"clearfix\"></</div>\n```\n\n图 9-4 显示了如果你盲目使用 `clearfix` 类强制第三行位于下一行的开头时会得到的结果。\n\
  \n![Image](img/00059.jpeg)\n\n**图 9-4** 第三列现在从下一行的起始开始。\n\n如果你将浏览器窗口调整大小为 XS 或 SM\
  \ 模式，一切运行良好。然而，图 9-4 仅显示了 MD 和 LG 模式下发生的情况。如你所见，使用 `clearfix` 类在右侧留下了空隙，第三列本可以很好地放入那里。理想情况下，你可能想要清除\
  \ `DIV` 元素的浮动，但仅针对 XS 和 SM 模式。\n\n在 Bootstrap 中，你拥有 `visible-xx` 和 `hidden-xx` 类专门用于此目的：\n\
  \n点击此处查看代码图像\n\n```html\n<div class=\"clearfix visible-xs\"></</div>\n```\n\n现在的效果正是你想要的。带有\
  \ `clearfix` 类的 `DIV` 现在只在 XS 和 SM 屏幕上输出。同理，你可以使用 `hidden-xx` 类隐藏元素和整行。\n\n* *\n\
  \n![Image](img/00004.jpeg) 备注\n\n`hidden-xx` 类本身是 Bootstrap 提供的一个强大工具，让你创建临时的响应式\
  \ Web 模板，这些模板可以根据用户调整视口或在较小的全屏设备上查看相同内容时调整内容。尽管我将在第 15 章中详细讨论，但响应式 Web 设计是以隐藏不需要的内容为代价的。这种效果对用户来说很好，但对于应用程序并不一定，特别是当在移动设备上使用\
  \ RWD 时。\n\n* *\n\n### 灵活渲染\n\n让我们简要查看使用 `hidden-xx` 类的具体示例。假设你有一个登录表单，包含大量的介绍文字和环绕用户名/密码表的图片：\n\
  \n点击此处查看代码图像\n\n```html\n<div class=\"container\">\n    <h1 class=\"hidden-xs\"\
  >欢迎来到 CONTOSO 工业区</h1>\n    <h4 class=\"visible-xs\">欢迎来到 CONTOSO</h1>\n    <div\
  \ class=\"col-md-4 hidden-xs hidden-sm\">\n        <div class=\"center\">\n    \
  \        <img src=\"~/Content/Images/contoso.png\" />\n        </div>\n    </div>\n\
  </div>\n```\n```\n\n图 9-5 展示了登录表单在 LG 屏幕上的外观。\n\n![Image](img/00060.jpeg)\n\n**图\
  \ 9-5** 在 MD 和 LG 模式下显示的灵活登录表单\n\n`H1` 元素仅在 SM 及更大的设备上显示。在 XS 设备上，`H1` 元素被一个较小的\
  \ `H4` 元素取代。然后，图片仅在 MD 和 LG 屏幕上显示。当你调整浏览器窗口大小时，就能看到差异。\n\n### 偏移和拉取列\n\nBootstrap\
  \ 网格系统还支持列的嵌套。你只需要嵌入一个子行。（注：原文此段存在大量重复文本，已根据要求保留核心含义翻译）\n\n\n\n```html\n<div class=\"\
  input-group\">\n  <label for=\"password\">Password</label>\n  <div class=\"input-group-addon\"\
  >\n    <span class=\"glyphicon glyphicon-lock\"></span>\n  </div>\n  <input type=\"\
  password\" class=\"form-control\" id=\"password\" name=\"password\" maxlength=\"\
  30\" placeholder=\"Password\">\n</div>\n```\n...\n</form>\n\nHTML 表单可以接受两个类：`form-inline`\
  \ 或 `form-horizontal`。如名称所示，这两者都倾向于指示库将子输入元素的渲染优化在单行上（如图 9-5 所示），或在多行水平上，其中标签和输入字段垂直布局。\n\
  \n一个 Bootstrap HTML 表单由多个组组成。每个组通常包含一个标签和一个输入字段——输入字段可以是 `text`、`date`、`password`、`checkbox`、`hidden`\
  \ 等。输入元素应该使用 `form-control` 类进行装饰，并使用 `input-lg` 或 `input-sm` 类进行尺寸调整：\n\n点击此处查看代码图像\n\
  \n```html\n<input type=\"password\" class=\"form-control input-lg\" id=\"password\"\
  >\n```\n\n输入字段上可以拥有的其他属性——如 `maxlength`、`placeholder`、`id`、`name` 和 `value`——都会像通常一样使用和处理。\n\
  \nBootstrap 中一个很有趣的功能是输入附加组件（input add-ons）。输入附加组件是输入字段与按钮、静态文本或两者的结合。单个输入组中的所有元素都被\
  \ Bootstrap 视为同一个 HTML 元素的各个段，如图 9-6 所示。\n\n![Image](img/00061.jpeg)\n\n**图 9-6**\
  \ 带有附加组件的 Bootstrap 输入组\n\n若要让 Bootstrap 生成如图 9-6 所示的成果，你需要的整体标记如下：\n\n点击此处查看代码图像\n\
  \n```html\n<div class=\"input-group input-group-lg\">\n  <span class=\"input-group-addon\"\
  >@</span>\n  <input type=\"text\" class=\"form-control\" placeholder=\"Search for...\"\
  >\n  <span class=\"input-group-btn\">\n    <button class=\"btn btn-default\" type=\"\
  button\">Action</button>\n  </span>\n  <div class=\"input-group-btn\">\n    <button\
  \ type=\"button\" class=\"btn btn-default dropdown-toggle\" data-toggle=\"dropdown\"\
  >\n      <span class=\"caret\"></span>\n    </button>\n    <ul class=\"dropdown-menu\"\
  >\n      <li><a href=\"#\">Action</a></li>\n      ...\n    </ul>\n  </div>\n</div>\n\
  ```\n\n你使用 `input-group-addon` 类来创建文本占位符，使用 `input-group-btn` 类向输入字段添加按钮或菜单。应用于\
  \ `SPAN` 元素时，`caret` 类会渲染出指示有更多内容的经典向下三角形。`UL` 元素定义了下拉项目列表。caret 按钮通过 `dropdown-toggle`\
  \ 设置样式，以表示它有内容可需要显示。最后，`data-toggle` 类指示了内容显示的模态。在这种情况下，它是下拉显示。\n\n***\n\n![Image](img/00006.jpeg)\
  \ 重要\n\n在受 Bootstrap 动作作用的页面中，你仍然可以使用普通的输入字段、按钮和 HTML 元素。只要你不在元素上添加 Bootstrap 特有的类，Bootstrap\
  \ 就不会干预浏览器的渲染。然而，整体的视觉效果可能会与页面的其他部分或应用程序中的其他页面产生冲突，并让用户整体感到不愉快。如果你选择了 Bootstrap，它应该永久存在于你所有的视图中。\n\
  \n### 按钮\n\n在 Bootstrap 中，`btn` 类将提交按钮、普通 HTML 按钮和锚点转换为可点击区域。`btn` 类的效果纯粹是视觉上的；它做的只是添加内边距、边框和颜色。作为一种愉悦的特效，在按钮标题中添加非文本内容再简单不过了。\n\
  \n以下是使用 `btn` 类的最简单方法：\n\n点击此处查看代码图像\n\n```html\n<button class=\"btn\">Login</button>\n\
  <a href=\"#\" class=\"btn\" role=\"button\">...\n```\n\n`btn` 类带有几个其他辅助类，这些类在尺寸和颜色方面刻画了按钮。默认情况下，Bootstrap\
  \ 按钮占据渲染内容加内边距所需的空间。如 `btn-xs` 和 `btn-lg` 等类只是移除或添加额外的内边距。作为颜色，`btn-primary`、`btn-danger`、`btn-alert`、`btn-success`\
  \ 和 `btn-info` 使用不同颜色样式按钮，以指示所实现操作的相关性。从开发者的角度来看，这是为页面提供更一致设计的一种快速方便的方法。\n\n这是定义\
  \ Bootstrap 按钮的常用方法（参见图 9-7）。\n\n点击此处查看代码图像\n\n```html\n<div class=\"btn-group\"\
  >\n  <button type=\"button\" class=\"btn btn-success\">Agree</button>\n  <button\
  \ type=\"button\" class=\"btn btn-default\">Not sure</button>\n  <button type=\"\
  button\" class=\"btn btn-danger\">Disagree</button>\n</div>\n```\n\n![Image](img/00062.jpeg)\n\
  \n**图 9-7** 一个 Bootstrap 按钮 \n\n正如你所看到的，将图片和文本混合在按钮中再简单不过了。在 Bootstrap 中，你使用以下 HTML\
  \ 标记：\n\n点击此处查看代码图像\n\n```html\n<div class=\"btn-group\">\n  <button type=\"button\"\
  \ class=\"btn btn-success\">Agree</button>\n  <button type=\"button\" class=\"btn\
  \ btn-default\">Not sure</button>\n  <button type=\"button\" class=\"btn btn-danger\"\
  >Disagree</button>\n</div>\n```\n\n每个按钮都通过显式添加 `onclick` 属性或隐式通过 jQuery 添加自己的点击处理程序。要有一个按钮组，你只需要将按钮列表封装在样式为\
  \ `btn-group` 的 `DIV` 元素中。\n\n组内按钮的大小可以通过额外的类控制：`btn-group-lg` 或 `btn-group-xs`。默认情况下，按钮是水平排列的。要让它们垂直堆叠，只需添加\
  \ `btn-group-vertical` 类将按钮组合在一起。多个组可以通过将它们封装在按钮工具栏容器中并排放置：\n\n点击此处查看代码图像\n\n```html\n\
  <div>\n  <div class=\"btn-group\"></div>\n  <div class=\"btn-group\"></div>\n  <div\
  \ class=\"btn-group\"></div>\n</div>\n```\n\n从图 9-6 可以看出，你可能猜到 Bootstrap 按钮也可以用于实现下拉菜单。以下是实现此点的方法：\n\
  \n点击此处查看代码图像\n\n```html\n<div class=\"btn-group\">\n  <button type=\"button\" class=\"\
  btn btn-default\">One</button>\n  <button type=\"button\" class=\"btn btn-default\"\
  >Two</button>\n  <div class=\"btn-group\">\n```\n\n\n\n\n```html\n<button type=\"\
  button\" class=\"btn dropdown-toggle\" data-toggle=\"dropdown\">\n  数字\n  <span\
  \ class=\"caret\"></span>\n</button>\n<ul class=\"dropdown-menu\">\n  <li><a href=\"\
  #\">1</a></li>\n  <li><a href=\"#\">2</a></li>\n  <li><a href=\"#\">3</a></li>\n\
  </ul>\n</div>\n</div>\n```\n\n该组中的前两个项目是普通按钮。紧接着是一个嵌套的下拉组。该按钮组由一个按钮（按钮）以及一个附在其上的下拉菜单组成。有趣的是，该按钮包含一个\
  \ `caret`（小箭头）部分，它在视觉上传达了有更多选项可以查看的信息。通过向包裹列表的按钮组添加 `dropup` 类，你可以让列表向上显示。\n\n***\n\
  \n![Image](img/00006.jpeg) **重要性**\n\n当你查看 Bootstrap 中的下拉按钮列表时，你可能会联想到用户界面中的两个常见元素：下拉菜单和下拉列表。按钮组是普通的下拉菜单。而下拉列表——类似于你在纯\
  \ HTML 中使用 `SELECT/OPTION` 元素获得的产物——则是略有不同的东西。对于选择功能，Bootstrap 没有内置设施。这是一个问题，因为你可能会在表单中使用\
  \ `SELECT` 元素，其样式与其他视觉元素有明显不同。`SELECT` 之于普通菜单的差异在于，它会记录被选中的项目，并向用户和程序显示该结果。\n\n\
  ***\n\n### 选项按钮\n\n许多用户界面中的共同元素是选项按钮。它是一组互斥的按钮列表，它们共同工作：一次只能选择一个，且选择新按钮时会自动移除当前按钮的选定状态。HTML\
  \ 提供了一了一种特殊的输入元素类型来实现选项按钮。通过 Bootstrap，你可以通过将原生的 HTML 输入选项按钮和分组按钮混合使用，添加更美观的用户界面。\n\
  \n以下是如何排列选项按钮列表以便在用户配置编辑器中选择性别：\n\n点击此处查看代码图像\n\n```html\n<div class=\"btn-group\"\
  \ data-toggle=\"buttons\">\n  <label class=\"btn btn-primary @active1\">\n    <input\
  \ type=\"radio\" id=\"gender\" name=\"gender\" value=\"X\" @checked1>\n    不显示\n\
  \  </label>\n  <label class=\"btn btn-primary @active2\">\n    <input type=\"radio\"\
  \ id=\"gender\" name=\"gender\" value=\"M\" @checked2>\n    男性\n  </label>\n  <label\
  \ class=\"btn btn-primary @active3\">\n    <input type=\"radio\" id=\"gender\" name=\"\
  gender\" value=\"F\" @checked3>\n    女性\n  </label>\n</div>\n```\n\n图 9-8 显示了结果。注意，根据设计，按钮的大小是不相等的。你可以通过添加一些额外的自定义样式来实现这一点。\n\
  \n![Image](img/00063.jpeg) **图 9-8** Bootstrap 选项按钮\n\n如所述，Bootstrap 分组按钮是并排渲染的普通按钮。相反，选项按钮需要一些逻辑处理。要以\
  \ Bootstrap 的方式样式化选项按钮，你既需要逻辑也分组按钮。在刚刚显示代码段中，你看到使用了两组 Razor 变量。理想情况下，图 9-8 的标记之前应该有以下代码：\n\
  \n```csharp\n@{\n    var active1 = \"\";\n    var active2 = \"active\";\n    var\
  \ active3 = \"\";\n    var checked1 = \"\";\n    var checked2 = \"checked\";\n \
  \   var checked3 = \"\";\n}\n```\n\n变量 `active1`、`active2` 和 `active3` 的作用是为代表当前选择的\
  \ `label` 元素添加 `active` 属性。`active` 属性具有视觉效果，并指示 Bootstrap 切换按钮样式使其看起来像是被选中了样。同时，你应该考虑到按钮是官方的\
  \ HTML 输入元素。选项按钮列表通常托管在 HTML 表单中，并在某一点将表单内容提交到服务器。然而，带有 `checked` 属性的选项按钮才是。变量 `checked1`、`checked2`\
  \ 和 `checked3` 跟踪单个按钮的状态，并确保在页面渲染到浏览器时，正确的按钮显示为激活状态。\n\n### 导航栏\n\n大多数网站都带有导航栏，通常位于页面顶部。Bootstrap\
  \ 提供了一些设施来为网页添加头部。此外，Bootstrap 导航栏足够灵活，可以随着可用宽的变化而折叠和展开。在较小的视图中，导航栏会自动折叠为按钮并需要 JavaScript\
  \ 来展开。如果由于原因 JavaScript 被禁用，则 Bootstrap 导航栏无法展开。\n\n导航栏是一个普通的 HTML 容器，大部分是 `DIV`\
  \ 元素。然而，建议将头部封装在 `NAV` 元素中：\n\n点击此处查看代码图像\n\n```html\n<div role=\"navigation\">\n\
  \  ...\n</div>\n<nav class=\"navbar navbar-default\">\n  ...\n</nav>\n```\n\n`role`\
  \ 属性自定义了通用的 `DIV` 元素，将其声明为屏幕阅读器的导航组件。以下是导航栏的一种可能结构，带有链接列表和搜索栏：\n\n点击此处查看代码图像\n\n\
  ```html\n<nav class=\"navbar navbar-default\">\n  <div class=\"container-fluid\"\
  >\n    <div class=\"navbar-header\">\n      <button type=\"button\"\n        class=\"\
  navbar-toggle collapsed\"\n        data-toggle=\"collapse\"\n        data-target=\"\
  #content\">\n        <span class=\"sr-only\">More</span>\n        <span class=\"\
  icon-bar\"></span>\n        <span class=\"icon-bar\"></span>\n        <span class=\"\
  icon-bar\"></span>\n      </button>\n      <a class=\"navbar-brand\" href=\"#\"\
  >Home</a>\n    </div>\n    <div class=\"collapse navbar-collapse\" id=\"content\"\
  >\n      <ul class=\"nav navbar-nav\">\n        <li><a href=\"\">1</a></li>\n  \
  \      ...\n      </ul>\n      <form class=\"navbar-form navbar-left\">\n      \
  \  <div class=\"form-group\">\n          <input type=\"text\" class=\"form-control\"\
  \ placeholder=\"Search for...\">\n        </div>\n        <button type=\"submit\"\
  \ class=\"btn btn-primary\">Find</button>\n      </form>\n      <ul class=\"nav\
  \ navbar-nav navbar-right\">\n        <li class=\"dropdown\">\n          <a href=\"\
  #\" class=\"dropdown-toggle\" data-toggle=\"dropdown\">\n            I want to <span\
  \ class=\"caret\"></span>\n          </a>\n          <ul class=\"dropdown-menu\"\
  >\n            <li><a href=\"#\">Create a record</a></li>\n            ...\n   \
  \       </ul>\n        </li>\n      </ul>\n    </div>\n  </div>\n</nav>\n```\n\n\
  常见的导航栏由两部分组成——折叠/展开基础设施以及在较小视图下隐藏的实际：\n\n点击此处查看代码图像\n\n```html\n<nav class=\"navbar\
  \ navbar-default\">\n  <div class=\"container-fluid\">\n    <div class=\"navbar-header\"\
  >\n      <!-- 在较小视图下切换的折叠/展开按钮 -->\n    </div>\n    <div class=\"collapse navbar-collapse\"\
  \ id=\"content\">\n      <!-- 在较小视图下折叠的实际内容 -->\n    </div>\n  </div>\n</nav>\n\
  ```\n\n内容区域通过唯一的 `ID` （在示例中为 `content`）。折叠区域通过点击按钮的 `data-target` 属性与折叠/展开基础设施连接。接下来显示的三个\
  \ `SPAN` 元素渲染了此类折叠/展开按钮标准的三个横线：\n\n点击此处查看代码图像\n\n```html\n<div class=\"navbar-header\"\
  >\n  <button type=\"button\"\n    class=\"navbar-toggle collapsed\"\n    data-toggle=\"\
  collapse\"\n    data-target=\"#content\">\n    <span class=\"sr-only\">More</span>\n\
  \    <span class=\"icon-bar\"></span>\n    <span class=\"icon-bar\"></span>\n  \
  \  <span class=\"icon-bar\"></span>\n  </button>\n</div>\n```\n\n\n\n\n\n内容区域可以包含任何你喜欢，最显著的是快速访问按钮、下拉按钮和搜索表单。所有按钮通常渲染为嵌入在\
  \ `UL`/`LI` 元素中的锚点。\n\n通过向 `NAV` 元素添加 `navbar-fixed-top` 类，可以将导航栏固定在页面顶部。请注意，当你打算将页眉固定在顶部时，必须相应地为页面主体添加内边距（padding）。换句话说，你必须向下移动主体任何可见的内容，距离等于该栏占据的像素。如果不这样做，这些内容将被导航栏的绝对定位所覆盖：\n\
  \n```css\nbody { padding-top: 100px; }\n```\n\n你可能不需要像顶部对齐那样频繁使用，但你也可以将导航栏固定在页面底部。在这种情况下，你只需要向\
  \ `NAV` 元素添加 `navbar-fixed-bottom` 类即可。\n\n### 文本元素\n\nBootstrap 三个组件来渲染结构化文本：面板（panels）、警报（alerts）和井（wells）。面板是三个元素的组合：标题、正文和页脚。每个元素都经过相应的样式处理。这是一个面板示例。注意标题和页脚元素是可选的：\n\
  \n点击此处查看代码图像\n\n```html\n<div class=\"panel panel-info\">\n  <div class=\"panel-heading\"\
  >\n    <span class=\"panel-title\">Title</span>\n  </div>\n  <div class=\"panel-body\"\
  >\n    这里可以放置任何内容\n  </div>\n  <div class=\"panel-footer\">\n    Footer\n  </div>\n\
  </div>\n```\n\n面板可以使用我为按钮识别的相同元类（meta classes）来设置样式处理：`panel-default`、`panel-primary`、`panel-info`、`panel-danger`、`panel-warning`\
  \ 等。你也可以创建自己的元类。\n\n警报是一个带有某些 HTML 内容的普通 `DIV` 元素，不同之处它具有一些预定义的样式，配置如下所示：\n\n点击此处查看代码图像\n\
  \n```html\n<div class=\"alert alert-success\" role=\"alert\">\n  这里可以放置任何内容\n</div>\n\
  ```\n\n此外，通过警报你可以使用 Bootstrap 元类来表示上下文（`success`、`warning`、`danger`、`info` 等类似的）。在\
  \ Bootstrap 页面中，警报通常用于显示消息。一个有趣的功能是警报是可关闭的：\n\n点击此处查看代码图像\n\n```html\n<div class=\"\
  alert alert-warning alert-dismissible\" role=\"alert\" id=\"alert-id\">\n  <button\
  \ type=\"button\" class=\"close\" data-dismiss=\"alert\" aria-label=\"Close\">\n\
  \    <span>&times;</span>\n  </button>\n  <strong>Warning!</strong> 这是给你的消息。\n</div>\n\
  ```\n\n在这种情况下，警报会稍大，并在右上角包含一个关闭按钮。通过点击那里，用户将撤销该 `DIV`，页面内容会向上移动。你可以添加的另一个很棒的功能是计时器，它会在指定的毫秒数后向上滑入警报：\n\
  \n点击此处查看代码图像\n\n```javascript\nwindow.setTimeout(function () {\n  $(\"#alert-id\"\
  ).slideUp();\n}, 4000);\n```\n\n***\n\n![图像](img/00004.jpeg) 注意\n\n如果你需要在警报中使用链接，只需通过向锚点添加\
  \ `alert-link` 类，即可使其与父级警报的上下文信息同步进行样式处理。\n\n***\n\n最后，井（wells）是被边框和一些内边距围绕的纯文本。这是一种以强调方式展示文本的非常快速简单的方法：\n\
  \n```html\n<div class=\"well\">\n  ...\n</div>\n```\n\n对于井，你也可以使用尺寸类，如 `well-lg`\
  \ 和 `well-xs`。\n\n### 重塑列表 HTML 元素\n\n尽管可以称其为由第一批 iOS 用户界面架构师创造的人为需求，但分段相关项目分组的可滚动列表遍布设备领域，并在短短几年内征服了整个网络。jQuery\
  \ Mobile 首先意识到分段和可滚动列表的价值，并提供了专用组件来构建它们。今天，Bootstrap 也提供了专用的 CSS 类，将普通的无序 HTML 列表和锚点标签列表渲染成模仿\
  \ iOS 列表的精美区块。\n\n### 列表\n\n在基于 Bootstrap 的页面中，普通的列表项序列会自动转换为带框的表格。让我们考虑以下标记：\n\n\
  点击此处查看代码图像\n\n```html\n<ul class=\"list-group\">\n  <li class=\"list-group-item\"\
  >First item</li>\n  <li class=\"list-group-item\">Second item</li>\n  <li class=\"\
  list-group-item\">Third item</li>\n  <li class=\"list-group-item\">Fourth item</li>\n\
  \  <li class=\"list-group-item\">Fifth item</li>\n</ul>\n```\n\n`list-group` 类负责绘制边框。`list-group-item`\
  \ 处理间距。为了防止一个或多个项目变为可点击，请使用 `SPAN` 而不是 `A`。\n\n```html\n<ul class=\"list-group\"\
  >\n  <li class=\"list-group-item\">First item</li>\n  <li class=\"list-group-item\"\
  >Second item</li>\n  <li class=\"list-group-item\">Third item</li>\n  <li class=\"\
  list-group-item\">Fourth item</li>\n  <li class=\"list-group-item\">Fifth item</li>\n\
  </ul>\n```\n\n你可以使用 `active` 类来标记某个项目已被选中。\n\n```html\n<div class=\"list-group\"\
  >\n  <span class=\"list-group-item\">Headers</span>\n  <a href=\"...\" class=\"\
  list-group-item\">First item</a>\n  <a href=\"...\" class=\"list-group-item active\"\
  >Second item</a>\n</div>\n```\n\n结合 iOS 界面，徽标（badges）可以用于计数。要获得这种效果，你只需为 `SPAN`\
  \ 元素标记 `badge` 类：\n\n点击此处查看代码图像\n\n```html\n<a href=\"...\" class=\"list-group-item\"\
  >\n  First item <span class=\"badge\">22</span>\n</a>\n```\n\n你在列表中使用的任何 `A` 元素的内容都可以随意自定义。它可以是纯文本，也可以是\
  \ HTML 标记，并可以包含图像：\n\n点击此处查看代码图像\n\n```html\n<a href=\"#\" class=\"list-group-item\"\
  >\n  <p class=\"list-group-item-text\">Some small text</p>\n  <h4 class=\"list-group-item-heading\"\
  >Some bigger text here\n</a>\n```\n\n为了实现更统一的视觉效果，你可以使用预定义的样式，如 `list-group-item-text`\
  \ 和 `list-group-item-heading`。然而，是否使用它们取决于你，因为这完全是一个审美问题。\n\n### 媒体对象\n\n网页另一个常见功能是由文本和媒体内容（主要是图像）组成的混合标记列表。对齐文本和图像通常很无趣。Bootstrap\
  \ 尝试通过几个类让过程变得更加顺利：\n\n点击此处查看代码图像\n\n```html\n<div class=\"media\">\n  <div class=\"\
  media-left\">\n    <a href=\"#\">\n      <img class=\"media-object\" src=\"...\"\
  \ alt=\"...\">\n    </a>\n  </div>\n  <div class=\"media-body\">\n    <h4 class=\"\
  media-heading\">Title of the image</h4>\n    <span>Description of the image</span>\n\
  \  </div>\n</div>\n```\n\n\n\n\n\n`media-left` 类将图像固定在容器的左侧边缘。你可以使用 `media-right`\
  \ 类将图像固定在右侧。不过，如果你打算这样做，应该在标记语言中将最右侧的 `DIV` 放在媒体主体 `DIV` 之后。媒体内容默认是顶对齐的。你可以通过向图像\
  \ `DIV` 添加 `media-middle` 或 `media-bottom` 类将对齐方式改为居中对齐或底部对齐。\n\n你还可以在列表中使用媒体内容，创建一个包含图像和文本的项目列表。你使用\
  \ `media` 类来包裹列表项，并使用 `media-list` 类用于整个列表。`media-object` 类位于 `IMG` 元素周围。另一方面，`media-body`\
  \ 类用于装饰图像旁或你可能拥有的任何其他媒体对象（例如视频）的文本。\n\n这是一个示例：\n\n点击此处查看代码图像\n\n```html\n<ul class=\"\
  media-list\">\n  <li class=\"media\">\n    <div class=\"media-left\">\n      <a\
  \ href=\"#\">\n        <img class=\"media-object\" src=\"...\" alt=\"...\">\n  \
  \    </a>\n    </div>\n    <div class=\"media-body\">\n      <h4 class=\"media-heading\"\
  >Title of the image</h4>\n      <span>Description of the image</span>\n    </div>\n\
  \  </li>\n  ...\n</ul>\n```\n\n请注意，列表（无论包含媒体内容或不包含媒体内容）都可以轻松地嵌入到面板（panels）中。\n\n\
  另一方面，`thumbnail` 类可以用于展示带有或不带额外标记的相关图像。这是一个示例布局，它在中等和大屏幕上显示四张图像，在较小屏幕上显示两个或三个：\n\
  \n点击此处查看代码图像\n\n```html\n<div class=\"row\">\n  <div class=\"col-xs-6 col-sm-4 col-md-3\"\
  >\n    <a href=\"#\" class=\"thumbnail\">\n      <img src=\"...\" alt=\"...\">\n\
  \    </a>\n    <div class=\"caption\">\n      <h3>Thumbnail label</h3>\n      ...\n\
  \    </div>\n  </div>\n  ...\n</div>\n```\n\n### 表格\n\n多年来，许多开发者使用纯 HTML 表格作为网页内容的布局工具。今天，`DIV`\
  \ 元素和 CSS 定位属性被更灵活地用于相同的目的。然而，这并不意味着 HTML 表格已经变得毫无用处。表格仍然着展示表格化数据的作用，例如在数据网格的文中。\n\
  \n在 Bootstrap 中，你可以找到一些基础类来为 HTML 表格设置样式，特别是控制内边距和行颜色：\n\n点击此处查看代码图像\n\n```html\n\
  <table class=\"table table-condensed\">\n  <tr> ... </tr>\n</table>\n```\n\n`table-condensed`\
  \ 类将内边距和间距保持在最小。还存在其他类用于更复杂但常见的效果——例如交替行变色和悬停效果。请注意，Bootstrap 的表格以及许多其他 HTML 产物纯粹是图形化的。这意味着你找到了以特定方式渲染元素的工具，但将样式与数据绑定取决于你。将样式数据绑定到实际数据的最佳方法是通过\
  \ Razor 变量和即时类，或者在没有更好方法的情况下，使用内联样式。\n\n### 进阶组件预览\n\n尽管 HTML 是 Web 的官方语言，而且它在不久的将来某点可能会成为移动应用程序的通用语言，但它并没有提供创建现代页面所需的所有语法元素。在本章较早之前，介绍了下拉菜单。正如所讨论的，在\
  \ Bootstrap 中，你可以通过组合按钮和锚点标签的 HTML 无序列表来创建下拉菜单。即使在 HTML5 中，你也没有找到任何原生元素来设置下拉菜单。其他一些常见的视觉元素也是如此——它们在页面中很流行，但\
  \ HTML 原生不支持，至少在减少标记的抽象层上不支持。在本章中，我将介绍如何在 Bootstrap 中设置模态对话框（modal dialog boxes）、标签页（tabs）和自定义提示（tooltips）。\n\
  \n### 模态对话框\n\n模态窗口显示在所有其他内容之上的窗口，并在显示期间捕获输入焦点。底层元素只有在模态窗口关闭后重新获得焦点。模态窗口的一个极佳示例是浏览器在代码调用\
  \ `window.alert` JavaScript 方法时的消息框。然而，越来越多的页面渲染一个顶层的富 `DIV` 元素来向用户强调消息。模态对话框由三层嵌套的\
  \ `DIV` 元素组成。最外层的 `DIV` 使用 `modal` 类设置样式。你可以在这里添加特定的外观样式——例如 `fade` 或 `slide` 类。它的直接子元素被样式为\
  \ `modal-dialog`，另一层 `DIV` 是 `modal-content`。在内容 `DIV` 内部，你会找到头部（header）、主体（body）和页脚（footer）。头部和页脚是可选，但你通常两者都有，并使用头部为对话框添加标题和关闭按钮。相反，页脚通常填充按钮，用于直接关闭对话框或通过启动服务器端操作来关闭。\n\
  \n这是一个示例：\n\n```html\n<div class=\"modal\" id=\"dialogBox\">\n  <div class=\"modal-dialog\"\
  >\n    <div class=\"modal-content\">\n      <div class=\"modal-header\">\n     \
  \   <button type=\"button\" class=\"close\" data-dismiss=\"modal\">&times;</button>\n\
  \        <h4 class=\"modal-title\">Rate the article</h4>\n      </div>\n      <div\
  \ class=\"modal-body\"></div>\n      <div class=\"modal-footer\">\n        <button\
  \ type=\"button\" class=\"btn btn-default\" data-dismiss=\"modal\">Close</button>\n\
  \        <button type=\"button\" class=\"btn btn-primary\" onclick=\"...\">Vote</button>\n\
  \      </div>\n    </div>\n  </div>\n</div>\n```\n\n在示例中，页脚有两个按钮：`Close` 和 `Vote`。由于\
  \ `data-dismiss` 属性，`Close` 按钮仅用于关闭对话框。另一方面，`Vote` 按钮通常会绑定一些 `onclick` 处理程序来执行某些\
  \ JavaScript 任务。\n\n\n\n\n\n特别是当你使用模态框内联编辑记录时，你需要一种方法将模态框的元素初始化为要显示的实际数据。如果模态框显示某些固定内容，你可以在生成模态框或包含它的\
  \ Razor 视图中放置任何初始化逻辑。相反，如果你有一列表记录，并希望在用户点击特定记录时显示模态框，理想情况下初始化必须在客户端通过 JSON 获取数据时完成。这可以通过\
  \ JavaScript 挂钩 Bootstrap 态组件触发的一些事件来实现。\n\n这里有一个示例：\n\n点击此处查看代码图像\n\n```javascript\n\
  $('#dialogBox).on('show.bs.modal', function (e) {\n    $.ajax({\n        url: \"\
  ...\",\n        cache: false\n    }).done(function(json) {\n        // 使用下载的数据\n\
  \        // 更新用户界面\n    });\n});\n```\n\n一旦模态框组件触发 `show.bs.modal` 事件——即在内容显示之前——就会向某个\
  \ URL 发 Ajax 调用以下载数据。接下来，对话框界面将使用新内容进行更新，然后呈现给用户。\n\n***\n\n![Image](img/00004.jpeg)\
  \ 注意\n\n如果你只是在寻找系统警告消息框的替代方案，且在渲染方面具有更高的活性，你可以尝试 `Toastr`。Toastr 是一个 jQuery 插件，它以色彩丰富的方式显示纯文本，并在定位和计时器方面提供了许多选项。以下是展示其如何工作的代码：\n\
  \n点击此处查看代码图像\n\n```javascript\ntoastr.options.positionClass = \"alert-center\";\n\
  toastr.success(\"这个弹窗难道不比普通的 alert() 好吗？\", \"更好的警报!\");\n```\n\n`toastr` 库除了“success”之外还提供了几种显示方法，每种方法的特点是具有不同的图标和颜色。消息可以留在屏幕上直到用户将其关闭，也可以与计时器关联。`showDuration`\
  \ 和 `hideDuration` 等属性表示显示和隐藏内容所需的毫秒数。内容通常由标题和文本消息组成。\n\n***\n\n### 标签页组 (Tab strips)\n\
  \n标签页是一组视图，一次显示一个，配有一个顶部菜单允许选择。Bootstrap 支持标签页的几种变体，包括经典的标签页组和导航胶。所需的 HTML 模板是类似的。\n\
  \n让我们先看看经典的标签页组：\n\n点击此处查看代码图像\n\n```html\n<div class=\"tabbable\">\n  <ul class=\"\
  nav nav-tabs\" id=\"myTabStrip\">\n    <li><a class=\"btn btn-primary\" href=\"\
  #profile\" data-toggle=\"tab\">个人</a></li>\n    <li><a class=\"btn btn-primary\"\
  \ href=\"#preferences\" data-toggle=\"tab\">设置</a></li>\n    <li><a class=\"btn\
  \ btn-primary\" href=\"#friends\" data-toggle=\"tab\">朋友</a></li>\n  </ul>\n</div>\n\
  ``` (此处修正了原文中的标签错误)\n\n包裹 `UL` 元素的第一个 `DIV` 定义了可点击标签页的列表。每当用户点击任何标签页时，当前内容会被隐藏，以便显示与点击标签页相关的内。`LI`\
  \ 元素的 `href` 属性指向存储标签页内容的子 `DIV` 路径。 设置为 `tab` 的 `data-toggle` 属性也是关键的，因为它指示组件作为标签页并根据需要隐藏和显示内容。\n\
  \n标签页内容在同一页面中一个接一个出现。这些 `DIV` 的可见性由标签页组组件自带的脚本代码自动管理：\n\n点击此处查看代码图像\n\n```html\n\
  <div class=\"tab-content\">\n  <div id=\"profile\" class=\"tab-pane\"></div>\n \
  \ <div id=\"preferences\" class=\"tab-pane\"></div>\n  <div id=\"friends\" class=\"\
  tab-pane\"></div>\n</div>\n```\n\n(注：原文后续部分存在大量重复的段落，根据指令“不要重复输出原文”的原则，此处仅保留核心逻辑及结构翻译)\n\
  \n### 提示 (Tooltips)\n\n提示从网页早期起就一直可用，但它们已经发生了变化。\n\n\n\n\n\n另一个有趣的特性是 HTML 内容。基本上，Bootstrap\
  \ 允许你将任何 HTML 内容放置在 `title` 属性中。然而，只有当你在提示框（tooltip）选项中设置 `html` 标志时，该内容才会被渲染为 HTML：\n\
  \n点击此处查看代码图片\n\n```javascript\n$(\"[data-toggle=tooltip]\").tooltip({\n    placement:\
  \ 'auto',\n    html: true\n});\n```\n\n此外，你可以使用 `trigger` 选项来指定你希望如何触发提示框。默认配置是在鼠标悬停在元素上以及元素获得焦点时显示提示框。你可以更改或仅添加该选项通过点击来触发它：\n\
  \n点击此处查看代码图片\n\n```javascript\n$(\"[data-toggle=tooltip]\").tooltip({\n    placement:\
  \ 'auto',\n    html: true,\n    trigger: 'click focus hover'\n});\n```\n\n最后，可以通过方法程序化地控制提示框，并在显示或隐藏时触发事件。\n\
  \n## 气泡框 (Popovers)\n\n尽管名称完全不同，但提示框（Tooltips）和气泡框是亲戚。`Tooltips` 在你悬停在特定元素上时出现；`popovers`\
  \ 支持更丰富的格式选项，并可以通过多种方式触发，包括用户悬停在特定的 HTML 元素上。更泛义地说，气泡框是作为元素附近以下拉块形式显示的 DIV 元素。让气泡框特别有趣的地方在于，如果你通过\
  \ JavaScript 添加一些数据绑定逻辑，就可以为它们填充实时数据。\n\n首先，你创建一个初始为隐藏的 DIV 元素。接下来，你配置气泡框的触发器：它可以是一个按钮或可点击的元素。这与你处理提示框非常相似。唯一的区别是\
  \ `data-toggle` 属性必须设置为 `popover`：\n\n点击此处查看代码图片\n\n```html\n<div id=\"popover-content\"\
  \ class=\"hidden\">\n    ...\n</div>\n```\n\n然后你添加一些脚本来从指定 DIV 元素的内容初始化气泡框：\n\n\
  点击此处查看代码图片\n\n```javascript\n$(\"#sensitive\").popover({\n    html: true,\n    title:\
  \ \"More Details\",\n    placement: 'right',\n    trigger: 'click',\n    content:\
  \ function () {\n        return $(\"#popover-content\").html();\n    }\n});\n```\n\
  \n在代码段中，`#sensitive` 路径指的是气泡框所引用的元素。基本上，代码会自动将名为 `popover-content` 的 DIV 元素的内容附加到\
  \ `#sensitive` 元素，因此无论何时点击该项目，气泡框都会出现。气泡框给了一个默认大小。你可以通过更改 Bootstrap 库中的 `.popover`\
  \ CSS 类来更改它。你为气泡框选择的触发机制决定了内容消失的方式。触发选项与提示框相同：`hover`、`click` 和 `focus`。\n\n***\n\
  \n## 提示框和气泡框的优缺点\n\n提示框和气泡框的主要目标是显示关于页面元素的更多信息。尽管在此之外，决定何时使用提示框具有高度的主观性。这里有几条常识规则。\n\
  \n首先，你通过提示框显示的文本不应该是用户决定做什么的必不可少的。提示框中的文本应该是补充性的。如果提示框文本似乎对于帮助用户决定如何行动至关重要，你应该直接将文本放在用户用户界面中。其次，你不应该使用提示框来呈现错误或警告。在这些情况下，警报框（alert\
  \ box）可能更合适。\n\n此外，提示框和气泡框不应该分散或骚扰用户。呈现的信息不应该是屏幕上内容的简单重复或重新表述。\n\n***\n\n## Bootstrap\
  \ 扩展\n\nBootstrap 是一个全面的 CSS 和 HTML 库，定义了现代网页的分类法。然而，它并没有为 Web 开发人员的所有常见需求提供内置组件和类。根据我对\
  \ Bootstrap 的经验，我识别出目前缺失的三个关键部分：自动补全、日期选择和下拉列表。对于前两个，你可以使用一些基于 Bootstrap 的额外框架。而对于下拉列表，你应该为\
  \ Bootstrap 库创建你自己的自定义扩展。\n\n### 自动补全 (Autocompletion)\n\n可用性在网页中变得越来越重要。可用性最重要的方面之一是简化数据输入和选择，特别是当有很长的选项列表时。例如，与其向用户提供一个包含数百个项目的下拉选择列表，不如提供一个文本框并让用户输入他们想要的名称。这就是自动补全的作用。\n\
  \n### typeahead 组件 (The typeahead component)\n\n使用 Bootstrap 实现自动补全的最佳方法是通过下载一个名为\
  \ `typeahead.js` 的独立库。让我们开始添加最新版 `typeahead.js` 库的 NuGet 包并看看需要什么。\n\n```html\n\
  <form action=\"@Url.Action(\"Query\", \"Home\")\" method=\"post\">\n    <input type=\"\
  hidden\" id=\"queryCode\" name=\"queryCode\" />\n    <input type=\"text\" name=\"\
  queryString\" id=\"queryString\">\n    <button id=\"queryButton\" type=\"submit\"\
  >Go it!</button>\n</form>\n```\n\n注意，要在网页上使用自动补全，你需要一个隐藏字段来收集一些提示。为了使用该库，必须引用 jQuery\
  \ 1.9 或更高版本以及 `typeahead.js` 脚本。视图中所需的所需的代码所示：\n\n点击此处查看代码图片\n\n```javascript\n\
  var hints = new Bloodhound({\n    datumTokenizer: Bloodhound.tokenizers.whitespace('value'),\n\
  \    queryTokenizer: Bloodhound.tokenizers.whitespace,\n    remote: \"/yourServer/query=%QUERY\"\
  \n});\n\nhints.initialize();\n\n$('#queryText').typeahead(\n    null,\n    {\n \
  \       displayKey: 'value',\n        source: hints.ttAdapter()\n    }\n);\n```\n\
  \n虽然你可以从任何 JavaScript 数组绑定数据，但自动补全主要适用于从远程下载数据。从远程源下载会引起很多问题，同源策略、预取和缓存等。`typeahead.js`\
  \ 自带了一个名为 Bloodhound 的建议引擎，它会为你完成大部分这些工作，而且非常透明。如果你从 NuGet 获取包 JavaScript 文件，你就可以开始调用\
  \ Bloodhound 而无需担心它的下载和设置。\n\n上一个代码段中的 `hints` 变量是以下标准的 Bloodhound 化的结果：\n\n点击此处查看代码图片\n\
  \n```javascript\nvar hints = new Bloodhound({\n    datumTokenizer: Bloodhound.tokenizers.whitespace('value'),\n\
  \    queryTokenizer: Bloodhound.tokenizers.whitespace,\n    remote: \"/yourServer/query=%QUERY\"\
  \n});\n\nhints.initialize();\n```\n\n\n\n\n\n在 `typeahead.js` 初始化中，你指明了两个关键信息：上述由\
  \ `Bloodhound` 管理的提示集合，以及用于填充输入字段的显示字段。在刚刚显示的代码段中，显示字段是 `‘value’`。默认情况下，`typeahead.js`\
  \ 在输入单个字符后就开始获取提示。如果你希望在自动补全开始之前等待字符进入缓冲区，可以添加一个设置对象作为插件的第一个参数：\n\n点击此处查看代码图片\n\n\
  ```javascript\n$('#queryString').typeahead(\n    {\n      minLength: 2,   // 等待输入\
  \ 2 个字符\n      limit: 15    // 不返回超过 15 个的提示\n    },\n    {\n      displayKey: 'value',\n\
  \      source: hints.ttAdapter()\n    }\n);\n```\n\n当缓冲区足够多以启动远程调用时，`Bloodhound`\
  \ 将开始工作，下载 JSON 数据并对其进行适配以显示。此时，你已经拥有了一个基本工作的自动补全引擎，它可以根据你在服务器上的某些逻辑弹出建议。然而，在实际页面中有效使用自动补全之前，还有很多工作要做。\n\
  \n返回用于显示的提示的远程端点是一组序列化为 JSON 的 C# 类集合。你可以按照喜欢的方式封装提示数据，但至少你所使用的类型必须包含以下信息：\n\n点击此处查看代码图片\n\
  \n```csharp\npublic class AutoCompleteItem\n{\n    public string id { get; set;\
  \ }\n    public string value { get; set; }\n    public string label { get; set;\
  \ }\n}\n```\n\n`id` 属性包含一个唯一 ID，当它被提交时对接收的控制器具有意义。如果你的提示引用的是用户通过名称查找的产品，`id` 可能只是产品\
  \ ID。`value` 属性是要显示在列表中的字符串内容以及输入字段中复制的文本。`label` 属性是可选的，你应该将其看作是客户端端可能需要的任何其他信息的“货物”属性。大多数情况下，可以丢弃它而不会产生影响。有时我用它来携带服务器生成的提示\
  \ HTML 格式。\n\n***\n\n![Image](img/00004.jpeg) 注意\n\n请访问以下 URL 查看如何使用 `typeahead.js`\
  \ 的文档和示例：[`github.com/twitter/typeahead.js`](http://github.com/twitter/typeahead.js)。\n\
  \n***\n\n### 修复 CSS\n\n任何足够复杂的插件都需要一些 CSS 来保持美观，`typeahead.js` 也不例外。插件自带默认的用户界面，但特别是当你将其结合\
  \ Bootstrap 使用时，你需要应用一些修复以避免视觉上的折痕。此外，你可能还想自定义一些视觉属性，例如颜色和内边。\n\n表 9-3 列出了你可能想要尝试的一些\
  \ CSS 类，以个性化 `typeahead.js` 组件的视觉效果和感受。\n\n![Image](img/00064.jpeg)\n\n表 9-3 用于自定义\
  \ `typeahead.js` 的 CSS 类列表\n\n图 9-9 让你了解通过自定义 CSS 类可以获得什么效果。\n\n![Image](img/00065.jpeg)\n\
  \n**图 9-9** Bootstrap 单选按钮\n\n你可以在本书的配套代码中找到结合 Bootstrap 有效使用 `typeahead.js` 的常用\
  \ CSS 修复完整列表。注意，`typeahead.js` 提供了一种强大的原生机制来覆盖关键的 CSS 样式。它基于 `classNames` 设置，如下：\n\
  \n点击此处查看代码图片\n\n```javascript\n$('.typeahead').typeahead({\n    classNames: {\n\
  \      input: 'Your-input-class',      // 输入字段\n      hint: 'Your-hint-class', \
  \       // 列表项\n      highlight: 'Your-highlight-class'   // 高亮列表项\n    }\n});\n\
  ```\n\n显然，分配给 `classNames` 条目的字符串必须与你现有的 CSS 类匹配。\n\n### 调整提示模板\n\n在 图 9-9 中，列表项使用了一些额外的格式。特别是国家/地区的名称是加粗的，而实际显示的文本是多个数据属性组合的结果。使用\
  \ `typeahead.js` 时，你需要单独的模板引擎来格式化列表项。一个流行的模板引擎是 `Handlebars`。你可以从 [`handlebarsjs.com`](http://handlebarsjs.com)\
  \ 获取它。以下是如何配合 `typeahead.js` 使用它：\n\n点击此处查看代码图片\n\n```javascript\n$('#queryString').typeahead(\n\
  \    {\n      minLength: 2,\n      limit: 15\n    },\n    {\n      displayKey: 'value',\n\
  \      templates: {\n        suggestion: Handlebars.compile('<p><<strong>{{label}}</strong>\
  \ – {{id}}</p>')\n      },\n      source: hints.ttAdapter()\n    }\n);\n```\n\n\n\
  \n\n\n当可选项目数量达到数百个时，任何经典的下拉列表都会变得非常缓慢。因此，如果你计划使用使用自动补全输入框来选择特定值——例如，产品名称或客户名称——仅靠普通的\
  \ `typeahead.js` 插件是不够的。你需要额外的脚本代码来绑定到插件的 `selected` 事件，并存储用户的选择以备后之用。\n\n以下代码将选择结果保存到隐藏字段（`#queryCode`\
  \ 路径），并使用本地变量跟踪是否已进行选择：\n\n点击此处查看代码图片\n\n```\n<script type=\"text/javascript\">\n\
  \n  var typeaheadItemSelected = false;\n\n  $('#queryString').on('typeahead:selected',\
  \ function (e, datum) {\n      $(\"#queryCode\").val(datum.id);\n      typeaheadItemSelected\
  \ = true;\n  });\n</script>\n```\n\n自动补全输入框的主要优势是用户可以输入一些易于理解的文本，系统能够理解并将其与唯一代码（如产品\
  \ ID）关联。选中的代码必须安全地存储，以便在未来的上传中使用。事实上，大多数时候，你需要将自动补全文本框作为一种包含过多项的下拉列表的特殊形式。\n\n在\
  \ `selected` 事件处理器中，你从 `datum` 对象中获取 ID 信息并将其安全地存储在隐藏字段中。当属于自动补全输入框的表单被提交时，选中的 ID\
  \ 也会被提交。`datum` 对象的布局——即从下拉列表中选中的数据项——取决于你从服务器端接收到的数据模式（schema）。\n\n### 在输入框中显示文本\n\
  \n那么输入框中显示的文本该如何处理呢？大多数情况下，只需在 `typeahead.js` 组件的配置中设置 `displayKey` 属性即可解决问题。无论如何，你都可以通过程序方式在输入框中设置任何值：\n\
  \n点击此处查看代码图片\n\n```\n$(\"#queryString\").val(datum.label);\n```\n\n在某些情况下，自动补全文本框是\
  \ HTML 表单中的唯一元素。这意味着你可能希望在数据被选择时立即处理任何选中的数据。通过向 `typeahead.js` 的 `selected` 事件处理器添加以下行代码，你可以模拟点击表单提交按钮的动作：\n\
  \n```\n$(\"#queryButton\").click();\n```\n\n有时用户在输入框中开始输入，然后停止且没有进行任何选择。当他们返回且输入框重新获得焦点时，你该怎么办？这在很大程度上取决于输入框的预期行为。如果你想将其视为下拉列表的特殊形式，并强制用户仅在该处输入（通过自动补全）特定的字符串（例如，用户名或产品），那么在输入焦点移回该处时清除该字段会更好：\n\
  \n点击此处查看代码图片\n\n```\n$('#queryString').on('input', function () {\n    if (typeaheadItemSelected)\
  \ {\n        typeaheadItemSelected = false;\n        $('#queryString').val('');\n\
  \        $(\"#queryCode\").val('');\n    }\n});\n```\n\n此代码段重置了布尔守卫，该守卫控制是否在特定输入框中进行了选择，并清空了输入框以及存储选择值的辅助隐藏字段。\n\
  \n![Image](img/00006.jpeg) **重要**\n\n在这个示例中，我使用了一个本地 JavaScript 变量来存储特定输入框选择的状态。只要每个视图只有一个自动补全输入框，这种方法就有效。当你有两个或多个输入框时，最好使用输入元素上的属性来跟踪其选择状态。\n\
  \n### 日期选择\n\n在 HTML5 中，有一个类型为 `date` 的新 `INPUT` 元素。基于此，你可能期望所有浏览器都提供几乎相同的体验并提供日期选择功能。目前至少并非如此。某些浏览器允许你通过箭头按钮上下导航；某些浏览器甚至没有对日期提供任何特殊支持。不同浏览器之间的体验差异很大。\n\
  \n一种常见的解决方法是使用 Modernizr 进行功能检测，如果浏览器不支持日期选择功能，则接入某些外部组件。我更倾向于坚持 Bootstrap 并提供一致的体验。Bootstrap\
  \ 没有提供原生日期选择组件，但存在一个与 Bootstrap 配合良好的外部框架。让我们看看如何使用它。特别是，我将引用你在 `[`www.nuget.org/packages/Bootstrap.Datepicker/1.5.0`](http://www.nuget.org/packages/Bootstrap.Datepicker/1.5.0)`\
  \ 找到的包。\n\n#### Bootstrap 日期选择框架\n\n你从 NuGet 获取的 Bootstrap Date Picker 包包含一个 CSS\
  \ 文件和几个 JavaScript 文件，包括日期选择工具（`bootstrap-datepicker.min.js`）、辅助工具（`moment.js`）和本地化文件。务必按顺序引用它们。\n\
  \n点击此处查看代码图片\n\n```\n<script type=\"text/javascript\" src=\"~/content/moment.min.js\"\
  ></script>\n<script type=\"text/javascript\" src=\"~/content/bootstrap-datepicker.min.js\"\
  ></script>\n```\n\n### 绑定选择器\n\n让我们关注一个想要输入可选日期的输入框。`type` 属性被设置为 `text`，且 `contenteditable`\
  \ 属性被设置为 `false` 以防止手动编辑。以下标记产生了图 9-10 所示的内容：\n\n```html\n<div class=\"input-group\"\
  >\n  <input type=\"text\" class=\"form-control\" id=\"dateofbirth\" name=\"dateofbirth\"\
  \n    contenteditable=\"false\" value=\"@Model.DateOfBirth.GetValueOrDefault().ToDateString()\"\
  >\n  <span class=\"input-group-btn\">\n    <button class=\"btn btn-dark\" type=\"\
  button\" onclick=\"setNoBirthDate()\">\n      不显示\n    </button>\n  </span>\n</div>\n\
  ```\n\n![Image](img/00068.jpeg)\n\n**图 9-10** 运行中的 Bootstrap 组件\n\n`INPUT` 元素的 `value`\
  \ 属性绑定到视图模型中一个携带显示日期的属性。日期类型假设为可空，如果没有设置日期，则默认为空字符串。输入组中的按钮在点击时只需清除缓冲区：\n\n```javascript\n\
  $(\"#dateofbirth\").val(\"\");\n```\n\n#### 日期选择器的配置\n\n与其他许多富脚本组件一样，日期选择器需要初始化才能正常工作。刚刚显示的标记只是第一步；下一步是某些连接逻辑和\
  \ DOM 元素的脚本。遵循 jQuery 插件的标准，你可以通过无参数调用将选择器附加到输入框，并接受所有默认设置，或指定你自己的偏好：\n\n点击此处查看代码图片\n\
  \n```\n<script type=\"text/javascript\">\n  $(function () {\n    $('#dateofbirth').datepicker();\n\
  \  });\n</script>\n```\n\n\n\n\n\n您通过传递给初始化器的对象来指定偏好：\n\n点击此处查看代码图片\n\n```csharp\n\
  @{\n    var startBirthDate = new DateTime(1915, 1, 1).ToString(\"d\", culture);\n\
  \    var endBirthDate = DateTime.Today.AddYears(-5).ToString(\"d\", culture);\n\
  }\n```\n\n...\n\n<script type=\"text/javascript\">\n$(function () {\n    $('#dateofbirth').datepicker({\n\
  \        language: 'it',\n        startDate: '@startBirthDate',\n        endDate:\
  \ '@endBirthDate'\n    });\n});\n</script>\n\n您可能想要自定义的最常用参数是语言、开始日期和用户可以导航的结束日期。特别是当您使用输入字段来获取出生日期时，您可能希望限制范围，以避免无意义的日期，例如不符合特定要求年龄用户的日期。\n\
  \n### 自定义组件\n\nBootstrap 没有提供任何特定的预定义样式来装饰和增强类似于通过 SELECT/OPTION 元素获取的这种下拉列表。虽然可以使用\
  \ CSS 设置轻松对下拉列表进行样式处理，但在 Bootstrap 用户界面的上下文中使用时，它看起来总是有些不一致。同时，Bootstrap 拥有许多设施来创建下拉内容，因此安排下拉列表组件并不是一项艰巨的任务。这只需要一个临时的标记模板和一点\
  \ JavaScript。\n\n### 创建列表\n\n下面的代码片段在 Bootstrap 中定义了一个下拉菜单。它向用户显示一个可点击的按钮以及一个相关的下拉列表。按钮最初显示文本\
  \ `Get one`，后面紧跟一个脱位箭头符号（caret）。当用户点击按钮时，会显示出一个填充了所有列表项的菜单：\n\n点击此处查看代码图片\n\n```html\n\
  <div class=\"btn-group\">\n    <a class=\"btn btn-default dropdown-toggle\" data-toggle=\"\
  dropdown>\n        Get one <span class=\"caret\"></span\n    </a\n    <ul class=\"\
  dropdown-menu\">\n        @foreach (var item in list)\n        {\n            <li><a\
  \ href=\"#\"><<span>@item.Text</span></a></li>\n        }\n    </ul>\n</div>\n```\n\
  \n在 Bootstrap 中，下拉菜单仅用于提供一个用于导航的超链接列表。然而，如果您将上述标记与 JavaScript 封装在一起，就可以处理超链接的点击，并将导航更改为用户界面的更改。关键在于，为了让\
  \ Bootstrap 下拉菜单变成经典的下拉列表，列表项上不应定义任何超链接。理想情况下，您将 `LI` 元素内锚点标签的 `href` 属性设置为 `#`。如果您将其留空，该项仍然是可点击的，但鼠标指针会发生变化（变成手型），就像是普通文本一样。\n\
  \n图 9-11 显示了下拉列表的整体行为。\n\n![Image](img/00069.jpeg)\n\n**图 9-11** 当选择下拉项时更改按钮的标题\n\
  \n#### 添加选择逻辑\n\n在 HTML 中，普通的 SELECT 元素被视为一种输入元素，浏览器在提交之前会查询它以获取当前选择元素。如果您简单地将 SELECT\
  \ 元素替换为 Bootstrap 的下拉按钮组，这种情况就不会发生。至少，您需要添加一个标记有唯一 ID 的隐藏输入字段。此 ID 也将标识整个下拉列表。隐藏字段必须通过\
  \ JavaScript 填充。\n\n下拉列表的标记略有不同，如下：\n\n点击此处查看代码图片\n\n```html\n<div class=\"btn-group\"\
  >\n    <a class=\"btn btn-default dropdown-toggle\" data-toggle=\"dropdown>\n  \
  \      <input type=\"hidden\" name=\"Id\" id=\"Id\" value=\"...\" />\n        Get\
  \ one <span class=\"caret\"></span\n    </a\n    <ul>\n        <li><a href=\"#\"\
  \ data-value=\"Value\"> Text</a></li>\n    </ul>\n</div\n```\n\n`UL/LI` 下拉结构中的每个锚点元素都应该与以下代码关联，以响应用户的点击：\n\
  \n点击此处查看代码图片\n\n```javascript\n$(\".dropdown-menu li a\").click(function () {\n\
  \    // 获取选中的文本\n    var selected = $(this).text();\n    // 显示选中的文本\n    $(this).parents('.btn-group').find('.dropdown-toggle').text(selected\
  \ + '<span class=\"caret\"></span>');\n    // 获取与元素关联的值\n    var dataValue = $(this).attr(\"\
  data-value\");\n    // 将值存储在隐藏字段中\n    $(this).parents('.btn-group').find('input[type=hidden]').val(dataValue);\n\
  });\n```\n\n现在您已经有了一个基础的解决方案，准备好面对下一个挑战了：如何在真实页面中有效使用下拉组件。\n\n#### 在真实页面中使用自定义下拉列表\n\
  \nRazor 提供了在 HTML 助手中封装可重用标记片段的机会。大多数 Razor 助手在代码中定义为 `HtmlHelper` 类的扩展方法。此类组件构建了它们的\
  \ HTML 标记。使用 `TagBuilder` 类或纯字符串可以构建 HTML 标记。然而，在 ASP.NET MVC 中也可以创建基于标记的组件。让我们在\
  \ `App_Code` 文件夹中创建一个新文件并调用 `BootstrapExtensions.cshtml`。完整的源代码所示：\n\n点击此处查看代码图片\n\
  \n```cshtml\n@using System.Web.Mvc\n@helper DropDown(string id,\n              \
  \  string title,\n                SelectList list,\n                buttonStyle=\"\
  btn-default\",\n                string width=\"auto\",\n                string caret=\"\
  caret\")\n{\n    var selectedText = title;\n    var selectedValue = (string)list.SelectedValue\
  \ ?? \"\";\n    if (!String.IsNullOrWhiteSpace(selectedValue))\n    {\n        selectedText\
  \ = (from item in list\n                        where item.Value == selectedValue\n\
  \                        select item.Text).FirstOrDefault();\n    }\n    <div class=\"\
  btn-group\" style=\"width:@width\">\n        <a class=\"btn @buttonStyle dropdown-toggle\"\
  \ data-toggle=\"dropdown\" style=\"width:100%\">\n            <input type=\"hidden\"\
  \ name=\"@id\" id=\"@id\" value=\"@selectedValue\" />\n            <div class=\"\
  bext-dropdown-selected\">@selectedText</div\n            <div style=\"float:right\"\
  ><span class=\"@caret\"></span></div>\n            <div class=\"clearfix\"></div>\n\
  \        </a>\n        <ul class=\"dropdown-menu\" style=\"width:100%\">\n     \
  \       @foreach (var item in list)\n            {\n                <li><a href=\"\
  #\" data-value=\"@item.Value\">@item.Text</a></li>\n            }\n        </ul>\n\
  \    </div\n}\n```\n\n现在您有一个名为 `BootstrapExtensions` 的新组件，可以在 Razor 视图中使用。构造函数接受几个参数，例如下拉组件的\
  \ ID、未选择项目时显示的文本、要显示的列表以及一些样式属性。在您的 Razor 文件中，可以使用如下所示的代码：\n\n```cshtml\n@BootstrapExtensions.DropDown(\n\
  \    \"btn-select\",\n    \"Get one\",\n    new SelectList(Model.Data, \"Id\", \"\
  Name\"), \n    \"btn-primary btn-lg\", \n    \"200px\")\n```\n\n使用自定义下拉列表与使用任何预定义的\
  \ Razor HTML 助手（如 `Html.CheckBox` 或 `Html.Partial`）没有太大。\n\n要程序化地读取 Bootstrap 派生下拉列表元素的值，您可以使用以下脚本：\n\
  \n```javascript\n$(\"#btn-select\").val()\n```\n\n\n\n\n\n`#btn-select` 表达式标识了隐藏在标记结构折叠中的隐藏字段。具体来说，`btn-select`\
  \ 是你之前在代码中作为下拉辅助方法的第一个参数传递的 ID。对于下拉列表，你通常不需要读取被选项目项的文本。但是，如果你恰好需要该文本，在给定的标记结构下，你可以这样实现它：\n\
  \n点击此处查看代码图片\n\n```javascript\n$(\"#btn-select\").next().text()\n```\n\n`next()`\
  \ 选择器假设隐藏字段在层级结构中位于包含显示文本的 DIV 之前。如果你更改了 HTML 模板，则 JavaScript 代码也需要相应更新。\n\n###\
  \ 分析检查框的特殊情况\n\n在普通的 ASP.NET MVC 视图中，你可以通过两种方式使用检查框。你可以直接添加原始 HTML 标记，也可以使用 Razor\
  \ 辅助方法，如下：\n\n点击此处查看代码图片\n\n<!-- 选项 #1 -->\n```html\n<input type=\"checkbox\" checked\
  \ id=\"checkbox\" name=\"checkbox\" />\n```\n\n<!-- 选项 #2 -->\n```cshtml\n@Html.Checkbox(\"\
  checkbox\", true);\n```\n\n尽管听起来很诡异，但在实际页面中应用这两个选项时，它们并不等同。原因是当使用原始 `INPUT` 时，ASP.NET\
  \ MVC 模型绑定层在解析浏览器提交的原始 HTML 信息时会遇到困难。由于这个原因，`Html.CheckBox` 辅助方法包含一个具有相同 ID 的隐藏字段，用于以绑定层可以理解的布尔值格式提交数据。结论是，在\
  \ ASP.NET MVC 中，你应该使用 `Html.CheckBox` 而不是原始的 `INPUT` 检查框元素。\n\n此外，你可以创建自定义的 Bootstrap\
  \ 检查框，它们还能提供更一致的外观和体验。这非常简单。你可以在 [`getbootstrap.com`](http://getbootstrap.com) 找到思路和帮助代码。\n\
  \n### 总结\n\n最终，我认为在网站中不使用 Bootstrap 的理由非常少。使用它的一个很好的理由是你已经拥有了一个模板，可以将你在页面中使用的大多数组件在共同的视觉风格下统一起来。诸如菜单、下拉列表、按钮、检查框、标签页和模态对话框是网页中常见的元素，并且必须以一种（图形化）形式存在。\n\
  \nBootstrap 提供了一些内置功能，但网页设计师可以在制作相同功能的同时，让网站的整体外观具有独特性。这是不使用 Bootstrap 的一个理由。然而，同时，这也是理解\
  \ Bootstrap 在现代 Web 中所发挥的作用和力量的一种良好方法：要么使用它，要么使用实现与其相同功能的东西，只是外观和体验有所不同。\n\n通过 Bootstrap，你将体验到较短的学习曲线，并且有很多免费的模板（Bootstrap\
  \ 的变体）可用，甚至有更多只需支付少量费用即可获得。如果你是网页设计师或打算聘佣网页设计师的人，你可能并且应该要求最终模板是基于 Bootstrap 的。\n\
  \n本章提供了 Bootstrap 的整体视图，并涵盖了它的主要功能和组件。我尝试提供关于 Bootstrap 及其在真实站点中应用的现实愿景。不过，我不确定是否涵盖了它所有的重要方面。我鼓励你直接从\
  \ Bootstrap 文档（从 [`getbootstrap.com`](http://getbootstrap.com））查看更多组件、功能、样式和扩展。\n\
  \n最后提到一点，请记住 Bootstrap 开启了响应式 Web 设计时代，这种设计方法强调的是无论屏幕大小如何，都为用户提供理想的体验。响应式 Web 设计绝对是一个极佳的主意——它是太棒了，以至于\
  \ Bootstrap 模板可以与任何类型的移动设备兼容。然而，正如 Bootstrap 并不会消除对内容需要强大图形构思的需求一样，它也没有消除有时需要通过特定的移动站点对某些设备（特别是智能手机和旧式手机手机）进行特殊处理的需求。我将在第\
  \ 15 章中回到这一点。\n\n## 第 10 章。组织 ASP.NET MVC 项目\n\n*智能是适应变化的能力。*\n\n*——史蒂芬·霍金*\n\n\
  随着越来越多的开发者利用 ASP.NET Core 1.0 的各种版本，使用 Microsoft Visual Studio 编写、编译和测试 ASP.NET\
  \ MVC 应用已成为一种可能的选择。当你在 Visual Studio 中创建一个新的 ASP.NET MVC 项目时，你实际上会运行某种向导，根据模板创建一个新的文件夹树。ASP.NET\
  \ MVC 应用程序需要一些特定的文件夹和文件，如果缺少这些文件夹，它将无法运行，或者运行方式不同。必需文件夹的一个良好示例是 `Views` 文件夹，它包含\
  \ HTML 视图，在生产环境中必须原样复制，包含特定数量的子文件夹，并命名恰当。\n\n然而，除了 `Views` 文件夹之外，项目结构大部分取决于开发团队。除非你使用启动初始化器或自定义\
  \ HTML 辅助方法等特定功能，否则你不必遵循强制的名称和文件夹。\n\n然而，项目文件夹的组织是解决方案的重要部分。所需功能在二进制文件（二进制）和类库之间的分布也是如此。在本章中，我将介绍我每天都会使用的一些实践。我不指你会同意我对每项实践的观点，但我希望阅读我的编程习惯至少能促使你重新考虑自己的习惯，从而间接改进它们。\n\
  \n### 规划项目解决方案\n\nASP.NET MVC 项目会在 `Bin` 文件夹中交付大量的 DLL 文件。这些 DLL 文件有两种类型：你自己的应用程序特定的\
  \ DLL 文件，以及通过引用 NuGet 包引入的文件。构建一个 ASP. MVC 应用需要多少个特定的二进制文件？这取决于你构想的项目架构。\n\n####\
  \ 将项目映射到分层架构\n\n在我们目前所处的云时代，涉及到可扩展性时，首要考虑的是代码如何便于被复制。这种关注意味着需要将共享数据量限制为零或极小，并避免跨进程连接。你越能将事物保持在单层中就越好。换句话说，项目代码越紧凑越好。\n\
  \n### 观察大局\n\n至少，你需要一个能生成 Web 服务器应用程序的项目。在第 5 章“分层架构”中，我认为层（layers）优于级（tiers），因为它们在今天的技术和实践中更容易扩展。分层架构模式识别了四个关键层：表示层、应用层、领域层和基础设施层。\n\
  \n图 10-1 显示了在 ASP.NET MVC 解决方案中设置分层架构的一种方法。\n\n**图 10-1 将 ASP.NET MVC 解决方案中的映射**\n\
  \n该图展示了一个真实的 ASP.NET MVC 解决方案及其整个项目集。项目被映射到层，用气泡表示。每个气泡代表你想要在代码中的一个典型层。`YourApp.Server`\
  \ 项目是一个 ASP.NET MVC 项目，并结合了表示层和应用层。领域层由三个不同的类库项目组成：分别用于查询栈、命令栈和领域模型的项目。\n\n* * *\n\
  \n注意：示例使用了命令查询职责分离（CQRS）方法。有关 CQRS 的更多信息，请参阅第 2 章“选择支持架构”。\n\n\n\n\n最后，`Infrastructure`（基础设施）层包含两个类库——用于持久化以及你可能需要的其他辅助组件，例如缓存、密码哈希、依赖注入、日志记录、外部服务等。\n\
  \n### 显示层和应用层\n\n在 `ASP.NET MVC` 控制器中，类是浏览器与服务器端代码之间的第一个接触点。由于这个原因，它们是你可能拥任何显示逻辑的仓库。你可以在控制器内部编排任何你需要的工作流，但复杂的工作流会让你的控制器类变得相当臃肿。\n\
  \n正因如此，你可能希望保持控制器更轻量化，并将编排业务任务的代码移动到中间层——应用层。应用层当然可以是一个独立的层，并且是一个不同的类库项目。这完全取决于你的决定。然而，目前的一种常见做法是尝试保持代码尽可能紧凑。此外，将显示层和应用层保持在同一个项目中也是完全可以的——你只需要使用项目文件夹来保持内容分离即可。\n\
  \n### 领域层\n\n正如本书的第一部分所讨论的，将命令（command）和查询（query）栈分离正迅速成为一种标准的架构方法。正如第 2 章所解释的那样，它有助于保持简单并避免大多数复杂性。\n\
  \n如果你选择 `CQRS` 设计，你可能想为查询栈准备一个类库，并将你可能需要的任何数据传输对象放在那里。你还应该为命令栈准备另一个类库，并将领域服务的大部分代码放在那里。你可能还会为领域模型准备一个单独类库。\n\
  \n### 基础设施层\n\n基础设施层大部分是持久化层的封装层，数据通过关系型数据库或 NoSQL 数据库进行持久化。该层的通用模式包括：拥有一个基础设施类库，并将持久化视为基础设施的一个方面，它可能在另一个专门的类库中实现。不过，在简单的场景下，你可能只是想将基础设施层简化为持久化层。\n\
  \n字体 应用启动\n\n几乎每个 `ASP.NET MVC` 应用程序都有一个 `global.asax` 文件，它作为系统级事件处理程序的容器。最常见的事件是应用程序启动问题和应用程序错误。你还可以在\
  \ `global.asax` 事件中处理与会话开始和结束相关的问题。\n\n`global.asax` 文件是一个纯文本文件，它做的就是引用一个包含处理程序的自定义类。这里是典型的\
  \ `global.asax` 标记：\n\n点击此处查看代码图像\n\n```xml\n<% @Application Codebehind=\"Global.asax.cs\"\
  \ Inherits=\"YourApp.MvcApplication\" Language=\"C#\" %>\n```\n\n`YourApp.MvcApplication`\
  \ 类包含实际的处理程序，并继承自系统定义的 `HttpApplication` 类。在 `YourApp.MvcApplication` 类中，你放置了所有完全配置并正确初始化应用程序的代码。\n\
  \n#### 注册区域 (areas)\n\n初始化应用程序的常见模式是在 `global.asax` 类的 `Application_Start` 方法中放置一组调用。至少地，你会在启动处理程序中找到以下代码。（注意，这段代码在\
  \ `ASP.NET Core 1.0` 和新的运行时环境中会有所不同。）\n\n点击此处查看代码图像\n\n```csharp\nprotected void\
  \ Application_Start()\n{\n   // 注册 ASP.NET MVC 区域（如果有）\n   AreaRegistration.RegisterAllAreas();\n\
  \n   // 注册应用程序要监听的路由\n   RouteConfig.RegisterRoutes(RouteTable.Routes);\n}\n```\n\
  \n第一行处理 `ASP.NET MVC` 区域，如果特定应用程序支持区域的话。如果不支持，你只需要删掉代码段中的第一个调用。`ASP.NET MVC` 区域是\
  \ `ASP.NET MVC` 应用程序中功能独立的模块，并通过名称进行识别。本质上，`area` 是主应用程序内部的子应用程序，模仿了与父 MVC 应用程序相同的文件夹结构和约定。你可能也需要在大型应用程序中使用区域，以便更方便地管理通常数量大量的控制器和视图。因此，区域是可选的。\n\
  \n每个区域都有自己的控制器、模型和视图。要调用给定区域下的控制器操作，你只需要使用一个路由，其中区域名称位于控制器名称之前。下面的代码片段显示了定义区域的类：\n\
  \n点击此处查看代码图像\n\n```csharp\npublic class AdminAreaRegistration : AreaRegistration\n\
  {\n    public override string AreaName\n    {\n        get { return \"Admin\"; }\n\
  \    }\n    public override void RegisterArea(AreaRegistrationContext context)\n\
  \    {\n        context.MapRoute(\n            \"Admin_default\",\n            \"\
  Admin/{controller}/{action}/{id}\",\n            new { action = \"Index\", id =\
  \ UrlParameter.Optional }\n        );\n    }\n}\n```\n\n在 Visual Studio 中，你可以使用解决方案中的临时菜单项来创建区域。菜单项会弹出一个对话框，在其中指定区域名称，创建文件夹结构，并自动生成类似所示的类。你在\
  \ `global.asax` 中看到的 `RegisterAllAreas` 方法使用了反射来导航到项目，寻找包含 `AreaRegistration` 的程序集。对于这些类型中的每一个，它随后会调用\
  \ `RegisterArea` 方法。\n\n#### 注册路由\n\n在第 8 章中，“ASP.NET MVC 核心”，我详尽讨论了应用程序路由以及它们是如何定义的。`Application_Start`\
  \ 事件确保在第一个请求到达应用程序之前，所有必要的路由已就绪。这里是默认配置：\n\n点击此处查看代码图像\n\n```csharp\npublic class\
  \ RouteConfig\n{\n   public static void RegisterRoutes(RouteCollection routes)\n\
  \   {\n      routes.IgnoreRoute(\"{resource}.axd/{*pathInfo}\");\n      routes.MapRoute(\n\
  \         name: \"Default\",\n         url: \"{controller}/{action}/{id}\",\n  \
  \       defaults: new { controller = \"Home\", action = \"Index\", id = UrlParameter.Optional\
  \ }\n      );\n   }\n}\n```\n\n显然，你可以根据需要修改默认路由，并添加任意数量的新路由。此外，请注意，你只需要向 `RouteTable`\
  \ 类的静态集合 `Routes` 添加 `Route` 类的实例。在 `RouteConfig` 类的范围内使用 `MapRoute` 扩展方法这样做是一种推荐模式，它与任何实现相同结果的代码都一样好。\n\
  \n* * *\n\n![图像](img/00006.jpeg) 重要\n\n请记住，上述代码仅适用于新的 `ASP.NET Core 1.0` 运行时环境之外的\
  \ `ASP.NET MVC` 版本。正如第 7 章所讨论的，“ASP.NET Core 1.0 的新特性”，新的运行时环境支持略有不同的语法，它不需要任何 `RouteConfig`\
  \ 类。\n\n\n\n\n如何配置区域和路由是任何 ASP.NET 应用程序共同的问题。然而，每个应用程序都可能有额外的配置需求。正如前面提到的，ASP.NET\
  \ MVC 中的一种流行约定是使用配备了静态方法的 `xxxConfig` 类，用来执行任何与特定功能相关的初始化，例如资源程序包、Web API 路由、单元过滤器、本地化、反转控制\
  \ (IoC) 框架，以及特定组件（如设备检测框架或服务总线）的初始化。\n\nWeb 应用中需要配置的一个典型任务是从某种形式的存储中加载全局数据。一些通用设置可以直接以键/值对的形式保存在\
  \ `web.config` 文件中。这种方法通常用于偶尔变化的半静态值，或者用于在特殊情况下需要启用或禁用的功能。\n\n任何其他指定系统应以特定方式运行的信息，可能更适合存储在单独的数据存储中，无论它是普通的\
  \ Microsoft SQL Server 数据库表还是某种形式的云存储。理想情况下，所有配置数据都通过从应用程序特定的 `HttpApplication`\
  \ 对象暴露出来的全局静态属性提供。以下是一个示例：\n\n点击此处查看代码图像\n\n```cs\npublic class YourApplication\
  \ : HttpApplication\n{\n    public static YourAppVersion Version { get; private\
  \ set; }\n\n    public static YourAppSettings Settings { get; private set; }\n\n\
  \    public static IList<INewsProvider> NewsProviders { get; private set; }\n\n\
  \    ...\n\n    protected void Application_Start()\n    {\n        AreaRegistration.RegisterAllAreas();\n\
  \        RouteConfig.RegisterRoutes(RouteTable.Routes);\n        Version = ApplicationConfig.LoadVersionInformation();\n\
  \        Settings = ApplicationConfig.LoadGeneralSettings();\n        NewsProviders\
  \ = ApplicationConfig.SetupNewsProviders();\n        ...\n    }\n\n    ...\n}\n\
  ```\n\n完整的版本号可以从 `web.config` 文件中读取，而设置和新闻提供者可以从存储中读取。所有信息在应用程序的任何部分都是全局可用的。\n\n\
  ***\n\n![Image](img/00006.jpeg) 重要\n\n当你使用全局可访问的数据时，你应该小心确保它是只读信息，或者至少确保对共享数据所做的任何更改都不会产生不可良的副作用。\n\
  \n***\n\n### 多租户应用程序\n\n多租户应用程序是一种特殊的 Web 应用程序，其中单个托管网站为多个客户端或租户服务，每个租户从不同的 URL\
  \ 发起请求。博客引擎是多租户应用程序的一个绝佳示例。想象你创建了一个 WordPress 博客，并付费让它运行在自己的域名上。你并没有获得一个部署在你自己服务器上的属于自己的博客引擎副本。更有可能是在指示博客多租户架构，将来自你已知域名的任何请求根据该租户的设置和数据映射到\
  \ 应用程序代码的特定配置。\n\n在配置方面，ASP.NET MVC 多租户应用程序需要额外的步骤。对于每个操作，控制器将解析主机信息并加载任何将应用程序实例配置为请求租户需求和预期的数据。除了应用程序启动时设置的共享配置外，你还需要为每个请求执行一个额外步骤。主机名是用于加载正确信息的区分符。以下是示例控制器操作的一些代码：\n\
  \n点击此处查看代码图像\n\n```cs\npublic class HomeController : Controller\n{\n    public ActionResult\
  \ Index()\n    {\n        // 获取请求主机的名称\n        var host = Request.Url.DnsSafeHost;\n\
  \        // 获取租户特定配置\n        var tenantSettings = TenantConfig.Load(host);\n  \
  \      // 在响应中包含租户特定信息\n        var model = DoSomeWorkAndGetViewModel(tenantSettings);\n\
  \        return View(model);\n    }\n}\n```\n\n注意，每个操作都需要处理租户工作。出于这个原因，在现实场景中，你可能希望将通用代码移动到基控制器类中以尽量减少负担。\n\
  \n### 理解 ASP.NET Core 1.0 配置\n\n全新的 .NET 执行环境 (DNX) 控制着 ASP.NET Core 1.0 应用程序的执行。因此，每个\
  \ ASP.NET Core 1.0 项目都是 DNX 项目，并遵循一种临时的基于 JSON 的语法。ASP.NET Core 1.0 应用程序与 DNX 管道之间的接触点是\
  \ ASP.NET Application Hosting 包。该包的核心是 `Startup` 类。该类是 ASP.NET Core 1.0 中用于初始化流水线并完全配置应用程序的约定，使其也基于来自托管环境的信息：\n\
  \n点击此处查看代码图像\n\n```cs\npublic class Startup\n{\n    // 设置请求流水线的中间件 (OWIN)\n    public\
  \ void Configure(IApplicationBuilder app)\n    {\n        ...\n    }\n    // 设置通过内部\
  \ IoC 基础设施使用的服务\n    public void ConfigureServices(IServiceCollection services)\n\
  \    {\n        ...\n    }\n}\n```\n\n`Configure` 方法配置每个请求都会经过的流水线。它添加了用于处理请求的组件引用。引用通过\
  \ `IApplicationBuilder` 对象上定义的 `UseXxx` 扩展方法添加。至少，一个 ASP.NET 应用程序包含以下内容：\n\n```cs\n\
  public void Configure(IApplicationBuilder app)\n{\n    app.UseMvc();\n}\n```\n\n\
  如果你打算使用基于约定的路由，你在此处指定你支持的路由：\n\n```cs\npublic void Configure(IApplicationBuilder\
  \ app)\n{\n    app.UseMvc(routes => {\n        routes.MapRoute(\n            name:\
  \ \"Default\",\n            template: \"{controller}/{action}/{id?}\");\n    });\n\
  }\n```\n\n在 `ConfigureServices` 方法中，你列出了应用程序正在使用的服务。同样，至少一个 ASP.NET 应用程序包含以下内容：\n\
  \n```cs\npublic void ConfigureServices(IServiceCollection services)\n{\n    // \
  \ Entity Framework 和 SQL Server\n    services.AddEntityFramework();\n    services.AddSqlServer();\n\
  \    //  ASP.NET MVC 二进制文件\n    services.AddMvc();\n}\n```\n\n在 `ConfigureServices`\
  \ 方法中，你还有与内部 IoC 框架工作并将接口解析为实际类的调用。\n\n#### 检查应用程序服务\n\nASP.NET MVC 是一个为了可测试性设计的框架，并促进了重要的原则，如关注点分离\
  \ (SoC) 和依赖注入 (DI)。ASP.NET MVC 期望应用程序被分为称为 `controller`、`view` 和 `model` 的部分。\n\n\
  被强制创建控制器类并不意味着你自动实现了正确的关注点分离，也绝不意味着你正在编写可测试的代码。ASP.NET MVC 为你提供了一个良好的开始，但任何额外的（必要的）分层都由你决定。\n\
  \n### 使用瘦控制器\n\n任何请求都可能触发一个工作流，有时工作流是复杂的。如果你从单处——控制器方法中编排整个工作流及其所有的错误处理和补偿逻辑，你很有可能得到一个长方法，可能有\
  \ 100 行或更多。这样的长方法没有意义。\n\n为了支持你创建瘦控制器的努力，我建议采用基于以下几点的策略：\n\n\n\n\n\n![Image](img/00003.jpeg)\
  \ 将任何操作委托给特定于控制器的工作服务类。该类是应用程序层的一部分，并且不期望被重用。\n\n![Image](img/00003.jpeg) 让工作服务类的方法接受来自模型绑定器（model\
  \ binder）的输入数据。\n\n![Image](img/00003.jpeg) 让工作服务类的方法返回以视图模型（View-Model）对象表示的数据，这些对象已准备好传递给视图引擎。\n\
  \n![Image](img/00003.jpeg) 通过属性（attributes）捕获异常。\n\n让我们看看我是如何构思工作服务类的。\n\n## 使用工作服务类\n\
  \n`worker service`（工作服务）是一个与控制器配合使用的辅助类。你可能会合理地预设为每个控制器都有一个独立的工作服务类。另一方面，工作服务只是控制器的扩展，它是将核心行为从控制器类中移动到一个独立的、可测试的类中产生的结果。\n\
  \n图 10-2 显示了 ASP.NET MVC 中工作服务的架构视角。\n\n![Image](img/00071.jpeg)\n\n**图 10-2** 工作服务与控制器\n\
  \n实现工作服务后，控制器方法变得像这里所示一样简单：\n\n点击此处查看代码图片\n\n```cs\npublic class HomeService : IHomeService\n\
  {\n    public IndexViewModel GetIndexViewModel()\n    {\n        ...\n    }\n  \
  \  ...\n}\n\npublic class HomeController : Controller\n{\n    private IHomeService\
  \ _homeService = new HomeService();\n    public ActionResult Index(...)\n    {\n\
  \        var model = _homeService.GetIndexViewModel(...);\n        return View(model);\n\
  \    }\n}\n```\n\n是否将工作服务类抽象为接口取决于你的决定。如果抽象能带来具体的益处，那么抽象就是是一件很好的事情。前面的代码也没有使用任何形式的依赖注入。这里展示了一个手工编写依赖注入的示例：\n\
  \n点击此处查看代码图片\n\n```cs\npublic class HomeController : Controller\n{\n    private\
  \ IHomeService _homeService;\n    public HomeController() : this(new HomeService())\
  \ {}\n    public HomeController(IHomeService service)\n    {\n        _homeService\
  \ = service;\n    }\n    public ActionResult Index(...)\n    {\n        var model\
  \ = _homeService.GetIndexViewModel(...);\n        return View(model);\n    }\n}\n\
  ```\n\n## 确定工作服务类的位置\n\n工作服务类是表现层（例如，控制器）和中间层（例如，领域和基础设施）之间的连接点。所有工作服务类的集合构成了我在第\
  \ 5 章中讨论的应用程序层。\n\n你可以将应用程序层实现为独立的类库（class library），但在大多数情况下，它可以轻松地保留在主 ASP.NET\
  \ MVC 项目的边界内。我只是创建一个我喜欢的名为 `Application` 的新项目文件夹，并将所有工作服务类放在那里。因为工作服务类只是最终进入单个二进制\
  \ DLL 的编译类，所以你采用的任何文件夹结构都是可以的。\n\n添加工作服务类\n\n工作服务类是表现层（例如，控制器）和中间层（例如，领域和基础设施）之间的连接点。所有工作服务类的集合构成了我在第\
