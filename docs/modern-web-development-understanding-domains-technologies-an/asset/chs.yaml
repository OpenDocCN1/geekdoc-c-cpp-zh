  \ 让工作服务类的方法返回以视图模型（View-Model）对象表示的数据，这些对象已准备好传递给视图引擎。\n\n![Image](img/00003.jpeg)\
  \ 通过属性（attributes）捕获异常。\n\n让我们看看我是如何构思工作服务类的。\n\n## 使用工作服务类\n\n`worker service`（工作服务）是一个与控制器配合使用的辅助类。你可能会合理地预设为每个控制器都有一个独立的工作服务类。另一方面，工作服务只是控制器的扩展，它是将核心行为从控制器类中移动到一个独立的、可测试的类中产生的结果。\n\
  \n图 10-2 显示了 ASP.NET MVC 中工作服务的架构视角。\n\n![Image](img/00071.jpeg)\n\n**图 10-2** 工作服务与控制器\n\
  \n实现工作服务后，控制器方法变得像这里所示一样简单：\n\n点击此处查看代码图片\n\n```cs\npublic class HomeService : IHomeService\n\
  {\n    public IndexViewModel GetIndexViewModel()\n    {\n        ...\n    }\n  \
  \  ...\n}\n\npublic class HomeController : Controller\n{\n    private IHomeService\
  \ _homeService = new HomeService();\n    public ActionResult Index(...)\n    {\n\
  \        var model = _homeService.GetIndexViewModel(...);\n        return View(model);\n\
  \    }\n}\n```\n\n是否将工作服务类抽象为接口取决于你的决定。如果抽象能带来具体的益处，那么抽象就是是一件很好的事情。前面的代码也没有使用任何形式的依赖注入。这里展示了一个手工编写依赖注入的示例：\n\
  \n点击此处查看代码图片\n\n```cs\npublic class HomeController : Controller\n{\n    private\
  \ IHomeService _homeService;\n    public HomeController() : this(new HomeService())\
  \ {}\n    public HomeController(IHomeService service)\n    {\n        _homeService\
  \ = service;\n    }\n    public ActionResult Index(...)\n    {\n        var model\
  \ = _homeService.GetIndexViewModel(...);\n        return View(model);\n    }\n}\n\
  ```\n\n## 确定工作服务类的位置\n\n工作服务类是表现层（例如，控制器）和中间层（例如，领域和基础设施）之间的连接点。所有工作服务类的集合构成了我在第\
  \ 5 章中讨论的应用程序层。\n\n你可以将应用程序层实现为独立的类库，但在大多数情况下，它可以轻松地保留在主 ASP.NET MVC 项目的边界内。我只是创建一个我喜欢的名为\
  \ `Application` 的新项目文件夹，并将所有工作服务类放在那里。因为工作服务类只是最终进入单个二进制 DLL 的编译类，所以你采用的任何文件夹结构都是可以的。\n\
  \n\n\n编写自定义视图引擎有两种方法。你可以继承基类 `VirtualPathProviderViewEngine`，也可以从 Razor 引擎派生你的视图引擎——即\
  \ `RazorViewEngine` 类。如果你继承自 `VirtualPathProviderViewEngine`，则你必须为视图和部分视图（partial\
  \ views）提供渲染过程的实现。你需要负责定位模板的内容（无论来自物理文件还是数据库表），并将其渲染为 HTML 视图。总而言之，我认为这是一个进阶选项，在现实世界中偶尔才需要，尽管它是一个很有用的功能。\n\
  \n如果你只是想从与通常不同的位置定位 Razor 部分视图（甚至是布局和视图），你只需要下面的类即可。在构造函数中，你为三个属性分配了新值：`PartialViewLocationFormats`、`ViewLocationFormats`\
  \ 和 `MasterLocationFormats`。\n\n点击此处查看代码图片\n\n```csharp\npublic class MyViewEngine\
  \ : RazorViewEngine\n{\n    public MyViewEngine()\n    {\n        // 定义部分视图的位置\n\
  \        this.PartialViewLocationFormats = new string[]\n        {\n           \
  \ \"~/Views/{1}/{0}.cshtml\",\n            \"~/Views/Shared/{0}.cshtml\",\n    \
  \        \"~/Views/Partial/{0}.cshtml\",\n            \"~/Views/Partial/{1}/{0}.cshtml\"\
  \n        };\n        // 定义视图的位置\n        this.ViewLocationFormats = new string[]\n\
  \        {\n            \"~/Views/{1}/{0}.cshtml\",\n            \"~/Views/Shared/{0}.cshtml\"\
  ,\n            \"~/Views/Controller/{1}/{0}.cshtml\"\n        };\n        // 定义布局的位置\n\
  \        this.MasterLocationFormats = new string[]\n        {\n            \"~/Views/Shared/{0}.cshtml\"\
  ,\n            \"~/Views/Layout/{0}.cshtml\"\n        };\n    }\n}\n```\n\n占位符 `{1}`\
  \ 表示控制器的名称，占位符 `{0}` 表示视图的名称。你在 `global.asax` 中注册新的视图引擎，如下。你首先清除所有现视图引擎以避免冲突，然后添加你的新引擎：\n\
  \n点击此处查看代码图片\n\n```csharp\nprotected void Application_Start()\n{\n    RouteConfig.RegisterRoutes(RouteTable.Routes);\n\
  \    ...\n    ViewEngines.Engines.Clear();\n    ViewEngines.Engines.Add(new MyViewEngine());\n\
  }\n```\n\n图 10-4 展示了一个使用自定义视图引擎的 ASP.NET MVC 项目截图。如你所示，Views 文件夹的结构是完全自定义的。你现在有了三个主要的子文件夹，对应你可能有的每一类视图：`controller`、`partial`\
  \ 和 `layout`。\n\n![Image](img/00073.jpeg)\n\n**图 10-4** 完全重新设计的 Views 文件夹结构\n\n\
  最后，请注意，如果你将布局文件放在默认 Shared 文件夹之外，你还必须编辑 `_ViewStart.cshtml` 文件的内容并使其指向新位置。`_ViewStart.cshtml`\
  \ 文件包含了在未向布局文件传递给视图引擎时使用的默认布局文件的路径。\n\n### 更有效地提供资源\n\n随着网页继续提供日益丰富的视觉内容，下载 CSS、脚本文件和图像等相关资源的成本显著增加。无疑，大部分情况下这些资源可以被浏览器本地缓存；但初始占用可能是难以维持的。对于脚本和\
  \ CSS 文件，可以将 GZIP 压缩与 `bundling`（打包）和 `minification`（压缩化）结合，这两种技术可以显著减少尺寸和下载次数。\n\
  \n目前许多可用框架都提供打包和压缩化服务，但在扩展性和功能集上略有不同。在大多数情况下，它们提供相同的能力——因此选择其中一个而不是另一个纯粹是个人喜好问题。如果你正在编写\
  \ ASP.NET 应用程序，打包和压缩化的自然选择是 Microsoft ASP.NET Web Optimization 框架，它可以通过 NuGet 包获取。\n\
  \n![Image](img/0004.jpeg) 注意，你可以同时应用打包和压缩化，但它们仍然是独立的过程。根据你的需求，你可以决定只创建包或对单个文件进行压缩化。通常，在生产站点上，你没有理由对所有\
  \ CSS 和 JavaScript 进行打包和压缩化。但在调试时，情况完全是另一回事：压缩化或打包后的资源非常难以阅读和单步执行，因此你不希望启用打包和压缩化。\n\
  \n#### 使用打包功能\n\n`Bundling`（打包）是将若干不同的资源合并成一个单一可下载文件的过程。例如，一个包可能包含多个 JavaScript\
  \ 或 CSS 文件。在布局和视图文件中引用包的 URL 时，会发生单次下载，但 DOM 会受到包中存储的所有内容的影响。\n\n##### 包相关文件\n\n\
  通常，你在 `global.asax` 中通过程序创建包。根据 ASP.NET MVC 约定，你可以在 `App_Start` 文件夹中创建一个 `BundleConfig`\
  \ 类并从中暴露一个静态方法，如下所示：\n\n点击此处查看代码图片\n\n```csharp\nBundleConfig.RegisterBundles(BundleTable.Bundles);\n\
  ```\n\n一个包仅仅是文件的集合——通常是样式表或脚本文件。这里是将两个文件分组到单个下载的代码：\n\n点击此处查看代码图片\n\n```csharp\n\
  public class BundleConfig\n{\n    public static void RegisterBundles(BundleCollection\
  \ bundles)\n    {\n        bundles.Add(new Bundle(\"~/site-css\"))\n           \
  \ .Include(\"~/content/styles/site1.css\",\n            \"~/content/styles/site2.css\"\
  ));\n    }\n}\n```\n\n你创建一个 `Bundle` 类并向构造函数传递将在视图或布局文件中引用的虚拟路径。要将 CSS 文件关联包，你使用\
  \ `Include` 方法。该方法接受字符串数组，每个字符串代表一个虚拟路径：\n\n点击此处查看代码图片\n\n```csharp\nbundles.Add(new\
  \ Bundle(\"~/site-css\"))\n    .Include(\"~/content/*.css\"));\n```\n\n你可以像第一个示例那样明确指示\
  \ CSS 文件，也可以像此处所示指示模式字符串。注意 `Bundle` 类有一个 `IncludeDirectory` 方法，你可以用它指示指定的虚拟路径，它可能还有一个模式匹配字符串和一个布尔标志。\n\
  \n##### 启用包优化\n\n打包是一种优化形式。因此，大部分在生产环境中使用它是合理的。`BundleTable` 类上的 `EnableOptimizations`\
  \ 属性是设置打包的一种方便方法。但请注意，在显式开启之前，打包是不激活的：\n\n点击此处查看代码图片\n\n```csharp\npublic static\
  \ void RegisterBundles(BundleCollection bundles)\n{\n    bundles.Add(new Bundle(\"\
  ~/site-css\").Include(\n        \"~/content/styles/site1.css\",\n        \"~/content/styles/site2.css\"\
  ));\n    BundleTable.EnableOptimizations = true;\n}\n```\n\n为了演示起，让我们假设 `site1.css`\
  \ 的内容如下：\n\n点击此处查看代码图片\n\n```css\nbody {\n    padding-top: 50px;\n    padding-bottom:\
  \ 20px;\n}\n/* 设置内边距以防止内容碰到边缘 */\n.body-content {\n    padding-left: 15px;\n   \
  \ padding-right: 15px;\n}\n/* 设置表单输入元素的宽度，因为它们默认是 100% 宽 */\ninput,\nselect,\ntextarea\
  \ {\n    max-width: 280px;\n}\n```\n\n相反，`site2.css` 文件将具有内容：\n\n```css\n.title\
  \ {\n    font-size: 3em;\n}\n```\n\n\n\n\n如果你在开发过程中对测试打包（bundling）不感兴趣，也可以如下所示使用指令：\n\
  \n点击此处查看代码图像\n\n```csharp\n#if DEBUG\n    BundleTable.EnableOptimizations = false;\n\
  #else\n    BundleTable.EnableOptimizations = true;\n#endif\n```\n\n让我们看看 Razor 视图中引用包需要什么。\n\
  \n### 在视图中引用 CSS 包\n\n要在任何类型的 Razor 视图中引用 CSS 包，你需使用以下代码：\n\n```csharp\n@Styles.Render(\"\
  ~/site-css\")\n```\n\n你传递给 `Render` 方法的字符串只是之前创建的 CSS 包的虚拟路径。在包中，你可以轻松地引用内容分发网络（CDN）路径。还要注意，选择使用包并不强制你只能使用包。事实上，在同一个视图中，你可以有包，也可以有直接的\
  \ CSS 请求，如下所示：\n\n点击此处查看代码图像\n\n```html\n<head>\n    <meta charset=\"utf-8\" />\n\
  \    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n\
  \    @Styles.Render(\"~/content/styles/bootstrap.min.css\")\n    @Styles.Render(\"\
  ~/site-css\")\n</head>\n```\n\nBootstrap CSS 文件作为独立的单独下载项添加，而所有其他 CSS 文件都打包在一起。\n\
  \n### 打包脚本文件\n\n要打包脚本文件，你只需将 JavaScript 文件传递给新创建的 `Bundle` 类的实例，如下所示：\n\n点击此处查看代码图像\n\
  \n```csharp\nbundles.Add(new Bundle(\"~/site-core-scripts\")\n    .Include(\"~/content/scripts/jquery-1.10.2.min.js\"\
  ,\n              \"~/content/scripts/bootstrap.min.js\"));\n```\n\n在视图中引用脚本包，你使用\
  \ `@Scripts` 对象：\n\n点击此处查看代码图像\n\n```csharp\n@Scripts.Render(\"~/site-core-scripts\"\
  )\n```\n\n图 10-5 显示了使用包时浏览器的活动。\n\n![Image](img/00074.jpeg)\n\n**图 10-5** 使用包时的浏览器活动\n\
  \n如果你将图中 `/site-css` 请求的详细信息视图与之前声明的 `site1.css` 和 `site2.css` 文件的内容进行比较，你会发现下载的内容只是这两个文件的合并内容。\n\
  \nBundle 类处理 CSS 或 JavaScript 文件时没有区别。然而，`BundleCollection` 类有两个功能在打包脚本文件时最有用：**排序器**（orderers）和忽略列表（ignore\
  \ lists）。\n\n### 排序器和忽略列表\n\n`Bundle` 类有一个类型为 `IBundleOrderer` 的属性名为 `Orderer`。尽管它看起来显而易见，但排序器是负责决定你希望打包以供下载的文件实际顺序的组件。\n\
  \n默认排序器是 `DefaultBundleOrderer` 类。该类根据 `FileSetOrderList` 属性的设置结果对文件进行打包——该属性是 `BundleCollection`\
  \ 的另一个属性。`FileSetOrderList` 属性被设计为 `BundleFileSetOrdering` 类的集合。这些类中的每一个类都定义了一个文件模式（例如\
  \ `jquery-`），并且 `BundleFileSetOrdering` 实例的顺序决定了包中文件的实际顺序。例如，在默认配置下，所有 jQuery 文件始终在\
  \ Modernizr 文件之前打包。常见文件组（如 jQuery、jQuery UI 和 Modernizr）的排序是预定义的。你可以根据需要程序地重置和更新排序。\n\
  \n***\n\n![Image](img/00004.jpeg) 备注\n\n`DefaultBundleOrderer` 类对 CSS 文件的影响较为有限，但并非为零。如果你在网站中有\
  \ `reset.css` 文件、`normalize.css` 文件或或两者兼备，它们会自动在你的任何其他 CSS 文件之前打包，并且 `reset.css`\
  \ 总是位于 `normalize.css` 之前。\n\n拥有 reset/normalize 样式表的目标是为所有 HTML（reset）和 HTML5（normalize）元素提供一组标准的样式属性，这样你的页面就不会继承浏览器特定的设置（如字体、大小和边距）。尽管这两个\
  \ CSS 文件都有一些推荐内容，但实际内容取决于你。如果你的项目中有带有这些名称的文件，ASP.NET MVC 会付出额外努力确保它们在任何其他内容之前打包。\n\
  \n***\n\n如果你想覆盖默认排序器并忽略预定义的包-文件集排序，你有两个选择。首先，你可以创建自己的排序器，它是按包单独运行的。这里有一个仅忽略预定义排序的示例：\n\
  \n点击此处查看代码图像\n\n```csharp\npublic class SimpleOrderer : IBundleOrderer\n{\n    public\
  \ IEnumerable<FileInfo> Order(BundleContext context, IEnumerable<FileInfo> files)\n\
  \    {\n        return files;\n    }\n}\n```\n\n你可以像图中所示那样使用它：\n\n点击此处查看代码图像\n\n\
  ```csharp\nvar bundle = new Bundle(\"~/all-css\");\nbundle.Orderer = new SimpleOrderer();\n\
  ```\n\n此外，你可以通过以下方式重置所有排序：\n\n```csharp\nbundles.ResetAll();\n```\n\n第二个值得注意的功能是忽略列表。通过\
  \ `BundleCollection` 的 `IgnoreList` 属性定义，它定义了包中应忽略的模式匹配字符串。忽略列表的主要优势是可以指定跳过的文件。\n\
  \n#### 使用压缩（Minification）\n\n压缩是应用于单个资源的一种转换。具体来说，压缩意味着是在不改变功能的情况下，从文本资源中移除不必要的字符。这意味着移除注释、空白字符和换行。通常情况下，文本文件中的这些字符是为了可读性，但会占用空间。\n\
  \n可读性对于人类在调试时很重要，但对于浏览器来说没有问题。下面的字符串是一个压缩后的 CSS。它不包含任何额外字符，对浏览器来说完全可以接受：\n\n点击此处查看代码图像\n\
  \n```css\nhtml,body{font-family:'sego ui';font-size:1.5em;}html,body{background-color:#111;color:#4d1cc}\n\
  ```\n\n引用压缩后的 CSS 和 JavaScript 的与引用包的方式完全相同。压缩只是对现有包的一个额外转换。因此，下一个问题变为：如何对 CSS 和\
  \ JavaScript 进行压缩？\n\n### 压缩 CSS 和脚本\n\n你到为止使用的 `Bundle` 类只关注将多个资源打包在一起，以便一次性下载并缓存。要添加压缩，你有两个选择。一种是用更具体的类替换\
  \ `Bundle` 类，例如 `StyleBundle` 和 `ScriptBundle` 类。另一种是向 `Bundle` 类的 `Transforms`\
  \ 集合填充执行 CSS 或脚本压缩的转换组件。\n\n这里是 `ScriptBundle` 和 `StyleBundle` 类的定义。它们都继承自 `Bundle`\
  \ 并添加了不同的构造函数：\n\n点击此处查看代码图像\n\n```csharp\npublic ScriptBundle(string virtualPath)\n\
  \    : base(virtualPath, new IBundleTransform[] { new JsMinify() })\n{\n}\n\npublic\
  \ StyleBundle(string virtualPath)\n    : base(virtualPath, new IBundleTransform[]\
  \ { new CssMinify() })\n{\n}\n```\n\n\n\n转换组件（transformer component）是实现了 `IBundleTransform`\
  \ 接口的类实例。脚本压缩通过 `JsMinify` 类执行。CSS 压缩通过 `CssMinify` 类执行。请注意，`CssMinify` 和 `JsMinify`\
  \ 类是 ASP.NET MVC 中的默认压缩器，它们基于 WebGrease 框架——该框架是 Microsoft ASP.NET Web Optimization\
  \ 框架的元素之一。如果你需要，可以使用不同的压缩器。压缩器简单来说就是一个实现了 `IBundleTransform` 接口的类。\n\n如果你不喜欢使用 `ScriptBundle`\
  \ 和 `StyleBundle`，而是倾向于使用相同的 `Bundle` 类，可以像此处所示添加转换器（transformers）：\n\n点击此处查看代码图片\n\
  \n```csharp\npublic class BundleConfig\n{\n    public static void RegisterBundles(BundleCollection\
  \ bundles)\n    {\n        var cssBundle = new Bundle(\"~/site-css\")\n        \
  \    .Include(\"~/content/styles/site1.css\",\n              \"~/content/styles/site2.css\"\
  );\n        cssBundle.Transforms.Add(new CssMinify());\n        bundles.Add(cssBundle);\n\
  \        var scriptBundle = new Bundle(\"~/site-core-scripts\")\n            .Include(\"\
  ~/content/scripts/jquery-1.10.2.min.js\",\n              \"~/content/scripts/bootstrap.min.js\"\
  );\n        scriptBundle.Transforms.Add(new JsMinify());\n        bundles.Add(scriptBundle);\n\
  \        BundleTable.EnableOptimizations = true;\n    }\n}\n```\n\n为一个 bundle 定义的多个转换器将按照它们出现的顺序进行应用。\n\
  \n### 处理自定义转换器\n\n自定义转换器的一个有趣示例是 LESS 转换器，它将 LESS 脚本编译为 CSS 然后对其进行压缩。这里是一些示例代码：\n\
  \n点击此处查看代码图片\n\n```csharp\nvar lessBundle = new Bundle(\"~/site-less\")\n    .IncludeDirectory(\"\
  ~/content/less\", \"*.less\");\nlessBundle.Transforms.Add(new LessTransform());\n\
  lessBundle.Transforms.Add(new CssMinify());\nbundles.Add(lessBundle);\n```\n\n`LessTransform`\
  \ 类负责将 LESS 文件转换为纯 CSS。你可以通过 `dotless` NuGet 包提供的服务以编程方式实现这一点。一旦安装了该包，你可以执行以下操作：\n\
  \n点击此处查看代码图片\n\n```csharp\npublic class LessTransform : IBundleTransform\n{\n  \
  \  public void Process(BundleContext context, BundleResponse response)\n    {\n\
  \        response.Content = dotless.Core.Less.Parse(response.Content);\n       \
  \ response.ContentType = \"text/css\";\n    }\n}\n```\n\n如果你对样式使用了其他中间语言（例如 CoffeeScript\
  \ 和 SASS），你可以自己创建类似的类。\n\n### 检查其他方面面\n\n所有应用程序都需要某种形式的错误处理，而且很大一部分应用程序需要限制仅授权用户访问内容。通常情况下，开发者对错误处理和安全的最佳实践非常敏感。每个开发团队都倾向于认为自己的解决方案比他们过的任何方案都要好。出于这个原因，我不想在本章中花费大量时间提供错误处理和用户身份验证的逐步引导指南。\n\
  \n相反，我将总结错误处理和用户身份验证的关键事实，这些可以作为清单，适用于你可能已经看到的、或者你可以通过搜索 Google 和 StackOverflow\
  \ 轻松找到的任何解决方案。\n\n### 探索错误处理\n\nASP.NET MVC 中的错误处理跨两个主要领域：程序异常的处理和路由异常的处理。前者关注捕获控制器和视图中的错误；后者则更多地关于重定向和\
  \ HTTP 错误。\n\n#### 处理程序异常\n\n在 ASP.NET MVC 中，你拥有的任何堆栈跟踪（stack trace）都源于控制器类中的方法调用。因此，捕获程序异常就是捕获来自类内部的错误。你可以使用\
  \ `try/catch` 块包裹整个方法体。这有效，但看起来很难看。更好的选项是重写基类 `Controller` 类中的 `OnException` 方法。另一个选项是使用\
  \ `HandleError` 特性。\n\n如果在任何 action 中发生异常，将调用 `OnException` 方法：\n\n点击此处查看代码图片\n\n\
  ```csharp\nprotected override void OnException(ExceptionContext context)\n{\n  \
  \  // Handle exception\n}\n```\n\n如果你不喜欢显式重写 `OnException`，可以使用 `HandleError` 特性修饰类或单个方法：\n\
  \n```csharp\n[HandleError(ExceptionType=typeof(Exception), View=\"generic\")]\n\
  ```\n\n若要全局使用 `HandleError`，请在 `global.asax` 中将其注册为全局过滤器：\n\n点击此处查看代码图片\n\n```csharp\n\
  public class MvcApplication : System.Web.HttpApplication\n{\n    protected void\
  \ Application_Start()\n    {\n        RegisterGlobalFilters(GlobalFilters.Filters);\n\
  \    }\n\n    public static void RegisterGlobalFilters(GlobalFilterCollection filters)\n\
  \    {\n        filters.Add(new HandleErrorAttribute());\n    }\n}\n```\n\n####\
  \ 处理路由异常\n\n除了你检测到的任何程序错误外，你的应用程序可能因为传入请求的 URL 不匹配任何映射路由而抛出异常——可能是由于无效的 URL（无效的\
  \ action 或控制器名称）或违反了约束。在这种情况下，你的用户将收到 HTTP 404 错误。让用户接收默认的 ASP.NET 404 页面是你出于许多原因想要避免的。\n\
  \nASP.NET 框架强制执行的典型解决方案包括为常见的 HTTP 代码（如 404 和 403）定义自定义页面（或 ASP.NET MVC 中的路由）。以下是在\
  \ ASP.NET MVC 中注册临时路由的方法：\n\n点击此处查看代码图片\n\n```xml\n<customErrors mode=\"On\">\n\
  \    <error statusCode=\"404\" redirect=\"/error/show\" />\n</customErrors>\n```\n\
  \n\n\n\n\n这种技巧运行良好，从纯功能角度来看，没有理由质疑它。那么，问题出在哪里呢？\n\n第一个问题是安全性问题。通过将 HTTP 错误映射到个性化的视图，黑客可以区分应用程序内部可能发生的不同错误类型，并利用这些信息规划进一步攻击。因此，你应该显式地将\
  \ `<customErrors>` 部分的 `defaultRedirect` 属性设置为一个给定的固定 URL，并确保没有设置任何基于状态码的配置。\n\n\
  每个状态码视图的第二个问题与搜索引擎优化（SEO）有关。想象一下，搜索引擎向一个实现了自定义错误路由的应用程序请求一个在该程序不存在的 URL。应用程序首先发布一个\
  \ HTTP 302 状态码，并通知调用者资源已临时移动到另一个位置。此时，调用者会再次尝试，并最终进入错误页面。这种方法对于人类来说是棒的，因为他们最终会看到一个漂亮的消息；但从\
  \ SEO 的角度来看，这并不是理想的，因为它会导致搜索引擎得出结论：内容并不缺失，只是比通常更难获取。而且，错误页面会被归类为普通内容并与相似内容相关联。\n\
  \n另一方面，路由异常（route exceptions）是一种特殊的错误类型，值得采用一种与程序错误不同的特殊策略。归结底，路由异常指的是某些缺失的内容。\n\
  \n### 查看所有其他可能的错误\n\n无论你拥有哪些捕获点（catch points），错误总能找到用户。当未处理的异常到达 ASP.NET 代码的最外层外壳时，`global.asax`\
  \ 中的 `Application_Error` 方法就会被调用。它是开发者代码在出现“死亡黄屏”之前的最后一次调用。你可以在此事件处理程序程序中做一些实用的操作，例如发送电子邮件或写入事件日志：\n\
  \n点击此处查看代码图片\n\n```\nvoid Application_Error(Object sender, EventArgs e)\n{\n   \
  \ var exception = Server.GetLastError();\n    if (exception == null) return;\n \
  \   var mail = new MailMessage { From = new MailAddress(\"noreply@yourserver.com\"\
  ) };\n    mail.To.Add(new MailAddress(\"administrator@yourserver.com\"));\n    mail.Subject\
  \ = \"Site Error at \" + DateTime.Now;\n    mail.Body = \"Error Description: \"\
  \ + exception.Message;\n    var server = new SmtpClient { Host = \"your.smtp.server\"\
  \ };\n    server.Send(mail);\n    // 清除错误\n    Server.ClearError();\n    // 重定向到落地页\n\
  \    Response.Redirect(\"home/landing\");\n}\n```\n\n虽然你总是可以自己编写错误处理程序，但 ASP.NET\
  \ 开发者经常使用错误日志模块和处理器（ELMAH）。归结底，ELMAH 是一个 HTTP 模块，一旦配置，它就会在应用程序级别拦截 `Error` 事件，并根据\
  \ ASP.NET 开发者的配置进行记录。（注：原文此处有重复内容，我将保持核心流程）。\n\n*自我纠正：我将重新处理提供的文本，以确保在遵循格式规则的同时不会引入无意外的重复。*\n\
