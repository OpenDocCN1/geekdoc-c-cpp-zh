  \ language）就是一个术语表。但你应该用什么语言来构建它呢？应该是英语还是客户的语言？如果客户说的是德语，通用语言仍然应该用英语吗？这并不是一个次要问题，特别是在为了同一个项目工作的国际化团队中。通用语言需要用项目的官方自然语言编写——在这个例子中，可以是英语，也可以是德语。如果为了开发目的需要翻译，应该创建一个单词对应表。拥有这样一张表很有帮助，但你确实面临引入某些歧义的风险。\n\
  在某些业务场景中，尤其是国防行业，缩写非常流行且被广泛使用。然而，缩写很难记忆和理解。通常情况下，缩写词不应该是通用语言的一部分。相反，你应该引入保留缩写词原意的新词。\n\
  ![Image](img/00004.jpeg) 备注\n### 引入边界上下文（bounded context）\n这就是 DDD 引入一个新概念的地方：`bounded\
  \ context`。边界上下文是业务领域中的某个区域，它为通用语言的任何元素提供了定义明确且无歧的含义。\n特别是在大型组织中，你会发现同一个术语对不同的人有不同的含义，或者使用不同的术语表示相同的意思是典型的。当你发现这种情况发生时，你可能已经跨越了子领域（subdomain）的隐边界。这可能意味着你认为是一个且不可分割的业务领域，实际上是以子领域的形式表述的。\n\
  在 DDD 中，问题空间（problem space）是业务领域。对于该领域，你在解决方案空间（solution space）中设计一个软件领域模型。然而，原始领域有时太大，无法有效处理，因此你将其拆分为多个子领域。当这种情况在问题空间中发生时，你在解决方案空间中就有一个边界上下文。（参见图\
  \ 1-1。）\n**图 1-1** 问题空间与解决方案空间\n边界上下文是解决方案空间中针对业务子领域的模型。边界上下文通过其自身的通用语言唯一标识。随后，在边界上下文的边界之外，通用语言发生了变化。通用语言相同的地方，上下文就是相同的。\n\
  ### 检测边界上下文\n通常来说，在在线商店应用程序的上下文中，以下是成为边界上下文的良良候选者：\n![Image](img/00003.jpeg) 财务（Accounting）\n\
  然而，这只是一个指南。实际的划分源于分析并取决于具体的上下文。通常情况下，我甚至认为任何 Web 应用程序都应该至少拆分为两个上下文：商店和后台。后台是管理员录入数据和设置规则的部分。\n\
  ### 实现边界上下文\n![Image](img/00007.jpeg)\n在示例场景中，整个领域被分为两个影响区域，这些区域可能指向不同部门的利益相关者的输入。甚至可能是不同的开发团队正在处理不同的需求集，并且都试图定义一段共同的领域逻辑。这两个区域有一些共同的概念。对于解决这个问题并避免产生脆弱的模型，你有几种选择：全包含上下文、共享内核（shared\
  \ kernel）以及不同的边界上下文。\n\n当业务概念跨越两个或多个影响领域时，频繁需要更改的可能性很高。因此，从可维护性的角度来看，将共享概念实现在一个分离的模块中——某种共享共享内核（shared\
  \ kernel）——是更好的选择，尽管这并不能解决实体可能承担了过多职责这一核心问题。\n总而言之，每当你识别出在领域中具有不同定义的概念时，最佳选择就是采用不同的边界上下文。图\
  \ 1-3 提供了结果模式的图形化证据。\n概念重叠在业务中非常常见，因为你找不到两个完全相同的领域。通常情况下，处理重叠概念最推荐的方法是通过不同的边界上下文。通过这种方法，你保证了每个概念都拥有其所能的最准确的实现，没有任何妥协，没有歧义，且职责恰到好处。\n\
  ### 为每个上下文配备自己的架构\n### 引入上下文映射\n![Image](img/00009.jpeg)\n#### 检查边界上下文之间的关系\n![Image](img/000003.jpeg)\
  \ 顺从关系（conformist relationship）\n#### 顺从关系与防腐层\n与顺从关系密切相关的是`anticorruption layer`（防腐层）。防腐层是额外的代码层，无论上游上下文发生了什么，它为下游上下文提供一个固定的接口来处理。\n\
  然而，在这种情况下，管理两个上下文的团队之间可以进行协商。例如，客户团队可以分享疑虑，并期望供应商团队以某种方式解决这些问题。\n### 引入事件风暴\n\n\
  下一步是找出导致每个已发现事件的原因。例如，一个领域事件可能由某些用户请求的某个命令引起。因此，`Order-Created` 事件可能由 `checkout`（结账）命令引起。在其他情况下，事件可能由某些异步发生引起，包括超时或绝对时间。在这两种情况下，你都在墙上贴一张指示原因的便利贴。该事件也可以是之前引发的事件的后续。在这种情况下，你还会在源事件附近添加另一个事件便签。\n\
  需要一个 `leader`（领导者）来引导讨论并刺激业务建模的活动。领导者仅负责管理会议、停止过长的讨论，并确保焦点不丢失。领导者还将引导会议通过各个阶段。领导者可能是领域专家，也可能不是软件专家。她的目标是帮助他人理解并形式化领域的本质。在此过程中，领导者确保生成的模型对所有人来说都是合适且准确的。\n\
  ### 总结\n比起`mirroring`（镜像）`modeling`（建模），意味着你认为关注过程是编写有效软件更直接的方式。它之所以有效，是因为它创建了一个更接近真实业务的模型，并且由于其简单直击主题而更容易管理。\n\
  *—Greg Young*\n这里的问题稍有不同：你应该通过哪种方式来识别边界上下文的软件模型？\n#### 检查应用逻辑\n##### 处理应用逻辑的灰色区域\n\
  该图展示了一个多层架构，展示层使用输入数据模型的类将数据发送到应用层。同时，展示层通过视图数据模型的类接收用于显示的数据。最后，应用层与后端之间的数据交换基于另一个数据模型的类：领域模型。\n\
  应用逻辑由一组由公共端点触发的工作流组成。端点可以通过 `HTTP` 或在进程内访问，其实现方式取决于所采用的技术栈。\n## 检查领域逻辑\n图 2-2 试图阐明领域逻辑与应用逻辑之间的区别。\n\
  给定一个业务领域，应用逻辑是解决该领域问题或满足其需求而存在的每个应用程序的用例的实现。如果你有多个前端（例如，一个 Web 前端和一个移动端前端），你可能需要多个应用逻辑部分——通常，每个前端的用例对应有一部分。尽管如此，在业务规则方面，所有的应用逻辑层都始终引用相同的领域逻辑实现。\n\
  例如，领域逻辑可能需要知道给定货币的当前汇率，但从外部服务获取该值是一个不属于领域逻辑的任务。这是因为领域逻辑关注的是如何使用货币信息，而不是如何获取这些信息。\n\
  组织分层系统业务逻辑有几种常见的模式。它们分别是事务脚本（Transaction Script）、表模块（Table Module）和领域模型（Domain Model）模式。\n\
  不可避免的是，该模式具有某些代码重复的潜力。然而，通过编码纪律，通过识别常见的子任务并通过可重用的例程来实现它们，可以很容易地缓解这一点。\n正如其名，表模块模式预示着一种更以数据库为中心的组织业务逻辑的方式。核心思想是系统的逻辑与用于持久化的模型密切相关。因此，表模块模式建议你为每个主数据库表拥有一个业务组件。此类组件暴露了端点，应用层可以通过这些端点对给定表执行命令和查询。\n\
  ### 领域模型模式\n**图 2-3** 领域模型模式的图形方案\n* *\n\n后来出现了其他支持架构，试图解决人们在将 DDD 应用到日益广泛的问题和业务领域时所遇到的问题。在本章中，我还将介绍命令查询职责分离（CQRS）和事件溯源（ES）——它们是基于消息的业务逻辑组织的基础。\n\
  特别是在 DDD 引入以及领域模型概念开始生根的时候，将该模型构建为相互关联对象的集合听起来是完美的契合。然而，最近软件行业正在重新发现编程的函数式方法。现代函数式语言越来越流行（例如\
  \ F#），函数式特性正逐步添加到现有的语言中，包括 `C#` 和 `Java`。在这种背景下，使用函数式方法构建的领域模型仍然不是主流方法，但它无疑是一个正在接受评估和实践的可行方法。\n\
  作为一个例如，你会如何考虑在同一天发生且涉及金额和银行账户相同的两次转账？它们是仅仅重复的相同操作吗？还是它们是独立发生的不同操作？可能是后者，但具体取决于取决于领域。\n\
