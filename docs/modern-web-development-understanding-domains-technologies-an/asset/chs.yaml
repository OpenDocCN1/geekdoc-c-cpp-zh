  {\npublic class SomeSpecificCommand : Command\n应用层从表现层获取输入，准备一个命令，并将命令推送到处理器。在某些实现中，这一系列事件可能意味着将命令推送到总线以进行进一步的分发。\n\
  `command processor`（命令处理器）是一种分发器，它内部包含一个处理器列表——每个支持的命令对应一个处理器。处理器只需检查消息的类型并将其交给已注册的处理器。处理器执行其工作，并按照预期的方式更改系统状态。\n\
  ### 通过消息通知事件\n```csharp\npublic class OrderCreatedEvent : Event\n    public string\
  \ TransactionId { get; private set; }\n        TrackingId = trackingId;\n```\n命令与事件交互的一个典型示例是用户界面触发了订单的结账过程。启动该过程的命令传递了订单中所有产品的详情、发货地址和客户支付详情。结账命令启动了一个工作流，该工作流通过一系列操作和事件来指示给定操作已完成。最后，当支付完成后，可能会触发\
  \ `PaymentCompleted` 事件。该事件的处理器会在数据存储中添加一条 `Order` 记录，并触发一个 `OrderCreated` 事件，让可能注册的处理器知道实际订单\
  \ ID 和交易 ID。`OrderCreated` 的处理器可能简单地向客户发送封电子邮件。\n### 引入基于消息的架构示例\n![Image](img/00016.jpeg)\n\
  在用户界面中发生的任何交互都会向系统生成某些请求。例如，在 ASP.NET MVC 场景中，这些请求表现为应用层中的控制器操作和方法。在应用层中，创建一个命令并将其推送到某些机制进行实际处理。\n\
  saga 组件看起来像是一组逻辑相关的方法和事件处理程序。每个 `saga` 都是一个声明以下信息的组件：\n每当总线接收启动 saga 的命令（或事件）时，它就会创建一个\
  \ saga 对象。saga 的构造函数生成一个唯一的 ID，这对于处理并发的相同 saga 实例是必要的。该 ID 可以是 GUID，也可以启动命令的哈希值或其他任何，例如会话\
  \ ID。一旦 saga 被创建，它就会执行命令或运行处理通知事件的代码。执行命令主要意味着写入数据或执行计算。\n\n记录事件序列是你的主数据存储。投影是你在特定时间获取的数据特定快照。事件投影就像\
  \ SQL 查询中的 SQL 投影——即你对希望返回的数据的形式化定义。\n### 将事件视为函数\n通过使用事件作为数据源，你将在存储的核心数据的抽象层级上降低了一步。从事件中，你可以构建任何你想要的数据投影。相比之下，使用经典的数据模型，你倾向于存储状态的快照，而不是从初始状态带你到达当前状态的步骤序列。通过遍历业务事件列表，你可以可以重建业务的当前状态，你也可以以许多不同的方式聚合数据以进行许多不同的分析。\n\
  一个 `event` 多多是一个带有名称和参数的函数，这些参数应用于状态并产生不同的状态。事件是 `immutable`（不可变的），这意味着一旦它已经发生并被记录，它就在那里且不再改变。正因如此，事件日志可以被复制无数次，应用于处理软件时不会有产生并发、同步问题以及业务层面不一致的风险。这是使\
  \ ES 在高扩展性场景下如此具有吸引力的关键因素。\n**图 2-8** 可能存储在数据源中的事件序列\n持久化后，事件构成了系统所发生情况的审计日志。事件可以持久化到关系型数据库中，但理想情况下它们进入一种特殊类型的数据库，被称为\
  \ `event store`（事件存储）。像普通数据库一样，事件存储持久化事件对象的列表。事件被表示为事件的普通集合。每个事件将由不同的属性集合组成，这种不规则的模式（schema）正是导致关系持久化变得困难的原因。\n\
  ![Image](img/00003.jpeg) 它作为一个只追加的数据存储器工作，不需要支持任意的更新。\n事件对象必须以某种方式引用业务对象。如果你使用领域模型模式来组织命令栈，事件存储必须能够返回与聚合实例（aggregate\
  \ instance）关联的事件流。如果你没有使用领域模型模式，你仍然有一些关键键值可以唯一地标识相关的业务对象。\n你可能想要查询发生在特定时间范围内、涉及某些数据量、或完成某项业务事务花费超过指定时间的事件。事件存储应该提供一种足够灵活的查询语言，以仅提取你需要的事件，而不仅仅是最后\
  \ `N` 个事件或给定时间之后的所有事件。\n有了数据源中的事件，你并没有现成的系统状态。然而，通过回读消息日志，你可以重建系统状态。这一方面也被称为 `replay\
  \ of the events`（事件重放）。考虑之前所示图 2-8，并尝试弄清楚事件重放到底是什么。\n事件本身没有行为，因为事件只是已经发生的事实的总结。重放事件并不意味着重复产生事件的动作。例如，重放“创建订单”事件并不意味着创建一个订单的副本。它意味着获取一个全新的\
  \ `Order` 对象，并以某种方式对其进行由于产生事件的动作而接收的所有更改。\n* *\n事件重放是一个强大的概念，因为它启用了在某些业务领域非常有用（例如金融和科学应用）的\
  \ `what-if` 场景。通过基于事件的存储，你可以轻松地重放事件并更改某些运行时条件以查看不同的结果。\n* * *\n\n单一的、全能的面向对象模型最初与\
  \ `DDD` 关联的架构。多年的经验证明，单一模型的局限性太大了，于是通过观察 Eiffel 编程语言的基本 `CQS` 原则，化出了 `CQRS`。`CQRS`\
  \ 并不是一种模式，甚至不是一个那么大的概念：它只是建议将命令（commands）和查询（queries）分开处理。尽管如此，这一简单的观察具有巨大的影响。\n\
  在书的其余部分，我将在不同的堆栈中使用命令和查询，并使用不同的编程方法来构建它们。事件和基于消息的业务逻辑也将在一些场景中演示。在下一章，我将探讨用户体验在软件系统架构和设计过程中的作用。\n\
  —林纳斯·托瓦兹*\n需求引导（elicitation）的过程一直很困难，而我在 `第 1 章`、`进行彻底的领域分析` 中讨论的作为领域驱动设计 (`DDD`)\
  \ 基础的`通用语言 (Ubiquitous Language)`模式，解决了软件项目中各种利益相关者之间的通信问题。然而，就抽象需求和规格达成一致往往是不够。当客户真正看到制品时，他们可能并不喜欢它。尽管你与客户进行了所有的交谈，他们可能已经形成了一个与你完全不同的想法。\n\
  然而，你也知道空谈是廉价的，为了给客户提供关于你将要做什么的现实视角，你应该展示一些代码。但代码的生产也是昂贵的，而且没有人喜欢编写那些可能被丢弃的代码——如果某些未在规格中明确解决的假设被证明是错误的，那就完了。\n\
  在历史进程中，许多伟大的想法最初是在某些食堂的纸餐巾上勾勒出来的。这是因为手画仍然是记录想法的极佳方式，无论是关于系统顶层架构的想法，还是操作者将用于交互的用户界面。通常情况下，客户很难解释他们想要什么，但另一方面，也不指望他们详细解释他们想要的体验。应该由开发团队抓住关键点，并从真实流程中学习，将其镜像到软件中。\n\
  我想在这里说的点是架构方面的。从架构角度来说，我敢说在过去的几十年里，我们从未应用过任何自上而下的设计方法。我们所做的都是为了从底向上构建系统。是时候考虑一种不同的方法来降低开发成本了。\n\
  在我看来，我们继续以过去至少 15 年的方式设计和构建软件。然而，在同一段时间里，发生了很多变化，不仅是在客户端和服务器软件方面，更重要的是在实际用户的预期方面。\n\
  `图 3-1` 中的饼图图展示了 1990 年的关键架构资产。大多数系统的设计方式都充分利用了图中描述的事实。\n**图 3-1** 1990 年的软件架构\n\
  今天我们生活在一个完全不同的世界里并编写软件。看看现代的相同饼图图：`图 3-2`。\n**图 3-2** 当代的软件架构\n首先，今天我们拥有数量惊叹的各种先进技术和无数客户端设备。这为软件架构师带来了新的挑战，也导致用户开始主动主导用户界面特征，而不是被动地接受所提供的任何内容。在今天，甚至在未来更是如此，糟糕的用户体验可能会变成一个严重的问题，并损害软件的声誉。我们在移动端应用中看到的现象——许多应用被下载后很快被卸载——可能会成为所有应用程序的常态。\n\
  我将在本章的后后部分回到这一点，尽管现在是进行这一重要说明的绝佳时机：用户界面（UI）不等同于用户体验（UX），尽管两者之间存在严密的联系。特别是，`user\
  \ experience`指的是用户在与应用程序的用户界面交互时所经历的体验。一个漂亮的 UI 并不意味着有一个出色的 UX。一个出色的 UX 可能很有效，但在美学方面可能缺乏某些东西。\n\
  \n\n尽管我们几年面临了所有变化，但我相信我们仍然按照过去 20 世纪 90 年代那样继续设计代码。我们对系统有了良好的理解，并构建了一个可能行得通的数据模型。在此基础上，我们构建一个我们认为足够的用户界面。然后我们去客户那里，发现我们搞错了。我们迭代得越多，软件项目的成本就越高。\n\
  然而，为了达到这一目标，我们必须开始以自顶向下的方式规划系统，将 UX 和表示置于我们关注的首位。\n\n\n\n我的观点是，对于用户来说，`UX` 比实际的\
  \ `UI` 更相关，因为后者主要是为了取悦视觉。与 `UI` 不同，用户体验在架构层面也同样重要。因为为了给用户提供客观的积极体验，你可能需要重新考虑设计步骤发生的顺序，以及分配给展示层的重要性。\n\
  大约 30 年前，图形化用户界面（`GUI`）改变了规则，开发者和用户都学会了视觉设计的重要性。直到几年前，至少在智能手机和平板电脑出现之前，设计良好的视觉界面就足以确保软件应用程序用户获得良好的体验。未来的道路表明，仅仅一个良好的\
  \ `UI` 已经不足以交付设计良好的展示层了。\n## 定义线框框和其他类似术语\n![Image](img/00003.jpeg) **Wireframe（线框图）**\
  \ `wireframe` 是 `sketch` 更精确的类型。它包含了额外信息，并专注于布局、导航和要展示的内容。`wireframe` 通常与故事板（storyboard）相关。在\
  \ `wireframe` 中，你找不到关于最终产品美学的许多细节。\n## 定义原型和其他类似术语\n当需要第二次同步时，有几个术语经常互换使用。预计提供 `prototype`（原型）或概念验证（`PoC`）可能比任何\
  \ `wireframes` 或 `mockups` 都贵得多。让我澄清这些术语：\n![Image](img/00003.jpeg) **Pilot（试点）**\
  \ `pilot` 是一个针对目标受众子集测试的完整系统。`pilot` 可以很容易地运行在测试系统上。\n## 体验关乎交互\n![Image](img/00022.jpeg)\n\
  第一次测试后，大家都很开心，应用程序被认为是完美的。但在经过几天的密集使用后，它看起来没那么吸引人了。简而言之，缺少两个关键功能，这些功能显然由于首次运行太先进而被排除。一个是选择和隐藏不需要推文的能力，以便筛选真正有趣的推文成为更容易的任务。另一个缺失的功能是隐藏已经过的推文的能力。\n\
  最后，第三个教训涉及无效功能的 `UX` 优先级排序。一个功能要么是有用，要么没用。如果被确定是有用的，就必须从开始进行规划。否则，你将至少要做两次任何工作。\n\
  本质上，`UXDD` 是一种自上而下的三步设计工作流。首先，你制作屏幕和故事板，获取用户对界面和底层流程有效性的认可和反馈。其次，根据屏幕格式化输入的输出，并构建完美匹配预期数据流的应用层端点。\n\
  ![Image](img/00023.jpeg)\n\n图 3-7 展示了一个我们可以作为讨论起点的示例，你可能在一眼就能看出来其中的弱点。尽管图中所示的线框图（wireframe）存在缺陷，但通过生成这种大纲，你能够让用户知道你是否遗漏了某些重要内容——例如，某个特定的数据聚合。用户可以立即告诉你，这样你就有充足的时间来组织后端，使那些特定数据更容易被获取。\n\
  **图 3-7** 示例线框图，用于让用户对计划中的屏幕有一个清晰的认知\n用户的体验源于使用 UI 工具完成任务。很少有任务是完全通过单个屏幕完成的。你可能会发现，仅仅查看屏幕的线框图可能无法为你提供足够的信息来发现流程实现过程中可能的瓶颈。在故事板中将屏幕连接起来是一个更好的主意。你会遇到的问题是缺乏能够轻松且有效地连接屏幕以构建故事板的工具。\n\
  ![Image](img/00025.jpeg)\n屏幕充其量只是 HTML 或仅以某种图形化方式渲染的 XML 内容。无论如何，它们都是纯静态的内容，内部没有生命力也没有动作。你可以使用表\
  \ 3-1 中的一些工具，特别是 `Indigo Studio` 和 `UXPin`，将线框图转换为真正的故事板，以演示 UI 屏幕的流程。尽管如此，有时只是第一步。\n\
  请记住，即使是最好且最受广泛认可的用户界面，在被大量使用时也可能变得糟糕。当你不确定时，可以使用一个可运行的软件原型，甚至可以在用户使用原型时对其录像，以获得他们使用你的软件时的真实体验指示。\n\
  无论分层、层、框架、数据库和技术如何，对于终端用户来说，软件系统唯一重要的就是用户界面——具体来说是用户体验和应用程序的感知速度。\n在具体技术方面，原型可以是任何为了收集早期且具有信息量的反馈而存在。它可以是一组\
  \ `HTML` 页面，也可以是一个基于 `XAML` 的应用程序。原型仅包含表示层，并使用现成数据或虚假后端来模拟某些行为。取决于你想提供的保真度（fidelity），为一组约定的草图创建线框图和原型通常只需要几天工作。到头来，这并不费精力。\n\
