  md: '# 46 CHAPTER 3: Getting Organized and Ready for Business


    # 3.1.1 Expectations


    A lot is expected from a game composer. The audio provider is often an aloof character
    seldom understood by a producer, they usually end up working alone, while one
    third of the game experience is de-lined literally by themselves. Because we can
    work off-site and at odd hours, the mystery of our creations are nervously awaited
