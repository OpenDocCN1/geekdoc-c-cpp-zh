    # 7.3.2 Setting Up Shop


    The final pre-compositional consideration rests squarely on your shoulders. You
    soaked up vast of information and now the time has come to finally make some music
    and prove to the developer that they chose wisely when they called upon your expertise.
    So, how are you going to hold up your end of the bargain?


    Plan ahead. From now through the project cycle, plan your production schedule,
    write it down, and make sure it looks reasonable. I don''t recommend composing
    and recording everything by each milestone. More often than not, it will never
    happen and fall short. Plot how many pieces of music, sound effects, and recordings
    are needed for each block of the production, decide how much time you''ll need
    for each task, and map out your schedule. Based on your working model, you can
    see rapidly if you have a snowball''s chance in hell of completing everything
    on time. If not, approach the developer and let them know you may not have enough
    time — instead of dropping a bomb on the day before your work is done.


    As part of your production schedule, be sure to set aside time for mental breaks,
    which is always half day, half week, whatever — just do it. Living with a piece
    of music every day can quickly zap a musician of any objectivity. By being able
    to pick up on parts which don''t work and have fresh ideas ready to go. Get out
    of the studio, out of the house, change your scenery so often. When it is tempting
    to immerse yourself in work, and light projects have a way of pushing you to that
    limit, understand what a couple of hours can do for your mental well-being and
