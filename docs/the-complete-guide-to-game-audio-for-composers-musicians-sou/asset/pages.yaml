    # 12.6 Conclusion


    There tends to be a stigma attached to hiring outside, 3rd-party contractor. It
    is a highly unnatural act to search beyond company walls after you''ve spent a
    tremendous amount of time and effort collecting and nurturing your talent. But,
    even these seem need to look elsewhere on occasion — when a flood of work drains
    your staff or when everyone goes on vacation at the same time.


    Much can be argued regarding in-house audio talent and contractors. If you have
    the financial resources to pay someone to staff your audio department, despite
    not having enough work to keep them busy; these particular bragging might become
    expensive. Hiring outside only when there is work to be done can make sense. Some
    large game developers have recently let their in-house staff go for this reason.
    It often cheaper to hire a contractor as are needed rather than have someone collecting
    a paycheck with no work on their plate.


    Artists are more creative in the worlds that they have designed for themselves.
    Avoiding a 9-to-5 schedule lets them budget their time and when they are at best.
    Their happiness and security can be heard in their much inspired work.


    Working with these type of people is no different than coaxing excellence from
    your other team members. Graphic artists, programmers, composers, sound designers,
    actors, and voice talent are all looking to you for the proper motivation and
    mothering, though the audio contractor is not immediately within the corporate
    view, they respond to the same stimulus as well.


    Even though there are no hard and fast rules, no secret formulas, and no prescribed
    methods for creating the consummate assemblage of audio for a game, it can happen.
    It takes fluid communication and a firm vision from the development team, coupled
    with an audio contractor who shows no bounds to their creativity and patience.
