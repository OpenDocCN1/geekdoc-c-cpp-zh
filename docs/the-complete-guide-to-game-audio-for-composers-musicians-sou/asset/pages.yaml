    such as the muttering and “mayday,” using a touch of EQ to increase the higher
    frequencies, just enough to be able to understand what’s going on. For the pilot’s
    emergency transmission, EQ out the lower and mid frequencies to give it time,
    radio quality. You might even have a preset for this effect. The artist has discretion
    to use any other processing, like slight reverb perhaps, or a hard flange for
    the tail end of the explosion just for fun. Save the file. Yeah, I know; I keep
    harping on this but the first time your system crashes and you lose two hours
    of work, you will become a believer.


    Building a complex sound effect in the multi-track environment is fairly simple.
    Once the sequence is tweaked to perfection, save the work as a “mixed” file for
    further processing. This process renders the multi-track sequence into a single
    sound file which will then be manipulated. From the audio editor, open this mixed
    file and run through the checklist we were introduced to the first sound effect
    example.'
