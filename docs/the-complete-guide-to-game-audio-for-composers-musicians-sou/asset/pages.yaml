    **Remote recording:** A really long microphone cord


    **Sound effects libraries:** Sound Ideas, BBC, my own collection


    Don''t be intimidated if you are outnumbered at the meeting. Thinking of it as
    a summit between all the team members, working together to solve certain issues.
    This mindset will keep you away from looking at it as an adversarial confrontation
    and let you work towards the common good of both parties. There will be occasions
    when a developer may try using this intimidation factor — to keep you from asking
    for too much and digging into their bottom line. You''ll have the upper hand inserted
    with this way of thinking.


    There will be when carrots are dangled before you, certainties designed to get
    you to sign the contract without adding your points to. Be on the out-look for
    these and when feel like you were pushed into "buying something" from an aggressive
    salesman type. When you feel pushed, back off with the ball in your court and
    slow the process to a more formidable one. One thing I will *not* say something
    I haven''t been able to fully review. Once had a game developer''s lawyer fax
    me a contract with the instructions to "Sign this and return to me ASAP." The
    red flag went up, I told him I needed a few days to review it with my legal department
    and we ended up arguing about tape copyrights. Turns out, he knew nothing about
    copyrights and was a real estate lawyer who was helping out the developer and
    wanted me to sign a document which would give his company full ownership of sounds
    I had licensed from a sound effects library! He didn''t understand the concept
    that I could used sounds as part of my work and sell the final product to. Don''t
    be forced into something you aren''t totally comfortable with. While it may be
    a big company, with huge financial backing, your company is your life''s bond
    and everything you agree to has a direct effect on its well being.


    Here is another. Let''s say I felt strongly about earning a bonus after the game
    goes well and they say "no" that one, there will be no psychological effect on
    me. The negotiations are over. If I brought several points to the table, it is
    nearly impossible for a decent human to say "no" to every single one of them.
    Even if they try, while they will realize they are beginning to sound like parents,
    saying "no" without good reason.


    Experienced salesmen use this trick everyday. They know you will say "no" at least
    five times before you start to waiver and eventually begin to say "yes." That''s
    when they sweep in for the kill and make the deal. There have been studies done
    on this very phenomenon and I have experienced myself that at car dealerships
    and in other high-pressure sales situations. "trick" is to turn this around and
    use it in our favor.'
