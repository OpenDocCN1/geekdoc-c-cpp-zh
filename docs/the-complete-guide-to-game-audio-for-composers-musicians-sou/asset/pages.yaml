  md: '# 14 — CHAPTER 2: Essential Skill Sets and Tools


    Your passion and drive will certainly be enough to get started, but no matter
    how much you already know, or think you know, there will always be more to learn
    along the way. Always remain receptive to new ideas and concepts. Technology improvements
    are rapid and by keeping up with the latest, put yourself in a good position to
    take advantage of it. It''s always to say "Yeah, I''m familiar with that," rather
    than admitting your ignorance. Sometimes it can mean winning or losing a contract.


    # 2.1.2 Business Sense


    As the one man show, you can expect to wear many hats: the composer, musician,
    engineer, producer, technician, sound designer, voice talent, salesman, marketing
    director, secretary, accountant, janitor— wait a minute! Where did the music go?
    Unfortunately composing music and sound design comes into play less than 25% of
    the time and maybe only around 5% if you are just starting out. You have to remember
    you are in business; you are selling a product and all the rules and strategies
    come into play. Being successful means business savvy and remaining focused on
    your "product." Until you have attained success and have a staff of assistants
    to provide your business needs, you will not be able to sit at your piano and
    write. Then again, who wants to do all the time anyway? A hard work and dedication
    to your own craft makes your efforts even much more rewarding. Take some time
    and study how a business operates and you''ll be miles ahead of anyone who muddles
    through it blindly.


    # 2.1.3 Marketing


    Another critical, absolutely unrelated to creating audio, is the ability to market
    yourself. It doesn''t matter one iota if you were a child prodigy, mastering every
    instrument before you were 8-years-old, and have the abilities of a world class
    if no one knows you exist. You can''t just open the doors to your business and
    expect customers to flood into your studio and the phone to ring off the hook
    — unless you spend some time beforehand, making sure the right people are aware
    of your product. And once they know about you, make sure you properly entice them
    to buy your product. This is all part of marketing.


    Marketing is as old as business itself; the more you know, the more work you will
    have. You will find yourself spending a majority of your time planning and implementing
    ways to get customers in the door, constantly changing strategies and ideas as
    you go, searching for the most effective method that brings in the most money
    for the effort. And you thought you were going to spend all your time composing
    and sound effects! This too can be an exciting challenge. There are very successful
    people who specialize in marketing and it may seem overwhelming to you. But once
    you get the hang of it, it becomes second nature and lots of fun.


    Later in Chapter 4, I''ll spend more time on this subject with very basic marketing
    concepts and strategies geared towards your efforts in the game. If you can''t
