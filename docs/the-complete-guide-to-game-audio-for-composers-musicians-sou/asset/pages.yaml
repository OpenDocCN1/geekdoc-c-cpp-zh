- img_proc: true
  md: '# CHAPTER 3: Getting Organized and Ready for Business


    As you build your local talent pool, establish what their per hour or per session
    fees are and do the appropriate math. It will vary by area, as major cities and
    music hubs demand higher rates than those in out-of-the-places. A reasonable per
    session rate would be between $250–500 for mid-level performers in major cities
    where talent is in demand. Less prevalent talent can charge $50–200 per session.


    If you choose to charge for your musicianship or voice talents, select an appropriate
    fee which will keep you competitive. Again, because you are the creative entity
    and a one-man-show, you can get away with smaller fees to get the business. Many
    times, I''ve been told the big guys were just too expensive. Find your niche and
    price accordingly.


    # Media and Material Costs


    Tapes, floppy discs, recorded CDs, shipping, and any other costs incurred while
    recording and delivering the final product are covered in this fee.


    Any material you use in the creation process needs to be discovered for out of
    pocket expenses. Everything from your medium to the stamps you put on the envelope.
    If you had to buy it for the project, you need to know the cost and ensure it
    is covered in the fees. Leaving this will chip away at your profit margin. A 100%
    markup is not uncommon for tape and CDs when figuring it into a bid package.


    # Hourly Wages


    The hourly wage is a unique formula calculated using the sound creator''s salary
    requirements based on the available billing hours for the year, the cost of healthcare
    and other benefits, vacations, holidays, and retirement. Because we don''t work
    for a regular "company", this fee is our actual wage.


    After vacations (you''d like to take), sick time, and the hours of administrative
    duties running your business are factored, roughly 1,000 hours per year are available
    to bill for your creative work. If you want to make $50,000 a year, you''ll need
    to charge $30 an hour. After taxes and company benefits such as healthcare, you''ll
    charge 30% more or roughly $40 an hour to clear that same amount. This is a fairly
    example of what you might find others charging. Insert your own figures to see
    what you should charge.


    # The Kicker


    Also known as the "fudge factor" or "margin of error," this is an additional fee
    to cover any unexpected problems or minor adjustments to the project. Because
    the game development process is a continuously evolving one, additions are common
    place and these fees allow them to be included without having to renegotiate the
    entire project. Reactions to the kicker are varied, but time saved from having
    to renegotiate a contract is priceless and it is always more palatable to charge
    less than to charge more. If the project happens to expand outside of the original
    borders, renegotiations will be necessary. 15% is generally a good figure to use.'
