    might be happening the inside walls. They normally care about programming and
    graphic artist positions and may keep an eye on you yourself if you ask nicely.
    They literally live and die by the effectiveness of their networks and are always
    anxious for any leads. I once offered a small startup company to a headhunter
    (I asked permission first, of course), mentioning they were looking for an artist.
    In turn, I was rewarded with several names and numbers of local game producers.
    They understood my needs and we were able to share contact details. Because you
    are there everyday looking for your prize, circulating of such good information
    with the right people could open doors. Of course, always ask permission from
    the company before you unleash a headhunter them and never share privileged information
    or articles covered by a non-disclosure agreement. You can find these companies
    after a brief Internet search or in a phone book under Employment Services or
    Recruitment.


    # 4.2.6 Networking


    Starting from day one, every person you come across has the potential to lead
    a paying contract, whether they are a programmer, tester, artist, producer, receptionist,
    or even the janitor. Other game composers and sound designers, although considered
    as competition also, can be part of your network and lead to some work as well.
    By cultivating friendly relationships you''ll be privy to information on jobs
    and companies on the "outside" do not'
