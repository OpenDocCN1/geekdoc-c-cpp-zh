    # 10.2.1 Check Mixes on Several Systems


    Before any final sound effects are delivered to the developer, it is a good idea
    to listen to them on different systems and different speakers. This will check
    the integrity of the audio across a wide range of possible playback systems —
    whether it''s a cheap set of multimedia speakers bought from a swap meet to a
    full-on,$10,000 theater surround sound system. The options are infinite and you
    want to have the confidence your audio sounds good on all of them. Play back at
    different volumes, from very soft to loud as the neighbors can stand. Listen for
    an even mix in each cue or effect. Make sure the low-frequencies don''t distort
    and the high end is present and not overpowering any setting. If all of the audio
    sounds good on the various systems and settings, they''ve passed the test. If
    not, fix them.


    # 10.2.2 Check Your Sounds in the Actual Game


    This sounds obvious, but more often than not, the sound person gets left out of
    this final step. If you''re able, listen to the audio in the game. If not, make
    sure a trusted member of the development team, with audio experience, is there
    to perform this crucial assessment. Actually believe this to be the most vital
    phase of the production cycle. Most composers, sound designers, and programmers
    insert the audio guru listen to to sounds in the actual game — typically happening
    around time the game goes into. At this point, effects and music should be in
    place and the sound team should sit down and study their audio. It''s not uncommon
