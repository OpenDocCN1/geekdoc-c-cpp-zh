    Before sitting down to write a game score, there are a few points that should
    be defined. These pre-compositional technical considerations will identify the
    direction you will take to compose — whether it is a full DVD-ROM, surround, orchestral
    score or a simple melody for a GameBoy title. As touched upon in sections 7.2
    and 7.3 of the previous chapter, knowing all the details in advance, before you
    write a note, will help prepare you for the challenge ahead and save any false
    starts.


    I have made many references to the importance of communication, especially when
    working as a contractor. By asking the right questions, it will be clearer in
    your mind, you will be able to hit the mark first time, and it will make you look
    how much better in the developer''s eyes. After all, you don''t want them looking
    anywhere else for their music and sound needs.


    Many of these concerns may already have been addressed through the bidding process
    and previous discussions with the developer. Never assume all is constant; double-check
    to make sure for further modifications as the production continues. I worked on
    a game where the final cue was changed from MIDI to audio at the last minute.
    Not a terrible change, but it would drastically changed the way I approached the
    piece if I''d known about it earlier.


    # 8.3.1 Which Platform Is the Game Being Developed For?


    Secrecy is a huge issue in the billion dollar games industry. There have been
    times when I didn''t find out what game was being developed until the last minute.
    Developers are wary of outsiders and are rightfully afraid to give any hints of
    future game releases. Sometimes, even after signing the Non-Disclosure Agreement,
    they will remain tight-lipped until they feel comfortable releasing information.
    I guess it just goes with the territory.


    It is important that you, the composer, know what system the game will play on
    as far in advance as possible for many obvious reasons. A Nintendo is not a Playstation
    is not a CD-ROM game — they are all completely different systems with different
    constraints and methods of addressing audio issues. If I was doing a GameBoy title,
    I wouldn''t go out and hire musicians or a full orchestra. That would be insane!
    for a Playstation 2 or CDROM game because the chances of using direct or streaming
    audio are good. GameBoy and Nintendo 64 don''t utilize the audio and the composing
    process is farther.


    # 8.3.2 What is the Playback and Delivery Format?


    You cannot compose a masterful score without knowing the delivery and playback
    formats. The platform a game is developed for will give give a good indication
    of what type of playback system will be used. Console games will be played through
    a TV or home entertainment system. CD-ROM or internet games will be played through
    either a desktop or laptop speaker system. Arcade games will use a customized
    system.'
