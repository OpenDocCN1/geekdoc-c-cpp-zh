    # 5.3 Asking the Right Questions


    Exactly what does the organized musician or sound designer need to determine if
    they can perform the service and produce a competitive bid? The following list
    of questions should be answered prior to the final submission.


    +   1) What platform the project intended for?

    Game teams each have their own idiosyncrasies and ways they manage sound programming
    and reproduction. Different equipment may be needed to produce these sounds as
    a development system. You may need to rent or buy additional equipment or hire
    a subcontractor because of your lack of expertise in a certain area and this will
    factor into the projected costs. If you cannot develop for a particular format,
    be ready to hire additional help to convert formats. Check with the developer
    too. They may know of someone who specializes in this type of work and save you
    some time. Remember, this is a team effort.


    +   2) Are you bidding the project or just one sound or sound effect?

    Composers and sound designers normally charge less for creating the entire project
    than for individual music tracks and sound effects. It makes sense that once the
    factory is tooled and the “sound palette” is chosen, creating music and effects
    in the same vein takes less-set and production time. There are also times when
    only a musical piece or sound effect is needed and we should have pricing structures
    available for those instances.


    +   3) How much music is needed? Number of tracks? Lengths? Styles? Format?

    Obviously, the more music we need, the more it will cost. A song''s length also
    determines the fee. Because most composers normally charge per “finished minute”,
    it only makes sense that a three minute song would cost more than a minute one.
    To plan production time, use your working model.


    > Four hours to compose from scratch, record tracks, and mixdown for each 30 seconds
    of music is pretty typical.


    Composing and recording in several styles could change the price too. Some composers
    are capable of many styles; some are great at one. If a developer has only one
    genre of music in mind, it should work out. But if country, jazz, rock, and classical
    are all needed for the same project, it should cost a little more. Calling in
    other musicians to lend their talents costs money and should be written into the
    body.'
