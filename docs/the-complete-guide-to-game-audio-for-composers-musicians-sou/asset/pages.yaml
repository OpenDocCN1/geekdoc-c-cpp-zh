  md: '# Determining Your Costs — 67


    Here’s an example of a typical cost analysis for a basic project studio set-up:


    | Monthly equipment payments: | $1000 |

    | Electricity: | $40 |

    | Maintenance: | $50 |

    | Phone: | $30 |

    | Internet: | $60 |

    | Insurance: | $30 |

    | Total: | $1210 per month |


    Divide this total by the number of billable hours per month. This is based on
    a standard 40-hour work week, although you can work 16 hours a day very easily.


    $1210 divided by 160 hours = $7.56 an hour

    Or another way to think about it: $60.48 per day


    If you are working 40 hours a week, five days a week, making money on billable
    contracts, this would be what you need to charge to cover your studio costs. Not
    everyone works that many hours on projects so you will, obviously, for less studio
    time. I just want you to start thinking along those lines.


    As you determine the fees for your studio usage, be aware of this. By working
    out of your house, using your own project studio, you can substantially effect
    the costs of studio time by keeping it lower than any professional studio. Because
    your services competitively and pass along the savings to your clients. As you
    start out, incentive to the smaller game developers will be your lower costs —
    they hope to get pretty music for much lower than they have. A perfect place to
    start as you build your resume.


    Consider a price range between $15–50 an hour for studio time — our example working
    one week and two out of the month. We want to play conservatively and make sure
    we recoup our costs. If you work one week out of the month on an audio starting
    out, you are doing pretty good. Add 30% as your profit margin and the figures
    change to $20–40 an hour.


    # Talent Fees


    The actual performances by musicians and voice talent are included in fees. Some
    music composers may charge to play instruments on the tracks, others will include
    their part in the creative fee. Figures will vary based on the caliber of talent
    requested and outside talent, therefore virtuosos or famous players will increase
    this price accordingly.'
