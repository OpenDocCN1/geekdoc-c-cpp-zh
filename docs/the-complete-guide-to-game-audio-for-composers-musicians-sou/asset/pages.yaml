    For instance, sound of tires squealing can have a wide range of emotions attached
    to it. I''m sitting at a stoplight and hear a tree screech close by, my first
    reaction is, an accelerated heart rate, and a quick look around to make sure I''m
    not about to get hit. I see it as of teenagers peeling around a corner, my emotion
    to anger at their reck. But, if the light turns green and all at the intersection,
    I mash my foot on the accelerator and smile as the tires tight to grip the pavement,
    I feel exalted as I return to my younger years. The sound, three different emotions.


    Sound effects in games serve many functions. Primarily, they are a method of aural
    feedback that simulates what you would hear if you were actually in the game.
    If I shoot my weapon and it''s not empty, it goes "bang" instead of "click." If
    I hit something with it, it goes "thack-oomph-'
