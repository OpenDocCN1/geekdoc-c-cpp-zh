    # 8.1.8 Loops


    When physical storage space, processor speed, or RAM is a factor, efforts will
    be made to save space wherever. For audio applications, the best ways is to achieve
    this goal is the liberal use of music loops. A music loop can quickly load into
    RAM and repeatedly placing further demands on the processing pipeline. Gameplay,
    menu screens, and finale screens are perfect places for this type of music. Because
    it is difficult to predict how long a particular screen will be active, music
    with the capability of continuous repetition works great. Developers may also
    use “loopable” cues as a cost-saving method. Less music equals less to pay out
    and cost-conscious businesses are always looking at the bottom line.


    As a composer, loopable cues are not difficult. The only real secret is finding
    the perfect spot after a bar or measure to abruptly cut off the music, enabling
    it to seamlessly blend again. A little trial and error and quick, imperceptible
    fades are effective in the audio editing environment. Various loop software programs
