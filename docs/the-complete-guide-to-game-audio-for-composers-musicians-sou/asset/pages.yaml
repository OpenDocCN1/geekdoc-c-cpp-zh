    # A note on embedded audio


    Don''t use embedded audio on your web site. If you use it in the context of a
    flash presentation, that''s different and perfectly acceptable. The audio I''m
    talking about is MIDI music or .wavif files which play in the background while
    everyone borrows yours.


    First off, not everyone has the plugs-ins on their browser which play back the
    type of audio the other end. Secondly, if they did, there is no guarantee of the
    quality which spits out the other end. I know, we do audio. We want people to
    hear it and why not have it on our web sites? I''d rather have nothing than something
    that could lock up someone''s browser or just sound horrible. MIDI music is very
    prone to sounding like garbage. It sounds great on the computer it was composed
    on, but the various sound cards out there almost guarantee it it won''t sound
    the same on someone else''s. Don''t use embedded audio and save yourself some
    embarrassment and some business.


