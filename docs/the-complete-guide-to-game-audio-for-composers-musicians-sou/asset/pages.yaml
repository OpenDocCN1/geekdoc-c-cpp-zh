    # Contract B


    This next contract example is the our mutual friend, Tommy Tallarico, has been
    kind enough to share. Skewed rightfully in the game composer''s favor, it is full
    of all the appropriate paragraphs which cover the interests of composers who wish
    to retain rights and obtain bonuses or royalties for the success of the game.
    The majority of the time, large game companies have their own agreements drawn
    up and seldom entertain a composer''s contract, again because they want their
    interests protected. The workaround is to use paragraphs and wording when introducing
    your points to their contract. By all means, present this kind of contract to
    them first.'
