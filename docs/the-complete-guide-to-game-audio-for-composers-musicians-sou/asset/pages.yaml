    time.” Additional benefits, such as health coverage and paid vacations can offer
    carrots in front of you.


    Relentlessly looking for work can drain the hardest of souls. By working inhouse,
    all of your creative efforts can be focused on your music and sound creations.
    Often, while working as an independent in the middle of one project, you will
