    +   - give you the knowledge to take the gaming world by storm.

    My experiences have given me a certain view of this unique industry and this is
    what I intend to share with you. If I can provide the assistance to hit the ground
    running and save a couple years in the process, my objectives have been fulfilled.
    So, sit down, hang on, and enjoy the ride.


    # 1.2 The Bleeps and Bloops of Yesteryear


    In 1971, video games made their grand entrance with the game ‘Computer Space’.
    While it wasn''t well remembered as now, society took to this new form of entertainment,
    plunging down stacks of quarters at a time. A year later, Atari’s Pong, took its
    place in history. This console game was unanticipated by today’s standards; its
    few sounds were simple, single tone, electronically-generated bleeps. Atari’s
    home entertainment offering in 1975 brought ‘Pong’ into our homes, but it wasn''t
    until 1977 that the Atari 2600 game system brought a slightly improved presentation
    of sound.


    As the thirst for these games grew, so did the technology and the search for increased
    stimulation was into high gear. Various methods and audio processors were able
    to satisfactorily satisfy the game player and keep them coming back. In 1979,
    Mattel presented the Intellision system, Atari answered in 1982 with their 5200
    platform and a dedicated audio processor called Pokey. The Pokey chip used four
    separate channels controlled the pitch, volume, and distortion values of each,
    allowing a four-piece virtual band to perform for the first time.


    From here on, almost every new game system had more audio resources to draw from.
    The original Nintendo Entertainment System (NES) in 1985 used five channels of
    monophonic sound. Sega’s introduction in 1986 produced triphonic generators using
    four octaves each into the ring. By 1989, the NEC Turbo Grafs brought six voices
    with stereo output audio. At least, we were getting to enjoy some music and the
    sound as it was meant to be. Audio processors continued to improve, adapting synthesizer
    chips, 16-bit processors, more voices, more memory, better compression and decompression
    algorithms, and even internal effects processors.


    But far away the consoles and dedicated gaming platforms, the personal computer
    was beginning to show its potential. Initially, the sound quality was no better
    than the early console games — the generated bleeps played through an even more
    horrendous internal speaker. Memory space was always an issue and the considerations
    for audio were last in a very long line. As a response to the almost hopeless
    situation, sound cards were developed with small synthesizer chips built in which
    allowed small message files (encoded with triggers simple to roll on a player
    piano) which told the data sounds to play and when to play them. The sound bank
    consisted of 128 sounds with the capability to play a total of 16 notes at a time.
    This use of the MIDI (Musical Instrument Digital Interface) standard gave some
    hope. The tinny, cheesy sounds that early cards produced were a far cry from the
    real thing, but at least the'
