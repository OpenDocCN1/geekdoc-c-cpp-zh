    to your terms. They shouldn''t have a problem spreading the wealth to the people
    who helped the game a success, and as a composer and sound designer, you are responsible
    for 1/3 of the total game experience. Good businesses appreciate the contributions
    from the creative team and reward them accordingly. Others, more concerned with
    squeezing every bit of profit from a game, will be less likely. If you have the
    misfortune of running across the latter type, you will have to work much harder
    knowing you are deserving of more compensation. If it becomes a heated contest,
    then consider walking away from the deal, because at this point, it has all the
    signs of a rocky relationship and no money in the world would be worth.


    Royalties are not so common so the path of least resistance would be structured
    bonus payments. Instead of requesting a percentage of your income from the game,
    which becomes complicated back in their accounting department, suggest bonuses
    based on the number of units sold. All you have to keep track of how many of the
    damn games they''ve sold and if it has passed your negotiated milestones. Simple
    enough, and this money is from incoming receipts and purely based on sales figures,
    they are assuming risk and will lose nothing if a game doesn''t tell well.


    To establish your bonus structure, you need to know your break-even point and
    set your first installment at a comfortable level above it, say 75% to 100% more.
    As an example, if a game''s break-even point is 60,000 units, which would be acceptable
    to accept for a $10,000 bonus after 100,000 units sold, $20,000 after 200,000
    units, and so on.


