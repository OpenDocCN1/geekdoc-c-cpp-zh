  md: '# 16 — CHAPTER 2: Essential Skill Sets and Tools


    # Creativity/Compositional Skills


    Never written a song? Then this might not be the business for you. Game music
    is designed to create a mood and audio "feel" for the accompanying virtual world
    it is something you should be able to pinpoint exactly within the first couple
