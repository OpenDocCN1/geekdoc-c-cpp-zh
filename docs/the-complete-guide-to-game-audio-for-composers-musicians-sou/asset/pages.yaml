  md: '# 216 — CHAPTER 8: Creating Music for Games


    # Sound File Clean-up


    From your audio editing program of choice, open the music file to be edited. It
    is a good idea to save the file you are about to work on under another name like
    “music file new” or “music file 2.” That way, the original file is left untouched
    in case something goes wrong and you need to revert to the beginning.


    The first plan of attack is the dead air on the front and back of the file. Give
    it a listen. Do you hear any background noise? If it is prevalent, highlight the
    space and let your noise reduction plug-in analyze and process the rest of the
    file. If you don''t have this feature, fear not. If you recorded the sound at
    a good level, and if it isn''t a quiet piece, most of any noise floor should be
    masked away. Trim off the dead space from both ends being careful not to cut any
    of sound wave. Use the zoom feature to see exactly where the sound begins and
    ends if you need to. This process will ensure the file is as small as possible
    and so the music plays immediately after it is triggered, no silence first. Save
    the file.


    # Visual File Inspection


    The premiere feature of audio editing software is the ability to “look” at the
    music. By visually inspecting the file, you are able to actually see noise, peaks,
    and clipping to get a good idea of the overall quality of the sound. What should
    you look for specifically?


    Is the sound centered on the zero baseline? The line that runs through the middle
    of each channel is known as the zero baseline. If there are electrical matches
    between the sound card and input device, it can cause the sample to be centered
    above or below it. This can cause unwanted artifacts that you''ll need to get
    rid of. The DC Offset function will analyze the file and re-center it to keeping
    the file clean as possible.


    ![](img/34a845a3c9f2c249ab60e8ba2e1b7e3b_229_0.png)


    Figure 8.5 This example shows a horn sample slightly above the zero baseline.
    While this is normal for horns, it illustrates something to be on the look for
    when dealing with other sounds.


    Does puffy little lines barely perceptible until you zoom in? It is important
    that the actual sound is louder than any noise floor in the recording and louder
    than the noise on any playback system. If the volume is at least medium intensity
    or thereabouts, you can beef it up by either increasing'
  merge: -1
  pgno: 229
- img_proc: true
  md: '# Editing Music — 217


    the overall volume manually or using a normalization function. Normalization will
    scan the file and increase its overall gain, set by you, without clipping. This
    will maximize the volume proportionally leaving a strong, solid sound.


    # Does the sound look too intense?


    Has the waveform saturated completely? If the sound file showed a solid wall from
    the zero baseline to infinity, with the edges of the sound cut off, chances the
    file will be distorted and totally lack any dynamics. Depending on the effect
    you are trying for, this may be right, but the majority of the time, you''ll need
    to give something else a try. A first attempt to reduce the overall volume or
    apply a moderate amount of compression. If the peaks are severed, peak restoration
    plugins are available to repair this type of damage. Listen to the results and
    decide if it sounds any better or if you simply reduced the volume and applied
    “band-aids” to a distorted sound. In that case, re-recording the sound will be
    your only option — just be to do it at a level couple of notches below the previous
    attempt.


    ![](img/34a845a3c9f2c249ab60e8ba2e1b7e3b_230_0.png)'
