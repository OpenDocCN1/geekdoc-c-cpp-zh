- img_proc: true
  md: '# 166 CHAPTER 7: Setting the Stage


    For example, if I were to tell you to write a song and the only direction I gave
    was “Make it red!” — what kind of music would you compose? I envision a searing
    bright red color, an upbeat, fiery, metal piece with blazing guitar solos and
    impassioned vocals. Maybe you see a dark, scarlet red sexy, slow jazz number,
    with hot saxophone lines and piano that would tear your heart to pieces. What
    do I mean? By learning what this person tick, you will have a better chance at
    knowing what they really mean. Use all of your senses and ensure the translation
    is pure.


    Is your company liaison hands on or hands off? Some will want to be a part of
    every step of the creative process, which means they need to get their OK for
    everything. You’ll create musical “sketches,” letting choose which ones are closest
    to your vision. Once they’ve approved them, you’ll flesh them out to their final
    versions, submitting them again for their OK on instrumentation, arrangement,
    length, volume, and EQ. You’ll keep them until they are perfect. Many versions
    of ideas will be offered and you’ll pick the ones that are closest and you’ll
    work until they are perfect as well. The “hands on” types are a little bit high,
    highly passionate individuals who live and breathe a project, taking their role
    seriously. Some manage to the point of interfering with your creativity; others
    genuinely care that the project be the best and have their fingers in every aspect
    of it. Their name is on the product and your future in gaming is the true motivator.


    “Hands off” individuals work differently. Because of their need to be in hundreds
    places at once, they are more comfortable delegating and letting providers “do
    their thing” without much interference. They will set the scene for giving you
    all the proper adjectives, and let you create audio using the expertise they are
    paying for it — these types of individuals understand — through years of experience
    or their lack of it — they are incapable of doing a good job at anything. Instead,
    they go with their strength in leadership and put faith in you. It puts a lot
    of pressure on you to perform brilliantly, but don’t worry. The “hands off” type
    appears to be laid back, underneath they are just as passionate about the success
    of the project as the next you; they just go it differently. They will keep the
    atmosphere freely and let you set your own hours and working methods, as long
    as milestones are as promised.


    Most of your company contacts will be somewhere in the middle of the previous
    extremes. Which one is the best to work for? It will depend on your personality
    type and what you need to prepare an inspired atmosphere. The “hands on” folks
    keep you on toes, pushing you to do the best work you’ve ever done. They demand
    a lot, but the rewards gained by your astonishing audio will make it worth it.
    “Hands off” people will give you all the room and support you need to fulfill
    your vision of the project. They will protect you from the outside world, placing
    you in a cocoon, enabling you to give 110% and to take advantage of inspiration
    as it strikes. This person may have let you create on your own, letting your work
    brand untouched, they are just as responsible for the final masterpiece.'
