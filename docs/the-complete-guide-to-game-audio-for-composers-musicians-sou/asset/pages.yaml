    the musicians?! Seriously though, there have been times when people have to come
    to me with a very complete style they have in mind, “Can we have the rhythm section
    of Prodigy, the sounds of The Chemical Brothers, the feel of Inch Nails, oh and
    the guitar sound of Waylon Jennings?” Most of the time, they give me the project
    and say to what you think is best. I give them my ideas and if they like them,
    they hire me; if they think or feel that I’m way off base, then they don’t say
    that hasn’t really happened too much. Usually the companies will give me stories
    of the game or other music CDs that capture the style they would work. The best
    is when I can sit down and play the game with no music and figure out what I think
    the best style for that particular level.


    When do you have to be most creative? I set up my studio in my house. All the
    guys who work for me also have been set up at their own places. This allows us
    all to work on our staff whenever we want or feel like. For the most part, though,
    nighttime times to be the most creative productive for me.


    What skills do other composers need to get into the game business? Can you share
