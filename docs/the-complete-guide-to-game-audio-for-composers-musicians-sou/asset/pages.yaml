    # GAME COMPOSERS AT WORK


    Kevin McMullan of Ensemble Studios


    Do you follow a specific thought process scoring for a project? Ultimately, game
    music must support, and not stick out from the game itself. Therefore, the most
    important thing to do before jumping in a project is to learn and understand the
    design of the game. Once you have achieved this, you work up a concept and design
