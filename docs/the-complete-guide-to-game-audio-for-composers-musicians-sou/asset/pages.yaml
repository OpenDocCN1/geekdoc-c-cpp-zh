    # 8.8 Conversions


    The music file is almost complete and ready for delivery. If the developer requires
    a 44kHz, 16-bit stereo uncompressed audio file, we’re done because that’s what
    we (at least) working. If you are to be working in anything higher, follow the
    next steps to accomplish the conversions in the same manner.


    The developer in this requested a 22 kHz, 8-bit mono file so we’ll need to do
    couple of things. Using a copy of the last version of the music file, resample
    it to 22 kHz using the editor’s resample function. Ensure the anti-aliasing filter
    is used to prevent any of the lost high frequencies from becoming frequency distortion.
    This will keep the sound file as pure as possible. Keep in mind that higher frequency
    ranges are not represented at lower sample rates and the sound will change. Listen
    to the file again after downsampling and EQ to boost the sounds are necessary.
    Remember that the higher frequencies will not be available.


    The next step is to convert from 16-bit to 8-bit resolution. Selecting this feature
    on your editor should give choices such as: truncate, round, or dither. Try each
    choice and listen to the results. You should be concerned with the introduction
