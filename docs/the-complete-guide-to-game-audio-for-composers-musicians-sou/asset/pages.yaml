    in the cockpit. Most of these sounds are being processed by filters and a bit
    of distortion. I had to create a "G" effect (heavy breathing in a "over G" situation)
    that sounded just like you were hearing yourself over the headphones — the sound
    being in the same mid-range area. I didn''t want to repeat the same software treatment
    as in the radio connection because it''s a bit different and it''s better to avoid
    a crunchy mid-range overload. I decided to record it."


    "I made a heavy breathing sound and listened to it. It sounded oddly like sex.
    Every detail of the breathing was so clear and it was not even; it was full, of
    "ahhhhhhhhh and "fiffs." There was nobody else to replace my girlfriend and we
    all know that fighter pilots are males. Staying away from the mic and the other
    tricks didn''t work, it was no dynamic to match what I tried. So, I closed the
    tube in the closet to create claustrophobic air pressure and I brought a long
    plastic tube (1/2 meter) and connected it to the mic. The plastic tube acts as
    a natural band that creates the illusion of distance. Now, if someone was looking
    through it looked dirty but perfect. The breathing was far away but still close
    and sounded filtered but not software generated. The "resample" to 22.5, plus
    some fine-tuning tricks, it made sound right."


    Experience, and the willingness to leave the studios in awhile can lead to some
    fantastic sound creations. These guys are at the top and only climbing higher.
    I can''t wait to hear what they have coming up next.


    # 9.8 Presenting the Final Work


    Now that you''ve spent a great deal of time creating these fantastic sound effects,
    it''s time to make delivery to the client. It is not just a simple matter of sending
    a CD or emailing the sounds and saying, "Here they are!" It can be done that way,
    but usually there is a little more to it. You are making a presentation and sending
    them to the client.


    When presenting finished effects to the producers, I always send more sounds than
    needed. I work up several, letting them in the process and giving them the to
    choose the ones that match their vision. We have minor, subtle differences, changes
    in length, layering, or effects process settings. Some are "happy accidents" I''ll
    throw in that might work from a completely different angle. These serve two purposes:
    to give an idea so far out it might just work or to make the sounds that much
    right for the game.


    The producer will more likely be happiest with their choice, believing in it enough
    to sell it to the rest of the team. If you had made the choice for them, it would
    be like swimming upstream against a strong current. The psychological trick is
    for them to make the choice, take the responsibility, and do the rest of the legwork.
    I usually have my favorite, and if I believe it in enough, I''ll say so, to help
    slant the decision. But, most often, it''s their choice entirely.'
