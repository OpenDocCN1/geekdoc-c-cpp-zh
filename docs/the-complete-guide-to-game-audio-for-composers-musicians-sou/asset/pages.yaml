  md: '# 256 — CHAPTER 9: Creating Sound Effects for Games


    reorganized, reversed, inverted, compressed, expanded — anything to give them
    a new life and make them less recognizable. Nothing is more annoying than hearing
    the same sound effect used on television, radio, and in other games. It happens
    more frequently than you notice. I have a large German Rottwiler who runs excitedly
    around the backyard barking at the sky whenever he hears a certain hawk screech
    sound. I have a Hollywood Edge sample disk I use enjoy playing for the neighbors
    and friends. We all laughed at the stupid dog and his antics. The exact sound
    is in dozens of TV shows, commercials, and video games. The poor dog must run
    barking in the backyard several times without my help. These library sounds can
    be overused. My job is to change that.


    As an example, let''s talk about the creation of a different sound effect, using
    one from a project I''m currently working on. The sound is within the "space strategy"
    genre where units are maneuvered in battle to fight other players. It is a PC
    game with final sounds to be developed at 22 kHz, 16 bit wav files. This particular
    sound is a "shield" sound that activates when the unit is fired upon.


    I wanted the shield to have an electric quality to it — a controlled surge of
    energy that might sound as if was absorbing or deflecting a shot from a laser
    weapon. I wanted it to be original as I stayed away from the stock library effects
    and turned instead toward one of my synthesizers for inspiration.


    I ultimately settled on a patch (similar to the keyboard sound in Van Halen''s
    "Jump") and recorded about four seconds of a three-note chord. I saved it into
    my audio editing program, Sound Forge, 44.1 kHz, 16-bit stereo. Experimenting
    with a few different processors, opted for a nice doppler effect in another program,
    Goldwave. I edited an effects path to give it a quick, one second doppler effect
    with about three seconds of doppler decrease. Back in Sound Forge, I pulled up
    a static sound file, ran it through a stereo field effect and equalized it to
    increase the high frequency range. I then cut that file to four seconds to match
    the matched keyboard sound and mixed the two, keeping the static barely perceptible.
    I gave the new mixed file about one second fade-in and faded out the last two
    seconds with a linear fade. Now was beginning to sound like something. I normalized
    the file to maximize the sound, adjusted for any abnormal level peaks, and finally
    saved the new file as "shield.wav.


    Later, the producer wanted a dull, metallic clang mixed in to give the player
    distinction between a hit and a hit to the unit''s suit. I pulled up a nice clang
    sound, EQ''ed out of the highs, and mixed to the file. All is well, producer happy.


    To convert down to 22 kHz is a simple task. The resample function in Sound Forge
    does the trick. Because of the higher frequency band gets lost in the conversion,
    I usually add some EQ to compensate, just a slight amount gives it the right touch.
    Another check on the levels and now the effect is ready for the game. Total amount
    of work on this sound effect: two hours, 15 minutes. Lots of manipulation? You
    bet! You could do this edit edit using a multi-track editor.'
