    Remember, they are a business attempting to keep as much money in their pockets
    as possible and since their bottom line is the most visible to management and
    investors, their need to justify expenditures is tremendous. These "favors" can
    tip the scale to your favor.


    If the amount of money you request for the project becomes an excuse for them
    to find someone else, concede this "deal end" and consider making losses in other
    areas. If the amount of initial outlay is the problem, change the amount of milestone
    payments to them with the later payments being the highest. Or negotiate your
    bonuses, or royalties from their incoming receipts instead of their operating
    capital. Or negotiate equivocal services; perhaps artwork for your website, programming
    a simple interactive demo for your promotion package, web site hosting, or maybe
    even a trade for some computer or recording gear they have around. If there is
    a problem, work together to solve it by facing each other unblinking of opposing
    ends of the table. Be flexible, and you will gain points using other issues of
    the negotiation.


    # 2. Licensing


    As mentioned earlier, most game companies insist on owning the music and sound
    effects created for their project. Under a Work for Hire Agreement, this is clearly
    stipulated and it will give you the impression there is nothing left to negotiate.
    Again, we could not be further from the truth. Everything is still negotiable!
    There are many types of licenses in this type of work — more than we could ever
    cover. Whatever you do, during discussions about licensing, be sure to keep your
    options open and ready for anything.


    If a game company complains your prices are too high for the buy-out option, suggest
    they license your music and sound at a lower cost instead. You''ll recall that
    by licensing your music, they don''t have ownership; just a license to use it
    in their work. You would still retain full copyrights and could sell or re-license
    the work to others at your discretion. Smaller game companies who end using your
    music will negotiate an exclusivity agreement that states the music won''t appear
    in any other game application or does so only after a pre-determined amount of
    time has expired (usually a year or two, depending on the life expectancy of the
    product). You can be very creative.


    Another licensing issue could be your right to some promotion, that is, to use
    whatever you created for demonstration purposes. If a company opts for the full
    buy-out, they own the copyrights, leaving you begging permission to use your own
    music. Seems silly, I know, but that''s the way it is in the big world. Under
    normal circumstances, they have no qualms to promote your work and will license
    the music back to you for this purpose. They will never volunteer it though.'
