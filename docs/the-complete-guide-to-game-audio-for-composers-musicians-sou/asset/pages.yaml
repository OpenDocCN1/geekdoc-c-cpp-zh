    # 12.2.2 Composers and Sound Designers Will Ask


    When a developer has made the final contract negotiations and the documents are
    signed, the other details regarding the project are released to the audio provider.
    This is the point where “clear and concise” makes the difference between complete
    audio bliss or a sound disaster. Words have a way of meaning different things
    to different people and the sound guy will ask for the specifics in order to make
    it crystal clear.(For more information, also see section 5.3, “Asking the Right
    Questions” on page 97 and section 7.2, “Meetings with the Game Development Team”
    on page 169.)


    # What is the intended genre for the game?


    You want the music and sound effects to follow the spirit of the game. Make sure
    you give your sound contractor a feel of what the game is about, what it falls
    into, what similar games are available.


    # What sample rate, bit size, stereo/mono, file format is desired?


    The development team will have all of them to determine how much space and processing
    power will be allotted for graphics and sound. This will decide how high the sound
    quality can be and what parameters the audio will be created within.


    # Will effects be altered by any software or hardware processors?


    Driving games are one example where the reverb effect is used quite frequently.
    This is the kind of information the sound designer needs to know. Additional processing
    by a game engine will determine to what extent certain sounds are processed beforehand
    by the sound designer. (If a sound designer applies reverb to a sound developer
    had on applying reverb in the game, that could be a problem.) Decide as soon as
    possible if there are plans for this type of processing and communicating them.
    They, the sound designer is sure not to over-process any files. Music is normally
    untreated, but be sure to let the composer know if their music will change in
    any way also.


    # Are any ambient sounds or music tracks needed?


    We don''t want the player distracted by silence. This question may jog memories
    or you ideas not thought of previously. If you intend to play music instead of
    ambient sounds, communicate it. This will prevent a phone call late in the production
    cycle for forgotten pieces.


    # Will certain audio have priority during playback?


    There can be instances during gameplay when single sound or musical cue punctuates
    the moment. All other sounds become irrelevant and this one of audio takes the
