  md: '# CHAPTER 7


    # Setting the Stage


    For the most part, this is where the creative process begins for us sound guys
    and gals. Occasionally, game developers will have you on as part of the team from
    the beginning, this being the best situation, of course. But more often than not,
    they''ll have a good amount of the work on the game already completed. Before
    they even call you, the developer will have been at work for many months planning,
    creating, and methodically carrying out production phases. Entering midstream
    is more the norm and you can help minimize the anguish by planning ahead and knowing
    what to do. Getting the information you need, at the right time, and understanding
    your exact role and what is expected of you can save you enormous grief and creative
    setbacks. This will be the basic thrust of this chapter.


    # 7.1 Company Liaisons


    During the contract process, you will identify who has final authority over your
    work. This person will be where the proverbial stops — the person who will approve
    your submissions you get paid. But you will also need to know who your primary
    point of contact is as well. It may be the same person, and usually, is, but at
    large conglomerations, there may be several people to work with. Find the main
    one and get to know them.


    Your contact will have a working style all their own and it will beho you to find
    the best way to work with that person. Communicate through every step of the process,
    keep the lines open, and keep them informed. It will take some time to fully understand
    their creative guidance and to know what they mean by it. Every human is different,
    their life experiences making them so. What means one thing to one person could
    mean something completely different to another, even if the exact same description
    was given.'
