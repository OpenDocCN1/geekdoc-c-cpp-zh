    your mother, but in the heat of battle, it is easy to forget physical necessities.
    You can''t expect to produce your best work if your basic survival needs aren''t
    met. You may laugh now, but wait until that first contract you''ve been in the
    studio a week straight before even realizing it. You don''t want to burn out in
    this business. Pace yourself for the long haul.'
