  md: '# 174 — CHAPTER 7: Setting the Stage


    # The Big Trade-off


    One must evaluate:


    +   * how much space is available,

    * what method of audio playback to use,

    * the processor speed will be you doing,

    * how much audio is there is, and

    * then, what quality of sound for all of this is acceptable.


    Cartridge-type games actually don''t require much space for sound. If the game
    you are developing use audio tell the user''s internal device what to play and
    when, their actual file size is tiny compared to the rest of the information.
    Games which we utilize "sound fonts" use more cartridge memory because the triggered
    sounds are actually stored in the cartridge. Most hard drive, CD-ROM, or DVD-ROM-based
    games play recordings on the discs. We are working on one of these layers, the
    sample rate, resolution, and whether or not mono, stereo, or surround will determine
    your best methods of creation.


    Game developers actually use many different considerations before deciding on
    the final sound format and parameters. I mentioned physical memory first because
    it is the easiest to grasp — there is so much space and you can''t pass the limit.
    The first and foremost factor a developer will consider "speed." Is the game we
    are going to run smoothly on our target platform? Not only is the game competing
    for physical, read-only memory (ROM), but when the game is in play and all data
    is moving through the computer''s insides, the pipeline through the processor
    has to handle all the information.


    Complicated AI (artificial intelligence) and graphic-intensive scenery will chew
    through the available assets in a hurry, leaving little room for anything else.
    For programmers to make it work is to cut down the size of the data, including
    the audio and graphics files. Programming code is basically text and not much
    done to squeeze the file size any more. Graphics and audio are different in the
    sense that using less "detail" will free up more room while presenting the visuals
    or audio in one form or another. You will see the picture or hear the sound, only
    the quality will be less as the file size becomes smaller. You can see how complicated
    games of the past weren''t much to look at or listen to.


    A way around the processor in a PC is to use Red Book audio which is played directly
    off a disc, bypassing the motherboard altogether via a cable connected from your
    CDROM drive to the sound card. This gives you sound that never gets near the processor
    and frees it up to other. Other games use streaming audio and heavy compression
    to save on both space and performance too. As music is needed, it is loaded from
    the disk at a time, decompressor, buffered into Random Access Memory (RAM), and
