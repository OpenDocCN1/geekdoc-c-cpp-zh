  md: '# Marketing — 79


    The key is to look professional in every respect. You don''t need to spend a lot
    of money and go overboard. You just want to make your prospective clients feel
    confident you have your act together, know what you are doing, and won''t waste
    your time or money.


    # Design a Cool Logo


