    # Making Your Effect Unique


    Because the file will be downsampled and left as a mono signal, we don''t need
    to spend any time creating a stereo or surround effect. We can apply effects processing
    such as reverb, chorus, flange, pitch shift, and so on in mono with good results
    to ''seasoning''. The clank is a short sound so the chorus or flange will make
    it ''meatery''.


    The reverb will sustain the ring portion of the sound. Equalization can center
    frequency ranges adjusting to your taste and the playback device. Depending on
    your microphone (and proximity), it will have its coloration. Different mics are
    better at capturing certain frequencies than others. Save your ears and make adjustments
    accordingly.


    ![](img/34a845a3c9f2c249ab60e8ba2e1b7e3b_246_0.png)


    For our example, I would use a slight touch of reverb, with a bright, small room
    setting. You''ll notice that the sound does not decay naturally and is cut off
    before it fades. We can fix this. High the tail and using a linear fade will force
    the sound to gradually disappear before the end of the file. For our short sound,
    this will suffice because we don''t need it to echo for long. But, if some reason
    you wanted the sound to appear with a normal sounding fade, add 0.5–1.0 seconds
    of silence to the end of the file, add your reverb, delete any remaining dead
    space after the fade. This will allow more room for the effect to decay naturally,
    making it more realistic.


    After processing the file, you should save it as its own file, keeping the original
    file untouched in case you decide later you didn''t need the adjustments. Using
    this type of editor, you will be unable to undo additions selectively; the last
    edit is layered over the previous ones. In order to undo something you did three
    edits back, it would be necessary to undo the last two as well. Saving your file
    in various stages will give you something to go back to in case idea changes or
    an effect doesn''t work out as planned. Be sure to label them accordingly or the
    summary of'
