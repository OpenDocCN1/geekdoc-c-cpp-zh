    # 10.2 Quality Control


    Video games, though nothing strings of 1''s and 0''s, are like any other product
    and require some form of quality control. As the sound person, there is much to
    do from your end to ensure the audio portion of the product is up to par. Creating
    third of the game experience is a heavy responsibility and it behooves you not
    to leave this step to the developer entirely. You are the audio expert, you know
    the intentions behind every piece of music and sound, your name is on the box,
    and this final product is what might attract your next, money-making project.
    There is a lot riding on your sounds and you can''t just leave it to fate or some
    low-level, code programmer who doesn''t understand audio.


    If the audio was built top-notch, professional studio equipment, those standards
    are usually acceptable and will also be sound professional. Using experienced
    and talented craftsmen along with great gear will increase this chance of success.
    Starting out with quality will boost your mediocrity, giving less need for a separate
