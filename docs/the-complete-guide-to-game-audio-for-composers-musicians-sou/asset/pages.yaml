  md: '# 3.5.2 Rate Calculation


    An established composer can charge $1500 upward to $2000+ per finished minute
    of music. Established sound designers can charge between $150–200 per sound effect
    or hourly at a rate of $175–250 an hour. While they may be making more money than
    when they started, so their cost of doing business and overhead have also increased.
    As you gain experience, you''ll find that more expensive recording gear will push
    your music another step further. As you leave the $3000 analog mixing console
    for a $10,000 digital one, your payments increase to match. There is really no
    ceiling


    To calculate our rate, we need to have a good idea of the length of time it takes
    to do what we do. While you are putting together your demo reel, keep track of
    how long it takes to compose, record, and rewind one minute of music. Average
    this over the course of the production and you have a good day. Experienced composers,
    working from scratch, can do two to three minutes a day. Using loops and programs
    like Sony Foundry''s ACID can considerably. When I started in radio and TV commercials,
    my general rule of thumb was that 30 seconds of music took four hours, start to
    finish. Today, I''m up to one minute in a four hour period.


    Sound designers need to do the same. While working on various original sound effects,
    keep track of the time it takes to do one sound effect. That doesn''t mean that
    it takes that long to get one sound recorded. After many attempts and ideas for
    a sound are created, the final incarnation of the effect will have taken roughly
    two hours. Sometimes sound effects happen immediately and you are done. Other
    times, it''s like pulling teeth with two days passing before one materializes.
    We''re looking for the average of the process to determine what our costs are.


    Using our previous examples, we can finally conclude what our rates should be.
    I will be using the four hour finished minute of music and two hours per sound
    effect models in the calculation with no outsiders musicians or voice talent.


    | Hourly wage and/or creative fee: | $30.00 |

    | Studio fee: | $7.56 |

    | Total cost: | $37.56 per hour |


    Then multiply by the number of hours to complete your working model:


    ```

    1 finished minute of music: 4 × $37.56 = $150.24

    1 sound effect: 2 × $37.56 = $75.12

    ```'
