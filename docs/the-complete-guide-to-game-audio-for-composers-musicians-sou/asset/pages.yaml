    Flash games are designed to load quickly and the smaller sound file, the better.
    Some game designers opt to leave out audio all together or reuse one or two sounds
    for everything — reminding me of the early days of video game design. Keep an
    eye on the broadband wave, and as it becomes faster, audio quality will follow
    the same path.'
