    it a listen. If you hear any background noise? If it is prevalent, highlight the
    space and let your noise reduction analyze it and process the rest of the file.
    If you don''t have this feature, it will still be fine; the clank sound is much
    louder than the background noise and won''t be noticeable with such a quick trim.


    ![](img/34a845a3c9f2c249ab60e8ba2e1b7e3b_244_0.png)


    Figure 9.3 This sound effect looks good. It has all the properties of a “healthy”
    file.


    Use the dead space from both ends, careful not to cut any of the sound wave. Use
    the zoom feature to ensure the file is as small as possible and so the sound plays
    immediately after it is triggered, instead of playing silence first. Save the
    file. This will be the file you''ll working from.


    By inspecting the file, you should be able to tell a couple of things. (If you
    read the section “Visual Inspection” for game music in Chapter 8, the following
    outline will be déjà vu. Move on to “Making Your Effect Unique” on page 234.)


    **Is the centered on the zero baseline?** The line runs through the middle of
    your sample is the zero baseline. Occasionally, when there are electrical mismatches
    between your soundcard and microphone, it can cause the entire sample to be centered
    above or below it. This can cause unwanted audible artifacts that you''ll need
    to get rid of. The DC Offset function will analyze the file and re-center it to
    zeroing the file as clean as possible.


    **Does the wave form look “healthy?”** Does it fill much of the screen or is it
    a bunch of little lines barely perceptible until you zoom? It is important that
    the actual sound is louder than any noise floor in the recording and louder than
    the noise on any playback system. If the volume is at least minimum intensity
    or thereabouts, you can beef it up by either scan the overall volume manually
    or using a normalization function. Normalization will scan the file and increase
    its overall gain, set by you, without clipping. This will maximize the volume
    proportionally leaving a strong, solid sound.'
