  md: '# 84 CHAPTER 4: Finding and Getting the Jobs


    I tried emailing my introductions and the most astonishing thing happened out.
    Out of 100 emails I sent, 25 responded. Twelve to 15 of those requested a demo.
    Three to five of those requested a bid submission or speculative demo for a project.
    And out of 100 emails sent out, I ended up getting at least one if not two. It
    was exact same letter I had spam-mailed, but my targeting strategy was much more
    focused. Ah, success!


    This particular method is fairly time consuming, but indeed a gift from the gods.
    Start building your address book with every contact you make. Visit developer
    sites and dig around the right person. Send them an introduction. Personalize
    it as much as possible. You could save a lot of time by adding everyone to the
    “to:” line, but this will come across impersonal to the recipients they were just
    part of another mass email. Try sending to one person at a time (or using a program
    that does this), put their name at the top of your letter, and their company name
    somewhere in the text. Even if they are smart enough to see through your play,
    they will still appreciate the extra effort and youll score a point. Make your
    letter succinct, to the point, and leave the impression you make business. Always
    invite them to follow up, request a demo, or call just to say hi.


    # Print Advertisements


    Print advertisements can include a classified ad, a corner spot in a company newsletter,
    or a full-blown page in a national publication. It''s undoubtedly the most expensive
    part of a marketing plan and not something to take lightly. A well-designed ad,
    strategically placed, can build your name recognition and get you a project or
    two. It will tell people you must be doing well to afford such expense and will
    make them curious. Obviously, you must be successful to pay for such an attractive
    ad.


    On the other hand, if your ad doesn''t look professional or is buried deep within
    pages of ads, you might as well walk walk to the toilet, throw in your money,
    and flush. I''ve had a few colleagues tell me they tried print ads and all were
    disappointed with the results. They only ran their ad once. To gain exposure through
    print advertisement, you must constantly bombard your target audience using multiple
    shots across both. Try running an ad every month, several places in the same magazine,
    or multiple magazines in the same month. It will inevitably bring some success
    in your door. Even those cheesy late night commercials on TV run more than once.
    You''ll usually see the same one over and over for a couple of weeks before it
    sticks in your mind. The same principle can be applied to print.


    I don''t recommend television or radio ads. They cost serious cash and don''t
    necessarily focus on the business you care about. Unless you could buy time on
    a closed circuit broadcast, you are better off spending your money elsewhere.
    Type of broadcast media is ineffective for our purposes. I don''t know of anyone
