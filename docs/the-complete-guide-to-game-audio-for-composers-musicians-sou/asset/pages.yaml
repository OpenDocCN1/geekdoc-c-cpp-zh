  md: '# 56 CHAPTER 3: Getting Organized and Ready for Business


    Most composers tend to work at home in their project studios foregoing regular
    office hours and the commute, preferring to work where they are comfortable and
    close to the other important things in life. Have nearby studios and composing
    space allow them to get away from any distractions, close the doors, and come
    out when they are through. An office building isn''t always the best place for
    your finest work.


    "All work and no play makes a jack a dull boy." If Jack played music constantly
    and never took a break from it, Jack would become boring and his music lifeless.
    As an independent contractor, this can never happen to you. Your business forces
    you to do other things that help keep your musical fresh. I usually find that
