    The companion CD-ROM for The Complete Guide to Game Audio includes:


    +   * music and sound effects samples,

    * game trailers,

    * demo reel samples,

    * demo versions of sound editing and sequencing programs from companies such as
    Sonic Foundry, Cakewalk, Goldwave, DirectMusic, Propellerhead, and others,

    * information from Dolby Laboratories on surround sound for games and PC usage
    and the original Dolby SDK,

    * interviews with composers and sound designers,

