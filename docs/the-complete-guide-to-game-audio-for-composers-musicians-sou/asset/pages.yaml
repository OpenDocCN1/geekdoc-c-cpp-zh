    and you''ll have a rough estimate of what you need to cover your costs. Figure
    in an appropriate margin of 25% to 30% and there you go. Check prices at other
    local studios for their hourly rates to see how you compare. The advantage you
    have is that your overhead is far lower than a professional recording studio and
    that savings can be passed on to your client.


