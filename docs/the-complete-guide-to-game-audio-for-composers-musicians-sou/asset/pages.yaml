    # 4.1.2 Look Professional


    While we are out there beating the bushes, things are going to start happening
    fast and furious. Bid requests, information requests, demo requests, and our pricing
    structures are going to be sent out to prospective customers as fast as they hit
    your desk.


    ![](img/34a845a3c9f2c249ab60e8ba2e1b7e3b_94_0.png)


