    doing it upfront. That will be a nice change.


    For those who regularly negotiate this point, the usual agreement is to split
    the net profits derived from the reuse of your music and 50/50. Because they will
    be spending money to make these new endeavors reality (hiring lawyers, additional
    marketing and administrative chores), it is appropriate to split the money after
    they''ve recovered their costs, the net — not gross income. Divvy up the profits
    in their favor if they need be; say 60/40. If you are open to give and take in
    the process, you can still walk away with a tidy sum. Or you could hold fast and
    lose the deal completely. It''s a fine art indeed.


    The same goes if they decide to release your music on a soundtrack CD. You can
