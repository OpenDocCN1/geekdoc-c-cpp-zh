    # ## 3.1 Understanding the Business of Game Composing


    It''s getting close to decision time. You have the music and sound design aptitude,
    a great attitude, and the willingness to make this a successful venture. But,
    do you really want to? Is the games industry the right place to sell your music?
    Do you even want to work that hard?


    Truthfully, not everyone can do the job. You might be able to compose some fantastic
    music, but your business ability or lack thereof will stand in the way. Historically,
    musicians are not well respected by the establishment as businessmen. Management
    types do not fully understand "creative" people and tend to stereotype them into
    neat categories which suit their purposes. We, on the other hand, know better.
    Just because we may come across sometimes as "free-spirited," it doesn''t mean
    we don''t have our act together and are capable of comprehending the complexities
    of the business world. Regardless of the trade you are in, your "product" is worthless
    unless you can sell it. Keep that in the back of your mind.


    To do this type of work, you must be creative and able to craft an original "mood"
    to the game you are writing for. You must remain detached and objective when asked
    to rewrite passages or redo any work. You must have a great attitude and always
    come across in a positive and professional manner despite your instinctive urges
    to thin the obnoxious producer gene pool. To be successful, you must have it in
    your mind you are in for the long haul. By dedicating your efforts and focusing
    on your personal and professional goals, you will outlast anyone who thought they
    could get their music on a major game title within a month of opening their doors
    for business. It can be frustrating at first, but rewards come to those whose
    calculated patience remains intact.'
