    is regardless of where it comes from. But, keep in mind, this will yield nothing
    with turning down this type of request, choosing to stick with your business plan.
    Why should you risk your time when there is no guarantee anything will come of
    it? While it may be a calculated risk, sure things feel a lot better.


    # 5.7 The Bid Submission


    We come back full circle to the question, “how much do you charge?” This time,
    we are armed with powerful knowledge, motivation, and a list for success. All
    the parameters for the game have been laid out and it''s time to determine your
    fee. Obviously, the amount you charge is a big factor in determining whether you
    get the call or not, so don''t take the subject lightly.


    After you''ve set a figure, mull over your interactions with the developer to
    decide whether they are giving you free rein or will be non-stop in your side
    and then let that feeling be your guide. Let intuition be the basis for the bid
    you submit. It''s not an exact science, but it will reward your motivation and
    ultimately the quality of the job you do.


    > A wise man once said, if you grumble about an entire project, you are not charging
    enough.


