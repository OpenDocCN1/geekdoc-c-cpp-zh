  md: '# Understanding Sound – 293


    Each minute of this format produces a file size of roughly 11 MB and an hour of
    this audio almost completely consume the space on the CD, leaving little room
    for anything else. As a developer, the amount of storage space and processing
    speed available is of great concern. In order for all elements of a title to fit
    into a neat, tidy package, priorities are made and file sizes are minimized.


    In the end, only two aspects of a game have the ability to be resized to conserve
    valuable storage: graphics and audio. Smaller graphic files with less colors and
    pixels equal a grainy, unrealistic visual presentation. Graphic artists can balance
    their artistic vision and files by adjusting parameters to an acceptable conclusion.
    Sound artists face similar considerations.


    In order to make a smaller sound, the sound quality must be degraded in such a
    way that less information is stored. We can do this by lowering the sample rate,
    the resolution, or the number of channels to a size which is more plausible. The
    following table from Chapter 7 has been reprinted for reference. When asked to
    reduce a file size, I will first decide how important the stereo or surround image
    is. If converting to mono doesn''t make an appreciable difference I would do this—cutting
    the file size in half. Or, for less quality audio while maintaining the stereo
    field, I could reduce the sample rate to 22 kHz. Either way, the quality of the
    sound is affected by a higher sample rate. Frequency degradation becomes obvious
    as sample rates are lowered and the sound quality starts to collapse. The very
    last choice I would consider be a change in resolution. 16-bit audio resolution
    is better than 8 bit, but it is also twice as large in size. 8-bit resolution
    is prone to noise and care should be taken to ensure the audio volume level is
    louder than any noise by-product associated with the loss of resolution.


    # Memory storage requirements for one minute of sound.


    | Type: | Mono | Mono | Stereo | Stereo | Encoded Dolby | Encoded Dolby Surround
    |

    |---|---|---|---|---|---|---||

    | Resolution: | 8 bit | 16 bit | 8 bit | 16 bit | 8 bit | 16 bit |

    | Sample Rate | | | | | | |

    | 44.1 kHz | 2,646k | 5,292k | 5,292k | 10,584k | 5,292k | 10,584k |

    | 22.05 kHz | 1,323k | 2,646k | 2,646k | 5,292k | 2,646k | 5,292k |

    | 11.025 kHz | 661.5k | 1,323k | 1,323k | 2,646k | 1,323k | 2,646k |

    | 8 kHz | 480k | 960k | 960k | 1,920k | 960k | 1,920k |'
