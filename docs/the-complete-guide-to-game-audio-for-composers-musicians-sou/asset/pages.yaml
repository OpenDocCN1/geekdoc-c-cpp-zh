    # 6.3.2 Negotiation Pointers


    The contract and negotiation process is most people’s favorite. The creative process
    is held up until the contract is complete and signed, and most people are just
    not prepared for this type of confrontation and find hard to separate business
    from personal feelings. You’ll find a lot of people take you ever personally and
    never get quite prepared. The rest of your working relationship suffers because
    you turned out to be a different person than what they may have perceived. It’s
    not your fault, they just become mad at themselves for not being prepared for
    the business issues and your professionalism. They are like creative people who
    just want to make video games and hate ever having to deal with contracts and
    legal documents. That’s why the big companies have legal departments, they handle
    the details, and the producer gets to make the games.


    When you are presented with a contract and begin the process, keep strictly business.
    Stay away from getting personal or taking things personally. When two companies
    get together to negotiate a contract for service, with teams of professionals
    on opposite sides of a board-'
