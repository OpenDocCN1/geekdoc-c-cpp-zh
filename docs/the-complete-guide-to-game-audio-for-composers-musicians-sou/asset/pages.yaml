    # 8.1 Game Music Varieties


    One of the beauties of game music is that you rarely get bored working on a project.
    Within video games, there are several musical specialties that guarantee to keep
    the perspective fresh and your skills employed. You''ll get to compose scores
    for cinematics, background gameplay ambience, and in-your-face themes for the
    same project. A great testing ground to prove your musical skills, but can also
    tax your creative stamina. It''s definitely exciting prospect — one worthy of
    the paycheck you receive for your talents.


    Let''s run an overview of the various types of music required in games. This is
    by no means complete listing because there are no specific rules for and when
    music should be applied. But certain similarities where game players expect to
    hear music and these are the ones we''ll discuss.


    # 8.1.1 Intro, Closing, and Credit Sequences


    The first piece of music the player will encounter the opening (or introduction)
    sequence. This is presented as a "main title theme" or a score accompanying cinematics.
    The music will help build the momentum and excitement of the game, the set, and
    establish the storyline. This first moment capitalizes on the player''s exhilaration
    for purchasing the game and reassures them they have spent their money wisely.
    Music plays an important role establishing the quality of the game — the crucial
    first impression that will last until other opinions are formed. If the music
    sounds cheap, it cheapens the purchase immediately, regardless of the quality
    of the graphs. If a compelling orchestral score meets them, the player has a sense
    that they are in for a first-rate experience.


    Closing and credit sequences are normally where the final musical cues occur.
    This late in the game, they might not enhance the player''s opinions, but they
    still serve an important purpose in the overall scheme. The closing cue will accompany
    a final cinematic sequence, a slide show, or the credit. It is designed to give
    the player a sense of closure after the effort of playing the game. Normally,
    it''s a big accomplishment to finally finish a game and this final fanfare will
    reinforce the memory. The music will set whatever final mood the developer wishes
    to leave the player with — whether it be triumphant and happy, or calm and serene.
    Someone spent $50 and weeks of their time playing your game, and we want to congratulate
    them and give them every reason to believe all of our games are worth playing.


    The credit sequence is the chance for the development team to have their name
    in the spotlight and get a little public recognition. The slide show or scrolling
    display is either triggered by the player from a game menu or will automatically
    play after the objectives of the game are accomplished. If it plays at game''s
    end will also serve as the closing sequence.'
