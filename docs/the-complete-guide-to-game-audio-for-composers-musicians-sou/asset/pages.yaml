    # The Industry Now


    The games industry can be a very exciting and dynamic place for musicians and
    sound designers. Through sound and music, a game can completely immerse a player
    in another universe or reality. The creative freedom to manipulate media and environments
    is limited only by the technical capabilities of the machine and a musician''s
    imagination.


    While creating interactive audio can also be technically demanding. Scoring and
    designing audio for games can be much more challenging than motion pictures. This
    is due to the simple fact that games are, by nature, nonlinear. An example of
    this can be simply demonstrated by a car passing the camera. In a film or television
    program, the picture is established and consistent, the image of the car passby
    is a line, time-established scene that can be seen, synchronized, recorded, and
    mixed by a sound designer or musician. By contrast, in a 3-dimensional game environment,
    there can be hundreds of variables that determine how and where the car exists
    within a 3D space. Because a player can view the car from multiple of angles,
    the sound must be capable of being manipulated to match the image from any viewpoint.
    A simple car sound may need to be looped, layered, panned, pitch shifted, downsampled
    and formatted — to accommodate a simple car pass sound.


    One obvious difference from films is that an audio designer typically doesn''t
    always “mix” the games because each game requires sound to be individually programmed
    and positioned within the code. In a game environment, there may be hundreds of
    pieces of dialog, music, ambience, and Foley effects — each with their own value,
    pitch, and positioning within the 3D environment. It generally up to the programmer''s
    code to determine how these will be mixed real-time in the game. It''s no wonder
    that even the most amazing sound effect or piece of music can be utterly annoying,
    if it is placed inserted or too repetitively in a game!) It is important that
    audio designers learn as much how their'
