    # Editing Methods — 233


    The waveform saturated screen completely? If the sound file shows a solid wall
    from the zero baseline to infinity, the edges of the sound cut off, chances are
    this file will be distorted and totally lack any dynamics. Depending on the effect
    you are trying for, this may be all right, but the majority of the time, you''ll
    need to give something a try. First attempt to reduce the overall volume or apply
    a moderate amount of compression.


    ![](img/34a845a3c9f2c249ab60e8ba2e1b7e3b_245_0.png)


    Figure 9.4 This is the same “healthy” sound file example turned up a few notches
    too many. Meter to the right doesn''t begin to describe the pain this sound effect
    is


    available to repair this type of damage. Listen to the results and decide if it
    sounds anything better or if you simply reduced the volume and applied “band-aids”
    to a distorted sound. In that case, re-recording the sound will be your only option
    — just sure to do it at a level of couple notches before the previous attempt.


    Are there any points in the file where the volume peaks or causes clipping? Nothing
    sounds from a digital file passing 0 dB on a level meter. These prominent peaks
    cause unwanted clipping and distorted screeches in sound files needs to be dealt
    with. One option is to reduce the overall volume of the file to bring any peaks
    below the level of clipping. Another is to apply a slight amount of compression,
    like a 2:1 ratio, which in effect, will squash the peaks and raise the quieter
    levels proportionally. My personal favorite is to use a peak limiter set to –0.01
    dB which allows for the highest possible levels without reaching 0 dB. Depending
    on the playback system, you may have to adjust the peak limiter to a lower setting
    to compensate for poorer speakers. Keep an eye on the peak levels, especially
    after adding EQ or other processing and be prepared to repeat this step if necessary.'
