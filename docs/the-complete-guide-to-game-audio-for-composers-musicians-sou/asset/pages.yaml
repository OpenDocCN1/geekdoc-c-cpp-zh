    # Music Creation Example


    When a composer receives the call for music, the developer, without even knowing,
    has set a massive creative wheel in motion. In our culture this is taken for granted
    and do not understand the often monumental effort it takes to create something
    out of thin air. When all you hear the end result, it is easy to discount the
    scenes before.


    This example will illustrate when creating a short musical piece for a game. This
    particular one is a music cue from a recent PlayStation 2 project. The developer
    requested a 30-second, loopable cue to be delivered as a .mid file and a 2 MB
    bank of instrumentation which would be triggered by the .mid file. The game of
    the sports genre and music was for the main menu screen.


    Before any music was composed, time was spent viewing video tapes of actual gameplay,
    the menu screen itself, and a tape of an actual live event. I copied notes of
    initial thoughts, for instrumentation and direction of the piece. I listened to
    audio examples of licensed music that would also appear in the game and additional
    ideas the audio director had in mind. After a few hours of concentration, I put
    everything aside until the next day. The intention was to let my mind process
    the information and to form ideas that I could pursue during the composition phase.


    The next morning, being the arduous task of assembling instrumentation and other
    sounds would form my basic “sound palette.” We had decided on a hip-hop theme
    with piano'
