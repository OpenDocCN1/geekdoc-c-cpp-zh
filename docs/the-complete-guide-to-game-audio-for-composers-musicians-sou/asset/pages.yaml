  md: '# CHAPTER 6: Making the Deals


    Change orders happen. They are a way of life in the winds of creativity and big
    business. Expect them, prepare for them, plan for them. But, unfortunately, there
    is no correct formula to apply when putting it in writing. Just make sure you
    are not caught in a position where you are taken advantage of and start losing
    money on the deal.


    In a case where you might be working towards milestones, have it in the contract
    that if any major changes are requested, you keep the payments already received
    and a new milestone schedule will be worked out. If you are working for a flat
    fee, make sure something is in the contract or a separate agreement covers any
    added expense and time on your part. Spoken agreements are easily forgotten.


    Reworks are a close cousin of change orders and also something to watch. While
    change orders are basically starting over, re are the same piece and redoing it
    until it is right. For music, it might mean replacing instrumentation that interferes
    with something or changing the length of the piece. Maybe music needs a gradual
    fade in and fade out; maybe needs to be louder. The same for sound effects. Many
    times the length of the sound corresponds with a character action and has to be
    matched exactly, or perhaps a certain part of the sound is very grating if heard
    repeatedly. It might be too loud. Whatever the requirement, you redo the audio
    until it works perfectly.


    I personally don''t have a problem with reworks. They are a completely acceptable
    part of the job. What does bother me, and other audio folks as is taking it to
    the extreme where it becomes a change order. The problems begin after receiving
    guidance from the producer for the music and sound effects, sharing the work while
    it''s in, getting the appropriate that you are heading in the right direction,
    and having to spend time redo everything. Communication must be the number priority
    and if you are having trouble with it, you are bound to spend time with reworks
    as a consequence.


    Therefore, there has to be an agreement regarding reworks. When guidelines are
    established at the beginning of the relationship, a plan will be clear and no
    will be taken advantage of. The developer won''t have to settle for audio they
    aren''t happy with and the contractor doesn''t have to waste time redo things.
    With open communication among the players, it should be obviously when the contractor
    reworked something to death and is starting to lose all feelings for the piece.
    At that point, whatever contingency was established come into play. The bottom
    line is: you should never lose money on a contract, ever. You may feel slightly
    taken advantage of times, and it''s always a good business practice to go the
    extra mile for the client without complaint, but there is a limit. To protect
    your interests, it needs to be spelled out in contract.


    # 6.5 Sample Agreements and Contracts


    The first time I saw a game contract, I nearly fell over backwards. Now, after
    dealing with them enough, I''m fairly comfortable with them, and more importantly,
    I am able to pick up on the portions that affect my interests directly. The more
    you see, the better you will understand —'
