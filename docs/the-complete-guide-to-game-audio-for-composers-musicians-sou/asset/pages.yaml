  md: '# 9.7.2 Creating a Sound Palette


    The first order of business is to choose a sound “palette” and organize your computer
    or sampler files so they are easily called upon, as also discussed in section
    8.5.2. I generally grab sounds I''ve developed or recorded within the genre I
    will be creating, put them into a computer folder, and draw them upon the work
    progresses.


    Create new directories and start throwing in any sound that might sound like it
    belongs in the game. If it''s a cartoon-type game, grab your “carton” sounds.
    If it''s a war game, grab all the shots and explosions when you have lying around.
    You''re not necessarily using them all, or any of them. You are establishing a
    theme and a good starting point. You''ll look to this folder for the bits and
    pieces to form the core of your game sounds.


    Why bother a palette? I was resistant at first. Why spend extra time preparing
    when I could just jump in and create? On a couple of larger games I tried just
    that, found I was spending administrative time away from the design process looking
    for ideas anyway. By spending a couple days at the beginning, I only had to break
    my creative spell a few times now that all of the sounds were ready. You would
    drive yourself crazy choosing from possible sounds. By narrowing the possibilities,


    +   a) naturally used an aerial theme based on the 100 or so sounds you''ve chosen,

    b) the game sounds will have similar qualities because most are made from elements
    from your palette,

    c) you will design better, more original sounds by limiting your choices and forcing
    yourself to be more creative.


    Try it both ways and I guarantee you''ll always start the process by forming a
    sound palette, whether it be computer- or sampler-based.

    inney Scott, sound designer and composer for Preto Studios (developers of Myst
    III, The Journeys Project series, Gundam 0078, and others), believes putting together
    the initial palette is the most important step; finding sounds that will mix well
    together. He uses a sampler (Emu Emulator E4) in his sound design process and
    for each game, develops an entirely new sound palette to keep them. He finds using
    a sampler has many advantages over computer files and sound editors. “Layering
    sounds internally in the E4 works very well for me, more than so doing it on a
    computer. That way, I can save my banks as a palette rather than having sources
    in various folders over the computer. They are all looped, EQ''ed, and noise filtered
    to my specifications. Plus returning to them make any changes is a simpler task"


