    # 3.4.4 Demo Chic — Types of Demos


    There are many ways to present your work as you are composers and sound designers.
    Your creativity can be let loose to make your creations stand out. There are no
    hard and fast rules; again, just make it great.


    I''ve heard demos which use music, sound effects, and narration — a radio commercial
    to present an audio product. Most producers I spoke, however, agreed that it distracted
    them from getting to hear your music and the quality of the tracks. They prefer
    music either presented as a montage or as numerous, short (1:00 to 1:30) selections
    in rapid succession. Full-length pieces of various styles are also acceptable.


    The demo montage makes the strongest impact. If seven minutes of work, fading
    from one selection to the next, blended together to sound like one song of different
    styles will definitely keep them listening. Include only the best sections of
    your work, taking them on musical expedition full of surprising twists and turns.
    It''s unbeatable. I normally include two montages; one with a harder edge, full
    of intensity, and a softer, more emotional montage. Because the montage does not
    show your musical thought process or prove you can hold a listener''s attention
    with a single song idea, I also include a few longer tracks, i.e., songs down
    in their entirety, just in case they are curious and wish to listen to that.


    Minute-and-half selections are another sure fire of presenting your pieces. With
    only seven minutes on stage, you have to make it fast and this is a great way
    to show off your musical dexterity. The one thing I''ve noticed listening to these
    types of demos is my urge to hear more! And because I can''t immediately hear
    more of a track, I end playing the tape/CD again! It''s a trick that has been
    used in pop music for many years. By keeping a song short, it is requested again
    and again in order to satisfy the hungry listener, invariably making it the one
    requested again and again of the week. Chart-toppers are usually just good songs
    marketed wisely. If your demo is of this style, be sure to include a few longer
    pieces too.


    A demo with few of this style, be sure to include complete selections of music
    also works well. Pick the current popular music styles such as:


    +   * alternative/rock jam

    * orchestral,

    * ambient,

    * sports, and

    * playful/quirky.'
