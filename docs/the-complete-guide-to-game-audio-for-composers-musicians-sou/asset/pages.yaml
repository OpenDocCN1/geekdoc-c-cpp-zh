  md: '# CHAPTER 13


    # Game Over? Not Hardly


    Audio for the video game industry is a continuous pursuit. For the composer, musician,
    and designer, it''s a quest to be heard, to create noteworthy compositions, to
    sell them, to make a living, and maybe gain a little notoriety in the process.
    For the developer, it is the aspiration to take their game to the next level with
    the ideal audio enhancement, to create a truly entertaining experience and entice
    consumers to spend money on their product. It''s by no means a simple proposition
    for anyone, but when it works, it is a thing of beauty!


    Getting into the game industry will be easy for some and very difficult for others,
    but whatever happens for you, don''t take it at face value. You need to be able
    to sustain yourself. Some will get a job with the first phone call they make,
    others will get 100 "no''s" before they ever get a nibble. The ultimate trick
    now is to use momentum to get the next job and the next and the next. Be sure
    to be in the right places, make yourself known, and use every bit of talent and
    skill you were born with. You will need all of it every day of your career to
    establish a solid foothold in the industry. It can be done and you can do it!


    Once you become involved in the game industry and begin pumping out massive quantities
    of killer audio, be sure to also take care of yourself, your family, and your
    industry. Always do your best work and what''s best for the project. The optimal
    way to attract new clients is in demand and the standards high throughout the
    industry. Never give away your music or sound effects for free or below cost —
    this only changes your work and other game audio creators'' worth. By charging
    rates similar to everyone else, the people who make a living at this endeavor
    won''t have to lower prices to match those who are giving it away. Don''t let
    yourself be taken advantage of. While most game developers are part of honest,
    hard working companies, there are a few without scruples who will sway you into
    poor decisions that will cost you money. Always protect your interests and remember
    you are in business to make a profit, not take it in the shorts.'
