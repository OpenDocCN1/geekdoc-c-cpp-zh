    him or more. They may even attempt to secure ancillary rights for the same reason.
    I would never deny someone running their business and negotiating of their “product”
    this way, but as the sound record, in this case, I am not in the position to negotiate
    this type of request. When games use high caliber or name-brand talent for a lead
