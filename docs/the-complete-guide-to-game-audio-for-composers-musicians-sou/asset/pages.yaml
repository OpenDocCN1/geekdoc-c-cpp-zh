  md: '# Where Sound is Now — 5


    There are still games in development which use the older MIDI standard for those
    computer owners who have older equipment. High quality audio can put extreme demands
    on a system; MIDI does not. Savvy game developers make these considerations to
    sell more games and keep an eye on the bottom line.


    Overall, the general trend shows a continued movement towards improved sound quality.
    Arcade games have more speakers, sub-woofers, and better playback devices. Home
    consoles have stereo outputs and additional sound controls built in. PCs include
    upgraded audio hardware as standard and stream-quality audio straight from the
    disk. Game developers understand the impact of superior music compositions and
    film quality sound effects and their increased sound budgets allow them to hire
    veteran audio professionals to make this happen.


    Composers and sound designers are brought earlier in the development cycle — as
    part of the design team — instead of as an afterthought during the final phases
    of production. Eventually, video games will be like interactive movies where the
    psychological effects of music and sound will be dominant.


    The new frontier at present day is the Web. If history is any indication, as games
    move onto the Internet, the same wants and need will apply. Current use of sound
    is restricted mostly to small file sizes and MIDI music. Web games, at the moment,
    are using audio low as 8 kHz, 8-bit compressed file formats do nothing to enhance
    the sound. Java and Shockwave


