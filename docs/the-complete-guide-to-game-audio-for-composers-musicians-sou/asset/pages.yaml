  md: '# 218 — CHAPTER 8: Creating Music for Games


    ![](img/34a845a3c9f2c249ab60e8ba2e1b7e3b_231_0.png)


    Figure 8.7 If your music looks like this, chances are it will sound like a distorted
    mess! Keep the overall levels under control for audio the way you intended.


    Are there any points in the file where the volume peaks or causes clipping? Nothing
    sounds worse than a digital file passing 0 dB on a level meter. These prominent
    peaks cause unwanted clicking and distorted screeches in sound files and need
    to be dealt with. One option is to reduce the overall volume of the file to bring
    any peaks below the point of clipping. Another is to apply a slight amount of
    compression, which a 2:1 ratio, in effect, will squash the peaks and raise the
    quieter levels proportionally. My personal favorite is to use a peak limiter set
    to -0.01 dB which allows for the highest possible levels without reaching 0 dB.
    Depending on the playback system, you may have to adjust the peak limiter to a
    lower setting to compensate for poor speakers. Keep an eye on the peak levels,
    especially after adding EQ or other processing and be prepared to repeat this
    step if necessary.


