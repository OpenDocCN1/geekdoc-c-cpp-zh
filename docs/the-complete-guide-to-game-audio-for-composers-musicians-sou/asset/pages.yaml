    have a solid idea of the information needed by sound creators, our thought process,
    and the guidelines we follow to deliver the perfect quote are effective asset
    managers who cultivate success. Sound artists utilizing standardized guidelines
    to determine their fees, options for payment, and winning bid procedures would
    bring it home.'
