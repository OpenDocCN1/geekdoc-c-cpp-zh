    This quality 역시 comes down to a final trade-off, what quality of sound is acceptable
    for its affected file size. Be sure to discuss with your sound person what they
    recommend, if there is a choice involved. Their expertise and quite for high standards
    are a perfect source for their affected file size. Sometimes, especially with
    Java and Flash games, 8 kHz, 8 bit, mono files are all you are going to get and
