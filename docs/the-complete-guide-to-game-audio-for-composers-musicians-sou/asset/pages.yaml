  pgno: 57
- img_proc: true
  md: '# 40 CHAPTER 2: Essential Skill Sets and Tools


    Large left and right speakers and a smaller center speaker from the same line
    are acceptable. If possible, the center speaker should have the high- and mid-frequency
    drivers as the left and right speakers. When placing the front line of speakers,
    all of them should be equidistant from the mixing position and the left and right
    speakers should be far apart as the engineer''s head is from the center speaker.
    This will provide optimum coverage and keep the listener in the sweet spot.


    The two surround speakers can be smaller-type speakers. The actual frequency response
    of the surround channel is 1000Hz to 7kHz so larger speakers for bass reproduction
    and extended range for ultra-high frequencies are not necessary. It is important
    to choose surround speakers that sound like the front speakers throughout this
    range. A smaller speaker from the same product line usually works best. The surround
    speakers should be placed on the side walls approximately two feet behind and
    at least two feet above the engineer''s seated position. They should be pointed
    to surround speakers pointed directly at or below the listener''s seated position.
    For a Dolby Digital set-up, the rear speakers should be placed 110 degrees from
    center.


    If all speakers in the front are identical, the power amps for each should also
    be rated. If the center speaker is smaller and center channel bass is being redirected
    to the left and right channels, the power rating of the center amp should be at
    least 75% of the left and right amps. The total power provided for the surround
    channel should not be less than that of either the left or right channels. The
    preferred method is for each surround speaker to have a separate amp at least
    50% of the power of the left and right amps. If one amp is used for the surrounds,
    it should be rated the same as the left and right. There are also many active
    monitor systems available which amplifiers built into the speaker cabinet would
    serve this purpose well.


