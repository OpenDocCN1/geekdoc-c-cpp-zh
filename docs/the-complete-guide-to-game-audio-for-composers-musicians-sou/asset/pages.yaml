    effort in futility. Stay alert.


    While asking for a speculative demo is a “win win” situation from the developer’s
    standpoint, it can be a waste of time for you. Newer sound folks are usually more
    than happy to spend a week or two bleeding for a speculative demo, investing their
    time and money to find out what they have wasted. Established composers don''t
    need to expend this effort — having a proven record to fall back on inside.


    You have a clear choice when faced with this request. If you''ve heard their demo
    reel, you can sell them what you''ve already done. Point out a piece on the demo
    which may be similar in nature to what you are thinking and play up the value
    of your production quality. If your argument doesn''t sell them and they insist,
