  md: '# 6 CHAPTER 1: An Introduction to Game Audio


    # 1.4 Where Sound is Going


    The future holds some incredible offers for game audio — your imagination, the
    only limiting factor. Picture yourself surrounded fully by sound, where game relies
    heavily on your sense of hearing. Walking down a dark corridor in a first person
    shooter, hearing your footsteps below you, environmental sounds coming from air
    ducts and downwards, you hear a noise behind and to your left, you want to be
    confronted by a ghostly beast who wants you for lunch. If you fire your weapon,
    the sound reverberating, shells tintling on the floor, and the creature falls
    with a thud. That is going to be some serious entertainment! Sound will be just
    as important as your eyesight in this new virtual world. The name of the game
    is total absorption, and you, as a composer or sound designer, will set the stage.


    Some form of surround will likely become prevalent; Dolby Digital, DTS, or perhaps
    another unknown format, with multiple audio channels intended to envelope a player
    into the experience. There is much in the works to make this reality — deciding
    on a standard; getting the hardware designers, game developers, composers, and
    sound creators all on board; getting the game player fired up to go and buy the
    new equipment. With any new format idea, it takes a few couples to see its full
    potential. But it is definitely on its way.


    Interactive audio is another concept making headway into games. For years, developers
    and sound gurus have been pondering ways to make a video game more like experiencing
    a movie. With film, music and sound effects are post production elements which
    are added to all the visual elements are. As a movie, the linear soundtrack follows
    along, setting the appropriate mood for each scene — building tension and quoting
    at your heartbeats. However, most video games are unpredictable in that sense
    and a music score cannot anticipate what will happen next to a player. Audio presentation
    methods are being developed to interact with what the player is experiencing;
    whether they are casually exploring a game level or locked in heated battle with
    an opponent, the music will change accordingly. This will enable a developer to
    have more control over the player''s experience and to create a fully involved
    experience.


    It''s given: computers will continue to get faster, and as the hardware improve,
    the game experience will continue close ahead. And it is only obvious that game
    audio will be there to take advantage of it all. The DVD format, with storage
    space of 4.8 gb, appears to be on board to replace the CD. With this, all audio
    will be at least 44.1 kHz, 16-bit stereo. And audio technology grows to a standard
    of 96 kHz, 24-bit, surround, there will be room to accommodate. The sound quality
    will be incredible, right there in the "audiophile" range, which will drive the
    need for better recording methods, equipment, extremely talented composers and
    sound designers, and the accompanying elevated budgets.


    # 1.5 Chances of Finding Work


    With the current and future state of game audio, you can imagine the need for
    skilled audio craftsmen to provide content. What are your chances? With the hundreds
    of game companies'
