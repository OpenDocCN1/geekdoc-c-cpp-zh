    ![](img/34a845a3c9f2c249ab60e8ba2e1b7e3b_99_0.png)


    # Telephone Marketing


    Pick up the phone and start calling around. Ask for the audio department or the
    person in the company in buying outside content. The smaller the better. Large
    companies tend to have roadblocks in place which rarely be negotiated. The switchboard
    operators and receptionists are highly skilled at sensing salespeople and are
    usually under strict orders to stop them. If you run into this situation, explain
    that you are a game composer or sound designer and wanted to let them know of
    your ability. You''re not an office supply guy with extras of paper or toner until
    helps breaks the ice. Unless you are the 20th-poser that morning, you might get
    forwarded to a contact within the company. At worst, they''ll patch you to the
    dreaded Human Resources Department.


    Another trick is to ask the name of the person who buys audio, say thank you,
    and call back a couple days later asking specifically for them. If you get through,
    great! If not, ask for voice mail and speak your introduction. You can also ask
    for the person''s email and try an introduction that won''t be surprised if you
    don''t hear from anyone right away, if at all. They may need you for their current
    project, but keep your name handy to the on. Play the odds. Do this enough and
    you''ll succeed. Again, at worst, you''ve made your introductions, they know you
    exist, and all you have to do is following up every few months to keep your name
    fresh.


    This method can be a costly, especially if you end up making distance calls. There
    is nothing that says you have to call everyone the first week. Spread out over
    several months — breaking up the cost into more manageable chunks.


    # Internet and e-Marketing (Pronounced "Spam")


    This is by far most bang for your buck and the easiest way to scope in the people
    who make decisions. Case in point: For every 100 letters I mailed the old-fashioned
    way, I got roughly 10 responses. Seven were, “We’ll keep your information on file”
    letters and three were requests for a demo. If I was lucky, I''d have one bid
    request out of that whole effort, but it was a lot of work for little reward.
    Rarely did it lead to a job.'
