  md: '# 108 — CHAPTER 5: The Bidding Process


    # 5.5 Contract Payment Options


    During negotiations, the single most recurrent is the payment option. Cash flow
    is important to both parties. You, the contractor, endeavor to receive payment
    in your favor while the developer strives to keep their money as long as possible.
    It is a standard practice throughout the business world and not confined to the
    gaming industry but frustrating nonetheless. There are a few options to ease the
    pain on both sides of the fence and help make the bid more attractive. Consider
    offering some of these options to ease the financial pinch a developer may be
    feeling. Remember, you''re the problem solver and there is no reason you can''t
    take that beyond doing music and sound.


    **Salary or hourly wage.** The earliest scenario, by far, is to be brought in
    part of the development team and accept either a salary or hourly wage as consistent
    work is produced. No squabbling or haggling of terms of contract are changed and
    giving the sound creator sense of project ownership highlights of this option.
    This situation is best for well-funded developers but totally unrealistic if no
    development is available.


    **Payment according to milestones.** Given a list of required audio content, milestones
    and have the developer schedule payments according to them. The downside is that
    this will force them to plan ahead and have exact specifications nailed down.
    The plus is that it motivates you, the sound artist, to meet them.(I''m always
    more focused when I have a deadline to work towards.) If they dont want to be
    tied, pay payments of 1/2 up front, the other 1/2 upon completion, or variations
    in them, are also feasible.


    **Good faith, barter arrangement, and small royalties.** This example has wide-open
    possibilities. By starting with a small “good faith” payment, the developer is
    showing commitment to the project and the sound artist. Because cash may be a
    problem, barter arrangements of some type are workable depending on each other''s
    needs and offerings. Trades of computer equipment, web space hosting or site design,
    graphics such as logos are all practical. Royalties on the backside would out
    the final payment for services. This option is great for the newer, cash-starred
    developer and for the sound creator who is part-time or has other income.


    **Straight royalties.** By not taking any payment during the development process,
    the sound artist would be entitled to a larger portion on the backside. A generous
    royalties schedule would be established to pay the content provider after the
    title is released. While this is the best case scenario for a developer, because
    the sound creator is assuming the risk, it can be the worst for you. Newer composers
    and sound designers may elect this as a way to become established and for the
    steady cash flow as they work on other titles. Wiser ones will consider it if
    the game has hit potential.'
