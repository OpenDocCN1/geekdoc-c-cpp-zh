  md: '# The Industry Now — xvii


    sounds will be implemented, as their sounds will be created. Having a strong understanding
    of game mechanics, programming techniques, and platform limitations will make
    your life much easier.


    Until recently, software design had not been recognized as a well-regarded, well-paid
    industry — mainly due to the lack of game system fidelity. In the past, PC speakers
    and console systems had limited audio fidelity and the key of resolution to sound
    a minimum. In recent years, there has been a strong effort to enhance sound for
    games, and next generation systems and speakers have made great strides to address
    memory and bandwidth for audio. Dolby encoding, DVD drives, surround speakers,
    and increased memory have given sound professionals a new field to play on.


    One fascinating aspect about the games industry is that its technology changes
    constantly. With every new technological development, enhanced software package,
    or hardware device, each new game title strives to out-perform the previous one.
    As technology improves and bounds every year, each game title attempts to implement
    new ways of making games faster, bigger, and louder. For an audio professional,
    this means constantly adapting to new techniques and establishing new compositional
    methods to keep up with an ever-evolving industry.


    Because the games industry tends to be a “hit-driven” business, many titles these
    are based on major motion picture properties, allowing game players to interact
    with worlds originally created for the silver screen. Almost every office hit
    will span multiple interactive games based on the property. This is also true
    for well-known superheroes, comic books, sports teams, racing cars — you name
    it. For a game audio engineer and composer, this often means working on prestigious
    titles — sometimes working with star talent and being involved with Hollywood
    productions.


    Another interesting observation about the games industry is the youthful of its
    creators. In most companies, the average age of game development ranges from 20–40
    years old. This is not an industry of children, but rather a generation of people
    who grew up playing games, and chose to deviate from a “normal” career route.
    Until recently, a career in the games industry was seen as a low wage job for
    kids. However, in recent years, the games industry has yielded higher profits
    than the music and film industries combined. Because musicians and audio designers
    alike know the struggles of justifying their careers, the game industry is a great
    place to fit in…and never have to a tie.


    Given the relative youth of the industry, the game community is unfortunately
    void of experienced role models. There are not many well-known game professionals
    who stand as an example of how to make a living in games. Sure, Bill Gates is
    an inspiration for computer entrepreneurs everywhere, but there aren’t many game
    audio professionals who lead the load for future generations.


    The Complete Guide to Game Audio serves as that role model for game audio and
    is a great resource for anyone looking to enter this fascinating industry. New
    and old engineers alike will find this book as a strong reference tool to understand
    the boundaries of the interactive arena'
