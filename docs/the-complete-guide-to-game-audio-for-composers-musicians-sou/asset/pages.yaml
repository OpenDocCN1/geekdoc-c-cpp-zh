    a diverse and changing world, and this book can be your passport to a reward-
    and fruitful career.


    People often ask me how I got started in the games industry. Being a game composer
    or sound designer isn''t the most well-known profession, so how does someone actually
    get started? Well, the first rule of thumb is... you gotta games!


    Defender, Tempest, Asteroids, Choplifter, Battle Zone, Phoenix, Sinistar, Dragon''s
