    the smaller developer, you can offer budget solutions dependent on the information
    and for payment up front, at milestones, royalties, lease or even better agreements.
    We of the development team do not want to doom a project before it has a chance.
    Flexibility is a practice of many sound professionals. As long as the compensation
    is worthy of your efforts, there is nothing to lose.


    # 10) Who will publish? Method of distribution?


    This question is especially reasonable if the possibility of royalty payments
    surface in the negotiations. A game which will be self-published by a new, inexperienced
    developer and distributed by word of mouth does not exactly scream screen. A well-established,
    veteran development team, on the other hand, who is a giant publishing and distribution
    company and an onslaught of marketing ultimately has a much better chance. Everything
    is negotiable and it pays to have all the factors in the beginning to make an
    informed decision.


    # 11) Payment method?


    If a developer has a standard method of payment, find out and determine if it
    is acceptable for your needs. No one has problem dealing with cash; some up front,
    after acceptance of the first pass, and the rest upon final approval. It is the
    standard for most companies.


    But if there are other methods in mind, royalties on the backside, a salary or
    hourly wage for example, some discussion may be warranted. Would you want to shoulder
    the risk? You might consider the gamble, if you are willing to help keep your
    production costs on the front side for a much larger piece of the pie on the end.
    It might be well worth your time. You never know when that game will become a
    smash hit.'
