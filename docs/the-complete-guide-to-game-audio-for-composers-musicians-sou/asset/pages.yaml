    # 6.3 Navigating Negotiations


    Musicians and sound designers are not taken to be serious businessmen. The free
    and easy lifestyles we popularly live makes us a little too “wild” for the business
    world and we are quickly pigeon-holed into this category. One of the unique traits
    that set game composers apart from the rest of the musician world is that we have
    a fairly good nose for business — we have to be in order to run a successful company.
    But the stereotype is so well entrenched, you''ll have to try much harder to prove
    yourself.


    The demo package is the game company''s first look into what we are. The bidding
    process is their first chance to see whether we have brains to go along with our
    creative genius. The contract negotiations will set the tone of your business
    relationship, whether you are the whimsy, prima donna originally featured or a
    professional service provider with a good sense for business and honest concern
    about the product''s success.


    Normal contract start by the person who brought you on board (usually the game
    producer) or emailing you their contract. You spend a few days looking it over,
    talking with your legal advisor, adding points, countering with their version,
    or simply signing. If you had something to add to, they''ll mull it over, talk
    to their legal people, hem and amongst themselves, and will counter with their
    new version. At this point, you will find it easier to just pick up the phone
    and talk directly to the producer. Emails can clear the process, becoming too
    consuming or harmful comments out of context, unintentionally offending someone.
    You can safely discuss the points which are most important, reach some sort of
    agreement, wait for their legal department to get the final OK. Once they''ve
    finalized the contract, you''ll sign it and then get down to what you''ve hired
    for: making music and sounds. Simple enough.


    The more complicated negotiations may require you to fly to their office and meet
    face-to-face with a boardroom of their people. It doesn''t happen as much as you''d
    think, so don''t get nervous. Be prepared for this possibility only when you start
    dealing with large companies with large budgets and large interests.


    # 6.3.1 A Real World Negotiation


    Out of the deals I negotiated, there was only one which didn''t go very well.
    Most of the time, it''s a simple business affair with the two parties calmly discussing
    the needs of both companies. We resolved them amicably and moved on with our lives.
    This particular example was definitely a case of big egos on their and concrete
    stubbornness on my part and in the end, both walked away — without sound for their
    game and we without a contract. I mention it here as a real world case of what
    can happen when the two sides see eye-to-eye. Maybe we can both learn something.


    I was called to a game developer''s office to discuss a work for hire contract
    with the company''s president and executive producer. The game was funded by a
    big name in Hollywood and, on the outside, looked to be a promising title. It
    was to be released for the PC and Play-'
