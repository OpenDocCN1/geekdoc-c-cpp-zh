    In this example, recouping our costs and covering our minimum salary requirements,
    we''ve determined the cost of one finished minute of music to be $187.78. If we
    lowered our salary or were able to complete more music in less time, the price
    would go down further — what you make on a job being on your bargaining range.
    First out, you will probably only be able to charge $250–300 per finished minute
    of music, which coincidentally is margin added to our cost. It''s a fair price
    for someone with average music and no game experience. When you factor in the
    number of minutes in a game, say 45 minutes to an hour, that would be $11,250
    to $15,000 for a project using your instrumentation and no outside talent. Not
    a bad start considering this doesn''t even include royalties, bonuses, and any
    soundtrack album releases you might negotiate.


    Sound design is another animal. If you consider it another service of your business,
    it takes your time away from doing other creative activities so your overhead
    will be the same as. If you are only doing sound design, your overhead will be
    much less; the only equipment needed is a computer, sound library, and remote
    recording gear most. Looking at the previous example and offering this as another
    benefit of our business, cost on a single sound effect is $91.39. Adding a 30%
    profit margin, $118.81 would be our fee.


    Can you get much in the games industry? Not at first. Sound-effects only tend
    to be on a lower scale — the games market not tolerating the same pricing structure
    as music. The big boys can command around $15,000 per project doing sound effects
    only this is after a few years under their belts. New sound designers in the games
    business can expect a rate of $25 per hour or even $25 per sound effect. It varies
    with the deals you work with.


    I have to make the same amount on any project — sometimes it''s at an hourly rate,
    other times''s per sound effect. When I started sound design several years ago,
    I started at $25 per sound effect. As my skills increased, I changed to $25 an
    hour. Later, it changed to $50 per sound effect, then $50 an hour. Nowadays, I
    charge $75–100 per sound effect or $75–100 an hour, depending on the situation.


    Producers have many different ways of choosing sound effects and when you will
    have you and redo sounds to death to get them just. My train of thought is usually
    this: a small project requires five specific sound effects. If I send 15 sound
    effects to a producer I have crafted'
