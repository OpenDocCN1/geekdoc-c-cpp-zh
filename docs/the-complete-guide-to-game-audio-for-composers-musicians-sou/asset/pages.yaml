    # 2.2 Tools of the Trade


    Musical arsenals vary greatly with each composer. Some prefer a minimalist approach,
    to keep technology from interfering with the process and allowing them to create
    truly unencumbered art. Others have to possess all the latest and greatest gadgets
    and gizmos, computer wizardry, and plug-in making boxes — preferring to let technology
    drive the creative course. Both extremes produce appropriate games that serve
    the virtual experience well. Most of us, however, are somewhere in the middle.
    The trick is finding what works for *you*; whether it be leading the pack, using
    up-to-the-minute hardware on the leading edge, or working comfortably with the
