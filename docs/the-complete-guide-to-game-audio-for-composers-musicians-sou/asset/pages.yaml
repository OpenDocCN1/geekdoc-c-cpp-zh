    # 1.6 The Rewards


    Providing audio for games can be a unique challenge and sometimes a job well done
    can be reward in itself. But satisfaction alone cannot put on your table or buy
    the new gear you have to have. While the money can be quite good, and often is,
    there are other entements which make composing for games a worthwhile endeavor.


    You''ve all heard the statement, "the perfect job is being able to take what you
    are enjoying and making a living at it." I don''t agree. The constant throughout
    my life has always been music, and to me, it makes perfect sense to pursue it
    as a career. There is no reward than following your passion and getting someone
    to pay you to it.


    Jamey Scott, in-house composer and sound designer for Presto Studios in San Diego,
    California, is a perfect example. He has serious formal music training and experience
    which worked on several projects for Compton''s Interactive Encyclopedia, Compton''s
    Interactive Children''s Bible Stories, MGB Babes in London Interactive CD, Presto''s,
    and the Journey Project III — Legacy of Time, and could basically write his own
