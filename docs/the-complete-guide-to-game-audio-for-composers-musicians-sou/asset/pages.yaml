    had changed in the interim to make the new effects sound different. By adjusting
    all the effects at once, the chance of this is more remote, and more consistency
    results.


    An additional step to ensure consistency across your audio is to produce all the
    game sounds using the same processor settings. Using the same EQ, volume, reverb
    settings, and so on will furnish them with a similar feel. Jamey Scott uses this
