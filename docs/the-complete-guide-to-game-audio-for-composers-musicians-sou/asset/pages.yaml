    Another thing I started doing was to introduce lots of musical samples into the
    cartridge MIDI files. Back in the old days of the Sega Genesis, people would use
    the sample chip to play a scratchy sample ''FIGHT!'' or use it to intro the company
    name ''SEGA''. I decided: why not have that sample channel playing as much as
    possible? I had convinced programmers that if they gave me enough space, I would
