  md: '# CHAPTER 4

    Finding and Getting the Jobs


    It''s official. You are ready to tackle some challenges and make some money. Unlock
    the front door, put out your "open for business" shingle, turn on the lights,
    and prepare yourself for the onslaught of customers who have been patiently waiting
    for this moment. The phone starts ringing off the hook. Life is good. Not! Unfortunately,
    you''re going to be a bit more proactive than that and get a little dirt under
    your fingernails first.


    # 4.1 Marketing


    Drumming up business and getting the customers through your doors with wads of
    cash in hand will take some considerable effort. For most of us, playing the role
    of marketing director and salesman is as unnatural as brushing your teeth with
    your other hand. The best part, though, is a bit of practice and patience, it
    can be yet another act we do without even being cognizant of it. After awhile,
    you''re throwing a dash of "marketing" with everything you do. It''s not difficult
    really. Don''t let the fact that there are college degrees in marketing, huge
    companies that do nothing marketing, and individuals who spend their waking hour
    as marketing experts intimidate you one. We can use some of tricks and hard won
    secrets to our advantage.


    # 4.1.1 Tell Everyone


    The very first thing you need is to tell everyone what you do. Mean everyone!
    Don''t be shy and play coy little games. Don''t consider it bragging or showing
    off, and while it might feel like it, it''s actually "marketing." Tell your mother,
    father, brothers, sisters, grandparents, aunts, cousins, friends, coworkers, and
    neighbors as a start and see what happens. Whether you know it or not, somewhere
    in that small group, somebody knows someone who has a friend whose brother''s
    cousin''s girlfriend went to school with a guy who is a programmer at a game company.'
  merge: -1
  pgno: 91
- img_proc: true
  md: '# 76 — CHAPTER 4: Finding and Getting the Jobs


    That guy can be your foot in the door! You''ll never meet unless everyone knows
    you are trying to do audio for video games — so tell everyone! I''m not kidding
    about the kind of connections you can make by being open about your new endeavor.
    Let me share a couple of my success stories:


    # Tale #1


    After six months into my business venture, I decided to take a couple weeks off
    and serve my country as I did from time to time as a military reservist. I received
    a phone call from an individual was gathering information about doing the same.
    During the course of our conversation, I asked him what he did for a living.


    “Oh, I’m the President of a software development company here in town.”


    “No kidding!” “Do you do any games?”


    “Yeah, we do contract work for other game companies, mostly programming, but we
    are gearing up for one of our own game projects.”


    “Sounds like fact. Do you foresee needing music for your game?” I queried.


    “As a matter of fact, we just let our sound go; he just wasn''t working out.”


    “What a shame. We know, you, I do music. I just run a music production company,
    maybe we ought to get together.”


    As turned out, we lived two blocks from each other and the next day at my studio.
    After playing some cuts from my demo reel, I was shaking hands with the President
    and Vice President of this company, signing on for their first game. Not bad considering
    that all I was told what I did. It turned out to be my first game project and
    led the way to many more.


    # Tale #2


    One evening I received a phone call at the house. My wife handed over the telephone
    and said it was someone named Mike Post. I chuckled and proceeded to give my friend
    a hard time. He always calls up as someone “famous” and I smiled at his originality
    on this one. Well, it out wasn''t the friend I thought and the voice was Mike
    Post after all! Surprise, he''d always been sort of a TV theme composer idol of
    mine, my favorites being Quantum Leap, Magnum PI, and the A Team. It was quite
    a treat. After adrenaline rush returned to a more controllable level, I asked
    him what prompted the call. After all, it''s not every day I get phone calls out
    of the phone from real life people.


    The story: a guy met at the local airport to send me a demo. He really enjoyed
    music, shared the passion, and wanted to hear what I was up to. In his garage,
    he was listening to my tape when a friend walked in. Liking what he heard, he
    borrowed the tape to let another friend of his give a listen. He mailed it to
    a golfing buddy of his who “plays music in Hollywood.” Turns out this golfing
    buddy was Mike Post! So Mike was telling me that he never listens to demos sent
    to him because if he never hears them, he''t be sued for stealing ideas (or something).
    But at his friend''s insistence, he listened to mine and was calling to talk about
    my'
