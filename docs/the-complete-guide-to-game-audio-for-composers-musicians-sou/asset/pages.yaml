    # 11.2 Nintendo GameCube


    Nintendo''s next offering in their successful console lineage is the GameCube.
    The physical console may be smaller, substantial improvements under the hood promise
    a quality gaming experience. There are improvements in every feature across the
    board including a proprietary 1.5 GB optical disk (instead of the previous game
    cartridge) that allows for larger file sizes and, of course, more audio.


    The GameCube''s main controlling unit is a 405 MHz, IBM Power PC, 33D enhanced
    processor unit known as "Gekcko". 24 MB of IT-RAM, considered the fastest RAM
    available, acts as the main system memory, with 16 MB of Auxiliary RAM (A-RAM)
    as the main source for elements such as audio data. Associated with the GPU is
    the referred to as "Flipper" where graphics, the AI, and audio processing are
    accomplished. Other elements sharing the pipeline, audio is processed as a separate
    entity on a special Digital Sound Processor (DSP) mounted to Flipper without compromise.
    This chip is a proprietary DSP with an attached "Accelerator" hardware that organizes
    data, decodes PCM samples, and flows audio to the Audio Interface. The Audio Interface
    is 2 channel, analog or digital connection capable of 48 kHz, 16 bit, stereo or
    surround encoded.


    The basic path of audio data starts with being loaded into RAM where it is needed,
    the DSP manages the information, adds any chorus, reverb, or delay effects and
    sends the audio through the interface to the playback system. Audio from the optical
