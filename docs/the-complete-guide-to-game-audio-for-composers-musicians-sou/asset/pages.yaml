    types of games: simply getting your sound effects, voice, and music heard intelligibly
    the general din. Any subtlety in a music track or sound effect will be lost in
    a busy arcade. Most coin-op audio providers will make sure your audio sounds brighter—either
    EQ or some sort of effects processing—to help the audio cut through the noise
