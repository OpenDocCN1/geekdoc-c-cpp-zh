    to composing. Nothing ruins your creativity faster than having to stop to troubleshoot
    or look up something in a manual. The more you know, the better.


    # Musicianship


    Your musicianship should be well-practiced and solid as a rock. Sequencers and
    multi-track recording software can enhance these abilities and fix mistakes but
    true, building upon a solid foundation will save you much headache in the end.


    I also recommend that regardless of instrument of, become proficient on the keyboard.
    The MIDI keyboard, next to the computer, is essential equipment which has the
    capability to access all other MIDI instruments in your arsenal. It is a focal
    point by which you can control all other keyboards, sound modules, electronic
    drums, and even start and stop your computer recording software by. This workhorse
    is in constant use and must have to master.


    The keyboard, as a musical instrument, can be highly expressive — nearly unlimited
    sounds can be played from one. Musically speaking, this knowledge and power is
    inspiring, but too much one direction can become state and character.


    If you are already a keyboardist, pick up the drums or guitar — anything than
    the keys and learn to play. It will open up another world, and give you a better
    understanding of how music works plus another instrument to compose on. Styles
    can vary widely when composing on piano for one tune and guitar. Your outlook
    will always be fresh and the music will reflect positively.


    Another advantage will be self-sufficiency. While I enjoy composing and playing
    with other musicians, it saves time not having to wait for a player to show, enabling
    you to get your work done faster. The clock is running and busy production schedules
    are not always flexible enough to accommodate. Most composers in the game industry
    are multi-instrumentalists — having so out of necessity.


