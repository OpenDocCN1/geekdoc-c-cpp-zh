    # 12.4 The Next Step


    After the music and sound effects are created, other matters should be focused
    on to guarantee the audio will feel like the game like a glove. Maintaining consistency
    is the first issue a sound designer and composer must apply. All sounds need the
    same character; that is, the element that cements it to this, and only this game.
    Having a sound distract the player during gameplay because it sounds out-of-place
    breaks that spell.


    The best way to ensure consistent game audio is to have the audio provider devote
    time to only your game for the duration of the project. Ask prospective contractors
    front whether they can commit solely to one project at a time. This focus alone
    will obtain the consistency you are pursuing. For instance, Joey Kuras had to
    revisit the sounds he created for Tomorrow Never Dies months after he had completed
    the initial list. After designing the new sounds, the old ones didn’t sound right.
    He ended up spending extra time EQ and adjusting'
