    # 12.2 Working with Contractors


    The process of determining the appropriate audio content, creating it, implementing
    it isn''t always a painless experience. Game producers and contractors need to
    understand each other''s professional needs and responsibilities the audio creation
    process becomes less grueling to both. This section describes the process of determining
    what you will need from a third-party audio expert and what that person will need
    from you.


    Early concepts of art and gameplay have a tendency to change and continuously
    evolve, music and sound design at the outset of a project is usually a waste of
    time. Producers have the difficult task of trying to determine the audio needs
    of the game early in the development cycle, and if a contracted sound is used,
    the producer must find someone whose skills and credits match those of game. When
    you are spending up to $30,000 for sound effects or $75,000 for music, you want
    to get your money''s worth.'
