  md: '# CHAPTER 9


    # Creating Sound Effects for Games


    Sound effects are an integral part of any game, equal in importance to artwork,
    music, and game play. Good sound effects create an impact which rounds out the
    entire gaming experience; without them, that experience would suffer. They are
    designed to completely absorb the player into a virtual world, making believable,
    entertaining and satisfying. Continuous ambient sounds keep the player from being
    distracted by the “real” world, ensuring game silence doesn''t ruin the immersive
    effect of a game. Foley sounds assure believability. Action effects provide guttural
    satisfaction.


    In this chapter, I won''t pursue the psychological aspects of sound and its effect
    on the human psyche. For those who are serious about this particular aspect of
    sound recommend the subject to complete your skill set and increase your design
    effectiveness. For now, I''ll focus on the creation process for games, how particular
    sounds are chosen, how they are, and how to make the process less grueling to
    both development team and sound designer. I asked fellow sound designers and game
    producers in the industry to share their experiences, their sound creation and
    selection process, and how they come up with particular sounds. We''ll also delve
    into how to create professional sound effects and prepare them to drop into a
    game.


    # 9.1 The Creative Aspects of Sound Design


    Anyone can do sound. Not everyone can do it. The difference between the average
    sound “hobbyist” and the professional sound designer is not just the professional
    gets paid, it is an intangible quality running through their veins which allows
    them to create audio magic of thin air. If you are a musician, you already know
    what I mean. We share the same passion for excellence with the expert sound designer
    — having spent thousands of dollars on our “hobby” just for the sheer joy of making
    our own brand of genuine noise. Musicians, and anyone who have the desire, can
    put this same enthusiasm into making great sound effects for games.'
