  md: '# 294 - CHAPTER 12: For the Developer


    Each year, the quality of video game music and sound effects gets closer and closer
    to that of movies. As the sound quality increases, so does its file size, and
    the trade-off between size and quality must be debated.


    Always specify that you want your sound effects created in the highest quality
    possible.


    Because new technology is now becoming mainstream, some development teams may
    soon opt to go even higher, to 96 kHz, 24-bit audio. Why? Because you want to
    develop the sounds with high fidelity then convert to what is needed for the game.
    If a game needs 22 kHz, 16-bit stereo audio and it is discovered later that it
    can fit 44.1 kHz, 16-bit stereo, it may already be too late for the content provider.
    Attempting to convert almost unacceptable noise to a recording — you cannot do
    it. You will have to start the whole recording process from scratch.


    One company decided to a television commercial for its game and wanted to use
