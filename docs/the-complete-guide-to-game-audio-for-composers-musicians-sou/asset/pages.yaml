    of racing games equals high-energy techno or rock music. Medieval games use heavily
    orchestrated. The trip to the store can be an important fact-finding tour. It''s
    something you''ll do on regular basis after you''ve been consuming for a while
    to remain on current things.


    Keep in mind, when browsing through the retail aisles, it is usually the major
    game companies that can command shelf space. Retailers are only interested in
    moving product and aren''t interested in having an obscure game take up space
    for the one or two individuals who might buy it. High volume games are the money
    makers. Take a look in several different retail outlets and smaller software "game-only"
    stores for a broader offering.


    # 4.2.5 Game Developer Headhunters


