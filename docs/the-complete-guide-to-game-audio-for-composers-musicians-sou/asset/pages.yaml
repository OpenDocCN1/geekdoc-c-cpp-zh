    # # 11.1 Sony PlayStation 2


    The Sony PlayStation 2 was the first of the new generation consoles to hit the
    streets. While not radically from the original PlayStation regarding the ways
    that are prepared and used, there are still improvements in quality and storage.
    Most of the, it seems, towards processor speed and graphics superb — bowing to
    public demand for “longer making games”. The use of the DVD medium and streaming
    capabilities allows for higher quality audio than years past, but it ultimately
    shows how the developer utilizes the console resources and what elements priority.


    The main processing unit on the PS2 is known as the Emotion Engine (EE) — a CPU
    capable of 128 bits and a clock speed of 295 MHz supported by 32 MB of RAM. Graphics
    capabilities are enhanced by a separate CPU, a “Graphics Synthesizer,” and 4 MB
    of embedded cache VRAM. Sound processing for this console exists on its, on a
    processor known as the IOP (Input/Output Processor), to keep from having to share
    other resources. The IOP has a cluster of 2 SPU chips allowing for combined local
    sound memory of 2 MB.


    The SPU chip allows for high quality sounds, up to 48 kHz sample rates, although
    original source files are not required at this high rate. Critical decisions will
    need to be made regarding file size and quality in order to conserve space. For
    those files that use a lower sample rate, they will be upsampled to 48 kHz at
    the time of output. Generally, most audio will be stored and implemented at a
    lower sample rate.


    As compiled, the PS2 requires conversion of audio to a proprietary format known
    as VAG (like the original PlayStation). This particular format applies data compression
    of 3:1 which can change the resolution of the sound during output, but overall,
    it is consistent. Event-based and streamed audio is mixed in the SPU2 using 48
    total voices and routed to either analog stereo or digital optical outputs for
    playback. If the player is using a Pro Logic decoder, they can experience the
    audio in Dolby Surround instead of standard stereo, a nice feature.


    The 2 MB of sound RAM can be utilized many ways, at the developer’s discretion.
    Sound effects can be stored for instantaneous playback, music or background ambience
    loops be'
