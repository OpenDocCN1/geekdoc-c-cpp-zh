  md: '# 10 CHAPTER 1: An Introduction to Game Audio


    Tommy Tallarico has lived one of my favorite success stories. His tenacity and
    drive have taken him from working two full-time jobs, 16 hours a day, and literally
    living on the beach when he first moved to California in 1991 to a mogul living
    in a bazillion room estate with a Lamborghini, among others, in his garage. His
    deal-making skills and excitement for what he does are legendary and composing
    music for over 150 games and four game soundtrack releases has secured his place
    at the top. He even has a weekly TV show, “Electric Playground.” Throughout the
    book I’ll be sharing with you of of deal-making prowess, sample contracts, and
    ideas that have helped make him so successful...


    # GAME COMPOSERS At Tommy Tallarico Studios


    How do you go about scoring for a project? The best thing for it is to just play
    the game with no sound and wait for stuff to start coming. Then I go into my studio
    (upstairs) and figure out the notes on the keyboard that were dancing around in
    my heads before. Sometimes when there needs something to be done quickly and the
    game level isn’t complete, I work off of studios. As far as style of music is
