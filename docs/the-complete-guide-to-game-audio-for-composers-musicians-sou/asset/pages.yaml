    # 5.6.1 Covering Your Expenses


    It is fair business practice to be covered for the very production costs for the
    speculative demo. As incentive, you can also deduct this from your contract after
    being hired. But, unfortunately, this isn''t always the case. Developers want
    to keep their expenditures down to a minimum and may feel that if you did the
    job enough, you''ll do it for free. My argument is: if they''ve heard my demo,
    they know my production values and should be able to determine whether I am suitable
    for the job. While I''m not opposed to a speculative demo, I believe my time can
    be spent working on real projects which pay the full fee.


    Normally, you won''t be able to charge full price for your spec demo. Any charge
    should cover "reasonable" production costs — basically your time, anything outside,
    and material fees. Your standard creative fee is generally waived. For a one minute
    piece normally sold for $1000 to $1500, $300–400 is what you can expect for the
    effort.


    The ownership issue can blur the fee structure. If a developer asks for a speculative
    demo and agrees to cover production fees you only maintain all rights to the music.
    Assuming, course, that you aren''t hired for the job, it leaves you with music
    to sell to other projects in the future and adding something to your demo reel.


    Now, let''s say you didn''t get the gig, but they want to keep the music. What
    do you have up to you. I''d guess it liked enough to use it in something and I''d
    be careful. Would you charge my full fee, they have all rights, and they call
    it. They might counter with "if you give it to us for the spec price, we''ll keep
    you in for the next project." Again, it''s totally up to what you agree to, but
    there are no guarantees and they probably won''t call despite what they say. If
    they like the composer they hired for this project, that person will more likely
    get the next one as well. It''s definitely a gamble — trying to look like the
    nice guy — but the odds are not in your favor and rarely will they call again.
    Put on your business when negotiating points like this and make sure you aren''t
    taken advantage of.'
