    # 9.9 Conclusion


    Have you ever watched a ‘B’ movie and actually liked the sound effects? Occasionally,
    the amateurish production has some charm to it, but for the most part, they are
    not very good. Would you buy a ‘B’ video game or set out to make one? Of course
    not! With all the competition for shelf space, we set out from day one to make
    a product that will be profitable and perhaps win us a few accolades from our
    colleagues in the process.


    There are no hard and fast rules, no secret formulas, and no prescribed methods
    for creating the consummate assemblage of sound effects for a game. It takes fluid
    communication and a firm vision from the development team coupled with a sound
    designer who shows no bounds to their creativity and patience. The tips and tricks
    illustrated here give a solid foundation for you to build upon and thrive in this
    gratifying industry. Knock ‘em dead.


    > For further reading on game sound design, see:

    “Tricks and Techniques for Sound Effects Design,” by Bobby Prince, www.gamasutra.com/features/index_sound_and_music.htm'
