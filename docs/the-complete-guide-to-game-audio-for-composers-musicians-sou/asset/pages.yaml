  md: '# # APPENDIX A


    # # The Grammy’s and Other Game Audio Awards


    So, fame, fortune, and the satisfaction of a job well done isn''t quite enough
    motivation for you, huh? Well then, how would you like a Grammy Award for your
    troubles? Beginning with the 42nd Grammy Award Ceremony in 2000, game scores were,
    at last, able to compete for one of those envious golden gramophones.


    The National Academy of Recording Arts & Sciences (NARAS) Board of Trustees approved
    three categories to include music written for video games:


    +   - Best Soundtrack Album for Motion Picture, Television, or Other Visual Media

    - Best Song for a Motion Picture, Television, or Other Visual Media

    - Best Instrumental Composition for Motion Picture, Television, or Other Visual
    Media


    “Other Visual Media” is the term designed to encompass video and computer games,
    multimedia, and the future possibilities of the internet into one tiny, package.
    Although no game was nominated during the first year, the band has begun its run.
    Our very game industry music notables, led by powerhouse Chance Thomas (Quest
    for Glory V, Middle Earth) and supporting cast (“Tommy Tallarico, Mark Miller,
    No Hubbard, Brian Schmidt, George Sanger, Bobby Prince, Tom White, Michael Land,
    Alexander Brandon, Murray Allen, Greg Rahn, and others) presented a persuasive
    case to the Awards Committee.


    And to think this all by accident. Chance Thomas met one of the key leaders of
    the academy and during a conversation, mentioning composition for video games.
    This man of great stature and influence scored, wrinkled his nose, and “You mean
    like Pac Man and Donkey Kong?”. While unaffected by the situation, Chance explained
    he had just completed a game soundtrack using a live orchestra and other high-brow
    instrumentation like classical guitars'
  merge: -1
  pgno: 321
- img_proc: true
  md: '# 310 — APPENDIX A: The Grammy''s and Other Game Audio Awards


    layered voices. The nose became unwrinkled and eyebrows raised in pleasant surprise.
    Now that he had his attention, he casually asked if there could be a Grammy category
    for game scores. The answer even surprised Chance, who was to write a formal proposal
    and send it to the address on the business card thrust into his hand.


    Thus began a two year journey into what Chance has described as "like getting
    a bill passed through Congress." Endless letters, emails, phone calls, meetings,
    and an ever-growing number of allies on the inside led the Awards and Nominations
    Committee to eventually review the proposal. Their interest became evident when
    they scheduled a Game Music Summit in December 1998 with a dozen of game industry''s
    top music professionals. This "Working Group on Game Music Awards and Membership"
    opened the eyes of the committee, giving them clear insight into the quality of
    game music. May 6, 1999, NARAS the announcement many had eagerly anticipated game
    scores would be allowed to compete for Grammy Awards beginning with the year''s
    42nd awards ceremony.


    This new attention can only be positive to gaming and to the music makers within
    the industry. There is no better advertisement than putting "Musical Score by
    Grammy Winner..." on the box cover.


    # A.1 Who''s Eligible?


    Because the Grammy''s are awarded to honor excellence in recorded music and the
    music is judged on its own merits, not just game soundtrack is eligible. Many
    past and current games have an outstanding score, but unless the music is available
    in its own stand-alone-format, it won''t be considered.


    To make the eligibility requirements, a game score has to be commercially available
    either as its own music CD or stored in Red Book audio format on the game CD-ROM
    or "enhanced" CD (to play on a standard CD player). NARAS has the exact definition
    of a commercial release, but for our purposes, it must be a serious commercial
    distribution and not from our own "vanity" label, i.e., not burned on our CD-R
    and available only through our personal web site.


    ![](img/34a845a3c9f2c249ab60e8ba2e1b7e3b_322_0.png)


    > Figure A.1 This is where all it began for game scores — the 42nd Annual Grammy
    Awards. While no game scores were nominated for a Grammy, the long road to eligibility
    had finally come to fruition.


    # A.2 NARAS Details


    Are you interested? Let''s talk about how to become a part of it, shall we? There
    are three categories an individual may join in for the Recording Academy:'
  merge: -1
  pgno: 322
- img_proc: true
  md: '# Applying — 311


    **1. Voting Member.** This is where everyone wants to be — an voting member of
    the Academy. You and your peers determine who will be nominated and who will win
    a Grammy by two separate rounds of voting. Professionals with creative or technical
    credits on six commercially-released tracks (or their equivalents) and those who
    have had credits as a vocalist, producer, songwriter, composer, engineer, instrumentalist,
    arranger, conductor, art director, album notes writer, narrator, music video artist,
    or technicians are eligible in this category.


    Proof, such as photocopies of album jackets or liner notes, are required.


    As a composer, most of us will be eligible in several categories — from song-writer,
    arranger, engineer, musician, and producer. And if you have at least six tracks
    on a single game, or by a combination of others, you are eligible for this category.


    **2. Associate Member.** This non-voting membership is open to creative and technical
    professionals with fewer than six credits and other recording industry professionals
    such as writers, publishers, authors, label staff, and artist managers who are
    directly involved, on a professional basis, in the music business.


    By joining this category, you are getting involved and showing your support for
    the process. And after you have six credits, it is an easy transition to Voting
    Membership status.


    **3. Affiliate Member.** This category of supporting members is made up of music
    students, music educators, music merchants, music therapists, and others whose
    professional interests are closely aligned with the goals of the Academy.


    # A.3 Applying


    The applications process is fairly easy.


    +   - Go to: www.grammy.com/academy and download the latest Adobe Acrobat file

    - Email: memberservices@grammy.com

    - Call: (310) 392-3777 for an application


    There is also an application in Adobe Acrobat format on the companion CD-ROM.
    Fill it out, mail or fax it back, along with any proof of participation and membership
    fee and you are set. After the Academy''s membership committee reviews your application
    and verifies your eligibility, you will receive notification of their decision.


    If applying for Voting Membership, you must list your credits and show proof by
    a copy of the album jacket or liner notes. Associate membership also requires
    proof of credits (if you have less than the six credits for voting status) or
    send a business card and detailed description on your company letterhead outlining
    any professional affiliation to the music industry for consideration.


    # A.4 Other Game Music Award Possibilities


    While NARAS is the most prestigious organization to recognize musical achievement,
    we are not the only ones who acknowledge excellence in our work. The Academy of
    Interactive Arts'
  merge: -1
  pgno: 323
- img_proc: true
  md: '# 312 — APPENDIX A: The Grammy’s and Other Game Audio Awards


    and Sciences (AIAS) offers the Interactive Achievement Award in the Best Sound
    Design and Best Original Score at their yearly presentation. This previously combined
    category was split after a proposal, considerable lobbying, and follow up by a
    new familiar name, Chance Thomas. Awards are usually presented at E3 at GDC. This
    is also a superbly way to show your support for continued industry excellence.
    "If we support and nurture, our academy," Thomas adds,"it will become meaningful
    to our careers in offering education, networking opportunities, legislative support,
    and of course, an award that means something to our peers." An application, for
    those of you who are interested, can also be found on the companion CD-ROM.


    More information and membership information on this growing organization is available
    on their web site, www.interactive.org


    Additionally, there are also several industry- and magazine-sponsored events that
    hold their own yearly awards competitions. The Electronic Entertainment Expo (E3),
    the Game Developers Conference (GDC), Independent Games Festival (IGF), and PC
    Gamer Magazine are among some that recognize achievement in various categories
    including music and sound design.


    And you thought nobody would care about all your hard work. Granted, it wasn''t
    always that way, but thanks to many of our long-established colleagues in the
    games business, we now have something to show for it beside a paycheck.'
