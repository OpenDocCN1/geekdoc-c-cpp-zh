    # 12.1 Understanding Sound


    Video games are pure entertainment that can stimulate our senses. The ability
    to provide quality sounds happens to be one of the most recent technological advancements
    to game evolution. We have graphics drawn with millions of colors and worthy artificial
    intelligence for many years, but audio implementation and playback scenes have
    not caught up with our expectations until recently. With these new advancements,
    we are discovering the need to be skillful and in control of what the player feels
    and feels on an emotional level.


    The games industry is experiencing what the film encountered when sound was introduced
    into movies. Technology has advanced to the point where simple "bleeps and bloops"
    have gone to 6-channel surround sound, full orchestral scores, Hollywood sound
    for every tiny thing, narration, character voices, and multi-player voice interaction
    — all competing for a player''s attention. The aural experience has gone literally
    insane!


    Our goal is to use music and sound to enhance the player''s encounter, not distract
    them. We want the players to enjoy the audio, not turn it off. We want them to
    become totally consumed by the sounds and sounds of color. We want to tell their
    friends! Before that can happen, though, we must understand what sound and cannot
    do for us.


    # 12.1.1 The Psychology of Sound


    There is a certain psychology associated with what we hear and what we experience.
