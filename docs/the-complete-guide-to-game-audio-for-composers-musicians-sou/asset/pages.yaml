  md: '# Preparing your Studio for Surround Sound – 43


    # 2.3.3 Surround Tips


    Dolby Pro decoding relies on amplitude and phase differences between the two channels
    of a Lt/Rt signal to extract the four channels. As a result, there are certain
    things to keep in mind when mixing in Dolby Surround.


    +   1. Only one signal can be steered at a time by a Pro Logic decoder and this
    must be the dominant signal. The rest of the mix is distributed equally among
    the remaining speakers.

    2. The surround channel rolls off at frequencies above 2 kHz, so you may notice
    this limited high-end frequency response of the surround channel in certain situations.


    When mixing with four channels, there are some general guidelines recommended
    to obtain good results.


    +   1. If you want to hear exactly what your audience will hear, it is best to
    monitor and playback through a decoder.

    2. Track and pan the sound of all important objects continuously as they move.

    3. Although the dominant signal is the only sound being steered by the decoder
    at any one time, it is still OK to pan multiple signals in different directions.
    When a signal is no longer dominant, the decoder finds the next one to steer.
    Therefore, it''s important that all signals are positioned properly even when
    they are not dominant.

