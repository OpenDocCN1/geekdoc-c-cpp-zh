  md: '# CHAPTER 12: For the Developer


    the game soundscape is every element that makes sound: the music, the sound effects,
    and the narratives. It is the purposeful blend of these elements that form an
    organized presentation known as a “soundscape.” Without this type of order, there
    is audio chaos.


    As a developer, you must concern yourself with the overall balance of graphics,
    gameplay, and audio. Before you can do that in earnest, though, you must treat
    the audio features as a single entity, the soundscape. Some developers have dedicated
    audio directors or producers whose whole function is the coordination of the project’s
    sound. Others utilize a single person or audio company for the music and sound
    effects and rely on their expertise to harmonize the efforts. Both are steps in
    the right direction and I applaud those who are serious enough to pursue these.


    The complexity and density of any music will be determined by its purpose. If
    it serves as an opening sequence, a cinematic scene, or menu screen, it can be
    busier. If it is to play as background ambience, extra care should be taken to
    make the music simple, using lesser-melodies and percussive elements. If the music
    serves its purpose, it will not compete with other audio.


    Sound effects should normally take priority in the soundscape and not be buried
    in the music. Music with a lot of mid-frequency activity will encourage the design
    of sound effects that stick more to the high- or low-frequency ranges. If sounds
    are created with the music in mind, they can be deigned to compliment the sonic
    activity already in progress.


    Narratives, or voice-overs, are primarily located in the middle of the frequency
    spectrum. Instruments such as piano, organ, guitar, and saxophone have a dominance
    there too. A concerted effort must be made to prevent a blazing guitar solo play
    over important narration; a game winning could be lost in the mix.


    When the final audio pieces are assembled, take some time to ensure an equitable
    mix. The first instinct is to reduce volume levels of offending audio in order
    to hear them with priority. If there is time before the project deadline, resist
    that urge and look for other solutions instead. All it might take is equalization
    adjustment to make the one stand out or to produce a hole in the spectrum. You
    want all of the audio to be heard clearly. Pulling a sound out of the mix is like
    casting it aside; all of the audio serves a purpose and it is extremely important
    that it be heard as intended.


    #  12.1.3 Size Versus Quality


    Composers and sound designers normally create their audio product with excellence
    in mind. Music and sound effects are saved to digital files that can be large
    in order to preserve their sonic integrity and high quality. The typical standard
    is:


    +   - 44 kHz sample rate

    - 16-bit resolution

    - 2-channel stereo'
