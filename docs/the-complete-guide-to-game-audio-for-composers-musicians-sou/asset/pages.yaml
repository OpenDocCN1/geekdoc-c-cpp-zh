    # 6.5.1 Sample Non-Disclosure Agreement


    The following example is a complete Non-Disclosure Agreement — the type of document
    you will normally be signing prior to obtaining any detailed information on a
    project. It has been written by a contract lawyer to cover every detail. This
    is a standard format in the industry. You will sign many in your career. Most
    are primarily concerned with guarding company secrets, but you may occasionally
    find wording which requires you to return or materials used to create a project
    when the relationship is terminated. Use when dealing with those types of contracts.
    Make sure, if they deal with your work product directly, it does not override
    any other prior agreements and ensure the project contract specifically states
    the pertinent paragraphs in the NDA regarding your interests. You don''t want
    to be faced with contractual conflicts in this court where a good lawyer could
    distort facts to say you were the one breaching the agreements.


