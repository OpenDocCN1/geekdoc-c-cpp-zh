    # The Bidding Process


    # 5.1 How Much Do You Charge?


    Game sound designers and music composers are constantly bombarded by this question.
    Our first instinct is to answer back, “How much do you have?” or my personal favorite,
    “For projects I know nothing about, my standard fee is one million dollars.” Though
    we never actually say it out loud, underneath our happy-go-lucky artistic exterior,
    the businessman inside is thinking it. A list of questions and pertinent details
    immediately comes to mind to make a competitive quote.


    So we estimate a figure. Based on what? We''re not sure, but the question was
    asked and we aim to please. One of two things happens. We get the contract or
    we don''t. And if you''re just throwing around price quotes with no idea of what
    you are bidding on, it''s usually the latter. The producer or media buyer is asking
    a sensible question — doing their best to obtain the finest media for the project
    and keep it within budget, but it is not always an easy task. Unfortunately, leaving
    out the particulars will cost them time, more money, and many more headaches.
    You should take it upon yourself to solve this potential predicament.


