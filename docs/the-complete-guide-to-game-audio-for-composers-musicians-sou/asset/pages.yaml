  md: '# Preparing your Studio for Surround Sound — 39


    # ## 2.3.1 Equipment and Placement


    The first thing you will require is the proper tools for this whole grand application.
    Softwarebased studio set-ups can make use of internal surround encoding and decoding
    script — most of the time as a plug-in to whatever multi-track program you are
    using. For those who don''t have the ability to do it in software or have a tape
    and mixing-console-based system, separate devices are necessary.


    Dolby Labs manufactures specific equipment for this purpose: the Model SEU4 Surround
    Encoding Unit and the Model SDU4 Surround Decoding Unit. While it isn''t necessary
    to use the decoding unit, Dolby recommends that playback be heard through while
    mixing in order to hear any subtle changes the surround may create. The SEU4 Encoder
    receives four input signals (left, right, center, and surround) from the audio
    console and encodes them into two output signals: the Left Total (Lt) and Right
    Total (Rt) signals. These signals are treated as stereo signal used for transmission
    and recording. The SDU4 Decoder decodes this two-channel signal into four outputs
    using Dolby Pro Logic decoding technology. The unit also provides switchable stereo
    and monophonic compatibility. A gated master fader allows all four output channels
    to be varied — supporting variations in listening level while maintaining playback
    balance and calibration.


    Consumer Dolby Surround Pro Logic decoders — as found in various surround and
    the receivers — operate independently to the SDU4 and could be used in a pinch
    or temporarily replacing the professional unit. However, these consumers include
    circuitry to auto balance and correct left and right channel errors and may pose
    a problem when mixing this feature heads the very you might be looking for.


    Dolby Digital 5.1 is also another option which runs congruent to the Pro Logic
    surround arrangement. This technology uses discrete channels of audio and a Low
    Frequency Enhancement (LFE) channel (the .1) for greater separation. While not
    used in gaming the, it will only be a matter of time. The encoding and decoding
    process requires hardware, two channel surround playback, an LFE device, and a
    bass management system. The Dolby DP569 Encoding and DP562 Decoding units are
    appropriate hardware for the application. Bass management systems are manufactured
    by other companies and are available separately. Bass management redirects bass
    frequencies intended for the five main speakers and routes it to the subwoofer
    — recommended because most speakers do not extend to low frequencies. All consumer
    Dolby Digital receivers have bass management and it is highly recommended for
    studios as well.


    A center speaker can be added to your existing pair, but be sure the addition
    matches the acoustic characteristics of the other two for consistency. Or you
    can install three identical nearfield monitors designed for this purpose. It isn''t
    necessary that all speakers are the same size.'
