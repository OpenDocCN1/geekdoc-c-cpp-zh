    # 2.3.2 Studio Set-up


    We all know there are many methods of audio creation as are creators, which supports
    the idea that the studio sets-up of each will also be different. Budget, location,
    and accessibility of equipment dictates that no two sets-up will be alike. Integrating
    surround equipment into them can sometimes prove to be a challenge. New mixing
    consoles provide the luxury of discrete surround channels, designed for this new
    day and age. Older consoles can still perform the task but require a little finesse
    to make it happen.


    On all consoles, left and right outputs are standard, and these will connect to
    the surround encoders left and right channels exclusively. Older consoles can
    utilize the auxiliary sends or another left and right output in order to connect
    the center and surround channels to the mix. Using the auxiliary bus will be most
    limiting when panning a signal, but it will work fine for simple music mixes.
    Using another left and right output source would be the better option if available
    — though not as flexible as a film-style set-up with individual outputs dedicated
    specifically to the four channels.


    Once the issue of console channel outputs has been resolved, these discrete signals
    will be routed to the encoding unit. From there, the encoder Lt and Rt outputs
    can be recorded as a two channel mix. Playback and monitoring is accomplished
    when the two encoded channels are returned to the decoding unit''s Lt and Rt inputs
    and further routed to the surround speaker system as four separate signals.


    Computer-based multi-track recording systems can also produce and record surround
    material with minimal requirements. Starting with digital audio software with
    multi-channel capability, the signals will flow to a multi-channel output soundcard.
    From there, the four channels would move to the encoding unit, to the decoding
    unit, and out to the speakers. For programs that utilize software surround encoding
    and decoding, the output from the multi-channel sound card will go directly to
    the speaker system. Computer-based recording using Dolby Digital technology would
    also require a bass management system to be connected between the sound card and
    speaker set-up.'
