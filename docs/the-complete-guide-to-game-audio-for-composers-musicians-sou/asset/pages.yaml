  md: '# Editing Methods — 235


    notes to describe the sound. Staying organized is essential when dealing with
    a large number of files.


    The sound effect is almost complete. The developer requested the file format of
    22 kHz, 8-bit mono and because we built the file as 44 kHz, 16 bit, we''ll need
    to do a couple things. Using the final version of the file, resample to 22 kHz
    using your editor''s resample function. Using the anti-aliasing filter setting
    is used to prevent any of the high frequencies from becoming low frequency distortion.
    This will keep the sound file as pure as possible. Keep in mind the higher frequency
    ranges are not represented at lower sample rates and the sound will change. One
    recorded brass shell landings on cement for a game project. The best part of the
    sound was the ring they produced which became totally lost when we downsampled
    to 11 kHz. They ended up sounding like pebbles being dropped and were barely usable.
    Listen to the file after downsampling and EQ to boost the sounds are necessary.
    Remember that the higher frequencies will not be available.


    The next step is to convert from 16-bit to 8-bit resolution. Selecting this feature
    on your editor should give choices such as: truncate, root, or dither, which we
    recall from Chapter 8. I could go all day about which one is best for each, but
    I will defer to experimentation ideal. Try each choice and listen to the results.
    You are mainly concerned with the introduction of quantization noise which sounds
    like high-frequency static. In this example, you will notice it when the sound
    loses intensity and fades out. This is one of the reasons why we maximized the
    sound either using normalization or volume increase; it marks this particular
    phenomenon. The noise you hear after the conversion depends on which setting you
    use, of choice. My personal experience dictates I use either the root or dither
    with a value between 0.5–1.0 bits. Dithering adds what is known as Gaussian noise
    which is designed to mask the most obstructive quantization noise.


    The final step for this sound effect is to save it in the required format. I normally
    work in the .wav format and with this, no further action is necessary. If the
    client wanted an .aac, this popular Java format creates its own change to the
    sound and additional EQ may be necessary to compensate for the loss of high frequencies.
    But if you are using .aff or anything else, save the file as a wav, get it one
    last time, and get ready for the next effect.


    # A Complex Sound Design Example


    Building a sound effect using an audio editor is normally a simple affair. It
    gets wildly more complicated when you have to string together or other effects
    in order to compose an involved sound effect as a full audio sequence for a cinematic
    or animation. In our next example, the developer has requested a realistic multi-part
    sound effect of a low-flying aircraft shot down by an angry, rifle-toting farmer.
    The file is to be no more than six seconds in length, delivered as a 44 kHz, 16-bit
    stereo .wav. Let''s put this together using just our 2 channel audio editor of
    choice.'
