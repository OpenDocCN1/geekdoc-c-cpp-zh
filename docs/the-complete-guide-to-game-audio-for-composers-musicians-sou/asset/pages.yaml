    This increase in RAM brings many advantages over the original PlayStation. Higher
    quality audio and longer loops can be stored on the disk and better quality sound
    bank samples and sound effects can be stored directly in RAM. It is now also possible
    to stream continuous music and background ambience at the same time, in stereo
    or surround.


    Direct audio falls into two categories on the PS2: PCM (Pulse Code Modulation)
    and ADPCM. PCM is uncompressed audio (like the .wav or .iff format) for music
    and ambience, voice-overs, and complex sound sources. This format ensures a higher
    quality that uses software-based effects and is easy to implement, programming-wise.
    The down side is its need for high storage on a disk and its limit of only 2 channels.
    ADPCM (Adaptive Delta Code Modulation) is a compressed format used specifically
    for simple sound effects, MIDI triggering, and streaming. This smaller sized file
    doesn''t require much disk space or processing power but is lower in quality.


    If you are an in-house composer or sound designer for a Sony developer, you may
    be able to use the development kit which includes various tools for outside. Outside
    audio contractors will more likely to be required to deliver their music and sounds
    as uncompressed digital audio files like .wav or .iff. Different developers may
    require different formats based on their needs, so be sure to check with your
    project lead to be certain.


    Overall, the PS2 console does not limit the freedom of composing music and designing
    sound effects. The only real limitation is when final conversions are made and
    smaller file sizes are needed, and it won''t change your creation process. The
    exception is if the developer requires a sound bank or instructs you to use one
    they provide. This will limit you to a 2 MB bank of samples and may change your
    way of musical thinking. Instead of delivering music in a PCM format, a mutually
    acceptable sequenced format .mid will suffice. Both methods are workable and you
    can still provide excellent work.


    On a recent PS2 project, I ended up delivering music cues for direct audio use
    as .wav, 2 MB sound bank of my choosing as .wav files, the keys and mapping to
