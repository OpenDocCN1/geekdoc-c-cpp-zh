    paycheck it brings. As an alternative to the chaos of marketing and working where
    the next job is coming from, Jamey finds the comfort and security of working in-house,
    which in turn, allows him to focus solely on his craft. "For me, being an in-house
    composer and sound designer working with a team, I am more focused on the creation
    of the art," says Jamey. His reward is having steady work and doing something
    he loves.'
