    # 3.5 Determining Your Costs


    The final stop before we open our doors is to work out our fees for services rendered.
    However, we can''t do that until we''ve determined what it costs for us to operate.
    It''s an on-going process once you''re working starting out, you need a point
    of reference. Unfortunately, it''s not as simple as finding out what everyone
    is charging and doing the same. Until you''ve been around long enough to demand
    the higher fees, consider what you need to live on and what your business operating
    costs will be and go from there. In a decent profit and you are in business.


    How does music/sound designer consider his operating costs to make a competitive
    bid? It is not as simple as saying, "Hey, I want to make $500 an hour!" Initially,
    decide on your needs for the project, whether it is purely for recognition, a
    resume project, or just to cover the cost of overhead. We then calculate in many
    different factors to cover the expense of creation and consider each of them accordingly.
    For the final numbers, the fees will generally be lumped together. Separate fees
    are developed for cases when this is not feasible.


    # 3.5.1 Types of Fees


    First off, we need to determine what our cost is to do business. In our line of
    work, several billable talents are present, which all have value. Until you resolve
    the actual costs are, you may be losing money without knowing it. This is an important
    step.


    # Creative Fees


    Creative fees are for the actual creation, composing, recording, and arranging
    of the music and sound effects. It is based on the time it takes to create a minute
    of music or a single sound effect and whether not the work will be licensed for
    single use or be bought-out. For most games, the buy-out option is standard, but
    sounds used on websites or in Java applications may be licensed for exclusive
    use for a period of time. The licensing option is often cheaper, the creator retains
    the ownership rights, and the sound can be used again after the contract period
    has expired.


    This is the hardest to uncover and is generally based upon what the market will
    bear. It can be added to your total fee structure or be substituted with your
    hourly wage. As your name grows, you will be able to charge more, your creative
    fee increasing exponentially. If you are John Williams, your creative fees might
    start at $250,000 and move up from there. Johnny Game Composer might be able to
    command $10,000. The value of your stock is entirely dependent on how valuable
    or in demand you are for a game project. If they "gotta have", you are willing
    to pay more for the privilege.'
