    # 6.4 Change Orders and Reworks


    A change order happens when a developer realizes the creative route they are taking
    is wrong and makes the decision to try another direction instead. These moments
    happen in every business, around the world, but the first time it happens to you,
    it will literally crush you. How would you feel spending a couple of months living
    and breathing a project, composing a magnificent score, putting your heart and
    soul into it, days away from recording it with a full orchestra, and then having
    a producer tell you you''ve decided on a techno chord instead? Or how actually
    completing a sound effects project and getting the word at the last minute they
    need to be redone for a different "period in time"? Your first instinct will be
    to pull your hands in the air. Your second thought will be: how are these contingencies
    covered in the contract?'
