    # 10.1 Maintaining Consistency in Production with Audio Elements


    Fitting together audio elements like puzzle pieces is just one of the many tricks
    to effectively master game sound. Maintaining consistency is another audio content
    provider must apply. Audio requires the same character; that is, the element which
    cements it to, and only this, particular game experience. Having an effect distract
    the player during gameplay because it sounds out of place or it''s from an afterthought
    breaks the magic. Even one, innocent, little sound thrown in the game as an afterthought
    has the ability to screw up an entire production.


    The easiest way for a developer to ensure consistency is to use the same composer,
    the same sound designer and the same voice actors for every aspect of the game.
    This will provide the same basic flavor by using the same recipe ingredients,
    providing overall uniformity. Each artist has their style and equipment which
    contribute to their ''sound'' and by utilizing the same providers, this will keep
    a game''s audio sounding cohesive.


