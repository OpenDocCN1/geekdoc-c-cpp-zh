    Game composers Brian Tueo and Lee Sartwell of Thunder Sounds constantly push their
    envelopes and have some function in the process. They will opt for an approach
    previously undiscovered and what happens. This has helped their creativity tremendously
    by exploring avenues they hadn''t previously considered. Try composing "Egyptian
    surf music" or "Heavy Metal Monk Chants" — It''s not as far off as you think.
    Developers often have some crazy ideas and your creativity will be appreciated
    and rewarded.


    Writing for games is not writing for your own album release. You will not have
    the luxury of time — composing and recording only when the "mood" strikes you.
    Like any other paced adventure such as writing for commercials, weekly TV shows,
    and film, you must be able to turn your creativity on like a faucet. It must be
    an immediate reaction, ready to go at a moment''s notice. If you wait for the
    elusive muse to show, the rapidly approaching deadline will come in and you''ll
    be looking foolish. You do not want to be the one person whose project is waiting
