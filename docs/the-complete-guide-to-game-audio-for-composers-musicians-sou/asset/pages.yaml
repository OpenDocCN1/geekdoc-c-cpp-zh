    # 8.5 Compositional Methods


    Composing and recording music today is a blend of traditional methods using tape
    recorders and what some consider “old fashioned” studio recording techniques and
    new, highly-special and integrated audio production systems. The good news is
    you really don’t need to buy all of the latest and greatest software to make impressive
    music. The bad news is you will need it if you plan to get it into the computer
    and in a format the developer can use. The good news is if you already have the
    latest and greatest, you don’t need the old, traditional ways. The bad news is
    you’d better learn those complicated programs inside and out if you expect to
    be able to use them to their potential.


    Music is, no matter how it is composed or recorded. As long as the final output
    is of professional quality in both composition and how it sounds, your audio product
    will stand alone other authors in the industry. The key is to develop a process
    you are comfortable with and that allows maximum output with minimum effort. Never
    work harder than you have to. You’ll get plenty of sleepless nights – nights where
    next cues come to you at 3:00 AM when you’re far away from your studio. There
    will be plenty of aggravation that us creative types are familiar with, so why
    make the process more difficult than it already is?


    Get your system organized, stay focused, and be ready to turn on that creativity
    with the flip of a switch. Don’t think about that looming deadline, concentrate
    on the music, and it will literally happen by itself.'
