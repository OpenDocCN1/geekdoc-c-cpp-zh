    The main processor for audio data is the Xbox Media Communications Processor (MCP)
    which contains four independent audio processors; the set-up engine, Voice Processor
    (VP), Global Processor (GP), and Encode Processor (EP). Audio data flows from
    the set-up engine to the VP, to the GP, and finally the EP to the outside world
    that will give you analog or digital outputs in stereo or 3D positional audio.


    The set-up engine''s main function is the set-up of data transfer for multiple
    output streams and to expand 16-bit data to the Xbox format. By doing this hardware,
    it relieves the gamers of having to deal with various software issues to achieve
    the Xbox format. The set-up engine will also accomplish parameter ranging and
    other housekeeping functions needed.


    The Xbox Voice Processor (VP) is a hard-coded, fixed DSP. It has a 256 voice synhesizer
    running at 48 kHz, either mono or stereo, and all running concurrently. Of those
    256, can can be 3D for surround applications. A single band of EQ, essentially
    a filter block, is available for specific obstruction/occlusion effects, such
    as being heard from another room through a wall. A hardware submixer also lies
    on the VP allowing any of the 256 voices to be grouped into different sub mixes
    and rerouted back to make further use of different filters and EQ settings a second
    time. The 256 uses the DLS 2 (DownLoadable Sound) and allows for an incredible
    array of possible game sounds and instrumentation.


    > Global Processor (GP) is a fully programmable DSP designed specifically for
