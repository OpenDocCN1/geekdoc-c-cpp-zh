  md: '# 50 CHAPTER 3: Getting Organized, and Ready for Business


    I’m inspired by certain composers, I never try to copy them. I prefer to ask myself,
    ‘Now how would I have scored that?’


    One that motivates me a lot when I''m writing is that I''m always looking for
    ways to stray from the diatonic of a piece. If I''m writing melodic, the first
    few bars will establish the tonal then I will instantly shift. I rarely write
    constant, diatonic music for underscore. With themes, I have stayed diatonic for
    sections, but I usually stray in B sections or what you have. This is just one
    of those aspects that establishes me as a stylistic writer rather than a chameleon
    player.


    When I score to animation, I never score to storyboards. I''ll look at them to
    see what''s coming the pike, but when I sit down to do it, the movie has to be
    complete. I hate scoring to the beat of the scene editing and then having it changed
    after I''ve already done the music. If that happens, I have to start from scratch
    so the work is finished. When I score, I don''t just lay a beat; reinforce the
    ending and the dramatization. One of the scenes I did this morning, some guys
    climbing down a rope, metal mysterious. I started with some high violins, a subtle
    tremolo viola, and then as they get closer to the ground, the bass starts to fill
    up. I bring in the bassoons and French horns as they reach the bottom — that kind
    of dramatic pacing. As the camera pulls back, you see that they were watched the
    whole time. The volume slowly intensifies, then suddenly drops out. This is how
    I pace a scene and dictate the emotional impact with music. It''s important to
    know what types of musical devices evoke certain emotions like fear, mystery,
    gloom, and then be able to incorporate those devices into your composition. Obviously,
    a lot of people don''t do that. A lot of ‘composers’ can get away with laying
    down a two minute string chord and that suffices for all of the emotions there.
    However, I like to take on a lot more responsibility and really dig into scenes
    and make an impact rather than just get it.


    The more I write, the more dynamic I become. The stuff I''m doing now is more
    effective, I think, than before. I''m definitely on a journey.”


