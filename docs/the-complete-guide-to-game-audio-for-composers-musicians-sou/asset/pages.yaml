    # 1. What is the general theme of the game?


    Music and sound effects can make or break the immersive game is designed to have.
    The most important question you can ask is “What is the theme of the game?” in
    order to have the style of audio accurate for the genre. Examples of themes are:
    space, medieval, sports, racing, children’s, religious, horror — all of which
    conjure specific images and sounds. Even if the developer wants to attempt a new
    approach with the game, there will still need to basic elements of the game to
    provide that familiarity for the players. If a game company tried to produce a
