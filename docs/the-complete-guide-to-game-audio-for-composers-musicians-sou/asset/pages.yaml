  md: '# Getting to Work — 301


    and as the primary instruments I started with those, a bass sound, a synthesizer,
    a pad, and perussions. After spending hours sifting through sample and keyboard
    libraries, I narrowed the choices to 10 patches and 2–3 possibilities for each
    drum sound. I initially started with 7–8 note samples of each instrument — enough
    to cover most of the keyboard range — with the fear of discarding options I didn''t
    use. I didn''t want to limit myself and give plenty of options if I decided to
    play an instrument higher or lower than its normal range. I chose drum and percussion
    sounds that would blend well with the musical style and the other instruments.
    At the end of this process, I felt confident there were plenty of sounds to work
    with and began the next step.


    With only 2 MB of space available for the sound bank, I had to make tough decisions
    early on that would affect the musical output. Composers do not work well within
    tiny restraints and I was attempting to make it painless as possible. How long
    should the percussion sounds ring? The idea was to make the sounds as short as
    possible using loop points, but long enough so the instrument didn''t fade too
    quickly. I chose to work with each sample and estimate the music needs, making
    each sample slightly longer than I would probably. After composing, I planned
    to come back and re-edit the samples to save and figured easiest to shorten them
    later rather than to make them longer


    Each sample was imported into an audio editing program, in this case Sound Forge.
    One by one, I adjusted each sample to maximize the file. Files from the same instrument
    were sized similarly and all were saved as .wav files. These files were then imported
    into a dedicated sampler, which is a piece of musical equipment that allows playback
    as notes triggered by a keyboard or other MIDI device.


    Inside the sampler, each individual sample was assigned an instrument patch and
    a range of notes to be played over (technical terms such as grouping and key mapping
    describe this process more accurately). MIDI channels are assigned to each instrument
    group, organizing separate patches for easy sequencing and manipulation. Much
    time is spent testing the sounds to ensure there are no dead spots and that all
    of the notes blend together naturally. Simple adjustments and tweaks were made
    to make the digital files sound. Everything is set, the key groups are uploaded
    back to the computer, burned to CDR, and tested final time in the sampler. Sample
    selection, editing, and the loading process ended up taking the better part of
    the day and, after two days, a note has yet to be composed. We''ll remedy shortly.


    A lesson developers learn from this is that, technically, a lot of work has been
    accomplished before actual creation can begin. In this case, we were creating
    a sound bank for a Playstation 2 game, but similar processes are involved for
    “standard” music creation as well. The composer must choose, from their array
    of sounds, ones that fit together and belong in a specific game. They must set
    up keyboard rigs, samplers, and other instruments. Some composers will try to
    leave their studio set ups plugged in and ready to go, but because different types
    of music require different processes, preparation time is always a necessity.'
