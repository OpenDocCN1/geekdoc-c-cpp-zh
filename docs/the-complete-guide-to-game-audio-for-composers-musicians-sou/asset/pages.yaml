  md: '# 18 CHAPTER 2: Essential Skill Sets and Tools


    Recently, I had a project with a new game company requiring me to add sound effects
    to their animation files. The game was still in development and they were trying
    to do an audio personality to theirs and have something to show their investors
    at the same time. Unfortunately, the software they were using was completely new
    and the learning curve was steeper than normal for me. What would have been a
    two or three day sound design project, became a five day undertaking they also
    required me to add sounds to the animations myself. After day two, I called the
    company who developed this “tool” directly and discovered I could not lay sounds
    on various tracks as I advertised, but had to do a composite on a single track.
    No problem, there was no reference for me to synchronize to and a stopwatch was
    unreliable when the animations bogged down or skipped frames. A trusty calibrator
    and a lot of trial-and-error finally did the trick, but after a couple added days
    to the production cycle and much grumbling. A new program, with all the bugs fixed
    and no one who had any experience with it, brought a normally speedy sound design
    process down to gridlock. A great lesson when introducing something new into your
    process. Beware.


    Familiarity with your equipment will make your job easier and I cannot stress
    its importance enough. Consider audio engineering courses at your local college,
    volunteering yourself and studio to record demos for local bands, remixing your
    old tones — all in the name of keeping your eyes open and staying on top of yours.
    A skill without practice becomes a hindrance. Suddenly, I''m a philosopher.


    # Producer Skills


    As the proverbial one-man band, you are also acting as producer. When producing
    other band projects, it''s easier to remain objective when you are not emotionally
    attached to the music as a musician would be. In this case, you have the luxury
    of focusing on the overall picture, keeping it on track, motivating and evoking
    performances from the musicians, and sheltering them from any outside influences
    which might disrupt your creativity. It is a job in itself.


    When producing your own music, the line becomes blurred and may not always be
    the best situation unless you take a step back and maintain your objectivity.
    This is almost an acquired skill — obtained slowly and painfully through years
    of experience — but it is some thing you should strive for in your quest.


    You cannot fall in love with your music. Because this is a “work for hire”, you
    have been commissioned to write a score which will enhance the overall game project
    and that will always be your first priority. You are creating for the project,
    not for yourself. If a producer takes you out a passage of the music that happens
    to be your favorite, you must be able to detach yourself and make the change.
    Remember, none of this is personal, although you might be inclined to feel that
    way. It is strictly business and demands objectivity from everyone involved.


    Another producer function which must be considered is the knowledge of how the
    music and/or sound effects will interact with the soundscape. During the development
    process, there are particular questions to ask, designed to gain an overall understanding
    of sonic activities are'
