  md: '# Editing Methods — 239


    Again, beside sounds together, start with a picture in your mind of how the scene
    will play out. This time, though, we will be adding additional sounds plus an
    ambient track of the cow pasture so the overall soundscape will be a bit more
    dense. Pay close attention to what sounds are “action” sounds and which ones are
    purely “window dressing” to add additional realism. This much layering can get
    busy and work against us we keep a close eye.


    ![](img/34a845a3c9f2c249ab60e8ba2e1b7e3b_251_0.png)


    **Figure 9.** Sonic Foundry’s Vegas Pro allows for non-destructive, complex audio
    editing which guarantees your sound to another level.


    A good rule of thumb is to keep background sounds in the rear and those sounds
    which tell the story in front.


    Resist the urge to move cows and chirping birds hog your scene. Use these sparsely,
    as a chef does with seasonings.

    On your multi-track program of choice, open a new window with at least 10 available
    tracks. It is possible to create the sequence in one track, cross-fading and mixing,
    but since you pay extra for the convenience of multiple tracks, we’ll put one
    sound on each track and use its full potential. If the number of tracks become
    an issue for you because of hardware resources, it is possible to place multiple
    sounds on each track. By placing non-overlapping sounds on the same track, it
    is still possible to adjust individual volumes, durations, and fades while cutting
    down the number of tracks your processor has to deal with. Any effects processing
    or EQ in a track, though, will effect every other sound as well. For our purposes,
    we will assume one sound on one track and all processing will be done separately.


    Track number one will start out with six seconds of cow ambience. If you have
    a longer piece, shorten it to fit or mute the track after the second second end
    mark. How you do this depends on the features of your program; some will even
    allow you to size a file by moving either end to fit. If your ambient file is
    only three seconds, consider simply repeating it twice or over'
