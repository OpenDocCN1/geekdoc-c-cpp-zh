    # 9.3.2 Using Multi-Track Software for Sound Design


    The day I discovered the use of multi-track software for sound design was a professional
    rebirth for me. I remember where I was, who the sound designer was, and the color
    of the massive track struck me thick. Ah, the years of headaches I could have
    prevented! If you plan on making sound design a part of your audio production
    services, I implore you to acquire a good multi-track audio program. Your creative
    life will become infinitely easier with this powerful tool at your disposal. If
    this is the first time you''ve been introduced to this concept, I guarantee you
    are five years ahead of I was.


    A good multi-track program, however, cannot stand on its own. Your audio editing
    software is still required for final sound editing so don''t make the mistake
    of buying a multitrack program. If you have to make a choice, buy the audio editor
    first and make upgrades later.


    You''ll discover the extreme joy of creating sound effects in multi-track. If
    you tried the previous complex sound design example on your standard audio editor,
    you will immediately realize the simplicity and flexibility you have doing it
    this new way. Imagine having the ability to add effects and EQ, and control panning
    and volume in real-time to each individual track, then instantly hear the results.
    You won''t have to save every step nor suffer through numerous undos and redos
    as you mold a sound. It will be great.


    Let''s take the farmer by example and create it here again as a comparison. The
    parameters remain the same: no more than six seconds in length, as a 44 kHz, 16-bit
    stereo .wav file. Gathering individual sounds will be performed and created the
    same way using the audio editor. Nothing changes here except there isn''t any
    need to cut length or add effects processing to prepare for the mix process. Collect
    your sounds: cow pasture ambiance, an airplane flyby, a mumbling farmer voice,
    a rifle loading sound, a single gunshot, sputtering engine, a “mayday” transmission,
    a short explosion, a scream, and a small crash with metal fallout—let’s use them
    all. We can mix this longer list of sounds without ever batting an eye.'
