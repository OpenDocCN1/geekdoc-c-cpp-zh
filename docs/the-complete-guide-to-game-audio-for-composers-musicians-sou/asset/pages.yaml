    a little about what each other member is doing and how it will all fit together
    in the final product. The way to do this is to be present at all the meetings
    and discussion groups along the way. As a working off-site, this may prevent more
    of a problem if there are miles separating you. Teleconferences are a great alternative
    or, better yet, have a speaker phone available at a meeting you to participate.
    If that isn''t possible, someone attend the meetings who will fill you in a timely
    manner. This will save a lot of and make sure you are in the loop and get information
