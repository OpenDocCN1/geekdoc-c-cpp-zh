  md: '# 3.4.1 Putting Your Demo Together; The First Step


    The highest priority when considering your demo is quality. Without doubt, the
    first thing a producer will notice is that it sounds. Cut corners where you have
    to. Trim the fancy label-ing, packaging, and the full-color brochures, but never,
    ever, skip when it comes to the caliber of your sound. Use high-grade instrumentation,
    studio equipment, and recording medium. Think quality all the way down the line.
    Do what you have; just make your audio sound great. Remember, if it doesn''t sound
    "professional" in a demo that you''ve had months to work on, how will they believe
    that you''ll sound good when dealing with a rush, two-week project deadline?


    Your mix should contain that quality on a variety of playback systems. There is
    no way of telling what your demo will be listened to. If you are extremely lucky,
    your audio department will play it on studio equipment similar to yours, to the
    majority of the time, it will be listened to either in the car or on a PC. If
    you have ensured, through a careful mix-down process, then you''ve covered all
    of the bases. Before I music sounds equally good on your studio monitors as it
    does on your Walk-man, I will completely satisfied with a final mix, I will critically
    listen in my car, on my home stereo, and on my Walkman, and on my child''s boom
    box. It passes the test only after then.


    # 3.4.2 Demo Content


    There are very few rules I actually subscribe to, but this is one:


    > Put your best work in the first two minutes. Always.


    Media buyers are busy people and usually wade through piles and piles of demo
    reels. Chances are they won''t have the time to listen past the first couple of
    tracks. Always lead with your strongest piece and style. A great song that takes
    too long to get to the point has no place here. Feature your personal flavor.
    Show your originality, versatility, and compositional and design skills.


    Ensure each track has impact and gives a continued impression. If you lead with
    shorter pieces, be sure to include longer tracks to show consistency and let them
    know you can hold a listener''s attention throughout. If one style is your specialty,
    that is certainly OK, but keep in mind that it may limit your limits. Show plenty
    of versatility on your reel.


    Here is some advice gleaned through "peer eyes" producers have willingly shared:


    +   1. Do not repeat work to make your reel longer.


    +   2. Do not place work in chronological order from the beginning of your efforts.
    They urge you to get to the point and show what you can do with little wasted
    time.


    # 3.4.3 How Long is Yours?


    Did you know that 40% of media buyers spend between two and five minutes listening
    to a demo? Another 40% only spend to 10 minutes. The average preferred length
    of a reel is only'
