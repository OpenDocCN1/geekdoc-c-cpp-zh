    An assault of unorganized audio is nothing but noise — pure and simple. With an
    onslaught of narratives, music, and sound effects, a game can quickly become a
    chaotic nightmare, forcing the player to run away screaming or to simply turn
    off the racket with a flip of a switch, neither of which are good for the games
    business. The development team has the difficult task of finding the perfect balance,
    relying entirely by accident; other after months of planning and perfecting. I''ve
    heard people say they would take luck over skill any day, but in the billion dollar
    games industry, success rides squarely on abilities, not chance.


    How many times have you walked into an arcade and been blasted by sound the door
    opened? Same for the trade show scene where each booth has a noise-making machine
    determined to attract attention. That is what a really bad game is, kind of mess
    where so much is happening at once, you have no idea of what''s going on. And,
    believe it or not, there are games where sound overpowers the experience instead
    of enhancing it. Some games attempt to combat this lack of foresight by giving
    the player the “power” to adjust all of the audio elements, making them responsible
    for their own experience. If it doesn''t work, the blame can be placed on the
    consumer, not the developer. Of course, there are some advantages to this feature,
    but the point is: we can make a difference and can affect the effect of the soundscape
    ourselves. By simplifying the game experience and making the sound elements ahead
    of time, the player can spend their time playing and enjoying a game instead of
    adjusting parameters.


    Can music, sound effects, and narratives exist simultaneously in the soundscape
    without negatively impacting the game experience? Yes, they can, but a certain
    amount of care needs to be taken to ensure they do. When working on a new piece,
    a composer''s initial mindset should be to create music able to stand on its own.
