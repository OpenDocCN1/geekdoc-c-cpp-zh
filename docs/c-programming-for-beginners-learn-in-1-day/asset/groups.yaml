    # Summary


    +   - The Array List collection is used to store a group of elements. The advantage
    of the Array list collection is that it is dynamic in nature. You can add and
    remove elements on the fly to the array list collection.

    +   - A Stack is based on the last in first out concept. The operation of adding
    an element to the stack is called the push operation. The operation of removing
    an element to the stack is called the pop operation.

    +   - A Queue is based on the first in first out concept. The operation of adding
    an element to the queue is called the enqueue operation. The operation of removing
    an element to the queue is called the dequeue operation.

    +   - A Hashtable is used to store elements which comprises of key values pairs.
    To access the value of an element , you need to know the key of the element.'
