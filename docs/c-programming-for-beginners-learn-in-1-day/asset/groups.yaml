    \     }\n    }\n}\n```\n\n### Code Explanation\n\n- 1. 我们首先添加一个与类同名的新方法。因为它与类同名，所以\
    \ C# 将其视为构造函数方法。因此，现在每当调用方法创建此类的对象时，此方法将默认被调用。\n"
