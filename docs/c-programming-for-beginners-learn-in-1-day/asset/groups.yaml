    \n从输出中，您可以清楚地看到字符串“.Net”是由 GetTutorial 方法返回的。\n\n## Access Modifiers\n\n访问修饰符用于定义类属性或方法的可见性。有时您可能不希望其他程序看到类的属性或方法。在这种情况下，C#\
    \ 提供了在类属性和方法上放置修饰符的能力。类修饰符能够限制访问，以使其他程序无法看到类的属性或方法。\n\n通常有 3 种类型的访问修饰符。它们在下面进行解释。\n\
    \n- 1. **Private** – 当此访问修饰符附加到属性或方法时，表示这些成员无法从任何外部程序访问。\n  \n  让我们举一个例子，看看使用\
