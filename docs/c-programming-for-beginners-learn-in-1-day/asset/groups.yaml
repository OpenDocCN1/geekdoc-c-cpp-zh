    Now let’s switchover to our Program.cs file. You will notice that there is a red
    squiggly line under the SetTutorial method.


    Since we have now declared the SetTutorial method as private in our Tutorial class,
    Visual Studio has detected this. It has told the user by highlighting it that
    now this method will not work from the Program.cs file.'
