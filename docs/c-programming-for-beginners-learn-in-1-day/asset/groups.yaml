    \ functionality to the listbox event.\n\n```\n```csharp\nprivate void lstCity_SelectedIndexChanged(object\
    \ sender, EventArgs e)\n{\n    string text = lstCity.GetItemText(lstCity.SelectedItem);\n\
    \    MessageBox.Show(text);\n}\n```\n```"
