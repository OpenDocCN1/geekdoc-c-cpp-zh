    \ button on a form. In Windows forms , you can add code which can be used to perform\
    \ certain actions when a button is pressed on the form.\n\nNormally when a button\
    \ is pressed on a form, it means that some processing should take place.\n\nLet's\
    \ take a look at one of the event and how it can be handled before we go onto\
    \ the button event scenario.\n\nThe below example will showcase an event for the\
    \ Listbox control. So whenever an item is selected in the listbox control, a message\
    \ box should pop up which shows the item selected. Let's perform the following\
    \ steps to achieve this.\n\n**Step 1)** Double click on the Listbox in the form\
    \ designer. By doing this, Visual Studio will automatically open up the code file\
    \ for the form. And it will automatically add an event method to the code. This\
    \ event method will be triggered, whenever any item in the listbox is selected.\n\
    \n```\n```csharp\nprivate void lstCity_SelectedIndexChanged(object sender, EventArgs\
    \ e)\n{\n}\n```\n```\n\nAbove is the snippet of code which is automatically added\
