    # What are classes and objects


    Let’s first begin with classes.


    As we discussed earlier classes are an encapsulation of **data properties** and
    **data methods**.


    +   - The properties are used to describe the data the class will be holding.

    +   - The methods tells what are the operations that can be performed on the data.


    To get a better understanding of class and objects, let’s look at an example below
    of how a class would look like.


