    \ **数据属性** 和 **数据方法** 的封装。\n\n- 属性用于描述类将保存的数据。\n- 方法说明可以在数据上执行哪些操作。\n\n为了更好地理解类和对象，让我们看一下下面一个类的示例。\n\
    \n类的名称是 “Tutorial”。该类具有以下属性\n\n- 1. **Tutorial ID** – 这将用于存储一个唯一数字，该数字代表教程。\n\
    - 2. **Tutorial Name** – 这将用于将教程名称存储为字符串。\n\n类还包含方法。我们的类具有以下方法，\n\n- 1. **SetTutorial**\
    \ – 此方法将用于设置教程的 ID 和名称。例如，如果我们想为 .Net 创建一个教程，我们可能会为此创建一个对象。该对象的 ID 设为 1。其次，我们将把\
